.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 06: hero (timeline storyboard), Nine months of nutrition (timeline stepper, needs bar, plate check, fridge sort),
   Myth or fact? (claim cards, fortification chart), Plan a prenatal day task. Role colours from hfa4u.css: folate, iron,
   vitamin D and calcium --nu-micro (violet); DHA --nu-fat (teal); fluids --nu-water (blue); Food Guide plate --leaf,
   --plate-grain, --nu-protein. Trimester bands --hi-soft. Red and green stay reserved for feedback. */
/* radio groups (from HFA4U 03) */
.pl-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.pl-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.pl-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.pl-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pl-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.pl-chipset button:hover{border-color:var(--pen)}
.pl-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.pl-chipset button.pl-f-micro{box-shadow:inset 4px 0 0 var(--nu-micro)}
.pl-chipset button.pl-f-fat{box-shadow:inset 4px 0 0 var(--nu-fat)}
.pl-chipset button.pl-f-water{box-shadow:inset 4px 0 0 var(--nu-water)}
.pl-chipset button.pl-f-ink{box-shadow:inset 4px 0 0 var(--ink-2)}
.pl-ico{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:0 0 auto}

/* hero */
.pl-hero{width:100%}
.pl-hsvg{display:block;width:100%;height:auto}
.pl-hband{fill:var(--hi-soft)}
.pl-hbf{fill:var(--nu-water-soft)}
.pl-hsep{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 4}
.pl-haxis{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.pl-hblood{fill:var(--nu-micro-soft);stroke:var(--nu-micro);stroke-width:1.5}
.pl-hnt{stroke:var(--nu-micro);stroke-width:2.5}
.pl-hntd{fill:var(--hi);stroke:var(--ink);stroke-width:1.5}
.pl-hl{fill:var(--ink);font:700 14px var(--font-ui)}
.pl-hs{fill:var(--ink-2);font:400 13.5px var(--font-ui)}
.pl-hico path,.pl-hico circle{stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.pl-hico.micro path,.pl-hico.micro circle{fill:var(--nu-micro-soft);stroke:var(--nu-micro)}
.pl-hico.fat path,.pl-hico.fat circle{fill:var(--nu-fat-soft);stroke:var(--nu-fat)}
.pl-hico.water path{fill:var(--nu-water-soft);stroke:var(--nu-water)}
.pl-hico.micro path + path{fill:none}
.pl-cap{font-size:1.05rem!important}

/* Explore layout */
.pl-lab{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.pl-main,.pl-side{min-width:0}
.pl-side{border-left:1.5px solid var(--rule);padding-left:18px}
.pl-h4{margin:0 0 6px;font-size:1rem}
.pl-h5{margin:16px 0 6px;font-size:.95rem}
.pl-pdesc{margin:-4px 0 8px;color:var(--ink-2)}

/* timeline stepper (F6) */
.pl-tl{margin:4px 0 8px}
.pl-bands{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin:0 0 4px}
.pl-band{font-size:.78rem;font-weight:700;color:var(--ink-2);text-align:center;padding:2px 0;border-radius:4px}
.pl-band.tri{background:var(--hi-soft);color:var(--ink)}
.pl-tl .pl-rgw{margin:0}
.pl-tl .pl-rg{width:100%}
.pl-stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.pl-stages button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 4px;min-height:58px;font-size:.84rem;line-height:1.2;text-align:center;min-width:0;overflow-wrap:anywhere}
.pl-stages button:hover{border-color:var(--pen)}
.pl-stages button[aria-checked="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
.pl-sn{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border-radius:50%;border:1.5px solid currentColor;font-size:.78rem;font-weight:700}
.pl-sf{display:none}
.pl-ntm{position:absolute;top:-6px;right:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--nu-micro);background:var(--sheet);opacity:0;transition:opacity .3s}
.nt .pl-ntm{opacity:1;background:var(--nu-micro)}
.pl-track{position:relative;height:12px;margin:2px 0 0;border-bottom:3px solid var(--ink)}
.pl-head{position:absolute;bottom:-1px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:11px solid var(--ink);transform:translateX(-50%)}

/* needs bar */
.pl-needs{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 14px;margin:4px 0 10px}
.pl-nbh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 8px}
.pl-bar{display:grid;grid-template-columns:minmax(7rem,12rem) minmax(0,1fr) 5.6rem;align-items:center;gap:8px;margin:0 0 6px;font-size:.9rem}
.pl-bl{color:var(--ink-2);line-height:1.2}
.pl-bar.now .pl-bl{color:var(--ink);font-weight:700}
.pl-bt{position:relative;height:20px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.pl-bt i{position:absolute;left:0;top:2px;bottom:2px;border-radius:3px}
.pl-bt i.base{background:repeating-linear-gradient(135deg,var(--rule) 0 5px,transparent 5px 9px);border:1.5px solid var(--ink-2)}
.pl-bv{font-weight:700;font-variant-numeric:tabular-nums}
.pl-chg{margin:6px 0 0;font-weight:700;padding:3px 6px;border-radius:4px}
.pl-none p{margin:0 0 4px}
.pl-lit{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi);border-radius:4px}
.pl-mile{margin:0 0 6px;padding:6px 8px;border-left:4px solid var(--nu-micro);background:var(--sheet);border-radius:4px}

/* plate check (F1) */
.pl-ph{margin:2px 0 2px}
.pl-teen{border-left:3px solid var(--nu-micro);padding-left:8px}
.pl-pin{background:var(--sheet);padding:6px 0 4px;z-index:3}
.pl-abars{display:grid;gap:5px}
.pl-abar{display:grid;grid-template-columns:minmax(4.8rem,6.5rem) minmax(0,1fr) 8.6rem;align-items:center;gap:8px;font-size:.9rem}
.pl-atrack{position:relative;height:18px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.pl-afill{position:absolute;left:0;top:2px;bottom:2px;background:var(--nu-micro);border-radius:3px}
.pl-aref{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--ink)}
.pl-aval{font-variant-numeric:tabular-nums;font-weight:700}
.pl-abar.low .pl-aval{font-weight:400}
.pl-dharow{grid-template-columns:minmax(4.8rem,6.5rem) minmax(0,1fr)}
.pl-dhas{display:inline-flex;align-items:center;gap:6px;font-weight:400}
.pl-dhas i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--nu-fat)}
.pl-dhas.on{font-weight:700}.pl-dhas.on i{background:var(--nu-fat)}
.pl-dhas.half i{background:linear-gradient(90deg,var(--nu-fat) 50%,transparent 50%)}
.pl-akey{margin:2px 0 0}
.pl-vc{margin:6px 0 0;font-weight:700;min-height:0}
.pl-vc:empty{display:none}
.pl-on{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pl-on li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;border-bottom:1px solid var(--rule);padding:4px 0}
.pl-ont{flex:1 1 12rem;min-width:0}
.pl-onb{display:flex;gap:6px}
.pl-heat{flex:1 1 100%;font-size:.9rem;display:flex;align-items:center;gap:6px}
.pl-heat input,.pl-tog input{width:20px;height:20px;accent-color:var(--pen)}
.pl-shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pl-card{display:flex;align-items:flex-start;gap:8px;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet);min-width:0}
.pl-cb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:.92rem;line-height:1.25}
.pl-cv{font-size:.8rem;color:var(--ink-2)}
.pl-tags{display:flex;flex-wrap:wrap;gap:3px}
.pl-tag{display:inline-flex;align-items:center;gap:3px;font-size:.74rem;font-weight:700;border:1px solid var(--ink-2);color:var(--ink-2);border-radius:999px;padding:0 .5em;line-height:1.5}
.pl-tag.av{border:1.5px solid var(--ink);color:var(--ink);background:var(--hi-soft)}
.pl-tag.ht{border:1.5px dashed var(--ink);color:var(--ink)}
.pl-tag.nh{border:1.5px dashed var(--ink-2);color:var(--ink)}
.pl-card .btn{flex:0 0 auto}

/* fridge sort */
.pl-tray{display:flex;flex-wrap:wrap;gap:6px;min-height:40px;padding:8px;border:1.5px dashed var(--ink-2);border-radius:8px;background:var(--paper)}
.pl-fi{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.3em .7em;font-size:.92rem;min-height:36px;text-align:left}
.pl-fi:hover{border-color:var(--pen)}
.pl-fi[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.pl-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px}
.pl-bin{border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);padding:6px;min-width:0;display:flex;flex-direction:column;gap:6px}
.pl-binb{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);padding:6px 8px;min-height:44px;text-align:left}
.pl-binb .pl-ico{width:1.4em;height:1.4em}
.pl-binb.ready{border-color:var(--ink);border-style:dashed}
.pl-binb .tiny{flex:1 1 100%;color:var(--ink-2)}
.pl-binb strong{font-size:.95rem}
.pl-binin{display:flex;flex-direction:column;gap:4px;min-height:30px}
.pl-binin .pl-fi{width:100%}

/* Part 3: claim cards (F13) and fortification chart */
.pl-clt{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.pl-claim{margin:10px 0;padding:14px 18px;border-left:5px solid var(--ink);background:var(--paper);border-radius:6px;font:400 1.25rem/1.35 var(--font-math)}
.pl-claim p{margin:0;max-width:none}
.pl-vds{display:flex;flex-wrap:wrap;gap:8px}
.pl-vd{border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.45em 1.1em;font-weight:700;min-height:44px;min-width:7rem}
.pl-vd:not(:disabled):hover{border-color:var(--pen)}
.pl-vd:disabled{color:var(--ink)}
.pl-vd.on{border-color:var(--ink)}
.pl-vd.right{border-color:var(--green);background:var(--good-bg)}
.pl-vd.wrong{border-color:var(--red);background:var(--bad-bg)}
.pl-vd.right::before{content:"✓ "}.pl-vd.wrong::before{content:"✗ "}
.pl-src{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 4px}
.pl-data p{max-width:none}
.pl-goinq{margin:8px 0 0}
.pl-inq{margin-top:18px;padding-top:14px;border-top:1.5px solid var(--rule)}
.pl-inq h4{margin:0 0 6px}
.pl-ntsvg{display:block;width:100%;max-width:560px;height:auto;margin:4px 0 8px}
.pl-ntax{stroke:var(--ink);stroke-width:1.5}
.pl-ntbar{fill:var(--nu-micro-soft);stroke:var(--nu-micro);stroke-width:1.5}
.pl-ntbar.after{fill:var(--nu-micro)}
.pl-ntline{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.pl-ntlab{fill:var(--ink);font:700 12.5px var(--font-ui)}
.pl-ntyr,.pl-ntyl{fill:var(--ink-2);font:400 12px var(--font-ui)}
.pl-iqp{margin:6px 0}
.pl-iqc{display:flex;flex-wrap:wrap;gap:6px}
.pl-iqc .chip{text-align:left}

/* performance task: Plan a prenatal day */
.pl-tin{margin:10px 0}
.pl-tog{display:flex;align-items:center;gap:8px;font-weight:700;margin:0 0 10px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.pl-full{min-height:1.2em;margin:0 0 4px;font-weight:700}
.pl-lib{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;max-height:420px;overflow-y:auto;padding:2px}
.pl-lc{display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 8px;text-align:left;min-height:40px}
.pl-lc:not(:disabled):hover{border-color:var(--pen)}
.pl-lc:disabled{opacity:.6}
.pl-lct{font-weight:700;flex:1 1 10rem;min-width:0}
.pl-lca{font-size:.8rem;color:var(--ink-2);margin-left:auto}
.pl-tpv{min-width:0}
.pl-day{display:grid;gap:6px}
.pl-slot{border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet)}
.pl-slot.cur{border-color:var(--ink)}
.pl-slh{display:flex;align-items:center;gap:8px}
.pl-mplate{width:46px;height:42px;flex:0 0 auto}
.pl-mprim{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.pl-mp{fill:none;stroke:var(--rule);stroke-width:1.2;stroke-dasharray:3 2}
.pl-mp.vf.on{fill:var(--leaf-soft);stroke:var(--leaf);stroke-dasharray:none}
.pl-mp.wg.on{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-dasharray:none}
.pl-mp.pf.on{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-dasharray:none}
.pl-mcup{fill:var(--nu-water-soft);stroke:var(--nu-water);stroke-width:1.2}
.pl-slc{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:3px}
.pl-slc li{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.9rem}
.pl-slc li > span{min-width:0}
.pl-rm{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;min-width:32px;min-height:30px;font-weight:700}
.pl-rm:hover{border-color:var(--pen)}
.pl-sle{margin:4px 0 0}
.pl-pline{margin:4px 0 0;color:var(--ink-2)}

@media (max-width:820px){
  .pl-lab{grid-template-columns:minmax(0,1fr)}
  .pl-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
}
@media (max-width:560px){
  .pl-bands,.pl-track{display:none}
  .pl-stages{grid-template-columns:minmax(0,1fr);gap:0;border-left:3px solid var(--ink);margin-left:10px;padding-left:10px}
  .pl-stages button{flex-direction:row;justify-content:flex-start;gap:8px;min-height:40px;text-align:left;margin:0 0 4px}
  .pl-sl{display:none}.pl-sf{display:inline}
  .pl-ntm{top:50%;right:8px;transform:translateY(-50%)}
  .pl-bar{grid-template-columns:minmax(0,1fr) 5.2rem;grid-template-areas:"l l" "t v"}
  .pl-bl{grid-area:l}.pl-bt{grid-area:t}.pl-bv{grid-area:v}
  .pl-pin{position:sticky;top:var(--pl-top,0px);box-shadow:0 6px 6px -6px var(--ink-2)}
  .pl-abar{grid-template-columns:4.6rem minmax(0,1fr) 7.4rem;font-size:.85rem;gap:6px}
  .pl-dharow{grid-template-columns:4.6rem minmax(0,1fr)}
  .pl-shelf{grid-template-columns:minmax(0,1fr)}
  .pl-bins{grid-template-columns:minmax(0,1fr)}
  .pl-claim{font-size:1.1rem;padding:10px 12px}
  .pl-vd{min-width:0;flex:1 1 6rem}
}

</style>

=\"pl-hero\">\u003c/div>","caption":""},"aria":"A timeline runs from before pregnancy through trimesters 1, 2 and 3 to breastfeeding. At about 4 weeks a marker reads “neural tube closes”, with “often before a pregnancy is known” beneath it, while a folate icon pulses. An iron icon grows across trimesters 2 and 3 as a blood band thickens, and vitamin D and DHA icons sit above the later trimesters. Last, a breastfeeding band appears with a water-drop icon for fluids.","caption":"Before pregnancy → three trimesters → breastfeeding"},"goals":["I can explain why needs for folate, iron, vitamin D and omega-3 fats change before and during pregnancy.","I can describe how nutrition needs change across the trimesters and while breastfeeding.","I can choose food sources and a prenatal supplement that meet key needs, using Canada’s Food Guide and labels.","I can identify foods and drinks to avoid or handle carefully during pregnancy, and explain why.","I can evaluate pregnancy and breastfeeding products and claims using evidence."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Nutrient roles","goal":1,"prompt":"Which nutrient helps red blood cells carry oxygen around the body?","options":[{"t":"Fibre","why":"Fibre helps digestion; it isn’t absorbed into the blood.","_n":"05e9","_k":"a0de4e91"},{"t":"Calcium","why":"Calcium builds bones and teeth and helps muscles contract.","_n":"15f9","_k":"8e9c4cab"},{"t":"Iron","why":"Iron is part of hemoglobin, which carries oxygen.","_n":"2609","_k":"f29e929c"},{"t":"Vitamin C","why":"Vitamin C helps the body absorb plant iron, but it doesn’t carry oxygen.","_n":"3599","_k":"d54b2e66"}],"hints":["Think of the protein in red blood cells.","Hemoglobin needs one mineral at its centre.","Iron."]},{"id":"w2","skill":"Nutrient roles","goal":1,"prompt":"Folate is a B vitamin. What is it especially needed for?","options":[{"t":"Seeing in dim light","why":"That’s vitamin A. Vitamin A helps night vision.","_n":"45a9","_k":"58586c81"},{"t":"Building bones","why":"That’s calcium and vitamin D. Bones need calcium and vitamin D.","_n":"55b9","_k":"e02c93f3"},{"t":"Making new cells and DNA","why":"Folate is needed whenever cells divide quickly, as in early pregnancy.","_n":"65c9","_k":"8d413132"},{"t":"Blood clotting","why":"That’s vitamin K. Vitamin K helps blood clot.","_n":"7559","_k":"c9e13ece"}],"hints":["When do cells divide fastest?","Folate helps copy DNA.","Making new cells and DNA."]},{"id":"w3","skill":"Canada’s Food Guide and labels","goal":3,"prompt":"Canada’s Food Guide (2019) suggests filling half your plate with…","options":[{"t":"Milk and dairy","why":"The 2019 guide has no separate dairy group; dairy foods are protein foods.","_n":"8569","_k":"615ce0e2"},{"t":"Protein foods","why":"Protein foods fill a quarter.","_n":"933d","_k":"b6a8764b"},{"t":"Whole grain foods","why":"Whole grains fill a quarter.","_n":"a32d","_k":"04a52dda"},{"t":"Vegetables and fruits","why":"Half the plate is vegetables and fruits.","_n":"b31d","_k":"c68c39a9"}],"hints":["Picture the plate.","The biggest section is the most colourful.","Vegetables and fruits."]},{"id":"w4","skill":"Food safety basics","goal":4,"prompt":"Which bacterium can \u003cstrong>grow in the fridge\u003c/strong> and is a special concern with ready-to-eat deli meats?","options":[{"t":"\u003ci>E. coli\u003c/i> O157:H7","why":"It’s mostly linked to undercooked ground beef and unwashed produce.","_n":"c30d","_k":"c2a5f0a6"},{"t":"\u003ci>Clostridium botulinum\u003c/i>","why":"It’s linked to improperly canned foods and, for infants, honey.","_n":"d2fd","_k":"7ab683ec"},{"t":"\u003ci>Listeria monocytogenes\u003c/i>","why":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures.","_n":"e2ed","_k":"0422ca6d"},{"t":"\u003ci>Salmonella\u003c/i>","why":"\u003ci>Salmonella\u003c/i> is mostly linked to raw poultry and eggs, and it grows best at warm temperatures.","_n":"f2dd","_k":"9f0ac584"}],"hints":["Which one is unusual because cold doesn’t stop it?","Its name starts with L.","\u003ci>Listeria\u003c/i>."]},{"id":"w5","skill":"Canada’s Food Guide and labels","goal":3,"prompt":"A cereal’s Nutrition Facts table shows \u003cstrong>iron 30% DV\u003c/strong>. By Health Canada’s quick guide, that’s…","options":[{"t":"Can’t tell without the grams","why":"%DV already does that comparison for you.","_n":"g2cd","_k":"0de7335e"},{"t":"A lot","why":"15% DV or more is a lot.","_n":"h3bd","_k":"3b793890"},{"t":"Exactly the daily need, because 30% is a third of a day","why":"%DV compares one serving with a daily value; it isn’t a full day’s need.","_n":"i3ad","_k":"53370749"},{"t":"A little","why":"5% or less is a little.","_n":"j39d","_k":"bf035366"}],"hints":["Remember 5 and 15.","Is 30 above or below 15?","A lot."]},{"id":"w6","skill":"Food safety basics","goal":4,"prompt":"What does \u003cstrong>pasteurized\u003c/strong> mean on a milk or cheese label?","options":[{"t":"Freeze-dried","why":"Freeze-drying removes water; it isn’t pasteurization.","_n":"k3ad","_k":"ceb9f667"},{"t":"Organic","why":"Organic is about how the food is produced, not about killing microbes.","_n":"l37d","_k":"05e97eca"},{"t":"Raw and unprocessed","why":"That’s the opposite. Raw milk is \u003cstrong>un\u003c/strong>pasteurized.","_n":"m38d","_k":"1db541b4"},{"t":"Heated enough to kill harmful microbes","why":"Pasteurization uses heat to make milk safer.","_n":"n3dd","_k":"fe91965c"}],"hints":["It’s named after Louis Pasteur.","It involves heat.","Heated to kill harmful microbes."]}],"refreshers":{"Nutrient roles":"Iron carries oxygen in hemoglobin; folate helps make DNA and new cells; calcium and vitamin D build bones; DHA is an omega-3 fat that helps build the brain and eyes.","Canada’s Food Guide and labels":"Half the plate is vegetables and fruits, a quarter whole grains, a quarter protein foods. On labels, 5% DV or less is a little and 15% DV or more is a lot.","Food safety basics":"Pasteurized means heated to kill harmful microbes. \u003ci>Listeria\u003c/i> is unusual because it can grow in the fridge."}}},"explore":{"heading":"Nine months of nutrition","intro":"Slide along the timeline. Watch which nutrients matter most at each stage, then check a persona’s day of food.","stages":[{"id":"pre","t":"Before pregnancy","short":"Before","milestone":"Folate and iron stores built now are ready for the very first weeks."},{"id":"w14","t":"Weeks 1–4","short":"Weeks 1–4","tri":1,"milestone":"The neural tube forms and closes."},{"id":"t1","t":"Weeks 5–13 (trimester 1)","short":"Weeks 5–13","tri":1,"milestone":"Major organs are forming."},{"id":"t2","t":"Weeks 14–27 (trimester 2)","short":"Weeks 14–27","tri":2,"milestone":"The baby grows quickly, and the bones begin to harden."},{"id":"t3","t":"Weeks 28–40 (trimester 3)","short":"Weeks 28–40","tri":3,"milestone":"Rapid brain growth; the baby stores iron."},{"id":"bf","t":"Breastfeeding 0–6 months","short":"Breastfeeding","milestone":"The baby grows on breast milk, and making milk raises the parent’s fluid needs."}],"personas":[{"id":"noura","t":"Noura","age":29,"teen":false,"desc":"29 · a family physician’s patient in Hamilton · eats halal"},{"id":"jess","t":"Jess","age":17,"teen":true,"desc":"17 · in Grade 12 · eats a vegan diet"},{"id":"dana","t":"Dana","age":34,"teen":false,"desc":"34 · a nurse in Thunder Bay · breastfeeding twins"}],"nutrients":[{"id":"folate","t":"Folate","col":"micro","unit":"µg DFE a day","kind":"RDA","adult":[400,600,600,600,600,500],"teen":[400,600,600,600,600,500],"why":{"pre":"The neural tube closes in about the first 4 weeks after conception, often before a pregnancy is known.","w14":"The neural tube closes in about the first 4 weeks after conception, often before a pregnancy is known.","preg":"Folate supports rapid cell division.","bf":"Folate passes into breast milk, so the need stays above the usual."},"sources":"Lentils, chickpeas, spinach, asparagus, oranges, fortified grain products"},{"id":"iron","t":"Iron","col":"micro","unit":"mg a day","kind":"RDA","adult":[18,27,27,27,27,9],"teen":[15,27,27,27,27,10],"why":{"pre":"Good iron stores before pregnancy help with what comes next.","preg":"Blood volume rises sharply, and the baby stores iron for the first months of life.","bf":"The need drops below the usual: little iron goes into milk, and periods often haven’t returned yet."},"sources":"Beef, lentils, chickpeas, calcium-set tofu, fortified cereal; pair plant iron with vitamin C (an orange, red pepper)"},{"id":"vitd","t":"Vitamin D","col":"micro","unit":"µg a day","kind":"RDA","iu":40,"adult":[15,15,15,15,15,15],"teen":[15,15,15,15,15,15],"why":{"pre":"Works with calcium to build and keep bones.","preg":"Works with calcium to build the baby’s bones.","bf":"Works with calcium for bones; the need stays the same."},"sources":"Milk, fortified soy beverage, salmon and trout, eggs"},{"id":"calcium","t":"Calcium","col":"micro","unit":"mg a day","kind":"RDA","adult":[1000,1000,1000,1000,1000,1000],"teen":[1300,1300,1300,1300,1300,1300],"why":{"pre":"Calcium builds bones; teens need more (1300 mg) than adults (1000 mg).","preg":"Absorption rises in pregnancy, so the recommended amount doesn’t change. Getting \u003cstrong>enough\u003c/strong> still matters, especially for teens, whose RDA is higher (1300 mg).","bf":"The RDA stays the same while breastfeeding; getting enough still matters."},"sources":"Milk, yogurt, fortified soy beverage, calcium-set tofu, canned salmon with bones"},{"id":"dha","t":"DHA (omega-3)","col":"fat","none":true,"noneText":"no RDA is set for DHA. Health Canada advises at least 150 g of c t","_a":"QABaDgodEA=="},{"id":"sprouts","t":"Raw bean sprouts","_a":"QARCCwwAEA=="},{"id":"ham","t":"Cold deli ham","_a":"QAZbCw5G"},{"id":"cheese","t":"Unpasteurized (raw-milk) soft cheese","_a":"QARCCwwAEA=="},{"id":"eggs","t":"Eggs with runny yolks","_a":"QAZbCw5G"},{"id":"sword","t":"Swordfish steak","_a":"QARCCwwAEA=="},{"id":"salmon","t":"Cooked salmon fillet","_a":"QABaDgodEA=="},{"id":"wine","t":"Wine spritzer","_a":"QARCCwwAEA=="}]},"predictions":[{"id":"p1","prompt":"Timeline at “Before pregnancy”, focus: folate. When does the neural tube close?","options":[{"t":"Around the end of the first trimester","_n":"o3ed","_k":"add2069f"},{"t":"Just before birth","_n":"p3bd","_k":"63f3ca3b"},{"t":"Within about the first 4 weeks after conception","_n":"q3cd","_k":"071aa0d0"},{"t":"In the second trimester","_n":"r31d","_k":"a8d14086"}],"explain":"The neural tube closes by about day 28 after conception, often before a pregnancy is known. That’s why folic acid matters \u003cem>before\u003c/em> pregnancy."},{"id":"p2","prompt":"Focus: iron, Noura (age 29). How does the iron RDA change from before pregnancy to during pregnancy?","options":[{"t":"It triples","_n":"s32d","_k":"9e797d0c"},{"t":"It rises by about half (18 → 27 mg a day)","_n":"tbfd","_k":"ef13cd9f"},{"t":"It stays the same","_n":"ubed","_k":"7d20bdda"},{"t":"It doubles","_n":"vc1d","_k":"cc11a0aa"}],"explain":"Blood volume rises sharply, and the baby stores iron for the first months of life."},{"id":"p3","prompt":"Focus: calcium, Noura. Does the calcium RDA go up during pregnancy?","options":[{"t":"Yes, it doubles","_n":"wc0d","_k":"1d2b411a"},{"t":"No: the body absorbs calcium more efficiently instead","_n":"xbbd","_k":"46bc033f"},{"t":"Only in the first trimester","_n":"ybad","_k":"8ef6a092"},{"t":"Yes, by half","_n":"zbdd","_k":"f7092770"}],"explain":"Absorption rises in pregnancy, so the recommended amount doesn’t change. Getting \u003cstrong>enough\u003c/strong> still matters, especially for teens, whose RDA is higher (1300 mg)."},{"id":"p4","prompt":"Focus: energy, trimester 1. How much extra energy does Health Canada suggest in the first trimester?","options":[{"t":"An extra 1000 Calories","_n":"10bcd","_k":"bc6d1b3a"},{"t":"None","_n":"11b7d","_k":"6c40f858"},{"t":"An extra full meal","_n":"12b6d","_k":"825b6265"},{"t":"Twice the usual","_n":"13b5c","_k":"9b031e62"}],"explain":"Energy needs rise only a little, and only in the second and third trimesters. “Eating for two” is a myth."}],"challenges":[{"id":"tc1","goal":[3,4],"prompt":"Plate check: build Noura’s trimester-1 day so that \u003cstrong>folate and iron both reach 100%\u003c/strong>, with at least \u003cstrong>3 food cards\u003c/strong> (the multivitamin doesn’t count as a food) and \u003cstrong>no avoid items\u003c/strong>.","why":"Nutrient-rich foods plus the multivitamin meet the need, with no risky foods.","msgs":{"persona":"This challenge is Noura’s day. Choose Noura, then build the day in Plate check.","empty":"Open Plate check and add cards to Noura’s day.","multi":"Supplements add to food; they don’t replace it. Add at least 3 foods.","foods":"Add at least 3 food cards. The multivitamin doesn’t count as a food.","pate":"Liver pâté is on the avoid list: \u003ci>Listeria\u003c/i> risk, and very high vitamin A, which can harm the baby.","deli":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures after cooking. Heat deli meats until steaming hot, and use smoked fish only in a cooked dish. Turn on “heated until steaming”, or remove the sandwich.","ironClose":"Close. A fortified cereal or beef stew adds iron. Pair plant iron with an orange or red pepper to help absorb it.","folate":"Folate is at {v}%; it needs to reach 100%. Start with the multivitamin, then add folate-rich foods.","iron":"Iron is at {v}%; it needs to reach 100%. Lentil curry, fortified cereal and beef stew are iron-rich."},"hints":["Start with the multivitamin, then add folate-rich foods.","Lentil curry is high in both folate and iron.","Multivitamin + lentil curry + fortified cereal + orange works."]},{"id":"tc2","goal":4,"prompt":"Fridge sort: put Dana’s 8 items in the right bins.","why":"Heat fixes the \u003ci>Listeria\u003c/i> risk in deli meats and eggs; nothing fixes mercury or alcohol.","msgs":{"ham":"Deli meats can carry \u003ci>Listeria\u003c/i>, which grows in the fridge. Heat until steaming hot.","sword":"Swordfish is high in mercury. Choose low-mercury fish like salmon or trout instead.","wine":"Cooking isn’t the issue: there’s no known safe amount of alcohol in pregnancy.","unplaced":"Put all 8 items in a bin first: {n} still in the fridge.","count":"{k} of 8 items are in the right bins. Ask of each item: is the risk \u003ci>Listeria\u003c/i>, mercury or alcohol?"},"hints":["Ask of each item: is the risk \u003ci>Listeria\u003c/i>, mercury or alcohol?","Heat fixes the \u003ci>Listeria\u003c/i> risk in deli meats and eggs; nothing fixes mercury or alcohol.","Enjoy: pasteurized yogurt, cooked salmon fillet. Cook or heat first: cold deli ham (until steaming hot), eggs with runny yolks (until the yolk is firm). Avoid or limit: raw bean sprouts, unpasteurized (raw-milk) soft cheese, swordfish steak (mercury), wine spritzer (no known safe amount of alcohol)."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Plate check for \u003cstrong>Jess\u003c/strong> (17, vegan, trimester 3): reach 100% for \u003cstrong>folate, iron and calcium\u003c/strong>, include a \u003cstrong>DHA source\u003c/strong>, and use no animal foods. Cards may be added more than once.","why":"Plant foods, fortified foods and an algae-based DHA supplement cover the needs without animal foods.","msgs":{"persona":"This challenge is Jess’s day. Choose Jess, then build the day in Plate check.","empty":"Open Plate check and add cards to Jess’s day.","salmon":"Jess is vegan. An algae-based DHA supplement provides DHA without fish.","calcium":"Teens need more calcium. Add another calcium-set tofu or fortified soy beverage.","animal":"Jess is vegan: remove the animal foods ({list}).","dha":"Add a DHA source. Which cards give DHA without fish?","folate":"Folate is at {v}%; it needs to reach 100%.","iron":"Iron is at {v}%; it needs to reach 100%."},"hints":["Which cards give DHA without fish?","For calcium, use calcium-set tofu and fortified soy beverage, which count for less at Jess’s age.","Tofu × 2 + soy beverage × 2 + lentil curry + fortified cereal + multivitamin + algae DHA + red pepper."]}],"blocks":[{"title":"What the timeline shows","html":"\u003cp>The bars move far more for \u003cstrong>folate\u003c/strong> and \u003cstrong>iron\u003c/strong> than any energy readout would. Good planning means \u003cstrong>nutrient-rich\u003c/strong> choices, a prenatal multivitamin, and care with a short list of risky foods.\u003c/p>\u003cp class=\"tiny muted\">For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}]},"part3":{"slug":"myths","name":"Myths","heading":"Myth or fact?","intro":"Pregnancy attracts a flood of advice and products. Check eight common claims, one at a time: choose \u003cstrong>Myth\u003c/strong>, \u003cstrong>Fact\u003c/strong> or \u003cstrong>It depends\u003c/strong>, then open \u003cstrong>Check it with data\u003c/strong> to see the evidence.","verdicts":[{"id":"myth","t":"Myth"},{"id":"fact","t":"Fact"},{"id":"depends","t":"It depends"}],"claims":[{"id":"c1","t":"“You’re eating for two, so double your portions.”","_a":"QAhNEA1G","core":"Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","src":"Health Canada guidance","data":"Health Canada: no extra energy in trimester 1; a modest increase in trimesters 2–3."},{"id":"c2","t":"“Folic acid only matters once you know you’re pregnant.”","_a":"QAhNEA1G","core":"The neural tube closes in about the first 4 weeks after conception, often before anyone knows. Folic acid has to be on board before then.","src":"Health Canada guidance and a large population study","data":"The neural tube closes by about 4 weeks after conception. Canada’s 1998 fortification of white flour and enriched pasta with folic acid was followed by a large drop in neural tube defects."},{"id":"c3","t":"“Avoid all fish during pregnancy.”","_a":"QAhNEA1G","core":"Fish gives DHA for the baby’s brain and eyes. Choose low-mercury fish, and limit the high-mercury kinds.","src":"Health Canada guidance","data":"Health Canada encourages fish low in mercury for their omega-3 fats, and advises limiting high-mercury fish (fresh or frozen tuna, shark, swordfish, marlin, orange roughy, escolar)."},{"id":"c4","t":"“A glass of wine in the third trimester is fine.”","_a":"QAhNEA1G","core":"There’s no known safe amount of alcohol at any time in pregnancy.","src":"Health Canada guidance","data":"No known safe amount of alcohol in pregnancy; fetal alcohol spectrum disorder (FASD) is preventable."},{"id":"c5","t":"“Herbal ‘pregnancy teas’ are safe because they’re natural.”","_a":"QAFRFAAKVhZA","core":"“Natural” isn’t evidence of safety. Some herbs aren’t recommended in pregnancy; check with a health care provider.","src":"Expert consensus","data":"Some herbs aren’t recommended in pregnancy; ask a health care provider about specific products."},{"id":"c6","t":"“Breastfeeding parents need extra fluids and a little more energy.”","_a":"QANVBxFG","src":"Health Canada guidance","data":"Thirst rises; a little extra food helps meet the demands of milk production."},{"id":"c7","t":"“Pregnant people should keep caffeine to about 300 mg a day.”","_a":"QANVBxFG","src":"Health Canada guidance","data":"Health Canada’s guidance for people who are pregnant, planning to be or breastfeeding: about 300 mg a day, about two small cups of coffee."},{"id":"c8","t":"“Cravings mean your body needs that exact nutrient.”","_a":"QAhNEA1JXwoREVgdRw==","src":"Expert consensus from reviews of studies","data":"Evidence doesn’t support that cravings reliably signal a specific nutrient need. Cravings for non-foods (pica) should be mentioned to a provider."}],"inquiry":{"title":"Check it with data: fortification and neural tube defects","tag":"Model data: illustrative shape; verify the real figures","years":[1993,1994,1995,1996,1997,1998,1999,2000,2001,2002],"rate":[1,1.02,0.97,0.99,0.96,0.84,0.62,0.55,0.54,0.53],"prompt":"What else would you want to rule out before saying fortification \u003cem>caused\u003c/em> the drop?","choices":[{"t":"Whether flour is healthy","fb":"Not quite. That doesn’t explain the drop. Look for something else that changed at the same time and could also lower the rate: a possible confounder.","_n":"14b6c","_k":"56e4bb42"},{"t":"Other changes at the same time (e.g. better prenatal screening)","fb":"Right. Anything else that changed around 1998 and could also lower the rate, such as better prenatal screening, is a possible \u003cstrong>confounder\u003c/strong>. It has to be ruled out before you can say fortification caused the drop.","_n":"15b7c","_k":"0b7cc461"},{"t":"The number of bakeries","fb":"Not quite. That wouldn’t change the defect rate. Look for something else that changed at the same time and could also lower the rate: a possible confounder.","_n":"16b8c","_k":"51080716"},{"t":"The bars’ colours","fb":"Not quite. The colours don’t change the rate. Look for something else that changed at the same time and could also lower the rate: a possible confounder.","_n":"17b9c","_k":"96c5ea82"}]},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>De Wals, P., Tairou, F., Van Allen, M. I., Uh, S.-H., Lowry, R. B., Sibbald, B., Evans, J. A., Van den Hof, M. C., Zimmer, P., Crowley, M., Fernandez, B., Lee, N. S., &amp; Niyonsenga, T. (2007). Reduction in neural-tube defects after folic acid fortification in Canada. \u003ci>New England Journal of Medicine, 357\u003c/i>(2), 135–142.\u003c/li>\u003cli>Health Canada. (2009). \u003ci>Prenatal nutrition guidelines for health professionals\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Dietary reference intakes tables\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Food safety for pregnant women\u003c/i>. Government of Canada.\u003c/li>\u003cli>MRC Vitamin Study Research Group. (1991). Prevention of neural tube defects: Results of the Medical Research Council Vitamin Study. \u003ci>The Lancet, 338\u003c/i>(8760), 131–137.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Myth or fact? quick check","summary":"Myth or fact? quick check","items":[{"id":"q1","goal":1,"prompt":"Why should anyone who could become pregnant take folic acid?","choices":[{"t":"The neural tube closes early, often before pregnancy is known","fb":"Right. Timing is the point: it closes in the first 4 weeks.","_n":"18bac","_k":"f4c4c322"},{"t":"Folic acid speeds up digestion","fb":"Timing is the point: it closes in the first 4 weeks.","_n":"19bbc","_k":"656d0af7"},{"t":"It replaces the need for iron","fb":"Timing is the point: it closes in the first 4 weeks.","_n":"1abcc","_k":"cff7f0d6"},{"t":"It prevents morning sickness","fb":"Timing is the point: it closes in the first 4 weeks.","_n":"1badc","_k":"77f4828b"}]},{"id":"q2","goal":4,"prompt":"Which fish is the better choice in pregnancy?","choices":[{"t":"Trout","fb":"Right. Trout is low in mercury; the others are high.","_n":"1caec","_k":"88163154"},{"t":"Shark","fb":"Trout is low in mercury; the others are high.","_n":"1dbbc","_k":"551b8dde"},{"t":"Marlin","fb":"Trout is low in mercury; the others are high.","_n":"1ebac","_k":"a2ff741c"},{"t":"Swordfish","fb":"Trout is low in mercury; the others are high.","_n":"1fb9c","_k":"f7c5953f"}]},{"id":"q3","goal":5,"prompt":"A “natural” tea claims to “prepare your body for labour”. Best response?","choices":[{"t":"Avoid all tea forever","fb":"“Natural” isn’t evidence of safety or of benefit.","_n":"1gb8c","_k":"f5382eeb"},{"t":"Natural means safe, so drink it","fb":"“Natural” isn’t evidence of safety or of benefit.","_n":"1hbfc","_k":"0dc36656"},{"t":"Check the evidence and ask a health care provider","fb":"Right. “Natural” isn’t evidence of safety or of benefit.","_n":"1ibec","_k":"4f2db5cf"},{"t":"Double the dose for faster results","fb":"“Natural” isn’t evidence of safety or of benefit.","_n":"1jbdc","_k":"8bd98db6"}]},{"id":"q4","goal":4,"prompt":"How much alcohol is safe in pregnancy?","choices":[{"t":"One drink a week","fb":"Health Canada: no known safe amount at any time.","_n":"1kbcc","_k":"654ac560"},{"t":"Any amount after 20 weeks","fb":"Health Canada: no known safe amount at any time.","_n":"1lb3c","_k":"d7b8899f"},{"t":"Only beer","fb":"Health Canada: no known safe amount at any time.","_n":"1mb2c","_k":"63c376b3"},{"t":"No known safe amount","fb":"Right. Health Canada: no known safe amount at any time.","_n":"1nc1c","_k":"a929adb3"}]}]},"blocksAfter":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>Every pregnancy is different. Health care providers, including registered dietitians, give personal advice; this module gives general information.\u003c/p>\u003c/div>"}]},"practice":{"activities":[{"id":"match","type":"match","title":"Nutrient ↔ why it matters in pregnancy","summary":"Nutrient ↔ why it matters","goal":[1,3],"instruction":"Match each nutrient with the reason it matters in pregnancy.","leftTitle":"Nutrient","rightTitle":"Why it matters in pregnancy","left":[{"id":"l1","t":"Folate (folic acid)"},{"id":"l2","t":"Iron"},{"id":"l3","t":"DHA (omega-3)"},{"id":"l4","t":"Vitamin D"},{"id":"l5","t":"Iodine","hints":["Which mineral is added to table salt in Canada?","It’s needed to make thyroid hormones.","Iodine ↔ thyroid hormones for brain development."]},{"id":"l6","t":"Calcium"},{"id":"l7","t":"Vitamin C"},{"id":"l8","t":"Fluids"}],"right":[{"id":"r1","t":"Helps the neural tube form and close in the first weeks"},{"id":"r2","t":"Builds the extra blood and the baby’s iron stores"},{"id":"r3","t":"Helps build the baby’s brain and eyes"},{"id":"r4","t":"Works with calcium to build the baby’s bones"},{"id":"r5","t":"Supports the thyroid hormones needed for brain development"},{"id":"r6","t":"Builds the baby’s skeleton; absorption rises in pregnancy"},{"id":"r7","t":"Helps the body absorb iron from plant foods"},{"id":"r8","t":"Support the higher blood volume, and milk production later"}],"_a":"GUdYVUdeEBdTRxhGCVYQX0AXBkZJRl5WQF8WFlZGHkcOURZeRxYGR05HWFFHXhAXV0cYRglSEF9AFwJGSUZeUkBfFhZSRh5HDl0WXkcWCkcf","wrong":{"l1|r2":"Iron builds blood; folate is about early cell division and the neural tube.","l2|r1":"Iron builds blood; folate is about early cell division and the neural tube.","l3|r6":"DHA is a fat for brain and eyes; calcium builds bone.","l6|r3":"DHA is a fat for brain and eyes; calcium builds bone.","l7|r2":"Vitamin C doesn’t build blood itself; it helps iron get absorbed.","l2|r7":"Vitamin C doesn’t build blood itself; it helps iron get absorbed."},"wrongDefault":"Read the nutrient’s main job, then try another match."},{"id":"cases","type":"mc","title":"Plan for the person","summary":"Plan for the person","star":true,"goal":[1,2,3,4,5],"instruction":"Six persona cases. Choose the best plan for each. Cases marked ★ are non-routine; the last two go beyond the Final Check.","items":[{"id":"c1","goal":3,"prompt":"Lin, trimester 2, is lactose intolerant. How can she meet calcium needs?","options":[{"t":"Avoid all calcium sources","why":"Lactose-free and plant options exist.","_n":"1oc2c","_k":"38d270ae"},{"t":"Rely on spinach as the main calcium source","why":"Spinach’s oxalates block most of its calcium. Lactose-free and plant options work better.","_n":"1pbfc","_k":"50f003ee"},{"t":"Lactose-free milk, fortified soy beverage, calcium-set tofu, canned salmon with bones","why":"Each of these gives calcium with little or no lactose.","_n":"1qc0c","_k":"6781e659"},{"t":"Drink regular milk and put up with the symptoms","why":"There’s no need: lactose-free and plant options give calcium without the discomfort.","_n":"1rbdc","_k":"6e04ac0e"}],"hints":["Which foods give calcium without lactose?","Lactose-free milk, fortified soy beverage and calcium-set tofu all count.","Lactose-free milk, fortified soy beverage, calcium-set tofu, canned salmon with bones."]},{"id":"c2","goal":2,"prompt":"Amara (persona) has morning sickness in trimester 1. Which tip fits?","options":[{"t":"Small, frequent meals and snacks; dry crackers; sip fluids between meals","why":"These often help; tell a provider if vomiting is severe.","_n":"1sbec","_k":"4afa6f65"},{"t":"Eat three large meals to make up for lost food","why":"Large meals often make nausea worse; small, frequent meals usually help more.","_n":"1tbbc","_k":"4796ba4e"},{"t":"Skip meals until it passes","why":"Small, frequent meals usually help more; tell a provider if vomiting is severe.","_n":"1ubcc","_k":"d5eefac2"},{"t":"Drink large glasses of fluid with every meal","why":"Sipping fluids between meals usually sits better than large drinks with food.","_n":"1vb9c","_k":"4b8af88f"}],"hints":["What usually helps nausea: big meals or small ones?","Small, frequent meals and dry foods often sit better.","Small, frequent meals and snacks; dry crackers; sip fluids between meals."]},{"id":"c3","goal":[1,3],"prompt":"A persona with iron-deficiency anemia eats vegetarian. Which plan best raises iron absorption? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Drink tea with every meal","why":"Tea and coffee reduce plant-iron absorption when taken with meals.","_n":"1wbac","_k":"f56eceea"},{"t":"Take extra iron pills without telling a provider","why":"A provider sets the dose: too much iron can be harmful.","_n":"1x27d","_k":"a8f127d6"},{"t":"Iron-rich legumes and tofu \u003cstrong>with\u003c/strong> a vitamin C food, tea and coffee \u003cstrong>between\u003c/strong> meals, plus a provider-recommended supplement","why":"Vitamin C helps plant iron get absorbed, tea and coffee are kept away from meals, and a provider sets any supplement.","_n":"1y26d","_k":"f049afbd"},{"t":"Add a glass of milk to every meal","why":"Milk is great for calcium, but calcium can reduce iron absorption at the same meal.","_n":"1z29d","_k":"326629ba"}],"hints":["What helps plant iron get absorbed, and what blocks it?","Vitamin C helps; tea and coffee with meals block it.","Iron-rich legumes and tofu with a vitamin C food, tea and coffee between meals, plus a provider-recommended supplement."]},{"id":"c4","goal":2,"prompt":"A persona develops gestational diabetes. Which general idea is part of the usual plan? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Cut out all carbohydrate","why":"Carbohydrate is still needed; spreading it out is the key idea. Personal plans come from the care team.","_n":"2028d","_k":"0985f0b8"},{"t":"Spread carbohydrate across meals and snacks, with guidance from the care team","why":"Spreading carbohydrate out is the key idea. Personal plans come from the care team.","_n":"212bd","_k":"40fc7424"},{"t":"Eat most of the day’s carbohydrate at one large meal","why":"Spreading carbohydrate across meals and snacks is the key idea, not bunching it together.","_n":"222ad","_k":"6df8cafb"},{"t":"Skip meals to keep blood sugar low","why":"Regular meals and snacks, with carbohydrate spread out, are the usual idea. Personal plans come from the care team.","_n":"232dd","_k":"bb667dc3"}],"hints":["Is carbohydrate removed, or spread out?","Spreading carbohydrate across meals and snacks is the usual idea.","Spread carbohydrate across meals and snacks, with guidance from the care team."]},{"id":"c5","goal":[2,5],"prompt":"A persona observes Ramadan and is pregnant. What’s the respectful, evidence-informed response? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Fasting needs no planning","why":"Respect the person’s choice; planning with the care team matters.","_n":"242cd","_k":"4b678aef"},{"t":"Fasting is always forbidden","why":"Respect the person’s choice; planning with the care team matters.","_n":"252fd","_k":"de0290f7"},{"t":"Many faith traditions allow exemptions in pregnancy; the decision is personal, made with religious guidance and the care team","why":"It respects the person’s choice, and planning with the care team matters.","_n":"262ed","_k":"b36c4cd0"},{"t":"Decide for the person, based on what most people do","why":"The decision is personal: respect the person’s choice, made with religious guidance and the care team.","_n":"27bdb","_k":"0faf2d01"}],"hints":["Who makes the decision?","The person, with religious guidance and the care team.","Many faith traditions allow exemptions in pregnancy; the decision is personal, made with religious guidance and the care team."]},{"id":"c6","goal":5,"prompt":"Neural tube defects in Canada fell after 1998 (model graph). Which study design would test \u003cem>causation\u003c/em> most strongly? \u003cspan class=\"tag\">★ Inquiry\u003c/span>","options":[{"t":"Compare two years of data","why":"Before-and-after data can’t rule out other changes; a randomized trial controls for them.","_n":"28beb","_k":"1ab121db"},{"t":"Compare provinces with high and low bread sales","why":"That’s still observational: other differences between provinces could explain it. A randomized trial controls for them.","_n":"29bfb","_k":"002dc89d"},{"t":"Survey people about how much bread they remember eating","why":"A survey is observational and can’t rule out other factors; a randomized trial controls for them.","_n":"2ac0b","_k":"7c8ef6c0"},{"t":"A randomized trial of folic acid vs no folic acid before conception (historically done: the 1991 UK MRC trial)","why":"Random assignment balances other factors, so a difference can be put down to folic acid.","_n":"2bb9b","_k":"bb568c92"}],"hints":["Which design assigns the treatment at random?","Random assignment balances other factors.","A randomized controlled trial."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Fabian","goal":[2,4],"how":"","instruction":"Fabian made one mistake in each plan. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Advise a friend who just learned she’s 8 weeks pregnant.","steps":["“Keep taking a multivitamin with 0.4 mg folic acid every day.”","“Since you’re eating for two, double your portions now.”","“Fill half your plate with vegetables and fruits.”","“Choose low-mercury fish like salmon twice a week.”"],"_a":"Uw==","stepFb":["Step 1 is correct: folic acid matters throughout early pregnancy.","","Step 3 is good advice. The mistake is earlier.","Step 4 is correct."],"fixes":[{"t":"“In the first trimester you don’t need extra energy; focus on nutrient-rich foods and your multivitamin.”","why":"Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","_n":"2cbab","_k":"5ca45e6f"},{"t":"Step 2 is correct.","why":"Energy needs don’t rise in trimester 1.","_n":"2dbbb","_k":"ffdc81d4"},{"t":"“Eat less to stay small.”","why":"Restricting food isn’t safe in pregnancy; a provider gives personal guidance.","_n":"2ebcb","_k":"860c6240"},{"t":"“Triple your portions in the first trimester.”","why":"That’s worse. Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","_n":"2fb5b","_k":"bd669585"}],"hints":["What does “eating for two” get wrong?","Check the trimester-1 energy readout.","No extra energy in trimester 1."]},{"id":"e2","goal":4,"task":"Plan a picnic lunch for a pregnant friend.","steps":["“Pack whole-grain buns and cut vegetables.”","“Add refrigerated smoked salmon: it’s already cooked, so it’s safe straight from the cooler.”","“Bring pasteurized cheddar and grapes.”","“Keep everything in a cooler with ice packs.”"],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 is fine. The mistake is earlier.","Step 4 is good practice."],"fixes":[{"t":"Step 2 is correct.","why":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures after cooking. Heat deli meats until steaming hot, and use smoked fish only in a cooked dish.","_n":"2gb6b","_k":"ed3684d3"},{"t":"“Smoked salmon is fine if it’s from a good store.”","why":"\u003ci>Listeria\u003c/i> risk doesn’t depend on the store.","_n":"2h43c","_k":"8a99f934"},{"t":"“Freeze the smoked salmon first.”","why":"Freezing doesn’t reliably kill \u003ci>Listeria\u003c/i>.","_n":"2i42c","_k":"99694004"},{"t":"“Swap the smoked salmon for canned salmon, or use smoked salmon only cooked into a hot dish.”","why":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures after cooking. Heat deli meats until steaming hot, and use smoked fish only in a cooked dish.","_n":"2j41c","_k":"9d4a7c2f"}],"hints":["Which bacterium grows in the cold?","Refrigerated smoked seafood is on Health Canada’s list.","Use canned salmon or cook it into a dish."]},{"id":"e3","goal":2,"task":"Explain alcohol and breastfeeding to a new parent.","steps":["“Alcohol passes into breast milk.”","“Its level in milk rises and falls with the level in the blood.”","“So pump and discard right after a drink to clear it faster.”","“Then you can feed immediately.”"],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 depends on step 3’s mistake."],"fixes":[{"t":"Step 3 is correct.","why":"Alcohol leaves milk as it leaves the blood. Only time lowers it; pumping doesn’t speed that up.","_n":"2k40c","_k":"19b65d14"},{"t":"“Alcohol never enters breast milk.”","why":"Step 1 is correct: it does.","_n":"2l3fc","_k":"a0371a6c"},{"t":"“Drink water to flush it out of the milk faster.”","why":"Water doesn’t speed alcohol elimination.","_n":"2m3ec","_k":"06a8c2f2"},{"t":"“Pumping doesn’t speed up how fast alcohol leaves; only time does. Not drinking is safest; anyone choosing to drink should plan feeds around the time alcohol takes to leave.”","why":"Alcohol leaves milk as it leaves the blood. Only time lowers it; pumping doesn’t speed that up.","_n":"2n3dc","_k":"a91fbe9b"}],"hints":["What lowers the blood alcohol level?","Only time: the liver breaks alcohol down.","Pumping can relieve fullness but doesn’t clear alcohol faster."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"What surprised you most on the timeline: the timing of folate, the small change in energy needs, or the iron jump?"},{"id":"j2","q":"In your own words, why does Health Canada give folic acid advice to people who \u003cem>could\u003c/em> become pregnant, not just those who are?"},{"id":"j3","q":"Explain to a friend how to tell whether a pregnancy food product’s claim is trustworthy."},{"id":"j4","q":"Which part of this module still feels unclear? Where could you find reliable information (e.g. Health Canada, a registered dietitian)?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Why is folic acid most important \u003cstrong>before\u003c/strong> pregnancy and in its first weeks?","options":[{"t":"The neural tube closes in about the first 4 weeks after conception","why":"Often before a pregnancy is known.","_n":"2o3cc","_k":"26ac22fd"},{"t":"Folic acid prevents morning sickness","why":"There’s no evidence it does.","_n":"2p3bc","_k":"f9aeec3c"},{"t":"Folic acid is only absorbed early in pregnancy","why":"It’s absorbed throughout; timing is about the neural tube.","_n":"2q3ac","_k":"ff3ec7a2"},{"t":"The baby’s bones form in the first week","why":"Bones form later; that’s calcium and vitamin D.","_n":"2r5ce","_k":"932f8143"}]},"b":{"prompt":"Health Canada advises a daily multivitamin with 0.4 mg folic acid for…","options":[{"t":"Only people who eat no vegetables","why":"Food alone rarely provides enough; the advice applies to all.","_n":"2s5be","_k":"6777ff97"},{"t":"Everyone who could become pregnant","why":"Because the neural tube closes so early.","_n":"2t5ee","_k":"21f9cad4"},{"t":"Only people who have been pregnant before","why":"The advice applies to anyone who could become pregnant.","_n":"2u5de","_k":"ec8e401b"},{"t":"Only people in the third trimester","why":"Too late for the neural tube.","_n":"2v58e","_k":"24d4804c"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which food should be avoided during pregnancy because of \u003ci>Listeria\u003c/i>?","options":[{"t":"Canned salmon","why":"Canned fish is heat-processed.","_n":"2w57e","_k":"d8dc3ae2"},{"t":"Pasteurized cheddar","why":"Pasteurized hard cheese is fine.","_n":"2x5ae","_k":"b7025aa7"},{"t":"A well-cooked chicken breast","why":"Thorough cooking kills \u003ci>Listeria\u003c/i>.","_n":"2y59e","_k":"040a9e2e"},{"t":"Unpasteurized soft cheese","why":"Raw-milk soft cheeses can carry \u003ci>Listeria\u003c/i>.","_n":"2z64e","_k":"f51e7f9a"}]},"b":{"prompt":"Which food should be avoided \u003cstrong>unless cooked into a hot dish\u003c/strong>?","options":[{"t":"Refrigerated smoked salmon","why":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures after cooking. Heat deli meats until steaming hot, and use smoked fish only in a cooked dish.","_n":"3063e","_k":"aa52993c"},{"t":"Hard-cooked eggs","why":"Firm-cooked eggs are fine.","_n":"3156e","_k":"d97897be"},{"t":"Canned light tuna","why":"Canned fish is heat-processed; follow Health Canada’s limits on the amount.","_n":"3257e","_k":"83d63140"},{"t":"Pasteurized yogurt","why":"Pasteurized yogurt is fine.","_n":"3354e","_k":"5a087a92"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Health Canada says extra energy is needed in…","options":[{"t":"None of pregnancy","why":"A modest amount is needed later.","_n":"3455e","_k":"76f284a8"},{"t":"All three trimesters, double the usual","why":"Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","_n":"355ae","_k":"8dae065d"},{"t":"The second and third trimesters, a modest amount","why":"Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","_n":"365be","_k":"7dddca12"},{"t":"Only the first trimester","why":"None is needed in trimester 1.","_n":"3758e","_k":"4510a282"}]},"b":{"prompt":"How much extra energy is suggested in the \u003cstrong>first\u003c/strong> trimester?","options":[{"t":"One extra full meal a day","why":"Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","_n":"3859e","_k":"b4841d10"},{"t":"It depends only on cravings","why":"Cravings don’t set energy needs.","_n":"395ee","_k":"6fb97595"},{"t":"None","why":"Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","_n":"3a5fe","_k":"9812c4d1"},{"t":"Double the usual amount","why":"Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.","_n":"3b70e","_k":"77e969ad"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Persona Ravi is a vegetarian partner helping plan meals for his pregnant spouse, whose iron is low. Which single change best raises iron absorbed from dinner?","options":[{"t":"Add a glass of milk with dinner","why":"Milk is great for calcium, but calcium can reduce iron absorption at the same meal.","_n":"3c6fe","_k":"c474e239"},{"t":"Add lentils and serve them with red pepper strips","why":"Plant iron plus vitamin C.","_n":"3d6ee","_k":"ca03154e"},{"t":"Add a cup of tea with dinner","why":"Tea reduces plant-iron absorption.","_n":"3e6de","_k":"ef93ef9d"},{"t":"Add extra rice","why":"Rice is low in iron.","_n":"3f6ce","_k":"45013ebd"}]},"b":{"prompt":"A pregnant persona doesn’t eat meat and needs more iron. Which lunch is best for iron absorption?","options":[{"t":"Plain pasta with butter","why":"Low in iron.","_n":"3g6be","_k":"52227f81"},{"t":"Tofu stir-fry with broccoli and an orange","why":"Plant iron plus vitamin C.","_n":"3h6ae","_k":"739e1cc6"},{"t":"Cheese sandwich with coffee","why":"Low in iron; coffee reduces absorption.","_n":"3i69e","_k":"ac6acd70"},{"t":"Salad with lettuce and tea","why":"Low in iron; tea reduces absorption.","_n":"3j68e","_k":"75d5c222"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"At a restaurant, a pregnant persona wants fish. Which order is safest?","options":[{"t":"Fully cooked salmon","why":"Low in mercury and cooked.","_n":"3k67e","_k":"c5385d8f"},{"t":"Grilled swordfish","why":"High in mercury.","_n":"3lead","_k":"71e45b9f"},{"t":"Cold smoked salmon platter","why":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures after cooking. Heat deli meats until steaming hot, and use smoked fish only in a cooked dish.","_n":"3mebd","_k":"22ad85e9"},{"t":"Sushi with raw tuna","why":"Raw fish carries infection risk, and tuna can be higher in mercury.","_n":"3necd","_k":"705b3f73"}]},"b":{"prompt":"Which sandwich is safest for a pregnant persona?","options":[{"t":"A sandwich with unpasteurized brie","why":"Raw-milk soft cheese is on the avoid list.","_n":"3oedd","_k":"ef2ab901"},{"t":"A cold deli turkey sandwich","why":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures after cooking. Heat deli meats until steaming hot, and use smoked fish only in a cooked dish.","_n":"3pe6d","_k":"30fe00fc"},{"t":"A sandwich with raw sprouts","why":"Raw sprouts are on the avoid list.","_n":"3qe7d","_k":"aed984b0"},{"t":"A deli turkey sandwich heated until steaming hot","why":"\u003ci>Listeria\u003c/i> can grow at fridge temperatures after cooking. Heat deli meats until steaming hot, and use smoked fish only in a cooked dish.","_n":"3re8d","_k":"9370d0a7"}]}},{"id":"t3","cat":"T","goal":1,"a":{"prompt":"A breastfeeding persona eats a vegan diet. Which nutrient most needs a reliable non-animal source for her baby’s sake?","options":[{"t":"Vitamin C","why":"Plentiful in plant foods.","_n":"3se9d","_k":"5110a428"},{"t":"Vitamin B12, from fortified foods or a supplement","why":"B12 isn’t reliably found in plant foods, and the baby depends on it.","_n":"3te2d","_k":"8e1a0c27"},{"t":"Carbohydrate","why":"Plentiful in plant foods.","_n":"3ue3d","_k":"7694de20"},{"t":"Fibre","why":"Plentiful in plant foods.","_n":"3ve4d","_k":"114a801c"}]},"b":{"prompt":"A pregnant persona who never eats fish wants a DHA source. Best option?","options":[{"t":"Extra bread","why":"Bread doesn’t provide DHA.","_n":"3we3d","_k":"04d552d6"},{"t":"Swordfish once a month","why":"She doesn’t eat fish, and it’s high in mercury.","_n":"3xe6d","_k":"f1f478e4"},{"t":"An algae-based DHA supplement, discussed with a provider","why":"An algae-based DHA supplement provides DHA without fish.","_n":"3ye5d","_k":"0bb91665"},{"t":"Orange juice","why":"No DHA.","_n":"3ze8d","_k":"bb3ae72c"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the clearest explanation of why “eating for two” is misleading?","options":[{"t":"“Pregnant people shouldn’t eat more at all.”","why":"A modest increase is needed later.","_n":"40e7d","_k":"457297e4"},{"t":"“Needs for some nutrients rise a lot, but energy needs rise only a little, and not at all in the first trimester.”","why":"It says what rises a lot, what rises only a little, and when.","_n":"41ead","_k":"eada7324"},{"t":"“Babies don’t need nutrients until birth.”","why":"They need them throughout.","_n":"42e9d","_k":"a2719204"},{"t":"“It’s misleading because twins need four times as much.”","why":"That’s not how needs work.","_n":"43dcd","_k":"0271b9f8"}]},"b":{"prompt":"Which is the clearest explanation of why Canada adds folic acid to white flour?","options":[{"t":"“To make bread taste better.”","why":"Taste isn’t the reason.","_n":"44dbd","_k":"c403007e"},{"t":"“Because flour has no other nutrients.”","why":"That’s not the reason.","_n":"45ded","_k":"2a6e7d18"},{"t":"“So no one needs vegetables.”","why":"Fortification adds to a healthy diet; it doesn’t replace it.","_n":"46dfd","_k":"b1deb9a8"},{"t":"“Many pregnancies aren’t planned, so fortifying common foods raises folate before anyone knows they’re pregnant.”","why":"It links fortification to the timing of the neural tube.","_n":"47dcd","_k":"789298cf"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which statement about breastfeeding and nutrition is correct?","options":[{"t":"“No foods affect breastfeeding.”","why":"Alcohol and caffeine pass into milk.","_n":"48ddd","_k":"c4a832cc"},{"t":"“Breastfeeding parents need a little more energy and fluid, and should continue a multivitamin.”","why":"Thirst rises; a little extra food helps meet the demands of milk production.","_n":"49dad","_k":"2798f103"},{"t":"“Breastfeeding parents should restrict food to lose weight quickly.”","why":"Restriction can reduce milk supply; recovery is gradual.","_n":"4adbd","_k":"18faf9fb"},{"t":"“Pumping and discarding clears alcohol faster.”","why":"Alcohol leaves milk as it leaves the blood. Only time lowers it; pumping doesn’t speed that up.","_n":"4bd8d","_k":"16b23f2a"}]},"b":{"prompt":"Which statement about alcohol in pregnancy is correct?","options":[{"t":"“Alcohol doesn’t reach the baby.”","why":"It crosses the placenta.","_n":"4cd9d","_k":"aebc849a"},{"t":"“Only spirits are harmful.”","why":"Any alcohol carries risk.","_n":"4de6d","_k":"849ab6f1"},{"t":"“There’s no known safe amount at any time in pregnancy.”","why":"Health Canada: no known safe amount at any time.","_n":"4ee7d","_k":"93ba3faa"},{"t":"“A little wine after 20 weeks is safe.”","why":"There’s no known safe amount of alcohol at any time in pregnancy.","_n":"4fd8d","_k":"ae8c016e"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A social
