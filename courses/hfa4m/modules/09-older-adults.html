":true,"halal":false,"takeout":false},{"id":"orange","t":"Orange slices","tex":"moderate","p":false,"ca":false,"d":0,"b12":"","fl":true,"cost":0.4,"grp":"vf","meat":false,"fish":false,"egg":false,"simple":true,"halal":false,"takeout":false},{"id":"apples","t":"Unsweetened applesauce","tex":"soft","p":false,"ca":false,"d":0,"b12":"","fl":false,"cost":0.4,"grp":"vf","meat":false,"fish":false,"egg":false,"simple":true,"halal":false,"takeout":false},{"id":"burger","t":"Takeout burger and fries","tex":"moderate","p":true,"ca":false,"d":0,"b12":"animal","fl":false,"cost":6,"grp":"mx","meat":true,"fish":false,"egg":false,"simple":false,"halal":false,"takeout":true}],"predictions":[{"id":"p1","prompt":"Systems wheel at age 50; the dial will turn to 80. As age goes from 50 to 80, what happens to energy needs and to the vitamin D RDA?","options":[{"t":"Both fall","_n":"ofb1","_k":"84b7c30b"},{"t":"Energy needs usually fall; the vitamin D RDA rises","_n":"pfe1","_k":"432a4234"},{"t":"Both rise","_n":"qfd1","_k":"50b57d0b"},{"t":"Energy needs rise; vitamin D falls","_n":"r081","_k":"ad3f05d2"}],"explain":"Less energy, more of some nutrients: nutrient density matters most now. The energy row changes to “Usually lower”, while vitamin D steps from 15 to 20 µg at 71."},{"id":"p2","prompt":"Systems wheel at age 80. Now switch on “Lives alone”. Which flag will appear?","options":[{"t":"Lower fluid needs","_n":"s071","_k":"9375a0f8"},{"t":"Higher vitamin C needs","_n":"t7a1","_k":"21f7f1e8"},{"t":"Better protein absorption","_n":"u7b1","_k":"451a6d86"},{"t":"Risk of skipping meals or eating less variety","_n":"v781","_k":"e57132ec"}],"explain":"Eating alone often means smaller, simpler meals. Shared meals and community dining help."},{"id":"p3","prompt":"Meal planner, persona Ruth (dentures). Her dinner contains grilled steak. Ruth finds steak hard to chew. What’s the best change?","options":[{"t":"Swap to a soft protein (baked salmon, eggs, lentil soup)","_n":"w791","_k":"816080d4"},{"t":"Replace it with juice","_n":"x7e1","_k":"b04b4038"},{"t":"Remove the protein food","_n":"y7f1","_k":"3b3dd0c6"},{"t":"Add salt to the steak","_n":"z7c1","_k":"4d5f1ed8"}],"explain":"Change the texture, keep the protein. The texture flag turns to “all soft” and protein at every meal stays ticked."},{"id":"p4","prompt":"Systems wheel at age 75, with the “Kidneys and thirst” card open. Why does the readout say “drink regularly” rather than “drink when thirsty”?","options":[{"t":"Water needs triple","_n":"107d1","_k":"9ea7e544"},{"t":"Older adults can’t absorb water","_n":"11821","_k":"5e3d8bfe"},{"t":"The thirst signal weakens with age","_n":"12831","_k":"e711e413"},{"t":"The kidneys stop working","_n":"13fc1","_k":"0e933257"}],"explain":"Feeling thirsty is a late signal for many older adults. The thirst-signal bar shrinks while the fluid-need bar stays the same."}],"challenges":[{"id":"tc1","goal":[3,6],"prompt":"Meal planner, Ruth: build a lunch that is all soft, includes a protein food and includes a calcium-rich item.","why":"Soft textures, protein and calcium together: the lunch fits Ruth’s dentures and her needs.","msgs":{"empty":"Add foods to Ruth’s lunch in the Meal planner.","hard":"That item is hard to chew. Choose a soft form.","moderate":"{item} isn’t soft enough for Ruth’s dentures. Every lunch item needs to be soft.","protein":"Ruth still needs protein at every meal.","calcium":"Add milk, yogurt, fortified soy beverage, paneer or calcium-set tofu."},"hints":["Filter the pool by texture = soft.","Find one soft item that has protein and calcium together.","Paneer curry, or yogurt with lentil soup."]},{"id":"tc2","goal":[3,6],"prompt":"Ruth is 84. Her current day gives 4 model µg of vitamin D from food. Change her day so that food plus Health Canada’s recommended supplement reaches at least her RDA.","why":"With the 10 µg supplement on, food needs to give at least 10 µg: 10 + 10 = 20 µg, Ruth’s RDA.","msgs":{"supp":"Health Canada advises a 10 µg daily supplement for adults over 50. Switch the note on.","nine":"Just short. One more fortified item does it.","low":"Food gives {v} µg of vitamin D (model). With the supplement’s 10 µg, food needs to give at least 10 µg to reach Ruth’s RDA of 20 µg."},"hints":["Ruth is over 70: the RDA is 20 µg.","The supplement gives 10 µg, so food must give at least 10.","One serving of salmon gives 10 (model value)."]},{"id":"tc3","goal":[3,6],"stretch":true,"prompt":"Plan a full day for Gurdeep (lacto-vegetarian; his medication can lower B12 absorption): no meat, fish or eggs; a protein food at every meal; at least 3 B12 sources (dairy or fortified) across the day; at least 4 fluid-rich items.","why":"Plant proteins plus dairy cover protein; dairy and fortified drinks cover B12; milk, tea, soup and water cover fluids.","msgs":{"empty":"Add foods to Gurdeep’s day in the Meal planner.","eggs":"Gurdeep’s lacto-vegetarian diet includes dairy but not eggs.","meat":"Gurdeep’s lacto-vegetarian diet has no meat or fish. Remove {list}.","b12":"B12 comes from dairy and fortified foods for him, so count your milk, yogurt, paneer and fortified soy beverage.","protein":"Every meal needs a protein food: dal, paneer, yogurt, tofu or milk.","fluids":"{n} fluid-rich item{s} so far: he needs at least 4. Milk, fortified soy beverage, tea, soups and water all count."},"hints":["Start with his culture and diet filter: lacto-vegetarian.","Plant proteins (dal, tofu) plus dairy cover protein; dairy and fortified drinks cover B12.","Put milk or yogurt at three different times of day."]}],"blocks":[{"title":"What the explorer shows","html":"\u003cp>As the dial turns, the plate (energy) gets smaller, but the nutrient checklist stays the same. With less room on the plate, choose \u003cstrong>nutrient-dense\u003c/strong> foods that each tick several boxes, like oatmeal made with milk, fortified milk or baked salmon.\u003c/p>\u003cp class=\"tiny muted\">Health information here is general. It is not advice for any particular person. For your own health, or a family member’s, talk to a doctor, nurse, pharmacist or registered dietitian.\u003c/p>"}]},"part3":{"slug":"design","name":"Design","heading":"Design for an older adult","intro":"Adapt one dinner for \u003cstrong>texture\u003c/strong>, compare foods for \u003cstrong>nutrient density\u003c/strong>, and fit Harold’s day to his \u003cstrong>budget\u003c/strong>. Work through the three stations, check your choices with data, then save a kitchen card for class or home.","stations":[{"id":"tex","t":"1. Texture"},{"id":"dense","t":"2. Nutrient density"},{"id":"budget","t":"3. Budget"}],"texture":{"title":"Station 1: Texture","dinner":"Roast chicken, raw salad and crusty bread","levels":[{"id":"reg","t":"Regular","d":"Roast chicken, raw salad, crusty bread"},{"id":"soft","t":"Soft and bite-sized","d":"Tender chicken pieces in sauce, soft-cooked vegetables, soft bread"},{"id":"mince","t":"Minced and moist","d":"Minced chicken in gravy, mashed vegetables, bread soaked in soup"}],"note":"Care settings describe food textures with a standard framework of levels (the IDDSI framework). A health professional, such as a speech-language pathologist or a dietitian, decides a person’s level. Planners don’t assign one.","ask":"Choose a swap for each part of the dinner that keeps protein and vegetables but softens the texture.","parts":[{"id":"chicken","t":"Roast chicken","kind":"p","swaps":[{"t":"Leave out the chicken","fb":"Keep the protein; change the texture: lentil soup, eggs, fish, tofu, yogurt.","_n":"14fb1","_k":"9b11d049"},{"t":"Braised chicken in sauce","fb":"Braising makes the chicken tender and moist, and the protein stays.","_n":"15fa1","_k":"88e650b0"},{"t":"Chicken broth only","fb":"Broth has very little protein. Keep the chicken; change its texture.","_n":"16f91","_k":"0f202c84"}]},{"id":"salad","t":"Raw salad","kind":"v","swaps":[{"t":"Cooked vegetables","fb":"Cooking softens vegetables and keeps them on the plate.","_n":"17001","_k":"fc80326d"},{"t":"A glass of juice","fb":"Whole vegetables and fruit are recommended over juice. Cook the vegetables instead.","_n":"18ff1","_k":"34c12ad9"},{"t":"Leave out the vegetables","fb":"Half the plate is vegetables and fruits. Soften them instead of dropping them.","_n":"19fe1","_k":"205f2b3b"}]},{"id":"bread","t":"Crusty bread","kind":"g","swaps":[{"t":"Crackers","fb":"Crackers are dry and crumbly, which makes them hard to chew and swallow.","_n":"1afd1","_k":"b1e60696"},{"t":"Leave out the bread","fb":"Keep the whole grain; soften it instead.","_n":"1b041","_k":"58c003bf"},{"t":"Soft whole-grain bread soaked in soup","fb":"Soaking softens the bread and keeps the whole grain.","_n":"1c031","_k":"dd781a7a"}]}],"done":"Dinner adapted: every part is soft, and the protein and vegetables stay."},"density":{"title":"Station 2: Nutrient density","ask":"Each pair has a similar cost and energy. Choose the more nutrient-dense food, then check it with data.","pairs":[{"id":"d1","items":[{"t":"Tea biscuits (3)","v":[2,10,0.5,0],"_n":"1df60","_k":"c6ea7402"},{"t":"Oatmeal made with milk","v":[10,300,4,3],"_n":"1ef70","_k":"47d88131"}],"fb":"Protein, calcium and fibre for similar cost.","bad":"Compare the data: the biscuits give little protein, calcium or fibre."},{"id":"d2","items":[{"t":"Fortified milk, 1 cup","v":[8,300,0,3],"_n":"1ff80","_k":"6f92b0f1"},{"t":"A soft drink, 1 can","v":[0,10,0,0],"_n":"1gf90","_k":"7dc5a6b2"}],"fb":"Milk brings protein, calcium and vitamin D; the soft drink brings sugar and little else.","bad":"Compare the data: the soft drink gives almost nothing but sugar."},{"id":"d3","items":[{"t":"White toast (2 slices)","v":[4,60,1,0],"_n":"1hfa0","_k":"8d81c581"},{"t":"Whole-grain toast with peanut butter","v":[12,70,6,0],"_n":"1ifb0","_k":"90a66a14"}],"fb":"Whole grain plus peanut butter adds protein and fibre for a similar cost.","bad":"Compare the data: white toast has less protein and fibre."}],"heads":["Protein (g)","Calcium (mg)","Fibre (g)","Vitamin D (µg)"],"label":"Model values per serving for learning; real foods vary. No Calories are shown.","done":"All three denser choices found: each gives more nutrition per bite."},"budget":{"title":"Station 3: Budget","ask":"Harold has a model budget of $8 a day for food. His current day costs $11.20 and is heavy on takeout. Swap in lower-cost, nutrient-dense staples (eggs, canned fish, frozen vegetables, oats, lentils, milk) until the day fits, keeping protein at every meal.","limit":8,"slots":[{"id":"b","t":"Breakfast","meal":true,"opts":[{"id":"cur","t":"Coffee-shop breakfast sandwich and coffee","cost":3.2,"p":true,"cur":true},{"id":"oat","t":"Oatmeal made with milk","cost":0.6,"p":true,"ca":true},{"id":"egg","t":"Scrambled eggs on whole-grain toast","cost":1.2,"p":true},{"id":"skip","t":"Skip breakfast","cost":0,"skip":true}]},{"id":"l","t":"Lunch","meal":true,"opts":[{"id":"cur","t":"Takeout burger and fries","cost":4.8,"p":true,"cur":true},{"id":"fish","t":"Canned fish sandwich and a glass of milk","cost":2.4,"p":true,"ca":true},{"id":"lent","t":"Lentil soup and a glass of milk","cost":1.3,"p":true,"ca":true,"vf":true},{"id":"skip","t":"Skip lunch","cost":0,"skip":true}]},{"id":"d","t":"Dinner","meal":true,"opts":[{"id":"cur","t":"Toast with jam, and tea","cost":0.6,"cur":true},{"id":"egg","t":"Scrambled eggs with frozen vegetables","cost":1.4,"p":true,"vf":true},{"id":"lent","t":"Lentil and vegetable soup with yogurt","cost":1.6,"p":true,"ca":true,"vf":true},{"id":"skip","t":"Skip dinner","cost":0,"skip":true}]},{"id":"s","t":"Snack","opts":[{"id":"cur","t":"Bag of chips and a pop","cost":2.6,"cur":true},{"id":"milk","t":"A glass of milk and a banana","cost":0.7,"p":true,"ca":true,"vf":true},{"id":"yog","t":"Yogurt with canned peaches","cost":1.2,"p":true,"ca":true,"vf":true},{"id":"skip","t":"Skip the snack","cost":0,"skip":true}]}],"msgs":{"over":"Over budget by {v}. Swap a takeout item for a staple.","skip":"Skipping meals saves money but harms health. Choose a low-cost staple instead.","protein":"{meal} has no protein food. Keep protein at every meal.","done":"Harold’s day fits his budget, with protein at every meal and more calcium than before."},"note":"Many seniors in Canada get Old Age Security (OAS) and the Guaranteed Income Supplement (GIS). Research by the PROOF food insecurity research program links these programs to lower food insecurity among seniors (McIntyre et al., 2016)."},"kitchen":{"title":"Soft lentil and vegetable soup with a yogurt side","label":"Save the kitchen card","file":"kitchen-card-soft-lentil-soup.txt","lines":["Serves 4.","## Ingredients","- 1 cup red lentils, rinsed","- 1 onion and 2 carrots, chopped small","- 1 cup frozen mixed vegetables","- 1 can diced tomatoes (no salt added)","- 5 cups lower-sodium vegetable broth or water","- 1 tsp ground cumin, 1 clove garlic, a squeeze of lemon","- Side: ¾ cup plain yogurt per person","## Cultural swaps (optional)","- Use masoor dal (split red lentils) and finish with cumin seeds warmed in a little oil.","- Or keep red lentils and season with cumin and garlic.","## Steps","1. Wash your hands. Rinse the lentils.","2. Soften the onion and carrots in a little oil over medium heat.","3. Add the lentils, tomatoes, broth, cumin and garlic. Simmer about 20 minutes, until the lentils are very soft.","4. Add the frozen vegetables and simmer 5 more minutes.","5. Season with lemon, herbs and pepper instead of extra salt.","6. Serve with plain yogurt on the side.","## Safety","- Hot liquids: turn pot handles inward, ladle slowly, and let the soup cool a little before blending or serving.","- Leftovers: cool and refrigerate within 2 hours; reheat until steaming hot.","## Texture tip","- Blend half the soup for an even softer texture.","## Nutrient note","- Protein from lentils, calcium from yogurt.","## Cost","- About $1.50 a serving (model data)."]},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Health Canada. (2012). \u003ci>Vitamin D and calcium: Updated dietary reference intakes\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Dietary reference intakes tables\u003c/i>. Government of Canada.\u003c/li>\u003cli>International Dysphagia Diet Standardisation Initiative. (2019). \u003ci>Complete IDDSI framework: Detailed definitions 2.0\u003c/i>. IDDSI.\u003c/li>\u003cli>McIntyre, L., Dutton, D. J., Kwok, C., &amp; Emery, J. C. H. (2016). Reduction of food insecurity among low-income Canadian seniors as a likely impact of a guaranteed annual income. \u003ci>Canadian Public Policy, 42\u003c/i>(3), 274–286.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Design quick check","summary":"Design quick check","items":[{"id":"q1","goal":6,"prompt":"Which swap keeps protein but softens texture?","choices":[{"t":"Steak → salad","fb":"Keep the protein; change the form.","_n":"1jfc0","_k":"f42b6b21"},{"t":"Grilled steak → baked fish in sauce","fb":"Right. Keep the protein; change the form.","_n":"1kfd0","_k":"d9c36d70"},{"t":"Steak → juice","fb":"Keep the protein; change the form.","_n":"1lfe0","_k":"82acde79"},{"t":"Steak → crackers","fb":"Keep the protein; change the form.","_n":"1mff0","_k":"18fd9ff7"}]},{"id":"q2","goal":[3,6],"prompt":"Which is more nutrient-dense for the same cost?","choices":[{"t":"Oatmeal with milk","fb":"Right. Protein, calcium and fibre for similar cost.","_n":"1n081","_k":"819e6f0c"},{"t":"Tea biscuits","fb":"Protein, calcium and fibre for similar cost.","_n":"1o071","_k":"d723f455"},{"t":"White toast with jam","fb":"Protein, calcium and fibre for similar cost.","_n":"1p0a1","_k":"19e00638"},{"t":"A soft drink","fb":"Protein, calcium and fibre for similar cost.","_n":"1q091","_k":"1fe84705"}]},{"id":"q3","goal":6,"prompt":"Who decides a person’s texture level in care settings?","choices":[{"t":"A family member alone","fb":"Texture levels are clinical decisions.","_n":"1r0c1","_k":"ae389c48"},{"t":"The student planner","fb":"Texture levels are clinical decisions.","_n":"1s0b1","_k":"8ba515e0"},{"t":"The cook","fb":"Texture levels are clinical decisions.","_n":"1t0e1","_k":"53046ef8"},{"t":"A health professional (e.g. speech-language pathologist, dietitian)","fb":"Right. Texture levels are clinical decisions.","_n":"1u0d1","_k":"94575303"}]},{"id":"q4","goal":3,"prompt":"Why include a vitamin D supplement note for people over 50?","choices":[{"t":"It cures osteoporosis","fb":"Food alone often falls short for this age group.","_n":"1v001","_k":"d8bb26ef"},{"t":"Food has no vitamin D","fb":"Food alone often falls short for this age group.","_n":"1wff1","_k":"5a01d07a"},{"t":"Health Canada advises it alongside healthy eating","fb":"Right. Food alone often falls short for this age group.","_n":"1x021","_k":"d2602ad0"},{"t":"It replaces calcium","fb":"Food alone often falls short for this age group.","_n":"1y031","_k":"c425b45b"}]}]},"blocksAfter":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>Health information here is general. It is not advice for any particular person. For your own health, or a family member’s, talk to a doctor, nurse, pharmacist or registered dietitian.\u003c/p>\u003c/div>"}]},"practice":{"activities":[{"id":"match","type":"match","title":"Change → effect → food response","summary":"Change → response","goal":[2,3,4],"instruction":"Match each age-related change with the best food response. Some responses on the right don’t match any change.","leftTitle":"Change","rightTitle":"Best food response","left":[{"id":"l1","t":"Weaker thirst signal","goal":2},{"id":"l2","t":"Less B12 absorbed from food","goal":[2,3],"hints":["Why would B12 absorption fall?","Less stomach acid makes it harder to free B12 from food; the B12 in fortified foods and supplements is easier to absorb.","Fortified foods or a supplement."]},{"id":"l3","t":"Loss of muscle (sarcopenia)","goal":[2,3]},{"id":"l4","t":"Fading taste and smell","goal":2},{"id":"l5","t":"Dentures or chewing difficulty","goal":2},{"id":"l6","t":"Small appetite","goal":3},{"id":"l7","t":"Eating alone","goal":4},{"id":"l8","t":"Lower energy needs, steady nutrient needs","goal":[1,3]}],"right":[{"id":"r1","t":"Offer fluids at set times; soups, milk, fruit"},{"id":"r2","t":"Fortified foods or a supplement, as a health professional advises"},{"id":"r3","t":"Protein at each meal plus strength activity"},{"id":"r4","t":"Herbs, spices, citrus, garlic instead of more salt"},{"id":"r5","t":"Soft, moist textures that keep protein and vegetables"},{"id":"r6","t":"Smaller, more frequent, nutrient-dense meals"},{"id":"r7","t":"Shared meals, community dining, delivered meals"},{"id":"r8","t":"Choose nutrient-dense foods"},{"id":"r9","t":"Add more salt"},{"id":"r10","t":"Remove protein foods that are hard to chew"},{"id":"r11","t":"Drink only when thirsty"}],"_a":"SRsNBURcEEQDG00WClQQDBBLUxZKRF4FEANDRlVEHhReDUMORBQGFB4bDQFEXBBEBxtNFgpQEAwQS1cWSkReARADQ0ZRRB4UXgFDDkQUChRP","wrong":{"l4|r9":"Extra sodium raises blood pressure; flavour can come from herbs.","l5|r10":"Keep the protein; change the texture: lentil soup, eggs, fish, tofu, yogurt.","l1|r11":"The thirst signal weakens with age. Drinking regularly, and eating foods with lots of water like soups and fruit, prevents dehydration."},"wrongDefault":"Ask what the change makes harder, then what makes it easier."},{"id":"cases","type":"mc","title":"Cases: the best first step","summary":"Cases","star":true,"goal":[1,2,3,4,5],"instruction":"Six cases. Choose the best first step for each. Cases marked ★ are non-routine; the last two go beyond the Final Check.","items":[{"id":"n1","goal":2,"prompt":"Mrs. Ferreira, 79, says food “tastes like nothing” and has started salting heavily. What’s the best first step?","options":[{"t":"More salt, so she enjoys her food","why":"Herbs, spices, citrus and garlic add flavour without the sodium that raises blood pressure.","_n":"1z001","_k":"e238c2b3"},{"t":"Stop serving foods she can’t taste","why":"Eating less makes it harder to meet her needs. Make food tastier without salt instead.","_n":"20011","_k":"ec3af6a1"},{"t":"Suggest herbs, lemon and spices; mention it to her doctor if taste changed suddenly","why":"Flavour without extra sodium, and a sudden change in taste is worth checking with a doctor.","_n":"21fe1","_k":"6fe428a1"},{"t":"Add sugar to everything, since sweet tastes last longest","why":"Sugar adds little nutrition. Herbs, spices and citrus add flavour without salt or sugar.","_n":"22ff1","_k":"6472022a"}],"hints":["What is fading, and what is she adding to cover it?","Extra sodium raises blood pressure.","Herbs, lemon and spices; mention a sudden taste change to her doctor."]},{"id":"n2","goal":4,"prompt":"Mr. Abenaki-Clarke, 72, skips lunch since his wife died. What’s the best first step?","options":[{"t":"Wait until his appetite returns on its own","why":"Grief can lower appetite for a long time. Make eating easier and social now.","_n":"23fc1","_k":"a7bfc342"},{"t":"Shared or community meals; simple ready-to-eat nutrient-dense options","why":"Eating alone and having a tight budget both lower intake. Shared meals, community programs and low-cost nutrient-dense foods help.","_n":"24fd1","_k":"2b456749"},{"t":"Tell him to try harder","why":"Grief is real; make eating easier and social.","_n":"250a1","_k":"7eed5e88"},{"t":"Replace lunch with coffee","why":"Coffee isn’t a meal: he still needs protein and nutrients.","_n":"260b1","_k":"640c13b0"}],"hints":["Is the problem cooking, company or both?","Grief and eating alone often lower intake.","Shared or community meals, plus simple ready-to-eat options."]},{"id":"n3","goal":[1,3],"prompt":"A day plan for an 81-year-old woman gives 1000 mg calcium and 8 µg vitamin D from food. Which change matters most? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Add one more calcium-rich item only","why":"That helps calcium, but vitamin D is still far short. Health Canada advises a 10 µg supplement for adults over 50.","_n":"27842","_k":"ff39164a"},{"t":"Nothing: 1000 mg of calcium is enough at any age","why":"Women over 50 need 1200 mg.","_n":"28832","_k":"2fc4f48a"},{"t":"Add more energy","why":"Energy needs fall, but needs for vitamin D, calcium and B12 don’t. That’s why every bite has to count.","_n":"29822","_k":"f75dc422"},{"t":"Add the vitamin D supplement note and one more calcium-rich item","why":"Her RDA is 1200 mg calcium and 20 µg vitamin D, so she’s short on both. A fortified milk or soy beverage adds calcium and some vitamin D at once.","_n":"2a812","_k":"27ce5ae2"}],"hints":["Look up her RDAs: calcium 1200 mg, vitamin D 20 µg.","She’s short on both.","Add the supplement note and one more calcium-rich item, such as yogurt."]},{"id":"n4","goal":5,"prompt":"A grandson buys “Senior Formula” nutrition drinks at $3 a bottle for his grandfather, who eats well and has no appetite problems. What’s the best first step? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Replace two meals a day with the drinks","why":"Meals give more variety, fibre and time together. Drinks are for people who can’t eat enough.","_n":"2b802","_k":"f7d99c8f"},{"t":"Seniors always need them","why":"Read the label. Some help (fortified, easy to open); some cost more for little extra nutrition.","_n":"2c7f2","_k":"29ad943d"},{"t":"Throw out every fortified food in the house","why":"Many fortified foods help. Judge each one by its label.","_n":"2d7e2","_k":"edcac7dd"},{"t":"Compare the label with milk plus a snack: the drink may add little for him and costs more","why":"For someone who eats well, regular food usually does the job for less. These drinks help most when a person can’t eat enough.","_n":"2e7d2","_k":"c39ebb22"}],"hints":["Does the grandfather have a problem the drink solves?","Compare the label and price with ordinary foods.","Compare it with milk plus a snack: it may add little and cost more."]},{"id":"n5","goal":4,"prompt":"Which research question best investigates whether a community meal program helps seniors eat better? \u003cspan class=\"tag\">★ Inquiry\u003c/span>","options":[{"t":"“Are seniors lonely?”","why":"Too broad and not about the program’s effect on eating.","_n":"2f8c2","_k":"f39ea0e4"},{"t":"“Should the town spend more money on seniors?”","why":"That’s a question about values and policy, not a research question about eating.","_n":"2g8b2","_k":"11bfcf0c"},{"t":"“Do seniors like soup?”","why":"Too narrow, and not about the program.","_n":"2h7e2","_k":"58a656a9"},{"t":"“How does attending a weekly community meal program relate to the variety of foods older adults in our town eat?”","why":"It names the group, the program and something you can measure about eating.","_n":"2i7f2","_k":"3619d010"}],"hints":["A good research question names a group, a factor and something you can measure.","Which question links the program to what people eat?","The question about attending the program and food variety."]},{"id":"n6","goal":5,"prompt":"An online ad says a supplement “reverses ageing and rebuilds bones in 30 days.” Which response shows good source evaluation? \u003cspan class=\"tag\">★ Inquiry\u003c/span>","options":[{"t":"Share it with grandparents right away","why":"Check the evidence before sharing a health claim.","_n":"2j802","_k":"8595eb67"},{"t":"It’s for sale online, so the claim must be true","why":"Being for sale isn’t evidence that a claim is true.","_n":"2k812","_k":"7c095c4f"},{"t":"Check who makes the claim, look for peer-reviewed evidence or Health Canada information, and note that a 30-day “reversal” is not a plausible claim","why":"Good evaluation checks the source, the evidence and whether the claim is plausible.","_n":"2l7a2","_k":"0607046e"},{"t":"It has testimonials, so it works","why":"Testimonials aren’t evidence.","_n":"2m7b2","_k":"0a16ab8b"}],"hints":["Who is making the claim, and what do they gain?","Look for peer-reviewed studies or Health Canada information.","Check the source and the evidence, and notice that a 30-day reversal isn’t plausible."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Itzel","goal":[1,2,3],"how":"","instruction":"Itzel made one mistake in each plan for her grandmother. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain how Grandma’s needs have changed at 82.","steps":["“Grandma is less active now, so she usually needs less energy.”","“So she needs less of every nutrient too.”","“I’ll give her smaller portions of everything.”","“That will cover her needs.”"],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier.","Step 4 follows the earlier mistake."],"fixes":[{"t":"“She needs more energy than before.”","why":"Energy usually falls.","_n":"2n7c2","_k":"d380a6fd"},{"t":"“She needs only protein now.”","why":"She needs a full range of nutrients.","_n":"2o7d2","_k":"99e81c03"},{"t":"“Energy needs fall, but needs for calcium, vitamin D and B12 stay the same or rise, so I’ll choose nutrient-dense foods.”","why":"Energy needs fall, but needs for vitamin D, calcium and B12 don’t. That’s why every bite has to count.","_n":"2p862","_k":"097991e8"},{"t":"Step 2 is correct.","why":"Lower energy doesn’t mean lower nutrient needs.","_n":"2q872","_k":"c59854b3"}],"hints":["Do vitamin D needs go down with age?","No: they rise after 70.","Fix step 2."]},{"id":"e2","goal":2,"task":"Plan Grandma’s drinks for a hot July day.","steps":["“It’s hot, so fluid needs may rise.”","“Grandma will tell me when she’s thirsty.”","“So I’ll offer water only when she asks.”","“Soup and fruit don’t count as fluids.”","“That keeps her hydrated.”"],"_a":"Aw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2.","There’s a mistake here too, but an earlier step goes wrong first.","Step 5 follows the earlier mistakes."],"fixes":[{"t":"“Her thirst signal may be weaker, so I’ll offer drinks at set times.”","why":"The thirst signal weakens with age. Drinking regularly, and eating foods with lots of water like soups and fruit, prevents dehydration.","_n":"2r337","_k":"babbb931"},{"t":"Step 2 is correct.","why":"The thirst signal weakens with age. Drinking regularly, and eating foods with lots of water like soups and fruit, prevents dehydration.","_n":"2s347","_k":"727fdc94"},{"t":"“She should avoid water to protect her kidneys.”","why":"Healthy kidneys need fluids.","_n":"2t357","_k":"294d7e92"},{"t":"“Give her sports drinks instead.”","why":"Water is the drink of choice.","_n":"2u367","_k":"effc662c"}],"hints":["Is thirst a reliable signal at 82?","It often weakens with age.","Offer fluids regularly."]},{"id":"e3","goal":3,"task":"Check Grandma’s vitamin D.","steps":["“Grandma is over 70, so her vitamin D RDA is 20 µg.”","“She drinks two cups of fortified milk a day.”","“Milk is fortified, so she gets all the vitamin D she needs and no supplement is needed.”","“Her bones are protected.”"],"_a":"AA==","stepFb":["Step 1 is correct.","Step 2 is a fact about her day.","","Step 4 follows step 3."],"fixes":[{"t":"“Two cups give only part of her RDA; Health Canada advises adults over 50 to take a daily 10 µg supplement as well.”","why":"Health Canada advises adults over 50 to take a daily 400 IU (10 µg) vitamin D supplement as well as eating well.","_n":"2v2f7","_k":"2c0a47db"},{"t":"Step 3 is correct.","why":"Health Canada advises adults over 50 to take a daily 400 IU (10 µg) vitamin D supplement as well as eating well.","_n":"2w307","_k":"a31eddd4"},{"t":"“Vitamin D doesn’t matter after 70.”","why":"It matters for bones and muscles.","_n":"2x317","_k":"fcf63ce2"},{"t":"“She should stop drinking milk.”","why":"Milk helps.","_n":"2y327","_k":"c3a5247c"}],"hints":["How much vitamin D is in a cup of fortified milk (model value)?","About 3 µg in the module’s model; two cups give about 6 µg.","Add the supplement note."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"What surprised you on the systems wheel: which change in ageing had you never thought about?"},{"id":"j2","q":"In your own words, why do older adults need nutrient-dense foods?"},{"id":"j3","q":"Explain to a friend how you’d adapt a family recipe for a grandparent who has trouble chewing, without losing protein."},{"id":"j4","q":"Which goal still feels shaky? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which statement about nutrition after age 70 is accurate?","options":[{"t":"Energy needs usually fall, while vitamin D and calcium needs stay the same or rise","why":"That’s why nutrient density matters.","_n":"2z3b7","_k":"44defcb4"},{"t":"All nutrient needs fall with energy needs","why":"Energy needs fall, but needs for vitamin D, calcium and B12 don’t. That’s why every bite has to count.","_n":"303c7","_k":"8eceb9c7"},{"t":"Energy needs rise because of retirement","why":"Activity often falls.","_n":"31b97","_k":"3aecc807"},{"t":"Nutrient needs no longer matter","why":"They matter as much as ever.","_n":"32b87","_k":"0a894c7d"}]},"b":{"prompt":"Why do dietitians stress nutrient-dense foods for older adults?","options":[{"t":"Because older adults need more total energy","why":"Usually less.","_n":"33b77","_k":"59ada0c3"},{"t":"Because energy needs usually fall while many nutrient needs don’t","why":"With less room on the plate, every bite has to count.","_n":"34b67","_k":"67ad6b52"},{"t":"Because nutrient-dense foods are always cheaper","why":"Not always; some are.","_n":"35b57","_k":"b3cf225f"},{"t":"Because older adults can’t digest any fats","why":"Fats are still digested.","_n":"36b47","_k":"fcd2211d"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which age-related change most directly raises the risk of dehydration?","options":[{"t":"Fading taste","why":"Affects flavour, not mainly fluids.","_n":"37b37","_k":"6ebd21e3"},{"t":"Dentures","why":"Affects chewing.","_n":"38b27","_k":"00d94935"},{"t":"A weaker thirst signal","why":"People may not feel thirsty even when they need fluids.","_n":"39c17","_k":"a908b4e3"},{"t":"Loss of bone","why":"Not directly about fluids.","_n":"3ac07","_k":"067f8659"}]},"b":{"prompt":"Which change can make vitamin B12 from food harder to absorb?","options":[{"t":"A weaker thirst signal","why":"About fluids.","_n":"3bbf7","_k":"3e438717"},{"t":"Lower energy needs","why":"Not about absorption.","_n":"3cc07","_k":"3f6b36eb"},{"t":"Less stomach acid","why":"Stomach acid helps release B12 from food.","_n":"3dbd7","_k":"8a88e1c8"},{"t":"Fading smell","why":"About flavour.","_n":"3ebe7","_k":"11c1565f"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which is the best way to add flavour for an older adult whose taste is fading, while protecting blood pressure?","options":[{"t":"Sugar on vegetables","why":"Adds sugar, not flavour depth.","_n":"3fc37","_k":"fd76ec49"},{"t":"Extra salt at the table","why":"Herbs, spices, citrus and garlic add flavour without the sodium that raises blood pressure.","_n":"3gc47","_k":"56b72583"},{"t":"Soy sauce on everything","why":"High in sodium. Herbs, spices, citrus and garlic add flavour without the sodium that raises blood pressure.","_n":"3hc17","_k":"290b2ed9"},{"t":"Herbs, spices, citrus and garlic","why":"Flavour without the sodium.","_n":"3ic27","_k":"4e7c91d4"}]},"b":{"prompt":"Which food is both soft and a good source of calcium?","options":[{"t":"Raw almonds","why":"Calcium, but hard to chew.","_n":"3jb77","_k":"4c5b0d5e"},{"t":"Herbal tea","why":"Fluid, but little calcium.","_n":"3kb87","_k":"0b19eb48"},{"t":"Plain yogurt","why":"Soft, and calcium-rich.","_n":"3lc57","_k":"15d221e6"},{"t":"Canned peaches","why":"Soft, but low in calcium.","_n":"3mc47","_k":"97c85401"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"Ruth, 84, eats about the same foods as she did at 60, but in smaller portions. What is the most likely result?","options":[{"t":"Her needs will be fully met because energy needs fell","why":"Energy needs fall, but needs for vitamin D, calcium and B12 don’t. That’s why every bite has to count.","_n":"3nc77","_k":"a6dea325"},{"t":"She’ll have more protein than before","why":"Less food means less protein.","_n":"3oc67","_k":"88c687f5"},{"t":"She’ll get excess vitamin D","why":"Smaller portions mean less.","_n":"3pc17","_k":"ebd75bc1"},{"t":"She may fall short on vitamin D, calcium and B12 even if her energy intake is enough","why":"Smaller portions of the same foods shrink every nutrient, but her needs for these didn’t shrink.","_n":"3qc07","_k":"75bc0596"}]},"b":{"prompt":"An 80-year-old’s energy intake matches her needs, but her plate is mostly white bread, tea biscuits and jam. What is the main concern?","options":[{"t":"No concern, because energy is met","why":"Energy needs fall, but needs for vitamin D, calcium and B12 don’t. That’s why every bite has to count.","_n":"3rc37","_k":"e0d005d5"},{"t":"Too much energy","why":"The energy matches her needs.","_n":"3sc27","_k":"4ce3dc25"},{"t":"Too much calcium","why":"Little calcium here.","_n":"3tbd7","_k":"cfb368cb"},{"t":"Low nutrient density: likely short on protein, calcium, vitamin D and fibre","why":"Bread, biscuits and jam give energy but little protein, calcium, vitamin D or fibre.","_n":"3ubc7","_k":"986c5e0a"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Mr. Osei, 73, eats fish twice a week and drinks one cup of fortified milk a day. His food gives about 8 µg of vitamin D (model). What should a plan add to reach his RDA of 20 µg?","options":[{"t":"The 10 µg supplement Health Canada advises, plus at least 2 µg more from food","why":"10 + 8 + 2 = 20.","_n":"3vbb6","_k":"537173a7"},{"t":"Nothing: fish is enough","why":"Health Canada advises adults over 50 to take a daily 400 IU (10 µg) vitamin D supplement as well as eating well.","_n":"3wbc6","_k":"1cf8df88"},{"t":"The supplement alone, because 8 + 10 = 20","why":"8 + 10 = 18, which is still 2 short.","_n":"3xbd6","_k":"38d6e5ac"},{"t":"More energy","why":"Energy needs fall, but needs for vitamin D, calcium and B12 don’t. That’s why every bite has to count.","_n":"3ybe6","_k":"926024b0"}]},"b":{"prompt":"Ms. Kaur, 75, gets about 12 µg of vitamin D from food (model). What does adding the 10 µg supplement do?","options":[{"t":"Brings her to about 22 µg, above her RDA of 20 µg","why":"12 + 10 = 22, which is above 20.","_n":"3zbf6","_k":"3d2a7bd7"},{"t":"Brings her to exactly 20","why":"12 + 10 = 22.","_n":"40c06","_k":"0b489c5a"},{"t":"Exceeds the UL","why":"22 µg is far below the UL.","_n":"41c16","_k":"819fbfb2"},{"t":"Nothing, because food covers it","why":"12 is below 20. Health Canada advises adults over 50 to take a daily 400 IU (10 µg) vitamin D supplement as well as eating well.","_n":"42c26","_k":"28d3dfe6"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Harold, 69, recently widowed, eats takeout most days and spends more than he can afford. Which plan addresses both his health and his situation?","options":[{"t":"A strict diet plan with exact calories","why":"Doesn’t address cooking skills, cost or loneliness.","_n":"43b36","_k":"52874fe1"},{"t":"Low-cost staples that are easy to prepare (eggs, canned fish, frozen vegetables, oats), plus a community meal twice a week","why":"It tackles cost, cooking skills and eating alone.","_n":"44b46","_k":"9353a5d2"},{"t":"Expensive meal-replacement drinks","why":"Costly and not social. Read the label. Some help (fortified, easy to open); some cost more for little extra nutrition.","_n":"45c16","_k":"3ae3f83e"},{"t":"Tell him to eat at home alone more often","why":"Ignores grief and isolation. Eating alone and having a tight budget both lower intake. Shared meals, community programs and low-cost nutrient-dense foods help.","_n":"46c06","_k":"ad72cf10"}]},"b":{"prompt":"A senior on a fixed income lives far from a grocery store and doesn’t drive. Which response best fits?","options":[{"t":"Skip meals to save money","why":"Harms health.","_n":"47bf6","_k":"b86b025c"},{"t":"Grocery delivery or a community shuttle, plus shelf-stable nutrient-dense foods (canned fish, beans, milk powder, oats)","why":"It works around transport and keeps nutrient-dense food on hand.","_n":"48be6","_k":"6930d0ff"},{"t":"Only fresh foods every day","why":"Hard without transport.","_n":"49c56","_k":"b3562746"},{"t":"Tell her to walk farther","why":"Ignores mobility.","_n":"4ac46","_k":"7f339adb"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which sentence best explains sarcopenia to a family?","options":[{"t":"“With age, muscle tends to shrink and weaken; eating protein at each meal and staying active help slow it.”","why":"It says what happens and what helps, in plain words.","_n":"4bc36","_k":"0c4fe010"},{"t":"“Sarcopenia is caused by eating too much protein.”","why":"Protein helps.","_n":"4cc26","_k":"762c1c93"},{"t":"“Sarcopenia means bones get thinner.”","why":"That’s osteoporosis.","_n":"4db96","_k":"b29cfecc"},{"t":"“Sarcopenia can’t be affected by anything.”","why":"Activity and protein help.","_n":"4eb86","_k":"21789690"}]},"b":{"prompt":"Which sentence best explains why an older adult might not drink enough water?","options":[{"t":"“Older adults get all their water from coffee.”","why":"Not a reliable plan.","_n":"4f477","_k":"637fdc79"},{"t":"“The body’s thirst signal often weakens with age, so people may not feel thirsty even when they need fluids.”","why":"It gives the cause and what it means, in plain words.","_n":"4g487","_k":"c945f658"},{"t":"“Older adults don’t need water.”","why":"The thirst signal weakens with age. Drinking regularly, and eating foods with lots of water like soups and fruit, prevents dehydration.","_n":"4h457","_k":"fd65a6d5"},{"t":"“Water is harmful to older kidneys.”","why":"Healthy kidneys need fluids.","_n":"4i467","_k":"52d59113"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"A grandmother has trouble chewing. Which meal-plan note is clearest and most helpful?","options":[{"t":"“Use more salt so she eats more.”","why":"Herbs, spices, citrus and garlic add flavour without the sodium that raises blood pressure.","_n":"4j437","_k":"f2d25ab1"},{"t":"“Keep protein at every meal in soft forms (baked fish, eggs, lentil soup, yogurt); cook vegetables until tender; offer drinks with meals.”","why":"Specific, keeps protein, and covers texture and fluids.","_n":"4k447","_k":"cf3b4958"},{"t":"“Give her liquid meals only.”","why":"Not needed; soft foods work.","_n":"4l417","_k":"40c9a145"},{"t":"“Avoid protein because it’s hard to chew.”","why":"Keep the protein; change the texture: lentil soup, eggs, fish, tofu, yogurt.","_n":"4m427","_k":"02953583"}]},"b":{"prompt":"Which label for a plan for a lacto-vegetarian older adult is most accurate?","options":[{"t":"“B12 isn’t needed for vegetarians.”","why":"Everyone needs B12.","_n":"4n3f7","_k":"5bb28ae9"},{"t":"“No dairy; protein from eggs.”","why":"Lacto-vegetarians eat dairy, not eggs.","_n":"4o407","_k":"38865c8b"},{"t":"“No meat, fish or eggs; protein from dal, paneer, tofu and milk; B12 from dairy and fortified foods.”","why":"Accurate about the diet and about where protein and B12 come from.","_n":"4p2d7","_k":"d8be4ec1"},{"t":"“Protein from fish twice a week.”","why":"Not vegetarian.","_n":"4q2c7","_k":"a3ed16b0"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Your town is choosing between two programs to improve seniors’ nutrition. Which choice best fits what you learned?","options":[{"t":"A store discount on candy","why":"Not nutrient-dense.","_n":"4r2f7","_k":"f38fda0e"},{"t":"A pamphlet telling seniors to cook more","why":"Doesn’t address isolation or skills.","_n":"4s2e7","_k":"8074193c"},{"t":"A twice-weekly community lunch with transport, because it improves food intake and social connection","why":"Eating alone and having a tight budget both lower intake. Shared meals, community programs and low-cost nutrient-dense foods help.","_n":"4t317","_k":"01e41dcb"},{"t":"Nothing, because seniors’ food security is never a concern","why":"Some seniors are food insecure. Eating alone and having a tight budget both lower intake. Shared meals, community programs and low-cost nutrient-dense foods help.","_n":"4u307","_k":"3cea2750"}]},"b":{"prompt":"A long-term care home wants residents to eat more at lunch. Which change is most likely to help?","options":[{"t":"Remove all desserts","why":"Not the main issue.","_n":"4v337","_k":"ea522f14"},{"t":"Serve lunch in a shared dining room with familiar, culturally appropriate foods and help for those who need it","why":"Company, familiar foods and help with eating all raise intake.","_n":"4w327","_k":"7f3e5a57"},{"t":"Serve meals in residents’ rooms only","why":"Isolation lowers intake. Eating alone and having a tight budget both lower intake. Shared meals, community programs and low-cost nutrient-dense foods help.","_n":"4x357","_k":"ee073d20"},{"t":"Cut portion variety to save time","why":"Less appealing.","_n":"4y347","_k":"4ebb1258"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A store sells “Senior Strong” cookies with added calcium for $6 a box. Which response shows the best evaluation?","options":[{"t":"Buy them: anything “for seniors” is better","why":"Read the label. Some help (fortified, easy to open); some cost more for little extra nutrition.","_n":"4z436","_k":"cb254fde"},{"t":"Trust the name","why":"Read the label. Some help (fortified, easy to open); some cost more for little extra nutrition.","_n":"50446","_k":"06129914"},{"t":"Avoid all fortified foods","why":"Many fortified foods help.","_n":"51456","_k":"9285b554"},{"t":"Compare the label: check calcium, sugar and price against milk, yogurt or fortified soy beverage","why":"Read the label. Some help (fortified, easy to open); some cost more for little extra nutrition.","_n":"52466","_k":"a016f3df"}]},"b":{"prompt":"A meal-replacement drink is marketed to older adults. For whom is it most likely to be useful?","options":[{"t":"Teenagers who skip breakfast","why":"Not the target, and food is better.","_n":"533f6","_k":"4547aa98"},{"t":"Everyone over 65, instead of meals","why":"Read the label. Some help (fortified, easy to open); some cost more for little extra nutrition.","_n":"54406","_k":"716c3274"},{"t":"Someone who can’t eat enough food, with advice from a health professional","why":"These drinks help most when a person can’t eat enough, with a professional’s guidance.","_n":"55416","_k":"571fb7f7"},{"t":"People who eat well and have a good appetite","why":"Little added benefit.","_n":"56426","_k":"724da5fc"}]}}]},"task":{"title":"A good day for…","summary":"A good day for…","statement":"\u003cp>Choose \u003cstrong>Ruth\u003c/strong>, \u003cstrong>Gurdeep\u003c/strong> or \u003cstrong>Harold\u003c/strong>. Plan a full day (breakfast, lunch, dinner, two snacks) that meets every condition for that person. Then pick one dish for a kitchen card. There are many good plans.\u003c/p>\u003cp class=\"tiny muted\">Model values; real foods vary. Vitamin D in model µg; costs in model dollars. No Calories are shown.\u003c/p>","checks":["Protein at every meal","Calcium-rich foods","Vitamin D covered","Fluids through the day","Fits the person","Kitchen card chosen"],"tips":["Every meal needs a protein food.","Milk, yogurt, paneer, fortified soy beverage and calcium-set tofu are calcium-rich.","Switch on the supplement note, then check the food total.","Soups, milk, tea and water all count as fluid-rich.","Check what this person needs.","Pick the dish you’d most like to cook."],"tips5":{"ruth":"Ruth: filter by soft.","gurdeep":"Gurdeep: dairy yes, eggs no; count B12 sources.","harold":"Harold: check the cost bar."},"explainPrompt":"Explain how your plan responds to two body changes and one life-situation factor for your person.","vocab":"Use the words nutrient-dense, protein, calcium, vitamin D and texture or budget.","checkLabel":"Check my plan","success":"This day works for your person.","more":"There are many good plans. Try another, or plan for another person.","rules":"Protein: breakfast, lunch and dinner each have a protein food. Calcium: at least 3 calcium-rich items. Vitamin D: the supplement note is on and food gives at least 10 µg (Ruth, Gurdeep: 71+) or 5 µg (Harold: 51–70). Fluids: at least 4 fluid-rich items. Fits the person: Ruth, every item soft; Gurdeep, no meat, fish or eggs and at least 3 B12 sources (dairy or fortified); Harold, the day costs $8.00 or less and at least 3 items are “no-cook or simple”.","dishes":[{"id":"lsoup","t":"Soft lentil and vegetable soup with a yogurt side","from":"part3"},{"id":"oat","t":"Oatmeal made with milk, with soft fruit","lines":["Serves 1.","## Ingredients","- ½ cup quick or large-flake oats","- 1 cup fortified milk (or fortified soy beverage)","- ½ banana, sliced, or ½ cup canned peaches in juice","- A pinch of cinnamon","## Cultural swaps (optional)","- Add cardamom and a few soft chopped dates.","- Cook it like a rice pudding with soft rice in place of oats.","## Steps","1. Wash your hands.","2. Stir the oats and milk together in a small pot.","3. Simmer over low heat for about 5 minutes, stirring, until thick and soft.","4. Top with the fruit and cinnamon.","## Safety","- Hot liquids: milk can boil over quickly; stay at the stove, stir, and turn the handle inward.","- Knife safety: slice the banana on a cutting board, cutting away from your fingers.","- Leftovers: cool and refrigerate within 2 hours.","## Texture tip","- Cook a few minutes longer with a splash more milk for a softer, smoother texture.","## Nutrient note","- Protein, calcium and vitamin D from fortified milk; fibre from oats.","## Cost","- About $0.90 a serving (model data)."]},{"id":"dal","t":"Dal with soft rice","lines":["Serves 4.","## Ingredients","- 1 cup split red or yellow lentils (masoor or toor dal), rinsed","- 4 cups water; 1 cup rice","- ½ tsp turmeric, 1 tsp cumin seeds, 1 tomato, garlic and ginger","- Side: plain yogurt (raita)","## Cultural swaps (optional)","- Use the family’s own dal recipe and spice blend.","- Serve with soft roti torn into the dal instead of rice.","## Steps","1. Wash your hands. Rinse the lentils and rice.","2. Simmer the lentils with turmeric in the water for 25 to 30 minutes, until very soft.","3. Cook the rice with a little extra water so it is very soft.","4. Warm the cumin seeds, garlic, ginger and chopped tomato in a little oil, then stir them into the dal.","5. Serve the dal over the rice, with yogurt on the side.","## Safety","- Hot liquids: dal can spit as it thickens; stir with a long spoon and turn the handle inward.","- Knife safety: curl your fingertips when chopping the tomato, garlic and ginger.","- Leftovers: cool and refrigerate within 2 hours; reheat until steaming hot.","## Texture tip","- Whisk the dal smooth and add water to loosen it if needed.","## Nutrient note","- Protein from lentils; the yogurt side adds calcium and B12.","## Cost","- About $1.00 a serving (model data)."]},{"id":"salmon","t":"Baked salmon with soft-cooked vegetables","lines":["Serves 4.","## Ingredients","- 4 salmon fillets (about 75 g each)","- 2 cups frozen mixed vegetables or chopped carrots and squash","- Lemon, dill, a little oil","## Cultural swaps (optional)","- Use trout or another fish the family enjoys.","- Season with ginger and garlic, or a mild curry sauce, in place of dill.","## Steps","1. Wash your hands. Heat the oven to 200 °C.","2. Place the fish on a lined tray, brush with a little oil, and season with lemon and dill.","3. Bake 12 to 15 minutes, until the fish flakes easily and reaches 70 °C inside.","4. Steam or simmer the vegetables until very tender.","## Safety","- Hot liquids and steam: lift pot lids away from you; use oven mitts for the tray.","- Knife safety: curl your fingertips when cutting the vegetables.","- Leftovers: cool and refrigerate within 2 hours.","## Texture tip","- Flake the fish and add a spoonful of sauce or broth to keep it moist.","## Nutrient note","- Protein, vitamin D and B12 from salmon; add a glass of fortified milk for calcium.","## Cost","- About $3.40 a serving (model data)."]}]},"cards":[["Nutrient density","Lots of nutrients per serving compared with its energy. Example: oatmeal made with milk vs tea biscuits."],["Energy vs nutrients with age","Energy needs usually fall; vitamin D, calcium, B12 and protein needs stay the same or rise."],["Vitamin D after 50","RDA 15 µg (51–70), 20 µg (71+); Health Canada advises a 10 µg (400 IU) daily supplement for adults over 50."],["Calcium after 50","RDA 1200 mg for women 51+ and men 71+; 1000 mg for men 51–70."],["Vitamin B12","Less stomach acid can lower absorption from food; fortified foods or supplements may be advised."],["Sarcopenia","Age-related loss of muscle mass and strength; protein at each meal plus activity helps."],["Thirst","The thirst signal weakens with age: offer fluids regularly."],["Taste and smell","They fade with age; use herbs, spices and citrus, not extra salt."],["Texture-modified foods","Softer, moist or minced foods for chewing or swallowing difficulty; levels are set by health professionals."],["Eating alone","Linked to lower intake; shared and community meals help."],["Drug–nutrient interactions","Some medications change appetite, absorption or needs; ask a pharmacist or doctor."],["Products “for seniors”","Judge them by the label and price, not the name."]]}};</script>
