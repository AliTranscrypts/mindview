.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;

--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}

:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;

--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 09: hero (balance storyboard), The ageing body explorer (age dial, situation switches, systems wheel, meal planner),
   Design for an older adult (texture, nutrient-density and budget stations, kitchen card), "A good day for…" task.
   Role colours from hfa4u.css: vitamin D, calcium, B12 --nu-micro (violet); protein --nu-protein (magenta); fluids --nu-water
   (blue); Food Guide sections --leaf, --plate-grain, --nu-protein. Energy and cost stay neutral (--ink-2). Red and green stay
   reserved for feedback. Every coloured mark also carries a word, letter or icon. */
/* radio groups (from HFA4U 06) */
.oa-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.oa-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.oa-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.oa-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.oa-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.oa-chipset button:hover{border-color:var(--pen)}
.oa-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.oa-ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:0 0 auto}
.oa-h4{margin:0 0 6px;font-size:1rem}
.oa-h5{margin:14px 0 6px;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.oa-lit{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi);border-radius:4px}

/* switches */
.oa-sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 10px;min-height:40px;font-size:.92rem}
.oa-sw:hover{border-color:var(--pen)}
.oa-swt{position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;border:2px solid var(--ink-2);background:var(--paper)}
.oa-swt i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.oa-sw[aria-checked="true"]{border-color:var(--ink)}
.oa-sw[aria-checked="true"] .oa-swt{background:var(--hi);border-color:var(--ink)}
.oa-sw[aria-checked="true"] .oa-swt i{left:18px;background:var(--ink)}
.oa-swl{flex:1 1 auto;min-width:0}
.oa-swv{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-2);min-width:1.8rem;text-align:right}
.oa-sw[aria-checked="true"] .oa-swv{color:var(--ink)}

/* hero */
.oa-hero{width:100%}
.oa-hsvg{display:block;width:100%;height:auto}
.oa-hdial{fill:none;stroke:var(--rule);stroke-width:9;stroke-linecap:round}
.oa-htick{stroke:var(--ink-2);stroke-width:1.6}
.oa-hneedle{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.oa-hhub{fill:var(--ink)}
.oa-hbase,.oa-hfulc{fill:var(--ink-2)}
.oa-hpost{stroke:var(--ink-2);stroke-width:4}
.oa-hbeam{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.oa-hstr{stroke:var(--ink-2);stroke-width:1.3}
.oa-hpan{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.oa-hen{fill:var(--rule);stroke:var(--ink-2);stroke-width:2}
.oa-hnu{fill:var(--nu-micro-soft);stroke:var(--nu-micro);stroke-width:2}
.oa-hpr{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:2}
.oa-hw{fill:var(--ink);font:700 11.5px var(--font-ui)}
.oa-hl{fill:var(--ink);font:700 14px var(--font-ui)}
.oa-hs{fill:var(--ink-2);font:400 12.5px var(--font-ui)}
.oa-hrim{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.oa-hin{fill:none;stroke:var(--rule);stroke-width:1.5}
.oa-hsoup{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:2}
.oa-hsoupd{fill:var(--nu-protein)}
.oa-horange{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:2}
.oa-hmilk{fill:var(--nu-water-soft);stroke:var(--nu-water);stroke-width:2}
.oa-cap{font-size:1.05rem!important;font-weight:700}

/* Explore layout */
.oa-lab{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.oa-main,.oa-side{min-width:0}
.oa-side{border-left:1.5px solid var(--rule);padding-left:18px}
.oa-flagl{margin:0;padding-left:1.1em}
.oa-flagl li{margin:0 0 2px}
.oa-agerow{display:grid;grid-template-columns:auto minmax(0,1fr) 5.5rem;align-items:center;gap:10px;margin:2px 0 10px}
.oa-agerow label{font-weight:700}
.oa-agerow input{width:100%;accent-color:var(--ink);min-height:28px}
.oa-agerow output{font-weight:700;font-variant-numeric:tabular-nums}
.oa-togs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 12px}

/* systems wheel */
.oa-ring{position:relative;height:31rem;margin:6px 0 4px}
.oa-spokes{position:absolute;inset:0;width:100%;height:100%}
.oa-spokes line{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.oa-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:9.6rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:var(--sheet);border-radius:50%;padding:6px}
.oa-hplate{width:5.6rem;height:5.6rem}
.oa-hp0{fill:var(--paper);stroke:var(--ink-2);stroke-width:2}
.oa-hp1{fill:var(--sheet);stroke:var(--ink);stroke-width:2;transition:r .3s}
.oa-hp2{fill:none;stroke:var(--rule);stroke-width:1.5;transition:r .3s}
.oa-hage{font-size:1.5rem;font-weight:700;line-height:1;margin-top:-3.6rem;margin-bottom:2.2rem}
.oa-hlab{font-size:.8rem;line-height:1.2;color:var(--ink-2)}
.oa-card{position:absolute;transform:translate(-50%,-50%);width:9.8rem;display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:10px;padding:6px 8px;font-size:.84rem;line-height:1.25;z-index:1}
.oa-card:hover{border-color:var(--pen)}
.oa-cth{display:flex;align-items:center;gap:5px;font-weight:700}
.oa-cn{display:inline-grid;place-items:center;flex:0 0 auto;width:1.35em;height:1.35em;border-radius:50%;border:1.5px solid currentColor;font-size:.75rem}
.oa-ct{min-width:0}
.oa-cs{font-size:.76rem;color:var(--ink-2)}
.oa-card.on{border-color:var(--ink-2);box-shadow:inset 4px 0 0 var(--hi)}
.oa-card.on .oa-cs{color:var(--ink)}
.oa-card[aria-pressed="true"]{border:2px solid var(--ink);background:var(--paper)}
.oa-card.oa-chg{outline:2.5px solid var(--hi);outline-offset:1px}
.oa-new{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:0 .35em}
.oa-glow{animation:oa-glow 1.4s ease-out 1}
@keyframes oa-glow{0%{box-shadow:0 0 0 0 var(--hi)}35%{box-shadow:0 0 0 9px var(--hi-soft)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.oa-glow{animation:none}.oa-swt i,.oa-hp1,.oa-hp2{transition:none}}
.oa-chk{margin:4px 0 8px;text-align:center}
.oa-detail{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:10px 14px;margin:6px 0 4px}
.oa-detail .oa-h5{margin-top:0}
.oa-detail p{margin:0 0 6px;max-width:none}
.oa-now{color:var(--ink)}
.oa-tb{margin-top:8px;border-top:1px solid var(--rule);padding-top:8px}
.oa-tbt{margin:0 0 6px}
.oa-bar{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 7rem;align-items:center;gap:8px;margin:0 0 6px;font-size:.9rem;padding:2px 4px}
.oa-bt{position:relative;height:18px;background:var(--sheet);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.oa-bt i{position:absolute;left:0;top:2px;bottom:2px;border-radius:3px}
.oa-bt i.sig{background:var(--ink-2)}
.oa-bt i.need{background:var(--nu-water)}
.oa-bv{font-weight:700}

/* meal planner (F2 dayPlanner) */
.oa-pdesc{margin:-4px 0 6px;color:var(--ink-2)}
.oa-pact{margin:0 0 8px}
.oa-day{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:6px}
.oa-slot{border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet);min-width:0}
.oa-slot.cur{border-color:var(--ink)}
.oa-slh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px}
.oa-pok{font-weight:700}
.oa-sli{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:3px}
.oa-sli li{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.88rem;border-radius:4px;padding:1px 2px}
.oa-sli li.oa-mkd{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi)}
.oa-sln{min-width:0}
.oa-rm{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;min-width:30px;min-height:28px;font-weight:700}
.oa-rm:hover{border-color:var(--pen)}
.oa-sle{margin:4px 0 0}
.oa-supw{margin:10px 0 6px}
.oa-flw{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:8px 12px}
.oa-flt{margin:0 0 4px;font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.oa-fl{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.oa-fl li{display:flex;gap:6px;align-items:baseline;font-size:.9rem;padding:1px 4px}
.oa-fl li.no{color:var(--ink-2)}
.oa-fl li small{font-size:.8rem}
.oa-mk{flex:0 0 1em;font-weight:700}
.oa-fl li.yes .oa-mk{color:var(--ink)}
.oa-cost{margin:8px 0 2px}
.oa-costt{margin:0 0 4px;font-size:.92rem;max-width:none}
.oa-cbar{position:relative;display:block;height:14px;border:1px solid var(--ink-2);border-radius:4px;background:var(--sheet)}
.oa-cbar i{position:absolute;left:0;top:2px;bottom:2px;background:var(--ink-2);border-radius:3px;transition:width .25s}
.oa-cost.over .oa-cbar i{background:repeating-linear-gradient(135deg,var(--ink-2) 0 5px,var(--rule) 5px 9px)}
.oa-cbar b{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--ink)}
@media (prefers-reduced-motion:reduce){.oa-cbar i{transition:none}}
.oa-pnote{margin:0 0 6px}
.oa-mini{margin:4px 0 6px;padding:6px 8px;border-left:4px solid var(--ink-2);background:var(--sheet);font-size:.9rem;max-width:none;z-index:3}
.oa-msg{display:block;font-weight:700}
.oa-pool{display:grid;gap:5px;max-height:30rem;overflow-y:auto;padding:2px;border-top:1px solid var(--rule)}
.oa-fi{display:flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet);min-width:0}
.oa-fib{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.oa-fin{font-weight:700;font-size:.93rem}
.oa-tags{display:flex;flex-wrap:wrap;gap:3px}
.oa-tag{display:inline-flex;align-items:center;gap:3px;font-size:.73rem;font-weight:700;border:1px solid var(--rule);color:var(--ink-2);border-radius:999px;padding:0 .5em;line-height:1.5}
.oa-tex-soft{border-color:var(--ink-2)}
.oa-tex-moderate{border:1.5px dashed var(--ink);color:var(--ink)}
.oa-tex-hard{border:1.5px solid var(--ink);color:var(--ink);background:var(--hi-soft)}
.oa-tp{border-color:var(--nu-protein);color:var(--ink);box-shadow:inset 3px 0 0 var(--nu-protein)}
.oa-tm{border-color:var(--nu-micro);color:var(--ink);box-shadow:inset 3px 0 0 var(--nu-micro)}
.oa-tw{border-color:var(--nu-water);color:var(--ink);box-shadow:inset 3px 0 0 var(--nu-water)}
.oa-tcost{color:var(--ink)}
.oa-ticks{color:var(--ink-2)}
.oa-fi .btn{flex:0 0 auto}

/* Part 3: stations */
.oa-st{margin-top:8px}
.oa-stok{font-weight:700}
.oa-levs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.oa-lv{margin:0;border:1.5px solid var(--rule);border-radius:8px;padding:6px;background:var(--sheet);text-align:center}
.oa-lv.on{border:2px solid var(--ink);background:var(--paper)}
.oa-lv svg{display:block;width:100%;max-width:9rem;margin:0 auto}
.oa-lv figcaption{display:flex;flex-direction:column;gap:2px;font-size:.82rem;line-height:1.25}
.oa-tp0{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.oa-tp1{fill:none;stroke:var(--rule);stroke-width:1.2}
.oa-tpr{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:1.6}
.oa-tpr2{fill:var(--paper);stroke:var(--nu-protein);stroke-width:1.4}
.oa-tvf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.6}
.oa-tgr{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-width:1.6}
.oa-tln{fill:none;stroke:var(--plate-grain);stroke-width:1.2}
.oa-tsauce{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 2}
.oa-tsoup{fill:var(--nu-carb-soft);stroke:var(--ink-2);stroke-width:1.4}
.oa-iddsi{margin:4px 0 12px}
.oa-ask{margin:6px 0 8px}
.oa-parts{display:grid;gap:8px}
.oa-part{border-bottom:1px solid var(--rule);padding-bottom:6px}
.oa-part .oa-rgl{min-width:7.5rem;color:var(--ink)}
.oa-part .fb{margin-top:0}
.oa-tread{margin-top:10px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 14px}
.oa-pairs{display:grid;gap:10px}
.oa-pair{border-bottom:1px solid var(--rule);padding-bottom:8px}
.oa-pq{margin:0 0 4px;font-weight:700;color:var(--ink-2);font-size:.85rem}
.oa-pbtns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.oa-pb{border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.45em 1em;font-weight:700;min-height:44px;text-align:left}
.oa-pb:hover{border-color:var(--pen)}
.oa-pb.right{border-color:var(--green);background:var(--good-bg)}
.oa-pb.wrong{border-color:var(--red);background:var(--bad-bg)}
.oa-pb.right::before{content:"✓ "}.oa-pb.wrong::before{content:"✗ "}
.oa-vs{font-size:.85rem;color:var(--ink-2)}
.oa-data{margin-top:12px}
.oa-tbl{border-collapse:collapse;font-size:.88rem;min-width:100%}
.oa-tbl th,.oa-tbl td{border-bottom:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
.oa-tbl td{font-variant-numeric:tabular-nums}
.oa-tbl thead th{border-bottom:2px solid var(--ink)}
.oa-tbl tr.oa-pend th,.oa-tbl tr.oa-pend td{border-bottom:2px solid var(--ink-2)}
.oa-bpin{background:var(--sheet);padding:4px 0 2px;z-index:3}
.oa-bsum{margin:4px 0 0;max-width:none}
.oa-bslots{display:grid;gap:4px;margin-top:6px}
.oa-bslot{border-bottom:1px solid var(--rule);padding-bottom:4px}
.oa-bslot .oa-rgl{min-width:5.5rem;color:var(--ink)}
.oa-bc{font-weight:400;font-size:.82rem;color:var(--ink-2)}
.oa-chipset button[aria-checked="true"] .oa-bc{color:var(--hi-ink)}
.oa-bnote{margin-top:12px}
.oa-kcw{margin-top:18px;padding-top:12px;border-top:1.5px solid var(--rule)}
.oa-kprev{margin-top:8px}
.oa-kprev summary,.oa-rules summary{cursor:pointer;font-weight:700}
.oa-kcard{border:1.5px dashed var(--ink-2);border-radius:8px;padding:10px 14px;margin-top:6px;background:var(--paper);font-size:.9rem}
.oa-kcard h5{margin:8px 0 2px;font-size:.88rem;text-transform:uppercase;letter-spacing:.03em}
.oa-kcard p{margin:0 0 2px;max-width:none}
.oa-kcard p.b{padding-left:.9em;text-indent:-.9em}

/* task: the planner needs the wider column */
@media (min-width:821px){#task .design{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}}
.oa-tin{margin:10px 0}
.oa-tpv{min-width:0}
.oa-rules{margin-top:14px}

@media (max-width:820px){
  .oa-lab{grid-template-columns:minmax(0,1fr)}
  .oa-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
}
@media (max-width:640px){
  .oa-hs{font-size:15px}.oa-hl{font-size:16px}.oa-hw{font-size:13px}
  .oa-togs{grid-template-columns:minmax(0,1fr)}
  .oa-ring{height:auto;display:flex;flex-direction:column;gap:6px}
  .oa-spokes{display:none}
  .oa-hub{position:static;transform:none;width:auto;flex-direction:row;justify-content:flex-start;gap:10px;border-radius:8px;border:1.5px solid var(--rule);text-align:left;padding:4px 10px}
  .oa-hplate{width:3.6rem;height:3.6rem}
  .oa-hage{margin:0;font-size:1.3rem}
  .oa-card{position:static;transform:none;width:100%;min-height:44px}
  .oa-bar{grid-template-columns:minmax(0,1fr) 6rem;grid-template-areas:"l l" "t v"}
  .oa-bl{grid-area:l}.oa-bt{grid-area:t}.oa-bv{grid-area:v}
  .oa-day{grid-template-columns:minmax(0,1fr)}
  .oa-mini{position:sticky;top:var(--oa-top,0px);box-shadow:0 6px 6px -6px var(--ink-2)}
  .oa-bpin{position:sticky;top:var(--oa-top,0px);box-shadow:0 6px 6px -6px var(--ink-2)}
  .oa-fi{flex-wrap:wrap}
  .oa-fi .btn{margin-left:auto}
  .oa-levs{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
  .oa-lv figcaption span{display:none}
  .oa-tread{grid-template-columns:repeat(2,minmax(0,1fr))}
  .oa-agerow{grid-template-columns:minmax(0,1fr) 5rem;grid-template-areas:"l o" "r r"}
  .oa-agerow label{grid-area:l}.oa-agerow output{grid-area:o;text-align:right}.oa-agerow input{grid-area:r}
}

</style>

<script>window.MV_PAYLOAD={"meta":{"id":"09-older-adults","nn":"09","slug":"older-adults","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 2","groupName":"Nutrition Across the Lifespan","trivium":"","size":"M","storageKey":"hfa4u-09-older-adults-v1","progressKey":"hfa4u-progress-v1:09-older-adults","toolkit":"1.0.6"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"29a4ff26","content":{"id":"09-older-adults","kind":"topic","title":"Older adult nutrition","topic":"Older Adult Nutrition","readyTopic":"older adult nutrition","hero":{"headline":"Fewer calories, same nutrients: every bite counts.","text":"As we age, the body usually needs a little less \u003cstrong>energy\u003c/strong> but just as much, or more, of key \u003cstrong>nutrients\u003c/strong> like vitamin D, calcium and vitamin B12. Normal changes in \u003cstrong>thirst\u003c/strong>, \u003cstrong>taste\u003c/strong>, \u003cstrong>chewing\u003c/strong> and \u003cstrong>muscle\u003c/strong> shape what older adults eat, and so do living alone, income and medications. \u003cstrong>Nutrient-dense\u003c/strong> meals that fit a person’s culture, budget and texture needs make the difference.","fig":{"html":"\u003cdiv class=\"oa-hero\" id=\"oa-hero\">\u003c/div>","caption":""},"aria":"A balance with two pans. An age dial turns from 50 to 85. On the left pan, labelled “Energy needed”, one weight shrinks a little. On the right pan, labelled “Nutrients needed”, the weights for vitamin D, calcium, vitamin B12 and protein stay the same or grow, so the balance tips toward nutrients. Then a plate slides in with lentil soup, a glass of fortified milk and orange slices.","caption":"Small plate, big nutrition."},"goals":["I can explain why energy needs usually fall with age while many nutrient needs stay the same or rise.","I can describe normal age-related body changes (thirst, taste and smell, chewing, B12 absorption, muscle, bone) and how each affects nutrition.","I can identify nutrients of special concern for older adults (vitamin D, calcium, vitamin B12, protein, fibre, fluids) and foods rich in them.","I can explain how social, economic and health factors (living alone, income, medications) affect older adults’ eating.","I can evaluate food products and services marketed to older adults.","I can plan a meal that fits an older adult’s texture, culture, budget and nutrient needs."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"},{"title":"Before you start","html":"\u003cp>Many of us live with, care for or miss an older relative. This module uses fictional people, and it talks about older adults with respect. Health information here is general. It is not advice for any particular person. For your own health, or a family member’s, talk to a doctor, nurse, pharmacist or registered dietitian.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Nutrient functions","goal":3,"prompt":"Which pair of nutrients works together most directly to build and keep strong bones?","options":[{"t":"Calcium and vitamin D","why":"Vitamin D helps the body absorb calcium, and calcium is the main mineral in bone.","_n":"05c7","_k":"6f809ce5"},{"t":"Fibre and water","why":"These help digestion, not bone mineral.","_n":"15f7","_k":"302b806a"},{"t":"Vitamin C and iron","why":"Vitamin C helps iron absorption, which matters for blood, not mainly bones.","_n":"25e7","_k":"dd3acd42"},{"t":"Sodium and potassium","why":"These balance fluids and nerve signals.","_n":"3597","_k":"74aa6393"}],"hints":["Which mineral makes bones hard?","Which vitamin helps you absorb it?","Calcium and vitamin D."]},{"id":"w2","skill":"Nutrient functions","goal":3,"prompt":"Vitamin B12 is needed mainly for…","options":[{"t":"seeing in dim light","why":"That’s vitamin A.","_n":"4587","_k":"de4e6391"},{"t":"building tooth enamel","why":"That’s mainly calcium, phosphorus and fluoride.","_n":"55b7","_k":"0a8d2d92"},{"t":"healthy nerves and making red blood cells","why":"A shortage can cause anemia and nerve problems.","_n":"65a7","_k":"c52787ed"},{"t":"clotting blood","why":"That’s vitamin K.","_n":"7657","_k":"ec997406"}],"hints":["It’s a B vitamin found mostly in animal foods and fortified foods.","Think blood and nerves.","Red blood cells and nerves."]},{"id":"w3","skill":"Canada’s Food Guide and the DRIs","goal":1,"prompt":"In the DRIs, what does an RDA tell you?","options":[{"t":"The most anyone should ever eat","why":"That’s the UL (tolerable upper intake level).","_n":"8647","_k":"1b5f7228"},{"t":"The energy a person burns at rest","why":"That’s basal metabolic rate, not a DRI.","_n":"98e1","_k":"b52c2d48"},{"t":"The daily intake that meets the needs of nearly all healthy people in a life-stage group","why":"It’s set above the average requirement (the EAR).","_n":"a8f1","_k":"5ba356e0"},{"t":"The exact amount every individual needs","why":"Needs vary; the RDA covers nearly everyone in a group.","_n":"b901","_k":"2bc95f5d"}],"hints":["There are several DRI values: EAR, RDA, AI, UL.","One covers about 97–98% of healthy people.","The RDA."]},{"id":"w4","skill":"Canada’s Food Guide and the DRIs","goal":3,"prompt":"Canada’s Food Guide (2019) recommends what as the drink of choice?","options":[{"t":"Fruit juice","why":"Whole fruit is recommended over juice.","_n":"c911","_k":"27d0b981"},{"t":"Sports drinks","why":"Not needed for most people.","_n":"d8a1","_k":"ca7059e5"},{"t":"Water","why":"Water, plus unsweetened milk and plant-based beverages, fit healthy eating.","_n":"e8b1","_k":"9fe777a0"},{"t":"Tea with sugar","why":"Sugary drinks aren’t recommended.","_n":"f8c1","_k":"20bd8305"}],"hints":["Look at the Food Guide’s plate image.","There’s a glass beside the plate.","Water."]},{"id":"w5","skill":"Life-stage thinking","goal":1,"prompt":"Which change usually happens to energy needs as an adult moves from 40 to 80?","options":[{"t":"They usually go up","why":"That’s adolescence: growth spurts raise teen needs.","_n":"g8d1","_k":"a7367857"},{"t":"They drop to zero after retirement","why":"The body always needs energy.","_n":"h861","_k":"3cb207f6"},{"t":"They usually go down","why":"Less muscle mass and often less activity lower energy needs.","_n":"i871","_k":"e50fc021"},{"t":"They stay exactly the same","why":"Basal metabolic rate tends to fall with muscle loss.","_n":"j001","_k":"87eb65f2"}],"hints":["What happens to muscle mass with age?","Muscle uses energy even at rest.","They usually go down."]},{"id":"w6","skill":"Life-stage thinking","goal":4,"prompt":"Which factor is \u003cstrong>social\u003c/strong>, not biological, when it comes to an older adult’s eating?","options":[{"t":"Loss of muscle mass","why":"Biological.","_n":"kff1","_k":"36c31393"},{"t":"Eating alone after a partner dies","why":"Grief and eating alone often reduce appetite and meal variety.","_n":"l021","_k":"f7e7dc51"},{"t":"A weaker thirst signal","why":"That’s a body change.","_n":"m011","_k":"c1260720"},{"t":"Less stomach acid","why":"Biological.","_n":"nfc1","_k":"726a74af"}],"hints":["Social factors involve other people and situations.","Which option is about relationships?","Eating alone."]}],"refreshers":{"Nutrient functions":"Calcium and vitamin D build bone; B12 supports nerves and red blood cells; protein maintains muscle; fibre and fluids support digestion.","Canada’s Food Guide and the DRIs":"The Food Guide gives food patterns (half vegetables and fruits, a quarter whole grains, a quarter protein foods, water to drink). The DRIs give nutrient amounts by life stage: EAR, RDA, AI, UL.","Life-stage thinking":"Needs change with growth, body changes and life situation. Ask: what’s changing in the body, and what’s changing in the person’s life?"}}},"explore":{"heading":"The ageing body explorer","intro":"Turn the age dial and switch on life situations. Watch which needs change and which flags appear. Then plan meals that respond.","modes":[{"id":"wheel","t":"Systems wheel"},{"id":"planner","t":"Meal planner"}],"toggles":[{"id":"alone","t":"Lives alone"},{"id":"chew","t":"Dentures or chewing difficulty"},{"id":"med","t":"Takes a medication that can lower appetite or B12 absorption"},{"id":"income","t":"Limited income"},{"id":"winter","t":"Rarely outdoors in winter"}],"flags":{"alone":"Lives alone: risk of skipping meals or eating less variety","chew":"Chewing difficulty: soft textures, keep protein","med":"Medication: can lower appetite or B12 absorption; ask a pharmacist or doctor","income":"Limited income: low-cost nutrient-dense staples; community meals help","winter":"Rarely outdoors in winter: little vitamin D from sunlight; the supplement note matters more","none":"None yet: switch on a life situation."},"rows":{"energy":{"t":"Energy needs (compared with age 50)","same":"About the same","little":"A little lower","lower":"Usually lower"},"vitd":{"t":"Vitamin D RDA"},"supp":{"t":"Vitamin D supplement note","txt":"Health Canada advises a daily 10 µg (400 IU) supplement for adults over 50, alongside healthy eating"},"calcium":{"t":"Calcium RDA"},"b12":{"t":"Vitamin B12","base":"Absorption from food may fall; fortified foods or a supplement may be advised","med":"A medication that can lower B12 absorption is switched on, so absorption from food is even more likely to fall. Fortified foods or a supplement may be advised: ask a doctor or pharmacist"},"protein":{"t":"Protein","txt":"Include protein at every meal; some experts suggest older adults need more than younger adults"},"thirst":{"t":"Thirst","weak":"Thirst signal weaker: drink regularly","usual":"No thirst flag yet: water is the drink of choice"},"flags":{"t":"Flags"}},"systems":[{"id":"mouth","t":"Mouth and teeth","what":"Dentures, missing teeth or a sore mouth can make chewing hard, so meat, raw vegetables and crusty bread get skipped.","food":"Soft, moist textures keep protein and vegetables on the plate: stews, eggs, fish, lentil soup, cooked vegetables."},{"id":"taste","t":"Taste and smell","what":"Taste and smell fade gradually with age, and some medications change how food tastes.","food":"Herbs, spices, citrus and garlic add flavour without the sodium that raises blood pressure."},{"id":"stomach","t":"Stomach and absorption","what":"Less stomach acid makes it harder to free vitamin B12 from food, and some medications lower absorption further.","food":"The B12 in fortified foods and supplements is easier to absorb; a health professional advises on supplements."},{"id":"muscles","t":"Muscles","what":"Muscle mass and strength tend to shrink with age (sarcopenia), which also lowers energy needs.","food":"Protein at every meal, plus strength activity, helps slow the loss."},{"id":"bones","t":"Bones","what":"Bone loss continues with age, and the vitamin D RDA rises at 71. In a Canadian winter, the sun is too weak for the skin to make much vitamin D.","food":"Calcium-rich foods, vitamin D sources, and Health Canada’s daily 10 µg vitamin D supplement for adults over 50."},{"id":"kidneys","t":"Kidneys and thirst","what":"The thirst signal weakens with age, so feeling thirsty is a late signal for many older adults.","food":"Offer drinks at set times, and count soups, milk, tea and juicy fruit as fluids."},{"id":"mood","t":"Mood and social life","what":"Living alone, grief and a tight budget often mean smaller, simpler meals and less variety.","food":"Shared meals, community dining, delivered meals and low-cost nutrient-dense staples help."}],"reasons":{"chew":"Dentures or chewing difficulty","taste70":"Age 70+: taste and smell often fade","med":"Medication switched on","b12":"From 50: B12 absorption may fall","musc60":"From 60: muscle loss","musc75":"From 75: muscle loss speeds up","bone50":"From 50: bone loss continues","bone71":"From 71: vitamin D RDA rises to 20 µg","winter":"Rarely outdoors in winter","thirst65":"From 65: thirst signal weaker","alone":"Lives alone","income":"Limited income"},"thirstBars":{"title":"Thirst signal and fluid need","note":"Schematic, not measured.","signal":"Thirst signal","need":"Fluid need"},"hub":{"plate":"Plate (energy)","list":"Nutrient checklist: vitamin D · calcium · B12 · protein · fibre · fluids","same":"same or more at every age"},"personas":[{"id":"ruth","t":"Ruth","age":84,"sex":"f","sit":["alone","chew"],"desc":"84, lives alone in a small Ontario town, wears dentures, small appetite"},{"id":"gurdeep","t":"Gurdeep","age":76,"sex":"m","sit":["med"],"desc":"76, lacto-vegetarian (dairy yes; no meat, fish or eggs), lives with his daughter’s family, takes a medication that can lower B12 absorption"},{"id":"harold","t":"Harold","age":69,"sex":"m","sit":["alone","income"],"desc":"69, recently widowed, active, never did much cooking, tight budget"}],"slots":[{"id":"b","t":"Breakfast","meal":true},{"id":"l","t":"Lunch","meal":true},{"id":"s1","t":"Snack 1"},{"id":"d","t":"Dinner","meal":true},{"id":"s2","t":"Snack 2"}],"current":{"ru
