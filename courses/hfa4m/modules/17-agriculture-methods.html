.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 17: hero (four fields with gauges), Four fields (Compare / Practice builder / Seasons, field art, readout, seasons
   graph), What does the evidence say? (claim stations, Check it with data, follow-up, still-debated sort), Farm plan task.
   Tokens only. Gauges: --ink bars on --sheet with --rule tracks. Field art uses muted tokens: soil --plate-grain(-soft), plants
   --leaf, canola flowers --hi with an --ink outline, cover-crop tufts --leaf, stubble --plate-grain, resistant weeds --ink-2
   asterisks. Every feature has its own shape and a legend word; red and green appear only in feedback marks. */
/* radio groups (from HFA4U 12 / 09) */
.ag-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.ag-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.6rem}
.ag-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.ag-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ag-chipset button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.ag-chipset button:hover:not(:disabled){border-color:var(--pen)}
.ag-chipset button[aria-checked="true"],.ag-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ag-chipset button:disabled{opacity:.85;cursor:default}
.ag-h4{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ag-h5{margin:14px 0 6px;font-size:.95rem}

/* practice toggles: native checkboxes in chips */
.ag-prw{align-items:flex-start}
.ag-prw .ag-rgl{padding-top:8px}
.ag-togs{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1 1 20rem}
.ag-tog{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.3em .75em;min-height:36px;font-size:.92rem;cursor:pointer}
.ag-tog:hover{border-color:var(--pen)}
.ag-tog input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:0 0 auto}
.ag-tog:has(input:checked){border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.ag-tog:has(input:focus-visible){outline:3px solid var(--pen);outline-offset:2px}
.ag-crop{margin:0 0 8px}

/* lab layout */
.ag-lab{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px 24px;align-items:start;margin-top:6px}
.ag-main,.ag-side{min-width:0}
.ag-side{border-left:1.5px solid var(--rule);padding-left:18px}
.ag-read > div{padding:7px 4px}
.ag-read dd{font-size:.95rem}
.ag-rv{display:flex;align-items:center;gap:10px}
.ag-rv b{min-width:2ch;text-align:right;font-size:1.05rem}
.ag-rv .ag-gt{flex:1 1 auto}
.ag-rnote{display:block;font-size:.82rem;color:var(--ink-2);margin-top:2px}
.ag-lit{background:var(--hi-soft);border-radius:6px;transition:background .3s}

/* gauges */
.ag-gt{position:relative;display:block;height:10px;border:1.5px solid var(--rule);border-radius:3px;background:var(--sheet);overflow:visible}
.ag-gt i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:1px}
.ag-gm{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink-2)}
.ag-gauges{display:grid;gap:5px}
.ag-g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;align-items:baseline;padding:2px 4px}
.ag-g .ag-gt{grid-column:1 / -1}
.ag-gl{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.ag-gg{font-weight:400}
.ag-gv{font-size:.95rem}
.ag-gok{font-size:.9rem;margin-left:2px}

/* compare cards */
.ag-cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ag-card{border:1.5px solid var(--rule);border-radius:10px;padding:10px;background:var(--sheet);min-width:0}
.ag-card.on{border:2.5px solid var(--ink);box-shadow:0 0 0 3px var(--hi-soft)}
.ag-card .ag-h4{font-size:.95rem;min-height:2.5em;margin:0;align-items:flex-start}
.ag-selrow{margin:2px 0 6px;min-height:1.7em}
.ag-csvg{display:block;width:100%;height:auto;margin:0 0 8px}
.ag-cert{margin:8px 0 0;font-size:.88rem;padding:2px 4px}
.ag-info{margin-top:8px;font-size:.88rem}
.ag-info summary{cursor:pointer;font-weight:700;color:var(--ink-2)}
.ag-info p{margin:6px 0 0}

/* one field */
.ag-one{margin:0}
.ag-fsvg{display:block;width:100%;height:auto;max-height:240px}
.ag-one figcaption{font-size:.92rem;margin-top:6px}
.ag-leg{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--ink-2)}
.ag-leg li{display:inline-flex;align-items:center;gap:5px}
.ag-leg svg{width:16px;height:16px;flex:0 0 auto}
.ag-seas{margin-top:12px}
.ag-run{margin-top:8px}
.ag-rules{margin-top:16px}
.ag-rules .tbl-wrap{margin-bottom:8px}

/* field art (SVG) */
.ag-soil{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-width:1.5}
.ag-furrow{stroke:var(--plate-grain);stroke-width:1;opacity:.55;fill:none}
.ag-stub{stroke:var(--plate-grain);stroke-width:1.6;stroke-linecap:round;fill:none}
.ag-stem{stroke:var(--leaf);stroke-width:1.6;stroke-linecap:round;fill:none}
.ag-flower{fill:var(--hi);stroke:var(--ink);stroke-width:.8}
.ag-leaf2{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.2}
.ag-cover{stroke:var(--leaf);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ag-weed{stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round;fill:none}

/* hero */
.ag-hero{width:100%}
.ag-hsvg{display:block;width:100%;height:auto}
.ag-hcell{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.ag-ht{fill:var(--ink);font:700 14px var(--font-ui)}
.ag-hs{fill:var(--ink-2);font:400 11px var(--font-ui)}
.ag-hgl{fill:var(--ink-2);font:700 11px var(--font-ui)}
.ag-hgv{fill:var(--ink);font:700 12px var(--font-ui)}
.ag-htr{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2}
.ag-hbar{fill:var(--ink)}
.ag-hnote{text-align:center;margin:6px 0 0}

/* Part 3 */
.ag-stok{font-weight:700}
.ag-st{margin-top:8px}
.ag-claimcard{border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;background:var(--paper);margin-bottom:12px}
.ag-claimcard p{margin:0 0 6px}
.ag-claim{margin:4px 0 8px;padding:0;border:0;font-size:1.3rem;font-weight:700;line-height:1.3}
.ag-claim p{margin:0}
.ag-claim.sm{font-size:1.1rem}
.ag-src{margin:0;display:grid;gap:6px}
.ag-src > div{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:8px}
.ag-src dt{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.ag-src dd{margin:0}
.ag-pick .ag-rgl{min-width:9rem}
.ag-fbl{margin:4px 0 2px;padding-left:1.2em}
.ag-fbl li{margin:2px 0}
.ag-cite{white-space:normal;color:var(--ink-2)}
.ag-data{margin-top:12px}
.ag-data p{margin:8px 0 0}
.ag-follow,.ag-sort{margin-top:16px;border-top:1.5px solid var(--rule);padding-top:4px}
.ag-sitems{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ag-si{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.ag-si.right{border-color:var(--green);background:var(--good-bg)}
.ag-si.wrong{border-color:var(--red);background:var(--bad-bg)}
.ag-sit{flex:1 1 14rem;min-width:0;font-weight:700}
.ag-swhy{display:block;font-weight:400;margin-top:2px}
.ag-s5q{margin-top:14px}
.ag-s5{display:grid;gap:4px;max-width:40rem}
.ag-s5l{font-weight:700;font-size:.92rem;margin-top:6px}
.ag-s5 textarea{min-height:64px}

/* task */
.ag-goals{margin:6px 0 10px;padding-left:1.4em}
.ag-tpv{border:1.5px solid var(--rule);border-radius:10px;padding:12px;background:var(--sheet)}
.ag-tsvg{display:block;width:100%;height:auto;margin:4px 0 10px}
.ag-tg .ag-gt{height:12px}
.ag-tidx{margin:10px 0 4px}
.ag-msvg{display:block;width:100%;max-width:420px;height:auto}
.ag-mgrid{stroke:var(--plot-grid);stroke-width:1}
.ag-mtick{fill:var(--ink-2);font:400 11px var(--font-ui)}
.ag-mgoal{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 5}
.ag-mline{fill:none;stroke:var(--pen);stroke-width:3;stroke-linejoin:round}
.ag-mdot{fill:var(--pen)}

@media (max-width:820px){
  .ag-lab{grid-template-columns:minmax(0,1fr)}
  .ag-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .ag-cmp{grid-template-columns:minmax(0,1fr)}
  .ag-card .ag-h4{min-height:0}
  .ag-card{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr);gap:4px 12px;align-items:start}
  .ag-card > .ag-h4,.ag-card > .ag-selrow,.ag-card > .ag-cert,.ag-card > .ag-info{grid-column:1 / -1}
  .ag-selrow{min-height:0;margin:0}
}
@media (max-width:560px){
  .ag-card{grid-template-columns:minmax(0,1fr)}
  .ag-src > div{grid-template-columns:minmax(0,1fr);gap:0}
  .ag-pick .ag-rgl{min-width:0;width:100%}
  .ag-claim{font-size:1.15rem}
}

itle":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"a595c8bf","content":{"id":"17-agriculture-methods","kind":"topic","title":"Conventional, organic, GMO and sustainable agriculture","topic":"Conventional, Organic, GMO & Sustainable Agriculture","readyTopic":"comparing ways to farm","hero":{"headline":"No field wins at everything","text":"\u003cstrong>Conventional\u003c/strong>, \u003cstrong>organic\u003c/strong> and \u003cstrong>genetically modified\u003c/strong> farming each make different trade-offs. \u003cstrong>Sustainable practices\u003c/strong> like crop rotation and cover crops can be added to any of them. To judge them, you need to know what each one does, and how strong the evidence is behind the claims you hear.","fig":{"html":"\u003cdiv class=\"ag-hero\" id=\"ag-hero\">\u003c/div>","caption":""},"aria":"Four canola fields side by side: Conventional, Organic, GM (herbicide-tolerant canola), and Conventional plus sustainable practices (crop rotation and cover crops). Each has four small gauges, model index from 0 to 100. Conventional: yield 80, soil 50, inputs 70, biodiversity 40. Organic: yield 65, soil 65, inputs 0, biodiversity 60. GM: yield 85, soil 55, inputs 65, biodiversity 40. Plus sustainable practices: yield 85, soil 70, inputs 65, biodiversity 50. No field is highest on every gauge.","banner":"Higher yield here, healthier soil there, fewer inputs over there.","fields":[{"sys":"conv","t":"Conventional","pr":[]},{"sys":"org","t":"Organic","pr":[]},{"sys":"gm","t":"GM","sub":"herbicide-tolerant canola","pr":[]},{"sys":"conv","t":"+ sustainable practices","sub":"rotation + cover crops","pr":["R","CC"]}]},"goals":["I can describe conventional, organic and GM farming and the sustainable practices any of them can use.","I can explain how crop rotation, IPM, no-till, cover crops, intercropping and fallow fields affect yields, soil and the environment.","I can predict long-term effects of farming choices, such as herbicide-resistant weeds.","I can evaluate claims about organic, GM and conventional food using the strength of the evidence.","I can explain how Canada regulates organic claims, GM foods, pesticides and antibiotics in livestock.","I can design a farm plan that balances yield, soil health, inputs and cost, and explain the trade-offs."],"start":{"blocks":[{"title":"Before you start","html":"\u003cp>Food choices are personal and depend on values and budget. No farming system makes food “good” or “bad”. This module asks you to \u003cstrong>weigh the evidence\u003c/strong> and your own values, not to judge anyone’s groceries.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Plant and soil basics","goal":1,"prompt":"What do fertilizers mainly supply to crops?","options":[{"t":"Pest protection","why":"That’s a pesticide’s job.","_n":"00df","_k":"7e1df6c8"},{"t":"Water only","why":"Water comes from rain or irrigation.","_n":"10af","_k":"e65222bc"},{"t":"Nutrients such as nitrogen, phosphorus and potassium","why":"Plants take these from soil; fertilizers replace them.","_n":"20bf","_k":"93b74787"},{"t":"Sunlight","why":"Sunlight comes from the sky.","_n":"310f","_k":"25c5c938"}],"hints":["What do plants pull out of soil?","Nitrogen is the big one.","N, P and K."]},{"id":"w2","skill":"Plant and soil basics","goal":2,"prompt":"Why do farmers worry about soil erosion?","options":[{"t":"Wind and water carry away fertile topsoil, lowering future yields","why":"Topsoil takes centuries to form.","_n":"411f","_k":"132355b1"},{"t":"Erosion only matters in deserts","why":"Prairie dust storms in the 1930s showed otherwise.","_n":"50ef","_k":"9418a2dc"},{"t":"Erosion adds nutrients","why":"It removes them.","_n":"60ff","_k":"3762b034"},{"t":"Erosion makes crops grow faster","why":"It thins the soil roots need.","_n":"714f","_k":"7dd48c30"}],"hints":["Which layer of soil is most fertile?","The top layer.","Losing it lowers yields."]},{"id":"w3","skill":"Pests and evolution","goal":3,"prompt":"A farmer sprays the same herbicide every year. A few weeds survive because of a natural trait. What happens over many years?","options":[{"t":"The weeds disappear forever","why":"Survivors reproduce. Repeating one herbicide selects for weeds that survive it. Rotating crops and methods slows resistance.","_n":"815f","_k":"c857738e"},{"t":"All weeds become resistant in one season","why":"It builds up over seasons.","_n":"9742","_k":"1790d4d4"},{"t":"The resistant weeds survive and spread, so the herbicide stops working well","why":"Natural selection: the spray removes the competition.","_n":"a732","_k":"b9b7daf4"},{"t":"The herbicide gets stronger","why":"The chemical doesn’t change; the weeds do.","_n":"b762","_k":"ee7128ad"}],"hints":["Which weeds make seeds?","The survivors.","Resistance spreads."]},{"id":"w4","skill":"Pests and evolution","goal":2,"prompt":"Why does growing the same crop in the same field every year often increase pest problems?","options":[{"t":"It reduces pests","why":"It feeds them.","_n":"c752","_k":"322d5707"},{"t":"Pests that feed on that crop build up in the field year after year","why":"Their food is always there.","_n":"d782","_k":"029512a6"},{"t":"Pests prefer new fields","why":"They stay where their food is.","_n":"e772","_k":"59c4d9ff"},{"t":"Pests only come from neighbouring farms","why":"Many overwinter in the same field.","_n":"f7a2","_k":"b862ceb2"}],"hints":["What do crop pests need?","Their host crop.","Same crop, same field → pests build up."]},{"id":"w5","skill":"Evidence types","goal":4,"prompt":"Which kind of evidence is strongest for judging a broad claim like “organic food is more nutritious”?","options":[{"t":"A company’s advertisement","why":"It has a financial interest.","_n":"g792","_k":"1429c52f"},{"t":"One farmer’s testimonial","why":"Personal stories aren’t systematic.","_n":"h6c2","_k":"4edcf5c5"},{"t":"A systematic review that combines many well-designed studies","why":"It weighs the whole body of evidence.","_n":"i6b2","_k":"572e9186"},{"t":"A viral social media post","why":"Popularity isn’t evidence.","_n":"je22","_k":"b2bfa8bb"}],"hints":["Which source looks at the most studies?","Reviews combine studies.","A systematic review."]},{"id":"w6","skill":"Evidence types","goal":5,"prompt":"In Canada, who sets the maximum pesticide residue limits allowed on food?","options":[{"t":"Each farmer decides","why":"Limits are set nationally.","_n":"ke32","_k":"cd801257"},{"t":"Health Canada (its Pest Management Regulatory Agency)","why":"Health Canada’s Pest Management Regulatory Agency sets the limits for the whole country.","_n":"le42","_k":"c37776b4"},{"t":"No one; there are no limits","why":"Maximum residue limits exist.","_n":"me52","_k":"2fb161f3"},{"t":"Grocery stores","why":"Stores follow federal rules.","_n":"ne62","_k":"993c9a4b"}],"hints":["Which federal department handles health risks?","Health Canada.","Its Pest Management Regulatory Agency."]}],"refreshers":{"Plant and soil basics":"Crops need nutrients (N, P, K), water, light and healthy soil. Topsoil is precious and slow to form.","Pests and evolution":"Repeating one control method selects for pests or weeds that survive it. Variety slows resistance.","Evidence types":"Systematic reviews and expert scientific bodies outweigh single studies, testimonials and ads. Check who funded or wrote a claim."}}},"explore":{"heading":"Four fields","intro":"Pick a farming system, switch sustainable practices on and off, and watch the readouts. Then run five seasons and see what builds up over time.","modes":[{"id":"compare","t":"Compare"},{"id":"builder","t":"Practice builder"},{"id":"seasons","t":"Seasons"}],"systems":[{"id":"conv","t":"Conventional","short":"Conventional"},{"id":"gm","t":"GM herbicide-tolerant","short":"GM"},{"id":"org","t":"Organic (certified)","short":"Organic"}],"practices":[{"id":"R","t":"Crop rotation","abbr":"R"},{"id":"IPM","t":"IPM","long":"Integrated pest management","abbr":"IPM"},{"id":"NT","t":"No-till","abbr":"NT"},{"id":"CC","t":"Cover crops","abbr":"CC"},{"id":"IC","t":"Intercropping","abbr":"IC"}],"crop":"Canola","cropNote":"The model is tuned for canola. Other crops: coming soon.","readouts":[{"id":"y","t":"Yield"},{"id":"inp","t":"Synthetic inputs"},{"id":"soil","t":"Soil health"},{"id":"bio","t":"Biodiversity"},{"id":"cost","t":"Cost"}],"base":{"conv":{"y":80,"inp":70,"soil":50,"bio":40,"cost":60},"gm":{"y":85,"inp":65,"soil":55,"bio":40,"cost":65},"org":{"y":65,"inp":0,"soil":65,"bio":60,"cost":55}},"effects":{"R":{"y":5,"inp":-5,"soil":10,"bio":5,"cost":0},"IPM":{"y":0,"inp":-15,"soil":0,"bio":5,"cost":-5},"NT":{"y":0,"inp":5,"soil":10,"bio":0,"cost":-5},"NTorg":{"y":-5,"inp":0,"soil":10,"bio":0,"cost":0},"CC":{"y":0,"inp":0,"soil":10,"bio":5,"cost":5},"IC":{"y":-5,"inp":-5,"soil":5,"bio":10,"cost":5}},"weeds":{"inc":15,"rot":6,"ipm":3,"cc":3,"seasons":5},"modelTag":"Model data","modelNote":"Model index from 0 to 100: simplified teaching values that show the direction of each effect, not measurements. Real results vary by crop, region and year.","orgInputs":"approved non-synthetic inputs only","orgWeeds":"Weeds are managed mechanically and by rotation, so no herbicide selects for resistance.","cert":{"conv":"Not organic","gm":"Not eligible: GMOs are prohibited in organic production","org":"Eligible for organic certification"},"info":{"conv":"Uses approved synthetic fertilizers and pesticides.","gm":"Herbicide-tolerant canola survives a specific herbicide, which makes weed control simpler. In Canada, GM crops are mainly canola, corn, soybeans and sugar beets. Health Canada and the Canadian Food Inspection Agency (CFIA) assess them, and GM labelling is voluntary.","org":"Certified under the Canada Organic Regime and the Canadian Organic Standards: synthetic pesticides, synthetic fertilizers and genetically modified organisms (GMOs) are prohibited. Certain approved non-synthetic pesticides may be used."},"seasonsNote":"Changing the system or a practice starts the seasons again.","predictions":[{"id":"p1","prompt":"Switch canola from conventional to organic. What happens to the model’s yield?","options":[{"t":"It goes up","_n":"oe72","_k":"18e92e4f"},{"t":"It stays the same","_n":"pe82","_k":"a0e8e73f"},{"t":"It drops to zero","_n":"qe92","_k":"143a5ed3"},{"t":"It goes down","_n":"rea2","_k":"7f76a3df"}],"explain":"Reviews find organic yields are lower on average, but the gap varies a lot by crop and by practice. In exchange, organic uses no synthetic inputs and often supports more biodiversity."},{"id":"p2","prompt":"Run 5 seasons with the same herbicide every year. What happens to the resistant-weed index?","options":[{"t":"It rises steadily","_n":"seb2","_k":"5f47db15"},{"t":"It jumps to 100 in season 1","_n":"te82","_k":"02423d33"},{"t":"It falls","_n":"ue72","_k":"8ea37529"},{"t":"It stays at 0","_n":"ve62","_k":"8f23ba93"}],"explain":"Each spray removes the susceptible weeds, leaving the resistant ones to spread. Herbicide-resistant weeds are a real problem on Prairie farms."},{"id":"p3","prompt":"Turn on no-till. Which two readouts change in the same direction as each other?","options":[{"t":"Yield and cost both go up","_n":"we52","_k":"1f501a25"},{"t":"Biodiversity and soil both go down","_n":"xec2","_k":"577906b8"},{"t":"Soil health and synthetic inputs both go up","_n":"yeb2","_k":"ad204bcf"},{"t":"Nothing changes","_n":"zea2","_k":"0811c5b4"}],"explain":"No-till protects soil, but weeds that tillage would have buried are controlled with more herbicide."},{"id":"p4","prompt":"Can GM canola be certified organic in Canada?","options":[{"t":"Only for export","_n":"10e92","_k":"595aa76d"},{"t":"Yes, if no pesticides are sprayed","_n":"11f02","_k":"683187b0"},{"t":"Yes, after one year","_n":"12ef2","_k":"96b32220"},{"t":"No","_n":"13e63","_k":"6088bae9"}],"explain":"Organic standards prohibit GMOs. GM and organic are separate paths, though both can use sustainable practices."}],"challenges":[{"id":"tc1","goal":[2,6],"prompt":"On the \u003cstrong>conventional\u003c/strong> field, raise soil health to \u003cstrong>at least 80\u003c/strong> without letting yield drop below 80.","why":"Rotation, no-till and cover crops each add 10 soil health, and rotation also adds 5 yield.","hints":["Soil needs +30. Which practices add soil health?","Rotation, no-till and cover crops each add 10.","Rotation + no-till + cover crops: soil 80, yield 85."],"msgs":{"sys":"Switch the system to \u003cstrong>Conventional\u003c/strong> first.","close":"Close. Which practice adds both soil health and yield?","noR":"Soil health is {soil}. Without crop rotation, the most soil health this field can reach is 75.","soil":"Soil health is {soil}; it needs to reach 80.","yield":"Yield is {y}; keep it at 80 or more."}},{"id":"tc2","goal":[2,6],"prompt":"On the \u003cstrong>organic\u003c/strong> field, keep synthetic inputs at 0 and raise yield to \u003cstrong>at least 70\u003c/strong>.","why":"Rotation is the only practice that adds yield. Organic no-till and intercropping each cost 5 yield in this model.","hints":["Which practice adds yield?","Only rotation, +5.","Rotation, without intercropping or no-till."],"msgs":{"sys":"Switch the system to \u003cstrong>Organic (certified)\u003c/strong> first.","ic":"Intercropping costs 5 yield in this model.","nt":"Organic no-till is hard without herbicides: −5 yield.","noR":"Yield is {y}. Which practice adds yield?"}},{"id":"tc3","goal":[3],"stretch":true,"prompt":"Seasons mode on the \u003cstrong>GM\u003c/strong> field: run 5 seasons and keep the resistant-weed index \u003cstrong>below 40\u003c/strong>.","why":"Rotation works because different crops use different herbicides and break pest cycles. Real farms combine several tactics.","hints":["Each season adds 15 unless you change something.","Rotation cuts the yearly increase to 6; IPM and cover crops each take off 3 more.","Rotation alone: 6 × 5 = 30. With IPM and cover crops: 0."],"msgs":{"sys":"Switch the system to \u003cstrong>GM herbicide-tolerant\u003c/strong> first.","run":"Switch to \u003cstrong>Seasons\u003c/strong> mode and run all 5 seasons first.","close":"Close. IPM and cover crops slow resistance, but without rotation the same herbicide keeps selecting resistant weeds.","other":"The index reached {v} after 5 seasons. Repeating one herbicide selects for weeds that survive it. Rotating crops and methods slows resistance."}}],"blocks":[{"title":"What the four fields show","html":"\u003cul>\u003cli>\u003cstrong>No system maximizes everything.\u003c/strong> Every system wins on some readouts and loses on others. “Best” depends on which goal you’re optimizing.\u003c/li>\u003cli>\u003cstrong>Sustainable practices shift several readouts at once\u003c/strong>, on any system.\u003c/li>\u003cli>\u003cstrong>Crop rotation is the single most powerful lever against weed resistance\u003c/strong> in this model.\u003c/li>\u003c/ul>\u003cp class=\"tiny muted\">The indices are teaching values, tuned only to show the direction of each effect. Real results vary by crop, region and year.\u003c/p>"}]},"part3":{"slug":"evidence","name":"Evidence","heading":"What does the evidence say?","intro":"Each station shows a claim you might meet online or in a store. Decide what kind of source it comes from, how strong its evidence is, and your verdict. Then open \u003cstrong>Check it with data\u003c/strong> to see what the evidence says.","tag":"Practice model (fictional)","teacherNote":"Your teacher may add real, credited posts or headlines to check with the same steps.","sources":[{"id":"review","t":"Scientific review"},{"id":"study","t":"Single study"},{"id":"reg","t":"Government regulator"},{"id":"ad","t":"Company ad"},{"id":"post","t":"Influencer post"}],"strengths":[{"id":"strong","t":"Strong"},{"id":"moderate","t":"Moderate"},{"id":"weak","t":"Weak"},{"id":"none","t":"None"}],"verdicts":[{"id":"sup","t":"Supported"},{"id":"not","t":"Not supported"},{"id":"mixed","t":"Mixed"},{"id":"dep","t":"Depends"}],"fbSrc":"Look again at where the claim appeared: who wrote it, and why?","fbOk":"All three are right.","stations":[{"id":"s1","t":"1. Organic nutrition","claim":"Organic food is more nutritious.","seen":"A flyer from FreshRoots, an organic produce-box company (fictional).","gives":"None named: “Everyone knows organic is better for you.”","_a":"GhdKRwAaWEQAURsZQUsWFEMPYhcNVwwDQxkbQgZZCUQ8GRtDQQJACwhNXFFBRQ==","strFb":"It names no evidence at all, so its evidence can’t be strong or moderate.","vFb":"Read the evidence summary: the reviews don’t point clearly one way.","data":"Systematic reviews find small or inconsistent differences in most nutrients. Some find more antioxidants and fewer pesticide residues in organic crops. Overall diet matters far more than farming method.","from":"Systematic reviews (scientific review)","cite":"(Barański et al., 2014; Smith-Spangler et al., 2012)","follow":{"claim":"Organic farms use no pesticides at all.","_a":"Q1tWQUE=","fb":"Approved non-synthetic pesticides are allowed.","cite":"(Canadian General Standards Board, 2020)"}},{"id":"s2","t":"2. GM food safety","claim":"GM foods are unsafe to eat.","seen":"A video from a wellness influencer (fictional).","gives":"A personal story: “I felt better after I cut out GMOs.”","_a":"GhdKRwAaWEQRWkpBQRRAFRVHGw84GgwJD1AbGUFPBwcKF2QZQU5AXENbVkFBRQ==","strFb":"A personal story isn’t systematic evidence, so it can’t be strong or moderate.","vFb":"Major scientific bodies have concluded that approved GM foods are as safe to eat as their conventional counterparts. The live debates are environmental, economic and social.","data":"Major scientific bodies (e.g. a 2016 US National Academies report) conclude approved GM foods are as safe to eat as conventional ones. Canada assesses each GM food before sale.","from":"A national science academy report (scientific review) · Health Canada (government regulator)","cite":"(Health Canada, n.d.-a; National Academies of Sciences, Engineering, and Medicine, 2016)","sort":{"title":"What’s still debated?","ask":"Sort each statement: is it still debated, or does the evidence settle it?","cols":[{"id":"deb","t":"Still debated"},{"id":"set","t":"Settled by the evidence"}],"items":[{"id":"d1","t":"Herbicide-resistant weeds","_a":"Q1FcV0E=","why":"An evidence-backed concern about how GM crops are used."},{"id":"d2","t":"Seed patents and farmer costs","_a":"Q1FcV0E=","why":"An economic and social debate."},{"id":"d3","t":"Corporate concentration","_a":"Q1FcV0E=","why":"An economic and social debate."},{"id":"d4","t":"Effects on non-GM and organic neighbours","_a":"Q1FcV0E=","why":"An environmental and economic debate."},{"id":"d5","t":"Approved GM foods are unsafe to eat","_a":"Q0ZcQUE=","why":"Major scientific bodies conclude approved GM foods are as safe to eat as conventional ones."},{"id":"d6","t":"GM food changes your DNA","_a":"Q0ZcQUE=","why":"A myth: eating GM food doesn’t change your DNA."}],"done":"Right. Major scientific bodies have concluded that approved GM foods are as safe to eat as their conventional counterparts. The live debates are environmental, economic and social.","off":"{n} not sorted yet, or in the wrong column. Ask: is it about eating safety, or about the environment, money and power?"}},{"id":"s3","t":"3. Pesticide residues","claim":"Pesticide residues on produce are dangerous.","seen":"A news story about one small study of strawberry samples (fictional).","gives":"One small study that found residues on some samples.","_a":"GhdKRwAaWEQSQUxRGhpORBJBSxdZY0ARBFRSFz4UQBBDDxtRBkhAGw==","strFb":"One small study is weak evidence on its own; reviews and monitoring weigh many samples.","vFb":"Read the evidence summary: the answer is different for eaters and for farmworkers.","data":"Health Canada sets maximum residue limits with safety margins, and monitoring finds most samples within them. Washing produce removes some residue. Farmworkers face higher exposure than eaters, which is an occupational-safety issue.","from":"Health Canada and the CFIA (government regulators)","cite":"(Canadian Food Inspection Agency, n.d.; Health Canada, n.d.-b)"},{"id":"s4","t":"4. Antibiotics","claim":"Antibiotics in livestock are only an animal issue.","seen":"A brochure from a livestock-feed company (fictional).","gives":"None named.","_a":"GhdKRwAaWEQAURsZQUsWFEMPYhcNVwwDQxkbQgZZCUQ8GRtDQQJACA5BG0g=","strFb":"It names no evidence at all, so its evidence can’t be strong or moderate.","vFb":"Resistant bacteria can spread between animals, people and the environment.","data":"Overusing antibiotics in animals can contribute to antibiotic-resistant bacteria that affect people. Canada has restricted the use of medically important antibiotics in animals, e.g. no growth-promotion claims.","from":"Health Canada (government regulator)","cite":"(Health Canada, n.d.-c)"},{"id":"s5","t":"5. Salmon farms (optional)","optional":true,"claim":"Salmon farming in open-net pens in BC","text":"In British Columbia, some salmon are raised in open-net pens in the ocean. The issues to weigh are feed, escapes of farmed fish, sea lice, and government policy, which has been changing.","data":"Open nets cost less, but farmed fish can escape and sea lice can spread to wild salmon. Land-based systems contain the fish but use more energy and cost more. Rules for open-net pens in BC have been changing, so check the current status.","from":"Fisheries and Oceans Canada (government regulator)","cite":"(Fisheries and Oceans Canada, n.d.)","ask":"List one benefit and one concern.","benefit":"One benefit","concern":"One concern"}],"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Barański, M., Średnicka-Tober, D., Volakakis, N., Seal, C., Sanderson, R., Stewart, G. B., Benbrook, C., Biavati, B., Markellou, E., Giotis, C., Gromadzka-Ostrowska, J., Rembiałkowska, E., Skwarło-Sońta, K., Tahvonen, R., Janovská, D., Niggli, U., Nicot, P., &amp; Leifert, C. (2014). Higher antioxidant and lower cadmium concentrations and lower incidence of pesticide residues in organically grown crops: A systematic literature review and meta-analyses. \u003ci>British Journal of Nutrition, 112\u003c/i>(5), 794–811.\u003c/li>\u003cli>Canadian Food Inspection Agency. (n.d.). \u003ci>National Chemical Residue Monitoring Program\u003c/i>. Government of Canada.\u003c/li>\u003cli>Canadian General Standards Board. (2020). \u003ci>Organic production systems: Permitted substances lists\u003c/i> (CAN/CGSB-32.311-2020). Government of Canada.\u003c/li>\u003cli>Fisheries and Oceans Canada. (n.d.). \u003ci>Salmon aquaculture in British Columbia\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.-a). \u003ci>Genetically modified (GM) foods and other novel foods\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.-b). \u003ci>Maximum residue limits for pesticides\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.-c). \u003ci>Responsible use of medically important antimicrobials in animals\u003c/i>. Government of Canada.\u003c/li>\u003cli>National Academies of Sciences, Engineering, and Medicine. (2016). \u003ci>Genetically engineered crops: Experiences and prospects\u003c/i>. The National Academies Press.\u003c/li>\u003cli>Smith-Spangler, C., Brandeau, M. L., Hunter, G. E., Bavinger, J. C., Pearson, M., Eschbach, P. J., Sundaram, V., Liu, H., Schirmer, P., Stave, C., Olkin, I., &amp; Bravata, D. M. (2012). Are organic foods safer or healthier than conventional alternatives? A systematic review. \u003ci>Annals of Internal Medicine, 157\u003c/i>(5), 348–366.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Evidence quick check","summary":"Evidence quick check","items":[{"id":"q1","goal":4,"prompt":"Which source is strongest for “GM foods are safe to eat”?","choices":[{"t":"A seed company ad","fb":"Reviews by independent scientific bodies weigh all the evidence.","_n":"14e73","_k":"6fa7b654"},{"t":"A farmer’s video","fb":"Reviews by independent scientific bodies weigh all the evidence.","_n":"15e43","_k":"08c3bae6"},{"t":"National science academy review","fb":"Right. Reviews by independent scientific bodies weigh all the evidence.","_n":"16e53","_k":"9253204b"},{"t":"A viral meme","fb":"Reviews by independent scientific bodies weigh all the evidence.","_n":"17ea3","_k":"d4990779"}]},{"id":"q2","goal":4,"prompt":"“Organic means no pesticides.” Verdict?","choices":[{"t":"Strong evidence for","fb":"Approved non-synthetic pesticides are allowed.","_n":"18eb3","_k":"89e76aa5"},{"t":"Not supported","fb":"Right. Approved non-synthetic pesticides are allowed.","_n":"19e83","_k":"1ea029b9"},{"t":"No evidence either way","fb":"Approved non-synthetic pesticides are allowed.","_n":"1ae93","_k":"fccd6cc7"},{"t":"Supported","fb":"Approved non-synthetic pesticides are allowed.","_n":"1bee3","_k":"5e5ee22c"}]},{"id":"q3","goal":4,"prompt":"Which is a genuine, ongoing debate about GM crops?","choices":[{"t":"GM canola is radioactive","fb":"That’s an evidence-backed concern; the others are myths.","_n":"1cef3","_k":"c2f248b6"},{"t":"Herbicide-resistant weeds","fb":"Right. That’s an evidence-backed concern; the others are myths.","_n":"1dec3","_k":"b898b483"},{"t":"GM food changes your DNA","fb":"That’s an evidence-backed concern; the others are myths.","_n":"1eeb3","_k":"95bd04d4"},{"t":"GM food has no nutrients","fb":"That’s an evidence-backed concern; the others are myths.","_n":"1fee3","_k":"dbf5a6f8"}]},{"id":"q4","goal":4,"prompt":"Who faces the highest pesticide exposure?","choices":[{"t":"People eating washed produce","fb":"Occupational exposure is far higher than dietary exposure.","_n":"1ged3","_k":"7628230c"},{"t":"People who eat only organic","fb":"Occupational exposure is far higher than dietary exposure.","_n":"1he83","_k":"1f1b229b"},{"t":"Grocery cashiers","fb":"Occupational exposure is far higher than dietary exposure.","_n":"1ie73","_k":"b2422bad"},{"t":"Farmworkers applying pesticides","fb":"Right. Occupational exposure is far higher than dietary exposure.","_n":"1jea3","_k":"b828f433"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Practice ↔ effect","summary":"Practice ↔ effect","goal":[1,2],"instruction":"Tap a practice, then tap the effect and trade-off that goes with it.","how":"","leftTitle":"Practice","rightTitle":"Effect and trade-off","left":[{"id":"l1","t":"Crop rotation"},{"id":"l2","t":"Integrated pest management"},{"id":"l3","t":"No-till"},{"id":"l4","t":"Cover crops"},{"id":"l5","t":"Intercropping"},{"id":"l6","t":"Fallow field","hints":["Which practice earns nothing that season?","The field rests.","Fallow."]},{"id":"l7","t":"Organic certification"},{"id":"l8","t":"Herbicide-tolerant GM crop"}],"right":[{"id":"r1","t":"Breaks pest and disease cycles and can add nitrogen (with legumes); needs planning and markets for several crops"},{"id":"r2","t":"Monitors pests and sprays only above a threshold; takes time and expertise"},{"id":"r3","t":"Protects soil and stores carbon; can increase herbicide use"},{"id":"r4","t":"Protect soil between cash crops; cost seed and labour"},{"id":"r5","t":"Two crops in one field raise biodiversity; harder to harvest"},{"id":"r6","t":"Rests a field to restore moisture and nutrients; no income that season"},{"id":"r7","t":"Prohibits synthetic pesticides, synthetic fertilizers and GMOs; usually earns a price premium"},{"id":"r8","t":"Survives a specific herbicide, making weed control simpler; risks resistant weeds if overused"}],"_a":"GhdVBEECQBRQFxUXDwpAXENHCxdPGg5VQw8bR1AaTkQNARsPQUpWRE0XVQBBAkAUVBcVFw8OQFxDRw8XTxoOUUMPG0dUGk5EDQ0bD0FKWkQc","wrong":{"l3|r4":"Cover crops are planted plants; no-till is about not ploughing.","l4|r3":"Cover crops are planted plants; no-till is about not ploughing.","l2|r7":"IPM can be used in conventional or organic systems; certification is a separate standard.","l7|r2":"IPM can be used in conventional or organic systems; certification is a separate standard."},"wrongDefault":"Read the trade-off half carefully."},{"id":"cases","type":"mc","title":"Trade-off cases","summary":"Trade-off cases","star":true,"goal":[3,4,5],"instruction":"Choose the best answer for each case. Cases 3 to 6 are non-routine (★).","items":[{"id":"t1","goal":4,"prompt":"A shopper buys “GMO-free” potato chips believing they’re healthier. What should the shopper know?","options":[{"t":"“GMO-free” chips are lower in calories","why":"Those labels describe how the food was produced, not its nutrition. Check the Nutrition Facts table.","_n":"1ke93","_k":"51edb7a5"},{"t":"“GMO-free” means the chips are organic","why":"Separate claims: “GMO-free” and organic are different labels.","_n":"1lf43","_k":"360f71fe"},{"t":"They’re healthier","why":"GMO status says nothing about fat or sodium.","_n":"1mf33","_k":"b2c4eb48"},{"t":"The label describes production, not nutrition; check the Nutrition Facts table","why":"Those labels describe how the food was produced, not its nutrition. Check the Nutrition Facts table.","_n":"1n7a2","_k":"1b98c926"}]},{"id":"t2","goal":5,"prompt":"A farm switches to organic. Which change is required?","options":[{"t":"Stop using synthetic pesticides and fertilizers, and follow a transition period before certification","why":"Organic standards prohibit synthetic pesticides and fertilizers, and a farm must follow a transition period before it can be certified.","_n":"1o7b2","_k":"121f21b0"},{"t":"Stop using all pesticides","why":"Certified organic farms may use certain approved pesticides, mostly from natural sources; synthetic pesticides are prohibited.","_n":"1p7c2","_k":"de913959"},{"t":"Plant the same crop every year","why":"Nothing requires that, and growing the same crop every year builds pests up.","_n":"1q7d2","_k":"11a1eb67"},{"t":"Switch to GM seed","why":"GMOs are prohibited in organic production.","_n":"1r762","_k":"f12ee30e"}]},{"id":"t3","goal":3,"prompt":"A Prairie farm grows herbicide-tolerant canola every year with one herbicide. Weed control is failing. What’s the best plan?","options":[{"t":"Keep the same herbicide; it will start working again","why":"Repeating one herbicide selects for weeds that survive it. Rotating crops and methods slows resistance.","_n":"1s772","_k":"8fa3b6d6"},{"t":"Spray twice as much","why":"That speeds up resistance. Repeating one herbicide selects for weeds that survive it. Rotating crops and methods slows resistance.","_n":"1t782","_k":"17f21b4a"},{"t":"Switch to another brand of the same herbicide","why":"Same herbicide, same selection: the weeds that survive it keep spreading.","_n":"1u792","_k":"31569f32"},{"t":"Rotate crops and herbicide modes of action, and add other tactics (IPM, cover crops)","why":"Repeating one herbicide selects for weeds that survive it. Rotating crops and methods slows resistance.","_n":"1v722","_k":"717b95d9"}]},{"id":"t4","goal":[3,4],"prompt":"A greenhouse grows tomatoes year-round, through the winter. Which summary of the trade-offs is most accurate?","options":[{"t":"Greenhouse tomatoes are always organic","why":"How a crop is grown and whether it’s certified organic are separate questions.","_n":"1w732","_k":"78b0da9e"},{"t":"Local supply in winter and less pesticide drift, but high energy use for heat and light","why":"Greenhouses keep local tomatoes coming in winter, with less pesticide drift, but heating and lighting use a lot of energy.","_n":"1x802","_k":"ec0cd66c"},{"t":"No downsides","why":"Heating and lighting use a lot of energy (see module 16, prediction 4).","_n":"1y7f2","_k":"f274a90d"},{"t":"Greenhouses can’t grow food in a Canadian winter","why":"They can: heat and light make winter growing possible, at an energy cost.","_n":"1z7e2","_k":"a0693e31"}]},{"id":"t5","goal":[3,4],"prompt":"A salmon farm in open-net pens versus a land-based farm. Which comparison is most accurate?","options":[{"t":"Open nets cost less but risk escapes and sea lice spread; land-based systems contain fish but use more energy and cost more","why":"Each system trades cost and energy against escapes and sea lice.","_n":"207d2","_k":"2acf44ac"},{"t":"Open nets have no effect on wild fish","why":"Escapes and sea lice can reach wild salmon.","_n":"217c2","_k":"aa02d831"},{"t":"Land-based has no trade-offs","why":"Energy and cost are real trade-offs.","_n":"227b2","_k":"25613a8f"},{"t":"The two systems are the same","why":"Where the fish live changes the risks and the costs.","_n":"237a2","_k":"dd893735"}]},{"id":"t6","goal":4,"prompt":"You want to test whether cover crops improve soil on your school garden beds. Which design is fairest?","options":[{"t":"Ask gardeners whether cover crops help","why":"Opinions aren’t measurements; compare matched beds.","_n":"24792","_k":"629a9f3a"},{"t":"One bed with cover crops, compared with last year","why":"Weather and other changes are confounded; you need a control group at the same time.","_n":"25782","_k":"dccad9d2"},{"t":"Several matched beds: half with cover crops, half without, same soil, crop and watering; measure soil organic matter before and after","why":"Only the cover crop differs, and both groups are measured at the same time.","_n":"26772","_k":"4669b4ad"},{"t":"Cover crops on the sunniest beds, none on the shady ones","why":"Sun is a second difference between the groups; keep everything else the same.","_n":"277e3","_k":"109e02ea"}],"hints":["What’s the one thing you change?","Keep everything else the same, and compare at the same time.","Matched beds, with and without cover crops."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Ronit","goal":[1,2,4],"instruction":"Ronit made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":1,"task":"Explain what certified organic means in Canada.","steps":["“Organic farms are certified under national standards.”","“Organic farms use no pesticides of any kind.”","“They don’t use synthetic fertilizers or GMOs.”"],"_a":"UA==","stepFb":["Step 1 is correct.","","Step 3 is correct, but an earlier step isn’t."],"fixes":[{"t":"“Organic farms use more pesticides than conventional farms.”","why":"That doesn’t fix step 2. Certified organic farms may use certain approved pesticides, mostly from natural sources; synthetic pesticides are prohibited.","_n":"287f3","_k":"090694f2"},{"t":"“Step 2 is correct.”","why":"Certified organic farms may use certain approved pesticides, mostly from natural sources; synthetic pesticides are prohibited.","_n":"297c3","_k":"02319396"},{"t":"“Synthetic pesticides are prohibited; certain approved non-synthetic pesticides may be used.”","why":"Certified organic farms may use certain approved pesticides, mostly from natural sources; synthetic pesticides are prohibited.","_n":"2a7d3","_k":"6370b3da"},{"t":"“Organic farms may use GMOs.”","why":"GMOs are prohibited in organic production.","_n":"2b7a3","_k":"01fd9d83"}],"hints":["Are all pesticides synthetic?","Some come from natural sources.","The fix: synthetic pesticides are prohibited; certain approved non-synthetic pesticides may be used."]},{"id":"e2","goal":2,"task":"Evaluate switching a conventional field to no-till.","steps":["“No-till leaves crop residue on the surface.”","“This reduces soil erosion and can store more carbon.”","“Since nothing else changes, no-till has no downsides.”","“Every farm should switch immediately.”"],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"“No-till is banned in Canada.”","why":"It isn’t banned. The problem is the claim that it has no downsides.","_n":"2c7b3","_k":"ecfb3aed"},{"t":"“Without tillage, weeds are often controlled with more herbicide, so no-till has trade-offs.”","why":"No-till protects soil and stores carbon, but it can increase reliance on herbicides to control weeds.","_n":"2d783","_k":"bf45f2df"},{"t":"“Step 3 is correct.”","why":"No-till protects soil and stores carbon, but it can increase reliance on herbicides to control weeds.","_n":"2e793","_k":"4256d5c4"},{"t":"“No-till increases erosion.”","why":"Step 2 is right: no-till reduces erosion. No-till protects soil and stores carbon, but it can increase reliance on herbicides to control weeds.","_n":"2f763","_k":"34d7322c"}],"hints":["What did tillage do to weeds?","It buried them.","The fix: without tillage, weeds are often controlled with more herbicide, so no-till has trade-offs."]},{"id":"e3","goal":4,"task":"Decide whether GM canola oil is safe to eat.","steps":["“GM canola is assessed by Health Canada before sale.”","“I found one blog saying GM oil is dangerous.”","“So the evidence is split 50-50.”","“So no one can say whether it’s safe.”"],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 reports a source; the question is how much weight it deserves.","","Step 4 follows step 3."],"fixes":[{"t":"“Health Canada never reviews food.”","why":"Step 1 is right: GM foods are assessed before sale.","_n":"2g773","_k":"ef3aeb94"},{"t":"“Blogs are always wrong.”","why":"Weigh evidence by quality, not by count. A blog isn’t always wrong, but one blog can’t outweigh major reviews.","_n":"2h643","_k":"a2436cb7"},{"t":"“Step 3 is correct.”","why":"Major scientific bodies have concluded that approved GM foods are as safe to eat as their conventional counterparts. The live debates are environmental, economic and social.","_n":"2i633","_k":"dd2b7031"},{"t":"“One blog doesn’t balance reviews by major scientific bodies, which conclude approved GM foods are as safe as conventional ones.”","why":"Major scientific bodies have concluded that approved GM foods are as safe to eat as their conventional counterparts. The live debates are environmental, economic and social.","_n":"2j663","_k":"582d6c54"}],"hints":["Should one blog count the same as a national science review?","Weigh evidence by quality, not by count.","The fix: one blog doesn’t balance reviews by major scientific bodies, which conclude approved GM foods are as safe as conventional ones."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which readout in the Four fields surprised you most, and why?"},{"id":"j2","q":"In your own words, explain why using the same herbicide every year leads to resistant weeds."},{"id":"j3","q":"Explain to a friend the difference between “GM foods are unsafe” and “there are real debates about GM crops”."},{"id":"j4","q":"When you buy food, which of today’s trade-offs matters most to you, and what would help you decide?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which crops make up most of Canada’s GM acreage?","options":[{"t":"Canola, corn, soybeans and sugar beets","why":"In Canada, GM crops are mainly canola, corn, soybeans and sugar beets.","_n":"2k653","_k":"a2f8d502"},{"t":"Wheat, oats and barley","why":"No GM wheat is grown commercially in Canada.","_n":"2l683","_k":"9c4e19b7"},{"t":"Blueberries and maple","why":"Not GM crops.","_n":"2m673","_k":"174c4341"},{"t":"Apples, potatoes and tomatoes only","why":"A few exist, but they aren’t most of the acreage.","_n":"2n6a3","_k":"134ec850"}]},"b":{"prompt":"Which is allowed on a certified organic farm in Canada?","options":[{"t":"Any pesticide used before sunrise","why":"No such rule.","_n":"2o693","_k":"54a6d94d"},{"t":"Synthetic nitrogen fertilizer","why":"Prohibited.","_n":"2p6c3","_k":"e6ca5a44"},{"t":"GM seed","why":"Prohibited.","_n":"2q6b3","_k":"7a387d88"},{"t":"Certain approved non-synthetic pesticides","why":"Certified organic farms may use certain approved pesticides, mostly from natural sources; synthetic pesticides are prohibited.","_n":"2r26e","_k":"97496bfa"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which practice involves monitoring pests and acting only when they pass a threshold?","options":[{"t":"Integrated pest management","why":"IPM monitors pests and acts only above a threshold, combining methods.","_n":"2s25e","_k":"2dad82c4"},{"t":"Fallow","why":"That’s resting a field.","_n":"2t24e","_k":"227afd51"},{"t":"Intercropping","why":"That’s growing two crops together.","_n":"2u23e","_k":"f677c417"},{"t":"No-till","why":"That’s about not ploughing.","_n":"2v2ae","_k":"5e22a9b6"}]},"b":{"prompt":"Which practice rests a field for a season to restore moisture and nutrients?","options":[{"t":"Cover crops","why":"Cover crops are planted plants.","_n":"2w29e","_k":"34e6207f"},{"t":"Integrated pest management","why":"That’s about pests.","_n":"2x28e","_k":"18ac6c99"},{"t":"Crop rotation","why":"Rotation changes the crop; fallow plants nothing.","_n":"2y27e","_k":"6f4fe87f"},{"t":"Fallow","why":"A fallow field is left unplanted for a season to recover.","_n":"2z1ee","_k":"1fef07e8"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"In Canada, who assesses a new GM food before it can be sold?","options":[{"t":"Health Canada, with the CFIA for environmental and feed aspects","why":"Canada assesses each GM food before sale: Health Canada for food safety, the CFIA for environmental and feed aspects.","_n":"301de","_k":"5d321ffc"},{"t":"Provincial school boards","why":"Not their role.","_n":"3120d","_k":"b0aa0af4"},{"t":"Grocery chains","why":"They follow federal rules.","_n":"3221d","_k":"bff68da2"},{"t":"No one; GM foods are unregulated","why":"Major scientific bodies have concluded that approved GM foods are as safe to eat as their conventional counterparts. The live debates are environmental, economic and social.","_n":"3322d","_k":"6d81b99c"}]},"b":{"prompt":"Is labelling GM foods mandatory in Canada?","options":[{"t":"Only for imported foods","why":"There’s no such rule.","_n":"3423d","_k":"c67dc446"},{"t":"Yes, every GM ingredient must be listed","why":"Labelling is voluntary.","_n":"3524d","_k":"21d86d4c"},{"t":"GM foods are banned, so labels aren’t needed","why":"GM foods are approved and sold.","_n":"3625d","_k":"7d3be962"},{"t":"No; GM labelling is voluntary, but it must be truthful and not misleading","why":"In Canada, GM labelling is voluntary, and any GM claim must be truthful and not misleading.","_n":"3726d","_k":"e690b087"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Two farms grow herbicide-tolerant canola. Farm X uses one herbicide every year. Farm Y rotates crops and herbicides. After 5 years, which is most likely?","options":[{"t":"Farm Y has more resistance","why":"Rotation slows resistance.","_n":"3827d","_k":"a46c13ce"},{"t":"Farm X has more herbicide-resistant weeds","why":"Repeated selection favours resistant weeds.","_n":"3918d","_k":"6173344a"},{"t":"Neither has resistance; GM crops prevent it","why":"Repeating one herbicide selects for weeds that survive it. Rotating crops and methods slows resistance.","_n":"3a19d","_k":"034b3474"},{"t":"Both have identical weeds","why":"Practices change outcomes.","_n":"3b92e","_k":"3705e37f"}]},"b":{"prompt":"In the model, a GM field with IPM and cover crops but no rotation reaches an index of 45. What single change best brings it below 40?","options":[{"t":"Switch the herbicide brand but keep everything else","why":"The model treats rotation as the main lever; one swap doesn’t break the pattern.","_n":"3c91e","_k":"a42fe35d"},{"t":"Run more seasons","why":"The index keeps climbing.","_n":"3d94e","_k":"b2964b73"},{"t":"Remove cover crops","why":"That raises the index.","_n":"3e93e","_k":"e32b4ba5"},{"t":"Add crop rotation","why":"The increment drops from 9 to 0: index 0.","_n":"3f96e","_k":"74c7d3b4"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A website says organic apples are “far more nutritious” and cites one small study. How should you judge this claim?","options":[{"t":"Strong, because it cites a study","why":"One study doesn’t outweigh reviews.","_n":"3g95e","_k":"2855512d"},{"t":"Weak: one small study, while systematic reviews find small or inconsistent differences","why":"Studies find small or inconsistent nutrient differences. Organic produce does tend to carry fewer pesticide residues.","_n":"3h98e","_k":"38aed3c0"},{"t":"Proven, because organic means healthier","why":"Those labels describe how the food was produced, not its nutrition. Check the Nutrition Facts table.","_n":"3i97e","_k":"e2b91ca5"},{"t":"Impossible to judge","why":"You can compare it with reviews.","_n":"3j9ae","_k":"885050b4"}]},"b":{"prompt":"A friend says, “Scientists are split on whether GM food is safe to eat.” Which response is most accurate?","options":[{"t":"“Major scientific bodies agree approved GM foods are safe to eat; the debates are about environmental and economic issues.”","why":"Major scientific bodies have concluded that approved GM foods are as safe to eat as their conventional counterparts. The live debates are environmental, economic and social.","_n":"3k99e","_k":"f0980f0a"},{"t":"“Yes, it’s 50-50.”","why":"Major scientific bodies have concluded that approved GM foods are as safe to eat as their conventional counterparts. The live debates are environmental, economic and social.","_n":"3lace","_k":"10659284"},{"t":"“GM foods are banned in Canada.”","why":"They’re approved and sold.","_n":"3made","_k":"056be84a"},{"t":"“No GM food has ever been tested.”","why":"Approved GM foods are assessed.","_n":"3naae","_k":"f37e8200"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Why does reducing antibiotic use in livestock matter for people?","options":[{"t":"Animals become allergic to antibiotics","why":"Not the main concern.","_n":"3oabe","_k":"610fbdc2"},{"t":"Overuse can help antibiotic-resistant bacteria develop, which can make human infections harder to treat","why":"Overusing antibiotics in animals can contribute to antibiotic-resistant bacteria that affect people.","_n":"3pa8e","_k":"3d8da7e0"},{"t":"Antibiotics make meat taste different","why":"Not the issue.","_n":"3qa9e","_k":"e7e4733f"},{"t":"It doesn’t matter for people","why":"Resistance can spread between animals, people and the environment.","_n":"3ra6e","_k":"b1be9213"}]},"b":{"prompt":"Which policy best addresses antibiotic resistance from farming?","options":[{"t":"Banning all veterinary medicine","why":"Sick animals need treatment.","_n":"3sa7e","_k":"4db99a87"},{"t":"Allowing medically important antibiotics only under veterinary oversight, with no growth-promotion use","why":"Sick animals still get treatment, and overuse that drives resistance is cut.","_n":"3ta4e","_k":"b4efeee8"},{"t":"Labelling meat as “natural”","why":"Labels don’t change practice.","_n":"3ua5e","_k":"e72513cf"},{"t":"Adding antibiotics to all feed","why":"That increases resistance.","_n":"3v1ee","_k":"c7da2d8c"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which sentence best explains why no farming system is “best”?","options":[{"t":"“Conventional is best at everything.”","why":"Every system wins on some readouts and loses on others. “Best” depends on which goal you’re optimizing.","_n":"3w1de","_k":"b0c15e20"},{"t":"“Organic is best at everything.”","why":"Every system wins on some readouts and loses on others. “Best” depends on which goal you’re optimizing.","_n":"3x1ce","_k":"37f4e5f0"},{"t":"“Each system performs well on some goals (yield, soil, inputs, biodiversity, cost) and less well on others, so the best choice depends on which goals matter most.”","why":"Every system wins on some readouts and loses on others. “Best” depends on which goal you’re optimizing.","_n":"3y1be","_k":"0f37709f"},{"t":"“All systems are identical.”","why":"The readouts differ.","_n":"3z1ae","_k":"4c8e351c"}]},"b":{"prompt":"Which sentence best describes crop rotation’s effect in the model?","options":[{"t":"“Rotation only affects cost.”","why":"It changes yield, soil, inputs and resistance.","_n":"4019e","_k":"d1e738af"},{"t":"“Rotation makes a farm organic.”","why":"Certification is separate.","_n":"4118e","_k":"6614c7e3"},{"t":"“Rotation lowers every readout.”","why":"It improves several.","_n":"4217e","_k":"cd6551b7"},{"t":"“Rotation raises yield and soil health a little and strongly slows herbicide resistance.”","why":"In the model, rotation adds 5 yield and 10 soil health, and cuts the yearly resistance increase from 15 to 6.","_n":"4326e","_k":"3c9f6d2d"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the clearest way to describe the “GMO-free” label?","options":[{"t":"“It tells you the food wasn’t made with genetically modified ingredients; it doesn’t tell you whether the food is nutritious.”","why":"Those labels describe how the food was produced, not its nutrition. Check the Nutrition Facts table.","_n":"4425e","_k":"ca89b0dd"},{"t":"“It means the food is organic.”","why":"Separate claims.","_n":"4598e","_k":"0a40e4df"},{"t":"“It means the food is from Canada.”","why":"Origin is a separate claim.","_n":"4699e","_k":"7221d679"},{"t":"“It means the food is healthier.”","why":"Those labels describe how the food was produced, not its nutrition. Check the Nutrition Facts table.","_n":"479ae","_k":"376e6b40"}]},"b":{"prompt":"Which statement about pesticide residues is best supported?","options":[{"t":"“Most monitored Canadian produce has residues below Health Canada’s limits; farmworkers face higher exposure than eaters.”","why":"Monitoring finds most samples within the limits, and occupational exposure is far higher than dietary exposure.","_n":"489be","_k":"5f09b487"},{"t":"“Residues never exist on conventional produce.”","why":"Some do, mostly below limits.","_n":"4994e","_k":"bdb656bf"},{"t":"“All produce is contaminated to dangerous levels.”","why":"Monitoring doesn’t show that.","_n":"4a95e","_k":"b995ca2a"},{"t":"“Washing makes residues more dangerous.”","why":"Washing removes some residue.","_n":"4b96e","_k":"5c2672f2"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"A farmer’s field is losing topsoil to wind every spring. Which pair of practices helps most?","options":[{"t":"Fallow with bare soil","why":"Bare fallow can increase erosion.","_n":"4c97e","_k":"1e81c97e"},{"t":"Switching to GM seed only","why":"Seed type alone doesn’t cover the soil.","_n":"4da0e","_k":"d679ac9e"},{"t":"Ploughing twice and leaving the field bare","why":"That increases erosion.","_n":"4ea1e","_k":"cf790fb2"},{"t":"No-till and cover crops","why":"Both keep the soil covered.","_n":"4f2af","_k":"cb5b68d6"}]},"b":{"prompt":"A vegetable farm faces rising pest damage but wants to cut pesticide use. Which plan fits?","options":[{"t":"Spraying on a fixed weekly schedule","why":"That ignores whether the pests are there.","_n":"4g29f","_k":"270675b0"},{"t":"Growing the same crop every year","why":"That builds pests up.","_n":"4h2cf","_k":"dbd957c5"},{"t":"Stopping all pest control","why":"Losses could be severe.","_n":"4i2bf","_k":"80feb559"},{"t":"IPM with monitoring and thresholds, plus crop rotation","why":"IPM sprays only when pests pass a threshold, and rotation breaks pest cycles.","_n":"4j26f","_k":"edb54dc1"}]}},{"id":"a2","cat":"A","goal": ,"Cover crops and intercropping each add 5 to cost; IPM and no-till save 5."],"after3":"Every plan uses rotation and IPM. No organic plan meets this yield target in the model, though organic earns a price premium this task doesn’t count. Change the goals and the best plan changes.","explainPrompt":"Explain why your plan meets all five goals, and name one trade-off you accepted.","vocab":"Use the words rotation, resistance, soil health and trade-off.","success":"Your plan meets all five goals!"},"cards":[["Conventional farming","Uses approved synthetic fertilizers and pesticides; often higher yields."],["Certified organic (Canada)","Follows the Canadian Organic Standards: no synthetic pesticides or fertilizers, no GMOs."],["Genetically modified (GM) crop","A crop whose DNA was changed using genetic engineering, e.g. herbicide-tolerant canola."],["Herbicide-resistant weeds","Weeds that survive a herbicide after repeated use selects for them."],["Crop rotation","Changing crops in a field over seasons to break pest cycles and build soil."],["Integrated pest management (IPM)","Monitor pests and act only above a threshold, combining methods."],["No-till","Planting without ploughing; protects soil, but may increase herbicide use."],["Cover crop","A crop grown to protect and improve soil between cash crops."],["Intercropping","Growing two or more crops together in one field."],["Fallow","Leaving a field unplanted for a season to recover."],["Maximum residue limit","The highest legal pesticide residue on a food, set by Health Canada."],["Antibiotic resistance","Bacteria that survive antibiotics; overuse in people or animals speeds it up."]]}};</script>
