.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 19: hero (budget bar), Household food security explorer (waterfalls, policy table, switches, readout, components),
   Policy or charity? (research cards, sorter, desks), Reading the data, Write to the right desk.
   Plan colours: money bars --ink-2; food basket brown (--p-b / --plate-grain-soft); the gap --hi (--hi-soft in dark mode);
   strained components cerulean (--p-t) with icons and the word "strained". Red and green appear only in feedback marks.
   Status chips use tokens and always carry their word. */
:root{--fsc-gap:var(--hi)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--fsc-gap:var(--hi-soft)} }
:root[data-theme="dark"]{--fsc-gap:var(--hi-soft)}

/* radio groups and switches (from HFA4U 12 / 09) */
.fsc-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.fsc-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:5.6rem}
.fsc-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.fsc-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fsc-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%;color:var(--ink)}
.fsc-chipset button:hover:not(:disabled){border-color:var(--pen)}
.fsc-chipset button[aria-checked="true"],.fsc-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fsc-chipset button:disabled{opacity:.55}
.fsc-h4{margin:0 0 6px;font-size:1rem}
.fsc-h5{margin:14px 0 6px;font-size:.95rem}
.fsc-lit{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi);border-radius:4px}
.fsc-sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:44px;font-size:.92rem}
.fsc-sw:hover{border-color:var(--pen)}
.fsc-swt{position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;border:2px solid var(--ink-2);background:var(--paper)}
.fsc-swt i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.fsc-sw[aria-checked="true"]{border-color:var(--ink)}
.fsc-sw[aria-checked="true"] .fsc-swt{background:var(--hi);border-color:var(--ink)}
.fsc-sw[aria-checked="true"] .fsc-swt i{left:18px;background:var(--ink)}
.fsc-swl{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.fsc-swl small{font-size:.8rem;color:var(--ink-2);line-height:1.3}
.fsc-swv{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-2);min-width:1.8rem;text-align:right}
.fsc-sw[aria-checked="true"] .fsc-swv{color:var(--ink)}
@media (prefers-reduced-motion:reduce){ .fsc-swt i{transition:none} }

/* hero */
.fsc-hero{width:100%}
.fsc-hsvg{display:block;width:100%;height:auto}
.fsc-hinc{fill:var(--ink-2)}
.fsc-hhb{fill:var(--paper)}
.fsc-hhl{stroke:var(--ink-2);stroke-width:3}
.fsc-hcost{fill:url(#fsc-hatch);stroke:var(--ink-2);stroke-width:1.5}
.fsc-hbas{fill:var(--plate-grain-soft);stroke:var(--p-b);stroke-width:2}
.fsc-hmark{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 4}
.fsc-hgap{fill:var(--fsc-gap);stroke:var(--hi);stroke-width:2}
.fsc-hglow{fill:none;stroke:var(--hi);stroke-width:6}
.fsc-hl{font:700 15px var(--font-ui);fill:var(--ink)}
.fsc-hs{font:400 13px var(--font-ui);fill:var(--ink)}
.fsc-hon{font-weight:700;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.fsc-hcap{font:700 17px var(--font-ui);fill:var(--ink)}

/* explorer layout */
.fsc-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.fsc-top .fsc-rgw{margin:0}
.fsc-lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"pick pick" "vis side" "ctl side";gap:14px 24px;align-items:start;margin-top:6px}
.fsc-pick{grid-area:pick;min-width:0}
.fsc-pick .fsc-rgw{margin-bottom:6px}
.fsc-vis{grid-area:vis;min-width:0}
.fsc-ctl{grid-area:ctl;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;border-top:1.5px solid var(--rule);padding-top:12px}
.fsc-side{grid-area:side;min-width:0;border-left:1.5px solid var(--rule);padding-left:18px}
.fsc-sws{display:grid;gap:6px}
.fsc-offw{margin-top:10px}
.fsc-read dd{font-size:.95rem}
.fsc-read > div.fsc-lit{padding-left:6px;padding-right:6px}

/* budget waterfall */
.fsc-panels{display:grid;gap:16px}
.fsc-panels.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fsc-panel{min-width:0}
.fsc-ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin-bottom:6px}
.fsc-ph .fsc-h4{margin:0}
.fsc-wf{display:grid;gap:6px}
.fsc-wr{min-width:0;padding:1px 2px}
.fsc-wl{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;line-height:1.25}
.fsc-wl b{white-space:nowrap}
.fsc-wt{position:relative;height:20px;border-bottom:1px solid var(--rule)}
.fsc-wb{position:absolute;top:2px;bottom:2px;border-radius:3px;box-sizing:border-box}
.fsc-wb.money{background:var(--ink-2)}
.fsc-wb.cost{background:repeating-linear-gradient(45deg,var(--ink-2) 0 2px,transparent 2px 7px);border:1.5px solid var(--ink-2)}
.fsc-wb.basket{background:var(--plate-grain-soft);border:2px solid var(--p-b)}
.fsc-wm{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--ink)}
.fsc-wg{position:absolute;top:0;bottom:0;background:var(--fsc-gap);border:2px solid var(--hi);border-radius:3px;box-sizing:border-box;min-width:4px}
.fsc-wg.glow{box-shadow:0 0 0 3px var(--hi)}
.fsc-wsp{position:absolute;top:2px;bottom:2px;border:2px dashed var(--ink-2);border-radius:3px;box-sizing:border-box}
.fsc-gl{margin:10px 0 8px;font-size:.95rem;padding:2px 4px}
.fsc-key{margin:10px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.fsc-kk{display:inline-block;width:18px;height:11px;border-radius:2px;vertical-align:-1px;box-sizing:border-box}
.fsc-kk.money{background:var(--ink-2)}
.fsc-kk.cost{background:repeating-linear-gradient(45deg,var(--ink-2) 0 2px,transparent 2px 6px);border:1px solid var(--ink-2)}
.fsc-kk.basket{background:var(--plate-grain-soft);border:2px solid var(--p-b)}
.fsc-kk.gap{background:var(--fsc-gap);border:2px solid var(--hi)}

/* status chips (word always shown; severity runs outline → yellow tint → orange tint → solid orange) */
.fsc-st{display:inline-block;font-size:.82rem;font-weight:700;border-radius:999px;padding:.1em .7em;border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);white-space:nowrap}
.fsc-st.marginal{background:var(--hi-soft);border-color:var(--hi)}
.fsc-st.moderate{background:var(--nu-carb-soft);border-color:var(--nu-carb)}
.fsc-st.severe{background:var(--nu-carb);border-color:var(--nu-carb);color:var(--sheet)}

/* the five components */
.fsc-ci{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fsc-comps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.fsc-comp{display:inline-flex;align-items:center;gap:5px;font-size:.85rem;border:1.5px dashed var(--rule);color:var(--ink-2);border-radius:999px;padding:.15em .65em}
.fsc-comp.on{border:2px solid var(--p-t);color:var(--p-t);font-weight:700}
.fsc-cs{font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
.fsc-cmsg{margin:8px 0 0;padding:4px 6px 4px 22px;font-size:.9rem}
.fsc-cmsg li{margin:2px 0}

/* policy table (stacked cards on phones) */
.fsc-ptab{border-collapse:collapse;width:100%;font-size:.92rem}
.fsc-ptab caption{text-align:left;font-weight:700;padding:0 0 6px}
.fsc-ptab th,.fsc-ptab td{border-bottom:1px solid var(--rule);padding:7px 8px;text-align:left;vertical-align:top}
.fsc-ptab thead th{font-size:.82rem;color:var(--ink-2)}
.fsc-ptab tr.fsc-lit{box-shadow:none}
.fsc-ptab tr.fsc-lit > *{background:var(--hi-soft)}
.fsc-meter{display:block;height:8px;max-width:9rem;margin-top:5px;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden}
.fsc-meter i{display:block;height:100%;background:var(--fsc-gap)}
.fsc-delta{font-weight:700;background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:0 .3em;white-space:nowrap}
.fsc-cl{display:flex;flex-wrap:wrap;gap:4px}
.fsc-ctag{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--p-t);border:1.5px solid var(--p-t);border-radius:999px;padding:0 .55em}
.fsc-ctag .fsc-ci{width:15px;height:15px}

/* about + support */
.fsc-about{margin-top:16px}
.fsc-aboutw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px 24px;margin-top:8px}
.fsc-rules{margin:0 0 8px;padding-left:20px;font-size:.92rem}
.fsc-rules li{margin:3px 0}
.fsc-abt{margin:6px 0 4px}
.fsc-sup{margin-top:14px}

/* Part 3 */
.fsc-stok{font-weight:700}
.fsc-station{margin-top:8px}
.fsc-rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:12px}
.fsc-rcard{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet);min-width:0}
.fsc-rn{margin:0 0 4px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.fsc-rt{margin:0 0 8px}
.fsc-rd{margin:0}
.fsc-cmpt{margin:8px 0 4px}
.fsc-ctab{border-collapse:collapse;font-size:.88rem;min-width:100%}
.fsc-ctab th,.fsc-ctab td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.fsc-ctab thead th{font-size:.8rem;color:var(--ink-2)}
.fsc-rtake{margin:8px 0 0;font-size:.92rem}
.fsc-desks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fsc-desk{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;min-width:0}
.fsc-desk.right{border-color:var(--green)}
.fsc-desk.wrong{border-color:var(--red)}
.fsc-desk .fsc-rgw{margin:4px 0 0}
.fsc-dpt{margin:0}
.fsc-dmk{font-weight:700}
.fsc-desk.right .fsc-dmk{color:var(--green)}
.fsc-desk.wrong .fsc-dmk{color:var(--red)}
.fsc-dfb{margin:4px 0 0}
.fsc-dfb:empty{display:none}

/* Practice 2 */
.fsc-dtab{margin:0 0 10px}
.fsc-dtt{margin:0 0 4px}

/* task */
.fsc-tin .fsc-rgw{flex-direction:column;align-items:flex-start}
.fsc-tevw p{margin:4px 0 0}
.fsc-letter{min-height:260px}
.fsc-tcard{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.fsc-models{margin-top:12px}
.fsc-mletter{white-space:pre-wrap;font-size:.92rem;border-left:3px solid var(--rule);padding-left:10px;max-width:none}
.fsc-rubric{margin:8px 0 10px}
.fsc-rubric ul{margin:6px 0 0;padding-left:20px}

@media (max-width:820px){
  .fsc-lab{grid-template-columns:minmax(0,1fr);grid-template-areas:"pick" "vis" "ctl" "side"}
  .fsc-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .fsc-aboutw{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .fsc-ctl,.fsc-panels.two,.fsc-desks{grid-template-columns:minmax(0,1fr)}
  .fsc-rgl{min-width:0;width:100%}
  .fsc-ptab thead{display:none}
  .fsc-ptab caption{display:block;width:auto}
  .fsc-ptab,.fsc-ptab tbody,.fsc-ptab tr,.fsc-ptab th,.fsc-ptab td{display:block;width:auto}
  .fsc-ptab tr{border:1.5px solid var(--rule);border-radius:8px;margin:0 0 10px;padding:4px 0}
  .fsc-ptab th,.fsc-ptab td{border-bottom:0;padding:4px 10px}
  .fsc-ptab td::before{content:attr(data-label);display:block;font-size:.78rem;font-weight:700;color:var(--ink-2)}
}

</style>
</head>

<script>window.MV_PAYLOAD={"meta":{"id":"19-food-security-canada","nn":"19","slug":"food-security-canada","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 4","groupName":"Canadian Food Systems","trivium":"","size":"M","storageKey":"hfa4u-19-food-security-canada-v1","progressKey":"hfa4u-progress-v1:19-food-security-canada","toolkit":"1.0.9"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"4818c1a9","content":{"id":"19-food-security-canada","kind":"topic","title":"Food security in Canada","topic":"Food Security in Canada","readyTopic":"food security in Canada","hero":{"headline":"Food insecurity is a money problem before it’s a food problem.","text":"In Canada, most people who struggle to get enough nutritious food live near full grocery stores. The problem is \u003cstrong>access\u003c/strong>: income that can’t cover rent, essentials \u003cem>and\u003c/em> a \u003cstrong>nutritious food basket\u003c/strong>. In this module you’ll test \u003cstrong>five components of food security\u003c/strong>, see what really closes the gap, and take your findings to the people who decide.","fig":{"html":"\u003cdiv class=\"fsc-hero\" id=\"fsc-hero\">\u003c/div>","caption":""},"aria":"A budget bar fills with $3,400 of monthly income. Rent and utilities, $1,850, slide in and cover part of it; other essentials, $650, cover more. $900 is left for food, beside a nutritious food basket bar of $1,000. The $100 gap glows: 10% short every month.","caption":"Model data: one household’s month. $900 is left for food after rent and essentials; a nutritious food basket costs $1,000."},"goals":["I can define food security and explain its five components: availability, accessibility, adequacy, acceptability and sustainability.","I can explain why household food insecurity in Canada is mainly about income compared with costs.","I can analyse how social, cultural and economic factors make some groups more likely to experience food insecurity.","I can explain the links among poverty, food insecurity, poor nutrition and poor health.","I can evaluate responses to food insecurity: food banks, school food programs, income supports and community programs.","I can take informed action, such as writing to the level of government that decides a policy."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If you or your family are having a hard time getting enough food, you’re not alone and it isn’t your fault. You can talk to someone you trust at school, call or text \u003cspan class=\"nw\">211\u003c/span> to find local food programs and supports, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>).\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Canada’s Food Guide","goal":1,"prompt":"According to Canada’s Food Guide (2019), what should fill about half of a plate?","options":[{"t":"Vegetables and fruits","why":"Half the plate is vegetables and fruits.","_n":"0380","_k":"4997dd44"},{"t":"Whole grain foods","why":"Whole grains are about a quarter.","_n":"1350","_k":"4b0ce08b"},{"t":"Protein foods","why":"Protein foods are about a quarter.","_n":"2360","_k":"cbd1c567"},{"t":"Milk and alternatives","why":"The 2019 guide has no separate milk group.","_n":"3330","_k":"c2825b0b"}],"hints":["Picture the plate.","Two quarters are grains and protein.","Vegetables and fruits."]},{"id":"w2","skill":"Canada’s Food Guide","goal":1,"prompt":"A meal gives enough calories but almost no vegetables, fruit or protein. What is missing?","options":[{"t":"Food safety","why":"Nothing here is unsafe.","_n":"4340","_k":"30010207"},{"t":"Nothing: calories are what count","why":"Nutrients matter too.","_n":"5310","_k":"d2fdeb33"},{"t":"Food availability","why":"The food was available; the mix wasn’t nutritious.","_n":"6320","_k":"87ec8647"},{"t":"Nutritional adequacy","why":"Enough energy isn’t the same as enough nutrients.","_n":"72f0","_k":"57269dd6"}],"hints":["What does a nutritious diet need besides energy?","Vitamins, minerals, fibre, protein.","Adequacy."]},{"id":"w3","skill":"Influences on food choice","goal":3,"prompt":"Which influence on food choice most often limits what a low-income household can buy?","options":[{"t":"Lack of interest in health","why":"Low-income households care about health as much as anyone.","_n":"8300","_k":"68fdd4b7"},{"t":"Taste preferences","why":"Preferences matter, but money limits choice first.","_n":"9fd1","_k":"18ede176"},{"t":"Cost of food compared with income","why":"Money left after rent sets the limit.","_n":"afc1","_k":"5b04a9c6"},{"t":"Food advertising","why":"Ads influence, but can’t make food affordable.","_n":"bff1","_k":"c182545f"}],"hints":["Module 01’s influences: which one is a hard limit?","Think of a budget.","Cost compared with income."]},{"id":"w4","skill":"Influences on food choice","goal":3,"prompt":"A family’s nearest full grocery store is 8 km away and there’s no bus. Which influence is this?","options":[{"t":"Media influence","why":"Ads aren’t involved.","_n":"cfe1","_k":"edef81f5"},{"t":"Physical access","why":"Distance and transport limit access.","_n":"df91","_k":"7911c165"},{"t":"Cultural influence","why":"Culture shapes \u003cem>what\u003c/em> you choose, not whether you can reach a store.","_n":"ef81","_k":"b329c9d6"},{"t":"Psychological influence","why":"Mood and stress are different.","_n":"ffb1","_k":"7893a167"}],"hints":["Can they get to the store?","It’s about reaching food.","Physical access."]},{"id":"w5","skill":"Percentages","goal":2,"prompt":"A food basket costs $800 and a household has $600 for food. The gap is what percentage of the basket?","options":[{"t":"33%","why":"$200 ÷ $600 compares with the wrong amount.","_n":"gfa1","_k":"91716c45"},{"t":"75%","why":"That’s the share that \u003cem>is\u003c/em> covered.","_n":"hf51","_k":"46af761a"},{"t":"25%","why":"$200 ÷ $800 = 0.25.","_n":"if41","_k":"d21b3789"},{"t":"20%","why":"$200 ÷ $800 is 25%, not 20%.","_n":"j6b0","_k":"77fd7838"}],"hints":["Gap = basket − money for food.","$200.","200 ÷ 800 = 25%."]},{"id":"w6","skill":"Percentages","goal":2,"prompt":"Food prices rise 10%. A $1,200 basket now costs…","options":[{"t":"$1,300","why":"10% of $1,200 is $120, not $100.","_n":"k6c0","_k":"6dd9ef1c"},{"t":"$1,320","why":"$1,200 × 1.10.","_n":"l6d0","_k":"cba48763"},{"t":"$1,080","why":"That’s a 10% drop.","_n":"m6e0","_k":"2fc4134c"},{"t":"$1,210","why":"10% of $1,200 is $120.","_n":"n670","_k":"931eef51"}],"hints":["Find 10% of $1,200.","$120.","$1,320."]}],"refreshers":{"Canada’s Food Guide":"Half the plate vegetables and fruits, a quarter whole grains, a quarter protein foods; water as the drink of choice. A nutritious diet needs this mix, not just enough energy.","Influences on food choice":"Cost compared with income, physical access, time and skills, culture and religion, family and peers, mood, and marketing. Cost and access set the outer limits.","Percentages":"Gap % = gap ÷ basket × 100. A 10% price rise multiplies by 1.10."}}},"explore":{"heading":"Household food security explorer","intro":"Five households (fictional, built from patterns in Canadian research) each balance income against housing, essentials and food. Switch on supports and shocks and watch what closes the gap.","modelTag":"Model data based on patterns in Canadian research; not real people","modes":[{"id":"house","t":"Household view"},{"id":"policy","t":"Policy view"}],"households":[{"id":"H1","t":"Celine and two children (7, 12), Hamilton, renter, part-time health-care aide","name":"Celine and two children, Hamilton","chip":"Celine","short":"Celine","inc":3400,"hou":1850,"ess":650,"basket":1000,"renter":true,"kids":2},{"id":"H2","t":"the Mahmoud family, two adults and three children, Mississauga, renter, one income","name":"The Mahmoud family, Mississauga","chip":"Mahmoud family","short":"the Mahmoud family","inc":4800,"hou":2600,"ess":1000,"basket":1600,"renter":true,"kids":2},{"id":"H3","t":"Walter, 68, Thunder Bay, owns his home, public pensions","name":"Walter, 68, Thunder Bay","chip":"Walter","short":"Walter","inc":2100,"hou":700,"ess":700,"basket":400,"renter":false,"kids":0},{"id":"H4","t":"Kiara, 24, Kingston, student renting a room, part-time job","name":"Kiara, 24, Kingston","chip":"Kiara","short":"Kiara","inc":1600,"hou":900,"ess":500,"basket":450,"renter":true,"kids":0},{"id":"H5","t":"a family of four in a fly-in community in Nunavut","name":"A family of four, fly-in community in Nunavut","chip":"Nunavut family","short":"the Nunavut family","inc":5600,"hou":900,"ess":2100,"basket":2900,"renter":false,"kids":2,"north":true}],"supports":[{"id":"P1","t":"Income top-up","eff":"+$300 a month for every household (models a stronger income floor: benefits, wages or pensions)","amt":300},{"id":"P2","t":"Rent subsidy","eff":"−$400 rent; renters only (H1, H2, H4)","amt":400,"who":"renters only"},{"id":"P3","t":"School meals","eff":"−$80 a month from the food basket per school-age child (H1 has 2; H2 has 2, plus a toddler; H5 has 2)","amt":80,"who":"no school-age children"},{"id":"P4","t":"Food bank hamper","eff":"−$60 a month from the food basket, for every household","amt":60},{"id":"P5","t":"Nutrition North subsidy","eff":"−$400 from the food basket; H5 only","amt":400,"who":"H5 only"}],"shocks":[{"id":"S1","t":"Food prices +10%","eff":"basket × 1.10","factor":1.1},{"id":"S2","t":"Rent +$150","eff":"renters only","amt":150,"who":"renters only"},{"id":"S3","t":"Winter flight delay","eff":"H5 basket +$300","amt":300,"who":"H5 only"}],"rows":{"household":"Household","left":"Money left for food","basket":"Nutritious food basket","gap":"Gap","status":"Status (model)","comps":"Components strained","changed":"What changed it","policies":"Policies on","secure":"Households food secure"},"status":{"secure":"Food secure","marginal":"Marginal","moderate":"Moderate","severe":"Severe"},"comps":[{"id":"avail","t":"Availability","msg":"Flights are delayed: fresh food isn’t on the shelves."},{"id":"access","t":"Accessibility","msg":"The money left can’t cover the basket."},{"id":"adequacy","t":"Adequacy","msg":"The shortfall is too big to buy a nutritious diet."},{"id":"accept","t":"Acceptability","msg":"Hampers may not fit dietary, religious or cultural needs."},{"id":"sustain","t":"Sustainability","msg":"No buffer: one more price rise tips this household."}],"about":{"title":"About this model","rules":["Left for food = income (+ P1) − housing (− P2, + S2) − essentials.","Basket = base basket × (1.10 if S1) + (300 if S3, H5 only) − P3 − P4 − P5.","Gap = basket − left for food. Gap % = gap ÷ basket × 100.","Status (teaching model): \u003cstrong>food secure\u003c/strong> if gap ≤ 0; \u003cstrong>marginal\u003c/strong> if 0 \u003c gap % ≤ 15; \u003cstrong>moderate\u003c/strong> if 15 \u003c gap % ≤ 40; \u003cstrong>severe\u003c/strong> if gap % > 40."],"compTitle":"When a component is strained","compRules":["\u003cstrong>Accessibility:\u003c/strong> the gap is above 0.","\u003cstrong>Adequacy:\u003c/strong> the gap % is above 15.","\u003cstrong>Availability:\u003c/strong> H5, when the winter flight delay is on.","\u003cstrong>Acceptability:\u003c/strong> the household is food secure only because of the food bank hamper (the gap without P4 is above 0).","\u003cstrong>Sustainability:\u003c/strong> the household is food secure, but money left for food is less than 1.10 × the current basket (no buffer)."],"tableTitle":"The five households","note":"Real surveys classify households with an 18-question survey, not a budget rule."},"predictions":[{"id":"p1","prompt":"Walter’s income ($2,100) is lower than Celine’s ($3,400). Who is food insecure?","options":[{"t":"Celine","_n":"o680","_k":"2a66c3c0"},{"t":"Neither","_n":"p690","_k":"88ea5709"},{"t":"Walter","_n":"q6a0","_k":"133ad674"},{"t":"Both","_n":"r730","_k":"ad3a44ce"}],"explain":"Walter has $300 spare; Celine is $100 short. What matters is income compared with costs. Walter owns his home and feeds one person. In research, food insecurity drops sharply after 65, when public pensions provide a steady income floor."},{"id":"p2","prompt":"Switch on the food bank hamper for Kiara. Where does she end up?","options":[{"t":"food secure","_n":"s740","_k":"5fdb9d30"},{"t":"marginal","_n":"t711","_k":"0266e631"},{"t":"moderate","_n":"u701","_k":"5eec15e9"},{"t":"still severe","_n":"v6f1","_k":"8701bdf0"}],"explain":"The basket drops $60 to $390; the gap is $190 (48.7%). A hamper helps for a few days. Kiara’s $250 monthly gap comes from rent and low pay."},{"id":"p3","prompt":"Switch on food prices +10%. Whose gap grows the most in dollars?","options":[{"t":"the Nunavut family (H5)","_n":"w6e1","_k":"e4428a36"},{"t":"the Mahmoud family","_n":"x6d1","_k":"966e2ed7"},{"t":"Celine","_n":"y6c1","_k":"6167afd1"},{"t":"Kiara","_n":"z6b1","_k":"d9bc58f3"}],"explain":"The gaps grow by $100 (Celine), $160 (the Mahmoud family), $40 (Walter), $45 (Kiara) and $290 (the Nunavut family). A 10% rise costs most where baskets cost most. Northern food prices are far higher than southern ones."},{"id":"p4","prompt":"Switch on school meals only. How many of the five households change status?","options":[{"t":"0","_n":"106a1","_k":"88593569"},{"t":"1","_n":"11791","_k":"9ec95e4c"},{"t":"2","_n":"12781","_k":"b2986da5"},{"t":"3","_n":"13ff0","_k":"58fa9816"}],"explain":"Celine becomes food secure (gap −$60). The Mahmouds stay moderate ($240 short, 16.7%). The Nunavut family stays marginal ($140 short, 5.1%). School meals help children, but they rarely close a household’s whole income gap."}],"challenges":[{"id":"tc1","goal":[2,5],"prompt":"Household view, H1, no shocks. Switch on \u003cstrong>exactly one\u003c/strong> support so Celine’s household is food secure.","why":"Celine’s $100 gap closes with the income top-up (gap −$200), the rent subsidy (gap −$300) or school meals (gap −$60).","msgs":{"hamper":"A hamper narrows the gap but doesn’t close it. Try a support that raises income or lowers costs.","view":"Use Household view with Celine (H1) chosen.","shocks":"Switch the shocks off: this challenge has none.","none":"Switch on one support.","many":"Use exactly one support.","north":"Nutrition North applies only to the Nunavut family, so Celine is still $100 short."},"hints":["The gap is $100. Which supports are worth at least $100?","Income +$300, rent −$400, school meals −$160.","Any one of those three works."]},{"id":"tc2","goal":[2,5],"prompt":"Household view, H2, with \u003cstrong>food prices +10%\u003c/strong> on. Make the Mahmoud family food secure with the \u003cstrong>fewest\u003c/strong> supports.","why":"With prices up, the gap is $560. The rent subsidy plus the income top-up (gap −$140), or the rent subsidy plus school meals (gap $0), closes it.","msgs":{"p1p3":"Still ${gap} short. Which support is worth the most to a renter?","three":"That works, but can you do it with two?","view":"Use Household view with the Mahmoud family (H2) chosen.","s1":"Switch on food prices +10% first.","one":"One support isn’t enough to close this gap. Try two.","short":"Still ${gap} short."},"hints":["With prices up, the basket is $1,760 and $1,200 is left: a $560 gap.","No single support is worth $560. The rent subsidy ($400) is the biggest.","Rent subsidy plus the income top-up, or rent subsidy plus school meals ($160)."]},{"id":"tc3","goal":[2,5],"stretch":true,"prompt":"Policy view. Turn on \u003cstrong>both\u003c/strong> shocks S1 (prices +10%) and S2 (rent +$150). Find the \u003cstrong>smallest set of policies\u003c/strong> that makes \u003cstrong>all five\u003c/strong> households food secure.","why":"Two sets work: {P1, P2, P3, P5} and {P1, P2, P4, P5}.","banner":"Four policies, five households secure. Notice that the essential ones (P1, P2, P5) raise income or lower costs.","msgs":{"p125":"The Mahmoud family is still $10 short (marginal).","p1234":"The Nunavut family is still $70 short. Northern food costs need a northern policy.","all":"That works, but one policy isn’t needed. Which?","view":"Switch to Policy view.","shocks":"Turn on both shocks S1 and S2, and leave S3 off.","short":"Still short: {list}."},"hints":["Check the hardest households first. With both shocks, the Mahmouds are $710 short and the Nunavut family is $590 short.","The Nunavut family needs P5 (no other mix reaches $590 without it), and the Mahmouds need both P1 and P2 plus one more.","P1 + P2 + P5, plus either P3 or P4."]}],"blocks":[{"title":"What the model shows","html":"\u003cp>The gap closes when \u003cstrong>income rises or costs fall\u003c/strong>. A hamper rarely closes it, and it brings acceptability and sustainability problems of its own.\u003c/p>"}]},"part3":{"slug":"policy","name":"Policy or charity?","heading":"Policy or charity?","intro":"Move from one household’s budget to the whole system: what research says works, how each response fits, and who decides.","stations":[{"id":"research","t":"1. What the research says"},{"id":"sort","t":"2. Sort the responses"},{"id":"desk","t":"3. Who decides?"}],"research":{"title":"What the research says","ask":"Read each finding, then open \u003cstrong>Check it with data\u003c/strong> to see the same pattern in the explorer’s model households.","cards":[{"id":"r1","t":"Household food insecurity rises as income falls, and is much more common among renters than owners (PROOF, using Statistics Canada’s Canadian Income Survey).","cmp":{"hh":["H1","H2","H4","H3"],"tenure":true,"cols":[{"t":"No supports","on":{}}]},"take":"In the model, all three renter households are short. Walter, who owns his home, has $300 spare."},{"id":"r2","t":"Most food-insecure households don’t use food banks. Food banks began in Canada in the early 1980s as a temporary emergency response.","cmp":{"hh":["H1","H2","H4","H5"],"cols":[{"t":"No supports","on":{}},{"t":"With a hamper (P4)","on":{"P4":true}}]},"take":"In the model, a $60 hamper doesn’t close any of the four gaps."},{"id":"r3","t":"Food insecurity drops sharply after age 65, when public pensions (Old Age Security and the Guaranteed Income Supplement) begin.","cmp":{"hh":["H3","H1","H4"],"cols":[{"t":"No supports","on":{}}]},"take":"In the model, Walter (68) lives on public pensions and is the one household with money to spare."},{"id":"r4","t":"Child benefits are linked to lower severe food insecurity among families with children.","cmp":{"hh":["H1","H2","H5"],"cols":[{"t":"No supports","on":{}},{"t":"With the income top-up (P1)","on":{"P1":true}}]},"take":"In the model, $300 more a month moves every family with children up at least one level."},{"id":"r5","t":"School food programs improve what children eat at school, but don’t change household income. Canada announced a National School Food Program in 2024.","cmp":{"hh":["H1","H2","H5"],"cols":[{"t":"No supports","on":{}},{"t":"With school meals (P3)","on":{"P3":true}}]},"take":"In the model, school meals close Celine’s gap, but the Mahmoud family stays $240 short and the Nunavut family $140 short."}]},"sort":{"id":"p3sort","type":"sorter","title":"Sort the responses","noun":"response","txt":true,"ask":"Tap each response into one of four boxes. The feedback names what each response does and doesn’t fix.","boxes":[{"id":"inc","label":"Income-based"},{"id":"char","label":"Charitable food-based"},{"id":"pub","label":"Public food program"},{"id":"comm","label":"Community-building"}],"items":[{"id":"s1","t":"Higher social assistance rates","_a":"FlFfW0E=","why":"It raises income for households relying on social assistance, closing the gap at its source. It doesn’t reach low-wage workers.","wrong":{"char":"It isn’t donated food: it changes how much money people have.","pub":"It isn’t a food program: it changes how much money people have.","comm":"It isn’t a community project: it changes how much money people have."}},{"id":"s2","t":"A larger Canada Child Benefit","_a":"FlFfW0E=","why":"It raises income for families with children. It doesn’t help adults without children, like Kiara.","wrong":{"char":"It’s a payment, not donated food.","pub":"It’s a payment to families, not a food program.","comm":"It’s a payment to families, not a community project."}},{"id":"s3","t":"A higher minimum wage","_a":"FlFfW0E=","why":"It raises pay for low-wage workers. It doesn’t help people who can’t work or are retired.","wrong":{"char":"It changes pay, not donated food.","pub":"It changes pay, not a food program.","comm":"It changes pay, not a community project."}},{"id":"s4","t":"Food bank hamper","_a":"FltZWRET","why":"Emergency food for a few days. It doesn’t close a monthly income gap, and it may not fit dietary, religious or cultural needs.","wrong":{"inc":"A hamper is donated food; income doesn’t change.","pub":"Food banks are mostly charities that run on donations.","comm":"A hamper is emergency relief, not a group building skills or connection."}},{"id":"s5","t":"Community fridge","_a":"FltZWRET","why":"Free donated food, open to anyone. Supplies depend on donations, and income doesn’t change.","wrong":{"inc":"The fridge holds donated food; income doesn’t change.","pub":"It runs on donations, not a public program.","comm":"It hands out donated food rather than building skills together."}},{"id":"s6","t":"School meal program","_a":"FkhEWkE=","why":"Children eat well at school. Household income doesn’t change.","wrong":{"inc":"It gives food at school; household income doesn’t change.","char":"It’s a public program, not a donation drive.","comm":"It’s a public program run through schools."}},{"id":"s7","t":"Nutrition North retail subsidy","_a":"FkhEWkE=","why":"It lowers food prices in northern communities. It helps only where it applies, and only if the savings reach shoppers.","wrong":{"inc":"It lowers prices in stores; it doesn’t pay people.","char":"It’s a government subsidy, not a donation.","comm":"It’s a government subsidy, not a community project."}},{"id":"s8","t":"Community garden","_a":"FlteVQ4T","why":"It builds skills, connection and some fresh food. It doesn’t close an income gap.","wrong":{"inc":"It doesn’t change income.","char":"People grow food together; it isn’t donated relief.","pub":"It’s run by and for the community, not a public food program."}},{"id":"s9","t":"Collective kitchen","_a":"FlteVQ4T","why":"People cook together and share costs and skills. It doesn’t change income.","wrong":{"inc":"It doesn’t change income.","char":"People cook together; it isn’t donated relief.","pub":"It’s run by and for the community, not a public food program."}}]},"desk":{"title":"Who decides?","ask":"Match each policy to the level of government that decides it in Ontario. This table is also the key for the performance task.","reps":[{"id":"mp","t":"Federal: your MP"},{"id":"mpp","t":"Provincial: your MPP"},{"id":"cc","t":"Municipal: your city councillor"}],"policies":[{"id":"ccb","t":"Canada Child Benefit","_a":"bxpcSEFs","desk":"Federal: your MP","sup":"P1","hh":["H1","H2","H5"],"names":["Canada Child Benefit"],"why":"The Canada Child Benefit is a federal program."},{"id":"oas","t":"Old Age Security and the Guaranteed Income Supplement","_a":"bxpcSEFs","desk":"Federal: your MP","sup":"P1","hh":["H1","H2","H3","H4","H5"],"names":["Old Age Security","Guaranteed Income Supplement","OAS","GIS"],"why":"Old Age Security and the Guaranteed Income Supplement are federal pensions."},{"id":"nnc","t":"Nutrition North Canada","_a":"bxpcSEFs","desk":"Federal: your MP","sup":"P5","hh":["H5"],"names":["Nutrition North"],"why":"Nutrition North Canada is a federal program."},{"id":"sfp","t":"National School Food Program funding","_a":"bxpcSEEdQ1RESBNl","desk":"Federal (your MP); provinces deliver it, so your MPP is also accepted","sup":"P3","hh":["H1","H2","H3","H4","H5"],"names":["School Food Program","school food","school meal"],"why":"The funding is federal (your MP), and provinces deliver it, so your MPP is also accepted."},{"id":"ow","t":"Ontario Works and ODSP rates","_a":"bxpcSBMTPA==","desk":"Provincial: your MPP","sup":"P1","hh":["H1","H2","H3","H4","H5"],"names":["Ontario Works","ODSP","Ontario Disability Support Program"],"why":"Ontario Works and ODSP are provincial programs."},{"id":"mw","t":"Minimum wage (most workers)","_a":"bxpcSBMTPA==","desk":"Provincial: your MPP","sup":"P1","hh":["H1","H2","H4"],"names":["minimum wage"],"why":"Ontario sets the minimum wage for most workers."},{"id":"rent","t":"Rent rules and rent supplements","_a":"bxpcSBMTPA==","desk":"Provincial: your MPP","sup":"P2","hh":["H1","H2","H3","H4","H5"],"names":["rent supplement","rent rule","rent control"],"why":"Rent rules and rent supplements are set by the province."},{"id":"local","t":"Local transit routes and community garden space","_a":"bxpSW0Fs","desk":"Municipal: your city councillor","sup":null,"hh":[],"names":["transit","community garden"],"why":"Cities decide local transit routes and community garden space."}],"keyTitle":"Who decides? (the key)","msgs":{"partial":"Choose a desk for every policy first.","ok":"Every policy is at the right desk.","off":"{n} at the wrong desk (marked ✗). Each policy has a home: the Canada Child Benefit is federal (your MP); Ontario Works rates a
