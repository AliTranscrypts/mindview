fb":"A steady income floor protects access to food.","_n":"1i680","_k":"5ee1d592"},{"t":"Seniors eat less","fb":"A steady income floor protects access to food.","_n":"1j6b0","_k":"0607c68f"}]}]},"blocksAfter":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If you or your family are having a hard time getting enough food, you’re not alone and it isn’t your fault. You can talk to someone you trust at school, call or text \u003cspan class=\"nw\">211\u003c/span> to find local food programs and supports, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>).\u003c/p>\u003c/div>"}]},"practice":{"activities":[{"id":"comp","type":"sorter","title":"Which component?","summary":"Which component?","goal":[1,3],"noun":"situation","txt":true,"instruction":"Sort each situation into the component of food security it strains most.","boxes":[{"id":"avail","label":"Availability","sub":"Is the food there?"},{"id":"access","label":"Accessibility","sub":"Can they get it?"},{"id":"adequacy","label":"Adequacy","sub":"Is it nutritious and safe?"},{"id":"accept","label":"Acceptability","sub":"Does it fit?"},{"id":"sustain","label":"Sustainability","sub":"Will it last?"}],"items":[{"id":"i1","t":"The only store in a fly-in community runs out of fresh produce when flights are cancelled.","_a":"FllHWQpdQw==","why":"No flights, no fresh produce on the shelves: the food isn’t physically there.","wrong":{"access":"The food isn’t on the shelves at all: supply is the problem.","adequacy":"The food isn’t on the shelves at all: supply is the problem.","accept":"The food isn’t on the shelves at all: supply is the problem.","sustain":"The food isn’t on the shelves at all: supply is the problem."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Is the food physically on the shelves?","Availability."]},{"id":"i2","t":"A family can afford enough rice and pasta, but not enough vegetables, fruit or protein foods.","_a":"FllVXRJEAFpNGg==","why":"Enough energy, not enough nutrients: the diet isn’t adequate.","wrong":{"avail":"The food is there and affordable in quantity; the problem is nutritional quality.","access":"They can get enough food; the problem is its nutritional quality.","accept":"They can get enough food; the problem is its nutritional quality.","sustain":"They can get enough food; the problem is its nutritional quality."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Is the food they can afford nutritious?","Adequacy."]},{"id":"i3","t":"The nearest full grocery store is 8 km away and there’s no bus.","_a":"FllSWwZCEhs=","why":"Distance and no transport limit their access.","wrong":{"avail":"The food exists; the problem is getting to it.","adequacy":"The food exists; the problem is getting to it.","accept":"The food exists; the problem is getting to it.","sustain":"The food exists; the problem is getting to it."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Can they reach the food?","Accessibility."]},{"id":"i4","t":"A food bank’s hampers don’t include halal or kosher options.","_a":"FllSWwZBFRs=","why":"Food must fit religious needs to be acceptable.","wrong":{"avail":"There is food; it doesn’t fit religious dietary needs.","access":"There is food; it doesn’t fit religious dietary needs.","adequacy":"There is food; it doesn’t fit religious dietary needs.","sustain":"There is food; it doesn’t fit religious dietary needs."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Does the food fit their religion and culture?","Acceptability."]},{"id":"i5","t":"A worker’s food budget disappears whenever shifts are cut.","_a":"FktESxdQCFcW","why":"Access that collapses with every cut in shifts isn’t sustainable.","wrong":{"avail":"Some weeks are fine; the problem is that access doesn’t last.","access":"Some weeks are fine; the problem is that access doesn’t last.","adequacy":"Some weeks are fine; the problem is that access doesn’t last.","accept":"Some weeks are fine; the problem is that access doesn’t last."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Does their access hold up over time?","Sustainability."]},{"id":"i6","t":"Rent rises $200, leaving too little for groceries.","_a":"FllSWwZCEhs=","why":"Higher rent leaves too little money: they can’t afford the food.","wrong":{"avail":"The food is in the store; the problem is money to buy it.","adequacy":"The food is in the store; the problem is money to buy it.","accept":"The food is in the store; the problem is money to buy it.","sustain":"The food is in the store; the problem is money to buy it."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Can they afford the food?","Accessibility."]},{"id":"i7","t":"A newcomer family can’t find familiar staple foods it can afford.","_a":"FllSWwZBFRs=","why":"Familiar, culturally fitting staples are part of acceptability.","wrong":{"avail":"Food is in the store; it doesn’t fit the family’s culture.","access":"Food is in the store; it doesn’t fit the family’s culture.","adequacy":"Food is in the store; it doesn’t fit the family’s culture.","sustain":"Food is in the store; it doesn’t fit the family’s culture."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Does the food fit their culture?","Acceptability."]},{"id":"i8","t":"A drought cuts a region’s harvest and shelves empty.","_a":"FllHWQpdQw==","why":"When the harvest fails, the food isn’t physically there.","wrong":{"access":"Empty shelves: there’s no food to buy.","adequacy":"Empty shelves: there’s no food to buy.","accept":"Empty shelves: there’s no food to buy.","sustain":"Empty shelves: there’s no food to buy."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Is the food physically there?","Availability."]},{"id":"i9","t":"Food from a donation drive is mostly expired or unsafe.","_a":"FllVXRJEAFpNGg==","why":"Adequate food meets nutritional needs and is safe.","wrong":{"avail":"There’s food, but it isn’t safe: adequacy covers safety.","access":"There’s food, but it isn’t safe: adequacy covers safety.","accept":"There’s food, but it isn’t safe: adequacy covers safety.","sustain":"There’s food, but it isn’t safe: adequacy covers safety."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Is the food safe and nutritious?","Adequacy."]},{"id":"i10","t":"A family relies on a food bank every month with no other plan.","_a":"FktESxdQCFcW","why":"Relying on charity every month isn’t access that holds up over time.","wrong":{"avail":"They get food now; the problem is that it can’t be counted on.","access":"They get food now; the problem is that it can’t be counted on.","adequacy":"They get food now; the problem is that it can’t be counted on.","accept":"They get food now; the problem is that it can’t be counted on."},"hints":["Is the food there? Can they get it? Is it nutritious? Does it fit? Will it last?","Will their access last?","Sustainability."]}]},{"id":"data","type":"custom","title":"Reading the data","summary":"Reading the data","star":true,"goal":[2,3,4],"instruction":"Use the table to answer each question. Items marked ★ are non-routine; D5 is an inquiry item.","how":"Choose an answer, then press Check answer. Each item has three levels of help.","tableTag":"Model data shaped like published Canadian patterns","head":["Household group","% food insecure (model)","Share of all households (model)"],"rows":[["Owners","10%","65%"],["Renters","30%","35%"],["Main income: employment","15%","80%"],["Main income: social assistance","60%","5%"],["Main income: public pensions","7%","15%"]],"items":[{"id":"d1","goal":3,"prompt":"Which income group has the highest \u003cstrong>rate\u003c/strong>?","options":[{"t":"Social assistance (60%)","why":"60% is the highest rate of the three income groups.","_n":"1k6a0","_k":"c6381076"},{"t":"Public pensions","why":"Pension households have the lowest rate in the table (7%).","_n":"1l6d0","_k":"c388ba1f"},{"t":"Employment","why":"That group is the largest, not the highest rate.","_n":"1m6c0","_k":"d9bd2c15"},{"t":"All three are about the same","why":"The rates range from 7% to 60%.","_n":"1nf30","_k":"2e99d89a"}],"hints":["Rate = how likely within a group; share = how big the group is.","Multiply the rate by the share to compare counts.","Read the rate column for the three income groups: social assistance 60%, employment 15%, public pensions 7%."]},{"id":"d2","goal":3,"prompt":"Renters’ rate is how many times owners’ rate?","options":[{"t":"20 times","why":"Divide: 30 ÷ 10.","_n":"1of40","_k":"9ff17060"},{"t":"2 times","why":"Divide: 30 ÷ 10.","_n":"1pf50","_k":"ebe3b642"},{"t":"3 times","why":"30 ÷ 10 = 3.","_n":"1qf60","_k":"c3bbf7b7"},{"t":"30 times","why":"30% is renters’ rate itself. Divide it by owners’ rate: 30 ÷ 10.","_n":"1rf70","_k":"6f1a8822"}],"hints":["Rate = how likely within a group; share = how big the group is.","Multiply the rate by the share to compare counts.","30 ÷ 10 = 3: renters are 3 times as likely to be food insecure."]},{"id":"d3","goal":[2,3],"star":true,"prompt":"Most food-insecure households get their main income from…","options":[{"t":"The three groups equally","why":"Multiply each rate by its share: about 12, 3 and 1 of every 100 households.","_n":"1sf80","_k":"e0f4a048"},{"t":"Social assistance","why":"Highest rate isn’t the same as largest share.","_n":"1tf90","_k":"56ea7cba"},{"t":"Public pensions","why":"15% × 7% is about 1 of every 100 households: the smallest count.","_n":"1ufa0","_k":"55f8c35f"},{"t":"Employment","why":"80% × 15% = 12 of every 100 households, vs 5% × 60% = 3 for social assistance.","_n":"1veb0","_k":"6d26304d"}],"hints":["Rate = how likely within a group; share = how big the group is.","Multiply the rate by the share to compare counts.","Employment: 0.80 × 15 = 12 of every 100 households. Social assistance: 0.05 × 60 = 3. Pensions: 0.15 × 7 ≈ 1. Employment wins."]},{"id":"d4","goal":3,"star":true,"prompt":"Renters have higher rates. Does renting \u003cem>cause\u003c/em> food insecurity?","options":[{"t":"Yes","why":"Correlation isn’t causation; look for what renters share.","_n":"1wec0","_k":"b632fd96"},{"t":"Yes, because renters spend more on food","why":"The table doesn’t show food spending. Look for what renters share.","_n":"1xf90","_k":"8e718c56"},{"t":"Not by itself: renting goes with lower incomes and a higher share of income spent on housing","why":"The link runs through income and housing costs, not renting itself.","_n":"1yf80","_k":"aa081e85"},{"t":"No: renting and food insecurity aren’t linked","why":"They are linked (30% vs 10%). The question is what explains the link.","_n":"1zf70","_k":"6b6c603a"}],"hints":["Rate = how likely within a group; share = how big the group is.","Multiply the rate by the share to compare counts.","A link isn’t a cause. Renting goes with lower incomes and a higher share of income spent on housing, and those explain the link."]},{"id":"d5","goal":3,"star":true,"inquiry":true,"prompt":"Which is the best research question?","options":[{"t":"“Is food insecurity bad?”","why":"It’s too broad, and data can’t answer it.","_n":"20f60","_k":"deeec55c"},{"t":"“How does the share of income spent on rent relate to food insecurity among Ontario renters?”","why":"It’s focused and measurable, and it doesn’t assume the answer.","_n":"21fd0","_k":"01855318"},{"t":"“How many grocery stores are in Ontario?”","why":"It’s measurable, but it doesn’t connect to food insecurity or its causes.","_n":"22fc0","_k":"e3e94bab"},{"t":"“Why are poor people bad with money?”","why":"That assumes the answer and blames people.","_n":"23fb0","_k":"46d5d60f"}],"hints":["Rate = how likely within a group; share = how big the group is.","Multiply the rate by the share to compare counts.","A good research question is focused and measurable and doesn’t assume the answer: the question about the share of income spent on rent."]},{"id":"d6","goal":[2,4],"star":true,"prompt":"Pension households have a 7% rate; employment households 15%. Which explanation is best supported?","options":[{"t":"A guaranteed, indexed income floor","why":"Public pensions give a steady income that rises with prices, so access to food holds up.","_n":"24fa0","_k":"35cc07c4"},{"t":"Seniors need less food","why":"Their basket is smaller, but the rate gap is about income stability.","_n":"25f10","_k":"e7b2868a"},{"t":"Seniors are better at budgeting","why":"The gap comes from income compared with costs. Research finds food-insecure households have food skills similar to everyone else’s.","_n":"26f00","_k":"2ae59e54"},{"t":"Seniors grow their own food","why":"Nothing in the data points to that; the difference is a steady income floor.","_n":"2766f","_k":"f89f9e49"}],"hints":["Rate = how likely within a group; share = how big the group is.","Multiply the rate by the share to compare counts.","Public pensions (Old Age Security and the Guaranteed Income Supplement) give a guaranteed income floor that rises with prices, so access holds up."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Torin","goal":[2,5],"how":"","instruction":"Torin made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain why Celine’s household is food insecure.","steps":["“Celine’s income after tax, including benefits, is $3,400.”","“Housing and essentials take $2,500, leaving $900 for food.”","“A nutritious food basket for her family costs $1,000.”","“So the family is $100 short each month.”","“The solution is for Celine to learn to budget better.”"],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.","Step 4 is correct.",""],"fixes":[{"t":"“The solution is cooking classes.”","why":"Skills don’t create $100.","_n":"2867f","_k":"a0a65a73"},{"t":"“The gap comes from costs higher than income. A support that raises income or lowers costs (child benefit, rent help or school meals) closes it.”","why":"The gap comes from income compared with costs. Research finds food-insecure households have food skills similar to everyone else’s.","_n":"2964f","_k":"eb866c22"},{"t":"Step 5 is correct.","why":"Research doesn’t support blaming budgeting.","_n":"2a65f","_k":"d0c6c630"},{"t":"“The solution is a food bank visit.”","why":"That covers $60 at most.","_n":"2b6af","_k":"e54e53bf"}],"hints":["Where does the $100 gap come from?","Income compared with costs.","A fix must raise income or lower costs."]},{"id":"e2","goal":2,"task":"Find the Mahmoud family’s gap when food prices rise 10%.","steps":["“Left for food: $4,800 − $2,600 − $1,000 = $1,200.”","“Basket with prices up: $1,600 + $10 = $1,610.”","“Gap: $1,610 − $1,200 = $410.”"],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2 correctly. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"10% of $1,600 is $160.","_n":"2c6bf","_k":"612a0b79"},{"t":"“$1,600 × 1.10 = $1,760, so the gap is $560.”","why":"10% of $1,600 is $160, so the basket is $1,760 and the gap is $1,760 − $1,200 = $560.","_n":"2d68f","_k":"3e1cb5af"},{"t":"“$1,600 × 0.10 = $160 is the new basket.”","why":"That’s the increase, not the new basket.","_n":"2e69f","_k":"a9f8a3d8"},{"t":"“$1,200 × 1.10 = $1,320.”","why":"The price rise applies to the basket, not the money left.","_n":"2f6ef","_k":"4dc1af57"}],"hints":["What is 10% of $1,600?","$160.","$1,760 and a $560 gap."]},{"id":"e3","goal":5,"task":"Evaluate food banks as a response to food insecurity.","steps":["“Food banks give emergency food to people in crisis.”","“They depend on donations and volunteers, so supplies vary.”","“Since most food-insecure households use food banks, expanding them will end food insecurity.”","“So governments should fund more food banks instead of income programs.”"],"_a":"Bg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows the mistake in step 3."],"fixes":[{"t":"“Most food-insecure households don’t use food banks, and hampers can’t close a monthly income gap. Food banks are emergency relief; income-based policies address the cause.”","why":"Relief, not a cure: income-based policies address the cause.","_n":"2g6ff","_k":"d05145d6"},{"t":"Step 3 is correct.","why":"Most food-insecure households don’t use food banks, and a hamper covers a few days, not a monthly gap.","_n":"2h6d0","_k":"b1962a96"},{"t":"“Food banks should close.”","why":"They still help in emergencies.","_n":"2i6c0","_k":"fdd80794"},{"t":"“Food banks should only give fresh food.”","why":"That improves adequacy but not the gap.","_n":"2j6f0","_k":"e67cce96"}],"hints":["Do most food-insecure households use food banks?","No.","Relief, not a cure."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>Write about the households in the module. You don’t need to write about your own family.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"Which prediction surprised you most in the explorer, and why?"},{"id":"j2","q":"In your own words, why is household food insecurity in Canada mainly an income problem?"},{"id":"j3","q":"Explain to a friend the difference between a food bank and an income-based policy, using one household from the explorer."},{"id":"j4","q":"What is one thing you’re still unsure about (data, causes or solutions)? How could you find out?"}]},"final":{"intro":"This shows what you’ve learned, so there are no hints here. Answer all 10 questions and say how sure you are. Then submit to see your results. Each question is labelled with its achievement chart category. Calculation questions use the module’s model status rule: \u003cstrong>food secure\u003c/strong> if gap ≤ 0; \u003cstrong>marginal\u003c/strong> if 0 \u003c gap % ≤ 15; \u003cstrong>moderate\u003c/strong> if 15 \u003c gap % ≤ 40; \u003cstrong>severe\u003c/strong> if gap % > 40.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A family can afford enough calories, but not enough vegetables, fruit and protein foods. Which component of food security is strained?","options":[{"t":"Sustainability","why":"This is about quality, not reliability over time.","_n":"2k6e0","_k":"2ec026b0"},{"t":"Adequacy","why":"Enough energy isn’t enough nutrition.","_n":"2l690","_k":"025bbf54"},{"t":"Acceptability","why":"Nothing here conflicts with culture or dignity.","_n":"2m680","_k":"5439551b"},{"t":"Availability","why":"The food is in the store.","_n":"2n6b0","_k":"e9aea02e"}]},"b":{"prompt":"The only store in a fly-in community runs out of fresh food after flights are cancelled. Which component is strained?","options":[{"t":"Accessibility","why":"Money and distance aren’t the issue; supply is.","_n":"2o6a0","_k":"11e536e0"},{"t":"Acceptability","why":"Nothing here conflicts with culture.","_n":"2p750","_k":"5bd7a0b0"},{"t":"Adequacy","why":"The problem starts before quality: there’s no food on the shelves.","_n":"2q740","_k":"1ffeab38"},{"t":"Availability","why":"The food isn’t physically there.","_n":"2r205","_k":"160d1c60"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In Canadian research, household food insecurity is defined as…","options":[{"t":"not knowing how to cook healthy meals","why":"The gap comes from income compared with costs. Research finds food-insecure households have food skills similar to everyone else’s.","_n":"2s1f5","_k":"0e32545d"},{"t":"living far from a farm","why":"Distance from farms isn’t the definition.","_n":"2t1e5","_k":"3d59c339"},{"t":"choosing less healthy foods","why":"It’s about constraints, not preferences.","_n":"2u1d5","_k":"408c3ef5"},{"t":"inadequate or insecure access to food because of financial constraints","why":"The definition is about access limited by money.","_n":"2v1c5","_k":"c7f343d6"}]},"b":{"prompt":"Which factor is most strongly linked to household food insecurity in Canada?","options":[{"t":"Lack of cooking skills","why":"The gap comes from income compared with costs. Research finds food-insecure households have food skills similar to everyone else’s.","_n":"2w1b5","_k":"6d12f83d"},{"t":"Living far from farms","why":"Most food-insecure people live near stores.","_n":"2x1a5","_k":"7dd7fa01"},{"t":"Household size alone","why":"Size matters only through costs and income.","_n":"2y195","_k":"27c3ca48"},{"t":"Low income compared with living costs","why":"Food insecurity tracks income measured against housing and other costs.","_n":"2z285","_k":"77a65d00"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"To ask for higher Ontario Works rates, which representative is responsible?","options":[{"t":"Your MP (federal)","why":"Ontario Works is a provincial program.","_n":"30275","_k":"5e8fb725"},{"t":"Your school trustee","why":"Trustees oversee school boards.","_n":"319a4","_k":"5c692268"},{"t":"Your city councillor","why":"Each policy has a home: the Canada Child Benefit is federal (your MP); Ontario Works rates are provincial (your MPP).","_n":"329b4","_k":"6e51eee8"},{"t":"Your MPP (provincial)","why":"Ontario Works is a provincial program, so its rates are set at Queen’s Park.","_n":"339c4","_k":"8a6de8f7"}]},"b":{"prompt":"To ask for a larger Canada Child Benefit, which representative is responsible?","options":[{"t":"Your MPP (provincial)","why":"The Canada Child Benefit is federal.","_n":"349d4","_k":"b1dcf6ac"},{"t":"Your MP (federal)","why":"The Canada Child Benefit is a federal program, so Parliament can change it.","_n":"35964","_k":"6b3cebb0"},{"t":"Your city councillor","why":"Each policy has a home: the Canada Child Benefit is federal (your MP); Ontario Works rates are provincial (your MPP).","_n":"36974","_k":"09b41bd1"},{"t":"Your school principal","why":"Principals don’t set benefits.","_n":"37984","_k":"8f5c602b"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"A household has $2,900 income after tax, $1,500 housing and $600 other essentials. Its nutritious food basket costs $1,000. Using the module’s model rule, what is its status?","options":[{"t":"Moderate","why":"$800 left; gap $200 = 20% of the basket.","_n":"38994","_k":"537355aa"},{"t":"Food secure","why":"$800 doesn’t cover a $1,000 basket.","_n":"39a24","_k":"18037b1b"},{"t":"Marginal","why":"20% is above the 15% marginal limit.","_n":"3aa34","_k":"37e7117a"},{"t":"Severe","why":"Severe starts above 40%.","_n":"3b2c5","_k":"36940087"}]},"b":{"prompt":"A household has $3,800 income after tax, $1,900 housing and $900 other essentials. Its basket costs $1,100. Using the module’s model rule, what is its status?","options":[{"t":"Food secure","why":"$1,000 doesn’t cover $1,100.","_n":"3c2b5","_k":"cda4a96b"},{"t":"Severe","why":"Severe starts above 40%.","_n":"3d2e5","_k":"cc03ddc7"},{"t":"Moderate","why":"9.1% is below 15%.","_n":"3e2d5","_k":"451a23eb"},{"t":"Marginal","why":"$1,000 left; gap $100 ≈ 9.1%.","_n":"3f285","_k":"e9c3b88b"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A town has funding for one response. Its data: 70% of food-insecure households have jobs that don’t pay enough to cover rent and food, and few use the food bank. Which response best fits the evidence?","options":[{"t":"A new grocery store downtown","why":"Availability isn’t the problem in the data.","_n":"3g275","_k":"680cd276"},{"t":"A bigger food bank warehouse","why":"Few use the food bank, and hampers don’t close monthly gaps.","_n":"3h2a5","_k":"9917448f"},{"t":"A rent supplement or income support program for low-wage households","why":"It targets the gap the data shows.","_n":"3i295","_k":"39ad8bb9"},{"t":"Free cooking classes","why":"Skills aren’t what the data points to.","_n":"3j245","_k":"0e430038"}]},"b":{"prompt":"In a northern community, food prices are about 2.5 times southern prices (model), while incomes are similar to the south’s. Which response best fits?","options":[{"t":"A one-time food drive in a southern city","why":"Short-term, and it doesn’t touch prices.","_n":"3k235","_k":"376dd136"},{"t":"Lower food costs (a stronger retail subsidy) and support for harvesting country food","why":"With similar incomes, the gap comes from prices, so lowering food costs targets it.","_n":"3l265","_k":"c573d37f"},{"t":"Cooking classes","why":"The gap comes from income compared with costs. Research finds food-insecure households have food skills similar to everyone else’s.","_n":"3m275","_k":"2a43da30"},{"t":"A nutrition label awareness campaign","why":"The gap comes from income compared with costs. Research finds food-insecure households have food skills similar to everyone else’s.","_n":"3n245","_k":"35489f8c"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Renters have a food insecurity rate of 30%; owners 10%. Renters are 35% of households. Which statement is supported?","options":[{"t":"Renting causes food insecurity","why":"Correlation isn’t causation: income and housing costs explain it.","_n":"3o255","_k":"87480758"},{"t":"Renters are three times as likely to be food insecure, and they make up most food-insecure households","why":"0.35 × 30 = 10.5 vs 0.65 × 10 = 6.5.","_n":"3p2a5","_k":"192c9ac4"},{"t":"Most food-insecure households are owners","why":"Compare counts: 10.5 vs 6.5.","_n":"3q2b5","_k":"a6f5bf65"},{"t":"Owners are never food insecure","why":"Their rate is 10%, not 0%.","_n":"3r285","_k":"c493783c"}]},"b":{"prompt":"Households on social assistance have a 60% rate and are 5% of households. Households relying on employment have a 15% rate and are 80% of households. Which statement is supported?","options":[{"t":"Social assistance causes food insecurity","why":"The data shows a link, not a cause; low benefit rates are the issue.","_n":"3s295","_k":"a7aea7b0"},{"t":"Jobs prevent food insecurity","why":"15% of employment households are still food insecure.","_n":"3t1e5","_k":"dfdb08c2"},{"t":"More food-insecure households rely on employment income than on social assistance","why":"0.80 × 15 = 12 vs 0.05 × 60 = 3.","_n":"3u1f5","_k":"3a5f1e23"},{"t":"Most food-insecure households are on social assistance","why":"That confuses the rate with the share.","_n":"3v284","_k":"ecdf10d3"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which best explains the links among poverty, food insecurity and poor health?","options":[{"t":"“Poor health comes only from genetics, so food doesn’t matter.”","why":"Diet and stress matter.","_n":"3w274","_k":"ecf3fa49"},{"t":"“Food insecurity only affects body weight.”","why":"It affects nutrients, stress and chronic disease.","_n":"3x264","_k":"986e7693"},{"t":"“Low income forces trade-offs, like cheaper, less nutritious food or skipped meals. Over time these raise the risk of chronic disease and stress, and poor health can in turn lower income.”","why":"It names the trade-offs and shows that the links run both ways.","_n":"3y254","_k":"b612f8c2"},{"t":"“Food-insecure people choose unhealthy food, which makes them sick.”","why":"The gap comes from income compared with costs. Research finds food-insecure households have food skills similar to everyone else’s.","_n":"3z2c4","_k":"25fc74b4"}]},"b":{"prompt":"Which sentence best describes how food insecurity affects children?","options":[{"t":"“Children are never affected because parents always protect them.”","why":"Children in food-insecure households have poorer health on average, even when parents go without to protect them.","_n":"402b4","_k":"61acd1ba"},{"t":"“Only children who skip breakfast are affected.”","why":"The effects go beyond one meal.","_n":"412a4","_k":"04b12de4"},{"t":"“School lunches fully prevent any effect.”","why":"School food helps, but doesn’t change household income.","_n":"42294","_k":"f3f72a63"},{"t":"“Children in food-insecure households have poorer health on average, even when parents go without food first to protect them.”","why":"Food insecurity affects the whole household, even when parents try to shield their children.","_n":"43204","_k":"ed534864"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which statement best describes the role of food banks?","options":[{"t":"“Food banks give emergency relief, but they can’t close the income gap that causes most food insecurity.”","why":"Relief helps in a crisis; income-based policies address the cause.","_n":"441f4","_k":"d3d33580"},{"t":"“Food banks are the main solution to food insecurity in Canada.”","why":"Most food-insecure households don’t use food banks, and a hamper covers a few days, not a monthly gap.","_n":"45224","_k":"9e186263"},{"t":"“Food banks are unnecessary.”","why":"They help in emergencies.","_n":"46234","_k":"a8355c55"},{"t":"“Food banks are a government program that guarantees food.”","why":"They’re mostly charitable.","_n":"47244","_k":"c08d9357"}]},"b":{"prompt":"Which statement best describes school food programs?","options":[{"t":"“They end food insecurity for the whole family.”","why":"They help children, not the household budget.","_n":"48254","_k":"8b9442bd"},{"t":"“They improve children’s access to nutritious food at school, but don’t change household income.”","why":"School food helps children at school; the household budget stays the same.","_n":"49264","_k":"b0e696e8"},{"t":"“They only help children who are food insecure.”","why":"Universal programs reach all students.","_n":"4a274","_k":"1d7536aa"},{"t":"“They replace the need for income supports.”","why":"They don’t change household income, so the gap that causes food insecurity stays.","_n":"4b284","_k":"9658deea"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A student renting a room has $250 left for food each month, and a nutritious basket costs $450. A community fridge provides about $50 of food a month. With the fridge, what is the model status?","options":[{"t":"Severe","why":"Before the fridge it was 44.4% (severe); now it’s 37.5%.","_n":"4c294","_k":"d68f0b46"},{"t":"Food secure","why":"$250 still doesn’t cover $400.","_n":"4d1a4","_k":"9714f934"},{"t":"Moderate","why":"Basket $400, gap $150 = 37.5%.","_n":"4e1b4","_k":"962aede5"},{"t":"Marginal","why":"37.5% is above 15%.","_n":"4f944","_k":"537cbfdf"}]},"b":{"prompt":"A family has $1,300 left for food and a $1,600 basket. A school meal program saves $80 a month per school-age child, and they have 3. What is the model status?","options":[{"t":"Food secure","why":"$1,300 is still $60 short.","_n":"4g934","_k":"d29c7c7d"},{"t":"Severe","why":"Severe starts above 40%.","_n":"4h964","_k":"86c0f56f"},{"t":"Moderate","why":"4.4% is below 15%.","_n":"4i954","_k":"acdab4b9"},{"t":"Marginal","why":"Basket $1,360; gap $60 ≈ 4.4%.","_n":"4j984","_k":"d4f24a7c"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"You’re writing to your MP about food insecurity rates. Which source is most credible for current national figures?","options":[{"t":"A social media post with no source","why":"No way to check it.","_n":"4k974","_k":"52979fad"},{"t":"An opinion blog","why":"Opinion, not data.","_n":"4l9a4","_k":"8b975524"},{"t":"Statistics Canada’s Canadian Income Survey, as analysed by university researchers (PROOF)","why":"A large national survey, analysed by researchers whose methods you can check.","_n":"4m994","_k":"fdf8303e"},{"t":"A grocery chain’s advertisement","why":"It has a commercial interest.","_n":"4n9c4","_k":"3f594cc0"}]},"b":{"prompt":"Which evidence would best support a letter asking your MPP for higher ODSP rates?","options":[{"t":"Research data from a credible source on food insecurity among households relying on social assistance","why":"Credible data about the people the policy affects backs up the ask.","_n":"4o9b4","_k":"e8d888e7"},{"t":"A personal attack on the government","why":"Attacks don’t persuade decision-makers.","_n":"4pae4 who decides this policy?","Add a research chip. A post you saw online isn’t evidence on its own.","Pick a household this policy actually helps. Try it in the explorer first. (OAS/GIS won’t change Walter’s status: he’s already secure.)","Name the policy in your letter so the ask is clear.","Keep it to 120–220 words.","Cite a source in APA style: (Author, Year).","Describe the problem as income and costs, not people’s choices."],"noModelTip":"The explorer doesn’t model this policy, so your example can’t show it working. Choose a policy the explorer models.","explainPrompt":"Explain why you chose this representative and this evidence, and what your example household shows.","vocab":"Use the words food insecurity, income, accessibility and policy.","checkLabel":"Check my letter","success":"Your letter meets every line of the checklist.","more":"There’s more than one good letter. Can you write another?","policies":[{"id":"ccb","t":"Canada Child Benefit","_a":"bxpcSEFs","desk":"Federal: your MP","sup":"P1","hh":["H1","H2","H5"],"names":["Canada Child Benefit"],"why":"The Canada Child Benefit is a federal program."},{"id":"oas","t":"Old Age Security and the Guaranteed Income Supplement","_a":"bxpcSEFs","desk":"Federal: your MP","sup":"P1","hh":["H1","H2","H3","H4","H5"],"names":["Old Age Security","Guaranteed Income Supplement","OAS","GIS"],"why":"Old Age Security and the Guaranteed Income Supplement are federal pensions."},{"id":"nnc","t":"Nutrition North Canada","_a":"bxpcSEFs","desk":"Federal: your MP","sup":"P5","hh":["H5"],"names":["Nutrition North"],"why":"Nutrition North Canada is a federal program."},{"id":"sfp","t":"National School Food Program funding","_a":"bxpcSEEdQ1RESBNl","desk":"Federal (your MP); provinces deliver it, so your MPP is also accepted","sup":"P3","hh":["H1","H2","H3","H4","H5"],"names":["School Food Program","school food","school meal"],"why":"The funding is federal (your MP), and provinces deliver it, so your MPP is also accepted."},{"id":"ow","t":"Ontario Works and ODSP rates","_a":"bxpcSBMTPA==","desk":"Provincial: your MPP","sup":"P1","hh":["H1","H2","H3","H4","H5"],"names":["Ontario Works","ODSP","Ontario Disability Support Program"],"why":"Ontario Works and ODSP are provincial programs."},{"id":"mw","t":"Minimum wage (most workers)","_a":"bxpcSBMTPA==","desk":"Provincial: your MPP","sup":"P1","hh":["H1","H2","H4"],"names":["minimum wage"],"why":"Ontario sets the minimum wage for most workers."},{"id":"rent","t":"Rent rules and rent supplements","_a":"bxpcSBMTPA==","desk":"Provincial: your MPP","sup":"P2","hh":["H1","H2","H3","H4","H5"],"names":["rent supplement","rent rule","rent control"],"why":"Rent rules and rent supplements are set by the province."},{"id":"local","t":"Local transit routes and community garden space","_a":"bxpSW0Fs","desk":"Municipal: your city councillor","sup":null,"hh":[],"names":["transit","community garden"],"why":"Cities decide local transit routes and community garden space."}],"reps":[{"id":"mp","t":"MP"},{"id":"mpp","t":"MPP"},{"id":"cc","t":"City councillor"}],"evidence":[{"id":"E1","t":"Research: food insecurity tracks income; most food-insecure households have wages (PROOF)","research":true},{"id":"E2","t":"Explorer result for my household"},{"id":"E3","t":"Research: school food programs improve children’s diets","research":true},{"id":"E4","t":"Research: food insecurity drops after 65 with public pensions","research":true},{"id":"E5","t":"A post I saw online"}],"banned":["lazy","bad choices","should budget","don't know how to cook"],"letterLabel":"Your letter (saved on this device)","models":[{"title":"Model 1: minimum wage, MPP, Kiara (H4), evidence E1 + E2","text":"Dear [MPP name],\nI am a Grade 12 student in your riding, writing about food insecurity among young workers. Research using Statistics Canada’s Canadian Income Survey shows that most food-insecure households in the provinces rely mainly on wages, not social assistance (PROOF, 2023). In our class model, a 24-year-old student working part-time in Kingston has $200 a month left for food after rent and essentials, while a nutritious food basket costs $450. When her income rises by $300 a month, she can afford that basket. A higher minimum wage, set by the province, would raise incomes like hers directly. I am asking you to support raising Ontario’s minimum wage so that it keeps pace with rent and food costs. Food insecurity is about income compared with costs. Thank you for considering this request.\nSincerely,\n[Name]"},{"title":"Model 2: Canada Child Benefit, MP, Celine (H1), evidence E1 + E2","text":"Dear [MP name],\nI am writing as a student in your riding to ask you to strengthen the Canada Child Benefit. Household food insecurity in Canada is closely tied to income, and families with children are among those affected (PROOF, 2023). In our class model, a lone parent with two children in Hamilton has $900 a month left for food after housing and essentials, but a nutritious food basket for her family costs $1,000. A $300 monthly increase in support would close that gap and let her buy the vegetables, fruit and protein foods her children need. Because the Canada Child Benefit is a federal program, Parliament can change it. Please support increasing the benefit for low-income families and protecting its value as food prices rise. Thank you for your time and your work for our community.\nSincerely,\n[Name]"},{"title":"Model 3: Nutrition North Canada, MP, the Nunavut family (H5), evidence E1 + E2","text":"Dear [MP name],\nI am a Grade 12 student writing about the cost of food in fly-in northern communities. Food costs in many northern communities are far higher than in southern Canada, and food insecurity rates there are among the highest in the country (Statistics Canada, 2024). In our class model, a family of four in a fly-in community in Nunavut has $2,600 a month for food, while a nutritious food basket costs $2,900. A stronger retail subsidy would bring that basket within reach. Nutrition North Canada is a federal program, so I am asking you to support reviewing it with northern and Inuit organizations so that savings reach families at the checkout. Thank you for listening to students on this issue.\nSincerely,\n[Name]"}],"modelsTitle":"Three model letters"},"cards":[["Food security","Everyone, at all times, can get enough safe, nutritious, culturally acceptable food."],["Household food insecurity (Canada)","Inadequate or insecure access to food because of financial constraints."],["Availability","Enough food is physically there, e.g. on store shelves after the flight arrives."],["Accessibility","People can afford food and reach it."],["Adequacy","Food meets nutritional needs and is safe."],["Acceptability","Food fits culture, religion and dietary needs, and is obtained with dignity."],["Sustainability","Access that holds up over time and in a crisis."],["Nutritious food basket","The cost of a healthy diet for a household, used by public health units to compare with incomes."],["Food banks","Emergency, charitable relief; most food-insecure households don’t use them."],["Income-based policy","Raises or protects income (benefits, wages, pensions) to close the gap at its source."],["Rate vs share","Rate = how likely within a group; share = that group’s portion of all cases."],["Who decides?","The Canada Child Benefit is federal (MP); Ontario Works, ODSP and the minimum wage are provincial (MPP); local transit is municipal (councillor)."]]}};</script>
