.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 03: hero (log page → milk carton), Nutrient detective (cases, retention lab, food records, prediction cards),
   Water stations, task. Role colours from hfa4u.css: micronutrients --nu-micro (violet), water --nu-water (blue),
   vegetables --leaf, protein foods --nu-protein. Red and green stay reserved for feedback. */
/* radio groups (from HFA4U 02) */
.mi-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.mi-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.5rem}
.mi-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.mi-rg.seg button:disabled{opacity:.45}
.mi-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.mi-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.mi-chipset button:not(:disabled):hover{border-color:var(--pen)}
.mi-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.mi-chipset button.mi-vit{border-color:var(--nu-micro)}
.mi-chipset button.mi-min{border-color:var(--nu-micro);border-style:dashed}
.mi-chipset button.mi-vit[aria-checked="true"],.mi-chipset button.mi-min[aria-checked="true"]{border-color:var(--hi)}

/* lab layout */
.mi-lab{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.mi-main,.mi-side{min-width:0}
.mi-side{border-left:1.5px solid var(--rule);padding-left:18px}
.mi-top{margin:0 0 2px}
.mi-h4{margin:14px 0 6px;font-size:1rem}
.mi-side .mi-h4{margin-top:0}
.mi-h5{margin:14px 0 6px;font-size:.95rem}

/* Mode 1: cases */
.mi-cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 10px}
.mi-cbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.35em .6em;min-height:44px;min-width:0}
.mi-cbtn span{font-size:.78rem;color:var(--ink-2);line-height:1.25;overflow-wrap:anywhere}
.mi-cbtn:hover{border-color:var(--pen)}
.mi-cbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.mi-cbtn.solved{border-style:solid;box-shadow:inset 4px 0 0 var(--nu-micro)}
.mi-sv{font-size:.75rem;font-weight:700;color:var(--ink)!important}
.mi-paper{background:var(--sheet);border:1.5px solid var(--ink-2);border-radius:6px;padding:10px 14px;margin:0 0 12px;box-shadow:3px 3px 0 var(--rule)}
.mi-paper h4{margin:0 0 6px}
.mi-clues{margin:0;display:grid;gap:4px}
.mi-clues > div{display:grid;grid-template-columns:5.2rem minmax(0,1fr);gap:8px}
.mi-clues dt{font-size:.82rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;padding-top:.15em}
.mi-clues dd{margin:0}
.mi-solve{margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--rule)}
.mi-nutbox .mi-rgw{flex-wrap:nowrap;align-items:flex-start}
.mi-file ol{margin:0;padding-left:1.4em}
.mi-file li{margin:0 0 .45em}

/* Mode 2: retention lab */
.mi-lctl,.mi-stagebox{min-width:0}
.mi-stagebox{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:6px 12px 10px;margin:0 0 12px}
.mi-stage{display:block;width:100%;height:auto}
.mi-counter{stroke:var(--ink-2);stroke-width:2}
.mi-pot,.mi-board,.mi-dish,.mi-pan,.mi-sink,.mi-bowl{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.mi-pan{fill:none;stroke-width:3}
.mi-board{fill:var(--plate-grain-soft)}
.mi-window{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.mi-knob{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.mi-water{fill:var(--nu-water-soft);stroke:var(--nu-water);stroke-width:1.2}
.mi-basket{stroke:var(--ink-2);stroke-width:2.5;stroke-dasharray:6 4}
.mi-steam path{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round}
.mi-bubble{fill:none;stroke:var(--nu-water);stroke-width:1.5}
.mi-drain{fill:var(--ink-2)}
.mi-drop{fill:var(--nu-water)}
.mi-veg circle,.mi-veg rect,.mi-veg ellipse{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:2}
.mi-veg path{fill:none;stroke:var(--leaf);stroke-width:2.4;stroke-linecap:round}
.mi-slab{fill:var(--ink);font:700 13px var(--font-ui)}
.mi-stxt{fill:var(--ink-2);font:400 13px var(--font-ui)}
.mi-ctag circle,.mi-ctag path{fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round}
.mi-rb{margin:6px 0 0}
.mi-rbh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;font-size:.9rem;margin:0 0 4px}
.mi-rtrack{position:relative;display:block;height:22px;background:var(--sheet);border:1.5px solid var(--nu-micro);border-radius:5px;overflow:hidden}
.mi-rfill{position:absolute;left:0;top:0;bottom:0;background:var(--nu-micro)}
.mi-rval{margin:4px 0 0;font-weight:700;font-variant-numeric:tabular-nums}

/* Mode 3: food records */
.mi-persona{border:1.5px solid var(--rule);border-radius:8px;padding:4px 14px 8px;margin:6px 0 4px;background:var(--sheet)}
.mi-persona p{margin:0 0 4px}
.mi-rec{margin:0;padding-left:1.2em}
.mi-rec li{margin:0 0 .2em}
.mi-abars{display:grid;gap:5px}
.mi-abar{display:grid;grid-template-columns:minmax(5.5rem,7.5rem) minmax(0,1fr) 6.2rem;align-items:center;gap:8px;font-size:.9rem}
.mi-atrack{position:relative;height:18px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.mi-afill{position:absolute;left:0;top:2px;bottom:2px;background:var(--nu-micro);border-radius:3px}
.mi-abar.low .mi-afill{background:repeating-linear-gradient(135deg,var(--nu-micro) 0 5px,var(--nu-micro-soft) 5px 9px)}
.mi-abar.low .mi-alab,.mi-abar.low .mi-aval{font-weight:700}
.mi-aref{position:absolute;left:50%;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--ink)}
.mi-aval{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mi-akey{margin:2px 0 0}
.mi-lowc{display:flex;flex-wrap:wrap;gap:6px}
.mi-lowc .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
#mi-shelf .mi-rgw{margin:0}
.mi-foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:6px;margin:8px 0 12px}
.mi-food{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.35em .6em;min-height:44px;font-size:.88rem;line-height:1.25}
.mi-food:hover{border-color:var(--pen)}
.mi-food[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.mi-ico{flex:0 0 26px;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.mi-slist{margin:0 0 8px;padding-left:1.2em}

/* prediction cards */
.mi-cardh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin:0 0 6px}
.mi-cardp{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:6px}
.mi-csvg{display:block;width:100%;height:auto;max-height:300px}
.mi-ccols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;text-align:center}
.mi-ccols h5{margin:4px 0 0;font-size:.95rem}
.mi-cends p{margin:0 0 4px;font-size:.9rem;min-height:1.3em}
.mi-tank{fill:none;stroke:var(--ink);stroke-width:2.4}
.mi-liquid{fill:var(--nu-micro-soft);stroke:var(--nu-micro);stroke-width:1.5}
.mi-pipe{fill:none;stroke:var(--ink-2);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mi-vdrop{fill:var(--nu-micro)}
.mi-plate{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.mi-lentil{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:1.4}
.mi-glass{stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.mi-oj{fill:var(--hi-soft)}
.mi-tea{fill:var(--plate-grain-soft)}
.mi-mtrack{fill:var(--sheet);stroke:var(--nu-micro);stroke-width:1.5}
.mi-mfill{fill:var(--nu-micro)}
.mi-mmid{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}

/* hero */
.mi-hero{max-width:520px;margin:0 auto}
.mi-hsvg{display:block;width:100%;height:auto}
.mi-page{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.mi-prule{stroke:var(--rule);stroke-width:1.2}
.mi-logh{fill:var(--ink);font:italic 700 17px var(--font-math)}
.mi-logd{fill:var(--ink);font:700 17px var(--font-math)}
.mi-logn{fill:var(--ink);font:italic 400 17px var(--font-math)}
.mi-lemon{fill:var(--hi);stroke:var(--ink-2);stroke-width:2}
.mi-lemon2{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:1}
.mi-lseg{stroke:var(--ink-2);stroke-width:1}
.mi-carton{fill:var(--sheet);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.mi-cside{fill:var(--rule);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.mi-milk{fill:var(--ink);font:700 22px var(--font-ui);letter-spacing:.08em}
.mi-glow{fill:var(--nu-micro-soft);stroke:var(--nu-micro);stroke-width:2.5}
.mi-vd{fill:var(--nu-micro);font:700 12.5px var(--font-ui)}
.hero-fig figcaption.mi-cap{animation:mi-fade .8s ease-out}
@keyframes mi-fade{from{opacity:0}to{opacity:1}}

/* Part 3: water stations */
.mi-st{padding:4px 0 18px;margin:0 0 16px;border-bottom:1.5px solid var(--rule)}
.mi-st h3{margin-top:0}
.mi-bodyw{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:12px 24px;align-items:start}
.mi-body{position:relative;width:100%;max-width:210px;aspect-ratio:200/320}
.mi-bsvg{position:absolute;inset:0;width:100%;height:100%}
.mi-bline{fill:var(--nu-water-soft);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.mi-tap{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;padding:0;border-radius:50%;border:2.5px solid var(--nu-water);background:var(--sheet);color:var(--ink);font:700 .95rem var(--font-ui);line-height:1}
.mi-tap:hover{background:var(--nu-water-soft)}
.mi-tap.seen{border-style:solid;background:var(--nu-water-soft)}
.mi-tap[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.mi-jobp{padding:10px 14px;border-left:4px solid var(--nu-water);background:var(--nu-water-soft);border-radius:4px;min-height:6em}
.mi-jobp h4{margin:0 0 4px}
.mi-jobp p{margin:0 0 .4em;max-width:none}
.mi-joblist{margin:6px 0 4px;padding-left:1.3em;font-size:.9rem}
.mi-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 8px}
.mi-fact{border:1.5px solid var(--nu-water);border-radius:8px;padding:8px 12px;background:var(--sheet)}
.mi-fact p{margin:0;max-width:none}
.mi-note{margin:6px 0 0}
.mi-drinks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.mi-drink{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.35em .8em .35em .5em;font-weight:700;min-height:44px;text-align:left}
.mi-drink:hover{border-color:var(--pen)}
.mi-drink[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.mi-drink svg{width:22px;height:28px;flex:0 0 22px}
.mi-gline{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linejoin:round}
.mi-gw{fill:var(--nu-water-soft)}.mi-gm{fill:var(--sheet);stroke:var(--ink-2);stroke-width:.8}.mi-gj{fill:var(--hi-soft)}.mi-gs{fill:var(--plate-grain-soft)}
.mi-dcard{padding:10px 14px;border-left:4px solid var(--nu-water);background:var(--nu-water-soft);border-radius:4px;min-height:4em}
.mi-dcard h4{margin:0 0 2px}
.mi-dcard p{margin:0}
.mi-dcard ul{margin:2px 0 0;padding-left:1.2em}
.mi-cfg{margin:10px 0 0}
.mi-leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.88rem;margin:4px 0 6px}
.mi-leg span{display:inline-flex;align-items:center;gap:6px}
.mi-lsw{display:inline-block;width:26px;height:0;border-top:3px solid var(--nu-water)}
.mi-lsw.lif{border-top:3px dashed var(--ink-2)}
.mi-prompts{margin:12px 0 4px}
#mi-st3 table.vt td:last-child{white-space:normal;text-align:left;min-width:13rem;font-family:var(--font-ui);font-size:.88rem}
.mi-check{margin:8px 0 0;padding-left:1.2em}
.mi-check li{margin:0 0 .35em}
.mi-frame{margin:12px 0 0;padding:10px 14px;border:1.5px solid var(--rule);border-radius:8px}
.mi-frame p{margin:0 0 .5em}
.mi-frame p:last-child{margin:0}

/* task */
.mi-tin{display:grid;gap:2px;margin:6px 0 8px}
.mi-tpv{display:grid;gap:10px}

@media (max-width:820px){
  .mi-lab{grid-template-columns:minmax(0,1fr)}
  .mi-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
}
@media (max-width:560px){
  .mi-cases{grid-template-columns:minmax(0,1fr)}
  .mi-cbtn{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-height:40px}
  .mi-nutbox .mi-rgw{flex-direction:column;align-items:stretch;gap:4px}
  .mi-nutbox .mi-chipset{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
  .mi-nutbox .mi-chipset button{flex:0 0 auto;white-space:nowrap}
  #mi-m2 .mi-chipset,.mi-tin .mi-chipset{flex-direction:column;align-items:stretch;width:100%}
  #mi-m2 .mi-rgw,.mi-tin .mi-rgw{flex-direction:column;align-items:stretch;gap:4px}
  #mi-m2 .mi-chipset button,.mi-tin .mi-chipset button{border-radius:8px}
  .mi-abar{grid-template-columns:5rem minmax(0,1fr) 5.4rem;font-size:.84rem}
  .mi-bodyw{grid-template-columns:minmax(0,1fr)}
  .mi-body{margin:0 auto}
  .mi-facts{grid-template-columns:minmax(0,1fr)}
  .mi-foods{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .mi-clues > div{grid-template-columns:minmax(0,1fr);gap:0}
  #mi-adv{aspect-ratio:4/3}
}
@media (prefers-reduced-motion:reduce){ .hero-fig figcaption.mi-cap{animation:none} }

<script>window.MV_PAYLOAD={"meta":{"id":"03-micronutrients","nn":"03","slug":"micronutrients","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 1","groupName":"Nutrition Science","trivium":"","size":"M","storageKey":"hfa4u-03-micronutrients-v1","progressKey":"hfa4u-progress-v1:03-micronutrients","toolkit":"1.0.6"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"df9711d4","content":{"id":"03-micronutrients","kind":"topic","title":"Micronutrients: vitamins, minerals, water","topic":"Micronutrients: Vitamins, Minerals, Water","readyTopic":"vitamins, minerals and water","hero":{"headline":"Tiny amounts, enormous effects.","text":"\u003cstrong>Vitamins\u003c/strong> and \u003cstrong>minerals\u003c/strong> are needed in milligrams or micrograms, yet missing one can loosen teeth, bend bones or swell a thyroid. Sailors once died of \u003cstrong>scurvy\u003c/strong> for want of vitamin C. Today, \u003cstrong>fortified\u003c/strong> foods quietly prevent deficiencies across whole populations. In this module you’ll solve deficiency cases, learn to cook without losing vitamins, and look at \u003cstrong>water\u003c/strong>, the nutrient everyone needs most and not everyone can get safely.","fig":{"html":"\u003cdiv class=\"mi-hero\" id=\"mi-hero\">\u003c/div>","caption":""},"log":{"head":"Ship’s log","date":"1747","lines":["Two men given","oranges and lemons…","recovered."]},"aria":"A ship’s log page dated 1747 reads “Two men given oranges and lemons… recovered.” A lemon slice slides onto the page. Then the page fades beside a modern carton of fortified milk, and the label line “Vitamin D added” glows.","caption":"From a sailor’s cure to a public health policy."},"goals":["I can classify vitamins as water- or fat-soluble and minerals as major or trace, and give food sources for each.","I can link a deficiency disease to its nutrient from its symptoms and history.","I can explain why excess intake is a bigger risk for some micronutrients than others.","I can choose cooking and storage methods that keep more vitamins in food.","I can explain water’s functions and discuss safe drinking water as a nutrition and equity issue.","I can explain how fortification policies prevent deficiencies in a population."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Vitamin groups","goal":1,"prompt":"Which vitamin is \u003cstrong>fat-soluble\u003c/strong>?","options":[{"t":"Vitamin D","why":"A, D, E and K are fat-soluble.","_n":"06eb","_k":"1a995011"},{"t":"Folate","why":"A B vitamin, water-soluble.","_n":"171b","_k":"edb9db44"},{"t":"Thiamin (B1)","why":"Water-soluble.","_n":"270b","_k":"d78462e2"},{"t":"Vitamin C","why":"Vitamin C is water-soluble.","_n":"373b","_k":"70449ca0"}],"hints":["Remember the four fat-soluble vitamins.","A, D, E, K.","Vitamin D."]},{"id":"w2","skill":"Vitamin groups","goal":3,"prompt":"Why are fat-soluble vitamins more likely to reach harmful levels from supplements?","options":[{"t":"They give more energy","why":"Vitamins give no energy.","_n":"472b","_k":"11b3ab92"},{"t":"They’re stored in body fat and the liver instead of being excreted quickly","why":"Fat-soluble vitamins are stored. High-dose supplements can build up to harmful levels.","_n":"575b","_k":"07edde2f"},{"t":"They’re found only in supplements","why":"Foods contain them.","_n":"674b","_k":"18124bb2"},{"t":"They’re bigger molecules","why":"Size isn’t the reason.","_n":"777b","_k":"ddc459f0"}],"hints":["Where do they go when you have extra?","Into storage.","They’re stored in body fat and the liver instead of being excreted quickly."]},{"id":"w3","skill":"Food sources","goal":1,"prompt":"Which food is a rich source of \u003cstrong>vitamin C\u003c/strong>?","options":[{"t":"Red bell pepper","why":"Peppers, citrus, broccoli and strawberries are rich sources.","_n":"876b","_k":"5cafc655"},{"t":"Cheese","why":"Almost none.","_n":"9f2a","_k":"bc8e736d"},{"t":"Chicken","why":"Almost none.","_n":"af3a","_k":"6b952758"},{"t":"White rice","why":"Almost none.","_n":"bf4a","_k":"c1e6b018"}],"hints":["Think fruits and vegetables.","Bright peppers are among the richest.","Red pepper."]},{"id":"w4","skill":"Food sources","goal":1,"prompt":"Which food supplies \u003cstrong>heme\u003c/strong> iron?","options":[{"t":"Beef","why":"Heme iron comes from meat, fish and poultry and is well absorbed.","_n":"cf5a","_k":"60c6092f"},{"t":"Spinach","why":"Non-heme iron.","_n":"df6a","_k":"44873aac"},{"t":"Lentils","why":"Non-heme iron.","_n":"ef7a","_k":"54478fd0"},{"t":"Fortified cereal","why":"Non-heme iron.","_n":"ff8a","_k":"e2791e30"}],"hints":["Heme is in animal flesh.","Meat, fish, poultry.","Beef."]},{"id":"w5","skill":"How cooking changes food","goal":4,"prompt":"You boil broccoli for 10 minutes and pour the water down the drain. What happened to much of its vitamin C?","options":[{"t":"It became more concentrated","why":"It was lost, not concentrated.","_n":"gf9a","_k":"1217791c"},{"t":"It leached into the water and went down the drain","why":"Water-soluble vitamins leach into the water. Pour it away, and they go too.","_n":"hfaa","_k":"002fc0a4"},{"t":"It turned into vitamin A","why":"Vitamins don’t convert like that.","_n":"ifba","_k":"bafc57ad"},{"t":"Nothing; vitamins can’t move","why":"Water-soluble vitamins dissolve out.","_n":"j84a","_k":"3c2c8622"}],"hints":["Water-soluble means…?","It dissolves in water.","It leached into the water and went down the drain."]},{"id":"w6","skill":"How cooking changes food","goal":4,"prompt":"Milk is often sold in opaque containers. Which vitamin does this protect?","options":[{"t":"Vitamin D, which needs light","why":"Light doesn’t add vitamin D to milk.","_n":"k83a","_k":"9ff12d80"},{"t":"Riboflavin (B2), which light destroys","why":"Light destroys riboflavin, so an opaque container keeps more of it.","_n":"l86a","_k":"52b916a1"},{"t":"Calcium","why":"A mineral, not light-sensitive.","_n":"m85a","_k":"1b7f6c20"},{"t":"Iron","why":"Iron is a mineral; light doesn’t destroy it.","_n":"n88a","_k":"338a4f3a"}],"hints":["Which nutrients are light-sensitive?","Riboflavin.","Riboflavin (B2), which light destroys."]}],"refreshers":{"Vitamin groups":"Fat-soluble: A, D, E, K (stored; absorbed with fat). Water-soluble: the B vitamins and C (not stored much; leach into water).","Food sources":"Vitamin C: peppers, citrus, broccoli. Heme iron: meat, fish, poultry; non-heme iron: legumes, tofu, fortified cereals, leafy greens. Vitamin D: fortified milk and plant beverages, fatty fish, eggs.","How cooking changes food":"Heat, light, air and water reduce vitamins. Cook briefly with little water, and keep the cooking liquid when you can."}}},"explore":{"heading":"Nutrient detective","intro":"Solve cases from history and today, then run the retention lab: cook a vegetable your way and see what’s left.","nutrients":[{"id":"a","t":"Vitamin A","g":"v"},{"id":"c","t":"Vitamin C","g":"v"},{"id":"d","t":"Vitamin D","g":"v"},{"id":"k","t":"Vitamin K","g":"v"},{"id":"thiamin","t":"Thiamin","g":"v"},{"id":"niacin","t":"Niacin","g":"v"},{"id":"folate","t":"Folate","g":"v"},{"id":"b12","t":"Vitamin B12","g":"v"},{"id":"ca","t":"Calcium","g":"m"},{"id":"fe","t":"Iron","g":"m"},{"id":"i","t":"Iodine","g":"m"},{"id":"f","t":"Fluoride","g":"m"},{"id":"zn","t":"Zinc","g":"m"},{"id":"na","t":"Sodium","g":"m"}],"cases":[{"id":"c1","clues":[["Setting","A sailor in the 1740s, months at sea"],["Diet","Salted meat and biscuits"],["Symptoms","Bleeding gums, bruising, slow-healing wounds"]],"_a":"RgVFU1RXRg==","label":"Vitamin C deficiency (scurvy)","note":"In 1747, two sailors given oranges and lemons recovered. Ships began carrying citrus, which supplied vitamin C."},{"id":"c2","clues":[["Setting","A toddler in a smoky industrial city in the 1920s"],["Twist","Rarely outdoors"],["Diet","No fortified milk"],["Symptoms","Bowed legs"]],"_a":"RgJFU1RXRg==","label":"Vitamin D deficiency (rickets)","note":"Few foods naturally contain vitamin D, and sunlight was scarce. Today Canada adds vitamin D to cow’s milk."},{"id":"c3","clues":[["Setting","A region with iodine-poor soil"],["Twist","Before salt was iodized"],["Symptoms","A swelling at the front of the neck"]],"_a":"Rg9FU1RXRg==","label":"Iodine deficiency (goitre)","note":"Iodized table salt now prevents goitre: most people get enough iodine without changing their habits."},{"id":"c4","clues":[["Setting","Early 1900s"],["Diet","Mostly corn not treated with lime"],["Symptoms","Rash on sun-exposed skin, diarrhea, confusion"]],"_a":"RghQVlJYCkgAA18V","label":"Niacin deficiency (pellagra)","note":"Corn not treated with lime holds its niacin in a form the body can’t use. Nixtamalization, a Mesoamerican Indigenous technique, releases it."},{"id":"c5","clues":[["Setting","Late 1800s"],["Diet","Mostly polished white rice"],["Symptoms","Weakness, nerve damage in the legs"]],"_a":"RhJRXlBcDVoYAlxREw==","label":"Thiamin deficiency (beriberi)","note":"Polishing removes the rice’s thiamin-rich outer layers."},{"id":"c6","clues":[["Setting","Today: a teen"],["Diet","Stopped eating meat without planning other iron sources"],["Symptoms","Tired, pale, short of breath on stairs"]],"_a":"RgBcS1VUAhY=","label":"Iron deficiency (anemia)","note":"Iron-deficiency anemia is common today. Legumes, tofu and fortified cereals supply non-heme iron; vitamin C helps the body absorb it."},{"id":"c7","clues":[["Setting","Today: a young child at home"],["Twist","Swallowed several of an adult’s iron pills"],["Symptoms","Stomach pain and vomiting: an emergency"]],"_a":"RgBcS1RJBxY=","label":"Iron excess (toxicity)","note":"Iron is the classic poisoning risk for young children. Keep supplements out of reach."},{"id":"c8","clues":[["Setting","Today: a child"],["Twist","Often swallowed fluoride toothpaste"],["Symptoms","Faint white streaks on the adult teeth"]],"_a":"RgBFUklSRg==","label":"Fluoride excess (dental fluorosis)","note":"Excess matters too: too much fluoride while the adult teeth form leaves dental fluorosis."},{"id":"c9","clues":[["Setting","Today"],["Who","A pregnant person"],["Twist","Taking high-dose vitamin A supplements"]],"_a":"RgdFUklSRg==","label":"Vitamin A excess (risk of birth defects)","note":"Fat-soluble vitamins are stored, so high doses build up. Excess vitamin A in pregnancy risks birth defects."}],"caseMsgs":{"type":"Right nutrient. Is it missing, or is there too much?","wrong":"Not this one. The setting, the diet and the symptoms all point to one nutrient.","pick":"Choose a nutrient first, then deficiency or excess."},"methods":[{"id":"raw","t":"Raw","kept":100,"tex":"Crisp (raw)","where":"Nothing lost to cooking: it’s raw."},{"id":"steam5","t":"Steam 5 min","kept":85,"tex":"Tender-crisp","where":"A little broke down in the heat. Steam barely touches it, so little leached out."},{"id":"steam10","t":"Steam 10 min","kept":75,"tex":"Soft","where":"More broke down with the longer heating."},{"id":"mic3","t":"Microwave 3 min (2 tbsp water)","short":"Microwave 3 min","kept":85,"tex":"Tender-crisp","where":"A little broke down in the heat. With only 2 tbsp of water, little leached out."},{"id":"mic6","t":"Microwave 6 min (2 tbsp water)","short":"Microwave 6 min","kept":75,"tex":"Soft","where":"More broke down with the longer heating."},{"id":"boil5","t":"Boil 5 min","kept":65,"keptW":80,"tex":"Tender","where":"About a third leached into the water you poured away.","whereW":"Some leached into the water, but you kept it in the soup or sauce."},{"id":"boil10","t":"Boil 10 min","kept":50,"keptW":65,"tex":"Very soft","where":"About half leached into the water you poured away.","whereW":"Much leached into the water and you kept it, but the long boil broke more down."},{"id":"stir4","t":"Stir-fry 4 min","kept":80,"tex":"Tender-crisp","where":"Some broke down in the heat. There’s no water to leach into."}],"vegs":[{"id":"broccoli","t":"Broccoli","vitA":"Good source (dark green)","a":true},{"id":"carrots","t":"Carrots","vitA":"Good source (orange: beta-carotene)","a":true},{"id":"pepper","t":"Red pepper","vitA":"Good source (red-orange: beta-carotene)","a":true},{"id":"spinach","t":"Spinach","vitA":"Good source (dark green)","a":true},{"id":"potato","t":"Potato","vitA":"Not a source","a":false}],"cutEarly":5,"persona":{"title":"Sam, 17, vegan","intro":"Sam eats a varied vegan diet. One day of his food record:","record":["Breakfast: iron-fortified cereal with an unfortified oat drink, and orange slices","Lunch: lentil soup, and whole-grain bread with peanut butter","Snack: an apple and a handful of almonds","Dinner: tofu stir-fry with red pepper and broccoli, and brown rice"],"bars":[{"id":"c","t":"Vitamin C","v":180,"_n":"o87a","_k":"83a864f0"},{"id":"folate","t":"Folate","v":130,"_n":"p8aa","_k":"d2fd589d"},{"id":"fe","t":"Iron","v":100,"_n":"q89a","_k":"d71fe6f0"},{"id":"a","t": th equally","_n":"1c87a","_k":"f92c7a8d"}],"explain":"Fat-soluble vitamins are stored."},{"id":"p4","prompt":"A plate of lentils with a glass of orange juice vs the same with black tea. Which drink helps the body absorb the lentils’ iron?","options":[{"t":"Orange juice","_n":"1d8aa","_k":"7541b3bb"},{"t":"Neither","_n":"1e8ba","_k":"56a8a506"},{"t":"Black tea","_n":"1f8ca","_k":"573535c8"},{"t":"Both","_n":"1g8da","_k":"8936b52a"}],"explain":"Vitamin C boosts non-heme iron absorption; tea’s polyphenols reduce it."}],"challenges":[{"id":"tc1","goal":2,"prompt":"Solve case C4.","_a":"H0RXFQsTCl0FBVBZEx1GQEZcG1NUV0ZJ","why":"Niacin deficiency: pellagra.","banner":"Indigenous food knowledge prevented this disease for centuries before science explained it.","msgs":{"c":"Scurvy has bleeding gums, not a sun-exposed rash.","thiamin":"Beriberi follows polished rice, not corn.","type":"Right nutrient. Is it missing, or is there too much?","open":"Open case C4 in Detective cases, then choose a nutrient and whether it’s a deficiency or an excess."},"general":"That nutrient doesn’t fit case C4’s clues. Use a hint if you’re stuck.","hints":["Rash where the sun hits, digestion trouble, confusion: three D’s.","Corn not treated with lime holds its niacin in a form the body can’t use. Traditional nixtamalization, a Mesoamerican Indigenous technique, releases it.","Niacin deficiency: pellagra."]},{"id":"tc2","goal":4,"prompt":"Cook broccoli until tender while keeping \u003cstrong>at least 80%\u003c/strong> of its vitamin C.","why":"Less water and less time keep more.","msgs":{"boil5":"Use the cooking water, or switch to steaming.","early":"That passes. Cutting just before would keep 5 more points.","raw":"The goal says cooked until tender.","veg":"The challenge is about broccoli. Choose broccoli in the Retention lab.","low":"That keeps {k}%. Less water and less time keep more."},"hints":["Less water and less time keep more.","Steam or microwave briefly.","Steam 5 minutes: 85%."]},{"id":"tc3","goal":6,"stretch":true,"prompt":"Persona \u003cstrong>Sam, 17, vegan\u003c/strong>: his food record (model data) shows two nutrients below the reference. Name them, then choose \u003cstrong>one\u003c/strong> food or product from the shelf that addresses the one plant foods can’t supply. (Food records, Mode 3)","why":"B12 comes from animal foods and fortified foods; vegans need fortified foods or a supplement.","msgs":{"spinach":"Spinach’s calcium is poorly absorbed (oxalates). And the shelf choice should be the B12 gap.","mush":"These aren’t reliable B12 sources.","iron":"Sam’s record shows iron at the reference, from tofu, lentils and fortified cereal.","two":"In Food records, tap the two nutrients below the reference line.","pair":"Look again at Sam’s bars: which two fall short of the reference line?","shelf":"Now choose one item from the shelf.","tofu":"Calcium-set tofu helps with calcium, but the shelf choice should be the B12 gap."},"hints":["Which vitamin comes only from animal or fortified foods?","B12. And the mineral in milk, often low in vegan diets?","B12 and calcium; choose fortified soy beverage, which also adds calcium."]}],"blocks":[{"title":"What the detective work shows","html":"\u003cp>Each nutrient leaves a \u003cstrong>fingerprint\u003c/strong> when it’s missing. \u003cstrong>Water-soluble\u003c/strong> vitamins are the easiest to lose in the kitchen; \u003cstrong>fat-soluble\u003c/strong> ones are the easiest to overdo from pills.\u003c/p>\u003cp class=\"tiny muted\">For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}]},"part3":{"slug":"water","name":"Water","heading":"Water, the forgotten nutrient","intro":"Water sits beside vitamins and minerals as a nutrient. Visit three stations: what water does in the body, what different drinks add, and the data on safe drinking water in First Nations communities. Then try the quick check.","jobs":{"title":"Station 1: Water’s jobs","intro":"Tap each point on the body outline to open one of water’s jobs.","points":[{"id":"temp","t":"Regulates temperature","sub":"sweat","text":"Sweat carries heat away as it evaporates from the skin."},{"id":"trans","t":"Transports nutrients and wastes","sub":"blood, urine","text":"Blood carries nutrients to every cell; urine carries wastes out of the body."},{"id":"cush","t":"Cushions joints and organs","sub":"joints, organs","text":"Watery fluids cushion the joints and protect organs."},{"id":"react","t":"Takes part in chemical reactions","sub":"digestion","text":"Water takes part in reactions, such as breaking food down in digestion."}],"facts":["Water is roughly 50–60% of adult body mass.","Health Canada’s adequate intake for total water (from food \u003cstrong>and\u003c/strong> drinks) is about 2.7 L a day for adult women and 3.7 L for adult men; about 20% comes from food."],"note":"There’s no single “eight glasses” rule; needs vary with heat, activity and body size."},"drinks":{"title":"Station 2: Drink choices","intro":"Tap each drink to see what it adds. Every one of them supplies water.","cfg":"Canada’s Food Guide: “Make water your drink of choice.”","list":[{"id":"water","t":"Water","adds":["Water","No sugars and no energy"]},{"id":"milk","t":"Milk","adds":["Water","Protein","Calcium","Vitamin D (added in Canada)","Naturally occurring sugar (lactose)"]},{"id":"juice","t":"100% juice","adds":["Water","Vitamin C","Naturally occurring sugars","Less fibre than the whole fruit"]},{"id":"soda","t":"Sugar-sweetened soft drink","adds":["Water","Added sugars","Few or no vitamins or minerals"]}]},"data":{"title":"Station 3: Check it with data","intro":"Safe drinking water in First Nations communities: long-term drinking water advisories on public systems on reserves, since November 2015.","rows":[{"when":"November 2015","x":2015.84,"lifted":0,"remain":105,"src":"Indigenous Services Canada (2026)"},{"when":"November 2020","x":2020.84,"lifted":null,"remain":60,"src":"Office of the Auditor General of C  100 long-term drinking water advisories have now been lifted since 2015\u003c/i> [News release]. Government of Canada.\u003c/li>\u003cli>Indigenous Services Canada. (2025). \u003ci>Statement on National Indigenous Water Operator Day 2025\u003c/i>. Government of Canada.\u003c/li>\u003cli>Indigenous Services Canada. (2026). \u003ci>Ending long-term drinking water advisories\u003c/i>. Government of Canada.\u003c/li>\u003cli>Office of the Auditor General of Canada. (2025). \u003ci>Follow-up on programs for First Nations\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Water quick check","summary":"Water quick check","items":[{"id":"q1","goal":5,"prompt":"Which counts toward total water intake?","choices":[{"t":"Only plain water","fb":"Food and other drinks contribute.","_n":"1h86a","_k":"7c843533"},{"t":"Water, milk, soup and juicy fruit","fb":"Right. Food and other drinks contribute.","_n":"1i87a","_k":"5133b6c8"},{"t":"Only drinks","fb":"Food and other drinks contribute.","_n":"1j88a","_k":"120ffa9f"},{"t":"Only water and milk","fb":"Food and other drinks contribute.","_n":"1k89a","_k":"b405bc07"}]},{"id":"q2","goal":5,"prompt":"“Potable” water is water that is…","choices":[{"t":"Heated","fb":"Potable = safe for drinking.","_n":"1l82a","_k":"ccd8fa73"},{"t":"Bottled","fb":"Potable = safe for drinking.","_n":"1m83a","_k":"4a44dceb"},{"t":"Safe to drink","fb":"Right. Potable = safe for drinking.","_n":"1nfcb","_k":"1ee5efd0"},{"t":"Carbonated","fb":"Potable = safe for drinking.","_n":"1ofbb","_k":"90236d07"}]},{"id":"q3","goal":5,"prompt":"Which job of water cools you during exercise?","choices":[{"t":"Building bone","fb":"Evaporating sweat carries heat away.","_n":"1pfeb","_k":"e64deed3"},{"t":"Storing energy","fb":"Evaporating sweat carries heat away.","_n":"1qfdb","_k":"f30f9faf"},{"t":"Cushioning joints","fb":"Evaporating sweat carries heat away.","_n":"1rf8b","_k":"d1030308"},{"t":"Temperature regulation (sweat)","fb":"Right. Evaporati icy reaches people before they know they’re pregnant.","_n":"2708b","_k":"e6eafb6a"},{"t":"Goitre in adults","why":"That’s iodine. Folate in early pregnancy supports neural tube closure; a policy reaches people before they know they’re pregnant.","_n":"2807b","_k":"15ae21d2"}],"hints":["Folic acid is a form of folate, a B vitamin.","Folate matters most very early in pregnancy, for the neural tube.","Neural tube defects in newborns."]},{"id":"d4","goal":[2,3],"prompt":"An older adult eats meat but has low B12 levels. Most likely reason? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"B12 is fat-soluble, so it builds up and stops working","why":"B12 is a water-soluble B vitamin. Intake isn’t the only factor: absorption changes with age.","_n":"2906b","_k":"7d57a0fa"},{"t":"Meat contains no B12","why":"Meat is a B12 source. Intake isn’t the only factor: absorption changes with age.","_n":"2a05b","_k":"0d85107d"},{"t":"Older adults no longer need B12","why":"They still need it. Intake isn’t the only factor: absorption changes with age.","_n":"2b0cb","_k":"0c65e89c"},{"t":"Less stomach acid and intrinsic factor with age reduces B12 absorption","why":"Intake isn’t the only factor: absorption changes with age.","_n":"2c0bb","_k":"9cadb2d7"}],"hints":["Does eating a nutrient guarantee the body takes it in?","Absorption can change with age.","Less stomach acid and intrinsic factor with age reduces B12 absorption."]},{"id":"d5","goal":[1,2],"prompt":"A persona’s calcium comes mostly from spinach. A dietitian suggests calcium-set tofu or a fortified beverage. Why? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Spinach’s oxalates block most of its calcium","why":"Spinach has calcium, but oxalates block most of it. Choose milk products, fortified beverages or calcium-set tofu.","_n":"2d0ab","_k":"b96e9c03"},{"t":"Spinach has no calcium","why":"Spinach has calcium, but oxalates block most of it. Choose milk products, fortified beverages or calcium-set tofu.","_
