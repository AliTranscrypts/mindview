.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 22: hero (food chain loop), Emissions along the chain (F9: Chain view stage bars, Canada impacts map + risk cards,
   Farm plan cards + meters), Plate footprints (meal builder, dish table), Footprint reasoning, Three-day cafeteria menu.
   Stage bars: --sys-emis brown fills on --sys-stage ink tracks with value labels. Risk levels: words + pips + icons.
   Meters: emissions blue --pen, resilience cerulean --p-t, each with a number. Red and green only in feedback. */
/* radio groups (from HFA4U 16) */
.cfs-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.cfs-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem;margin:0 0 4px}
.cfs-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.cfs-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cfs-chipset button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.cfs-chipset button:hover:not(:disabled){border-color:var(--pen)}
.cfs-chipset button[aria-checked="true"],.cfs-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cfs-chipset button:disabled{opacity:.8}
.cfs-h4{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* hero */
.cfs-hero{width:100%}
.cfs-hsvg{display:block;width:100%;height:auto;max-height:420px}
.cfs-hs{fill:none;stroke:var(--sys-stage);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.cfs-hch{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:4 4}
.cfs-hl{fill:var(--ink);font:700 16px var(--font-ui)}
.cfs-hg{fill:var(--ink);font:700 15px var(--font-ui)}
.cfs-hpuff{fill:var(--sheet);stroke:var(--sys-emis);stroke-width:2.4}
.cfs-hth{fill:var(--sheet);stroke:var(--ink);stroke-width:2.2}
.cfs-hthf{fill:var(--p-k)}
.cfs-hloop{fill:none;stroke:var(--ink-2);stroke-width:3;stroke-dasharray:1}
.cfs-hhead{fill:none;stroke:var(--ink-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cfs-hcrack{fill:none;stroke:var(--sys-emis);stroke-width:2.4;stroke-linecap:round}
.cfs-hflood{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linecap:round}
.cfs-hcause{fill:var(--ink);font:italic 700 17px var(--font-ui)}
.cfs-cap{font-size:1rem!important;font-weight:700}

/* explore layout */
.cfs-lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:8px}
@media (max-width:760px){.cfs-lab{grid-template-columns:minmax(0,1fr)}}
.cfs-main,.cfs-side{min-width:0}
.cfs-side>div{margin-bottom:12px}
.cfs-readw{background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}

/* chain view */
.cfs-scale{margin:0 0 6px}
.cfs-cbs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.cfs-cbs.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cfs-cb{background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.cfs-bars{list-style:none;margin:0;padding:0}
.cfs-bar{display:grid;grid-template-columns:6.6rem minmax(0,1fr) 3.2rem;align-items:center;gap:8px;margin:3px 0;padding:2px 4px;border-radius:6px}
.cfs-bl{font-size:.88rem;color:var(--ink)}
.cfs-bt{display:block;height:16px;border:1.5px solid var(--sys-stage);border-radius:4px;background:var(--paper);position:relative;overflow:hidden}
.cfs-bt i{display:block;height:100%;background:var(--sys-emis)}
.cfs-bv{font-size:.88rem;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.cfs-bar.tr .cfs-bl{font-weight:700}
.cfs-bar.hot{background:var(--hi-soft);outline:2.5px solid var(--hi)}
.cfs-bar.hot .cfs-bl{font-weight:700}
.cfs-tot{margin:8px 0 2px}
.cfs-capt{margin:4px 0 0;font-weight:700}
.cfs-air{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--hi);color:var(--hi-ink)}
.cfs-note{margin:8px 0 0}
.cfs-all{margin-top:10px}
.cfs-half{margin-top:6px;border:1.5px dashed var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .9em;min-height:36px;font-size:.92rem;cursor:pointer}
.cfs-half[aria-pressed="true"]{border-style:solid;background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* Canada impacts */
.cfs-cmap{display:block;width:100%;height:auto;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;margin-bottom:10px}
.cfs-reg{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5;stroke-linejoin:round}
.cfs-mk{fill:var(--sheet);stroke:var(--ink);stroke-width:2.2}
.cfs-mk.on{fill:var(--hi);stroke:var(--ink);stroke-width:3}
.cfs-mlab{fill:var(--ink-2);font:400 15px var(--font-ui)}
.cfs-mlab.on{fill:var(--ink);font-weight:700}
@media (max-width:560px){.cfs-cmapw{display:none}}
.cfs-risks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.cfs-risk{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;align-items:center;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px}
.cfs-risk.ch{border-color:var(--hi);background:var(--hi-soft)}
.cfs-ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--ink);grid-row:span 2}
.cfs-rt{font-size:.9rem;display:flex;flex-direction:column}
.cfs-rv{font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.cfs-pips{display:inline-flex;gap:3px}
.cfs-pips i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink-2)}
.cfs-pips i.on{background:var(--ink)}
.cfs-was{font-weight:400;font-size:.82rem;color:var(--ink-2)}

/* farm plan */
.cfs-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.cfs-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;cursor:pointer;font:inherit}
.cfs-card:hover{border-color:var(--pen)}
.cfs-card.on{border:2.5px solid var(--hi);background:var(--hi-soft)}
.cfs-cl{grid-row:span 2;font-weight:700;font-size:1.05rem;width:1.7rem;height:1.7rem;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.cfs-card.on .cfs-cl{background:var(--ink);color:var(--sheet)}
.cfs-ct{font-size:.9rem;font-weight:700}
.cfs-ce{font-size:.82rem;color:var(--ink-2)}
.cfs-fmsg{min-height:1.2em;margin:6px 0}
.cfs-meter{margin:8px 0}
.cfs-ml{margin:0 0 4px}
.cfs-mt{position:relative;height:16px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--paper)}
.cfs-mt b{position:absolute;top:0;bottom:0;display:block}
.cfs-meter.em .cfs-mt b{background:var(--pen)}
.cfs-meter.rs .cfs-mt b{background:var(--p-t)}
.cfs-mt i.z{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);margin-left:-1px}
.cfs-mx{display:flex;justify-content:space-between;margin:2px 0 0}

/* Part 3 */
.cfs-p3{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.cfs-p3{grid-template-columns:minmax(0,1fr)}}
.cfs-srv{list-style:none;margin:0;padding:0}
.cfs-srv li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.cfs-st{min-width:0;flex:1 1 12rem}
.cfs-sc{display:flex;align-items:center;gap:6px}
.cfs-pm{min-width:36px;min-height:36px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;font:inherit;font-weight:700;cursor:pointer;padding:0 8px}
.cfs-pm:hover:not(:disabled){border-color:var(--pen)}
.cfs-pm:disabled{opacity:.45;cursor:default}
.cfs-adt{font-weight:400;font-size:.85rem}
.cfs-n{min-width:1.4rem;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cfs-plate{background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;position:sticky;top:70px}
.cfs-pl{margin:0 0 8px;padding-left:1.1rem}
.cfs-stack{display:flex;height:18px;border:1.5px solid var(--sys-stage);border-radius:4px;overflow:hidden;background:var(--sheet)}
.cfs-stack i{display:block;height:100%;border-right:1.5px solid var(--sheet)}
.cfs-stack i.k0{background:var(--sys-emis)}
.cfs-stack i.k1{background:var(--ink-2)}
.cfs-stack i.k2{background:var(--plate-grain)}
.cfs-stack i.k3{background:var(--ink)}
.cfs-ptot{margin:8px 0;font-size:1.05rem}
.cfs-dt{margin-top:16px}
.cfs-frame{margin:12px 0;border-left:4px solid var(--ink-2);background:var(--paper);padding:8px 12px;border-radius:0 8px 8px 0}
.cfs-frame p{margin:0}

/* practice: footprint reasoning */
.cfs-unit{font-size:.9rem;color:var(--ink-2);margin-left:6px}
.cfs-mchips,.cfs-mcs{margin:8px 0}
.cfs-mcs button{border-radius:8px}

/* task */
.cfs-dchips button{border-radius:8px;display:flex;flex-direction:column;align-items:flex-start}
.cfs-dm{font-size:.8rem;font-weight:400;color:inherit;opacity:.9}
.cfs-tray{background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.cfs-ttab{width:100%;border-collapse:collapse;font-size:.9rem}
.cfs-ttab th,.cfs-ttab td{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:left}
.cfs-ttab tfoot th,.cfs-ttab tfoot td{border-top:2px solid var(--ink);border-bottom:0}

</style>
</head>

ms can grow. You’ll follow emissions along the food chain, see how climate change reaches Canadian farms and northern communities, and weigh \u003cstrong>adaptation\u003c/strong> and \u003cstrong>mitigation\u003c/strong>.","fig":{"html":"\u003cdiv class=\"cfs-hero\" id=\"cfs-hero\">\u003c/div>","caption":""},"aria":"A food chain runs left to right: a field, a barn, a truck, a store and a kitchen. Labelled puffs rise from the stages: CO₂, CH₄ and N₂O. They drift up into a thermometer that rises. An arrow loops back down to the field, which cracks in a drought and then floods. The final frame shows the loop labelled cause (emissions going up) and victim (impacts coming back to the farm).","caption":"Cause: every stage of the food chain releases greenhouse gases. Victim: the warming comes back to the farm as drought and flood."},"goals":["I can explain how food systems produce greenhouse gases (carbon dioxide, methane, nitrous oxide) at each stage.","I can compare the life-cycle footprints of foods and explain why the type of food usually matters more than transport.","I can explain how climate change affects food supply and production in Canada and around the world.","I can tell adaptation from mitigation and evaluate strategies, including laws and policies.","I can calculate and compare meal footprints from model data and describe the trade-offs respectfully.","I can evaluate claims about food and climate using reliable evidence."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Greenhouse effect","goal":1,"prompt":"Greenhouse gases warm the planet because they…","options":[{"t":"trap some of the heat that Earth gives off, keeping it in the atmosphere","why":"They let sunlight in but absorb outgoing heat.","_n":"02cc","_k":"a3abfea5"},{"t":"block sunlight from reaching Earth","why":"That would cool the planet.","_n":"129c","_k":"a9804ad1"},{"t":"make a hole in the ozone layer","why":"Ozone depletion is a separate issue.","_n":"22ac","_k":"0b0c301a"},{"t":"are hot gases released by fires","why":"Their effect isn’t about their own temperature.","_n":"327c","_k":"b61011dd"}],"hints":["Sunlight comes in; heat goes out.","Greenhouse gases absorb the outgoing heat.","They trap heat."]},{"id":"w2","skill":"Greenhouse effect","goal":1,"prompt":"Which of these is a greenhouse gas?","options":[{"t":"Helium","why":"Not a greenhouse gas.","_n":"428c","_k":"10ebf239"},{"t":"Oxygen (O₂)","why":"Oxygen doesn’t trap heat.","_n":"525c","_k":"319e6b19"},{"t":"Methane (CH₄)","why":"Methane traps heat strongly.","_n":"626c","_k":"17d94aea"},{"t":"Nitrogen (N₂)","why":"N₂ makes up most of the air but doesn’t trap heat; nitrous oxide (N₂O) does.","_n":"723c","_k":"884a5b3d"}],"hints":["Think of gases from cattle and landfills.","CH₄.","Methane."]},{"id":"w3","skill":"Food supply chain","goal":2,"prompt":"Put the stages in order for a loaf of bread: (1) store, (2) wheat farm, (3) bakery, (4) truck to store.","options":[{"t":"2, 3, 4, 1","why":"Farm → processing (bakery) → transport → retail.","_n":"824c","_k":"0145b52e"},{"t":"2, 4, 3, 1","why":"The bakery comes before the truck to the store.","_n":"9f8d","_k":"be0cd7a9"},{"t":"1, 2, 3, 4","why":"The store comes last.","_n":"af7d","_k":"459faf06"},{"t":"3, 2, 4, 1","why":"Wheat must be grown before baking.","_n":"bfad","_k":"0e53858f"}],"hints":["Where does it start?","Farm first.","Farm, bakery, truck, store."]},{"id":"w4","skill":"Food supply chain","goal":2,"prompt":"Which stage of the food chain happens in your kitchen?","options":[{"t":"Land-use change","why":"That’s clearing land for farming.","_n":"cf9d","_k":"5909048a"},{"t":"Retail","why":"That’s the store.","_n":"df4d","_k":"d9adab34"},{"t":"Preparation, storage and (sometimes) waste at home","why":"Households cook, store and sometimes throw out food.","_n":"ef3d","_k":"1fe773a9"},{"t":"Processing in a factory","why":"That’s before retail.","_n":"ff6d","_k":"ac761be4"}],"hints":["What happens after you buy food?","You store, cook and sometimes waste it.","Household stage."]},{"id":"w5","skill":"Reading bar data","goal":2,"prompt":"A bar chart shows Food P = 12 and Food Q = 3 (kg CO₂e per kg). How many times larger is P’s footprint?","options":[{"t":"4 times","why":"12 ÷ 3 = 4.","_n":"gf5d","_k":"fdecfc85"},{"t":"9 times","why":"12 − 3 = 9 is the difference, not the ratio.","_n":"hf0d","_k":"c0a75774"},{"t":"3 times","why":"3 × 3 = 9, not 12.","_n":"iefd","_k":"02ffb906"},{"t":"36 times","why":"Divide to compare.","_n":"j66d","_k":"74dd2850"}],"hints":["“How many times” means divide.","12 ÷ 3.","4."]},{"id":"w6","skill":"Reading bar data","goal":2,"prompt":"A food’s total footprint is 10, and transport is 1 of that. What share is transport?","options":[{"t":"11%","why":"1 ÷ 9 is a different calculation.","_n":"k67d","_k":"605291c4"},{"t":"10%","why":"1 out of 10 = 10%.","_n":"l68d","_k":"40f685e3"},{"t":"1%","why":"1% would be 1 out of 100.","_n":"m69d","_k":"95fb42cc"},{"t":"90%","why":"90% is everything \u003cem>except\u003c/em> transport.","_n":"n62d","_k":"4e0f05f8"}],"hints":["Share = part ÷ total.","1 ÷ 10.","10%."]}],"refreshers":{"Greenhouse effect":"Sunlight warms Earth; Earth gives off heat; greenhouse gases (carbon dioxide, methane, nitrous oxide) absorb some of that heat. More of these gases means more warming.","Food supply chain":"Land use → farm → processing → transport → retail → household → (waste). Each stage uses energy or releases gases.","Reading bar data":"Ratio = bigger ÷ smaller (“how many times”). Share = part ÷ total × 100%."}}},"explore":{"heading":"Emissions along the chain","intro":"Choose a food to see where its emissions come from. Then see how climate change reaches Canadian farms, and build a plan for a farm.","modes":[{"id":"chain","t":"Chain view"},{"id":"impacts","t":"Canada impacts"},{"id":"farm","t":"Farm plan"}],"stages":[{"id":"land","t":"Land use"},{"id":"farm","t":"Farm"},{"id":"feed","t":"Animal feed"},{"id":"proc","t":"Processing"},{"id":"trans","t":"Tran h"},"cost":{"1":"Medium","2":"High","3":"High"}}],"risks":[{"id":"drought","t":"Drought risk","short":"Drought"},{"id":"flood","t":"Flood risk","short":"Flood"},{"id":"season","t":"Growing season","short":"Season"},{"id":"pests","t":"Pest pressure","short":"Pests"}],"north":[{"id":"ice","t":"Sea-ice season","sub":"shorter"},{"id":"access","t":"Access to country foods at risk","sub":"hunting, fishing, travel on ice"},{"id":"cost","t":"Store-food cost risk","sub":"shipping season, supply disruptions"}],"farmTitle":"A model Prairie mixed farm (grain and cattle)","cards":[{"id":"a","t":"4R fertilizer stewardship (right source, rate, time, place)","e":-10,"r":0,"type":"Mitigation"},{"id":"b","t":"Cover crops with no-till","e":-10,"r":2,"type":"Both"},{"id":"c","t":"Rotational grazing","e":-5,"r":1,"type":"Both"},{"id":"d","t":"Feed additive that reduces cattle methane (model)","e":-15,"r":0,"type":"Mitigation"},{"id":"e","t":"Solar panels for barns and grain dryers","e":-5,"r":0,"type":"Mitigation"},{"id":"f","t":"Drought-tolerant varieties","e":0,"r":2,"type":"Adaptation"},{"id":"g","t":"New irrigation reservoir (pumping energy)","e":5,"r":3,"type":"Adaptation"},{"id":"h","t":"Crop insurance","e":0,"r":1,"type":"Adaptation"}],"dataLine":"Model data based on Poore & Nemecek (2018)","predIntro":"Make a prediction first. Then the model will show you.","predictions":[{"id":"p1","prompt":"Which stage makes up the largest part of beef’s footprint?","options":[{"t":"The farm (mostly methane from cattle)","_n":"o63d","_k":"04696dc7"},{"t":"Retail refrigeration","_n":"p64d","_k":"d06c88c8"},{"t":"Packaging","_n":"q65d","_k":"c83ea7dc"},{"t":"Transport","_n":"r6ed","_k":"d4832cdb"}],"explain":"Cattle digesting grass release methane. Land use is the second largest stage."},{"id":"p2","prompt":"A tomato grown in a heated greenhouse nearby, or a field-grown tomato trucked 3000 km. Which has the smaller footprint in this model?","options":[{"t":"The field-grown, trucked tomato","_n":"s6fd","_k":"a5abaf9a"},{"t":"You can’t compare them","_n":"t6cd","_k":"cce5ac13"},{"t":"The local greenhouse tomato","_n":"u6bd","_k":"4b6d77bf"},{"t":"They’re equal","_n":"v6ad","_k":"cc381a63"}],"explain":"Heating a greenhouse can use more energy than trucking. Local isn’t automatically lower."},{"id":"p3","prompt":"Rice is a plant. What will its footprint be?","options":[{"t":"The same as lentils","_n":"w69d","_k":"7105121e"},{"t":"Larger than beef","_n":"x68d","_k":"7e0df82c"},{"t":"Zero, because plants absorb carbon dioxide","_n":"y67d","_k":"8586f59e"},{"t":"Small but not zero; mostly methane from flooded fields","_n":"z66d","_k":"426f0593"}],"explain":"Flooded paddies release methane, so plant foods are low, not zero."},{"id":"p4","prompt":"Move the warming to +3 °C. What happens to the Prairies’ risks?","options":[{"t":"Nothing changes","_n":"1065d","_k":"30ede156"},{"t":"Only flooding increases","_n":"1174d","_k":"e37ed755"},{"t":"Everything improves with a longer season","_n":"1273d","_k":"cd8b6685"},{"t":"The growing season gets longer, but drought and pest risks rise","_n":"13fad","_k":"8f3a2afa"}],"explain":"A longer season doesn’t help much if water runs short and pests spread."}],"chalIntro":"Set the model, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"In Chain view, find the food where \u003cstrong>transport is more than half of the total footprint\u003c/strong>.","why":"Air freight is the big exception. For most foods, transport is a small share.","hints":["Compare each food’s transport bar with its total.","Which foods travel by air?","Berries (air-freighted): 9.0 of 10.0 is 90%."]},{"id":"tc2","goal":3,"prompt":"In Canada impacts, find the setting where \u003cstrong>drought risk and flood risk are both High\u003c/strong>.","why":"Fraser Valley at +3 °C: both High. More extremes in both directions.","hints":["Find a region where flood risk becomes High first.","The Fraser Valley floods at +2 °C. What happens to its drought risk as warming increases?","Fraser Valley at +3 °C: both High. More extremes in both directions."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Farm plan: choose exactly 3 cards that \u003cstrong>cut emissions by at least 25%\u003c/strong> and reach \u003cstrong>resilience 3 or more\u003c/strong>.","why":"Which other answers can you find? Every answer uses card b.","hints":["Find a card that does both jobs.","Card b (cover crops with no-till) gives −10% and +2. What else do you need?","b + d gives −25% and resilience 2; add c, f or h for resilience (or swap d for a and c)."]}],"msgs":{"tc1Mode":"Switch to Chain view and choose a food first.","tc1Field":"Transport is this tomato’s largest stage (0.3 of 0.7), but that’s 43%, less than half.","tc1Bananas":"Transport is 0.3 of 0.9, a third.","tc1Beef":"Beef’s transport is 1 out of 100.","tc1Other":"This food’s transport share is {p}%, not more than half.","tc1Chip":"Berries it is. Now tap the “Transport is more than half” chip to confirm.","tc2Mode":"Switch to Canada impacts first.","tc2Prairies":"Drought is High there, but flood risk is Medium.","tc2Ontario":"Flood risk is High, but drought is Medium.","tc2Fraser2":"Flood is High, but drought is still Medium.","tc2North":"Nunavut’s model shows sea ice and access to food, not drought and flood levels.","tc2Other":"Here drought is {d} and flood is {f}. Find a setting where both are High.","tc3Count":"Choose exactly 3 cards. You have {n}.","tc3abd":"Emissions −35%, but resilience is only 2.","tc3bfg":"Resilience 7, but irrigation pumping adds emissions: only −5%.","tc3ade":"−30%, but resilience 0: all mitigation, no adaptation.","tc3Other":"This plan gives emissions {e} and resilience {r}. You need −25% or better and resilience 3 or more.","full":"The tray holds 3 cards. Tap a chosen card to remove it first."},"readLabels":{"food":"Food","total":"Total footprint","largest":"Largest stage","share":"Transport share","gas":"Main gas","region":"Region and warming","risks":"Risks","plan":"Farm plan","data":"Data"},"blocks":[{"title":"What the model shows","html":"\u003cul>\u003cli>What you grow matters more than how far it travels: transport is a small share for most foods, with air freight the big exception.\u003c/li>\u003cli>Climate change brings more extremes, not just warmth.\u003c/li>\u003cli>Some actions both cut emissions and build resilience.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"footprints","name":"Plates","heading":"Plate footprints","intro":"Tap servings onto a plate and watch the footprint add up. Then compare the cafeteria dishes. This is about what an institution like a cafeteria can change, not a score for anyone’s own meals.","servings":[{"id":"beef","t":"Beef (100 g)","v":10},{"id":"salmon","t":"Farmed salmon (100 g)","v":1.4},{"id":"cheese","t":"Cheese (50 g)","v":1.2},{"id":"pork","t":"Pork (100 g)","v":1.2},{"id":"chicken","t":"Chicken (100 g)","v":1},{"id":"milk","t":"Milk (250 mL)","v":0.8},{"id":"eggs","t":"Eggs (2)","v":0.5},{"id":"tofu","t":"Tofu (150 g)","v":0.5},{"id":"rice","t":"Rice (1 cup cooked)","v":0.3},{"id":"bread","t":"Bread, tortilla or pastry crust (1 serving)","v":0.1},{"id":"beans","t":"Beans, lentils or chickpeas (175 mL cooked)","v":0.1},{"id":"veg","t":"Vegetables (1 cup)","v":0.1},{"id":"potato","t":"Potatoes (1 medium)","v":0.1},{"id":"corn","t":"Corn or squash (1 cup)","v":0.1}],"builderTitle":"Meal builder","builderAsk":"Tap \u003cstrong>Add serving\u003c/strong> to put food on the plate. The footprint adds up live.","dishes":[{"id":"1","t":"Beef chili","trad":"North American","f":10.3,"cost":4,"p":30,"grp":"animal"},{"id":"2","t":"Chicken shawarma bowl","trad":"Levantine","f":1.5,"cost":4,"p":30,"grp":"animal"},{"id":"3","t":"Chana masala with rice","trad":"South Asian","f":0.5,"cost":2,"p":15,"grp":"plant"},{"id":"4","t":"Tofu and vegetable stir-fry","trad":"East Asian","f":0.9,"cost":3,"p":20,"grp":"plant"},{"id":"5","t":"Bean and cheese burrito","trad":"Mexican","f":1.5,"cost":3,"p":22,"grp":"animal"},{"id":"6","t":"Salmon with potatoes","trad":"Pacific coast","f":1.5,"cost":5,"p":25,"grp":"animal"},{"id":"7","t":"Three Sisters soup (corn, beans, squash)","trad":"Haudenosaunee","f":0.3,"cost":2,"p":12,"grp":"plant"},{"id":"8","t":"Pork tourtière","trad":"Québécois","f":1.5,"cost":3,"p":20,"grp":"animal"}],"dishTitle":"Cafeteria dishes","framing":"These numbers describe foods, not people. What we eat depends on culture, cost, access, health and taste. Institutions like cafeterias can change footprints at scale.","blocks":[{"title":"Check it with data","html":"\u003cp>Real per-kg values come from Poore & Nemecek (2018), as charted by Our World in Data. For example: beef (beef herd) about 100 kg CO₂e/kg; peas about 1.\u003c/p>\u003cp>Food systems’ share: about a third of human-caused greenhouse-gas emissions (Crippa et al., 2021).\u003c/p>\u003cp>\u003cstrong>Country foods:\u003c/strong> Inuit and other northern communities rely on harvested foods such as caribou, seal and Arctic char. These are local, nutrient-rich and culturally central, and aren’t in most footprint tables. Climate change threatens access to them.\u003c/p>\u003ch4>References (APA 7)\u003c/h4>\u003cul class=\"hfa-refs\">\u003cli>Crippa, M., Solazzo, E., Guizzardi, D., Monforti-Ferrario, F., Tubiello, F. N., & Leip, A. (2021). Food systems are responsible for a third of global anthropogenic GHG emissions. \u003ci>Nature Food, 2\u003c/i>(3), 198–209.\u003c/li>\u003cli>Poore, J., & Nemecek, T. (2018). Reducing food’s environmental impacts through producers and consumers. \u003ci>Science, 360\u003c/i>(6392), 987–992.\u003c/li>\u003cli>Ritchie, H., Rosado, P., & Roser, M. (2022). \u003ci>Environmental impacts of food production\u003c/i>. Our World in Data.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Plate footprints quick check","summary":"Plate footprints quick check","items":[{"id":"q1","goal":5,"prompt":"Model: chicken (1.0) + rice (0.3) + vegetables (0.1). The plate’s footprint?","choices":[{"t":"0.14","fb":"Add the three servings.","_n":"14fbd","_k":"3d2cc33d"},{"t":"1.3","fb":"Add the three servings.","_n":"15f8d","_k":"cb5bcd62"},{"t":"1.4","fb":"Right. 1.0 + 0.3 + 0.1 = 1.4.","_n":"16f9d","_k":"784bb7e7"},{"t":"14","fb":"Add the three servings.","_n":"17f6d","_k":"eafe081e"}]},{"id":"q2","goal":5,"prompt":"Replacing beef chili (10.3) with chana masala (0.5) cuts the footprint by…","choices":[{"t":"0.5","fb":"10.3 − 0.5 = 9.8.","_n":"18f7d","_k":"43030f14"},{"t":"9.8","fb":"Right. 10.3 − 0.5 = 9.8.","_n":"19f4d","_k":"dff3af0d"},{"t":"10.8","fb":"10.3 − 0.5 = 9.8.","_n":"1af5d","_k":"d44f65fb"},{"t":"20.6","fb":"10.3 − 0.5 = 9.8.","_n":"1bf2d","_k":"3bb5f9bb"}]},{"id":"q3","goal":2,"prompt":"Which statement is accurate?","choices":[{"t":"Footprints rank people","fb":"Lentils are low, not zero (M3); transport is small (M1); footprints describe foods (M7).","_n":"1cf3d","_k":"5340edaf"},{"t":"Per serving, beef’s footprint is far larger than lentils’","fb":"Right. 10.0 vs 0.1 per serving in the model.","_n":"1d60d","_k":"cf5a2d5c"},{"t":"Lentils have zero footprint","fb":"Lentils are low, not zero (M3); transport is small (M1); footprints describe foods (M7).","_n":"1e5fd","_k":"c1a0b079"},{"t":"Transport makes beef high","fb":"Lentils are low, not zero (M3); transport is small (M1); footprints describe foods (M7).","_n":"1f62d","_k":"f8d14ccf"}]},{"id":"q4","goal":3,"prompt":"Why aren’t country foods like caribou in most footprint tables?","choices":[{"t":"They have huge footprints","fb":"Harvested foods are local and rarely studied in these tables.","_n":"1g61d","_k":"baa13761"},{"t":"They have no nutrients","fb":"Harvested foods are local and rarely studied in these tables.","_n":"1h64d","_k":"d82f3737"},{"t":"They’re imported","fb":"Harvested foods are local and rarely studied in these tables.","_n":"1i63d","_k":"5ad1ff95"},{"t":"Most life-cycle studies cover commercially farmed foods","fb":"Right. Harvested foods are local and rarely studied in these tables.","_n":"1j66d","_k":"a3dec104"}]}]}},"practice":{"activities":[{"id":"gas","type":"sorter","title":"Which gas?","summary":"Which gas?","goal":1,"noun":"source","txt":true,"instruction":"Sort each source into the greenhouse gas it mainly releases.","boxes":[{"id":"co2","label":"Carbon dioxide","sub":"CO₂"},{"id":"ch4","label":"Methane","sub":"CH₄"},{"id":"n2o","label":"Nitrous oxide","sub":"N₂O"}],"wrongDefault":"Ask: burning fuel or clearing land (CO₂)? Digestion or rotting without air (CH₄)? Nitrogen in soil (N₂O)?","items":[{"id":"i1","t":"Cattle digesting grass","_a":"G1RcAEQ=","why":"Cattle digestion releases methane.","wrong":{"co2":"Cattle digestion produces methane."}},{"id":"i2","t":"Flooded rice paddies","_a":"G1RcAEQ=","why":"Flooded fields have no air in the soil, so microbes make methane."},{"id":"i3","t":"Synthetic nitrogen fertilizer on fields","_a":"G1kGW0Q=","why":"Extra nitrogen in soil becomes nitrous oxide.","wrong":{"co2":"Nitrogen fertilizer releases nitrous oxide from soil."}},{"id":"i4","t":"Clearing forest to make pasture","_a":"G1RbBkQ=","why":"Clearing land releases the carbon stored in trees and soil."},{"id":"i5","t":"Diesel tractors and trucks","_a":"G1RbBkQ=","why":"Burning fuel releases carbon dioxide."},{"id":"i6","t":"Food waste rotting in a landfill","_a":"G1RcAEQ=","why":"Without oxygen, buried food makes methane.","wrong":{"co2":"Without oxygen, buried food makes methane."}},{"id":"i7","t":"Manure spread on fields","_a":"G1kGW0Q=","why":"Nitrogen in manure becomes nitrous oxide in soil.","hints":["Manure contains nitrogen.","Nitrogen in soil becomes which gas?","Nitrous oxide."]},{"id":"i8","t":"Natural gas heating a greenhouse","_a":"G1RbBkQ=","why":"Burning natural gas for heat releases carbon dioxide."}]},{"id":"reason","type":"custom","title":"Footprint reasoning","summary":"Footprint reasoning","star":true,"goal":[2,4,5,6],"instruction":"Use the model values to answer each question. Items R3 to R6 are non-routine (★).","how":"Type a number or choose an answer, then press Check. Each item has three levels of help.","items":[{"id":"r1","kind":"num","n":"R1","goal":5,"prompt":"Model: tofu’s total is 3.0 and its transport is 0.2. Transport share, to the nearest whole percent?","label":"Transport share:","unit":"%","_a":"Dg==","why":"0.2 ÷ 3.0 × 100% ≈ 6.7%, which rounds to 7%.","wrong":[{"match":0.2,"fb":"Share = 0.2 ÷ 3.0 × 100%."},{"match":0.07,"fb":"Share = 0.2 ÷ 3.0 × 100%."}],"general":"Share = 0.2 ÷ 3.0 × 100%, then round to a whole percent.","hints":["Share = part ÷ total × 100%.","0.2 ÷ 3.0 = 0.067.","0.067 × 100% ≈ 6.7%, so 7%."]},{"id":"r2","kind":"num","n":"R2","goal":5,"prompt":"Model: a burrito plate has cheese (1.2), beans (0.1), a tortilla (0.1) and vegetables (0.1). Footprint?","label":"Footprint:","unit":"kg CO₂e","_a":"CBkB","why":"1.2 + 0.1 + 0.1 + 0.1 = 1.5.","wrong":[{"match":1.4,"fb":"Count all four servings."}],"general":"Add all four servings.","hints":["Add every serving on the plate.","There are four servings: 1.2, 0.1, 0.1 and 0.1.","1.2 + 0.3 = 1.5."]},{"id":"r3","kind":"num","n":"R3","star":true,"goal":2,"prompt":"Model: a winter tomato from a heated local greenhouse (2.4) vs a field tomato trucked 3000 km (0.7). How many times larger is the greenhouse tomato’s footprint, to one decimal?","label":"Times larger:","unit":"times","_a":"ChkA","why":"2.4 ÷ 0.7 ≈ 3.4. For most foods, transport is a small share; how the food is produced matters most. Air freight and heated greenhouses are the exceptions.","wrong":[{"match":1.7,"fb":"That’s the difference. Divide 2.4 ÷ 0.7."}],"general":"“How many times” means divide: 2.4 ÷ 0.7, to one decimal.","hints":["“How many times” means divide.","2.4 ÷ 0.7.","About 3.4 times."]},{"id":"r4","kind":"menu","n":"R4","star":true,"goal":5,"prompt":"Two model menus. Menu X: beef chili + chana masala + Three Sisters soup. Menu Y: chicken shawarma + tofu stir-fry + chana masala. Which has the smaller total footprint, and by how much?","menus":[{"id":"X","t":"Menu X"},{"id":"Y","t":"Menu Y"}],"label":"Smaller by:","unit":"kg CO₂e","_a":"QhVZUQhCFVsbbhYYRFVOQwMPGgYb","why":"X = 11.1 and Y = 2.9, so Y is smaller by 8.2.","wrongMenu":"Add each menu: X = 10.3 + 0.5 + 0.3 = 11.1; Y = 1.5 + 0.9 + 0.5 = 2.9.","general":"Y is the smaller menu. Subtract the two totals: 11.1 − 2.9.","hints":["Add each menu’s three dishes.","X = 11.1; Y = 2.9.","Y is smaller by 8.2."]},{"id":"r5","kind":"mc","n":"R5","star":true,"inquiry":true,"goal":6,"prompt":"You want reliable evidence on food footprints. Rank from most to least reliable: (a) a peer-reviewed review combining about 38 700 farms’ data (Poore & Nemecek, 2018); (b) a beef-industry ad saying “beef is climate-friendly”; (c) a plant-milk ad saying “the greenest choice ever”; (d) a viral post with no sources.","options":[{"t":"a, then c, then b, then d","why":"Ads have a selling purpose, whatever they sell; peer-reviewed data with stated methods comes first; unsourced posts can’t be checked.","_n":"1k65d","_k":"bae798a1"},{"t":"a, then b and c (both commercial, tied), then d","why":"Ads have a selling purpose, whatever they sell; peer-reviewed data with stated methods comes first; unsourced posts can’t be checked.","_n":"1l68d","_k":"12dc136c"},{"t":"b, then a, then c, then d","why":"Ads have a selling purpose, whatever they sell; peer-reviewed data with stated methods comes first; unsourced posts can’t be checked.","_n":"1m67d","_k":"7b943efd"},{"t":"d, then a, then b and c (tied)","why":"Ads have a selling purpose, whatever they sell; peer-reviewed data with stated methods comes first; unsourced posts can’t be checked.","_n":"1neec","_k":"6ca3afc4"}],"hints":["Who made each source, and why?","Both ads are selling something; a post with no sources can’t be checked.","Peer-reviewed data first, the two ads tied, the unsourced post last."]},{"id":"r6","kind":"mc","n":"R6","star":true,"goal":4,"prompt":"A province offers payments for 4R fertilizer stewardship and cover crops (model policy). Predict its effects on emissions, yields and farm resilience.","options":[{"t":"No effect on emissions, yields or resilience","why":"Both actions cut emissions in the model.","_n":"1oefc","_k":"0a00164e"},{"t":"Emissions rise, because cover crops need more fertilizer","why":"Both actions cut emissions in the model.","_n":"1pf0c","_k":"a7ecccfa"},{"t":"Emissions fall, but yields collapse","why":"4R means using the right amount, not none; cover crops protect soil.","_n":"1qf1c","_k":"98b0d096"},{"t":"Emissions fall (less nitrous oxide); yields stay about the same; resilience rises with cover crops","why":"4R cuts nitrous oxide without cutting the fertilizer a crop needs, and cover crops protect soil and hold moisture.","_n":"1rf2c","_k":"21f8786d"}],"hints":["What does each action do in the Farm plan model?","4R: −10%, resilience 0. Cover crops with no-till: −10%, resilience +2.","Emissions fall, yields stay about the same, and resilience rises."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Wanjiru","goal":[2,3,5],"how":"","instruction":"Wanjiru made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Which tomato has the lower footprint in the model?","steps":["“The greenhouse tomato is grown nearby, so its transport is only 0.1.”","“The trucked tomato travels 3000 km, so its transport is 0.3.”","“Less transport means a lower footprint, so the greenhouse tomato is lower.”","“Local food is always better for the climate.”"],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Totals decide it, not one stage.","_n":"1sf3c","_k":"b0bafb36"},{"t":"“Transport is the only stage that matters.”","why":"Production (heating) is a bigger stage here.","_n":"1tf4c","_k":"ae23894a"},{"t":"“Compare totals: heating gives the greenhouse tomato 2.4 vs the field tomato’s 0.7, so the field tomato is lower here.”","why":"For most foods, transport is a small share; how the food is produced matters most. Air freight and heated greenhouses are the exceptions.","_n":"1uf5c","_k":"85090a11"},{"t":"“They’re equal because both are tomatoes.”","why":"Their totals differ: 2.4 vs 0.7.","_n":"1ve6c","_k":"5f39485b"}],"hints":["Which stage is biggest for the greenhouse tomato?","The farm stage: heating, 2.0.","Compare totals: 2.4 vs 0.7."]},{"id":"e2","goal":3,"task":"Is the Prairies’ climate getting drier?","steps":["“Climate means the average weather pattern over about 30 years.”","“Last summer was cool and wet on my uncle’s farm.”","“So the Prairies’ climate isn’t getting drier.”","“Farmers don’t need to plan for drought.”"],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 states a fact.","","Step 4 follows step 3."],"fixes":[{"t":"“Climate and weather mean the same thing.”","why":"One hot summer is weather. Climate is the average pattern over about 30 years.","_n":"1we7c","_k":"dd7a55af"},{"t":"Step 3 is correct.","why":"Step 3 uses one summer to judge a 30-year pattern.","_n":"1xf4c","_k":"ccf5d58e"},{"t":"“Wet summers prove the climate is getting wetter.”","why":"One summer can’t show a trend either way.","_n":"1yf3c","_k":"671fedb8"},{"t":"“One summer is weather. To judge climate, compare decades of averages and projections, which show rising drought risk.”","why":"One hot summer is weather. Climate is the average pattern over about 30 years.","_n":"1zf2c","_k":"9c1853e5"}],"hints":["How long is “climate”?","About 30 years of averages.","One summer is weather."]},{"id":"e3","goal":5,"task":"Footprint of a 100 g beef serving (model: 100.0 kg CO₂e per kg).","steps":["“The model value is 100.0 kg CO₂e per kilogram of beef.”","“100 g is 0.1 kg.”","“So the serving’s footprint is 100.0 × 100 = 10 000 kg CO₂e.”","“That’s more than a car emits in a year.”"],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"“Multiply by the mass in kilograms: 100.0 × 0.1 = 10.0 kg CO₂e.”","why":"The model value is per kilogram, so use the mass in kilograms.","_n":"20f1c","_k":"b252bb41"},{"t":"“100.0 × 1 = 100.0.”","why":"That’s a whole kilogram.","_n":"21f8c","_k":"5bbeabea"},{"t":"Step 3 is correct.","why":"Grams and kilograms are mixed up.","_n":"22f7c","_k":"9594bef2"},{"t":"“Divide 100.0 by 100 = 1.0.”","why":"Dividing by 100 treats 100 g as 1/100 kg; it’s 1/10.","_n":"23f6c","_k":"5824d56e"}],"hints":["Which unit does the model value use?","Per kilogram, so convert 100 g to 0.1 kg.","10.0 kg CO₂e."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: how small transport usually is, or how much footprints differ between foods?"},{"id":"j2","q":"In your own words, what’s the difference between adaptation and mitigation? Give one farm example of each."},{"id":"j3","q":"Explain to a friend why “eat local” isn’t always the lowest-carbon choice, without making anyone feel judged about what they eat."},{"id":"j4","q":"Which climate impact on Canadian food (Prairie drought, BC floods, northern sea ice) would you most like to research? What source would you start with?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which greenhouse gas is released mainly when cattle digest grass?","options":[{"t":"carbon dioxide","why":"Methane, not CO₂, comes from cattle digestion.","_n":"24f5c","_k":"3be9fb16"},{"t":"nitrous oxide","why":"That comes mainly from fertilizer and manure in soil.","_n":"25ecc","_k":"0d5c8b84"},{"t":"oxygen","why":"Oxygen isn’t a greenhouse gas.","_n":"26ebc","_k":"787bff42"},{"t":"methane","why":"Cattle digestion releases methane.","_n":"2762c","_k":"0cca87e1"}]},"b":{"prompt":"Which greenhouse gas comes mainly from nitrogen fertilizer and manure in soils?","options":[{"t":"nitrous oxide","why":"Soil microbes release N₂O from extra nitrogen.","_n":"2863c","_k":"5fa7aa63"},{"t":"nitrogen gas","why":"N₂ isn’t a greenhouse gas.","_n":"2960c","_k":"515cb3ca"},{"t":"methane","why":"That’s from cattle, rice and landfills.","_n":"2a61c","_k":"547af22b"},{"t":"carbon dioxide","why":"CO₂ comes mainly from fuel and land clearing.","_n":"2b66c","_k":"b1b96ecb"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which is an example of \u003cstrong>adaptation\u003c/strong> rather than mitigation?","options":[{"t":"a feed additive that reduces cattle methane","why":"That’s mitigation.","_n":"2c67c","_k":"20499d67"},{"t":"using 4R fertilizer stewardship","why":"That cuts nitrous oxide: mitigation.","_n":"2d64c","_k":"040ec30f"},{"t":"putting solar panels on barns","why":"That cuts emissions: mitigation.","_n":"2e65c","_k":"089a1e5b"},{"t":"planting drought-tolerant crop varieties","why":"It helps farms cope with drought.","_n":"2f6ac","_k":"734ad157"}]},"b":{"prompt":"Which is an example of \u003cstrong>mitigation\u003c/strong>?","options":[{"t":"building flood barriers around farmland","why":"That’s adaptation.","_n":"2g6bc","_k":"e286576e"},{"t":"buying crop insurance","why":"That’s adaptation.","_n":"2h68c","_k":"4001a457"},{"t":"planting drought-tolerant varieties","why":"That’s adaptation.","_n":"2i67c","_k":"1176e5c1"},{"t":"sending less food waste to landfill, so less methane forms","why":"It cuts emissions.","_n":"2j6ac","_k":"ebdfd583"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which statement describes \u003cstrong>climate\u003c/strong> rather than weather?","options":[{"t":"“Last July was unusually hot in Winnipeg.”","why":"One month is weather.","_n":"2k69c","_k":"15cf02cd"},{"t":"“A storm will hit Calgary tomorrow.”","why":"A forecast is weather.","_n":"2l64c","_k":"45f6f757"},{"t":"“Over the last 30 years, average Prairie summers have become drier.”","why":"A long-term average pattern.","_n":"2m63c","_k":"961ac5be"},{"t":"“It rained 40 mm in Regina yesterday.”","why":"One day is weather.","_n":"2n66c","_k":"b0922d67"}]},"b":{"prompt":"Which statement describes \u003cstrong>weather\u003c/strong> rather than climate?","options":[{"t":"“The Arctic sea-ice season has shortened since the 1980s.”","why":"A long-term trend: climate.","_n":"2o65c","_k":"fb5d9615"},{"t":"“A hailstorm damaged canola fields near Saskatoon last week.”","why":"One event is weather.","_n":"2p70c","_k":"18b47047"},{"t":"“Growing seasons in southern Ontario have lengthened over decades.”","why":"That’s a climate trend.","_n":"2q6fc","_k":"244b7318"},{"t":"“Average Canadian temperatures have risen since 1948.”","why":"A long-term trend: climate.","_n":"2rbb5","_k":"453c3e85"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Model: peas & lentils have a total of 0.9 with transport 0.1; beef has a total of 100.0 with transport 1.0. Which statement is correct?","options":[{"t":"Transport is a bigger \u003cem>share\u003c/em> for peas (about 11%) than for beef (1%), but beef’s total footprint is over 100 times larger","why":"Shares and totals tell different stories.","_n":"2sba5","_k":"b3309204"},{"t":"Peas have a larger footprint because their transport share is larger","why":"Their total is 0.9 vs 100.0.","_n":"2tb95","_k":"6f655dfc"},{"t":"Beef’s transport (1.0) is bigger, so transport explains beef’s high footprint","why":"1.0 of 100.0 is only 1%.","_n":"2ub85","_k":"e07d4328"},{"t":"Both have the same transport share","why":"11% vs 1%.","_n":"2vb75","_k":"a5a6d0d8"}]},"b":{"prompt":"Model: a heated local greenhouse tomato totals 2.4 (transport 0.1); a trucked field tomato totals 0.7 (transport 0.3). Which statement is correct?","options":[{"t":"The greenhouse tomato is lower because it’s local","why":"2.4 > 0.7.","_n":"2wb65","_k":"6565ee14"},{"t":"Transport decides which is lower","why":"The farm stage (heating) decides it here.","_n":"2xb55","_k":"47ede574"},{"t":"The trucked tomato has more transport but a lower total, so local isn’t automatically lower","why":"Heating outweighs trucking here.","_n":"2yb45","_k":"e28d4c1b"},{"t":"They’re equal because both are tomatoes","why":"Totals differ.","_n":"2zc35","_k":"4a775f7b"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Model values per serving: chicken 1.0, rice 0.3, vegetables 0.1. A plate has chicken, rice and \u003cstrong>two\u003c/strong> servings of vegetables. What’s its footprint?","options":[{"t":"1.3","why":"That leaves out the vegetables.","_n":"30c25","_k":"c5e75333"},{"t":"1.4","why":"That counts only one vegetable serving.","_n":"31355","_k":"9a9b17c9"},{"t":"1.5","why":"1.0 + 0.3 + 0.1 + 0.1 = 1.5.","_n":"32365","_k":"69fb8b62"},{"t":"2.4","why":"Check the addition: 1.0 + 0.3 + 0.2.","_n":"33375","_k":"b0e241ed"}]},"b":{"prompt":"Model values per serving: beef 10.0, bread 0.1, cheese 1.2, vegetables 0.1. A burger has beef, a bun (bread), cheese and one serving of vegetables. Its footprint?","options":[{"t":"1.14","why":"Check the decimal: 10.0 + 1.4 = 11.4.","_n":"34385","_k":"424dbfd9"},{"t":"10.0","why":"That’s the beef alone.","_n":"35315","_k":"d419c011"},{"t":"11.3","why":"Count all four items.","_n":"36325","_k":"8e006d35"},{"t":"11.4","why":"10.0 + 0.1 + 1.2 + 0.1 = 11.4.","_n":"37335","_k":"d2e7209a"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"In the model, the Fraser Valley at +3 °C shows High drought \u003cstrong>and\u003c/strong> High flood risk. What does this suggest for farms there?","options":[{"t":"Only flood planning matters","why":"Drought risk is High too.","_n":"38345","_k":"c2cab8a1"},{"t":"A warmer climate only brings a longer, better season","why":"Risks rise alongside the longer season.","_n":"393d5","_k":"a94547ac"},{"t":"Farms need plans for both extremes, such as water storage for dry spells and drainage for floods","why":"More extremes in both directions.","_n":"3a3e5","_k":"ed71d7b6"},{"t":"Floods and droughts cancel out, so nothing changes","why":"They happen at different times; both do damage.","_n":"3bc75","_k":"049b9f90"}]},"b":{"prompt":"In the model, Nunavut’s sea-ice season gets much shorter at +3 °C. What is the most direct effect on food?","options":[{"t":"No effect, because stores sell food","why":"Store food arrives by ship and air, and costs rise.","_n":"3cc65","_k":"423ab848"},{"t":"Harder, riskier hunting and travel for country foods, plus shipping disruptions that raise store-food costs","why":"Both access routes are affected.","_n":"3dc95","_k":"4ce52597"},{"t":"Only acceptability changes","why":"Access and cost change most.","_n":"3ec85","_k":"c7375c34"},{"t":"More wheat can be grown, so food security improves","why":"Soils and growing conditions remain very limited.","_n":"3fc35","_k":"41e306b0"}]}},{"id":"c1","cat":"C","goal":[2,6],"a":{"prompt":"Which sentence best describes footprint data \u003cstrong>without judging people\u003c/strong>?","options":[{"t":"“Lentils have zero emissions.”","why":"Low, not zero.","_n":"3gc25","_k":"e11a1e28"},{"t":"“People who eat beef are harming the planet.”","why":"Footprints describe foods, not people.","_n":"3hc55","_k":"a9889fcc"},{"t":"“Footprint data proves local food is always best.”","why":"Production matters more than distance.","_n":"3ic45","_k":"8feb3b3c"},{"t":"“In life-cycle studies, a serving of beef has a much larger footprint than a serving of lentils; what people eat also depends on culture, cost, access and health.”","why":"It states the data about foods and names what shapes people’s choices.","_n":"3jbf5","_k":"667b8d91"}]},"b":{"prompt":"Which caption best explains the Chain view bar for beef?","options":[{"t":"“Beef has a footprint because it’s stored in fridges.”","why":"Retail is 1 of 100.","_n":"3kbe5","_k":"f57df2a4"},{"t":"“Beef’s footprint is mainly from long-distance shipping.”","why":"Transport is 1 of 100.","_n":"3lc15","_k":"3e339ef4"},{"t":"“Beef’s footprint is mostly packaging.”","why":"Packaging is 1 of 100.","_n":"3mc25","_k":"2602ca6a"},{"t":"“Most of beef’s fo ing both conditions?","options":[{"t":"Chana masala with rice (0.5 kg, $2, 15 g)","why":"Biggest cut, but protein drops to 15 g.","_n":"3wc24","_k":"e95bbbe3"},{"t":"Bean and cheese burrito (1.5 kg, $3, 22 g)","why":"Protein drops to 22 g.","_n":"3xc14","_k":"5237f6d3"},{"t":"Salmon with potatoes (1.5 kg, $5, 25 g)","why":"Costs more and has less protein.","_n":"3yc04","_k":"e3a9b783"},{"t":"Chicken shawarma bowl (1.5 kg, $4, 30 g): cuts 8.8 kg","why":"Same protein and cost.","_n":"3zc74","_k":"eaa248a0"}]},"b":{"prompt":"A cafeteria wants to replace \u003cstrong>salmon with potatoes\u003c/strong> (1.5 kg, $5, 25 g) with a dish that has at least 20 g protein, costs less and has a smaller footprint. Which works?","options":[{"t":"Tofu and vegetable stir-fry (0.9 kg, $3, 20 g)","why":"Meets all three conditions.","_n":"40c64","_k":"e41ad432"},{"t":"Pork tourtière (1.5 kg, $3, 20 g)","why":"Cheaper, but the footprint isn’t smaller.","_n":"41c54","_k":"b1195a17"},{"t":"Chana masala with rice (0.5 kg, $2, 15 g)","why":"Protein is below 20 g.","_n":"42c44","_k":"801e44d9"},{"t":"Bean and cheese burrito (1.5 kg, $3, 22 g)","why":"Same footprint.","_n":"43bb4","_k":"18d0dd35"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A Prairie farm faces more droughts. Which single action helps it \u003cstrong>adapt and also cuts emissions\u003c/strong> (Farm plan model)?","options":[{"t":"A methane feed additive (−15%, 0)","why":"Cuts emissions but doesn’t build drought resilience.","_n":"44ba4","_k":"a5803c6d"},{"t":"A new irrigation reservoir (+5%, +3)","why":"Adapts, but pumping adds emissions.","_n":"45bd4","_k":"dcfa3475"},{"t":"Crop insurance (0%, +1)","why":"Financial adaptation only.","_n":"46be4","_k":"407f10a3"},{"t":"Cover crops with no-till (−10%, +2 resilience)","why":"Holds soil moisture and stores carbon.","_n":"47bf4","_k":"cccfca02"}]},"b":{"prompt":"Which action \u003cstrong>cuts emissions but adds no drought resilience\u003c/strong> (Farm plan model)?","options":[{"t":"Drought-tolerant varieties (0%, +2)","why":"Adaptation only.","_n":"48c04","_k":"8fa96c6b"},{"t":"Cover crops with no-till (−10%, +2)","why":"That does both.","_n":"49c14","_k":"9457fdbb"},{"t":"A feed additive that reduces cattle methane (−15%, 0)","why":"Mitigation only.","_n":"4ac24","_k":"b9ca4703"},{"t":"Rotational grazing (−5%, +1)","why":"That does a little of both.","_n":"4bc34","_k":"cecfc0e6"}]}}]},"task":{"title":"Three-day cafeteria menu","summary":"Three-day cafeteria menu","statement":"\u003cp>Plan the main dish for three days in a school cafeteria. Choose exactly three different dishes that meet every condition. Can you find all the answers?\u003c/p>\u003cp class=\"tiny muted\">Tap dish chips to put them on the tray. The tray shows the totals for footprint, cost and protein (model data).\u003c/p>","checks":["Total footprint 3.0 kg CO₂e or less","Total cost $10 or less","Total protein 60 g or more","At least one animal-protein dish and at least one plant-protein dish","Exactly three different dishes"],"tips":["Beef chili alone is 10.3, so it can’t fit under 3.0.","Cheaper dishes free up budget: chana masala and Three Sisters soup cost $2.","Protein adds up fast with shawarma (30 g) or salmon (25 g).","Mix: at least one dish from each protein group.","Three dishes only."],"explainPrompt":"Explain how you balanced footprint, cost and protein, and how your menu respects different food traditions.","vocab":"Use the words footprint, trade-off, protein and life-cycle.","success":"This menu meets every condition.","more":"There are three answers. Can you find them all?","after3":"Each answer pairs a protein-rich animal dish with two lower-footprint plant dishes. A menu can lower its footprint while still including animal foods and several food traditions.","validMsg":"Put at least one dish on the tray."},"cards":[["Food systems’ share of emissions","About a third of human-caused greenhouse gases (Crippa et al., 2021)."],["Methane (CH₄)","From cattle digestion, flooded rice and food rotting in landfills; traps heat strongly."],["Nitrous oxide (N₂O)","From nitrogen fertilizer and manure in soil; very powerful per kilogram."],["Carbon dioxide (CO₂)","From burning fuel and clearing land (e.g. diesel tractors, forest clearing)."],["Life-cycle assessment","Counting emissions at every stage: land, farm, feed, processing, transport, retail, packaging."],["kg CO₂e","All greenhouse gases converted to the warming effect of carbon dioxide."],["Transport share","Usually small (beef: about 1% in the model); air freight is the exception."],["Adaptation","Coping with impacts: drought-tolerant crops, water storage, drainage, insurance."],["Mitigation","Cutting emissions: 4R fertilizer use, methane reduction, less food waste."],["4R nutrient stewardship","Right source, right rate, right time, right place for fertilizer."],["Weather vs climate","Weather: one day or season. Climate: the average pattern over about 30 years."],["Country foods and sea ice","A shorter sea-ice season makes hunting and travel harder and raises northern food costs."]]}};</script>
