.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 24: hero (Ruvara map), Aid designer (situation chips, aid toggles, arrival lanes, scene card, readout, compare and
   model table), Evaluate a response (case timeline, decision labels, rubric, price graph), Reading progress on SDG 2,
   Two places, one plan. Aid kinds each carry a token colour AND their letter-number code and icon (never colour alone):
   A1 brown --p-b, A2 teal --p-d, A3 blue --pen, A4 violet --acol, A5 magenta --p-c, A6 cerulean --p-t, A7 olive --leaf.
   "Hurts" is an orange tag (--p-k) that always shows the word; market icons have --ink outlines. Red and green appear only
   in feedback marks. */

/* radio groups (from HFA4U 19) */
.fai-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.fai-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.6rem}
.fai-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.fai-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fai-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%;color:var(--ink)}
.fai-chipset button:hover:not(:disabled){border-color:var(--pen)}
.fai-chipset button[aria-checked="true"],.fai-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fai-chipset button:disabled{opacity:.55}
.fai-h4{margin:0 0 6px;font-size:1rem}
.fai-h5{margin:10px 0 6px;font-size:.95rem}
.fai-lit{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi);border-radius:4px}

/* aid colours and icons */
.fai-ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fai-ic.cA1{color:var(--p-b)} .fai-ic.cA2{color:var(--p-d)} .fai-ic.cA3{color:var(--pen)} .fai-ic.cA4{color:var(--acol)}
.fai-ic.cA5{color:var(--p-c)} .fai-ic.cA6{color:var(--p-t)} .fai-ic.cA7{color:var(--leaf)}
.fai-lb.cA1{background:var(--p-b)} .fai-lb.cA2{background:var(--p-d)} .fai-lb.cA3{background:var(--pen)} .fai-lb.cA4{background:var(--acol)}
.fai-lb.cA5{background:var(--p-c)} .fai-lb.cA6{background:var(--p-t)} .fai-lb.cA7{background:var(--leaf)}

/* market effect tags (word always shown) */
.fai-mk{display:inline-block;font-size:.82rem;font-weight:700;border-radius:999px;padding:0 .6em;border:1.5px solid var(--ink-2);color:var(--ink);background:var(--sheet);white-space:nowrap}
.fai-mk.hurts{border-color:var(--p-k);background:var(--nu-carb-soft)}
.fai-mk.helps{border-color:var(--p-d)}
.fai-warn{display:block;font-size:.9rem}

/* hero */
.fai-hero{width:100%}
.fai-hsvg{display:block;width:100%;height:auto}
.fai-hsea{fill:var(--info-bg)}
.fai-hwave{fill:none;stroke:var(--pen);stroke-width:1.5;stroke-linecap:round}
.fai-hroad{stroke:var(--ink-2);stroke-width:5;stroke-linecap:round}
.fai-hbreak{fill:none;stroke:var(--p-k);stroke-width:3;stroke-linecap:round}
.fai-hroute{stroke:var(--p-b);stroke-width:2;stroke-dasharray:3 6;opacity:.7}
.fai-hcash{stroke:var(--pen);stroke-width:2.5;stroke-dasharray:7 5}
.fai-htruck{stroke:var(--p-d);stroke-width:2.5;stroke-dasharray:7 5}
.fai-hahc{fill:var(--pen)} .fai-haht{fill:var(--p-d)}
.fai-hico{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fai-hico.ship{stroke:var(--p-b)} .fai-hico.cash{stroke:var(--pen)} .fai-hico.truck{stroke:var(--p-d)}
.fai-hl{font:700 14px var(--font-ui);fill:var(--ink)}
.fai-hs{font:400 12.5px var(--font-ui);fill:var(--ink)}
.fai-hon{paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.fai-hcap{font:700 16px var(--font-ui);fill:var(--ink)}
.fai-sroof{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.fai-sline{fill:none;stroke:var(--ink);stroke-width:1}
.fai-sbody{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.fai-sack{fill:var(--plate-grain-soft);stroke:var(--ink);stroke-width:1.3}
.fai-meal{fill:var(--nu-carb-soft);stroke:var(--ink);stroke-width:1.3}
.fai-steam{fill:none;stroke:var(--ink-2);stroke-width:1.1;stroke-linecap:round}

/* explorer layout */
.fai-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.fai-top .fai-rgw{margin:0}
.fai-lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"main side" "ctl ctl";gap:14px 24px;align-items:start;margin-top:6px}
.fai-main{grid-area:main;min-width:0}
.fai-side{grid-area:side;min-width:0;border-left:1.5px solid var(--rule);padding-left:18px}
.fai-ctl{grid-area:ctl;min-width:0;border-top:1.5px solid var(--rule);padding-top:12px}
.fai-read dd{font-size:.95rem}
.fai-read > div.fai-lit{padding-left:6px;padding-right:6px}
.fai-scene{display:flex;align-items:center;gap:10px;border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px;margin:0 0 12px;background:var(--sheet)}
.fai-scene p{margin:0;font-size:.92rem}
.fai-ssvg{flex:0 0 auto;width:132px;height:auto}
.fai-stag{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.fai-sst{font:700 11px var(--font-ui);fill:var(--ink)}
.fai-scloud{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.fai-srain{fill:none;stroke:var(--pen);stroke-width:1.6;stroke-linecap:round}
.fai-ssprout{fill:none;stroke:var(--leaf);stroke-width:1.6;stroke-linecap:round}

/* aid toggles */
.fai-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:8px}
.fai-opt{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:44px;font-size:.9rem;min-width:0}
.fai-opt:hover{border-color:var(--pen)}
.fai-opt[aria-pressed="true"]{border:2px solid var(--ink);background:var(--hi-soft)}
.fai-ot{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.fai-ot small{font-size:.78rem;color:var(--ink-2);line-height:1.3}
.fai-on{flex:0 0 auto;font-weight:700;min-width:1rem}
.fai-msg{min-height:1.2em;margin:8px 0 0}
#fai-fb:empty{display:none}
#fai-fb{margin-top:8px}
.fai-iss{margin:4px 0 0;padding-left:20px}
.fai-note{margin-top:12px}

/* arrival lanes */
.fai-tlw{min-width:0}
.fai-lanes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fai-lane{display:grid;grid-template-columns:minmax(0,1fr);gap:2px}
.fai-ll{display:flex;align-items:center;gap:6px;font-size:.9rem}
.fai-lw{color:var(--ink-2);font-size:.85rem}
.fai-lt{position:relative;display:block;height:14px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);overflow:hidden}
.fai-lb{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.fai-ls{font-size:.85rem}
.fai-axis{position:relative;height:16px;margin:4px 0 0;font-size:.75rem;color:var(--ink-2)}
.fai-axis span{position:absolute;transform:translateX(-50%)}
.fai-axis span:first-child{transform:none}
.fai-axis span:last-child{transform:translateX(-100%)}
.fai-axl{margin:0}
.fai-arr{margin:8px 0 0}
.fai-empty{margin:4px 0}
.fai-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* P2 spending bar */
.fai-spend{margin-top:14px;padding:4px}
.fai-sbar{display:flex;height:22px;border:1px solid var(--ink-2);border-radius:4px;overflow:hidden}
.fai-sbar i,.fai-sk{display:block;background:var(--plate-grain-soft)}
.fai-sbar i.s0,.fai-sk.s0{background:var(--plate-grain-soft)}
.fai-sbar i.s1,.fai-sk.s1{background:repeating-linear-gradient(45deg,var(--ink-2) 0 2px,transparent 2px 7px)}
.fai-sbar i.s2,.fai-sk.s2{background:var(--ink-2)}
.fai-sbar i + i{border-left:1px solid var(--ink)}
.fai-slist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem}
.fai-sk{display:inline-block;width:16px;height:11px;border:1px solid var(--ink-2);border-radius:2px;margin-right:5px;vertical-align:-1px}

/* model table and compare readout */
.fai-mtab,.fai-rtab{border-collapse:collapse;width:100%;font-size:.88rem}
.fai-mtab th,.fai-mtab td,.fai-rtab th,.fai-rtab td{border-bottom:1px solid var(--rule);padding:6px 7px;text-align:left;vertical-align:top}
.fai-mtab thead th,.fai-rtab thead th{font-size:.8rem;color:var(--ink-2)}
.fai-mtab tr.fai-inp > *{background:var(--hi-soft)}
.fai-why{min-width:12rem}
.fai-rtab tr.fai-diff > *{background:var(--hi-soft)}
.fai-dm{font-weight:700}

/* Part 3 */
.fai-case{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;margin:0 0 12px;background:var(--sheet)}
.fai-ctag{margin:0 0 4px}
.fai-tline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:8px}
.fai-tc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;align-items:start;border-left:3px solid var(--ink-2);padding:2px 0 2px 8px}
.fai-tn{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--ink);font-weight:700;font-size:.85rem;grid-row:span 2}
.fai-tw{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.fai-tt{font-size:.92rem}
.fai-stok{font-weight:700}
.fai-station{margin-top:8px}
.fai-decs,.fai-rub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fai-dec,.fai-crit{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;min-width:0}
.fai-dec.right,.fai-crit.right{border-color:var(--green)}
.fai-dec.wrong,.fai-crit.wrong{border-color:var(--red)}
.fai-dec .fai-rgw,.fai-crit .fai-rgw{margin:6px 0 0}
.fai-dct,.fai-crt{margin:0;display:flex;gap:8px;align-items:flex-start}
.fai-crt{display:block}
.fai-dmk{font-weight:700}
.fai-dec.right .fai-dmk,.fai-crit.right .fai-dmk{color:var(--green)}
.fai-dec.wrong .fai-dmk,.fai-crit.wrong .fai-dmk{color:var(--red)}
.fai-dfb{margin:6px 0 0}
.fai-dfb:empty{display:none}
.fai-evl{display:block;font-size:.85rem;font-weight:700;color:var(--ink-2);margin:8px 0 3px}
.fai-sel{width:100%;max-width:100%;min-height:40px;font:inherit;font-size:.9rem;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:4px 6px}
.fai-pgw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px 20px;align-items:start}
.fai-psvg{display:block;width:100%;max-width:440px;height:auto}
.fai-pgrid{stroke:var(--plot-grid);stroke-width:1}
.fai-pax{font:400 11px var(--font-ui);fill:var(--ink-2)}
.fai-pnorm{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 4}
.fai-pnl{font:700 11px var(--font-ui);fill:var(--ink)}
.fai-pline{fill:none;stroke:var(--p-b);stroke-width:2.5;stroke-linejoin:round}
.fai-ppt{fill:var(--sheet);stroke:var(--p-b);stroke-width:2}
.fai-ppt.low{fill:var(--nu-carb-soft);stroke:var(--p-k);stroke-width:2.5}
.fai-pv{font:700 12px var(--font-ui);fill:var(--ink)}
.fai-pask{margin:12px 0 6px}
#fai-pfb{margin-top:8px}

/* Practice 2 */
.fai-dtab{margin:0 0 10px}
.fai-dtt{margin:0 0 4px}
.fai-unit{margin-left:6px;font-size:.92rem}

/* task */
.fai-sit{margin:8px 0;padding:6px 12px;border-left:3px solid var(--ink-2);background:var(--sheet)}
.fai-sit p{margin:0}
.fai-tlist{margin:4px 0 8px;padding-left:20px;font-size:.92rem}
.fai-tin .fai-rgw{flex-direction:column;align-items:flex-start}
.fai-ttgw p{margin:4px 0 0}
.fai-just{min-height:200px}
.fai-tcard{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.fai-models{margin-top:12px}
.fai-mtext{font-size:.92rem;border-left:3px solid var(--rule);padding-left:10px;max-width:none}

@media (max-width:820px){
  .fai-lab{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side" "ctl"}
  .fai-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .fai-pgw{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .fai-opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fai-opt{flex-direction:column;align-items:flex-start;gap:4px;padding:6px 8px}
  .fai-ot small{display:none}
  .fai-cmp,.fai-decs,.fai-rub{grid-template-columns:minmax(0,1fr)}
  .fai-rgl{min-width:0;width:100%}
  .fai-scene{flex-direction:column;align-items:flex-start}
  .fai-mtab thead{display:none}
  .fai-mtab caption{display:block;width:auto}
  .fai-mtab,.fai-mtab tbody,.fai-mtab tr,.fai-mtab th,.fai-mtab td{display:block;width:auto}
  .fai-mtab tr{border:1.5px solid var(--rule);border-radius:8px;margin:0 0 10px;padding:4px 0}
  .fai-mtab th,.fai-mtab td{border-bottom:0;padding:3px 10px}
  .fai-mtab td::before{content:attr(data-label);display:block;font-size:.76rem;font-weight:700;color:var(--ink-2)}
  .fai-why{min-width:0}
}

<script>window.MV_PAYLOAD={"meta":{"id":"24-food-aid-sdgs","nn":"24","slug":"food-aid-sdgs","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 5","groupName":"Global Food Issues","trivium":"","size":"M","storageKey":"hfa4u-24-food-aid-sdgs-v1","progressKey":"hfa4u-progress-v1:24-food-aid-sdgs","toolkit":"1.0.9"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"d6dfd79e","content":{"id":"24-food-aid-sdgs","kind":"topic","title":"Food aid and the Sustainable Development Goals","topic":"Food Aid & the Sustainable Development Goals","readyTopic":"food aid and the SDGs","hero":{"eq":"Same drought, different needs: \u003cstrong>what does this place need, for whom, and when?\u003c/strong>","eqSize":"sm","eqLabel":"Same drought, different needs: what does this place need, for whom, and when?","headline":"Help that fits the situation","text":"When a drought or conflict hits, people need food, but \u003cem>how\u003c/em> it arrives matters. \u003cstrong>Shipped food\u003c/strong>, \u003cstrong>locally bought food\u003c/strong>, \u003cstrong>cash\u003c/strong> and \u003cstrong>vouchers\u003c/strong> each help in different situations. Get it right and families eat sooner and local farmers keep their livelihoods. Get it wrong and help arrives late or pushes down the prices local farmers depend on. The world has a shared goal for this: \u003cstrong>SDG 2, Zero Hunger\u003c/strong>, by 2030.","fig":{"html":"\u003cdiv class=\"fai-hero\" id=\"fai-hero\">\u003c/div>","caption":""},"aria":"A map of Ruvara, a fictional region. The town’s market is full of sacks; the remote villages’ markets are empty and the road to them is broken. A slow ship labelled 16 weeks and a phone labelled cash: 1 week both head for the people. The cash reaches the town market, where the sacks become families’ meals, but stops at the villages: no food to buy. A truck labelled bought in the region reaches the villages. Different places, different help.","caption":"Different places, different help."},"goals":["I can tell apart emergency, program and project food aid, and modern forms such as cash, vouchers and local or regional purchase.","I can explain how food aid can help or harm local markets and farmers.","I can match an aid response to the situation: whether markets are working, who is most at risk, and the season.","I can describe SDG 2 (Zero Hunger) and its main targets, and judge progress claims using data.","I can evaluate a food-aid response against criteria: speed, need, market effects, dignity, nutrition and resilience.","I can describe effective ways Canadians, including students, can act on hunger."],"start":{"blocks":[{"title":"SDG 2: Zero Hunger","html":"\u003cp>\u003cstrong>SDG 2 (Zero Hunger)\u003c/strong> is one of the 17 Sustainable Development Goals adopted by UN member states in 2015 for 2030. It covers ending hunger, ending all forms of malnutrition, raising small-scale farmers’ productivity and incomes, and sustainable food systems. Reports show the world is \u003cstrong>not on track\u003c/strong>. Judging progress means reading data carefully, not trusting slogans.\u003c/p>\u003cp class=\"tiny\">\u003cstrong>Targets you’ll use in this module\u003c/strong>\u003c/p>\u003cul class=\"fai-tlist\">\u003cli>2.1 End hunger\u003c/li>\u003cli>2.2 End all forms of malnutrition\u003c/li>\u003cli>2.3 Small-scale producers’ productivity and incomes\u003c/li>\u003cli>2.4 Sustainable food production\u003c/li>\u003cli>2.5 Genetic diversity of seeds\u003c/li>\u003c/ul>\u003cp class=\"tiny muted\">Source to check for current figures: the FAO’s annual \u003cem>State of Food Security and Nutrition in the World\u003c/em> report. Every number you calculate in this module is model data.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Food security components","goal":3,"prompt":"A town’s stores have plenty of food, but after a poor harvest, prices have doubled and many families can’t afford it. Which component of food security is most affected?","options":[{"t":"Sustainability","why":"Sustainability is about supply over time; the problem now is affordability.","_n":"0d3e","_k":"98a094de"},{"t":"Acceptability","why":"Nothing suggests the food is culturally unsuitable.","_n":"1d0e","_k":"e3c5d408"},{"t":"Accessibility","why":"Food is there, but people can’t afford it: access is the problem.","_n":"2d1e","_k":"47a819f9"},{"t":"Availability","why":"The stores are full, so food is available.","_n":"3cee","_k":"3fa9387e"}],"hints":["Is there food in the stores?","Yes, so what’s stopping families?","Price, which is access."]},{"id":"w2","skill":"Food security components","goal":3,"prompt":"Floods cut the only road to a group of villages. Their small shops have run out of food. Which component is missing?","options":[{"t":"Availability","why":"There’s no food in the local market at all.","_n":"4cfe","_k":"c79c5509"},{"t":"Adequacy","why":"Adequacy is about whether food meets nutritional needs; here there’s none.","_n":"5cce","_k":"0b8847fa"},{"t":"Accessibility only","why":"Even with money, there’s nothing to buy.","_n":"6cde","_k":"4e04236a"},{"t":"Acceptability","why":"Not a cultural issue.","_n":"7cae","_k":"6801cc5e"}],"hints":["Could money buy food there today?","No, the shops are empty.","Availability."]},{"id":"w3","skill":"Forms of malnutrition","goal":4,"prompt":"A five-year-old is much shorter than expected for their age after years of poor nutrition. This is called…","options":[{"t":"Stunting","why":"Low height for age, from long-term undernutrition (module 21).","_n":"8cbe","_k":"a4fd4cf9"},{"t":"Hidden hunger","why":"That means missing vitamins or minerals; it can come with stunting but isn’t the same thing.","_n":"9cc9","_k":"ba31a9aa"},{"t":"Wasting","why":"Wasting is low weight for height: it’s acute, recent and urgent.","_n":"acb9","_k":"8f953b3f"},{"t":"Overweight","why":"The opposite end of the double burden.","_n":"bce9","_k":"b07e6ac7"}],"hints":["Height or weight?","Height for age.","Stunting."]},{"id":"w4","skill":"Forms of malnutrition","goal":4,"prompt":"A family eats enough calories, but their diet lacks iron and vitamin A. This is called…","options":[{"t":"Food sovereignty","why":"Food sovereignty is about control over food systems.","_n":"ccd9","_k":"ee11e29f"},{"t":"Hidden hunger (micronutrient deficiency)","why":"Enough energy, not enough vitamins and minerals.","_n":"dc89","_k":"520a066b"},{"t":"Stunting","why":"Stunting is a growth result, not the deficiency itself.","_n":"ec79","_k":"d466805a"},{"t":"Wasting","why":"Wasting is a severe lack of energy and protein.","_n":"fca9","_k":"e57c8fa7"}],"hints":["Calories are fine; what’s missing?","Micronutrients.","Hidden hunger."]},{"id":"w5","skill":"Markets and prices","goal":2,"prompt":"At harvest time, a large shipment of free grain is handed out in a market where local farmers are also selling grain. What usually happens to the price local farmers can get?","options":[{"t":"It stays the same","why":"Supply and demand both shift.","_n":"gc99","_k":"0ecaa20a"},{"t":"It rises","why":"Free grain reduces how much people need to buy.","_n":"hc49","_k":"288ac250"},{"t":"It can’t change, because aid is separate from markets","why":"Free food changes what people buy.","_n":"ic39","_k":"d460da0a"},{"t":"It falls","why":"More grain and less demand to buy it push prices down.","_n":"j3a9","_k":"b8213ab8"}],"hints":["Do people still need to buy as much grain?","No: demand falls while supply rises.","Prices fall."]},{"id":"w6","skill":"The SDGs","goal":4,"prompt":"The Sustainable Development Goals were adopted by UN member states in 2015. Which year are most of their targets set for?","options":[{"t":"2015","why":"That’s when they were adopted.","_n":"k3b9","_k":"b5b484ad"},{"t":"2025","why":"Some nutrition sub-targets mention 2025, but the goals as a whole aim for 2030.","_n":"l3c9","_k":"3096b6cb"},{"t":"2030","why":"The 2030 Agenda.","_n":"m3d9","_k":"029008b6"},{"t":"2050","why":"That’s a common climate-target year, not the SDGs’.","_n":"n369","_k":"bba0c378"}],"hints":["They’re often called the ‘20__ Agenda’.","Fifteen years after 2015.","2030."]}],"refreshers":{"Food security components":"Availability (is food there?), accessibility (can people get and afford it?), adequacy (does it meet nutritional needs?), acceptability (is it culturally and personally appropriate?), sustainability (will it last?). See module 19.","Forms of malnutrition":"Stunting is low height for age (long-term); wasting is low weight for height (acute); hidden hunger is missing micronutrients; the double burden is undernutrition and overweight in the same community. See module 21.","Markets and prices":"More supply, or less demand, lowers prices; less supply, or more demand, raises them.","The SDGs":"17 goals adopted in 2015 for 2030. SDG 2 is Zero Hunger."}}},"explore":{"heading":"Aid designer","intro":"Ruvara (a fictional region) faces a drought. Choose up to three kinds of aid for the season you’re in and see how fast they reach people, what they do to local markets, and what they leave behind.","modelTag":"Teaching model","modelNote":"These ratings are a teaching model built on widely reported findings about food aid. They are not measurements.","modelFindings":["cash is fast where markets work;","food must be brought in where markets have failed;","shipped food is slow and can depress local prices;","specialized nutrition protects young children;","resilience projects pay off over time."],"modes":[{"id":"design","t":"Design"},{"id":"compare","t":"Compare"},{"id":"model","t":"See the model"}],"sits":[{"id":"S1","t":"Dry season, markets open"},{"id":"S2","t":"Roads cut, markets empty"},{"id":"S3","t":"Rains return (recovery)"}],"scenes":{"S1":"The town market is full, but prices are high.","S2":"Floods cut the roads; the shops have nothing to sell.","S3":"The rains are back and the harvest is coming."},"options":[{"id":"A1","t":"Imported food shipment","sub":"in-kind, from abroad","short":"Imported food","icon":"ship","S1":{"w":16,"mk":"hurts","mkT":"Hurts (lowers prices)","reach":"partly","reachT":"Partly (late)","nut":"some","res":"low","why":"Shipped food takes about 16 weeks, and free grain in a working market lowers what local farmers and shops can charge.","warn":"shipped food may lower local prices"},"S2":{"w":16,"mk":"neutral","mkT":"Neutral (no market to undercut)","reach":"partly","reachT":"Partly (late)","nut":"some","res":"low","why":"With markets empty, food must be brought in, but shipping it from abroad is slow. There’s no local market to undercut."},"S3":{"w":16,"mk":"hurts","mkT":"Hurts (arrives at harvest)","reach":"partly","reachT":"Partly","nut":"some","res":"low","why":"Shipped grain lands at harvest time and pushes down the prices farmers get for their own crop.","warn":"shipped food arrives at harvest and may lower farmers’ prices"}},{"id":"A2","t":"Food bought in the region","sub":"local or regional purchase","short":"Regional purchase","icon":"truck","S1":{"w":4,"mk":"helps","mkT":"Helps","reach":"yes","reachT":"Yes","nut":"some","res":"low","why":"Buying in the region takes about 4 weeks and puts money in nearby farmers’ pockets."},"S2":{"w":6,"mk":"neutral","mkT":"Neutral","reach":"yes","reachT":"Yes","nut":"some","res":"low","why":"Food bought in the region is trucked in around the cut road in about 6 weeks: it brings food where there is none."},"S3":{"w":4,"mk":"helps","mkT":"Helps","reach":"yes","reachT":"Yes","nut":"some","res":"low","why":"Buying from nearby farmers at harvest supports the prices they earn."}},{"id":"A3","t":"Cash transfers","sub":"by mobile phone","short":"Cash","icon":"phone","S1":{"w":1,"mk":"helps","mkT":"Helps","reach":"yes","reachT":"Yes","nut":"some","res":"low","why":"Where markets work, cash moves in days and families buy what they need locally."},"S2":{"w":1,"mk":"hurts","mkT":"Hurts (prices rise; nothing to buy)","reach":"no","reachT":"No","nut":"little","res":"low","why":"With nothing to buy, extra money mostly drives prices up.","warn":"cash with nothing to buy pushes prices up"},"S3":{"w":1,"mk":"helps","mkT":"Helps","reach":"yes","reachT":"Yes","nut":"some","res":"medium","why":"Cash spent in reopened markets supports traders, and families can put some toward replanting."}},{"id":"A4","t":"Food vouchers","sub":"spent at local shops","short":"Vouchers","icon":"voucher","S1":{"w":2,"mk":"helps","mkT":"Helps","reach":"yes","reachT":"Yes","nut":"some","res":"low","why":"Vouchers take about 2 weeks to set up and are spent on food at local shops."},"S2":{"w":2,"mk":"hurts","mkT":"Hurts (prices rise; nothing to buy)","reach":"no","reachT":"No","nut":"little","res":"low","why":"Vouchers can’t buy food the shops don’t have, so they mostly push prices up.","warn":"vouchers with nothing to buy push prices up"},"S3":{"w":2,"mk":"helps","mkT":"Helps","reach":"yes","reachT":"Yes","nut":"some","res":"low","why":"Vouchers spent at local shops support traders as markets recover."}},{"id":"A5","t":"Specialized nutrition","sub":"fortified foods, plus therapeutic food for children with severe wasting; for children under 5 and pregnant or breastfeeding people","short":"Specialized nutrition","icon":"bowl","S1":{"w":3,"mk":"neutral","mkT":"Neutral","reach":"partly","reachT":"Partly (targeted groups)","nut":"strong","res":"low","why":"Fortified and therapeutic foods target young children and pregnant or breastfeeding people, so they reach only those groups."},"S2":{"w":3,"mk":"neutral","mkT":"Neutral","reach":"partly","reachT":"Partly (targeted groups)","nut":"strong","res":"low","why":"Fortified and therapeutic foods target young children and pregnant or breastfeeding people, so they reach only those groups."},"S3":{"w":3,"mk":"neutral","mkT":"Neutral","reach":"partly","reachT":"Partly (targeted groups)","nut":"strong","res":"low","why":"Fortified and therapeutic foods target young children and pregnant or breastfeeding people, so they reach only those groups."}},{"id":"A6","t":"Food-for-assets","sub":"people are paid in food or cash to build water catchments","short":"Food-for-assets","icon":"water","S1":{"w":6,"mk":"neutral","mkT":"Neutral","reach":"partly","reachT":"Partly (those able to work)","nut":"some","res":"high","why":"Paying people to build water catchments feeds those able to work and leaves an asset for the next dry season."},"S2":{"w":6,"mk":"neutral","mkT":"Neutral","reach":"partly","reachT":"Partly","nut":"little","res":"medium","why":"With roads cut, work projects are hard to supply, but the catchments still help later."},"S3":{"w":6,"mk":"neutral","mkT":"Neutral","reach":"partly","reachT":"Partly (those able to work)","nut":"some","res":"high","why":"Paying people to build water catchments feeds those able to work and leaves an asset for the next dry season."}},{"id":"A7","t":"Seeds, tools and farmer training","sub":"for the next planting","short":"Seeds and tools","icon":"seed","S1":{"w":8,"mk":"helps","mkT":"Helps","reach":"no","reachT":"No (doesn’t feed people now)","nut":"little","res":"high","why":"Seeds and training don’t feed anyone today, but they help farmers grow the next harvest, and buying them locally supports traders."},"S2":{"w":8,"mk":"neutral","mkT":"Neutral","reach":"no","reachT":"No","nut":"little","res":"high","why":"Seeds don’t feed people now, and with markets empty there’s no trade to support; they still pay off next season."},"S3":{"w":8,"mk":"helps","mkT":"Helps","reach":"no","reachT":"No (doesn’t feed people now)","nut":"little","res":"high","why":"Seeds and training don’t feed anyone today, but they help farmers grow the next harvest, and buying them locally supports traders."}}],"levels":{"reach":{"yes":"Yes","partly":"Partly","no":"No"},"mk":{"helps":"Helps","neutral":"Neutral","hurts":"Hurts"},"nut":{"little":"Little","some":"Some","strong":"Strong"},"res":{"low":"Low","medium":"Medium","high":"High"}},"rows":{"fast":"Fastest arrival","reach":"Reaches the hungry now","mk":"Local farmers and shops","nut":"Young children’s nutrition","res":"Long-term resilience","dig":"Dignity and choice","warn":"Warning"},"msgs":{"replaced":"Up to three kinds of aid: {old} was replaced by {new}.","empty":"Choose at least one kind of aid, then check the package.","nofeed":"Nobody is fed now by this package.","nutWeak":"Young children’s nutrition is only {nut}. Add specialized nutrition (A5) if children are at risk.","resLow":"Nothing here builds for next season: long-term resilience is Low.","allGood":"This package feeds people now, protects young children, builds resilience and doesn’t hurt local farmers or shops.","good":"Strengths: {list}."},"spend":{"title":"How families spend the cash","tag":"Model data","parts":[{"t":"Food","v":70},{"t":"Other essentials","v":25},{"t":"Other","v":5}]},"predictions":[{"id":"p1","prompt":"Markets in Ruvara’s town are full but prices are high. Which reaches families fastest?","options":[{"t":"Cash transfers","_n":"o379","_k":"b5e3b463"},{"t":"Seeds and tools","_n":"p389","_k":"a0eba184"},{"t":"Imported food","_n":"q399","_k":"51247db4"},{"t":"Food-for-assets","_n":"r429","_k":"35ba8e31"}],"explain":"Where markets work, cash moves in days and families buy what th  the situation to S3, Rains return (recovery).","count":"Use exactly three options.","nores":"Long-term resilience isn’t High yet. Add food-for-assets (A6) or seeds and tools (A7)."},"hints":["Each condition needs a different kind of option.","Feed now (A2, A3 or A4), nutrition (A5), resilience (A6 or A7): one of each.","For example A3 + A5 + A7."]}],"blocks":[{"title":"What the designer shows","html":"\u003cp>\u003cstrong>No single kind of aid is best.\u003c/strong> The situation decides: are markets working, who is most at risk, and is this an emergency or a recovery?\u003c/p>"}]},"part3":{"slug":"evaluate","name":"Evaluate","heading":"Evaluate a response","intro":"The aid designer was about building. Now judge a response someone else made, against explicit criteria and with data, the way real evaluations work.","caseTag":"A case written for this module; based on common patterns in drought responses","caseTitle":"The 2031 drought response in Ruvara","timeline":[{"id":"c1","when":"March","t":"Rains fail in March."},{"id":"c2","when":"May","t":"In May, prices in town double and malnutrition screening finds rising wasting among young children."},{"id":"c3","when":"June","t":"In June, a donor promises imported grain."},{"id":"c4","when":"September","t":"The grain arrives in September, during the local harvest."},{"id":"c5","when":"July","t":"A cash program starts in town in July."},{"id":"c6","when":"Next spring","t":"A seeds program starts the following spring."}],"stations":[{"id":"timeline","t":"1. Read the timeline"},{"id":"rubric","t":"2. Score the response"},{"id":"data","t":"3. Check it with data"}],"verdicts":[{"id":"fit","t":"Fits the situation"},{"id":"nofit","t":"Doesn’t fit"}],"decisions":[{"id":"d3","card":"c3","_a":"RlgLAA1DGw==","reasons":[{"t":"Town markets had food: cash or food bought in the region would arrive sooner","_n":"14cf8","_k":"3ce0e845"},{"t":"Shipped food is always the safest help","_n":"15cc8","_k":"386a0bde"},{"t":"The town needed seeds markets working?","Who is most at risk, and is this emergency or recovery?","Imported food. When no nearby region has food to sell, it must be shipped in."]}]},{"id":"sdg","type":"custom","title":"Reading progress on SDG 2","summary":"Reading progress on SDG 2","star":true,"goal":[4,5],"instruction":"Use the table to answer each question. Items marked ★ are non-routine; D5 is an inquiry item.","how":"Tap an answer or type a number, then press Check. Each item has three levels of help.","tableTag":"Model data, rounded for practice; real FAO figures differ","tableCaption":"Prevalence of undernourishment (% of population)","head":["Region","2015","2019","2023"],"rows":[["Region North","8","7","7"],["Region Central","20","18","22"],["Region South","12","10","9"]],"items":[{"id":"d1","goal":4,"prompt":"Which region’s undernourishment was \u003cstrong>higher\u003c/strong> in 2023 than in 2015?","options":[{"t":"North","why":"North went from 8 to 7: down 1 point.","_n":"20c58","_k":"8532c9b4"},{"t":"South","why":"South went from 12 to 9: down 3 points.","_n":"21cc8","_k":"81ff105b"},{"t":"None of them","why":"Compare each region’s 2015 and 2023 columns: one went up.","_n":"22cb8","_k":"32c12c0d"},{"t":"Central","why":"20 → 22: up 2 points.","_n":"23ca8","_k":"2196b87c"}],"hints":["Compare the 2015 and 2023 columns, one row at a time.","North 8 → 7, South 12 → 9. What about Central?","Central: 20 → 22, up 2 points."]},{"id":"d2","goal":4,"kind":"num","prompt":"South fell from 12% to 9% over 8 years. Average fall per year?","_a":"VBhXUVE=","tol":0.05,"unit":"points a year","label":"Average fall:","display":"0.375 points a year (about 0.4)","why":"3 ÷ 8 = 0.375, not 3 per year.","wrong":[{"match":3,"fb":"3 ÷ 8, not 3 per year."},{"match":0.5,"fb":"2015 to 2023 is 8 years, not 6."}],"hints":["How many points did it fall, and over how many years?","3 points over 8 years.","3 ÷ 8 = 0.375 points a year."]},{"id":"d3","goal":[4,5],"star":true,"prompt":"A headline says ‘Hunger is falling everywhere.’ Is it supported?","options":[{"t":"Yes: two of the three regions fell","why":"‘Everywhere’ means every region, and Central rose.","_n":"24c98","_k":"1785621c"},{"t":"No: every region rose","why":"North and South fell; only Central rose.","_n":"25c08","_k":"617891cc"},{"t":"No: Central rose after 2019","why":"One region rising is enough to make ‘everywhere’ false.","_n":"26bf8","_k":"eb15a709"},{"t":"Yes: the average of the three regions fell","why":"An average can hide a region that is getting worse.","_n":"27368","_k":"95ce9cf4"}],"hints":["‘Everywhere’ is a claim about every region.","Look at Central from 2019 to 2023.","18 → 22: Central rose, so ‘everywhere’ is false."]},{"id":"d4","goal":4,"star":true,"kind":"num","prompt":"If South keeps falling at 0.375 points a year from 2023, about what will it be in 2030?","_a":"UhhXUVE=","tol":0.05,"unit":"%","label":"South in 2030:","display":"about 6.4%","why":"9 − 7 × 0.375 = 6.375.","wrong":[{"match":5.5,"fb":"That uses 0.5 points a year; South’s rate is 0.375."},{"match":2.625,"fb":"That’s how much it falls (7 × 0.375). Subtract it from 9."},{"match":6,"fb":"That uses 8 years; 2023 to 2030 is 7."}],"hints":["How many years from 2023 to 2030?","7 years × 0.375 points a year.","9 − 7 × 0.375 = 6.375, about 6.4%."]},{"id":"d5","goal":[4,5],"star":true,"inquiry":true,"prompt":"Which source would you trust most for global SDG 2 progress?","options":[{"t":"A personal blog about world hunger","why":"A blog rarely states its methods or data sources.","_n":"28378","_k":"ec56147e"},{"t":"The FAO’s annual \u003cem>State of Food Security and Nutrition in the World\u003c/em> report","why":"A UN agency report with stated methods and data, vs a blog or a fundraising ad.","_n":"29348","_k":"3148f947"},{"t":"A social media post with a striking chart","why":"You can’t check where its numbers came from.","_n":"2a358","_k":"4d8f84ad"},{"t":"A fundraising advertisement","why":"It’s written to raise money, not to report data with stated methods.","_n":"2b3a8","_k":"5d59aece"}],"hints":["Which source states its methods and data?","Think about who publishes it and why.","The FAO’s annual report: a UN agency with stated methods and data."]},{"id":"d6","goal":[4,5],"star":true,"kind":"num","prompt":"Central’s population grew from 50 million to 60 million over the period. Did the \u003cstrong>number\u003c/strong> of undernourished people rise more or less than the percentage suggests? Work out the 2023 number to decide.","_a":"VQVKVA==","tol":0.05,"unit":"million","label":"Undernourished people in Central, 2023:","display":"13.2 million","why":"More: from 10 million to 13.2 million. Percentages hide population growth: 20% of 50 M = 10 M; 22% of 60 M = 13.2 M.","wrong":[{"match":11,"fb":"That uses the 2015 population. Central grew to 60 million."},{"match":10,"fb":"That’s the 2015 number: 20% of 50 million."},{"match":2,"fb":"That’s the change in percentage points. Convert the percentage to people."}],"hints":["Convert each percentage to a number of people.","20% of 50 million, then 22% of 60 million.","10 M → 13.2 M: up 3.2 million."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Yvette","goal":[1,3,4],"how":"","instruction":"Yvette made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Ruvara’s town markets are full, but prices have doubled. Recommend aid.","steps":["“The problem is that families can’t afford food that is in the shops.”","“So the best response is to ship grain from overseas.”","“The grain will arrive in about four months.”","“Families will then have enough food.”"],"_a":"VQ==","stepFb":["Step 1 is correct: access, not availability.","","Step 3 follows step 2. The mistake is earlier.","The mistake is earlier."],"fixes":[{"t":"“Ship more grain so it arrives faster.”","why":"It still takes months and lowers local prices.","_n":"2c3b8","_k":"d39231bc"},{"t":"“Give cash or vouchers so families can buy from local shops now; this also supports local traders.”","why":"When local markets still have food, cash or vouchers reach families in days and keep money with local farmers. Shipped food can take months.","_n":"2d388","_k":"6670364a"},{"t":"“Give seeds instead.”","why":"Seeds don’t feed people now.","_n":"2e398","_k":"fb890145"},{"t":"Step 2 is correct.","why":"Markets are working; the problem is affordability.","_n":"2f3e8","_k":"2172b3e6"}],"hints":["Is there food in the shops?","Yes, so what do families need?","Money or vouchers to buy it."]},{"id":"e2","goal":4,"task":"Undernourishment fell from 12% (2017) to 9% (2023). Is the region on track to reach 0% by 2030?","steps":["“The fall is 12 − 9 = 3 percentage points.”","“That’s 3 points per year.”","“So it will reach 0% in 3 more years, by 2026.”","“So the region is ahead of schedule.”"],"_a":"VQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier.","The mistake is earlier."],"fixes":[{"t":"“It’s 3% of 12%, so 0.36 points.”","why":"Percentage points, not percent of a percent.","_n":"2g3f8","_k":"b3a2fc54"},{"t":"Step 2 is correct.","why":"2017 to 2023 is 6 years.","_n":"2hbc8","_k":"e45d729d"},{"t":"“Divide by 2030.”","why":"Divide by the number of years.","_n":"2ibb8","_k":"c9c6e201"},{"t":"“The 3 points fell over 6 years, so 0.5 points per year. At that rate, 2030 is about 5.5%: not on track.”","why":"Check the numbers: a fall from 12% to 9% over 6 years is 0.5 points a year, not 3.","_n":"2jbe8","_k":"a6b7753e"}],"hints":["Over how many years did it fall?","6 years: 3 ÷ 6.","0.5 per year → 9 − 7 × 0.5 = 5.5% in 2030."]},{"id":"e3","goal":1,"task":"Choose aid for the first weeks of an acute famine, with many sick and elderly people.","steps":["“People need food immediately.”","“Food-for-work will feed people while building roads.”","“Everyone who works gets a daily ration.”","“So everyone will be fed.”"],"_a":"VQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier.","The mistake is earlier."],"fixes":[{"t":"“Make the work shorter.”","why":"Sick and elderly people, and caregivers, still can’t take part.","_n":"2kbd8","_k":"36706e35"},{"t":"Step 2 is correct.","why":"It leaves out the people most at risk.","_n":"2lb88","_k":"17894eea"},{"t":"“In an acute emergency, give unconditional help first (food or cash, depending on markets) plus nutrition for young children. Food-for-assets can come in recovery.”","why":"In an acute emergency, people who are sick, elderly or caring for others can’t work. Unconditional help comes first.","_n":"2mb78","_k":"f634ac43"},{"t":"“Pay in cash instead of food.”","why":"It still excludes people who can’t work.","_n":"2nba8","_k":"774d3409"}],"hints":["Who can’t work in a famine?","Sick and elderly people, young children, caregivers.","Unconditional help first."]}]}]},"reflect":{"blocks":[{"title":"Canada’s role","html":"\u003cul>\u003cli>Canada untied its food aid in 2008, allowing aid food to be bought outside Canada, often near the crisis.\u003c/li>\u003cli>The Canadian Foodgrains Bank is a partnership of Canadian church-based agencies.\u003c/li>\u003cli>The UN World Food Programme won the 2020 Nobel Peace Prize.\u003c/li>\u003c/ul>\u003cp class=\"tiny\">For your action plan, look for an \u003cstrong>established humanitarian organization with transparent reporting\u003c/strong>; this module doesn’t recommend any one charity.\u003c/p>\u003cp class=\"tiny\">\u003cstrong>Sources to cite (APA 7)\u003c/strong>\u003c/p>\u003cul class=\"hfa-refs\">\u003cli>FAO, IFAD, UNICEF, WFP, &amp; WHO. (2024). \u003ci>The state of food security and nutrition in the world 2024\u003c/i>. Food and Agriculture Organization of the United Nations.\u003c/li>\u003cli>United Nations General Assembly. (2015). \u003ci>Transforming our world: The 2030 Agenda for Sustainable Development\u003c/i> (A/RES/70/1). United Nations.\u003c/li>\u003c/ul>"}],"journal":[{"id":"j1","q":"What surprised you in the aid designer: that cash can be faster than food, or that aid can hurt local farmers?"},{"id":"j2","q":"In your own words, explain why ‘what does this situation need, for whom, and when?’ matters more than ‘what kind of aid is best?’"},{"id":"j3","q":"Explain to a friend why a headline about SDG 2 progress might mislead, using one number from this module."},{"id":"j4","q":"Action plan: choose one realistic action you could take: write to your MP about Canada’s food-aid policy, organize a fundraiser for an established humanitarian organization, volunteer locally, or share reliable information. What would you do first, and how would you know it helped?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Food given to children at school to support both nutrition and attendance is an example of…","options":[{"t":"Project aid","why":"Food for a specific program or project.","_n":"2ob98","_k":"e48f2d1f"},{"t":"Program aid","why":"Program aid goes government to government, often sold for budget support.","_n":"2pc48","_k":"02c00d15"},{"t":"Emergency aid","why":"Emergency aid responds to a crisis; school meals are a longer-term project.","_n":"2qc38","_k":"3646da6b"},{"t":"Food sovereignty","why":"A different idea: control over food systems (module 20).","_n":"2r00b","_k":"a1c03624"}]},"b":{"prompt":"Food or cash given to people who build water catchments is called…","options":[{"t":"Program aid","why":"Program aid is government to government.","_n":"2sffb","_k":"31936c31"},{"t":"A voucher program","why":"Vouchers are spent at shops; they aren’t tied to work.","_n":"2tfeb","_k":"4497b9b9"},{"t":"Food-for-assets (food-for-work)","why":"Aid linked to building community assets.","_n":"2ufdb","_k":"57bfc612"},{"t":"Specialized nutrition","why":"That targets young children and pregnant or breastfeeding people.","_n":"2vfcb","_k":"d04117ed"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"SDG 2 is best summarized as…","options":[{"t":"Take urgent action on climate change","why":"That’s SDG 13.","_n":"2wfbb","_k":"728abee1"},{"t":"End poverty in all its forms","why":"That’s SDG 1; related, but a different goal.","_n":"2xfab","_k":"8cf56979"},{"t":"Ensure clean water and sanitation for all","why":"That’s SDG 6.","_n":"2yf9b","_k":"db8b19e0"},{"t":"End hunger, achieve food security and improved nutrition, and promote sustainable agriculture","why":"That’s SDG 2, Zero Hunger.","_n":"2z08b","_k":"bfd723d7"}]},"b":{"prompt":"Which is a target under SDG 2?","options":[{"t":"Double the agricultural productivity and incomes of small-scale food producers","why":"That’s Target 2.3.","_n":"3007b","_k":"82090f7d"},{"t":"Reduce road traffic deaths","why":"That’s SDG 3.","_n":"31fab","_k":"0dc3e753"},{"t":"Ensure universal access to affordable electricity","why":"That’s SDG 7.","_n":"32fbb","_k":"668db7d7"},{"t":"Achieve gender equality in leadership","why":"That’s SDG 5.","_n":"33fcb","_k":"2ad88f73"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"What do studies of cash transfers in food crises generally find families spend most of the money on?","options":[{"t":"Food and other essentials","why":"Families meet urgent needs first.","_n":"34fdb","_k":"38833c94"},{"t":"Mostly imported goods","why":"Spending is mostly local.","_n":"35f6b","_k":"834ce2f4"},{"t":"Mostly luxury items","why":"Not what the evidence shows.","_n":"36f7b","_k":"84a43aaa"},{"t":"Mostly savings","why":"Hungry families spend on immediate needs.","_n":"37f8b","_k":"a16e0b50"}]},"b":{"prompt":"Why do many agencies prefer cash or vouchers when local markets are working?","options":[{"t":"They reach families faster, give choice, and support local shops and farmers","why":"Speed, choice and local markets all point the same way when markets work.","_n":"38f9b","_k":"0c98925d"},{"t":"Families can’t be trusted with food","why":"Not the reason.","_n":"3902b","_k":"f50afa16"},{"t":"Shipping food is illegal","why":"It isn’t illegal; it’s slower and can hurt local markets.","_n":"3a03b","_k":"a3b378cb"},{"t":"Cash is always cheaper to print","why":"Cost of delivery and speed matter, not printing.","_n":"3b0cc","_k":"945c1267"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Ruvara’s town has full markets but high prices; its remote villages have empty shops after a road washout. Which plan fits best?","options":[{"t":"Seeds and tools everywhere","why":"Seeds don’t feed people now.","_n":"3c0bc","_k":"ad691a2f"},{"t":"Cash or vouchers in town; food bought in the region and trucked to the villages","why":"Markets work in town, not in the villages.","_n":"3d0ec","_k":"c06eb644"},{"t":"Imported food everywhere","why":"Slow, and it undercuts the town market.","_n":"3e0dc","_k":"f207893f"},{"t":"Cash everywhere","why":"The villages have nothing to buy.","_n":"3f08c","_k":"dab2d5a4"}]},"b":{"prompt":"A city has working markets but job losses; a camp nearby has no market access. Which plan fits best?","options":[{"t":"Food-for-assets everywhere","why":"In an emergency, people who can’t work would miss out.","_n":"3g07c","_k":"969c44e6"},{"t":"Cash in the city; in-kind food plus specialized nutrition in the camp","why":"Markets work in the city; the camp has none, so food must be brought in.","_n":"3h0ac","_k":"b4e6ed8c"},{"t":"Imported food everywhere","why":"Slow in the city, where markets work.","_n":"3i09c","_k":"1c74b376"},{"t":"Vouchers everywhere","why":"The camp has no shops.","_n":"3j04c","_k":"4f037874"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Model data: a region’s grain price is 40 normally, 80 during a drought, and 30 the month imported grain arrives at harvest. What’s the best interpretation?","options":[{"t":"The data shows imported aid always helps farmers","why":"It shows the opposite here.","_n":"3k03c","_k":"864af94e"},{"t":"The drought ended, so prices fell to normal","why":"30 is below the normal 40.","_n":"3l06c","_k":"15b88400"},{"t":"Farmers earned more because prices fell","why":"Lower prices mean lower earnings per sack.","_n":"3m07c","_k":"d19988e8"},{"t":"The imported grain pushed prices below normal just as local farmers were selling their harvest","why":"Market displacement.","_n":"3n04c","_k":"eb3d2863"}]},"b":{"prompt":"Model data: maize normally sells for 50; during a crisis 90; then 45 after a regional-purchase program buys from nearby farmers. What’s the best interpretation?","options":[{"t":"Regional purchase always raises prices","why":"Not here.","_n":"3o05c","_k":"0cd0ad38"},{"t":"Prices stayed at crisis levels","why":"90 → 45.","_n":"3p0ac","_k":"dd260b67"},{"t":"Prices came back to about normal without collapsing below it; buying regionally supported farmers","why":"45 is close to the normal 50.","_n":"3q0bc","_k":"f8f86d6e"},{"t":"The program caused a price crash","why":"45 is near normal, not a crash.","_n":"3r08c","_k":"d3d41df0"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Model data: undernourishment fell from 20% in 2015 to 16% in 2023. At the same average rate, about where will it be in 2030?","options":[{"t":"About 16%","why":"It’s still falling.","_n":"3s09c","_k":"d1df5868"},{"t":"About 0%","why":"That assumes 4 points per year.","_n":"3tfec","_k":"c31a723d"},{"t":"About 12.5%: not on track for near-zero","why":"4 points in 8 years = 0.5/year; 16 − 7 × 0.5 = 12.5.","_n":"3uffc","_k":"d6b7447c"},{"t":"About 8%","why":"That would need 8 points in 7 years.","_n":"3v88b","_k":"e2e04bc7"}]},"b":{"prompt":"Model data: wasting fell from 10% in 2016 to 7% in 2022. At the same rate, about where will it be in 2030?","options":[{"t":"About 7%","why":"It’s still falling.","_n":"3w87b","_k":"1acefa31"},{"t":"About 3%","why":"3 points in 6 years = 0.5/year; 7 − 8 × 0.5 = 3.","_n":"3x86b","_k":"3111a0d4"},{"t":"About 5.5%","why":"That uses 0.25/year.","_n":"3y85b","_k":"79f97f3d"},{"t":"About 0%","why":"That assumes 3 points a year, not 3 points in 6 years.","_n":"3z8cb","_k":"f6a4f90c"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the clearest explanation of why imported food can harm a farming region?","options":[{"t":"“If shipped food arrives when local farmers are selling their harvest, it adds supply and reduces demand, so prices and farmers’ incomes fall.”","why":"It names the timing, the supply and demand shift, and the effect on farmers.","_n":"408bb","_k":"2387d011"},{"t":"“Farmers don’t like foreign food.”","why":"It’s about prices, not preference.","_n":"418ab","_k":"f32760fc"},{"t":"“Imported food is always lower quality.”","why":"Quality isn’t the main issue.","_n":"4289b","_k":"f796ad83"},{"t":"“It never harms anyone because it’s free.”","why":"Free food still changes what people buy: arriving at harvest, it pushes farmers’ prices down.","_n":"4380b","_k":"12dcdfb3"}]},"b":{"prompt":"Which is the clearest explanation of why cash doesn’t help when markets are empty?","options":[{"t":"“Cash always arrives too slowly.”","why":"Cash is fast; the problem is that there’s nothing to buy.","_n":"447fb","_k":"5c147283"},{"t":"“With no food to buy, extra money doesn’t create food; it mostly drives prices up.”","why":"Money can’t buy food that isn’t there.","_n":"4502b","_k":"fd060d7c"},{"t":"“Cash is illegal in emergencies.”","why":"Not true.","_n":"4603b","_k":"9d1943d5"},{"t":"“Families would waste the cash.”","why":"Studies of cash transfers find families mostly spend them on food and essentials. Cash also lets them choose what they need.","_n":"4704b","_k":"faf8ac7b"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which evaluation statement is best supported and uses the criteria correctly?","options":[{"t":"“The response was bad because aid causes dependency.”","why":"Unsupported generalization.","_n":"4805b","_k":"399cf41d"},{"t":"“The response was perfect because people received food.”","why":"It ignores timing and market effects.","_n":"4906b","_k":"6f3b77c7"},{"t":"“The seeds program was too slow, so all aid failed.”","why":"One weakness doesn’t decide every criterion.","_n":"4a07b","_k":"d9b29872"},{"t":"“The cash program scored well on speed and dignity, but the September grain shipment scored poorly on markets because it arrived at harvest and prices fell below normal.”","why":"Each judgment names a criterion and the evidence for it.","_n":"4b08b","_k":"7229bcd1"}]},"b":{"prompt":"Which statement best uses evidence to judge resilience?","options":[{"t":"“Resilience is high because lots of food was shipped.”","why":"Shipped food doesn’t build long-term capacity.","_n":"4c09b","_k":"9f7b68c6"},{"t":"“Resilience doesn’t matter in emergencies.”","why":"It matters for the exit plan.","_n":"4dfab","_k":"f2695e97"},{"t":"“The seeds program and water catchments leave the region better prepared for the next dry season, so resilience scores high, even though they don’t feed people right away.”","why":"It ties the score to evidence about the next season.","_n":"4efbb","_k":"f69816c6"},{"t":"“Any aid builds resilience.”","why":"Not automatically.","_n":"4f74b","_k":"6bab9057"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A Grade 12 club wants to help people facing a food crisis abroad. Which plan is most likely to help?","options":[{"t":"Send seeds by mail","why":"Seeds must suit local conditions and rules.","_n":"4g73b","_k":"d5e33109"},{"t":"Collect canned food in Canada and ship it overseas","why":"Slow and costly, and it may not fit local needs or markets.","_n":"4h76b","_k":"ea324727"},{"t":"Post on social media without checking the facts","why":"Unverified posts can spread misinformation.","_n":"4i75b","_k":"3cda929d"},{"t":"Raise money for an established humanitarian organization with transparent reporting, and write to their MP about food-aid policy","why":"Cash donations let experienced agencies buy what fits (often locally); advocacy shapes policy.","_n":"4j78b","_k":"6d174634"}]},"b":{"prompt":"Which local action best addresses food insecurity in your own community?","options":[{"t":"Collect only expensive specialty foods","why":"Food programs usually need staples and funds, not specialty items.","_n":"4k77b","_k":"315c1ad1"},{"t":"Do nothing, because it’s a global problem","why":"Local action matters.","_n":"4l7ab","_k":"300f1f28"},{"t":"Tell families to budget better","why":"Blames individuals; ignores income.","_n":"4m79b","_k":"42cfe59d"},{"t":"Volunteer with or fundraise for an established local program, and support policy changes that address income","why":"Food insecurity in Canada is closely tied to income (module 19).","_n":"4n7cb","_k":"d8cec027"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"In a refugee camp with no markets, screening finds many children with severe wasting. Which combination fits best?","options":[{"t":"Food rations only","why":"Children with severe wasting need specialized treatment.","_n":"4o7bb","_k":"7bf596bc"},{"t":"Seeds and tools only","why":"Doesn’t feed people now.","_n":"4p8eb","_k":"8f9ef83d"},{"t":"Cash only","why":"No market to spend it in.","_n":"4q8fb","_k":"47e43107"},{"t":"In-kind food rations plus specialized therapeutic nutrition for young children","why":"No markets → in-kind; severe wasting → therapeutic food.","_n":"4r8cb","_k":"b7657c46"}]},"b":{"prompt":"After a cyclone, a coastal town’s shops reopen within a week, but many pregnant people and young children are at risk. Which combination fits best?","options":[{"t":"Cash or vouchers for households plus specialized nutrition for pregnant people and young children","why":"Shops work again, so cash or vouchers fit; at-risk groups also need targeted nutrition.","_n":"4s8db","_k":"29d7b314"},{"t":"Cash only","why":"At-risk groups need targeted nutrition too.","_n":"4t8ab","_k":"2ba5137d"},{"t":"Food-for-assets only","why":"Not in the first weeks.","_n":"4u8bb","_k":"94bbef97"},{"t":"Imported food only","why":"Shops have reopened; imported food is slow.","_n":"4v88b","_k":"6f2cf1ca"}]}}]},"task":{"title":"Two places, one plan","summary":"Two places, one plan","statement":"\u003cp>Ruvara’s drought response needs a plan for \u003cstrong>two places\u003c/strong> and \u003cstrong>two phases\u003c/strong>. Design one that meets every condition. There’s more than one good answer.\u003c/p>\u003cblockquote class=\"fai-sit\">\u003cp>\u003cstrong>Situation:\u003c/strong> the town’s markets are working but prices are high; the remote villages’ shops are empty because the road is washed out; screening shows rising wasting among young children.\u003c/p>\u003c/blockquote>","checks":["Town: help that uses working markets","Villages: food that can arrive within 6 weeks without needing a market","Young children and pregnant people protected","Recovery builds resilience","Targets: one for hunger or malnutrition, one for producers or sustainability","Justification"],"tips":["Town markets work: cash or vouchers reach families fastest and support shops.","Village shops are empty: cash won’t help. Imported food takes 16 weeks. Food bought in the region arrives in 6.","Rising wasting means young children need specialized nutrition.","Recovery is the time for seeds, tools or water projects.","Pick one target about people’s hunger or nutrition and one about farmers or sustainability.","Explain your choices using the criteria words."],"explainPrompt":"Explain why the town and the villages need different kinds of help, and how your recovery choice ends the need for aid.","vocab":"Use the words local market, targeting, resilience and dignity.","checkLabel":"Check my plan","success":"Your plan meets every line of the checklist.","more":"There’s more than one good plan. Can you find another?","town":["A1","A2","A3","A4"],"villages":["A1","A2","A3","A4"],"phase2":["A1","A2","A3","A6","A7"],"targets":[{"id":"2.1","t":"2.1 End hunger"},{"id":"2.2","t":"2.2 End all forms of malnutrition"},{"id":"2.3","t":"2.3 Small-scale producers’ productivity and incomes"},{"id":"2.4","t":"2.4 Sustainable food production"},{"id":"2.5","t":"2.5 Genetic diversity of seeds"}],"words":["local market","dignity","resilience","targeting","dependency"],"justLabel":"Justification (80–200 words)","modelsTitle":"Three model plans and a sample justification","models":[{"title":"Plan 1","text":"Town A3 (cash); villages A2; nutrition yes; recovery A7 (seeds and tools); targets 2.2 and 2.3."},{"title":"Plan 2","text":"Town A4 (vouchers); villages A2; nutrition yes; recovery A6 (water catchments); targets 2.1 and 2.4."},{"title":"Plan 3","text":"Town A3; villages A2; nutrition yes; recovery A6; targets 2.2 and 2.4."},{"title":"Sample justification (Plan 1)","text":"In town, food is in the shops but families can’t afford it, so cash transfers reach them in about a week and keep money in the local market. Villages have empty shops, so cash would only push prices up; food bought in the region can arrive within six weeks. Because screening shows rising wasting, specialized nutrition targets young children and pregnant people first. After the rains, seeds and tools help farmers replant, which builds resilience and gives the aid a clear end, reducing dependency. These choices serve SDG target 2.2 on malnutrition and target 2.3 on small-scale producers’ incomes."}]},"cards":[["Emergency aid","Food or cash in a crisis (drought, conflict, disaster) to save lives now."],["Program aid","Food given government to government, often sold to support the budget."],["Project aid","Food for a specific program: school meals, food-for-assets, nutrition programs."],["Local or regional purchase","Buying aid food near the crisis: faster, and it supports nearby farmers."],["Cash transfers and vouchers","Money or vouchers so families buy what they need: fast and dignified when markets work."],["Market displacement","Aid food that lowers the prices local farmers earn, e.g. arriving at harvest."],["Specialized nutrition","Fortified foods and therapeutic foods for young children, and pregnant or breastfeeding people."],["Food-for-assets","Aid tied to building community assets (water, soil); best in recovery, not acute crises."],["Resilience","A community’s ability to withstand the next shock: seeds, water, savings, markets."],["SDG 2","Zero Hunger: end hunger and malnutrition, raise small-scale farmers’ incomes, sustainable food systems, by 2030."],["“On track?”","Compare the average yearly change with what’s needed to reach the 2030 target."],["The key question","What does this place need, for whom, and when?"]]}};</script>
