<script>window.MV_PAYLOAD={"meta":{"id":"16-canadian-food-production","nn":"16","slug":"canadian-food-production","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 4","groupName":"Canadian Food Systems","trivium":"","size":"M","storageKey":"hfa4u-16-canadian-food-production-v1","progressKey":"hfa4u-progress-v1:16-canadian-food-production","toolkit":"1.0.8"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"f940372a","content":{"id":"16-canadian-food-production","kind":"topic","title":"Canadian food production","topic":"Canadian Food Production","readyTopic":"Canadian food production","hero":{"headline":"Every plate has a map","text":"Canada’s \u003cstrong>food-producing regions\u003c/strong> each grow what their climate, soil and water allow. \u003cstrong>Supply management\u003c/strong>, \u003cstrong>trade\u003c/strong> and the \u003cstrong>people who work on farms\u003c/strong> decide what reaches the store and what it costs. Then a drought, a flood or a border delay can redraw the map overnight.","fig":{"html":"\u003cdiv class=\"cf-hero\" id=\"cf-hero\">\u003c/div>","caption":""},"aria":"A map of Canada with five glowing regions: Pacific, Prairies, Central, Atlantic and North. A lunch tray beside it holds bread, cheese, an apple and a salad. Lines run from the bread to the Prairies, the cheese to Ontario and Quebec, the apple to the Okanagan Valley and the lettuce to Ontario. The month flips from August to January: the lettuce’s line swings south to California and becomes dashed (imported), while the apple’s line stays put (stored).","caption":"August: bread from the Prairies, cheese from Ontario and Quebec, the apple from the Okanagan Valley, lettuce from Ontario. January: the lettuce is imported from California; the apple is stored."},"goals":["I can describe Canada’s main food-producing regions and explain how climate, soil and water shape what each produces.","I can explain how supply management and trade shape what’s in Canadian stores and what it costs.","I can predict how a shock (drought, flood, labour shortage, disease, border delay) affects food supply and prices, and who is affected.","I can explain what “Product of Canada” and “Made in Canada” claims mean on a label.","I can evaluate local and global food-distribution systems for food security and the environment.","I can plan a meal from Canadian, in-season foods and explain the trade-offs."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Canada’s geography","goal":1,"prompt":"Which region of Canada grows most of the country’s wheat and canola?","options":[{"t":"The Prairies (Alberta, Saskatchewan, Manitoba)","why":"Flat land, deep soils and a growing season long enough for grains and oilseeds.","_n":"0009","_k":"04b5d1ad"},{"t":"Atlantic Canada","why":"Atlantic Canada is known for fisheries, potatoes and wild blueberries.","_n":"1ff9","_k":"76decfbb"},{"t":"The North","why":"The growing season there is too short for field grains.","_n":"2fe9","_k":"a403d647"},{"t":"Southern British Columbia","why":"BC’s valleys favour fruit, berries and greenhouse crops.","_n":"3fd9","_k":"4e0442cb"}],"hints":["Think of the wide, flat farmland in the middle of the country.","Saskatchewan alone grows a large share of Canada’s wheat.","The Prairies."]},{"id":"w2","skill":"Canada’s geography","goal":1,"prompt":"Why can southern Ontario grow peaches and grapes while most of Canada can’t?","options":[{"t":"Ontario gets the most rain in Canada","why":"Coastal BC gets more rain.","_n":"4fc9","_k":"9d95ca97"},{"t":"The Great Lakes moderate the temperature, giving a longer frost-free season","why":"The Niagara region sits between two lakes that slow spring and fall frosts.","_n":"5fb9","_k":"64a9a6f0"},{"t":"Greenhouses cover the whole region","why":"Niagara’s tender fruit grows outdoors.","_n":"6fa9","_k":"e0ae50f7"},{"t":"The soil is the only reason","why":"Soil matters, but tender fruit needs enough frost-free days.","_n":"7099","_k":"26751640"}],"hints":["What’s special about the Niagara peninsula’s location?","Large lakes hold heat.","Lake effect: a longer frost-free season."]},{"id":"w3","skill":"The food system","goal":2,"prompt":"Which list follows food from the land to you, in order?","options":[{"t":"Processing → farm → retail → consumer","why":"Raw food comes from farms first.","_n":"8089","_k":"d311288a"},{"t":"Consumer → retail → farm → processing","why":"That runs backwards.","_n":"9357","_k":"3eb7ab45"},{"t":"Farm → consumer → processing → retail","why":"Processing happens before food reaches stores.","_n":"a367","_k":"a156d372"},{"t":"Farm → processing → distribution → retail → consumer","why":"That’s the food system’s supply chain.","_n":"b337","_k":"2a715c3f"}],"hints":["Where does food start?","It’s grown, then changed, then moved.","Farm, processing, distribution, retail, consumer."]},{"id":"w4","skill":"The food system","goal":3,"prompt":"A frost destroys half of a region’s apple blossoms in spring. What is the most likely effect that fall?","options":[{"t":"No effect, because apples are imported","why":"Canada grows many apples in season.","_n":"c347","_k":"d02bcbde"},{"t":"Fewer local apples and higher prices for them","why":"Less supply with the same demand pushes prices up.","_n":"d397","_k":"bef81c8f"},{"t":"Lower prices","why":"Lower supply usually means higher prices.","_n":"e3a7","_k":"42b5fd8d"},{"t":"More apples, because trees recover","why":"Lost blossoms mean lost fruit that year.","_n":"f377","_k":"bef4eee4"}],"hints":["Blossoms become fruit.","Less fruit, same number of shoppers.","Fewer apples, higher price."]},{"id":"w5","skill":"Reading origin information","goal":4,"prompt":"A bag of frozen blueberries says “Product of Chile”. What does that tell you?","options":[{"t":"That they are lower quality","why":"Origin says nothing about quality.","_n":"g387","_k":"eac2a8ae"},{"t":"That they are organic","why":"Organic needs its own certification logo.","_n":"h3d7","_k":"a8ea326d"},{"t":"That they were air-freighted","why":"Frozen fruit usually travels by ship or truck.","_n":"i3e7","_k":"ac197c45"},{"t":"Where the blueberries were grown and packed","why":"Origin labels tell you where the food comes from.","_n":"j4f7","_k":"e2edd7bb"}],"hints":["What question does an origin label answer?","Where it’s from.","Grown and packed in Chile."]},{"id":"w6","skill":"Reading origin information","goal":5,"prompt":"Which is a reason some people choose locally grown food?","options":[{"t":"Because local food never needs packaging","why":"Many local foods are packaged too.","_n":"k4e7","_k":"dbdc03be"},{"t":"Because local food always has the lowest emissions","why":"How food is grown often matters more than distance.","_n":"l4d7","_k":"ff5f7d1c"},{"t":"Because local food is always cheaper","why":"Local food can cost more or less depending on the season and the farm.","_n":"m4c7","_k":"fbac0186"},{"t":"To support nearby farms and keep money in the local economy","why":"That’s a common, well-founded reason.","_n":"n4b7","_k":"10949c6b"}],"hints":["Which answer is true every time?","Check “always” and “never”.","Supporting local farms."]}],"refreshers":{"Canada’s geography":"The Prairies grow grains, oilseeds, pulses and beef. Ontario and Quebec have dairy, poultry, eggs, field crops and fruit and vegetables. BC has fruit, berries, seafood and greenhouses. The Atlantic provinces have fisheries, potatoes and wild blueberries. The North has short summers and relies on harvested foods and shipped groceries.","The food system":"Farm → processing → distribution → retail → consumer, with waste and recovery at every step. A change at one link travels down the chain.","Reading origin information":"An origin label tells you where a food comes from: not its quality, safety or emissions."}}},"explore":{"heading":"Farm-to-table Canada","intro":"Tap a region to see what it produces. Then build a meal, switch the month, and see where every ingredient comes from. Finally, hit the system with a shock and watch what changes.","modes":[{"id":"region","t":"Region explorer"},{"id":"trace","t":"Meal trace"},{"id":"shock","t":"Shock mode"}],"months":[{"id":"jan","t":"January"},{"id":"aug","t":"August"}],"sections":[{"id":"vf","t":"Vegetables and fruits"},{"id":"grain","t":"Whole grains"},{"id":"protein","t":"Protein foods"},{"id":"other","t":"Other"}],"regions":[{"id":"pac","t":"Pacific (BC)","short":"Pacific","lead":"Products","products":[{"t":"Tree fruit in the Okanagan Valley (apples, cherries)"},{"t":"Berries in the Fraser Valley"},{"t":"Seafood (salmon, shellfish)"},{"t":"Greenhouse vegetables"}],"why":"Mild coastal climate, valleys, ocean."},{"id":"pra","t":"Prairies","short":"Prairies","lead":"Products","products":[{"t":"Wheat, canola, barley, oats"},{"t":"Pulses such as lentils and peas (Saskatchewan)"},{"t":"Beef cattle (Alberta)"}],"why":"Flat land, deep fertile soils, long summer days.","risk":"Drought."},{"id":"cen","t":"Central (Ontario and Quebec)","short":"Central","lead":"Products","products":[{"t":"Dairy","sm":true},{"t":"Poultry: chicken","sm":true},{"t":"Poultry: turkey","sm":true},{"t":"Eggs","sm":true},{"t":"Pork"},{"t":"Corn and soybeans"},{"t":"Fruit and vegetables (Niagara tender fruit, Holland Marsh vegetables)"},{"t":"Greenhouse vegetables (Leamington)"},{"t":"Maple syrup (Quebec produces most of the world’s supply)"}],"why":"The Great Lakes and St. Lawrence moderate the climate; large markets nearby."},{"id":"atl","t":"Atlantic","short":"Atlantic","lead":"Products","products":[{"t":"Fisheries (lobster, snow crab)"},{"t":"Potatoes (PEI, New Brunswick)"},{"t":"Wild blueberries (Nova Scotia, New Brunswick)"}],"why":"Ocean access, sandy soils, cool climate."},{"id":"nor","t":"North","short":"North","lead":"Food sources","products":[{"t":"Country foods (caribou, Arctic char, seal, berries) harvested by Indigenous communities"},{"t":"Groceries flown or shipped in"},{"t":"A few community greenhouses"}],"why":"A short, cool growing season and permafrost.","more":"Modules 19 and 20 look at food in the North in more depth."}],"smBadge":"supply-managed","ingredients":[{"id":"bread","t":"Whole-wheat bread","short":"bread","sec":"grain","reg":"pra","jan":"ca","aug":"ca"},{"id":"oats","t":"Rolled oats","short":"oats","sec":"grain","reg":"pra","jan":"ca","aug":"ca"},{"id":"rice","t":"Brown rice","short":"brown rice","sec":"grain","reg":"","jan":"us","aug":"us"},{"id":"lentils","t":"Lentils","short":"lentils","sec":"protein","reg":"pra","jan":"ca","aug":"ca"},{"id":"beef","t":"Beef","short":"beef","sec":"protein","reg":"pra","jan":"ca","aug":"ca"},{"id":"chicken","t":"Chicken","short":"chicken","sec":"protein","reg":"cen","jan":"ca","aug":"ca"},{"id":"eggs","t":"Eggs","short":"eggs","sec":"protein","reg":"cen","jan":"ca","aug":"ca"},{"id":"yogurt","t":"Plain yogurt","short":"yogurt","sec":"protein","reg":"cen","jan":"ca","aug":"ca"},{"id":"salmon","t":"Salmon","short":"salmon","sec":"protein","reg":"pac","jan":"ca","aug":"ca"},{"id":"potatoes","t":"Potatoes","short":"potatoes","sec":"vf","reg":"atl","jan":"stored","aug":"ca"},{"id":"apples","t":"Apples","short":"apples","sec":"vf","reg":"cen","jan":"stored","aug":"ca"},{"id":"blueberries","t":"Wild blueberries (frozen)","short":"wild blueberries","sec":"vf","reg":"atl","jan":"frozen","aug":"ca"},{"id":"lettuce","t":"Lettuce","short":"lettuce","sec":"vf","reg":"cen","jan":"us","aug":"ca"},{"id":"strawberries","t":"Strawberries","short":"strawberries","sec":"vf","reg":"cen","jan":"us","aug":"ca"},{"id":"oranges","t":"Oranges","short":"oranges","sec":"vf","reg":"","jan":"us","aug":"us"},{"id":"maple","t":"Maple syrup","short":"maple syrup","sec":"other","reg":"cen","jan":"ca","aug":"ca"}],"origins":{"ca":"Canada","stored":"Canada (stored)","frozen":"Canada (frozen)","us":"Imported (US)"},"shocks":[{"id":"none","t":"None"},{"id":"drought","t":"Prairie drought","eff":[{"id":"bread","v":18},{"id":"oats","v":15},{"id":"lentils","v":15},{"id":"beef","v":8,"note":"feed costs"}],"who":"Prairie farmers; then shoppers everywhere"},{"id":"flood","t":"Flood cuts BC highway and rail links","eff":[{"id":"salmon","v":5,"note":"delayed reaching the rest of Canada"},{"id":"oranges","v":4,"note":"in BC stores"},{"id":"rice","v":4,"note":"in BC stores"}],"who":"BC shoppers and exporters (a real example: the November 2021 BC floods)"},{"id":"border","t":"Border slowdown for US trucks","when":"imported","eff":[{"id":"lettuce","v":20},{"id":"strawberries","v":20},{"id":"oranges","v":10},{"id":"rice","v":3}],"who":"Shoppers buying imported produce"},{"id":"labour","t":"Farm labour shortage","when":"aug","eff":[{"id":"strawberries","v":15},{"id":"lettuce","v":10},{"id":"apples","v":10}],"who":"Hand-harvested crops; grains barely change","offNote":"This model applies the labour shortage in August, during the harvest."},{"id":"avian","t":"Avian influenza in poultry flocks","eff":[{"id":"eggs","v":12},{"id":"chicken","v":8}],"who":"Poultry farmers and egg buyers"}],"tomato":{"title":"Tomatoes: where do the emissions come from?","items":[{"id":"gh","t":"Greenhouse tomatoes, heated, 50 km away","grow":84,"trans":3},{"id":"field","t":"Field tomatoes, trucked 3000 km, in season","grow":24,"trans":12}],"parts":{"grow":"growing","trans":"transport","total":"emissions"}},"modelNote":"Simplified teaching data: real supply chains are more mixed (for example, some winter lettuce is grown in Canadian greenhouses).","predIntro":"Make a prediction first. Then the map will show you what really happens.","predictions":[{"id":"p1","prompt":"Switch to January. Where will the lettuce in an Ontario grocery store most likely come from?","options":[{"t":"The US (California or Arizona)","_n":"o4a7","_k":"f491bd31"},{"t":"Northern Canada","_n":"p497","_k":"c7ee53ad"},{"t":"Ontario fields","_n":"q487","_k":"1711dc25"},{"t":"It disappears from stores","_n":"r477","_k":"fcb80c71"}],"explain":"In winter, most fresh lettuce in Canadian stores is trucked from the southwestern US. Some Canadian greenhouse lettuce exists, but field lettuce can’t grow here in January."},{"id":"p2","prompt":"Which of these foods is supply-managed in Canada?","options":[{"t":"Wheat","_n":"s467","_k":"187acad1"},{"t":"Lentils","_n":"tc97","_k":"979e077c"},{"t":"Apples","_n":"uca7","_k":"d707c1ed"},{"t":"Milk","_n":"vcb7","_k":"e21400ae"}],"explain":"Supply management covers dairy, poultry and eggs: farmers hold production quotas, imports above set amounts face high tariffs, and farm prices are based on production costs."},{"id":"p3","prompt":"Which ingredient’s model price rises most?","options":[{"t":"Maple syrup","_n":"wcc7","_k":"2c2b3a91"},{"t":"Chicken","_n":"xc57","_k":"78bf6b1c"},{"t":"Apples","_n":"yc67","_k":"60d3736a"},{"t":"Whole-wheat bread","_n":"zc77","_k":"dadbde03"}],"explain":"Wheat comes from the Prairies, so the drought hits bread hardest. Shoppers in Halifax feel a drought in Saskatchewan."},{"id":"p4","prompt":"Tomatoes from a heated greenhouse 50 km away vs field tomatoes trucked 3000 km in season. Which usually has lower greenhouse-gas emissions?","options":[{"t":"They’re always equal","_n":"10c87","_k":"0116c1c0"},{"t":"The trucked ones, always","_n":"11c17","_k":"270f42c0"},{"t":"It depends: how they’re grown often matters more than the distance","_n":"12c27","_k":"1e9c87df"},{"t":"The local ones, always","_n":"13c36","_k":"bcd0df87"}],"explain":"Transport is usually a small share of a food’s emissions. Heating a greenhouse in winter can outweigh a long truck trip. Air-freighted food is the big exception (studies vary)."}],"chalIntro":"Set the map, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,6],"prompt":"It’s January. Build a 4-ingredient lunch that is 100% Canadian.","why":"Every one of your 4 ingredients is Canadian in January, stored and frozen foods included.","hints":["Switch the month first, then check each chip’s origin.","Stored and frozen foods (potatoes, apples, frozen blueberries) stay Canadian in winter.","Example: bread, chicken, potatoes, apples."]},{"id":"tc2","goal":[1,6],"prompt":"In the “summer salad” (lettuce, strawberries, apples, potatoes), find the two ingredients whose origin changes between August and January. Leave only those two in your meal.","why":"Lettuce and strawberries are Canadian in August but imported in January. Stored apples and potatoes stay Canadian.","hints":["Toggle the month and watch which lines turn dashed.","Which items can’t be stored for months?","Lettuce and strawberries."]},{"id":"tc3","goal":[3,6],"stretch":true,"prompt":"Shock mode, January, Prairie drought on. Build a 5-ingredient dinner that has at least 4 Canadian ingredients, no Prairie ingredients, and at least one item from each plate section (vegetables and fruits, whole grains, protein foods).","why":"Real food systems spread risk by buying from many regions. That’s one argument for diverse supply chains, local and global.","hints":["Which Canadian whole grains aren’t from the Prairies?","None in this model, so your whole grain has to be your one import.","Brown rice, salmon, potatoes, apples, yogurt."]}],"msgs":{"count4":"Choose exactly 4 ingredients. You have {n}.","count5":"Choose exactly 5 ingredients. You have {n}.","janImp":"Those are Canadian in August, but imported in January.","allYear":"Those are imported all year.","tc2Apples":"Stored Canadian apples carry the supply through winter.","tc2Potatoes":"Potatoes store well for months.","tc2Other":"Use only the summer salad’s ingredients: lettuce, strawberries, apples and potatoes.","tc2Missing":"Keep both ingredients whose origin changes. Toggle the month and watch which lines turn dashed.","prairieGrain":"Every Canadian whole grain in this model comes from the Prairies.","prairieOther":"Lentils and beef come from the Prairies too. This dinner needs zero Prairie ingredients.","twoImports":"Two imports: you only have room for one.","sections":"Check the plate-sections row.","full":"Your meal already has 5 ingredients. Tap one to remove it first."},"readLabels":{"ca":"Canadian ingredients","imp":"Imported","regions":"Regions represented","secs":"Plate sections","prairie":"Prairie ingredients","shock":"Shock effect","who":"Who is affected first"},"blocks":[{"title":"What the map shows","html":"\u003cul>\u003cli>Where a food comes from depends on the region \u003cstrong>and\u003c/strong> the month.\u003c/li>\u003cli>A shock’s damage depends on where your food comes from.\u003c/li>\u003cli>In this model, every Canadian whole grain comes from the Prairies, so a Prairie drought reaches every plate.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"meal-origin","name":"Origins","heading":"Where did this meal come from?","intro":"The map showed where food grows. Now look at what labels and distribution systems tell shoppers: decode origin claims on five product cards, compare a local and a national and global food system, and place Ontario foods on a seasonal wheel.","stations":[{"id":"claims","t":"1. Decode the origin claim"},{"id":"grid","t":"2. Two ways to get food to people"},{"id":"wheel","t":"3. In season in Ontario"}],"claims":{"title":"Station 1: decode the origin claim","ask":"Tap the claim each product may carry. Open \u003cstrong>Check it with data\u003c/strong> to see its ingredients.","rules":[{"id":"pc","t":"Product of Canada","rule":"All or virtually all major ingredients, processing and labour are Canadian. Small amounts of ingredients not grown here (e.g. spices, vitamins) may be imported."},{"id":"di","t":"Made in Canada from domestic and imported ingredients","rule":"The last substantial change happened in Canada, using a mix of ingredients."},{"id":"im","t":"Made in Canada from imported ingredients","rule":"The last substantial change happened in Canada, with imported main ingredients."}],"cards":[{"id":"c1","t":"Apple juice","html":"Apple juice from Ontario apples, pressed and packed in Ontario.","_a":"RElXEg==","data":[["Apples (main ingredient)","Ontario, Canada"],["Pressed and packed","Ontario, Canada"]],"why":"Its main ingredient, processing and labour are all Canadian.","wrong":{"di":"Every major ingredient here is Canadian, so there is no imported part to name.","im":"The apples are from Ontario, not imported."}},{"id":"c2","t":"Cookies","html":"Cookies baked in Quebec from Canadian flour with imported cocoa and sugar.","_a":"RF1dEg==","data":[["Wheat flour","Canada"],["Sugar","Imported"],["Cocoa","Imported"],["Baked and packed","Quebec, Canada"]],"why":"They were made here from a mix of Canadian and imported major ingredients.","wrong":{"pc":"Sugar and cocoa are major ingredients, and they’re imported. “Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","im":"The flour is Canadian, so the ingredients are a mix."}},{"id":"c3","t":"Pasta","html":"Pasta made in Saskatchewan from Canadian durum wheat.","_a":"RElXEg==","data":[["Durum wheat (main ingredient)","Canada"],["Made and packed","Saskatchewan, Canada"]],"why":"Its main ingredient, processing and labour are all Canadian.","wrong":{"di":"Every major ingredient here is Canadian, so there is no imported part to name.","im":"The durum wheat is Canadian, not imported."}},{"id":"c4","t":"Coffee","html":"Coffee roasted in Vancouver from imported beans.","_a":"RFBZEg==","data":[["Coffee beans (main ingredient)","Imported"],["Roasted and packed","Vancouver, Canada"]],"why":"It was roasted here, but its main ingredient is imported. It could also carry a specific claim such as “Roasted in Canada”.","wrong":{"pc":"Coffee beans aren’t grown in Canada. “Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","di":"Nothing major in it is Canadian: the beans are imported."}},{"id":"c5","t":"Frozen fish sticks","html":"Frozen fish sticks breaded in Nova Scotia from imported fish.","_a":"RFBZEg==","data":[["Fish (main ingredient)","Imported"],["Breaded, frozen and packed","Nova Scotia, Canada"]],"why":"They were made here, but the main ingredient, the fish, is imported.","wrong":{"pc":"The fish is imported. Processing in Nova Scotia isn’t enough. “Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","di":"The main ingredient, the fish, is imported. Breading it here is the processing, not a Canadian ingredient."}}],"msgs":{"done":"All five cards decoded.","data":"Check it with data","made":"Where it was made"}},"grid":{"title":"Station 2: two ways to get food to people","ask":"For each criterion, decide which system is stronger. Then read the evidence and compare your rating with the model rating.","systems":{"local":"A local system: a farmers’ market or community-supported agriculture (CSA)","global":"A national and global system: a grocery chain’s supply chain"},"choices":[{"id":"local","t":"Local stronger"},{"id":"global","t":"National and global stronger"},{"id":"depends","t":"It depends: both"}],"criteria":[{"id":"avail","t":"Availability in January","_a":"RF5YX1FWXkM=","ev":["Trade brings in produce that can’t grow here in winter.","Stored crops like apples and potatoes, and greenhouse produce, fill some of the gap locally."]},{"id":"cost","t":"Cost to the shopper","_a":"RF1RQFZZVhJE","ev":["Local food can cost more or less depending on the season and the farm.","Large supply chains buy in bulk, but shocks and border delays raise their prices too."]},{"id":"resil","t":"Resilience to a regional shock","_a":"RF1RQFZZVhJE","ev":["Buying from many regions spreads the risk: a Prairie drought doesn’t empty every shelf (TC3).","If a flood cuts the highway, nearby farms and stored food still reach the town (quick check)."]},{"id":"farms","t":"Support for local farms","_a":"RFVbU1JbEA==","ev":["Buying directly supports nearby farms and keeps money in the local economy."]},{"id":"env","t":"Environmental impact","_a":"RF1RQFZZVhJE","ev":["For most foods, how they’re grown matters more than how far they travel (P4).","Air freight is the big exception."]}],"msgs":{"match":"Matches the model rating.","differ":"The model rates this differently: {r}.","model":"Model rating","ev":"Evidence","key":"Each system is strong where the other is weak. A food-secure community usually needs both."}},"wheel":{"title":"Station 3: in season in Ontario","ask":"Tap a food, then tap its harvest window. Each food you place appears on the seasonal wheel.","windows":[{"id":"mj","t":"May–June","m":[4,5]},{"id":"jj","t":"June–July","m":[5,6]},{"id":"au","t":"August","m":[7,7]},{"id":"fa","t":"Fall (September–October)","m":[8,9]}],"foods":[{"id":"asparagus","t":"Asparagus","_a":"RFReEg==","why":"Asparagus is harvested in May and June.","hint":"Asparagus is one of the first local crops of spring."},{"id":"strawberries","t":"Strawberries","_a":"RFNeEg==","ext":{"m":[7,9],"t":"day-neutral varieties"},"why":"June and July, with day-neutral varieties into fall.","hint":"Field strawberries ripen in early summer."},{"id":"corn","t":"Sweet corn","_a":"RFhBEg==","why":"Sweet corn is an August crop.","hint":"Sweet corn ripens in late summer."},{"id":"apples","t":"Apples","_a":"RF9VEg==","ext":{"m":[10,2],"t":"stored"},"why":"Apples are picked in the fall, then stored.","hint":"Apples are picked as the weather cools."},{"id":"roots","t":"Root vegetables","_a":"RF9VEg==","ext":{"m":[10,2],"t":"stored"},"why":"Root vegetables are dug in the fall and stored through winter.","hint":"Root vegetables are dug late in the season, then stored."}],"msgs":{"pick":"Tap a food first.","done":"Every food is on the wheel. Storage, greenhouses and new varieties stretch the local season.","months":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]}},"blocks":[{"title":"Source to check (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Canadian Food Inspection Agency. (n.d.). \u003ci>Origin claims on food labels\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Origins quick check","summary":"Origins quick check","items":[{"id":"q1","goal":4,"prompt":"“Pasta made in Canada from Canadian wheat, with a pinch of imported spice.”","choices":[{"t":"Made in Canada from imported ingredients","fb":"Virtually all of it is Canadian; minor imported ingredients like spices are allowed.","_n":"14c26","_k":"8bc9c8a5"},{"t":"Organic","fb":"Virtually all of it is Canadian; minor imported ingredients like spices are allowed.","_n":"15c56","_k":"bab62a0b"},{"t":"No claim allowed","fb":"Virtually all of it is Canadian; minor imported ingredients like spices are allowed.","_n":"16c46","_k":"7b4e387d"},{"t":"Product of Canada","fb":"Right. Virtually all of it is Canadian; minor imported ingredients like spices are allowed.","_n":"17c76","_k":"036c996c"}]},{"id":"q2","goal":4,"prompt":"“Chocolate bars made in Ontario from imported cocoa, sugar and milk powder.”","choices":[{"t":"Local","fb":"Made here, but the main ingredients are imported.","_n":"18c66","_k":"8a78a15d"},{"t":"Product of Canada","fb":"Made here, but the main ingredients are imported.","_n":"19c96","_k":"046a426b"},{"t":"Product of Ghana","fb":"Made here, but the main ingredients are imported.","_n":"1ac86","_k":"1129bda6"},{"t":"Made in Canada from imported ingredients","fb":"Right. Made here, but the main ingredients are imported.","_n":"1bbb6","_k":"d1ef577b"}]},{"id":"q3","goal":5,"prompt":"Which system usually offers more variety of fresh produce in January?","choices":[{"t":"Neither","fb":"Trade brings in produce that can’t grow here in winter.","_n":"1cba6","_k":"6032d54e"},{"t":"Both equal","fb":"Trade brings in produce that can’t grow here in winter.","_n":"1dbd6","_k":"876181c8"},{"t":"Farmers’ market","fb":"Trade brings in produce that can’t grow here in winter.","_n":"1ebe6","_k":"d109c7ac"},{"t":"National and global supply chain","fb":"Right. Trade brings in produce that can’t grow here in winter.","_n":"1fbb6","_k":"83bb4d0f"}]},{"id":"q4","goal":5,"prompt":"Which system helps a town keep eating if a flood cuts its highway?","choices":[{"t":"A mix of local farms and stored food","fb":"Right. Diverse sources spread the risk.","_n":"1gbc6","_k":"0cf6ff43"},{"t":"Only one big warehouse","fb":"Diverse sources spread the risk.","_n":"1hb96","_k":"b7c0b18d"},{"t":"Only distant suppliers","fb":"Diverse sources spread the risk.","_n":"1iba6","_k":"e10d5c24"},{"t":"Neither matters","fb":"Diverse sources spread the risk.","_n":"1jb76","_k":"0b6a0709"}]}]}},"practice":{"activities":[{"id":"regions","type":"match","title":"Region ↔ product","summary":"Region ↔ product","goal":1,"instruction":"Match each region to the product it’s known for.","leftTitle":"Region","rightTitle":"Product it’s known for","left":[{"id":"l1","t":"Saskatchewan"},{"id":"l2","t":"Alberta"},{"id":"l3","t":"Prince Edward Island"},{"id":"l4","t":"Quebec"},{"id":"l5","t":"Okanagan Valley, BC"},{"id":"l6","t":"Leamington, Ontario","hints":["Which product is grown under glass?","Leamington has one of North America’s largest greenhouse clusters.","Greenhouse vegetables."]},{"id":"l7","t":"Niagara, Ontario"},{"id":"l8","t":"Atlantic coast"}],"right":[{"id":"r1","t":"Lentils and durum wheat"},{"id":"r2","t":"Beef cattle"},{"id":"r3","t":"Potatoes"},{"id":"r4","t":"Maple syrup"},{"id":"r5","t":"Apples and cherries"},{"id":"r6","t":"Greenhouse tomatoes, cucumbers and peppers"},{"id":"r7","t":"Peaches and grapes"},{"id":"r8","t":"Lobster and snow crab"}],"_a":"HRtYARENEBNXGxgSXwUQW0RLBhIfFV5SRAMWQgAVHkMKDRYKEUUGQ0obWAURDRATUxsYEl8BEFtESwISHxVeVkQDFkIEFR5DCgEWChFFCkMb","wrong":{"l6|r7":"Niagara grows tender fruit outdoors; Leamington is known for greenhouses.","l7|r6":"Niagara grows tender fruit outdoors; Leamington is known for greenhouses.","l1|r2":"Alberta raises the most cattle; Saskatchewan grows the most pulses.","l2|r1":"Alberta raises the most cattle; Saskatchewan grows the most pulses."},"wrongDefault":"Check that region’s climate and soil on the map."},{"id":"ripple","type":"mc","title":"Ripple effects","summary":"Ripple effects","star":true,"goal":3,"instruction":"Six shocks to the food system. Choose the most likely effect. The ★ items are non-routine.","items":[{"id":"s1","goal":3,"prompt":"“Avian influenza forces some poultry farms to cull their flocks.”","options":[{"t":"Nothing changes, because Canada imports its eggs","why":"Canadian eggs and chicken come from Canadian farms; they’re supply-managed.","_n":"1kb86","_k":"3dfcb2ab"},{"t":"Egg and chicken supplies tighten and prices may rise","why":"Fewer birds means less supply of eggs and chicken, so prices may rise.","_n":"1lc56","_k":"5c19adb1"},{"t":"Beef prices double","why":"Avian influenza affects poultry flocks, not cattle.","_n":"1mc66","_k":"f056f7c4"},{"t":"Prices fall","why":"Fewer birds means less supply.","_n":"1nb76","_k":"79b2e8f5"}]},{"id":"s2","goal":3,"prompt":"“Travel restrictions delay seasonal farm workers arriving in spring (as happened in 2020).”","options":[{"t":"Hand-harvested crops like strawberries and greenhouse vegetables are at risk","why":"Many farms, especially fruit, vegetable and greenhouse operations, depend on seasonal and temporary foreign workers. Their working conditions are part of the food system.","_n":"1ob66","_k":"ab0aaafe"},{"t":"Wheat harvests collapse","why":"Grain harvesting is highly mechanized; fruit and vegetable picking relies on hands.","_n":"1pb56","_k":"b7032669"},{"t":"Only imported oranges are affected","why":"Oranges are imported all year. This delay affects work on Canadian farms.","_n":"1qb46","_k":"0ba3d45d"},{"t":"Nothing changes, because farm families do all the work","why":"Many farms, especially fruit, vegetable and greenhouse operations, depend on seasonal and temporary foreign workers. Their working conditions are part of the food system.","_n":"1rbb6","_k":"82f240b8"}]},{"id":"s3","goal":3,"prompt":"★ “A late spring frost hits Niagara during peach blossom.”","options":[{"t":"No effect","why":"Blossoms lost in spring are fruit lost in summer.","_n":"1sba6","_k":"ffdd99de"},{"t":"More peaches, because the trees recover","why":"Lost blossoms mean lost fruit that year.","_n":"1tb96","_k":"98248a09"},{"t":"Fewer Ontario peaches that summer, more imports and higher local prices","why":"Lost blossoms mean lost fruit that year. Less supply with the same demand pushes prices up.","_n":"1ub86","_k":"7aa7fe62"},{"t":"Lower peach prices","why":"Lower supply usually means higher prices.","_n":"1vbf6","_k":"fcc8c6f0"}]},{"id":"s4","goal":3,"prompt":"★ “A drought raises the price of feed grain on the Prairies.”","options":[{"t":"Beef and pork costs rise later as feed costs pass through","why":"Grain is also animal feed, so higher feed costs reach meat prices later.","_n":"1wbe6","_k":"eadd2dd1"},{"t":"Nothing changes outside the Prairies","why":"Prairie crops become flour, oats, lentils and animal feed. When harvests fall, prices can rise for shoppers across the country.","_n":"1x316","_k":"62ce02fe"},{"t":"Only bread is affected","why":"Grain is also animal feed.","_n":"1y326","_k":"8d59cd04"},{"t":"Milk prices double immediately","why":"Feed costs can matter later, but dairy prices are set through supply management.","_n":"1z336","_k":"01a86292"}]},{"id":"s5","goal":3,"prompt":"★ “In February, a trucking slowdown at the US border lasts two weeks. A Montreal shopper’s cart has milk, eggs, lettuce, oranges, potatoes and frozen blueberries. Which items are most affected?”","options":[{"t":"All six items equally","why":"Only the items that cross the US border are hit first.","_n":"20346","_k":"4d64ffca"},{"t":"Milk and eggs","why":"Those are Canadian and supply-managed; they don’t cross the border.","_n":"21356","_k":"26e07342"},{"t":"Potatoes and frozen blueberries","why":"Stored potatoes and frozen blueberries are Canadian in winter.","_n":"22366","_k":"41c8787e"},{"t":"Lettuce and oranges","why":"In February they cross the US border. Milk and eggs are Canadian, and the potatoes and frozen blueberries are stored or frozen Canadian food.","_n":"23376","_k":"d43a3ac1"}],"hints":["Which items cross the US border in February?","Canadian-produced and supply-managed items stay domestic.","Lettuce and oranges."]},{"id":"s6","goal":5,"prompt":"★ (Inquiry) “You want to find out how much of your school cafeteria’s menu is Canadian-grown. Which research plan is strongest?”","options":[{"t":"Look up which foods grow in Canada and assume the cafeteria buys them","why":"That’s a guess. Origins come from suppliers, not guesses.","_n":"24386","_k":"e0a2d812"},{"t":"List one week’s menu items, ask the food-service manager for supplier origin information, classify each item by origin, and calculate the share","why":"It gets origin data from the suppliers and turns it into a share you can report.","_n":"25396","_k":"29ee460d"},{"t":"Taste one day’s lunch and decide which items seem Canadian","why":"Taste can’t tell you origin, and one day is a small sample.","_n":"263a6","_k":"fae35e21"},{"t":"Survey students about where they think the food comes from","why":"That measures opinions, not origins.","_n":"27cb8","_k":"4edc83dd"}],"hints":["What data answers the question directly?","Origins come from suppliers, not guesses.","Menu list → supplier origins → classify → calculate."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Pascale","goal":[2,4,5],"how":"","instruction":"Pascale made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain how supply management works.","steps":["“Supply management covers dairy, poultry and eggs.”","“Farmers buy quota, which sets how much each farm can produce.”","“The government sets a maximum price, so these foods stay cheap.”","“Imports above set amounts face high tariffs.”"],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is correct, but an earlier step isn’t."],"fixes":[{"t":"“Prices are set by other countries.”","why":"Supply management stabilizes farm prices; it isn’t a price cap.","_n":"28ca8","_k":"169c2625"},{"t":"“There are no prices at all.”","why":"Supply management stabilizes farm prices; it isn’t a price cap.","_n":"29cd8","_k":"f078f559"},{"t":"“Farm prices are set from production costs, which keeps prices stable, not necessarily low.”","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"2acc8","_k":"015fb5d9"},{"t":"Step 3 is correct.","why":"Supply management stabilizes farm prices; it isn’t a price cap.","_n":"2bc78","_k":"97bb5d65"}],"hints":["Is the aim low prices or stable prices?","Cost-based pricing.","The fix: farm prices are set from production costs, which keeps prices stable, not necessarily low."]},{"id":"e2","goal":4,"task":"Decide what claim a frozen pizza can carry. It’s made in Ontario from Canadian flour and cheese, with imported tomato paste and spices.","steps":["“The pizza was made in Ontario.”","“Any food made in Canada can say ‘Product of Canada’.”","“So the box can say ‘Product of Canada’.”"],"_a":"Vw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2; the error is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"“Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","_n":"2cc68","_k":"292d1e15"},{"t":"“It must say ‘Product of Italy’.”","why":"“Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","_n":"2dc98","_k":"8c326b51"},{"t":"“‘Product of Canada’ needs all or virtually all major ingredients to be Canadian. Tomato paste is a major ingredient, so the claim is ‘Made in Canada from domestic and imported ingredients’.”","why":"“Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","_n":"2ec88","_k":"702f4e96"},{"t":"“No claim is allowed.”","why":"“Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","_n":"2fc38","_k":"57c7d2ad"}],"hints":["Is tomato paste a major ingredient of pizza?","Yes.","The fix: “Product of Canada” needs all or virtually all major ingredients to be Canadian, so the claim is “Made in Canada from domestic and imported ingredients”."]},{"id":"e3","goal":5,"task":"Which tomato has the lower carbon footprint in January?","steps":["“Tomato A grows in a heated greenhouse 50 km away.”","“Tomato B grows in an unheated field in Mexico and travels 3500 km by truck.”","“The shorter trip always means lower emissions.”","“So Tomato A is lower.”"],"_a":"VA==","stepFb":["Step 1 is a fact from the task.","Step 2 is a fact from the task.","","Step 4 follows step 3."],"fixes":[{"t":"“Distance is only one part. Heating a greenhouse in winter can produce more emissions than trucking, so you’d need data on both.”","why":"For most foods, how they’re grown or raised produces more emissions than trucking or shipping them. Air freight is the big exception. Local has other benefits, but it isn’t automatically lower-carbon.","_n":"2gc28","_k":"bfa40c0a"},{"t":"“Imported food always has lower emissions.”","why":"For most foods, how they’re grown or raised produces more emissions than trucking or shipping them. Air freight is the big exception. Local has other benefits, but it isn’t automatically lower-carbon.","_n":"2h458","_k":"7a7dbe74"},{"t":"“Trucks produce no emissions.”","why":"For most foods, how they’re grown or raised produces more emissions than trucking or shipping them. Air freight is the big exception. Local has other benefits, but it isn’t automatically lower-carbon.","_n":"2i468","_k":"e9d0404e"},{"t":"Step 3 is correct.","why":"For most foods, how they’re grown or raised produces more emissions than trucking or shipping them. Air freight is the big exception. Local has other benefits, but it isn’t automatically lower-carbon.","_n":"2j438","_k":"bc76c9d0"}],"hints":["What else produces emissions besides transport?","Heating.","The fix: distance is only one part; heating a greenhouse in winter can produce more emissions than trucking, so you’d need data on both."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the map: how much switches to imports in winter, or how far a Prairie drought reaches?"},{"id":"j2","q":"In your own words, why does supply management make some prices stable but not cheap?"},{"id":"j3","q":"Explain to a friend why “local” doesn’t automatically mean “lower-carbon”."},{"id":"j4","q":"What’s one thing you’d still like to know about where your own meals come from, and how could you find out?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which province grows most of Canada’s lentils and other pulses?","options":[{"t":"British Columbia","why":"Known for tree fruit, berries and seafood.","_n":"2k448","_k":"c311f9a6"},{"t":"Nova Scotia","why":"Known for wild blueberries and fisheries.","_n":"2l498","_k":"8c23624c"},{"t":"Nunavut","why":"The growing season is too short.","_n":"2m4a8","_k":"d07fa88d"},{"t":"Saskatchewan","why":"Prairie soils and climate suit pulses.","_n":"2n478","_k":"26cc3e13"}]},"b":{"prompt":"In January, where does most of the fresh lettuce sold in Ontario come from?","options":[{"t":"Prince Edward Island","why":"Known for potatoes.","_n":"2o488","_k":"cfd24bae"},{"t":"The southwestern United States","why":"Field lettuce can’t grow in Ontario in winter.","_n":"2p3d8","_k":"444d2cfb"},{"t":"Ontario fields","why":"Canada grows a lot, but in winter most fresh fruit and many fresh vegetables are imported, mainly from the US and Mexico. Stored crops like apples and potatoes, and greenhouse produce, fill some of the gap.","_n":"2q3e8","_k":"42d110d0"},{"t":"The North","why":"Too cold, and fresh produce is shipped in.","_n":"2r4da","_k":"09b3643c"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which three tools make up supply management?","options":[{"t":"Crop insurance, weather forecasts and loans","why":"Those are risk tools, not supply management.","_n":"2s4ea","_k":"7624757c"},{"t":"Organic certification, labelling and inspections","why":"Those are other systems.","_n":"2t4ba","_k":"5800813c"},{"t":"Production quotas, import controls and cost-based farm prices","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"2u4ca","_k":"27f027b7"},{"t":"Price caps, subsidies and export bans","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"2v49a","_k":"b19bddf1"}]},"b":{"prompt":"Which product is \u003cstrong>not\u003c/strong> supply-managed in Canada?","options":[{"t":"Milk","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"2w4aa","_k":"619b1c5c"},{"t":"Eggs","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"2x47a","_k":"ea674ad1"},{"t":"Chicken","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"2y48a","_k":"a4ea7de3"},{"t":"Canola","why":"Canola is traded on open markets.","_n":"2z55a","_k":"422f6a1d"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"What does “Product of Canada” mean?","options":[{"t":"The food is organic","why":"Origin and organic are separate claims.","_n":"3056a","_k":"0ca06074"},{"t":"At least half the ingredients are Canadian","why":"The rule is all or virtually all.","_n":"3153a","_k":"af8f4ea4"},{"t":"All or virtually all major ingredients, processing and labour are Canadian","why":"“Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","_n":"3252a","_k":"b0c2c675"},{"t":"The food was packaged in Canada","why":"“Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","_n":"3355a","_k":"950033fc"}]},"b":{"prompt":"Crackers are made in Manitoba from imported flour and Canadian canola oil. Which claim fits?","options":[{"t":"“Product of Canada”","why":"The flour, a major ingredient, is imported.","_n":"3454a","_k":"c2d4eace"},{"t":"“Imported product”","why":"The last major change happened in Canada.","_n":"3557a","_k":"55209214"},{"t":"“Made in Canada from domestic and imported ingredients”","why":"The last substantial change happened in Canada, using a mix of Canadian and imported ingredients.","_n":"3656a","_k":"077037c5"},{"t":"“Product of Manitoba”","why":"There isn’t a standard claim like that here.","_n":"3759a","_k":"9af586fc"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A severe drought cuts Prairie wheat and canola harvests. Which chain of effects is most likely?","options":[{"t":"Smaller harvests → higher prices for flour, baked goods and canola oil across Canada → lower income for affected farmers","why":"Prairie crops become flour, oats, lentils and animal feed. When harvests fall, prices can rise for shoppers across the country.","_n":"3858a","_k":"0340b4a9"},{"t":"Smaller harvests → lower bread prices","why":"Less supply usually means higher prices.","_n":"394ba","_k":"ff1377c2"},{"t":"Smaller harvests → milk prices double immediately","why":"Feed costs can matter later, but dairy prices are set through supply management.","_n":"3a4aa","_k":"5d41a801"},{"t":"Smaller harvests → no change for shoppers, because Canada imports its wheat","why":"Canada is a major wheat exporter.","_n":"3bc19","_k":"e947d273"}]},"b":{"prompt":"Floods cut the highway and rail links between BC’s interior and the Port of Vancouver. Which chain is most likely?","options":[{"t":"Shipments stall → shortages only in Nova Scotia","why":"The effects centre on BC and the routes through it.","_n":"3cc29","_k":"eb4b1275"},{"t":"Shipments stall → shortages in some BC stores and delayed exports of Prairie grain through the port","why":"The routes to the port are the bottleneck, so BC stores and exporters feel it first.","_n":"3dc39","_k":"cc764400"},{"t":"Nothing changes, because food travels by air","why":"Most food moves by truck, rail and ship.","_n":"3ec49","_k":"6fcc00d1"},{"t":"Prices fall everywhere","why":"Disrupted supply doesn’t lower prices.","_n":"3fc59","_k":"d4385153"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Which statement best fits the evidence on food miles?","options":[{"t":"For most foods, production causes more emissions than transport; air-freighted foods are the main exception","why":"For most foods, how they’re grown or raised produces more emissions than trucking or shipping them. Air freight is the big exception. Local has other benefits, but it isn’t automatically lower-carbon.","_n":"3gc69","_k":"892a76c2"},{"t":"Local food always has the lowest emissions","why":"For most foods, how they’re grown or raised produces more emissions than trucking or shipping them. Air freight is the big exception. Local has other benefits, but it isn’t automatically lower-carbon.","_n":"3hc79","_k":"a8a40ec3"},{"t":"Distance and emissions are unrelated in every case","why":"Air freight shows distance can matter a lot.","_n":"3ic89","_k":"fabc89d9"},{"t":"Transport is the main source of emissions for all foods","why":"For most foods, how they’re grown or raised produces more emissions than trucking or shipping them. Air freight is the big exception. Local has other benefits, but it isn’t automatically lower-carbon.","_n":"3jc99","_k":"54337483"}]},"b":{"prompt":"In January, a Toronto shopper compares strawberries trucked from California with strawberries air-freighted from overseas. Which likely has higher transport emissions?","options":[{"t":"Neither has any transport emissions","why":"Both use fuel.","_n":"3kca9","_k":"0b5d7696"},{"t":"They’re equal because both are imported","why":"The mode of transport matters.","_n":"3l479","_k":"07fcc81a"},{"t":"The trucked strawberries","why":"Trucks emit less per kilometre than planes.","_n":"3m469","_k":"91f57b5a"},{"t":"The air-freighted strawberries","why":"Flying food produces far more emissions per kilometre than trucking or shipping.","_n":"3n459","_k":"56e4b115"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Why are fresh vegetables usually much more expensive in a fly-in northern community than in Toronto?","options":[{"t":"Northern stores choose to charge more for no reason","why":"The costs are real; how they’re shared is a policy question.","_n":"3o449","_k":"a3487aaa"},{"t":"Vegetables are taxed more in the North","why":"That isn’t the main reason.","_n":"3p4b9","_k":"36207a1f"},{"t":"They must be flown or barged in, in small loads, with spoilage on long trips","why":"Transport costs and losses add up (links to module 19).","_n":"3q4a9","_k":"174788d6"},{"t":"Northern soils grow vegetables cheaply but stores import anyway","why":"The growing season is very short.","_n":"3r499","_k":"6d2c4bb2"}]},"b":{"prompt":"Why might an Ontario strawberry farm grow day-neutral varieties or use tunnels and greenhouses?","options":[{"t":"To make berries supply-managed","why":"Berries aren’t supply-managed.","_n":"3s489","_k":"782c9d6a"},{"t":"Because the berries become imported","why":"They’re still Ontario-grown.","_n":"3t4f9","_k":"3e04423f"},{"t":"To extend the season beyond June and July and sell local berries longer","why":"Day-neutral varieties, tunnels and greenhouses stretch the local season.","_n":"3u4e9","_k":"6dc63e86"},{"t":"To avoid needing any workers","why":"Picking still needs workers.","_n":"3vc5a","_k":"1af52b6b"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the clearest explanation of a trade-off of supply management?","options":[{"t":"“It gives dairy, poultry and egg farmers stable incomes and steady supply, but shoppers may pay more than in an open market.”","why":"It names a benefit and a cost, and says who gets each.","_n":"3wc6a","_k":"eea8e8fa"},{"t":"“It only helps importers.”","why":"Its main effect is on domestic farmers.","_n":"3xc3a","_k":"9a5cc25f"},{"t":"“It makes all food cheaper for everyone.”","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"3yc4a","_k":"3cccd425"},{"t":"“It has no effect on prices.”","why":"Cost-based pricing and import controls do affect prices.","_n":"3zc9a","_k":"3865b6fb"}]},"b":{"prompt":"Which sentence correctly describes supply management?","options":[{"t":"“Quotas match production to Canadian demand, and tariffs limit imports above set amounts.”","why":"It names two of supply management’s tools and what each one does.","_n":"40caa","_k":"a6248f2f"},{"t":"“It covers wheat, canola and beef.”","why":"Supply management covers dairy, poultry and eggs. It works through production quotas, import controls and cost-based farm prices. It keeps prices stable, not low.","_n":"41c7a","_k":"2838fe2b"},{"t":"“It was replaced by free trade in all products.”","why":"It still exists for dairy, poultry and eggs.","_n":"42c8a","_k":"93a3e183"},{"t":"“Quotas limit how much Canadians may eat.”","why":"Quotas limit production, not eating.","_n":"43cda","_k":"07d313ba"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which label wording is written correctly for cookies made in Canada from imported chocolate and Canadian flour?","options":[{"t":"“Product of Canada (mostly)”","why":"There is no “mostly” version.","_n":"44cea","_k":"37f39864"},{"t":"“Canadian-ish”","why":"Not a recognized claim.","_n":"45cba","_k":"bc007a56"},{"t":"“Made in Canada from domestic and imported ingredients”","why":"The flour is Canadian and the chocolate is imported, so the claim names both.","_n":"46caa","_k":"80dccc35"},{"t":"“Made in Canada” with no qualifier","why":"The claim must say which ingredients.","_n":"47cda","_k":"c7446616"}]},"b":{"prompt":"Which explanation of “Made in Canada from imported ingredients” is clearest?","options":[{"t":"“The food is lower quality.”","why":"Quality depends on handling, not on the passport.","_n":"48cca","_k":"a1d707ca"},{"t":"“The food was made or transformed here, but its main ingredients came from other countries.”","why":"That matches the rule: the last substantial change happened here, with imported main ingredients.","_n":"49c7a","_k":"2c41a9e0"},{"t":"“The food was only repackaged here.”","why":"A substantial change happened here.","_n":"4ac6a","_k":"e038ae2e"},{"t":"“The food was grown in Canada.”","why":"“Product of Canada” means all or virtually all of the major ingredients, processing and labour are Canadian. Food made here from imported ingredients must say so: “Made in Canada from imported ingredients”.","_n":"4bc9a","_k":"aa2aa7c6"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A school cafeteria wants a January lunch with mostly Canadian ingredients and all three plate sections. Which menu fits best?","options":[{"t":"Bread and maple syrup only","why":"Missing vegetables and fruits and protein foods.","_n":"4cc8a","_k":"5a545f6e"},{"t":"Chicken, brown rice, roasted potatoes and apple slices","why":"Only the rice is imported.","_n":"4dd3a","_k":"892cea08"},{"t":"Strawberries, lettuce and lentils","why":"Two winter imports.","_n":"4ed2a","_k":"c731bf5b"},{"t":"Lettuce salad, oranges and rice","why":"All three are imported in January.","_n":"4f59a","_k":"7ce49244"}]},"b":{"prompt":"A caterer wants an August menu that is entirely Canadian. Which works?","options":[{"t":"Lentils with brown rice","why":"Rice is imported.","_n":"4g5aa","_k":"fc80e09d"},{"t":"Oranges and brown rice","why":"Imported all year.","_n":"4h5ba","_k":"bcdb80c1"},{"t":"Salmon, lettuce and strawberry salad, and whole-wheat bread","why":"In August, all four are Canadian in this model.","_n":"4i5ca","_k":"6651567a"},{"t":"Chicken with oranges","why":"Oranges are imported.","_n":"4j55a","_k":"02dc147c"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A town of 8000 wants to improve its food security. Which plan uses local and global systems best?","options":[{"t":"Close the grocery store so everyone buys local","why":"That cuts winter availability.","_n":"4k56a","_k":"00f6a73e"},{"t":"Do nothing, because shocks never happen","why":"Floods and droughts do happen.","_n":"4l57a","_k":"c2fc7294"},{"t":"Support a farmers’ market and storage of local crops, while keeping grocery supply chains for winter variety","why":"It keeps the strengths of both systems, and diverse sources spread the risk.","_n":"4m58a","_k":"ad7e646d"},{"t":"Rely only on one distant warehouse","why":"A single source is fragile.","_n":"4n51a","_k":"8143b5e4"}]},"b":{"prompt":"A greenhouse operation can’t find enough local workers. Which response best balances food production and fairness?","options":[{"t":"Hire workers without contracts","why":"That’s unsafe and illegal.","_n":"4o52a","_k":"36078fce"},{"t":"Hire seasonal workers through an official program, with safe housing and the full rights the law requires","why":"Many farms, especially fruit, vegetable and greenhouse operations, depend on seasonal and temporary foreign workers. Their working conditions are part of the food system.","_n":"4pdfa","_k":"d74966b1"},{"t":"Import all vegetables instead","why":"That shifts the problem rather than solving it.","_n":"4qdea","_k":"c4e76148"},{"t":"Stop growing vegetables entirely","why":"That cuts supply.","_n":"4rdda","_k":"2d3b440e"}]}}]},"task":{"title":"Canadian plate, any season","summary":"Canadian plate, any season","statement":"\u003cp>Design a 5-ingredient meal for January or August that is mostly Canadian, balanced on the plate, spread across regions, and ready for a Prairie drought. There’s more than one answer.\u003c/p>\u003cp class=\"tiny muted\">Choose a month and 5 ingredients from the model table. The map and readout show origins, regions and plate sections.\u003c/p>","checks":["Mostly Canadian: at least 4 of the 5 ingredients are Canadian in the chosen month","Balanced plate: vegetables and fruits, whole grains and protein foods","Spread across Canada: the Canadian ingredients come from at least 3 different regions","Drought-ready: at most 1 ingredient comes from the Prairies"],"tips":["Check the month: lettuce and strawberries are imports in January.","Add the missing plate section.","Try a Pacific or Atlantic ingredient, like salmon, potatoes or wild blueberries.","Bread, oats, lentils and beef are all Prairie foods: keep just one."],"explainPrompt":"Explain how your meal balances being Canadian-grown, nutritious and resilient to a shock. What trade-off did you make?","vocab":"Use the words region, season, import and supply.","checkLabel":"Check my meal","success":"This meal meets every condition.","more":"There’s more than one answer. Can you find another?","validMsg":"Choose exactly 5 ingredients. You have {n}."},"cards":[["Food system","Farm → processing → distribution → retail → consumer, with waste and recovery at each step."],["The Prairies","Wheat, canola, oats, barley, pulses (lentils, peas) and beef. Main risk: drought."],["Central Canada","Dairy, poultry, eggs, pork, corn, soybeans, fruit and vegetables, greenhouses, maple syrup."],["Supply management","Dairy, poultry and eggs: quotas, import controls and cost-based farm prices, giving stable (not low) prices."],["Quota","A farm’s permitted share of production under supply management."],["“Product of Canada”","All or virtually all major ingredients, processing and labour are Canadian."],["“Made in Canada from … ingredients”","Made here; says whether the ingredients are domestic, imported or both."],["Seasonality","Fresh produce follows the growing season; storage, freezing, greenhouses and trade extend it."],["Food miles","Distance food travels. Usually a small part of its emissions, except air freight."],["Seasonal agricultural workers","Workers who come for the growing season, often through federal programs, vital to fruit, vegetable and greenhouse farms."],["Supply shock","A sudden drop in supply (drought, flood, disease, border delay) that raises prices and can cause shortages."],["Resilient food supply","Diverse sources (local, national, global), storage and transport routes that spread the risk."]]}};</script>
