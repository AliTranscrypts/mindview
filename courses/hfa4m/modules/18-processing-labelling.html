","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"22cb698c","content":{"id":"18-processing-labelling","kind":"topic","title":"Food processing and labelling","topic":"Food Processing and Labelling","readyTopic":"food processing and labelling","hero":{"headline":"The box is talking. Learn its language.","text":"The \u003cstrong>Nutrition Facts table\u003c/strong>, the \u003cstrong>ingredient list\u003c/strong> and the \u003cstrong>front-of-package symbol\u003c/strong> are regulated tools for comparing foods. \u003cstrong>Claims\u003c/strong> like “source of fibre” have legal meanings, while words like “natural” mean less than they seem. Learn to read all four, and the box can’t oversell itself.","fig":{"html":"\u003cdiv class=\"pl-hero\" id=\"pl-hero\">\u003c/div>","caption":""},"box":{"name":"Oat Rings","serving":"Per 3/4 cup (30 g)","rows":[{"t":"Calories","v":"120","cal":true},{"t":"Fat","v":"1.5 g","dv":2},{"t":"Saturated","v":"0.5 g","dv":3,"sub":true,"two":"+ Trans 0 g"},{"t":"Carbohydrate","v":"25 g"},{"t":"Fibre","v":"2 g","dv":7,"sub":true},{"t":"Sugars","v":"15 g","dv":15,"sub":true},{"t":"Protein","v":"2 g"},{"t":"Sodium","v":"115 mg","dv":5}],"ingredients":["Ingredients: Sugars (sugar,","glucose-fructose, honey),","whole grain oats, corn flour,","whole grain wheat, salt,","natural flavour, vitamin E."]},"aria":"A cereal box turns to its side panel. The Nutrition Facts table glows: the serving size, per 3/4 cup (30 g), lights up, then the % Daily Value column lights up row by row. Fat 2%, saturated and trans fat 3% and sodium 5% are tagged “a little”; sugars 15% is tagged “a lot”. The ingredient list scrolls up beside the table, and a magnifying-glass symbol reading “High in sugars” fades in on the front of the box.","caption":"Sugars: 15% DV, a lot. So the front says “High in sugars”."},"goals":["I can read a Nutrition Facts table, including serving size, Calories and %DV (5% a little, 15% a lot).","I can compare two products fairly by adjusting to the same amount.","I can use the ingredient list and front-of-package symbol to learn what’s in a food.","I can tell regulated nutrient-content and health claims apart from vague marketing words.","I can explain levels of food processing, fortification and additives, and how research changed Canadian food policy.","I can evaluate a functional food and plan a recipe that uses one."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003cp>For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Nutrient basics","goal":1,"prompt":"How many Calories does 1 g of fat provide?","options":[{"t":"0","why":"Fat is energy-dense.","_n":"0e12","_k":"02392e60"},{"t":"4","why":"That’s carbohydrate and protein.","_n":"1e22","_k":"bd3c4216"},{"t":"7","why":"That’s alcohol.","_n":"2e32","_k":"6c97add4"},{"t":"9","why":"Fat gives 9 kcal per gram; carbohydrate and protein give 4.","_n":"3e42","_k":"c4f78331"}],"hints":["Recall the 4-9-4 rule.","Carbohydrate 4, fat 9, protein 4.","9."]},{"id":"w2","skill":"Nutrient basics","goal":1,"prompt":"Which nutrient does Canada’s Food Guide suggest most Canadians get more of from whole grains, vegetables and fruits?","options":[{"t":"Added sugars","why":"The guide advises limiting them.","_n":"4e52","_k":"5e54f150"},{"t":"Saturated fat","why":"The guide advises limiting it.","_n":"5e62","_k":"e979dbbe"},{"t":"Sodium","why":"Most Canadians already eat more than recommended.","_n":"6e72","_k":"d5494ccc"},{"t":"Fibre","why":"Most Canadians eat less fibre than recommended.","_n":"7d82","_k":"946352ee"}],"hints":["Whole grains are rich in it.","It helps digestion.","Fibre."]},{"id":"w3","skill":"Proportional reasoning","goal":2,"prompt":"A 60 g serving has 8 g of sugars. How many grams are in 30 g?","options":[{"t":"16 g","why":"That doubles it.","_n":"8d92","_k":"5df85b87"},{"t":"4 g","why":"Half the amount, half the sugars.","_n":"9c40","_k":"f09096df"},{"t":"2 g","why":"That’s a quarter.","_n":"ac30","_k":"520ff7b3"},{"t":"8 g","why":"The amount changed.","_n":"bc20","_k":"453db245"}],"hints":["30 is what fraction of 60?","Half.","Half of 8 is 4."]},{"id":"w4","skill":"Proportional reasoning","goal":1,"prompt":"The Daily Value for sodium is 2300 mg. What %DV is 230 mg?","options":[{"t":"23%","why":"That treats 230 as a percent.","_n":"cc10","_k":"fb1cae17"},{"t":"10%","why":"230 ÷ 2300 = 0.10.","_n":"dc80","_k":"a8936712"},{"t":"50%","why":"1150 mg would be 50%.","_n":"ec70","_k":"e4483993"},{"t":"1%","why":"Check the decimal: 230 ÷ 2300 = 0.1.","_n":"fc60","_k":"0049756d"}],"hints":["%DV = amount ÷ DV × 100.","230 ÷ 2300.","10%."]},{"id":"w5","skill":"Food guide habits","goal":3,"prompt":"Which healthy eating habit does Canada’s Food Guide (2019) list?","options":[{"t":"Eat only organic food","why":"Not part of the guide.","_n":"gc50","_k":"088db87f"},{"t":"Avoid all packaged foods","why":"It advises limiting highly processed foods, not all packaged foods.","_n":"hbc0","_k":"9c09f235"},{"t":"Use food labels","why":"It’s one of the guide’s habits.","_n":"ibb0","_k":"1562fcc6"},{"t":"Count every Calorie","why":"The guide doesn’t recommend counting Calories.","_n":"jca0","_k":"4850d93e"}],"hints":["The guide lists habits such as cooking more often.","One involves reading packages.","Use food labels."]},{"id":"w6","skill":"Food guide habits","goal":5,"prompt":"Canada’s Food Guide advises limiting highly processed foods mainly because many are high in…","options":[{"t":"Fibre","why":"Fibre is a nutrient to get more of.","_n":"kcb0","_k":"66dd0dcc"},{"t":"Sodium, sugars or saturated fat","why":"Those are the nutrients of concern.","_n":"lc80","_k":"cd4a0bca"},{"t":"Water","why":"Not a concern.","_n":"mc90","_k":"1945a855"},{"t":"Vitamins","why":"Vitamins aren’t the concern.","_n":"nc60","_k":"ec8b1b95"}],"hints":["The front-of-package symbol flags three nutrients.","The same three.","Sodium, sugars, saturated fat."]}],"refreshers":{"Nutrient basics":"Carbohydrate 4, fat 9, protein 4 kcal per gram. Fibre is a carbohydrate most Canadians need more of.","Proportional reasoning":"To compare foods, scale to the same amount: multiply each value by (new amount ÷ serving size).","Food guide habits":"Use food labels; limit highly processed foods; be aware of food marketing."}}},"explore":{"heading":"Label lab","intro":"Tap any part of a label to see what it means. Compare two products fairly. Then move the sliders and watch the front-of-package symbol appear and disappear.","modes":[{"id":"read","t":"Read the label"},{"id":"compare","t":"Compare"},{"id":"design","t":"Symbol designer"}],"bases":[{"id":"serving","t":"Per serving shown"},{"id":"g30","t":"Per 30 g"}],"dv":{"na":2300,"sat":20,"sug":100,"fib":28,"ca":1300,"fe":18,"k":3400,"fat":75},"fop":15,"fibreClaims":[{"min":6,"t":"Very high source of fibre"},{"min":4,"t":"High source of fibre"},{"min":2,"t":"Source of fibre"}],"info":{"title":"Model reference values","dvLine":"\u003cstrong>Daily Values:\u003c/strong> sodium 2300 mg · saturated + trans fat 20 g · sugars 100 g · fibre 28 g · calcium 1300 mg · iron 18 mg · potassium 3400 mg · fat 75 g.","fopLine":"\u003cstrong>Front-of-package rule used in the model:\u003c/strong> the symbol appears when a nutrient is 15% DV or more per reference amount.","fullLine":"\u003cstrong>The full rule:\u003c/strong> 10% for foods with small reference amounts, 30% for main dishes, and exemptions such as whole vegetables and fruits and plain milk. Every model product here uses 15%.","fibreLine":"\u003cstrong>Fibre claims:\u003c/strong> source 2 g or more · high source 4 g or more · very high source 6 g or more, per reference amount and serving.","roundLine":"Labels round %DV to a whole number. The symbol test uses the exact amount: 345 mg of sodium is 15.0% of 2300 mg, but 340 mg is 14.8%.","calLine":"In the Symbol designer, Calories = 9 × (saturated + unsaturated fat) + 4 × (sugars + other carbohydrate) + 4 × protein. The model counts fibre within other carbohydrate."},"products":[{"id":"granola","t":"Granola bar","short":"granola bar","serving":"1 bar","cal":180,"sat":3.5,"unsat":4.5,"sug":16,"oc":9,"fib":2,"prot":2,"na":120},{"id":"cerealA","t":"Cereal A","short":"Cereal A","serving":"30 g","grams":30,"cal":120,"sat":0.5,"sug":6,"fib":4,"na":150},{"id":"cerealB","t":"Cereal B","short":"Cereal B","serving":"55 g","grams":55,"cal":220,"sat":1,"sug":11,"fib":5.5,"na":220},{"id":"soup","t":"Vegetable soup","short":"vegetable soup","serving":"250 mL","cal":100,"sat":0.5,"unsat":1.5,"sug":6,"oc":12,"fib":3,"prot":2.5,"na":600},{"id":"snack","t":"Snack bar","short":"snack bar","serving":"1 bar (30 g)","cal":115,"sat":1,"unsat":2,"sug":7,"oc":12,"fib":1,"prot":3,"na":90}],"designProducts":["soup","snack","granola"],"sliders":[{"id":"sat","t":"Saturated fat","unit":"g","min":0,"max":5,"step":0.5,"role":"fat"},{"id":"unsat","t":"Unsaturated fat","unit":"g","min":0,"max":8,"step":0.5,"role":"fat"},{"id":"sug","t":"Sugars","unit":"g","min":0,"max":20,"step":1,"role":"carb"},{"id":"oc","t":"Other carbohydrate","unit":"g","min":0,"max":20,"step":1,"role":"carb"},{"id":"fib","t":"Fibre","unit":"g","min":0,"max":8,"step":0.5,"role":"carb"},{"id":"na","t":"Sodium","unit":"mg","min":0,"max":900,"step":5,"role":"micro"}],"ingredients":[{"id":"oats","t":"whole grain oats","w":18,"mean":"First on the list, so it weighs the most. “Whole grain” tells you the whole kernel is used."},{"id":"sugars","t":"sugars (brown sugar, honey, glucose syrup)","w":16,"group":true,"mean":"Every sugar-based ingredient is grouped after “Sugars”, so the group sits second: the bar has more sugars than anything except oats."},{"id":"canola","t":"canola oil","w":3,"mean":"A mostly unsaturated oil."},{"id":"palm","t":"palm kernel oil","w":3,"mean":"A plant oil that is mostly saturated fat. It’s a big part of this bar’s saturated fat."},{"id":"almonds","t":"almonds","w":3,"mean":"A tree nut. That’s why the label says “Contains: almonds”."},{"id":"rice","t":"crisp rice","w":2,"mean":"Puffed rice adds crunch and carbohydrate."},{"id":"salt","t":"salt","w":0.4,"mean":"Salt is sodium chloride: most of this bar’s 120 mg of sodium comes from it."},{"id":"flavour","t":"natural flavour","w":0.2,"mean":"A flavouring made from natural sources. It’s used in tiny amounts, so it comes last."}],"contains":"Contains: almonds.","mayContain":"May contain: peanuts.","allergenMean":{"contains":"“Contains” lists the priority allergens that are ingredients in the food.","may":"“May contain” warns that the food could pick up traces of an allergen during production (cross-contact)."},"rowMean":{"serving":"Every number on the table is for this amount. Compare products by the same amount.","cal":"Energy in one serving: 9 × (3.5 + 4.5) + 4 × (16 + 9) + 4 × 2 = 72 + 100 + 8 = 180.","fat":"Total fat. Its %DV compares one serving with the 75 g Daily Value.","sat":"Saturated and trans fat are counted together. 15% DV or more triggers the “High in saturated fat” symbol.","carb":"Total carbohydrate: sugars plus other carbohydrate (fibre included).","fib":"A nutrient most Canadians need more of. 2 g or more allows a “source of fibre” claim.","sug":"All sugars, added and naturally occurring. 15% DV or more triggers the “High in sugars” symbol.","prot":"Protein has no %DV on the label.","na":"Sodium. 15% DV or more triggers the “High in sodium” symbol.","dv":"%DV answers “a little or a lot?”: 5% or less is a little, and 15% or more is a lot."},"readLabels":{"serving":"Serving size","cal":"Calories","sat":"Saturated + trans fat","sug":"Sugars","fib":"Fibre","na":"Sodium","sym":"Front-of-package symbol","claim":"Fibre claim allowed"},"levels":{"little":"a little","lot":"a lot","between":"in between"},"nutr":{"sat":"saturated fat","sug":"sugars","na":"sodium"},"symNone":"None","claimNone":"None","tapHint":"Tap a line on the label or an ingredient to see what it means.","barTitle":"Ingredients by weight","predIntro":"Make a prediction first. Then the label lab will show you what really happens.","predictions":[{"id":"p1","prompt":"What’s the fastest way to tell whether this bar has a lot of sugars?","options":[{"t":"Look at the Calories","_n":"oc70","_k":"19cd9fa5"},{"t":"Look at the brand name","_n":"pc40","_k":"a86228dd"},{"t":"Look at the %DV for sugars (16%)","_n":"qc50","_k":"2e7f7072"},{"t":"Count the sugar names in the ingredients","_n":"rc20","_k":"c6a33715"}],"explain":"%DV puts the grams on a little-to-a-lot scale for you."},{"id":"p2","prompt":"Cereal B shows 5.5 g fibre and Cereal A 4 g. Switch to “per 30 g”. Which cereal has more fibre now?","options":[{"t":"They’re equal","_n":"sc30","_k":"4b50fee5"},{"t":"Can’t tell","_n":"t300","_k":"de3704ad"},{"t":"Cereal A","_n":"u2f0","_k":"b60cca7e"},{"t":"Cereal B","_n":"v320","_k":"d649aa69"}],"explain":"B’s serving is almost twice as big. Per 30 g, A has more fibre and B less sodium (120 vs 150 mg)."},{"id":"p3","prompt":"Will the soup carry a “High in sodium” symbol?","options":[{"t":"Yes","_n":"w310","_k":"e0197f68"},{"t":"Only if it’s organic","_n":"x340","_k":"5282efd5"},{"t":"Only if it’s canned","_n":"y330","_k":"7e0e44bb"},{"t":"No","_n":"z360","_k":"94ded449"}],"explain":"26% is well over the 15% threshold. Soups are a common source of sodium."},{"id":"p4","prompt":"Which single ingredient is present in the greatest amount?","options":[{"t":"Brown sugar","_n":"10350","_k":"5dc9837b"},{"t":"Salt","_n":"11380","_k":"5d5481c7"},{"t":"Almonds","_n":"12370","_k":"82b5407f"},{"t":"Whole grain oats","_n":"13361","_k":"485d123f"}],"explain":"Ingredients are listed by weight, and all the sugar-based ingredients are grouped together after “Sugars”, so you can see their combined place in the list."}],"chalIntro":"Use the Symbol designer, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"Symbol designer, vegetable soup. Reformulate the sodium so the “High in sodium” symbol just disappears, keeping as much sodium as possible (for flavour).","why":"340 mg is 14.8% DV: under 15%, so no symbol, and 5 mg more would bring it back.","hints":["15% of 2300 is 345.","You need to be just under 345, in 5 mg steps.","340 mg."]},{"id":"tc2","goal":[1,4],"prompt":"Symbol designer, snack bar. Set the fibre so the bar can claim “source of fibre” but \u003cstrong>not\u003c/strong> “high source of fibre”.","why":"From 2 g up to (but not including) 4 g of fibre, the bar qualifies as a “source of fibre” only.","hints":["Check the thresholds in the info box.","Source ≥ 2 g; high source ≥ 4 g.","Anything from 2 to 3.5 g."]},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Reformulate the model granola bar so it carries \u003cstrong>no\u003c/strong> “High in” symbol, while keeping its Calories between 170 and 190 (the same snack size as before). Protein stays at 2 g and sodium at 120 mg.","why":"Food companies reformulate like this all the time, and the front-of-package rule pushes them to.","hints":["Cut saturated fat to 2.5 g and sugars to 14 g first.","That removes 9 + 8 = 17 Calories. You need to add 7 to 27 back.","Add 1 g unsaturated fat (+9) and 1 g other carbohydrate (+4): 176."]}],"msgs":{"pickSoup":"Switch to the Symbol designer and pick the vegetable soup.","pickSnack":"Switch to the Symbol designer and pick the snack bar.","pickGranola":"Switch to the Symbol designer and pick the granola bar.","na345":"345 ÷ 2300 = 15.0%: the symbol still shows.","naOver":"{v} ÷ 2300 is {p}%: still 15% or more, so the symbol still shows.","naUnder":"The symbol’s gone, but you could keep a little more sodium.","fibLow":"Below the 2 g threshold for “source”.","fibHigh":"That’s “high source” (4 g or more).","keepNa":"Keep sodium at 120 mg.","sat":"{v} ÷ 20 = {p}%: the symbol stays.","sug15":"15% exactly still triggers the symbol.","sugOver":"{v} g of sugars is {v}% DV: the symbol stays.","calLow":"Too small now. Add back some oats (other carbohydrate) or nuts (unsaturated fat).","calHigh":"Too big now: keep the Calories between 170 and 190."},"blocks":[{"title":"What the label lab shows","html":"\u003cul>\u003cli>%DV turns grams into “a little or a lot”.\u003c/li>\u003cli>Serving sizes must match before you compare.\u003c/li>\u003cli>The front-of-package symbol is the same 15% rule, applied for you.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"claims","name":"Claims","heading":"Claim check","intro":"The label lab covered the numbers. Now look at the \u003cstrong>words\u003c/strong>: claims and processing labels, and the \u003cstrong>policy\u003c/strong> behind them. Then turn a functional food into a recipe plan.","stations":[{"id":"decode","t":"1. Decode the claim"},{"id":"func","t":"2. Functional foods"},{"id":"process","t":"3. Processing and policy"},{"id":"kitchen","t":"4. Kitchen card"}],"decode":{"title":"Station 1: decode the claim","ask":"Tap a claim, then tap the bin it belongs in. Open \u003cstrong>Check it with data\u003c/strong> to read each claim’s definition and source.","bins":[{"id":"nc","t":"Regulated nutrient-content claim"},{"id":"hc","t":"Regulated health claim"},{"id":"mk","t":"Marketing word (no specific standard)"},{"id":"term","t":"Specific regulated term with conditions"}],"chips":[{"id":"fibre","t":"“Source of fibre”","_a":"EFwAQA==","def":"A nutrient-content claim with a legal threshold: at least 2 g of fibre per reference amount and serving.","ref":"nc","wrong":"It names a nutrient and has a legal threshold (2 g or more), so it’s a nutrient-content claim."},{"id":"sodium","t":"“Low in sodium”","_a":"EFwAQA==","def":"A nutrient-content claim with a legal threshold: 140 mg of sodium or less per reference amount and serving.","ref":"nc","wrong":"It names a nutrient and has a legal threshold (140 mg or less), so it’s a nutrient-content claim."},{"id":"oat","t":"“Oat fibre helps reduce cholesterol”","_a":"EFoAQA==","def":"A health claim: it links a food to health, so it must use approved wording, and the food must provide enough oat fibre per serving.","ref":"hc","wrong":"It links a food to health (cholesterol), so it’s a health claim with approved wording."},{"id":"natural","t":"“Natural”","_a":"EEYGEFsb","def":"A term with CFIA conditions: no added vitamins or minerals, artificial flavours or food additives, and not significantly altered. It says nothing about sugar or salt.","ref":"nat","wrong":"“Natural” has CFIA conditions. “Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more than one grain, not necessarily whole grain."},{"id":"multi","t":"“Multigrain”","_a":"EEYGEFsb","def":"A descriptive word: more than one grain, not necessarily whole grain.","ref":"comp","wrong":"“Multigrain” has a specific meaning: more than one grain, not necessarily whole grain."},{"id":"whole","t":"“Wholesome”","_a":"EF8IQA==","def":"A marketing word: there’s no specific standard behind it.","ref":"","wrong":"No rule defines “wholesome”: it’s a marketing word."}],"refs":{"nc":"Canadian Food Inspection Agency. (n.d.). \u003ci>Nutrient content claims\u003c/i>. Government of Canada.","hc":"Canadian Food Inspection Agency. (n.d.). \u003ci>Health claims on food labels\u003c/i>. Government of Canada.","nat":"Canadian Food Inspection Agency. (n.d.). \u003ci>Method of production claims on food labels\u003c/i>. Government of Canada.","comp":"Canadian Food Inspection Agency. (n.d.). \u003ci>Composition and quality claims\u003c/i>. Government of Canada.","none":"No standard to cite: it’s a marketing word."},"msgs":{"data":"Check it with data","pick":"Tap a claim first, then tap a bin.","done":"All six claims decoded. Regulated claims have rules behind them; marketing words don’t."}},"func":{"title":"Station 2: functional food evaluator","ask":"For each product, rate the claim, the evidence and the cost. Then compare your ratings with the model verdict.","note":"Practice models. Your teacher may add real packages (credited).","rows":[{"id":"claim","t":"Approved claim?","opts":[{"id":"yes","t":"Yes"},{"id":"no","t":"No"}]},{"id":"ev","t":"Evidence strength","opts":[{"id":"strong","t":"Strong"},{"id":"mixed","t":"Mixed"},{"id":"weak","t":"Weak"}]},{"id":"cost","t":"Cost per serving vs the plain alternative","opts":[{"id":"more","t":"Costs more"},{"id":"same","t":"About the same"},{"id":"less","t":"Costs less"}]}],"benefit":"Who might benefit? (your notes)","cards":[{"id":"oat","t":"Oat cereal with an approved cholesterol claim","cost":"$0.30","alt":"Store-brand corn cereal","altCost":"$0.30","_a":"SRAADldQVUEIEBoHRRsUQVdEQVgUSkwRXVwEQBobWwxBRkFYFEpZDlcQHg==","verdict":"Approved claim and strong evidence, at a typical amount per serving."},{"id":"yog","t":"Plain yogurt with live bacterial cultures","cost":"$0.85","alt":"A glass of milk","altCost":"$0.40","_a":"SRAADldQVUEIEA0NFBUaBkQQWUBbUEAGVhBPQFVWSxcQCEEPWUtdQU8=","verdict":"Mixed: benefits vary by strain or amount."},{"id":"egg","t":"Omega-3 eggs","cost":"$1.00 for 2 eggs","alt":"Regular eggs","altCost":"$0.50 for 2 eggs","_a":"SRAADldQVUEIEA0NFBUaBkQQWUBbUEAGVhBPQFVWSxcQCEEPWUtdQU8=","verdict":"Mixed: benefits vary by strain or amount."},{"id":"flax","t":"Ground flaxseed","cost":"$0.10 per tablespoon","alt":"Wheat bran","altCost":"$0.10 per tablespoon","_a":"SRAADldQVUEIEA0NFBUaBkQQWUBbUEAGVhBPQFVWSxcQCEERV1RdQU8=","verdict":"Fibre and plant omega-3; mixed evidence for specific claims."},{"id":"juice","t":"“Immunity boost” juice with added vitamin C","cost":"$1.50","alt":"An orange","altCost":"$0.60","_a":"SRAADldQVUEIEA0NFBUaBkQQWUBBXFkIEB5BAVlKTEEIEA4NRFwaHg==","verdict":"Weak, with no approved claim. High in sugars too."}],"msgs":{"verdict":"Model verdict","match":"Your ratings match the model.","differ":"The model rates {n} differently: {list}.","done":"All five products rated. A functional claim is only as good as its evidence and the amount per serving.","fill":"Rate all three rows to see the model verdict."}},"process":{"title":"Station 3: processing spectrum and policy timeline","sortAsk":"Part 1. Tap a food, then tap its group.","groups":[{"id":"g1","t":"Unprocessed or minimally processed","sub":"washed, frozen, dried, pasteurized"},{"id":"g2","t":"Processed culinary ingredients","sub":"pressed, refined or extracted"},{"id":"g3","t":"Processed foods","sub":"a few ingredients, often with salt, sugar or oil"},{"id":"g4","t":"Ultra-processed foods","sub":"industrial formulas, many ingredients"}],"foods":[{"id":"apple","t":"An apple","_a":"EFVSQA=="},{"id":"peas","t":"Frozen peas","_a":"EFVSQA=="},{"id":"milk","t":"Plain milk","_a":"EFVSQA=="},{"id":"oats","t":"Rolled oats","_a":"EFVSQA=="},{"id":"canola","t":"Canola oil","_a":"EFVRQA=="},{"id":"sugar","t":"Sugar","_a":"EFVRQA=="},{"id":"salt","t":"Salt","_a":"EFVRQA=="},{"id":"beans","t":"Canned beans with salt","_a":"EFVQQA=="},{"id":"cheese","t":"Cheese","_a":"EFVQQA=="},{"id":"bread","t":"Simple bread","_a":"EFVQQA=="},{"id":"soda","t":"Soft drinks","_a":"EFVXQA=="},{"id":"cakes","t":"Packaged snack cakes","_a":"EFVXQA=="},{"id":"noodles","t":"Flavoured instant noodles","_a":"EFVXQA=="}],"why":{"g1":"It’s a whole food, only washed, frozen, dried or pasteurized.","g2":"It’s pressed, refined or extracted from a food and used in cooking.","g3":"It’s made from a few ingredients, often with added salt, sugar or oil (canning, cheese-making, baking).","g4":"It’s an industrial formula with many ingredients, often with additives and flavours you wouldn’t use at home."},"binFb":{"g1":"That group is for whole foods that are only washed, frozen, dried or pasteurized.","g2":"That group is for oils, sugar and salt: pressed, refined or extracted from foods and used in cooking.","g3":"That group is for foods made from a few ingredients, often with added salt, sugar or oil.","g4":"That group is for industrial formulas with many ingredients, often with additives and flavours."},"critique":{"title":"Critique card","html":"NOVA groups foods by processing, not nutrients. Some ultra-processed foods (e.g. some fortified whole-grain cereals) can fit a healthy pattern, and the definitions are debated."},"tlAsk":"Part 2. Tap an event, then tap its year on the timeline. Then link the event to the research behind it.","years":[{"id":"y1998","t":"1998"},{"id":"y2005","t":"Mid-2000s"},{"id":"y2016","t":"2016–2022"},{"id":"y2018","t":"2018"},{"id":"y2026","t":"2026"}],"events":[{"id":"folic","t":"Mandatory folic acid fortification of white flour","_a":"SRAaQAwbQVILC1tAGhtKQQgQDRZSG0U=","why":"Research linked folate to neural tube development, so white flour was fortified with folic acid."},{"id":"nft","t":"Mandatory Nutrition Facts tables","_a":"SRAaQAwbQVECAlZAGhtKQQgQCgxQVhoe","why":"Shoppers needed the same nutrition information on every package to compare foods."},{"id":"pho","t":"Ban on partially hydrogenated oils","_a":"SRAaQAwbQVECA1tAGhtKQQgQCwdXS0xBTw==","why":"Industrial trans fat raises LDL cholesterol and the risk of heart disease."},{"id":"update","t":"Updated Nutrition Facts table","_a":"SRAaQAwbQVECA1VAGhtKQQgQEBdRWEoQEE8=","why":"The update added a %DV for sugars and grouped sugar-based ingredients in the ingredient list."},{"id":"fop","t":"Front-of-package symbol mandatory","_a":"SRAaQAwbQVECAFVAGhtKQQgQEA1SUE0OEE8=","why":"Most Canadians eat more sodium than recommended; the symbol flags foods high in sodium, sugars or saturated fat."}],"research":[{"id":"ntd","t":"Neural tube defects"},{"id":"info","t":"Consumer information"},{"id":"heart","t":"Heart disease"},{"id":"sugars","t":"Sugars awareness"},{"id":"sodium","t":"High-sodium diets"}],"msgs":{"pickFood":"Tap a food first.","pickEvent":"Tap an event first.","sortDone":"All 13 foods sorted.","tlDone":"Timeline complete: research shaped every one of these rules.","yearWrong":"Not that year. Look at the order: fortification came first and the front-of-package symbol last.","researchWrong":"Not quite. Which health problem or need did this rule respond to?","link":"Research behind it:"}},"kitchen":{"title":"Station 4: kitchen card","dish":"Overnight oats with ground flax and berries","ask":"Adapt the plan, then save your kitchen card. Prepare it in the class kitchen or at home with an adult.","servings":[1,2,4],"liquids":[{"id":"milk","t":"Milk"},{"id":"soy","t":"Fortified unsweetened soy beverage"}],"gf":"Oats labelled gluten-free","measure":[{"n":1,"d":3,"u":"cup","t":"rolled oats"},{"n":1,"d":1,"u":"tbsp","t":"ground flax"},{"n":1,"d":2,"u":"cup","t":"{liquid}"},{"n":1,"d":2,"u":"cup","t":"blueberries"}],"method":["Mix the oats, flax and {liquid} in a jar or covered container.","Top with the blueberries.","Mix and refrigerate overnight, at 4 °C or colder."],"notes":["Celiac disease: use oats labelled gluten-free.","Dairy-free: swap the dairy for a fortified soy beverage.","Functional ingredients: oats (oat fibre) and ground flax (fibre and plant omega-3)."],"safety":"Eat within 2 days.","prepare":"Prepare in the class kitchen or at home with an adult."},"blocks":[{"title":"Sources to check (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Canadian Food Inspection Agency. (n.d.). \u003ci>Health claims on food labels\u003c/i>. Government of Canada.\u003c/li>\u003cli>Canadian Food Inspection Agency. (n.d.). \u003ci>Method of production claims on food labels\u003c/i>. Government of Canada.\u003c/li>\u003cli>Canadian Food Inspection Agency. (n.d.). \u003ci>Nutrient content claims\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Front-of-package nutrition symbol labelling\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Claims quick check","summary":"Claims quick check","items":[{"id":"q1","goal":4,"prompt":"A bread says “multigrain”. What do you know for sure?","choices":[{"t":"It’s high in fibre","fb":"Check the ingredients for “whole grain”.","_n":"14371","_k":"887c9ea2"},{"t":"It’s whole grain","fb":"Check the ingredients for “whole grain”.","_n":"15381","_k":"a8249150"},{"t":"It’s organic","fb":"Check the ingredients for “whole grain”.","_n":"16391","_k":"db9888d2"},{"t":"It contains more than one grain","fb":"Right. That’s all “multigrain” guarantees. Check the ingredients for “whole grain”.","_n":"17321","_k":"29b7559f"}]},{"id":"q2","goal":4,"prompt":"Which is a regulated nutrient-content claim?","choices":[{"t":"Wholesome","fb":"The regulated claim has a legal threshold (≥ 2 g).","_n":"18331","_k":"a12ec0d2"},{"t":"Source of fibre","fb":"Right. It has a legal threshold (≥ 2 g).","_n":"19341","_k":"6e216f6b"},{"t":"Farm-fresh taste","fb":"The regulated claim has a legal threshold (≥ 2 g).","_n":"1a351","_k":"7f153f3d"},{"t":"Goodness inside","fb":"The regulated claim has a legal threshold (≥ 2 g).","_n":"1b3e1","_k":"3068071a"}]},{"id":"q3","goal":5,"prompt":"Why did Canada add folic acid to white flour?","choices":[{"t":"To lower Calories","fb":"Research linked folate to neural tube development.","_n":"1c3f1","_k":"228922cc"},{"t":"To reduce neural tube defects in babies","fb":"Right. Research linked folate to neural tube development.","_n":"1d3c1","_k":"aa5fc931"},{"t":"To preserve flour","fb":"Research linked folate to neural tube development.","_n":"1e3b1","_k":"cd14f00e"},{"t":"To add flavour","fb":"Research linked folate to neural tube development.","_n":"1f3a1","_k":"0f47e17a"}]},{"id":"q4","goal":5,"prompt":"Frozen peas are…","choices":[{"t":"Always unhealthy","fb":"Freezing preserves food without adding much.","_n":"1g391","_k":"c03d93f7"},{"t":"Ultra-processed","fb":"Freezing preserves food without adding much.","_n":"1h381","_k":"1149dc51"},{"t":"Minimally processed","fb":"Right. Freezing preserves food without adding much.","_n":"1i371","_k":"fe8f0348"},{"t":"Not food","fb":"Freezing preserves food without adding much.","_n":"1j361","_k":"1a7b6969"}]}]}},"practice":{"activities":[{"id":"detective","type":"custom","title":"Label detective","summary":"Label detective","goal":[1,2],"instruction":"Work out each %DV or scaled amount. Use the Daily Values in the box.","how":"Type a number (the % sign is optional), then press Check.","use":" Daily Values: sodium 2300 mg · saturated + trans fat 20 g · sugars 100 g · fibre 28 g · calcium 1300 mg · iron 18 mg.","items":[{"id":"l1","goal":1,"prompt":"Sodium 690 mg. %DV?","fields":[{"label":"%DV","unit":"%"}],"_a":"SRANF1tKGllpaVBSGgoIPm9P","display":"30%","wrong":[{"match":[6.9],"fb":"Divide by 2300, then × 100."}],"fb":"Divide by 2300, then × 100.","why":"690 ÷ 2300 = 0.3, so 30%: a lot.","hints":["%DV = amount ÷ DV × 100.","The sodium DV is 2300 mg: 690 ÷ 2300.","690 ÷ 2300 = 0.3, so 30%."]},{"id":"l2","goal":1,"prompt":"Sugars 9 g. %DV?","fields":[{"label":"%DV","unit":"%"}],"_a":"SRANF1tKGllpaVpOD2RlHg==","display":"9%","fb":"The sugars DV is 100 g, so grams = %DV here.","why":"9 ÷ 100 = 0.09, so 9%.","hints":["%DV = amount ÷ DV × 100.","The sugars DV is 100 g.","9 ÷ 100 = 0.09, so 9%."]},{"id":"l3","goal":1,"prompt":"Fibre 7 g. %DV?","fields":[{"label":"%DV","unit":"%"}],"_a":"SRANF1tKGllpaVFXGgsNPm9P","display":"25%","fb":"7 ÷ 28 = 0.25.","why":"7 ÷ 28 = 0.25, so 25%: a lot.","hints":["%DV = amount ÷ DV × 100.","The fibre DV is 28 g: 7 ÷ 28.","7 ÷ 28 = 0.25, so 25%."]},{"id":"l4","goal":1,"prompt":"Calcium 260 mg. %DV?","fields":[{"label":"%DV","unit":"%"}],"_a":"SRANF1tKGllpaVFSGgsIPm9P","display":"20%","fb":"260 ÷ 1300 = 0.2.","why":"260 ÷ 1300 = 0.2, so 20%.","hints":["%DV = amount ÷ DV × 100.","The calcium DV is 1300 mg: 260 ÷ 1300.","260 ÷ 1300 = 0.2, so 20%."]},{"id":"l5","goal":1,"prompt":"Saturated + trans fat 1 g. %DV? A little or a lot?","fields":[{"label":"%DV","unit":"%"}],"chips":[{"id":"little","t":"A little"},{"id":"between","t":"In between"},{"id":"lot","t":"A lot"}],"chipLabel":"A little or a lot?","_a":"SRANF1tKGllpaVZOA2RlTxBRCwtGGwJBXlsXFlpcGh4=","display":"5%, a little","fb":"1 ÷ 20 = 5%.","chipFb":"5% or less is a little.","why":"1 ÷ 20 = 0.05, so 5%: a little (5% or less).","hints":["%DV = amount ÷ DV × 100.","The saturated + trans fat DV is 20 g: 1 ÷ 20.","1 ÷ 20 = 0.05, so 5%: a little."]},{"id":"l6","goal":1,"prompt":"Iron 3.6 mg. %DV?","fields":[{"label":"%DV","unit":"%"}],"_a":"SRANF1tKGllpaVFSGgsIPm9P","display":"20%","fb":"3.6 ÷ 18 = 0.2.","why":"3.6 ÷ 18 = 0.2, so 20%.","hints":["%DV = amount ÷ DV × 100.","The iron DV is 18 mg: 3.6 ÷ 18.","3.6 ÷ 18 = 0.2, so 20%."]},{"id":"l7","goal":2,"prompt":"A yogurt’s serving is 175 g with 12 g sugars. Sugars per 100 g?","fields":[{"label":"Sugars per 100 g","unit":"g"}],"_a":"SRANF1tKGllpaVVMDhUPPm9P","display":"about 6.9 g","fb":"12 × 100 ÷ 175.","why":"12 × 100 ÷ 175 ≈ 6.9 g.","hints":["Scale from 175 g down to 100 g.","Multiply 12 by 100 ÷ 175.","12 × 100 ÷ 175 ≈ 6.9 g."]},{"id":"l8","goal":2,"prompt":"Chips: 150 Calories per 25 g. Crackers: 130 Calories per 30 g. Calories per 50 g for each?","fields":[{"label":"Chips, per 50 g","unit":"Calories"},{"label":"Crackers, per 50 g","unit":"Calories"}],"_a":"SRANF1tKGllpaVBSBhULUwJvTzkECA1PAABTP2tE","display":"chips 300, crackers about 217","wrong":[{"match":[150,130],"fb":"Scale both to the same amount."}],"fb":"Scale both to the same amount.","why":"Chips: 150 × 2 = 300. Crackers: 130 × 5/3 ≈ 216.7.","hints":["50 g is how many servings of each?","Chips × 2; crackers × 5/3.","300 and 216.7."]}]},{"id":"claims","type":"mc","title":"Processing and claims","summary":"Processing and claims","star":true,"goal":[3,4,5,6],"instruction":"Six label puzzles. Choose the best answer. The ★ items are non-routine; the last two go beyond the Final Check.","items":[{"id":"f1","goal":4,"prompt":"Apple juice says “no added sugar” and shows sugars 24 g (24% DV) per 250 mL. Which conclusion is best?","options":[{"t":"The label must be wrong","why":"Both can be true: nothing was added, but juice is high in its own sugars.","_n":"1k351","_k":"4038b727"},{"t":"24% of the juice is sugar","why":"%DV compares the amount in one serving to a daily reference value. 15% sodium means 15% of the Daily Value, not 15% of the food.","_n":"1l441","_k":"e1575a8c"},{"t":"It’s still a lot of sugars, naturally occurring","why":"Foods like juice can be high in naturally occurring sugars. Check the sugars line and its %DV.","_n":"1m431","_k":"65b8c081"},{"t":"It’s low in sugars","why":"“No added sugar” isn’t “low in sugars”.","_n":"1nc21","_k":"bcaa5c39"}]},{"id":"f2","goal":3,"prompt":"A cereal’s ingredients begin: corn flour, sugars (sugar, glucose-fructose, honey), whole grain oats… What does the order tell you?","options":[{"t":"Corn flour is the smallest ingredient","why":"The first ingredient weighs the most.","_n":"1oc31","_k":"4bac9b91"},{"t":"The ingredients are in alphabetical order","why":"Ingredients are listed by weight, not alphabetically.","_n":"1pc01","_k":"3373f251"},{"t":"The sugars group weighs more than the oats","why":"Ingredients are listed by weight, and sugar-based ingredients are now grouped together after “Sugars”.","_n":"1qc11","_k":"05316cae"},{"t":"Oats are the main ingredient","why":"Ingredients are listed by weight; oats come after the sugars group.","_n":"1rc61","_k":"f05b6bf1"}]},{"id":"f3","goal":4,"prompt":"★ A product claims “natural” and contains added vitamin C. Does the claim fit?","options":[{"t":"That’s fine","why":"Added vitamins conflict with “natural”.","_n":"1sc71","_k":"1a7460a9"},{"t":"It fits, because vitamin C is healthy","why":"Health isn’t the test: “natural” means no added vitamins, minerals, additives or artificial flavours.","_n":"1tc41","_k":"00d6fc19"},{"t":"It fits only if the product is organic","why":"Organic is a separate claim.","_n":"1uc51","_k":"94c325c9"},{"t":"The claim doesn’t fit CFIA’s guidance","why":"“Natural” means no added vitamins or minerals, so added vitamin C conflicts with it.","_n":"1vba1","_k":"6de598fe"}]},{"id":"f4","goal":2,"prompt":"★ Two soups: A has 700 mg sodium per 250 mL; B has 490 mg per 175 mL. Which has less sodium per 250 mL?","options":[{"t":"They’re equal","why":"B is 700 mg per 250 mL too (490 × 250 ÷ 175 = 700).","_n":"1wbb1","_k":"d9d52ae0"},{"t":"A has less","why":"Scale B to 250 mL before you compare: 490 × 250 ÷ 175.","_n":"1xc81","_k":"eaefc8d1"},{"t":"Can’t compare","why":"Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"1yc71","_k":"aa0051bb"},{"t":"B has less","why":"B only looks lower because its serving is smaller.","_n":"1zca1","_k":"0cb9b98e"}],"hints":["Scale B to 250 mL.","490 × 250 ÷ 175.","700 mg: equal."]},{"id":"f5","goal":5,"prompt":"★ A company removes partially hydrogenated oil and replaces it with palm oil. What should a label reader check?","options":[{"t":"Only the Calories","why":"Swapping one oil for another changes the type of fat more than the Calories.","_n":"20c91","_k":"ecdb8a05"},{"t":"Nothing, it’s trans-fat free","why":"Palm oil is high in saturated fat.","_n":"21c41","_k":"e1641be1"},{"t":"The saturated + trans fat line and its %DV","why":"Palm oil is high in saturated fat, so the saturated + trans fat line can rise even as trans fat disappears.","_n":"22c31","_k":"2c853abe"},{"t":"The sodium line","why":"Oils don’t add sodium. Check the fat lines.","_n":"23c61","_k":"bf9905f5"}]},{"id":"f6","goal":2,"prompt":"★ (Inquiry) You’ll compare the sodium in 5 brands of canned soup. Which method is fairest?","options":[{"t":"Compare one brand’s %DV with another brand’s milligrams","why":"Use the same measure and the same amount for every brand.","_n":"24c51","_k":"4336c665"},{"t":"Compare the numbers per serving as printed","why":"Servings differ. Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"25c01","_k":"05559b79"},{"t":"Taste each soup and rank them by saltiness","why":"Taste isn’t a reliable measure of sodium.","_n":"26bf1","_k":"d3dd5d13"},{"t":"Convert each brand’s sodium to the same amount (e.g. per 250 mL) and record the brand, date and source; then rank","why":"The same amount for every brand makes the comparison fair, and the records let someone check it.","_n":"27adf","_k":"baf41603"}]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Sapna","goal":[1,2,4],"how":"","instruction":"Sapna made one mistake in each label analysis. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Which cereal has more fibre: Cereal B (5.5 g per 55 g) or Cereal A (4 g per 30 g)?","steps":["“Cereal B lists 5.5 g fibre; Cereal A lists 4 g.”","“5.5 is more than 4, so Cereal B has more fibre.”","“I’ll buy Cereal B for fibre.”"],"_a":"Aw==","stepFb":["Step 1 reads the labels correctly.","","Step 3 follows step 2."],"fixes":[{"t":"“Compare Calories instead.”","why":"Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"28aef","_k":"3fbc3fee"},{"t":"“Add the two servings.”","why":"Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"29aff","_k":"56d3b948"},{"t":"“Scale to the same amount: per 30 g, B has 3 g and A has 4 g, so A has more.”","why":"Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"2ab0f","_k":"bda801e0"},{"t":"Step 2 is correct.","why":"Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"2bb1f","_k":"875455b5"}],"hints":["Are the servings the same size?","55 g vs 30 g.","The fix: scale to the same amount. Per 30 g, B has 3 g and A has 4 g, so A has more."]},{"id":"e2","goal":1,"task":"A soup shows sodium 30% DV. What does that mean?","steps":["“%DV compares to a daily reference value.”","“So 30% of the soup’s weight is sodium.”","“That’s why it tastes salty.”"],"_a":"Aw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"“One serving provides 30% of the Daily Value for sodium (690 mg of 2300 mg), which is a lot (15% or more).”","why":"%DV compares the amount in one serving to a daily reference value. 15% sodium means 15% of the Daily Value, not 15% of the food.","_n":"2cb2f","_k":"630522c0"},{"t":"Step 2 is correct.","why":"%DV compares the amount in one serving to a daily reference value. 15% sodium means 15% of the Daily Value, not 15% of the food.","_n":"2db3f","_k":"8d8f50f1"},{"t":"“30% means the soup is 30% water.”","why":"%DV compares the amount in one serving to a daily reference value. 15% sodium means 15% of the Daily Value, not 15% of the food.","_n":"2eb4f","_k":"53b6bb13"},{"t":"“30% means 30 g of sodium.”","why":"%DV compares the amount in one serving to a daily reference value. 15% sodium means 15% of the Daily Value, not 15% of the food.","_n":"2fb5f","_k":"0603f7ed"}],"hints":["Percent of what?","Of the Daily Value.","The fix: one serving provides 30% of the Daily Value for sodium (690 mg of 2300 mg), which is a lot."]},{"id":"e3","goal":4,"task":"A cracker box says “Natural multigrain”. Is it a whole-grain, low-sodium choice?","steps":["“The box says ‘natural’.”","“‘Natural’ and ‘multigrain’ together mean whole grain and healthy.”","“So I don’t need to check the label.”"],"_a":"Aw==","stepFb":["Step 1 reads the box.","","Step 3 follows step 2."],"fixes":[{"t":"“Neither word means whole grain or low sodium. Check the ingredient list for ‘whole grain’ and the sodium %DV.”","why":"“Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more than one grain, not necessarily whole grain.","_n":"2gb6f","_k":"438c50a0"},{"t":"“‘Multigrain’ means gluten-free.”","why":"“Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more than one grain, not necessarily whole grain.","_n":"2hb3f","_k":"97a2bef5"},{"t":"“‘Natural’ means organic.”","why":"“Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more than one grain, not necessarily whole grain.","_n":"2ib2f","_k":"e2838e29"},{"t":"Step 2 is correct.","why":"“Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more than one grain, not necessarily whole grain.","_n":"2jb1f","_k":"8fdb2f5d"}],"hints":["What does “multigrain” guarantee?","Only more than one grain.","The fix: neither word means whole grain or low sodium. Check the ingredient list for “whole grain” and the sodium %DV."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003cp>For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"Which label trick surprised you most: serving sizes, sugar names, or claims like “natural”?"},{"id":"j2","q":"In your own words, explain what “15% DV” tells you and why it’s useful."},{"id":"j3","q":"Explain to a friend how to compare two cereals fairly in under a minute."},{"id":"j4","q":"Which claim or label part are you still unsure about? How will you check it next time you shop?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"On a Nutrition Facts table, what does “5% DV” mean?","options":[{"t":"It’s a lot of that nutrient","why":"15% or more is a lot.","_n":"2kb0f","_k":"e978adc9"},{"t":"5% of the food’s weight is that nutrient","why":"%DV compares the amount in one serving to a daily reference value. 15% sodium means 15% of the Daily Value, not 15% of the food.","_n":"2lb7f","_k":"9f31596d"},{"t":"One serving gives 5% of the Daily Value for that nutrient: a little","why":"5% or less is a little.","_n":"2mb6f","_k":"f6930db6"},{"t":"You should eat 5 servings","why":"%DV isn’t a serving count.","_n":"2nb5f","_k":"401aa655"}]},"b":{"prompt":"Which %DV means “a lot” of a nutrient?","options":[{"t":"5% or less","why":"That’s a little.","_n":"2ob4f","_k":"c12019e9"},{"t":"15% or more","why":"15% or more is a lot; 5% or less is a little.","_n":"2pbbf","_k":"fb26daf3"},{"t":"Any number with a % sign","why":"The guide is 5% and 15%.","_n":"2qbaf","_k":"9d0c9d06"},{"t":"Exactly 50%","why":"The guideline is 15%.","_n":"2r0df","_k":"0a37616a"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Sodium is 460 mg per serving, and the DV is 2300 mg. What is the %DV?","options":[{"t":"46%","why":"That reads mg as a percent.","_n":"2s0cf","_k":"b1d5550c"},{"t":"5%","why":"That would be 115 mg.","_n":"2t0ff","_k":"34854586"},{"t":"2%","why":"Check the decimal.","_n":"2u0ef","_k":"ab92669c"},{"t":"20%","why":"460 ÷ 2300 = 0.2.","_n":"2v11f","_k":"62cc376b"}]},"b":{"prompt":"Fibre is 7 g per serving, and the DV is 28 g. What is the %DV?","options":[{"t":"7%","why":"That reads grams as a percent.","_n":"2w10f","_k":"c5181eec"},{"t":"25%","why":"7 ÷ 28 = 0.25.","_n":"2x13f","_k":"337ca103"},{"t":"4%","why":"Invert the division.","_n":"2y12f","_k":"71387004"},{"t":"50%","why":"That would be 14 g.","_n":"2z15f","_k":"c8e94500"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"How are ingredients ordered on a Canadian ingredient list?","options":[{"t":"Alphabetically","why":"By weight.","_n":"3014f","_k":"aebfc2e0"},{"t":"From least to greatest","why":"Greatest first.","_n":"31a7f","_k":"1cb0a916"},{"t":"From greatest to least by weight, with sugar-based ingredients grouped together after “Sugars”","why":"Ingredients are listed by weight, and sugar-based ingredients are now grouped together after “Sugars”.","_n":"32a8f","_k":"8199667d"},{"t":"Healthiest first","why":"By weight, not by health.","_n":"33a5f","_k":"5d130372"}]},"b":{"prompt":"Which nutrients does the front-of-package symbol flag?","options":[{"t":"Vitamins A and C","why":"Not part of the symbol.","_n":"34a6f","_k":"4ef50e36"},{"t":"Fibre, protein and iron","why":"Those are nutrients to get enough of.","_n":"35a3f","_k":"5e55f1f6"},{"t":"Calories only","why":"It flags three nutrients of concern.","_n":"36a4f","_k":"43fcc952"},{"t":"Saturated fat, sugars and sodium","why":"It flags the three nutrients of concern.","_n":"37a1f","_k":"ada80b6d"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Crackers X: 120 mg sodium per 20 g. Crackers Y: 150 mg per 30 g. Which has less sodium per 60 g?","options":[{"t":"Can’t compare different servings","why":"Scale to the same amount.","_n":"38a2f","_k":"39e58d16"},{"t":"Y (300 mg vs 360 mg)","why":"Per 60 g: X is 120 × 3 = 360 mg; Y is 150 × 2 = 300 mg.","_n":"399ff","_k":"a049df10"},{"t":"X, because 120 is less than 150","why":"Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"3aa0f","_k":"3d65da15"},{"t":"They’re equal","why":"Scale both: 360 vs 300.","_n":"3ba1f","_k":"928b862f"}]},"b":{"prompt":"Yogurt P: 12 g sugars per 175 g. Yogurt Q: 10 g sugars per 125 g. Which has less sugars per 100 g?","options":[{"t":"P (about 6.9 g vs 8 g)","why":"Per 100 g: P is 12 × 100 ÷ 175 ≈ 6.9 g; Q is 10 × 100 ÷ 125 = 8 g.","_n":"3ca0f","_k":"188b5808"},{"t":"Q, because 10 is less than 12","why":"Different serving sizes make raw numbers misleading. Convert both to the same amount first.","_n":"3d9ff","_k":"41ae7e9e"},{"t":"Can’t compare","why":"Scale to 100 g.","_n":"3e9ef","_k":"29c89ca0"},{"t":"They’re equal","why":"Scale them.","_n":"3fa5f","_k":"939b8d8f"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A juice says “no added sugar” and shows sugars 22% DV. Which conclusion is best?","options":[{"t":"It has no added sugar, but it’s still high in naturally occurring sugars","why":"Foods like juice can be high in naturally occurring sugars. Check the sugars line and its %DV.","_n":"3ga4f","_k":"a71d0f90"},{"t":"It’s low in sugars","why":"Foods like juice can be high in naturally occurring sugars. Check the sugars line and its %DV.","_n":"3ha3f","_k":"89845153"},{"t":"22% means 22 g of added sugar","why":"%DV compares the amount in one serving to a daily reference value. 15% sodium means 15% of the Daily Value, not 15% of the food.","_n":"3ia2f","_k":"94c3c1cf"},{"t":"The label must be wrong","why":"Both can be true.","_n":"3j99f","_k":"41dc8467"}]},"b":{"prompt":"A cereal says “source of fibre”. What is guaranteed?","options":[{"t":"It has 15% DV fibre","why":"“Source” is a gram threshold, not 15%.","_n":"3k98f","_k":"af7cd253"},{"t":"At least 2 g of fibre per reference amount and serving","why":"“Source of fibre” is a nutrient-content claim with a 2 g threshold.","_n":"3l9bf","_k":"562460bd"},{"t":"It’s whole grain","why":"“Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more than one grain, not necessarily whole grain.","_n":"3m9cf","_k":"00490616"},{"t":"It’s low in sugars","why":"Fibre claims say nothing about sugars.","_n":"3n9df","_k":"a67343e2"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A soup (250 mL) has 330 mg sodium. With the 15% rule, will it show “High in sodium”?","options":[{"t":"No: 330 ÷ 2300 is about 14%, under 15%","why":"The cut-off is 345 mg (15% of 2300 mg).","_n":"3o9ef","_k":"9764ccb9"},{"t":"Yes: any soup with sodium shows the symbol","why":"Only at 15% or more.","_n":"3p9ff","_k":"d4f7ec4a"},{"t":"Yes: 330 is over 300","why":"The cut-off is 345 mg.","_n":"3qa0f","_k":"a1552d05"},{"t":"No: soups are exempt","why":"Soups aren’t exempt.","_n":"3ra1f","_k":"2d9d1edf"}]},"b":{"prompt":"A snack bar has 3 g of saturated + trans fat (DV 20 g). Will it show “High in saturated fat”?","options":[{"t":"Only if it has trans fat","why":"Saturated and trans fat are counted together.","_n":"3sa2f","_k":"b5eb9959"},{"t":"No: fat is never flagged","why":"Saturated fat is one of the three.","_n":"3t93f","_k":"ad64075f"},{"t":"Yes: 3 ÷ 20 = 15%, which meets the threshold","why":"At or above 15% triggers the symbol.","_n":"3u94f","_k":"8054cb9a"},{"t":"No: 15% is the limit, so it must go over","why":"At or above 15% triggers it.","_n":"3va60","_k":"f440b26a"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the clearest explanation of why Canada’s Food Guide says to limit highly processed foods?","options":[{"t":"“Many highly processed foods are high in sodium, sugars or saturated fat, which most Canadians already eat too much of; processing itself isn’t automatically harmful.”","why":"It gives the reason and avoids treating all processing as harmful.","_n":"3wa50","_k":"ef7a36a7"},{"t":"“All processed food is poison.”","why":"Freezing, canning and fortifying are processing too. Additives are approved by Health Canada. The concern is with highly processed foods high in sodium, sugars or saturated fat.","_n":"3xa80","_k":"95f8ae6e"},{"t":"“Because additives are illegal.”","why":"Approved additives are legal.","_n":"3ya70","_k":"6049facc"},{"t":"“Because frozen vegetables lose all nutrients.”","why":"Freezing preserves most nutrients.","_n":"3za20","_k":"ecb217f2"}]},"b":{"prompt":"Which sentence correctly explains fortification?","options":[{"t":"“Adding nutrients to foods, such as vitamin D to milk or folic acid to white flour, to prevent deficiencies in the population.”","why":"It defines fortification and gives two Canadian examples.","_n":"40a10","_k":"8713e599"},{"t":"“Removing nutrients to make food last longer.”","why":"That’s the opposite.","_n":"41a40","_k":"03595ac6"},{"t":"“Adding sugar for taste.”","why":"That isn’t fortification.","_n":"42a30","_k":"c4715792"},{"t":"“A kind of organic certification.”","why":"Unrelated.","_n":"439e0","_k":"c46c51d1"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the most accurate description of the claim “multigrain”?","options":[{"t":"“The product is whole grain.”","why":"“Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more than one grain, not necessarily whole grain.","_n":"449d0","_k":"4f88432f"},{"t":"“The product is high in fibre.”","why":"“Natural” means no added nutrients, additives or artificial flavours; it says nothing about sugar or salt. “Multigrain” means more th
