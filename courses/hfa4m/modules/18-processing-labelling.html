.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 18: hero (cereal box turning to its side panel), Label lab (F3: Nutrition Facts card, ingredient list, comparison
   table, Symbol designer with sliders and the front-of-package symbol), Claim check stations, Label detective, Label-smart snack.
   Plan §5: the label renders as black text on a white card in both themes (as real labels do), so the card uses fixed
   --pl-* tokens defined for light and dark alike. Nutrient roles (course plan §4): fat teal, carbohydrate orange, sodium
   (a mineral) violet; always with words. Red and green only in feedback. */
:root{--pl-card:#FFFFFF;--pl-cink:#111111;--pl-crule:#3A3A3A;--pl-chi:rgba(244,218,78,.6);--pl-lot:#FFE1C4;--pl-lotb:#A84C05;--pl-little:#DDE5FF;--pl-littleb:#2343C4}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--pl-card:#FFFFFF;--pl-cink:#111111;--pl-crule:#3A3A3A;--pl-chi:rgba(244,218,78,.6);--pl-lot:#FFE1C4;--pl-lotb:#A84C05;--pl-little:#DDE5FF;--pl-littleb:#2343C4}
}
:root[data-theme="dark"]{--pl-card:#FFFFFF;--pl-cink:#111111;--pl-crule:#3A3A3A;--pl-chi:rgba(244,218,78,.6);--pl-lot:#FFE1C4;--pl-lotb:#A84C05;--pl-little:#DDE5FF;--pl-littleb:#2343C4}

/* radio groups (from HFA4U 16) */
.pl-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.pl-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem;margin:0}
.pl-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.pl-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.pl-chipset button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.pl-chipset button:hover:not(:disabled){border-color:var(--pen)}
.pl-chipset button[aria-checked="true"],.pl-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.pl-chipset button:disabled{opacity:.8}
.pl-h4{margin:0 0 6px;font-size:1rem}
.pl-h5{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl-stok{font-weight:700}

/* switch (from HFA4U 14) */
.pl-sw{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:40px;font-size:.92rem;max-width:100%}
.pl-sw:hover{border-color:var(--pen)}
.pl-swt{position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;border:2px solid var(--ink-2);background:var(--paper)}
.pl-swt i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.pl-sw[aria-checked="true"]{border-color:var(--ink)}
.pl-sw[aria-checked="true"] .pl-swt{background:var(--hi);border-color:var(--ink)}
.pl-sw[aria-checked="true"] .pl-swt i{left:18px;background:var(--ink)}
.pl-swl{flex:1 1 auto;min-width:0}
.pl-swv{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-2);min-width:1.8rem;text-align:right}
.pl-sw[aria-checked="true"] .pl-swv{color:var(--ink)}

/* hero */
.pl-hero{width:100%;max-width:440px;margin:0 auto}
.pl-hsvg{display:block;width:100%;height:auto}
.pl-hsvg text{font-family:var(--font-ui)}
.pl-btop{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.pl-bedge{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.pl-bfront{fill:var(--plate-grain-soft);stroke:var(--ink);stroke-width:1.6}
.pl-bside{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.pl-hname{fill:var(--ink);font-weight:700;font-size:25px}
.pl-hsub{fill:var(--ink-2);font-size:12px}
.pl-bowl{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.pl-ring{fill:none;stroke:var(--plate-grain);stroke-width:4.5}
.pl-hfop{fill:var(--pl-card);stroke:var(--pl-cink);stroke-width:3}
.pl-hmag{fill:none;stroke:var(--pl-cink);stroke-width:4.5;stroke-linecap:round}
.pl-hfh{fill:var(--pl-cink);font-weight:700;font-size:17px}
.pl-hfn{fill:var(--pl-cink);font-weight:700;font-size:19px}
.pl-hcard{fill:var(--pl-card);stroke:var(--pl-cink);stroke-width:1.8}
.pl-hcard.glow{stroke-width:2.2}
.pl-htitle{fill:var(--pl-cink);font-weight:700;font-size:21px}
.pl-hhi{fill:var(--pl-chi)}
.pl-hrow{fill:var(--pl-cink);font-size:12.5px}
.pl-hcal{fill:var(--pl-cink);font-size:15px}
.pl-hb{font-weight:700}
.pl-hdvh{fill:var(--pl-cink);font-weight:700;font-size:10.5px}
.pl-hdv{fill:var(--pl-cink);font-weight:700;font-size:12.5px}
.pl-hl{stroke:var(--pl-crule);stroke-width:.8}
.pl-hl.thick{stroke:var(--pl-cink);stroke-width:3}
.pl-htag.lot{fill:var(--pl-lot);stroke:var(--pl-lotb);stroke-width:1.2}
.pl-htag.little{fill:var(--pl-little);stroke:var(--pl-littleb);stroke-width:1.2}
.pl-htagt{fill:var(--pl-cink);font-weight:700;font-size:10.5px}
.pl-hfoot{fill:var(--pl-cink);font-size:10px}
.pl-hfoot.on{font-weight:700}
.pl-hing{fill:var(--pl-cink);font-size:11.5px}
.pl-cap{font:700 1.02rem/1.35 var(--font-ui)!important}

/* the label card: black on white in both themes */
.pl-card{background:var(--pl-card);color:var(--pl-cink);border:1px solid var(--rule);border-radius:6px;padding:8px;max-width:22rem;box-shadow:0 0 0 3px var(--sheet)}
.pl-ct{margin:0 0 4px;font-weight:700;font-size:.95rem}
table.pl-nft{border-collapse:collapse;width:100%;border:2px solid var(--pl-cink);background:var(--pl-card);color:var(--pl-cink);font:400 .95rem/1.3 var(--font-ui)}
.pl-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.3rem;padding:4px 8px 2px;border:2px solid var(--pl-cink);border-bottom:0;background:var(--pl-card);color:var(--pl-cink)}
.pl-nft th,.pl-nft td{padding:3px 8px;border-bottom:1px solid var(--pl-crule);text-align:left;vertical-align:middle;color:var(--pl-cink)}
.pl-nft td{text-align:right;font-weight:700;white-space:nowrap}
.pl-nft thead th{font-size:.84rem;font-weight:700;border-bottom:4px solid var(--pl-cink)}
.pl-nft thead th + th{text-align:right}
.pl-nft tbody th{font-weight:700}
.pl-nft tr.cal th{font-size:1.15rem}
.pl-nft tr.cal th,.pl-nft tr.cal td{border-bottom:4px solid var(--pl-cink)}
.pl-nft tr.sub th{padding-left:1.4em;font-weight:400}
.pl-nft tr.hi th,.pl-nft tr.hi td,.pl-nft tr.sel th,.pl-nft tr.sel td{background:var(--pl-chi)}
.pl-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0}
.pl-rb{all:unset;box-sizing:border-box;display:inline-block;cursor:pointer;min-height:26px;padding:1px 4px;margin:-1px -4px;border-radius:4px;color:var(--pl-cink);font:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.pl-rb:hover{background:var(--pl-chi)}
.pl-rb:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.pl-rb[aria-pressed="true"]{text-decoration:none}
.pl-tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:0 .5em;margin-right:6px;vertical-align:.08em;color:var(--pl-cink)}
.pl-tag.lot{background:var(--pl-lot);border:1px solid var(--pl-lotb)}
.pl-tag.little{background:var(--pl-little);border:1px solid var(--pl-littleb)}
.pl-dvq{color:var(--pl-crule)}

/* front-of-package symbol (schematic) */
.pl-fop{display:inline-flex;align-items:center;gap:8px;background:var(--pl-card);color:var(--pl-cink);border:3px solid var(--pl-cink);border-radius:6px;padding:6px 12px 6px 8px;min-height:64px;min-width:9rem}
.pl-mag{width:40px;height:40px;flex:0 0 auto;fill:none;stroke:var(--pl-cink);stroke-width:4;stroke-linecap:round}
.pl-fw{display:flex;flex-direction:column;line-height:1.15}
.pl-fh{font-weight:700;font-size:.95rem}
.pl-fn{font-weight:700;font-size:1.05rem}
.pl-fop.none{border:2px dashed var(--ink-2);background:transparent;color:var(--ink-2);font-size:.88rem;font-weight:700;justify-content:center;text-align:center}
.pl-fop.q{border:2px dashed var(--ink-2);background:transparent;justify-content:center}
.pl-fq{font-size:1.6rem;font-weight:700;color:var(--ink-2)}
.pl-symw{min-width:0}
.pl-symt{margin:0 0 4px;font-size:.85rem;font-weight:700;color:var(--ink-2)}

/* Explore layout */
.pl-fs{border:0;margin:0;padding:0;min-width:0}
.pl-lab{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 22px;align-items:start;margin-top:8px}
.pl-main,.pl-side{min-width:0}
.pl-side{border-left:1.5px solid var(--rule);padding-left:18px}
.pl-mean{min-height:5.5em;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);margin-bottom:12px}
.pl-mean p{margin:0 0 .4em}
.pl-mean p:last-child{margin:0}
.pl-mdv{font-size:1.02rem}
.pl-read > div{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);gap:2px 12px;align-items:baseline;padding:6px 0}
.pl-read > div:first-child{padding-top:6px}
.pl-read dd{margin:0}
.pl-read div.pl-rhi{background:var(--hi-soft);border-radius:4px}
.pl-ingc{margin-top:12px;max-width:22rem}
.pl-ingt{margin:0 0 6px;font-size:.92rem;line-height:1.6}
.pl-ingt:last-child{margin:0}
.pl-ib{all:unset;box-sizing:border-box;cursor:pointer;border-radius:4px;padding:0 3px;margin:0 -1px;color:var(--pl-cink);text-decoration:underline dotted;text-underline-offset:3px;min-height:24px;display:inline}
.pl-ib:hover{background:var(--pl-chi)}
.pl-ib:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.pl-ib[aria-pressed="true"],.pl-ib.hi{background:var(--pl-chi);text-decoration:none}
.pl-bars{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);max-width:28rem}
.pl-bt{margin:0 0 8px;font-weight:700;font-size:.92rem}
.pl-bar{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr);gap:4px 10px;align-items:center;margin:0 0 5px;font-size:.84rem}
.pl-bl{overflow-wrap:anywhere}
.pl-btr{display:block;height:14px;background:var(--paper);border-radius:3px;overflow:hidden}
.pl-bf{display:block;height:100%;background:var(--nu-carb-soft);border:1.5px solid var(--ink-2);border-radius:3px}
.pl-bar.grp .pl-bf{background:var(--nu-carb);border-color:var(--nu-carb)}
.pl-bar.grp .pl-bl,.pl-bar.top .pl-bl{font-weight:700}
.pl-bar.top .pl-bf{background:var(--plate-grain-soft);border-color:var(--plate-grain)}
.pl-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:8px 0 12px}
.pl-two .pl-card{max-width:none}
.pl-sm2 .pl-nft{font-size:.86rem}
.pl-sm2 .pl-nft caption{font-size:1.1rem}
.pl-asp{margin:14px 0 0}
.pl-lab.read{grid-template-columns:minmax(0,23rem) minmax(0,1fr)}
.pl-ctab{border-collapse:collapse;width:100%;font-size:.92rem}
.pl-ctab caption{text-align:left;font-weight:700;padding:0 0 6px}
.pl-ctab th,.pl-ctab td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:left}
.pl-ctab td{white-space:nowrap}
.pl-ctab tr.hi th,.pl-ctab tr.hi td{background:var(--hi-soft)}
.pl-ctab td.pl-more{font-weight:700}
.pl-warn{margin:8px 0 0;font-weight:700;font-size:.92rem}
.pl-dz{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:start;margin:4px 0 10px}
.pl-sls{border:0;margin:0 0 10px;padding:0;min-width:0}
.pl-sls legend{padding:0}
.pl-sl{margin:0 0 8px}
.pl-slt{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.pl-slt label{font-weight:700}
.pl-slt output{font-weight:700;white-space:nowrap}
.pl-range{width:100%;min-height:28px;margin:2px 0 0}
.pl-sl.fat .pl-range{accent-color:var(--nu-fat)}
.pl-sl.carb .pl-range{accent-color:var(--nu-carb)}
.pl-sl.micro .pl-range{accent-color:var(--nu-micro)}
.pl-sl.fat label{border-left:4px solid var(--nu-fat);padding-left:6px}
.pl-sl.carb label{border-left:4px solid var(--nu-carb);padding-left:6px}
.pl-sl.micro label{border-left:4px solid var(--nu-micro);padding-left:6px}
.pl-info{margin-top:14px}
.pl-infol{margin:10px 0 0;padding-left:1.1em}
.pl-infol li{margin:0 0 6px}

/* Part 3 */
.pl-st{margin-top:8px}
.pl-tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pl-tile{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .8em;min-height:40px;font-size:.95rem;text-align:left;max-width:100%}
.pl-tile:hover{border-color:var(--pen)}
.pl-tile[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);font-weight:700}
.pl-bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.pl-bin{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:2px dashed var(--rule);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 12px;min-height:88px;min-width:0}
.pl-bin.ready{border-color:var(--ink-2);border-style:solid}
.pl-bin:hover{border-color:var(--pen)}
.pl-bin small{font-size:.8rem;color:var(--ink-2)}
.pl-binin{display:flex;flex-wrap:wrap;gap:6px}
.pl-chipin{display:inline-block;border:1.5px solid var(--ink-2);background:var(--sheet);border-radius:999px;padding:0 .6em;font-size:.86rem}
.pl-gn{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;border:1.5px solid var(--ink);font-size:.8rem}
.pl-data{margin-top:10px}
.pl-defs{margin:10px 0 0}
.pl-defs dt{font-weight:700;margin-top:8px}
.pl-defs dd{margin:2px 0 0 0}
.pl-defs dd p{margin:0 0 2px}
.pl-fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr));gap:12px;margin:10px 0}
.pl-fcard{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 12px;min-width:0}
.pl-fcard .pl-rgw{margin:0 0 6px}
.pl-fcard .pl-rgl{min-width:0;width:100%}
.pl-pn{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:.8rem}
.pl-cost{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.88rem;margin:0 0 8px}
.pl-ben label{display:block;font-size:.85rem;font-weight:700;color:var(--ink-2);margin:4px 0 2px}
.pl-verd{margin-top:8px}
.pl-verd p{margin:0 0 .3em}
.pl-tlask{margin-top:18px}
.pl-tl{list-style:none;margin:10px 0;padding:0 0 0 18px;border-left:3px solid var(--ink)}
.pl-tli{position:relative;display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:6px 12px;align-items:start;margin:0 0 10px}
.pl-tli::before{content:"";position:absolute;left:-26px;top:.45em;width:13px;height:13px;border-radius:50%;background:var(--sheet);border:3px solid var(--ink)}
.pl-tli.full::before{background:var(--ink)}
.pl-yr{font-weight:700;padding-top:6px}
.pl-slot{border:2px dashed var(--rule);background:var(--paper);color:var(--ink-2);border-radius:8px;padding:.4em .8em;min-height:40px;text-align:left;width:100%}
.pl-slot.ready{border-color:var(--ink-2);border-style:solid;color:var(--ink)}
.pl-slot:hover{border-color:var(--pen)}
.pl-tev{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px 10px;min-width:0}
.pl-tevt{margin:0 0 6px}
.pl-tr{margin:0;font-size:.92rem}
.pl-kl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px 20px;align-items:start;margin-top:8px}
.pl-kctl{display:grid;gap:4px}
.pl-kcard{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 14px;min-width:0}
.pl-kcard h5{margin:10px 0 4px;font-size:.9rem}
.pl-kcard ul,.pl-kcard ol{margin:0;padding-left:1.2em}
.pl-kcard p{margin:0 0 .3em}
.pl-kct{font-weight:700;font-size:1.02rem}

/* Label detective */
.pl-lchips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}

/* Label-smart snack */
.pl-conds{margin:6px 0 10px;padding-left:1.3em}
.pl-conds li{margin:0 0 3px}
.pl-snacks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr));gap:6px}
.pl-snack{display:grid;grid-template-columns:1.2em minmax(0,1fr);gap:0 6px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:44px;min-width:0}
.pl-snack:hover{border-color:var(--pen)}
.pl-snack[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.pl-sm{grid-row:span 2;font-weight:700}
.pl-sn{font-weight:700;font-size:.92rem}
.pl-sp{font-weight:400}
.pl-sv{font-size:.78rem;color:inherit;opacity:.85}
.pl-brow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px}
.pl-tray2{margin:0 0 8px}
.pl-tkread{margin-top:6px}
@media (min-width:821px) and (min-height:760px){
  .design > #task-pv{position:sticky;top:170px;align-self:start}
}

@media (max-width:760px){
  .pl-lab,.pl-lab.read{grid-template-columns:minmax(0,1fr)}
  .pl-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .pl-kl{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .pl-two{grid-template-columns:minmax(0,1fr)}
  .pl-bins{grid-template-columns:minmax(0,1fr)}
  .pl-dz{grid-template-columns:minmax(0,1fr)}
  .pl-card{max-width:none}
  .pl-bar{grid-template-columns:minmax(0,8.5rem) minmax(0,1fr)}
  .pl-tli{grid-template-columns:minmax(0,1fr)}
  .pl-yr{padding-top:0}
}
