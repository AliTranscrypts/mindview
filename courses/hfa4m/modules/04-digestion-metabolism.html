.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 04: hero (forkful → blood and lymph), Journey of a meal (tract, stops, molecules, villus, clock, tray), challenge chips,
   Conditions stations, Trace it, task. Role colours from hfa4u.css: carbohydrate --nu-carb, protein --nu-protein, fat --nu-fat,
   micronutrients --nu-micro, water --nu-water; blood routes --pen, lymph routes teal (--nu-fat) and dashed. Red and green stay
   reserved for feedback. */
/* radio groups (from HFA4U 03) */
.dg-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.dg-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.6rem}
.dg-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.dg-rg.seg button:disabled{opacity:.45}
.dg-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.dg-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.dg-chipset button:not(:disabled):hover{border-color:var(--pen)}
.dg-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.dg-chipset button[aria-checked="true"] .dg-tk{color:inherit}
.dg-chipset button.k-carb{box-shadow:inset 4px 0 0 var(--nu-carb)}
.dg-chipset button.k-protein{box-shadow:inset 4px 0 0 var(--nu-protein)}
.dg-chipset button.k-fat{box-shadow:inset 4px 0 0 var(--nu-fat)}
.dg-chipset button.k-fibre{box-shadow:inset 4px 0 0 var(--nu-carb)}
.dg-chipset button.k-micro{box-shadow:inset 4px 0 0 var(--nu-micro)}
.dg-chipset button.k-water{box-shadow:inset 4px 0 0 var(--nu-water)}

/* S1 diagram explorer (from SBI4U 03) */
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs,.s1-tags{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1px dashed transparent;border-radius:5px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}
.s1-b[aria-pressed="true"]{border-color:transparent;background:transparent}
.s1-tag{position:absolute;transform:translate(0,-50%);font:700 .72rem/1.3 var(--font-ui);background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.05em .55em;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.s1-tag.r{transform:translate(-100%,-50%)}
.s1-tag.c{transform:translate(-50%,-50%)}
.s1-tag.dg-help{border-style:dashed}
.s1-tag.dg-cond{background:var(--info-bg)}
.s1-tag.dg-lym{border:1.5px dashed var(--nu-fat);color:var(--nu-fat)}
.s1-tag.dg-bld{border-color:var(--pen);color:var(--pen)}

/* explorer layout */
.dg-ctl > div[hidden]{display:none}
.dg-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 26px;align-items:start;margin-top:8px}
.dg-main,.dg-side{min-width:0}
.dg-side{border-left:1.5px solid var(--rule);padding-left:18px}
.dg-tractw{max-width:430px;margin:0 auto}
.dg-h4{margin:14px 0 6px;font-size:1rem}
.dg-side > .dg-h4:first-child{margin-top:0}
.dg-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--ink-2);margin:8px 0 0}
.dg-legend span{display:inline-flex;align-items:center;gap:4px}
.dg-mini{width:18px;height:18px;flex:none;overflow:visible}
.dg-lsw{display:inline-block;width:18px;height:0;border-top:3px solid var(--pen)}
.dg-lsw.l{border-top:3px dashed var(--nu-fat)}
.dg-onote{margin:6px 0 0}
.dg-onote:empty{display:none}
.dg-stops{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px;padding:2px}
.dg-stop{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.22em .8em .22em .3em;font-size:.88rem;min-height:34px;white-space:nowrap;flex:none}
.dg-stop:hover{border-color:var(--pen)}
.dg-stop .dg-sn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rule);font-weight:700;font-size:.78rem}
.dg-stop.on{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.dg-stop.on .dg-sn{background:var(--ink);color:var(--sheet)}
.dg-mols{display:grid}
.dg-mol{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px dashed var(--rule)}
.dg-mol p{margin:0;font-size:.88rem;line-height:1.35}
.dg-mrow{width:190px;height:26px;flex:none;overflow:visible}
.dg-bmr{background:var(--info-bg);border-radius:6px;padding:8px 12px;margin:8px 0}
.dg-bmr p{margin:0;font-size:.92rem}
.dg-clockw{display:flex;gap:12px;align-items:flex-start;margin:14px 0 4px}
.dg-clock{width:64px;height:64px;flex:none}
.dg-clockw p{margin:0 0 4px}
.dg-cface{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.dg-ctick{stroke:var(--ink-2);stroke-width:1.4}
.dg-chh{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.dg-cmh{stroke:var(--pen);stroke-width:2;stroke-linecap:round}
.dg-cpin{fill:var(--ink)}
.dg-ff{font-size:.78rem;color:var(--ink-2);white-space:nowrap}
.dg-vil{display:block;width:100%;height:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.dg-vcap{margin:4px 0 0}
.dg-tray .dg-tis{display:flex;flex-direction:column;gap:4px}
.dg-ti{display:flex;align-items:center;gap:6px;font-size:.88rem;line-height:1.3}
.dg-rt{font-style:normal;font-size:.72rem;font-weight:700;border-radius:999px;padding:0 .5em;border:1.5px solid var(--pen);color:var(--pen);white-space:nowrap}
.dg-rt.l{border-color:var(--nu-fat);color:var(--nu-fat);border-style:dashed}
.dg-tray p{margin:4px 0 0}

/* tokens */
.dg-c{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:1.5}
.dg-c.gal{fill:var(--sheet)}
.dg-cdot{fill:var(--nu-carb)}
.dg-cl{stroke:var(--nu-carb);stroke-width:1.8}
.dg-p{fill:var(--nu-protein);stroke:var(--ink);stroke-width:.7}
.dg-pl{stroke:var(--nu-protein);stroke-width:1.8}
.dg-fd{fill:var(--nu-fat-soft);stroke:var(--nu-fat);stroke-width:1.6}
.dg-fz{fill:none;stroke:var(--nu-fat);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dg-ch{fill:var(--nu-fat-soft);stroke:var(--nu-fat);stroke-width:2}
.dg-chi{fill:var(--nu-fat)}
.dg-m{fill:var(--nu-micro);stroke:var(--ink);stroke-width:.7}
.dg-w{fill:var(--nu-water);stroke:var(--ink);stroke-width:.6}
.dg-fib{fill:none;stroke:var(--nu-carb);stroke-width:3.6;stroke-linecap:round}
.dg-fib2{fill:none;stroke:var(--sheet);stroke-width:1.1;stroke-dasharray:2 2}
.dg-gas{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.dg-bac{fill:var(--ink-2);opacity:.85}
.dg-bac.dim{opacity:.32}
.dg-arr,.dg-arrh{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* tract */
.dg-org{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.dg-liver,.dg-gall{fill:var(--plate-grain-soft)}
.dg-org.on,.dg-mouthg.on .dg-org{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2.6}
.dg-cells circle{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.dg-cells circle.dg-nuc{fill:var(--ink-2);stroke:none}
.dg-cells.on circle:not(.dg-nuc){fill:var(--hi-soft);stroke:var(--ink);stroke-width:2.2}
.dg-org.gone{fill:none;stroke-dasharray:3 3;opacity:.6}
.dg-duct{fill:none;stroke:var(--ink-2);stroke-width:2.2}
.dg-tube-o,.dg-tube-i,.dg-tube-t{fill:none;stroke-linecap:round;stroke-linejoin:round}
.dg-tube-o{stroke:var(--ink-2)}
.dg-tube-i{stroke:var(--sheet)}
.dg-tube-t{stroke:transparent}
.dg-tubeg.on .dg-tube-o{stroke:var(--ink)}
.dg-tubeg.on .dg-tube-t{stroke:var(--hi-soft)}
.dg-tongue{fill:var(--rule)}
.dg-tooth{fill:var(--sheet);stroke:var(--ink-2);stroke-width:.8}
.dg-heart{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.dg-lab{font:600 12.5px var(--font-ui);fill:var(--ink-2)}
.dg-lab.s{font-size:10px}
.dg-lab.dk{fill:var(--ink)}
.dg-blood,.dg-bloodh{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dg-lymph,.dg-lymphh{fill:none;stroke:var(--nu-fat);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dg-blood.s,.dg-lymph.s{stroke-width:2}
.dg-bile{fill:var(--ink-2)}
.dg-bolus .dg-c,.dg-bolus .dg-fd{stroke-width:1.8}

/* villus close-up */
.dg-vtis{fill:var(--plate-grain-soft);stroke:var(--ink-2);stroke-width:1}
.dg-vbody{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.6}
.dg-mv{stroke:var(--ink-2);stroke-width:1.2}
.dg-capv{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linejoin:round}
.dg-lacv{stroke:var(--nu-fat);stroke-width:9;stroke-linecap:round}
.dg-laci{stroke:var(--sheet);stroke-width:4;stroke-linecap:round}
.dg-lead{stroke:var(--ink-2);stroke-width:1}
.dg-vlab{font:600 11.5px var(--font-ui);fill:var(--ink-2)}
.dg-vlab.b{fill:var(--pen)}
.dg-vlab.l{fill:var(--nu-fat)}

/* challenge chips inside the challenge cards */
.dg-cx{margin:8px 0 4px}
.dg-cx .how{margin:0 0 6px}
.dg-cxchips{display:flex;flex-wrap:wrap;gap:6px}
.dg-cxlong .chip{text-align:left;border-radius:10px}
.dg-cx .tiny{margin:6px 0 0}
.dg-cxnote{margin:8px 0 0}
.dg-ord{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:4px;counter-reset:dgo}
.dg-ord li{display:flex;align-items:flex-start;gap:6px}
.dg-ord li::before{counter-increment:dgo;content:counter(dgo) ".";font-weight:700;min-width:1.4em;padding-top:.4em}
.dg-slot{display:block;flex:1;border:1.5px dashed var(--rule);border-radius:8px;padding:.3em .8em;color:var(--ink-2);font-size:.88rem;min-height:34px}
.dg-ochip{flex:1;text-align:left;border:1.5px solid var(--ink);background:var(--hi-soft);border-radius:8px;padding:.3em .8em;min-height:34px;font-size:.92rem}

/* Part 3 stations */
.dg-st{padding:4px 0 18px;margin:0 0 16px;border-bottom:1.5px solid var(--rule)}
.dg-st h3{margin-top:4px}
.dg-lbars{display:grid;gap:8px;margin:8px 0}
.dg-lbar{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 8.5rem;gap:4px 10px;align-items:center}
.dg-llab small{display:block;color:var(--ink-2);font-size:.78rem}
.dg-ltrack{height:16px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);position:relative;overflow:hidden}
.dg-lfill{position:absolute;left:0;top:0;bottom:0;background:var(--nu-carb-soft);border-right:2px solid var(--nu-carb)}
.dg-lval{font-size:.85rem;font-weight:700}
.dg-insight{margin:8px 0 0}
.dg-mng{display:flex;flex-wrap:wrap;gap:6px}
.dg-why{background:var(--info-bg);padding:8px 12px;border-radius:6px;margin:8px 0 0}
.dg-mngp p{margin:8px 0 0}
.dg-villi{display:block;width:100%;max-width:520px;height:auto;margin:8px 0}
.dg-surf{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;max-width:520px}
.dg-strack{height:14px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);position:relative;overflow:hidden}
.dg-sfill{position:absolute;left:0;top:0;bottom:0;background:var(--hi-soft);border-right:2px solid var(--ink)}
.dg-slab,.dg-sval{font-size:.88rem;font-weight:700}
.dg-rule{border-left:4px solid var(--ink);background:var(--info-bg);padding:10px 14px;border-radius:6px;margin:14px 0}
.dg-rule p{margin:0}
.dg-alg{columns:2;margin:0;padding-left:1.2em}

/* Trace it */
.dg-tchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dg-tset{margin:10px 0 0;font-weight:700;font-size:.9rem}
.chip.dg-right:disabled{opacity:1;border:2px solid var(--green)}

/* task */
.dg-tin > div{margin:0 0 4px}
.dg-tk{font-size:.78rem;color:var(--ink-2);font-weight:400}
.dg-tkcard{border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px;background:var(--sheet)}
.dg-tkcard h5{margin:0 0 6px;font-size:1rem}
.dg-tkl{margin:0 0 8px;padding-left:1.1em;font-size:.9rem}
.dg-tkm{margin:4px 0}
.dg-tkcard p.tiny{margin:6px 0 0}
.dg-ftrack{position:relative;height:14px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);margin:2px 0 4px}
.dg-ffill{position:absolute;left:0;top:0;bottom:0;background:var(--nu-carb-soft);border-right:2px solid var(--nu-carb)}
.dg-fmark{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}

/* hero */
.dg-hero{max-width:540px;margin:0 auto}
.dg-hsvg{display:block;width:100%;height:auto}
.dg-hblood{fill:var(--sheet);stroke:var(--pen);stroke-width:2.4}
.dg-hlymph{fill:var(--sheet);stroke:var(--nu-fat);stroke-width:2.4;stroke-dasharray:5 4}
.dg-hlab{font:600 12px var(--font-ui);fill:var(--ink-2)}
.dg-hlab.b{fill:var(--ink);font-weight:700;font-size:13px}
.dg-htube-o{fill:none;stroke:var(--ink-2);stroke-width:15;stroke-linecap:round}
.dg-htube-i{fill:none;stroke:var(--sheet);stroke-width:11;stroke-linecap:round}
.dg-hstom,.dg-hmouth{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.dg-hvil{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.dg-hfork{fill:none;stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}
.dg-hcurry{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:1.4}
.dg-hrice{fill:var(--sheet);stroke:var(--ink-2);stroke-width:.8}
.dg-hbolus{fill:var(--nu-carb-soft);stroke:var(--ink-2);stroke-width:1.6}
.dg-hwave{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:2 3}
.hero-fig figcaption.dg-cap{animation:dg-fade .8s ease-out}
.dg-len{display:block;font-size:.82rem;color:var(--ink-2);margin-top:2px}
@keyframes dg-fade{from{opacity:0}to{opacity:1}}

@media (max-width:820px){
  .dg-grid{grid-template-columns:minmax(0,1fr)}
  .dg-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
}
@media (max-width:560px){
  .dg-stops{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .dg-mol{flex-direction:column;align-items:flex-start;gap:2px}
  .dg-lbar{grid-template-columns:minmax(0,1fr) auto}
  .dg-ltrack{grid-column:1 / -1;grid-row:2}
  .dg-alg{columns:1}
  .dg-rgl{min-width:0;width:100%}
  .s1-tag{font-size:.62rem;padding:0 .45em}
}
@media (prefers-reduced-motion:reduce){ .hero-fig figcaption.dg-cap{animation:none} }

</style>
