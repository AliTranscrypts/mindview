itle":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"76512e09","content":{"id":"04-digestion-metabolism","kind":"topic","title":"Digestion, absorption and metabolism","topic":"Digestion, Absorption & Metabolism","readyTopic":"digestion, absorption and metabolism","hero":{"eq":"food → molecules → you","eqSize":"sm","eqLabel":"food, then molecules, then you","headline":"Your lunch takes a journey of several metres.","text":"\u003cstrong>Digestion\u003c/strong> breaks food into molecules small enough to cross into your body. \u003cstrong>Absorption\u003c/strong> moves them across, mostly in the small intestine. \u003cstrong>Metabolism\u003c/strong> is what your cells then do with them: release energy, build tissue, store the rest.","fig":{"html":"\u003cdiv class=\"dg-hero\" id=\"dg-hero\">\u003c/div>","caption":""},"aria":"A forkful of lentil curry and rice travels through the digestive tract. In the mouth, teeth chew and saliva (amylase) starts on starch. A peristalsis wave pushes the bolus down the esophagus, and the stomach churns. In the small intestine the food breaks into orange glucose hexagons, magenta amino-acid beads and teal fatty-acid chains. The hexagons and beads cross into a capillary (blood); the teal chains cross into a lacteal (lymph). Water-soluble → blood. Fat-soluble → lymph.","caption":"Water-soluble → blood. Fat-soluble → lymph.","length":"In an adult, the whole digestive tract is roughly 5 to 9 m long."},"goals":["I can describe mechanical and chemical digestion from the mouth to the large intestine.","I can match each macronutrient to the enzymes (and bile) that break it down and the products formed.","I can explain where and how nutrients are absorbed, including the different routes for water-soluble and fat-soluble products.","I can explain metabolism, catabolism, anabolism and basal metabolic rate, and the factors that affect them.","I can explain how stress, fibre and the gut microbiome affect digestion.","I can tell lactose intolerance, celiac disease and food allergy apart, and explain eating practices that help manage each."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Macronutrient basics","goal":2,"prompt":"Which macronutrient is built from amino acids?","options":[{"t":"Fibre","why":"Fibre is a carbohydrate that human enzymes can’t break down.","_n":"03f5","_k":"30a86ddc"},{"t":"Fat","why":"Most dietary fats are triglycerides: glycerol plus three fatty acids.","_n":"1405","_k":"ff184cba"},{"t":"Carbohydrate","why":"Carbohydrates are built from sugars such as glucose.","_n":"2415","_k":"8d6e65e4"},{"t":"Protein","why":"Proteins are chains of amino acids.","_n":"33a5","_k":"d24a065f"}],"hints":["Think “building blocks”.","Muscle, enzymes and antibodies are all made of this.","Protein."]},{"id":"w2","skill":"Macronutrient basics","goal":3,"prompt":"Which vitamin is fat-soluble?","options":[{"t":"Vitamin C","why":"Vitamin C is water-soluble.","_n":"43b5","_k":"2148ad1c"},{"t":"Folate","why":"Folate is a water-soluble B vitamin.","_n":"53c5","_k":"71bbe6e4"},{"t":"Potassium","why":"Potassium is a mineral, not a vitamin.","_n":"63d5","_k":"2221d8b4"},{"t":"Vitamin D","why":"A, D, E and K are the fat-soluble vitamins.","_n":"7465","_k":"28e6220d"}],"hints":["Remember the four fat-soluble vitamins from module 03.","A, D, E, K.","Vitamin D."]},{"id":"w3","skill":"Body systems","goal":2,"prompt":"Which organ \u003cstrong>makes\u003c/strong> bile?","options":[{"t":"The liver","why":"The liver makes bile; the gallbladder stores and concentrates it.","_n":"8475","_k":"2b4181e3"},{"t":"The gallbladder","why":"The gallbladder stores bile but doesn’t make it.","_n":"9230","_k":"299cb74c"},{"t":"The pancreas","why":"The pancreas makes digestive enzymes and bicarbonate, not bile.","_n":"a220","_k":"1335fdf5"},{"t":"The stomach","why":"The stomach makes acid and pepsin.","_n":"b210","_k":"d4278f09"}],"hints":["One organ makes it, another stores it.","It’s the largest internal organ.","The liver."]},{"id":"w4","skill":"Body systems","goal":3,"prompt":"Which body system carries absorbed nutrients to the body’s cells?","options":[{"t":"Respiratory system","why":"The lungs exchange gases.","_n":"c200","_k":"9bc08375"},{"t":"Skeletal system","why":"Bones store minerals but don’t deliver nutrients.","_n":"d1f0","_k":"91f3b935"},{"t":"Circulatory system","why":"The blood delivers nutrients to every cell.","_n":"e1e0","_k":"62d69fb8"},{"t":"Nervous system","why":"Nerves carry signals, not nutrients.","_n":"f1d0","_k":"3ef882d9"}],"hints":["What travels through every part of your body?","Blood.","The circulatory system."]},{"id":"w5","skill":"Enzymes","goal":2,"prompt":"What does a digestive enzyme do?","options":[{"t":"Supplies energy for digestion","why":"Enzymes lower the energy a reaction needs; they aren’t a fuel.","_n":"g1c0","_k":"16d4f3fb"},{"t":"Speeds up one specific breakdown reaction without being used up","why":"Enzymes are specific, reusable catalysts.","_n":"h1b0","_k":"15cfd40a"},{"t":"Breaks down every kind of molecule equally","why":"Each enzyme fits particular molecules.","_n":"i1a0","_k":"c125a33b"},{"t":"Is a nutrient you must eat each day","why":"Your body makes its digestive enzymes.","_n":"j890","_k":"3cccef1f"}],"hints":["Lock and key.","Specific, and not used up.","It speeds up one specific breakdown reaction without being used up."]},{"id":"w6","skill":"Enzymes","goal":2,"prompt":"Amylase breaks down…","options":[{"t":"Starch","why":"Amylase splits starch into shorter sugar chains.","_n":"k8a0","_k":"f48b58a1"},{"t":"Fat","why":"Lipase breaks down fat.","_n":"l870","_k":"816685f7"},{"t":"Protein","why":"Proteases (like pepsin) break down protein.","_n":"m880","_k":"c0fe0941"},{"t":"Cellulose (fibre)","why":"Humans have no enzyme for cellulose; that’s why it’s fibre.","_n":"n8d0","_k":"5cbea866"}],"hints":["“-ase” names an enzyme; “amyl-” means starch.","It starts working in your mouth.","Starch."]}],"refreshers":{"Macronutrient basics":"Carbohydrates are built from sugars, proteins from amino acids, and most fats from glycerol plus fatty acids. Vitamins A, D, E and K are fat-soluble; B vitamins and C are water-soluble.","Body systems":"The digestive system breaks food down and absorbs it; the circulatory system delivers nutrients; the lymphatic system carries absorbed fats into the blood.","Enzymes":"An enzyme is a protein that speeds up one kind of reaction and is reused. Names ending in “-ase” are enzymes: amylase (starch), protease (protein), lipase (fat), lactase (lactose)."}}},"explore":{"heading":"Journey of a meal","intro":"Pick a meal and send it through the digestive tract. Stop at any organ to see what happens, which enzymes act, and where each nutrient ends up.","meals":[{"id":"m1","t":"Lentil curry, rice and cucumber raita","short":"Lentil curry and rice","has":{"starch":"rice and lentils","protein":"lentils and the raita’s yogurt","fat":"oil in the curry and the yogurt","fibre":"lentils and cucumber","lactose":"a little, in the raita’s yogurt","calcium":"the raita’s yogurt","water":"cucumber, raita and any drink"}},{"id":"m2","t":"Turkey sandwich on whole wheat bread with an apple","short":"Turkey sandwich","has":{"starch":"whole wheat bread","protein":"turkey and bread","fat":"a little, in the turkey","fibre":"whole wheat bread and the apple","vitC":"the apple","water":"the apple and any drink"}},{"id":"m3","t":"Tofu stir-fry with bok choy and noodles","short":"Tofu stir-fry","has":{"starch":"noodles","protein":"tofu","fat":"oil in the stir-fry","fibre":"bok choy","vitA":"bok choy (beta-carotene)","vitC":"bok choy","calcium":"tofu and bok choy","water":"bok choy and any drink"}},{"id":"m4","t":"A glass of milk and a bowl of oatmeal","short":"Milk and oatmeal","has":{"starch":"oatmeal","protein":"milk and oats","fat":"milk","fibre":"oatmeal","lactose":"the milk","calcium":"the milk","water":"the milk"}}],"stops":[{"id":"mouth","t":"Mouth","short":"Mouth","clock":[0,1],"time":"≈ 1 min","mech":"Teeth chew food into small pieces; the tongue mixes it with saliva into a soft ball (bolus).","chem":[{"n":"starch","t":"Salivary amylase: starch → shorter sugar chains"}],"help":"Saliva moistens food","abs":"Nothing yet","route":"Swallowed into the esophagus"},{"id":"eso","t":"Esophagus","short":"Esophagus","clock":[0,0.16666666666666666],"time":"≈ 10 s","mech":"Peristalsis: waves of muscle push the bolus down to the stomach.","chem":[],"none":"No new enzymes act here","help":"Mucus helps the bolus slide","abs":"Nothing","route":"Into the stomach"},{"id":"stom","t":"Stomach","short":"Stomach","clock":[0,180],"time":"≈ 3 h","mech":"Churning mixes food with gastric juice into a thick liquid (chyme).","chem":[{"n":"protein","t":"Pepsin: proteins → peptides (in acid)"}],"help":"Stomach acid unfolds proteins; mucus protects the stomach lining","abs":"Very little: some water","route":"Chyme moves into the duodenum a little at a time"},{"id":"duo","t":"Small intestine (duodenum)","short":"Duodenum","clock":[0,30],"time":"≈ 3 h in the small intestine","mech":"Segmentation mixes food with juices","chem":[{"n":"starch","t":"Pancreatic amylase: starch → maltose"},{"n":"fat","t":"lipase: triglycerides → fatty acids + monoglycerides"},{"n":"protein","t":"trypsin: proteins → peptides"}],"help":"Bile (emulsifies fat; not an enzyme); bicarbonate (neutralizes stomach acid)","abs":"None yet (duodenum)","route":"On to the jejunum and ileum"},{"id":"jej","t":"Small intestine (jejunum and ileum: absorption)","short":"Jejunum and ileum","clock":[30,180],"time":"≈ 3 h in the small intestine","mech":"Segmentation and peristalsis roll food past millions of villi.","chem":[{"n":"starch","t":"Maltase: maltose → glucose"},{"n":"protein","t":"peptidases: peptides → amino acids"},{"n":"lactose","t":"lactase: lactose → glucose + galactose"}],"help":"Micelles (bile with fat products) ferry fats to the cell wall","absBy":{"starch":"glucose","lactose":"galactose","protein":"amino acids","fat":"fatty acids","micro":"vitamins and minerals","water":"most of the water"},"route":"Glucose → capillary → hepatic portal vein → liver; fatty acids → micelles → chylomicrons → lacteal → lymph"},{"id":"li","t":"Large intestine","short":"Large intestine","clock":[0,1440],"time":"≈ 1 day","mech":"Slow contractions move what’s left; as water is absorbed, stool forms.","chem":[{"n":"fibre","t":"Colon bacteria ferment fibre into short-chain fatty acids and gas"}],"help":"Gut bacteria (the microbiome), which also make some vitamin K","abs":"Water and electrolytes; short-chain fatty acids from fibre","route":"Water and electrolytes → capillaries → blood"},{"id":"after","t":"After absorption (liver and cells)","short":"Liver and cells","clock":null,"time":"Minutes after absorption, and all day long","mech":"None: digestion is finished.","chem":[{"n":"all","t":"Metabolism: catabolism breaks molecules down and releases energy; anabolism builds glycogen, proteins and stored fat"}],"help":"The liver processes nutrients, stores some and sends the rest out in the blood","abs":"Nothing: absorption is done","route":"Liver → blood → every cell; the lymph joins the blood near the heart"}],"bmr":"\u003cstrong>Basal metabolic rate (BMR)\u003c/strong> is the energy used at rest for vital functions. It isn’t a fixed speed you’re born with: it depends on lean body mass, age, growth, hormones, illness and pregnancy.","organs":{"liver":"\u003cstrong>Liver:\u003c/strong> makes bile, and receives water-soluble nutrients first through the hepatic portal vein.","gall":"\u003cstrong>Gallbladder:\u003c/strong> stores and concentrates bile made by the liver, and squeezes it into the duodenum when fat arrives.","panc":"\u003cstrong>Pancreas:\u003c/strong> sends amylase, lipase, trypsin and bicarbonate into the duodenum.","cells":"\u003cstrong>Body cells:\u003c/strong> use the absorbed nutrients for energy, building and storage."},"nutrients":[{"id":"starch","t":"Starch","kind":"carb","path":[["Salivary amylase: starch → shorter sugar chains","",""],["No new enzymes act here","",""],["Stomach acid stops salivary amylase","",""],["Pancreatic amylase: starch → maltose","",""],["Maltase: maltose → glucose","Glucose","Glucose → capillary → hepatic portal vein → liver"],["Nothing left: the glucose was absorbed","",""],["Cells break glucose down for energy (catabolism); the liver and muscles build glycogen from extra glucose (anabolism)","","Liver → blood → every cell"]]},{"id":"protein","t":"Protein","kind":"protein","path":[["Chewing only: no enzymes act on protein here","",""],["No new enzymes act here","",""],["Pepsin: proteins → peptides (in acid)","",""],["Trypsin: proteins → peptides","",""],["Peptidases: peptides → amino acids","Amino acids","Amino acids → capillary → hepatic portal vein → liver"],["Nothing left: the amino acids were absorbed","",""],["Cells build proteins from amino acids (anabolism); extra amino acids can be broken down for energy (catabolism)","","Liver → blood → every cell"]]},{"id":"fat","t":"Fat","kind":"fat","path":[["Chewing only: no enzymes act on fat here","",""],["No new enzymes act here","",""],["Churning breaks fat into droplets; fat slows stomach emptying","",""],["Bile emulsifies the fat (bile is not an enzyme); lipase: triglycerides → fatty acids + monoglycerides","",""],["Micelles ferry fatty acids and monoglycerides to the cells, which package them as chylomicrons","Fatty acids and monoglycerides","Fatty acids → micelles → chylomicrons → lacteal → lymph"],["Nothing left: the fat was absorbed","",""],["Cells use fatty acids for energy (catabolism) or store them as fat (anabolism)","","The lymph joins the blood near the heart → cells"]]},{"id":"fibre","t":"Fibre","kind":"fibre","path":[["Chewing breaks fibre into smaller pieces; no enzymes act on it","",""],["No enzymes act on fibre","",""],["No enzymes; fibre slows stomach emptying, so fullness lasts longer","",""],["No human enzyme can break fibre down","",""],["Not absorbed; fibre slows how fast sugars are absorbed","",""],["Colon bacteria ferment fibre into short-chain fatty acids and gas; fibre adds bulk","Short-chain fatty acids","Short-chain fatty acids → colon cells and blood"],["Short-chain fatty acids feed the cells of the colon","",""]]},{"id":"vitA","t":"Vitamin A","kind":"micro","fat":true,"path":[["No digestion needed: vitamins aren’t broken down","",""],["No digestion needed","",""],["Freed from the food as it’s churned","",""],["Gathered with the fat products by bile","",""],["Travels in micelles with fat; packed into chylomicrons","Vitamin A","Vitamin A → micelles → chylomicrons → lacteal → lymph"],["Nothing left: the vitamin A was absorbed","",""],["Stored in the liver (fat-soluble vitamins are stored)","","The lymph joins the blood near the heart → liver"]]},{"id":"vitC","t":"Vitamin C","kind":"micro","path":[["No digestion needed: vitamins aren’t broken down","",""],["No digestion needed","",""],["No digestion needed","",""],["No digestion needed","",""],["Absorbed as it is","Vitamin C","Vitamin C → capillary → hepatic portal vein → liver"],["Nothing left: the vitamin C was absorbed","",""],["Carried in the blood; extra leaves in urine (water-soluble vitamins aren’t stored much)","","Liver → blood → every cell"]]},{"id":"calcium","t":"Calcium","kind":"micro","path":[["No digestion needed: minerals aren’t broken down","",""],["No digestion needed","",""],["No digestion needed","",""],["No digestion needed","",""],["Absorbed into the blood (vitamin D helps)","Calcium","Calcium → capillary → blood"],["Calcium that wasn’t absorbed leaves with the stool","",""],["Bones store most of the body’s calcium","","Blood → bones and every cell"]]},{"id":"water","t":"Water","kind":"water","path":[["No digestion needed","",""],["No digestion needed","",""],["No digestion needed","A little water","Water → capillaries → blood"],["Juices add more water to the mix","",""],["Absorbed as it is","Most of the water","Water → capillaries → blood"],["Absorbed as it is","More water, with electrolytes","Water → capillaries → blood"],["Water carries nutrients and wastes in the blood","",""]]}],"conditions":[{"id":"stress","t":"Exam-day stress","all":"Stress: the “fight or flight” response slows digestion","at":{"stom":"Stomach emptying slows. Digestion slows under stress; some people get stomach-aches."}},{"id":"lactase","t":"Low lactase","all":"Low lactase: watch the lactose at the brush border","at":{"jej":"Lactose passes undigested: too little lactase to split it","li":"Bacteria ferment the lactose, making gas; water is drawn in: bloating, cramps, loose stools possible"},"noLactose":"This meal has no milk sugar (lactose), so low lactase changes nothing here."},{"id":"gall","t":"Gallbladder removed","all":"Gallbladder removed: watch the bile in the duodenum","at":{"duo":"Bile drips steadily from the liver instead of arriving in a concentrated burst, so a large high-fat meal is harder to emulsify: large fatty meals may cause discomfort"}},{"id":"fibre","t":"High-fibre meal","all":"High-fibre meal: more fibre on board at every stop","at":{"stom":"Stomach emptying slows (fullness lasts longer)","jej":"Glucose enters the blood more gradually","li":"More material reaches the colon for fermentation"}},{"id":"abx","t":"After antibiotics (fewer gut bacteria)","all":"After antibiotics: watch the bacteria in the large intestine","at":{"li":"Fewer bacteria in the large intestine, so less fermentation and less vitamin K made by gut bacteria (temporary in most people)"}}],"timeNote":"Model times vary from person to person.","predIntro":"Make a prediction first. Then the journey will show you what really happens.","predictions":[{"id":"p1","meal":"m2","mode":"meal","stop":0,"prompt":"Which macronutrient’s chemical digestion begins in your mouth?","options":[{"t":"Fat","_n":"o8e0","_k":"43955c9e"},{"t":"Protein","_n":"p8b0","_k":"fe7b97ce"},{"t":"None; the mouth only chews","_n":"q8c0","_k":"6cb655c6"},{"t":"Carbohydrate (starch)","_n":"r910","_k":"e823688b"}],"explain":"Salivary amylase starts on starch. Chew bread for a while and it tastes slightly sweeter."},{"id":"p2","meal":"m1","mode":"meal","stop":2,"prompt":"Where will most of this meal’s nutrients be absorbed?","options":[{"t":"Small intestine","_n":"s920","_k":"37bcd279"},{"t":"Stomach","_n":"t8f0","_k":"fd5c24de"},{"t":"Large intestine","_n":"u8e0","_k":"5c0cd094"},{"t":"Mouth","_n":"v910","_k":"16a84434"}],"explain":"The small intestine’s villi and microvilli give it a huge surface. The stomach absorbs very little, mostly water and alcohol."},{"id":"p3","meal":"m1","mode":"follow","nut":"fat","stop":3,"prompt":"After absorption, which vessel do the fats from the curry enter first?","options":[{"t":"A capillary (blood)","_n":"w900","_k":"4e449930"},{"t":"The large intestine","_n":"x8b0","_k":"b5dc2586"},{"t":"A lacteal (lymph vessel)","_n":"y8a0","_k":"b5432b2f"},{"t":"The hepatic portal vein","_n":"z8d0","_k":"3dddd532"}],"explain":"Fat products are too large for capillaries once they’re packaged into chylomicrons, so they travel through the lymph and join the blood near the heart."},{"id":"p4","meal":"m4","mode":"whatif","cond":"lactase","stop":4,"prompt":"Where do the uncomfortable symptoms come from?","options":[{"t":"The milk’s protein causing an allergic reaction","_n":"108c0","_k":"bf23d2f4"},{"t":"Undigested lactose reaching the large intestine, where bacteria ferment it","_n":"11970","_k":"e10f6d41"},{"t":"The stomach making too much acid","_n":"12960","_k":"535b3fdc"},{"t":"The oatmeal’s fibre","_n":"1384f","_k":"6ecb3732"}],"explain":"Without enough lactase, lactose isn’t split into glucose and galactose. Bacteria ferment it, making gas, and it draws water into the bowel. That’s an intolerance, not an allergy."}],"chalIntro":"Use the chips in each challenge (and the journey above) to meet the goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Starch to blood sugar: place the four steps in order.","how":"Tap the steps in order. Tap a placed step to take it back.","chips":[{"id":"sal","t":"salivary amylase in the mouth"},{"id":"pan","t":"pancreatic amylase in the small intestine"},{"id":"mal","t":"maltase at the brush border"},{"id":"cap","t":"glucose absorbed into a capillary"}],"_a":"bBRGUF5HHBtHV1sTHkddWFsUGRNRBEAbag==","msgs":{"maltase":"Maltase works on maltose, which only exists after amylase has cut starch into shorter pieces.","cap":"Glucose must be a single sugar before it can be absorbed.","count":"Place all four steps, in order."},"general":"Where does starch digestion begin?","why":"Mouth amylase → pancreatic amylase → maltase → capillary.","hints":["Where does starch digestion begin?","Amylase in the mouth, then the pancreas sends more amylase into the duodenum.","Mouth amylase → pancreatic amylase → maltase → capillary."]},{"id":"tc2","goal":[2,3],"prompt":"Get the fat from M1 (lentil curry, rice and cucumber raita) absorbed. Choose the helpers and the route.","how":"Choose any chips that apply.","chips":[{"id":"bile","t":"bile","_n":"1485f","_k":"31ac1e37"},{"id":"lipase","t":"lipase","_n":"1586f","_k":"7fb5bf61"},{"id":"pepsin","t":"pepsin","_n":"1687f","_k":"e9beb444"},{"id":"lactase","t":"lactase","_n":"1788f","_k":"4bee98ba"},{"id":"micelles","t":"micelles","_n":"1889f","_k":"52122697"},{"id":"chylo","t":"chylomicrons","_n":"198af","_k":"21311abe"},{"id":"capillary","t":"capillary","_n":"1a8bf","_k":"d528d80e"},{"id":"lacteal","t":"lacteal","_n":"1b8cf","_k":"a4b9eae7"}],"msgs":{"bile":"Without bile, fat stays in big droplets and lipase can only work on their surfaces, so much of the fat passes through unabsorbed.","capillary":"Chylomicrons are too large for capillaries; they enter the lacteals.","pepsin":"Pepsin digests protein, not fat.","lactase":"Lactase digests lactose, not fat.","none":"Choose the chips that get fat absorbed."},"general":"Something’s missing. Bile emulsifies; lipase digests; micelles ferry the products to the cell wall; cells package them as chylomicrons.","why":"Bile, lipase, micelles, chylomicrons, lacteal: fat takes the lymph road.","hints":["Fat and water don’t mix. What breaks fat into tiny droplets?","Bile emulsifies; lipase digests; micelles ferry the products to the cell wall; cells package them as chylomicrons.","Bile, lipase, micelles, chylomicrons, lacteal."]},{"id":"tc3","goal":[6,2],"stretch":true,"prompt":"What if? Gallbladder removed. Persona \u003cstrong>Sunil, 52\u003c/strong>, had his gallbladder removed and his health team suggested adjusting his meals. Choose the \u003cstrong>two\u003c/strong> strategies that best fit how his digestion now works.","how":"Choose two strategies.","chips":[{"id":"A","t":"Eat smaller amounts of fat at each meal.","_n":"1c8df","_k":"97cc5325"},{"id":"B","t":"Spread meals and snacks through the day.","_n":"1d8af","_k":"741b49fb"},{"id":"C","t":"Cut out all fat completely.","_n":"1e89f","_k":"500495a5"},{"id":"D","t":"Drink extra water to dissolve the fat.","_n":"1f88f","_k":"5482fe7f"},{"id":"E","t":"Take lactase tablets with meals.","_n":"1g87f","_k":"85845779"},{"id":"F","t":"Eat only protein foods.","_n":"1h8ef","_k":"e8c64050"}],"msgs":{"C":"Some fat is essential: it supplies essential fatty acids and carries vitamins A, D, E and K.","D":"Fat doesn’t dissolve in water; that’s why bile is needed.","E":"Lactase digests lactose, not fat.","F":"Protein foods still contain fat, and the body needs carbohydrates and fibre too.","count":"Choose exactly two strategies."},"general":"Smaller fat loads, more often.","note":"General information only. People after surgery follow their own health team’s advice.","show":"Show “gallbladder removed” in the journey","why":"A steady trickle of bile handles smaller amounts of fat, spread through the day.","hints":["Without a gallbladder, bile drips steadily instead of arriving in a large burst. What kind of meal does a steady trickle handle best?","Smaller fat loads, more often.","A and B."]}],"blocks":[{"title":"What the journey shows","html":"\u003cp>The \u003cstrong>small intestine\u003c/strong> does most of the work. \u003cstrong>Fat takes a different road\u003c/strong>: into the lymph, not straight into the blood. \u003cstrong>Fibre isn’t wasted\u003c/strong>: it feeds your gut bacteria. And what you feel (“full”, “bloated”, a “nervous stomach”) has a reason you can trace.\u003c/p>"},{"title":"Metabolism","html":"\u003cp>\u003cstrong>Metabolism\u003c/strong> is every chemical reaction in the body. \u003cstrong>Catabolism\u003c/strong> breaks molecules down and releases energy. \u003cstrong>Anabolism\u003c/strong> builds glycogen, proteins and stored fat. \u003cstrong>Basal metabolic rate (BMR)\u003c/strong>, the energy used at rest for vital functions, depends on lean body mass, age, growth, hormones, illness and pregnancy. Stress, fibre and conditions such as lactose intolerance and celiac disease all change how digestion works.\u003c/p>"}]},"part3":{"slug":"conditions","name":"Conditions","heading":"When digestion works differently","intro":"These three conditions each break a different step of the journey. Visit each station, reason from the mechanism to the management, then try the quick check.","advice":"For your own health, talk to a doctor, nurse or registered dietitian.","lactose":{"title":"Station 1: Lactose intolerance","mech":"Less \u003cstrong>lactase\u003c/strong> at the brush border, so lactose reaches the colon.","dataTitle":"Check it with data: lactose per serving","foods":[{"id":"milk","t":"Milk","serve":"1 cup (250 mL)","g":12},{"id":"yogurt","t":"Yogurt","serve":"¾ cup (175 g)","g":8},{"id":"cheddar","t":"Aged cheddar","serve":"50 g","g":0.1,"label":"under 0.5 g"},{"id":"lfmilk","t":"Lactose-free milk","serve":"1 cup (250 mL)","g":0,"label":"0 g (already split)"},{"id":"soy","t":"Fortified soy beverage","serve":"1 cup (250 mL)","g":0,"label":"0 g"}],"insight":"Aged hard cheeses contain very little lactose.","context":"Lactase levels after childhood vary widely around the world and are lower in many populations. This is common and normal, not a disease.","manage":[{"id":"lf","t":"Lactose-free milk","why":"Lactase has been added, so the lactose is already split into glucose and galactose."},{"id":"soy","t":"Fortified soy beverage","why":"No lactose, and it’s fortified for calcium and vitamin D."},{"id":"small","t":"Smaller amounts with meals","why":"Less lactose at a time, mixed with other food, gives the lactase you have time to work."},{"id":"cheese","t":"Aged cheese","why":"Aged hard cheeses contain very little lactose."},{"id":"tabs","t":"Lactase tablets","why":"They supply the missing enzyme with the meal."}]},"celiac":{"title":"Station 2: Celiac disease","mech":"An \u003cstrong>autoimmune\u003c/strong> reaction to \u003cstrong>gluten\u003c/strong> (in wheat, barley and rye) flattens the villi, cutting the surface for absorption. Iron, folate, calcium and vitamin D can be affected.","manage":"\u003cstrong>Management:\u003c/strong> a strict, lifelong gluten-free diet, including avoiding cross-contact.","diagnosis":"\u003cstrong>Diagnosis:\u003c/strong> made by a doctor, \u003cstrong>while the person is still eating gluten\u003c/strong>.","note":"General information only. People with celiac disease follow their own health team’s advice.","dataTitle":"Check it with data: healthy vs flattened villi","healthy":30,"flat":3,"states":[{"id":"healthy","t":"Healthy villi"},{"id":"flat","t":"Untreated celiac disease"}],"readHealthy":"Tall villi covered in microvilli: a huge absorbing surface.","readFlat":"Flattened villi with few microvilli: much less surface, so iron, folate, calcium and vitamin D are absorbed less."},"allergy":{"title":"Station 3: Allergy or intolerance?","intro":"Sort each case. Reactions are described only by what you’d notice.","boxes":[{"id":"al","label":"Food allergy","sub":"immune system"},{"id":"in","label":"Food intolerance","sub":"digestive"}],"cases":[{"id":"a1","t":"Hives within minutes of eating a peanut butter cookie","_a":"FVdZEw==","why":"Hives come from the immune system: that’s an allergy."},{"id":"a2","t":"Bloating and cramps a couple of hours after a large glass of milk","_a":"FV9bEw==","why":"Bloating hours later is typical of lactose intolerance: a digestive problem."},{"id":"a3","t":"Swelling of the lips soon after eating shrimp","_a":"FVdZEw==","why":"Swelling comes from the immune system: that’s an allergy."},{"id":"a4","t":"Trouble breathing minutes after a bite of a cashew","_a":"FVdZEw==","why":"Trouble breathing is an immune reaction and an emergency: call 911."},{"id":"a5","t":"Bloating after ice cream, but fine after aged cheddar","_a":"FV9bEw==","why":"Aged cheddar has very little lactose: this points to lactose intolerance."},{"id":"a6","t":"Cramps after milk in a smoothie, but fine with lactose-free milk","_a":"FV9bEw==","why":"Lactose-free milk has the lactose already split: a digestive intolerance."}],"allergens":["Eggs","Milk","Mustard","Peanuts","Crustaceans and molluscs","Fish","Sesame seeds","Soy","Sulphites","Tree nuts","Wheat and triticale"],"allergensTitle":"Canada’s priority food allergens (Health Canada, n.d.)","rule":"An allergic reaction can be life-threatening (anaphylaxis): use an epinephrine auto-injector if one has been prescribed and call 911."},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Health Canada. (n.d.). \u003ci>Common food allergens\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Conditions quick check","summary":"Conditions quick check","items":[{"id":"q1","goal":6,"prompt":"A student feels bloated after milk but fine after aged cheddar. Most likely?","choices":[{"t":"Celiac disease","fb":"Aged cheddar has very little lactose; an allergy to milk protein would react to cheese too.","_n":"1i8df","_k":"c9266fe8"},{"t":"Gallbladder problem","fb":"Aged cheddar has very little lactose; an allergy to milk protein would react to cheese too.","_n":"1j8cf","_k":"f856666c"},{"t":"Milk allergy","fb":"Aged cheddar has very little lactose; an allergy to milk protein would react to cheese too.","_n":"1k8bf","_k":"b162d714"},{"t":"Lactose intolerance","fb":"Right. Aged cheddar has very little lactose; an allergy to milk protein would react to cheese too.","_n":"1l92f","_k":"f5586413"}]},{"id":"q2","goal":[6,3],"prompt":"Why can untreated celiac disease cause iron deficiency even when someone eats iron-rich foods?","choices":[{"t":"Damaged villi absorb less","fb":"Right. Flattened villi mean less surface for absorption.","_n":"1m91f","_k":"31cee6d1"},{"t":"Iron causes the reaction","fb":"Flattened villi mean less surface for absorption.","_n":"1n90f","_k":"58200e5c"},{"t":"Gluten contains no iron","fb":"Flattened villi mean less surface for absorption.","_n":"1o91f","_k":"2317d208"},{"t":"The stomach destroys iron","fb":"Flattened villi mean less surface for absorption.","_n":"1p8ef","_k":"f6728708"}]},{"id":"q3","goal":6,"prompt":"Which is a food \u003cstrong>allergy\u003c/strong> rather than an intolerance?","choices":[{"t":"Bloating after milk","fb":"Hives and swelling come from the immune system: that’s an allergy.","_n":"1q8ff","_k":"8eba6b32"},{"t":"Swelling of the lips and hives within minutes of eating peanuts","fb":"Right. Hives and swelling come from the immune system: that’s an allergy.","_n":"1r8cf","_k":"58a1f477"},{"t":"Heartburn after spicy food","fb":"Hives and swelling come from the immune system: that’s an allergy.","_n":"1s8df","_k":"3ea0db62"},{"t":"Gas after beans","fb":"Hives and swelling come from the immune system: that’s an allergy.","_n":"1t8af","_k":"26c6fdb8"}]},{"id":"q4","goal":6,"prompt":"Someone suspects celiac disease. Best first step?","choices":[{"t":"Stop eating gluten immediately","fb":"Removing gluten first can hide the signs the test looks for.","_n":"1u8bf","_k":"dfc1f3f2"},{"t":"See a doctor for testing while still eating gluten","fb":"Right. Removing gluten first can hide the signs the test looks for.","_n":"1v98f","_k":"a6883d2f"},{"t":"Take lactase tablets","fb":"Removing gluten first can hide the signs the test looks for.","_n":"1w99f","_k":"f0d170b8"},{"t":"Eat more fibre","fb":"Removing gluten first can hide the signs the test looks for.","_n":"1x16f","_k":"3a83c288"}]}]}},"practice":{"activities":[{"id":"enzymes","type":"match","title":"Enzyme ↔ job","summary":"Enzyme ↔ job","goal":[1,2],"instruction":"Match each enzyme or helper to its job.","leftTitle":"Enzyme or helper","rightTitle":"Where and what it does","left":[{"id":"l1","t":"Salivary amylase"},{"id":"l2","t":"Pepsin"},{"id":"l3","t":"Pancreatic lipase"},{"id":"l4","t":"Bile","hints":["Which item isn’t an enzyme?","It’s made by the liver.","Bile emulsifies fat."]},{"id":"l5","t":"Lactase"},{"id":"l6","t":"Trypsin"},{"id":"l7","t":"Maltase"},{"id":"l8","t":"Colon bacteria"}],"right":[{"id":"r1","t":"Mouth: starch → shorter sugar chains"},{"id":"r2","t":"Stomach: proteins → peptides (in acid)"},{"id":"r3","t":"Small intestine: triglycerides → fatty acids + monoglycerides"},{"id":"r4","t":"Small intestine: emulsifies fat (not an enzyme)"},{"id":"r5","t":"Brush border: lactose → glucose + galactose"},{"id":"r6","t":"Small intestine (from the pancreas): proteins and peptides → smaller peptides"},{"id":"r7","t":"Brush border: maltose → glucose"},{"id":"r8","t":"Large intestine: ferment fibre into short-chain fatty acids and gas"}],"_a":"TBRZABBfEksGFBkTXlcSAxVEBxMeR1wKFQwXQwFHHBtbAhcLEBcEGxsUWQQQXxJLAhQZE15TEgMVRAMTHkdcDhUMF0MFRxwbWw4XCxAXCBtK","wrong":{"l4|r3":"Bile prepares fat; lipase digests it.","l3|r4":"Bile prepares fat; lipase digests it.","l2|r6":"Both digest protein, but pepsin works in the acid of the stomach.","l6|r2":"Both digest protein, but pepsin works in the acid of the stomach.","l8|r1":"Humans have no enzyme for fibre; bacteria do the work.","l1|r8":"Humans have no enzyme for fibre; bacteria do the work."},"wrongDefault":"Check where the enzyme works and what it acts on."},{"id":"trace","type":"custom","title":"Trace it","summary":"Trace it","star":true,"goal":[3,4,5,6],"instruction":"Six items that trace nutrients through the body. Items marked ★ are non-routine; T6 is an investigation.","how":"Tap your choice (or type a number), then press Check.","items":[{"id":"t1","kind":"chips","goal":3,"prompt":"Vitamin A in carrots is absorbed best when the carrots are eaten with…","chips":[{"t":"hummus","_n":"1y15f","_k":"aba2ada1"},{"t":"water","_n":"1z18f","_k":"a2acbb58"},{"t":"plain rice cakes","_n":"2017f","_k":"2f351230"},{"t":"black tea","_n":"211af","_k":"84de6b7f"}],"fb":"Vitamin A is fat-soluble: it travels in micelles with fat.","why":"Hummus brings some fat, and vitamin A is fat-soluble: it travels in micelles with fat."},{"id":"t2","kind":"chips","goal":3,"prompt":"Which route does vitamin C take after absorption?","chips":[{"t":"capillary → liver","_n":"2219f","_k":"04fdfb23"},{"t":"lacteal → lymph","_n":"231cf","_k":"674dd29b"},{"t":"stays in the colon","_n":"241bf","_k":"0a1b7a15"},{"t":"stored in fat tissue","_n":"250ef","_k":"da673650"}],"fb":"Vitamin C is water-soluble, so it goes into the blood.","why":"Vitamin C is water-soluble, so it goes into the blood: capillary → hepatic portal vein → liver."},{"id":"t3","kind":"chips","star":true,"goal":5,"prompt":"Why does a lunch of whole grain bread and chickpeas keep you feeling full longer than white bread and juice?","chips":[{"t":"Fibre slows stomach emptying and glucose absorption","_n":"260df","_k":"91f422cd"},{"t":"Human enzymes digest fibre slowly","_n":"270d1","_k":"09485a86"},{"t":"Juice sugar stays in the stomach longer","_n":"280e1","_k":"17aa9ea4"},{"t":"Whole grains are absorbed in the stomach","_n":"290f1","_k":"e8e9eb62"}],"fb":"Juice sugar is absorbed quickly; fibre slows the whole process.","why":"Juice sugar is absorbed quickly; fibre slows the whole process."},{"id":"t4","kind":"chips","star":true,"goal":5,"prompt":"After a week of antibiotics, which vitamin might the gut bacteria make less of?","chips":[{"t":"Vitamin K","_n":"2a101","_k":"650048c0"},{"t":"Vitamin C","_n":"2b091","_k":"5181c8d6"},{"t":"Vitamin B12 from food","_n":"2c0a1","_k":"83e6f1a3"},{"t":"Vitamin D","_n":"2d0b1","_k":"bbae6e5f"}],"fb":"Gut bacteria make some vitamin K; antibiotics reduce them for a while.","why":"Gut bacteria make some vitamin K; antibiotics reduce them for a while."},{"id":"t5","kind":"num","star":true,"goal":[6,3],"prompt":"A villus is drawn as a finger with microvilli. If the microvilli are lost (as in untreated celiac disease), the surface in a model drops from 30 units to 3 units. By what factor does the absorbing surface shrink?","_a":"BgY=","unit":"times","label":"Factor","why":"30 ÷ 3 = 10 times less surface.","wrong":[{"match":27,"fb":"That’s the difference, 30 − 3. A factor compares by dividing."},{"match":0.1,"fb":"That’s 3 ÷ 30. Divide the healthy surface by the damaged one."}],"wrongDefault":"Compare the two surface sizes: divide the healthy surface by the damaged one.","hints":["Compare the two surface sizes.","Divide the healthy surface by the damaged one.","30 ÷ 3 = 10."]},{"id":"t6","kind":"two","star":true,"inquiry":true,"goal":2,"prompt":"Students test amylase by mixing starch solution with saliva at 0, 2, 4 and 6 minutes, then adding iodine (blue-black means starch is present). Which is the \u003cstrong>independent\u003c/strong> variable, and which result shows amylase working?","sets":[{"id":"iv","label":"Independent variable","chips":[{"t":"Time","_n":"2e0c1","_k":"274e7a64"},{"t":"Iodine colour","_n":"2f151","_k":"abb1d3c5"},{"t":"Amount of starch solution","_n":"2g161","_k":"45e1a1ef"},{"t":"Amount of saliva","_n":"2h931","_k":"25ef9861"}]},{"id":"res","label":"Result that shows amylase working","chips":[{"t":"Blue-black fading to brown-yellow over time","_n":"2i921","_k":"f098872a"},{"t":"Blue-black at every time","_n":"2j911","_k":"16774e65"},{"t":"Blue-black getting darker over time","_n":"2k901","_k":"8b7c4661"},{"t":"Brown-yellow at every time","_n":"2l8f1","_k":"e34a03eb"}]}],"fbSets":{"iv":"Time is what the students change.","res":"Iodine stays blue-black while starch remains; as amylase breaks the starch down, the colour fades."},"why":"Time is what the students change. Iodine stays blue-black while starch remains; as amylase breaks the starch down, the colour fades.","hints":["Which thing do the students choose to change?","Iodine turns blue-black only when starch is present.","Independent variable: time; amylase is working if the blue-black colour fades."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Dorian","goal":[2,3,6],"how":"","instruction":"Dorian made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain how fat in a meal is digested.","steps":["Fat reaches the small intestine mostly undigested.","The gallbladder releases bile into the duodenum.","Bile is the enzyme that breaks triglycerides into fatty acids.","The fatty acids are then absorbed."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Pepsin breaks down the fat.","why":"Pepsin digests protein.","_n":"2m8e1","_k":"6819ac8d"},{"t":"Bile emulsifies fat into small droplets; lipase from the pancreas then breaks the triglycerides into fatty acids and monoglycerides.","why":"Bile emulsifies: it breaks fat into tiny droplets so lipase can reach it. Lipase does the chemical digestion.","_n":"2n8d1","_k":"f6a361e8"},{"t":"Step 3 is correct.","why":"Bile has no enzyme action on fat; it’s an emulsifier.","_n":"2o8c1","_k":"cc281db1"},{"t":"Bile is made by the gallbladder.","why":"The liver makes bile; the gallbladder stores it.","_n":"2p9b1","_k":"53dea45c"}],"hints":["Is bile an enzyme?","It’s an emulsifier.","Bile emulsifies fat into small droplets; lipase from the pancreas then breaks the triglycerides into fatty acids and monoglycerides."]},{"id":"e2","goal":3,"task":"Explain where the glucose from a slice of toast goes.","steps":["Amylase breaks starch into maltose, and maltase breaks maltose into glucose.","Most of the glucose is absorbed in the stomach.","It travels in the blood to the liver.","Cells use it for energy or store it as glycogen."],"_a":"Bg==","stepFb":["Step 1 is correct.","","Step 3 is correct on its own, but step 2 has the wrong location.","Step 4 is correct."],"fixes":[{"t":"Glucose is absorbed through the villi of the small intestine into capillaries.","why":"The stomach starts protein digestion and churns food, but most chemical digestion and nearly all nutrient absorption happen in the small intestine.","_n":"2q9a1","_k":"9dd39771"},{"t":"Glucose is absorbed in the large intestine.","why":"The large intestine mainly absorbs water and electrolytes.","_n":"2rd7b","_k":"c8fffd11"},{"t":"Glucose enters the lacteals.","why":"Lacteals take fat products, not glucose.","_n":"2sd6b","_k":"6b4b9b09"},{"t":"Step 2 is correct.","why":"The stomach absorbs very little besides water and alcohol.","_n":"2td9b","_k":"847c2f71"}],"hints":["Which organ has the villi?","Not the stomach.","Glucose is absorbed through the villi of the small intestine into capillaries."]},{"id":"e3","goal":6,"task":"Advise a friend who thinks they might have celiac disease.","steps":["Celiac disease is an immune reaction to gluten.","Gluten is found in wheat, barley and rye.","So stop eating gluten right away, and then get tested.","If the test is negative, you’re fine."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 depends on the mistake before it."],"fixes":[{"t":"Take lactase tablets.","why":"Lactase helps with lactose, not gluten.","_n":"2ud8b","_k":"30a50fb1"},{"t":"See a doctor and get tested \u003cstrong>while still eating gluten\u003c/strong>; removing it first can hide the signs the test looks for.","why":"Celiac testing is done while you’re still eating gluten. Gluten-free isn’t automatically healthier for people who don’t need it.","_n":"2vd3b","_k":"efd7aece"},{"t":"Step 3 is correct.","why":"Testing depends on gluten still being in the diet.","_n":"2wd2b","_k":"92686659"},{"t":"Eat gluten-free for a month to see.","why":"That can make testing unreliable.","_n":"2xd5b","_k":"36cda0f1"}],"hints":["What does the test look for?","The body’s reaction to gluten.","See a doctor and get tested while still eating gluten; removing it first can hide the signs the test looks for."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"Which stop on the journey surprised you most, and why?"},{"id":"j2","q":"In your own words, why do fats take a different route from glucose after absorption?"},{"id":"j3","q":"Explain to a friend why fibre matters even though you can’t digest it."},{"id":"j4","q":"What’s still unclear about enzymes or absorption? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is an example of \u003cstrong>mechanical\u003c/strong> digestion?","options":[{"t":"Pepsin splitting proteins","why":"That’s chemical digestion.","_n":"2yd4b","_k":"9fe17621"},{"t":"Lipase splitting fats","why":"That’s chemical digestion.","_n":"2zcfb","_k":"690b972d"},{"t":"The stomach churning food","why":"Churning physically breaks food apart without changing molecules.","_n":"30ceb","_k":"e3190650"},{"t":"Amylase splitting starch","why":"That’s chemical digestion.","_n":"3151b","_k":"d44c3d34"}]},"b":{"prompt":"Which is an example of \u003cstrong>chemical\u003c/strong> digestion?","options":[{"t":"Teeth grinding a carrot","why":"That’s mechanical.","_n":"3252b","_k":"db415fbc"},{"t":"Peristalsis moving food down the esophagus","why":"That’s movement, not digestion of molecules.","_n":"334fb","_k":"ee11d55a"},{"t":"The stomach churning","why":"That’s mechanical.","_n":"3450b","_k":"e77d5284"},{"t":"Lactase splitting lactose into glucose and galactose","why":"An enzyme changes the molecule.","_n":"3555b","_k":"b65adeb7"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is bile’s role in digestion?","options":[{"t":"It digests protein","why":"Proteases digest protein.","_n":"3656b","_k":"299c9c8c"},{"t":"It absorbs vitamins","why":"Absorption happens through intestinal cells.","_n":"3753b","_k":"92c12e1c"},{"t":"It digests fat into fatty acids","why":"That’s lipase’s job.","_n":"3854b","_k":"7f3240e4"},{"t":"It emulsifies fat so lipase can reach it","why":"Bile emulsifies: it breaks fat into tiny droplets so lipase can reach it. Lipase does the chemical digestion.","_n":"3949b","_k":"8c07e548"}]},"b":{"prompt":"What does pancreatic lipase do?","options":[{"t":"Neutralizes stomach acid","why":"That’s bicarbonate.","_n":"3a4ab","_k":"02e8748b"},{"t":"Breaks starch into maltose","why":"That’s amylase.","_n":"3b4bb","_k":"b0c7dfb3"},{"t":"Emulsifies fat into droplets","why":"That’s bile.","_n":"3c4ab","_k":"2c8cf2c1"},{"t":"Breaks triglycerides into fatty acids and monoglycerides","why":"Lipase does the chemical digestion of fat, once bile has emulsified it.","_n":"3d49b","_k":"759afae5"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Why does the small intestine absorb so much?","options":[{"t":"Its strong acid dissolves nutrients","why":"The strong acid is in the stomach.","_n":"3e48b","_k":"46494bca"},{"t":"Folds, villi and microvilli give it an enormous surface area","why":"The stomach starts protein digestion and churns food, but most chemical digestion and nearly all nutrient absorption happen in the small intestine.","_n":"3f47b","_k":"9e649899"},{"t":"It is the first organ food reaches","why":"Food passes the mouth, esophagus and stomach first.","_n":"3g46b","_k":"8e955036"},{"t":"It contains the most bacteria","why":"Most gut bacteria live in the large intestine.","_n":"3h45b","_k":"78efd642"}]},"b":{"prompt":"What is the large intestine’s main absorption job?","options":[{"t":"Absorbing most of the glucose","why":"That happens in the small intestine.","_n":"3i44b","_k":"47df7b2a"},{"t":"Absorbing protein","why":"Amino acids are absorbed in the small intestine.","_n":"3j53b","_k":"1efde839"},{"t":"Absorbing fats into lacteals","why":"Lacteals are in the small intestine’s villi.","_n":"3k52b","_k":"e6721c15"},{"t":"Absorbing water and electrolytes","why":"The large intestine absorbs water and electrolytes, and its bacteria ferment fibre.","_n":"3l45b","_k":"aba31681"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A salad has spinach (rich in beta-carotene) and a dressing made with oil. Why does the dressing help the body use the vitamin A from the spinach?","options":[{"t":"Oil speeds up the stomach","why":"Fat actually slows stomach emptying.","_n":"3m46b","_k":"b6e3359c"},{"t":"Oil contains vitamin A","why":"This plain oil adds little vitamin A; it’s the absorption route that matters.","_n":"3n47b","_k":"c0928dde"},{"t":"Vitamin A goes straight into the blood, and oil thins the blood","why":"Fat-soluble vitamins travel with fat through the lymph.","_n":"3o48b","_k":"b0896460"},{"t":"Vitamin A is fat-soluble, so it’s absorbed with fat in micelles and carried in chylomicrons","why":"Fat products and fat-soluble vitamins travel in chylomicrons through the lacteals into the lymph before reaching the blood.","_n":"3p41b","_k":"1c7dade9"}]},"b":{"prompt":"A student takes a vitamin D supplement with a glass of water on an empty stomach every morning. What change would most likely improve absorption?","options":[{"t":"Take it with more water","why":"Water doesn’t carry fat-soluble vitamins.","_n":"3q42b","_k":"4a0b52c4"},{"t":"Take it with a meal that contains some fat","why":"Vitamin D is fat-soluble.","_n":"3r43b","_k":"82e3dbd9"},{"t":"Take it before bed without food","why":"Food with some fat helps.","_n":"3s44b","_k":"b7543f70"},{"t":"Take it with orange juice","why":"Vitamin C helps iron absorption, not vitamin D.","_n":"3t4db","_k":"9962b823"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"Untreated celiac disease flattens the villi. Which problem is most likely to follow?","options":[{"t":"More bile production","why":"Bile isn’t the issue.","_n":"3u4eb","_k":"99ff8a8b"},{"t":"Too much lactose absorbed","why":"Damaged villi make lactase \u003cstrong>lower\u003c/strong>, not higher.","_n":"3v3fb","_k":"db49ff86"},{"t":"Deficiencies of nutrients such as iron, folate and calcium","why":"Less surface means less absorption.","_n":"3w3eb","_k":"ff28204f"},{"t":"Faster digestion of starch in the mouth","why":"The mouth isn’t affected.","_n":"3x41b","_k":"54cb2bae"}]},"b":{"prompt":"Why do some people with untreated celiac disease also have trouble digesting milk?","options":[{"t":"The stomach stops making acid","why":"That isn’t the link.","_n":"3y40b","_k":"d75f4936"},{"t":"Milk protein causes celiac disease","why":"Celiac disease is a reaction to gluten.","_n":"3z43b","_k":"60eccb3e"},{"t":"Gluten is found in milk","why":"Milk doesn’t contain gluten.","_n":"4042b","_k":"5b8bce48"},{"t":"Lactase sits on the brush border of the villi, which are damaged","why":"Damaged villi make less lactase, so lactose reaches the colon.","_n":"4145b","_k":"93d15dc9"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Amara drinks milk and feels bloated two hours later; her friend eats a peanut cookie and gets hives within minutes. Which statement is accurate?","options":[{"t":"Amara’s reaction suggests an intolerance; her friend’s suggests an allergy","why":"An allergy involves the immune system and can be life-threatening. An intolerance, such as lactose intolerance, is digestive.","_n":"4244b","_k":"1d4a22af"},{"t":"Amara has an allergy; her friend has an intolerance","why":"An allergy involves the immune system and can be life-threatening. An intolerance, such as lactose intolerance, is digestive.","_n":"4347b","_k":"9ef2fbc6"},{"t":"Both are allergies","why":"Bloating hours later is typical of lactose intolerance.","_n":"4446b","_k":"b5666c18"},{"t":"Both are intolerances","why":"Hives within minutes involve the immune system.","_n":"45d9a","_k":"d28e8dcb"}]},"b":{"prompt":"Which situation needs emergency help right away?","options":[{"t":"Gas after a bean salad","why":"Normal fermentation of fibre and certain carbohydrates.","_n":"46daa","_k":"6a343ca0"},{"t":"Feeling full after a big meal","why":"Normal.","_n":"47d7a","_k":"77f0bdc7"},{"t":"Throat tightness and trouble breathing after eating shrimp","why":"Possible anaphylaxis: use the prescribed auto-injector and call 911.","_n":"48d8a","_k":"aa42556c"},{"t":"Bloating after ice cream","why":"Typical of lactose intolerance.","_n":"49d5a","_k":"580a643b"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the clearest explanation of the difference between a food allergy and a food intolerance?","options":[{"t":"“An intolerance means you can never eat the food.”","why":"Many people with lactose intolerance tolerate small amounts.","_n":"4ad6a","_k":"e84f3b20"},{"t":"“An allergy is worse than an intolerance.”","why":"True, but it doesn’t explain \u003cstrong>why\u003c/strong>.","_n":"4bd3a","_k":"1161096a"},{"t":"“A food allergy is an immune-system reaction that can be life-threatening; an intolerance is a digestive problem, like too little lactase, that causes discomfort.”","why":"An allergy involves the immune system and can be life-threatening. An intolerance, such as lactose intolerance, is digestive.","_n":"4cd4a","_k":"a40c0fa3"},{"t":"“They’re the same thing with different names.”","why":"An allergy involves the immune system and can be life-threatening. An intolerance, such as lactose intolerance, is digestive.","_n":"4dd1a","_k":"7302df5e"}]},"b":{"prompt":"Which sentence best explains why lactose-free milk doesn’t cause symptoms?","options":[{"t":"“It’s made from soy.”","why":"Lactose-free milk is cow’s milk with lactase added.","_n":"4ed2a","_k":"a972d9f0"},{"t":"“The lactose has already been split into glucose and galactose, so there’s nothing left for gut bacteria to ferment.”","why":"Lactose-free milk is cow’s milk with lactase added, so the splitting is already done.","_n":"4fd3a","_k":"c4a3cf79"},{"t":"“It has no protein.”","why":"It keeps the protein.","_n":"4gd2a","_k":"89196326"},{"t":"“It has no calcium.”","why":"It keeps the calcium.","_n":"4hd1a","_k":"ca64fc0a"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which statement about basal metabolic rate is accurate?","options":[{"t":"“BMR is the energy used at rest for vital functions, and it changes with lean body mass, age, growth and hormones.”","why":"Metabolism is every chemical reaction in your body. BMR changes with lean mass, age, growth, hormones, illness and pregnancy.","_n":"4id0a","_k":"8e6f66d5"},{"t":"“BMR only depends on how much you eat.”","why":"Body composition, age, growth and hormones all matter.","_n":"4jd7a","_k":"522b5e1e"},{"t":"“BMR is fixed at birth.”","why":"Metabolism is every chemical reaction in your body. BMR changes with lean mass, age, growth, hormones, illness and pregnancy.","_n":"4kd6a","_k":"cbccd8ce"},{"t":"“BMR is the energy used during exercise.”","why":"That’s activity energy.","_n":"4ld5a","_k":"55942f1a"}]},"b":{"prompt":"Which best describes catabolism and anabolism?","options":[{"t":"“Catabolism breaks molecules down and releases energy; anabolism uses energy to build molecules such as glycogen and proteins.”","why":"Metabolism is every chemical reaction in the body: catabolism breaks down, anabolism builds.","_n":"4md4a","_k":"c6b40d65"},{"t":"“Both are types of digestion.”","why":"They happen in cells after absorption.","_n":"4ncba","_k":"a6d16f76"},{"t":"“Catabolism builds; anabolism breaks down.”","why":"Reversed.","_n":"4ocaa","_k":"2b3255c0"},{"t":"“Anabolism only happens during exercise.”","why":"Building happens all the time, including growth and repair.","_n":"4pcda","_k":"be2bb752"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Lin, 16, is lactose intolerant. Which change best protects her calcium intake?","options":[{"t":"Take lactase only on weekends","why":"Doesn’t solve daily calcium needs.","_n":"4qcea","_k":"a1ac7f7a"},{"t":"Switch to lactose-free milk or a fortified soy beverage","why":"Both supply calcium without the lactose.","_n":"4rcfa","_k":"88549659"},{"t":"Stop all calcium foods","why":"Calcium is still essential.","_n":"4sd0a","_k":"6276a3a4"},{"t":"Drink juice instead of milk","why":"Most juice isn’t a calcium source.","_n":"4td1a","_k":"d428bbae"}]},"b":{"prompt":"Mo has celiac disease and wants a gluten-free breakfast with fibre. Which fits?","options":[{"t":"A plain gluten-free white bread","why":"Gluten-free but low in fibre.","_n":"4ud2a","_k":"12e1f880"},{"t":"Oatmeal labelled gluten-free, topped with berries","why":"Oats labelled gluten-free avoid cross-contact, and oats and berries bring fibre.","_n":"4vd3a","_k":"4f8ca149"},{"t":"Barley cereal","why":"Barley contains gluten.","_n":"4wd4a","_k":"09943874"},{"t":"Whole wheat toast","why":"Wheat contains gluten.","_n":"4xc5a","_k":"a3b1a6a7"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A student says, “Fibre is pointless; it just passes through.” Which reply uses evidence best?","options":[{"t":"“Fibre is only in supplements.”","why":"Vegetables, fruits, whole grains and legumes are rich in it.","_n":"4yc6a","_k":"d838e749"},{"t":"“Fibre is digested in the stomach.”","why":"Human enzymes can’t digest it.","_n":"4z47a","_k":"1e40e33e"},{"t":"“Fibre slows how fast sugars are absorbed, keeps you full, adds bulk, and feeds gut bacteria that make short-chain fatty acids.”","why":"Fibre adds bulk, slows how fast sugars are absorbed, and feeds gut bacteria that make short-chain fatty acids.","_n":"5046a","_k":"21267b39"},{"t":"“Fibre gives a lot of energy.”","why":"Very little, compared with other carbohydrates.","_n":"5149a","_k":"7288862c"}]},"b":{"prompt":"During exams, a student often gets a stomach-ache. Which explanation fits best?","options":[{"t":"“Stress digests food faster.”","why":"Stress usually slows digestion.","_n":"5248a","_k":"4b00bd72"},{"t":"“Stress makes the stomach absorb more.”","why":"The stomach starts protein digestion and churns food, but most chemical digestion and nearly all nutrient absorption happen in the small intestine.","_n":"5343a","_k":"6d951abc"},{"t":"“Exam food has more bile.”","why":"Bile doesn’t come from food.","_n":"5442a","_k":"000ee996"},{"t":"“The stress response shifts the body away from digestion, slowing it and sometimes causing discomfort.”","why":"Digestion slows under stress; some people get stomach-aches.","_n":"5545a","_k":"6a657047"}]}}]},"task":{"title":"Pack Lin’s lunch","summary":"Pack Lin’s lunch","statement":"\u003cp>Lin, 16, is lactose intolerant and has soccer after school. Choose one item from each row to pack a lunch that meets every condition. Can you find three different lunches?\u003c/p>","rows":[{"id":"g","t":"Grain","items":[{"id":"G1","t":"Whole wheat pita","fibre":4},{"id":"G2","t":"White bagel","fibre":1},{"id":"G3","t":"Brown rice salad","fibre":3}]},{"id":"p","t":"Protein","items":[{"id":"P1","t":"Hummus","fibre":2,"fat":true},{"id":"P2","t":"Chickpea salad with oil dressing","fibre":6,"fat":true},{"id":"P3","t":"Turkey slices","fibre":0},{"id":"P4","t":"Canned salmon with bones","fibre":0,"fat":true,"ca":true}]},{"id":"v","t":"Vegetable or fruit","items":[{"id":"V1","t":"Baby carrots","fibre":2,"bc":true},{"id":"V2","t":"Apple","fibre":3},{"id":"V3","t":"Cucumber slices","fibre":1},{"id":"V4","t":"Mango","fibre":2,"bc":true}]},{"id":"d","t":"Drink","items":[{"id":"D1","t":"Water"},{"id":"D2","t":"Regular milk","lactose":true,"ca":true},{"id":"D3","t":"Lactose-free milk","ca":true},{"id":"D4","t":"Fortified soy beverage","ca":true},{"id":"D5","t":"Sports drink","sugary":true}]}],"tags":{"fat":"contains fat","ca":"calcium source","bc":"beta-carotene","lactose":"contains lactose","sugary":"sugary"},"checks":["Lactose-free lunch","At least 6 g of fibre","A calcium source","Beta-carotene eaten with some fat","Not a sugary drink"],"tips":["Regular milk contains lactose; try lactose-free milk or fortified soy.","Add up the fibre: whole grains and legumes help most.","Calcium can come from the drink or from salmon with its bones.","Vitamin A from carrots or mango is fat-soluble; pair it with a protein that contains fat.","Water or milk is better than a sugary drink."],"explainPrompt":"Explain how your lunch works with Lin’s digestion: lactose, fibre, and how vitamin A gets absorbed.","vocab":"Use the words lactase, fibre, fat-soluble and absorption.","checkLabel":"Check my lunch","success":"This lunch works for Lin.","more":"There’s more than one answer. Can you find another?","after3":"There are 26 lunches in all. Notice that water only works when the salmon brings the calcium."},"cards":[["Mechanical vs chemical digestion","Physical breaking (chewing, churning) vs changing molecules (enzymes, acid)."],["Salivary amylase","Mouth: starts breaking starch into shorter chains."],["Pepsin","Stomach: starts protein digestion in acid."],["Bile","Made by the liver, stored in the gallbladder; \u003cstrong>emulsifies\u003c/strong> fat. Not an enzyme."],["Lipase","Pancreas → small intestine: triglycerides → fatty acids + monoglycerides."],["Villi and microvilli","Finger-like folds that give the small intestine a huge absorbing surface."],["Two absorption routes","Water-soluble → capillaries → liver; fat-soluble → chylomicrons → lacteals → lymph."],["Large intestine","Absorbs water and electrolytes; bacteria ferment fibre."],["Fibre’s jobs","Bulk, fullness, slower sugar absorption, food for gut bacteria."],["Metabolism","Every chemical reaction in the body: catabolism (break down) + anabolism (build)."],["BMR","Energy used at rest for vital functions; changes with lean mass, age, growth, hormones."],["Allergy vs intolerance","Immune reaction (can be life-thr
