.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 01: influence web (hero, Explore, task), persona panel, marketing stations, inquiry builder, task cards */
/* radio groups */
.fw-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fw-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.fw-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.fw-rg.seg button:disabled{opacity:.45}
.fw-chipset{display:flex;flex-wrap:wrap;gap:6px}
.fw-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px}
.fw-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fw-chipset button:not(:disabled):hover{border-color:var(--pen)}

/* influence web */
.fw-svg{display:block;width:100%;height:auto;max-width:440px;margin:0 auto}
.fw-svg text{font-family:var(--font-ui)}
.fw-th{fill:none;stroke:var(--ink-2);stroke-linecap:round}
.fw-th.none{stroke-dasharray:3 6}
.fw-halo{fill:none;stroke:var(--hi);stroke-linecap:round;opacity:0}
.fw-halo.on{opacity:.85;animation:fw-pulse .5s ease-in-out 6 alternate}
@keyframes fw-pulse{from{opacity:.95}to{opacity:.2}}
.fw-icb{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.fw-ic path,.fw-ic rect,.fw-ic circle:not(.fw-icb){fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fw-lab{fill:var(--ink);font-size:15px;font-weight:700}
.fw-lvl{fill:var(--ink-2);font-size:13px}
.fw-tray rect{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.fw-tray path,.fw-tray circle{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.fw-tray text{fill:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em}
.fw-hero{max-width:460px;margin:0 auto}
.fw-cap{opacity:0;transition:opacity .8s}
.fw-cap.fw-cap-on{opacity:1}

/* Explore layout (F1 persona panel) */
.fw-top{display:grid;gap:10px;margin:0 0 16px}
.fw-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.fw-k{flex:0 0 5.5rem;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.fw-profile{padding:10px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.fw-profile p{margin:0 0 .4em;max-width:none}
.fw-profile p:last-child{margin:0}
.fw-webbox{position:relative}
.fw-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;text-align:center}
.fw-slide-card{max-width:30ch;padding:14px 16px;border:2px solid var(--ink);border-radius:8px;background:var(--paper)}
.fw-slide-k{margin:0 0 6px;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.fw-quote{margin:0;font:400 1.25rem/1.35 var(--font-math)}
.fw-tpe{max-width:32ch;padding:10px 14px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px;text-align:left}
.fw-tpe p{margin:0}
.fw-tpe-t{font-weight:700}
.fw-how{margin:0 0 10px}
.fw-dials{display:grid;gap:8px}
.fw-dial{display:grid;grid-template-columns:minmax(9rem,12rem) minmax(0,1fr);align-items:center;gap:4px 12px}
.fw-dial-lab{font-weight:700;font-size:.95rem}
.fw-dial .seg button{padding:.35em .7em;min-width:3.4rem}
.fw-ev{margin:.4em 0 0;padding-left:1.2em}
.fw-ev li{margin:0 0 .3em}
.fw-levers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fw-lever{display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.55em .75em;min-width:0}
.fw-lever:not(:disabled):hover{border-color:var(--pen)}
.fw-lever[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.fw-lv-t{font-weight:700;line-height:1.3}
.fw-lv-m{font-size:.82rem;color:var(--ink-2)}
.fw-choice{border-radius:3px;transition:background 1.2s}
.fw-choice.fw-flash{background:var(--hi-soft)}

/* Part 3 stations */
.mk-st{margin:0 0 16px}
.mk-adbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 12px}
.mk-ad{max-width:620px;margin:0 auto;padding:12px;border:2px solid var(--ink);border-radius:12px;background:var(--paper)}
.mk-made{margin:0 0 8px;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.mk-brand{margin:0 0 8px;font:600 1.4rem var(--font-math)}
.mk-box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;margin:0 0 8px;border:3px solid var(--p-k);border-radius:8px;background:var(--sheet)}
.mk-box .mk-brand{grid-column:1/-1}
.mk-story{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mk-phone{max-width:380px}
.mk-screen{display:grid;gap:8px;padding:12px;border:2px solid var(--ink-2);border-radius:18px;background:var(--sheet)}
.mk-handle{margin:0;font-weight:700}
.mk-cap{margin:0}
.mk-spot{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;min-width:0;text-align:center;border:2px dashed var(--ink-2);background:var(--sheet);border-radius:8px;padding:.5em .55em}
.mk-spot:not(:disabled):hover{border-color:var(--pen);border-style:solid}
.mk-spot[aria-pressed="true"]{border:2px solid var(--ink);background:var(--hi-soft);box-shadow:0 0 0 3px var(--hi-soft)}
.mk-spot.done{border:2px solid var(--green);background:var(--good-bg);color:var(--ink)}
.mk-spot-t{font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
.mk-badge{font-size:.8rem;font-weight:700;color:var(--ink)}
.mk-ico{width:44px;height:44px;flex:0 0 auto}
.mk-ico.mk-wide{width:96px}
.mk-tagbar{margin:12px 0 0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.mk-tagbar p{margin:0 0 8px;max-width:none}
.mk-tags{display:flex;flex-wrap:wrap;gap:6px}
.mk-tag{border:1.5px solid var(--ink-2);background:var(--sheet);border-radius:999px;padding:.3em .8em;font-size:.9rem;min-height:34px;text-align:left}
.mk-tag:not(:disabled):hover{border-color:var(--pen)}
.mk-tag:disabled{opacity:.5}
.mk-howbox{margin-top:12px;padding:10px 14px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.mk-howbox ul{margin:0;padding-left:1.2em}
.mk-real{margin-top:20px}
.mk-realbox .mk-slot:first-of-type{margin-top:4px}
.mk-slot{margin:0 0 16px;padding:12px;border:1.5px solid var(--rule);border-radius:8px}
.mk-slot h5{margin:0 0 8px;font-size:.95rem}
.mk-slot-in{display:flex;flex-wrap:wrap;gap:10px 14px;margin:0 0 10px}
.mk-slot-in label{display:grid;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
.mk-slot-in .txtin{width:13rem;max-width:100%}
.mk-file input{max-width:100%;font-size:.85rem}
.mk-fig{margin:0 0 10px}
.mk-fig img{display:block;max-width:100%;max-height:360px;border:1.5px solid var(--rule);border-radius:6px}
.mk-fig figcaption{font-size:.85rem;color:var(--ink-2);margin-top:4px}
.mk-crit{margin:0;padding-left:1.2em}
.mk-chartbox{margin:0 0 8px;max-width:560px}
.mk-chartbox figcaption{margin:0 0 6px}
.mk-chart{display:block;width:100%;height:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.mk-chart text{font-family:var(--font-ui)}
.mk-grid{stroke:var(--plot-grid);stroke-width:1}
.mk-axis{fill:none;stroke:var(--plot-axis);stroke-width:1.5}
.mk-ax{fill:var(--ink-2);font-size:12px}
.mk-val{fill:var(--ink);font-size:13px;font-weight:700}
.mk-bar{fill:var(--pen)}
.mk-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin:0 0 16px}
.mk-card{padding:12px 14px;border:1.5px solid var(--rule);border-left:4px solid var(--ink);border-radius:6px;background:var(--paper)}
.mk-card p{margin:0}

/* Practice 2: inquiry set */
.aq-data{max-width:560px;margin:0 0 6px}
.aq-data p{margin:0 0 6px}
.aq-slot{margin:10px 0 0}
.aq-slot-l{margin:0 0 6px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.aq-chips{display:flex;flex-wrap:wrap;gap:6px}
.aq-chip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.35em .75em;font-size:.92rem;text-align:left;min-height:34px;max-width:100%}
.aq-chip[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.aq-chip:not(:disabled):hover{border-color:var(--pen)}
.aq-preview{margin-top:12px;padding:10px 14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.aq-preview p{margin:0;max-width:none}
.aq-gap{color:var(--ink-2);font-style:italic}

/* Performance task */
.tk-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 14px}
.tk-card{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.5em .7em;min-width:0}
.tk-card:hover{border-color:var(--pen)}
.tk-card[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tk-id{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.tk-t{font-weight:700;line-height:1.3;margin-bottom:2px}
.tk-m{font-size:.82rem;color:var(--ink-2)}
.tk-m b{color:var(--ink)}
.tk-note{font-style:italic}
.tk-web{max-width:420px;margin:0 auto}

@media (max-width:560px){
  .fw-k{flex-basis:100%}
  .fw-dial{grid-template-columns:minmax(0,1fr)}
  .fw-levers,.tk-cards{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px;scroll-snap-type:x proximity}
  .fw-lever,.tk-card{flex:0 0 78%;scroll-snap-align:start}
  .mk-box{grid-template-columns:minmax(0,1fr)}
  .mk-story{grid-template-columns:minmax(0,1fr)}
}

g> (time, distance, skills), \u003cstrong>social and cultural\u003c/strong> ties (family, culture, faith, friends), \u003cstrong>psychology\u003c/strong> (mood, stress, habit) and \u003cstrong>media\u003c/strong> (ads, creators, labels). These \u003cstrong>influences\u003c/strong> pull at the same time. In this module you’ll map them for real-life situations, then look hard at the one designed to pull hardest: \u003cstrong>food marketing\u003c/strong>.","fig":{"html":"\u003cdiv class=\"fw-hero\" id=\"fw-hero\">\u003c/div>","caption":""},"aria":"A lunch tray at the centre of six labelled threads: Biology, Money, Access and time, Family, culture and faith, Mood and habits, and Media. The Access and time thread tightens while a clock spins, and the packed lunch becomes a store-bought snack. Then the thread relaxes and the lunch returns.","caption":"Change one influence, and the choice can change."},"goals":["I can name the six kinds of influence on food choices and give an example of each.","I can explain how several influences work together in one person’s food choices.","I can describe how busy schedules, stress, expectations about body shape and scarcity can affect eating patterns.","I can identify food-marketing techniques aimed at young people and explain how they work.","I can write a focused research question about food choices and spot the limits of a survey’s conclusions.","I can discuss people’s food choices respectfully, without moral labels, considering culture, religion and cost."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Canada’s Food Guide habits","goal":1,"prompt":"Canada’s Food Guide (2019) gives advice beyond \u003cem>what\u003c/em> to eat. Which of these is one of its healthy eating habits?","options":[{"t":"Be aware of food marketing","why":"The guide lists it alongside cooking more often and eating with others.","_n":"0523","_k":"4557d5c6"},{"t":"Count calories at every meal.","why":"The guide is about patterns and habits, not counting.","_n":"1513","_k":"b47d7bab"},{"t":"Eat only foods grown in Canada.","why":"Local food can be a choice, but the guide doesn’t require it.","_n":"2503","_k":"872fb3e5"},{"t":"Avoid all foods with sugar.","why":"The guide advises limiting highly processed foods, not banning ingredients.","_n":"3573","_k":"42725d43"}],"hints":["Think about \u003cem>how\u003c/em> we eat, not just what.","The guide names habits like cooking more often and eating with others.","Be aware of food marketing."]},{"id":"w2","skill":"Influences on behaviour","goal":1,"prompt":"Which of these is a \u003cstrong>biological\u003c/strong> influence on food choice?","options":[{"t":"Seeing a snack in a creator’s video","why":"That’s media.","_n":"4563","_k":"77e924a1"},{"t":"A sale on cereal","why":"That’s economic.","_n":"5553","_k":"f784277b"},{"t":"A grandmother’s holiday recipes","why":"That’s a social and cultural influence.","_n":"6543","_k":"4d0ee0d5"},{"t":"Feeling full sooner after a high-fibre meal","why":"Fullness cues are biological.","_n":"75b3","_k":"6d1d8065"}],"hints":["Which one comes from inside the body?","Fullness is a body signal.","Feeling full sooner after a high-fibre meal."]},{"id":"w3","skill":"Influences on behaviour","goal":3,"prompt":"Which situation best shows a \u003cstrong>psychological\u003c/strong> influence on eating?","options":[{"t":"Skipping pork for religious reasons","why":"That’s religious, a social and cultural influence.","_n":"85a3","_k":"9ff5a646"},{"t":"Buying what the corner store stocks","why":"That’s physical access.","_n":"90ef","_k":"c5d0b54b"},{"t":"Eating r energy causes breakfast","why":"Possible, but not shown either.","_n":"l06f","_k":"e173c345"},{"t":"Breakfast causes higher energy","why":"A survey shows a pattern, not a cause.","_n":"m05f","_k":"1ce9ebff"},{"t":"The two are linked, but the survey doesn’t show that breakfast causes the energy","why":"Other factors, like sleep, could explain both.","_n":"n0cf","_k":"a9938669"}],"hints":["Pattern or proof?","Could sleep explain both?","A link, not a cause."]}],"refreshers":{"Canada’s Food Guide habits":"Beyond the plate, the 2019 guide lists habits: be mindful of your eating habits, cook more often, enjoy your food, eat meals with others, use food labels, limit highly processed foods, be aware of food marketing.","Influences on behaviour":"Sort influences by where they come from: the body (biological), money (economic), the environment and time (physical), people and traditions (social and cultural), the mind (psychological), messages (media).","Reading survey data":"Percentage = part ÷ whole × 100. A link between two things in a survey is a correlation; a cause needs more evidence."}}},"explore":{"heading":"Food choice web","intro":"Each person below faces a real food decision. Read their profile, set how strongly each influence is pulling, then change one thing and watch what happens.","influences":[{"k":"bio","name":"Biological","web":"Biological","hero":"Biology"},{"k":"eco","name":"Economic","web":"Economic","hero":"Money"},{"k":"acc","name":"Physical access and time","web":"Access and time","hero":"Access and time"},{"k":"soc","name":"Social and cultural","web":"Social and cultural","hero":"Family, culture and faith"},{"k":"psy","name":"Psychological","web":"Psychological","hero":"Mood and habits"},{"k":"med","name":"Media","web":"Media","hero":"Media"}],"levels":["none","low","medium","high"],"personas":[{"id":"devon","name":"Devon","age":17,"profile":"Works three evening shifts a week at a grocery store, plays basketball, and has 25 minutes for lunch.","sit ":"leftovers from home"},{"id":"bulk","t":"The family buys bread and fillings in bulk on city trips","inf":["eco"],"cost":"Saves about $5 a week","choice":"A sandwich from home every day","fx":{"eco":-1},"en":"bulk buying"},{"id":"table","t":"Friends share a lunch table and swap food","inf":["soc"],"cost":"$0","choice":"Trades half a sandwich for a friend’s samosa","fx":{"soc":1},"en":"friends who share"},{"id":"snackprice","t":"The convenience store raises snack prices","inf":["eco"],"cost":"Snacks cost more","choice":"A sandwich from home, and fewer store snacks","fx":{"eco":1},"bar":"pricier snacks"},{"id":"drinkad","t":"Sees an ad for a new energy drink on his phone","inf":["med"],"cost":"$3 a can","choice":"Adds the energy drink to his lunch","fx":{"med":1},"bar":"the ad"}]}]},{"id":"meilin","name":"Mei-Lin","age":17,"profile":"Vegetarian for ethical reasons, follows several food creators online, and is in exam season.","sits":[{"id":"meilin-exam","name":"Exam-week late night","note":"It’s 10 p.m. during exams. She studies at home, often skips dinner, and watches food videos on her breaks.","choice":"Skips dinner, snacks on energy bars","barrier":"exam stress","enabler":"food in the house","_a":"bVYVU0kKHQQaVxVQOA==","ev":{"bio":"She’s hungry after skipping dinner: a real pull, but not the main driver.","eco":"Nothing suggests money is the barrier.","acc":"Exam time is tight, but there’s food in the house.","soc":"She’s studying alone tonight, so people aren’t shaping this choice much.","psy":"Exam stress is the strongest pull: stress and habit drive the late-night snacking.","med":"She follows several food creators, and their posts pull at her during breaks."},"levers":[{"id":"batch","t":"Batch-cooks a lentil curry on Sunday","inf":["acc"],"cost":"$0 extra","choice":"Reheated curry and rice","fx":{"acc":-1},"en":"a meal ready ahead"},{"id":"group","t":"Study group shares food","inf":["soc"],"cost":"$0","choice":"A shared meal at a friend’s house","fx":{"soc":1},"en":"the study group"},{"id":"sponsored","t":"Follows a creator’s “study snacks” sponsored post","inf":["med"],"cost":"$12 a box","choice":"Buys the advertised energy bars","fx":{"med":1},"bar":"the sponsored post"},{"id":"reminder","t":"Sets a phone reminder to eat dinner","inf":["psy"],"cost":"$0","choice":"Eats dinner before studying","fx":{"psy":-1},"en":"a dinner reminder","infNote":"Psychological (habit)"},{"id":"review","t":"Extra exam review runs until 9 p.m.","inf":["acc"],"cost":"$0","choice":"Gets home late and snacks on energy bars","fx":{"acc":1},"bar":"a late review session"},{"id":"mute","t":"Mutes food-delivery app notifications","inf":["med"],"cost":"$0","choice":"Fewer late-night prompts, but still snacks on energy bars","fx":{"med":-1},"en":"fewer prompts"}],"pairs":{"batch+group":"Eats a full meal: curry and rice, shared with the study group","batch+reminder":"Eats a full meal: reheated curry and rice, before studying","group+reminder":"Eats a full meal: dinner with the study group, before the evening session"}},{"id":"meilin-brunch","name":"Weekend brunch with friends","note":"Her friends pick a café they saw online. She checks the menu for vegetarian dishes.","choice":"The one vegetarian dish on the menu, or toast","barrier":"few vegetarian dishes","enabler":"friends who share plates","model":[1,1,1,3,1,2],"levers":[{"id":"suggest","t":"Suggests a café with a full vegetarian menu","inf":["soc"],"cost":"About the same","choice":"Shares several vegetarian plates with friends","fx":{"soc":0},"en":"a vegetarian-friendly café"},{"id":"creator","t":"A creator she follows reviews a pancake place","inf":["med"],"cost":"About the same","choice":"Pancakes and fruit at the reviewed place","fx":{"med":1},"bar":"the creator’s review"},{"id":"potluck","t":"Friends switch to a potluck brunch at home","inf":["soc","eco"],"cost":"About $5 for her dish","choice":"A potluck, including her chickpea salad","fx":{"soc":0,"eco":-1},"en":"a potluck"},{"id":"diner","t":"One friend is saving money and suggests a cheaper diner","inf":["eco"],"cost":"Saves about $8","choice":"A diner breakfast: eggs, toast and potatoes","fx":{"eco":1},"bar":"a tighter budget for the group"},{"id":"late","t":"Brunch moves to 1 p.m.","inf":["bio"],"cost":"$0","choice":"Very hungry by brunch, so she orders the biggest vegetarian dish","fx":{"bio":1},"bar":"a late meal"},{"id":"newdish","t":"Decides to try one new dish each week","inf":["psy"],"cost":"$0","choice":"Tries something new: shakshuka","fx":{"psy":0},"en":"curiosity"}]}]}],"fictional":"All four people are fictional.","modes":{"read":"Read the web","change":"Change one thing"},"text":{"dialsHow":"Set how strongly each influence pulls on this choice, using the evidence in the profile.","leversHow":"Choose up to two levers. Press a lever again to remove it.","lockedKey":"Dials are locked to the key for this situation.","lockedModel":"Dials are locked to the model’s web for this situation.","noKey":"There’s no answer key for this situation, so your web is reported but not marked. Compare each setting with the evidence in the profile. Situations with a key: Devon’s after-practice snack, Amira’s weeknight dinner, Tomas’s weekly groceries and Mei-Lin’s exam-week late night.","allMatch":"Your web matches the evidence in the profile.","slideLabel":"Survey slide","slideQuote":"“Most teens say ads influence \u003cem>other\u003c/em> teens more than themselves.”","tpeTitle":"Third-person effect","tpeText":"Believing media affects other people more than yourself."},"predictions":[{"id":"p1","start":{"p":"tomas","s":"tomas-groc"},"lever":"delivery","prompt":"Tomas, weekly groceries. Which change would most likely increase the fresh vegetables Tomas’s family buys?","options":[{"t":"A poster about vegetables at school","_n":"o0bf","_k":"778329be"},{"t":"A new fast-food outlet in town","_n":"p0af","_k":"ec7ead02"},{"t":"An app that counts servings","_n":"q09f","_k":"1d4d450f"},{"t":"Online grocery delivery reaches his town","_n":"r10f","_k":"303bda25"}],"explain":"Tomas’s main barriers are distance and cost. Information alone doesn’t move a 40 km drive."},{"id":"p2","start":{"p":"amira","s":"amira-snack"},"lever":"program","prompt":"Amira, after-school snack. Amira’s school launches a free after-school snack program with halal-certified options. What changes?","options":[{"t":"She stops eating dinner","_n":"s0ff","_k":"183b3b86"},{"t":"Nothing: snacks don’t matter to teens","_n":"t02f","_k":"95d0dff9"},{"t":"She buys more fast food","_n":"u03f","_k":"fde0edc1"},{"t":"She eats the program snack: economic and cultural barriers both drop","_n":"v04f","_k":"3ac5d7ea"}],"explain":"A change that fits her family’s food practices removes two barriers at once."},{"id":"p3","slide":true,"prompt":"A survey slide appears: “Most teens say ads influence \u003cem>other\u003c/em> teens more than themselves.” What does research on this pattern usually find?","options":[{"t":"Ads have no measurable effect","_n":"w05f","_k":"7fd6b4c5"},{"t":"People underestimate how much ads affect themselves","_n":"x06f","_k":"e91e39ee"},{"t":"Ads only affect children","_n":"y07f","_k":"6cb25909"},{"t":"Teens are immune to ads","_n":"z08f","_k":"3c29328d"}],"explain":"People tend to believe media affects others more than themselves."},{"id":"p4","start":{"p":"devon","s":"devon-practice"},"lever":"pack","prompt":"Devon, after-practice snack. Devon starts packing a snack the night before. Which influence did he change?","options":[{"t":"Economic","_n":"1009f","_k":"f1f48017"},{"t":"Biological","_n":"110af","_k":"2b2abb5a"},{"t":"Access and time","_n":"120bf","_k":"bde090e5"},{"t":"Media","_n":"130d0","_k":"5f2c23c7"}],"explain":"He moved the decision to a time when he had time."}],"challenges":[{"id":"tc1","goal":[1,2],"sit":"devon-practice","prompt":"Set the dials for \u003cstrong>Devon’s after-practice snack\u003c/strong> to match his profile. (Use \u003cstrong>Read the web\u003c/strong>.)","wrong":{"eco":"Devon earns money from his job; cost isn’t his main barrier.","med":"Nothing in his profile mentions ads or creators.","bio":"He’s just finished practice: hunger is pulling hard."},"start":"Choose Devon, then his after-practice snack, and set the six dials in \u003cstrong>Read the web\u003c/strong>.","general":"Not yet. Read the profile again for clues: the job, the training, the time.","why":"Training makes hunger high, the job means cost isn’t the barrier, and the half-hour gap before work makes time pull hard.","hints":["Read the profile for clues: the job, the training, the time.","Training makes hunger high; a 25-minute lunch makes time tight.","High, low, high, medium, low, low."]},{"id":"tc2","goal":[1,2],"sit":"tomas-groc","prompt":"Find a lever that gives \u003cstrong>Tomas’s family\u003c/strong> more fresh produce \u003cstrong>without\u003c/strong> adding a cost above $5 a week. (Use \u003cstrong>Change one thing\u003c/strong>.)","_a":"bUZaEQQaHRdEDV0HR2U=","wrong":{"delivery":"It works, but the delivery fee in the lever card is $10 a week.","poster":"Information doesn’t change distance or price.","price":"That makes it harder.","fastfood":"A takeout outlet doesn’t add fresh produce to the grocery list.","many":"Pick one lever only: the challenge asks for a single change."},"start":"Choose Tomas, then his weekly groceries, switch to \u003cstrong>Change one thing\u003c/strong>, and pick a lever.","general":"Check each lever card’s weekly cost and what it changes.","why":"Both ease the 40 km distance. The vegetable box replaces store purchases at no extra cost, and the rideshare costs $4 a week.","hints":["Check each lever card’s weekly cost.","Which levers are $5 or less a week?","The community-supported agriculture pickup, or the rideshare."]},{"id":"tc3","goal":[1,2],"sit":"meilin-exam","stretch":true,"prompt":"Mei-Lin’s exam-week late night: choose \u003cstrong>two\u003c/strong> levers that change her likely choice from “skips dinner, snacks on energy bars” to “eats a full meal”, using \u003cstrong>no media lever\u003c/strong> and changing \u003cstrong>two different influences\u003c/strong>.","_a":"bT8bAARMUl0USBsFF1dERRQ5FTlHWlBBVQwbTkdKVFhfCl0HFxpsGW1GXhAKTUEXGkZLBwhRX1FTFhs/OA==","wrong":{"media":"That lever is media, and it leads to the advertised bars.","same":"Both act on the same influence. Try two different ones.","mute":"Muting app notifications is a media lever too. This challenge asks for no media lever.","barrier":"That pair doesn’t end in a full meal: the late review session adds a time barrier. Choose two levers that each ease a barrier.","one":"Choose a second lever: the challenge needs two."},"start":"Choose Mei-Lin, then her exam-week late night, switch to \u003cstrong>Change one thing\u003c/strong>, and pick two levers.","general":"Look at the likely choice: it has to become a full meal.","why":"Two different barriers eased at once (time, people or habit), with no advertised bars involved.","hints":["Which levers act on time, on people, or on habit?","Avoid the sponsored post.","For example: batch-cook on Sunday, plus a phone reminder."]}],"blocks":[{"title":"What the web shows","html":"\u003cp>Influences pile up. Changing one lever can change the choice, and the levers that work best usually change \u003cstrong>access, time or cost\u003c/strong>, not willpower. That’s why this course explains food choices from the inside, never with labels like “good food” or “bad choices”.\u003c/p>"}]},"part3":{"slug":"marketing","name":"Marketing","heading":"Marketing on the menu","intro":"Marketing is the one influence built to change choices on purpose. Take it apart in three stations: spot the techniques, check a chart, then look at the rules.","stations":[{"id":"spot","t":"1. Technique spotter"},{"id":"data","t":"2. Check it with data"},{"id":"rules","t":"3. The rules"}],"spotIntro":"Four practice-model ads, made for this course. Tap a part of an ad, then tap the technique it uses. Each correct tag shows how the technique works.","techniques":[{"id":"mascot","name":"Cartoon characters or mascots","how":"A friendly character gives the product a personality that children remember and ask for by name."},{"id":"endorse","name":"Athlete or celebrity endorsement","how":"Admiration for the star rubs off on the product, and suggests it helps people perform like them."},{"id":"creator","name":"Influencer or creator content (sponsored)","how":"A paid post looks like a friend’s recommendation, so it feels more trustworthy than an ad."},{"id":"games","name":"Contests, games and apps","how":"A game or contest keeps you with the brand for minutes instead of seconds, and gives you a reason to come back."},{"id":"limited","name":"Limited-time offers","how":"A deadline creates urgency, so people decide quickly instead of comparing options."},{"id":"halo","name":"“Health halo” claims (“made with real fruit”)","how":"One healthy-sounding detail in big type makes the whole product feel healthy."},{"id":"shelf","name":"Bright packaging placed at eye level","how":"Bright colours catch the eye, and products at eye level (including a child’s eye level) get picked up more often."}],"ads":[{"id":"cereal","name":"Cereal box","brand":"Comet Crunch","spots":[{"id":"a1","t":"Cosmo, a cartoon fox, waves from the box","_a":"FAlYEQZXRRc=","cue":"Who is this character, and who is it drawn for?"},{"id":"a2","t":"“Made with real fruit!” in a big star","_a":"FAxYDgoa","cue":"Read the claim. Does one healthy-sounding detail make the whole cereal feel healthy?"},{"id":"a3","t":"Scan the box to play Comet Run","_a":"FANYDwBLEw==","cue":"What does the box invite you to do after you buy it?"},{"id":"a4","t":"Bright box on the bottom shelf, at a child’s eye level","_a":"FBdRBwleEw==","cue":"Look at where the box sits and how it looks."}]},{"id":"drink","name":"Sports-drink video","brand":"VoltUp","spots":[{"id":"b1","t":"Frames 1–2: a star basketball player laces up, then drinks VoltUp courtside: “Play like a champion.”","_a":"FAFXBgpKQlAU","cue":"Who appears in the video, and why would the brand pay them?"},{"id":"b2","t":"Frame 3: “Playoff edition. Only until June.”","_a":"FAhQDwxMVFEU","cue":"What does “only until June” push you to do?"}]},{"id":"post","name":"Creator’s post","brand":"@study.with.sam","spots":[{"id":"c1","t":"“Paid partnership with BrightBar · #ad”, with the bars in every shot","_a":"FAdLBwRMXkcU","cue":"What does “paid partnership” and #ad tell you about this post?"},{"id":"c2","t":"“Use code SAM15 for 15% off, this week only!”","_a":"FAhQDwxMVFEU","cue":"What does “this week only” push you to do?"},{"id":"c3","t":"“Packed with protein, basically a health food!”","_a":"FAxYDgoa","cue":"Does one nutrient make a whole snack a “health food”?"}]},{"id":"app","name":"Fast-food app","brand":"QuickBite","spots":[{"id":"d1","t":"Spin the wheel to win free fries","_a":"FANYDwBLEw==","cue":"What kind of activity is a prize wheel inside an app?"},{"id":"d2","t":"Today only: $5 combo","_a":"FAhQDwxMVFEU","cue":"What does “today only” push you to do?"}]}],"made":"Practice model made for this course","real":{"title":"Real examples (your teacher chooses)","intro":"Your teacher will share two current real ads or posts aimed at teens, with the source and date: one that uses a creator or influencer, and one that uses a health halo claim. Add a screenshot to look at it here. The picture stays on this page only: it isn’t saved or sent anywhere.","slots":["Example 1: a creator or influencer","Example 2: a health halo claim"],"prompts":["Which techniques?","Who is the audience?","What is left out?"],"criteria":["Names at least two techniques and supports each with a visible feature.","Says who the audience is and points to the clue.","Names something the ad leaves out, such as the price, the ingredients or who paid for it."],"credit":"Shown for education (fair dealing)."},"data":{"title":"Average food and drink ads seen per day online, by age group","unit":"ads per day","groups":[["Ages 2–11",15],["Ages 12–14",25],["Ages 15–17",30],["Ages 18–24",20]],"note":"Model data, made for this course. Your teacher may swap in a verified source.","questions":[{"id":"g1","prompt":"Which age group sees the most food and drink ads per day in this chart?","options":[{"t":"Ages 18–24","why":"That bar is 20. Look for the tallest one.","_n":"140c0","_k":"3e7a479f"},{"t":"Ages 12–14","why":"That bar is 25. One bar is taller.","_n":"150f0","_k":"ff3ec313"},{"t":"Ages 2–11","why":"That’s the shortest bar. Look for the tallest one.","_n":"160e0","_k":"fcab6f0b"},{"t":"Ages 15–17","why":"The 15–17 bar is the tallest: 30 ads per day.","_n":"17090","_k":"8b5ee351"}]},{"id":"g2","prompt":"How many more ads per day does the 15–17 group see than the 2–11 group?","options":[{"t":"15 more","why":"30 − 15 = 15 more ads per day.","_n":"18080","_k":"9b0c2e9b"},{"t":"45 more","why":"That adds the two bars. “How many more” means subtract.","_n":"190b0","_k":"7cd0632b"},{"t":"5 more","why":"That compares 15–17 with 12–14. Check which groups the question names.","_n":"1a0a0","_k":"2d5ea120"},{"t":"30 more","why":"30 is the 15–17 bar on its own. Subtract the 2–11 bar.","_n":"1b150","_k":"195e5db0"}]},{"id":"g3","multi":true,"prompt":"What would you need to know to trust this chart? Select every one that applies.","options":[{"t":"Who collected the data (the source)","_n":"1c140","_k":"8ad68607"},{"t":"Who was surveyed, and how many people (the sample)","_n":"1d870","_k":"b32c1f90"},{"t":"When the data was collected (the date)","_n":"1e880","_k":"d03af1e2"},{"t":"Whether the bars are colourful","_n":"1f850","_k":"f3a3b8b3"},{"t":"Whether you agree with it","_n":"1g860","_k":"0fca1b59"}],"why":"Source, method and date are the first checks.","wrongWhy":"Colours and your own opinion don’t make data more or less trustworthy. Check the source, the sample and the date."}]},"rules":{"cards":["Quebec’s Consumer Protection Act has limited commercial advertising directed at children under 13 since 1980.","Health Canada has worked on restricting food marketing to children.","Canada’s Food Guide lists “Be aware of food marketing” as a healthy eating habit (Health Canada, 2019)."],"prompt":"Should marketing rules protect 16-year-olds too? Give one reason for and one against.","labels":["One reason for","One reason against"],"note":"This is a reflection, not scored. It saves on this device."},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Consumer Protection Act, CQLR c P-40.1.\u003c/li>\u003cli>Davison, W. P. (1983). The third-person effect in communication. \u003ci>Public Opinion Quarterly, 47\u003c/i>(1), 1–15.\u003c/li>\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Marketing quick check","summary":"Marketing quick check","items":[{"id":"q1","goal":4,"prompt":"A drink label says “made with real fruit” in large type; the ingredient list shows mostly sugar and water. Technique?","choices":[{"t":"Contest","fb":"A small truth in big type makes the whole product feel healthy.","_n":"1h8b0","_k":"2894176a"},{"t":"Health halo","fb":"Right. A small truth in big type makes the whole product feel healthy.","_n":"1i8c0","_k":"24753175"},{"t":"Endorsement","fb":"A small truth in big type makes the whole product feel healthy.","_n":"1j890","_k":"f415e7b3"},{"t":"Mascot","fb":"A small truth in big type makes the whole product feel healthy.","_n":"1k8a0","_k":"ecddcac2"}]},{"id":"q2","goal":4,"prompt":"A creator posts a snack “haul” with #ad. What does #ad tell you?","choices":[{"t":"It’s a scientific study","fb":"A disclosure means the brand paid for or supplied it.","_n":"1l8f0","_k":"6e50389a"},{"t":"It’s a recipe","fb":"A disclosure means the brand paid for or supplied it.","_n":"1m900","_k":"2e810c3a"},{"t":"It’s paid promotion","fb":"Right. A disclosure means the brand paid for or supplied it.","_n":"1na10","_k":"c8fa0353"},{"t":"It’s a review","fb":"A disclosure means the brand paid for or supplied it.","_n":"1oa00","_k":"65359ddc"}]},{"id":"q3","goal":4,"prompt":"Cereal for children shelved at children’s eye level is mainly using…","choices":[{"t":"Endorsement","fb":"Where a product sits is a technique too.","_n":"1p9f0","_k":"f4d3ac85"},{"t":"Price","fb":"Where a product sits is a technique too.","_n":"1q9e0","_k":"2dc3415b"},{"t":"Nutrition claims","fb":"Where a product sits is a technique too.","_n":"1r9d0","_k":"fd1f3e19"},{"t":"Placement","fb":"Right. Where a product sits is a technique too.","_n":"1s9c0","_k":"d67616a8"}]},{"id":"q4","goal":[4,5],"prompt":"Which question best tests whether a marketing chart is trustworthy?","choices":[{"t":"Who collected the data, how, and when?","fb":"Right. Source, method and date are the first checks.","_n":"1t9b0","_k":"5e7a33a2"},{"t":"Is it short?","fb":"Source, method and date are the first checks.","_n":"1u9a0","_k":"89cf3953"},{"t":"Is the chart colourful?","fb":"Source, method and date are the first checks.","_n":"1v990","_k":"3bf8c2d8"},{"t":"Do I agree with it?","fb":"Source, method and date are the first checks.","_n":"1w980","_k":"254cbe14"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Sort the influence","summary":"Sort the influence","noun":"situation","txt":true,"goal":[1,6],"instruction":"Each line describes one food choice. Sort it by the kind of influence behind it.","boxes":[{"id":"bio","label":"Biological"},{"id":"eco","label":"Economic"},{"id":"acc","label":"Access and time"},{"id":"soc","label":"Social and cultural"},{"id":"psy","label":"Psychological"},{"id":"med","label":"Media"}],"items":[{"id":"i1","t":"Craves salty food after a long run","_a":"FAZQDUc=","why":"Sweat loss and hunger are body signals.","goal":1,"wrong":{"eco":"Sweat loss and hunger are body signals.","acc":"Sweat loss and hunger are body signals.","soc":"Sweat loss and hunger are body signals.","psy":"Sweat loss and hunger are body signals.","med":"Sweat loss and hunger are body signals."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “after a long run”: what did the body just do?","Biological. Sweat loss and hunger are body signals."]},{"id":"i2","t":"Buys store-brand oats because they cost less","_a":"FAFaDUc=","why":"Price drives this one.","goal":1,"wrong":{"bio":"Price drives this one.","acc":"Price drives this one.","soc":"Price drives this one.","psy":"Price drives this one.","med":"Price drives this one."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “cost less”","Economic. Price drives this one."]},{"id":"i3","t":"Fasts during daylight hours in Ramadan","_a":"FBdWAUc=","why":"Religious practice is a social and cultural influence.","goal":[1,6],"wrong":{"bio":"Religious practice is a social and cultural influence.","eco":"Religious practice is a social and cultural influence.","acc":"Religious practice is a social and cultural influence.","psy":"Religious practice is a social and cultural influence.","med":"Religious practice is a social and cultural influence."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “Ramadan”, a religious practice","Social and cultural. Religious practice is a social and cultural influence."]},{"id":"i4","t":"Eats cereal for dinner after a 10-hour shift","_a":"FAVaAUc=","why":"Time and energy, not taste, decided this.","goal":1,"wrong":{"bio":"Time and energy, not taste, decided this.","eco":"Time and energy, not taste, decided this.","soc":"Time and energy, not taste, decided this.","psy":"Time and energy, not taste, decided this.","med":"Time and energy, not taste, decided this."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “after a 10-hour shift”","Access and time. Time and energy, not taste, decided this."]},{"id":"i5","t":"Snacks while bored scrolling at night","_a":"FBRKG0c=","why":"Boredom and habit are psychological.","goal":1,"wrong":{"bio":"Boredom and habit are psychological.","eco":"Boredom and habit are psychological.","acc":"Boredom and habit are psychological.","soc":"Boredom and habit are psychological.","med":"Boredom and habit are psychological."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “bored”","Psychological. Boredom and habit are psychological."]},{"id":"i6","t":"Tries a drink after seeing it in a creator’s video","_a":"FAlcBkc=","why":"The video introduced the drink.","goal":1,"wrong":{"bio":"The video introduced the drink.","eco":"The video introduced the drink.","acc":"The video introduced the drink.","soc":"The video introduced the drink.","psy":"The video introduced the drink."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “a creator’s video”","Media. The video introduced the drink."]},{"id":"i7","t":"Doesn’t like the taste of cilantro (it tastes soapy to some people)","_a":"FAZQDUc=","why":"Some taste differences are genetic.","goal":1,"wrong":{"eco":"Some taste differences are genetic.","acc":"Some taste differences are genetic.","soc":"Some taste differences are genetic.","psy":"Some taste differences are genetic.","med":"Some taste differences are genetic."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “tastes soapy to some people”: a difference in how bodies taste","Biological. Some taste differences are genetic."]},{"id":"i8","t":"Eats rice at every meal because that’s home cooking","_a":"FBdWAUc=","why":"Home food is cultural, and that’s not an exception.","goal":[1,6],"wrong":{"bio":"Home food is cultural, and that’s not an exception.","eco":"Home food is cultural, and that’s not an exception.","acc":"Home food is cultural, and that’s not an exception.","psy":"Home food is cultural, and that’s not an exception.","med":"Home food is cultural, and that’s not an exception."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “home cooking”","Social and cultural. Home food is cultural, and that’s not an exception."]},{"id":"i9","t":"Can’t cook because the apartment has only a microwave","_a":"FAVaAUc=","why":"Equipment and skills are part of access.","goal":1,"wrong":{"bio":"Equipment and skills are part of access.","eco":"Equipment and skills are part of access.","soc":"Equipment and skills are part of access.","psy":"Equipment and skills are part of access.","med":"Equipment and skills are part of access."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “only a microwave”","Access and time. Equipment and skills are part of access."]},{"id":"i10","t":"Chooses the cheaper of two lunch specials","_a":"FAFaDUc=","why":"Price is the deciding factor.","goal":1,"wrong":{"bio":"Price is the deciding factor.","acc":"Price is the deciding factor.","soc":"Price is the deciding factor.","psy":"Price is the deciding factor.","med":"Price is the deciding factor."},"hints":["Where does the pull come from: the body, money, the setting, people, the mind or messages?","Clue: “cheaper”","Economic. Price is the deciding factor."]}]},{"id":"inquiry","type":"custom","title":"Ask a better question","summary":"Ask a better question","star":true,"goal":[5,3],"instruction":"A model survey table, then six questions about what it can and can’t tell you. Some ask you to choose, some to enter a number, and one to build a survey question.","how":"Answer each item, then press Check. Percentages can be typed as 40 or 40%.","table":{"caption":"300 students surveyed about weekday breakfast","head":["Group","Eat breakfast most school days","Skip most school days"],"rows":[["School starts 8:00",90,60],["School starts 9:00",120,30]]},"items":[{"id":"r1","kind":"num","goal":5,"prompt":"What percentage of 8:00-start students skip breakfast?","_a":"AlQ=","unit":"%","wrong":[{"match":20,"fb":"60 of 150, not of 300."},{"match":60,"fb":"60 is the number of students who skip. Divide by the size of their group."}],"general":"Percentage = part ÷ whole × 100. Which whole?","why":"60 ÷ 150 = 0.4, so 40% of the 8:00-start students skip.","hints":["Percentage = part ÷ whole × 100. Which whole?","The 8:00-start group has 90 + 60 = 150 students.","60 ÷ 150 = 0.4, which is 40%."]},{"id":"r2","kind":"num","goal":5,"prompt":"What percentage of 9:00-start students skip?","_a":"BFQ=","unit":"%","wrong":[{"match":10,"fb":"30 ÷ 150."},{"match":80,"fb":"That’s the percentage who eat breakfast. The question asks who skips."}],"general":"Find the 9:00-start group’s total first.","why":"30 ÷ 150 = 0.2, so 20% of the 9:00-start students skip.","hints":["Find the 9:00-start group’s total first.","The 9:00-start group has 120 + 30 = 150 students.","30 ÷ 150 = 0.2, which is 20%."]},{"id":"r3","kind":"mc","star":true,"goal":5,"prompt":"Does this table prove a later start \u003cem>causes\u003c/em> more breakfast eating?","options":[{"t":"Yes: the 9:00-start group eats breakfast more often, so the start time causes it.","why":"Ask what else differs between the two groups. A difference between groups is a link, not proof.","_n":"1x9b0","_k":"2fa23f49"},{"t":"No: it shows a link; other differences between the schools (e.g. bus times, neighbourhood) could explain it.","why":"A pattern in survey data is a correlation. Another factor could explain both.","_n":"1y9c0","_k":"106ab692"},{"t":"No: 300 students are too few to show any pattern.","why":"300 students can show a pattern. The question is about cause: ask what else differs between the two groups.","_n":"1z9d0","_k":"743bd621"}],"hints":["Correlation or cause?","Name one other difference between the two schools.","No: a link, not proof."]},{"id":"r4","kind":"mc","star":true,"goal":5,"prompt":"Choose the best research question to investigate further.","options":[{"t":"How does school start time relate to breakfast eating among Grade 11 students in our board, after accounting for bus travel time?","why":"Focused, measurable, and it names the population and a factor to control.","_n":"209e0","_k":"cb837260"},{"t":"Is breakfast healthy?","why":"That’s a broad nutrition question this data can’t investigate. Look for a focused, measurable question.","_n":"21970","_k":"a2da218c"},{"t":"Do students like breakfast?","why":"Too broad to investigate: it doesn’t name who is studied or what factor to measure.","_n":"22980","_k":"d5611528"},{"t":"Why are some students lazy in the morning?","why":"The “lazy” option judges rather than investigates.","_n":"23990","_k":"bfe69dec"}],"hints":["A good research question is focused, measurable and neutral.","Look for the one that names who is studied and a factor to control.","The question about school start time, Grade 11 students in our board and bus travel time."]},{"id":"r5","kind":"mc","star":true,"goal":5,"prompt":"A student plans to survey only their friends. What’s the main problem?","options":[{"t":"Friends would finish the survey too quickly.","why":"Speed isn’t the issue. Think about who would be left out of the survey.","_n":"249a0","_k":"1e73db6b"},{"t":"The sample isn’t representative.","why":"Friends share schedules and habits; the results won’t generalize.","_n":"25930","_k":"8e545faf"},{"t":"Friends’ answers can’t be turned into percentages.","why":"Any counts can become percentages. Think about who would be left out of the survey.","_n":"26940","_k":"c76839d0"}],"hints":["Who would be left out of the survey?","Friends often share schedules, neighbourhoods and habits.","The sample isn’t representative, so the results won’t generalize."]},{"id":"r6","kind":"build","star":true,"goal":[5,6],"prompt":"Write a survey question about breakfast that avoids judgement. Choose a stem, a time frame and answer options.","stems":[{"t":"How many school days {time} did you eat something before first period?","_n":"27851","_k":"0a03b243"},{"t":"How many school days {time} did you skip breakfast because you were lazy?","_n":"28841","_k":"b76d198a"},{"t":"On how many school days {time} did you eat breakfast at home or at school?","_n":"29871","_k":"62c86ddf"},{"t":"How many days {time} did you eat an unhealthy breakfast?","_n":"2a861","_k":"b7f66411"},{"t":"How many days {time} did you make the bad choice to skip breakfast?","_n":"2b891","_k":"674bdd6d"}],"times":[{"t":"last week","_n":"2c881","_k":"61cb82d2"},{"t":"in the last 5 school days","_n":"2d8b1","_k":"10abf20f"},{"t":"in the last 10 school days","_n":"2e8a1","_k":"099dacbd"}],"scales":[{"t":"A number of days: 0, 1, 2, 3, …","_n":"2f8d1","_k":"7177b9cb"},{"t":"Never · Sometimes · Always","_n":"2g8c1","_k":"67f81c5a"},{"t":"Yes · No","_n":"2h1f1","_k":"7d0ac6cb"}],"labels":{"stem":"Stem","time":"Time frame","scale":"Answer options","preview":"Your question"},"wrong":{"judge":"Neutral wording gets more honest answers, and respects people.","scale":"Use number answers, so the results can be counted and compared.","incomplete":"Choose a stem, a time frame and answer options first."},"why":"Neutral wording gets more honest answers, and respects people. A time frame and number answers make it measurable.","hints":["Read each stem: does any word judge the person answering?","Avoid stems with “unhealthy”, “lazy” or “bad”. Any time frame works; the answers should be numbers.","For example: “How many school days last week did you eat something before first period?”, answered with a number of days."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Aditi","how":"","instruction":"Aditi made one mistake in each piece of work. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":6,"task":"Explain why a family with a tight budget buys frozen pizza twice a week.","steps":["Both parents work evening shifts, so time is short.","Frozen pizza is affordable and ready in 15 minutes.","This shows the family makes bad food choices and doesn’t care about health.","So they need to learn more about nutrition."],"_a":"BA==","stepFb":["Step 1 is correct: time is an access influence.","Step 2 is correct: cost and time together.","","Step 4 builds on step 3’s assumption. The mistake is earlier."],"fixes":[{"t":"This shows they prefer pizza.","why":"The profile points to time and cost, not taste.","_n":"2i201","_k":"3861e109"},{"t":"Step 3 is correct.","why":"Step 3 judges the family instead of explaining the choice.","_n":"2j1d1","_k":"5bd5fd1f"},{"t":"This shows how time and cost limit options. Changes that save time or money, like batch-cooking on a day off or adding frozen vegetables, would help more than information alone.","why":"It explains the choice from the inside: time and cost, and changes that ease them.","_n":"2k1e1","_k":"743f4828"},{"t":"This shows pizza is a bad food.","why":"Moral labels don’t explain anything.","_n":"2l1b1","_k":"345d86b3"}],"hints":["Is step 3 an explanation or a judgement?","What do steps 1 and 2 actually show?","Step 3 is the first mistake. The fix explains how time and cost limit options, and suggests changes that save time or money."]},{"id":"e2","goal":5,"task":"A survey finds that students who eat lunch with friends report better moods. Conclude.","steps":["The survey asked 200 students two questions.","Students who eat with friends reported better moods on average.","So eating with friends causes better moods.","Schools should require group lunches."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct: it reports the pattern.","","Step 4 depends on step 3. The mistake is earlier."],"fixes":[{"t":"So the survey is wrong.","why":"It’s not wrong; it’s limited.","_n":"2m1c1","_k":"d51fd7d7"},{"t":"So better moods cause eating with friends.","why":"That’s a cause claim too, just reversed.","_n":"2n191","_k":"d6030d2a"},{"t":"Step 3 is correct.","why":"A survey shows a link, not a cause.","_n":"2o1a1","_k":"da96bd83"},{"t":"So eating with friends is linked to better moods; students in better moods may also seek company, so we can’t tell which causes which.","why":"A survey shows a link. The cause could run either way.","_n":"2p171","_k":"f46ef8e9"}],"hints":["Can a survey show cause?","Could it run the other way?","Step 3 is the first mistake. The fix says eating with friends is linked to better moods, and the survey can’t tell which causes which."]},{"id":"e3","goal":4,"task":"Analyse a cereal ad with a cartoon tiger and the words “Part of a complete breakfast”.","steps":["The cartoon tiger is a mascot aimed at children.","“Part of a complete breakfast” is a health halo: the other foods make it complete.","Because the ad is for children, it can’t influence teens or adults.","So the ad’s techniques are harmless for most people."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 rests on step 3."],"fixes":[{"t":"The tiger is a celebrity endorsement.","why":"It’s a mascot.","_n":"2q181","_k":"a92aa6c0"},{"t":"The ad is illegal everywhere in Canada.","why":"Rules differ by province and audience.","_n":"2raa7","_k":"f29649e4"},{"t":"Step 3 is correct.","why":"Marketing reaches beyond its target.","_n":"2sab7","_k":"62aef0a6"},{"t":"Mascots and health halos also work on older audiences, through nostalgia and parents’ shopping. The audience is wider than the target.","why":"Marketing reaches beyond its target: older viewers remember the mascot, and parents do the shopping.","_n":"2ta87","_k":"4339c6b8"}],"hints":["Who else sees a cereal box?","Parents buy it; teens remember it.","Step 3 is the first mistake. The fix says mascots and health halos also work on older audiences, through nostalgia and parents’ shopping."]}]}]},"reflect":{"support":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>","journal":[{"id":"j1","q":"Which lever in Explore surprised you most by how much it changed a choice? Why?"},{"id":"j2","q":"In your own words, why is “they should just know better” a weak explanation of food choices?"},{"id":"j3","q":"Explain to a friend how one marketing technique works, using an example you’ve noticed."},{"id":"j4","q":"\u003cspan class=\"hfa-private\">Optional and private\u003c/span> Describe one influence on your own food choices this week. Is it one you’d like to change, and what lever would help? (This stays on your device.)"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is an \u003cstrong>economic\u003c/strong> influence on food choice?","options":[{"t":"Family recipes for holidays","why":"That’s social and cultural.","_n":"2ua97","_k":"43c640a7"},{"t":"A store-brand cereal costs $2 less","why":"Price is economic.","_n":"2vae7","_k":"a89539d7"},{"t":"A creator’s snack review","why":"That’s media.","_n":"2waf7","_k":"5dd8ff4e"},{"t":"Feeling hungry after sports","why":"That’s biological.","_n":"2xac7","_k":"c51f55e8"}]},"b":{"prompt":"Which is a \u003cstrong>physical access\u003c/strong> influence on food choice?","options":[{"t":"A buy-one-get-one sale","why":"That’s economic.","_n":"2yad7","_k":"7f493e06"},{"t":"A preference for spicy food","why":"That’s biological or cultural.","_n":"2zb27","_k":"f5cab7fa"},{"t":"Stress during exams","why":"That’s psychological.","_n":"30b37","_k":"ac775afa"},{"t":"The nearest grocery store is 40 km away","why":"Distance is physical access.","_n":"31b07","_k":"c9ef8dcb"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which healthy eating habit appears in Canada’s Food Guide (2019)?","options":[{"t":"Eat five small meals a day","why":"Not a guide habit.","_n":"32af7","_k":"02e896ac"},{"t":"Avoid carbohydrates after 6 p.m.","why":"Not in the guide; a diet myth.","_n":"33b27","_k":"3d8bbc18"},{"t":"Cook more often","why":"One of the guide’s listed habits.","_n":"34b17","_k":"98c595fb"},{"t":"Choose organic whenever possible","why":"Not a guide habit.","_n":"35ac7","_k":"463d97aa"}]},"b":{"prompt":"Which healthy eating habit appears in Canada’s Food Guide (2019)?","options":[{"t":"Skip breakfast to save time","why":"Not a guide habit.","_n":"36ab7","_k":"84522ecc"},{"t":"Drink juice instead of water","why":"The guide says make water your drink of choice.","_n":"37ae7","_k":"e468bd7a"},{"t":"Eat only home-grown food","why":"Not a guide habit.","_n":"38ad7","_k":"22ed1d50"},{"t":"Enjoy your food","why":"Enjoyment and culture are part of the guide.","_n":"39b87","_k":"6b2bf44b"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which is an example of a \u003cstrong>social or emotional condition\u003c/strong> linked to changes in eating patterns (C2.2)?","options":[{"t":"A sale at the grocery store","why":"That’s economic.","_n":"3ab77","_k":"8fcb2693"},{"t":"Lactose intolerance","why":"That’s a biological condition.","_n":"3b3e7","_k":"cff7ee65"},{"t":"Food allergies","why":"That’s biological.","_n":"3c3f7","_k":"693b91e3"},{"t":"A heavy work-and-school schedule that leaves little time to eat","why":"Busy schedules are a condition named in the curriculum.","_n":"3d407","_k":"145f4eac"}]},"b":{"prompt":"Which is an example of a social or emotional condition linked to changes in eating patterns?","options":[{"t":"Pressure to match expectations about body shape","why":"Body-shape expectations are a condition named in the curriculum; they can lead to harmful eating patterns.","_n":"3e417","_k":"79139c1c"},{"t":"Rising food prices","why":"Economic.","_n":"3f3a7","_k":"c0982da5"},{"t":"A new bus route","why":"Physical access.","_n":"3g3b7","_k":"2d9cc023"},{"t":"A peanut allergy","why":"Biological.","_n":"3h3c7","_k":"f71f014d"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Tomas’s family (rural, tight budget, 40 km from a full grocery store) buys mostly canned and frozen vegetables. A classmate says, “They just don’t value fresh food.” What is the strongest response?","options":[{"t":"“They probably prefer the taste.”","why":"The profile points to access and cost.","_n":"3i3d7","_k":"db07a00f"},{"t":"“They should drive to the city every day.”","why":"That ignores time and fuel costs.","_n":"3j367","_k":"d8da6512"},{"t":"“Distance and cost make fresh produce harder to get and more likely to spoil. Canned and frozen vegetables are a practical, nutritious choice under those conditions.”","why":"It explains the choice from the inside, using the real barriers: distance and cost.","_n":"3k377","_k":"030671cd"},{"t":"“Canned food has no nutrients.”","why":"Canned and frozen vegetables keep many nutrients.","_n":"3lc47","_k":"7c4e2c9a"}]},"b":{"prompt":"Amira’s family (halal, two late-shift jobs, near many fast-food outlets) often buys halal takeout. A classmate says, “They’re choosing convenience over health.” What is the strongest response?","options":[{"t":"“Halal food is less nutritious.”","why":"Halal rules concern preparation and sources, not nutrient content.","_n":"3mc37","_k":"864492e0"},{"t":"“Late shifts limit cooking time and nearby halal options are limited, so takeout solves real constraints. Batch-cooking or a halal-certified school program would ease them.”","why":"It names the real constraints, time and food practices, and changes that would ease them.","_n":"3nc27","_k":"77aa35d5"},{"t":"“They should stop working late.”","why":"Knowing isn’t the same as being able. Cost, time, access and culture shape what’s possible.","_n":"3oc17","_k":"2ec2aa74"},{"t":"“Takeout is always unhealthy.”","why":"Labels like “always unhealthy” don’t help.","_n":"3pc07","_k":"1da4d44a"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Which single change would most likely increase vegetable intake for a student who has \u003cstrong>little time\u003c/strong> and a \u003cstrong>microwave-only\u003c/strong> kitchen?","options":[{"t":"A poster listing vitamin content","why":"Information doesn’t solve time or equipment.","_n":"3qbf7","_k":"2486df52"},{"t":"Fresh whole vegetables that need roasting","why":"No oven.","_n":"3rbe7","_k":"e1ae93be"},{"t":"An expensive superfood powder","why":"Frozen vegetables, oats, beans, lentils and eggs are affordable and nutritious.","_n":"3sbd7","_k":"9da4ef32"},{"t":"Pre-cut frozen vegetables that steam in the microwave","why":"It addresses both time and equipment.","_n":"3tbc7","_k":"5883cee1"}]},"b":{"prompt":"Which single change would most likely increase breakfast eating for students who \u003cstrong>leave before 7 a.m.\u003c/strong> on a \u003cstrong>long bus ride\u003c/strong>?","options":[{"t":"Advice to wake up earlier","why":"That shifts the burden without changing the barrier.","_n":"3ubb7","_k":"16cfb3f2"},{"t":"A breakfast that must be cooked","why":"No time at 6:45.","_n":"3v326","_k":"24a9cffd"},{"t":"A lesson on why breakfast matters","why":"Knowing isn’t the same as being able. Cost, time, access and culture shape what’s possible.","_n":"3w336","_k":"c8a39285"},{"t":"A grab-and-go breakfast program at school","why":"It moves breakfast to where they have time.","_n":"3x306","_k":"61a4b3f2"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A model survey: students who drink energy drinks report sleeping less. A headline says “Energy drinks cause sleep loss in teens.” Best judgement?","options":[{"t":"The headline is correct because the link is strong.","why":"A strong link is still a correlation. A survey shows a pattern, not a cause.","_n":"3y316","_k":"28fd1a35"},{"t":"Surveys can’t show anything.","why":"They show patterns.","_n":"3z2e6","_k":"c93803b9"},{"t":"The survey proves teens who sleep less buy energy drinks.","why":"That’s a cause claim reversed.","_n":"402f6","_k":"17742a85"},{"t":"The survey shows a link; the headline claims a cause. Students who sleep less might drink more energy drinks to cope.","why":"A pattern in survey data is a correlation. The cause could run the other way, or another factor could explain both.","_n":"412c6","_k":"defa30ea"}]},"b":{"prompt":"A model survey: teens who cook at home report eating more vegetables. A post says “Cooking makes teens eat more vegetables.” Best judgement?","options":[{"t":"The post is correct.","why":"A survey shows a link, not a cause.","_n":"422d6","_k":"8ee9a505"},{"t":"Vegetables make teens cook.","why":"Reversed cause claim.","_n":"433a6","_k":"1c64debe"},{"t":"The survey is useless.","why":"It shows a pattern worth testing.","_n":"443b6","_k":"7408f1c6"},{"t":"The survey shows a link; teens who already like vegetables might cook more. It doesn’t show cause.","why":"A pattern in survey data is a correlation, and the cause could run the other way.","_n":"45387","_k":"ba7de499"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which sentence describes a classmate’s lunch most respectfully and accurately?","options":[{"t":"“Her lunch is a good choice, unlike mine.”","why":"Moral labels attach guilt to eating. Describe foods by what they offer, not by virtue.","_n":"46377","_k":"9838f94e"},{"t":"“Her ethnic food smells strong.”","why":"“Ethnic” others the food, and smell is a judgement.","_n":"473a7","_k":"77439915"},{"t":"“Her lunch is rice, dal and spinach, a combination common in many South Asian homes.”","why":"Describes the food; no judgement.","_n":"48397","_k":"d04a1e6d"},{"t":"“Her lunch is unusual.”","why":"Unusual to whom?","_n":"493c7","_k":"444356fd"}]},"b":{"prompt":"Which sentence describes a family’s dinner most respectfully and accurately?","options":[{"t":"“They eat late, after sunset, during Ramadan, often starting with dates and water.”","why":"It describes what and when they eat, and why, with no judgement.","_n":"4a3b7","_k":"d5505ed7"},{"t":"“They eat at a strange time.”","why":"Everyone’s food choices are cultural: what counts as breakfast is a cultural idea too.","_n":"4b3e7","_k":"9f2b244c"},{"t":"“Their food is exotic.”","why":"Everyone’s food choices are cultural: what counts as breakfast is a cultural idea too.","_n":"4c3d7","_k":"425b6a04"},{"t":"“Fasting is unhealthy.”","why":"A judgement, not a description.","_n":"4d307","_k":"6a338baf"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which is the best rewrite of “Chips are junk food and you should feel bad eating them”?","options":[{"t":"“Chips are a sometimes food: tasty, but they offer little fibre and a lot of sodium compared with whole foods.”","why":"Describes nutrients, not virtue.","_n":"4e2f7","_k":"8511e8d0"},{"t":"“Only eat chips on cheat days.”","why":"“Cheat” is a moral label.","_n":"4fa66","_k":"1e314982"},{"t":"“Chips are poison.”","why":"Exaggeration and moral language.","_n":"4ga76","_k":"f3fdbed6"},{"t":"“Chips are fine if you exercise them off.”","why":"Frames eating as needing compensation.","_n":"4ha86","_k":"b8121c0e"}]},"b":{"prompt":"Which is the best rewrite of “Salad is clean eating; pasta is dirty”?","options":[{"t":"“Dirty foods should be avoided.”","why":"Moral labels attach guilt to eating. Describe foods by what they offer, not by virtue.","_n":"4ia96","_k":"cef3b21a"},{"t":"“Salad is always healthier.”","why":"Depends on the salad and the context.","_n":"4jaa6","_k":"13a8355d"},{"t":"“Salads with vegetables add fibre and vitamins; whole-grain pasta adds fibre and energy. Both can fit a balanced plate.”","why":"It describes what each food offers, not virtue.","_n":"4kab6","_k":"d6fed6e8"},{"t":"“Pasta is a cheat food.”","why":"Moral labels attach guilt to eating. Describe foods by what they offer, not by virtue.","_n":"4lac6","_k":"847fbbe5"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A sports drink ad shows a famous hockey player and the slogan “Fuel like a pro.” W
