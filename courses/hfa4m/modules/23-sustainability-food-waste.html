.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 23: hero (apples along the chain, inverted recovery pyramid), Waste tracker (conveyor bins, rescue cart + pyramid,
   soil cross-section with index bars, readout), Waste audit stations, Practice 2 set, Cafeteria waste plan task.
   Tokens only. Stages --sys-stage (ink) with --sys-waste (orange) overlays for waste (course plan §4); every bin also carries
   the word Loss / Waste / Eaten. Pyramid tiers are labelled text bands, no red or green except in feedback. Soil uses the
   brown --plate-grain token; darker = more organic matter (numbers and words given too). */
/* radio groups and chips (from HFA4U 17 / 12) */
.fw-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.fw-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.fw-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.fw-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fw-chipset button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.fw-chipset button:hover:not(:disabled){border-color:var(--pen)}
.fw-chipset button[aria-checked="true"],.fw-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fw-chipset button:disabled{opacity:.85;cursor:default}
.fw-h4{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fw-lit{background:var(--hi-soft);border-radius:6px;transition:background .3s}

/* switch (from HFA4U 15) */
.fw-swrow{max-width:22rem;margin:0 0 8px}
.fw-sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:40px;font-size:.92rem}
.fw-sw:hover{border-color:var(--pen)}
.fw-swt{position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;border:2px solid var(--ink-2);background:var(--paper)}
.fw-swt i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.fw-sw[aria-checked="true"]{border-color:var(--ink)}
.fw-sw[aria-checked="true"] .fw-swt{background:var(--hi);border-color:var(--ink)}
.fw-sw[aria-checked="true"] .fw-swt i{left:18px;background:var(--ink)}
.fw-swl{flex:1 1 auto;min-width:0}
.fw-swv{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-2);min-width:1.8rem;text-align:right}

/* hero */
.fw-hero{max-width:640px;margin:0 auto}
.fw-hsvg{display:block;width:100%;height:auto}
.fw-hbelt{stroke:var(--sys-stage);stroke-width:3;stroke-dasharray:10 6;opacity:.5}
.fw-hst{font:700 15px var(--font-ui, sans-serif);fill:var(--ink-2)}
.fw-hst.on{fill:var(--ink)}
.fw-apple{fill:var(--sys-stage)}
.fw-apple.lost{fill:var(--sys-waste)}
.fw-hpile{font:700 14px var(--font-ui, sans-serif);fill:var(--sys-waste)}
.fw-htier{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.fw-htier.glow{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2.5}
.fw-htt{font:700 15px var(--font-ui, sans-serif);fill:var(--ink)}
.fw-harrow{stroke:var(--ink-2);stroke-width:2;fill:none}
.fw-harrowh{stroke:var(--ink-2);stroke-width:2;fill:none}
.fw-hmeth{font:700 14px var(--font-ui, sans-serif);fill:var(--sys-waste)}
.fw-hfin{font:700 16px var(--font-ui, sans-serif);fill:var(--ink)}

/* lab layout */
.fw-lab{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px 24px;align-items:start;margin-top:6px}
.fw-main,.fw-side{min-width:0}
.fw-side{border-left:1.5px solid var(--rule);padding-left:18px}
.fw-read > div{padding:6px 4px}
.fw-read dd{font-size:.95rem}
.fw-cnote{margin:0 0 8px}
.fw-tables{margin-top:16px}
.fw-tables .tbl-wrap{margin-bottom:8px}

/* conveyor bins (vertical bars; a list with horizontal bars on phones) */
.fw-conv{border-bottom:4px dashed var(--rule);padding-bottom:6px;margin-bottom:10px}
.fw-bins{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.fw-bins.grp{grid-template-columns:repeat(3,minmax(0,1fr))}
.fw-bin{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:4px;min-width:0}
.fw-bk{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}
.fw-waste .fw-bk{color:var(--sys-waste)}
.fw-bv{font-size:.9rem}
.fw-bv b{font-size:1.1rem}
.fw-bt{position:relative;display:block;height:140px;border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet)}
.fw-bt i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--v) * 100%);background:var(--sys-stage)}
.fw-waste .fw-bt i{background:var(--sys-waste)}
.fw-eaten .fw-bt i{background:var(--paper);border-top:3px solid var(--ink-2);background-image:repeating-linear-gradient(45deg,transparent 0 5px,var(--rule) 5px 7px)}
.fw-bl{font-size:.85rem;font-weight:700;line-height:1.25}
.fw-bl small{display:block;font-weight:400;color:var(--ink-2)}
.fw-tags{display:flex;flex-wrap:wrap;gap:3px}
.fw-tags span{font-size:.72rem;border:1px solid var(--rule);border-radius:4px;padding:0 .35em;color:var(--ink-2);background:var(--sheet)}

/* rescue routes */
.fw-rulesd{margin:0 0 10px;font-size:.9rem}
.fw-rulesd summary{cursor:pointer;font-weight:700}
.fw-rules{margin:6px 0 0;padding-left:1.4em}
.fw-rules li{padding:3px 6px;margin:2px 0}
.fw-cart{border:1.5px solid var(--rule);border-radius:10px;padding:10px;background:var(--sheet);margin-bottom:8px}
.fw-cart p{margin:0 0 6px}
.fw-cartin{display:flex;flex-wrap:wrap;gap:6px}
.fw-item{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.3em .7em;font-size:.88rem;text-align:left;min-height:34px;max-width:100%}
.fw-item.sm{font-size:.82rem;min-height:30px;padding:.15em .6em}
.fw-item.no{border-style:dashed}
.fw-item[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
.fw-rmsg{min-height:1.5em}
.fw-pyr{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.fw-tier{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:8px;padding:5px;background:var(--sheet);box-sizing:border-box}
.fw-t0{width:100%;background:var(--paper)}
.fw-t1{width:94%}.fw-t2{width:88%}.fw-t3{width:82%}.fw-t4{width:76%}.fw-t5{width:70%}
.fw-tier.fw-pass{background:var(--hi-soft);border-color:var(--ink)}
.fw-tname{padding:4px 8px}
.fw-tname small,.fw-dest small{display:block;font-size:.78rem;color:var(--ink-2);font-weight:400}
.fw-dest{flex:1 1 11rem;text-align:left;border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:6px;padding:.35em .7em;min-height:40px;font-size:.92rem}
.fw-dest.ready{border-color:var(--pen);border-style:dashed}
.fw-dest:hover{border-color:var(--pen)}
.fw-in{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 9rem}

/* sustainable field */
.fw-prw{align-items:flex-start}
.fw-prw .fw-rgl{padding-top:8px}
.fw-togs{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1 1 20rem}
.fw-tog{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.3em .75em;min-height:36px;font-size:.92rem;cursor:pointer}
.fw-tog:hover{border-color:var(--pen)}
.fw-tog input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:0 0 auto}
.fw-tog:has(input:checked){border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.fw-tog:has(input:focus-visible){outline:3px solid var(--pen);outline-offset:2px}
.fw-fig{margin:0 0 8px}
.fw-fsvg{display:block;width:100%;height:auto;max-height:260px}
.fw-soil{fill:var(--plate-grain);stroke:var(--plate-grain);stroke-width:1.5}
.fw-gully{fill:var(--sheet);stroke:var(--plate-grain);stroke-width:1.2}
.fw-surf{stroke:var(--plate-grain);stroke-width:2}
.fw-stem{stroke:var(--leaf);stroke-width:2.2;stroke-linecap:round;fill:none}
.fw-leafp{stroke:var(--leaf);stroke-width:2;stroke-linecap:round;fill:none}
.fw-leaf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.5}
.fw-ic{fill:var(--sheet);stroke:var(--leaf);stroke-width:1.6}
.fw-cover{stroke:var(--leaf);stroke-width:1.6;fill:none}
.fw-stub{stroke:var(--plate-grain);stroke-width:1.8;stroke-linecap:round}
.fw-bare{stroke:var(--plate-grain);stroke-width:2;stroke-dasharray:2 3}
.fw-ftx{font:700 13px var(--font-ui, sans-serif);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3px}

/* index bars (field, task) */
.fw-fbars,.fw-tg{display:grid;gap:6px;margin:6px 0}
.fw-g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 8px;align-items:baseline;padding:2px 4px}
.fw-g .fw-gt,.fw-g .fw-gx{grid-column:1 / -1}
.fw-gl{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.fw-gg{font-weight:400}
.fw-gv{font-size:.98rem}
.fw-gw{font-weight:400;font-size:.85rem;color:var(--ink-2)}
.fw-gt{position:relative;display:block;height:10px;border:1.5px solid var(--rule);border-radius:3px;background:var(--sheet)}
.fw-gt i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:1px}
.fw-gm{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink-2)}

/* audit stations */
.fw-st{margin-top:10px}
.fw-tray{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fw-logit{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .7em;max-width:100%;font-size:.92rem}
.fw-logit small{color:var(--ink-2);font-size:.8rem}
.fw-logit[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.fw-rbins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fw-rbin{display:flex;flex-direction:column;gap:5px;text-align:left;border:2px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;min-height:64px}
.fw-rbin.ready{border-color:var(--pen);border-style:dashed}
.fw-rbh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fw-rbin .fw-gt i{background:var(--sys-waste)}
.fw-rbin-in{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--ink-2)}
.fw-tot{margin:8px 0}
.fw-chick{margin:8px 0}
.fw-labs{display:grid;gap:10px}
.fw-lab1{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.fw-ltag{margin:0 0 6px}
.fw-stamp{display:inline-block;font:700 .95rem ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--ink);border-radius:4px;padding:.1em .5em;background:var(--paper)}
.fw-lfb p{margin:4px 0 0}
.fw-fx{margin:10px 0;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.fw-fxt{margin:0 0 6px}
.fw-fxr{display:grid;grid-template-columns:9.5rem minmax(0,1fr) auto;gap:8px;align-items:center;margin:4px 0;font-size:.88rem}
.fw-fxb{position:relative;height:14px;border:1.5px solid var(--rule);border-radius:3px;background:var(--paper)}
.fw-fxb i{position:absolute;left:0;top:0;bottom:0}
.fw-fxb i.was{background:var(--hi-soft);border-right:2px solid var(--ink-2)}
.fw-fxb i.now{background:var(--sys-waste);top:3px;bottom:3px}
.fw-fxv{white-space:nowrap}
.fw-data p{margin:6px 0}
.fw-cite{color:var(--ink-2)}

/* practice 2 */
.fw-numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0 8px}
.fw-numrow label{font-size:.85rem;font-weight:700;color:var(--ink-2)}
#act-math .opt[aria-checked="true"],.q .opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}

/* task */
.fw-tchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fw-tchip{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 8px;min-height:44px;font-size:.88rem}
.fw-tchip:hover{border-color:var(--pen)}
.fw-tchip[aria-pressed="true"]{border:2px solid var(--ink);background:var(--hi-soft)}
.fw-tcl{flex:0 0 auto;font-weight:700;width:1.5em;height:1.5em;border:1.5px solid var(--ink-2);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.fw-tchip[aria-pressed="true"] .fw-tcl{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.fw-tct small{display:block;color:var(--ink-2);font-size:.78rem;margin-top:2px}
.fw-tlist{margin:8px 0 0;padding-left:1.2em;font-size:.9rem}

@media (max-width:820px){
  .fw-lab{grid-template-columns:minmax(0,1fr)}
  .fw-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:10px}
}
@media (max-width:560px){
  .fw-bins,.fw-bins.grp{grid-template-columns:minmax(0,1fr);gap:6px}
  .fw-bin{display:grid;grid-template-columns:minmax(0,7.5rem) minmax(0,1fr) auto;align-items:center;gap:2px 8px}
  .fw-bk{grid-column:1;grid-row:1}
  .fw-bl{grid-column:1;grid-row:2}
  .fw-bt{grid-column:2;grid-row:1 / span 2;height:16px}
  .fw-bt i{top:0;bottom:0;height:auto;right:auto;width:calc(var(--v) * 100%)}
  .fw-bv{grid-column:3;grid-row:1 / span 2}
  .fw-tags{grid-column:1 / -1}
  .fw-t1,.fw-t2,.fw-t3,.fw-t4,.fw-t5{width:100%}
  .fw-rbins,.fw-tchips{grid-template-columns:minmax(0,1fr)}
  .fw-fxr{grid-template-columns:minmax(0,1fr) auto}
  .fw-fxr .fw-fxb{grid-column:1 / -1;grid-row:2}
}

</style>

lug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"634b5dfd","content":{"id":"23-sustainability-food-waste","kind":"topic","title":"Sustainable agriculture and food waste","topic":"Sustainable Agriculture & Food Waste","readyTopic":"sustainable agriculture and food waste","hero":{"eq":"Prevent → feed people → feed animals → industrial use → compost → landfill","eqSize":"sm","eqLabel":"prevent, then feed people, then feed animals, then industrial use, then compost, then landfill","headline":"The best way to deal with food waste is to never make it","text":"Between the field and the fork, a large share of food is \u003cstrong>lost\u003c/strong> (on farms and in processing) or \u003cstrong>wasted\u003c/strong> (in stores, restaurants and homes). Each wasted apple also wastes the land, water and energy that grew it, and in a landfill it releases \u003cstrong>methane\u003c/strong>. You’ll follow food along the chain, route surplus food up the \u003cstrong>food recovery hierarchy\u003c/strong>, test \u003cstrong>sustainable farming practices\u003c/strong>, and read \u003cstrong>date labels\u003c/strong> like an expert.","fig":{"html":"\u003cdiv class=\"fw-hero\" id=\"fw-hero\">\u003c/div>","caption":""},"aria":"One hundred apples start on a farm. A few drop off at each stage: farm, processing, store and home, and slide into a pile of lost or wasted apples. The pile tips into the food recovery hierarchy, an upside-down pyramid of six steps, widest at the top: prevent, feed people, feed animals, industrial use, compost, landfill. The top tiers glow; a small arrow at the bottom points from landfill to methane. Start at the top.","final":"Start at the top","stages":["Farm","Processing","Store","Home"],"drops":[12,3,8,17],"pile":"lost or wasted","methane":"landfill → methane","tiers":["Prevent","Feed people","Feed animals","Industrial use","Compost","Landfill"]},"goals":["I can tell food loss from food waste and identify causes at each stage of the supply chain.","I can apply the food recovery hierarchy to choose the best safe use for surplus food.","I can explain how sustainable agriculture practices affect soil, yields and the environment.","I can read Canadian date labels correctly (best-before vs expiration).","I can analyse food waste data and evaluate strategies to reduce it.","I can plan an action that reduces waste and supports food security."],"start":{"blocks":[{"title":"Before you start","html":"\u003cp>Food waste is shaped by systems: portion sizes, store standards, confusing date labels. This module uses a \u003cstrong>model household\u003c/strong> and model data; you never enter what your own household throws out.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Food supply chain","goal":1,"prompt":"Which stage comes \u003cstrong>before\u003c/strong> retail?","options":[{"t":"A restaurant serving customers","why":"Food service is at the same level as retail.","_n":"0a8c","_k":"9c13fbaf"},{"t":"Processing (e.g. a cannery or bakery)","why":"Food is processed before stores sell it.","_n":"1a7c","_k":"fb53bdf6"},{"t":"The household","why":"Households come after retail.","_n":"2a6c","_k":"5dcbeedf"},{"t":"The compost bin","why":"That’s after food is wasted.","_n":"3a5c","_k":"a1fba63d"}],"hints":["Farm → ? → store.","What happens to wheat before it’s sold as bread?","Processing."]},{"id":"w2","skill":"Food supply chain","goal":1,"prompt":"Potatoes left in a field because a machine missed them are lost at which stage?","options":[{"t":"Farm and harvest","why":"They never left the farm.","_n":"4a4c","_k":"72bb663c"},{"t":"Processing","why":"They weren’t processed.","_n":"5a3c","_k":"7dbd57a9"},{"t":"Retail","why":"They never reached a store.","_n":"6a2c","_k":"b7ee8d7f"},{"t":"Household","why":"No one bought them.","_n":"7b1c","_k":"90262e8c"}],"hints":["Where are the potatoes?","Still in the field.","Farm and harvest."]},{"id":"w3","skill":"Food safety basics","goal":4,"prompt":"What temperature should a refrigerator be to keep food safe?","options":[{"t":"−18 °C","why":"That’s a freezer.","_n":"8b0c","_k":"661fe88a"},{"t":"10 °C","why":"That’s inside the danger zone (4–60 °C).","_n":"92d0","_k":"d0598156"},{"t":"4 °C or colder","why":"That slows bacterial growth.","_n":"a2e0","_k":"5081293c"},{"t":"20 °C","why":"That’s room temperature.","_n":"b2b0","_k":"c6a43def"}],"hints":["The danger zone starts at 4 °C.","Stay below it.","4 °C or colder."]},{"id":"w4","skill":"Food safety basics","goal":4,"prompt":"Which saying is the safest rule for food that looks, smells or has been stored wrong?","options":[{"t":"“Cutting off the mould makes anything safe.”","why":"That isn’t safe for soft foods; mould can spread unseen.","_n":"c2c0","_k":"fab7f003"},{"t":"“When in doubt, throw it out.”","why":"Some harmful bacteria can’t be seen or smelled.","_n":"d310","_k":"dcef3d96"},{"t":"“Cooking makes any food safe.”","why":"Some bacterial toxins survive cooking.","_n":"e320","_k":"bd5ee243"},{"t":"“If it smells fine, it’s always safe.”","why":"Some pathogens cause no smell.","_n":"f2f0","_k":"0d62c7af"}],"hints":["Can you always see or smell bacteria?","No.","When in doubt, throw it out."]},{"id":"w5","skill":"Percentages","goal":5,"prompt":"Out of 100 kg of lettuce, 60 kg is lost or wasted. What percentage is that?","options":[{"t":"0.6%","why":"0.6 is the decimal; as a percentage it’s 60%.","_n":"g300","_k":"93baef3f"},{"t":"60%","why":"60 out of 100.","_n":"h350","_k":"d2577dce"},{"t":"40%","why":"40% is the share eaten.","_n":"i360","_k":"32f36e9b"},{"t":"6%","why":"60 ÷ 100 = 0.6 = 60%, not 6%.","_n":"jc70","_k":"de2c55dd"}],"hints":["Out of 100, the number is the percentage.","60 of 100.","60%."]},{"id":"w6","skill":"Percentages","goal":5,"prompt":"A household wasted 2.0 kg of food in a week; 0.9 kg was forgotten in the fridge. What share was forgotten food?","options":[{"t":"90%","why":"0.9 ÷ 1.0 would be 90%; the total is 2.0.","_n":"kc60","_k":"6f9e168d"},{"t":"9%","why":"That treats 0.9 as out of 10.","_n":"lc50","_k":"5525a115"},{"t":"45%","why":"0.9 ÷ 2.0 = 0.45.","_n":"mc40","_k":"df607c9a"},{"t":"18%","why":"Divide part by whole: 0.9 ÷ 2.0.","_n":"nc30","_k":"0b97ccf5"}],"hints":["Share = part ÷ total.","0.9 ÷ 2.0.","45%."]}],"refreshers":{"Food supply chain":"Farm and harvest → processing → retail and food service → household. \u003cem>Loss\u003c/em> happens in the first two stages; \u003cem>waste\u003c/em> in the last two.","Food safety basics":"Fridge at 4 °C or colder; freezer at −18 °C or colder; danger zone 4–60 °C. When in doubt, throw it out.","Percentages":"Share = part ÷ total × 100%. If the total is 100, the part is the percentage."}}},"explore":{"heading":"Waste tracker","intro":"Follow food along the chain to see where it’s lost or wasted, route surplus food up the recovery hierarchy, and test farming practices on a model field.","modes":[{"id":"chain","t":"Along the chain"},{"id":"rescue","t":"Rescue routes"},{"id":"field","t":"Sustainable field"}],"modelTag":"Model data","chainNote":"Kilograms per 100 kg produced. Model data, built to match the pattern in Canadian and global reports.","stages":[{"id":"farm","t":"Farm & harvest","kind":"loss","causes":["cosmetic standards (shape, size)","weather damage","overproduction","pests"]},{"id":"proc","t":"Processing","kind":"loss","causes":["trimming","equipment faults","overproduction"]},{"id":"retail","t":"Retail & food service","kind":"waste","causes":["overstocking","damaged packaging","date confusion","large portions"]},{"id":"home","t":"Household","kind":"waste","causes":["buying too much","forgetting food in the fridge","date confusion","cooking too much"]}],"foods":[{"id":"lettuce","t":"Lettuce","kg":[20,5,10,25],"eaten":40},{"id":"bread","t":"Bread","kg":[3,5,10,20],"eaten":62},{"id":"milk","t":"Milk","kg":[2,3,5,15],"eaten":75},{"id":"potatoes","t":"Potatoes","kg":[20,10,5,10],"eaten":55},{"id":"apples","t":"Apples","kg":[12,3,8,17],"eaten":60}],"groupLabel":"Loss vs waste","lossT":"Loss","lossSub":"farm + processing","wasteT":"Waste","wasteSub":"retail + household","eatenT":"Eaten","cmpAsk":"Which is bigger for this food?","cmp":[{"id":"loss","t":"Loss > waste"},{"id":"waste","t":"Waste > loss"}],"rulesTitle":"Rescue rules (a model policy, not a law)","rules":["The food rescue partner accepts unopened food stored properly up to 7 days past its best-before date. It never accepts anything past an expiration date, mouldy, or already served.","The farm partner accepts plant-based food that isn’t fit for people. It never accepts mouldy food or animal products.","Every item goes to the \u003cstrong>highest level its rules allow\u003c/strong>."],"prevent":{"t":"Prevent","sub":"waste at the source"},"dests":[{"id":"people","t":"Feed people","sub":"food rescue partner"},{"id":"animals","t":"Feed animals","sub":"farm partner"},{"id":"industrial","t":"Industrial use","sub":"anaerobic digester → energy"},{"id":"compost","t":"Compost"},{"id":"landfill","t":"Landfill"}],"items":[{"id":"yogurt","t":"Unopened yogurt, 2 days past best-before, kept refrigerated","short":"Yogurt","_a":"FENRDUUIA0Y=","no":{"animals":"The farm partner never accepts animal products."}},{"id":"formula","t":"Infant formula, 1 day past its expiration date","short":"Infant formula","_a":"FFpaBkAXEhZfUlhA","no":{"people":"It’s past an \u003cstrong>expiration\u003c/strong> date. Never use it.","animals":"The farm partner accepts only plant-based food."}},{"id":"apples","t":"Bruised but safe apples (5 kg)","short":"Apples","_a":"FENRDUUIA0Y=","no":{"animals":"The farm partner accepts only plant food that isn’t fit for people, and these apples are safe to eat."}},{"id":"bread","t":"Day-old bread (10 loaves, safe)","short":"Bread","_a":"FENRDUUIA0Y=","no":{"animals":"The farm partner accepts only plant food that isn’t fit for people, and this bread is safe to eat."}},{"id":"berries","t":"Mouldy strawberries","short":"Strawberries","_a":"FFpaBkAXEhZfUlhA","no":{"people":"The food rescue partner never accepts mouldy food.","animals":"Mouldy food isn’t safe for animals either."}},{"id":"peels","t":"Carrot peels and trimmings from the prepared-food counter","short":"Carrot peels","_a":"FFJaC1gFChcU","no":{"people":"Trimmings aren’t fit to serve people."}}],"allowed":"✓ Allowed by the rules.","field":{"note":"Index values over a 4-year cycle. Baseline = continuous corn with tillage, no cover crops and calendar spraying. Effects add. Model data.","base":{"y":100,"soil":-2,"ero":6,"pest":100},"practices":[{"id":"rot","t":"Crop rotation","y":3,"soil":1,"ero":-1,"pest":-20},{"id":"cc","t":"Cover crops","y":-1,"soil":1,"ero":-2,"pest":0},{"id":"nt","t":"No-till","y":-2,"soil":1,"ero":-2,"pest":10,"note":"more herbicide"},{"id":"ipm","t":"Integrated pest management (IPM)","short":"IPM","y":0,"soil":0,"ero":0,"pest":-30},{"id":"ic","t":"Intercropping","y":1,"soil":0,"ero":-1,"pest":-10},{"id":"fal","t":"Summer fallow","y":-25,"soil":-1,"ero":2,"pest":-10}],"soilLabels":{"low":"falling","mid":"steady","high":"rising"},"eroLabels":{"high":"high","mid":"medium","low":"low"},"labelRules":"Soil organic matter: −1 or lower is “falling”; 0 is “steady”; +1 or higher is “rising”. Erosion score: 5 or more is “high”; 3–4 is “medium”; 2 or less is “low”."},"predictions":[{"id":"p1","prompt":"Where is the most lettuce lost or wasted?","options":[{"t":"In households (25 kg)","_n":"oc20","_k":"801b2a52"},{"t":"In processing","_n":"pc10","_k":"500d178d"},{"t":"In stores and restaurants","_n":"qc00","_k":"77aba345"},{"t":"Equally at every stage","_n":"rbf0","_k":"21a9a5eb"}],"explain":"Homes are a major source of waste, which is why household habits matter."},{"id":"p2","prompt":"Which destination is best for 10 safe loaves of day-old bread?","options":[{"t":"Compost","_n":"sbe0","_k":"78eab9a5"},{"t":"Landfill","_n":"tc10","_k":"b7952ba9"},{"t":"Feed animals","_n":"uc20","_k":"d42d8ba3"},{"t":"Feed people through the food rescue partner","_n":"vc30","_k":"5d27777a"}],"explain":"Safe food that can feed people should feed people. Compost recovers far less, and a landfill creates methane."},{"id":"p3","prompt":"Can the yogurt go to the food rescue partner?","options":[{"t":"No: dairy can never be rescued","_n":"wc40","_k":"c265023b"},{"t":"No: it’s unsafe after its best-before date","_n":"xbd0","_k":"a385b743"},{"t":"Only if it’s frozen first","_n":"ybe0","_k":"10d0b527"},{"t":"Yes: best-before is about quality, and the partner’s rule allows unopened, refrigerated food up to 7 days past it","_n":"zbf0","_k":"a47057d0"}],"explain":"Best-before isn’t a safety date. Expiration dates are different."},{"id":"p4","prompt":"Turn on Summer fallow. What happens to yield?","options":[{"t":"It rises","_n":"10c00","_k":"ac5937b5"},{"t":"It drops sharply (to 75), because the field grows nothing one year in four","_n":"11b90","_k":"79f4a8f9"},{"t":"No change","_n":"12ba0","_k":"f6226631"},{"t":"Soil organic matter starts rising","_n":"13baf","_k":"7a74a88e"}],"explain":"Bare fallow rests the field but cuts yield and leaves soil exposed to wind and water."}],"challenges":[{"id":"tc1","goal":1,"prompt":"Along the chain: find the food where \u003cstrong>food loss (before retail) is greater than food waste (after)\u003c/strong>.","why":"Potatoes: 30 lost before retail vs 15 wasted after (cosmetic standards and storage).","hints":["Use the Loss vs waste toggle.","Compare the two grouped bars for each food.","Potatoes: 30 lost before retail vs 15 wasted after (cosmetic standards and storage)."],"msgs":{"mode":"Switch to \u003cstrong>Along the chain\u003c/strong> first.","lettuce":"Loss 25, waste 35. Waste is bigger.","apples":"Loss 15, waste 25.","bread":"Most of their losses happen after retail.","milk":"Most of their losses happen after retail.","chip":"Potatoes are the food. Now confirm it with the \u003cstrong>Loss > waste\u003c/strong> chip.","wrongChip":"Look again: for potatoes, loss is 30 and waste is 15."}},{"id":"tc2","goal":[2,4],"prompt":"Rescue routes: send \u003cstrong>all six items to their highest allowed level\u003c/strong>.","why":"Yogurt, apples and bread feed people; the peels feed animals; the expired formula and the mouldy berries go to industrial use.","hints":["Start at the top of the pyramid for each item and move down only if a rule says no.","Only two items can’t feed people or animals: the expired formula and the mouldy berries.","Those two go to industrial use; the peels go to animals; the other three feed people."],"msgs":{"mode":"Switch to \u003cstrong>Rescue routes\u003c/strong> first.","all":"Route all six items first: {n} still on the cart.","yogurt|compost":"Best-before is about quality. Unopened and cold, the rescue rules allow it up to 7 days past.","formula|people":"It’s past an \u003cstrong>expiration\u003c/strong> date. Never use it.","bread|compost":"Safe food that can feed people belongs higher up.","berries|animals":"Mouldy food isn’t safe for animals either.","peels|compost":"The farm partner accepts plant trimmings, and animal feed ranks above compost.","other":"{n} of 6 items are at their highest allowed level. Check {list} again."}},{"id":"tc3","goal":3,"stretch":true,"prompt":"Sustainable field: make soil organic matter \u003cstrong>rising\u003c/strong> and erosion \u003cstrong>low\u003c/strong>, keep yield at \u003cstrong>98 or higher\u003c/strong>, and use \u003cstrong>as few practices as possible\u003c/strong>.","why":"Real results vary by soil and climate. The model shows why many Canadian farms combine these practices.","hints":["Which practices raise soil organic matter? You need +3 to go from −2 to +1.","Only rotation, cover crops and no-till add +1 each.","Check yield: 100 + 3 − 1 − 2 = 100. Erosion: 6 − 1 − 2 − 2 = 1."],"msgs":{"mode":"Switch to \u003cstrong>Sustainable field\u003c/strong> first.","ccnt":"Soil organic matter is steady (0), and yield is 97.","ipm":"That works, but uses four practices. IPM doesn’t change soil or erosion, so drop it.","more":"That works, but uses more practices than it needs. Which ones don’t change soil organic matter?","fallow":"Fallow cuts yield to about 75.","ricc":"Erosion is low enough (2), but soil is only steady (0).","other":"Now: yield {y}, soil organic matter {soil} ({sl}), erosion {ero} ({el}). You need rising soil, low erosion and yield 98 or higher."}}],"blocks":[{"title":"What the tracker shows","html":"\u003cul>\u003cli>\u003cstrong>Waste happens at every stage\u003c/strong>, not just one, and households are a major source.\u003c/li>\u003cli>\u003cstrong>Prevention beats every other option.\u003c/strong> Prevention saves the land, water and energy used to make the food; compost only recovers some nutrients.\u003c/li>\u003cli>\u003cstrong>Date labels mean different things.\u003c/strong> Best-before is about quality for unopened food stored properly. Expiration dates (on a few products, like infant formula) mean don’t use after the date.\u003c/li>\u003cli>\u003cstrong>Some farming practices improve soil without costing yield.\u003c/strong> It depends on the practice. In the model, rotation with cover crops and no-till keeps yield at 100 while soil improves; summer fallow cuts yield.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"audit","name":"Audit","heading":"Waste audit","intro":"Audit one week of a \u003cstrong>model household’s\u003c/strong> food waste. Sort the log by reason and watch the shares build, read four date labels, then choose two fixes and see the waste drop.","stations":[{"id":"s1","t":"1. The week’s log"},{"id":"s2","t":"2. Date labels"},{"id":"s3","t":"3. Two fixes"}],"log":{"ask":"Tap an item, then tap the reason bin it belongs in.","bins":[{"id":"forgot","t":"Forgot"},{"id":"date","t":"Date confusion"},{"id":"cooked","t":"Cooked too much"},{"id":"bought","t":"Bought too much"}],"items":[{"id":"g1","t":"Half a bag of salad greens","kg":0.2,"reason":"Forgot it in the fridge","_a":"FFVbEFILEkY="},{"id":"g2","t":"Three slices of bread","kg":0.1,"reason":"Bought too much (went stale)","_a":"FFFbF1IMEkY="},{"id":"g3","t":"Leftover rice","kg":0.3,"reason":"Cooked too much","_a":"FFBbDV4BAkY="},{"id":"g4","t":"An unopened yogurt cup, thrown out the day after its best-before date","kg":0.2,"reason":"Date confusion","_a":"FFdVFlBG"},{"id":"g5","t":"Two overripe bananas","kg":0.3,"reason":"Forgot them","_a":"FFVbEFILEkY="},{"id":"g6","t":"Milk, unopened, thrown out at its best-before date","kg":0.5,"reason":"Date confusion","_a":"FFdVFlBG"},{"id":"g7","t":"Cooked chicken left in the fridge for a week","kg":0.4,"reason":"Forgot it (unsafe by then: correctly thrown out)","_a":"FFVbEFILEkY=","note":true}],"total":2,"wrong":"Read the reason in the log again.","chicken":"Some waste is about safety. Throwing out food that’s been stored too long is the right call. The fix is planning so it’s eaten in time.","done":"All seven items sorted. Forgot: 0.9 kg (45%); date confusion: 0.7 kg (35%); cooked too much: 0.3 kg (15%); bought too much: 0.1 kg (5%). Total: 2.0 kg."},"labels":{"ask":"What does each label tell you? Choose a meaning for each, then check.","meanings":[{"id":"quality","t":"Quality of unopened food"},{"id":"dont","t":"Don’t use after"},{"id":"packed","t":"When the store packaged it"},{"id":"follow","t":"Follow the label"}],"items":[{"id":"d1","t":"Best before / Meilleur avant 2026 NO 28","on":"","_a":"FEJBA1kNEh0U","fb":"Best-before is about quality for unopened food stored properly; it isn’t a safety date."},{"id":"d2","t":"Expiry date / Exp 2026 NO 28","on":"on infant formula","_a":"FFdbDEFG","fb":"Expiration dates appear on a few products, such as infant formula, and mean don’t use after this date."},{"id":"d3","t":"Packaged on","on":"","_a":"FENVAV4BAkY=","fb":"A “packaged on” date tells you when the store packaged the food."},{"id":"d4","t":"Use by","on":"on an imported product","_a":"FFVbDlkLEUY=","fb":"On an imported product, follow what the label says."}],"done":"All four labels read correctly. Best-before is about quality for unopened food stored properly. Expiration dates (on a few products, like infant formula) mean don’t use after the date."},"fixes":{"ask":"Choose \u003cstrong>two\u003c/strong> fixes for the biggest reasons and watch the model week’s waste drop.","list":[{"id":"shelf","t":"A “use it up first” shelf","target":"forgot","keep":0.5},{"id":"plan","t":"Planning meals before shopping","target":"forgot","keep":0.5},{"id":"freeze","t":"Freezing bread","target":"bought","keep":0},{"id":"learn","t":"Learning best-before vs expiration","target":"date","keep":0},{"id":"small","t":"Cooking smaller batches","target":"cooked","keep":0}],"effect":"Model effects: a shelf or meal planning halves forgotten food; learning the labels, freezing bread and smaller batches remove their reason.","good":"These two fixes target the two biggest reasons: forgotten food and date confusion.","off":"These fixes help, but look at the two biggest bins: forgotten food (45%) and date confusion (35%).","same":"Both fixes target forgotten food. Is there a fix for the second-biggest reason?"},"data":{"title":"Check it with data","rows":[{"t":"Canada, all stages","h":"Second Harvest &amp; VCMI estimated that 58% of food produced in Canada is lost or wasted, and that about a third of all food produced was avoidable loss or waste.","cite":"(Second Harvest &amp; Value Chain Management International, 2019)"},{"t":"Canadian households","h":"The National Zero Waste Council’s Love Food Hate Waste Canada campaign reports household food waste in millions of tonnes per year, costing households over a thousand dollars each.","cite":"(National Zero Waste Council, n.d.)"},{"t":"Global","h":"UNEP’s \u003ci>Food Waste Index Report 2024\u003c/i> estimated about 1.05 billion tonnes of food wasted in 2022.","cite":"(United Nations Environment Programme, 2024)"}],"note":"These numbers count different things: all stages, households only, or the whole world. Check what a figure counts before you compare it."},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Canadian Food Inspection Agency. (n.d.). \u003ci>Date labelling on pre-packaged foods\u003c/i>. Government of Canada.\u003c/li>\u003cli>National Zero Waste Council. (n.d.). \u003ci>Love Food Hate Waste Canada\u003c/i>.\u003c/li>\u003cli>PROOF. (n.d.). \u003ci>Household food insecurity in Canada\u003c/i>. University of Toronto.\u003c/li>\u003cli>Second Harvest &amp; Value Chain Management International. (2019). \u003ci>The avoidable crisis of food waste: Technical report\u003c/i>.\u003c/li>\u003cli>United Nations Environment Programme. (2024). \u003ci>Food waste index report 2024\u003c/i>.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Waste audit quick check","summary":"Waste audit quick check","items":[{"id":"q1","goal":5,"prompt":"In the audit, what share of waste came from date confusion?","choices":[{"t":"70%","fb":"0.7 ÷ 2.0 = 0.35.","_n":"14b9f","_k":"9ce444b9"},{"t":"35%","fb":"Right. 0.7 ÷ 2.0 = 0.35.","_n":"15bcf","_k":"d7d29935"},{"t":"0.7%","fb":"0.7 ÷ 2.0 = 0.35.","_n":"16bbf","_k":"4bf4235c"},{"t":"7%","fb":"0.7 ÷ 2.0 = 0.35.","_n":"17bef","_k":"ae09386e"}]},{"id":"q2","goal":2,"prompt":"Food buried in a landfill mostly releases…","choices":[{"t":"Oxygen","fb":"Without air, decomposing food makes methane.","_n":"18bdf","_k":"d11671a4"},{"t":"Nothing harmful","fb":"Without air, decomposing food makes methane.","_n":"19c0f","_k":"120ab826"},{"t":"Only water","fb":"Without air, decomposing food makes methane.","_n":"1abff","_k":"1699c13f"},{"t":"Methane","fb":"Right. Without air, decomposing food makes methane.","_n":"1bb2f","_k":"3586b9bb"}]},{"id":"q3","goal":4,"prompt":"Which label means “don’t use after this date”?","choices":[{"t":"Packaged on","fb":"Best-before is about quality, and “packaged on” is when the food was packaged. Look for the expiration date.","_n":"1cb1f","_k":"1c82748e"},{"t":"Best-before","fb":"Best-before is about quality.","_n":"1d34f","_k":"e85dc713"},{"t":"Display until","fb":"Best-before is about quality, and “display until” is for the store. Look for the expiration date.","_n":"1e35f","_k":"0028b31b"},{"t":"Expiration date","fb":"Right. Expiration dates mean don’t use after the date.","_n":"1f32f","_k":"6661da78"}]},{"id":"q4","goal":4,"prompt":"Why was throwing out the week-old chicken correct?","choices":[{"t":"Stored too long to be safe","fb":"Right. Safety comes first; the fix is planning.","_n":"1g33f","_k":"340f5588"},{"t":"All chicken must be thrown out","fb":"Safety comes first; the fix is planning.","_n":"1h30f","_k":"b4109deb"},{"t":"It was past best-before","fb":"Safety comes first; the fix is planning.","_n":"1i31f","_k":"d80b29f3"},{"t":"Chicken can’t be frozen","fb":"Safety comes first; the fix is planning.","_n":"1j2ef","_k":"28a959cb"}]}]}},"practice":{"activities":[{"id":"chain","type":"sorter","title":"Where along the chain?","summary":"Where along the chain?","goal":1,"noun":"event","txt":true,"instruction":"Sort each event into the stage where the food was lost or wasted.","boxes":[{"id":"farm","label":"Farm & harvest"},{"id":"proc","label":"Processing"},{"id":"retail","label":"Retail & food service"},{"id":"home","label":"Household"}],"items":[{"id":"i1","t":"Carrots too crooked for store standards are ploughed back into the field.","_a":"FFVVEFhG","why":"Loss at harvest: cosmetic standards.","wrong":{"retail":"The carrots never left the farm. Cosmetic standards cause loss at harvest."}},{"id":"i2","t":"A juice plant discards apple pulp left after pressing.","_a":"FENGDVZG","why":"Loss in processing: trimming and by-products.","hints":["Where is apple pulp made?","At the juice plant.","Processing."]},{"id":"i3","t":"A grocery store throws out dented cans.","_a":"FEFRFlQNCkY=","why":"Retail waste: damaged packaging."},{"id":"i4","t":"A family’s leftovers go mouldy at the back of the fridge.","_a":"FFtbD1BG","why":"Household waste: forgotten food."},{"id":"i5","t":"Hail damages a peach orchard just before harvest.","_a":"FFVVEFhG","why":"Loss at the farm: weather damage."},{"id":"i6","t":"A restaurant serves huge portions, and half of each plate comes back.","_a":"FEFRFlQNCkY=","why":"Food-service waste: large portions.","wrong":{"home":"Restaurants are food service."}},{"id":"i7","t":"A bakery overproduces and the extra dough is discarded before baking.","_a":"FENGDVZG","why":"Loss in processing: overproduction."},{"id":"i8","t":"Someone throws out unopened crackers on their best-before date.","_a":"FFtbD1BG","why":"Household waste: date confusion.","wrong":{"retail":"The crackers were already bought, so this happened at home."}}],"wrongDefault":"Ask where the food was when it was thrown out."},{"id":"math","type":"custom","title":"Waste math and judgement","summary":"Waste math and judgement","star":true,"goal":[2,5,6],"instruction":"Six items: number entry and choices. Items S3 to S6 are non-routine (★).","how":"Type a number and press Check, or choose an answer.","items":[{"id":"s1","kind":"num","goal":5,"prompt":"Model: of 100 kg of apples, 12 + 3 + 8 + 17 kg are lost or wasted. What percentage is eaten?","_a":"AAM=","unit":"%","label":"Eaten","why":"12 + 3 + 8 + 17 = 40 kg lost or wasted, so 100 − 40 = 60 kg eaten: 60%.","wrong":[{"match":40,"fb":"That’s lost or wasted; 100 − 40 = 60 eaten."}],"wrongDefault":"Add the four stages, then subtract from 100."},{"id":"s2","kind":"ratio","goal":5,"prompt":"Model bread: farm 3, processing 5, retail 10, household 20. Ratio of waste after retail to loss before retail?","_a":"BR0DVw==","label":"Ratio","placeholder":"e.g. 2 : 1","why":"30 : 8, which simplifies to 15 : 4 (3.75 times).","wrong":[{"match":0.26666666666666666,"fb":"Waste after retail is 10 + 20 = 30; loss before is 3 + 5 = 8."}],"wrongDefault":"Waste after retail is retail + household; loss before is farm + processing."},{"id":"s3","kind":"num","star":true,"goal":5,"prompt":"In the audit, the household freezes bread and plans meals, cutting “forgot” by half and removing “bought too much”. New weekly total?","_a":"Bx0AVw==","unit":"kg","label":"New total","why":"2.0 − 0.45 − 0.1 = 1.45 kg.","wrong":[{"match":1,"fb":"Half of 0.9 is 0.45; remove 0.1: 2.0 − 0.45 − 0.1 = 1.45."}],"wrongDefault":"Change one reason at a time.","hints":["Change one reason at a time.","“Forgot” drops from 0.9 to 0.45; “bought too much” (0.1) disappears.","2.0 − 0.45 − 0.1 = 1.45 kg."]},{"id":"s4","kind":"mc","star":true,"goal":2,"prompt":"The food rescue partner has room for only one more item tonight: 10 safe day-old loaves or 5 kg of bruised but safe apples. For this item only, the farm partner accepts any safe plant food. What’s the best plan for both items?","why":"Either assignment is accepted, because both keep each item as high on the hierarchy as space allows.","options":[{"t":"Both items to the rescue partner","why":"The partner has room for only one more item tonight.","_n":"1k2ff","_k":"bc931fd5"},{"t":"One item to the rescue partner and the other to compost","why":"Compost ranks below animal feed, and the farm partner can take it.","_n":"1l3cf","_k":"b7ee9f10"},{"t":"Both items to compost","why":"Both items can still feed people or animals. Prevention saves the land, water and energy used to make the food; compost only recovers some nutrients.","_n":"1m3df","_k":"0c3d1056"},{"t":"One item to the rescue partner and the other to the farm partner (either way round)","why":"Either assignment is accepted, because both keep each item as high on the hierarchy as space allows.","_n":"1n2ef","_k":"3916fec4"}],"hints":["Each item should go as high on the pyramid as its rules allow.","Only one can take the people slot; where can the other go?","The other goes to the farm partner (animal feed)."]},{"id":"s5","kind":"mc","star":true,"inquiry":true,"goal":5,"prompt":"One report says “58% of food is lost or wasted in Canada”. Another says households waste about 2 million tonnes a year. Why might these numbers look so different?","why":"They measure different things: all stages vs households only, and total vs avoidable.","options":[{"t":"A percentage and a mass can never be compared","why":"They can, once you know what each one counts.","_n":"1o2df","_k":"5f134a73"},{"t":"One of the reports must be wrong","why":"Check what each counts before deciding a source is wrong.","_n":"1p2cf","_k":"37462fff"},{"t":"They measure different things: all stages vs households only, and total vs avoidable (inedible parts like bones and peels are included in some totals)","why":"Check what each number counts: which stages, and whether inedible parts are included.","_n":"1q2bf","_k":"22fdc258"},{"t":"Food waste must have changed a lot between the reports","why":"Nothing here says the years differ. First check what each number counts.","_n":"1r32f","_k":"f7556e97"}]},{"id":"s6","kind":"mc","star":true,"goal":6,"prompt":"A student club has $50 and one month. Which plan best tackles both food waste and food insecurity?","why":"It cuts waste safely, gets food to people, and works on income, the main cause of food insecurity.","options":[{"t":"Set up a share table for unopened items with the cafeteria, partner with a local food rescue group, and write to their MPP supporting income-based solutions","why":"It cuts waste safely, gets food to people, and works on income, the main cause of food insecurity.","_n":"1s31f","_k":"26e7fae2"},{"t":"Buy compost bins for the cafeteria","why":"Composting keeps food out of landfill, but it feeds no one and doesn’t touch income.","_n":"1t30f","_k":"5d50e577"},{"t":"Collect plate scraps for families","why":"Unsafe, and plate food is never shared. Only safe, properly handled food can feed people; food from someone’s plate is never re-served.","_n":"1u2ff","_k":"fb88ec0b"},{"t":"Run a food drive only","why":"Helps, but doesn’t address waste or income. Food rescue helps, but food insecurity in Canada comes mainly from low income.","_n":"1v36f","_k":"212084cf"}]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Xander","goal":[2,4,5],"instruction":"Xander made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":4,"task":"Decide what to do with unopened, refrigerated yogurt one day past its best-before date.","steps":["“The yogurt is unopened and has been kept in the fridge.”","“The best-before date was yesterday.”","“Best-before means the food becomes unsafe after that date.”","“So it must go in the garbage.”"],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"“Best-before is about quality for unopened food stored properly. It may still be good: check it, and when in doubt, throw it out.”","why":"Best-before is about quality for unopened food stored properly. Expiration dates (on a few products, like infant formula) mean don’t use after the date.","_n":"1w35f","_k":"08ba5a3a"},{"t":"“Best-before dates don’t mean anything.”","why":"They tell you about freshness and quality.","_n":"1x28f","_k":"f6a85ff0"},{"t":"“Expiration and best-before mean the same thing.”","why":"Expiration dates are different and appear on only a few products.","_n":"1y29f","_k":"ac02c62c"},{"t":"“Step 3 is correct.”","why":"Best-before isn’t a safety date.","_n":"1z2af","_k":"e295182f"}],"hints":["What does “best before” describe?","Freshness and quality.","Not a safety date: check it."]},{"id":"e2","goal":2,"task":"A store has 20 safe, unsold sandwiches at closing. Choose the best option.","steps":["“The sandwiches are safe and were kept cold.”","“Landfill is the worst option because it creates methane.”","“Composting returns nutrients to soil, so composting is the best option.”","“Send them to the compost.”"],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"“Step 3 is correct.”","why":"Compost recovers only nutrients; feeding people uses the whole food.","_n":"202bf","_k":"c4148ad3"},{"t":"“Send them to landfill.”","why":"That’s the least preferred option.","_n":"212cf","_k":"f4e2c047"},{"t":"“Feed them to animals first.”","why":"People come before animals for safe food.","_n":"222df","_k":"f285ea07"},{"t":"“Safe food that can feed people should go to a food rescue partner first; compost is near the bottom of the hierarchy.”","why":"Prevention saves the land, water and energy used to make the food; compost only recovers some nutrients.","_n":"232ef","_k":"c0813538"}],"hints":["What’s second on the pyramid, after prevention?","Feed people.","Food rescue partner."]},{"id":"e3","goal":5,"task":"Interpret the claim “about a third of all food produced in Canada was avoidable loss or waste”.","steps":["“The report estimates that 58% of food is lost or wasted overall.”","“About a third of all food produced was avoidable: edible food that could have been rescued.”","“So all 58% could have been eaten if people tried harder.”","“Waste is entirely about individual effort.”"],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"“Only households waste food.”","why":"Waste happens at every stage, and households are a major source. Loss also happens on farms and in processing.","_n":"242ff","_k":"415b2493"},{"t":"“Part of the 58% is unavoidable (bones, peels, inedible parts), and much of the avoidable part happens in farms, processing and stores, not just homes.”","why":"Not everything lost was edible, and waste happens at every stage.","_n":"2530f","_k":"2223e5ec"},{"t":"“Step 3 is correct.”","why":"Not everything lost was edible, and waste happens at every stage.","_n":"2631f","_k":"bdbda7c1"},{"t":"“None of it is avoidable.”","why":"About a third of all food produced was avoidable.","_n":"27431","_k":"2e9d1262"}],"hints":["Is every lost or wasted item edible?","No: bones, peels and trimmings count too.","Avoidable is the smaller share, spread across every stage."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: where along the chain food is lost, or what best-before dates actually mean?"},{"id":"j2","q":"In your own words, why is prevention better than composting?"},{"id":"j3","q":"Explain to a friend the difference between a best-before date and an expiration date, with an example of each."},{"id":"j4","q":"Which waste-reduction idea could your school or community try? What would you need to find out first?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is an example of \u003cstrong>food loss\u003c/strong> rather than food waste?","options":[{"t":"Potatoes left in the field because they’re the wrong shape for store standards","why":"Lost before reaching retail.","_n":"28421","_k":"e490da23"},{"t":"A store throwing out dented cans","why":"That’s retail waste.","_n":"29451","_k":"c053d022"},{"t":"A restaurant discarding unsold soup","why":"That’s food-service waste.","_n":"2a441","_k":"347da5d7"},{"t":"A family throwing out leftovers","why":"That’s household waste.","_n":"2b3f1","_k":"01945727"}]},"b":{"prompt":"Which is an example of \u003cstrong>food waste\u003c/strong> rather than food loss?","options":[{"t":"Milk spilled at a dairy processing plant","why":"That’s loss in processing.","_n":"2c3e1","_k":"5f5e87f1"},{"t":"A family throwing out bread that went stale","why":"Wasted after retail, at home.","_n":"2d411","_k":"040fd96c"},{"t":"Fish that spoil on the boat before landing","why":"That’s loss at harvest.","_n":"2e401","_k":"0a2ec287"},{"t":"Apples damaged by hail before harvest","why":"That’s loss at the farm.","_n":"2f3b1","_k":"c53c643f"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"In Canada, a \u003cstrong>best-before date\u003c/strong> tells you…","options":[{"t":"How long an unopened food, stored properly, keeps its freshness and quality","why":"It’s about quality, not safety.","_n":"2g3a1","_k":"1de04f96"},{"t":"The date after which the food is unsafe","why":"That isn’t what best-before means.","_n":"2h3d1","_k":"ad1c6ec3"},{"t":"The date the food was packaged","why":"That’s a “packaged on” date.","_n":"2i3e1","_k":"067b2d9b"},{"t":"Nothing useful at all","why":"It tells you about freshness and quality.","_n":"2j3b1","_k":"817e606b"}]},"b":{"prompt":"Which product must carry an \u003cstrong>expiration date\u003c/strong> in Canada?","options":[{"t":"Infant formula","why":"Expiration dates appear on a few products like formula and meal replacements.","_n":"2k3c1","_k":"43cc3dc8"},{"t":"Fresh apples","why":"Fresh produce usually has no date.","_n":"2l411","_k":"a891b407"},{"t":"Bread","why":"Bread may have a best-before date.","_n":"2m421","_k":"6de73ca9"},{"t":"Yogurt","why":"Yogurt has a best-before date.","_n":"2n3f1","_k":"e0f30b63"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"On the food recovery hierarchy, which option comes \u003cstrong>first\u003c/strong>?","options":[{"t":"Preventing waste at the source","why":"It saves all the resources used to make the food.","_n":"2o401","_k":"942eaa6e"},{"t":"Landfill","why":"That’s last.","_n":"2p351","_k":"b11cb14e"},{"t":"Composting","why":"Compost is near the bottom.","_n":"2q361","_k":"193ef120"},{"t":"Feeding animals","why":"That’s third.","_n":"2r271","_k":"c9447d85"}]},"b":{"prompt":"On the food recovery hierarchy, which option is \u003cstrong>least preferred\u003c/strong>?","options":[{"t":"Feeding animals","why":"That’s third from the top.","_n":"2s281","_k":"2066bfdb"},{"t":"Composting","why":"Composting is better than landfill.","_n":"2t251","_k":"48b1bac9"},{"t":"Landfill","why":"It wastes everything and creates methane.","_n":"2u261","_k":"0d0a83d0"},{"t":"Feeding people","why":"That’s second from the top.","_n":"2v231","_k":"749094a5"}]}},{"id":"t1","cat":"T","goal":[1,5],"a":{"prompt":"Model lettuce, per 100 kg: farm 20, processing 5, retail 10, household 25. What share is lost \u003cstrong>before\u003c/strong> retail, and which single stage is largest?","options":[{"t":"25% lost before retail; the household stage (25 kg) is largest","why":"20 + 5 = 25; 25 is the biggest single bin.","_n":"2w241","_k":"f9e77508"},{"t":"35% before retail; retail is largest","why":"Before retail means farm + processing = 25.","_n":"2x211","_k":"b76e4eb1"},{"t":"60% before retail; farm is largest","why":"60% is the total lost and wasted.","_n":"2y221","_k":"8b94f933"},{"t":"25% before retail; farm is largest","why":"Farm is 20; the household is 25.","_n":"2z2f1","_k":"091ef810"}]},"b":{"prompt":"Model apples, per 100 kg: farm 12, processing 3, retail 8, household 17. What share is lost \u003cstrong>before\u003c/strong> retail, and which single stage is largest?","options":[{"t":"25% before retail; retail is largest","why":"Before retail = 12 + 3 = 15.","_n":"30301","_k":"d02d6cd4"},{"t":"15% before retail; farm is largest","why":"Farm is 12; the household is 17.","_n":"31ad1","_k":"41a7a6df"},{"t":"40% before retail; farm is largest","why":"40% is everything lost and wasted.","_n":"32ac1","_k":"38991e33"},{"t":"15% lost before retail; the household stage (17 kg) is largest","why":"12 + 3 = 15; 17 is the biggest single bin.","_n":"33af1","_k":"3c2033d8"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"A bakery has 20 unsold loaves of safe day-old bread. Best choice?","options":[{"t":"Landfill","why":"The least preferred option.","_n":"34ae1","_k":"f04d2fc7"},{"t":"A food rescue partner, so it feeds people","why":"Safe food that people can eat ranks just below prevention.","_n":"35b11","_k":"35b84564"},{"t":"Animal feed","why":"People come before animals for safe food.","_n":"36b01","_k":"af8fa42d"},{"t":"Compost","why":"Compost ranks below feeding people and animals.","_n":"37b31","_k":"09bf4917"}]},"b":{"prompt":"A café has carrot peels and trimmings: safe, but not fit to serve people. Best choice?","options":[{"t":"Compost","why":"Animal feed ranks above compost.","_n":"38b21","_k":"d3f98b99"},{"t":"A food rescue partner","why":"Trimmings aren’t fit to serve people.","_n":"39a51","_k":"4f1617fa"},{"t":"A farm partner for animal feed","why":"The highest level they qualify for.","_n":"3aa41","_k":"cee01b8c"},{"t":"Landfill","why":"Animal feed and compost both rank higher.","_n":"3b1b1","_k":"dd136566"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Model baseline (continuous corn): yield 100, soil organic matter falling, erosion high. Which practices make soil \u003cstrong>rising\u003c/strong> and erosion \u003cstrong>low\u003c/strong> while keeping yield ≥ 98?","options":[{"t":"Summer fallow + no-till","why":"Fallow cuts yield to about 73.","_n":"3c1c1","_k":"610cd4c2"},{"t":"Crop rotation + cover crops + no-till","why":"Yield 100, soil +1, erosion 1.","_n":"3d1d1","_k":"cec9f18d"},{"t":"Cover crops + no-till only","why":"Soil only reaches steady, and yield is 97.","_n":"3e1e1","_k":"47ef284e"},{"t":"IPM + intercropping","why":"Neither raises soil organic matter.","_n":"3f1f1","_k":"b1c817c6"}]},"b":{"prompt":"In the model, what would adding \u003cstrong>summer fallow\u003c/strong> to rotation + cover crops + no-till do?","options":[{"t":"Cut yield sharply (by 25) and raise erosion","why":"Bare fallow grows nothing one year in four and exposes soil.","_n":"3g201","_k":"685b02b7"},{"t":"Raise yield","why":"Fallow lowers yield.","_n":"3h211","_k":"a275e892"},{"t":"Have no effect","why":"Every practice changes the model.","_n":"3i221","_k":"26f7b018"},{"t":"Make soil organic matter rise faster","why":"Fallow lowers it (−1).","_n":"3j231","_k":"57d9855a"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the clearest advice about unopened yogurt kept in the fridge and 2 days past its best-before date?","options":[{"t":"“Best-before dates are just marketing.”","why":"They give real information about quality.","_n":"3k241","_k":"1b28905c"},{"t":"“Best-before is about quality, not safety. Unopened and kept cold, it may still be good. Check it, and when in doubt, throw it out.”","why":"Best-before is about quality for unopened food stored properly. Expiration dates (on a few products, like infant formula) mean don’t use after the date.","_n":"3l211","_k":"73f10ce9"},{"t":"“Throw it out; it’s unsafe after the date.”","why":"Best-before isn’t a safety date.","_n":"3m201","_k":"66e6e7c2"},{"t":"“Eat any food no matter what the label says.”","why":"Expiration dates and storage still matter.","_n":"3n1f1","_k":"eb15971e"}]},"b":{"prompt":"Which sentence correctly explains an \u003cstrong>expiration date\u003c/strong>?","options":[{"t":"“Don’t buy, sell or use the product after this date; it may no longer have the nutrients its label promises.”","why":"Expiration dates appear on a few products, such as infant formula, and mean don’t use after the date.","_n":"3o1e1","_k":"35159a6f"},{"t":"“It means the food is better after the date.”","why":"The opposite.","_n":"3p251","_k":"eaaf7ac6"},{"t":"“It tells you when the product was packaged.”","why":"That’s “packaged on”.","_n":"3q241","_k":"8a6d9d9a"},{"t":"“It’s the same as a best-before date.”","why":"Best-before is about quality for unopened food stored properly. Expiration dates (on a few products, like infant formula) mean don’t use after the date.","_n":"3r231","_k":"a8539652"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which caption best describes the Canadian food-waste estimate (Second Harvest &amp; VCMI, 2019)?","options":[{"t":"“Food waste happens only in grocery stores.”","why":"It happens at every stage.","_n":"3s221","_k":"51e14216"},{"t":"“All 58% could have been eaten.”","why":"Some is inedible: bones, peels, trimmings.","_n":"3t291","_k":"5cbef876"},{"t":"“Households waste 58% of Canada’s food.”","why":"58% covers every stage, not just households.","_n":"3u281","_k":"5274ce52"},{"t":"“Food is lost or wasted at every stage in Canada, and about a third of all food produced was avoidable loss or waste.”","why":"The estimate covers every stage, and only part of it was avoidable.","_n":"3v1f2","_k":"e57b23a0"}]},"b":{"prompt":"Which caption best describes the model household audit (2.0 kg total)?","options":[{"t":"“Forgotten food was the biggest reason (45%), followed by date confusion (35%).”","why":"0.9 kg forgotten and 0.7 kg date confusion, out of 2.0 kg.","_n":"3w202","_k":"477de3f2"},{"t":"“Most waste came from buying too much.”","why":"That was 0.1 kg (5%).","_n":"3x1d2","_k":"6ae3eff3"},{"t":"“Date confusion was the biggest reason.”","why":"0.7 kg \u003c 0.9 kg.","_n":"3y1e2","_k":"9b20cb57"},{"t":"“The household wasted 45 kg.”","why":"45% of 2.0 kg = 0.9 kg.","_n":"3z232","_k":"f622e727"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A school cafeteria wants to cut waste. Which action is \u003cstrong>highest on the hierarchy\u003c/strong>?","options":[{"t":"Composting plate scraps","why":"That’s recycling, near the bottom.","_n":"40242","_k":"a7a9d91f"},{"t":"Donating unserved surplus","why":"Good, but prevention ranks higher.","_n":"41212","_k":"a1ce03cf"},{"t":"Smaller default portions with free seconds (prevention)","why":"Prevents waste before it happens.","_n":"42222","_k":"5fdd3aa8"},{"t":"Buying bigger garbage bins","why":"That doesn’t reduce waste.","_n":"43272","_k":"a72fca93"}]},"b":{"prompt":"Which cafeteria action is \u003cstrong>unsafe\u003c/strong> and must be rejected?","options":[{"t":"Composting plate scraps","why":"Safe and better than landfill.","_n":"44282","_k":"c13cb287"},{"t":"A share table for unopened, packaged items","why":"Unopened items can be shared safely.","_n":"45252","_k":"224afc97"},{"t":"Re-serving food left on students’ plates","why":"Food from someone’s plate is never re-served.","_n":"46242","_k":"057cf1b6"},{"t":"Donating unserved surplus through a food rescue group","why":"Safe when handled properly.","_n":"47272","_k":"df22ab3f"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A student group wants to tackle both food waste and food insecurity in their town. Which plan does both and reflects food insecurity’s main cause?","options":[{"t":"Partner with a food rescue organization, and write to their MPP supporting income-based solutions","why":"Rescue reduces waste; food insecurity is mainly about income.","_n":"48262","_k":"4626a402"},{"t":"Collect plate leftovers from the cafeteria for families","why":"Unsafe.","_n":"49212","_k":"03a53ff7"},{"t":"Run a food drive, because food rescue alone will end food insecurity","why":"Helpful, but income is the main cause.","_n":"4a202","_k":"ddaad412"},{"t":"Compost cafeteria waste","why":"Reduces landfill only.","_n":"4b232","_k":"0699ba7e"}]},"b":{"prompt":"Why doesn’t food rescue alone solve food insecurity in Canada?","options":[{"t":"Most food insecurity comes from low income; rescued food helps, but can’t replace adequate income","why":"Food rescue helps, but food insecurity in Canada comes mainly from low income.","_n":"4c222","_k":"e7b253ed"},{"t":"Food insecurity only exists in other countries","why":"It affects many Canadian households.","_n":"4d2d2","_k":"114e1d7b"},{"t":"Rescued food is unsafe to eat","why":"Rescued food is handled under safety rules.","_n":"4e2c2","_k":"23c51b81"},{"t":"Canada has no food waste to rescue","why":"There’s plenty of avoidable waste.","_n":"4fb31","_k":"7b61138f"}]}}]},"task":{"title":"Cafeteria waste plan","summary":"Cafeteria waste plan","statement":"\u003cp>Your school cafeteria sends too much to landfill. Choose exactly three actions that together meet every condition. Can you find all the answers?\u003c/p>\u003cp class=\"tiny muted\">Landfill cuts and costs are per week. \u003cspan class=\"hfa-model\">Model data\u003c/span>\u003c/p>","chips":[{"id":"a","t":"Trayless lunch line","cut":6,"cost":0,"type":"Prevention"},{"id":"b","t":"Smaller default portions with free seconds","cut":8,"cost":0,"type":"Prevention"},{"id":"c","t":"Pre-order lunch system","cut":10,"cost":15,"type":"Prevention"},{"id":"d","t":"Share table for unopened items","cut":5,"cost":5,"type":"Recovery"},{"id":"e","t":"Donate unserved surplus to a food rescue group","cut":9,"cost":10,"type":"Recovery"},{"id":"f","t":"Compost plate scraps","cut":12,"cost":20,"type":"Recycling"},{"id":"g","t":"Re-serve food left on students’ plates","cut":10,"cost":0,"type":"Recovery","unsafe":true},{"id":"h","t":"Buy bigger garbage bins","cut":0,"cost":10,"type":"None"}],"checks":["Cuts at least 22 kg a week","Costs $20 a week or less","Includes a prevention action","Includes a recovery or recycling action","Food-safe","Exactly three actions"],"tips":["Prevention actions a and b are free. Use the budget for the others.","Composting is the biggest cut but costs $20.","Re-serving plate food is never safe.","Bigger bins cut nothing.","Three actions only."],"afterAt":4,"after3":"Every answer starts with prevention and adds a way to recover or recycle what’s left: the hierarchy in action.","more":"There’s more than one answer. Can you find all of them?","explainPrompt":"Explain why your plan follows the food recovery hierarchy, and why you rejected the actions you left out.","vocab":"Use the words prevention, recovery, hierarchy and food safety.","success":"Your plan meets every condition!"},"cards":[["Food loss","Food lost before retail: on farms, at harvest, in storage and processing (e.g. misshapen carrots left in the field)."],["Food waste","Food thrown out by stores, restaurants and households (e.g. stale bread at home)."],["Food recovery hierarchy","Prevent → feed people → feed animals → industrial use → compost → landfill."],["Why prevention first","It saves the land, water, energy and work used to make the food."],["Landfill and methane","Food buried without air releases methane, a strong greenhouse gas."],["Best-before date","Quality and freshness of unopened food stored properly; not a safety date."],["Expiration date","Don’t use after it; found on a few products such as infant formula."],["Crop rotation","Changing crops each season: breaks pest cycles and builds soil."],["Cover crops and no-till","Keep soil covered and undisturbed: less erosion, more organic matter."],["Integrated pest management (IPM)","Monitoring pests and using several methods, spraying only when needed."],["Avoidable vs unavoidable waste","Avoidable = edible food; unavoidable = bones, peels and other inedible parts."],["“When in doubt, throw it out”","Safety comes first; some harmful bacteria can’t be seen or smelled."]]}};</script>
