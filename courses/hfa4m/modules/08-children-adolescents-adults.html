.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;

--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}

--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;

--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}

--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 08: hero (calcium and iron bars), Life-stage switcher (needs curve, plate check, drink shelf, TC3 cafeteria menu),
   Teen food realities (stations), "Read the data" chart, "Fuel Kwasi's game day" task. Role colours from hfa4u.css: calcium, iron
   and vitamin D --nu-micro (violet); fibre --nu-carb (orange, a carbohydrate); protein --nu-protein (magenta); drink sugar
   --nu-carb; caffeine --ink. Male DRI bars are striped, female solid, always with F/M letters. Red and green stay for feedback. */
/* radio groups (from HFA4U 06) */
.ty-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.ty-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.ty-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.ty-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ty-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.ty-chipset button:hover{border-color:var(--pen)}
.ty-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ty-chipset button.ty-f-micro{box-shadow:inset 4px 0 0 var(--nu-micro)}
.ty-chipset button.ty-f-carb{box-shadow:inset 4px 0 0 var(--nu-carb)}
.ty-chipset button.ty-f-protein{box-shadow:inset 4px 0 0 var(--nu-protein)}
.ty-chipset button.ty-selfchip{border-style:dashed;border-color:var(--ink-2)}
.ty-ico{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em;flex:0 0 auto;margin-right:3px}
.ty-h4{margin:0 0 6px;font-size:1rem}
.ty-h5{margin:16px 0 6px;font-size:.95rem}
.ty-lit{box-shadow:0 0 0 3px var(--hi)!important;border-radius:6px}
.ty-cxmsg{display:inline-block;margin-top:4px;font-weight:700}
.ty-tag{display:inline-flex;align-items:center;gap:3px;font-size:.74rem;font-weight:700;border:1px solid var(--ink-2);color:var(--ink-2);border-radius:999px;padding:0 .5em;line-height:1.5}
.ty-tag.hv,.ty-tag.tea{border:1.5px dashed var(--ink);color:var(--ink)}
.ty-tags{display:flex;flex-wrap:wrap;gap:3px}
.ty-rm{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;min-width:32px;min-height:30px;font-weight:700}
.ty-rm:hover{border-color:var(--pen)}

/* hero */
.ty-hero{width:100%}
.ty-hsvg{display:block;width:100%;height:auto}
.ty-hbar{fill:var(--nu-micro)}
.ty-hbar.m{fill:url(#ty-hh);stroke:var(--nu-micro);stroke-width:1.5}
.ty-hhb{fill:var(--nu-micro-soft)}
.ty-hhl{stroke:var(--nu-micro);stroke-width:2.5}
.ty-hax{stroke:var(--ink);stroke-width:2.5}
.ty-hl{fill:var(--ink);font:700 15px var(--font-ui)}
.ty-hv{fill:var(--ink);font:700 14px var(--font-ui)}
.ty-ha{fill:var(--ink);font:400 14px var(--font-ui)}
.ty-hs{fill:var(--ink-2);font:400 12.5px var(--font-ui)}
.ty-hn{fill:var(--ink);font:700 13.5px var(--font-ui)}
.ty-hbr{fill:none;stroke:var(--ink);stroke-width:2}
.ty-hld{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.ty-hfl{fill:var(--sheet);font:700 12px var(--font-ui)}
.ty-hml{fill:var(--ink);font:700 12px var(--font-ui);paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.ty-cap{font-size:1.05rem!important}

/* Explore layout */
.ty-lab{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.ty-main,.ty-side{min-width:0}
.ty-side{border-left:1.5px solid var(--rule);padding-left:18px}
.ty-dri{margin:-4px 0 10px}

/* needs curve (F6): columns on wide screens, a horizontal bar list on phones */
.ty-curvew{margin:4px 0 8px}
.ty-cunit{margin:0;color:var(--ink-2);font-weight:700}
.ty-bb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 2px}
.ty-bb span{grid-column:2 / 4;position:relative;display:block;height:9px;margin:22px 18% 0;border:2px solid var(--ink);border-bottom:0}
.ty-bb b{position:absolute;left:-20%;right:-20%;bottom:12px;text-align:center;font-size:.85rem;color:var(--ink);white-space:nowrap}
.ty-curve .ty-rgw{display:block;margin:0}
.ty-rg.ty-curve{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.ty-col{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:1.5px solid transparent;background:none;border-radius:8px;padding:4px 2px 6px;min-width:0;text-align:center}
.ty-col:hover{border-color:var(--rule)}
.ty-col[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ty-cv{font-weight:700;font-size:.95rem;min-height:1.3em;font-variant-numeric:tabular-nums}
.ty-ct{position:relative;height:170px;border-bottom:3px solid var(--ink)}
.ty-cfill{position:absolute;bottom:0;left:18%;right:18%;height:calc(var(--v) * 100%);border-radius:3px 3px 0 0;background:var(--nu-micro)}
.ty-c-micro{background-color:var(--nu-micro)}
.ty-c-carb{background-color:var(--nu-carb)}
.ty-c-protein{background-color:var(--nu-protein)}
.ty-cfill.m,.ty-cfill.sm{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--sheet) 4px 7px)}
.ty-cfill.sf{left:8%;right:52%}
.ty-cfill.sm{left:52%;right:8%}
.ty-fl{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:.78rem;color:var(--sheet)}
.ty-cfill.sm .ty-fl{color:var(--ink)}
.ty-cfill.sm .ty-fl{text-shadow:0 0 3px var(--sheet),0 0 3px var(--sheet)}
.ty-cl{font-size:.92rem}
.ty-why{margin:6px 0 0;padding:6px 8px;border-left:4px solid var(--nu-micro);background:var(--paper);border-radius:4px}

/* plate check (F1) */
.ty-pdesc{margin:-4px 0 8px;color:var(--ink-2)}
.ty-priv{margin:0 0 6px}
.ty-abars{display:grid;gap:5px}
.ty-abar{display:grid;grid-template-columns:minmax(4.8rem,6.5rem) minmax(0,1fr) 8.6rem;align-items:center;gap:8px;font-size:.9rem}
.ty-atrack{position:relative;height:18px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.ty-afill{position:absolute;left:0;top:2px;bottom:2px;border-radius:3px}
.ty-aref{position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed var(--ink)}
.ty-aval{font-variant-numeric:tabular-nums;font-weight:700}
.ty-abar.low .ty-aval{font-weight:400}
.ty-akey{margin:2px 0 0}
.ty-vc{margin:6px 0 0;font-weight:700}
.ty-vc:empty{display:none}
.ty-day{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ty-slot,.ty-tslot{border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet);min-width:0}
.ty-slot.cur,.ty-tslot.cur{border-color:var(--ink)}
.ty-slc{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:3px}
.ty-slc li{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.9rem}
.ty-slc li > span{min-width:0}
.ty-shelfc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ty-card{display:flex;align-items:flex-start;gap:8px;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet);min-width:0}
.ty-cb{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:.92rem;line-height:1.25}
.ty-cvals{font-size:.8rem;color:var(--ink-2)}
.ty-card .btn{flex:0 0 auto}
.ty-full{grid-column:1 / -1;font-weight:700;margin:2px 0 0}

/* drink shelf: a real shelf that scrolls sideways inside its box */
.ty-shelfw{overflow-x:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:8px;margin:4px 0 6px;scroll-behavior:smooth}
.ty-shelf{display:flex;gap:8px;width:max-content}
.ty-dk{display:flex;flex-direction:column;gap:5px;width:190px;flex:0 0 auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px;transition:box-shadow .3s,opacity .3s}
.ty-dk.sel{border-color:var(--ink)}
.ty-dk.dim{opacity:.55}
.ty-dk.ty-glow{box-shadow:0 0 0 4px var(--hi),0 0 18px 4px var(--hi-soft);border-color:var(--ink)}
.ty-dsel{display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;padding:2px 0;text-align:left;min-height:36px}
.ty-dsel strong{font-size:.98rem}
.ty-dsel small{color:var(--ink-2);font-size:.8rem}
.ty-dsel[aria-pressed="true"] strong{text-decoration:underline;text-underline-offset:3px}
.ty-dbar{display:grid;grid-template-columns:5.4rem minmax(0,1fr) 3.4rem;align-items:center;gap:5px;font-size:.8rem}
.ty-dl{display:inline-flex;align-items:center;color:var(--ink-2)}
.ty-dt{position:relative;height:12px;background:var(--paper);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ty-dt i{position:absolute;left:0;top:1px;bottom:1px;border-radius:2px}
.ty-dt i.caf{background:var(--ink)}
.ty-dt i.sug{background:var(--nu-carb)}
.ty-dv{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.ty-dnote{margin:0;color:var(--ink-2)}
.ty-dn{margin:0;font-size:.84rem;line-height:1.3;flex:1 1 auto;padding:2px 4px}
.ty-dadd{align-self:flex-start}
.ty-moms{margin:4px 0 0;padding-left:1.4em;display:grid;gap:4px}
.ty-moms li.cur{font-weight:700}
.ty-moms .ty-rm{margin-left:6px;vertical-align:middle}
.ty-ktot{margin:6px 0 0}

/* TC3 cafeteria menu (inside its challenge card) */
.ty-cx{margin:8px 0}
.ty-menu{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ty-mi{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;border:1.5px solid var(--rule);border-radius:8px;padding:5px 8px;background:var(--sheet)}
.ty-mi.sw{border-style:dashed;border-color:var(--ink)}
.ty-mt{flex:1 1 12rem;min-width:0}
.ty-mcat{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;border-radius:999px;padding:0 .6em;line-height:1.6;border:1.5px solid var(--ink)}
.ty-mcat.most{background:var(--ink);color:var(--sheet)}
.ty-mcat.less{background:var(--hi-soft);color:var(--ink);border-style:solid}
.ty-mcat.np{border-style:dashed;color:var(--ink)}
.ty-tally{position:relative;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;margin:10px 0 2px;max-width:420px}
.ty-tc{display:grid;place-items:center;height:22px;font-size:.72rem;font-weight:700;border-radius:3px;border:1.5px solid var(--ink)}
.ty-tc.most{background:var(--ink);color:var(--sheet)}
.ty-tc.less{background:var(--hi-soft);color:var(--ink)}
.ty-tc.np{border-style:dashed;color:var(--ink)}
.ty-t80{position:absolute;left:calc(80% - 1px);top:-5px;bottom:-5px;border-left:2.5px solid var(--pen)}
.ty-tline{margin:4px 0 0}

/* Part 3 stations */
.ty-sta > p{max-width:none}
.ty-ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:6px}
.ty-idea{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px;text-align:left;min-height:44px}
.ty-idea:hover{border-color:var(--pen)}
.ty-idea small{color:var(--ink-2);font-size:.8rem}
.ty-idea.on{border-color:var(--ink);background:var(--hi-soft)}
.ty-box{margin:10px 0 0;border:2px dashed var(--ink-2);border-radius:10px;padding:8px 12px;background:var(--paper)}
.ty-boxl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ty-boxl li{display:flex;align-items:center;gap:8px}
.ty-mplate{width:40px;height:37px;flex:0 0 auto}
.ty-mplate.lg{width:64px;height:59px}
.ty-mprim{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.ty-mp{fill:none;stroke:var(--rule);stroke-width:1.2;stroke-dasharray:3 2}
.ty-mp.vf.on{fill:var(--leaf-soft);stroke:var(--leaf);stroke-dasharray:none}
.ty-mp.wg.on{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-dasharray:none}
.ty-mp.pf.on{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-dasharray:none}
.ty-tbl{border-collapse:collapse;font-size:.9rem;min-width:30rem}
.ty-tbl th,.ty-tbl td{border-bottom:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
.ty-tbl thead th{font-size:.82rem;color:var(--ink-2)}
.ty-mapw{max-width:600px}
.ty-map{position:relative;width:100%;aspect-ratio:10 / 7;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);overflow:hidden}
.ty-msvg{position:absolute;inset:0;width:100%;height:100%}
.ty-st{stroke:var(--ink-2);stroke-width:1.4;vector-effect:non-scaling-stroke;opacity:.55}
.ty-r500{position:absolute;width:64%;aspect-ratio:1;border:2px dashed var(--ink-2);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.ty-r500l{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--ink-2);background:var(--paper);padding:0 .3em;border-radius:3px}
.ty-pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:2px;min-width:34px;min-height:34px;z-index:1}
.ty-pin .ty-ico{width:26px;height:26px;margin:0;padding:3px;border-radius:50%;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);box-sizing:border-box}
.ty-pin.school .ty-ico{border-radius:6px;background:var(--ink);color:var(--sheet)}
.ty-pin.groc .ty-ico{border-style:double;border-width:3px}
.ty-pl{font-size:.75rem;font-weight:700;line-height:1.15;background:var(--sheet);border-radius:4px;padding:0 .3em;white-space:nowrap;color:var(--ink)}
.ty-pin.seen .ty-pl::after{content:" ✓"}
.ty-pin.on .ty-ico{background:var(--hi);color:var(--hi-ink);border-color:var(--hi-ink)}
.ty-pin.on .ty-pl{background:var(--hi);color:var(--hi-ink)}
.ty-mapnote{margin:4px 0 0}
.ty-pinfo{margin:8px 0}
.ty-pcard{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;background:var(--sheet)}
.ty-pcard p{margin:0 0 4px;max-width:none}
.ty-terms{margin:8px 0 0;display:grid;gap:6px}
.ty-terms div{border-left:4px solid var(--ink-2);padding:2px 0 2px 10px}
.ty-terms dt{font-weight:700}
.ty-terms dd{margin:0}
.ty-fair{margin:8px 0 0;font-weight:700}
.ty-scen{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 10px;background:var(--sheet)}
.ty-scen p{margin:0 0 6px;max-width:none}
.ty-sn{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;border:1.5px solid var(--ink);font-size:.8rem;font-weight:700}
.ty-scc{display:flex;flex-wrap:wrap;gap:6px}
.ty-scc .chip{text-align:left}
.ty-meal{margin:8px 0}
.ty-mealc{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.ty-mealc > div{min-width:0}
.ty-ml{margin:0 0 4px;padding-left:1.2em}
.ty-min{font-size:.78rem;font-weight:400;color:inherit;opacity:.85}
.ty-mtime{margin:4px 0 0;font-weight:700}
.ty-mtime.over{border-left:4px solid var(--ink);padding-left:8px}

/* Practice 2: model data chart */
.ty-dchart{margin:6px 0 14px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper)}
.ty-dchart figcaption{margin:0 0 8px}
.ty-dg{display:grid;gap:6px}
.ty-dgr{display:grid;grid-template-columns:3.4rem minmax(0,1fr);gap:8px;align-items:center;border-bottom:1px solid var(--rule);padding:0 0 5px}
.ty-dga{font-weight:700;font-size:.9rem}
.ty-dgb{display:grid;gap:2px}
.ty-dgl{display:grid;grid-template-columns:1.1rem minmax(0,1fr) 2.8rem;align-items:center;gap:6px;font-size:.82rem}
.ty-dgt{position:relative;height:13px;background:var(--sheet);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.ty-dgt i{position:absolute;left:0;top:1px;bottom:1px;border-radius:2px;background:var(--nu-micro)}
.ty-dgt i.m{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--sheet) 4px 7px)}
.ty-dgv{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* performance task: Fuel Kwasi's game day */
.ty-lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:5px}
.ty-lc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 8px;text-align:left;min-height:40px}
.ty-lc:not(:disabled):hover{border-color:var(--pen)}
.ty-lc.on{border-color:var(--ink);background:var(--hi-soft)}
.ty-lc:disabled{opacity:.55}
.ty-lct{font-weight:700}
.ty-tpv{min-width:0}
.ty-tday{display:grid;gap:6px}
.ty-kc{margin-top:12px;padding-top:10px;border-top:1.5px solid var(--rule)}
.ty-kc p{margin:0;max-width:none}

@media (max-width:820px){
  .ty-lab{grid-template-columns:minmax(0,1fr)}
  .ty-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
}
@media (max-width:560px){
  .ty-bb{display:block;margin:0 0 4px}
  .ty-bb span{border:0;border-left:4px solid var(--nu-micro);height:auto;margin:0;padding-left:8px}
  .ty-bb b{position:static;font-size:.82rem}
  .ty-rg.ty-curve{grid-template-columns:minmax(0,1fr);gap:4px}
  .ty-col{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 6.6rem;grid-template-areas:"l t v";align-items:center;gap:8px;text-align:left;padding:4px 6px}
  .ty-col.bb{box-shadow:inset 4px 0 0 var(--nu-micro)}
  .ty-cv{grid-area:v;text-align:right;min-height:0;font-size:.88rem}
  .ty-ct{grid-area:t;height:24px;border-bottom:0;border-left:3px solid var(--ink)}
  .ty-cl{grid-area:l}
  .ty-cfill{top:3px;bottom:3px;left:0;right:auto;height:auto;width:calc(var(--v) * 100%);border-radius:0 3px 3px 0}
  .ty-cfill.sf{top:1px;bottom:52%;left:0;right:auto}
  .ty-cfill.sm{top:52%;bottom:1px;left:0;right:auto}
  .ty-col.sp .ty-ct{height:40px}
  .ty-fl{top:50%;bottom:auto;left:3px;right:auto;transform:translateY(-50%);font-size:.7rem;line-height:1}
  .ty-abar{grid-template-columns:4.6rem minmax(0,1fr) 7.4rem;font-size:.85rem;gap:6px}
  .ty-day,.ty-shelfc{grid-template-columns:minmax(0,1fr)}
  .ty-dk{width:172px}
  .ty-pl{font-size:.68rem}
  .ty-pin .ty-ico{width:22px;height:22px}
  .ty-mealc{flex-direction:column}
}

</style>

tanding those pulls.","fig":{"html":"\u003cdiv class=\"ty-hero\" id=\"ty-hero\">\u003c/div>","caption":""},"aria":"Two bar charts of RDAs by age group. Calcium: 1000 mg a day at 4–8, 1300 mg at 9–13 and 14–18, and 1000 mg at 19–50; the two teen bars are tallest, under a bracket labelled “bone-building years”. Iron: 10 mg at 4–8 and 8 mg at 9–13; at 14–18 the bar splits into female 15 mg and male 11 mg, with a note “menstruation”; at 19–50, female 18 mg and male 8 mg.","caption":"Calcium and iron RDAs by age, in mg a day"},"goals":["I can explain how nutrient needs change from childhood through adolescence to adulthood, especially calcium and iron.","I can describe how family, culture, peers, schedules, money and media influence food choices at different life stages.","I can evaluate drinks (caffeine, sugar) and sports-nutrition claims for teens.","I can explain how stress, busy schedules and body-shape pressures can affect eating, and where to find support.","I can apply Ontario’s school food policy to a menu.","I can plan and prepare a meal that fits a busy teen’s needs and culture."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Nutrient roles","goal":1,"prompt":"Which two nutrients work together to build strong bones?","options":[{"t":"Fibre and water","why":"They help digestion.","_n":"038d","_k":"4d1d865a"},{"t":"Iron and vitamin C","why":"That pair is about absorbing iron.","_n":"13bd","_k":"cf7d3579"},{"t":"Sodium and potassium","why":"They’re about fluid balance and blood pressure.","_n":"23ad","_k":"a7897e7d"},{"t":"Calcium and vitamin D","why":"Vitamin D helps the body absorb and use calcium.","_n":"33dd","_k":"17bffd8e"}],"hints":["Which mineral is most of bone?","Which vitamin helps absorb it?","Calcium and vitamin D."]},{"id":"w2","skill":"Nutrient roles","goal":1,"prompt":"Which pairing helps the body absorb iron from plant foods?","options":[{"t":"Lentils with a calcium supplement","why":"Calcium can compete with iron at the same meal.","_n":"43cd","_k":"08c51d45"},{"t":"Lentils with coffee","why":"Coffee reduces absorption too.","_n":"53fd","_k":"903579a1"},{"t":"Lentils with red pepper","why":"Vitamin C boosts plant-iron absorption.","_n":"63ed","_k":"26c87a2a"},{"t":"Lentils with tea","why":"Tea reduces plant-iron absorption at meals.","_n":"731d","_k":"48d9b990"}],"hints":["Which vitamin helps iron?","Vitamin C.","Red pepper is rich in it."]},{"id":"w3","skill":"Canada’s Food Guide","goal":3,"prompt":"What does Canada’s Food Guide call the drink of choice?","options":[{"t":"Milk only","why":"Milk fits, but water is the drink of choice.","_n":"830d","_k":"e7b93ffa"},{"t":"Sports drinks","why":"Only for long, intense activity.","_n":"9d48","_k":"ec2b47e2"},{"t":"Water","why":"Water is the drink of choice: no sugar, no Calories, and it comes from the tap.","_n":"ad58","_k":"ae8ed048"},{"t":"Juice","why":"Juice isn’t recommended as a regular drink.","_n":"bd68","_k":"cf77d41b"}],"hints":["It has no sugar or Calories.","It comes from the tap.","Water."]},{"id":"w4","skill":"Canada’s Food Guide","goal":6,"prompt":"Which part of the Food Guide plate is the largest?","options":[{"t":"Vegetables and fruits (half)","why":"Half the plate is vegetables and fruits; whole grains and protein foods each fill a quarter.","_n":"cd78","_k":"3f696a80"},{"t":"Whole grains (half)","why":"Whole grains are a quarter.","_n":"dd88","_k":"6c6a58f3"},{"t":"All three are equal","why":"Vegetables and fruits get half.","_n":"ed98","_k":"339b1e33"},{"t":"Protein foods (half)","why":"Protein foods are a quarter.","_n":"fda8","_k":"2c51a1a8"}],"hints":["Picture the plate.","One section is twice the size of the others.","Vegetables and fruits."]},{"id":"w5","skill":"Labels","goal":3,"prompt":"A drink’s label says \u003cstrong>sugars 26% DV\u003c/strong>. That’s…","options":[{"t":"A lot (15% DV or more)","why":"26% is more than 15%, so it’s a lot.","_n":"gdb8","_k":"3310ade5"},{"t":"Not useful information","why":"%DV is a quick comparison tool.","_n":"hcc8","_k":"abecf615"},{"t":"A little","why":"5% or less is a little.","_n":"icd8","_k":"eedde1a3"},{"t":"Exactly a day’s sugar","why":"%DV compares one serving with a daily value.","_n":"j468","_k":"9fa10d03"}],"hints":["5 and 15.","Is 26 over 15?","A lot."]},{"id":"w6","skill":"Labels","goal":3,"prompt":"About how many grams of sugar are in 1 teaspoon?","options":[{"t":"About 15 g","why":"That’s closer to a tablespoon.","_n":"k458","_k":"14f86ba9"},{"t":"About 1 g","why":"Too small: a teaspoon holds about 4 g.","_n":"l488","_k":"465e8a2b"},{"t":"About 100 g","why":"Far too large.","_n":"m478","_k":"6820b7a5"},{"t":"About 4 g","why":"So 40 g of sugar is about 10 teaspoons.","_n":"n4a8","_k":"9d5cec43"}],"hints":["It’s a small number.","Between 3 and 5.","About 4 g."]}],"refreshers":{"Nutrient roles":"Calcium and vitamin D build bone; vitamin C helps the body absorb plant iron, while tea and coffee at meals reduce it.","Canada’s Food Guide":"Half vegetables and fruits, a quarter whole grains, a quarter protein foods; water is the drink of choice.","Labels":"5% DV is a little and 15% DV is a lot. About 4 g of sugar is 1 teaspoon."}}},"explore":{"heading":"Life-stage switcher","intro":"Pick a nutrient and watch how needs change with age. Then check a persona’s day, or compare drinks on the shelf.","stages":[{"id":"s4","t":"4–8"},{"id":"s9","t":"9–13"},{"id":"s14","t":"14–18"},{"id":"s19","t":"19–50"}],"driNote":"DRI tables are organized by sex and life stage. Individual needs vary; a health professional can give personal guidance. You can use either table, or t replaces what’s lost."},{"id":"p4","prompt":"Drink shelf: energy drink vs sports drink. What’s the key difference?","options":[{"t":"Energy drinks contain caffeine and other stimulants; sports drinks don’t","_n":"105b8","_k":"45088ff4"},{"t":"Energy drinks hydrate better","_n":"11588","_k":"98e5cca0"},{"t":"Sports drinks have more caffeine","_n":"12598","_k":"6600cb2a"},{"t":"They’re the same thing","_n":"13d28","_k":"64a4cacb"}],"explain":"Canadian energy drink labels say they’re not recommended for children. They’re not for hydration."}],"challenges":[{"id":"tc1","goal":1,"prompt":"Plate check for \u003cstrong>Lin (16)\u003c/strong>: build her school day so \u003cstrong>calcium and iron both reach 100%\u003c/strong>, with calcium at \u003cstrong>2 or more eating times\u003c/strong> and one \u003cstrong>plant-iron food paired with a vitamin C food\u003c/strong>.","why":"Calcium spread over the day, and plant iron with vitamin C at the same eating time.","msgs":{"close":"Close. Add pumpkin seeds or hummus.","spread":"Spread calcium across the day; it’s absorbed better in smaller amounts.","tea":"Tea reduces plant-iron absorption at meals. Swap in an orange or red pepper.","persona":"This challenge is Lin’s day. Choose Lin in Plate check, then build her day.","empty":"Open Plate check, choose Lin, and add food cards to her eating times.","calcium":"Calcium is at {v}%; it needs to reach 100%. Milk, yogurt, cheese and the tofu stir-fry are calcium cards.","iron":"Iron is at {v}%; it needs to reach 100%. Lentil soup, fortified cereal and hummus are iron-rich.","pair":"Put a plant-iron food and a vitamin C food (an orange or red pepper) in the same eating time."},"hints":["Start with cereal and milk at breakfast.","Lentil soup is an iron powerhouse; add red pepper.","Breakfast: fortified cereal + milk + orange (calcium 30, iron 30). Lunch: lentil soup + red pepper (5, 40). Snack: yogurt + pumpkin seeds (20, 20). Dinner: tofu stir-fry + milk (67, 15). Totals: calcium 122%, iron 105%."]},{"id":"tc2","goal":3,"prompt":"Drink shelf: choose Kwasi’s drinks for 4 moments: \u003cstrong>breakfast\u003c/strong>, \u003cstrong>lunch\u003c/strong>, a \u003cstrong>90-minute soccer practice\u003c/strong>, and \u003cstrong>evening homework\u003c/strong>.","why":"No energy drinks, water most of the day, and a caffeine-free evening.","msgs":{"energy":"Energy drinks aren’t for teens or for hydration.","evening":"Caffeine late in the day can disrupt sleep.","sports":"Sports drinks are for long, intense activity.","choc":" Chocolate milk has a little caffeine (about 5 mg) from the cocoa.","empty":"Choose a drink for all 4 moments: {list}.","sweet":"Cola and iced tea add sugar and caffeine: choose them at most once in the day.","water":"Water is the drink of choice: use it at 2 or more moments."},"hints":["Start with water.","Practice is 90 minutes: water works, and a sports drink is optional there.","Water, water, water, plus milk or chocolate milk at a meal."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"A school cafeteria’s 10-item menu has 6 “Sell Most”, 3 “Sell Less” and 1 “Not Permitted for Sale” item. \u003cstrong>Swap exactly 2 items\u003c/strong> for options from the “Sell Most” list so it meets Ontario’s PPM 150 (at least 80% Sell Most, at most 20% Sell Less, none Not Permitted).","why":"8 Sell Most (80%), 2 Sell Less (20%), 0 Not Permitted.","how":"Tap \u003cstrong>Swap out\u003c/strong> on an item to replace it with a Sell Most option. Tap \u003cstrong>Undo\u003c/strong> to put it back.","msgs":{"np":"The soft drink is still there; Not Permitted items can’t stay on the regular menu.","less":"Sell Less is still {n} out of 10 ({p}%), over the 20% limit.","count":"Swap exactly 2 items: you’ve swapped {n}.","full":"That’s 2 swaps. Undo one to swap a different item."},"hints":["Which item can’t stay at all?","After removing it, how many Sell Less items are allowed out of 10?","Swap the soft drink and one Sell Less item."]}],"blocks":[{"title":"What the switcher shows","html":"\u003cp>Needs peak in the \u003cstrong>teen years\u003c/strong>, exactly when schedules, money and marketing pull hardest on what people eat.\u003c/p>\u003cp class=\"tiny muted\">For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"},{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Caffeine in foods\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Dietary reference intakes tables\u003c/i>. Government of Canada.\u003c/li>\u003cli>Ontario Ministry of Education. (2010). \u003ci>Policy/Program Memorandum No. 150: School food and beverage policy\u003c/i>. Queen’s Printer for Ontario.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"teens","name":"Realities","heading":"Teen food realities","support":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>","intro":"Four stations about real teen life: time, place and pressure. Try each one, then plan a quick meal for a busy teen.","stations":[{"id":"s1","t":"Station 1: the 5-minute morning","intro":"Tap quick breakfast ideas to put them in the \u003cstrong>ready in 5 minutes\u003c/strong> box. Then check each one with data.","box":"Ready in 5 minutes","ideas":[{"id":"toast","t":"Whole-grain toast with peanut butter and a banana","plate":["vf","wg","pf"]},{"id":"yog","t":"Yogurt with fruit and cereal","plate":["vf","wg","pf"]},{"id":"rice","t":"Leftover rice with an egg","plate":["wg","pf"]},{"id":"wrap","t":"A cheese and whole-grain wrap","plate":["wg","pf"]},{"id":"oats","t":"Overnight oats made the night before (oats soaked in milk, with fruit)","plate":["vf","wg","pf"]}],"sections":{"vf":"Vegetables and fruits","wg":"Whole grains","pf":"Protein foods"},"data":"Each quick breakfast covers two or three plate sections. Adding a piece of fruit to any of them adds a third."},{"id":"s2","t":"Station 2: the food environment","intro":"A model map of a school neighbourhood. Tap each place to see how distance, price and time shape a lunch-hour choice.","lunch":"Lunch is 40 minutes.","pins":[{"id":"school","t":"School","short":"School","kind":"school","info":"Lunch is 40 minutes. Everything inside the dashed circle is within 500 m: a short walk."},{"id":"ff1","t":"Burgers","short":"Burgers","kind":"ff","dist":"about 350 m","walk":"5 minutes","price":"a combo about $10","time":"ready in a few minutes"},{"id":"ff2","t":"Pizza by the slice","short":"Pizza","kind":"ff","dist":"about 400 m","walk":"5 minutes","price":"a slice and a drink about $5","time":"ready right away"},{"id":"ff3","t":"Fried chicken","short":"Chicken","kind":"ff","dist":"about 400 m","walk":"5 minutes","price":"a meal about $11","time":"ready in a few minutes"},{"id":"ff4","t":"Sub shop","short":"Sub shop","kind":"ff","dist":"about 450 m","walk":"6 minutes","price":"a sub about $8","time":"made while you wait"},{"id":"conv","t":"Convenience store","short":"Store","kind":"conv","dist":"about 250 m","walk":"3 minutes","price":"chips and pop about $4","time":"grab and go; few fresh foods"},{"id":"groc","t":"Grocery store","short":"Grocery →","kind":"groc","dist":"1.5 km","walk":"about 20 minutes each way","price":"bread, fruit, cheese and milk for less per serving","time":"the round trip uses the whole lunch hour"}],"terms":[{"t":"Food environment","d":"The food places, prices, marketing and access around where people live, learn and work, which shape what’s easy to choose."},{"t":"Food swamp","d":"An area crowded with fast food and convenience stores, where fresher options are farther away."}],"fair":"None of these choices is wrong. The setting makes some choices quicker and cheaper than others, often without anyone noticing.","data":"Research links neighbourhood food environments, such as how many fast-food outlets and convenience stores are near a school, to people’s eating patterns. Most of these studies are observational: they show links, not proof of cause (Minaker et al., 2016)."},{"id":"s3","t":"Station 3: stress, schedules and pressure","intro":"Four short scenarios. For each one, choose the most supportive next step.","scen":[{"id":"x1","who":"Amara, Grade 12","t":"Amara has three exams this week. She’s been studying through lunch and skipping it.","opts":[{"t":"Keep skipping lunch until exams are over","fb":"Skipping meals can drain energy and focus, right when she needs them.","_n":"14d18","_k":"f99719ef"},{"t":"Pack a snack the night before and eat it between study sessions","fb":"A small plan keeps energy and focus steady during exams.","_n":"15d08","_k":"ae15fcac"},{"t":"Drink an energy drink instead of lunch","fb":"Energy drinks aren’t food, and their labels say they’re not recommended for children.","_n":"16cf8","_k":"e5b2fad7"}]},{"id":"x2","who":"Lin, Grade 11","t":"Lin’s weekend shifts run late, and the only food near the break room is a vending machine.","opts":[{"t":"Pack a snack and a water bottle from home for her break","fb":"Planning ahead gives her more choice, wherever she works.","_n":"17ce8","_k":"d5b48b4a"},{"t":"Wait until she gets home after midnight to eat","fb":"A long gap can leave her low on energy; a planned snack helps.","_n":"18cd8","_k":"0f068d8f"},{"t":"Skip the break so the shift goes faster","fb":"Breaks are for resting and eating; regular snacks support energy.","_n":"19cc8","_k":"4ff86a79"}]},{"id":"x3","who":"Jordan, Grade 10","t":"Jordan’s group chat is full of “what I eat in a day” videos.","opts":[{"t":"Copy one creator’s meals exactly","fb":"Everyone’s needs differ, and content isn’t evidence.","_n":"1acb8","_k":"68b03490"},{"t":"Decide that everyone should eat like the videos","fb":"Bodies and needs vary; one person’s day isn’t a rule for anyone else.","_n":"1bda8","_k":"4a00c191"},{"t":"Notice that these videos are often ads or personal choices, not evidence","fb":"Noticing the marketing helps. It’s also fine to mute accounts that make you feel worse.","_n":"1cd98","_k":"0838f3b3"}]},{"id":"x4","who":"Kwasi, Grade 10","t":"After practice, a teammate makes a comment about Kwasi’s body size. It stays on his mind.","opts":[{"t":"Change how he eats to fit the comment","fb":"A comment about body size isn’t health advice. Healthy bodies come in many shapes and sizes.","_n":"1d4c8","_k":"c5c6bacd"},{"t":"Talk to a coach or counsellor he trusts","fb":"A trusted adult can help, and the comment may need to be addressed with the team.","_n":"1e4d8","_k":"c998dd48"},{"t":"Keep it to himself","fb":"Holding it in can make it heavier. Talking to someone he trusts is a good step.","_n":"1f4e8","_k":"f42bad31"}]}]},{"id":"s4","t":"Station 4: plan a meal for a busy teen","intro":"Plan a dinner that’s ready in about 15 minutes. Pick a base, a protein, vegetables and a flavour from Lin’s or Kwasi’s food culture.","who":[{"id":"lin","t":"Lin"},{"id":"kwasi","t":"Kwasi"}],"parts":[{"id":"base","t":"Base","opts":[{"id":"rice","t":"Leftover brown rice, reheated","min":2,"plate":"wg"},{"id":"noodle","t":"Whole-wheat noodles","min":6,"plate":"wg"},{"id":"wrap","t":"Whole-grain wrap","min":1,"plate":"wg"},{"id":"plantain","t":"Boiled plantain, cooked ahead","min":3,"plate":"vf"}]},{"id":"pro","t":"Protein","opts":[{"id":"eggs","t":"Scrambled eggs","min":4,"plate":"pf"},{"id":"beans","t":"Canned black-eyed peas or beans, rinsed","min":3,"plate":"pf"},{"id":"tofu","t":"Tofu cubes, pan-fried","min":7,"plate":"pf"},{"id":"chicken","t":"Leftover chicken","min":2,"plate":"pf"}]},{"id":"veg","t":"Vegetables","opts":[{"id":"frozen","t":"Frozen mixed vegetables","min":5,"plate":"vf"},{"id":"bokchoy","t":"Bok choy","min":4,"plate":"vf"},{"id":"spinach","t":"Baby spinach","min":2,"plate":"vf"},{"id":"tomcuc","t":"Sliced tomato and cucumber","min":3,"plate":"vf"}]},{"id":"flav","t":"Flavour","byWho":{"lin":[{"id":"gg","t":"Ginger and green onion","min":2},{"id":"gs","t":"Garlic and soy sauce","min":1},{"id":"bb","t":"Black bean sauce","min":1}],"kwasi":[{"id":"shito","t":"Shito (Ghanaian pepper sauce)","min":1},{"id":"tos","t":"Tomato, onion and ginger stew base","min":5},{"id":"gn","t":"Groundnut (peanut) sauce","min":3}]}}],"timeNote":"Model times: steps can overlap in a real kitchen.","over":"Over 15 minutes: try a leftover or a quicker option.","link":"The performance task at the end of the Final Check has a ready-made kitchen card too: a plantain and bean wrap for Kwasi’s game day."}],"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Minaker, L. M., Shuh, A., Olstad, D. L., Engler-Stringer, R., Black, J. L., &amp; Mah, C. L. (2016). Retail food environments research in Canada: A scoping review. \u003ci>Canadian Journal of Public Health, 107\u003c/i>(Suppl. 1), eS4–eS13.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Teen food realities quick check","summary":"Teen food realities quick check","items":[{"id":"q1","goal":6,"prompt":"Which 5-minute breakfast covers at least two Food Guide plate sections?","choices":[{"t":"Yogurt with fruit and cereal","_n":"1g4f8","_k":"0a4d91d8"},{"t":"A plain coffee","_n":"1h488","_k":"c199cc5a"},{"t":"Skipping breakfast","_n":"1i498","_k":"48b934fa"},{"t":"A can of iced tea","_n":"1j4a8","_k":"43df63d9"}],"right":"Right. Protein foods, fruit and a grain.","wrong":"Protein foods, fruit and a grain."},{"id":"q2","goal":2,"prompt":"A “food swamp” is…","choices":[{"t":"A farm with wet soil","_n":"1k4b8","_k":"aea52b93"},{"t":"An area crowded with fast food and convenience stores","_n":"1l548","_k":"050d5af2"},{"t":"A grocery store","_n":"1m558","_k":"7084f901"},{"t":"A food bank","_n":"1nde9","_k":"92ccc816"}],"right":"Right. It describes the food environment.","wrong":"It describes the food environment."},{"id":"q3","goal":4,"prompt":"Your feed is full of “what I eat in a day” videos. A helpful thought is…","choices":[{"t":"Skipping meals is normal","_n":"1odd9","_k":"208e36de"},{"t":"I must copy exactly","_n":"1pe09","_k":"e1c8b152"},{"t":"Bodies should all look the same","_n":"1qdf9","_k":"59c1456a"},{"t":"These are often ads or personal choices, not evidence","_n":"1rda9","_k":"aac875b1"}],"right":"Right. Bodies and needs vary; content isn’t evidence.","wrong":"Bodies and needs vary; content isn’t evidence."},{"id":"q4","goal":4,"prompt":"A friend keeps skipping lunch during exams. A supportive step is…","choices":[{"t":"Tell them to skip dinner too","_n":"1sd99","_k":"2bb35ffb"},{"t":"Ignore it","_n":"1tdc9","_k":"4aa1072a"},{"t":"Suggest packing a simple snack together","_n":"1udb9","_k":"6859af6d"},{"t":"Joke about it","_n":"1vd69","_k":"c7ab3eb5"}],"right":"Right. Small, kind, practical steps help.","wrong":"Small, kind, practical steps help."}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Life stage ↔ priority","summary":"Life stage ↔ priority","goal":[1,2],"instruction":"Match each life stage with its main nutrition priority.","leftTitle":"Life stage","rightTitle":"Priority","left":[{"id":"l1","t":"Ages 9–18"},{"id":"l2","t":"Females 14–50"},{"id":"l3","t":"Children 4–8"},{"id":"l4","t":"Teen athletes"},{"id":"l5","t":"Adults 19–50"},{"id":"l6","t":"Shift workers"},{"id":"l7","t":"All ages 1–70","hints":["Which vitamin has the same RDA across most ages?","It’s measured in IU.","Vitamin D, 600 IU."]},{"id":"l8","t":"Teens with part-time jobs"}],"right":[{"id":"r1","t":"Highest calcium RDA (1300 mg) for building bone"},{"id":"r2","t":"Higher iron needs because of menstrual losses"},{"id":"r3","t":"Steady growth; regular meals and snacks; adults set the menu"},{"id":"r4","t":"Enough energy and carbohydrate, water, and recovery meals with protein"},{"id":"r5","t":"Needs level off; patterns now shape long-term health"},{"id":"r6","t":"Planning meals and snacks around irregular hours"},{"id":"r7","t":"Vitamin D RDA 600 IU"},{"id":"r8","t":"Packing food and choosing quick, balanced options"}],"_a":"GURbAUQKR0ZTRBsSCgJHDkAUBRJKEgkHQFwVQlUSSRYOUhUKREJRFk5EWwVECkdGV0QbEgoGRw5AFAESShIJA0BcFUJREkkWDl4VCkRCXRYf","wrong":{"l1|r2":"Calcium peaks for all teens; the iron difference is about menstruation.","l2|r1":"Calcium peaks for all teens; the iron difference is about menstruation.","l4|r5":"Athletes have extra needs for energy and fluid.","l5|r4":"Athletes have extra needs for energy and fluid."},"wrongDefault":"Read each life stage’s main need, then try another match."},{"id":"data","type":"mc","title":"Read the data","summary":"Read the data","star":true,"goal":[1,2,3,4],"instruction":"Use the model chart above the questions. Choose the best answer for each. Items marked ★ are non-routine; the last two go beyond the Final Check.","chart":{"title":"Share of Canadians below the EAR for calcium, by age and sex","tag":"Model data based on the shape of national survey results; verify the real figures","groups":["9–13","14–18","19–30","31–50","51–70","71+"],"f":[60,82,52,56,76,74],"m":[44,50,30,34,54,66]},"items":[{"id":"d1","goal":1,"prompt":"Which group has the highest share below the calcium EAR?","options":[{"t":"Women 51–70","why":"Read the tallest bar. Women 51–70 are high, but teen girls are higher here.","_n":"1wd59","_k":"5d0ec7d3"},{"t":"Men 19–30","why":"Read the tallest bar. Men 19–30 have one of the shortest.","_n":"1xd88","_k":"e15332fa"},{"t":"Teen girls (14–18), in this model chart","why":"Their bar is the longest in this model chart.","_n":"1yd98","_k":"c3b72b8d"},{"t":"Teen boys (14–18)","why":"Read the tallest bar. The teen boys’ bar is shorter.","_n":"1zd68","_k":"942039fe"}],"hints":["Look for the longest bar.","Compare the female bars for 14–18 and 51–70.","Teen girls (14–18)."]},{"id":"d2","goal":2,"prompt":"Why might teen girls be lower in calcium than teen boys?","options":[{"t":"Girls’ bodies can’t absorb calcium","why":"Nothing in the chart shows that; the data alone doesn’t say why.","_n":"20d78","_k":"f0e2eac0"},{"t":"Many factors, e.g. drinking less milk and other drink choices; the data alone doesn’t say why","why":"The chart shows how many, not why. Drink choices are one possible factor.","_n":"21dc8","_k":"eb0881e2"},{"t":"The survey only asked girls","why":"The chart shows both girls and boys.","_n":"22dd8","_k":"ebda7761"},{"t":"Girls don’t need calcium","why":"The RDA is the same for both.","_n":"23da8","_k":"0559c0cd"}],"hints":["Does the chart tell you the reason?","It shows how many, not why.","Many factors; the data alone doesn’t say why."]},{"id":"d3","goal":1,"prompt":"The survey asked people to recall one day of eating. What’s a limitation? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"The survey had too many people","why":"A large sample is a strength, not a limit.","_n":"24db8","_k":"f1313be1"},{"t":"There’s no limitation","why":"Every method has limits.","_n":"25d08","_k":"345646e2"},{"t":"One day may not represent usual intake, and recall can be inaccurate","why":"A single day can be unusual, and people forget or misjudge what they ate.","_n":"26d18","_k":"961916b3"},{"t":"Recall surveys always overestimate everything","why":"Errors can go either way; the main issues are one day and memory.","_n":"27ca6","_k":"ff54c0d6"}],"hints":["Is one day typical?","Can people remember everything they ate?","One day may not be usual, and memory isn’t perfect."]},{"id":"d4","goal":3,"prompt":"A protein-powder ad says “teens need 2× the protein to build muscle”. Best response? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Buy it to be safe","why":"Most teens get enough protein from food; training and regular meals build muscle.","_n":"28c96","_k":"da415829"},{"t":"Trust it, because ads are checked for accuracy","why":"Ads sell products; they aren’t evidence.","_n":"29c86","_k":"c46b55d9"},{"t":"Double every protein food at every meal","why":"There’s no need to double. Most teens get enough protein from food; training and regular meals build muscle.","_n":"2ac76","_k":"875d6442"},{"t":"Most teens get enough protein from food; training and regular meals build muscle","why":"Food first: the ad is selling a product.","_n":"2bce6","_k":"2517dac8"}],"hints":["Who wrote this claim, and why?","Do most Canadian teens fall short on protein?","Food first: training and regular meals build muscle."]},{"id":"d5","goal":1,"prompt":"If the chart showed 30% below the EAR, does that mean 30% have a deficiency disease? \u003cspan class=\"tag\">★\u003c/span>","options":[{"t":"Yes, exactly 30%","why":"The EAR is a population tool, not a diagnosis.","_n":"2ccd6","_k":"a521abd3"},{"t":"Yes, and everyone else gets too much calcium","why":"Being above the EAR isn’t “too much”, and the EAR doesn’t diagnose anyone.","_n":"2dcc6","_k":"4b24c0f7"},{"t":"No, because the EAR is the upper limit","why":"The upper limit is the UL. The EAR is the Estimated Average Requirement.","_n":"2ecb6","_k":"b15b1047"},{"t":"No: below the EAR means intake is below the average requirement; it doesn’t diagnose deficiency","why":"The EAR is a population tool: it flags risk in a group, not illness in a person.","_n":"2fd26","_k":"d3bf091a"}],"hints":["What does EAR stand for?","Estimated Average Requirement: half of healthy people need more, half less.","Below it suggests a risk at population level, not a diagnosis."]},{"id":"d6","goal":4,"prompt":"Design a better question for a school survey on breakfast habits. \u003cspan class=\"tag\">★ Inquiry\u003c/span>","options":[{"t":"“Do you eat a healthy breakfast?”","why":"“Healthy” means different things to different people: a vague, leading question.","_n":"2gd16","_k":"291d34e7"},{"t":"“You eat breakfast every day, right?”","why":"That’s a leading question: it pushes people toward one answer.","_n":"2hc46","_k":"fb0fcc18"},{"t":"“Is breakfast the most important meal?”","why":"That asks for an opinion, not a habit.","_n":"2ic56","_k":"e3ecd088"},{"t":"“On how many of the last 7 school days did you eat something before first period?”","why":"It’s specific, neutral and countable, with a clear time frame.","_n":"2jc66","_k":"19dad4a7"}],"hints":["A good survey question is specific and neutral.","Give a time frame and a clear action.","Count the school days in the last week."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Hamish","goal":[1,3],"how":"","instruction":"Hamish made one mistake in each plan. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Plan for a Saturday soccer tournament.","steps":["“Eat a balanced breakfast 2–3 hours before the first game.”","“Drink an energy drink before kickoff for extra energy.”","“Sip water between games.”","“Eat a meal with protein and carbohydrate afterward.”"],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 is correct. The mistake is earlier.","Step 4 is correct."],"fixes":[{"t":"“Drink two energy drinks for a longer tournament.”","why":"Health Canada sets caffeine limits that are lower for children and teens; energy drink labels say “not recommended for children”.","_n":"2kc76","_k":"868fe6cc"},{"t":"Step 2 is correct.","why":"Energy drinks contain caffeine and other stimulants, not hydration. For most practices, water is enough.","_n":"2lc86","_k":"6386ab78"},{"t":"“Skip the energy drink; use water, and a carbohydrate snack like a banana if needed.”","why":"Energy drinks contain caffeine and other stimulants, not hydration. For most practices, water is enough.","_n":"2mc96","_k":"8519313b"},{"t":"“Drink nothing until the end.”","why":"Fluids matter during activity.","_n":"2nca6","_k":"351a88b3"}],"hints":["What’s in an energy drink?","Caffeine and stimulants, not hydration.","Water and a carbohydrate snack instead."]},{"id":"e2","goal":3,"task":"Advise a 15-year-old who wants to build muscle.","steps":["“Strength train under a coach’s guidance.”","“Eat regular meals that include protein foods.”","“Add protein shakes to every meal, because teens can’t get enough protein from food.”","“Get enough sleep for recovery.”"],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"“Avoid protein entirely.”","why":"Protein is needed.","_n":"2ocb6","_k":"c1cf8f79"},{"t":"“Replace meals with shakes.”","why":"Meals give many nutrients that shakes don’t.","_n":"2pcc6","_k":"8bc4f0eb"},{"t":"“Most teens get enough protein from varied foods; shakes are usually unnecessary.”","why":"Most teens get enough protein from food; training and regular meals build muscle.","_n":"2qcd6","_k":"522507ca"},{"t":"Step 3 is correct.","why":"Most teens get enough protein from food; training and regular meals build muscle.","_n":"2r3dc","_k":"7021406d"}],"hints":["Is a protein shortage common among Canadian teens?","Usually not.","Food first."]},{"id":"e3","goal":1,"task":"Explain why teens should care about calcium.","steps":["“Bones are living tissue that keeps changing.”","“Bones are finished growing by about age 12, so calcium matters less now.”","“Calcium and vitamin D work together.”","“Weight-bearing activity helps bones too.”"],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 is correct.","Step 4 is correct."],"fixes":[{"t":"“Calcium only matters for older adults.”","why":"Building bone early protects later.","_n":"2s3ec","_k":"58565465"},{"t":"Step 2 is correct.","why":"Adolescence builds a large share of lifetime bone, and bone mass keeps growing until about the late 20s.","_n":"2t3fc","_k":"c344c3b5"},{"t":"“Bones stop growing at age 5.”","why":"Adolescence builds a large share of lifetime bone, and bone mass keeps growing until about the late 20s.","_n":"2u40c","_k":"8276e0d7"},{"t":"“The teen years build a large share of adult bone, and bone mass grows until about the late 20s, so calcium matters now.”","why":"Adolescence builds a large share of lifetime bone, and bone mass keeps growing until about the late 20s.","_n":"2v41c","_k":"2d1de726"}],"hints":["Look at the calcium RDA for 9–18.","It’s the highest of any age.","These are the bone-building years."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"Which result on the needs curve surprised you most: the calcium peak, the iron difference, or how flat adult needs are?"},{"id":"j2","q":"In your own words, explain how a food environment can shape someone’s choices without them noticing."},{"id":"j3","q":"Explain to a younger sibling the difference between a sports drink and an energy drink."},{"id":"j4","q":"\u003cspan class=\"hfa-private\">Optional and private\u003c/span> What’s one realistic change that would make eating well easier on your busiest day? Who could help? (A private journal: it stays on your device and is never scored on content.)"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which age group has the highest calcium RDA?","options":[{"t":"19–50 years","why":"1000 mg.","_n":"2w42c","_k":"76a17caf"},{"t":"9–18 years","why":"1300 mg a day.","_n":"2x43c","_k":"c18af3a2"},{"t":"4–8 years","why":"1000 mg.","_n":"2y44c","_k":"55c9fb6f"},{"t":"All ages are equal","why":"Teens need the most.","_n":"2z35c","_k":"950430d4"}]},"b":{"prompt":"Why is the iron RDA higher for females aged 14–18 than for males?","options":[{"t":"Females grow taller","why":"Not the main reason.","_n":"3036c","_k":"8af6e8ba"},{"t":"It isn’t higher","why":"15 vs 11 mg.","_n":"3143c","_k":"1c52842b"},{"t":"Females exercise more","why":"Not a rule.","_n":"3242c","_k":"b932203d"},{"t":"Menstrual losses","why":"Menstruation raises iron needs: 15 mg a day for females aged 14–18 vs 11 mg for males.","_n":"3341c","_k":"c33c09a8"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"What’s the key difference between energy drinks and sports drinks?","options":[{"t":"Sports drinks have more caffeine","why":"Sports drinks usually have none.","_n":"3440c","_k":"c08f67d1"},{"t":"Energy drinks contain caffeine and other stimulants; sports drinks contain sugars and electrolytes for long activity","why":"Energy drinks contain caffeine and other stimulants, not hydration. For most practices, water is enough.","_n":"3547c","_k":"0b4d7268"},{"t":"They’re the same drink with different labels","why":"Energy drinks contain caffeine and other stimulants, not hydration. For most practices, water is enough.","_n":"3646c","_k":"a3f6d15d"},{"t":"Energy drinks are better for hydration","why":"They aren’t for hydration.","_n":"3745c","_k":"21a948ab"}]},"b":{"prompt":"For a 45-minute practice, what’s the best drink for most teens?","options":[{"t":"Water","why":"For most activity under an hour, water replaces what’s lost.","_n":"3844c","_k":"33788566"},{"t":"A sports drink every 10 minutes","why":"Not needed for under an hour.","_n":"393bc","_k":"81515aff"},{"t":"An energy drink","why":"Energy drinks contain caffeine and other stimulants, not hydration. For most practices, water is enough.","_n":"3a3ac","_k":"b51c1e68"},{"t":"Cola","why":"Sugar and caffeine, not needed.","_n":"3b49c","_k":"95e4483a"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Under Ontario’s PPM 150, at least what share of food choices sold must be “Sell Most”?","options":[{"t":"50%","why":"Not the rule.","_n":"3c4ac","_k":"27f3aa9b"},{"t":"100%","why":"Sell Less items are allowed up to 20%.","_n":"3d47c","_k":"969587da"},{"t":"80%","why":"PPM 150: at least 80% Sell Most, at most 20% Sell Less, and no Not Permitted items.","_n":"3e48c","_k":"c1520b23"},{"t":"20%","why":"That’s the maximum for Sell Less.","_n":"3f45c","_k":"02fd9462"}]},"b":{"prompt":"Under PPM 150, which category may make up \u003cstrong>at most\u003c/strong> 20% of choices?","options":[{"t":"Sell Most","why":"At least 80%.","_n":"3g46c","_k":"83621c4c"},{"t":"Sell Less","why":"PPM 150: at least 80% Sell Most, at most 20% Sell Less, and no Not Permitted items.","_n":"3h43c","_k":"b7dac715"},{"t":"Not Permitted for Sale","why":"Not allowed on the regular menu.","_n":"3i44c","_k":"f410c340"},{"t":"All categories","why":"Each has its own rule.","_n":"3j41c","_k":"9185249a"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"Lin (16) meets her calcium but her iron is at 60%. Which change helps most?","options":[{"t":"Add tea at lunch","why":"Tea reduces plant-iron absorption.","_n":"3k42c","_k":"2ae14eb4"},{"t":"Add a second yogurt","why":"Low in iron.","_n":"3lafd","_k":"da3a8e2d"},{"t":"Add another glass of milk","why":"Milk is low in iron.","_n":"3maed","_k":"83e952db"},{"t":"Add lentil soup with red pepper at lunch","why":"Plant iron plus vitamin C.","_n":"3nb1d","_k":"91e38a52"}]},"b":{"prompt":"Rina (9, vegetarian) meets her iron but her calcium is at 60%. Which change helps most?","options":[{"t":"Add pumpkin seeds","why":"Iron, not much calcium.","_n":"3ob0d","_k":"c4fd53f9"},{"t":"Add more pasta","why":"Low in calcium.","_n":"3pb3d","_k":"9a492f69"},{"t":"Add an orange","why":"Some calcium, but not enough.","_n":"3qb2d","_k":"13c7d205"},{"t":"Add yogurt at snack and milk or fortified soy beverage at dinner","why":"Two calcium-rich foods, spread over the day, that fit a vegetarian diet.","_n":"3rb5d","_k":"f5679002"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A 17-year-old plans to drink energy drinks to stay up for exams. What’s the best evidence-based advice?","options":[{"t":"Two cans a night are fine","why":"Health Canada sets caffeine limits that are lower for children and teens; energy drink labels say “not recommended for children”.","_n":"3sb4d","_k":"fea39251"},{"t":"Mix energy drinks with coffee for focus","why":"More caffeine, more risk.","_n":"3tb7d","_k":"c2c2bef1"},{"t":"Replace dinner with an energy drink","why":"Skipping meals harms focus. Regular meals and snacks support energy and focus. Quick options exist.","_n":"3ub6d","_k":"94d8a2e5"},{"t":"Avoid energy drinks; their labels say they’re not recommended for children, and sleep and regular meals support studying better","why":"Health Canada sets caffeine limits that are lower for children and teens; energy drink labels say “not recommended for children”.","_n":"3vb5d","_k":"70d20ff6"}]},"b":{"prompt":"A 15-year-old wants to start protein powder for basketball. Best advice?","options":[{"t":"Avoid all protein","why":"Protein is needed.","_n":"3wb6d","_k":"7b87d6e7"},{"t":"Take as much powder as possible","why":"Most teens get enough protein from food; training and regular meals build muscle.","_n":"3xb7d","_k":"e8939155"},{"t":"Stop eating protein foods and use powder","why":"Food gives many nutrients.","_n":"3yb8d","_k":"11a03927"},{"t":"Most teens get enough protein from food; focus on regular meals and talk to a dietitian if concerned","why":"Most teens get enough protein from food; training and regular meals build muscle.","_n":"3zb1d","_k":"ae8a70c6"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Marco (35) works night shifts and relies on vending machines. What’s the most practical strategy?","options":[{"t":"Skip eating during shifts","why":"Regular meals and snacks support energy and focus. Quick options exist.","_n":"40b2d","_k":"62b2a1c1"},{"t":"Drink energy drinks to stay awake","why":"Health Canada sets caffeine limits that are lower for children and teens; energy drink labels say “not recommended for children”.","_n":"41b3d","_k":"218558b5"},{"t":"Only eat once a day","why":"Regular meals and snacks support energy and focus. Quick options exist.","_n":"42b4d","_k":"6f9f3775"},{"t":"Plan and pack meals and snacks that fit his shift, using foods he enjoys","why":"Planning around the shift keeps his energy steady, and foods he enjoys make the plan last.","_n":"43bdd","_k":"a5b20b5b"}]},"b":{"prompt":"A family new to Canada finds familiar foods expensive. Which approach fits Canada’s Food Guide \u003cstrong>and\u003c/strong> their culture?","options":[{"t":"Skip meals to save money","why":"Regular meals and snacks support energy and focus. Quick options exist.","_n":"44bed","_k":"ce810e0a"},{"t":"Keep familiar staples while adding affordable seasonal, frozen or canned vegetables, and use community resources","why":"It keeps the family’s food culture and fits the budget: frozen and canned vegetables count.","_n":"45bbd","_k":"dc2500bb"},{"t":"Give up their traditional foods entirely","why":"Culture is part of healthy eating.","_n":"46bad","_k":"13f466a4"},{"t":"Eat only fast food because it’s cheap","why":"Not the only option.","_n":"47b9d","_k":"32828d09"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the most helpful way to describe how stress can affect eating?","options":[{"t":"“Skipping meals under stress is the best plan.”","why":"Regular meals and snacks support energy and focus. Quick options exist.","_n":"48b8d","_k":"5ef3a143"},{"t":"“Stress can change appetite and routines; noticing it kindly and planning simple meals can help, and talking to someone you trust is a good step.”","why":"It’s accurate and kind, and it points to support.","_n":"49b7d","_k":"d9a837e6"},{"t":"“Stress never affects eating.”","why":"It often does.","_n":"4ab6d","_k":"b315d050"},{"t":"“Stress eating means you lack willpower.”","why":"Judgemental and inaccurate.","_n":"4bb5d","_k":"5c50d604"}]},"b":{"prompt":"A friend skips meals and often talks about wanting a different body. What’s the most supportive response?","options":[{"t":"Ignore it","why":"Showing care matters.","_n":"4cb4d","_k":"49b4ed88"},{"t":"Comment on their weight","why":"Never helpful. Healthy bodies come in many shapes and sizes. Diet messages online are often marketing, not evidence.","_n":"4dc3d","_k":"229feab7"},{"t":"“Say you care, listen without commenting on their body, and encourage them to talk to a trusted adult or counsellor (and share support resources).”","why":"Care, listening without body comments and a trusted adult: that’s the supportive path.","_n":"4ec2d","_k":"3e1f20fc"},{"t":"Give them diet tips","why":"Not supportive; it can make things worse.","_n":"4fc1d","_k":"2b9375e3"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which statement best describes a food environment?","options":[{"t":"“A list of banned foods.”","why":"Not the meaning.","_n":"4gc2d","_k":"f9336ff1"},{"t":"“The food places, prices, marketing and access around where people live, learn and work, which shape what’s easy to choose.”","why":"It names the places, prices, marketing and access that shape easy choices.","_n":"4hbfd","_k":"7173f57a"},{"t":"“The temperature of a fridge.”","why":"That’s food safety.","_n":"4ic0d","_k":"085dd8d1"},{"t":"“A person’s favourite foods.”","why":"That’s preference.","_n":"4jc5d","_k":"a7557883"}]},"b":{"prompt":"Which statement about breakfast is most accurate?","options":[{"t":"“Regular meals, including something in the morning, support energy and focus; quick options can fit a busy schedule.”","why":"Regular meals support energy and focus, and quick options count.","_n":"4kc6d","_k":"8fbc8efe"},{"t":"“Skipping breakfast is required for focus.”","why":"Regular meals and snacks support energy and focus. Quick options exist.","_n":"4lc3d","_k":"1c937a0f"},{"t":"“Breakfast must be a large hot meal.”","why":"Quick options count.","_n":"4mc4d","_k":"d212bab1"},{"t":"“Only one ‘right’ breakfast exists.”","why":"Many options work.","_n
