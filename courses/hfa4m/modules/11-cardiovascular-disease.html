.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}

:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 11: hero (artery storyboard), Artery and heart model (F7), Sodium sleuth (F3 stations), Sodium budget, Heart-smart
   lunch. Colour roles (course plan §4, module plan §5): modifiable factors --risk-mod (blue), non-modifiable --risk-fixed
   (--ink-2, hatched); artery walls --ink-2; blood --pen; plaque --hi with an --ink fibrous cap; sodium orange (--p-k);
   saturated fat --nu-fat; fibre-rich foods --leaf. Red and green stay reserved for feedback. Every mark also has a word. */

/* radio groups (from HFA4U 07, with a locked state) */
.cv-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.cv-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.cv-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.cv-rg.locked button{cursor:not-allowed;color:var(--ink-2);background:var(--sheet)}
.cv-rg.seg.locked{border-style:dashed;border-color:var(--risk-fixed)}
.cv-rg.seg.locked button + button{border-left-color:var(--risk-fixed)}
.cv-rg.seg.locked button[aria-checked="true"]{background:var(--risk-fixed);color:var(--sheet)}
.cv-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cv-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.cv-chipset button:hover{border-color:var(--pen)}
.cv-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cv-ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;vertical-align:-.12em;margin-right:4px;flex:0 0 auto}

/* SVG parts shared by the hero, the model and the comparison */
.cv-hsvg,.cv-asvg,.cv-isvgel{display:block;width:100%;height:auto}
.cv-lumen{fill:var(--nu-water-soft)}
.cv-wall{fill:var(--ink-2);fill-opacity:.32;stroke:var(--ink-2);stroke-width:1.4}
.cv-wsoft{fill:var(--ink-2);fill-opacity:.12}
.cv-blood{fill:var(--pen)}
.cv-plq{fill:var(--hi);stroke:var(--ink-2);stroke-width:.8}
.cv-cap{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cv-crack{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.cv-spill{fill:var(--hi);stroke:var(--ink-2);stroke-width:.8}
.cv-clot{fill:var(--ink-2);fill-opacity:.62;stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.cv-plt{fill:var(--ink);stroke:var(--sheet);stroke-width:.6}
.cv-ldl{fill:var(--nu-fat)}
.cv-ldlp{fill:var(--nu-fat-soft);stroke:var(--nu-fat);stroke-width:2}
.cv-foam{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.8}
.cv-lining{fill:none;stroke:var(--ink-2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cv-t{fill:var(--ink);font:700 12.5px var(--font-ui)}
.cv-ts{fill:var(--ink-2);font:400 12px var(--font-ui)}
.cv-plab{fill:var(--hi-ink);font:700 12px var(--font-ui)}
.cv-tl{stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;fill:none}
.cv-tlm{fill:var(--ink)}
.cv-hchipb{fill:var(--sheet);stroke:var(--risk-mod);stroke-width:1.6}
.cv-hchipt{fill:var(--ink);font:700 11.5px var(--font-ui)}

/* hero */
.cv-hero{width:100%}
.cv-hchips{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.cv-hchip{font-size:.85rem;font-weight:700;border:1.5px solid var(--rule);border-radius:999px;padding:.15em .75em;background:var(--sheet)}
.cv-hchip.na{box-shadow:inset 5px 0 0 var(--p-k)}
.cv-hchip.sf{box-shadow:inset 5px 0 0 var(--nu-fat)}
.cv-hchip.fi{box-shadow:inset 5px 0 0 var(--leaf)}
.cv-hrow{display:flex;justify-content:flex-end;margin-top:4px}

/* Explore layout */
.cv-modes{border:0;margin:0 0 6px;padding:0;min-width:0}
.cv-fs{border:0;margin:0;padding:0;min-width:0}
.cv-fs:disabled{opacity:.72}
.cv-lab{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"view side" "ctrl ctrl";gap:14px 26px;align-items:start}
.cv-view{grid-area:view;min-width:0}
.cv-side{grid-area:side;min-width:0;border-left:1.5px solid var(--rule);padding-left:18px}
.cv-ctrl{grid-area:ctrl}
.cv-h4{margin:0 0 6px;font-size:1rem}
.cv-art{width:100%}
.cv-remind{margin:12px 0 0;padding:8px 10px;border:1.5px dashed var(--ink-2);border-radius:6px;font-size:.9rem;font-weight:700;color:var(--ink)}

/* readout */
.cv-big{font-size:1.4rem}
.cv-arr{display:inline-block;min-width:1.4em;font-weight:700}
.cv-read > div{border-radius:4px}
.cv-read > div.cv-chg{animation:cv-flash 1.2s ease-out}
.cv-read > div.cv-hl{background:var(--hi-soft);box-shadow:-6px 0 0 var(--hi-soft),6px 0 0 var(--hi-soft)}
@keyframes cv-flash{from{background:var(--hi-soft)}to{background:transparent}}
.cv-allbtn{display:none}

/* index bar: the non-modifiable floor (hatched) then modifiable points (blue) */
.cv-ibar{margin:4px 0 0}
.cv-ibt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:.88rem;margin-bottom:4px}
.cv-leg{color:var(--ink-2)}
.cv-sw{display:inline-block;width:.9em;height:.9em;border-radius:2px;vertical-align:-.1em;margin:0 3px 0 6px;border:1px solid var(--ink-2)}
.cv-sw.mod,.cv-cell.mod{background:var(--risk-mod);border-color:var(--risk-mod)}
.cv-sw.non,.cv-cell.non{background:repeating-linear-gradient(45deg,var(--risk-fixed) 0 2px,transparent 2px 5px);border-color:var(--risk-fixed)}
.cv-cells{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.cv-cell{height:16px;border:1.5px solid var(--rule);border-radius:3px;background:var(--sheet)}
.cv-bands{display:grid;grid-template-columns:3fr 3fr 3fr 4fr;gap:3px;margin-top:3px}
.cv-bands span{font-size:.74rem;line-height:1.2;color:var(--ink-2);border-top:2px solid var(--rule);padding-top:2px;text-align:center}
.cv-bands span.on{color:var(--ink);font-weight:700;border-top-color:var(--ink)}

/* P2 comparison */
.cv-cmp{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.cv-ch{margin:0 0 6px;font-weight:700}
.cv-cpans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cv-cpan svg{display:block;width:100%;height:auto}
.cv-ct{margin:0 0 2px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.cv-ci{margin:2px 0 0;font-size:.95rem}
.cv-plus{display:inline-block;margin-left:6px;padding:0 .5em;border-radius:999px;background:var(--hi);color:var(--hi-ink);font-weight:700}

/* controls */
.cv-prof{margin:-4px 0 10px;font-size:.92rem;color:var(--ink-2)}
.cv-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.cv-g{min-width:0;border:1.5px solid var(--rule);border-left:5px solid var(--risk-mod);border-radius:8px;padding:8px 12px 4px}
.cv-g.non{border-left:5px dashed var(--risk-fixed)}
.cv-gh{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;margin:0 0 8px;font-size:.95rem}
.cv-gtag{font-weight:400;font-size:.82rem;color:var(--ink-2)}
.cv-sl{margin:0 0 12px}
.cv-slt{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px}
.cv-slt label{font-weight:700;font-size:.92rem}
.cv-u{font-weight:400;color:var(--ink-2)}
.cv-slt output{font-weight:700;color:var(--risk-mod);font-size:.92rem}
.cv-sub{margin:0;font-size:.8rem;color:var(--ink-2)}
.cv-range{width:100%;accent-color:var(--risk-mod);margin:6px 0 0;min-height:24px}
.cv-ticks{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-2);margin-top:-2px}
.cv-pt{display:inline-block;font-size:.76rem;font-weight:700;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:0 .5em;white-space:nowrap}
.cv-rrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 0 4px}
.cv-rrow .cv-rgw{margin:0 0 6px}
.cv-g.non .cv-rgl{min-width:0}
.cv-crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px}
.cv-lockmsg{font-size:.9rem;font-weight:700;color:var(--ink-2)}

/* presets */
.cv-presets{margin:0 0 12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.cv-prow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cv-pbtn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:8px;padding:.35em .9em;font-weight:700;min-height:34px}
.cv-pbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.cv-ppanel p{margin:0 0 6px}
.cv-plates{margin:0 0 6px;padding-left:1.2em}
.cv-plates li{margin:0 0 4px}

/* inside the artery */
.cv-istep{margin:8px 0 0;min-height:2.6em}
.cv-isteps{margin:0;padding-left:1.3em}
.cv-isteps li{margin:0 0 6px;color:var(--ink-2)}
.cv-isteps li.past{color:var(--ink)}
.cv-isteps li.on{color:var(--ink);font-weight:700;background:var(--hi-soft);border-radius:4px;padding:0 4px}

/* about this model */
.cv-about{margin-top:16px}
.cv-ptab{margin-top:10px}
.cv-ptab th[scope="row"]{text-align:left}
.cv-rules{margin:10px 0 6px;padding-left:1.2em}
.cv-rules li{margin:0 0 4px}

/* Part 3 stations */
.cv-st + .cv-st{margin-top:20px;padding-top:16px;border-top:1.5px solid var(--rule)}
.cv-st h3{margin-top:0}
.cv-labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:12px;margin:10px 0 6px}
.cv-lcard{min-width:0;padding:8px;border:1.5px solid var(--rule);border-radius:8px}
.cv-lcard.done{border-color:var(--ink-2)}
.cv-lname{margin:0 0 6px;font-weight:700}
.cv-nft{width:100%;max-width:none;min-width:0}
.cv-naline{border:0;background:none;padding:2px 0;font:inherit;font-weight:700;text-align:left;text-decoration:underline dotted;text-underline-offset:3px;min-height:28px;color:inherit}
.cv-naline:hover{color:var(--pen)}
.cv-naline:disabled{text-decoration:none;opacity:1;color:inherit}
.cv-lvl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cv-lres{margin:6px 0 0;font-size:.92rem}
.cv-real{margin-top:12px}
.cv-rin{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:.9rem}
.cv-rin label{display:flex;flex-direction:column;gap:4px;font-weight:700}
.cv-rin input[type=text]{min-height:32px;padding:4px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:inherit}
.cv-rin input[type=file]{max-width:100%}
.cv-rfig{margin:10px 0 0}
.cv-rfig img{max-width:100%;height:auto;border:1px solid var(--rule)}
.cv-rfig figcaption{font-size:.85rem;color:var(--ink-2)}

/* sodium sources (orange: solid, hatched, outlined; each named in the legend) */
.cv-sbar{display:flex;height:28px;border:1.5px solid var(--ink-2);border-radius:6px;overflow:hidden;background:var(--sheet);margin:8px 0}
.cv-sseg{display:block;height:100%;transition:width .5s ease}
.cv-sseg.proc,.cv-sw2.proc{background:var(--p-k)}
.cv-sseg.rest,.cv-sw2.rest{background:repeating-linear-gradient(135deg,var(--p-k) 0 3px,var(--nu-carb-soft) 3px 7px)}
.cv-sseg.home,.cv-sw2.home{background:var(--nu-carb-soft);box-shadow:inset 0 0 0 2px var(--p-k)}
.cv-sseg + .cv-sseg{border-left:2px solid var(--sheet)}
.cv-sleg{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.92rem}
.cv-sleg li.gone{color:var(--ink-2);text-decoration:line-through}
.cv-sw2{display:inline-block;width:1em;height:1em;border-radius:2px;vertical-align:-.15em;margin-right:5px;border:1px solid var(--p-k)}
.cv-ql{margin:8px 0 4px;font-weight:700;font-size:.92rem}

/* swap lab */
.cv-swaps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.cv-swbtn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:8px;padding:.35em .85em;font-weight:700;min-height:34px;text-align:left}
.cv-swbtn[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.cv-swl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px 22px;align-items:start}
table.cv-dtab{font-family:var(--font-ui);font-size:.95rem}
table.cv-dtab td,table.cv-dtab tfoot th{text-align:left;white-space:normal;padding:5px 10px}
table.cv-dtab td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cv-meal{display:block;font-size:.75rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.cv-dtab tr.cv-swd td{background:var(--hi-soft)}
.cv-swtag{font-size:.75rem;font-weight:700;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:0 .45em;white-space:nowrap}
.cv-totn{margin:0 0 6px;font-size:1.15rem}
.cv-tbar{position:relative;height:22px;border:1.5px solid var(--ink-2);border-radius:5px;background:var(--sheet);margin:0 0 4px}
.cv-tfill{position:absolute;left:0;top:0;bottom:0;background:var(--p-k);border-radius:3px 0 0 3px;transition:width .4s ease}
.cv-tdv{position:absolute;top:-6px;bottom:-6px;border-left:2.5px dashed var(--ink)}
.cv-kfoods{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.cv-kfoods li{border:1.5px solid var(--rule);border-radius:999px;padding:.15em .8em;font-size:.92rem;background:var(--sheet)}

/* sorter box icons */
.cv-bico{width:1.4em;height:1.4em;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.cv-bico.mod{stroke:var(--risk-mod)}
.cv-bico.non{stroke:var(--risk-fixed)}
.cv-bico.soc{stroke:var(--ink)}

/* Practice 2 choice chips */
.cv-bchips{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.cv-bchip{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.45em .85em;text-align:left;min-height:36px;font-size:.95rem}
.cv-bchip:hover{border-color:var(--pen)}
.cv-bchip[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.cv-bchip.right{border-color:var(--green);background:var(--good-bg)}

/* task */
.cv-tin .cv-rgw{flex-direction:column;align-items:stretch;margin-bottom:12px}
.cv-tin .cv-chipset{flex-direction:column}
.cv-tin .cv-chipset button{border-radius:8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:.4em .8em}
.cv-mn{font-weight:700}
.cv-mv{font-size:.8rem;color:var(--ink-2);font-weight:400}
.cv-tin .cv-chipset button[aria-checked="true"] .cv-mv{color:var(--hi-ink)}
.cv-tkpv{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.cv-tray{margin:0 0 10px;font-weight:700}
.cv-lbar{margin:0 0 8px}
.cv-lbt{display:flex;justify-content:space-between;gap:8px;margin:0 0 3px;font-size:.92rem}
.cv-ltrack{position:relative;height:16px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--paper)}
.cv-lfill{position:absolute;left:0;top:0;bottom:0;border-radius:2px 0 0 2px}
.cv-lfill.na{background:var(--p-k)}
.cv-lfill.sf{background:var(--nu-fat)}
.cv-lfill.fi{background:var(--leaf)}
.cv-lmark{position:absolute;top:-5px;bottom:-5px;border-left:2.5px dashed var(--ink)}
.cv-lbar .tiny{margin:2px 0 0}
.cv-vegl{margin:6px 0}
.cv-after2{margin-top:8px}

@media (max-width:760px){
  .cv-lab{grid-template-columns:minmax(0,1fr);grid-template-areas:"view" "side" "ctrl"}
  .cv-side{border-left:0;padding-left:0}
  .cv-groups{grid-template-columns:minmax(0,1fr)}
  .cv-swl{grid-template-columns:minmax(0,1fr)}
  .cv-allbtn{display:inline-flex;margin-top:6px}
  .cv-read:not(.all) > .cv-more{display:none}
}
@media (prefers-reduced-motion:reduce){
  .cv-read > div.cv-chg{animation:none}
  .cv-sseg,.cv-tfill{transition:none}
}
.cv-lbg{fill:var(--sheet);fill-opacity:.88}
.cv-lead{stroke:var(--ink);stroke-width:1.4;fill:none}
/* keep Marlon's live panel in view while choosing (desktop; the panel follows the inputs on phones) */
@media (min-width:761px){ #task-pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 140px);align-self:start} }

</style>

<script>window.MV_PAYLOAD={"meta":{"id":"11-cardiovascular-disease","nn":"11","slug":"cardiovascular-disease","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 3","groupName":"Nutrition, Health and Disease","trivium":"","size":"M","storageKey":"hfa4u-11-cardiovascular-disease-v1","progressKey":"hfa4u-progress-v1:11-cardiovascular-disease","toolkit":"1.0.7"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"3f776593","content":{"id":"11-cardiovascular-disease","kind":"topic","title":"Cardiovascular disease","topic":"Cardiovascular Disease","readyTopic":"cardiovascular disease","hero":{"headline":"Your arteries keep score for decades","text":"Heart disease and stroke build slowly. \u003cstrong>Atherosclerosis\u003c/strong> (plaque growing inside artery walls) is shaped by \u003cstrong>blood pressure\u003c/strong> and \u003cstrong>LDL cholesterol\u003c/strong>, and eating patterns push on both. Some risk factors you can change; some you can’t; and some depend on where and how people live.","fig":{"html":"\u003cdiv class=\"cv-hero\" id=\"cv-hero\">\u003c/div>","caption":""},"chips":[{"id":"na","t":"Sodium → blood pressure"},{"id":"sf","t":"Saturated fat → LDL"},{"id":"fi","t":"Soluble fibre → LDL ↓"}],"chipB":"eating pattern + activity","caption":"Most heart attacks begin here: a rupture and a clot.","caps":{"start":"A healthy artery: blood flows smoothly.","grow":"Over decades, a thin streak in the wall thickens into plaque, and the opening narrows.","second":"Rewind: a second artery, with an eating pattern + activity, grows much less plaque."},"aria":"Two lengthwise views of an artery, with blood flowing as dots through the opening. Over a timeline from age 20 to 60, plaque grows inside the first artery’s wall and narrows the opening; at 60 the plaque’s cap cracks, platelets gather, a clot forms and the flow stops. The timeline rewinds and a second artery, labelled “eating pattern + activity”, grows much less plaque and keeps flowing.","rmAria":"Before and after, side by side. Top row: the first artery at age 20 is wide open; at 60 its plaque has ruptured and a clot blocks the flow. Bottom row, labelled “eating pattern + activity”: the second artery at age 20 is wide open; at 60 it has only a little plaque and blood still flows."},"goals":["I can explain how atherosclerosis develops and how it leads to a heart attack or stroke.","I can explain how sodium, saturated and trans fats, unsaturated fats and soluble fibre affect blood pressure and LDL cholesterol.","I can sort CVD risk factors into modifiable and non-modifiable, and explain how social conditions shape them.","I can use a population model to reason about how changing several factors changes risk, without treating it as a personal prediction.","I can read a Nutrition Facts table to find sodium and judge %DV using the 5% / 15% guide.","I can evaluate personal and community strategies to prevent CVD."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003cp>For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Types of fat","goal":2,"prompt":"Which fat is mostly unsaturated?","options":[{"t":"Butter","why":"Butter is high in saturated fat.","_n":"0372","_k":"b6cacf49"},{"t":"Coconut oil","why":"It’s a plant oil, but it’s mostly saturated.","_n":"1362","_k":"3f2c61c1"},{"t":"Lard","why":"Animal fats like lard are high in saturated fat.","_n":"2352","_k":"80cbbfd5"},{"t":"Canola oil","why":"Liquid plant oils like canola and olive are mostly unsaturated.","_n":"3342","_k":"913cb572"}],"hints":["Is it solid or liquid at room temperature?","Most liquid plant oils are unsaturated, with one notable exception.","Canola oil."]},{"id":"w2","skill":"Types of fat","goal":2,"prompt":"Why did Canada ban partially hydrogenated oils (the main source of industrial trans fat) in foods?","options":[{"t":"They spoil quickly","why":"They were used \u003cem>because\u003c/em> they kept foods fresh.","_n":"4332","_k":"914b8609"},{"t":"Trans fats raise LDL and lower HDL, increasing heart disease risk","why":"They harm both lipoproteins.","_n":"5322","_k":"6c50f86e"},{"t":"They contain sodium","why":"Fats don’t contain sodium.","_n":"6312","_k":"dd1e1f6d"},{"t":"They add too many calories compared with other fats","why":"All fats give 9 kcal/g; the issue is their effect on blood lipids.","_n":"7302","_k":"144b51bd"}],"hints":["Think blood cholesterol.","Which lipoproteins change?","LDL up, HDL down."]},{"id":"w3","skill":"Minerals and fibre","goal":2,"prompt":"Which mineral is most closely linked to raising blood pressure when eaten in excess?","options":[{"t":"Calcium","why":"Calcium matters for bones; it isn’t the main blood-pressure concern.","_n":"82f2","_k":"c965d0e3"},{"t":"Sodium","why":"For many people, more sodium means higher blood pressure.","_n":"923f","_k":"6888883c"},{"t":"Iron","why":"Iron carries oxygen in hemoglobin.","_n":"a24f","_k":"7966d114"},{"t":"Potassium","why":"Potassium tends to \u003cem>help lower\u003c/em> blood pressure.","_n":"b21f","_k":"d7c1bdd6"}],"hints":["Think salt.","Table salt is sodium chloride.","Sodium."]},{"id":"w4","skill":"Minerals and fibre","goal":2,"prompt":"Which food is a good source of soluble fibre?","options":[{"t":"Chicken breast","why":"Animal foods have no fibre.","_n":"c22f","_k":"eff31710"},{"t":"White sugar","why":"Sugar is a carbohydrate but has no fibre.","_n":"d27f","_k":"f32fdf16"},{"t":"Oats","why":"Oats, barley, beans and lentils are rich in soluble fibre.","_n":"e28f","_k":"34ed80d7"},{"t":"Cheddar cheese","why":"Dairy has no fibre.","_n":"f25f","_k":"9ba7c676"}],"hints":["Fibre comes only from plants.","Think breakfast grains and legumes.","Oats."]},{"id":"w5","skill":"Reading labels","goal":5,"prompt":"On a Nutrition Facts table, sodium is 20% DV. Using the 5% / 15% guide, that is…","options":[{"t":"A lot","why":"15% or more is a lot.","_n":"g26f","_k":"68d4f85b"},{"t":"Exactly the recommended amount","why":"%DV compares one serving with a daily value; it isn’t a target.","_n":"h1bf","_k":"0ed500f2"},{"t":"Impossible to judge without the serving size","why":"%DV already uses the serving shown.","_n":"i1cf","_k":"d9f9da3e"},{"t":"A little","why":"5% or less is a little.","_n":"j1df","_k":"ce66383a"}],"hints":["What are the two cut-offs?","5% and 15%.","20% is above 15%: a lot."]},{"id":"w6","skill":"Reading labels","goal":5,"prompt":"The Daily Value for sodium on Canadian labels is 2300 mg. What %DV is 230 mg?","options":[{"t":"100%","why":"That would be 2300 mg.","_n":"k1cf","_k":"9a176230"},{"t":"10%","why":"230 ÷ 2300 = 0.10.","_n":"l1bf","_k":"bcc823e9"},{"t":"23%","why":"That’s 230 ÷ 1000.","_n":"m1af","_k":"48939fc0"},{"t":"1%","why":"That’s 23 ÷ 2300.","_n":"n19f","_k":"277b8f3f"}],"hints":["Divide by 2300.","230 is one tenth of 2300.","10%."]}],"refreshers":{"Types of fat":"Unsaturated fats (most liquid plant oils, nuts, fish) are the heart-friendly choice to swap in. Saturated fats (butter, lard, coconut oil, fatty meats) and trans fats raise LDL.","Minerals and fibre":"Sodium tends to raise blood pressure; potassium (vegetables, fruits, legumes) tends to lower it. Soluble fibre (oats, barley, beans) helps lower LDL.","Reading labels":"%DV: 5% or less is a little, 15% or more is a lot. Sodium’s DV is 2300 mg."}}},"explore":{"heading":"Artery and heart model","intro":"Change a fictional persona’s eating pattern and lifestyle and watch the model respond. \u003cstrong>This is a teaching model built from population patterns. It can’t tell any real person their risk.\u003c/strong>","reminder":"Teaching model: population patterns, not a personal prediction.","modes":[{"id":"model","t":"Persona model"},{"id":"inside","t":"Inside the artery"},{"id":"presets","t":"Eating-pattern presets"}],"factors":[{"id":"na","t":"Sodium","unit":"mg/day","group":"eat","levels":["1500","2300","2800","3300","3800"],"pts":[0,0,1,1,2],"fmt":"{v} mg/day"},{"id":"sf","t":"Saturated fat","unit":"% of energy","group":"eat","levels":["6","10","14","18"],"pts":[0,0,1,2],"fmt":"{v}% of energy"},{"id":"fi","t":"Fibre-rich foods","sub":"beans, oats, vegetables, whole grains","group":"eat","levels":["many","some","few"],"pts":[0,1,2],"fmt":"{v}"},{"id":"act","t":"Activity","group":"life","levels":["active","some","inactive"],"pts":[0,1,2],"fmt":"{v}"},{"id":"smk","t":"Smoking or vaping","group":"life","levels":["no","yes"],"pts":[0,2],"fmt":"{v}"},{"id":"age","t":"Age band","group":"non","levels":["20s","40s","60s"],"pts":[0,1,2],"fmt":"{v}"},{"id":"fam","t":"Family history of early heart disease","short":"Family history","group":"non","levels":["no","yes"],"pts":[0,1],"fmt":"{v}"}],"groups":[{"id":"eat","t":"Eating pattern","tag":"modifiable"},{"id":"life","t":"Lifestyle","tag":"modifiable"},{"id":"non","t":"Non-modifiable","tag":"locked for personas, open in Free mode"}],"bands":{"bp":[{"max":1,"t":"typical"},{"max":2,"t":"higher"},{"max":4,"t":"much higher"}],"ldl":[{"max":0,"t":"lower"},{"max":2,"t":"typical"},{"max":4,"t":"higher"}],"view":[{"max":2,"t":"wide open"},{"max":5,"t":"some narrowing"},{"max":8,"t":"more narrowing"},{"max":13,"t":"much narrowing"}]},"rules":["\u003cstrong>Index\u003c/strong> = the sum of all points (0–13).","\u003cstrong>Blood-pressure trend\u003c/strong> = sodium points + activity points: 0–1 “typical”, 2 “higher”, 3–4 “much higher”.","\u003cstrong>LDL trend\u003c/strong> = saturated fat points + fibre points: 0 “lower”, 1–2 “typical”, 3–4 “higher”.","\u003cstrong>Artery view\u003c/strong> (by index): 0–2 “wide open”, 3–5 “some narrowing”, 6–8 “more narrowing”, 9+ “much narrowing”."],"personas":[{"id":"marlon","t":"Marlon, 48","s":{"na":4,"sf":2,"fi":2,"act":1,"smk":0,"age":1,"fam":1}},{"id":"agnieszka","t":"Agnieszka, 63","s":{"na":3,"sf":2,"fi":1,"act":1,"smk":0,"age":2,"fam":1}},{"id":"jordan","t":"Jordan, 26","s":{"na":3,"sf":3,"fi":2,"act":2,"smk":0,"age":0,"fam":0}},{"id":"free","t":"Free mode","s":{"na":3,"sf":2,"fi":1,"act":1,"smk":0,"age":0,"fam":0}}],"lockNote":"Locked: non-modifiable. Free mode opens these.","freeNote":"This is a teaching model for fictional personas, built from population patterns. Only a health professional can assess a real person.","steps":["LDL particles enter a damaged artery wall.","Immune cells take up the cholesterol (foam cells).","A plaque with a fibrous cap grows.","The cap ruptures.","A clot blocks blood flow (heart attack in a coronary artery; stroke in the brain)."],"presets":[{"id":"typical","t":"Typical Canadian","set":{"na":3,"sf":2,"fi":1},"foods":"The model’s typical Canadian pattern: sodium 3300 mg a day, saturated fat 14% of energy, some fibre-rich foods."},{"id":"dash","t":"DASH-style","set":{"na":0,"sf":0,"fi":0},"foods":"Vegetables, fruits, low-fat dairy, whole grains, legumes, nuts; less sodium.","plates":[{"t":"Caribbean","d":"Steamed fish with callaloo, brown rice and kidney beans, and mango; thyme, lime and pepper add flavour instead of extra salt."},{"t":"South Asian","d":"Chana masala (chickpeas) with brown basmati rice, cucumber raita made with low-fat yogurt, and a salad."},{"t":"East Asian","d":"Tofu and vegetable stir-fry with brown rice, edamame and an orange; ginger and garlic with a little lower-sodium soy sauce."}]},{"id":"med","t":"Mediterranean-style","set":{"na":1,"sf":1,"fi":0},"foods":"Olive oil, vegetables, legumes, whole grains, fish, nuts.","plates":[{"t":"Caribbean","d":"Grilled snapper with olive oil, a bean and vegetable stew, roasted sweet potato and pineapple."},{"t":"South Asian","d":"Lentil dal cooked with canola or olive oil, whole-wheat roti, spinach saag and a handful of almonds."},{"t":"East Asian","d":"Grilled mackerel or salmon, a mushroom and vegetable stir-fry in canola oil, brown rice and greens with sesame seeds."}]}],"flexible":"Both patterns are \u003cstrong>flexible across cultures\u003c/strong>. Each fits plates from many food traditions:","predictions":[{"id":"p1","persona":"marlon","prompt":"\u003cstrong>Marlon.\u003c/strong> Sodium moves from 3800 to 2300 mg/day. Which readout changes most?","options":[{"t":"LDL trend","_n":"o18f","_k":"220ca60b"},{"t":"Nothing changes","_n":"p17f","_k":"75fafc63"},{"t":"Non-modifiable points","_n":"q16f","_k":"478b8ef7"},{"t":"Blood-pressure trend","_n":"r25f","_k":"fa10fc4d"}],"explain":"Sodium works mainly through blood pressure. The blood-pressure trend falls from “much higher” to “typical”, and the index drops 8 → 6."},{"id":"p2","persona":"free","prompt":"\u003cstrong>Free mode\u003c/strong>, the same eating pattern for two settings: 20s with no family history vs 60s with family history. How much higher is the second index?","options":[{"t":"0 points","_n":"s24f","_k":"ece6ce5e"},{"t":"6 points","_n":"t17f","_k":"daa31a8f"},{"t":"3 points","_n":"u18f","_k":"4361f5da"},{"t":"1 point","_n":"v19f","_k":"43e8f1b7"}],"explain":"Age band 2 points + family history 1 point. Non-modifiable factors add to the same eating pattern."},{"id":"p3","persona":"jordan","prompt":"\u003cstrong>Jordan.\u003c/strong> Saturated fat drops from 18% to 10% of energy (swapping butter for canola oil, for example). Which trend changes?","options":[{"t":"Neither: all fat is the same","_n":"w1af","_k":"e424d8ce"},{"t":"Blood-pressure trend","_n":"x13f","_k":"3d33587f"},{"t":"LDL trend","_n":"y14f","_k":"8cf626ba"},{"t":"Both equally","_n":"z15f","_k":"b5071867"}],"explain":"Swapping saturated for unsaturated fat lowers LDL. The LDL trend moves from “higher” (4) to “typical” (2)."},{"id":"p4","prompt":"\u003cstrong>Inside the artery.\u003c/strong> In this model, what usually starts a heart attack?","options":[{"t":"The artery fills completely with fat from one meal","_n":"1016f","_k":"b4298217"},{"t":"The heart runs out of cholesterol","_n":"111ff","_k":"c60ca6c6"},{"t":"A plaque’s cap ruptures and a clot blocks the artery","_n":"1220f","_k":"f6a736e5"},{"t":"The blood becomes too salty to flow","_n":"1391f","_k":"fdc82773"}],"explain":"Plaque grows over years inside the wall; the sudden event is a rupture and clot."}],"challenges":[{"id":"tc1","goal":[3,4],"prompt":"\u003cstrong>Marlon:\u003c/strong> bring the index to \u003cstrong>4 or below\u003c/strong> by changing \u003cstrong>only his eating-pattern sliders\u003c/strong> (sodium, saturated fat, fibre).","why":"His eating points fell to 1 or less while his other 3 points stayed. Several modest changes add up.","msgs":{"activity":"Good idea in life, but this challenge is about eating only.","five":"One more eating change: which factor still has points?","persona":"This challenge is Marlon’s. Choose Marlon in the persona chips.","smoking":"Put his smoking setting back to “no”: this challenge is about eating only.","general":"His index is {n}. Eating points must be 1 or less: which eating factors still carry points?"},"hints":["His rt doesn’t run on cholesterol.","_n":"2e16e","_k":"300e731e"},{"t":"A plaque ruptures and a clot blocks a coronary artery","why":"Rupture plus clot.","_n":"2f21e","_k":"9f92829c"},{"t":"An artery slowly fills with fat over one day","why":"Plaque grows inside the artery wall over years. Most heart attacks happen when a plaque ruptures and a clot forms.","_n":"2g20e","_k":"775a9f2b"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which change in eating pattern lowers LDL cholesterol for most people?","options":[{"t":"Replacing saturated fats with unsaturated fats","why":"For example, butter → canola or olive oil.","_n":"2h13e","_k":"2ef4f39d"},{"t":"Eating more sodium","why":"Sodium isn’t an LDL lever.","_n":"2i14e","_k":"37c301e4"},{"t":"Replacing vegetables with fruit juice","why":"Juice adds sugar and loses fibre.","_n":"2j11e","_k":"57b1cf7e"},{"t":"Cutting out all fats","why":"Unsaturated fats help; fats aren’t all the same.","_n":"2k12e","_k":"8f9b4714"}]},"b":{"prompt":"Which food is the best source of soluble fibre to help lower LDL?","options":[{"t":"Lentils","why":"Legumes and oats are rich in soluble fibre.","_n":"2l17e","_k":"07048015"},{"t":"Chicken","why":"Animal foods have no fibre.","_n":"2m18e","_k":"a5a0a56c"},{"t":"Butter","why":"No fibre; high in saturated fat.","_n":"2n15e","_k":"e9b1319e"},{"t":"White rice","why":"Refined grains lose most of their fibre.","_n":"2o16e","_k":"e7aa0a0c"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which is a \u003cstrong>non-modifiable\u003c/strong> CVD risk factor?","options":[{"t":"High-sodium eating pattern","why":"That can change.","_n":"2p1be","_k":"25ccc59f"},{"t":"Family history of early heart disease","why":"You can’t change your relatives, but knowing helps with screening.","_n":"2q1ce","_k":"eff19d58"},{"t":"Physical inactivity","why":"That can change.","_n":"2r3ec","_k":"6cb3f59a"},{"t":"Smoking","why":"That can change, with support.","_n":"2s3fc","_k":"64a9b134"}]},"b":{"prompt":"Which is a \u003cst ,"cat":"A","goal":6,"a":{"prompt":"Which strategy is most likely to lower sodium intake across a whole community?","options":[{"t":"Blood pressure pills for everyone","why":"Medical decisions are individual; not a food strategy.","_n":"4938d","_k":"90d1e683"},{"t":"Removing salt shakers from cafeteria tables","why":"A small source.","_n":"4a37d","_k":"3f1f1144"},{"t":"Telling each person to try harder","why":"Ignores where sodium comes from. Cost, time and access to food shape choices. Prevention has to work at the community level too.","_n":"4b3ad","_k":"bedc89e5"},{"t":"Working with food manufacturers and restaurants to lower sodium in their foods","why":"Targets the largest source. Most sodium in Canadian diets comes from processed and restaurant foods.","_n":"4c39d","_k":"fea40e87"}]},"b":{"prompt":"Which strategy best helps low-income households eat more vegetables and fruit?","options":[{"t":"Banning fast food","why":"Doesn’t make produce affordable.","_n":"4d34d","_k":"39aaf202"},{"t":"Programs that lower the cost of produce or raise household income","why":"Cost, time and access to food shape choices. Prevention has to work at the community level too.","_n":"4e33d","_k":"b98234bf"},{"t":"Telling people to grow all their own food","why":"Not realistic for most households.","_n":"4faac","_k":"9b144f2e"},{"t":"Posters only","why":"Information alone doesn’t fix cost.","_n":"4gabc","_k":"2afce65c"}]}}]},"task":{"title":"Heart-smart lunch","summary":"Heart-smart lunch","statement":"\u003cp>Build a lunch for \u003cstrong>Marlon\u003c/strong> from the café menu (model values) that meets every condition. There are many answers. Find at least two.\u003c/p>\u003cp class=\"tiny muted\">Choose one main, one side and one drink. Model values for learning; real foods vary. No Calories are shown.\u003c/p>","checks":["Sodium at most half the DV","Saturated fat at most 4 g","At least 8 g fibre","A whole vegetable or fruit","A drink without added sugar"],"tips":["Find the saltiest item and swap it.","The pizza and chocolate milk carry the saturated fat.","Legumes and whole grains bring fibre.","Add the apple or vegetables with hummus.","Water is Canada’s Food Guide’s drink of choice."],"explainPrompt":"Explain how your lunch supports both blood pressure and LDL cholesterol. Name the item that does the most work for each.","vocab":"Use sodium, %DV, saturated fat, soluble fibre and legumes.","checkLabel":"Check my lunch","success":"Marlon’s lunch meets every condition.","more":"There are many answers. Can you find another?","after2":"Every answer uses the lentil soup or the chickpea wrap. Legumes carry this task. Can you find one with the most fibre?","rows":[{"id":"m","t":"Main","items":[{"id":"M1","t":"Canned chicken noodle soup","na":690,"sf":1,"fi":1,"veg":false},{"id":"M2","t":"Homemade lentil soup","na":345,"sf":0,"fi":7,"veg":true},{"id":"M3","t":"Deli turkey sandwich, white bread","na":1150,"sf":3,"fi":2,"veg":false},{"id":"M4","t":"Chickpea salad wrap, whole wheat","na":460,"sf":2,"fi":6,"veg":true},{"id":"M5","t":"Cheese pizza slice","na":690,"sf":6,"fi":2,"veg":false}]},{"id":"s","t":"Side","items":[{"id":"S1","t":"Apple","na":0,"sf":0,"fi":4,"veg":true},{"id":"S2","t":"Potato chips, small bag","na":230,"sf":1,"fi":1,"veg":false},{"id":"S3","t":"Raw vegetables with hummus","na":115,"sf":0,"fi":3,"veg":true},{"id":"S4","t":"Dill pickle","na":690,"sf":0,"fi":1,"veg":true}]},{"id":"d","t":"Drink","items":[{"id":"D1","t":"Water","na":0,"sf":0,"fi":0,"veg":false,"sugar":false},{"id":"D2","t":"Tomato juice, canned","na":460,"sf":0,"fi":1,"veg":false,"sugar":false,"note":"juice isn’t counted as a whole vegetable"},{"id":"D3","t":"Chocolate milk","na":115,"sf":3,"fi":0,"veg":false,"sugar":true}]}],"limits":{"na":1150,"sf":4,"fi":8}},"cards":[["Cardiovascular disease","Diseases of the heart and blood vessels, mainly coronary heart disease and stroke."],["Atherosclerosis","Plaque building up inside artery walls over years, narrowing them."],["Heart attack trigger","A plaque ruptures and a clot blocks a coronary artery."],["LDL","Lipoprotein that carries cholesterol to tissues; high levels feed plaque."],["HDL","Lipoprotein that carries cholesterol back to the liver."],["Saturated vs unsaturated swap","Replacing saturated fat with unsaturated fat lowers LDL."],["Soluble fibre","Oats, barley, beans and lentils; helps lower LDL."],["Sodium and blood pressure","For many people, more sodium raises blood pressure."],["%DV guide","5% or less is a little; 15% or more is a lot."],["DASH pattern","Vegetables, fruits, whole grains, legumes, low-fat dairy, nuts; less sodium."],["Modifiable vs non-modifiable","Eating, activity, smoking vs age, family history, genetics."],["Population model","Shows patterns across groups; can’t predict any one person’s health."]]}};</script>
