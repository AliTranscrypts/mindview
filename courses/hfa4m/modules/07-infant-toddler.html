.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 07: hero (six dishes on an age line), First foods timeline (Timeline / Safe plate / Mealtime coach), TC1 day planner,
   Products for the youngest, Sasha's day task. Colours from hfa4u.css: iron tags violet (--nu-micro), milk blue (--nu-water),
   allergen tags outlined --ink with an icon, Food Guide sections --leaf / --plate-grain / --nu-protein, hazard outline --hi.
   Red and green stay reserved for feedback. */
/* radio groups (from HFA4U 04) */
.it-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.it-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.it-rgl:empty{display:none}
.it-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.it-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.it-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;color:var(--ink)}
.it-chipset button:hover{border-color:var(--pen)}
.it-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.it-chipset button small{font-weight:400;opacity:.85}

/* shared SVG strokes and fills */
.it-o{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.it-of{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.it-ln{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-linecap:round}
.it-dot{fill:var(--ink)}
.it-milk{fill:var(--nu-water-soft);stroke:var(--nu-water);stroke-width:1.4}
.it-vf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.4}
.it-vfd{fill:var(--leaf)}
.it-gr{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-width:1.4}
.it-grd{fill:var(--plate-grain)}
.it-pr{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:1.4}
.it-prd{fill:var(--nu-protein)}
.it-fo{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.it-fi{fill:none;stroke:var(--sheet);stroke-width:3.4;stroke-linecap:round}
.it-hz{fill:var(--sheet);stroke:var(--hi);stroke-width:2;stroke-linejoin:round}
.it-gone{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:4 3}
.it-shred{fill:none;stroke:var(--leaf);stroke-width:2.2;stroke-linecap:round}
.it-swirl{fill:none;stroke:var(--nu-protein);stroke-width:2;stroke-linecap:round}
.it-stem{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.it-pasta{fill:none;stroke:var(--plate-grain);stroke-width:2.4;stroke-linecap:round}
.it-bub{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.it-bubt,.it-calt{font:700 13px var(--font-ui);fill:var(--ink)}
.it-calt2{font:400 12px var(--font-ui);fill:var(--ink-2)}
.it-cal{fill:none;stroke:var(--ink);stroke-width:1.4}
.it-push,.it-turn{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 4}
.it-pushh,.it-turnh{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.it-flab{font:700 11px var(--font-ui);fill:var(--ink)}
.it-flab2{font:400 10px var(--font-ui);fill:var(--ink-2)}
.it-ico{width:1.05em;height:1.05em;vertical-align:-.17em;margin-right:4px;flex:none;overflow:visible}

/* tags (never colour alone: every tag carries its word) */
.it-tag{display:inline-flex;align-items:center;gap:2px;font:700 .76rem/1.3 var(--font-ui);border:1.5px solid var(--ink-2);color:var(--ink);background:var(--sheet);border-radius:999px;padding:.05em .55em;white-space:nowrap}
.it-tag.it-iron{border-color:var(--nu-micro);color:var(--nu-micro);background:var(--nu-micro-soft)}
.it-tag.it-allg{border-color:var(--ink);color:var(--ink);background:transparent}
.it-tag.it-vftag{border-color:var(--leaf);color:var(--ink);background:var(--leaf-soft);white-space:normal}
.it-tag.it-notag{border-style:dashed;color:var(--ink-2)}
.it-pop{display:inline-block;transform-origin:center}
.it-flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

/* hero */
.it-hero{max-width:520px;margin:0 auto}
.it-hsvg{display:block;width:100%;height:auto}
.it-axis{fill:none;stroke:var(--ink);stroke-width:1.6}
.it-milkbar{fill:none;stroke:var(--nu-water);stroke-width:5;stroke-linecap:round}
.it-hmilk{font:700 10px var(--font-ui);fill:var(--nu-water)}
.it-hlab{font:400 10px var(--font-ui);fill:var(--ink-2)}
.it-hlab.b{font-weight:700;fill:var(--ink)}
.it-lead{fill:none;stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.it-irbg{fill:var(--nu-micro-soft);stroke:var(--nu-micro);stroke-width:1.5}
.it-irt{font:700 10.5px var(--font-ui);fill:var(--nu-micro)}
.it-tgbg{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3}
.it-tgt{font:700 10.5px var(--font-ui);fill:var(--ink)}
.it-sw-vf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.3}
.it-mark{fill:var(--ink)}

/* Explore layout */
.it-ctl{display:flex;flex-wrap:wrap;gap:0 26px;align-items:flex-start}
.it-ctl > div[hidden],.it-panel[hidden]{display:none}
.it-h4{margin:0 0 8px;font-size:1rem}
.it-agerow{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.it-agerow label{font-weight:700;font-size:.9rem}
.it-agerow input{flex:1;min-width:0;accent-color:var(--pen);height:28px}
.it-agerow output{font-weight:700;min-width:7.2em;text-align:right}
.it-stops{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
.it-stop{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 2px;color:var(--ink);min-height:44px}
.it-stop:hover{border-color:var(--pen)}
.it-stop.it-on{border-color:var(--ink);background:var(--hi-soft);box-shadow:inset 0 -3px 0 var(--ink)}
.it-sdish{width:40px;height:40px}
.it-slab{font-size:.78rem;font-weight:700;line-height:1.2;text-align:center}
.it-tgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:16px 26px;align-items:start}
.it-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px;text-align:center;min-width:0}
.it-bigdish{width:100%;max-width:200px;height:auto;display:block;margin:0 auto}
.it-cardt{font-weight:700;font-size:1.05rem;margin:4px 0 6px}
.it-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:1.6em}
.it-read{min-width:0}
.it-read .it-row{transition:background .3s}
.it-read .it-row.it-hl{background:var(--hi-soft);box-shadow:inset 4px 0 0 var(--hi);padding-left:10px;padding-right:6px;border-radius:4px}
.it-rule{display:block;color:var(--ink-2);font-size:.8rem;margin-top:2px}
.it-q{display:inline-block;font-weight:700;border:1.5px dashed var(--ink-2);border-radius:4px;padding:0 .45em}
.it-nos{display:flex;flex-wrap:wrap;gap:5px}
.it-no{display:inline-flex;align-items:center;font-size:.88rem;border:1px solid var(--rule);border-radius:5px;padding:.05em .45em}
.it-no.it-nohl{border-color:var(--hi);background:var(--hi-soft);font-weight:700}
.it-tt{margin:12px 0 2px;font-size:.9rem}
.it-tsvg{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.it-band{fill:var(--hi-soft);stroke:var(--hi);stroke-width:1.2}
.it-tm{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.it-tm0{fill:none;stroke:var(--rule);stroke-width:2;stroke-linecap:round}
.it-blab{font:700 11px var(--font-ui);fill:var(--ink)}

/* Safe plate */
.it-pgrid,.it-cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.it-plate,.it-scene{width:100%;height:auto;display:block}
.it-psum{margin:6px 0 0;font-size:.95rem}
.it-fpick{display:none}
.it-food{border-bottom:1px solid var(--rule);padding:8px 0}
.it-food:last-child{border-bottom:0}
.it-food h5{margin:0 0 6px;font-size:.98rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.it-risk{display:inline-flex;align-items:center;font-size:.78rem;font-weight:700;color:var(--ink-2)}
.it-food .it-rgw{margin:0 0 4px}
.it-fread{margin:2px 0 0;font-size:.9rem}

/* Mealtime coach */
.it-mtext{margin:0 0 8px}
.it-copts{display:grid;gap:6px}
.it-copt{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.5em .8em;font-size:.95rem;min-height:40px}
.it-copt:hover{border-color:var(--pen)}
.it-copt.it-chosen{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.it-cfbp{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--ink-2);background:var(--info-bg);border-radius:4px;font-size:.92rem}
.it-coachcol > .it-h4:nth-of-type(2){margin-top:14px}
.it-mtrack{position:relative;display:flex;height:16px;border:1.5px solid var(--ink);border-radius:999px;overflow:visible;margin:18px 4px 4px}
.it-mz{flex:1}
.it-mza,.it-mzc{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--rule) 5px 7px)}
.it-mza{border-radius:999px 0 0 999px}
.it-mzc{border-radius:0 999px 999px 0}
.it-mzm{background:var(--hi-soft);border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink)}
.it-mneedle{position:absolute;top:-14px;width:0;height:0;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:12px solid var(--ink);transition:left .35s}
.it-mends{display:flex;justify-content:space-between;gap:6px;font-size:.74rem;color:var(--ink-2)}
.it-mends span{flex:1;text-align:center}
.it-mends span:first-child{text-align:left}
.it-mends span:last-child{text-align:right}
.it-mread{margin:6px 0 2px}

/* TC1 day planner (inside the challenge card) */
.it-cx{margin:8px 0 6px}
.it-vdb{display:inline-block;border:1.5px solid var(--nu-water);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .9em;min-height:36px;font-size:.92rem}
.it-vdb.it-von{background:var(--nu-water-soft);font-weight:700}
.it-times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}
.it-time{border:1.5px solid var(--rule);border-radius:8px;padding:6px;min-width:0}
.it-time.it-tcur{border-color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}
.it-tsel{width:100%;border:0;background:none;font-weight:700;font-size:.88rem;text-align:left;color:var(--ink);padding:2px;min-height:30px}
.it-tcur .it-tsel{text-decoration:underline;text-underline-offset:3px}
.it-tcards{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.it-placed{text-align:left;font-size:.82rem;border:1px solid var(--ink-2);background:var(--hi-soft);color:var(--ink);border-radius:5px;padding:.2em .45em;min-height:28px}
.it-libh{margin:4px 0 6px;font-size:.9rem}
.it-lib,.it-tlib{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:6px}
.it-fcard{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.4em .6em;font-size:.88rem;min-height:40px}
.it-fcard:hover{border-color:var(--pen)}
.it-fcard.it-in{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.it-fcard.it-in .it-tag{font-weight:700}
.it-tcsum{margin:8px 0 0}
.it-cxmsg{display:inline-block;margin-top:4px;font-weight:700}

/* Part 3: product cards */
.it-p3note{margin:0 0 12px}
.it-prods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.it-prod{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;border:1.5px solid var(--rule);border-radius:10px;padding:12px;min-width:0}
.it-pk svg{width:60px;height:66px;display:block}
.it-pbody{min-width:0}
.it-pbody h4{margin:0 0 4px;font-size:1rem}
.it-pn{color:var(--ink-2)}
.it-brand{font-style:italic}
.it-claim{margin:0 0 8px;font-size:.92rem}
.it-prod .fb{margin:6px 0}
.it-data{margin-top:8px}
.it-dgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.it-dgrid h5{margin:4px 0;font-size:.88rem}
.it-nft{font-size:.88rem;min-width:0}
.it-ingr{margin:4px 0;font-size:.9rem}
.it-gv{margin:4px 0 0}

/* Task: Sasha's day */
.it-ed{border:1.5px solid var(--ink);border-radius:8px;padding:10px;margin:4px 0 10px}
.it-ed h5{margin:0 0 6px;font-size:1rem}
.it-ed h5 small{font-weight:400;color:var(--ink-2)}
.it-edl{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.it-edl li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.it-edn{font-weight:700;font-size:.92rem;flex:1 1 10em;min-width:0}
.it-cut{display:inline-flex;flex-wrap:wrap;gap:4px}
.it-cutb{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.15em .65em;font-size:.82rem;min-height:30px}
.it-cutb[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.it-x{min-height:30px}
.it-drinks{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.it-dl{font-weight:700;font-size:.88rem}
.it-milkst{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--nu-water);border-radius:8px;padding:2px 4px}
.it-milkst .btn{min-width:32px;min-height:30px;padding:0 .5em}
.it-mv{font-size:.88rem}
.it-libg{margin:10px 0 4px;font-weight:700;font-size:.88rem;color:var(--ink-2)}
.it-day h5{margin:0 0 6px;font-size:1rem}
.it-dayl{margin:0 0 10px;padding-left:1.3em;display:grid;gap:3px;font-size:.9rem}
.it-dayl li.it-dcur{font-weight:700}
.it-dayl .it-ico{width:.95em;height:.95em}
.it-mealp{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center;margin:0 0 6px}
.it-mplate{width:120px;height:100px;display:block}
.it-empty{fill:none;stroke:var(--rule);stroke-width:1}
.it-plab{font:700 8.5px var(--font-ui);fill:var(--ink)}
.it-plab0{font-weight:400;fill:var(--ink-2)}
.it-mtot{margin:6px 0 4px}
.it-mbar{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:260px}
.it-mbar span{height:14px;border:1.5px solid var(--nu-water);border-radius:3px;background:var(--sheet)}
.it-mbar span.it-mok{box-shadow:inset 0 -4px 0 var(--hi-soft);border-color:var(--ink)}
.it-mbar span.it-mf{background:var(--nu-water-soft)}
.it-mbar span.it-mf.it-mok{background:var(--nu-water-soft);box-shadow:inset 0 -4px 0 var(--hi)}
.it-kc{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.it-kct{margin:0}

@media (max-width:820px){
  .it-tgrid,.it-pgrid,.it-cgrid{grid-template-columns:minmax(0,1fr)}
  .it-times{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  /* the timeline becomes a vertical stepper; Safe plate shows one food at a time */
  .it-stops{grid-template-columns:minmax(0,1fr);gap:4px}
  .it-stop{flex-direction:row;justify-content:flex-start;gap:10px;padding:3px 10px}
  .it-sdish{width:32px;height:32px}
  .it-slab{font-size:.9rem;text-align:left}
  .it-fpick{display:block}
  .it-food{display:none}
  .it-food.it-fcur{display:block}
  .it-prods{grid-template-columns:minmax(0,1fr)}
  .it-prod{grid-template-columns:48px minmax(0,1fr)}
  .it-pk svg{width:46px;height:52px}
  .it-agerow output{min-width:0}
  .it-lib,.it-tlib{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .it-mneedle,.it-read .it-row{transition:none}
}

</style>

o\" id=\"it-hero\">\u003c/div>","caption":""},"aria":"Six small dishes in a row, joined to an age line from 0 to 36 months: a bottle and a breastfeeding icon (0 to 6 months); a spoon of mashed lentils with an iron tag (6 months); a bowl of mashed and lumpy food (7 to 8 months); soft finger foods picked up with a pincer grasp (9 months); an open cup that replaces the bottle (12 months); and a toddler’s divided plate, half vegetables and fruits (2 years). Most of the change happens in the first year.","caption":"Most of the change happens in the first year."},"goals":["I can describe how feeding changes from birth to age 3: milk, first foods, textures, family foods.","I can explain why iron-rich first foods and vitamin D supplements matter for infants.","I can prepare foods safely for babies and toddlers, including choking hazards, honey and allergen introduction.","I can apply the division of responsibility to support healthy toddler eating.","I can evaluate infant and toddler food products and claims.","I can plan and prepare a day of food for a toddler that fits Canada’s Food Guide and the family’s culture."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Nutrient roles","goal":2,"prompt":"Which mineral is needed for healthy blood and brain development, and runs low in babies at about 6 months?","options":[{"t":"Fluoride","why":"Fluoride protects teeth; it isn’t the 6-month concern.","_n":"047a","_k":"3f5eed35"},{"t":"Iron","why":"Babies are born with iron stores that run low at about 6 months.","_n":"146a","_k":"54def24a"},{"t":"Sodium","why":"Babies need very little added salt.","_n":"245a","_k":"839212e5"},{"t":"Calcium","why":"Calcium matters for bones, but iron is what runs low at 6 months.","_n":"34ca","_k":"8d6ddc22"}],"hints":["Which mineral carries oxygen in blood?","The baby stored it during the last months of pregnancy.","Iron."]},{"id":"w2","skill":"Nutrient roles","goal":2,"prompt":"Why does vitamin D matter for babies?","options":[{"t":"It helps the body use calcium to build bones","why":"A lack of vitamin D can cause rickets.","_n":"44ba","_k":"f5bfd1fb"},{"t":"It prevents choking","why":"Choking is unrelated to vitamin D.","_n":"54aa","_k":"410afe36"},{"t":"It replaces iron","why":"Different nutrients do different jobs.","_n":"649a","_k":"b114805d"},{"t":"It provides energy","why":"Vitamins don’t provide energy.","_n":"750a","_k":"0912471a"}],"hints":["Think of the disease rickets.","Bones need calcium plus a helper.","Vitamin D helps the body use calcium."]},{"id":"w3","skill":"Food safety","goal":3,"prompt":"Why is honey not recommended for babies under 12 months?","options":[{"t":"It can carry spores that cause infant botulism","why":"A baby’s gut can’t yet stop the spores from growing.","_n":"84fa","_k":"cf1ee173"},{"t":"It’s too sweet","why":"Sweetness isn’t the safety reason.","_n":"9bb5","_k":"c5072423"},{"t":"It causes cavities in new teeth","why":"Not the main reason for the 12-month rule.","_n":"abc5","_k":"edeb58be"},{"t":"It’s an allergen","why":"Honey isn’t one of the common food allergens.","_n":"bb95","_k":"7353123f"}],"hints":["Which bacterium makes spores?","\u003cem>Clostridium botulinum\u003c/em>.","Infant botulism."]},{"id":"w4","skill":"Food safety","goal":3,"prompt":"What is the temperature “danger zone” in which bacteria grow fastest?","options":[{"t":"4 °C to 60 °C","why":"Keep cold food at 4 °C or colder, and hot food at 60 °C or hotter.","_n":"cba5","_k":"523f8609"},{"t":"0 °C to 4 °C","why":"That’s fridge range: growth is slow (except \u003cem>Listeria\u003c/em>).","_n":"db75","_k":"8cc5cb37"},{"t":"60 °C to 100 °C","why":"Hot holding is above 60 °C.","_n":"eb85","_k":"bcd7e441"},{"t":"−18 °C to 0 °C","why":"That’s freezer range; bacteria barely grow.","_n":"fb55","_k":"05d17517"}],"hints":["Between fridge-cold and serving-hot.","The fridge is 4 °C.","4 °C to 60 °C."]},{"id":"w5","skill":"Labels","goal":5,"prompt":"On a Canadian ingredient list, ingredients are listed…","options":[{"t":"From healthiest to least healthy","why":"Order is by weight, not health.","_n":"gb65","_k":"a59ca0ed"},{"t":"In random order","why":"The order is required by law.","_n":"hc35","_k":"442fe9bc"},{"t":"Alphabetically","why":"Order tells you amounts.","_n":"ic45","_k":"b126ae86"},{"t":"From most to least by weight","why":"The first ingredient is the biggest part by weight.","_n":"jb54","_k":"99f06513"}],"hints":["The first ingredient is the biggest part.","It’s ranked by amount.","By weight."]},{"id":"w6","skill":"Labels","goal":5,"prompt":"Which ingredient name is a \u003cstrong>sugar\u003c/strong>?","options":[{"t":"Whole grain oat flour","why":"That’s a grain.","_n":"kb44","_k":"15b995c4"},{"t":"Ferrous fumarate","why":"That’s an iron source.","_n":"lb34","_k":"35e52740"},{"t":"Concentrated fruit juice","why":"Concentrated fruit juices are grouped with sugars on Canadian labels.","_n":"mb24","_k":"f9c9b067"},{"t":"Ascorbic acid","why":"That’s vitamin C.","_n":"nb94","_k":"7178eaf8"}],"hints":["Sugars hide under many names.","Juice concentrate is mostly sugar.","Concentrated fruit juice."]}],"refreshers":{"Nutrient roles":"Iron builds blood and supports brain development; babies’ stores run low at about 6 months. Vitamin D helps the body use calcium; breast milk is naturally low in it.","Food safety":"The danger zone is 4–60 °C. Honey can carry botulism spores, so no honey before 12 months.","Labels":"Ingredients are listed by weight. Sugars have many names, including concentrated fruit juice."}}},"explore":{"heading":"First foods timeline","intro":"Slide from birth
