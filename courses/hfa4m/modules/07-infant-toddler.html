e a day: meat, fish, poultry, well-cooked egg, tofu, lentils, iron-fortified infant cereal","tex":"Mashed, minced or ground first foods","allerg":"Start around now: peanut (thinned peanut butter, never whole nuts), well-cooked egg, and others","skills":"Ready for first foods: sitting with support","not":["honey","nuts","cowmilk","juice","saltsugar"]}},{"id":"a2","t":"7–8 months","short":"7–8 mo","dish":2,"rows":{"milk":"Breast milk or commercial infant formula","supp":"Vitamin D 400 IU daily if breastfed","iron":"Offer at least twice a day: meat, fish, poultry, well-cooked egg, tofu, lentils, iron-fortified infant cereal","tex":"Mashed, minced, ground, lumpy; soft finger foods","allerg":"Peanut (thinned peanut butter, never whole nuts), well-cooked egg, and others, offered regularly","skills":"Sitting with support; bringing food to mouth","not":["honey","nuts","cowmilk","juice","saltsugar"]}},{"id":"a3","t":"9–12 months","short":"9–12 mo","dish":3,"rows":{"milk":"Breast milk or formula; cow’s milk (3.25%) can become the main drink from 9–12 months","supp":"Vitamin D 400 IU daily if breastfed","iron":"Offer at least twice a day: meat, fish, poultry, well-cooked egg, tofu, lentils, iron-fortified infant cereal","tex":"Soft finger foods; chopped, lumpy family foods","allerg":"Keep offering peanut, egg and other common allergens regularly","skills":"Pincer grasp (around 9 months): picking up small soft pieces; drinking from an open cup","not":["honey12","nuts","juice","saltsugar"]}},{"id":"a4","t":"12–18 months","short":"12–18 mo","dish":4,"rows":{"milk":"Cow’s milk, about 2–3 cups a day, served in an open cup; breast milk can continue","supp":"If still breastfed, ask a health care provider about vitamin D drops; cow’s milk is a source of vitamin D","iron":"Iron-rich foods at meals every day; too much milk crowds them out","tex":"Family foods, cut up safely","allerg":"Keep common allergens in the diet regularly","skills":"Eats family foods at the table; a cup replaces the bottle","not":["popcorn","cut","juicepop"]}},{"id":"a5","t":"18–24 months","short":"18–24 mo","dish":5,"rows":{"milk":"Cow’s milk, about 2–3 cups a day; water between meals","supp":"If still breastfed, ask a health care provider about vitamin D drops; cow’s milk is a source of vitamin D","iron":"Iron-rich foods at meals every day; too much milk crowds them out","tex":"Family foods, cut up safely","allerg":"Keep common allergens in the diet regularly","skills":"Uses a spoon with growing skill and some mess (spoon skills develop around 15–18 months)","not":["popcorn","cut","juicepop"]}},{"id":"a6","t":"2–3 years","short":"2–3 yr","dish":6,"rows":{"milk":"Milk, about 2–3 cups a day; water as the drink of choice","supp":"Usually none needed when the child eats family foods and drinks milk; ask a health care provider","iron":"Iron-rich foods at meals every day","tex":"Family foods; round, hard and sticky foods still prepared to prevent choking until age 4","allerg":"Keep common allergens in the diet regularly","skills":"Eats with the family: the adult decides what, when and where; the child decides whether and how much","not":["popcorn","cut","candy","juicepop"]}}],"plateGuide":"Half vegetables and fruits, a quarter whole grains, a quarter protein foods","tally":{"title":"Relaxed tries with broccoli","band":"Often 8–15 or more","max":15},"plates":{"sasha":{"title":"Sasha’s snack plate (2 years)","foods":[{"id":"grapes","t":"Grapes","risk":"round","kind":"vf","preps":[{"id":"whole","t":"Whole","fb":"Round foods can block the airway, even small ones.","_n":"ob84","_k":"4abfe014"},{"id":"half","t":"Halved crosswise","fb":"A half grape is still round enough to block a small airway. Quarter it lengthwise.","_n":"pb74","_k":"d3baf1c8"},{"id":"quarter","t":"Quartered lengthwise","fb":"Quarters lengthwise are no longer round: safe for children under 4.","_n":"qb64","_k":"d3e1cbe7"}]},{"id":"popcorn","t":"Popcorn","risk":"hard","kind":"grain","preps":[{"id":"bowl","t":"Serve a small bowl","fb":"Popcorn isn’t for children under 4. Remove it from the plate.","_n":"rbd4","_k":"4c764df9"},{"id":"remove","t":"Remove from plate","fb":"Removed: popcorn isn’t for children under 4.","_n":"sbc4","_k":"3ec68858"}]},{"id":"hotdog","t":"Hot dog","risk":"round","kind":"prot","preps":[{"id":"rounds","t":"Rounds","fb":"Round slices match the size of a toddler’s airway. Cut it lengthwise into thin strips.","_n":"t2f4","_k":"3f4d04bd"},{"id":"strips","t":"Thin lengthwise strips","fb":"Thin strips are no longer round: safe.","_n":"u304","_k":"d4cf0a6e"},{"id":"whole","t":"Whole","fb":"A whole hot dog is still round: bites match the size of a toddler’s airway. Cut it lengthwise into thin strips.","_n":"v314","_k":"01f2e1a7"}]},{"id":"carrot","t":"Raw carrot","risk":"hard","kind":"vf","preps":[{"id":"sticks","t":"Sticks","fb":"Hard raw vegetables are a choking hazard. Grate it or cook it until soft.","_n":"w324","_k":"7723d495"},{"id":"grated","t":"Grated","fb":"Grated: the hard pieces are gone. Safe.","_n":"x334","_k":"9de7a3d4"},{"id":"cooked","t":"Cooked until soft","fb":"Cooked until soft: no longer hard. Safe.","_n":"y344","_k":"491af596"}]},{"id":"pb","t":"Peanut butter","risk":"sticky","kind":"prot","preps":[{"id":"spoon","t":"By the spoonful","fb":"Thick, sticky spoonfuls can block the airway. Spread it thinly.","_n":"z354","_k":"27722ae7"},{"id":"spread","t":"Spread thinly on toast","fb":"Spread thinly: no longer a sticky lump. Safe.","_n":"10364","_k":"bb8d2d88"}]}]},"ayo":{"title":"Ayo’s finger foods (7 months)","foods":[{"id":"peanut","t":"Peanut","risk":"hard","kind":"prot","preps":[{"id":"whole","t":"Whole peanuts","fb":"Whole nuts are a choking hazard.","_n":"11374","_k":"794df8c3"},{"id":"thinned","t":"Thinned peanut butter mixed into cereal","fb":"Thinned into cereal: the safe way to offer peanut.","_n":"12384","_k":"8befb178"}]},{"id":"carrot","t":"Carrot","risk":"hard","kind":"vf","preps":[{"id":"raw","t":"Raw sticks","fb":"Hard raw vegetables are a choking hazard.","_n":"13395","_k":"28549310"},{"id":"soft","t":"Soft-cooked sticks","fb":"Soft-cooked sticks are a finger food. Safe.","_n":"14385","_k":"6f209091"}]},{"id":"almond","t":"Almonds","risk":"hard","kind":"prot","preps":[{"id":"whole","t":"Whole","fb":"Whole nuts are a choking hazard: not yet.","_n":"153b5","_k":"9309226d"},{"id":"remove","t":"Remove from plate","fb":"Removed: whole nuts are a choking hazard.","_n":"163a5","_k":"52f02b16"}]}]}},"riskNames":{"round":"round","hard":"hard","sticky":"sticky"},"coach":{"meter":{"adult":"Adults decide everything, including how much: that’s pressure feeding.","child":"Children decide everything: that’s no structure at all.","ok":"Adult: what, when, where · Child: whether, how much","ends":["Adult decides everything","Child decides everything"]},"sasha":{"title":"Sasha (2) pushes away her broccoli at dinner.","moments":[{"id":"m1","t":"She pushes the broccoli away.","options":[{"t":"Make her a separate meal of her choice","side":"child","fb":"Short-order cooking takes the “what” decision away from the adult.","_n":"17355","_k":"23f982c0"},{"t":"“Three bites, then you can leave”","side":"adult","fb":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"18345","_k":"8458482e"},{"t":"“Eat it and you’ll get dessert”","side":"adult","fb":"Rewards teach that vegetables are a chore and dessert is the prize.","_n":"19375","_k":"5745e410"},{"t":"Leave it on her plate, say nothing, and enjoy your own broccoli","fb":"Leave it and model: no pressure, and she sees you enjoy it.","_n":"1a365","_k":"b9a6c8da"}]},{"id":"m2","t":"Planning tomorrow’s dinner.","options":[{"t":"Serve broccoli again, next to a food she already likes","fb":"Repeated, relaxed exposure works, and a familiar food makes the plate feel safe.","_n":"1b415","_k":"fb57f16b"},{"t":"Never serve broccoli again","side":"child","fb":"Many toddlers need 8–15 or more relaxed tries before accepting a new food.","_n":"1c405","_k":"5f0c3d48"},{"t":"Hide broccoli in everything","side":"adult","fb":"Hidden broccoli doesn’t give her the relaxed looks, smells and tastes she needs to learn to accept it.","_n":"1d335","_k":"091198a5"},{"t":"Serve only foods she asks for","side":"child","fb":"That hands the “what” decision to the child. The adult still decides what is offered.","_n":"1e345","_k":"35b7118f"}]},{"id":"m3","t":"She says “full” after a few bites of pasta.","options":[{"t":"Trust her; offer the next snack at the usual time","fb":"Trust her fullness cue: the child decides how much.","_n":"1f315","_k":"4cc81c76"},{"t":"Give a cookie so she eats something","side":"child","fb":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"1g325","_k":"93bf46d7"},{"t":"“One more bite for me”","side":"adult","fb":"Pressure overrides a child’s fullness cues.","_n":"1h375","_k":"66840add"},{"t":"“Clean your plate first”","side":"adult","fb":"Pressure overrides a child’s fullness cues.","_n":"1i385","_k":"0bd8a4af"}]}]},"ayo":{"title":"Ayo (7 months) is eating mashed lentils from a spoon.","moments":[{"id":"a1","t":"He turns his head away from the spoon after a few spoonfuls.","options":[{"t":"Trust him; offer the next feeding at the usual time","fb":"Trust his fullness cue: the child decides how much.","_n":"1j355","_k":"883f5826"},{"t":"Switch to fruit purée so he eats something","side":"child","fb":"Short-order cooking takes the “what” decision away from the adult, and iron-rich foods come first.","_n":"1k365","_k":"1634d307"},{"t":"Mix in a little honey to make it tastier","side":"adult","fb":"No honey before 12 months: infant botulism.","_n":"1l3b5","_k":"72beb028"},{"t":"“One more spoonful for me”","side":"adult","fb":"Pressure overrides a child’s fullness cues.","_n":"1m3c5","_k":"f916be30"}]}]}},"tc1":{"times":["Feeding time 1","Feeding time 2","Feeding time 3","Feeding time 4"],"vitD":"Vitamin D drops","cards":[{"id":"cereal","t":"Iron-fortified infant cereal","iron":true},{"id":"lentils","t":"Mashed lentils","iron":true},{"id":"chicken","t":"Minced chicken","iron":true},{"id":"egg","t":"Well-cooked scrambled egg","iron":true,"allergen":"egg"},{"id":"pb","t":"Thinned peanut butter mixed into cereal","allergen":"peanut"},{"id":"avocado","t":"Mashed avocado"},{"id":"carrot","t":"Soft-cooked carrot sticks","finger":true},{"id":"banana","t":"Mashed banana"},{"id":"yogurt","t":"Plain yogurt","allergen":"milk"},{"id":"juice","t":"Apple juice","notYet":"not yet"},{"id":"honey","t":"Honey on toast","notYet":"not yet: honey"},{"id":"almonds","t":"Whole almonds","notYet":"not yet: choking"},{"id":"cowmilk","t":"Cow’s milk in a bottle","notYet":"not yet as main drink"}]},"predIntro":"Make a prediction first. Then the timeline will show you what really happens.","predictions":[{"id":"p1","age":1,"hide":["iron","not"],"prompt":"Which foods should come first?","options":[{"t":"Iron-rich foods, like lentils, meat or iron-fortified infant cereal","_n":"1n4d5","_k":"47f6f752"},{"t":"Apple juice in a bottle","_n":"1o4c5","_k":"db8b5a67"},{"t":"Cow’s milk","_n":"1p4b5","_k":"0d1257a5"},{"t":"Fruit purées, because babies like sweet tastes","_n":"1q4a5","_k":"aaf4ba8b"}],"explain":"Iron stores run low at about 6 months. Iron-rich foods first, at least twice a day."},{"id":"p2","age":0,"to":1,"hide":["allerg"],"prompt":"When should most babies first try peanut (as thinned peanut butter, never whole nuts)?","options":[{"t":"Around 6 months, when they’re ready for solids (not before 4 months)","_n":"1r495","_k":"99490593"},{"t":"Only after a blood test","_n":"1s485","_k":"50a132f0"},{"t":"After their first birthday","_n":"1t475","_k":"1e84cba0"},{"t":"After age 3","_n":"1u465","_k":"2cec0818"}],"explain":"Introducing common allergens around 6 months, then keeping them in the diet, may lower allergy risk. Babies with severe eczema or a known allergy should get personal advice from a health care provider."},{"id":"p3","age":5,"hide":[],"prompt":"Sasha spits out broccoli. How many relaxed tries might it take before she accepts it?","fixedOrder":true,"options":[{"t":"1","_n":"1v455","_k":"91a05588"},{"t":"2","_n":"1w445","_k":"98c087a8"},{"t":"Often 8–15 or more","_n":"1xc75","_k":"c7b9e06a"},{"t":"She never will","_n":"1yc85","_k":"3232b82f"}],"explain":"Toddlers are often wary of new foods. Repeated, low-pressure exposure works."},{"id":"p4","age":2,"to":3,"hide":["milk"],"prompt":"When can cow’s milk become the main drink?","fixedOrder":true,"options":[{"t":"At birth","_n":"1zc95","_k":"c1f7d63d"},{"t":"At 4 months","_n":"20ca5","_k":"e4dd921a"},{"t":"At 9–12 months","_n":"21c35","_k":"fe98825e"},{"t":"At 5 years","_n":"22c45","_k":"651f44f9"}],"explain":"Before then, breast milk or formula. After 12 months, keep it to about 2–3 cups a day so it doesn’t crowd out iron-rich foods."}],"chalIntro":"Use the timeline’s modes (and the day planner in challenge 1) to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Plan Ayo’s day (7 months, breastfed): 4 feeding times, each with 1–2 food cards.","how":"Choose a feeding time, then tap cards to add them (tap a card in a feeding time to take it back). Switch on the vitamin D drops if they’re needed.","msgs":{"honey":"No honey before 12 months: infant botulism.","juice":"Babies don’t need juice; offer breast milk, and later water in an open cup.","almonds":"Whole nuts are a choking hazard.","cowmilk":"Not as the main milk before 9–12 months.","iron":"Offer iron-rich foods at least twice a day.","vitD":"Breastfed babies need a vitamin D supplement.","allergen":"Add one allergen card (egg or thinned peanut butter).","times":"Give each of the 4 feeding times 1–2 food cards.","full":"Each feeding time takes 1–2 food cards. Take one out first."},"general":"Look for the iron-rich tags.","why":"Vitamin D drops, iron-rich foods at two or more feeding times, an allergen, and nothing from the “not yet” list.","hints":["Look for the iron-rich tags.","Add one allergen card (egg or thinned peanut butter).","Cereal, lentils, egg, avocado, plus vitamin D drops."]},{"id":"tc2","goal":3,"prompt":"\u003cstrong>Safe plate\u003c/strong> mode: make Sasha’s (2 years) snack plate safe.","general":"Round, hard and sticky foods are the risky ones.","why":"Quarter, strip, grate or cook, spread thinly, and remove: changing the shape takes away the choking risk.","hints":["Round, hard and sticky foods are the risky ones.","Change the shape: quarter, strip, grate, spread.","Grapes quartered lengthwise; popcorn removed from the plate; hot dog in thin lengthwise strips; carrot grated or cooked until soft; peanut butter spread thinly on toast."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>Mealtime coach\u003c/strong> mode: Sasha (2) pushes away her broccoli at dinner. Choose a response at each of 3 moments.","msgs":{"open":"Choose a response at each of the 3 moments."},"general":"No pressure, no bribes, no separate meals.","why":"The “who decides?” m&#101;ter reads “Adult: what, when, where · Child: whether, how much”.","hints":["Who decides \u003cem>what\u003c/em>? Who decides \u003cem>how much\u003c/em>?","No pressure, no bribes, no separate meals.","Leave it and model; serve it again with a familiar food; trust “full”."]}],"blocks":[{"title":"What the timeline shows","html":"\u003cp>The shift from milk to family foods is \u003cstrong>fast\u003c/strong>, \u003cstrong>iron-rich\u003c/strong> and \u003cstrong>textured\u003c/strong>. Safety comes from \u003cem>how\u003c/em> food is prepared, and good eating comes from \u003cem>how\u003c/em> adults respond.\u003c/p>\u003cp>\u003cstrong>The division of responsibility (Ellyn Satter):\u003c/strong> Adults decide what, when and where food is offered; the child decides whether and how much to eat. Pressure, bribes and “clean your plate” usually backfire. Repeated, relaxed exposure (often 8–15 tries or more) is how toddlers come to accept new foods.\u003c/p>\u003cp class=\"tiny muted\">General information only. For a baby’s or toddler’s own needs, families talk to a doctor, nurse or registered dietitian. Babies with severe eczema or a known allergy need personal advice from a health care provider.\u003c/p>"}]},"part3":{"slug":"products","name":"Products","heading":"Products for the youngest","intro":"Six \u003cstrong>practice model\u003c/strong> products (fictional brands). For each one, choose \u003cstrong>Fits the guidance\u003c/strong>, \u003cstrong>Fine sometimes\u003c/strong> or \u003cstrong>Not needed or not recommended\u003c/strong>, then open \u003cstrong>Check it with data\u003c/strong> to compare the label with the guidance.","verdicts":[{"id":"fits","t":"Fits the guidance"},{"id":"some","t":"Fine sometimes"},{"id":"not","t":"Not needed or not recommended"}],"note":"Teachers may add current real products, credited, as extra cards. These practice models are made up for the module.","products":[{"id":"pr1","brand":"SproutStart","name":"Iron-Fortified Infant Cereal","pack":"box","claim":"Iron-fortified","_a":"QFRfEEca","label":{"rows":[["Iron","40 %"]],"per":"per serving"},"guide":"Iron-fortified infant cereal is a recommended first food."},{"id":"pr2","brand":"LittleSip","name":"Toddler Juice Box","pack":"juice","claim":"100% juice","_a":"QFxZEBY=","label":{"ingr":"Concentrated apple juice (listed first)"},"guide":"Juice isn’t needed; water and milk are the drinks for toddlers."},{"id":"pr3","brand":"GrowRight","name":"Growing-Up Formula, 12+ months","pack":"tin","claim":"Supports brain development","_a":"QFxZEBY=","label":{"text":"For toddlers 12 months and older"},"guide":"Family foods plus about 2–3 cups of milk usually meet needs (CPS and Health Canada).","gloss":"Not needed (most toddlers)."},{"id":"pr4","brand":"Squeeze & Go","name":"Veggie Pouch","pack":"pouch","claim":"Veggie","_a":"QEFZCVEa","label":{"ingr":"Apple purée, pear purée, spinach purée"},"guide":"Convenient now and then, but sucking from a pouch skips spoon and chewing practice, and fruit often dominates."},{"id":"pr5","brand":"Crunchy Teethers","name":"Rice-Based Biscuits","pack":"biscuit","claim":"For 6+ months","_a":"QEFZCVEa","label":{"text":"Rice-based biscuits for babies 6 months and older"},"guide":"Can be offered, but they’re low in nutrients compared with iron-rich foods."},{"id":"pr6","brand":"Organic Toddler","name":"Fruit Bites","pack":"bag","claim":"Organic","_a":"QEFZCVEa","label":{"ingr":"Organic concentrated fruit juice (a source of sugars)"},"guide":"“Organic” doesn’t mean low in sugar; read the ingredient list.","gloss":"Fine sometimes, at most."}],"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Du Toit, G., Roberts, G., Sayre, P. H., Bahnson, H. T., Radulovic, S., Santos, A. F., Brough, H. A., Phippard, D., Basting, M., Feeney, M., Turcanu, V., Sever, M. L., Gomez Lorenzo, M., Plaut, M., &amp; Lack, G. (2015). Randomized trial of peanut consumption in infants at risk for peanut allergy. \u003ci>New England Journal of Medicine, 372\u003c/i>(9), 803–813.\u003c/li>\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada, Canadian Paediatric Society, Dietitians of Canada, &amp; Breastfeeding Committee for Canada. (2014). \u003ci>Nutrition for healthy term infants: Recommendations from six to 24 months\u003c/i>. Government of Canada.\u003c/li>\u003cli>Satter, E. (2000). \u003ci>Child of mine: Feeding with love and good sense\u003c/i> (Rev. ed.). Bull Publishing.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Products quick check","summary":"Products quick check","items":[{"id":"q1","goal":5,"prompt":"A label says “supports brain development”. What’s the first thing to check?","choices":[{"t":"The price","fb":"A claim isn’t evidence.","_n":"23c55","_k":"f90b6ea9"},{"t":"The colour of the box","fb":"A claim isn’t evidence.","_n":"24c65","_k":"021408b9"},{"t":"Evidence and the guidance","fb":"Right. A claim isn’t evidence, so check it against the evidence and the guidance.","_n":"25bf5","_k":"92bd3e10"},{"t":"The number of flavours","fb":"A claim isn’t evidence.","_n":"26c05","_k":"e8758861"}]},{"id":"q2","goal":[5,1],"prompt":"Which drink fits a 2-year-old’s day best?","choices":[{"t":"Juice box","fb":"Water and milk are the drinks for toddlers.","_n":"27316","_k":"c47b9f50"},{"t":"Pop","fb":"Water and milk are the drinks for toddlers.","_n":"28306","_k":"dbb7a6f2"},{"t":"Sports drink","fb":"Water and milk are the drinks for toddlers.","_n":"29336","_k":"46d20018"},{"t":"Water in an open cup","fb":"Right. Water and milk are the drinks for toddlers.","_n":"2a326","_k":"ffb62d7a"}]},{"id":"q3","goal":5,"prompt":"Why might a pouch be “fine sometimes” rather than “always”?","choices":[{"t":"Pouches contain honey","fb":"Feeding skills grow with spoons, cups and finger foods.","_n":"2b356","_k":"14255ff5"},{"t":"Pouches have no calories","fb":"Feeding skills grow with spoons, cups and finger foods.","_n":"2c346","_k":"4b529245"},{"t":"It skips spoon and chewing practice","fb":"Right. Feeding skills grow with spoons, cups and finger foods.","_n":"2d376","_k":"ebf5e5c2"},{"t":"Pouches are illegal","fb":"Feeding skills grow with spoons, cups and finger foods.","_n":"2e366","_k":"2635784d"}]},{"id":"q4","goal":5,"prompt":"“Organic” on a toddler snack means…","choices":[{"t":"It’s iron-rich","fb":"Organic is about production methods, not nutrition.","_n":"2f396","_k":"75806cd5"},{"t":"It’s allergen-free","fb":"Organic is about production methods, not nutrition.","_n":"2g386","_k":"1d2dfa05"},{"t":"It was produced under organic rules","fb":"Right. Organic is about production methods, not nutrition.","_n":"2hcb6","_k":"7c9dade3"},{"t":"It’s low in sugar","fb":"Organic is about production methods, not nutrition.","_n":"2icc6","_k":"1aa7ae28"}]}]}},"practice":{"activities":[{"id":"ages","type":"sorter","title":"Which age?","summary":"Which age?","goal":[1,3],"noun":"card","txt":true,"instruction":"Sort each feeding fact into the age it belongs to.","boxes":[{"id":"b0","label":"0–6 months"},{"id":"b6","label":"6–12 months"},{"id":"b12","label":"12–36 months"}],"items":[{"id":"i1","t":"Breast milk or formula only, plus vitamin D if breastfed","_a":"QFAGRg==","why":"Solids start around 6 months.","wrong":{"b6":"Solids start around 6 months.","b12":"Solids start around 6 months."}},{"id":"i2","t":"First iron-rich foods, mashed or minced","_a":"QFAARg==","why":"Iron-rich foods begin around 6 months.","wrong":{"b0":"Iron-rich foods begin around 6 months.","b12":"Iron-rich foods begin around 6 months."}},{"id":"i3","t":"Water offered in an open cup with meals","_a":"QFAARg==","why":"Small sips of water can start at about 6 months.","wrong":{"b0":"Small sips of water can start at about 6 months.","b12":"Small sips of water can start at about 6 months."}},{"id":"i4","t":"Cow’s milk (3.25%) becomes the main milk","_a":"QFAARg==","why":"From 9–12 months.","wrong":{"b0":"From 9–12 months.","b12":"From 9–12 months."},"hints":["Before this age, breast milk or formula is the main milk.","It’s late in the first year.","9–12 months."]},{"id":"i5","t":"Honey on toast is OK","_a":"QFAHVhY=","why":"Never before 12 months.","wrong":{"b0":"Never before 12 months.","b6":"Never before 12 months."}},{"id":"i6","t":"Pincer grasp: picking up small soft pieces","_a":"QFAARg==","why":"Around 9 months.","wrong":{"b0":"Around 9 months.","b12":"Around 9 months."}},{"id":"i7","t":"Eats family foods, cut up safely, at the table","_a":"QFAHVhY=","why":"Toddlers move on to family foods, cut up safely.","wrong":{"b0":"Toddlers move on to family foods, cut up safely.","b6":"Toddlers move on to family foods, cut up safely."}},{"id":"i8","t":"Peanut first offered as thinned peanut butter","_a":"QFAARg==","why":"Around 6 months, not before 4.","wrong":{"b0":"Around 6 months, not before 4.","b12":"Around 6 months, not before 4."}},{"id":"i9","t":"About 2–3 cups of milk a day, not more","_a":"QFAHVhY=","why":"The toddler milk limit.","wrong":{"b0":"The toddler milk limit.","b6":"The toddler milk limit."}},{"id":"i10","t":"Uses a spoon with growing skill and some mess","_a":"QFAHVhY=","why":"Spoon skills develop around 15–18 months.","wrong":{"b0":"Spoon skills develop around 15–18 months.","b6":"Spoon skills develop around 15–18 months."}}]},{"id":"family","type":"mc","title":"Help the family","summary":"Help the family","star":true,"goal":[2,3,4,5,6],"instruction":"Six families, six questions. Choose the best advice. Cases marked ★ are non-routine; C6 is an investigation.","items":[{"id":"c1","goal":3,"prompt":"\u003cstrong>C1.\u003c/strong> A parent wants to make homemade formula from cow’s milk for a 3-month-old. What’s the best advice?","options":[{"t":"Make the homemade formula, following the recipe carefully","why":"Homemade formulas can’t match infant needs and can be unsafe.","_n":"2jc96","_k":"c850c851"},{"t":"Use a commercial infant formula, prepared exactly as the label says","why":"Homemade formulas can’t match infant needs and can be unsafe.","_n":"2kca6","_k":"490f63af"},{"t":"Sweeten plain milk with a little honey","why":"No honey before 12 months: infant botulism.","_n":"2lc76","_k":"b983886d"},{"t":"Give plain cow’s milk in a bottle instead","why":"Not as the main milk before 9–12 months.","_n":"2mc86","_k":"4181384b"}]},{"id":"c2","goal":2,"prompt":"\u003cstrong>C2.\u003c/strong> An 18-month-old drinks about 6 cups of milk a day and seems tired and pale. What’s the best advice?","options":[{"t":"Swap some milk for juice for energy","why":"Juice adds sugar, not iron.","_n":"2nc56","_k":"9bc0a6e1"},{"t":"More milk will help","why":"Milk is low in iron and fills a small stomach.","_n":"2oc66","_k":"abd35f83"},{"t":"Nothing needs to change: milk is always healthy","why":"Too much milk fills a toddler up and crowds out iron-rich foods; about 2–3 cups a day is plenty.","_n":"2pc36","_k":"4d78a915"},{"t":"Too much milk may be crowding out iron-rich foods; talk to a provider and offer about 2–3 cups with iron-rich meals","why":"Too much milk fills a toddler up and crowds out iron-rich foods; about 2–3 cups a day is plenty.","_n":"2qc46","_k":"1a995238"}]},{"id":"c3","goal":[2,6],"prompt":"\u003cspan class=\"it-star\">★\u003c/span> \u003cstrong>C3.\u003c/strong> A vegetarian family is starting solids for a 6-month-old. What’s the best advice?","options":[{"t":"Wait until 12 months to start solids","why":"Too late: iron needs aren’t met.","_n":"2r044","_k":"69fde303"},{"t":"The baby must eat meat, so add it anyway","why":"Lentils, tofu, well-cooked egg and iron-fortified cereal are iron-rich vegetarian first foods.","_n":"2s054","_k":"91d2a56b"},{"t":"Start with fruit only","why":"At about 6 months a baby’s iron stores run low. Offer iron-rich foods first, at least twice a day.","_n":"2t024","_k":"c411fdb3"},{"t":"Lentils, tofu, well-cooked egg and iron-fortified cereal, paired with a vitamin C food","why":"At about 6 months a baby’s iron stores run low. Offer iron-rich foods first, at least twice a day. Vitamin C helps the body absorb iron from plant foods.","_n":"2u034","_k":"c803ce08"}]},{"id":"c4","goal":[2,5],"prompt":"\u003cspan class=\"it-star\">★\u003c/span> \u003cstrong>C4.\u003c/strong> A family offers an almond beverage as a 14-month-old’s main milk. What’s the best advice?","options":[{"t":"Offer more of it, about 6 cups a day","why":"More of a low-protein drink doesn’t fix it, and big drinks crowd out iron-rich foods.","_n":"2v084","_k":"5020275b"},{"t":"Switch to apple juice","why":"Juice isn’t needed; water and milk are the drinks for toddlers.","_n":"2w094","_k":"19f0c5b3"},{"t":"It’s just as good","why":"Not for a toddler’s main milk.","_n":"2x064","_k":"4461e0db"},{"t":"Plant beverages like almond or rice are low in protein and energy and aren’t suitable as a young child’s main milk; ask a provider about alternatives","why":"Not for a toddler’s main milk: a provider can suggest alternatives.","_n":"2y074","_k":"fef875d0"}]},{"id":"c5","goal":[2,3],"prompt":"\u003cspan class=\"it-star\">★\u003c/span> \u003cstrong>C5.\u003c/strong> A family follows baby-led weaning (finger foods from the start), but the baby rarely eats iron-rich foods. What’s the best advice?","options":[{"t":"Any feeding style works if iron-rich foods come at least twice daily and foods are safe: offer soft strips of meat, lentil patties, egg","why":"Either style can work when iron and safety are covered.","_n":"2z0c4","_k":"e5a34cdf"},{"t":"Offer whole nuts as an iron-rich finger food","why":"Whole nuts are a choking hazard.","_n":"300d4","_k":"76ad6406"},{"t":"Offer fruit finger foods only","why":"At about 6 months a baby’s iron stores run low. Offer iron-rich foods first, at least twice a day.","_n":"310a4","_k":"1a51c57a"},{"t":"Baby-led weaning is unsafe","why":"Either style can work when iron and safety are covered.","_n":"32094","_k":"8f83e491"}]},{"id":"c6","goal":[3,5],"prompt":"\u003cspan class=\"it-star\">★ Investigation\u003c/span> \u003cstrong>C6.\u003c/strong> In a large trial, babies at high risk of peanut allergy were \u003cstrong>randomly assigned\u003c/strong> to eat peanut early or avoid it; fewer in the early group developed the allergy (the LEAP trial, 2015). What can we conclude?","options":[{"t":"Early introduction \u003cstrong>caused\u003c/strong> a lower allergy rate \u003cstrong>in high-risk infants\u003c/strong>; results may differ for other groups","why":"Random assignment supports cause and effect, for the group studied.","_n":"330c4","_k":"ddafda7d"},{"t":"Peanut avoidance prevents allergy","why":"That’s the opposite of the result.","_n":"340b4","_k":"d6d8c67c"},{"t":"It proves the result for every baby","why":"The trial studied high-risk infants.","_n":"35064","_k":"32cb8ff1"},{"t":"It shows only a link, not cause and effect","why":"Random assignment supports cause and effect, for the group studied.","_n":"36054","_k":"56053c49"}],"hints":["What does random assignment allow you to conclude?","It supports cause and effect, for the group studied.","Early introduction lowered risk in high-risk infants."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Gwen","goal":[1,2,3],"how":"","instruction":"Gwen made one mistake in each plan. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Plan the first week of solids for a 6-month-old.","steps":["Keep breastfeeding and giving vitamin D drops.","Day 1: start with apple juice in a bottle so the baby gets used to new tastes.","Day 2: add iron-fortified infant cereal.","Day 3: add mashed lentils."],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 is good. The mistake is earlier.","Step 4 is good."],"fixes":[{"t":"Start with iron-rich foods such as iron-fortified cereal or lentils; skip juice.","why":"At about 6 months a baby’s iron stores run low. Offer iron-rich foods first, at least twice a day.","_n":"37084","_k":"66c53f9a"},{"t":"Start with cow’s milk in a bottle.","why":"Not as the main milk before 9–12 months.","_n":"38074","_k":"bff55b95"},{"t":"Start with honey to make cereal tasty.","why":"Honey can carry \u003cem>Clostridium botulinum\u003c/em> spores, which can cause infant botulism. No honey before 12 months.","_n":"39124","_k":"51f6fea2"},{"t":"Step 2 is correct.","why":"At about 6 months a baby’s iron stores run low. Offer iron-rich foods first, at least twice a day.","_n":"3a114","_k":"dbc897f1"}],"hints":["What runs low at 6 months?","Iron.","Iron-rich first; no juice."]},{"id":"e2","goal":3,"task":"Plan allergen introduction for a 6-month-old with no allergy history.","steps":["Wait until the baby is eating some solids.","Avoid peanut and egg until age 3 to prevent allergies.","Offer peanut as thinned peanut butter, never whole nuts.","Once introduced, keep offering it regularly."],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 is correct form, but the mistake is earlier.","Step 4 is correct."],"fixes":[{"t":"Introduce peanut and egg around 6 months (not before 4), in safe forms, and keep offering them regularly.","why":"Introducing common allergens around 6 months (not before 4 months), and then offering them regularly, may lower the risk of allergy.","_n":"3b984","_k":"e3491c68"},{"t":"Step 2 is correct.","why":"Introducing common allergens around 6 months (not before 4 months), and then offering them regularly, may lower the risk of allergy.","_n":"3c994","_k":"765e61af"},{"t":"Avoid all allergens until school age.","why":"Introducing common allergens around 6 months (not before 4 months), and then offering them regularly, may lower the risk of allergy.","_n":"3d9a4","_k":"04e8f018"},{"t":"Introduce whole peanuts at 6 months.","why":"Whole nuts are a choking hazard.","_n":"3e9b4","_k":"acc454b6"}],"hints":["Does delay prevent allergy?","The evidence points the other way.","Around 6 months, in safe forms."]},{"id":"e3","goal":1,"task":"Advise a parent of a 2-year-old on drinks.","steps":["Offer water between meals.","Skip juice and pop.","Milk is healthy, so let him drink as much as he wants.","Serve milk in an open cup at meals."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is fine."],"fixes":[{"t":"Switch to almond beverage.","why":"Not suitable as the main milk.","_n":"3f944","_k":"bc223e73"},{"t":"About 2–3 cups of milk a day is enough; more can crowd out iron-rich foods.","why":"Too much milk fills a toddler up and crowds out iron-rich foods; about 2–3 cups a day is plenty.","_n":"3g954","_k":"de88050c"},{"t":"Step 3 is correct.","why":"Too much milk fills a toddler up and crowds out iron-rich foods; about 2–3 cups a day is plenty.","_n":"3h964","_k":"aca5c4cb"},{"t":"Stop milk completely.","why":"Milk provides calcium and vitamin D.","_n":"3i974","_k":"17ad3567"}],"hints":["What happens to iron if milk fills a toddler up?","Milk is low in iron.","About 2–3 cups a day."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"Which change on the timeline surprised you most: how early allergens are introduced, the iron-first rule, or how fast textures change?"},{"id":"j2","q":"In your own words, explain the division of responsibility and why it works."},{"id":"j3","q":"Explain to a new babysitter how to make a snack plate safe for a 2-year-old."},{"id":"j4","q":"What’s one baby or toddler product claim you’d now question? What would you check first?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Why does Health Canada advise a vitamin D supplement for breastfed babies?","options":[{"t":"Vitamin D replaces iron","why":"Different nutrients do different jobs.","_n":"3j904","_k":"c0d20ebb"},{"t":"Breast milk has too much vitamin D","why":"The opposite is true.","_n":"3k914","_k":"506ce96f"},{"t":"Only premature babies need vitamin D","why":"The advice applies to all breastfed babies.","_n":"3l9e4","_k":"7f6b7d64"},{"t":"Breast milk is naturally low in vitamin D","why":"The supplement helps prevent rickets.","_n":"3m9d4","_k":"a04d03a3"}]},"b":{"prompt":"What daily vitamin D supplement does Health Canada advise for breastfed babies?","options":[{"t":"400 IU","why":"Health Canada advises 400 IU a day for breastfed babies.","_n":"3n9c4","_k":"2aaa41ff"},{"t":"4000 IU","why":"That’s the upper limit for older children and adults, not an infant supplement.","_n":"3o9b4","_k":"f8149430"},{"t":"None","why":"Breast milk is low in vitamin D.","_n":"3p9a4","_k":"2b556ce4"},{"t":"40 IU","why":"Ten times too low.","_n":"3q994","_k":"8896c111"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Around what age do most babies start solid foods?","options":[{"t":"18 months","why":"Far too late.","_n":"3r984","_k":"8752db0b"},{"t":"2 months","why":"Too early: their bodies and skills aren’t ready.","_n":"3s974","_k":"b2889531"},{"t":"12 months","why":"Too late: iron needs aren’t met.","_n":"3t964","_k":"105f84af"},{"t":"About 6 months","why":"Around 6 months, iron stores run low and babies are ready for solids.","_n":"3u954","_k":"32fed966"}]},"b":{"prompt":"Which should be among a baby’s very first foods?","options":[{"t":"Cow’s milk as the main drink","why":"Not before 9–12 months.","_n":"3v8c3","_k":"e9e2fdce"},{"t":"Juice","why":"At about 6 months a baby’s iron stores run low. Offer iron-rich foods first, at least twice a day.","_n":"3w8d3","_k":"3f41d774"},{"t":"Iron-rich foods such as lentils or iron-fortified cereal","why":"At about 6 months a baby’s iron stores run low. Offer iron-rich foods first, at least twice a day.","_n":"3x8a3","_k":"88dcc83d"},{"t":"Plain rice crackers only","why":"Low in iron.","_n":"3y8b3","_k":"6d865c5c"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Why shouldn’t babies under 12 months have honey?","options":[{"t":"It has no nutrients","why":"That’s not the reason for the rule.","_n":"3z883","_k":"0af6c71d"},{"t":"It’s a common allergen","why":"It isn’t.","_n":"40893","_k":"964a88cb"},{"t":"It can cause infant botulism","why":"Honey can carry \u003cem>Clostridium botulinum\u003c/em> spores, which can cause infant botulism. No honey before 12 months.","_n":"41863","_k":"d7cc2036"},{"t":"It’s too sticky","why":"Texture isn’t the reason.","_n":"42873","_k":"e423bfdf"}]},"b":{"prompt":"How should grapes be cut for a 2-year-old?","options":[{"t":"Frozen whole","why":"Still a choking hazard.","_n":"43943","_k":"e2c12f1e"},{"t":"Into quarters lengthwise","why":"Round foods can block a small airway. Cut grapes into quarters lengthwise for children under 4.","_n":"44953","_k":"b8d53407"},{"t":"Left whole if they’re small","why":"Round foods can block the airway.","_n":"45923","_k":"67dd2c6a"},{"t":"In half crosswise","why":"Round foods can block a small airway. Cut grapes into quarters lengthwise for children under 4.","_n":"46913","_k":"79c5f8ea"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Ayo is 6 months old, eats iron-rich foods well, and has no history of allergy or eczema. His parent wants to try peanut. What’s the best plan?","options":[{"t":"Wait until age 3","why":"Introducing common allergens around 6 months (not before 4 months), and then offering them regularly, may lower the risk of allergy.","_n":"47943","_k":"23439592"},{"t":"Offer whole peanuts","why":"Choking hazard.","_n":"48933","_k":"af5f9432"},{"t":"Offer a little smooth peanut butter thinned into cereal now, then keep it in his diet regularly","why":"Introducing common allergens around 6 months (not before 4 months), and then offering them regularly, may lower the risk of allergy.","_n":"49963","_k":"14c71d7d"},{"t":"Offer it once, then avoid it","why":"Regular offering matters after introduction.","_n":"4a953","_k":"0d78fa8d"}]},"b":{"prompt":"A 6-month-old with no allergy history is ready for solids. How should egg be introduced?","options":[{"t":"Well-cooked egg (e.g. scrambled), then offered regularly","why":"Introducing common allergens around 6 months (not before 4 months), and then offering them regularly, may lower the risk of allergy.","_n":"4b983","_k":"c360746c"},{"t":"Wait until age 2","why":"Introducing common allergens around 6 months (not before 4 months), and then offering them regularly, may lower the risk of allergy.","_n":"4c973","_k":"fe49c8f9"},{"t":"Raw egg in a smoothie","why":"Raw egg is a \u003cem>Salmonella\u003c/em> risk.","_n":"4d8a3","_k":"9b6b892f"},{"t":"Only egg white at age 5","why":"Delaying isn’t recommended.","_n":"4e893","_k":"2e54a286"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"An 18-month-old drinks about 6 cups of milk a day, eats little at meals and is often tired. What is most likely happening?","options":[{"t":"Too much milk is crowding out iron-rich foods, which can lead to low iron","why":"Too much milk fills a toddler up and crowds out iron-rich foods; about 2–3 cups a day is plenty.","_n":"4f003","_k":"5cc04bdb"},{"t":"Milk is causing too much iron","why":"Milk is low in iron.","_n":"4g013","_k":"4d590dd0"},{"t":"The child needs more milk","why":"Too much milk fills a toddler up and crowds out iron-rich foods; about 2–3 cups a day is plenty.","_n":"4h023","_k":"f73faa24"},{"t":"The child needs juice for energy","why":"Juice adds sugar, not iron.","_n":"4i033","_k":"6b7f22cc"}]},"b":{"prompt":"A 2-year-old drinks several cups of juice a day and refuses meals. Best first step?","options":[{"t":"Switch to sports drinks","why":"Not suitable for toddlers.","_n":"4j043","_k":"406fe830"},{"t":"Force them to finish meals","why":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"4k053","_k":"9c05e798"},{"t":"Replace juice with water between meals, and offer milk and meals at regular times","why":"Water and milk are the drinks for toddlers, and regular meal times leave room for food.","_n":"4l063","_k":"d53acb77"},{"t":"Add more juice at meals","why":"Juice fills a small stomach.","_n":"4m073","_k":"45ffd98c"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"At daycare, a 3-year-old refuses lentil soup the first time it’s served. Which approach is most likely to work over time?","options":[{"t":"Make the child sit until it’s finished","why":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"4n083","_k":"642e4db8"},{"t":"Serve it again on other days beside familiar foods, without pressure","why":"Many toddlers need 8–15 or more relaxed tries before accepting a new food.","_n":"4o093","_k":"43395763"},{"t":"Offer a treat for each spoonful","why":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"4p063","_k":"12f65148"},{"t":"Remove lentils from the menu forever","why":"Many toddlers need 8–15 or more relaxed tries before accepting a new food.","_n":"4q053","_k":"fbad42e6"}]},"b":{"prompt":"At a family dinner, a toddler eats two helpings of pasta and no vegetables. What fits the division of responsibility?","options":[{"t":"Remove the pasta until vegetables are eaten","why":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"4r043","_k":"3a68d918"},{"t":"Make vegetables the dessert reward","why":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"4s033","_k":"a9bbda5a"},{"t":"Keep serving balanced family meals; let the child decide how much of each to eat","why":"Adults decide what, when and where food is offered; the child decides whether and how much to eat.","_n":"4t0a3","_k":"75c659b4"},{"t":"Cook only pasta from now on","why":"The adult still decides what is offered.","_n":"4u093","_k":"8749f3ae"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the clearest explanation of the division of responsibility?","options":[{"t":"“The child decides what to eat; adults decide how much.”","why":"Reversed.","_n":"4v083","_k":"0fd0e6f0"},{"t":"“Adults decide what, when and where food is offered; the child decides whether and how much to eat.”","why":"That’s Ellyn Satter’s division of responsibility: structure from adults, trust in the child’s appetite.","_n":"4w073","_k":"87b6fbad"},{"t":"“Children decide everything.”","why":"That’s no structure at all.","_n":"4x0e3","_k":"f934bb2f"},{"t":"“Adults decide everything, including how much.”","why":"That’s pressure feeding. Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"4y0d3","_k":"0af933b7"}]},"b":{"prompt":"Which is the clearest explanation of why rewarding vegetables with dessert backfires?","options":[{"t":"“It works well every time.”","why":"Pressure and rewards usually backfire. Adults decide what is offered; the child decides how much.","_n":"4z145","_k":"15d32abd"},{"t":"“Because dessert is a bad food.”","why":"The course doesn’t use moral food labels; the problem is the reward.","_n":"50155","_k":"f2e49c09"},{"t":"“Dessert has more vitamins.”","why":"Not the point.","_n":"51125","_k":"a178a907"},{"t":"“It teaches that vegetables are a chore and dessert is the prize, so children may like vegetables less.”","why":"Rewards teach that vegetables are a chore and dessert is the prize.","_n":"52135","_k":"f3d7d906"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which statement about textures is correct?","options":[{"t":"“Babies move from mashed and minced foods to soft finger foods and family textures during the first year.”","why":"Textures move quickly from mashed and minced to soft finger foods and then family foods.","_n":"53185","_k":"e01711e0"},{"t":"“Babies should start with hard raw vegetables.”","why":"Choking hazard.","_n":"54195","_k":"3782fc51"},{"t":"“Babies should eat only smooth purées until age 2.”","why":"Delaying lumpy textures can make feeding harder.","_n":"55165","_k":"a127fc5f"},{"t":"“Texture doesn’t matter for babies.”","why":"It matters for skills and safety.","_n":"56175","_k":"6ce6cff1"}]},"b":{"prompt":"Which statement about cow’s milk is correct?","options":[{"t":"“Toddlers should never drink cow’s milk.”","why":"It’s an important source of calcium and vitamin D.","_n":"570c5","_k":"b3d1e14f"},{"t":"“Cow’s milk is the best first drink at birth.”","why":"Breast milk or formula first.","_n":"580d5","_k":"b49fe70f"},{"t":"“Toddlers should drink as much milk as they want.”","why":"Too much milk fills a toddler up and crowds out iron-rich foods; about 2–3 cups a day is plenty.","_n":"591a5","_k":"7d2867cc"},{"t":"“Cow’s milk can become the main drink at 9–12 months; after that, about 2–3 cups a day is plenty.”","why":"Before then, breast milk or formula; after 12 months, about 2–3 cups a day leaves room for iron-rich foods.","_n":"5a195","_k":"939673df"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"An ad says a toddler formula “is essential for healthy brain growth.” What’s the best response?","options":[{"t":"Switch the toddler off all milk","why":"Milk still fits.","_n":"5b1c5","_k":"6239ab99"},{"t":"Use it in place of meals","why":"Toddlers need family foods.","_n":"5c1b5","_k":"fc86cead"},{"t":"Most toddlers don’t need it; check the CPS and Health Canada guidance and the evidence","why":"Most toddlers don’t need them; family foods plus milk meet their needs.","_n":"5d165","_k":"68317989"},{"t":"Buy it because the ad is from a big company","why":"Size isn’t evidence.","_n":"5e155","_k":"a087be1c"}]},"b":{"prompt":"A parent relies on fruit pouches for most of a toddler’s meals. What’s the best advice?","options":[{"t":"Add honey to pouches for energy","why":"After 12 months honey is safe, but it adds sugar and isn’t needed.","_n":"5f185","_k":"5a18db16"},{"t":"Pouches are fine sometimes, but spoons, cups and finger foods build skills; include iron-rich foods and vegetables","why":"Feeding skills grow with spoons, cups and finger foods.","_n":"5g175","_k":"9b53fb4b"},{"t":"Pouches are perfect for every meal","why":"They skip skills, and fruit dominates.","_n":"5h125","_k":"4947b15e"},{"t":"Pouches are dangerous and must be banned","why":"Over-generalizing.","_n":"5i115","_k":"8a5004ec"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Which lunch best fits Canada’s Food Guide for a 2-year-old?","options":[{"t":"Soft-cooked vegetables, half a whole-wheat pita with hummus, strips of chicken, and water","why":"Vegetables, a whole grain, protein foods and water, all safe for a 2-year-old.","_n":"5ja5a","_k":"88fee434"},{"t":"A bowl of popcorn and cheese","why":"Popcorn is a choking hazard.","_n":"5ka4a","_k":"014ad37b"},{"t":"Only milk, three cups","why":"Not a meal, and too much milk.","_n":"5la7a","_k":"0ec5b9f7"},{"t":"Juice and crackers","why":"No vegetables, protein or water.","_n":"5ma6a","_k":"6a4a89ab"}]},"b":{"prompt":"Which snack fits a \u003cstrong>nut-free\u003c/strong> daycare for a 3-year-old?","options":[{"t":"Peanut butter on toast","why":"Not nut-free.","_n":"5na9a","_k":"0b687de7"},{"t":"Hard candy","why":"Choking hazard.","_n":"5oa8a","_k":"3cbe8663"},{"t":"Whole grapes","why":"Choking hazard unless quartered.","_n":"5paba","_k":"cbcf7c02"},{"t":"Plain yogurt with soft berries","why":"Nut-free, and soft enough to be safe.","_n":"5qaaa","_k":"88f5686b"}]}}]},"task":{"title":"Sasha’s day","summary":"Sasha’s day","statement":"\u003cp>Plan one day of meals and snacks for \u003cstrong>Sasha (2 years)\u003c/strong>, whose family is Filipino-Canadian, that meets every condition. Then use the kitchen card to prepare one of the snacks.\u003c/p>","how":"Choose a meal or snack, then tap foods to add them (1–3 foods each). Choose the cut for any food that needs one, and add drinks below.","slots":[{"id":"b","t":"Breakfast"},{"id":"s1","t":"Morning snack"},{"id":"l","t":"Lunch"},{"id":"s2","t":"Afternoon snack"},{"id":"d","t":"Dinner"}],"groups":[{"id":"family","t":"Family foods"},{"id":"other","t":"Other foods"}],"foods":[{"id":"arroz","t":"Arroz caldo (rice porridge with chicken and ginger)","short":"arroz caldo","group":"family","iron":true},{"id":"pancit","t":"Pancit with vegetables","short":"pancit","group":"family","vf":true},{"id":"sinigang","t":"Sinigang with soft vegetables","short":"sinigang","group":"family","vf":true},{"id":"mango","t":"Mango cubes","short":"mango","group":"family","vf":true},{"id":"oatmeal","t":"Oatmeal with mashed banana","short":"oatmeal with banana","group":"other","vf":true},{"id":"toast","t":"Whole-wheat toast with peanut butter","short":"toast with
