.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 13: hero (evidence-ladder storyboard), Evidence ladder (ladder with claim cards, prediction spotlight, risk translator
   with a 100-person icon array, study designer), Headline vs study (word chips, study cards, teacher slot, treatment panel),
   risk set and the Fix-the-headline task. Plan colours: rungs --ink-2 with labels; icon array baseline --ink-2, extra cases
   orange (--p-k) with "+", fewer cases blue (--pen) with "−"; no red or green except feedback. */
/* radio groups (from HFA4U 06) */
.cn-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.cn-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.6rem}
.cn-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.cn-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.cn-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.cn-chipset button:hover{border-color:var(--pen)}
.cn-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cn-h4{margin:0 0 6px;font-size:1rem}
.cn-h5{margin:14px 0 6px;font-size:.95rem}
.cn-lit{box-shadow:0 0 0 3px var(--hi);background:var(--hi-soft)}

/* support note, header button and dialog (pattern from HFA4U 10) */
.cn-sup p{margin:0 0 6px;font-size:.95rem;line-height:1.5}
.cn-sup p:last-child{margin:0}
#cn-jsup{margin-top:4px}
.cn-supbtn{white-space:nowrap}
.cn-dlg{max-width:min(560px,calc(100vw - 32px));border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:18px 20px}
.cn-dlg::backdrop{background:rgba(0,0,0,.45)}
.cn-dlg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.cn-dlg-top h2{margin:0;font-size:1.25rem}

/* hero */
.cn-hero{width:100%}
.cn-hsvg{display:block;width:100%;height:auto;max-height:420px}
.cn-hrail{stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.cn-hrung{stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.cn-hl{fill:var(--ink-2);font:400 13px var(--font-ui)}
.cn-hl.on{fill:var(--ink);font-weight:700}
.cn-hn{font-weight:700}
.cn-hcard{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.cn-hptr{fill:var(--ink)}
.cn-hct{fill:var(--ink);font:700 12.5px var(--font-ui)}
.cn-hstamp rect{fill:var(--hi);stroke:var(--hi-ink);stroke-width:1.5}
.cn-hst{fill:var(--hi-ink);font:700 11.5px var(--font-ui);letter-spacing:.02em}
.cn-cap{font-size:1.05rem!important}

/* Explore layout */
.cn-lab{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.cn-main,.cn-side{min-width:0}
.cn-side{border-left:1.5px solid var(--rule);padding-left:18px}

/* claim cards */
.cn-card{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--ink-2);background:var(--sheet);border-radius:8px;padding:6px 10px;font-size:.92rem;line-height:1.3;max-width:100%;min-height:44px}
button.cn-card:hover{border-color:var(--pen)}
.cn-card.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.cn-card.on .cn-cn,.cn-card.on .cn-cf{color:var(--hi-ink)}
.cn-ct{font-weight:700}
.cn-cn{font-size:.82rem;color:var(--ink-2)}
.cn-cf{font-size:.78rem;font-style:italic;color:var(--ink-2)}
.cn-ctag{align-self:flex-start;font-size:.75rem;font-weight:700;border:1px solid var(--ink-2);border-radius:999px;padding:0 .55em;margin-top:2px}
.cn-stamp{align-self:flex-start;margin-top:3px;font-size:.74rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:var(--hi);color:var(--hi-ink);border:1.5px solid var(--hi-ink);border-radius:3px;padding:0 .45em;transform:rotate(-3deg)}
.cn-card.still{border-style:dashed}
.cn-tray{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.cn-tray .cn-card{flex:1 1 15rem}
.cn-lst{margin:2px 0 10px;min-height:1.4em}

/* the ladder: rails + rung bar on the left; rung button and its cards on the right */
.cn-ladder{margin:6px 0 4px}
.cn-rung{display:grid;grid-template-columns:2.6rem minmax(0,1fr);border-radius:8px}
.cn-rail{position:relative;border-left:4px solid var(--ink-2);border-right:4px solid var(--ink-2);margin:0 .3rem}
.cn-rail::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--ink-2)}
.cn-rbody{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 10px;padding:7px 4px 7px 8px;border-bottom:1px dashed var(--rule);min-height:64px}
.cn-rung:last-child .cn-rbody{border-bottom:0}
.cn-rb{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:8px;flex:0 0 12.5rem;min-height:44px;border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;padding:4px 10px;text-align:left;font-size:.92rem;line-height:1.2}
.cn-rb:hover{border-color:var(--pen)}
.cn-rb.ready{border-color:var(--ink);border-style:dashed;background:var(--sheet)}
.cn-rn{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--ink-2);color:var(--sheet);font-weight:700;font-size:.85rem;flex:0 0 auto}
.cn-rt{font-weight:700}
.cn-ph{grid-column:2;font-size:.78rem;color:var(--ink-2)}
.cn-rcards{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 12rem;min-width:0}
.cn-rcards .cn-card{flex:1 1 12rem;font-size:.86rem}

/* prediction spotlight */
.cn-spot{border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);padding:10px 12px;margin:0 0 10px}
.cn-spt{margin:0 0 6px}
.cn-spc{display:flex;flex-wrap:wrap;gap:8px}
.cn-spc .cn-card{flex:1 1 13rem}
.cn-cmp{margin-top:10px}
.cn-cmpt{margin:0 0 6px}
.cn-cmpr{display:grid;grid-template-columns:minmax(8rem,13rem) minmax(0,1fr);gap:2px 10px;align-items:center;margin:0 0 8px;font-size:.9rem}
.cn-cmpl{font-weight:700;line-height:1.2}
.cn-cmpb{position:relative;height:20px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);overflow:hidden}
.cn-cmpb i{position:absolute;left:0;top:2px;bottom:2px;background:var(--ink-2);border-radius:3px}
.cn-cmpv{grid-column:2;font-size:.85rem}
.cn-cmpn{margin:4px 0 0}
.cn-oth{margin-top:10px;padding:8px 12px;border-left:4px solid var(--pen);background:var(--sheet);border-radius:4px}
.cn-oth p{margin:0 0 4px}
.cn-othl{margin:0 0 4px;padding-left:1.2em}
.cn-othl li{font-weight:700}

/* risk translator */
.cn-trn{margin:0 0 6px}
.cn-sl{max-width:34rem}
.cn-sl output{white-space:nowrap}
.cn-ia{margin:8px 0 0}
.cn-ias{display:block;width:100%;max-width:330px;height:auto;margin:0 auto}
.cn-i{stroke-linejoin:round}
.cn-i.o{fill:none;stroke:var(--ink-2);stroke-width:1.2;opacity:.7}
.cn-i.b{fill:var(--ink-2);stroke:var(--ink-2);stroke-width:1.2}
.cn-i.x{fill:var(--p-k);stroke:var(--p-k);stroke-width:1.2}
.cn-i.f{fill:var(--info-bg);stroke:var(--pen);stroke-width:1.8;stroke-dasharray:2.5 2}
.cn-mk{fill:none;stroke:var(--sheet);stroke-width:2.4;stroke-linecap:round}
.cn-mk.f{stroke:var(--pen)}
.cn-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;margin-top:8px;font-size:.85rem}
.cn-lg{display:inline-flex;align-items:center;gap:4px}
.cn-lgi{width:18px;height:20px;flex:0 0 auto}

/* study designer */
.cn-claim{margin:0 0 12px;font-weight:700}
.cn-claim .tag{margin-right:6px}
.cn-dgr .cn-rgw{margin:0 0 8px}
.cn-dgr .cn-rgl{min-width:6.2rem}
.cn-dsum{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:4px 14px 8px;margin-top:6px}
.cn-dsl{margin:0;padding-left:1.1em}
.cn-dsl li{margin:0 0 3px}

/* Part 3: headline vs study */
.cn-stn{margin-top:8px}
.cn-pt{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.cn-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cn-hl,.cn-study{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.cn-hl{background:var(--paper)}
.cn-hlh{margin:0 0 8px;font-weight:700;font-size:.9rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cn-study p:last-child{margin:0}
.cn-hlw{display:flex;flex-wrap:wrap;gap:6px;margin:0;font-family:var(--font-math);font-size:1.25rem;font-weight:600}
.cn-w{border:1.5px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.1em .45em;min-height:36px;font:inherit}
.cn-w:hover{border-color:var(--pen)}
.cn-w.on{background:var(--hi);border-color:var(--hi-ink);color:var(--hi-ink)}
.cn-w.over{text-decoration:underline wavy;text-decoration-thickness:1.5px;text-underline-offset:4px}
.cn-w:disabled{opacity:1}
.cn-data p{margin:8px 0 0}
.cn-fixq{margin:14px 0 6px}
.cn-sample{margin:0 0 6px}
.cn-sample summary{font-weight:700;cursor:pointer}
.cn-sample p{margin:6px 0 0;font-style:italic}
.cn-s2f{display:grid;gap:4px;margin:0 0 12px}
.cn-fl{display:block;font-weight:700;margin:8px 0 4px}
.cn-s2w{min-height:44px;margin-bottom:6px}
.cn-s3h{margin-top:14px}
.cn-fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:8px}
.cn-fxd{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--sheet)}
.cn-fxd summary{font-weight:700;cursor:pointer;min-height:28px}
.cn-fxd p{margin:6px 0 0}
.cn-needs p{margin:0 0 8px}
.cn-cq{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.cn-cqp{margin:0 0 8px}

/* practice: risk set */
.cn-unit{font-weight:700}
.cn-pick{margin:0 0 6px}

/* task: Fix the headline */
.cn-tin .cn-rgw{align-items:flex-start;margin:0 0 12px}
.cn-tin .cn-rgl{min-width:4.2rem;padding-top:.45em}
.cn-tpv{border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);padding:12px 14px}
.cn-newsh{margin:0 0 6px;font-size:.85rem;font-weight:700;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.cn-news{margin:0 0 10px;font-family:var(--font-math);font-size:1.3rem;font-weight:600;line-height:1.3}
.cn-news.muted{font-family:var(--font-ui);font-size:1rem;font-weight:400}
.cn-raw{margin:0;color:var(--ink-2)}
.cn-raw b{color:var(--ink)}
.cn-after2{margin-top:6px}

@media (min-width:821px){#task .design{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
@media (max-width:820px){
  .cn-lab{grid-template-columns:minmax(0,1fr)}
  .cn-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .cn-pair{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .cn-rung{grid-template-columns:1.7rem minmax(0,1fr)}
  .cn-rail{margin:0 .2rem}
  .cn-rb{flex:1 1 100%}
  .cn-rcards,.cn-rcards .cn-card,.cn-tray .cn-card{flex:1 1 100%}
  .cn-cmpr{grid-template-columns:minmax(0,1fr)}
  .cn-cmpv{grid-column:1}
  .cn-hlw{font-size:1.12rem}
  .cn-rgl{min-width:0;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){.cn-card,.cn-w{transition:none}}

</style>

<script>window.MV_PAYLOAD={"meta":{"id":"13-cancer-nutrition","nn":"13","slug":"cancer-nutrition","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 3","groupName":"Nutrition, Health and Disease","trivium":"","size":"M","storageKey":"hfa4u-13-cancer-nutrition-v1","progressKey":"hfa4u-progress-v1:13-cancer-nutrition","toolkit":"1.0.7"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"35b458fe","content":{"id":"13-cancer-nutrition","kind":"topic","title":"Cancer and nutrition","topic":"Cancer & Nutrition","readyTopic":"cancer and nutrition","hero":{"headline":"How strong is the evidence?","text":"Nutrition and cancer is full of bold claims. Some are backed by \u003cstrong>reviews of many studies\u003c/strong>; others rest on \u003cstrong>one mouse study\u003c/strong> or a \u003cstrong>testimonial\u003c/strong>. Learn to climb the evidence ladder, to tell \u003cstrong>relative risk\u003c/strong> from \u003cstrong>absolute risk\u003c/strong>, and to see how nutrition supports people \u003cstrong>during treatment\u003c/strong>.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later. If this topic is close to home for you, take it at your own pace. For your own health, talk to a doctor, nurse or registered dietitian.","fig":{"html":"\u003cdiv class=\"cn-hero\" id=\"cn-hero\">\u003c/div>","caption":""},"aria":"A ladder with five rungs, labelled from bottom to top: Someone said so, Lab dish or animal study, Observational study, Randomized trial, Review of many studies. A headline card, “Berry powder fights cancer!”, hovers beside the lowest rung, then climbs and stops at rung 2 with the stamp “Lab study only”. A second card, “Processed meat linked to colorectal cancer”, climbs to rung 5 with the stamp “Expert review (IARC, 2015)”.","caption":"Same newspaper, very different evidence.","cards":[{"lines":["Berry powder","fights cancer!"],"to":2,"stamp":"Lab study only"},{"lines":["Processed meat linked","to colorectal cancer"],"to":5,"stamp":"Expert review (IARC, 2015)"}]},"support":"If cancer touches your life or your family’s, it’s okay to step away and come back. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>).","advice":"For your own health, talk to a doctor, nurse or registered dietitian.","goals":["I can describe which eating-related factors are linked to cancer risk, and how strong the evidence is.","I can rank kinds of evidence (anecdote, lab, observational, trial, review) and explain what each can show.","I can convert relative risk into absolute risk and explain why both matter.","I can explain how cancer and its treatment change a person’s nutritional needs.","I can evaluate nutrition-and-cancer claims in headlines and ads using evidence and respectful language."],"start":{"blocks":[{"title":"Before you start","html":"\u003cp>Cancer touches many families, so this module uses careful words. It looks at \u003cstrong>patterns in large groups of people\u003c/strong>, never at any one person, and every risk number in it is a \u003cstrong>model value\u003c/strong>, not anyone’s personal risk. Cancer has many causes, including genes, age and chance. \u003cstrong>Most cancers are not anyone’s fault.\u003c/strong>\u003c/p>\u003cp class=\"tiny muted\">This is health information, not advice, and it gives no supplement advice for any person. For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Fibre and food sources","goal":1,"prompt":"Which food is a whole grain?","options":[{"t":"White bread","why":"Refined flour.","_n":"0ae1","_k":"f5c59984"},{"t":"White rice","why":"The bran is removed.","_n":"1ad1","_k":"94ea2560"},{"t":"Rice cakes from white rice","why":"Puffed refined grain.","_n":"2ac1","_k":"5f275bcc"},{"t":"Brown rice","why":"It keeps the bran and germ.","_n":"3ab1","_k":"2183a923"}],"hints":["Whole grains keep all three parts.","Bran, germ, endosperm.","Brown rice."]},{"id":"w2","skill":"Fibre and food sources","goal":1,"prompt":"Which is a processed meat?","options":[{"t":"Lentils","why":"Plant protein.","_n":"4aa1","_k":"6f9c1fbc"},{"t":"Fresh chicken breast","why":"Unprocessed poultry.","_n":"5a91","_k":"e8a5b795"},{"t":"A fresh beef steak","why":"Red meat, but not processed.","_n":"6a81","_k":"d7fa7873"},{"t":"Bacon","why":"Cured and smoked.","_n":"7b71","_k":"060b91c3"}],"hints":["Processed means preserved by curing, salting, smoking or additives.","Think deli meats.","Bacon."]},{"id":"w3","skill":"Study types","goal":2,"prompt":"Researchers randomly assign people to two groups and compare outcomes. This is a…","options":[{"t":"Randomized controlled trial","why":"The researchers assign the groups by chance.","_n":"8b61","_k":"12536691"},{"t":"Lab study","why":"Lab studies use cells or animals.","_n":"9735","_k":"27345ac9"},{"t":"Observational study","why":"Observational studies don’t assign.","_n":"a745","_k":"c30f3ffe"},{"t":"Case report","why":"That’s one patient.","_n":"b715","_k":"cc8c1540"}],"hints":["Who decides the group?","The researchers, by chance.","RCT."]},{"id":"w4","skill":"Study types","goal":2,"prompt":"Why can an observational study not prove cause?","options":[{"t":"Observational studies use too few people","why":"Many are very large.","_n":"c725","_k":"615f4fae"},{"t":"They’re always done on animals","why":"They follow people.","_n":"d775","_k":"1a3b6324"},{"t":"They never measure outcomes","why":"They do.","_n":"e785","_k":"958cd286"},{"t":"The groups may differ in other ways that affect the outcome","why":"Confounding.","_n":"f755","_k":"bbfafbeb"}],"hints":["Did the researchers choose who ate what?","No: people chose.","Other differences could explain the result."]},{"id":"w5","skill":"Percentages","goal":3,"prompt":"What is 20% of 5?","options":[{"t":"0.2","why":"That’s 20% of 1.","_n":"g765","_k":"6aa78c76"},{"t":"1","why":"20% is one-fifth, and one-fifth of 5 is 1.","_n":"h7b5","_k":"f5a3b2de"},{"t":"4","why":"That’s 80% of 5.","_n":"i7c5","_k":"a3b30149"},{"t":"25","why":"That’s 5 × 5.","_n":"j0d5","_k":"8b10ca1c"}],"hints":["20% = 1/5.","One-fifth of 5.","1."]},{"id":"w6","skill":"Percentages","goal":3,"prompt":"A risk goes from 4 in 100 to 3 in 100. What’s the relative decrease?","options":[{"t":"1%","why":"That’s the absolute change, in percentage points.","_n":"k0c5","_k":"f9112a96"},{"t":"75%","why":"That’s 3 ÷ 4.","_n":"l0b5","_k":"035dc50c"},{"t":"33%","why":"That’s 1 ÷ 3.","_n":"m0a5","_k":"fc4f7fba"},{"t":"25%","why":"1 ÷ 4.","_n":"n095","_k":"d740dc46"}],"hints":["Change ÷ starting value.","1 ÷ 4.","25%."]}],"refreshers":{"Fibre and food sources":"Whole grains keep bran and germ. Processed meats are preserved by curing, salting, smoking or additives.","Study types":"Observational studies watch; trials assign. Only randomized trials can show cause directly.","Percentages":"Relative change = change ÷ starting value. Absolute change = the difference itself."}}},"explore":{"heading":"Evidence ladder","intro":"Place each claim on the rung its evidence reaches, translate risks into people out of 100, and design a fair test. Numbers in the risk translator are \u003cstrong>model values\u003c/strong>. Many factors, including genes, age and chance, play a role. No one is to blame for their cancer.","modes":[{"id":"ladder","t":"Ladder"},{"id":"risk","t":"Risk translator"},{"id":"design","t":"Study designer"}],"rungs":[{"n":1,"t":"Someone said so","show":"One person’s story. It can’t show what caused anything."},{"n":2,"t":"Lab dish or animal study","show":"Cells or animals. It can guide research, but it doesn’t show effects in people."},{"n":3,"t":"Observational study","show":"An association in people who chose their own food and habits."},{"n":4,"t":"Randomized trial","show":"A test of cause: researchers assign the groups by chance."},{"n":5,"t":"Review of many studies","show":"Expert panels (IARC, WCRF/AICR) weigh all the evidence together."}],"cards":[{"id":"c1","t":"“My aunt beat cancer with a juice cleanse”","note":"One person’s story","_a":"Ag=="},{"id":"c2","t":"“Berry extract slowed tumour cells in a dish”","note":"Cells in a lab","_a":"AQ=="},{"id":"c3","t":"“Green tea compound shrank tumours in mice”","note":"Mice","_a":"AQ=="},{"id":"c4","t":"“People eating more fibre had less colorectal cancer”","note":"Large cohort studies","_a":"AA=="},{"id":"c5","t":"“Beta-carotene supplements raised lung cancer in people who smoked”","note":"Randomized trials (1990s)","_a":"Bw=="},{"id":"c6","t":"“Processed meat causes colorectal cancer (Group 1)”","note":"IARC expert review, 2015","_a":"Bg=="},{"id":"c7","t":"“Alcohol is a cause of several cancers”","note":"IARC and WCRF/AICR reviews","_a":"Bg=="},{"id":"c8","t":"“People who drink Sunleaf tea had less cancer”","note":"One observational study","fict":"Sunleaf tea is a fictional product.","_a":"AA=="}],"tobacco":{"id":"tob","t":"“Tobacco smoking causes lung cancer (Group 1)”","note":"IARC expert review"},"compare":{"title":"Same group, different risk sizes","tag":"Model data","rows":[{"t":"Processed meat and colorectal cancer","v":1.18,"label":"about 1.2 × the baseline risk (18% higher)"},{"t":"Tobacco smoking and lung cancer","v":20,"label":"about 20 × the baseline risk"}],"note":"Bars show relative risk (baseline = 1×). Both agents are Group 1: strong evidence of a cause. The risk sizes are very different."},"others":{"title":"Possible other differences between tea drinkers and non-drinkers","items":["Smoking","Income","Exercise"],"note":"Any of these could explain the drop. A trial would assign the tea."},"surprise":"Surprise result","translator":{"base":[2,4,5,10,20],"chg":[-50,-40,-25,-20,-10,10,20,25,40,50],"baseLabel":"Baseline (lifetime risk per 100 people)","chgLabel":"Relative change","preset":{"base":5,"chg":18,"shown":"about +20%"},"tag":"Model values"},"designer":{"claim":"“Daily berry powder lowers a cancer-risk marker in adults.”","rows":[{"id":"design","t":"Design","options":[{"id":"lab","t":"Lab dish","does":"Tests the powder on cells in a dish.","rung":2},{"id":"obs","t":"Observational","does":"Watches adults who choose for themselves whether to take the powder.","rung":3},{"id":"rct","t":"Randomized trial","does":"Researchers assign adults to groups by chance.","rung":4}]},{"id":"comp","t":"Comparison","options":[{"id":"none","t":"None","does":"There’s no comparison group."},{"id":"self","t":"People who chose not to","does":"Compares with people who chose not to take the powder."},{"id":"plac","t":"Placebo or usual diet assigned at random","does":"Compares with a look-alike fake powder or usual diet, assigned at random."}]},{"id":"blind","t":"Blinding","options":[{"id":"none","t":"None","does":"Everyone knows who got the powder."},{"id":"part","t":"Participants","does":"Participants don’t know their group; the people measuring the results do."},{"id":"both","t":"Participants and assessors","does":"Neither participants nor assessors know who got what."}]},{"id":"out","t":"Outcome","options":[{"id":"after","t":"Chosen after seeing data","does":"The measure is picked after looking at the results."},{"id":"adv","t":"Chosen in advance","does":"The measure is fixed before the study starts."}]},{"id":"len","t":"Length","options":[{"id":"2","t":"2 weeks","does":"Runs for 2 weeks."},{"id":"8","t":"8 weeks","does":"Runs for 8 weeks."},{"id":"12","t":"12 weeks","does":"Runs for 12 weeks."},{"id":"24","t":"24 weeks","does":"Runs for 24 weeks."}]}]},"predictions":[{"id":"p1","prompt":"Processed meat and tobacco are both IARC Group 1. Does that mean they’re equally dangerous?","options":[{"t":"Yes, same risk","_n":"o085","_k":"402bc651"},{"t":"No: Group 1 means strong evidence of a cause, not equal risk","_n":"p075","_k":"0e7bc016"},{"t":"Yes, tobacco is safer","_n":"q065","_k":"149aa931"},{"t":"No, processed meat is riskier","_n":"r055","_k":"fb4f77b9"}],"explain":"IARC groups rate how strong the evidence is, not how big the risk is. Processed meat and tobacco are both Group 1, but their risks differ hugely."},{"id":"p2","prompt":"About how many more people per 100?","options":[{"t":"18","_n":"s045","_k":"006e5f41"},{"t":"About 1","_n":"t075","_k":"8e050a12"},{"t":"5","_n":"u085","_k":"57e17a67"},{"t":"23","_n":"v095","_k":"8471bf81"}],"explain":"An 18% higher relative risk on a 5-in-100 baseline is about 6 in 100. (5 × 0.18 is about 1 more person per 100.)"},{"id":"p3","prompt":"One observational study links Sunleaf tea to less cancer. Can it show the tea \u003cem>causes\u003c/em> the drop?","options":[{"t":"Yes, if the study is large","_n":"w0a5","_k":"53e1785c"},{"t":"No, because tea has no effect","_n":"x035","_k":"1d33897d"},{"t":"No: tea drinkers may differ in other ways","_n":"y045","_k":"31622f94"},{"t":"Yes, because tea is natural","_n":"z055","_k":"a1830551"}],"explain":"People who eat more of a food may differ in many ways. A trial tests cause."},{"id":"p4","prompt":"Before the trials, many expected beta-carotene supplements to \u003cem>lower\u003c/em> lung cancer risk. What did trials in people who smoked find?","options":[{"t":"Risk went up in the supplement groups","_n":"10065","_k":"64cbf4ae"},{"t":"No change at all","_n":"11ff5","_k":"37a0db76"},{"t":"Trials were never done","_n":"12005","_k":"a5dda8ad"},{"t":"Risk went down","_n":"13014","_k":"85dedd62"}],"explain":"High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked."}],"challenges":[{"id":"tc1","goal":[2],"prompt":"Place all eight claim cards on the correct rungs. (Use \u003cstrong>Ladder\u003c/strong>.)","why":"Each card sits where its evidence reaches: who or what was studied, and whether anyone assigned the groups.","hints":["Ask: who or what was studied, and did anyone assign the groups?","Cells and mice → rung 2; people who chose their own food → rung 3.","Reviews (IARC, WCRF) → rung 5."],"msgs":{"c4r5":"Several cohort studies, but placed here as observational evidence; a review would weigh them together.","c5r3":"Participants were randomly assigned: it’s a trial.","c23r4":"Cells and mice aren’t people in a trial.","unplaced":"Place all eight cards first: {n} still waiting in the tray.","count":"{k} of 8 cards are on the right rung. For the others, ask who or what was studied."}},{"id":"tc2","goal":[3],"prompt":"Set the translator so the absolute change is \u003cstrong>exactly +2 in 100\u003c/strong>. (Use \u003cstrong>Risk translator\u003c/strong>.)","why":"The same +2 in 100 can be called “+10%” or “+50%”. Relative numbers depend on the baseline.","banner":"The same +2 in 100 can be called “+10%” or “+50%”. Relative numbers depend on the baseline.","hints":["Absolute change = baseline × percent.","Which pairs multiply to 2?","10 × 20% = 2, for example."],"msgs":{"b2c50":"Half of 2 is 1.","b10c40":"Too many.","preset":"The translator is on the +18% preset. Move the relative change slider to choose your own percent.","minus":"That’s 2 fewer per 100, not 2 more.","other":"The absolute change is now {v} in 100. Absolute change = baseline × percent."}},{"id":"tc3","goal":[2],"stretch":true,"prompt":"Design a fair test of the claim “Daily berry powder lowers a cancer-risk marker in adults.” (Use \u003cstrong>Study designer\u003c/strong>.)","why":"Random assignment, a placebo, double blinding, an outcome chosen in advance and enough time: a fair test like this can show the powder caused a change.","hints":["What lets you say “the powder caused it”?","Random assignment, a fake-powder comparison, and nobody knowing who got what.","RCT + placebo + double-blinded + outcome chosen in advance + 8 weeks or more."],"msgs":{"self":"Self-selection brings back confounding.","after":"That lets researchers pick whichever result looks best.","short":"Too short for a risk marker to change.","unset":"Make a choice in every row of the designer first.","design":"Only a randomized trial can test cause. Cells in a dish aren’t people, and an observational study lets people choose.","comp":"Without a placebo or usual-diet group assigned at random, you can’t tell what would have happened anyway.","blind":"Blind both participants and assessors, so nobody’s expectations can sway the results."}}],"blocks":[{"title":"What the ladder shows","html":"\u003cp>A \u003cstrong>scary relative number\u003c/strong> can mean a \u003cstrong>small absolute change\u003c/strong>. \u003cstrong>Evidence strength\u003c/strong> and \u003cstrong>risk size\u003c/strong> are different questions. And only \u003cstrong>fair tests\u003c/strong> show cause.\u003c/p>\u003cp>At the population level, the Canadian Cancer Society estimates that a share of cancer cases is linked to things people can change, such as tobacco, alcohol, eating and activity patterns (Canadian Cancer Society, n.d.). That’s about large groups. For any one person, cancer has many causes, including genes, age and chance.\u003c/p>\u003cp class=\"tiny muted\">For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}]},"part3":{"slug":"headlines","name":"Headlines","heading":"Headline vs study","intro":"Compare what a headline says with what the study actually did. Tap the words that \u003cstrong>overstate\u003c/strong> the study, then fix the headline.","stations":[{"id":"s1","t":"1. Three pairs"},{"id":"s2","t":"2. A real example"},{"id":"s3","t":"3. During treatment"}],"tag":"Practice model (fictional)","pairs":[{"id":"h1","words":["Coffee","CURES","liver","cancer"],"design":"Observational","study":"An observational study compared liver cancer rates. People who drank coffee had lower rates than people who didn’t. Nobody was assigned to drink coffee.","_a":"SBcQUUQaXD4CaE4WWkgSRwluP0k=","good":"“CURES” claims cause and cure from an association. An observational study can only show a link.","data":"Design: observational. What it can show: an association. What it can’t show: cause, or a cure.","sample":"Coffee drinkers had lower liver cancer rates in an observational study"},{"id":"h2","words":["Grilled","meat","as","deadly","as","smoking"],"design":"IARC classification note","study":"An expert panel placed processed meat in Group 1, the same group as tobacco smoking, because the evidence that it can cause colorectal cancer is strong. Groups rate the strength of the evidence; they don’t compare how big the risks are.","_a":"SBcQUUQaXD4AaE4WWkgSRwluUBgBFFM4Tg==","good":"“As deadly as” mixes up evidence strength with risk size. IARC groups rate how strong the evidence is, not how big the risk is. Processed meat and tobacco are both Group 1, but their risks differ hugely.","data":"Same group means equally strong evidence of a cause. Risk sizes can differ hugely (see Explore, prediction 1).","sample":"Processed meat is in the same evidence group as smoking, but its risk is much smaller"},{"id":"h3","words":["Sunleaf","tea","slashes","cancer","risk","25%!"],"design":"One observational study","study":"One observational study of adults: 3 in 100 daily Sunleaf tea drinkers had cancer, compared with 4 in 100 non-drinkers. (Sunleaf tea is fictional.)","_a":"SBcQUUQaXD4BGVdpGRoJFUcXWG9oFEQIWkYRFg9DRFcRD0B4WlcNRVJBQkBdXUYTVkcAFEFXCV8TUQ1RRhgSDVYVEUBAXB9FQF0NQxVMDgATQQdVFVsHEEBQBhRUGAQMVBUGRlpIWUcfF1cWDxoqClxeQlVBGBINVhUMQVhaAxcTQQ1bDxgPFhMHVxEVWUYXVlkDQFxOA0VQXQNaUl1GCkEVA1oVWQQWXFkXQFAYCQtWCkBJSA==","good":"“Slashes” overstates one observational study, and “25%” gives only the relative change. In people, it’s 4 to 3 in 100: 1 fewer person per 100.","data":"4 → 3 in 100. Absolute change: 1 fewer per 100. Relative change: 1 ÷ 4 = 25% lower.","sample":"Sunleaf tea drinkers had somewhat lower cancer rates in one study (3 vs 4 in 100)"}],"station2":{"intro":"Your teacher will give you a real, credited headline and the study behind it (chosen because it’s a nutrition–cancer claim in the news with a linked study). Type them in, then use the same tools: tap the words that overstate the study, and write a fixed headline.","note":"Unscored. It goes into your results summary for your teacher."},"station3":{"skip":"If this station feels close to home, it’s okay to skip it or come back later.","effects":[{"id":"nausea","t":"Nausea","help":"Small, frequent meals and plain foods can be easier to keep down."},{"id":"taste","t":"Taste changes","help":"Foods may taste metallic or bland. Trying different flavours, herbs or cold foods can help."},{"id":"sores","t":"Mouth sores","help":"Soft, moist foods are easier. Spicy, crunchy or acidic foods can hurt."},{"id":"appetite","t":"Low appetite","help":"Small, frequent meals and snacks rich in energy and protein make each bite count."},{"id":"infection","t":"Higher infection risk","help":"Food safety matters more: clean, separate, cook, chill, and avoid higher-risk foods such as unpasteurized products and undercooked eggs and meat."}],"needs":"\u003cp>The body needs \u003cstrong>energy\u003c/strong> and \u003cstrong>protein\u003c/strong> to repair tissue and keep muscle during treatment, so these needs can \u003cstrong>rise\u003c/strong>, even when eating is hard. That’s why advice meant for preventing cancer (such as eating less) can be the wrong advice during treatment.\u003c/p>\u003cp>\u003cstrong>Registered dietitians\u003c/strong> on the care team individualize the plan for each person, including any questions about supplements.\u003c/p>","q":{"prompt":"Is “eat less to stay healthy” good advice during chemotherapy?","choices":[{"t":"Yes","fb":"Not quite. During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"14004","_k":"369398b4"},{"t":"No","fb":"Right. During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"15034","_k":"27ee9029"}]}},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Canadian Cancer Society. (n.d.). \u003ci>Reduce your risk\u003c/i>. Canadian Cancer Society.\u003c/li>\u003cli>International Agency for Research on Cancer. (2015). \u003ci>IARC Monographs evaluate consumption of red meat and processed meat\u003c/i> (Press Release No. 240). World Health Organization.\u003c/li>\u003cli>Omenn, G. S., Goodman, G. E., Thornquist, M. D., Balmes, J., Cullen, M. R., Glass, A., Keogh, J. P., Meyskens, F. L., Valanis, B., Williams, J. H., Barnhart, S., &amp; Hammar, S. (1996). Effects of a combination of beta carotene and vitamin A on lung cancer and cardiovascular disease. \u003ci>New England Journal of Medicine, 334\u003c/i>(18), 1150–1155.\u003c/li>\u003cli>The Alpha-Tocopherol, Beta Carotene Cancer Prevention Study Group. (1994). The effect of vitamin E and beta carotene on the incidence of lung cancer and other cancers in male smokers. \u003ci>New England Journal of Medicine, 330\u003c/i>(15), 1029–1035.\u003c/li>\u003cli>World Cancer Research Fund &amp; American Institute for Cancer Research. (2018). \u003ci>Diet, nutrition, physical activity and cancer: A global perspective\u003c/i> (Continuous Update Project Expert Report).\u003c/li>\u003c/ul>\u003cp class=\"tiny muted\">For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}],"quickCheck":{"title":"Headlines quick check","summary":"Headlines quick check","items":[{"id":"q1","goal":2,"prompt":"“Linked to” in an observational study means…","choices":[{"t":"an association","fb":"Right. An observational study shows an association, not cause.","_n":"16024","_k":"929ab1f7"},{"t":"cure","fb":"People who eat more of a food may differ in many ways. A trial tests cause.","_n":"17054","_k":"605f9422"},{"t":"proven cause","fb":"People who eat more of a food may differ in many ways. A trial tests cause.","_n":"18044","_k":"1b1ba08c"},{"t":"no effect","fb":"People who eat more of a food may differ in many ways. A trial tests cause.","_n":"19074","_k":"9efd83ee"}]},{"id":"q2","goal":3,"prompt":"Baseline 4 in 100, relative drop 25%. New risk?","choices":[{"t":"3 in 100","fb":"Right. 4 × 0.25 = 1 fewer, so 3 in 100.","_n":"1a064","_k":"ad41c9ac"},{"t":"25 in 100","fb":"4 × 0.25 = 1 fewer.","_n":"1bf94","_k":"3e4225d9"},{"t":"2 in 100","fb":"4 × 0.25 = 1 fewer.","_n":"1cf84","_k":"4daaae75"},{"t":"1 in 100","fb":"4 × 0.25 = 1 fewer.","_n":"1dfb4","_k":"8016d12c"}]},{"id":"q3","goal":4,"prompt":"During cancer treatment, which matters more than usual?","choices":[{"t":"fasting","fb":"During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"1efc4","_k":"9d6cfdd8"},{"t":"avoiding all fat","fb":"During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"1ff94","_k":"73ebfa65"},{"t":"food safety and enough energy and protein","fb":"Right. During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"1gfa4","_k":"6c69840b"},{"t":"cutting calories","fb":"During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"1hf74","_k":"120a55bd"}]},{"id":"q4","goal":5,"prompt":"Which headline is most accurate?","choices":[{"t":"“Fibre cures cancer”","fb":"Patterns over years matter; no single food causes or cures cancer.","_n":"1if84","_k":"0d74e8df"},{"t":"“Fibre is useless”","fb":"Patterns over years matter; no single food causes or cures cancer.","_n":"1jf54","_k":"1c98386d"},{"t":"“Eat fibre or get cancer”","fb":"Patterns over years matter; no single food causes or cures cancer.","_n":"1kf64","_k":"f25985f3"},{"t":"“Fibre linked to lower colorectal cancer risk in large studies”","fb":"Right. It reports a link, names the evidence and doesn’t overstate.","_n":"1l034","_k":"a3ed8fcc"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Supported, mixed or not supported?","summary":"Supported or not","noun":"claim","txt":true,"goal":[1,4,5],"instruction":"Sort each claim by how well the evidence supports it.","boxes":[{"id":"b1","label":"Well supported"},{"id":"b2","label":"Mixed or limited evidence"},{"id":"b3","label":"Not supported or contradicted"}],"items":[{"id":"s1","goal":1,"t":"Processed meat is linked to higher colorectal cancer risk","_a":"EVdTFg==","why":"Expert reviews (IARC, 2015; WCRF/AICR, 2018) conclude this.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Well supported."],"wrong":{"b2":"Expert reviews conclude this. IARC groups rate how strong the evidence is, not how big the risk is. Processed meat and tobacco are both Group 1, but their risks differ hugely.","b3":"Expert reviews conclude this. IARC groups rate how strong the evidence is, not how big the risk is. Processed meat and tobacco are both Group 1, but their risks differ hugely."}},{"id":"s2","goal":1,"t":"Alcohol is linked to several cancers","_a":"EVdTFg==","why":"IARC and WCRF/AICR reviews both conclude this.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Well supported."],"wrong":{"b2":"IARC and WCRF/AICR reviews both conclude this.","b3":"IARC and WCRF/AICR reviews both conclude this."}},{"id":"s3","goal":1,"t":"Fibre-rich and whole-grain eating patterns are linked to lower colorectal cancer risk","_a":"EVdTFg==","why":"Expert reviews rate this link as strong for colorectal cancer.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Well supported."],"wrong":{"b2":"Expert reviews rate this link as strong for colorectal cancer.","b3":"Expert reviews rate this link as strong for colorectal cancer."}},{"id":"s4","goal":5,"t":"A specific “superfood” berry prevents cancer","_a":"EVdRFg==","why":"No single food prevents cancer, and “superfood” claims rest on lab or animal studies at best.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Not supported or contradicted."],"wrong":{"b1":"Patterns over years matter; no single food causes or cures cancer. “Natural” isn’t proof that something is safe or works. High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","b2":"Patterns over years matter; no single food causes or cures cancer. “Natural” isn’t proof that something is safe or works. High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked."}},{"id":"s5","goal":5,"t":"High-dose beta-carotene supplements protect people who smoke","_a":"EVdRFg==","why":"Trials found the opposite: risk went up.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Not supported or contradicted."],"wrong":{"b1":"Trials found the opposite. High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","b2":"Trials found the opposite. High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked."}},{"id":"s6","goal":1,"t":"Red meat is probably linked to colorectal cancer","_a":"EVdTFg==","why":"Reviews rate red meat as a probable cause (Group 2A), so it counts as well supported, as “probable”.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Well supported. (as “probable”)"],"wrong":{"b2":"Reviews rate it probable (Group 2A).","b3":"Reviews rate it probable (Group 2A)."}},{"id":"s7","goal":5,"t":"Sugar directly “feeds” cancer, so cutting all sugar cures it","_a":"EVdRFg==","why":"No single food or nutrient causes or cures cancer.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Not supported or contradicted."],"wrong":{"b1":"Patterns over years matter; no single food causes or cures cancer.","b2":"Patterns over years matter; no single food causes or cures cancer."}},{"id":"s8","goal":1,"t":"Coffee is linked to lower risk of some cancers","_a":"EVdQFg==","why":"Some observational links; not established as a cause.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Mixed or limited evidence."],"wrong":{"b1":"Some observational links; not established as a cause.","b3":"Some observational links; not established as a cause."}},{"id":"s9","goal":5,"t":"Alkaline diets change blood pH to prevent cancer","_a":"EVdRFg==","why":"The body tightly controls blood pH, whatever you eat.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Not supported or contradicted."],"wrong":{"b1":"The body tightly controls blood pH.","b2":"The body tightly controls blood pH."}},{"id":"s10","goal":4,"t":"People in treatment often need more protein and energy","_a":"EVdTFg==","why":"Needs for energy and protein can rise during treatment.","hints":["What rung does its evidence reach?","Expert reviews → well supported; one study → limited; contradicted by trials → not supported.","Well supported."],"wrong":{"b2":"During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","b3":"During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this."}}]},{"id":"risk","type":"custom","title":"Risk arithmetic and study critique","summary":"Risk arithmetic and critique","star":true,"goal":[2,3,5],"instruction":"Work out the risks, then critique the studies. Items 3 to 6 are non-routine (★).","items":[{"id":"k1","kind":"num","goal":3,"prompt":"Baseline 10 in 100, +20% relative. New risk?","label":"New risk:","unit":"in 100","_a":"Agc=","why":"10 × 0.2 = 2 more, so 12 in 100.","wrong":[{"match":30,"fb":"20% of 10 is 2."},{"match":2,"fb":"That’s the change. Add it to the baseline."}],"general":"20% of 10 is 2.","hints":["Find 20% of the baseline first.","20% of 10 is 2. It’s an increase, so add it.","10 + 2 = 12 in 100."]},{"id":"k2","kind":"num","goal":3,"prompt":"Baseline 20 in 100, −25%. New risk?","label":"New risk:","unit":"in 100","_a":"AgA=","why":"20 × 0.25 = 5 fewer, so 15 in 100.","wrong":[],"general":"25% of 20 is 5.","hints":["Find 25% of 20.","25% of 20 is 5. It’s a decrease, so subtract.","20 − 5 = 15 in 100."]},{"id":"k3","kind":"num","goal":3,"star":true,"prompt":"Two headlines about the same study: “Risk up 50%!” and “Risk up 1 in 100”. What baseline makes both true?","label":"Baseline:","unit":"in 100","_a":"AQ==","why":"2 × 0.5 = 1, so a baseline of 2 in 100 rising to 3 in 100 is both +50% and +1 in 100.","wrong":[],"general":"Absolute = baseline × 0.5 = 1.","hints":["Absolute change = baseline × relative change.","baseline × 0.5 = 1.","Baseline = 2 in 100."]},{"id":"k4","kind":"pick1","goal":2,"star":true,"inquiry":true,"prompt":"Study: people who ate the most fruit had less lung cancer. Name a confounder that could explain it.","options":[{"id":"smoking","t":"Smoking","why":"Smokers may eat less fruit, and smoking is a major cause of lung cancer."},{"id":"income","t":"Income","why":"Income can shape both how much fruit people buy and many other health factors."},{"id":"exercise","t":"Exercise","why":"People who eat more fruit may also exercise more."},{"id":"lung","t":"Lung cancer","why":"That’s the outcome being measured, not another difference between the groups."},{"id":"fruit","t":"Fruit","why":"That’s the food being studied, not another difference between the groups."},{"id":"size","t":"The number of people in the study","why":"Study size affects precision, but it isn’t a difference between the groups."}],"_a":"aBcRWVpTDwtUF04WXFYFCl5QQBgXXR4AQVYLR1AaOw==","wrongLead":"People who eat more of a food may differ in many ways. A trial tests cause.","hints":["A confounder is another difference between the groups that could also affect lung cancer.","Think of habits or circumstances that go with eating less fruit and also affect the lungs or health.","Smoking (also income or exercise)."]},{"id":"k5","kind":"num2","goal":3,"star":true,"prompt":"A trial: 100 people take supplement X, 100 take a placebo. Cancers over 5 years: 6 vs 4. Relative change and absolute change for X?","fields":[{"id":"rel","label":"Relative change:","unit":"%"},{"id":"abs","label":"Absolute change:","unit":"in 100"}],"_a":"SBcQUVkaXFADGUBVV0tEXwFI","why":"6 vs 4: 2 more per 100; 2 ÷ 4 = 50%.","general":"6 vs 4: 2 more per 100; 2 ÷ 4 = 50%.","wrongRel":[{"match":33,"fb":"Divide by the comparison (placebo) group: 2 ÷ 4, not 2 ÷ 6."},{"match":2,"fb":"2 is the absolute change. For the relative change, divide 2 by the placebo group’s 4."}],"hints":["Subtract for absolute.","Divide the difference by the comparison group.","+2 in 100; +50%."]},{"id":"k6","kind":"pick2","goal":5,"star":true,"prompt":"An ad cites a mouse study to say its pill “fights cancer in humans”. Write the two biggest problems (choose two).","options":[{"id":"mice","t":"Mice aren’t people","why":"Animal evidence sits on rung 2."},{"id":"trial","t":"There’s no human trial","why":"Only a trial in people could test the claim."},{"id":"seller","t":"It’s seller-funded: the company profits from the claim","why":"A conflict of interest is a reason for extra caution."},{"id":"fights","t":"“Fights” overstates","why":"A mouse result can’t show anything “fights cancer in humans”."},{"id":"capsule","t":"The pill is a capsule, not a food","why":"The form of the pill isn’t the problem with the evidence."},{"id":"useless","t":"Mouse studies are useless for research","why":"Mouse studies can guide research; they just can’t show effects in people."}],"_a":"aBcPXVZdREkRQRBdVFRESRFGB1hZXRRHHxcEXVJQEhYRaA==","general":"Any two of the first three earn full credit; “fights” counts with one other.","hints":["Ask: what was studied, and who is making the claim?","Think about rung 2, the missing human evidence, who profits, and the wording.","For example: mice aren’t people, and there’s no human trial."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Maeve","goal":[2,3,4],"instruction":"Maeve made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":3,"task":"Explain the headline “Processed meat raises colorectal cancer risk 18%”.","steps":["“18% is a relative increase.”","“So 18 out of every 100 people who eat it will get cancer.”","“That’s why it’s as dangerous as smoking.”"],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 builds on an earlier mistake. Find where the mistake starts."],"fixes":[{"t":"“On a 5-in-100 baseline (model), 18% more is about 6 in 100: roughly 1 extra person per 100.”","why":"An 18% higher relative risk on a 5-in-100 baseline is about 6 in 100.","_n":"1m044","_k":"72b981ce"},{"t":"“Step 2 is correct.”","why":"An 18% higher relative risk on a 5-in-100 baseline is about 6 in 100.","_n":"1n754","_k":"0c70991a"},{"t":"“It means 18 grams is the limit.”","why":"Not what the number means.","_n":"1o744","_k":"3a964d22"},{"t":"“18 in 100 is correct.”","why":"That confuses relative with absolute.","_n":"1p734","_k":"3e42b93e"}],"hints":["Relative to what?","To the baseline.","Multiply the baseline by 0.18."]},{"id":"e2","goal":2,"task":"Evaluate: “Green tea shrinks tumours.”","steps":["“The source is a study in mice.”","“Mouse studies are randomized and controlled, so they prove it works in people.”","“So everyone should drink green tea to prevent cancer.”"],"_a":"Ag==","stepFb":["Step 1 is correct: the source is a mouse study. Keep checking.","","Step 3 builds on an earlier mistake. Find where the mistake starts."],"fixes":[{"t":"“Step 2 is correct.”","why":"Animal evidence sits on rung 2.","_n":"1q724","_k":"623d4546"},{"t":"“Tea is natural, so it’s safe.”","why":"“Natural” isn’t proof that something is safe or works. High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","_n":"1r794","_k":"9ac925c2"},{"t":"“Mice are just small people.”","why":"Biology differs.","_n":"1s784","_k":"80eccc8a"},{"t":"“Mouse results can guide research but don’t show effects in people; human trials are needed.”","why":"Animal evidence sits on rung 2. It points researchers to what to test in people.","_n":"1t774","_k":"f9645761"}],"hints":["Which rung?","Rung 2.","Needs human trials."]},{"id":"e3","goal":4,"task":"Advise a friend’s parent starting chemotherapy who has lost their appetite.","steps":["“Treatment can cause nausea and taste changes.”","“So they should eat less and cut fat to stay healthy.”","“A dietitian isn’t needed.”"],"_a":"Ag==","stepFb":["Step 1 is correct: nausea and taste changes are common. Keep checking.","","Step 3 builds on an earlier mistake. Find where the mistake starts."],"fixes":[{"t":"“Step 2 is correct.”","why":"During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"1u764","_k":"b27da0d6"},{"t":"“Take high-dose supplements.”","why":"Some can interfere with treatment; ask the care team.","_n":"1v7d4","_k":"d02d142b"},{"t":"“Fast until treatment ends.”","why":"Risky.","_n":"1w7c4","_k":"0297af65"},{"t":"“Needs for energy and protein often rise; small, frequent meals and food safety help, and the care team’s registered dietitian can individualize a plan.”","why":"During treatment, needs can rise (energy, protein) and food safety matters more. A dietitian individualizes this.","_n":"1x6f4","_k":"85b8b4ff"}],"hints":["Is prevention advice the same as treatment needs?","No.","Energy and protein; dietitian."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result surprised you most: the beta-carotene trials, or how a big relative risk can be a small absolute one?"},{"id":"j2","q":"In your own words, explain why an IARC group isn’t a measure of how dangerous something is."},{"id":"j3","q":"Explain to a friend how to check a “superfood fights cancer” post in under a minute."},{"id":"j4","q":"What’s still confusing about nutrition and cancer? Where could you look for trustworthy information?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which eating-related factor do expert reviews link most strongly to \u003cstrong>higher\u003c/strong> colorectal cancer risk?","options":[{"t":"Water","why":"No link.","_n":"1y704","_k":"28b79c54"},{"t":"Processed meat","why":"Expert reviews (IARC, 2015) classify processed meat as a cause of colorectal cancer.","_n":"1z714","_k":"f5390d35"},{"t":"Leafy greens","why":"Not linked to higher risk.","_n":"20724","_k":"e689342e"},{"t":"Whole grains","why":"Linked to lower risk.","_n":"21734","_k":"a9b80986"}]},"b":{"prompt":"Which pattern is linked to \u003cstrong>lower\u003c/strong> colorectal cancer risk?","options":[{"t":"High-dose beta-carotene supplements","why":"High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","_n":"22744","_k":"6f13b9ae"},{"t":"High processed-meat intake","why":"Linked to higher risk.","_n":"23754","_k":"972a1ab6"},{"t":"Fibre-rich, whole-grain eating","why":"Expert reviews link fibre and whole grains to lower colorectal cancer risk.","_n":"24764","_k":"d359daf1"},{"t":"High alcohol intake","why":"Linked to higher risk.","_n":"25774","_k":"1fb4a036"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What does an IARC Group 1 classification mean?","options":[{"t":"There is strong evidence the agent can cause cancer in humans","why":"Group 1 describes the strength of the evidence, not the size of the risk.","_n":"26784","_k":"6a1e6841"},{"t":"The agent is as dangerous as every other Group 1 agent","why":"IARC groups rate how strong the evidence is, not how big the risk is. Processed meat and tobacco are both Group 1, but their risks differ hugely.","_n":"27896","_k":"0e466bc5"},{"t":"The agent is safe in small amounts","why":"Not what the group says.","_n":"28886","_k":"92488da3"},{"t":"The agent always causes cancer","why":"Not always: it’s about the evidence of a cause.","_n":"298b6","_k":"fef28654"}]},"b":{"prompt":"Two agents are both Group 1. What can you conclude?","options":[{"t":"Only one can be Group 1","why":"Many agents are.","_n":"2a8a6","_k":"863ab2bb"},{"t":"They carry the same risk","why":"IARC groups rate how strong the evidence is, not how big the risk is. Processed meat and tobacco are both Group 1, but their risks differ hugely.","_n":"2b856","_k":"3aeecef8"},{"t":"Both have strong evidence of causing cancer; their risk sizes may differ greatly","why":"IARC groups rate how strong the evidence is, not how big the risk is. Processed meat and tobacco are both Group 1, but their risks differ hugely.","_n":"2c846","_k":"886f7a63"},{"t":"Neither is a real risk","why":"Wrong: Group 1 means strong evidence of a cause.","_n":"2d876","_k":"1399a964"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"What did large trials of high-dose beta-carotene supplements find in people who smoked?","options":[{"t":"Lower lung cancer rates","why":"High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","_n":"2e866","_k":"855eb90c"},{"t":"Higher lung cancer rates in the supplement groups","why":"High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","_n":"2f816","_k":"d1755d7b"},{"t":"The trials weren’t completed","why":"They were.","_n":"2g806","_k":"61f02f90"},{"t":"No difference at all","why":"There was a difference.","_n":"2h836","_k":"e256d46c"}]},"b":{"prompt":"What’s the main lesson of the beta-carotene trials?","options":[{"t":"Observational studies are always right","why":"People who eat more of a food may differ in many ways. A trial tests cause.","_n":"2i846","_k":"04230f8a"},{"t":"Vegetables cause cancer","why":"No: the trials studied high-dose supplements, not foods.","_n":"2j816","_k":"b865004c"},{"t":"High-dose supplements can have unexpected harms; trials are needed","why":"The expected benefit didn’t appear, and only trials revealed the harm.","_n":"2k826","_k":"48d05b59"},{"t":"Natural means safe","why":"High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","_n":"2l876","_k":"eb3706dc"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Baseline risk 5 in 100. A food is linked to a 40% higher relative risk. New absolute risk?","options":[{"t":"7 in 100","why":"5 × 0.4 = 2 more.","_n":"2m886","_k":"731c8395"},{"t":"45 in 100","why":"That reads the relative change as an absolute one. An 18% higher relative risk on a 5-in-100 baseline is about 6 in 100.","_n":"2n856","_k":"a8ab413c"},{"t":"5.4 in 100","why":"That’s a 0.4 increase, not 40%.","_n":"2o866","_k":"24cb7986"},{"t":"40 in 100","why":"That reads the relative change as an absolute one. An 18% higher relative risk on a 5-in-100 baseline is about 6 in 100.","_n":"2p7b6","_k":"aee9a8b0"}]},"b":{"prompt":"Baseline 20 in 100, a 10% lower relative risk. New risk?","options":[{"t":"2 in 100","why":"That’s the change, not the new risk.","_n":"2q7c6","_k":"06251968"},{"t":"18 in 100","why":"20 × 0.1 = 2 fewer.","_n":"2r07c","_k":"00ba9e86"},{"t":"19.9 in 100","why":"10% of 20 is 2.","_n":"2s08c","_k":"b99c457b"},{"t":"10 in 100","why":"That reads the relative change as an absolute one. An 18% higher relative risk on a 5-in-100 baseline is about 6 in 100.","_n":"2t05c","_k":"d124538d"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Trial: 4 cancers per 100 with placebo, 6 per 100 with supplement Y. Which statement is correct?","options":[{"t":"6% absolute increase","why":"6 − 4 = 2 per 100.","_n":"2u06c","_k":"372c0e23"},{"t":"2% relative increase","why":"2 ÷ 4 = 50%.","_n":"2v03c","_k":"459fdf39"},{"t":"Y lowered risk","why":"6 > 4.","_n":"2w04c","_k":"6521d453"},{"t":"Y was linked to 2 more cases per 100, a 50% relative increase","why":"6 − 4 = 2 more per 100; 2 ÷ 4 = 50%.","_n":"2x01c","_k":"c8d02a42"}]},"b":{"prompt":"Trial: 10 per 100 in usual care, 8 per 100 with a diet program. Correct statement?","options":[{"t":"2 fewer per 100; a 20% relative decrease","why":"10 − 8 = 2 fewer; 2 ÷ 10 = 20%.","_n":"2y02c","_k":"90ec6618"},{"t":"2% relative","why":"2 ÷ 10 = 20%.","_n":"2z0fc","_k":"34bae9d0"},{"t":"No change","why":"10 ≠ 8.","_n":"3010c","_k":"d447ff64"},{"t":"8% decrease","why":"That’s the new rate.","_n":"310dc","_k":"8bd6c37a"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Which design best tests whether a fibre supplement lowers a colorectal cancer-risk marker?","options":[{"t":"Ask a nutrition influencer","why":"Rung 1.","_n":"320cc","_k":"52286fee"},{"t":"Give the supplement to mice","why":"Rung 2 only.","_n":"330fc","_k":"f84fd04a"},{"t":"Randomly assign adults to the supplement or a placebo  grains and legumes; limit processed meat; avoid alcohol for youth.”","why":"It matches the patterns expert reviews support, not single foods.","_n":"3y7ec","_k":"c1efb17d"},{"t":"“Buy our antioxidant supplement.”","why":"“Natural” isn’t proof that something is safe or works. High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","_n":"3z83c","_k":"843fb3de"},{"t":"“Cut out all sugar to starve cancer.”","why":"Patterns over years matter; no single food causes or cures cancer.","_n":"4084c","_k":"55bea22a"},{"t":"“Superfood X prevents cancer.”","why":"Patterns over years matter; no single food causes or cures cancer.","_n":"4181c","_k":"1a0d6f4e"}]},"b":{"prompt":"An influencer says a cleanse “detoxes cancer”. What’s the best response?","options":[{"t":"Assume it works if many people like the post","why":"Popularity isn’t evidence.","_n":"4282c","_k":"cfaea046"},{"t":"Check the evidence rung: testimonial only; there’s no human trial; the body’s liver and kidneys already clear waste","why":"A testimonial sits on rung 1.","_n":"4387c","_k":"0fea2665"},{"t":"Try it, since it’s natural","why":"“Natural” isn’t proof that something is safe or works. High-dose beta-carotene supplements raised lung cancer risk in trials among people who smoked.","_n":"4488c","_k":"14824762"},{"t":"Share it to be safe","why":"Spreads misinformation.","_n":"4585d","_k":"97c5ac37"}]}}]},"task":{"title":"Fix the headline","summary":"Fix the headline","statement":"\u003cp>A fictional study followed adults for 10 years. Those who drank Sunleaf tea daily had a cancer rate of 3 in 100; non-drinkers had 4 in 100 (observational; model values). Build a corrected headline from chips that meets every condition. There’s more than one good answer.\u003c/p>\u003cp class=\"tiny muted\">Sunleaf tea is a practice model. Choose one chip in each slot.\u003c/p>","template":"Daily Sunleaf tea [verb] cancer risk [number] [study]","slots":[{"id":"v","t":"Verb","options":[{"id
