<script>window.MV_PAYLOAD={"meta":{"id":"12-type-2-diabetes","nn":"12","slug":"type-2-diabetes","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 3","groupName":"Nutrition, Health and Disease","trivium":"","size":"M","storageKey":"hfa4u-12-type-2-diabetes-v1","progressKey":"hfa4u-progress-v1:12-type-2-diabetes","toolkit":"1.0.7"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"0bd34df5","content":{"id":"12-type-2-diabetes","kind":"topic","title":"Type 2 diabetes","topic":"Type 2 Diabetes","readyTopic":"type 2 diabetes","hero":{"headline":"When the key sticks in the lock","text":"After a meal, \u003cstrong>insulin\u003c/strong> signals cells to take up \u003cstrong>glucose\u003c/strong>. In \u003cstrong>type 2 diabetes\u003c/strong>, cells respond less (\u003cstrong>insulin resistance\u003c/strong>) and the pancreas eventually can’t keep up. What’s on the plate, how it’s eaten and how we move all change the glucose curve, and so do genes and the conditions people live in.","fig":{"html":"\u003cdiv class=\"dm-hero\" id=\"dm-hero\">\u003c/div>","caption":""},"aria":"A plate, half vegetables, a quarter roti and a quarter dal, is eaten. Two panels follow. Typical response: glucose dots enter the blood and a small glucose curve rises; insulin keys reach the cell’s locks, the keys turn, the gates open, glucose moves into the cell and the curve returns to its starting level. Insulin resistance: the locks are stiff, more keys crowd in, only one gate opens, most glucose stays in the blood, and the curve rises higher and stays up longer.","caption":"Same plate, different response: in insulin resistance the key sticks in the lock."},"goals":["I can explain how insulin resistance leads to type 2 diabetes, and how it differs from type 1.","I can explain how meal composition and activity change the blood-glucose response after eating.","I can assess how genetics, age, family history and social conditions combine in type 2 diabetes risk, using respectful, accurate language.","I can plan a meal using the plate method that respects a person’s cultural food traditions.","I can interpret evidence from prevention trials and evaluate community prevention programs."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"},{"title":"Before you start","html":"\u003cp>Diabetes is part of many families’ lives. This module uses \u003cstrong>fictional personas\u003c/strong> and \u003cstrong>teaching-model numbers\u003c/strong>; you never enter your own health information. Nobody is to blame for a health condition, and no food here is “good” or “bad”. Health information here is general, not advice for any particular person. For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Carbohydrate and fibre","goal":2,"prompt":"Which food has the most fibre per serving?","options":[{"t":"A cup of cooked lentils","why":"Legumes are among the highest-fibre foods.","_n":"0259","_k":"42dba942"},{"t":"A cup of white rice","why":"Refined grains lose most fibre.","_n":"1249","_k":"9ca1d099"},{"t":"A glass of orange juice","why":"Juice loses the fibre of whole fruit.","_n":"2239","_k":"8aa847b9"},{"t":"A slice of white bread","why":"Refined flour has little fibre.","_n":"3229","_k":"8ec50cfd"}],"hints":["Fibre comes from plant parts like hulls and skins.","Legumes and whole grains lead.","Lentils."]},{"id":"w2","skill":"Carbohydrate and fibre","goal":2,"prompt":"Starch is digested into…","options":[{"t":"Fatty acids","why":"Those come from fat.","_n":"4219","_k":"f8a02675"},{"t":"Glucose","why":"Starch is a chain of glucose units.","_n":"5209","_k":"c7ec174e"},{"t":"Fibre","why":"Fibre isn’t digested by human enzymes.","_n":"61f9","_k":"9602ca31"},{"t":"Amino acids","why":"Those come from protein.","_n":"72e9","_k":"47b05fde"}],"hints":["Starch is a polysaccharide.","Made of which sugar?","Glucose."]},{"id":"w3","skill":"Digestion and glucose","goal":2,"prompt":"Where is most glucose absorbed into the blood?","options":[{"t":"The large intestine","why":"Mostly water and fermentation there.","_n":"82d9","_k":"baa26360"},{"t":"The stomach","why":"Little absorption happens there.","_n":"9281","_k":"004acd4d"},{"t":"The liver","why":"The liver stores and releases glucose; it doesn’t absorb it from food.","_n":"a291","_k":"5948e848"},{"t":"The small intestine","why":"Through the villi.","_n":"b261","_k":"ad2f5d23"}],"hints":["Module 04.","The organ with villi.","Small intestine."]},{"id":"w4","skill":"Digestion and glucose","goal":2,"prompt":"Which meal is likely to raise blood glucose more slowly?","options":[{"t":"All meals raise glucose at the same speed","why":"Composition changes speed.","_n":"c271","_k":"3b40bd2c"},{"t":"A sugary drink","why":"Liquid sugar is absorbed fastest.","_n":"d2c1","_k":"4bbf1493"},{"t":"Whole-grain roti with dal and vegetables","why":"Fibre, protein and fat slow digestion.","_n":"e2d1","_k":"09b7d0f2"},{"t":"White bread with jam","why":"Refined starch plus sugar digests quickly.","_n":"f2a1","_k":"d4499a13"}],"hints":["What slows digestion?","Fibre and protein.","The roti, dal and vegetables."]},{"id":"w5","skill":"Diabetes basics","goal":1,"prompt":"Which organ makes insulin?","options":[{"t":"The liver","why":"The liver responds to insulin.","_n":"g2b1","_k":"571503a1"},{"t":"The stomach","why":"It digests protein.","_n":"h301","_k":"1e12c88f"},{"t":"The kidneys","why":"They filter blood.","_n":"i311","_k":"d7532307"},{"t":"The pancreas","why":"Beta cells in the islets.","_n":"jc21","_k":"bdc9f3f0"}],"hints":["Islets of …","Langerhans.","Pancreas."]},{"id":"w6","skill":"Diabetes basics","goal":1,"prompt":"Which statement about type 2 diabetes is accurate?","options":[{"t":"It’s caused only by eating sugar","why":"Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns.","_n":"kc11","_k":"0b89d8ed"},{"t":"It develops from insulin resistance and reduced insulin production, shaped by many factors","why":"Several factors combine: insulin resistance comes first, and the insulin supply weakens later.","_n":"lc01","_k":"b9c87228"},{"t":"It’s the same as type 1","why":"Type 1: the immune system destroys beta cells. Type 2: cells resist insulin and the pancreas can’t keep up.","_n":"mbf1","_k":"da26b0f3"},{"t":"It only affects older adults","why":"It’s increasingly diagnosed in younger people too.","_n":"nbe1","_k":"65ef987f"}],"hints":["Is there just one cause?","Think of insulin’s job.","It develops from insulin resistance and reduced insulin production, shaped by many factors."]}],"refreshers":{"Carbohydrate and fibre":"Starches and sugars become glucose; fibre isn’t digested and slows the rise.","Digestion and glucose":"Glucose is absorbed in the small intestine; fibre, protein and fat slow the rise.","Diabetes basics":"Insulin from the pancreas lets cells take up glucose. Type 1: beta cells destroyed. Type 2: resistance plus a weakening supply."}}},"explore":{"heading":"Blood glucose model","intro":"Choose a fictional persona, a meal and what happens after eating. Watch the glucose curve. \u003cstrong>Teaching-model values: not clinical targets.\u003c/strong>","modes":[{"id":"curves","t":"Meal curves"},{"id":"cell","t":"Inside the cell"},{"id":"risk","t":"Risk map"}],"personas":[{"id":"typ","t":"Mei-Ling, 34","kind":"typical response","fast":5,"factor":1,"back":2,"insulin":"The pancreas releases insulin, cells respond well, and glucose moves into cells."},{"id":"ir","t":"Ahmad, 47","kind":"insulin resistance","fast":6,"factor":1.5,"back":3,"insulin":"Cells respond less to insulin, so the pancreas makes extra to keep glucose in range, for now."},{"id":"t2","t":"Raj, 52","kind":"type 2 diabetes","fast":8,"factor":2,"back":4,"insulin":"The pancreas makes insulin, but cells respond weakly and the supply can’t keep up."}],"meals":[{"id":"high","t":"High-GI: white bread, jam, juice","short":"high-GI meal","base":4},{"id":"med","t":"Medium: rice with curry","short":"medium meal","base":3},{"id":"low","t":"Lower-GI mixed: whole-grain roti, dal, vegetables","short":"lower-GI mixed meal","base":2}],"tweak":"Add vegetables and protein to the plate.","walk":"15-minute walk.","rows":{"now":"Now showing","fast":"Fasting start","peak":"Peak","rise":"Rise","back":"Back to start in","insulin":"Insulin response","remind":"Reminder"},"reminder":"Teaching model, not clinical targets.","about":{"title":"About this model","rules":["\u003cstrong>Fasting start:\u003c/strong> typical 5.0, insulin resistance 6.0, type 2 8.0 mmol/L.","\u003cstrong>Meal base rise:\u003c/strong> high-GI 4, medium 3, lower-GI 2.","\u003cstrong>Tweak:\u003c/strong> −1 to the meal base (never below 1).","\u003cstrong>Walk:\u003c/strong> −1 after the tweak; the rise never goes below 0.","\u003cstrong>Response factor:\u003c/strong> typical ×1, insulin resistance ×1.5, type 2 ×2.","\u003cstrong>Peak\u003c/strong> = fasting + (adjusted base × factor). \u003cstrong>Time back to start\u003c/strong> = 2, 3 or 4 hours by persona."],"note":"These are teaching-model values for fictional personas. Real targets are set with a health professional."},"cell":{"steps":["Insulin binds its receptor.","A signal moves glucose transporters to the membrane.","Glucose enters.","In resistance, the signal is weaker, so fewer transporters move and more insulin is needed."],"contrastTitle":"Type 1 is different","contrast":"In type 1, no insulin is made: the immune system destroys the beta cells. It’s treated with insulin, not diet alone."},"risk":{"intro":"Tap a factor to see how it links to type 2 diabetes \u003cstrong>across populations\u003c/strong>. This map is not a personal risk calculator.","groups":[{"id":"bio","t":"Biology and history"},{"id":"day","t":"Daily patterns"},{"id":"soc","t":"Social conditions"}],"tags":{"fixed":"can’t be changed","mod":"can change, with support","soc":"can change through community action and policy"},"factors":[{"id":"age","t":"Age","g":"bio","k":"fixed","d":"Risk rises with age across populations, though type 2 is now diagnosed in younger people too."},{"id":"family","t":"Family history","g":"bio","k":"fixed","d":"Having a parent, brother or sister with type 2 raises risk. Families share genes, and often meals, neighbourhoods and living conditions too."},{"id":"genes","t":"Genetics","g":"bio","k":"fixed","d":"Many genes each nudge risk a little. Some populations carry gene variants that raise risk."},{"id":"gdm","t":"Past gestational diabetes","g":"bio","k":"fixed","d":"Diabetes during a pregnancy usually goes away after the birth, but it signals a higher risk of type 2 later. Regular check-ups help."},{"id":"pre","t":"Prediabetes","g":"bio","k":"mod","d":"Blood glucose higher than typical but below the diabetes range. In large trials, lifestyle programs delayed or prevented type 2 in people with prediabetes."},{"id":"act","t":"Activity","g":"day","k":"mod","d":"Working muscles take up glucose, and regular activity lowers risk across populations. Safe, affordable places to be active make it easier."},{"id":"eat","t":"Eating pattern","g":"day","k":"mod","d":"Patterns rich in vegetables, legumes, whole grains and fibre are linked to lower risk across populations. No single food causes type 2."},{"id":"income","t":"Income","g":"soc","k":"soc","d":"Lower household income is linked to higher rates. Income shapes food budgets, housing, time to cook and be active, and stress."},{"id":"access","t":"Food access","g":"soc","k":"soc","d":"Where affordable fresh food is hard to reach, protective eating patterns are harder to follow. That is a problem of the food environment, not of willpower."},{"id":"stress","t":"Stress","g":"soc","k":"soc","d":"Long-term stress, including from money worries and discrimination, affects hormones, sleep and eating, and is linked to higher risk."}],"why":{"t":"Why higher rates in some communities?","note":"This card talks about colonization and residential schools. Read it when you’re ready; you can come back to it later.","html":"\u003cp>Type 2 diabetes is more common in some communities in Canada, including many Indigenous communities and people of South Asian, African, Caribbean, Hispanic and East Asian descent (Diabetes Canada, 2018; Public Health Agency of Canada, 2011). Rates differ widely from one community to another. Two kinds of reasons combine:\u003c/p>\u003cul>\u003cli>\u003cstrong>Genetics:\u003c/strong> some populations carry gene variants that raise risk.\u003c/li>\u003cli>\u003cstrong>Social conditions:\u003c/strong> income, food access, housing and stress, which are shaped by history and policy.\u003c/li>\u003c/ul>\u003cp>For Indigenous peoples, colonization disrupted traditional food systems: land was taken, hunting, fishing and gathering were restricted, and children were sent to residential schools, away from their families, languages and traditional foods. These harms cut many families off from foods and knowledge that had kept communities healthy, and their effects continue today.\u003c/p>\u003cp>\u003cstrong>Higher rates are not a personal or cultural failing.\u003c/strong> Prevention works best when it is \u003cstrong>community-led and culturally grounded\u003c/strong>, like the programs in the next part. Module 20, Indigenous Food Sovereignty, goes deeper.\u003c/p>","help":"If this history affects you or your family, the Hope for Wellness Help Line offers support to Indigenous peoples across Canada, any time: \u003cspan class=\"nw\">1-855-242-3310\u003c/span>."},"caption":"Risk comes from many combined factors, shown here at the population level."},"predictions":[{"id":"p1","prompt":"High-GI meal, plain. Which persona has the highest peak?","options":[{"t":"Ahmad (insulin resistance)","_n":"obd1","_k":"846aedab"},{"t":"Mei-Ling (typical)","_n":"pbc1","_k":"36de27f7"},{"t":"All the same","_n":"qbb1","_k":"f8ae9693"},{"t":"Raj (type 2)","_n":"rba1","_k":"c28eefc4"}],"explain":"The response factor doubles the rise, and Raj also starts higher. The peaks are 16.0, 12.0 and 9.0 mmol/L."},{"id":"p2","prompt":"Mei-Ling, high-GI meal. With a 15-minute walk after eating, how much lower is her peak?","options":[{"t":"4.0","_n":"sb91","_k":"46fc5db6"},{"t":"0","_n":"tbc1","_k":"25650113"},{"t":"1.0 mmol/L","_n":"ubd1","_k":"2300e352"},{"t":"9.0","_n":"vbe1","_k":"44f88977"}],"explain":"Working muscles take up glucose. Her peak drops from 9.0 to 8.0 mmol/L. Muscles use glucose during activity, so even a short walk lowers the peak (in the model, by 1 mmol/L for the typical persona)."},{"id":"p3","prompt":"Inside the cell. In insulin resistance, what changes first?","options":[{"t":"Cells respond less to insulin, so the pancreas works harder","_n":"wbf1","_k":"0243e28a"},{"t":"The pancreas stops making insulin overnight","_n":"xb81","_k":"d307a4d4"},{"t":"Glucose can’t be absorbed from food","_n":"yb91","_k":"b8af2fd0"},{"t":"The stomach stops digesting starch","_n":"zba1","_k":"c754db4f"}],"explain":"Resistance comes first; the insulin supply weakens later. In the last step, the signal is weaker and fewer transporters reach the membrane."},{"id":"p4","prompt":"Raj. Lower-GI mixed meal instead of the high-GI meal. How much lower is the peak?","options":[{"t":"16.0","_n":"10bb1","_k":"5bca47a3"},{"t":"8.0","_n":"11b41","_k":"b103f4e0"},{"t":"0 (carbs are carbs)","_n":"12b51","_k":"7c73ed22"},{"t":"4.0 mmol/L","_n":"13b60","_k":"3dc5c258"}],"explain":"Fibre, protein and the type of starch change the curve; carbohydrate is still on the plate. His peak drops from 16.0 to 12.0 mmol/L. Carbohydrate stays on the plate: a quarter is starch. Type, amount and what it’s eaten with matter."}],"challenges":[{"id":"tc1","goal":2,"prompt":"Ahmad: find a setting with a peak of \u003cstrong>7.5 or lower\u003c/strong>.","why":"An adjusted base of 1 or less, times 1.5, keeps the rise to 1.5 or less: 6.0 + 1.5 = 7.5 mmol/L.","msgs":{"close":"Close. One more change.","who":"Choose Ahmad (insulin resistance) first.","high":"Ahmad’s peak is {v} mmol/L. It needs to be 7.5 or lower."},"hints":["Each change lowers the base by 1, then it’s multiplied by 1.5.","You need a rise of 1.5 or less, so an adjusted base of 1 or less.","For example, the lower-GI meal with a walk."]},{"id":"tc2","goal":2,"prompt":"Raj: show that a walk can matter as much as a meal tweak. Pin two curves for the \u003cstrong>same meal\u003c/strong>: one with only a walk, one with only the tweak. Their peaks should match.","why":"In this model, a short walk and adding vegetables and protein each lower Raj’s peak by 2 mmol/L. Small, doable changes count.","msgs":{"meal":"Keep the meal the same.","both":"One curve gets only the walk; the other gets only the tweak.","pins":"Pin two curves: set Raj, a meal and one change, press “Pin this curve”, then switch the change and pin again. ({n} pinned so far.)","who":"Both pinned curves need to be Raj’s.","pair":"One pinned curve needs only the walk, and the other only the tweak."},"hints":["Pin a curve, change one toggle, pin again.","Each change takes 1 off the base.","Any meal: walk-only vs tweak-only."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Raj grew up with rice and curry, and it’s at the centre of family meals. \u003cstrong>Keep the medium meal\u003c/strong> and bring his peak to \u003cstrong>10.0 or lower\u003c/strong>.","why":"A staple food can stay. Portion, plate balance and movement do the work.","msgs":{"low":"That works in the model, but the goal is to keep the meal that matters to him. Change \u003cem>how\u003c/em> it’s eaten instead.","one":"One more change.","who":"Choose Raj (type 2 diabetes) first.","lowHigh":"Keep the medium meal: rice with curry is the meal that matters to him. Change \u003cem>how\u003c/em> it’s eaten instead.","high":"Keep the medium meal: rice with curry is the meal that matters to him.","plain":"Raj’s peak is 14.0 mmol/L. Change how the meal is eaten: the tweak and the walk each help."},"hints":["His factor is ×2. To reach 10.0 from a start of 8.0, the rise must be 2 or less.","So the adjusted base must be 1: medium is 3, and each change takes off 1.","Tweak (more vegetables and protein, often a smaller rice portion) \u003cstrong>and\u003c/strong> a walk."]}],"blocks":[{"title":"What the model shows","html":"\u003cp>The \u003cstrong>same meal\u003c/strong> gives \u003cstrong>different curves\u003c/strong> for different bodies. Meal composition and a short walk both lower the peak, and nothing here requires giving up a meaningful food. Risk, meanwhile, comes from many factors at once: biology, daily patterns and the conditions people live in.\u003c/p>\u003cp class=\"tiny muted\">These are teaching-model values for fictional personas. Real targets are set with a health professional. Health information here is general, not advice for any particular person. For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}]},"part3":{"slug":"community","name":"Community","heading":"Prevention at community level","intro":"Move from one person’s curve to whole communities. Read what prevention trials showed, look at community-led programs, then rate four prevention strategies against four criteria.","stations":[{"id":"trial","t":"1. What the trials showed"},{"id":"programs","t":"2. Community-led programs"},{"id":"rate","t":"3. Evaluate four strategies"}],"trial":{"title":"Station 1: what the trials showed","text":"Large prevention trials compared lifestyle programs with usual care in adults with prediabetes (for example, the U.S. Diabetes Prevention Program; Diabetes Prevention Program Research Group, 2002). This panel uses \u003cstrong>model numbers\u003c/strong> based on that kind of trial: new diagnoses over about 3 years.","bars":[{"id":"usual","t":"Usual care","v":30},{"id":"life","t":"Lifestyle program","v":15},{"id":"med","t":"Medication","v":20}],"unit":"new diagnoses per 100 people","noWeight":"This panel reports diagnoses and the behaviours involved. It gives no weight figures.","q1":{"id":"rel","prompt":"How much lower was the lifestyle group’s rate, relative to usual care?","_a":"BVI=","unit":"%","wrong":[{"match":15,"fb":"15 per 100 is the absolute difference. Relative: compare the difference with the usual-care rate, 15 ÷ 30."},{"match":200,"fb":"That compares the wrong way round. The usual-care rate is the starting point: 15 ÷ 30."}],"wrongDefault":"Relative reduction = difference ÷ usual-care rate = (30 − 15) ÷ 30.","why":"30 − 15 = 15, and 15 ÷ 30 = 50%: the lifestyle group’s rate was half the usual-care rate."},"q2":{"id":"what","prompt":"What did the program change?","choices":[{"t":"A daily medication","_n":"14b50","_k":"7a048003"},{"t":"Eating patterns and activity, with coaching and support","_n":"15b80","_k":"5c06d090"},{"t":"Nothing: people just tried harder on their own","_n":"16b70","_k":"6988efdb"},{"t":"Only how much sugar people ate","_n":"17ba0","_k":"0cd4d638"}],"why":"Lifestyle programs changed eating patterns and activity, and gave people coaching and support to keep going.","wrong":"Look at what the lifestyle group did: eating patterns and activity, with coaching and support."},"tableHeads":["Group","New diagnoses per 100","Difference from usual care","Relative reduction"]},"programs":{"title":"Station 2: community-led programs","ask":"Read each card. Tap every feature the card describes, then check your tags.","features":[{"id":"led","t":"community-led"},{"id":"culture","t":"culturally grounded"},{"id":"school","t":"school-based"},{"id":"env","t":"changes the food environment"},{"id":"trad","t":"includes traditional foods"},{"id":"long","t":"long-term"}],"cards":[{"id":"ksdpp","t":"Kahnawake Schools Diabetes Prevention Project (KSDPP)","real":true,"html":"Kahnawake is a Kanien’kehá:ka (Mohawk) community near Montréal, Quebec. Community members started the project in 1994 and lead it, with researchers as partners, and a community advisory board guides its decisions. Lessons in the community’s elementary schools teach healthy eating and active living in ways grounded in Kanien’kehá:ka culture and values. The project worked with the schools on healthier school food policies and more chances to be active, and it has continued for decades.","_a":"a0AIVlBGShdTFwhHQRYDFxxAF1BcCwlZEk5GVloSRBkSDgtdU0Y7"},{"id":"model","t":"The Neighbourhood Kitchen Table","real":false,"html":"A community health centre in an Ontario city asked local families what would help. Members of the centre’s Punjabi, Tamil and Caribbean communities now co-lead weekly walking groups and cooking circles, where people adapt their own family recipes, such as adding vegetables and legumes and balancing portions of roti, rice or bread. It started this year as a pilot.","_a":"a0AIVlBGShdTFwhHQRYDFxxAEEFVAERo"}],"msgs":{"none":"Tap at least one feature first.","done":"Your tags match this card.","miss":"Look again: the card describes {count} you haven’t tagged.","extra":"The card doesn’t describe {list}."}},"rate":{"title":"Station 3: evaluate four strategies","ask":"Rate each strategy against the four criteria, then check your ratings against the model ratings.","criteria":[{"id":"reach","t":"Reaches many people","opts":[{"id":"yes","t":"yes"},{"id":"community","t":"the community"},{"id":"no","t":"no"}]},{"id":"root","t":"Addresses root causes","opts":[{"id":"yes","t":"yes"},{"id":"partly","t":"partly"},{"id":"no","t":"no"}]},{"id":"resp","t":"Culturally respectful","opts":[{"id":"yes","t":"yes"},{"id":"codes","t":"yes if co-designed"},{"id":"varies","t":"varies"},{"id":"no","t":"no"}]},{"id":"evid","t":"Has evidence","opts":[{"id":"supported","t":"supported"},{"id":"moderate","t":"moderate"},{"id":"weak","t":"weak"},{"id":"none","t":"none"}]}],"strategies":[{"id":"A","t":"Posters telling people to “eat less sugar”","_a":"S0AWVlUHDhcKQB1WR0ZKF0INC0cWXkRbX0BIEUYBFUUSWEZFVRYPUENASBFREg9RElhGRFEFDRdN","why":"Posters reach many people, but advice alone doesn’t change income, food access or stress, and the evidence that it works is weak."},{"id":"B","t":"A school food program with whole grains, vegetables and water as the default","_a":"S0AWVlUHDhcKQB1WR0ZKF0INC0cWXkRFURAQX01GShdCBxdDFl5EVl8GAUAWSERQRgsAEQ5GC1pUBxZSQAFESA==","why":"A default reaches every student and changes the food environment. It is respectful when families help design it."},{"id":"C","t":"A community-led program combining traditional food, activity and coaching","_a":"S0AWVlUHDhcKQAdcWQkTW1kWHREYRhRaXxZGCRYdA0YSTkZBURcWFwpAHVZHRkoXVRQNVxZeREZFEhRcRhADURIf","why":"Led by the community and grounded in culture, it tackles root causes, and trials and community projects support it."},{"id":"D","t":"Telling individuals to “just try harder”","_a":"S0AWVlUHDhcKQApcFkhER18NEBEORghaEk5GQVEXFhcKQApcFkhEUEYLABEORghaXgdGTg==","why":"Blame reaches no one usefully, ignores causes and does harm, and there is no evidence that it works. Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings."}],"msgs":{"partial":"Rate all four criteria first.","ok":"Your ratings match the model ratings.","off":"{count} from the model ratings (marked ✗). Rethink {list}."}},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Diabetes Canada Clinical Practice Guidelines Expert Committee. (2018). Diabetes Canada 2018 clinical practice guidelines for the prevention and management of diabetes in Canada. \u003ci>Canadian Journal of Diabetes, 42\u003c/i>(Suppl. 1), S1–S325.\u003c/li>\u003cli>Diabetes Prevention Program Research Group. (2002). Reduction in the incidence of type 2 diabetes with lifestyle intervention or metformin. \u003ci>New England Journal of Medicine, 346\u003c/i>(6), 393–403.\u003c/li>\u003cli>Macaulay, A. C., Paradis, G., Potvin, L., Cross, E. J., Saad-Haddad, C., McComber, A., Desrosiers, S., Kirby, R., Montour, L. T., Lamping, D. L., Leduc, N., &amp; Rivard, M. (1997). The Kahnawake Schools Diabetes Prevention Project: Intervention, evaluation, and baseline results of a diabetes primary prevention program with a Native community in Canada. \u003ci>Preventive Medicine, 26\u003c/i>(6), 779–790.\u003c/li>\u003cli>Public Health Agency of Canada. (2011). \u003ci>Diabetes in Canada: Facts and figures from a public health perspective\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Community quick check","summary":"Community quick check","items":[{"id":"q1","goal":5,"prompt":"Lifestyle-program rate 15 per 100 vs usual care 30 per 100. Relative reduction?","choices":[{"t":"30%","fb":"15 is half of 30.","_n":"18b90","_k":"c2c9242b"},{"t":"15%","fb":"15 is half of 30.","_n":"19bc0","_k":"c9eeb674"},{"t":"50%","fb":"Right. 15 is half of 30, so the rate fell by 50%.","_n":"1abb0","_k":"57c309ba"},{"t":"200%","fb":"15 is half of 30.","_n":"1bae0","_k":"7c6c3f6c"}]},{"id":"q2","goal":5,"prompt":"Which feature most often appears in successful community programs?","choices":[{"t":"one-time talks","fb":"Ownership and culture sustain change.","_n":"1cad0","_k":"48a907e0"},{"t":"community-led and culturally grounded","fb":"Right. Ownership and culture sustain change.","_n":"1d300","_k":"e8aabf5e"},{"t":"posters only","fb":"Ownership and culture sustain change.","_n":"1e310","_k":"e1757a99"},{"t":"blaming individuals","fb":"Ownership and culture sustain change.","_n":"1f2e0","_k":"864b6409"}]},{"id":"q3","goal":3,"prompt":"Higher type 2 rates in some Indigenous communities are best explained by…","choices":[{"t":"culture","fb":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","_n":"1g2f0","_k":"560b5f3f"},{"t":"genetics and social conditions, including colonization’s effects on food systems","fb":"Right. Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","_n":"1h2c0","_k":"cfbdb6de"},{"t":"personal choices only","fb":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","_n":"1i2d0","_k":"df8c6073"},{"t":"traditional foods","fb":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","_n":"1j2a0","_k":"b4111aa9"}]},{"id":"q4","goal":5,"prompt":"Which strategy changes the food environment rather than only giving advice?","choices":[{"t":"a pamphlet","fb":"Defaults shape choices for everyone.","_n":"1k2b0","_k":"9817f277"},{"t":"a poster","fb":"Defaults shape choices for everyone.","_n":"1l380","_k":"34e09f01"},{"t":"water as the default school drink","fb":"Right. Defaults shape choices for everyone.","_n":"1m390","_k":"97f14f86"},{"t":"a one-time talk","fb":"Defaults shape choices for everyone.","_n":"1n2a0","_k":"f9b58065"}]}]},"blocksAfter":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>Health information here is general, not advice for any particular person. For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"}]},"practice":{"activities":[{"id":"types","type":"custom","title":"Type 1, type 2 or both?","summary":"Type 1, type 2 or both","goal":[1,3],"instruction":"Sort each statement into the box where it belongs. One card is a myth: tapping it opens a \u003cstrong>Neither\u003c/strong> box.","how":"Tap a statement, then tap the box it belongs in.","boxes":[{"id":"t1","label":"Type 1"},{"id":"t2","label":"Type 2"},{"id":"both","label":"Both"}],"neither":{"id":"none","label":"Neither","sub":"a myth"},"items":[{"id":"s1","t":"The immune system destroys the insulin-making beta cells","_a":"EhZVEQ==","goal":1,"why":"In type 1, an autoimmune reaction destroys the beta cells, so little or no insulin is made.","wrong":{"t2":"Type 1: the immune system destroys beta cells. Type 2: cells resist insulin and the pancreas can’t keep up.","both":"Type 1: the immune system destroys beta cells. Type 2: cells resist insulin and the pancreas can’t keep up."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Type 1."]},{"id":"s2","t":"Begins with insulin resistance","_a":"EhZWEQ==","goal":1,"why":"Type 2 starts when cells respond less to insulin.","wrong":{"t1":"Type 1: the immune system destroys beta cells. Type 2: cells resist insulin and the pancreas can’t keep up.","both":"Type 1: the immune system destroys beta cells. Type 2: cells resist insulin and the pancreas can’t keep up."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Type 2."]},{"id":"s3","t":"Blood glucose stays too high without management","_a":"EgALR1xG","goal":1,"why":"Both types involve high blood glucose that needs managing.","wrong":{"t1":"Both involve high blood glucose.","t2":"Both involve high blood glucose."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Both."]},{"id":"s4","t":"Always needs insulin from diagnosis","_a":"EhZVEQ==","goal":1,"why":"Without working beta cells, people with type 1 need insulin from the start.","wrong":{"t2":"Type 2 may need insulin later, but not always.","both":"Type 2 may need insulin later, but not always."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Type 1."]},{"id":"s5","t":"About 9 in 10 diabetes cases in Canada","_a":"EhZWEQ==","goal":1,"why":"Type 2 is by far the most common type.","wrong":{"t1":"Type 1 is the less common type. Which type makes up most cases?","both":"Most cases are one type. Which is far more common?"},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Type 2."]},{"id":"s6","t":"Risk raised by family history","_a":"EgALR1xG","goal":3,"why":"Family history raises risk for both types.","wrong":{"t1":"Family history matters for both.","t2":"Family history matters for both."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Both."]},{"id":"s7","t":"Can sometimes be delayed by eating and activity changes in people at high risk","_a":"EhZWEQ==","goal":[1,3],"why":"Prevention trials found that eating and activity changes can delay type 2 in people at high risk.","wrong":{"t1":"Type 1 is autoimmune; eating and activity changes aren’t known to prevent it.","both":"Only one type has been delayed this way in trials. Which one involves resistance?"},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Type 2."]},{"id":"s8","t":"Planning meals around carbohydrate helps manage blood glucose","_a":"EgALR1xG","goal":1,"why":"Matching meals and carbohydrate to the body’s needs helps in both types.","wrong":{"t1":"Carbohydrate planning helps people with either type.","t2":"Carbohydrate planning helps people with either type."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Both."]},{"id":"s9","t":"Caused by eating too much sugar as a child","_a":"EgwLXVFG","goal":1,"why":"It’s a myth. Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns.","myth":true,"wrong":{"t1":"That’s a myth: Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns. This card belongs in neither box.","t2":"That’s a myth: Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns. This card belongs in neither box.","both":"That’s a myth: Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns. This card belongs in neither box."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: neither. It’s a myth."]},{"id":"s10","t":"Higher rates linked to social conditions such as income and food access","_a":"EhZWEQ==","goal":3,"why":"Income and food access shape type 2 rates across communities.","wrong":{"t1":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","both":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings."},"hints":["Is the problem making insulin, or responding to it?","Type 1 is autoimmune; type 2 involves resistance.","The answer: Type 2."]}]},{"id":"gl","type":"custom","title":"Glycemic load and trial data","summary":"Glycemic load and trial data","star":true,"goal":[2,5],"instruction":"Glycemic load (GL) = GI × available carbohydrate (g) ÷ 100. Categories: low ≤ 10, medium 11–19, high ≥ 20. Items marked ★ are non-routine; R5 is an inquiry item.","how":"Type each number, choose from the chips where there are any, then press Check. Each item has three levels of help.","cats":[{"id":"low","t":"low"},{"id":"medium","t":"medium"},{"id":"high","t":"high"}],"items":[{"id":"r1","goal":2,"prompt":"GI 70, 30 g carbohydrate. GL?","nums":[{"id":"v","label":"GL","_a":"AlM="}],"_a":"EgoNVFxG","wrong":[{"match":2100,"fb":"Divide by 100."}],"wrongDefault":"GL = GI × carbohydrate ÷ 100.","catFb":"Check the category cut-offs: 20 or more is high.","why":"70 × 30 = 2100; ÷ 100 = 21, which is high.","hints":["GL = GI × carbohydrate ÷ 100.","70 × 30 = 2100.","2100 ÷ 100 = 21, which is high (20 or more)."]},{"id":"r2","goal":2,"prompt":"GI 40, 25 g carbohydrate. GL?","nums":[{"id":"v","label":"GL","_a":"AVI="}],"_a":"Eg4LRBY=","wrong":[{"match":1000,"fb":"40 × 25 = 1000; ÷ 100 = 10."}],"wrongDefault":"40 × 25 = 1000; ÷ 100 = 10.","catFb":"Check the category cut-offs: 10 or less is low.","why":"40 × 25 = 1000; ÷ 100 = 10, which is low.","hints":["Multiply GI by grams of carbohydrate, then divide by 100.","40 × 25 = 1000.","1000 ÷ 100 = 10, which is low (10 or less)."]},{"id":"r3","goal":2,"star":true,"prompt":"Watermelon: GI about 75 (high) but about 10 g carbohydrate per cup. GL? Why does GL tell a different story?","nums":[{"id":"v","label":"GL","_a":"B0xR"}],"_a":"Eg4LRBY=","choiceLabel":"Why GL tells a different story","choices":[{"t":"Watermelon has no carbohydrate","_n":"1o290","_k":"88ad4fe8"},{"t":"GI already includes the portion size","_n":"1p280","_k":"9ea62f72"},{"t":"GL accounts for the amount of carbohydrate","_n":"1q270","_k":"da7a7c0b"},{"t":"GL ignores the GI","_n":"1r2e0","_k":"cb27afc5"}],"wrong":[{"match":750,"fb":"Divide by 100."}],"wrongDefault":"GI alone ignores portion. 75 × 10 ÷ 100 = ?","catFb":"GI alone ignores portion. A GL of 7.5 is in the low range.","choiceFb":"GI alone ignores portion.","why":"75 × 10 ÷ 100 = 7.5, which is low. GI alone ignores portion; GL accounts for the amount of carbohydrate.","hints":["Use about 75 and 10 g.","75 × 10 = 750; ÷ 100 = 7.5.","GL 7.5 is low: a cup has little carbohydrate, so the high GI matters less. GL accounts for the amount."]},{"id":"r4","goal":2,"star":true,"prompt":"Raj’s model: with the tweak only, his medium-meal peak is 12.0. What’s the peak if he also walks, and why?","nums":[{"id":"v","label":"Peak","_a":"AVI=","unit":"mmol/L"}],"choiceLabel":"Why","choices":[{"t":"The adjusted base goes from 2 to 1; ×2 = 2; plus 8.0","_n":"1s2d0","_k":"3d90b596"},{"t":"The walk takes 1 off after the ×2, then adds 8.0","_n":"1t2c0","_k":"3a9d1e25"},{"t":"A walk doesn’t change the peak","_n":"1u2b0","_k":"fa4a5269"},{"t":"The walk takes 1 off the peak: 12.0 − 1","_n":"1v320","_k":"b92ed57d"}],"wrong":[{"match":11,"fb":"Apply the walk before the ×2."},{"match":12,"fb":"The walk lowers the base by 1. Apply the walk before the ×2."}],"wrongDefault":"Apply the walk before the ×2.","choiceFb":"Apply the walk before the ×2.","why":"The adjusted base 2 → 1; 1 × 2 = 2; 8.0 + 2 = 10.0 mmol/L.","hints":["The walk takes 1 off the base before the ×2.","Tweak: 3 − 1 = 2. Walk: 2 − 1 = 1.","1 × 2 = 2; 8.0 + 2 = 10.0 mmol/L."]},{"id":"r5","goal":5,"star":true,"inquiry":true,"prompt":"Trial (model data): 1000 adults with prediabetes. Usual care: 300 diagnosed in 3 years. Lifestyle program: 150. Absolute difference per 100 people, and relative reduction?","nums":[{"id":"abs","label":"Absolute difference","_a":"AVc=","unit":"per 100"},{"id":"rel","label":"Relative reduction","_a":"BVI=","unit":"%"}],"wrong":[],"wrongDefault":"Separate absolute (30 − 15 per 100) from relative (15 ÷ 30).","why":"Usual care 30 per 100, program 15 per 100: the absolute difference is 15 per 100, and the relative reduction is 15 ÷ 30 = 50%.","hints":["Turn the counts into rates per 100: 300 of 1000 and 150 of 1000.","30 per 100 and 15 per 100. Absolute: 30 − 15.","Absolute: 15 per 100. Relative: 15 ÷ 30 = 50%."]},{"id":"r6","goal":5,"star":true,"prompt":"A company says its “diabetes-reversing” tea cut glucose in 12 users. Name two reasons this claim is weak.","multi":true,"need":2,"choiceLabel":"Choose two or more reasons","choices":[{"t":"No control group","_n":"1w310","_k":"6be11ddc"},{"t":"Tiny sample","_n":"1x240","_k":"e908c9e9"},{"t":"No randomization","_n":"1y250","_k":"3a2459a5"},{"t":"Company-funded","_n":"1z260","_k":"d88d39c1"},{"t":"Outcome not defined","_n":"20270","_k":"763c4373"},{"t":"The tea is made from plants","_n":"21280","_k":"0dd7f4ca"},{"t":"It measured blood glucose","_n":"22290","_k":"063ab96c"},{"t":"The users were adults","_n":"232a0","_k":"4ce8f7a9"}],"choiceFb":"Compare with the trial in R5.","why":"Any two of: no control group, a tiny sample, no randomization, funded by the seller, and no clear outcome. The R5 trial had a comparison group and many more people.","hints":["What did the trial have that this lacks?","A comparison group; random assignment.","Also: 12 people, run by the seller."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Ludovic","goal":[1,3,4],"how":"","instruction":"Ludovic made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain type 2 diabetes.","steps":["“Insulin lets cells take up glucose.”","“In type 2, the immune system destroys the beta cells.”","“So glucose stays high in the blood.”"],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"That describes type 1.","_n":"242b0","_k":"42a81e71"},{"t":"“In type 2, the liver makes insulin instead.”","why":"The pancreas makes insulin.","_n":"252c0","_k":"82faea2d"},{"t":"“In type 2, glucose isn’t absorbed.”","why":"Absorption is normal.","_n":"262d0","_k":"3354be55"},{"t":"“In type 2, cells resist insulin, and over time the pancreas can’t make enough.”","why":"Type 1: the immune system destroys beta cells. Type 2: cells resist insulin and the pancreas can’t keep up.","_n":"273e2","_k":"267ea937"}],"hints":["Which type is autoimmune?","Type 1.","Type 2: resistance."]},{"id":"e2","goal":4,"task":"Plan a lunch for someone managing type 2 diabetes.","steps":["“Use the plate method.”","“Fill half the plate with non-starchy vegetables.”","“Remove all starches, because carbohydrate raises glucose.”","“Fill the rest with protein.”"],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct. Keep checking.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"The plate method keeps a quarter starch.","_n":"283d2","_k":"cbabaf16"},{"t":"“Keep a quarter plate of starch, ideally whole grain or higher fibre; carbohydrate is part of a balanced plate.”","why":"Carbohydrate stays on the plate: a quarter is starch. Type, amount and what it’s eaten with matter.","_n":"29402","_k":"323f35e1"},{"t":"“Replace starch with juice.”","why":"Juice raises glucose fast.","_n":"2a3f2","_k":"4174ce11"},{"t":"“Make half the plate starch.”","why":"That’s more than the plate method suggests.","_n":"2b3a2","_k":"f562ec41"}],"hints":["What does the plate method say about starch?","A quarter.","Keep it; choose higher-fibre options."]},{"id":"e3","goal":3,"task":"Explain why type 2 rates are higher in some communities.","steps":["“Rates are higher in some communities.”","“This is mainly because people in those communities make poor food choices.”","“So education is the only solution.”"],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"That blames individuals and ignores causes.","_n":"2c392","_k":"b85fc1e4"},{"t":"“It’s only genetics.”","why":"Social conditions matter too.","_n":"2d3c2","_k":"d63be579"},{"t":"“Genetics and social conditions (income, food access, and for Indigenous peoples the effects of colonization on food systems) combine to raise rates.”","why":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","_n":"2e3b2","_k":"31150bbe"},{"t":"“It’s caused by traditional foods.”","why":"Traditional food systems are often protective (module 20).","_n":"2f362","_k":"afd7162e"}],"hints":["What did the risk map show?","Several factor types combine.","Genetics plus social conditions."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>Health information here is general, not advice for any particular person. For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"},{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"What surprised you about how the same meal produced different curves for different personas?"},{"id":"j2","q":"In your own words, explain insulin resistance to someone who has never heard of it."},{"id":"j3","q":"Explain to a friend how a person can keep a meaningful food and still manage blood glucose."},{"id":"j4","q":"What are you still unsure about: the biology, the risk factors or the community programs? What will you do next?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is insulin resistance?","options":[{"t":"The pancreas stops making insulin overnight","why":"Resistance comes first; supply weakens later.","_n":"2g352","_k":"e6845a24"},{"t":"Cells respond less to insulin, so more is needed to move glucose into them","why":"Resistance comes first; the pancreas makes more insulin to keep up.","_n":"2h382","_k":"98b72245"},{"t":"Glucose can’t be absorbed from food","why":"Absorption is normal.","_n":"2i392","_k":"b3a7381a"},{"t":"A reaction caused only by eating sugar","why":"Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns.","_n":"2j362","_k":"5ad89602"}]},"b":{"prompt":"Which best describes how type 2 diabetes develops?","options":[{"t":"Insulin resistance, then the pancreas gradually can’t keep up","why":"Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns.","_n":"2k372","_k":"ab9fbb65"},{"t":"The immune system destroys beta cells","why":"Type 1: the immune system destroys beta cells. Type 2: cells resist insulin and the pancreas can’t keep up.","_n":"2l3c2","_k":"79bdbe81"},{"t":"The liver stops storing glucose","why":"Not the main process.","_n":"2m3d2","_k":"2a43a68f"},{"t":"Eating sugar directly damages the pancreas","why":"Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns.","_n":"2n3a2","_k":"afbe8685"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which is true of type 1 but \u003cstrong>not\u003c/strong> type 2 diabetes?","options":[{"t":"Blood glucose runs high","why":"Both.","_n":"2o3b2","_k":"5576c467"},{"t":"Carbohydrate planning helps management","why":"Both.","_n":"2p302","_k":"7a7a3182"},{"t":"Family history affects risk","why":"Both.","_n":"2q312","_k":"567fa57a"},{"t":"The immune system destroys the insulin-making beta cells","why":"Type 1 is autoimmune; type 2 begins with insulin resistance.","_n":"2re27","_k":"c55774a0"}]},"b":{"prompt":"Which is true of type 2 but \u003cstrong>not\u003c/strong> type 1?","options":[{"t":"It begins with insulin resistance","why":"Type 1 begins with the immune system destroying beta cells.","_n":"2se37","_k":"31318af4"},{"t":"Insulin is involved","why":"Both.","_n":"2te07","_k":"1e78ca3b"},{"t":"It involves high blood glucose","why":"Both.","_n":"2ue17","_k":"1e054297"},{"t":"Meal planning helps","why":"Both.","_n":"2vde7","_k":"274e7823"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which set lists only \u003cstrong>risk factors\u003c/strong> for type 2 diabetes?","options":[{"t":"Family history, older age, physical inactivity, past gestational diabetes","why":"Each of these is an established risk factor.","_n":"2wdf7","_k":"2e16ee8a"},{"t":"Drinking water, eating vegetables, walking","why":"Those are protective habits.","_n":"2xdc7","_k":"5ddd778b"},{"t":"Type 1 diabetes, tall stature, blood type","why":"No.","_n":"2ydd7","_k":"aee3d809"},{"t":"Eating any sugar, cold weather, height","why":"Not established risk factors. Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns.","_n":"2zea7","_k":"7a2f6c34"}]},"b":{"prompt":"Which is a \u003cstrong>social\u003c/strong> condition linked to type 2 risk?","options":[{"t":"Age","why":"Biological.","_n":"30eb7","_k":"507409da"},{"t":"Low household income limiting access to fresh foods","why":"Income and food access are social conditions.","_n":"31687","_k":"0dcc8dc3"},{"t":"Family history","why":"Biological.","_n":"32677","_k":"4ab2b748"},{"t":"Insulin resistance","why":"Physiological.","_n":"336a7","_k":"9cb7c0df"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"In the module’s model, Ahmad (×1.5, fasting 6.0) eats the high-GI meal (base 4) with the tweak and a walk. What’s his peak?","options":[{"t":"7.5 mmol/L","why":"That’s an adjusted base of 1.","_n":"34697","_k":"0517a278"},{"t":"10.0 mmol/L","why":"That uses ×2.","_n":"356c7","_k":"cee899b3"},{"t":"12.0 mmol/L","why":"That’s without the tweak or walk.","_n":"366b7","_k":"487306a1"},{"t":"9.0 mmol/L","why":"(4 − 1 − 1) × 1.5 = 3; 6 + 3 = 9.","_n":"376e7","_k":"e16aa01c"}]},"b":{"prompt":"Raj (×2, fasting 8.0), lower-GI meal (base 2), walk only. Peak?","options":[{"t":"12.0 mmol/L","why":"No walk.","_n":"386d7","_k":"a6dd9ff1"},{"t":"9.0 mmol/L","why":"That uses ×1.","_n":"39607","_k":"eb4971a0"},{"t":"10.0 mmol/L","why":"(2 − 1) × 2 = 2; 8 + 2.","_n":"3a5f7","_k":"586197f8"},{"t":"8.0 mmol/L","why":"That’s the tweak and the walk together.","_n":"3bd67","_k":"97c7d3f3"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Food P: GI 60, 50 g carbohydrate. Food Q: GI 80, 15 g carbohydrate. Which has the higher glycemic load?","options":[{"t":"They’re equal","why":"30 ≠ 12.","_n":"3cd77","_k":"b7ef112b"},{"t":"Q, because its GI is higher","why":"GL includes the amount.","_n":"3dd87","_k":"04ac5ae3"},{"t":"P (GL 30 vs 12)","why":"60 × 50 ÷ 100 = 30; 80 × 15 ÷ 100 = 12.","_n":"3ed97","_k":"e148ee10"},{"t":"Can’t tell without calories","why":"GL uses GI and carbohydrate.","_n":"3fda7","_k":"e697ff5c"}]},"b":{"prompt":"Food R: GI 50, 40 g carbohydrate. Food S: GI 90, 10 g. Higher GL?","options":[{"t":"Can’t tell","why":"Use GI × carbohydrate ÷ 100.","_n":"3gdb7","_k":"90048e6a"},{"t":"S, higher GI","why":"Portion matters.","_n":"3hdc7","_k":"9961d728"},{"t":"R (20 vs 9)","why":"50 × 40 ÷ 100 = 20; 90 × 10 ÷ 100 = 9.","_n":"3idd7","_k":"5a759095"},{"t":"Equal","why":"20 ≠ 9.","_n":"3jde7","_k":"e460fee4"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Model trial: usual care, 24 of 100 diagnosed; lifestyle program, 12 of 100. Which statement is correct?","options":[{"t":"It prevented all cases","why":"12 still developed diabetes.","_n":"3kdf7","_k":"fa1b1dd2"},{"t":"The lifestyle program cut the rate by half (relative) and by 12 per 100 (absolute)","why":"24 − 12 = 12 per 100 (absolute); 12 ÷ 24 = 50% (relative).","_n":"3ldc7","_k":"4104d5ef"},{"t":"It shows sugar causes diabetes","why":"Type 2 develops from insulin resistance plus reduced insulin production, shaped by genes, age, activity and overall eating patterns.","_n":"3mdb7","_k":"8c792e9c"},{"t":"It cut risk by 12%","why":"12 per 100 is the absolute difference; the relative drop is 50%.","_n":"3nda7","_k":"56c95ff4"}]},"b":{"prompt":"Model trial: usual care 20 of 100; program 15 of 100. Correct statement?","options":[{"t":"No effect","why":"15 \u003c 20.","_n":"3od97","_k":"c3d79e05"},{"t":"Absolute 25 per 100","why":"Reversed.","_n":"3pe07","_k":"25be9114"},{"t":"Relative 5%","why":"5 ÷ 20 = 25%.","_n":"3qdf7","_k":"52d0dac4"},{"t":"The relative reduction is 25% and the absolute reduction is 5 per 100","why":"20 − 15 = 5 per 100; 5 ÷ 20 = 25%.","_n":"3rde7","_k":"8a1782af"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which advice for someone managing type 2 diabetes is clearest and most accurate?","options":[{"t":"“Avoid all your cultural foods.”","why":"Staples can stay: change the portion, pair them with vegetables and protein, add movement.","_n":"3sdd7","_k":"fe95f294"},{"t":"“Only eat fruit.”","why":"Not balanced.","_n":"3te47","_k":"66fc20ec"},{"t":"“Use the plate method: half non-starchy vegetables, a quarter starch (higher fibre when possible), a quarter protein, and spread carbohydrate through the day.”","why":"Specific, accurate and keeps carbohydrate on the plate.","_n":"3ue37","_k":"57d2429d"},{"t":"“Cut out all carbohydrates.”","why":"Carbohydrate stays on the plate: a quarter is starch. Type, amount and what it’s eaten with matter.","_n":"3vda8","_k":"81c09619"}]},"b":{"prompt":"Which description of carbohydrate in diabetes management is accurate?","options":[{"t":"“Carbohydrate stays on the plate; amount, type and what it’s paired with affect blood glucose.”","why":"Carbohydrate stays on the plate: a quarter is starch. Type, amount and what it’s eaten with matter.","_n":"3wdb8","_k":"528e52a0"},{"t":"“Fibre raises blood glucose fastest.”","why":"Fibre slows the rise.","_n":"3xd88","_k":"4bef3536"},{"t":"“Only sugar matters; starch doesn’t.”","why":"Starch becomes glucose.","_n":"3yd98","_k":"74c7bf06"},{"t":"“Carbohydrate is bad.”","why":"A moral label, and inaccurate.","_n":"3zde8","_k":"320cdf71"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which sentence about higher type 2 rates in some Indigenous communities is accurate and respectful?","options":[{"t":"“Higher rates reflect genetics and social conditions, including colonization’s disruption of traditional food systems; community-led programs are a response.”","why":"Accurate about causes, and it names a response without blame.","_n":"40df8","_k":"c1726ea6"},{"t":"“Nothing can be done.”","why":"Community-led programs show otherwise.","_n":"41dc8","_k":"bf80e2bd"},{"t":"“Indigenous people make unhealthy choices.”","why":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","_n":"42dd8","_k":"53f80509"},{"t":"“Traditional foods cause diabetes.”","why":"Often the opposite.","_n":"43e28","_k":"b7306dd5"}]},"b":{"prompt":"Which caption for the risk map is accurate and respectful?","options":[{"t":"“Risk comes from many combined factors (biology, activity, eating patterns and social conditions), shown here at the population level.”","why":"Accurate, and it describes populations, not individuals.","_n":"44e38","_k":"73fcafa8"},{"t":"“Diabetes is your own fault.”","why":"Higher rates reflect genetics and social conditions, including colonization’s effects on food systems, not personal or cultural failings.","_n":"45e08","_k":"32c1fcc5"},{"t":"“Only genes matter.”","why":"Several factors combine.","_n":"46df8","_k":"31aca41f"},{"t":"“Find out if you’ll get diabetes.”","why":"Population model, not personal.","_n":"47e28","_k":"b352a471"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Raj wants to keep rice at family dinners. Which plan best fits the plate method?","options":[{"t":"A quarter-plate of rice, half the plate vegetable curry, a quarter dal, and a short walk after dinner","why":"Staples can stay: change the portion, pair them with vegetables and protein, add movement.","_n":"48e18","_k":"bf390652"},{"t":"A full plate of rice with a sugary drink","why":"Not balanced.","_n":"49dc8","_k":"54462d55"},{"t":"No rice at all","why":"Staples can stay: change the portion, pair them with vegetables and protein, add movement.","_n":"4adb8","_k":"4cf792cc"},{"t":"Rice only at breakfast","why":"Spreading helps, but plate balance matters at each meal.","_n":"4bde8","_k":"93e41b38"}]},"b":{"prompt":"Ana loves tortillas at lunch. Which plan best fits?","options":[{"t":"Four tortillas and juice","why":"Too much fast carbohydrate.","_n":"4cdd8","_k":"eeb62ab0"},{"t":"Only salad","why":"Missing protein and starch.","_n":"4de88","_k":"d0fdf830"},{"t":"No tortillas ever","why":"Staples can stay: change the portion, pair them with vegetables and protein, add movement.","_n":"4ee78","_k":"81876b12"},{"t":"Two corn tortillas (a quarter plate), a half plate of vegetables, a quarter beans or chicken, and water","why":"Staples can stay: change the portion, pair them with vegetables and protein, add movement.","_n":"4f6e7","_k":"cfeae8b4"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A health unit wants to lower type 2 rates in a neighbourhood with few grocery stores. Which plan is strongest?","options":[{"t":"Work with community members to open affordable produce markets and start a culturally matched walking and cooking program","why":"Community-led, culturally matched, and it changes food access.","_n":"4g6f7","_k":"67dbe83a"},{"t":"Hand out pamphlets about sugar","why":"Information alone.","_n":"4h707","_k":"ba05fbab"},{"t":"Tell residents to drive to suburbs to shop","why":"Ignores access.","_n":"4i717","_k":"7d34d103"},{"t":"Screen residents but offer nothing else","why":"Screening alone doesn’t change conditions.","_n":"4j6a7","_k":"0a93a15f"}]},"b":{"prompt":"A school board wants to support diabetes prevention. Which plan is strongest?","options":[{"t":"Weigh students publicly","why":"Harmful; violates privacy and dignity.","_n":"4k6b7","_k":"d126fb6d"},{"t":"A one-time assembly","why":"Short-lived.","_n":"4l6c7","_k":"3cc47a33"},{"t":"Make water the default drink, offer whole-grain and vegetable-rich meals co-designed with families, and add daily activity","why":"It changes the environment for every student, with families’ input.","_n":"4m6d7","_k":"8596ce72"},{"t":"Ban all carbohydrate","why":"Carbohydrate stays on the plate: a quarter is starch. Type, amount and what it’s eaten with matter.","_n":"4n667","_k":"7a852df8"}]}}]},"task":{"title":"Raj’s plate","summary":"Raj’s plate","statement":"\u003cp>Raj is 52, lives with type 2 diabetes, is vegetarian and Punjabi Sikh. His (fictional) dietitian’s plan for lunch: plate method, 45–60 g carbohydrate, at least 10 g fibre, and foods he loves. Build a lunch that meets every condition.\u003c/p>\u003cp class=\"tiny muted\">Choose one starch, one protein and one vegetable. All values are model values.\u003c/p>","checks":["Half the plate non-starchy vegetables","Carbohydrate 45–60 g","At least 10 g fibre","Includes a food from Raj’s traditions"],"tips":["Potatoes are a starchy vegetable; they count toward carbohydrate, not the vegetable half.","Rice and naan push carbohydrate up fast; pair them with low-carbohydrate items, or choose roti.","Legumes (dal, chickpeas) bring fibre.","Raj’s traditions include roti, dal, sabzi, paneer, rice and naan."],"explainPrompt":"Explain how your plate supports Raj’s blood glucose \u003cstrong>and\u003c/strong> respects his food traditions.","vocab":"Use plate method, carbohydrate, fibre, legumes and glycemic response.","checkLabel":"Check Raj’s plate","success":"This lunch meets every condition.","more":"There’s more than one answer. Can you find another?","after3":"Whole-wheat roti is in every answer. Rice can fit too, on a different day’s plan with a smaller portion. Talk with the dietitian.","rows":[{"id":"s","t":"Starch","items":[{"id":"roti","t":"Roti, 2 small, whole wheat","short":"roti","carb":30,"fib":6,"trad":true},{"id":"wrice","t":"White rice, 1 cup","short":"white rice","carb":45,"fib":1,"trad":true},{"id":"brice","t":"Brown rice, 1 cup","short":"brown rice","carb":45,"fib":3,"trad":false},{"id":"naan","t":"Naan, 1 piece","short":"naan","carb":50,"fib":2,"trad":true}]},{"id":"p","t":"Protein","items":[{"id":"dal","t":"Dal, 1 cup","short":"dal","carb":20,"fib":8,"trad":true},{"id":"paneer","t":"Paneer, 100 g","short":"paneer","carb":3,"fib":0,"trad":true},{"id":"chana","t":"Chickpea curry, 1 cup","short":"chickpea curry","carb":25,"fib":7,"trad":true},{"id":"tofu","t":"Tofu, 150 g","short":"tofu","carb":4,"fib":1,"trad":false}]},{"id":"v","t":"Vegetable","items":[{"id":"sabzi","t":"Mixed-vegetable sabzi, 1 cup","short":"sabzi","carb":10,"fib":4,"trad":true,"nsv":true},{"id":"salad","t":"Green salad, 2 cups","short":"salad","carb":5,"fib":2,"trad":false,"nsv":true},{"id":"aloo","t":"Aloo (potato) curry, 1 cup","short":"aloo curry","carb":30,"fib":3,"trad":true,"nsv":false}]}],"kitchen":{"title":"Dal and vegetable sabzi with whole-wheat roti","label":"Save the kitchen card","file":"kitchen-card-dal-sabzi-roti.txt","lines":["Serves 4.","## Ingredients","- Dal: 1 cup split yellow lentils (moong or toor dal), rinsed; 4 cups water; ½ tsp turmeric; 1 tsp cumin seeds; 1 tomato; garlic and ginger","- Sabzi: 4 cups mixed vegetables (for example cauliflower, green beans, peppers and spinach); 1 onion; ½ tsp each cumin, coriander and turmeric","- Roti: 8 small whole-wheat roti (homemade with atta, or store-bought)","- 2 tsp vegetable oil in total","## Steps","1. Wash your hands. Rinse the lentils.","2. Simmer the lentils with the turmeric in the water for 25 to 30 minutes, until soft.","3. Warm the cumin seeds, garlic, ginger and chopped tomato in a little oil, then stir them into the dal.","4. Soften the onion in a little oil, add the spices and vegetables with a splash of water, cover and cook until just tender.","5. Warm the roti in a dry pan.","6. Plate it: half the plate sabzi, a quarter roti (2 small), a quarter dal.","## Safety","- Hot liquids: dal can spit as it thickens; stir with a long spoon and turn pot handles inward.","- Knife safety: curl your fingertips when chopping, and cut on a steady board.","- Leftovers: cool and refrigerate within 2 hours; reheat until steaming hot.","## Plate note","- Model values for one plate: about 60 g carbohydrate and 18 g fibre, from foods in Raj’s traditions.","## Health note","- General information only. For your own health, talk to a doctor, nurse or registered dietitian."]}},"cards":[["Insulin","Hormone from the pancreas that lets cells take up glucose."],["Insulin resistance","Cells respond less to insulin; more is needed."],["Type 2 diabetes","Resistance plus a weakening insulin supply; about 9 in 10 cases in Canada."],["Type 1 diabetes","Autoimmune destruction of beta cells; insulin needed."],["Prediabetes","Blood glucose higher than typical but below the diabetes range (as Diabetes Canada defines it)."],["Glycemic index (GI)","How fast a carbohydrate food raises blood glucose compared with a reference."],["Glycemic load (GL)","GI × carbohydrate (g) ÷ 100; accounts for amount."],["Plate method","Half non-starchy vegetables, a quarter starch, a quarter protein."],["Walking after meals","Working muscles take up glucose; peaks drop."],["Social determinants","Income, food access and stress shape diabetes risk."],["Community-led prevention","Programs designed and run with the community, grounded in culture."],["Relative vs absolute reduction","30 → 15 per 100: 50% relative, 15 per 100 absolute."]]}};</script>
