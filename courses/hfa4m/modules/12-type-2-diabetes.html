.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 12: hero (plate → typical and insulin-resistant cells), Blood glucose model (curves, pins, Inside the cell, risk map),
   Prevention at community level (trial bars, program cards, strategy matrix), practice (type sorter, GL set), Raj's plate.
   Role colours from hfa4u.css: carbohydrate and glucose --nu-carb (orange); protein --nu-protein (magenta); vegetables --leaf;
   risk factors --risk-mod (blue) / --risk-fixed (ink-2). Curves: --pen (pinned curve 1, or the only curve), --ink long dashes
   (pinned curve 2). Insulin keys --acol (violet), transporters --p-t (cerulean). Red and green appear only in feedback marks.
   Every coloured mark also carries a word, letter or icon. */
/* radio groups (from HFA4U 09) */
.dm-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.dm-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.dm-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.dm-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.dm-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.dm-chipset button:hover:not(:disabled){border-color:var(--pen)}
.dm-chipset button[aria-checked="true"],.dm-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.dm-chipset button:disabled{opacity:.85}
.dm-h4{margin:0 0 6px;font-size:1rem}
.dm-h5{margin:14px 0 6px;font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dm-lit{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi);border-radius:4px}

/* switches (from HFA4U 09) */
.dm-sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 10px;min-height:40px;font-size:.92rem}
.dm-sw:hover{border-color:var(--pen)}
.dm-swt{position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;border:2px solid var(--ink-2);background:var(--paper)}
.dm-swt i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.dm-sw[aria-checked="true"]{border-color:var(--ink)}
.dm-sw[aria-checked="true"] .dm-swt{background:var(--hi);border-color:var(--ink)}
.dm-sw[aria-checked="true"] .dm-swt i{left:18px;background:var(--ink)}
.dm-swl{flex:1 1 auto;min-width:0}
.dm-swv{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-2);min-width:1.8rem;text-align:right}
.dm-sw[aria-checked="true"] .dm-swv{color:var(--ink)}

/* hero */
.dm-hero{width:100%}
.dm-hsvg{display:block;width:100%;height:auto}
.dm-hl{fill:var(--ink);font:700 17px var(--font-ui)}
.dm-hs{fill:var(--ink-2);font:400 14px var(--font-ui)}
.dm-hc{fill:var(--ink);font:700 14.5px var(--font-ui)}
.dm-hrim{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.dm-hveg{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:2}
.dm-hroti{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:2}
.dm-hdal{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:2}
.dm-harr{fill:none;stroke:var(--ink-2);stroke-width:2.5}
.dm-harrh{fill:none;stroke:var(--ink-2);stroke-width:2.5;stroke-linejoin:round}
.dm-hblood{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.dm-hcell{fill:var(--sheet);stroke:var(--ink);stroke-width:3}
.dm-hgate{fill:var(--sheet);stroke:var(--p-t);stroke-width:2}
.dm-hbar{stroke:var(--p-t);stroke-width:4;stroke-linecap:round}
.dm-hlock{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.dm-hlock.stiff{stroke:var(--ink-2);stroke-width:3.4;stroke-dasharray:2 2}
.dm-hhole{fill:var(--ink)}
.dm-hkey circle{fill:var(--acol)}
.dm-hkey path{fill:none;stroke:var(--acol);stroke-width:2.4;stroke-linecap:round}
.dm-hglu{fill:var(--nu-carb)}
.dm-hax{stroke:var(--ink-2);stroke-width:1.5}
.dm-hbase{stroke:var(--rule);stroke-width:1.5;stroke-dasharray:4 4}
.dm-hcurve{fill:none;stroke:var(--pen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.dm-hcurve.res{stroke:var(--ink);stroke-dasharray:10 5}
.dm-cap{font-size:1.05rem!important;font-weight:700}

/* Explore layout */
.dm-lab{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px 24px;align-items:start}
.dm-lab.solo{grid-template-columns:minmax(0,1fr)}
.dm-main,.dm-side{min-width:0}
.dm-side{border-left:1.5px solid var(--rule);padding-left:18px}
canvas.plot.dm-plot{aspect-ratio:16/10}
.dm-legend{list-style:none;margin:8px 0 10px;padding:0;display:grid;gap:4px;font-size:.9rem}
.dm-legend li{display:flex;align-items:center;gap:8px;min-width:0}
.dm-legend svg{flex:0 0 auto}
.dm-legend span{min-width:0;overflow-wrap:anywhere}
.dm-sw0 line{stroke:var(--pen);stroke-width:3.2}
.dm-sw1 line{stroke:var(--ink);stroke-width:3}
.dm-sw2 line{stroke:var(--ink-2);stroke-width:2.6;stroke-linecap:round}
.dm-sw3 line{stroke:var(--ink-2);stroke-width:2}
.dm-ctl{border-top:1.5px solid var(--rule);padding-top:10px}
.dm-togs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 10px}
.dm-pinw{border-top:1px dashed var(--rule);padding-top:8px}
.dm-pinw .dm-rgl{margin:0 0 4px}
.dm-pinact{margin-top:0}
.dm-pins{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.dm-pins li{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--rule);border-radius:6px;padding:3px 4px 3px 10px;font-size:.9rem}
.dm-rm{border:1.5px solid var(--rule);background:var(--sheet);border-radius:6px;width:30px;height:30px;font-size:1.1rem;line-height:1;flex:0 0 auto}
.dm-rm:hover{border-color:var(--pen)}
.dm-about{margin-top:16px}
.dm-aboutw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px 24px;align-items:start}
.dm-about table.vt{font-family:var(--font-ui);font-size:.92rem}
.dm-about table.vt th,.dm-about table.vt td{padding:4px 10px}
.dm-about table.vt td:first-child{text-align:left}
.dm-rules{margin:8px 0;padding-left:1.1em;font-size:.92rem}
.dm-rules li{margin:0 0 4px}
.dm-ptt{margin:10px 0 4px}

/* Inside the cell */
.dm-cellw{max-width:760px}
.dm-csvg{display:block;width:100%;height:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.dm-cl{fill:var(--ink);font:700 13px var(--font-ui)}
.dm-cs{fill:var(--ink-2);font:400 12px var(--font-ui)}
.dm-cmem{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.dm-clock{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.dm-clock.stiff{stroke:var(--ink-2);stroke-width:4.2;stroke-dasharray:3 2}
.dm-clockb{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.dm-key circle{fill:var(--acol)}
.dm-key path{fill:none;stroke:var(--acol);stroke-width:3;stroke-linecap:round}
.dm-csig{fill:none;stroke:var(--ink);stroke-dasharray:7 5}
.dm-csigh{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.dm-ctr{fill:var(--sheet);stroke:var(--p-t);stroke-width:2.6}
.dm-ctrl{stroke:var(--p-t);stroke-width:2;stroke-dasharray:3 3}
.dm-cglu{fill:var(--nu-carb)}
.dm-csvg.narrow .dm-cs{font-size:14px}
.dm-csvg.narrow .dm-cl{font-size:15px}
.dm-csteps{margin:10px 0;padding-left:1.4em}
.dm-csteps li{padding:4px 8px;border-radius:6px;margin:0 0 2px}
.dm-csteps li.on{background:var(--hi-soft);box-shadow:inset 3px 0 0 var(--hi);font-weight:700}
.dm-t1{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--paper)}
.dm-t1 svg{flex:0 0 auto;width:96px;height:auto}
.dm-t1 .dm-h5{margin-top:2px}
.dm-t1 p{margin:0}
.dm-t1k circle{fill:none;stroke:var(--acol);stroke-width:2;stroke-dasharray:3 2}
.dm-t1k path{fill:none;stroke:var(--acol);stroke-width:2;stroke-dasharray:3 2}
.dm-t1x{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}

/* risk map (F7) */
.dm-rintro{margin:0 0 6px}
.dm-rkey{margin:0 0 4px}
.dm-rk{display:inline-block;font-size:.78rem;font-weight:700;border-radius:4px;padding:.05em .45em;border:1.5px solid}
.dm-rk.fixed{color:var(--risk-fixed);border-color:var(--risk-fixed)}
.dm-rk.mod{color:var(--risk-mod);border-color:var(--risk-mod)}
.dm-rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11rem,1fr));gap:8px}
.dm-rcard{position:relative;display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid var(--rule);border-left-width:6px;background:var(--sheet);border-radius:8px;padding:7px 10px;min-height:54px}
.dm-rcard.fixed{border-left-color:var(--risk-fixed)}
.dm-rcard.mod{border-left-color:var(--risk-mod)}
.dm-rcard:hover{border-color:var(--pen)}
.dm-rcard[aria-pressed="true"],.dm-rwhy[aria-pressed="true"]{box-shadow:0 0 0 3px var(--hi);background:var(--hi-soft)}
.dm-rtag{font-size:.8rem;color:var(--ink-2)}
.dm-rseen{position:absolute;top:5px;right:8px;font-size:.85rem;color:var(--ink-2)}
.dm-rwhy{position:relative;display:block;width:100%;text-align:left;margin-top:14px;border:2px solid var(--ink);background:var(--paper);border-radius:8px;padding:9px 12px;min-height:44px}
.dm-rwhy .dm-rseen{position:static}
.dm-rcount{margin:8px 0}
.dm-rdet{border:1.5px solid var(--rule);border-radius:8px;padding:6px 14px 8px;min-height:3rem}
.dm-rdet .dm-h5{margin-top:6px}
.dm-rnote{margin:6px 0 8px}
.dm-rcap{margin:10px 0 0}

/* Part 3 stations */
.dm-stok{font-weight:700}
.dm-st{margin-top:8px}
.dm-trf{margin:8px 0 0}
.dm-trbars{display:grid;gap:8px;max-width:640px;margin:4px 0 6px}
.dm-trrow{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:10px;align-items:center}
.dm-trl{font-weight:700;text-align:right}
.dm-trt{display:flex;align-items:center;gap:8px;min-width:0;border-left:2px solid var(--ink-2);padding:3px 0}
.dm-trt b{flex:0 0 auto;font-size:.95rem;white-space:nowrap}
.dm-trb{display:block;height:28px;border:2px solid;border-radius:4px;flex:0 1 auto}
.dm-trb.usual{background:var(--rule);border-color:var(--ink-2)}
.dm-trb.life{background:var(--nu-water-soft);border-color:var(--pen)}
.dm-trb.med{background:var(--nu-micro-soft);border-color:var(--acol)}
@media (max-width:560px){ .dm-trrow{grid-template-columns:minmax(0,1fr)} .dm-trl{text-align:left} }
.dm-tq{padding-top:10px}
.dm-tq .q-prompt{margin:0 0 6px}
.dm-tbl{border-collapse:collapse;font-size:.92rem;min-width:28rem}
.dm-tbl th,.dm-tbl td{border-bottom:1px solid var(--rule);padding:5px 10px;text-align:left}
.dm-tbl thead th{font-size:.85rem;color:var(--ink-2)}
.dm-pcard{border:1.5px solid var(--rule);border-radius:10px;padding:4px 14px 12px;margin:0 0 12px;background:var(--sheet)}
.dm-pcard.model{border-style:dashed}
.dm-pcard > p{margin:0 0 8px}
.dm-ftags{display:flex;flex-wrap:wrap;gap:6px}
.dm-ftag{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.dm-ftag:hover:not(:disabled){border-color:var(--pen)}
.dm-ftag[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.dm-ftag:disabled{opacity:.9}
.dm-ftag.right{box-shadow:0 0 0 2px var(--green)}
.dm-ftag.wrong{box-shadow:0 0 0 2px var(--red)}
.dm-ftag.wrong::after{content:" ✗"}
.dm-strat{border:1.5px solid var(--rule);border-radius:10px;padding:2px 14px 10px;margin:0 0 12px}
.dm-sl{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:.85rem}
.dm-crits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.dm-crit{position:relative;border-left:4px solid transparent;padding-left:8px}
.dm-crit .dm-rgw{margin-bottom:6px}
.dm-crit .dm-rgl{min-width:0;width:100%}
.dm-crit.right{border-left-color:var(--green)}
.dm-crit.wrong{border-left-color:var(--red)}
.dm-cmk{position:absolute;top:0;right:0;font-weight:700}
.dm-crit.right .dm-cmk{color:var(--green)}
.dm-crit.wrong .dm-cmk{color:var(--red)}

/* practice */
.bins.dm-four{grid-template-columns:repeat(2,minmax(0,1fr))}
.bin.dm-nbin{border-color:var(--ink);border-style:dashed;background:var(--paper)}
.dm-nnote{margin:6px 0 0}
.dm-gcat,.dm-gch{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:10px}

/* task: Raj's plate */
.dm-tin .dm-rgw{align-items:flex-start;flex-direction:column}
.dm-tk{display:inline-block;font-size:.8rem;font-weight:400;color:var(--ink-2)}
.dm-chipset button[aria-checked="true"] .dm-tk{color:var(--hi-ink)}
.dm-tpv{display:grid;gap:10px}
.dm-psvg{display:block;width:100%;max-width:240px;height:auto;margin:0 auto}
.dm-prim{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.dm-pe{fill:var(--paper);stroke:var(--rule);stroke-width:1.5;stroke-dasharray:4 3}
.dm-pv{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:2}
.dm-pvs{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:2;stroke-dasharray:6 3}
.dm-ps{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:2}
.dm-pp{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:2}
.dm-plt{fill:var(--ink);font:700 12px var(--font-ui)}
.dm-pls{fill:var(--ink-2);font:400 11px var(--font-ui)}
.dm-bar p{margin:0 0 3px;font-size:.92rem}
.dm-btr{position:relative;display:block;height:14px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--paper);overflow:hidden}
.dm-btr b{position:absolute;top:0;bottom:0;z-index:1;border-left:2px dashed var(--ink);border-right:2px dashed var(--ink)}
.dm-btr i{position:absolute;left:0;top:2px;bottom:2px;border-radius:2px}
.dm-btr i.carb{background:var(--nu-carb)}
.dm-btr i.fib{background:var(--plate-grain)}
.dm-trad{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.9rem}
.dm-ttag{display:inline-block;font-size:.78rem;font-weight:700;border:1px dashed var(--ink-2);border-radius:999px;padding:0 .55em;color:var(--ink-2)}
.dm-ttag.yes{border-style:solid;border-color:var(--ink);color:var(--ink)}
.dm-kcw{border-top:1.5px solid var(--rule);padding-top:10px}
.dm-kprev{margin-top:8px}
.dm-kprev summary{cursor:pointer;font-weight:700}
.dm-kcard{border:1.5px dashed var(--ink-2);border-radius:8px;padding:6px 12px;margin-top:6px;font-size:.9rem}
.dm-kcard h5{margin:8px 0 2px;font-size:.85rem;text-transform:uppercase;letter-spacing:.03em}
.dm-kcard p{margin:0 0 2px}
.dm-kcard p.b{padding-left:.4em}

@media (max-width:820px){
  .dm-lab,.dm-aboutw{grid-template-columns:minmax(0,1fr)}
  .dm-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
}
@media (max-width:560px){
  canvas.plot.dm-plot{aspect-ratio:4/3}
  .dm-togs,.dm-crits,.bins.dm-four{grid-template-columns:minmax(0,1fr)}
  .dm-rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dm-t1{flex-direction:column}
  .dm-rgl{min-width:0}
}

</style>
