.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;
--sys-stage:#1E2A57;--sys-emis:#6B5A1E;--sys-waste:#A84C05;
--nu-carb-soft:rgba(168,76,5,.13);--nu-protein-soft:rgba(176,40,111,.12);--nu-fat-soft:rgba(11,115,114,.13);--nu-micro-soft:rgba(122,61,184,.12);
--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 02: hero molecules, Macronutrient lab (benches, Measure), label lab stations, Energy detective, self check, lunch box.
   Role colours from hfa4u.css: carbohydrate --nu-carb, fat --nu-fat, protein --nu-protein; molecule skeletons in --ink. */
/* radio groups (from HFA4U 01) */
.mn-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.mn-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.mn-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.mn-rg.seg button:disabled{opacity:.45}

/* molecule sketches */
.mn-ring{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:2;stroke-linejoin:round}
.mn-gal{fill:var(--nu-carb)}
.mn-link{fill:none;stroke:var(--nu-carb);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mn-rt{fill:var(--ink);font:700 10px var(--font-ui)}
.mn-bl{fill:var(--nu-carb);font:700 13px var(--font-ui)}
.mn-tl{fill:none;stroke:var(--nu-fat);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.mn-gly{fill:none;stroke:var(--nu-fat);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.mn-cc{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.mn-db{stroke:var(--nu-fat);stroke-width:2.6;stroke-linecap:round}
.mn-cend{fill:var(--nu-fat)}
.mn-slot0{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 5}
.mn-endt{fill:var(--ink-2);font:400 13px var(--font-ui)}
.mn-bd{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:2}
.mn-bd.e{stroke-width:3.4}
.mn-bt{fill:var(--ink);font:700 11px var(--font-ui)}
.mn-plink{stroke:var(--nu-protein);stroke-width:2.2}
.mn-enz{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.mn-enzt{fill:var(--ink);font:700 12px var(--font-ui)}
.mn-no{fill:var(--red);font:700 20px var(--font-ui)}
.mn-empty{fill:var(--ink-2);font:400 14px var(--font-ui)}

/* hero */
.mn-hero{max-width:520px;margin:0 auto}
.mn-hsvg{display:block;width:100%;height:auto}
.mn-hl{fill:var(--ink);font:700 17px var(--font-ui)}
.mn-hs{fill:var(--ink-2);font:400 14px var(--font-ui)}
.mn-hk{font:700 18px var(--font-ui)}
.mn-kc{fill:var(--nu-carb)}.mn-kf{fill:var(--nu-fat)}.mn-kp{fill:var(--nu-protein)}
.mn-hnote{fill:var(--nu-fat);font:italic 700 13px var(--font-ui)}
.hero-fig figcaption.mn-cap{animation:mn-fade .8s ease-out}
@keyframes mn-fade{from{opacity:0}to{opacity:1}}

/* lab layout */
.mn-lab{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.mn-main,.mn-side{min-width:0}
.mn-side{border-left:1.5px solid var(--rule);padding-left:18px}
.mn-top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:0 0 6px}
.mn-h4{margin:14px 0 6px;font-size:1rem}
.mn-side .mn-h4{margin-top:0}
.mn-svgbox{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:4px;margin:6px 0 10px}
.mn-svgbox svg{display:block;width:100%;height:auto;margin:0 auto}
.mn-ctl{display:flex;flex-wrap:wrap;gap:10px 22px;margin:8px 0}
.mn-msg{min-height:1.3em;margin:6px 0 0}
.mn-tiles{display:flex;flex-wrap:wrap;gap:8px}
.mn-tile{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.3em .75em .3em .4em;font-weight:700;min-height:40px}
.mn-tile:hover{border-color:var(--nu-carb)}
.mn-tile svg{width:26px;height:26px}
.mn-check{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;cursor:pointer}
.mn-check input{width:18px;height:18px;accent-color:var(--pen)}

/* fat bench: tail with bond buttons over the drawing */
.mn-tailbox{overflow-x:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);margin:6px 0 4px}
.mn-tail{position:relative;min-width:560px;aspect-ratio:640/210}
.mn-tail svg{position:absolute;inset:0;width:100%;height:100%}
.mn-bb{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;padding:0;border-radius:50%;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink-2);font:700 .74rem var(--font-ui);line-height:1}
.mn-bb:hover{border-color:var(--pen)}
.mn-bb.d1,.mn-bb.d2{border:2.5px solid var(--nu-fat);color:var(--ink)}
.mn-bb.d2{border-style:dashed}
.mn-bb[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.mn-gsvg{max-height:260px}
.mn-state{font-weight:700;margin:4px 0 8px}
.mn-slots{display:grid;gap:4px}
.mn-slot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;padding:4px 0;border-bottom:1px solid var(--rule)}

/* protein bench */
.mn-beads{display:flex;flex-wrap:wrap;gap:6px}
.mn-bead{position:relative;min-width:44px;min-height:34px;border-radius:999px;border:2px solid var(--nu-protein);background:var(--nu-protein-soft);color:var(--ink);font:700 .85rem var(--font-ui);padding:.2em .6em}
.mn-bead.e{border-width:3.5px}
.mn-bead b,.mn-ekey{display:inline-block;margin-left:3px;font-size:.68rem;font-weight:700;border:1.5px solid var(--ink);border-radius:3px;padding:0 3px;line-height:1.3;vertical-align:.1em;color:var(--ink)}
.mn-foods,.mn-fchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.mn-aah{font-weight:700;margin:0 0 6px}
.mn-aab{display:grid;gap:4px}
.mn-aar{display:grid;grid-template-columns:minmax(6.5rem,9rem) minmax(0,1fr) 5.2rem;align-items:center;gap:8px;font-size:.9rem}
.mn-aat{position:relative;height:16px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.mn-aaf{position:absolute;left:0;top:2px;bottom:2px;background:var(--nu-protein);border-radius:3px}
.mn-aar.low .mn-aal,.mn-aar.low .mn-aav{font-weight:700}
.mn-aar.low .mn-aaf{background:repeating-linear-gradient(135deg,var(--nu-protein) 0 5px,var(--nu-protein-soft) 5px 9px)}
.mn-ref{position:absolute;top:-2px;bottom:-2px;width:0;border-left:2px dashed var(--ink)}
.mn-refkey{margin:4px 0 0}

/* Measure */
.mn-grid{display:grid;gap:6px;margin:8px 0 4px}
.mn-grow{display:grid;grid-template-columns:2rem repeat(4,minmax(0,1fr));gap:6px 10px;align-items:center}
.mn-grow .numin{width:100%;min-width:0}
.mn-ghead span{font-size:.8rem;font-weight:700;color:var(--ink-2);line-height:1.2;overflow-wrap:anywhere}
.mn-gw{font-weight:700}
.mn-fnames{margin:6px 0 0}
#mn-fill{margin:0 0 8px}
.mn-mctl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:0 0 10px}
.mn-food{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px 10px;margin:0 0 10px;min-width:0}
.mn-food legend{font-weight:700;padding:0 4px}
.mn-gin{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:8px 12px}
.mn-gin label{display:grid;gap:3px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.mn-gin .numin,.mn-gin .txtin{width:100%;max-width:11rem}
.mn-viz{display:grid;gap:4px}
.mn-vp{margin:6px 0 8px}
.mn-vp h5{margin:0 0 6px;font-size:.92rem}
.mn-leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;margin:0 0 4px}
.mn-leg span{display:inline-flex;align-items:center;gap:5px}
.mn-swband{background:var(--hi-soft)!important;border-style:dashed!important}
.mn-swnat{background:var(--nu-carb-soft)!important;border-color:var(--nu-carb)!important}
.mn-erow{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 5.4rem;align-items:center;gap:8px;margin:0 0 5px}
.mn-elab{font-weight:700}
.mn-erow.mn-w{grid-template-columns:minmax(0,1fr) 4.6rem}
.mn-wl{display:block;font-size:.88rem;margin:0 0 2px}
.mn-etrack{position:relative;display:flex;height:20px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.mn-seg{display:block;height:100%}
.mn-eval{font-variant-numeric:tabular-nums;text-align:right;font-weight:700}
.mn-c{background:var(--nu-carb)}.mn-f{background:var(--nu-fat)}.mn-p{background:var(--nu-protein)}
.mn-fib{background:repeating-linear-gradient(90deg,var(--nu-carb) 0 6px,var(--nu-carb-soft) 6px 8px)}
.mn-nat{background:var(--nu-carb-soft);box-shadow:inset 0 0 0 1.5px var(--nu-carb)}
.mn-add{background:var(--nu-carb)}
.mn-prow{display:grid;grid-template-columns:6.6rem minmax(0,1fr) 3.6rem;align-items:center;gap:8px;margin:0 0 6px}
.mn-plab{font-weight:700;font-size:.9rem}
.mn-pbars{display:grid;gap:3px}
.mn-ptrack{position:relative;display:block;height:18px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.mn-band{position:absolute;top:0;bottom:0;background:var(--hi-soft);border-left:1.5px dashed var(--ink-2);border-right:1.5px dashed var(--ink-2)}
.mn-pfill{position:absolute;left:0;top:4px;bottom:4px;border-radius:2px}
.mn-ptag{position:absolute;right:4px;top:0;font-size:.7rem;font-weight:700;line-height:16px;color:var(--ink-2)}
.mn-pval{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;font-size:.9rem;white-space:nowrap}
.mn-ans{border-top:1.5px solid var(--rule);margin-top:10px;padding-top:4px}

/* Part 3 label lab */
.mn-st{padding:4px 0 18px;margin:0 0 16px;border-bottom:1.5px solid var(--rule)}
.mn-st h3{margin-top:0}
.mn-st1{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 22px;align-items:start}
.mn-nftw{overflow-x:auto;max-width:100%}
.mn-nftw .hfa-nft{min-width:13rem}
.mn-lb{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:underline dotted var(--ink-2);text-underline-offset:3px;min-height:24px;cursor:pointer}
.mn-lb[aria-pressed="true"]{text-decoration:underline solid}
.mn-mean{padding:10px 14px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px;min-height:4em}
.mn-mean p{margin:0 0 .4em;max-width:none}
.mn-yogs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
.mn-yog h4{margin:0 0 6px}
.mn-ingh{margin:8px 0 4px;font-weight:700;font-size:.9rem}
.mn-ings{display:flex;flex-wrap:wrap;gap:6px}
.mn-ing{display:inline-flex;flex-direction:column;align-items:flex-start;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.25em .7em;min-height:34px;font-size:.92rem}
.mn-ing.natural{border-color:var(--nu-carb);background:var(--nu-carb-soft)}
.mn-ing.added{border:2.5px solid var(--nu-carb)}
.mn-ing.none{border-style:dashed}
.mn-ingk{font-size:.75rem;font-weight:700;color:var(--ink-2)}
.mn-yq{margin:12px 0 0}
.mn-yq p{margin:0}
.mn-sbars{margin:8px 0 4px}
.mn-data{margin:8px 0 0;padding-left:1.2em}
.mn-data li{margin:0 0 .3em}
.mn-breads{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.mn-bcard{border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.45em .85em;font-weight:700;min-height:40px;text-align:left}
.mn-bcard[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.mn-bread{margin:0 0 10px;min-height:3em}
.mn-bread p{margin:0 0 .4em}
mark.mn-first{background:var(--hi-soft);color:var(--ink);font-weight:700;padding:0 2px;border-bottom:2px solid var(--hi)}
.mn-slotx{margin:12px 0 0;padding-top:8px;border-top:1px solid var(--rule)}
.mn-slotx h5{margin:0 0 6px}
.mn-slotx input[type=file]{max-width:100%;font-size:.85rem}
.mn-fig{margin:8px 0}
.mn-fig img{max-width:100%;max-height:320px;border:1px solid var(--rule);border-radius:6px}
.mn-fig figcaption{font-size:.8rem;color:var(--ink-2)}

/* Energy detective */
#act-detective .numin{max-width:9rem}
.mn-dchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.mn-dchip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.3em .9em;min-height:38px;font-size:.92rem}
.mn-dchip b{font-weight:700;color:var(--ink-2)}
.mn-dchip[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.mn-dchip[aria-pressed="true"] b{color:var(--hi-ink)}

/* self check */
.mn-selfset{border:0;padding:0;margin:10px 0;display:grid;gap:6px}
.mn-selfbar{position:relative;height:22px;max-width:28rem;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:8px 0}
.mn-selffill{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,var(--nu-carb) 0 6px,var(--nu-carb-soft) 6px 8px)}
.mn-selfref{position:absolute;right:6px;top:0;line-height:20px;font-size:.75rem;font-weight:700;color:var(--ink-2)}

/* lunch box */
.mn-lbfs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 12px}
.mn-lbf{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.45em .65em;min-width:0}
.mn-lbf:not(:disabled):hover{border-color:var(--pen)}
.mn-lbf[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.mn-lbf:disabled{opacity:.5}
.mn-lbt{font-weight:700;line-height:1.25}
.mn-lbm{font-size:.78rem;color:var(--ink-2)}
.mn-lbg{font-size:.72rem;font-weight:700;border:1px solid var(--ink-2);border-radius:999px;padding:0 .5em;color:var(--ink-2)}

@media (max-width:820px){
  .mn-lab{grid-template-columns:minmax(0,1fr)}
  .mn-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .mn-st1,.mn-yogs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .mn-prow{grid-template-columns:5.4rem minmax(0,1fr) 4.4rem}
  .mn-fchips .chip{font-size:.8rem;padding:.2em .6em;min-height:30px}
  .mn-grow{gap:6px}
  .mn-aar{grid-template-columns:6.4rem minmax(0,1fr) 4.4rem;font-size:.84rem}
  .mn-lbfs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .mn-erow{grid-template-columns:2rem minmax(0,1fr) 4.6rem}
}
@media (prefers-reduced-motion:reduce){ .hero-fig figcaption.mn-cap{animation:none} }

</style>

},"aria":"Three molecule sketches, each labelled. Carbohydrate: glucose hexagons click together into a starch chain, 4 kcal/g. Lipid: glycerol with three fatty-acid tails; one tail gains a cis double bond and bends, so the tails stack loosely as a liquid oil, 9 kcal/g. Protein: amino-acid beads link into a chain that folds, 4 kcal/g.","caption":"Shape → function."},"goals":["I can describe the structure, functions and food sources of carbohydrates, including fibre.","I can explain the difference between saturated, unsaturated and trans fats, and why omega-3 and omega-6 fats are essential.","I can explain essential amino acids and how complementary proteins work.","I can calculate the energy and % of energy from each macronutrient in a food.","I can use a Nutrition Facts table to compare foods’ fats, sugars and fibre.","I can judge whether a meal’s macronutrient pattern fits the AMDRs for a persona, without moral labels."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Energy arithmetic","goal":4,"prompt":"A food has 10 g of fat. How many kilocalories come from fat?","options":[{"t":"10 kcal","why":"Multiply by kcal per gram.","_n":"006d","_k":"0861ddf7"},{"t":"40 kcal","why":"Fat gives 9 kcal per gram.","_n":"105d","_k":"61f21e9d"},{"t":"90 kcal","why":"10 × 9 = 90.","_n":"204d","_k":"93844574"},{"t":"19 kcal","why":"10 × 9, not 10 + 9.","_n":"303d","_k":"a59f68d9"}],"hints":["kcal per gram of fat?","9.","10 × 9 = 90."]},{"id":"w2","skill":"Energy arithmetic","goal":4,"prompt":"A snack has 120 kcal from carbohydrate out of 240 kcal total. What percentage of its energy plain":"Same sugar grams, different package."}],"challenges":[{"id":"tc1","goal":4,"prompt":"A granola bar’s label shows 30 g of carbohydrate, 4 g of fat and 11 g of protein. Enter the % of energy from each.","why":"120 + 36 + 44 = 200 kcal, so 60%, 18% and 22%.","general":"Each box needs that nutrient’s kcal ÷ total kcal × 100. Type your answers in the “Your % of energy” boxes in Measure mode.","msgs":{"grams":"Those are % of grams. Convert to kcal first: fat × 9.","boxes":"Check which box is which.","empty":"Type a % in each of the three boxes in Measure mode."},"hints":["kcal: 30 × 4, 4 × 9, 11 × 4.","120 + 36 + 44 = 200 kcal.","120/200 = 60%, 36/200 = 18%, 44/200 = 22%."]},{"id":"tc2","goal":2,"prompt":"On the fat bench, build an 18-carbon fatty acid that is \u003cstrong>liquid at room temperature\u003c/strong> and is an \u003cstrong>omega-3\u003c/strong>.","why":"Every double bond is cis, so the chain kinks (liquid), and the first one is at carbon 3 from the omega end.","msgs":{"omega":"Liquid, but that’s an omega-{n}.","trans":"A trans bond keeps the chain straight, like saturated fat.","none":"Saturated: solid at room temperature."},"hints":["Count from the omega (methyl) end.","Put a cis double bond at carbon 3 from that end.","For example, cis bonds at omega-3, 6 and 9 (alpha-linolenic acid)."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Choose \u003cstrong>two\u003c/strong> plant foods so that every essential amino-acid bar reaches 100% of the reference.","why":"Each food covers the other’s low amino acid.","msgs":{"grains":"Both are low in lysine.","legumes":"Both are low in methionine.","spinach":"Spinach has too little protein to fill the gap.","two":"Choose two plant foods on the protein bench."},"hints":["Which amino acid is each food low in?","Grains lack lysine; legumes lack methionine.","Rice and lentils, pita and hummus, or a corn tortilla and black beans."]}],"blocks":[{"title":"What the lab shows","html":"\u003cp>Structure explains behaviour and value: \u003cstrong>kinks make oils\u003c/strong>, \u003cstrong>β-bonds make fibre\u003c/strong>, and \u003cstrong>missing amino acids make complementary pairs\u003c/strong>. Fat’s 9 kcal/g means percentages need kcal, not grams.\u003c/p>"}]},"part3":{"slug":"fats-sugars","name":"Fats & sugars","heading":"Read the fats and sugars","intro":"Leave the molecule benches for \u003cstrong>labels\u003c/strong>: the same structures, as shoppers see them. Work through three stations, then the quick check.","fat":{"title":"Station 1: The fat lines","intro":"A label (practice model) shows Fat 10 g; Saturated 3 g + Trans 0 g, 15% DV; Cholesterol 10 mg. Tap each line to see what it means.","rows":[{"id":"fat","t":"Fat 10 g","mean":"All the fat in one serving. At 9 kcal per gram, 10 g gives 90 kcal."},{"id":"sat","t":"Saturated 3 g","dv":"15 %","sub":true,"mean":"Saturated and trans fats are grouped because both raise LDL cholesterol. Together they give 15% DV: a lot, by the 5/15 rule."},{"id":"trans","t":"+ Trans 0 g","sub":true,"mean":"Canada prohibited partially hydrogenated oils in foods in 2018, so most labels now show 0 g."},{"id":"chol","t":"Cholesterol 10 mg","mean":"Cholesterol is listed on its own line, in milligrams: 10 mg is 0.01 g."}]},"yogurt":{"title":"Station 2: Check it with data, two yogurts","intro":"Two practice-model yogurt labels. Tap each ingredient to see whether it brings sugar.","labels":[{"id":"plain","t":"Plain yogurt","sug":6,"dv":"6 %","ing":["milk","cultures"]},{"id":"vanilla","t":"Vanilla yogurt","sug":16,"dv":"16 %","ing":["milk","sugar","cultures"]}],"ing":{"milk":{"t":"Milk","kind":"natural","fb":"Milk contains lactose: naturally occurring sugar."},"sugar":{"t":"Sugar","kind":"added","fb":"Added sugar."},"cultures":{"t":"Bacterial cultures","kind":"none","fb":"No sugar here."}},"prompt":"Which sugars are naturally occurring?","answerText":"The lactose in the milk: about the 6 g in both.","data":["Plain: 6 g of sugars and no sugar in the ingredients, so all 6 g come from the milk’s lactose.","Vanilla: 16 g − 6 g = 10 g of added sugar, about.","The Daily Value for sugars is 100 g, so grams and %DV match: 6 g is 6% DV and 16 g is 16% DV.","Labels now show total sugars, so check the ingredient list for added sugars. Ingredient lists group sugars."]},"bread":{"title":"Station 3: Fibre finder","intro":"Three bread labels (practice model). Tap each bread to read its fibre line and its first ingredient.","breads":[{"id":"white","t":"White bread","fi":1,"ing":["Enriched wheat flour","water","yeast","salt"]},{"id":"multi","t":"“Multigrain” bread","fi":2,"ing":["Enriched wheat flour","water","oats","flaxseed","millet","yeast","salt"]},{"id":"whole","t":"100% whole grain whole wheat bread","fi":4,"ing":["Whole grain whole wheat flour","water","yeast","salt"]}],"point":"“Multigrain” isn’t the same as whole grain. Read the fibre line and the first ingredient."},"real":{"title":"Real examples (your teacher chooses)","intro":"Your teacher will share two current real products from a store or flyer, photographed and credited with the brand and date: a pair where the front of the package suggests “healthy” but the label tells a fuller story. Add a photo to look at it here. The picture stays on this page only: it isn’t saved or sent anywhere.","slots":["Product 1","Product 2"],"prompts":["The fat lines: what do Saturated + Trans and its %DV tell you?","Sugars: which are naturally occurring, and which are added? Check the ingredient list.","Fibre: what do the fibre line and the first ingredient tell you?"],"credit":"Shown for education (fair dealing)."},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Dietary reference intakes tables\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Nutrition labelling: Nutrition facts table\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Fats & sugars quick check","summary":"Fats & sugars quick check","items":[{"id":"q1","goal":2,"prompt":"Why are saturated and trans fat combined on Canadian labels?","choices":[{"t":"Both are essential","fb":"They share a health effect.","_n":"1416f","_k":"eb4e0033"},{"t":"Both are carbohydrates","fb":"They share a health effect.","_n":"1519f","_k":"b322f171"},{"t":"Both raise LDL cholesterol","fb":"Right. They share a health effect.","_n":"1618f","_k":"15851740"},{"t":"Both come from fish","fb":"They share a health effect.","_n":"171bf","_k":"f65d9120"}]},{"id":"q2","goal":5,"prompt":"Plain yogurt shows 6 g of sugars and no sugar in the ingredients. Where do the sugars come from?","choices":[{"t":"Lactose in milk","fb":"Right. Naturally occurring sugar.","_n":"181af","_k":"8e4d49cf"},{"t":"Added sugar","fb":"Naturally occurring sugar.","_n":"191df","_k":"0fe6729c"},{"t":"Fibre","fb":"Naturally occurring sugar.","_n":"1a1cf","_k":"9b9468a7"},{"t":"Fat","fb":"Naturally occurring sugar.","_n":"1b1ff","_k":"37690cd1"}]},{"id":"q3","goal":[1,5],"prompt":"Which bread is whole grain?","choices":[{"t":"Brown colour","fb":"Names and colours can mislead.","_n":"1c1ef","_k":"2c43a2ef"},{"t":"Name says “multigrain”","fb":"Names and colours can mislead.","_n":"1d31f","_k":"cb962602"},{"t":"First ingredient “whole grain whole wheat flour”","fb":"Right. Names and colours can mislead.","_n":"1e32f","_k":"0994b7cb"},{"t":"Contains seeds","fb":"Names and colours can mislead.","_n":"1f2ff","_k":"b490c548"}]},{"id":"q4","goal":5,"prompt":"A cereal has Sugars 3% DV. A little or a lot?","choices":[{"t":"Can’t tell","fb":"5% or less is a little.","_n":"1g30f","_k":"98b26694"},{"t":"Medium","fb":"5% or less is a little.","_n":"1h2df","_k":"0ca8d41c"},{"t":"A lot","fb":"5% or less is a little.","_n":"1i2ef","_k":"836882a0"},{"t":"A little","fb":"Right. 5% or less is a little.","_n":"1j2bf","_k":"ba4404eb"}]}]}},"practice":{"activities":[{"id":"jobs","type":"match","title":"Nutrient ↔ job or source","summary":"Nutrient ↔ job","goal":[1,2,3],"instruction":"Match each nutrient to its job or a food source. One card on the right has no partner.","leftTitle":"Nutrient","rightTitle":"Job or source","left":[{"id":"l1","t":"Soluble fibre","goal":1,"hints":["Think shape, then job.","It’s one of these two: “Helps lower LDL cholesterol; oats, beans” or “Adds bulk and keeps digestion regular; wheat bran”.","Soluble fibre ↔ Helps lower LDL cholesterol; oats, beans."]},{"id":"l2","t":"Insoluble fibre","goal":1,"hints":["Think shape, then job.","It’s one of these two: “Adds bulk and keeps digestion regular; wheat bran” or “Helps lower LDL cholesterol; oats, beans”.","Insoluble fibre ↔ Adds bulk and keeps digestion regular; wheat bran."]},{"id":"l3","t":"Glycogen","goal":1,"hints":["Think shape, then job.","It’s one of these two: “Stored glucose in liver and muscle” or “Plant glucose store”.","Glycogen ↔ Stored glucose in liver and muscle."]},{"id":"l4","t":"Omega-3 fatty acids","goal":2,"hints":["Think shape, then job.","It’s one of these two: “Essential; flaxseed, walnuts, fatty fish” or “Straight chain from partial hydrogenation; raises LDL”.","Omega-3 fatty acids ↔ Essential; flaxseed, walnuts, fatty fish."]},{"id":"l5","t":"Trans fat","goal":2,"hints":["Think shape, then job.","It’s one of these two: “Straight chain from partial hydrogenation; raises LDL” or “Essential; flaxseed, walnuts, fatty fish”.","Trans fat ↔ Straight chain from partial hydrogenation; raises LDL."]},{"id":"l6","t":"Essential amino acids","goal":3,"hints":["Think shape, then job.","It’s one of these two: “Nine the body can’t make; must come from food” or “Rice with lentils; hummus with pita”.","Essential amino acids ↔ Nine the body can’t make; must come from food."]},{"id":"l7","t":"Complementary proteins","goal":3,"hints":["Think shape, then job.","It’s one of these two: “Rice with lentils; hummus with pita” or “Nine the body can’t make; must come from food”.","Complementary proteins ↔ Rice with lentils; hummus with pita."]},{"id":"l8","t":"Phospholipids","goal":2,"hints":["Think shape, then job.","It’s one of these two: “Form cell membranes” or “Essential; flaxseed, walnuts, fatty fish”.","Phospholipids ↔ Form cell membranes."]}],"right":[{"id":"r1","t":"Helps lower LDL cholesterol; oats, beans"},{"id":"r2","t":"Adds bulk and keeps digestion regular; wheat bran"},{"id":"r3","t":"Stored glucose in liver and muscle"},{"id":"r4","t":"Essential; flaxseed, walnuts, fatty fish"},{"id":"r5","t":"Straight chain from partial hydrogenation; raises LDL"},{"id":"r6","t":"Nine the body can’t make; must come from food"},{"id":"r7","t":"Rice with lentils; hummus with pita"},{"id":"r8","t":"Form cell membranes"},{"id":"r9","t":"Plant glucose store"}],"_a":"HhMKVxtYQxBUE0pEVVBDWEdDVEQVQA1RRwtEFApATUAJBURcGxBVQEkTClMbWEMQUBNKRFVUQ1hHQ1BEFUANVUcLRBQOQE1ACQlEXBsQWUAY","wrong":{"l1|r2":"Soluble fibre forms a gel; insoluble fibre adds bulk.","l2|r1":"Soluble fibre forms a gel; insoluble fibre adds bulk.","l3|r9":"Starch is the plant store; glycogen is the animal store.","l5|r4":"Omega-3s are kinked cis fats; trans fats are straight.","l4|r5":"Omega-3s are kinked cis fats; trans fats are straight."},"wrongDefault":"Match the structure to its job."},{"id":"detective","type":"custom","title":"Energy detective","summary":"Energy detective","star":true,"goal":[4,6],"instruction":"Six energy puzzles. The ★ items are non-routine: work backwards, add to a meal, or plan a day.","how":"Type a number and press Check, or tap your choices. Units like % or g are optional.","items":[{"id":"n1","kind":"num","goal":4,"prompt":"A snack: 45 g carbohydrate, 8 g fat, 12 g protein. Total kcal?","_a":"VgFW","unit":"kcal","why":"45 × 4 + 8 × 9 + 12 × 4 = 180 + 72 + 48 = 300 kcal.","wrong":[{"match":65,"fb":"Those are grams; convert to kcal."}],"hints":["Convert each nutrient to kcal: carbohydrate and protein give 4 kcal/g, fat 9 kcal/g.","45 × 4 = 180, 8 × 9 = 72, 12 × 4 = 48.","180 + 72 + 48 = 300 kcal."]},{"id":"n2","kind":"num","goal":4,"prompt":"Same snack: % of energy from fat?","_a":"VwU=","unit":"%","why":"Fat: 8 × 9 = 72 kcal, and 72 ÷ 300 = 24%.","wrong":[{"match":12,"fb":"8 ÷ 65 grams. Use kcal: 72 ÷ 300."}],"hints":["Use kcal, not grams: fat kcal ÷ total kcal.","Fat: 8 × 9 = 72 kcal, out of 300 kcal.","72 ÷ 300 = 0.24, so 24%."]},{"id":"n3","kind":"multi","star":true,"goal":[4,6],"prompt":"A meal: 50 g carbohydrate, 20 g fat, 30 g protein. Which nutrients are outside the 4–18 AMDR? \u003cstrong>(Choose all that apply.)\u003c/strong>","options":[{"t":"Carbohydrate","miss":"Check carbohydrate too: 200 ÷ 500 = 40%, below 45%.","_n":"1k2cf","_k":"8f7179cf"},{"t":"Fat","miss":"Check fat too: 180 ÷ 500 = 36%, just above 35%.","_n":"1l29f","_k":"39e133b6"},{"t":"Protein","why":"120 ÷ 500 = 24%, inside 10–30%.","_n":"1m2af","_k":"daf2e140"}],"why":"Carbohydrate (200 ÷ 500 = 40%) and fat (180 ÷ 500 = 36%) are outside the ranges; protein (24%) is inside.","hints":["Find each nutrient’s % of energy, then compare it with 45–65%, 25–35% and 10–30%.","Total: 200 + 180 + 120 = 500 kcal.","Carbohydrate 200 ÷ 500 = 40% (below 45%), fat 180 ÷ 500 = 36% (above 35%), protein 120 ÷ 500 = 24% (inside). Choose carbohydrate and fat."]},{"id":"n4","kind":"num","star":true,"goal":4,"prompt":"A 200 kcal drink gets 25% of its energy from protein. How many grams of protein?","_a":"VANIUw==","unit":"g","why":"25% of 200 kcal = 50 kcal, and 50 ÷ 4 kcal/g = 12.5 g.","wrong":[{"match":50,"fb":"25% of 200 kcal is 50 kcal; ÷ 4 kcal/g."}],"hints":["Work backwards: find the protein kcal first.","25% of 200 kcal = 50 kcal.","50 kcal ÷ 4 kcal/g = 12.5 g."]},{"id":"n5","kind":"num","star":true,"goal":[4,6],"prompt":"A 315 kcal lunch has 5 g of fat. You add 5 g of olive oil. What percentage of the \u003cstrong>new\u003c/strong> total energy is from fat?","_a":"VwQ=","unit":"%","why":"Fat: 45 + 45 = 90 kcal. Total: 315 + 45 = 360 kcal. 90 ÷ 360 = 25%.","wrong":[{"match":14,"fb":"That’s the old lunch (45 ÷ 315). Add the oil to both the fat and the total: 90 ÷ 360."},{"match":50,"fb":"The total changes too: 315 + 45 = 360 kcal."}],"hints":["Both the fat and the total change when you add oil.","Fat: 5 g + 5 g = 10 g, so 90 kcal. Total: 315 + 45 = 360 kcal.","90 ÷ 360 = 0.25, so 25%."]},{"id":"n6","kind":"pair","star":true,"goal":6,"need":26,"have":14,"prompt":"Persona Jordan (16) needs about 26 g of fibre a day (AI). Lunch gave 9 g and breakfast 5 g. Which dinner-and-snack pair from the chips reaches 26 g with the fewest items?","chips":[{"id":"curry","t":"Lentil curry","g":8},{"id":"rice","t":"Brown rice","g":3},{"id":"apple","t":"Apple","g":4},{"id":"rasp","t":"Raspberries, 1 cup","g":8},{"id":"pasta","t":"White pasta","g":2}],"_a":"PmpEB0kSDQdHHUQFTBATG0dsSj0bAxESCVREShsQABEVEztKYkACFxdDH0QVQBMDFkFEO2Q=","wrong":{"curry+rice":"That adds 11 g, so 25 g in total, 1 g short.","pasta":"Only 2 g; it can’t close a 12 g gap with one partner.","short":"That adds {a} g, so {t} g in total, {s} g short.","count":"Choose two chips: one dinner-and-snack pair."},"why":"Three pairs work: lentil curry + apple (12 g → 26 g), raspberries + apple (12 g → 26 g), lentil curry + raspberries (16 g → 30 g).","hints":["How much more fibre is needed? 26 − 14 = 12 g.","Which two chips add to 12 g or more?","Lentil curry (8 g) + apple (4 g) = 12 g, or lentil curry + raspberries = 16 g."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Benedikt","goal":[2,3,4],"how":"","instruction":"Benedikt made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Find the % of energy from fat in a muffin: 40 g carbohydrate, 15 g fat, 5 g protein.","steps":["Total grams: 40 + 15 + 5 = 60 g.","Fat: 15 ÷ 60 = 25%.","So 25% of the muffin’s energy is from fat."],"_a":"VQ==","stepFb":["","Step 2 uses step 1’s grams. The mistake is earlier.","Step 3 repeats it."],"fixes":[{"t":"Use 100 g as the total.","why":"Use the real total.","_n":"1nabf","_k":"0d7713a1"},{"t":"Step 1 is correct.","why":"Percent of energy needs kcal.","_n":"1oaaf","_k":"2c705c27"},{"t":"Fat: 15 × 4 = 60 kcal.","why":"Fat is 9 kcal/g.","_n":"1pa9f","_k":"516542bc"},{"t":"Convert to kcal: 160 + 135 + 20 = 315 kcal; fat 135 ÷ 315 ≈ 43%.","why":"Fat has 9 kcal per gram. Convert to kcal before finding percentages.","_n":"1qa8f","_k":"607288d3"}],"hints":["Grams or kcal?","Fat × 9.","About 43%."]},{"id":"e2","goal":2,"task":"Advise a persona who wants to eat “as little fat as possible”.","steps":["Fat has 9 kcal per gram, the most of the three.","So the healthiest diet has close to zero fat.","Choose fat-free products for everything."],"_a":"VA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"So eat only butter.","why":"Swinging to saturated fats doesn’t help.","_n":"1raff","_k":"bd6b17d1"},{"t":"Fats carry vitamins A, D, E and K and provide essential omega-3 and omega-6 fats. The AMDR for adults is 20–35% of energy; choose mostly unsaturated sources.","why":"Fats carry vitamins A, D, E and K and supply essential fatty acids. The type matters more than avoiding fat.","_n":"1saef","_k":"04e98ddc"},{"t":"Step 2 is correct.","why":"Fats carry vitamins A, D, E and K and supply essential fatty acids. The type matters more than avoiding fat.","_n":"1tadf","_k":"6182b461"},{"t":"So count every gram.","why":"Counting isn’t the issue; the type and pattern are.","_n":"1uacf","_k":"dadb442b"}],"hints":["What jobs do fats do?","Vitamins and essential fatty acids.","Fats carry vitamins A, D, E and K and provide essential omega-3 and omega-6 fats; aim for 20–35% of energy (adults), mostly from unsaturated sources."]},{"id":"e3","goal":3,"task":"Plan a complete-protein vegetarian lunch.","steps":["Plant foods are often low in one essential amino acid.","Grains are low in lysine.","So pair rice with whole-wheat bread to cover lysine.","That makes the lunch complete."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Plant proteins can’t be complete.","why":"Pairs can be; soy and quinoa are complete alone.","_n":"1va3f","_k":"94d908fc"},{"t":"Step 3 is correct.","why":"Both are grains, both low in lysine.","_n":"1wa2f","_k":"6b30cdc0"},{"t":"Pair rice with a legume such as lentils or black beans, which supply lysine.","why":"Pair a grain with a legume: each covers the other’s low amino acid.","_n":"1xa5f","_k":"9c907813"},{"t":"Add more rice.","why":"More rice adds more of the same gap.","_n":"1ya6f","_k":"dbacfc9e"}],"hints":["Which foods are rich in lysine?","Legumes.","Pair rice with a legume such as lentils or black beans, which supply lysine."]}]}]},"reflect":{"support":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>","journal":[{"id":"j1","q":"Which structure in the lab (the kink, the β-bond, the missing amino acid) best explained a food fact you already knew?"},{"id":"j2","q":"In your own words, why must you convert grams to kcal before finding % of energy?"},{"id":"j3","q":"Explain to a friend how to build a complete-protein meal without meat."},{"id":"j4","q":"Which label line will you look at differently now, and why?"}],"self":{"title":"Self check: one typical lunch","intro":"Pick one typical lunch you eat. Does it include a carbohydrate source, a protein source and a fat source? About how many grams of fibre?","privacy":"Nothing you enter here is scored, saved or sent. It stays on this page, on this device, and it isn’t added to your results summary.","open":"Open the self check","sources":["A carbohydrate source","A protein source","A fat source"],"fibreLabel":"About how many grams of fibre?","ref":26,"refText":"General reference used in this module: about 26 g of fibre a day (Jordan’s AI). It’s a reference for a whole day, not a target for you.","advice":"For your own health, talk to a doctor, nurse or registered dietitian."}},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which carbohydrate do human digestive enzymes \u003cstrong>not\u003c/strong> break down for energy?","options":[{"t":"Starch","why":"Digested to glucose.","_n":"1za7f","_k":"de1c91ec"},{"t":"Glycogen","why":"Digested to glucose.","_n":"20a8f","_k":"6b90f938"},{"t":"Sucrose","why":"Split into glucose and fructose.","_n":"21a9f","_k":"da4f2d34"},{"t":"Cellulose (insoluble fibre)","why":"Its β-bonds resist human enzymes.","_n":"22aaf","_k":"43ca17d0"}]},"b":{"prompt":"Which carbohydrate is the storage form of glucose in animals?","options":[{"t":"Lactose","why":"Milk sugar.","_n":"23abf","_k":"9d20140d"},{"t":"Cellulose","why":"Plant cell walls; fibre.","_n":"24acf","_k":"adf6e533"},{"t":"Starch","why":"Plant storage.","_n":"259df","_k":"d609dd51"},{"t":"Glycogen","why":"Stored in liver and muscle.","_n":"269ef","_k":"d4b7ce48"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Why are trans fats harmful compared with cis unsaturated fats?","options":[{"t":"Their straight chains pack like saturated fat, and they raise LDL and lower HDL","why":"A trans bond keeps the chain straight, so trans fats pack like saturated fat and raise LDL.","_n":"279fe","_k":"acf7d91f"},{"t":"They contain no carbon","why":"They are fatty acids.","_n":"289ee","_k":"179037b8"},{"t":"They are essential","why":"Not essential.","_n":"29a1e","_k":"4fe36185"},{"t":"They are carbohydrates","why":"They are lipids.","_n":"2aa0e","_k":"0d2ce118"}]},"b":{"prompt":"What makes omega-3 fatty acids “essential”?","options":[{"t":"They’re found only in supplements","why":"Flaxseed, walnuts and fish are food sources.","_n":"2b9be","_k":"fa9b2b1d"},{"t":"They are saturated","why":"They are polyunsaturated.","_n":"2c9ae","_k":"1152a817"},{"t":"The body can’t make them, so they must come from food","why":"Omega-3 and omega-6 fatty acids are essential: the body can’t make them.","_n":"2d9de","_k":"e4a9421e"},{"t":"They give more than 9 kcal/g","why":"All fats give about 9 kcal/g.","_n":"2e9ce","_k":"9b6bfef7"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A food has 20 g of carbohydrate, 5 g of fat and 10 g of protein. Total energy?","options":[{"t":"35 kcal","why":"Those are grams.","_n":"2fa7e","_k":"26e60c80"},{"t":"165 kcal","why":"80 + 45 + 40.","_n":"2ga6e","_k":"f91c2d47"},{"t":"140 kcal","why":"Fat counted at 4 kcal/g.","_n":"2h99e","_k":"48855304"},{"t":"315 kcal","why":"All counted at 9 kcal/g.","_n":"2i9ae","_k":"1b813e4d"}]},"b":{"prompt":"A food has 30 g of carbohydrate, 10 g of fat and 5 g of protein. Total energy?","options":[{"t":"180 kcal","why":"Fat at 4 kcal/g.","_n":"2j97e","_k":"cf717d64"},{"t":"45 kcal","why":"Grams.","_n":"2k98e","_k":"bd9a921a"},{"t":"230 kcal","why":"120 + 90 + 20.","_n":"2l9de","_k":"03585066"},{"t":"405 kcal","why":"All at 9.","_n":"2m9ee","_k":"13bf787d"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A 300 kcal smoothie has 9 g of fat. Is its fat within the 4–18 AMDR (25–35%)?","options":[{"t":"No: 9 g is too much fat","why":"Judge by % of energy.","_n":"2n9be","_k":"f525bd59"},{"t":"No: 9 ÷ 300 = 3%","why":"Grams ÷ kcal mixes units.","_n":"2o9ce","_k":"f0c87b35"},{"t":"Can’t tell without carbohydrate grams","why":"Fat kcal and the total are enough.","_n":"2pa1e","_k":"488732dc"},{"t":"Yes: 9 × 9 = 81 kcal, and 81 ÷ 300 = 27%","why":"27% is inside 25–35%.","_n":"2qa2e","_k":"a8323561"}]},"b":{"prompt":"A 400 kcal bowl has 16 g of fat. Is its fat within 25–35%?","options":[{"t":"Yes: 16 ÷ 400 = 4%","why":"Fat has 9 kcal per gram. Convert to kcal before finding percentages.","_n":"2r0dc","_k":"135b85b6"},{"t":"No: 16 × 9 = 144 kcal, and 144 ÷ 400 = 36%, just above 35%","why":"Close, but outside the range.","_n":"2s0ec","_k":"36ef0db1"},{"t":"Can’t tell","why":"Fat kcal and the total suffice.","_n":"2t0bc","_k":"e3ce7746"},{"t":"Yes: 16 g is moderate","why":"Judge by % of energy.","_n":"2u0cc","_k":"fa4e7dee"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A family’s traditional meal is corn tortillas with black beans. A cousin says it “lacks complete protein”. Best response?","options":[{"t":"Protein completeness doesn’t matter","why":"It matters over a day’s eating.","_n":"2v09c","_k":"cf231407"},{"t":"Corn (low in lysine) and beans (low in methionine) cover each other, so the pair supplies all essential amino acids","why":"Pair a grain with a legume: each covers the other’s low amino acid.","_n":"2w0ac","_k":"b6b01071"},{"t":"Add more tortillas","why":"More of the same gap.","_n":"2x07c","_k":"4eb0d1a7"},{"t":"The cousin is right; only meat is complete","why":"Pair a grain with a legume: each covers the other’s low amino acid.","_n":"2y08c","_k":"e9f84b6d"}]},"b":{"prompt":"A student eats peanut butter on whole-wheat toast. Complete protein?","options":[{"t":"Only with meat added","why":"Pair a grain with a legume: each covers the other’s low amino acid.","_n":"2z05c","_k":"a262d2f7"},{"t":"No; peanuts are nuts, not legumes","why":"Peanuts are legumes.","_n":"3006c","_k":"0dad29d5"},{"t":"Yes, in effect: a legume with a grain covers lysine and methionine","why":"Peanuts are legumes and whole wheat is a grain: each covers the other’s low amino acid.","_n":"31f3c","_k":"16634498"},{"t":"No; toast has no protein","why":"Whole wheat has protein, low in lysine.","_n":"32f2c","_k":"2ea8e339"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A persona’s lunch is 50% carbohydrate, 30% fat and 20% protein, and includes vegetables and a whole grain. Which statement fits?","options":[{"t":"It must be 33% of each","why":"AMDRs ges.","_n":"4288d","_k":"64e76cad"}]},"b":{"prompt":"Adjust a stir-fry so that more of its fat is unsaturated. Which change best does it?","options":[{"t":"Cook in canola oil instead of butter","why":"Swapping saturated for unsaturated fats is the evidence-based change; removing all fat isn’t.","_n":"437dd","_k":"f2f1e472"},{"t":"Remove all oil","why":"Overcorrects; the meal needs some fat for vitamins.","_n":"447ed","_k":"76276c1f"},{"t":"Add coconut oil","why":"Mostly saturated.","_n":"458bd","_k":"6f4fdb18"},{"t":"Add more rice","why":"Doesn’t change the fat type.","_n":"468ad","_k":"36f9f160"}]}}]},"task":{"title":"Balanced lunch box","summary":"Balanced lunch box","statement":"\u003cp>Choose \u003cstrong>four\u003c/strong> foods for the lunch of persona \u003cstrong>Jordan, 16\u003c/strong>, so the lunch matches the patterns below. There are many good answers. Find one, then try a different one.\u003c/p>\u003cp class=\"tiny muted\">Per serving; practice-model values. Tap a food to add it; tap it again to remove it. The bars compare the lunch’s % of energy with the 4–18 AMDR bands.\u003c/p>","foods":[{"id":"wrap","t":"Whole-grain wrap","c":30,"f":4,"p":6,"fi":4,"g":"wg"},{"id":"bun","t":"White bun","c":28,"f":2,"p":5,"fi":1},{"id":"hummus","t":"Hummus (¼ cup)","c":8,"f":8,"p":4,"fi":3},{"id":"chicken","t":"Chicken breast (75 g)","c":0,"f":3,"p":23,"fi":0},{"id":"cheddar","t":"Cheddar (30 g)","c":0,"f":10,"p":7,"fi":0},{"id":"apple","t":"Apple","c":25,"f":0,"p":0,"fi":4,"g":"vf","sug":19},{"id":"carrots","t":"Baby carrots (1 cup)","c":12,"f":0,"p":1,"fi":3,"g":"vf"},{"id":"yogurt","t":"Plain yogurt (¾ cup)","c":12,"f":4,"p":8,"fi":0},{"id":"chips","t":"Potato chips (small bag)","c":15,"f":10,"p":2,"fi":1},{"id":"almonds","t":"Almonds (¼ cup)","c":7,"f":18,"p":8,"fi":4},{"id":"cookie","t":"Chocolate chip cookie","c":20,"f":7,"p":2,"fi":1},{"id":"rice","t":"Brown rice salad (1 cup)","c":40,"f":5,"p":5,"fi":3,"g":"wg"}],"checks":["Carbohydrate 45–65% of energy","Fat 25–35% of energy","Protein 10–30% of energy","Fibre 8 g or more","Includes a vegetable or fruit","Includes a whole grain"],"tips":["Carbohydrate is low: add a grain or fruit.","Fat is low: hummus, cheese or almonds add some.","Protein is low: add chicken, yogurt, hummus or cheese.","Add a higher-fibre food: the wrap, the apple, almonds or hummus.","Canada’s Food Guide fills half the plate with vegetables and fruit.","Choose the whole-grain wrap or the brown rice salad."],"tipsHigh":["Carbohydrate is high: add a protein or fat source.","Fat is high: swap a high-fat item.","Protein is high: add a grain or fruit."],"explainPrompt":"Explain how your lunch balances the three macronutrients and why you chose its fibre sources.","vocab":"Use the words % of energy, AMDR, fibre, complete protein and unsaturated.","checkLabel":"Check my lunch","success":"This lunch fits every pattern.","more":"There’s more than one answer. Can you find another?"},"cards":[["kcal per gram","Carbohydrate 4 · Protein 4 · Fat 9."],["% of energy","Nutrient kcal ÷ total kcal × 100, e.g. 36 kcal fat in 200 kcal = 18%."],["Fibre","Plant carbohydrate humans can’t digest; soluble (oats) lowers LDL, insoluble (bran) adds bulk."],["Glycogen vs starch","Animal glucose store (liver, muscle) vs plant glucose store."],["Saturated fat","No double bonds; straight chains; solid at room temperature, e.g. butter."],["Unsaturated fat","Cis double bonds kink chains; liquid oils, e.g. canola, olive."],["Trans fat","Straight chain from partial hydrogenation; raises LDL; restricted in Canada since 2018."],["Omega-3","Essential polyunsaturated fat; first double bond at carbon 3 from the omega end; flax, walnuts, fish."],["Essential amino acids","Nine the body can’t make; food must supply them."],["Complementary proteins","Grain + legume, e.g. rice and lentils, cover each other’s low amino acid."],["AMDR (ages 4–18)","Carbohydrate 45–65%, fat 25–35%, protein 10–30% of energy."],["%DV rule","5% or less is a little; 15%
