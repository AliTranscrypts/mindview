.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;

--nu-water-soft:rgba(35,67,196,.12);--leaf-soft:rgba(79,107,46,.15);--plate-grain-soft:rgba(107,90,30,.14)}

:root:not([data-theme="light"]){--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;

--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
}
:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 21: hero (world map + production bar), World hunger map (F11 world map, profile cards, causes overlay, readout),
   Why hunger persists (cause-map builder, model scenarios), Data detective, nutrition-response task.
   Hunger shading: a single-hue ramp of --pen (opacity carries the rate; every value is also written). Threshold lines --ink-2
   dashed. Double-burden ribbon magenta --p-c, always with its words. Red and green only in feedback. */
/* radio groups and switch (from HFA4U 16 / 14) */
.gh-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.gh-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem;margin:0}
.gh-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.gh-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.gh-chipset button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.gh-chipset button:hover:not(:disabled){border-color:var(--pen)}
.gh-chipset button[aria-checked="true"],.gh-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.gh-chipset button:disabled{opacity:.8}
.gh-sw{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:40px;font-size:.92rem;max-width:100%}
.gh-sw:hover{border-color:var(--pen)}
.gh-swt{position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;border:2px solid var(--ink-2);background:var(--paper)}
.gh-swt i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.gh-sw[aria-checked="true"]{border-color:var(--ink)}
.gh-sw[aria-checked="true"] .gh-swt{background:var(--hi);border-color:var(--ink)}
.gh-sw[aria-checked="true"] .gh-swt i{left:18px;background:var(--ink)}
.gh-swl{flex:1 1 auto;min-width:0}
.gh-swv{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-2);min-width:1.8rem;text-align:right}
.gh-h4{margin:0 0 6px;font-size:1rem}
.gh-h5{margin:0 0 4px;font-size:.95rem}

/* hero */
.hero .hero-eq .gh-eqsub{display:block;font:400 .95rem/1.4 var(--font-ui);color:var(--ink-2);margin-top:.5em;letter-spacing:.01em}
.gh-hero{width:100%}
.gh-hsvg{display:block;width:100%;height:auto}
.gh-hlab{fill:var(--ink);font:700 17px var(--font-ui);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.gh-hlab.sm{font-weight:400}
.gh-hlab.low{fill:var(--ink-2);font-weight:400}
.gh-hleg{fill:var(--ink);font:700 15px var(--font-ui)}
.gh-hlegv{fill:var(--ink-2);font:400 14px var(--font-ui)}
.gh-hbar{fill:var(--ink-2)}
.gh-hbase{stroke:var(--ink);stroke-width:2;fill:none}
.gh-henough{stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5;fill:none}
.gh-hbt{fill:var(--ink);font:400 15px var(--font-ui)}
.gh-htag{fill:var(--ink-2);font:700 12px var(--font-ui);letter-spacing:.04em;text-transform:uppercase}
.hero-fig figcaption.gh-cap{font:700 1.15rem var(--font-ui)}

/* F11 world map */
.gh-land{fill:var(--sheet);stroke:var(--ink-2);stroke-linejoin:round}
.gh-shade{fill:var(--pen);stroke:none;pointer-events:none}
.gh-selo{fill:none;stroke:var(--ink);stroke-linejoin:round}
.gh-circ{fill:var(--pen);fill-opacity:.3;stroke:var(--pen)}
.gh-circ.sel{fill-opacity:.45;stroke:var(--ink)}
.gh-mapw{position:relative;margin:4px 0 0}
.gh-map{display:block;width:100%;height:auto;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px}
.gh-mtag{position:absolute;left:8px;bottom:8px;background:var(--sheet)}
.gh-rbtns{display:block}
.gh-rb{position:absolute;transform:translate(-50%,-50%);display:inline-grid;justify-items:center;gap:0;border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.15em .55em;font-size:.8rem;line-height:1.2;min-height:30px;max-width:9.5rem;text-align:center}
.gh-rb:hover{border-color:var(--pen)}
.gh-rb[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.gh-rn{font-weight:700}
.gh-rv{font-weight:400}
.gh-rbar{display:none}
.gh-key{margin:6px 0 0}
.gh-slots{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:stretch;margin:10px 0 0}
.gh-slot{flex:1 1 13rem;display:grid;gap:2px;border:2px dashed var(--rule);border-radius:8px;padding:6px 10px;background:var(--paper)}
.gh-slot.on{border-color:var(--ink-2);border-style:solid}
.gh-sn{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.gh-sv{font-weight:700}
.gh-slots .btn{align-self:center}
.gh-real ul{margin:.3em 0 .6em;padding-left:1.2em}

/* Explore layout */
.gh-lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15.5rem);gap:16px 22px;align-items:start}
.gh-main,.gh-side{min-width:0}
.gh-side{border-left:1.5px solid var(--rule);padding-left:18px}
.gh-rule{font-size:.95rem;margin:0 0 10px;padding:6px 10px;border-left:4px solid var(--p-c);background:var(--paper);border-radius:4px;max-width:none}

/* profile cards */
.gh-pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}
.gh-pc{position:relative;display:grid;gap:6px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.88rem;width:100%;min-width:0}
button.gh-pc:hover{border-color:var(--pen)}
.gh-pc.sel{border:2.5px solid var(--ink);padding:9px 11px;box-shadow:0 0 0 3px var(--hi-soft)}
.gh-pch{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.gh-pct{font-weight:700;font-size:1rem}
.gh-witag{font-size:.72rem;font-weight:700;border:1.5px solid var(--ink);border-radius:4px;padding:0 .4em}
.gh-rib{justify-self:start;background:var(--p-c);color:var(--sheet);font-weight:700;font-size:.8rem;border-radius:4px;padding:.1em .6em;letter-spacing:.02em}
.gh-bars{display:grid;gap:4px}
.gh-br{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l v" "t t" "n n";gap:1px 8px;align-items:end}
.gh-bl{grid-area:l;font-weight:700;font-size:.85rem}
.gh-bl small{font-weight:400;color:var(--ink-2)}
.gh-bv{grid-area:v;font-size:.85rem;white-space:nowrap}
.gh-bt{grid-area:t;position:relative;display:block;height:14px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);margin-top:12px}
.gh-bf{position:absolute;left:0;top:0;bottom:0;background:var(--pen);border-radius:2px 0 0 2px;outline:0 solid var(--hi);outline-offset:1px}
.gh-bf.an{background:var(--nu-micro)}
.gh-br.pulse .gh-bf{outline-style:solid}
.gh-th{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1.5px dashed var(--ink-2)}
.gh-th.hi{border-left:2.5px dashed var(--ink);top:-12px}
.gh-thl{position:absolute;bottom:100%;left:3px;font-size:.66rem;font-weight:700;color:var(--ink);line-height:1;white-space:nowrap;margin-bottom:-8px}
.gh-bnote{grid-area:n;font-size:.8rem;font-weight:700;background:var(--hi-soft);border-radius:4px;padding:.05em .4em;justify-self:start}
.gh-tags{display:flex;flex-wrap:wrap;gap:4px}
.gh-tag{font-size:.75rem;border:1px solid var(--rule);border-radius:999px;padding:0 .55em;color:var(--ink-2);background:var(--paper)}
.gh-wi{display:grid;gap:8px;margin:10px 0 0}
.gh-wis{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;display:grid;gap:4px}
.gh-wis .tiny{margin:0}
.gh-wit{margin:0;font-weight:700}
.gh-wis .btn{justify-self:start}
#gh-big{margin-top:4px}

/* causes overlay */
.gh-flowfig{margin:8px 0 0}
.gh-flow{display:block;width:100%;height:auto;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px}
.gh-flowfig figcaption{margin-top:6px}
.gh-fh{fill:var(--ink-2);font:700 13px var(--font-ui)}
.gh-fbox{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.gh-fbox.cause{fill:var(--sheet);stroke:var(--ink);stroke-width:2.4}
.gh-fbox.scen{fill:var(--paper);stroke:var(--ink-2);stroke-dasharray:6 4}
.gh-fbox.hit{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2.2}
.gh-ft{fill:var(--ink);font:400 15px var(--font-ui)}
.gh-ft.cause,.gh-ft.hit{font-weight:700}
.gh-ft.scen{fill:var(--ink-2)}
.gh-farr{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.gh-fhead{fill:var(--ink)}
.gh-fnote{fill:var(--ink);font:700 13px var(--font-ui);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.gh-fpulse{fill:none;stroke:var(--hi);stroke-width:4}

/* Part 3: cause-map builder */
.gh-frame{margin:0 0 12px;padding:10px 14px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.gh-frame p{margin:0;max-width:none}
.gh-cm{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:clamp(36px,7vw,72px);row-gap:10px;align-items:start;margin:8px 0 0}
.gh-cmsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.gh-cmc{position:relative;min-width:0}
.gh-cmh{font-size:.85rem;color:var(--ink-2);margin:-2px 0 6px;min-height:1.3em}
.gh-cml{display:grid;gap:6px}
.gh-cb,.gh-kb,.gh-ob{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .6em;font-size:.9rem;min-height:38px}
.gh-cb:hover,.gh-kb:hover,.gh-ob:hover{border-color:var(--pen)}
.gh-cb[aria-pressed="true"],.gh-kb[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--hi-soft);font-weight:700}
.gh-cbm{flex:0 0 1.1em;font-weight:700;text-align:center}
.gh-cb.done{border-color:var(--ink-2)}
.gh-kb.linked,.gh-ob.linked{border-color:var(--ink)}
.gh-kb.wrong,.gh-ob.wrong{border-color:var(--red);background:var(--bad-bg)}
.gh-st{margin-left:auto;font-size:.78rem;font-weight:700;white-space:nowrap}
.gh-cmln{fill:none;stroke:var(--ink-2);stroke-width:1.6;opacity:.75}
.gh-cmln.on{stroke:var(--ink);stroke-width:3;opacity:1}
.gh-cmhd{fill:var(--ink)}
.gh-cmlo .gh-cmhd{fill:var(--ink-2);opacity:.75}
.gh-cmprog{margin:8px 0 0;font-weight:700}
.gh-cmtxt{margin-top:10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--paper)}
.gh-cmtxt ul{margin:0;padding-left:1.2em}
.gh-cmtxt li{margin:2px 0}
.gh-scens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.gh-scen{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--sheet);display:grid;gap:4px;align-content:start}
.gh-scen p{margin:0}
.gh-sbars{display:grid;gap:3px}
.gh-sb{display:grid;grid-template-columns:3.4rem minmax(0,1fr) 2.6rem;gap:6px;align-items:center;font-size:.82rem}
.gh-sbt{display:block;height:12px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);position:relative}
.gh-sbt i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);border-radius:2px}
.gh-sbt i.after{background:var(--pen)}
.gh-sbv{font-weight:700;text-align:right}
.gh-quote{font-style:italic}
.gh-scheck{font-weight:700}

/* Data detective */
.gh-dg{display:grid;gap:4px;margin-top:10px}
.gh-dtab{margin-top:8px}
.gh-dtab table{border-collapse:collapse;font-size:.88rem;width:100%}
.gh-dtab caption{text-align:left;font-weight:700;padding:6px 8px}
.gh-dtab th,.gh-dtab td{padding:4px 8px;border-top:1px solid var(--rule);text-align:left;vertical-align:top}
.gh-nums{display:flex;flex-wrap:wrap;gap:0 18px}

/* task */
.gh-ivs{display:grid;gap:6px}
.gh-iv{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.4em .7em;font-size:.92rem;min-height:40px;width:100%}
.gh-iv:hover{border-color:var(--pen)}
.gh-iv[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--hi-soft);font-weight:700}
.gh-ivl{flex:0 0 1.9em;font-weight:700;color:var(--ink-2)}
.gh-iv[aria-pressed="true"] .gh-ivl{color:var(--ink)}
.gh-tpv{display:grid;gap:12px}
.gh-resp{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.gh-resp ol{margin:0;padding-left:1.3em}

@media (max-width:820px){
  .gh-lab{grid-template-columns:minmax(0,1fr)}
  .gh-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .gh-scens{grid-template-columns:minmax(0,1fr)}
}
/* phones: the map becomes a stacked bar list with the same tap targets; profile cards stack; the cause-map columns stack and
   the connectors give way to the "Your map" list */
@media (max-width:640px){
  .gh-map,.gh-mtag{display:none}
  .gh-rbtns{display:grid;gap:6px}
  .gh-rb{position:static;transform:none;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n v" "b b";justify-items:stretch;text-align:left;font-size:.9rem;min-height:44px;max-width:none;width:100%;padding:.35em .7em;gap:3px 8px}
  .gh-rn{grid-area:n}
  .gh-rv{grid-area:v;font-weight:700}
  .gh-rbar{grid-area:b;display:block;height:10px;border:1px solid var(--ink-2);border-radius:3px;background:var(--paper);position:relative}
  .gh-rbar i{position:absolute;left:0;top:0;bottom:0;background:var(--pen)}
  .gh-rb[aria-pressed="true"] .gh-rbar{border-color:var(--sheet)}
  .gh-pcards{grid-template-columns:minmax(0,1fr)}
  .gh-cm{grid-template-columns:minmax(0,1fr)}
  .gh-cmsvg{display:none}
}
#gh-tkin{margin-bottom:10px}

trong>wasted\u003c/strong>, people missing key vitamins and minerals (\u003cstrong>hidden hunger\u003c/strong>), and, often in the same places, rising \u003cstrong>overweight\u003c/strong>. To understand why, you’ll read real-world patterns, tell rates from counts, and trace hunger back to its causes.","fig":{"html":"\u003cdiv class=\"gh-hero\" id=\"gh-hero\">\u003c/div>","caption":""},"aria":"A world map draws in. A tall bar labelled Food produced per person rises past a dashed line labelled Enough for everyone. The regions shade by hunger rate, model data: Africa 20%, Asia 8%, Oceania 7%, Latin America and the Caribbean 6%, Northern America and Europe under 2.5%. The shading fades into circles sized by the number of people facing hunger: Asia’s circle, 384 million, is the largest, then Africa’s, 300 million. Final frame: both maps side by side, with the question: A share of what?","caps":{"rate":"Share of people facing hunger","count":"Number of people","final":"A share of what?"},"finalLegend":{"rate":"Share of people facing hunger","rateVals":"Africa 20% · Asia 8%","count":"Number of people","countVals":"Asia 384 million · Africa 300 million"}},"goals":["I can tell hunger (undernourishment) apart from the forms of malnutrition: stunting, wasting, underweight, hidden hunger and overweight.","I can describe the signs and causes of severe malnutrition (marasmus, kwashiorkor) and common micronutrient deficiencies.","I can read global hunger data, telling a rate from a count and model data from measured data.","I can explain how geography, natural disasters, conflict and economic factors cause hunger, using the components of food security.","I can explain the double burden of malnutrition.","I can evaluate responses to malnutrition by matching them to the problem and its root causes."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If you or your family sometimes don’t have enough food, you’re not alone, and it isn’t your fault. Talk to someone you trust at school, or call or text \u003cspan class=\"nw\">211\u003c/span> to find local food programs.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Micronutrient deficiencies","goal":2,"prompt":"A long-term lack of which nutrient causes goitre (an enlarged thyroid)?","options":[{"t":"Vitamin D","why":"That’s rickets: soft, bowed bones in children.","_n":"023c","_k":"0e0900f6"},{"t":"Vitamin C","why":"That’s scurvy: bleeding gums and slow healing.","_n":"120c","_k":"24802aac"},{"t":"Iron","why":"Too little iron causes anemia.","_n":"221c","_k":"a5645a9e"},{"t":"Iodine","why":"The thyroid needs iodine to make its hormones. Iodized salt prevents goitre.","_n":"326c","_k":"bea3d53b"}],"hints":["Which mineral does the thyroid use?","It’s added to table salt in Canada.","Iodine."]},{"id":"w2","skill":"Micronutrient deficiencies","goal":2,"prompt":"Iron-deficiency anemia mainly causes…","options":[{"t":"tiredness and weakness, because the blood carries less oxygen","why":"Iron is part of hemoglobin, which carries oxygen.","_n":"427c","_k":"d8417061"},{"t":"night blindness","why":"That’s vitamin A.","_n":"524c","_k":"74d4efec"},{"t":"soft, bowed bones","why":"That’s vitamin D (rickets).","_n":"625c","_k":"583d59d6"},{"t":"bleeding gums","why":"That’s vitamin C (scurvy).","_n":"71ac","_k":"c13c485a"}],"hints":["What does iron do in red blood cells?","It helps carry oxygen.","Less oxygen → tired and weak."]},{"id":"w3","skill":"Food security components","goal":4,"prompt":"A grocery store is full of food, but a family can’t afford enough of it. Which component of food security is missing?","options":[{"t":"Acceptability","why":"That’s about whether food fits a person’s culture and preferences.","_n":"81bc","_k":"25d38cc6"},{"t":"Accessibility","why":"The food is there, but the family can’t get it, here because of cost.","_n":"9ede","_k":"79fc40d0"},{"t":"Sustainability","why":"That’s about the long term and the environment.","_n":"aece","_k":"e54078bc"},{"t":"Availability","why":"The shelves are full, so food is available.","_n":"befe","_k":"7bf176a6"}],"hints":["Is the food present?","Yes, so the problem is getting it.","Accessibility."]},{"id":"w4","skill":"Food security components","goal":4,"prompt":"A community gets enough calories, mostly from one cheap staple, but very few vegetables, fruit or protein foods. Which component is weakest?","options":[{"t":"Accessibility","why":"They can get food; it just isn’t varied enough.","_n":"ceee","_k":"d1f87e6c"},{"t":"Adequacy","why":"Adequacy means enough \u003cem>nutritious\u003c/em>, safe food, not just enough calories.","_n":"df1e","_k":"52be715d"},{"t":"Acceptability","why":"Nothing suggests the food conflicts with culture.","_n":"ef0e","_k":"dcccc776"},{"t":"Availability","why":"Calories are available; the variety isn’t.","_n":"ff3e","_k":"9b4c43ea"}],"hints":["Enough food, or enough \u003cem>nutrition\u003c/em>?","Calories are covered; nutrients aren’t.","Adequacy."]},{"id":"w5","skill":"Percentages and rates","goal":3,"prompt":"A region of 400 million people has 10% of its people facing hunger. How many people is that?","options":[{"t":"400 million","why":"That’s the whole population.","_n":"gf2e","_k":"d867bc56"},{"t":"40 million","why":"10% of 400 million is 40 million.","_n":"hf5e","_k":"8f20698d"},{"t":"10 million","why":"10% isn’t 10 million; multiply by the population.","_n":"if4e","_k":"dafabf9e"},{"t":"4 million","why":"4 million is 1% of 400 million.","_n":"j7be","_k":"027483d4"}],"hints":["10% means 10 out of every 100.","One-tenth of 400 million.","40 million."]},{"id":"w6","skill":"Percentages and rates","goal":3,"prompt":"Region P: 30% of 100 million people face hunger. Region Q: 10% of 500 million. Which has more people facing hunger?","options":[{"t":"You can’t tell without more data","why":"You have the rates and populations; multiply.","_n":"k7ce","_k":"fa3f3d7c"},{"t":"P, because its percentage is higher","why":"Rate isn’t count: 30% of 100 million is 30 million.","_n":"l7de","_k":"c1f42998"},{"t":"Q: 50 million vs 30 million","why":"A lower rate in a bigger population can mean more people.","_n":"m7ee","_k":"2bd79a53"},{"t":"They’re equal","why":"30 million and 50 million aren’t equal.","_n":"n7fe","_k":"46f0cd84"}],"hints":["Turn each rate into a number of people.","P: 30 million. Q: 50 million.","Q."]}],"refreshers":{"Micronutrient deficiencies":"Iodine → goitre; iron → anemia (tiredness); vitamin A → night blindness and weaker immunity; vitamin C → scurvy; vitamin D → rickets. Together these are called \u003cem>hidden hunger\u003c/em>, because a person can eat enough calories and still be deficient.","Food security components":"Availability (is the food there?), accessibility (can people get and afford it?), adequacy (is it nutritious and safe?), acceptability (does it fit their culture and needs?), sustainability (will it last, for people and the environment?).","Percentages and rates":"A rate is a share of a population. Number of people = rate × population. Example: 20% of 1500 million = 300 million."}}},"explore":{"heading":"World hunger map","intro":"Explore hunger and malnutrition around the world using model data based on recent FAO reports. Switch between rates and counts, open country profiles, and turn on the causes overlay.","modes":[{"id":"world","t":"World view"},{"id":"profiles","t":"Country profiles"},{"id":"causes","t":"Causes overlay"}],"measures":[{"id":"rate","t":"Rate (%)"},{"id":"count","t":"Count (millions)"}],"regions":[{"id":"af","t":"Africa","pop":1500,"rate":20,"count":300},{"id":"as","t":"Asia","pop":4800,"rate":8,"count":384},{"id":"la","t":"Latin America & the Caribbean","pop":650,"rate":6,"count":39},{"id":"oc","t":"Oceania","pop":45,"rate":7,"count":3,"approx":true},{"id":"ne","t":"Northern America & Europe","pop":1100,"low":true}],"lowRate":"under 2.5%","lowCount":"not shown (FAO doesn’t report rates under 2.5%)","lowRank":"not ranked: the rate is under 2.5%","dataLine":"Model data based on FAO et al. (2024)","keyRate":"Shading: the share of each region’s people facing hunger. Darker means a higher rate.","keyCount":"Circles: the number of people facing hunger (circle area = count). Rate × population = count.","slots":{"rate":"Highest hunger rate","count":"Most people facing hunger","rateHow":"tap a region with Rate on","countHow":"tap a region with Count on"},"realData":"\u003cp>FAO et al. (2024), \u003ci>The State of Food Security and Nutrition in the World 2024\u003c/i>:\u003c/p>\u003cul>\u003cli>about 713–757 million people faced hunger in 2023 (about 1 in 11);\u003c/li>\u003cli>the rate was about 20% in Africa, about 8% in Asia, about 6% in Latin America &amp; the Caribbean, and about 7% in Oceania;\u003c/li>\u003cli>about 2.8 billion people could not afford a healthy diet (2022).\u003c/li>\u003c/ul>\u003cp class=\"tiny\">The map uses model data built to match this pattern, so that answers stay exact.\u003c/p>\u003cp class=\"tiny\">\u003cstrong>Reference (APA 7)\u003c/strong>\u003c/p>\u003cul class=\"hfa-refs\">\u003cli>FAO, IFAD, UNICEF, WFP, &amp; WHO. (2024). \u003ci>The state of food security and nutrition in the world 2024\u003c/i>. FAO.\u003c/li>\u003c/ul>","profiles":[{"id":"A","s":32,"w":11,"o":3,"an":42,"stress":["two drought years","low household incomes"]},{"id":"B","s":22,"w":5,"o":12,"an":30,"stress":["fast-rising cheap processed foods","low incomes"]},{"id":"C","s":6,"w":1,"o":11,"an":14,"stress":["high-income","long work hours"]},{"id":"D","s":14,"w":7,"o":6,"an":25,"stress":["conflict nearby","price spikes"]}],"indicators":[{"id":"s","t":"Stunting","sub":"children under 5","scale":"child"},{"id":"w","t":"Wasting","sub":"children under 5","scale":"child"},{"id":"o","t":"Overweight","sub":"children under 5","scale":"child"},{"id":"an","t":"Anemia","sub":"women 15–49","scale":"anemia"}],"bands":{"s":[[0,"very low"],[2.5,"low"],[10,"medium"],[20,"high"],[30,"very high"]],"w":[[0,"very low"],[2.5,"low"],[5,"medium"],[10,"high"],[15,"very high"]],"o":[[0,"very low"],[2.5,"low"],[5,"medium"],[10,"high"],[15,"very high"]],"an":[[5,"mild"],[20,"moderate"],[40,"severe"]]},"bandsText":"\u003cstrong>Stunting:\u003c/strong> under 2.5 very low · 2.5–9 low · 10–19 medium · 20–29 high · 30+ very high.\u003cbr>\u003cstrong>Wasting:\u003c/strong> under 2.5 very low · 2.5–4 low · 5–9 medium · 10–14 high · 15+ very high.\u003cbr>\u003cstrong>Overweight:\u003c/strong> under 2.5 very low · 2.5–4 low · 5–9 medium · 10–14 high · 15+ very high.\u003cbr>\u003cstrong>Anemia:\u003c/strong> 5–19 mild · 20–39 moderate · 40+ severe.","bandsNote":"Bands follow the WHO/UNICEF prevalence thresholds.","rule":"The module’s double-burden rule: flag a double burden when stunting is 20% or more \u003cstrong>and\u003c/strong> child overweight is 10% or more.","wastingNote":"too thin for height: can develop in weeks","overlay":["conflict","drought","flood","spike","jobs","healthy","water"],"normalHarvest":"A region with a normal world harvest","predictions":[{"id":"p1","prompt":"Switch to Count. Which region will have the biggest circle?","options":[{"t":"Africa","_n":"o80e","_k":"eacd47aa"},{"t":"Oceania","_n":"p81e","_k":"e6ca5520"},{"t":"Latin America & the Caribbean","_n":"q82e","_k":"f0d42bae"},{"t":"Asia","_n":"r73e","_k":"e1f0bc3e"}],"explain":"Africa’s rate is higher, but Asia’s population is more than three times larger, so it has more people facing hunger. Asia: 384 million; Africa: 300 million."},{"id":"p2","prompt":"Profile B has 22% stunting. Will the double-burden flag light up?","options":[{"t":"No: stunting is too low","_n":"s74e","_k":"a5b9f683"},{"t":"Only if wasting is high too","_n":"t81e","_k":"ae2ea314"},{"t":"No: a country can’t have both problems","_n":"u80e","_k":"0e41d1cc"},{"t":"Yes: stunting and child overweight are both high","_n":"v7fe","_k":"613e1c0f"}],"explain":"Cheap, energy-dense foods can sit alongside long-term undernutrition. That’s the double burden."},{"id":"p3","prompt":"A drought cuts this region’s harvest, but world grain stocks are plentiful. What happens to local hunger?","options":[{"t":"It stays the same, because the world has enough","_n":"w7ee","_k":"ee1c354a"},{"t":"It rises: there’s less local food and prices climb beyond what low-income families can pay","_n":"x85e","_k":"d097e2af"},{"t":"It rises only if the whole world’s harvest fails","_n":"y84e","_k":"be941944"},{"t":"It falls, because people buy imported food","_n":"z83e","_k":"b781c818"}],"explain":"Global plenty doesn’t feed a family that can’t reach or afford food."},{"id":"p4","prompt":"Which form of malnutrition shows a \u003cem>recent\u003c/em>, severe shortage of food or illness, rather than a long-term one?","options":[{"t":"Overweight","_n":"1082e","_k":"5e0d0ab0"},{"t":"Anemia","_n":"1179e","_k":"fbd1f4af"},{"t":"Stunting","_n":"1278e","_k":"b141c025"},{"t":"Wasting","_n":"137ff","_k":"c6fff864"}],"explain":"Stunting builds up over years; wasting can appear quickly in a crisis."}],"chalIntro":"Set the map, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Fill the two answer slots: the region with the \u003cstrong>highest hunger rate\u003c/strong>, and the region with the \u003cstrong>most people\u003c/strong> facing hunger.","why":"Africa has the highest rate (20%); Asia has the most people facing hunger (384 million). Rate × population = count.","hints":["Rate first, with the Rate view on.","Now switch to Count and compare circle sizes.","Africa (20%) and Asia (384 million)."]},{"id":"tc2","goal":[1,3],"prompt":"Find the profile where children face \u003cstrong>very high stunting and high wasting at the same time\u003c/strong>, and name its biggest problem.","why":"Profile A: stunting 32% (very high) and wasting 11% (high). Stunting is in the higher band, so it’s A’s biggest problem.","hints":["Look for two bars past their ‘high’ lines.","Only A has wasting at 10% or more.","A, and stunting is its biggest problem."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"In What-if mode, change profile D so the double-burden flag lights up while wasting stays below the ‘high’ line. Use the smallest total change.","why":"Stunting 14% → 20% (+6) and overweight 6% → 10% (+4): the flag lights up after a total change of 10, and wasting stays at 7%.","hints":["The rule needs stunting ≥ 20% and overweight ≥ 10%.","D starts at 14% and 6%. How far is each from its line?","+6 and +4: stunting 20, overweight 10."]}],"msgs":{"tc1Empty":"Fill both slots: tap a region with Rate on, then tap a region with Count on.","tc1AfBoth":"Africa has the highest rate, but count depends on population too. Switch to Count.","tc1AsBoth":"Asia has the most people, but its rate (8%) is lower than Africa’s (20%).","tc1Oc":"Oceania’s rate is 7%; look for a darker region.","tc1Swap":"Check which slot is which: the first is the highest rate, the second the most people.","tc1Rate":"Compare the shading again: which region has the highest rate?","tc1Count":"Compare the circles again: which region has the most people facing hunger?","tc2B":"B’s stunting is high, but wasting is 5% (medium).","tc2Wasting":"Wasting is high (11%), but stunting is very high (32%), the higher band.","tc2Other":"Look for two bars past their ‘high’ lines.","tc2Chip":"Now name its biggest problem with the chips.","tc2Over":"Overweight is low (3%) in profile A.","tc3Mode":"Turn on What-if mode and choose profile D.","tc3Prof":"This challenge changes profile D.","tc3OnlyS":"Stunting is high now, but child overweight must also reach 10%.","tc3Moved":"The flag is on, but you moved {n} points; it can be done in 10.","tc3Wasting":"Wasting isn’t part of the rule, and the goal keeps it below 10%.","tc3WastingDown":"Leave wasting at 7%: it isn’t part of the rule, and every point you move counts.","tc3Rule":"The rule needs stunting ≥ 20% and overweight ≥ 10%."},"readLabels":{"sel":"Selected","rate":"Hunger rate","count":"People facing hunger","rank":"Rank","big":"Biggest problem","db":"Double burden (module rule)","change":"Total change (What-if)","cause":"Cause → components","data":"Data"},"blocks":[{"title":"The big idea","html":"\u003cul>\u003cli>A rate is not a count.\u003c/li>\u003cli>Malnutrition has many forms, including the double burden.\u003c/li>\u003cli>Hunger follows from shocks and access, not from a world without enough food.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"causes","name":"Causes","heading":"Why hunger persists","intro":"Build a cause map: connect each cause to the component of food security it hits, then to the outcome it leads to. Then test your map against data.","frame":"These are systems problems. Farmers, community health workers and governments in affected regions lead most solutions.","how":"Tap a cause, then the component it hits first. Then tap an outcome to finish the path. Build at least one path for every cause.","components":[{"id":"avail","t":"Availability"},{"id":"access","t":"Accessibility"},{"id":"adequ","t":"Adequacy"},{"id":"accept","t":"Acceptability"},{"id":"sustain","t":"Sustainability"}],"outcomes":[{"id":"hunger","t":"Hunger"},{"id":"wasting","t":"Wasting"},{"id":"stunting","t":"Stunting"},{"id":"hidden","t":"Hidden hunger"},{"id":"over","t":"Overweight"}],"causes":[{"id":"conflict","t":"Conflict","short":"Conflict","ov":"Conflict","_a":"GUFWRFlRXUZYOBVaTVZWARBBGxBPWUIQCw1QEGUUEwUBAFJBSxoLP0ALQlxfXUNGTkFAU0tMWAoFQWpP"},{"id":"drought","t":"Drought","short":"Drought","ov":"Drought","_a":"GUFWRFlRXUZYOBVaTVZWARBBGxBPWUIQCw1QEBQaQhAXDUNbVl8TOU5BVlFbXUIXQFlsEFBNXwMHERVvRQ==","notes":{"access":"prices ↑"},"onotes":{"stunting":"(long term)"}},{"id":"flood","t":"Flood","short":"Flood","ov":"Flood","_a":"GUFWRFlRXUZYOBVaTVZWARBBGxBPWUIQCw1QEGUUEwUBAFJBSxoLP0ALQlxfXUNGTkFAU0tMWAoFQWpP"},{"id":"spike","t":"World price spike","short":"World price spike","ov":"Price spike","_a":"GUFWUVtdQhdAWWwQUE1fAwcRFW9F"},{"id":"jobs","t":"Job losses","short":"Job losses","ov":"Job losses","_a":"GUFWUVtdQhdAWWwQUE1fAwcRFW9F"},{"id":"wages","t":"Low wages","short":"Low wages","_a":"GUFWUVtdQhdAWWwQUE1fAwcRFR4aS0URDBdeXF8abBk="},{"id":"healthy","t":"High cost of healthy diets","short":"Cost of healthy diets","ov":"High cost of healthy diets","_a":"GUFWVl1JREZYOBVaUVxVAQxBGxBXTlQWQD5K"},{"id":"water","t":"Unsafe water and poor sanitation","short":"Unsafe water","ov":"Unsafe water and sanitation","_a":"GUFWVl1JREZYOBVFWUtFDQwEFR4aS0URDBdeXF8abBk=","notes":{"adequ":"nutrients aren’t absorbed when children are sick"}},{"id":"gender","t":"Gender inequality in land and income","short":"Gender inequality","_a":"GUFWUVtdQhdAWWwQS0xEChYKWVUaZUw=","onotes":{"stunting":"(through mothers’ and young children’s nutrition)"}}],"msgs":{"wrongComp":"That link could happen, but it isn’t the main path. Try the component this cause hits first.","wrongOut":"That link could happen, but it isn’t the main path. Try the outcome this path leads to most directly.","pickCause":"Tap a cause first.","pickComp":"Tap one of this cause’s linked components first, then an outcome.","compOk":"Linked: {c} → {k}.{n} Now tap an outcome.","outOk":"Path built: {c} → {k} → {o}.","done":"Every cause has at least one path. Your map shows hunger as a system with linked causes, not one simple cause."},"data":{"scenarios":[{"id":"x","t":"Region X","text":"A normal harvest, but world prices doubled.","measure":"Model hunger rate","from":9,"to":13,"quote":"Food was available; access fell.","path":{"cause":"spike","comp":["access"],"out":"hunger"}},{"id":"y","t":"Region Y","text":"Conflict closed the main market road for 6 months.","measure":"Model wasting","from":6,"to":12,"quote":"Both availability and accessibility fell.","path":{"cause":"conflict","comp":["avail","access"],"out":"wasting"}},{"id":"z","t":"Household Z","text":"Enough calories from cheap staples and sweetened drinks, little variety. A child is stunted and a parent lives with obesity.","quote":"A double burden in one household.","path":{"cause":"healthy","comp":["adequ"],"out":"over"}}]},"quickCheck":{"title":"Quick check","summary":"Why hunger persists quick check","items":[{"id":"q1","goal":4,"prompt":"World harvests are normal, but local food prices double. Which component falls first?","choices":[{"t":"Acceptability","fb":"The food exists; people can’t afford it.","_n":"1480f","_k":"aadc3577"},{"t":"Accessibility","fb":"Right. The food exists; people can’t afford it.","_n":"157df","_k":"fbe69c64"},{"t":"Sustainability","fb":"The food exists; people can’t afford it.","_n":"167ef","_k":"56d3a461"},{"t":"Availability","fb":"The food exists; people can’t afford it.","_n":"1783f","_k":"745dbb5f"}]},{"id":"q2","goal":4,"prompt":"Unsafe water most directly harms…","choices":[{"t":"Acceptability","fb":"Diarrheal illness stops the body absorbing nutrients.","_n":"1884f","_k":"ca68e2df"},{"t":"Sustainability","fb":"Diarrheal illness stops the body absorbing nutrients.","_n":"1981f","_k":"4a173973"},{"t":"Adequacy (children absorb fewer nutrients when sick)","fb":"Right. Diarrheal illness stops the body absorbing nutrients.","_n":"1a82f","_k":"44eb568f"},{"t":"Availability","fb":"Diarrheal illness stops the body absorbing nutrients.","_n":"1b77f","_k":"1aa27c6f"}]},{"id":"q3","goal":4,"prompt":"Which statement fits the data?","choices":[{"t":"Hunger rises when access falls, even with enough food in the world","fb":"Right. Price shocks and conflict raise hunger without any world shortage.","_n":"1c78f","_k":"d2a95306"},{"t":"Hunger is caused by overpopulation alone","fb":"Price shocks and conflict raise hunger without any world shortage.","_n":"1d85f","_k":"63230b46"},{"t":"Hunger only rises when world harvests fail","fb":"Price shocks and conflict raise hunger without any world shortage.","_n":"1e84f","_k":"cd46f36e"},{"t":"Hunger can’t change quickly","fb":"Price shocks and conflict raise hunger without any world shortage.","_n":"1f87f","_k":"c5d791a6"}]},{"id":"q4","goal":5,"prompt":"Cheap staples, little variety: a stunted child and a parent living with obesity. This is…","choices":[{"t":"Food insecurity can’t cause both","fb":"Both forms can exist in one household.","_n":"1g86f","_k":"ad81da4e"},{"t":"Only overnutrition","fb":"Both forms can exist in one household.","_n":"1h81f","_k":"038d01ce"},{"t":"Only undernutrition","fb":"Both forms can exist in one household.","_n":"1i80f","_k":"85f409b6"},{"t":"The double burden","fb":"Right. Both forms can exist in one household.","_n":"1j83f","_k":"8b792dc1"}]}]}},"practice":{"activities":[{"id":"forms","type":"sorter","title":"Which form of malnutrition?","summary":"Which form of malnutrition?","goal":[1,2,5],"noun":"description","txt":true,"instruction":"Sort each description into the form of malnutrition it shows.","boxes":[{"id":"stunting","label":"Stunting"},{"id":"wasting","label":"Wasting"},{"id":"hidden","label":"Hidden hunger"},{"id":"over","label":"Overweight"}],"wrongDefault":"Ask: too short, too thin, missing a nutrient, or above a healthy weight? Try another box.","items":[{"id":"i1","goal":1,"t":"A 4-year-old is much shorter than expected for her age after years of poor diet and frequent illness.","_a":"QBBDR1ZMWAoFQQ==","why":"Short for age and built up over years: stunting.","wrong":{"wasting":"Short for age and built up over years: that’s stunting."}},{"id":"i2","goal":1,"t":"After a flood cut off food for six weeks, a toddler became very thin for his height.","_a":"QBRWQUxRXwNA","why":"Thin for height after a recent crisis: wasting.","wrong":{"stunting":"Thin for height after a recent crisis: that’s wasting."}},{"id":"i3","goal":[1,2],"t":"A teen eats enough calories but is tired and pale; a blood test shows low iron.","_a":"QAteVlxdX0Y=","why":"Enough calories, missing a mineral: hidden hunger.","wrong":{"wasting":"Enough calories, missing a mineral: hidden hunger."}},{"id":"i4","goal":[1,5],"t":"A child’s weight is well above the healthy range for his height, mostly from sweetened drinks and fried snacks.","_a":"QAxBV0oa","why":"Weight above the healthy range for height: overweight."},{"id":"i5","goal":[1,2],"t":"A community’s diet lacks iodine; many adults develop goitre.","_a":"QAteVlxdX0Y=","why":"Missing iodine causes goitre: hidden hunger."},{"id":"i6","goal":1,"t":"Children in a region have low height-for-age, measured at age 5.","_a":"QBBDR1ZMWAoFQQ==","why":"Low height-for-age is stunting."},{"id":"i7","goal":[1,2],"t":"A child has severe weight loss and very little body fat (marasmus).","_a":"QBRWQUxRXwNA","why":"Marasmus is the most severe form of wasting: severe thinness for height.","hints":["Marasmus is the most severe form of which?","Severe thinness for height.","Wasting."]},{"id":"i8","goal":[1,2],"t":"Children in a village can’t see well at dusk; their diet has almost no vitamin A.","_a":"QAteVlxdX0Y=","why":"Missing vitamin A causes night blindness: hidden hunger."}]},{"id":"detective","type":"custom","title":"Data detective","summary":"Data detective","star":true,"goal":[3,4,6],"instruction":"Six data questions. The ★ items are non-routine; D5 and D6 go beyond the Final Check.","how":"Type a number and press Check, or tap your choices. Units like % are optional.","items":[{"id":"d1","goal":3,"prompt":"Model: 6% of 650 million people in Latin America &amp; the Caribbean face hunger. How many million?","nums":[{"id":"n","label":"People facing hunger","unit":"million","_a":"UVo="}],"wrong":[{"match":6.5,"fb":"That’s 1% of 650 million. Multiply by 6."}],"wrongDefault":"Number of people = rate × population.","why":"6% of 650 million = 39 million."},{"id":"d2","goal":3,"prompt":"Model: Africa has 300 million people facing hunger out of 1500 million. What rate is that?","nums":[{"id":"n","label":"Hunger rate","unit":"%","_a":"UFM="}],"wrong":[{"match":5,"fb":"You divided 1500 by 300. Divide the part by the whole: 300 ÷ 1500."}],"wrongDefault":"Divide the part by the whole, then write it as a percentage.","why":"300 ÷ 1500 = 0.2, so the rate is 20%."},{"id":"d3","goal":3,"star":true,"prompt":"Model: in the next decade Asia’s rate falls to 6% while its population grows to 5000 million. Compared with Africa’s current 300 million, is the \u003cem>number\u003c/em> facing hunger in Asia lower, exactly equal, or still higher?","groups":[{"id":"g","label":"Asia’s number is…","choices":[{"t":"Lower","fb":"The rate fell, but the population grew: 6% of 5000 million = 300 million.","_n":"1k82f","_k":"6f869aa6"},{"t":"Exactly equal","_n":"1l7df","_k":"1eb473bd"},{"t":"Still higher","fb":"Compute it: 6% × 5000 million = 300 million, the same as Africa’s.","_n":"1m7cf","_k":"66ee15ac"}]}],"why":"6% of 5000 million = 300 million: exactly equal to Africa’s 300 million.","hints":["Multiply the new rate by the new population.","6% of 5000 million.","300 million: exactly equal."]},{"id":"d4","goal":6,"star":true,"prompt":"Which two profiles both have stunting at ‘high’ or above, yet need different responses?","table":true,"pick":{"n":2,"label":"Choose two profiles","options":[{"id":"A","t":"Profile A"},{"id":"B","t":"Profile B"},{"id":"C","t":"Profile C"},{"id":"D","t":"Profile D"}],"_a":"OUF2EBQac0Y/","fb":{"C":"C’s stunting is 6%, low.","D":"D’s stunting is 14%, medium, not high."}},"why":"A and B. A also has high wasting after drought (urgent treatment, income and water support); B has a double burden from cheap processed foods (better diet quality)."},{"id":"d5","goal":3,"star":true,"prompt":"A model region’s hunger rate falls from 10% to 8% while its population rises from 400 to 500 million. Did the number of people facing hunger rise, fall or stay the same? By how much?","groups":[{"id":"g","label":"The number of people facing hunger…","choices":[{"t":"Rose","fb":"Compute both: 10% of 400 = 40; 8% of 500 = 40.","_n":"1nf3e","_k":"ff1e8895"},{"t":"Fell","fb":"Compute both: 10% of 400 = 40; 8% of 500 = 40.","_n":"1of4e","_k":"87ed5623"},{"t":"Stayed the same","_n":"1pf5e","_k":"69ab5aba"}]}],"nums":[{"id":"b","label":"Before","unit":"million","_a":"VlM="},{"id":"a","label":"After","unit":"million","_a":"VlM="}],"numFb":"Compute both: 10% of 400 = 40; 8% of 500 = 40.","why":"Stayed the same: 40 million → 40 million.","hints":["Find the number of people both times.","10% of 400 million, then 8% of 500 million.","40 million both times: the same."]},{"id":"d6","goal":3,"star":true,"inquiry":true,"prompt":"You need the most reliable recent global hunger figure for a report. Rank these sources from most to least reliable.","steps":["(a) the FAO-led \u003ci>State of Food Security and Nutrition in the World\u003c/i> report","(d) a news article that cites the FAO report and links to it","(c) a food company’s ad quoting ‘studies’","(b) a viral post with a dramatic number and no source"],"start":[0,3,2,1],"fb":"A news article that cites the report is useful, but the original report is the primary source. An ad has a commercial purpose, and an unsourced post can’t be checked.","why":"a, d, c, b. The original report is the primary source; a news article that cites it is next. An ad has a commercial purpose, and an unsourced post can’t be checked."}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Vasco","goal":[2,3,4],"how":"","instruction":"Vasco made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Which model region has the most people facing hunger?","steps":["“Africa’s hunger rate is 20%, the highest of the regions.”","“Asia’s hunger rate is 8%.”","“Since 20% is bigger than 8%, Africa has the most people facing hunger.”","“So Africa has more than 384 million people facing hunger.”"],"_a":"UA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"A higher rate doesn’t mean more people when the populations differ.","_n":"1qf6e","_k":"6bb2d4e7"},{"t":"“Compare counts: 20% × 1500 million = 300 million and 8% × 4800 million = 384 million, so Asia has the most.”","why":"Africa has the highest share; Asia has the most people. A percentage only becomes a number when you multiply it by the population.","_n":"1refe","_k":"22a48962"},{"t":"“Add the rates: 28%.”","why":"Rates for different populations can’t be added.","_n":"1sf0e","_k":"c73a46c3"},{"t":"“Compare populations only: Asia is bigger, so Asia.”","why":"Population alone isn’t enough; you need rate × population.","_n":"1tf1e","_k":"2fec4cbd"}],"hints":["Is a percentage a number of people?","Multiply each rate by its population.","300 million vs 384 million."]},{"id":"e2","goal":2,"task":"Describe a child with kwashiorkor.","steps":["“Kwashiorkor is a form of severe malnutrition in young children.”","“It’s classically linked to diets low in protein after a child stops breastfeeding, though its causes are complex.”","“The child’s swollen belly shows they’ve been getting plenty of food.”","“So the child doesn’t need urgent care.”"],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. Find the first mistake."],"fixes":[{"t":"“The swelling shows marasmus.”","why":"Marasmus is severe thinness without edema.","_n":"1uf2e","_k":"19d39e1f"},{"t":"“The swelling is edema, fluid under the skin, a warning sign of severe malnutrition; the child needs urgent medical care.”","why":"The swelling is edema (fluid), a warning sign of severe malnutrition, not extra food.","_n":"1vfbe","_k":"291f669b"},{"t":"Step 3 is correct.","why":"Swelling isn’t a sign of being well fed.","_n":"1wfce","_k":"003ed0fc"},{"t":"“The swelling comes from eating too much protein.”","why":"Kwashiorkor is linked to too little, not too much.","_n":"1x79f","_k":"9d37aeef"}],"hints":["What causes swelling in kwashiorkor?","Fluid: edema.","It signals severe malnutrition."]},{"id":"e3","goal":4,"task":"Explain why hunger rose in a model region with a normal harvest.","steps":["“The region’s harvest was normal this year.”","“World food prices doubled, so food in local markets cost much more.”","“Hunger can’t rise when there’s enough food, so the data must be wrong.”","“We should ignore this region’s data.”"],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"“Hunger rose because people moved away.”","why":"Nothing in the data says that.","_n":"1y78f","_k":"2ad257f7"},{"t":"“Hunger can rise when access falls: low-income families couldn’t afford food at double the price.”","why":"The world grows enough food overall. Most hunger comes from people being unable to reach or afford food, especially during conflict, disasters and price shocks.","_n":"1z77f","_k":"a693dbb4"},{"t":"“Hunger rose because the region grew too little.”","why":"The harvest was normal.","_n":"2076f","_k":"3d12df69"},{"t":"Step 3 is correct.","why":"Enough food in markets doesn’t mean everyone can afford it.","_n":"2175f","_k":"1447e123"}],"hints":["Which component did the price rise affect?","Accessibility.","Families couldn’t afford food: hunger rose."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If you or your family sometimes don’t have enough food, you’re not alone, and it isn’t your fault. Talk to someone you trust at school, or call or text \u003cspan class=\"nw\">211\u003c/span> to find local food programs.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"What surprised you most on the world hunger map: the gap between rates and counts, or the double burden?"},{"id":"j2","q":"In your own words, why can a world that grows enough food still have hunger?"},{"id":"j3","q":"Explain to a friend the difference between stunting, wasting and hidden hunger, with one example of each."},{"id":"j4","q":"What’s one question about global hunger you’d like to research? Which kind of source would you trust to answer it, and why?"}]},"final":{"intro":"This shows what you’ve learned, so there are no hints here. Answer all 10 questions and say how sure you are. Then submit to see your results. Each question is labelled with its achievement chart category. Data in questions is model data unless a source is named.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Stunting describes a child who is…","options":[{"t":"too thin for their height, from a recent severe shortage","why":"That’s wasting.","_n":"2274f","_k":"e3219ced"},{"t":"above a healthy weight for their height","why":"That’s overweight.","_n":"2373f","_k":"60f6a303"},{"t":"too short for their age, from long-term undernutrition","why":"Stunting builds up over years.","_n":"2472f","_k":"e2384006"},{"t":"missing a vitamin or mineral despite enough calories","why":"That’s hidden hunger.","_n":"2581f","_k":"354575f2"}]},"b":{"prompt":"Wasting describes a child who is…","options":[{"t":"too short for their age, from long-term undernutrition","why":"That’s stunting.","_n":"2680f","_k":"8694afa8"},{"t":"above a healthy weight for their height","why":"That’s overweight.","_n":"2777d","_k":"1e186dc1"},{"t":"missing iodine","why":"That’s hidden hunger (goitre).","_n":"2878d","_k":"d15602d5"},{"t":"too thin for their height, usually from a recent severe shortage of food or illness","why":"Wasting can develop in weeks.","_n":"2975d","_k":"e9c7f78e"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which sign points to \u003cstrong>kwashiorkor\u003c/strong> rather than marasmus?","options":[{"t":"extreme thinness with very little body fat","why":"That’s marasmus.","_n":"2a76d","_k":"0b5017d2"},{"t":"an enlarged thyroid","why":"That’s goitre (iodine).","_n":"2b73d","_k":"bd8922a0"},{"t":"swelling (edema) in the feet, legs or belly","why":"Edema is the hallmark of kwashiorkor.","_n":"2c74d","_k":"0a12ec89"},{"t":"bleeding gums","why":"That’s scurvy (vitamin C).","_n":"2d71d","_k":"07bd7b80"}]},"b":{"prompt":"\u003cstrong>Marasmus\u003c/strong> is best described as…","options":[{"t":"swelling from fluid with a round belly","why":"That’s kwashiorkor.","_n":"2e72d","_k":"b1757a02"},{"t":"a vitamin C deficiency","why":"That’s scurvy.","_n":"2f7fd","_k":"016c0639"},{"t":"overweight together with anemia","why":"That’s a double burden pattern, not marasmus.","_n":"2g80d","_k":"0168d577"},{"t":"severe wasting from a long-term lack of energy and nutrients","why":"The body uses up its fat and muscle.","_n":"2hfdd","_k":"003fd4c9"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A conflict closes the roads to a region’s markets for months. Which component of food security is hit most directly?","options":[{"t":"acceptability","why":"Nothing changes about cultural fit.","_n":"2ifcd","_k":"2779b3f4"},{"t":"sustainability","why":"The immediate problem is getting food.","_n":"2jffd","_k":"27c802a6"},{"t":"accessibility","why":"People can’t reach food or afford its rising price.","_n":"2kfed","_k":"9dca32f3"},{"t":"adequacy only","why":"Adequacy may fall later; access falls first.","_n":"2l01d","_k":"bf43cbdd"}]},"b":{"prompt":"A flood destroys a region’s crops in the fields. Which component is hit first?","options":[{"t":"availability","why":"There’s less food in the region.","_n":"2m00d","_k":"aa6b4242"},{"t":"adequacy only","why":"The first loss is the food itself.","_n":"2n03d","_k":"0f8a714d"},{"t":"none, because world harvests are fine","why":"Local supply still falls.","_n":"2o02d","_k":"6d233705"},{"t":"acceptability","why":"The food’s cultural fit isn’t the issue.","_n":"2pf5d","_k":"a50b3497"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Model data. Region R: 200 million people, 15% facing hunger. Region S: 900 million, 5%. Which statement is correct?","options":[{"t":"They can’t be compared without more data","why":"You have both rates and populations.","_n":"2qf4d","_k":"f3b9644b"},{"t":"They have the same number of people facing hunger","why":"30 million ≠ 45 million.","_n":"2rfbb","_k":"201047a0"},{"t":"S has more people facing hunger (45 million vs 30 million), even though R’s rate is three times higher","why":"Rate × population.","_n":"2sfab","_k":"fdc0fba1"},{"t":"R has more people facing hunger because 15% > 5%","why":"Compute the counts: 30 vs 45 million.","_n":"2tf9b","_k":"5515adb1"}]},"b":{"prompt":"Model data. Region U: 300 million people, 12%. Region V: 1200 million, 4%. Which statement is correct?","options":[{"t":"V has more people facing hunger (48 million vs 36 million), even though U’s rate is three times higher","why":"Rate × population.","_n":"2uf8b","_k":"8c2ed122"},{"t":"U has more people facing hunger because 12% > 4%","why":"36 vs 48 million.","_n":"2vffb","_k":"7498de88"},{"t":"They have the same number","why":"36 ≠ 48.","_n":"2wfeb","_k":"669f539e"},{"t":"They can’t be compared","why":"Multiply rate by population.","_n":"2xfdb","_k":"d429b6c4"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A model country has 24% child stunting and 13% child overweight. Using the module’s rule, what does this show?","options":[{"t":"an impossible result","why":"Both forms often exist together.","_n":"2yfcb","_k":"67895706"},{"t":"only overnutrition, because overweight is high","why":"Stunting is high too.","_n":"2z03b","_k":"5cd16e2f"},{"t":"only undernutrition, because stunting is the bigger number","why":"Overweight is also above its line.","_n":"3002b","_k":"890aeebf"},{"t":"a double burden: high undernutrition and high overweight at the same time","why":"24 ≥ 20 and 13 ≥ 10.","_n":"3175b","_k":"5a974a0f"}]},"b":{"prompt":"In one household, the children are short for their age and a parent lives with obesity. This is an example of…","options":[{"t":"overnutrition only","why":"The children’s stunting is undernutrition.","_n":"3276b","_k":"713b57b8"},{"t":"the double burden of malnutrition within one household","why":"Cheap, energy-dense foods can cause both.","_n":"3377b","_k":"5a9d82e3"},{"t":"a situation that can’t happen","why":"It’s common worldwide.","_n":"3478b","_k":"3546f544"},{"t":"undernutrition only","why":"The parent’s obesity is also a form of malnutrition.","_n":"3579b","_k":"071b176c"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"World grain prices double while local harvests are normal. Who is most likely to face more hunger?","options":[{"t":"low-income households that spend a large share of their income on food","why":"Their money buys much less food.","_n":"367ab","_k":"42d6430c"},{"t":"grain farmers who sell their harvest","why":"Higher prices may help them.","_n":"377bb","_k":"93297fc5"},{"t":"high-income households","why":"Food is a small share of their spending.","_n":"387cb","_k":"5c88d067"},{"t":"no one, because harvests are normal","why":"Access falls even when food is available.","_n":"397db","_k":"9c6b83b9"}]},"b":{"prompt":"A region’s harvest is normal, but conflict blocks roads for months. What is the most likely result?","options":[{"t":"hunger only among farm families","why":"City households lose access too.","_n":"3a7eb","_k":"da188b1c"},{"t":"no change, because the food was grown","why":"Food that can’t be reached can’t be eaten.","_n":"3b07b","_k":"4c9fdd14"},{"t":"falling prices","why":"Blocked supply pushes prices up.","_n":"3c06b","_k":"cf33fa9c"},{"t":"rising hunger, as food can’t reach markets and prices rise","why":"Availability and access both fall.","_n":"3d09b","_k":"a510131f"}]}},{"id":"c1","cat":"C","goal":[1,3],"a":{"prompt":"Which sentence best explains why the world can grow enough food and still have hunger?","options":[{"t":"“Hunger is mostly about access: people may be unable to afford or reach food, especially during conflict, disasters and price shocks.”","why":"The world grows enough food overall. Most hunger comes from people being unable to reach or afford food, especially during conflict, disasters and price shocks.","_n":"3e08b","_k":"5e0554d7"},{"t":"“Hunger is caused by overpopulation alone.”","why":"Hunger has several linked causes.","_n":"3f0bb","_k":"eb532799"},{"t":"“There simply isn’t enough food in the world.”","why":"Global production is enough overall.","_n":"3g0ab","_k":"8d7bd1d3"},{"t":"“People in some regions don’t work hard enough.”","why":"Hunger comes from systems and shocks, not anyone’s effort.","_n":"3h0db","_k":"6f83bc81"}]},"b":{"prompt":"Which caption best describes a map shaded by hunger \u003cem>rate\u003c/em>?","options":[{"t":"“Darker regions have a larger share of their population facing hunger; the number of people also depends on population size.”","why":"Africa has the highest share; Asia has the most people. A percentage only becomes a number when you multiply it by the population.","_n":"3i0cb","_k":"317aa72c"},{"t":"“Darker regions have the highest overweight rates.”","why":"This map shows hunger.","_n":"3jffb","_k":"9408e5d7"},{"t":"“Darker regions have the most people facing hunger.”","why":"Shading shows share, not number.","_n":"3kfeb","_k":"e2c5eab9"},{"t":"“Darker regions grow less food.”","why":"The map shows hunger, not production.","_n":"3l01b","_k":"20025f5c"}]}},{"id":"c2","cat":"C","goal":[2,5],"a":{"prompt":"Which phrase most accurately describes a person who eats enough calories but has iron-deficiency anemia?","options":[{"t":"“They are experiencing wasting.”","why":"Wasting is about being too thin for height.","_n":"3m02b","_k":"cf8f18fe"},{"t":"“They are well nourished because they eat enough.”","why":"Enough calories isn’t the same as enough nutrients.","_n":"3nffb","_k":"3e27bc63"},{"t":"“They are experiencing hidden hunger: enough energy, but not enough of a key mineral.”","why":"Iron is a key mineral; missing it despite enough calories is hidden hunger.","_n":"3o00b","_k":"d0dd0121"},{"t":"“They have marasmus.”","why":"Marasmus is severe wasting.","_n":"3pfdb","_k":"446ea10f"}]},"b":{"prompt":"Which phrase most accurately describes children in a region whose diet has almost no vitamin A?","options":[{"t":"“They have kwashiorkor.”","why":"That’s severe malnutrition with edema.","_n":"3qfeb","_k":"ce8005b3"},{"t":"“They face hidden hunger and are at risk of night blindness and weaker immunity.”","why":"Vitamin A deficiency is a form of hidden hunger.","_n":"3rfbb","_k":"5f2c9a38"},{"t":"“They are stunted because of vitamin A alone.”","why":"Stunting has many causes.","_n":"3sfcb","_k":"1d894487"},{"t":"“They are well fed if they get enough calories.”","why":"Malnutrition also includes missing vitamins and minerals and overweight, and both can happen in one country, even one household.","_n":"3t09b","_k":"d77e35dc"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Profile A: stunting 32%, wasting 11%, anemia 42%, after two drought years with low household incomes. Which pair of responses fits best?","options":[{"t":"treatment of severe acute malnutrition with ready-to-use therapeutic food, plus cash transfers to low-income households","why":"One treats urgent wasting; the other tackles income, a root cause.","_n":"3u0ab","_k":"aa265a8e"},{"t":"shipping cheap grain to sell in local markets","why":"That can undercut local farmers and doesn’t target the youngest children.","_n":"3v93c","_k":"d050b3cc"},{"t":"a tax on sugary drinks plus gym programs","why":"Overweight is low here; these miss the main problems.","_n":"3w92c","_k":"895624b0"},{"t":"doing nothing until the next harvest","why":"Wasting is urgent.","_n":"3x91c","_k":"0514bca4"}]},"b":{"prompt":"Profile B has a double burden (stunting 22%, overweight 12%). Which response addresses both problems?","options":[{"t":"making nutrient-dense foods more affordable while supporting infant and young-child feeding","why":"It improves diet quality for both.","_n":"3y90c","_k":"697e0d0b"},{"t":"only weight-loss campaigns","why":"They ignore stunting.","_n":"3z8fc","_k":"685c2d76"},{"t":"no action, because the two problems cancel out","why":"They don’t cancel; both harm health.","_n":"408ec","_k":"c5a76d66"},{"t":"only high-calorie food aid","why":"That could worsen overweight.","_n":"418dc","_k":"2098c0ee"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"In Nunavut, store food is very expensive and a shorter sea-ice season makes hunting harder. Which components of food security are most affected?","options":[{"t":"none, because stores are open","why":"An open store doesn’t mean affordable food.","_n":"428cc","_k":"3ff4c7da"},{"t":"accessibility (cost) and availability (harvesting country foods)","why":"Both getting and finding food are harder.","_n":"438bc","_k":"05e2f385"},{"t":"sustainability only, because it’s about the environment","why":"Cost and access are immediate.","_n":"448ac","_k":"6ccd40a6"},{"t":"acceptability only","why":"Country foods remain culturally central.","_n":"450dc","_k":"63e1af9a"}]},"b":{"prompt":"A Prairie drought pushes world wheat prices up. Which group abroad is most affected?","options":[{"t":"high-income households everywhere","why":"Food is a small share of their spending.","_n":"460ec","_k":"3616233c"},{"t":"no one, because the world has other wheat","why":"Prices rise for everyone who buys it.","_n":"470fc","_k":"a67b82ea"},{"t":"farmers in countries that export wheat","why":"They may earn more.","_n":"4810c","_k":"762c5360"},{"t":"low-income households in countries that import much of their wheat","why":"Higher prices cut what they can afford.","_n":"4909c","_k":"54a0bd00"}]}}]},"task":{"title":"Design a nutrition response","summary":"Design a nutrition response","statement":"\u003cp>Profile A needs a response. Choose exactly three interventions that together meet every condition. Can you find all the answers?\u003c/p>\u003cp>\u003cstrong>Profile A\u003c/strong> \u003cspan class=\"hfa-model\">Model data\u003c/span>: stunting 32% (very high), wasting 11% (high), overweight 3% (low), anemia in women 42% (severe). Stresses: two drought years and low household incomes. Local farmers sell grain in local markets.\u003c/p>","profile":"A","interventions":[{"id":"a","t":"Ready-to-use therapeutic food for children with severe acute malnutrition"},{"id":"b","t":"Iron-fortified flour through local mills"},{"id":"c","t":"Cash transfers to low-income households"},{"id":"d","t":"Drought-tolerant seed and small-scale irrigation support"},{"id":"e","t":"Breastfeeding and infant-feeding counselling in the first 1000 days"},{"id":"f","t":"School meals made with local foods"},{"id":"g","t":"Shipping surplus grain from abroad to sell cheaply in local markets"},{"id":"h","t":"A tax on sugar-sweetened drinks"}],"checks":["Reaches children under 5","Tackles a root cause (drought or low income)","Fights hidden hunger","Protects local farmers’ markets","Exactly three interventions"],"tips":["Under-5 problems here are wasting and stunting. Which choices reach young children directly?","The stresses are drought and low incomes. Which choices address those?","Anemia is 42%. Which choice adds iron?","Cheap imported grain sold in local markets can push local farmers’ prices down.","Three only: a budget limit."],"explainPrompt":"Explain how your three interventions work together, and why you didn’t choose (g) or (h).","vocab":"Use the words wasting, stunting, hidden hunger, root cause and accessibility.","checkLabel":"Check my response","success":"This response meets every condition.","more":"There’s more than one answer. Can you find all four?","afterAt":4,"after3":"Every answer combines one direct-to-children action, one root-cause action and iron. Real responses do the same: treat, prevent and fix causes together.","validMsg":"Tap interventions to choose them. You need exactly three."},"cards":[["Hunger (undernourishment)","Not getting enough dietary energy over time."],["Malnutrition","Any unhealthy imbalance: undernutrition, micronutrient deficiencies or overweight."],["Stunting","Too short for age; long-term undernutrition (e.g. a 4-year-old far below expected height)."],["Wasting","Too thin for height; a recent severe shortage or illness; can develop in weeks."],["Hidden hunger","Missing vitamins or minerals (iron, iodine, vitamin A) despite enough calories."],["Double burden","Undernutrition and overweight in the same country, household or person."],["Marasmus","Severe wasting from a long-term lack of energy and nutrients."],["Kwashiorkor","Severe malnutrition with edema (swelling); causes are complex."],["Rate vs count","Count = rate × population. The highest rate isn’t always the most people."],["Five components","Availability, accessibility, adequacy, acceptability, sustainability."],["Root causes of hunger","Conflict, climate shocks, economic shocks, poverty and inequality, the cost of healthy diets."],["Enough food, still hunger","The world grows enough overall; hunger is mostly about access."]]}};</script>
