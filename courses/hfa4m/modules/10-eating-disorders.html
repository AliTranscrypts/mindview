<script>window.MV_PAYLOAD={"meta":{"id":"10-eating-disorders","nn":"10","slug":"eating-disorders","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 3","groupName":"Nutrition, Health and Disease","trivium":"","size":"M","storageKey":"hfa4u-10-eating-disorders-v1","progressKey":"hfa4u-progress-v1:10-eating-disorders","toolkit":"1.0.6"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"7eec237a","content":{"id":"10-eating-disorders","kind":"topic","title":"Eating disorders","topic":"Eating Disorders","readyTopic":"the rest of this module","support":"If food, eating or body image is weighing on you, or you’re worried about someone, you’re not alone. Talk to someone you trust: a parent, a teacher, a school counsellor or your doctor. You can also contact \u003cstrong>Kids Help Phone\u003c/strong>, \u003cspan class=\"nw\">1-800-668-6868\u003c/span> or text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>, any time, or the \u003cstrong>National Eating Disorder Information Centre (NEDIC)\u003c/strong> helpline, \u003cspan class=\"nw\">1-866-633-4220\u003c/span>. If you are in danger, call 911.","hero":{"headline":"Serious illnesses. Real recovery. You can help.","text":"\u003cstrong>Eating disorders\u003c/strong> are serious mental illnesses that affect the body and mind. They come from a \u003cstrong>mix of factors\u003c/strong>, not a single cause and never a choice. They affect people of \u003cstrong>every gender, culture and body size\u003c/strong>. With \u003cstrong>early help\u003c/strong> and \u003cstrong>support\u003c/strong>, people recover. This module is about understanding, supporting others and questioning the messages around us.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later. This module includes the support note above. You can return to it any time from the header.","fig":{"html":"\u003cdiv class=\"ed-hero\" id=\"ed-hero\">\u003c/div>","caption":""},"circles":["Biology","Mind","World around us"],"overlap":"risk is a mix","cards":["early help","supportive people","media literacy","recovery is possible"],"caption":"Understanding → support → help → recovery.","aria":"Three circles labelled Biology, Mind and World around us slide together until they overlap. The shared centre glows softly and is labelled “risk is a mix”. Beneath them, four small cards appear one at a time: early help, supportive people, media literacy, recovery is possible."},"goals":["I can describe the main types of eating disorders (anorexia nervosa, bulimia nervosa, binge-eating disorder, ARFID) by their effects and general warning signs.","I can explain how biological, psychological and social factors combine to raise risk, and name protective factors.","I can correct common myths, including that you can tell by looking at someone.","I can choose supportive ways to talk with a friend I’m worried about, and know when and how to involve a trusted adult.","I can critically analyse diet-culture messages in media and explain who benefits from them.","I can evaluate prevention strategies and reliable sources of help."],"settings":{"title":"Settings","intro":"Choose the pronoun for \u003cstrong>Sam\u003c/strong>, the friend in the Explore conversation. Sam can be any gender.","pron":[{"id":"they","t":"they/them"},{"id":"she","t":"she/her"},{"id":"he","t":"he/him"}],"pathIntro":"If this topic is hard for you right now, you can switch to a shorter path at any time: \u003cstrong>Media\u003c/strong> (Part 3) and a short Final Check. You don’t need to give a reason.","paths":[{"id":"full","t":"Full module"},{"id":"alt","t":"Shorter path: Media and a short Final Check"}],"altNote":"You’re on the shorter path. The Explore part and the Practice part are hidden, and the Final Check has its Communication and Application questions only. Switch back here any time.","reload":"Switching paths reloads the page. Your saved work stays."},"start":{"blocks":[{"title":"Settings","html":"\u003cdiv id=\"ed-settings\">\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Mental health basics","goal":2,"prompt":"Which statement best describes mental illness?","options":[{"t":"Something that only happens to adults","why":"Mental illnesses often begin in childhood or adolescence.","_n":"00c9","_k":"90d5f782"},{"t":"Something people can simply decide to stop","why":"It’s not a choice.","_n":"1099","_k":"0d00f9d9"},{"t":"A health condition affecting thoughts, feelings or behaviour, with biological, psychological and social causes","why":"Like physical illnesses, mental illnesses have real causes and real treatments.","_n":"20a9","_k":"327b87e5"},{"t":"A sign of personal weakness","why":"Illness isn’t weakness.","_n":"30f9","_k":"5b0b71d0"}],"hints":["Think of how we describe physical illness.","Causes can be biological, psychological and social.","A health condition with several causes."]},{"id":"w2","skill":"Mental health basics","goal":6,"prompt":"Which person is a trained professional who can help with mental health concerns?","options":[{"t":"Any friend who has read about it online","why":"Friends support; professionals treat.","_n":"4109","_k":"ac67bb2a"},{"t":"A school counsellor, family doctor or psychologist","why":"They can listen, assess and connect people to care.","_n":"50d9","_k":"d363e987"},{"t":"A fitness influencer","why":"Not trained in mental health care.","_n":"60e9","_k":"d0207972"},{"t":"An app that counts food","why":"Not a source of care, and can be unhelpful.","_n":"7039","_k":"09e0f78d"}],"hints":["Who is trained to assess and treat?","Look for professional roles.","Counsellor, doctor or psychologist."]},{"id":"w3","skill":"Media literacy","goal":5,"prompt":"A post advertises a product with the line “Get the body you deserve.” What is the main persuasive technique?","options":[{"t":"It’s a neutral description","why":"It’s designed to persuade.","_n":"8049","_k":"92f08ddd"},{"t":"It’s a health guideline","why":"Guidelines come from health authorities, not ads.","_n":"92ef","_k":"8cd124ea"},{"t":"It gives scientific evidence","why":"There’s no evidence in the line.","_n":"a2df","_k":"cab2df4f"},{"t":"It suggests your worth depends on your body, to sell a product","why":"It links self-worth to appearance to create a need.","_n":"b30f","_k":"b385d520"}],"hints":["What feeling is the line trying to create?","What is being sold?","Worth linked to body, to sell."]},{"id":"w4","skill":"Media literacy","goal":5,"prompt":"Which question is most useful when judging a nutrition claim online?","options":[{"t":"Is it posted often?","why":"Repetition isn’t truth.","_n":"c2ff","_k":"a23bc16f"},{"t":"Does the person look healthy?","why":"Appearance isn’t evidence.","_n":"d32f","_k":"5e2275cb"},{"t":"Who made this, what’s their evidence, and do they profit from my belief?","why":"Source, evidence and profit: the three checks that matter.","_n":"e31f","_k":"8db50216"},{"t":"How many likes does it have?","why":"Popularity isn’t accuracy.","_n":"f34f","_k":"df1e60d3"}],"hints":["Think about source and evidence.","And who benefits.","Who, what evidence, and profit."]},{"id":"w5","skill":"Supportive communication","goal":4,"prompt":"A friend seems quieter than usual. Which opener is most supportive?","options":[{"t":"“You need to cheer up.”","why":"Dismisses feelings.","_n":"g33f","_k":"ab7db39d"},{"t":"“I’ve noticed you seem down lately, and I care about you. Want to talk?”","why":"An “I” statement, specific, caring and open.","_n":"h36f","_k":"886dc1d8"},{"t":"“Everyone’s noticed you’re acting weird.”","why":"Shaming and public.","_n":"i35f","_k":"497ff669"},{"t":"“What’s wrong with you?”","why":"Sounds blaming.","_n":"jbce","_k":"96e4095a"}],"hints":["Start with what you’ve noticed and that you care.","Use “I”, not “you’re…”.","“I’ve noticed you seem down lately, and I care about you. Want to talk?”"]},{"id":"w6","skill":"Supportive communication","goal":4,"prompt":"When is it right to tell a trusted adult about a friend’s struggle, even if they asked you not to?","options":[{"t":"Never: a promise is a promise","why":"When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal.","_n":"kbde","_k":"1a0ef934"},{"t":"Only if they agree first","why":"Safety can’t wait for permission.","_n":"lbee","_k":"36d372ca"},{"t":"When you’re worried about their health or safety","why":"Their safety matters more than keeping a secret.","_n":"mbfe","_k":"7d73a953"},{"t":"Only after posting about it online","why":"Never post private concerns publicly.","_n":"nc0e","_k":"1a815052"}],"hints":["What matters most: the secret or their safety?","Health and safety come first.","When you’re worried about health or safety."]}],"refreshers":{"Mental health basics":"Mental illnesses are health conditions with biological, psychological and social causes. They’re treatable, and asking for help is a strength.","Media literacy":"Ask who made a message, how it tries to persuade you, what evidence it gives, and who profits.","Supportive communication":"Use “I” statements, describe what you’ve noticed, listen without judging, and involve a trusted adult when you’re worried about safety."}}},"explore":{"heading":"Understanding, not instructing","intro":"Three tools: map the factors behind eating disorders, test common myths, and practise a supportive conversation with a friend. Nothing here asks about your own eating or body.","modes":[{"id":"map","t":"Influence map"},{"id":"myth","t":"Myth or fact"},{"id":"talk","t":"Supportive conversation"}],"map":{"cols":[{"id":"risk","t":"Can raise risk"},{"id":"protect","t":"Can help protect"}],"types":[{"id":"bio","t":"Biology","circle":"Biology"},{"id":"mind","t":"Mind","circle":"Mind"},{"id":"world","t":"World","circle":"World around us"}],"message":"No single factor causes an eating disorder; several combine.","cards":[{"id":"fam","t":"Family history","kt":"bio","_a":"FRcMEFkR"},{"id":"perf","t":"Temperament such as perfectionism","kt":"mind","_a":"FRcMEFkR"},{"id":"anx","t":"Anxiety or depression","kt":"mind","_a":"FRcMEFkR"},{"id":"trauma","t":"Experiences of trauma","kt":"mind","_a":"FRcMEFkR"},{"id":"tease","t":"Weight-based teasing or bullying","kt":"world","_a":"FRcMEFkR"},{"id":"diet","t":"Diet culture and appearance-focused media","kt":"world","_a":"FRcMEFkR"},{"id":"sport","t":"Sports or activities that emphasize weight or appearance","kt":"world","_a":"FRcMEFkR"},{"id":"stress","t":"Major life changes or stress","kt":"mind","_a":"FRcMEFkR"},{"id":"support","t":"Supportive relationships","kt":"world","_a":"FRUXDEZWVBUV"},{"id":"media","t":"Media literacy skills","kt":"mind","_a":"FRUXDEZWVBUV"},{"id":"env","t":"Environments that respect all body sizes","kt":"world","_a":"FRUXDEZWVBUV"},{"id":"meals","t":"Regular shared meals with family or friends","kt":"world","_a":"FRUXDEZWVBUV"}],"sample":["fam","anx","diet"]},"myths":[{"id":"s1","t":"“You can tell if someone has an eating disorder by looking at their body size.”","_a":"FQgcF1oR","flip":"People of every body size can have an eating disorder.","fix":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through.","src":"a national eating disorder organization"},{"id":"s2","t":"“Eating disorders are serious mental illnesses that affect both body and mind.”","_a":"FQMEAEYR","flip":"They’re serious illnesses with physical effects, not choices, phases or vanity.","fix":"Recovery is possible, and early help makes a real difference.","src":"a national eating disorder organization"},{"id":"s3","t":"“Only teenage girls get eating disorders.”","_a":"FQgcF1oR","flip":"Eating disorders affect people of every gender, age, culture and income.","fix":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","src":"peer-reviewed research"},{"id":"s4","t":"“Biological, psychological and social factors combine to raise the risk of an eating disorder.”","_a":"FQMEAEYR","flip":"No single thing causes an eating disorder.","fix":"Social factors include weight stigma, diet culture and media messages.","src":"peer-reviewed research"},{"id":"s5","t":"“Eating disorders are a choice, a phase or about vanity.”","_a":"FQgcF1oR","flip":"No one chooses an eating disorder.","fix":"Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them.","src":"a national mental health organization"},{"id":"s6","t":"“Recovery is possible, and getting help early makes a real difference.”","_a":"FQMEAEYR","flip":"People recover, often with help from a treatment team.","fix":"A doctor, therapist, dietitian and family can all be part of that team.","src":"clinical practice guidelines"},{"id":"s7","t":"“Binge-eating disorder is just a lack of willpower.”","_a":"FQgcF1oR","flip":"Binge-eating disorder is a recognized illness.","fix":"Binge-eating disorder is a recognized illness involving loss of control and distress; willpower isn’t the issue.","src":"clinical practice guidelines"},{"id":"s8","t":"“The best way to help a friend is to comment on what they eat.”","_a":"FQgcF1oR","flip":"Helping is about the person, not their food or body.","fix":"Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","src":"a national eating disorder organization"}],"talk":{"scenario":"Your friend \u003cstrong>Sam\u003c/strong> has been skipping lunch with the group, seems tired and withdrawn, and changes the subject when food comes up. You decide to talk with {them}.","trust":[{"id":"S","t":"shut down"},{"id":"D","t":"defensive"},{"id":"L","t":"listened to"}],"moves":[{"id":"i","t":"concern with an “I” statement"},{"id":"ls","t":"listened"},{"id":"pro","t":"suggested professional help"},{"id":"ad","t":"involved a trusted adult"},{"id":"nofb","t":"no comments on weight, food or appearance"}],"turns":[{"id":"t1","t":"Opening","situation":"You find Sam alone at {their} locker at lunch. It’s quiet, just the two of you.","says":[{"id":"a","t":"“I’ve noticed you haven’t been at lunch and you seem tired. I care about you. Is everything okay?”","reply":"Sam looks up, surprised. “I… thanks for noticing.”"},{"id":"b","t":"“You need to eat more.”","reply":"“Why is everyone watching me?” Sam crosses {their} arms."},{"id":"c","t":"“You look different.”","reply":"Sam looks away and goes quiet."},{"id":"d","t":"“Everyone’s talking about you.”","reply":"Sam’s face falls. “Great. Just great.”"}],"_a":"TEcEQQhIFRVFR19BfhEbQ15HX1JPHxUDFV8eQUZBFVsVIUdPEFVVQw1UGE8QUBVbTEcRERAJFTIVSUcFUBENUEpJRwcQCUxDQxdHWRBgFRxK"},{"id":"t2","t":"Sam deflects","situation":"Sam shrugs. “I’m fine. Drop it.”","says":[{"id":"a","t":"“Okay. I’m here whenever you want to talk, and I’m not going anywhere.”","reply":"Sam nods slowly. “…Okay.”"},{"id":"b","t":"“That’s okay. You don’t have to talk now. Want to walk to class together?”","reply":"“Yeah. Okay.” Sam’s shoulders relax a little."},{"id":"c","t":"“Not until you tell me.”","reply":"“Seriously? Back off.”"},{"id":"d","t":"“Come on, you’re being so dramatic.”","reply":"“Wow. Thanks a lot.” Sam turns away."}],"_a":"TEcEQQhIFRVFR19BfhEbQ1gOR1kDThtDVUdfGBBHRUMNRylBHhFYChVfVB4eEVRDDR5HF0ARDUNzRxhPEFcVW0xHEREQCRUlFRgY"},{"id":"t3","t":"Sam shares a little","situation":"A few days later, Sam finds you after class. “Honestly? I’ve been really stressed. Everything feels like too much, and I feel like I’m not in control.”","says":[{"id":"a","t":"“That sounds really hard. Thank you for telling me.”","reply":"Sam takes a breath. “It feels good to say it out loud.”"},{"id":"b","t":"“You’d feel better if you just ate more.”","reply":"“That’s not what this is about.” Sam pulls back."},{"id":"c","t":"“Just stop worrying.”","reply":"“Right. Like it’s that easy.” Sam stops talking."},{"id":"d","t":"“Everyone gets stressed. It’s not a big deal.”","reply":"Sam shrugs. “Forget I said anything.”"}],"_a":"TEcEQQhIFRVFR19BfhEbQ1sWR1kDThtDVUdfGBBHRUMNRyFBHhFRAxVfVB4eEVRDDR5HF0ARDUNkRxhPEFcVW0xHEREQCRUyFRgY"},{"id":"t4","t":"Sam asks you to keep it secret","situation":"Sam looks worried. “Promise you won’t tell anyone.”","says":[{"id":"a","t":"“I care about you too much to keep this to myself if I’m worried about your health. Can we talk to someone together?”","reply":"Sam is quiet for a moment. “…Okay. Maybe. If you come with me.”"},{"id":"b","t":"“I promise.”","reply":"Sam looks relieved. “Thanks.” But you’re still worried, and no adult knows."},{"id":"c","t":"“I’ll tell the whole group so we can all help.”","reply":"“No! Please don’t.” Sam walks away."},{"id":"d","t":"“Only if you promise to eat more.”","reply":"“Forget it. You don’t get it.”"}],"_a":"TEcEQQhIFRVFR19BfhEbQ1YBR1kDThtDVUdfGBBHRUMNRylBHhFEBFRHX1JPHxUCFV8eQUZBFVsVNkceHhFTQw0eRxdAEQ1Dc0dJQVRRFVsGGBg="},{"id":"t5","t":"Next steps","situation":"Sam sighs. “So… what do I even do now?”","says":[{"id":"a","t":"“Would you talk to the school counsellor or your doctor? I can come with you.”","reply":"“If you come with me… yeah. Let’s go tomorrow.”"},{"id":"b","t":"“You could try a meal-plan app. I’ll send you one.”","reply":"“That’s not what I need.” Sam frowns."},{"id":"c","t":"“Look it up online and figure it out yourself.”","reply":"“Okay…” Sam sounds alone again."},{"id":"d","t":"“You just need to be more positive.”","reply":"Sam looks down. “I’m trying.”"}],"_a":"TEcEQQhIFRVFR19BfhEbQ0cXCkEIAhtDVgFHWQNOG0NVR18YEEdFQw1HIUEeEVEDFV9UHh4RVEMNHkcXQBENQ2RHGE8QVxVbTEcRERAJFTIVGBg="},{"id":"t6","t":"Looking after yourself","situation":"That night, you notice you feel worried and tired yourself. What will you do?","says":[{"id":"a","t":"“I’ll talk to a trusted adult about how I’m feeling too.”","reply":"Good thinking: helpers need support too. Sam is glad you’re still there."},{"id":"b","t":"“I’ll do something I enjoy to recharge, and keep checking in with Sam as a friend.”","reply":"Looking after yourself helps you keep being there for Sam."},{"id":"c","t":"“I’ll handle it all myself.”","reply":"Helpers need support too. You don’t have to carry this alone: talk to a trusted adult about how you’re feeling."},{"id":"d","t":"“I’ll keep an eye on what Sam eats every day.”","reply":"Sam notices you watching and pulls away. “I don’t want to be watched.”"}],"_a":"TEcEQQhIFRVFR19BfhEbQ1gOR1kDThtDVUdfGBBHRUMNRylBHhFYChVfVB4eEVRDDR5HF0ARDUN7R0lBQVZbBxVfVB4eEVNDDR5HF0ARDUNzR0lBVFEVWwYYGA=="}],"repair":{"intro":"Another friend, Riley, tried to talk with Sam. Three of Riley’s responses were unhelpful. Choose a turn, then choose a supportive response from the bank to replace it.","turns":[{"id":"r1","n":1,"sam":"Riley finds Sam alone at lunch.","bad":"“You’ve gotten so thin.”"},{"id":"r2","n":2,"sam":"“I’m fine. Drop it.”","keep":"“Okay. I’m here if you want to talk.”"},{"id":"r3","n":3,"sam":"“I’ve been really stressed. I feel like I’m not in control.”","bad":"“Just eat normally and you’ll be fine.”"},{"id":"r4","n":4,"sam":"“Promise you won’t tell anyone.”","bad":"“Okay, I won’t tell anyone.”"}],"bank":[{"id":"k1","t":"“I’ve noticed you seem tired and quiet lately, and I care about you. Is everything okay?”","_a":"FRdUQQ=="},{"id":"k2","t":"“You look fine to me.”","_a":"FUc="},{"id":"k3","t":"“That sounds really hard. Thank you for telling me.”","_a":"FRdWQQ=="},{"id":"k4","t":"“It sounds like you’re carrying a lot right now. I’m glad you told me.”","_a":"FRdWQQ=="},{"id":"k5","t":"“Have you tried a meal plan?”","_a":"FUc="},{"id":"k6","t":"“I care about you too much to keep this to myself. Can we talk to a trusted adult together?”","_a":"FRdRQQ=="},{"id":"k7","t":"“Okay, it’ll be our secret.”","_a":"FUc="},{"id":"k8","t":"“Just stop worrying so much.”","_a":"FUc="}]}},"predictions":[{"id":"p1","mode":"map","prompt":"Which kinds of factors do researchers say contribute to eating disorders?","options":[{"t":"Mainly vanity","_n":"oc1e","_k":"61e76a9a"},{"t":"Only social media","_n":"pc2e","_k":"2d46260a"},{"t":"A mix of biological, psychological and social factors","_n":"qc3e","_k":"b71547cd"},{"t":"A single gene","_n":"rb4e","_k":"cd2b3b6d"}],"explain":"No single cause, and never a choice. Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them."},{"id":"p2","mode":"myth","prompt":"“You can tell if someone has an eating disorder by looking at their body size.” Myth or fact?","options":[{"t":"Myth","_n":"sb5e","_k":"1ab4443e"},{"t":"Only for adults","_n":"tc2e","_k":"46a4300e"},{"t":"Fact","_n":"uc1e","_k":"067594f8"},{"t":"Only for boys","_n":"vc0e","_k":"66e647ea"}],"explain":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through."},{"id":"p3","mode":"talk","turn":0,"prompt":"Which opening is most likely to help Sam feel listened to?","options":[{"t":"Tell Sam to eat more","_n":"wbfe","_k":"4be93ffe"},{"t":"Mention that others are talking about Sam","_n":"xc6e","_k":"1e4b9c2e"},{"t":"Comment on how Sam looks","_n":"yc5e","_k":"87df2d18"},{"t":"Share what you’ve noticed and that you care, using “I”","_n":"zc4e","_k":"c695b955"}],"explain":"Focus on the person, not food or appearance. Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse."},{"id":"p4","mode":"talk","turn":3,"prompt":"Sam asks you to promise to keep a secret, and you’re worried about Sam’s health. What’s the caring choice?","options":[{"t":"Promise and say nothing","_n":"10c3e","_k":"e9046410"},{"t":"Post about it to get advice","_n":"11bae","_k":"33a2c2c4"},{"t":"Explain that you care too much to keep it to yourself, and offer to talk to a trusted adult together","_n":"12b9e","_k":"9360d788"},{"t":"Ignore it","_n":"13c0f","_k":"327dec2d"}],"explain":"When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal."}],"challenges":[{"id":"tc1","goal":2,"prompt":"Place all 12 factor cards correctly in the \u003cstrong>influence map\u003c/strong>.","why":"Eight cards can raise risk and four can help protect. No single factor causes an eating disorder; several combine.","msgs":{"support":"Supportive people protect.","diet":"Diet culture attaches worth to body size and food rules, which raises risk.","meals":"Shared meals are linked with lower risk.","unplaced":"Place every card first: {n} still in the tray.","count":"{k} of 12 cards are in the right column. Ask of each card: does this make things harder or easier for someone?"},"hints":["Ask: does this make things harder or easier for someone?","Four cards are protective.","Protective: supportive relationships, media literacy, body-respectful environments, shared meals."]},{"id":"tc2","goal":4,"prompt":"Complete the conversation with Sam so that all five key moves are ✓ and the safety step reads “yes”.","why":"Concern, listening, no body or food talk, professional help and a trusted adult: helping is about the person, not their food or body.","msgs":{"fb":"That comment focuses on Sam’s food or body. Try focusing on Sam.","sec":"Safety step not done.","unfinished":"Finish all six turns first: you’re on turn {n}.","i":"Start at turn 1 with what you’ve noticed and that you care, using “I”.","t2":"At turn 2, Sam asked you to drop it. Pushing or teasing makes Sam defensive; keep the door open instead.","ls":"At turn 3, Sam shared something hard. Listen and reflect first.","ad":"At turn 4, offer to talk to a trusted adult together.","pro":"At turn 5, suggest a professional (a school counsellor or doctor) and offer to go along.","self":"Helpers need support too. At turn 6, choose a way to look after yourself that includes support."},"hints":["Five moves: concern, listening, no body or food talk, professional help, a trusted adult.","Turn 4 is the safety step.","At turn 4, offer to talk to a trusted adult together."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Repair this conversation. (In \u003cstrong>Supportive conversation\u003c/strong>, choose \u003cstrong>Repair a conversation\u003c/strong>, then replace Riley’s three unhelpful responses from the bank of 8.)","why":"Each repair focuses on Sam: concern with an “I” statement, listening, and getting a trusted adult involved.","msgs":{"k2":"Still about appearance. Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","k5":"Still advice about food; listen first.","empty":"Replace all three unhelpful responses first: turn {n} still has Riley’s response.","k7":"That still keeps the secret. When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal.","k8":"That dismisses Sam’s feelings.","r1":"Turn 1 is the opening: share what you’ve noticed and that you care, using “I”.","r3":"At turn 3, Sam has just shared something hard: listen or reflect it back.","r4":"Turn 4 needs the trusted-adult choice."},"hints":["Find the three responses that focus on body, food or secrecy.","Swap each for one about Sam’s feelings, listening, or getting help.","Turn 4 needs the trusted-adult choice."]}],"blocks":[{"title":"What the tools show","html":"\u003cp>\u003cstrong>The big idea:\u003c/strong> eating disorders come from a mix of factors, and helping is about the person, not their food or body.\u003c/p>\u003ch4>The main types, described by their effects\u003c/h4>\u003cul class=\"ed-types\">\u003cli>\u003cstrong>Anorexia nervosa:\u003c/strong> an illness involving restriction of food and an intense fear related to weight and shape; it can seriously harm the heart, bones and other organs.\u003c/li>\u003cli>\u003cstrong>Bulimia nervosa:\u003c/strong> an illness involving repeated cycles of binge eating followed by behaviours meant to “undo” eating, which harm the body.\u003c/li>\u003cli>\u003cstrong>Binge-eating disorder:\u003c/strong> an illness involving repeated episodes of eating with loss of control and distress. Not a willpower problem.\u003c/li>\u003cli>\u003cstrong>ARFID\u003c/strong> (avoidant/restrictive food intake disorder): avoiding or restricting food for reasons other than body image (sensory, fear, low interest).\u003c/li>\u003c/ul>\u003cp>\u003cstrong>General warning signs\u003c/strong> are changes like the ones in Sam’s story: pulling away from shared meals, seeming tired or withdrawn, and avoiding talk about food. You can’t tell by looking at someone’s body.\u003c/p>\u003cp>\u003cstrong>Treatment and recovery:\u003c/strong> early help from a team (doctor, therapist, dietitian, family); recovery is possible.\u003c/p>"}]},"part3":{"slug":"media","name":"Media","heading":"Media, bodies and messages","intro":"Now move from the person to the world around us. Four stations: spot diet-culture messages, rewrite them, follow the money, and curate a feed. Every caption here is a \u003cstrong>fictional practice text\u003c/strong> written for this module. It’s text only, with no images of bodies.","s1":{"title":"Station 1: Spot the diet-culture message","how":"Tag each caption: a diet-culture message, neutral, or body-respectful.","tags":[{"id":"diet","t":"Diet-culture message"},{"id":"neutral","t":"Neutral"},{"id":"respect","t":"Body-respectful"}],"captions":[{"id":"cap1","t":"“Earn your dinner today!”","_a":"FQEMBkYR","why":"Food doesn’t have to be earned. This attaches rules and guilt to eating."},{"id":"cap2","t":"“Guilt-free dessert”","_a":"FQEMBkYR","why":"“Guilt-free” suggests other desserts should make you feel guilty: a moral label."},{"id":"cap3","t":"“Clean eating changed my life”","_a":"FQEMBkYR","why":"“Clean” suggests other food is dirty: a moral label."},{"id":"cap4","t":"“Swap your ‘bad’ snacks for good ones”","_a":"FQEMBkYR","why":"Sorting food into good and bad attaches guilt to eating."},{"id":"cap5","t":"“Every body deserves food and rest”","_a":"FRcAEEJWVBUV","why":"It respects every body and puts no conditions on eating."},{"id":"cap6","t":"“Fuel for the game: pasta, veg and milk”","_a":"FQsAFkZBVg0V","why":"It describes food plainly, by what it does."},{"id":"cap7","t":"“Lentil soup and fresh bread for lunch today”","_a":"FQsAFkZBVg0V","why":"A plain description: no rules and no guilt."},{"id":"cap8","t":"“All bodies deserve respect, at every size”","_a":"FRcAEEJWVBUV","why":"It respects people of every size."}]},"data":"\u003cp>Reviews that pull together many studies point the same way:\u003c/p>\u003cul>\u003cli>\u003cstrong>Appearance-focused media.\u003c/strong> Across experiments and surveys, viewing appearance-focused images and posts is linked with feeling worse about one’s own body (Grabe et al., 2008; Holland &amp; Tiggemann, 2016).\u003c/li>\u003cli>\u003cstrong>Weight stigma.\u003c/strong> Teasing and unfair treatment based on body size are linked with body dissatisfaction and harm to health (Puhl &amp; Suh, 2015).\u003c/li>\u003cli>\u003cstrong>Why it matters.\u003c/strong> Body dissatisfaction is one of the risk factors for eating disorders (Stice, 2002), while regular shared meals are linked with lower risk (Neumark-Sztainer et al., 2004).\u003c/li>\u003c/ul>\u003cp class=\"tiny muted\">These findings describe patterns across groups of people. They don’t predict what will happen to any one person.\u003c/p>\u003cul class=\"hfa-refs\">\u003cli>Grabe, S., Ward, L. M., &amp; Hyde, J. S. (2008). The role of the media in body image concerns among women: A meta-analysis of experimental and correlational studies. \u003ci>Psychological Bulletin, 134\u003c/i>(3), 460–476.\u003c/li>\u003cli>Holland, G., &amp; Tiggemann, M. (2016). A systematic review of the impact of the use of social networking sites on body image and disordered eating outcomes. \u003ci>Body Image, 17\u003c/i>, 100–110.\u003c/li>\u003cli>Neumark-Sztainer, D., Wall, M., Story, M., &amp; Fulkerson, J. A. (2004). Are family meal patterns associated with disordered eating behaviors among adolescents? \u003ci>Journal of Adolescent Health, 35\u003c/i>(5), 350–359.\u003c/li>\u003cli>Puhl, R. M., &amp; Suh, Y. (2015). Health consequences of weight stigma: Implications for obesity prevention and treatment. \u003ci>Current Obesity Reports, 4\u003c/i>(2), 182–190.\u003c/li>\u003cli>Stice, E. (2002). Risk and maintenance factors for eating pathology: A meta-analytic review. \u003ci>Psychological Bulletin, 128\u003c/i>(5), 825–848.\u003c/li>\u003c/ul>","s2":{"title":"Station 2: Rewrite it","how":"Rewrite each diet-culture caption in plain, weight-neutral language. Tap a word in the bank to add it to the caption you’re working on.","captions":[{"id":"rw1","t":"“Earn your dinner today!”","sample":"Enjoy a satisfying dinner together tonight."},{"id":"rw2","t":"“Guilt-free dessert”","sample":"A dessert full of flavour to share."},{"id":"rw3","t":"“Clean eating changed my life”","sample":"Eating a variety of foods gives me energy for what I love."}],"bank":["enjoy","energy","together","satisfying","flavour","rest"],"clear":"✓ No moral food words or body-size words.","flagged":"Flagged: {w}. Try describing flavour, energy, rest or who you share it with."},"s3":{"title":"Station 3: Who benefits?","how":"Follow the chain. Tap a label, then tap the step it belongs to.","steps":[{"id":"f1","t":"Diet products and programs","slot":true,"_a":"FRUXDFRaQ0M=","why":"Companies selling diet products and programs are after profit."},{"id":"f2","t":"Advertising","note":"the message"},{"id":"f3","t":"Algorithms that show more of what keeps people scrolling","slot":true,"_a":"FQQRF1ddQwhYC0c=","why":"Algorithms compete for your attention: they show more of whatever keeps you scrolling."},{"id":"f4","t":"Feelings of not being enough","slot":true,"_a":"FQwLEFdQQhNeERxB","why":"Feeling that you’re not enough is insecurity."},{"id":"f5","t":"More purchases","slot":true,"_a":"FRUQEVFbVhJSRw==","why":"Insecurity drives the purchase, and the cycle starts again."}],"labels":[{"id":"profit","t":"profit"},{"id":"attention","t":"attention"},{"id":"insecurity","t":"insecurity"},{"id":"purchase","t":"purchase"}],"loop":"…and the cycle repeats.","cer":[["Claim","Companies selling diet products and programs benefit when people feel their bodies aren’t good enough."],["Evidence","The chain: ads and algorithms capture attention, repeated messages build insecurity, and insecurity leads to purchases."],["Reasoning","Insecurity can be profitable. Questioning these messages, and the business behind them, builds a healthier environment for everyone."]]},"s4":{"title":"Station 4: Curate your feed","how":"Four protective habits. Open each one to see why it helps.","tips":[{"t":"Unfollow or mute accounts that make you feel worse about your body.","why":"What you see often shapes how you feel. You choose what stays in your feed."},{"t":"Follow accounts focused on interests, skills and diverse people.","why":"A feed about what people do, make and care about leaves less room for appearance."},{"t":"Turn off “suggested” content where possible.","why":"Suggestions show more of whatever keeps you scrolling, not what’s good for you."},{"t":"Talk about what you see.","why":"Naming a diet-culture message with a friend or a trusted adult takes away some of its power."}]},"quickCheck":{"title":"Media quick check","summary":"Media quick check","items":[{"id":"q1","goal":5,"prompt":"Which caption is body-respectful?","choices":[{"t":"“Earn your dinner”","fb":"The others attach guilt or rules to eating. Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"14c1f","_k":"aaf3a8e7"},{"t":"“Clean eating changed my life”","fb":"The others attach guilt or rules to eating. Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"15bef","_k":"a31c31ed"},{"t":"“Guilt-free dessert”","fb":"The others attach guilt or rules to eating. Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"16bff","_k":"924a1aa1"},{"t":"“Every body deserves food and rest”","fb":"Right. It respects every body and attaches no rules to eating.","_n":"17c4f","_k":"18df3d12"}]},{"id":"q2","goal":5,"prompt":"Why do moral food words matter?","choices":[{"t":"They attach guilt and shame to eating","fb":"Right. Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"18c5f","_k":"8a14ccbc"},{"t":"They make food taste better","fb":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"19c2f","_k":"e9a89cc1"},{"t":"They improve nutrition","fb":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"1ac3f","_k":"aa2af7cc"},{"t":"They’re required on labels","fb":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"1bb8f","_k":"055dfabb"}]},{"id":"q3","goal":5,"prompt":"Who most benefits when people feel their bodies aren’t good enough?","choices":[{"t":"Teachers","fb":"Insecurity can be profitable.","_n":"1cb9f","_k":"d0778eb7"},{"t":"Grocery store cashiers","fb":"Insecurity can be profitable.","_n":"1dc6f","_k":"fe7bb974"},{"t":"Companies selling diet products and programs","fb":"Right. Insecurity can be profitable.","_n":"1ec5f","_k":"838b2461"},{"t":"Public health agencies","fb":"Insecurity can be profitable.","_n":"1fc8f","_k":"908df75c"}]},{"id":"q4","goal":6,"prompt":"Which is a protective media habit?","choices":[{"t":"Muting accounts that make you feel worse about your body","fb":"Right. Curating your feed protects your well-being.","_n":"1gc7f","_k":"df7c70ed"},{"t":"Comparing yourself with influencers","fb":"Curating your feed protects your well-being.","_n":"1hc2f","_k":"caf7bf5c"},{"t":"Following more “body goals” accounts","fb":"Curating your feed protects your well-being.","_n":"1ic1f","_k":"8e459b16"},{"t":"Posting your meals for feedback","fb":"Curating your feed protects your well-being.","_n":"1jc4f","_k":"d31aee04"}]}]}},"practice":{"activities":[{"id":"myths","type":"sorter","title":"Myth or fact?","summary":"Myth or fact","goal":[1,3],"txt":true,"noun":"statement","instruction":"Ten statements about eating disorders. Is each one a myth or a fact?","boxes":[{"id":"myth","label":"Myth"},{"id":"fact","label":"Fact"}],"items":[{"id":"m1","t":"“You can tell someone has an eating disorder by their size.”","_a":"FQgcF1oR","why":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through.","wrong":{"fact":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through."}},{"id":"m2","t":"“Eating disorders are serious mental illnesses.”","_a":"FQMEAEYR","why":"With physical and psychological effects.","wrong":{"myth":"It’s a fact: eating disorders are serious mental illnesses, with physical and psychological effects."}},{"id":"m3","t":"“Only teenage girls get eating disorders.”","_a":"FQgcF1oR","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","wrong":{"fact":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed."}},{"id":"m4","t":"“Recovery is possible, especially with early help.”","_a":"FQMEAEYR","why":"Treatment teams help people recover.","wrong":{"myth":"It’s a fact: treatment teams help people recover."}},{"id":"m5","t":"“Binge-eating disorder is just a lack of willpower.”","_a":"FQgcF1oR","why":"Binge-eating disorder is a recognized illness involving loss of control and distress; willpower isn’t the issue.","wrong":{"fact":"Binge-eating disorder is a recognized illness involving loss of control and distress; willpower isn’t the issue."}},{"id":"m6","t":"“Eating disorders can affect people from every culture and income level.”","_a":"FQMEAEYR","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","wrong":{"myth":"It’s a fact. People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed."}},{"id":"m7","t":"“ARFID is about wanting to change body shape.”","_a":"FQgcF1oR","why":"ARFID involves avoiding or restricting food for other reasons, such as sensory sensitivity, fear of choking, or low interest in eating; it isn’t driven by body image.","wrong":{"fact":"ARFID involves avoiding or restricting food for other reasons, such as sensory sensitivity, fear of choking, or low interest in eating; it isn’t driven by body image."},"hints":["What does the “A” in ARFID stand for?","Avoidant.","It’s not about body image: Myth."]},{"id":"m8","t":"“Weight-based teasing can raise the risk of eating disorders.”","_a":"FQMEAEYR","why":"Weight stigma is a known risk factor.","wrong":{"myth":"It’s a fact: weight stigma is a known risk factor."}},{"id":"m9","t":"“If someone says they’re fine, you should never bring it up again.”","_a":"FQgcF1oR","why":"Keep the door open: “I’m here when you want to talk.”","wrong":{"fact":"Keep the door open: “I’m here when you want to talk.”"}},{"id":"m10","t":"“Eating disorders have among the highest risks of death of any mental illness.”","_a":"FQMEAEYR","why":"That’s why early help matters.","wrong":{"myth":"It’s a fact. That’s why early help matters."}}]},{"id":"help","type":"mc","title":"What would help?","summary":"What would help?","star":true,"goal":[4,6],"instruction":"Six scenarios. Choose the best response for each. Scenarios marked ★ are non-routine; the last two go beyond the Final Check.","items":[{"id":"h1","goal":4,"prompt":"Your friend jokes about “needing to earn” their lunch.","options":[{"t":"Join in the joke","why":"That reinforces diet culture. Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"1kc3f","_k":"20c3450a"},{"t":"Gently question the idea that food has to be earned, and keep the focus on your friend and how they’re doing","why":"Food doesn’t have to be earned. A gentle question that stays on your friend keeps the door open.","_n":"1lbef","_k":"7429fbcf"},{"t":"Tell your friend what they should eat for lunch","why":"Advice about food isn’t the way to help. Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"1mbdf","_k":"2981b458"},{"t":"Laugh it off and change the subject","why":"Ignoring it leaves the idea that food must be earned unquestioned.","_n":"1n34f","_k":"d7c26b90"}]},{"id":"h2","goal":4,"prompt":"A teammate’s coach praises one athlete’s weight loss in front of the team.","options":[{"t":"Talk to a trusted adult (another coach, a parent, a counsellor) about body comments in sport","why":"Adults can change the team culture.","_n":"1o35f","_k":"71c77393"},{"t":"Say nothing","why":"Weight-focused comments in sport are a known risk factor; adults can change the team culture.","_n":"1p36f","_k":"e4b5fab8"},{"t":"Post about the coach online","why":"Posting publicly can shame people and doesn’t fix the problem. Talk to a trusted adult.","_n":"1q37f","_k":"0a9c7d50"},{"t":"Compliment the athlete too","why":"More body comments add to the problem. Comments on bodies can make things worse.","_n":"1r30f","_k":"0ac89500"}]},{"id":"h3","goal":6,"prompt":"\u003cspan class=\"tag\">★\u003c/span> Your younger cousin eats only a few foods and gags on new textures, but says nothing about weight. The family thinks it’s picky eating.","options":[{"t":"Force new foods","why":"Pressure can make it worse; a professional can help.","_n":"1s31f","_k":"e9390910"},{"t":"Tell the cousin not to worry about weight","why":"The cousin says nothing about weight: ARFID isn’t about body image.","_n":"1t32f","_k":"4bdd0bf8"},{"t":"Ignore it: all kids are picky","why":"Some picky eating is common, but a pattern like this can be a sign of ARFID. A doctor can tell the difference.","_n":"1u33f","_k":"71c38e90"},{"t":"Suggest the family talk to a doctor: this pattern can be a sign of ARFID, which is not about body image","why":"A doctor can assess it, and ARFID isn’t driven by body image.","_n":"1v3cf","_k":"5b028920"}],"hints":["Is the cousin’s eating about body image?","No; it’s about textures and fear.","Suggest a doctor; it could be ARFID."]},{"id":"h4","goal":4,"prompt":"\u003cspan class=\"tag\">★\u003c/span> A friend shares that they’ve been struggling with eating and asks you to keep it secret. You’re worried.","options":[{"t":"Give them advice about what to eat","why":"Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"1w3df","_k":"d1675705"},{"t":"Thank them for trusting you; say you care too much to keep it to yourself; offer to go together to a counsellor","why":"It’s caring and honest, and it gets help started. When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal.","_n":"1x3af","_k":"0dde9f88"},{"t":"Tell everyone in your friend group","why":"Private concerns shouldn’t be shared with the group. Involve a trusted adult instead.","_n":"1y39f","_k":"1035839e"},{"t":"Promise to keep it secret","why":"When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal.","_n":"1z38f","_k":"d38ef150"}]},{"id":"h5","goal":6,"prompt":"\u003cspan class=\"tag\">★ Inquiry\u003c/span> Which research question would best investigate how social media relates to body image in Grade 12 students?","options":[{"t":"“Why does social media cause eating disorders?”","why":"It assumes a single cause. Eating disorders have many causes, and a good question doesn’t assume its answer.","_n":"2037f","_k":"aba13b68"},{"t":"“How does time spent viewing appearance-focused content relate to how Grade 12 students describe their body image, according to published studies?”","why":"It’s focused, measurable and answerable from published research.","_n":"2136f","_k":"50c81523"},{"t":"“What is the best social media app?”","why":"That’s about opinion, not body image, and evidence can’t settle it.","_n":"2235f","_k":"f1c3a764"},{"t":"“Is social media bad?”","why":"Too broad and not measurable.","_n":"2334f","_k":"ee4b4eb4"}]},{"id":"h6","goal":6,"prompt":"\u003cspan class=\"tag\">★ Inquiry\u003c/span> Two sources describe eating disorders. Source A is a national eating disorder organization’s page citing research; Source B is a wellness influencer’s video saying they’re “caused by bad habits.” Which evaluation is best?","options":[{"t":"Source B is more reliable because the influencer looks healthy","why":"Appearance isn’t evidence.","_n":"2433f","_k":"c01a3d08"},{"t":"Source A is more reliable: it cites research and has no product to sell. Source B makes an unsupported claim and may profit from its audience","why":"Check the evidence and who benefits.","_n":"2542f","_k":"d33d9bc6"},{"t":"Source B has more views, so it’s better","why":"Popularity isn’t reliability.","_n":"2641f","_k":"eadcab19"},{"t":"Both are equally reliable because both are online","why":"Where something is posted doesn’t make it reliable; evidence and motive do.","_n":"27b8d","_k":"1584c0cd"}]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Joaquin","goal":[1,4,5],"how":"","instruction":"Joaquin made one mistake in each plan. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Joaquin’s plan to help a friend he’s worried about.","steps":["“Find a private, calm time to talk.”","“Start with ‘I’ve noticed you seem stressed, and I care about you.’”","“Tell her she looks too thin and needs to eat more.”","“Suggest she talk to the school counsellor.”","“Tell a trusted adult if I’m still worried.”"],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is fine, but an earlier step goes wrong first.","Step 5 is a good safety step."],"fixes":[{"t":"“Send her a diet plan.”","why":"Not helpful.","_n":"28b9d","_k":"75046957"},{"t":"Step 3 is correct.","why":"Comments about bodies and food can make things worse.","_n":"29b6d","_k":"f4214c8d"},{"t":"“Tell her she looks fine.”","why":"Still about appearance. Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"2ab7d","_k":"778a1664"},{"t":"“Listen to how she’s feeling, and avoid comments about her body or food.”","why":"It keeps the focus on her, not her body or food.","_n":"2bb4d","_k":"f5cc255b"}],"hints":["Which step talks about her body?","Step 3.","Replace it with listening."]},{"id":"e2","goal":5,"task":"Joaquin’s draft poster for Healthy Schools Week.","steps":["“Title: Food, friends and feeling good.”","“Enjoy a variety of foods with people you like.”","“Say no to junk and eat clean!”","“Need to talk? Kids Help Phone and the school counsellor are here.”"],"_a":"BQ==","stepFb":["Step 1 is fine.","Step 2 is fine.","","Step 4 is good."],"fixes":[{"t":"“Eat less and move more!”","why":"Weight-focused and not helpful.","_n":"2cb5d","_k":"f095c044"},{"t":"“Try new foods and enjoy meals together.”","why":"Welcoming and neutral: no moral labels.","_n":"2db2d","_k":"84f757bb"},{"t":"“Ban dessert at school.”","why":"Moral rules about food.","_n":"2eb3d","_k":"cf324c04"},{"t":"Step 3 is correct.","why":"“Junk” and “clean” are moral labels.","_n":"2fc0d","_k":"5b1c7b73"}],"hints":["Which words label food as good or bad?","“Junk” and “clean”.","Rewrite it in neutral, welcoming words."]},{"id":"e3","goal":1,"task":"Joaquin’s explanation of eating disorders for a class presentation.","steps":["“Eating disorders are serious mental illnesses.”","“They’re caused by a mix of biological, psychological and social factors.”","“Binge-eating disorder happens when people don’t have enough willpower.”","“Recovery is possible with help from a treatment team.”"],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"“Binge-eating disorder isn’t a real illness.”","why":"It is a recognized eating disorder.","_n":"2gc1d","_k":"64a5ba23"},{"t":"“Binge-eating disorder is a recognized illness involving loss of control and distress; it isn’t about willpower.”","why":"Accurate: it’s an illness, not a willpower problem.","_n":"2hbed","_k":"8e87ad48"},{"t":"“Binge-eating disorder only affects adults.”","why":"It can affect people of any age.","_n":"2ibdd","_k":"4334c80f"},{"t":"Step 3 is correct.","why":"Binge-eating disorder is a recognized illness involving loss of control and distress; willpower isn’t the issue.","_n":"2jc0d","_k":"d57d94c7"}],"hints":["Which step blames the person?","Step 3.","It’s an illness, not a willpower problem."]}]}]},"reflect":{"journalNote":"These entries stay on your device. They are not added to your summary unless you choose to add them.","optIn":"Add my journal entries to my results summary","journal":[{"id":"j1","q":"Which myth did you believe before this module, and what changed your mind?"},{"id":"j2","q":"In your own words, why can’t you tell by looking whether someone is struggling?"},{"id":"j3","q":"Explain to a friend the five moves of a supportive conversation."},{"id":"j4","q":"Which media message about food or bodies will you question differently now?"}]},"final":{"altIntro":"The shorter path’s Final Check: its Communication and Application questions. There are no hints. Answer all four and say how sure you are, then submit to see your results.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which description of binge-eating disorder is accurate?","options":[{"t":"A lack of willpower","why":"Binge-eating disorder is a recognized illness involving loss of control and distress; willpower isn’t the issue.","_n":"2kbfd","_k":"a3a6806f"},{"t":"Repeated episodes of eating with a sense of loss of control and distress; a recognized illness","why":"It’s a recognized illness; willpower isn’t the issue.","_n":"2lc2d","_k":"58e1d4d4"},{"t":"A condition that only affects teenagers","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","_n":"2mc1d","_k":"4896150d"},{"t":"A phase that always passes without help","why":"Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them.","_n":"2nc4d","_k":"a6bf5ebf"}]},"b":{"prompt":"Which description of ARFID is accurate?","options":[{"t":"Restriction driven mainly by wanting to change body shape","why":"That isn’t ARFID’s defining feature.","_n":"2oc3d","_k":"35079a39"},{"t":"A type of picky eating that is never serious","why":"It can seriously affect health.","_n":"2pb6d","_k":"a8cfa480"},{"t":"Avoiding or restricting food for reasons such as sensory sensitivity, fear of choking or low interest in eating, not body image","why":"ARFID isn’t driven by body image.","_n":"2qb5d","_k":"9d1291f1"},{"t":"An eating disorder that only adults develop","why":"It often begins in childhood.","_n":"2r6cb","_k":"09ca7cf5"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which statement about who can develop an eating disorder is accurate?","options":[{"t":"Only teenage girls","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","_n":"2s6bb","_k":"cc0185c9"},{"t":"Only people who diet","why":"Many factors are involved.","_n":"2t6ab","_k":"1fb9afb9"},{"t":"Only people with very small bodies","why":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through.","_n":"2u69b","_k":"fabe1cc0"},{"t":"People of every gender, age, culture, income and body size","why":"Anyone can be affected, and you can’t tell by looking.","_n":"2v70b","_k":"61dc8f86"}]},"b":{"prompt":"A classmate in a larger body tells you they’re struggling with eating. Which belief is a myth?","options":[{"t":"“A trusted adult can help connect them to care.”","why":"That’s a fact.","_n":"2w6fb","_k":"0195bb79"},{"t":"“People in larger bodies can’t have eating disorders.”","why":"They can, and they’re often missed. Eating disorders affect people of every size. Body size doesn’t show what someone is going through.","_n":"2x6eb","_k":"07b5ec06"},{"t":"“Early help improves recovery.”","why":"That’s a fact.","_n":"2y6db","_k":"25db3a65"},{"t":"“Eating disorders are serious illnesses.”","why":"That’s a fact.","_n":"2z74b","_k":"adcc7209"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Why are boys and men with eating disorders often missed?","options":[{"t":"Because their eating disorders are never serious","why":"They can be very serious.","_n":"3073b","_k":"3cfd56ef"},{"t":"Because doctors don’t treat boys","why":"They do.","_n":"3166b","_k":"b1c7ad5c"},{"t":"Because of the myth that eating disorders only affect girls and women","why":"The myth means people don’t look for it in boys and men. People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","_n":"3267b","_k":"2ad7a4a5"},{"t":"Because boys can’t develop eating disorders","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","_n":"3368b","_k":"c33b7828"}]},"b":{"prompt":"Which statement about culture and eating disorders is accurate?","options":[{"t":"They only occur in one ethnic group","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","_n":"3469b","_k":"bd54b9aa"},{"t":"Culture has nothing to do with food and body messages","why":"Culture shapes messages about food and bodies.","_n":"356ab","_k":"d59f00bb"},{"t":"They only occur in wealthy countries","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","_n":"366bb","_k":"6f4c471f"},{"t":"Eating disorders occur across all cultures and communities","why":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed.","_n":"376cb","_k":"4c1479a8"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"A student has a parent with an eating disorder, is very perfectionistic, and plays a sport where coaches comment on weight. What’s the best analysis?","options":[{"t":"Biological, psychological and social risk factors combine here; supportive adults and changing the team culture could help protect them","why":"Several factors combine, and protective factors can lower risk.","_n":"386db","_k":"86fed154"},{"t":"Only the sport matters","why":"Several factors combine.","_n":"396eb","_k":"6577c4cb"},{"t":"This student will definitely develop an eating disorder","why":"Risk factors raise risk; they don’t decide outcomes.","_n":"3a6fb","_k":"059e6edc"},{"t":"It’s this student’s choice","why":"Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them.","_n":"3bf8b","_k":"894aeed1"}]},"b":{"prompt":"Which combination of factors best fits the idea that eating disorders have biological, psychological \u003cstrong>and\u003c/strong> social influences?","options":[{"t":"Choosing to diet","why":"Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them.","_n":"3cf7b","_k":"58f0a933"},{"t":"Family history, anxiety, and weight-based teasing","why":"One biological, one psychological and one social factor.","_n":"3dfab","_k":"184df6a5"},{"t":"Social media only","why":"One type.","_n":"3ef9b","_k":"6a6f0153"},{"t":"Family history only","why":"One type.","_n":"3ffcb","_k":"715076b2"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Your friend says “I’m fine, stop asking” after you express concern. What’s the best next step?","options":[{"t":"Comment on their eating so they understand your worry","why":"Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"3gfbb","_k":"9ab1796e"},{"t":"Drop it completely and never mention it again","why":"Keep the door open.","_n":"3hfeb","_k":"e865b03a"},{"t":"Keep pressing until they tell you","why":"Pressure can push them away.","_n":"3ifdb","_k":"ad07ba5e"},{"t":"Respect their wish for now, say you’re there whenever they want to talk, and talk to a trusted adult if you remain worried","why":"It respects their wish, keeps the door open and keeps them safe.","_n":"3jf0b","_k":"c5e70e6e"}]},"b":{"prompt":"A friend opens up about struggling with eating. Which response best shows listening?","options":[{"t":"“That sounds really hard. Thank you for telling me. I’m here for you.”","why":"It reflects their feelings and thanks them for trusting you.","_n":"3kefb","_k":"497623c4"},{"t":"“You just need to eat normally.”","why":"Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"3lf2b","_k":"72e46eb5"},{"t":"“You don’t look like you have a problem.”","why":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through. Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"3mf3b","_k":"70066071"},{"t":"“Everyone feels that way; don’t worry.”","why":"Dismisses their feelings.","_n":"3nf0b","_k":"66346ed5"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A school wants to prevent eating disorders. Which strategy is best supported?","options":[{"t":"Weighing all students each term","why":"Focuses on weight and can harm.","_n":"3of1b","_k":"f9751f91"},{"t":"Media-literacy lessons, a no-body-comments policy in sports and classes, and clear ways to reach counsellors","why":"Each part is protective: media literacy, no body comments, and easy access to help.","_n":"3peeb","_k":"a370eac4"},{"t":"Banning all discussion of eating disorders","why":"Silence prevents help-seeking.","_n":"3qefb","_k":"e67ab4b9"},{"t":"Posters labelling foods ‘good’ and ‘bad’","why":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"3recb","_k":"49989047"}]},"b":{"prompt":"Which prevention idea is most likely to backfire?","options":[{"t":"Training coaches to avoid weight comments","why":"Protective.","_n":"3sedb","_k":"0cb28bbd"},{"t":"Sharing where to get confidential help","why":"Protective.","_n":"3tfab","_k":"8bea28c2"},{"t":"A class challenge comparing what students eat in a day","why":"Encourages comparison and rules.","_n":"3ufbb","_k":"7ae06df7"},{"t":"Teaching students to question appearance-focused ads","why":"Protective.","_n":"3v04c","_k":"a2d3b9b4"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which sentence best corrects the myth “you can tell by looking”?","options":[{"t":"“Most people with eating disorders look very thin.”","why":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through.","_n":"3w03c","_k":"c348ee8e"},{"t":"“You can usually tell by how much someone eats at lunch.”","why":"Observing someone’s eating isn’t the way to judge, or to help.","_n":"3x02c","_k":"07041c3c"},{"t":"“Only doctors can tell by looking.”","why":"Not by looking: by assessment.","_n":"3y01c","_k":"a59f08da"},{"t":"“Eating disorders affect people of every body size, so you can’t tell by looking; what matters is how someone is doing.”","why":"It corrects the myth and focuses on the person.","_n":"3z00c","_k":"4f865fbf"}]},"b":{"prompt":"Which sentence best explains that eating disorders aren’t a choice?","options":[{"t":"“They’re caused only by social media.”","why":"One factor among many.","_n":"40ffc","_k":"deb9a6c7"},{"t":"“They’re a phase teens grow out of.”","why":"Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them.","_n":"41fec","_k":"f350e155"},{"t":"“People choose them to get attention.”","why":"Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them.","_n":"42fdc","_k":"4a2cb317"},{"t":"“Eating disorders are serious illnesses with biological, psychological and social causes; no one chooses them.”","why":"It names the causes and says plainly that no one chooses them.","_n":"43fcc","_k":"8e0e10fe"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which message to a worried friend is clearest and most supportive?","options":[{"t":"“I’m telling everyone so they can help.”","why":"Public, not private.","_n":"44fbc","_k":"004faf4f"},{"t":"“I care about you and I’ve noticed you seem stressed. Would you talk to the counsellor with me? I can come too.”","why":"Caring, specific and private, and it offers a way to get help.","_n":"45feb","_k":"445882d1"},{"t":"“Promise me you’ll just stop.”","why":"It isn’t that simple.","_n":"46ffb","_k":"89c22622"},{"t":"“You need to eat more, seriously.”","why":"Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"4700b","_k":"62b948fb"}]},"b":{"prompt":"Which sentence best explains why we don’t comment on a friend’s weight or food when we’re worried?","options":[{"t":"“Because it’s rude.”","why":"True, but it doesn’t explain the effect.","_n":"4801b","_k":"d2199c3d"},{"t":"“Because weight never matters for health.”","why":"Not the point here.","_n":"49fab","_k":"4e766906"},{"t":"“Because they’ll stop eating at lunch.”","why":"Not an accurate or helpful explanation.","_n":"4afbb","_k":"fb159339"},{"t":"“Comments about bodies or food can increase shame and make it harder to reach out; focusing on the person helps them feel safe.”","why":"It explains the effect: shame makes reaching out harder.","_n":"4bfcb","_k":"a71ebbb4"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"At a sleepover, a friend tells you they’re struggling with eating and asks you to keep it secret. The next day you’re still worried. What should you do?","options":[{"t":"Post about it anonymously online for advice","why":"Private information shouldn’t be posted.","_n":"4cfdb","_k":"8f45dc5d"},{"t":"Tell a trusted adult (a parent, counsellor or teacher), and let your friend know you’re doing it because you care","why":"When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal.","_n":"4df6b","_k":"de6d66db"},{"t":"Keep the secret forever","why":"Their health and safety matter more than a secret. When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal.","_n":"4ef7b","_k":"902299c4"},{"t":"Confront them in front of the group","why":"Shaming and public.","_n":"4f70c","_k":"8f25677c"}]},"b":{"prompt":"Your friend’s younger sibling has stopped eating with the family and seems withdrawn. Your friend asks what to do. What’s the best advice?","options":[{"t":"Tease the sibling into eating","why":"Harmful.","_n":"4g6fc","_k":"1b83bc60"},{"t":"Give the sibling a meal plan","why":"Professionals guide treatment. Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse.","_n":"4h72c","_k":"9ffbc8f4"},{"t":"Tell their parents or another trusted adult so the sibling can see a doctor","why":"Early help matters, and a doctor can assess what’s going on.","_n":"4i71c","_k":"d8850ed5"},{"t":"Wait until the sibling asks for help","why":"Early help matters.","_n":"4j6cc","_k":"09732d44"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A fictional brand’s post reads “Guilt-free snacks to earn your body goals.” Which analysis is strongest?","options":[{"t":"It’s helpful nutrition advice","why":"No evidence; it’s marketing.","_n":"4k6bc","_k":"ababc2a8"},{"t":"It’s a neutral product description","why":"It’s persuasive and moralizing.","_n":"4l6ec","_k":"26fedc9c"},{"t":"It uses moral food words (“guilt-free”, “earn”) and links worth to body goals to sell snacks; it profits from insecurity","why":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone. And it profits from insecurity.","_n":"4m6dc","_k":"005276cb"},{"t":"It’s fine because the snacks might be nutritious","why":"The message is the issue.","_n":"4n78c","_k":"9a451f7c"}]},"b":{"prompt":"Which rewrite of “Clean eating for a better you!” is body-respectful?","options":[{"t":"“Cut the junk, love your body!”","why":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"4o77c","_k":"6a8e3dee"},{"t":"“Guilt-free meals for summer!”","why":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"4p6ac","_k":"a504b16c"},{"t":"“Enjoy a variety of foods that give you energy for what you love.”","why":"Plain, welcoming words: no moral labels and no body talk.","_n":"4q6bc","_k":"87908e09"},{"t":"“Eat clean, get lean!”","why":"Moral labels attach guilt to eating. Describing food plainly is healthier for everyone.","_n":"4r68c","_k":"336d5b93"}]}}]},"task":{"title":"Support card","summary":"Support card","statement":"\u003cp>Create a one-page support card for students at your school: what eating disorders are, myths and facts, how to support a friend, and where to get help. Your card must be accurate, supportive and free of numbers and body talk.\u003c/p>","statementB":"\u003cp>\u003cstrong>Option B: Media critique.\u003c/strong> Analyse three fictional diet-culture captions from Part 3 and rewrite them, with a short paragraph on who benefits.\u003c/p>","options":[{"id":"card","t":"Support card"},{"id":"critique","t":"Option B: Media critique"}],"checks":["Accurate information","Myths corrected","How to help","Where to get help","No numbers or body talk","Message length"],"checksB":["Three diet-culture captions analysed","Each caption rewritten","Who benefits","Where to get help","No numbers or body talk","Message length"],"tips":["Pick two statements that explain what eating disorders are.","Correct at least two myths, like “you can tell by looking”.","Don’t leave out “involve a trusted adult”.","Include at least one helpline.","Your message flagged a word: {w}. Try describing feelings, people and help instead.","Aim for 40–100 words."],"tipsB":["Choose three diet-culture captions and name what each one does.","Rewrite each caption in plain, welcoming words (at least three words each).","Say who benefits: name the companies, products or profit behind the message."],"numTip":"Your card has a number in it. Leave numbers out of what you write (helpline numbers are added for you).","explainPrompt":"Explain two choices you made to keep your card supportive and safe, and why they matter.","vocab":"Use the words stigma, supportive, trusted adult and recovery.","checkLabel":"Check my card","success":"Your card works.","more":"There’s more than one good card. Can you make another?","audiences":[{"id":"g910","t":"Grade 9–10"},{"id":"g1112","t":"Grade 11–12"}],"whatBank":[{"id":"w1","t":"Eating disorders are serious mental illnesses with physical effects."},{"id":"w2","t":"Eating disorders affect people of every size and gender."},{"id":"w3","t":"Eating disorders affect people of every age, culture and income."},{"id":"w4","t":"They come from a mix of biological, psychological and social factors. No one chooses them."},{"id":"w5","t":"You can’t tell by looking whether someone is struggling."},{"id":"w6","t":"Recovery is possible, and early help makes a real difference."},{"id":"w7","t":"Anorexia nervosa, bulimia nervosa, binge-eating disorder and ARFID are serious, treatable illnesses."},{"id":"w8","t":"Binge-eating disorder is a recognized illness involving loss of control and distress. It isn’t about willpower."},{"id":"w9","t":"ARFID means avoiding or restricting food for reasons other than body image, such as sensory sensitivity, fear of choking or low interest in eating."},{"id":"w10","t":"Treatment teams (doctors, therapists, dietitians and families) help people recover."},{"id":"w11","t":"Boys and men can develop eating disorders, and they’re often missed."},{"id":"w12","t":"Asking for help is a strength."}],"mythBank":[{"id":"p1","myth":"You can tell by looking at someone’s size.","fact":"Eating disorders affect people of every size. Body size doesn’t show what someone is going through."},{"id":"p2","myth":"Only teenage girls get eating disorders.","fact":"People of every gender, age, culture and income can develop eating disorders. Boys and men are often missed."},{"id":"p3","myth":"Eating disorders are a choice, a phase or about vanity.","fact":"Eating disorders are serious mental illnesses with biological, psychological and social causes. No one chooses them."},{"id":"p4","myth":"Binge-eating disorder is just a lack of willpower.","fact":"Binge-eating disorder is a recognized illness involving loss of control and distress; willpower isn’t the issue."},{"id":"p5","myth":"The way to help is to comment on their eating or appearance.","fact":"Talk about the person and how they seem, not their weight or food. Comments on bodies can make things worse."},{"id":"p6","myth":"If a friend asks you to keep it secret, you must.","fact":"When you’re worried about someone’s health or safety, telling a trusted adult is caring, not betrayal."}],"moves":[{"id":"mi","t":"Share your concern with an “I” statement"},{"id":"ml","t":"Listen without judging"},{"id":"mn","t":"Don’t comment on weight, food or appearance"},{"id":"mp","t":"Suggest professional help"},{"id":"ma","t":"Involve a trusted adult","key":true}],"contacts":[{"id":"khp","t":"Kids Help Phone","detail":"1-800-668-6868, or text CONNECT to 686868","line":true},{"id":"nedic","t":"NEDIC helpline","detail":"1-866-633-4220","line":true},{"id":"coun","t":"School counsellor"},{"id":"doc","t":"Family doctor"},{"id":"adult","t":"A trusted adult"}],"blocked":["calorie","kg","lb","pound","BMI","skinny","thin","fat","overweight","underweight","slim","diet","clean","junk","guilt","cheat","earn","burn"],"blockedBody":["calorie","kg","lb","pound","BMI","skinny","thin","fat","overweight","underweight","slim"],"techniques":[{"id":"earn","t":"Food has to be earned"},{"id":"moral","t":"Moral words (guilt, clean)"},{"id":"goodbad","t":"Foods sorted into good and bad"},{"id":"worth","t":"Links worth to body"}],"benefitWords":["company","companies","business","brand","profit","sell","money","industry","advertiser"]},"cards":[["Eating disorder","A serious mental illness affecting eating, thoughts and feelings, with physical effects; treatable."],["Anorexia nervosa","An illness involving restriction of food and an intense fear related to weight and shape; it can seriously harm the heart, bones and other organs."],["Bulimia nervosa","An illness involving repeated cycles of binge eating followed by behaviours meant to “undo” eating, which harm the body."],["Binge-eating disorder","An illness involving repeated episodes of eating with loss of control and distress. Not a willpower problem."],["ARFID","Avoidant/restrictive food intake disorder: avoiding or restricting food for reasons other than body image (sensory, fear, low interest)."],["Risk factors","Biological (family history), psychological (anxiety, perfectionism) and social (weight stigma, diet culture) factors combine."],["Protective factors","Supportive relationships, media literacy, body-respectful environments, shared meals."],["Weight stigma","Negative attitudes and treatment based on body size; a harm and a risk factor."],["Diet culture","Messages that link worth to body size and moralize food (“clean”, “guilt-free”, “earn it”)."],["Supporting a friend","“I” statements, listen, no comments on weight, food or looks, suggest professional help, involve a trusted adult."],["Treatment and recovery","Early help from a team (doctor, therapist, dietitian, family); recovery is possible."],["Where to get help","A trusted adult, school counsellor or doctor; Kids Help Phone; NEDIC."]]}};</script>
