.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;
--risk-mod:#2343C4;--risk-fixed:#4D5A80;--fs-clean:#00648A;--fs-separate:#7A3DB8;--fs-cook:#A84C05;--fs-chill:#2343C4;

--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;

--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}

:root[data-theme="dark"]{--nu-carb:#FF9F5A;--nu-protein:#F49AC8;--nu-fat:#5FD0CD;--nu-micro:#C9A8FF;--nu-water:#93AEFF;--leaf:#A8C98A;--plate-grain:#D8D08F;
--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 10 Eating Disorders. Tokens only. Type roles: Biology cerulean (--p-t), Mind violet (--acol), World brown (--p-b);
   always with words. No reds or greens outside the toolkit's feedback. */
:root{--ed-bio:var(--p-t);--ed-mind:var(--acol);--ed-world:var(--p-b)}
.ed-sup p{font-size:.95rem;line-height:1.5}
.ed-sup.top{margin:16px 0 0}
.view[data-view="start"] > .ed-sup.top{margin:0 0 14px}
.ed-sup.res{margin:14px 0 0}
#journal + .ed-optin{margin-top:4px}
.ed-optin{display:flex;gap:8px;align-items:center;font-weight:700;margin:0 0 14px}
.ed-optin input{width:20px;height:20px;accent-color:var(--pen)}
.ed-jnote{margin:0 0 12px}
.ed-supbtn{white-space:nowrap}
.ed-dlg{max-width:min(560px,calc(100vw - 32px));border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:18px 20px}
.ed-dlg::backdrop{background:rgba(0,0,0,.45)}
.ed-dlg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ed-dlg-top h2{margin:0;font-size:1.25rem}
.ed-cap{font-size:1.05rem!important}
/* radio group */
.ed-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.ed-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.ed-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.ed-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ed-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.ed-chipset button:hover{border-color:var(--pen)}
.ed-chipset button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
/* hero */
.ed-hero{width:100%}
.ed-hsvg{display:block;width:100%;height:auto;max-height:300px}
.ed-hc circle{stroke-width:2.2}
.ed-hc text{font:700 13px var(--font-ui)}
.ed-hc.bio circle{fill:var(--ed-bio);fill-opacity:.13;stroke:var(--ed-bio)}
.ed-hc.mind circle{fill:var(--ed-mind);fill-opacity:.13;stroke:var(--ed-mind)}
.ed-hc.world circle{fill:var(--ed-world);fill-opacity:.13;stroke:var(--ed-world)}
.ed-hc.bio text{fill:var(--ed-bio)}.ed-hc.mind text{fill:var(--ed-mind)}.ed-hc.world text{fill:var(--ed-world)}
.ed-hglow{fill:var(--hi);opacity:.55}
.ed-hpill{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.ed-hpt{font:700 12.5px var(--font-ui);fill:var(--ink)}
.ed-hcards{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.ed-hcard{border:1.5px solid var(--ink-2);border-radius:6px;background:var(--sheet);padding:.2em .6em;font-size:.88rem;font-weight:700;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.ed-hcard.on{opacity:1;transform:none}
/* Explore layout */
.ed-modes{margin-bottom:6px}
@media (max-width:560px){ .ed-modes .ed-rg{flex:1 1 100%} .ed-modes .seg{display:flex} .ed-modes .seg button{flex:1 1 auto} }
.ed-pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,17rem);gap:18px 26px;align-items:start}
.ed-stage{min-width:0}
.ed-read{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--paper)}
.ed-h4{margin:0 0 8px;font-size:1rem}
.ed-h5{margin:14px 0 6px;font-size:.95rem}
.ed-mvs{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:2px}
.ed-mvs li{font-size:.9rem;color:var(--ink-2)}
.ed-mvs li.on{color:var(--ink);font-weight:700}
@media (max-width:900px){ .ed-pg{grid-template-columns:minmax(0,1fr)} }
/* influence map */
.ed-venn{display:flex;gap:12px;align-items:center;margin:4px 0 6px}
.ed-venn-svg{width:140px;flex:0 0 auto;height:auto}
.ed-vc circle{stroke-width:1.6;stroke-dasharray:4 3;fill-opacity:.05;transition:fill-opacity .4s}
.ed-vc.lit circle{stroke-dasharray:none;fill-opacity:.34}
.ed-vc text{font:700 10px var(--font-ui)}
.ed-vc.bio circle{fill:var(--ed-bio);stroke:var(--ed-bio)}.ed-vc.bio text{fill:var(--ed-bio)}
.ed-vc.mind circle{fill:var(--ed-mind);stroke:var(--ed-mind)}.ed-vc.mind text{fill:var(--ed-mind)}
.ed-vc.world circle{fill:var(--ed-world);stroke:var(--ed-world)}.ed-vc.world text{fill:var(--ed-world)}
.ed-vtxt{min-width:0}
.ed-vleg,.ed-vmsg{margin:0 0 4px}
.ed-tray{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--rule);border-radius:8px;min-height:52px}
.ed-card{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:2px solid var(--ink);background:var(--sheet);border-radius:6px;padding:.35em .7em;font-size:.95rem;max-width:100%}
.ed-card[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.ed-ttag{font-size:.75rem;font-weight:700;border-radius:4px;padding:0 .4em;border:1.5px solid currentColor}
.ed-ttag.none{border-style:dashed;color:var(--ink-2);font-weight:400}
.ed-card.ty-bio{border-left:6px solid var(--ed-bio)}.ed-card.ty-bio .ed-ttag{color:var(--ed-bio)}
.ed-card.ty-mind{border-left:6px solid var(--ed-mind)}.ed-card.ty-mind .ed-ttag{color:var(--ed-mind)}
.ed-card.ty-world{border-left:6px solid var(--ed-world)}.ed-card.ty-world .ed-ttag{color:var(--ed-world)}
.ed-card[aria-pressed="true"] .ed-ttag{color:var(--hi-ink)}
.ed-selbar{margin:10px 0;padding:10px 12px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--info-bg)}
.ed-selt{margin:0 0 6px}
.ed-selrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px}
.ed-sell{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.5rem}
.chip.ty-bio{box-shadow:inset 4px 0 0 var(--ed-bio)}.chip.ty-mind{box-shadow:inset 4px 0 0 var(--ed-mind)}.chip.ty-world{box-shadow:inset 4px 0 0 var(--ed-world)}
.ed-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.ed-col{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;min-height:110px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ed-col h5{margin:0 0 2px;font-size:.95rem}
.ed-col.risk{border-top:4px solid var(--ink-2)}
.ed-col.protect{border-top:4px solid var(--pen)}
@media (max-width:560px){ .ed-cols{grid-template-columns:minmax(0,1fr)} .ed-venn{align-items:flex-start} }
/* myth cards */
.ed-mtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 8px}
.ed-mcard{border:2px solid var(--ink);border-radius:10px;padding:16px 18px;background:var(--sheet);min-height:170px;transform-origin:center}
.ed-mcard.back{border-style:double;border-width:4px}
.ed-mq{font-size:1.15rem;font-weight:700;margin:0 0 4px}
.ed-mq2{color:var(--ink-2);margin:0 0 6px}
.ed-verdict{display:inline-block;margin:0 0 8px;font-weight:700;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;border:2px solid var(--ink);border-radius:6px;padding:.05em .6em}
/* conversation */
.ed-sub{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.ed-scen{margin:0 0 10px}
.ed-hist{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 10px}
.ed-hist summary{font-weight:700;cursor:pointer}
.ed-histl{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:8px}
.ed-tn{margin:0 0 4px;font-size:.82rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.ed-line{margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.ed-lt{flex:1 1 auto;min-width:0}
.ed-who{flex:0 0 auto;font-size:.78rem;font-weight:700;border:1.5px solid var(--ink-2);border-radius:999px;padding:0 .55em;color:var(--ink-2)}
.ed-line.you .ed-who{border-color:var(--pen);color:var(--pen)}
.ed-line.new .ed-who{border-color:var(--ink);color:var(--ink)}
.ed-line.old{color:var(--ink-2)}
.ed-feel{font-size:.85rem;color:var(--ink-2);display:inline-block}
.ed-last{border-left:4px solid var(--pen);padding:6px 12px;margin:0 0 10px;background:var(--info-bg);border-radius:0 8px 8px 0}
.ed-turn{border:1.5px solid var(--ink-2);border-radius:10px;padding:12px 14px}
.ed-sit{margin:0 0 8px;font-style:italic}
.ed-says{display:grid;gap:6px}
.ed-say{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.5em .7em;min-height:40px}
.ed-say:hover{border-color:var(--pen)}
.ed-rdot{flex:0 0 auto;width:16px;height:16px;margin-top:.2em;border-radius:50%;border:2px solid var(--ink-2)}
.ed-say[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--hi-soft);font-weight:700}
.ed-say[aria-checked="true"] .ed-rdot{border-color:var(--ink);background:radial-gradient(circle,var(--ink) 0 4px,transparent 5px)}
.ed-meter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0}
.ed-ml{font-size:.85rem;font-weight:700;color:var(--ink-2);margin-right:2px}
.ed-mseg{border:1.5px solid var(--rule);border-radius:6px;padding:.2em .6em;font-size:.9rem;color:var(--ink-2);transition:background .3s,border-color .3s}
.ed-mseg.on{border-color:var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
/* repair */
.ed-rep{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ed-rt{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.ed-rt.act{border-color:var(--ink);box-shadow:0 0 0 3px var(--hi-soft)}
.ed-rt .q-actions{margin-top:6px}
.ed-bank{display:grid;gap:6px}
.ed-bk{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.45em .7em;min-height:36px}
.ed-bk:hover{border-color:var(--pen)}
/* Explore types block */
.ed-types{margin:.3em 0 .8em;padding-left:1.2em}
.ed-types li{margin-bottom:.35em}
/* Part 3 */
.ed-caps{display:grid;gap:10px}
.ed-cap,.ed-capd{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.ed-capt{margin:0 0 6px;font-weight:700}
.ed-capb{display:flex;flex-wrap:wrap;gap:6px}
.ed-cap .fb{margin-top:8px}
.ed-data{margin:16px 0 0}
.ed-data ul{margin:.4em 0;padding-left:1.2em}
.ed-wbank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ed-rw{margin:0 0 14px}
.ed-rw label{display:block;font-weight:700;margin-bottom:4px}
.ed-rwst{margin:4px 0 0;min-height:1.2em}
.ed-rwst.good{color:var(--green)}
.ed-rwst.bad{color:var(--red)}
.ed-rw .q-actions{margin-top:4px}
.ed-sample{margin:4px 0 0}
.ed-labs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.ed-flow{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:22px}
.ed-fstep{position:relative;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ed-fstep + .ed-fstep::before{content:"↓";position:absolute;top:-21px;left:1.1em;font-weight:700;color:var(--ink-2)}
.ed-fbox{border:2px solid var(--sys-stage);border-radius:8px;padding:.4em .75em;font-weight:700;background:var(--sheet);max-width:100%}
.ed-fslot{border:2px dashed var(--ink-2);border-radius:999px;padding:.25em .8em;background:var(--sheet);min-height:34px;font-size:.92rem}
.ed-fslot.done{border-style:solid;border-color:var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
.ed-fnote{font-size:.85rem;color:var(--ink-2);font-style:italic}
.ed-floop{margin:10px 0 0;font-weight:700;color:var(--ink-2)}
.ed-cer{margin-top:14px;padding:12px 14px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--info-bg)}
.ed-cer p{margin:0 0 6px}
.ed-feed{display:grid;gap:8px}
.ed-tip{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.ed-tip summary{font-weight:700;cursor:pointer}
.ed-tip p{margin:6px 0 0}
/* task */
.ed-tk{margin-top:8px}
.ed-fs{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;margin:0 0 12px;min-width:0}
.ed-fs legend{font-weight:700;padding:0 4px}
div.ed-fs{border:0;padding:0}
.ed-lab{display:block;font-weight:700;margin:8px 0 4px}
.ed-checks{display:grid;gap:4px}
.ed-ck{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.ed-ck input{flex:0 0 auto;width:20px;height:20px;margin-top:.15em;accent-color:var(--pen)}
.ed-ck input:disabled + span{color:var(--ink-2)}
.ed-moves{margin:0;padding-left:1.4em;display:grid;gap:4px}
.ed-mvrow{padding-left:2px}
.ed-mvrow{display:list-item}
.ed-mvrow .ed-ck{display:inline-flex;vertical-align:middle;max-width:calc(100% - 6.5rem)}
.ed-mvb{display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px}
.ed-mvb .btn{padding:.2em .6em;min-width:34px;min-height:32px}
.ed-tq{display:inline-block;font-size:.75rem;font-weight:700;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:0 .4em;vertical-align:.08em}
.ed-flag{margin:0 0 10px;color:var(--ink)}
.ed-flag:empty{display:none}
.ed-tpv{position:sticky;top:calc(var(--mv-top) + 130px)}
.ed-scard{border:2px solid var(--ink);border-radius:12px;padding:14px 16px;background:var(--sheet)}
.ed-scard h5{margin:12px 0 4px;font-size:.92rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.ed-scard ul,.ed-scard ol{margin:0;padding-left:1.2em}
.ed-scard p{margin:0 0 4px}
.ed-sct{font-size:1.2rem;font-weight:700}
.ed-capd{margin:0 0 10px}
@media (max-width:900px){ .ed-tpv{position:static} }

</style>
</head>
