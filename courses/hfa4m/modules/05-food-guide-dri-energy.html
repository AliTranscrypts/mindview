.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--nu-carb:#A84C05;--nu-protein:#B0286F;--nu-fat:#0B7372;--nu-micro:#7A3DB8;--nu-water:#2343C4;--leaf:#4F6B2E;--plate-grain:#6B5A1E;

--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;

--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}

--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 05: hero (guide history → plate and habits), Plate and scale (plate builder, DRI bars, energy scale, Rui's week,
   history and world), Modify a recipe, Evidence practice, Rui's plate task. Plate sections: vegetables and fruits --leaf,
   grains --plate-grain, protein foods --nu-protein (course plan §4), always labelled. Energy bars: BMR cerulean, activity blue,
   thermic effect --ink-2, intake --ink; balance labels in ink. Red and green stay reserved for feedback. */
/* radio groups (from HFA4U 04) */
.fg-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.fg-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.6rem;margin:0}
.fg-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.fg-rg.seg button:disabled{opacity:.45}
.fg-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fg-chipset button{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left}
.fg-chipset button:not(:disabled):hover{border-color:var(--pen)}
.fg-chipset button[aria-checked="true"],.fg-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fg-chipset button[aria-checked="true"] .fg-tk,.fg-chipset button[aria-pressed="true"] .fg-tk{color:inherit}
.fg-tk{font-size:.8rem;color:var(--ink-2);font-weight:400}

/* layout */
.fg-mode{margin-bottom:4px}
.fg-panel[hidden]{display:none}
.fg-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px 26px;align-items:start;margin-top:8px}
.fg-vis,.fg-side{min-width:0}
.fg-side{border-left:1.5px solid var(--rule);padding-left:18px}
.fg-h4{margin:14px 0 6px;font-size:1rem}
.fg-side > .fg-h4:first-child,.fg-vis > .fg-h4:first-child{margin-top:0}
.fg-pcard{margin:0 0 10px}

/* guide drawings (SVG) */
.fg-st{font:600 9px var(--font-ui);fill:var(--ink)}
.fg-stt{font:700 11px var(--font-ui);fill:var(--ink)}
.fg-sts{font:600 7.6px var(--font-ui);fill:var(--ink)}
.fg-cvf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.4}
.fg-cgr{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-width:1.4}
.fg-cpf{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:1.4}
.fg-cmk{fill:color-mix(in srgb,var(--p-t) 14%,transparent);stroke:var(--p-t);stroke-width:1.4}
.fg-cnt{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.2}
.fg-cdash{stroke-dasharray:4 3}
.fg-cwa{fill:var(--nu-water-soft);stroke:var(--nu-water);stroke-width:1.4}
.fg-cmilk{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.fg-csoy{fill:var(--plate-grain-soft);stroke:var(--ink-2);stroke-width:1.4}
.fg-cjuice{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:1.4}
.fg-ccola{fill:color-mix(in srgb,var(--plate-grain) 55%,transparent);stroke:var(--ink-2);stroke-width:1.4}
.fg-cempty{fill:none;stroke:var(--rule);stroke-width:1.4;stroke-dasharray:4 3}
.fg-ccard{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.fg-crule{stroke:var(--ink-2);stroke-width:1}
.fg-cdot{fill:var(--ink-2)}
.fg-crim{fill:var(--sheet);stroke:var(--rule);stroke-width:2}
.fg-cglass{stroke:var(--ink-2);stroke-width:1}
.fg-caxis{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 3}
.fg-cstring{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.fg-crun circle{fill:var(--ink)}
.fg-crun path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.fg-ico{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* hero */
.fg-hero{max-width:420px;margin:0 auto}
.fg-hsvg{display:block;width:100%;height:auto}
.fg-hyr{font:700 14px var(--font-ui);fill:var(--ink-2)}
.hero-fig figcaption.fg-cap{animation:fg-in .6s ease-out both}
@keyframes fg-in{from{opacity:0}to{opacity:1}}

/* plate builder */
.fg-platew{display:grid;grid-template-columns:minmax(0,320px) 64px;gap:8px;justify-content:center;align-items:center}
.fg-plate{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:var(--sheet);border:2px solid var(--rule)}
.fg-wedge{position:absolute;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;border-radius:0;background-color:transparent;background-image:none}
.fg-wedge.c-vf{background-color:var(--leaf-soft)}
.fg-wedge.c-gr{background-color:var(--plate-grain-soft)}
.fg-wedge.c-pr{background-color:var(--nu-protein-soft)}
.fg-wedge:hover,.fg-wedge:focus-visible{background-image:linear-gradient(var(--hi-soft),var(--hi-soft));outline:none}
.fg-wedge.ready{cursor:copy}
.fg-povl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fg-ring{fill:none;stroke-width:8}
.fg-ring.g-vf,.fg-ring.g-gr,.fg-ring.g-pr{stroke-width:5;stroke-dasharray:7 4}
.g-vf,.y-vf{stroke:var(--leaf)}
.g-gr,.y-gr{stroke:var(--plate-grain)}
.g-pr,.y-pr{stroke:var(--nu-protein)}
.y-empty{stroke:var(--rule)}
.fg-wout{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.fg-wline{stroke:var(--ink-2);stroke-width:1.2}
.fg-wl{font:700 13px var(--font-ui);fill:var(--ink)}
.fg-wn{font:600 13px var(--font-ui);fill:var(--ink-2);opacity:.55}
.fg-glow{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:3}
.fg-glowbg{fill:var(--sheet);stroke:var(--leaf);stroke-width:1.5}
.fg-wfocus{fill:none;stroke:var(--pen);stroke-width:3.5}
.fg-glassw{text-align:center}
.fg-gsvg{display:block;width:56px;height:auto;margin:0 auto}
.fg-badge{font-size:.76rem;line-height:1.25;margin:4px 0 0}
.fg-ringkey{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;color:var(--ink-2);margin:8px 0 0}
.fg-rk{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:5px;border-top:5px solid var(--ink-2)}
.fg-rk.out{border-top:3px dashed var(--ink-2)}
.fg-pstat{font-size:.92rem;margin:8px 0 0;text-align:center}
.fg-shl{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--ink-2);margin:10px 0 4px}
.fg-shelves .fg-shl:first-child{margin-top:0}
.fg-shelf{display:flex;flex-wrap:wrap;gap:6px}
.fg-tile{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.25em .8em .25em .7em;font-size:.9rem;min-height:34px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.fg-tile.c-vf{box-shadow:inset 4px 0 0 var(--leaf)}
.fg-tile.c-gr{box-shadow:inset 4px 0 0 var(--plate-grain)}
.fg-tile.c-pr{box-shadow:inset 4px 0 0 var(--nu-protein)}
.fg-tile:hover{border-color:var(--pen)}
.fg-tile[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fg-ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-130%);background:var(--hi);color:var(--hi-ink);font-weight:700;font-size:.9rem;border-radius:999px;padding:.2em .8em;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#fg-drink{margin-top:12px}
.fg-habits,.fg-acts,.fg-sfoods,.fg-adds{display:flex;flex-wrap:wrap;gap:6px}
.fg-acts{margin:4px 0 6px}
.fg-acts .fg-rgl{width:100%}
.fg-hab{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:.3em .7em;font-size:.88rem;min-height:34px;text-align:left}
.fg-hab:hover{border-color:var(--pen)}
.fg-box{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;border:1.5px solid var(--ink-2);border-radius:3px;font-size:.75rem;line-height:1}
.fg-hab[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.fg-hab[aria-pressed="true"] .fg-box{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.fg-hab[aria-pressed="true"] .fg-box::after{content:"✓"}

/* DRI bars */
.fg-bars{display:grid;gap:4px}
.fg-bar{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:var(--sheet);border-radius:8px;padding:6px 10px 18px}
.fg-bar:hover{border-color:var(--rule)}
.fg-bar.on{border-color:var(--ink);background:color-mix(in srgb,var(--hi) 12%,var(--sheet))}
.fg-bt{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;font-weight:700}
.fg-bt b{font-weight:700}
.fg-track{position:relative;display:block;height:14px;margin-top:20px;background:var(--paper);border:1px solid var(--rule);border-radius:4px}
.fg-bar.bell .fg-track{margin-top:58px}
.fg-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px;transition:width .3s}
.k-micro .fg-fill{background:var(--nu-micro)}
.k-carb .fg-fill{background:var(--nu-carb)}
.k-protein .fg-fill{background:var(--nu-protein)}
.fg-mk{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink-2);z-index:2}
.fg-mk.m-ul,.fg-mk.m-cdrr{border-left-style:solid}
.fg-ml{position:absolute;left:0;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:.68rem;font-weight:700;color:var(--ink-2);background:var(--sheet);border-radius:3px;padding:0 2px;line-height:1.3}
.fg-mk.m-ear .fg-ml{bottom:auto;top:100%}
.fg-mk.off{left:auto !important;right:0}
.fg-mk.off .fg-ml{transform:translateX(-100%);left:2px}
.fg-bar.on .fg-ml{background:color-mix(in srgb,var(--hi) 12%,var(--sheet))}
.fg-bell{position:absolute;left:0;right:0;bottom:100%;height:52px;pointer-events:none}
.fg-bell svg{display:block;width:100%;height:100%}
.fg-bsh{fill:var(--nu-micro-soft)}
.fg-bcur{fill:none;stroke:var(--ink-2);stroke-width:2}
.fg-bkey{margin:6px 0 0}
.fg-defs{margin:8px 0}
.fg-defs > div{padding:4px 0;border-bottom:1px dashed var(--rule)}
.fg-defs dt{font-weight:700;display:inline}
.fg-defs dd{display:inline;margin:0 0 0 6px}
.fg-dcard{margin:0 0 14px}
.fg-self{margin-top:16px;padding-top:10px;border-top:1.5px dashed var(--rule)}
.fg-self p{margin:4px 0}
.fg-sb{margin-top:10px}
.fg-sbr{margin:0 0 8px}
.fg-sbr p{margin:0 0 3px;font-size:.88rem}
.fg-strack{position:relative;display:block;height:10px;background:var(--paper);border:1px solid var(--rule);border-radius:4px}
.fg-sfill{position:absolute;left:0;top:0;bottom:0;background:var(--nu-micro)}
.fg-sref{position:absolute;left:66.667%;top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}

/* energy balance */
.fg-scale{display:block;width:100%;max-width:400px;height:auto;margin:0 auto}
.fg-sbase{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.2}
.fg-sbeam{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.fg-spiv{fill:var(--ink)}
.fg-sstr{stroke:var(--ink-2);stroke-width:1.2}
.fg-span{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.fg-slab{text-align:center;font-size:1.05rem;margin:2px 0 10px}
.fg-eb{display:grid;grid-template-columns:5.6rem minmax(0,1fr);align-items:center;gap:8px;margin:6px 0}
.fg-ebl{font-size:.85rem;font-weight:700}
.fg-ebt{display:flex;height:28px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.fg-seg{display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:.74rem;font-weight:700;padding-left:4px;border-right:2px solid var(--sheet);transition:width .3s;color:var(--sheet)}
.s-in{background:var(--ink)}
.s-bmr{background:var(--p-t)}
.s-act{background:var(--pen)}
.s-tef{background:var(--ink-2)}
.fg-eax{position:relative;height:16px;margin-left:calc(5.6rem + 8px);font-size:.7rem;color:var(--ink-2)}
.fg-eax span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.fg-eax span:first-child{transform:none}
.fg-eax span:last-child{transform:translateX(-80%)}
.fg-elg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0}
.fg-elg span{display:inline-flex;align-items:center;gap:5px}
.fg-ek{display:inline-block;width:12px;height:12px;border-radius:2px}
.fg-week{margin-top:18px;padding-top:12px;border-top:1.5px solid var(--rule)}
.fg-week p{margin:4px 0}
.fg-wt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.fg-wtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px 10px;min-width:9rem;text-align:left}
.fg-wtile:hover{border-color:var(--pen)}
.fg-wtile span{font-size:.78rem;color:var(--ink-2)}
.fg-ws{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(6.2rem,1fr));gap:6px}
.fg-wslot{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-height:64px;border:1.5px dashed var(--rule);border-radius:8px;background:var(--sheet);padding:6px 8px;font-size:.82rem;text-align:left}
.fg-wslot span{font-size:.74rem;color:var(--ink-2);font-weight:700}
.fg-wslot small{font-size:.74rem;color:var(--ink-2)}
.fg-wslot.on{border-style:solid;border-color:var(--ink);background:var(--hi-soft)}
.fg-wbar{position:relative;height:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin:22px 0 4px}
.fg-wfill{position:absolute;left:0;top:0;bottom:0;background:var(--p-t);border-radius:5px 0 0 5px;transition:width .3s}
.fg-wtgt{position:absolute;top:-6px;bottom:-6px;border-left:2px dashed var(--ink)}
.fg-wtgt span{position:absolute;bottom:100%;left:0;transform:translateX(-50%);font-size:.7rem;font-weight:700;color:var(--ink)}
.fg-wsum{font-size:.92rem}

/* history and world */
.fg-hfig{max-width:340px;margin:8px auto 0}
.fg-hsv{display:block;width:100%;height:auto}
.fg-hcard .fg-h4{margin-top:0}
.fg-pts{margin:0 0 8px;padding-left:1.2em}
.fg-pts li{margin:0 0 4px}
.fg-hcard p{margin:4px 0}
#fg-hpl{margin:4px 0}

/* recipe */
.fg-rcard{border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px;background:var(--sheet)}
.fg-rcard .fg-h4{margin-top:0}
.fg-ing{margin:0;padding-left:1.2em}
.fg-ing li{margin:2px 0;padding:1px 4px;border-radius:4px}
.fg-ing li.chg{background:var(--hi-soft)}
.fg-tag{display:inline-block;font-size:.72rem;font-weight:700;border:1px solid var(--ink-2);border-radius:999px;padding:0 .5em;margin-left:4px;color:var(--ink-2);vertical-align:.1em}
.fg-swaps > div{margin-bottom:4px}
.fg-adds{margin-top:6px}
.fg-tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.fg-tbl th,.fg-tbl td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.fg-tbl thead th{font-size:.82rem;color:var(--ink-2)}
.fg-srct{margin:12px 0 4px}
.fg-srcw{display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:2px 8px;align-items:center;margin:6px 0}
.fg-srcn{font-size:.82rem;font-weight:700}
.fg-srcb{display:flex;height:18px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.fg-src{background:color-mix(in srgb,var(--ink-2) 40%,transparent);border-right:2px solid var(--sheet)}
.fg-src.soy{background:var(--hi)}
.fg-srcl{grid-column:2;color:var(--ink-2)}
.fg-srcl strong{color:var(--ink)}
.fg-kprev{margin-top:8px}
.fg-kprev summary{cursor:pointer;font-weight:700;font-size:.92rem}
.fg-kcard{border:1.5px dashed var(--ink-2);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:.88rem}
.fg-kcard h5{margin:8px 0 2px;font-size:.88rem}
.fg-kcard p{margin:2px 0}
.fg-kcard p.b{padding-left:.6em}
.fg-after{margin-top:12px}

/* practice: evidence items */
.fg-tchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fg-tchips .chip{text-align:left}
.fg-tchips .chip.fg-right{border-color:var(--green)}
.fg-tset{margin:6px 0}
.fg-tsl{font-weight:700;font-size:.88rem;margin:6px 0 0}

/* task */
.fg-tin{display:grid;gap:4px}
.fg-tin #tk-v{margin-bottom:10px}
.fg-tin #tk-v p{margin:0 0 4px}
.fg-tsvg{display:block;width:100%;max-width:320px;height:auto;margin:0 auto}
.fg-tcost{margin:8px 0 4px}
.fg-tbar{position:relative;height:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.fg-tfill{position:absolute;left:0;top:0;bottom:0;background:var(--p-t);border-radius:5px 0 0 5px}
.fg-tfill.over{background:var(--p-k)}
.fg-tmark{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--ink)}

@media (max-width:820px){
  .fg-grid{grid-template-columns:minmax(0,1fr)}
  .fg-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
}
@media (max-width:560px){
  .fg-shelf{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .fg-tile{flex:none}
  .fg-platew{grid-template-columns:minmax(0,1fr)}
  .fg-glassw{display:flex;align-items:center;justify-content:center;gap:10px;text-align:left}
  .fg-gsvg{width:34px;margin:0}
  .fg-badge br{display:none}
  .fg-badge strong::after{content:": "}
  .fg-eb,.fg-srcw{grid-template-columns:4.6rem minmax(0,1fr)}
  .fg-eax{margin-left:calc(4.6rem + 8px)}
}
@media (prefers-reduced-motion:reduce){
  .hero-fig figcaption.fg-cap{animation:none}
  .fg-fill,.fg-seg,.fg-wfill{transition:none}
}
