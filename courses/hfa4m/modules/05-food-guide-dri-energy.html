","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"f60128f8","content":{"id":"05-food-guide-dri-energy","kind":"topic","title":"Canada’s Food Guide, DRIs and energy balance","topic":"Canada’s Food Guide, DRIs & Energy Balance","readyTopic":"Canada’s Food Guide, DRIs and energy balance","hero":{"eq":"½ + ¼ + ¼, and water","eqSize":"sm","eqLabel":"half vegetables and fruits, a quarter whole grains, a quarter protein foods, and water","headline":"A plate, not a points system.","text":"\u003cstrong>Canada’s Food Guide\u003c/strong> shows proportions, not portions to count, plus habits that matter as much as the food. \u003cstrong>Dietary Reference Intakes\u003c/strong> are the science behind it: reference values for whole populations. \u003cstrong>Energy balance\u003c/strong> describes how the energy in food meets the energy a body uses. Every person’s balance is different, and it isn’t a score.","fig":{"html":"\u003cdiv class=\"fg-hero\" id=\"fg-hero\">\u003c/div>","caption":""},"aria":"A 1942 card titled Canada’s Official Food Rules changes into the 1992 rainbow, then the 2007 servings chart, then the 2019 plate: half vegetables and fruits, a quarter whole grains, a quarter protein foods, and a glass of water. Six habit icons ring the plate: a pot (cook more often), people at a table (eat with others), a label (use food labels), a magnifying glass (be mindful), a clock (enjoy your food) and a megaphone (be aware of food marketing).","caption":"Same goal, better evidence (Health Canada, 2019)."},"goals":["I can describe Canada’s Food Guide’s plate proportions and healthy eating habits, and the main nutrients each food category provides.","I can explain how and why Canada’s Food Guide changed from 1942 to 2019, using evidence.","I can interpret DRIs (EAR, RDA, AI, UL, AMDR, CDRR) to assess a persona’s intake.","I can explain energy balance and analyse data about what affects energy expenditure.","I can compare Canada’s Food Guide with food guides from other countries.","I can modify a recipe so it better reflects Canada’s Food Guide."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Food categories","goal":1,"prompt":"In the 2019 guide, which food belongs to \u003cstrong>protein foods\u003c/strong>?","options":[{"t":"Lentils","why":"Legumes are protein foods, and the guide suggests choosing plant-based protein more often.","_n":"0a86","_k":"a7aa4750"},{"t":"Brown rice","why":"Brown rice is a whole grain.","_n":"1a56","_k":"00eca5ab"},{"t":"Potatoes","why":"Potatoes are a vegetable.","_n":"2a66","_k":"fcbfa343"},{"t":"Avocado","why":"Avocado is a fruit.","_n":"3a36","_k":"1518ef9b"}],"hints":["Which one would you use in place of meat?","Beans, lentils, tofu, nuts, eggs, fish, dairy and meat are protein foods.","Lentils."]},{"id":"w2","skill":"Food categories","goal":1,"prompt":"Which is a \u003cstrong>whole grain\u003c/strong>?","options":[{"t":"Corn flakes made from milled corn","why":"Refined.","_n":"4a46","_k":"9edf40f3"},{"t":"White rice","why":"The bran and germ have been removed.","_n":"5a16","_k":"b5eb940b"},{"t":"A white flour tortilla","why":"Refined flour.","_n":"6a26","_k":"9cec0263"},{"t":"Quinoa","why":"It keeps the bran, germ and endosperm.","_n":"7af6","_k":"55c71c19"}],"hints":["Whole grains keep all three parts of the kernel.","Look for the one that isn’t milled white.","Quinoa."]},{"id":"w3","skill":"Energy and percentages","goal":3,"prompt":"About how many kilocalories does \u003cstrong>1 g of fat\u003c/strong> provide?","options":[{"t":"1","why":"Far too low.","_n":"8b06","_k":"5f31509e"},{"t":"4","why":"4 is for carbohydrate and protein.","_n":"9d9c","_k":"ac13b9e3"},{"t":"7","why":"7 is for alcohol.","_n":"ad8c","_k":"3446cf42"},{"t":"9","why":"Fat gives 9 kcal per gram; carbohydrate and protein give 4.","_n":"bdbc","_k":"a0c10d68"}],"hints":["Carbohydrate and protein give 4.","Fat gives more than twice that.","9."]},{"id":"w4","skill":"Energy and percentages","goal":3,"prompt":"What is 25% of 2000?","options":[{"t":"250","why":"That’s 12.5%.","_n":"cdac","_k":"2b28bf05"},{"t":"400","why":"That’s 20%.","_n":"dd5c","_k":"9c9510ca"},{"t":"500","why":"25% is one quarter: 2000 ÷ 4 = 500.","_n":"ed4c","_k":"ee8b4c9d"},{"t":"800","why":"That’s 40%.","_n":"fd7c","_k":"26797002"}],"hints":["25% is one quarter.","2000 ÷ 4.","500."]},{"id":"w5","skill":"Reading reference data","goal":3,"prompt":"A bar shows an iron intake of 12 mg, and a reference line sits at 18 mg. What does the bar show?","options":[{"t":"You can’t tell","why":"Compare the two values.","_n":"gd6c","_k":"e80a585a"},{"t":"Intake is above the reference line","why":"12 \u003c 18.","_n":"he1c","_k":"dbc4d209"},{"t":"Intake is below the reference line","why":"12 \u003c 18, so the bar stops short of the line.","_n":"ie0c","_k":"726cabca"},{"t":"Intake equals the reference","why":"They differ by 6 mg.","_n":"j67b","_k":"f8bf541f"}],"hints":["Compare 12 and 18.","Which is bigger?","Below."]},{"id":"w6","skill":"Reading reference data","goal":3,"prompt":"If a value meets the needs of \u003cstrong>half\u003c/strong> the people in a group, what kind of value is it?","options":[{"t":"A minimum","why":"A minimum meets almost no one’s.","_n":"k68b","_k":"172c6f15"},{"t":"A maximum","why":"A maximum meets nearly everyone’s needs.","_n":"l69b","_k":"5099a7af"},{"t":"A median","why":"Half are above it and half below.","_n":"m6ab","_k":"ca397581"},{"t":"A total","why":"It’s one value, not a sum.","_n":"n63b","_k":"f727bf07"}],"hints":["Half above, half below.","Think back to math class.","A median."]}],"refreshers":{"Food categories":"The 2019 guide has three: vegetables and fruits; whole grain foods; protein foods (which include dairy and fortified soy beverages).","Energy and percentages":"Carbohydrate and protein give 4 kcal per gram; fat gives 9. Percent of energy = (kcal from the nutrient ÷ total kcal) × 100.","Reading reference data":"A reference line on a bar graph is a comparison point. A median splits a group in half."}}},"explore":{"heading":"Plate and scale","intro":"Build plates, check a persona’s day against the DRIs, explore energy balance with fictional adults, and travel through the guide’s history. Everything uses personas; nothing asks about your own body.","modes":[{"id":"plate","t":"1. Plate"},{"id":"dri","t":"2. DRIs"},{"id":"energy","t":"3. Energy balance"},{"id":"history","t":"4. History and world"}],"plate":{"how":"Tap a food, then tap a wedge (or drag a food onto a wedge with a mouse). Tap a filled wedge to clear it. Arrow keys move between wedges.","shelves":[{"id":"vf","t":"Vegetables and fruits","foods":[{"id":"broccoli","t":"broccoli"},{"id":"carrots","t":"carrots"},{"id":"bokchoy","t":"bok choy"},{"id":"namul","t":"spinach namul"},{"id":"kimchi","t":"kimchi"},{"id":"apple","t":"apple"},{"id":"mango","t":"mango"},{"id":"berries","t":"berries"},{"id":"plantain","t":"plantain"}]},{"id":"gr","t":"Grains","foods":[{"id":"brownrice","t":"brown rice","whole":true},{"id":"mixedrice","t":"mixed-grain rice","whole":true},{"id":"whiterice","t":"white rice"},{"id":"roti","t":"whole wheat roti","whole":true},{"id":"whitebread","t":"white bread"},{"id":"quinoa","t":"quinoa","whole":true}]},{"id":"pr","t":"Protein foods","foods":[{"id":"tofu","t":"tofu"},{"id":"dal","t":"lentil dal"},{"id":"eggs","t":"eggs"},{"id":"mackerel","t":"mackerel"},{"id":"chicken","t":"chicken"},{"id":"beans","t":"black beans"},{"id":"yogurt","t":"unsweetened yogurt"}]}],"drinks":[{"id":"water","t":"Water","rec":true},{"id":"milk","t":"1% milk","rec":true},{"id":"soy","t":"Unsweetened fortified soy beverage","rec":true},{"id":"juice","t":"Fruit juice"},{"id":"cola","t":"Cola"}],"drinkNo":"not the guide’s drink of choice","habits":["Cooked at home","Eaten with others","Label checked","Took time to enjoy it","Noticed hunger and fullness","Limited highly processed foods","Thought about food marketing"],"match":"matches the guide’s proportions"},"dri":{"persona":"\u003cstrong>Nour, 35\u003c/strong>, a nurse working night shifts.","base":{"fe":6,"ca":500,"d":100,"fib":12,"na":2100,"pro":40},"baseNote":"Before these foods, the rest of Nour’s day gives iron 6 mg, calcium 500 mg, vitamin D 100 IU, fibre 12 g, sodium 2100 mg and protein 40 g.","foods":[{"id":"lentils","t":"Lentils (¾ cup cooked)","max":3,"fe":3,"ca":20,"d":0,"fib":6,"na":5,"pro":13},{"id":"cereal","t":"Iron-fortified cereal (1 serving)","max":2,"fe":4,"ca":20,"d":0,"fib":3,"na":150,"pro":3},{"id":"spinach","t":"Cooked spinach (½ cup)","max":2,"fe":3,"ca":120,"d":0,"fib":2,"na":60,"pro":3},{"id":"beef","t":"Lean beef (75 g)","max":2,"fe":2.5,"ca":5,"d":0,"fib":0,"na":50,"pro":22},{"id":"milk","t":"1% milk (1 cup)","max":3,"unit":"cup","fe":0,"ca":300,"d":100,"fib":0,"na":110,"pro":8}],"nutrients":[{"id":"fe","t":"Iron","unit":"mg","ear":8.1,"rda":18,"ul":45,"max":50,"typ":12,"kind":"micro"},{"id":"ca","t":"Calcium","unit":"mg","ear":800,"rda":1000,"ul":2500,"max":2800,"typ":850,"kind":"micro","sd":100},{"id":"d","t":"Vitamin D","unit":"IU","ear":400,"rda":600,"ul":4000,"max":1200,"typ":200,"kind":"micro","sd":100},{"id":"fib","t":"Fibre","unit":"g","ai":25,"max":45,"typ":17,"kind":"carb"},{"id":"na","t":"Sodium","unit":"mg","ai":1500,"cdrr":2300,"max":3200,"typ":2700,"kind":"micro"},{"id":"pro","t":"Protein","unit":"g","ear":38,"rda":46,"max":120,"typ":70,"kind":"protein","sd":4}],"typLabel":"Women 31–50, typical {n} intake: about {v} (model value standing in for the Canadian Community Health Survey, 2015)","bellLabel":"Show the spread of needs","bellNote":"Each person’s need is different. The curve shows how needs spread across healthy women 31–50; the shaded part is the share whose needs this intake meets.","absorb":"Iron from plants (non-heme) is absorbed better with a vitamin C food; iron from meat (heme) is absorbed more easily.","card":"\u003cdl class=\"fg-defs\">\u003cdiv>\u003cdt>EAR\u003c/dt>\u003cdd>Estimated Average Requirement: meets the needs of about half of a healthy group (the median need). Used to judge groups.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>RDA\u003c/dt>\u003cdd>Recommended Dietary Allowance: meets the needs of nearly all (about 97–98%) healthy people.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AI\u003c/dt>\u003cdd>Adequate Intake: used when there isn’t enough evidence to set an EAR.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>UL\u003c/dt>\u003cdd>Tolerable Upper Intake Level: the highest average daily intake unlikely to cause harm.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>AMDR\u003c/dt>\u003cdd>Acceptable Macronutrient Distribution Range: energy ranges for carbohydrate, fat and protein.\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>CDRR\u003c/dt>\u003cdd>Chronic Disease Risk Reduction intake (sodium): marks where reducing intake lowers chronic disease risk.\u003c/dd>\u003c/div>\u003c/dl>\u003cp>DRIs are reference values for \u003cstrong>healthy populations\u003c/strong>, not personal targets. Intake below the RDA isn’t automatically deficient, and above the UL more isn’t better.\u003c/p>","self":{"intro":"Mark the foods you ate yesterday. The bars compare iron, calcium, fibre and vitamin D with a general reference for teens. There are no calories here, no weights and no score.","privacy":"Nothing you mark here is saved, scored or sent, and it isn’t added to your results summary. It clears when you leave this page. If you’d rather not, your teacher has another option, and Nour’s day works instead.","start":"Start “My own day”","foods":[{"id":"milk","t":"Milk or fortified soy beverage (1 cup)","ca":25,"d":15},{"id":"yogurt","t":"Yogurt (¾ cup)","ca":20},{"id":"cheese","t":"Cheese (50 g)","ca":25},{"id":"tofu","t":"Calcium-set tofu (¾ cup)","ca":30,"fe":20,"fib":5},{"id":"lentils","t":"Lentils or beans (¾ cup)","fe":30,"fib":25},{"id":"meat","t":"Beef or chicken (75 g)","fe":15},{"id":"fish","t":"Salmon or trout (75 g)","d":60},{"id":"egg","t":"Egg","fe":5,"d":5},{"id":"cereal","t":"Iron-fortified cereal (1 serving)","fe":30,"fib":10},{"id":"bread","t":"Whole grain bread (1 slice)","fe":5,"fib":8},{"id":"rice","t":"Brown rice or another whole grain (1 cup)","fe":5,"fib":12},{"id":"apple","t":"Apple or pear","fib":15},{"id":"berries","t":"Berries (½ cup)","fib":10},{"id":"broccoli","t":"Broccoli (½ cup)","fib":8},{"id":"spinach","t":"Spinach, cooked (½ cup)","fe":20,"ca":5,"fib":8},{"id":"almonds","t":"Almonds (¼ cup)","ca":7,"fib":12}],"bars":[{"id":"fe","t":"Iron"},{"id":"ca","t":"Calcium"},{"id":"fib","t":"Fibre"},{"id":"d","t":"Vitamin D"}],"reach":"reaches the general reference","below":"below the general reference; one day doesn’t tell the whole story","advice":"For your own health, talk to a doctor, nurse or registered dietitian."}},"energy":{"note":"Persona model values, not targets for anyone.","rule":"Activity energy ≈ MET-minutes × the persona’s resting energy per minute (BMR ÷ 1440). The thermic effect of food is about 10% of intake.","adapt":"The balance shifts from day to day, and bodies adapt. One day decides nothing.","labels":{"more":"more in than out","even":"about even","less":"more out than in"},"personas":[{"id":"adaeze","name":"Adaeze","age":29,"role":"competitive cyclist","bmr":1440,"everyday":500,"meals":[{"id":"rest","t":"Rest-day eating","kcal":2200},{"id":"train","t":"Training-day eating","kcal":2900}],"acts":[{"id":"ride","t":"Training ride: cycling","min":90,"met":8}]},{"id":"rui","name":"Rui","age":67,"role":"retired gardener","bmr":1300,"everyday":275,"meals":[{"id":"usual","t":"Usual day","kcal":2200},{"id":"party","t":"Family celebration dinner","kcal":2600}],"acts":[{"id":"garden","t":"Gardening","min":120,"met":3,"on":true},{"id":"walk","t":"Evening walk","min":30,"met":4}]},{"id":"jiho","name":"Jiho","age":35,"role":"office worker","bmr":1600,"everyday":350,"meals":[{"id":"usual","t":"Usual workday","kcal":2300},{"id":"dinner","t":"Big family dinner","kcal":2700}],"acts":[{"id":"walk","t":"Walk at lunch","min":30,"met":4,"on":true},{"id":"dance","t":"Dance class","min":60,"met":5}]}],"everydayT":"everyday moving (chores, errands, work)","week":{"title":"Activity panel: Rui’s active week","how":"Each session is 30 minutes on a different day. Tap an activity to add it to the next free day; tap a day to clear it.","tiles":[{"id":"walk","t":"Walk","met":4},{"id":"swim","t":"Swim","met":6},{"id":"garden","t":"Garden","met":3},{"id":"dance","t":"Dance class","met":5}],"slots":5,"min":30,"target":600}},"history":{"timeline":[{"year":1942,"title":"Canada’s Official Food Rules","shape":"rules","short":"1942: food rules to prevent deficiencies in wartime","points":["Written during wartime rationing","A short list of foods to eat every day, such as milk, fruits, vegetables, cereals and bread, and meat or fish","Aimed at getting enough nutrients"],"why":"With food rationed, the worry was nutrient deficiencies."},{"year":1961,"title":"Canada’s Food Guide","shape":"guide","short":"1961: the rules become “Canada’s Food Guide”","points":["Renamed from “rules” to a “guide”","Still a list of food groups to eat each day"],"why":"A guide gives advice people can adapt, rather than rules to obey."},{"year":1977,"title":"Canada’s Food Guide","shape":"circle","short":"1977: four food groups in a circle","points":["Four food groups: milk and milk products; breads and cereals; fruits and vegetables; meat, fish, poultry and alternates","Shown as a circle graphic"],"why":"Nutrition science was organizing foods by the nutrients each group supplies."},{"year":1982,"title":"Canada’s Food Guide","shape":"circle","short":"1982: variety and moderation","points":["The four food groups stay","New messages about variety, and moderation in fat, sugar and salt"],"why":"Concern was shifting from deficiency toward chronic diseases such as heart disease."},{"year":1992,"title":"Canada’s Food Guide to Healthy Eating","shape":"rainbow","short":"1992: the rainbow and a whole-diet approach","points":["The rainbow: grain products, vegetables and fruit, milk products, meat and alternatives","Ranges of servings for each group","Lower-fat choices encouraged"],"why":"Evidence linked whole eating patterns, not single foods, with long-term health."},{"year":2007,"title":"Eating Well with Canada’s Food Guide","shape":"chart","short":"2007: servings by age and sex","points":["Numbers of daily servings by age and sex","Advice on oils and fats, and on water","A First Nations, Inuit and Métis version"],"why":"Needs differ by age and sex, and the guide aimed to fit more Canadians."},{"year":2019,"title":"Canada’s Food Guide","shape":"plate","short":"2019: plate, habits, no servings","points":["A plate: half vegetables and fruits, a quarter whole grains, a quarter protein foods","Water as the drink of choice; choose plant-based protein more often","Healthy eating habits; no daily servings"],"why":"A review of the evidence, a more diverse population and a food supply full of highly processed foods."}],"world":[{"id":"japan","t":"Japan: the spinning top","year":2005,"shape":"top","points":["A spinning top: grain dishes in the widest band, then vegetable dishes, then fish, egg and meat dishes, with milk and fruit at the tip","Water or tea is the top’s axis","A figure running on top: physical activity keeps the diet “in balance”"],"similar":"Like Canada’s guide, most of the top is plant foods, and eating goes together with being active."},{"id":"brazil","t":"Brazil’s dietary guidelines","year":2014,"shape":"brazil","points":["No plate or pyramid: advice is organized around how processed foods are","Make natural or minimally processed foods the basis of meals; avoid ultra-processed foods","Eat regularly, with others, and be wary of food advertising"],"similar":"Like Canada’s guide: limit highly processed foods, cook, eat with others and question food marketing."},{"id":"us","t":"United States: MyPlate","year":2011,"shape":"myplate","points":["A plate split into fruits, vegetables, grains and protein","Dairy shown as a cup beside the plate","Make half your plate fruits and vegetables"],"similar":"Like Canada’s guide, half the plate is vegetables and fruits. Canada folds dairy into protein foods and makes water the drink."},{"id":"med","t":"A Mediterranean pyramid","year":1993,"shape":"pyramid","points":["Base: being active and enjoying meals with others","Every day: vegetables, fruits, whole grains, olive oil, beans and nuts","Fish often; poultry, eggs and dairy in moderation; red meat and sweets less often"],"similar":"Like Canada’s guide: mostly plants, fewer highly processed foods, and meals shared with others."}],"worldNote":"Different shapes, similar evidence: more plants, fewer highly processed foods, eating together. Healthy eating can fit any culture’s foods."},"predIntro":"Make a prediction first. Then the plate, the bars, the scale or the timeline will show you what really happens.","predictions":[{"id":"p1","mode":"plate","prompt":"In the 2019 guide, what fills \u003cstrong>half\u003c/strong> the plate?","options":[{"t":"Dairy","_n":"o64b","_k":"da7cf39d"},{"t":"Vegetables and fruits","_n":"p65b","_k":"c1411974"},{"t":"Protein foods","_n":"q66b","_k":"bf7fa031"},{"t":"Whole grains","_n":"r5fb","_k":"7e7ee263"}],"explain":"Half vegetables and fruits, a quarter whole grains, a quarter protein foods. Dairy is part of protein foods."},{"id":"p2","mode":"dri","prompt":"Nour’s calcium is at 800 mg: her EAR is 800 mg and her RDA is 1000 mg. What does an intake \u003cstrong>at the EAR\u003c/strong> tell us?","options":[{"t":"She definitely meets her needs","_n":"s60b","_k":"c7e7b135"},{"t":"She is above the safe limit","_n":"t6db","_k":"bb171b3e"},{"t":"She is definitely deficient","_n":"u6cb","_k":"1997f7bc"},{"t":"About a 50% chance her intake meets her needs","_n":"v6bb","_k":"6628db45"}],"explain":"The EAR is the median need. At the EAR, there’s about an even chance her intake is enough; at the RDA, it’s very likely enough."},{"id":"p3","mode":"energy","prompt":"Adaeze adds a 90-minute training ride but eats the same as on a rest day. What does the scale show?","options":[{"t":"Nothing changes","_n":"w6ab","_k":"910d723c"},{"t":"Her intake rises automatically","_n":"x69b","_k":"656fc233"},{"t":"More energy out than in: she needs more fuel on training days","_n":"y68b","_k":"e6a680e4"},{"t":"Her BMR doubles","_n":"z67b","_k":"165b890f"}],"explain":"Athletes who regularly under-fuel can harm their performance, bones and health. Matching fuel to training matters."},{"id":"p4","mode":"history","prompt":"The timeline is at 2007. What did the 2019 guide drop?","options":[{"t":"All dairy products","_n":"1066b","_k":"0f976383"},{"t":"Vegetables and fruits","_n":"1165b","_k":"23ec7a15"},{"t":"Advice about drinks","_n":"1264b","_k":"b80f4ae3"},{"t":"Recommended numbers of daily servings","_n":"13dbb","_k":"09cbe225"}],"explain":"The plate shows proportions instead, and habits were added. Milk and other dairy foods are still in protein foods."}],"chalIntro":"Use the plate, the food sliders or the activity panel to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Plate mode: Build a plate for \u003cstrong>Jiho\u003c/strong> using foods his family often eats, matching the guide’s proportions, with a whole grain and a drink the guide recommends.","msgs":{"white":"White rice is a refined grain. Mixed-grain or brown rice keeps the fibre.","bread":"White bread is made from refined flour. Whole wheat roti or another whole grain keeps the fibre.","drink":"The guide makes water the drink of choice; milk or unsweetened fortified soy also fit.","half":"Vegetables and fruits should fill half: 4 of 8 wedges.","quarters":"Half, quarter, quarter: 4, 2, 2 wedges.","noDrink":"Choose a drink too."},"why":"Half vegetables and fruits, a quarter whole grains, a quarter protein foods, and a drink the guide recommends.","hints":["Half, quarter, quarter: 4, 2, 2 wedges.","Check that each grain is whole.","Swap white rice for mixed-grain rice and choose water."]},{"id":"tc2","goal":3,"prompt":"DRI mode: Use the food sliders so Nour’s iron is \u003cstrong>at or above her RDA (18 mg) and below the UL (45 mg)\u003c/strong>.","msgs":{"low":"Still below her RDA. Below the RDA isn’t automatically deficient, but adequacy is less certain.","high":"Above the UL, risk rises."},"why":"At or above the RDA, her intake is very likely enough, and it stays below the UL, where risk would rise.","hints":["She starts at 6 mg; you need at least 12 more.","Cereal gives 4, lentils and spinach 3 each.","2 cereal + 2 lentils = 6 + 8 + 6 = 20 mg."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Energy balance mode, activity panel: Rui, 67, wants an active week: \u003cstrong>5 half-hour sessions\u003c/strong> on different days, at least \u003cstrong>2 of them gardening\u003c/strong> (he loves it), at most \u003cstrong>1 swim\u003c/strong> (one pool pass), and at least \u003cstrong>600 MET-minutes\u003c/strong> in total. (600 MET-minutes is about the 150 minutes of moderate activity in Canada’s adult movement guidelines.)","msgs":{"walks":"Gardening and walking are lighter; you’re 60 short.","swims":"Only one pool pass.","gardens":"Four gardens give 360, and one more session can’t make up 240.","count":"Plan 5 sessions, one on each of 5 days.","garden2":"Rui wants at least 2 gardening sessions.","short":"Not enough yet: the week needs at least 600 MET-minutes."},"why":"Five sessions, at least two of them gardening, one swim at most, and 600 MET-minutes or more.","hints":["Two gardens use 180 MET-minutes. You need 420 more from three sessions.","Three sessions averaging 140: a swim plus two of walk or dance, or three dances.","For example: garden, garden, swim, dance, dance = 660."]}],"blocks":[{"title":"What the plate and the scale show","html":"\u003cp>The guide is about \u003cstrong>proportions and habits\u003c/strong>, not points. DRIs describe \u003cstrong>populations\u003c/strong>, with a safe range between enough and too much. Energy balance is a \u003cstrong>moving relationship\u003c/strong> with three kinds of expenditure (basal metabolism, activity and the thermic effect of food), different for every body. Food guides from other countries look different but rest on similar evidence, and healthy eating can fit any culture’s foods.\u003c/p>\u003cp class=\"tiny\">For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"},{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Ainsworth, B. E., Haskell, W. L., Herrmann, S. D., Meckes, N., Bassett, D. R., Jr., Tudor-Locke, C., Greer, J. L., Vezina, J., Whitt-Glover, M. C., &amp; Leon, A. S. (2011). 2011 Compendium of Physical Activities: A second update of codes and MET values. \u003ci>Medicine &amp; Science in Sports &amp; Exercise, 43\u003c/i>(8), 1575–1581.\u003c/li>\u003cli>Canadian Society for Exercise Physiology. (2021). \u003ci>Canadian 24-hour movement guidelines for adults aged 18–64 years and adults aged 65 years or older\u003c/i>.\u003c/li>\u003cli>Health Canada. (2019). \u003ci>Canada’s food guide\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (2019). \u003ci>Canada’s dietary guidelines for health professionals and policy makers\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.). \u003ci>Dietary reference intakes tables\u003c/i>. Government of Canada.\u003c/li>\u003cli>Ministry of Health of Brazil. (2014). \u003ci>Dietary guidelines for the Brazilian population\u003c/i> (2nd ed.).\u003c/li>\u003cli>Statistics Canada. (2017). \u003ci>Canadian Community Health Survey – Nutrition (2015)\u003c/i>.\u003c/li>\u003cli>U.S. Department of Agriculture. (2011). \u003ci>MyPlate\u003c/i>.\u003c/li>\u003c/ul>\u003cp class=\"tiny muted\">Nour’s day, the typical intakes, the persona energy values and the MET values in this module are model data for learning.\u003c/p>"}]},"part3":{"slug":"recipe","name":"Recipe","heading":"Modify a recipe","intro":"Change “Weeknight fried rice” so it better reflects Canada’s Food Guide. Choose any combination of swaps, watch the readouts and the data, then save a kitchen card for cooking in class or at home with an adult.","recipe":{"title":"Weeknight fried rice","serves":4,"cupsPerServing":1.5,"groups":[{"id":"rice","t":"Rice","opts":[{"id":"white","t":"White rice","line":"4 cups cooked white rice","na":0,"sf":0.4,"fib":2.4,"cups":4},{"id":"brown","t":"Brown or mixed-grain rice","line":"4 cups cooked brown or mixed-grain rice","na":20,"sf":1.2,"fib":12,"cups":4,"whole":true}]},{"id":"soy","t":"Soy sauce","opts":[{"id":"reg","t":"Regular soy sauce","line":"3 tbsp regular soy sauce","na":2700},{"id":"low","t":"Lower-sodium soy sauce","line":"3 tbsp lower-sodium soy sauce","na":1600},{"id":"half","t":"Use half as much","line":"1½ tbsp regular soy sauce","na":1350}]},{"id":"fat","t":"Fat","opts":[{"id":"butter","t":"Butter","line":"2 tbsp butter","na":180,"sf":14.6,"milk":true},{"id":"canola","t":"Canola oil","line":"2 tbsp canola oil","na":0,"sf":2}]},{"id":"pro","t":"Protein","opts":[{"id":"ham","t":"Ham","line":"1 cup diced ham","na":1000,"sf":3,"cups":1,"type":"processed meat"},{"id":"tofu","t":"Firm tofu","line":"1 cup diced firm tofu","na":30,"sf":1.5,"fib":1,"cups":1,"type":"plant-based","soy":true},{"id":"edamame","t":"Edamame","line":"1 cup shelled edamame","na":10,"sf":0.8,"fib":8,"cups":1,"type":"plant-based","soy":true},{"id":"chicken","t":"Diced chicken","line":"1 cup diced cooked chicken","na":100,"sf":1.5,"cups":1,"type":"poultry"}]}],"fixed":[{"id":"eggs","line":"2 eggs","na":140,"sf":3.2,"cups":0.5},{"id":"peas","line":"½ cup frozen peas","na":60,"sf":0.1,"fib":3.5,"cups":0.5,"veg":true}],"adds":[{"id":"veg","t":"Add 2 cups mixed vegetables (bok choy, carrots, peppers)","line":"2 cups mixed vegetables (bok choy, carrots, peppers)","na":60,"fib":6,"cups":2,"veg":true},{"id":"kimchi","t":"Add ½ cup kimchi (vegetables; also adds sodium)","line":"½ cup kimchi, chopped","na":400,"fib":1.5,"cups":0.5,"veg":true,"kimchi":true}],"dv":{"na":2300,"sf":20},"levels":{"na":"high (30% DV or more), medium (15–29%) or lower (under 15%)","sf":"high (15% DV or more) or lower"},"steps":["Wash hands.","Cook the rice the day before, then cool it quickly and refrigerate it (cooked rice left out can grow \u003ci>Bacillus cereus\u003c/i>; more in module 15, food safety).","Heat the oil.","Cook the eggs fully.","Add the vegetables and protein.","Add the rice and sauce.","Taste before adding any more sauce."],"safety":["Hot oil: keep handles turned in and add food gently.","Knife grip: curl your fingertips and keep the blade away from them.","Clean as you go."],"allergens":"Allergen note: soy and egg.","allergenMore":{"milk":"Butter contains milk.","wheat":"Many soy sauces also contain wheat: check the label.","kimchi":"Kimchi is often made with fish sauce or salted shrimp: check the label."},"after":"There’s no single right version. Choose swaps that fit your family’s tastes, budget and culture."},"blocks":[{"title":"Where the sodium comes from","html":"\u003cp>In the original recipe, the soy sauce supplies most of the sodium, so changing the sauce matters most. Adding vegetables makes more servings from the same sauce, so each serving has less sodium. Kimchi adds vegetables but also sodium. Choosing plant-based protein more often brings fibre and usually less saturated fat.\u003c/p>"}],"quickCheck":{"title":"Recipe quick check","summary":"Recipe quick check","items":[{"id":"q1","goal":6,"prompt":"Which single swap cuts sodium most?","choices":[{"t":"Brown rice","_n":"14dcb","_k":"806f8b44"},{"t":"Lower-sodium soy sauce","_n":"15d9b","_k":"aaa34548"},{"t":"Tofu","_n":"16dab","_k":"6e93a514"},{"t":"Canola oil","_n":"17d7b","_k":"2a7eeacf"}],"right":"Right. Soy sauce supplies most of the sodium here.","wrong":"Soy sauce supplies most of the sodium here."},{"id":"q2","goal":6,"prompt":"Which swap moves the dish toward the guide’s grain advice?","choices":[{"t":"Butter","_n":"18d8b","_k":"19d5300f"},{"t":"More eggs","_n":"19d5b","_k":"7c25711b"},{"t":"Brown or mixed-grain rice","_n":"1ad6b","_k":"6c4fbd0f"},{"t":"Ham","_n":"1be3b","_k":"225ee82d"}],"right":"Right. Choose whole grains.","wrong":"Choose whole grains."},{"id":"q3","goal":[6,1],"prompt":"Why does the guide suggest choosing plant-based protein more often?","choices":[{"t":"Meat has no nutrients","_n":"1ce4b","_k":"ccc270ef"},{"t":"It’s always cheaper","_n":"1de1b","_k":"310ef64d"},{"t":"Plants have more protein than meat","_n":"1ee0b","_k":"4150ba31"},{"t":"More fibre and less saturated fat, on average","_n":"1fe3b","_k":"489d5ca6"}],"right":"Right. Plant proteins bring fibre and usually less saturated fat; meat still provides nutrients like iron and B12.","wrong":"Plant proteins bring fibre and usually less saturated fat; meat still provides nutrients like iron and B12."},{"id":"q4","goal":6,"prompt":"Adding kimchi does what?","choices":[{"t":"Adds saturated fat","_n":"1ge2b","_k":"11119215"},{"t":"Removes sodium","_n":"1he5b","_k":"0191208d"},{"t":"Adds vegetables but also sodium","_n":"1ie4b","_k":"6f38fd76"},{"t":"Makes it a whole grain","_n":"1je7b","_k":"ee3d9151"}],"right":"Right. Fermented vegetables are often salty; balance with the other swaps.","wrong":"Fermented vegetables are often salty; balance with the other swaps."}]}},"practice":{"activities":[{"id":"dri","type":"sorter","title":"Which DRI?","summary":"Which DRI?","goal":3,"noun":"statement","txt":true,"instruction":"Sort each statement into the DRI it describes.","boxes":[{"id":"ear","label":"EAR","sub":"Estimated Average Requirement"},{"id":"rda","label":"RDA","sub":"Recommended Dietary Allowance"},{"id":"ai","label":"AI","sub":"Adequate Intake"},{"id":"ul","label":"UL","sub":"Tolerable Upper Intake Level"},{"id":"amdr","label":"AMDR","sub":"Acceptable Macronutrient Distribution Range"},{"id":"cdrr","label":"CDRR","sub":"Chronic Disease Risk Reduction intake"}],"items":[{"id":"d1","t":"Meets the needs of about half of healthy people in a life-stage group.","_a":"RFNRQxA=","why":"The EAR is the median need."},{"id":"d2","t":"Meets the needs of nearly all (about 97–98%) healthy people.","_a":"RERUUBA=","why":"The RDA sits above most people’s needs."},{"id":"d3","t":"Used when there isn’t enough evidence to set an EAR.","_a":"RFdZEw==","why":"Without an EAR there can be no RDA, so an AI is set instead."},{"id":"d4","t":"The highest average daily intake unlikely to cause harm.","_a":"RENcEw==","why":"Above the UL, the risk of harm rises."},{"id":"d5","t":"Fat should provide 20–35% of an adult’s energy.","_a":"RFddVUAa","why":"The AMDR gives energy ranges for carbohydrate, fat and protein."},{"id":"d6","t":"Reducing sodium intake to this level lowers chronic disease risk.","_a":"RFVUQ0Aa","why":"The CDRR is set for sodium."},{"id":"d7","t":"The best value for judging how many people in a \u003cstrong>group\u003c/strong> may have inadequate intake.","_a":"RFNRQxA=","why":"Comparing a group’s intakes with the median need estimates the share falling short.","wrong":{"rda":"For groups, use the EAR; the RDA overestimates how many people fall short."},"hints":["Which value marks the median need?","Comparing a group’s intakes with the median need estimates the share falling short.","EAR."]},{"id":"d8","t":"A supplement label lists 5000 IU of vitamin D; the adult reference here is 4000 IU.","_a":"RENcEw==","why":"4000 IU is the adult UL, so 5000 IU a day is above the upper safe limit.","wrong":{"rda":"This compares a dose with the upper safe limit."}}],"wrongDefault":"Re-read the DRI definitions card."},{"id":"evidence","type":"custom","title":"Evidence, history and the world","summary":"Evidence, history and the world","star":true,"goal":[1,2,4,5],"instruction":"Six items on the evidence behind the guide, its history and the world. Items marked ★ are non-routine; H6 is an investigation.","how":"Tap your choices (or type a number), then press Check.","items":[{"id":"h1","kind":"sets","goal":1,"prompt":"Match each 2019 category to a main nutrient it supplies.","sets":[{"id":"vf","label":"Vegetables and fruits","chips":[{"t":"fibre and vitamin C","_n":"1ke6b","_k":"18c59112"},{"t":"fibre and B vitamins","_n":"1ld9b","_k":"8b4671be"},{"t":"protein and iron","_n":"1md8b","_k":"011a6136"}]},{"id":"wg","label":"Whole grains","chips":[{"t":"fibre and vitamin C","_n":"1ncfb","_k":"59903362"},{"t":"fibre and B vitamins","_n":"1od0b","_k":"88ea0a6f"},{"t":"protein and iron","_n":"1pd1b","_k":"96d964e2"}]},{"id":"pf","label":"Protein foods","chips":[{"t":"fibre and vitamin C","_n":"1qd2b","_k":"3202ab30"},{"t":"fibre and B vitamins","_n":"1rd3b","_k":"937c28d2"},{"t":"protein and iron","_n":"1sd4b","_k":"b1064bb7"}]}],"fb":"The curriculum’s older group names map onto these: Grain Products became whole grain foods; Meat and Alternatives and Milk and Alternatives joined protein foods.","why":"Vegetables and fruits: fibre and vitamin C. Whole grains: fibre and B vitamins. Protein foods: protein and iron. The curriculum’s older group names map onto these: Grain Products became whole grain foods; Meat and Alternatives and Milk and Alternatives joined protein foods."},{"id":"h2","kind":"chips","goal":1,"prompt":"Why does the guide recommend whole fruit over juice?","chips":[{"t":"Whole fruit has fibre; juice is a source of free sugars","_n":"1td5b","_k":"2c0b30c5"},{"t":"Juice has no vitamins","_n":"1ud6b","_k":"af5d4a80"},{"t":"Whole fruit has more sugar than juice","_n":"1vd7b","_k":"9c302962"},{"t":"Juice is harder to digest","_n":"1wd8b","_k":"663c496c"}],"fb":"Juice loses the fibre and is easy to drink in large amounts.","why":"Juice loses the fibre and is easy to drink in large amounts. Whole fruit keeps its fibre; juice is a concentrated source of free sugars. The guide recommends water."},{"id":"h3","kind":"num","star":true,"goal":[1,4],"prompt":"A day provides 2000 kcal with 250 g carbohydrate, 75 g protein and 60 g fat. What percent of energy comes from fat?","_a":"VAE=","unit":"%","label":"Fat","why":"60 × 9 = 540; 540 ÷ 2000 = 27%.","wrong":[{"match":12,"fb":"You used 4 kcal/g; fat gives 9."},{"match":3,"fb":"That divides grams by kcal. Find the kcal from fat first."}],"wrongDefault":"Find the kcal from fat first (fat gives 9 kcal per gram), then divide by 2000.","hints":["Fat gives 9 kcal per gram.","60 × 9 = 540 kcal.","540 ÷ 2000 × 100 = 27%."]},{"id":"h4","kind":"sets","star":true,"goal":[1,4],"prompt":"For the day in H3, is each macronutrient inside the adult AMDR (carbohydrate 45–65%, protein 10–35%, fat 20–35%)?","sets":[{"id":"c","label":"Carbohydrate (250 g)","chips":[{"t":"Yes","_n":"1xd5b","_k":"9c287759"},{"t":"No","_n":"1yd4b","_k":"2adb836e"}]},{"id":"p","label":"Protein (75 g)","chips":[{"t":"Yes","_n":"1zd3b","_k":"7e9a394d"},{"t":"No","_n":"20d2b","_k":"9dcc5288"}]},{"id":"f","label":"Fat (60 g)","chips":[{"t":"Yes","_n":"21d9b","_k":"1fb9cd85"},{"t":"No","_n":"22d8b","_k":"548eaf58"}]}],"fb":"250 × 4 = 1000 (50%); 75 × 4 = 300 (15%).","why":"Carbohydrate 50%: yes. Protein 15%: yes. Fat 27%: yes. 250 × 4 = 1000 (50%); 75 × 4 = 300 (15%)."},{"id":"h5","kind":"chips","star":true,"goal":2,"prompt":"In 1942 Canada’s food rules were written during wartime rationing. Which change in Canada since then best explains the 2019 guide’s inclusion of foods like tofu, lentils and mixed-grain rice?","chips":[{"t":"Greater cultural diversity and more evidence for plant-based protein","_n":"23d7b","_k":"4f241819"},{"t":"Wartime rationing of meat continued until 2019","_n":"24d6b","_k":"48d068d8"},{"t":"Canadians stopped eating meat","_n":"25ddb","_k":"7c220ec7"},{"t":"These foods became the cheapest in every store","_n":"26dcb","_k":"06c34b93"}],"fb":"Both the population and the evidence changed.","why":"Both the population and the evidence changed: Canadians’ food traditions are more diverse, and evidence supports plant-based protein."},{"id":"h6","kind":"chips","star":true,"inquiry":true,"goal":[2,5],"prompt":"\u003cspan class=\"hfa-model\">Model data\u003c/span> In a school survey, 30% of students said water was their usual lunch drink in 2018 and 45% in 2022. Choose the best research question to investigate why.","chips":[{"t":"Did changes in the school’s food environment or the 2019 guide’s messaging change students’ drink choices?","_n":"27e3d","_k":"58288a14"},{"t":"Do students like water?","_n":"28e4d","_k":"dde4a627"},{"t":"How many students go to the school?","_n":"29e1d","_k":"b29560a7"},{"t":"Is water healthier than juice?","_n":"2ae2d","_k":"a4b0647c"}],"fb":"A good question names what changed and what might explain it; “Do students like water?” is too vague.","why":"A good question names what changed and what might explain it, so it can be investigated with data.","hints":["Which question could actually be investigated with data?","It should name a possible cause.","The food-environment and messaging question."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Haruka","goal":[2,3],"how":"","instruction":"Haruka made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Judge Nour’s calcium intake of 900 mg (EAR 800, RDA 1000).","steps":["Her intake is 900 mg.","That’s above the EAR of 800 mg.","It’s below the RDA of 1000 mg, so she is calcium-deficient.","She needs a supplement."],"_a":"VA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 rests on the mistake before it."],"fixes":[{"t":"Below the EAR means she’s fine.","why":"She’s above the EAR.","_n":"2be7d","_k":"e934cdba"},{"t":"Between the EAR and RDA, her intake is probably adequate, but less certainly so than at the RDA; one day of data also isn’t enough to judge.","why":"The RDA covers about 97–98% of healthy people. An intake below it isn’t automatically too low; the EAR is the median need.","_n":"2ce8d","_k":"96794d9b"},{"t":"She’s above the UL.","why":"The UL is much higher.","_n":"2de5d","_k":"e838c052"},{"t":"Step 3 is correct.","why":"The RDA isn’t a deficiency line. The RDA covers about 97–98% of healthy people. An intake below it isn’t automatically too low; the EAR is the median need.","_n":"2ee6d","_k":"cf742464"}],"hints":["Is the RDA a minimum?","It covers nearly everyone’s needs; many people need less.","Between the EAR and RDA, her intake is probably adequate, but less certainly so than at the RDA; one day of data also isn’t enough to judge."]},{"id":"e2","goal":3,"task":"Find the percent of energy from fat in a 1800 kcal day with 50 g fat.","steps":["Energy from fat = 50 g × 4 kcal/g = 200 kcal.","200 ÷ 1800 ≈ 11%.","That’s below the AMDR, so the day is too low in fat."],"_a":"Vg==","stepFb":["","Step 2 follows step 1. The mistake is earlier.","This follows from the earlier mistake."],"fixes":[{"t":"Step 1 is correct.","why":"Fat gives 9 kcal per gram; carbohydrate and protein give 4.","_n":"2fdbd","_k":"02fb3774"},{"t":"50 ÷ 1800 = 2.8%.","why":"That divides grams by kcal.","_n":"2gdcd","_k":"e45f2e74"},{"t":"50 × 7 = 350.","why":"7 is for alcohol.","_n":"2he9d","_k":"83aef9f2"},{"t":"50 g × 9 kcal/g = 450 kcal; 450 ÷ 1800 = 25%, inside the 20–35% AMDR.","why":"Fat gives 9 kcal per gram; carbohydrate and protein give 4.","_n":"2ie8d","_k":"12bd0989"}],"hints":["How many kcal in a gram of fat?","9.","50 g × 9 kcal/g = 450 kcal; 450 ÷ 1800 = 25%, inside the 20–35% AMDR."]},{"id":"e3","goal":2,"task":"Explain what the 2019 guide says about milk.","steps":["The 2019 guide no longer has a separate “Milk and Alternatives” group.","So the guide no longer recommends milk at all.","People should avoid dairy."],"_a":"Vw==","stepFb":["Step 1 is correct.","","This follows from step 2’s mistake."],"fixes":[{"t":"Milk is now a vegetable.","why":"It’s a protein food.","_n":"2jebd","_k":"d4dbd0ff"},{"t":"Dairy foods like milk and yogurt are now protein foods, and unsweetened milk is one of the healthy drink options alongside water.","why":"Dairy moved into protein foods; it wasn’t dropped.","_n":"2kead","_k":"e0c185a6"},{"t":"Step 2 is correct.","why":"The 2019 guide uses plate proportions and eating habits; daily servings were dropped.","_n":"2le5d","_k":"fbf71a2a"},{"t":"Milk became a whole grain.","why":"Milk isn’t a grain.","_n":"2me4d","_k":"124c2ec6"}],"hints":["Where did dairy go in 2019?","Protein foods.","Dairy foods like milk and yogurt are now protein foods, and unsweetened milk is one of the healthy drink options alongside water."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"What surprised you about how Canada’s Food Guide has changed since 1942?"},{"id":"j2","q":"In your own words, why are DRIs written for groups of people rather than as personal targets?"},{"id":"j3","q":"Explain to a friend how you’d change a family recipe you love to fit the guide, without losing what makes it yours."},{"id":"j4","q":"Which DRI term is still fuzzy for you? What will you do to sort it out?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In the 2019 guide, what fills half the plate?","options":[{"t":"Dairy","why":"Dairy is part of protein foods.","_n":"2ne7d","_k":"f8475fee"},{"t":"Vegetables and fruits","why":"Half vegetables and fruits, a quarter whole grains, a quarter protein foods.","_n":"2oe6d","_k":"7d1f4545"},{"t":"Protein foods","why":"They fill a quarter.","_n":"2pe1d","_k":"59939b32"},{"t":"Whole grains","why":"They fill a quarter.","_n":"2qe0d","_k":"c938de76"}]},"b":{"prompt":"Which drink does the 2019 guide name as the drink of choice?","options":[{"t":"Water","why":"Water is the guide’s drink of choice.","_n":"2rad4","_k":"366152da"},{"t":"100% fruit juice","why":"Juice is a source of free sugars.","_n":"2sac4","_k":"383d466f"},{"t":"Sports drinks","why":"Not the drink of choice.","_n":"2tab4","_k":"cb1818d1"},{"t":"Chocolate milk","why":"Sweetened drinks aren’t the drink of choice.","_n":"2uaa4","_k":"5f0c19e7"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which DRI is the highest daily intake unlikely to cause harm?","options":[{"t":"EAR","why":"The EAR is the median need.","_n":"2va94","_k":"0b63d95c"},{"t":"RDA","why":"The RDA meets nearly everyone’s needs.","_n":"2wa84","_k":"49731e10"},{"t":"UL","why":"Above the UL, the risk of harm rises. More isn’t better.","_n":"2xa74","_k":"516e1a0b"},{"t":"AI","why":"Used when there’s no EAR.","_n":"2ya64","_k":"3bec94e4"}]},"b":{"prompt":"Which DRI meets the needs of about half of healthy people in a group?","options":[{"t":"RDA","why":"The RDA covers about 97–98%.","_n":"2za54","_k":"e92fe274"},{"t":"UL","why":"The UL is an upper safety limit.","_n":"30a44","_k":"b8b0c778"},{"t":"EAR","why":"The EAR is the median need.","_n":"31a74","_k":"b918d049"},{"t":"AMDR","why":"The AMDR is an energy range for macronutrients.","_n":"32a84","_k":"fb3f114a"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which change was new in the 2019 guide?","options":[{"t":"It added vegetables for the first time","why":"Earlier guides included vegetables.","_n":"33a94","_k":"4c444f26"},{"t":"It replaced daily servings with plate proportions and eating habits","why":"The 2019 guide uses plate proportions and eating habits; daily servings were dropped.","_n":"34aa4","_k":"40e7a0f6"},{"t":"It created a separate dairy group","why":"Dairy moved into protein foods.","_n":"35a34","_k":"bb6e489e"},{"t":"It was Canada’s first food guide","why":"Canada had food rules from 1942.","_n":"36a44","_k":"9a1e772a"}]},"b":{"prompt":"Why were Canada’s first official food rules created in 1942?","options":[{"t":"To set calorie targets for everyone","why":"They gave food rules, not calorie targets.","_n":"37a54","_k":"4621648e"},{"t":"To prevent nutrient deficiencies during wartime rationing","why":"With food rationed in wartime, the worry was getting enough nutrients.","_n":"38a64","_k":"06ed51fd"},{"t":"To promote plant-based eating","why":"A 2019 emphasis.","_n":"399f4","_k":"993a305f"},{"t":"To reduce rates of chronic disease","why":"That became a bigger focus later.","_n":"3aa04","_k":"69536069"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A persona’s day has 2000 kcal and 60 g fat. What percent of energy comes from fat, and is it within the adult AMDR of 20–35%?","options":[{"t":"12%; below the AMDR","why":"Fat gives 9 kcal/g, not 4.","_n":"3b195","_k":"76f5d288"},{"t":"27%; within the AMDR","why":"60 × 9 = 540; 540 ÷ 2000 = 27%.","_n":"3c185","_k":"09848007"},{"t":"3%; below the AMDR","why":"You divided grams by kcal.","_n":"3d1b5","_k":"f377dc05"},{"t":"54%; above the AMDR","why":"540 ÷ 2000 is 27%, not 54%.","_n":"3e1a5","_k":"39370fef"}]},"b":{"prompt":"A persona’s day has 2400 kcal and 80 g fat. What percent of energy comes from fat?","options":[{"t":"3%","why":"Grams ÷ kcal.","_n":"3f155","_k":"bfb6ede8"},{"t":"13%","why":"Fat gives 9 kcal per gram; carbohydrate and protein give 4.","_n":"3g145","_k":"24dc3efc"},{"t":"30%","why":"80 × 9 = 720; 720 ÷ 2400 = 30%.","_n":"3h175","_k":"2f0031bb"},{"t":"60%","why":"720 ÷ 2400 is 0.30.","_n":"3i165","_k":"90ab183c"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Nour’s usual iron intake is between her EAR and RDA. What’s the best interpretation?","options":[{"t":"Definitely deficient","why":"The RDA covers about 97–98% of healthy people. An intake below it isn’t automatically too low; the EAR is the median need.","_n":"3j215","_k":"4c75c159"},{"t":"Too high and harmful","why":"That would be above the UL.","_n":"3k205","_k":"bfaf608d"},{"t":"Definitely adequate","why":"Only likely, not certain.","_n":"3l135","_k":"82b41908"},{"t":"Probably adequate, but with a higher chance of falling short than at the RDA","why":"Between the EAR and RDA, intake is probably adequate, but less certainly so than at the RDA.","_n":"3m145","_k":"942f7449"}]},"b":{"prompt":"A persona takes supplements that put her vitamin D intake above the UL every day. What’s the best interpretation?","options":[{"t":"It doesn’t matter because vitamins are always safe","why":"Fat-soluble vitamins can build up.","_n":"3n115","_k":"7243f094"},{"t":"The risk of harm rises; more isn’t better","why":"Above the UL, the risk of harm rises. More isn’t better.","_n":"3o125","_k":"123b6c39"},{"t":"She’ll be extra healthy","why":"Above the UL, the risk of harm rises. More isn’t better.","_n":"3p175","_k":"903a41e0"},{"t":"She is below her needs","why":"She’s above the UL.","_n":"3q185","_k":"cfcb3fae"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Using model MET values (swimming 6, walking 4), which session uses more activity energy for the same person: 45 minutes of swimming or 60 minutes of walking?","options":[{"t":"You can’t compare different activities","why":"MET-minutes make them comparable.","_n":"3r155","_k":"ae269c64"},{"t":"They’re equal","why":"270 ≠ 240.","_n":"3s165","_k":"4ae1a8fe"},{"t":"Swimming: 270 MET-minutes vs 240","why":"6 × 45 = 270 and 4 × 60 = 240.","_n":"3t1b5","_k":"15554b62"},{"t":"Walking, because it lasts longer","why":"Intensity matters too: 6 × 45 = 270.","_n":"3u1c5","_k":"6e2080c1"}]},"b":{"prompt":"Using model MET values (cycling 8, yoga 3), which uses more activity energy: 30 minutes of cycling or 50 minutes of yoga?","options":[{"t":"Yoga, because it lasts longer","why":"3 × 50 = 150.","_n":"3v154","_k":"4d4b75c3"},{"t":"You can’t compare them","why":"MET-minutes make them comparable.","_n":"3w144","_k":"9a2143b7"},{"t":"They’re equal","why":"240 ≠ 150.","_n":"3x134","_k":"34e565d7"},{"t":"Cycling: 240 MET-minutes vs 150","why":"8 × 30 = 240 and 3 × 50 = 150.","_n":"3y124","_k":"0925ce10"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which statement best compares Brazil’s dietary guidelines with Canada’s Food Guide?","options":[{"t":"“They disagree completely.”","why":"They share core advice.","_n":"3z194","_k":"8b10496b"},{"t":"“Brazil’s guide is only about vitamins.”","why":"It’s about whole diets and eating habits.","_n":"40184","_k":"eff3e4d9"},{"t":"“Both emphasize mostly minimally processed foods and enjoying meals with others; Brazil organizes much of its advice around how processed foods are.”","why":"It names what the two share and how Brazil’s differs.","_n":"41174","_k":"1f427070"},{"t":"“Brazil’s guide is wrong because it has no plate.”","why":"Different shapes, similar evidence: more plants, fewer highly processed foods, eating together.","_n":"42164","_k":"7d0bb839"}]},"b":{"prompt":"Japan’s spinning-top food guide includes a figure running on the top. What idea does that communicate?","options":[{"t":"“Running is the only healthy activity.”","why":"It’s a symbol, not a rule.","_n":"431d4","_k":"ccc3bb7e"},{"t":"“Physical activity keeps the diet ‘in balance’, just as spinning keeps the top upright.”","why":"The running figure links eating with being active.","_n":"441c4","_k":"1c0d2c69"},{"t":"“Food doesn’t matter if you’re active.”","why":"Both matter.","_n":"450f4","_k":"0572bc35"},{"t":"“The guide is for athletes only.”","why":"It’s for the general population.","_n":"46104","_k":"3ecc98bb"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the clearest, most accurate description of energy balance?","options":[{"t":"“Energy balance tells you whether someone is healthy.”","why":"It’s one factor among many; health isn’t a single number.","_n":"47114","_k":"ce67736f"},{"t":"“Energy balance is only about exercise.”","why":"Intake and BMR are part of it.","_n":"48124","_k":"66ba462b"},{"t":"“Energy balance compares the energy taken in from food and drink with the energy used for basal metabolism, digesting food and activity; it shifts from day to day, and bodies adapt.”","why":"It names intake, all three parts of expenditure, and that the balance shifts and bodies adapt.","_n":"49134","_k":"ee394ccc"},{"t":"“Energy balance means eating the same number of calories every day.”","why":"Expenditure has three parts and changes with activity, growth and body composition; bodies adapt, and one day decides nothing.","_n":"4a144","_k":"83799470"}]},"b":{"prompt":"Which best explains why two 35-year-olds can have different energy needs?","options":[{"t":"“Needs depend on body size and composition, activity, sex and other factors, so they differ between people.”","why":"Needs differ from person to person.","_n":"4b154","_k":"ea96c9f5"},{"t":"“Only exercise changes needs.”","why":"BMR differs too.","_n":"4c164","_k":"69e80d14"},{"t":"“Needs depend only on how much someone eats.”","why":"Expenditure has three parts and changes with activity, growth and body composition; bodies adapt, and one day decides nothing.","_n":"4d174","_k":"8462f5b2"},{"t":"“Everyone the same age has the same needs.”","why":"Expenditure has three parts and changes with activity, growth and body composition; bodies adapt, and one day decides nothing.","_n":"4e184","_k":"a9d72428"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A family wants to lower the sodium in their fried rice without losing flavour. Which change fits best?","options":[{"t":"Replace the rice with instant noodles and their seasoning","why":"The seasoning packet is often very high in sodium.","_n":"4fa14","_k":"c19b07b2"},{"t":"Remove all vegetables","why":"Vegetables add flavour, fibre and nutrients.","_n":"4ga04","_k":"6aa34b96"},{"t":"Add more regular soy sauce","why":"That raises sodium.","_n":"4ha34","_k":"49d3baa2"},{"t":"Use lower-sodium soy sauce and add more vegetables and aromatics such as garlic and ginger","why":"It cuts the biggest source of sodium, and the vegetables and aromatics keep the flavour.","_n":"4ia24","_k":"69b00e99"}]},"b":{"prompt":"A pasta recipe uses white pasta and a cream sauce. Which change best follows the guide?","options":[{"t":"Use whole wheat pasta and add vegetables to the sauce","why":"A whole grain and more vegetables move it toward the plate.","_n":"4ja54","_k":"bdc517ed"},{"t":"Double the pasta","why":"That doesn’t change its type or add vegetables.","_n":"4ka44","_k":"0982b176"},{"t":"Use more cream","why":"That adds saturated fat.","_n":"4la74","_k":"50f096ca"},{"t":"Add sugar to the sauce","why":"That adds free sugars.","_n":"4ma64","_k":"f3ec05e6"}]}},{"id":"a2","cat":"A","goal":1,"a":{"prompt":"A café wants to follow the guide’s advice on drinks. Which change fits best?","options":[{"t":"Remove water to sell more drinks","why":"Water is the guide’s drink of choice.","_n":"4n994","_k":"ff53ecda"},{"t":"Add sports drinks for everyone","why":"Not needed for most people.","_n":"4o984","_k":"2daf1ade"},{"t":"Offer only juice, since it’s fruit","why":"Whole fruit keeps its fibre; juice is a concentrated source of free sugars. The guide recommends water.","_n":"4p1b4","_k":"90d65633"},{"t":"Offer free tap water and unsweetened milk prominently, with sugary drinks not the default","why":"Water is the guide’s drink of choice, and unsweetened milk is a healthy option too.","_n":"4q1c4","_k":"bd1053d4"}]},"b":{"prompt":"A school cafeteria wants to follow the guide’s protein advice. Which change fits best?","options":[{"t":"Offer protein bars instead of meals","why":"Whole foods and meals are preferred.","_n":"4r194","_k":"9cda301e"},{"t":"Serve only processed meats","why":"The guide suggests limiting highly processed foods.","_n":"4s1a4","_k":"0ccd4c63"},{"t":"Remove all protein foods","why":"Protein foods are a quarter of the plate.","_n":"4t174","_k":"a76d7c42"},{"t":"Offer plant-based protein options more often, such as lentil soup, bean chili and tofu bowls","why":"The guide suggests choosing plant-based protein foods more often.","_n":"4u184","_k":"c13a884b"}]}}]},"task":{"title":"Rui’s plate","summary":"Rui’s plate","statement":"\u003cp>Rui, 67, is lacto-ovo vegetarian, lives on a fixed income, and his doctor has reminded him about calcium and vitamin D. Build one lunch plate that meets every condition. Can you find three different plates?\u003c/p>","rows":[{"id":"v","t":"Two different vegetables or fruits (fill half the plate)","pick":2,"items":[{"id":
