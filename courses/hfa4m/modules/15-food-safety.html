.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}

--risk-mod:#93AEFF;--risk-fixed:#A8B7AC;--fs-clean:#7FD3F5;--fs-separate:#C9A8FF;--fs-cook:#FF9F5A;--fs-chill:#93AEFF;
--sys-stage:#E5ECE4;--sys-emis:#D8D08F;--sys-waste:#FF9F5A;
--nu-carb-soft:rgba(255,159,90,.18);--nu-protein-soft:rgba(244,154,200,.17);--nu-fat-soft:rgba(95,208,205,.17);--nu-micro-soft:rgba(201,168,255,.17);
--nu-water-soft:rgba(147,174,255,.17);--leaf-soft:rgba(168,201,138,.18);--plate-grain-soft:rgba(216,208,143,.17)}
.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}
.hfa-nft tr.cal th{font-size:1.15rem;font-weight:700}
.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 15: hero (thermometer bands, doubling tray, step icons), Kitchen detective (scene with hotspots, dot tray and band
   strip, thermometer check), Outbreak investigation (attack-rate table, paired bars, pathogen cards), decisions set, potluck plan.
   Food-safety step colours from hfa4u.css: clean --fs-clean (cerulean), separate --fs-separate (violet), cook --fs-cook (orange),
   chill --fs-chill (blue); always with an icon and the word. Temperature bands: cold --p-t tint, danger zone --hi-soft, hot --p-k
   tint, each with its word. Red and green appear only in feedback marks (✓/✗ with words). */
/* radio groups and switches (from HFA4U 12) */
.fs-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.fs-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:4.2rem}
.fs-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.fs-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fs-chipset button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%}
.fs-chipset button:hover:not(:disabled){border-color:var(--pen)}
.fs-chipset button[aria-checked="true"],.fs-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fs-chipset button:disabled{opacity:.6}
.fs-chipset button[aria-checked="true"]:disabled{opacity:.9}
.fs-sw{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;min-height:40px;font-size:.92rem}
.fs-sw:hover{border-color:var(--pen)}
.fs-swt{position:relative;flex:0 0 auto;width:38px;height:22px;border-radius:999px;border:2px solid var(--ink-2);background:var(--paper)}
.fs-swt i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.fs-sw[aria-checked="true"]{border-color:var(--ink)}
.fs-sw[aria-checked="true"] .fs-swt{background:var(--hi);border-color:var(--ink)}
.fs-sw[aria-checked="true"] .fs-swt i{left:18px;background:var(--ink)}
.fs-swl{flex:1 1 auto;min-width:0}
.fs-swv{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-2);min-width:1.8rem;text-align:right}
.fs-sw[aria-checked="true"] .fs-swv{color:var(--ink)}
.fs-h4{margin:0 0 6px;font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fs-h5{margin:12px 0 6px;font-size:.95rem}
.fs-lit{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi);border-radius:4px}

/* step icons and colours */
.fs-ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:-.2em}
.fs-c-clean{color:var(--fs-clean)}.fs-c-separate{color:var(--fs-separate)}.fs-c-cook{color:var(--fs-cook)}.fs-c-chill{color:var(--fs-chill)}.fs-c-none{color:var(--ink-2)}
.fs-stp{display:inline-flex;align-items:center;gap:5px}

/* hero */
.fs-hero{width:100%}
.fs-hsvg{display:block;width:100%;height:auto;max-height:440px}
.fs-hhot{fill:var(--p-k);fill-opacity:.2}
.fs-hdz{fill:var(--hi-soft)}
.fs-hcold{fill:var(--p-t);fill-opacity:.22}
.fs-hglass{fill:none;stroke:var(--ink);stroke-width:2.5}
.fs-htick{stroke:var(--ink);stroke-width:2}
.fs-hlab{fill:var(--ink);font:700 18px var(--font-ui)}
.fs-hhotx{fill:var(--p-k)}.fs-hcoldx{fill:var(--p-t)}
.fs-hsub{fill:var(--ink-2);font:400 15px var(--font-ui)}
.fs-htray{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:2}
.fs-hlink{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 5}
.fs-hcnt{fill:var(--ink);font:700 19px var(--font-ui)}
.fs-hcnt .off{fill-opacity:.35;font-weight:400}
.fs-hcnt .on{fill:var(--ink);font-size:22px}
.fs-hdot{fill:var(--ink)}
.fs-hcap{fill:var(--ink-2);font:400 15px var(--font-ui)}
.fs-hstep{fill:currentColor;font:700 16px var(--font-ui)}
.fs-hsvg.nw .fs-hlab{font-size:15px}.fs-hsvg.nw .fs-hsub{font-size:13px}.fs-hsvg.nw .fs-hcnt{font-size:16px}.fs-hsvg.nw .fs-hcnt .on{font-size:18px}.fs-hsvg.nw .fs-hcap{font-size:13px}

/* Explore layout */
.fs-lab{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:16px 24px;align-items:start}
.fs-main,.fs-side{min-width:0}
.fs-side{border-left:1.5px solid var(--rule);padding-left:18px}
.fs-about{margin-top:14px}
.fs-rules{margin:6px 0;padding-left:1.2em}
.fs-rules li{margin:0 0 4px}

/* Mode A: scene */
.fs-zoomw{display:none;margin:0 0 8px}
.fs-scroll{overflow-x:auto;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper)}
.fs-scene{position:relative;width:100%;min-width:0}
.fs-scene.zoom{width:200%}
.fs-ssvg{display:block;width:100%;height:auto}
.fs-wall{fill:var(--paper)}
.fs-floor{fill:var(--rule)}
.fs-win{fill:var(--info-bg);stroke:var(--ink-2);stroke-width:2.5}
.fs-ln{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round}
.fs-unit{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5}
.fs-hdl{fill:none;stroke:var(--ink-2);stroke-width:6;stroke-linecap:round}
.fs-disp{fill:var(--sheet);stroke:var(--ink);stroke-width:2.5}
.fs-dtx{fill:var(--ink);font:700 20px var(--font-ui)}
.fs-wood,.fs-ctop{fill:var(--p-b);fill-opacity:.45;stroke:var(--ink-2);stroke-width:1.5}
.fs-can{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.fs-canl{fill:var(--p-t);fill-opacity:.25}
.fs-box{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5}
.fs-tl{fill:var(--ink);font:700 13px var(--font-ui)}
.fs-tls{fill:var(--ink);font:700 7.5px var(--font-ui)}
.fs-milk{fill:var(--sheet);stroke:var(--pen);stroke-width:2.5}
.fs-board{fill:var(--p-b);fill-opacity:.3;stroke:var(--ink-2);stroke-width:2}
.fs-chick{fill:var(--nu-protein-soft);stroke:var(--nu-protein);stroke-width:2}
.fs-leaf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:2}
.fs-tom{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:2}
.fs-blade{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.8;stroke-linejoin:round}
.fs-knife{fill:var(--ink-2)}
.fs-bowl{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5}
.fs-arm{fill:none;stroke:var(--ink-2);stroke-width:14;stroke-linecap:round}
.fs-hand{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5}
.fs-juice{fill:var(--nu-protein)}
.fs-plate{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.fs-bun{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:1.8}
.fs-patty{fill:var(--p-b);stroke:var(--ink-2);stroke-width:1.5}
.fs-cloth{fill:var(--info-bg);stroke:var(--pen);stroke-width:2}
.fs-ban{fill:var(--hi);stroke:var(--ink-2);stroke-width:1.8}
.fs-basin{fill:var(--ink-2);fill-opacity:.5}
.fs-tap{fill:none;stroke:var(--ink-2);stroke-width:5;stroke-linecap:round}
.fs-soap{fill:var(--p-t);fill-opacity:.35;stroke:var(--ink-2);stroke-width:2}
.fs-pin{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink);background:var(--sheet);color:var(--ink);font:700 .95rem/1 var(--font-ui);padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:1}
.fs-pin:hover{background:var(--hi-soft)}
.fs-pin[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi),0 0 0 5px var(--ink)}
.fs-pin.tagged{border-width:3.5px}
.fs-pintag{position:absolute;right:-12px;top:-12px;background:var(--sheet);border:1.5px solid currentColor;border-radius:6px;padding:1px;line-height:0}
.fs-b-clean{border-color:var(--fs-clean)!important}.fs-b-clean .fs-pintag{color:var(--fs-clean)}
.fs-b-separate{border-color:var(--fs-separate)!important}.fs-b-separate .fs-pintag{color:var(--fs-separate)}
.fs-b-cook{border-color:var(--fs-cook)!important}.fs-b-cook .fs-pintag{color:var(--fs-cook)}
.fs-b-chill{border-color:var(--fs-chill)!important}.fs-b-chill .fs-pintag{color:var(--fs-chill)}
.fs-b-none{border-color:var(--ink-2)!important}.fs-b-none .fs-pintag{color:var(--ink-2)}
.fs-pick{margin:12px 0 6px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:10px;min-height:48px}
.fs-pickt{margin:0 0 8px}
.fs-pickact{margin-top:4px}
.fs-listh{margin:10px 0 6px}
.fs-spots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fs-spotb{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1.5px solid var(--rule);border-left-width:5px;background:var(--sheet);color:var(--ink);border-radius:8px;padding:5px 8px;min-height:38px;font-size:.9rem}
.fs-spotb[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink)}
.fs-sn{flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.fs-sname{flex:1 1 auto;min-width:0}
.fs-stag{flex:0 0 auto;font-size:.85rem}

/* Mode B: tray, band strip, controls */
.fs-trayw{position:relative;margin:4px 0 6px}
canvas.plot.fs-tray{border:1.5px solid var(--rule);border-radius:10px}
.fs-trayo{position:absolute;inset:0;pointer-events:none;font-size:.88rem;display:flex;flex-direction:column;justify-content:space-between;padding:8px}
.fs-trtop,.fs-trbot{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:flex-start}
.fs-trbot{align-items:flex-end}
.fs-trayo span.fs-tc,.fs-trayo span.fs-tb,.fs-trayo span.fs-tx{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:2px 8px;max-width:100%}
.fs-tc b{font-size:1.15rem}
.fs-tb{font-weight:700}
.fs-band-cold{color:var(--p-t)}.fs-band-hot{color:var(--p-k)}
.fs-tx{font-size:.8rem}
.fs-tx.on{font-weight:700;border:2px solid var(--ink)!important;background:var(--hi)!important;color:var(--hi-ink)}
.fs-tm{margin-left:auto;background:var(--sheet)}
.fs-hex{fill:none;stroke:currentColor;stroke-width:2;vertical-align:-.15em;margin-right:4px}
.fs-toxt{display:inline-block;font-size:.72rem;font-weight:700;border:1px dashed currentColor;border-radius:4px;padding:0 .35em;margin-left:2px;vertical-align:.08em}
.fs-bandw{margin:26px 0 14px;padding:0 4px}
.fs-band{position:relative;display:flex;height:30px;border:1.5px solid var(--ink-2);border-radius:6px;overflow:visible}
.fs-band>span{display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;min-width:0;overflow:hidden;white-space:nowrap}
.fs-band .cold{background:color-mix(in srgb,var(--p-t) 20%,transparent);color:var(--p-t);border-radius:5px 0 0 5px}
.fs-band .dz{background:var(--hi-soft);color:var(--ink)}
.fs-band .hot{background:color-mix(in srgb,var(--p-k) 18%,transparent);color:var(--p-k);border-radius:0 5px 5px 0}
.fs-mark{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.fs-mark b{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-size:.78rem;white-space:nowrap;background:var(--sheet);padding:0 3px;border-radius:3px}
.fs-cool{position:absolute;top:50%;height:0;border-top:3px solid var(--ink)}
.fs-cool::before{content:"";position:absolute;left:-2px;top:-8px;border:6.5px solid transparent;border-right:9px solid var(--ink);border-left:0}
.fs-ticks{position:relative;height:18px;font-size:.75rem;color:var(--ink-2)}
.fs-ticks span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}
.fs-ticks span:first-child{transform:none}
.fs-ticks span:last-child{transform:translateX(-100%)}
.fs-toxnote{margin:-4px 0 10px;min-height:0}
.fs-toxnote:empty{display:none}
.fs-numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.fs-numrow label{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.fs-bigt{margin:0 0 8px;font-weight:700}
.fs-mt{font-size:.8rem;color:var(--ink-2);font-weight:400}
[aria-checked="true"] .fs-mt{color:inherit}
#fs-rh{margin-top:4px}

/* Mode C: thermometer */
.fs-thw{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:10px;align-items:center;margin:4px 0 10px;border:1.5px solid var(--rule);border-radius:10px;padding:8px;background:var(--paper)}
.fs-fsvg{display:block;width:100%;height:auto}
.fs-crust{fill:var(--p-b);fill-opacity:.85;stroke:var(--ink-2);stroke-width:2}
.fs-patb{fill:var(--p-b);fill-opacity:.55}
.fs-patp{fill:var(--nu-carb-soft)}
.fs-meat{fill:var(--nu-protein-soft);stroke:var(--ink-2);stroke-width:2.5}
.fs-bone{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5}
.fs-bonein{fill:none;stroke:var(--ink-2);stroke-width:7;stroke-linecap:round;stroke-opacity:.45}
.fs-fish{fill:var(--nu-carb-soft);stroke:var(--ink-2);stroke-width:2.5}
.fs-dish{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5}
.fs-fill{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:1.5}
.fs-probe{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.fs-ptip{fill:var(--ink)}
.fs-phead{fill:var(--sheet);stroke:var(--ink);stroke-width:2.5}
.fs-ftl{fill:var(--ink);font:700 14px var(--font-ui)}
.fs-dial{display:flex;flex-direction:column;gap:2px;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;background:var(--sheet);min-width:0}
.fs-dial b{font-size:1.7rem;line-height:1.1}
.fs-vd{font-size:.88rem;font-weight:700}
.fs-vd.ok{color:var(--green)}.fs-vd.no{color:var(--red)}

/* Part 3 */
.fs-stok{font-weight:700}
.fs-st{margin-top:8px}
table.fs-ar{position:relative;border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
.fs-ar th,.fs-ar td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:middle}
.fs-ar thead th{font-size:.82rem;color:var(--ink-2)}
.fs-arin{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.fs-arin input.numin{width:4.6em}
.fs-arc.ok input{border-color:var(--green)}
.fs-arc.no input{border-color:var(--red)}
.fs-armk{font-size:1rem}
.fs-arc.ok .fs-armk{color:var(--green)}.fs-arc.no .fs-armk{color:var(--red)}
.fs-arf{margin:14px 0 0}
.fs-arleg{display:flex;gap:14px;font-size:.85rem;margin:0 0 6px}
.fs-arleg span{display:inline-flex;align-items:center;gap:6px}
.fs-arleg i,.fs-arb{display:inline-block}
.fs-arleg i{width:22px;height:12px;border-radius:3px}
.fs-arleg i.a,.fs-arb.a{background:var(--pen)}
.fs-arleg i.n,.fs-arb.n{background:repeating-linear-gradient(135deg,var(--ink-2) 0 3px,transparent 3px 6px);border:1.5px solid var(--ink-2)}
.fs-arbars{display:grid;gap:10px}
.fs-arrow{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr);gap:10px;align-items:center}
.fs-arl{font-size:.9rem;font-weight:700;display:flex;flex-direction:column}
.fs-arl small{font-weight:400;color:var(--ink-2)}
.fs-arbw{display:grid;gap:3px}
.fs-arb{height:16px;border-radius:3px;position:relative;min-width:2px}
.fs-arb b{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);font-size:.8rem;white-space:nowrap}
.fs-arq{margin-top:14px}
.fs-notes{border-left:4px solid var(--ink-2);background:var(--info-bg);border-radius:6px;padding:4px 14px 6px;margin:0 0 10px}
.fs-notes ul{margin:0;padding-left:1.2em}
.fs-bugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:10px}
.fs-bug{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px 10px;background:var(--sheet);display:flex;flex-direction:column}
.fs-bug .fs-h5{margin:2px 0 6px}
.fs-bug dl{margin:0 0 8px;font-size:.88rem;flex:1 1 auto}
.fs-bug dl div{margin:0 0 4px}
.fs-bug dt{font-weight:700;color:var(--ink-2);font-size:.8rem}
.fs-bug dd{margin:0}
.fs-bug.right{border-color:var(--green);border-width:2.5px}
.fs-bug.wrong{border-color:var(--red);border-width:2.5px}
.fs-sys .fs-h5:first-of-type{margin-top:4px}

/* Practice: decisions set */
.fs-dg{display:flex;flex-direction:column;gap:4px;margin:6px 0 8px}

/* Task: potluck plan */
.fs-tklist{margin:6px 0 10px;padding-left:1.4em}
.fs-tin>div{margin:0 0 4px}
.fs-tin .fs-rgw{flex-direction:column;align-items:flex-start;gap:4px}
.fs-tpv{display:grid;gap:12px}
.fs-tkstrip{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fs-tks{display:grid;grid-template-columns:4.2rem minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;border:1.5px solid var(--rule);border-left:6px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--sheet)}
.fs-tks small{grid-column:2 / 4;color:var(--ink-2);font-size:.82rem}
.fs-tkn{font-weight:700;font-size:.85rem;color:var(--ink-2)}
.fs-tkc{font-size:.9rem;min-width:0}
.fs-tkb{font-size:.75rem;font-weight:700;border-radius:999px;padding:.05em .6em;border:1.5px solid currentColor;white-space:nowrap}
.fs-tk-cold{border-left-color:var(--p-t)}.fs-tk-cold .fs-tkb{color:var(--p-t)}
.fs-tk-hot{border-left-color:var(--p-k)}.fs-tk-hot .fs-tkb{color:var(--p-k)}
.fs-tk-dz{border-left-color:var(--hi);background:var(--hi-soft)}.fs-tk-dz .fs-tkb{color:var(--ink)}
.fs-tk-slow{border-left-color:var(--ink-2)}.fs-tk-slow .fs-tkb{color:var(--ink-2)}
.fs-tent{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--ink);border-radius:8px;padding:10px 12px;background:var(--sheet);text-align:center;max-width:22rem}
.fs-tentd{font-weight:700}
.fs-tentc{font-size:.95rem}
.fs-kcw{border-top:1.5px solid var(--rule);padding-top:10px}

@media (max-width:820px){
  .fs-lab{grid-template-columns:minmax(0,1fr)}
  .fs-side{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:10px}
}
@media (max-width:640px){
  .fs-zoomw{display:block}
  .fs-pin{width:28px;height:28px;font-size:.85rem;border-width:2px}
  .fs-pintag{display:none}
  .fs-scene.zoom .fs-pintag{display:block}
  .fs-spots{grid-template-columns:minmax(0,1fr)}
  .fs-thw{grid-template-columns:minmax(0,1fr)}
  .fs-arrow{grid-template-columns:minmax(0,1fr)}
  canvas.plot.fs-tray{aspect-ratio:4/3}
  .fs-trayo{font-size:.78rem;padding:6px}
}

 & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"1ef28bdc","content":{"id":"15-food-safety","kind":"topic","title":"Foodborne illness and food safety","topic":"Foodborne Illness and Food Safety","readyTopic":"foodborne illness and food safety","hero":{"eq":"Clean · Separate · Cook · Chill","eqSize":"sm","eqLabel":"clean, separate, cook, chill","headline":"Time plus temperature equals risk.","text":"Most \u003cstrong>foodborne illness\u003c/strong> is preventable. Bacteria multiply fastest in the \u003cstrong>danger zone\u003c/strong>, between 4 °C and 60 °C. Four habits keep food safe: \u003cstrong>clean\u003c/strong>, \u003cstrong>separate\u003c/strong>, \u003cstrong>cook\u003c/strong> and \u003cstrong>chill\u003c/strong>. A \u003cstrong>food thermometer\u003c/strong> settles every argument about doneness.","fig":{"html":"\u003cdiv class=\"fs-hero\" id=\"fs-hero\">\u003c/div>","caption":""},"aria":"A thermometer with three bands: cold, 4 °C or colder; the danger zone, 4 °C to 60 °C; and hot, 60 °C or hotter. A tray of bacteria in the danger zone doubles at each tick: 1, 2, 4, 8. Every 20 minutes, in ideal conditions (model). Then the four steps appear: clean, separate, cook and chill.","model":"Every 20 minutes, in ideal conditions (model)","bands":{"cold":"Cold","dz":"Danger zone","hot":"Hot"}},"goals":["I can state safe food temperatures (the danger zone, fridge and freezer, and safe internal cooking temperatures).","I can explain the causes, sources and symptoms of common foodborne illnesses, and who is most at risk.","I can apply clean, separate, cook and chill, plus personal hygiene, to prevent contamination and allergen cross-contact.","I can use a time-and-temperature growth model to make food-safety decisions.","I can analyse outbreak data to identify a likely source.","I can identify kitchen accidents and choose the correct first response."],"start":{"blocks":[{"title":"Before you start","html":"\u003cp>The bacteria growth model and the outbreak data in this module are \u003cstrong>model data\u003c/strong>: made up for teaching. Safe temperatures follow Health Canada’s guidance. Health information here is general, not advice for any particular person. For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Hygiene and handwashing","goal":3,"prompt":"How long should you scrub your hands with soap before rinsing?","options":[{"t":"At least 20 seconds","why":"About the time it takes to hum ‘Happy Birthday’ twice.","_n":"03e2","_k":"e53bc215"},{"t":"2 seconds","why":"Too short to lift germs.","_n":"13f2","_k":"ea6d41f0"},{"t":"Hand sanitizer always replaces washing","why":"Soap and water work better on greasy or visibly dirty hands, and on some germs.","_n":"2402","_k":"d00af8d0"},{"t":"Only if they look dirty","why":"Germs are invisible.","_n":"3412","_k":"08625e40"}],"hints":["Longer than a quick rinse.","Think of a short song.","At least 20 seconds."]},{"id":"w2","skill":"Hygiene and handwashing","goal":3,"prompt":"When must you wash your hands while cooking?","options":[{"t":"After touching raw meat, poultry, fish or eggs, and before touching ready-to-eat food","why":"That’s when germs could move from raw food to ready-to-eat food.","_n":"4422","_k":"622bde57"},{"t":"Only at the start","why":"Raw-food germs get on your hands mid-recipe.","_n":"5432","_k":"321e47fc"},{"t":"Only at the end","why":"Too late; you’ve already spread germs.","_n":"6442","_k":"41ce6ef0"},{"t":"Never, if you wear gloves","why":"Gloves carry germs too, and must be changed.","_n":"7452","_k":"48eea110"}],"hints":["When could germs move from one food to another?","Raw to ready-to-eat.","After raw, before ready-to-eat."]},{"id":"w3","skill":"Storage basics","goal":1,"prompt":"What temperature should a refrigerator be?","options":[{"t":"0 °C exactly","why":"Colder than needed; 4 °C or colder is the rule.","_n":"8462","_k":"cddc298c"},{"t":"4 °C or colder","why":"Just below the danger zone, which starts at 4 °C.","_n":"92ab","_k":"d6248b37"},{"t":"−18 °C","why":"That’s the freezer.","_n":"a29b","_k":"b046e224"},{"t":"10 °C","why":"That’s inside the danger zone.","_n":"b28b","_k":"8fc24ab2"}],"hints":["Just below the danger zone.","The danger zone starts at 4 °C.","4 °C or colder."]},{"id":"w4","skill":"Storage basics","goal":4,"prompt":"Leftovers should go into the fridge within…","options":[{"t":"6 hours","why":"Far too long in the danger zone.","_n":"c27b","_k":"da4869d0"},{"t":"Only once they’re cold","why":"Waiting to cool on the counter is the problem; use shallow containers.","_n":"d2eb","_k":"4a9539d5"},{"t":"The next morning","why":"Overnight at room temperature is unsafe.","_n":"e2db","_k":"22730531"},{"t":"2 hours of cooking","why":"Less time in the danger zone.","_n":"f2cb","_k":"b74f1b76"}],"hints":["Think of the danger zone.","Short.","Within 2 hours."]},{"id":"w5","skill":"Illness basics","goal":2,"prompt":"Which is a common symptom of foodborne illness?","options":[{"t":"Better appetite","why":"Usually the opposite.","_n":"g2bb","_k":"06b50a75"},{"t":"A broken bone","why":"Unrelated.","_n":"h32b","_k":"e6a55ac1"},{"t":"Diarrhea, cramps and vomiting","why":"Foodborne pathogens mostly affect the digestive tract.","_n":"i31b","_k":"a6bad268"},{"t":"Only a rash","why":"A rash can signal an allergy, a different problem.","_n":"j30c","_k":"e85a995a"}],"hints":["Where does food go?","The digestive tract.","Digestive symptoms."]},{"id":"w6","skill":"Allergen labels","goal":3,"prompt":"A label says ‘May contain peanuts’. What does that warn about?","options":[{"t":"Peanuts are a main ingredient","why":"Main ingredients are in the ingredient list.","_n":"k31c","_k":"3918336a"},{"t":"Possible cross-contact with peanuts during production","why":"Peanuts could get in from shared equipment.","_n":"l2ec","_k":"67886dfd"},{"t":"The food is peanut-free","why":"The opposite.","_n":"m2fc","_k":"2c002c70"},{"t":"Nothing; it’s marketing","why":"It’s a real precaution for people with allergies.","_n":"n2cc","_k":"8318d71e"}],"hints":["‘May contain’ means possible.","From shared equipment.","Cross-contact."]}],"refreshers":{"Hygiene and handwashing":"Soap, at least 20 seconds, rinse and dry; after raw food, after the washroom, before ready-to-eat food.","Storage basics":"Fridge 4 °C or colder; freezer −18 °C or colder; refrigerate within 2 hours.","Illness basics":"Pathogens (bacteria, viruses, parasites) cause digestive symptoms; some cause serious illness.","Allergen labels":"Priority allergens appear in the ingredient list or a ‘Contains’ statement; ‘May contain’ warns of cross-contact."}}},"explore":{"heading":"Kitchen detective","intro":"Find the hazards, race the danger-zone clock, and check doneness the right way.","modes":[{"id":"hazard","t":"Spot the hazard"},{"id":"clock","t":"Danger-zone clock"},{"id":"thermo","t":"Thermometer check"}],"steps":[{"id":"clean","t":"Clean"},{"id":"separate","t":"Separate"},{"id":"cook","t":"Cook"},{"id":"chill","t":"Chill"},{"id":"none","t":"Not a hazard"}],"rows":{"found":"Hazards found","temp":"Temperature","time":"Time in danger zone","count":"Model count","reheat":"After reheating","food":"Food","reading":"Reading","probe":"Probe position","verdict":"Verdict"},"scene":{"how":"Tap a numbered spot, then choose the step that fixes it, or “Not a hazard”.","spots":[{"id":"s1","n":5,"short":"Cutting board","aria":"Raw chicken on cutting board beside salad","t":"Raw chicken on the same cutting board as salad vegetables, with one knife","_a":"akcVV0gDFgJFAERv"},{"id":"s2","n":6,"short":"Hand in the salad","aria":"The cook’s hand touching salad","t":"The cook touches salad right after handling raw chicken","_a":"akcFXl0DCkFs"},{"id":"s3","n":4,"short":"Milk carton","aria":"Milk carton on the counter","t":"A milk carton left on the counter","_a":"akcFWlEOCEFs"},{"id":"s4","n":1,"short":"Fridge thermometer","aria":"Fridge thermometer","t":"The fridge thermometer reads 8 °C","_a":"akcFWlEOCEFs"},{"id":"s5","n":7,"short":"Cut-open burger","aria":"Burger cut open on a plate","t":"A burger “checked” by cutting it to look at the colour","_a":"akcFXVcJRj4="},{"id":"s6","n":8,"short":"Dishcloth","aria":"Dishcloth beside the plates","t":"One dishcloth used for raw meat juice, then for plates","_a":"akcFXl0DCkEdRxVXSAMWAkUARG8="},{"id":"s7","n":9,"short":"Bananas","aria":"Bananas on the counter","t":"Bananas on the counter","_a":"akcIXVYHRj4="},{"id":"s8","n":3,"short":"Bread box","aria":"Bread box on the shelf","t":"A loaf of bread in a bread box","_a":"akcIXVYHRj4="},{"id":"s9","n":10,"short":"Handwashing sink","aria":"Handwashing sink with soap","t":"A handwashing sink with soap","_a":"akcIXVYHRj4="},{"id":"s10","n":2,"short":"Canned beans","aria":"Canned beans in the pantry","t":"Canned beans in the pantry","_a":"akcIXVYHRj4="}]},"clock":{"label":"Model data: a teaching model","foods":[{"id":"salad","t":"Chicken salad"},{"id":"stew","t":"Leftover stew"},{"id":"rice","t":"Cooked rice","tox":true},{"id":"pastry","t":"Cream pastry","tox":true}],"toxin":"Some bacteria make toxins that heat doesn’t destroy.","reheat":"Then reheat to 74 °C","reheated":"Most bacteria killed by the heat.","toxinStays":"Most bacteria killed, but the toxin they made stays.","rules":["Between 4 °C and 60 °C, the count doubles at each full 20 minutes.","At 4 °C or colder, and at 60 °C or hotter, there’s no change.","A “toxin-former” tag on some foods (cooked rice, a cream pastry) notes: “Some bacteria make toxins that heat doesn’t destroy.”","Reheating to 74 °C kills most of the bacteria in the picture, but toxins already made on a toxin-former stay."],"note":"The doubling model is simplified: real growth depends on the organism, the food and the conditions.","big":{"t":"Big batch: a large pot of chili cools from 60 °C to 4 °C. Starting count 100.","methods":[{"id":"counter","t":"Deep pot on the counter overnight","min":600},{"id":"fridge","t":"Deep pot straight into the fridge","min":360},{"id":"shallow","t":"Divide into shallow containers, then fridge","min":120},{"id":"ice","t":"Ice-water bath, then shallow containers","min":60}]}},"thermo":{"foods":[{"id":"gbeef","t":"Ground beef, pork, veal or lamb (burgers, sausages)","short":"ground beef","safe":71,"shape":"patty"},{"id":"gpoul","t":"Ground poultry","short":"ground poultry","safe":74,"shape":"patty"},{"id":"piece","t":"Poultry pieces","short":"poultry pieces","safe":74,"shape":"leg","bone":true},{"id":"whole","t":"Whole poultry","short":"whole poultry","safe":82,"shape":"bird","bone":true},{"id":"pork","t":"Pork chops and roasts","short":"pork chops and roasts","safe":71,"shape":"chop","bone":true},{"id":"fish","t":"Fish","short":"fish","safe":70,"shape":"fish"},{"id":"egg","t":"Egg dishes","short":"egg dishes","safe":74,"shape":"dish"},{"id":"left","t":"Leftovers and casseroles","short":"leftovers and casseroles","safe":74,"shape":"dish"}],"probes":[{"id":"thick","t":"Thickest part"},{"id":"bone","t":"Near bone"},{"id":"surface","t":"Surface"}],"safe":"Safe: {s} °C reached ({f})","notYet":"Not yet safe: needs {s} °C","move":{"bone":"Not a reliable reading: bone can give a false reading. Put the probe in the thickest part, away from bone.","surface":"Not a reliable reading: the surface heats first. Put the probe in the thickest part."},"brown":"Looks done: brown inside","tableTitle":"Safe internal temperatures (Health Canada, n.d.-c)"},"predictions":[{"id":"p1","prompt":"Chicken salad at 22 °C, starting count 100. After 2 hours on the counter, about how many bacteria are there (model)?","options":[{"t":"200","_n":"o2dc","_k":"b48ab1f0"},{"t":"600","_n":"p2ac","_k":"fb5035ba"},{"t":"1200","_n":"q2bc","_k":"e57a1ea8"},{"t":"6400","_n":"r38c","_k":"badf3e7d"}],"explain":"2 hours = 6 doublings: 100 × 64 = 6400. Growth multiplies; it doesn’t add."},{"id":"p2","prompt":"The same salad in the fridge at 4 °C. After 2 hours in the fridge?","options":[{"t":"3200","_n":"s39c","_k":"38e083ba"},{"t":"About 100: little or no growth in this model","_n":"tb6c","_k":"abbb907a"},{"t":"0 (the cold kills them)","_n":"ub5c","_k":"20c099f7"},{"t":"6400","_n":"vb8c","_k":"d12b1fc9"}],"explain":"Cold slows growth. It doesn’t kill bacteria, and a few, like \u003ci>Listeria\u003c/i>, still grow slowly in real fridges."},{"id":"p3","prompt":"Cooked rice (a toxin-former) was left out all day, then reheated to 74 °C. Is it safe now?","options":[{"t":"Not necessarily: some bacteria leave heat-stable toxins","_n":"wb7c","_k":"ac7161c4"},{"t":"Yes, reheating kills everything","_n":"xbac","_k":"f460dfe2"},{"t":"No, rice is never safe","_n":"yb9c","_k":"2cb77997"},{"t":"Yes, if it smells fine","_n":"zbcc","_k":"21204f1a"}],"explain":"Reheating kills many bacteria but not every toxin they’ve made. Cool and refrigerate rice promptly."},{"id":"p4","prompt":"A burger with brown meat inside. Is it safely cooked?","options":[{"t":"Yes, if the juices run clear","_n":"10bbc","_k":"f163bea6"},{"t":"No, burgers can’t be made safe","_n":"11aec","_k":"26490849"},{"t":"You can’t tell by colour; check that it reaches 71 °C","_n":"12adc","_k":"b27f5534"},{"t":"Yes, brown means done","_n":"13bcc","_k":"cd463c0c"}],"explain":"Ground meat can brown early. A thermometer is the only reliable test."}],"challenges":[{"id":"tc1","goal":3,"prompt":"Spot the hazard: find all 6 food-safety hazards and assign each a correct step, without flagging anything that isn’t a hazard.","why":"All six hazards have a step that fixes them, and nothing safe is flagged.","msgs":{"bananas":"Whole bananas are fine at room temperature.","chill":"Colour-checking is a cooking-doneness problem: use a thermometer.","fridge":"8 °C is inside the danger zone; the fridge should be 4 °C or colder.","none":"Tap a numbered spot, then choose a step. No hazards are tagged yet.","decoy":"{name} isn’t a food-safety hazard. Leave it untagged, or tag it “Not a hazard”.","step":"One of your tags names a step that doesn’t fix that hazard. Check each tag against what’s wrong.","count":"{n} of 6 hazards have a correct step so far. Keep looking."},"hints":["Look for raw meat touching ready-to-eat food.","Check every temperature you can see.","The six hazards and their steps: chicken on the salad board → Separate; the hand in the salad after raw chicken → Clean; the milk on the counter → Chill; the fridge at 8 °C → Chill; the burger checked by colour → Cook; one dishcloth for meat juice and plates → Clean or Separate."]},{"id":"tc2","goal":4,"prompt":"Danger-zone clock: leftover stew starts at 100 (model). It must stay below 1000 before it’s refrigerated. What’s the longest time it can sit at 22 °C?","why":"60 minutes is 3 doublings: 100 × 8 = 800, the last count under 1000.","msgs":{"m80":"1600, which is past 1000.","m120":"6400. The 2-hour rule is an upper limit for real food; this model stew needs less.","m40":"Safe (400), but not the longest; 60 min gives 800.","setup":"Set the clock for the leftover stew: starting count 100, temperature 22 °C.","clockMode":"Use the danger-zone clock (not big-batch mode).","low":"Safe ({n}), but not the longest.","high":"{n}, which is past 1000."},"hints":["Double every 20 minutes: 200, 400, 800, 1600…","Which is the last count under 1000?","800, at 60 minutes."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Danger-zone clock, big-batch mode: a large pot of chili at 60 °C must be cooled to 4 °C. Starting count 100. Choose a cooling method that keeps the count under 10 000.","why":"Big batches cooled slowly are a classic cause of \u003ci>Clostridium perfringens\u003c/i> illness. Shallow containers cool fast.","msgs":{"fridge":"6 h = 18 doublings: over 26 million. Big pots cool too slowly, even in the fridge.","counter":"10 hours in the danger zone.","setup":"Switch the clock to big-batch mode, then choose a cooling method."},"hints":["Convert each time to doublings: 20 minutes each.","2 h = 6 doublings (6400); 6 h = 18 doublings (far over).","Shallow containers, or an ice bath and shallow containers."]}],"blocks":[{"title":"What the kitchen detective shows","html":"\u003cul>\u003cli>Time and temperature multiply risk.\u003c/li>\u003cli>Cold slows but doesn’t kill.\u003c/li>\u003cli>Only a thermometer proves doneness.\u003c/li>\u003cli>Separate and clean stop germs travelling.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"outbreak","name":"Outbreak","heading":"Outbreak investigation","intro":"Work like a public-health investigator. Compare who ate what at a potluck, match the symptoms and timing to a pathogen, then see how Canada’s real system tracks outbreaks.","stations":[{"id":"rates","t":"1. The potluck"},{"id":"bugs","t":"2. Symptoms and timing"},{"id":"system","t":"3. The real system"}],"potluck":{"title":"Station 1: The potluck","text":"Forty people attended a community potluck; 20 became ill. Fill in the attack rates (% ill) for each food.","how":"Attack rate = ill ÷ total × 100. Round to the nearest whole number.","heads":["Food","Ate: ill / total","Ate: % ill","Didn’t eat: ill / total","Didn’t eat: % ill"],"foods":[{"id":"turkey","t":"Turkey with gravy","ate":[18,24],"not":[2,16]},{"id":"green","t":"Green salad","ate":[10,20],"not":[10,20]},{"id":"potato","t":"Potato salad","ate":[8,16],"not":[12,24]},{"id":"fruit","t":"Fruit tray","ate":[6,15],"not":[14,25]}],"msgs":{"empty":"Fill in all eight boxes first, such as 50.","ok":"All eight attack rates are right.","off":"{n} of 8 rates need another look (marked ✗). Attack rate = ill ÷ total × 100.","count":"Some boxes hold the number of people who were ill. Divide by the total, then × 100."},"rule":"The suspect food is the one with the largest gap between eaters and non-eaters.","chart":"% ill: ate the food vs didn’t eat it","ask":"Which food is the likely source?","_a":"ExETQFMHHUE=","pickFb":{"turkey":"75% vs 12.5%: the biggest gap.","green":"50% vs 50%: no difference.","potato":"50% vs 50%: no difference.","fruit":"Eaters were ill \u003cem>less\u003c/em> often."}},"bugs":{"title":"Station 2: Symptoms and timing","notesTitle":"Case notes","notes":["Symptoms started about 8–16 hours after the meal.","Cramps and diarrhea; little vomiting; no fever.","The turkey was cooked the night before in one large roaster, cooled on the stove, and reheated on low."],"ask":"Which pathogen card fits every clue?","rows":{"src":"Typical sources","onset":"Onset","sym":"Symptoms"},"cards":[{"id":"salm","t":"\u003ci>Salmonella\u003c/i>","src":"Poultry and eggs","onset":"About 6–72 hours","sym":"Diarrhea, cramps and fever; sometimes vomiting","fb":"Turkey can carry \u003ci>Salmonella\u003c/i>, but it usually brings a fever, and these cases had none. Check the cooling clue too."},{"id":"noro","t":"Norovirus","src":"Ill food handlers","onset":"About 12–48 hours","sym":"Sudden vomiting, diarrhea and cramps","fb":"Norovirus usually brings a lot of vomiting and spreads from ill food handlers. These cases had little vomiting."},{"id":"perf","t":"\u003ci>Clostridium perfringens\u003c/i>","src":"Large batches cooled slowly (meat, poultry, gravy, stews)","onset":"About 8–16 hours","sym":"Cramps and diarrhea; vomiting and fever are uncommon","fb":"Every clue fits: onset in 8–16 hours, cramps and diarrhea with little vomiting and no fever, and one large roaster cooled slowly on the stove."},{"id":"list","t":"\u003ci>Listeria\u003c/i>","src":"Deli meats and unpasteurized cheese; grows in the fridge","onset":"Days to weeks (about 3–70 days)","sym":"Fever and muscle aches; can be severe in pregnancy, for older adults and for people with weakened immune systems","fb":"\u003ci>Listeria\u003c/i> takes days to weeks to cause illness, not 8–16 hours."},{"id":"botu","t":"\u003ci>Clostridium botulinum\u003c/i>","src":"Improperly home-canned low-acid foods","onset":"About 12–36 hours","sym":"Blurred or double vision, trouble swallowing, muscle weakness: a medical emergency","fb":"Botulism affects the nerves (vision, swallowing, muscle strength) and comes from improperly home-canned low-acid foods. These cases had cramps and diarrhea."}],"_a":"ExUDQF5A","after":"Onset ranges from hours to weeks, depending on the pathogen."},"system":{"title":"Station 3: Check it with data, the real system","items":[{"h":"How Canada detects and investigates outbreaks","html":"Labs identify the pathogen from ill people’s samples and compare its genetic “fingerprint”. When matching cases turn up, provincial public health and the Public Health Agency of Canada investigate together, asking ill people what they ate, just as you compared eaters and non-eaters (Public Health Agency of Canada, n.d.)."},{"h":"How recalls work","html":"When a food is linked to illness, or another hazard such as an undeclared allergen is found, the Canadian Food Inspection Agency traces the product and issues a recall and a public warning (Canadian Food Inspection Agency, n.d.)."},{"h":"What to do with a recalled product","html":"Don’t eat it, even if it looks and smells fine. Return it or throw it out, as the notice instructs."},{"h":"Why reporting illness helps","html":"Each reported case is a data point. The more cases investigators can link, the faster they find the source and stop others from getting sick."}],"link":"In the potluck, the attack rates pointed to the turkey. Investigators use the same comparison with many more cases."},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Canadian Food Inspection Agency. (n.d.). \u003ci>Food recall warnings and allergy alerts\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.-a). \u003ci>Causes of food poisoning\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.-b). \u003ci>Common food allergens\u003c/i>. Government of Canada.\u003c/li>\u003cli>Health Canada. (n.d.-c). \u003ci>Safe internal cooking temperatures chart\u003c/i>. Government of Canada.\u003c/li>\u003cli>Public Health Agency of Canada. (n.d.). \u003ci>Canada’s foodborne illness outbreak response protocol\u003c/i>. Government of Canada.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"Outbreak quick check","summary":"Outbreak quick check","items":[{"id":"q1","goal":5,"prompt":"Attack rate among turkey eaters?","choices":[{"t":"24%","fb":"18 ill out of 24 who ate it.","_n":"14bdc","_k":"a6c39ed0"},{"t":"75%","fb":"Right. 18 ill out of 24 who ate it.","_n":"15bec","_k":"f3a427ff"},{"t":"18%","fb":"18 ill out of 24 who ate it.","_n":"16bfc","_k":"17986c70"},{"t":"45%","fb":"18 ill out of 24 who ate it.","_n":"17b8c","_k":"4f0c4b77"}]},{"id":"q2","goal":5,"prompt":"Why isn’t green salad the suspect?","choices":[{"t":"It’s healthy","fb":"50% vs 50%: no difference.","_n":"18b9c","_k":"7b465bc1"},{"t":"Few people ate it","fb":"50% vs 50%: no difference.","_n":"19bac","_k":"0d00e2cc"},{"t":"It was cold","fb":"50% vs 50%: no difference.","_n":"1abbc","_k":"3cc62b63"},{"t":"Same % ill whether eaten or not","fb":"Right. 50% vs 50%: no difference.","_n":"1bb4c","_k":"69bd5a5d"}]},{"id":"q3","goal":[2,5],"prompt":"Symptoms began 12 hours after the meal. Why can’t you just blame breakfast that morning?","choices":[{"t":"Onset depends on the pathogen; this one fits the potluck","fb":"Right. Onset times vary by pathogen.","_n":"1cb5c","_k":"3fa2d991"},{"t":"You can’t know anything","fb":"Onset times vary by pathogen.","_n":"1dc2c","_k":"cbfa3da9"},{"t":"Breakfast is always safe","fb":"Onset times vary by pathogen.","_n":"1ec1c","_k":"dc316c87"},{"t":"Symptoms start instantly","fb":"Onset times vary by pathogen.","_n":"1fc0c","_k":"8bcb14a5"}]},{"id":"q4","goal":5,"prompt":"A recall notice matches a product in your fridge. Best action?","choices":[{"t":"Smell-test it","fb":"Recalled food may look and smell fine.","_n":"1gbfc","_k":"79539145"},{"t":"Give it away","fb":"Recalled food may look and smell fine.","_n":"1hbec","_k":"0f785b0d"},{"t":"Don’t eat it; follow the notice to return or discard it","fb":"Right. Recalled food may look and smell fine.","_n":"1ibdc","_k":"56e2a506"},{"t":"Cook it longer","fb":"Recalled food may look and smell fine.","_n":"1jbcc","_k":"c6202aa9"}]}]}},"practice":{"activities":[{"id":"accidents","type":"match","title":"Kitchen accident ↔ first response","summary":"Accident ↔ first response","goal":6,"instruction":"Match each kitchen situation to its first response. Three cards on the right have no partner. \u003cstrong>This isn’t first-aid training:\u003c/strong> a certified first-aid course teaches these skills properly.","leftTitle":"Situation","rightTitle":"First response","left":[{"id":"l1","t":"Grease fire in a pan"},{"id":"l2","t":"Minor burn from a hot pan"},{"id":"l3","t":"Small cut from a knife"},{"id":"l4","t":"Fire inside the oven"},{"id":"l5","t":"Liquid spilled on the floor"},{"id":"l6","t":"A knife slipping off the counter"},{"id":"l7","t":"Someone in contact with a sparking appliance","hints":["What happens if you touch someone in contact with current?","You can be shocked too.","Cut the power first, if safe."]},{"id":"l8","t":"Cleaning product splashed in an eye"}],"right":[{"id":"r1","t":"Turn off the heat, cover with a lid; never water. If it spreads, get out and call 911"},{"id":"r2","t":"Cool under cool running water; no ice, butter or creams"},{"id":"r3","t":"Firm pressure with a clean cloth, then a bandage; seek care if deep"},{"id":"r4","t":"Keep the door closed and turn off the oven"},{"id":"r5","t":"Wipe it up immediately and warn others"},{"id":"r6","t":"Step back and let it fall; never catch it"},{"id":"r7","t":"Don’t touch them; cut the power at the source if safe, and call for help"},{"id":"r8","t":"Flush with lukewarm running water and get help"},{"id":"rw","t":"Throw water on it"},{"id":"ri","t":"Put ice on it"},{"id":"rc","t":"Catch it before it lands"}],"_a":"SkcKAxpYRhEAR0oQVFBGWRMXVBAUQAhQE19EQAtASEFdUUQIGhBQQR1HCgcaWEYRBEdKEFRURlkTF1AQFEAIVBNfREAPQEhBXV1ECBoQXEFM","wrong":{"l1|rw":"Water makes burning oil spatter and spread.","l1|r2":"Water makes burning oil spatter and spread.","l1|r8":"Water makes burning oil spatter and spread.","l4|rw":"Water makes burning oil spatter and spread.","l2|ri":"Ice can damage skin further.","l6|rc":"Catching a falling knife causes deep cuts."},"wrongDefault":"Ask what stops this hazard without creating a new one."},{"id":"decisions","type":"custom","title":"Food-safety decisions","summary":"Food-safety decisions","star":true,"goal":[1,2,3,4],"instruction":"Six decisions. The ★ items are non-routine: name a risk, plan a fair test, put a routine in order.","how":"Type a number and press Check, or tap your choices. Units like °C are optional.","items":[{"id":"d1","kind":"num","goal":4,"prompt":"Model: start 25, 22 °C for 1 hour 40 minutes. Count?","_a":"CVVW","label":"Count","wrong":[{"match":400,"fb":"1 h 40 min = 5 doublings: 25 × 32."}],"wrongDefault":"Count the 20-minute blocks, then double that many times.","why":"1 h 40 min = 5 doublings: 25 × 32 = 800.","hints":["How many 20-minute blocks are in 1 h 40 min?","5.","25 × 2⁵ = 800."]},{"id":"d2","kind":"num","goal":1,"prompt":"Safe internal temperature for whole poultry?","_a":"CVc=","unit":"°C","label":"Temperature","wrong":[{"match":74,"fb":"That’s for pieces."}],"wrongDefault":"Check the safe internal temperature table in Explore.","why":"Whole poultry needs 82 °C."},{"id":"d3","kind":"chips","star":true,"goal":1,"prompt":"A fridge reads 7 °C. Name the risk and the fix.","groups":[{"id":"risk","label":"Risk","choices":[{"t":"In the danger zone: bacteria can multiply","_n":"1kbbc","_k":"c2421ad2"},{"t":"Too cold: food will freeze","_n":"1lbac","_k":"0b91dded"},{"t":"No risk: 7 °C is cold enough","_n":"1mb9c","_k":"ae744038"}]},{"id":"fix","label":"Fix","choices":[{"t":"Lower the setting to 4 °C or colder","_n":"1n28c","_k":"f9777ecd"},{"t":"Raise the setting","_n":"1o29c","_k":"cc5f0776"},{"t":"Leave it; eat food sooner","_n":"1p26c","_k":"71e6802a"}]}],"fb":"7 °C lets bacteria multiply.","why":"In the danger zone; lower the setting to 4 °C or colder."},{"id":"d4","kind":"chips","star":true,"goal":2,"prompt":"Which group is at highest risk from \u003ci>Listeria\u003c/i>?","groups":[{"id":"who","label":"Group","choices":[{"t":"Teen athletes","_n":"1q27c","_k":"43d481f6"},{"t":"Office workers","_n":"1r2cc","_k":"9f27da21"},{"t":"Young adults","_n":"1s2dc","_k":"b4e3a147"},{"t":"Pregnant people","_n":"1t2ac","_k":"eff4ae72"}]}],"fb":"\u003ci>Listeria\u003c/i> can cross the placenta.","why":"Pregnant people (also older adults and people with weakened immune systems)."},{"id":"d5","kind":"chips","star":true,"inquiry":true,"goal":3,"prompt":"Plan a fair test: does washing hands for 20 seconds reduce bacteria more than 5 seconds? Pick the independent variable, the dependent variable and one controlled variable.","groups":[{"id":"iv","label":"Independent variable","choices":[{"t":"Washing time","_n":"1u2bc","_k":"2b591a34"},{"t":"Bacterial colonies on a swab plate","_n":"1v30c","_k":"e5dba7c5"},{"t":"Same soap and water temperature","_n":"1w31c","_k":"ee3e03bd"},{"t":"How clean the hands look","_n":"1x2ec","_k":"af328b2d"},{"t":"A different soap for each washing time","_n":"1y2dc","_k":"d1e09b99"}]},{"id":"dv","label":"Dependent variable","choices":[{"t":"Washing time","_n":"1z30c","_k":"19750669"},{"t":"Bacterial colonies on a swab plate","_n":"202fc","_k":"ae2d4620"},{"t":"Same soap and water temperature","_n":"212ac","_k":"672bc54d"},{"t":"How clean the hands look","_n":"2229c","_k":"f0819646"},{"t":"A different soap for each washing time","_n":"232cc","_k":"58015c6d"}]},{"id":"cv","label":"Controlled variable","choices":[{"t":"Washing time","_n":"242bc","_k":"a43b5cab"},{"t":"Bacterial colonies on a swab plate","_n":"2536c","_k":"aae40ac9"},{"t":"Same soap and water temperature","_n":"2635c","_k":"e7f339b2"},{"t":"How clean the hands look","_n":"2734d","_k":"1437ca30"},{"t":"A different soap for each washing time","_n":"2835d","_k":"003aa23a"}]}],"fb":"Change only the washing time; keep everything else the same.","why":"IV: washing time · DV: bacterial colonies on a swab plate · Control: same soap and water temperature."},{"id":"d6","kind":"order","star":true,"goal":3,"prompt":"A peanut-free table at a bake sale: put the steps in order.","steps":["Wash hands","Clean the surface with hot soapy water","Use separate utensils","Label the ‘Contains’ allergens","Store the peanut-free items apart"],"start":[3,1,4,0,2],"fb":"Cleaning and separating come before serving and labelling.","why":"Wash hands → clean the surface with hot soapy water → use separate utensils → label the ‘Contains’ allergens → store the peanut-free items apart."}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Oluwaseun","goal":[3,4],"how":"","instruction":"Oluwaseun made one mistake in each plan. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Prepare frozen chicken thighs for dinner.","steps":["“Take the chicken out of the freezer in the morning.”","“Leave it on the counter all day to thaw.”","“Cook it until the juices look clear.”","“Serve with salad.”"],"_a":"AA==","stepFb":["Step 1 is fine.","","Step 3 is also unsafe, but the first mistake is earlier.","The salad isn’t the issue."],"fixes":[{"t":"“It’s fine because it’s frozen at first.”","why":"The outside warms into the danger zone while the inside is still frozen. Thaw in the fridge, in cold water, or in the microwave and then cook right away.","_n":"2936d","_k":"03e960f0"},{"t":"“Thaw in warm water.”","why":"Warm water puts the outside in the danger zone.","_n":"2a37d","_k":"5f555e89"},{"t":"“Thaw it in the fridge (or in cold water changed every 30 minutes), then cook to 74 °C, checked with a thermometer.”","why":"The outside warms into the danger zone while the inside is still frozen. Thaw in the fridge, in cold water, or in the microwave and then cook right away.","_n":"2b38d","_k":"da06ef8e"},{"t":"Step 2 is correct.","why":"Counter thawing warms the outside into the danger zone.","_n":"2c39d","_k":"7ebf4a59"}],"hints":["Where does the outside of the chicken sit all day?","In the danger zone.","Thaw in the fridge."]},{"id":"e2","goal":4,"task":"Store a big pot of leftover rice and beans.","steps":["“Turn off the stove after dinner.”","“Leave the full pot on the stove overnight to cool.”","“Put it in the fridge in the morning.”","“Reheat it to 74 °C at lunch, so it’s safe.”"],"_a":"AA==","stepFb":["Step 1 is fine.","","Too late; the mistake was before this.","Reheating doesn’t remove heat-stable toxins."],"fixes":[{"t":"“Within 2 hours, divide it into shallow containers and refrigerate.”","why":"Some bacteria make toxins that heat doesn’t destroy. Cool food fast to begin with.","_n":"2d3ad","_k":"938981ad"},{"t":"“Reheat it longer tomorrow.”","why":"Some bacteria make toxins that heat doesn’t destroy. Cool food fast to begin with.","_n":"2e3bd","_k":"873f1110"},{"t":"“Put the full hot pot in the freezer.”","why":"A big pot still cools slowly, and it warms the freezer.","_n":"2f2cd","_k":"cdcd1499"},{"t":"Step 2 is correct.","why":"Hours in the danger zone let bacteria grow and make toxins.","_n":"2g2dd","_k":"1c0b9203"}],"hints":["How long does a big pot spend in the danger zone overnight?","Many hours.","Shallow containers, into the fridge within 2 hours."]},{"id":"e3","goal":3,"task":"Make a nut-free lunch after making a peanut butter sandwich.","steps":["“Make the peanut butter sandwich first.”","“Wipe the knife on a paper towel.”","“Use the same knife to spread jam for the nut-free sandwich.”","“Pack both in the same bag.”"],"_a":"AA==","stepFb":["Order doesn’t matter if cleanup is right.","","This follows from the inadequate cleaning in step 2.","Also a cross-contact risk."],"fixes":[{"t":"Step 2 is correct.","why":"Wiping leaves peanut protein behind.","_n":"2h3ad","_k":"77eb763e"},{"t":"“Rinse the knife under cold water.”","why":"Wash with hot, soapy water. Wiping spreads residue.","_n":"2i39d","_k":"4f2d1aaf"},{"t":"“Wash the knife and board with hot, soapy water (or use clean ones), wash hands, and pack the nut-free sandwich separately.”","why":"Wash with hot, soapy water. Wiping spreads residue.","_n":"2j38d","_k":"9562e8f6"},{"t":"“Wipe twice.”","why":"Wash with hot, soapy water. Wiping spreads residue.","_n":"2k37d","_k":"c6a2952f"}],"hints":["Does wiping remove allergen proteins?","No; it smears them.","Wash, or use clean tools; pack separately."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>Health information here is general, not advice for any particular person. For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"What surprised you most: the doubling clock, the colour myth, or the outbreak data?"},{"id":"j2","q":"In your own 003c/i>","why":"Linked to deli meats and soft cheese.","_n":"2xea0","_k":"b6186cfc"},{"t":"Norovirus","why":"Linked to ill food handlers.","_n":"2ye90","_k":"5c7f3ab9"},{"t":"\u003ci>Clostridium botulinum\u003c/i> (botulism)","why":"Botulism comes from improperly home-canned low-acid foods; it’s a medical emergency.","_n":"2zdc0","_k":"a6a2c6f8"},{"t":"\u003ci>E. coli\u003c/i> O157:H7","why":"Linked to undercooked ground beef.","_n":"30db0","_k":"2983f12f"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"‘Use one cutting board for raw meat and another for vegetables.’ Which step is this?","options":[{"t":"Cook","why":"Not about temperature.","_n":"31de0","_k":"1f960d51"},{"t":"Chill","why":"Not about cold storage.","_n":"32df0","_k":"3f268899"},{"t":"Clean","why":"Cleaning is washing; this is keeping foods apart.","_n":"33dc0","_k":"b00336ad"},{"t":"Separate","why":"Separating keeps raw meat away from ready-to-eat food.","_n":"34dd0","_k":"8135836a"}]},"b":{"prompt":"‘Check the burger with a food thermometer.’ Which step is this?","options":[{"t":"Separate","why":"Separating keeps foods apart; this is checking doneness.","_n":"35da0","_k":"11a50ca1"},{"t":"Chill","why":"Not about cold storage.","_n":"36db0","_k":"e522dbe9"},{"t":"Cook","why":"Colour isn’t reliable: a burger can brown before it’s safe. Use a thermometer: 71 °C for ground beef.","_n":"37d80","_k":"6a652ea5"},{"t":"Clean","why":"Cleaning is washing; this is checking doneness.","_n":"38d90","_k":"47e48fbc"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Model: a dish starts with 50 bacteria and sits at 25 °C for 1 hour 20 minutes. How many now?","options":[{"t":"200","why":"That’s adding, not doubling.","_n":"39e60","_k":"65660a29"},{"t":"400","why":"That’s 3 doublings.","_n":"3ae70","_k":"87973180"},{"t":"800","why":"4 doublings: 50 × 16.","_n":"3bd80","_k":"b026b2e4"},{"t":"1600","why":"That’s 5 doublings.","_n":"3cd70","_k":"35720129"}]},"b":{"prompt":"Model: a dish starts with 200 bacteria and sits at 30 °C for 1 hour. How many now?","options":[{"t":"600","why":"That’s adding, not doubling.","_n":"3dd60","_k":"af1bf41f"},{"t":"800","why":"That’s 2 doublings.","_n":"3ed50","_k":"d3a8bbe5"},{"t":"1600","why":"3 doublings: 200 × 8.","_n":"3fdc0","_k":"260ef3ab"},{"t":"3200","why":"That’s 4 doublings.","_n":"3gdb0","_k":"43aafb18"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Potluck data (model): turkey eaters 18/24 ill, non-eaters 2/16; salad eaters 10/20, non-eaters 10/20; fruit eaters 6/15, non-eaters 14/25. Which food is the most likely source?","options":[{"t":"Fruit","why":"Eaters were ill \u003cem>less\u003c/em> often.","_n":"3hda0","_k":"29bdc194"},{"t":"Salad","why":"50% vs 50%: no difference.","_n":"3id90","_k":"cc591285"},{"t":"Can’t tell","why":"The attack-rate gap points clearly to turkey.","_n":"3je00","_k":"4e538ac4"},{"t":"Turkey","why":"75% vs 12.5%: the biggest gap.","_n":"3kdf0","_k":"1f8fb703"}]},"b":{"prompt":"Picnic data (model): chicken skewers eaters 12/18 ill, non-eaters 3/12; rice eaters 8/16, non-eaters 7/14; cake eaters 6/14, non-eaters 9/16. Most likely source?","options":[{"t":"Cake","why":"Eaters were ill \u003cem>less\u003c/em> often.","_n":"3l520","_k":"f35ed914"},{"t":"Rice","why":"50% vs 50%.","_n":"3m530","_k":"11966038"},{"t":"Chicken skewers","why":"About 67% vs 25%: the biggest gap.","_n":"3n540","_k":"91e262d7"},{"t":"Can’t tell","why":"The gap identifies the skewers.","_n":"3o550","_k":"5fe37d38"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Why do health agencies warn pregnant people specifically about deli meats and unpasteurized soft cheeses?","options":[{"t":"Fridges kill \u003ci>Listeria\u003c/i>, so it’s only room-temperature foods","why":"Cold slows most bacteria, but \u003ci>Listeria\u003c/i> can grow at fridge temperatures.","_n":"3p560","_k":"58552824"},{"t":"These foods can carry \u003ci>Listeria\u003c/i>, which grows in the fridge and can harm the fetus","why":"Cold slows most bacteria, but \u003ci>Listeria\u003c/i> can grow at fridge temperatures.","_n":"3q570","_k":"f58426f3"},{"t":"These foods cause allergies","why":"Not the main concern here.","_n":"3r580","_k":"8992b7e4"},{"t":"These foods are high in calories","why":"Not the safety issue.","_n":"3s590","_k":"8a45d530"}]},"b":{"prompt":"Cooked rice sat out all day, then was reheated to 74 °C. Why might it still make people sick?","options":[{"t":"Some bacteria form toxins that reheating doesn’t destroy","why":"Some bacteria make toxins that heat doesn’t destroy. Cool food fast to begin with.","_n":"3t5a0","_k":"3e35d54c"},{"t":"74 °C is too cold to kill bacteria","why":"74 °C is the leftover target; the problem is toxins.","_n":"3u5b0","_k":"212dcb81"},{"t":"Reheating adds new bacteria","why":"Not how it works.","_n":"3v5c1","_k":"d4ede2a0"},{"t":"Rice is always unsafe","why":"Rice is safe if it’s cooled promptly.","_n":"3w5b1","_k":"e6f77a9c"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which explanation best tells a friend why a brown burger might still be unsafe?","options":[{"t":"“Pink means it’s always unsafe.”","why":"Colour isn’t reliable either way.","_n":"3x5e1","_k":"a5b2e204"},{"t":"“Ground meat can turn brown before it reaches a safe temperature. Only a thermometer reading of 71 °C shows it’s safe.”","why":"Colour isn’t reliable: a burger can brown before it’s safe. Use a thermometer: 71 °C for ground beef.","_n":"3y5d1","_k":"cc7752d3"},{"t":"“Brown means it’s done.”","why":"Colour isn’t reliable: a burger can brown before it’s safe. Use a thermometer: 71 °C for ground beef.","_n":"3z581","_k":"e18e5a97"},{"t":"“Cut it in half and look closer.”","why":"Colour isn’t reliable: a burger can brown before it’s safe. Use a thermometer: 71 °C for ground beef.","_n":"40571","_k":"63ea893f"}]},"b":{"prompt":"Which instruction for thawing a turkey is clearest and safest?","options":[{"t":"“Thaw it in hot water.”","why":"Warms the surface into the danger zone.","_n":"415a1","_k":"60929a54"},{"t":"“Leave it on the counter overnight.”","why":"The outside warms into the danger zone while the inside is still frozen. Thaw in the fridge, in cold water, or in the microwave and then cook right away.","_n":"42591","_k":"b9917447"},{"t":"“Thaw it in the fridge, allowing about a day for every few kilograms, and keep it on a tray on the bottom shelf.”","why":"The fridge keeps every part of the turkey out of the danger zone, and the tray stops juices dripping onto other food.","_n":"43641","_k":"1d58fd95"},{"t":"“Cook it frozen, until it looks done.”","why":"Colour isn’t reliable: a burger can brown before it’s safe. Use a thermometer: 71 °C for ground beef.","_n":"44631","_k":"5610a66e"}]}},{"id":"c2","cat":"C","goal":[3,6],"a":{"prompt":"Which is the best explanation of allergen cross-contact?","options":[{"t":"“Only eating the allergen directly matters.”","why":"Traces can cause reactions.","_n":"45561","_k":"cd00a52f"},{"t":"“Tiny amounts of an allergen can move to another food through shared tools, surfaces or hands, and can trigger a reaction, so wash tools with hot soapy water or use separate ones.”","why":"Traces can cause reactions, so wash, don’t wipe.","_n":"46571","_k":"da33324e"},{"t":"“Wiping the knife is enough.”","why":"Wash with hot, soapy water. Wiping spreads residue.","_n":"47541","_k":"35e068f3"},{"t":"“Cooking destroys allergens.”","why":"Heat doesn’t remove most allergen proteins.","_n":"48551","_k":"c706e9f1"}]},"b":{"prompt":"Which is the best instruction for a grease fire in a pan?","options":[{"t":"“Throw water on it.”","why":"Water makes burning oil spatter and spread. Turn off the heat and cover with a lid.","_n":"495a1","_k":"79dfe74c"},{"t":"“Turn off the heat and slide a lid over the pan. Never use water. If it spreads, leave and call 911.”","why":"Water makes burning oil spatter and spread. Turn off the heat and cover with a lid.","_n":"4a5b1","_k":"921e9424"},{"t":"“Fan it to cool it.”","why":"Feeds the fire with air.","_n":"4b581","_k":"f83107aa"},{"t":"“Carry the pan outside.”","why":"Spills burning oil.","_n":"4c591","_k":"c34ca49e"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A caterer cooks 20 L of soup for tomorrow’s event. Which plan is safest?","options":[{"t":"Put the full pot straight in the fridge","why":"Big pots cool too slowly.","_n":"4d5e1","_k":"7536ab85"},{"t":"Divide it into shallow containers, cool quickly (an ice bath helps), and refrigerate within 2 hours; reheat to 74 °C tomorrow","why":"Shallow containers cool fast, an ice bath speeds cooling, and 74 °C is the reheating target.","_n":"4e5f1","_k":"2486009c"},{"t":"Keep it at 40 °C all night","why":"That’s in the danger zone.","_n":"4f701","_k":"aa7b7408"},{"t":"Leave the pot on the stove overnight","why":"Hours in the danger zone. Some bacteria make toxins that heat doesn’t destroy. Cool food fast to begin with.","_n":"4g6f1","_k":"5f813c88"}]},"b":{"prompt":"A class picnic will last 4 hours on a hot day. Which plan keeps the chicken salad safe?","options":[{"t":"Keep it in a cooler with ice packs at 4 °C or colder, take out only what’s served, and discard anything left out more than 2 hours (1 hour above 32 °C)","why":"Cold food stays cold, and the time limit caps how long anything sits in the danger zone.","_n":"4h6e1","_k":"67a1703b"},{"t":"Leave it on the table all afternoon","why":"Hours in the danger zone.","_n":"4i6d1","_k":"d4f033f4"},{"t":"Cover it with a cloth in the sun","why":"Still in the danger zone.","_n":"4j6c1","_k":"94c60c5c"},{"t":"Add extra mayonnaise","why":"That doesn’t change the time and temperature risk.","_n":"4k6b1","_k":"3c606310"}]}},{"id":"a2","cat":"A","goal":[5,6],"a":{"prompt":"You learn that a brand of frozen berries in your freezer has been recalled for possible norovirus. What should you do?","options":[{"t":"Cook them in a smoothie","why":"Blending doesn’t cook; follow the recall.","_n":"4l6a1","_k":"54f2c5e0"},{"t":"Keep them frozen; freezing kills viruses","why":"Freezing doesn’t kill norovirus.","_n":"4m691","_k":"c9d2dd39"},{"t":"Don’t eat them; follow the recall instructions to return or discard them, and wash any surfaces they touched","why":"Recalled food may look and smell fine.","_n":"4n681","_k":"75ad0988"},{"t":"Eat them if they look fine","why":"Contamination isn’t visible.","_n":"4o671","_k":"8684b31d"}]},"b":{"prompt":"During a class cooking lab, a student’s sleeve catches a hot burner and the student burns a hand. Best first response?","options":[{"t":"Apply butter","why":"It traps heat.","_n":"4pea1","_k":"ef2c9f75"},{"t":"Keep cooking and check it later","why":"Burns need cooling right away.","_n":"4qeb1","_k":"6cc48237"},{"t":"Turn off the burner, cool the burn under cool running water, and tell the teacher","why":"Stop the heat, cool the burn right away, and get help.","_n":"4rec1","_k":"20780d66"},{"t":"Put ice on it","why":"Ice can damage skin.","_n":"4sed1","_k":"ce995c67"}]}}]},"task":{"title":"Safe potluck plan","summary":"Safe potluck plan","statement":"\u003cp>You’re bringing a chicken and rice casserole with a creamy sauce (milk, wheat flour) to a school potluck. Build a plan that meets every food-safety condition. There’s more than one safe plan. Can you find them all?\u003c/p>\u003col class=\"fs-tklist\">\u003cli>Thaw the chicken safely.\u003c/li>\u003cli>Cook to a safe internal temperature.\u003c/li>\u003cli>Keep it out of the danger zone on the way there.\u003c/li>\u003cli>Cool the leftovers fast.\u003c/li>\u003cli>Label the allergens correctly.\u003c/li>\u003c/ol>","checks":["Thawed safely","Cooked to a safe temperature","Out of the danger zone in transit","Leftovers cooled fast","Allergens labelled"],"tips":["Counter thawing puts the outside in the danger zone.","Poultry mixtures need 74 °C.","Hot food stays hot (60 °C or hotter), or cold food stays cold (4 °C or colder) and is reheated.","Deep pots cool too slowly.","Check the recipe: the sauce has milk; the flour is wheat."],"explainPrompt":"Explain how your plan keeps the casserole out of the danger zone at every stage, and why the allergen card matters at a potluck.","vocab":"Use the words danger zone, internal temperature, cross-contact and shallow containers.","checkLabel":"Check my plan","success":"This plan meets every food-safety condition.","more":"There’s more than one safe plan. Can you find another?","after3":"There are 12 safe plans. Every one keeps the food out of the danger zone at each stage: thaw, cook, carry, store.","rows":[{"id":"thaw","t":"Thaw","stage":"Thaw","opts":[{"id":"fridge","t":"Fridge","short":"fridge"},{"id":"water","t":"Cold water changed every 30 min","short":"cold water"},{"id":"counter","t":"Counter","short":"counter"},{"id":"micro","t":"Microwave, then cook right away","short":"microwave then cook"}]},{"id":"temp","t":"Final internal temperature","stage":"Cook","opts":[{"id":"63","t":"63 °C","short":"63 °C"},{"id":"71","t":"71 °C","short":"71 °C"},{"id":"74","t":"74 °C","short":"74 °C"},{"id":"82","t":"82 °C","short":"82 °C"}]},{"id":"move","t":"Transport","stage":"Carry","opts":[{"id":"hot","t":"Insulated hot carrier (kept at 60 °C or hotter)","short":"hot carrier"},{"id":"room","t":"Room temperature for 3 h","short":"room temperature 3 h"},{"id":"cool","t":"Cooler at 4 °C or colder, then reheated to 74 °C on site","short":"cooler then reheat"}]},{"id":"left","t":"Leftovers","stage":"Store","opts":[{"id":"shallow","t":"Shallow containers in the fridge within 2 h","short":"shallow containers"},{"id":"deep","t":"Deep pot in the fridge","short":"deep pot"},{"id":"out","t":"Left out overnight","short":"left out overnight"}]},{"id":"card","t":"Allergen card","stage":"Label","opts":[{"id":"mw","t":"“Contains: milk, wheat”","short":"milk, wheat"},{"id":"none","t":"“No allergens”","short":"no allergens"},{"id":"milk","t":"“Contains: milk”","short":"“Contains: milk”"}]}],"dish":"Chicken and rice casserole","kitchen":{"title":"Safe potluck plan: chicken and rice casserole","label":"Save my plan as a kitchen card","file":"kitchen-card-safe-potluck-plan.txt","top":["Dish: chicken and rice casserole with a creamy sauce (milk, wheat flour).","## My plan"],"bottom":["## Every stage","- Wash your hands with soap for at least 20 seconds before you start and after touching raw chicken.","- Use one cutting board for raw chicken and another for ready-to-eat food, or wash the board with hot, soapy water between them.","- Check the temperature with a food thermometer in the thickest part, not by colour.","- Serve with a clean spoon, and keep the allergen card beside the dish."]}},"cards":[["The four steps","Clean, separate, cook, chill."],["Danger zone","4 °C to 60 °C: where bacteria multiply fastest."],["Fridge and freezer","Fridge 4 °C or colder; freezer −18 °C or colder."],["The 2-hour rule","Refrigerate perishable food within 2 hours."],["Doneness","Use a thermometer, not colour: ground beef 71 °C, poultry pieces 74 °C, whole poultry 82 °C."],["Cooling big batches","Divide into shallow containers; an ice bath speeds cooling."],["\u003ci>Listeria\u003c/i>","Grows in the fridge; deli meats, unpasteurized cheese; high risk in pregnancy."],["\u003ci>C. perfringens\u003c/i>","Large batches cooled slowly; cramps and diarrhea within about 8–16 h."],["Botulism","Improperly home-canned low-acid foods; a medical emergency."],["Cross-contact","Allergen traces moved by tools, surfaces or hands; wash, don’t wipe."],["Attack rate","% of people ill among those who ate a food: compare eaters and non-eaters."],["Grease fire","Heat off, lid on, never water."]]}};</script>
