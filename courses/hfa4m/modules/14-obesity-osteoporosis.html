<script>window.MV_PAYLOAD={"meta":{"id":"14-obesity-osteoporosis","nn":"14","slug":"obesity-osteoporosis","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 3","groupName":"Nutrition, Health and Disease","trivium":"","size":"L","storageKey":"hfa4u-14-obesity-osteoporosis-v1","progressKey":"hfa4u-progress-v1:14-obesity-osteoporosis","toolkit":"1.0.8"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"7e479499","content":{"id":"14-obesity-osteoporosis","kind":"topic","title":"Obesity, osteoporosis and other diet-related issues","topic":"Obesity, Osteoporosis and Other Diet-Related Issues","readyTopic":"obesity, osteoporosis and other diet-related issues","support":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003cp>For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>","hero":{"eq":"Many causes, many paths.","eqSize":"sm","headline":"No single cause, no single fix.","text":"Diet-related conditions such as \u003cstrong>obesity\u003c/strong>, \u003cstrong>osteoporosis\u003c/strong>, \u003cstrong>anemia\u003c/strong> and \u003cstrong>celiac disease\u003c/strong> don’t come from one choice. They come from biology, income, places, stress and habits working together. In this module you’ll map those causes, see why \u003cstrong>BMI\u003c/strong> can’t tell the whole story, and learn how the \u003cstrong>bone bank\u003c/strong> you build now protects you for life.","fig":{"html":"\u003cdiv class=\"ob-hero\" id=\"ob-hero\">\u003c/div>","caption":""},"words":["Genes","Sleep","Stress","Medications","Income","Grocery access","Marketing","Streets","Stigma","Hormones"],"caps":{"web":"Many causes","bone":"Build the bank early"},"aria":"Ten word cards drift in: genes, sleep, stress, medications, income, grocery access, marketing, streets, stigma and hormones. Thin lines link them into a web. The web moves to the left, and a line draws bone mass across a lifetime: rising through childhood and the teens to a peak near age 30, then gently declining.","rmAria":"Two images side by side. Left, labelled “Many causes”: ten word cards (genes, sleep, stress, medications, income, grocery access, marketing, streets, stigma and hormones) linked by thin lines into a web. Right, labelled “Build the bank early”: a bone-mass curve rising to a peak near age 30, then gently declining."},"goals":["I can explain obesity as a complex chronic disease with many interacting causes, not a matter of willpower.","I can evaluate strategies at the personal, community and policy levels, and recognize which ones blame people and which ones change conditions.","I can explain the limits of BMI and use respectful, person-first language about weight and health.","I can explain how bone mass builds and declines across life, and which factors affect it.","I can plan food choices that meet the needs of a specific condition (bone health, celiac disease, anemia, lactose intolerance, food allergy).","I can assess how heredity, income, geography and lifestyle each contribute to diet-related conditions."],"start":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003cp>For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Bone nutrients","goal":4,"prompt":"Which two nutrients work most directly together to build and keep bone?","options":[{"t":"Protein and fat","why":"Protein matters for bone, but fat isn’t a bone builder.","_n":"09af","_k":"4f87b24d"},{"t":"Iron and vitamin C","why":"That pair helps with iron absorption, not bone.","_n":"199f","_k":"89d08404"},{"t":"Calcium and vitamin D","why":"Calcium is the mineral in bone; vitamin D helps the body absorb it.","_n":"298f","_k":"4b4ce381"},{"t":"Sodium and potassium","why":"These are electrolytes; high sodium can even increase calcium loss.","_n":"397f","_k":"3a1ae53c"}],"hints":["Which mineral makes up bone?","Calcium. Which vitamin helps you absorb it?","Calcium and vitamin D."]},{"id":"w2","skill":"Bone nutrients","goal":5,"prompt":"Which of these is a good \u003cstrong>non-dairy\u003c/strong> source of calcium?","options":[{"t":"Chicken breast","why":"Meat has little calcium.","_n":"496f","_k":"0a82f02a"},{"t":"White rice","why":"Rice is mostly starch, with little calcium.","_n":"595f","_k":"4107d91c"},{"t":"An apple","why":"Fruit has little calcium.","_n":"694f","_k":"825b5656"},{"t":"Calcium-set tofu","why":"Tofu made with calcium sulphate is rich in calcium.","_n":"793f","_k":"86a17187"}],"hints":["Look for a food made with a calcium salt.","Tofu can be set with calcium sulphate.","Calcium-set tofu."]},{"id":"w3","skill":"Canada’s Food Guide","goal":5,"prompt":"Canada’s Food Guide (2019) suggests making half your plate…","options":[{"t":"protein foods","why":"Protein foods are a quarter.","_n":"892f","_k":"c0b70f9a"},{"t":"milk and dairy","why":"The 2019 guide has no separate milk group; milk and fortified soy beverages are protein foods.","_n":"9723","_k":"d351c83e"},{"t":"vegetables and fruits","why":"Half vegetables and fruits, a quarter whole grains, a quarter protein foods.","_n":"a733","_k":"809ca10c"},{"t":"whole grains","why":"Whole grains are a quarter.","_n":"b703","_k":"746f5ecb"}],"hints":["Picture the plate.","The biggest section is colourful produce.","Vegetables and fruits."]},{"id":"w4","skill":"Reading health claims","goal":6,"prompt":"A study finds that people who drink more milk have fewer fractures. What can you conclude?","options":[{"t":"Nothing at all","why":"An association is useful evidence; it just isn’t proof.","_n":"c713","_k":"8fde9bd3"},{"t":"Fractures make people drink less milk","why":"That’s possible but not shown; we can’t tell direction from this.","_n":"d763","_k":"941ee9f7"},{"t":"Milk prevents fractures","why":"The study didn’t test cause.","_n":"e773","_k":"6af2decf"},{"t":"There’s an association; other factors (activity, income, vitamin D) might explain it","why":"Observational data show links, not proof of cause.","_n":"f743","_k":"85d60030"}],"hints":["Was anything assigned, or just observed?","Observed: so it’s an association.","Other factors could explain it."]},{"id":"w5","skill":"Conditions of digestion","goal":5,"prompt":"Celiac disease is an immune reaction to…","options":[{"t":"gluten (in wheat, barley and rye)","why":"It damages the small intestine’s lining when gluten is eaten.","_n":"g753","_k":"7818d3a8"},{"t":"lactose","why":"That’s lactose intolerance, a digestion problem.","_n":"h6a3","_k":"c206c6af"},{"t":"food additives","why":"The trigger is the protein gluten.","_n":"i6b3","_k":"6b60783d"},{"t":"sugar","why":"Celiac disease isn’t about sugar.","_n":"jec3","_k":"eb5b949e"}],"hints":["It’s a protein in some grains.","Wheat, barley, rye.","Gluten."]},{"id":"w6","skill":"Conditions of digestion","goal":5,"prompt":"Which best describes lactose intolerance?","options":[{"t":"A vitamin D deficiency","why":"Vitamin D is a separate issue.","_n":"keb3","_k":"449987fa"},{"t":"A reaction to gluten","why":"That’s celiac disease.","_n":"lea3","_k":"d4efd666"},{"t":"Difficulty digesting milk sugar because of low lactase","why":"Symptoms are digestive, not an immune reaction.","_n":"me93","_k":"cb474988"},{"t":"An immune reaction to milk protein","why":"That’s a milk allergy.","_n":"ne83","_k":"f824c085"}],"hints":["Lactose is a sugar.","Lactase is the enzyme that digests it.","Low lactase, so trouble digesting lactose."]}],"refreshers":{"Bone nutrients":"Calcium is the main mineral in bone; vitamin D helps you absorb it. Weight-bearing activity tells bone to stay strong.","Canada’s Food Guide":"Half vegetables and fruits, a quarter whole grains, a quarter protein foods (including milk, yogurt, fortified soy beverages, beans and tofu); water to drink.","Reading health claims":"Observational studies show associations; experiments (trials) can test causes. Always ask what else could explain a link.","Conditions of digestion":"Allergy = immune reaction (can be severe). Celiac disease = autoimmune reaction to gluten. Intolerance = trouble digesting (e.g. lactose)."}}},"explore":{"heading":"Many causes, many paths","intro":"Three views of diet-related health. Map the causes of obesity, compare BMI with a full health picture, then build a bone bank and watch it over a lifetime.","modes":[{"id":"causes","t":"Causes map"},{"id":"bmi","t":"BMI vs full picture"},{"id":"bone","t":"Bone bank"}],"domains":[{"id":"bio","t":"Biology & genetics"},{"id":"env","t":"Food & activity environment"},{"id":"soc","t":"Social & economic conditions"},{"id":"psy","t":"Psychological factors"},{"id":"care","t":"Health care & medications"}],"cards":[{"id":"c1","t":"Genes that affect appetite regulation","short":"Genes","_a":"bEdWXlYWZA==","fixed":true},{"id":"c2","t":"Hormone changes (puberty, menopause)","short":"Hormones","_a":"bEdWXlYWZA==","fixed":true},{"id":"c3","t":"Neighbourhood with few grocery stores","short":"Grocery stores","_a":"bEdRWU8WZA=="},{"id":"c4","t":"Heavy marketing of highly processed foods","short":"Marketing","_a":"bEdRWU8WZA=="},{"id":"c5","t":"Streets that aren’t safe or easy to walk","short":"Streets","_a":"bEdRWU8WZA=="},{"id":"c6","t":"Low income and food insecurity","short":"Low income","_a":"bEdHWFoWZA=="},{"id":"c7","t":"Shift-work schedules","short":"Shift work","_a":"bEdHWFoWZA=="},{"id":"c8","t":"Chronic stress","short":"Stress","_a":"bEdEREAWZA=="},{"id":"c9","t":"Weight stigma and teasing","short":"Stigma","_a":"bEdEREAWFRtEClcVZA=="},{"id":"c10","t":"Medications that can increase appetite","short":"Medications","_a":"bEdXVktRG2Q="}],"kindKey":"Blue edge: modifiable (people, communities or policy can change it). Grey edge: non-modifiable.","links":[{"a":"c6","b":"c8","t":"Worry about money and food adds stress."},{"a":"c6","b":"c3","t":"Lower-income neighbourhoods often have fewer full grocery stores."},{"a":"c6","b":"c5","t":"Lower-income areas often have busier roads and fewer safe places to walk."},{"a":"c6","b":"c7","t":"Many lower-paid jobs involve shift work."},{"a":"c7","b":"c8","t":"Shifting schedules cut sleep and add stress."},{"a":"c7","b":"c2","t":"Night shifts disrupt sleep and the hormones that help regulate appetite."},{"a":"c9","b":"c8","t":"Stigma and teasing are a source of chronic stress."},{"a":"c9","b":"c10","t":"Weight stigma in health care can keep people from seeking care, including reviews of their medications."},{"a":"c4","b":"c9","t":"Ads often promote narrow body ideals, which feed weight stigma."},{"a":"c4","b":"c3","t":"Where fresh food is hard to find, highly processed foods and their ads fill the gap."},{"a":"c5","b":"c3","t":"Unsafe streets make it harder to walk to a store."},{"a":"c1","b":"c2","t":"Genes and hormones work together to regulate appetite."},{"a":"c8","b":"c2","t":"Stress hormones act alongside the body’s other hormones to affect appetite."},{"a":"c10","b":"c8","t":"Some medications used for mental health conditions can increase appetite."}],"personas":[{"id":"jordan","name":"Jordan","age":17,"role":"competitive rower","bmi":"higher","bp":"healthy","sugar":"healthy","fit":"high","sleep":"healthy","mental":"healthy"},{"id":"morgan","name":"Morgan","age":45,"role":"office worker","bmi":"in range","bp":"concern","sugar":"healthy","fit":"low","sleep":"concern","mental":"healthy"},{"id":"sam","name":"Sam","age":60,"role":"retired teacher","bmi":"higher","bp":"concern","sugar":"concern","fit":"low","sleep":"healthy","mental":"healthy"},{"id":"alex","name":"Alex","age":30,"role":"nurse on night shifts","bmi":"in range","bp":"healthy","sugar":"healthy","fit":"moderate","sleep":"concern","mental":"concern"}],"measures":[{"id":"bp","t":"Blood pressure"},{"id":"sugar","t":"Blood sugar"},{"id":"fit","t":"Fitness"},{"id":"sleep","t":"Sleep"},{"id":"mental","t":"Mental health"}],"bmiNote":"A word only. BMI uses weight and height, so it can’t tell muscle from fat, where fat is stored, or whether the body is working well.","bone":{"habits":[{"id":"ca","t":"Calcium intake","levels":[{"id":"adequate","t":"adequate","pts":0},{"id":"low","t":"low","pts":-10}]},{"id":"vd","t":"Vitamin D","levels":[{"id":"adequate","t":"adequate","pts":0},{"id":"low","t":"low","pts":-5}]},{"id":"act","t":"Weight-bearing activity","levels":[{"id":"low","t":"low","pts":-10},{"id":"moderate","t":"moderate","pts":0},{"id":"high","t":"high","pts":5}]},{"id":"smk","t":"Smoking","levels":[{"id":"no","t":"no","pts":0},{"id":"yes","t":"yes","pts":-5}]}],"base":{"ca":"adequate","vd":"adequate","act":"moderate","smk":"no","meno":"off"},"meno":"Menopause toggle","zone":70,"rules":["\u003cstrong>Peak index\u003c/strong> = 100 − 10 (low calcium) − 5 (low vitamin D) − 10 (low activity) + 5 (high activity) − 5 (smoking). Moderate activity adds 0.","The index rises to its peak at age 30, holds until 40, then falls 0.5 points per year.","With the menopause toggle on, it falls an extra 1 point per year from age 50 to 60.","The \u003cstrong>fracture-risk zone\u003c/strong> is an index of 70 or below."],"note":"A teaching model; real bone health depends on many more factors."},"predictions":[{"id":"p1","prompt":"\u003cstrong>Causes map.\u003c/strong> A headline says obesity is ‘a lack of willpower’. After you place all 10 cards, how many of the 5 domains will hold at least one card?","options":[{"t":"1","_n":"oe73","_k":"d6e7378b"},{"t":"2","_n":"pe63","_k":"e629a7d1"},{"t":"3","_n":"qe53","_k":"13ad1a8b"},{"t":"5","_n":"rf43","_k":"8298ba5f"}],"explain":"Every domain holds a cause, and only one card (stress) is even partly about personal control. ‘Willpower’ misses most of the map."},{"id":"p2","prompt":"\u003cstrong>BMI vs full picture.\u003c/strong> Jordan’s BMI category is ‘higher’. What will the full health panel show?","options":[{"t":"All five measures in the healthy range","_n":"sf33","_k":"968474fd"},{"t":"It can’t be shown without a weight","_n":"te63","_k":"fc6317ed"},{"t":"Concerns in every measure","_n":"ue73","_k":"cf1bcb29"},{"t":"Concerns in blood pressure only","_n":"ve83","_k":"e836cdfd"}],"explain":"BMI can’t tell muscle from fat. Jordan’s body is working well."},{"id":"p3","prompt":"\u003cstrong>Bone bank\u003c/strong>, all youth habits at baseline (peak 100). Rowan’s teen activity drops from moderate to low. What happens to the peak index?","options":[{"t":"It rises to 105","_n":"we93","_k":"9f746ac9"},{"t":"It stays at 100","_n":"xe23","_k":"3721c35d"},{"t":"It drops to 95","_n":"ye33","_k":"58b84301"},{"t":"It drops to 90","_n":"ze43","_k":"a1f6415a"}],"explain":"Weight-bearing activity builds bone. In this model, low activity costs 10 points of peak bone mass."},{"id":"p4","prompt":"\u003cstrong>Bone bank\u003c/strong>, peak 100. Two people both have a peak index of 100. One has the menopause toggle on. When does each enter the fracture-risk zone?","options":[{"t":"Toggle on: age 80; toggle off: not before 100","_n":"10e53","_k":"0e1ccf18"},{"t":"Toggle on: 60; toggle off: 80","_n":"11ee3","_k":"350e4316"},{"t":"Neither ever does","_n":"12ef3","_k":"b604739e"},{"t":"Both at age 80","_n":"13e03","_k":"f4b5a081"}],"explain":"\u003cstrong>Toggle on:\u003c/strong> 100 → 95 by 50 → 80 by 60, then 0.5 a year to 70 at 80. \u003cstrong>Toggle off:\u003c/strong> falling 0.5 a year from 40 reaches 70 only at age 100."}],"challenges":[{"id":"tc1","goal":1,"prompt":"\u003cstrong>Causes map:\u003c/strong> place all 10 cards in a correct domain.","why":"Obesity isn’t one cause: every domain has a card.","msgs":{"c2care":"Hormone changes are biology; medications are the health-care card.","c3soc":"Grocery access is part of the food environment. Low income is the social and economic card.","c10bio":"The cause is the medication, which is a health-care factor.","tray":"Place all 10 cards: {n} still in the tray.","demo":"That was the reveal’s map. Your own map is back: place the cards yourself.","general":"{n} of the cards sit in a domain that doesn’t fit. Ask: is this inside the body, around the person, about money and work, about the mind, or about treatment?"},"hints":["Ask: is this inside the body, around the person, about money and work, about the mind, or about treatment?","Streets, stores and ads are the environment.","Biology & genetics: cards 1 and 2. Food & activity environment: cards 3, 4 and 5. Social & economic conditions: cards 6 and 7. Psychological factors: card 8, and card 9 (card 9 also fits Social & economic conditions). Health care & medications: card 10."]},{"id":"tc2","goal":3,"prompt":"\u003cstrong>BMI vs full picture:\u003c/strong> find the persona whose BMI category is ‘in range’ but whose full panel shows at least one concern linked to heart health.","why":"BMI can flag a healthy rower and miss a person with high blood pressure.","msgs":{"alex":"Alex’s concerns are sleep and mental health, not heart-health measures.","jordan":"Jordan’s BMI category is ‘higher’, and the panel is healthy.","sam":"Sam’s BMI category is ‘higher’.","mode":"Switch to BMI vs full picture, then choose a persona.","none":"Choose a persona first."},"hints":["Filter to ‘in range’.","Of those, which has a blood pressure concern?","Morgan."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>Bone bank, menopause toggle on:\u003c/strong> choose youth habits so the curve stays out of the fracture-risk zone until at least age 80.","why":"Peak bone mass is your margin. Youth habits set how long it lasts.","banner":"Peak bone mass is your margin. Youth habits set how long it lasts.","msgs":{"p95":"With the toggle on, 95 → 90 by 50 → 75 by 60 → 70 at age 70.","lowca":"Low calcium alone costs 10 points; you’d need +10 elsewhere, and the most activity adds is +5.","mode":"Switch to Bone bank.","meno":"Turn the menopause toggle on: this challenge is about that curve.","general":"Peak {p}: the curve enters the zone {age}. With the toggle on, the peak must be at least 100."},"hints":["Work out how many points the curve loses from age 40 to 60 with the toggle on.","5 (age 40 to 50) + 15 (age 50 to 60) = 20 by age 60. Then 0.5 a year. To reach 70 no earlier than 80, the index must be at least 80 at 60.","So the peak must be at least 100: adequate calcium, and the rest adding up to no net loss."]}]},"part3":{"slug":"bones","name":"Build bones","heading":"Build bones","intro":"Move from the model to real food and real words. Plan calcium and vitamin D from everyday foods, read the fracture facts, then audit weight-bias language.","st1":{"title":"Station 1: Calcium and vitamin D, beyond the milk glass","intro":"Tap foods to add one serving each to a model day. The bars compare the day’s total with the RDAs for ages 14–18: a population reference, not a personal target.","foods":[{"id":"soy","t":"Fortified soy beverage","short":"soy beverage","serving":"250 mL","ca":300,"vd":100,"note":"Non-dairy"},{"id":"tofu","t":"Calcium-set tofu","short":"tofu","serving":"150 g","ca":250,"vd":0,"note":"Non-dairy"},{"id":"salmon","t":"Canned salmon with bones","short":"salmon","serving":"75 g","ca":200,"vd":300,"note":"Fish","fish":true},{"id":"milk","t":"Milk","short":"milk","serving":"250 mL","ca":300,"vd":100,"note":"Dairy","dairy":true},{"id":"bokchoy","t":"Cooked bok choy","short":"bok choy","serving":"125 mL","ca":100,"vd":0,"note":"Vegetable","veg":true},{"id":"beans","t":"White beans","short":"white beans","serving":"175 mL","ca":100,"vd":0,"note":"Plant protein"},{"id":"almonds","t":"Almonds","short":"almonds","serving":"60 mL","ca":100,"vd":0,"note":"Tree nut"},{"id":"egg","t":"Egg","short":"egg","serving":"1 large","ca":25,"vd":40,"note":""}],"label":"Model values, rounded for hand arithmetic.","refs":{"ca":1300,"vd":600},"hide":"Hide dairy and fish (Rowan’s needs)","data":"\u003cul class=\"ob-facts\">\u003cli>\u003cstrong>Calcium RDAs:\u003c/strong> 1300 mg a day for ages 14–18; 1000 mg for adults 19–50 (Institute of Medicine, 2011).\u003c/li>\u003cli>\u003cstrong>Vitamin D RDA:\u003c/strong> 600 IU a day for ages 1–70 (Institute of Medicine, 2011).\u003c/li>\u003cli>\u003cstrong>Adults over 50:\u003c/strong> Health Canada advises a daily vitamin D supplement of 400 IU (Health Canada, n.d.).\u003c/li>\u003cli>\u003cstrong>Winter in Canada:\u003c/strong> sunlight makes little vitamin D in the skin in winter, so food sources matter more (Health Canada, n.d.).\u003c/li>\u003c/ul>"},"st2":{"title":"Station 2: Fracture facts","html":"\u003cul class=\"ob-facts\">\u003cli>\u003cstrong>How common:\u003c/strong> Osteoporosis Canada estimates that at least 1 in 3 women and 1 in 5 men will have a fracture caused by osteoporosis during their lifetime (Osteoporosis Canada, n.d.).\u003c/li>\u003cli>\u003cstrong>Why hips matter:\u003c/strong> a hip fracture usually means surgery and a long recovery. Many older adults need more help with daily life afterward, and some can no longer live on their own. Strong bones protect independence.\u003c/li>\u003cli>\u003cstrong>When the bank fills:\u003c/strong> bone mass peaks in early adulthood, around the late 20s to 30 (Osteoporosis Canada, n.d.). After that, the goal is to keep what you’ve built.\u003c/li>\u003c/ul>"},"st3":{"title":"Station 3: Weight-bias language audit","intro":"Six sentences. Tap \u003cstrong>Respectful\u003c/strong> or \u003cstrong>Needs rewriting\u003c/strong>. If a sentence needs rewriting, choose the rewrite that fixes it.","sentences":[{"id":"s1","t":"“Obese people should just eat less.”","_a":"TEdCFQMWS1xAF11DXBYVG0VHDhVLBRtE"},{"id":"s2","t":"“People living with obesity deserve respectful health care.”","_a":"TEdCFQMWS1xEFVFUTRZE"},{"id":"s3","t":"“She let herself go.”","_a":"TEdCFQMWS1xAF11DXBYVG0VHDhVLBhtE"},{"id":"s4","t":"“A person’s size doesn’t tell you their habits or health.”","_a":"TEdCFQMWS1xEFVFUTRZE"},{"id":"s5","t":"“Shaming kids about weight will motivate them.”","_a":"TEdCFQMWS1xAF11DXBYVG0VHDhVLBxtE"},{"id":"s6","t":"“Bodies come in many sizes.”","_a":"TEdCFQMWS1xEFVFUTRZE"}],"rewrites":[{"id":"r1","t":"“People living with obesity face many causes, and support works better than blame.”"},{"id":"r2","t":"“Her health needs have changed.”"},{"id":"r3","t":"“Weight stigma harms children’s health; supportive environments help.”"}],"fb":{"respect":"Right. This sentence is respectful: it doesn’t label or blame anyone.","notRespect":"Not quite. This sentence labels or blames people. Look for a label in place of a person, or blame in place of causes.","notRewrite":"Not quite. This one is already respectful: it doesn’t label or blame anyone.","rewrite":"Right, it needs rewriting. Now choose the rewrite that fixes it.","rightR":"Right. The rewrite keeps the person first and drops the blame.","wrongR":"Not quite. That rewrite answers a different sentence. Choose the one that replaces this sentence’s message."}},"blocks":[{"title":"Sources (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Health Canada. (n.d.). \u003ci>Vitamin D and calcium: Updated dietary reference intakes\u003c/i>. Government of Canada.\u003c/li>\u003cli>Institute of Medicine. (2011). \u003ci>Dietary reference intakes for calcium and vitamin D\u003c/i>. The National Academies Press.\u003c/li>\u003cli>Osteoporosis Canada. (n.d.). \u003ci>Osteoporosis facts and statistics\u003c/i>. Osteoporosis Canada.\u003c/li>\u003cli>Puhl, R. M., &amp; Heuer, C. A. (2010). Obesity stigma: Important considerations for public health. \u003ci>American Journal of Public Health, 100\u003c/i>(6), 1019–1028.\u003c/li>\u003cli>Wharton, S., Lau, D. C. W., Vallis, M., Sharma, A. M., Biertho, L., Campbell-Scherer, D., … Wicklum, S. (2020). Obesity in adults: A clinical practice guideline. \u003ci>CMAJ, 192\u003c/i>(31), E875–E891.\u003c/li>\u003c/ul>\u003cp class=\"tiny muted\">For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>"}],"quickCheck":{"title":"Build bones quick check","summary":"Build bones quick check","items":[{"id":"q1","goal":5,"prompt":"Rowan avoids dairy. Which pair adds the most calcium?","choices":[{"t":"Egg + beans","fb":"300 + 250 = 550 mg; the others are 200 mg or less.","_n":"14df3","_k":"e9a55d37"},{"t":"Bok choy + beans","fb":"300 + 250 = 550 mg; the others are 200 mg or less.","_n":"15e23","_k":"c7d1c189"},{"t":"Soy beverage + tofu","fb":"Right. 300 + 250 = 550 mg; the others are 200 mg or less.","_n":"16e13","_k":"57918bce"},{"t":"Almonds + bok choy","fb":"300 + 250 = 550 mg; the others are 200 mg or less.","_n":"17e43","_k":"f3cc8391"}]},{"id":"q2","goal":5,"prompt":"Which food in the table supplies the most vitamin D per serving?","choices":[{"t":"Canned salmon","fb":"Right. 300 IU, but Rowan doesn’t eat fish; that’s why fortified soy beverage matters.","_n":"18e33","_k":"ebc2b28e"},{"t":"Egg","fb":"300 IU, but Rowan doesn’t eat fish; that’s why fortified soy beverage matters.","_n":"19e63","_k":"8f36c779"},{"t":"Tofu","fb":"300 IU, but Rowan doesn’t eat fish; that’s why fortified soy beverage matters.","_n":"1ae53","_k":"036504d6"},{"t":"Milk","fb":"300 IU, but Rowan doesn’t eat fish; that’s why fortified soy beverage matters.","_n":"1be83","_k":"0f34a844"}]},{"id":"q3","goal":3,"prompt":"Which sentence is person-first?","choices":[{"t":"“People living with obesity…”","fb":"Right. Name the person before the condition.","_n":"1ce73","_k":"b50d21bd"},{"t":"“Obese people…”","fb":"Name the person before the condition.","_n":"1d7a2","_k":"96392e72"},{"t":"“The obese…”","fb":"Name the person before the condition.","_n":"1e7b2","_k":"fcb5b560"},{"t":"“Fatties…”","fb":"Name the person before the condition.","_n":"1f782","_k":"cb4beb79"}]},{"id":"q4","goal":4,"prompt":"Why does teen activity matter for a 70-year-old’s hips?","choices":[{"t":"It builds the peak bone bank","fb":"Right. Most bone mass is banked by your late 20s.","_n":"1g792","_k":"b361cefe"},{"t":"It burns calories","fb":"Most bone mass is banked by your late 20s.","_n":"1h762","_k":"7f54e995"},{"t":"It doesn’t","fb":"Most bone mass is banked by your late 20s.","_n":"1i772","_k":"a5d9761d"},{"t":"It lowers BMI","fb":"Most bone mass is banked by your late 20s.","_n":"1j742","_k":"b523fd41"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Condition ↔ nutrition strategy","summary":"Condition ↔ nutrition strategy","goal":[5,6],"instruction":"Eight conditions and situations. Match each one with the nutrition strategy that meets its needs.","leftTitle":"Condition or situation","rightTitle":"Nutrition strategy","left":[{"id":"l1","t":"Celiac disease"},{"id":"l2","t":"Iron-deficiency anemia"},{"id":"l3","t":"Lactose intolerance"},{"id":"l4","t":"Peanut allergy"},{"id":"l5","t":"Low peak bone mass risk in a teen"},{"id":"l6","t":"An older adult over 50 in a Canadian winter","hints":["What happens to vitamin D from sunlight in winter?","In Canada it’s low; older adults also make less.","Food plus the supplement advice."]},{"id":"l7","t":"A family living with food insecurity"},{"id":"l8","t":"A person living with obesity seeking care"}],"right":[{"id":"r1","t":"Strictly gluten-free: no wheat, barley or rye; watch for cross-contact"},{"id":"r2","t":"Iron-rich foods paired with vitamin C; tea and coffee away from meals"},{"id":"r3","t":"Lactose-free milk or non-dairy calcium sources (fortified soy beverage, calcium-set tofu)"},{"id":"r4","t":"Strict avoidance; read every label; no cross-contact"},{"id":"r5","t":"Calcium and vitamin D foods plus weight-bearing activity"},{"id":"r6","t":"Vitamin D-rich foods and Health Canada’s supplement advice"},{"id":"r7","t":"Income and access supports; affordable nutrient-dense staples (canned fish, beans, frozen vegetables)"},{"id":"r8","t":"Respectful, individualized support from a health team, focused on health outcomes, not blame"}],"_a":"TEdYBhsOG0sGRxgVVQYbAxUXBhUVFlUKFV8WRQoWFRtbURYNG0YNGxtHWAIbDhtLAkcYFVUCGwMVFwIVFRZVDhVfFkUOFhUbW10WDRtGARtK","wrong":{"l1|r3":"Celiac disease is an immune reaction to gluten, not a problem digesting lactose.","l3|r1":"Celiac disease is an immune reaction to gluten, not a problem digesting lactose.","l2|r5":"Calcium and vitamin D build bone; iron needs vitamin C.","l5|r2":"Calcium and vitamin D build bone; iron needs vitamin C.","l4|r3":"An allergy needs strict avoidance; an intolerance is about digestion.","l3|r4":"An allergy needs strict avoidance; an intolerance is about digestion.","l7|r8":"Food insecurity is about income and access first.","l8|r7":"Food insecurity is about income and access first."},"wrongDefault":"Read the condition again: what does the body, or the situation, need first?"},{"id":"data","type":"custom","title":"Bone and body data","summary":"Bone and body data","star":true,"goal":[2,4,6],"instruction":"Six items: calcium arithmetic, two bone-model questions, an investigation and a policy question. Items marked ★ are non-routine; B5 is an investigation.","how":"Type a number or tap a choice, then press Check.","items":[{"id":"b1","kind":"num","goal":4,"prompt":"Using the Station 1 table, how much calcium is in 2 servings of soy beverage plus 1 of tofu?","fields":[{"label":"Calcium","unit":"mg"}],"_a":"bF0BB2Q=","display":"850 mg","wrong":[{"match":[550],"fb":"Two soy beverages: 600, plus 250."}],"wrongDefault":"Add 300 + 300 + 250.","hints":["One soy beverage has 300 mg; one tofu serving has 250 mg.","Two soy beverages: 2 × 300 = 600 mg.","600 + 250 = 850 mg."]},{"id":"b2","kind":"num","goal":4,"prompt":"A 16-year-old’s RDA is 1300 mg. How much more calcium is needed after B1’s foods?","fields":[{"label":"More calcium needed","unit":"mg"}],"_a":"bFEBB2Q=","display":"450 mg","wrong":[{"match":[1300],"fb":"Subtract what’s already eaten."}],"wrongDefault":"Subtract what’s already eaten.","hints":["B1’s foods give 850 mg.","Subtract: 1300 − 850.","450 mg."]},{"id":"b3","kind":"num","goal":4,"star":true,"prompt":"Bone model, toggle off: peak 90. At what age does the curve enter the zone?","fields":[{"label":"Age","unit":"years"}],"_a":"bF0Eag==","display":"age 80","wrong":[{"match":[60],"fb":"That’s with the toggle on. Off: 90 − 0.5 × (age − 40) = 70 gives 80."}],"wrongDefault":"Off: 90 − 0.5 × (age − 40) = 70.","hints":["The index holds at 90 until 40, then falls 0.5 a year.","It must fall 20 points: 20 ÷ 0.5 = 40 years after age 40.","Age 80."]},{"id":"b4","kind":"num","goal":4,"star":true,"prompt":"Bone model, toggle on: peak 95. Age entering the zone?","fields":[{"label":"Age","unit":"years"}],"_a":"bFIEag==","display":"age 70","wrong":[{"match":[80],"fb":"95 → 90 by 50 → 75 by 60 → 70 at 70."}],"wrongDefault":"95 → 90 by 50 → 75 by 60, then 0.5 a year.","hints":["Points lost from 40 to 50?","5, then 15 more from 50 to 60.","75 at 60, then 0.5 a year: 70 at 70."]},{"id":"b5","kind":"chips","goal":6,"star":true,"inquiry":true,"prompt":"A researcher compares fracture rates in teens who play impact sports and teens who don’t, and finds fewer fractures later in the sports group. Name one variable that could confound this.","chips":[{"t":"Income (access to sports and food)","_n":"1k752","_k":"644d0ce6"},{"t":"Calcium intake","_n":"1l722","_k":"b875bb12"},{"t":"Family history","_n":"1m732","_k":"751a999a"},{"t":"Whether they play impact sports","fb":"That’s the variable being compared, not a confounder.","_n":"1n742","_k":"9cd0dc0d"},{"t":"The number of fractures later","fb":"That’s the outcome being measured, not a confounder.","_n":"1o732","_k":"5351e0e3"}],"fb":"Sports aren’t assigned at random; other differences can explain the link.","why":"Income, calcium intake and family history could each differ between the groups. Sports aren’t assigned at random; other differences can explain the link.","hints":["Were the teens assigned to play sports, or did they choose?","They chose. What else might differ between the two groups and also affect bones?","Income, calcium intake or family history: any of these."]},{"id":"b6","kind":"chips","goal":2,"star":true,"prompt":"Policy evaluation: which strategy changes conditions for the most people?","chips":[{"t":"Weighing students at school","fb":"Weighing at school can increase stigma and harm.","_n":"1p722","_k":"abaa4ff9"},{"t":"Free school breakfast with fortified milk or soy options","_n":"1q712","_k":"420a5e40"},{"t":"A poster saying ‘try harder’","fb":"Blame-based messages don’t change conditions.","_n":"1r782","_k":"688dda35"},{"t":"Banning birthday cake","fb":"Restriction without support doesn’t change conditions.","_n":"1s772","_k":"77f103d3"}],"why":"Personal, community, policy. Changing conditions reaches more people than blaming individuals.","hints":["Which choice changes what’s available to everyone, without singling anyone out?","Three of the choices blame, restrict or label students.","Free school breakfast with fortified milk or soy options."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Niamh","goal":[1,5],"how":"","instruction":"Niamh made one mistake in each piece of work. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":5,"task":"Plan calcium for Niamh’s 15-year-old cousin, who eats dairy.","steps":["Calcium builds bone, so I’ll plan calcium-rich foods.","The target is 1000 mg a day.","Milk (300) + yogurt (250) + cheese (350) = 900 mg.","Add tofu (250): 1150 mg, which meets the target."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking.","","Step 3’s arithmetic is fine; the target before it is wrong.","This follows the wrong target."],"fixes":[{"t":"Teens need less than adults.","why":"Teens need more, while the bone bank is growing.","_n":"1t762","_k":"eb1ed6a9"},{"t":"Ages 14–18 need 1300 mg a day, so add another serving or two.","why":"Teens need more, while the bone bank is growing.","_n":"1u752","_k":"2b609a70"},{"t":"Ages 14–18 need 600 mg.","why":"That’s vitamin D’s number, in IU.","_n":"1v6c2","_k":"02156b31"},{"t":"Step 2 is correct.","why":"1000 mg is the adult (19–50) RDA.","_n":"1w6b2","_k":"95838e75"}],"hints":["Check the RDA for ages 14–18.","It’s higher than for adults.","1300 mg."]},{"id":"e2","goal":1,"task":"Explain why obesity rates have risen in Canada.","steps":["Rates of obesity have risen over recent decades.","Food environments changed: more highly processed foods and more marketing.","So the real cause is that people today have less willpower.","Therefore, the best solution is to shame people into changing."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","This follows a wrong conclusion."],"fixes":[{"t":"So genes alone explain it.","why":"Genes didn’t change in a few decades; environments did.","_n":"1x6e2","_k":"a13068e1"},{"t":"So people today eat more because they’re lazier.","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"1y6f2","_k":"4fc5431f"},{"t":"So many interacting factors (environment, income, sleep, stress, genes, medications) shape weight; changing conditions helps more than blaming individuals.","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"1z702","_k":"d848a642"},{"t":"Step 3 is correct.","why":"Step 2 named the environment, then step 3 blamed people. That doesn’t follow.","_n":"20712","_k":"3c72e5db"}],"hints":["Does step 3 follow from step 2?","Step 2 is about environments, not character.","Many causes; change conditions."]},{"id":"e3","goal":5,"task":"Plan a lunch to help with low iron for a vegetarian.","steps":["Choose iron-rich plant foods: lentils and spinach.","Add whole-grain bread for more iron and fibre.","Drink a big cup of black tea with the meal.","Finish with an orange later in the evening."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","This follows; but the vitamin C should come with the meal."],"fixes":[{"t":"Skip the lentils.","why":"Lentils are a key iron source.","_n":"21722","_k":"58985321"},{"t":"Step 3 is correct.","why":"Tea’s tannins reduce absorption of plant iron.","_n":"22732","_k":"40c4a53f"},{"t":"Have the orange or red pepper with the meal, and save tea for between meals.","why":"Tea and coffee reduce iron absorption from plant foods. Pair plant iron with vitamin C instead.","_n":"23742","_k":"18ad7abe"},{"t":"Add more tea to wash it down.","why":"Tea and coffee reduce iron absorption from plant foods. Pair plant iron with vitamin C instead.","_n":"24752","_k":"7693b8eb"}],"hints":["What helps plant iron absorb?","Vitamin C, at the same meal.","Move the orange to lunch; tea later."]}]}]},"reflect":{"blocks":[{"html":"\u003cdiv class=\"hfa-support\" role=\"note\">\u003cp>If food, eating or body image is weighing on you, you’re not alone. Talk to someone you trust, or contact Kids Help Phone (\u003cspan class=\"nw\">1-800-668-6868\u003c/span>, text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>) or the National Eating Disorder Information Centre (NEDIC) helpline.\u003c/p>\u003cp>For your own health, talk to a doctor, nurse or registered dietitian.\u003c/p>\u003c/div>"}],"journal":[{"id":"j1","q":"What surprised you most in the causes map or the BMI comparison?"},{"id":"j2","q":"In your own words, why is obesity described as having many causes?"},{"id":"j3","q":"Explain to a friend why their teen years matter for bone health, using the bone bank idea."},{"id":"j4","q":"Where have you heard weight-bias language (in media, jokes or conversations)? How could it be said more respectfully?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"How does Obesity Canada’s 2020 guideline describe obesity?","options":[{"t":"A result of poor willpower","why":"The guideline rejects this framing.","_n":"25662","_k":"525ba632"},{"t":"A temporary condition fixed by dieting","why":"It’s described as chronic and complex.","_n":"26672","_k":"b5adbe94"},{"t":"A complex chronic disease in which excess or abnormal body fat impairs health","why":"It focuses on health impact, not size alone.","_n":"27682","_k":"93892ac9"},{"t":"Any BMI above a set number","why":"The guideline doesn’t diagnose by BMI alone.","_n":"28672","_k":"a170b2da"}]},"b":{"prompt":"Which statement matches current Canadian clinical guidance on obesity?","options":[{"t":"Weight loss is the only goal of care","why":"Care focuses on health and quality of life.","_n":"296a2","_k":"7ffbfcbd"},{"t":"BMI alone is enough to diagnose","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"2a692","_k":"6a8df23d"},{"t":"Diagnosis should consider how body fat affects a person’s health, not just BMI","why":"It focuses on health impact, not size alone.","_n":"2b642","_k":"1beedc6c"},{"t":"Obesity is a lifestyle choice","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"2c632","_k":"26462df5"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Roughly when does bone mass reach its peak?","options":[{"t":"In early childhood, by age 5","why":"It keeps building through the teens.","_n":"2d662","_k":"504388ab"},{"t":"In old age","why":"Most bone mass is built by your late 20s. The habits you have now set the size of the bank.","_n":"2e652","_k":"64989f3d"},{"t":"In middle age, around 50","why":"Most bone mass is built by your late 20s. The habits you have now set the size of the bank.","_n":"2f702","_k":"a5ebf55c"},{"t":"By about the late 20s to 30","why":"Youth habits set the size of the bank.","_n":"2g6f2","_k":"61e48acb"}]},"b":{"prompt":"Which combination best supports building peak bone mass?","options":[{"t":"Iron and vitamin C","why":"That pair is for iron.","_n":"2he22","_k":"8d53a102"},{"t":"Calcium, vitamin D and weight-bearing activity","why":"Calcium is the main mineral in bone; vitamin D helps you absorb it. Weight-bearing activity tells bone to stay strong.","_n":"2ie32","_k":"bc0a0559"},{"t":"Low-sodium foods alone","why":"Helpful, but not the main builders.","_n":"2je02","_k":"393be0ce"},{"t":"Calcium alone","why":"Vitamin D and activity matter too.","_n":"2ke12","_k":"e5b44bca"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Which meal is safe for someone with celiac disease?","options":[{"t":"Lactose-free milk with regular bread","why":"Lactose isn’t the issue; the bread has gluten.","_n":"2le62","_k":"e3a0d15a"},{"t":"Whole-wheat pasta with tomato sauce","why":"Wheat contains gluten.","_n":"2me72","_k":"b7a67dd6"},{"t":"Rice, grilled chicken and vegetables, made with no gluten-containing sauces","why":"Strictly gluten-free: no wheat, barley or rye; watch for cross-contact.","_n":"2ne42","_k":"3dd4a571"},{"t":"Barley soup","why":"Barley contains gluten.","_n":"2oe52","_k":"044a3d72"}]},"b":{"prompt":"Which lunch best supports iron absorption for a vegetarian?","options":[{"t":"Lentil soup with black tea","why":"Tea and coffee reduce iron absorption from plant foods. Pair plant iron with vitamin C instead.","_n":"2pea2","_k":"47c49be5"},{"t":"Lentil soup with red pepper strips, with water to drink","why":"Tea and coffee reduce iron absorption from plant foods. Pair plant iron with vitamin C instead.","_n":"2qeb2","_k":"0548f188"},{"t":"A plain bagel with coffee","why":"Little iron, and coffee reduces absorption.","_n":"2r0fd","_k":"d96a37cd"},{"t":"Cheese and crackers","why":"Little iron.","_n":"2s10d","_k":"2fb65095"}]}},{"id":"t1","cat":"T","goal":[1,6],"a":{"prompt":"A city has high obesity rates in neighbourhoods with low incomes, few grocery stores and busy roads. Which explanation fits the evidence best?","options":[{"t":"Genes alone explain neighbourhood differences","why":"Genes don’t sort by street; conditions do.","_n":"2t0dd","_k":"e018d6e9"},{"t":"People there care less about health","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"2u0ed","_k":"4a3cbf11"},{"t":"Income, food access and unsafe streets together limit options, alongside other factors","why":"Several domains, interacting.","_n":"2v0bd","_k":"2971befa"},{"t":"It’s a coincidence","why":"The pattern matches known causes.","_n":"2w0cd","_k":"ad05de15"}]},"b":{"prompt":"A night-shift nurse and a day-shift nurse eat similar foods, but the night-shift nurse has more health concerns. Which factor best explains the difference?","options":[{"t":"The night-shift nurse lacks willpower","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"2x09d","_k":"3d221188"},{"t":"Food choice is the only factor","why":"They eat similar foods.","_n":"2y0ad","_k":"c46f4ba9"},{"t":"BMI explains it","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"2z07d","_k":"390ebe14"},{"t":"Shift-work schedules disrupt sleep and hormones, which affect appetite and health","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"3008d","_k":"7ac2b4c1"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Bone model, menopause toggle on. A person’s peak index is 95. At what age do they enter the fracture-risk zone?","options":[{"t":"60","why":"That’s for peak 90.","_n":"31f5d","_k":"5e43ed84"},{"t":"70","why":"95 → 90 by 50 → 75 by 60 → 70 at 70.","_n":"32f4d","_k":"a5a609dd"},{"t":"80","why":"That’s for peak 100.","_n":"33f7d","_k":"24a3cba4"},{"t":"90","why":"That’s with the toggle off.","_n":"34f6d","_k":"0ba84cc6"}]},"b":{"prompt":"Bone model, toggle off. Peak index 90. At what age do they enter the zone?","options":[{"t":"60","why":"That’s with the toggle on.","_n":"35f9d","_k":"2df127ac"},{"t":"70","why":"Check: 90 − 0.5 × 30 = 75 at 70.","_n":"36f8d","_k":"4bc39d1a"},{"t":"80","why":"90 − 0.5 × 40 = 70 at age 80.","_n":"37fbd","_k":"f59d43f2"},{"t":"100","why":"That’s for peak 100.","_n":"38fad","_k":"20a50d3d"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Riley’s BMI category is ‘in range’, but Riley has high blood pressure and high blood sugar. Which conclusion is supported?","options":[{"t":"Riley has health concerns that BMI alone would miss","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"39fdd","_k":"f4b3408a"},{"t":"Riley’s BMI must be wrong","why":"BMI is just limited, not wrong.","_n":"3afcd","_k":"f504c64a"},{"t":"Riley needs to gain weight","why":"Not supported by anything here.","_n":"3b83d","_k":"2a015f47"},{"t":"Riley is healthy because BMI is in range","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"3c84d","_k":"0f615d29"}]},"b":{"prompt":"Casey’s BMI category is ‘higher’, and every health measure is in the healthy range. Which conclusion is supported?","options":[{"t":"Casey should be told to lose weight","why":"Weight stigma is linked to more stress, avoiding health care and less activity. It harms; it doesn’t help.","_n":"3d85d","_k":"0f6f4be7"},{"t":"Casey must have hidden disease","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"3e86d","_k":"8939356d"},{"t":"Casey’s health measures must be wrong","why":"No reason to doubt them.","_n":"3f87d","_k":"12cc87f7"},{"t":"BMI alone doesn’t show a health problem for Casey","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"3g88d","_k":"ed25332e"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which sentence is the most respectful and accurate?","options":[{"t":"“Obese people need to try harder.”","why":"Weight stigma is linked to more stress, avoiding health care and less activity. It harms; it doesn’t help.","_n":"3h89d","_k":"c678f367"},{"t":"“People living with obesity often face weight bias, which can harm their health and their care.”","why":"Weight stigma is linked to more stress, avoiding health care and less activity. It harms; it doesn’t help.","_n":"3i8ad","_k":"59ec7fe1"},{"t":"“Fat people are lazy.”","why":"Stigmatizing and false.","_n":"3j7bd","_k":"77b50c13"},{"t":"“The obese cost the health system the most.”","why":"Labels people and blames them.","_n":"3k7cd","_k":"8f7ff81b"}]},"b":{"prompt":"A coach wants to encourage healthy habits on a team. Which message is best?","options":[{"t":"“No dessert for anyone heavy.”","why":"Weight stigma is linked to more stress, avoiding health care and less activity. It harms; it doesn’t help.","_n":"3l89d","_k":"503e1df3"},{"t":"“Let’s fuel well and train well. Strong bodies come in all sizes.”","why":"It encourages habits for the whole team and respects every body size.","_n":"3m88d","_k":"ea5509b8"},{"t":"“Some of you need to lose weight.”","why":"Weight stigma is linked to more stress, avoiding health care and less activity. It harms; it doesn’t help.","_n":"3n87d","_k":"4f088c8f"},{"t":"“Weigh-ins every Monday will keep you honest.”","why":"Weigh-ins can increase stigma and harm.","_n":"3o86d","_k":"20456627"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which is the clearest explanation of why BMI alone can’t diagnose obesity?","options":[{"t":"“BMI measures fat exactly.”","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"3p8dd","_k":"bb28f04a"},{"t":"“BMI is always wrong.”","why":"It’s a useful screening tool, just limited.","_n":"3q8cd","_k":"b591a49c"},{"t":"“BMI uses only weight and height, so it can’t tell muscle from fat, where fat is stored, or whether a person’s body is working well.”","why":"BMI doesn’t measure fat, muscle, fitness or health. Health is judged by how the body is actually working.","_n":"3r8bd","_k":"4d035a41"},{"t":"“BMI is only for adults.”","why":"Irrelevant here.","_n":"3s8ad","_k":"c4c4393c"}]},"b":{"prompt":"Which is the clearest summary of the ‘many causes’ idea?","options":[{"t":"“It’s mostly fast food.”","why":"One card only.","_n":"3t81d","_k":"b43452a3"},{"t":"“Biology, environment, income, stress, sleep, medications and stigma interact, so no single factor or single fix explains obesity.”","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"3u80d","_k":"5109ebf8"},{"t":"“It’s mostly willpower.”","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"3v87e","_k":"459383bc"},{"t":"“It’s mostly genes.”","why":"One domain only.","_n":"3w88e","_k":"7890332e"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A 16-year-old who doesn’t eat dairy needs more calcium. Using the Station 1 table, which addition gets them closest to 1300 mg from a current 800 mg?","options":[{"t":"Almonds + bok choy (200 mg)","why":"That only reaches 1000 mg.","_n":"3x85e","_k":"1433ae70"},{"t":"Two eggs (50 mg)","why":"Eggs have little calcium.","_n":"3y86e","_k":"4547ea4e"},{"t":"Milk + cheese","why":"They don’t eat dairy. Fortified soy beverages, calcium-set tofu, canned salmon with bones, beans, almonds and greens all add calcium.","_n":"3z8be","_k":"34477b89"},{"t":"Fortified soy beverage + calcium-set tofu (550 mg), reaching 1350 mg","why":"300 + 250 = 550 mg, and 800 + 550 = 1350 mg.","_n":"408ce","_k":"8eed524c"}]},"b":{"prompt":"An older adult with lactose intolerance wants foods that give both calcium and vitamin D. Which pair from the table is best?","options":[{"t":"Tofu and egg","why":"Little vitamin D.","_n":"4189e","_k":"aeac316c"},{"t":"Fortified soy beverage and canned salmon with bones","why":"500 mg calcium, 400 IU vitamin D.","_n":"428ae","_k":"f45c086c"},{"t":"Milk and cheese","why":"Lactose intolerance; choose lactose-free or non-dairy options.","_n":"437fe","_k":"c2cd056c"},{"t":"Almonds and bok choy","why":"Calcium but no vitamin D.","_n":"4480e","_k":"1db6eaf8"}]}},{"id":"a2","cat":"A","goal":[2,6],"a":{"prompt":"A school wants to support students’ health. Which plan is most likely to help without harm?","options":[{"t":"Weighing students and sending results home","why":"Weight stigma is linked to more stress, avoiding health care and less activity. It harms; it doesn’t help.","_n":"458de","_k":"879148a9"},{"t":"Free breakfast with fortified options, more active-play time, and staff training to prevent weight teasing","why":"Personal, community, policy. Changing conditions reaches more people than blaming individuals.","_n":"468ce","_k":"ec93bbfa"},{"t":"Posters telling students to try harder","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"478fe","_k":"71cee559"},{"t":"Banning all treats with no other changes","why":"Restriction without support doesn’t change conditions.","_n":"488ee","_k":"74f50fa5"}]},"b":{"prompt":"A rural community has few grocery stores and long winters. Which strategy addresses the biggest causes?","options":[{"t":"A campaign shaming unhealthy choices","why":"Weight stigma is linked to more stress, avoiding health care and less activity. It harms; it doesn’t help.","_n":"4989e","_k":"94e49e64"},{"t":"Doing nothing; it’s personal choice","why":"Genes, sleep, stress, medications, income and food environments all feed in. Willpower is one small card on a very big map.","_n":"4a88e","_k":"41593911"},{"t":"A community food hub with affordable produce, plus winter indoor activity space","why":"Personal, community, policy. Changing conditions reaches more people than blaming individuals.","_n":"4b8be","_k":"cee5b46f"},{"t":"Telling people to drive further to shop","why":"Ignores the cost and access barriers.","_n":"4c8ae","_k":"6411ff0a"}]}}]},"task":{"title":"Build Rowan’s bones","summary":"Build Rowan’s bones","statement":"\u003cp>Rowan is 16, doesn’t eat dairy (lactose intolerance) and doesn’t eat fish. Plan one day of calcium and vitamin D foods from the Station 1 table that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"ob-conds\">\u003cli>At least 1300 mg calcium.\u003c/li>\u003cli>At least 200 IU vitamin D from food.\u003c/li>\u003cli>No dairy, no fish (Rowan’s needs).\u003c/li>\u003cli>A realistic day: 6 servings or fewer.\u003c/li>\u003cli>Includes a vegetable.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Use the − and + buttons: 0 to 2 servings of each food. Model values from Station 1.\u003c/p>","checks":["At least 1300 mg calcium","At least 200 IU vitamin D from food","Fits Rowan: no dairy, no fish","6 servings or fewer","Includes a vegetable"],"tips":["Which non-dairy chips give the most calcium per serving?","Vitamin D: only soy beverage, salmon, milk and egg have any. Rowan can’t have salmon or milk, and eggs are small.","Rowan’s choices are limited, so this is a real test of planning.","Six servings is the most.","Bok choy is the vegetable."],"limits":{"ca":1300,"vd":200,"servings":6,"max":2},"explainPrompt":"Explain how you met both the calcium and vitamin D targets within Rowan’s needs, and which single food mattered most.","vocab":"Use the words calcium, vitamin D, fortified, peak bone mass and serving.","checkLabel":"Check Rowan’s day","success":"Rowan’s day meets every condition.","more":"Can you find all the answers?","after3":"Rowan’s plan needs two fortified soy beverages for vitamin D, and two tofu servings for calcium. In real life, a health professional might also suggest a vitamin D supplement in winter.","kitchen":{"title":"Bone-builder tofu and bok choy stir-fry","intro":"Teacher-arranged: cook in the school kitchen or at home with an adult.","lines":["## Ingredients","- Calcium-set tofu","- Bok choy","- Garlic","- Ginger","- Low-sodium soy sauce (or a soy sauce labelled gluten-free)","- Rice","- Fortified soy beverage to drink","## Allergens","- Soy","- Wheat in most soy sauces. Gluten-free option: use a soy sauce labelled gluten-free.","## Steps","- Wash hands.","- Rinse the bok choy.","- Press and cube the tofu.","- Stir-fry on medium-high heat.","- Serve hot.","- Cool leftovers in a shallow container and refrigerate within 2 hours (module 15).","## Safety","- Hot oil and knives under supervision."]}},"cards":[["Obesity (clinical framing)","A complex chronic disease where excess or abnormal body fat impairs health (Obesity Canada, 2020)."],["Many causes","Biology, environment, income, stress, sleep, medications and stigma interact."],["Weight bias","Negative attitudes about body size; linked to stress and avoiding care. It harms health."],["Person-first language","“People living with obesity”, not “obese people”."],["BMI","Weight relative to height: a population screening tool that can’t measure fat, muscle or health."],["Peak bone mass","The most bone you’ll have; reached by about the late 20s to 30."],["Bone builders","Calcium, vitamin D, weight-bearing activity; not smoking."],["Non-dairy calcium","Fortified soy beverage, calcium-set tofu, canned salmon with bones, beans, almonds, greens."],["Celiac disease","Autoimmune reaction to gluten (wheat, barley, rye): strictly gluten-free."],["Iron absorption","Pair plant iron with vitamin C; keep tea and coffee away from meals."],["Allergy vs intolerance","Allergy = immune reaction (can be severe); intolerance = trouble digesting."],["Strategy levels","Personal, community, policy. Changing conditions reaches more people than blaming individuals."]]}};</script>
