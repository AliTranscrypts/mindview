.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}

.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}

.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}

.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}

ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){

.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}

.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

*{transition:none!important;animation:none!important}
}

@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

.hfa-support{margin:0;padding:12px 16px;border-left:4px solid var(--pen);background:var(--info-bg);border-radius:6px}
.hfa-support p{margin:0;max-width:none}
.mv-block:has(> .hfa-support:only-child){background:none;border:0;padding:0}
.hfa-private{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.01em;color:var(--ink-2);border:1.5px dashed var(--ink-2);border-radius:999px;padding:.05em .6em;margin-right:4px;vertical-align:.08em}
.hfa-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.hfa-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
table.hfa-nft{border-collapse:collapse;border:2px solid var(--ink);background:var(--sheet);font:400 .95rem/1.35 var(--font-ui);min-width:15rem;max-width:22rem}
.hfa-nft caption{caption-side:top;text-align:left;font-weight:700;font-size:1.25rem;padding:4px 8px 2px;border:2px solid var(--ink);border-bottom:0;background:var(--sheet)}
.hfa-nft th,.hfa-nft td{padding:3px 8px;border-bottom:1px solid var(--ink-2);text-align:left;vertical-align:baseline}
.hfa-nft td{text-align:right;font-weight:700;white-space:nowrap}
.hfa-nft thead th{font-size:.82rem;font-weight:700;border-bottom:4px solid var(--ink)}
.hfa-nft thead th + th{text-align:right}

.hfa-nft tr.cal th,.hfa-nft tr.cal td{border-bottom:4px solid var(--ink)}
.hfa-nft tr.sub th{padding-left:1.4em;font-weight:400}
.hfa-nft tbody th{font-weight:700}
.hfa-nft tr.hi th,.hfa-nft tr.hi td{background:var(--hi-soft)}
.hfa-nft tfoot td{font-size:.78rem;font-weight:400;text-align:left;white-space:normal;border-bottom:0;color:var(--ink-2)}
ul.hfa-refs{list-style:none;margin:0;padding:0}
ul.hfa-refs li{padding-left:2em;text-indent:-2em;margin:0 0 .5em;max-width:72ch;overflow-wrap:anywhere}
.hfa-kc{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
/* HFA4U 20: support (header dialog, notes), hero (plants inside a four-part ring), Food sovereignty circle (Principles /
   Timeline / Security vs sovereignty, prediction figures), Food sovereignty in action (stations), the initiative brief task.
   Tokens only. Quadrant tints (plan §5): cerulean --p-t, violet --acol, orange --p-k, blue --pen, mixed lightly into --sheet,
   labels always in --ink; strengthening = inner ring + ✚, undermining = outer ring + −. --leaf only in the plant drawing.
   Red and green appear only in feedback marks. */
/* tint helpers */
.ifs-t{--ifs-c:var(--p-t)}
.ifs-v{--ifs-c:var(--acol)}
.ifs-o{--ifs-c:var(--p-k)}
.ifs-b{--ifs-c:var(--pen)}

/* radio groups (from HFA4U 17) */
.ifs-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.ifs-rgl{font-size:.85rem;font-weight:700;color:var(--ink-2);min-width:3.6rem}
.ifs-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.ifs-chipset{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.ifs-chipset button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:34px;text-align:left;max-width:100%;font-family:var(--font-ui)}
.ifs-chipset button:hover:not(:disabled){border-color:var(--pen)}
.ifs-chipset button[aria-checked="true"],.ifs-chipset button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ifs-chipset button:disabled{opacity:.85;cursor:default}
.ifs-chipset.ifs-col1{flex-direction:column;align-items:stretch}
.ifs-chipset.ifs-col1 button{border-radius:10px}
.ifs-h4{margin:0 0 6px;font-size:1rem}
.ifs-h5{margin:0 0 4px;font-size:.95rem}
.ifs-stok{font-weight:700}

/* support */
.ifs-supbtn{white-space:nowrap}
.ifs-dlg{max-width:min(560px,calc(100vw - 32px));border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:18px 20px}
.ifs-dlg::backdrop{background:rgba(0,0,0,.45)}
.ifs-dlg-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ifs-dlg-top h2{margin:0;font-size:1.25rem}
.ifs-lines{margin:8px 0 0;padding-left:1.2em}
.ifs-lines li{margin:3px 0}
.ifs-sup p{max-width:none}
.ifs-footsup{max-width:var(--maxw,1100px);margin:18px auto 0;padding:0 16px}
.ifs-jnote{margin:0 0 10px}
.ifs-cn{padding:8px 12px;border-left:4px solid var(--ink-2);background:var(--info-bg);border-radius:6px}

/* hero */
.ifs-hero{width:100%}
.ifs-hsvg{display:block;width:100%;height:auto;max-height:420px}
.ifs-seg{fill:color-mix(in srgb,var(--ifs-c) 16%,var(--sheet));stroke:var(--ifs-c);stroke-width:1.6}
.ifs-hlab{fill:var(--ink);font:700 12.5px var(--font-ui)}
.ifs-hl1{fill:var(--ink-2);font:600 15px var(--font-ui)}
.ifs-hl2{fill:var(--ink);font:700 15.5px var(--font-ui)}
.ifs-cap{text-align:center}

/* plant drawing */
.ifs-soil{fill:var(--plate-grain-soft)}
.ifs-ground{stroke:var(--plate-grain);stroke-width:1.6}
.ifs-stalk{stroke:var(--leaf);stroke-linecap:round}
.ifs-leaf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.3;stroke-linejoin:round}
.ifs-ear{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-width:1.3}
.ifs-husk{fill:none;stroke:var(--leaf);stroke-width:1.4;stroke-linecap:round}
.ifs-tassel{stroke:var(--plate-grain);stroke-width:1.6;stroke-linecap:round}
.ifs-vine{fill:none;stroke:var(--leaf);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ifs-bleaf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.1}
.ifs-pod{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.3}
.ifs-sleaf{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.4}
.ifs-svein{fill:none;stroke:var(--leaf);stroke-width:.9;opacity:.7}
.ifs-squash{fill:var(--nu-carb-soft);stroke:var(--nu-carb);stroke-width:1.4}
.ifs-root{fill:none;stroke:var(--plate-grain);stroke-width:1.5;stroke-linecap:round}
.ifs-root.bean{stroke:var(--ink-2)}
.ifs-nod{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.3}
.ifs-shade{fill:var(--ink-2)}
.ifs-drop{fill:var(--nu-water-soft);stroke:var(--nu-water);stroke-width:1}
.ifs-lead{stroke:var(--ink-2);stroke-width:1.2}
.ifs-slab{fill:var(--ink);font:700 14px var(--font-ui)}

/* Explore layout */
.ifs-lab{margin-top:6px}
.ifs-panel{min-width:0}
.ifs-pdef{margin:0 0 10px;border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--sheet)}
.ifs-pdef summary{cursor:pointer;font-weight:700}
.ifs-pdef p{margin:6px 0}
.ifs-pdl{margin:6px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ifs-pdl > div{border-left:5px solid var(--ifs-c);background:color-mix(in srgb,var(--ifs-c) 9%,var(--sheet));border-radius:6px;padding:6px 10px}
.ifs-pdl dt{font-weight:700;font-size:.92rem}
.ifs-pdl dd{margin:2px 0 0;font-size:.9rem}
.ifs-tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px;padding:8px;border:1.5px dashed var(--rule);border-radius:10px;min-height:48px;align-items:flex-start}
.ifs-tray > p{margin:4px}
.ifs-card,.ifs-chip{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:.9rem;line-height:1.3;text-align:left;max-width:100%;min-height:34px;cursor:pointer}
.ifs-card{flex:1 1 16rem}
.ifs-card:hover:not(:disabled),.ifs-chip:hover:not(:disabled){border-color:var(--pen)}
.ifs-card[aria-pressed="true"],.ifs-chip[aria-pressed="true"]{outline:3px solid var(--hi);outline-offset:1px;border-color:var(--ink)}
.ifs-card:disabled,.ifs-chip:disabled{cursor:default;opacity:.8}
.ifs-code{font-weight:800;font-size:.82rem;border:1px solid var(--ink-2);border-radius:4px;padding:0 .35em;line-height:1.35}
.ifs-date{font-weight:700;font-size:.82rem;color:var(--ink-2)}
.ifs-ct{min-width:0}
.ifs-mk{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:0 .55em;border:1px solid var(--rule);color:var(--ink-2)}
.ifs-mk.str,.ifs-mk.und{color:var(--ink);border-color:var(--ink)}
.ifs-mk.und{border-style:dashed}
.ifs-selbar{border:1.5px solid var(--ink);border-radius:10px;padding:8px 12px;margin:0 0 10px;background:var(--paper)}
.ifs-selt{margin:0 0 6px}
.ifs-selrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ifs-mkrow{display:inline-flex;flex-wrap:wrap;gap:6px}
.ifs-selh{margin:6px 0 0}
.ifs-tgt{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border:1.5px dashed var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:.85rem;font-weight:700;min-height:32px;cursor:pointer;margin-top:4px}
.ifs-tgt:hover,.ifs-tgt:focus-visible{background:var(--hi-soft)}
.ifs-clr{margin-top:8px}
.ifs-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.ifs-new{animation:ifs-glide .45s ease-out}
@keyframes ifs-glide{from{transform:translateY(-10px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ifs-new{animation:none}}

/* Principles: four quadrants (a ring of panels on wide screens; stacked on phones) */
.ifs-circle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"tl tr" "bl br";gap:8px}
.ifs-q{display:flex;flex-direction:column;gap:6px;border:2px solid var(--ifs-c);background:color-mix(in srgb,var(--ifs-c) 9%,var(--sheet));padding:10px 12px;min-width:0;transition:border-color .3s}
.ifs-q-sac{grid-area:tl;border-radius:60px 10px 10px 10px}
.ifs-q-part{grid-area:tr;border-radius:10px 60px 10px 10px}
.ifs-q-self{grid-area:br;border-radius:10px 10px 60px 10px}
.ifs-q-pol{grid-area:bl;border-radius:10px 10px 10px 60px}
.ifs-q-sac .ifs-ring.out,.ifs-q-part .ifs-ring.out{order:-1}
.ifs-q-sac .ifs-qh,.ifs-q-part .ifs-qh{order:-2}
.ifs-q.dim{border-style:dashed;border-color:color-mix(in srgb,var(--ifs-c) 45%,var(--sheet))}
.ifs-qh{margin:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:1rem;color:var(--ink)}
.ifs-q-sac .ifs-qh,.ifs-q-part .ifs-qh{padding-left:22px}
.ifs-q-pol .ifs-qh,.ifs-q-self .ifs-qh{padding-left:0}
.ifs-qc{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.ifs-ring{border-radius:8px;padding:6px 8px;min-height:44px}
.ifs-ring.in{background:var(--sheet);border:1.5px solid var(--ifs-c)}
.ifs-ring.out{border:1.5px dashed var(--ink-2)}
.ifs-rl{margin:0;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.ifs-rl b{color:var(--ink)}
.ifs-ring.in .ifs-chip{box-shadow:0 0 0 3px color-mix(in srgb,var(--ifs-c) 30%,transparent)}
.ifs-ring.out .ifs-chip{opacity:.85;border-style:dashed}

/* Timeline */
.ifs-tlw{overflow-x:auto;border:1.5px solid var(--rule);border-radius:10px;padding:8px 8px 4px;background:var(--sheet)}
.ifs-tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(9.5rem,1fr));gap:8px;min-width:50rem;position:relative}
.ifs-tl::before{content:"";position:absolute;left:4px;right:4px;top:13px;border-top:2px solid var(--ink-2)}
.ifs-slot{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:0 2px 6px;min-width:0}
.ifs-sn{position:relative;z-index:1;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sheet);border:2px solid var(--ink);font-weight:800;font-size:.85rem}
.ifs-slot .ifs-chip{width:100%;flex-direction:column;align-items:flex-start}
.ifs-empty{font-size:.85rem;color:var(--ink-2);font-style:italic;padding:6px 2px}
.ifs-slot.off .ifs-chip{border-color:var(--ink);box-shadow:0 0 0 3px var(--hi-soft)}
.ifs-offt{font-size:.78rem;font-weight:700;background:var(--hi-soft);color:var(--hi-ink);border-radius:4px;padding:0 .4em}
.ifs-axis{display:flex;justify-content:space-between;margin:2px 4px 0;font-size:.8rem;color:var(--ink-2);min-width:50rem}
.ifs-axis span:first-child::before{content:"← "}
.ifs-axis span:last-child::after{content:" →"}
.ifs-cnote{flex:1 1 100%;border:1.5px solid var(--ink-2);border-left:5px solid var(--ink-2);border-radius:8px;padding:8px 12px;background:var(--info-bg)}
.ifs-cnote p{margin:0}
.ifs-cnbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* Security vs sovereignty grid */
.ifs-grid{display:grid;grid-template-columns:minmax(5rem,.55fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
.ifs-gh{font-size:.82rem;font-weight:700;color:var(--ink-2);padding:4px 6px}
.ifs-gh b{color:var(--ink);font-size:.95rem}
.ifs-col{text-align:center;align-self:end}
.ifs-row{align-self:center}
.ifs-cell{border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;min-height:84px;background:var(--sheet);min-width:0}
.ifs-cell-both{border:2.5px solid var(--ink)}
.ifs-cell-none{border-style:dashed}
.ifs-cl{margin:0 0 2px;font-weight:700;font-size:.9rem}
.ifs-cell .ifs-chip{font-size:.82rem;padding:4px 8px}
.ifs-tray-s{margin-top:10px}

/* readout and stage */
.ifs-readw{margin-top:12px;border-top:1.5px solid var(--rule);padding-top:8px}
.ifs-read{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.ifs-read > div{padding:5px 2px}
.ifs-stage{margin:0 0 12px;border:1.5px solid var(--rule);border-radius:10px;padding:10px;background:var(--sheet)}
.ifs-ssvg{display:block;width:100%;height:auto;max-height:320px}
.ifs-sfoot{display:flex;justify-content:flex-end;margin-top:4px}
.ifs-stage figcaption{margin-top:4px}
.ifs-p2 .ifs-scen{margin:0 0 8px;font-weight:700}
.ifs-flow{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;min-height:40px}
.ifs-flow li{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px;font-weight:700;opacity:.25;min-width:4rem;min-height:2.2em}
.ifs-flow li.on{opacity:1;border-color:var(--ink);background:var(--paper)}
.ifs-flow li + li{margin-left:20px;position:relative}
.ifs-flow li + li::before{content:"→";position:absolute;left:-18px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-weight:700}
.ifs-ladder p{margin:0 0 6px}
.ifs-rungs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ifs-rungs li{display:grid;grid-template-columns:minmax(7rem,12rem) minmax(0,1fr) 4.5rem;gap:8px;align-items:center;border-left:3px solid var(--ink-2);padding-left:8px}
.ifs-rgl2{font-size:.9rem;font-weight:700}
.ifs-rbar{display:block;height:14px;border:1.5px solid var(--rule);border-radius:3px;background:var(--sheet)}
.ifs-rbar i{display:block;height:100%;background:var(--ink)}
.ifs-rlv{font-size:.85rem;color:var(--ink-2)}
.ifs-sea{fill:var(--nu-water-soft)}
.ifs-ice{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.ifs-oldedge{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:6 5}
.ifs-land{fill:var(--plate-grain-soft);stroke:var(--plate-grain);stroke-width:1.5}
.ifs-route{stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}
.ifs-hunt{fill:var(--ink)}
.ifs-hunt.out{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.ifs-comm{fill:var(--ink)}
.ifs-mlab{fill:var(--ink-2);font:700 14.5px var(--font-ui)}
.ifs-mlab.b{fill:var(--ink);font-weight:700}

/* Part 3 */
.ifs-st{margin-top:8px}
.ifs-icardx{border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;background:var(--paper);margin:10px 0 12px}
.ifs-icardx p{margin:0 0 6px}
.ifs-idl{margin:0;display:grid;gap:6px}
.ifs-idl > div{display:grid;grid-template-columns:11rem minmax(0,1fr);gap:8px}
.ifs-idl dt{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.ifs-idl dd{margin:0}
.ifs-ask{margin:10px 0 6px}
.ifs-chipset button.ifs-t,.ifs-chipset button.ifs-v,.ifs-chipset button.ifs-o,.ifs-chipset button.ifs-b{border-color:var(--ifs-c)}
.ifs-chipset button.ifs-t[aria-pressed="true"],.ifs-chipset button.ifs-v[aria-pressed="true"],.ifs-chipset button.ifs-o[aria-pressed="true"],.ifs-chipset button.ifs-b[aria-pressed="true"]{background:color-mix(in srgb,var(--ifs-c) 20%,var(--sheet));color:var(--ink);border-width:2.5px}
.ifs-fbl{margin:4px 0 2px;padding-left:1.2em}
.ifs-sitems{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ifs-si{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.ifs-si.right{border-color:var(--green);background:var(--good-bg)}
.ifs-si.wrong{border-color:var(--red);background:var(--bad-bg)}
.ifs-sit{flex:1 1 18rem;min-width:0}
.ifs-swhy{display:block;margin-top:2px}
.ifs-data{margin-top:4px}
.ifs-drows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0}
.ifs-drow{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet);min-width:0}
.ifs-drow p{margin:4px 0}
.ifs-cover{font-size:.9rem;background:var(--hi-soft);border-radius:4px;padding:2px 6px}

/* task */
.ifs-tk{display:grid;gap:10px;margin-bottom:10px}
.ifs-fs{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;margin:0;min-width:0}
.ifs-fs legend{font-weight:700;padding:0 4px}
.ifs-checks{display:grid;gap:4px}
.ifs-ck{display:flex;gap:8px;align-items:flex-start;padding:3px 2px;cursor:pointer}
.ifs-ck input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--ink)}
.ifs-ck:has(input:disabled){opacity:.6;cursor:default}
.ifs-lab2{display:block;font-weight:700;margin-bottom:4px}
.ifs-brief{width:100%;min-height:220px;font:inherit;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);box-sizing:border-box}
.ifs-meta{margin:4px 0 0}
.ifs-okt{font-weight:700}
.ifs-flag{color:var(--ink)}
.ifs-pvcard{border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;background:var(--paper);min-height:120px}
.ifs-pvcard p{margin:0 0 6px}
.ifs-pvp{display:flex;flex-wrap:wrap;gap:4px}
.ifs-ptag{display:inline-block;font-size:.8rem;font-weight:700;border:1.5px solid var(--ifs-c);background:color-mix(in srgb,var(--ifs-c) 14%,var(--sheet));border-radius:999px;padding:0 .6em}
.ifs-pvtext{font-size:.95rem;line-height:1.5;white-space:normal;overflow-wrap:anywhere}

@media (min-width:761px){#task-pv{position:sticky;top:124px;align-self:start}}
@media (max-width:760px){
  .ifs-grid{grid-template-columns:5.3rem minmax(0,1fr) minmax(0,1fr);gap:4px}
  .ifs-gh{padding:2px;font-size:.72rem}
  .ifs-cell{padding:5px}
  .ifs-cell .ifs-tgt{font-size:.78rem;padding:3px 6px}
  .ifs-circle{grid-template-columns:minmax(0,1fr);grid-template-areas:none}
  .ifs-q-sac,.ifs-q-part,.ifs-q-self,.ifs-q-pol{grid-area:auto;border-radius:10px}
  .ifs-q-sac .ifs-ring.out,.ifs-q-part .ifs-ring.out{order:0}
  .ifs-q-sac .ifs-qh,.ifs-q-part .ifs-qh{order:0;padding-left:0}
  .ifs-pdl{grid-template-columns:minmax(0,1fr)}
  .ifs-read{grid-template-columns:minmax(0,1fr)}
  .ifs-drows{grid-template-columns:minmax(0,1fr)}
  .ifs-idl > div{grid-template-columns:minmax(0,1fr);gap:0}
  .ifs-rungs li{grid-template-columns:minmax(0,1fr) 3.6rem;}
  .ifs-rungs .ifs-rbar{grid-column:1 / -1;grid-row:2}
  .ifs-flow li + li{margin-left:18px}
}

</style>
