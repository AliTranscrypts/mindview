<script>window.MV_PAYLOAD={"meta":{"id":"20-indigenous-food-sovereignty","nn":"20","slug":"indigenous-food-sovereignty","course":"hfa4u","site":"hfa4m","code":"HFA4M","kind":"topic","groupLabel":"Unit 4","groupName":"Canadian Food Systems","trivium":"","size":"L","storageKey":"hfa4u-20-indigenous-food-sovereignty-v1","progressKey":"hfa4u-progress-v1:20-indigenous-food-sovereignty","toolkit":"1.0.9"},"course":{"course":"hfa4u","site":"hfa4m","code":"HFA4M","title":"Nutrition and Health","modules":[{"nn":"01","slug":"food-choices","title":"Factors Influencing Food Choices","kind":"topic","group":"1"},{"nn":"02","slug":"macronutrients","title":"Macronutrients: Carbohydrates, Lipids, Proteins","kind":"topic","group":"1"},{"nn":"03","slug":"micronutrients","title":"Micronutrients: Vitamins, Minerals, Water","kind":"topic","group":"1"},{"nn":"04","slug":"digestion-metabolism","title":"Digestion, Absorption & Metabolism","kind":"topic","group":"1"},{"nn":"05","slug":"food-guide-dri-energy","title":"Canada's Food Guide, DRIs & Energy Balance","kind":"topic","group":"1"},{"nn":"06","slug":"pregnancy-lactation","title":"Pregnancy & Lactation","kind":"topic","group":"2"},{"nn":"07","slug":"infant-toddler","title":"Infant & Toddler Nutrition","kind":"topic","group":"2"},{"nn":"08","slug":"children-adolescents-adults","title":"Children, Adolescents & Adults","kind":"topic","group":"2"},{"nn":"09","slug":"older-adults","title":"Older Adult Nutrition","kind":"topic","group":"2"},{"nn":"10","slug":"eating-disorders","title":"Eating Disorders","kind":"topic","group":"3"},{"nn":"11","slug":"cardiovascular-disease","title":"Cardiovascular Disease","kind":"topic","group":"3"},{"nn":"12","slug":"type-2-diabetes","title":"Type 2 Diabetes","kind":"topic","group":"3"},{"nn":"13","slug":"cancer-nutrition","title":"Cancer & Nutrition","kind":"topic","group":"3"},{"nn":"14","slug":"obesity-osteoporosis","title":"Obesity, Osteoporosis & Other Diet-Related Issues","kind":"topic","group":"3"},{"nn":"15","slug":"food-safety","title":"Foodborne Illness & Food Safety","kind":"topic","group":"3"},{"nn":"16","slug":"canadian-food-production","title":"Canadian Food Production","kind":"topic","group":"4"},{"nn":"17","slug":"agriculture-methods","title":"Conventional, Organic, GMO & Sustainable Agriculture","kind":"topic","group":"4"},{"nn":"18","slug":"processing-labelling","title":"Food Processing & Labelling","kind":"topic","group":"4"},{"nn":"19","slug":"food-security-canada","title":"Food Security in Canada","kind":"topic","group":"4"},{"nn":"20","slug":"indigenous-food-sovereignty","title":"Indigenous Food Sovereignty","kind":"topic","group":"4"},{"nn":"21","slug":"global-hunger","title":"Global Hunger & Malnutrition","kind":"topic","group":"5"},{"nn":"22","slug":"climate-food-systems","title":"Climate Change & Food Systems","kind":"topic","group":"5"},{"nn":"23","slug":"sustainability-food-waste","title":"Sustainable Agriculture & Food Waste","kind":"topic","group":"5"},{"nn":"24","slug":"food-aid-sdgs","title":"Food Aid & the Sustainable Development Goals","kind":"topic","group":"5"},{"nn":"25","slug":"ethical-food-choices","title":"Ethical Food Choices","kind":"topic","group":"5"}]},"salt":"8bf09217","content":{"id":"20-indigenous-food-sovereignty","kind":"topic","title":"Indigenous food sovereignty","topic":"Indigenous Food Sovereignty","readyTopic":"Indigenous food sovereignty","hero":{"headline":"Who decides what’s on the plate?","text":"\u003cstrong>Food security\u003c/strong> asks whether there is enough nutritious food. \u003cstrong>Food sovereignty\u003c/strong> asks who gets to decide: how food is grown, harvested, shared and governed. For many \u003cstrong>First Nations, Inuit and Métis\u003c/strong> communities, food is also relationship, ceremony, language and law. In this module you’ll learn principles that Indigenous organizations have set out, see how colonial policies disrupted \u003cstrong>Indigenous food systems\u003c/strong>, and study how communities are leading their renewal.","fig":{"html":"\u003cdiv class=\"ifs-hero\" id=\"ifs-hero\">\u003c/div>","caption":""},"aria":"A corn stalk rises from the soil, a bean vine climbs it and squash leaves spread across the ground. Around the plants, a ring in four parts is labelled Food is sacred, Participation, Self-determination and Supportive policy. Two lines appear in turn: Food security asks: is there enough? Food sovereignty asks: who decides?","caption":"Four principles of Indigenous food sovereignty around corn, beans and squash growing together.","lines":["Food security asks: is there enough?","Food sovereignty asks: who decides?"]},"goals":["I can explain the difference between food security and food sovereignty.","I can describe the principles of Indigenous food sovereignty as articulated by Indigenous organizations.","I can describe specific Indigenous food systems, naming the Nations and places they belong to.","I can explain how colonial policies and environmental harm disrupted Indigenous food systems and contribute to food insecurity today.","I can analyse how community-led initiatives strengthen food sovereignty, and how allies can support without taking over.","I can evaluate sources about Indigenous food systems for voice, perspective and accuracy."],"support":"\u003cdiv class=\"hfa-support ifs-sup\" role=\"note\">\u003cp>\u003cstrong>Support is available any time.\u003c/strong> If this history affects you or your family, talk to someone you trust, or contact:\u003c/p>\u003cul class=\"ifs-lines\">\u003cli>\u003cstrong>Indian Residential Schools Crisis Line:\u003c/strong> \u003cspan class=\"nw\">1-866-925-4419\u003c/span> (24 hours)\u003c/li>\u003cli>\u003cstrong>Hope for Wellness Help Line:\u003c/strong> \u003cspan class=\"nw\">1-855-242-3310\u003c/span>, support for Indigenous peoples across Canada, any time\u003c/li>\u003cli>\u003cstrong>Kids Help Phone:\u003c/strong> \u003cspan class=\"nw\">1-800-668-6868\u003c/span>, or text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>\u003c/li>\u003c/ul>\u003c/div>","start":{"blocks":[{"title":"Before you start","html":"\u003cp>This module looks at the food systems of \u003cstrong>First Nations, Inuit and Métis\u003c/strong> peoples, which differ from Nation to Nation and are practised today. It also covers \u003cstrong>colonial policies\u003c/strong> that caused hunger and harm, including \u003cstrong>residential schools\u003c/strong>. Read at your own pace. One card in Explore offers a short summary you can choose instead of the full card.\u003c/p>\u003cp>Nobody here is asked to speak for a community. The brief you write at the end is an analysis in your own voice.\u003c/p>"},{"html":"\u003cdiv class=\"hfa-support ifs-sup\" role=\"note\">\u003cp>\u003cstrong>Support is available any time.\u003c/strong> If this history affects you or your family, talk to someone you trust, or contact:\u003c/p>\u003cul class=\"ifs-lines\">\u003cli>\u003cstrong>Indian Residential Schools Crisis Line:\u003c/strong> \u003cspan class=\"nw\">1-866-925-4419\u003c/span> (24 hours)\u003c/li>\u003cli>\u003cstrong>Hope for Wellness Help Line:\u003c/strong> \u003cspan class=\"nw\">1-855-242-3310\u003c/span>, support for Indigenous peoples across Canada, any time\u003c/li>\u003cli>\u003cstrong>Kids Help Phone:\u003c/strong> \u003cspan class=\"nw\">1-800-668-6868\u003c/span>, or text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Food security components","goal":1,"prompt":"A family can afford groceries, but the store’s food doesn’t fit their religious diet. Which component of food security is strained?","options":[{"t":"Acceptability","why":"Food must fit culture, religion and dietary needs.","_n":"07e1","_k":"8ac1f346"},{"t":"Availability","why":"The food is in the store.","_n":"17b1","_k":"4ea403c3"},{"t":"Sustainability","why":"Nothing here is about reliability over time.","_n":"27c1","_k":"2ac489d1"},{"t":"Adequacy","why":"The issue is fit, not nutrition.","_n":"3791","_k":"40f41a8a"}],"hints":["Recall module 19’s five components.","Is it about fit or amount?","Acceptability."]},{"id":"w2","skill":"Food security components","goal":1,"prompt":"Which component describes access that holds up over time and in a crisis?","options":[{"t":"Accessibility","why":"That’s affording and reaching food now.","_n":"47a1","_k":"8ef3c671"},{"t":"Availability","why":"That’s whether food is physically there.","_n":"5771","_k":"041159ce"},{"t":"Adequacy","why":"That’s nutritional quality.","_n":"6781","_k":"2198105e"},{"t":"Sustainability","why":"Reliability over time.","_n":"7751","_k":"acd59985"}],"hints":["Which word suggests “lasting”?","Over time and in a crisis.","Sustainability."]},{"id":"w3","skill":"Nutrients in traditional foods","goal":3,"prompt":"Fatty fish such as Arctic char are especially rich in which nutrients?","options":[{"t":"Fibre and vitamin C","why":"Those come mainly from plants.","_n":"8761","_k":"728428da"},{"t":"Omega-3 fats and vitamin D","why":"Fatty fish are among the best food sources of both.","_n":"9621","_k":"e88d44d7"},{"t":"Calcium only","why":"Fish bones add calcium, but the main nutrients are fats, protein and vitamin D.","_n":"a611","_k":"0bc7bbcf"},{"t":"Mostly carbohydrates","why":"Fish has almost no carbohydrate.","_n":"b641","_k":"30c86249"}],"hints":["Think of module 02’s fats.","Fish fat is unsaturated and rich in omega-3s.","Omega-3s and vitamin D."]},{"id":"w4","skill":"Food chains","goal":4,"prompt":"A pollutant that builds up in fat becomes more concentrated at each step up a food chain. This is called…","options":[{"t":"Photosynthesis","why":"That’s how plants make sugar.","_n":"c631","_k":"833d364f"},{"t":"Decomposition","why":"That’s breakdown by decomposers.","_n":"d5e1","_k":"3d06c9bb"},{"t":"Dilution","why":"Dilution would mean less concentrated, the opposite.","_n":"e5d1","_k":"a3363c47"},{"t":"Biomagnification","why":"The concentration grows at each step up the chain.","_n":"f601","_k":"9d60f43e"}],"hints":["“Magnify” means make bigger.","It grows up the chain.","Biomagnification."]},{"id":"w5","skill":"Food chains","goal":4,"prompt":"In a lake with mercury pollution, which usually has the highest mercury concentration?","options":[{"t":"Small insects","why":"They’re low in the chain.","_n":"g5f1","_k":"93d9f513"},{"t":"Algae","why":"Algae are at the bottom of the chain.","_n":"h5a1","_k":"980cdefb"},{"t":"Large predatory fish such as walleye (pickerel)","why":"Top predators accumulate the most.","_n":"i591","_k":"e5a1492d"},{"t":"The water itself","why":"Concentrations in water are lowest; they build up in living things.","_n":"jd00","_k":"b0e43d6c"}],"hints":["Who eats whom?","Each step concentrates it.","The top predator."]},{"id":"w6","skill":"Evaluating sources","goal":6,"prompt":"Which source would best describe a particular Nation’s harvesting practices?","options":[{"t":"A travel blog","why":"An outsider’s impressions.","_n":"kd10","_k":"8d6f5ba4"},{"t":"A 1950s textbook","why":"Outdated and written from outside.","_n":"ld20","_k":"e7b31680"},{"t":"A website describing one “Indigenous diet” for all Nations","why":"Generalizes across many Nations. There are many Nations, each with its own food systems. Name the Nation and the place.","_n":"md30","_k":"c7ca1440"},{"t":"Materials published by that Nation or an Indigenous-led organization, or knowledge shared by its knowledge keepers","why":"Go to the people who hold the knowledge.","_n":"ncc0","_k":"1fbf5c11"}],"hints":["Whose knowledge is it?","Go to the people who hold it.","The Nation’s own sources."]}],"refreshers":{"Food security components":"Availability, accessibility, adequacy, acceptability, sustainability (module 19).","Nutrients in traditional foods":"Many country and traditional foods are nutrient-dense: fatty fish and marine mammals for omega-3s and vitamin D; game for iron and protein; berries for vitamin C.","Food chains":"Fat-soluble pollutants build up at each step, so top predators, and people who eat them often, take in the most.","Evaluating sources":"Ask who is speaking, from what perspective, and whether the community itself is the source."}}},"explore":{"heading":"Food sovereignty circle","intro":"Place cards on the circle to see what strengthens or undermines each principle. Then follow the timeline, and finally test the difference between food security and food sovereignty.","modes":[{"id":"circle","t":"Principles"},{"id":"time","t":"Timeline"},{"id":"grid","t":"Security vs sovereignty"}],"principles":[{"id":"sac","t":"Food is sacred","long":"Food is sacred","d":"food is a gift that comes with responsibilities to land, water, plants and animals.","tint":"t"},{"id":"part","t":"Participation","long":"Participation","d":"food sovereignty is lived through daily action: harvesting, growing, preparing and sharing.","tint":"v"},{"id":"self","t":"Self-determination","long":"Self-determination","d":"communities decide how their food is produced, harvested and distributed.","tint":"o"},{"id":"pol","t":"Supportive policy","long":"Supportive legislation and policy","d":"laws and policies respect Indigenous rights and support Indigenous food systems.","tint":"b"}],"principlesIntro":"As set out by the Working Group on Indigenous Food Sovereignty, founded in British Columbia by Dawn Morrison (Secwepemc). They are one organization’s words: many Nations describe their food systems in their own ways.","rings":{"in":"Inner ring: strengthens","out":"Outer ring: undermines"},"kcards":[{"id":"k1","code":"K1","t":"Giving thanks before a harvest, as practised in many Nations.","note":"Many Nations · the key action is giving thanks for food before it is taken.","_a":"Q0AXEgMQQlZbQEoSS1tfUBpYRFlXEEw="},{"id":"k2","code":"K2","t":"Youth spend a week at a land-based camp learning to fish, then share the catch with Elders.","note":"A land-based camp · the key actions are learning to fish and sharing the catch.","_a":"Q0AXEgMQQVZKFkQcG0BYWV9AXBJQXBNK"},{"id":"k3","code":"K3","t":"A First Nation writes and enforces its own fisheries management plan.","note":"A First Nation · the key action is deciding: the Nation writes and enforces the plan itself.","_a":"Q0AXEgMQQlJUBEQcG0BYWV9AXBJQXBNK"},{"id":"k4","code":"K4","t":"A government program helps pay harvesting costs such as fuel and equipment in northern communities.","note":"Northern communities · the key action is a government program that pays part of the cost.","_a":"Q0AXEgMQQVhUQEoSS1tfUBpYRFlXEEw="}],"tcards":[{"id":"ta","code":"T-a","date":"1870s–1880s","t":"Bison herds on the Prairies are nearly destroyed (1870s–1880s).","short":"Bison herds nearly destroyed","note":"Plains Nations · the Prairies · 1870s–1880s. Bison were central to food, clothing, trade and culture.","_a":"Q0AWX0oQCwYUQAtRS1kTDRoXCFQbTw=="},{"id":"tb","code":"T-b","date":"1889","t":"The “peasant farming” policy restricts First Nations farmers’ use of machinery and their sales (1889).","short":"“Peasant farming” policy","note":"First Nations farmers · 1889. The policy limited farmers to small-scale methods and controlled their sales.","_a":"Q0AWX0oQCwUUQAtRS1kTDRoXCFQbTw=="},{"id":"tc","code":"T-c","date":"1942–1952","t":"Nutrition experiments on First Nations children in residential schools and on adults in northern Manitoba communities (1942–1952), documented by historian Ian Mosby (2013).","short":"Nutrition experiments","note":"First Nations children in residential schools and adults in northern Manitoba communities · 1942–1952. Residential schools separated children from family food teachings and underfed them.","sum":"Government nutrition research harmed First Nations children in residential schools and adults in northern communities (1942–1952).","sumShort":"Nutrition research (summary)","sumNote":"1942–1952. You chose the short summary; it counts the same for the challenge.","_a":"Q0AWX0oQCwQUQAtRS1kTDRoXCFQbTw=="},{"id":"td","code":"T-d","date":"2007","t":"The UN General Assembly adopts the Declaration on the Rights of Indigenous Peoples (2007).","short":"UN Declaration adopted","note":"United Nations General Assembly · 2007. The Declaration sets out the rights of Indigenous peoples.","_a":"Q0AWX0oQCwMUQAtRS1kTDRoREkIbTw=="},{"id":"te","code":"T-e","date":"2021","t":"Canada passes the United Nations Declaration on the Rights of Indigenous Peoples Act (2021).","short":"Canada’s UN Declaration Act","note":"Canada · 2021. The Act implements the UN Declaration in Canada.","_a":"Q0AWX0oQCwIUQAtRS1kTDRoREkIbTw=="}],"marks":{"str":"Strengthens","und":"Undermines"},"contentNote":{"text":"The next card is about hunger and harm to children in residential schools. You can read the full card, or a short summary without detail. Support is available any time.","lines":"\u003cul class=\"ifs-lines\">\u003cli>\u003cstrong>Indian Residential Schools Crisis Line:\u003c/strong> \u003cspan class=\"nw\">1-866-925-4419\u003c/span> (24 hours)\u003c/li>\u003cli>\u003cstrong>Hope for Wellness Help Line:\u003c/strong> \u003cspan class=\"nw\">1-855-242-3310\u003c/span>, support for Indigenous peoples across Canada, any time\u003c/li>\u003cli>\u003cstrong>Kids Help Phone:\u003c/strong> \u003cspan class=\"nw\">1-800-668-6868\u003c/span>, or text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>\u003c/li>\u003c/ul>","full":"Read the full card","sum":"Read the short summary","swapFull":"Show the full card","swapSum":"Show the short summary instead"},"scards":[{"id":"s1","code":"S1","t":"More subsidized southern groceries are flown to a northern store.","short":"Subsidized groceries flown north","_a":"GhEDUxs="},{"id":"s2","code":"S2","t":"A community-run harvesting program fills a community freezer that the community manages and shares from.","short":"Community-run freezer","_a":"GgAJRFEQ"},{"id":"s3","code":"S3","t":"A court recognizes a Nation’s right to manage its fishery, but the fish are too contaminated to eat often.","short":"Fishery right, contaminated fish","_a":"GhEJRhs="},{"id":"s4","code":"S4","t":"A company opens a mine upstream without the community’s consent, and the river’s fish decline.","short":"Mine opened without consent","_a":"GgwJXlwQ"}],"sNote":"Ask two separate questions: does it bring more nutritious food? Does it give the community more control over its food system?","cols":"Improves food security?","rows":"Improves food sovereignty?","cells":[{"id":"both","t":"Both","sec":1,"sov":1},{"id":"sov","t":"Sovereignty only","sec":0,"sov":1},{"id":"sec","t":"Security only","sec":1,"sov":0},{"id":"none","t":"Neither","sec":0,"sov":0}],"predictions":[{"id":"p1","prompt":"Why have many Nations grown corn, beans and squash together?","options":[{"t":"Each completely keeps insects away from the others.","_n":"ocd0","_k":"2d5ba460"},{"t":"They each need different soil, so they share the field.","_n":"pce0","_k":"b098230a"},{"t":"They ripen at exactly the same time.","_n":"qcf0","_k":"1f010bf8"},{"t":"Corn gives beans a pole to climb, beans add nitrogen to the soil, and squash leaves shade the ground and hold in moisture.","_n":"rd80","_k":"11f4d1bf"}],"explain":"The three plants help each other grow, and together they make a balanced diet: corn’s carbohydrates, beans’ protein, squash’s vitamins. They also carry stories and teachings in Haudenosaunee and other Nations. Food also carries culture, spirituality, relationships, language and governance."},{"id":"p2","prompt":"In a northern community where hunters share country food, fuel for snowmobiles and boats doubles in price. What happens first?","options":[{"t":"The community stops sharing food.","_n":"sd90","_k":"050221b4"},{"t":"Store prices fall.","_n":"td60","_k":"0f01919c"},{"t":"Fewer hunting trips, so less country food is shared and families rely more on expensive store food.","_n":"ud50","_k":"0f2c9511"},{"t":"Nothing changes, because hunting is a hobby.","_n":"vd40","_k":"321315f4"}],"scenario":"Fuel for snowmobiles and boats: the price doubles.","flow":["Fuel cost ↑","Hunting trips ↓","Country food shared ↓","Store food bought ↑","Food costs ↑"],"explain":"Harvesting has real costs. That’s why harvesting support programs exist (for example, the Harvesters Support Grant)."},{"id":"p3","prompt":"Mercury enters a river system from industry. In which will mercury concentration be highest?","options":[{"t":"River water","_n":"wd30","_k":"74e29aea"},{"t":"Large predatory fish such as walleye","_n":"xd20","_k":"9ee1f0c7"},{"t":"Small fish","_n":"yd10","_k":"01e96686"},{"t":"Algae","_n":"zd00","_k":"0886ccbc"}],"ladder":["River water","Algae","Small fish","Large predatory fish (walleye)"],"explain":"Biomagnification. For communities whose diets and cultures centre on fishing, contamination means losing safe food and a way of life. Grassy Narrows First Nation has lived with this since the 1960s. Polluted water and thinning ice change what’s safe to eat and whether people can harvest at all."},{"id":"p4","prompt":"Sea ice forms later and breaks up earlier. Which part of the Inuit food system is affected first?","options":[{"t":"Seed supply","_n":"10cf0","_k":"f13fe66e"},{"t":"Safe travel to hunting areas","_n":"11de0","_k":"50ef87ae"},{"t":"Cooking methods","_n":"12dd0","_k":"c42958cb"},{"t":"Store prices","_n":"13640","_k":"ff04ff84"}],"explain":"Thin ice makes travel dangerous and seasons unpredictable, so harvesting becomes harder and riskier. Polluted water and thinning ice change what’s safe to eat and whether people can harvest at all."}],"challenges":[{"id":"tc1","goal":2,"prompt":"\u003cstrong>Principles\u003c/strong> mode. Place these four cards so each principle has one strengthening card.","why":"Thanks → sacred; learning and sharing → participation; deciding → self-determination; a government program → supportive policy.","hints":["Look for the key word: thanks, doing, deciding, law or program.","Thanks → sacred; learning and sharing → participation.","K1 sacred, K2 participation, K3 self-determination, K4 policy."],"msgs":{"tray":"Place all four cards on the circle first ({n} still in the tray).","k3pol":"The Nation made the plan itself. Who is deciding?","k4self":"A government program is policy. It supports, but the community isn’t the one deciding here.","outer":"Does this card help or harm the principle?","general":"Check {n} more: which key word does each card show?"}},{"id":"tc2","goal":4,"prompt":"\u003cstrong>Timeline\u003c/strong> mode. Put the five cards in date order and mark each one as strengthening or undermining food sovereignty.","why":"Losing the bison, the 1889 policy and the nutrition experiments undermined food sovereignty; the UN Declaration (2007) and Canada’s Act (2021) strengthen it.","hints":["Start with the 1800s cards.","1870s–80s, 1889, 1940s–50s, 2007, 2021.","The first three undermine; the last two strengthen."],"msgs":{"tray":"Place all five cards on the timeline first ({n} still to place).","mark":"Mark every card as strengthening or undermining ({n} not marked yet).","de":"Canada’s Act implements the UN Declaration, so the Declaration came first.","bstr":"The policy limited farmers to small-scale methods and controlled their sales: it undermined self-determination.","order":"Card {n} is out of order. Read the dates again.","general":"Check the marks: did each event help or harm food sovereignty?"}},{"id":"tc3","goal":1,"stretch":true,"prompt":"\u003cstrong>Security vs sovereignty\u003c/strong> mode. Place each scenario in the grid.","why":"Security and sovereignty can move separately. The strongest initiatives improve both.","banner":"Security and sovereignty can move separately. The strongest initiatives improve both.","hints":["Ask two separate questions for each card: more nutritious food? More control over the food system?","S2 answers yes to both. S4 answers no to both.","S1 is security only; S3 is sovereignty only."],"msgs":{"tray":"Place all four scenarios in the grid first ({n} still in the tray).","s1both":"Cheaper groceries help access, but who decides what food is produced and how? Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","s3both":"The right is recognized, but people still can’t safely eat the fish, so security hasn’t improved yet.","s4sec":"Fewer fish means less food, and no consent means less control.","general":"Ask the two questions again for each card: more nutritious food? More control?"}}],"blocks":[{"title":"What the circle shows","html":"\u003cp>\u003cstrong>Food security\u003c/strong> asks whether people have enough safe, nutritious, acceptable food. \u003cstrong>Food sovereignty\u003c/strong> asks \u003cstrong>who decides\u003c/strong> how food is produced, harvested, shared and governed. The term was brought to world attention by the peasant movement La Via Campesina at the 1996 World Food Summit.\u003c/p>\u003cp>Food sovereignty is about who decides. Colonial policies attacked exactly that, and community-led work rebuilds it.\u003c/p>"},{"title":"How colonial policies disrupted food systems","html":"\u003cp class=\"ifs-cn\">\u003cstrong>Content note:\u003c/strong> this section mentions residential schools and hunger. The support lines are in the \u003cstrong>Support\u003c/strong> button at the top of the page.\u003c/p>\u003cp>Colonial policies disrupted Indigenous food systems. They include dispossession of land, the near-destruction of the bison, Indian Act–era restrictions on First Nations farming and selling produce, and residential schools that separated children from family food teachings and underfed them, including the nutrition experiments documented by historian Ian Mosby (2013).\u003c/p>\u003cp>Contamination (such as mercury in the English–Wabigoon River system affecting Grassy Narrows First Nation) and climate change add to the harm today. Together with lower incomes and high remote food costs, these help explain why food insecurity rates are higher among Indigenous households.\u003c/p>"}]},"part3":{"slug":"action","name":"In action","heading":"Food sovereignty in action","intro":"Move from principles and history to present-day, community-led work. Analyse five initiative cards, sort what allies do from what takes over, then check what the data can and can’t show.","stations":[{"id":"s1","t":"1. Initiative cards"},{"id":"s2","t":"2. Allies, not designers"},{"id":"s3","t":"3. Check it with data"}],"cardNote":"These five cards describe kinds of initiatives that First Nations, Inuit, Métis and urban Indigenous communities lead. Your teacher may replace each with a named initiative from that community’s own materials.","s1ask":"Which principles does this initiative strengthen? Choose two or more, then check.","quoteNote":"Find how the community describes this work in its own materials, and credit it (APA).","initiatives":[{"id":"i1","code":"I1","t":"Seed keeping and Three Sisters gardens","who":"A Haudenosaunee community","does":"Gardeners grow, save and share heritage seeds for corn, beans and squash, the Three Sisters.","supports":"Land access; funding without strings","_a":"Y0AVUVoQHRVIAxREGx4TRF0OABJk"},{"id":"i2","code":"I2","t":"A land-based youth harvesting camp","who":"A First Nation","does":"Youth learn to harvest on the land with Elders and share what they harvest.","supports":"Land and water access; funding without strings","_a":"Y0AWUUtGExsaEQdTGx4TRF0OABJk"},{"id":"i3","code":"I3","t":"A community freezer and country food sharing program","who":"An Inuit community","does":"Local hunters harvest country food such as caribou and Arctic char, and the community shares it from a freezer it runs.","supports":"Funding for harvesting costs such as fuel and equipment, without strings","_a":"Y0AWUUtGExsaEQNcXxAdFUsDBRJk"},{"id":"i4","code":"I4","t":"Manoomin stewardship and harvest","who":"An Anishinaabe community","does":"The community stewards manoomin (wild rice) beds, harvests by canoe, and defends its harvest rights.","supports":"Policy recognition of harvesting rights; protection of water levels and quality","_a":"Y0AVUVoQHRVIAxREGx4TRF0OABIVEEFYVEA7"},{"id":"i5","code":"I5","t":"An urban Indigenous food hub and community kitchen","who":"An urban Indigenous organization","does":"People cook, share meals and learn together in a kitchen and food hub the organization runs.","supports":"Space and funding without strings","_a":"Y0AWUUtGExsaEQNcXxBs"}],"s1fb":{"few":"Choose at least two principles.","ok":"Those principles fit this initiative.","also":"It also shows: {list}.","pol":"This card doesn’t describe a law or government policy.","other":"This card doesn’t describe that principle. Look at what the initiative does."},"s2":{"ask":"Sort each statement: is it a respectful ally action, or does it take over?","cols":[{"id":"ally","t":"Respectful ally action"},{"id":"takes","t":"Takes over"}],"items":[{"id":"a1","t":"Advocate for policies that recognize Indigenous harvesting rights","_a":"GgMKXEAQ","why":"Backing rights and policy supports decisions the community makes itself."},{"id":"a2","t":"Follow the community’s lead and offer support when invited","_a":"GgMKXEAQ","why":"The community leads; allies help when they’re asked."},{"id":"a3","t":"Fund community-led programs without changing their goals","_a":"GgMKXEAQ","why":"Funding without strings keeps the decisions with the community."},{"id":"a4","t":"Learn from materials created by the Nation itself","_a":"GgMKXEAQ","why":"The Nation is the authority on its own food system."},{"id":"a5","t":"Act locally to protect waters and lands from pollution","_a":"GgMKXEAQ","why":"Protecting water and land where you live keeps harvests safe without taking any decision away from a community."},{"id":"t1","t":"Design a new food program for the community without asking","_a":"GhYHW1xBEw==","why":"Designing for a community without asking takes the decision away from it."},{"id":"t2","t":"Teach community members how to eat healthily","_a":"GhYHW1xBEw==","why":"Teaching people “how to eat” assumes they lack knowledge. The barriers are land, cost, contamination and policy."},{"id":"t3","t":"Sell traditional foods or ceremonies as a brand","_a":"GhYHW1xBEw==","why":"Turning a community’s foods or ceremonies into someone else’s brand takes control away from the community."},{"id":"t4","t":"Speak on behalf of the community at a meeting","_a":"GhYHW1xBEw==","why":"Communities speak for themselves. Allies can make room for them to be heard."}],"done":"All sorted. Communities lead. Allies support when invited, back rights and policy, and fund without controlling.","off":"{n} statements are in the wrong column. Ask: who decides here?"},"s3":{"intro":"Each figure below comes from a named source. Your teacher adds the latest figure and its year; check each one against the source before you use it.","rows":[{"t":"Food insecurity rates among Indigenous households","src":"PROOF, from the Canadian Income Survey","cover":"This survey doesn’t cover First Nations reserves or the territories."},{"t":"Food costs in fly-in communities compared with southern cities","src":"Nutrition North Canada reports","cover":"Reports on communities eligible for the program."},{"t":"The number of long-term drinking water advisories","src":"Indigenous Services Canada","cover":"Counts advisories on public systems on First Nations reserves."}],"figure":"Figure and year: added by your teacher from the latest report","q":"What does this survey leave out, and why does that matter?","options":[{"t":"Nothing: it covers every household in Canada","why":"No survey covers everyone. Look at the coverage line for the first source.","_n":"14650","_k":"9ecc3076"},{"t":"First Nations reserves and the territories, so national figures undercount food insecurity among Indigenous households","why":"The survey misses many of the communities where food costs are highest, so national figures undercount.","_n":"15620","_k":"0c112d3f"},{"t":"Large cities","why":"Cities are covered. Look at the coverage line for the first source.","_n":"16630","_k":"008056d2"},{"t":"Households with children","why":"Families with children are covered. Look at the coverage line for the first source.","_n":"17600","_k":"5837c2dc"}]},"blocks":[{"title":"Living food systems","html":"\u003cp>Indigenous food systems are many, specific and living. They differ by Nation, land and water. For example:\u003c/p>\u003cul>\u003cli>Haudenosaunee and other Eastern Woodlands Nations grow the \u003cstrong>Three Sisters\u003c/strong> (corn, beans, squash);\u003c/li>\u003cli>Anishinaabe communities harvest \u003cstrong>manoomin\u003c/strong> (wild rice);\u003c/li>\u003cli>Inuit communities rely on \u003cstrong>country food\u003c/strong> (such as caribou, seal and Arctic char) and its sharing networks;\u003c/li>\u003cli>Pacific Coast Nations steward salmon and clam gardens;\u003c/li>\u003cli>Métis harvesters hunt and gather.\u003c/li>\u003c/ul>\u003cp>These are present-day practices, not only history.\u003c/p>"},{"title":"Communities lead","html":"\u003cp>Communities lead revitalization: seed keeping, harvesting programs, land-based learning, community freezers and the stewardship of waters. Allies support by respecting rights, backing policy change and following community leadership, never by designing solutions \u003cem>for\u003c/em> communities.\u003c/p>"},{"title":"Sources named in this module (APA 7)","html":"\u003cul class=\"hfa-refs\">\u003cli>Mosby, I. (2013). Administering colonial science: Nutrition research and human biomedical experimentation in Aboriginal communities and residential schools, 1942–1952. \u003ci>Histoire sociale/Social History, 46\u003c/i>(91), 145–172.\u003c/li>\u003cli>United Nations General Assembly. (2007). \u003ci>United Nations Declaration on the Rights of Indigenous Peoples\u003c/i> (A/RES/61/295). United Nations.\u003c/li>\u003cli>\u003ci>United Nations Declaration on the Rights of Indigenous Peoples Act\u003c/i>, S.C. 2021, c. 14.\u003c/li>\u003c/ul>"}],"quickCheck":{"title":"In action quick check","summary":"In action quick check","items":[{"id":"q1","goal":5,"prompt":"Who should lead a community’s food sovereignty initiative?","choices":[{"t":"The community or Nation","fb":"Right. Self-determination means the community decides.","_n":"18610","_k":"b5f5df31"},{"t":"An outside charity","fb":"Self-determination means the community decides.","_n":"195e0","_k":"c456911a"},{"t":"A food company","fb":"Self-determination means the community decides.","_n":"1a5f0","_k":"72b1e991"},{"t":"A school club","fb":"Self-determination means the community decides.","_n":"1b5c0","_k":"e91b20ff"}]},{"id":"q2","goal":5,"prompt":"Which is a respectful ally action?","choices":[{"t":"Advocating for policies that recognize harvesting rights","fb":"Right. Support rights and follow community leadership.","_n":"1c5d0","_k":"03c7a6ba"},{"t":"Speaking for them","fb":"Support rights and follow community leadership.","_n":"1dca0","_k":"b3a89e1d"},{"t":"Designing a program for them without asking","fb":"Support rights and follow community leadership.","_n":"1ec90","_k":"9e8c598c"},{"t":"Teaching them how to eat healthily","fb":"Support rights and follow community leadership.","_n":"1fcc0","_k":"5a83ec41"}]},{"id":"q3","goal":2,"prompt":"A seed-keeping network gives thanks before planting. Which principle does this show most directly?","choices":[{"t":"Food is sacred","fb":"Right. Giving thanks shows food as a sacred gift.","_n":"1gcb0","_k":"83bbe8fe"},{"t":"Self-determination","fb":"Giving thanks shows food as a sacred gift.","_n":"1hce0","_k":"db28a035"},{"t":"Supportive policy","fb":"Giving thanks shows food as a sacred gift.","_n":"1icd0","_k":"1decb0ed"},{"t":"Participation","fb":"Giving thanks shows food as a sacred gift.","_n":"1jd00","_k":"4fed54a7"}]},{"id":"q4","goal":2,"prompt":"A Nation writing its own fishery plan shows…","choices":[{"t":"Supportive policy","fb":"The community decides how its fishery is run.","_n":"1kcf0","_k":"c7237621"},{"t":"Self-determination","fb":"Right. The community decides how its fishery is run.","_n":"1ld20","_k":"ba42af30"},{"t":"Availability","fb":"The community decides how its fishery is run.","_n":"1md10","_k":"5ffbc4a9"},{"t":"Food is sacred","fb":"The community decides how its fishery is run.","_n":"1n580","_k":"77bafd98"}]}]}},"practice":{"activities":[{"id":"terms","type":"match","title":"Terms and meanings","summary":"Terms and meanings","goal":[1,2,3],"instruction":"Tap a term, then tap its meaning. One meaning has no partner.","how":"","leftTitle":"Term","rightTitle":"Meaning","left":[{"id":"l1","t":"Food sovereignty","hints":["Look for the key idea in the term.","It’s about the right to define a food system, not only about having enough food.","Food sovereignty ↔ the right of peoples to define their own food systems."]},{"id":"l2","t":"Country food","hints":["Look for the key idea in the term.","Food harvested from the land and water, in the North.","Country food ↔ food harvested from the land and water, such as caribou, seal and Arctic char."]},{"id":"l3","t":"Three Sisters","hints":["Look for the key idea in the term.","Three plants grown together.","Three Sisters ↔ corn, beans and squash grown together."]},{"id":"l4","t":"Manoomin","hints":["Look for the key idea in the term.","It grows in lakes and rivers.","Manoomin ↔ wild rice, harvested by Anishinaabe communities."]},{"id":"l5","t":"Biomagnification","hints":["Look for the key idea in the term.","“Magnify”: something gets more concentrated up a food chain.","Biomagnification ↔ a pollutant’s concentration rising at each step up a food chain."]},{"id":"l6","t":"Self-determination","hints":["Look for the key idea in the term.","A people deciding for themselves.","Self-determination ↔ a people deciding for themselves how they live and govern."]},{"id":"l7","t":"UN Declaration on the Rights of Indigenous Peoples","hints":["Look for the key idea in the term.","An international declaration, followed by a Canadian Act.","UN Declaration ↔ adopted in 2007; Canada passed an Act to implement it in 2021."]},{"id":"l8","t":"Traditional knowledge","hints":["Look for the key idea in the term.","Knowledge passed on within communities.","Traditional knowledge ↔ knowledge held and passed on within communities."]}],"right":[{"id":"r1","t":"The right of peoples to define their own food systems, including healthy, culturally appropriate food produced in sustainable ways"},{"id":"r2","t":"Food harvested from the land and water, such as caribou, seal and Arctic char in many Inuit communities"},{"id":"r3","t":"Corn, beans and squash grown together by Haudenosaunee and other Nations"},{"id":"r4","t":"Wild rice, harvested from lakes and rivers by Anishinaabe communities"},{"id":"r5","t":"A pollutant’s concentration rising at each step up a food chain"},{"id":"r6","t":"A people deciding for themselves how they live and govern, including their food systems"},{"id":"r7","t":"A UN declaration of Indigenous peoples’ rights, adopted in 2007; Canada passed an Act to implement it in 2021"},{"id":"r8","t":"Knowledge held and passed on within communities about land, food and relationships"},{"id":"r9","t":"Having enough safe, nutritious, acceptable food"}],"_a":"Q0AKARsIE0UJQEoSVQATDRoQVBIVEF0EGlhEQgoQHRVUVkQKG0AFFRRACgUbCBNFDUBKElUEEw0aEFASFRBdABpYREIOEB0VVFpEChtACRVF","wrong":{"l1|r9":"That’s food security. Sovereignty is about who decides.","l6|r9":"That’s food security. Self-determination is about who decides."},"wrongDefault":"Look for the key idea in the term."},{"id":"sources","type":"mc","title":"Source and voice","summary":"Source and voice","star":true,"goal":6,"instruction":"Choose the best answer for each item. Items 3 to 6 are non-routine (★).","items":[{"id":"v1","goal":6,"prompt":"You want to learn about a particular Nation’s harvesting practices. Which source should come first?","options":[{"t":"An encyclopedia","why":"Useful background, but the Nation is the primary authority on its own practices.","_n":"1o590","_k":"b0c5a484"},{"t":"The Nation’s own publications or knowledge keepers","why":"The Nation is the primary authority on its own practices.","_n":"1p5a0","_k":"3b0a7890"},{"t":"A travel blog by a visitor","why":"An outsider’s impressions.","_n":"1q5b0","_k":"942f1585"},{"t":"A social media post by someone outside the Nation","why":"An outside view, with no check on accuracy.","_n":"1r5c0","_k":"5d220a6f"}],"hints":["Who is speaking, from where, and when?","Prefer the community’s own voice for its own experience.","The answer: the Nation’s own publications or knowledge keepers."]},{"id":"v2","goal":6,"prompt":"A website says “Native Americans ate mostly corn.” What’s the main problem?","options":[{"t":"Nothing: some Nations grow corn","why":"Some Nations grow corn, but the sentence lumps all Nations together and puts them in the past.","_n":"1s5d0","_k":"d43d8bfd"},{"t":"It’s spelled wrong","why":"The problem is the generalization.","_n":"1t5e0","_k":"1cfcb32b"},{"t":"It generalizes across many different Nations and places (and uses the past tense)","why":"There are many Nations, each with its own food systems. Name the Nation and the place. These food systems are living. Seed keepers, harvesters and fishers practise them today.","_n":"1u5f0","_k":"593b5682"},{"t":"It should say wheat instead of corn","why":"Swapping one food for another keeps the problem: one diet for many Nations.","_n":"1v500","_k":"8fa5cc28"}],"hints":["Who is speaking, from where, and when?","Prefer the community’s own voice for its own experience.","The answer: it generalizes across many different Nations and places, and uses the past tense."]},{"id":"v3","goal":[6,4],"prompt":"★ A government report and a community-led report give different reasons why country food use has fallen. What’s the best research approach?","options":[{"t":"Average the two reports’ reasons","why":"Reasons can’t be averaged. Note whose perspective each represents.","_n":"1w510","_k":"75527c24"},{"t":"Use only the government report: it’s official","why":"Official doesn’t mean complete. Whose experience is it?","_n":"1x5e0","_k":"bc3cb4df"},{"t":"Use whichever report is shorter","why":"Length doesn’t decide credibility. Compare perspective, dates and methods.","_n":"1y5d0","_k":"d5a6017b"},{"t":"Read both; note whose perspective each represents; give weight to the community’s account of its own experience; compare dates and methods","why":"Each report shows a perspective. The community’s account carries weight for its own experience, and dates and methods show how each was made.","_n":"1z5c0","_k":"956f8834"}],"hints":["Who is speaking, from where, and when?","Prefer the community’s own voice for its own experience.","The answer: read both, note whose perspective each represents, give weight to the community’s account of its own experience, and compare dates and methods."]},{"id":"v4","goal":6,"prompt":"★ Which is the best research question (A1.3)?","options":[{"t":"“Why don’t Indigenous families eat healthy food?”","why":"That’s a deficit question that assumes the answer. The causes are colonial policies, income, high remote costs, contamination and climate change, not a lack of knowledge or care.","_n":"205b0","_k":"4e13fa3d"},{"t":"“How do community members describe the effects of harvesting supports on country food sharing in one Nunavut community?”","why":"It names one community and lets its members describe their own experience.","_n":"21620","_k":"a8d6f42a"},{"t":"“Is country food better than store food?”","why":"Too broad: better for what, for whom, and who decides? A good question names a community and lets its members speak.","_n":"22610","_k":"ca6d41d9"},{"t":"“What is the Indigenous diet?”","why":"There are many Nations, each with its own food systems. Name the Nation and the place.","_n":"23600","_k":"f685b79d"}],"hints":["Who is speaking, from where, and when?","Prefer the community’s own voice for its own experience.","The answer: the question about how community members in one Nunavut community describe the effects of harvesting supports."]},{"id":"v5","goal":6,"prompt":"★ Two peer-reviewed articles study one First Nation’s food system. One was co-authored with the community; one had no community involvement. Which is stronger evidence for the community’s experience, and why?","options":[{"t":"The article with no community involvement: outsiders are more objective","why":"Outsiders can miss what matters most to the community. Whose experience is it?","_n":"245f0","_k":"fab0fa6d"},{"t":"The co-authored article: it includes the community’s voice and consent","why":"For the community’s own experience, its voice and consent matter.","_n":"25560","_k":"0cad9623"},{"t":"Whichever is newer","why":"Dates matter, but the question is whose voice and consent are included.","_n":"26550","_k":"686dc718"},{"t":"Neither; peer review makes them equal","why":"Peer review checks methods, not whose voice is included.","_n":"27cbf","_k":"91a73792"}],"hints":["Who is speaking, from where, and when?","Prefer the community’s own voice for its own experience.","The answer: the co-authored article, because it includes the community’s voice and consent."]},{"id":"v6","goal":6,"prompt":"★ An article from 1975 describes “Indigenous diets” in general. What’s its main limitation?","options":[{"t":"It’s too short","why":"Length isn’t the issue: age, perspective and generalization are.","_n":"28ccf","_k":"1c8ed598"},{"t":"It uses too many statistics","why":"Statistics aren’t the issue: age, perspective and generalization are.","_n":"29c9f","_k":"fc77e627"},{"t":"It has no pictures","why":"Pictures aren’t the issue: age, perspective and generalization are.","_n":"2acaf","_k":"6920fa47"},{"t":"It’s outdated, written from outside, and generalizes across Nations","why":"Age, perspective and generalization all limit it. There are many Nations, each with its own food systems. Name the Nation and the place.","_n":"2bcff","_k":"ee489a44"}],"hints":["Who is speaking, from where, and when?","Prefer the community’s own voice for its own experience.","The answer: it’s outdated, written from outside, and generalizes across Nations."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Uchenna","goal":[1,3,4],"instruction":"Uchenna made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":4,"task":"Explain why food insecurity rates are higher among Indigenous households.","steps":["“Research shows higher food insecurity rates among Indigenous households.”","“Colonial policies took many communities’ lands and restricted harvesting and farming.”","“Residential schools separated children from family food teachings.”","“So the main cause today is that Indigenous families don’t value healthy food.”"],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"“Step 4 is correct.”","why":"The causes are colonial policies, income, high remote costs, contamination and climate change, not a lack of knowledge or care.","_n":"2cd0f","_k":"d06cf311"},{"t":"“So the cause today is genetics.”","why":"Unsupported; the causes are social and environmental.","_n":"2dcdf","_k":"ed5c297f"},{"t":"“Today’s gaps reflect these histories plus lower incomes, high food costs in remote communities, and contamination and climate impacts on harvesting.”","why":"The causes are colonial policies, income, high remote costs, contamination and climate change, not a lack of knowledge or care.","_n":"2ecef","_k":"8ac6f754"},{"t":"“So the problem ended when the schools closed.”","why":"The effects continue, and new harms have been added.","_n":"2fd3f","_k":"342faea7"}],"hints":["Does step 4 follow from steps 2 and 3?","It blames people instead of the causes.","Policies, income, cost, contamination, climate."]},{"id":"e2","goal":3,"task":"Describe the Three Sisters.","steps":["“The Three Sisters are corn, beans and squash grown together.”","“Indigenous people all grew the Three Sisters.”","“The beans add nitrogen to the soil for the corn.”"],"_a":"CQ==","stepFb":["Step 1 is correct.","","Step 3 is correct, but there’s an earlier mistake."],"fixes":[{"t":"“Indigenous people used to grow the Three Sisters.”","why":"These gardens are grown today too. These food systems are living. Seed keepers, harvesters and fishers practise them today.","_n":"2gd4f","_k":"e2251de1"},{"t":"“Only the Haudenosaunee have ever grown corn.”","why":"Other Nations grow corn as well; the point is that systems differ.","_n":"2h51f","_k":"289b2f14"},{"t":"“Haudenosaunee and other Eastern Woodlands Nations grow the Three Sisters. Food systems differ by Nation and land: other Nations centre salmon, manoomin, caribou or bison.”","why":"There are many Nations, each with its own food systems. Name the Nation and the place.","_n":"2i50f","_k":"7f97b88b"},{"t":"“Step 2 is correct.”","why":"There are many Nations, each with its own food systems. Name the Nation and the place.","_n":"2j53f","_k":"d964dd90"}],"hints":["Is any food system shared by all Nations?","No: food systems are specific to land and Nation.","Name the Nations."]},{"id":"e3","goal":1,"task":"Is shipping more subsidized groceries north an example of food sovereignty?","steps":["“A subsidy can lower store prices.”","“Lower prices can improve access to food.”","“Because access improves, the community has more control over its food system, so this is food sovereignty.”"],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"“Sovereignty only means growing all your own food.”","why":"It’s about control and decision-making, not total self-sufficiency.","_n":"2k52f","_k":"6b6c153c"},{"t":"“Step 3 is correct.”","why":"Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"2l4df","_k":"12a2c126"},{"t":"“It may improve food security, but sovereignty is about who decides how food is produced, harvested and governed. A subsidy decided and run elsewhere doesn’t change that.”","why":"Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"2m4cf","_k":"dffacf93"},{"t":"“It’s neither security nor sovereignty.”","why":"It can help access.","_n":"2n4ff","_k":"9e78eece"}],"hints":["What does sovereignty ask?","Who decides?","Security yes; sovereignty not necessarily."]}]}]},"reflect":{"journalNote":"Your journal stays on this device. Write in your own voice.","blocks":[{"html":"\u003cdiv class=\"hfa-support ifs-sup\" role=\"note\">\u003cp>\u003cstrong>Support is available any time.\u003c/strong> If this history affects you or your family, talk to someone you trust, or contact:\u003c/p>\u003cul class=\"ifs-lines\">\u003cli>\u003cstrong>Indian Residential Schools Crisis Line:\u003c/strong> \u003cspan class=\"nw\">1-866-925-4419\u003c/span> (24 hours)\u003c/li>\u003cli>\u003cstrong>Hope for Wellness Help Line:\u003c/strong> \u003cspan class=\"nw\">1-855-242-3310\u003c/span>, support for Indigenous peoples across Canada, any time\u003c/li>\u003cli>\u003cstrong>Kids Help Phone:\u003c/strong> \u003cspan class=\"nw\">1-800-668-6868\u003c/span>, or text CONNECT to \u003cspan class=\"nw\">686868\u003c/span>\u003c/li>\u003c/ul>\u003c/div>"}],"journal":[{"id":"j1","q":"What changed in how you think about the difference between food security and food sovereignty?"},{"id":"j2","q":"In your own words, why can’t more food deliveries alone repair what colonial policies disrupted?"},{"id":"j3","q":"Explain to a friend one Indigenous food system you learned about, naming the Nation and the place."},{"id":"j4","q":"What’s one action you could take as an ally that follows Indigenous leadership? What will you do next?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which question does food sovereignty ask that food security doesn’t?","options":[{"t":"“Is the food nutritious?”","why":"That’s adequacy.","_n":"2o4ef","_k":"a1b3358c"},{"t":"“Is there enough food in the store?”","why":"That’s availability, a food security question. Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"2p59f","_k":"acfb1c34"},{"t":"“Can people afford the food?”","why":"That’s accessibility.","_n":"2q58f","_k":"1badd998"},{"t":"“Who decides how food is produced, harvested and shared?”","why":"That’s the sovereignty question: who decides.","_n":"2r88b","_k":"9efad787"}]},"b":{"prompt":"Which best defines food sovereignty?","options":[{"t":"The right of peoples to define their own food systems, including healthy, culturally appropriate food produced in sustainable ways","why":"Peoples define their own food systems: that’s who decides.","_n":"2s87b","_k":"c0446f45"},{"t":"Having enough calories every day","why":"Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"2t86b","_k":"584bf04c"},{"t":"A charity’s program to deliver food","why":"Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"2u85b","_k":"847c375e"},{"t":"Importing food from many countries","why":"That’s about trade, not control.","_n":"2v84b","_k":"52744b3c"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which is one of the principles of Indigenous food sovereignty described by the Working Group on Indigenous Food Sovereignty?","options":[{"t":"Profitability","why":"Not one of the principles.","_n":"2w83b","_k":"3bb57f62"},{"t":"Participation","why":"Food sovereignty is lived through daily practice.","_n":"2x82b","_k":"013d2ee7"},{"t":"Export growth","why":"Not one of the principles.","_n":"2y81b","_k":"8c998e26"},{"t":"Calorie targets","why":"Not one of the principles.","_n":"2z90b","_k":"aa2b3927"}]},"b":{"prompt":"The principle that communities decide how their food is produced, harvested and distributed is…","options":[{"t":"Participation","why":"That’s about daily action.","_n":"308fb","_k":"499963ff"},{"t":"Food is sacred","why":"That’s about food as a gift with responsibilities.","_n":"3182b","_k":"95dd0d86"},{"t":"Self-determination","why":"Communities deciding for themselves is self-determination.","_n":"3283b","_k":"3dbad757"},{"t":"Supportive policy","why":"That’s about laws and policies that respect rights.","_n":"3384b","_k":"9c2c0caa"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"The Three Sisters, grown by the Haudenosaunee and other Nations, are…","options":[{"t":"squash, potatoes and beans","why":"Potatoes aren’t one of the Three Sisters.","_n":"3485b","_k":"ec743054"},{"t":"beans, sunflowers and tobacco","why":"Not the Three Sisters.","_n":"357eb","_k":"43bf11c4"},{"t":"corn, wild rice and berries","why":"Wild rice (manoomin) is harvested from lakes and rivers.","_n":"367fb","_k":"afa8d0a0"},{"t":"corn, beans and squash","why":"Corn, beans and squash grown together; each helps the others grow.","_n":"3780b","_k":"ea30e26d"}]},"b":{"prompt":"Manoomin, harvested by Anishinaabe communities, is…","options":[{"t":"a berry","why":"It’s a grass seed (wild rice).","_n":"3881b","_k":"5b459b9c"},{"t":"a kind of fish","why":"Manoomin is a grain.","_n":"398ab","_k":"8a8d0a69"},{"t":"a type of corn","why":"Corn is one of the Three Sisters.","_n":"3a8bb","_k":"033ede86"},{"t":"wild rice, harvested from lakes and rivers","why":"Manoomin is wild rice, a grass seed.","_n":"3b94b","_k":"ee36f917"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Mercury enters a river system. Why are people who often eat walleye from it at the highest risk?","options":[{"t":"Walleye produce mercury themselves","why":"The mercury comes from pollution.","_n":"3c93b","_k":"23281986"},{"t":"Cooking removes mercury","why":"Cooking doesn’t remove mercury.","_n":"3d96b","_k":"83a39d14"},{"t":"Mercury evaporates from the water, so fish are safe","why":"Polluted water and thinning ice change what’s safe to eat and whether people can harvest at all.","_n":"3e95b","_k":"297718aa"},{"t":"Mercury concentrates at each step up the food chain, so predatory fish carry the most, and people who eat them often take in the most","why":"Biomagnification: each step up the chain concentrates mercury.","_n":"3f90b","_k":"93ade94f"}]},"b":{"prompt":"Persistent pollutants carried north on air currents build up in the fat of Arctic marine mammals. Why does this matter for Inuit food systems?","options":[{"t":"Pollutants only affect the animals, not people","why":"Polluted water and thinning ice change what’s safe to eat and whether people can harvest at all.","_n":"3g8fb","_k":"d27d141c"},{"t":"These fatty country foods are nutritionally and culturally important, so contamination forces harmful trade-offs","why":"The foods where pollutants build up are the ones that matter most for nutrition and culture.","_n":"3h92b","_k":"0f3c27ef"},{"t":"It doesn’t matter, because Arctic food is store-bought","why":"Country food remains central in many communities.","_n":"3i91b","_k":"767becda"},{"t":"Freezing removes the pollutants","why":"Freezing doesn’t remove them.","_n":"3j8cb","_k":"c461f75c"}]}},{"id":"t2","cat":"T","goal":1,"a":{"prompt":"A charity in a southern city ships canned food to a northern community every winter. What does this change?","options":[{"t":"It may improve food security in the short term, but not food sovereignty","why":"Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"3k8bb","_k":"7e6e6997"},{"t":"It improves food sovereignty, because more food arrives","why":"Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"3l8eb","_k":"c7921dcc"},{"t":"It changes neither","why":"It can help access for a while.","_n":"3m8fb","_k":"2a59c9fe"},{"t":"It improves both, permanently","why":"It’s short-term and decided elsewhere.","_n":"3n8cb","_k":"e6515250"}]},"b":{"prompt":"A Nation regains control of its fishery and runs a youth harvesting program, but fish stocks are low this year. What does this change?","options":[{"t":"Neither, because there are few fish","why":"Control has been regained; that’s sovereignty.","_n":"3o8db","_k":"c0f3852e"},{"t":"Food sovereignty is strengthened now; food security may improve as stocks recover","why":"Control is regained now; more food depends on the fish stocks.","_n":"3p92b","_k":"d45a8b87"},{"t":"Food security only","why":"The change in control is about sovereignty.","_n":"3q93b","_k":"8f9c65f8"},{"t":"Both, immediately","why":"Low stocks limit food security this year.","_n":"3r90b","_k":"f52913f8"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Food insecurity rates are higher among Indigenous households in Canada. Which explanation is best supported?","options":[{"t":"Genetics alone","why":"Unsupported; the causes are social and environmental.","_n":"3s91b","_k":"75eb32bc"},{"t":"A lack of interest in healthy food","why":"The causes are colonial policies, income, high remote costs, contamination and climate change, not a lack of knowledge or care.","_n":"3t86b","_k":"ee69475b"},{"t":"Traditional foods are less nutritious","why":"Many are highly nutrient-dense.","_n":"3u87b","_k":"18b9c433"},{"t":"The combined effects of colonial policies (land dispossession, restrictions on farming and harvesting, residential schools), lower incomes, high food costs in remote communities, and contamination and climate impacts on harvesting","why":"The causes are colonial policies, income, high remote costs, contamination and climate change, not a lack of knowledge or care.","_n":"3v10a","_k":"f1d103f2"}]},"b":{"prompt":"Why did the near-destruction of the bison in the 1870s–80s cause such severe hunger among Plains Nations?","options":[{"t":"The Nations chose to stop hunting","why":"The causes are colonial policies, income, high remote costs, contamination and climate change, not a lack of knowledge or care.","_n":"3w0fa","_k":"86441365"},{"t":"Bison were a minor food source","why":"They were central.","_n":"3x0ea","_k":"882b8d39"},{"t":"Bison were central to food, clothing, trade and culture. With them gone, and Nations confined to reserves with inadequate rations, starvation and dependence followed","why":"A central food source was lost while Nations were confined to reserves with inadequate rations.","_n":"3y0da","_k":"29bfdb8e"},{"t":"Crops immediately replaced the bison","why":"Farming was restricted and slow to establish (see T-b).","_n":"3z14a","_k":"892f8b45"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which sentence avoids generalizing across Indigenous peoples?","options":[{"t":"“Indigenous people traditionally ate wild rice.”","why":"Which Nations, and where? There are many Nations, each with its own food systems. Name the Nation and the place.","_n":"4013a","_k":"34252009"},{"t":"“Native foods were simple.”","why":"There are many Nations, each with its own food systems. Name the Nation and the place. These food systems are living. Seed keepers, harvesters and fishers practise them today.","_n":"4112a","_k":"112f2f85"},{"t":"“Many Anishinaabe communities harvest manoomin in late summer and early fall.”","why":"It names the Nation, the food and the season, in the present tense.","_n":"4211a","_k":"e3aae5ea"},{"t":"“All Indigenous cultures share the same foods.”","why":"There are many Nations, each with its own food systems. Name the Nation and the place.","_n":"4308a","_k":"dbf4fca6"}]},"b":{"prompt":"Which sentence avoids describing Indigenous food systems only in the past?","options":[{"t":"“Haudenosaunee seed keepers continue to grow and share Three Sisters seeds today.”","why":"A named Nation and a living practice, in the present tense.","_n":"4407a","_k":"f12786c9"},{"t":"“Indigenous people used to grow the Three Sisters.”","why":"These food systems are living. Seed keepers, harvesters and fishers practise them today.","_n":"458aa","_k":"462418e1"},{"t":"“Traditional foods were lost long ago.”","why":"These food systems are living. Seed keepers, harvesters and fishers practise them today.","_n":"468ba","_k":"ababba09"},{"t":"“Indigenous food was part of history.”","why":"These food systems are living. Seed keepers, harvesters and fishers practise them today.","_n":"478ca","_k":"29179c81"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which statement best describes an ally’s role in Indigenous food sovereignty?","options":[{"t":"“Follow community leadership, support rights and policy change, and fund without controlling.”","why":"That’s allyship: the community leads.","_n":"488da","_k":"d20c736e"},{"t":"“Teach communities about nutrition.”","why":"Teaching people “how to eat” assumes they lack knowledge. The barriers are land, cost, contamination and policy.","_n":"498ea","_k":"b078ee99"},{"t":"“Design better food programs for communities.”","why":"Communities lead. Allies support when invited, back rights and policy, and fund without controlling.","_n":"4a8fa","_k":"7e1b0b7a"},{"t":"“Speak on behalf of communities at public meetings.”","why":"Communities lead. Allies support when invited, back rights and policy, and fund without controlling.","_n":"4b90a","_k":"e9958af8"}]},"b":{"prompt":"A student group wants to help a nearby First Nation’s food program. What’s the best first step?","options":[{"t":"“Contact the community or its organization, ask what support (if any) is wanted, and follow their lead.”","why":"Ask first, then follow the community’s lead.","_n":"4c91a","_k":"c49f8527"},{"t":"“Write a nutrition guide for the community.”","why":"Teaching people “how to eat” assumes they lack knowledge. The barriers are land, cost, contamination and policy.","_n":"4d82a","_k":"62d9555f"},{"t":"“Start a food drive and deliver it to the community.”","why":"Ask first. Communities lead. Allies support when invited, back rights and policy, and fund without controlling.","_n":"4e83a","_k":"a5a684a7"},{"t":"“Post about the community online to raise awareness.”","why":"Ask before speaking about a community.","_n":"4ffca","_k":"1c8c366a"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A community freezer program shares country food harvested by local hunters, run by the community. Which two principles does it most directly strengthen?","options":[{"t":"Supportive policy and food is sacred","why":"It’s community-run action, not a law.","_n":"4gfba","_k":"e426dbae"},{"t":"None; it’s only about food security","why":"It’s community-run, which is about control. Deliveries can help food security; sovereignty is about who decides how food is produced, harvested and governed.","_n":"4hfea","_k":"46afe4da"},{"t":"Supportive policy only","why":"Nothing here is a law or government program.","_n":"4ifda","_k":"d11ba4b6"},{"t":"Participation and self-determination","why":"Hunters and households take part, and the community runs it.","_n":"4j00a","_k":"e6c230a8"}]},"b":{"prompt":"A seed-keeping network saves and shares heritage seeds, with ceremonies of thanks at planting. Which two principles does it most directly strengthen?","options":[{"t":"Supportive policy only","why":"Not a government action.","_n":"4kffa","_k":"41f07256"},{"t":"Food is sacred and participation","why":"Thanks at planting shows food as sacred; saving and sharing seed is participation.","_n":"4l02a","_k":"6a0e907c"},{"t":"Supportive policy and self-determination","why":"No law is involved; the ceremony points to sacredness.","_n":"4m01a","_k":"c17ebf01"},{"t":"None","why":"Seed keeping is food sovereignty in action. Food also carries culture, spirituality, relationships, language and governance.","_n":"4n04a","_k":"7e20b7fb"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A First Nation has a long-term drinking water advisory. What i eans the community.","Swap any “takes over” action for one that follows the community’s lead.","Add a source in the community’s or an Indigenous-led organization’s own voice.","Keep it to 120–220 words.","Cite in APA: (Author, Year) or (Author, n.d.).","Name the Nation and write in the present tense: these food systems are living."],"explainPrompt":"Explain how you chose the principles and ally actions, and why your sources are credible for this community’s experience.","vocab":"Use the words food sovereignty, self-determination, participation and ally.","success":"Your brief meets every line!","checkLabel":"Check my brief","leads":[{"id":"community","t":"Community or Nation"},{"id":"charity","t":"Outside charity"},{"id":"gov","t":"Government"},{"id":"company","t":"Company"}],"evidence":[{"id":"own","t":"The Nation’s or community’s own materials"},{"id":"org","t":"A report from an Indigenous-led organization"},{"id":"peer","t":"Peer-reviewed research co-authored with the community"},{"id":"blog","t":"A general blog"}],"blocked":["the Indigenous diet","all Indigenous","Indigenous people used to","traditions were lost","primitive"],"labels":{"init":"Initiative","princ":"Principles strengthened","princSub":"choose 2 or more","lead":"Who leads","ally":"Ally actions","allySub":"choose 2","ev":"Evidence","evSub":"choose 1 to 3","brief":"Your brief","briefSub":"120–220 words, saved on this device","words":"{n} words (120–220)","cites":"Citations found: {list}","noCite":"No APA citation found yet, e.g. (Author, 2023) or (Author, n.d.)","flagged":"Rewrite: {list}","pick":"Choose an initiative card first.","save":"Save the brief as a text file","saved":"Saved as a text file.","noSave":"Saving didn’t work in this browser."}},"cards":[["Food sovereignty","Peoples’ right to define their own food systems: who decides how food is produced, harvested, shared and governed."],["Food security vs sovereignty","Security: is there enough nutritious food? Sovereignty: who decides?"],["Food is sacred","Food is a gift that comes with responsibilities to land, water, plants and animals."],["Participation","Food sovereignty lived through daily harvesting, growing, preparing and sharing."],["Self-determination","Communities decide how their food is produced, harvested and distributed."],["Supportive policy","Laws and policies that respect Indigenous rights and support food systems, e.g. the UN Declaration on the Rights of Indigenous Peoples Act (2021)."],["Three Sisters","Corn, beans and squash grown together by Haudenosaunee and other Nations; each helps the others grow."],["Manoomin","Wild rice, harvested and stewarded by Anishinaabe communities."],["Country food","Food from the land and water, such as caribou, seal and Arctic char, shared through community networks."],["Biomagnification","Pollutants concentrate up the food chain, making predatory fish and marine mammals the most affected."],["Colonial disruption","Land loss, the bison’s destruction, farming restrictions, residential schools and nutrition experiments."],["Respectful allyship","Follow community leadership, support rights and policy, fund without controlling."]]}};</script>
