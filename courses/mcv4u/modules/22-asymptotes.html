.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 22: hero equation, Asymptote zoom (V6 approach table, Divide step-through, long division), Which side? stations
   (gap meter, sign tables), Limits at infinity and design, Asymptote architect */
.hero .hero-eq.sm{font-size:clamp(1.45rem,4.2vw,2.3rem);margin-bottom:.4em}
.az-he{display:block;white-space:nowrap;margin:0 0 .2em}
.az-hdot{display:none}
.opt .m,.chip .m,.fchip .m,.read dd .m,.read dt .m,.sq-p .m,.mitem .m{white-space:normal}

/* Explore: controls */
.az-ex .eq-cap{min-height:2.6em;display:flex;align-items:center}
.az-cap .m{font-size:1.08em}
.az-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 2px}
.az-lab{font-weight:700;font-size:.9rem;min-width:6.2em}
.az-row .chips{flex:1 1 240px;margin:0 0 8px}
.az-fchip{font-size:.86rem}
.az-fchip .m{font-size:1.05em}
.az-fchip strong{margin-right:.2em}
.az-bsl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;margin:0 0 4px}
.az-bsl[hidden],.az-far[hidden],.az-near[hidden]{display:none}
.az-sl output{color:var(--ink)}
.az-mode .seg-wrap{margin:2px 0 8px}
.az-near .chips{margin:4px 0 8px}
.az-tg[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.az-panel{margin-top:6px}
.az-pnote{margin:6px 0 0}
.az-locked .az-fns .chip,.az-locked .az-bld .chip,.az-locked .az-near .btn{opacity:.6}

/* V6 approach table (copied from MCV4U 04) */
.az-v6{margin:6px 0 0}
.az-v6g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.az-v6s{min-width:0;border:1.5px solid var(--rule);border-radius:8px;overflow-x:auto}
table.az-v6t{width:100%;border-collapse:collapse;font-family:var(--font-math);font-size:1.02rem}
table.az-v6t th,table.az-v6t td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.az-v6t th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.az-v6t th .m{font-size:1.15em;color:var(--ink)}
table.az-v6t tr:last-child td{border-bottom:0}
.az-v6h{font-weight:700}
.az-v6at{margin:10px 0 0;font-size:1rem}
.az-v6n{margin:6px 0 0}

/* Near mode: one-sided limit entry */
.az-lims{margin:12px 0 0;border:1.5px dashed var(--ink-2);border-radius:8px;padding:8px 12px 4px;background:var(--paper)}
.az-limh{margin:0 0 8px;font-weight:700}
.az-limrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 6px}
.az-limlab{font:400 1.12rem var(--font-math)}
.az-limrow .chips{margin:0}
.az-limrow .chip{font-size:1rem;min-width:52px}
.az-limok{margin:2px 0 6px;color:var(--green);font-weight:700}

/* Divide mode */
.az-div .player{margin-top:0}
.az-dsteps{margin:10px 0 0;padding-left:1.4em;display:grid;gap:6px}
.az-dsteps li{padding:.3em .5em;border-radius:6px}
.az-dsteps li.cur{background:var(--hi-soft)}
.az-dsteps .m{white-space:normal}
.az-ld-wrap{overflow-x:auto;margin:10px 0 0}
table.az-ld{border-collapse:collapse;font-family:var(--font-math);font-size:1.12rem}
table.az-ld td{padding:2px 8px;text-align:left;white-space:nowrap;min-width:3.2em;height:1.7em}
table.az-ld .az-ldd{text-align:right;border-right:2px solid var(--ink)}
table.az-ld tr.az-ldn td{border-top:2px solid var(--ink)}
table.az-ld tr.az-ldn td:first-child{border-top:0}
table.az-ld tr.az-ldp td:nth-child(n+2){border-bottom:1.5px solid var(--ink-2)}
table.az-ld tr.az-ldp td:empty{border-bottom:0}
table.az-ld tr.az-ldr td{font-weight:700}
table.az-ld tr.az-ldoff td{border-color:transparent}
table.az-ld tr.az-ldq td{color:var(--ink)}

/* Part 3 stations */
.az-st .seg-wrap{margin-top:0}
.az-h{margin:14px 0 10px}
.az-pane[hidden]{display:none}
.az-gmrow{display:grid;grid-template-columns:minmax(0,1fr) 58px;gap:10px;align-items:stretch}
.az-gm{display:flex;flex-direction:column;align-items:center;height:100%;min-height:180px;gap:4px}
.az-gm-t{font-size:.78rem;font-weight:700;color:var(--ink-2)}
.az-gm-track{position:relative;flex:1 1 auto;width:26px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet)}
.az-gm-zero{position:absolute;left:-6px;right:-6px;top:50%;border-top:2px dashed var(--ink-2)}
.az-gm-bar{position:absolute;left:3px;right:3px;top:50%;height:0;background:var(--hi);border-radius:3px}
@media (prefers-reduced-motion:no-preference){ .az-gm-bar{transition:height .15s ease,top .15s ease} }
.az-gmt{margin:6px 0 0;min-height:1.5em}
.az-q{border-bottom:1px solid var(--rule);padding:0 0 12px;margin:0 0 12px}
.az-qp{margin:0 0 8px}
.az-eqrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:1.08rem}
.az-eqrow .m{white-space:normal}
.az-fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle}
.az-frn{display:flex;align-items:center;gap:6px;padding:0 4px 4px;border-bottom:2px solid var(--ink)}
.az-frd{padding-top:3px}
.numin.az-in{width:4.6rem;padding:.3em .45em;font-size:1.05rem}
.az-sr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.az-sr .chips{margin:0}
.az-s2f .chips,.az-s3f .chips{margin:0 0 8px}
.az-s2eq{margin:0 0 10px}
.az-s2eq .m{white-space:normal}
.az-sgw{margin:10px 0}
table.az-sg th[scope="row"]{text-align:left}
table.az-sg td .chips{margin:0;justify-content:center;flex-wrap:nowrap}
table.az-sg td .chip{min-width:46px;font-size:.95rem}
.az-sgb{min-width:44px;font:700 1.1rem var(--font-math)}

/* Practice: Limits at infinity and design */
.az-lin{margin:4px 0 0}
.az-bxrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:6px 0 8px}
.az-bx{display:flex;align-items:center;gap:8px;font:400 1.15rem var(--font-math)}
.az-bxt{font:600 1rem var(--font-ui)}
.az-oa{gap:6px}
.az-oay{font-size:1.15rem}
.az-lq .q-prompt .m{white-space:normal}

/* Task */
.az-arow input{width:5.2rem}
.az-aeq{margin:0 0 10px;min-height:2.4em;font-size:1.08rem}

@media (max-width:560px){
  .az-v6g{grid-template-columns:minmax(0,1fr)}
  .az-bsl{grid-template-columns:minmax(0,1fr)}
  .az-gmrow{grid-template-columns:minmax(0,1fr) 44px;gap:6px}
  .az-lab{min-width:0}
}

\u003cstrong>R2\u003c/strong> `{x^2 - 4}/{x^2 - 5x + 6}`: `x^2 - 5x + 6 = 0` at `x = 2` and `x = 3`. How many vertical asymptotes does R2 have?","options":[{"t":"0","_n":"o101","_k":"3bce9303"},{"t":"1","_n":"p0d1","_k":"8f7b5f00"},{"t":"2","_n":"q0e1","_k":"8de80c8b"},{"t":"3","_n":"r031","_k":"1986f58a"}],"explain":"`(x - 2)` cancels, leaving `{x + 2}/{x - 3}`: a hole at (2, −4) and one asymptote, `x = 3`."},{"id":"p2","prompt":"\u003cstrong>R3\u003c/strong> `{4x}/{x^2 + 4}`: as you zoom out, what does the graph approach?","options":[{"t":"`y = 0`","_n":"s041","_k":"140ecb4b"},{"t":"`y = 4`","_n":"t911","_k":"a56edca5"},{"t":"It keeps growing","_n":"u901","_k":"1cee3da1"},{"t":"`y = 4x`","_n":"v931","_k":"b7618fa1"}],"explain":"Divide by `x^2`: `{4/x}/{1 + 4/x^2}` → 0/1 = 0."},{"id":"p3","prompt":"\u003cstrong>R5\u003c/strong>: does the graph of `{2x^2 + 3x}/{x^2 + 1}` ever cross its horizontal asymptote `y = 2`?","options":[{"t":"No, never","_n":"w921","_k":"830a7ffd"},{"t":"It touches it without crossing","_n":"x8d1","_k":"04fe8603"},{"t":"Yes, twice","_n":"y8c1","_k":"66299ab9"},{"t":"Yes, once, at `x = 2/3`","_n":"z8f1","_k":"fc4c48e0"}],"explain":"`2x^2 + 3x = 2x^2 + 2` gives `x = 2/3`. An asymptote limits the far ends, not the middle."},{"id":"p4","prompt":"\u003cstrong>R4\u003c/strong>: zoom out on `{x^2 + x - 2}/{x - 2}`. The graph will look like…","options":[{"t":"the line `y = x`","_n":"108e1","_k":"fc2be1ed"},{"t":"the line `y = 1`","_n":"11891","_k":"b96eac74"},{"t":"the line `y = x + 3`","_n":"12881","_k":"7fa56545"},{"t":"the parabola `y = x^2`","_n":"13870","_k":"d01a56a3"}],"explain":"`f(x) = x + 3 + {4}/{x - 2}`. The last part → 0, so the graph hugs `y = x + 3`."}],"challenges":[{"id":"tc1","goal":2,"prompt":"Near mode on R1: enter both one-sided limits at `x = -1`.","why":"Left of −1 the numerator is near −9 and `x + 1 \u003c 0`: negative ÷ negative, so `f → +∞`. Right of −1 the denominator is a small positive number: `f → -∞`.","hints":["What is the numerator near `x = -1`?","About −9. Now the sign of `x + 1` on each side.","Left: −9/(small −) → +∞. Right: −9/(small +) → −∞."]},{"id":"tc2","goal":[1,3],"prompt":"Build mode: choose `a` and `b` (sliders −6 to 6, step 1) so that `f(x) = {ax + 3}/{x - b}` has the vertical asymptote `x = 2` and the horizontal asymptote `y = -3`.","why":"`b = 2` makes the denominator 0 at 2, and far out `f` behaves like `{-3x}/{x} = -3`. The numerator at 2 is −6 + 3 ≠ 0, so `x = 2` is a true asymptote.","hints":["Where is the denominator 0?","Far out, `{ax + 3}/{x - b}` behaves like `{ax}/{x}`.","`b = 2` and `a = -3`; check the numerator at 2: −6 + 3 ≠ 0."]},{"id":"tc3","goal":[4,5],"stretch":true,"prompt":"Build mode: choose `p` and `q` (sliders −10 to 10, step 1) so that `f(x) = {x^2 + px + q}/{x - 1}` has the oblique asymptote `y = x + 4`, lies \u003cstrong>below\u003c/strong> that asymptote for `x > 1`, and has `y`-intercept 6.","why":"`{x^2 + 3x - 6}/{x - 1} = x + 4 - {2}/{x - 1}`: the remainder is negative for `x > 1`, so the graph is below `y = x + 4`, and `f(0) = 6`.","hints":["Divide `x^2 + px + q` by `x - 1`: quotient `x + (p + 1)`, remainder `q + p + 1`.","`p = 3`. For `x > 1`, `x - 1 > 0`, so ‘below’ needs a negative remainder: `q + 4 \u003c 0`.","The `y`-intercept is `-q = 6`, so `q = -6`; the remainder is −2 \u003c 0. ✓"]}]},"part3":{"slug":"side","name":"Which side?","heading":"Which side of the asymptote?","intro":"Explore found the asymptotes. A sketch also needs to know where the graph sits beside them. Each station turns that into a sign question: the sign of `f(x) - L`, of the remainder, or of each factor. Work through the three stations, then try the quick check.","quickCheck":{"title":"Quick check","summary":"Which side? quick check","items":[{"id":"q1","goal":5,"prompt":"`f(x) = 3 + {5}/{x + 1}`. As `x → -∞`, the graph is…","choices":[{"t":"crossing `y = 3`","fb":"For large negative `x`, `{5}/{x + 1} \u003c 0`.","_n":"14880","_k":"f5dba183"},{"t":"below `y = 3`","fb":"Right. For large negative `x`, `{5}/{x + 1} \u003c 0`.","_n":"15890","_k":"468abbe8"},{"t":"above `y = 3`","fb":"For large negative `x`, `{5}/{x + 1} \u003c 0`.","_n":"168a0","_k":"50c0f698"},{"t":"on `y = 3`","fb":"For large negative `x`, `{5}/{x + 1} \u003c 0`.","_n":"178b0","_k":"860ecc22"}]},{"id":"q2","goal":2,"prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 4`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> of `{x + 1}/{(x - 4)^2}` is…","choices":[{"t":"+∞ from both sides","fb":"Right. A square is positive on both sides; the numerator is near 5.","_n":"188c0","_k":"85b86047"},{"t":"+∞ on the right, −∞ on the left","fb":"A square is positive on both sides; the numerator is near 5.","_n":"198d0","_k":"c70e870a"},{"t":"0","fb":"A square is positive on both sides; the numerator is near 5.","_n":"1a8e0","_k":"4e8c3bb3"},{"t":"−∞ from both sides","fb":"A square is positive on both sides; the numerator is near 5.","_n":"1b7f0","_k":"52e970e6"}]},{"id":"q3","goal":5,"prompt":"Can `y = {x - 1}/{x^2 + 1}` cross `y = 0`?","choices":[{"t":"Yes, at `x = 0`","fb":"`f(1) = 0`. Crossing an HA at finite `x` is allowed.","_n":"1c800","_k":"00c7edf4"},{"t":"Only as `x → ∞`","fb":"`f(1) = 0`. Crossing an HA at finite `x` is allowed.","_n":"1d8d1","_k":"a635e224"},{"t":"No, never","fb":"`f(1) = 0`. Crossing an HA at finite `x` is allowed.","_n":"1e8c1","_k":"d42b90ee"},{"t":"Yes, at `x = 1`","fb":"Right. `f(1) = 0`. Crossing an HA at finite `x` is allowed.","_n":"1f8b1","_k":"3f2e24f3"}]},{"id":"q4","goal":5,"prompt":"`f(x) = 2x - 1 + {3}/{x + 2}`. For `x > -2` the graph is…","choices":[{"t":"on it","fb":"`{3}/{x + 2} > 0` when `x > -2`.","_n":"1g8a1","_k":"371fde0e"},{"t":"above `y = 2x - 1`","fb":"Right. `{3}/{x + 2} > 0` when `x > -2`.","_n":"1h911","_k":"b6057e75"},{"t":"below it","fb":"`{3}/{x + 2} > 0` when `x > -2`.","_n":"1i901","_k":"df6c52b6"},{"t":"crossing it","fb":"`{3}/{x + 2} > 0` when `x > -2`.","_n":"1j8f1","_k":"672a8af8"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Function ↔ asymptotes","summary":"Function ↔ asymptotes","goal":[1,3,4],"instruction":"Match each function to its asymptotes and holes.","how":"Tap a function, then tap its asymptotes and holes.","leftTitle":"Function","rightTitle":"Asymptotes and holes","left":[{"id":"l1","t":"`{x + 3}/{x - 1}`","why":"Nothing cancels, and equal degrees give `y = {1}/{1}`."},{"id":"l2","t":"`{x - 1}/{x^2 - 1}`","why":"`{x - 1}/{(x - 1)(x + 1)} = {1}/{x + 1}`: a hole at `x = 1`, the asymptote `x = -1`, and a smaller numerator degree gives `y = 0`."},{"id":"l3","t":"`{6x^2}/{2x^2 + 5}`","why":"`2x^2 + 5` is never 0, and equal degrees give `y = {6}/{2}`."},{"id":"l4","t":"`{x^2 - 9}/{x + 2}`","why":"`x^2 - 9 = (x + 2)(x - 2) - 5`: the quotient is `x - 2`."},{"id":"l5","t":"`{2x^2 - x}/{x - 1}`","why":"Quotient `2x + 1`, remainder 1.","hints":["Divide `2x^2 - x` by `x - 1`.","`2x(x - 1) = 2x^2 - 2x`; `x` remains.","Quotient `2x + 1`, remainder 1: OA `y = 2x + 1`."]},{"id":"l6","t":"`{5}/{x^2 + 1}`","why":"`x^2 + 1` is never 0, and the numerator’s degree is smaller, so `y = 0`."},{"id":"l7","t":"`{x^2 + 1}/{x}`","why":"`x + {1}/{x}`: the quotient is `x`."},{"id":"l8","t":"`{3x - 1}/{x^2 - 4}`","why":"`x^2 - 4 = 0` at `x = ±2`, and the numerator’s degree is smaller, so `y = 0`."}],"right":[{"id":"r1","t":"VA `x = 1`; HA `y = 1`"},{"id":"r2","t":"Hole at `x = 1`; VA `x = -1`; HA `y = 0`"},{"id":"r3","t":"HA `y = 3`; no VA"},{"id":"r4","t":"VA `x = -2`; OA `y = x - 2`"},{"id":"r5","t":"VA `x = 1`; OA `y = 2x + 1`"},{"id":"r6","t":"HA `y = 0`; no VA"},{"id":"r7","t":"VA `x = 0`; OA `y = x`"},{"id":"r8","t":"VA `x = ±2`; HA `y = 0`"}],"_a":"GEcNV0AKE0FSR01EDgITCUEXU0ROEl0AQV9DFFESHREPUUNcQEIFEU9HDVNAChNBVkdNRA4GEwlBF1dEThJdBEFfQxRVEh0RD11DXEBCCREe","wrong":{"l2|r8":"`(x - 1)` cancels: `x = 1` is a hole.","l2|r1":"`(x - 1)` cancels: `x = 1` is a hole.","l2|r5":"`(x - 1)` cancels: `x = 1` is a hole.","l4|r7":"`x^2 - 9 = (x + 2)(x - 2) - 5`: the quotient is `x - 2`.","l8|r3":"The numerator’s degree is smaller, so `y = 0`."},"wrongDefault":"Factor and cancel first, then compare degrees."},{"id":"limits","type":"custom","title":"Limits at infinity and design","summary":"Limits at infinity and design","star":true,"goal":[3,4,5],"instruction":"Find each limit or design value, then press Check.","how":"Type a whole number or a fraction such as −3/5. Each item has its own Check button.","items":[{"id":"S1","goal":3,"kind":"num","prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{4x^3 - x}/{2x^3 + 7}`","_a":"UQ==","why":"Divide by `x^3`: `{4 - 1/x^2}/{2 + 7/x^3}` → 4/2 = 2.","wrong":[{"match":[0.5714285714285714,-0.14285714285714285],"fb":"Divide by `x^3`; the constants vanish."}],"general":"Divide every term by `x^3`, then let `x → ∞`."},{"id":"S2","goal":3,"star":true,"kind":"num","prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{5x + 1}/{√{x^2 + 3}}`","_a":"TlA=","why":"For `x \u003c 0`, `√{x^2 + 3} = -x√{1 + 3/x^2}`, so the expression is `{5 + 1/x}/{-√{1 + 3/x^2}}` → −5.","wrong":[{"match":[5],"fb":"For `x \u003c 0`, `√{x^2} = -x`."}],"general":"Divide by `√{x^2} = |x|`; for `x \u003c 0` that’s `-x`."},{"id":"S3","goal":3,"star":true,"kind":"num","prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `(√{x^2 + 6x} - x)`","_a":"UA==","why":"`{6x}/{√{x^2 + 6x} + x} = {6}/{√{1 + 6/x} + 1}` → 6/2 = 3.","wrong":[{"match":[0],"fb":"∞ − ∞ isn’t 0. Multiply by the conjugate: `{6x}/{√{x^2 + 6x} + x}` → 6/2."}],"general":"Multiply and divide by the conjugate first.","hints":["Multiply and divide by `√{x^2 + 6x} + x`.","The numerator becomes `(x^2 + 6x) - x^2 = 6x`.","Divide top and bottom by `x`: `{6}/{√{1 + 6/x} + 1}` → 3."]},{"id":"S4","goal":[3,1],"star":true,"kind":"boxes","prompt":"`f(x) = {ax^2 + bx + 2}/{x^2 - 4}` has the HA `y = 3` and no vertical asymptote at `x = 2`. Find `a` and `b`.","boxes":[{"id":"a","label":"`a =`"},{"id":"b","label":"`b =`"}],"_a":"GEcARFgDHREBR1tLVU0=","why":"Equal degrees: `y = {a}/{1} = 3`. No asymptote at 2 means the numerator is 0 there: `4(3) + 2b + 2 = 0`, so `b = -7`.","general":"The numerator must be 0 at `x = 2`: `4a + 2b + 2 = 0`.","generalA":"Equal degrees: the HA is `y = {a}/{1}`."},{"id":"S5","goal":5,"star":true,"kind":"num","label":"`x =`","prompt":"Where does `f(x) = {2x^2 - 5x + 1}/{x^2 + 2}` cross its horizontal asymptote?","_a":"TlVPUA==","why":"HA `y = 2`; `2x^2 - 5x + 1 = 2x^2 + 4` gives `-5x = 3`, so `x = -{3}/{5}`.","wrong":[{"match":[0.6],"fb":"`-5x + 1 = 4` gives `-5x = 3`."}],"general":"Set `f(x) = 2` and solve: the `x^2` terms cancel."},{"id":"S6","goal":[4,5],"star":true,"kind":"oa","prompt":"`f(x) = {x^3 + 2x^2}/{x^2 - 1}`. State the oblique asymptote and whether the graph is above or below it as `x → ∞`.","_a":"GEcMRFgBHREBR1tUThJCWgcAQ1xAUVNcFQBDGw==","why":"`x^3 + 2x^2 = (x^2 - 1)(x + 2) + (x + 2)`, so the asymptote is `y = x + 2`, and `{x + 2}/{x^2 - 1} > 0` for large `x`: above.","wrong":[{"m":1,"b":0,"fb":"Divide fully: the quotient is `x + 2`, the remainder `x + 2`."}],"general":"Long division by `x^2 - 1`: the quotient is the asymptote.","sideFb":"For large `x`, `{x + 2}/{x^2 - 1} > 0`.","hints":["Long division by `x^2 - 1`.","`x(x^2 - 1) = x^3 - x`; then `2(x^2 - 1)`; remainder `x + 2`.","`{x + 2}/{x^2 - 1} > 0` for large `x`: above `y = x + 2`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Victor","how":"","goal":[1,3,4],"instruction":"Victor made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Find the vertical asymptotes of `f(x) = {x^2 + 2x - 3}/{x^2 - 1}`.","steps":["`x^2 - 1 = 0` when `x = 1` or `x = -1`.","So the vertical asymptotes are `x = 1` and `x = -1`.","The graph goes to ±∞ on both sides of each one."],"_a":"Ug==","stepFb":["Step 1 is correct.","","Step 3 builds on step 2. The mistake is earlier."],"fixes":[{"t":"The asymptotes are `x = -3` and `x = 1`.","why":"Those are zeros of the numerator.","_n":"1k8e1","_k":"401c1346"},{"t":"Step 2 is correct.","why":"Factor first. If `(x - 1)` cancels, `x = 1` is a hole, not an asymptote.","_n":"1l851","_k":"b4e9ce09"},{"t":"There are no vertical asymptotes.","why":"`x = -1` still makes the denominator 0 after cancelling.","_n":"1m841","_k":"c928af91"},{"t":"Factor: `{(x + 3)(x - 1)}/{(x - 1)(x + 1)}`. `x - 1` cancels, so `x = 1` is a hole at (1, 2), and the only vertical asymptote is `x = -1`.","why":"Cancelled factors make holes, not asymptotes.","_n":"1n931","_k":"68d6bb85"}],"hints":["Factor the numerator too.","`(x + 3)(x - 1)`.","`x = 1` cancels: a hole."]},{"id":"e2","goal":3,"task":"Find \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{6x^2 + x}/{3x^3 - 2}`.","steps":["The numerator and denominator both → ∞.","So use the leading coefficients: 6/3 = 2.","The horizontal asymptote is `y = 2`."],"_a":"Ug==","stepFb":["Step 1 is correct: it’s an ∞/∞ form.","","Step 3 follows from step 2."],"fixes":[{"t":"Step 2 is correct.","why":"Divide by the highest power in the denominator. If the numerator’s degree is smaller, every term → 0.","_n":"1o941","_k":"78fe97d4"},{"t":"Divide every term by `x^3`: `{6/x + 1/x^2}/{3 - 2/x^3}` → 0/3 = 0. The HA is `y = 0`.","why":"The numerator’s degree is smaller, so every term on top → 0.","_n":"1p911","_k":"4405a75d"},{"t":"Divide by `x^2`: `{6}/{3x}` → 2.","why":"`{6 + 1/x}/{3x - 2/x^2}` → 6/∞ = 0.","_n":"1q921","_k":"a38855b8"},{"t":"The limit is ∞, because the numerator grows.","why":"The denominator grows faster.","_n":"1r8f1","_k":"77f06480"}],"hints":["Are the degrees equal?","2 and 3: divide by `x^3`.","0."]},{"id":"e3","goal":4,"task":"Find the oblique asymptote of `f(x) = {2x^2 + 3x - 1}/{x + 1}`.","steps":["The numerator’s degree is one more, so there’s an oblique asymptote.","`2x^2 ÷ x = 2x`; `2x(x + 1) = 2x^2 + 2x`; subtract: `x - 1`.","`x ÷ x = 1`; `1(x + 1) = x + 1`; subtract: −2.","So `f(x) = 2x + 1 - {2}/{x + 1}`, and the asymptote is `y = 2x + 1 - 2 = 2x - 1`."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"The asymptote is `y = 2x + 3`.","why":"That’s from the numerator’s coefficients.","_n":"1s901","_k":"00b7f2cc"},{"t":"The asymptote is `y = 2x`.","why":"Divide fully. The quotient `mx + b` is the asymptote; the constant `b` matters.","_n":"1t8d1","_k":"4be71dd4"},{"t":"The remainder term `-{2}/{x + 1}` → 0, so the asymptote is `y = 2x + 1`.","why":"Only the quotient is the asymptote.","_n":"1u8e1","_k":"3bd8644f"},{"t":"Step 4 is correct.","why":"The remainder term → 0. Leave it out of the asymptote’s equation.","_n":"1v8b1","_k":"80fdac90"}],"hints":["What happens to `-{2}/{x + 1}` as `x → ∞`?","It → 0.","`y = 2x + 1`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Asymptote zoom: the hole that looked like an asymptote, the crossing, or the two different horizontal asymptotes of R6?"},{"id":"j2","q":"In your own words, why does dividing by the highest power of `x` reveal the horizontal asymptote?"},{"id":"j3","q":"Explain to a friend how to decide which side of an oblique asymptote a graph is on."},{"id":"j4","q":"Which kind of asymptote question still trips you up? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What are the vertical asymptotes of `f(x) = {x^2 - x - 6}/{x^2 - 9}`?","options":[{"t":"`x = 3` and `x = -3`","why":"Factor first. If `(x - 3)` cancels, `x = 3` is a hole, not an asymptote.","_n":"1w8c1","_k":"839f1ab8"},{"t":"`x = -3` only","why":"`{(x - 3)(x + 2)}/{(x - 3)(x + 3)}`: `x = 3` is a hole.","_n":"1xf91","_k":"936018a8"},{"t":"`x = -2` and `x = 3`","why":"Those are zeros of the numerator.","_n":"1yf81","_k":"d6ccddb7"},{"t":"`x = 3` only","why":"`x - 3` cancels; `x + 3` doesn’t.","_n":"1zfb1","_k":"83962c26"}]},"b":{"prompt":"What are the vertical asymptotes of `f(x) = {x^2 + 3x - 10}/{x^2 - 4}`?","options":[{"t":"`x = -5` and `x = 2`","why":"Those are zeros of the numerator.","_n":"20fa1","_k":"1332f76e"},{"t":"`x = 2` and `x = -2`","why":"Factor first. If `(x - 2)` cancels, `x = 2` is a hole, not an asymptote.","_n":"21fd1","_k":"e015c10e"},{"t":"`x = 2` only","why":"`x - 2` cancels; `x + 2` doesn’t.","_n":"22fc1","_k":"c2bcd34e"},{"t":"`x = -2` only","why":"`{(x + 5)(x - 2)}/{(x - 2)(x + 2)}`: `x = 2` is a hole.","_n":"23ff1","_k":"f18346c1"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{5 - 4x^2}/{2x^2 + x}` = ?","options":[{"t":"−2","why":"Divide by `x^2`: `{5/x^2 - 4}/{2 + 1/x}` → −4/2.","_n":"24fe1","_k":"4ced9879"},{"t":"0","why":"The degrees are equal.","_n":"25011","_k":"9a0fc6d9"},{"t":"2","why":"The leading coefficient of the numerator is −4.","_n":"26001","_k":"b6148197"},{"t":"5","why":"Constant terms vanish after dividing by `x^2`.","_n":"278f0","_k":"db4bc41b"}]},"b":{"prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan clas with a vertical asymptote isn’t continuous there.","_n":"3a103","_k":"e2df099a"},{"t":"“A horizontal asymptote describes the behaviour as `x → ±∞`, so the graph may cross it at a finite `x`. A vertical asymptote `x = a` means `f(a)` is undefined and `f` grows without bound near `a`, so the graph can never reach it.”","why":"A horizontal asymptote is about the far ends; a vertical one is a value of `x` where `f` has no value.","_n":"3b213","_k":"adc13b02"}]},"b":{"prompt":"`y = {2x}/{x^2 + 1}` has the horizontal asymptote `y = 0`, yet `y = 0` at `x = 0`. Which is the best explanation?","options":[{"t":"“`y = 0` describes what happens as `x → ±∞`. At a finite `x` like 0 the function can take the value 0; an asymptote limits the long-run behaviour, not every point.”","why":"A horizontal asymptote is a limit at `±∞`, so a crossing at a finite `x` is allowed.","_n":"3c203","_k":"68a1e616"},{"t":"“The graph touches the asymptote only where the denominator is 0.”","why":"The denominator `x^2 + 1` is never 0.","_n":"3d1f3","_k":"c17623c9"},{"t":"“The asymptote moves to `y = 1` after crossing.”","why":"The limit at `±∞` is still 0.","_n":"3e1e3","_k":"a10200e3"},{"t":"“That’s impossible, so the asymptote must be something else.”","why":"A horizontal asymptote describes what happens as `x → ±∞`. At finite `x`, the graph can cross it.","_n":"3f1d3","_k":"3aee6d3d"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which correctly describes the behaviour of `f(x) = {2x - 1}/{x + 3}`?","options":[{"t":"“`f(∞) = 2` and `f(-3) = ∞`.”","why":"∞ can’t be substituted, and `f(-3)` is undefined.","_n":"3g1c3","_k":"27e98c8b"},{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 2` and \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -3^{+}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = -∞`.”","why":"Near `-3^{+}`: numerator −7, denominator small +.","_n":"3h1b3","_k":"07fe33e6"},{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = ∞`.”","why":"`f(2) = 3/5`; 2 is the horizontal asymptote’s height, not a vertical asymptote.","_n":"3i1a3","_k":"d23a3bcb"},{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 2` and \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -3^{+}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = +∞`.”","why":"Check the sign of each factor just left and just right of −3. A squared factor is positive on both sides.","_n":"3j193","_k":"7426eefc"}]},"b":{"prompt":"Which correctly describes the behaviour of `f(x) = {3x + 2}/{x - 1}`?","options":[{"t":"“`f(∞) = 3` and `f(1) = ∞`.”","why":"∞ isn’t a number you can substitute. Write \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 3`. Also, `f(1)` is undefined.","_n":"3k183","_k":"30182310"},{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 3` and \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 1^{+}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span>  600 hundred and decreases toward 400 hundred, always staying above it","why":"`P = 400 + {1000}/{t + 5}`.","_n":"438d3","_k":"30ddc48d"}]}}]},"task":{"title":"Asymptote architect","summary":"Asymptote architect","statement":"\u003cp>Design a rational function `f(x) = {a(x - r_1)(x - r_2)}/{(x - s_1)(x - s_2)}` that meets every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>Its only vertical asymptote is `x = 3`.\u003c/li>\u003cli>It has a hole at `x = -1`.\u003c/li>\u003cli>Its horizontal asymptote is `y = 2`.\u003c/li>\u003cli>For `x > 3`, its graph is below the horizontal asymptote.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose a whole number from −4 to 4 (not 0) for `a`, and whole numbers from −6 to 6 for `r_1`, `r_2`, `s_1` and `s_2`. The graph shows the asymptotes, any holes, and the gap between the graph and `y = 2`, shaded.\u003c/p>","checks":["Only vertical asymptote `x = 3`","Hole at `x = -1`","HA `y = 2`","Below `y = 2` for `x > 3`"],"tips":["The denominator needs a factor `(x - 3)` that doesn’t cancel.","A hole needs the same factor, `(x + 1)`, on the top and the bottom.","With equal degrees, the HA is `a` divided by the denominator’s leading coefficient (1).","After cancelling, `f(x) = {2(x - r)}/{x - 3} = 2 + {2(3 - r)}/{x - 3}`. For `x > 3`, that extra part must be negative."],"explainPrompt":"Explain how you made the hole, why the asymptote is `y = 2`, and how you decided which side of it the graph is on.","vocab":"Use the words cancel, hole, vertical asymptote, horizontal asymptote and remainder.","success":"Your design meets every condition!","more":"There’s more than one answer. Can you find them all?","after3":"Line 4 forces `r > 3`, and the input range stops at 6. Notice that none of these graphs ever crosses `y = 2`: `2 + {2(3 - r)}/{x - 3} = 2` has no solution."},"cards":[["Vertical asymptote `x = a`","`f(x) → ±∞` as `x → a^{-}` or `a^{+}`; the denominator is 0 at `a` after cancelling."],["Hole","A cancelled factor; plot an open circle using the simplified form."],["Sign near a VA","Test each factor just left and right of `a`; an even power keeps its sign."],["Horizontal asymptote","\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ±∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = L` gives `y = L`."],["Limits at infinity","Divide every term by the highest power of `x` in the denominator; `c/x^n → 0`."],["Degree rules","Top smaller: `y = 0`. Equal: ratio of leading coefficients. Top one higher: oblique."],["Oblique asymptote","Divide: `f = mx + b + R/D`; the asymptote is `y = mx + b`."],["Which side?","The sign of `f(x) - L`, or of the remainder term, for large `|x|`."],["Crossing an HA","Allowed at finite `x`: solve `f(x) = L`."],["`√{x^2}`","`= |x|`, so a root can give different asymptotes at +∞ and −∞."],["∞ isn’t a number","Write \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 2`, never `f(∞) = 2`."],["In context","A horizontal asymptote is the long-run value (concentration, population, average cost)."]]}};</script>
