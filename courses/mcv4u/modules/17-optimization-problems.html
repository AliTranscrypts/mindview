.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 17: hero equation, V10 shape stage (box and field figures, objective graph, V′ panel), Box builder controls and
   readouts, Part 3 stations (ordering graph, chip-slot model builder, V11 sign chart), practice slot chips and V8 boxes, task.
   Tokens added here (light and dark): --op-river (river band), --v10-fo / --v10-fo-out / --v10-fo-in (box face opacities:
   base --pen at 15% light, 25% dark, as the plan asks; outer and inner flap faces a little stronger and weaker). */
:root{--op-river:#C9DCF4;--op-bank:#6E8FC4;--v10-fo:.15;--v10-fo-out:.3;--v10-fo-in:.2}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--op-river:#203553;--op-bank:#5D7FB3;--v10-fo:.25;--v10-fo-out:.42;--v10-fo-in:.3}
}
:root[data-theme="dark"]{--op-river:#203553;--op-bank:#5D7FB3;--v10-fo:.25;--v10-fo-out:.42;--v10-fo-in:.3}

.op-heq{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:.1em .1em;font-size:.74em;line-height:1.4}
.op-ht{white-space:nowrap}
.op-ht .m{font-size:1em}
.op-arr{color:var(--ink-2);margin:0 .15em;font-style:normal}

/* ---- V10 shape stage ---- */
.v10{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 18px;align-items:start}
.v10-fig,.v10-gr{min-width:0}
.v10-svg{display:block;width:100%;height:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.v10-low{margin-top:8px}
.v10-low[hidden]{display:none}
canvas.plot.v10-d{aspect-ratio:16/7}
.v10-base{fill:var(--pen);fill-opacity:var(--v10-fo);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.v10-out{fill:var(--pen);fill-opacity:var(--v10-fo-out);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.v10-in{fill:var(--pen);fill-opacity:var(--v10-fo-in);stroke:var(--ink);stroke-width:1.4;stroke-linejoin:round}
.v10-cut{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:4 3}
.v10-cut.hi{fill:var(--hi);fill-opacity:.55}
.v10-dim{fill:var(--ink);font:700 13px var(--font-ui);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.v10-cx{font:italic 600 14px var(--font-math)}
.v10-river{fill:var(--op-river)}
.v10-bank{stroke:var(--op-bank);stroke-width:1.5}
.v10-rl{font:italic 600 12px var(--font-ui);fill:var(--ink-2)}
.v10-field{fill:var(--hi-soft)}
.v10-fence{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.v10-quad{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4}
.v10-bar{stroke:var(--ink-2);stroke-width:2}
.v10-sb{font:600 11px var(--font-ui);fill:var(--ink-2)}
.op-hero.v10{grid-template-columns:minmax(0,1fr);gap:4px}
.op-hero .v10-svg{border:0;background:transparent;max-height:230px}
.op-hero canvas.plot{aspect-ratio:16/8}

/* ---- Explore ---- */
.op-eq{font-size:clamp(1.25rem,3vw,1.7rem)}
.op-bot{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 28px;align-items:start;margin-top:16px}
.op-ctl,.op-rd{min-width:0}
.op-lab{font-weight:700}
.op-crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px}
.op-chips{margin:0}
.op-chips .chip{font-size:.88rem}
.op-tog[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.op-sl{margin-top:12px}
.op-sl output{color:var(--ink)}
.op-type{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 0}
.op-type label{font-weight:700;font-size:.92rem}
.op-type .numin.short{width:5.5rem}
.op-note{min-height:1.2em;margin:6px 0 0;font-weight:600}
.op-how{margin:6px 0 10px}
.op-ans{border-top:1.5px dashed var(--rule);padding-top:10px}
.op-ans label{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
.op-ansrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.op-ansrow .numin{width:9rem}
.op-more[hidden]{display:none}
.op-more{margin-top:8px}
.op-more summary{font-weight:700;cursor:pointer;padding:4px 0}

/* ---- Part 3 ---- */
.op-st:first-child{margin-top:0;padding-top:0;border-top:0}
.op-st h3{margin-top:0}
.op-prob{font-weight:600}
.op-ordg{max-width:460px;margin-top:14px}
.op-ordg .tiny{margin:4px 0 0}
.op-mp{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.op-mp:first-of-type{border-top:0;padding-top:0}
.op-mpt{font-weight:600}
.op-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.op-slot{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px dashed var(--rule);border-radius:8px;background:var(--sheet);padding:8px 10px;min-height:68px;min-width:0}
.op-slot.on{border-color:var(--ink);border-style:solid;background:var(--hi-soft)}
.op-slot.full{border:2px solid var(--green);background:var(--good-bg);opacity:1}
.op-sll{font:700 .78rem var(--font-ui);color:var(--ink-2)}
.op-slv{font:400 1.02rem var(--font-math);overflow-wrap:anywhere}
.op-slv .m{white-space:normal}
.op-tray{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.op-mchip{font-size:.95rem}
.op-mchip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.op-mtip{margin:10px 0 0}
.op-sch{font-weight:700;margin:12px 0 4px}
.op-scw{overflow-x:auto;position:relative}
table.op-sct th,table.op-sct td{padding:5px 8px;text-align:center;white-space:nowrap}
table.op-sct tbody th{text-align:left;font-weight:600}
.op-sck{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.op-sct .op-scu{font:600 .78rem var(--font-ui);color:var(--ink-2)}
table.op-sct .op-scu .m{font-size:1.1em}
table.op-sct .op-scar span[aria-hidden]{font-size:1.25rem;line-height:1;display:block}
.op-scw2{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.op-sct .op-scd td{font-weight:700}
.op-mx{margin-top:10px}

/* ---- Practice ---- */
.op-mrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:8px 0 0}
.op-mlab{font-weight:700;font-size:.9rem;min-width:5.2rem;color:var(--ink-2)}
.op-mrow .chips{margin:0;flex:1 1 300px}
.op-mrow .chip{font-size:.95rem}
.op-mrow .chip.op-good{background:var(--good-bg);border-color:var(--green);color:var(--ink)}
.op-snote{margin:6px 0 0}
.op-bxs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 4px}
.op-bx{display:flex;align-items:center;gap:8px;font-size:.98rem}
.op-bx .numin.short{width:6rem}
.op-bx .numin.op-ex{width:7.5rem}
.op-bu{font-size:.95rem;color:var(--ink-2)}

/* ---- task ---- */
.op-tstep{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.op-tstep label{min-width:9rem}
.op-tstep .m{font-size:1.2rem}
.op-tstep .btn{min-width:40px;font-size:1.1rem}
.op-tstep .numin.short{width:5rem}
.op-tpv.v10{grid-template-columns:minmax(0,1fr)}

@media (max-width:820px){
  .op-bot{grid-template-columns:minmax(0,1fr)}
  .op-slots{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .v10{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){
  .op-slots{grid-template-columns:minmax(0,1fr)}
}

,{"t":"`(20 - 2x)(30 - 2x)`","why":"Multiply by the height `x`.","_n":"6004","_k":"83048f64"},{"t":"`x(20 - x)(30 - x)`","why":"Each side loses a square at both ends.","_n":"7f54","_k":"fd992246"}],"hints":["What happens to the 20 cm side?","It loses `x` at each end: `20 - 2x`.","`V = x(20 - 2x)(30 - 2x)`."]},{"id":"w3","skill":"One variable","goal":1,"prompt":"A rectangle has perimeter 50 m and width `x`. What is its length?","options":[{"t":"`50 - x`","why":"`2x + 2L = 50`.","_n":"8f64","_k":"3304d716"},{"t":"`50 - 2x`","why":"That’s `2L`.","_n":"9e49","_k":"1312d437"},{"t":"`25 - x`","why":"`2x + 2L = 50`, so `L = 25 - x`.","_n":"ae39","_k":"f0f515bb"},{"t":"`50/x`","why":"Perimeter adds sides.","_n":"be69","_k":"e5be5bfa"}],"hints":["Write the perimeter.","`2x + 2L = 50`.","`L = 25 - x`."]},{"id":"w4","skill":"One variable","goal":1,"prompt":"A square-based box has volume 500 cm³ and base side `x`. Write `h` in terms of `x`.","options":[{"t":"`h = √{500/x}`","why":"Divide by `x^2`, no root.","_n":"ce59","_k":"84209498"},{"t":"`h = 500/x^2`","why":"`x^2h = 500`.","_n":"de89","_k":"6857bd59"},{"t":"`h = 500/x`","why":"The base area is `x^2`.","_n":"ee79","_k":"f1136e38"},{"t":"`h = 500 - x^2`","why":"Volume = base area × height, so divide by `x^2`; don’t subtract.","_n":"fea9","_k":"e5e1f6e1"}],"hints":["Volume = base area × height.","`x^2h = 500`.","`h = 500/x^2`."]},{"id":"w5","skill":"Derivatives","goal":3,"prompt":"If `A(x) = 600x - 2x^2`, which `x` makes `A′(x) = 0`?","options":[{"t":"75","why":"`4x = 600` gives 150.","_n":"ge99","_k":"d1cf2318"},{"t":"150","why":"`A′ = 600 - 4x = 0`.","_n":"hec9","_k":"083b32a6"},{"t":"300","why":"`A(300) = 0`: that’s a zero of `A`.","_n":"ieb9","_k":"a74d4d8d"},{"t":"600","why":"`A′ = 600 - 4x`.","_n":"j728","_k":"abc5a49b"}],"hints":["Differentiate.","`600 - 4x`.","`x = 150`."]},{"id":"w6","skill":"Derivatives","goal":3,"prompt":"If `S(x) = x^2 + 32/x`, what is `S′(x)`?","options":[{"t":"`2x - 32`","why":"Rewrite `32/x` as ,"`V′(x) = (24 - 2x)(24 - 6x)`.","`x = 4` (12 is an endpoint): 4 × 16 × 16 = 1024."],"msgs":{"scen":"Switch to \u003cstrong>Box from a sheet\u003c/strong> first.","sheet":"Choose the 24 cm × 24 cm sheet.","cube":"That makes a cube, which holds only 512 cm³.","six":"864 cm³; try smaller.","end":"`V′(12) = 0` too, but 12 is an endpoint: the box has no base, so it holds 0 cm³.","other":"At `x = #1` the box holds #2 cm³ and the slope is #3. The largest box is where the slope readout says “level”.","noAns":"The cut is right. Now type its volume in the answer box.","badAns":"The cut is right, but that volume isn’t. Read the Quantity row."}},{"id":"tc2","goal":[3,4],"prompt":"45 × 24 sheet: use `V′(x) = 0` to find the best cut, then set it.","why":"`V′(x) = 12x^2 - 276x + 1080 = 12(x - 5)(x - 18)`. Only `x = 5` is in `[0, 12]`: 5 × 35 × 14 = 2450 cm³.","hints":["`V(x) = x(45 - 2x)(24 - 2x) = 4x^3 - 138x^2 + 1080x`.","`V′(x) = 12x^2 - 276x + 1080 = 12(x - 5)(x - 18)`.","Only `x = 5` is in `[0, 12]`: 5 × 35 × 14 = 2450."],"msgs":{"scen":"Switch to \u003cstrong>Box from a sheet\u003c/strong> first.","sheet":"Choose the 45 cm × 24 cm sheet.","typed18":"`V′(18) = 0`, but `24 - 36 \u003c 0`: 18 is outside the domain `0 \u003c= x \u003c= 12`.","other":"At `x = #1`, `V′(x) = #2`, not 0. Solve `V′(x) = 0`, then set that cut."}},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Field mode, 600 m, divider on. Set the width that gives the largest total area, and enter that area.","why":"`3x + y = 600`, so `A(x) = x(600 - 3x)` on `[0, 200]`; `A′ = 600 - 6x = 0` at `x = 100`: 100 m by 300 m, 30 000 m².","hints":["Count the fence: three widths and one length.","`A(x) = x(600 - 3x)`, `0 \u003c= x \u003c= 200`.","`A′ = 600 - 6x = 0` at `x = 100`: 100 m by 300 m, area 30 000 m²."],"msgs":{"scen":"Switch to \u003cstrong>Field along a river\u003c/strong> first.","fence":"Use the 600 m fence.","div":"Turn the divider on.","w150":"That’s the best width without the divider. Now there are \u003cstrong>three\u003c/strong> widths: `3x + y = 600`.","w200":"That’s where `A = 0`: all the fence is used on widths.","other":"At `x = #1`, `A′(x) = #2`, not 0. Count the fence again: three widths and one length.","noAns":"The width is right. Now type the total area in the answer box.","badAns":"The width is right, but that area isn’t. Read the Quantity row."}}]},"part3":{"slug":"algorithm","name":"Algorithm","heading":"The optimization algorithm","intro":"On a slider you can see the peak. Without one, you need a model. First put the six steps in order. Then build two models from chips. Then try the quick check.","st1":{"title":"Station 1: Put the steps in order","problem":"A rectangle has its base on the `x`-axis and its two upper corners on the parabola `y = 12 - x^2`. Find the largest possible area.","how":"Tap a step, then use Move up and Move down to put it in place. Press Check when the order is right.","steps":["Sketch and label: the upper corners are `(±x, 12 - x^2)`.","Write the quantity: `A(x) = 2x(12 - x^2) = 24x - 2x^3`.","State the domain: `0 \u003c= x \u003c= 2√3`.","Differentiate and solve: `A′(x) = 24 - 6x^2 = 0` gives `x = 2`.","Compare: `A(0) = 0`, `A(2) = 32`, `A(2√3) = 0`.","Answer: the largest area is 32 square units (width 4, height 8)."],"start":[3,0,5,2,4,1],"domainLate":"State the domain before you compare, so you know which endpoints to test.","answerEarly":"Compare first; `A′ = 0` alone doesn’t prove a maximum.","general":"Ask what has to happen before it can be done.","done":"Sketch → model → domain → derivative = 0 → compare → answer.","graphCap":"`A(x) = 24x - 2x^3` on `[0, 2√3]`: the three candidates."},"st2":{"title":"Station 2: Build the model","how":"For each problem, fill the four slots from the chip tray: tap a chip, then tap its slot (or tap a slot first). Two chips in each tray are traps.","slots":[{"id":"var","label":"Variable"},{"id":"con","label":"Constraint"},{"id":"fn","label":"Function to optimize (one variable)"},{"id":"dom","label":"Domain"}],"roles":{"var":"the variable","con":"the constraint","fn":"the function to optimize","dom":"the domain"},"problems":[{"id":"A","t":"Problem A: An open square-based box must hold 4000 cm³. Use the least material.","chips":[{"t":"`x` = base side","_a":"EkMEERI="},{"t":"`x^2h = 4000`","_a":"ElYKDRI="},{"t":"`S(x) = x^2 + 16 000/x`","_a":"ElMLQQ=="},{"t":"`x > 0`","_a":"ElEKDhI="},{"t":"`S = x^2 + 4xh`","_a":"ElsKQQ==","fb":"Still two variables: use `x^2h = 4000` to replace `h`."},{"t":"`S = 2x^2 + 16 000/x`","_a":"ElsKQQ==","fb":"That adds a lid: the box is open."}],"done":"Model built: `S(x) = x^2 + 16 000/x` for `x > 0`.","alg":["`h = 4000/x^2`, so `S = x^2 + 4x(4000/x^2) = x^2 + 16 000/x`, `x > 0`.","`S′(x) = 2x - 16 000/x^2 = {2(x^3 - 8000)}/{x^2}`.","`S′(x) = 0` when `x^3 = 8000`: `x = 20`. Then `h = 4000/20^2 = 10`.","There are no endpoints to compare. `S` decreases before `x = 20` and increases after (sign chart below), so `x = 20` gives the least material: a 20 cm × 20 cm base, 10 cm high, `S = 1200` cm²."]},{"id":"B","t":"Problem B: Two non-negative numbers add to 16. Make the sum of their squares as small as possible.","chips":[{"t":"`x` = one number","_a":"EkMEERI="},{"t":"`y = 16 - x`","_a":"ElYKDRI="},{"t":"`S(x) = x^2 + (16 - x)^2`","_a":"ElMLQQ=="},{"t":"`0 \u003c= x \u003c= 16`","_a":"ElEKDhI="},{"t":"`S = x^2 + 16^2`","_a":"ElsKQQ==","fb":"The second number is `16 - x`, not 16."},{"t":"`x > 0` only","_a":"ElsKQQ==","fb":"The numbers are non-negative, so 0 and 16 are allowed, and those endpoints must be compared."}],"done":"Model built: `S(x) = x^2 + (16 - x)^2` on `[0, 16]`.","alg":["`S(x) = x^2 + (16 - x)^2`, `0 \u003c= x \u003c= 16`.","`S′(x) = 2x - 2(16 - x) = 4x - 32 = 0` gives `x = 8`.","Compare: `S(0) = 256`, `S(8) = 128`, `S(16) = 256`.","The minimum is 128 at `x = 8` (the numbers 8 and 8). The maximum, 256, is at the endpoints (0 and 16)."]}]},"quickCheck":{"title":"Quick check","summary":"Optimization algorithm quick check","items":[{"id":"q1","goal":4,"prompt":"First step in any optimization problem?","choices":[{"t":"Set `f = 0`","fb":"You can’t differentiate until you have a model.","_n":"14779","_k":"63b367c8"},{"t":"Differentiate","fb":"You can’t differentiate until you have a model.","_n":"15749","_k":"7ac53ee6"},{"t":"Guess a square","fb":"You can’t differentiate until you have a model.","_n":"16759","_k":"4f7c1b94"},{"t":"Sketch and label","fb":"Right. Sketch and label first; the model comes from the picture.","_n":"177a9","_k":"5e0a8732"}]},{"id":"q2","goal":1,"prompt":"`A = xy` with `x + 2y = 100`. Write `A` in one variable.","choices":[{"t":"`A = x(100 - x)/2`","fb":"Right. `y = (100 - x)/2`, so `A = x(100 - x)/2`.","_n":"187b9","_k":"001c087a"},{"t":"`A = xy`","fb":"`y = (100 - x)/2`.","_n":"19789","_k":"89289556"},{"t":"`A = x(100 - 2x)`","fb":"`y = (100 - x)/2`.","_n":"1a799","_k":"4932cf8b"},{"t":"`A = 100x`","fb":"`y = (100 - x)/2`.","_n":"1b6e9","_k":"e4152b3f"}]},{"id":"q3","goal":2,"prompt":"Why state the domain?","choices":[{"t":"Because `f′` needs it","fb":"The best value could be at an endpoint.","_n":"1c6f9","_k":"341c952d"},{"t":"To avoid negative derivatives","fb":"The best value could be at an endpoint.","_n":"1d7c9","_k":"ca2a767c"},{"t":"To know which endpoints to compare","fb":"Right. The best value could be at an endpoint.","_n":"1e7b9","_k":"f4811f97"},{"t":"It’s optional","fb":"The best value could be at an endpoint.","_n":"1f7e9","_k":"e21a4a94"}]},{"id":"q4","goal":5,"prompt":"Problem B (sum of squares, sum 16): the \u003cstrong>largest\u003c/strong> value of `S` occurs at …","choices":[{"t":"`x = 0` or `x = 16`","fb":"Right. `S(0) = S(16) = 256`; `x = 8` gives the minimum, 128.","_n":"1g7d9","_k":"6c8dcecf"},{"t":"`x = 8`","fb":"`x = 8` gives the minimum; the endpoints give 256.","_n":"1h789","_k":"cf0497bb"},{"t":"There is none","fb":"`x = 8` gives the minimum; the endpoints give 256.","_n":"1i779","_k":"838969b9"},{"t":"`x = 4`","fb":"`x = 8` gives the minimum; the endpoints give 256.","_n":"1j7a9","_k":"706d98e4"}]}]}},"practice":{"activities":[{"id":"models","type":"custom","title":"Model builder","summary":"Model builder","goal":[1,2],"instruction":"For each situation, choose the one-variable function and the domain.","how":"Tap one function and one domain, then press Check.","items":[{"id":"m1","t":"Rectangle, perimeter 60 cm, width `x`; maximize area.","fn":{"options":[{"t":"`A = x(60 - 2x)`","why":"That’s a field along a wall; here all four sides count.","_n":"1k799","_k":"195e7c91"},{"t":"`A = xy`","why":"Use the constraint to replace `y`: with `2x + 2y = 60`, `y = 30 - x`.","_n":"1l749","_k":"51897813"},{"t":"`A = x(60 - x)`","why":"`2x + 2L = 60`: the length is half of `60 - 2x`.","_n":"1m739","_k":"b104abc9"},{"t":"`A = x(30 - x)`","why":"`2x + 2L = 60`, so the length is `30 - x`.","_n":"1nea9","_k":"3024e845"}]},"dom":{"options":[{"t":"`0 \u003c= x \u003c= 60`","why":"A width over 30 cm leaves a negative length.","_n":"1oeb9","_k":"358211d8"},{"t":"`0 \u003c= x \u003c= 15`","why":"A 20 cm width (length 10 cm) is possible too.","_n":"1pec9","_k":"333165ca"},{"t":"`x > 0`","why":"There’s an upper limit: `30 - x >= 0`.","_n":"1qed9","_k":"cfc7182c"},{"t":"`0 \u003c= x \u003c= 30`","why":"The length `30 - x` can’t be negative.","_n":"1re69","_k":"da71a69e"}]},"why":"`A = x(30 - x)` on `0 \u003c= x \u003c= 30`."},{"id":"m2","t":"Two numbers with sum 20; maximize the product.","fn":{"options":[{"t":"`P = xy`","why":"Use the constraint to replace `y`: with `x + y = 20`, `y = 20 - x`.","_n":"1se79","_k":"f314ccf5"},{"t":"`P = x(20 - x)`","why":"The other number is `20 - x`.","_n":"1te89","_k":"27a49f9a"},{"t":"`P = x + (20 - x)`","why":"That’s the sum, which is always 20.","_n":"1ue99","_k":"565b03f1"},{"t":"`P = x(20 + x)`","why":"The other number is `20 - x`.","_n":"1vf29","_k":"ee356c3c"}]},"dom":{"options":[{"t":"`x != 0`","why":"Nothing rules out 0: 0 + 20 = 20.","_n":"1wf39","_k":"43d448c8"},{"t":"`x >= 20`","why":"Then the other number, `20 - x`, is 0 or negative; nothing says to start at 20.","_n":"1xf09","_k":"4713a530"},{"t":"`0 \u003c= x \u003c= 10`","why":"`x = 15` works too: 15 + 5 = 20.","_n":"1yef9","_k":"b23a0f5a"},{"t":"any real `x` (or `0 \u003c= x \u003c= 20` if positive)","why":"Nothing limits two real numbers; if they must be positive, `x` stays between 0 and 20.","_n":"1zee9","_k":"7d7e5225"}]},"why":"`P = x(20 - x)`; `x` can be any real number (or `0 \u003c= x \u003c= 20` if the numbers are positive)."},{"id":"m3","t":"Box from a 30 cm × 18 cm sheet: squares of side `x` are cut from the corners.","fn":{"options":[{"t":"`V = x(30 - x)(18 - x)`","why":"Each side loses a square at both ends: `2x`.","_n":"20ed9","_k":"7555f6f4"},{"t":"`V = lwh`","why":"Three variables: use the sheet to write the length, width and height in terms of `x`.","_n":"21ec9","_k":"b8c01232"},{"t":"`V = (30 - 2x)(18 - 2x)`","why":"That’s the base area; multiply by the height `x`.","_n":"22eb9","_k":"6fff3274"},{"t":"`V = x(30 - 2x)(18 - 2x)`","why":"Each side loses `2x`; the height is `x`.","_n":"23ea9","_k":"9bc959a1"}]},"dom":{"options":[{"t":"`0 \u003c= x \u003c= 18`","why":"The 18 cm side loses `2x`.","_n":"24e99","_k":"6e56bea9"},{"t":"`x >= 0`","why":"There’s an upper limit: `18 - 2x >= 0`.","_n":"25f89","_k":"25ae06fc"},{"t":"`0 \u003c= x \u003c= 9`","why":"`18 - 2x >= 0`.","_n":"26f79","_k":"c7e182f7"},{"t":"`0 \u003c= x \u003c= 15`","why":"That’s the 30 cm side’s limit; the 18 cm side runs out first.","_n":"276e7","_k":"169fe6bd"}]},"why":"`V = x(30 - 2x)(18 - 2x)` on `0 \u003c= x \u003c= 9`."},{"id":"m4","t":"Field along a wall, 400 m of fence (no fence on the wall side).","fn":{"options":[{"t":"`A = x(400 - x)`","why":"There are two widths: `2x + y = 400`.","_n":"286f7","_k":"13935ddd"},{"t":"`A = xy`","why":"Use the constraint to replace `y`: with `2x + y = 400`, `y = 400 - 2x`.","_n":"296c7","_k":"8ae38fa5"},{"t":"`A = x(200 - x)`","why":"That fences all four sides; the wall side is free.","_n":"2a6d7","_k":"df65f6fe"},{"t":"`A = x(400 - 2x)`","why":"Two widths and one length: `2x + y = 400`.","_n":"2b6a7","_k":"caf4d9e3"}]},"dom":{"options":[{"t":"`0 \u003c= x \u003c= 100`","why":"`x = 150` works too: 2(150) + 100 = 400.","_n":"2c6b7","_k":"0f357d32"},{"t":"`x > 0`","why":"There’s an upper limit: `400 - 2x >= 0`.","_n":"2d687","_k":"0c0040fb"},{"t":"`0 \u003c= x \u003c= 400`","why":"Two 400 m widths would need 800 m of fence.","_n":"2e697","_k":"decf4617"},{"t":"`0 \u003c= x \u003c= 200`","why":"`400 - 2x >= 0`.","_n":"2f767","_k":"98b4896b"}]},"why":"`A = x(400 - 2x)` on `0 \u003c= x \u003c= 200`."},{"id":"m5","t":"Open square-based box, volume 32 000 cm³; minimize the material.","fn":{"options":[{"t":"`S = 2x^2 + 128 000/x`","why":"That adds a lid: the box is open.","_n":"2g777","_k":"3700b2a0"},{"t":"`S = x^2 + 4xh`","why":"Still two variables: use `x^2h = 32 000` to replace `h`.","_n":"2h748","_k":"e19d4e4d"},{"t":"`S = x^2 + 32 000/x`","why":"There are four sides: `4x · 32 000/x^2 = 128 000/x`.","_n":"2i738","_k":"f82a4983"},{"t":"`S = x^2 + 128 000/x`","why":"`h = 32 000/x^2`, and four sides of `xh`.","_n":"2j768","_k":"978e58b6"}]},"dom":{"options":[{"t":"`0 \u003c x \u003c= 40`","why":"A 50 cm base works too (`h = 12.8` cm): there’s no upper limit.","_n":"2k758","_k":"2d10ed83"},{"t":"`0 \u003c= x \u003c= 32 000`","why":"`x = 0` gives no box, and nothing stops the base at 32 000 cm.","_n":"2l788","_k":"b6332c55"},{"t":"`x >= 0`","why":"At `x = 0` there is no base, and `h = 32 000/0` is undefined.","_n":"2m778","_k":"6e26e033"},{"t":"`x > 0`","why":"Any positive base side gives a box; there are no endpoints.","_n":"2n7a8","_k":"49bf2835"}]},"hints":["Write `h` from the volume.","`h = 32 000/x^2`.","`S = x^2 + 4x(32 000/x^2) = x^2 + 128 000/x`."],"why":"`S = x^2 + 128 000/x` for `x > 0`."},{"id":"m6","t":"Rectangle under `y = 9 - x^2`, with its base on the `x`-axis.","fn":{"options":[{"t":"`A = x(9 - x^2)`","why":"The rectangle reaches from `-x` to `x`: width `2x`.","_n":"2o798","_k":"271b9a83"},{"t":"`A = 2x(9 - x^2)`","why":"Width `2x`, height `9 - x^2`.","_n":"2p6c8","_k":"e3970cc2"},{"t":"`A = 2xy`","why":"Use the curve to replace `y`: `y = 9 - x^2`.","_n":"2q6b8","_k":"a1c9d999"},{"t":"`A = 2x(9 - x)`","why":"The height is the curve’s `y`-value, `9 - x^2`.","_n":"2r192","_k":"ca35d00e"}]},"dom":{"options":[{"t":"`x > 0`","why":"There’s an upper limit where the curve meets the axis: `x = 3`.","_n":"2s182","_k":"494e8bfa"},{"t":"`0 \u003c= x \u003c= 3`","why":"The height `9 - x^2` can’t be negative.","_n":"2t172","_k":"13215b3d"},{"t":"`0 \u003c= x \u003c= 9`","why":"At `x = 4` the height `9 - 16` is negative.","_n":"2u162","_k":"a2825e7e"},{"t":"`-3 \u003c= x \u003c= 3`","why":"`x` is the half-width, a distance: `x >= 0`.","_n":"2v1d2","_k":"0888e6ab"}]},"why":"`A = 2x(9 - x^2)` on `0 \u003c= x \u003c= 3`."}]},{"id":"solve","type":"custom","title":"Solve it","summary":"Solve it","star":true,"goal":[3,4,5,6],"instruction":"Build the model, find the candidates, compare, and enter the answer. Items 4 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type whole numbers, fractions or exact roots (such as 25/2 or √5/2) in the boxes, then press Check.","items":[{"id":"s1","goal":[4,6],"prompt":"Two numbers add to 20. What is their largest possible product?","boxes":[{"k":"v","label":"Largest product"}],"_a":"SxcTQQpSVlFN","display":"100","wrong":[{"v":10,"fb":"10 is each number; the product is 100."}],"why":"`P = x(20 - x)`, `P′ = 20 - 2x = 0` at `x = 10`: 10 × 10 = 100."},{"id":"s2","goal":[4,6],"prompt":"A rectangle has perimeter 60 cm. What is its largest area?","boxes":[{"k":"v","label":"Largest area","unit":"cm²"}],"_a":"SxcTQQpRVFRN","display":"225 cm²","wrong":[{"v":15,"fb":"15 cm is the side length. The question asked for the area."}],"why":"`A = x(30 - x)`, `A′ = 30 - 2x = 0` at `x = 15`: a 15 cm square, 225 cm²."},{"id":"s3","goal":[4,6],"prompt":"An open box with a square base must hold 32 000 cm³. Find the base side and height that use the least material.","boxes":[{"k":"b","label":"Base side","unit":"cm"},{"k":"h","label":"Height","unit":"cm"}],"_a":"SxcHQQpXVk0SXUdZAlMb","display":"base 40 cm, height 20 cm","wrong":[{"b":20,"h":80,"fb":"Swapped? `h = 32 000/40^2 = 20`."},{"b":20,"h":40,"fb":"Swapped? `h = 32 000/40^2 = 20`."}],"wrongDefault":"Write `S(x) = x^2 + 128 000/x`, solve `S′(x) = 0`, then find `h`.","why":"`S = x^2 + 128 000/x`, `S′ = 2x - 128 000/x^2 = 0` when `x^3 = 64 000`: `x = 40`, `h = 32 000/40^2 = 20`. `S` decreases before `x = 40` and increases after."},{"id":"s4","goal":[4,6],"star":true,"prompt":"A rectangle is inscribed in a semicircle of radius 5, with its base on the diameter. What is its largest area?","boxes":[{"k":"v","label":"Largest area","unit":"square units"}],"_a":"SxcTQQpRUxw=","display":"25","wrong":[{"v":12.5,"fb":"The width is `2x`, not `x`."}],"why":"`A(x) = 2x√{25 - x^2}` on `[0, 5]`; `A′(x) = {50 - 4x^2}/{√{25 - x^2}} = 0` at `x^2 = 25/2`, so `A = 2 · 25/2 = 25`."},{"id":"s5","goal":[3,5,6],"star":true,"prompt":"Which points on `y = x^2` are closest to `(0, 3/2)`? Give the distance.","boxes":[{"k":"a","label":"Points: `x = ±`"},{"k":"b","label":"`y =`"},{"k":"d","label":"Distance","exact":true}],"_a":"SxcEQQpSSkNSF19SHEECQwoXh+uqVklTEkg=","display":"`(±1, 1)`; distance `√5/2`","wrong":[{"a":0,"b":0,"fb":"`x = 0` is a critical number of `D = x^4 - 2x^2 + 9/4`, but it’s a local maximum of the distance."}],"wrongDefault":"Minimize the square of the distance, then compare the critical numbers.","hints":["Minimize the square of the distance: `D(x) = x^2 + (x^2 - 3/2)^2`.","`D′(x) = 4x^3 - 4x = 4x(x - 1)(x + 1)`.","`D(±1) = 5/4 \u003c D(0) = 9/4`, so the distance is `√5/2`."],"why":"`D(x) = x^4 - 2x^2 + 9/4`; `D′ = 4x(x - 1)(x + 1)`; `D(±1) = 5/4 \u003c D(0) = 9/4`, so the closest points are `(±1, 1)`, at distance `√{5/4} = √5/2`."},{"id":"s6","goal":[5,6],"star":true,"prompt":"A 40 cm wire is cut in two; each piece is bent into a square. Where should it be cut to make the total area as small as possible? As large as possible?","note":"Give the length of the first piece. For “don’t cut”, type 0 (or 40).","boxes":[{"k":"c1","label":"Smallest: cut at","unit":"cm"},{"k":"a1","label":"total area","unit":"cm²"},{"k":"c2","label":"Largest: cut at","unit":"cm"},{"k":"a2","label":"total area","unit":"cm²"}],"_a":"SxcGUhJZVFEcFwRSEllTURwXBlESWT1RHAFVPhxBB1MSD1RTAB4=","display":"smallest: cut at 20 cm (50 cm²); largest: don’t cut (one 10 cm square, 100 cm²)","wrong":[{"c2":20,"fb":"`A(x) = x^2/16 + (40 - x)^2/16` has its only critical number at the minimum. The maximum is at an endpoint."}],"wrongDefault":"Write `A(x)` for a cut at `x`, then compare the critical number with the endpoints 0 and 40.","hints":["Let `x` be the length bent into the first square; its side is `x/4`.","`A(x) = (x/4)^2 + ((40 - x)/4)^2`, `0 \u003c= x \u003c= 40`.","`A′ = 0` at `x = 20` gives 50 (the minimum); `A(0) = A(40) = 100` (the maximum)."],"why":"`A′ = 0` at `x = 20` gives 50 cm², the minimum. `A(0) = A(40) = 100` cm²: the maximum is at an endpoint, so don’t cut."}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Quinn","how":"","goal":[2,3,6],"instruction":"Quinn made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the largest open box made by cutting squares from the corners of a 24 cm × 24 cm sheet.","steps":["`V(x) = x(24 - 2x)^2`.","Domain: `0 \u003c= x \u003c= 24`.","`V′(x) = (24 - 2x)(24 - 6x) = 0`, so `x = 4` or `x = 12`.","Compare: `V(0) = 0`, `V(4) = 1024`, `V(12) = 0`, `V(24) = 13 824`. The best cut is 24 cm."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","","The derivative is right.","Step 4 follows from step 2’s domain. The mistake is earlier."],"fixes":[{"t":"`0 \u003c x \u003c 24`, open.","why":"Still allows impossible cuts.","_n":"2w1c2","_k":"9a634259"},{"t":"`0 \u003c= x \u003c= 6`.","why":"Too small; `x = 8` is a possible cut.","_n":"2x1b2","_k":"ae4ced9f"},{"t":"Step 2 is correct.","why":"A 24 cm cut leaves no base: `24 - 48 \u003c 0`.","_n":"2y1a2","_k":"060aac49"},{"t":"Each side loses `2x`, so `24 - 2x >= 0`: `0 \u003c= x \u003c= 12`. Then the best cut is 4 cm, volume 1024 cm³.","why":"A cut can use up at most the whole side: `2x \u003c= 24`.","_n":"2z212","_k":"13a5b4c0"}],"hints":["What’s the base side when `x = 13`?","`24 - 26 \u003c 0`.","`0 \u003c= x \u003c= 12`."]},{"id":"e2","goal":3,"task":"600 m of fence encloses a field along a river (no fence on the river side). Find the largest area.","steps":["Let `x` be the width; the length is `600 - 2x`.","`A(x) = x(600 - 2x) = 600x - 2x^2`, `0 \u003c= x \u003c= 300`.","`A′(x) = 600 - 2x = 0`, so `x = 300`.","`A(300) = 0`, so the field has no area."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"`A′(x) = 600 - 4x = 0`, so `x = 150`: 150 m by 300 m, area 45 000 m².","why":"The power rule on `2x^2` gives `4x`, so the critical number is 150.","_n":"30202","_k":"dc5be684"},{"t":"`A′(x) = 600 - x`.","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span>`(2x^2) = 4x`.","_n":"31132","_k":"8995bcac"},{"t":"Set `A = 0` instead.","why":"`A = 0` gives the zero-area designs. The best design is where `A′ = 0`.","_n":"32142","_k":"1a955000"},{"t":"Step 3 is correct.","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span>`(2x^2) = 4x`, not `2x`.","_n":"33152","_k":"4a1e251c"}],"hints":["Differentiate `2x^2` carefully.","Power rule: 2 × `2x`.","`x = 150`."]},{"id":"e3","goal":6,"task":"A rectangle has perimeter 40 cm. What is its largest possible area?","steps":["Width `x`, length `20 - x`.","`A(x) = x(20 - x) = 20x - x^2`, `0 \u003c= x \u003c= 20`.","`A′(x) = 20 - 2x = 0`, so `x = 10`; `A(0) = A(20) = 0`.","So the largest area is 10."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"The largest area is `A(10) = 100` cm² (a 10 cm square).","why":"Answer the question that was asked, with units.","_n":"34162","_k":"7d0b553b"},{"t":"The largest area is 20 cm².","why":"That’s the half-perimeter.","_n":"35172","_k":"2b935f44"},{"t":"The largest area is 10 cm².","why":"Units don’t fix it: 10 is the width.","_n":"36182","_k":"de7b58a0"},{"t":"Step 4 is correct.","why":"`x = 10` is where; the question asks for the area. `x = 10` is the width. The question asked for the area: `A(10) = 100`.","_n":"37192","_k":"3a6bf594"}],"hints":["What did the question ask for?","The area, not `x`.","`A(10) = 100` cm²."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: that the cube isn’t the best box, or that doubling the fence quadruples the area?"},{"id":"j2","q":"In your own words, why must the function you differentiate have only one variable?"},{"id":"j3","q":"Explain to a friend the six steps of the optimization algorithm, using the river field as your example."},{"id":"j4","q":"Which step is hardest for you: building the model, the domain, or the derivative? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A rectangle has perimeter 80 cm and width `x` cm. Which function gives its area?","options":[{"t":"`A(x) = xy`","why":"Two variables: use the perimeter to replace `y`.","_n":"381a2","_k":"1ae83e37"},{"t":"`A(x) = x(80 - x)`","why":"That uses the whole perimeter as one length.","_n":"391b2","_k":"53bfd7c9"},{"t":"`A(x) = x(40 - x)`","why":"Length = `40 - x`.","_n":"3a1c2","_k":"c9900bbf"},{"t":"`A(x) = x(80 - 2x)`","why":"That’s the river field; here all four sides are fenced.","_n":"3ba53","_k":"4ec79292"}]},"b":{"prompt":"A rectangle has perimeter 100 cm and width `x` cm. Which function gives its area?","options":[{"t":"`A(x) = x(100 - x)`","why":"That uses the whole perimeter as one length.","_n":"3ca43","_k":"cf1afe8e"},{"t":"`A(x) = xy`","why":"Two variables: use the perimeter to replace `y`.","_n":"3da73","_k":"ed0bf2ba"},{"t":"`A(x) = x(100 - 2x)`","why":"That’s the river field; here all four sides are fenced.","_n":"3ea63","_k":"3fc56f76"},{"t":"`A(x) = x(50 - x)`","why":"Length = `50 - x`.","_n":"3fa93","_k":"b3629745"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"An open box is made by cutting squares of side `x` cm from the corners of a 20 cm × 20 cm sheet. What is the domain of `V(x)`?","options":[{"t":"`x >= 0`","why":"There’s an upper limit.","_n":"3ga83","_k":"d53de926"},{"t":"`0 \u003c= x \u003c= 10`","why":"`20 - 2x >= 0`.","_n":"3hab3","_k":"96d4a048"},{"t":"`0 \u003c= x \u003c= 20`","why":"A 15 cm cut leaves a negative base.","_n":"3iaa3","_k":"5e9a2871"},{"t":"`0 \u003c= x \u003c= 5`","why":"`x = 8` is a possible cut.","_n":"3j9d2","_k":"44503b50"}]},"b":{"prompt":"An open box is made by cutting squares of side `x` cm from the corners of a 30 cm × 18 cm sheet. What is the domain of `V(x)`?","options":[{"t":"`x >= 0`","why":"There’s an upper limit: `18 - 2x >= 0`.","_n":"3k9c2","_k":"abaf21aa"},{"t":"`0 \u003c= x \u003c= 9`","why":"The 18 cm side limits the cut: `18 - 2x >= 0`.","_n":"3l9f2","_k":"0dfe6feb"},{"t":"`0 \u003c= x \u003c= 30`","why":"A 20 cm cut leaves a negative base: `18 - 40 \u003c 0`.","_n":"3ma02","_k":"f3feccc7"},{"t":"`0 \u003c= x \u003c= 15`","why":"That’s the longer side’s limit; the shorter side runs out first.","_n":"3n9d2","_k":"b83379f4"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"The area of a field is `A(x) = 800x - 4x^2`. Which `x` makes `A′(x) = 0`?","options":[{"t":"50","why":"`8x = 800` gives 100.","_n":"3o9e2","_k":"1e0e0f40"},{"t":"100","why":"`A′ = 800 - 8x`.","_n":"3p9b2","_k":"096b9ba3"},{"t":"200","why":"`A(200) = 0`: a zero of `A`, not of `A′`.","_n":"3q9c2","_k":"e8c44ba4"},{"t":"400","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span>`(4x^2) = 8x`, not `2x`.","_n":"3r992","_k":"9d2db1e1"}]},"b":{"prompt":"`A(x) = 900x - 3x^2`. Which `x` makes `A′(x) = 0`?","options":[{"t":"75","why":"`6x = 900` gives 150.","_n":"3s9a2","_k":"60c29bf8"},{"t":"150","why":"`A′ = 900 - 6x`.","_n":"3ta72","_k":"592afb1a"},{"t":"300","why":"`A(300) = 0`: a zero of `A`, not of `A′`.","_n":"3ua82","_k":"0a280ee7"},{"t":"450","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span>`(3x^2) = 6x`, not `2x`.","_n":"3vb13","_k":"48bad8e7"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"600 m of fence encloses a rectangular field along a river (no fence on the river side), with one extra fence across the middle, parallel to the ends. Which width (perpendicular to the river) gives the largest area?","options":[{"t":"300 m","why":"That’s the length along the river.","_n":"3wb03","_k":"4bd702c3"},{"t":"200 m","why":"`A(200) = 0`.","_n":"3xaf3","_k":"9b8ac027"},{"t":"150 m","why":"That ignores the divider: there are three widths.","_n":"3yae3","_k":"dd2ee405"},{"t":"100 m","why":"`3x + y = 600`, `A = x(600 - 3x)`, `A′ = 600 - 6x = 0`.","_n":"3zad3","_k":"be9f0c70"}]},"b":{"prompt":"900 m of fence encloses a rectangular field along a river (no fence on the river side), with one extra fence across the middle, parallel to the ends. Which width (perpendicular to the river) gives the largest area?","options":[{"t":"300 m","why":"`A(300) = 0`.","_n":"40ac3","_k":"832cd297"},{"t":"225 m","why":"That ignores the divider: there are three widths.","_n":"41ab3","_k":"690a64d3"},{"t":"450 m","why":"That’s the length along the river.","_n":"42aa3","_k":"cece3aeb"},{"t":"150 m","why":"`A = x(900 - 3x)`, `A′ = 0` at 150.","_n":"43a93","_k":"e0ed1fa9"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A 40 cm wire is cut into two pieces and each is bent into a square. How should it be cut to make the total area as \u003cstrong>large\u003c/strong> as possible?","options":[{"t":"Don’t cut it: one 10 cm square, 100 cm²","why":"`A(x) = x^2/16 + (40 - x)^2/16` on `[0, 40]`: `A(0) = A(40) = 100`, `A(20) = 50`.","_n":"44a83","_k":"52be5b6f"},{"t":"Cut at 10 cm","why":"`A(10) = 6.25 + 56.25 = 62.5 \u003c 100`.","_n":"45ab3","_k":"6f297baf"},{"t":"Cut at 30 cm","why":"Same as cutting at 10 cm.","_n":"46ac3","_k":"fcb528d9"},{"t":"Cut it in half: two 5 cm squares","why":"`A′ = 0` at 20, but that’s the minimum, 50 cm².","_n":"47ad3","_k":"273b8c3f"}]},"b":{"prompt":"A 48 cm wire is cut into two pieces and each is bent into a square. How should it be cut to make the total area as \u003cstrong>large\u003c/strong> as possible?","options":[{"t":"Cut it in half: two 6 cm squares","why":"That’s the minimum, 72 cm².","_n":"48ae3","_k":"5c4200a5"},{"t":"Cut at 12 cm","why":"`A(12) = 9 + 81 = 90 \u003c 144`.","_n":"49a73","_k":"347008be"},{"t":"Cut at 36 cm","why":"Same as cutting at 12 cm.","_n":"4aa83","_k":"a17e5cad"},{"t":"Don’t cut it: one 12 cm square, 144 cm²","why":"`A(x) = x^2/16 + (48 - x)^2/16` on `[0, 48]`: `A(0) = A(48) = 144`, `A(24) = 72`.","_n":"4ba93","_k":"cd47f830"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"A rectangle has its base on the `x`-axis and its upper corners on `y = 27 - x^2`. What is its largest area?","options":[{"t":"3","why":"That’s `x`.","_n":"4caa3","_k":"9e406abe"},{"t":"18","why":"That’s the height.","_n":"4da33","_k":"0dfc8333"},{"t":"54","why":"That’s `x(27 - x^2)`: the width is `2x`.","_n":"4ea43","_k":"9181bec5"},{"t":"108","why":"`A = 2x(27 - x^2)`, `A′ = 54 - 6x^2 = 0` at `x = 3`: 6 × 18.","_n":"4f1d3","_k":"788da5e5"}]},"b":{"prompt":"A rectangle has its base on the `x`-axis and its upper corners on `y = 48 - x^2`. What is its largest area?","options":[{"t":"4","why":"That’s `x`.","_n":"4g1c3","_k":"58d62ed4"},{"t":"32","why":"That’s the height.","_n":"4h1f3","_k":"4533b9ba"},{"t":"128","why":"The width is `2x`.","_n":"4i1e3","_k":"0f904ed8"},{"t":"256","why":"`A′ = 96 - 6x^2 = 0` at `x = 4`: 8 × 32.","_n":"4j193","_k":"80e069a8"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"For 800 m of fence along a river, `A(x) = x(800 - 2x)` on `[0, 400]`. Which is the best justification that `x = 200` gives the maximum?","options":[{"t":"“`x = 200` is the only critical number in the domain, and `A(0) = 0`, `A(200) = 80 000`, `A(400) = 0`, so 80 000 m² is the largest value.”","why":"It names every candidate and compares them.","_n":"4k183","_k":"825ea684"},{"t":"“`A(200)` is positive.”","why":"Many designs give a positive area.","_n":"4l1b3","_k":"4e2feef2"},{"t":"“200 is in the middle of the domain.”","why":"Being in the middle proves nothing.","_n":"4m1a3","_k":"2e360b78"},{"t":"“`A′(200) = 0`, so it must be a maximum.”","why":"`A′ = 0` also happens at minimums.","_n":"4n253","_k":"7e9e4c3e"}]},"b":{"prompt":"For a 30 × 30 sheet, `V(x) = x(30 - 2x)^2` on `[0, 15]`. Which is the best justification that `x = 5` gives the maximum?","options":[{"t":"“`V(5)` is positive.”","why":"Many cuts give a positive volume.","_n":"4o243","_k":"8fa3b5ea"},{"t":"“`x = 5` is the only critical number inside the domain (15 is an endpoint), and `V(0) = 0`, `V(5) = 2000`, `V(15) = 0`, so 2000 cm³ is the largest.”","why":"It names every candidate and compares them.","_n":"4p173","_k":"07776f68"},{"t":"“5 is a third of 15.”","why":"Coincidence isn’t proof.","_n":"4q183","_k":"c7d8702d"},{"t":"“`V′(5) = 0`, so it’s a maximum.”","why":"`V′ = 0` also happens at minimums: `V′(15) = 0` too, where the volume is 0.","_n":"4r153","_k":"f1a717e7"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"A student finds `x = 200` for the river field with 800 m of fence. Which final answer best answers “What dimensions give the largest area?”","options":[{"t":"“80 000.”","why":"That’s the area without units, and the question asked for dimensions.","_n":"4s163","_k":"5c03f09d"},{"t":"“About 267 m by 267 m.”","why":"A square uses fence on the river side too; it isn’t optimal here.","_n":"4t1b3","_k":"ba4aaa8a"},{"t":"“`x = 200`.”","why":"No context, no second dimension, no units.","_n":"4u1c3","_k":"19885966"},{"t":"“200 m by 400 m, with the 400 m side along the river; the area is 80 000 m².”","why":"Both dimensions, which side is which, and the area, with units.","_n":"4v193","_k":"ca6eabec"}]},"b":{"prompt":"A student finds `x = 5` for the 30 × 30 sheet. Which final answer best answers “What size box holds the most?”","options":[{"t":"“2000.”","why":"That’s the volume without units, and the question asked what size box.","_n":"4w1a3","_k":"3844615a"},{"t":"“Cut 5 cm squares: the box is 20 cm × 20 cm × 5 cm and holds 2000 cm³.”","why":"The cut, the box’s dimensions and its volume, with units.","_n":"4x1f3","_k":"69112c3d"},{"t":"“10 cm × 10 cm × 10 cm, a cube.”","why":"The cube (cut 10 cm) holds 1000 cm³.","_n":"4y203","_k":"8b332ce4"},{"t":"“`x = 5`.”","why":"That’s only the cut: no box size and no units.","_n":"4za93","_k":"a83a7ebb"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A 200 m² rectangular storage yard is fenced. The front side costs $30/m; the other three sides cost $10/m. Which dimensions cost the least?","options":[{"t":"10 m along the front, 20 m deep","why":"Cost = `30x + 10x + 2(10)(200/x) = 40x + 4000/x`; `C′ = 0` at `x = 10`. Cost $800.","_n":"50a83","_k":"3c6c6738"},{"t":"20 m along the front, 10 m deep","why":"Swapped: the expensive side should be the short one.","_n":"51a73","_k":"6c810a1d"},{"t":"5 m along the front, 40 m deep","why":"`C(5) = 200 + 800` = $1000 > $800.","_n":"52a63","_k":"419c14d3"},{"t":"`10√2` m by `10√2` m","why":"A square ignores the dearer front.","_n":"53ad3","_k":"e0536ab0"}]},"b":{"prompt":"A 300 m² rectangular storage yard is fenced. The front side costs $50/m; the other three sides cost $10/m. Which dimensions cost the least?","options":[{"t":"15 m along the front, 20 m deep","why":"`C(15) = 900 + 400` = $1300.","_n":"54ac3","_k":"61fb68c8"},{"t":"10 m along the front, 30 m deep","why":"Cost = `60x + 6000/x`; `x = 10`. Cost $1200.","_n":"55ab3","_k":"1e4c537f"},{"t":"30 m along the front, 10 m deep","why":"Swapped: the expensive side should be the short one.","_n":"56aa3","_k":"c7745334"},{"t":"`10√3` m by `10√3` m","why":"A square ignores the dearer front.","_n":"57a13","_k":"9344fc09"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A poster must have 96 cm² of printed area, with 2 cm margins at the sides and 3 cm margins at the top and bottom. Which poster size uses the least paper?","options":[{"t":"12 cm wide by 18 cm tall","why":"Print `w × 96/w`; paper `(w + 4)(96/w + 6) = 120 + 6w + 384/w`, least at `w = 8`. Print 8 × 12; poster 12 × 18 = 216 cm².","_n":"58a03","_k":"a7580948"},{"t":"18 cm wide by 12 cm tall","why":"Swapped: the taller margins go on the taller sides.","_n":"59233","_k":"0fdf46ec"},{"t":"About 13.8 cm by 15.8 cm, using a square print area","why":"That uses about 218 cm², more than 216.","_n":"5a243","_k":"12454baf"},{"t":"8 cm wide by 12 cm tall","why":"That’s the printed area, not the poster.","_n":"5b253","_k":"32414bcd"}]},"b":{"prompt":"A poster must have 150 cm² of printed area, with 3 cm side margins and 2 cm top and bottom margins. Which poster size uses the least paper?","options":[{"t":"14 cm wide by 21 cm tall","why":"Swapped: with the wider side margins, the poster should be wider than it is tall.","_n":"5c263","_k":"11489727"},{"t":"A square print area, `√150` cm on each side","why":"That uses about 296 cm², more than 294.","_n":"5d273","_k":"5b0ffd29"},{"t":"15 cm wide by 10 cm tall","why":"That’s the printed area, not the poster.","_n":"5e283","_k":"f39f8f0f"},{"t":"21 cm wide by 14 cm tall","why":"Paper `174 + 4w + 900/w`, least at `w = 15`. Print 15 × 10; poster 21 × 14 = 294 cm².","_n":"5f293","_k":"f9487af2"}]}}]},"task":{"title":"Design a sheet","summary":"Design a sheet","statement":"\u003cp>Choose the length and width of a rectangular sheet of card. Squares will be cut from the corners to make the largest possible open box. Meet every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The best cut is a whole number of centimetres.\u003c/li>\u003cli>The sheet is not a square.\u003c/li>\u003cli>The largest box holds at least 1000 cm³.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Length `L` and width `W` are whole numbers from 2 to 40 cm; either can be the longer side. The shape stage folds the box at its best cut.\u003c/p>","checks":["Best cut is a whole number","Not a square","Volume at least 1000 cm³"],"tips":["The best cut is `x = {(L + W) - √{L^2 - LW + W^2}}/{6}`. For a whole number, `L^2 - LW + W^2` must be a perfect square.","Squares always work for line 1 when the side is a multiple of 6; this task wants a rectangle.","Bigger sheets give bigger boxes: try sides in the 20s to 40s."],"explainPrompt":"Explain how you found a sheet whose best cut is a whole number, and how you know the volume at that cut is the largest.","vocab":"Use the words model, domain, critical number and endpoint.","more":"There’s more than one answer. Find them all.","after3":"Smaller rectangles with whole-number cuts exist too, such as 16 × 10 (cut 2) and 21 × 16 (cut 3), but their boxes are under 1000 cm³."},"cards":[["Optimization","Find the maximum or minimum of a quantity."],["Constraint","The fixed condition (perimeter, volume, fence length) used to remove a variable."],["Model","One function of one variable, e.g. `A(x) = x(600 - 2x)`."],["Domain of a model","The physically possible values, e.g. `0 \u003c= x \u003c= 12` for a 24 cm sheet."],["The algorithm","Sketch → model → domain → derivative = 0 → compare → answer."],["Candidates","Critical numbers in the domain and its endpoints."],["Box from a sheet","`V = x(L - 2x)(W - 2x)`, `0 \u003c= x \u003c= min(L, W)/2`."],["Field along a river","`A = x(P - 2x)`; best at `x = P/4`, length `P/2`."],["Open square-based box","`S = x^2 + 4xh` with `h = V/x^2`."],["Squares aren’t always best","Sides with different roles (river, cost) give unequal sides."],["Endpoint answer","Two squares from one wire: the largest total area is with no cut."],["Final answer","Answer the question asked, with units: “150 m by 300 m, 45 000 m²”."]]}};</script>
