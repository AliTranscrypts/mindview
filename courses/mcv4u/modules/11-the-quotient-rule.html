.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 11: hero equation colours, V5 derivative panels (Explore), V11 sign chart, Derive it stations, V8 boxes, task */
.qr-f{color:var(--pen)}
.qr-g{color:var(--f3)}
.qr-minus{background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:0 .14em}
.qr-hcap [data-st]{transition:opacity .45s ease}
.qr-hcap{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:1.05rem}
.qr-hcap .qr-hnum{border-radius:4px;padding:0 .12em;transition:background-color .45s ease}
.qr-lit .qr-hnum{background:var(--hi-soft)}
.qr-hz{font-size:.9rem;color:var(--ink-2)}
.qr-lit .qr-hz .m{background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:0 .2em}
@media (prefers-reduced-motion:reduce){ .qr-hcap [data-st],.qr-hcap .qr-hnum{transition:none} }

canvas.plot.dp-top{aspect-ratio:16/10}
canvas.plot.dp-low{aspect-ratio:16/8}
.dp-panels .dp-panel + .dp-panel{margin-top:6px}
.dp-panels .dp-lowwrap[hidden],.qx-sc[hidden]{display:none}
.dp-ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.dp-main,.dp-side{min-width:0}
.qx-eq{min-height:2.4em}
.qx-key{margin:6px 0 0}
.qx-fns{margin-bottom:6px}
.qx-fns .chip{font-size:.86rem}
.qx-fns .chip .m{font-size:1.05em}
.qx-bsl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;margin:2px 0 4px}
.qx-bsl output{color:var(--ink)}
.qx-how{margin:8px 0 10px}
.qx-sl{margin-top:4px}
.qx-sl output{color:var(--ink)}
.qx-skip{min-height:1.2em;margin:0 0 6px;color:var(--ink-2);font-weight:600}
#qx-tools{margin:2px 0 12px}
.qx-note{color:var(--red);margin:6px 0 0}
.qx-more{display:none;margin-top:6px}
.qx-tc2{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.qx-badge{margin:0;font-weight:700;color:var(--ink);background:var(--hi-soft);border-radius:6px;padding:4px 8px;display:inline-block}
.qx-sc{margin-top:10px}
.qx-sch{margin:0 0 6px;font-size:.95rem}
.qx-sc-wrap{overflow-x:auto;position:relative}
table.qx-sct th,table.qx-sct td{padding:5px 8px;text-align:center;white-space:nowrap}
table.qx-sct tbody th{text-align:left;font-weight:600}
table.qx-sct th .m,table.qx-sct td .m{white-space:nowrap}
.qx-sc-k{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.qx-sct .qx-sc-u{font:600 .78rem var(--font-ui);color:var(--ink-2)}
table.qx-sct .qx-sc-ar{font-size:1.25rem;line-height:1}
table.qx-sct .qx-sc-d td{font-weight:700}
table.qx-sct .hl{background:var(--hi-soft)}

.p3-st h3{margin-top:0}
.p3-st:first-child{margin-top:0;padding-top:0;border-top:0}
.qd-steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;min-height:2.6em}
.qd-steps li{display:flex;gap:10px;align-items:baseline;border:1.5px solid var(--rule);border-radius:6px;padding:.45em .75em;background:var(--sheet)}
.qd-steps li.cur{border-color:var(--ink);background:var(--hi-soft)}
.qd-steps .sn{font-weight:700;color:var(--ink-2)}
.qd-ord{margin-top:16px}
.qd-ord [data-act="hint"]{display:none}
.qd-ord .ostep .m{white-space:normal}
.qd-rule{margin:10px 0 0;font-size:1.1rem;font-weight:600}
#qd-tbl{margin-top:8px}
#qd-tbl table.vt td,#qd-tbl table.vt th{padding:3px 10px}
.qd-lines{margin:12px 0 0}
.qd-same small{font-weight:700;color:var(--ink)}
.qd-thumb{margin-top:14px}
.qd-thumb p{margin:4px 0 0}

.qs-bxs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 4px}
.qs-bxs label{display:flex;align-items:center;gap:8px;font:400 1.1rem var(--font-math)}
.qs-pts{display:flex;flex-wrap:wrap;gap:10px 22px;margin:6px 0 4px}
.qs-pt{display:inline-flex;align-items:center;gap:4px;font-size:1.15rem}
.qs-pt > .tiny{margin-right:6px;font-size:.8rem;color:var(--ink-2)}
.qs-pt .numin.short{width:4.6rem}
.qs-q .chips{margin:6px 0 2px}

.qt-step{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.qt-step label{min-width:7.5rem}
.qt-lab{font-size:1.2rem}
.qt-step .btn{min-width:40px;font-size:1.1rem}
.qt-step .numin.short{width:5.5rem}

@media (max-width:820px){
  .dp-ex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .dp-ex canvas.plot.dp-top,.dp-ex canvas.plot.dp-low{aspect-ratio:auto;height:220px}
  .qx-read:not(.qx-all) .qx-x2{display:none}
  .qx-more{display:inline-flex}
  .qs-pt .numin.short{width:4rem}
  .qt-step label{flex-basis:100%;min-width:0}
}

erlay"}],"modeHow":{"tan":"Drag the point of tangency, or use the slider. The teal panel below shows `f′`, with the current slope as a dot.","sign":"The sign chart shows the sign of each factor of `f′`, the sign of `f′` and how the function behaves (↗ ↘). Horizontal tangents say “slope 0”; zeros of the denominator say “not in the domain”.","wrong":"The long dashes show the wrong rule: the derivative of the top divided by the derivative of the bottom. Compare it with the true `f′` in teal."},"rows":{"fn":"Function","pt":"Point","d":"`f′(x)`","slope":"Slope here","tan":"Tangent","flat":"Horizontal tangents","undef":"Derivative undefined at","wrong":"Dividing the derivatives (wrong rule)"},"skip":"Skipped {x}: not in the domain.","tc2":{"title":"TC2 tangents parallel to `y = -3x + 1`","one":"Found {x}. Move to the other point and press \u003cstrong>Record this point\u003c/strong> to earn the badge.","both":"★ Found both: `x = 0` and `x = 2`.","rec":"Record this point","not":"The slope at {x} is {m}, not −3."},"predIntro":"Make a prediction first. Then the tangent hunter shows you what really happens.","predictions":[{"id":"p1","fn":"R1","mode":"tan","prompt":"R1, point at `x = 0`. What’s the slope of the tangent to `y = {x}/{x^2 + 1}` at `x = 0`?","options":[{"t":"undefined","_n":"oa01","_k":"d174cd70"},{"t":"0","_n":"pa31","_k":"ed1c5b24"},{"t":"1","_n":"qa21","_k":"bd3c6a9b"},{"t":"1/2","_n":"rad1","_k":"8ba04679"}],"explain":"`(1 · 1 - 0 · 0)/1^2 = 1`. Dividing derivatives would give `1/(2x)`, undefined at 0: a sign the wrong rule is wrong."},{"id":"p2","fn":"R3","mode":"tan","prompt":"R3. How many horizontal tangents does `y = {2x + 1}/{x - 2}` have?","options":[{"t":"infinitely many","_n":"sac1","_k":"41f320ff"},{"t":"0","_n":"t9f1","_k":"48a87516"},{"t":"2","_n":"ua01","_k":"e112a98a"},{"t":"1","_n":"v9d1","_k":"72624fc5"}],"explain":"`f′ = -5/(x - 2)^2`. The numerator is −5, which is never 0."},{"id":"p3","fn":"R2","mode":"sign","prompt":"R2, Sign chart mode. Wh rst.","dom":"Not in the domain.","rise":"This tangent rises; you need slope −3.","other":"The slope here is {m}; you need −3."}},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Build mode: choose `c` and `k` so that `y = {x + c}/{x^2 + k}` has horizontal tangents at exactly `x = -3` and `x = 1`.","why":"`c = 1`, `k = 3`: the numerator of `f′` is `-x^2 - 2x + 3 = -(x + 3)(x - 1)`.","hints":["Find the numerator of `f′`: `(x^2 + k) - (x + c)(2x) = -x^2 - 2cx + k`.","It must be a multiple of `(x + 3)(x - 1) = x^2 + 2x - 3`.","`-(x^2 + 2x - 3)`: so `2c = 2` and `k = 3`."],"msgs":{"fn":"Choose Build, then set `c` and `k` with the sliders.","rev":"Your flat spots are at `x = 3` and `x = -1`: the sign of `c` is reversed.","k":"Right axis of symmetry for the flat spots, wrong spacing: the product of the `x`-values must be `-k`.","other":"Your flat spots are at {r}. You need `x = -3` and `x = 1`."}}]},"part3":{"slug":"derive","name":"Derive it","heading":"Derive it from the product rule","intro":"The rule is easy to misremember, so learn to rebuild it. Derive it from the product rule, check it with numbers, then decide when you don’t need it at all. Then try the quick check.","stations":[{"id":"st1","title":"Station 1: Three-line derivation","text":"Step through the derivation. Then put the five steps back in order.","steps":["Let `Q = f/g`. Multiply by `g`: `f = Q · g`.","Product rule: `f′ = Q′g + Qg′`.","Solve for `Q′`: `Q′ = {f′ - Qg′}/{g}`.","Replace `Q` with `f/g`: `Q′ = {f′ - (f/g)g′}/{g}`.","Multiply top and bottom by `g`: `Q′ = {f′g - fg′}/{g^2}`."],"orderPrompt":"Put the five steps of the derivation in order.","orderHow":"Tap a step, then use Move up and Move down to put it in place. Press Check the order when it’s right. Stuck? Step through the derivation above again.","orderWrong":"Solve for `Q′` first, then substitute.","orderWhy":"Write `f = Q · g`, use the product rule, solve for `Q′`, replace `Q`, then clear the small fraction: a second `g` lands underneath."},{"id":"st2","title":"Station 2: Check it with numbers","text":"R1 at `x = 2`: the rule gives `(1 · 5 - 2 · 4)/25 = -3/25`. Choose `h` to draw a secant through P(2, 2/5) and Q; the secant slopes fill the table and approach −0.12.","rule":"Quotient rule: `f′(2) = -3/25 = -0.12`","alg":["`f = x`, `g = x^2 + 1`","`f′ = 1`, `g′ = 2x`","At `x = 2`: `f = 2`, `g = 5`, `f′ = 1`, `g′ = 4`","`{f′g - fg′}/{g^2} = {1 · 5 - 2 · 4}/{5^2} = -{3}/{25} = -0.12`"]},{"id":"st3","title":"Station 3: Rewrite instead?","text":"Toggle between the quotient rule and rewriting for `{x^3 + 2}/{x}`.","ruleLines":["`f = x^3 + 2`, `g = x`, `f′ = 3x^2`, `g′ = 1`","`y′ = {3x^2 · x - (x^3 + 2)}/{x^2}`","`= {2x^3 - 2}/{x^2}`","`= 2x - {2}/{x^2}`"],"rewriteLines":["`{x^3 + 2}/{x} = x^2 + 2x^{-1}`","`y′ = 2x - 2x^{-2}`","`= 2x - {2}/{x^2}`"],"same":"Same answer, fewer steps.","thumb":"Single-term denominator? Divide first. Several terms below? Use the quotient rule."}],"quickCheck":{"title":"Quick check","summary":"Derive it quick check","items":[{"id":"q1","goal":5,"prompt":"In the derivation, why can we write `f = Q · g`?","choices":[{"t":"Because `g = 1`","fb":"`Q = f/g` means `Q · g = f` wherever `g ≠ 0`.","_n":"14a00","_k":"e405e211"},{"t":"Because `Q = f/g`, so multiply both sides by `g`","fb":"Right. `Q = f/g` means `Q · g = f` wherever `g ≠ 0`.","_n":"159f0","_k":"287c5325"},{"t":"Because `Q′ = f′/g′`","fb":"`Q = f/g` means `Q · g = f` wherever `g ≠ 0`.","_n":"169e0","_k":"2c4d13da"},{"t":"Because `f` and `g` are polynomials","fb":"`Q = f/g` means `Q · g = f` wherever `g ≠ 0`.","_n":"17a50","_k":"bf2f7c87"}]},{"id":"q2","goal":1,"prompt":"The quotient rule’s numerator is…","choices":[{"t":"`f′g - fg′`","fb":"Right. Low d-high first, then subtract high d-low.","_n":"18a40","_k":"08e40b5e"},{"t":"`f′g + fg′`","fb":"Low d-high first, then subtract high d-low.","_n":"19a30","_k":"b0004af3"},{"t":"`fg′ - f′g`","fb":"Low d-high first, then subtract high d-low.","_n":"1aa20","_k":"036b461a"},{"t":"`f 3 · 1 = -3`, over `(x - 2)^2`. Or rewrite: `3(x - 2)^{-1}`."},{"id":"l7","goal":[1,2],"t":"`{x + 1}/{x^2}`","why":"Rewrite as `x^{-1} + x^{-2}`: the derivative is `-x^{-2} - 2x^{-3} = {-x - 2}/{x^3}`.","hints":["Rewrite as `x^{-1} + x^{-2}`.","`-x^{-2} - 2x^{-3}`.","`{-x - 2}/{x^3}`."]},{"id":"l8","goal":1,"t":"`{x}/{x^2 + 4}`","why":"`(x^2 + 4) - x · 2x = 4 - x^2`, over `(x^2 + 4)^2`."}],"right":[{"id":"r1","t":"`{1}/{(x + 1)^2}`"},{"id":"r2","t":"`{2}/{(x + 1)^2}`"},{"id":"r3","t":"`{-2x}/{(x^2 + 1)^2}`"},{"id":"r4","t":"`{x^2 + 2x}/{(x + 1)^2}`"},{"id":"r5","t":"`{-5}/{(x - 1)^2}`"},{"id":"r6","t":"`{-3}/{(x - 2)^2}`"},{"id":"r7","t":"`-{x + 2}/{x^3}`"},{"id":"r8","t":"`{4 - x^2}/{(x^2 + 4)^2}`"},{"id":"r9","t":"`{x^2 - 4}/{(x^2 + 4)^2}`"}],"_a":"TEBZBEAKG0YGQBkXDgIbDhUQBxdOElUHFVgXR1ESFRZbVhcPQEINFhtAWQBAChtGAkAZFw4GGw4VEAMXThJVAxVYF0dVEhUWW1oXD0BCARZK","wrong":{"l1|r2":"Numerator `(x + 1) - x = 1`, not 2.","l6|r1":"A constant over a line: the slope’s sign comes from `-3 · 1`.","l6|r2":"A constant over a line: the slope’s sign comes from `-3 · 1`.","l8|r9":"That’s the reversed numerator."},"wrongDefault":"Write `f`, `g`, `f′`, `g′` first, then build `f′g - fg′`."},{"id":"slopes","type":"custom","title":"Slopes and tangents","summary":"Slopes and tangents","star":true,"goal":[3,4],"instruction":"Find slopes, tangents and flat spots of rational functions. Items 3 to 6 are non-routine.","how":"Type whole numbers or fractions, such as 7/4 or −1/2. A point takes two boxes; the order of the points doesn’t matter.","items":[{"id":"s1","goal":3,"kind":"boxes","prompt":"Slope of `y = {3x - 1}/{x + 2}` at `x = 0`.","boxes":[{"k":"m","label":"Slope"}],"_a":"TEBYF1gBFwMCHw==","display":"7/4","wrong":[{"m":-1.75,"fb":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope."},{"m":3,"fb":"Dividing the derivatives gives the wrong slope."},{"m":3.5,"fb":"The denominator is `g^2`, not `g`. Check: `(f/g)′` for `f = x`, `g = x^2` must equal `-1/x^2`."}],"why":"`f′ = 7/(x + 2)^2`, so `f′(0) = 7/4`."},{"id":"s2","goal":3,"kind":"boxes","prompt":"Tangent to `y = {x^2}/{x - 3}` at `x = 4`: enter slope and `y`-intercept.","boxes":[{"k":"m","label":"Slope"},{"k":"b","label":"`y`-intercept"}],"_a":"TEBYF1gdARgVABcPVghE","display":"`y = -8x + 48`","wrong":[{"m":8,"fb":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope."},{"b":16,"fb":"`f(4) = 16` is the `y`-value of the point, not the intercept."}],"why":"`f′ = (x^2 - 6x)/(x - 3)^2`, so `f′(4) = -8`; `y - 16 = -8(x - 4)` gives `y = -8x + 48`."},{"id":"s3","goal":4,"star":true,"kind":"points","prompt":"Both points on `y = {x^2 - 3}/{x - 2}` with a horizontal tangent.","_a":"bDkEGVBtFW8ETgNoPw==","display":"(1, 2) and (3, 6)","wrong":[{"x":2,"fb":"Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0."},{"pt":[1,-2],"fb":"`f(1) = (1 - 3)/(1 - 2) = 2`."}],"why":"`f′ = (x - 1)(x - 3)/(x - 2)^2`: the numerator is 0 at `x = 1` and `x = 3`."},{"id":"s4","goal":3,"star":true,"kind":"boxes","prompt":"Find `a` so that `y = {ax + 1}/{x + 2}` has slope 3 at `x = -1`.","boxes":[{"k":"a","label":"`a`"}],"_a":"TEBUF1gCRA==","display":"`a = 2`","wrong":[{"a":-1,"fb":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope. That makes `-(2a - 1) = 3`."}],"why":"`f′ = (2a - 1)/(x + 2)^2`; at `x = -1` that’s `2a - 1 = 3`, so `a = 2`."},{"id":"s5","goal":3,"star":true,"kind":"points","prompt":"Find both points on `y = {x + 1}/{x - 1}` where the tangent is perpendicular to `y = 2x + 5`.","_a":"bDkGGVBtFW8aUxkFP20=","display":"(3, 2) and (−1, 0)","wrong":[{"pts":[[0,-1],[2,3]],"fb":"Perpendicular slopes multiply to −1: you need −1/2."}],"one":"`(x - 1)^2 = 4` has two solutions.","why":"`f′ = -2/(x - 1)^2 = -1/2` gives `(x - 1)^2 = 4`, so `x = 3` or `x = -1`.","hints":["`f′ = -2/(x - 1)^2`.","Set it equal to `-1/2`.","`(x - 1)^2 = 4`: `x = 3` or −1."]},{"id":"s6","goal":4,"star":true,"kind":"chips","prompt":"For which values of `k` does `y = {x}/{x^2 + k}` have exactly two horizontal tangents?","options":[{"t":"`k = 0`","why":"Then `y = 1/x`, which has no flat spots.","_n":"1ka20","_k":"166c0534"},{"t":"`k \u003c 0`","why":"`k - x^2 = 0` needs `x^2 = k`, impossible when `k \u003c 0`.","_n":"1la30","_k":"03b0432a"},{"t":"`k > 0`","why":"The numerator of `f′` is `k - x^2`. Two solutions of `x^2 = k` need `k > 0`, and then `x^2 + k ≠ 0`.","_n":"1ma40","_k":"e09b7b53"},{"t":"every `k ≠ 0`","why":"`k - x^2 = 0` needs `x^2 = k`, impossible when `k \u003c 0`.","_n":"1n2d0","_k":"19e0b84e"}],"hints":["Find the numerator of `f′`.","`(x^2 + k) - 2x^2 = k - x^2`.","Two solutions of `x^2 = k` need `k > 0`, and then `x^2 + k ≠ 0`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Kofi","how":"","goal":[1,2,4],"instruction":"Kofi made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Differentiate `y = {x^2 + 1}/{x - 3}`.","steps":["`f = x^2 + 1`, `g = x - 3`, `f′ = 2x`, `g′ = 1`.","`y′ = {(x^2 + 1)(1) - 2x(x - 3)}/{(x - 3)^2}`","`= {x^2 + 1 - 2x^2 + 6x}/{(x - 3)^2}`","`= {-x^2 + 6x + 1}/{(x - 3)^2}`"],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 simplifies step 2 correctly. The mistake is earlier.","Step 4 follows. Look earlier."],"fixes":[{"t":"Step 2 is correct: the order doesn’t matter.","why":"Swapping flips the sign of every slope.","_n":"1o2c0","_k":"e835826c"},{"t":"`{2x(x - 3) + (x^2 + 1)}/{(x - 3)^2}`","why":"That’s the product rule’s plus sign.","_n":"1p2f0","_k":"c2cdfd22"},{"t":"`{2x(x - 3) - (x^2 + 1)(1)}/{(x - 3)^2} = {x^2 - 6x - 1}/{(x - 3)^2}`","why":"Low d-high first: `f′g = 2x(x - 3)`, then subtract `fg′ = (x^2 + 1)(1)`.","_n":"1q2e0","_k":"50f0cde7"},{"t":"`2x/1 = 2x`","why":"Dividing the derivatives gives the wrong slope.","_n":"1r310","_k":"af225008"}],"hints":["Which comes first in the numerator: `f′g` or `fg′`?","`f′g = 2x(x - 3)` first.","`{x^2 - 6x - 1}/{(x - 3)^2}`."]},{"id":"e2","goal":4,"task":"Find the horizontal tangents of `y = {x^2}/{x - 2}`.","steps":["`y′ = {2x(x - 2) - x^2(1)}/{(x - 2)^2}`","`= {x^2 - 4x}/{(x - 2)^2}`","Set `y′ = 0`: `x(x - 4) = 0` or `(x - 2)^2 = 0`.","So `x = 0`, 2 or 4."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. Look earlier."],"fixes":[{"t":"`x = -4` or 0.","why":"Sign slip.","_n":"1s300","_k":"894b5530"},{"t":"Step 3 is correct: every factor counts.","why":"At `x = 2` the function isn’t defined, so there’s no tangent.","_n":"1t330","_k":"7a3bac08"},{"t":"Only `x = 2`.","why":"At `x = 2` the function isn’t defined, so there’s no tangent.","_n":"1u320","_k":"e64f8258"},{"t":"Only the numerator can be 0: `x = 0` or 4, giving (0, 0) and (4, 8).","why":"A fraction is 0 only when its numerator is 0 and its denominator isn’t.","_n":"1v250","_k":"6befe3f4"}],"hints":["When is a fraction 0?","Numerator `x(x - 4)`.","(0, 0) and (4, 8)."]},{"id":"e3","goal":2,"task":"Differentiate `y = 6/x^3` with the quotient rule.","steps":["`f = 6`, `g = x^3`","`f′ = 0`, `g′ = 3x^2`","`y′ = {0 · x^3 - 6 · 3x^2}/{x^6}`","`= -18x^2/x^6 = -18x^3`"],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct: `(x^3)^2 = x^6`.",""],"fixes":[{"t":"Step 4 is correct.","why":"`x^2/x^6 = x^{2 - 6}`, not `x^3`.","_n":"1w240","_k":"bb7fe1c3"},{"t":"`-18x^2/x^6 = -18x^{-4} = -18/x^4`","why":"Dividing powers subtracts exponents: `2 - 6 = -4`.","_n":"1x270","_k":"60716c28"},{"t":"`= -18x^8`","why":"Dividing powers subtracts exponents.","_n":"1y280","_k":"cd5943c1"},{"t":"`y′ = 0`, because the numerator is constant.","why":"`6/x^3` changes as `x` changes. Rewrite as `6x^{-3}` and use the power rule.","_n":"1z250","_k":"e26d58c3"}],"hints":["`x^2/x^6 = x^{2 - 6}`.","`x^{-4}`.","Check by rewriting: `6x^{-3} -> -18x^{-4}`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the tangent hunter: the function with no flat spots, or how badly “divide the derivatives” did?"},{"id":"j2","q":"In your own words, why does the denominator of a quotient’s derivative get squared?"},{"id":"j3","q":"Explain to a friend how to find the horizontal tangents of a rational function, and why the denominator doesn’t help."},{"id":"j4","q":"Which part of the quotient rule do you still slip on? What will you do to remember it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is the derivative of `y = f(x)/g(x)`?","options":[{"t":"`{f′}/{g′}`","why":"Dividing the derivatives gives the wrong slope.","_n":"20260","_k":"71fbdff3"},{"t":"`{f′g - fg′}/{g}`","why":"The denominator is `g^2`, not `g`. Check: `(f/g)′` for `f = x`, `g = x^2` must equal `-1/x^2`.","_n":"21230","_k":"da63f80b"},{"t":"`{f′g - fg′}/{g^2}`","why":"Low d-high minus high d-low, over low squared.","_n":"22240","_k":"e87158e0"},{"t":"`{fg′ - f′g}/{g^2}`","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"23210","_k":"eadf8833"}]},"b":{"prompt":"Which is \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> [`u/v`], where `u` and `v` are functions of `x`?","options":[{"t":"`{uv′ - u′v}/{v^2}`","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"24220","_k":"10a0d313"},{"t":"`{u′v - uv′}/{v^2}`","why":"Low d-high minus high d-low, over low squared, with `u` on top and `v` below.","_n":"252f0","_k":"44f9ef05"},{"t":"`{u′}/{v′}`","why":"Dividing the derivatives gives the wrong slope.","_n":"26300","_k":"6398ec60"},{"t":"`{u′v + uv′}/{v^2}`","why":"That’s the product rule’s sign.","_n":"27a92","_k":"0bc9e6ec"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Differentiate `y = {2x - 1}/{x + 3}`.","options":[{"t":"`-{7}/{(x + 3)^2}`","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"28a82","_k":"0c6e715a"},{"t":"2","why":"Dividing the derivatives gives the wrong slope.","_n":"29a72","_k":"f8d4cb60"},{"t":"`{7}/{(x + 3)^2}`","why":"`2(x + 3) - (2x - 1) = 7`.","_n":"2aa62","_k":"c108556a"},{"t":"`{7}/{x + 3}`","why":"The denominator is `g^2`, not `g`. Check: `(f/g)′` for `f = x`, `g = x^2` must equal `-1/x^2`.","_n":"2ba52","_k":"537a17ad"}]},"b":{"prompt":"Differentiate `y = {3x + 2}/{x - 1}`.","options":[{"t":"`{5}/{(x - 1)^2}`","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"2ca42","_k":"2632cae9"},{"t":"`-{5}/{x - 1}`","why":"The denominator is `g^2`, not `g`. Check: `(f/g)′` for `f = x`, `g = x^2` must equal `-1/x^2`.","_n":"2da32","_k":"0caea0b1"},{"t":"3","why":"Dividing the derivatives gives the wrong slope.","_n":"2ea22","_k":"e2f9bfb5"},{"t":"`-{5}/{(x - 1)^2}`","why":"`3(x - 1) - (3x + 2) = -5`.","_n":"2fb12","_k":"aa0e0d57"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"For `y = {x^2 + 8}/{x - 1}`, where is the derivative undefined, and where is the tangent horizontal?","options":[{"t":"Undefined at `x = 1`; horizontal at `x = -2` and `x = 4`","why":"`f′ = {(x - 4)(x + 2)}/{(x - 1)^2}`.","_n":"2gb02","_k":"baf109b3"},{"t":"Undefined at `x = 1`; horizontal at `x = 1`","why":"Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0.","_n":"2ha32","_k":"df3d3afd"},{"t":"Undefined at `x = 1`; horizontal at `x = 2` and `x = -4`","why":"Sign slip: `x - 4 = 0` at 4.","_n":"2ia42","_k":"8cbfe437"},{"t":"Undefined at `x = -2` and 4; horizontal at `x = 1`","why":"Swapped: zeros of the numerator give the flat spots.","_n":"2ja52","_k":"4bdba0f5"}]},"b":{"prompt":"For `y = {x^2 + 5}/{x + 2}`, where is the derivative undefined, and where is the tangent horizontal?","options":[{"t":"Undefined at `x = -2`; horizontal at `x = 5` and `x = -1`","why":"Sign slip: `x + 5 = 0` at −5.","_n":"2ka62","_k":"70eb21a3"},{"t":"Undefined at `x = -2`; horizontal at `x = -2`","why":"Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0.","_n":"2l9f2","_k":"70dec190"},{"t":"Undefined at `x = -2`; horizontal at `x = -5` and `x = 1`","why":"`f′ = {(x + 5)(x - 1)}/{(x + 2)^2}`.","_n":"2ma02","_k":"fa7714fc"},{"t":"Undefined at `x = -5` and 1; horizontal at `x = -2`","why":"Swapped: zeros of the numerator give the flat spots.","_n":"2na12","_k":"e5b2598d"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Find the equation of the tangent to `y = {x + 2}/{x - 1}` at `x = 2`.","options":[{"t":"`y = -3x + 4`","why":"Uses `f(2)` as the `y`-intercept instead of point-slope form.","_n":"2oa22","_k":"be669c43"},{"t":"`y = -3x + 10`","why":"`f(2) = 4`; `f′ = -3/(x - 1)^2`, so `f′(2) = -3`; `y - 4 = -3(x - 2)`.","_n":"2pab2","_k":"7a462ab3"},{"t":"`y = 3x - 2`","why":"Slope +3 comes from the reversed numerator. Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"2qac2","_k":"6f917a84"},{"t":"`y = x + 2`","why":"`f′/g′ = 1` isn’t the slope. Dividing the derivatives gives the wrong slope.","_n":"2r848","_k":"bb51dda9"}]},"b":{"prompt":"Find the equation of the tangent to `y = {x + 3}/{x - 2}` at `x = 3`.","options":[{"t":"`y = x + 3`","why":"Dividing the derivatives gives the wrong slope.","_n":"2s858","_k":"8dee44e1"},{"t":"`y = -5x + 6`","why":"Point-slope form needed: `f(3) = 6` is the `y`-value of the point, not the intercept.","_n":"2t868","_k":"52c981ad"},{"t":"`y = 5x - 9`","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"2u878","_k":"87df5605"},{"t":"`y = -5x + 21`","why":"`f(3) = 6`; `f′(3) = -5`; `y - 6 = -5(x - 3)`.","_n":"2v808","_k":"c0b7a586"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"`y = {x^2 + a}/{x - 1}` has a horizontal tangent at `x = 3`. Find `a`.","options":[{"t":"−21","why":"That’s the product rule’s plus sign: `12 + 9 + a = 0`.","_n":"2w818","_k":"a3740851"},{"t":"−9","why":"That makes `f(3) = 0`, not the slope.","_n":"2x828","_k":"33f972e5"},{"t":"−3","why":"The minus must apply to the whole of `(x^2 + a)`. The minus applies to the whole product `f · g′`. Use brackets.","_n":"2y838","_k":"a8d4a92d"},{"t":"3","why":"Numerator of `f′`: `2x(x - 1) - (x^2 + a) = x^2 - 2x - a`; at 3: `3 - a = 0`.","_n":"2z8c8","_k":"bbd517e9"}]},"b":{"prompt":"`y = {x^2 + a}/{x - 1}` has a horizontal tangent at `x = 4`. Find `a`.","options":[{"t":"−40","why":"Product rule’s plus sign: `24 + 16 + a = 0`.","_n":"308d8","_k":"2adf5e40"},{"t":"−16","why":"That makes `f(4) = 0`.","_n":"318a8","_k":"d347e3bc"},{"t":"−8","why":"The minus applies to the whole product `f · g′`. Use brackets.","_n":"32898","_k":"9241bcaf"},{"t":"8","why":"`16 - 8 - a = 0`.","_n":"33888","_k":"44001224"}]}},{"id":"t3","cat":"T","goal":1,"a":{"prompt":"`f(2) = 3`, `f′(2) = -1`, `g(2) = 2`, `g′(2) = 4`. Find `(f/g)′(2)`.","options":[{"t":"−7","why":"The denominator is `g^2`, not `g`. Check: `(f/g)′` for `f = x`, `g = x^2` must equal `-1/x^2`.","_n":"34878","_k":"e46ef947"},{"t":"−7/2","why":"`(-1 · 2 - 3 · 4)/2^2 = -14/4`.","_n":"35868","_k":"10d2907c"},{"t":"−1/4","why":"Dividing the derivatives gives the wrong slope.","_n":"36858","_k":"a45d9ca7"},{"t":"7/2","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"37848","_k":"16451cef"}]},"b":{"prompt":"`f(1) = 4`, `f′(1) = 2`, `g(1) = -2`, `g′(1) = 3`. Find `(f/g)′(1)`.","options":[{"t":"−4","why":"`(2 · (-2) - 4 · 3)/(-2)^2 = -16/4`.","_n":"38838","_k":"387e3c4c"},{"t":"2/3","why":"Dividing the derivatives gives the wrong slope.","_n":"39928","_k":"72a6e868"},{"t":"4","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"3a918","_k":"2f433663"},{"t":"8","why":"`-16 ÷ (-2)`: the denominator must be squared.","_n":"3b908","_k":"a9624d81"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why the quotient rule has `g^2` in the denominator?","options":[{"t":"“Writing `f = Q · g` and solving the product rule for `Q′` gives `(f′ - Qg′)/g`. Replacing `Q` with `f/g` puts a second `g` underneath.”","why":"The derivation shows where the second `g` comes from.","_n":"3c918","_k":"3b80989a"},{"t":"“Because everything in a quotient gets squared when you differentiate.”","why":"Only the denominator is squared, and the derivation shows why.","_n":"3d8e8","_k":"3d168055"},{"t":"“Because the derivative of `g` is `2g`.”","why":"That’s not true for most `g`.","_n":"3e8f8","_k":"5438668f"},{"t":"“Because the numerator has two terms.”","why":"The number of terms doesn’t decide the denominator.","_n":"3f948","_k":"a2662589"}]},"b":{"prompt":"Which is the best explanation of why the order in the quotient rule’s numerator matters?","options":[{"t":"“Subtraction isn’t commutative: `fg′ - f′g` is the negative of `f′g - fg′`, so the reversed order gives every slope the wrong sign.”","why":"Swapping the order flips the sign of every slope.","_n":"3g958","_k":"c460018a"},{"t":"“Because `g^2` must stay positive.”","why":"`g^2` is positive in either order.","_n":"3h928","_k":"d681bd2d"},{"t":"“Because `f` must always be written before `g`.”","why":"Order matters because of the subtraction, not the letters.","_n":"3i938","_k":"87f7b059"},{"t":"“It doesn’t matter; both orders give the same derivative.”","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"3j888","_k":"cd037f26"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"For `y = {x}/{(x - 2)^2}`, `f′(x) = -{x + 2}/{(x - 2)^3}`. Which description is correct?","options":[{"t":"“Horizontal tangents at `x = -2` and `x = 2`.”","why":"Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0.","_n":"3k898","_k":"3597ec2e"},{"t":"“A horizontal tangent at `x = -2`; no tangent at `x = 2`, which isn’t in the domain.”","why":"The numerator is 0 at `x = -2`; at `x = 2` the function isn’t defined.","_n":"3l169","_k":"c433bae5"},{"t":"“A horizontal tangent at `x = 2` only.”","why":"Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0. Check the domain first: if `g(a) = 0`, there’s no point on the graph at `x = a`.","_n":"3m159","_k":"2fb9d3b0"},{"t":"“No horizontal tangents, because the denominator is cubed.”","why":"The power of the denominator doesn’t stop the numerator being 0.","_n":"3n189","_k":"481d5002"}]},"b":{"prompt":"For `y = {x^2}/{x + 3}`, `f′(x) = {x(x + 6)}/{(x + 3)^2}`. Which description is correct?","options":[{"t":"“Horizontal tangents at `x = 0`, −6 and −3.”","why":"Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0.","_n":"3o179","_k":"a88bbb14"},{"t":"“Horizontal tangents at `x = 0` and `x = -6`; no tangent at `x = -3`, which isn’t in the domain.”","why":"The numerator is 0 at `x = 0` and `x = -6`; at `x = -3` the function isn’t defined.","_n":"3p129","_k":"dd102f3d"},{"t":"“A horizontal tangent at `x = -3` only.”","why":"Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0. Check the domain first: if `g(a) = 0`, there’s no point on the graph at `x = a`.","_n":"3q119","_k":"f3d727e0"},{"t":"“Horizontal tangents at `x = 0` and `x = 6`.”","why":"Sign slip: `x + 6 = 0` at −6.","_n":"3r149","_k":"de036c3a"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A medicine’s concentration in the blood is `c(t) = {5t}/{t^2 + 4}` mg/L, `t` hours after a dose. How fast is it changing at `t = 1`?","options":[{"t":"3 mg/L per hour","why":"`15/5`: the denominator must be squared.","_n":"3s139","_k":"2b0e40ac"},{"t":"2.5 mg/L per hour","why":"`5/(2t)` at `t = 1`. Dividing the derivatives gives the wrong slope.","_n":"3t0e9","_k":"6f7f43aa"},{"t":"0.6 mg/L per hour","why":"`c′ = (20 - 5t^2)/(t^2 + 4)^2`, so `c′(1) = 15/25`.","_n":"3u0d9","_k":"0ec21a85"},{"t":"−0.6 mg/L per hour","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"3v0c8","_k":"cc2b1d29"}]},"b":{"prompt":"`c(t) = {6t}/{t^2 + 9}` mg/L. How fast is it changing at `t = 1`?","options":[{"t":"0.48 mg/L per hour","why":"`c′ = (54 - 6t^2)/(t^2 + 9)^2`, so `c′(1) = 48/100`.","_n":"3w0d8","_k":"a7234044"},{"t":"−0.48 mg/L per hour","why":"Subtraction isn’t commutative. Swapping the order flips the sign of every slope.","_n":"3x0e8","_k":"5f396dd1"},{"t":"4.8 mg/L per hour","why":"`48/10`: the denominator must be squared.","_n":"3y0f8","_k":"49ffff0b"},{"t":"3 mg/L per hour","why":"Dividing the derivatives gives the wrong slope.","_n":"3z108","_k":"db977e21"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"The average cost per item of making `x` items a day is `A(x) = {2x^2 + 800}/{x}` dollars. At what production level is the rate of change of the average cost zero, and what is the average cost then?","options":[{"t":"Never: the average cost always rises","why":"`f′/g′ = 4x` isn’t the rate. Dividing the derivatives gives the wrong slope.","_n":"40118","_k":"2cdc42a7"},{"t":"400 items; $802 each","why":"`x^2 = 400` gives `x = 20`, not 400.","_n":"41128","_k":"3ef839b9"},{"t":"20 items; $80 each","why":"`A′ = (2x^2 - 800)/x^2`, zero at `x = 20`; `A(20) = 1600/20`.","_n":"42138","_k":"e12ef1f0"},{"t":"0 items","why":"`x = 0` isn’t in the domain. Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only the numerator of `f′` can make the slope 0.","_n":"43048","_k":"2804b50e"}]},"b":{"prompt":"`A(x) = {3x^2 + 1200}/{x}` dollars. At what production level is the rate of change of the average cost zero, and what is the average cost then?","options":[{"t":"20 items; $120 each","why":"`A′ = (3x^2 - 1200)/x^2`; `A(20) = 2400/20`.","_n":"44058","_k":"5d4480c3"},{"t":"0 items","why":"`x = 0` isn’t in the domain. Where `g = 0` the function isn’t defined, so there’s no tangent at all. Only t
