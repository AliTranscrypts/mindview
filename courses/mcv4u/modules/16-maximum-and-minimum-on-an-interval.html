.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 16: hero tie table, closed-interval hunter (wall rail, hunt chips, candidate table, □√□ box), V10 shape stage and
   candidate cards (Part 3), V8 extrema boxes (Practice 1), task steppers */
.hero-fig canvas.mm-hplot{aspect-ratio:4/3}
.mm-htab{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin-top:8px;min-height:2.2em}
.mm-hc{font:400 1.05rem var(--font-math);border:1.5px solid var(--rule);border-radius:6px;padding:.15em .55em;background:var(--sheet);visibility:hidden;white-space:nowrap}
.mm-hc.on{visibility:visible}
.mm-hc.glow{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:600}
.mm-hc .m{font-size:1em}
.mm-ar{color:var(--ink-2)}
.hero-fig figcaption{font-size:1.1rem}

.mm-ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.mm-main,.mm-side{min-width:0}
.mm-eq{min-height:1.6em}
.mm-gw{position:relative}
.mm-rail{position:relative;height:48px;margin:0 0 2px;touch-action:none}
.mm-wh{position:absolute;top:2px;width:40px;height:40px;margin-left:-20px;border-radius:50%;border:2px solid var(--ink-2);background:var(--sheet);color:var(--ink);
  font:italic 600 1.25rem var(--font-math);display:flex;align-items:center;justify-content:center;padding:0;cursor:ew-resize;touch-action:none;z-index:2}
.mm-wh::after{content:"";position:absolute;left:50%;top:100%;width:0;height:8px;border-left:2px dashed var(--ink-2)}
.mm-wh.open{border-style:dashed}
.mm-wh:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.mm-wh:disabled{opacity:.6;cursor:default}
.mm-wh .m{font-size:1em}
.mm-legend{margin:8px 0 2px}
.mm-how{margin:6px 0 8px}
.mm-fns{margin-bottom:6px}
.mm-fns .chip{font-size:.86rem}
.mm-fns .chip .m{font-size:1.05em}
.mm-hunt{margin:8px 0 10px}
.mm-hunt[hidden]{display:none}
.mm-hchips{gap:6px;margin-bottom:6px}
.mm-hc2{padding:.2em .6em;min-height:30px}
.mm-hc2 .m{font-size:1em}
.mm-read{margin-top:8px}
.mm-tw{margin-top:4px}
table.mm-tbl th,table.mm-tbl td{padding:5px 10px}
table.mm-tbl td.mm-tag,table.mm-tbl td.mm-res{font:400 .85rem var(--font-ui);color:var(--ink-2)}
table.mm-tbl td.mm-res.hl{color:var(--ink);font-weight:700}
table.mm-tbl tr.mm-excl td{color:var(--ink-2)}
.mm-tc3{margin:12px 0 6px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:8px}
.mm-tc3h{font-weight:700;margin:0 0 6px}
.mm-sq{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:1.15rem}
.mm-sq .numin.short{width:4.6rem}
.mm-rad{font:400 1.6rem var(--font-math);margin-right:-4px}
.mm-rin{border-top-width:2.5px;border-top-color:var(--ink)}

/* Part 3: V10 shape stage, cards and picks */
.mm-st h3{margin-top:0}
.mm-st:first-child{margin-top:0;padding-top:0;border-top:0}
.mm-stage{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px 20px;align-items:center}
.mm-sfig,.mm-sgr{min-width:0}
.mm-svg{display:block;width:100%;max-width:260px;height:auto;margin:0 auto;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px}
.mm-ssl{margin-top:8px}
.mm-ssl output{font-size:1.1rem}
.mm-ssl output .m{font-size:1em}
.mm-sread{min-height:1.4em;margin:2px 0 6px;font-weight:600}
.mm-dh{margin:10px 0 6px}
.mm-deck{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.mm-card{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:112px;min-height:86px;padding:8px 10px;border:2px solid var(--ink-2);border-radius:10px;
  background:var(--sheet);color:var(--ink);font-size:1rem;cursor:pointer}
.mm-card .m{font-size:1.05em}
.mm-card.on{border-color:var(--ink);background:var(--hi-soft)}
.mm-card.out{border-style:dashed;opacity:.7;cursor:default}
.mm-cw{display:block;font:400 .82rem var(--font-ui);color:var(--ink-2)}
.mm-cb{display:block;margin-top:2px;font-weight:700}
.mm-card.on .mm-cb{font-weight:400}
.mm-picks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 20px}
.mm-pick{min-width:0}
.mm-pq{font-weight:700;margin:4px 0 6px}
.mm-pch{margin-bottom:6px}
.mm-pfb .fb{margin-top:4px}
.mm-g-ground{stroke:var(--ink-2);stroke-width:2}
.mm-g-house{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.mm-g-pane{fill:none;stroke:var(--ink-2);stroke-width:1;opacity:.6}
.mm-g-plant{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round}
.mm-g-leaf{fill:var(--green)}
.mm-g-tube{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.mm-g-fluid,.mm-g-bulb{fill:var(--pen)}
.mm-g-tick{stroke:var(--ink-2);stroke-width:1.5}
.mm-g-tl{fill:var(--ink-2);font:600 11px var(--font-ui)}
.mm-g-clock{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.mm-g-hand{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.mm-g-hand.thin{stroke-width:1.8}
.mm-d-vial{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5;stroke-linejoin:round}
.mm-d-rim{stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}
.mm-d-fluid{fill:var(--pen);opacity:.85}
.mm-d-now{fill:var(--ink)}

/* Practice 1: extrema boxes */
.mm-ct{display:grid;gap:8px;margin:6px 0 4px}
.mm-ctr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.mm-ctl{font-weight:700;min-width:10.5em}
.mm-cbx{display:inline-flex;align-items:center;gap:6px}
.mm-cbx > span{font-size:.92rem}
.mm-cbx .m{font-size:1.08em}
.mm-ct .numin.short{width:5.6rem}
.mm-ct .numin.mm-list{width:7.5rem}

/* task */
.mm-step{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:8px 0}
.mm-step label{min-width:11.5em}
.mm-step .numin.short{width:5rem}
.mm-all{margin-top:6px}

@media (max-width:760px){
  .mm-ex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .mm-stage{grid-template-columns:minmax(0,1fr)}
  .mm-svg{max-width:220px}
  .mm-picks{grid-template-columns:minmax(0,1fr)}
  .mm-card{min-width:96px}
  .mm-ctl{min-width:0;flex:1 1 100%}
}

</style>

erval meaningful. Scrub the timeline, flip the candidate cards, and pick the extremes. Then try the quick check.","stageHow":"Drag the timeline slider (arrows move it 15 minutes). The shaded strip on the graph is the window.","cardHow":"Tap a card to flip it and see the value there.","stations":[{"id":"s1","title":"Station 1: Greenhouse","kind":"green","lo":1,"hi":7,"text":"`T(t) = -t^3 + 12t^2 - 36t + 40` is the temperature (°C) in a greenhouse `t` hours after 6:00, for `1 ≤ t ≤ 7`.","cards":[{"t":1},{"t":2},{"t":6},{"t":7}],"picks":[{"id":"cool","q":"The coolest moment","opts":[{"t":"7:00","_n":"14eb1","_k":"1b873665"},{"t":"8:00","_n":"15ec1","_k":"dad1d4ee"},{"t":"12:00","_n":"16ed1","_k":"233971f5"},{"t":"13:00","_n":"17e61","_k":"fd47ff8a"}],"good":"Right. `T(2) = 8`: 8 °C at 8:00.","bad":"Compare all four cards: the coolest moment has the smallest `T`."},{"id":"warm","q":"The warmest moment","opts":[{"t":"7:00","_n":"18e71","_k":"e046a3c0"},{"t":"8:00","_n":"19e81","_k":"0b7ac06e"},{"t":"12:00","_n":"1ae91","_k":"a2fe42e0"},{"t":"13:00","_n":"1be21","_k":"1bb004d3"}],"good":"Right. `T(6) = 40`: 40 °C at 12:00.","bad":"Compare all four cards: the warmest moment has the largest `T`."}],"alg":["`T′(t) = -3t^2 + 24t - 36 = -3(t - 2)(t - 6)`","`T′ = 0` at `t = 2` and `t = 6`, both inside `1 ≤ t ≤ 7`.","Candidates 1, 2, 6, 7: `T(1) = 15`, `T(2) = 8`, `T(6) = 40`, `T(7) = 33`."]},{"id":"s2","title":"Station 2: A dose","kind":"dose","lo":0,"hi":6,"text":"`C(t) = {10t}/{t^2 + 4}` mg/L, `0 ≤ t ≤ 6` h.","cards":[{"t":-2,"out":true},{"t":0},{"t":2},{"t":6}],"picks":[{"id":"high","q":"The highest concentration","opts":[{"t":"at 0 h","_n":"1ce31","_k":"f486b757"},{"t":"at 2 h","_n":"1df01","_k":"6c085d39"},{"t":"at 6 h","_n":"1eef1","_k":"d78faa60"}],"good":"Right. Highest: 2.5 mg/L at 2 h.","bad":"Compare the cards: `C(2) = {5}/{2}` is the largest."},{"id":"low","q":"The lowest concentration","opts":[{"t":"at 0 h","_n":"1fee1","_k":"025fd50b"},{"t":"at 2 h","_n":"1ged1"," struction":"Find the absolute maximum and minimum values and every place they occur. Items 4 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type each value, and every `x` where it occurs (separate two locations with a comma, such as 1, 4). Then press Check.","msgs":{"err":"Type numbers only, such as −15 or 1, 4.","fill":"Fill in every box first.","maxOk":"Your maximum is right; check the minimum.","minOk":"Your minimum is right; check the maximum.","valOk":"The values are right; check where each one occurs. A value can occur at more than one `x`.","general":"Compare `f` at every candidate: the endpoints and the critical numbers inside the interval."},"items":[{"id":"s1","goal":[1,2],"prompt":"`f(x) = x^3 - 3x` on `[0, 2]`","kind":"mm","_a":"GBoOV0FnEw5RFEFbWElpFlljUWsVE1xdDW5BDBQDHRYOUQ1uGwtqBT5F","display":"max 2 at `x = 2`; min −2 at `x = 1`","wrong":[{"k":"maxX","has":-1,"fb":"`x = -1` is outside `[0, 2]`."}],"why":"`f′ = 3x^2 - 3 = 0` at `x = ±1`; only 1 is inside. `f(0) = 0`, `f(1) = -2`, `f(2) = 2`."},{"id":"s2","goal":2,"prompt":"`f(x) = x^3 - 6x^2 + 9x + 1` on `[-1, 4]`","kind":"mm","_a":"GBoOV0FnEw5WFEFbWElpFlljUhoNbB0WDlENYBsLHAVWFEFbUF9pFlljTgdkTA==","display":"max 5 at `x = 1` and `x = 4`; min −15 at `x = -1`","wrong":[{"k":"minV","eq":1,"fb":"`f(-1) = -15` is lower."},{"k":"minX","has":3,"fb":"`f(-1) = -15` is lower."}],"why":"`f′ = 3(x - 1)(x - 3)`. `f(-1) = -15`, `f(1) = 5`, `f(3) = 1`, `f(4) = 5`: the maximum 5 occurs twice."},{"id":"s3","goal":[1,2],"prompt":"`f(x) = x^4 - 2x^2` on `[-2, 1]`","kind":"mm","_a":"GBoOV0FnEw5bFEFbWElpFlljTgRkHRNZClY1FAMcABhBVQpYYRMLb04JTwdkTA==","display":"max 8 at `x = -2`; min −1 at `x = -1` and `x = 1`","wrong":[{"k":"maxV","eq":0,"fb":"`f(-2) = 16 - 8 = 8`."}],"why":"`f′ = 4x(x - 1)(x + 1)`. `f(-2) = 8`, `f(-1) = -1`, `f(0) = 0`, `f(1) = -1`."},{"id":"s4","goal":[1,2],"star":true,"prompt":"`f(x) = x + {4}/{x}` on `[1, 4]`","kind":"mm","_a":"GBoOV0FnEw5WFEFbWElpFlljUhoNbB0WDlENYBsLBRhBVQpYYRMLb1FlHg ate for an absolute extreme?","how":"Tap an `x`-value, then tap its box.","boxes":[{"id":"yes","label":"Candidate"},{"id":"no","label":"Not a candidate"}],"items":[{"id":"i1","goal":1,"t":"A: `x = -1`","_a":"QUEGRRs=","why":"It’s the left endpoint.","wrong":{"no":"It’s the left endpoint. On a closed interval the endpoints are always candidates."}},{"id":"i2","goal":1,"t":"A: `x = 2`","_a":"QUEGRRs=","why":"`f′(2) = 0` and 2 is inside.","wrong":{"no":"`f′(2) = 0` and 2 is inside."}},{"id":"i3","goal":1,"t":"A: `x = 5`","_a":"QUEGRRs=","why":"Right endpoint.","wrong":{"no":"Right endpoint. On a closed interval the endpoints are always candidates."}},{"id":"i4","goal":1,"t":"A: `x = -2`","_a":"QVYMFA==","why":"`f′(-2) = 0`, but −2 is outside `[-1, 5]`.","wrong":{"yes":"`f′(-2) = 0`, but −2 is outside `[-1, 5]`."}},{"id":"i5","goal":1,"t":"A: `x = 0`","_a":"QVYMFA==","why":"`f(0) = 0` is a zero of `f`, not of `f′`.","wrong":{"yes":"`f(0) = 0` is a zero of `f`, not of `f′`."}},{"id":"i6","goal":1,"t":"A: `x = 4`","_a":"QVYMFA==","why":"`f(4) = 16` is just a value; `f′(4) = 36 ≠ 0`.","wrong":{"yes":"`f(4) = 16` is just a value; `f′(4) = 36 ≠ 0`."}},{"id":"i7","goal":1,"t":"B: `x = 0`","_a":"QUEGRRs=","why":"Left endpoint.","wrong":{"no":"Left endpoint."}},{"id":"i8","goal":4,"t":"B: `x = 2`","_a":"QUEGRRs=","why":"`g′` is undefined at 2, and 2 is in the domain.","wrong":{"no":"`g′` is undefined at 2, and 2 is in the domain."},"hints":["Find `g′(x)`.","`g′(x) = {2}/{3∛{x - 2}}`.","Undefined at `x = 2`, so it’s critical."]},{"id":"i9","goal":1,"t":"B: `x = 10`","_a":"QUEGRRs=","why":"Right endpoint.","wrong":{"no":"Right endpoint."}},{"id":"i10","goal":1,"t":"B: `x = 3`","_a":"QVYMFA==","why":"`g′(3) = {2}/{3} ≠ 0`, and 3 isn’t an endpoint.","wrong":{"yes":"`g′(3) = {2}/{3} ≠ 0`, and 3 isn’t an endpoint."}}],"wrongDefault":"Candidates are the endpoints and the critical numbers inside the interval."},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Parisa","how":"","goal":[1,2,4],"instruction":"Parisa made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Find the absolute extrema of `f(x) = x^3 - 12x` on `[0, 3]`.","steps":["`f′(x) = 3x^2 - 12`.","`3x^2 - 12 = 0` gives `x = ±2`.","Evaluate at the critical numbers: `f(2) = -16`, `f(-2) = 16`.","Absolute max 16, absolute min −16."],"_a":"UQ==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 solves `f′ = 0` correctly.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Keep `x = -2` and add the endpoints.","why":"−2 is outside the interval.","_n":"24591","_k":"983ef58b"},{"t":"Use only the endpoints: max 0, min −9.","why":"`x = 2` is a candidate too.","_n":"25641","_k":"9d78bf9e"},{"t":"Only `x = 2` is in `[0, 3]`; add the endpoints: `f(0) = 0`, `f(2) = -16`, `f(3) = -9`. Max 0 at `x = 0`, min −16 at `x = 2`.","why":"The candidates are 0, 2 and 3.","_n":"26631","_k":"19d6d271"},{"t":"Step 3 is correct.","why":"`f(-2)` isn’t a value of `f` on `[0, 3]`, and the endpoints are missing.","_n":"27621","_k":"4c906e22"}],"hints":["Is −2 in `[0, 3]`?","No. What else must you test?","Candidates 0, 2, 3."]},{"id":"e2","goal":2,"task":"Find the absolute extrema of `f(x) = 2x^3 - 3x^2 - 12x + 1` on `[-2, 4]`.","steps":["`f′(x) = 6x^2 - 6x - 12 = 6(x - 2)(x + 1)`.","Critical numbers `x = -1` and `x = 2`, both inside.","`f(-1) = 8` and `f(2) = -19`.","So the absolute maximum is 8 and the absolute minimum is −19."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Both values are right.",""],"fixes":[{"t":"Max 8 at `x = -1` because `f″(-1) \u003c 0`.","why":"That shows a local max only.","_n":"28631","_k":"ce2811cc"},{"t":"Max 33, min −3.","why":"`f(2) = -19` is lower than −3.","_n":"29641","_k":"b1ae090a"},{"t":"Step 4 is correct.","why":"`f(4) = 128 - 48 - 48 + 1 = 33 > 8`.","_n":"2a651","_k":"c5bf158f"},{"t":"Also test the endpoints: `f(-2) = -3`, `f(4) = 33`. Max 33 at `x = 4`; min −19 at `x = 2`.","why":"The endpoints are candidates too, and `f(4) = 33` wins.","_n":"2b661","_k":"c4450570"}],"hints":["Which candidates are missing?","The endpoints −2 and 4.","`f(4) = 33` wins."]},{"id":"e3","goal":4,"task":"Find the absolute extrema of `f(x) = 3x^{2/3} - x` on `[-8, 8]`.","steps":["`f′(x) = 2x^{-1/3} - 1 = {2}/{∛x} - 1`.","`f′(x) = 0` when `∛x = 2`, so `x = 8`. That’s the only critical number.","Candidates −8 and 8: `f(-8) = 20`, `f(8) = 4`.","Max 20, min 4."],"_a":"Ug==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier.","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Also `x = -8` is critical.","why":"It’s an endpoint, already a candidate.","_n":"2c671","_k":"29ee522f"},{"t":"Step 2 is correct.","why":"`{2}/{∛x}` has no value at `x = 0`.","_n":"2d681","_k":"47da3983"},{"t":"`∛x = 2` gives `x = 6`.","why":"`2^3 = 8`.","_n":"2e691","_k":"f3f378c7"},{"t":"`f′` is undefined at `x = 0`, which is in the domain, so 0 is also critical: `f(0) = 0`. Max 20 at `x = -8`, min 0 at `x = 0`.","why":"A cusp is a candidate too.","_n":"2f5a1","_k":"800ff566"}],"hints":["Can `{2}/{∛x}` be evaluated at every `x`?","Not at 0.","`f(0) = 0` is the minimum."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the hunter: a tie, an endpoint beating a turning point, or the open interval with no maximum?"},{"id":"j2","q":"In your own words, why are the endpoints always candidates on a closed interval?"},{"id":"j3","q":"Explain to a friend the steps for finding the absolute extrema of a function on `[a, b]`."},{"id":"j4","q":"Which part still trips you up (outside critical numbers, cusps, or reporting value vs location)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which `x`-values must be tested to find the absolute extrema of `f(x) = x^3 - 3x^2` on `[1, 4]`?","options":[{"t":"0 and 2","why":"The endpoints are missing and 0 is outside.","_n":"2g5b1","_k":"1fe9ef1b"},{"t":"1, 2 and 4","why":"Endpoints 1 and 4; `f′ = 3x(x - 2) = 0` at 2 (inside) and 0 (outside).","_n":"2h681","_k":"471c6984"},{"t":"0, 1, 2 and 4","why":"0 isn’t in `[1, 4]`.","_n":"2i671","_k":"15953861"},{"t":"1 and 4","why":"`x = 2` is a critical number inside.","_n":"2j661","_k":"523667db"}]},"b":{"prompt":"Which `x`-values must be tested for `f(x) = x^3 - 12x` on `[-1, 3]`?","options":[{"t":"−1, 2 and 3","why":"`f′ = 0` at ±2; only 2 is inside.","_n":"2k651","_k":"8c0ab14e"},{"t":"−1 and 3","why":"`x = 2` is inside.","_n":"2l6c1","_k":"38544630"},{"t":"−2, −1, 2 and 3","why":"−2 isn’t in `[-1, 3]`.","_n":"2m6b1","_k":"cc0cd7d4"},{"t":"−2 and 2","why":"The endpoints are missing and −2 is outside.","_n":"2n6a1","_k":"2929dd50"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is the absolute maximum value of `f(x) = x^3 - 3x^2` on `[1, 4]`?","options":[{"t":"−2","why":"That’s `f(1)`; `f(4)` is larger.","_n":"2o691","_k":"1b633f89"},{"t":"0","why":"`f(0) = 0`, but 0 is outside `[1, 4]`.","_n":"2p601","_k":"ccc03247"},{"t":"4","why":"4 is where; the value is `f(4) = 16`.","_n":"2q5f1","_k":"f3799701"},{"t":"16","why":"`f(1) = -2`, `f(2) = -4`, `f(4) = 64 - 48 = 16`.","_n":"2rb2a","_k":"77c8ba30"}]},"b":{"prompt":"What is the absolute maximum value of `f(x) = x^3 - 12x` on `[-1, 3]`?","options":[{"t":"−9","why":"That’s `f(3)`; `f(-1) = 11` is larger.","_n":"2sb1a","_k":"1f4f2721"},{"t":"−1","why":"`x = -1` is where it happens. The maximum value is `f(-1) = 11`.","_n":"2tb4a","_k":"557d5753"},{"t":"11","why":"`f(-1) = 11`, `f(2) = -16`, `f(3) = -9`.","_n":"2ub3a","_k":"38e91fea"},{"t":"16","why":"`f(-2) = 16`, but −2 is outside.","_n":"2vb6a","_k":"85f919db"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"`g(x) = x^2 - 2x` on the \u003cstrong>open\u003c/strong> interval `(0, 3)`. Which is true?","options":[{"t":"No absolute minimum or maximum.","why":"`g(1) = -1` is reached, and no value is lower.","_n":"2wb5a","_k":"b45ddec1"},{"t":"Absolute minimum −1 at `x = 1`; no absolute maximum.","why":"Values approach `g(3) = 3` but never reach it.","_n":"2xb8a","_k":"e9d22e58"},{"t":"Absolute minimum −1; absolute maximum 3 at `x = 3`.","why":"3 isn’t in `(0, 3)`.","_n":"2yb7a","_k":"f822dcf5"},{"t":"Absolute minimum −1; absolute maximum 0 at `x = 0`.","why":"0 isn’t included either, and 3 would be bigger anyway.","_n":"2zaaa","_k":"da31f9f9"}]},"b":{"prompt":"`h(x) = 4x - x^2` on the \u003cstrong>open\u003c/strong> interval `(1, 5)`. Which is true?","options":[{"t":"Absolute maximum 4; absolute minimum −5 at `x = 5`.","why":"5 isn’t in `(1, 5)`: the values only approach `h(5) = -5`.","_n":"30a9a","_k":"3a12cef4"},{"t":"No absolute maximum or minimum.","why":"`h(2) = 4` is reached.","_n":"31aca","_k":"7beed2f3"},{"t":"Absolute maximum 4 at `x = 2`; no absolute minimum.","why":"Values approach `h(5) = -5` but never reach it.","_n":"32ada","_k":"8dcfe9cc"},{"t":"Absolute maximum 4; absolute minimum 3 at `x = 1`.","why":"1 isn’t included either, and the values near 5 are lower anyway.","_n":"33aaa","_k":"b450579f"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"`f(x) = x^3 - 3x^2 - 9x + 5` has a local maximum at `x = -1`. On which interval is the absolute maximum at an endpoint \u003cstrong>and not\u003c/strong> at `x = -1`?","options":[{"t":"`[0, 6]`","why":"`x = -1` is outside; `f(0) = 5`, `f(3) = -22`, `f(6) = 59`.","_n":"34aba","_k":"50af9340"},{"t":"`[-4, 5]`","why":"`f(5) = 10` ties with `f(-1) = 10`, so the max is at both.","_n":"35a8a","_k":"d7e044ec"},{"t":"`[-2, 4]`","why":"`f(-1) = 10` beats `f(-2) = 3` and `f(4) = -15`.","_n":"36a9a","_k":"a977310a"},{"t":"`[-3, 0]`","why":"`f(-1) = 10` beats `f(0) = 5`.","_n":"37a6a","_k":"66420c44"}]},"b":{"prompt":"`f(x) = x^3 - 12x` has a local maximum at `x = -2`. On which interval is the absolute maximum at an endpoint \u003cstrong>and not\u003c/strong> at `x = -2`?","options":[{"t":"`[-4, 4]`","why":"`f(4) = 16` ties with `f(-2)`.","_n":"38a7a","_k":"021c2326"},{"t":"`[-3, 3]`","why":"`f(-2) = 16` is largest.","_n":"39b4a","_k":"8c001b7d"},{"t":"`[-4, 0]`","why":"`f(-2) = 16` is largest.","_n":"3ab5a","_k":"bb0798e8"},{"t":"`[-3, 5]`","why":"`f(5) = 65` beats `f(-2) = 16`.","_n":"3ba6a","_k":"c1d3fa46"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`f(x) = x^3 - 6x^2 + k` on `[-1, 5]` has absolute minimum −20. Find `k`.","options":[{"t":"`k = -20`","why":"That sets `f(0) = -20`; `f(0)` is the largest candidate, not the smallest.","_n":"3ca5a","_k":"347fd1fb"},{"t":"`k = -13`","why":"That sets `f(-1) = -20`, but `f(4) = k - 32` is lower.","_n":"3da4a","_k":"decfe571"},{"t":"`k = 12`","why":"Candidates −1, 0, 4, 5 give `k - 7`, `k`, `k - 32`, `k - 25`. The min is `k - 32 = -20`.","_n":"3ea3a","_k":"b6e7d7e4"},{"t":"`k = 5`","why":"That sets `f(5) = -20`, but `f(4)` is lower.","_n":"3faaa","_k":"4ddb91a2"}]},"b":{"prompt":"`f(x) = x^3 - 3x^2 + k` on `[-2, 3]` has absolute minimum −15. Find `k`.","options":[{"t":"`k = -11`","why":"That uses the local min `f(2) = k - 4`; the endpoint `f(-2)` is lower.","_n":"3ga9a","_k":"c6b813db"},{"t":"`k = 35`","why":"Sign slip: `k - 20 = -15` gives `k = 5`.","_n":"3ha8a","_k":"03cd5919"},{"t":"`k = -15`","why":"That sets `f(0) = -15`.","_n":"3ia7a","_k":"9504436f"},{"t":"`k = 5`","why":"Candidates −2, 0, 2, 3 give `k - 20`, `k`, `k - 4`, `k`. The min is `k - 20 = -15`.","_n":"3jaea","_k":"b44633cd"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"What is the absolute maximum value of `f(x) = 2 - (x - 3)^{2/3}` on `[2, 11]`?","options":[{"t":"There is none, because `f′` is never 0.","why":"A continuous function on a closed interval always has a maximum; here it’s at the cusp.","_n":"3kada","_k":"efe02676"},{"t":"−2","why":"That’s the minimum, `f(11)`.","_n":"3l20a","_k":"026513dc"},{"t":"1","why":"Testing only the endpoints misses `x = 3`.","_n":"3m21a","_k":"202dbc78"},{"t":"2","why":"`f′(x) = -{2}/{3}(x - 3)^{-1/3}` is undefined at `x = 3`: `f(3) = 2`. Endpoints: `f(2) = 1`, `f(11) = 2 - 4 = -2`.","_n":"3n22a","_k":"384bb96f"}]},"b":{"prompt":"What is the absolute maximum value of `f(x) = 5 - (x + 1)^{2/3}` on `[-2, 7]`?","options":[{"t":"1","why":"That’s the minimum.","_n":"3o23a","_k":"597563f0"},{"t":"5","why":"`f′` is undefined at `x = -1`: `f(-1) = 5`. `f(-2) = 4`, `f(7) = 1`.","_n":"3p24a","_k":"0ab93d27"},{"t":"There is none, because `f′` is never 0.","why":"A continuous function on a closed interval always has a maximum; here it’s at the cusp.","_n":"3q25a","_k":"052de048"},{"t":"4","why":"Testing only the endpoints misses `x = -1`, where `f′` is undefined.","_n":"3r26a","_k":"9243c114"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"`f(x) = x^3 - 12x` on `[-3, 5]`. Which is the best explanation of why the absolute maximum isn’t at `x = -2`, even though `f′(-2) = 0`?","options":[{"t":"“Critical numbers are never absolute extrema.”","why":"They often are; they just have to be compared.","_n":"3s27a","_k":"6431c2e0"},{"t":"“`x = -2` is a local minimum, not a maximum.”","why":"`f` rises to −2 and falls after it: it’s a local maximum.","_n":"3t28a","_k":"e5fad60c"},{"t":"“`f′(-2) = 0` only makes −2 a candidate. Comparing all candidates, `f(5) = 65` is larger than `f(-2) = 16`, so the maximum is at the endpoint `x = 5`.”","why":"Candidates are compared by their values.","_n":"3u29a","_k":"dae2943b"},{"t":"“`x = -2` is outside the interval.”","why":"−3 \u003c −2 \u003c 5: it’s inside.","_n":"3v2ab","_k":"02f4ec9a"}]},"b":{"prompt":"`f(x) = x^3 - 3x^2 - 9x + 5` on `[-4, 4]`. Which is the best explanation of why the absolute minimum is at `x = -4`, not at `x = 3`, where `f′(3) = 0`?","options":[{"t":"“`x = 3` is only a candidate. Comparing `f(-4) = -71`, `f(-1) = 10`, `f(3) = -22` and `f(4) = -15`, the smallest is −71 at the endpoint.”","why":"Candidates are compared by their values.","_n":"3w29b","_k":"eb254d60"},{"t":"“`x = 3` is a local maximum.”","why":"`f` falls into 3 and rises after: a local minimum.","_n":"3x2cb","_k":"41775b4e"},{"t":"“`f′(-4) = 0`.”","why":"`f′(-4) = 48 - (-24) - 9 ≠ 0`; endpoints don’t need `f′ = 0`.","_n":"3y2bb","_k":"77d9f56a"},{"t":"“Endpoints always give the minimum.”","why":"Not always; here it does after comparing.","_n":"3z26b","_k":"072ffebd"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"On `[0, 4]`, a student finds the candidate values `f(0) = 2`, `f(1) = 6`, `f(3) = -1`, `f(4) = 5`. Which report is correct?","options":[{"t":"“The absolute maximum value is 6, at `x = 1`; the absolute minimum value is −1, at `x = 3`.”","why":"The value is the `y`; the location is the `x`.","_n":"4025b","_k":"308d8eb2"},{"t":"“The absolute maximum is 5, at the endpoint `x = 4`.”","why":"Endpoints only win when they’re largest; 6 > 5.","_n":"4128b","_k":"6453a0fd"},{"t":"“The absolute maximum is 1 and the absolute minimum is 3.”","why":"1 and 3 are where they happen. The values are `f(1) = 6` and `f(3) = -1`.","_n":"4227b","_k":"ba3268fd"},{"t":"“The absolute maximum is at (6, 1) and the minimum at (−1, 3).”","why":"Coordinates are `(x, y)`: (1, 6) and (3, −1).","_n":"4332b","_k":"0b9fe23e"}]},"b":{"prompt":"On `[-1, 5]`, the candidate values are `f(-1) = 4`, `f(2) = 9`, `f(3) = -2`, `f(5) = 7`. Which report is correct?","options":[{"t":"“The absolute maximum is 2 and the absolute minimum is 3.”","why":"2 and 3 are where they happen. The values are `f(2) = 9` and `f(3) = -2`.","_n":"4431b","_k":"a0de888e"},{"t":"“Maximum at (9, 2), minimum at (−2, 3).”","why":"Coordinates are (2, 9) and (3, −2).","_n":"4524b","_k":"6811d425"},{"t":"“The absolute maximum value is 9, at `x = 2`; the absolute minimum value is −2, at `x = 3`.”","why":"The value is the `y`; the location is the `x`.","_n":"4625b","_k":"198f4e50"},{"t":"“The absolute maximum is 7, at `x = 5`.”","why":"9 > 7.","_n":"4722b","_k":"d3f45b81"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"The concentration of a medicine in the blood is `C(t) = {12t}/{t^2 + 9}` mg/L, `t` hours after a dose, for `0 ≤ t ≤ 6`. What is the greatest concentration?","options":[{"t":"4 mg/L","why":"36/9 leaves out the `t^2` in the denominator: `t^2 + 9 = 18` at `t = 3`.","_n":"4823b","_k":"50f62b4b"},{"t":"2 mg/L","why":"`C′(t) = {12(9 - t^2)}/{(t^2 + 9)^2} = 0` at `t = 3`; `C(3) = 36/18 = 2`. `C(0) = 0`, `C(6) = 72/45 = 1.6`.","_n":"4928b","_k":"b76697d2"},{"t":"3 mg/L","why":"3 is the time, in hours.","_n":"4a29b","_k":"4bc1adf8"},{"t":"1.6 mg/L","why":"That’s the endpoint value; `C(3)` is larger.","_n":"4b26b","_k":"f5445778"}]},"b":{"prompt":"`C(t) = {20t}/{t^2 + 16}` mg/L for `0 ≤ t ≤ 8`. What is the greatest concentration?","options":[{"t":"4 mg/L","why":"4 is the time, in hours. The value is `C(4) = 2.5`.","_n":"4c27b","_k":"b5186dfc"},{"t":"5 mg/L","why":"80/16 leaves out the `t^2` in the denominator.","_n":"4d2cb","_k":"14f1aa6f"},{"t":"2 mg/L","why":"That’s `C(8)`.","_n":"4e2db","_k":"aa77a8a5"},{"t":"2.5 mg/L","why":"`C′ = 0` at `t = 4`; `C(4) = 80/32 = 2.5`. `C(8) = 160/80 = 2`.","_n":"4f3ea","_k":"bf2c59ea"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"The volume of water in a tank is `V(t) = t^3 - 9t^2 + 24t + 100` litres for `0 ≤ t ≤ 5` minutes. What is the least volume, and when does it occur?","options":[{"t":"There is no least volume, because `V′(0) ≠ 0`.","why":"Endpoints don’t need `V′ = 0`.","_n":"4g3da","_k":"8e06ec2d"},{"t":"120 L at `t = 2` and 5 min","why":"That’s the maximum.","_n":"4h3ca","_k":"a46e60c1"},{"t":"116 L at `t = 4` min","why":"That’s only a local minimum.","_n":"4i3ba","_k":"9c391a69"},{"t":"100 L at `t = 0` min","why":"`V′ = 3(t - 2)(t - 4)`. `V(0) = 100`, `V(2) = 120`, `V(4) = 116`, `V(5) = 120`.","_n":"4j3aa","_k":"d12af28a"}]},"b":{"prompt":"`V(t) = t^3 - 12t^2 + 45t + 60` litres for `0 ≤ t ≤ 6` minutes. What is the least volume, and when does it occur?","options":[{"t":"There is no least volume, because `V′(0) ≠ 0`.","why":"Endpoints don’t need `V′ = 0`.","_n":"4k39a","_k":"f5b83948"},{"t":"114 L at `t = 3` and 6 min","why":"That’s the maximum.","_n":"4l38a","_k":"76e0f81e"},{"t":"110 L at `t = 5` min","why":"That’s only a local minimum: `V(0) = 60` is lower.","_n":"4m37a","_k":"2b53efac"},{"t":"60 L at `t = 0` min","why":"`V′ = 3(t - 3)(t - 5)`. `V(0) = 60`, `V(3) = 114`, `V(5) = 110`, `V(6) = 114`.","_n":"4n36a","_k":"58f7ee71"}]}}]},"task":{"title":"Design the window","summary":"Design the window","statement":"\u003cp>Choose whole numbers `a` and `b` so that, on `[a, b]`, the function `f(x) = x^3 - 12x` meets every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>Exactly one critical number of `f` lies strictly inside the interval.\u003c/li>\u003cli>The absolute maximum occurs \u003cstrong>only\u003c/strong> at an endpoint.\u003c/li>\u003cli>The absolute minimum occurs \u003cstrong>only\u003c/strong> at a critical number.\u003c/li>\u003cli>The interval is exactly 5 units long.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers from −5 to 6, with `a \u003c b`. The graph shows the walls, the candidates and the candidate table.\u003c/p>","checks":["One critical number inside","Max only at an endpoint","Min only at a critical number","Length 5"],"tips":["The critical numbers are −2 and 2. Put exactly one strictly inside; a critical number at a wall counts as an endpoint.","Some endpoint must beat the local max, or the local max mustn’t be inside.","Make `x = 2` (where `f = -16`) the inside critical number, and keep the endpoints above −16.","`b = a + 5`."],"explainPrompt":"Explain how you made sure the maximum landed on an endpoint and the minimum on a critical number.","vocab":"Use the words candidate, endpoint, critical number and absolute.","more":"There’s more than one answer. Can you find them all?","afterAll":"In each one, `x = 2` is the only critical number inside,
