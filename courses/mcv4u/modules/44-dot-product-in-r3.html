.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 44: hero caption, 3D angle finder (Explore), Find the missing component stations, Square corner task */
.dp-hcap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.98rem}
.dp-hcap [data-st]{transition:opacity .45s ease}
@media (prefers-reduced-motion:reduce){ .dp-hcap [data-st]{transition:none} }

.dp-v{touch-action:none}
.dp-v:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dp-ex{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.dp-main,.dp-side{min-width:0}
.dp-views{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dp-views .btn.on{border-color:var(--ink);background:var(--hi-soft);color:var(--ink)}
.dp-how{margin:6px 0 8px}
.dp-vecs{display:grid;gap:8px;margin-bottom:10px}
.dp-vrow{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:1.1rem}
.dp-vn{min-width:2.6rem}
.dp-st-in{width:4.2rem;text-align:center}
.dp-pre{margin:6px 0 10px;align-items:center}
.dp-ask{margin:10px 0 4px;font-weight:700}
.dp-verdict{margin:10px 0 6px;font-weight:600}
.dp-read{margin-top:12px}
.dp-read .m{white-space:normal}
.dp-note{margin:10px 0 0;font-weight:600;color:var(--ink)}
.dp-setups{margin-top:14px;padding-top:10px;border-top:1px solid var(--rule)}
.dp-setups p{margin:6px 0 0}
.uses.dp-uses{display:block;margin-top:8px}

.dp-st h3{margin-top:0}
.dp-stg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.dp-stv,.dp-sts{min-width:0}
.dp-count{font-weight:700;margin:8px 0 4px}
.dp-after{margin:10px 0 0}
.dp-cube{margin:4px 0 8px}

@media (max-width:760px){
  .dp-ex,.dp-stg{grid-template-columns:minmax(0,1fr)}
}

acute or obtuse, so the numbers decide.","fig":{"aria":"Seen from the top, a = (1, 0, 3) and b = (0, 1, −2) look perpendicular. Turned to an isometric view they open past 90°: the dot product is −6 and θ ≈ 148°. A second pair, (1, 2, 2) and (2, −2, 1), looks skewed but has dot product 0: a right angle.","shape":"wide"}},"goals":["I can calculate the dot product of two vectors in R³ from components.","I can find the angle between two vectors in R³.","I can test vectors in R³ for perpendicularity and find unknown components that make them perpendicular.","I can find a vector perpendicular to two given vectors by solving a system.","I can find the direction cosines and direction angles of a vector.","I can solve 3D problems with the dot product, such as angles in boxes and work."],"start":{"warmup":{"questions":[{"id":"w1","skill":"3D magnitude","goal":2,"prompt":"What is |(2, −3, 6)|?","options":[{"t":"5","why":"2 − 3 + 6 isn’t a length.","_n":"07d3","_k":"c445f93c"},{"t":"7","why":"`√(4 + 9 + 36) = √49`.","_n":"17e3","_k":"8be76e57"},{"t":"11","why":"That adds the absolute values. Square, add, then take the root.","_n":"27f3","_k":"81980268"},{"t":"49","why":"That forgets the root: `√49 = 7`.","_n":"3783","_k":"159be90b"}],"hints":["`|vec{a}| = √(a_1^2 + a_2^2 + a_3^2)`.","4 + 9 + 36 = 49.","7."]},{"id":"w2","skill":"3D magnitude","goal":5,"prompt":"What is |(1, 4, 8)|?","options":[{"t":"13","why":"That adds the components. Square, add, then take the root.","_n":"4793","_k":"d3904175"},{"t":"81","why":"That forgets the root: `√81 = 9`.","_n":"57a3","_k":"42618ab4"},{"t":"`√17`","why":"That drops the third component. In R³ there are three squares to add.","_n":"67b3","_k":"609766b0"},{"t":"9","why":"`√(1 + 16 + 64) = √81`.","_n":"7743","_k":"3df0e5a8"}],"hints":["Three squares.","1 + 16 + 64 = 81.","9."]},{"id":"w3","skill":"Dot product in R²","goal":1,"prompt":"(3, −2) · (4, 6) = ?","options":[{"t":"0","why":"12 − 12.","_n":"8753","_k":"9e3b7132"},{"t":"(12, −12)","why":"The dot product is a number.","_n":"96ab","_k":"87d2a3bc"},{"t":"24","why":"(−2)(6) = −12.","_n":"a69b","_k":"4ef5cacc"},{"t":"10","why":"Pair `x` with `x`, `y` with `y`.","_n":"b68b","_k":"caf29d82"}],"hints":["`a_1b_1 + a_2b_2`.","(3)(4) + (−2)(6).","12 − 12 = 0."]},{"id":"w4","skill":"Dot product in R²","goal":2,"prompt":"If `vec{a} · vec{b} = |vec{a}||vec{b}|` for non-zero vectors, what is the angle between them?","options":[{"t":"0°","why":"`cos θ = 1`.","_n":"c67b","_k":"c279009b"},{"t":"45°","why":"cos 45° isn’t 1.","_n":"d66b","_k":"2e025132"},{"t":"180°","why":"That needs `-|vec{a}||vec{b}|`.","_n":"e65b","_k":"3ef926b4"},{"t":"90°","why":"That needs `vec{a} · vec{b} = 0`.","_n":"f64b","_k":"b68cd6b2"}],"hints":["Divide both sides by `|vec{a}||vec{b}|`.","`cos θ = 1`.","`θ = 0°`: same direction."]},{"id":"w5","skill":"Systems","goal":4,"prompt":"Solve `x + 2y = 0` and `3x - y = 7`.","options":[{"t":"`x = 2`, `y = -1`","why":"2 − 2 = 0 and 6 + 1 = 7.","_n":"g63b","_k":"cc71082b"},{"t":"`x = 7`, `y = 0`","why":"Check the first equation: 7 ≠ 0.","_n":"h72b","_k":"2b5c1e19"},{"t":"`x = -2`, `y = 1`","why":"Sign slip: 3(−2) − 1 = −7.","_n":"i71b","_k":"8537d4f3"},{"t":"`x = 1`, `y = -1/2`","why":"That satisfies only the first: 3(1) + 1/2 ≠ 7.","_n":"j70b","_k":"e644a42d"}],"hints":["From the first, `x = -2y`.","`-6y - y = 7`, so `y = -1`.","`x = 2`."]},{"id":"w6","skill":"Special angles","goal":2,"prompt":"`cos θ = -√3/2` with 0° ≤ θ ≤ 180°. What is θ?","options":[{"t":"210°","why":"Outside 0°–180°.","_n":"k71b","_k":"1187b645"},{"t":"120°","why":"cos 120° = −1/2.","_n":"l6eb","_k":"dd69c1f5"},{"t":"150°","why":"Reference angle 30°, in quadrant 2.","_n":"m6fb","_k":"7781b0d0"},{"t":"30°","why":"That ignores the sign: the cosine is negative, so θ is obtuse.","_n":"n74b","_k":"404cef95"}],"hints":["Which angle has cosine `√3/2`?","30°.","Negative in quadrant 2: 150°."]}],"refreshers":{"3D magnitude":"`|(a_1, a_2, a_3)| = √(a_1^2 + a_2^2 + a_3^2)`. Handy triples: (1, 2, 2) → 3, (2, 3, 6) → 7, (1, 4, 8) → 9.","Dot product in R²":"`a_1b_1 + a_2b_2 = |vec{a}||vec{b}| cos θ`; 0 means perpendicular.","Systems":"Solve one equation for a variable and substitute.","Special angles":"Obtuse cosines are negative: cos 120° = −1/2, cos 135° = `-√2/2`, cos 150° = `-√3/2`."}}},"explore":{"heading":"3D angle finder","intro":"Set two vectors in space, turn the view, and find the angle between them. Then look at one vector’s angles with the three axes.","presets":[{"id":"look","t":"Look-alike pair","a":[1,0,3],"b":[0,1,-2]},{"id":"hidden","t":"Hidden right angle","a":[1,2,2],"b":[2,-2,1]},{"id":"cube","t":"Cube diagonal and edge","a":[1,1,1],"b":[1,0,0]}],"views":[{"id":"iso","t":"Isometric"},{"id":"top","t":"Top (`xy`)"},{"id":"front","t":"Front (`xz`)"},{"id":"side","t":"Side (`yz`)"}],"modes":[{"id":"angle","t":"Angle"},{"id":"dir","t":"Direction angles"},{"id":"look","t":"Look-alike"}],"modeHow":{"angle":"Both vectors start at the origin. The plane that contains them is lightly shaded, and the angle arc is drawn in that plane.","dir":"Only `vec{a}` is shown, with dashed box guides to the axes and its three angles: α to the `x`-axis, β to the `y`-axis, γ to the `z`-axis.","look":"The view is locked and the readout is hidden. Judge the angle by eye, then see the true angle."},"viewHow":"Drag the view, or focus it and use the arrow keys, to turn it (Shift turns 15°).","lookAsk":"Judge by eye. The angle between the vectors…","looks":[{"id":"perp","t":"looks perpendicular"},{"id":"acute","t":"looks acute"},{"id":"obtuse","t":"looks obtuse"}],"status":{"perp":"Perpendicular","acute":"Acute","obtuse":"Obtuse","same":"Parallel (same direction)","opp":"Parallel (opposite)","zero":"No angle: a zero vector has no direction"},"note":"The screen can’t be trusted: only the dot product decides.","predIntro":"Make a prediction first. Then the 3D angle finder shows you what really happens.","predictions":[{"id":"p1","prompt":"Angle mode, `vec{a} = (1, 2, 2)`, `vec{b} = (2, -2, 1)`. `vec{a} · vec{b} = ` ?","options":[{"t":"(2, −4, 2)","_n":"o75b","_k":"b320473d"},{"t":"9","_n":"p72b","_k":"a396bcd1"},{"t":"0","_n":"q73b","_k":"c6914746"},{"t":"−2","_n":"r68b","_k":"181753f2"}],"explain":"2 − 4 + 2 = 0. 9 is `|vec{a}||vec{b}|` (no angle); (2, −4, 2) forgets to add; −2 drops the `z`-term."},{"id":"p2","prompt":"Look-alike mode, top view, `vec{a} = (1, 0, 3)`, `vec{b} = (0, 1, -2)`. From the top these vectors look perpendicular. Are they?","options":[{"t":"You can’t tell","_n":"s69b","_k":"1f2010f6"},{"t":"No: the angle is acute","_n":"tf6c","_k":"a603b095"},{"t":"Yes","_n":"uf5c","_k":"1a08b87f"},{"t":"No: the angle is obtuse","_n":"vf8c","_k":"b83c2486"}],"explain":"The top view hides the `z`-components, 3 and −2, whose product is −6. So `vec{a} · vec{b} = -6` and θ ≈ 148°. A flat drawing distorts angles. Compute the dot product."},{"id":"p3","prompt":"Direction-angles mode, `vec{a} = (2, 2, 1)`. Which axis makes the largest angle with `vec{a}`?","options":[{"t":"The `y`-axis","_n":"wf7c","_k":"0aca569f"},{"t":"The `x`-axis","_n":"xf2c","_k":"47867855"},{"t":"The `z`-axis","_n":"yf1c","_k":"fb484d54"},{"t":"All three are equal","_n":"zf4c","_k":"ee34c881"}],"explain":"`cos γ = 1/3` is the smallest cosine. The smallest component gives the smallest cosine, and so the largest angle."},{"id":"p4","prompt":"Preset “Cube diagonal and edge”: (1, 1, 1) and (1, 0, 0). The angle between them is closest to:","options":[{"t":"30°","_n":"10f3c","_k":"50f8834f"},{"t":"45°","_n":"11eec","_k":"22a2cd41"},{"t":"60°","_n":"12edc","_k":"14bf47e7"},{"t":"55°","_n":"13eca","_k":"22ab0c28"}],"explain":"`cos θ = 1/√3`. A cube’s body diagonal leans more steeply than a face diagonal (45°).\u003cspan class=\"uses dp-uses\">\u003cstrong>Use these values\u003c/strong>cos 55° ≈ 0.574, `1/√3` ≈ 0.577\u003c/span>"}],"chalIntro":"Use the 3D angle finder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. A set-up button locks the vectors each challenge fixes. Each challenge has three levels of help.","setups":[{"id":"tc1","t":"Set up challenge 1"},{"id":"tc2","t":"Set up challenge 2"},{"id":"tc3","t":"Set up challenge 3"},{"id":"free","t":"Unlock all"}],"lockNote":{"tc1":"Challenge 1: `vec{a} = (2, -1, 3)` and `b_1 = 1`, `b_2 = 5` are locked. Choose `b_3 = k`.","tc2":"Challenge 2: `vec{a} = (1, 1, 0)` is locked. Components of `vec{b}` run from −3 to 3.","tc3":"Challenge 3: direction-angles mode, components of `vec{a}` from −3 to 3. Then choose γ."},"gammas":[0,45,60,90],"challenges":[{"id":"tc1","goal":3,"prompt":"`vec{a} = (2, -1, 3)` is locked. Set `vec{b} = (1, 5, k)`: choose `k` to make `vec{b}` perpendicular to `vec{a}`.","why":"2 − 5 + 3(1) = 0: with `k = 1`, `vec{a} · vec{b} = 0`.","hints":["Set `vec{a} · vec{b} = 0`.","`2 - 5 + 3k = 0`.","`k = 1`."],"msgs":{"setup":"Press “Set up challenge 1”: `vec{a} = (2, -1, 3)` and `vec{b} = (1, 5, k)`.","m1":"2 − 5 − 3 = −6: check the sign of `3k`.","z":"2 − 5 = −3: you still need `3k = 3`.","other":"`vec{a} · vec{b} = 2 - 5 + 3k = {d}`. You need 0."}},{"id":"tc2","goal":2,"prompt":"`vec{a} = (1, 1, 0)` is locked. Choose `vec{b}` (components −3 to 3) so the angle between them is exactly 60°. Then find a second answer that isn’t a multiple of the first.","why":"`cos θ = 1/2` needs `vec{a} · vec{b} = (1/2)|vec{a}||vec{b}|`. The answers are the multiples of (0, 1, 1), (0, 1, −1), (1, 0, 1) and (1, 0, −1).","hints":["cos 60° = 1/2, so `vec{a} · vec{b} = (1/2)|vec{a}||vec{b}|`.","Try `vec{b}` with two components equal to 1 and one 0.","(0, 1, 1): `vec{a} · vec{b} = 1` and `|vec{a}||vec{b}| = 2`."],"msgs":{"setup":"Press “Set up challenge 2”: `vec{a} = (1, 1, 0)`.","range":"Keep each component of `vec{b}` between −3 and 3.","zero":"`vec{b}` can’t be the zero vector.","y":"45°: close.","one":"About 35°.","obt":"`cos θ = -1/2`: that’s 120°.","first":"That’s one 60° answer, {v}. Now find a second answer that isn’t a multiple of it, and check again.","other":"θ {t} now. You need exactly 60°."}},{"id":"tc3","goal":5,"stretch":true,"prompt":"Direction-angles mode. Choose `vec{a}` (components −3 to 3) so that α = 45° and β = 45°. What must γ be?","why":"`cos^2 α + cos^2 β + cos^2 γ = 1` gives `1/2 + 1/2 + cos^2 γ = 1`, so γ = 90°: `vec{a} = (k, k, 0)` with `k > 0`.","hints":["`cos^2 α + cos^2 β + cos^2 γ = 1`.","`1/2 + 1/2 + cos^2 γ = 1`, so `cos γ = 0`.","γ = 90°: `vec{a} = (1, 1, 0)`, or any positive multiple."],"msgs":{"setup":"Press “Set up challenge 3” (direction-angles mode).","range":"Keep each component of `vec{a}` between −3 and 3.","ones":"α = β, but each is about 55°.","ones45":"Three 45° angles would need `cos^2` values adding to 3/2.","neg":"α = β = 135°: the components must be positive.","gam":"α = β = 45°. Now choose γ with its chip.","gwrong":"α = β = 45°, so `cos^2 γ = 1 - 1/2 - 1/2`. Check your γ.","other":"α {a} and β {b}. You need both to be 45°."}}]},"part3":{"slug":"orthogonal","name":"Perpendicular","heading":"Find the missing component","intro":"In R², one direction (and its opposite) is perpendicular to a vector. In R³ there are far more. Build the set of perpendicular vectors one condition at a time, then measure angles in a cube. Then try the quick check.","turnHow":"Drag the view, or focus it and use the arrow keys, to turn it (Shift turns 15°).","dragHow":"Drag the tip of the vector, or use Previous and Next, to move it between whole-number points. Drag anywhere else (or use the arrow keys on the focused view) to turn the view.","stations":[{"id":"s1","title":"Station 1: one condition, a plane of answers","text":"`vec{a} = (1, 2, 3)` is drawn in blue. Every vector perpendicular to it lies in the shaded plane through the origin. Move `vec{b}`’s tip around that plane: `vec{a} · vec{b}` stays 0.","count":"Perpendicular vectors found: {n} (there are infinitely many)","plane":"The plane’s equation: `x + 2y + 3z = 0`. (You’ll meet this again in module 52.)"},{"id":"s2","title":"Station 2: two conditions, one line","text":"Add `vec{c} = (2, 1, 0)` in orange. A second plane, perpendicular to `vec{c}`, appears. The two planes meet in a line (ink): every vector on it is perpendicular to both `vec{a}` and `vec{c}`.","alg":["`x + 2y + 3z = 0` and `2x + y = 0`.","From the second, `y = -2x`.","Substituting gives `x - 4x + 3z = 0`, so `z = x`.","Let `x = t`: `vec{w} = t(1, -2, 1)`."],"after":"Check `vec{w} · vec{a} = 1 - 4 + 3 = 0` and `vec{w} · vec{c} = 2 - 2 = 0`, then move along the line: (2, −4, 2) and (−1, 2, −1) also work. Any non-zero multiple works: (1, −2, 1) and (−3, 6, −3) point along the same line."},{"id":"s3","title":"Station 3: angles in a cube","text":"A unit cube has a vertex at the origin. Tap two of its edges, face diagonals or body diagonals from the origin, and the angle computes.","vecs":[{"id":"ex","t":"edge (1, 0, 0)","v":[1,0,0]},{"id":"ey","t":"edge (0, 1, 0)","v":[0,1,0]},{"id":"ez","t":"edge (0, 0, 1)","v":[0,0,1]},{"id":"fxy","t":"face diagonal (1, 1, 0)","v":[1,1,0]},{"id":"fxz","t":"face diagonal (1, 0, 1)","v":[1,0,1]},{"id":"fyz","t":"face diagonal (0, 1, 1)","v":[0,1,1]},{"id":"bd","t":"body diagonal (1, 1, 1)","v":[1,1,1]}],"pick":"Tap two vectors."}],"quickCheck":{"title":"Quick check","summary":"Find the missing component quick check","items":[{"id":"q1","goal":3,"prompt":"How many directions are perpendicular to (1, 2, 3) in R³?","choices":[{"t":"infinitely many (a plane of them)","fb":"Right. Every (`x`, `y`, `z`) with `x + 2y + 3z = 0`: a whole plane.","_n":"14eda","_k":"8bcda0a0"},{"t":"two (opposite)","fb":"In 3D, a whole plane of directions is perpendicular to one vector. Two conditions narrow it to a line.","_n":"15eea","_k":"f6918b07"},{"t":"none","fb":"In 3D, a whole plane of directions is perpendicular to one vector. Two conditions narrow it to a line.","_n":"16efa","_k":"65d1bf2f"},{"t":"exactly one","fb":"In 3D, a whole plane of directions is perpendicular to one vector. Two conditions narrow it to a line.","_n":"17f0a","_k":"10ce7305"}]},{"id":"q2","goal":3,"prompt":"Find `k` so that (`k`, 2, −1) is perpendicular to (3, `k`, 4).","choices":[{"t":"−4/5","fb":"`3k + 2k - 4 = 0` gives `5k = 4`: check the sign.","_n":"18f1a","_k":"a01aa653"},{"t":"4/5","fb":"Right. `3k + 2k - 4 = 0`, so `5k = 4`.","_n":"19f2a","_k":"d7ba31e6"},{"t":"4/3","fb":"You dropped the middle term `2k`: `3k + 2k - 4 = 0`.","_n":"1af3a","_k":"d1e9cf44"},{"t":"4","fb":"`5k = 4`, so divide by 5.","_n":"1be4a","_k":"bed09aed"}]},{"id":"q3","goal":4,"prompt":"Which vector is perpendicular to both (1, 0, 1) and (0, 1, 1)?","choices":[{"t":"(1, 1, −1)","fb":"Right. 1 + 0 − 1 = 0 and 0 + 1 − 1 = 0.","_n":"1ce5a","_k":"5b927a66"},{"t":"(0, 0, 1)","fb":"(0, 0, 1) · (1, 0, 1) = 1. Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"1df2b","_k":"befb1c3d"},{"t":"(1, 1, 1)","fb":"(1, 1, 1) · (1, 0, 1) = 2. Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"1ef1b","_k":"d8336e4b"},{"t":"(1, −1, 0)","fb":"It fails with (1, 0, 1): 1 ≠ 0. Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"1ff0b","_k":"324a52dd"}]},{"id":"q4","goal":6,"prompt":"Angle between face diagonals (1, 1, 0) and (0, 1, 1) of a cube?","choices":[{"t":"60°","fb":"Right. `1/(√2 · √2) = 1/2`.","_n":"1gefb","_k":"133f8138"},{"t":"90°","fb":"They can look perpendicular in a drawing: `1/(√2 · √2) = 1/2`.","_n":"1hf6b","_k":"28824345"},{"t":"45°","fb":"`cos θ = 1/(√2 · √2) = 1/2`, not `√2/2`.","_n":"1if5b","_k":"9013e5bb"},{"t":"120°","fb":"The dot product is positive: `1/(√2 · √2) = 1/2`.","_n":"1jf4b","_k":"a9c59725"}]}]}},"practice":{"activities":[{"id":"angles","type":"numeric","title":"Angles in 3D","summary":"Angles in 3D","star":true,"goal":[1,2,6],"instruction":"Find each dot product, cosine or angle. Items 6 to 8 are non-routine.","how":"Type whole numbers or fractions such as 3/4. Angles are in degrees.","items":[{"id":"d1","goal":1,"prompt":"(1, 2, 2) · (2, 3, 6) = ? Then give `cos θ` as a fraction.","_a":"blQFTVMYDwQHVQ1RWgMEAg1WDFRRBWs=","set":true,"keypad":"text","label":"The dot product, then `cos θ`, separated by a comma:","display":"20, then `cos θ = 20/21`","why":"2 + 6 + 12 = 20, and `|vec{a}||vec{b}| = 3 × 7 = 21`.","wrong":[{"match":8,"fb":"In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`."},{"match":[8,0.38095238095238093],"fb":"In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`."},{"match":20,"fb":"Now give `cos θ` too, after a comma."}]},{"id":"d2","goal":2,"prompt":"Angle between (1, −1, 0) and (1, 0, −1), in degrees?","_a":"A1Y=","unit":"°","display":"60°","why":"`vec{a} · vec{b} = 1`; `|vec{a}||vec{b}| = 2`, so `cos θ = 1/2`.","general":"`vec{a} · vec{b} = 1`; `|vec{a}||vec{b}| = 2`."},{"id":"d3","goal":2,"prompt":"Angle between (1, 1, 0) and (−1, 0, 1)?","_a":"BFQF","unit":"°","display":"120°","why":"`cos θ = -1/2`.","wrong":[{"match":60,"fb":"The dot product is −1: obtuse."}]},{"id":"d4","goal":2,"prompt":"Angle between (3, −2, 4) and (2, 5, 1)?","_a":"DFY=","unit":"°","display":"90°","why":"6 − 10 + 4 = 0.","general":"6 − 10 + 4 = 0."},{"id":"d5","goal":2,"prompt":"Angle between (0, 2, 2) and (0, −3, 0)?","_a":"BFUA","unit":"°","display":"135°","why":"`cos θ = -6/(2√2 · 3) = -√2/2`.","wrong":[{"match":45,"fb":"−6 is negative: obtuse."}]},{"id":"d6","goal":6,"star":true,"prompt":"A box measures 2 by 3 by 6. Give `cos θ` for the angle between its long diagonal and its edge of length 6.","_a":"BUgNVFQHAgMNUwJQVwQOBAJX","keypad":"text","display":"6/7","why":"Diagonal (2, 3, 6), length 7; edge (0, 0, 6): 36/(7 × 6) = 6/7.","general":"Diagonal (2, 3, 6), length 7; edge (0, 0, 6): 36/(7 × 6)."},{"id":"d7","goal":6,"star":true,"prompt":"Triangle `P`(1, 0, 2), `Q`(3, 1, 4), `R`(2, 2, 0). What is the angle at `P`?","_a":"DFY=","unit":"°","display":"90°","why":"`vec{PQ} = (2, 1, 2)`, `vec{PR} = (1, 2, -2)`: 2 + 2 − 4 = 0.","general":"`vec{PQ} = (2, 1, 2)`, `vec{PR} = (1, 2, -2)`: 2 + 2 − 4 = 0. Use vectors from `P`.","hints":["Build both vectors from `P`.","`vec{PQ} = (2, 1, 2)`, `vec{PR} = (1, 2, -2)`.","Dot product 0: 90°."]},{"id":"d8","goal":6,"star":true,"prompt":"`|vec{a}| = |vec{b}|` and neither is `vec{0}`. Find the angle between `vec{a} + vec{b}` and `vec{a} - vec{b}`.","_a":"DFY=","unit":"°","display":"90°","why":"`(vec{a} + vec{b}) · (vec{a} - vec{b}) = |vec{a}|^2 - |vec{b}|^2 = 0`: a rhombus’s diagonals.","general":"`(vec{a} + vec{b}) · (vec{a} - vec{b}) = |vec{a}|^2 - |vec{b}|^2 = 0`: a rhombus’s diagonals.","hints":["Expand the dot product.","The `vec{a} · vec{b}` terms cancel.","`|vec{a}|^2 - |vec{b}|^2 = 0`, so 90°."]}]},{"id":"dircos","type":"match","title":"Direction cosines","summary":"Direction cosines","goal":5,"instruction":"Match each vector to its direction cosines or direction angles.","how":"Tap a vector, then tap its direction cosines on the right.","leftTitle":"Vector","rightTitle":"Direction cosines or angles","left":[{"id":"l1","t":"(1, 2, 2)","why":"`|vec{a}| = 3`."},{"id":"l2","t":"(2, −1, 2)","why":"`|vec{a}| = 3`, and the `y`-cosine keeps its sign."},{"id":"l3","t":"(0, 3, 4)","why":"`|vec{a}| = 5`."},{"id":"l4","t":"(2, 3, 6)","why":"`|vec{a}| = 7`."},{"id":"l5","t":"(1, 1, 1)","why":"`|vec{a}| = √3`, and `1/√3 = √3/3`."},{"id":"l6","t":"(−4, 0, 3)","why":"`|vec{a}| = 5`."},{"id":"l7","t":"(0, 1, 1)","why":"cos α = 0 gives α = 90°; cos β = cos γ = `1/√2 = √2/2` gives 45°.","hints":["An angle of 90° means cos α = 0.","So the `x`-component is 0.","cos 45° = `√2/2` for the other two: (0, 1, 1)."]}],"right":[{"id":"r1","t":"(1/3, 2/3, 2/3)"},{"id":"r2","t":"(2/3, −1/3, 2/3)"},{"id":"r3","t":"(0, 3/5, 4/5)"},{"id":"r4","t":"(2/7, 3/7, 6/7)"},{"id":"r5","t":"(`√3/3`, `√3/3`, `√3/3`)"},{"id":"r6","t":"(−4/5, 0, 3/5)"},{"id":"r7","t":"α = 90°, β = 45°, γ = 45°"}],"_a":"TkRZUEEMFEMERBlDDwQUCxcUB0NPFFoCF1wXE1AUGhNZUhdbQUQCExlEWVRBDBRDAEQZQw8AFAsXFANDTxRaBhdcFxNUFEs=","wrong":{"l1|r2":"Check the sign of the `y`-component.","l2|r1":"Check the sign of the `y`-component.","l3|r6":"Which component is 0? It’s the `x` in (0, 3, 4) and the `y` in (−4, 0, 3).","l6|r3":"Which component is 0? It’s the `x` in (0, 3, 4) and the `y` in (−4, 0, 3).","l5|r7":"(1, 1, 1) has no right angle with an axis; (0, 1, 1) makes 90° with the `x`-axis.","l7|r5":"(1, 1, 1) has no right angle with an axis; (0, 1, 1) makes 90° with the `x`-axis."},"wrongDefault":"Divide each component by the magnitude. There’s no rule that the angles add to 180°."},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Sofia","how":"","goal":[2,4,5],"instruction":"Sofia made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the angle between `vec{a} = (2, 1, -2)` and `vec{b} = (1, 0, 1)`.","steps":["`|vec{a}| = √(4 + 1 + 4) = 3`.","`|vec{b}| = √(1 + 0 + 1) = √2`.","`vec{a} · vec{b} = (2)(1) + (1)(0) + (-2)(1) = 2 + 0 + 2 = 4`.","`cos θ = 4/(3√2) = 2√2/3`."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 uses step 3 correctly."],"fixes":[{"t":"(−2)(1) = −2, so `vec{a} · vec{b} = 0`: the vectors are perpendicular and θ = 90°.","why":"(−2)(1) = −2. Track every sign in the three products.","_n":"1kf3b","_k":"bb7571fc"},{"t":"Ignore the `z`-components: 2 + 0 = 2.","why":"In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"1leab","_k":"cdac9d4f"},{"t":"`vec{a} · vec{b} = (2, 0, -2)`.","why":"That’s a vector; add the products.","_n":"1me9b","_k":"64d48aa6"},{"t":"Step 3 is correct.","why":"(−2)(1) = −2. Track every sign in the three products.","_n":"1nf8b","_k":"3aab5d4d"}],"hints":["Recheck each product’s sign.","(−2)(1) = −2.","2 + 0 − 2 = 0: 90°."]},{"id":"e2","goal":4,"task":"Find a vector perpendicular to both `vec{u} = (1, 1, 0)` and `vec{v} = (0, 1, 2)`.","steps":["Let `vec{w} = (x, y, z)`. Then `vec{u} · vec{w} = x + y = 0`.","And `vec{v} · vec{w} = y + 2z = 0`.","From the first equation, `y = -x`.","Choose `x = 1`, so `y = -1` and `vec{w} = (1, -1, 0)`.","Check: `vec{u} · vec{w} = 1 - 1 + 0 = 0` ✓"],"_a":"Bg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","This check only tests one condition."],"fixes":[{"t":"Choose `z = 0`; then any `x` works.","why":"`vec{v} · vec{w} = y ≠ 0` unless `y = 0`.","_n":"1of9b","_k":"ffa8f869"},{"t":"`vec{w} = (0, 0, 0)` works.","why":"The zero vector has no direction; the question wants a direction.","_n":"1pf6b","_k":"ec08429d"},{"t":"Step 4 is correct.","why":"Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"1qf7b","_k":"15154cc1"},{"t":"Use the second equation too: `-1 + 2z = 0`, so `z = 1/2` and `vec{w} = (1, -1, 1/2)`, or (2, −2, 1).","why":"Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"1rf4b","_k":"f1fd60aa"}],"hints":["Does (1, −1, 0) satisfy `y + 2z = 0`?","−1 + 0 ≠ 0.","`z = 1/2`: (2, −2, 1) after scaling."]},{"id":"e3","goal":5,"task":"Find the direction angles of `vec{a} = (2, -2, 1)`. Use these values: cos 48° ≈ 0.67, cos 71° ≈ 0.33.","steps":["`|vec{a}| = √(4 + 4 + 1) = 3`.","`cos α = 2/3`, `cos β = -2/3`, `cos γ = 1/3`.","Check: 4/9 + 4/9 + 1/9 = 1 ✓","So α ≈ 48°, β ≈ 48° and γ ≈ 71°.","The vector leans equally toward the `x`- and `y`-axes."],"_a":"Bg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 reads step 4."],"fixes":[{"t":"`cos β \u003c 0`, so β is obtuse: β ≈ 180° − 48° = 132°.","why":"A negative cosine means an obtuse angle.","_n":"1sf5b","_k":"7c88409e"},{"t":"α + β + γ must be 180°, so γ = 84°.","why":"The rule is `cos^2 α + cos^2 β + cos^2 γ = 1`. The angles themselves have no fixed sum.","_n":"1tf2b","_k":"6eada34d"},{"t":"β = −48°.","why":"Direction angles are between 0° and 180°.","_n":"1uf3b","_k":"33ab3e69"},{"t":"Step 4 is correct.","why":"`cos β = -2/3` is negative, so β is obtuse.","_n":"1vf0b","_k":"039616ad"}],"hints":["What does a negative cosine tell you about an angle?","It’s obtuse.","β ≈ 132°."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: a pair of vectors that looked perpendicular but wasn’t, or the plane of perpendicular vectors?"},{"id":"j2","q":"In your own words, why does finding a vector perpendicular to two vectors give a whole line of answers?"},{"id":"j3","q":"Explain to a friend how to find the direction angles of a vector."},{"id":"j4","q":"Which still trips you up in 3D: signs in the products, the third component, or setting up the system? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"(3, −1, 4) · (2, 5, −1) = ?","options":[{"t":"1","why":"That drops the `z`-term. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"1wf1b","_k":"63ec5d89"},{"t":"15","why":"Signs dropped. Track every sign in the three products.","_n":"1x5eb","_k":"e6157aff"},{"t":"−3","why":"6 − 5 − 4.","_n":"1y5db","_k":"9dc9f740"},{"t":"(6, −5, −4)","why":"Add the products.","_n":"1z60b","_k":"99159c21"}]},"b":{"prompt":"(−2, 3, 1) · (4, 1, 5) = ?","options":[{"t":"16","why":"Signs dropped. Track every sign in the three products.","_n":"205fb","_k":"93f216e5"},{"t":"0","why":"−8 + 3 + 5.","_n":"2162b","_k":"83e6d27a"},{"t":"(−8, 3, 5)","why":"Add the products.","_n":"2261b","_k":"d043d8c9"},{"t":"−5","why":"That drops the `z`-term. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"2364b","_k":"9358c909"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which vector is perpendicular to (2, −1, 3)?","options":[{"t":"(−2, 1, −3)","why":"That’s the opposite vector, not a perpendicular one.","_n":"2463b","_k":"824da825"},{"t":"(1, 2, 1)","why":"The `x`- and `y`-terms cancel, but the `z`-term adds 3. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"2566b","_k":"943b817d"},{"t":"(1, 5, 1)","why":"2 − 5 + 3 = 0.","_n":"2665b","_k":"92c1715e"},{"t":"(2, 1, −3)","why":"4 − 1 − 9 = −6.","_n":"27f4a","_k":"634cfddc"}]},"b":{"prompt":"Which vector is perpendicular to (1, 4, −2)?","options":[{"t":"(2, 0, 1)","why":"2 + 0 − 2 = 0.","_n":"28f5a","_k":"a351583d"},{"t":"(1, 1, 2)","why":"1 + 4 − 4 = 1, not 0.","_n":"29f6a","_k":"f8aef800"},{"t":"(−1, −4, 2)","why":"Opposite, not perpendicular.","_n":"2af7a","_k":"02535625"},{"t":"(4, −1, 1)","why":"`x` and `y` cancel, but `z` gives −2. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"2bf0a","_k":"44aeee65"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"What are the direction cosines of (6, −2, 3)?","options":[{"t":"(6/11, −2/11, 3/11)","why":"11 adds the absolute values; use the magnitude.","_n":"2cf1a","_k":"66a88ae9"},{"t":"(6/7, 2/7, 3/7)","why":"The `y`-cosine keeps its sign.","_n":"2df2a","_k":"07e09901"},{"t":"(6, −2, 3)","why":"Divide by the magnitude.","_n":"2ef3a","_k":"3a97fcb5"},{"t":"(6/7, −2/7, 3/7)","why":"`|vec{a}| = √49 = 7`.","_n":"2feca","_k":"d4105508"}]},"b":{"prompt":"Direction cosines of (−1, 4, 8)?","options":[{"t":"(−1, 4, 8)","why":"Divide by the magnitude, 9.","_n":"2geda","_k":"a5a6844d"},{"t":"(−1/13, 4/13, 8/13)","why":"13 adds the absolute values; use the magnitude.","_n":"2h7aa","_k":"6eb6eb0d"},{"t":"(−1/9, 4/9, 8/9)","why":"`|vec{a}| = 9`.","_n":"2i79a","_k":"43839633"},{"t":"(1/9, 4/9, 8/9)","why":"Keep the sign.","_n":"2j78a","_k":"e8ca99da"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Find the angle between (1, −1, 0) and (0, 1, −1).","options":[{"t":"120°","why":"`vec{a} · vec{b} = -1`, `|vec{a}||vec{b}| = 2`, `cos θ = -1/2`.","_n":"2k77a","_k":"c7b93ec3"},{"t":"90°","why":"Only 0 would mean perpendicular. A flat drawing distorts angles. Compute the dot product.","_n":"2l76a","_k":"e4727cce"},{"t":"150°","why":"cos 150° = `-√3/2`, not −1/2.","_n":"2m75a","_k":"4878e7a0"},{"t":"60°","why":"The dot product is negative: obtuse.","_n":"2n74a","_k":"a1fc4522"}]},"b":{"prompt":"Find the angle between (2, 0, 2) and (0, 3, 3).","options":[{"t":"60°","why":"`6/(2√2 · 3√2) = 6/12 = 1/2`.","_n":"2o73a","_k":"c0ee63b3"},{"t":"120°","why":"The dot product is positive: acute.","_n":"2p72a","_k":"8747232e"},{"t":"90°","why":"Only a dot product of 0 means perpendicular. A flat drawing distorts angles. Compute the dot product.","_n":"2q71a","_k":"61b6eb10"},{"t":"30°","why":"cos 30° = `√3/2`, not 1/2.","_n":"2rca6","_k":"c02ca2ca"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"For which values of `k` are (`k`, 2, −1) and (`k`, −3, `k`) perpendicular?","options":[{"t":"`k = ±√6`","why":"That drops the `z`-product, `-k`. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"2sc96","_k":"d7bf54c7"},{"t":"`k = 3` only","why":"`k = -2` also gives 0: 4 − 6 + 2.","_n":"2tcc6","_k":"b10239ea"},{"t":"`k = -3` or `k = 2`","why":"Sign slip in the factors.","_n":"2ucb6","_k":"8944a49a"},{"t":"`k = 3` or `k = -2`","why":"`k^2 - 6 - k = 0`, so `(k - 3)(k + 2) = 0`.","_n":"2vc66","_k":"a7312022"}]},"b":{"prompt":"For which `k` are (`k`, 1, 2) and (`k`, −8, `k`) perpendicular?","options":[{"t":"`k = -2` or `k = 4`","why":"Sign slip in the factors.","_n":"2wc56","_k":"cf10d6af"},{"t":"`k = 2` only","why":"`k = -4` also gives 0: 16 − 8 − 8.","_n":"2xc86","_k":"e875d259"},{"t":"`k = ±2√2`","why":"That drops the `z`-product, `2k`. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"2yc76","_k":"bc342927"},{"t":"`k = 2` or `k = -4`","why":"`k^2 - 8 + 2k = (k + 4)(k - 2)`.","_n":"2zd26","_k":"0340bc6f"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Which vector is perpendicular to both (1, 2, 0) and (0, 1, 3)?","options":[{"t":"(6, −3, 1)","why":"`x + 2y = 0` and `y + 3z = 0`: `y = -3z`, `x = 6z`.","_n":"30d16","_k":"86c4865d"},{"t":"(2, −1, 0)","why":"Perpendicular to the first only: (2, −1, 0) · (0, 1, 3) = −1. Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"31c45","_k":"9ac38172"},{"t":"(0, 3, −1)","why":"Perpendicular to the second only. Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"32c55","_k":"18515e68"},{"t":"(6, 3, 1)","why":"Sign slip: 6 + 6 ≠ 0.","_n":"33c25","_k":"ef341bb2"}]},"b":{"prompt":"Which vector is perpendicular to both (1, 0, 2) and (0, 2, 1)?","options":[{"t":"(4, 1, −2)","why":"`x + 2z = 0` and `2y + z = 0`: `z = -2y`, `x = 4y`.","_n":"34c35","_k":"01e90707"},{"t":"(4, 1, 2)","why":"Sign slip: 4 + 4 ≠ 0.","_n":"35c85","_k":"fadd434a"},{"t":"(2, 0, −1)","why":"Perpendicular to the first only: (2, 0, −1) · (0, 2, 1) = −1. Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"36c95","_k":"23342488"},{"t":"(0, 1, −2)","why":"Perpendicular to the second only. Check both: `vec{w} · vec{u} = 0` \u003cstrong>and\u003c/strong> `vec{w} · vec{v} = 0`.","_n":"37c65","_k":"f41b378a"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which statement about the vectors perpendicular to `vec{a} = (1, 2, 3)` is correct?","options":[{"t":"“There’s exactly one: (3, 2, 1).”","why":"(3, 2, 1) · (1, 2, 3) = 10, and there are infinitely many anyway. In 3D, a whole plane of directions is perpendicular to one vector. Two conditions narrow it to a line.","_n":"38c75","_k":"b968d0fc"},{"t":"“There are exactly two: one vector and its opposite.”","why":"In 3D, a whole plane of directions is perpendicular to one vector. Two conditions narrow it to a line.","_n":"39cc5","_k":"7372c075"},{"t":"“There are infinitely many. Together they fill a plane through the origin: every (`x`, `y`, `z`) with `x + 2y + 3z = 0`.”","why":"In 3D, a whole plane of directions is perpendicular to one vector. Two conditions narrow it to a line.","_n":"3acd5","_k":"68cd4b85"},{"t":"“Only vectors with a zero component can be perpendicular to it.”","why":"(1, 1, −1) works.","_n":"3bde5","_k":"49fdc255"}]},"b":{"prompt":"A drawing shows two 3D vectors meeting at what looks like a right angle. What’s the best way to decide whether they’re perpendicular?","options":[{"t":"“Check whether each has a zero component.”","why":"Not needed, and not enough.","_n":"3cdd5","_k":"fb0eff15"},{"t":"“Check whether their magnitudes are equal.”","why":"Length has nothing to do with it.","_n":"3ddc5","_k":"44a6fdd5"},{"t":"“Measure the angle on the screen.”","why":"A flat drawing distorts angles. Compute the dot product.","_n":"3edb5","_k":"ae359bbd"},{"t":"“Compute the dot product from the components: they’re perpendicular exactly when it’s 0.”","why":"A flat drawing distorts angles. Compute the dot product.","_n":"3fda5","_k":"ca4866f2"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which statement about the direction angles α, β, γ of a vector is always true?","options":[{"t":"α + β + γ = 90°","why":"The rule is `cos^2 α + cos^2 β + cos^2 γ = 1`. The angles themselves have no fixed sum.","_n":"3gd95","_k":"d1a3ae68"},{"t":"`cos^2 α + cos^2 β + cos^2 γ = 1`","why":"They’re the components of a unit vector.","_n":"3hd85","_k":"3dcb687d"},{"t":"α + β + γ = 180°","why":"The rule is `cos^2 α + cos^2 β + cos^2 γ = 1`. The angles themselves have no fixed sum.","_n":"3id75","_k":"e0bb62c0"},{"t":"`cos α + cos β + cos γ = 1`","why":"It’s the squares that add to 1.","_n":"3jd65","_k":"07d1b5ae"}]},"b":{"prompt":"A vector has α = 90°. What does this tell you?","options":[{"t":"It points along the `x`-axis.","why":"That would make α = 0°.","_n":"3kd55","_k":"07c5d3a8"},{"t":"Its `x`-component is 0: it’s parallel to the `yz`-plane.","why":"cos 90° = 0, so `a_1 = 0`.","_n":"3l585","_k":"ca1d588e"},{"t":"Its `x`-component is 1.","why":"cos 90° = 0.","_n":"3m595","_k":"1cc1629d"},{"t":"β and γ must also be 90°.","why":"Then it would be the zero vector.","_n":"3n5a5","_k":"a3ed798e"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A force `vec{F} = (2, 3, -1)` N moves an object through `vec{d} = (4, 0, 2)` m. How much work is done?","options":[{"t":"8 J","why":"That drops the `z`-term. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"3o5b5","_k":"6ddd784c"},{"t":"6 J","why":"8 + 0 − 2.","_n":"3p545","_k":"11452c76"},{"t":"10 J","why":"Signs dropped. Track every sign in the three products.","_n":"3q555","_k":"2b24b90d"},{"t":"(8, 0, −2)","why":"Work is a number: add the products.","_n":"3r565","_k":"64502515"}]},"b":{"prompt":"`vec{F} = (-1, 4, 2)` N moves an object through `vec{d} = (3, 2, 5)` m. Work?","options":[{"t":"(−3, 8, 10)","why":"Work is a number: add the products.","_n":"3s575","_k":"5190c1b1"},{"t":"21 J","why":"Signs dropped. Track every sign in the three products.","_n":"3t505","_k":"65b913c1"},{"t":"5 J","why":"That drops the `z`-term. In R³ there are three products to add: `a_1b_1 + a_2b_2 + a_3b_3`.","_n":"3u515","_k":"a1214fbd"},{"t":"15 J","why":"−3 + 8 + 10.","_n":"3v525","_k":"9d70f692"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A cube has a vertex at the origin and edges along the positive axes. What is the angle between the face diagonals (1, 1, 0) and (1, 0, 1)?","options":[{"t":"60°","why":"`1/(√2 · √2) = 1/2`.","_n":"3w515","_k":"87db5684"},{"t":"90°","why":"A flat drawing distorts angles. Compute the dot product.","_n":"3x545","_k":"741c6a31"},{"t":"45°","why":"That’s the angle between a face diagonal and an edge.","_n":"3y535","_k":"1a9215d7"},{"t":"120°","why":"The dot product is positive.","_n":"3z565","_k":"342d531d"}]},"b":{"prompt":"A box measures 3 by 4 by 12. What is `cos θ` for the angle between its long diagonal (3, 4, 12) and the floor diagonal (3, 4, 0)?","options":[{"t":"25/169","why":"Divide by `|vec{a}||vec{b}| = 65`, not by `13^2`.","_n":"40555","_k":"73f6a7b1"},{"t":"5/13","why":"25/(13 × 5).","_n":"41585","_k":"81f82f76"},{"t":"5/12","why":"Divide by the magnitudes, 13 and 5.","_n":"42575","_k":"9dd906a5"},{"t":"12/13","why":"That’s the angle with the vertical edge.","_n":"434a5","_k":"b8d434b5"}]}}]},"task":{"title":"Square corner","summary":"Square corner","statement":"\u003cp>`vec{a} = (2, -1, 2)` is one edge of a cube’s corner. Choose the other two edges `vec{b}` and `vec{c}` so the three edges meet at right angles and have equal lengths. Find as many corners as you can.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`vec{b}` is perpendicular to `vec{a}`.\u003c/li>\u003cli>`vec{c}` is perpendicular to `vec{a}`.\u003c/li>\u003cli>`vec{b}` is perpendicular to `vec{c}`.\u003c/li>\u003cli>`|vec{b}| = |vec{c}| = |vec{a}| = 3`.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Components are whole numbers from −4 to 4. The 3D view shows the three edges and the box they would build; right-angle marks appear as conditions are met.\u003c/p>","checks":["`vec{b} ⊥ vec{a}`","`vec{c} ⊥ vec{a}`","`vec{b} ⊥ vec{c}`","All three edges have length 3"],"tips":["`vec{b} · vec{a}` must be 0.","`vec{c} · vec{a}` must be 0.","Check `vec{b} · vec{c}` too: two vectors perpendicular to `vec{a}` aren’t automatically perpendicular to each other.","Whole-number vectors of length 3 are rearrangements of (±1, ±2, ±2) or (±3, 0, 0)."],"explainPrompt":"Explain how you found vectors of length 3 perpendicular to `vec{a}`, and why there are only eight answers.","vocab":"Use the words dot product, perpendicular, magnitude and direction.","after3":"Only two lines are possible for the other edges: along (2, 2, −1) and along (−1, 2, 2). Each can point either way, and `vec{b}` and `vec{c}` can swap roles: 2 × 2 × 2 = 8 corners."},"cards":[["`vec{a} · vec{b}` in R³","`a_1b_1 + a_2b_2 + a_3b_3 = |vec{a}||vec{b}| cos θ`."],["Angle in 3D","`cos θ = {vec{a} · vec{b}}/{|vec{a}||vec{b}|}`."],["Perpendicular in 3D","`vec{a} · vec{b} = 0` (non-zero vectors). Never trust the drawing."],["Perpendicular to one vector","A whole plane of directions: for (1, 2, 3), every (`x`, `y`, `z`) with `x + 2y + 3z = 0`."],["Perpendicular to two vectors","Solve two equations; the answers are all multiples of one vector."],["Direction angles","α, β, γ: the angles with the positive `x`-, `y`-, `z`-axes."],["Direction cosines","(`a_1/|vec{a}|`, `a_2/|vec{a}|`, `a_3/|vec{a}|`): the unit vector."],["Direction-cosine rule","`cos^2 α + cos^2 β + cos^2 γ = 1`."],["Handy 3D lengths","(1, 2, 2) → 3, (2, 3, 6) → 7, (1, 4, 8) → 9, (2, 6, 9) → 11."],["Cube face diagonals","(1, 1, 0) and (0, 1, 1) meet at 60°."],["Work in 3D","`W = vec{F} · vec{d}`, adding all three products."],["Angle at a vertex","Use vectors that start at that vertex."]]}};</script>
