.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 08: hero, difference-quotient engine (table, move menu, history), workbench, pattern hunter, coefficient boxes, task */
.opt .m,.chip .m,.fchip .m,.read dd .m,.read dt .m,.tile .m,.q-prompt .m,.fp-mv .m{white-space:normal}
.opt .lm-lim,.q-prompt .lm-lim,.face .lm-lim{margin-bottom:.1em}

/* hero */
.fp-heq{white-space:nowrap}
.fp-heq .m{white-space:nowrap}
.fp-hero{display:grid;gap:10px}
.fp-hl{min-height:7.6em;display:grid;gap:4px;align-content:start;font:400 1.3rem var(--font-math)}
.fp-hrow{padding:2px 8px;border-radius:6px}
.fp-hrow.cur{background:var(--hi-soft)}
.fp-hrow .m{font-size:1em}
.fp-ph{display:inline-block;border-radius:.25em;padding:0 .12em}
.fp-ph.on{animation:fp-pulse .75s ease-in-out 3}
@keyframes fp-pulse{0%,100%{background:transparent}50%{background:var(--hi);color:var(--hi-ink)}}
.fp-hsl{margin:0}
#hero-cap{min-height:2.6em}

/* engine */
.fp-lab{margin:0 0 6px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.fp-top{margin:0 0 14px}
.fp-fns{margin:0 0 6px}
.fp-fchip{font-size:1.05rem}
.fp-coef{margin:4px 0 2px}
.fp-cfrow{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:4px}
.fp-cfl{display:inline-flex;align-items:center;gap:6px;font-size:1.05rem}
.fp-cfin{width:4.8rem}
.fp-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-areas:"ban ban" "graph work";gap:10px 26px;align-items:start}
.fp-banner{grid-area:ban;margin:0}
.fp-gcol{grid-area:graph;min-width:0}
.fp-work{grid-area:work;min-width:0}
.fp-cap{font-size:clamp(1.3rem,3vw,1.8rem);min-height:1.4em}
.fp-gen{font-size:.55em;vertical-align:middle}
.fp-asl{margin-top:10px}
.fp-hch{margin:0 0 10px}
.fp-hc{min-width:3.4rem;font-family:var(--font-math);font-size:1rem}
.fp-tcap{margin:0 0 6px}
.fp-tbl table.vt{font-size:.98rem}
.fp-tbl th .m{white-space:nowrap}
.fp-tbl th .frac{font-size:.95em}
.fp-empty{margin:4px 0 10px}
.fp-num .q-actions{margin-top:8px}
.fp-hist{list-style:none;margin:0 0 6px;padding:10px;display:grid;gap:6px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.fp-ln{padding:4px 8px;border-radius:6px;border:1.5px solid transparent}
.fp-ln.cur{background:var(--hi-soft)}
.fp-dead{border:1.5px dashed var(--red)}
.fp-dead .fp-tag{color:var(--red)}
.fp-dead .fp-lm{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:.06em}
.fp-tag{display:block;font:700 .76rem var(--font-ui);color:var(--ink-2);letter-spacing:.02em}
.fp-tag .m{font-size:1.05em}
.fp-lm{font:400 1.18rem var(--font-math);overflow-x:auto;overflow-y:hidden;padding:2px 0}
.fp-lm .m{font-size:1em;white-space:nowrap}
.fp-note{margin:4px 0 2px;font-size:.88rem;color:var(--ink-2)}
.fp-showall{display:none;margin:0 0 10px}
.fp-moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:6px;margin:0 0 8px}
.fp-mv{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .6em;font-size:.9rem;min-height:38px;text-align:left;line-height:1.2}
.fp-mv:hover:not(:disabled){border-color:var(--ink)}
.fp-mv:disabled{opacity:.6}
.fp-mfb .fb{margin:6px 0}
.fp-mfb .m{white-space:nowrap}
.fp-acts{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.fp-cnt{font-size:.92rem}
.fp-trapped{color:var(--red);font-weight:700}
.fp-read{margin-top:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:26px}
.fp-read > div:first-child{padding-top:10px}
.fp-read > div:last-child{border-bottom:1px solid var(--rule)}
.fp-locked .fp-fns,.fp-locked .fp-moves,.fp-locked .fp-hch{opacity:.7}
.fp-wb{margin-top:18px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px}
.fp-wbh{margin:0 0 4px;font-size:1rem}
.fp-wb p{margin:0 0 8px}
.fp-wbr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font:400 1.25rem var(--font-math)}
.fp-wbr .m{font-size:1em}
.fp-fbx{display:inline-flex;flex-direction:column;align-items:stretch;gap:3px;vertical-align:middle}
.fp-fbin{width:4.6rem;text-align:center;padding:.25em .3em}
.fp-fbar{display:block;border-top:2px solid var(--ink)}

/* pattern hunter */
.fp-st + .fp-st{margin-top:26px;padding-top:18px;border-top:1.5px solid var(--rule)}
.fp-st h3{margin-top:0}
.fp-st h4{margin:16px 0 6px}
.fp-ptbl table.vt td{text-align:left}
.fp-x4{margin-top:14px}
.fp-pas{display:grid;gap:6px;justify-items:center;margin:8px 0 10px}
.fp-prow{display:flex;align-items:center;gap:8px}
.fp-pn{font:700 .74rem var(--font-ui);color:var(--ink-2);width:3.2rem;text-align:right;margin-right:4px}
.fp-pv{display:inline-block;min-width:2.4rem;text-align:center;font:400 1.15rem var(--font-math)}
.fp-pin{width:3rem;text-align:center;padding:.3em .2em}
.fp-pow{width:2.6rem;font-size:.95rem;padding:.15em .15em}
.fp-exp{font-size:1.15rem;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.fp-exp .m{white-space:nowrap}
.fp-dv{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.1rem}
.fp-dv sup{vertical-align:super;font-size:.8em}
.fp-cjp{margin:0 0 8px}
.fp-cjb{font-family:var(--font-math);font-size:1.05rem}
.fp-test{margin-top:10px}
.fp-tnote{margin:8px 0 0}
.fp-zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:10px}
.fp-zc{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
.fp-zc h4{margin:0 0 8px;font-size:.98rem}
.fp-zord{background:var(--paper)}
.fp-zseg .seg-wrap{margin-top:8px}
.fp-zsum{margin:8px 0 0;font-size:.92rem;min-height:2.6em}

/* practice 2: coefficient boxes */
.fp-form{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 4px;font:400 1.15rem var(--font-math)}
.fp-form .m{font-size:1em}
.fp-ft{display:inline-block}
.fp-brk{flex-basis:100%;height:0}
.fp-bx{width:5.2rem;text-align:center;padding:.3em .3em}
.fp-bfrac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle}
.fp-bft{display:flex;justify-content:center;padding-bottom:4px}
.fp-bfb{display:flex;justify-content:center;align-items:flex-start;gap:3px;padding-top:4px;border-top:2px solid var(--ink)}
.fp-bfb .m{margin-top:.75em}
.fp-bx.fp-pow{width:2.8rem;font-size:.95rem;padding:.2em .2em}

/* task */
.fp-conds{margin:6px 0 10px;padding-left:1.4em}
.fp-tkcap{margin:0 0 6px;font-size:1.25rem}

@media (max-width:820px){
  .fp-main{grid-template-columns:minmax(0,1fr);grid-template-areas:"ban" "work" "graph"}
  .fp-read{grid-template-columns:minmax(0,1fr)}
  .fp-read > div:first-child{padding-top:0}
}
@media (max-width:560px){
  .fp-hist:not(.fp-allon) .fp-old{display:none}
  .fp-showall{display:inline-flex}
  .fp-showall[hidden]{display:none}
  .fp-moves{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fp-pin{width:2.5rem}
  .fp-pn{width:auto}
  .fp-lm{font-size:1.08rem}
}

-line-in-r2","title":"Cartesian Equation of a Line in R²","kind":"topic","group":"8"},{"nn":"50","slug":"equations-of-lines-in-r3","title":"Vector, Parametric and Symmetric Equations of Lines in R³","kind":"topic","group":"8"},{"nn":"51","slug":"vector-equation-of-a-plane","title":"Vector Equation of a Plane","kind":"topic","group":"8"},{"nn":"52","slug":"cartesian-equation-of-a-plane","title":"Cartesian Equation of a Plane","kind":"topic","group":"8"},{"nn":"53","slug":"intersection-of-lines-with-planes","title":"Intersection of Lines with Planes","kind":"topic","group":"9"},{"nn":"54","slug":"intersection-of-lines","title":"Intersection of Lines in R² and R³","kind":"topic","group":"9"},{"nn":"55","slug":"systems-of-equations-matrices","title":"Systems of Equations (Matrices)","kind":"topic","group":"9"},{"nn":"56","slug":"intersection-of-two-planes","title":"Intersection of Two Planes","kind":"topic","group":"9"},{"nn":"57","slug":"intersection-of-three-planes","title":"Intersection of Three Planes","kind":"topic","group":"9"},{"nn":"58","slug":"distance-point-to-line","title":"Distance from a Point to a Line in R² and R³","kind":"topic","group":"9"},{"nn":"59","slug":"distance-point-to-plane","title":"Distance from a Point to a Plane","kind":"topic","group":"9"}]},"salt":"9adee956","content":{"id":"08-derivatives-from-first-principles","kind":"topic","title":"Derivatives from first principles","topic":"Derivatives from First Principles","readyTopic":"derivatives from first principles","hero":{"eq":"`f′(x) =` \u003cspan class=\"fp-heq\">\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{f(x + h) - f(x)}/{h}`\u003c/span>","eqLabel":"f prime of x equals the limit, as h approaches 0, of f of x plus h, minus f of x, all over h","eqSize":"sm","headline":"Simplify first, then let `h` shrink","text":"The fraction is the slope of a \u003cstrong>secant\u003c/strong> over a run of `h`. Shrink `h` to zero and the secant becomes the \u003cstrong>tangent\u003c/strong>. Put `h = 0` in straight away and you get 0/0, so expand, cancel the `h`, and only then take the \u003cstrong>limit\u003c/strong>. The result is the \u003cstrong>derivative from first principles\u003c/strong>.","fig":{"html":"\u003cdiv class=\"fp-hero\">\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"The parabola y = x squared with a secant through the points at x = 1 and x = 1 + h.\">\u003c/canvas>\u003cdiv class=\"fp-hl\" id=\"fp-hl\" aria-live=\"polite\">\u003c/div>\u003clabel class=\"slider fp-hsl\" for=\"fp-hh\">\u003cspan class=\"slider-top\">\u003cspan>Run \u003ci>h\u003c/i>\u003c/span>\u003coutput id=\"fp-hho\">1\u003c/output>\u003c/span>\u003cinput type=\"range\" id=\"fp-hh\" min=\"0\" max=\"1\" step=\"0.01\" value=\"1\" style=\"accent-color:var(--ink)\" aria-label=\"h, the run of the secant, from 0 to 1\" disabled>\u003c/label>\u003c/div>"}},"goals":["I can write the first-principles definition of `f′(x)` and explain what each part means.","I can write and expand `f(x + h)` correctly.","I can simplify the difference quotient by factoring out `h` before letting `h → 0`.","I can use first principles for rational and radical functions, using common denominators or conjugates.","I can use `f′(a)` to find the slope and the equation of a tangent line.","I can identify where a function is not differentiable, and state the power-rule pattern."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Expanding","goal":2,"prompt":"Expand `(x + h)^2`.","options":[{"t":"`x^2 + xh + h^2`","why":"That has one middle term. There are two `xh` terms.","_n":"0511","_k":"52b09f56"},{"t":"`x^2 + h^2`","why":"That squares each term. Try `x = h = 1`: 4 ≠ 2.","_n":"1541","_k":"4664b84e"},{"t":"`x^2 + 2xh + h^2`","why":"`(x + h)(x + h)`.","_n":"2531","_k":"443a15dd"},{"t":"`x^2 + 2h`","why":"That doubles `h`. Multiply it out.","_n":"34e1","_k":"99862d12"}],"hints":["Write it as `(x + h)(x + h)`.","Four products: `x^2`, `xh`, `hx`, `h^2`.","`x^2 + 2xh + h^2`."]},{"id":"w2","skill":"Expanding","goal":2,"prompt":"Expand `(x + h)^3`.","options":[{"t":"`x^3 + 3xh + h^3`","why":"That misses the powers. The middle terms are `3x^2h` and `3xh^2`.","_n":"44d1","_k":"37005e20"},{"t":"`x^3 + h^3`","why":"That cubes each term. Try `x = h = 1`: 8 ≠ 2.","_n":"5501","_k":"96d6c836"},{"t":"`x^3 + 3x^2h + 3xh^2 + h^3`","why":"Pascal’s row 1 3 3 1.","_n":"64f1","_k":"d07f39a3"},{"t":"`x^3 + 3x^2h + h^3`","why":"That drops a term. There are four terms.","_n":"74a1","_k":"537ab402"}],"hints":["Multiply `(x + h)^2` by `(x + h)`.","`(x^2 + 2xh + h^2)(x + h)`.","`x^3 + 3x^2h + 3xh^2 + h^3`."]},{"id":"w3","skill":"Function notation","goal":2,"prompt":"`f(x) = x^2 - 3x`. Find `f(x + h)`.","options":[{"t":"`x^2 + 2xh + h^2 - 3x`","why":"That forgets to replace the second `x`. `-3x` becomes `-3(x + h)`.","_n":"8491","_k":"9c55500d"},{"t":"`x^2 + h^2 - 3x`","why":"That squares each term and drops the `-3h`. Replace \u003cstrong>every\u003c/strong> `x` with `(x + h)`, then expand: `(x + h)^2 = x^2 + 2xh + h^2`. The `-3x` becomes `-3(x + h)`.","_n":"9006","_k":"6527ac34"},{"t":"`x^2 + 2xh + h^2 - 3x - 3h`","why":"`(x + h)^2 - 3(x + h)`.","_n":"a016","_k":"5c30d8f6"},{"t":"`x^2 - 3x + h`","why":"That’s `f(x) + h`. Replace each `x`, don’t add `h` at the end.","_n":"b026","_k":"85059cf1"}],"hints":["Replace every `x` with `(x + h)`.","`(x + h)^2 - 3(x + h)`.","Expand both parts."]},{"id":"w4","skill":"Function notation","goal":1,"prompt":"`f(x) = 2x + 5`. Simplify `{f(x + h) - f(x)}/{h}`.","options":[{"t":"`2 + {5}/{h}`","why":"That’s the same slip, split up: the 5 cancels when you subtract `f(x) = 2x + 5`.","_n":"c036","_k":"143f4b79"},{"t":"2","why":"`{2x + 2h + 5 - 2x - 5}/{h} = {2h}/{h}`.","_n":"dfc6","_k":"e1e8d697"},{"t":"`{2h + 5}/{h}`","why":"That forgets to subtract the 5. Bracket `f(x)`: `-(2x + 5) = -2x - 5`.","_n":"efd6","_k":"80343d26"},{"t":"0","why":"That puts `h = 0` in first. Cancel `h` first.","_n":"ffe6","_k":"b208c308"}],"hints":["Find `f(x + h) = 2(x + h) + 5`.","Subtract `2x + 5`: `2h` is left.","`{2h}/{h} = 2`."]},{"id":"w5","skill":"Fractions and radicals","goal":4,"prompt":"Simplify `{1}/{x + 2} - {1}/{x}`.","options":[{"t":"`-{2}/{x(x + 2)}`","why":"`{x - (x + 2)}/{x(x + 2)}`.","_n":"gff6","_k":"e5637b59"},{"t":"`-{2}/{x + 2}`","why":"That drops a factor. The common denominator is `x(x + 2)`.","_n":"h086","_k":"d4a92291"},{"t":"`{1}/{2}`","why":"That subtracts the denominators. Fractions need a common denominator.","_n":"i096","_k":"657747e9"},{"t":"`{2}/{x(x + 2)}`","why":"Check the sign: `x - (x + 2) = -2`.","_n":"j926","_k":"f1325632"}],"hints":["Common denominator: `x(x + 2)`.","`{x - (x + 2)}/{x(x + 2)}`.","`-{2}/{x(x + 2)}`."]},{"id":"w6","skill":"Fractions and radicals","goal":4,"prompt":"Rationalize the numerator: `{√{9 + h} - 3}/{h}`.","options":[{"t":"`{√h}/{h}`","why":"That treats `√{9 + h}` as `3 + √h`. Roots don’t split over sums.","_n":"k916","_k":"91c0ca1c"},{"t":"`{1}/{√{9 + h} + 3}`","why":"The numerator becomes `(9 + h) - 9 = h`, which cancels.","_n":"l946","_k":"fa691a39"},{"t":"`{√{9 + h} + 3}/{h}`","why":"That only changes the sign. Multiply top and bottom by the conjugate.","_n":"m936","_k":"73360444"},{"t":"`{1}/{√{9 + h} - 3}`","why":"That uses the wrong conjugate. Multiply by `√{9 + h} + 3`, so the bottom becomes `h(√{9 + h} + 3)`.","_n":"n8e6","_k":"83067f06"}],"hints":["Multiply by `{√{9 + h} + 3}/{√{9 + h} + 3}`.","The top becomes `9 + h - 9 = h`.","Cancel `h`: `{1}/{√{9 + h} + 3}`."]}],"refreshers":{"Expanding":"`(x + h)^2 = x^2 + 2xh + h^2`; `(x + h)^3 = x^3 + 3x^2h + 3xh^2 + h^3`. Never just square or cube each term.","Function notation":"`f(x + h)` means: in the rule for `f`, replace every `x` with `(x + h)`. It’s not `f(x) + h`.","Fractions and radicals":"Subtract fractions over a common denominator. For a difference of square roots, multiply by the conjugate so the roots disappear from the top."}}},"explore":{"heading":"Difference-quotient engine","intro":"Two ways to find a slope. \u003cstrong>Numbers first:\u003c/strong> make `h` tiny and watch the table. \u003cstrong>Simplify first:\u003c/strong> do the algebra, then let `h → 0`. Do they agree?","predictions":[{"id":"p1","prompt":"The engine shows `f(x) = 3x^2 - 5x` in Numbers first, with `a = 2`. Before pressing the `h` chips, what value will the difference quotient approach?","options":[{"t":"2, which is `f(2)`","_n":"o8d6","_k":"14cbc10e"},{"t":"7","_n":"p906","_k":"c61bf111"},{"t":"10, the first row","_n":"q8f6","_k":"7b671dca"},{"t":"0, because the top shrinks to 0","_n":"r8a6","_k":"916148fe"}],"explain":"`f(2) = 2` is the height. The quotients settle on the slope, 7. The top shrinks, but so does the bottom."},{"id":"p2","prompt":"The engine shows `x^2` in Simplify first. What do you get if you put `h = 0` into `{(x + h)^2 - x^2}/{h}` right away?","options":[{"t":"0, so the slope is 0","_n":"s896","_k":"ff7af62b"},{"t":"Undefined, so `x^2` has no derivative","_n":"t0c6","_k":"049a895a"},{"t":"`2x`","_n":"u0d6","_k":"20db842c"},{"t":"0/0, which tells you nothing yet","_n":"v0a6","_k":"2093045d"}],"explain":"0/0 is a signal to simplify, not an answer."},{"id":"p3","prompt":"Will the slope of `y = {1}/{x}` at `x = 1` be positive, negative or zero?","options":[{"t":"Positive","_n":"w0b6","_k":"6796cac0"},{"t":"0","_n":"x106","_k":"a132d59e"},{"t":"Negative","_n":"y116","_k":"ae395ded"},{"t":"It doesn’t exist","_n":"z0e6","_k":"08f74b02"}],"explain":"The curve falls everywhere, so every slope is negative."},{"id":"p4","prompt":"The engine shows `f(x) = |x|` in Numbers first, with `a = 0`. Using `h = 0.1`, 0.01 and then −0.1, −0.01, what will the table show?","options":[{"t":"1 for positive `h`, −1 for negative `h`: no single limit","_n":"100f6","_k":"a5307e31"},{"t":"Values that grow without bound","_n":"11046","_k":"e8284f21"},{"t":"0 for all `h`","_n":"12056","_k":"2355812b"},{"t":"1 for all `h`","_n":"138e6","_k":"57bc225e"}],"explain":"`f` is continuous at 0, but the slopes from the two sides differ, so `f′(0)` doesn’t exist."}],"chalIntro":"Use the engine, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 also uses the workbench under the engine. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Simplify first for `f(x) = x^3`. Reach `f′(x)` in at most 5 moves without using a trap. (Writing `f(x + h)` is free.)","why":"Expand, subtract, factor, cancel, limit: `f′(x) = 3x^2`.","hints":["Start with Write `f(x + h)` and Expand.","After subtracting: `3x^2h + 3xh^2 + h^3`.","Factor out `h`, cancel, let `h → 0`: `3x^2`."]},{"id":"tc2","goal":[4,5],"prompt":"For `f(x) = {1}/{x}` (`x > 0`), set `a` so that the tangent has slope `-{1}/{4}`.","why":"`f′(x) = -{1}/{x^2}`, and `-{1}/{2^2} = -{1}/{4}`.","hints":["Find `f′(x) = -{1}/{x^2}` first (Simplify mode).","`-{1}/{a^2} = -{1}/{4}`.","`a^2 = 4`, and `a > 0`, so `a = 2`."]},{"id":"tc3","goal":[4,5],"stretch":true,"prompt":"For `f(x) = √x`, find the point where the tangent is parallel to `y = x/6 - 1`, then enter the tangent’s equation `y = mx + b`.","why":"`f′(9) = {1}/{2√9} = {1}/{6}`, the point is (9, 3), and the tangent is `y = {x}/{6} + {3}/{2}`.","hints":["First principles with the conjugate gives `f′(x) = {1}/{2√x}`.","Set `{1}/{2√a} = {1}/{6}`: `√a = 3`, `a = 9`, and the point is (9, 3).","`y - 3 = {1}/{6}(x - 9)`, so `y = {x}/{6} + {3}/{2}`."]}],"blocks":[{"title":"What to notice","html":"\u003cp>The algebra and the table always agree when the function is smooth. Simplifying explains \u003cem>why\u003c/em> the table settles, and the same steps produce a formula for every `x` at once.\u003c/p>"}]},"part3":{"slug":"pattern","name":"Pattern hunter","heading":"Pattern hunter","intro":"Two stations. In the first, four derivations from first principles turn into a pattern, and the pattern into a conjecture. In the second, a zoom lens shows where the definition breaks down.","x4":{"_a":"QkMWChIbD20ITVBJUxUBGgg8SEcGGw8CFUMBR18KSA=="},"conj":{"prompt":"Choose the conjecture that fits every row: \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span>`(x^n) =` ?","options":[{"t":"`(n - 1)x^n`","why":"Test it on `x^2`: it gives `x^2`, but first principles gave `2x`.","_n":"148d6","_k":"a5c67ce8"},{"t":"`nx^n`","why":"Test it on `x^2`: it gives `2x^2`, but first principles gave `2x`.","_n":"158c6","_k":"a24366ae"},{"t":"`nx^{n - 1}`","why":"Bring the power down and lower it by 1: `x^2 → 2x`, `x^3 → 3x^2`, `x^4 → 4x^3`, and even `x → 1x^0 = 1`.","_n":"168b6","_k":"11d6b067"},{"t":"`x^{n - 1}`","why":"Test it on `x^2`: it gives `x`, but first principles gave `2x`.","_n":"17926","_k":"e5da11ca"}]},"quickCheck":{"title":"Quick check","summary":"Pattern hunter quick check","items":[{"id":"q1","goal":6,"prompt":"By the pattern, \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span>`(x^5) =` ?","choices":[{"t":"`x^4`","fb":"Bring the 5 down and lower the power by 1.","_n":"18916","_k":"1123caa6"},{"t":"`5x^4`","fb":"Right. Bring the 5 down and lower the power by 1.","_n":"19906","_k":"a6c4a36d"},{"t":"`4x^5`","fb":"Bring the 5 down and lower the power by 1.","_n":"1a8f6","_k":"444acc5b"},{"t":"`5x^5`","fb":"Bring the 5 down and lower the power by 1.","_n":"1b866","_k":"5609b024"}]},{"id":"q2","goal":[2,6],"prompt":"Which term of the expanded `(x + h)^n` survives in the derivative?","choices":[{"t":"The `x^n` term","fb":"`x^n` cancels; terms with `h^2` or more still have an `h` after dividing, so they vanish.","_n":"1c856","_k":"74592d3e"},{"t":"The `h^2` term","fb":"`x^n` cancels; terms with `h^2` or more still have an `h` after dividing, so they vanish.","_n":"1d885","_k":"25b7ec1d"},{"t":"The `nx^{n - 1}h` term","fb":"Right. `x^n` cancels; terms with `h^2` or more still have an `h` after dividing, so they vanish.","_n":"1e895","_k":"3d440de2"},{"t":"The `h^n` term","fb":"`x^n` cancels; terms with `h^2` or more still have an `h` after dividing, so they vanish.","_n":"1f8a5","_k":"482f1fb6"}]},{"id":"q3","goal":6,"prompt":"Why doesn’t `y = ∛x` have a derivative at `x = 0`?","choices":[{"t":"It isn’t continuous","fb":"`∛x` is continuous at 0, and `∛0 = 0`. The slopes blow up.","_n":"1g8b5","_k":"b90ee928"},{"t":"It has a corner","fb":"`∛x` is continuous at 0, and `∛0 = 0`. The slopes blow up.","_n":"1h8c5","_k":"d2573d42"},{"t":"Its tangent is vertical: the quotient grows without bound","fb":"Right. `∛x` is continuous at 0, and `∛0 = 0`. The slopes blow up.","_n":"1i8d5","_k":"34c918d3"},{"t":"`∛0` is undefined","fb":"`∛x` is continuous at 0, and `∛0 = 0`. The slopes blow up.","_n":"1j8e5","_k":"8faf1f0e"}]},{"id":"q4","goal":6,"prompt":"Does the pattern predict the first-principles result for `{1}/{x}`?","choices":[{"t":"No: it predicts `x^{-2}`","fb":"`-1 · x^{-2} = -{1}/{x^2}`, exactly what first principles gave.","_n":"1k8f5","_k":"96bd6460"},{"t":"Yes: `x^{-1} → -x^{-2}`","fb":"Right. `-1 · x^{-2} = -{1}/{x^2}`, exactly what first principles gave.","_n":"1l805","_k":"4aa962ca"},{"t":"No: only whole-number powers work","fb":"`-1 · x^{-2} = -{1}/{x^2}`, exactly what first principles gave.","_n":"1m815","_k":"ebcfac25"},{"t":"Yes, but only for `x > 0`","fb":"`-1 · x^{-2} = -{1}/{x^2}`, exactly what first principles gave.","_n":"1nfa6","_k":"ede8a731"}]}]}},"practice":{"activities":[{"id":"order","type":"order","title":"Put the steps in order","summary":"Put the steps in order","goal":[1,3,4],"instruction":"Put the steps of each first-principles derivation in order.","rules":{"lim":"With `h` still in the denominator, `h → 0` gives 0/0.","div":"Subtract `f(x)` first so every term on top has a factor of `h`.","conj":"There’s nothing to cancel until the conjugate clears the roots."},"sequences":[{"id":"s1","goal":[1,3],"prompt":"`f(x) = 2x^2 - x`","start":[2,0,4,1,5,3],"steps":["`f(x + h) = 2x^2 + 4xh + 2h^2 - x - h`","`f(x + h) - f(x) = 4xh + 2h^2 - h`","Divide by `h`: `{4xh + 2h^2 - h}/{h}`","Factor: `{h(4x + 2h - 1)}/{h}`","Cancel (`h ≠ 0`): `4x + 2h - 1`","Let `h → 0`: `f′(x) = 4x - 1`"],"hints":["What has to be written down before you can subtract `f(x)`?","Expand, subtract `f(x)`, then divide by `h`. Factor before you cancel.","The limit is always last: `4x + 2h - 1 → 4x - 1`."]},{"id":"s2","goal":4,"prompt":"`f(x) = {1}/{x - 2}`","start":[1,4,0,3,2],"steps":["`f(x + h) - f(x) = {1}/{x + h - 2} - {1}/{x - 2}`","Common denominator: `{(x - 2) - (x + h - 2)}/{(x + h - 2)(x - 2)}`","Simplify the top: `{-h}/{(x + h - 2)(x - 2)}`","Divide by `h`: `{-1}/{(x + h - 2)(x - 2)}`","Let `h → 0`: `f′(x) = {-1}/{(x - 2)^2}`"],"hints":["Which step needs a common denominator?","The top simplifies to `-h` before you divide by `h`.","The limit is always last."]},{"id":"s3","goal":4,"prompt":"`f(x) = √{x + 1}`","start":[3,1,4,0,2],"steps":["`{√{x + h + 1} - √{x + 1}}/{h}`","Multiply top and bottom by `√{x + h + 1} + √{x + 1}`","Top becomes `(x + h + 1) - (x + 1) = h`","Cancel `h`: `{1}/{√{x + h + 1} + √{x + 1}}`","Let `h → 0`: `f′(x) = {1}/{2√{x + 1}}`"],"hints":["Which step clears the roots from the top?","Multiply by the conjugate before anything can cancel.","Conjugate, simplify the top to `h`, cancel `h`, then let `h → 0`."]}]},{"id":"numbers","type":"custom","title":"First principles by the numbers","summary":"First principles by the numbers","star":true,"goal":[2,3,4,5],"instruction":"Use first principles on each function, then fill in the boxes. F5 to F8 are non-routine.","how":"Type a number in each box (fractions such as 1/6 are fine), then press Check.","general":"Work through it again: write `f(x + h)`, subtract `f(x)`, divide by `h`, then let `h → 0`.","items":[{"id":"f1","goal":3,"label":"F1","prompt":"`f(x) = 5x - 3`: `f′(x)` = ?","form":["`f′(x) =`",{"k":"p"}],"_a":"QkMUR18MSA==","display":"`f′(x) = 5`","wrong":[{"txt":"5x-3","fb":"The constant cancels when you subtract `f(x)`."},{"p":-3,"fb":"The constant cancels when you subtract `f(x)`."}],"hints":["Find `f(x + h) = 5(x + h) - 3`.","Subtract `f(x)`: `5x + 5h - 3 - 5x + 3 = 5h`.","`{5h}/{h} = 5`, so `f′(x) = 5`."]},{"id":"f2","goal":2,"label":"F2","prompt":"`f(x) = x^2 + 4x`: `f′(x) = □x + □`","form":["`f′(x) =`",{"k":"p"},"`x +`",{"k":"q"}],"_a":"QkMUR18LGRRIQ15RGA==","display":"`f′(x) = 2x + 4`","wrong":[{"p":0,"q":4,"fb":"`(x + h)^2` gives `2xh`."}],"hints":["`f(x + h) = (x + h)^2 + 4(x + h)`.","Subtract `f(x)`: `2xh + h^2 + 4h`.","Divide by `h`: `2x + h + 4 → 2x + 4`."]},{"id":"f3","goal":5,"label":"F3","prompt":"`f(x) = 3x^2 - x + 2`: `f′(-1)` = ?","form":["`f′(-1) =`",{"k":"p"}],"_a":"QkMUR18UAks=","display":"`f′(-1) = -7`","wrong":[{"p":6,"fb":"That’s `f(-1)`; you want the slope."},{"p":-5,"fb":"`f′(x) = 6x - 1`."}],"hints":["Find `f′(x)` by first principles first, then substitute `x = -1`.","The difference is `6xh + 3h^2 - h`; divide by `h`: `6x + 3h - 1`.","`f′(x) = 6x - 1`, so `f′(-1) = -6 - 1 = -7`."]},{"id":"f4","goal":2,"label":"F4","prompt":"`f(x) = x^3 - 2x`: `f′(x) = □x^2 + □`","form":["`f′(x) =`",{"k":"p"},"`x^2 +`",{"k":"q"}],"_a":"QkMUR18KGRRIQ15IV0Q=","display":"`f′(x) = 3x^2 - 2`","wrong":[{"p":0,"q":-2,"fb":"Expand `(x + h)^3` fully."}],"hints":["`(x + h)^3 = x^3 + 3x^2h + 3xh^2 + h^3`.","Subtract `f(x)`: `3x^2h + 3xh^2 + h^3 - 2h`.","Divide by `h` and let `h → 0`: `3x^2 - 2`."]},{"id":"f5","goal":4,"star":true,"label":"F5","prompt":"`f(x) = {4}/{x}`: `f′(2)` = ?","form":["`f′(2) =`",{"k":"p"}],"_a":"QkMUR18UBEs=","display":"`f′(2) = -1`","wrong":[{"p":1,"fb":"Sign: `4x - 4(x + h)` is `-4h`."},{"p":-2,"fb":"`-{4}/{x^2}` at 2 is −1."}],"hints":["Common denominator: `{4}/{x + h} - {4}/{x} = {4x - 4(x + h)}/{x(x + h)}`.","The top is `-4h`; divide by `h`: `{-4}/{x(x + h)} → -{4}/{x^2}`.","`f′(2) = -{4}/{4} = -1`."]},{"id":"f6","goal":4,"star":true,"label":"F6","prompt":"`f(x) = √{x + 4}`: `f′(5)` = ?","form":["`f′(5) =`",{"k":"p"}],"_a":"QkMUR18JGwcPV1JTUw8DAA9XUlNTDwMARA==","display":"`f′(5) = {1}/{6}`","wrong":[{"p":0.3333333333333333,"fb":"`{1}/{2√9} = {1}/{6}`."},{"p":3,"fb":"That’s `f(5)`."}],"hints":["Multiply `{√{x + h + 4} - √{x + 4}}/{h}` by the conjugate.","The top becomes `h`; cancel: `{1}/{√{x + h + 4} + √{x + 4}} → {1}/{2√{x + 4}}`.","`f′(5) = {1}/{2√9} = {1}/{6}`."]},{"id":"f7","goal":5,"star":true,"label":"F7","prompt":"`f(x) = x^2 - 6x`: find the point where the tangent is parallel to `y = 2x + 1`, then the tangent `y = mx + b`.","form":["Point (",{"k":"x"},",",{"k":"y"},")","\u003cbr>","Tangent `y =`",{"k":"m"},"`x +`",{"k":"b"}],"_a":"QkMcR18NGRRAQ15IXRUXWxtbVklHWxcMFFBSGA==","display":"(4, −8); `y = 2x - 16`","wrong":[{"y":8,"fb":"`f(4) = 16 - 24 = -8`."},{"b":0,"fb":"Use the point: `-8 = 2(4) + b`."}],"hints":["`f′(x) = 2x - 6` by first principles.","Parallel means slope 2: `2x - 6 = 2`, so `x = 4`.","`f(4) = -8`; `y + 8 = 2(x - 4)`, so `y = 2x - 16`."]},{"id":"f8","goal":4,"star":true,"label":"F8","prompt":"`f(x) = {1}/{x^2}`: `f′(x) = □/x^{□}`","form":["`f′(x) =`",{"k":"p","frac":"top"},{"k":"q","frac":"pow"}],"_a":"QkMUR18UBxobEEZfVkQ=","display":"`f′(x) = -{2}/{x^3}`","wrong":[{"p":-1,"q":4,"fb":"Expand `x^2 - (x + h)^2 = -2xh - h^2`."}],"hints":["Common denominator `x^2(x + h)^2`.","Top: `x^2 - (x + h)^2 = -2xh - h^2`; divide by `h`: `-2x - h`.","Let `h → 0`: `{-2x}/{x^4} = -{2}/{x^3}`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Hiro","how":"","instruction":"Hiro made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find `f′(x)` from first principles for `f(x) = x^2 + 3x`.","steps":["`f(x + h) = x^2 + h^2 + 3x + 3h`.","`f(x + h) - f(x) = h^2 + 3h`.","Divide by `h`: `h + 3`.","Let `h → 0`: `f′(x) = 3`."],"_a":"CQ==","stepFb":["","Step 2 follows step 1. Check step 1.","Step 3 divides correctly.","Step 4 follows; the error is earlier."],"fixes":[{"t":"Step 1 is correct.","why":"Try `x = h = 1`: `(1 + 1)^2 = 4`, but `1^2 + 1^2 = 2`. Replace \u003cstrong>every\u003c/strong> `x` with `(x + h)`, then expand: `(x + h)^2 = x^2 + 2xh + h^2`.","_n":"1of96","_k":"2d54da48"},{"t":"`(x + h)^2 = x^2 + 2xh + h^2`, so the difference is `2xh + h^2 + 3h` and `f′(x) = 2x + 3`.","why":"Replace \u003cstrong>every\u003c/strong> `x` with `(x + h)`, then expand: `(x + h)^2 = x^2 + 2xh + h^2`.","_n":"1pfc6","_k":"007b1462"},{"t":"`f(x + h) = x^2 + 3x + h`.","why":"That’s `f(x) + h`. Replace \u003cstrong>every\u003c/strong> `x` with `(x + h)`, then expand: `(x + h)^2 = x^2 + 2xh + h^2`.","_n":"1qfb6","_k":"e775b901"},{"t":"Step 4 should give `3 + h`.","why":"Step 4 is right to let `h → 0`: `h + 3 → 3`. The real slip is the missing `2xh` in step 1.","_n":"1rfe6","_k":"254f7141"}],"hints":["Is `(x + h)^2` equal to `x^2 + h^2`?","Try `x = h = 1`.","4 ≠ 2: the `2xh` term is missing."]},{"id":"e2","goal":3,"task":"Find `f′(x)` from first principles for `f(x) = 2x^2 - 5x`.","steps":["`f(x + h) = 2x^2 + 4xh + 2h^2 - 5x - 5h`.","`f(x + h) - f(x) = 2x^2 + 4xh + 2h^2 - 5x - 5h - 2x^2 - 5x`.","`= 4xh + 2h^2 - 10x - 5h`.","Divide by `h` and let `h → 0`: `4x - 5 - {10x}/{h}`…"],"_a":"CA==","stepFb":["Step 1 is correct.","","Step 3 collects step 2’s terms correctly.","Step 4 gets stuck because of step 2."],"fixes":[{"t":"Step 1 should be `2x^2 + 2h^2 - 5x - 5h`.","why":"Step 1 is correct: `2(x + h)^2 = 2x^2 + 4xh + 2h^2`. Replace \u003cstrong>every\u003c/strong> `x` with `(x + h)`, then expand: `(x + h)^2 = x^2 + 2xh + h^2`.","_n":"1sfd6","_k":"decb63b5"},{"t":"Divide by `h` before subtracting.","why":"Subtract `f(x)` first so every term on top has a factor of `h`.","_n":"1t006","_k":"fbf9076c"},{"t":"Subtracting `2x^2 - 5x` changes both signs: `-2x^2 + 5x`. The difference is `4xh + 2h^2 - 5h`, so `f′(x) = 4x - 5`.","why":"`-(2x^2 - 5x) = -2x^2 + 5x`. Bracket `f(x)` before subtracting.","_n":"1uff6","_k":"9a0bfcbe"},{"t":"Step 2 is correct.","why":"`-(2x^2 - 5x)` is `-2x^2 + 5x`, not `-2x^2 - 5x`. Bracket `f(x)` before subtracting.","_n":"1v026","_k":"1025515c"}],"hints":["Bracket `f(x)`: `-(2x^2 - 5x)`.","That’s `-2x^2 + 5x`.","Then `-5x + 5x` cancels, leaving `4xh + 2h^2 - 5h`."]},{"id":"e3","goal":3,"task":"Find the slope of `y = x^3` at `x = 1` by simplifying first.","steps":["`{(1 + h)^3 - 1}/{h}`.","`{1 + 3h + 3h^2 + h^3 - 1}/{h} = {3h + 3h^2 + h^3}/{h}`.","`= 3 + 3h^2 + h^3`.","Let `h → 0`: the slope is 3."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","The final number happens to be right, but step 3 isn’t."],"fixes":[{"t":"Step 3 is correct, since the answer 3 is right.","why":"A right answer can come from wrong working; step 3 gives the wrong value for almost every `h`, such as `h = 0.1`.","_n":"1w016","_k":"02453136"},{"t":"Step 2 should be `{1 + h^3 - 1}/{h}`.","why":"That cubes each term. `(1 + h)^3 = 1 + 3h + 3h^2 + h^3`, so step 2 is right.","_n":"1x946","_k":"d299c947"},{"t":"Step 3 should be `3h + 3h^2 + h^3`.","why":"That forgets to divide.","_n":"1y956","_k":"7c4a03d3"},{"t":"Every term loses one factor of `h`: `3 + 3h + h^2`. (Check `h = 0.1`: `{(1.1)^3 - 1}/{0.1} = 3.31`, not 3.031.)","why":"Divide \u003cstrong>every\u003c/strong> term by `h`: `{3h + 3h^2 + h^3}/{h} = 3 + 3h + h^2`.","_n":"1z926","_k":"8d0030dc"}],"hints":["Divide each term of `3h + 3h^2 + h^3` by `h`.","`{3h^2}/{h} = 3h`.","`3 + 3h + h^2 → 3`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the engine: how fast the table settled, or that putting `h = 0` in first gives 0/0?"},{"id":"j2","q":"In your own words, what do the numerator, the denominator and the limit each do in the first-principles definition?"},{"id":"j3","q":"Explain to a friend how to handle `{1}/{x}` or `√x` by first principles: what extra step does each need?"},{"id":"j4","q":"Which step do you still slip on (expanding, the minus sign, or cancelling)? What will you check next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which expression is `f′(x)` from first principles?","options":[{"t":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `[f(x + h) - f(x)]`","why":"Without ÷ `h` this is a change in height, which goes to 0.","_n":"20936","_k":"f18ae039"},{"t":"`{f(x + h) - f(x)}/{h}` with `h = 0`","why":"That’s 0/0. 0/0 is a signal to simplify. Cancel the `h` first; then let `h → 0`.","_n":"21906","_k":"6ec74177"},{"t":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{f(x) + h - f(x)}/{h}`","why":"That uses `f(x) + h` for `f(x + h)`. That’s always 1.","_n":"22916","_k":"12537e15"},{"t":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{f(x + h) - f(x)}/{h}`","why":"The fraction is the secant slope over a run of `h`; the limit turns it into the tangent slope.","_n":"238e6","_k":"4e77c9f4"}]},"b":{"prompt":"Which expression gives the slope of the tangent to `y = f(x)` at `x = 3`?","options":[{"t":"`{f(3)}/{3}`","why":"That’s not a slope.","_n":"248f6","_k":"f4b7291b"},{"t":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{f(3 + h) - f(3)}/{h}`","why":"The secant slope from `x = 3` to `x = 3 + h`, as `h → 0`.","_n":"258c6","_k":"013655e4"},{"t":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{f(3 + h) - f(3)}/{3}`","why":"Divide by the run, `h`.","_n":"268d6","_k":"adc9c0bb"},{"t":"`{f(3 + h) - f(3)}/{h}` with `h = 0`","why":"That’s 0/0. 0/0 is a signal to simplify. Cancel the `h` first; then let `h → 0`.","_n":"27165","_k":"b726daee"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`f(x) = 2x^2 + x`. Simplify `f(x + h) - f(x)`.","options":[{"t":"`2h^2 + h`","why":"That squares each term. Replace \u003cstrong>every\u003c/strong> `x` with `(x + h)`, then expand: `(x + h)^2 = x^2 + 2xh + h^2`.","_n":"28155","_k":"48e9c0a2"},{"t":"`2xh + 2h^2 + h`","why":"`2(x + h)^2 = 2x^2 + 4xh + 2h^2`.","_n":"29145","_k":"0c41cbb6"},{"t":"`4xh + 2h^2 + h`","why":"`2(x + h)^2 + (x + h) - 2x^2 - x = 4xh + 2h^2 + h`.","_n":"2a135","_k":"1bdac43e"},{"t":"`4xh + 2h^2`","why":"The `x` term gives `+h` too.","_n":"2b125","_k":"5a95e9bf"}]},"b":{"prompt":"`f(x) = 3x^2 - 2x`. Simplify `f(x + h) - f(x)`.","options":[{"t":"`6xh + 3h^2 - 2h`","why":"`3(x + h)^2 - 2(x + h) - 3x^2 + 2x = 6xh + 3h^2 - 2h`.","_n":"2c115","_k":"0444410a"},{"t":"`3h^2 - 2h`","why":"That squares each term. Replace every `x` with `(x + h)`, then expand: `3(x + h)^2 = 3x^2 + 6xh + 3h^2`.","_n":"2d105","_k":"91f02a87"},{"t":"`6xh + 3h^2`","why":"The `-2x` term gives `-2h` too.","_n":"2e0f5","_k":"8ede069b"},{"t":"`3xh + 3h^2 - 2h`","why":"`3(x + h)^2 = 3x^2 + 6xh + 3h^2`.","_n":"2f0e5","_k":"84a93c43"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"At which `x` is `f(x) = |x + 1|` not differentiable?","options":[{"t":"`x = 1`","why":"`|x + 1| = 0` when `x = -1`.","_n":"2g0d5","_k":"166e7e4b"},{"t":"It’s differentiable everywhere, because it’s continuous.","why":"A corner is continuous, but the slopes from the left and right disagree, so there’s no derivative.","_n":"2h905","_k":"21e66b13"},{"t":"`x = -1`","why":"The corner: slopes −1 on the left, 1 on the right.","_n":"2i915","_k":"370a3fac"},{"t":"`x = 0`","why":"There’s nothing special at 0.","_n":"2j925","_k":"71b1dc8f"}]},"b":{"prompt":"At which `x` is `f(x) = |2x - 6|` not differentiable?","options":[{"t":"`x = 3`","why":"The corner is where `2x - 6 = 0`: slopes −2 on the left, 2 on the right.","_n":"2k935","_k":"3bd6b448"},{"t":"`x = -3`","why":"Check the sign: `2x - 6 = 0` when `x = 3`.","_n":"2l8c5","_k":"063d4697"},{"t":"`x = 6`","why":"`|2x - 6| = 0` when `x = 3`, not 6.","_n":"2m8d5","_k":"6f1a96dd"},{"t":"It’s differentiable everywhere, because it’s continuous.","why":"A corner is continuous, but the slopes from the left and right disagree, so there’s no derivative.","_n":"2n8e5","_k":"ed667ce3"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Use first principles: `f(x) = x^2 - 4x + 1`. What is `f′(x)`?","options":[{"t":"`2x - 4`","why":"Difference `2xh + h^2 - 4h`; ÷ `h`: `2x + h - 4 → 2x - 4`.","_n":"2o8f5","_k":"d10ee26a"},{"t":"0","why":"Substituting `h = 0` first gives 0/0, not 0.","_n":"2p885","_k":"c3ad57d0"},{"t":"`2x + h - 4`","why":"That’s the quotient before the limit.","_n":"2q895","_k":"c895d358"},{"t":"−4","why":"`(x + h)^2 ≠ x^2 + h^2`.","_n":"2rff4","_k":"b8660b19"}]},"b":{"prompt":"Use first principles: `f(x) = x^2 + 6x - 2`. What is `f′(x)`?","options":[{"t":"6","why":"`(x + h)^2 ≠ x^2 + h^2`: the `2xh` term gives the `2x`.","_n":"2s004","_k":"29a68fc0"},{"t":"`2x + 6`","why":"Difference `2xh + h^2 + 6h`; ÷ `h`: `2x + h + 6 → 2x + 6`.","_n":"2t014","_k":"4e3a54b9"},{"t":"`2x + h + 6`","why":"That’s the quotient before the limit: let `h → 0`.","_n":"2u024","_k":"5f59c644"},{"t":"0","why":"Substituting `h = 0` first gives 0/0, not 0.","_n":"2vfb4","_k":"bc2be3c9"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"First principles for `f(x) = {1}/{x + 1}`. Which is the correctly simplified difference quotient, just before the limit?","options":[{"t":"`{-1}/{(x + h + 1)(x + 1)}`","why":"Top: `(x + 1) - (x + h + 1) = -h`; then ÷ `h`.","_n":"2wfc4","_k":"e1e7faaa"},{"t":"`{1}/{(x + h + 1)(x + 1)}`","why":"Sign: the top is `-h`.","_n":"2xfd4","_k":"c40f61b1"},{"t":"`{1}/{h}`","why":"Use a common denominator: `{(x + 1) - (x + h + 1)}/{(x + h + 1)(x + 1)}`.","_n":"2yfe4","_k":"6d3599cd"},{"t":"`{-h}/{(x + h + 1)(x + 1)}`","why":"You still need to divide by `h`.","_n":"2zf74","_k":"cf3999c0"}]},"b":{"prompt":"First principles for `f(x) = {2}/{x}`. Which is the correctly simplified difference quotient, just before the limit?","options":[{"t":"`{-2h}/{x(x + h)}`","why":"You still need to divide by `h`.","_n":"30f84","_k":"665afde2"},{"t":"`{-2}/{x(x + h)}`","why":"Top: `2x - 2(x + h) = -2h`; then ÷ `h`.","_n":"31054","_k":"82764f4f"},{"t":"`{2}/{x(x + h)}`","why":"Sign: the top is `-2h`.","_n":"32044","_k":"6f1b9b1e"},{"t":"`{2}/{h}`","why":"Use a common denominator: `{2x - 2(x + h)}/{x(x + h)}`.","_n":"33034","_k":"7b428958"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"`f(x) = x^2 + 2x`. Using `f′(x)` from first principles, find the tangent at `x = 1`.","options":[{"t":"`y = 3x`","why":"That uses `f(1) = 3` as the slope, but 3 is the height, not the slope.","_n":"34024","_k":"5aef512e"},{"t":"`y = 2x + 1`","why":"That uses `f′ = 2` from `(x + h)^2 = x^2 + h^2`.","_n":"35014","_k":"b8b5fbdc"},{"t":"`y = 4x - 1`","why":"`f′(x) = 2x + 2`, so the slope is 4; `f(1) = 3`; `y - 3 = 4(x - 1)`.","_n":"36004","_k":"4d16bc71"},{"t":"`y = 4x + 3`","why":"3 is the `y`-coordinate of the point, not the intercept.","_n":"37ff4","_k":"743075ef"}]},"b":{"prompt":"`f(x) = x^2 - 3x`. Find the tangent at `x = 2`.","options":[{"t":"`y = x - 4`","why":"`f′(2) = 1`; `f(2) = -2`.","_n":"38fe4","_k":"54946b5c"},{"t":"`y = x - 2`","why":"The point is (2, −2): `-2 = 1(2) + b` gives `b = -4`.","_n":"39fd4","_k":"ef33d203"},{"t":"`y = -3x + 4`","why":"That uses `f′ = -3` from `(x + h)^2 = x^2 + h^2`.","_n":"3afc4","_k":"501b4acc"},{"t":"`y = -2x + 2`","why":"That uses `f(2) = -2` as the slope. `f(a)` is the height; `f′(a)` is the slope. The tangent uses both.","_n":"3b6b4","_k":"b812200a"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"A student writes: “For `f(x) = x^2` at `x = 2`, `{f(2 + h) - f(2)}/{h}` is 0/0 at `h = 0`, so `f` has no slope at `x = 2`.” Which response is best?","options":[{"t":"“Use `h = 1` instead: the slope is 5.”","why":"That’s a secant slope.","_n":"3c6c4","_k":"9a9ccd06"},{"t":"“Correct: 0/0 is undefined, so there’s no slope.”","why":"0/0 is a signal to simplify, not an answer. The slope is 4.","_n":"3d694","_k":"6d204d27"},{"t":"“0/0 only means simplify first: `{4 + 4h + h^2 - 4}/{h} = 4 + h` for `h ≠ 0`, which approaches 4.”","why":"0/0 is a signal to simplify. Cancel the `h` first; then let `h → 0`.","_n":"3e6a4","_k":"733e8585"},{"t":"“The slope is 0, because the top is 0.”","why":"The bottom is 0 too. Simplify first: the slope is 4.","_n":"3f6f4","_k":"e89217b2"}]},"b":{"prompt":"A student writes: “For `f(x) = x^3` at `x = 1`, `{f(1 + h) - f(1)}/{h}` gives 0/0, so the derivative doesn’t exist.” Which response is best?","options":[{"t":"“The derivative is 0, because the top is 0.”","why":"The bottom is 0 too. Simplify first: the derivative is 3.","_n":"3g704","_k":"24585cde"},{"t":"“0/0 means simplify first: `{3h + 3h^2 + h^3}/{h} = 3 + 3h + h^2`, which approaches 3.”","why":"0/0 is a signal to simplify. Cancel the `h` first; then let `h → 0`.","_n":"3h6d4","_k":"2eac0a49"},{"t":"“Use `h = 1` instead: the slope is 7.”","why":"That’s a secant slope over a run of 1, not the tangent slope.","_n":"3i6e4","_k":"455934da"},{"t":"“Correct: 0/0 is undefined.”","why":"0/0 is a signal to simplify, not an answer. The derivative is 3.","_n":"3j734","_k":"32eddb08"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which statement about `f(x) = |x - 2|` at `x = 2` is true?","options":[{"t":"“It’s differentiable, because it’s continuous.”","why":"A corner is continuous, but the slopes from the left and right disagree, so there’s no derivative.","_n":"3k744","_k":"3019b43e"},{"t":"“It isn’t continuous, so it isn’t differentiable.”","why":"It is continuous: no break.","_n":"3l714","_k":"67d47f08"},{"t":"“`f′(2) = 0`, because it’s a minimum.”","why":"Only smooth minimums have horizontal tangents.","_n":"3m704","_k":"584a2250"},{"t":"“It’s continuous but not differentiable: the difference quotient approaches −1 from the left and 1 from the right.”","why":"A corner is continuous, but the slopes from the left and right disagree, so there’s no derivative.","_n":"3n734","_k":"ac8721d7"}]},"b":{"prompt":"Which statement about `f(x) = ∛x` at `x = 0` is true?","options":[{"t":"“It’s differentiable, because it’s continuous.”","why":"Continuous isn’t enough: at a vertical tangent the difference quotient grows without bound, so there’s no derivative.","_n":"3o724","_k":"320c43ec"},{"t":"“It isn’t continuous at 0.”","why":"It is continuous: `∛x` has no break, and `∛0 = 0`.","_n":"3p6d4","_k":"8ff4348e"},{"t":"“It’s continuous but not differentiable: the tangent is vertical, so the difference quotient grows without bound.”","why":"`{∛h}/{h}` grows without bound as `h → 0`: the slopes blow up.","_n":"3q6c4","_k":"77755fdf"},{"t":"“`f′(0) = 0`, because `∛0 = 0`.”","why":"`∛0 = 0` is the height, not the slope. `f(a)` is the height; `f′(a)` is the slope. The tangent uses both.","_n":"3r6f4","_k":"5a563f9e"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A stone dropped from a bridge has fallen `d(t) = 5t^2` metres after `t` seconds. Use first principles to find its velocity at `t` = 3 s.","options":[{"t":"45 m/s","why":"45 m is the distance fallen, `d(3)`.","_n":"3s6e4","_k":"cec013b8"},{"t":"15 m/s","why":"That’s the average velocity over the first 3 s.","_n":"3t794","_k":"6981ee18"},{"t":"10 m/s","why":"Evaluate `d′(t) = 10t` at `t = 3`.","_n":"3u784","_k":"b01e0150"},{"t":"30 m/s","why":"`d′(t) = 10t`, and `10(3) = 30`.","_n":"3v673","_k":"fab7dc9d"}]},"b":{"prompt":"A cyclist has travelled `s(t) = t^2 + 4t` metres after `t` seconds. Velocity at `t` = 5 s?","options":[{"t":"9 m/s","why":"That’s the average velocity over the first 5 s.","_n":"3w683","_k":"ea6a399c"},{"t":"45 m/s","why":"45 m is the distance travelled, `s(5)`. The velocity is `s′(5)`.","_n":"3x693","_k":"6dfb83f2"},{"t":"4 m/s","why":"That drops the `2t`: `(t + h)^2 = t^2 + 2th + h^2`, not `t^2 + h^2`.","_n":"3y6a3","_k":"ec6ebad7"},{"t":"14 m/s","why":"`s′(t) = 2t + 4`, and `2(5) + 4 = 14`.","_n":"3z6b3","_k":"805c2e10"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"The cost per item of a batch is `C(n) = {60}/{n}` dollars when `n` items are made. Using first principles, how fast is `C` changing when `n = 10`?","options":[{"t":"6 dollars per item","why":"That’s `C(10)`.","_n":"406c3","_k":"d8973705"},{"t":"−6 dollars per item","why":"That’s `-{60}/{n}`; the derivative has `n^2`.","_n":"416d3","_k":"ec5f9173"},{"t":"0.6 dollars per item","why":"The cost per item is falling: negative.","_n":"426e3","_k":"b3ab7a01"},{"t":"−0.6 dollars per item","why":"`C′(n) = -{60}/{n^2}`; at 10: `-{60}/{100}`.","_n":"436f3","_k":"73ea1560"}]},"b":{"prompt":"A light’s intensity is `I(d) = {100}/{d}` units at distance `d` m. Using first principles, how fast is `I` changing at `d = 5`?","options":[{"t":"20 units per metre","why":"That’s `I(5)`, the intensity itself, not its rate of change.","_n":"44703","_k":"3667c591"},{"t":"−20 units per metre","why":"That’s `-{100}/{d}`; the derivative has `d^2`.","_n":"456d3","_k":"2255f0f7"},{"t":"4 units per metre","why":"The intensity is falling as you move away: negative.","_n":"466c3","_k":"da07ebdf"},{"t":"−4 units per metre","why":"`I′(d) = -{100}/{d^2}`; at 5: `-{100}/{25} = -4`.","_n":"476b3","_k":"771be6f8"}]}}]},"task":{"title":"Hilltop at `x = 2`","summary":"Hilltop at x = 2","statement":"\u003cp>Design a quadratic `f(x) = ax^2 + bx + c` that meets every condition. By first principles, `f′(x) = 2ax + b`. Find all the answers.\u003c/p>\u003col class=\"fp-conds\">\u003cli>The tangent at `x = 2` is horizontal.\u003c/li>\u003cli>The tangent at `x = 0` has a positive slope.\u003c/li>\u003cli>The point where the tangent is horizontal lies above the `x`-axis.\u003c/li>\u003cli>The `y`-in
