.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 48: hero equation, Point and direction (Explore), Same line or not? stations, missing-piece boxes, task */
.ln-m{color:var(--pen)}
.ln-heq{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.ln-hpar{font-size:.62em;color:var(--ink-2)}
.ln-nw{white-space:nowrap}
.ln-hcap{display:inline-block;font-size:1.1rem}

.ln-ex{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.ln-main,.ln-side{min-width:0}
.ln-eq{min-height:1.6em;font-size:1.2rem;display:flex;flex-wrap:wrap;gap:4px 18px}
.ln-eq2{color:var(--f3)}
.ln-tsl{margin-top:8px}
.ln-tsl output{color:var(--ink)}
.ln-trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:6px}
.ln-chk{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;cursor:pointer}
.ln-chk[hidden]{display:none}
.ln-chk input{width:18px;height:18px;accent-color:var(--ink)}
.ln-how{margin:6px 0 10px}
.ln-read{margin-top:10px}
.ln-read .m{white-space:normal}
.ln-more{display:none;margin-top:6px}
.ln-note{margin:10px 0 0;font-weight:600;color:var(--ink)}

.ln-st h3{margin-top:0}
.ln-st:first-child{margin-top:0;padding-top:0;border-top:0}
.ln-stg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.ln-stl,.ln-str{min-width:0}
.ln-eqs{font-size:1.08rem;line-height:1.9;margin:0 0 10px}
.ln-sw{display:inline-block;width:24px;height:0;vertical-align:middle;margin-right:8px;border-top:3px solid var(--ink)}
.ln-sw2{border-top:3px dashed var(--f3)}
.ln-rg{margin:4px 0 8px}
.ln-vfb:empty{display:none}
.ln-alg{margin-top:12px}
.ln-alg[hidden],.ln-lock[hidden],.ln-bn[hidden]{display:none}
.ln-alg h4{margin:0 0 8px}
.ln-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-height:2.6em}
.ln-steps li{display:flex;gap:10px;align-items:baseline;border:1.5px solid var(--rule);border-radius:6px;padding:.45em .75em;background:var(--sheet)}
.ln-steps li.cur{border-color:var(--ink);background:var(--hi-soft)}
.ln-steps .sn{font-weight:700;color:var(--ink-2)}
.ln-steps .m{white-space:normal}
.ln-pl{margin-top:8px}
.ln-bn{margin-top:10px}

.ln-bxs{display:flex;flex-wrap:wrap;gap:10px 22px;margin:6px 0 4px}
.ln-bxs label{display:flex;align-items:center;gap:8px;font:400 1.1rem var(--font-math)}
.ln-ptin{display:inline-flex;align-items:center;gap:4px;font-size:1.15rem;margin:6px 0 4px}
.ln-ptin .numin.short,.ln-bxs .numin.short{width:4.8rem}

.lq-step{display:flex;align-items:center;gap:8px;margin:8px 0 0;flex-wrap:wrap}
.lq-step label{min-width:7rem}
.lq-lab{font-size:1.2rem}
.lq-step .btn{min-width:40px;font-size:1.1rem}
.lq-step .numin.short{width:5.5rem}

@media (max-width:820px){
  .ln-ex,.ln-stg{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .ln-read:not(.ln-all) .ln-x2{display:none}
  .ln-more{display:inline-flex}
  .ln-eq{font-size:1.05rem}
  .lq-step label{flex-basis:100%;min-width:0}
}

le keeps the ratio −4 : 6.","_n":"52ea","_k":"b4975ea6"},{"t":"(4, −6)","why":"(4, −6) isn’t a multiple of (6, −4).","_n":"62da","_k":"92d5ccb4"},{"t":"(−3, 2)","why":"(−3, 2) = `-{1}/{2}`(6, −4).","_n":"728a","_k":"0f67f01e"}],"hints":["Parallel vectors are multiples of each other.","Divide (6, −4) by −2.","(−3, 2)."]},{"id":"w3","skill":"Slope and lines","goal":6,"prompt":"Slope of the line through (1, 2) and (4, −4)?","options":[{"t":"−6","why":"Divide by 3.","_n":"827a","_k":"f63768a5"},{"t":"−2","why":"(−4 − 2)/(4 − 1) = −6/3.","_n":"9bbb","_k":"510d51bf"},{"t":"−1/2","why":"Slope is rise ÷ run. Slope = rise ÷ run = `m_2/m_1`. Slope 2 means (1, 2): one right, two up.","_n":"abcb","_k":"a678c779"},{"t":"2","why":"`y` falls as `x` rises.","_n":"bbdb","_k":"eec88901"}],"hints":["Rise ÷ run.","Rise −6, run 3.","−2."]},{"id":"w4","skill":"Slope and lines","goal":6,"prompt":"Which point is on `y = 3x - 5`?","options":[{"t":"(0, 5)","why":"The `y`-intercept is −5.","_n":"cbeb","_k":"709ba7c5"},{"t":"(3, −5)","why":"3(3) − 5 = 4.","_n":"db7b","_k":"062382e0"},{"t":"(1, 2)","why":"3(1) − 5 = −2.","_n":"eb8b","_k":"0d98afe2"},{"t":"(2, 1)","why":"3(2) − 5 = 1.","_n":"fb9b","_k":"1b782967"}],"hints":["Substitute `x` and check `y`.","Try `x = 2`.","(2, 1)."]},{"id":"w5","skill":"Linear systems","goal":5,"prompt":"Solve `x + y = 5` and `x - y = 1`.","options":[{"t":"(2, 3)","why":"Check `x - y = 1`: 2 − 3 = −1.","_n":"gbab","_k":"f24b60dd"},{"t":"(4, 1)","why":"Check `x - y = 1`: 4 − 1 = 3.","_n":"hc3b","_k":"9f66c973"},{"t":"(6, −1)","why":"Adding gives `2x = 6`, so `x = 3`, not 6.","_n":"ic4b","_k":"307320d5"},{"t":"(3, 2)","why":"Add: `2x = 6`.","_n":"jcdc","_k":"ffc4f03e"}],"hints":["Add the equations.","`2x = 6`.","`x = 3`, `y = 2`."]},{"id":"w6","skill":"Linear systems","goal":5,"prompt":"How many solutions does the system `y = 2x + 1`, `y = 2x - 3` have?","options":[{"t":"Two","why":"Two lines meet at most once unless they coincide.","_n":"kccc","_k":"ba5f16db"},{"t":"None","why":"Same slope, different intercepts: parallel lines.","_n":"lcfc","_k":"dbd1677e"},{"t":"Infinitely many","why":"That needs the same line: the intercepts differ.","_n":"mcec","_k":"1b6b402f"},{"t":"One","why":"Lines with equal slopes don’t cross unless they coincide.","_n":"nc9c","_k":"1f6c2168"}],"hints":["Compare slopes and intercepts.","Slopes equal, intercepts 1 and −3.","Parallel: no solution."]}],"refreshers":{"Vectors from points":"`vec{AB}` = B − A (head minus tail). Parallel vectors are scalar multiples: (−3, 2) ∥ (6, −4).","Slope and lines":"Slope = rise ÷ run. A point is on `y = mx + b` if its coordinates make the equation true.","Linear systems":"Two lines in the plane meet once (different slopes), never (parallel), or everywhere (the same line)."}}},"explore":{"heading":"Point and direction","intro":"Drag the point and the direction arrow. Slide `t` to move along the line. Then try to describe the same line a different way.","modes":[{"id":"build","t":"Build"},{"id":"two","t":"Two descriptions"},{"id":"seg","t":"Segment"}],"modeHow":{"build":"Drag the point `vec{r}_0` (whole numbers from −6 to 6) and the tip of the blue arrow `vec{m}` (components from −4 to 4). Tab to a handle and use the arrow keys to move it one grid step.","two":"L₁ is ink with a blue arrow. The second description, L₂: `vec{r}` = `vec{r}_0′ + s vec{m}′`, is teal with dashes. Drag either point or arrow tip; the verdict says how the lines are related.","seg":"Drag A and B. The direction is set to `vec{m}` = B − A, and `t` runs only from 0 to 1: the highlighted segment AB. `t = 1/2` marks the midpoint."},"rows":{"vec":"Vector equation","par":"Parametric","pt":"Current point","slope":"Slope","ymxb":"`y = mx + b` form","second":"Second description","verdict":"Verdict","mid":"Midpoint"},"vertical":"undefined (vertical line)","verdict":{"same":"Directions parallel; {p} is on the first line at {t}: \u003cstrong>same line\u003c/strong>","par":"Directions parallel; {p} is not on the first line: \u003cstrong>parallel, distinct\u003c/strong>","cross":"Directions not parallel: \u003cstrong>cross at {p}\u003c/strong> ({ts})"},"stepsLabel":"Show the steps","playLabel":"Play","note":"`t` can be any real number. Scaling `vec{m}` or moving `vec{r}_0` along the line changes the equation, not the line.","predIntro":"Make a prediction first. Then the board shows you what really happens.","predictions":[{"id":"p1","prompt":"Build, `vec{r}` = (1, 2) + `t`(3, −1). Where is the point when `t = -2`?","options":[{"t":"there is no point for negative `t`","_n":"oc8c","_k":"704e8730"},{"t":"(−5, 4)","_n":"pcbc","_k":"33c7363e"},{"t":"(−6, 2)","_n":"qcac","_k":"415324af"},{"t":"(7, 0)","_n":"rc5c","_k":"4dedf018"}],"explain":"(1, 2) − 2(3, −1) = (1 − 6, 2 + 2). (7, 0) uses `t = +2`, and (−6, 2) forgets to add the starting point. Negative `t` goes backwards. All real `t` give the whole line. `0 \u003c= t \u003c= 1` gives only the segment from A to B."},{"id":"p2","prompt":"Change `vec{m}` from (3, −1) to (6, −2). What happens to the line?","options":[{"t":"nothing; it’s the same line","_n":"sc4c","_k":"97366d43"},{"t":"it gets twice as steep","_n":"tc7b","_k":"02eacf23"},{"t":"it rotates","_n":"uc8b","_k":"fd6d0d3d"},{"t":"it shifts up","_n":"vc5b","_k":"2788d507"}],"explain":"(6, −2) is parallel to (3, −1): same direction, longer steps. Any point on the line and any non-zero multiple of the direction give the same line."},{"id":"p3","prompt":"Move `vec{r}_0` from (1, 2) to (4, 1), keeping `vec{m}` = (3, −1). Is it the same line?","options":[{"t":"no, a crossing line","_n":"wc6b","_k":"72b5cc4d"},{"t":"no line at all","_n":"xcbb","_k":"bdbc98e6"},{"t":"no, a parallel line","_n":"yccb","_k":"9e40e756"},{"t":"yes","_n":"zc9b","_k":"865c7454"}],"explain":"(4, 1) = (1, 2) + 1(3, −1) is already on the line. Any point on the line and any non-zero multiple of the direction give the same line."},{"id":"p4","prompt":"Is (10, 0) on `vec{r}` = (1, 2) + `t`(3, −1)?","options":[{"t":"yes, at `t = 3`","_n":"10cab","_k":"fe503090"},{"t":"yes, at `t = 2`","_n":"11bfb","_k":"d46b8565"},{"t":"yes, because both equations can be solved","_n":"12c0b","_k":"88cb8e2b"},{"t":"no: `x` needs `t = 3` but `y` needs `t = 2`","_n":"1349b","_k":"92469055"}],"explain":"One point, one `t`. At `t = 3` the dot lands at (10, −1), just below (10, 0). One point needs one `t`. If `x` needs `t = 3` and `y` needs `t = 2`, the point is not on the line."}],"chalIntro":"Use the board to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"Build mode: make the line pass through A(−2, 3) and B(4, −1).","why":"Any direction parallel to B − A = (6, −4), such as (3, −2) or (−3, 2), and any starting point on the line, such as A, B, (1, 1) or (−5, 5).","hints":["Direction = B − A.","(6, −4), or the shorter (3, −2).","`vec{r}` = (−2, 3) + `t`(3, −2)."],"msgs":{"mode":"Switch to Build mode first.","ab":"That’s A + B. The direction from A to B is B − A, not A + B.","swap":"Components swapped: the slope from A to B is −2/3. Slope = rise ÷ run = `m_2/m_1`. Slope 2 means (1, 2): one right, two up.","off":"Parallel to AB, but A isn’t on it.","other":"The direction must be parallel to B − A, and the line must pass through A and B."}},{"id":"tc2","goal":[1,6],"prompt":"Make the line parallel to `y = 2x + 1` through (1, −3), using a direction vector with `x`-component 1.","why":"`vec{m}` = (1, 2) has slope 2; any starting point on `y = 2x - 5`, such as (1, −3), (0, −5), (2, −1) or (3, 1), works.","hints":["Slope 2 means rise 2 for run 1.","`vec{m}` = (1, 2).","`vec{r}` = (1, −3) + `t`(1, 2)."],"msgs":{"mode":"Switch to Build mode first.","swap":"Slope 1/2: run and rise swapped. Slope = rise ÷ run = `m_2/m_1`. Slope 2 means (1, 2): one right, two up.","orig":"That’s the original line, not a parallel one through (1, −3).","xone":"Parallel to `y = 2x + 1`, but use a direction vector with `x`-component 1.","off":"Right direction, but (1, −3) isn’t on your line.","other":"Your line’s slope is {m}. A line parallel to `y = 2x + 1` has slope 2."}},{"id":"tc3","goal":[5],"stretch":true,"prompt":"Two descriptions mode. L₁: `vec{r}` = (2, 1) + `t`(4, −2). Set `vec{r}_0′` and `vec{m}′` so the second description is the \u003cstrong>same line\u003c/strong>, with `vec{r}_0′` ≠ (2, 1) and `vec{m}′` having a \u003cstrong>negative\u003c/strong> `x`-component.","why":"`vec{m}′` = (−2, 1) or (−4, 2), and `vec{r}_0′` any other point of L₁, such as (0, 2), (4, 0), (−2, 3) or (6, −1).","hints":["Same line: parallel direction \u003cstrong>and\u003c/strong> a shared point.","Directions: multiples of (2, −1) with a negative first component. Points: (2, 1) + `t`(4, −2) for other `t`.","`vec{r}` = (0, 2) + `s`(−2, 1) works (it’s `t = -1/2` on L₁)."],"msgs":{"mode":"Switch to Two descriptions mode first.","l1":"Keep L₁ as `vec{r}` = (2, 1) + `t`(4, −2): its point at (2, 1) and its blue arrow at (4, −2).","origin":"Parallel but distinct: (0, 0) needs `t = -1/2` for `x` but `t = 1/2` for `y`. Parallel directions give either the same line or two parallel lines. Test a point to decide.","notpar":"Not parallel: (−4, −2) has slope 1/2, but L₁ has slope −1/2.","pos":"Same line, but `vec{m}′` needs a \u003cstrong>negative\u003c/strong> `x`-component.","same0":"Same line, but start somewhere other than (2, 1).","dist":"Parallel but distinct: {p} isn’t on L₁. Parallel directions give either the same line or two parallel lines. Test a point to decide.","cross":"Not parallel: these lines cross at one point."}}]},"part3":{"slug":"same-line","name":"Same line?","heading":"Same line or not?","intro":"Each station shows two vector equations, drawn on the grid: L₁ in ink, L₂ in teal dashes. Choose a verdict first. Then step through “Check it with algebra” to test it: are the directions multiples? If yes, is L₂’s point on L₁ (one `t` for both coordinates)? If no, solve for `t` and `s`, then substitute to get the point.","verdicts":[{"id":"same","t":"Same line"},{"id":"par","t":"Parallel, distinct"},{"id":"cross","t":"Cross at one point"}],"verdictFb":{"right":"Right. Step through the algebra to confirm it.","sameWhenPar":"Not quite. Parallel directions give either the same line or two parallel lines. Test a point to decide. Step through the algebra to see which.","parWhenSame":"Not quite. Any point on the line and any non-zero multiple of the direction give the same line. Step through the algebra: is L₂’s point on L₁?","crossWhenPar":"Not quite. The directions are multiples, so the lines are parallel or the same: they can’t cross at just one point.","parWhenCross":"Not quite. The directions aren’t multiples, so the lines aren’t parallel: they cross once."},"algTitle":"Check it with algebra","locked":"Choose a verdict first.","stations":[{"id":"st1","title":"Station 1","l1":{"p":[1,1],"d":[2,3]},"l2":{"p":[5,7],"d":[-4,-6]},"_a":"QxEECwcS","steps":["Are the directions multiples? (−4, −6) = −2(2, 3). Yes: parallel.","Is (5, 7) on L₁? `x`: `1 + 2t = 5` gives `t = 2`; `y`: `1 + 3(2) = 7` ✓.","One `t` works for both coordinates, so the lines share a point: \u003cstrong>same line\u003c/strong>."]},{"id":"st2","title":"Station 2","l1":{"p":[0,2],"d":[1,-1]},"l2":{"p":[3,3],"d":[2,-2]},"_a":"QxIEFEA=","steps":["Are the directions multiples? (2, −2) = 2(1, −1). Yes: parallel.","Is (3, 3) on L₁? `x`: `0 + t = 3` needs `t = 3`, but then `y = 2 - 3 = -1`, not 3.","No `t` gives (3, 3), so there’s no shared point: \u003cstrong>parallel, distinct\u003c/strong>."]},{"id":"st3","title":"Station 3","l1":{"p":[1,0],"d":[1,2]},"l2":{"p":[0,7],"d":[1,-1]},"_a":"QwEXCRFDRg==","steps":["Are the directions multiples? (1, 2) and (1, −1) aren’t: the lines cross at exactly one point.","Set the coordinates equal: `1 + t = s` and `2t = 7 - s`.","Substitute: `2t = 7 - (1 + t)`, so `3t = 6`: `t = 2` and `s = 3`.","Substitute `t = 2` into L₁: (1, 0) + 2(1, 2) = \u003cstrong>(3, 4)\u003c/strong>. Check on L₂: (0, 7) + 3(1, −1) = (3, 4) ✓."],"banner":"(2, 3) are the parameter values; (3, 4) is the point. `t = 2`, `s = 2` are parameter values. Substitute to get the point."},{"id":"st4","title":"Station 4: the same two lines as `y = mx + b`","l1":{"p":[1,0],"d":[1,2]},"l2":{"p":[0,7],"d":[1,-1]},"slope":true,"text":"The pair from station 3, written the Grade 10 way.","steps":["L₁: `x = 1 + t`, `y = 2t`. So `t = x - 1` and `y = 2x - 2`.","L₂: `x = s`, `y = 7 - s`. So `y = -x + 7`.","Solve the system: `2x - 2 = -x + 7`, so `3x = 9`: `x = 3` and `y = 4`.","The point (3, 4) again. Two ways to write two lines; one intersection."]}],"quickCheck":{"title":"Quick check","summary":"Same line or not? quick check","items":[{"id":"q1","goal":4,"prompt":"Which point is on `vec{r}` = (2, −1) + `t`(1, 3)?","choices":[{"t":"(2, 3)","fb":"`t = 2`: (2 + 2, −1 + 6). (1, 3) is the direction, not a point. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"1448b","_k":"a8dd44a4"},{"t":"(4, 5)","fb":"Right. `t = 2`: (2 + 2, −1 + 6).","_n":"1547b","_k":"bc6bc1bd"},{"t":"(1, 3)","fb":"`t = 2`: (2 + 2, −1 + 6). (1, 3) is the direction, not a point. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"1646b","_k":"773825c8"},{"t":"(3, 3)","fb":"`t = 2`: (2 + 2, −1 + 6). (1, 3) is the direction, not a point. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"174db","_k":"f1911177"}]},{"id":"q2","goal":5,"prompt":"`vec{r}` = (0, 4) + `t`(2, −1) and `vec{r}` = (6, 1) + `s`(−4, 2)?","choices":[{"t":"Cross at one point","fb":"Parallel directions, and (6, 1) is on the first line at `t = 3`.","_n":"184cb","_k":"e98a43bf"},{"t":"Same line","fb":"Right. Parallel directions, and (6, 1) is on the first line at `t = 3`.","_n":"194bb","_k":"c856b55c"},{"t":"Perpendicular","fb":"Parallel directions, and (6, 1) is on the first line at `t = 3`.","_n":"1a4ab","_k":"1fc921e0"},{"t":"Parallel, distinct","fb":"Parallel directions, and (6, 1) is on the first line at `t = 3`.","_n":"1b41b","_k":"ff007b6f"}]},{"id":"q3","goal":5,"prompt":"`vec{r}` = (1, 1) + `t`(1, −1) and `vec{r}` = `s`(1, 1)?","choices":[{"t":"Same line","fb":"`1 + t = s` and `1 - t = s` give `t = 0`, `s = 1`: the point (1, 1).","_n":"1c40b","_k":"7f13dc87"},{"t":"Cross at (1, 1)","fb":"Right. `1 + t = s` and `1 - t = s` give `t = 0`, `s = 1`: the point (1, 1).","_n":"1dc3b","_k":"5eb3d1c1"},{"t":"Parallel, distinct","fb":"`1 + t = s` and `1 - t = s` give `t = 0`, `s = 1`: the point (1, 1).","_n":"1ec4b","_k":"2bf9dae8"},{"t":"Cross at (0, 0)","fb":"`1 + t = s` and `1 - t = s` give `t = 0`, `s = 1`: the point (1, 1).","_n":"1fc5b","_k":"7f17446e"}]},{"id":"q4","goal":6,"prompt":"A direction vector for `y = -3x + 2`?","choices":[{"t":"(3, 1)","fb":"Run 1, rise −3. (3, 1) has slope 1/3. Slope = rise ÷ run = `m_2/m_1`. Slope 2 means (1, 2): one right, two up.","_n":"1gc6b","_k":"072eae1c"},{"t":"(−3, 1)","fb":"Run 1, rise −3. (−3, 1) has slope −1/3. Slope = rise ÷ run = `m_2/m_1`. Slope 2 means (1, 2): one right, two up.","_n":"1hc7b","_k":"fb23923e"},{"t":"(1, −3)","fb":"Right. Run 1, rise −3.","_n":"1ic8b","_k":"6a6c1c53"},{"t":"(0, 2)","fb":"Run 1, rise −3. (0, 2) is the `y`-intercept, not a direction.","_n":"1jc9b","_k":"8e8bf87e"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Description ↔ vector equation","summary":"Description ↔ vector equation","goal":[1,2,3,6],"instruction":"Match each description to its vector equation. One equation on the right has no partner.","how":"Tap a description, then tap its vector equation on the right.","leftTitle":"Description","rightTitle":"Vector equation","left":[{"id":"l1","goal":1,"t":"Through (2, −1), parallel to (3, 4)","why":"Point (2, −1) added; direction (3, 4) multiplied by `t`."},{"id":"l2","goal":3,"t":"Through (0, 0) and (2, 5)","why":"Start at the origin; direction (2, 5) − (0, 0)."},{"id":"l3","goal":6,"t":"`y = 3x - 2`","why":"`y`-intercept (0, −2); slope 3 gives direction (1, 3)."},{"id":"l4","goal":6,"t":"The vertical line `x = 4`","why":"(4, 0) is on it; vertical means direction (0, 1)."},{"id":"l5","goal":6,"t":"The horizontal line through (1, −3)","why":"Horizontal means direction (1, 0)."},{"id":"l6","goal":3,"t":"Through A(1, 2) and B(−3, 4)","why":"B − A = (−4, 2), which is parallel to (2, −1).","hints":["Direction B − A.","(−4, 2), which is parallel to (2, −1).","`vec{r}` = (1, 2) + `t`(2, −1)."]},{"id":"l7","goal":2,"t":"`x = 3 - t`, `y = 2t`","why":"The constants give the point (3, 0); the coefficients of `t` give the direction (−1, 2)."},{"id":"l8","goal":6,"t":"`y = -{1}/{2}x + 1`","why":"`y`-intercept (0, 1); slope `-{1}/{2}` means run 2, rise −1.","hints":["Slope `-{1}/{2}` means run 2, rise −1.","`y`-intercept 1 gives the point (0, 1).","`vec{r}` = (0, 1) + `t`(2, −1)."]}],"right":[{"id":"r1","t":"`vec{r}` = (2, −1) + `t`(3, 4)"},{"id":"r2","t":"`vec{r}` = `t`(2, 5)"},{"id":"r3","t":"`vec{r}` = (0, −2) + `t`(1, 3)"},{"id":"r4","t":"`vec{r}` = (4, 0) + `t`(0, 1)"},{"id":"r5","t":"`vec{r}` = (1, −3) + `t`(1, 0)"},{"id":"r6","t":"`vec{r}` = (1, 2) + `t`(2, −1)"},{"id":"r7","t":"`vec{r}` = (3, 0) + `t`(−1, 2)"},{"id":"r8","t":"`vec{r}` = (0, 1) + `t`(2, −1)"},{"id":"r9","t":"`vec{r}` = (3, 4) + `t`(2, −1)"}],"_a":"GkAJV0AKRkBQQElEDgJGCEMQV0ROEggBQ1hHFFESSBANVkdcQEJQEE1ACVNACkZAVEBJRA4GRghDEFNEThIIBUNYRxRVEkgQDVpHXEBCXBAc","wrong":{"l6|r8":"Same direction, but is (1, 2) on `y = -{1}/{2}x + 1`? `-{1}/{2} + 1 = {1}/{2} ≠ 2`. Parallel directions give either the same line or two parallel lines. Test a point to decide.","l8|r6":"Same direction, but is (1, 2) on `y = -{1}/{2}x + 1`? `-{1}/{2} + 1 = {1}/{2} ≠ 2`. Parallel directions give either the same line or two parallel lines. Test a point to decide.","l4|r5":"`x = 4` is vertical: direction (0, 1).","l5|r4":"`x = 4` is vertical: direction (0, 1). A horizontal line has direction (1, 0).","l1|r9":"(3, 4) is the direction here, not a point. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction."},"wrongDefault":"Check the point first, then the direction."},{"id":"missing","type":"custom","title":"The missing piece","summary":"The missing piece","star":true,"goal":[2,3,4,5,6],"instruction":"Find the missing number or point. Items 4 to 7 are non-routine; 6 and 7 go beyond the Final Check.","how":"Type whole numbers or fractions, such as 5 or −2/3. A point takes two boxes.","items":[{"id":"n1","goal":4,"prompt":"For which `t` is (−1, 8) on `vec{r}` = (3, 0) + `t`(−2, 4)?","boxes":[{"k":"t","pre":"`t =`","label":"t"}],"_a":"GkARRFgSVhAc","display":"`t = 2`","wrong":[{"v":{"t":"−2"},"fb":"3 − 2(−2) = 7, not −1."}],"why":"`x`: `3 - 2t = -1` gives `t = 2`; `y`: `0 + 4(2) = 8` ✓."},{"id":"n2","goal":4,"prompt":"(`k`, −5) lies on `vec{r}` = (1, 3) + `t`(2, −4). Find `k`.","boxes":[{"k":"k","pre":"`k =`","label":"k"}],"_a":"GkAORFgSURAc","display":"`k = 5`","wrong":[{"v":{"k":"2"},"fb":"That’s `t`. Substitute it: `k = 1 + 2(2)`. `t = 2`, `s = 2` are parameter values. Substitute to get the point."}],"why":"`y`: `3 - 4t = -5` gives `t = 2`, so `k = 1 + 2(2) = 5`."},{"id":"n3","goal":2,"prompt":"Where does `vec{r}` = (2, 6) + `t`(1, −3) cross the `x`-axis? Enter `x`.","boxes":[{"k":"x","pre":"`x =`","label":"x"}],"_a":"GkAdRFgSUBAc","display":"`x = 4`","wrong":[{"v":{"x":"2"},"fb":"That’s `t`; `x = 2 + 2 = 4`."}],"why":"On the `x`-axis, `y = 0`: `6 - 3t = 0` gives `t = 2`, so `x = 2 + 2 = 4`."},{"id":"n4","goal":3,"star":true,"prompt":"Line through (1, 2) and (7, 5). Find the point two-thirds of the way from the first to the second.","point":true,"_a":"GkAdRFgSURBNQBxEWBJQEBw=","display":"(5, 4)","wrong":[{"v":{"x":"3","y":"3"},"fb":"That’s one-third of the way."},{"v":{"x":"11","y":"7"},"fb":"Add `{2}/{3}` of B − A to A, not to B."},{"v":{"x":"8","y":"7"},"fb":"That’s A + B. Add `{2}/{3}` of B − A to A."}],"why":"B − A = (6, 3), so (1, 2) + `{2}/{3}`(6, 3) = (1 + 4, 2 + 2) = (5, 4)."},{"id":"n5","goal":6,"star":true,"prompt":"`vec{r}` = (`a`, 1) + `t`(2, `b`) is the same line as `y = 3x - 5`. Find `a` and `b`.","boxes":[{"k":"a","pre":"`a =`","label":"a"},{"k":"b","pre":"`b =`","label":"b"}],"_a":"GkAERFgSVhBNQAdEWBJSEBw=","display":"`a = 2`, `b = 6`","wrong":[{"v":{"b":"3"},"fb":"(2, `b`) must be parallel to (1, 3): `b = 6`. Slope = rise ÷ run = `m_2/m_1`. Slope 2 means (1, 2): one right, two up."}],"why":"(2, `b`) = 2(1, 3) gives `b = 6`; (`a`, 1) on the line: `1 = 3a - 5`, so `a = 2`.","hints":["Same line: parallel direction and a shared point.","`y = 3x - 5` has direction (1, 3), so (2, `b`) = 2(1, 3).","(`a`, 1) on the line: `1 = 3a - 5`, so `a = 2`."]},{"id":"n6","goal":5,"star":true,"prompt":"Find `k` so that `vec{r}` = (1, 1) + `t`(2, 1) and `vec{r}` = (7, 0) + `s`(`k`, 3) are parallel.","boxes":[{"k":"k","pre":"`k =`","label":"k"}],"_a":"GkAORFgSUhAc","display":"`k = 6`","wrong":[{"v":{"k":"2/3"},"fb":"(`k`, 3) = 3(2, 1) needs `k = 6`."}],"why":"Parallel means (`k`, 3) is a multiple of (2, 1). The `y`-components give the multiple 3, so `k = 3(2) = 6`."},{"id":"n7","goal":5,"star":true,"prompt":"Where do `vec{r}` = (0, 1) + `t`(1, 1) and `vec{r}` = (6, 1) + `s`(−2, 1) meet?","point":true,"_a":"GkAdRFgSVhBNQBxEWBJXEBw=","display":"(2, 3)","wrong":[{"v":{"x":"2","y":"2"},"fb":"`t = s = 2` are parameters; substitute. `t = 2`, `s = 2` are parameter values. Substitute to get the point."}],"why":"`t = 6 - 2s` and `1 + t = 1 + s` give `t = s = 2`, so the point is (0, 1) + 2(1, 1) = (2, 3).","hints":["Set the `x`’s equal and the `y`’s equal.","`t = 6 - 2s` and `1 + t = 1 + s`, so `t = s`.","`s = 6 - 2s` gives `s = 2`, so `t = 2` and the point is (0, 1) + 2(1, 1) = (2, 3)."]}],"msgs":{"wrong":"Write the equations one coordinate at a time, find one `t` that works for both, then substitute.","half":"Your {k} is right; check the other box.","empty":"Fill in every box first.","err":"Type a whole number or a fraction such as 5 or −2/3 in each box."}},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Yara","how":"","goal":[3,4,5],"instruction":"Yara made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find a vector equation of the line through A(2, −1) and B(5, 3).","steps":["A point on the line: A(2, −1).","Direction: `vec{m}` = B − A = (3, 4).","`vec{r}` = (3, 4) + `t`(2, −1).","Check: `t = 1` gives (5, 3) = B. ✓"],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 checks only one point. The mistake is earlier."],"fixes":[{"t":"`vec{r}` = (2, −1) + `t`(3, 4).","why":"The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"1kcab","_k":"cfdc5cb8"},{"t":"Step 3 is correct; step 4 proves it.","why":"Passing through B isn’t enough: `t = 0` gives (3, 4), and the slope from A to (3, 4) is 5, not 4/3. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"1lbbb","_k":"5afaa26c"},{"t":"`vec{r}` = (2, −1) + `t`(5, 3).","why":"(5, 3) is B’s position, not the direction. The direction from A to B is B − A, not A + B.","_n":"1mbcb","_k":"878c6938"},{"t":"`vec{r}` = (3, 4) + `t`(5, 3).","why":"(3, 4) is the direction, so it can’t be the added point, and (5, 3) is B’s position, not a direction. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"1n35b","_k":"ad630556"}],"hints":["Which vector is the point and which is the direction?","The point is added; the direction is multiplied by `t`.","(2, −1) + `t`(3, 4)."]},{"id":"e2","goal":4,"task":"Is P(7, 3) on the line `x = 1 + 3t`, `y = 5 - 2t`?","steps":["`x`: `1 + 3t = 7`, so `t = 2`.","`y`: `5 - 2t = 3`, so `t = 1`.","Each coordinate has a value of `t`, so P is on the line.","P is the point at `t = 1.5`."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 builds on step 3. The mistake is earlier."],"fixes":[{"t":"Average them: `t = 1.5`.","why":"`t = 1.5` gives (5.5, 2).","_n":"1o34b","_k":"877c82be"},{"t":"The `t`-values differ (2 and 1), so no single `t` gives P. P is not on the line.","why":"One point needs one `t`. If `x` needs `t = 3` and `y` needs `t = 2`, the point is not on the line.","_n":"1p37b","_k":"4f78cc59"},{"t":"Step 3 is correct.","why":"One point needs one `t`. If `x` needs `t = 3` and `y` needs `t = 2`, the point is not on the line.","_n":"1q36b","_k":"63b6a796"},{"t":"Use `t = 2`: P is on the line.","why":"`t = 2` gives (7, 1).","_n":"1r39b","_k":"28c4e476"}],"hints":["How many `t`-values does one point have?","One.","2 ≠ 1, so P is not on the line."]},{"id":"e3","goal":5,"task":"Are L₁: `vec{r}` = (1, 4) + `t`(2, −6) and L₂: `vec{r}` = (3, −1) + `s`(−1, 3) the same line?","steps":["(2, −6) = −2(−1, 3), so the directions are parallel.","Parallel directions mean the lines are the same.","So L₁ and L₂ coincide."],"_a":"UA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"The directions aren’t parallel, because −2 is negative.","why":"A negative multiple is still parallel.","_n":"1s38b","_k":"d65de78e"},{"t":"The lines cross at (3, −1).","why":"Parallel lines don’t cross.","_n":"1t3bb","_k":"44836dcb"},{"t":"Step 2 is correct.","why":"Parallel directions give either the same line or two parallel lines. Test a point to decide.","_n":"1u3ab","_k":"a1822249"},{"t":"Parallel directions give the same line \u003cstrong>or\u003c/strong> parallel lines. Test (3, −1) on L₁: `t = 1` gives (3, −2), not (3, −1). They are parallel and distinct.","why":"Parallel directions give either the same line or two parallel lines. Test a point to decide.","_n":"1v3db","_k":"3e34d378"}],"hints":["What else must be true for the same line?","They must share a point.","(3, −1) isn’t on L₁: parallel, distinct."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: that negative `t` works, or that so many different equations draw the same line?"},{"id":"j2","q":"In your own words, what does the parameter `t` do in `vec{r} = vec{r}_0 + t vec{m}`?"},{"id":"j3","q":"Explain to a friend how to decide whether two vector equations describe the same line."},{"id":"j4","q":"Which part (two points, testing a point, or intersections) still feels shaky? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a vector equation of the line through (4, −2) with direction vector (1, 5)?","options":[{"t":"`vec{r}` = (4, −2) + `t`(1, 5)","why":"The point is added; the direction (1, 5) is multiplied by `t`.","_n":"1w3cb","_k":"3c3f51f2"},{"t":"`vec{r}` = (1, 5) + `t`(4, −2)","why":"Point and direction swapped. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"1x4fb","_k":"5760b3ee"},{"t":"`vec{r}` = (4, −2) + `t`(5, 1)","why":"The direction is (1, 5), not (5, 1). Slope = rise ÷ run = `m_2/m_1`. Slope 2 means (1, 2): one right, two up.","_n":"1y50b","_k":"5163b002"},{"t":"`vec{r}` = (4, −2) + (1, 5)","why":"With no `t`, that’s a single point.","_n":"1z4db","_k":"bd67da56"}]},"b":{"prompt":"Which is a vector equation of the line through (−3, 1) with direction vector (2, −7)?","options":[{"t":"`vec{r}` = (−3, 1) + (2, −7)","why":"No parameter: one point.","_n":"204eb","_k":"5e7ca290"},{"t":"`vec{r}` = (2, −7) + `t`(−3, 1)","why":"Point and direction swapped. The vector added on its own is a point \u003cstrong>on\u003c/strong> the line; the one multiplied by `t` is the direction.","_n":"214bb","_k"
