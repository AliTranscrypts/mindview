.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 14: hero ladder colours and panels, V5 ladder panels (Explore), slope speedometer, Part 3 stations, V11 sign chart of f″,
   V8 ladder boxes, task steppers and mini ladder */
.hd-heq{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:.15em .1em;font-size:.78em;line-height:1.35}
.hd-ht{white-space:nowrap}
.hd-ht .m{font-size:1em}
.hd-k0{color:var(--pen)}
.hd-k1{color:var(--f3)}
.hd-k2{color:var(--f4)}
.hd-arr{color:var(--ink-2);margin:0 .12em;font-style:normal}
.hd-hero canvas.plot.hd-h0{aspect-ratio:16/7}
.hd-hero canvas.plot.hd-h1{aspect-ratio:16/5}
.hd-hero canvas + canvas{margin-top:6px}

.hd-ex{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.hd-main,.hd-side{min-width:0}
.hd-eq{min-height:1.6em}
.hd-pan{margin-top:6px}
.hd-pan[hidden],.hd-speed[hidden],.hd-pager[hidden]{display:none}
.hd-pcap{margin:4px 0 2px;font-size:.95rem;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-height:1.6em}
.hd-pcap .m{white-space:nowrap}
.hd-sw{display:inline-block;width:18px;height:4px;border-radius:2px;flex:0 0 auto}
.hd-deg{font:600 .78rem var(--font-ui);color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:0 .55em}
canvas.plot.hd-top{aspect-ratio:16/7}
canvas.plot.hd-low{aspect-ratio:16/4.2}
.hd-pager{display:flex;align-items:center;gap:8px;margin:6px 0 0;flex-wrap:wrap}
.hd-pager .tiny{flex:1 1 100%;order:3}
.hd-speed{display:flex;gap:18px;align-items:center;margin:4px 0 8px}
.hd-dialbox{flex:0 0 auto;width:180px}
.hd-dial{display:block;width:180px;height:auto}
.hd-face{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.hd-tick{stroke:var(--ink-2);stroke-width:1.5}
.hd-tl{fill:var(--ink-2);font:600 11px var(--font-ui);text-anchor:middle;dominant-baseline:middle}
.hd-needle{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.hd-hub{fill:var(--ink)}
.hd-turn{fill:none;stroke:var(--f4);stroke-width:3;stroke-linecap:round}
.hd-turnh{fill:var(--f4)}
.hd-sread{flex:1 1 160px;min-width:0}
.hd-sread .read{margin:0}
.hd-trend{min-height:1.3em;margin:6px 0 0;font-weight:600;color:var(--ink)}
.hd-fns{margin-bottom:6px}
.hd-fns .chip{font-size:.86rem}
.hd-fns .chip .m{font-size:1.05em}
.hd-form{margin:4px 0 2px}
.hd-bsl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;margin:2px 0 4px}
.hd-bsl output{color:var(--ink)}
#hd-rungs,#hd-mode{margin-top:6px}
.hd-how{margin:8px 0 10px}
.hd-sl output{color:var(--ink)}
.hd-skip{min-height:1.2em;margin:0 0 6px;color:var(--ink-2);font-weight:600}

.p3-st h3{margin-top:0}
.p3-st:first-child{margin-top:0;padding-top:0;border-top:0}
canvas.plot.hd-s1f{aspect-ratio:16/7}
canvas.plot.hd-s1d{aspect-ratio:16/8}
.hd-s1{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px 28px;align-items:start}
.hd-s1p,.hd-s1c{min-width:0}
.hd-s1c .how{margin-top:0}
.hd-s1h{margin:16px 0 4px;font-size:1rem}
.hd-s1b[hidden],#hd-iv[hidden]{display:none}
.hd-cards{margin:6px 0 10px}
.hd-cards .chip .m{font-size:1.05em}
.hd-key{margin:6px 0 0}
.hd-c2 .read{margin-top:10px}
#hd-alg{margin-top:12px}
.hd-sc-wrap{overflow-x:auto;position:relative}
table.hd-sct th,table.hd-sct td{padding:5px 8px;text-align:center;white-space:nowrap}
table.hd-sct tbody th{text-align:left;font-weight:600}
table.hd-sct th .m,table.hd-sct td .m{white-space:nowrap}
.hd-sc-k{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.hd-sct .hd-sc-u{font:600 .78rem var(--font-ui);color:var(--ink-2)}
table.hd-sct .hd-sc-ar span[aria-hidden]{font-size:1.25rem;line-height:1;display:block}
.hd-sc-w{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.hd-sct .hd-sc-d td{font-weight:700}

.hd-bxs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 4px}
.hd-bxs label{display:flex;align-items:center;gap:8px;font:400 1.1rem var(--font-math)}

.hd-tstep{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.hd-tstep label{min-width:6.5rem}
.hd-tlab{font-size:1.2rem}
.hd-tstep .btn{min-width:40px;font-size:1.1rem}
.hd-tstep .numin.short{width:5rem}
.hd-tpan canvas.plot.hd-ttop{aspect-ratio:16/8}
.hd-tpan canvas.plot.hd-tlow{aspect-ratio:16/6}
.hd-tpan .plot-wrap + .plot-wrap{margin-top:6px}

@media (max-width:820px){
  .hd-ex,.hd-s1{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  canvas.plot.hd-top{aspect-ratio:auto;height:190px}
  canvas.plot.hd-low{aspect-ratio:auto;height:130px}
  .hd-speed{gap:10px;align-items:flex-start}
  .hd-dialbox,.hd-dial{width:118px}
  .hd-sread .read dd{font-size:.95rem}
  .hd-bsl{grid-template-columns:minmax(0,1fr)}
}

um: it was rising, now it’s falling."},{"id":"p4","fn":"L4","prompt":"Will the ladder for `f(x) = 1/x` ever reach 0?","options":[{"t":"It becomes a constant","_n":"1089e","_k":"e2410def"},{"t":"Yes, after 2 steps","_n":"1188e","_k":"b669c967"},{"t":"No: `-1/x^2`, `2/x^3`, `-6/x^4`, … never become 0","_n":"1287e","_k":"8320f600"},{"t":"Yes, after 1 step","_n":"13fed","_k":"58e1c8d1"}],"explain":"The exponent goes −1, −2, −3, −4, …; it never reaches 0, so no rung is constant."}],"chalIntro":"Use the ladder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"L2 (`f = x^4 - 4x^3`): move the probe to the positive `x` where the slope stops changing for an instant (`f″ = 0`).","why":"`f″ = 12x^2 - 24x = 12x(x - 2)` is 0 at `x = 2`: the slope is momentarily steady there.","hints":["`f′ = 4x^3 - 12x^2`.","`f″ = 12x^2 - 24x = 12x(x - 2)`.","`x = 2`."],"msgs":{"fn":"Choose L2 first.","three":"That’s where the slope is 0 (`f′ = 0`), not where it’s steady.","zero":"`f″(0) = 0` too, but you need `x > 0`.","other":"Here `f″` = {v}, so the slope is still changing."}},{"id":"tc2","goal":[1,3],"prompt":"Build cubic: make `f‴ = 12` and `f″(1) = 0`.","why":"`f‴ = 6a = 12` gives `a = 2`, and `f″(1) = 12 + 2b = 0` gives `b = -6`. Any `c` and `d` work.","hints":["`f″ = 6ax + 2b` and `f‴ = 6a`.","`6a = 12`.","`12 + 2b = 0`, so `b = -6`."],"msgs":{"fn":"Choose Build cubic first.","a":"Now `f‴` = {t}. `f‴ = 6a`, so `a = 2`.","b":"Now `f″(1)` = {s}. `f″ = 12x + 2b`; at 1 that’s `12 + 2b`."}},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Build quartic `ax^4 + bx^3`: make `f″` zero at `x = 0` and `x = 3`, and `f″(4) = 48`.","why":"`f″ = 6x(2ax + b)`: the zero at 3 needs `b = -6a`, and `f″(4) = 48a = 48` gives `a = 1`, `b = -6`.","hints":["`f″ = 12ax^2 + 6bx = 6x(2ax + b)`.","The other zero is `-b/(2a) = 3`, so `b = -6a`.","`f″(4) = 192a - 144a = 48a = 48`, so `a = 1`."],"msgs":{" ,"student":"Naomi","how":"","goal":[1,2],"instruction":"Naomi made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Find `f″(2)` for `f(x) = x^4 - 2x^3`.","steps":["`f′(x) = 4x^3 - 6x^2`","`f″(x) = (4x^3 - 6x^2)^2`","`f″(2) = (32 - 24)^2 = 64`"],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"`f″(x) = 4x^3 - 6x^2`, so `f″(2) = 8`","why":"That’s `f′`. Differentiate once more.","_n":"1of3d","_k":"c0fb9813"},{"t":"`f″(x) = 12x^2 - 12x`, so `f″(2) = 48 - 24 = 24`","why":"Differentiate `f′` again, term by term.","_n":"1pf4d","_k":"281fb564"},{"t":"Step 2 is correct.","why":"`f″` means differentiate `f′` again, not square it.","_n":"1qf5d","_k":"8de2d323"},{"t":"`f″(x) = 12x^2 - 6x`","why":"`-6x^2` differentiates to `-12x`.","_n":"1rf6d","_k":"46f8bad7"}],"hints":["What does the second prime ask you to do?","Differentiate `4x^3 - 6x^2`.","`12x^2 - 12x`; at 2, 24."]},{"id":"e2","goal":2,"task":"Find `f″(1)` for `f(x) = 2/x`.","steps":["`f(x) = 2x^{-1}`","`f′(x) = -2x^{-2}`","`f″(x) = -4x^{-3}`","`f″(1) = -4`"],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows. Look earlier."],"fixes":[{"t":"`f″(x) = -4x^{-1}`","why":"−2 − 1 = −3.","_n":"1sf7d","_k":"9d0d3c03"},{"t":"`f″(x) = 2x^{-3}`","why":"Multiply by the exponent −2.","_n":"1tf8d","_k":"9039d21f"},{"t":"Step 3 is correct.","why":"`(-2)(-2) = +4`: two negatives multiply to a positive.","_n":"1uf9d","_k":"9696d3b3"},{"t":"`f″(x) = (-2)(-2)x^{-3} = 4x^{-3}`, so `f″(1) = 4`","why":"Bring down the exponent −2: two negatives multiply to a positive.","_n":"1vfad","_k":"be8e3847"}],"hints":["Bring down the exponent −2.","(−2) × (−2) = 4.","`4x^{-3}`; at 1, 4."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the derivative ladder: how quickly a polynomial reaches 0, or that `1/x` never does?"},{"id":"j2","q":"In your own words, what does the sign of `f″` tell you about a graph?"},{"id":"j3","q":"Explain to a friend why \u003cspan class=\"m\">d\u003csup>2\u003c/sup>\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> isn’t \u003cspan class=\"m\">(d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>)\u003csup>2\u003c/sup>\u003c/span>."},{"id":"j4","q":"Which part of reading `f″` from a graph is still hard for you? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Find `f″(x)` for `f(x) = 5x^4 - 2x^3 + x`.","options":[{"t":"`20x^3 - 6x^2 + 1`","why":"That’s `f′`. Differentiate once more.","_n":"1wfbd","_k":"688f4f42"},{"t":"`60x^2 - 12x + 1`","why":"The +1 from `f′` differentiates to 0.","_n":"1xf8d","_k":"b3483a93"},{"t":"`60x^2 - 12x`","why":"`f′ = 20x^3 - 6x^2 + 1`, then `f″ = 60x^2 - 12x`.","_n":"1yf7d","_k":"a09d21b6"},{"t":"`(20x^3 - 6x^2 + 1)^2`","why":"`f″` means differentiate `f′` again, not square it.","_n":"1zf6d","_k":"c07af13f"}]},"b":{"prompt":"Find `f″(x)` for `f(x) = 3x^5 + 4x^2 - 7x`.","options":[{"t":"`60x^3 + 8x`","why":"`8x` differentiates to 8.","_n":"20f5d","_k":"5a09df3b"},{"t":"`(15x^4 + 8x - 7)^2`","why":"`f″` means differentiate `f′` again, not square it.","_n":"21fcd","_k":"00fe00c8"},{"t":"`15x^4 + 8x - 7`","why":"That’s `f′`. Differentiate once more.","_n":"22fbd","_k":"e6477ea6"},{"t":"`60x^3 + 8`","why":"`f′ = 15x^4 + 8x - 7`, then `f″ = 60x^3 + 8`.","_n":"23fad","_k":"88dff27b"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Find `f″(x)` for `f(x) = 6/x`.","options":[{"t":"`-{6}/{x^2}`","why":"That’s `f′`. Differentiate once more.","_n":"24f9d","_k":"0c5b50bb"},{"t":"`{36}/{x^4}`","why":"`f″` means differentiate `f′` again, not square it.","_n":"2500d","_k":"26165b99"},{"t":"`-{12}/{x^3}`","why":"`(-6)(-2) = +12`: two negatives multiply to a positive.","_n":"26ffd","_k":"c4b1761e"},{"t":"`{12}/{x^3}`","why":"`6x^{-1} -> -6x^{-2} -> 12x^{-3}`.","_n":"2706f","_k":"b2280564"}]},"b":{"prompt":"Find `f″(x)` for `f(x) = 4/x^2`.","options":[{"t":"`-{8}/{x^3}`","why":"That’s `f′`. Differentiate once more.","_n":"2807f","_k":"bf9086e1"},{"t":"`{64}/{x^6}`","why":"`f″` means differentiate `f′` again, not square it.","_n":"2904f","_k":"d2de2b4b"},{"t":"`-{24}/{x^4}`","why":"`(-8)(-3) = +24`: two negatives multiply to a positive.","_n":"2a05f","_k":"5403ec56"},{"t":"`{24}/{x^4}`","why":"`4x^{-2} -> -8x^{-3} -> 24x^{-4}`.","_n":"2b0af","_k":"81cd553a"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"Which notation means the second derivative of `y` with respect to `x`?","options":[{"t":"\u003cspan class=\"m\">d\u003ci>y\u003c/i>\u003csup>2\u003c/sup>/d\u003ci>x\u003c/i>\u003c/span>","why":"That isn’t standard notation: the 2 belongs on the d.","_n":"2c0bf","_k":"fd54bd97"},{"t":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> (`y^2`)","why":"That’s the derivative of `y^2`.","_n":"2d08f","_k":"7f35f536"},{"t":"\u003cspan class=\"m\">d\u003csup>2\u003c/sup>\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span>","why":"Differentiate twice: the 2s count derivatives.","_n":"2e09f","_k":"a22aeeb1"},{"t":"\u003cspan class=\"m\">(d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>)\u003csup>2\u003c/sup>\u003c/span>","why":"The 2s in \u003cspan class=\"m\">d\u003csup>2\u003c/sup>\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> count derivatives; nothing is squared.","_n":"2ffef","_k":"7ec22fdf"}]},"b":{"prompt":"What does `f‴(x)` mean?","options":[{"t":"The derivative of `f″(x)`","why":"Three primes: differentiate three times.","_n":"2gfff","_k":"926aae3e"},{"t":"`3f′(x)`","why":"The primes count derivatives, not a coefficient.","_n":"2h0cf","_k":"581493b5"},{"t":"`f(x) · f′(x) · f″(x)`","why":"Primes aren’t multiplied together.","_n":"2i0bf","_k":"55813fad"},{"t":"`(f′(x))^3`","why":"`f″` means differentiate `f′` again, not square it.","_n":"2j0ef","_k":"ad0711f1"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"`f(x) = x^3 - 6x^2 + 5`. On which interval is the slope of `f` increasing?","options":[{"t":"`(2, ∞)`","why":"`f″ = 6x - 12 > 0` when `x > 2`.","_n":"2k0df","_k":"ff0e1f76"},{"t":"`(0, 4)`","why":"That’s where `f` is decreasing.","_n":"2l08f","_k":"e038ecfe"},{"t":"`(4, ∞)`","why":"`f″` is already positive from `x = 2`.","_n":"2m07f","_k":"9b91e6d0"},{"t":"`(-∞, 0) ∪ (4, ∞)`","why":"That’s where `f` itself is increasing (`f′ > 0`).","_n":"2n0af","_k":"2fc07831"}]},"b":{"prompt":"`f(x) = -x^3 + 3x^2 + 1`. On which interval is the slope of `f` increasing?","options":[{"t":"`(0, 2)`","why":"That’s where `f` is increasing.","_n":"2o09f","_k":"1529f854"},{"t":"`(-∞, 0) ∪ (2, ∞)`","why":"That’s where `f` is decreasing.","_n":"2p04f","_k":"72009f6e"},{"t":"`(-∞, 1)`","why":"`f″ = -6x + 6 > 0` when `x \u003c 1`.","_n":"2q03f","_k":"bfeb889b"},{"t":"`(1, ∞)`","why":"`f″ \u003c 0` there.","_n":"2rad7","_k":"77e7900c"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`f(x) = x^5 - 3x^4 + 2x`. What is `f^{(5)}(x)`?","options":[{"t":"120","why":"Only the `x^5` term survives five derivatives: 5! = 120.","_n":"2sac7","_k":"5b3331d5"},{"t":"5","why":"5 × 4 × 3 × 2 × 1, not 5.","_n":"2tab7","_k":"1d9de270"},{"t":"0","why":"That’s `f^{(6)}`.","_n":"2uaa7","_k":"7602043a"},{"t":"`120x`","why":"After five steps, `x^5` has no `x` left.","_n":"2va97","_k":"fd2c077d"}]},"b":{"prompt":"`f(x) = 2x^4 - x^3`. What is `f^{(4)}(x)`?","options":[{"t":"48","why":"2 × 4! = 48.","_n":"2wa87","_k":"58a4155e"},{"t":"`48x`","why":"No `x` is left after four steps.","_n":"2xa77","_k":"24b07d39"},{"t":"0","why":"That’s `f^{(5)}`.","_n":"2ya67","_k":"38c47f65"},{"t":"8","why":"2 × 4, not 2 × 4!.","_n":"2za57","_k":"bf79be35"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"The graph of a cubic `f` has a local maximum at `x = -2` and a local minimum at `x = 2`. Where is `f″(x) = 0`?","options":[{"t":"Nowhere","why":"A cubic’s `f″` is linear, so it’s 0 once.","_n":"30a47","_k":"8b7fe179"},{"t":"At `x = -2` and `x = 2`","why":"That’s where `f′ = 0`.","_n":"31a77","_k":"d05871e3"},{"t":"At `x = 0`","why":"`f′` is a quadratic with zeros −2 and 2, so its vertex (where its slope `f″` is 0) is halfway, at 0.","_n":"32a87","_k":"f7dd4a64"},{"t":"At the `x`-intercepts of `f`","why":"`f″` is about slopes changing, not about `f = 0`.","_n":"33a97","_k":"65d0eb93"}]},"b":{"prompt":"A cubic `f` has a local maximum at `x = 1` and a local minimum at `x = 5`. Where is `f″(x) = 0`?","options":[{"t":"At `x = 1` and `x = 5`","why":"That’s where `f′ = 0`.","_n":"34aa7","_k":"45febd88"},{"t":"Nowhere","why":"A cubic’s `f″` is linear, so it’s 0 once.","_n":"35a37","_k":"4b81b70b"},{"t":"At the `x`-intercepts of `f`","why":"`f″` is about slopes changing, not about `f = 0`.","_n":"36a47","_k":"089bee57"},{"t":"At `x = 3`","why":"`f′` is a quadratic with zeros 1 and 5, so its vertex (where `f″ = 0`) is halfway, at 3.","_n":"37a57","_k":"5eadff68"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best description of what `f″(3) = -4` tells you?","options":[{"t":"“Near `x = 3`, the slope of `f` is decreasing by about 4 for each unit increase in `x`.”","why":"`f″` is the rate of change of the slope.","_n":"38a67","_k":"75e52f04"},{"t":"“The slope of `f` at `x = 3` is −4.”","why":"That would be `f′(3) = -4`. `f″` tells you how the slope changes.","_n":"399f7","_k":"cdf76e52"},{"t":"“`f` is decreasing at `x = 3`.”","why":"That would need `f′(3) \u003c 0`.","_n":"3aa07","_k":"394092e8"},{"t":"“The graph of `f` is below the `x`-axis at `x = 3`.”","why":"`f″` asks whether the \u003cstrong>slopes\u003c/strong> are rising, not whether the graph is high or rising.","_n":"3b197","_k":"c3e47986"}]},"b":{"prompt":"Which is the best description of what `f″(-1) = 5` tells you?","options":[{"t":"“Near `x = -1`, the slope of `f` is increasing by about 5 for each unit increase in `x`.”","why":"`f″` is the rate of change of the slope.","_n":"3c187","_k":"2a163f05"},{"t":"“The slope of `f` at `x = -1` is 5.”","why":"That would be `f′(-1) = 5`. `f″` tells you how the slope changes.","_n":"3d1b7","_k":"f3e7864f"},{"t":"“`f(-1) = 5`.”","why":"That’s a value, not a second derivative.","_n":"3e1a7","_k":"f62ea545"},{"t":"“`f` is increasing at `x = -1`.”","why":"That would need `f′(-1) > 0`. `f″` asks whether the \u003cstrong>slopes\u003c/strong> are rising, not whether the graph is high or rising.","_n":"3f157","_k":"8ca4cb66"}]}},{"id":"c2","cat":"C","goal":[1,2],"a":{"prompt":"Which is a correct way to write the second derivative of `y = x^4`?","options":[{"t":"\u003cspan class=\"m\">(d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>)\u003csup>2\u003c/sup>\u003c/span> `= 12x^2`","why":"The 2s in \u003cspan class=\"m\">d\u003csup>2\u003c/sup>\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> count derivatives; nothing is squared.","_n":"3g147","_k":"e56ef9da"},{"t":"`y^2 = 12x^2`","why":"That says something else entirely.","_n":"3h177","_k":"faee0da6"},{"t":"\u003cspan class=\"m\">d\u003ci>y\u003c/i>\u003csup>2\u003c/sup>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> `= 12x^2`","why":"The 2 goes on the d, not on `y`.","_n":"3i167","_k":"53b83c1a"},{"t":"\u003cspan class=\"m\">d\u003csup>2\u003c/sup>\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> `= 12x^2`","why":"`4x^3`, then `12x^2`: the 2s count derivatives.","_n":"3j217","_k":"2bc63c30"}]},"b":{"prompt":"Which is correct for `y = x^{-1}`?","options":[{"t":"`y″ = -2x^{-3}`","why":"`(-1)(-2) = +2`: two negatives multiply to a positive.","_n":"3k207","_k":"42c5bff7"},{"t":"`y″ = (-x^{-2})^2 = x^{-4}`","why":"`f″` means differentiate `f′` again, not square it.","_n":"3l137","_k":"cfa2c006"},{"t":"`y″ = -x^{-2}`","why":"That’s `y′`. Differentiate once more.","_n":"3m147","_k":"036bb718"},{"t":"`y″ = 2x^{-3}`","why":"`x^{-1} -> -x^{-2} -> 2x^{-3}`.","_n":"3n117","_k":"13d67aa5"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A drone’s height is `h(t) = t^3 - 9t^2 + 24t` metres after `t` seconds (`0 \u003c= t \u003c= 5`). At `t = 1`, is its vertical velocity increasing or decreasing, and how fast?","options":[{"t":"Increasing, by 12 m/s each second","why":"`h″(1)` is negative.","_n":"3o127","_k":"c3f41f88"},{"t":"Decreasing, by 18 m/s each second","why":"`h″ = 6t - 18`, so include the `6t`.","_n":"3p177","_k":"20f54f1e"},{"t":"Increasing, by 9 m/s each second","why":"`h′(1) = 9` is the velocity itself.","_n":"3q187","_k":"fa401b10"},{"t":"Decreasing, by 12 m/s each second","why":"`h′ = 3t^2 - 18t + 24`; `h″ = 6t - 18 = -12` at `t = 1`.","_n":"3r157","_k":"2c889cd5"}]},"b":{"prompt":"`h(t) = t^3 - 6t^2 + 12t` metres. At `t = 1`, is the vertical velocity increasing or decreasing, and how fast?","options":[{"t":"Decreasing, by 12 m/s each second","why":"`h″ = 6t - 12`, so include the `6t`.","_n":"3s167","_k":"0b931a60"},{"t":"Increasing, by 6 m/s each second","why":"`h″(1)` is negative.","_n":"3t1b7","_k":"d10a155f"},{"t":"Decreasing, by 6 m/s each second","why":"`h″ = 6t - 12 = -6`.","_n":"3u1c7","_k":"478b0b98"},{"t":"Increasing, by 3 m/s each second","why":"`h′(1) = 3` is the velocity itself.","_n":"3v156","_k":"581ed399"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A cart’s position along a track is `s(t) = 2t^3 - 15t^2 + 36t` metres. At what time is the rate of change of its velocity zero?","options":[{"t":"`t = 5` s","why":"30 ÷ 12 = 2.5.","_n":"3w146","_k":"1ac8b00d"},{"t":"`t = 0` s","why":"`s″(0) = -30`.","_n":"3x136","_k":"42332cad"},{"t":"`t = 2` s and `t = 3` s","why":"Those are when `s′ = 0`, the velocity itself.","_n":"3y126","_k":"9772ccf9"},{"t":"`t = 2.5` s","why":"`s″ = 12t - 30 = 0`.","_n":"3z196","_k":"012178ae"}]},"b":{"prompt":"`s(t) = t^3 - 12t^2 + 36t` metres. At what time is the rate of change of the velocity zero?","options":[{"t":"`t = 8` s","why":"24 ÷ 6 = 4.","_n":"40186","_k":"c0b8f723"},{"t":"`t = 0` s","why":"`s″(0) = -24`.","_n":"41176","_k":"2d9038d9"},{"t":"`t = 4` s","why":"`s″ = 6t - 24 = 0`.","_n":"42166","_k":"c02a6e70"},{"t":"`t = 2` s and `t = 6` s","why":"Those are when `s′ = 0`, the velocity itself.","_n":"431d6","_k":"eabe8880"}]}}]},"task":{"title":"Slowest slope","summary":"Slowest slope","statement":"\u003cp>Design `f(x) = ax^3 + bx^2 + cx` that meets every condition. Find all the answers.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`f‴(x) = 12`.\u003c/li>\u003cli>`f″(x) = 0` at a positive `x`-value.\u003c/li>\u003cli>The slope of `f` is never negative.\u003c/li>\u003cli>The slope at `x = 0` is 2.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers from −5 to 5. The ladder shows `f`, `f′` (with its lowest point marked) and `f″`.\u003c/p>","checks":["`f‴ = 12`","`f″ = 0` at a positive `x`","Slope never negative","Slope 2 at `x = 0`"],"tips":["`f‴ = 6a`.","`f″ = 6ax + 2b` is 0 at `x = -b/(3a)`. For that to be positive with `a > 0`, `b` must be negative.","The slope is smallest exactly where `f″ = 0`. Check `f′` there: it must not be negative.","`f′(0) = c`."],"explainPrompt":"Explain why the place where `f″ = 0` is the place to check whether the slope ever goes negative.","vocab":"Use the words first derivative, second derivative, slope and minimum.","more":"There’s more than one answer. Find them all.","after3":"With `a = 2` and `c = 2`, the slope’s lowest value is `2 - b^2/6`. `b = -4` makes it `2 - 16/6 \u003c 0`."},"cards":[["Second derivative","`f″(x)` = \u003cspan class=\"m\">d\u003csup>2\u003c/sup>\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span>: the derivative of `f′`."],["What `f″` measures","The rate of change of the slope."],["`f″ > 0`","Slopes increasing as `x` increases."],["`f″ \u003c 0`","Slopes decreasing as `x` increases."],["Not this","`f″ != (f′)^2`, and \u003cspan class=\"m\">d\u003csup>2\u003c/sup>\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003csup>2\u003c/sup>\u003c/span> ≠ \u
