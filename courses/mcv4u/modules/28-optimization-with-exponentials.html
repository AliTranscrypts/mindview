.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 28: hero factor panels, Dose curve (V10 stage, factor panels, window sliders), Part 3 stations (N29 chip slots,
   V10 stage with bars, V11 sign chart), V8 answer boxes, Dose design task. Colour tokens only. */
.ox-heq{font:400 .5em/1.2 var(--font-ui);color:var(--ink-2);margin:0 .25em;letter-spacing:0}

/* hero */
.ox-hfac{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0 0 8px;align-items:end}
.ox-hfp{min-width:0}
.ox-hfcap{margin:0 0 2px;font:600 .82rem var(--font-ui);color:var(--ink-2)}
.ox-hfcap .m{font-size:1.08em;color:var(--ink)}
canvas.plot.ox-hsmall{aspect-ratio:16/8}

/* Explore: dose curve */
.ox-ex{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.ox-main,.ox-side{min-width:0}
.ox-eq{font-size:clamp(1.3rem,3.2vw,1.9rem);min-height:1.3em}
.ox-fac{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0 0 8px;align-items:end}
.ox-fac[hidden],.ox-win[hidden]{display:none}
.ox-fp{min-width:0}
.ox-fcap{margin:0 0 2px;font:600 .82rem var(--font-ui);color:var(--ink-2)}
.ox-fcap .m{color:var(--ink)}
canvas.plot.ox-small{aspect-ratio:16/10}
.ox-gcap{margin:0 0 4px;font-weight:700;font-size:.95rem}
canvas.plot.ox-plot{aspect-ratio:16/11}
.ox-key{margin:8px 0 0}
.ox-win{margin-top:10px}
.ox-sl{margin-top:10px}
.ox-sl output{font-weight:700}
.ox-unit{font-weight:400}
.ox-side .seg-wrap{margin-top:0}
.ox-read{margin-top:14px}
@media (max-width:820px){
  .ox-ex{grid-template-columns:minmax(0,1fr)}
}

/* Part 3 stations */
.ox-stns{margin-bottom:6px}
.ox-stchip{font:600 .95rem var(--font-ui)}
.ox-stp h3{margin:8px 0 6px}
.ox-stp .m,.ox-alg-steps .m{white-space:normal}
.ox-build{margin:10px 0 0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.ox-frame{margin:0 0 6px;font-size:1.05rem}
.ox-build .how{margin:0 0 8px}
.ox-slots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.ox-slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:150px;min-height:52px;padding:6px 10px;border:2px dashed var(--ink-2);border-radius:8px;background:var(--sheet);text-align:left}
.ox-slot.on{border-style:solid;border-color:var(--ink);background:var(--hi-soft)}
.ox-slot.full{border-style:solid;border-color:var(--green);background:var(--good-bg);opacity:1;color:var(--ink)}
.ox-sll{font:700 .78rem var(--font-ui);color:var(--ink-2)}
.ox-slv{font-size:1.05rem}
.ox-tray{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.ox-mchip{font-size:1.02rem;min-height:36px}
.ox-mchip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.ox-mtip{margin:4px 0 0}
.ox-first{margin:10px 0 0}
.ox-stage{margin-top:12px}
.ox-stage[hidden]{display:none}
.ox-ss{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:14px 22px;align-items:start}
.ox-ss-fig,.ox-ss-g{min-width:0}
.ox-ss-sl{margin-top:10px}
.ox-bars{display:block;width:100%;max-width:240px;height:auto;margin:20px auto 0}
.ox-bar-ax{stroke:var(--ink-2);stroke-width:1.5}
.ox-bar{stroke:var(--sheet);stroke-width:1}
.ox-bar-obj{fill:var(--pen)}
.ox-bar-oth{fill:var(--ink-2);opacity:.55}
.ox-bar-v{fill:var(--ink);font:700 12px var(--font-ui)}
.ox-bar-l{fill:var(--ink-2);font:600 12px var(--font-ui)}
.ox-sread{margin-top:12px}
.ox-best{color:var(--green);font-weight:700}
.ox-note{margin-top:10px}
.ox-alg-steps{margin:10px 0 0;padding-left:1.3em;display:grid;gap:4px}
.ox-sch{margin:12px 0 6px;font-weight:700;font-size:.95rem}
@media (max-width:560px){
  .ox-ss{grid-template-columns:minmax(0,1fr)}
  .ox-bars{max-width:200px;margin-top:0}
  .ox-slot{min-width:0;flex:1 1 140px}
}

/* V11 sign chart */
.ox-sc-wrap{overflow-x:auto;position:relative}
table.ox-sct th,table.ox-sct td{padding:5px 8px;text-align:center;white-space:nowrap}
table.ox-sct tbody th{text-align:left;font-weight:600}
table.ox-sct th .m,table.ox-sct td .m{white-space:nowrap}
table.ox-sct .ox-sc-u{font:600 .8rem var(--font-ui);color:var(--ink-2)}
table.ox-sct .ox-sc-ar{font-size:1.25rem;line-height:1}
table.ox-sct .ox-sc-d td{font-weight:700}

/* V8 answer boxes */
.ox-dt{display:grid;gap:8px;margin:8px 0 0}
.ox-dr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ox-dl{min-width:8.5rem;font-weight:600}
.ox-box{width:9rem}
.ox-pre{font:600 1.15rem var(--font-math)}
.ox-u{color:var(--ink-2)}
.ox-dch{gap:6px;margin:0}
.ox-dch .chip{min-height:36px;font-size:1.02rem}

/* task */
.ox-tsl{margin-top:4px}
.ox-tkl{font-weight:700;margin:12px 0 6px}
.ox-tk{gap:8px}
.ox-tk .fchip{min-width:52px}
@media (max-width:560px){ .ox-dl{min-width:0} }

er moves the peak.","txt":{"modeLabel":"View","modes":[{"id":"dose","t":"Dose curve"},{"id":"factor","t":"Factor view"},{"id":"window","t":"Window"}],"A":"Dose factor `@a{A}`","Aunit":"mg/L per hour","k":"Elimination rate `k`","kunit":"per hour","probe":"Probe time `t`","t1":"Window start `t_1`","t2":"Window end `t_2`","winNote":"Window endpoints move in steps of 0.5 h.","gcap":{"dose":"`C(t)`, mg/L, against `t`, hours","factor":"`C′(t) = @a{A}e^{-kt}(1 - kt)`, (mg/L)/h","window":"`C(t)` on the window `[t_1, t_2]`"},"key":{"dose":"Blue: `C(t)`. Black: the tangent at the probe. Dashed line: the peak at `t = 1/k`.","factor":"Top: the two factors. Teal: `C′(t)`. The strip under it shows the sign of `C′`: + before `1/k`, − after.","window":"Shaded: the window. Open dots: the candidates (endpoints, and `1/k` if it’s inside). Ringed: the absolute maximum on the window."},"fac1":"Rising factor `@a{A}t`","fac2":"Decaying factor `e^{-kt}` (always above 0)","rows":{"model":"Model","probe":"Probe","d":"`C′(t)`","ptime":"Peak time","pval":"Peak concentration","win":"Window"},"rising":"rising","falling":"falling","peak":"peak","winMax":"Absolute max on #1: at #2, #3 mg/L","peakWord":"the peak","endWord":"an endpoint","peakLabel":"peak","maxLabel":"absolute max"},"predIntro":"Make a prediction first. Then the dose curve shows you what really happens.","predictions":[{"id":"p1","prompt":"`@a{A} = 20` and `k = 0.5`. Double `@a{A}` to 40. Where is the new peak?","options":[{"t":"Still at `t = 2` h","_n":"o9bd","_k":"8755b63f"},{"t":"At 4 h","_n":"p9cd","_k":"6b34e172"},{"t":"At 1 h","_n":"q9dd","_k":"1e4d61b8"},{"t":"At `2e` h","_n":"r96d","_k":"05593771"}],"explain":"The curve stretches upward, but the peak line stays put. `C′(t) = @a{A}e^{-kt}(1 - kt)`: `@a{A}` doesn’t change where the factor `(1 - kt)` is 0.","start":{"mode":"dose","A":20,"k":0.5,"t":1.5}},{"id":"p2","prompt":"`@a{A} = 20` and `k = 0.5`. Double `k` to 1. Where is the new peak?","options":[{"t":"Still at 2 h","_n":"s97d","_k":"4874c39d"},{"t":"At 4 h","_n":"ta4d","_k":"b55ecd69"},{"t":"At 1 h","_n":"ua3d","_k":"679b8bb0"},{"t":"At 0.25 h","_n":"va2d","_k":"894fcbf9"}],"explain":"The peak line slides left. The peak is at `t = 1/k`: faster elimination, earlier peak.","start":{"mode":"dose","A":20,"k":0.5,"t":1.5}},{"id":"p3","prompt":"Factor view. How many times does the factor `e^{-kt}` reach 0 on the graph?","options":[{"t":"Once, at `t = 0`","_n":"wa1d","_k":"10f7096f"},{"t":"Once, at `t = 1/k`","_n":"xa0d","_k":"c797d8c9"},{"t":"Never","_n":"y9fd","_k":"f9ffeb1d"},{"t":"Many times","_n":"z9ed","_k":"07ec3c52"}],"explain":"The decay curve approaches the axis, but its band never touches it. `e^{-kt} = 1/e^{kt}`, always positive.","start":{"mode":"factor","A":20,"k":0.5,"t":0}},{"id":"p4","prompt":"Window `[3, 8]`, `@a{A} = 20`, `k = 0.5`. The peak at `t = 2` is outside this window. Where is the absolute maximum on `[3, 8]`?","options":[{"t":"At `t = 2`","_n":"109dd","_k":"68957bd6"},{"t":"At `t = 3`","_n":"119cd","_k":"15f81527"},{"t":"At `t = 8`","_n":"129bd","_k":"31fe16b6"},{"t":"There isn’t one","_n":"1312d","_k":"8f7c07d3"}],"explain":"The curve is falling across the whole window, so the left endpoint is ringed. `C` is decreasing after 2 h, so the earliest time in the window wins.","start":{"mode":"window","A":20,"k":0.5,"t":3,"t1":3,"t2":8}}],"pv":{"still":"peak still at t = 2 h","slid":"peak now at t = 1 h","never":"e^(−kt) > 0: never 0","left":"absolute max: t = 3"},"chalIntro":"Use the sliders to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,5],"prompt":"Set the sliders so the peak happens at exactly 4 hours.","why":"The peak time is `1/k`, so `1/k = 4` gives `k = 0.25`. Any `@a{A}` works.","hints":["Which slider moves the peak?","Peak time = `1/k`.","`1/k = 4` gives `k = 0.25`."],"msgs":{"k4":"The peak is at `1/k`, so `k = 4` peaks at 0.25 h.","k05":"That peaks at 2 h.","general":"Right now the peak is at `t = 1/k` = #1 h. You need 4 h."}},{"id":"tc2","goal":[3,5],"prompt":"Make the curve peak at 2 h with a peak concentration of `40/e` mg/L.","why":"`k = 0.5` puts the peak at `1/k = 2` h, and `C(2) = @a{A}/(ke) = 20/(0.5e) = 40/e`.","hints":["First fix the time: `k = 1/2`.","`C(1/k) = @a{A} · (1/k) · e^{-1} = @a{A}/(ke)`.","`@a{A}/(0.5e) = 40/e`, so `@a{A} = 20`."],"msgs":{"a40":"Peak `80/e`: twice too high.","k2":"Peak at 0.5 h.","general":"Right now the peak is at #1 h with a peak concentration of #2 mg/L."}},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"Design a dose that peaks at 2.5 h with a peak concentration of `30/e` mg/L.","why":"`1/k = 2.5` gives `k = 0.4`; then `@a{A}/(ke) = 30/e` gives `@a{A} = 30k = 12`.","hints":["Peak time `1/k = 2.5`.","Peak value `@a{A}/(ke) = 30/e`, so `@a{A} = 30k`.","`k = 0.4` and `@a{A} = 12`."],"msgs":{"a30":"That peaks at `75/e`: the peak value is `@a{A}/(ke)`, not `@a{A}/e`.","k25":"Peak at 0.4 h: the time is `1/k`.","general":"Right now the peak is at #1 h with a peak concentration of #2 mg/L."}}]},"part3":{"slug":"revenue","name":"Revenue","heading":"Revenue with exponential demand","intro":"The same product of a rising factor and a decaying factor shows up in economics. Build each model from chips, then move the price to find the best one, and check it with algebra. Then try the quick check.","build":{"how":"Tap a chip, then the slot it belongs in (or a slot, then a chip).","done":"Model built.","first":"Build the model first. The graph appears when it’s complete.","slider":"Price `p`","trend":{"up":"rising: a higher price brings in more","down":"falling: too many customers lost","best":"greatest"},"algSummary":"Check it with algebra","signTitle":"Sign chart"},"stations":[{"id":"s1","chip":"Best ticket price","title":"Station 1: the best ticket price","text":"A theatre finds that at a price of `p` dollars it sells about `q(p) = 600e^{-p/20}` tickets per show (`0 ≤ p ≤ 80`).","frame":"`R(p) =` (price) × (quantity)","slots":[{"id":"price","label":"Price"},{"id":"qty","label":"Quantity sold"}],"roles":{"price":"the price","qty":"the quantity sold"},"chips":[{"t":"`p`","_a":"QEhHUFtSRg=="},{"t":"`600e^{-p/20}`","_a":"QElBQBo="},{"t":"`600`","_a":"QFZaGw==","fb":"600 tickets sell only at `p = 0`. The number sold depends on `p`: `600e^{-p/20}`."},{"t":"`p - 5`","_a":"QFZaGw==","fb":"Revenue uses the whole price `p`. Costs come in at Station 3."}],"model":"`R(p) = p · 600e^{-p/20}`","graph":"`R(p)`, dollars, against the price `p`","rows":{"p":"Price","q":"Tickets `q(p)`","R":"Revenue `R(p)`","trend":"Revenue"},"best":"greatest: `12 000/e` ≈ $4415 at $20","alg":["`R(p) = p · 600e^{-p/20}`","Product rule: `R′(p) = 600e^{-p/20} + p · 600e^{-p/20} · (-1/20) = 600e^{-p/20}(1 - p/20)`.","`600e^{-p/20} > 0`, so `R′(p) = 0` only when `1 - p/20 = 0`: `p = 20`.","Endpoints: `R(0) = 0` and `R(80) = 48 000e^{-4}` ≈ $879.","Maximum: `R(20) = 12 000/e` ≈ $4415. The best ticket price is $20."],"use":"`e ≈ 2.718`, `e^{-4} ≈ 0.018`"},{"id":"s2","chip":"Price cap","title":"Station 2: a price cap","text":"The city caps ticket prices at $15. Demand is still `q(p) = 600e^{-p/20}`.","frame":"`R(p) = p · 600e^{-p/20}` on the prices allowed","slots":[{"id":"dom","label":"Prices allowed"}],"roles":{"dom":"the prices allowed"},"chips":[{"t":"`0 ≤ p ≤ 15`","_a":"QFxaVBo="},{"t":"`0 ≤ p ≤ 80`","_a":"QFZaGw==","fb":"That was before the cap. Now prices stop at $15."},{"t":"`p ≥ 15`","_a":"QFZaGw==","fb":"A cap is a highest price: $15 or less."}],"model":"`R(p) = p · 600e^{-p/20}`, `0 ≤ p ≤ 15`","graph":"`R(p)`, dollars; the shaded band is the prices allowed","rows":{"p":"Price","q":"Tickets `q(p)`","R":"Revenue `R(p)`","trend":"Revenue"},"best":"greatest on the window: the cap, $15","alg":["On `[0, 15]`, `1 - p/20 > 0`, so `R′(p) = 600e^{-p/20}(1 - p/20) > 0`: `R` is increasing on the whole window.","The critical number `p = 20` is outside `[0, 15]`, so it can’t be used.","Compare the endpoints: `R(0) = 0` and `R(15) = 9000e^{-0.75}` ≈ $4250.","The best price is the cap, $15."],"use":"`e^{-0.75} ≈ 0.472`"},{"id":"s3","chip":"Profit","title":"Station 3: profit, not revenue","text":"Each ticket costs the theatre $5 to provide. Demand is still `q(p) = 600e^{-p/20}`.","frame":"`P(p) =` (profit per ticket) × (quantity)","slots":[{"id":"margin","label":"Profit per ticket"},{"id":"qty","label":"Quantity sold"}],"roles":{"margin":"the profit per ticket","qty":"the quantity sold"},"chips":[{"t":"`p - 5`","_a":"QFVUS19eCkQ="},{"t":"`600e^{-p/20}`","_a":"QElBQBo="},{"t":"`p`","_a":"QFZaGw==","fb":"That’s the price. Each ticket also costs $5, so the profit per ticket is `p - 5`."},{"t":"`p + 5`","_a":"QFZaGw==","fb":"The $5 cost comes off the price, not on top of it."}],"model":"`P(p) = (p - 5) · 600e^{-p/20}`","graph":"`P(p)`, dollars, against the price `p`","rows":{"p":"Price","q":"Tickets `q(p)`","R":"Revenue","c":"Cost ($5 per ticket)","P":"Profit `P(p)`","trend":"Profit"},"best":"greatest at $25","alg":["`P(p) = (p - 5) · 600e^{-p/20}`","Product rule: `P′(p) = 600e^{-p/20} + (p - 5) · 600e^{-p/20} · (-1/20) = 600e^{-p/20}[1 - (p - 5)/20]`.","`600e^{-p/20} > 0`, so `P′(p) = 0` only when `(p - 5)/20 = 1`: `p = 25`.","`P(25) = 20 · 600e^{-5/4} = 12 000e^{-5/4}` ≈ $3438. The best price for profit is $25."],"use":"`e^{-1.25} ≈ 0.287`","note":"With this kind of demand, the best price is the demand’s scale (20) plus the cost per item (5)."}],"quickCheck":{"title":"Quick check","summary":"Revenue quick check","items":[{"id":"q1","goal":4,"prompt":"`q = 1000e^{-p/50}`. Which price maximizes revenue?","choices":[{"t":"$0","fb":"`R′ = 1000e^{-p/50}(1 - p/50)`. Demand is greatest at `p = 0`, but then revenue is 0.","_n":"1413d","_k":"3329c0dd"},{"t":"$25","fb":"`R′ = 1000e^{-p/50}(1 - p/50)`. Demand is greatest at `p = 0`, but then revenue is 0.","_n":"1510d","_k":"d10716eb"},{"t":"$50","fb":"Right. `R′ = 1000e^{-p/50}(1 - p/50) = 0` at `p = 50`.","_n":"1611d","_k":"ec7b9d3e"},{"t":"$1000","fb":"`R′ = 1000e^{-p/50}(1 - p/50)`. Demand is greatest at `p = 0`, but then revenue is 0.","_n":"170ed","_k":"bae276ef"}]},{"id":"q2","goal":2,"prompt":"`R′(p) = 300e^{-p/10}(1 - p/10)`. Why is `p = 10` the only critical number?","choices":[{"t":"`e^{-p/10}` is never 0","fb":"Right. A positive factor can’t make the product 0, so only `1 - p/10` can.","_n":"180fd","_k":"81acd0b8"},{"t":"The domain stops at 10","fb":"A positive factor can’t make the product 0. `e` to any power is positive. `e^{-kt} = 0` has no solution; only the other factor can be 0.","_n":"190cd","_k":"2b270007"},{"t":"`e^{-p/10} = 0` at `p = 0`","fb":"A positive factor can’t make the product 0. `e` to any power is positive. `e^{-kt} = 0` has no solution; only the other factor can be 0.","_n":"1a0dd","_k":"3a39ad98"},{"t":"300 can’t be 0","fb":"A positive factor can’t make the product 0. `e` to any power is positive. `e^{-kt} = 0` has no solution; only the other factor can be 0.","_n":"1b1ad","_k":"c5fbeaa5"}]},{"id":"q3","goal":3,"prompt":"Same demand as Q1, but prices are capped at $40. Best price?","choices":[{"t":"$0","fb":"`R` is increasing up to $50, so the cap wins.","_n":"1c1bd","_k":"b77d2233"},{"t":"$20","fb":"`R` is increasing up to $50, so the cap wins.","_n":"1d18d","_k":"9cfc87be"},{"t":"$40","fb":"Right. `R` is increasing up to $50, so the cap wins.","_n":"1e17d","_k":"6f9a0cbf"},{"t":"$50","fb":"`R` is increasing up to $50, so the cap wins. $50 isn’t allowed.","_n":"1f1ad","_k":"14c9f5b1"}]},{"id":"q4","goal":4,"prompt":"Demand `1000e^{-p/50}` and a cost of $8 per item. Profit-maximizing price?","choices":[{"t":"$8","fb":"`P′ ∝ 1 - (p - 8)/50 = 0`. At cost price, profit is 0.","_n":"1g19d","_k":"509fb404"},{"t":"$42","fb":"`P′ ∝ 1 - (p - 8)/50 = 0`: the cost is added to 50.","_n":"1h1cd","_k":"4908ff09"},{"t":"$50","fb":"`P′ ∝ 1 - (p - 8)/50 = 0`. $50 maximizes revenue.","_n":"1i1bd","_k":"5ffd0da5"},{"t":"$58","fb":"Right. `P′ ∝ 1 - (p - 8)/50 = 0` at `p = 58`.","_n":"1j1ed","_k":"05c7c266"}]}]}},"practice":{"activities":[{"id":"crit","type":"custom","title":"Find the critical numbers","summary":"Find the critical numbers","goal":[1,2],"instruction":"Find every critical number of each function.","how":"Type exact values: whole numbers, fractions and `ln` where you need it (`1/2`, −4, `ln 3`). Separate several values with commas. Then press Check.","msgs":{"fill":"Fill in every box first.","err":"Type exact values only, such as −4, 1/2 or `ln 3`. Separate several values with commas.","exact":"Close, but give the exact value (with `ln` or `e`), not a decimal.","general":"Not yet. Factor out the exponential and set the other factor to 0."},"items":[{"id":"d1","goal":[1,2],"prompt":"`f(x) = xe^{-2x}`","boxes":[{"k":"x","pre":"`x =`","list":true}],"_a":"GRpNGwJsVEhXZUg=","display":"`x = 1/2`","wrong":[{"k":"x","eq":[0],"fb":"`e^{-2x}` is never 0; `f′ = e^{-2x}(1 - 2x)`."},{"k":"x","eq":[0,0.5],"fb":"`e^{-2x}` is never 0; `f′ = e^{-2x}(1 - 2x)`."},{"k":"x","eq":[-0.5],"fb":"The exponent `-2x` changes at rate −2: `f′ = e^{-2x}(1 - 2x)`."}],"general":"Use the product rule and factor out `e^{-2x}`.","why":"`f′ = e^{-2x} - 2xe^{-2x} = e^{-2x}(1 - 2x)`, and `e^{-2x} > 0`."},{"id":"d2","goal":[1,2],"prompt":"`f(x) = x^2e^{-x}`","boxes":[{"k":"x","pre":"`x =`","list":true}],"_a":"GRpNGwJsVEpQZUg=","display":"`x = 0` and `x = 2`","wrong":[{"k":"x","eq":[2],"fb":"`f′ = xe^{-x}(2 - x)`: the factor `x` gives 0."}],"general":"Use the product rule and factor out `xe^{-x}`.","hints":["Product rule.","`2xe^{-x} - x^2e^{-x} = xe^{-x}(2 - x)`.","0 and 2."],"why":"`f′ = 2xe^{-x} - x^2e^{-x} = xe^{-x}(2 - x)`: zero at `x = 0` and `x = 2`."},{"id":"d3","goal":[1,2],"prompt":"`f(x) = e^{x^2 - 4x}`","boxes":[{"k":"x","pre":"`x =`","list":true}],"_a":"GRpNGwJsVjsf","display":"`x = 2`","general":"`f′ = (2x - 4)e^{x^2 - 4x}`.","why":"`f′ = (2x - 4)e^{x^2 - 4x}`; the exponential is never 0, so `2x - 4 = 0`."},{"id":"d4","goal":[1,2],"prompt":"`f(x) = (x - 3)e^x`","boxes":[{"k":"x","pre":"`x =`","list":true}],"_a":"GRpNGwJsVjsf","display":"`x = 2`","wrong":[{"k":"x","eq":[3],"fb":"That’s where `f = 0`, not `f′`. `f′ = e^x(x - 2)`."}],"general":"Use the product rule and factor out `e^x`.","why":"`f′ = e^x + (x - 3)e^x = e^x(x - 2)`."},{"id":"d5","goal":[1,2],"prompt":"`f(x) = e^x - 3x`","boxes":[{"k":"x","pre":"`x =`","list":true}],"_a":"GRpNGwJsVUhSAQ0PCQVWXloOAwEJB11QP0U=","display":"`x = ln 3`","wrong":[{"k":"x","eq":[3],"fb":"`e^x = 3` means `x = ln 3`."}],"general":"`f′ = e^x - 3`.","hints":["`f′ = e^x - 3`.","`e^x = 3`.","`x = ln 3`."],"why":"`f′ = e^x - 3 = 0` when `e^x = 3`, so `x = ln 3`."},{"id":"d6","goal":[1,2],"prompt":"`f(x) = xe^{x/4}`","boxes":[{"k":"x","pre":"`x =`","list":true}],"_a":"GRpNGwJsSVI/RQ==","display":"`x = -4`","wrong":[{"k":"x","eq":[4],"fb":"`f′ = e^{x/4}(1 + x/4)`."}],"general":"Use the product rule and factor out `e^{x/4}`.","why":"`f′ = e^{x/4} + (x/4)e^{x/4} = e^{x/4}(1 + x/4)`: zero at `x = -4`."}]},{"id":"opt","type":"custom","title":"Optimize the model","summary":"Optimize the model","star":true,"goal":[3,4,5],"instruction":"Solve each problem with exact values. Items 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type exact values with `e` or `ln` where you need them (`10/e`, `600/e`, `4 ln 2`, `e`), then press Check.","msgs":{"fill":"Fill in every box and make every choice first.","err":"Type exact values only, such as 3, 1/3, `10/e`, `e^-3` or `4 ln 2`.","exact":"Close, but give the exact value with `e` or `ln` (such as `10/e` or `4 ln 2`), not a decimal.","general":"Not yet. Check your work and try again."},"items":[{"id":"o1","goal":3,"prompt":"Absolute maximum of `f(t) = 10te^{-t}` on `[0, 3]`: the value.","boxes":[{"k":"v","pre":"Maximum value"}],"_a":"GRpDGwIESlBVAAIADANVV1UJAQ0KBFcb","display":"`10/e` (at `t = 1`)","wrong":[{"k":"v","eq":1.4936120510359183,"fb":"That’s the endpoint `t = 3`; compare it with `f(1)`."}],"why":"`f′ = 10e^{-t}(1 - t)`: the peak at `t = 1` is inside `[0, 3]`, and `f(1) = 10/e` ≈ 3.68 beats `f(0) = 0` and `f(3) = 30e^{-3}` ≈ 1.49."},{"id":"o2","goal":[3,5],"prompt":"A rumour spreads so that `r(t) = 200te^{-t/3}` people hear it per hour. When is `r` greatest, and what is it?","boxes":[{"k":"t","pre":"Greatest at `t =`","unit":"h"},{"k":"r","pre":"Greatest value `r =`","unit":"people per hour"}],"_a":"GRpBGwIESEQQGg8LCgdKUVAPAw8MAFRUWg4ADUU=","display":"`t = 3` h, `r = 600/e` ≈ 221 people per hour","wrong":[{"k":"t","eq":0.3333333333333333,"fb":"The peak is at `1/k` with `k = 1/3`."}],"why":"`r′ = 200e^{-t/3}(1 - t/3) = 0` at `t = 3`; `r(3) = 600e^{-1} = 600/e` ≈ 221 people per hour."},{"id":"o3","goal":3,"star":true,"prompt":"Where on `[0, 2]` is `f(t) = 10te^{-t/3}` greatest?","boxes":[{"k":"t","pre":"`t =`"}],"_a":"GRpBGwIFGQ==","display":"`t = 2`","wrong":[{"k":"t","eq":3,"fb":"3 is outside `[0, 2]`; `f` is still rising at 2."}],"why":"`f′ = 10e^{-t/3}(1 - t/3) > 0` on `[0, 2]`, so `f` is increasing there and the maximum is at the endpoint `t = 2`."},{"id":"o4","goal":3,"star":true,"prompt":"Minimize `f(x) = e^x/x` for `x > 0`: the `x` and the minimum value.","boxes":[{"k":"x","pre":"`x =`"},{"k":"v","pre":"Minimum value"}],"_a":"GRpNGwIGSEQUGg8LFgBVXlAABAEKD1BTWwgBDEU=","display":"`x = 1`, minimum value `e`","general":"`f′ = e^x(x - 1)/x^2`.","why":"`f′ = {e^x · x - e^x}/{x^2} = e^x(x - 1)/x^2`: negative on `(0, 1)` and positive after, so the minimum is `f(1) = e`."},{"id":"o5","goal":[3,5],"star":true,"prompt":"Two drugs: `C_1(t) = 8te^{-t}` and `C_2(t) = 2te^{-t/2}`. At what time `t > 0` are they equal, and which peaks higher?","boxes":[{"k":"t","pre":"Equal at `t =`","unit":"h"},{"k":"c","pre":"Peaks higher","choice":[{"id":"c1","t":"`C_1`"},{"id":"c2","t":"`C_2`"}]}],"_a":"GRpBGwIFSlFVCgABAABWVFALDA4ABkhEARoPG1sGRhs=","display":"`t = 4 ln 2` h (≈ 2.77); `C_1` (`8/e` vs `4/e`)","wrong":[{"k":"t","eq":1.3862943611198906,"fb":"`8e^{-t} = 2e^{-t/2}` gives `e^{t/2} = 4`, so `t = 2 ln 4`."},{"k":"c","eq":"c2","fb":"Compare the peaks: `C_1(1) = 8/e` and `C_2(2) = 4/e`."}],"hints":["Divide both sides by `t` (fine here, `t > 0`).","`8e^{-t} = 2e^{-t/2}`, so `4 = e^{t/2}`.","`t = 2 ln 4 = 4 ln 2`. Peaks: `C_1(1) = 8/e`, `C_2(2) = 4/e`."],"why":"`8e^{-t} = 2e^{-t/2}` gives `e^{t/2} = 4`, so `t = 2 ln 4 = 4 ln 2` ≈ 2.77 h. `C_1` peaks at `C_1(1) = 8/e`, higher than `C_2(2) = 4/e`."},{"id":"o6","goal":[4,5],"star":true,"prompt":"At price `p` dollars, `q = 5000e^{-0.04p}` units sell. Each costs $15 to make. Find the profit-maximizing price.","boxes":[{"k":"p","pre":"Price","money":true}],"_a":"GRpFGwIDVBs=","display":"$40","wrong":[{"k":"p","eq":25,"fb":"That maximizes revenue. Profit: `P′ ∝ 1 - 0.04(p - 15)`."},{"k":"p","eq":10,"fb":"Add the cost: `p - 15 = 25`."}],"hints":["Profit = (price − cost) × quantity.","`P′ = 5000e^{-0.04p}[1 - 0.04(p - 15)]`.","`p - 15 = 25`, so `p = 40`."],"why":"`P = (p - 15) · 5000e^{-0.04p}`, so `P′ = 5000e^{-0.04p}[1 - 0.04(p - 15)] = 0` when `p - 15 = 25`: $40."}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Brianna","how":"","goal":[2,5],"instruction":"Brianna made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the maximum of `C(t) = 12te^{-3t}` for `t ≥ 0`.","steps":["Product rule: `C′(t) = 12e^{-3t} + 12t · (e^{-3t})′`.","`(e^{-3t})′ = -3e^{-3t}`.","So `C′(t) = 12e^{-3t}(1 - 3t)`.","Set each factor to 0: `e^{-3t} = 0` gives `t = 0`, and `1 - 3t = 0` gives `t = 1/3`.","Compare `C(0) = 0` and `C(1/3) = 4/e`: the maximum is `4/e` at `t = 1/3`."],"_a":"UQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.","","Step 5 reaches the right answer, but it relies on step 4’s reasoning."],"fixes":[{"t":"`e^{-3t} = 0` only for negative `t`.","why":"It’s positive for every `t`.","_n":"1k1dd","_k":"932619cd"},{"t":"`e^{-3t} = 0` when `t = 3`.","why":"`e^{-9}` is small but positive.","_n":"1l10d","_k":"23d6ddde"},{"t":"`e^{-3t}` is never 0, so the only critical number is `t = 1/3`; `t = 0` is an endpoint to check, not a critical number.","why":"Only the factor `1 - 3t` can be 0.","_n":"1m0fd","_k":"1faf3251"},{"t":"Step 4 is correct.","why":"`e^0 = 1`, not 0. `e` to any power is positive. `e^{-kt} = 0` has no solution; only the other factor can be 0.","_n":"1n06d","_k":"2f5f102d"}],"hints":["What is `e^{-3 · 0}`?","`e^0 = 1`.","No value of `t` makes `e^{-3t} = 0`."]},{"id":"e2","goal":5,"task":"A store sells `q = 800e^{-p/25}` items at a price of `p` dollars. Find the price that maximizes revenue and the maximum revenue.","steps":["`R(p) = p · 800e^{-p/25}`.","`R′(p) = 800e^{-p/25}(1 - p/25)`.","`R′ = 0` when `p = 25`.","Maximum revenue = `q(25) = 800e^{-1}` ≈ 294.","The best price is $25, earning about $294."],"_a":"UQ==","stepFb":["Step 1 is correct: revenue = price × quantity.","Step 2 is correct.","Step 3 is correct.","","Step 5 reports step 4’s number."],"fixes":[{"t":"Maximum revenue = `R(25) = 25 · 800e^{-1} = 20 000/e` ≈ $7358.","why":"Revenue is `R`, not `q`.","_n":"1o07d","_k":"dd4e8122"},{"t":"`R(25) = 25 · 800` = $20 000.","why":"The factor `e^{-1}` is missing.","_n":"1p08d","_k":"77f1597d"},{"t":"Step 4 is correct.","why":"`q(25)` ≈ 294 is the number of items sold, not the money. Revenue is price × quantity. `q(25)` is how many sell, not how much money comes in.","_n":"1q09d","_k":"648a4a55"},{"t":"`R(25) = 800 · 25/25` = $800.","why":"That cancels the price with the exponent’s denominator.","_n":"1r0ad","_k":"d220848e"}],"hints":["What does `q` measure?","Items sold. Revenue is `R`.","`R(25) = 20 000/e`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the dose curve: that `@a{A}` never moves the peak, or that the peak lands exactly at `1/k`?"},{"id":"j2","q":"In your own words, why can you ignore the exponential factor when you look for critical numbers?"},{"id":"j3","q":"Explain to a friend how a price cap or a closed time window can change the answer to an optimization problem."},{"id":"j4","q":"Which step of these problems do you still find hardest: building the model, differentiating, or interpreting? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"\u003cspan class=\"m\">d/d\u003ci>t\u003c/i>\u003c/span> `(te^{-4t})` = ?","options":[{"t":"`-4e^{-4t}`","why":"That multiplies the two derivatives. `t` and `e^{-kt}` are both changing: use the product rule.","_n":"1s0bd","_k":"d0e5564c"},{"t":"`e^{-4t}(1 - 4t)`","why":"Product rule: `1 · e^{-4t} + t · (-4e^{-4t}) = e^{-4t}(1 - 4t)`.","_n":"1t0cd","_k":"03fb7b4d"},{"t":"`e^{-4t}`","why":"That’s only the first term of the product rule.","_n":"1u0dd","_k":"6560113c"},{"t":"`e^{-4t}(1 + 4t)`","why":"The exponent’s derivative is −4.","_n":"1v0ed","_k":"26d46d6e"}]},"b":{"prompt":"\u003cspan class=\"m\">d/d\u003ci>t\u003c/i>\u003c/span> `(te^{-5t})` = ?","options":[{"t":"`e^{-5t}`","why":"That’s only the first term of the product rule.","_n":"1w0fd","_k":"7d63648c"},{"t":"`e^{-5t}(1 - 5t)`","why":"Product rule: `1 · e^{-5t} + t · (-5e^{-5t}) = e^{-5t}(1 - 5t)`.","_n":"1x0cd","_k":"5c137859"},{"t":"`-5e^{-5t}`","why":"That multiplies the two derivatives. `t` and `e^{-kt}` are both changing: use the product rule.","_n":"1y0bd","_k":"c5375eee"},{"t":"`e^{-5t}(1 + 5t)`","why":"The exponent’s derivative is −5.","_n":"1z0ad","_k":"c5121636"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What are the critical numbers of `f(x) = (x - 6)e^{x/2}`?","options":[{"t":"`x = 6`","why":"That’s where `f = 0`, not `f′`.","_n":"2009d","_k":"e10e937d"},{"t":"`x = 8`","why":"The chain factor is `+1/2`: `1 + (x - 6)/2`, not `1 - (x - 6)/2`.","_n":"2110d","_k":"d2bb24f2"},{"t":"`x = 4`","why":"`f′ = e^{x/2}[1 + (x - 6)/2] = e^{x/2}(x - 4)/2`.","_n":"220fd","_k":"f0973003"},{"t":"`x = 0` and `x = 4`","why":"`e^{x/2}` is never 0.","_n":"230ed","_k":"2354dd02"}]},"b":{"prompt":"What are the critical numbers of `f(x) = (x - 5)e^{x/3}`?","options":[{"t":"`x = 0` and `x = 2`","why":"`e^{x/3}` is never 0.","_n":"240dd","_k":"2ed06014"},{"t":"`x = 5`","why":"Zero of `f`, not `f′`.","_n":"2514d","_k":"4ed895fa"},{"t":"`x = 2`","why":"`f′ = e^{x/3}(x - 2)/3`.","_n":"2613d","_k":"ce9a23e1"},{"t":"`x = 8`","why":"The chain factor is `+1/3`: `1 + (x - 5)/3`, not `1 - (x - 5)/3`.","_n":"271af","_k":"05f51753"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"`C(t) = 30te^{-t/4}` mg/L. When does the concentration peak?","options":[{"t":"At `t = 4` h","why":"`C′ = 30e^{-t/4}(1 - t/4)`.","_n":"281bf","_k":"c89205a4"},{"t":"At `t = 1/4` h","why":"The peak is at `1/k` with `k = 1/4`.","_n":"2918f","_k":"53172f14"},{"t":"At `t = 7.5` h","why":"30/4 mixes `@a{A}` into the peak time.","_n":"2a19f","_k":"e87b28b9"},{"t":"At `t = 30` h","why":"`@a{A}` doesn’t set the time.","_n":"2b1ef","_k":"f051368a"}]},"b":{"prompt":"`C(t) = 18te^{-t/6}` mg/L. When does the concentration peak?","options":[{"t":"At `t = 1/6` h","why":"The peak is at `1/k` with `k = 1/6`.","_n":"2c1ff","_k":"193e6234"},{"t":"At `t = 18` h","why":"`@a{A}` doesn’t set the time.","_n":"2d1cf","_k":"0eacf2ae"},{"t":"At `t = 6` h","why":"`C′ = 18e^{-t/6}(1 - t/6)`.","_n":"2e1df","_k":"d18f673f"},{"t":"At `t = 3` h","why":"18/6 mixes `@a{A}` into the peak time.","_n":"2f12f","_k":"dc8caa1d"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Find the absolute maximum of `f(t) = 6te^{-t/2}` on `[0, 5]`.","use":"`e ≈ 2.718`","options":[{"t":"12","why":"`f(2) = 12e^{-1}`, not 12.","_n":"2g13f","_k":"dee55081"},{"t":"`6/e`","why":"That evaluates at `t = 1`; the peak is at `t = 2`.","_n":"2h20f","_k":"284c761c"},{"t":"`12/e`","why":"Peak at `t = 2`, inside `[0, 5]`; `f(2) = 12e^{-1}` ≈ 4.4, more than `f(5) = 30e^{-5/2}` ≈ 2.5 and `f(0) = 0`.","_n":"2i1ff","_k":"f80826e5"},{"t":"`30e^{-5/2}`","why":"That’s the endpoint value, smaller than the peak.","_n":"2j22f","_k":"849466d4"}]},"b":{"prompt":"Find the absolute maximum of `f(t) = 9te^{-t/3}` on `[0, 6]`.","use":"`e ≈ 2.718`","options":[{"t":"27","why":"`f(3) = 27e^{-1}`, not 27.","_n":"2k21f","_k":"ae0daa7a"},{"t":"`54e^{-2}`","why":"That’s the endpoint value, smaller than the peak.","_n":"2l1cf","_k":"e069dde6"},{"t":"`9/e`","why":"That evaluates at `t = 1`; the peak is at `t = 3`.","_n":"2m1bf","_k":"509687ba"},{"t":"`27/e`","why":"Peak at `t = 3` inside the interval; `f(3) = 27e^{-1}` ≈ 9.9.","_n":"2n1ef","_k":"bebd6e09"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Find the absolute maximum of `g(t) = 8te^{-t/5}` on `[0, 3]`.","use":"`e ≈ 2.718`","options":[{"t":"`24e^{-3/5}`","why":"The peak is at `t = 5`, outside `[0, 3]`. `g` is increasing on `[0, 3]`, so the maximum is `g(3)`.","_n":"2o1df","_k":"e245c395"},{"t":"`40/e`","why":"That’s the value at `t = 5`, outside the interval.","_n":"2p18f","_k":"67ce5bf5"},{"t":"`8e^{-1/5}`","why":"That evaluates at `t = 1`.","_n":"2q17f","_k":"a0cf2887"},{"t":"0","why":"That’s the minimum, at `t = 0`.","_n":"2r373","_k":"e8185199"}]},"b":{"prompt":"Find the absolute maximum of `g(t) = 4te^{-t/6}` on `[0, 2]`.","use":"`e ≈ 2.718`","options":[{"t":"`4e^{-1/6}`","why":"That evaluates at `t = 1`.","_n":"2s363","_k":"9acb96c9"},{"t":"0","why":"That’s the minimum, at `t = 0`.","_n":"2t353","_k":"36da8b01"},{"t":"`24/e`","why":"That’s the value at `t = 6`, outside the interval.","_n":"2u343","_k":"473f3629"},{"t":"`8e^{-1/3}`","why":"The peak at `t = 6` is outside; maximum at `t = 2`.","_n":"2v333","_k":"ddef052e"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"`f(x) = x^2e^{-x}`. Which describes its critical points?","options":[{"t":"A local minimum at (0, 0) and a local maximum at `(2, 4/e^2)`","why":"`f′ = xe^{-x}(2 - x)`: − before 0, + between 0 and 2, − after 2.","_n":"2w323","_k":"a44769de"},{"t":"A local maximum at `(2, 4/e^2)` only","why":"The factor `x` gives a second critical number, 0.","_n":"2x313","_k":"9e688db9"}, u can divide because it’s never 0.","_n":"38303","_k":"0031f1a3"},{"t":"“`e^{x^2}` is positive for every `x`, so the product is 0 only when `x - 3 = 0`.”","why":"A positive factor can’t make a product 0.","_n":"39293","_k":"021923ef"},{"t":"“`e^{x^2} = 0` when `x = 0`, but that root is extraneous.”","why":"`e^0 = 1`. `e` to any power is positive. `e^{-kt} = 0` has no solution; only the other factor can be 0.","_n":"3a2a3","_k":"ae26bedc"},{"t":"“Take ln of both sides.”","why":"`ln 0` is undefined; that step fails.","_n":"3ba33","_k":"7b667874"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"A revenue model gives the best price as `p` = $40, with `R(40) = 80 000/e`. Which statement is best?","use":"`e ≈ 2.718`","options":[{"t":"“The greatest revenue is $40.”","why":"$40 is the price; the revenue is `80 000/e`.","_n":"3ca23","_k":"aa69d478"},{"t":"“The revenue at $40 is `80 000e` ≈ $217 000.”","why":"`e^{-1}` divides by `e`.","_n":"3da53","_k":"9ad3c100"},{"t":"“Charging $40 gives the greatest revenue, `80 000/e` ≈ $29 430.”","why":"It names the price, the revenue (exact and approximate) and the units.","_n":"3ea43","_k":"5c3d549f"},{"t":"“Demand is greatest at $40.”","why":"Demand is greatest at the lowest price.","_n":"3f9f3","_k":"81adf925"}]},"b":{"prompt":"A dose model peaks at `t = 3` h with `C(3) = 15/e` mg/L. Which statement is best?","use":"`e ≈ 2.718`","options":[{"t":"“The concentration is greatest at `15/e` ≈ 5.5 hours.”","why":"That’s the value, not the time.","_n":"3g9e3","_k":"348c7b6f"},{"t":"“The concentration is greatest 3 hours after the dose, about 5.5 mg/L.”","why":"It gives the time and the value `15/e` ≈ 5.5 mg/L, with units.","_n":"3ha13","_k":"2361f7ab"},{"t":"“The peak concentration is `15e` ≈ 40.8 mg/L.”","why":"`e^{-1}` divides by `e`.","_n":"3ia03","_k":"db38763c"},{"t":"“The concentration is 3 mg/L at its peak.”","why":"3 is the time, in hours; the peak value is `15/e` mg/L.","_n":"3jab3","_k":"0ae1d5bd"}]}},{"id":"a1","cat":"A","goal":4
