.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 40: hero equation, Span painter (Explore), Reach the target stations, V8 boxes, task */
.lc-a{color:var(--pen)}
.lc-b{color:var(--f3)}
.lc-heq{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:4px 12px}
.lc-nw{white-space:nowrap}
.lc-sep{color:var(--ink-2)}
.lc-hcap{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 14px;font-size:1.05rem}
.lc-hcap [data-st]{transition:opacity .45s ease}
@media (prefers-reduced-motion:reduce){ .lc-hcap [data-st]{transition:none} }

.lc-ex{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.lc-main,.lc-side{min-width:0}
.lc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.lc-vlab{font-weight:700;margin-right:4px}
.lc-warn{min-height:0;margin:0;font-weight:700;color:var(--hi-ink);border-radius:6px}
.lc-warn.on{background:var(--hi);padding:.35em .7em;margin:0 0 8px}
.lc-3d{outline-offset:3px;border-radius:6px}
.lc-3d:focus-visible{outline:3px solid var(--pen)}
.lc-3d canvas{cursor:grab}
.lc-views{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0}
.lc-views[hidden],.plot-wrap[hidden]{display:none}
.lc-coefs{display:grid;gap:4px;margin-top:8px}
.lc-sl{margin-top:4px}
.lc-sl output{color:var(--ink);font-weight:700}
.lc-tog,.lc-tgts{margin-bottom:8px}
.lc-tgts:empty{display:none}
.lc-drawer{border:1.5px solid var(--rule);border-radius:8px;padding:.4em .8em;margin:0 0 12px;background:var(--sheet)}
.lc-drawer summary{cursor:pointer;font-weight:700;min-height:28px;display:list-item}
.lc-drawer p{margin:.5em 0}
.lc-vval{font-size:1.1rem}
.lc-vrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.lc-vn{font-size:1.2rem;min-width:1.4em}
.lc-vsl{display:flex;flex-wrap:wrap;gap:4px 12px;flex:1;min-width:0}
.lc-mini{display:inline-flex;align-items:center;gap:4px;font-size:.95rem}
.lc-mini input{width:84px}
.lc-mini output{min-width:1.6em;text-align:right;font-weight:700}
.lc-read .m{white-space:normal}

.lc-st h3{margin-top:0}
.lc-st:first-child{margin-top:0;padding-top:0;border-top:0}
.lc-stl,.lc-str{min-width:0}
.lc-eqs{display:grid;gap:8px;margin:6px 0 10px}
.lc-eqr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:1.15rem}
.lc-eqn{min-width:1.8em;font-weight:600}
.lc-eqr .numin.short{width:3.6rem;text-align:center}
.lc-moves{margin-top:12px}
.lc-mvdone{margin:0 0 8px;padding-left:1.4em;display:grid;gap:4px}
.lc-mvdone li{padding:.2em .2em}
.lc-mvq{margin:8px 0 6px}
.lc-mvch{display:grid;gap:6px}
.lc-mvb{justify-content:flex-start;text-align:left;white-space:normal;height:auto;min-height:40px}
.lc-mvb .m{white-space:normal}
.lc-note{font-weight:700;margin:10px 0 0}
.lc-first{margin:10px 0 4px}
.lc-ask{margin:6px 0;font-weight:600}
.lc-s3msg{margin:8px 0;font-weight:600}
.lc-s3msg.on{background:var(--hi-soft);border-radius:6px;padding:.35em .6em}
.lc-stl .alg{margin-top:10px}

.lc-bxs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 4px}
.lc-bxs label{display:flex;align-items:center;gap:8px;font-size:1.05rem}
.lc-bxs .numin.short{width:5.2rem}

.lc-step label{min-width:5.5rem}
.lc-lab{font-size:1.2rem}

@media (max-width:760px){
  .lc-ex{grid-template-columns:minmax(0,1fr)}
  .lc-mini input{width:70px}
}

s vector b. The span of a and b is every such combination.","eqSize":"sm","headline":"How far can two arrows take you?","text":"Stretch `vec{a}` by any amount `s` and `vec{b}` by any amount `t`, then add: that’s a \u003cstrong>linear combination\u003c/strong>. Everything you can reach this way is the \u003cstrong>span\u003c/strong>. Two arrows that aren’t parallel reach every point of the plane. Parallel arrows reach only a line. In space, two arrows reach a plane, and you need a third arrow off that plane to reach everything.","fig":{"aria":"The vectors a = (2, 1) and b = (−1, 2) from the origin with a skewed grid of lines parallel to them; 2a + 1b lands on (3, 4). When b turns to line up with a, the grid collapses into one line.","shape":"square"}},"goals":["I can write a vector as a linear combination `s vec{a} + t vec{b}`, by reading a skewed grid or by solving equations.","I can describe the span of one or two vectors in R²: a line through the origin, or all of R².","I can decide whether a set of vectors spans R² or R³, and explain why.","I can decide whether a vector is in the span of two vectors in R³, checking all three equations.","I can test whether three vectors in R³ are coplanar.","I can use linear combinations to solve problems: mixtures, motors and movement."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Linear systems","goal":1,"prompt":"Solve `x + y = 5` and `x - y = 1`.","options":[{"t":"`x = 3`, `y = 2`","why":"Adding: `2x = 6`.","_n":"09b1","_k":"d83843d4"},{"t":"`x = 2`, `y = 3`","why":"The values are swapped. Check: 2 − 3 ≠ 1.","_n":"19a1","_k":"b78a8285"},{"t":"`x = 6`, `y = -1`","why":"Adding gives `2x = 6`: divide by 2.","_n":"2991","_k":"13dc3bfe"},{"t":"`x = 3`, `y = -2`","why":"Sign slip: 3 + (−2) ≠ 5.","_n":"3a01","_k":"07aebd92"}],"hints":["Add the equations.","`2x = 6`.","`x = 3`, `y = 2`."]},{"id":"w2","skill":"Linear systems","goal":1,"prompt":"Solve `2s - t = 4` and `s + 3t = 9`.","options":[{"t":"`s = 6`, `t = 1`","why":"6 + 3 = 9, but 12 − 1 ≠ 4. Check the solution in both equations.","_n":"49f1","_k":"32c9d45f"},{"t":"`s = 3`, `t = -2`","why":"Sign slip moving `t`. Check: 6 + 2 ≠ 4.","_n":"59e1","_k":"22310b35"},{"t":"`s = 2`, `t = 3`","why":"The values are swapped. Check: 2(2) − 3 ≠ 4.","_n":"69d1","_k":"f3be7d33"},{"t":"`s = 3`, `t = 2`","why":"`t = 2s - 4`, so `7s - 12 = 9`.","_n":"7941","_k":"f64cbae5"}],"hints":["Solve the first equation for `t`.","`t = 2s - 4`; substitute.","`s = 3`, `t = 2`."]},{"id":"w3","skill":"Parallel test","goal":2,"prompt":"Which vector is parallel to (2, −3)?","options":[{"t":"(3, −2)","why":"Swapping the components isn’t a scalar multiple.","_n":"8931","_k":"5b4b9652"},{"t":"(2, 3)","why":"Changing one sign isn’t a scalar multiple.","_n":"91f9","_k":"d7f3e75a"},{"t":"(−4, 6)","why":"`-2(2, -3)`.","_n":"a209","_k":"07c7c89e"},{"t":"(4, −9)","why":"Squaring a component isn’t scaling: 4 = 2 × 2, but −9 ≠ 2 × (−3).","_n":"b1d9","_k":"9375a8a7"}],"hints":["Parallel means a scalar multiple.","Both components must scale by the same number.","(−4, 6) = −2(2, −3)."]},{"id":"w4","skill":"Parallel test","goal":3,"prompt":"Are (1, 2, −1) and (−2, −4, 3) parallel?","options":[{"t":"Yes: any two vectors with negative parts are opposite","why":"Signs alone don’t decide.","_n":"c1e9","_k":"86b79793"},{"t":"No: the third ratio is −3, not −2","why":"−2/1 = −2 and −4/2 = −2, but 3/(−1) = −3.","_n":"d1b9","_k":"39c5d068"},{"t":"You can’t tell without drawing","why":"Ratios decide it.","_n":"e1c9","_k":"dca951ef"},{"t":"Yes: (−2, −4) = −2(1, 2)","why":"That checks only two components. The third ratio is 3/(−1) = −3.","_n":"f199","_k":"fdc7f922"}],"hints":["Compare all three ratios.","−2/1, −4/2, 3/(−1).","−2, −2, −3: not parallel."]},{"id":"w5","skill":"Component arithmetic","goal":1,"prompt":"`2(3, -1) - 3(1, 2) = ?`","options":[{"t":"(9, 4)","why":"That adds instead of subtracting.","_n":"g1a9","_k":"7777f30b"},{"t":"(3, 4)","why":"−2 − 6 = −8.","_n":"h179","_k":"cd2741 ive (`s = 2`, `t = -3`). `s` can be any real number: negative `s` goes the other way along the same line."},{"id":"p2","prompt":"2D; `vec{b}` is about to be dragged to (4, 2). What will the painted region become?","options":[{"t":"Still the whole plane","_n":"s109","_k":"f3a3851a"},{"t":"A line through the origin","_n":"t939","_k":"ce751e99"},{"t":"A strip between two lines","_n":"u949","_k":"27010830"},{"t":"A single point","_n":"v959","_k":"f5f515ae"}],"explain":"(4, 2) = 2(2, 1), so every combination is a multiple of (2, 1). Parallel vectors are multiples of each other, so every combination stays on one line."},{"id":"p3","prompt":"3D, `vec{a} = (1, 0, 1)`, `vec{b} = (0, 1, 1)`. What does span{`vec{a}`, `vec{b}`} look like?","options":[{"t":"The plane through the tips of `vec{a}` and `vec{b}` only","_n":"w969","_k":"e3f7f574"},{"t":"A line","_n":"x979","_k":"705330b6"},{"t":"A plane through the origin","_n":"y989","_k":"34a28773"},{"t":"All of R³","_n":"z999","_k":"c2806d4e"}],"explain":"Two non-parallel arrows give a plane, and `s = t = 0` puts the origin in it."},{"id":"p4","prompt":"3D; `vec{c} = (1, 1, 2)` is added. Will the span grow?","options":[{"t":"No: `vec{c}` lies in the same plane","_n":"109a9","_k":"35a88fd2"},{"t":"No, it shrinks to a line","_n":"118b9","_k":"91898290"},{"t":"Yes, it becomes a cube","_n":"128c9","_k":"2786f01e"},{"t":"Yes: three vectors always span R³","_n":"139da","_k":"64dabd2f"}],"explain":"`vec{c} = vec{a} + vec{b}`, so it adds nothing new. Two vectors only reach a plane. A third vector helps only if it’s off that plane."}],"chalIntro":"Use the span painter to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"2D, `vec{a} = (2, 1)`, `vec{b} = (-1, 2)`. Set `s` and `t` to reach (−1, 7).","why":"`s = 1`, `t = 3`: (2, 1) + (−3, 6) = (−1, 7).","hints":["One equation per component.","`2s - t = -1` and `s + 2t = 7`.","`s = 1`, `t r means one vector is a combination of the other two.","Use the first two components of `(0, 5, 1) = s(1, 2, k) + t(2, -1, 1)`: `s + 2t = 0` and `2s - t = 5`.","`s = 2`, `t = -1`; the third component gives `2k - 1 = 1`, so `k = 1`."]},{"id":"s6","goal":6,"star":true,"prompt":"Fertilizer A has (N, P, K) = (2, 1, 1) units per scoop; B has (1, 1, 3). How many scoops of each give exactly (7, 4, 6)?","boxes":[{"k":"s","label":"Scoops of A"},{"k":"t","label":"Scoops of B"}],"_a":"GhFLEA9DAhdNEUwQD0MAFxw=","display":"3 scoops of A and 1 scoop of B","fb":"`2s + t = 7` and `s + t = 4` give `s = 3`, `t = 1`; check K: 3 + 3 = 6 ✓.","why":"N and P give `s = 3`, `t = 1`; K: 3(1) + 1(3) = 6 ✓.","hints":["`s` scoops of A and `t` of B: `s(2, 1, 1) + t(1, 1, 3)`.","N and P give `s = 3`, `t = 1`.","K: 3(1) + 1(3) = 6 ✓, so 3 of A and 1 of B."]}],"msgs":{"boxes":"Set up one equation per component, solve two of them, then check the rest.","err":"Type a whole number or a fraction such as 3/2 or −4 in each box."}},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Nia","how":"","goal":[1,2,4],"instruction":"Nia made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Is (3, 5, 2) in span{(1, 2, 0), (1, 1, 1)}?","steps":["`s(1, 2, 0) + t(1, 1, 1) = (3, 5, 2)`","`x`: `s + t = 3`; `y`: `2s + t = 5`","Subtracting: `s = 2`, so `t = 1`.","So (3, 5, 2) = 2(1, 2, 0) + 1(1, 1, 1), and it’s in the span."],"_a":"Ug==","stepFb":["Step 1 sets it up correctly.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Use `s = 1`, `t = 2` instead.","why":"That gives (3, 4, 2).","_n":"1w98a","_k":"e3dae5d7"},{"t":"Two vectors span R³, so it’s in the span anyway.","why":"Two vectors only span a plane. Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"1x8ba","_k":"e8013e75"},{"t":"Check `z`: 0(2) + 1(1) = 1, not 2. So (3, 5, 2) is not in the span.","why":"`s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"1y8ca","_k":"64c74a9a"},{"t":"Step 4 is correct.","why":"2(1, 2, 0) + (1, 1, 1) = (3, 5, 1). `s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"1z8da","_k":"4b96a4f9"}],"hints":["Did step 4 use all three components?","Work out the `z`-component of 2(1, 2, 0) + 1(1, 1, 1).","1 ≠ 2: not in the span."]},{"id":"e2","goal":2,"task":"Do `vec{a} = (2, -1)` and `vec{b} = (-6, 3)` span R²?","steps":["Two vectors in R² span R² if they aren’t parallel.","(−6, 3) = −3(2, −1)","The scalar is negative, so they point opposite ways and aren’t parallel.","So they span R²."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"They span only the ray in `vec{a}`’s direction.","why":"Negative multiples cover the other half of the line. `s` can be any real number: negative `s` goes the other way along the same line.","_n":"208ea","_k":"a0b58617"},{"t":"Step 3 is correct.","why":"Parallel vectors are multiples of each other, so every combination stays on one line.","_n":"2187a","_k":"028108fc"},{"t":"Opposite directions still count as parallel: `vec{b} = -3vec{a}`, so the span is only the line `y = -{1}/{2}x`.","why":"Parallel vectors are multiples of each other, so every combination stays on one line.","_n":"2288a","_k":"090c327b"},{"t":"They span R² because their lengths differ.","why":"Length doesn’t matter; direction does.","_n":"2389a","_k":"36aa3200"}],"hints":["What does ‘parallel’ mean for vectors?","One is a scalar multiple of the other, positive or negative.","Parallel: a line."]},{"id":"e3","goal":1,"task":"Write (1, 8) as a linear combination of `vec{a} = (3, 2)` and `vec{b} = (-1, 2)`.","steps":["`s(3, 2) + t(-1, 2) = (1, 8)`","`3s - t = 1` and `2s + 2t = 8`","From the first, `t = 3s - 1`.", ich describes span{(4, 1)} in R²?","options":[{"t":"The whole line through the origin with direction (4, 1), that is, `y = x/4`","why":"Every multiple `s(4, 1)` is on that line, and `s` can be any real number.","_n":"2c188","_k":"9c53b2a2"},{"t":"All of R².","why":"One vector spans a line.","_n":"2d1b8","_k":"2c111920"},{"t":"The arrow from (0, 0) to (4, 1).","why":"`s` can be any real number: negative `s` goes the other way along the same line.","_n":"2e1a8","_k":"ecec5936"},{"t":"The half of that line with `x ≥ 0`.","why":"`s` can be any real number: negative `s` goes the other way along the same line.","_n":"2f0d8","_k":"bf648e7b"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"`(7, -2) = s(2, -1) + t(1, 1)`. Find `s` and `t`.","options":[{"t":"`s = 7`, `t = -2`","why":"`s` and `t` are how many of each vector you use. Find them by solving; they’re rarely the target’s numbers.","_n":"2g0c8","_k":"85c10215"},{"t":"`s = 3`, `t = -1`","why":"Check: (6, −3) + (−1, −1) = (5, −4).","_n":"2h0f8","_k":"fee214a7"},{"t":"`s = 1`, `t = 3`","why":"Swapped: (2, −1) + (3, 3) = (5, 2).","_n":"2i108","_k":"9d8b2feb"},{"t":"`s = 3`, `t = 1`","why":"`2s + t = 7` and `-s + t = -2`: subtract to get `3s = 9`.","_n":"2j0d8","_k":"b0e065c4"}]},"b":{"prompt":"`(-1, 5) = s(2, -1) + t(1, 1)`. Find `s` and `t`.","options":[{"t":"`s = -2`, `t = 3`","why":"`2s + t = -1` and `-s + t = 5`: subtract to get `3s = -6`.","_n":"2k0e8","_k":"1c25b1dc"},{"t":"`s = 3`, `t = -2`","why":"Swapped: (6, −3) + (−2, −2) = (4, −5).","_n":"2l0b8","_k":"0e41d567"},{"t":"`s = 2`, `t = 3`","why":"Check: (4, −2) + (3, 3) = (7, 1).","_n":"2m0c8","_k":"c0de0a3f"},{"t":"`s = -1`, `t = 5`","why":"`s` and `t` are how many of each vector you use. Find them by solving; they’re rarely the target’s numbers.","_n":"2n098","_k":"d8abad3e"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which set spans R³?","options":[{"t":"{(1, 0, 0), (0, 1, 0)}","why":"Two vectors span only a plane. Two vectors only reach a plane. A third non-parallel vectors span a plane.","_n":"305aa","_k":"ad64a19f"},{"t":"Yes: (3, 1, 4) = `2vec{a} + vec{b}`","why":"`2vec{a} + vec{b} = (3, 1, 2)`. `s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"3167a","_k":"24b29259"},{"t":"No: `s = 2`, `t = 1` fit the first two components but give `z = 2`, not 4","why":"`s + t = 3` and `s - t = 1` give `s = 2`, `t = 1`; then `z = 2t = 2`.","_n":"3266a","_k":"063c4780"},{"t":"Yes: every vector in R³ is.","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"3369a","_k":"d22f907d"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"For which `k` are (1, 0, 2), (0, 1, −1) and `(3, -2, k)` coplanar?","options":[{"t":"No value: three vectors are never coplanar.","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"3468a","_k":"89d17b93"},{"t":"`k = 4`","why":"−2 × (−1) = +2, so 6 + 2.","_n":"3563a","_k":"2eaa99e9"},{"t":"`k = 8`","why":"`(3, -2, k) = 3(1, 0, 2) - 2(0, 1, -1)`, so `k = 6 + 2 = 8`.","_n":"3662a","_k":"a7d4d878"},{"t":"`k = 1`","why":"That’s `s + t`; use the third components.","_n":"3765a","_k":"24ac5985"}]},"b":{"prompt":"For which `k` are (1, 1, 0), (0, 2, 1) and `(2, k, 3)` coplanar?","options":[{"t":"`k = 4`","why":"The `y`-component is `s + 2t`.","_n":"3864a","_k":"926ec8fb"},{"t":"`k = 5`","why":"That’s `s + t`.","_n":"395fa","_k":"35b67dd9"},{"t":"`k = 8`","why":"`x` gives `s = 2`, `z` gives `t = 3`, so `k = 2 + 6`.","_n":"3a5ea","_k":"2a2f739d"},{"t":"No value.","why":"Three vectors can be coplanar: here `(2, k, 3) = 2(1, 1, 0) + 3(0, 2, 1)` when `k = 8`. Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"3b55a","_k":"9249c179"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"`vec{a}` and `vec{b}` are non-parallel vectors in R³. Which vector, added to {`vec{a}`, `vec{b}`}, is \u003cstrong>guaranteed not\u003c/strong> to make the set span R³?","options":[{"t":"`2vec{a} - 3vec{b}`","why":"It’s a combination of `vec{a}` and `vec{b}`, so it lies in their plane.","_n":"3c56a","_k":"0e559720"},{"t":"Any third vector, since three vectors always span R³.","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"3d57a","_k":"3667b841"},{"t":"Any vector that isn’t parallel to `vec{a}` or `vec{b}`.","why":"It could still lie in their plane, or it could leave it: not guaranteed either way.","_n":"3e58a","_k":"aa9c31cf"},{"t":"A vector longer than both `vec{a}` and `vec{b}`.","why":"Length doesn’t decide it.","_n":"3f51a","_k":"f6865769"}]},"b":{"prompt":"`vec{a}` and `vec{b}` are non-parallel vectors in R². Which statement about span{`vec{a}`, `vec{b}`, `vec{a} + vec{b}`} is true?","options":[{"t":"It’s only a line, because `vec{a} + vec{b}` depends on `vec{a}` and `vec{b}`.","why":"Dependence makes it redundant, not smaller.","_n":"3g52a","_k":"17a0ab2b"},{"t":"It’s a plane in R³.","why":"These are vectors in R².","_n":"3h53a","_k":"c66d91f1"},{"t":"It’s bigger than R².","why":"Nothing in R² can span more than R².","_n":"3i54a","_k":"4200783f"},{"t":"It’s all of R²; the vector `vec{a} + vec{b}` isn’t needed","why":"`vec{a}` and `vec{b}` already span R²; `vec{a} + vec{b}` adds nothing new.","_n":"3j5da","_k":"c6746f47"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why (2, 1) and (−4, −2) don’t span R²?","options":[{"t":"“They point opposite ways, so they cancel to `vec{0}`.”","why":"They cancel only for particular `s` and `t`.","_n":"3k5ea","_k":"e1c90988"},{"t":"“Two vectors never span R².”","why":"Non-parallel pairs do.","_n":"3l5ba","_k":"808e1578"},{"t":"“(−4, −2) = −2(2, 1), so every combination `s(2, 1) + t(-4, -2) = (s - 2t)(2, 1)` is a multiple of (2, 1). The span is only the line `y = x/2`.”","why":"Parallel vectors are multiples of each other, so every combination stays on one line.","_n":"3m5aa","_k":"20ec5d85"},{"t":"“Their lengths are different.”","why":"Length doesn’t matter.","_n":"3n59a","_k":"5a1ce319"}]},"b":{"prompt":"Which is the best explanation of why (1, 0, 0) and (0, 1, 0) don’t span R³?","options":[{"t":"“They do span R³ if `s` and `t` are large enough.”","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"3o58a","_k":"7211c355"},{"t":"“Every combination `s(1, 0, 0) + t(0, 1, 0) = (s, t, 0)` has `z = 0`, so (0, 0, 1) can’t be reached. The span is only the `xy`-plane.”","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"3p57a","_k":"3ded64d2"},{"t":"“They’re unit vectors, too short to reach far.”","why":"Scalars fix length.","_n":"3q56a","_k":"31c33371"},{"t":"“They’re perpendicular, and perpendicular vectors never span.”","why":"`vec{i}`, `vec{j}`, `vec{k}` are perpendicular and span R³.","_n":"3r55a","_k":"c5b7e5c9"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"A student solves `s(1, 2, 1) + t(0, 1, 3) = (2, 5, 4)` using the first two components and gets `s = 2`, `t = 1`. Which statement is correct?","options":[{"t":"“The student is done: two equations find two unknowns.”","why":"`s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"3s54a","_k":"1af2da5d"},{"t":"“The student should have used the last two components instead; those decide it.”","why":"All three must hold; no pair decides alone.","_n":"3t63a","_k":"27ce96f8"},{"t":"“The answer is `s = 2`, `t = 1`, because the first component works.”","why":"`s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"3u62a","_k":"b6620cdc"},{"t":"“The third component must be checked: 2(1) + 1(3) = 5 ≠ 4, so (2, 5, 4) is not in the span.”","why":"`s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"3ve9a","_k":"3fb154de"}]},"b":{"prompt":"A student solves `s(1, 0, 2) + t(1, 1, 0) = (3, 1, 4)` and gets `s = 2`, `t = 1` from the first two components. Which statement is correct?","options":[{"t":"“The third component checks: 2(2) + 1(0) = 4, so (3, 1, 4) = 2(1, 0, 2) + (1, 1, 0) is in the span.”","why":"All three equations hold, so the vector is in the span.","_n":"3weaa","_k":"24ba093b"},{"t":"“It’s in the span because 3 + 1 = 4.”","why":"A coincidence of the target’s numbers proves nothing.","_n":"3xe7a","_k":"324207cd"},{"t":"“Since the first two equations have a solution, no check is needed.”","why":"`s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"3ye8a","_k":"f0be0123"},{"t":"“Two vectors can’t reach a vector in R³.”","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"3ze5a","_k":"51c66171"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Paint colour A is (red, blue, white) = (1, 0, 2) parts per tin; colour B is (0, 1, 1). How many tins of each make a batch of exactly (3, 2, 8)?","options":[{"t":"3 tins of A and 2 tins of B","why":"Red gives `s = 3`, blue gives `t = 2`; white: 6 + 2 = 8, which checks.","_n":"40e6a","_k":"5c12adae"},{"t":"3 tins of A, 2 tins of B, plus 2 extra parts of white","why":"3(2) + 2(1) = 8 already; no extra is needed.","_n":"41e3a","_k":"488eb3b9"},{"t":"2 tins of A and 3 tins of B","why":"That’s (2, 3, 7).","_n":"42e4a","_k":"ada92e2d"},{"t":"Impossible: two colours can’t make three amounts.","why":"Some batches are possible: check this one with all three components. Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"43e1a","_k":"b13e4395"}]},"b":{"prompt":"Same colours: A is (1, 0, 2) and B is (0, 1, 1) parts of (red, blue, white) per tin. How many tins make exactly (2, 4, 7)?","options":[{"t":"Impossible: two colours can never make three amounts.","why":"Some batches are possible; this one isn’t.","_n":"44e2a","_k":"40bc6a71"},{"t":"Impossible: 2 tins of A and 4 of B give 8 parts white, not 7","why":"Red forces `s = 2` and blue `t = 4`; white: 4 + 4 = 8 ≠ 7.","_n":"45cfa","_k":"94e617e9"},{"t":"2 tins of A and 4 tins of B","why":"That gives 8 parts white, not 7. `s` and `t` must work in \u003cstrong>every\u003c/strong> component. Check the third equation before you say yes.","_n":"46cea","_k":"28ecf20a"},{"t":"4 tins of A and 2 tins of B","why":"That’s (4, 2, 10).","_n":"47d1a","_k":"4bb2eff2"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A crane moves its hook with two motors. One turn of motor 1 moves it by `vec{a} = (2, 0, 1)`; one turn of motor 2 by `vec{b} = (0, 1, 2)`. A negative number of turns means running in reverse. Can the hook be moved by (4, −3, −4)?","options":[{"t":"No: reverse turns aren’t allowed in a combination.","why":"`s` can be any real number: negative `s` goes the other way along the same line.","_n":"48d0a","_k":"cc55d458"},{"t":"Yes: 2 turns of motor 1 and 3 turns of motor 2","why":"That’s (4, 3, 8).","_n":"49d3a","_k":"6c5f36de"},{"t":"No: two motors can’t make a 3D move.","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"4ad2a","_k":"bce2f9c3"},{"t":"Yes: 2 turns of motor 1 and 3 reverse turns of motor 2","why":"`s = 2`, `t = -3`; `z`: 2 − 6 = −4, which checks.","_n":"4bd5a","_k":"ab65b544"}]},"b":{"prompt":"Motor 1 moves `vec{a} = (1, 2, 0)` per turn; motor 2 moves `vec{b} = (0, -1, 1)`. A negative number of turns means running in reverse. Can the hook be moved by (−2, −7, 3)?","options":[{"t":"No: reverse turns aren’t allowed.","why":"`s` can be any real number: negative `s` goes the other way along the same line.","_n":"4cd4a","_k":"eaa7b8df"},{"t":"Yes: 2 turns of motor 1 and 3 turns of motor 2","why":"That’s (2, 1, 3).","_n":"4dd7a","_k":"6387e133"},{"t":"No: two motors can’t make a 3D move.","why":"Two vectors only reach a plane. A third vector helps only if it’s off that plane.","_n":"4ed6a","_k":"e9e66683"},{"t":"Yes: 2 reverse turns of motor 1 and 3 turns of motor 2","why":"`s = -2`; `y`: `-4 - t = -7` gives `t = 3`; `z`: 3, which checks.","_n":"4f5d9","_k":"fb97a2ee"}]}}]},"task":{"title":"Through the target","summary":"Through the target","statement":"\u003cp>`vec{a} = (1, 2, 2)` is fixed. Choose a second vector `vec{b}` so that the plane they span passes through the target point (3, 2, 4). Find every answer.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`vec{b}` is not parallel to `vec{a}`.\u003c/li>\u003cli>(3, 2, 4) is in span{`vec{a}`, `vec{b}`}.\u003c/li>\u003cli>`|vec{b}| = √5`.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">`vec{b}`’s components are whole numbers from −3 to 3. The 3D view shows `vec{a}`, `vec{b}`, their span plane and the target, which glows when it lies on the plane. The \u003cstrong>`s`, `t` finder\u003c/strong> solves for the combination when the target is in the span.\u003c/p>","checks":["`vec{b}` is not parallel to `vec{a}`","The target is in the span","`|vec{b}| = √5`"],"tips":["A multiple of (1, 2, 2) gives only a line; the target isn’t on that line.","Any `vec{b}` of the form `(3, 2, 4) - s vec{a}` (or a multiple of it) puts the target in the span. Try `s = 2` or `s = 3`.","Length √5 means the squares add to 5, so the components are 0, 1 and 2 in some order, with signs."],"explainPrompt":"Explain how you found a `vec{b}` that puts the target in the span, and why each answer’s opposite also works.","vocab":"Use the words linear combination, span and plane.","after3":"They come in opposite pairs, because `vec{b}` and `-vec{b}` span the same plane. `(3, 2, 4) - 2vec{a} = (1, -2, 0)`, and `(3, 2, 4) - 3vec{a} = (0, -4, -2) = 2(0, -2, -1)`.","afterAt":4},"cards":[["Linear combination","`s vec{a} + t vec{b}` for any real `s`, `t` (negatives and fractions allowed)."],["Span","The set of all linear combinations."],["span{`vec{a}`}","The whole line through the origin along `vec{a}` (both directions)."],["Two vectors in R²","Not parallel: span R². Parallel: span a line."],["Two vectors in R³","Not parallel: a plane through the origin. Never all of R³."],["Three vectors in R³","Span R³ unless they’re coplanar."],["Every span contains…","the origin (take all coefficients 0)."],["Finding `s` and `t`","One equation per component; solve, then check every equation."],["In R³, check the third!","Two equations find `s`, `t`; the third decides whether the vector is in the span."],["Coplanar test","`vec{c} = s vec{a} + t vec{b}` has a solution."],["Redundant vector","A vector already in the span adds nothing."],["`vec{i}`, `vec{j}`, `vec{k}` span R³","`(a, b, c) = a vec{i} + b vec{j} + c vec{k}`."]]}};</script>
