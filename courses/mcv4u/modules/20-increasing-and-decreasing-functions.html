.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 20: hero, V5 panels + V11 slope strip (Explore), V11 build chart, V14 stroke pad (Part 3), builds, task */
.id-heq{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px}
.id-har{font-family:var(--font-ui);font-weight:700;color:var(--pen)}
.id-hdot{display:none}
.id-hwrap{position:relative}
.id-hfac{position:absolute;left:50%;top:60%;margin:0;transform:translate(-50%, calc(-50% + 12px));opacity:0;white-space:nowrap;
  background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px;padding:2px 10px;font-size:1.05rem;transition:opacity .5s ease, transform .5s ease;pointer-events:none}
.id-hfac.on{opacity:1;transform:translate(-50%, -50%)}
@media (prefers-reduced-motion:reduce){ .id-hfac{transition:none} }

canvas.plot.dp-top{aspect-ratio:16/10}
canvas.plot.dp-low{aspect-ratio:16/8}
canvas.plot.id-strip{aspect-ratio:auto;height:62px}
.dp-panels .dp-panel + .dp-panel{margin-top:6px}
.dp-panels .dp-lowwrap[hidden],.id-build[hidden]{display:none}
.dp-ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.dp-main,.dp-side{min-width:0}
.id-eq{min-height:2.4em}
.id-eq .id-d{display:block;font-size:.92em;color:var(--ink-2);margin-top:2px}
.id-key{margin:6px 0 0}
.id-note{min-height:1.3em;margin:6px 0 0;font-weight:600}
.id-fns{margin-bottom:6px}
.id-fns .chip{font-size:.86rem}
.id-how{margin:8px 0 10px}
.id-sl{margin-top:4px}
.id-sl output{color:var(--ink)}
.id-acts{margin:4px 0 10px}
.id-tc3l{margin:8px 0 4px;font-weight:600}
.id-tc3{gap:6px}
.id-tc3 .chip{min-width:2.6em;justify-content:center}
.id-warn{margin:10px 0 0;font-weight:600}
.id-build{margin-top:12px;border-top:1.5px solid var(--rule);padding-top:10px}

.id-mkrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.id-pm{min-width:40px;font-size:1.1rem}
.id-mkout{min-width:4.5em;text-align:center;font-size:1.05rem}
.id-place{margin:4px 0 8px}
.id-place [aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink)}
.id-scwrap{overflow-x:auto;position:relative;margin:6px 0}
table.id-sct th,table.id-sct td{padding:5px 8px;text-align:center;white-space:nowrap}
table.id-sct tbody th{text-align:left;font-weight:600}
table.id-sct .id-pt{font:600 .8rem var(--font-ui);color:var(--ink-2)}
table.id-sct .id-u{font:600 .78rem var(--font-ui);color:var(--ink-2)}
table.id-sct .id-arc{font-size:1.2rem;line-height:1}
table.id-sct .id-bad{background:var(--bad-bg)}
table.id-sct .id-k{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
.id-x{color:var(--red);font-weight:700;margin-right:3px}
.id-cell{min-width:40px;min-height:34px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:700 1.1rem var(--font-ui);cursor:pointer}
.id-cell:hover:not(:disabled){border-color:var(--ink)}
.id-cell[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink)}
.id-cell:disabled{cursor:default;opacity:.85}
.id-selnow{margin:4px 0 2px;font-weight:600}

/* Part 3 */
.p3-st h3{margin-top:0}
.p3-st:first-child{margin-top:0;padding-top:0;border-top:0}
canvas.plot.id-padc{aspect-ratio:16/9}
.id-tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.id-tile.on{outline:2px solid var(--ink);outline-offset:1px}
.id-slots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.id-slot{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:1.5px dashed var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:4px 12px;font:600 .92rem var(--font-ui);cursor:pointer}
.id-slot.set{border-style:solid;border-color:var(--pen)}
.id-slot:disabled{cursor:default}
.id-slott{font-size:1.3rem;color:var(--pen)}
.id-galp{margin:14px 0 6px;font-weight:600}
.id-gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.id-galf{margin:0}
.id-galf figcaption{margin-top:4px;text-align:center}
canvas.plot.id-galc{aspect-ratio:4/3}
.id-s2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px 24px;align-items:start}
.id-s2g .plot-wrap + .plot-wrap{margin-top:6px}
#id-s3padw{margin-top:8px}

/* Practice */
.id-bdots{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.id-bfd{display:block;margin-top:6px;color:var(--ink-2);font-size:.95em}
.id-stg{list-style:none;display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 4px;padding:0;font:600 .85rem var(--font-ui);color:var(--ink-2)}
.id-stg li.now{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.id-stg li.done{color:var(--green)}
.id-ivrow{flex-wrap:wrap;gap:8px;margin:8px 0}
.id-ivrow label{min-width:8em}
.id-ivin{min-width:12em;flex:1 1 14em}
.id-ins{display:inline-flex;gap:4px}
.id-ins .btn{min-width:36px}
.id-bpn{margin-top:14px}

/* Task */
.id-tstep{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.id-tstep label,.id-tlab{min-width:7.5rem;font-size:1.15rem}
.id-tstep .btn{min-width:40px;font-size:1.1rem}
.id-tstep .numin.short{width:5rem}
.id-tnow{margin:10px 0 0;font-size:1.1rem;min-height:1.4em}
#id-tchart{margin-bottom:8px}

@media (max-width:820px){
  .dp-ex,.id-s2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .dp-ex canvas.plot.dp-top,.dp-ex canvas.plot.dp-low{aspect-ratio:auto;height:220px}
  .id-gal{grid-template-columns:minmax(0,1fr)}
  .id-tstep label,.id-tlab{flex-basis:100%;min-width:0}
  .id-ivrow label{flex-basis:100%}
  .id-hfac{font-size:.9rem}
}

irection","text":"Where the slope of the tangent is \u003cstrong>positive\u003c/strong>, the graph rises: `f` is \u003cstrong>increasing\u003c/strong>. Where it’s \u003cstrong>negative\u003c/strong>, `f` is \u003cstrong>decreasing\u003c/strong>. A \u003cstrong>sign chart\u003c/strong> of the factored derivative shows every interval at once.","fig":{"html":"\u003cdiv class=\"id-hwrap\">\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"The graph of f(x) = x³ − 6x² + 9x + 1 with a tangent riding along it, and a sign strip under the x-axis.\">\u003c/canvas>\u003cp class=\"id-hfac\" id=\"id-hfac\" aria-hidden=\"true\">`f′(x) = 3(x - 1)(x - 3)`\u003c/p>\u003c/div>"}},"goals":["I can explain how the sign of `f′` tells me whether `f` is increasing or decreasing.","I can use a sign chart of a factored `f′` to state the intervals of increase and decrease in interval notation.","I can find `f′` for a polynomial and determine where `f` is increasing or decreasing.","I can handle points not in the domain and zeros of `f′` where the sign doesn’t change.","I can describe and sketch possible graphs of `f` from information about `f′`.","I can interpret increasing and decreasing intervals in context and under transformations."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Derivatives","goal":3,"prompt":"If `f(x) = 2x^3 + 3x^2 - 12x`, what is `f′(x)` in factored form?","options":[{"t":"`6(x - 2)(x + 1)`","why":"Expand: `6(x^2 - x - 2)`.","_n":"0b6e","_k":"2e530368"},{"t":"`6(x + 2)(x - 1)`","why":"`f′ = 6x^2 + 6x - 12 = 6(x^2 + x - 2)`.","_n":"1b9e","_k":"4b2d5bc9"},{"t":"`(x + 2)(x - 1)`","why":"It’s 6 times that.","_n":"2b8e","_k":"c08f6e14"},{"t":"`6x(x + 1)`","why":"−12 is still there.","_n":"3bbe","_k":"c34b9903"}],"hints":["Differentiate term by term.","`6x^2 + 6x - 12`; take out 6.","`6(x + 2)(x - 1)`."]},{"id":"w2","skill":"Derivatives","goal":4,"prompt":"If `f(x) = x + 9/x`, what is `f′(x)`?","options":[{"t":"`1 - 9/x`","why":"The exponent drops to −2.","_n":"4bae","_k":"9e865b8b"},{"t":"`1 - 9`","why":"Rewrite `9/x` as a power.","_n":"5bde","_k":"e0604123"},{"t":"`{x^2 + 9}/{x^2}`","why":"`9x^{-1} -> -9x^{-2}`.","_n":"6bce","_k":"f60e742b"},{"t":"`{x^2 - 9}/{x^2}`","why":"`1 - 9/x^2`, over a common denominator.","_n":"7bfe","_k":"c1792778"}],"hints":["`9/x = 9x^{-1}`.","`1 - 9x^{-2}`.","`{x^2 - 9}/{x^2}`."]},{"id":"w3","skill":"Sign charts","goal":2,"prompt":"What is the sign of `(x + 2)(x - 1)` when `x = 0`?","options":[{"t":"Undefined","why":"Polynomials are defined everywhere.","_n":"8bee","_k":"fe1c6503"},{"t":"Zero","why":"`x = 0` isn’t a root here.","_n":"9223","_k":"a7e06e23"},{"t":"Negative","why":"`(2)(-1) = -2`.","_n":"a233","_k":"82603eb5"},{"t":"Positive","why":"`(0 + 2)(0 - 1) = -2`.","_n":"b243","_k":"c5af13f2"}],"hints":["Substitute `x = 0`.","`(2)(-1)`.","Negative."]},{"id":"w4","skill":"Sign charts","goal":4,"prompt":"For which `x` is `(x - 3)^2` negative?","options":[{"t":"`x > 3`","why":"Squares are ≥ 0.","_n":"c253","_k":"6d7fd726"},{"t":"`x = 3`","why":"It’s 0 there.","_n":"d263","_k":"729ebeae"},{"t":"`x \u003c 3`","why":"That treats it like `(x - 3)`. A square is never negative.","_n":"e273","_k":"01b0204a"},{"t":"Never","why":"A square is never negative.","_n":"f283","_k":"acd159dd"}],"hints":["What do you know about squares?","Always ≥ 0.","Never negative."]},{"id":"w5","skill":"Interval notation","goal":2,"prompt":"Which is ‘all `x` less than −1, and all `x` greater than 2’ in interval notation?","options":[{"t":"(−1, 2)","why":"That’s the part between.","_n":"g293","_k":"2c150106"},{"t":"[−∞, −1] ∪ [2, ∞]","why":"Square brackets don’t belong at ∞ or at the excluded endpoints.","_n":"h2a3","_k":"ae0068c1"},{"t":"(−∞, −1) ∪ (2, ∞)","why":"Two separate pieces, each with round brackets.","_n":"i2b3","_k":"fa8a1870"},{"t":"(−∞, 2)","why":"That includes `-1 \u003c x \u003c 2`.","_n":"j343","_k":"98cfb905"}],"hints":["Two separate pieces.","Infinity always takes a round bracket.","(−∞, −1) ∪ (2, ∞)."]},{"id":"w6","skill":"Interval notation","goal":1,"prompt":"A graph rises from `x = -3` to `x = 1`, then falls. Over which interval is it increasing?","options":[{"t":"`(f(-3), f(1))`","why":"That uses `y`-values. Intervals of increase are `x`-intervals.","_n":"k333","_k":"36f33427"},{"t":"(−3, 1)","why":"Open interval of `x`-values; the turning point belongs to neither interval.","_n":"l363","_k":"a0d735ba"},{"t":"(1, ∞)","why":"That’s where it falls.","_n":"m353","_k":"5964882b"},{"t":"[−3, 1]","why":"That includes the turning points. Course convention: open intervals.","_n":"n383","_k":"194cb1cd"}],"hints":["Read the `x`-values.","From −3 to 1.","(−3, 1)."]}],"refreshers":{"Derivatives":"Differentiate, then factor completely: common factor first. Rewrite `k/x` as `kx^{-1}`.","Sign charts":"Mark each zero (and each point not in the domain) on a number line; test one value in each interval. A squared factor never changes sign.","Interval notation":"Open intervals of `x`-values, round brackets at ∞, ∪ to join pieces: increasing on (−∞, −1) ∪ (2, ∞)."}}},"explore":{"heading":"Slope sign strip","intro":"Drag the point along the graph. The strip underneath records the sign of the slope. Then build the sign chart yourself.","fns":[{"id":"F1","chip":"`x^3 - 6x^2 + 9x + 1`","eq":"`f(x) = x^3 - 6x^2 + 9x + 1`","d":"`f′(x) = 3(x - 1)(x - 3)`","plain":"f(x) = x³ − 6x² + 9x + 1"},{"id":"F2","chip":"`x^4 - 2x^2`","eq":"`f(x) = x^4 - 2x^2`","d":"`f′(x) = 4x^3 - 4x`","plain":"f(x) = x⁴ − 2x²"},{"id":"F3","chip":"`x^3`","eq":"`f(x) = x^3`","d":"`f′(x) = 3x^2`","plain":"f(x) = x³"},{"id":"F4","chip":"`x + 4/x`","eq":"`f(x) = x + 4/x`","d":"`f′(x) = 1 - 4/x^2 = {(x - 2)(x + 2)}/{x^2}`","plain":"f(x) = x + 4/x"},{"id":"Fc","chip":"`x^3 - cx`","eq":"`f(x) = x^3 - cx`","d":"`f′(x) = 3x^2 - c`","plain":"f(x) = x³ − cx"},{"id":"Fb","chip":"`x^3 + bx^2 + 3x`","eq":"`f(x) = x^3 + bx^2 + 3x`","d":"`f′(x) = 3x^2 + 2bx + 3`","plain":"f(x) = x³ + bx² + 3x"}],"modes":[{"id":"trace","t":"Trace"},{"id":"build","t":"Build the chart"},{"id":"deriv","t":"Derivative view"}],"modeHow":{"trace":"The strip paints as the probe moves: “+” where the slope is positive, “−” where it’s negative. Arrow keys move the probe by 0.1; Shift moves it by 1.","build":"Move the marker (tap the strip, or use − and +), then place each zero of `f′` and each point where `f′` is undefined. Fill in the signs and arrows, select where `f` is increasing, then press Check.","deriv":"The lower panel shows `f′` in teal. The probe line runs through both graphs: where the teal curve is above the axis, `f` rises."},"rows":{"pt":"Point","slope":"Slope `f′(x)`","sign":"Sign","dir":"Direction here","ivs":"Intervals so far"},"shift":"Vertical shift `C`","shiftNote":"The graph shown is `f(x) + C`.","skip":"Skipped {x}: not in the domain.","build":{"famNote":"Build mode works with F1 to F4. Choose one of them.","missZ":"A zero of `f′` is missing. Factor `f′(x)` and set each factor to 0.","extra":"`f′` isn’t 0 at {x}, and it’s defined there.","wantGap":"At {x}, `f′` is undefined: that point is not in the domain. Mark it as undefined, not as a zero.","wantZero":"At {x}, `f′ = 0`, and it’s defined there. Mark it as a zero.","blank":"Fill in every sign and every arrow first.","signs":"A sign doesn’t match `f′`: test one value in each interval marked ✗.","arrows":"An arrow doesn’t match its sign: + means ↗ (increasing), − means ↘ (decreasing).","selNone":"Now select the intervals where `f` is increasing.","selPt":"Use open intervals: a turning point belongs to neither interval.","sel":"Your selection doesn’t match the ↗ intervals.","chartOk":"✓ The chart is right.","allOk":"✓ The chart and your selection are right."},"tc3":{"label":"Toggle on every `b` that keeps `f` increasing on (−∞, ∞):"},"predIntro":"Make a prediction first. Then the strip shows you what really happens.","predictions":[{"id":"p1","fn":"F1","prompt":"F1, probe at `x = 2`. What is the sign of `f′(2)`, and what is `f` doing `f(x) = x^4 - 2x^2`: build the sign chart and select the intervals where `f` is increasing.","why":"`f′(x) = 4x(x - 1)(x + 1)`: zeros −1, 0, 1 and signs −, +, −, +, so `f` is increasing on (−1, 0) ∪ (1, ∞).","hints":["Factor `f′(x) = 4x^3 - 4x`.","`4x(x - 1)(x + 1)`: zeros −1, 0, 1.","Test −2, −0.5, 0.5, 2: −, +, −, +."],"msgs":{"fn":"Choose F2 first, then switch to Build the chart.","only1":"`4x^3 - 4x = 4x(x - 1)(x + 1)`: `x = 0` is a zero too.","sel11":"`f′` is negative on (0, 1).","zeros":"Place every zero of `f′(x) = 4x^3 - 4x`, and nothing else.","blank":"Fill in a sign for every interval.","signs":"Some signs don’t match `f′`: test one value in each interval.","arrows":"An arrow doesn’t match its sign: + means ↗, − means ↘.","selPt":"Use open intervals: a turning point belongs to neither interval.","sel":"Select every interval where `f′ > 0`, and nothing else."}},{"id":"tc2","goal":4,"prompt":"A new function `f(x) = x^3 - cx`, `c` from −5 to 5. Set the \u003cstrong>largest\u003c/strong> `c` for which `f` is increasing on (−∞, ∞).","why":"`f′(x) = 3x^2 - c ≥ 0` for every `x` exactly when `c ≤ 0`. At `c = 0` it’s `x^3`: one level point, still increasing.","hints":["`f′(x) = 3x^2 - c`. When is it never negative?","`3x^2 ≥ 0`, so you need `-c ≥ 0`.","`c ≤ 0`; the largest is 0 (that’s `x^3`)."],"msgs":{"fn":"Choose `x^3 - cx` first, then set `c` with its slider.","c1":"`f′ = 3x^2 - 1` is negative between `±1/√3`: a dip appears.","pos":"`f′ = 3x^2 - c` is negative near `x = 0` when `c > 0`: a dip appears.","neg":"It works, but it isn’t the largest."}},{"id":"tc3","goal":[4,5],"stretch":true,"prompt":"`f(x) = x^3 + bx^2 + 3x`. Toggle on \u003cstrong>every\u003c/strong> whole number `b` from −6 to 6 for which `f` is increasing on (−∞, ∞).","why":"`f′(x) = 3x^2 + 2bx + 3` is never negative exactly when its discriminant `4b^2 - 36 ≤ 0`, so `-3 ≤ b ≤ 3`. At `b = ±3` there’s one level point, and `f` is still increasing.","hints":["`f′(x) = 3x^2 + 2bx + 3` must never be n art?","choices":[{"t":"Because `f′` has many zeros","fb":"The chart fixes directions, not heights.","_n":"18bb4","_k":"a196d59e"},{"t":"They don’t","fb":"The chart fixes directions, not heights. Adding a constant doesn’t change any slope, so `f + C` fits too.","_n":"19ba4","_k":"9e458a68"},{"t":"Shifts up or down and different heights all keep the same rises and falls","fb":"Right. The chart fixes directions, not heights.","_n":"1ab94","_k":"e28fbe7b"},{"t":"Because the chart is approximate","fb":"The chart fixes directions, not heights.","_n":"1bb84","_k":"1cd0a766"}]},{"id":"q3","goal":4,"prompt":"`f′(x) = (x - 1)^2(x + 2)`. On (−2, ∞), `f` is …","choices":[{"t":"increasing","fb":"Right. `(x - 1)^2 ≥ 0` and `x + 2 > 0` there.","_n":"1cb74","_k":"9d75cd77"},{"t":"increasing then decreasing","fb":"`(x - 1)^2 ≥ 0` and `x + 2 > 0` there. `(x - 1)^2` is never negative, so `f′` keeps its sign through `x = 1`.","_n":"1dba4","_k":"46e11cd1"},{"t":"constant","fb":"`(x - 1)^2 ≥ 0` and `x + 2 > 0` there.","_n":"1ebb4","_k":"1cbccef7"},{"t":"decreasing","fb":"`(x - 1)^2 ≥ 0` and `x + 2 > 0` there.","_n":"1fbc4","_k":"d87d5a19"}]},{"id":"q4","goal":5,"prompt":"`f′(x) = 3x^2 - 3`. Which could be `f`?","choices":[{"t":"`x^3 - 3x + 7`","fb":"Right. Differentiate each choice: only `x^3 - 3x + C` gives `3x^2 - 3`.","_n":"1gbd4","_k":"30600430"},{"t":"`6x`","fb":"Differentiate each choice: only `x^3 - 3x + C` gives `3x^2 - 3`.","_n":"1hb64","_k":"1a89531a"},{"t":"`x^3 - 3`","fb":"Differentiate each choice: only `x^3 - 3x + C` gives `3x^2 - 3`.","_n":"1ib74","_k":"af0cb726"},{"t":"`3x^3 - 3x`","fb":"Differentiate each choice: only `x^3 - 3x + C` gives `3x^2 - 3`.","_n":"1jb84","_k":"31c4966e"}]}]}},"practice":{"activities":[{"id":"builds","type":"custom","title":"Sign chart builds","summary":"Sign chart builds","goal":[2,3,4],"instruction":"Five functions. For each one: factor `f′`, place its zeros and undefined points, mark the signs and arrows, then type the intervals.","how":"Each , ∞)."]}]},{"id":"back","type":"custom","title":"Working backwards","summary":"Working backwards","star":true,"goal":[4,5,6],"instruction":"Go from facts about `f′` back to `f`. Items 4 to 6 are non-routine.","how":"Type intervals like (−∞, −1) or (−∞, −3) ∪ (2, ∞); “inf” works for ∞ and “U” for ∪. Use square brackets where an endpoint is included.","items":[{"id":"r1","goal":4,"kind":"iv","prompt":"`f′(x) = (x + 1)(x - 4)^2`. Where is `f` decreasing?","label":"Decreasing on","_a":"OToPFwhfHhpTPDw=","display":"(−∞, −1)","wrong":[{"iv":[[-1,4]],"fb":"`(x - 4)^2 ≥ 0`, so `f′ > 0` on (−1, 4)."}],"general":"Test one value in each interval of the sign chart of `f′`.","why":"`(x - 4)^2 ≥ 0` never changes sign, so `f′ \u003c 0` only where `x + 1 \u003c 0`.","hints":["Which factor can change sign?","Only `x + 1`; `(x - 4)^2 ≥ 0`.","`f′ \u003c 0` only for `x \u003c -1`: (−∞, −1)."]},{"id":"r2","goal":4,"kind":"iv","prompt":"`f′(x) = x^2(x - 2)(x + 3)`. Where is `f` increasing?","label":"Increasing on","_a":"OToPFwhfHhpRPE05Vh9cQg4NPD8=","display":"(−∞, −3) ∪ (2, ∞)","overlap":{"iv":[0,2],"fb":"`x^2` is never negative, so `f′` keeps its sign through `x = 0`: it’s negative on (0, 2) as well as on (−3, 0)."},"general":"Test one value in each interval of the sign chart of `f′`.","why":"`x^2 ≥ 0`, so the sign of `f′` comes from `(x - 2)(x + 3)`: positive outside −3 and 2.","hints":["`x^2` never changes sign.","The sign comes from `(x - 2)(x + 3)`.","Positive for `x \u003c -3` and `x > 2`: (−∞, −3) ∪ (2, ∞)."]},{"id":"r3","goal":5,"kind":"chips","prompt":"`f′(x) = 3(x - 1)(x - 5)` and `f(1) = 10`. Is `f(3)` more or less than 10?","choices":["More than 10","Less than 10"],"_a":"QC0EERcTRl8DD0FTVBE=","display":"less than 10","general":"`f` is decreasing on (1, 5), so it falls from 10.","why":"`f′ \u003c 0` on (1, 5), so `f` is decreasing there: `f(3) \u003c f(1) = 10`.","hints":["What is the sign of `f′` between 1 and 5?","Negative: test `x = 3`, `3(2)(-2) \u003c 0`.","`f` is decreasing on (1, 5), so `f(3) \u003c 10`."]},{"id":"r4","goal":4,"star":true,"kind":"iv","prompt":"For which `k` is `f(x) = x^3 - kx^2 + 12x` increasing on (−∞, ∞)?","label":"Values of `k`","var":"k","_a":"OTpMVEgFHgZOUDw/","display":"`-6 ≤ k ≤ 6`, that is, [−6, 6]","wrong":[{"iv":[[-6,6]],"fb":"At `k = 6`, `f′ = 3(x - 2)^2 ≥ 0`: one level point, still increasing. Include the endpoints."},{"iv":[[null,6,0,1]],"fb":"At `k = -7`, `f′ = 3x^2 + 14x + 12` has two zeros and dips below 0. There’s a lower limit too."}],"general":"`f′` must never be negative: look at its discriminant.","why":"`f′(x) = 3x^2 - 2kx + 12` is never negative when `4k^2 - 144 ≤ 0`, so `-6 ≤ k ≤ 6`.","hints":["`f′(x) = 3x^2 - 2kx + 12`.","Never negative ⟺ discriminant ≤ 0.","`4k^2 - 144 ≤ 0`."]},{"id":"r5","goal":6,"star":true,"kind":"iv","prompt":"`f` is increasing on (1, 4). Where is `g(x) = f(x - 3)` increasing?","label":"Increasing on","_a":"OTpVTlNubw==","display":"(4, 7)","wrong":[{"iv":[[-2,1]],"fb":"`f(x - 3)` shifts the graph right 3."}],"general":"`g(x) = f(x - 3)` is a horizontal shift. Which way, and how far?","why":"`f(x - 3)` shifts the graph right 3, so (1, 4) becomes (4, 7).","hints":["`g(x) = f(x - 3)` is a horizontal shift.","It moves the graph right 3.","(1 + 3, 4 + 3) = (4, 7)."]},{"id":"r6","goal":[5,6],"star":true,"kind":"pair","prompt":"`f′(x) = (x - a)(x - 6)`, and `f` is decreasing on exactly (2, 6). Find `a`, then find where `h(x) = f(-x)` is increasing.","label":"`h` increasing on","numLabel":"`a =`","_a":"GUMAQF4BHhULF0NYP2gfAU5MUz85Tg==","display":"`a = 2`; `h` is increasing on (−6, −2)","wrong":[{"iv":[[2,6]],"fb":"`h′(x) = -f′(-x)`, so `h` rises where `f` falls, mirrored: `-x ∈ (2, 6)`."}],"aFb":"`f′ \u003c 0` between its zeros `a` and 6, so `a` is the left end of (2, 6).","general":"`h′(x) = -f′(-x)` by the chain rule.","why":"`a = 2`. `h′(x) = -f′(-x) > 0` when `f′(-x) \u003c 0`, that is, `2 \u003c -x \u003c 6`, so `-6 \u003c x \u003c -2`.","hints":["`f′ \u003c 0` between  0` for `-5 \u003c x \u003c 0` too: `x^2 \u003c 25` there.","_n":"398a7","_k":"ef91c4a5"},{"t":"(−5, 0) and (0, 5)","why":"`f′ = {x^2 - 25}/{x^2} \u003c 0` for `0 \u003c x^2 \u003c 25`; 0 isn’t in the domain.","_n":"3a897","_k":"5dfcbce2"},{"t":"(−5, 5)","why":"`f(-1) = -26 \u003c f(1) = 26`: 0 isn’t in the domain, so the pieces are separate.","_n":"3b888","_k":"b83528aa"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`f′(x) = (x - 3)^2(x + 1)`. Which describes `f`?","options":[{"t":"Increasing on (−∞, −1), decreasing on (−1, ∞)","why":"Test `x = -2`: `(25)(-1) \u003c 0`.","_n":"3c898","_k":"168eed82"},{"t":"Decreasing on (−∞, −1) and on (3, ∞)","why":"`(x - 3)^2` is never negative, so `f′` keeps its sign through `x = 3`.","_n":"3d868","_k":"26b70db2"},{"t":"Increasing on (−1, 3), decreasing on (3, ∞)","why":"`(x - 3)^2` is never negative, so `f′` keeps its sign through `x = 3`.","_n":"3e878","_k":"45451ada"},{"t":"Decreasing on (−∞, −1), increasing on (−1, ∞); level for an instant at `x = 3` but still increasing","why":"`(x - 3)^2 ≥ 0`, so the sign comes from `x + 1`.","_n":"3f848","_k":"e72f7055"}]},"b":{"prompt":"`f′(x) = (x + 2)^2(x - 3)`. Which describes `f`?","options":[{"t":"Decreasing on (−∞, 3), increasing on (3, ∞); level for an instant at `x = -2`","why":"`(x + 2)^2 ≥ 0`, so the sign comes from `x - 3`.","_n":"3g858","_k":"0633bfcd"},{"t":"Decreasing on (−2, 3), increasing elsewhere","why":"`(x + 2)^2` is never negative, so `f′` keeps its sign through `x = -2`.","_n":"3h828","_k":"e890d98a"},{"t":"Increasing on (−∞, −2), decreasing on (−2, 3), increasing on (3, ∞)","why":"`(x + 2)^2` is never negative, so `f′` keeps its sign through `x = -2`.","_n":"3i838","_k":"9f9ab5f2"},{"t":"Increasing on (−∞, 3)","why":"Test `x = 0`: `(4)(-3) \u003c 0`.","_n":"3j908","_k":"0891a645"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"For which values of `k` is `f(x) = x^3 + kx` increasing on (−∞, ∞)?","options":[{"t":"All `k`","why":"`k = -3` gives a dip between −1 and 1.","_n":"3k918","_k":"66ae2651"},{"t":"`k ≥ 0`","why":"`f′ = 3x^2 + k ≥ 0` for every `x` exactly when `k ≥ 0`; at `k = 0` it’s `x^3`.","_n":"3l0e8","_k":"f588860e"},{"t":"`k ≤ 0`","why":"Negative `k` makes `f′` negative near 0.","_n":"3m0d8","_k":"2171b769"},{"t":"`k > 0`","why":"At `k = 0`, `x^3` is still increasing.","_n":"3n108","_k":"2bf78611"}]},"b":{"prompt":"For which values of `k` is `f(x) = 2x^3 - kx` increasing on (−∞, ∞)?","options":[{"t":"`k ≤ 0`","why":"`f′ = 6x^2 - k ≥ 0` for all `x` when `-k ≥ 0`.","_n":"3o0f8","_k":"ffaf1986"},{"t":"`k ≥ 0`","why":"Positive `k` makes `f′` negative near 0.","_n":"3p128","_k":"f4a22c59"},{"t":"All `k`","why":"`k = 6` gives a dip between −1 and 1.","_n":"3q118","_k":"362a16c7"},{"t":"`k \u003c 0`","why":"At `k = 0`, `2x^3` is still increasing.","_n":"3r148","_k":"9f258231"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"You know `f′(x)` exactly. Which is the best explanation of why you still can’t draw `f` exactly?","options":[{"t":"“Adding a constant to `f` doesn’t change any slope, so `f(x) + C` has the same derivative for every `C`. Infinitely many graphs, all vertical shifts of each other, fit.”","why":"`f′` fixes every slope, but not the height.","_n":"3s138","_k":"237f3f10"},{"t":"“You can: each derivative belongs to exactly one function.”","why":"Adding a constant doesn’t change any slope, so `f + C` fits too.","_n":"3t068","_k":"e9e32eda"},{"t":"“Because `f′` only gives signs, not values.”","why":"Here you know the values of `f′` exactly.","_n":"3u058","_k":"9e94cc50"},{"t":"“Because `f′` might contain mistakes.”","why":"Even an exact `f′` leaves the height unknown.","_n":"3v148","_k":"5717995d"}]},"b":{"prompt":"Two students draw different graphs from the same sign chart of `f′`. Which is the best explanation?","options":[{"t":"“Both can be right. A sign chart only says where `f` rises and falls, so any graph with those rises and falls fits, including shifted ones and ones with different turning-point heights.”","why":"The chart fixes directions, not heights.","_n":"3w158","_k":"95db1b5e"},{"t":"“Both are wrong unless the graphs cross the axis at the same points.”","why":"The chart doesn’t fix the intercepts.","_n":"3x168","_k":"d240a265"},{"t":"“They must have used different functions.”","why":"The same chart fits many functions.","_n":"3y178","_k":"62a1a739"},{"t":"“One must be wrong: a sign chart gives one graph.”","why":"Adding a constant doesn’t change any slope, so `f + C` fits too.","_n":"3z108","_k":"b5f83d3d"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"`f′ > 0` for `x \u003c -1` and for `x > 2`, and `f′ \u003c 0` for `-1 \u003c x \u003c 2`. Which report is correct?","options":[{"t":"“`f` is positive on (−∞, −1) ∪ (2, ∞) and negative on (−1, 2).”","why":"`f′ \u003c 0` says the graph is falling. It can fall while it’s above the axis.","_n":"40118","_k":"f5a22f1b"},{"t":"“`f` is increasing at `x = -1` and `x = 2`.”","why":"Those are the turning points, where `f′ = 0`.","_n":"41128","_k":"708d76fd"},{"t":"“`f` is increasing on [−∞, −1] ∪ [2, ∞].”","why":"Infinity takes a round bracket, and the turning points belong to neither interval.","_n":"42138","_k":"bbfa0b67"},{"t":"“`f` is increasing on (−∞, −1) ∪ (2, ∞) and decreasing on (−1, 2).”","why":"Open `x`-intervals, round brackets at ∞.","_n":"430c8","_k":"87a9303a"}]},"b":{"prompt":"`f′ \u003c 0` for `x \u003c -3` and for `x > 0`, and `f′ > 0` for `-3 \u003c x \u003c 0`. Which report is correct?","options":[{"t":"“`f` is decreasing on [−∞, −3] ∪ [0, ∞].”","why":"Infinity takes a round bracket, and the turning points belong to neither interval.","_n":"440d8","_k":"8ec75865"},{"t":"“`f` is decreasing at `x = -3` and `x = 0`.”","why":"Those are the turning points, where `f′ = 0`.","_n":"451a8","_k":"5cddbf2a"},{"t":"“`f` is decreasing on (−∞, −3) ∪ (0, ∞) and increasing on (−3, 0).”","why":"Open `x`-intervals, round brackets at ∞.","_n":"46198","_k":"6e6c4bf6"},{"t":"“`f` is negative on (−∞, −3) ∪ (0, ∞).”","why":"`f′ \u003c 0` says falling, not below the axis.","_n":"47188","_k":"406ff9dd"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A park’s website had `N(t) = -t^3 + 9t^2 + 48t` thousand visits in month `t` after its launch, for `0 ≤ t ≤ 12`. When was the number of visits increasing?","options":[{"t":"For all `0 \u003c t \u003c 12`","why":"`N′(10) = -3(2)(12) \u003c 0`.","_n":"48178","_k":"98b7c0d5"},{"t":"For `0 \u003c t \u003c 8` only, then constant","why":"`N′ \u003c 0` after `t = 8`: it falls.","_n":"49168","_k":"ff9dc3a1"},{"t":"For `0 \u003c t \u003c 8`, then decreasing for `8 \u003c t \u003c 12`","why":"`N′ = -3(t - 8)(t + 2)`.","_n":"4a158","_k":"28302e5d"},{"t":"For `-2 \u003c t \u003c 8`","why":"Months before the launch (`t \u003c 0`) aren’t in the model.","_n":"4b148","_k":"304ba650"}]},"b":{"prompt":"`N(t) = -t^3 + 12t^2 + 60t` thousand visits, `0 ≤ t ≤ 15`. When were visits increasing?","options":[{"t":"For `0 \u003c t \u003c 10` only, then constant","why":"`N′ \u003c 0` after `t = 10`: it falls.","_n":"4c138","_k":"a92434da"},{"t":"For all `0 \u003c t \u003c 15`","why":"`N′(12) = -3(2)(14) \u003c 0`.","_n":"4d128","_k":"199de894"},{"t":"For `-2 \u003c t \u003c 10`","why":"Months before the launch (`t \u003c 0`) aren’t in the model.","_n":"4e118","_k":"01b0e38a"},{"t":"For `0 \u003c t \u003c 10`, then decreasing for `10 \u003c t \u003c 15`","why":"`N′ = -3(t - 10)(t + 2)`.","_n":"4f808","_k":"24963688"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"`f` is decreasing on (1, 3). Where is `g(x) = f(x + 2) - 5` decreasing?","options":[{"t":"(−4, −2)","why":"−5 is a vertical shift; it doesn’t move `x`-intervals.","_n":"4g818","_k":"13af4ef3"},{"t":"(1, 3)","why":"The horizontal shift moves the interval.","_n":"4h7e8","_k":"dbfa30fd"},{"t":"(3, 5)","why":"That moves right. `f(x + 2)` moves the graph \u003cstrong>left\u003c/strong> 2, so (1, 3) becomes (−1, 1).","_n":"4i7f8","_k":"71988257"},{"t":"(−1, 1)","why":"`f(x + 2)` moves the graph left 2; −5 moves it down, which doesn’t affect direction.","_n":"4j848","_k":"05c627c0"}]},"b":{"prompt":"`f` is increasing on (−2, 4). Where is `g(x) = f(x - 3) + 1` increasing?","options":[{"t":"(−1, 5)","why":"+1 is a vertical shift; it doesn’t move `x`-intervals.","_n":"4k858","_k":"7ba15f9b"},{"t":"(1, 7)","why":"`f(x - 3)` moves the graph right 3; +1 moves it up, which doesn’t affect direction.","_n":"4l828","_k":"c53e88d0"},{"t":"(−5, 1)","why":"That moves left. `f(x - 3)` moves the graph \u003cstrong>right\u003c/strong> 3.","_n":"4m838","_k":"d1b054fb"},{"t":"(−2, 4)","why":"The horizontal shift moves the interval.","_n":"4n888","_k":"ee916d6b"}]}}]},"task":{"title":"Design a derivative","summary":"Design a derivative","statement":"\u003cp>Build `f′(x) = a(x - p)(x - q)` so that `f` meets every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`f` is increasing on (−1, 3).\u003c/li>\u003cli>`f` is decreasing on exactly one interval.\u003c/li>\u003cli>`f′(0) = 6`.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose `a` from −3, −2, −1, 1, 2, 3, and whole numbers `p` and `q` from −5 to 5 with `p ≤ q`. The sign chart of `f′`, the graph of `f′` (teal) and one possible `f` update as you go.\u003c/p>","checks":["Increasing on (−1, 3)","Exactly one decreasing interval","`f′(0) = 6`"],"tips":["With `a \u003c 0`, `f′` is negative on both outer pieces: that’s two decreasing intervals.","With `a > 0`, `f` decreases only between the zeros, so (`p`, `q`) must stay out of (−1, 3).","`f′(0) = a(-p)(-q) = apq`.","Both zeros must be at or left of −1, or at or right of 3."],"explainPrompt":"Explain why `a` had to be positive and where the zeros of `f′` had to go.","vocab":"Use the words sign chart, increasing, decreasing and zero of the derivative.","more":"There’s more than one answer. Can you find them all?","after3":"All three put the decreasing interval to the left of −1. Zeros to the right of 3 would need `pq ≥ 12`, which can’t give `apq = 6` with `a ≥ 1`."},"cards":[["`f′(x) > 0` on an interval","`f` is increasing there."],["`f′(x) \u003c 0` on an interval","`f` is decreasing there."],["Sign chart for `f′`","Zeros and domain gaps on a number line; test one value per interval."],["Reporting intervals","Open `x`-intervals with ∪: increasing on (−∞, −2) ∪ (1, ∞)."],["Decreasing ≠ negative","`f` can fall while it’s above the axis."],["`x^3` at 0","`f′(0) = 0`, but `x^3` is increasing everywhere."],["Squared factor in `f′`","`(x - 1)^2` doesn’t change sign: level for an instant, no turn."],["Domain gap","`x + 4/x`: decreasing on (−2, 0) and (0, 2), not on (−2, 2)."],["Many graphs, one derivative","`f` and `f + C` have the same `f′`."],["Increasing everywhere","`f′ ≥ 0` with only isolated zeros, e.g. `x^3 + 3x^2 + 3x`."],["Shifts and intervals","`f(x + 2)` moves intervals left 2; `f(x) + 5` doesn’t move them."]]}};</script>
