.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 51: direction colours, hero equation, Plane weaver (3D view, steppers, sliders, readout), Part 3 stations, practice boxes, task */
.pl-ca{color:var(--pen)}
.pl-cb{color:var(--f3)}
.pl-heq{white-space:nowrap}
.pl-heq .m{white-space:nowrap}

.pl-ex,.pl-p3{display:flex;gap:16px 26px;align-items:flex-start}
.pl-colL,.pl-p3L{flex:1.05 1 0;min-width:0}
.pl-colR,.pl-p3R{flex:1 1 0;min-width:0}
canvas.pl-cv{touch-action:pan-y;cursor:grab}
canvas.pl-cv:active{cursor:grabbing}
canvas.pl-cv:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.pl-warn{min-height:1.5em;margin:6px 0 4px;font-weight:700;color:var(--red)}
.pl-views{margin:6px 0 2px}
.pl-views .seg button{min-height:32px}
.pl-turn{margin:4px 0 8px}
.pl-rdd{margin-top:6px}
.pl-rdd>summary{cursor:pointer;font-weight:700;margin-bottom:6px}
.pl-read dd,.pl-sread dd{overflow-wrap:anywhere}
.pl-mode{margin-bottom:10px}
.pl-pre{gap:6px;margin:0 0 10px;align-items:center}
.pl-pre[hidden]{display:none}
.pl-pl{font-weight:700;margin-right:2px}
.pl-msg{min-height:1.4em;margin:0 0 6px;font-weight:600;color:var(--red)}
.pl-sl{margin-top:4px}
.pl-sl output{font-size:1.2rem}
.pl-tog{gap:6px;margin-top:8px}

/* V12 vector steppers */
.pl-vrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 0 8px}
.pl-vl{min-width:6.2em;font-weight:700}
.pl-vl .m{font-size:1.1em}
.pl-vin{display:inline-flex;align-items:center;gap:2px;flex-wrap:nowrap}
.pl-br{font:400 1.3rem var(--font-math)}
.pl-cm{font:400 1.1rem var(--font-math);margin-right:2px}
.pl-cmp{display:inline-flex;align-items:center}
.pl-pm{width:26px;height:34px;padding:0;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);font:700 1rem var(--font-ui);cursor:pointer}
.pl-pm:first-child{border-radius:7px 0 0 7px}
.pl-pm:last-child{border-radius:0 7px 7px 0}
.pl-pm:disabled{opacity:.5;cursor:default}
.numin.pl-n{width:2.6em;padding:.3em .1em;text-align:center;border-radius:0;font-size:1.05rem;-moz-appearance:textfield;appearance:textfield}
.pl-n::-webkit-inner-spin-button,.pl-n::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* Part 3 */
.pl-stc{gap:6px;margin:0 0 12px}
.pl-p3R h3{margin-top:0}
.pl-p3R h4{margin:12px 0 6px}
.pl-sread{margin:10px 0}
.pl-ok{margin:6px 0;font-weight:600}
.pl-dq{margin:12px 0 4px;font-weight:700}
.pl-alg{margin:8px 0;padding-left:1.4em}
.pl-alg li{margin:3px 0;padding:2px 6px;border-radius:6px;border-left:4px solid transparent}
.pl-alg li.pl-used{background:var(--hi-soft);border-left-color:var(--hi)}
.pl-alg li.pl-good{background:var(--good-bg);border-left-color:var(--green)}
.pl-alg li.pl-bad{background:var(--bad-bg);border-left-color:var(--red)}

/* Practice boxes */
.pl-eqb{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.pl-eqr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.pl-eql{min-width:2.6em;font-size:1.08rem}
.numin.pl-bx{width:3.4em;padding:.3em .3em;text-align:center}
.pl-nb{display:inline-flex;align-items:center;gap:8px;margin:6px 0}
.pl-chs{gap:6px;margin:6px 0}

@media (max-width:760px){
  .pl-ex,.pl-p3{flex-direction:column}
  .pl-colL,.pl-colR,.pl-p3L,.pl-p3R{width:100%;flex:none}
  .pl-vl{min-width:0;width:100%}
  .pl-heq{font-size:.86em}
}

3)` and `(6, 3, 9)`.","`vec{AC} = 3vec{AB}`, so yes."]},{"id":"w5","skill":"Solving for parameters","goal":3,"prompt":"Solve `s + 2t = 4` and `2s - t = 3`.","options":[{"t":"`s = 4`, `t = 0`","why":"`2(4) - 0 = 8`, not 3.","_n":"gbcb","_k":"2968688b"},{"t":"`s = 2`, `t = 1`","why":"Check: 2 + 2 = 4 and 4 − 1 = 3.","_n":"hadb","_k":"d6afb035"},{"t":"`s = 1`, `t = 2`","why":"1 + 4 = 5, not 4.","_n":"iaeb","_k":"de881cbe"},{"t":"`s = 2`, `t = -1`","why":"2 − 2 = 0, not 4.","_n":"j27c","_k":"839793ed"}],"hints":["Solve the second for `t`.","`t = 2s - 3`, so `s + 4s - 6 = 4`.","`s = 2`, `t = 1`."]},{"id":"w6","skill":"Solving for parameters","goal":3,"prompt":"Write `(5, 4)` as `s(2, 1) + t(1, -1)`.","options":[{"t":"`s = -1`, `t = 3`","why":"`(-2, -1) + (3, -3) = (1, -4)`.","_n":"k26c","_k":"7f0c38a1"},{"t":"`s = 3`, `t = -1`","why":"`(6, 3) + (-1, 1) = (5, 4)`.","_n":"l29c","_k":"a90d85b2"},{"t":"`s = 2`, `t = 1`","why":"`(4, 2) + (1, -1) = (5, 1)`: the `y` fails.","_n":"m28c","_k":"8acf92c9"},{"t":"`s = 3`, `t = 1`","why":"`(6, 3) + (1, -1) = (7, 2)`.","_n":"n2bc","_k":"1bab133c"}],"hints":["`2s + t = 5` and `s - t = 4`.","Add them: `3s = 9`.","`s = 3`, `t = -1`."]}],"refreshers":{"Lines in R³":"`vec{r} = vec{r}_0 + t vec{m}`: start at `vec{r}_0` and move `t` copies of `vec{m}`. A point is on the line if one value of `t` works in \u003cstrong>all three\u003c/strong> components.","Vectors from points":"`vec{AB} = B - A` (end minus start). A position vector points from the origin.","Parallel and collinear":"Parallel vectors are multiples: `vec{u} = k vec{v}` with the same `k` in every component. A, B, C are collinear when `vec{AB}` and `vec{AC}` are parallel.","Solving for parameters":"Two equations, two unknowns: eliminate one parameter, solve, then check both equations."}}},"explore":{"heading":"Plane weaver","intro":"Set a point and two directions, then move the `s` and `t` sliders to travel across the plane. Try to break it: what makes the plane collapse into a line?","predIntro":"Make a prediction first. Then the plane weaver shows you what really happens.","predictions":[{"id":"p1","prompt":"Change \u003cspan class=\"pl-cb\">`vec{b}`\u003c/span> to `(2, 4, 0)` while \u003cspan class=\"pl-ca\">`vec{a}`\u003c/span> `= (1, 2, 0)`. What will the `s` and `t` sliders sweep out now?","options":[{"t":"a single point","_n":"o2ac","_k":"b181f3ce"},{"t":"a plane","_n":"p2dc","_k":"55c79984"},{"t":"all of space","_n":"q2cc","_k":"0ec9d92a"},{"t":"a line","_n":"r2fc","_k":"ae4fb3b7"}],"explain":"`(2, 4, 0) = 2(1, 2, 0)`, so both directions point the same way."},{"id":"p2","prompt":"Floor plane with \u003cspan class=\"pl-ca\">`vec{a}`\u003c/span> `= (1, 0, 0)` and \u003cspan class=\"pl-cb\">`vec{b}`\u003c/span> `= (0, 1, 0)`. Replace \u003cspan class=\"pl-cb\">`vec{b}`\u003c/span> with `vec{a} + vec{b} = (1, 1, 0)`. What happens to the plane?","options":[{"t":"it tilts","_n":"s2ec","_k":"607a6b0e"},{"t":"nothing: it’s the same plane","_n":"tc1b","_k":"fe63163e"},{"t":"it becomes a line","_n":"uc2b","_k":"c4b1b0b3"},{"t":"it moves up","_n":"vbfb","_k":"391c615b"}],"explain":"`(1, 1, 0)` lies in the floor, so it’s still a direction along the same plane. The sum of two vectors in a plane lies in the plane."},{"id":"p3","prompt":"Three points: `A(1, 1, 1)`, `B(2, 3, 2)`, `C(4, 7, 4)`. What plane do A, B and C determine?","options":[{"t":"exactly one plane","_n":"wc0b","_k":"a2bc8bf7"},{"t":"exactly two planes","_n":"xbdb","_k":"f04ce5a7"},{"t":"no plane at all","_n":"ybeb","_k":"03b86eb3"},{"t":"no unique plane: infinitely many contain them","_n":"zbbb","_k":"30badaf0"}],"explain":"`vec{AC} = (3, 6, 3) = 3vec{AB}`: the points are collinear."},{"id":"p4","prompt":"Floor plane. Change `vec{r}_0` from `(0, 0, 0)` to `(2, 3, 0)`. What happens to the plane?","options":[{"t":"it shifts sideways","_n":"10bcb","_k":"a25bda71"},{"t":"it tilts","_n":"11b9b","_k":"72364a3a"},{"t":"nothing: it’s the same plane","_n":"12bab","_k":"9b8acae6"},{"t":"it becomes a line","_n":"1333c","_k":"1b39a98a"}],"explain":"`(2, 3, 0)` is already on the floor. Any point of the plane can be `vec{r}_0`."}],"chalIntro":"Use the plane weaver to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Mode 1 with `vec{r}_0 = (1, 2, 3)`, \u003cspan class=\"pl-ca\">`vec{a}`\u003c/span> `= (1, 0, 2)`, \u003cspan class=\"pl-cb\">`vec{b}`\u003c/span> `= (0, 1, -1)`. Move the point to `P(3, 1, 8)`.","why":"`s = 2` and `t = -1`: `(1, 2, 3) + 2(1, 0, 2) - (0, 1, -1) = (3, 1, 8)`.","hints":["`x = 1 + s` uses only `s`; `y = 2 + t` uses only `t`.","`1 + s = 3` gives `s = 2`; `2 + t = 1` gives `t = -1`.","Check `z`: `3 + 2(2) - (-1) = 8` ✓."],"msgs":{"set":"First set mode 1 (Point + two directions) with `vec{r}_0 = (1, 2, 3)`, `vec{a} = (1, 0, 2)` and `vec{b} = (0, 1, -1)`.","swap":"You swapped `s` and `t`: `x` only depends on `s`.","tpos":"`y` is 3, not 1: `t` must be negative.","other":"The point is at {p}, not `(3, 1, 8)`."}},{"id":"tc2","goal":4,"prompt":"Mode 2 with `A(1, 0, 0)` and `B(0, 2, 0)`. Place C (whole numbers from −5 to 5, C ≠ A, B) so that A, B and C do \u003cstrong>not\u003c/strong> determine a unique plane.","why":"`vec{AC}` is a multiple of `vec{AB} = (-1, 2, 0)`: A, B and C are collinear.","hints":["Three points fail to fix a plane only when they’re collinear.","`C = A + k vec{AB} = (1 - k, 2k, 0)`.","`k = -1` gives `C(2, -2, 0)`."],"msgs":{"set":"First set mode 2 (Three points) and keep `A(1, 0, 0)` and `B(0, 2, 0)`.","same":"C must be different from A and B.","floor":"C is on the same floor, but not on line AB, so A, B and C still fix exactly one plane (the floor).","off":"These three points aren’t collinear: they fix one plane."}},{"id":"tc3","goal":5,"stretch":true,"prompt":"The plane is `vec{r} = (1, 0, 2) + s(1, 1, 0) + t(0, 1, 1)`. In mode 1, enter a \u003cstrong>different\u003c/strong> equation of the \u003cstrong>same\u003c/strong> plane: `vec{r}_0 ≠ (1, 0, 2)`, and neither direction a multiple of `(1, 1, 0)` or `(0, 1, 1)`. (Whole-number components from −4 to 4.)","why":"Your point is on the plane and both your directions lie along it without being parallel, so your equation describes the same plane.","hints":["Any point you can reach with some `s` and `t` can be the new `vec{r}_0`.","Sums and differences of the old directions still lie along the plane.","`vec{r}_0 = (1, 0, 2) + (1, 1, 0) = (2, 1, 2)`; `vec{a} = (1, 1, 0) + (0, 1, 1) = (1, 2, 1)`; `vec{b} = (1, 1, 0) - (0, 1, 1) = (1, 0, -1)`."],"msgs":{"mode":"Switch to mode 1 (Point + two directions) first.","same":"Choose a different starting point.","r0":"That point isn’t on the plane: `x` and `y` give `s` = {s} and `t` = {t}, but then `z` = {z}, not {z0}.","dir":"{d} isn’t a combination of `(1, 1, 0)` and `(0, 1, 1)`, so it leaves the plane.","par":"Your two directions are parallel: that’s a line.","old":"{d} is a multiple of one of the old directions. Choose directions that aren’t multiples of `(1, 1, 0)` or `(0, 1, 1)`."}}]},"part3":{"slug":"on-plane","name":"On the plane?","heading":"Is the point on the plane?","intro":"Explore built planes with sliders. Here you go the other way: given a point, find `s` and `t` by algebra, and see the result in 3D. Work through the three stations, then try the quick check.","stations":[{"id":"s1","chip":"Station 1: solve two, check the third","title":"Station 1: solve two, check the third","text":"Plane `vec{r} = (2, -1, 1) + s(1, 2, 0) + t(0, 1, 3)`. Choose a test point. The 3D view shows the point the plane reaches with the `s` and `t` you solve for.","tests":[{"id":"P","t":"Test `P(3, 3, 3)`","alg":["`x`: `2 + s = 3`, so `s = 1`.","`y`: `-1 + 2s + t = 3`, so `-1 + 2 + t = 3` and `t = 2`.","`z`: `1 + 3t = 1 + 6 = 7`, but P has `z = 3`. ✗"],"verdict":"Not on the plane: `z` is off by 4."},{"id":"Q","t":"Test `Q(4, 4, 4)`","alg":["`x`: `2 + s = 4`, so `s = 2`.","`y`: `-1 + 4 + t = 4`, so `t = 1`.","`z`: `1 + 3t = 1 + 3 = 4` ✓"],"verdict":"On the plane: `s = 2`, `t = 1`."}]},{"id":"s2","chip":"Station 2: three points to an equation","title":"Station 2: three points to an equation","text":"`A(1, 2, 0)`, `B(3, 2, 1)` and `C(1, 4, -1)`. Use A as the starting point, then build the two directions from the points.","useA":"Use A as `vec{r}_0`","build":"Build the directions","check":"Check directions","ok":"✓ Correct: `vec{AB} = (2, 0, 1)` and `vec{AC} = (0, 2, -1)`.","eq":"`vec{r} = (1, 2, 0) + s(2, 0, 1) + t(0, 2, -1)`","par":"`x = 1 + 2s`, `y = 2 + 2t`, `z = s - t`","dq":"Is `D(5, 6, 0)` on this plane?","dbtn":"Test D","dalg":["`x`: `1 + 2s = 5`, so `s = 2`.","`y`: `2 + 2t = 6`, so `t = 2`.","`z`: `s - t = 2 - 2 = 0` ✓"],"dverdict":"D is on the plane, so A, B, C and D are coplanar.","trap":"Use B and C as directions","trapNote":"Trap: this plane goes through A with directions `(3, 2, 1)` and `(1, 4, -1)`, the position vectors of B and C. It misses B and C. Position vectors point from the origin, not along the plane.","msgs":{"pos":"`(3, 2, 1)` points from the origin to B, not along the plane. Use `vec{AB} = B - A`.","posC":"`(1, 4, -1)` points from the origin to C, not along the plane. Use `vec{AC} = C - A`.","rev":"That’s `B - A` the wrong way round: end minus start.","other":"Subtract each coordinate of A from the matching coordinate of the end point."}},{"id":"s3","chip":"Station 3: a line and a point","title":"Station 3: a line and a point","text":"Line `vec{r} = (0, 1, 2) + u(1, -1, 1)` and point `Q(2, 0, 5)`. The line gives a point P(0, 1, 2) and one direction; `vec{PQ}` gives the second direction.","pq":"`vec{PQ} = (2, -1, 3)` isn’t parallel to `(1, -1, 1)`, so the plane is `vec{r} = (0, 1, 2) + s(1, -1, 1) + t(2, -1, 3)`.","toggle":"Move Q onto the line","onLine":"Now `Q = (1, 0, 3)` and `vec{PQ} = (1, -1, 1)`, the line’s own direction.","banner":"Q is on the line: infinitely many planes."}],"quickCheck":{"title":"Quick check","summary":"On the plane? quick check","items":[{"id":"q1","goal":3,"prompt":"Is `(3, 0, 4)` on `vec{r} = (1, 0, 0) + s(1, 0, 2) + t(0, 1, 0)`?","choices":[{"t":"Yes: `s = 2`, `t = 0`","fb":"Right. `x`: `1 + s = 3`, so `s = 2`; `y`: `t = 0`; `z`: `2s = 4` ✓.","_n":"1432c","_k":"f6af7537"},{"t":"Can’t tell without a graph","fb":"`x`: `1 + s = 3`, so `s = 2`; `y`: `t = 0`; `z`: `2s = 4` ✓.","_n":"1531c","_k":"67aa37aa"},{"t":"No: `z` fails","fb":"`x`: `1 + s = 3`, so `s = 2`; `y`: `t = 0`; `z`: `2s = 4` ✓.","_n":"1630c","_k":"33bae608"},{"t":"Yes: `s = 3`, `t = 0`","fb":"`x`: `1 + s = 3`, so `s = 2`; `y`: `t = 0`; `z`: `2s = 4` ✓.","_n":"172fc","_k":"e514bd74"}]},{"id":"q2","goal":4,"prompt":"Which does NOT determine a unique plane?","choices":[{"t":"A line and a point off it","fb":"Collinear points sit on one line, and infinitely many planes contain a line.","_n":"182ec","_k":"f1784cd4"},{"t":"Two intersecting lines","fb":"Collinear points sit on one line, and infinitely many planes contain a line.","_n":"192dc","_k":"7fdb8a18"},{"t":"Three collinear points","fb":"Right. Collinear points sit on one line, and infinitely many planes contain a line.","_n":"1a2cc","_k":"8b2f8200"},{"t":"A point and two non-parallel directions","fb":"Collinear points sit on one line, and infinitely many planes contain a line.","_n":"1b3bc","_k":"afc511a2"}]},{"id":"q3","goal":2,"prompt":"`A(0, 0, 1)`, `B(1, 2, 1)`, `C(2, 1, 3)`. Which directions work?","choices":[{"t":"`vec{AB} = (1, 2, 0)` and `vec{AC} = (2, 1, 2)`","fb":"Right. Both join points of the plane and they aren’t parallel.","_n":"1c3ac","_k":"046dd307"},{"t":"`(1, 2, 1)` and `(2, 1, 3)`","fb":"Position vectors point from the origin, not along the plane. Use `vec{AB}` and `vec{AC}`.","_n":"1d2dc","_k":"aca8b351"},{"t":"`vec{AB}` and `vec{BA}`","fb":"`vec{AB}` and `vec{BA}` are parallel: they sweep only a line.","_n":"1e2ec","_k":"3dbb5f85"},{"t":"`vec{AB}` only","fb":"One direction gives a line. A plane needs two.","_n":"1f2fc","_k":"538def19"}]},{"id":"q4","goal":4,"prompt":"`vec{r} = (1, 1, 1) + s(1, 0, 0) + t(2, 0, 0)` is …","choices":[{"t":"a point","fb":"`(2, 0, 0) = 2(1, 0, 0)`: parallel directions.","_n":"1g30c","_k":"19f95941"},{"t":"a line","fb":"Right. `(2, 0, 0) = 2(1, 0, 0)`: parallel directions.","_n":"1h29c","_k":"f0a90a4b"},{"t":"a plane","fb":"`(2, 0, 0) = 2(1, 0, 0)`: parallel directions.","_n":"1i2ac","_k":"7fc2a84d"},{"t":"all of space","fb":"`(2, 0, 0) = 2(1, 0, 0)`: parallel directions.","_n":"1j2bc","_k":"da9e88a9"}]}]}},"practice":{"activities":[{"id":"build","type":"custom","title":"Build the equation","summary":"Build the equation","goal":[2,4],"instruction":"Fill in the coefficients. Any correct equation of the plane is accepted.","how":"Type a whole number in every box (0 where a term is missing), then press Check.","msgs":{"empty":"Fill in every box with a number (type 0 where a term is missing).","zero":"A direction can’t be `vec{0}`.","par":"Parallel directions point along one line, so `s` and `t` only slide you along that line. A plane needs two directions that aren’t multiples.","r0":"{p} isn’t on the plane.","dir":"{d} doesn’t lie along the plane."},"items":[{"id":"b1","goal":2,"kind":"eq","form":"param","prompt":"Point `(2, 0, -1)`; directions `(1, 1, 0)` and `(0, 2, 3)`. Write the \u003cstrong>parametric equations\u003c/strong>.","_a":"ShcXCUZcP1QdBUkUVTtIRFAXX2JVSlVKAWhJGwZEXj0BGVcVVzsZ","display":"`x = 2 + s`, `y = s + 2t`, `z = -1 + 3t`","wrong":[{"coef":[1,1,0],"fb":"The `y`-component of `(1, 1, 0)` is 1, so `y` also gets `s`."}],"hints":["Each row uses one component of the point and of each direction.","`y`: 0 from the point, 1 from `(1, 1, 0)`, 2 from `(0, 2, 3)`.","`x = 2 + s`, `y = s + 2t`, `z = -1 + 3t`."]},{"id":"b2","goal":2,"kind":"eq","form":"vec","prompt":"Points `A(1, 1, 1)`, `B(2, 3, 1)` and `C(0, 1, 4)`. Write a vector equation of the plane.","_a":"ShcXCUZcP1cdBEkIOUpGBxMPPghIVEhWbBlHW0ZcP0sAGVUVVzsZ","display":"`vec{r} = (1, 1, 1) + s(1, 2, 0) + t(-1, 0, 3)`","wrong":[{"dir":[2,3,1],"fb":"`(2, 3, 1)` points from the origin to B, not along the plane. Use `vec{AB} = B - A`."},{"dir":[0,1,4],"fb":"`(0, 1, 4)` points from the origin to C, not along the plane. Use `vec{AC} = C - A`."}],"hints":["Use A as `vec{r}_0`.","`vec{AB} = B - A` and `vec{AC} = C - A`.","`vec{AB} = (1, 2, 0)`, `vec{AC} = (-1, 0, 3)`."]},{"id":"b3","goal":2,"kind":"eq","form":"vec","prompt":"Line `vec{r} = (3, 0, 1) + u(1, 2, -1)` and point `Q(1, 1, 1)`. Write a vector equation of the plane that contains both.","_a":"ShcXCUZcP1UdBUkIOUpGBxMPPghIVEhLAGhJGwZEXj0cB0kISFY5Gw==","display":"`vec{r} = (3, 0, 1) + s(1, 2, -1) + t(-2, 1, 0)`","wrong":[{"dir":[1,1,1],"fb":"Use `vec{PQ} = Q - P`, not Q’s position vector."}],"hints":["The line gives a point P(3, 0, 1) and one direction.","The second direction is `vec{PQ} = Q - P`.","`vec{PQ} = (-2, 1, 0)`."]},{"id":"b4","goal":4,"kind":"eq","form":"vec","prompt":"Parallel lines `vec{r} = (1, 0, 0) + u(1, 1, 1)` and `vec{r} = (0, 2, 1) + v(1, 1, 1)`. Write a vector equation of the plane that contains both.","_a":"ShcXCUZcP1cdBUkJOUpGBxMPPghIV0hXbBlHW0ZcP0sAGVcVVTsZ","display":"`vec{r} = (1, 0, 0) + s(1, 1, 1) + t(-1, 2, 1)`","wrong":[{"par":true,"fb":"The lines share a direction. The second direction joins a point on one line to a point on the other."}],"hints":["Two parallel lines share a direction; that’s one direction for the plane.","Join `(1, 0, 0)` to `(0, 2, 1)`.","`(-1, 2, 1)` and `(1, 1, 1)`: not parallel."]},{"id":"b5","goal":2,"kind":"eq","form":"vec","prompt":"Lines `vec{r} = (2, 1, 0) + u(1, 0, 1)` and `vec{r} = (2, 1, 0) + v(0, 1, -2)`. Write a vector equation of the plane that contains both.","_a":"ShcXCUZcP1QdBEkJOUpGBxMPPghIVkhXbBlHW0ZcP1YdBEkUVjsZ","display":"`vec{r} = (2, 1, 0) + s(1, 0, 1) + t(0, 1, -2)`","wrong":[{"r0off":true,"fb":"The lines meet at `(2, 1, 0)`: use it as `vec{r}_0` and both directions."}],"hints":["Where do the two lines meet?","Both pass through `(2, 1, 0)`.","Use `(2, 1, 0)` with the directions `(1, 0, 1)` and `(0, 1, -2)`."]},{"id":"b6","goal":2,"star":true,"kind":"eq","form":"vec","prompt":"`x = 1 - s + 2t`, `y = 3 + s`, `z = 2t`. Write these in vector form.","_a":"ShcXCUZcP1cdBkkJOUpGBxMPPhRVSlVKAWhJGwZEXj0DGVUVVjsZ","display":"`vec{r} = (1, 3, 0) + s(-1, 1, 0) + t(2, 0, 2)`","wrong":[{"r0":[1,3,2],"fb":"`z = 2t` has no constant term, so `z_0 = 0`."}],"hints":["Collect the constants, the `s` terms and the `t` terms.","Constants `(1, 3, 0)`; `s`-coefficients `(-1, 1, 0)`.","`t`-coefficients `(2, 0, 2)`."]}]},{"id":"puzzles","type":"custom","title":"Plane puzzles","summary":"Plane puzzles","star":true,"goal":[3,4,6],"instruction":"Solve each puzzle. Puzzles 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type a number (or choose an answer), then press Check.","msgs":{"empty":"Type your answer first.","err":"Type a number, such as 4 or −2.","vempty":"Fill in all three boxes."},"items":[{"id":"n1","goal":3,"kind":"num","prompt":"Find `k` so that `P(k, 2, 5)` lies on `vec{r} = (1, 0, 1) + s(1, 1, 0) + t(1, 0, 2)`.","label":"`k =`","_a":"BA==","display":"`k = 5`","wrong":[{"v":3,"fb":"`y = s = 2` and `z = 1 + 2t = 5` give `t = 2`; `x = 1 + s + t = 5`."}],"wrongDefault":"Find `s` from `y` and `t` from `z`, then work out `x`.","why":"`s = 2`, `t = 2`, so `x = 1 + 2 + 2 = 5`.","hints":["`y` uses only `s`; `z` uses only `t`.","`s = 2`; `1 + 2t = 5` gives `t = 2`.","`x = 1 + 2 + 2 = 5`."]},{"id":"n2","goal":4,"kind":"num","prompt":"Find `k` so that `A(1, 0, 2)`, `B(2, 1, 3)` and `C(4, k, 5)` do \u003cstrong>not\u003c/strong> determine a unique plane.","label":"`k =`","_a":"Ag==","display":"`k = 3`","wrong":[{"v":4,"fb":"`vec{AC} = (3, k, 3)` must be `3vec{AB} = (3, 3, 3)`."}],"wrongDefault":"The points must be collinear: `vec{AC}` must be a multiple of `vec{AB}`.","why":"`vec{AB} = (1, 1, 1)` and `vec{AC} = (3, k, 3) = 3vec{AB}` when `k = 3`.","hints":["No unique plane means the points are collinear.","`vec{AB} = (1, 1, 1)`, `vec{AC} = (3, k, 3)`.","`vec{AC} = 3vec{AB}` needs `k = 3`."]},{"id":"n3","goal":6,"star":true,"kind":"num","prompt":"Find `k` so that `O(0, 0, 0)`, `B(1, 0, 1)`, `C(0, 1, 1)` and `D(2, 3, k)` are coplanar.","label":"`k =`","_a":"BA==","display":"`k = 5`","wrong":[{"v":1,"fb":"`D = s(1, 0, 1) + t(0, 1, 1)` needs `s = 2`, `t = 3`, so `z = 5`."}],"wrongDefault":"`D = s(1, 0, 1) + t(0, 1, 1)`: find `s` and `t` from `x` and `y`.","why":"`s = 2`, `t = 3`, so `k = s + t = 5`.","hints":["The plane through O, B and C is `vec{r} = s(1, 0, 1) + t(0, 1, 1)`.","`x = s = 2`, `y = t = 3`.","`z = s + t = 5`."]},{"id":"n4","goal":6,"star":true,"kind":"num","prompt":"Where does `vec{r} = (1, 1, 1) + s(1, 0, 1) + t(0, 1, 2)` meet the `z`-axis? Enter the `z`-coordinate.","label":"`z =`","_a":"HAc=","display":"`z = -2`","wrong":[{"v":1,"fb":"On the `z`-axis `x = y = 0`: `s = -1`, `t = -1`, so `z = 1 - 1 - 2 = -2`."}],"wrongDefault":"On the `z`-axis `x = 0` and `y = 0`. Solve for `s` and `t` first.","why":"`x = 1 + s = 0` and `y = 1 + t = 0` give `s = t = -1`, so `z = 1 - 1 - 2 = -2`.","hints":["On the `z`-axis, `x = 0` and `y = 0`.","`1 + s = 0` and `1 + t = 0`.","`z = 1 + s + 2t = -2`."]},{"id":"n5","goal":4,"star":true,"kind":"chips","prompt":"Do the lines `vec{r} = (1, 0, 0) + u(1, 1, 0)` and `vec{r} = (0, 0, 2) + v(0, 1, 1)` lie in one plane?","options":[{"t":"Yes, they’re parallel","why":"`(1, 1, 0)` and `(0, 1, 1)` aren’t multiples, so the lines aren’t parallel.","_n":"1k2cc","_k":"70983f6d"},{"t":"No, they’re skew","why":"Not parallel; `x` gives `u = -1`, `y` gives `v = -1`, then `z`: 0 vs 1. They never meet, so no plane contains both.","_n":"1l35c","_k":"0b7cf634"},{"t":"Yes, they intersect","why":"Not parallel; `x` gives `u = -1`, `y` gives `v = -1`, then `z`: 0 vs 1. They never meet.","_n":"1m36c","_k":"c37aedc9"},{"t":"Only if they’re perpendicular","why":"Lines lie in one plane if they intersect or are parallel; the angle doesn’t matter.","_n":"1nbfc","_k":"af0f3e11"}],"why":"Not parallel, and they never meet: skew lines lie in no common plane.","hints":["Lines lie in one plane if they intersect or are parallel.","Set `(1 + u, u, 0) = (0, v, 2 + v)`.","`u = -1`, `v = -1`, but 0 ≠ 1: skew."]},{"id":"n6","goal":4,"star":true,"kind":"vec","prompt":"Give a direction `vec{b}` so that `vec{r} = s(1, 0, 2) + t vec{b}` is the `xz`-plane. (Any valid answer; whole numbers from −4 to 4.)","label":"`vec{b} =`","_a":"ShcLG149VEoAGVVkSEQKCUUXX2JVSlRKA2gY","display":"any `(p, 0, q)` with `q ≠ 2p`, such as `(0, 0, 1)` or `(1, 0, 0)`","msgs":{"zero":"A direction can’t be `vec{0}`.","par":"Parallel to `(1, 0, 2)`: only a line.","off":"That leaves the `xz`-plane (`y` must stay 0).","range":"Use whole numbers from −4 to 4."},"why":"Your direction has `y = 0` and isn’t a multiple of `(1, 0, 2)`, so together they span the `xz`-plane.","hints":["Every point of the `xz`-plane has `y = 0`.","So `vec{b}` needs a 0 in the middle.","And it mustn’t be a multiple of `(1, 0, 2)`: `(0, 0, 1)` works."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Benjamin","how":"","goal":[2,3,4],"instruction":"Benjamin made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find a vector equation of the plane through `A(1, 2, 3)`, `B(2, 0, 4)` and `C(3, 3, 1)`.","steps":["Use A as the point: `vec{r}_0 = (1, 2, 3)`.","Directions: `(2, 0, 4)` and `(3, 3, 1)`.","`vec{r} = (1, 2, 3) + s(2, 0, 4) + t(3, 3, 1)`."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Use `vec{AB} = (1, -2, 1)` and `vec{AC} = (2, 1, -2)`.","why":"Directions must join points of the plane: B − A and C − A.","_n":"1obec","_k":"9cbe2058"},{"t":"Step 2 is correct.","why":"Position vectors point from the origin. Check: no `s` and `t` give B on Benjamin’s plane.","_n":"1pc1c","_k":"c044b967"},{"t":"Use `vec{r}_0 = (0, 0, 0)` instead.","why":"The plane needn’t pass through the origin.","_n":"1qc0c","_k":"cc4b3c57"},{"t":"Use `vec{AB}` and `vec{BA}`.","why":"Those are parallel: they sweep only a line.","_n":"1rbbc","_k":"9773aa01"}],"hints":["Does Benjamin’s plane pass through B?","Directions must join points of the plane.","`vec{AB} = (1, -2, 1)`, `vec{AC} = (2, 1, -2)`."]},{"id":"e2","goal":3,"task":"Is `P(4, 1, 8)` on the plane `vec{r} = (1, 1, 1) + s(1, 0, 2) + t(1, 1, 1)`?","steps":["`x`: `1 + s + t = 4`.","`y`: `1 + t = 1`, so `t = 0`.","From `x`: `s = 3`.","`s` and `t` exist, so P is on the plane."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct. Keep checking.",""],"fixes":[{"t":"Solve the `z`-equation first instead.","why":"Order doesn’t matter; all three must agree.","_n":"1sbac","_k":"e3eb9773"},{"t":"Step 4 is correct.","why":"Two equations can always be solved. The point is on the plane only if the \u003cstrong>third\u003c/strong> equation agrees.","_n":"1tbdc","_k":"8cef4cb1"},{"t":"Check `z`: `1 + 2(3) + 0 = 7 ≠ 8`, so P is \u003cstrong>not\u003c/strong> on the plane.","why":"The third equation decides: `z` would be 7, not 8.","_n":"1ubcc","_k":"a2500efc"},{"t":"Use `t = 1`.","why":"`y` forces `t = 0`.","_n":"1vb7c","_k":"ed258628"}],"hints":["How many equations has Benjamin used?","Two. What does the third say?","`z = 7`, not 8."]},{"id":"e3","goal":4,"task":"Find a vector equation of the plane containing the line `vec{r} = (2, 0, 1) + u(1, 3, -1)` and the point `Q(3, 3, 0)`.","steps":["A point on the line: `P(2, 0, 1)`.","Second direction: `vec{PQ} = (1, 3, -1)`.","Plane: `vec{r} = (2, 0, 1) + s(1, 3, -1) + t(1, 3, -1)`."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2’s arithmetic is right. Look at what it tells you.",""],"fixes":[{"t":"Change `t` to `-t`.","why":"Still parallel.","_n":"1wb6c","_k":"174006f4"},{"t":"`vec{PQ}` equals the line’s direction, so Q is \u003cstrong>on\u003c/strong> the line: a line and a point on it don’t fix one plane (infinitely many planes contain them).","why":"Two parallel directions sweep only a line, so there’s no unique plane.","_n":"1xb9c","_k":"6a3b8f2b"},{"t":"Step 3 is correct.","why":"Two parallel directions sweep only a line.","_n":"1ybac","_k":"05c4b34d"},{"t":"Use `t(3, 3, 0)`, Q’s position vector.","why":"That gives one plane of infinitely many, chosen by accident.","_n":"1zb7c","_k":"a4cc96fc"}],"hints":["Compare `vec{PQ}` with `(1, 3, -1)`.","They’re equal, so `Q = P + 1(1, 3, -1)`.","Q lies on the line: no unique plane."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the plane weaver: the collapse to a line, or that swapping the directions didn’t move the plane?"},{"id":"j2","q":"In your own words, why does a plane need two non-parallel directions, while a line needs only one?"},{"id":"j3","q":"Explain to a friend how to decide whether a point is on a plane given in vector form."},{"id":"j4","q":"Which part still trips you up (directions from points, the third-equation check, recognizing the same plane)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"For the plane `vec{r} = (2, -1, 4) + s(1, 0, 3) + t(2, 5, -1)`, which statement is true?","options":[{"t":"`(2, -1, 4)` is a point on the plane, and `(1, 0, 3)` and `(2, 5, -1)` are directions along it.","why":"`vec{r}_0` is a point; the vectors multiplied by `s` and `t` are directions.","_n":"20b8c","_k":"ce977253"},{"t":"The parameters `s` and `t` must be equal.","why":"They vary independently; equal values give only a line.","_n":"21bdc","_k":"eb5a63c9"},{"t":"`(1, 0, 3)` is a point on the plane.","why":"It’s a direction; no `s` and `t` reach the point `(1, 0, 3)`.","_n":"22bec","_k":"14da6c8b"},{"t":"The plane passes through the origin.","why":"It passes through `(2, -1, 4)`; the origin isn’t reachable here.","_n":"23bbc","_k":"0e358115"}]},"b":{"prompt":"For the plane `vec{r} = (0, 3, -2) + s(4, 1, 0) + t(1, -1, 2)`, which statement is true?","options":[{"t":"The parameters `s` and `t` must be equal.","why":"They vary independently; equal values give only a line.","_n":"24bcc","_k":"201e584b"},{"t":"The plane passes through the origin.","why":"It passes through `(0, 3, -2)`; the origin isn’t reachable here.","_n":"25b1c","_k":"5980dd20"},{"t":"`(0, 3, -2)` is a point on the plane, and `(4, 1, 0)` and `(1, -1, 2)` are directions along it.","why":"`vec{r}_0` is a point; the vectors multiplied by `s` and `t` are directions.","_n":"26b2c","_k":"7185bf1f"},{"t":"`(4, 1, 0)` is a point on the plane.","why":"It’s a direction; no `s` and `t` reach the point `(4, 1, 0)`.","_n":"27aba","_k":"276d12fa"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Parametric equations of the plane through `(1, 0, -2)` with directions `(2, 1, 0)` and `(-1, 3, 1)`?","options":[{"t":"`x = 1 + s`, `y = 4s`, `z = -2 + s`","why":"That uses one parameter with `(2, 1, 0) + (-1, 3, 1)`: a line.","_n":"28aaa","_k":"721b82f6"},{"t":"`x = 1 + 2s - t`, `y = s + 3t`, `z = -2 + t`","why":"Each row uses one component of the point and of each direction.","_n":"29a9a","_k":"67a9e6bc"},{"t":"`x = 1 + 2s + t`, `y = s + 3t`, `z = -2 + t`","why":"The `x`-component of the second direction is −1.","_n":"2aa8a","_k":"73f361aa"},{"t":"`x = 1 + 2s - t`, `y = s + 3t`, `z = -2 + s`","why":"The `z`-components are 0 and 1, so `z = -2 + t`.","_n":"2bafa","_k":"31dd932b"}]},"b":{"prompt":"Parametric equations of the plane through `(0, 2, 3)` with directions `(1, -1, 2)` and `(3, 0, 1)`?","options":[{"t":"`x = s + 3t`, `y = 2 + s`, `z = 3 + 2s + t`","why":"The `y`-component of the first direction is −1, so `y = 2 - s`.","_n":"2caea","_k":"289014f1"},{"t":"`x = 4s`, `y = 2 - s`, `z = 3 + 3s`","why":"That uses one parameter with `(1, -1, 2) + (3, 0, 1)`: a line.","_n":"2dada","_k":"43b9795b"},{"t":"`x = s + 3t`, `y = 2 - s`, `z = 3 + s + 2t`","why":"The `z`-components are 2 and 1, so `z = 3 + 2s + t`.","_n":"2eaca","_k":"62d9f5bd"},{"t":"`x = s + 3t`, `y = 2 - s`, `z = 3 + 2s + t`","why":"Each row uses one component of the point and of each direction.","_n":"2fb3a","_k":"04fe9c24"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which information determines exactly one plane?","options":[{"t":"The point `(1, 2, 3)` with directions `(1, -2, 4)` and `(-2, 4, -8)`","why":"Parallel directions.","_n":"2gb2a","_k":"9e0a6453"},{"t":"The line `vec{r} = t(1, 1, 1)` and the point `(2, 2, 2)`","why":"`(2, 2, 2)` is on the line (`t = 2`).","_n":"2ha5a","_k":"cdd09f1a"},{"t":"The points `A(1, 0, 0)`, `B(0, 1, 0)` and `C(0, 0, 1)`","why":"`vec{AB} = (-1, 1, 0)` and `vec{AC} = (-1, 0, 1)` aren’t parallel.","_n":"2ia6a","_k":"f3c0a563"},{"t":"The points `(1, 1, 1)`, `(2, 3, 4)` and `(3, 5, 7)`","why":"`vec{AC} = 2vec{AB}`: collinear.","_n":"2ja7a","_k":"4cf548e6"}]},"b":{"prompt":"Which information determines exactly one plane?","options":[{"t":"The point `(0, 0, 0)` with directions `(3, 0, -6)` and `(-1, 0, 2)`","why":"Parallel directions.","_n":"2ka8a","_k":"9f8e3b30"},{"t":"The line `vec{r} = (1, 0, 2) + t(2, 1, 0)` and the point `(1, 1, 1)`","why":"`(0, 1, -1)` isn’t parallel to `(2, 1, 0)`.","_n":"2la9a","_k":"0fddf7e5"},{"t":"The line `vec{r} = (2, 0, 1) + t(1, 1, 1)` and the point `(4, 2, 3)`","why":"That point is on the line (`t = 2`).","_n":"2maaa","_k":"2684955b"},{"t":"The points `(0, 1, 2)`, `(1, 3, 3)` and `(3, 7, 5)`","why":"`vec{AC} = 3vec{AB}`: collinear.","_n":"2naba","_k":"3347f4cb"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Is `P(5, 3, 2)` on the plane `vec{r} = (1, 1, 0) + s(2, 0, 1) + t(0, 1, 1)`?","options":[{"t":"No: P isn’t a multiple of either direction.","why":"Points of the plane are `vec{r}_0` plus combinations, not multiples of a direction.","_n":"2oaca","_k":"e5d9ce6f"},{"t":"Yes: `s = 2` and `t = 2` satisfy the `x`- and `y`-equations.","why":"Two equations can always be solved. The point is on the plane only if the \u003cstrong>third\u003c/strong> equation agrees.","_n":"2pada","_k":"11ad284f"},{"t":"Yes: `s = 2` and `t = 0`.","why":"That fits `x` and `z`, but then `y = 1`, not 3.","_n":"2qaea","_k":"67e4d16b"},{"t":"No: `s = 2` and `t = 2` give `z = 4`, not 2.","why":"`x` gives `s = 2`, `y` gives `t = 2`, and the third equation fails.","_n":"2r5aa","_k":"7b87f59b"}]},"b":{"prompt":"Is `P(3, 4, 6)` on the plane `vec{r} = (1, 0, 2) + s(1, 2, 0) + t(0, 1, 2)`?","options":[{"t":"Yes: `s = 2` and `t = 0` satisfy the `x`- and `y`-equations.","why":"Two equations can always be solved. The point is on the plane only if the \u003cstrong>third\u003c/strong> equation agrees.","_n":"2s5ba","_k":"6a622152"},{"t":"No: P isn’t a multiple of either direction.","why":"Points of the plane are `vec{r}_0` plus combinations, not multiples of a direction.","_n":"2t5ca","_k":"87c5cbe0"},{"t":"Yes: `s = 2` and `t = 2`.","why":"That fits `x` and `z`, but then `y = 6`, not 4.","_n":"2u5da","_k":"53beddde"},{"t":"No: `s = 2` and `t = 0` give `z = 2`, not 6.","why":"`x` gives `s = 2`, `y` gives `t = 0`, and the third equation fails.","_n":"2v5ea","_k":"70c27a23"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"For which `k` do `A(2, 1, 0)`, `B(3, 3, 1)` and `C(5, k, 3)` fail to determine a unique plane?","options":[{"t":"`k = 5`","why":"That subtracts A’s `y` instead of adding it back: `k = 6 + 1`.","_n":"2w5fa","_k":"0652a102"},{"t":"`k = 7`","why":"`vec{AB} = (1, 2, 1)`; `vec{AC} = (3, k - 1, 3)` must be `3vec{AB}`, so `k - 1 = 6`.","_n":"2x60a","_k":"095684fd"},{"t":"No value of `k`: three different points always determine a plane.","why":"Parallel directions point along one line, so `s` and `t` only slide you along that line. A plane needs two directions that aren’t multiples.","_n":"2y61a","_k":"5c3d4426"},{"t":"`k = 6`","why":"That forgets to subtract A’s `y`-coordinate: `vec{AC}` has `k - 1`.","_n":"2z52a","_k":"95d90a83"}]},"b":{"prompt":"For which `k` do `A(1, 2, 3)`, `B(2, 4, 2)` and `C(4, k, 0)` fail to determine a unique plane?","options":[{"t":"`k = 6`","why":"Forgets to subtract A’s `y`-coordinate.","_n":"3053a","_k":"ca7fb8df"},{"t":"`k = 8`","why":"`vec{AB} = (1, 2, -1)`; `vec{AC} = (3, k - 2, -3) = 3vec{AB}` gives `k - 2 = 6`.","_n":"31e0a","_k":"6a516df2"},{"t":"`k = 4`","why":"Subtracts A’s `y` instead of adding it back.","_n":"32dfa","_k":"0dadb243"},{"t":"No value of `k`.","why":"Collinear points don’t determine a unique plane, and `k = 8` makes them collinear.","_n":"33dea","_k":"7900396d"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Which equation describes the same plane as `vec{r} = (0, 0, 1) + s(1, 0, 1) + t(0, 1, 1)`?","options":[{"t":"`vec{r} = (1, 1, 3) + s(1, 1, 2) + t(1, -1, 0)`","why":"`(1, 1, 3) = (0, 0, 1) + (1, 0, 1) + (0, 1, 1)`; the new directions are the sum and difference of the old ones.","_n":"34dda","_k":"295d64cc"},{"t":"`vec{r} = (1, 1, 1) + s(1, 0, 1) + t(0, 1, 1)`","why":"Same directions, but `(1, 1, 1)` isn’t on the plane: this is a parallel plane.","_n":"35e4a","_k":"1615f8ed"},{"t":"`vec{r} = (0, 0, 1) + s(1, 0, 1) + t(2, 0, 2)`","why":"Parallel directions: a line.","_n":"36e3a","_k":"ae811579"},{"t":"`vec{r} = (0, 0, 1) + s(1, 1, 1) + t(0, 1, 1)`","why":"Same point, but `(1, 1, 1)` isn’t a combination of the old directions: a different plane through that point.","_n":"37e2a","_k":"9535379d"}]},"b":{"prompt":"Which equation describes the same plane as `vec{r} = (1, 0, 0) + s(1, 1, 0) + t(0, 1, 2)`?","options":[{"t":"`vec{r} = (2, 2, 2) + s(1, 2, 2) + t(1, 0, -2)`","why":"`(2, 2, 2) = (1, 0, 0) + (1, 1, 0) + (0, 1, 2)`; the new directions are the sum and difference of the old ones.","_n":"38e1a","_k":"46c129ee"},{"t":"`vec{r} = (1, 0, 0) + s(1, 1, 0) + t(-2, -2, 0)`","why":"Parallel directions: a line.","_n":"39d8a","_k":"cc580fea"},{"t":"`vec{r} = (0, 0, 1) + s(1, 1, 0) + t(0, 1, 2)`","why":"Same directions, but `(0, 0, 1)` isn’t on the plane: this is a parallel plane.","_n":"3ad7a","_k":"99070edd"},{"t":"`vec{r} = (1, 0, 0) + s(1, 1, 0) + t(1, 0, 1)`","why":"Same point, but `(1, 0, 1)` isn’t a combination of the old directions: a different plane through that point.","_n":"3be6b","_k":"a2c7e4f5"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why `vec{r} = (1, 2, 3) + s(2, -1, 4) + t(-4, 2, -8)` is not a plane?","options":[{"t":"“It is a plane: any two direction vectors make one.”","why":"Parallel directions point along one line, so `s` and `t` only slide you along that line. A plane needs two directions that aren’t multiples.","_n":"3ce7b","_k":"d8d7e261"},{"t":"“A plane in three dimensions needs three direction vectors.”","why":"Two non-parallel directions are enough.","_n":"3de4b","_k":"202eb7ad"},{"t":"“`(-4, 2, -8) = -2(2, -1, 4)`, so both directions point along one line. Every point is `(1, 2, 3) + (s - 2t)(2, -1, 4)`, which is a line.”","why":"It names the parallel directions and shows the single combined parameter.","_n":"3ee5b","_k":"fd5a3aee"},{"t":"“The second direction has negative components.”","why":"Negative components are fine.","_n":"3fe2b","_k":"c21fb62d"}]},"b":{"prompt":"Which is the best explanation of why `vec{r} = (0, 1, -1) + s(3, 0, -6) + t(-1, 0, 2)` is not a plane?","options":[{"t":"“A direction with a 0 component can’t be used.”","why":"Zeros are fine.","_n":"3ge3b","_k":"e9d52531"},{"t":"“It is a plane: any two direction vectors make one.”","why":"Parallel directions point along one line, so `s` and `t` only slide you along that line. A plane needs two directions that aren’t multiples.","_n":"3he0b","_k":"8072b755"},{"t":"“A plane in three dimensions needs three direction vectors.”","why":"Two non-parallel directions are enough.","_n":"3ie1b","_k":"9bfa3731"},{"t":"“`(3, 0, -6) = -3(-1, 0, 2)`, so both directions point along one line. Every point is `(0, 1, -1) + (t - 3s)(-1, 0, 2)`, which is a line.”","why":"It names the parallel directions and shows the single combined parameter.","_n":"3jdeb","_k":"09be2716"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Two students wrote `vec{r} = (1, 0, 2) + s(1, 1, 0) + t(0, 1, 1)` and `vec{r} = (2, 2, 3) + s(1, 2, 1) + t(1, 0, -1)`. Which is the best justification that these are the same plane?","options":[{"t":"“`(2, 2, 3)` is on the first plane, so the planes are the same.”","why":"A shared point isn’t enough: parallel directions are needed too.","_n":"3kdfb","_k":"271c542b"},{"t":"“Both have two direction vectors, so they’re the same plane.”","why":"Every plane has two; that proves nothing.","_n":"3lccb","_k":"437ba840"},{"t":"“`(2, 2, 3)` is on the first plane (`s = 1`, `t = 1`), and `(1, 2, 1)` and `(1, 0, -1)` are the sum and difference of the first plane’s directions, so they lie along it and aren’t parallel.”","why":"It checks both things: a shared point and two non-parallel directions along the plane.","_n":"3mcbb","_k":"554d50bb"},{"t":"“The equations look different, so the planes are different.”","why":"Many equations describe one plane. Check that the new point is on the plane and the new directions lie along it.","_n":"3nceb","_k":"99f3b980"}]},"b":{"prompt":"Two students wrote `vec{r} = (0, 1, 1) + s(2, 0, 1) + t(0, 1, -1)` and `vec{r} = (2, 1, 2) + s(2, 1, 0) + t(2, -1, 2)`. Which is the best justification that these are the same plane?","options":[{"t":"“`(2, 1, 2)` is on the first plane (`s = 1`, `t = 0`), and `(2, 1, 0)` and `(2, -1, 2)` are the sum and difference of the first plane’s directions, so they lie along it and aren’t parallel.”","why":"It checks both things: a shared point and two non-parallel directions along the plane.","_n":"3ocdb","_k":"53bceb23"},{"t":"“The equations look different, so the planes are different.”","why":"Many equations describe one plane. Check that the new point is on the plane and the new directions lie along it.","_n":"3pd0b","_k":"8b251d42"},{"t":"“Both have two direction vectors, so they’re the same plane.”","why":"Every plane has two; that proves nothing.","_n":"3qcfb","_k":"d4855920"},{"t":"“`(2, 1, 2)` is on the first plane, so the planes are the same.”","why":"A shared point isn’t enough: parallel directions are needed too.","_n":"3rd2b","_k":"1809b2ba"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A solar panel frame has corners `A(0, 0, 2)`, `B(4, 0, 2)`, `C(4, 3, 4)` and `D(0, 3, k)`, in metres. For which `k` is the panel flat (all four corners coplanar)?","options":[{"t":"`k = 2`","why":"That copies A’s height; the frame rises 2 m from A to C.","_n":"3sd1b","_k":"bb5d1b30"},{"t":"`k = 6`","why":"That adds the rise twice.","_n":"3td4b","_k":"4c48bc12"},{"t":"`k = 4`","why":"`vec{AB} = (4, 0, 0)`, `vec{AC} = (4, 3, 2)`; `D - A = (0, 3, k - 2) = -vec{AB} + vec{AC}` needs `k - 2 = 2`.","_n":"3ud3b","_k":"847f61bf"},{"t":"Any `k`: four points always lie in a plane.","why":"Three points fix a plane; a fourth must be checked.","_n":"3v52b","_k":"b8a21c0d"}]},"b":{"prompt":"Corners `A(1, 0, 0)`, `B(1, 4, 0)`, `C(-2, 4, 3)` and `D(-2, 0, k)`, in metres. For which `k` are they coplanar?","options":[{"t":"`k = 6`","why":"Adds the rise twice.","_n":"3w53b","_k":"6fd73031"},{"t":"`k = 3`","why":"`vec{AB} = (0, 4, 0)`, `vec{AC} = (-3, 4, 3)`; `D - A = (-3, 0, k) = -vec{AB} + vec{AC}` needs `k = 3`.","_n":"3x54b","_k":"0826803e"},{"t":"Any `k`.","why":"Three points fix a plane; a fourth must be checked.","_n":"3y55b","_k":"4ab7c015"},{"t":"`k = 0`","why":"Copies A’s height; the frame rises 3 m from A to C.","_n":"3z4eb","_k":"0fef2989"}]}},{"id":"a2","cat":"A","goal":[3,6],"a":{"prompt":"A drone flies in a sloped flight corridor modelled by the plane `vec{r} = (0, 0, 10) + s(1, 0, 0) + t(0, 2, 1)`, in metres. How high is it when it’s above the ground point `(5, 8)`?","options":[{"t":"10 m","why":"The corridor isn’t horizontal: it rises 1 m for every `t`.","_n":"404fb","_k":"9b76a595"},{"t":"15 m","why":"That puts `s` into `z`; the first direction has `z`-component 0.","_n":"4150b","_k":"329d94d9"},{"t":"18 m","why":"That uses `t = 8`: the `y`-component of the direction is 2, so `t = 4`.","_n":"4251b","_k":"9c567813"},{"t":"14 m","why":"`x = s = 5`; `y = 2t = 8` gives `t = 4`; `z = 10 + t = 14`.","_n":"435ab","_k":"f02ae5c5"}]},"b":{"prompt":"A corridor is modelled by `vec{r} = (0, 0, 20) + s(1, 0, -1) + t(0, 3, 0)`, in metres. How high is the drone above the ground point `(4, 6)`?","options":[{"t":"16 m","why":"`s = 4`, `t = 2`, `z = 20 - 4 = 16`.","_n":"445bb","_k":"ca412311"},{"t":"20 m","why":"The corridor slopes down 1 m per unit of `s`.","_n":"4558b","_k":"2bf47755"},{"t":"18 m","why":"`t`’s direction has `z`-component 0.","_n":"4657b","_k":"c13adb91"},{"t":"24 m","why":"The `z`-component of `(1, 0, -1)` is −1.","_n":"4756b","_k":"579ba245"}]}}]},"task":{"title":"Roof designer","summary":"Roof designer","statement":"\u003cp>A roof’s ridge runs from `R_1(0, 0, 4)` to `R_2(6, 0, 4)`, and the roof slopes down to the eave point `E(0, 2, 2)`. Write a vector equation `vec{r} = vec{r}_0 + s vec{a} + t vec{b}` for the roof plane that meets every condition. There’s more than one answer.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>It’s a genuine plane (the directions aren’t parallel).\u003c/li>\u003cli>It contains the ridge points `R_1` and `R_2`.\u003c/li>\u003cli>It contains the eave point E.\u003c/li>\u003cli>Neither direction runs along the ridge (not parallel to `(1, 0, 0)`).\u003c/li>\u003cli>`vec{r}_0` isn’t one of `R_1`, `R_2` or E.\u003c/li>\u003c/ol>\u003c/div>","checks":["A genuine plane","Contains the ridge","Contains the eave point","No direction along the ridge","A new starting point"],"tips":["Your directions are parallel, so the equation sweeps only a line. Pick a `vec{b}` that isn’t a multiple of `vec{a}`.","Your plane misses `R_1` or `R_2`. Both are on the roof, so `R_2 - R_1 = (6, 0, 0)` runs along the roof.","Your plane misses E. `vec{ER_1} = (0, -2, 2)` also runs along the roof.","`(1, 0, 0)` is along the roof but not allowed here: combine it with `(0, -1, 1)`, e.g. `(1, -1, 1)`.","Start from another roof point: any point you can reach with `s` and `t` works."],"explainPrompt":"Explain how you know your plane contains `R_1`, `R_2` and E, and why your two directions give a plane.","vocab":"Use the words direction vector, parallel, parameter and point on the plane.","more":"There’s more than one answer. Can you find another?","after3":"Every roof point has `y + z = 4`, and every roof direction has `y + z = 0`. That’s the plane’s scalar equation, coming in module 52."},"cards":[["Vector equation of a plane","`vec{r} = vec{r}_0 + s vec{a} + t vec{b}`, `s, t ∈ ℝ`: a point and two non-parallel directions."],["Parametric equations","`x = x_0 + s a_1 + t b_1`, `y = y_0 + s a_2 + t b_2`, `z = z_0 + s a_3 + t b_3`."],["Parallel directions","Give only a line, never a plane."],["Three points A, B, C","`vec{r} = vec{OA} + s vec{AB} + t vec{AC}`, if they aren’t collinear."],["Collinear points","Lie on one line: infinitely many planes contain them."],["Line + point","Use the line’s point and direction, plus `vec{PQ}`. Fails if Q is on the line."],["Point on the plane?","Solve two equations for `s` and `t`, then check the third."],["Many equations, one plane","Any point of the plane, any two non-parallel in-plane directions."],["Sum in a plane","The sum of two vectors along a plane also lies along the plane."],["Two parameters","One parameter gives a line; a plane needs two."],["Coplanar points","Four points are coplanar if the fourth lies on the plane of the other three."],["Skew lines","Not parallel and never meet: no plane contains both."]]}};</script>
