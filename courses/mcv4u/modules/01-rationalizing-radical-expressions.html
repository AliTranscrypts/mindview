.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
/* MCV4U 01: hero, conjugate machine (area tiles, menus, readout), V8 exact boxes, Part 3 stations, task */
.rr-hl{display:inline-block;background:var(--hi);color:var(--hi-ink);border-radius:.14em;padding:.04em .14em;vertical-align:middle;line-height:1}
.hero .hero-eq.sm{font-size:clamp(1.35rem,4.4vw,2.3rem);line-height:1.15}
@media (min-width:821px){ .pg.rr-pg{grid-template-rows:auto 1fr} }
.opt .m,.sbtn .m,.fb .m,.hints .m,.read dd .m,.cw .m,.rr-note .m,.rr-sum .m,.rr-lm .m,.rr-mi .m,.chip .m,.mitem .m{white-space:normal}

/* hero */
.rr-hero{display:grid;gap:8px;justify-items:center;text-align:center}
.rr-hx{font:400 clamp(1.35rem,3.6vw,1.9rem) var(--font-math);margin:0;min-height:2.6em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.2em}
.rr-slide{display:inline-block;opacity:0;transform:translateX(48px);transition:opacity .7s ease,transform .7s ease}
.rr-slide.in{opacity:1;transform:none}
.rr-hg,.rr-hs{opacity:0;transition:opacity .6s ease}
.rr-hg.on,.rr-hs.on{opacity:1}
.rr-hg{width:min(100%,330px)}
.rr-hs{margin:0;min-height:1.6em;font-size:1.05rem}
.rr-hsn{font-size:.88rem;color:var(--ink-2)}
.rr-hero canvas.plot.nl{width:100%}

/* area tiles */
.rr-grid{display:grid;grid-template-columns:auto repeat(var(--nc,2),minmax(4.4em,1fr));gap:6px;align-items:stretch}
.rr-corner{align-self:center;justify-self:center;color:var(--ink-2);font:400 1.1rem var(--font-math)}
.rr-hd{display:flex;align-items:center;justify-content:center;color:var(--ink-2);font:400 1.08rem var(--font-math);padding:2px 6px}
.rr-hr{justify-content:flex-end}
.rr-tile{position:relative;display:flex;align-items:center;justify-content:center;min-height:2.8em;padding:.3em .4em;border:1.5px solid var(--ink-2);border-radius:7px;background:var(--sheet);font:400 1.18rem var(--font-math);text-align:center;transition:opacity .35s ease}
.rr-tile.rad{background:var(--hi-soft);border-color:var(--rule)}
.rr-tile.flash{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.rr-tile.gone{visibility:hidden}
.rr-tile.merged{border:2px dashed var(--ink);background:var(--hi-soft)}
.rr-tile.pre{opacity:0}
.rr-tile .m{font-size:1em;white-space:normal}
.rr-area{max-width:420px}
.rr-sum{margin:10px 0 0;min-height:1.5em}
.rr-empty{margin:12px 0}

/* machine layout */
.rr-cap{font-size:clamp(1.3rem,3.4vw,1.9rem)}
.rr-capn{font:400 .5em var(--font-ui);color:var(--ink-2);vertical-align:middle}
.rr-vseg{margin:0 0 12px}
.rr-vseg .seg-wrap{margin-top:0}
.rr-vw{min-height:120px}
.rr-nlkey{margin:6px 0 0}
.rr-note{margin:12px 0 0;min-height:1.4em;font-weight:700}
.rr-note.good{color:var(--green)}
.rr-note.bad{color:var(--red)}
.rr-lab{margin:12px 0 6px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.rr-exs{margin-bottom:6px}
.rr-exs .fchip{font-size:1.02rem;padding:.25em .6em}
.rr-twochip{font-family:var(--font-ui)!important;font-size:.95rem!important;font-weight:700}
.rr-menu{border:1.5px solid var(--rule);border-radius:8px;margin:12px 0 0;padding:8px 10px 10px;display:grid;gap:6px}
.rr-menu legend{font-size:.85rem;font-weight:700;color:var(--ink-2);padding:0 4px}
.rr-menu legend .m{white-space:normal}
.rr-mi{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 8px;border:1.5px solid transparent;border-radius:7px;cursor:pointer}
.rr-mi input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:none}
.rr-mi.on{border-color:var(--ink);background:var(--hi-soft)}
.rr-sl .slider output{color:var(--ink)!important}
.rr-sl input[type=range]{accent-color:var(--ink)!important}
.rr-clr{margin-top:10px}
.rr-finbox{margin-top:14px;padding:10px 12px 12px;border:1.5px dashed var(--ink-2);border-radius:8px;background:var(--paper)}
.rr-finbox .rr-lab{margin-top:0}
.rr-ok{color:var(--green);font-weight:700}
.rr-no{color:var(--red);font-weight:700}
.rr-lines{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rr-lines li{display:grid;gap:2px;padding:8px 10px;border-left:3px solid var(--rule);background:var(--paper);border-radius:0 6px 6px 0}
.rr-ll{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.rr-lm{font:400 1.12rem var(--font-math);overflow-wrap:anywhere}

/* V8 exact boxes */
.rr-xb{display:inline-grid;gap:4px;max-width:100%}
.rr-xn,.rr-xd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rr-xrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.rr-xbar{height:0;border-top:2px solid var(--ink);margin:2px 0}
.rr-xt{display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
.rr-xc,.rr-xr{width:3.2rem;min-height:38px;border:1.5px solid var(--rule);border-radius:7px;background:var(--sheet);color:var(--ink);padding:.25em .35em;font:400 1.12rem var(--font-math);text-align:center}
.rr-xr{width:2.9rem}
.rr-xc:focus,.rr-xr:focus{border-color:var(--ink);outline:2px solid var(--hi);outline-offset:1px}
.rr-wide{width:6rem}
.rr-xs{font:400 1.3rem var(--font-math);margin:0 1px 0 3px}
.rr-xk{min-width:34px;min-height:38px;border:1.5px solid var(--ink);border-radius:7px;background:var(--hi-soft);color:var(--ink);font:400 1.25rem var(--font-math);margin:0 2px;padding:0 4px}
.rr-xp{font:400 1.2rem var(--font-math);margin:0 2px}
.rr-xbtns{display:inline-flex;gap:6px}
.rr-xbtns .btn{min-height:30px}
.rr-ab{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.15rem}
.rr-nl{display:inline-flex;align-items:center;gap:8px;font-weight:400}
.rr-r4{font-size:1.15rem}
.rr-r4 .frac{font-size:1em;margin:0}
.rr-r4 .fn,.rr-r4 .fd{display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 6px}
.rr-sg{display:inline-flex;gap:4px;margin:0 4px}
.rr-sg .chip{min-width:36px;font:400 1.15rem var(--font-math)}
.rr-sg .chip[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--ink)}
.rr-fr{margin:10px 0 4px;max-width:100%;overflow-x:auto;padding:2px}

/* Part 3 stations */
.rr-st + .rr-st{margin-top:22px;padding-top:18px;border-top:1.5px solid var(--rule)}
.rr-st h3{margin-top:0}
.rr-tw{margin:10px 0 0;max-width:520px}
.rr-tw table.vt td,.rr-tw table.vt th{padding:5px 10px}
.rr-tw .m{white-space:nowrap}
table.vt tr.rr-h0 td{font-weight:700;border-top:2px solid var(--ink-2)}
#rr-l1,#rr-l3{margin-top:12px}
.rr-s2w{max-width:560px}
.rr-s2cap{font-size:clamp(1.2rem,3vw,1.6rem)}
.rr-capt{margin:10px 0 0;max-width:560px}
#rr-s3m .fb{margin-top:10px}

/* task */
.rr-mhcap{font-size:clamp(1.2rem,3vw,1.6rem)}
#mh-note{margin:8px 0 0}

@media (max-width:560px){
  .rr-grid{grid-template-columns:auto repeat(var(--nc,2),minmax(3.6em,1fr))}
  .rr-tile{font-size:1.02rem;min-height:2.5em}
  .rr-hd{font-size:.98rem;padding:2px 3px}
  .rr-xc,.rr-xr{width:2.7rem;font-size:1.05rem}
  .rr-xr{width:2.5rem}
}

plying top and bottom multiplies by 1. The dot jumps from about 3.46 to 2."},{"id":"p3","prompt":"The area model will multiply `(3 + √5)(3 - √5)`. What is the product?","options":[{"t":"`9 - √5`","_n":"w895","_k":"c612bd79"},{"t":"4","_n":"x845","_k":"90ae386c"},{"t":"6","_n":"y835","_k":"b75c6cb5"},{"t":"14","_n":"z865","_k":"d125d18f"}],"explain":"The tiles are 9, `+3√5`, `-3√5` and −5. 9 − 5 = 4. The radical squares to 5."},{"id":"p4","prompt":"What does `{2}/{√7 + √5}` become once it’s rationalized?","options":[{"t":"`{√7 - √5}/{6}`","_n":"10855","_k":"f86055b1"},{"t":"`√7 - √5`","_n":"11805","_k":"7d16ce12"},{"t":"`√7 + √5`","_n":"127f5","_k":"d6cf4565"},{"t":"`{√3}/{3}`","_n":"137e4","_k":"520c5500"}],"explain":"`{2(√7 - √5)}/{7 - 5}`: the denominator is 7 − 5 = 2, which cancels the 2 on top. `{√3}/{3}` comes from adding under one root, `√7 + √5 = √12`, which is false."}],"chalIntro":"Set up the machine, write your final form in the boxes under it, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Rationalize `{10}/{3√5}` and simplify fully. Write your final form in the boxes under the machine.","why":"× `{√5}/{√5}` gives `{10√5}/{3 · 5} = {10√5}/{15} = {2√5}/{3}`. The value never moved.","hints":["Only `√5` needs removing.","× `{√5}/{√5}` gives `{10√5}/{3 · 5}`.","`{10√5}/{15} = {2√5}/{3}`."]},{"id":"tc2","goal":3,"prompt":"Rationalize `{√3 + 1}/{√3 - 1}` and write it as `a + b√3`.","why":"Top: `(√3 + 1)^2 = 4 + 2√3`. Bottom: 3 − 1 = 2. So `{4 + 2√3}/{2} = 2 + √3`: `a = 2` and `b = 1`.","hints":["Multiply by the conjugate of the denominator, `{√3 + 1}/{√3 + 1}`.","Top: `(√3 + 1)^2 = 4 + 2√3`. Bottom: 3 − 1 = 2.","`{4 + 2√3}/{2} = 2 + √3`."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Two-stage mode: rationalize `{1}/{1 + √2 + √3}`. Choose \u003cstrong>Two-stage\u003c/strong>, group the denominator, apply a multiplier, then a second one, and write your final form in 24√2`","why":"The middle terms cancel.","_n":"2gff4","_k":"20633e89"},{"t":"34","why":"The product of conjugates subtracts.","_n":"2h0c4","_k":"c0cedc7d"},{"t":"2","why":"18 − 16.","_n":"2i0b4","_k":"2e0998e2"},{"t":"−10","why":"`(3√2)^2 = 9 × 2 = 18`, not 6.","_n":"2j0a4","_k":"d4ce10cd"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Write `{√6 + 2}/{√6 - 2}` in the form `a + b√6`.","options":[{"t":"`10 + 4√6`","why":"Divide by the denominator, 6 − 4 = 2.","_n":"2k094","_k":"eb5e942c"},{"t":"5","why":"`(√6 + 2)^2` has a middle term, `4√6`.","_n":"2l084","_k":"b58d281a"},{"t":"`1 + {2√6}/{5}`","why":"The denominator is 6 − 4, not 6 + 4.","_n":"2m074","_k":"b0ffa584"},{"t":"`5 + 2√6`","why":"`{(√6 + 2)^2}/{6 - 4} = {10 + 4√6}/{2}`.","_n":"2n064","_k":"c55f7d39"}]},"b":{"prompt":"Write `{√11 + 3}/{√11 - 3}` in the form `a + b√11`.","options":[{"t":"`10 + 3√11`","why":"`{20 + 6√11}/{2}`.","_n":"2o054","_k":"16f687e7"},{"t":"10","why":"`(√11 + 3)^2` has a middle term, `6√11`.","_n":"2p044","_k":"db43bcea"},{"t":"`1 + {3√11}/{10}`","why":"The denominator is 11 − 9, not 11 + 9.","_n":"2q034","_k":"e252023c"},{"t":"`20 + 6√11`","why":"Divide by 11 − 9 = 2.","_n":"2r675","_k":"7d2bb0c6"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"What value does `{√{x + 1} - 2}/{x - 3}` approach as `x` gets close to 3?","options":[{"t":"4","why":"The fraction is flipped: it’s `{1}/{√4 + 2}`.","_n":"2s665","_k":"f78899da"},{"t":"No value: it’s 0/0","why":"0/0 means ‘simplify first’, not ‘no value’.","_n":"2t695","_k":"730d7df6"},{"t":"0","why":"0/0 isn’t 0; simplify first.","_n":"2u685","_k":"ef2eff32"},{"t":"`{1}/{4}`","why":"Rationalizing gives `{1}/{√{x + 1} + 2}`, which approaches `{1}/{2 + 2}`.","_n":"2v635","_k":"6bc50f61"}]},"b":{"prompt":"What value does `{√{x + 4} - 3}/{x - 5}` approach as `x` gets close to 5?","options":[{"t":"`{1}/{6}`","why":"Rationalizing gives `{1}/{√{x + 4} + 3}`, which approaches `{1}/{3 + 3}`.","_n":"2w625","_k":"3e66fedd"},{"t":"6","why":"The fraction is flipped: it’s `{1}/{√9 + 3}`.","_n":"2x655","_k":"bf3001be"},{"t":"No value: it’s 0/0","why":"0/0 means ‘simplify first’, not ‘no value’.","_n":"2y645","_k":"b70220d2"},{"t":"0","why":"0/0 isn’t 0; simplify first.","_n":"2z6f5","_k":"bfebbd1b"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Rationalize `{6}/{∛9}`.","options":[{"t":"`2∛3`","why":"× `{∛3}/{∛3}`: `∛27 = 3`, so `{6∛3}/{3}`.","_n":"306e5","_k":"420d267a"},{"t":"`{2∛9}/{3}`","why":"`∛9 · ∛9 = ∛81`, which isn’t a whole number. You need `∛3`.","_n":"31615","_k":"616dd550"},{"t":"`2√3`","why":"These are cube roots, not square roots.","_n":"32625","_k":"bcc75fec"},{"t":"`6∛3`","why":"The bottom became 3; divide by it.","_n":"335f5","_k":"9d20b84c"}]},"b":{"prompt":"Rationalize `{10}/{∛4}`.","options":[{"t":"`5√2`","why":"Cube roots, not square roots.","_n":"34605","_k":"8bf2e5a8"},{"t":"`5∛2`","why":"× `{∛2}/{∛2}`: `∛8 = 2`.","_n":"35655","_k":"8e6114fb"},{"t":"`{5∛4}/{2}`","why":"`∛4 · ∛4 = ∛16` isn’t whole.","_n":"36665","_k":"f6e832fc"},{"t":"`10∛2`","why":"The bottom became 2; divide by it.","_n":"37635","_k":"f85660bc"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why multiplying `{5}/{√2}` by `{√2}/{√2}` is allowed?","options":[{"t":"“It makes the number smaller, which is simpler.”","why":"The value stays the same.","_n":"38645","_k":"0e291ca0"},{"t":"“You may multiply the bottom of a fraction by anything.”","why":"Multiplying only the bottom changes the value.","_n":"39695","_k":"c30715f0"},{"t":"“Because `√2 · √2 = 4` is a whole number.”","why":"`√2 · √2 = 2`.","_n":"3a6a5","_k":"ddbf6630"},{"t":"“`{√2}/{√2}` equals 1, so the value doesn’t change; only the form changes, to `{5√2}/{2}`.”","why":"Multiplying by a form of 1 keeps the value and changes only the form.","_n":"3bfb4","_k":"f608bb94"}]},"b":{"prompt":"Which is the best explanation of why multiplying `{√7 - 2}/{3}` by `{√7 + 2}/{√7 + 2}` is allowed?","options":[{"t":"“It always makes the expression larger.”","why":"The value doesn’t change.","_n":"3cfa4","_k":"0771d659"},{"t":"“`{√7 + 2}/{√7 + 2}` equals 1, so the value is unchanged; it rewrites the numerator as `{3}/{3(√7 + 2)} = {1}/{√7 + 2}`.”","why":"It’s a form of 1, so only the form changes.","_n":"3df94","_k":"698a4f75"},{"t":"“You may multiply the top of a fraction by anything.”","why":"Multiplying only the top changes the value.","_n":"3ef84","_k":"c8b74aa6"},{"t":"“Because the conjugate cancels the 3.”","why":"The 3 cancels only after expanding `(√7)^2 - 4 = 3`.","_n":"3ff74","_k":"fe75336e"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Why does rationalizing the numerator of `{√{4 + h} - 2}/{h}` help when `h` is close to 0?","options":[{"t":"“It makes the denominator rational, which is always required.”","why":"Here the denominator is `h`, already rational; the problem is that it becomes 0.","_n":"3gf64","_k":"a4ebf46a"},{"t":"“It makes the expression equal 0 at `h = 0`.”","why":"The new form gives `{1}/{4}`, not 0.","_n":"3hf54","_k":"e3339cc2"},{"t":"“The numerator becomes `h`, which cancels the `h` below (`h ≠ 0`). The new form `{1}/{√{4 + h} + 2}` can be evaluated at `h = 0`, giving `{1}/{4}`.”","why":"The new form has no 0/0 problem at `h = 0`.","_n":"3if44","_k":"86bc33b1"},{"t":"“It lets you substitute `h = 0` into the original form.”","why":"The original form is still 0/0 at `h = 0`.","_n":"3jf34","_k":"0586e146"}]},"b":{"prompt":"Why does rationalizing the numerator of `{√{9 + h} - 3}/{h}` help when `h` is close to 0?","options":[{"t":"“It makes the denominator rational.”","why":"Here the denominator is `h`, already rational; the problem is that it becomes 0.","_n":"3kf24","_k":"33c656aa"},{"t":"“It lets you substitute `h = 0` into the original form.”","why":"The original form is still 0/0 at `h = 0`.","_n":"3lf54","_k":"f5735b76"},{"t":"“The numerator becomes `h`, which cancels (`h ≠ 0`), leaving `{1}/{√{9 + h} + 3}`, which equals `{1}/{6}` at `h = 0`.”","why":"The new form has no 0/0 problem at `h = 0`.","_n":"3mf64","_k":"e36b256b"},{"t":"“It makes the expression equal 0 at `h = 0`.”","why":"The new form gives `{1}/{6}`, not 0.","_n":"3nf74","_k":"a96b1e56"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A stone dropped from a height of `d` metres takes `t = √{d/5}` seconds to land. As the height changes from 20 m to (20 + `h`) m, the fall time changes at an average rate of `{√{(20 + h)/5} - 2}/{h}` seconds per metre. What value does this approach as `h → 0`?","options":[{"t":"`{1}/{4}` s per m","why":"The numerator becomes `h/5`, not `h`: keep the 1/5.","_n":"3of84","_k":"bb0d61d4"},{"t":"0 s per m","why":"0/0 isn’t 0.","_n":"3pf14","_k":"3277796e"},{"t":"`{1}/{10}` s per m","why":"The denominator approaches 2 + 2 = 4, not 2.","_n":"3qf24","_k":"870b1048"},{"t":"`{1}/{20}` s per m","why":"`√{(20 + h)/5} = √{4 + h/5}`. Rationalizing gives `{1/5}/{√{4 + h/5} + 2}`, which approaches `{1/5}/{4} = {1}/{20}`.","_n":"3rf34","_k":"36af1661"}]},"b":{"prompt":"Same rule, `t = √{d/5}`. As the height changes from 45 m to (45 + `h`) m, the average rate is `{√{(45 + h)/5} - 3}/{h}` s per m. What does it approach as `h → 0`?","options":[{"t":"0 s per m","why":"0/0 isn’t 0.","_n":"3sf44","_k":"ed63d76c"},{"t":"`{1}/{6}` s per m","why":"Keep the 1/5.","_n":"3ted4","_k":"ccddf99a"},{"t":"`{1}/{30}` s per m","why":"`{1/5}/{3 + 3} = {1}/{30}`.","_n":"3uee4","_k":"e3c09691"},{"t":"`{1}/{15}` s per m","why":"The denominator approaches 3 + 3 = 6.","_n":"3vef4","_k":"7a8255e6"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A rectangle has an area of 4 m² and a width of (`√5 + 1`) m. What is its length, in simplest form?","options":[{"t":"(`√5 - 1`) m","why":"`{4}/{√5 + 1} = {4(√5 - 1)}/{5 - 1}`.","_n":"3wee4","_k":"96a06d6b"},{"t":"(`4√5 - 4`) m","why":"Divide by the denominator, 4.","_n":"3xf14","_k":"3625a156"},{"t":"`{2√5 - 2}/{3}` m","why":"The denominator is 5 − 1, not 5 + 1.","_n":"3yf04","_k":"d195e4aa"},{"t":"`{4}/{√6}` m","why":"`√5 + 1` isn’t `√6`.","_n":"3zf34","_k":"e31f68b6"}]},"b":{"prompt":"A rectangle has an area of 6 m² and a width of (`3 + √3`) m. What is its length?","options":[{"t":"`{3 - √3}/{2}` m","why":"9 − 3, not 9 + 3.","_n":"40f24","_k":"cbfb4624"},{"t":"(`3 - √3`) m","why":"`{6(3 - √3)}/{9 - 3}`.","_n":"41f54","_k":"fce2bb01"},{"t":"`√3` m","why":"`3 + √3` isn’t `√12`.","_n":"42f44","_k":"4e8d1d50"},{"t":"(`18 - 6√3`) m","why":"Divide by 6.","_n":"43e74","_k":"f73f39ff"}]}}]},"task":{"title":"Make the `h` cancel","summary":"Make the h cancel","statement":"\u003cp>Design an expression `{√{k + mh} - r}/{h}` that meets every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>Rationalizing the numerator turns it into a multiple of `h`.\u003c/li>\u003cli>As `h → 0`, the expression approaches `{1}/{4}`.\u003c/li>\u003cli>`m` is at least 2 (so it isn’t the Part 3 example).\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers: `k` from 1 to 100, `m` from 1 to 9 and `r` from 1 to 9. The table and the graph against `h` update as you type.\u003c/p>","checks":["Rationalizing gives a multiple of `h`","Approaches `{1}/{4}` as `h → 0`","`m` is at least 2"],"tips":["Rationalize: the numerator becomes `k + mh - r^2`. For only `h`-terms to remain, the constant part must be 0.","After cancelling, the expression is `{m}/{√{k + mh} + r}`, which approaches `{m}/{2r}`. Make that `{1}/{4}`.","`m = 1` gives the Part 3 example. Try a larger `m`."],"explainPrompt":"Explain why `k` must equal `r^2`, and how you chose `m` once `r` was fixed.","vocab":"Use the words conjugate, numerator, cancel and approaches.","success":"Your expression works!","more":"There’s more than one answer. Can you find them all?","after3":"`r = 2m` and `k = r^2`. The next one, (100, 5, 10), needs `r = 10`, which is outside the range."},"cards":[["Rationalize","Rewrite so no radical is in the denominator (or numerator, when asked), without changing the value."],["Multiply by 1","`{√3}/{√3}` or `{2 + √5}/{2 + √5}` equals 1, so the value is unchanged."],["`√b · √b`","`b`. Example: `√7 · √7 = 7`."],["Conjugate","`a + √b` and `a - √b`: same terms, opposite middle sign."],["Conjugate product","`(a + √b)(a - √b) = a^2 - b`."],["`{6}/{√3}`","`{6√3}/{3} = 2√3`."],["`{1}/{√5 - 2}`","`{√5 + 2}/{5 - 4} = √5 + 2`."],["`√{a + b}`","Not `√a + √b`: `√{9 + 16} = 5`, not 7."],["Rationalize the numerator","`{√{4 + h} - 2}/{h} = {1}/{√{4 + h} + 2}` for `h ≠ 0`."],["Why calculus needs it","The new form can be evaluated at `h = 0`, so the 0/0 problem disappears."],["Cube root denominators","Multiply to make a perfect cube: `{1}/{∛2} = {∛4}/{2}`."]]}};</script>
