.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 38: Component converter (V3 vector board, three modes, readout with "More" on phones), Algebra with components
   stations (V8 boxes, AB and copies, parallel test), Components at work frames, First leg west task */
.cv-heq2{display:block;margin-top:.3em;font-size:.82em}
.cv-ex{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.cv-main,.cv-side{min-width:0}
canvas.plot.cv-board{touch-action:none}
.cv-key{margin:8px 0 0}
.cv-h{font-weight:700;margin:10px 0 4px}
.cv-modes .seg{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;white-space:nowrap}
.cv-modes .seg button{flex:0 0 auto}
.cv-ctrl{margin-top:6px}
.cv-sl{display:block;margin-top:8px}
.cv-sl input{width:100%;min-height:28px}
.cv-sl output{font-weight:700;color:var(--ink)}
.cv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cv-note{margin:6px 0 0}
.cv-qb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.cv-qb select{min-height:34px;padding:0 .5em;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);font-weight:700}
.cv-tog{margin-top:12px}
.cv-readw{margin-top:14px}
.cv-read .cv-flash{background:var(--hi-soft);border-radius:6px}
.cv-more{display:none}
.cv-st .cv-stg{align-items:start}
.cv-rows{display:flex;flex-direction:column;gap:8px}
.cv-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.cv-rl{margin-right:2px}
.cv-in.numin.short{width:5.2em}
.cv-note2{margin:10px 0 0}
.cv-st3{font-weight:700;margin:8px 0}
.cv-st3.cv-yes{color:var(--green)}
.cv-frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 4px}
.cv-fl{white-space:nowrap}
.lw-in{display:flex;flex-direction:column;gap:10px}
.lw-step{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lw-step label{min-width:7.5rem}
.lw-step .numin.short{width:4.6em}
#lw-read{margin-bottom:8px}
@media (max-width:760px){
  .cv-ex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .cv-more{display:inline-flex;margin-top:6px}
  .cv-readw:not(.open) .cv-mr{display:none}
}

 `vec{j}` are the one-step arrows along the axes. \u003cstrong>Bearings\u003c/strong> describe the same directions starting from north. Once a vector is in components, adding and scaling are just arithmetic.","fig":{"aria":"An arrow of length 8 sweeps from 0° to 150°, its components −4√3 and 4 drop onto the axes, and a compass rose labels the same arrow true bearing 300°, N 60° W.","shape":"square"}},"goals":["I can write a vector given by magnitude and direction in Cartesian form, `(a, b) = a vec{i} + b vec{j}`, using special angles.","I can find the magnitude and direction of a vector from its components, placing the angle in the correct quadrant.","I can convert between standard angles, true bearings and quadrant bearings.","I can add, subtract and multiply vectors by scalars using components, and find magnitudes of the results.","I can find `vec{AB}` from two points and test whether two vectors are parallel.","I can solve problems with Cartesian vectors, such as routes and displacements."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Special angles","goal":1,"prompt":"`cos 60°` = ?","options":[{"t":"`√3/2`","why":"That’s `sin 60°`.","_n":"097c","_k":"23c048c8"},{"t":"2","why":"That’s `sec 60°`, the reciprocal.","_n":"196c","_k":"09b90054"},{"t":"`√2/2`","why":"That’s the 45° value.","_n":"295c","_k":"dd73f9cc"},{"t":"`1/2`","why":"In the 30-60-90 triangle with hypotenuse 2, the side next to 60° is 1: `cos 60° = 1/2`.","_n":"39cc","_k":"4abfb4b8"}],"hints":["Picture the 30-60-90 triangle with hypotenuse 2.","The side next to 60° is 1.","`1/2`."]},{"id":"w2","skill":"Special angles","goal":1,"prompt":"`sin 135°` = ?","options":[{"t":"`√2/2`","why":"Reference angle 45°; sine is positive in quadrant II.","_n":"49bc","_k":"9e2455fe"},{"t":"`-√2/2`","why":"Sine is positive above the `x`-axis.","_n":"59ac","_k":"5473ab43"},{"t":"`1/2`","why":"That uses the wrong reference angle: 135° is 45° from the `x`-axis.","_n":"699c","_k":"8a765034"},{"t":"`-1/2`","why":"Two slips: the reference angle is 45°, and sine is positive above the `x`-axis.","_n":"790c","_k":"4624a570"}],"hints":["Which quadrant is 135° in?","Quadrant II, reference angle 45°.","`√2/2`."]},{"id":"w3","skill":"Reference angles","goal":2,"prompt":"An angle in standard position has reference angle 30° and lies in quadrant III. What is it?","options":[{"t":"120°","why":"Reference angles are measured from the `x`-axis.","_n":"88fc","_k":"e6d2ae0a"},{"t":"330°","why":"330° is in quadrant IV.","_n":"9b9a","_k":"a1e6df6c"},{"t":"150°","why":"180° − 30° is in quadrant II.","_n":"abaa","_k":"93f9457c"},{"t":"210°","why":"180° + 30°.","_n":"bb7a","_k":"e05bd12e"}],"hints":["Quadrant III runs from 180° to 270°.","Add the reference angle to 180°.","210°."]},{"id":"w4","skill":"Reference angles","goal":2,"prompt":"The terminal arm of θ passes through `(-1, √3)`. What is θ (from 0° to 360°)?","options":[{"t":"150°","why":"`tan(ref) = √3/1`, so ref = 60°.","_n":"cb8a","_k":"a47dec8f"},{"t":"60°","why":"That ignores the quadrant: `(-1, √3)` points left and up, into quadrant II.","_n":"db5a","_k":"1a18369d"},{"t":"120°","why":"Reference angle 60° in quadrant II.","_n":"eb6a","_k":"6e320e14"},{"t":"−60°","why":"−60° points into quadrant IV.","_n":"fb3a","_k":"683b7ce1"}],"hints":["Which quadrant is `(-1, √3)` in?","`tan(ref) = √3`, so ref = 60°.","180° − 60° = 120°."]},{"id":"w5","skill":"Bearings","goal":3,"prompt":"A true bearing of 240° is the same as which quadrant bearing?","options":[{"t":"S 30° W","why":"Quadrant bearings measure from north or south.","_n":"gb4a","_k":"be8a00ff"},{"t":"S 60° E","why":"Past 180° the bearing heads west.","_n":"hb1a","_k":"12fbbe95"},{"t":"S 60° W","why":"240° − 180° = 60° past south, toward west.","_n":"ib2a","_k":"533231e4"},{"t":"N 60° W","why":"240° is in the south-west, not the north-west.","_n":"jb3a","_k":"22262775"}],"hints":["Which quarter does 240° point into?","Between 180° (south) and 270° (west).","60° from south toward west: S 60° W."]},{"id":"w6","skill":"Magnitude","goal":2,"prompt":"A vector goes 5 left and 12 up. How long is it?","options":[{"t":"7","why":"That’s −5 + 12. Square each component.","_n":"kb2a","_k":"9242b2c9"},{"t":"13","why":"`√{(-5)^2 + 12^2} = √{25 + 144} = √169 = 13`.","_n":"lb1a","_k":"2d395986"},{"t":"`√119`","why":"`(-5)^2 = 25`, not −25. Square each component (squares are positive), add, then take the root.","_n":"mb0a","_k":"e6455415"},{"t":"17","why":"That adds the steps. Square each component (squares are positive), add, then take the root.","_n":"nb7a","_k":"a66424d5"}],"hints":["Pythagoras on the components.","25 + 144.","13."]}],"refreshers":{"Special angles":"30-60-90 triangle: sides 1, `√3`, 2. 45-45-90: 1, 1, `√2`. cos is adjacent/hypotenuse, sin is opposite/hypotenuse.","Reference angles":"Find the angle to the `x`-axis, then place it: QI θ, QII 180° − θ, QIII 180° + θ, QIV 360° − θ. CAST tells the signs.","Bearings":"True bearings are three digits, clockwise from north (090° is east). Quadrant bearings name N or S first, then the angle toward E or W.","Magnitude":"`|(a, b)| = √{a^2 + b^2}`."}}},"explore":{"heading":"Component converter","intro":"Set a vector by length and direction, or drag its tip to a point. Watch both descriptions update, and catch the quadrant traps.","modes":[{"id":"polar","t":"Polar → Cartesian"},{"id":"cart","t":"Cartesian → polar"},{"id":"bear","t":"Bearing"}],"specials":[{"id":"s1","t":"`(-3, 3√3)`","x":{"p":-3,"d":1,"k":1},"y":{"p":3,"d":1,"k":3},"r":{"p":6,"d":1,"k":1},"deg":120},{"id":"s2","t":"`(4√3, -4)`","x":{"p":4,"d":1,"k":3},"y":{"p":-4,"d":1,"k":1},"r":{"p":8,"d":1,"k":1},"deg":330},{"id":"s3","t":"`(-5, -5)`","x":{"p":-5,"d":1,"k":1},"y":{"p":-5,"d":1,"k":1},"r":{"p":5,"d":1,"k":2},"deg":225},{"id":"s4","t":"`(6, 6√3)`","x":{"p":6,"d":1,"k":1},"y":{"p":6,"d":1,"k":3},"r":{"p":12,"d":1,"k":1},"deg":60}],"txt":{"mode":"Mode","r":"Length `r`","th":"Angle θ","snap":"Special angles only","br":"True bearing","qb":"Quadran t numbers only, such as 3, −5/13 or 2√3.","dec":"Give exact values: whole numbers, fractions or roots, not decimals.","general":"Not yet. Check your work and try again."},"items":[{"id":"s1","goal":2,"prompt":"`|(-7, 24)|`","parts":["`|(-7, 24)|` =",{"k":"r"}],"_a":"GRNLFl4BBBs=","display":"25","wrong":[{"v":{"r":17},"fb":"Square each component; `(-7)^2 = 49`."}],"why":"`√{49 + 576} = √625 = 25`."},{"id":"s2","goal":2,"prompt":"Magnitude and standard angle of `(-2√3, -2)`","parts":["magnitude",{"k":"r"},"at θ =",{"k":"th"},"°"],"_a":"GRNLFl4HHUQWWRsOVgIBGw==","display":"4 at 210°","wrong":[{"v":{"r":4,"th":30},"fb":"Both components are negative: quadrant III."}],"why":"`√{12 + 4} = 4`; the reference angle is 30°, in quadrant III: 180° + 30° = 210°."},{"id":"s3","goal":5,"star":true,"prompt":"Find `k` so that `(k, 3)` is parallel to `(8, -6)`.","parts":["`k` =",{"k":"k"}],"_a":"GRNSFl4eBRs=","display":"`k = -4`","wrong":[{"v":{"k":4},"fb":"`3 = m(-6)` gives `m = -1/2`, so `k = -1/2 × 8`."}],"why":"`(k, 3) = m(8, -6)`: `3 = -6m` gives `m = -1/2`, so `k = -4`."},{"id":"s4","goal":4,"star":true,"prompt":"The unit vector in the direction of `(5, -12)`","parts":["(",{"k":"x"},",",{"k":"y"},")"],"_a":"GRNBFl4DH1VaBQ8FUQAJUlQADAdcBwdSThNAFl4eAUhbAwoEUwUIVFEBDgJdAQJXHw==","display":"`(5/13, -12/13)`","wrong":[{"v":{"x":0.29411764705882354,"y":-0.7058823529411765},"fb":"Divide by the magnitude, 13."}],"why":"`|(5, -12)| = √{25 + 144} = 13`; divide each component by 13."},{"id":"s5","goal":4,"star":true,"prompt":"Find `s` and `t` with `s(3, 1) + t(-1, 2) = (1, 5)`.","parts":["`s` =",{"k":"s"},"`t` =",{"k":"t"}],"_a":"GRNKFl4CHUQWEwMGGQ==","display":"`s = 1`, `t = 2`","wrong":[{"v":{"s":2,"t":1},"fb":"Check the `x`-part: `3s - t = 1`."}],"why":"`3s - t = 1` and `s + 2t = 5` give `s = 1`, `t = 2`.","hints":["Write one equation per component.","`3s - t = 1` and `s + 2t = 5`.","`t = 3s - 1`, so `7s - 2 = 5`: `s = 1`, `t = 2`."]},{"id":"s6","goal":6,"star":true,"prompt":"A hiker walks 6 km on a true bearing of 030°, then 6 km on a true bearing of 150°. Find her displacement from the start (magnitude and true bearing).","parts":["",{"k":"r"},"km on a true bearing of",{"k":"b"},"°"],"_a":"GRNLFl4FHUQAEwMNVE4=","display":"6 km on a true bearing of 090°","wrong":[{"v":{"r":12},"fb":"Add components, not lengths."},{"v":{"b":180},"fb":"The northward parts cancel; the eastward parts add."}],"why":"`(3, 3√3) + (3, -3√3) = (6, 0)`: 6 km due east.","hints":["Convert each bearing to a standard angle: 030° → 60°, 150° → −60°.","Leg 1: `(3, 3√3)`; leg 2: `(3, -3√3)`.","Sum `(6, 0)`: 6 km due east, a true bearing of 090°."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Lucia","how":"","goal":[2,3,4],"instruction":"Lucia made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Write 10 units on a true bearing of 120° in Cartesian form.","steps":["The standard angle is θ = 120°.","`x = 10 cos 120° = -5`","`y = 10 sin 120° = 5√3`","So the vector is `(-5, 5√3)`."],"_a":"Ug==","stepFb":["","Step 2 uses step 1’s angle correctly. The mistake is earlier.","Step 3 follows step 1.","Step 4 follows."],"fixes":[{"t":"θ = 120° + 90° = 210°, giving `(-5√3, -5)`.","why":"Adding 90° turns the wrong way.","_n":"1kb4b","_k":"6d318a67"},{"t":"Step 1 is correct: bearings are standard angles.","why":"They start at north and turn clockwise. Bearings start at north and turn clockwise. Standard angles start at east and turn counterclockwise: θ = 90° − bearing.","_n":"1la9b","_k":"3bdd45a8"},{"t":"θ = 90° − 120° = −30°, so `(10 cos(-30°), 10 sin(-30°)) = (5√3, -5)`.","why":"A shortcut for bearings: `x = r sin(bearing)` and `y = r cos(bearing)` give the same answer.","_n":"1maab","_k":"a67cf99e"},{"t":"θ = 180° − 120° = 60°, giving `(5, 5√3)`.","why":"That points north-east; 120° is south-east.","_n":"1n2ba","_k":"275a0225"}],"hints":["Where does a bearing of 120° point?","South of east: θ = 90° − 120°.","`(5√3, -5)`."]},{"id":"e2","goal":2,"task":"Find the magnitude and standard angle of `vec{u} = (-6, 6)`.","steps":["`|vec{u}| = √{(-6)^2 + 6^2} = √72 = 6√2`","`tan θ = 6/(-6) = -1`","θ = `tan^{-1}(-1)` = −45°, which is 315°.","So `vec{u}` is `6√2` at 315°."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"θ = 225°.","why":"That’s quadrant III: both negative.","_n":"1o2aa","_k":"10a141d7"},{"t":"θ = 45°.","why":"Quadrant I would need both components positive.","_n":"1p29a","_k":"8b92d08c"},{"t":"Step 3 is correct; `tan^{-1}` always gives the angle.","why":"`tan^{-1}` only returns angles between −90° and 90°.","_n":"1q28a","_k":"6b912840"},{"t":"`(-6, 6)` is in quadrant II: θ = 180° − 45° = 135°.","why":"`(-6, 6)` points left and up. `tan^{-1}` gave the quadrant IV angle with the same tangent.","_n":"1r27a","_k":"d102923b"}],"hints":["Which way does `(-6, 6)` point?","Left and up: quadrant II.","135°."]},{"id":"e3","goal":4,"task":"`vec{u} = (4, -2)` and `vec{v} = (-1, 3)`. Find `|2vec{u} - 3vec{v}|`.","steps":["`2vec{u} = (8, -4)` and `3vec{v} = (-3, 9)`","`2vec{u} - 3vec{v} = (8 - 3, -4 - 9)`","`= (5, -13)`","`|2vec{u} - 3vec{v}| = √{25 + 169} = √194`"],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2.","Step 4 follows."],"fixes":[{"t":"`2vec{u} - 3vec{v} = (8 + 3, -4 + 9) = (11, 5)`.","why":"Subtract both components.","_n":"1s26a","_k":"f761117c"},{"t":"`|2vec{u} - 3vec{v}| = |2vec{u}| - |3vec{v}|`.","why":"Magnitudes don’t subtract.","_n":"1t25a","_k":"a233891c"},{"t":"`8 - (-3) = 11`, so `2vec{u} - 3vec{v} = (11, -13)` and its magnitude is `√290`.","why":"Subtracting −3 adds 3: `√{121 + 169} = √290`.","_n":"1u24a","_k":"65679acb"},{"t":"Step 2 is correct.","why":"Subtracting −3 adds 3.","_n":"1v33a","_k":"fbdfa533"}],"hints":["What is `8 - (-3)`?","11.","`(11, -13)`, `√290`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the converter: the `tan^{-1}` trap, or how bearings and standard angles relate?"},{"id":"j2","q":"In your own words, why is the `x`-component `r cos θ`?"},{"id":"j3","q":"Explain to a friend how to find the direction of `(-3, -3√3)`, including the quadrant check."},{"id":"j4","q":"Which conversion still slows you down? What will you do about it?"}]},"final":{"intro":"Ten questions: 3 K, 3 T, 2 C, 2 A. No hints; choose your confidence for each. Angles are standard angles (counterclockwise from the positive `x`-axis) unless a bearing is named.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Write 8 units at 60° in Cartesian form.","options":[{"t":"`(-4, 4√3)`","why":"`cos 60°` is positive.","_n":"1w32a","_k":"07e34ce3"},{"t":"`(4√3, 4)`","why":"The `x`-component uses cosine. Measured from the `x`-axis, the `x`-component uses cosine: `x = r cos θ`.","_n":"1x25a","_k":"37b12eb8"},{"t":"`(4, 4)`","why":"`sin 60° = √3/2`, not `1/2`.","_n":"1y26a","_k":"1f404f4a"},{"t":"`(4, 4√3)`","why":"`(8 cos 60°, 8 sin 60°)`.","_n":"1z27a","_k":"97b512e3"}]},"b":{"prompt":"Write 6 units at 210° in Cartesian form.","options":[{"t":"`(3√3, 3)`","why":"210° is in quadrant III: both components negative.","_n":"2028a","_k":"5946cf78"},{"t":"`(-3√3, 3)`","why":"`sin 210°` is negative.","_n":"2121a","_k":"ed3109dc"},{"t":"`(-3, -3√3)`","why":"The `x`-component uses cosine. Measured from the `x`-axis, the `x`-component uses cosine: `x = r cos θ`.","_n":"2222a","_k":"81d3d2c0"},{"t":"`(-3√3, -3)`","why":"`(6 cos 210°, 6 sin 210°)`: reference angle 30°, both components negative.","_n":"2323a","_k":"ed3456e7"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"A true bearing of 300° is the same as which standard angle?","options":[{"t":"300°","why":"Bearings and standard angles start in different places. Bearings start at north and turn clockwise. Standard angles start at east and turn counterclockwise: θ = 90° − bearing.","_n":"2424a","_k":"cdfdffa ":"The counts are swapped.","_n":"42bfe","_k":"d530df82"},{"t":"At `(4, 1)`, 8 m from A","why":"`√{6^2 + 2^2}`, not 6 + 2.","_n":"43bce","_k":"53a8b522"}]}}]},"task":{"title":"First leg west","summary":"First leg west","statement":"\u003cp>A hiker’s route has two legs: first `vec{u}`, then 6 km due east. Design the first leg. Find every answer.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The first leg is exactly 10 km long.\u003c/li>\u003cli>The first leg heads west of the north–south line (a true bearing strictly between 180° and 360°).\u003c/li>\u003cli>At the end of the route, the hiker is a whole number of kilometres from her start.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Drag the tip of `vec{u}` (whole-number components from −12 to 12; 1 unit = 1 km) or type its components. The second leg `(6, 0)` is drawn from the tip of `vec{u}`.\u003c/p>","checks":["First leg 10 km","Heads west","Ends a whole number of km away"],"tips":["Whole-number vectors of length 10: think of 6-8-10 and 10-0-10.","A bearing between 180° and 360° means the `x`-component is negative.","Add `(6, 0)` to `vec{u}` and check the length of the total."],"explainPrompt":"For one of your answers, give the first leg’s true bearing or quadrant bearing (approximately is fine) and explain why the hiker ends where she does.","vocab":"Use the words component, magnitude and bearing.","more":"There’s more than one answer. Can you find them all?","after3":"The other westward length-10 legs, `(-8, 6)` and `(-8, -6)`, end `√40` km away: not a whole number.","labels":{"a":"`a` (east)","b":"`b` (north)","range":"(−12 to 12)","inNote":"Type the components of `vec{u} = (a, b)`, or drag its tip on the board.","invalid":"Choose whole numbers from −12 to 12 for `a` and `b`, not both 0.","u":"`vec{u}`","mag":"`|vec{u}|`","br":"True bearing of `vec{u}`","tot":"Total displacement","dist":"Distance from start","graph":"Board: the first leg u in blue, the second leg (6, 0) in teal from its tip, and the total displacement in black."}},"cards":[["Cartesian form","`vec{u} = (a, b) = a vec{i} + b vec{j}`."],["`vec{i}`, `vec{j}`","`vec{i} = (1, 0)`, `vec{j} = (0, 1)`: unit vectors along the axes."],["Polar to Cartesian","`(r cos θ, r sin θ)`, θ counterclockwise from the positive `x`-axis."],["Magnitude","`|(a, b)| = √{a^2 + b^2}`."],["Direction from components","Reference angle `tan^{-1}(|b|/|a|)`, then place it in the quadrant of `(a, b)`."],["The `tan^{-1}` trap","`tan^{-1}` gives only −90° to 90°; add 180° when `a \u003c 0`."],["Bearing → standard angle","θ = 90° − bearing (add 360° if negative)."],["Quadrant bearing","S 30° E: 30° from south toward east (true bearing 150°)."],["Adding vectors","Add components: `(a, b) + (c, d) = (a + c, b + d)`."],["`vec{AB}`","`(x_B - x_A, y_B - y_A)`."],["Parallel test","`vec{v} = k vec{u}`: both components scale by the same `k`."],["Unit vector","`vec{u}/|vec{u}|`, e.g. `(3, 4)` → `(3/5, 4/5)`."]]}};</script>
