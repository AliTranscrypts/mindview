.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 03: hero limit, motion lab (V9 motion track beside the graph), challenge 3 box, Part 3 stations, rate boxes, task preview */
.rc-eql{display:block;font-size:.86em}
.rc-nw{display:inline-block;white-space:nowrap;vertical-align:middle}
.rc-eql + .rc-eql{margin-top:.12em}
.rc-hw{font:700 .5em/1.3 var(--font-ui);color:var(--ink-2);margin:0 .15em 0 0}
.rc-arr{font-size:.8em;margin:0 .2em;color:var(--ink-2)}
.rc-lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .12em}
.rc-lt{font-family:var(--font-math);font-style:normal}
.rc-lu{font-size:.5em;margin-top:.12em;white-space:nowrap}
.rc-lu .m{font-size:1em}
.rc-qbox{display:inline-block;background:var(--hi-soft);border-radius:.16em;padding:.06em .22em;vertical-align:middle}
.face .rc-qbox{background:none;padding:0}
.opt .m,.chip .m,.fchip .m,.read dd .m,.tile .m{white-space:normal}

/* V9 motion track */
.mt-box{position:relative}
.mt-c{position:absolute;inset:0;display:block;width:100%;height:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.mt-ctl{margin-top:4px}
.mt-btns{margin-top:0}
.mt-sl{margin-top:10px}
.mt-sl output{color:var(--ink)}
.mt-tip{margin:0}

/* motion lab */
.rc-stage{display:grid;gap:8px}
.rc-stage.v{grid-template-columns:104px minmax(0,1fr)}
.rc-stage.h{grid-template-columns:minmax(0,1fr)}
.rc-stage.h .rc-trk{height:92px}
.rc-stage.n .rc-trk{display:none}
.rc-note{display:block;margin-top:2px}
.rc-sl output,.rc-hout{color:var(--ink)}
.rc-h{margin-top:8px;border-top:1px solid var(--rule);padding-top:8px}
.rc-hcur{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.rc-hcur > span:first-child{font-weight:700}
.rc-hout{font:600 1.35rem var(--font-math)}
.rc-hmag .seg-wrap{margin-top:6px}
.rc-hb{margin-top:8px}
.rc-hb [hidden]{display:none}
.rc-tblbox{margin:0 0 14px}
.rc-tcap{margin:0 0 4px}
.rc-tbl .tbl-wrap{max-height:15rem;overflow-y:auto}
.rc-tbl table.vt th{white-space:normal;line-height:1.25}
.rc-tc3{margin-top:18px;border:1.5px dashed var(--ink-2);border-radius:8px;padding:10px 14px 12px;background:var(--paper)}
.rc-tc3 h4{margin:0 0 8px}
.rc-tcrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 8px}
.rc-tcrow label{flex:1 1 14rem;font-weight:600}
.rc-tcin{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px}
.rc-tcin .numin{width:8.5rem}
.rc-u{color:var(--ink-2);min-width:1.6em}
.rc-tchint{margin:-4px 0 8px}
.rc-ok{color:var(--green);font-weight:700;margin:6px 0 0}

/* Part 3 */
.rc-st{margin:0 0 6px}
.rc-st .seg-wrap{margin-top:0}
.rc-sh{margin:14px 0 6px}
.rc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin:10px 0 8px}
.rc-card{border:2px solid var(--ink);border-radius:10px;padding:12px 14px;background:var(--sheet);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.rc-card.done{background:var(--hi-soft)}
.rc-card:focus{outline:2px solid var(--hi);outline-offset:2px}
.rc-ct{margin:0;font-weight:700}
.rc-ct.rc-small{font-weight:400;font-size:.92rem}
.rc-cbtn{display:flex;flex-wrap:wrap;gap:8px}
.rc-kind{margin:0;font:700 1.15rem var(--font-ui)}
.rc-why{margin:0;font-size:.95rem}
.rc-you{margin:0;font-weight:700}
.rc-you.good{color:var(--green)}
.rc-you.bad{color:var(--red)}
.rc-turn{animation:rc-flip-out .18s ease-in forwards}
.rc-turn2{animation:rc-flip-in .2s ease-out}
@keyframes rc-flip-out{to{transform:scaleX(0)}}
@keyframes rc-flip-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rc-s2c .seg-wrap{margin:0 0 10px}
.rc-steps{margin:10px 0;padding-left:1.4em;display:grid;gap:6px}
.rc-steps li{font-size:1rem}
.rc-sum td,.rc-sum th{white-space:normal}
.rc-sb{padding:12px 0;border-bottom:1.5px dashed var(--rule)}
.rc-sb:last-child{border-bottom:0}
.rc-sbh{display:flex;gap:10px;align-items:flex-start;margin:0 0 8px}
.rc-sbh .qn{flex:none}
.rc-sbc .q-actions{margin-top:8px}
.fb ul{margin:6px 0 0;padding-left:1.2em}
.fb li{margin:0 0 .3em}

/* N29 sentence builder (copied from MHF4U 08) */
.sb-line{font-size:1.06rem;line-height:2.5;max-width:none;margin:0}
.sb-slot{display:inline-block;min-width:4.4em;min-height:34px;margin:0 .12em;padding:.05em .55em;border:0;border-bottom:2.5px solid var(--ink);background:var(--paper);border-radius:5px 5px 0 0;font:700 1rem/1.6 var(--font-ui);color:var(--ink);vertical-align:baseline}
.sb-slot.on{background:var(--hi);color:var(--hi-ink)}
.sb-slot.good{border-bottom-color:var(--green);background:var(--good-bg)}
.sb-slot.bad{border-bottom-color:var(--red);background:var(--bad-bg)}
.sb-slot:disabled{opacity:1}
.sb-bank{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1.5px dashed var(--ink-2);border-radius:8px;margin-top:8px}
.sb-bank-lab{font-weight:700;font-size:.9rem}
.sb-tip{margin:6px 0 0}

/* Practice 2 rate boxes */
.rc-brow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0}
.rc-brow label{flex:0 1 12rem;font-weight:600}
.rc-bin{display:inline-flex;align-items:center;gap:6px}
.rc-bin .numin{width:7rem}
.rc-pre{font-size:1.1rem}

/* task preview */
.rc-tstage{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.rc-tsl output{color:var(--ink)}

@media (max-width:820px){
  .rc-stage.v{grid-template-columns:minmax(0,1fr)}
  .rc-stage.v .rc-trk{height:140px}
}

lta t, leading to the instantaneous rate: the limit, as h approaches 0, of s of t plus h, minus s of t, all over h.","eqSize":"sm","headline":"How fast, on average, and how fast right now?","text":"An \u003cstrong>average rate of change\u003c/strong> compares two moments: the change in a quantity divided by the change in time, with units. An \u003cstrong>instantaneous rate of change\u003c/strong> is the rate at a single moment, found by shrinking the interval to nothing. For motion, these are \u003cstrong>average velocity\u003c/strong> and \u003cstrong>instantaneous velocity\u003c/strong>.","fig":{"shape":"wide","aria":"A ball rises up a vertical track beside its height graph s(t) = 30t − 5t². A bracket marks the window from t = 1 to t = 3 and the secant shows an average velocity of 10 m/s. The window shrinks toward t = 1 and the secant turns into the tangent: 20 m/s at t = 1."}},"goals":["I can calculate an average rate of change from an equation, a table or a graph, with units.","I can find an instantaneous rate of change using \u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> `{f(a + h) - f(a)}/{h}`.","I can tell average velocity over an interval from instantaneous velocity at a moment.","I can interpret the sign, size and units of a rate in context.","I can decide whether a question asks for an average rate, an instantaneous rate or a value."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Average rates","goal":1,"prompt":"A car’s distance from home: at `t = 0` h, 0 km; at `t = 2` h, 150 km; at `t = 5` h, 390 km. What is its average speed from `t = 2` to `t = 5`?","options":[{"t":"1/80 h per km","why":"Speed is km per h.","_n":"0152","_k":"118a1145"},{"t":"240 km/h","why":"Divide by the 3 hours.","_n":"1142","_k":"2af35de1"},{"t":"80 km/h","why":"(390 − 150)/(5 − 2).","_n":"2132","_k":"6d6399ba"},{"t":"78 km/h","why":"390/5 covers `t = 0` to 5.","_n":"3122","_k":"2ce69c71"}],"hi r L","why":"A rate of `y` with respect to `x` has units of `y` per `x`: litres per hour, not hours per litre.","_n":"i202","_k":"6f24a6e4"},{"t":"−3000 L/h","why":"(38 000 − 50 000)/4.","_n":"j312","_k":"86c030be"}],"hints":["Change in volume ÷ change in time.","−12 000 L in 4 h.","−3000 L/h."]},{"id":"w6","skill":"Units and signs","goal":4,"prompt":"Which units fit the rate of change of a car’s fuel (in litres) with respect to distance driven (in kilometres)?","options":[{"t":"L/km","why":"Output per input: litres per kilometre.","_n":"k302","_k":"1831f16e"},{"t":"km/L","why":"That’s distance per litre, the reverse rate.","_n":"l2f2","_k":"fc9a20ff"},{"t":"L · km","why":"Rates divide.","_n":"m2e2","_k":"5aaad7c1"},{"t":"km/h","why":"That’s speed.","_n":"n2d2","_k":"95f07b5f"}],"hints":["“Rate of `A` with respect to `B`” is `A` per `B`.","`A` = fuel (L), `B` = distance (km).","L/km."]}],"refreshers":{"Average rates":"Average rate = `{f(b) - f(a)}/{b - a}`, the slope of the secant. Keep the same order on top and bottom.","Evaluating and expanding":"Substitute carefully: `5t^2` means `5 × t^2`. When `t = 1 + h`, expand `(1 + h)^2 = 1 + 2h + h^2` before multiplying by 5.","Units and signs":"Units are “output per input”. A negative rate means the quantity is decreasing, not that it’s negative."}}},"explore":{"heading":"Motion lab","intro":"Choose a time window to see the average rate as a secant. Then shrink the window to catch the rate at a single moment.","contexts":{"ball":{"chip":"Ball","eq":"`s(t) = 30t - 5t^2` m, `0 ≤ t ≤ 6`","note":"Vertical track, using g ≈ 10 m/s² so the numbers stay clean."},"track":{"chip":"Track","eq":"`s(t) = t^3 - 6t^2 + 9t` m, `0 ≤ t ≤ 4`","note":"Horizontal track: it moves forward, back, then forward."},"fish":{"chip":"Fish","eq":"`P(t) = 500 + 20t + 3t^2` fish in a pond, `0 ≤ t ≤ 10` years","note":"Not motion: a graph only."}},"predictions":[{"id":"p1","prompt":"Ball, window [0, 6]. What is the average velocity over the whole flight?","options":[{"t":"0 m/s","_n":"o2c2","_k":"ea85a56a"},{"t":"15 m/s","_n":"p2b2","_k":"0af4eaf7"},{"t":"30 m/s","_n":"q2a2","_k":"1f0c0601"},{"t":"−30 m/s","_n":"r292","_k":"473732f2"}],"explain":"`s(0) = s(6) = 0`, so the change in position is 0. The ball travelled 90 m up and down, but average velocity uses the change in position."},{"id":"p2","prompt":"Ball, Speedometer mode, playing up to `t = 3` (the top). At the highest point, the instantaneous velocity is …","options":[{"t":"−10 m/s","_n":"s282","_k":"fddd7b96"},{"t":"0 m/s","_n":"tab2","_k":"76b5b735"},{"t":"30 m/s, its greatest","_n":"uac2","_k":"4e7b3da6"},{"t":"45 m/s","_n":"vad2","_k":"e15d1f92"}],"explain":"At the top the ball stops rising and starts falling: its velocity is 0 there. 45 m is the height. The ball is at its slowest at the top, not its fastest."},{"id":"p3","prompt":"Ball, `a = 4`, Shrink mode. As the window shrinks, the secant slopes approach …","options":[{"t":"10 m/s","_n":"wae2","_k":"ccc0eece"},{"t":"−10 m/s","_n":"xa72","_k":"74fa0d6c"},{"t":"0 m/s","_n":"ya82","_k":"b41cf195"},{"t":"40 m/s","_n":"za92","_k":"b43c115f"}],"explain":"The quotient `30 - 10(4) - 5h = -10 - 5h` approaches −10. Negative: the ball is falling. 40 m is `s(4)`."},{"id":"p4","prompt":"Track, window [0, 4]. What is the average velocity over [0, 4]?","options":[{"t":"0 m/s","_n":"10aa2","_k":"d5535e20"},{"t":"1 m/s","_n":"11a32","_k":"54c0cee0"},{"t":"9 m/s","_n":"12a42","_k":"8c77e547"},{"t":"3 m/s","_n":"13a52","_k":"03c3d2fb"}],"explain":"Change in position: `s(4) - s(0) = 4` m over 4 s. 3 m/s is the total distance (12 m) ÷ 4, which is the average speed."}],"chalIntro":"Use the motion lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. For “the moment” in challenge 2, use the time slider in Speedometer mode (or the start time `a`). Challenge 3 has its own answer box below the lab. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Ball: set a window 1 s wide whose average velocity is exactly 5 m/s.","why":"On [2, 3], `s(2) = 40` and `s(3) = 45`: a change of 5 m in 1 s.","hints":["For a window `[a, a + 1]`, the average velocity is `30 - 10a - 5`.","`25 - 10a = 5`.","`a = 2`: the window [2, 3]."],"msgs":{"straddle":"That window straddles the top, so its average is 0 m/s.","falling":"That’s −5 m/s: the ball is falling."}},{"id":"tc2","goal":[2,3],"prompt":"Ball: find the moment when the instantaneous velocity equals the average velocity over [0, 4].","why":"The average over [0, 4] is `s(4)/4 = 10` m/s, and the velocity `30 - 10t` is 10 at `t = 2`.","hints":["Average over [0, 4]: `s(4)/4`.","40/4 = 10 m/s.","`30 - 10t = 10` at `t = 2`."],"msgs":{"ends":"Those are the window’s ends. The velocity there is 30 or −10 m/s.","top":"At the top the velocity is 0; the average over [0, 4] is 10 m/s."}},{"id":"tc3","goal":3,"stretch":true,"prompt":"Track: find both times in [0, 4] when the particle is at rest, then the total distance it travels from `t = 0` to `t = 4`.","why":"The velocity `3t^2 - 12t + 9 = 3(t - 1)(t - 3)` is 0 at `t = 1` and `t = 3`. The legs 0 → 4 m, 4 → 0 m and 0 → 4 m add to 12 m.","hints":["At rest means instantaneous velocity 0. The simplified quotient’s `h`-free part is `3a^2 - 12a + 9`.","`3(a - 1)(a - 3) = 0`, so `t = 1` and `t = 3`. Positions: `s(0) = 0`, `s(1) = 4`, `s(3) = 0`, `s(4) = 4`.","Legs of 4 m, 4 m and 4 m: 12 m."],"msgs":{"dist4":"That’s the change in position. Add the distance for each leg of the trip.","t0":"`s(0) = 0` is a position, not a velocity."}}]},"part3":{"slug":"contexts","name":"Contexts","heading":"Rates in the real world","intro":"Rates aren’t only about motion. Sort statements into average and instantaneous, find both kinds of rate for three new contexts, then say what a rate means in words. Work through the three stations, then try the quick check.","s1":{"title":"Station 1: average or instantaneous?","how":"Read each card and decide. Your choice flips the card to show its kind and why.","cards":[{"id":"c1","t":"“The speedometer reads 80 km/h.”","_a":"FgpeREJB","why":"A speedometer shows the rate at one moment."},{"id":"c2","t":"“The trip averaged 80 km/h.”","_a":"FgJGUBQ=","why":"“Averaged” means over the whole trip: an interval of time."},{"id":"c3","t":"“At noon the temperature was rising 2 °C per hour.”","_a":"FgpeREJB","why":"“At noon” is a single moment."},{"id":"c4","t":"“From 2000 to 2020 the town grew by 1500 people per year.”","_a":"FgJGUBQ=","why":"“From 2000 to 2020” is an interval."},{"id":"c5","t":"“When the photo was taken, the balloon’s volume was growing at 30 cm³ per second.”","_a":"FgpeREJB","why":"“When the photo was taken” is a single moment."},{"id":"c6","t":"“Over the 4 hours, the pool drained at 3000 L/h.”","_a":"FgJGUBQ=","why":"“Over the 4 hours” is an interval."}]},"s2":{"title":"Station 2: three contexts, one method","how":"Choose a context, then step through it: the formula, an average rate over an interval, then shrink the interval to get the instantaneous rate.","contexts":{"cost":{"chip":"Cost","eq":"`C(x) = 500 + 4x + 0.01x^2` dollars for `x` items","avg":"`C(100) = 1000`, `C(200) = 1700`: (1700 − 1000)/100 = $7 per item on [100, 200].","inst":"The quotient `6 + 0.01h → 6`: $6 per item at `x = 100` (often called the \u003cstrong>marginal cost\u003c/strong>).","alg":"`C(100 + h) = 500 + 4(100 + h) + 0.01(100 + h)^2 = 1000 + 6h + 0.01h^2`, so `{C(100 + h) - C(100)}/{h} = 6 + 0.01h`, which approaches 6 as `h → 0`."},"fish":{"chip":"Fish","eq":"`P(t) = 500 + 20t + 3t^2` fish after `t` years","avg":"`P(0) = 500`, `P(5) = 675`: 35 fish per year on [0, 5].","inst":"Rate at `t = 5`: `20 + 30 = 50` fish per year.","alg":"`P(5 + h) = 500 + 20(5 + h) + 3(5 + h)^2 = 675 + 50h + 3h^2`, so the quotient is `20 + 3(10 + h) = 50 + 3h`, which approaches 50 as `h → 0`."},"balloon":{"chip":"Balloon","eq":"`V(r) = {4}/{3}πr^3` cm³","avg":"`V(0) = 0`, `V(3) = 36π`: 12π cm³ per cm on [0, 3].","inst":"Rate with respect to the radius at `r = 3`: `4π(3)^2 = 36π` cm³ per cm.","alg":"`{(3 + h)^3 - 27}/{h} = 27 + 9h + h^2`, times `{4}/{3}π` → 36π as `h → 0`."}}},"s3":{"title":"Station 3: say what it means","how":"A rate with a sign and units can be said in plain words. Tap a blank, then choose the words for it. Build all three sentences.","tpl":"At {moment}, the {quantity} is {dir} at {size} {units}.","items":[{"id":"sb1","name":"Ball","stmt":"At `t = 4` s, the ball’s height is changing at −10 m/s.","done":"At 4 s the ball is \u003cstrong>falling\u003c/strong> at \u003cstrong>10 m/s\u003c/strong>.","slots":{"moment":{"label":"moment","chips":[{"t":"4 s","_n":"14a42","_k":"da30ac92"},{"t":"10 s","fb":"10 is the size of the rate. The moment is `t = 4`.","_n":"15a72","_k":"ef97890b"},{"t":"40 s","fb":"40 m is the height at 4 s, not a time.","_n":"16a62","_k":"4a840929"}]},"quantity":{"label":"quantity","chips":[{"t":"ball","_n":"17a92","_k":"2068ef50"},{"t":"velocity","fb":"The velocity is the rate. The ball is what moves.","_n":"18a82","_k":"3c514845"},{"t":"time","fb":"Time is the input. The ball is what moves.","_n":"19ab2","_k":"291d230e"}]},"dir":{"label":"direction word","chips":[{"t":"rising","fb":"The rate is negative: the height is going down.","_n":"1aaa2","_k":"053a5ee1"},{"t":"falling","_n":"1b9d2","_k":"85450b8c"},{"t":"increasing","fb":"The rate is negative, so the height is going down. For a ball, say rising or falling.","_n":"1c9c2","_k":"61f0d235"},{"t":"decreasing","fb":"Right direction, but a ball moves up or down: say rising or falling.","_n":"1d9f2","_k":"a351897f"}]},"size":{"label":"size","chips":[{"t":"10","_n":"1ea02","_k":"61943a0b"},{"t":"−10","fb":"“Falling” already says which way, so the size is 10.","_n":"1f9d2","_k":"2b9c5193"},{"t":"40","fb":"40 m is `s(4)`, where the ball is, not how fast it moves.","_n":"1g9e2","_k":"17390177"}]},"units":{"label":"units","chips":[{"t":"m/s","_n":"1h9b2","_k":"b0ac51e4"},{"t":"s/m","fb":"Units are output per input: metres per s  \u003cstrong>$6 per item\u003c/strong>.","slots":{"moment":{"label":"moment","chips":[{"t":"100 items","_n":"20161","_k":"a9982e2c"},{"t":"6 items","fb":"6 is the size of the rate. The moment is `x = 100`.","_n":"21171","_k":"5a203b5b"},{"t":"200 items","fb":"The moment is `x = 100`.","_n":"22181","_k":"dbd5bf7f"}]},"quantity":{"label":"quantity","chips":[{"t":"cost","_n":"23191","_k":"fdb11160"},{"t":"number of items","fb":"The number of items is the input. The cost is what changes.","_n":"241a1","_k":"afe987b4"},{"t":"rate","fb":"The rate says how fast; the cost is what changes.","_n":"251b1","_k":"30cb725e"}]},"dir":{"label":"direction word","chips":[{"t":"rising","_n":"261c1","_k":"d1941dd3"},{"t":"falling","fb":"The rate is positive: the cost is going up.","_n":"27ad4","_k":"4e2f90c5"},{"t":"increasing","_n":"28ac4","_k":"cc30f8f2"},{"t":"decreasing","fb":"The rate is positive: the cost is going up.","_n":"29af4","_k":"f8804005"}]},"size":{"label":"size","chips":[{"t":"$6","_n":"2aae4","_k":"12bd4c69"},{"t":"$7","fb":"$7 per item is the average from 100 to 200 items.","_n":"2ba94","_k":"204ba029"},{"t":"$1000","fb":"`C(100) = 1000` is the total cost of 100 items.","_n":"2ca84","_k":"dfc1f275"}]},"units":{"label":"units","chips":[{"t":"per item","_n":"2dab4","_k":"14f7ada3"},{"t":"items per dollar","fb":"Units are output per input: dollars per item.","_n":"2eaa4","_k":"7e380fb6"},{"t":"in total","fb":"A rate isn’t a total: it’s dollars per item.","_n":"2fa54","_k":"69104451"}]}}}]},"blocks":[{"title":"Three contexts side by side","html":"\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"vt rc-sum\">\u003ccaption class=\"vh\">Average and instantaneous rates in three contexts\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Context\u003c/th>\u003cth scope=\"col\">Average rate (interval)\u003c/th>\u003cth scope=\"col\">Instantaneous rate\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Cost\u003c/td>\u003ctd>`C(100) = 1000`, `C(200) = 1700`: (1700 − 1000)/100 = $7 per item on [100, 200]\u003c/td>\u003ctd>$6 per item at `x = 100`\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fish\u003c/td>\u003ctd>`P(0) = 500`, `P(5) = 675`: 35 fish per year on [0, 5]\u003c/td>\u003ctd>50 fish per year at `t = 5`\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Balloon\u003c/td>\u003ctd>`V(0) = 0`, `V(3) = 36π`: 12π cm³ per cm on [0, 3]\u003c/td>\u003ctd>36π cm³ per cm at `r = 3`\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}],"quickCheck":{"title":"Quick check","summary":"Contexts quick check","items":[{"id":"q1","goal":2,"prompt":"`C(x) = 500 + 4x + 0.01x^2`. Instantaneous rate of change of cost at `x = 50`?","choices":[{"t":"$1 per item","fb":"The quotient is `4 + 0.01(100 + h) → 5`. $4.50 is the average over [0, 50]; $725 is `C(50)`.","_n":"2ga44","_k":"e50b1a65"},{"t":"$4.50 per item","fb":"The quotient is `4 + 0.01(100 + h) → 5`. $4.50 is the average over [0, 50]; $725 is `C(50)`.","_n":"2h273","_k":"34c95429"},{"t":"$725","fb":"The quotient is `4 + 0.01(100 + h) → 5`. $4.50 is the average over [0, 50]; $725 is `C(50)`.","_n":"2i283","_k":"cd58e60f"},{"t":"$5 per item","fb":"Right. The quotient is `4 + 0.01(100 + h)`, which approaches 5.","_n":"2j253","_k":"fdfe74f6"}]},{"id":"q2","goal":5,"prompt":"Which is an instantaneous rate?","choices":[{"t":"“The tide rose 0.3 m/h on average from 8:00 to 12:00”","fb":"“At 10:00” is a single moment.","_n":"2k263","_k":"20693b53"},{"t":"“The tide rose 1.2 m from 8:00 to 12:00”","fb":"“At 10:00” is a single moment.","_n":"2l2b3","_k":"a0823b78"},{"t":"“The average depth was 3 m”","fb":"“At 10:00” is a single moment.","_n":"2m2c3","_k":"0d141834"},{"t":"“The tide was rising 0.3 m/h at 10:00”","fb":"Right. “At 10:00” is a single moment.","_n":"2n293","_k":"0286af2e"}]},{"id":"q3","goal":4,"prompt":"Units of the rate of change of a balloon’s volume (cm³) with respect to its radius (cm)?","choices":[{"t":"cm³/s","fb":"Volume per unit of radius.","_n":"2o2a3","_k":"6218556c"},{"t":"cm³","fb":"Volume per unit of radius.","_n":"2p1f3","_k":"bd1a90b5"},{"t":"cm³/cm","fb":"Right. Volume per unit of radius.","_n":"2q203","_k":"2f1b2bcc"},{"t":"cm/cm³","fb":"Volume per unit of radius.","_n":"2r1eb","_k":"e8af3fd3"}]},{"id":"q4","goal":4,"prompt":"A rate of −15 L/min at `t = 2` means …","choices":[{"t":"The tank empties in 15 min","fb":"The sign gives the direction of change; the volume itself is positive.","_n":"2s1fb","_k":"2983ae0d"},{"t":"The volume is −15 L","fb":"The sign gives the direction of change; the volume itself is positive.","_n":"2t1cb","_k":"220972e7"},{"t":"At `t = 2` the volume is decreasing by 15 L each minute","fb":"Right. The sign gives the direction of change; the volume itself is positive.","_n":"2u1db","_k":"bc0a9faa"},{"t":"The volume fell 15 L in 2 min","fb":"The sign gives the direction of change; the volume itself is positive.","_n":"2v1ab","_k":"c03a67f3"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Average, instantaneous or not a rate?","noun":"card","txt":true,"goal":[3,5],"instruction":"Sort each card: is it an average rate, an instantaneous rate, or not a rate at all?","boxes":[{"id":"avg","label":"Average","sub":"over an interval"},{"id":"inst","label":"Instantaneous","sub":"at one moment"},{"id":"none","label":"Not a rate","sub":"a value or a change"}],"wrongDefault":"Ask: is there a “per”, and is it over an interval or at a moment? Try another box.","items":[{"id":"i1","t":"“The car’s speedometer reads 90 km/h.”","_a":"FgpeREJB","why":"A speedometer shows the rate at one moment."},{"id":"i2","t":"“The 12 km hike took 4 h: 3 km/h.”","_a":"FgJGUBQ=","why":"12 km ÷ 4 h is a rate over the whole hike."},{"id":"i3","t":"“The stock price fell $6 from Monday to Friday.”","_a":"Fg1fWVNB","why":"$6 is a change in price, with no “per”.","wrong":{"avg":"It’s a change, but not divided by time: no “per”."},"hints":["Is anything divided by time?","No: $6 is a change.","Not a rate."]},{"id":"i4","t":"“At 3 p.m. the temperature was dropping 2 °C per hour.”","_a":"FgpeREJB","why":"“At 3 p.m.” is a single moment."},{"id":"i5","t":"“From 2010 to 2020 the town grew by 400 people per year.”","_a":"FgJGUBQ=","why":"“From 2010 to 2020” is an interval."},{"id":"i6","t":"“The slope of the tangent to the height graph at `t = 2`.”","_a":"FgpeREJB","why":"A tangent slope is the rate at one moment."},{"id":"i7","t":"“The slope of the secant from `t = 1` to `t = 5`.”","_a":"FgJGUBQ=","why":"A secant slope is the average rate over [1, 5]."},{"id":"i8","t":"“The ball’s height at `t = 2` is 40 m.”","_a":"Fg1fWVNB","why":"A height is a value, not a rate.","wrong":{"avg":"A height is a value.","inst":"A height is a value."}},{"id":"i9","t":"\u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> `{V(3 + h) - V(3)}/{h}`","_a":"FgpeREJB","why":"The limit shrinks the interval to the single time 3.","wrong":{"avg":"The limit shrinks the interval to one moment."},"hints":["What does \u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> do to the interval?","It shrinks [3, 3 + `h`] to the single time 3.","Instantaneous."]},{"id":"i10","t":"`{P(8) - P(2)}/{6}`","_a":"FgJGUBQ=","why":"No limit: it’s the slope of the secant over [2, 8].","wrong":{"inst":"No limit: it’s the secant over [2, 8]."}}]},{"id":"rates","type":"custom","title":"Rate problems","summary":"Rate problems","star":true,"goal":[1,2,3,4],"instruction":"Solve each problem. Type a number in each box; the units are shown beside it.","how":"Type whole numbers, decimals or fractions such as 5/2. Press Check when every box is filled.","items":[{"id":"r1","goal":1,"prompt":"`s(t) = 40t - 5t^2` m. Average velocity over [1, 3]?","boxes":[{"k":"v","label":"Average velocity","unit":"m/s"}],"_a":"T0FGFQxRVE4=","wrong":[{"k":"v","v":75,"fb":"That’s `s(3)`, a position."}],"why":"`{s(3) - s(1)}/{3 - 1} = {75 - 35}/{2} = 20` m/s.","hints":["Average velocity = change in position ÷ change in time.","`s(1) = 35` and `s(3) = 75`.","(75 − 35)/2 = 20 m/s."]},{"id":"r2","goal":2,"prompt":"Same ball. Instantaneous velocity at `t = 3`?","boxes":[{"k":"v","label":"Instantaneous velocity","unit":"m/s"}],"_a":"T0FGFQxSVE4=","wrong":[{"k":"v","v":20,"fb":"That’s the average over [1, 3]."}],"why":"The quotient `{s(3 + h) - s(3)}/{h}` simplifies to `10 - 5h`, which approaches 10 m/s.","hints":["Simplify the quotient `{s(3 + h) - s(3)}/{h}`.","It simplifies to `10 - 5h`.","As `h → 0`: 10 m/s."]},{"id":"r3","goal":3,"star":true,"prompt":"When does it reach its maximum height, and what is that height?","boxes":[{"k":"t","label":"Time of the top","pre":"`t =`","unit":"s"},{"k":"s","label":"Maximum height","unit":"m"}],"_a":"T0FEFQxXSBFHQQoPBh4=","wrong":[{"k":"t","v":8,"fb":"That’s when it lands; the top is where the velocity is 0."}],"why":"The velocity `40 - 10t` is 0 at `t = 4`, and `s(4) = 160 - 80 = 80` m.","hints":["At the top, the velocity is 0.","The quotient’s `h`-free part is `40 - 10t`, which is 0 at `t = 4`.","`s(4) = 160 - 80 = 80`: `t = 4` s and 80 m."]},{"id":"r4","goal":3,"star":true,"prompt":"At what time does its instantaneous velocity equal its average velocity over [0, 6]?","boxes":[{"k":"t","label":"Time","pre":"`t =`","unit":"s"}],"_a":"T0FEFQxQGQ==","wrong":[{"k":"t","v":6,"fb":"Average over [0, 6] = `s(6)/6` = 10 m/s; solve `40 - 10t = 10`."}],"why":"The average over [0, 6] is `s(6)/6 = 60/6 = 10` m/s, and `40 - 10t = 10` at `t = 3`.","hints":["Find the average velocity over [0, 6] first.","`s(6)/6 = 60/6 = 10` m/s.","`40 - 10t = 10` gives `t = 3` s."]},{"id":"r5","goal":3,"star":true,"prompt":"A particle moves along a line: `s(t) = t^3 - 9t^2 + 24t` m, `0 ≤ t ≤ 5`. Total distance travelled?","boxes":[{"k":"d","label":"Total distance","unit":"m"}],"_a":"T0FUFQxRXE4=","wrong":[{"k":"d","v":20,"fb":"That’s the change in position. It turns back at `t = 2` and `t = 4`."}],"why":"It turns back at `t = 2` and `t = 4`: legs of 20 m, 4 m and 4 m, so 28 m.","hints":["Find when the velocity is 0: the quotient’s `h`-free part is `3t^2 - 18t + 24`.","`3(t - 2)(t - 4) = 0`. Positions: `s(0) = 0`, `s(2) = 20`, `s(4) = 16`, `s(5) = 20`.","20 + 4 + 4 = 28 m."]},{"id":"r6","goal":4,"star":true,"prompt":"A balloon’s volume is `V = {4}/{3}πr^3`. At what radius is the rate of change of volume with respect to radius 100π cm³ per cm?","boxes":[{"k":"r","label":"Radius","pre":"`r =`","unit":"cm"}],"_a":"T0FCFQxWGQ==","wrong":[{"k":"r","v":25,"fb":"`4πr^2 = 100π` gives `r^2 = 25`."}],"why":"The rate is `4πr^2`, and `4πr^2 = 100π` gives `r = 5` cm.","hints":["The rate of change of `{4}/{3}πr^3` with respect to `r` is `4πr^2` (Part 3).","`4πr^2 = 100π`.","`r = 5` cm."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Carlos","how":"","goal":[3,4],"instruction":"Carlos made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"`s(t) = 20t - 5t^2` m. Find the average velocity from `t = 1` to `t = 3`.","steps":["`s(1) = 15`.","`s(3) = 60 - 45 = 15`.","The ball rises to 20 m at `t = 2`, then falls back, so it travels 5 + 5 = 10 m.","Average velocity = distance ÷ time = 10/2 = 5 m/s.","So the ball moved upward at 5 m/s on average."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is true: that’s the distance travelled.","","Step 5 follows step 4. The mistake is earlier."],"fixes":[{"t":"Average velocity = change in position ÷ time = (15 − 15)/2 = 0 m/s.","why":"Distance ÷ time is the average \u003cstrong>speed\u003c/strong>; velocity uses displacement, which is 0 here.","_n":"2w1bb","_k":"1685abd2"},{"t":"= 15/3 = 5 m/s.","why":"That’s `s(3)/3`, as if the trip started at `t = 0`. Velocity uses the change in position over [1, 3].","_n":"2x18b","_k":"46363c94"},{"t":"Step 4 is correct.","why":"Distance ÷ time is the average \u003cstrong>speed\u003c/strong>; velocity uses displacement.","_n":"2y19b","_k":"eed2f918"},{"t":"= (20 − 15)/1 = 5 m/s.","why":"That’s only [1, 2], while the ball rose. The window is [1, 3].","_n":"2z26b","_k":"c1d99a81"}],"hints":["What does average velocity divide?","The change in position.","0 m/s."]},{"id":"e2","goal":4,"task":"`C(x) = 300 + 3x + 0.02x^2` dollars for `x` items. Find and interpret the instantaneous rate of change of cost at `x = 100`.","steps":["Use `{C(100 + h) - C(100)}/{h}`.","`C(100 + h) = 300 + 300 + 3h + 0.02(10 000 + 200h + h^2) = 800 + 7h + 0.02h^2`.","`C(100) = 800`, so the quotient is `7 + 0.02h`.","As `h → 0`, the rate is 7.","So 100 items cost $7 in total."],"_a":"AA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","Step 4 is correct.",""],"fixes":[{"t":"Step 5 is correct.","why":"A rate isn’t a total: its units are dollars \u003cstrong>per item\u003c/strong>.","_n":"3027b","_k":"b6dc6a21"},{"t":"Each item costs $8 on average.","why":"That’s `C(100)/100`, the average cost, a different idea.","_n":"3124b","_k":"cef9b9a7"},{"t":"At `x = 100`, the cost is rising by about $7 per extra item.","why":"A rate has units of dollars \u003cstrong>per item\u003c/strong>: one more item adds about $7.","_n":"3223b","_k":"443f206c"},{"t":"The 100th item costs $800.","why":"$800 is the total for 100 items.","_n":"3326b","_k":"466f3427"}],"hints":["What are the units of the rate?","Dollars per item.","About $7 more for each extra item at `x = 100`."]},{"id":"e3","goal":4,"task":"A town’s population is `P(t) = 4000 + 30t^2`, with `t` in years. How fast is it growing at `t = 5`?","steps":["Quotient: `{30(5 + h)^2 - 30(25)}/{h}` (the 4000s cancel).","`= {300h + 30h^2}/{h} = 300 + 30h`.","As `h → 0`, the rate is 300.","So the population grows by 300 years per person."],"_a":"Bw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct.","why":"Population per time: people per year.","_n":"3425b","_k":"62700e1f"},{"t":"4750 people per year.","why":"`P(5) = 4750` is the population.","_n":"3528b","_k":"9bbc787f"},{"t":"It grows by 300 people per year at `t = 5`.","why":"A rate of population with respect to time has units of people per year.","_n":"3627b","_k":"78cc2fb4"},{"t":"300 people.","why":"A rate needs “per year”.","_n":"372ab","_k":"3bbb03f0"}],"hints":["Rate of population with respect to time: what over what?","People per year.","300 people per year."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the motion lab: an average velocity of 0 for a moving ball, or a velocity of 0 at the very top?"},{"id":"j2","q":"In your own words, what’s the difference between an average rate of change and an instantaneous one?"},{"id":"j3","q":"Explain to a friend how to find the instantaneous rate of change of a cost function at one value."},{"id":"j4","q":"Which do you mix up most: rates and values, signs, or units? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Temperature readings: 90 °C at `t = 0` min, 70 °C at `t = 4` min, 52 °C at `t = 10` min. What is the average rate of change from `t = 4` to `t = 10`?","options":[{"t":"−18 °C","why":"Divide by the 6 minutes.","_n":"3829b","_k":"3d68e0d7"},{"t":"3 °C/min","why":"The temperature fell.","_n":"391cb","_k":"de788c11"},{"t":"−3 °C/min","why":"(52 − 70)/6.","_n":"3a1bb","_k":"99e65a27"},{"t":"−3.8 °C/min","why":"That’s from `t = 0` to 10.","_n":"3b92a","_k":"e67ebc9e"}]},"b":{"prompt":"20 °C at `t = 0` min, 35 °C at `t = 5` min, 47 °C at `t = 8` min. Average rate from `t = 5` to `t = 8`?","options":[{"t":"−4 °C/min","why":"Keep the same order: (47 − 35)/(8 − 5).","_n":"3c93a","_k":"2d794bba"},{"t":"3.375 °C/min","why":"That’s from `t = 0` to 8.","_n":"3d94a","_k":"39be1fe2"},{"t":"12 °C","why":"Divide by the 3 minutes.","_n":"3e95a","_k":"c555be06"},{"t":"4 °C/min","why":"(47 − 35)/3.","_n":"3f96a","_k":"4dd04761"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which expression gives the instantaneous rate of change of `f` at `x = 3`?","options":[{"t":"`{f(3) - f(0)}/{3}`","why":"That’s the average over [0, 3].","_n":"3g97a","_k":"24804312"},{"t":"\u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> `[f(3 + h) - f(3)]`","why":"That approaches 0: you need to divide by `h`.","_n":"3h98a","_k":"b2a29d4a"},{"t":"\u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> `{f(3 + h) - f(3)}/{h}`","why":"The limit shrinks the interval [3, 3 + `h`] to the single value 3.","_n":"3i99a","_k":"12e04db9"},{"t":"`{f(3 + h) - f(3)}/{h}`","why":"Without the limit, it’s an average over [3, 3 + `h`].","_n":"3j9aa","_k":"e6ae7add"}]},"b":{"prompt":"Which expression gives the instantaneous rate of change of `s` at `t = 5`?","options":[{"t":"`{s(5 + h) - s(5)}/{h}`","why":"Without the limit, it’s an average over [5, 5 + `h`].","_n":"3k9ba","_k":"0fc110ff"},{"t":"`{s(5) - s(0)}/{5}`","why":"That’s the average over [0, 5].","_n":"3l18b","_k":"96cc1e73"},{"t":"\u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> `[s(5 + h) - s(5)]`","why":"That approaches 0: you need to divide by `h`.","_n":"3m17b","_k":"580062d1"},{"t":"\u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> `{s(5 + h) - s(5)}/{h}`","why":"The limit shrinks the interval [5, 5 + `h`] to the single time 5.","_n":"3n16b","_k":"e581bba8"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"At 2 p.m., the rate of change of a pool’s depth is −4 cm/h. Which statement is correct?","options":[{"t":"At 2 p.m. the depth is decreasing by 4 cm per hour.","why":"−4 cm/h means the depth is decreasing by 4 cm each hour. The depth itself is positive.","_n":"3o15b","_k":"183c605a"},{"t":"The depth is increasing by 4 cm per hour.","why":"The negative sign means decreasing.","_n":"3p1cb","_k":"ba458ca8"},{"t":"The depth at 2 p.m. is −4 cm.","why":"The sign gives the direction of change; the depth itself is positive.","_n":"3q1bb","_k":"b982a464"},{"t":"The depth fell 4 cm between 1 p.m. and 2 p.m.","why":"That’s an average over an hour, not the rate at 2 p.m.","_n":"3r1ab","_k":"53de8a9c"}]},"b":{"prompt":"On day 10, a company’s profit is changing at +250 $/day. Which statement is correct?","options":[{"t":"On day 10 the profit is increasing by $250 per day.","why":"A positive rate means the profit is increasing.","_n":"3s19b","_k":"1bc2e3d2"},{"t":"The profit rose $250 from day 9 to day 10.","why":"That’s an average over a day, not the rate on day 10.","_n":"3t20b","_k":"62a952ce"},{"t":"The profit is decreasing by $250 per day.","why":"The positive sign means increasing.","_n":"3u1fb","_k":"e61dc024"},{"t":"The profit on day 10 is $250.","why":"That’s a value. $250 per day is how fast the profit is changing.","_n":"3v96b","_k":"e5c92cfb"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"`s(t) = 45t - 5t^2` m. At what time is the instantaneous velocity 15 m/s?","options":[{"t":"`t = 6` s","why":"The average velocity over `[0, t]` is `45 - 5t`, which is 15 at 6 s; that’s not the velocity at a moment.","_n":"3w97b","_k":"b165aa7f"},{"t":"`t = 9` s","why":"That’s when the ball lands.","_n":"3x94b","_k":"11b6b92b"},{"t":"`t = 3` s","why":"The quotient gives `45 - 10t`; `45 - 10t = 15`.","_n":"3y95b","_k":"fea4145c"},{"t":"`t = 4.5` s","why":"That’s the top, where the velocity is 0.","_n":"3z9ab","_k":"3c9b01bc"}]},"b":{"prompt":"`s(t) = 60t - 5t^2` m. At what time is the instantaneous velocity 20 m/s?","options":[{"t":"`t = 6` s","why":"That’s the top, where the velocity is 0.","_n":"409bb","_k":"f6306ea4"},{"t":"`t = 12` s","why":"That’s when the ball lands.","_n":"4198b","_k":"31fb8207"},{"t":"`t = 8` s","why":"The average velocity over `[0, t]` is `60 - 5t`, which is 20 at 8 s; that’s not the velocity at a moment.","_n":"4299b","_k":"fa6d42d5"},{"t":"`t = 4` s","why":"`60 - 10t = 20`.","_n":"439eb","_k":"4c896923"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Use the limit of the difference quotient to find the instantaneous rate of change of `f(x) = x^2 - 5x` at `x = 4`.","options":[{"t":"−4","why":"`f(4) = -4` is a value.","_n":"449fb","_k":"45dcc174"},{"t":"−1","why":"That’s the average over [0, 4].","_n":"459cc","_k":"da771df7"},{"t":"3","why":"The quotient is `2(4) - 5 + h = 3 + h`, which approaches 3.","_n":"469bc","_k":"aaa5e7a6"},{"t":"8","why":"The `-5x` term contributes −5.","_n":"479ec","_k":"7f9ec1e7"}]},"b":{"prompt":"Find the instantaneous rate of change of `f(x) = x^2 + 3x` at `x = -2`.","options":[{"t":"−4","why":"Include the `3x` term: it contributes 3.","_n":"489dc","_k":"b1f4e85d"},{"t":"−2","why":"`f(-2) = -2` is a value.","_n":"4998c","_k":"a8aad504"},{"t":"−1","why":"`2(-2) + 3`.","_n":"4a97c","_k":"161f859c"},{"t":"1","why":"That’s the average over [−2, 0].","_n":"4b9ac","_k":"f2dc55aa"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"An oil spill is a circle with area `A = πr^2`. How fast is the area changing with respect to the radius when `r = 10` m?","options":[{"t":"20 m² per m","why":"Keep the π: `A = πr^2`.","_n":"4c99c","_k":"fa130acf"},{"t":"20π m² per m","why":"The quotient is `π(20 + h)`, which approaches 20π.","_n":"4da4c","_k":"03a35966"},{"t":"100π m²","why":"That’s the area.","_n":"4ea3c","_k":"21f8ddef"},{"t":"10π m² per m","why":"That’s the average over [0, 10].","_n":"4f2ab","_k":"e2e463c8"}]},"b":{"prompt":"A square tile has area `A = s^2`. How fast is the area changing with respect to the side length when `s = 7` cm?","options":[{"t":"14 cm² per cm","why":"The quotient is `14 + h`.","_n":"4g2bb","_k":"e1c474d1"},{"t":"49 cm²","why":"That’s the area.","_n":"4h2cb","_k":"3494f5ac"},{"t":"7 cm² per cm","why":"That’s the average over [0, 7].","_n":"4i2db","_k":"6f0af036"},{"t":"14 cm per cm²","why":"Units are output per input: cm² per cm, not cm per cm².","_n":"4j26b","_k":"b44b14a7"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Over [0, 6] a ball’s average velocity is 0 m/s, yet it clearly moved. Which explanation is best?","options":[{"t":"“Average velocity uses the change in position. The ball rose and fell back to its starting height, so its displacement is 0, even though the distance it travelled wasn’t.”","why":"Up and down by the same amount is a change in position of 0.","_n":"4k27b","_k":"957302c8"},{"t":"“The velocity was 0 at `t = 3`, so the average is 0.”","why":"One moment doesn’t set the average.","_n":"4l28b","_k":"099858ff"},{"t":"“The ball was at rest the whole time.”","why":"It moved 90 m.","_n":"4m29b","_k":"8c16d603"},{"t":"“Thrown balls always have average velocity 0.”","why":"Only when the window starts and ends at the same height.","_n":"4n22b","_k":"72e03e87"}]},"b":{"prompt":"A runner completes one 400 m lap of a track, finishing where she started, in 80 s. Why is her average velocity 0 m/s but her average speed 5 m/s?","options":[{"t":"“Her velocity was 0 at the start, so the average is 0.”","why":"One moment doesn’t set the average.","_n":"4o23b","_k":"c6c6ff43"},{"t":"“She stopped at the finish line, so her velocity is 0.”","why":"Average velocity doesn’t depend on the final moment.","_n":"4pb0b","_k":"295e34fb"},{"t":"“Velocity uses displacement, which is 0 for a full lap; speed uses the 400 m of distance.”","why":"400 m ÷ 80 s = 5 m/s is the average speed; a full lap’s displacement is 0.","_n":"4qafb","_k":"fca5bb7e"},{"t":"“Velocity and speed are the same, so one of the numbers is wrong.”","why":"Average velocity uses the change in position; average speed uses the distance travelled.","_n":"4raeb","_k":"0df705c1"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which question asks for an instantaneous rate of change?","options":[{"t":"“What was the average rate of rise from 1 p.m. to 3 p.m.?”","why":"That’s an average.","_n":"4sadb","_k":"b513e2cd"},{"t":"“What was the water level at 3 p.m.?”","why":"That’s a value.","_n":"4tacb","_k":"cfc6a7d5"},{"t":"“How much did the water level rise from 1 p.m. to 3 p.m.?”","why":"That’s a change, not a rate.","_n":"4uabb","_k":"6da19439"},{"t":"“How fast was the water level rising at exactly 3 p.m.?”","why":"“At exactly 3 p.m.” is a single moment.","_n":"4vaab","_k":"05957f56"}]},"b":{"prompt":"Which question asks for an instantaneous rate of change?","options":[{"t":"“How far did the car go between the two lights?”","why":"That’s a distance, not a rate.","_n":"4wa9b","_k":"fbb5e150"},{"t":"“What did the car’s speedometer read as it passed the school?”","why":"A speedometer reads the rate at one moment.","_n":"4xa8b","_k":"4d8b6669"},{"t":"“What was the car’s average speed between the lights?”","why":"That’s an average.","_n":"4ya7b","_k":"73d97ab4"},{"t":"“How far from home was the car at 4 p.m.?”","why":"That’s a value.","_n":"4z2ec","_k":"b53aa7eb"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"A bakery’s profit from selling `x` loaves is `P(x) = 3x - 0.01x^2` dollars (`0 ≤ x ≤ 200`). What is the instantaneous rate of change of profit at `x = 100`, and what does it mean?","options":[{"t":"$200: the profit at 100 loaves","why":"That’s `P(100)`, a value, not a rate.","_n":"502fc","_k":"0add6539"},{"t":"−$1 per loaf: profit is falling","why":"The rate is positive at `x = 100`.","_n":"512cc","_k":"f59556a1"},{"t":"$1 per loaf: one more loaf adds about $1 of profit","why":"The quotient is `3 - 0.01(200 + h)`, which approaches 1.","_n":"522dc","_k":"609b95de"},{"t":"$2 per loaf: the average from 0 to 100 loaves","why":"That’s the average over [0, 100], not the rate at `x = 100`.","_n":"532ac","_k":"02455681"}]},"b":{"prompt":"`P(x) = 5x - 0.02x^2` dollars (`0 ≤ x ≤ 250`). Instantaneous rate of change at `x = 50`, and its meaning?","options":[{"t":"−$3 per loaf: profit is falling","why":"The rate is positive at `x = 50`.","_n":"542bc","_k":"c8deec21"},{"t":"$4 per loaf: the average from 0 to 50","why":"That’s the average over [0, 50], not the rate at `x = 50`.","_n":"5528c","_k":"c146ea92"},{"t":"$200: the profit at 50 loaves","why":"That’s `P(50)`, a value, not a rate.","_n":"5629c","_k":"3da70700"},{"t":"$3 per loaf: one more loaf adds about $3","why":"The quotient is `5 - 0.02(100 + h)`, which approaches 3.","_n":"5726c","_k":"648dac99"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A cart’s position is `s(t) = t^2 - 6t` metres from a sensor, `0 ≤ t ≤ 8`. When is the cart at rest, and what is its velocity at `t = 5`?","options":[{"t":"At rest at `t = 0` and 6 s; −5 m/s at `t = 5`","why":"Those are where `s = 0`, and −5 is `s(5)`.","_n":"5827c","_k":"8ef7e8d0"},{"t":"At rest at `t = 3` s; −5 m/s at `t = 5`","why":"−5 m is the position at `t = 5`.","_n":"5994c","_k":"97c09b27"},{"t":"At rest at `t = 3` s; −1 m/s at `t = 5`","why":"That’s the average velocity over [0, 5].","_n":"5a93c","_k":"dd14e774"},{"t":"At rest at `t = 3` s; 4 m/s at `t = 5`","why":"The quotient gives `2t - 6`: 0 at `t = 3` and 4 at `t = 5`.","_n":"5b96c","_k":"c8257339"}]},"b":{"prompt":"`s(t) = t^2 - 8t` metres, `0 ≤ t ≤ 10`. When is the cart at rest, and what is its velocity at `t = 6`?","options":[{"t":"At rest at `t = 4` s; −2 m/s at `t = 6`","why":"That’s the average velocity over [0, 6].","_n":"5c95c","_k":"29a9e554"},{"t":"At rest at `t = 4` s; −12 m/s at `t = 6`","why":"−12 m is the position at `t = 6`.","_n":"5d98c","_k":"3098cd7a"},{"t":"At rest at `t = 0` and 8 s; −12 m/s at `t = 6`","why":"Those are where `s = 0`, and −12 is `s(6)`.","_n":"5e97c","_k":"4834ab2c"},{"t":"At rest at `t = 4` s; 4 m/s at `t = 6`","why":"The quotient gives `2t - 8`: 0 at `t = 4` and 4 at `t = 6`.","_n":"5f9ac","_k":"97eb4636"}]}}]},"task":{"title":"Design a launch","summary":"Design a launch","statement":"\u003cp>A ball is launched upward with height `s(t) = vt - 5t^2` metres. Choose the launch speed `v` and a time window [`a`, `b`] that meet every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The average velocity on [`a`, `b`] is 0 m/s.\u003c/li>\u003cli>The window lasts exactly 4 s.\u003c/li>\u003cli>The instantaneous velocity at `t = a` is 20 m/s.\u003c/li>\u003cli>The maximum height is less than 100 m.\u003c/li>\u003cli>The window lies within the flight (the ball hasn’t landed).\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Set `v` from 5 to 50 m/s in steps of 5, and `a` and `b` from 0 to 10 s in steps of 0.5, with `a \u003c b`. The preview shows the ball on its track and the height graph with your window bracketed, its secant, and the tangent at `t = a`.\u003c/p>","checks":["Average velocity 0 on [`a`, `b`]","Window lasts 4 s","Velocity 20 m/s at `t = a`","Maximum height under 100 m","Window within the flight"],"tips":["Zero average velocity means the ball is at the same height at `a` and `b`: the window is centred on the top, at `t = v/10`.","Make `b - a = 4`.","The velocity at `a` is `v - 10a`.","The top is at `t = v/10`, height `v^2/20`.","The ball lands at `t = v/5`."],"explainPrompt":"Explain why a zero average velocity forces the window to be centred on the moment the ball is highest.","vocab":"Use the words average velocity, instantaneous velocity, change in position and maximum height.","success":"Your design works!","more":"There’s more than one answer. Can you find them all?","afterAll":"Every answer has `a = (v - 20)/10` and `b = a + 4`. `v = 45` would reach 101.25 m, just over the limit."},"cards":[["Average rate of change","`{f(b) - f(a)}/{b - a}`: the secant slope, with units."],["Instantaneous rate of change","\u003cspan class=\"rc-lim\">\u003cspan class=\"rc-lt\">lim\u003c/span> \u003cspan class=\"rc-lu\">`h → 0`\u003c/span>\u003c/span> `{f(a + h) - f(a)}/{h}`: the tangent slope."],["Average velocity","Change in position ÷ change in time. Can be 0 even if the object moved."],["Average speed","Distance travelled ÷ time. Never negative."],["Instantaneous velocity","The velocity at one moment, like a speedometer reading."],["At the top of a throw","The velocity is 0."],["Sign of a rate","Positive: increasing. Negative: decreasing."],["Units of a rate","Output units per input unit: m/s, $/item, people/year."],["Rate vs value","`s(2) = 40` m is a position; a velocity of 10 m/s is a rate."],["Ball `s(t) = vt - 5t^2`","Velocity `v - 10t`; top at `t = v/10`."],["Marginal cost","The instantaneous rate of change of cost: about the cost of one more item."],["Total distance","Add the distance of each leg between turning moments (velocity 0)."]]}};</script>
