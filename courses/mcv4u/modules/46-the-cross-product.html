.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 46 The Cross Product: V1 3D view (.cx-v), Explore layout, Part 3 stations, task. Tokens only. */
.cx-vhost{width:100%;max-width:460px;margin:0 auto}
.cx-v{position:relative;width:100%;aspect-ratio:1/1;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);touch-action:none;cursor:grab;outline-offset:2px}
.cx-v.grab{cursor:grabbing}
.cx-v svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
.cx-v line,.cx-v polyline,.cx-v path{stroke-linecap:round;stroke-linejoin:round;fill:none}
.cx-v .cx-ax{stroke:var(--ink-2);stroke-width:1.5px}
.cx-v .cx-axn{stroke:var(--ink-2);stroke-width:1.2px;stroke-dasharray:4 5;opacity:.55}
.cx-v .cx-tick{stroke:var(--ink-2);stroke-width:1.2px}
.cx-v .cx-mark{stroke:var(--ink);stroke-width:1.6px;fill:none}
.cx-v .cx-curl{stroke:var(--ink-2);stroke-width:2px;stroke-dasharray:6 4}
.cx-v .cx-poly{fill-opacity:.14;stroke:none}
.cx-v text,.cx-cyc text{font-family:var(--font-ui);font-weight:600;font-size:15px;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.cx-v .cx-it,.cx-cyc .cx-it{font-family:var(--font-math);font-style:italic;font-size:17px}
.cx-v .cx-tl,.cx-cyc .cx-tl{font-size:12px;font-weight:500;fill:var(--ink-2)}
.cx-v .cx-cap{font-size:16px;font-weight:700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cx-v .cx-poly{fill-opacity:.22}}
:root[data-theme="dark"] .cx-v .cx-poly{fill-opacity:.22}
.cx-views{margin:8px 0 0;display:flex;justify-content:center}
.cx-hero{width:100%;max-width:420px;margin:0 auto}
.cx-hero-ctl{justify-content:center;margin-top:6px}

/* Explore */
.cx-ex{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.cx-ex{grid-template-columns:minmax(0,1fr)}}
.cx-eq{min-height:1.6em}
.cx-tog{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 4px}
.cx-ck{display:inline-flex;align-items:center;gap:6px;min-height:28px;font-size:.92rem}
.cx-ck input{width:18px;height:18px;accent-color:var(--ink)}
.cx-key{margin-top:6px}
.cx-lab2{font-weight:700;margin:10px 0 4px}
.cx-strow{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0}
.cx-vn{font-size:1.15rem;min-width:1.6em;padding-top:6px}
.cx-sts{display:flex;flex-wrap:wrap;gap:6px 10px}
.cx-st{display:inline-flex;align-items:center;gap:3px}
.cx-stl{font-size:.95rem;min-width:1.5em;text-align:right;margin-right:2px}
.cx-st .btn.sm{min-width:30px;min-height:32px;padding:2px 6px}
.cx-in{width:3.2em;text-align:center}
.cx-read{margin-top:12px}
.cx-cb{font:inherit;min-width:28px;min-height:28px;padding:1px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);cursor:pointer}
.cx-cb[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink-2)}
.cx-detl{min-height:1.5em;margin-top:6px}

/* Part 3 */
.cx-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cx-p3grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
@media (max-width:760px){.cx-p3grid{grid-template-columns:minmax(0,1fr)}}
.cx-p3panel h4{margin:0 0 6px}
.cx-ptxt{margin:0 0 10px}
.cx-det3{display:inline-grid;grid-template-columns:repeat(3,2.2em);gap:2px 4px;padding:4px 10px;margin:0 0 4px;border-left:2px solid var(--ink-2);border-right:2px solid var(--ink-2);text-align:center;font-family:var(--font-math)}
.cx-crow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 6px}
.cx-cin{width:3.2em;text-align:center}
.cx-cyc{max-width:200px;margin:0 auto 8px}
.cx-cyc svg{display:block;width:100%;height:auto}
.cx-cyc .cx-cy{fill:none;stroke:var(--ink-2);stroke-width:1.6px;opacity:.6}
.cx-cyc .cx-cy.on{stroke:var(--ink);stroke-width:3px;opacity:1}
.cx-cyc .cx-cy.on.back{stroke-dasharray:6 4}
.cx-cyc .cx-cyh{fill:var(--ink-2);opacity:.6}
.cx-cyc .cx-cyh.on{fill:var(--ink);opacity:1}
.cx-cyc .cx-cyn{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5px}
.cx-cyc .cx-cyn.on{stroke:var(--ink);stroke-width:2.5px}
.cx-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.cx-pick .cx-lab2{margin:0;min-width:4.5em}
.cx-res{font-size:1.05rem;margin:10px 0}
.cx-sbs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:10px 0}
@media (max-width:520px){.cx-sbs{grid-template-columns:minmax(0,1fr)}}
.cx-sbs>div{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;overflow-x:auto}
.cx-sbs h4{margin:0 0 6px;font-size:.98rem}
.cx-sbs p{margin:4px 0}
.cx-hb{background:var(--hi-soft);border-radius:3px;padding:0 2px}
.cx-hc{border-bottom:2px solid var(--p-k);padding:0 1px}
.cx-rule{margin:12px 0 0}
.cx-pnav{margin-top:14px}

/* task */
.cx-tk{display:flex;align-items:flex-start;gap:8px;margin:8px 0 12px}

ec{a} × vec{b} = (0, 0, 6)`.","why":"`vec{a} × vec{b} = (0, -3b_3, 3b_2)`, so `b_3 = 0` and `3b_2 = 6`. Any `vec{b} = (t, 2, 0)` works.","hints":["Work out `vec{a} × vec{b}` in general for `vec{a} = (3, 0, 0)`.","It’s `(0, -3b_3, 3b_2)`. You need `b_3 = 0` and `3b_2 = 6`.","`vec{b} = (0, 2, 0)` works, and so does any (`t`, 2, 0)."],"msgs":{"seta":"Use Build or Swap mode and set `vec{a} = (3, 0, 0)` first.","down":"That gives (0, 0, −6): the right-hand rule points down. Reverse `vec{b}`.","zb":"That gives (0, −6, 0): `vec{b}` along `z` makes the result lie along `y`.","par":"Parallel to `vec{a}`: the cross product is `vec{0}`.","other":"That gives `vec{a} × vec{b}` = {v}. You need (0, 0, 6)."}},{"id":"tc2","goal":4,"prompt":"Angle mode (`|vec{a}| = 4`, `|vec{b}| = 2`). Set θ so the parallelogram’s area is `4√3`.","why":"8 sin θ = `4√3` when sin θ = `√3/2`: θ = 60° or 120°.","hints":["Area = 4 × 2 × sin θ.","8 sin θ = `4√3`, so sin θ = `√3/2`.","60°, and also 120°, since sin(180° − θ) = sin θ."],"msgs":{"mode":"Switch to Angle mode first.","cos":"8 cos 30° = `4√3`, but area uses sine: 8 sin 30° = 4.","max":"That’s the largest area, 8.","other":"At θ = {t} the area is 8 sin θ = {v}. You need `4√3` ≈ 6.93."}},{"id":"tc3","goal":[1,5],"stretch":true,"prompt":"Build mode, `vec{a} = (1, 2, 2)` fixed. Find a `vec{b}` (whole numbers from −4 to 4) with `vec{a} × vec{b} = (2, -1, 0)`. Then find a \u003cstrong>second, different\u003c/strong> one.","why":"The answers are `vec{b} = (0, 0, 1) + tvec{a}`: (0, 0, 1), (1, 2, 3), (−1, −2, −1) and (−2, −4, −3). Adding `vec{a}` to `vec{b}` adds `vec{a} × vec{a} = vec{0}`.","hints":["The target must be perpendicular to `vec{a}` (check: 2 − 2 + 0 = 0, so it’s possible). Try a simple `vec{b}` first.","With `vec{b} = (0, 0, b_3)`: `vec{a} × vec{b} = (2b_3, -b_3, 0)`.","`b_3 = 1` gives (0, 0, 1). Since `vec{a} × vec{a} = vec{0}`, `vec{a} × (vec{b} + vec{a}) = vec{a} × vec{b}`, so (1, 2, 3) works too."],"msgs":{"seta":"Use Build mode and set `vec{a} = (1, 2, 2)` first.","target":"You set `vec{b}` to the target, but `vec{a} × vec{b}` is perpendicular to `vec{b}`, so the target can’t be `vec{b}`. You get (2, 4, −5).","opp":"That gives (−2, 1, 0), the opposite. Reverse `vec{b}`.","one":"One found. Hint: adding `vec{a}` to `vec{b}` doesn’t change `vec{a} × vec{b}`. Why?","other":"That gives `vec{a} × vec{b}` = {v}. You need (2, −1, 0).","found":"Found so far","none":"none yet"}}]},"part3":{"slug":"properties","name":"Properties","heading":"Cross product properties","intro":"Five stations, five experiments. Each one tests a property with numbers and the 3D view, and ends in a rule.","stations":[{"id":"s1","title":"Order","text":"Compute `vec{a} × vec{b}` and `vec{b} × vec{a}` for `vec{a} = (2, 1, 0)` and `vec{b} = (0, 1, 3)`. Type each component, then press Check.","a":[2,1,0],"b":[0,1,3],"msgs":{"m1":"The middle component is `a_3b_1 - a_1b_3`. Check: your answer should dot to 0 with both vectors.","m7":"That’s not a cross product. Each component uses the \u003cem>other\u003c/em> two components.","m3":"That’s `vec{a} × vec{b}` again. Swap the order and the right-hand rule points the other way: `vec{b} × vec{a} = -(vec{a} × vec{b})`.","gen":"Work out each component with its 2 × 2 determinant, then dot your answer with `vec{a}` and `vec{b}`: both must be 0."},"verdictQ":"How are `vec{a} × vec{b}` and `vec{b} × vec{a}` related?","verdicts":[{"id":"eq","t":"equal"},{"id":"opp","t":"opposite"},{"id":"unr","t":"unrelated"}],"verdictFb":{"eq":"Look at the signs: every component flipped.","unr":"Each component of one is the negative of the other’s.","opp":"Right. Same length, opposite direction."},"rule":"`vec{b} × vec{a} = -(vec{a} × vec{b})` (anticommutative)."},{"id":"s2","title":"Unit-vector cycle","text":"Tap a first vector and a second vector. Forward around the circle gives +, backward gives −.","rule":"`vec{i} × vec{j} = vec{k}`, `vec{j} × vec{k} = vec{i}`, `vec{k} × vec{i} = vec{j}`; `vec{i} × vec{i} = vec{0}`."},{"id":"s3","title":"Scalars and sums","text":"Slide `@a{k}` (violet, because it does the job of a stretch) to scale `vec{a}`. Then add `@k{vec{c}} = (1, 0, 1)` and compare both sides of the distributive law.","c":[1,0,1],"rule":"`(kvec{a}) × vec{b} = k(vec{a} × vec{b})` and `vec{a} × (vec{b} + vec{c}) = vec{a} × vec{b} + vec{a} × vec{c}`.","alg":"First components: `a_2(b_3 + c_3) - a_3(b_2 + c_2) = (a_2b_3 - a_3b_2) + (a_2c_3 - a_3c_2)`. The same four terms appear on both sides, so the two sides agree for every `vec{a}`, `vec{b}`, `vec{c}`."},{"id":"s4","title":"Not associative","text":"Work out both bracketings of `vec{i} × vec{i} × vec{j}`.","left":"`(vec{i} × vec{i}) × vec{j} = vec{0} × vec{j} = vec{0}`","right":"`vec{i} × (vec{i} × vec{j}) = vec{i} × vec{k} = -vec{j}`","rule":"Different answers, so the cross product is not associative: one counterexample is enough."},{"id":"s5","title":"Parallel vectors","text":"`vec{a} = (3, 0, 0)` and `|vec{b}| = 2`. Slide `vec{b}` toward `vec{a}` and watch `vec{a} × vec{b}`.","rule":"`vec{a} × vec{b} = vec{0}` means parallel (or a zero vector)."}],"quickCheck":{"title":"Quick check","summary":"Cross product properties quick check","items":[{"id":"q1","goal":3,"prompt":"`vec{j} × vec{k}` = ?","choices":[{"t":"`vec{i}`","fb":"Right. Forward around the cycle `vec{j} → vec{k} → vec{i}`: positive.","_n":"1402e","_k":"b995a10b"},{"t":"1","fb":"Forward around the cycle `vec{j} → vec{k} → vec{i}`: positive.","_n":"15ffe","_k":"26d18f57"},{"t":"`-vec{i}`","fb":"Forward around the cycle `vec{j} → vec{k} → vec{i}`: positive.","_n":"1600e","_k":"0c47a0c8"},{"t":"`vec{0}`","fb":"Forward around the cycle `vec{j} → vec{k} → vec{i}`: positive.","_n":"17fde","_k":"0ec61047"}]},{"id":"q2","goal":3,"prompt":"If `vec{a} × vec{b} = (3, -1, 2)`, then `vec{b} × vec{a}` = ?","choices":[{"t":"(2, −1, 3)","fb":"Swapping the order flips every sign.","_n":"18fee","_k":"508a8c99"},{"t":"(−3, 1, −2)","fb":"Right. Swapping the order flips every sign.","_n":"19fbe","_k":"14bc82c4"},{"t":"`vec{0}`","fb":"Swapping the order flips every sign.","_n":"1afce","_k":"598b5752"},{"t":"(3, −1, 2)","fb":"Swapping the order flips every sign.","_n":"1b09e","_k":"962b2519"}]},{"id":"q3","goal":5,"prompt":"`(2vec{a}) × (3vec{b})` = ?","choices":[{"t":"`6(vec{a} × vec{b})`","fb":"Right. Scalars factor out and multiply: 2 × 3 = 6.","_n":"1c0ae","_k":"352239b7"},{"t":"`6(vec{b} × vec{a})`","fb":"Scalars factor out and multiply: 2 × 3 = 6.","_n":"1d07e","_k":"aad39e51"},{"t":"`vec{a} × vec{b}`","fb":"Scalars factor out and multiply: 2 × 3 = 6.","_n":"1e06e","_k":"f2e379b9"},{"t":"`5(vec{a} × vec{b})`","fb":"Scalars factor out and multiply: 2 × 3 = 6.","_n":"1f09e","_k":"e93803b5"}]},{"id":"q4","goal":5,"prompt":"Compare `(vec{i} × vec{i}) × vec{j}` and `vec{i} × (vec{i} × vec{j})`.","choices":[{"t":"Different: `vec{0}` and `-vec{j}`","fb":"Right. `vec{i} × vec{k} = -vec{j}`, so brackets matter.","_n":"1g08e","_k":"fe0b5a7a"},{"t":"Equal: both `-vec{j}`","fb":"`vec{i} × vec{k} = -vec{j}`, so brackets matter.","_n":"1h0be","_k":"02123814"},{"t":"Equal: both `vec{0}`","fb":"`vec{i} × vec{k} = -vec{j}`, so brackets matter.","_n":"1i0ae","_k":"67aa1ae2"},{"t":"Different: `vec{0}` and `vec{j}`","fb":"`vec{i} × vec{k} = -vec{j}`, so brackets matter.","_n":"1j0de","_k":"17e71a90"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Cross product ↔ result","summary":"Cross product ↔ result","goal":[1,3,5],"instruction":"Match each cross product with its result.","leftTitle":"Product","rightTitle":"Result","left":[{"id":"l1","t":"`vec{i} × vec{j}`","why":"Forward around the cycle."},{"id":"l2","t":"`vec{k} × vec{j}`","why":"Backward around the cycle: `-vec{i}`.","wrong":"`vec{j} × vec{k} = vec{i}`, so `vec{k} × vec{j} = -vec{i}`."},{"id":"l3","t":"(1, 2, 3) × (4, 5, 6)","why":"(12 − 15, 12 − 6, 5 − 8) = (−3, 6, −3).","hints":["First component: `a_2b_3 - a_3b_2`.","2(6) − 3(5) = −3; middle: 3(4) − 1(6) = 6.","Last: 1(5) − 2(4) = −3. So (−3, 6, −3)."]},{"id":"l4","t":"(2, 0, −1) × (1, 3, 2)","why":"(0 + 3, −1 − 4, 6 − 0) = (3, −5, 6)."},{"id":"l5","t":"(3, −6, 9) × (−1, 2, −3)","why":"(3, −6, 9) = −3(−1, 2, −3): parallel, so `vec{0}`.","wrong":"(3, −6, 9) = −3(−1, 2, −3): parallel."},{"id":"l6","t":"(2, −1, 1) × (1, 1, −2)","why":"(2 − 1, 1 + 4, 2 + 1) = (1, 5, 3).","hints":["Middle component: `a_3b_1 - a_1b_3`.","1(1) − 2(−2) = 5.","(1, 5, 3)."]},{"id":"l7","t":"(1, 1, 0) × (0, 1, 1)","why":"(1 − 0, 0 − 1, 1 − 0) = (1, −1, 1)."},{"id":"l8","t":"(0, 1, 1) × (1, 1, 0)","why":"The same vectors as the previous pair in the other order, so the result flips: (−1, 1, −1)."}],"right":[{"id":"r1","t":"`vec{k}`"},{"id":"r2","t":"`-vec{i}`"},{"id":"r3","t":"(−3, 6, −3)"},{"id":"r4","t":"(3, −5, 6)"},{"id":"r5","t":"`vec{0}`"},{"id":"r6","t":"(1, 5, 3)"},{"id":"r7","t":"(1, −1, 1)"},{"id":"r8","t":"(−1, 1, −1)"}],"_a":"H0BVAhoNEkpVQBURVAUSAkYQCxEUFVwLRlgbQQsVHBoIVhsJGkUEGkhAVQYaDRJKUUAVEVQBEgJGEA8RFBVcD0ZYG0EPFRwaCFobCRpFCBoZ","wrong":{"l7|r8":"Same vectors, opposite order: the result flips.","l8|r7":"Same vectors, opposite order: the result flips."},"wrongDefault":"Dot your choice with both vectors. If either isn’t 0, it can’t be the cross product."},{"id":"puzzles","type":"numeric","title":"Cross product puzzles","summary":"Cross product puzzles","star":true,"goal":[1,4,5,6],"instruction":"Type one number for each puzzle. Items 3 to 6 are non-routine (★); items 5 and 6 go beyond the Final Check.","how":"Type a number (fractions such as 1/2 and roots such as 2√5 are fine), then press Check.","items":[{"id":"r1","goal":5,"prompt":"Find `c` so that `(1, 2, c) × (2, 4, 6) = vec{0}`.","label":"c =","_a":"Vw==","display":"`c = 3`","keypad":"text","why":"(1, 2, 3) = ½(2, 4, 6): parallel vectors give `vec{0}`.","wrong":[{"match":[12],"fb":"That makes (1, 2, 12), not parallel. You need (1, 2, `c`) = ½(2, 4, 6)."}],"general":"The cross product is `vec{0}` only for parallel vectors. Compare (1, 2, `c`) wit |` (or its opposite)."]]}};</script>
