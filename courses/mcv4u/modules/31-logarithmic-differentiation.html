.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 31: Log-then-differentiate machine (working lines, move menu, graph with snap chips, Split the slope bars, V8 exact
   boxes), Which method? (grid + two routes), Slopes and rates boxes, task (steppers, ratio dial) */
.ld-ex{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.ld-main,.ld-side{min-width:0}
.ld-eq{min-height:1.6em;overflow-x:auto}
#ld-mach[hidden],#ld-movesw[hidden],#ld-ptw[hidden],.ld-bars[hidden],.ld-note[hidden],.ld-showall[hidden]{display:none}
/* the working */
.ld-work{margin:4px 0 10px;padding:0;list-style:none}
.ld-work li{display:grid;grid-template-columns:1.8em minmax(0,1fr);gap:0 6px;padding:6px 8px;border-left:3px solid var(--rule);margin:0 0 6px;background:var(--sheet)}
.ld-wnum{grid-row:1 / span 2;color:var(--ink-2);font-weight:700}
.ld-work li.cur{border-left-color:var(--pen);background:var(--info-bg)}
.ld-wn{display:block;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.ld-we{display:block;overflow-x:auto;padding:3px 0;font-size:1.06rem}
.ld-showall{display:none;margin:0 0 10px}
/* graph and bars */
.ld-gwrap{display:block}
.ld-gwrap.ld-split{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:start}
.ld-gcol{min-width:0}
canvas.plot.ld-g{touch-action:none}
.ld-key{margin:6px 0 0}
.ld-bars{min-width:0}
.ld-bsvg{display:block;width:100%;max-width:230px;height:auto;margin:0 auto}
.ld-ba{fill:var(--f3)}
.ld-ba.neg{stroke:var(--ink);stroke-width:1.5}
.ld-bb{fill:var(--f5)}
.ld-bt{fill:var(--ink)}
.ld-bguide{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3}
.ld-bzero{stroke:var(--ink);stroke-width:1.6}
.ld-bz{fill:var(--ink-2);font:600 11px var(--font-ui)}
.ld-bval{fill:var(--ink);font:700 12px var(--font-ui);text-anchor:middle}
.ld-bcap{fill:var(--ink-2);font:italic 600 12px var(--font-math);text-anchor:middle}
.ld-bleg{list-style:none;margin:6px 0 0;padding:0;font-size:.86rem}
.ld-bleg li{display:flex;align-items:center;gap:6px;margin:3px 0}
.ld-sw{display:inline-block;width:14px;height:14px;border-radius:3px;flex:0 0 auto}
.ld-swa{background:var(--f3)}
.ld-swb{background:var(--f5)}
.ld-swt{background:var(--ink)}
/* side panel */
.ld-lab{font-weight:700;margin:0 0 4px}
.ld-fns{gap:6px;margin:0 0 12px}
.ld-fns .chip{min-height:40px}
.ld-fchip .frac{font-size:.82em}
.ld-how{margin:8px 0 10px}
.ld-note{margin:0 0 10px;padding:6px 10px;border-left:4px solid var(--hi);background:var(--info-bg);border-radius:0 8px 8px 0}
.ld-moves{list-style:none;margin:0 0 8px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ld-moves .btn{width:100%;min-height:40px;text-align:left;justify-content:flex-start;white-space:normal;line-height:1.25}
.ld-cnt{margin:6px 0}
.ld-sl{margin-top:4px;display:block}
.ld-sl input{width:100%;min-height:28px}
.ld-sl output{color:var(--ink);font-weight:700}
.ld-snl{margin-top:6px}
.ld-snaps{gap:6px;margin:0 0 2px}
.ld-snaps .chip{min-height:36px;min-width:44px}
.ld-pnote{margin:4px 0 0}
.ld-side dl.read.ld-read{margin-top:14px}
.ld-read dd{overflow-x:auto;min-width:0}
.ld-ok{color:var(--green);font-weight:700}
.ld-exact{margin-top:14px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:8px}
.ld-exh{font-weight:700;margin:0 0 2px}
.ld-frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;font-size:1.1rem}
.ld-frow .numin.short{width:9rem}
.ld-fl{white-space:nowrap;min-width:2.4em}
/* Part 3 */
.ld-p3{margin-top:0;padding-top:0;border-top:0}
.ld-p3 h3{margin-top:0}
.ld-dom{margin:12px 0 4px;padding:8px 12px;border-left:4px solid var(--hi);background:var(--info-bg);border-radius:0 8px 8px 0}
.ld-routes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px 16px;margin:8px 0}
.ld-route{min-width:0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ld-route h4{margin:0 0 6px}
.ld-rl{margin:0;padding-left:1.4em;min-height:2.4em}
.ld-rl li{margin:6px 0;overflow-x:auto}
.ld-rl li.cur{font-weight:600}
/* Practice 2 */
.ld-dt{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.ld-dr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1.05rem}
.ld-dl{font-weight:600}
.ld-dr .numin.short{width:9rem}
.ld-unit{color:var(--ink-2)}
/* task */
.fx-in{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.fx-step{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.fx-step label{min-width:6.5rem}
.fx-step .numin.short{width:4.4rem}
.fx-step .btn{min-width:40px;min-height:40px}
.fx-gh{font-weight:700;margin:10px 0 4px}
.fx-dial{max-width:280px;margin:0 auto}
.ld-dial{display:block;width:100%;height:auto}
.ld-dtrack{fill:none;stroke:var(--ink-2);stroke-opacity:.4;stroke-width:10;stroke-linecap:round}
.ld-dtk{stroke:var(--ink-2);stroke-width:1.2}
.ld-dtkL{stroke:var(--ink);stroke-width:2}
.ld-dtk0{stroke:var(--green);stroke-width:3.5}
.ld-dtl{fill:var(--ink);font:600 11.5px var(--font-ui);text-anchor:middle;dominant-baseline:middle}
.ld-dneedle{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.ld-dneedle.zero{stroke:var(--green)}
.ld-dhub{fill:var(--ink)}
@media (max-width:820px){
  .ld-ex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .ld-gwrap.ld-split{grid-template-columns:minmax(0,1fr)}
  .ld-work.ld-clip li:nth-last-child(n+4){display:none}
  .ld-showall{display:inline-flex}
  .ld-moves{grid-template-columns:minmax(0,1fr)}
  .ld-routes{grid-template-columns:minmax(0,1fr)}
  .ld-frow .numin.short,.ld-dr .numin.short{width:7.4rem}
}

erentiate \u003cstrong>implicitly\u003c/strong>, and multiply by `y` at the end. The same move turns long products and quotients into easy sums.","fig":{"aria":"The graph of y = x to the x draws in blue for x from 0 to 2.2. The label y = x to the x splits: the exponent x slides down in front of ln x to make ln y = x ln x. A black tangent line slides along the curve and flattens at x = 1 over e, about 0.37, labelled slope 0. The line y prime = x to the x times (ln x + 1) fades in.","shape":"square"}},"goals":["I can tell when a function needs log differentiation and when the power or exponential rule is enough.","I can take ln of both sides and use log laws to bring down exponents and split products and quotients.","I can differentiate `ln y` as `(1/y)(dy/dx)` and solve for `dy/dx`.","I can differentiate functions such as `x^x`, `x^{sin x}` and `x^{ln x}`.","I can use log differentiation for long products and quotients, and for relative rates of change.","I can use these derivatives to find slopes, tangent lines and horizontal tangents."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Log laws","goal":2,"prompt":"For `x > 0`, which expression equals `ln[x^3(x + 1)^2]`?","options":[{"t":"`3 ln x · 2 ln(x + 1)`","why":"ln turns a product into a \u003cstrong>sum\u003c/strong>.","_n":"0d3f","_k":"b187e816"},{"t":"`3 ln x + 2 ln(x + 1)`","why":"Product → sum; each exponent comes down in front.","_n":"1d6f","_k":"23e3416d"},{"t":"`ln 3x + ln 2(x + 1)`","why":"`ln(x^3) = 3 ln x`, not `ln(3x)`.","_n":"2d5f","_k":"417f48da"},{"t":"`6 ln[x(x + 1)]`","why":"Each factor keeps its own exponent.","_n":"3d8f","_k":"b4533d46"}],"hints":["Split the product first.","`ln(x^3) + ln((x + 1)^2)`.","`3 ln x + 2 ln(x + 1)`."]},{"id":"w2","skill":"Log laws","goal":2,"prompt":"For `x > 0`, simplify `ln(x^x)`.","options":[{"t":"`(ln x)^2`","why":"`x^x` isn’t `x^2`.","_n":"4d7f","_k":"cb63c3e6"},{"t":"`x + ln x`","why":"`ln(a^b) = b ln a`: a product.","_n":"5daf","_k":"89129225"},{"t":"`(l ntiate, then multiply by `y`."},{"id":"rates","type":"custom","title":"Slopes and rates","summary":"Slopes and rates","star":true,"goal":[4,5,6],"instruction":"Find slopes, rates and tangent points with exact values. Items 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type exact values: whole numbers, fractions, and e or ln where you need them, such as −3/2, 2e^2 or e^(−1/3). Put a fractional exponent in brackets. Then press Check.","msgs":{"fill":"Fill in every box first.","err":"Type exact values only, such as 3, −1/4, 2e^2 or e^(−1/3).","lnneg":"ln only accepts positive inputs: check what’s inside each ln.","exact":"Close, but give the exact value (with e where you need it, such as e^(−1/3) or 2e^2), not a decimal.","general":"Not yet. Check your work and try again."},"items":[{"id":"s1","goal":4,"prompt":"Slope of `y = x^x` at `x = 1`.","boxes":[{"k":"s","pre":"Slope"}],"_a":"GhdLFgMHSQ==","display":"1","wrong":[{"k":"s","eq":0,"fb":"`x^x ln x` is only part of it."}],"why":"`y′ = x^x(ln x + 1) = 1 · (0 + 1) = 1`."},{"id":"s2","goal":4,"prompt":"Slope of `y = x^{ln x}` at `x = e^2`.","boxes":[{"k":"s","pre":"Slope"}],"_a":"GhdLFgMEDR1UAA4GCwIHClQCCgYMDwxO","display":"`4e^2`","wrong":[{"k":"s","eq":0.5413411329464508,"fb":"That’s `y′/y`; multiply by `y = e^4`."}],"why":"At `x = e^2`: `y = (e^2)^2 = e^4` and `y′/y = 2 · 2/e^2 = 4/e^2`, so `y′ = e^4 · 4/e^2 = 4e^2`."},{"id":"s3","goal":5,"star":true,"prompt":"`dy/dx` at `x = 0` for `y = {(x + 3)^2(x - 1)^4}/{(x + 1)^3}`.","boxes":[{"k":"s","pre":"`dy/dx =`"}],"_a":"GhdLFgMbAQQc","display":"−57","wrong":[{"k":"s","eq":-6.333333333333333,"fb":"Multiply by `y(0) = 9`."},{"k":"s","eq":-3,"fb":"The quotient’s log is subtracted: `-3/(x + 1)`, not `+3/(x + 1)`."}],"why":"At 0: `y′/y = 2/3 - 4 - 3 = -19/3` and `y(0) = 9`, so `y′ = -57`.","hints":["`ln y = 2 ln(x + 3) + 4 ln(x - 1) - 3 ln(x + 1)`, using `ln |y|`.","At 0: `y′/y = 2/3 - 4 - 3 = -19/3`.","`y(0) = 9 · 1/1 = 9`, so `y′ = -57`."]},{"id":"s4"," )(dy/dx) = 3 ln x + 3`.","So `dy/dx = 3 ln x + 3`.","At `x = e`, the slope is 6."],"_a":"Ug==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct: product rule.","","Step 5 follows step 4. The mistake is earlier."],"fixes":[{"t":"`dy/dx = x^{3x}(3 ln x + 3)`, so the slope at `e` is `6e^{3e}`.","why":"Multiply both sides of step 3 by `y = x^{3x}`.","_n":"1kdfe","_k":"53aab18b"},{"t":"`dy/dx = (3 ln x + 3)/x^{3x}`.","why":"To clear `1/y`, multiply by `y`.","_n":"1le8e","_k":"2fda81ba"},{"t":"`dy/dx = 3x · x^{3x - 1}`.","why":"The power rule needs a constant exponent. Here the exponent moves with `x`.","_n":"1me9e","_k":"b3840c96"},{"t":"Step 4 is correct.","why":"Step 3’s left side is `y′/y`, not `y′`.","_n":"1n72f","_k":"2fc948a9"}],"hints":["What’s on the left of step 3?","`y′` divided by `y`.","Multiply by `y = x^{3x}`."]},{"id":"e2","goal":4,"task":"Differentiate `y = x^{sin x}`, `x > 0`.","steps":["`ln y = sin x · ln x`.","`(1/y)(dy/dx) = cos x · (1/x)`.","`dy/dx = x^{sin x} · cos x/x`.","At `x = π/2`, the slope is 0."],"_a":"UA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. Look earlier.","Step 4 follows step 3."],"fixes":[{"t":"`(1/y)(dy/dx) = cos x ln x + (sin x)/x`, so the slope at `π/2` is 1.","why":"The product rule on `sin x · ln x` gives two terms.","_n":"1o71f","_k":"1f4afdd0"},{"t":"`(1/y)(dy/dx) = cos x · ln x`.","why":"Half the product rule.","_n":"1p74f","_k":"6ee08925"},{"t":"`dy/dx = sin x · x^{sin x - 1}`.","why":"The power rule needs a constant exponent. Here the exponent moves with `x`.","_n":"1q73f","_k":"9bcbfcdb"},{"t":"Step 2 is correct.","why":"`sin x · ln x` is a product: `u′v + uv′`.","_n":"1r6ef","_k":"81b3f515"}],"hints":["What rule does the right side of step 1 need?","Product rule.","`cos x ln x + sin x · (1/x)`."]},{"id":"e3","goal":2,"task":"Differentiate `y = x^2(x + 1)^3/(x - 2)^4` for `x > 2`.","steps":["`ln y = 2 ln x + 3 ln(x + 1) + 4 ln(x - 2)`.","`y′/y = 2/x + 3/(x + 1) + 4/(x bcc","_k":"9c1a1f5d"},{"t":"−9/2","why":"You’ve found `y′/y`. Multiply both sides by `y`, then write `y` in terms of `x`.","_n":"36bbc","_k":"fed4b09f"},{"t":"28","why":"`3/2 - 2 + 4` treats the quotient as a product.","_n":"37bac","_k":"28cae8bd"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `d/dx (x^x) ≠ x · x^{x - 1}`?","options":[{"t":"“`x^x` isn’t defined, so it has no derivative.”","why":"It’s defined for `x > 0`.","_n":"38b9c","_k":"1e21e8ca"},{"t":"“The power rule needs a constant exponent, but here the exponent changes with `x`. Taking ln first gives `ln y = x ln x`, so `y′ = x^x(ln x + 1)`.”","why":"The power rule needs a constant exponent. Here the exponent moves with `x`.","_n":"39b0c","_k":"f7120a89"},{"t":"“It’s correct, because `x^x = x · x^{x - 1}`.”","why":"That identity is true, but the rule still needs a constant exponent.","_n":"3aafc","_k":"114ea3d1"},{"t":"“The power rule only works for whole-number exponents.”","why":"It works for any constant exponent, such as `x^π`.","_n":"3b3ec","_k":"c4fd1607"}]},"b":{"prompt":"Which is the best explanation of why `d/dx (x^x) ≠ x^x ln x`?","options":[{"t":"“The exponential rule needs a constant base, but here the base changes with `x`. Taking ln first gives `y′/y = ln x + 1`, so `y′ = x^x(ln x + 1)`.”","why":"The exponential rule needs a constant base. Here the base moves too.","_n":"3c3fc","_k":"0e9021d6"},{"t":"“It’s correct for all `x > 0`.”","why":"At `x = 1` it gives 0, but the true slope is 1.","_n":"3d3cc","_k":"34ae32f3"},{"t":"“`ln x` is negative for `x \u003c 1`, so the rule fails there.”","why":"The sign isn’t the issue.","_n":"3e3dc","_k":"af5e31c9"},{"t":"“The exponential rule only works for base `e`.”","why":"`b^x ln b` works for any constant `b > 0`.","_n":"3f3ac","_k":"36a1828f"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which list gives the steps of log differentiation for `y = x^{2x}` in the correct order?","options":[{"t":"`ln y = 2x ln x` →  ln of both sides (`ln |y|` if `y` can be negative)."],["Step 2","Use log laws: products → sums, quotients → differences, exponents → factors."],["`d/dx (ln y)`","`(1/y)(dy/dx)`, by the chain rule."],["Last step","Multiply by `y`, then write `y` in terms of `x`."],["`d/dx (x^x)`","`x^x(ln x + 1)`, for `x > 0`."],["Two pieces","`d/dx (x^x) = x^x ln x` (exponential-rule piece) + `x · x^{x - 1}` (power-rule piece)."],["Power rule vs exponential rule","`x^n`: constant exponent → `nx^{n - 1}`. `b^x`: constant base → `b^x ln b`."],["The `e`-rewrite","`x^x = e^{x ln x}`: the chain rule gives the same answer."],["Minimum of `x^x`","At `x = 1/e`; the value is `e^{-1/e}`."],["Relative rates","`V = lwh` ⟹ `V′/V = l′/l + w′/w + h′/h`."],["Squares count twice","`V = πr^2h` ⟹ `V′/V = 2r′/r + h′/h`."]]}};</script>
