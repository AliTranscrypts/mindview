.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 36 Properties of vectors (prefix pv-) */
.pv-hsep{margin:0 .35em;color:var(--ink-2)}
.pv-hbut{font-family:var(--font-ui);font-size:.7em;font-weight:700;color:var(--ink-2);margin-right:.25em}
.pv-modes{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.pv-modes .chip{flex:0 0 auto;white-space:nowrap}
.pv-mode[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pv-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.pv-cols{grid-template-columns:minmax(0,1fr)}}
.pv-main,.pv-side{min-width:0}
.pv-side > *{margin-bottom:10px}
.pv-sl{display:block}
.pv-knote{margin-top:-6px}
.pv-read dd{overflow-wrap:anywhere}
.pv-order{margin:6px 0 2px}
.pv-num{margin:4px 0}
.pv-tbl{border-collapse:collapse;width:100%;font-size:.95rem}
.pv-tbl th,.pv-tbl td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.pv-tbl th{background:var(--hi-soft)}
.pv-meter{margin:6px 0 0}
.pv-msvg{width:100%;max-width:420px;height:auto;display:block}
.pv-mt{font:600 12px var(--font-ui);fill:var(--ink-2)}
.pv-setups .chips{display:flex;flex-wrap:wrap;gap:6px}
.pv-st{margin-top:14px}
.pv-st1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.pv-st1{grid-template-columns:minmax(0,1fr)}}
.pv-eqline{font-size:1.08rem;margin:6px 0}
.pv-line{border-left:3px solid var(--rule);padding-left:10px;margin:8px 0}
.pv-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.pv-moves{flex-wrap:wrap}
.pv-svg{width:100%;max-width:380px;height:auto;display:block}
.pv-sfig{max-width:300px;margin:4px 0 6px}
.pv-svl{font:700 15px var(--font-ui);fill:var(--ink)}
.pv-sv{font:italic 700 17px var(--font-math)}
.pv-svp{fill:var(--pen)}
.pv-svt{fill:var(--f3)}
.pv-frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.pv-box{width:4.6em}

Now you’ll test which rules from number algebra still hold. Addition is \u003cstrong>commutative\u003c/strong> and \u003cstrong>associative\u003c/strong>. Scalars \u003cstrong>distribute\u003c/strong>. Every vector has an \u003cstrong>opposite\u003c/strong>, and there is a \u003cstrong>zero vector\u003c/strong>. Subtraction doesn’t commute, and lengths don’t simply add.","fig":{"html":"\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"Vectors u and v drawn from one point. The paths u then v and v then u close a parallelogram and meet at one tip: the diagonal u + v is the same vector. Then u − v and v − u: two arrows of equal length pointing opposite ways, not the same.\">\u003c/canvas>"}},"goals":["I can show, with diagrams and grid steps, that vector addition is commutative and associative.","I can use the zero vector and opposite vectors, and explain why `vec{u} - vec{v} ≠ vec{v} - vec{u}` in general.","I can use the distributive properties `k(vec{u} + vec{v}) = kvec{u} + kvec{v}` and `(k + m)vec{u} = kvec{u} + mvec{u}`.","I can simplify vector expressions using the properties, including in geometric figures.","I can solve vector equations such as `2vec{x} + vec{a} = vec{b}`.","I can explain why `|vec{u} + vec{v}| ≤ |vec{u}| + |vec{v}|` and find the range of possible magnitudes."],"start":{"warmup":{"intro":"Grid steps are written (right, up), as on the module 34–35 boards.","questions":[{"id":"w1","skill":"Tip-to-tail addition","goal":1,"prompt":"On a grid, `vec{a}` goes 3 right and 1 up; `vec{b}` goes 1 right and 4 up. Placed tip-to-tail from the origin, where does `vec{a} + vec{b}` end?","options":[{"t":"(2, −3)","why":"That’s `vec{a} - vec{b}`.","_n":"0fb3","_k":"09aad6da"},{"t":"(5, 4)","why":"Add right steps to right steps: 3 + 1 = 4.","_n":"1fe3","_k":"73ea52e4"},{"t":"(−2, 3)","why":"That’s `vec{b} - vec{a}`.","_n":"2fd3","_k":"793811f6"},{"t":"(4, 5)","why":"3 + 1 right and 1 + 4 up.","_n":"3003","_k":"92b66626"}],"hints":["Follow `vec{a}`, then start `vec{b}` at its tip.","Right steps: 3 + 1. Up steps: 1 + 4.","(4, 5)."]},{"id":"w2","skill":"Tip-to-tail addition","goal":2,"prompt":"In parallelogram ABCD, `vec{AB} = vec{u}` and `vec{AD} = vec{v}`. Which vector equals `vec{BD}`?","options":[{"t":"`-vec{u} - vec{v}`","why":"That’s `vec{CA}`.","_n":"4ff3","_k":"afa72a2a"},{"t":"`vec{u} - vec{v}`","why":"That’s `vec{DB}`: same length, opposite direction.","_n":"5023","_k":"556a1ead"},{"t":"`vec{v} - vec{u}`","why":"`vec{BD} = vec{BA} + vec{AD} = -vec{u} + vec{v}`.","_n":"6013","_k":"63777f82"},{"t":"`vec{u} + vec{v}`","why":"That’s `vec{AC}`.","_n":"7043","_k":"65f0b119"}],"hints":["Go from B to D through A.","B → A is `-vec{u}`; A → D is `vec{v}`.","`vec{v} - vec{u}`."]},{"id":"w3","skill":"Scalar multiples","goal":3,"prompt":"`|vec{u}| = 4`. What is `|-3vec{u}|`?","options":[{"t":"−12","why":"A length can’t be negative.","_n":"8033","_k":"7dbc9cd9"},{"t":"1","why":"Multiply the length by `|-3|`.","_n":"9042","_k":"ee30a928"},{"t":"4/3","why":"`-3vec{u}` is three times as long.","_n":"a052","_k":"0f7b30d5"},{"t":"12","why":"`|-3| × 4 = 12`.","_n":"b062","_k":"61bd2f0a"}],"hints":["The minus sign only reverses the direction.","Length is multiplied by 3.","12."]},{"id":"w4","skill":"Scalar multiples","goal":3,"prompt":"Which describes `-½vec{v}`?","options":[{"t":"Same length, opposite direction","why":"That’s `-vec{v}`.","_n":"c072","_k":"71f7a8a5"},{"t":"Half as long, same direction","why":"The negative reverses it.","_n":"d082","_k":"885ed915"},{"t":"Twice as long, opposite direction","why":"½ halves the length.","_n":"e092","_k":"cd66d10d"},{"t":"Half as long as `vec{v}`, opposite direction","why":"½ halves the length and the minus sign reverses the direction.","_n":"f0a2","_k":"4f791a65"}],"hints":["Two pieces: the size ½ and the sign −.","½ halves; − reverses.","Half as long, opposite."]},{"id":"w5","skill":"Number properties","goal":4,"prompt":"Which property does `3(x + 4) = 3x + 12` use?","options":[{"t":"Commutative","why":"Commutative swaps order: `a + b = b + a`.","_n":"g0b2","_k":"bfbe3a20"},{"t":"Distributive","why":"The 3 multiplies each term in the brackets.","_n":"h0c2","_k":"529eada9"},{"t":"Identity","why":"Identity is adding 0 or multiplying by 1.","_n":"i0d2","_k":"8ddfd948"},{"t":"Associative","why":"Associative regroups brackets: `(a + b) + c = a + (b + c)`.","_n":"j963","_k":"5250ce11"}],"hints":["Something outside the brackets multiplies everything inside.","That’s distributing.","Distributive."]},{"id":"w6","skill":"Number properties","goal":5,"prompt":"Solve `2x + 7 = 1`.","options":[{"t":"`x = 4`","why":"`2x = 1 - 7`.","_n":"k953","_k":"98e957eb"},{"t":"`x = -3`","why":"`2x = -6`.","_n":"l983","_k":"555716fa"},{"t":"`x = 3`","why":"`1 - 7 = -6`, not 6.","_n":"m973","_k":"11fd2d8b"},{"t":"`x = -12`","why":"Divide by 2.","_n":"n9a3","_k":"37d4662e"}],"hints":["Undo the + 7 first.","`2x = -6`.","`x = -3`."]}],"refreshers":{"Tip-to-tail addition":"Start the second arrow at the tip of the first; the sum runs from the first tail to the last tip. In grid steps, add the right steps and the up steps separately.","Scalar multiples":"`kvec{u}` is `|k|` times as long as `vec{u}`; if `k \u003c 0` it points the opposite way. `|kvec{u}| = |k||vec{u}|`.","Number properties":"Commutative: order doesn’t matter. Associative: grouping doesn’t matter. Distributive: a factor multiplies every term. To solve, undo operations on both sides."}}},"explore":{"heading":"Property tester","intro":"Pick a property, set the vectors, and see whether both sides land on the same tip. Then try to break it.","modes":[{"id":"comm","t":"Commutative"},{"id":"assoc","t":"Associative"},{"id":"zero","t":"Zero and opposites"},{"id":"distV","t":"Distributive (over vectors)"},{"id":"distS","t":"Distributive (over scalars)"},{"id":"sub","t":"Subtraction: does it commute?"},{"id":"mag","t":"Magnitudes"}],"txt":{"modes":"Property","view":"View","diagram":"Diagram","numbers":"Numbers","subView":"Compare","subOrder":"`vec{u} - vec{v}` and `vec{v} - vec{u}`","subBr":"`(vec{u} - vec{v}) - vec{w}` and `vec{u} - (vec{v} - vec{w})`","kLabel":"Scalar `k`","mLabel":"Scalar `m`","kNote":"`k` stretches the vector, like `a` stretches a graph.","turn":"Turn `vec{v}` (length stays the same)","turnL":"↺ 15°","turnR":"↻ 15°","setups":"Challenge set-ups","setup":"Set up challenge","key":"`vec{u}` blue, `vec{v}` teal, `vec{w}` orange; results thick black. Left side solid, right side dashed.","dragNote":"Drag a tip, or press Tab to select a tip and use the arrow keys to move it one grid step.","numHead":["","Left side","Right side"],"rows":{"prop":"Property","left":"Left side","right":"Right side","same":"Same vector?","len":"|left side|","mag":"Magnitudes","chain":"`vec{u} + vec{v} + vec{w}`","brL":"`(vec{u} - vec{v}) - vec{w}`","brR":"`vec{u} - (vec{v} - vec{w})`","gap":"Gap between them","other":"Other answer"},"yes":"Yes ✓","no":"No: they differ by","zeroDot":"0⃗: length 0, no direction","sameTip":"same tip ✓","order":"Drawn in order:"},"predIntro":"Make a prediction first. Then the property tester shows you what really happens.","predictions":[{"id":"p1","prompt":"Draw `vec{u}` then `vec{v}`, and `vec{v}` then `vec{u}`. Where do the two paths end?","use":"Commutative, `vec{u}` = (3, 1), `vec{v}` = (−1, 2).","options":[{"t":"At different points, because the paths are different lengths","_n":"o993","_k":"b50c3f73"},{"t":"At mirror-image points","_n":"p9c3","_k":"edbf50de"},{"t":"At the same point","_n":"q9b3","_k":"1705bd95"},{"t":"At the same point only if `|vec{u}| = |vec{v}|`","_n":"r8e3","_k":"2f10da1d"}],"explain":"The two paths are opposite sides of a parallelogram, so they finish at the same corner: (2, 3)."},{"id":"p2","prompt":"How are `vec{u} - vec{v}` and `vec{v} - vec{u}` related?","options":[{"t":"They are equal","_n":"s8d3","_k":"eaa770a5"},{"t":"Same length, opposite directions","_n":"t902","_k":"0c4a641d"},{"t":"`vec{v} - vec{u}` is longer","_n":"u912","_k":"c22a7d3e"},{"t":"They are perpendicular","_n":"v8e2","_k":"fdacfa06"}],"explain":"`vec{u} - vec{v}` goes from `vec{v}`’s tip to `vec{u}`’s tip; `vec{v} - vec{u}` makes the same trip backwards."},{"id":"p3","prompt":"What happens to the third side, `vec{u} + vec{v}`?","use":"Distributive (over vectors); `k` animates from 1 to 2.","options":[{"t":"It grows by `|vec{v}|`","_n":"w8f2","_k":"4520fbf4"},{"t":"It doubles and stays parallel","_n":"x8c2","_k":"260db691"},{"t":"It stays the same","_n":"y8d2","_k":"6dab97d0"},{"t":"It doubles but turns","_n":"z8a2","_k":"fb5ba79e"}],"explain":"Enlarging a triangle by 2 doubles every side and keeps their directions, so `2(vec{u} + vec{v}) = 2vec{u} + 2vec{v}`."},{"id":"p4","prompt":"As `vec{v}` turns, which values can `|vec{u} + vec{v}|` take?","use":"Magnitudes, `|vec{u}| = 3` and `|vec{v}| = 4`.","options":[{"t":"Always 7","_n":"108b2","_k":"c599e7c2"},{"t":"Anything from 1 to 7","_n":"11983","_k":"53746772"},{"t":"Anything from 0 to 7","_n":"12993","_k":"a90dff6b"},{"t":"Always 5","_n":"13223","_k":"1acafe1c"}],"explain":"7 only when the arrows line up, 1 when they’re opposite, and 5 only at 90°."}],"chalIntro":"Use \u003cstrong>Set up challenge\u003c/strong> on the board to load the fixed vectors, move the tips, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Zero and opposites mode, with `vec{u}` = (3, 1) and `vec{v}` = (−1, 2) fixed. Drag `vec{w}` so that `vec{u} + vec{v} + vec{w} = 0⃗`.","why":"`vec{u} + vec{v}` = (2, 3), so `vec{w}` must be its opposite, (−2, −3). The three arrows close up.","hints":["First find `vec{u} + vec{v}`.","`vec{u} + vec{v}` = (2, 3).","`vec{w} = -(2, 3)` = (−2, −3)."],"msgs":{"mode":"Switch to Zero and opposites mode first.","fixed":"Keep `vec{u}` = (3, 1) and `vec{v}` = (−1, 2): press \u003cstrong>Set up challenge\u003c/strong> 1.","same":"That’s `vec{u} + vec{v}` itself. You need its et: the gap is `2|vec{w}|`. Make it exactly 6."}}]},"part3":{"slug":"simplify","name":"Simplify","heading":"Simplify and solve","intro":"The properties earn their keep in algebra. Name the property behind each line, solve a vector equation one move at a time, then write a vector in a figure. Then try the quick check.","st1":{"title":"Station 1: Name the property","text":"Simplify `3(vec{a} - 2vec{b}) - 2(vec{a} + vec{b})`. Tap the property that justifies each line.","start":"`3(vec{a} - 2vec{b}) - 2(vec{a} + vec{b})`","chips":[{"id":"dv","t":"distributive over vectors"},{"id":"cm","t":"commutative"},{"id":"ds","t":"distributive over scalars"},{"id":"zo","t":"zero/opposite"}],"lines":[{"t":"`= 3vec{a} - 6vec{b} - 2vec{a} - 2vec{b}`","_a":"E1ASFQ==","good":"The 3 and the −2 multiply every vector in their brackets.","bad":"Two sets of brackets opened: a scalar multiplied a sum of vectors."},{"t":"`= 3vec{a} - 2vec{a} - 6vec{b} - 2vec{b}`","_a":"E1cJFQ==","good":"Only the order of the terms changed.","bad":"Nothing was multiplied or grouped; two terms swapped places."},{"t":"`= (3 - 2)vec{a} + (-6 - 2)vec{b}`","_a":"E1AXFQ==","good":"`3vec{a} - 2vec{a} = (3 - 2)vec{a}`: the scalars combine on one vector.","bad":"Here two scalars share one vector: `kvec{a} + mvec{a} = (k + m)vec{a}`."}],"last":"`= vec{a} - 8vec{b}`","lastNote":"Arithmetic on the scalars finishes it.","fig":"Grid with `vec{a}` = (2, 1) and `vec{b}` = (0, 1). The original expression (dashed, step by step) and `vec{a} - 8vec{b}` (solid) end at the same tip, (2, −7).","alg":["`vec{a}` = (2, 1) and `vec{b}` = (0, 1).","`3(vec{a} - 2vec{b})` = 3 × (2, −1) = (6, −3).","`2(vec{a} + vec{b})` = 2 × (2, 2) = (4, 4).","(6, −3) − (4, 4) = (2, −7).","`vec{a} - 8vec{b}` = (2, 1) − (0, 8) = (2, −7). Same tip ✓"],"done":"✓ All three lines named. Both expressions land on (2, −7)."},"st2":{"title":"Station 2: Solve for `vec{x}`","text":"`vec{a}` = (−2, 1) and `vec{b}` = (4, 3) are on the grid. Solve `2vec{x} + vec{a} = vec{b}` by choosing moves.","moves":[{"id":"sub","t":"Subtract `vec{a}` from both sides"},{"id":"half","t":"Multiply both sides by ½"},{"id":"div","t":"Divide both sides by `vec{a}`"}],"eqs":["`2vec{x} + vec{a} = vec{b}`","`2vec{x} = vec{b} - vec{a}`","`vec{x} = ½(vec{b} - vec{a})`"],"trap":"Division by a vector isn’t defined. Undo the addition first.","early":"Undo the addition first: subtract `vec{a}` from both sides, then deal with the 2.","again":"`vec{a}` is already gone from the left side. Now get `vec{x}` on its own.","good1":"✓ `2vec{x} = vec{b} - vec{a}` = (6, 2).","good2":"✓ `vec{x} = ½(vec{b} - vec{a})` = (3, 1). Check: `2vec{x} + vec{a}` drawn tip-to-tail lands on `vec{b}`’s tip.","reset":"Start again","fig":"Grid with `vec{a}` (blue) and `vec{b}` (teal) from the origin; the solution `vec{x}`, then `2vec{x} + vec{a}` tip-to-tail."},"st3":{"title":"Station 3: Vectors in a figure","text":"Parallelogram ABCD has `vec{AB} = vec{a}` and `vec{AD} = vec{b}`; M is the midpoint of CD. Build `vec{AM}` by tapping a route along the sides, starting at A.","at":"You’re at","go":"Go to","reset":"Clear route","route":"Route","done":"✓ You reached M.","empty":"Tap a corner to start walking from A.","fig":"Parallelogram ABCD with `vec{AB} = vec{a}` along the bottom and `vec{AD} = vec{b}` up the left side; M is the midpoint of CD."},"quickCheck":{"title":"Quick check","summary":"Simplify and solve quick check","items":[{"id":"q1","goal":4,"prompt":"Simplify `4(vec{a} + vec{b}) - 3(vec{a} - vec{b})`.","choices":[{"t":"`vec{a} - 7vec{b}`","fb":"`-3 × (-vec{b}) = +3vec{b}`, so the `vec{b}` terms add: `4vec{b} + 3vec{b}`.","_n":"14213","_k":"8dbb0bec"},{"t":"`vec{a} + vec{b}`","fb":"`-3(vec{a} - vec{b}) = -3vec{a}` \u003cstrong>+\u003c/strong> `3vec{b}`.","_n":"15203","_k":"03953d98"},{"t":"`7vec{a} + vec{b}`","fb":"`4vec{a} - 3vec{a} = vec{a}`, and `4vec{b} + 3vec{b} = 7vec{b}`.","_n":"161f3","_k":"1683229c"},{"t":"`vec{a} + 7vec{b}`","fb":"Right. `4vec{a} + 4vec{b} - 3vec{a} + y a non-zero number.","_n":"1k9b3","_k":"f4692059"},{"t":"`-(4vec{a} - vec{b}) = -4vec{a} + vec{b}`, giving `-2vec{a} - 5vec{b}`.","why":"The minus sign in front changes \u003cstrong>both\u003c/strong> signs, so `-(-vec{b}) = +vec{b}`.","_n":"1l943","_k":"cd214743"},{"t":"Combine to `-6vec{a}vec{b}`.","why":"Unlike vectors don’t multiply together.","_n":"1m953","_k":"3c996c74"},{"t":"`-(4vec{a} - vec{b}) = 4vec{a} - vec{b}`.","why":"The minus sign in front changes \u003cstrong>both\u003c/strong> signs.","_n":"1n0e3","_k":"f59eb0b4"}],"hints":["What does a minus sign in front of brackets do?","`-(4vec{a} - vec{b}) = -4vec{a} + vec{b}`.","`-2vec{a} - 5vec{b}`."]},{"id":"e2","goal":5,"task":"Solve `4vec{x} - vec{a} = 2(vec{x} + vec{b})`.","steps":["`4vec{x} - vec{a} = 2vec{x} + 2vec{b}`","`4vec{x} - 2vec{x} = 2vec{b} + vec{a}`","`2vec{x} = 2vec{b} + vec{a}`","`vec{x} = vec{b} + vec{a}`"],"_a":"Ag==","stepFb":["Step 1 distributes correctly.","Step 2 moves terms correctly, changing signs.","Step 3 is correct.",""],"fixes":[{"t":"`vec{x} = 2vec{b} + ½vec{a}`.","why":"Both terms must be halved.","_n":"1o0d3","_k":"4937d10c"},{"t":"Divide every term by 2: `vec{x} = vec{b} + ½vec{a}`.","why":"Multiplying both sides by ½ halves \u003cstrong>both\u003c/strong> terms (distributive).","_n":"1p103","_k":"d155b68b"},{"t":"`vec{x} = (2vec{b} + vec{a}) - 2`.","why":"You can’t subtract a number from a vector.","_n":"1q0f3","_k":"66837830"},{"t":"Step 4 is correct.","why":"Check: `2(vec{b} + vec{a}) = 2vec{b} + 2vec{a} ≠ 2vec{b} + vec{a}`.","_n":"1r0a3","_k":"e673b14c"}],"hints":["Multiply both sides by ½.","½ multiplies \u003cem>both\u003c/em> terms (distributive).","`vec{b} + ½vec{a}`."]},{"id":"e3","goal":6,"task":"`vec{u}` is 3 units east and `vec{v}` is 4 units north. Find `|vec{u} + vec{v}|` and `|vec{u} - vec{v}|`.","steps":["`vec{u}` and `vec{v}` are perpendicular, so `vec{u} + vec{v}` is the hypotenuse of a right triangle.","`|vec{u} + vec{v}| = √{3^2 + 4^2} = 5`.","`vec{u} - vec{v} = vec{u} + (-vec{v})`, and `-vec{v}` is 4 units south.","So `|vec{u} - vec{v}| = |vec{u}| - |vec{v}| = 3 - 4 = -1`, which means 1 unit."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"`vec{u}` and `-vec{v}` are also perpendicular: `|vec{u} - vec{v}| = √{3^2 + 4^2} = 5`.","why":"3 east and 4 south still make a right angle, so the length is 5.","_n":"1s093","_k":"491c59ca"},{"t":"`|vec{u} - vec{v}| = 3 + 4 = 7`.","why":"Lengths don’t add unless the arrows line up.","_n":"1t0c3","_k":"da1e8758"},{"t":"`|vec{u} - vec{v}| = -5`, the opposite of `|vec{u} + vec{v}|`.","why":"A length is never negative.","_n":"1u0b3","_k":"2ae4a670"},{"t":"Step 4 is correct once you drop the minus sign.","why":"Subtracting lengths is the same mistake as adding them.","_n":"1v163","_k":"4c2b0eac"}],"hints":["Draw `vec{u}` and `-vec{v}` tip-to-tail.","3 east and 4 south: still a right angle.","5."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which property surprised you most in the property tester: one that held, or one that broke?"},{"id":"j2","q":"In your own words, why is `k(vec{u} + vec{v}) = kvec{u} + kvec{v}` true? Use the word ‘triangle’."},{"id":"j3","q":"Explain to a friend how to solve `3vec{x} + vec{a} = vec{b}` and why you never divide by a vector."},{"id":"j4","q":"Which property or step still trips you up? What will you do about it?"}]},"final":{"intro":"Grid steps are written (right, up).","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A diagram shows `vec{u}` followed by `vec{v}`, and `vec{v}` followed by `vec{u}`, ending at the same point. Which property does it show?","options":[{"t":"Zero vector property","why":"Nothing cancels to `0⃗`.","_n":"1w153","_k":"3948fab6"},{"t":"Commutative property of addition","why":"The order of the two vectors swapped and the tip stayed the same.","_n":"1x083","_k":"d4725f68"},{"t":"Associative property","why":"Associative regroups three vectors; here the order of two swapped.","_n":"1y093","_k":"1342ea23"},{"t":"Distributive property","why":"No scalar is involved.","_n":"1z063","_k":"6129ef5f"}]},"b":{"prompt":"A diagram shows `(vec{u} + vec{v}) + vec{w}` and `vec{u} + (vec{v} + vec{w})` ending at the same point. Which property does it show?","options":[{"t":"Associative property of addition","why":"Only the grouping changed, and the tip stayed the same.","_n":"20073","_k":"2c077daa"},{"t":"Opposite vector property","why":"Nothing cancels.","_n":"210c3","_k":"3185a5f0"},{"t":"Commutative property","why":"The order stayed `vec{u}`, `vec{v}`, `vec{w}`; only the grouping changed.","_n":"220d3","_k":"70c12a7c"},{"t":"Distributive property","why":"No scalar is involved.","_n":"230a3","_k":"723a5a80"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Expand `-3(2vec{a} - vec{b})`.","options":[{"t":"`-6vec{a} + 3vec{b}`","why":"The −3 multiplies both terms: `-3 × 2vec{a} = -6vec{a}` and `-3 × (-vec{b}) = +3vec{b}`.","_n":"240b3","_k":"b275e09f"},{"t":"`6vec{a} + 3vec{b}`","why":"`-3 × 2vec{a} = -6vec{a}`.","_n":"25103","_k":"b4632e10"},{"t":"`-6vec{a} - 3vec{b}`","why":"`-3 × (-vec{b}) = +3vec{b}`.","_n":"26113","_k":"80b94116"},{"t":"`-6vec{a} - vec{b}`","why":"The −3 multiplies both terms.","_n":"279a4","_k":"1ac7968a"}]},"b":{"prompt":"Expand `-2(vec{a} - 4vec{b})`.","options":[{"t":"`-2vec{a} - 8vec{b}`","why":"`-2 × (-4vec{b}) = +8vec{b}`.","_n":"28994","_k":"1ac96d8d"},{"t":"`-2vec{a} + 8vec{b}`","why":"The −2 multiplies both terms: `-2 × (-4vec{b}) = +8vec{b}`.","_n":"29984","_k":"ef09d5c6"},{"t":"`-2vec{a} - 4vec{b}`","why":"The whole triangle is enlarged, so \u003cstrong>both\u003c/strong> sides are multiplied by `k`.","_n":"2a974","_k":"ca660976"},{"t":"`2vec{a} + 8vec{b}`","why":"`-2 × vec{a} = -2vec{a}`.","_n":"2b9e4","_k":"29a49b3f"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"`vec{u} - vec{v}` = (2, −5). What is `vec{v} - vec{u}`?","options":[{"t":"(−2, −5)","why":"Both steps reverse, not just one.","_n":"2c9d4","_k":"d9e1eb13"},{"t":"(−2, 5)","why":"`vec{v} - vec{u} = -(vec{u} - vec{v})`.","_n":"2d9c4","_k":"fc66c3a8"},{"t":"(5, −2)","why":"Reversing a vector doesn’t swap its steps.","_n":"2e9b4","_k":"2e755d87"},{"t":"(2, −5)","why":"Subtraction doesn’t commute.","_n":"2f924","_k":"7fef3324"}]},"b":{"prompt":"`vec{u} - vec{v}` is 6 units north. What is `vec{v} - vec{u}`?","options":[{"t":"6 units north","why":"`vec{u} - vec{v}` and `vec{v} - vec{u}` have the same length but opposite directions: `vec{u} - vec{v} = -(vec{v} - vec{u})`.","_n":"2g914","_k":"5d2d6b0a"},{"t":"`0⃗`","why":"They’re opposites, not equal; they’d cancel only if \u003cem>added\u003c/em>.","_n":"2h943","_k":"113fc02d"},{"t":"−6 units north","why":"A length can’t be −6; say the direction instead.","_n":"2i953","_k":"281d7949"},{"t":"6 units south","why":"`vec{v} - vec{u} = -(vec{u} - vec{v})`: same length, opposite direction.","_n":"2j963","_k":"39064436"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"Solve `5vec{x} + 3vec{a} = 2vec{x} - 3vec{b}`.","options":[{"t":"`vec{x} = vec{a} - vec{b}`","why":"Subtracting `3vec{a}` from both sides gives `-3vec{a}`.","_n":"2k973","_k":"361e85d5"},{"t":"`vec{x} = -vec{a} - vec{b}`","why":"`3vec{x} = -3vec{a} - 3vec{b}`.","_n":"2l983","_k":"1fbb8222"},{"t":"`vec{x} = -(3/7)(vec{a} + vec{b})`","why":"Subtract `2vec{x}` from both sides: `5vec{x} - 2vec{x} = 3vec{x}`.","_n":"2m993","_k":"17b1c479"},{"t":"`vec{x} = -vec{a} - 3vec{b}`","why":"Divide \u003cstrong>every\u003c/strong> term by 3.","_n":"2n9a3","_k":"ac0322c6"}]},"b":{"prompt":"Solve `6vec{x} - 2vec{b} = 2vec{x} + 4vec{a}`.","options":[{"t":"`vec{x} = ½vec{a} + ¼vec{b}`","why":"`6vec{x} - 2vec{x} = 4vec{x}`, not `8vec{x}`.","_n":"2o9b3","_k":"90710694"},{"t":"`vec{x} = vec{a} - ½vec{b}`","why":"Subtract `vec{a}` from both sides; the sign changes. There’s no division by a vector, only by a non-zero number.","_n":"2p8c3","_k":"9ecee721"},{"t":"`vec{x} = vec{a} + ½vec{b}`","why":"`4vec{x} = 4vec{a} + 2vec{b}`.","_n":"2q8d3","_k":"ca238148"},{"t":"`vec{x} = vec{a} + 2vec{b}`","why":"Divide every term by 4.","_n":"2r3f1","_k":"4bc47689"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"`|vec{u}| = 5` and `|vec{v}| = 3`, and `vec{v}` can point in any direction. Which value can `|vec{u} - vec{v}|` \u003cstrong>never\u003c/strong> take?","options":[{"t":"1","why":"`|vec{u} - vec{v}|` ranges from 5 − 3 = 2 to 5 + 3 = 8.","_n":"2s401","_k":"0b8b4504"},{"t":"2","why":"When `vec{v}` points the same way as `vec{u}`, `|vec{u} - vec{v}| = 2`.","_n":"2t411","_k":"88eeacc5"},{"t":"5","why":"Possible: somewhere between the two extremes it passes 5.","_n":"2u421","_k":"28f80f4b"},{"t":"8","why":"Subtraction can make it longer: if `vec{v}` is opposite `vec{u}`, `|vec{u} - vec{v}| = 8`.","_n":"2v431","_k":"1a427595"}]},"b":{"prompt":"`|vec{u}| = 6` and `|vec{v}| = 2`. Which value can `|vec{u} + vec{v}|` \u003cstrong>never\u003c/strong> take?","options":[{"t":"3","why":"The range is 6 − 2 = 4 to 6 + 2 = 8.","_n":"2w441","_k":"223508d4"},{"t":"4","why":"Opposite directions give 4.","_n":"2x451","_k":"8ec7fcfd"},{"t":"6","why":"Possible, between 4 and 8.","_n":"2y461","_k":"875f7e53"},{"t":"8","why":"Same direction gives 8.","_n":"2z471","_k":"29942a4d"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"In triangle ABC, `vec{AB} = vec{a}` and `vec{AC} = vec{b}`, and M is the midpoint of BC. Express `vec{AM}`.","options":[{"t":"`½(vec{b} - vec{a})`","why":"That’s `vec{BM}`; start from A.","_n":"30481","_k":"67b5293f"},{"t":"`vec{a} + ½vec{b}`","why":"`vec{BM}` is half of `vec{BC} = vec{b} - vec{a}`, not half of `vec{b}`.","_n":"31452","_k":"011b137e"},{"t":"`½vec{a} + ½vec{b}`","why":"`vec{AM} = vec{a} + ½(vec{b} - vec{a})`.","_n":"32442","_k":"727ec2d7"},{"t":"`vec{a} + vec{b}`","why":"That’s the parallelogram’s diagonal, twice `vec{AM}`.","_n":"33432","_k":"81aed692"}]},"b":{"prompt":"In triangle PQR, `vec{PQ} = vec{a}` and `vec{PR} = vec{b}`. N is on QR with QN = ⅓ QR. Express `vec{PN}`.","options":[{"t":"`vec{a} + ⅓vec{b}`","why":"`vec{QN} = ⅓vec{QR} = ⅓(vec{b} - vec{a})`.","_n":"34422","_k":"9009871c"},{"t":"`⅔vec{a} + ⅓vec{b}`","why":"`vec{PN} = vec{a} + ⅓(vec{b} - vec{a})`.","_n":"35492","_k":"04dcdde9"},{"t":"`⅓vec{a} + ⅔vec{b}`","why":"That measures ⅓ from R, not from Q.","_n":"36482","_k":"4122a50c"},{"t":"`⅓(vec{b} - vec{a})`","why":"That’s `vec{QN}`; start from P.","_n":"37472","_k":"316e7b02"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why vector subtraction is not commutative?","options":[{"t":"“Because `vec{u} - vec{v}` is always shorter than `vec{v} - vec{u}`.”","why":"They’re the same length.","_n":"38462","_k":"3d565214"},{"t":"“It is commutative, because both have the same magnitude.”","why":"Equal vectors need equal direction too.","_n":"394d2","_k":"3ebaaf43"},{"t":"“Because subtraction isn’t defined for vectors.”","why":"It is: `vec{u} + (-vec{v})`.","_n":"3a4c2","_k":"75d84e28"},{"t":"“`vec{u} - vec{v}` and `vec{v} - vec{u}` have the same length but opposite directions, so they’re equal only when `vec{u} - vec{v} = 0⃗`, that is, when `vec{u} = vec{v}`.”","why":"`vec{u} - vec{v}` and `vec{v} - vec{u}` have the same length but opposite directions: `vec{u} - vec{v} = -(vec{v} - vec{u})`.","_n":"3b4b2","_k":"71d14c35"}]},"b":{"prompt":"Which is the best explanation of why `(vec{u} - vec{v}) - vec{w} ≠ vec{u} - (vec{v} - vec{w})` in general?","options":[{"t":"“They differ because the order of `vec{u}` and `vec{v}` changed.”","why":"The order didn’t change.","_n":"3c4c2","_k":"28fc63f2"},{"t":"“The first is `vec{u} - vec{v} - vec{w}` and the second is `vec{u} - vec{v} + vec{w}`; they differ by `2vec{w}`, so they’re equal only when `vec{w} = 0⃗`.”","why":"Removing the brackets flips the sign of `vec{w}` in the second expression.","_n":"3d492","_k":"18af2678"},{"t":"“Brackets never matter with vectors.”","why":"They matter for subtraction.","_n":"3e4a2","_k":"3c98c52e"},{"t":"“They differ by `vec{w}`.”","why":"The sign of `vec{w}` flips, so the gap is `2vec{w}`.","_n":"3f472","_k":"81b87fff"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which description shows why `2(vec{u} + vec{v}) = 2vec{u} + 2vec{v}`?","options":[{"t":"“The triangle with sides `vec{u}`, `vec{v}` and `vec{u} + vec{v}` is enlarged by a factor of 2. The new sides `2vec{u}`, `2vec{v}` and `2(vec{u} + vec{v})` still close a triangle, so `2vec{u} + 2vec{v} = 2(vec{u} + vec{v})`.”","why":"An enlarged triangle stays a triangle with parallel sides.","_n":"3g482","_k":"9d9750fe"},{"t":"“Each vector moves 2 units, so their sum moves 2 units.”","why":"Scaling isn’t moving.","_n":"3h452","_k":"37cebcab"},{"t":"“Doubling `vec{u}` alone doubles `vec{u} + vec{v}`.”","why":"The whole triangle is enlarged, so \u003cstrong>both\u003c/strong> sides are multiplied by `k`.","_n":"3i462","_k":"e1c4b791"},{"t":"“The parallelogram on `vec{u}` and `vec{v}` turns through twice its angle.”","why":"Scaling by 2 doesn’t rotate anything.","_n":"3j532","_k":"4e3e2d4c"}]},"b":{"prompt":"Which description shows why `2vec{u} + 3vec{u} = 5vec{u}`?","options":[{"t":"“`|2vec{u} + 3vec{u}| = 2 + 3 = 5`, so it equals `5vec{u}`.”","why":"The length is `5|vec{u}|`, and direction matters too.","_n":"3k542","_k":"a7831fd6"},{"t":"“`2vec{u}` and `3vec{u}` point the same way along one line; placed tip-to-tail they make an arrow 5 times as long as `vec{u}` in the same direction, which is `5vec{u}`.”","why":"Collinear arrows add along the line.","_n":"3l512","_k":"b7b7d457"},{"t":"“The scalars multiply, so the result is `6vec{u}`.”","why":"Scalars add here: `(2 + 3)vec{u}`.","_n":"3m502","_k":"ec06d460"},{"t":"“`2vec{u}` and `3vec{u}` form a parallelogram whose diagonal is `5vec{u}`.”","why":"Collinear arrows don’t make a parallelogram.","_n":"3n532","_k":"b000c948"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"Two hikers start at the same cairn. Hiker 1 walks `vec{p}`, then `vec{q}`, then `vec{r}`. Hiker 2 walks `vec{r}`, then `vec{p}`. Whi
