.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 07: V5 derivative panels (hero, slope tracker, stations, sketch builds, task), sketch sign chips, gallery, thumbnails */
canvas.plot.dp-top{aspect-ratio:16/10}
canvas.plot.dp-low{aspect-ratio:16/8}
.dp-panels .dp-panel + .dp-panel,.dp-hero canvas + canvas{margin-top:6px}
.dp-ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.dp-main,.dp-side{min-width:0}
.dx-key{margin:6px 0 0}
.dx-fns{margin-bottom:6px}
.dx-fns .chip{font-size:.86rem}
.dx-fns .chip .m{font-size:1.05em}
.dx-how{margin:8px 0 10px}
.dx-sl{margin-top:4px}
.dx-sl output{color:var(--ink)}
#dx-tools{margin:4px 0 14px}
#dx-tools .seg-wrap{margin-top:4px}
.dx-tbl .tbl-wrap{max-height:13rem;overflow-y:auto;margin-top:10px}
.dx-tbl table.vt td,.dx-tbl table.vt th{padding:3px 12px}
.dx-note{color:var(--red);margin:6px 0 0}
.dx-more{display:none;margin-top:6px}
.dp-signs{display:flex;flex-wrap:wrap;gap:6px}
.dp-sg{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:72px;min-height:44px;border:2px solid var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:6px;padding:.25em .5em;font-size:.8rem;font-weight:700;white-space:nowrap}
.dp-sg b{font:700 1.3rem/1 var(--font-math);color:var(--ink)}
.dp-sg.on{border-color:var(--f3);background:var(--hi-soft);color:var(--ink)}
.dp-sg:not(:disabled):hover{border-color:var(--pen)}
.p3-st h3{margin-top:0}
.p3-st:first-child{margin-top:0;padding-top:0;border-top:0}
.g1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 20px}
.g1-col{min-width:0}
.g1-col h4{margin:0 0 6px;color:var(--ink-2);font-size:.85rem}
.g1-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.g1-th{position:relative;display:block;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:4px;min-width:0}
.g1-th canvas.plot{border:0;aspect-ratio:4/3}
.g1-th[aria-pressed="true"]{border-color:var(--ink);background:var(--hi)}
.g1-th.done{border-color:var(--green)}
.g1-th:not(:disabled):hover{border-color:var(--pen)}
.g1-tag{position:absolute;top:6px;left:8px;z-index:1;font:700 .85rem var(--font-ui);background:var(--sheet);border:1.5px solid var(--ink-2);border-radius:999px;padding:0 .45em;color:var(--ink)}
.g1-check{margin-top:14px}
.g1-check h4{margin:0 0 2px}
.g1-pan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mitem canvas.plot.dp-thumb{display:block;width:100%;max-width:240px;aspect-ratio:4/3;margin:0 auto}
[data-act-id="pairs"] .match-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
[data-act-id="pairs"] .match-col h4{grid-column:1/-1}
[data-act-id="pairs"] .mitem{flex-direction:column;align-items:stretch;padding:.35em .4em}
.mitem > span:last-child{flex:1 1 auto}
.sk-q{margin:4px 0 10px}
.sk-fb{margin-top:8px}
.tk-step{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.tk-lab{min-width:1.5em;font-size:1.2rem}
.tk-val{min-width:2.2em;text-align:center;font:600 1.35rem var(--font-math)}
.tk-step .btn{min-width:40px;font-size:1.1rem}
.tk-eq{font-size:clamp(1.2rem,3.4vw,1.6rem);margin:12px 0 4px}
@media (max-width:820px){
  .dp-ex{grid-template-columns:minmax(0,1fr)}
  .g1-pan{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .dp-ex canvas.plot.dp-top,.dp-ex canvas.plot.dp-low{aspect-ratio:auto;height:220px}
  .dx-read:not(.dx-all) .dx-x2{display:none}
  .dx-more{display:inline-flex}
  .g1{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .g1-grid{grid-template-columns:minmax(0,1fr)}
  [data-act-id="pairs"] .match{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  [data-act-id="pairs"] .match-col{grid-template-columns:minmax(0,1fr)}
}

,"title":"Cartesian Equation of a Line in R²","kind":"topic","group":"8"},{"nn":"50","slug":"equations-of-lines-in-r3","title":"Vector, Parametric and Symmetric Equations of Lines in R³","kind":"topic","group":"8"},{"nn":"51","slug":"vector-equation-of-a-plane","title":"Vector Equation of a Plane","kind":"topic","group":"8"},{"nn":"52","slug":"cartesian-equation-of-a-plane","title":"Cartesian Equation of a Plane","kind":"topic","group":"8"},{"nn":"53","slug":"intersection-of-lines-with-planes","title":"Intersection of Lines with Planes","kind":"topic","group":"9"},{"nn":"54","slug":"intersection-of-lines","title":"Intersection of Lines in R² and R³","kind":"topic","group":"9"},{"nn":"55","slug":"systems-of-equations-matrices","title":"Systems of Equations (Matrices)","kind":"topic","group":"9"},{"nn":"56","slug":"intersection-of-two-planes","title":"Intersection of Two Planes","kind":"topic","group":"9"},{"nn":"57","slug":"intersection-of-three-planes","title":"Intersection of Three Planes","kind":"topic","group":"9"},{"nn":"58","slug":"distance-point-to-line","title":"Distance from a Point to a Line in R² and R³","kind":"topic","group":"9"},{"nn":"59","slug":"distance-point-to-plane","title":"Distance from a Point to a Plane","kind":"topic","group":"9"}]},"salt":"84f1d8af","content":{"id":"07-sketching-derivative-functions","kind":"topic","title":"Sketching derivative functions","topic":"Sketching Derivative Functions","readyTopic":"sketching derivative functions","hero":{"eq":"`f′(x)` = slope of the tangent to `y = f(x)` at `x`","eqLabel":"f prime of x equals the slope of the tangent to y equals f of x at x","eqSize":"sm","headline":"Every point has a slope. Plot the slopes.","text":"Slide a tangent line along a curve and write down its slope at every `x`. Those slopes form a new function, the \u003cstrong>derivative\u003c/strong>, written \u003cstrong>`f′(x)`\u003c/strong> or \u003cstrong>\u003cspan class=\"m\">d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003c/span>\u003c/strong>. It’s positive where `f` rises, negative where `f` falls, and \u003cstrong>zero\u003c/strong> at every turning point.","fig":{"html":"\u003cdiv class=\"dp-hero\">\u003ccanvas class=\"plot dp-top\" id=\"hero-plot\" role=\"img\" aria-label=\"Top panel: the parabola y = (x − 2)² − 3 with a tangent line touching it at x = −0.5.\">\u003c/canvas>\u003ccanvas class=\"plot dp-low\" id=\"hero-d\" role=\"img\" aria-label=\"Bottom panel: the slope of the tangent plotted against x.\">\u003c/canvas>\u003c/div>"}},"goals":["I can explain that `f′(x)` is the slope of the tangent to `y = f(x)` at `x`, and use the notations `f′(x)` and \u003cspan class=\"m\">d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003c/span>.","I can build a table of tangent slopes and graph it to get the derivative.","I can find the intervals where `f′` is positive, negative or zero from the graph of `f`.","I can sketch the graph of `f′` from the graph of `f`, including the effect of translations.","I can connect the type of function to its derivative: linear → constant, quadratic → linear, cubic → quadratic.","I can recognize a point of inflection of `f` as a maximum or minimum of `f′`."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Slope of a line","goal":1,"prompt":"What is the slope of the line through (1, 3) and (4, 9)?","options":[{"t":"1/2","why":"That’s run over rise. Slope is rise ÷ run.","_n":"0914","_k":"955da57f"},{"t":"2","why":"Rise 6 over run 3.","_n":"1904","_k":"02486038"},{"t":"3","why":"That uses the run alone. Divide the rise by the run.","_n":"28f4","_k":"0e6d8975"},{"t":"6","why":"That uses the rise alone: 6 ÷ 3.","_n":"38e4","_k":"dc279e4f"}],"hints":["Slope = `Δy/Δx`.","`Δy = 6`, `Δx = 3`.","2."]},{"id":"w2","skill":"Slope of a line","goal":1,"prompt":"A line is horizontal. What is its slope?","options":[{"t":"1","why":"Slope 1 rises at 45°.","_n":"48d4","_k":"012e0851"},{"t":"0","why":"No rise for any run.","_n":"58c4","_k":"a490379c"},{"t":"Undefined","why":"That mixes up horizontal and vertical. A vertical line has an undefined slope.","_n":"68b4","_k":"977a0805"},{"t":"It depends on how high the line is","why":"Height doesn’t affect slope.","_n":"79a4","_k":"351c2920"}],"hints":["What is the rise along a horizontal line?","0.","0 ÷ run = 0."]},{"id":"w3","skill":"Tangent slopes","goal":2,"prompt":"Secants through P(5, 25) on `y = x^2` have slopes 11, 10.1, 10.01, 10.001 as `h` = 1, 0.1, 0.01, 0.001. What is the slope of the tangent at P?","options":[{"t":"10","why":"The secant slopes approach 10.","_n":"8994","_k":"0b7894ac"},{"t":"10.001","why":"That stops at the last row. The tangent slope is the value they approach.","_n":"9307","_k":"6b817960"},{"t":"11","why":"That’s the widest secant. Look at the trend as `h` shrinks.","_n":"a317","_k":"0b716e79"},{"t":"25","why":"25 is the `y`-value, not the slope.","_n":"b2e7","_k":"6163f535"}],"hints":["What value are the slopes approaching?","11, 10.1, 10.01, …","10."]},{"id":"w4","skill":"Tangent slopes","goal":3,"prompt":"A smooth curve has a local maximum at (2, 5). What is the slope of its tangent there?","options":[{"t":"0","why":"The tangent at a smooth turning point is horizontal.","_n":"c2f7","_k":"980c17ec"},{"t":"2","why":"2 is the `x`-value of the point, not the slope.","_n":"d347","_k":"6962bec1"},{"t":"Undefined","why":"The tangent is horizontal, so its slope is 0.","_n":"e357","_k":"2a172b19"},{"t":"5","why":"5 is the height of the point. A slope records how steep the curve is, not how high it is.","_n":"f327","_k":"f1ed4441"}],"hints":["Picture the tangent at the top of a hill.","It’s flat.","0."]},{"id":"w5","skill":"Increasing and decreasing","goal":3,"prompt":"On which interval is `y = (x - 1)^2` decreasing?","options":[{"t":"Where `y \u003c 0`","why":"`(x - 1)^2` is never negative, but it does fall.","_n":"g337","_k":"2b94df91"},{"t":"`(1, ∞)`","why":"That’s reversed. To the right of the vertex, it rises.","_n":"h387","_k":"43e37581"},{"t":"`(0, 1)`","why":"That starts at the `y`-axis. It’s decreasing for every `x \u003c 1`.","_n":"i397","_k":"5d47f969"},{"t":"`(-∞, 1)`","why":"The parabola falls until its vertex at `x = 1`.","_n":"j4a7","_k":"2caa1d90"}],"hints":["Where is the vertex?","At `x = 1`; the parabola opens up.","Falls on `(-∞, 1)`."]},{"id":"w6","skill":"Increasing and decreasing","goal":3,"prompt":"A function is increasing on an interval. What can you say about its tangent slopes there?","options":[{"t":"They’re negative","why":"That’s reversed: a rising tangent goes up to the right, so its slope is positive.","_n":"k497","_k":"b800191a"},{"t":"They’re positive","why":"Rising tangents have positive slopes.","_n":"l487","_k":"db849963"},{"t":"They’re increasing","why":"That mixes up “rising” with “getting steeper”. A curve can rise while its slope shrinks.","_n":"m477","_k":"931f5e5a"},{"t":"They’re zero","why":"Zero slope is flat.","_n":"n467","_k":"5a7f5aac"}],"hints":["Picture a tangent on a rising curve.","It goes up to the right.","Positive."]}],"refreshers":{"Slope of a line":"Slope = rise ÷ run = `Δy/Δx`. Horizontal lines have slope 0; lines rising to the right have positive slopes.","Tangent slopes":"The tangent slope at P is the value the secant slopes approach as Q slides toward P (module 02). At a smooth turning point the tangent is horizontal, so its slope is 0.","Increasing and decreasing":"`f` is increasing on an interval if it rises left to right there. Use open intervals of `x`, such as `(-∞, 1)`."}}},"explore":{"heading":"Slope tracker","intro":"Drag the point of tangency along the curve. Its slope is plotted on the lower panel. Leave a trail and watch the derivative appear.","fns":[{"id":"F1","chip":"`-x/2 + 3`","eq":"`f(x) = -{x}/{2} + 3`"},{"id":"F2","chip":"`(x - 2)^2 - 3`","eq":"`f(x) = (x - 2)^2 - 3`"},{"id":"F3","chip":"`x^3 - 3x`","eq":"`f(x) = x^3 - 3x`"},{"id":"F4","chip":"`x^4/4 - 2x^2`","eq":"`f(x) = {x^4}/{4} - 2x^2`"},{"id":"F5","chip":"`|x - 1|`","eq":"`f(x) = |x - 1|`"},{"id":"F6","chip":"Mystery curve","eq":"Mystery curve \u003cspan class=\"tiny muted\">(shown only as a graph)\u003c/span>"}],"modes":[{"id":"trail","t":"Trail"},{"id":"table","t":"Table"},{"id":"sketch","t":"Sketch"}],"modeHow":{"trail":"As the point moves, the lower panel plots (`x`, slope) and leaves a teal trail.","table":"\u003cstrong>Record slope\u003c/strong> adds a row (`x`, slope) to the table and a dot to the lower panel. \u003cstrong>Join the dots\u003c/strong> draws a smooth curve through them.","sketch":"Place the features of `f′` on the lower panel: tap the `x`-axis for a zero (or press Enter at the probe), mark the sign on each interval, and tap where `f′` has its peak or valley. \u003cstrong>Reveal\u003c/strong> overlays the true `f′`."},"values":["−1","−4","−9","0"],"predIntro":"Make a prediction first. Then the slope tracker traces the trail so you can see what really happens.","predictions":[{"id":"p1","fn":"F2","prompt":"F2 `f(x) = (x - 2)^2 - 3`, Trail mode. Before tracing, where will the trail on the lower panel cross the `x`-axis?","options":[{"t":"At `f`’s `x`-intercepts, `x = 2 ± √3`","_n":"o457","_k":"dc1d6672"},{"t":"At `x = 2`, below the vertex","_n":"p447","_k":"394dcb63"},{"t":"At `x = -3`, the minimum value","_n":"q437","_k":"935913c2"},{"t":"It never crosses","_n":"r427","_k":"11051714"}],"explain":"The trail crosses 0 exactly as the tangent goes flat at the vertex. `f′ = 0` where the tangent is horizontal. `f`’s `x`-intercepts are where its \u003cstrong>height\u003c/strong> is 0, not its slope."},{"id":"p2","fn":"F2","prompt":"F2 `f(x) = (x - 2)^2 - 3`, Trail mode. What shape will the trail of slopes make?","options":[{"t":"A parabola","_n":"s417","_k":"bca316ca"},{"t":"A horizontal line","_n":"t447","_k":"0bae5294"},{"t":"A V shape","_n":"u457","_k":"70a0bb9c"},{"t":"A straight line","_n":"v467","_k":"fdd5bdd7"}],"explain":"A straight line with slope 2. Slopes on a parabola change at a steady rate, so they form a line. The derivative of a quadratic is linear."},{"id":"p3","fn":"F3","prompt":"F3, Trail mode. For `f(x) = x^3 - 3x`, where will the trail be lowest?","options":[{"t":"At `x = 0`, where `f` falls most steeply","_n":"w477","_k":"99217067"},{"t":"At `x = 1`, `f`’s local minimum","_n":"x407","_k":"285f257c"},{"t":"At `x = √3`, where `f` crosses the axis","_n":"y417","_k":"f74eca64"},{"t":"At `x = -1`, `f`’s local maximum","_n":"z427","_k":"c36844ac"}],"explain":"The trail bottoms out at (0, −3). At `x = 0` the curve changes from bending down to bending up, and the tangent cuts through it. At `x = 1` the slope is 0. It’s most negative at `x = 0`, the steepest point, which is a point of inflection."},{"id":"p4","fn":"F5","prompt":"F5 `f(x) = |x - 1|`, Trail mode. What happens to the trail at `x = 1`?","options":[{"t":"It jumps from −1 to 1, with no value at `x = 1`","_n":"10437","_k":"f0ed8ce5"},{"t":"It passes smoothly through 0","_n":"113c7","_k":"0ea019c6"},{"t":"It goes to infinity","_n":"123d7","_k":"a8ca535e"},{"t":"It’s 0 at `x = 1`","_n":"13be7","_k":"f3c21d45"}],"explain":"Two horizontal pieces, with open circles at (1, −1) and (1, 1). Left of the corner every slope is −1, and right of it every slope is 1. At the corner there’s no single tangent."}],"chalIntro":"Use the slope tracker to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"F3: move the point of tangency to a place where the tangent’s slope is 9.","why":"The slope row reads 9: at `x = 2` the slope is 3(4) − 3 = 9, and by symmetry `x = -2` works too.","hints":["Watch the slope readout, not `f(x)`.","The slope is 0 at ±1 and grows quickly beyond.","At `x = 2` the slope is 3(4) − 3 = 9; by symmetry `x = -2` works too."],"msgs":{"fn":"Choose F3 first.","x3":"Slope 24: too steep. Come back toward the middle.","height":"That’s where the \u003cstrong>height\u003c/strong> is 9. Watch the slope row.","other":"The slope here is {m}. Watch the slope row and keep moving."}},{"id":"tc2","goal":[3,4],"prompt":"F4, Sketch: place the zeros of `f′` and the sign of `f′` on each interval.","why":"`f` falls, rises, falls, rises, with horizontal tangents at −2, 0 and 2: `f′` is −, +, −, + on `(-∞, -2)`, `(-2, 0)`, `(0, 2)`, `(2, ∞)`.","hints":["`f′ = 0` where the tangent is flat.","`f` has turning points at −2, 0 and 2.","Falls, rises, falls, rises: −, +, −, +."],"msgs":{"fn":"Choose F4 and Sketch mode, then place the zeros and the signs on the lower panel.","xint":"Those are where `f = 0`. Look for horizontal tangents.","zeros":"Look for every point where the tangent is flat: `f′ = 0` there.","fromf":"`f` can be below the axis and rising.","reversed":"Left of −2, `f` is falling.","missing":"Mark the sign of `f′` on every interval.","signs":"Check each interval: is `f` rising (+) or falling (−) there?"}},{"id":"tc3","goal":[4,6],"stretch":true,"prompt":"F6, the mystery curve, shown only as a graph: a local maximum at `x = -3` and a local minimum at `x = 1`. In Sketch mode, tap the `x`-value where `f′` is lowest and choose its approximate value.","why":"`f′` is lowest where `f` falls most steeply: at `x = -1`, midway between the turning points, the slope is −4.","hints":["`f′` is lowest where `f` falls most steeply.","`f` falls from `x = -3` to `x = 1`. The steepest point is where it stops bending down and starts bending up, midway for a cubic.","`x = -1`; drag the tangent there: slope −4."],"msgs":{"fn":"Choose F6 and Sketch mode, pick the \u003cstrong>Peak or valley\u003c/strong> tool, and tap the lower panel where `f′` is lowest.","x1":"That’s `f`’s lowest point, where the slope is 0.","x3":"`f′ = 0` there.","xother":"`f′` is lowest where `f` falls most steeply.","noval":"Now choose the approximate value of `f′` there.","v0":"`f` is falling at `x = -1`, so `f′ \u003c 0`.","v9":"Check with the tangent: the slope at `x = -1` is about −4."}}]},"part3":{"slug":"match","name":"Graph ↔ derivative","heading":"Graph ↔ derivative","intro":"Work in both directions. Pair graphs with their derivatives, shift a graph and watch what its derivative does, then hunt for the steepest point. Then try the quick check.","stations":[{"id":"st1","title":"Station 1: Matching gallery","text":"Tap a graph of `f`, then tap the graph of `f′` you think belongs to it. \u003cstrong>Check it with slopes\u003c/strong> draws three tangents on `f` at marked `x`-values and plots their slopes as dots on the `f′` you chose.","good":"All three slope dots land on this graph of `f′`.","bad":"The slope dots miss this graph. Try another `f′`.","done":"Every pair is matched."},{"id":"st2","title":"Station 2: Translations","text":"`g(x) = f(x - @d{d}) + @c{c}`, where `f(x) = x^3 - 3x`. Move the sliders. The lower panel shows `f′` (grey dashes) and `g′` (long dashes)."},{"id":"st3","title":"Station 3: Inflection finder","text":"Tap where `f` is steepest, the point where `f′` has a maximum or minimum. Drag the tangent, or move it with the arrow keys and press \u003cstrong>Mark this point\u003c/strong>.","rounds":[{"name":"Graph 1","prompt":"Graph 1: tap where `f` falls most steeply.","why":"At (1, 1) `f` falls most steeply, with slope −3. The curve switches from bending down to bending up there, and the tangent crosses the curve: a point of inflection, at the valley of `f′`."},{"name":"Graph 2","prompt":"Graph 2: tap where `f` rises most steeply.","why":"At (0, 0) the slope is 3, its greatest value. The curve switches from bending up to bending down there: a point of inflection, at the peak of `f′`."},{"name":"Graph 3","prompt":"Graph 3 models a population. Tap where it grows fastest.","why":"At (1, 2) the growth is fastest, with slope 2. Before it the curve bends up; after it, it bends down: a point of inflection, at the peak of `f′`."}],"wrong":"Not the steepest point: the slope at {x} is {m}. Find where the tangent is steepest."}],"quickCheck":{"title":"Quick check","summary":"Graph ↔ derivative quick check","items":[{"id":"q1","goal":[4,5],"prompt":"`f` is a parabola opening down with vertex (1, 6). `f′` is…","choices":[{"t":"A line with positive slope, crossing 0 at `x = 1`","fb":"`f` rises then falls: `f′` goes from + to −.","_n":"14bd7","_k":"9e6bd8f3"},{"t":"A parabola","fb":"`f` rises then falls: `f′` goes from + to −.","_n":"15c07","_k":"a5ee70c5"},{"t":"A line with negative slope, crossing 0 at `x = 1`","fb":"Right. `f` rises then falls: `f′` goes from + to −.","_n":"16bf7","_k":"7caed698"},{"t":"A constant 6","fb":"`f` rises then falls: `f′` goes from + to −.","_n":"17c27","_k":"b2602851"}]},{"id":"q2","goal":4,"prompt":"`g(x) = f(x) - 4`. `g′` is…","choices":[{"t":"`f′ - 4x`","fb":"Shifting down doesn’t change any slope.","_n":"18c17","_k":"1448d6a1"},{"t":"`f′` shifted down 4","fb":"Shifting down doesn’t change any slope.","_n":"19c47","_k":"9af7cf5d"},{"t":"`4f′`","fb":"Shifting down doesn’t change any slope.","_n":"1ac37","_k":"959e15d6"},{"t":"The same as `f′`","fb":"Right. Shifting down doesn’t change any slope.","_n":"1bb67","_k":"8b35be9c"}]},{"id":"q3","goal":6,"prompt":"`f′` has a maximum at `x = 3`. At `x = 3`, `f`…","choices":[{"t":"Is steepest uphill: a point of inflection","fb":"Right. `f′` is largest where `f` is steepest.","_n":"1cb57","_k":"50b44fb2"},{"t":"Crosses the `x`-axis","fb":"`f′` is largest where `f` is steepest.","_n":"1db87","_k":"142c6d97"},{"t":"Has a horizontal tangent","fb":"`f′` is largest where `f` is steepest.","_n":"1eb97","_k":"bb4cb953"},{"t":"Has a local maximum","fb":"`f′` is largest where `f` is steepest.","_n":"1fb67","_k":"d1fb920b"}]},{"id":"q4","goal":5,"prompt":"`f` is a cubic. `f′` is…","choices":[{"t":"A quadratic","fb":"Right. One degree lower.","_n":"1gb77","_k":"442a7944"},{"t":"A line","fb":"One degree lower.","_n":"1hb47","_k":"9a5021af"},{"t":"A cubic","fb":"One degree lower.","_n":"1ib57","_k":"67e5c9b3"},{"t":"A constant","fb":"One degree lower.","_n":"1jb27","_k":"331c2c2b"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Match `f` to `f′`","summary":"Match f to f′","goal":[4,5],"instruction":"Each graph on the left is a function `f`. Find the graph of its derivative `f′` on the right.","how":"Tap a graph of `f`, then tap its derivative on the right.","leftTitle":"`f`","rightTitle":"`f′`","left":[{"id":"l1","goal":5,"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m1\" role=\"img\" aria-label=\"Graph 1: a rising line through (0, 1) and (1, 3)\">\u003c/canvas>","why":"A line has the same slope everywhere: `f′` is the horizontal line at 2."},{"id":"l2","goal":5,"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m2\" role=\"img\" aria-label=\"Graph 2: a horizontal line at height 5\">\u003c/canvas>","why":"A horizontal graph has slope 0 everywhere: `f′` is the `x`-axis."},{"id":"l3","goal":[4,5],"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m3\" role=\"img\" aria-label=\"Graph 3: a parabola opening up with vertex (0, 0)\">\u003c/canvas>","why":"It falls, turns at 0, then rises: `f′` is a line through the origin with slope 2."},{"id":"l4","goal":[4,5],"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m4\" role=\"img\" aria-label=\"Graph 4: a parabola opening down with vertex (0, 4)\">\u003c/canvas>","why":"It rises, turns at 0, then falls: `f′` is a line through the origin with slope −2."},{"id":"l5","goal":4,"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m5\" role=\"img\" aria-label=\"Graph 5: a parabola opening up with vertex (1, 0)\">\u003c/canvas>","why":"The vertex moved right to `x = 1`, so `f′` crosses 0 at `x = 1`, with slope 2."},{"id":"l6","goal":[4,5],"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m6\" role=\"img\" aria-label=\"Graph 6: a cubic that rises everywhere, flattening for a moment at the origin\">\u003c/canvas>","why":"`x^3` never falls and is flat only at 0: `f′` is a parabola touching 0 at the origin, never negative.","hints":["Is `x^3` ever decreasing?","No; it flattens at 0 for a moment.","So `f′ ≥ 0` and touches 0 at the origin."]},{"id":"l7","goal":[4,5],"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m7\" role=\"img\" aria-label=\"Graph 7: a cubic with a local maximum at x = −1 and a local minimum at x = 1\">\u003c/canvas>","why":"Turning points at −1 and 1, falling between them: `f′` is an upward parabola with zeros at ±1."},{"id":"l8","goal":4,"t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"m8\" role=\"img\" aria-label=\"Graph 8: a V shape with its corner at the origin\">\u003c/canvas>","why":"Slope −1 on the left, 1 on the right, and no value at the corner: open circles at 0.","hints":["What is the slope of each straight piece?","−1 on the left, 1 on the right.","At 0 there’s a corner, so no value there."]}],"right":[{"id":"r1","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d1\" role=\"img\" aria-label=\"Horizontal line at 2\">\u003c/canvas>"},{"id":"r2","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d2\" role=\"img\" aria-label=\"The x-axis: 0 everywhere\">\u003c/canvas>"},{"id":"r3","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d3\" role=\"img\" aria-label=\"Line through the origin with slope 2\">\u003c/canvas>"},{"id":"r4","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d4\" role=\"img\" aria-label=\"Line through the origin with slope −2\">\u003c/canvas>"},{"id":"r5","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d5\" role=\"img\" aria-label=\"Line crossing the x-axis at x = 1 with slope 2\">\u003c/canvas>"},{"id":"r6","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d6\" role=\"img\" aria-label=\"Parabola touching 0 at the origin, never negative\">\u003c/canvas>"},{"id":"r7","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d7\" role=\"img\" aria-label=\"Upward parabola with zeros at −1 and 1\">\u003c/canvas>"},{"id":"r8","t":"\u003ccanvas class=\"plot dp-thumb\" data-fig=\"d8\" role=\"img\" aria-label=\"−1 for x \u003c 0 and 1 for x > 0, with open circles at x = 0\">\u003c/canvas>"}],"_a":"QxYKAEYCQxQJFkoTCApDXBpGVBNIGg1VGg5EQ1caTURUAEQLRkpVRBQWCgRGAkMUDRZKEwgOQ1waRlATSBoNURoORENTGk1EVAxEC0ZKWURF","wrong":{"l4|r3":"`f` falls for `x > 0`, so `f′` must be negative there.","l2|r1":"A horizontal graph has slope 0 everywhere.","l1|r3":"The slope of a line is constant: `f′` is a horizontal line.","l1|r5":"The slope of a line is constant: `f′` is a horizontal line.","l6|r7":"`x^3` has one flat point, at 0, and is never decreasing.","l3|r5":"`x^2` turns at 0, so its derivative crosses 0 at 0."},"wrongDefault":"Find where `f` has horizontal tangents; `f′` must be 0 there."},{"id":"sketch","type":"custom","title":"Sketch the derivative","summary":"Sketch the derivative","star":true,"goal":[3,4,6],"instruction":"Build `f′` from the graph of `f`, or work backwards from `f′`. Items 4 to 6 are non-routine.","how":"Tap the lower panel’s `x`-axis to place a zero of `f′` (or move the tangent and press \u003cstrong>Place at the tangent\u003c/strong>); tap a zero again to remove it. Tap an interval to cycle its sign: +, −, blank.","shapes":[{"id":"flat","t":"A horizontal line"},{"id":"line","t":"A slanted line"},{"id":"up","t":"An upward parabola"},{"id":"down","t":"A downward parabola"}],"general":{"zeros":"Find where `f` has horizontal tangents; `f′` must be 0 there.","signs":"Check each interval: where `f` rises, `f′` is +; where it falls, `f′` is −.","shape":"Look at how the slopes change from left to right: steadily (a line) or down and back up (a parabola)?","ext":"`f′` peaks where `f` is steepest uphill."},"items":[{"id":"s1","goal":[3,4],"kind":"sketch","fn":"s1","need":["zeros","signs","shape"],"prompt":"Here is the graph of `f`. Build `f′`: place its zeros, mark its sign on each interval and choose its shape.","_a":"QxYcVBZXEkQCb1VsSBoSD19aFRNeY0xXFAU7HUZLCQdIUUQLRlQICF0WGw==","wrong":[{"zeroAt":[1,5],"fb":"Those are `f`’s `x`-intercepts."}],"why":"`f` falls, turns at `x = 3`, then rises: one zero at 3, − then +, and `f′` is a line."},{"id":"s2","goal":[3,4,6],"kind":"sketch","fn":"s2","need":["zeros","signs","shape","ext"],"prompt":"Here is the graph of `f`. Build `f′`: its zeros, signs and shape, and tap where it has its peak or valley.","_a":"QxYcVBZXEkQCb1YdVmVNREtdAV8XGls9FQVKAEgVUDsUFhVZBUgERAIWAl4TVkNKGlEeRUYCUBs=","wrong":[{"extAt":[0,2],"fb":"`f′` is 0 there; it peaks where `f` is steepest, between them."}],"why":"Zeros at 0 and 2; −, +, −; a downward parabola with its maximum at `x = 1`, where `f` rises most steeply."},{"id":"s3","goal":[3,4],"kind":"sketch","fn":"s3","need":["zeros","signs"],"prompt":"Here is the graph of `f`. Place the zeros of `f′` and mark its sign on each interval.","_a":"QxYcVBZXEkQCb0sASAhNV2UYREINXw8VGg49HFUUUEoVBUoAOUU=","why":"Turning points at −1, 0 and 1; `f` falls, rises, falls, rises: −, +, −, +."},{"id":"s4","goal":[3,4],"star":true,"kind":"sketch","fn":"s4","need":["zeros","signs"],"prompt":"Here is the graph of `f`: flat at 0, and it never falls. Place the zeros of `f′` and mark its sign on each interval.","_a":"QxYcVBZXEkQCb1ZsSBoSD19aFRNeY1BKCWkb","wrong":[{"signs":[1,-1],"fb":"`x^3` never falls; the flat point doesn’t change the sign."},{"signs":[-1,1],"fb":"`x^3` never falls; the flat point doesn’t change the sign."},{"zerosMissing":[0],"fb":"The tangent is flat at the origin."}],"why":"Zero at 0 only, and + on both sides: no sign change.","hints":["Trace `x^3` from left to right. Does it ever go down?","No: it only pauses at 0.","`f′ = 0` at 0 and positive on both sides."]},{"id":"s5","goal":4,"star":true,"kind":"mc","prompt":"The graph shows `f′`: a line with positive slope crossing the `x`-axis at `x = -1`. Which could be `f`?\u003ccanvas class=\"plot\" data-fig=\"s5g\" role=\"img\" aria-label=\"Graph of f′: a rising line crossing the x-axis at x = −1\">\u003c/canvas>","options":[{"t":"\u003ccanvas class=\"plot\" data-fig=\"s5b\" role=\"img\" aria-label=\"A downward parabola with its vertex at x = −1\">\u003c/canvas>","why":"`f′` goes from − to +, so `f` falls then rises.","_n":"1kb37","_k":"7295f1ef"},{"t":"\u003ccanvas class=\"plot\" data-fig=\"s5a\" role=\"img\" aria-label=\"An upward parabola with its vertex at x = −1\">\u003c/canvas>","why":"`f′` is negative left of −1 and positive right of it, so `f` falls, then rises, turning at `x = -1`.","_n":"1lc07","_k":"a6087f17"},{"t":"\u003ccanvas class=\"plot\" data-fig=\"s5d\" role=\"img\" aria-label=\"A rising line crossing the x-axis at x = −1\">\u003c/canvas>","why":"`f′` records how steep `f` is, not how high it is.","_n":"1mc17","_k":"7c58380c"},{"t":"\u003ccanvas class=\"plot\" data-fig=\"s5c\" role=\"img\" aria-label=\"An upward parabola with its vertex at x = 1\">\u003c/canvas>","why":"`f′ = 0` at `x = -1`.","_n":"1nb26","_k":"a41fb814"}]},{"id":"s6","goal":6,"star":true,"kind":"mc","prompt":"`f′` has a maximum at `x = 2`, with `f′(2) = 3`. What’s true about `f` at `x = 2`?","options":[{"t":"`f` has a horizontal tangent at `x = 2`","why":"That needs `f′(2) = 0`.","_n":"1ob16","_k":"b6fe4d9a"},{"t":"`f` is increasing most steeply there, with slope 3: a point of inflection","why":"`f′(2) = 3` is the greatest slope, so `f` rises most steeply at `x = 2`.","_n":"1pb06","_k":"1b0a6cd3"},{"t":"`f(2) = 3`","why":"3 is a slope, not a height. `f′` records how steep `f` is, not how high it is.","_n":"1qaf6","_k":"044db9be"},{"t":"`f` has a local maximum at `x = 2`","why":"A maximum of `f′` isn’t a maximum of `f`. `f′(2) = 3 > 0` means `f` is rising.","_n":"1rb66","_k":"2c88deb4"}],"hints":["`f′(2) = 3` tells you the slope of `f` at 2.","The slope is at its greatest there: the steepest uphill point.","Steepest point = point of inflection."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Gurpreet","how":"","goal":4,"instruction":"Gurpreet made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Sketch `f′` for `f(x) = (x - 1)(x - 5)`, a parabola opening up with vertex (3, −4).","steps":["`f` is decreasing on `(-∞, 3)` and increasing on `(3, ∞)`.","So `f′` is negative on `(-∞, 3)` and positive on `(3, ∞)`.","`f′ = 0` where `f = 0`, at `x = 1` and `x = 5`.","So `f′` is a parabola through (1, 0) and (5, 0)."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. Check step 3."],"fixes":[{"t":"`f′(3) = -4`, the vertex’s height.","why":"`f′` records how steep `f` is, not how high it is.","_n":"1sb56","_k":"b986eb92"},{"t":"`f′ = 0` at `x = 1`, 3 and 5.","why":"`f′ = 0` where the tangent is \u003cstrong>horizontal\u003c/strong>: at turning points, not where `f` crosses the axis.","_n":"1tb46","_k":"51568c38"},{"t":"`f′ = 0` where the tangent is horizontal, only at the vertex `x = 3`. `f′` is a line through (3, 0) with positive slope.","why":"Horizontal tangents happen once on a parabola, at its vertex; steps 1–2 say `f′` changes from − to +.","_n":"1ub36","_k":"0ef78765"},{"t":"Step 3 is right, but the parabola opens down.","why":"Step 3 is the mistake: `f′ = 0` only where the tangent is horizontal.","_n":"1vba6","_k":"8cd6bb0b"}],"hints":["What does `f′ = 0` mean about the tangent?","Horizontal: that happens once on a parabola.","Only at `x = 3`; and steps 1–2 say `f′` changes from − to +."]},{"id":"e2","goal":4,"task":"`g(x) = f(x) + 10`. How is `g′` related to `f′`?","steps":["`g` is `f` shifted up 10.","Each tangent to `g` is a tangent to `f` shifted up 10.","So every tangent slope is 10 greater: `g′(x) = f′(x) + 10`.","`g′` is `f′` shifted up 10."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Shifting a line up doesn’t change its slope, so `f + c` has the same derivative. Shifting right moves every slope right.","_n":"1wb96","_k":"ae904a2a"},{"t":"`g′` is `f′` shifted right 10.","why":"Shifting up doesn’t move anything sideways, and it doesn’t change any slope.","_n":"1xac6","_k":"0c1befb6"},{"t":"`g′(x) = 10f′(x)`.","why":"Shifting up doesn’t stretch anything, and it doesn’t change any slope.","_n":"1yad6","_k":"c84259f4"},{"t":"Shifting a line up doesn’t change its slope, so `g′(x) = f′(x)`.","why":"Each tangent keeps its slope when it moves up 10, so every slope is the same.","_n":"1zae6","_k":"f8c291b9"}],"hints":["Does moving a line up change its steepness?","No.","`g′ = f′`."]},{"id":"e3","goal":4,"task":"Sketch `f′` for `f(x) = |x + 2|`.","steps":["For `x \u003c -2`, `f(x) = -x - 2`, which has slope −1.","For `x > -2`, `f(x) = x + 2`, which has slope 1.","At `x = -2` the graph has a minimum, so `f′(-2) = 0`.","`f′` is −1, then 0 at −2, then 1."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Step 3 is correct.","why":"At a corner there’s no single tangent, so `f′` doesn’t exist there: open circles on both sides.","_n":"20af6","_k":"bc3d8ce6"},{"t":"At a corner there’s no single tangent, so `f′(-2)` doesn’t exist. Draw open circles at (−2, −1) and (−2, 1).","why":"The graph isn’t smooth at `x = -2`: it has a corner, so there’s no tangent and no `f′(-2)`.","_n":"21b06","_k":"844fc27b"},{"t":"`f′(-2) = 1`, using the right piece.","why":"The left piece has slope −1, so neither piece wins. At a corner there’s no single tangent, so `f′` doesn’t exist there: open circles on both sides.","_n":"22b16","_k":"d8180d86"},{"t":"`f′(-2) = -2`, the `x`-value.","why":"−2 is the `x`-value, not a slope. At a corner there’s no single tangent, so `f′` doesn’t exist there: open circles on both sides.","_n":"23b26","_k":"52d3fe60"}],"hints":["Is the graph smooth at `x = -2`?","No, it has a corner.","No tangent, so no `f′(-2)`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when the trail appeared: its shape, or where it crossed zero?"},{"id":"j2","q":"In your own words, explain the difference between the height of `f` and the height of `f′` at the same `x`."},{"id":"j3","q":"Explain to a friend how to sketch `f′` from a graph of `f` in four steps."},{"id":"j4","q":"Which part of sketching `f′` do you still find hard (signs, zeros, steepest points or corners)? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What does `f′(4) = -2` mean?","options":[{"t":"The graph crosses the `x`-axis at `x = -2`","why":"Unrelated to slope.","_n":"24b36","_k":"4f9b819a"},{"t":"`f(4) = -2`","why":"That’s a height, not a slope.","_n":"25b46","_k":"5e370500"},{"t":"`f` decreases by 2 from `x = 0` to `x = 4`","why":"That’s an average over an interval, not the slope at a point.","_n":"26b56","_k":"6d26c526"},{"t":"The tangent to `y = f(x)` at `x = 4` has slope −2","why":"`f′(4)` is the slope of the tangent at `x = 4`.","_n":"27c69","_k":"01aa6b79"}]},"b":{"prompt":"What does \u003cspan class=\"m\">d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003c/span> = 5 at `x = -1` mean?","options":[{"t":"`y` increases by exactly 5 from `x = -1` to `x = 0`","why":"That’s an average rate.","_n":"28c59","_k":"7d2cc5ae"},{"t":"The point (5, −1) is on the graph","why":"Unrelated to slope.","_n":"29c89","_k":"b4b36802"},{"t":"`y = 5` when `x = -1`","why":"That’s a height, not a slope. \u003cspan class=\"m\">d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003c/span> records how steep the graph is, not how high it is.","_n":"2ac79","_k":"91fd5045"},{"t":"The tangent at `x = -1` has slope 5","why":"\u003cspan class=\"m\">d\u003ci>y\u003c/i>/d\u003ci>x\u003c/i>\u003c/span> is another way to write `f′(x)`: the slope of the tangent.","_n":"2bc29","_k":"f7d7dc38"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"`f` is a parabola opening down with vertex (2, 7). Where is `f′(x) > 0`?","options":[{"t":"Wherever `f(x) > 0`","why":"Above the axis isn’t the same as going up. A curve can be positive and falling.","_n":"2cc19","_k":"e66dea85"},{"t":"`(-∞, 7)`","why":"7 is a height; intervals of `x` come from the vertex’s `x`-value.","_n":"2dc49","_k":"ba739e07"},{"t":"`(-∞, 2)`","why":"`f` rises until the vertex.","_n":"2ec39","_k":"eb1fed52"},{"t":"`(2, ∞)`","why":"`f` falls there.","_n":"2fbe9","_k":"9d560227"}]},"b":{"prompt":"`f` is a parabola opening up with vertex (−1, −4). Where is `f′(x) > 0`?","options":[{"t":"`(-4, ∞)`","why":"−4 is a height; intervals of `x` come from the vertex’s `x`-value.","_n":"2gbd9","_k":"746c7b23"},{"t":"Wherever `f(x) > 0`","why":"Above the axis isn’t the same as going up. A curve can be positive and falling.","_n":"2hc08","_k":"3a91f274"},{"t":"`(-∞, -1)`","why":"`f` falls there.","_n":"2ic18","_k":"94b2fe7c"},{"t":"`(-1, ∞)`","why":"`f` rises after the vertex.","_n":"2jbe8","_k":"20f5cbf3"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"`f` is a cubic function. Its derivative `f′` is…","options":[{"t":"A constant function","why":"That’s the derivative of a linear function.","_n":"2kbf8","_k":"cfa7817e"},{"t":"A quadratic function","why":"Derivatives lower the degree by one: cubic → quadratic.","_n":"2lc48","_k":"13396027"},{"t":"A linear function","why":"Two degrees lower is too many.","_n":"2mc58","_k":"5fb4d99c"},{"t":"A cubic function","why":"The derivative is one degree lower: cubic → quadratic.","_n":"2nc28","_k":"48ac53f4"}]},"b":{"prompt":"`f` is a quadratic function. Its derivative `f′` is…","options":[{"t":"A linear function","why":"The derivative of a quadratic is linear: one degree lower.","_n":"2oc38","_k":"9c6907f7"},{"t":"A quadratic function","why":"The derivative of a quadratic is linear: one degree lower.","_n":"2pb88","_k":"d5db9b07"},{"t":"A constant function","why":"That’s the derivative of a linear function.","_n":"2qb98","_k":"834e1073"},{"t":"A cubic function","why":"Derivatives lower the degree.","_n":"2re79","_k":"58cf3874"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"`f` is a cubic with a local maximum at `x = -1`, a local minimum at `x = 3`, and no other turning points. Which describes `f′`?","options":[{"t":"A line through (−1, 0) and (3, 0)","why":"A line has at most one zero unless it’s the `x`-axis.","_n":"2se89","_k":"b6ceedda"},{"t":"An upward parabola with zeros at `f`’s `x`-intercepts","why":"`f′ = 0` where the tangent is \u003cstrong>horizontal\u003c/strong>: at turning points, not where `f` crosses the axis.","_n":"2te59","_k":"6b136acc"},{"t":"A downward parabola with zeros −1 and 3, positive between them","why":"Signs reversed: between a max and a min, `f` falls.","_n":"2ue69","_k":"a509c12e"},{"t":"An upward parabola with zeros −1 and 3, negative between them","why":"+ before −1, − between, + after 3.","_n":"2ve39","_k":"566bb417"}]},"b":{"prompt":"`f` is a cubic with a local minimum at `x = -2`, a local maximum at `x = 2`, and no other turning points. Which describes `f′`?","options":[{"t":"A line through (−2, 0) and (2, 0)","why":"A line has at most one zero unless it’s the `x`-axis.","_n":"2we49","_k":"6085464a"},{"t":"An upward parabola with zeros −2 and 2, negative between them","why":"Signs reversed: between a min and a max, `f` rises, so `f′` is positive there.","_n":"2xe19","_k":"235876bc"},{"t":"A downward parabola with zeros at `f`’s `x`-intercepts","why":"`f′ = 0` where the tangent is \u003cstrong>horizontal\u003c/strong>: at turning points, not where `f` crosses the axis.","_n":"2ye29","_k":"f4bd77d6"},{"t":"A downward parabola with zeros −2 and 2, positive between them","why":"− before −2, + between, − after 2.","_n":"2zef9","_k":"09150a86"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"The graph of `f′` is a downward parabola with vertex (1, 4). What does this tell you about `f` at `x = 1`?","options":[{"t":"`f` is increasing most steeply there (slope 4): a point of inflection","why":"4 is the greatest value of `f′`, so `f` is steepest uphill at `x = 1`.","_n":"30f09","_k":"fd87d880"},{"t":"`f` has a horizontal tangent at `x = 1`","why":"That needs `f′(1) = 0`.","_n":"31eda","_k":"f1895c03"},{"t":"`f(1) = 4`","why":"4 is a slope, not a height. `f′` records how steep `f` is, not how high it is.","_n":"32eca","_k":"08e4ccff"},{"t":"`f` has a local maximum at `x = 1`","why":"`f′(1) = 4 > 0`, so `f` is rising there.","_n":"33efa","_k":"dd95877f"}]},"b":{"prompt":"The graph of `f′` is an upward parabola with vertex (−2, −3). What does this tell you about `f` at `x = -2`?","options":[{"t":"`f` is decreasing most steeply there (slope −3): a point of inflection","why":"−3 is the least value of `f′`, so `f` is steepest downhill at `x = -2`.","_n":"34eea","_k":"477f5bf8"},{"t":"`f` has a local minimum at `x = -2`","why":"`f′(-2) = -3 \u003c 0`, so `f` is falling there.","_n":"35f1a","_k":"85c7848b"},{"t":"`f` has a horizontal tangent at `x = -2`","why":"That needs `f′(-2) = 0`.","_n":"36f0a","_k":"d0c82001"},{"t":"`f(-2) = -3`","why":"−3 is a slope, not a height. `f′` records how steep `f` is, not how high it is.","_n":"37f3a","_k":"4c2762ab"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"`g(x) = f(x - 3) + 5`. How is the graph of `g′` related to the graph of `f′`?","options":[{"t":"It’s `f′` shifted right 3","why":"The vertical shift doesn’t change slopes.","_n":"38f2a","_k":"e31879da"},{"t":"It’s the same as `f′`","why":"The horizontal shift moves every slope.","_n":"39e5a","_k":"cce9e2de"},{"t":"It’s `f′` shifted left 3","why":"`x - 3` moves everything right.","_n":"3ae4a","_k":"f271a943"},{"t":"It’s `f′` shifted right 3 and up 5","why":"Shifting a graph up doesn’t change its slopes, so the 5 has no effect on `g′`.","_n":"3bdb9","_k":"18e50761"}]},"b":{"prompt":"`g(x) = f(x + 2) - 4`. How is the graph of `g′` related to `f′`?","options":[{"t":"It’s `f′` shifted left 2 and down 4","why":"Shifting a graph down doesn’t change its slopes, so the 4 has no effect on `g′`.","_n":"3cdc9","_k":"944035c9"},{"t":"It’s `f′` shifted right 2","why":"`x + 2` moves everything left.","_n":"3ddd9","_k":"b8330349"},{"t":"It’s `f′` shifted left 2","why":"`x + 2` moves every slope left 2, and the vertical shift doesn’t change slopes.","_n":"3ede9","_k":"9896f8b6"},{"t":"It’s the same as `f′`","why":"The horizontal shift moves every slope.","_n":"3fdf9","_k":"0b4c9ef1"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"A student records tangent slopes of `f(x) = x^2`: at `x` = −2, −1, 0, 1, 2 the slopes are −4, −2, 0, 2, 4. Which conclusion is best supported?","options":[{"t":"“`f′(x) = 4`, because the largest slope is 4.”","why":"`f′` is a function, not one number.","_n":"3ge09","_k":"334933d9"},{"t":"“`f′(x) = x^2`, because the slopes come from `x^2`.”","why":"The slopes −4, −2, 0, 2, 4 aren’t values of `x^2`. The derivative of a quadratic is linear: one degree lower.","_n":"3he19","_k":"a2ff8e83"},{"t":"“The slopes are symmetric, so `f′` is an even function.”","why":"They’re opposite in sign: the pattern is odd.","_n":"3ie29","_k":"655c6fa1"},{"t":"“The points lie on the line `y = 2x`, so `f′(x) = 2x` looks likely; checking more `x`-values would make the case stronger.”","why":"All five points fit `y = 2x`, and more points would make the pattern more convincing.","_n":"3je39","_k":"4181b75c"}]},"b":{"prompt":"A student records tangent slopes of `f(x) = x^3`: at `x` = −2, −1, 0, 1, 2 the slopes are 12, 3, 0, 3, 12. Which conclusion is best supported?","options":[{"t":"“`f′(x) = x^3`.”","why":"The derivative of a cubic is quadratic, one degree lower. The slopes are never negative, but `x^3` is.","_n":"3ke49","_k":"7889bee9"},{"t":"“The points lie on `y = 3x^2`, so `f′(x) = 3x^2` looks likely; more `x`-values would confirm it.”","why":"12, 3, 0, 3, 12 are the values of `3x^2` at −2, −1, 0, 1, 2.","_n":"3le19","_k":"0d62b78c"},{"t":"“`f′` is linear, because the `x`-values are evenly spaced.”","why":"The slopes fall from 12 to 0 and rise back to 12, so they don’t lie on a line.","_n":"3me09","_k":"bf246b23"},{"t":"“`f′` is odd, because `f` is odd.”","why":"The slopes are equal at ±`x`: even.","_n":"3ndf9","_k":"59018af9"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why `f′(x) = 0` at a smooth turning point of `f`?","options":[{"t":"“Because the graph changes direction, so the slope is undefined.”","why":"At a smooth turning point the tangent exists and is horizontal, so its slope is 0, not undefined.","_n":"3ode9","_k":"307ad387"},{"t":"“At a turning point the tangent is horizontal, and a horizontal line has slope 0.”","why":"A smooth turning point has a horizontal tangent, and its slope is 0.","_n":"3pe59","_k":"d5f3990c"},{"t":"“Because `f` is at its largest there, so its slope is largest.”","why":"`f′` is greatest where `f` is steepest uphill, which is usually between turning points.","_n":"3qe49","_k":"85903cfb"},{"t":"“Because `f(x) = 0` there.”","why":"`f′ = 0` where the tangent is \u003cstrong>horizontal\u003c/strong>: at turning points, not where `f` crosses the axis.","_n":"3re39","_k":"9a174ed7"}]},"b":{"prompt":"Which is the best explanation of why `f′` is negative where `f` is decreasing?","options":[{"t":"“Because `f(x)` is negative there.”","why":"Below the axis isn’t the same as going down. A curve can be negative and rising.","_n":"3se29","_k":"71497d23"},{"t":"“Because `f′` is always the opposite of `f`.”","why":"`f′` isn’t the opposite of `f`; it records the slope of `f`.","_n":"3te99","_k":"c5de8f9f"},{"t":"“Where `f` decreases, each tangent falls from left to right, so its slope is negative.”","why":"Falling tangents have negative slopes.","_n":"3ue89","_k":"cbd5eea0"},{"t":"“Because the graph is below the `x`-axis there.”","why":"Below the axis isn’t the same as going down. A curve can be negative and rising.","_n":"3v5fa","_k":"ce159232"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"A drone’s height `h(t)` rises from `t = 0` to `t = 4` s, hovers at a constant height until `t = 6` s, then descends. Which describes `h′(t)`?","options":[{"t":"Zero only at `t = 4` and `t = 6`","why":"Hovering means the height isn’t changing over the whole interval.","_n":"3w60a","_k":"8b36f6a8"},{"t":"Positive throughout, because the drone stays above the ground","why":"Above the ground isn’t the same as going up. The height is positive while the drone descends, but it’s falling.","_n":"3x5da","_k":"b06b3d72"},{"t":"Positive on (0, 4), zero on (4, 6), negative after 6","why":"Rising, hovering, then descending: +, 0, −.","_n":"3y5ea","_k":"c4667ff1"},{"t":"Equal to `h(t)`","why":"`h′` records how fast the height changes, not how high the drone is.","_n":"3z63a","_k":"ed284456"}]},"b":{"prompt":"The volume `V(t)` of water in a tank drains from `t = 0` to 5 min, stays constant until `t = 8` min, then rises. Which describes `V′(t)`?","options":[{"t":"Zero only at `t = 5` and `t = 8`","why":"A constant volume means it isn’t changing over the whole interval.","_n":"4064a","_k":"9e35fb46"},{"t":"Negative on (0, 5), zero on (5, 8), positive after 8","why":"Draining, steady, then filling: −, 0, +.","_n":"4161a","_k":"2fc4ee19"},{"t":"Positive throughout, because the tank always holds some water","why":"Holding water isn’t the same as filling. The volume is positive while it drains, but it’s falling.","_n":"4262a","_k":"0e2ea06a"},{"t":"Equal to `V(t)`","why":"`V′` records how fast the volume changes, not how much water there is.","_n":"4367a","_k":"8570dcaa"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A fish population `P(t)` grows slowly at first, grows fastest at `t = 6` years, then levels off near 2000. Which best describes `P′(t)`?","options":[{"t":"It always increases, because `P` always increases","why":"A curve can rise while its slope shrinks: after `t = 6`, `P` still grows, but more slowly.","_n":"4468a","_k":"fad3fe4e"},{"t":"It rises to a maximum at `t = 6`, then falls toward 0","why":"The fastest growth at `t = 6` is the peak of `P′`; levelling off means the rate falls toward 0.","_n":"45e5a","_k":"1c30bfb0"},{"t":"It rises toward 2000","why":"2000 is a population, not a rate. `P′` records how fast `P` grows.","_n":"46e4a","_k":"3bc19575"},{"t":"It has a zero at `t = 6`","why":"Fastest growth means the largest rate, not zero.","_n":"47e7a","_k":"43689847"}]},"b":{"prompt":"A cup of coffee cools: its temperature `T(t)` drops quickly at first, then more slowly toward room temperature (20 °C). Which best describes `T′(t)`?","options":[{"t":"It’s negative and falls toward −20","why":"20 °C is a temperature, not a rate. The cooling slows, so `T′` approaches 0.","_n":"48e6a","_k":"1f78d87d"},{"t":"It’s negative, starting at its most negative value and rising toward 0","why":"The temperature falls fastest at first, so `T′` starts most negative; as the cooling slows, `T′` rises toward 0.","_n":"49e1a","_k":"f57882c0"},{"t":"It decreases toward 20","why":"20 °C is a temperature, not a rate. `T′` records how fast `T` changes.","_n":"4ae0a","_k":"bc1449ee"},{"t":"It’s positive, because the temperature is positive","why":"A positive temperature can still be falling, so `T′` is negative.","_n":"4be3a","_k":"0cebb356"}]}}]},"task":{"title":"Steepest descent at `x = 1`","summary":"Steepest descent at x = 1","statement":"\u003cp>Design a cubic by choosing where its turning points go. Its derivative is `f′(x) = 6@a{a}(x - p)(x - q)`. Meet every condition, and find all the answers.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`f` has a local maximum at a negative `x`-value.\u003c/li>\u003cli>`f` is decreasing at `x = 1`.\u003c/li>\u003cli>`f` falls most steeply at `x = 1`.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers from −5 to 5 for `p` and `q` (`p ≠ q`), and `@a{a} = 1` or −1. The tool draws `f(x) = @a{a}(2x^3 - 3(p + q)x^2 + 6pqx)` and, on the lower panel, `f′`. The order of `p` and `q` doesn’t matter.\u003c/p>","checks":["Local maximum at a negative `x`","Decreasing at `x = 1`","Falls most steeply at `x = 1`"],"tips":["A local max is where `f′` changes from positive to negative. With `@a{a} = 1`, that happens at the smaller of `p` and `q`."
