.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 13: hero equation, Off-function tangents (Explore), Tangents to any curve stations, V8 boxes, task */
.id-hl{background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:0 .12em}
.id-arr{color:var(--ink-2);margin:0 .12em}
.id-hcap{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;font-size:1.05rem}
.id-hcap [data-st]{transition:opacity .45s ease}
@media (prefers-reduced-motion:reduce){ .id-hcap [data-st]{transition:none} }

.id-ex{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.id-main,.id-side{min-width:0}
.id-eq{min-height:1.6em;font-size:1.25rem}
.id-legend{margin-top:6px}
.id-leg{margin:6px 0 0}
.id-leg p{margin:0}
.id-leg .tiny{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.id-legd{padding-left:36px}
.id-sw{display:inline-block;width:28px;height:0;border-top:3px solid var(--pen);flex:none}
.id-sw-bot{border-top:2.6px dashed var(--ink)}
.id-cvs{margin-bottom:4px}
.id-cvhow{margin:4px 0 8px}
.id-sl{margin-top:6px}
.id-sl output{color:var(--ink)}
.id-how{margin:4px 0 10px}
.id-read{margin-top:12px}
.id-more{display:none;margin-top:6px}
.id-note{margin:10px 0 0;font-weight:600;color:var(--ink)}

.id-st h3{margin-top:0}
.id-st:first-child{margin-top:0;padding-top:0;border-top:0}
.id-stseg{margin:0 0 12px}
.id-stseg .seg button .m{font-size:1.05em}
.id-stc[hidden]{display:none}
.id-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;min-height:2.6em}
.id-steps li{display:flex;gap:10px;align-items:baseline;border:1.5px solid var(--rule);border-radius:6px;padding:.45em .75em;background:var(--sheet)}
.id-steps li.cur{border-color:var(--ink);background:var(--hi-soft)}
.id-steps .sn{font-weight:700;color:var(--ink-2)}
.id-steps .m{white-space:normal}
.id-pl{margin-top:8px}
.id-gen{margin:12px 0 0;font-weight:600}
.id-taphow{margin:8px 0 6px}
.id-pts .chip .m{font-size:1.05em}
.id-p3read{margin:10px 0 0;min-height:2.6em}
.id-p3read .m{white-space:normal}

.id-bxs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 4px}
.id-bxs label{display:flex;align-items:center;gap:8px;font:400 1.1rem var(--font-math)}
.id-pts2{display:flex;flex-wrap:wrap;gap:10px 22px;margin:6px 0 4px}
.id-pt{display:inline-flex;align-items:center;gap:4px;font-size:1.15rem}
.id-pt > .tiny{margin-right:6px;font-size:.8rem;color:var(--ink-2)}
.id-pt .numin.short{width:4.6rem}

.it-step{display:flex;align-items:center;gap:8px;margin:8px 0 0;flex-wrap:wrap}
.it-step label{min-width:7rem}
.it-lab{font-size:1.2rem}
.it-step .btn{min-width:40px;font-size:1.1rem}
.it-step .numin.short{width:5.5rem}
.it-frs{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:8px}
.it-fr{display:inline-flex;align-items:center;gap:10px}
.it-frb{display:inline-flex;flex-direction:column;align-items:stretch;gap:4px}
.it-frb .numin.short{width:5.5rem;text-align:center}
.it-bar{display:block;border-top:2px solid var(--ink)}

@media (max-width:820px){
  .id-ex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .id-read:not(.id-all) .id-x2{display:none}
  .id-more{display:inline-flex}
  .id-pt .numin.short{width:4rem}
  .it-step label{flex-basis:100%;min-width:0}
}
.id-heq{font-size:.82em}
.id-nw{white-space:nowrap}

2/16 = 25`: `x = ±4`, giving (4, −3) or (−4, 3)."],"msgs":{"curve":"Choose the circle and set `r = 5` first.","a":"Slope −4/3 there: check the sign of `y`.","b":"Slope 3/4: you swapped `x` and `y`.","other":"The slope at P is {m}. You need 4/3."}},{"id":"tc2","goal":[3,4],"prompt":"Ellipse: move P to the point in Quadrant I where the tangent’s slope is −2/3.","why":"`-4x/(9y) = -2/3` means `y = 2x/3`. Then `8x^2 = 36`: P = `(3√2/2, √2)`.","hints":["`-4x/(9y) = -2/3`.","That gives `y = 2x/3`; substitute into `4x^2 + 9y^2 = 36`.","`8x^2 = 36`, so `x = 3/√2 = 3√2/2` and `y = √2`."],"msgs":{"curve":"Choose the ellipse first.","q3":"Same slope, but Quadrant III.","top":"Slope 0 there.","other":"The slope at P is {m}. You need −2/3 in Quadrant I."}},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Shifted circle `(x - h)^2 + y^2 = 25`: choose `h` so that the circle passes through (2, 4) \u003cstrong>and\u003c/strong> its tangent there has a positive slope.","why":"`h = 5`: `(2 - 5)^2 + 16 = 25`, and the slope `-(2 - 5)/4 = 3/4` is positive.","hints":["On the circle: `(2 - h)^2 + 16 = 25`.","`h = -1` or 5. Implicitly, `dy/dx = -(x - h)/y`.","At (2, 4): `-(2 - h)/4` is positive only when `h > 2`: `h = 5`, slope 3/4."],"msgs":{"curve":"Choose the shifted circle, then set `h` with its slider.","neg":"The circle passes through (2, 4), but the slope there is −3/4.","off":"(2, 4) isn’t on this circle: `(2 - h)^2 + 16` must be 25."}}]},"part3":{"slug":"any-curve","name":"Any curve","heading":"Tangents to any curve","intro":"Explore used curves where only `y^2` appears. Here you meet `xy` terms, use implicit differentiation to prove the power rule for rational exponents, and find a tangent to a curve you couldn’t easily solve for `y`. Step through each station, then tap a point to see its tangent. Then try the quick check.","tapHow":"Tap a point: the formula gives its slope, and the tangent appears on the graph.","locked":"Step through to the formula first. Then the tangent appears.","stations":[{"id":"st1","title":"Station 1: `xy` terms","text":"A product such as `xy` needs the product rule inside implicit differentiation.","curves":[{"id":"xy","chip":"`xy = 6`","steps":["`xy = 6`. Differentiate both sides with respect to `x`.","`y + x dy/dx = 0` (product rule on `xy`).","So `dy/dx = -y/x`."],"alg":["Explicitly, `y = 6/x`, so `dy/dx = -6/x^2`.","`-6/x^2 = -(6/x)/x = -y/x`.","Same."],"pts":[[1,6],[2,3],[3,2],[6,1],[-2,-3],[-3,-2]],"pt0":1},{"id":"tilt","chip":"`x^2 + xy + y^2 = 7`","steps":["`x^2 + xy + y^2 = 7` is a tilted ellipse. Differentiate both sides.","`2x + (y + x dy/dx) + 2y dy/dx = 0`","So `dy/dx = -(2x + y)/(x + 2y)`.","At (1, 2) (check: 1 + 2 + 4 = 7), the slope is −4/5."],"pts":[[1,2],[2,1],[-1,3],[3,-1],[-1,-2],[-2,-1]],"pt0":0}]},{"id":"st2","title":"Station 2: the power rule for rational exponents","text":"Implicit differentiation proves the power rule for a rational exponent such as `2/3`.","curves":[{"id":"pow","chip":"`y = x^{2/3}`","steps":["`y = x^{2/3}` means `y^3 = x^2`.","Differentiate: `3y^2 dy/dx = 2x`.","So `dy/dx = {2x}/{3y^2} = {2x}/{3x^{4/3}}`.","`= {2}/{3}x^{-1/3}`. That’s the power rule."],"general":"General case: `y^q = x^p` gives `dy/dx = {p}/{q}x^{p/q - 1}`.","pts":[[-8,4],[-1,1],[1,1],[8,4]],"pt0":3}]},{"id":"st3","title":"Station 3: a cubic curve","text":"The module draws `x^3 + y^3 = 9` for you: solving for `y` isn’t easy. Implicit differentiation doesn’t need to.","curves":[{"id":"cubic","chip":"`x^3 + y^3 = 9`","steps":["`x^3 + y^3 = 9`. Differentiate both sides.","`3x^2 + 3y^2 dy/dx = 0`","So `dy/dx = -x^2/y^2`.","At (1, 2) the slope is −1/4."],"pts":[[1,2],[2,1]],"pt0":0}]}],"quickCheck":{"title":"Quick check","summary":"Any curve quick check","items":[{"id":"q1","goal":5,"prompt":"`d/dx (xy) =` ?","choices":[{"t":"`dy/dx`","fb":"Product rule: `(1)(y) + x(dy/dx)`.","_n":"14fd4","_k":"72fcfb1e"},{"t":"`y dy/dx`","fb":"Product rule: `(1)(y) + x(dy/dx)`.","_n":"15004","_k":"74ff78c9"},{"t":"`y + x dy/  `dy/dx = -x/y = -5/(-12) = 5/12`."},{"id":"s2","goal":[3,5],"kind":"boxes","prompt":"Tangent to `xy = 12` at (3, 4): slope and `y`-intercept.","boxes":[{"k":"m","label":"Slope"},{"k":"b","label":"`y`-intercept"}],"_a":"HxsJFVgThLH2DUsEQB1EW0YDRg9ATA==","display":"slope −4/3, intercept 8","wrong":[{"m":"0","fb":"Substituting `x = 3` before differentiating loses the slope. Differentiate first, then substitute."}],"why":"`y + x dy/dx = 0` gives `dy/dx = -y/x = -4/3`; `y - 4 = -{4}/{3}(x - 3)` gives `y = -{4}/{3}x + 8`."},{"id":"s3","goal":4,"star":true,"kind":"points","prompt":"Points on `x^2 + y^2 - 6x = 16` with horizontal tangents.","_a":"P2JXG1dsSmJXFUkCP2w=","display":"(3, 5) and (3, −5)","wrong":[{"pt":[3,0],"fb":"That’s the centre, not on the curve. Combine the condition with the curve’s equation to find actual points."}],"why":"`2x + 2y dy/dx - 6 = 0` gives `dy/dx = (3 - x)/y`. Horizontal when `x = 3`: `9 + y^2 - 18 = 16`, so `y = ±5`."},{"id":"s4","goal":4,"star":true,"kind":"points","prompt":"Points on `4x^2 + y^2 - 8y = 0` with vertical tangents.","_a":"P2JWG1ZsSmJJC0gDP2w=","display":"(2, 4) and (−2, 4)","wrong":[{"pts":[[0,0],[0,8]],"fb":"Those have horizontal tangents. Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical."}],"why":"`8x + 2y dy/dx - 8 dy/dx = 0` gives `dy/dx = -4x/(y - 4)`. Vertical when `y = 4`: `4x^2 + 16 - 32 = 0`, so `x = ±2`."},{"id":"s5","goal":[4,5],"star":true,"kind":"points","prompt":"Points on `x^2 + xy + y^2 = 12` with horizontal tangents.","_a":"P2JWG08FOxU/FFYbVmw7","display":"(2, −4) and (−2, 4)","wrong":[{"pts":[[4,-2],[-4,2]],"fb":"Those are the vertical ones. Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical."}],"why":"`dy/dx = -(2x + y)/(x + 2y)`. Horizontal when `y = -2x`: `3x^2 = 12`, so `x = ±2`.","hints":["`dy/dx = -(2x + y)/(x + 2y)`.","Horizontal: `2x + y = 0`, so `y = -2x`.","`x^2 - 2x^2 + 4x^2 = 12`: `x = ±2`."]},{"id":"s6","goal":3,"star":true,"kind":"points","n":1, {"id":"e2","goal":5,"task":"Find `dy/dx` for `xy + y^2 = 10`.","steps":["`d/dx (xy) + d/dx (y^2) = 0`","`x dy/dx + 2y dy/dx = 0`","`dy/dx (x + 2y) = 0`, so `dy/dx = 0`"],"_a":"VQ==","stepFb":["Step 1 is correct.","","Step 3 follows. Look earlier."],"fixes":[{"t":"Step 2 is correct.","why":"`xy` is a product of two functions of `x`: `(1)(y) + x(dy/dx)`.","_n":"1o113","_k":"6badefcc"},{"t":"`y + 2y dy/dx = 0`","why":"The `x dy/dx` term is missing.","_n":"1p103","_k":"165a2bae"},{"t":"`dy/dx + 2y dy/dx = 0`","why":"`xy` is a product of two functions of `x`: `(1)(y) + x(dy/dx)`.","_n":"1q0f3","_k":"4b44e9ca"},{"t":"`y + x dy/dx + 2y dy/dx = 0`, so `dy/dx = -y/(x + 2y)`","why":"`xy` is a product of two functions of `x`: `(1)(y) + x(dy/dx)`.","_n":"1r0e3","_k":"8cd45735"}],"hints":["Differentiate `xy` with the product rule.","`y + x dy/dx`.","`-y/(x + 2y)`."]},{"id":"e3","goal":4,"task":"Find the points on `x^2 + 4y^2 = 16` with vertical tangents.","steps":["`2x + 8y dy/dx = 0`","`dy/dx = -x/(4y)`","Vertical tangents where the numerator is 0: `x = 0`.","`x = 0` gives `4y^2 = 16`, so (0, 2) and (0, −2)."],"_a":"Vg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. Look earlier."],"fixes":[{"t":"Step 3 is correct.","why":"Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical.","_n":"1s0d3","_k":"52b8f19a"},{"t":"Vertical where the denominator is 0: `y = 0`, so `x^2 = 16`: (4, 0) and (−4, 0).","why":"Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical.","_n":"1t0c3","_k":"b0334c45"},{"t":"(0, 2) only.","why":"That uses only the top half, and a vertical tangent still needs a zero denominator.","_n":"1u0b3","_k":"ac9ff6aa"},{"t":"Where `dy/dx = 1`.","why":"A slope of 1 isn’t vertical.","_n":"1v0a3","_k":"9b341662"}],"hints":["What slope does a vertical line have?","Undefined: a zero denominator.","`y = 0`: `(±4, 0)`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: that one formula handles both halves of a circle, or how a vertical tangent shows up?"},{"id":"j2","q":"In your own words, why does `d/dx (y^2)` need a factor `dy/dx` when `d/dx (x^2)` doesn’t?"},{"id":"j3","q":"Explain to a friend how to find the points on a curve where the tangent is horizontal, including how you get actual points."},{"id":"j4","q":"What still confuses you about implicit differentiation? What will you try next?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`y` is a function of `x`. What is `d/dx (y^3)`?","options":[{"t":"`3x^2`","why":"That’s `d/dx (x^3)`.","_n":"1w093","_k":"ca998e6b"},{"t":"`3y^2 dy/dx`","why":"Outer cube, inner `y`: the chain rule multiplies `3y^2` by `dy/dx`.","_n":"1x8c3","_k":"38d8b781"},{"t":"`3y^2`","why":"`y` depends on `x`, so `y^2` is a composite. The chain rule adds the factor `dy/dx`.","_n":"1y8d3","_k":"17638114"},{"t":"`3y^2 · x`","why":"The chain rule multiplies by `dy/dx`, not `x`.","_n":"1z8e3","_k":"60485552"}]},"b":{"prompt":"`y` is a function of `x`. What is `d/dx (y^4)`?","options":[{"t":"`4y^3 dy/dx`","why":"Outer fourth power, inner `y`: the chain rule multiplies `4y^3` by `dy/dx`.","_n":"208f3","_k":"2c3fac8d"},{"t":"`4y^3`","why":"`y` depends on `x`, so `y^2` is a composite. The chain rule adds the factor `dy/dx`.","_n":"21883","_k":"fbad1d51"},{"t":"`4y^3 · x`","why":"The chain rule multiplies by `dy/dx`, not `x`.","_n":"22893","_k":"2fb06367"},{"t":"`4x^3`","why":"That’s `d/dx (x^4)`.","_n":"238a3","_k":"2000af5e"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Find `dy/dx` for `x^2 + y^2 = 50`.","options":[{"t":"`-y/x`","why":"Upside down.","_n":"248b3","_k":"a2332c6a"},{"t":"−1","why":"`2x + 2y = 0` isn’t a derivative equation. `y` depends on `x`, so `y^2` is a composite. The chain rule adds the factor `dy/dx`.","_n":"25843","_k":"cb3fd069"},{"t":"`x/y`","why":"`2x + 2y dy/dx = 0` moves `2x` across with a minus.","_n":"26853","_k":"bcb2876f"},{"t":"`-x/y`","why":"`2x + 2y dy/dx = 0`, so `dy/dx = -2x/(2y) = -x/y`.","_n":"27f64","_k":"9767f4b9"}]},"b":{"prompt":"Find `dy/dx` for `x^2 - y^2 = 7`.","options":[{"t":"`y/x`","why":"Upside down.","_n":"28f54","_k":"cfd403d6"},{"t":"`x/y`","why":"`2x - 2y dy/dx = 0`, so `dy/dx = 2x/(2y) = x/y`.","_n":"29f84","_k":"8084e291"},{"t":"`-x/y`","why":"`2x - 2y dy/dx = 0` gives `2y dy/dx = 2x`: no minus survives.","_n":"2af74","_k":"cce3ade1"},{"t":"1","why":"`2x - 2y = 0` isn’t a derivative equation. `y` depends on `x`, so `y^2` is a composite. The chain rule adds the factor `dy/dx`.","_n":"2bfa4","_k":"696d60b0"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"`y` is a function of `x`. What is `d/dx (x^2y)`?","options":[{"t":"`2xy + x^2 dy/dx`","why":"Product rule: `(2x)(y) + (x^2)(dy/dx)`.","_n":"2cf94","_k":"a3233f7a"},{"t":"`2x dy/dx`","why":"Multiplies the derivatives. `x^2y` is a product: `(2x)(y) + x^2(dy/dx)`.","_n":"2dfc4","_k":"f2373dd4"},{"t":"`x^2 dy/dx`","why":"The `2xy` term is missing.","_n":"2efb4","_k":"e38c7518"},{"t":"`2xy`","why":"`y` isn’t constant. `y` changes as `x` changes. Only true constants differentiate to 0.","_n":"2ffe4","_k":"65a78800"}]},"b":{"prompt":"`y` is a function of `x`. What is `d/dx (xy^2)`?","options":[{"t":"`2y dy/dx`","why":"`xy^2` is a product of two functions of `x`: `(1)(y^2) + x(2y dy/dx)`.","_n":"2gfd4","_k":"2c43bcdc"},{"t":"`2xy dy/dx`","why":"`xy^2` is a product of two functions of `x`: the term `(1)(y^2)` is missing.","_n":"2h904","_k":"a0f3db4a"},{"t":"`y^2 + 2xy`","why":"`y^2` is a composite: the chain rule adds the factor `dy/dx`.","_n":"2i914","_k":"82ae5376"},{"t":"`y^2 + 2xy dy/dx`","why":"Product rule: `(1)(y^2) + x(2y dy/dx)`.","_n":"2j8e4","_k":"9c5dce9d"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Find the equation of the tangent to `x^2 + y^2 = 25` at (−3, 4).","options":[{"t":"`y = {4}/{3}x + 8`","why":"Upside-down slope.","_n":"2k8f4","_k":"e76493b8"},{"t":"`y = {3}/{4}x + {25}/{4}`","why":"Slope `-x/y = 3/4`; `y - 4 = {3}/{4}(x + 3)`.","_n":"2l8c4","_k":"78c0062d"},{"t":"`y = -{4}/{3}x`","why":"That’s the radius through (−3, 4), not the tangent.","_n":"2m8d4","_k":"1326dffc"},{"t":"`y = -{3}/{4}x + {7}/{4}`","why":"The sign of the slope comes from `-(-3)/4`.","_n":"2n8a4","_k":"4b53c77a"}]},"b":{"prompt":"Find the equation of the tangent to `x^2 + y^2 = 25` at (4, −3).","options":[{"t":"`y = {3}/{4}x - 6`","why":"Upside-down slope.","_n":"2o8b4","_k":"2088fc78"},{"t":"`y = -{4}/{3}x + {7}/{3}`","why":"The sign of the slope comes from `-4/(-3)`.","_n":"2p884","_k":"c0b14ed5"},{"t":"`y = -{3}/{4}x`","why":"That’s the radius.","_n":"2q894","_k":"05b946cd"},{"t":"`y = {4}/{3}x - {25}/{3}`","why":"Slope `-4/(-3) = 4/3`; `y + 3 = {4}/{3}(x - 4)`.","_n":"2r3a3","_k":"6374eabd"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Find the points on `x^2 - xy + y^2 = 3` where the tangent is horizontal.","options":[{"t":"`(0, √3)` and `(0, -√3)`","why":"Setting `x = 0` isn’t the condition for a flat tangent here.","_n":"2s3b3","_k":"09412c44"},{"t":"(2, 1) and (−2, −1)","why":"Those make the denominator 0: vertical tangents.","_n":"2t383","_k":"5b11258d"},{"t":"(1, 2) only","why":"`x = -1` also gives a point.","_n":"2u393","_k":"7475a975"},{"t":"(1, 2) and (−1, −2)","why":"`dy/dx = (y - 2x)/(2y - x)`; horizontal when `y = 2x`; then `3x^2 = 3`.","_n":"2v3e3","_k":"1ac7aaa5"}]},"b":{"prompt":"Find the points on `x^2 + xy + y^2 = 3` where the tangent is horizontal.","options":[{"t":"(−2, 1) and (2, −1)","why":"Those make the denominator 0: vertical tangents.","_n":"2w3f3","_k":"5124012c"},{"t":"(1, −2) only","why":"`x = -1` also gives a point.","_n":"2x3c3","_k":"f326a1ce"},{"t":"`(0, √3)` and `(0, -√3)`","why":"Setting `x = 0` isn’t the condition for a flat tangent here.","_n":"2y3d3","_k":"dff47054"},{"t":"(1, −2) and (−1, 2)","why":"`dy/dx = -(2x + y)/(x + 2y)`; horizontal when `y = -2x`; then `3x^2 = 3`.","_n":"2z423","_k":"8f41419f"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Use implicit differentiation on `y^5 = x^3` to find the derivative of `y = x^{3/5}`.","options":[{"t":"`{5}/{3}x^{2/3}`","why":"That’s the derivative of `x^{5/3}`: the fraction is upside down.","_n":"30433","_k":"883ad340"},{"t":"`{3}/{5}x^{3/5}`","why":"Subtract 1 from the exponent.","_n":"31403","_k":"b1892236"},{"t":"`{3}/{5}x^{-2/5}`","why":"`5y^4 dy/dx = 3x^2`, so `dy/dx = 3x^2/(5x^{12/5})`.","_n":"323f3","_k":"692262c1"},{"t":"`{3x^2}/{5}`","why":"The `5y^4` factor needs `dy/dx`, then `y^4` must be replaced.","_n":"33423","_k":"89d9a886"}]},"b":{"prompt":"Use implicit differentiation on `y^3 = x^5` to find the derivative of `y = x^{5/3}`.","options":[{"t":"`{5x^4}/{3}`","why":"The `3y^2` factor needs `dy/dx`, then `y^2` must be replaced.","_n":"34413","_k":"aa51235a"},{"t":"`{5}/{3}x^{5/3}`","why":"Subtract 1 from the exponent.","_n":"353c3","_k":"46dbdea4"},{"t":"`{3}/{5}x^{-2/5}`","why":"Upside-down fraction.","_n":"363b3","_k":"aee0eaee"},{"t":"`{5}/{3}x^{2/3}`","why":"`3y^2 dy/dx = 5x^4`, so `dy/dx = 5x^4/(3x^{10/3})`.","_n":"373e3","_k":"3b2be057"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `d/dx (y^2)` has a factor `dy/dx`?","options":[{"t":"“Because every derivative ends in `dy/dx`.”","why":"`d/dx (x^2) = 2x` has no `dy/dx`.","_n":"383d3","_k":"9d0abc1a"},{"t":"“`y` depends on `x`, so `y^2` is a composite: outer `u^2`, inner `y`. The chain rule multiplies `2y` by the inner derivative `dy/dx`.”","why":"`y` depends on `x`, so `y^2` is a composite. The chain rule adds the factor `dy/dx`.","_n":"39483","_k":"fb0d4d49"},{"t":"“Because `y` is a constant.”","why":"`y` changes as `x` changes. Only true constants differentiate to 0.","_n":"3a473","_k":"c5713b15"},{"t":"“It doesn’t: `d/dx (y^2) = 2y`.”","why":"`y` depends on `x`, so `y^2` is a composite. The chain rule adds the factor `dy/dx`.","_n":"3bce3","_k":"ded89f99"}]},"b":{"prompt":"Which is the best explanation of why `d/dx (xy) = y + x dy/dx`?","options":[{"t":"“Because you differentiate only the `y`.”","why":"`xy` is a product of two functions of `x`: `(1)(y) + x(dy/dx)`.","_n":"3ccf3","_k":"dc08aacf"},{"t":"“`xy` is a product of two functions of `x`, namely `x` and `y`, so the product rule gives `(1)(y) + (x)(dy/dx)`.”","why":"`xy` is a product of two functions of `x`: `(1)(y) + x(dy/dx)`.","_n":"3dd03","_k":"60657740"},{"t":"“Because `x` and `y` are both constants.”","why":"`y` changes as `x` changes. Only true constants differentiate to 0.","_n":"3ed13","_k":"ebd60163"},{"t":"“Because `d/dx (xy) = (dx/dx)(dy/dx)`.”","why":"That multiplies the derivatives. `xy` is a product of two functions of `x`: `(1)(y) + x(dy/dx)`.","_n":"3fca3","_k":"b8fa74b9"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"For a curve, `dy/dx = {x - 2}/{y + 1}`. Which statement is correct?","options":[{"t":"“Horizontal tangents can only be at points on the curve with `x = 2`; vertical tangents only at points on the curve with `y = -1`.”","why":"Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical. Combine the condition with the curve’s equation to find actual points.","_n":"3gcb3","_k":"8e9e029c"},{"t":"“Every point with `x = 2` has a horizontal tangent, whether or not it’s on the curve.”","why":"Combine the condition with the curve’s equation to find actual points.","_n":"3hcc3","_k":"c0ab8a61"},{"t":"“There are no vertical tangents, because `dy/dx` is a fraction.”","why":"A fraction with a zero denominator is undefined: that’s a vertical tangent.","_n":"3icd3","_k":"ec62ba43"},{"t":"“Horizontal tangents where `y = -1`; vertical tangents where `x = 2`.”","why":"Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical.","_n":"3jc62","_k":"936452e9"}]},"b":{"prompt":"For a curve, `dy/dx = {3 - y}/{x + 4}`. Which statement is correct?","options":[{"t":"“Horizontal tangents can only be at points on the curve with `y = 3`; vertical tangents only at points on the curve with `x = -4`.”","why":"Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical. Combine the condition with the curve’s equation to find actual points.","_n":"3kc73","_k":"fe420381"},{"t":"“Every point with `y = 3` has a horizontal tangent, whether or not it’s on the curve.”","why":"Combine the condition with the curve’s equation to find actual points.","_n":"3ld43","_k":"aedc5317"},{"t":"“Horizontal where `x = -4`; vertical where `y = 3`.”","why":"Numerator 0: slope 0, horizontal. Denominator 0: slope undefined, vertical.","_n":"3md33","_k":"1fc390bd"},{"t":"“There are no vertical tangents, because `dy/dx` is a fraction.”","why":"A fraction with a zero denominator is undefined: that’s a vertical tangent.","_n":"3nd23","_k":"5999f1a3"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A circular pond’s edge is `x^2 + y^2 = 100` (metres, centre at the origin). A straight path touches the edge at (6, −8). Where does the path cross the `y`-axis?","options":[{"t":"(0, −12.5)","why":"Slope `-6/(-8) = 3/4`; `y + 8 = {3}/{4}(x - 6)` at `x = 0`.","_n":"3od13","_k":"8ba8161a"},{"t":"(0, 0)","why":"A radius passes through the centre; the tangent path doesn’t.","_n":"3pd03","_k":"4b379bff"},{"t":"(0, −16)","why":"Slope 4/3 is upside down.","_n":"3qcf3","_k":"2050499d"},{"t":"(0, −3.5)","why":"Slope −3/4 is the wrong sign.","_n":"3rce3","_k":"0b29bea9"}]},"b":{"prompt":"The pond’s edge is `x^2 + y^2 = 25`. A path touches it at (−4, 3). Where does the path cross the `y`-axis?","options":[{"t":"(0, 6)","why":"Slope 3/4 is upside down.","_n":"3scd3","_k":"7e85fd31"},{"t":"(0, 25/3)","why":"Slope 4/3; `y - 3 = {4}/{3}(x + 4)` at `x = 0`.","_n":"3tcc3","_k":"f85dc432"},{"t":"(0, 0)","why":"That’s the radius.","_n":"3ucb3","_k":"90547535"},{"t":"(0, −7/3)","why":"Slope −4/3 is the wrong sign.","_n":"3vc22","_k":"65f8dbd1"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A racetrack follows the ellipse `x^2 + 4y^2 = 100` (metres). At which points is the track running exactly north–south (a vertical tangent)?","options":[{"t":"(10, 0) and (−10, 0)","why":"`dy/dx = -x/(4y)`; vertical when `y = 0`, so `x^2 = 100`.","_n":"3wc32","_k":"efdd85a6"},{"t":"`(±10, ±5)`","why":"These four points aren’t on the ellipse.","_n":"3xc02","_k":"77986c59"},{"t":"(10, 0) only","why":"`x = -10` works too.","_n":"3yc12","_k":"a4daf069"},{"t":"(0, 5) and (0, −5)","why":"Those have horizontal tangents.","_n":"3zbe2","_k":"c9e8bae5"}]},"b":{"prompt":"The track follows `x^2 + 9y^2 = 81`. At which points is the tangent vertical?","options":[{"t":"`(±9, ±3)`","why":"These four points aren’t on the ellipse.","_n":"40bf2","_k":"a9718939"},{"t":"(9, 0) only","why":"`x = -9` works too.","_n":"41bc2","_k":"3e0973b1"},{"t":"(0, 3) and (0, −3)","why":"Those have horizontal tangents.","_n":"42bd2","_k":"665902d9"},{"t":"(9, 0) and (−9, 0)","why":"`dy/dx = -x/(9y)`; vertical when `y = 0`, so `x^2 = 81`.","_n":"43ca2","_k":"cc1a4b5d"}]}}]},"task":{"title":"Tangent from the right quadrant","summary":"Tangent from the right quadrant","statement":"\u003cp>Choose a point P with whole-number coordinates on the circle `x^2 + y^2 = 50`, then write the tangent line at P as `y = mx + b`, so that every condition holds.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>P is on the circle.\u003c/li>\u003cli>The line has the tangent’s slope at P.\u003c/li>\u003cli>The line passes through P.\u003c/li>\u003cli>The line’s slope is positive.\u003c/li>\u003cli>The line’s `y`-intercept is positive.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">P’s coordinates are whole numbers from −10 to 10. Type `m` and `b` as whole numbers or fractions: a top box and a bottom box (leave the bottom empty for a whole number). The graph shows the circle, P and your line.\u003c/p>","checks":["P is on the circle","Slope matches the tangent","Passes through P","Slope positive","`y`-intercept positive"],"tips":["Whole-number points on `x^2 + y^2 = 50` use `1^2 + 7^2`,
