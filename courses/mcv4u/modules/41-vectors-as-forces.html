.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 41: hero equation colours, Force table (board, tabbed force panels, readout), Forces on a ramp stations,
   Hang the weight inputs. Prefix vf- (vector forces), vr- (vector ramp), hw- (hang the weight). */
.vf-hp .m{color:var(--pen)}
.vf-ht .m{color:var(--f3)}
.vf-ho .m{color:var(--f5)}
/* Explore */
.vf-ex{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.vf-main,.vf-side{min-width:0}
canvas.plot.vf-board{touch-action:pan-y}
.vf-key{margin:8px 0 0}
.vf-drift{margin:6px 0 0;font-weight:600;min-height:1.4em}
.vf-tabs{display:none;margin-bottom:8px}
.vf-fp{border-top:1px solid var(--rule);padding:8px 0 4px}
.vf-fp:first-of-type{border-top:0;padding-top:0}
.vf-fh{margin:0 0 4px;font-weight:700;font-size:.95rem;color:var(--ink)}
.vf-fh .m{color:var(--vf-c)}
.vf-fh::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;background:var(--vf-c);vertical-align:middle;margin-right:6px}
.vf-add{margin:4px 0 6px;min-height:34px}
.vf-fbody[hidden]{display:none}
.vf-sl{margin-top:6px}
.vf-sl input{width:100%;min-height:28px}
.vf-note{margin:4px 0 6px}
.vf-angs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 6px}
.vf-angs .chip{min-height:30px;min-width:42px;padding:2px 6px;font-size:.82rem}
.vf-seg{margin:10px 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vf-seg .seg{flex-wrap:wrap}
.vf-eqb[hidden]{display:none}
.vf-eqb{margin:6px 0}
.vf-read{margin-top:10px}
#vf-tbl .tbl-wrap{margin-top:8px}
@media (max-width:760px){
  .vf-ex{grid-template-columns:minmax(0,1fr)}
  .vf-tabs{display:flex}
  .vf-fp{display:none;border-top:0;padding-top:0}
  .vf-fp.on{display:block}
}
/* Part 3 */
.vr-stseg{margin:0 0 10px}
.vr-stseg .seg{flex-wrap:wrap}
.vr-wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.vr-main,.vr-side{min-width:0}
.vr-intro{margin:0 0 8px}
.vr-note{margin:8px 0 0;font-weight:600;min-height:1.4em}
.vr-sl{margin-top:8px;display:block}
.vr-sl input{width:100%;min-height:28px}
.vr-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.vr-chips .chip{min-height:32px;min-width:44px}
.vr-read{margin-top:10px}
#vr-c1[hidden],#vr-c2[hidden],#vr-alg[hidden]{display:none}
@media (max-width:760px){ .vr-wrap{grid-template-columns:minmax(0,1fr)} }
/* Task */
.hw-in-wrap{display:flex;flex-direction:column;gap:10px}
.hw-row{border:1.5px solid var(--rule);border-left:5px solid var(--vf-c);border-radius:8px;padding:6px 10px 10px;margin:0;display:flex;flex-wrap:wrap;gap:10px}
.hw-row legend{font-weight:700;padding:0 4px}
.hw-f{display:flex;align-items:center;gap:6px}
.hw-in{width:5.5em}

n R²","kind":"topic","group":"8"},{"nn":"50","slug":"equations-of-lines-in-r3","title":"Vector, Parametric and Symmetric Equations of Lines in R³","kind":"topic","group":"8"},{"nn":"51","slug":"vector-equation-of-a-plane","title":"Vector Equation of a Plane","kind":"topic","group":"8"},{"nn":"52","slug":"cartesian-equation-of-a-plane","title":"Cartesian Equation of a Plane","kind":"topic","group":"8"},{"nn":"53","slug":"intersection-of-lines-with-planes","title":"Intersection of Lines with Planes","kind":"topic","group":"9"},{"nn":"54","slug":"intersection-of-lines","title":"Intersection of Lines in R² and R³","kind":"topic","group":"9"},{"nn":"55","slug":"systems-of-equations-matrices","title":"Systems of Equations (Matrices)","kind":"topic","group":"9"},{"nn":"56","slug":"intersection-of-two-planes","title":"Intersection of Two Planes","kind":"topic","group":"9"},{"nn":"57","slug":"intersection-of-three-planes","title":"Intersection of Three Planes","kind":"topic","group":"9"},{"nn":"58","slug":"distance-point-to-line","title":"Distance from a Point to a Line in R² and R³","kind":"topic","group":"9"},{"nn":"59","slug":"distance-point-to-plane","title":"Distance from a Point to a Plane","kind":"topic","group":"9"}]},"salt":"c6b1942d","content":{"id":"41-vectors-as-forces","kind":"topic","title":"Vectors as forces","topic":"Vectors as Forces","readyTopic":"vectors as forces","hero":{"eq":"\u003cspan class=\"vf-hp\">`vec{F}_1`\u003c/span> + \u003cspan class=\"vf-ht\">`vec{F}_2`\u003c/span> + \u003cspan class=\"vf-ho\">`vec{F}_3`\u003c/span> = `vec{0}`","eqLabel":"vector F 1 plus vector F 2 plus vector F 3 equals the zero vector","eqSize":"md","headline":"Balanced doesn’t mean no forces","text":"Forces are \u003cstrong>vectors\u003c/strong>, so they add tip to tail. The single force with the same effect as all of them together is the \u003cstrong>resultant\u003c/strong>. When the forces cancel out completely, the object is in \u003cstrong>equilibrium\u003c/strong>, and the force that would cancel a resultant is called the \u003cstrong>equilibrant\u003c/strong>.","fig":{"aria":"A ring pulled by three ropes of 8 N each, 120° apart. The three forces slide tip to tail and close into an equilateral triangle: their sum is the zero vector. Then the orange rope is cut and the ring jerks toward the upper right: the resultant is 8 N at 60°.","shape":"wide"},"cap":{"start":"Three 8 N ropes pull on a ring, 120° apart. The ring sits still.","end":"Tip to tail the three forces close up: net force `vec{0}`. Cut the orange rope and the other two leave a resultant of 8 N at 60°."}},"goals":["I can treat forces as vectors and find the resultant of two or more forces using diagrams or components.","I can find the magnitude of the resultant of two forces using the angle between them and the cosine law.","I can find the equilibrant of a set of forces and explain what equilibrium means.","I can resolve a force into perpendicular components, including along and across a ramp.","I can solve force problems in context, including three forces in equilibrium."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Adding vectors","goal":1,"prompt":"Vectors `vec{u}` and `vec{v}` are perpendicular, with `|vec{u}| = 6` and `|vec{v}| = 8`. What is `|vec{u} + vec{v}|`?","options":[{"t":"2","why":"That’s for opposite directions.","_n":"0300","_k":"d930b8db"},{"t":"10","why":"Tip to tail they make a right triangle: `√(36 + 64) = 10`.","_n":"12d0","_k":"f63abd0e"},{"t":"14","why":"That only works if they point the same way.","_n":"22e0","_k":"dc9b5a27"},{"t":"100","why":"100 is `|vec{u} + vec{v}|^2`.","_n":"3330","_k":"7b819a27"}],"hints":["Draw `vec{v}` starting at the tip of `vec{u}`.","The sum is the hypotenuse of a right triangle.","`√(6^2 + 8^2) = 10`."]},{"id":"w2","skill":"Adding vectors","goal":3,"prompt":"Three vectors drawn tip to tail form a closed triangle. What is their sum?","options":[{"t":"A vector along the perimeter","why":"Vectors add as arrows, not lengths.","_n":"4340","_k":"ac57a193"},{"t":"It can’t be found without the lengths","why":"A closed path always sums to `vec{0}`.","_n":"5310","_k":"22b1dc47"},{"t":"The zero vector, `vec{0}`","why":"You end where you started.","_n":"6320","_k":"60bb3cc8"},{"t":"The longest side","why":"The longest side is only one of the three.","_n":"7370","_k":"587cb9e7"}],"hints":["Where does the last arrow end?","Back at the first tail.","So the sum is `vec{0}`."]},{"id":"w3","skill":"Cosine law","goal":2,"prompt":"In a triangle, sides of length 3 and 5 enclose an angle of 120°. How long is the third side?","options":[{"t":"8","why":"Sides add only along a straight line.","_n":"8380","_k":"9d79b66b"},{"t":"`√34`","why":"You dropped the angle term. That’s the right-angle case.","_n":"93ad","_k":"7d41b13f"},{"t":"`√19`","why":"You took `cos 120° = +1/2`. `cos 120° = -1/2`, so you add 15.","_n":"a39d","_k":"9a0df52f"},{"t":"7","why":"`c^2 = 9 + 25 - 2(3)(5) cos 120° = 34 + 15 = 49`.","_n":"b3cd","_k":"127f2c8d"}],"hints":["`c^2 = a^2 + b^2 - 2ab cos C`.","`cos 120° = -1/2`.","`c^2 = 34 + 15 = 49`, so `c = 7`."]},{"id":"w4","skill":"Cosine law","goal":2,"prompt":"Sides of length 4 and 4 enclose an angle of 60°. How long is the third side?","options":[{"t":"`4√2`","why":"You dropped the angle term. That’s for 90°.","_n":"c3bd","_k":"4e995662"},{"t":"8","why":"You added the sides. Sides add only along a straight line.","_n":"d3ed","_k":"848f3f16"},{"t":"`4√3`","why":"You took `cos 60° = -1/2`. `cos 60° = +1/2`.","_n":"e3dd","_k":"6b401586"},{"t":"4","why":"`16 + 16 - 32(1/2) = 16`. It’s equilateral.","_n":"f40d","_k":"15fed3e3"}],"hints":["`cos 60° = 1/2`.","`c^2 = 32 - 16`.","`c = 4`."]},{"id":"w5","skill":"Components","goal":4,"prompt":"A vector of magnitude 10 points 30° counterclockwise from the positive `x`-axis. What are its components?","options":[{"t":"`(5, 5√3)`","why":"Sine and cosine are swapped. That vector is at 60°.","_n":"g3fd","_k":"b2933b22"},{"t":"`(5√2, 5√2)`","why":"Those are the components at 45°.","_n":"h32d","_k":"ec4f45ad"},{"t":"`(5√3, 5)`","why":"`(10 cos 30°, 10 sin 30°)`.","_n":"i31d","_k":"23bc52ac"},{"t":"`(10, 30)`","why":"Those are the magnitude and the angle. Components are lengths along the axes.","_n":"ja8d","_k":"a61c58cb"}],"hints":["`x = r cos θ`, `y = r sin θ`.","`cos 30° = √3/2`, `sin 30° = 1/2`.","`(5√3, 5)`."]},{"id":"w6","skill":"Components","goal":4,"prompt":"A rope pulls with 20 N at 60° above the horizontal. What is the vertical component of the pull?","options":[{"t":"10 N","why":"You used cosine. That’s the horizontal part.","_n":"ka9d","_k":"27fab41f"},{"t":"`20√3` N","why":"Tangent compares the two components; it isn’t one of them.","_n":"laad","_k":"75f19408"},{"t":"20 N","why":"Only part of the pull is upward.","_n":"mabd","_k":"73723ce6"},{"t":"`10√3` N","why":"`20 sin 60° = 20(√3/2)`.","_n":"nacd","_k":"7ea3b647"}],"hints":["Vertical is opposite the 60° angle.","Use sine.","`20 sin 60° = 10√3` N."]}],"refreshers":{"Adding vectors":"Put each arrow’s tail at the previous tip; the sum runs from the first tail to the last tip. A closed loop sums to `vec{0}`.","Cosine law":"`c^2 = a^2 + b^2 - 2ab cos C`, where `C` is the angle \u003cem>between\u003c/em> sides `a` and `b`. Remember `cos 120° = -1/2` and `cos 60° = 1/2`.","Components":"A vector of length `r` at angle `θ` from the positive `x`-axis is `(r cos θ, r sin θ)`. Cosine goes with the side next to the angle."}}},"explore":{"heading":"Force table","intro":"Ropes pull on a ring with different forces. Set each force and see the single force that has the same effect, and the force that would hold the ring still.","modes":[{"id":"res","t":"Resultant"},{"id":"eq","t":"Equilibrant"},{"id":"comp","t":"Components"}],"setups":[{"id":"free","t":"Free play"},{"id":"tc1","t":"Challenge 1"},{"id":"tc2","t":"Challenge 2"},{"id":"tc3","t":"Challenge 3"}],"txt":{"forces":["Force `vec{F}_1`","Force `vec{F}_2`","Force `vec{F}_3`"],"tabs":"Choose a force to set","mag":"Magnitude","dir":"Direction","dirNote":"Counterclockwise from the positive `x`-axis.","angles":"Special angles","add3":"Add a third force","locked":"Locked for this challenge","mode":"Mode","setup":"Set up","setupNote":"Challenges 1 and 3 lock some forces; challenge 3 hides the resultant’s size.","pinOut":"Remove the pin","pinIn":"Put the pin back","attach":"Attach `vec{E}` as a rope","detach":"Take `vec{E}` off","measured":"Directions are measured counterclockwise from the positive `x`-axis.","rows":{"f1":"`vec{F}_1`","f2":"`vec{F}_2`","f3":"`vec{F}_3`","between":"Angle between `vec{F}_1` and `vec{F}_2`","res":"Resultant `vec{R}`","eq":"Equilibrant `vec{E}`","status":"Status"},"off":"(off)","hidden":"hidden for challenge 3","noE":"none needed: the net force is already `vec{0}`","bal":"Equilibrium: the forces balance (net force `vec{0}`)","notBal":"Not in equilibrium: net force #1","held":"With `vec{E}` attached the net force is `vec{0}`: the ring stays put.","drift":"The ring would move toward #1.","driftMove":"Pin out: the ring moves toward #1.","stays":"Pin out: the net force is `vec{0}`, so the ring stays put.","keyRes":"`vec{F}_1` blue, `vec{F}_2` teal, `vec{F}_3` orange, drawn from the ring; faint copies continue tip to tail; the resultant `vec{R}` is the thick black arrow.","keyEq":"The equilibrant `vec{E} = -vec{R}` is the black dashed arrow; adding it closes the tip-to-tail chain.","keyComp":"Each force splits into a dashed `x`-part and `y`-part; the table adds the columns.","compHead":["Force","`x`-part (N)","`y`-part (N)"],"sumRow":"Sum `vec{R}`"},"predIntro":"Make a prediction first. Then the force table shows you what really happens.","predictions":[{"id":"p1","prompt":"`vec{F}_1 = 6` N at 0°, `vec{F}_2 = 8` N at 90°. What is the magnitude of the resultant?","options":[{"t":"2 N","_n":"oadd","_k":"602a4296"},{"t":"14 N","_n":"paed","_k":"48d33c18"},{"t":"10 N","_n":"qafd","_k":"a551ac01"},{"t":"7 N","_n":"rb0d","_k":"a8ead986"}],"explain":"Right angle between the forces: `√(36 + 64) = 10` N. Adding 6 + 8 assumes they point the same way."},{"id":"p2","prompt":"Two 10 N forces both point at 0°. Then `vec{F}_2` rotates slowly from 0° to 180°. What happens to the magnitude of the resultant?","options":[{"t":"It stays 20 N","_n":"sb1d","_k":"0400b162"},{"t":"It shrinks to 10 N and stays there","_n":"t2ed","_k":"b222fcad"},{"t":"It grows","_n":"u2dd","_k":"2ce6ab89"},{"t":"It shrinks from 20 N to 0 N","_n":"v2cd","_k":"00db098e"}],"explain":"The more the forces oppose each other, the more they cancel. On the way the resultant passes `10√2` N at 90° and reaches 0 at 180°."},{"id":"p3","prompt":"Two 10 N forces have 120° between them. What is the magnitude of the resultant?","options":[{"t":"0 N","_n":"w2bd","_k":"9e41549d"},{"t":"10 N","_n":"x32d","_k":"7cd72fca"},{"t":"20 N","_n":"y31d","_k":"f1e1d42f"},{"t":"`10√3` N","_n":"z30d","_k":"4b10e8a9"}],"explain":"Tip to tail, the angle opposite the resultant is 180° − 120° = 60°: `|vec{R}|^2 = 100 + 100 - 200 cos 60° = 100`. Using 120° in that triangle gives `10√3`, the angle mix-up."},{"id":"p4","prompt":"`vec{F}_1 = 3` N at 0°, `vec{F}_2 = 4` N at 90°, Equilibrant mode. Which single force would hold the ring still?","options":[{"t":"7 N, down and to the left","_n":"102fd","_k":"460838e5"},{"t":"No force: the ring is already balanced","_n":"1136d","_k":"c5cc49bf"},{"t":"5 N, opposite the resultant (down and to the left)","_n":"1235d","_k":"f0baf928"},{"t":"5 N, in the same direction as the resultant","_n":"13ace","_k":"017d00c1"}],"explain":"The resultant is 5 N up and to the right; the equilibrant has the same size and points the opposite way."}],"chalIntro":"Choose \u003cstrong>Set up: Challenge 1, 2 or 3\u003c/strong> above the board (it locks the given forces), set the forces, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"`vec{F}_1 = 8` N at 0° and `vec{F}_2 = 8` N at 120° are locked. Set `vec{F}_3` so the ring is in equilibrium.","why":"The resultant of `vec{F}_1` and `vec{F}_2` is `(4, 4√3)`: 8 N at 60°. Reversed, it’s 8 N at 240°.","hints":["Find the resultant of `vec{F}_1` and `vec{F}_2` first.","`(8, 0) + (-4, 4√3) = (4, 4√3)`: 8 N at 60°.","Reverse it: 8 N at 240°."],"msgs":{"setup":"Choose \u003cstrong>Set up: Challenge 1\u003c/strong> first, so that `vec{F}_1 = 8` N at 0° and `vec{F}_2 = 8` N at 120°.","on3":"Add the third force and set it.","res":"That’s the resultant itself. It doubles the pull instead of cancelling it.","dbl":"Right direction, but the resultant of two 8 N forces at 120° is only 8 N.","close":"Close. Check the components: the resultant is `(4, 4√3)`.","general":"The ring isn’t balanced yet: the net force is #1. Make `vec{F}_3` cancel the resultant of the other two."}},{"id":"tc2","goal":2,"prompt":"Set `vec{F}_1` and `vec{F}_2` to 10 N each, at directions that make the resultant exactly 10 N.","why":"With 120° between them, `|vec{R}|^2 = 100 + 100 + 200 cos 120° = 100`.","hints":["As the angle opens, the resultant shrinks.","`|vec{R}|^2 = 100 + 100 + 200 cos θ = 100`, so `cos θ = -1/2`.","`θ = 120°`."],"msgs":{"off3":"Turn the third force off for this challenge.","mags":"Set both magnitudes to 10 N.","a60":"The resultant is `10√3` N: at 60° the forces mostly help each other.","a90":"`10√2` N. Open the angle further.","general":"The resultant is #1, not 10 N. Change the angle between the forces."}},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"`vec{F}_1 = 4` N at 0° is locked. Choose `vec{F}_2` so the resultant points straight up (90°) with magnitude `4√3` N. (The resultant readout is hidden for this challenge; only the arrow shows.)","why":"`vec{F}_2 = vec{R} - vec{F}_1 = (0, 4√3) - (4, 0) = (-4, 4√3)`: 8 N at 120°.","hints":["`vec{F}_2 = vec{R} - vec{F}_1`.","`(0, 4√3) - (4, 0) = (-4, 4√3)`.","Magnitude `√(16 + 48) = 8`; the direction is in quadrant 2 with `tan θ = -√3`, so 120°."],"msgs":{"setup":"Choose \u003cstrong>Set up: Challenge 3\u003c/strong> first, so that `vec{F}_1 = 4` N at 0°.","off3":"Turn the third force off for this challenge.","a90":"The resultant is `(4, 8)`: it leans right.","m4":"Resultant `(2, 2√3)` leans right.","m7":"Close, but the horizontal parts don’t cancel: you need −4 in the `x`-component.","general":"Not yet: the resultant must be `(0, 4√3)`. Work out `vec{R} - vec{F}_1`."}}]},"part3":{"slug":"ramp","name":"Ramp","heading":"Forces on a ramp","intro":"Resolving a force is the move that makes most force problems solvable, and the ramp is the classic case where the angle sits in a surprising place. Split the weight on a ramp, then a rope’s pull on a sled. Then try the quick check.","txt":{"stations":[{"id":"s1","t":"Station 1: the rotating split"},{"id":"s2","t":"Station 2: pulling at an angle"}],"s1Intro":"A block rests on a frictionless ramp. Its weight (black, straight down) splits into a blue part \u003cstrong>along\u003c/strong> the slope and a teal part \u003cstrong>into\u003c/strong> the slope. The two parts form a rectangle with the weight as its diagonal.","s2Intro":"A sled is pulled by a rope at angle `α` above the horizontal. The tension splits into a horizontal part (it moves the sled) and a vertical part (it lifts it).","ramp":"Ramp angle `θ`","weight":"Weight `W`","alpha":"Rope angle `α`","tension":"Tension `T`","why":"Why is the angle `θ` here?","whyDone":"The ramp’s angle `θ` reappears between the weight and the line into the slope: both are 90° minus the same angle.","along":"Along the slope: ","into":"Into the slope: ","hold":"Force needed to hold the block: ","up":" up the slope","horiz":"Horizontal part: ","vert":"Vertical part: ","allLift":"All lift, no forward pull.","flatRamp":"A flat floor: no part of the weight acts along it.","alg":"Check it with algebra","algHTML":"\u003cp>Take axes along the ramp (down the slope is negative) and across it (into the slope is negative). Then `vec{W} = (-W sin θ, -W cos θ)`.\u003c/p>\u003cp>Its length is right: `|vec{W}|^2 = W^2(sin^2 θ + cos^2 θ) = W^2`.\u003c/p>"},"quickCheck":{"title":"Quick check","summary":"Forces on a ramp quick check","items":[{"id":"q1","goal":4,"prompt":"A 40 N box rests on a 30° ramp. What is the component of its weight along the slope?","choices":[{"t":"`40√3` N","fb":"Use `40 sin 30°`.","_n":"14ade","_k":"a58bba69"},{"t":"`20√3` N","fb":"That’s the part into the slope.","_n":"15aae","_k":"4308a7d1"},{"t":"20 N","fb":"Right. `40 sin 30° = 20` N.","_n":"16abe","_k":"ee9cf666"},{"t":"40 N","fb":"Only part of the weight acts along the slope.","_n":"17b0e","_k":"e9830ecb"}]},{"id":"q2","goal":4,"prompt":"As the ramp gets steeper, the component into the slope…","choices":[{"t":"stays the same","fb":"`W cos θ` falls as `θ` grows.","_n":"18b1e","_k":"5ef6c605"},{"t":"becomes negative","fb":"`W cos θ` falls as `θ` grows.","_n":"19aee","_k":"b0af6a49"},{"t":"increases","fb":"`W cos θ` falls as `θ` grows.","_n":"1aafe","_k":"60b55e72"},{"t":"decreases","fb":"Right. `W cos θ` falls as `θ` grows.","_n":"1bb4e","_k":"f25eff85"}]},{"id":"q3","goal":4,"prompt":"At what ramp angle are the two components equal?","choices":[{"t":"30°","fb":"`sin θ = cos θ` only at 45°.","_n":"1cb5e","_k":"93fef5b6"},{"t":"90°","fb":"`sin θ = cos θ` only at 45°.","_n":"1db2e","_k":"b9293db2"},{"t":"60°","fb":"`sin θ = cos θ` only at 45°.","_n":"1eb1e","_k":"d9724e50"},{"t":"45°","fb":"Right. `sin θ = cos θ` only at 45°.","_n":"1fb4e","_k":"8187d951"}]},{"id":"q4","goal":4,"prompt":"A sled is pulled with 50 N along a rope at 60° above the horizontal. What is the horizontal component?","choices":[{"t":"100 N","fb":"A component can’t be bigger than the force: use `50 cos 60°`.","_n":"1gb3e","_k":"51d5b668"},{"t":"`25√3` N","fb":"That’s the vertical part.","_n":"1haee","_k":"595a3cb0"},{"t":"25 N","fb":"Right. `50 cos 60° = 25` N.","_n":"1iade","_k":"5dba8bb7"},{"t":"50 N","fb":"Only part of the pull is horizontal: use `50 cos 60°`.","_n":"1jb0e","_k":"2a82a836"}]}]}},"practice":{"activities":[{"id":"balance","type":"sorter","title":"Balanced or not?","summary":"Balanced or not?","goal":[3,5],"noun":"set of forces","instruction":"Decide whether each set of forces on a ring is in equilibrium.","how":"Tap a set of forces, then tap the box it belongs in. Directions are counterclockwise from the positive `x`-axis.","boxes":[{"id":"b1","label":"In equilibrium"},{"id":"b2","label":"Not in equilibrium"}],"wrongDefault":"Add the `x`-components and the `y`-components: both sums must be 0 for equilibrium.","items":[{"id":"i1","t":"`(3, 4)` N and `(-3, -4)` N","_a":"QVRTEw==","why":"Opposite forces cancel.","wrong":{"b2":"Add them: each component cancels."}},{"id":"i2","t":"5 N at 0°, 5 N at 120°, 5 N at 240°","_a":"QVRTEw==","why":"Equal forces 120° apart close an equilateral triangle.","wrong":{"b2":"Draw them tip to tail: three equal sides with equal turns close up."}},{"id":"i3","t":"10 N at 0°, 10 N at 90°, 10 N at 225°","_a":"QVRQEw==","why":"The first two make `10√2` N at 45°; a 10 N force can’t cancel it.","wrong":{"b1":"The directions look balanced, but the magnitudes don’t: the first two give `10√2` N."}},{"id":"i4","t":"10 N at 0°, 10 N at 90°, `10√2` N at 225°","_a":"QVRTEw==","why":"`10√2` N at 225° is exactly the equilibrant.","wrong":{"b2":"Find the resultant of the first two forces, then compare it with the third."}},{"id":"i5","t":"`(2, 5)` N, `(-6, 1)` N, `(4, -6)` N","_a":"QVRTEw==","why":"`x`: 2 − 6 + 4 = 0; `y`: 5 + 1 − 6 = 0.","wrong":{"b2":"Add the `x`-components, then the `y`-components."}},{"id":"i6","t":"`(2, 5)` N, `(-6, 1)` N, `(4, -5)` N","_a":"QVRQEw==","why":"The `y`-components add to 1.","wrong":{"b1":"Add the `y`-components: 5 + 1 − 5 = 1."}},{"id":"i7","t":"3 N, 4 N and 8 N, in any directions","_a":"QVRQEw==","why":"Three balanced forces form a triangle, but 3 + 4 \u003c 8: the sides can’t meet.","wrong":{"b1":"Try to draw the triangle: the 3 N and 4 N sides can’t reach across 8 N."},"hints":["Balanced forces close up tip to tail.","Three forces close into a triangle.","3 + 4 \u003c 8, so no triangle exists."]},{"id":"i8","t":"6 N at 30°, 6 N at 150°, 6 N at 270°","_a":"QVRTEw==","why":"`x`: `3√3 - 3√3 + 0 = 0`; `y`: 3 + 3 − 6 = 0.","wrong":{"b2":"Add the `x`-components, then the `y`-components."},"hints":["Add the `x`-components, then the `y`-components.","`6 cos 30° + 6 cos 150° + 6 cos 270° = 3√3 - 3√3 + 0`.","Both sums are 0: equilibrium."]}]},{"id":"resnum","type":"numeric","title":"Resultants and equilibrants","summary":"Resultants and equilibrants","goal":[2,3,5],"star":true,"instruction":"Find each magnitude or angle. Items 5 to 7 are non-routine; 6 and 7 go beyond the Final Check.","how":"Type a number, then press Check. Exact forms such as `3√19` (type sqrt for √) are fine.","items":[{"id":"r1","goal":2,"prompt":"Forces of 9 N and 12 N act at right angles. Magnitude of the resultant?","_a":"UgM=","unit":"N","display":"15 N","why":"`√(81 + 144) = √225 = 15`.","wrong":[{"match":21,"fb":"Magnitudes add only when the forces point the same way. At right angles, use Pythagoras."}],"hints":["Tip to tail the forces make a right triangle.","`|vec{R}|^2 = 9^2 + 12^2`.","`√225 = 15` N."]},{"id":"r2","goal":2,"prompt":"Forces of 11 N and 24 N act with 60° between them. Magnitude of the resultant?","_a":"UAc=","unit":"N","display":"31 N","why":"`121 + 576 + 2(11)(24) cos 60° = 697 + 264 = 961`.","wrong":[{"match":20.808652046684813,"fb":"You used `- 2ab cos 60°`; tip to tail the angle is 120°."}],"hints":["Use `|vec{R}|^2 = a^2 + b^2 + 2ab cos θ` with the angle between the forces.","`121 + 576 + 264`.","`√961 = 31` N."]},{"id":"r3","goal":2,"prompt":"Forces of 7 N and 40 N act with 120° between them. Magnitude of the resultant?","_a":"UAE=","unit":"N","display":"37 N","why":"`49 + 1600 + 2(7)(40) cos 120° = 1649 - 280 = 1369`.","wrong":[{"match":43.9203825119955,"fb":"Drawn tip to tail, the angle opposite the resultant is 180° − θ. Use `|vec{R}|^2 = a^2 + b^2 + 2ab cos θ`, or components."}],"hints":["`cos 120° = -1/2`.","`49 + 1600 - 280`.","`√1369 = 37` N."]},{"id":"r4","goal":3,"prompt":"Forces of 6 N and 10 N act with 60° between them. Magnitude of the equilibrant?","_a":"UgI=","unit":"N","display":"14 N","why":"Same magnitude as the resultant: 36 + 100 + 60 = 196.","wrong":[{"match":8.717797887081348,"fb":"Drawn tip to tail, the angle opposite the resultant is 180° − θ. Use `|vec{R}|^2 = a^2 + b^2 + 2ab cos θ`, or components."},{"match":16,"fb":"Magnitudes add only when the forces point the same way. At right angles, use Pythagoras."}],"hints":["The equilibrant has the same magnitude as the resultant.","`36 + 100 + 2(6)(10) cos 60°`.","`√196 = 14` N."]},{"id":"r5","goal":5,"star":true,"prompt":"Forces of 5 N and `F` N act with 120° between them, and their resultant is 19 N. Find `F`.","_a":"UQc=","unit":"N","display":"`F = 21`","why":"`25 + F^2 - 5F = 361`, so `F^2 - 5F - 336 = 0 = (F - 21)(F + 16)`.","wrong":[{"match":-16,"fb":"A magnitude can’t be negative: reject −16."}],"hints":["Use `|vec{R}|^2 = a^2 + b^2 + 2ab cos θ`.","`361 = 25 + F^2 - 5F`.","`F = 21` (reject −16)."]},{"id":"r6","goal":5,"star":true,"prompt":"Three forces of 7 N, 15 N and 13 N hold a ring in equilibrium. Find the angle between the 7 N and 15 N forces, in degrees.","_a":"UgRS","unit":"°","display":"120°","why":"`169 = 49 + 225 + 210 cos θ`, so `cos θ = -1/2` and `θ = 120°`.","wrong":[{"match":60,"fb":"That’s the angle inside the triangle; the angle between the forces is its supplement."}],"hints":["The 7 N and 15 N forces must have a resultant equal in size to the third force.","`169 = 49 + 225 + 210 cos θ`.","`cos θ = -1/2`, so `θ = 120°`."]},{"id":"r7","goal":5,"star":true,"prompt":"Forces of 10 N, 10 N and `10√2` N hold a ring in equilibrium. Find the angle between the two 10 N forces, in degrees.","_a":"WgY=","unit":"°","display":"90°","why":"`(10√2)^2 = 100 + 100 + 200 cos θ`, so `cos θ = 0`.","wrong":[{"match":45,"fb": ngle correctly. The mistake is earlier."],"fixes":[{"t":"The angle is 30°.","why":"Half the angle isn’t in the triangle.","_n":"1o41d","_k":"a12b696b"},{"t":"Use `|vec{R}|^2 = 306 + 270 cos 120°`.","why":"That mixes the two forms and gives 171 again.","_n":"1p42d","_k":"762e2887"},{"t":"The triangle’s angle is 180° − 60° = 120°, so `|vec{R}|^2 = 306 + 135 = 441` and `|vec{R}| = 21` N.","why":"Neighbouring angles in a parallelogram add to 180°.","_n":"1q43d","_k":"defb3d5c"},{"t":"Step 3 is correct.","why":"Drawn tip to tail, the angle opposite the resultant is 180° − θ. Use `|vec{R}|^2 = a^2 + b^2 + 2ab cos θ`, or components.","_n":"1r3cd","_k":"5ca4575d"}],"hints":["In a parallelogram, neighbouring angles add to 180°.","The triangle’s angle is 120°.","`cos 120° = -1/2`: 306 + 135 = 441."]},{"id":"e3","goal":4,"task":"A 60 N crate rests on a frictionless 30° ramp. What force along the ramp holds it still?","steps":["The weight, 60 N, points straight down.","Split the weight into parts along and into the ramp.","The angle between the weight and the line into the ramp is 30°.","So the part along the ramp is `60 cos 30° = 30√3` N.","A force of `30√3` N up the ramp holds the crate."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct: it matches the ramp’s angle.","","Step 5 follows step 4. The mistake is earlier."],"fixes":[{"t":"60 N, the full weight.","why":"Only part of the weight acts along the ramp.","_n":"1s3dd","_k":"bbca361b"},{"t":"`60 tan 30° = 20√3` N.","why":"Tangent compares two parts; it isn’t one of them.","_n":"1t3ed","_k":"c8bfe261"},{"t":"The part along the ramp is opposite the 30° angle: `60 sin 30° = 30` N.","why":"The side next to the 30° angle is the part into the ramp; the part along it is opposite.","_n":"1u3fd","_k":"49f566e8"},{"t":"Step 4 is correct.","why":"The angle between the weight and the line \u003cem>into\u003c/em> the slope is `θ`, so the part \u003cem>along\u003c/em> the slope is opposite it: `W sin θ`.","_n":"1v38d","_k":"5f034222"}],"hints":["Which side of the rectangle is next to the 30° angle?","The part into the ramp is next to it.","Along = `60 sin 30° = 30` N."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the force table: how fast the resultant shrank as the angle opened, or that a ‘balanced’ ring can have three big forces on it?"},{"id":"j2","q":"In your own words, what is the difference between the resultant and the equilibrant?"},{"id":"j3","q":"Explain to a friend how to find the part of a weight that pulls a box down a ramp, and why it’s sine and not cosine."},{"id":"j4","q":"Which step still trips you up: the angle in the cosine law, or choosing sine or cosine? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":3,"a":{"prompt":"The resultant of a set of forces is 12 N at 40° (counterclockwise from the positive `x`-axis). What is the equilibrant?","options":[{"t":"12 N at 40°","why":"That’s the resultant. The equilibrant cancels the resultant: same magnitude, opposite direction (add 180°).","_n":"1w39d","_k":"362045d2"},{"t":"12 N at 140°","why":"180° − 40° reflects the direction; it doesn’t reverse it.","_n":"1xc6e","_k":"91679f59"},{"t":"12 N at 220°","why":"Same size, opposite direction: 40° + 180°.","_n":"1yc5e","_k":"441f311c"},{"t":"12 N at 130°","why":"Adding 90° gives a perpendicular force.","_n":"1zc4e","_k":"5c73451d"}]},"b":{"prompt":"The resultant is 9 N at 150° (counterclockwise from the positive `x`-axis). What is the equilibrant?","options":[{"t":"9 N at 330°","why":"Same size, opposite direction: 150° + 180°.","_n":"20c3e","_k":"afe6f25a"},{"t":"9 N at 150°","why":"That’s the resultant. The equilibrant cancels the resultant: same magnitude, opposite direction (add 180°).","_n":"21c2e","_k":"21e4b495"},{"t":"9 N at 240°","why":"Adding 90° gives a perpendicular force.","_n":"22c1e","_k":"38724cf1"},{"t":"9 N at 30°","why":"180° − 150° reflects the direction; it doesn’t reverse it.","_n":"23c0e","_k":"4475f4a1"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Forces of 20 N and 21 N act on an object at right angles. What is the magnitude of the resultant?","options":[{"t":"`√41` N","why":"Square each force before adding.","_n":"24bfe","_k":"cdc5e6af"},{"t":"41 N","why":"Magnitudes add only when the forces point the same way. At right angles, use Pythagoras.","_n":"25bee","_k":"ccbe6e15"},{"t":"1 N","why":"That’s for opposite forces.","_n":"26bde","_k":"d33cc967"},{"t":"29 N","why":"`√(400 + 441) = √841`.","_n":"2744e","_k":"4a105387"}]},"b":{"prompt":"Forces of 12 N and 35 N act at right angles. Magnitude of the resultant?","options":[{"t":"47 N","why":"Magnitudes add only when the forces point the same way. At right angles, use Pythagoras.","_n":"2845e","_k":"d0a5dfb6"},{"t":"23 N","why":"That’s for opposite forces.","_n":"2942e","_k":"89bae1dc"},{"t":"`√47` N","why":"Square each force before adding.","_n":"2a43e","_k":"2eca8c79"},{"t":"37 N","why":"`√(144 + 1225) = √1369`.","_n":"2b40e","_k":"103e7cb6"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A force of 30 N acts at 60° above the horizontal. What are its horizontal and vertical components?","options":[{"t":"`(15, 15)` N","why":"The two parts are equal only at 45°, and even then they’d be `15√2`.","_n":"2c41e","_k":"baecf589"},{"t":"`(30, 60)`","why":"Those are the magnitude and angle, not components.","_n":"2d3ee","_k":"4b2d00cb"},{"t":"`(15√3, 15)` N","why":"The side next to the angle uses cosine: horizontal = `F cos θ` when `θ` is measured from the horizontal.","_n":"2e3fe","_k":"9fad6f45"},{"t":"`(15, 15√3)` N","why":"`(30 cos 60°, 30 sin 60°)`.","_n":"2f3ce","_k":"a8c59cd0"}]},"b":{"prompt":"A force of 16 N acts at 30° above the horizontal. What are its horizontal and vertical components?","options":[{"t":"`(8√3, 8)` N","why":"`(16 cos 30°, 16 sin 30°)`.","_n":"2g3de","_k":"d7775596"},{"t":"`(8√3, 8√3)` N","why":"The two parts are equal only at 45°.","_n":"2haaf","_k":"73338e4c"},{"t" nitude in newtons (N) plus a direction. Forces add tip to tail."],["Resultant","The single force with the same effect as all the forces together: their vector sum."],["Equilibrium","Net force `vec{0}`: the forces close up tip to tail. Forces still act."],["Equilibrant","Same magnitude as the resultant, opposite direction (add 180°)."],["Two forces, angle `θ` between them","`|vec{R}|^2 = a^2 + b^2 + 2ab cos θ`"],["The tip-to-tail triangle","Its angle opposite the resultant is 180° − `θ`."],["At right angles","`|vec{R}| = √(a^2 + b^2)`; e.g. 9 N and 12 N give 15 N."],["Components of a force","`(F cos θ, F sin θ)` for `θ` measured from the positive `x`-axis."],["Weight on a ramp at angle `θ`","Along the slope `W sin θ`; into the slope `W cos θ`."],["Three balanced forces","They form a triangle, so each magnitude is less than the sum of the other two."],["Equal forces in equilibrium","Three equal forces balance when they’re 120° apart."],["Balancing with components","Σ(`x`-components) = 0 and Σ(`y`-components) = 0."]]}};</script>
