.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 57: Three-plane configurator (Explore), V13 matrices, Algebra meets geometry stations, Solve the system, task */
.tp-c1{color:var(--pen);font-weight:700}
.tp-c2{color:var(--f3);font-weight:700}
.tp-c3{color:var(--f5);font-weight:700}
.tp-3d canvas{touch-action:pan-y;cursor:grab}
.tp-3d canvas:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

/* Explore layout: view left; controls and readout right. Phone: one column; Row-reduce puts the matrix above the view. */
.tp-ex{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"main ctrl" "main read";gap:12px 26px;align-items:start}
.tp-main{grid-area:main;min-width:0}
.tp-ctrl{grid-area:ctrl;min-width:0}
.tp-readw{grid-area:read;min-width:0}
.tp-vhow{margin:4px 0 6px}
.tp-tog{margin-top:4px}
.tp-how{margin:6px 0 10px}
.tp-read{margin-top:0}
.tp-read dd{overflow-wrap:anywhere}
.tp-rsay{display:block;margin-top:4px}
.tp-lab{font-weight:700;margin:10px 0 4px}
@media (max-width:760px){
  .tp-ex{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "ctrl" "read"}
  .tp-ex.tp-rr{grid-template-areas:"ctrl" "main" "read"}
}

/* gallery cards: a grid on wide screens, a horizontal carousel on phones */
.tp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tp-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px;cursor:pointer;min-height:44px}
.tp-card:hover{border-color:var(--ink-2)}
.tp-card[aria-pressed="true"]{border:2px solid var(--ink);background:var(--hi-soft)}
.tp-cn{font-weight:700;font-size:.92rem;line-height:1.25}
.tp-cc{font-size:.82rem;color:var(--ink-2)}
@media (max-width:760px){
  .tp-cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .tp-card{flex:0 0 150px;scroll-snap-align:start}
}
.tp-eqs{display:flex;flex-direction:column;gap:3px}
.tp-fixed{display:flex;flex-direction:column;gap:2px;margin:0 0 6px}
.tp-p3eq{font-size:1.1rem;margin:6px 0}
.tp-sls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.tp-sls output{color:var(--ink);font-weight:700}

/* V13 matrices */
.tp-mw{display:inline-flex;align-items:stretch;gap:6px;margin:4px 0;max-width:100%;overflow-x:auto}
.tp-rls{display:flex;flex-direction:column;justify-content:space-around;padding:3px 0;font-size:.85rem}
.tp-mat{display:inline-flex;flex-direction:column;gap:2px;padding:3px 8px;font-family:var(--font-math);vertical-align:middle;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:6px;line-height:1.35}
.tp-mr{display:grid;grid-template-columns:repeat(3,minmax(1.9em,auto)) minmax(2.3em,auto);column-gap:4px;text-align:right;border-radius:4px}
.tp-mr > span{padding:0 3px;white-space:nowrap}
.tp-mb{border-left:1.5px solid var(--ink-2)}
.tp-hi{background:var(--hi-soft)}
.tp-sm .tp-mat{font-size:.88rem}
.tp-imat{margin:2px 4px;font-size:.95rem}
.tp-sys{display:inline-flex;flex-direction:column;gap:1px;vertical-align:middle;margin:2px 6px 2px 2px}
.q-prompt .tp-sys{display:flex;margin:6px 0}

/* row operations */
.tp-ops{margin-top:8px}
.tp-opctl{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.tp-oprow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tp-opform{display:block}
.tp-opmsg{min-height:1.2em;color:var(--red);font-weight:600;margin:4px 0 0}
.tp-hist{margin:0;padding-left:1.4em;font-size:.9rem}

/* Part 3 stations */
.tp-st:first-child{margin-top:0;padding-top:0;border-top:0}
.tp-st h3{margin-top:0}
.tp-stg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 26px;align-items:start}
.tp-stl,.tp-str{min-width:0}
.tp-steps{margin:8px 0;padding-left:1.4em}
.tp-steps li{margin:3px 0}
.tp-steps li.cur{font-weight:600}
.tp-cmp{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.tp-cmp h4{margin:0 0 6px}
.tp-vlab{margin:0 0 4px;font-weight:600}
.tp-p3read{margin-top:8px}
@media (max-width:760px){ .tp-stg{grid-template-columns:minmax(0,1fr)} }
.tp-flow{margin:0;padding-left:1.3em}
.tp-flow li{margin:4px 0}
.tp-flow ul{margin:4px 0;padding-left:1.2em}

/* Practice 2 */
.tp-flowd{margin:0 0 12px}
.tp-lbx{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0}
.tp-lbx .numin{width:4.2em}
.tp-chg{margin:8px 0}
.tp-chl{display:block;font-weight:700;margin:0 0 4px}
.tp-kbx label{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.tp-kbx .numin{width:4.2em}

/* task */
.tp-steps4{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:6px}
.tp-step{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tp-step label{min-width:7.5em}
.tp-step .numin{width:4.2em}

pt":"Solve `x + y + z = 6`, `y + z = 5`, `z = 3`.","options":[{"t":"(6, 5, 3)","why":"Those are the constants. Back-substitute.","_n":"g502","_k":"047c9190"},{"t":"(1, 2, 3)","why":"`z = 3`, `y = 2`, `x = 1`.","_n":"h4b2","_k":"e0383e45"},{"t":"(3, 2, 1)","why":"The order is reversed: `z = 3`, not `x`.","_n":"i4a2","_k":"cdc5a2e8"},{"t":"(1, 2, −3)","why":"Sign slip: `z = 3`.","_n":"j412","_k":"9cd27777"}],"hints":["Start at the bottom.","`y = 5 - 3`.","`x = 6 - 2 - 3 = 1`."]},{"id":"w6","skill":"Elimination","goal":4,"prompt":"A system reduces to the row `0x + 0y + 0z = 4`. What does that mean?","options":[{"t":"Infinitely many solutions","why":"That’s 0 = 0. 0 = 0 is always true (an equation is redundant). 0 = 5 is never true (no solution).","_n":"k422","_k":"6e0372bd"},{"t":"`z = 4`","why":"There’s no `z` left in the row.","_n":"l432","_k":"d67a9b2b"},{"t":"`x = y = z = 4`","why":"Every coefficient is 0.","_n":"m442","_k":"1fb655bd"},{"t":"The system has no solution","why":"0 = 4 is never true.","_n":"n3d2","_k":"651ef5d0"}],"hints":["What does the row say?","0 = 4.","Impossible, so no solution."]}],"refreshers":{"Triple scalar product":"`vec{a} · (vec{b} × vec{c})` is the signed volume of the parallelepiped on `vec{a}`, `vec{b}`, `vec{c}`. It’s 0 exactly when the vectors are coplanar.","Two planes":"Parallel normals give parallel or coincident planes; otherwise the planes meet in a line with direction `vec{n}_1 × vec{n}_2`.","Elimination":"Eliminate one variable from two pairs of equations, solve the 2 × 2 system, then back-substitute. A row 0 = 0 means a redundant equation; 0 = `k` ≠ 0 means no solution."}}},"explore":{"heading":"Three-plane configurator","intro":"Explore the eight arrangements, then build them yourself by adjusting the orange plane.","modes":[{"id":"gallery","t":"Gallery"},{"id":"adjust","t":"Adjust"},{"id":"rr","t":"Row-reduce"}],"modeHow":{"gallery":"Tap a card to open its example: the system, its reduced matrix and the 3D picture.","adjust"  normals","box":"Show `vec{n}_1 · (vec{n}_2 × vec{n}_3)`"},"rrOps":[{"id":"swap","t":"Swap rows"},{"id":"mul","t":"Multiply a row"},{"id":"add","t":"Add a multiple"}],"predIntro":"Make a prediction first. Then the configurator shows you what really happens.","predictions":[{"id":"p1","prompt":"Adjust mode, π₃: `x + 3y + z - 10 = 0`. π₃ contains the points (4, 2, 0) and (3, 2, 1), both on the line where π₁ and π₂ meet. How do the three planes meet?","options":[{"t":"Nowhere","_n":"o3e2","_k":"e0747b0b"},{"t":"In one point","_n":"p3f2","_k":"276ff993"},{"t":"In a line, like pages of a book","_n":"q402","_k":"7efa53d2"},{"t":"In a whole plane","_n":"r492","_k":"95f8ead7"}],"explain":"π₃ contains two points of `L`, so it contains all of `L`. A zero triple product didn’t mean ‘no solution’ here."},{"id":"p2","prompt":"Slide `D` to −12 (π₃: `x + 3y + z - 12 = 0`). Now how do they meet?","options":[{"t":"Nowhere: they form a triangular prism","_n":"s4a2","_k":"12bfb6bd"},{"t":"In one point","_n":"t472","_k":"56815347"},{"t":"Nowhere, because two planes are parallel","_n":"u462","_k":"49de8ee7"},{"t":"In a line","_n":"v452","_k":"00da683f"}],"explain":"π₃ is still parallel to `L` but no longer contains it."},{"id":"p3","prompt":"Row-reduce mode with the One-point card loaded. You apply R₂ → R₂ − R₁. What happens to the common point on screen?","options":[{"t":"Plane 1 changes","_n":"w442","_k":"f1cd05d7"},{"t":"It stays exactly where it is","_n":"x432","_k":"6e23a8ec"},{"t":"It moves","_n":"y422","_k":"d15d8eef"},{"t":"It disappears","_n":"z412","_k":"a624d8e7"}],"explain":"Row operations make an equivalent system: different planes, same solution."},{"id":"p4","prompt":"Adjust mode, π₃ = π₁ + π₂ (`2x + 2z - 8 = 0`). How do the three planes meet?","options":[{"t":"In a line","_n":"10402","_k":"656515a4"},{"t":"π₃ is parallel to π₁","_n":"114f2","_k":"aad3bc04"},{"t":"In one point","_n":"124e2","_k":"56ce086c"},{"t":"Nowhere","_n":"13d51","_k":"947b8780"}],"explain":"Any point on both π₁ and π₂ satisfies their sum, so π₃ contains `L`. Three equations, but only two independent ones."}],"chalIntro":"Use Adjust mode to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,6],"prompt":"Adjust mode: set π₃ so the three planes meet in \u003cstrong>exactly one\u003c/strong> point, and that point is (4, 2, 0).","why":"(4, 2, 0) is on π₃, and `vec{n}_1 · (vec{n}_2 × vec{n}_3)` `= 2A - 2C ≠ 0`, so it’s the only common point.","hints":["(4, 2, 0) is on π₁ and π₂, so it just has to be on π₃.","For exactly one point, `vec{n}_1 · (vec{n}_2 × vec{n}_3)` `= 2A - 2C ≠ 0`.","`z = 0`: `A = 0`, `B = 0`, `C = 1`, `D = 0`."],"msgs":{"mode":"Switch to Adjust mode and set π₃ with the sliders first.","zero":"π₃ needs a normal: `A`, `B` and `C` can’t all be 0.","line":"All three planes share the whole line `L`. Tilt π₃ so its normal isn’t perpendicular to (1, 0, −1).","other":"They meet in one point, but not at (4, 2, 0). Substitute it into π₃.","flat":"Those planes don’t meet in exactly one point: `vec{n}_1 · (vec{n}_2 × vec{n}_3)` `= 2A - 2C = 0`."}},{"id":"tc2","goal":[2,6],"prompt":"Adjust mode: make a \u003cstrong>triangular prism\u003c/strong>.","why":"π₃ is parallel to `L` (`A = C`) but misses it, and it isn’t parallel to π₁ or π₂: no common point, no parallel planes.","hints":["In a prism each pair meets in a line, and all three lines are parallel.","Make π₃ parallel to `L` (`A = C`), but not through it, and not parallel to π₁ or π₂.","`y = 0`: (0, 1, 0, 0)."],"msgs":{"mode":"Switch to Adjust mode and set π₃ with the sliders first.","zero":"π₃ needs a normal: `A`, `B` and `C` can’t all be 0.","p1":"π₃ is parallel to π₁: that’s two parallel planes cut by a third, not a prism.","p2":"π₃ is parallel to π₂.","sheaf":"That’s a sheaf. They share `L`.","point":"They meet in one point."}},{"id":"tc3","goal":[2,6],"stretch":true,"prompt":"Adjust mode: make the three planes share a line, with π₃ passing through the origin.","why":"`x - 2y + z = 0` contains (4, 2, 0), (3, 2, 1) and (0, 0, 0), so it contains `L` and passes through the origin.","hints":["π₁ and π₂ meet in `L`: `y = 2`, `x + z = 4`.","π₃ must contain (4, 2, 0), (3, 2, 1) and (0, 0, 0).","Through the origin: `Ax + By + Cz = 0`. Then `4A + 2B = 0` and `3A + 2B + C = 0`, so `B = -2A` and `C = A`: `x - 2y + z = 0`."],"msgs":{"mode":"Switch to Adjust mode and set π₃ with the sliders first.","zero":"π₃ needs a normal: `A`, `B` and `C` can’t all be 0.","point":"They meet in one point. For a shared line, π₃ must contain `L`.","sheaf":"That’s a sheaf, but π₃ misses the origin.","other":"For a shared line, π₃ must contain `L`; for the origin, `D = 0`."}}]},"part3":{"slug":"configurations","name":"Configurations","heading":"Algebra meets geometry","intro":"Each station row-reduces a system while the 3D view shows its planes. Step through it and watch the common points: they never move. Then use the normals to name the exact picture.","stations":[{"id":"st1","title":"Station 1: one point","rows":[[1,1,1,6],[1,-1,1,2],[2,1,-1,1]],"text":"The One-point card. Step through the elimination: the dot at (1, 2, 3) stays put through every step.","steps":[{"say":"The system: `x + y + z = 6`, `x - y + z = 2`, `2x + y - z = 1`."},{"op":{"t":1,"s":0,"k":-1},"say":"R₂ → R₂ − R₁: [0 −2 0 | −4]."},{"op":{"t":2,"s":0,"k":-2},"say":"R₃ → R₃ − 2R₁: [0 −1 −3 | −11]."},{"op":{"t":2,"a":2,"s":1,"k":-1},"say":"R₃ → 2R₃ − R₂: [0 0 −6 | −18]."},{"say":"Back-substitute: `z = 3`, `y = 2`, `x = 1`."}],"alg":["Substitute (1, 2, 3) into all three equations:","`1 + 2 + 3 = 6` ✓","`1 - 2 + 3 = 2` ✓","`2(1) + 2 - 3 = 1` ✓"]},{"id":"st2","title":"Station 2: when the bottom row vanishes","rows":[[1,1,1,6],[1,-1,1,2],[1,3,1,10]],"text":"The Sheaf card. Watch the bottom row: when it becomes 0 = 0, it no longer draws a plane.","steps":[{"say":"The system: `x + y + z = 6`, `x - y + z = 2`, `x + 3y + z = 10`."},{"op":{"t":1,"s":0,"k":-1},"say":"R₂ − R₁ gives [0 −2 0 | −4]."},{"op":{"t":2,"s":0,"k":-1},"say":"R₃ − R₁ gives [0 2 0 | 4]."},{"op":{"t":2,"s":1,"k":1},"say":"R₃ + R₂ gives [0 0 0 | 0]."},{"say":"Let `z = t`: `y = 2`, `x = 4 - t`. The line `(4, 2, 0) + t(-1, 0, 1)`."},{"say":"Which line picture? No two normals are parallel, so it’s a \u003cstrong>sheaf\u003c/strong>.","normals":true}],"compare":{"title":"Compare: the “two coincident + one crossing” card","rows":[[1,1,1,6],[2,2,2,12],[1,-1,1,2]],"steps":[{"say":"The system: `x + y + z = 6`, `2x + 2y + 2z = 12`, `x - y + z = 2`."},{"op":{"t":1,"s":0,"k":-2},"say":"R₂ − 2R₁ gives [0 0 0 | 0]."},{"op":{"t":2,"s":0,"k":-1},"say":"R₃ − R₁ gives [0 −2 0 | −4]."},{"op":{"sw":[1,2]},"say":"Swap R₂ and R₃: the same kind of matrix as the sheaf, with one row 0 = 0."},{"say":"Here two normals and equations are multiples: `2x + 2y + 2z = 12` is 2 × the first equation. The matrix says ‘a line’; the normals say which picture.","normals":true}]}},{"id":"st3","title":"Station 3: when 0 = 2","rows":[[1,1,1,6],[1,-1,1,2],[1,3,1,12]],"text":"The Prism card. This time the bottom row turns into a contradiction.","steps":[{"say":"The system: `x + y + z = 6`, `x - y + z = 2`, `x + 3y + z = 12`."},{"op":{"t":1,"s":0,"k":-1},"say":"R₂ − R₁ gives [0 −2 0 | −4]."},{"op":{"t":2,"s":0,"k":-1},"say":"R₃ − R₁ gives [0 2 0 | 6]."},{"op":{"t":2,"s":1,"k":1},"say":"R₃ + R₂ gives [0 0 0 | 2], which says 0 = 2: no solution."},{"say":"No two normals are parallel, so it’s a \u003cstrong>prism\u003c/strong>.","normals":true}],"compare":{"title":"Compare: the “two parallel + one crossing” card","rows":[[1,1,1,6],[1,1,1,2],[1,-1,1,2]],"steps":[{"say":"The system: `x + y + z = 6`, `x + y + z = 2`, `x - y + z = 2`."},{"op":{"t":1,"s":0,"k":-1},"say":"R₂ − R₁ gives [0 0 0 | −4]: the same kind of contradiction."},{"say":"But here two normals are parallel: (1, 1, 1) and (1, 1, 1). Two parallel planes cut by a third, not a prism. A triangular prism has no parallel planes at all: each pair meets in a line, and the three lines are parallel.","normals":true}]}}],"labels":{"view":"3D view of","main":"the station’s system","cmp":"the comparison system","common":"Common points","normals":"Normals"},"zeroRow":"R{r} is 0 = 0: true for every point, so it draws no plane.","badRow":"R{r} says 0 = {k}: no point satisfies it, so there’s no common point.","blocks":[{"title":"Classification flowchart","html":"\u003col class=\"tp-flow\">\u003cli>Compute `vec{n}_1 · (vec{n}_2 × vec{n}_3)`. If it’s ≠ 0, the planes meet in \u003cstrong>one point\u003c/strong>: solve.\u003c/li>\u003cli>If it’s 0, row-reduce:\u003cul>\u003cli>\u003cstrong>0 = 0 rows (consistent):\u003c/strong> one zero row means a \u003cstrong>line\u003c/strong> (a sheaf, or two coincident planes and a third crossing). Two zero rows mean a \u003cstrong>plane\u003c/strong> (all three coincident).\u003c/li>\u003cli>\u003cstrong>A 0 = `k` row (inconsistent):\u003c/strong> count the parallel pairs. None means a \u003cstrong>prism\u003c/strong>. One pair means \u003cstrong>two parallel planes cut by a third\u003c/strong>. All three parallel (and distinct) means \u003cstrong>three parallel planes\u003c/strong>. Two coincident and one parallel to them is the last case.\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>"}],"quickCheck":{"title":"Quick check","summary":"Configurations quick check","items":[{"id":"q1","goal":4,"prompt":"Reduced matrix: two pivot rows and the row [0 0 0 | 0]. The planes share…","choices":[{"t":"a line","fb":"Right. 0 = 0 is redundant, so one variable is free.","_n":"14d61","_k":"12e4e0a7"},{"t":"a plane","fb":"0 = 0 is redundant, so one variable is free.","_n":"15d31","_k":"a52b0798"},{"t":"no points","fb":"0 = 0 is redundant, so one variable is free.","_n":"16d41","_k":"8731c324"},{"t":"one point","fb":"0 = 0 is redundant, so one variable is free.","_n":"17d11","_k":"dad1c040"}]},{"id":"q2","goal":2,"prompt":"`vec{n}_1 · (vec{n}_2 × vec{n}_3)` = 0. Which is certain?","choices":[{"t":"Two planes are parallel","fb":"Zero allows a line, a plane, or nothing.","_n":"18d21","_k":"682c49bc"},{"t":"They don’t meet in exactly one point","fb":"Right. Zero rules out exactly one point, and nothing more.","_n":"19cf1","_k":"5b94e6a7"},{"t":"All three coincide","fb":"Zero allows a line, a plane, or nothing.","_n":"1ad01","_k":"514ee6ef"},{"t":"They have no common point","fb":"Zero allows a line, a plane, or nothing.","_n":"1bcd1","_k":"7cedbc1d"}]},{"id":"q3","goal":[1,4],"prompt":"The row [0 0 0 | 7] appears and no two normals are parallel. Which configuration?","choices":[{"t":"a line","fb":"Inconsistent with no parallel pair: a prism.","_n":"1cce1","_k":"7244ceed"},{"t":"triangular prism","fb":"Right. Inconsistent with no parallel pair: a prism.","_n":"1dbb2","_k":"da054b14"},{"t":"three parallel planes","fb":"Inconsistent with no parallel pair: a prism.","_n":"1eba2","_k":"5880f011"},{"t":"one point","fb":"Inconsistent with no parallel pair: a prism.","_n":"1fbd2","_k":"ba2ea903"}]},{"id":"q4","goal":1,"prompt":"Each pair of three planes meets in a line. Must all three share a point?","choices":[{"t":"Yes, exactly one point","fb":"The three lines can be parallel.","_n":"1gbc2","_k":"58f36949"},{"t":"Yes: three lines always meet","fb":"The three lines can be parallel.","_n":"1hbf2","_k":"a9cd11bf"},{"t":"No: they must be parallel","fb":"The three lines can be parallel.","_n":"1ibe2","_k":"bada93e1"},{"t":"No: they could form a prism","fb":"Right. The three lines can be parallel.","_n":"1jc12","_k":"d3dc159a"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"System ↔ configuration","summary":"System ↔ configuration","goal":[1,4],"instruction":"Match each system to the way its three planes are arranged.","how":"Tap a system, then tap its configuration on the right.","leftTitle":"System","rightTitle":"Configuration","left":[{"id":"l1","t":"\u003cspan class=\"tp-sys\">\u003cspan>`x + 2y - z = 2`\u003c/span>\u003cspan>`2x - y + z = 2`\u003c/span>\u003cspan>`x + y + 2z = 4`\u003c/span>\u003c/span>","why":"The solution is (1, 1, 1); the triple product (1, 2, −1) · [(2, −1, 1) × (1, 1, 2)] = −12 ≠ 0."},{"id":"l2","t":"\u003cspan class=\"tp-sys\">\u003cspan>`x - y + 2z = 3`\u003c/span>\u003cspan>`2x + y - z = 1`\u003c/span>\u003cspan>`3x + z = 4`\u003c/span>\u003c/span>","why":"Adding the first two gives the third exactly, and no two normals are parallel."},{"id":"l3","t":"\u003cspan class=\"tp-sys\">\u003cspan>`x - y + 2z = 1`\u003c/span>\u003cspan>`3x - 3y + 6z = 3`\u003c/span>\u003cspan>`x + y - z = 4`\u003c/span>\u003c/span>","why":"The second equation is 3 × the first; the third crosses them."},{"id":"l4","t":"\u003cspan class=\"tp-sys\">\u003cspan>`2x + y - z = 3`\u003c/span>\u003cspan>`4x + 2y - 2z = 6`\u003c/span>\u003cspan>`-2x - y + z = -3`\u003c/span>\u003c/span>","why":"Every equation is a multiple of the first."},{"id":"l5","t":"\u003cspan class=\"tp-sys\">\u003cspan>`x + 2y + z = 1`\u003c/span>\u003cspan>`x - y + 2z = 3`\u003c/span>\u003cspan>`2x + y + 3z = 7`\u003c/span>\u003c/span>","why":"Adding the first two gives `2x + y + 3z = 4`, which contradicts the third, and no two normals are parallel.","hints":["Add the first two equations.","`2x + y + 3z = 4` vs `2x + y + 3z = 7`.","Inconsistent, no parallel pair: a prism."]},{"id":"l6","t":"\u003cspan class=\"tp-sys\">\u003cspan>`x - 2y + z = 4`\u003c/span>\u003cspan>`x - 2y + z = 1`\u003c/span>\u003cspan>`2x + y - z = 0`\u003c/span>\u003c/span>","why":"The first two have the same normal but different constants; the third crosses them."},{"id":"l7","t":"\u003cspan class=\"tp-sys\">\u003cspan>`x + y + 3z = 1`\u003c/span>\u003cspan>`2x + 2y + 6z = 5`\u003c/span>\u003cspan>`x + y + 3z = -4`\u003c/span>\u003c/span>","why":"All three normals are multiples of (1, 1, 3), and no two equations are multiples."},{"id":"l8","t":"\u003cspan class=\"tp-sys\">\u003cspan>`x - y - z = 2`\u003c/span>\u003cspan>`2x - 2y - 2z = 4`\u003c/span>\u003cspan>`x - y - z = 9`\u003c/span>\u003c/span>","why":"The second is 2 × the first (coincident); the third has the same normal but a different constant."}],"right":[{"id":"r1","t":"One point"},{"id":"r2","t":"Sheaf (three distinct planes share a line)"},{"id":"r3","t":"Two coincident, one crossing"},{"id":"r4","t":"All three coincident"},{"id":"r5","t":"Triangular prism"},{"id":"r6","t":"Two parallel, one crossing"},{"id":"r7","t":"Three parallel"},{"id":"r8","t":"Two coincident, one parallel"}],"_a":"SRRcAxtbFBEDFBwQVVMUWRBEAhAVQ1pQEAwSQApDGkFeAhIIGxMCQR4UXAcbWxQRBxQcEFVXFFkQRAYQFUNaVBAMEkAOQxpBXg4SCBsTDkFP","wrong":{"l2|r5":"Add the first two equations: you get the third exactly. Consistent, so a line.","l5|r2":"Adding the first two gives `2x + y + 3z = 4`, which contradicts `2x + y + 3z = 7`.","l6|r5":"The first two planes have the same normal: they’re parallel.","l3|r2":"The second equation is 3 × the first: those two planes coincide.","l7|r6":"All three normals are multiples of (1, 1, 3)."},"wrongDefault":"Check the triple product, then the parallel pairs."},{"id":"solve","type":"custom","title":"Solve the system","summary":"Solve the system","star":true,"goal":[3,4,5,6],"instruction":"Solve each system and name what the planes share. Items 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type whole numbers or fractions such as −2/3. For a line, give any point on it and any direction vector.","flowTitle":"Classification flowchart","flow":"\u003col class=\"tp-flow\">\u003cli>Compute `vec{n}_1 · (vec{n}_2 × vec{n}_3)`. If it’s ≠ 0, the planes meet in \u003cstrong>one point\u003c/strong>: solve.\u003c/li>\u003cli>If it’s 0, row-reduce:\u003cul>\u003cli>\u003cstrong>0 = 0 rows (consistent):\u003c/strong> one zero row means a \u003cstrong>line\u003c/strong> (a sheaf, or two coincident planes and a third crossing). Two zero rows mean a \u003cstrong>plane\u003c/strong> (all three coincident).\u003c/li>\u003cli>\u003cstrong>A 0 = `k` row (inconsistent):\u003c/strong> count the parallel pairs. None means a \u003cstrong>prism\u003c/strong>. One pair means \u003cstrong>two parallel planes cut by a third\u003c/strong>. All three parallel (and distinct) means \u003cstrong>three parallel planes\u003c/strong>. Two coincident and one parallel to them is the last case.\u003c/li>\u003c/ul>\u003c/li>\u003c/ol>","items":[{"id":"x1","goal":3,"kind":"pt","prompt":"Solve \u003cspan class=\"tp-sys\">\u003cspan>`x + y + z = 2`\u003c/span>\u003cspan>`2x - y + z = 5`\u003c/span>\u003cspan>`x + 2y - z = -3`\u003c/span>\u003c/span>","rows":[[1,1,1,2],[2,-1,1,5],[1,2,-1,-3]],"_a":"SRRARhtbbVIeGwEeCzxL","display":"(1, −1, 2)","why":"(1, −1, 2) satisfies all three equations: 2, 5 and −3."},{"id":"x2","goal":3,"kind":"pt","prompt":"Solve \u003cspan class=\"tp-sys\">\u003cspan>`x + 2y + z = 4`\u003c/span>\u003cspan>`3x - y + 2z = -3`\u003c/span>\u003cspan>`2x + y - 3z = -3`\u003c/span>\u003c/span>","rows":[[1,2,1,4],[3,-1,2,-3],[2,1,-3,-3]],"_a":"SRRARhtbbU4DGgIeCDxL","display":"(−1, 2, 1)","wrong":[{"pt":[1,2,-1],"fb":"Sign slip in back-substitution."}],"why":"(−1, 2, 1) satisfies all three equations: 4, −3 and −3."},{"id":"x3","goal":[4,5],"star":true,"kind":"line","prompt":"Solve \u003cspan class=\"tp-sys\">\u003cspan>`x + 2y - z = 3`\u003c/span>\u003cspan>`2x - y + z = 1`\u003c/span>\u003cspan>`3x + y = 4`\u003c/span>\u003c/span>","rows":[[1,2,-1,3],[2,-1,1,1],[3,1,0,4]],"display":"the line `(0, 4, 5) + t(1, -3, -5)`","shareLabel":"The planes share","chips":[{"t":"one point","_n":"1kc02","_k":"d2a7eedd"},{"t":"a line","_n":"1lc32","_k":"70d0d95a"},{"t":"no points","fb":"R₁ + R₂ is exactly R₃: 0 = 0.","_n":"1mc22","_k":"e4609c05"},{"t":"a plane","_n":"1n491","_k":"1303accd"}],"why":"R₁ + R₂ = R₃, so only two independent equations remain: `x = t`, `y = 4 - 3t`, `z = 5 - 5t`, the line `(0, 4, 5) + t(1, -3, -5)`.","hints":["Compare R₁ + R₂ with R₃.","They’re identical, so only two independent equations remain.","Add the first two: `3x + y = 4 "},{"t":"`vec{r} = (3, 2, 0) + t(-3, -1, 2)`","why":"The third equation is the sum of the first two; (1, −1, 1) × (1, 1, 2) = (−3, −1, 2).","_n":"3p7ec","_k":"cc00e5bd"},{"t":"`vec{r} = (3, 2, 0) + t(1, -1, 1)`","why":"A normal.","_n":"3q7fc","_k":"403d446c"},{"t":"`vec{r} = (1, 0, 0) + t(-3, -1, 2)`","why":"(1, 0, 0) is on the first plane only.","_n":"3r7cc","_k":"6fbf81e2"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"A classmate says: ‘Each pair of these three planes meets in a line, so all three must share at least one point.’ Which is the best response?","options":[{"t":"“Not necessarily: they could be three parallel planes.”","why":"Parallel planes don’t meet in lines at all.","_n":"3s7dc","_k":"1bf7c580"},{"t":"“That’s right: three lines in space always meet.”","why":"The three lines can be parallel: that’s the prism.","_n":"3t72c","_k":"a001dd8d"},{"t":"“That’s right, and the common point is unique.”","why":"Only if the normals aren’t coplanar. Otherwise you get infinitely many solutions, or none.","_n":"3u73c","_k":"3b71e415"},{"t":"“Not necessarily: if the three lines are parallel, the planes form a triangular prism with no common point.”","why":"The three lines can be parallel: that’s the prism.","_n":"3v7cb","_k":"5296a9fe"}]},"b":{"prompt":"A classmate says: ‘Three equations in three unknowns always have exactly one solution.’ Which is the best response?","options":[{"t":"“Not always: if `vec{n}_1 · (vec{n}_2 × vec{n}_3)` = 0, the planes share a line, a plane, or nothing.”","why":"Only if the normals aren’t coplanar. Otherwise you get infinitely many solutions, or none.","_n":"3w7bb","_k":"c6e00736"},{"t":"“That’s right: one equation per unknown.”","why":"Only if the normals aren’t coplanar. Otherwise you get infinitely many solutions, or none.","_n":"3x7ab","_k":"d77bac31"},{"t":"“Not always: they never have exactly one.”","why":"Most systems do.","_n":"3y79b","_k":"0f058a2c"},{"t":"“That’s right, unless two equations are identical.”","why":"It also fails for a prism or a sheaf.","_n":"3z80b","_k":"b6d483e3"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which statement correctly reads the reduced matrix \u003cspan class=\"tp-mat tp-imat\" role=\"img\" aria-label=\"augmented matrix: 1, 0, 2 bar 3; 0, 1, −1 bar 1; 0, 0, 0 bar 0\">\u003cspan class=\"tp-mr\">\u003cspan>1\u003c/span>\u003cspan>0\u003c/span>\u003cspan>2\u003c/span>\u003cspan class=\"tp-mb\">3\u003c/span>\u003c/span>\u003cspan class=\"tp-mr\">\u003cspan>0\u003c/span>\u003cspan>1\u003c/span>\u003cspan>−1\u003c/span>\u003cspan class=\"tp-mb\">1\u003c/span>\u003c/span>\u003cspan class=\"tp-mr\">\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"tp-mb\">0\u003c/span>\u003c/span>\u003c/span>?","options":[{"t":"“The planes share a whole plane.”","why":"That needs two zero rows.","_n":"407fb","_k":"b9a7b88f"},{"t":"“The only solution is `x = 3`, `y = 1`, `z = 0`.”","why":"That’s one point on the line, not the only one.","_n":"417eb","_k":"796db025"},{"t":"“`z` is free: let `z = t`; then `x = 3 - 2t` and `y = 1 + t`. The planes share a line.”","why":"0 = 0 is redundant, so `z` is free.","_n":"427db","_k":"717a9130"},{"t":"“No solution, because the last row is zero.”","why":"0 = 0 is always true (an equation is redundant). 0 = 5 is never true (no solution).","_n":"4374b","_k":"deb5a78e"}]},"b":{"prompt":"Which statement correctly reads \u003cspan class=\"tp-mat tp-imat\" role=\"img\" aria-label=\"augmented matrix: 1, 0, −1 bar 2; 0, 1, 3 bar −1; 0, 0, 0 bar 0\">\u003cspan class=\"tp-mr\">\u003cspan>1\u003c/span>\u003cspan>0\u003c/span>\u003cspan>−1\u003c/span>\u003cspan class=\"tp-mb\">2\u003c/span>\u003c/span>\u003cspan class=\"tp-mr\">\u003cspan>0\u003c/span>\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003cspan class=\"tp-mb\">−1\u003c/span>\u003c/span>\u003cspan class=\"tp-mr\">\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"tp-mb\">0\u003c/span>\u003c/span>\u003c/span>?","options":[{"t":"“No solution, because the last row is zero.”","why":"0 = 0 is always true (an equation is redundant). 0 = 5 is never true (no solution).","_n":"4473b","_k":"a9d6778a"},{"t":"“The planes share a whole plane.”","why":"That needs two zero rows.","_n":"4576b","_k":"5b5fcdbe"},{"t":"“`z = t`, `x = 2 + t`, `y = -1 - 3t`: the planes share a line.”","why":"0 = 0 is redundant, so `z` is free.","_n":"4677b","_k":"98bc5d53"},{"t":"“The only solution is (2, −1, 0).”","why":"That’s one point on the line, not the only one.","_n":"4778b","_k":"a4a780e6"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"At a theatre, 2 adult, 3 student and 1 child ticket cost $46; 1 adult, 2 student and 2 child tickets cost $38; 3 adult, 1 student and 1 child ticket cost $44. What does a student ticket cost?","options":[{"t":"$5","why":"Check: 2(10) + 3(5) + 8 = 43, not 46.","_n":"4879b","_k":"a128f864"},{"t":"$6","why":"The solution is adult $10, student $6, child $8.","_n":"497ab","_k":"7512fd66"},{"t":"$8","why":"That’s the child ticket. Substitute your answer into all three original equations.","_n":"4a7bb","_k":"feac9696"},{"t":"$10","why":"That’s the adult ticket. Substitute your answer into all three original equations.","_n":"4b7cb","_k":"b84c8a10"}]},"b":{"prompt":"2 adult, 3 student and 1 child ticket cost $50; 1 adult, 2 student and 2 child tickets cost $36; 3 adult, 1 student and 1 child ticket cost $48. What does a child ticket cost?","options":[{"t":"$5","why":"Adult $12, student $7, child $5.","_n":"4c7db","_k":"7253d821"},{"t":"$6","why":"Check: 12 + 14 + 12 = 38, not 36.","_n":"4d6eb","_k":"cbeafd83"},{"t":"$7","why":"Student. Substitute your answer into all three original equations.","_n":"4e6fb","_k":"7aebb12d"},{"t":"$12","why":"Adult. Substitute your answer into all three original equations.","_n":"4fe8b","_k":"4097d021"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Three laser sheets in a stage show lie in `x + y + z = 6`, `x - y + z = 2` and `x + ky + z = 8`. For which `k` do the lasers share a single common line of light?","options":[{"t":"Any `k ≠ 1`, because then the triple product isn’t 0","why":"The triple product is 0 for \u003cstrong>every\u003c/strong> `k`: (1, `k`, 1) is always perpendicular to (1, 0, −1). Zero only rules out \u003cstrong>exactly one\u003c/strong> point. The planes could still share a line or a whole plane.","_n":"4ge7b","_k":"fc952e63"},{"t":"`k = 2`","why":"The first two meet in `y = 2`, `x + z = 4`. The third contains that line when `4 + 2k = 8`.","_n":"4heab","_k":"ab3a0201"},{"t":"`k = 1`","why":"That makes the third sheet parallel to the first: no common points.","_n":"4ie9b","_k":"5104eb07"},{"t":"`k = 0`","why":"`x + z = 8` misses the line `x + z = 4`: a prism.","_n":"4jecb","_k":"339ca25a"}]},"b":{"prompt":"Laser sheets in `x + y + z = 4`, `x - y + z = 2` and `2x + ky + 2z = 9`. For which `k` do they share a common line?","options":[{"t":"Any `k ≠ 2`","why":"The triple product is 0 for every `k`. Zero only rules out \u003cstrong>exactly one\u003c/strong> point. The planes could still share a line or a whole plane.","_n":"4kebb","_k":"e4f1e156"},{"t":"`k = 3`","why":"The line is `y = 1`, `x + z = 3`; then `6 + k = 9`.","_n":"4leeb","_k":"a8145c99"},{"t":"`k = 0`","why":"A prism.","_n":"4medb","_k":"d01b10b2"},{"t":"`k = 2`","why":"Parallel to the first sheet.","_n":"4nf0b","_k":"3431d3a8"}]}}]},"task":{"title":"Prism through a point","summary":"Prism through a point","statement":"\u003cp>π₁: `x + y + z = 6` and π₂: `x - y + z = 2` are fixed. Design π₃: `Ax + By + Cz + D = 0` that meets every condition. Can you find them all?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>π₃ passes through Q(0, 0, 3).\u003c/li>\u003cli>No two of the three planes are parallel or coincident.\u003c/li>\u003cli>The three planes have no point in common.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">`A`, `B` and `C` are whole numbers from −2 to 2; `D` is a whole number from −12 to 12. The 3D view shows all three planes, Q, the line `L` = π₁ ∩ π₂ and the pairwise lines.\u003c/p>","checks":["Passes through Q(0, 0, 3)","No two planes parallel or coincident","No common point"],"tips":["Substitute (0, 0, 3): `3C + D = 0`.","If (`A`, `B`, `C`) is a multiple of (1, 1, 1) or (1, −1, 1), two planes are parallel.","With no parallel pair, ‘no common point’ means a prism. π₃ must be parallel to `L`, so `vec{n}_3 · (1, 0, -1) = 0` (`A = C`), but must miss `L`: (4, 2, 0) must not satisfy π₃."],"explainPrompt":"Explain why every answer has `A = C`, and why that alone isn’t enough.","vocab":"Use the words normal, parallel, line of intersection and triangular prism.","after3":"Every answer has `A = C` (parallel to `L`) and `D = -3C` (through Q).","afterAll":"`2x - y + 2z - 6 = 0` also passes through Q and is parallel to `L`, but it contains `L`: a sheaf, not a prism.","total":5},"cards":[["Exactly one point","`vec{n}_1 · (vec{n}_2 × vec{n}_3)` ≠ 0 (the normals aren’t coplanar)."],["Triple product = 0","\u003cstrong>Not\u003c/strong> exactly one point: a line, a plane, or none. Row-reduce to tell."],["Sheaf","Three distinct planes through one line, like pages of a book."],["Triangular prism","Each pair meets in a line; the three lines are parallel; no common point; no parallel planes."],["Two parallel + one crossing","No common point; the crossing plane cuts the others in two parallel lines."],["Row [0 0 0 | 0]","A redundant equation; one zero row gives a line (one parameter)."],["Row [0 0 0 | `k`], `k ≠ 0`","Inconsistent: no common point."],["Two zero rows","All three planes coincide: a whole plane of solutions (two parameters)."],["Name the inconsistent case","Count parallel pairs: none means a prism; one pair means two parallel planes cut by a third; all three means three parallel planes."],["Row operations","Change the planes, never the common points."],["Check
