.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 50: hero equation and forms, V1 3D view (SVG), 3D line tracer layout, Part 3 stations, Find it in space boxes, task */
.l3-pen{color:var(--pen)}
.l3-heq{display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 10px;font-size:.9em}
.l3-hf{white-space:nowrap}
.l3-hx{color:var(--ink-2)}
.l3-hero{max-width:380px;margin:0 auto}
.l3-hforms{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-height:5.4em;font-size:.95rem}
.l3-hform{opacity:0;transform:translateY(4px);transition:opacity .5s ease,transform .5s ease}
.l3-hform.l3-on{opacity:1;transform:none}
.l3-hk{display:inline-block;min-width:6.6em;font:700 .8rem var(--font-ui);color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}

/* ---- V1 view3d ---- */
.l3-vwrap{width:100%;max-width:460px;margin:0 auto}
.l3-svg{display:block;width:100%;height:auto;aspect-ratio:1/1;touch-action:pan-y;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);cursor:grab}
.l3-hero .l3-svg{cursor:default;border:0;background:transparent}
.l3-svg:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.l3-svg line{stroke-linecap:butt}
.l3-grid{stroke:var(--plot-grid);stroke-width:1}
.l3-axis{stroke:var(--plot-axis);stroke-width:1.6}
.l3-haxis{fill:var(--plot-axis)}
.l3-tick{stroke:var(--plot-axis);stroke-width:1.2}
.l3-ink{stroke:var(--ink);stroke-width:3}
.l3-ink2{stroke:var(--ink-2);stroke-width:2}
.l3-pen{stroke:var(--pen);stroke-width:3.4}
.l3-hpen{fill:var(--pen)}
.l3-pos{stroke:var(--ink-2);stroke-width:1.8;stroke-dasharray:6 5}
.l3-hpos{fill:var(--ink-2)}
.l3-guide{stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:4 4}
.l3-shadow{stroke:var(--ink-2);stroke-width:2.2;stroke-dasharray:7 5}
.l3-hiseg{stroke:var(--hi);stroke-width:10;stroke-linecap:round}
.l3-pl1{fill:var(--pen);fill-opacity:.14;stroke:var(--pen);stroke-opacity:.55;stroke-width:1.2}
.l3-pl2{fill:var(--f3);fill-opacity:.14;stroke:var(--f3);stroke-opacity:.55;stroke-width:1.2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .l3-pl1,:root:not([data-theme="light"]) .l3-pl2{fill-opacity:.22}}
:root[data-theme="dark"] .l3-pl1,:root[data-theme="dark"] .l3-pl2{fill-opacity:.22}
.l3-ring{fill:none;stroke:var(--hi);stroke-width:3.4}
.l3-flash{animation:l3-flash .5s ease-in-out 3}
@keyframes l3-flash{0%,100%{stroke-width:3.4}50%{stroke-width:9}}
.l3-dink{fill:var(--ink)}
.l3-dink2{fill:var(--ink-2)}
.l3-dpen{fill:var(--pen)}
.l3-df3{fill:var(--f3)}
.l3-dhi{fill:var(--hi)}
.l3-lab{fill:var(--ink);stroke:var(--sheet);stroke-width:4px;paint-order:stroke;stroke-linejoin:round;font:600 14px var(--font-ui)}
.l3-lab.l3-ax{font-style:italic;font-size:16px;font-family:var(--font-math, serif);fill:var(--ink-2)}
.l3-lab.l3-mk{font-weight:700}
.l3-pre{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:8px 0 4px}
.l3-pre .tiny{margin-right:2px}

/* ---- Explore layout ---- */
.l3-ex{display:flex;gap:16px 28px;align-items:flex-start}
.l3-colL{flex:1.2 1 0;min-width:0}
.l3-colR{flex:1 1 0;min-width:0}
.l3-main{min-width:0}
.l3-forms,.l3-cross{margin-top:10px}
.l3-forms .m,.l3-cross .m{white-space:nowrap}
.l3-forms dd{overflow-wrap:anywhere}
.l3-cross[hidden]{display:none}
.l3-how{margin:8px 0 10px}
.l3-fs{border:0;margin:0;padding:0;min-width:0}
.l3-fs [data-pane][hidden]{display:none}
.l3-grp{margin-bottom:8px}
.l3-gt{margin:6px 0 4px;font-weight:700;font-size:.95rem}
.l3-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 10px}
.l3-st{display:flex;flex-direction:column;gap:2px;font-size:.92rem;min-width:0}
.l3-st .numin{width:100%;min-width:0;min-height:36px}
.l3-trow{display:flex;align-items:flex-end;gap:10px;margin:4px 0 6px}
.l3-trow .l3-sl{flex:1 1 auto;min-width:0}
.l3-play{flex:0 0 auto;margin-bottom:6px;min-width:4.6em}
.l3-tg{gap:6px;margin:6px 0 4px}
.l3-eqc{gap:6px}
.l3-eqc .chip .m{font-size:1.02em}
.l3-msg{min-height:1.2em;margin:4px 0;color:var(--red);font-weight:600}
.l3-sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1.5px solid}
.l3-sw1{background:color-mix(in srgb,var(--pen) 22%,transparent);border-color:var(--pen)}
.l3-sw2{background:color-mix(in srgb,var(--f3) 22%,transparent);border-color:var(--f3)}

/* ---- Part 3 stations ---- */
.l3-stc{gap:6px;margin-bottom:12px}
.l3-p3{display:flex;gap:16px 28px;align-items:flex-start}
.l3-p3L{flex:1.15 1 0;min-width:0}
.l3-p3R{flex:1 1 0;min-width:0;position:sticky;top:12px}
.l3-stn[hidden]{display:none}
.l3-stn h3{margin-top:0}
.l3-jt{margin:14px 0 4px;font-weight:700}
.l3-job{border-left:3px solid var(--rule);padding:2px 0 4px 12px;margin-bottom:6px}
.l3-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;margin:6px 0}
.l3-bx{width:4.2rem;min-height:36px;text-align:center}
.l3-lb{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.l3-symrow{gap:8px}
.l3-fr{display:inline-flex;flex-direction:column;align-items:center}
.l3-frt{display:inline-flex;align-items:center;gap:4px;padding-bottom:4px;border-bottom:2px solid var(--ink);white-space:nowrap}
.l3-frb{padding-top:4px}
.l3-echo{min-height:1.6em;font-size:1.05rem;overflow-wrap:anywhere}
.l3-vd{gap:6px;margin:4px 0}
.l3-jfb:empty{display:none}
.l3-alg{margin-top:14px}
.l3-cap{margin-top:6px}

/* ---- Find it in space ---- */
.l3-sq .l3-row{margin:8px 0}
.l3-yn{gap:6px}

/* ---- task ---- */
.l3-tv{max-width:420px}

@media (max-width:760px){
  .l3-ex,.l3-p3{flex-direction:column}
  .l3-colL,.l3-colR,.l3-p3L,.l3-p3R{flex:none;width:100%}
  .l3-p3R{position:static}
  .l3-vwrap{max-width:none}

  .l3-bx{width:3.4rem}
  .l3-frt .l3-bx{width:3rem}
  .l3-hk{min-width:0;display:block}
}

 zero plus t m two, z equals z zero plus t m three; x minus x zero over m one equals y minus y zero over m two equals z minus z zero over m three","eqSize":"sm","headline":"Same idea, one more coordinate","text":"A line in space is still \u003cstrong>a point and a direction\u003c/strong>. Its \u003cstrong>vector equation\u003c/strong> adds multiples of \u003cspan class=\"l3-pen\">`vec{m}`\u003c/span> to a starting point; its \u003cstrong>parametric equations\u003c/strong> do it one coordinate at a time; its \u003cstrong>symmetric equations\u003c/strong> remove `t` altogether. What you can’t do in R³ is describe a line with one equation like `ax + by + cz = d`: that’s a \u003cstrong>plane\u003c/strong>.","fig":{"html":"\u003cdiv class=\"l3-hero\" id=\"l3-hero\">\u003c/div>"}},"goals":["I can write vector and parametric equations of a line in R³ from a point and a direction, or from two points.","I can write symmetric equations, including when a direction component is 0.","I can decide whether a point is on a line in R³, using one value of `t` for all three coordinates.","I can find where a line meets the coordinate planes.","I can explain why one scalar equation in R³ is a plane, and write a line as the intersection of two planes.","I can tell when two equations describe the same line, and write a line parallel to a given one."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Vectors in R³","goal":1,"prompt":"A(1, 0, 2) and B(3, 4, 0). `vec{AB}` = ?","options":[{"t":"(2, 4, −2)","why":"B − A.","_n":"0990","_k":"47622a8e"},{"t":"(2, 4, 2)","why":"0 − 2 = −2.","_n":"19c0","_k":"7ef7ba3e"},{"t":"(−2, −4, 2)","why":"That’s A − B = `vec{BA}`.","_n":"29b0","_k":"ca84bf9c"},{"t":"(4, 4, 2)","why":"That’s A + B.","_n":"39e0","_k":"46ab1c26"}],"hints":["Head minus tail.","(3 − 1, 4 − 0, 0 − 2).","(2, 4, −2)."]},{"id":"w2","skill":"Vectors in R³","goal":6,"prompt":"Which vector is parallel to (2, −4, 6)?","options":[{"t":"(−1, 2, −3)","why":"−½(2, −4, 6).","_n":"49d0","_k":"dc28ac5b"},{"t":"(1, 2, 3)","why":"The middle component must be −2 × the first.","_n":"5a00","_k":"09d685d9"},{"t":"(3, −6, 8)","why":"3/2 times (2, −4, 6) is (3, −6, 9).","_n":"69f0","_k":"4690e9f4"},{"t":"(2, 4, 6)","why":"Not a multiple: the signs don’t match.","_n":"7a20","_k":"4e03dc4d"}],"hints":["Parallel means a scalar multiple.","Divide each component by the same number.","÷ (−2) gives (−1, 2, −3)."]},{"id":"w3","skill":"Lines in R²","goal":1,"prompt":"Which is a vector equation of the line through (2, 5) and (4, 1)?","options":[{"t":"`vec{r} = (2, 5) + t(6, 6)`","why":"That uses the sum of the points.","_n":"8a10","_k":"5e826389"},{"t":"`vec{r} = (2, 5) + t(-2, 1)`","why":"Slope from (2, 5) to (4, 1) is −2.","_n":"90df","_k":"4ca63734"},{"t":"`vec{r} = (2, 5) + t(1, -2)`","why":"(4, 1) − (2, 5) = (2, −4) = 2(1, −2).","_n":"a0ef","_k":"d4aabdf6"},{"t":"`vec{r} = (1, -2) + t(2, 5)`","why":"The added vector must be a point on the line.","_n":"b0ff","_k":"5ce77551"}],"hints":["Direction = second point − first.","(2, −4).","`vec{r} = (2, 5) + t(1, -2)`."]},{"id":"w4","skill":"Lines in R²","goal":3,"prompt":"Is (7, −1) on `x = 1 + 3t`, `y = 3 - 2t`?","options":[{"t":"Yes, at `t = 2`","why":"`x`: `t = 2`; `y`: 3 − 4 = −1.","_n":"c10f","_k":"c174665a"},{"t":"Yes, at `t = 7`","why":"`t` isn’t the `x`-coordinate.","_n":"d11f","_k":"2f257cb3"},{"t":"No","why":"Both coordinates give `t = 2`.","_n":"e12f","_k":"c5d1a3fd"},{"t":"Only if `t` is positive","why":"Any real `t` is allowed; here `t = 2` works anyway.","_n":"f13f","_k":"c66580ff"}],"hints":["Find `t` from `x`.","`t = 2`.","Check `y`: 3 − 4 = −1 ✓."]},{"id":"w5","skill":"Coordinate planes","goal":4,"prompt":"Which equation describes the `xy`-plane in R³?","options":[{"t":"`x + y = 0`","why":"That’s a vertical plane through the `z`-axis.","_n":"g14f","_k":"172850cd"},{"t":"`x = 0`","why":"That’s the `yz`-plane.","_n":"h15f","_k":"38f40d6b"},{"t":"`y = 0`","why":"That’s the `xz`-plane.","_n":"i16f","_k":"0f9d84 ight; (7, −1, 0) uses `t = +3`; (0, 5/2, 5/2) is where it meets the `yz`-plane."},{"id":"p2","prompt":"Equations mode, one chip: `x + 2y - z = 4`. What shape will appear?","options":[{"t":"two lines","_n":"s970","_k":"bfd7eaf4"},{"t":"a line","_n":"t19f","_k":"da724b2b"},{"t":"a point","_n":"u1af","_k":"d9b12ce2"},{"t":"a plane","_n":"v17f","_k":"c41674e8"}],"explain":"Pick any `x` and `y`; `z` is then fixed. Two free choices make a plane."},{"id":"p3","prompt":"Trace, `vec{m} = (3, 0, 4)`. What’s special about this line?","options":[{"t":"every point has the same `y`: it’s parallel to the `xz`-plane","_n":"w18f","_k":"86476dce"},{"t":"it’s parallel to the `y`-axis","_n":"x15f","_k":"c006133b"},{"t":"it has no symmetric equations at all","_n":"y16f","_k":"2c587c1d"},{"t":"it passes through the origin","_n":"z13f","_k":"aa169a4b"}],"explain":"`y = y_0 + 0t`. Symmetric form still works for `x` and `z`, with `y = y_0` written separately."},{"id":"p4","prompt":"Two points, A(1, 0, 2), B(3, 4, 0). Where is the point at `t = ½`?","options":[{"t":"(4, 4, 2)","_n":"1014f","_k":"d980f98b"},{"t":"(1, 2, −1)","_n":"1121f","_k":"0d71e4fe"},{"t":"(2, 2, 1)","_n":"1222f","_k":"259e89c5"},{"t":"(3, 4, 0)","_n":"13ac0","_k":"84c23999"}],"explain":"A + ½(B − A) = (1, 0, 2) + (1, 2, −1). (4, 4, 2) is A + B; (1, 2, −1) forgets to start at A; (3, 4, 0) is `t = 1`."}],"chalIntro":"Use the 3D line tracer to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Trace mode: make the line pass through A(2, −1, 3) and B(4, 3, 1).","why":"B − A = (2, 4, −2), a multiple of (1, 2, −1), and your starting point is on the line through A and B.","hints":["Direction = B − A.","(2, 4, −2), or (1, 2, −1).","`vec{r} = (2, -1, 3) + t(1, 2, -1)`."],"msgs":{"mode":"Switch to Trace mode first.","m242":"The `z`-components were subtracted in the other order: 1 − 3 = −2.","m312":"That’s ½(A + B). The direction from A to B is B − A.","off":"Parallel to AB, but A isn’t on it.","other":"This line doesn’t pass through both A and B yet. Start with the direction B − A."}},{"id":"tc2","goal":4,"prompt":"Make a line through (1, 2, −2) that \u003cstrong>never\u003c/strong> meets the `xy`-plane.","why":"With `m_3 = 0`, `z` stays at −2 for every `t`, so the line never reaches `z = 0`.","hints":["Which coordinate must never become 0?","`z` must stay at −2, so `z` can’t change.","Any `vec{m} = (a, b, 0)`, e.g. `vec{r} = (1, 2, -2) + t(1, 0, 0)`."],"msgs":{"mode":"Switch to Trace mode first.","up":"Straight up: it hits `z = 0` at (1, 2, 0) when `t = 2`.","zc":"Any change in `z` eventually reaches `z = 0`.","lies":"That line lies \u003cstrong>in\u003c/strong> the `xy`-plane. The `xy`-plane is where `z = 0`; the `yz`-plane is `x = 0`; the `xz`-plane is `y = 0`.","miss":"This line never meets the `xy`-plane, but it doesn’t pass through (1, 2, −2)."}},{"id":"tc3","goal":5,"stretch":true,"prompt":"Equations mode: choose \u003cstrong>two\u003c/strong> chips whose planes meet in exactly the line through (1, 2, 3) with direction (1, −1, 0).","why":"Every point (1 + `t`, 2 − `t`, 3) satisfies both of your equations, and they are different planes.","hints":["Every point (1 + `t`, 2 − `t`, 3) must satisfy both equations.","`x + y` stays 3 and `z` stays 3 along the line.","`x + y = 3` and `z = 3` work; so does any pair of the chips that are true all along the line, as long as they aren’t the same plane."],"msgs":{"mode":"Switch to Equations mode first.","none":"Choose two chips first.","one":"One equation is a plane. One equation in `x`, `y` and `z` is a plane. A line needs a parameter, or two equations together.","same":"These are the same plane, so there’s no single line.","xy":"Through (1, 2, 3), but the line runs along (1, 1, 0).","yz":"Through (1, 2, 3), but along (0, 1, −1).","other":"These planes meet in the line {line}. That isn’t the line through (1, 2, 3) with direction (1, −1, 0).","par":"These planes are parallel: they never meet."}}]},"part3":{"slug":"two-points","name":"Two points","heading":"Two points, one line","intro":"One line through A(1, 3, −4) and B(3, 1, 0), four jobs. Work through the stations: each answer is checked and then drawn in the 3D view beside it. Then try the quick check.","stations":[{"id":"s1","chip":"Station 1: three forms","title":"Station 1: three forms","text":"Build the direction, then write the line three ways. Any equivalent form is accepted (for example, starting from B).","msgs":{"ok":"✓ Correct. `vec{m} = B - A = (2, -2, 4)`, or simplified, (1, −1, 2).","sum":"That’s A + B. The direction from A to B is B − A.","rev":"That’s A − B, which points from B to A. The direction from A to B is B − A.","dir":"Subtract coordinate by coordinate: B − A = (3 − 1, 1 − 3, 0 − (−4)).","formOk":"✓ Correct. It passes through the line’s points with a direction parallel to (1, −1, 2).","swap":"Point and direction are swapped: the point goes first, the direction is multiplied by `t`.","par":"That direction isn’t parallel to B − A = (2, −2, 4).","pt":"That point isn’t on the line. Use A(1, 3, −4) or B(3, 1, 0).","zero":"Never divide by 0. Every direction component of this line is non-zero, so all three fractions are needed.","empty":"Fill in every box first (whole numbers or fractions)."}},{"id":"s2","chip":"Station 2: on the line or not?","title":"Station 2: on the line or not?","text":"Use `vec{r} = (1, 3, -4) + t(1, -1, 2)`. For each point, find `t` from each coordinate, then decide.","pts":[{"id":"a","p":[5,-1,4],"ts":[4,4,4],"on":true,"why":"`t = 4` in all three coordinates, so \u003cstrong>yes\u003c/strong>."},{"id":"b","p":[2,2,-1],"ts":[1,1,1.5],"on":false,"why":"`x` and `y` give `t = 1`, but `z` gives `t = 3/2`, so \u003cstrong>no\u003c/strong>. The view shows (2, 2, −2) on the line next to (2, 2, −1) just above it."}],"msgs":{"t":"Solve each coordinate for `t`: for example, `x`: 1 + `t` = {x}.","verdict":"All three coordinates must give the \u003cstrong>same\u003c/strong> `t`.","empty":"Fill in the three `t`-values and choose a verdict."}},{"id":"s3","chip":"Station 3: piercing the planes","title":"Station 3: piercing the coordinate planes","text":"Set the right coordinate to 0, solve for `t`, then find the point. Rings appear in the view as each one is found.","rows":[{"id":"xy","k":2,"lab":"`xy`-plane (`z = 0`)","t":2,"p":[3,1,0],"note":"which is B itself"},{"id":"yz","k":0,"lab":"`yz`-plane (`x = 0`)","t":-1,"p":[0,4,-6]},{"id":"xz","k":1,"lab":"`xz`-plane (`y = 0`)","t":3,"p":[4,0,2]}],"msgs":{"plane":"The `xy`-plane is where `z = 0`; the `yz`-plane is `x = 0`; the `xz`-plane is `y = 0`.","t":"Set that coordinate of (1 + `t`, 3 − `t`, −4 + 2`t`) equal to 0 and solve for `t`.","pt":"Substitute your `t` into all three coordinates.","empty":"Fill in `t` and all three coordinates."}},{"id":"s4","chip":"Station 4: a line as two planes","title":"Station 4: a line as two planes","text":"Split the symmetric equations `(x - 1)/1 = (y - 3)/(-1) = (z + 4)/2` into two equations. Each one is a plane; the line is where they meet.","eqs":[{"id":"e1","from":"`(x - 1)/1 = (y - 3)/(-1)` gives","vars":["x","y"],"n":[1,1,-4],"show":"`x + y - 4 = 0`"},{"id":"e2","from":"`(x - 1)/1 = (z + 4)/2` gives","vars":["x","z"],"n":[2,-1,-6],"show":"`2x - z - 6 = 0`"}],"alg":["B(3, 1, 0) in `x + y - 4 = 0`: 3 + 1 − 4 = 0 ✓","B(3, 1, 0) in `2x - z - 6 = 0`: 6 − 0 − 6 = 0 ✓","Both planes contain the line, and they aren’t the same plane, so they meet in exactly this line."],"msgs":{"ok":"✓ Correct.","bad":"Cross-multiply the two fractions, then bring every term to one side.","empty":"Fill in all three boxes.","zero":"The coefficients can’t all be 0."}}],"quickCheck":{"title":"Quick check","summary":"Two points, one line quick check","items":[{"id":"q1","goal":3,"prompt":"Is (0, 4, −6) on `(x - 1)/1 = (y - 3)/(-1) = (z + 4)/2`?","choices":[{"t":"No","fb":"Each fraction equals −1.","_n":"14ab0","_k":"7977d8a7"},{" "e1","goal":2,"task":"Write symmetric equations of the line through (2, −1, 4) with direction (3, 0, −2).","steps":["Parametric: `x = 2 + 3t`, `y = -1`, `z = 4 - 2t`.","Solve each for `t`: `t = (x - 2)/3`, `t = (y + 1)/0`, `t = (z - 4)/(-2)`.","`(x - 2)/3 = (y + 1)/0 = (z - 4)/(-2)`."],"_a":"UA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 copies step 2. The mistake is earlier."],"fixes":[{"t":"Replace the 0 with 1: `(y + 1)/1`.","why":"That changes the line: `y` would vary.","_n":"1ka50","_k":"fe1abb37"},{"t":"Step 2 is correct.","why":"Division by 0 is undefined.","_n":"1l9e0","_k":"6a77d710"},{"t":"`y` doesn’t involve `t`: write `(x - 2)/3 = (z - 4)/(-2)`, `y = -1`.","why":"`y` is −1 for every `t`, so it is stated on its own.","_n":"1m9f0","_k":"0e3f2b29"},{"t":"`(x + 2)/3 = (y - 1)/0 = (z + 4)/(-2)`.","why":"`(x - x_0)`: the point (4, −2, 1) gives `(x - 4)`, `(y + 2)`, `(z - 1)`.","_n":"1n180","_k":"5a6d8b8b"}],"hints":["Can you solve `y = -1` for `t`?","No: `y` is the same for every `t`.","State `y = -1` separately."]},{"id":"e2","goal":3,"task":"Is P(5, 1, 0) on `vec{r} = (1, 3, 2) + t(2, -1, -2)`?","steps":["`x`: 1 + 2`t` = 5, so `t = 2`.","`y`: 3 − `t` = 1, so `t = 2`.","Two coordinates agree, so P is on the line.","P is the point at `t = 2`."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"Check `z` too: 2 − 2(2) = −2 ≠ 0, so P is \u003cstrong>not\u003c/strong> on the line.","why":"All three coordinates must give the \u003cstrong>same\u003c/strong> `t`.","_n":"1o170","_k":"2c3761a6"},{"t":"Average the `t`-values.","why":"A point on the line has one `t` for every coordinate; averaging hides a mismatch. All three coordinates must give the \u003cstrong>same\u003c/strong> `t`.","_n":"1p1a0","_k":"07456e58"},{"t":"Use the `z`-equation instead: `t = 1`, so P is on the line at `t = 1`.","why":"`t = 1` gives (3, 2, 0), not P.","_n":"1q190","_k":"6a8b2d0d"},{"t":"Step 3 is correct.","why":"All three coordinates must give the \u003cstrong>same\u003c/strong> `t`.","_n":"1r140","_k":"ead876db"}],"hints":["How many coordinates does a point in R³ have?","Three, so all three must agree.","`z` at `t = 2` is −2, not 0."]},{"id":"e3","goal":6,"task":"Write a vector equation of the line through A(3, 0, −1) parallel to `(x - 1)/2 = (y + 5)/(-1) = z/4`.","steps":["The given line’s direction is (2, −1, 4).","A point on the given line is (1, −5, 0).","`vec{r} = (1, -5, 0) + t(2, -1, 4)`.","Done."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is true, but not needed.","","Step 4 accepts step 3."],"fixes":[{"t":"`vec{r} = (3, 0, -1) + t(1, -5, 0)`.","why":"(1, −5, 0) is a point, not the direction.","_n":"1s130","_k":"07b819f9"},{"t":"Use the direction A − (1, −5, 0) = (2, 5, −1).","why":"That line goes through both points, so it isn’t parallel.","_n":"1t160","_k":"3ff367a3"},{"t":"Use A as the point: `vec{r} = (3, 0, -1) + t(2, -1, 4)`.","why":"Keep the direction, change the point.","_n":"1u150","_k":"e90e32b2"},{"t":"Step 3 is correct.","why":"That’s the given line itself; it doesn’t pass through A. A parallel line keeps the direction but uses its own point. Parallel directions alone don’t make lines the same.","_n":"1v200","_k":"7c88d0e6"}],"hints":["Which point must the new line pass through?","A(3, 0, −1).","Keep the direction, change the point."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the 3D view: one equation drawing a whole plane, or a line that never touches the floor?"},{"id":"j2","q":"In your own words, why can’t one equation like `x + 2y - z = 4` describe a line in R³?"},{"id":"j3","q":"Explain to a friend how to write symmetric equations when one direction component is 0."},{"id":"j4","q":"Which job (three forms, testing a point, plane crossings, or two-plane form) still feels slow? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a vector equation of the line through (2, 0, −3) with direction (1, −4, 5)?","options":[{"t":"`vec{r} = (2, 0, -3) + t(1, -4, 5)`","why":"Point first, then `t` times the direction.","_n":"1w1f0","_k":"d1d3db53"},{"t":"`vec{r} = (1, -4, 5) + t(2, 0, -3)`","why":"Point and direction swapped.","_n":"1x120","_k":"e112c3c3"},{"t":"`vec{r} = (2, 0, -3) + t(-1, 4, 5)`","why":"Only the first two signs changed: a different direction.","_n":"1y130","_k":"887987df"},{"t":"`x - 4y + 5z + 13 = 0`","why":"One equation in R³ is a plane.","_n":"1z100","_k":"5bc82a37"}]},"b":{"prompt":"Which is a vector equation of the line through (−1, 3, 0) with direction (2, 2, −1)?","options":[{"t":"`vec{r} = (-1, 3, 0) + t(2, -2, -1)`","why":"A different direction.","_n":"20110","_k":"891f3159"},{"t":"`vec{r} = (2, 2, -1) + t(-1, 3, 0)`","why":"Swapped.","_n":"21160","_k":"bb618fbb"},{"t":"`2x + 2y - z - 4 = 0`","why":"One equation in `x`, `y` and `z` is a plane. A line needs a parameter, or two equations together.","_n":"22170","_k":"49a799c9"},{"t":"`vec{r} = (-1, 3, 0) + t(2, 2, -1)`","why":"Point first, then `t` times the direction.","_n":"23140","_k":"4ae11d84"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Symmetric equations of `vec{r} = (4, -2, 1) + t(3, 5, -2)`?","options":[{"t":"`(x - 4)/3 + (y + 2)/5 + (z - 1)/(-2) = 0`","why":"Adding the fractions makes one equation: a plane.","_n":"24150","_k":"6a7974b9"},{"t":"`(x - 4)/3 = (y + 2)/5 = (z - 1)/(-2)`","why":"Numerators `(x - x_0)` from the point, denominators from the direction.","_n":"251a0","_k":"34b09203"},{"t":"`(x + 4)/3 = (y - 2)/5 = (z + 1)/(-2)`","why":"The signs come from `(x - x_0)`.","_n":"261b0","_k":"63b2b1a0"},{"t":"`(x - 3)/4 = (y - 5)/(-2) = (z + 2)/1`","why":"The point and direction roles are swapped.","_n":"27240","_k":"82c14e46"}]},"b":{"prompt":"Symmetric equations of `vec{r} = (-3, 0, 2) + t(1, -4, 6)`?","options":[{"t":"`(x - 3)/1 = y/(-4) = (z + 2)/6`","why":"The signs come from `(x - x_0)`: `x_0 = -3` gives `(x + 3)`.","_n":"28230","_k":"093fb14a"
