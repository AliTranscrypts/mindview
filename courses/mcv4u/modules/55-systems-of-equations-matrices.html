.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}

border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}

/* MCV4U 55 Systems of Equations (Matrices): augmented matrices, the row-reduction stepper, 3D views, solution boxes. */
/* ---- augmented matrix (square brackets, a bar before the constants) ---- */
.sy-mx{display:inline-block;vertical-align:middle;margin:2px 3px;font-variant-numeric:tabular-nums}
.sy-mxg{position:relative;display:inline-grid;grid-template-columns:repeat(3,auto);column-gap:0;padding:2px .42em;line-height:1.55}
.sy-mx.c4 .sy-mxg{grid-template-columns:repeat(4,auto)}
.sy-mx.c2 .sy-mxg{grid-template-columns:repeat(2,auto)}
.sy-mxg::before,.sy-mxg::after{content:"";position:absolute;top:0;bottom:0;width:.32em;border:1.6px solid currentColor}
.sy-mxg::before{left:0;border-right:0}
.sy-mxg::after{right:0;border-left:0}
.sy-mxg>span{padding:0 .32em;text-align:right;min-width:1.4em}
.sy-mxg>span.sy-b{border-left:1.5px solid currentColor;padding-left:.5em;margin-left:.18em}
.sy-mx.big{font-size:1.18rem;margin:0}
.sy-mx.big .sy-mxg{line-height:2;padding:4px .5em}
.sy-mx.big .sy-mxg>span{min-width:2.3em;padding:0 .38em}
.sy-fl{animation:sy-flash 1.3s ease-out}
.sy-ol{outline:2px solid var(--hi);outline-offset:-2px}
@keyframes sy-flash{0%,35%{background:var(--hi-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.sy-fl{animation:none;outline:2px solid var(--hi);outline-offset:-2px}}
.sy-heq{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;justify-content:center}
.sy-harr{font-size:1.4em;color:var(--ink-2)}
/* ---- hero ---- */
.sy-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:center}
.sy-hl{min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;overflow-x:auto}
.sy-hsys{display:flex;flex-direction:column;gap:8px;font-size:1.2rem}
.sy-hop{min-height:1.6em;margin:0;font-weight:700;color:var(--ink)}
.sy-hbs{display:flex;gap:14px;min-height:1.6em;margin:0;font-size:1.1rem}
.sy-hboth{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.sy-hcap{grid-column:1/-1;margin:0;min-height:1.2em}
.sy-fade{animation:sy-in .6s ease-out}
@keyframes sy-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.sy-fade{animation:none}}
@media (max-width:640px){.sy-hero{grid-template-columns:1fr}.sy-hl{min-height:0}}
/* ---- 3D canvas ---- */
.sy-c3{display:block;width:100%;aspect-ratio:4/3;border:1px solid var(--rule);border-radius:10px;touch-action:pan-y;cursor:grab;background:var(--sheet)}
.sy-c3:active{cursor:grabbing}
.sy-c3:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.sy-views{flex-wrap:wrap}
/* ---- Explore layout ---- */
.sy-ex{display:flex;flex-direction:column;gap:10px}
.sy-sys{display:flex;flex-wrap:wrap;gap:6px}
.sy-cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.sy-cols{grid-template-columns:minmax(0,1fr)}}
.sy-right{display:flex;flex-direction:column;gap:8px;min-width:0}
.sy-left{min-width:0}
.sy-geobar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.sy-tog{display:inline-flex;align-items:center;gap:6px;font-weight:600;min-height:28px}
.sy-tog input{width:18px;height:18px}
.sy-ghow{margin:4px 0 0}
.sy-gcap{margin:0}
.sy-read{margin:0}
.sy-bs{border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.sy-bs h4{margin:0 0 4px}
/* ---- stepper ---- */
.sy-st{display:flex;flex-direction:column;gap:10px}
.sy-mwrap{border:1px solid var(--rule);border-radius:10px;padding:10px;overflow-x:auto;background:var(--sheet)}
.sy-mbig{display:flex;align-items:flex-start;gap:4px}
.sy-rls{display:flex;flex-direction:column;padding-top:4px;font-size:1.18rem;line-height:2;color:var(--ink-2);font-weight:600;font-size:.95rem}
.sy-rls>span{height:2.36rem;display:flex;align-items:center}
.sy-eqs{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.sy-eq{display:flex;align-items:baseline;gap:8px}
.sy-eqn{font-weight:700;color:var(--c,var(--ink));min-width:1.8em}
.sy-ops{display:flex;flex-direction:column;gap:8px}
.sy-opc{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sy-sel{min-height:34px;font:inherit;padding:2px 4px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.sy-sym{font-size:1.1rem;color:var(--ink-2)}
.sy-ri{font-weight:600}
.sy-cnote{flex-basis:100%;margin:0}
.sy-zero[aria-disabled="true"]{opacity:.6;text-decoration:line-through;cursor:not-allowed}
.sy-opmsg:empty{display:none}
.sy-zmsg{margin:0 0 6px}
.sy-urow{display:flex;gap:8px}
.sy-hist summary{cursor:pointer;font-weight:600;min-height:24px}
.sy-hist ol{margin:6px 0 0;padding-left:1.4em}
/* ---- Build mode and matrix entry ---- */
.sy-bld{border:1px dashed var(--rule);border-radius:10px;padding:8px 10px}
.sy-bgrid{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding-bottom:2px}
.sy-brow{display:flex;align-items:center;gap:4px}
.sy-brl{min-width:1.8em;font-weight:600;color:var(--ink-2)}
.sy-bin{width:3.6em}
.sy-bbar{display:inline-block;width:2px;height:28px;background:var(--ink);margin:0 4px}
/* ---- solution entry ---- */
.sy-kinds{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sy-vals,.sy-pars{display:flex;flex-wrap:wrap;gap:8px 14px;margin:6px 0}
.sy-val,.sy-par{display:inline-flex;align-items:center;gap:6px}
.sy-val .numin,.sy-par .numin{width:4.2em}
/* ---- Part 3 ---- */
.sy-stn{margin:0 0 22px}
.sy-stn h3{margin:0 0 6px}
.sy-s1{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.sy-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sy-card{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;min-width:0;overflow-x:auto}
.sy-card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sy-cl{margin:0;font-weight:700}
.sy-s1g{position:sticky;top:70px}
.sy-s2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.sy-chkl{margin:2px 0}
.sy-ok{color:var(--green);font-weight:700}
.sy-s3cards{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.sy-mbtn{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:6px 10px;cursor:pointer;min-height:44px}
.sy-mbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.sy-s3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.sy-s1,.sy-s2,.sy-s3{grid-template-columns:minmax(0,1fr)}.sy-s1g{position:static}}
@media (max-width:520px){.sy-cards{grid-template-columns:minmax(0,1fr)}}
/* ---- Practice 2 ---- */
.sy-pdet{margin:6px 0}
.sy-pdet summary{cursor:pointer;font-weight:600;min-height:28px}
.sy-pst{margin-top:8px}
.sy-kq{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.sy-ever{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sy-fmsg:empty{display:none}
/* ---- task ---- */
.sy-teq{margin:0 0 6px;font-size:1.15rem}
.sy-tstep{display:flex;align-items:center;gap:6px;margin:4px 0}
.sy-tstep label{min-width:5.6em}
#sy-tref{margin-top:8px;overflow-x:auto}

 = 9`; `x + 3y + 2z = 5`","rows":[[1,2,1,4],[2,5,3,9],[1,3,2,5]],"_a":"HhVeE1wVX1kDFUg=","display":"(`2 + t`, `1 - t`, `t`)","wrong":[{"pt":[2,1,0],"fb":"That’s one point; the zero row means a whole line. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`."}]},{"id":"s5","goal":1,"star":true,"fill":true,"prompt":"`y + 2z = 5`; `x + z = 3`; `2x + y = 3`","rows":[[0,1,2,5],[1,0,1,3],[2,1,0,3]],"_a":"HhVeE1wVWVkAFRkTFkMUDT4GGQBKBWtK","display":"(1, 1, 2)","wrongDefault":"Columns are `x`, `y`, `z`: row 1 is [0 1 2 | 5].","hints":["Write each equation with all three variables: `0x + y + 2z = 5`.","Swap rows so the first row starts with `x`.","(1, 1, 2)."]},{"id":"s6","goal":4,"star":true,"kind":"k","prompt":"For which `k` does `x + y + z = 1`, `x + 2y + 3z = 2`, `x + 3y + kz = 3` have infinitely many solutions? Could it ever have none?","_a":"HhVeE1wCGhUAQVBDRA0UWQoVSA==","display":"`k = 5`; never none","wrongDefault":"Reduction gives `(k - 5)z = 0`: one solution if `k != 5`, infinitely many if `k = 5`. The right side is always 0, so no contradiction is possible.","hints":["Reduce with `k` as a letter.","R₂ − R₁: [0 1 2 | 1]; R₃ − R₁: [0 2 `k - 1` | 2]; then R₃ − 2R₂.","[0 0 `k - 5` | 0]: `k = 5` gives a zero row."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Ibrahim","goal":[2,4],"instruction":"Ibrahim made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Solve `x + 2y = 4` and `3x + y = 7`.","steps":["\u003cspan class=\"sy-mx c3\">\u003cspan class=\"vh\">matrix [1 2 | 4], [3 1 | 7]\u003c/span>\u003cspan class=\"sy-mxg\" aria-hidden=\"true\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003cspan class=\"sy-b\">4\u003c/span>\u003cspan>3\u003c/span>\u003cspan>1\u003c/span>\u003cspan class=\"sy-b\">7\u003c/span>\u003c/span>\u003c/span>.","R₂ → R₂ − 3R₁: span class=\"sy-b\">1\u003c/span>\u003cspan>1\u003c/span>\u003cspan>−1\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"sy-b\">−3\u003c/span>\u003c/span>\u003c/span>","why":"Constants keep their signs when they’re already on the right.","_n":"2359b","_k":"188b4fa2"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which operation changes the solutions of a system?","options":[{"t":"R₃ → R₃ − 2R₁","why":"Adding a multiple of another row is allowed.","_n":"245ab","_k":"0fd80821"},{"t":"R₂ → −3R₂","why":"A non-zero multiple is allowed.","_n":"255bb","_k":"8158f597"},{"t":"Adding 5 to every entry of row 2","why":"Adding a constant to an equation’s terms changes the equation. That changes the solutions. Allowed: swap rows, multiply a row by a non-zero number, add a multiple of another row.","_n":"265cb","_k":"0a335bba"},{"t":"R₁ ↔ R₃","why":"Swapping is allowed.","_n":"276dd","_k":"8740da40"}]},"b":{"prompt":"Which operation changes the solutions of a system?","options":[{"t":"R₂ → R₂ + 4R₃","why":"Adding a multiple of another row is allowed.","_n":"286cd","_k":"cfa2894c"},{"t":"R₁ → (1/2)R₁","why":"A non-zero multiple is allowed.","_n":"296fd","_k":"695deec4"},{"t":"R₂ ↔ R₁","why":"Swapping is allowed.","_n":"2a6ed","_k":"8ce93f6f"},{"t":"R₃ → 0R₃","why":"Multiplying by 0 turns equation 3 into 0 = 0, so it’s lost. That changes the solutions. Allowed: swap rows, multiply a row by a non-zero number, add a multiple of another row.","_n":"2b69d","_k":"11dd9d2f"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A row-echelon form is \u003cspan class=\"sy-mx c4\">\u003cspan class=\"vh\">matrix [1 3 −1 | 2], [0 1 4 | 5], [0 0 0 | −3]\u003c/span>\u003cspan class=\"sy-mxg\" aria-hidden=\"true\">\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003cspan>−1\u003c/span>\u003cspan class=\"sy-b\">2\u003c/span>\u003cspan>0\u003c/span>\u003cspan>1\u003c/span>\u003cspan>4\u003c/span>\u003cspan class=\"sy-b\">5\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"sy-b\">−3\u003c/span>\u003c/span>\u003c/span>. The system has …","options":[{"t":"one solution, with `z = -3`","why":"`0x + 0y + 0z = -3` says 0 = −3: impossible. No solution at all.","_n":"2c68d","_k":"481148e0"},{"t":"infinitely many solutions","why":"The bottom row isn’t all zeros: it’s a contradiction. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"2d6bd","_k":"a951bf51"},{"t":"the solution (0, 0, 0)","why":"(0, 0, 0) gives 0 ≠ −3 in row 3. No solution means no point at all.","_n":"2e6ad","_k":"02f6bc07"},{"t":"no solution","why":"Row 3 says 0 = −3.","_n":"2f65d","_k":"33a27a47"}]},"b":{"prompt":"A row-echelon form is \u003cspan class=\"sy-mx c4\">\u003cspan class=\"vh\">matrix [1 −1 2 | 4], [0 1 1 | 2], [0 0 0 | 0]\u003c/span>\u003cspan class=\"sy-mxg\" aria-hidden=\"true\">\u003cspan>1\u003c/span>\u003cspan>−1\u003c/span>\u003cspan>2\u003c/span>\u003cspan class=\"sy-b\">4\u003c/span>\u003cspan>0\u003c/span>\u003cspan>1\u003c/span>\u003cspan>1\u003c/span>\u003cspan class=\"sy-b\">2\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"sy-b\">0\u003c/span>\u003c/span>\u003c/span>. The system has …","options":[{"t":"infinitely many solutions","why":"No contradiction; `z` is free.","_n":"2g64d","_k":"1e4a91d3"},{"t":"one solution, with `z = 0`","why":"`z = 0` gives just one point. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`.","_n":"2h67d","_k":"dab1a6b8"},{"t":"no solution","why":"[0 0 0 | 0] says 0 = 0: true everywhere. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"2i68d","_k":"66f904c2"},{"t":"the solution (0, 0, 0)","why":"(0, 0, 0) gives 0 ≠ 4 in row 1.","_n":"2j65d","_k":"0328c498"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Solve `x + y + z = 2`, `x + 2y + 3z = 5`, `x - y + 2z = 6`.","options":[{"t":"(1, 1, 0)","why":"That satisfies the first equation only: 1 + 2 = 3 ≠ 5.","_n":"2k66d","_k":"627fdf7e"},{"t":"Infinitely many solutions","why":"No zero row appears. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"2l6bd","_k":"ca48ce59"},{"t":"(1, −1, 2)","why":"R₂ − R₁: `y + 2z = 3`; R₃ − R₁: `-2y + z = 4`; then `5z = 10`.","_n":"2m6cd","_k":"7c90a1ba"},{"t":"(2, −1, 1)","why":"That’s (`z`, `y`, `x`). Start at the bottom row: it has the fewest variables. Report (`x`, `y`, `z`) in order.","_n":"2n69d","_k":"7b205f70"}]},"b":{"prompt":"Solve `x + y + z = 1`, `x + 2y + 3z = -1`, `x - y + 2z = 0`.","options":[{"t":"Infinitely many solutions","why":"No zero row appears. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"2o6ad","_k":"b277474d"},{"t":"(2, 0, −1)","why":"R₂ − R₁: `y + 2z = -2`; R₃ − R₁: `-2y + z = -1`; then `5z = -5`.","_n":"2p5fd","_k":"28abd09f"},{"t":"(−1, 0, 2)","why":"That’s (`z`, `y`, `x`). Start at the bottom row: it has the fewest variables. Report (`x`, `y`, `z`) in order.","_n":"2q60d","_k":"e72feaf2"},{"t":"(1, 0, 0)","why":"That satisfies the first equation only: 1 ≠ −1 in the second.","_n":"2rb12","_k":"1c1267e2"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Solve `x + y - z = 1`, `2x + 3y - z = 4`, `x + 2y = 3`. Let `z = t`.","options":[{"t":"No solution","why":"The zero row is [0 0 0 | 0], not a contradiction.","_n":"2sb22","_k":"62e03b3c"},{"t":"(`-1 + 2t`, `2 - t`, `t`)","why":"R₂ − 2R₁ and R₃ − R₁ both give `y + z = 2`: a zero row follows. `y = 2 - t`, `x = 1 - y + z`.","_n":"2taf2","_k":"3c415f09"},{"t":"(`1 + t`, `2 - t`, `t`)","why":"That forgets the `y`-term when back-substituting: `x = 1 - (2 - t) + t`.","_n":"2ub02","_k":"d36fcda0"},{"t":"(−1, 2, 0)","why":"One point of the line. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`.","_n":"2vad2","_k":"ca9cdb2a"}]},"b":{"prompt":"Solve `x - y + z = 2`, `2x - y + 3z = 5`, `x + 2z = 3`. Let `z = t`.","options":[{"t":"(`2 - t`, `1 - t`, `t`)","why":"Forgets the `y`-term: `x = 2 + y - z`.","_n":"2wae2","_k":"45ea4aa6"},{"t":"(3, 1, 0)","why":"One point of the line. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`.","_n":"2xab2","_k":"c2714b66"},{"t":"No solution","why":"The zero row is [0 0 0 | 0], not a contradiction.","_n":"2yac2","_k":"9dc266ea"},{"t":"(`3 - 2t`, `1 - t`, `t`)","why":"R₂ − 2R₁ and R₃ − R₁ both give `y + z = 1`: a zero row follows. `y = 1 - t`, `x = 2 + y - z`.","_n":"2zb92","_k":"be4ecff5"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"For which `k` does `x + y + z = 2`, `x + 2y + 2z = 3`, `2x + 3y + 3z = k` have infinitely many solutions?","options":[{"t":"`k = 5`","why":"R₃ − R₁ − R₂ gives [0 0 0 | `k - 5`]: a zero row only when `k = 5`.","_n":"30ba2","_k":"bce56b94"},{"t":"Every `k` except 5","why":"Swaps the cases: for `k != 5` there’s no solution.","_n":"31372","_k":"d2f47a43"},{"t":"`k = 0`","why":"The zero row needs `k - 5 = 0`, not `k = 0`.","_n":"32362","_k":"b6af9c6d"},{"t":"No value: three equations in three unknowns always have one solution","why":"Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"33392","_k":"f1f7d8bb"}]},"b":{"prompt":"For which `k` does `x - y + z = 1`, `2x + y - z = 3`, `3x = k` have infinitely many solutions?","options":[{"t":"No value: three equations in three unknowns always have one solution","why":"Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"34382","_k":"d4faac91"},{"t":"`k = 0`","why":"R₃ − R₁ − R₂ gives [0 0 0 | `k - 4`]: it needs `k - 4 = 0`, not `k = 0`.","_n":"353b2","_k":"b722480e"},{"t":"Every `k` except 4","why":"Swaps the cases: for `k != 4` there’s no solution.","_n":"363a2","_k":"69b26542"},{"t":"`k = 4`","why":"R₁ + R₂ = `3x = 4`.","_n":"373d2","_k":"0da143f9"}]}},{"id":"c1","cat":"C","goal":[2,5],"a":{"prompt":"Which is the best explanation of why row operations don’t change a system’s solutions?","options":[{"t":"“Because the numbers in the matrix stay the same.”","why":"They change.","_n":"383c2","_k":"c81cfe92"},{"t":"“Because you can do anything to both sides of an equation, including multiplying by 0.”","why":"That changes the solutions. Allowed: swap rows, multiply a row by a non-zero number, add a multiple of another row.","_n":"392f2","_k":"79dfa2ad"},{"t":"“Because the planes don’t move.”","why":"They do; only the intersection stays.","_n":"3a2e2","_k":"a9dd414a"},{"t":"“Each operation (swap, multiply a row by a non-zero number, add a multiple of one row to another) can be undone, so the old and new systems are satisfied by exactly the same points. The planes move, but their intersection doesn’t.”","why":"Undoable steps keep exactly the same solutions.","_n":"3ba52","_k":"d6257ff3"}]},"b":{"prompt":"Which is the best explanation of why multiplying a row by 0 isn’t allowed?","options":[{"t":"“It turns an equation into 0 = 0, which every point satisfies. The equation’s information is lost and can’t be recovered, so the new system can have more solutions.”","why":"The step can’t be undone, so solutions can be gained.","_n":"3ca62","_k":"38b677a1"},{"t":"“Because rows can only be multiplied by positive numbers.”","why":"Negative multipliers are fine.","_n":"3da72","_k":"d3323fd0"},{"t":"“It’s allowed: multiplying both sides by 0 keeps the equation balanced.”","why":"That changes the solutions. Allowed: swap rows, multiply a row by a non-zero number, add a multiple of another row.","_n":"3ea82","_k":"bbbbf70a"},{"t":"“Because 0 makes the system inconsistent.”","why":"0 = 0 isn’t a contradiction.","_n":"3fa92","_k":"2c604318"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the clearest way to report the solution of \u003cspan class=\"sy-mx c4\">\u003cspan class=\"vh\">matrix [1 2 0 | 3], [0 0 1 | 4], [0 0 0 | 0]\u003c/span>\u003cspan class=\"sy-mxg\" aria-hidden=\"true\">\u003cspan>1\u003c/span>\u003cspan>2\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"sy-b\">3\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan>1\u003c/span>\u003cspan class=\"sy-b\">4\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"sy-b\">0\u003c/span>\u003c/span>\u003c/span>?","options":[{"t":"“(3, 0, 4).”","why":"One point of the line. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`.","_n":"3gaa2","_k":"1800c221"},{"t":"“`x = 3 - 2t`, `y = t`, `z = t`.”","why":"`z = 4` is fixed by row 2; here `y` is the free variable.","_n":"3hab2","_k":"ff5b0665"},{"t":"“No solution, because row 3 is all zeros.”","why":"A zero row says 0 = 0. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"3iac2","_k":"99ef23e1"},{"t":"“`x = 3 - 2t`, `y = t`, `z = 4`, `t ∈ ℝ`: a line of solutions.”","why":"`z` is fixed by row 2, and `y` has no leading entry, so `y` is the free variable.","_n":"3jad2","_k":"503c172a"}]},"b":{"prompt":"Which is the clearest way to report the solution of \u003cspan class=\"sy-mx c4\">\u003cspan class=\"vh\">matrix [1 0 −1 | 2], [0 1 3 | 1], [0 0 0 | 0]\u003c/span>\u003cspan class=\"sy-mxg\" aria-hidden=\"true\">\u003cspan>1\u003c/span>\u003cspan>0\u003c/span>\u003cspan>−1\u003c/span>\u003cspan class=\"sy-b\">2\u003c/span>\u003cspan>0\u003c/span>\u003cspan>1\u003c/span>\u003cspan>3\u003c/span>\u003cspan class=\"sy-b\">1\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan>0\u003c/span>\u003cspan class=\"sy-b\">0\u003c/span>\u003c/span>\u003c/span>?","options":[{"t":"“`x = 2 + t`, `y = 1 - 3t`, `z = t`, `t ∈ ℝ`: a line of solutions.”","why":"`z` has no leading entry, so it’s free: `x = 2 + z`, `y = 1 - 3z`.","_n":"3kae2","_k":"3994b11e"},{"t":"“(2, 1, 0).”","why":"One point of the line. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`.","_n":"3lab2","_k":"08fb2f89"},{"t":"“No solution, because row 3 is all zeros.”","why":"A zero row says 0 = 0. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"3maa2","_k":"fedd0ff7"},{"t":"“`x = 2 - t`, `y = 1 + 3t`, `z = t`.”","why":"Moving `-z` and `3z` across flips their signs.","_n":"3na92","_k":"1ed996c0"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A café sells small, medium and large coffees for $2, $3 and $4. One day it sold 100 coffees for $320, with twice as many mediums as larges. How many of each size did it sell?","options":[{"t":"Infinitely many answers","why":"Three independent equations fix one answer. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"3oa82","_k":"f12333fc"},{"t":"28 small, 24 medium, 48 large","why":"That reverses ‘twice as many mediums as larges’ (`l = 2m`).","_n":"3paf2","_k":"67d00a79"},{"t":"10 small, 60 medium, 30 large","why":"`s + m + l = 100`, `2s + 3m + 4l = 320`, `m - 2l = 0`.","_n":"3qae2","_k":"0612bc9c"},{"t":"40 small, 40 medium, 20 large","why":"Satisfies the count and the ratio, but earns $280.","_n":"3rad2","_k":"90ea54d5"}]},"b":{"prompt":"A theatre sells child, student and adult tickets for $5, $8 and $10. It sold 50 tickets for $430, with as many student tickets as child tickets. How many of each?","options":[{"t":"20 child, 20 student, 10 adult","why":"Count and ratio fit, but that earns $360.","_n":"3sac2","_k":"3a2d80bf"},{"t":"10 child, 10 student, 30 adult","why":"`c + s + a = 50`, `5c + 8s + 10a = 430`, `s - c = 0`.","_n":"3tb32","_k":"3ed721b6"},{"t":"Infinitely many answers","why":"Three independent equations fix one answer. Check the other rows first: a contradiction [0 0 0 | `c`] anywhere means none.","_n":"3ub22","_k":"5c8e0815"},{"t":"10 child, 30 student, 10 adult","why":"Columns mixed up: that earns $390. Each column is one variable. A missing variable gets a 0 in its column.","_n":"3va93","_k":"8992bb93"}]}},{"id":"a2","cat":"A","goal":[5,6],"a":{"prompt":"Describe where the planes `x + y + z = 6`, `x - y + z = 2` and `2x + 2z = 8` meet.","options":[{"t":"In a line: (`4 - t`, 2, `t`), `t ∈ ℝ`","why":"R₃ = R₁ + R₂, so a zero row appears; R₁ − R₂ gives `y = 2`.","_n":"3waa3","_k":"de264441"},{"t":"In a plane","why":"Only one equation is redundant, so a line remains.","_n":"3xa73","_k":"a5636ad7"},{"t":"Nowhere","why":"No contradiction appears.","_n":"3ya83","_k":"4debc061"},{"t":"At the single point (4, 2, 0)","why":"One point of the line. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`.","_n":"3zad3","_k":"724ebd0a"}]},"b":{"prompt":"Describe where the planes `x + y + z = 4`, `x + y - z = 2` and `2x + 2y = 6` meet.","options":[{"t":"At the single point (3, 0, 1)","why":"One point of the line. There’s a whole line of solutions. Let the free variable be `t` and write every variable in terms of `t`.","_n":"40ae3","_k":"8b6724ec"},{"t":"In a line: (`3 - t`, `t`, 1), `t ∈ ℝ`","why":"R₃ = R₁ + R₂; R₁ − R₂ gives `z = 1`.","_n":"41ab3","_k":"2834b6b5"},{"t":"Nowhere","why":"No contradiction appears.","_n":"42ac3","_k":"29924abc"},{"t":"In a plane","why":"Only one equation is redundant, so a line remains.","_n":"43b13","_k":"dda545d2"}]}}]},"task":{"title":"Third plane in the sheaf","summary":"Third plane in the sheaf","statement":"\u003cp>The planes `x + y + z = 3` and `x - y + 3z = 1` meet in a line. Design a third equation `ax + by + cz = d` so that the three planes share that whole line (infinitely many solutions), and the conditions below hold. There are many answers.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The system has infinitely many solutions.\u003c/li>\u003cli>Your equation isn’t a multiple of either given equation.\u003c/li>\u003cli>`a`, `b` and `c` are all non-zero.\u003c/li>\u003cli>Your plane doesn’t pass through the origin.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers from −9 to 9. The preview shows the two given planes (blue, teal), your plane (orange) and the system’s row-echelon form.\u003c/p>","checks":["Infinitely many solutions","A new plane","No zero coefficients","Misses the origin"],"tips":["Row-reduce with your equation as row 3: you need a zero row, not [0 0 0 | `c`]. Every combination `p`R₁ + `q`R₂ works.","Your equation is one of the given ones (or a multiple): the third plane must be different.","A zero coefficient makes the plane parallel to an axis. Try a combination with unequal multiples, like R₁ + 2R₂.","`d = 0` puts the plane through the origin. Choose a different combination."],"explainPrompt":"Explain how you built your equation and how the reduced matrix shows infinitely many solutions.","vocab":"Use the words row operation, row-echelon form, parameter and line of intersection.","pvEnter":"Enter `a`, `b`, `c` and `d` (at least one of `a`, `b`, `c` non-zero) to see the system’s row-echelon form.","pvRef":"Row-echelon form of the system (R₁, R₂, then your equation):","pvNone":"Row 3 reduces to [0 0 0 | `c`] with `c != 0`: no solution. Your plane misses the line.","pvInf":"A zero row and no contradiction: infinitely many solutions. Your plane contains the line.","pvOne":"Every row has a leading entry: exactly one solution. Your plane cuts the line once.","more":"There’s more than one answer. Multiples of one equation count as the same plane. Can you find another?","after3":"Every answer is `p(x + y + z - 3) + q(x - y + 3z - 1) = 0` for some `p`, `q`. Planes like these, all through one line, are called a sheaf: module 57’s first configuration."},"cards":[["Augmented matrix","Coefficients in columns (0 for a missing variable), constants after a bar."],["Three row operations","Swap rows; multiply a row by a non-zero number; add a multiple of one row to another."],["Equivalent systems","Same solutions; row operations produce them."],["Not allowed","Multiplying a row by 0; adding a constant to a row; changing a column."],["Row-echelon form","Zeros below each leading entry; each leading entry right of the one above."],["Back-substitution","Solve the bottom row first, then work up."],["[0 0 0 | `c`], `c != 0`","No solution: inconsistent."],["[0 0 0 | 0]","That equation adds nothing; with no contradiction, look for a free variable."],["Infinitely many solutions","Let a free variable be `t`; write the others in terms of `t`."],["Consistent","Has at least one solution."],["Geometry","Row operations move the planes but not their intersection."],["Three planes, a zero row","A line (one zero row) or a plane (two zero rows) of solutions."]]}};</script>
