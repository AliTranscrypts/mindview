.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 26: hero equation and chips, Ratio meter (graph + slope panel, dial, controls, readouts), Part 3 stations, Rates by hand boxes, task */
.bx-heq{white-space:nowrap;font-size:.84em}
.bx-hchips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;min-height:2.1em;font:600 .92rem var(--font-ui)}
.bx-hchip{display:inline-flex;align-items:center;border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.2em .8em;
  transition:opacity .45s ease,transform .45s ease;animation:bx-pop .35s ease}
.bx-hchip .m{font-size:1.15em}
.bx-hm{border-color:var(--hi);background:var(--hi);color:var(--hi-ink);font-size:1.05rem}
.bx-merging .bx-hchip{opacity:0;transform:scale(.6)}
.bx-merging .bx-hchip:first-child{transform:translateX(60%) scale(.6)}
.bx-merging .bx-hchip:last-child{transform:translateX(-60%) scale(.6)}
@keyframes bx-pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

.bx-ex{display:flex;gap:16px 28px;align-items:flex-start}
.bx-colL{flex:1.45 1 0;min-width:0}
.bx-colR{flex:1 1 0;min-width:0}
.bx-main,.bx-ctrl,.bx-meter,.bx-read{min-width:0}
.bx-eq{min-height:1.6em;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.bx-eq .m{white-space:nowrap}
canvas.plot.bx-top{aspect-ratio:16/10}
canvas.plot.bx-lowc{aspect-ratio:16/6.2}
.bx-low{margin-top:6px}
.bx-low[hidden]{display:none}
.bx-pcap{margin:4px 0 2px;font-size:.95rem;min-height:1.5em}
.bx-pcap .bx-sw{margin-right:6px}
.bx-sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;flex:0 0 auto}
.bx-swd{background:repeating-linear-gradient(90deg,var(--ink) 0 7px,transparent 7px 11px)}
.bx-meter{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px 10px;background:var(--sheet);margin-bottom:14px}
.bx-mt{margin:0;font-weight:700;font-size:.92rem;color:var(--ink-2)}
#bx-dial{max-width:300px;margin:0 auto}
.bx-dial{display:block;width:100%;height:auto}
.bx-track{fill:none;stroke:var(--ink-2);stroke-opacity:.4;stroke-width:10;stroke-linecap:round}
.bx-tk{stroke:var(--ink-2);stroke-width:1.2}
.bx-tkL{stroke:var(--ink);stroke-width:2}
.bx-tl{fill:var(--ink);font:600 11.5px var(--font-ui);text-anchor:middle;dominant-baseline:middle}
.bx-end{fill:var(--ink-2);font:600 10.5px var(--font-ui);text-anchor:middle;dominant-baseline:hanging}
.bx-needle{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.bx-needle.bx-n1{stroke:var(--pen)}
.bx-needle.bx-n2{stroke:var(--f3)}
.bx-hub{fill:var(--ink)}
.bx-mv{margin:2px 0 0;text-align:center;font:600 1.05rem var(--font-ui);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 6px}
.bx-ctrl{margin-top:10px}
.bx-how{margin:8px 0 10px}
.bx-grp{margin-bottom:4px}
.bx-grp[hidden],.bx-rw[hidden],#bx-rwin[hidden]{display:none}
.bx-sl output{font-size:1.25rem}
.bx-chips{gap:6px;margin:0 0 10px}
.bx-chips .chip{min-width:40px}
.bx-b2tag{display:inline-block;border:1.5px solid var(--p-b);color:var(--p-b);border-radius:999px;padding:0 .5em;line-height:1.4;margin-left:4px}
.bx-b2tag .m{font-size:1.05em}
.bx-rw{margin-top:6px;padding-top:10px;border-top:1px solid var(--rule)}
#bx-rwin{margin-top:10px}
.bx-kx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 2px}
.bx-kl{font-weight:700;font-size:.92rem}
.bx-kx .numin{width:5.2rem}
.bx-ln{font-size:1.15rem}
.bx-kh{margin:2px 0}
.bx-km{min-height:1.3em;margin:2px 0 0;font-weight:600}
.bx-km.bx-kerr{color:var(--red)}
.bx-rt{margin:0 0 4px;font-weight:700;display:flex;align-items:center;gap:6px}
.bx-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px}
.bx-par{margin-top:8px;border-top:1.5px solid var(--rule);padding-top:8px}

.bx-stc{margin:0 0 6px}
.bx-st[hidden]{display:none}
.bx-st h3{margin-top:6px}
.bx-stg{align-items:start}
.bx-stl,.bx-str{min-width:0}
canvas.plot.bx-stp{aspect-ratio:16/10}
canvas.plot.bx-stp2{aspect-ratio:16/7}
.bx-bar{margin:12px 0 4px}
.bx-barl{margin:0 0 4px;font-weight:700}
.bx-bart{height:12px;border-radius:6px;background:var(--plot-grid);overflow:hidden}
.bx-bart span{display:block;height:100%;background:var(--f3);border-radius:6px;transition:width .3s ease}
.bx-alg{margin-top:12px}
.bx-steps{margin:8px 0 6px;padding-left:1.4em}
.bx-steps li{margin:4px 0;color:var(--ink-2)}
.bx-steps li.cur{color:var(--ink);font-weight:600}

.bx-rbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 4px;font:400 1.1rem var(--font-math)}
.bx-rinp{width:11rem;max-width:100%}
.bx-hl{margin:10px 0 6px;font-weight:700}
canvas.plot.bx-tp{aspect-ratio:16/11}

@media (max-width:820px){
  .bx-ex{flex-direction:column;align-items:stretch}
  .bx-colL,.bx-colR{display:contents}
  .bx-main{order:1}
  .bx-meter{order:2;margin-bottom:0}
  .bx-ctrl{order:3;margin-top:0}
  .bx-read{order:4}
}
@media (max-width:560px){
  .bx-two{grid-template-columns:minmax(0,1fr)}
  .bx-two > div + div{margin-top:10px;padding-top:8px;border-top:1px solid var(--rule)}
  canvas.plot.bx-top{aspect-ratio:16/11}
  canvas.plot.bx-lowc{aspect-ratio:16/7.5}
}

on-of-a-line-in-r2","title":"Cartesian Equation of a Line in R²","kind":"topic","group":"8"},{"nn":"50","slug":"equations-of-lines-in-r3","title":"Vector, Parametric and Symmetric Equations of Lines in R³","kind":"topic","group":"8"},{"nn":"51","slug":"vector-equation-of-a-plane","title":"Vector Equation of a Plane","kind":"topic","group":"8"},{"nn":"52","slug":"cartesian-equation-of-a-plane","title":"Cartesian Equation of a Plane","kind":"topic","group":"8"},{"nn":"53","slug":"intersection-of-lines-with-planes","title":"Intersection of Lines with Planes","kind":"topic","group":"9"},{"nn":"54","slug":"intersection-of-lines","title":"Intersection of Lines in R² and R³","kind":"topic","group":"9"},{"nn":"55","slug":"systems-of-equations-matrices","title":"Systems of Equations (Matrices)","kind":"topic","group":"9"},{"nn":"56","slug":"intersection-of-two-planes","title":"Intersection of Two Planes","kind":"topic","group":"9"},{"nn":"57","slug":"intersection-of-three-planes","title":"Intersection of Three Planes","kind":"topic","group":"9"},{"nn":"58","slug":"distance-point-to-line","title":"Distance from a Point to a Line in R² and R³","kind":"topic","group":"9"},{"nn":"59","slug":"distance-point-to-plane","title":"Distance from a Point to a Plane","kind":"topic","group":"9"}]},"salt":"70ab11ad","content":{"id":"26-derivative-of-b-to-the-x","kind":"topic","title":"The derivative of y = bˣ","topic":"The Derivative of y = bˣ","readyTopic":"the derivative of `y = b^x`","hero":{"eq":"\u003cspan class=\"bx-heq\">\u003cspan class=\"m\">\u003cspan class=\"fnm\">d\u003c/span>/\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span> `@b{b}^x = @b{b}^x · ln @b{b}`\u003c/span>","eqLabel":"d by d x of b to the x equals b to the x times ln b","eqSize":"md","headline":"Slope = height × one constant","text":"In module 25, `e^x` was its own derivative. Every other exponential is almost as simple: its slope at any point is its height multiplied by the same constant, the \u003cstrong>natural logarithm of the base\u003c/strong>. That’s why exponentials model \u003cstrong>growth\u003c/strong> and \u003cstrong>decay\u003c/strong>: the bigger the amount, the faster it changes.","fig":{"shape":"wide","aria":"The graph of y = 2ˣ with a tangent line that moves from x = 0 to x = 1 to x = 2. At each point, slope divided by height is about 0.69, which is ln 2."}},"goals":["I can explain why the slope of `y = b^x` is a constant multiple of its height, and identify the constant as `ln b`.","I can differentiate `b^x` and `b^{g(x)}` using \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `b^x = b^x ln b` and the chain rule.","I can rewrite `b^x` as `e^{x ln b}` and use it to derive the rule.","I can use the sign and size of `ln b` to compare how fast exponentials grow or decay.","I can solve doubling and half-life problems with instantaneous rates, in exact form and with given values."],"start":{"warmup":{"questions":[{"id":"w1","skill":"\u003ci>e\u003c/i> and ln","goal":3,"prompt":"Simplify `e^{ln 7}`.","options":[{"t":"7","why":"`e^x` and `ln x` undo each other.","_n":"0045","_k":"44a85572"},{"t":"`e^7`","why":"That drops the ln. The exponent is `ln 7`, not 7.","_n":"1015","_k":"625dc1c1"},{"t":"`ln 7`","why":"That stops halfway. `e` raised to `ln 7` undoes the ln.","_n":"2025","_k":"2f792399"},{"t":"`7e`","why":"There’s no product here.","_n":"3ff5","_k":"a935f932"}],"hints":["What does `ln 7` mean?","`ln 7` is the power of `e` that gives 7.","So `e^{ln 7} = 7`."]},{"id":"w2","skill":"\u003ci>e\u003c/i> and ln","goal":3,"prompt":"Which expression equals `5^x` for every `x`?","options":[{"t":"`e^{x ln 5}`","why":"`5 = e^{ln 5}`, so `5^x = (e^{ln 5})^x = e^{x ln 5}`.","_n":"4005","_k":"67ad35b2"},{"t":"`5e^x`","why":"Try `x = 0`: `5e^0 = 5`, but `5^0 = 1`.","_n":"5fd5","_k":"3bb5314e"},{"t":"`e^{5 ln x}`","why":"That swaps the base and the exponent. That’s `x^5`.","_n":"6fe5","_k":"3f06ce94"},{"t":"`ln(5^x)`","why":"That’s `x ln 5`, a straight line.","_n":"70b5","_k":"ed116438"}],"hints":["Write 5 as a power of `e`.","`5 = e^{ln 5}`.","Power of a power: multiply the exponents."]},{"id":"w3","skill":"Chain rule with \u003ci>e\u003c/i>","goal":2,"prompt":"Differentiate `y = e^{3x}`.","options":[{"t":"`3x e^{3x - 1}`","why":"The power rule doesn’t apply: the exponent is variable.","_n":"80c5","_k":"3ae5ae32"},{"t":"`e^3`","why":"That’s a constant; `y` isn’t.","_n":"9731","_k":"c0f77966"},{"t":"`3e^{3x}`","why":"Outside: `e^{3x}`; inside: 3.","_n":"a721","_k":"d6d7f1e8"},{"t":"`e^{3x}`","why":"The exponent changes 3 times as fast as `x`.","_n":"b751","_k":"d32e7d0b"}],"hints":["The outer function is `e^u`.","`dy/du = e^u`, `du/dx = 3`.","`3e^{3x}`."]},{"id":"w4","skill":"Chain rule with \u003ci>e\u003c/i>","goal":2,"prompt":"Differentiate `y = e^{x^2}`.","options":[{"t":"`x^2 e^{x^2 - 1}`","why":"That’s the power rule on an exponential.","_n":"c741","_k":"77555533"},{"t":"`2x e^{x^2}`","why":"`e^u` times `u′ = 2x`.","_n":"d6f1","_k":"228ea6d2"},{"t":"`e^{x^2}`","why":"Multiply by the inside’s derivative.","_n":"e6e1","_k":"c61916e7"},{"t":"`e^{2x}`","why":"That differentiates the exponent in place. The exponent stays; its derivative multiplies.","_n":"f711","_k":"098e04db"}],"hints":["Inside: `u = x^2`.","\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `e^u = e^u · u′`.","`2x e^{x^2}`."]},{"id":"w5","skill":"Signs of ln","goal":4,"prompt":"Which of these is negative?","options":[{"t":"`ln 1`","why":"`ln 1 = 0`, neither positive nor negative.","_n":"g701","_k":"0158be83"},{"t":"`ln e`","why":"`ln e = 1`.","_n":"h7b1","_k":"8a32723e"},{"t":"`ln(1/2)`","why":"`e` to a negative power is less than 1, so ln of a number below 1 is negative: `ln(1/2) = -ln 2`.","_n":"i7a1","_k":"3e00e1d3"},{"t":"`ln 2`","why":"2 > 1, so `ln 2 > 0`.","_n":"j011","_k":"7a09a036"}],"hints":["`ln x \u003c 0` exactly when `0 \u003c x \u003c 1`.","Which input is between 0 and 1?","`ln(1/2) = -ln 2 ≈ -0.693`."]},{"id":"w6","skil s 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type an exact answer such as 4 ln 2, −1/ln 3, 5/2 or e (write ln for the natural log), then press Check.","msgs":{"empty":"Type your answer first.","err":"Type an exact answer using numbers, fractions, ln and e, such as 4 ln 2 or −1/ln 3.","lnneg":"ln needs a positive number.","approx":"That’s a decimal approximation. Keep the answer exact: leave the ln (or `e`) in it."},"items":[{"id":"r1","goal":2,"prompt":"Exact slope of `y = 3^x` at `x = 2`.","label":"slope =","_a":"bBINDBMdWEgEbQ==","display":"`9 ln 3`","wrong":[{"v":9,"fb":"Only `e^x` is its own derivative. For `3^x` the slope is `3^x` times `ln 3` ≈ 1.099."},{"v":6,"fb":"The power rule is for `x^n`, where the exponent is fixed. In `3^x` the exponent is the variable."}],"why":"`y′ = 3^x ln 3`, so at `x = 2` the slope is `9 ln 3`."},{"id":"r2","goal":2,"prompt":"`f(x) = 2^{x^2}`. Find `f′(1)`.","label":"`f′(1) =`","_a":"bBINDBMdVUgFbQ==","display":"`4 ln 2`","wrong":[{"v":["ln",2,2],"fb":"The height at `x = 1` is `2^1 = 2`, times `2x ln 2 = 2 ln 2`."},{"v":["ln",1,2],"fb":"The exponent `x^2` changes at rate `2x`: multiply by it, and by the height."}],"why":"`f′(x) = 2^{x^2} · ln 2 · 2x`, so `f′(1) = 2 · ln 2 · 2 = 4 ln 2`."},{"id":"r3","goal":2,"star":true,"prompt":"At what `x` do `y = 4^x` and `y = 2^{x + 3}` have equal slopes?","label":"`x =`","_a":"BQ==","display":"`x = 2`","wrong":[{"v":3,"fb":"That’s where the heights are equal, `4^x = 2^{x + 3}`."}],"wrongDefault":"`4^x ln 4 = 2^{x + 3} ln 2` gives `2 · 2^{2x} = 8 · 2^x`, so `2^x = 4`.","hints":["Set the two slopes equal.","`4^x ln 4 = 2^{x + 3} ln 2` and `ln 4 = 2 ln 2`.","`2 · 2^{2x} = 8 · 2^x`, so `2^x = 4` and `x = 2`."],"why":"Both slopes are `16 ln 4 = 32 ln 2` at `x = 2`."},{"id":"r4","goal":2,"star":true,"prompt":"The tangent to `y = 3^x` at `x = 0` crosses the `x`-axis where?","label":"`x =`","_a":"bBITDl8TTUkGHFI/","display":"`x = -{1}/{ln 3}`","wrong":[{"v":["ln",-1,3],"fb":"The tangent is `y = 1 + (ln 3)x`; set `y = 0`."},{"v":-3,"fb":"Only `e^x` is its own derivative. For `3^x` the slope is `3^x` times `ln 3` ≈ 1.099."}],"why":"The tangent is `y = 1 + (ln 3)x`; `y = 0` gives `x = -1/ln 3`."},{"id":"r5","goal":5,"star":true,"prompt":"`A(t) = A_0(1/2)^{t/8}`, `t` in days. When is the rate of decay one-quarter of its rate at `t = 0`?","label":"`t =`","unit":"days","_a":"BgY=","display":"`t = 16` days","wrong":[{"v":2,"fb":"The ratio `A′(t)/A′(0) = (1/2)^{t/8} = 1/4`, so `t/8 = 2`."},{"v":32,"fb":"`(1/2)^{t/8} = 1/4` means two half-lives."}],"why":"`A′(t)/A′(0) = (1/2)^{t/8} = 1/4`, so `t/8 = 2` and `t = 16` days."},{"id":"r6","goal":4,"star":true,"prompt":"For which base `b` does the tangent to `y = b^x` at `x = 1` pass through the origin?","label":"`b =`","_a":"bBIEQB0APA==","display":"`b = e`","wrong":[{"v":1,"fb":"`1^x` is flat; its tangent is `y = 1`."}],"wrongDefault":"Tangent: `y - b = b ln b (x - 1)`. At `(0, 0)`: `-b = -b ln b`, so `ln b = 1`.","hints":["Write the tangent line at `(1, b)`.","Substitute `(0, 0)`.","`ln b = 1`, so `b = e`."],"why":"The tangent `y - b = b ln b (x - 1)` passes through `(0, 0)` when `ln b = 1`."}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Zoe","how":"","goal":[2,3,4],"instruction":"Zoe made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the slope of `y = 5^{2x}` at `x = 1`.","steps":["`5^{2x} = (5^2)^x = 25^x`.","\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `25^x = x · 25^{x - 1}`.","At `x = 1`: `1 · 25^0 = 1`.","The slope at `x = 1` is 1."],"_a":"Bg==","stepFb":["Step 1 is correct: a power of a power. Keep checking.","","Step 3 evaluates step 2 correctly. The mistake is earlier.","This follows from the steps before it."],"fixes":[{"t":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `25^x = 25^x ln 25`, so the slope is `25 ln 25 = 50 ln 5`.","why":"The variable is in the exponent, so use \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `b^x = b^x ln b`.","_n":"1k000","_k":"f5874e7d"},{"t":"Step 2 is correct.","why":"The power rule is for `x^n`, not `b^x`.","_n":"1lf30","_k":"8a76d480"},{"t":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `25^x = 25^x`, so the slope is 25.","why":"Only `e^x` is its own derivative. For `25^x` the slope is `25^x` times `ln 25`.","_n":"1mf20","_k":"12c546fc"},{"t":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `25^x = 25^x log 25`.","why":"The constant is the \u003cstrong>natural\u003c/strong> log of the base, because `b = e^{ln b}`.","_n":"1n690","_k":"9b6a5958"}],"hints":["Is the variable in the base or the exponent?","Use \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `b^x = b^x ln b`.","`25 ln 25 = 50 ln 5`."]},{"id":"e2","goal":4,"task":"`A(t) = 40(1/2)^{t/4}` mg. Find the rate of change at `t = 8` h.","steps":["`A′(t) = 40(1/2)^{t/4} · ln(1/2) · (1/4)`.","`= 10(1/2)^{t/4} ln(1/2)`.","`ln(1/2) = ln 2`, so `A′(t) = 10(1/2)^{t/4} ln 2`.","`A′(8) = 10 · (1/4) · ln 2 = 2.5 ln 2 ≈ 1.73` mg/h.","The amount is increasing by about 1.73 mg/h."],"_a":"BQ==","stepFb":["Step 1 is correct: base rule and chain factor 1/4.","Step 2 is correct.","","Step 4 follows step 3.","This follows; but should a decaying drug increase?"],"fixes":[{"t":"Step 3 is correct.","why":"`ln(1/2) = -ln 2 \u003c 0`. A base between 0 and 1 gives a negative slope everywhere.","_n":"1o6a0","_k":"9daa8f4d"},{"t":"`ln(1/2) = -ln 2`, so `A′(8) = -2.5 ln 2 ≈ -1.73` mg/h: decreasing.","why":"A base between 0 and 1 has a negative ln, so a decaying drug has a negative rate.","_n":"1p6b0","_k":"b2f5536a"},{"t":"`ln(1/2) = 1/ln 2`.","why":"That’s a different number (≈ 1.44).","_n":"1q6c0","_k":"f1bc8d39"},{"t":"`ln(1/2) = 1/2`.","why":"`ln(1/2) ≈ -0.693`.","_n":"1r6d0","_k":"ba8381d9"}],"hints":["Is 1/2 bigger or smaller than 1?","ln of a number between 0 and 1 is negative.","`ln(1/2) = -ln 2`."]},{"id":"e3","goal":3,"task":"Show that \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `3^x = 3^x ln 3`.","steps":["`3 = e^{ln 3}`, so `3^x = e^{x ln 3}`.","\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `e^{x ln 3} = e^{x ln 3}`.","`= 3^x`.","So \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `3^x = 3^x`."],"_a":"Bg==","stepFb":["Step 1 is correct.","","Step 3 rewrites step 2 correctly.","This follows, but check it at `x = 0`: is the slope 1?"],"fixes":[{"t":"`= e^{ln 3} = 3`.","why":"That’s a number, not a function.","_n":"1s6e0","_k":"ae6e631d"},{"t":"Chain rule: \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `e^{x ln 3} = e^{x ln 3} · ln 3 = 3^x ln 3`.","why":"The inside `u = x ln 3` has `u′ = ln 3`.","_n":"1t6f0","_k":"30d8d99a"},{"t":"Step 2 is correct.","why":"The exponent is `x ln 3`, which changes at rate `ln 3`.","_n":"1u700","_k":"807f03c1"},{"t":"`= (x ln 3) e^{x ln 3 - 1}`.","why":"The power rule is for `x^n`, where the exponent is fixed. In `3^x` the exponent is the variable.","_n":"1v710","_k":"0d07c3af"}],"hints":["What is the inside function?","`u = x ln 3`, and `u′ = ln 3`.","`e^u · u′ = 3^x ln 3`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the ratio m&#101;ter: that the ratio never changed as you moved the point, or that it matched `ln b`?"},{"id":"j2","q":"In your own words, why is the derivative of `2^x` a vertical stretch of `2^x`?"},{"id":"j3","q":"Explain to a friend how to differentiate `3^{5x}` and why the power rule doesn’t apply."},{"id":"j4","q":"What part of growth and decay rates are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `7^x = ?`","options":[{"t":"`7^x/ln 7`","why":"Multiply by `ln 7`, don’t divide. Check at `x = 0`: the slope of `2^x` is about 0.69, which is `ln 2`, not `1/ln 2 ≈ 1.44`.","_n":"1w720","_k":"8ec0fcf5"},{"t":"`x · 7^{x - 1}`","why":"That’s the power rule on an exponential. The power rule is for `x^n`, where the exponent is fixed. In `7^x` the exponent is the variable.","_n":"1x6f0","_k":"87833fc1"},{"t":"`7^x`","why":"Only `e^x` is its own derivative.","_n":"1y6e0","_k":"9524ee47"},{"t":"`7^x ln 7`","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `b^x = b^x ln b`, with `b = 7`.","_n":"1z6d0","_k":"bb69e22e"}]},"b":{"prompt":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `6^x = ?`","options":[{"t":"`6^x ln 6`","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `b^x = b^x ln b`, with `b = 6`.","_n":"206c0","_k":"1e43f89e"},{"t":"`6^x/ln 6`","why":"Multiply by `ln 6`, don’t divide. Check at `x = 0`: the slope of `2^x` is about 0.69, which is `ln 2`, not `1/ln 2 ≈ 1.44`.","_n":"21730","_k":"91e0efd7"},{"t":"`x · 6^{x - 1}`","why":"The power rule is for `x^n`, where the exponent is fixed. In `6^x` the exponent is the variable.","_n":"22720","_k":"b15bc771"},{"t":"`6^x`","why":"Only `e^x` is its own derivative. For `6^x` the slope is `6^x` times `ln 6`.","_n":"23710","_k":"c7e1b7db"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `2^{5x} = ?`","options":[{"t":"`5x · 2^{5x - 1}`","why":"The power rule is for `x^n`, where the exponent is fixed. In `2^x` the exponent is the variable.","_n":"24700","_k":"6782ecf9"},{"t":"`ln 2 · 2^{5x}`","why":"Multiply by the inside’s derivative, 5.","_n":"25770","_k":"57c01cc7"},{"t":"`5 ln 2 · 2^{5x}`","why":"Base rule, then the inside’s derivative, 5.","_n":"26760","_k":"c9c90b16"},{"t":"`5 · 2^{5x}`","why":"`ln 2` is missing.","_n":"277d2","_k":"198a41c4"}]},"b":{"prompt":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `3^{4x} = ?`","options":[{"t":"`4x · 3^{4x - 1}`","why":"The power rule is for `x^n`, where the exponent is fixed. In `3^x` the exponent is the variable.","_n":"287e2","_k":"6437803e"},{"t":"`4 ln 3 · 3^{4x}`","why":"Base rule, then the inside’s derivative, 4.","_n":"297b2","_k":"c51f2043"},{"t":"`4 · 3^{4x}`","why":"`ln 3` is missing. Only `e^x` is its own derivative. For `3^x` the slope is `3^x` times `ln 3` ≈ 1.099.","_n":"2a7c2","_k":"840048dd"},{"t":"`ln 3 · 3^{4x}`","why":"The exponent `4x` changes 4 times as fast as `x`: multiply by 4.","_n":"2b812","_k":"9e211349"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which function has a negative derivative for every `x`?","options":[{"t":"`y = 3^x`","why":"`ln 3 > 0`: increasing.","_n":"2c822","_k":"b6496513"},{"t":"`y = (1/3)^x`","why":"`ln(1/3) \u003c 0` and `(1/3)^x > 0`.","_n":"2d7f2","_k":"4c3bd3b2"},{"t":"`y = -(1/3)^x`","why":"Two negatives: `y′ = -(1/3)^x ln(1/3) > 0`.","_n":"2e802","_k":"9d7c6547"},{"t":"`y = (4/3)^x`","why":"The base is above 1, so `ln(4/3) > 0`.","_n":"2f752","_k":"a382620c"}]},"b":{"prompt":"Which function has a negative derivative for every `x`?","options":[{"t":"`y = -(0.2)^x`","why":"`y′ = -(0.2)^x ln 0.2 > 0`.","_n":"2g762","_k":"965bc0fe"},{"t":"`y = 2^x`","why":"`ln 2 > 0`.","_n":"2h832","_k":"6bc728b1"},{"t":"`y = 0.2^x`","why":"`ln 0.2 \u003c 0`.","_n":"2i822","_k":"65a83f96"},{"t":"`y = 1.2^x`","why":"The base is above 1.","_n":"2j852","_k":"56b26f15"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"`f(x) = b^x` and `f′(0) = 3`. What is `b`?","options":[{"t":"3","why":"`f′(0) = ln b`, not `b`.","_n":"2k842","_k":"9b1bd88d"},{"t":"`10^3`","why":"ln is base `e`, not base 10.","_n":"2l7f2","_k":"adee251d"},{"t":"`ln 3`","why":"That reverses the relationship: `ln b = 3`.","_n":"2m7e2","_k":"aa8fbef7"},{"t":"`e^3`","why":"`f′(0) = b^0 ln b = ln b = 3`, so `b = e^3`.","_n":"2n812","_k":"7b31b6c2"}]},"b":{"prompt":"`f(x) = b^x` and `f′(0) = -2`. What is `b`?","options":[{"t":"`e^{-2}`","why":"`ln b = -2`.","_n":"2o802","_k":"913ba48a"},{"t":"`ln 2`","why":"Reversed: `ln b = -2`.","_n":"2p7b2","_k":"00857965"},{"t":"−2","why":"A base can’t be negative; `f′(0) = ln b`.","_n":"2q7a2","_k":"4e14377f"},{"t":"`10^{-2}`","why":"The constant is the \u003cstrong>natural\u003c/strong> log of the base, because `b = e^{ln b}`. ln is base `e`, not base 10.","_n":"2rbd2","_k":"14f21af6"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"At what `x` does the tangent to `y = 2^x` have slope `16 ln 2`?","options":[{"t":"`x = 5`","why":"`2^5 = 32`.","_n":"2sbc2","_k":"3d62894c"},{"t":"`x = 4`","why":"`2^x ln 2 = 16 ln 2`, so `2^x = 16`.","_n":"2tbb2","_k":"93cfea39"},{"t":"`x = 2`","why":"At `x = 2` the slope is `4 ln 2`.","_n":"2uba2","_k":"ecb9fe90"},{"t":"`x = 16`","why":"`2^x = 16` gives `x = 4`, not 16.","_n":"2vb92","_k":"978ef8a3"}]},"b":{"prompt":"At what `x` does the tangent to `y = 3^x` have slope `27 ln 3`?","options":[{"t":"`x = 4`","why":"`3^4 = 81`.","_n":"2wb82","_k":"f42eeddf"},{"t":"`x = 27`","why":"`3^x = 27` gives `x = 3`.","_n":"2xb72","_k":"882bd593"},{"t":"`x = 3`","why":"`3^x = 27`.","_n":"2yb62","_k":"ff1b5d0c"},{"t":"`x = 9`","why":"`3^9` is far bigger than 27.","_n":"2zb52","_k":"2b7216cb"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Which function has the greatest rate of change at `x = 0`? (Use these values.)","use":"`ln 2 ≈ 0.693`, `ln 3 ≈ 1.099`, `ln 10 ≈ 2.303`","options":[{"t":"`y = 10^{x/3}`","why":"The biggest base, but the slope is `ln 10/3 ≈ 0.768`.","_n":"30b42","_k":"de808077"},{"t":"`y = 4^{x/2}`","why":"`4^{x/2} = 2^x`: slope `ln 2 ≈ 0.693`.","_n":"31b72","_k":"bfc28411"},{"t":"`y = 3^x`","why":"Slope at 0: `ln 3 ≈ 1.099`.","_n":"32b82","_k":"6832bec6"},{"t":"`y = e^x`","why":"Slope 1, and `ln 3 > ln e = 1`.","_n":"33b92","_k":"d9feff85"}]},"b":{"prompt":"Which function has the greatest rate of change at `x = 0`? (Use these values.)","use":"`ln 2 ≈ 0.693`, `ln 3 ≈ 1.099`, `ln 10 ≈ 2.303`","options":[{"t":"`y = 2^{2x}`","why":"Slope `2 ln 2 ≈ 1.386`.","_n":"34ba2","_k":"b7c8198d"},{"t":"`y = 10^{x/2}`","why":"Compare `b^{kx}` by `k ln b`: slope `ln 10/2 ≈ 1.151`.","_n":"35b32","_k":"35ba4a19"},{"t":"`y = e^x`","why":"Slope 1.","_n":"36b42","_k":"f92e94c1"},{"t":"`y = 8^{x/3}`","why":"`8^{x/3} = 2^x`: slope ≈ 0.693.","_n":"37b52","_k":"78de6565"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why \u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `2^x = 2^x ln 2`?","options":[{"t":"“`2^x = e^{x ln 2}`. By the chain rule its derivative is `e^{x ln 2} · ln 2`, which is `2^x ln 2`.”","why":"Rewrite with base `e`, then the chain rule brings out `ln 2`.","_n":"38b62","_k":"104e88aa"},{"t":"“Every exponential is its own derivative times its base, so the 2 becomes `ln 2`.”","why":"The base isn’t multiplied in.","_n":"39af2","_k":"637f00e1"},{"t":"“By the power rule, bring the exponent down and lower it by one.”","why":"The power rule is for `x^n`, where the exponent is fixed. In `2^x` the exponent is the variable.","_n":"3ab02","_k":"3f7d77ea"},{"t":"“The slope of `2^x` is `ln 2` at every point.”","why":"That’s only the slope at `x = 0`, where the height is 1.","_n":"3b293","_k":"18b8c9af"}]},"b":{"prompt":"Which is the best explanation of why the slope of `y = 5^x` is always proportional to its height?","options":[{"t":"“Because the slope at `x = 0` is 5.”","why":"It’s `ln 5 ≈ 1.61`.","_n":"3c283","_k":"af4143fb"},{"t":"“`5^x = e^{x ln 5}`, so its derivative is `5^x · ln 5`: the height times the fixed number `ln 5`.”","why":"The constant of proportionality is `ln 5`.","_n":"3d2b3","_k":"80aeb7e5"},{"t":"“Because `5^x` grows, and growing functions have slopes proportional to their heights.”","why":"`x^2` grows too, but its slope `2x` isn’t proportional to `x^2`.","_n":"3e2a3","_k":"6d08c5b0"},{"t":"“Because the power rule gives `x · 5^{x - 1}`, which is a multiple of `5^x`.”","why":"The power rule is for `x^n`, where the exponent is fixed. In `5^x` the exponent is the variable.","_n":"3f253","_k":"5510bc97"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"A model says `N(t) = 300(1/2)^{t/10}`. Which statement about `N′(t)` is co
