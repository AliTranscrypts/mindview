.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 19: hero equation and ladder, V10 shape stage in time mode (ladder and cone figures, y–t / h–t graph, Play and slider),
   Rates in motion controls, readout and algebra panel, the TC3 □√□ box, Part 3 setup builder (scene sketches, slots, algebra
   lines), practice boxes, task preview.
   Token added here (light and dark): --rr-wfo, the water fill opacity (--pen at 25% light, 30% dark, as the plan asks). */
:root{--rr-wfo:.25}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--rr-wfo:.3} }
:root[data-theme="dark"]{--rr-wfo:.3}

.rr-heq{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:.15em .3em;line-height:1.45}
.rr-nw{white-space:nowrap}
.rr-arr{color:var(--ink-2);white-space:nowrap}
.rr-hero{width:100%}
.rr-hsvg{border:0 !important;background:transparent !important;max-height:280px}
#hero-cap{min-height:1.4em}
.rr-capin{animation:rr-fade .9s ease both;font-weight:700}
@keyframes rr-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){ .rr-capin{animation:none} }

/* ---- SVG figures ---- */
.rr-svg{display:block;width:100%;height:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.rr-floor,.rr-wall{stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}
.rr-rail{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.rr-rung{stroke:var(--ink);stroke-width:1.6}
.rr-fp{fill:var(--pen);fill-opacity:.6}
.rr-tm{stroke:var(--f3);stroke-width:2.6;stroke-linecap:round}
.rr-ap{stroke:var(--pen);stroke-width:3.2;stroke-linecap:round}
.rr-aph{fill:var(--pen)}
.rr-af{stroke:var(--f3);stroke-width:3.2;stroke-linecap:round}
.rr-afh{fill:var(--f3)}
.rr-t{font:600 12.5px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.rr-tp{fill:var(--pen)}
.rr-tf{fill:var(--f3)}
.rr-tl{fill:var(--ink)}
.rr-ts{font-weight:400;font-size:11px;fill:var(--ink-2)}
.rr-tx{font-size:14px}
.rr-i{font-family:var(--font-math);font-style:italic}
.rr-water{fill:var(--pen);fill-opacity:var(--rr-wfo)}
.rr-surf{stroke:var(--pen);stroke-width:3;stroke-linecap:round}
.rr-cone{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.rr-rim{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:5 4}
.rr-pipe{fill:var(--ink-2)}
.rr-stream{stroke:var(--pen);stroke-width:3;stroke-dasharray:7 4}
.rr-rule{stroke:var(--ink-2);stroke-width:1.5}
.rr-lev{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3}

/* ---- Explore ---- */
.rr-lab{font-weight:700}
.rr-stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px 18px;align-items:start;margin-top:8px}
.rr-fig,.rr-gcol{min-width:0}
.rr-gbtn{display:none}
.rr-bot{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 28px;align-items:start;margin-top:14px}
.rr-ctl,.rr-rd{min-width:0}
.rr-play{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 14px}
.rr-pb{min-width:5.2rem}
.rr-sl{flex:1 1 220px;margin:0}
.rr-sl output{color:var(--ink)}
.rr-crow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}
.rr-chips{margin:0}
.rr-tog[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rr-how{margin:8px 0 10px}
.rr-exact{border-top:1.5px dashed var(--rule);padding-top:10px}
.rr-exact[hidden]{display:none}
.rr-exl{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
.rr-exrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.rr-exrow .m{font-size:1.15rem}
.rr-exa{width:3.4rem}
.rr-exb{width:3.8rem;border-top:2.5px solid var(--ink)}
.rr-rt{font:1.5rem var(--font-math);margin-right:-4px}
.rr-exn{margin:6px 0 0}
.rr-exmsg{min-height:1.1em;margin:4px 0 0;font-weight:600}
.rr-alg{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin-top:12px;background:var(--sheet);transition:background .4s}
.rr-alg[hidden]{display:none}
.rr-alg.rr-hi{border-color:var(--hi);background:var(--hi-soft)}
.rr-alg div{margin:5px 0;overflow-wrap:anywhere}
.rr-algh{font-weight:700;font-size:.9rem;margin:0 0 4px}

/* ---- Part 3 ---- */
.rr-tabs{margin-top:0}
.rr-scene{margin-top:12px}
.rr-scrow{display:flex;gap:14px;align-items:flex-start}
.rr-ic{width:160px;flex:none;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.rr-sct{margin:0;flex:1}
.rr-icp{fill:none;stroke:var(--pen);stroke-width:2}
.rr-icout{stroke-width:3}
.rr-ick{stroke:var(--ink);stroke-width:1.8}
.rr-icdot{fill:var(--ink)}
.rr-icg{stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round}
.rr-icpost{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.rr-iclamp{fill:var(--hi);stroke:var(--ink);stroke-width:1.2}
.rr-icray{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:4 3}
.rr-icper{stroke:var(--ink);stroke-width:3;fill:var(--ink);stroke-linecap:round}
.rr-icsh{stroke:var(--ink);stroke-width:5;stroke-opacity:.45}
.rr-icbal{fill:var(--pen);fill-opacity:var(--rr-wfo);stroke:var(--pen);stroke-width:2.4}
.rr-icstr{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.rr-icz{stroke:var(--ink);stroke-width:1.8;stroke-dasharray:5 4}
.rr-iccar{fill:var(--pen)}
.rr-slh{margin-top:12px}
.rr-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rr-slot{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px dashed var(--rule);border-radius:8px;background:var(--sheet);padding:8px 10px;min-height:68px;min-width:0}
.rr-slot.on{border-color:var(--ink);border-style:solid;background:var(--hi-soft)}
.rr-slot.full{border:2px solid var(--green);background:var(--good-bg);opacity:1}
.rr-sll2{font:700 .78rem var(--font-ui);color:var(--ink-2)}
.rr-slv{font:400 .98rem var(--font-math);overflow-wrap:anywhere}
.rr-slv .m{white-space:normal}
.rr-tray{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.rr-mchip{font-size:.95rem}
.rr-mchip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rr-mtip{margin:10px 0 0}
.rr-algd{margin-top:14px}
.rr-line{margin:6px 0;overflow-wrap:anywhere}
.rr-ln{font-weight:700;color:var(--ink-2)}
.rr-notep{margin:12px 0 0;padding:8px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}

/* ---- Practice ---- */
.rr-snote{margin:6px 0 0}
.rr-bxs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 4px}
.rr-bx{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.98rem}
.rr-bx .numin.short{width:7rem}
.rr-bx .numin.rr-exi{width:8.5rem}
.rr-bu{font-size:.95rem;color:var(--ink-2)}

/* ---- task ---- */
.rr-tstep{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.rr-tstep label{min-width:11rem;font-weight:600}
.rr-tstep .btn{min-width:40px;font-size:1.1rem}
.rr-tstep .numin.short{width:5.2rem}
.rr-all{font-weight:600}

@media (max-width:900px){ .rr-slots{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:820px){ .rr-bot{grid-template-columns:minmax(0,1fr)} }
@media (max-width:640px){
  .rr-stage{grid-template-columns:minmax(0,1fr)}
  .rr-scrow{flex-direction:column}
  .rr-ic{width:100%;max-width:240px}
  .rr-slots{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .rr-gbtn{display:inline-flex}
  .rr-gw:not(.open){display:none}
  .rr-gw{margin-top:8px}
}
@media (max-width:420px){ .rr-slots{grid-template-columns:minmax(0,1fr)} }

anging variable gets a chain-rule factor like `dx/dt`), then substitute the values at the \u003cstrong>moment\u003c/strong> you care about. These are \u003cstrong>related rates\u003c/strong>.","fig":{"html":"\u003cdiv class=\"rr-hero\" id=\"rr-hero\">\u003c/div>","caption":""}},"goals":["I can differentiate an equation with respect to time, writing `dx/dt`, `dy/dt` for every changing quantity.","I can find a related rate in a one-variable formula (area, volume) at a given moment.","I can identify the given rate, the wanted rate and their signs and units from a description.","I can solve related-rates problems that use the Pythagorean theorem, differentiating before substituting.","I can use similar triangles to remove a variable (cones, shadows) before differentiating.","I can solve and interpret a related-rates problem in context and explain each step."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Implicit differentiation","goal":1,"prompt":"Differentiate `x^2 + y^2 = 25` with respect to `x`.","options":[{"t":"`2x + 2y = 0`","why":"That treats `y` as independent of `x`. `y` depends on `x`, so `y^2` needs the chain-rule factor `dy/dx`.","_n":"0761","_k":"6684d006"},{"t":"`2x + 2y dy/dx = 25`","why":"The derivative of 25 is 0.","_n":"1731","_k":"730bd5c2"},{"t":"`2x + 2y dy/dx = 0`","why":"`y` depends on `x`, so `y^2` differentiates to `2y dy/dx`.","_n":"2741","_k":"609ca66d"},{"t":"`2x dy/dx + 2y = 0`","why":"The chain-rule factor goes with `y`.","_n":"3791","_k":"515823e6"}],"hints":["Which variable depends on `x`?","`d/dx (y^2) = 2y dy/dx`.","`2x + 2y dy/dx = 0`."]},{"id":"w2","skill":"Implicit differentiation","goal":1,"prompt":"If `r` depends on `t`, what is `d/dt (πr^2)`?","options":[{"t":"`2π dr/dt`","why":"The `r` stays: `2πr`.","_n":"47a1","_k":"000a1fa5"},{"t":"`πr^2 dr/dt`","why":"Differentiate `r^2` first.","_n":"5771","_k":"c405527a"},{"t":"`2πr dr/dt`","why":"Chain rule: outside `2πr`, times inside `dr/dt`.","_n":"6781","_k":"55df5275"},{"t":"`2πr`","why":"`r` depends on `t`, so you multiply by `dr/dt`.","_n":"76d1","_k":"32555d08"}],"hints":["Treat `r` as a function of `t`.","`d/dt (r^2) = 2r dr/dt`.","`2πr dr/dt`."]},{"id":"w3","skill":"Geometry formulas","goal":2,"prompt":"Which is the volume of a cone with radius `r` and height `h`?","options":[{"t":"`(1/3)πr^2h`","why":"A cone holds a third of the cylinder with the same base and height.","_n":"86e1","_k":"b7807b11"},{"t":"`(1/3)πrh`","why":"The base area is `πr^2`.","_n":"9e38","_k":"d51c83eb"},{"t":"`(4/3)πr^3`","why":"That’s the sphere.","_n":"ae28","_k":"4279eaf2"},{"t":"`πr^2h`","why":"That’s the cylinder.","_n":"be58","_k":"b39f3ffe"}],"hints":["A cone is a third of a cylinder.","Cylinder: `πr^2h`.","`(1/3)πr^2h`."]},{"id":"w4","skill":"Geometry formulas","goal":4,"prompt":"A 13 m ladder’s foot is 5 m from a wall. How high up the wall does it reach?","options":[{"t":"12 m","why":"`13^2 - 5^2 = 144`.","_n":"ce48","_k":"26e54575"},{"t":"`√194` m","why":"That adds the squares. The ladder is the hypotenuse.","_n":"de78","_k":"c7d88356"},{"t":"8 m","why":"That subtracts the lengths. Use the squares.","_n":"ee68","_k":"a8f7a602"},{"t":"18 m","why":"That adds the lengths. Use the squares: the height is `√{13^2 - 5^2}`.","_n":"fe98","_k":"49def166"}],"hints":["Which side is the hypotenuse?","`y^2 = 169 - 25`.","12 m."]},{"id":"w5","skill":"Similar triangles","goal":5,"prompt":"A cone-shaped tank (point down) is 6 m tall with a top radius of 3 m. When the water is `h` m deep, what is the water’s surface radius `r`?","options":[{"t":"`r = h/2`","why":"`r/h = 3/6`.","_n":"ge88","_k":"7493d3f5"},{"t":"`r = 3`","why":"That uses the top radius at every depth.","_n":"heb8","_k":"716563e7"},{"t":"`r = h - 3`","why":"That subtracts instead of scaling.","_n":"iea8","_k":"55b36219"},{"t":"`r = 2h`","why":"That’s the ratio upside down. In this cone the radius is half the height: `r/h = 3/6`.","_n":"j717","_k":"d397863d"}],"hints":["The water forms a smaller, similar cone.","`r/h = 3/6`.","`r = h/2`."]},{"id":"w6","skill":"Similar triangles","goal":5,"prompt":"A 2 m person stands `x` m from a 6 m lamp post. Their shadow has length `s`. Which equation is right?","options":[{"t":"`6/(x + s) = 2/s`","why":"Big triangle (post) and small triangle (person) share the shadow’s tip.","_n":"k727","_k":"42168028"},{"t":"`6/s = 2/(x + s)`","why":"That pairs the wrong sides: the post goes with the long base `x + s`.","_n":"l737","_k":"71302d55"},{"t":"`6/x = 2/s`","why":"The big triangle’s base runs from the post to the shadow’s tip: `x + s`.","_n":"m747","_k":"3eeb378f"},{"t":"`6 - 2 = x - s`","why":"That subtracts. Similar triangles use ratios.","_n":"n757","_k":"a948a2ed"}],"hints":["Draw both triangles from the shadow’s tip.","Post: height 6, base `x + s`. Person: height 2, base `s`.","`6/(x + s) = 2/s`."]}],"refreshers":{"Implicit differentiation":"Every variable that changes with `t` gets a chain-rule factor: `d/dt (y^2) = 2y dy/dt`. Constants differentiate to 0.","Geometry formulas":"Circle `A = πr^2`; sphere `V = (4/3)πr^3`; cone `V = (1/3)πr^2h`; Pythagoras `x^2 + y^2 = L^2`.","Similar triangles":"Matching sides are in the same ratio. Draw both triangles and label every side before writing the ratio."}}},"explore":{"heading":"Rates in motion","intro":"Two scenes, one idea. Press Play or drag the slider, and watch how a steady rate in one quantity makes a changing rate in another.","ui":{"scenes":[{"id":"ladder","t":"Sliding ladder"},{"id":"cone","t":"Filling cone"}],"rates":[{"id":"1","t":"π"},{"id":"2","t":"2π"},{"id":"4","t":"4π"},{"id":"8","t":"8π"}],"sceneLab":"Scene","rateLab":"Inflow rate (m³/min)","xLab":"Foot distance `x`","hLab":"Depth `h`","both":"Show both speed arrows","alg":"Show the algebra","showGraph":"Show graph","hideGraph":"Hide graph","how":{"ladder":"Drag the slider (arrow keys move the foot by 0.5 m; Shift + arrows by 2 m). Play slides the foot out at a steady 0.6 m/s from where it is; Space on the slider plays or pauses.","cone":"Choose an inflow rate, then drag the slider (arrow keys change the depth by 0.5 m; Shift + arrows by 2 m). Play fills the tank at the chosen rate; Space on the slider plays or pauses."},"rows":{"rel":"Relation","pos":"Position","given":"Given rate","related":"Related rate","words":"In words"},"algHead":"The related-rates equation at this moment","exact":{"label":"Exact answer for challenge 3:","place":"Place the foot there","note":"Leave the root box empty for a whole number, and the first box empty for a coefficient of 1."}},"predIntro":"Make a prediction first. Then the scene, its readout and its graph show you what really happens.","predictions":[{"id":"p1","prompt":"Ladder, starting at `x = 1` m. The foot moves out at a steady 0.6 m/s. How does the top move?","options":[{"t":"it doesn’t move until the end","_n":"o767","_k":"000fd5eb"},{"t":"at a steady 0.6 m/s","_n":"p777","_k":"f43dc525"},{"t":"slowly at first, then faster and faster","_n":"q787","_k":"4a55f904"},{"t":"fast at first, then slower","_n":"r697","_k":"adc9e3de"}],"explain":"`dy/dt = -(x/y)(0.6)`. As `x` grows and `y` shrinks, `x/y` grows. The rates are linked by `x dx/dt + y dy/dt = 0`, so they’re equal only when `x = y`."},{"id":"p2","prompt":"Ladder, paused at `x = 6` m. How fast is the top sliding down right now?","options":[{"t":"4.8 m/s","_n":"s6a7","_k":"09d6d313"},{"t":"0.45 m/s","_n":"tf77","_k":"927f4161"},{"t":"0.6 m/s","_n":"uf67","_k":"a2667602"},{"t":"0.8 m/s","_n":"vf57","_k":"d0e058ee"}],"explain":"`dy/dt = -7.2/16 = -0.45`. 0.8 m/s is what you get with the ratio upside down (`y/x`). The rates are linked by `x dx/dt + y dy/dt = 0`, so they’re equal only when `x = y`."},{"id":"p3","prompt":"Cone, inflow 4π m³/min, starting at `h = 0.5` m. Water pours in at a steady rate. How does the depth rise?","options":[{"t":"it stops halfway","_n":"wf47","_k":"2d222e62"},{"t":"steadily","_n":"xfb7","_k":"7865bcdf"},{"t":"fast at first, then slower","_n":"yfa7","_k":"854e8812"},{"t":"slowly at first, then faster","_n":"zf97","_k":"efa36036"}],"explain":"Higher up the cone is wider, so the same volume makes a thinner layer."},{"id":"p4","prompt":"Cone, inflow 4π m³/min. When the depth doubles from 2 m to 4 m, the rate `dh/dt` …","options":[{"t":"becomes a quarter as big","_n":"10f87","_k":"a8bf6eb5"},{"t":"stays the same","_n":"11ef7","_k":"77d8b300"},{"t":"halves","_n":"12ee7","_k":"247b1d48"},{"t":"doubles","_n":"13758","_k":"7765221a"}],"explain":"`dh/dt = 16/h^2` here, so doubling `h` divides the rate by 4."}],"chalIntro":"Use the scenes to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. For challenge 3, type `x` in the exact-answer box under the ladder’s controls. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"Ladder: set `x` so that the top is sliding down at exactly 0.8 m/s.","why":"At `x = 8`, `y = 6`, so `dy/dt = -(8/6)(0.6) = -0.8`: the top slides down at 0.8 m/s.","hints":["You need `(x/y)(0.6) = 0.8`.","`x/y = 4/3`.","`x = 8`, `y = 6`."],"msgs":{"scen":"Switch to the \u003cstrong>Sliding ladder\u003c/strong> first.","x6":"At `x = 6` the top moves at 0.45 m/s. `(y/x) × 0.6 = 0.8` there, which is the ratio upside down; the top’s speed uses `x/y`.","x5":"`(5/√75)(0.6) ≈ 0.35` m/s: move the foot farther out.","other":"With the foot {x} m out, the top slides down at {v} m/s. You need `(x/y)(0.6) = 0.8`: {dir}.","out":"move the foot farther out","back":"move the foot closer to the wall"}},{"id":"tc2","goal":5,"prompt":"Cone: choose the inflow rate so that the depth rises at 2 m/min when `h = 4` m.","why":"`dV/dt = (π/4)h^2 dh/dt = (π/4)(16)(2) = 8π` m³/min.","hints":["`dV/dt = (π/4)h^2 dh/dt`.","Substitute `h = 4` and `dh/dt = 2`.","`dV/dt = (π/4)(16)(2) = 8π`."],"msgs":{"scen":"Switch to the \u003cstrong>Filling cone\u003c/strong> first.","h":"Set the depth to `h = 4` m first.","r4":"At `h = 4` that gives 1 m/min.","r2":"That gives 1/2 m/min.","other":"At a depth of 4 m, an inflow of {q} m³/min makes the level rise at {v} m/min. Use `dV/dt = (π/4)h^2 dh/dt`."}},{"id":"tc3","goal":4,"stretch":true,"prompt":"Ladder: where is the top sliding down at \u003cstrong>exactly the same speed\u003c/strong> as the foot moves out? Enter `x` exactly.","why":"Equal speeds mean `x/y = 1`, so `x = y` and `2x^2 = 100`: `x = √50 = 5√2` m (about 7.07 m).","hints":["Equal speeds means `x/y = 1`.","`x = y`, so `2x^2 = 100`.","`x = √50 = 5√2`."],"msgs":{"empty":"Type `x` in the exact-answer box (□√□) under the ladder’s controls first.","whole":"Use whole numbers in the boxes, such as 3 and 7 for `3√7`.","five":"`y = √75` there, not 5.","seven":"Close, but `y = √51 ≠ 7`.","long":"The ladder is 10 m long, so the foot must be less than 10 m from the wall.","other":"With the foot {x} m out, the top is {y} m high. The speeds are equal only when `x = y`."}}]},"part3":{"slug":"setup","name":"Set up","heading":"Set up the relation","intro":"Most people can differentiate; the hard part is the start. For each scene, fill the five slots from the chips: the \u003cstrong>given rate\u003c/strong> (with its sign and units), the \u003cstrong>wanted rate\u003c/strong>, the \u003cstrong>relation\u003c/strong> that links the quantities, the fact you need \u003cstrong>at the moment\u003c/strong>, and the \u003cstrong>answer\u003c/strong>. Then open \u003cstrong>Check it with algebra\u003c/strong> to follow the differentiation line by line.","how":"Tap a chip, then tap its slot (or tap a slot first, then a chip). A chip in the right slot locks in; a wrong one stays in the tray with feedback. Two or three chips in each tray are traps.","sceneLab":"Scene","slots":[{"id":"given","label":"Given rate"},{"id":"want","label":"Wanted rate"},{"id":"rel","label":"Relation"},{"id":"moment","label":"At the moment"},{"id":"ans","label":"Answer"}],"roles":{"given":"the given rate","want":"the wanted rate","rel":"the relation","moment":"the fact you need at the moment","ans":"the answer"},"nextLine":"Show the next line","allLines":"Show every line","scenes":[{"id":"s1","tab":"Ripple","t":"\u003cstrong>Ripple.\u003c/strong> A pebble drops into a still pond. The circular ripple’s radius grows at 0.5 m/s. How fast is the area inside the ripple growing when the radius is 4 m?","aria":"A circular ripple of radius r spreading on a pond.","chips":[{"t":"`dr/dt = 0.5` m/s","_a":"EwIKRVZaFw=="},{"t":"`dA/dt` when `r = 4` m","_a":"ExICXUcW"},{"t":"`A = πr^2`","_a":"ExcGXxE="},{"t":"`r = 4` m","_a":"EwgMXlZaQRU="},{"t":"4π m²/s","_a":"EwQNQBE="},{"t":"`dr/dt = -0.5` m/s","_a":"EwsMEQ==","fb":"The ripple is spreading, so its radius is increasing: the rate is positive."},{"t":"`A = 2πr`","_a":"EwsMEQ==","fb":"That’s the circumference. The area inside the ripple is `A = πr^2`."},{"t":"16π m²","_a":"EwsMEQ==","fb":"That’s the area at the moment, not its rate. A rate of area has units m²/s."}],"done":"Setup complete: `A = πr^2`, so `dA/dt = 2πr dr/dt = 4π` m²/s.","alg":["Relation: `A = πr^2`.","Differentiate with respect to `t`: `dA/dt = 2πr dr/dt`.","Substitute the moment, `r = 4` and `dr/dt = 0.5`: `dA/dt = 2π(4)(0.5)`.","`dA/dt = 4π` m²/s (about 12.6 m²/s): the area grows at 4π m²/s."]},{"id":"s2","tab":"Shadow","t":"\u003cstrong>Shadow.\u003c/strong> A 2 m person walks away from a 6 m lamp post at 1.5 m/s. How fast does their shadow lengthen, and how fast does the tip of the shadow move? (Let `x` be the person’s distance from the post and `s` the shadow’s length.)","aria":"A 6 m lamp post and a 2 m person at distance x from it; light from the lamp passes over the person’s head to the shadow’s tip, so the shadow has length s.","chips":[{"t":"`dx/dt = 1.5` m/s","_a":"EwIKRVZaFw=="},{"t":"`ds/dt` and the tip’s speed","_a":"ExICXUcW"},{"t":"`6/(x + s) = 2/s`, so `s = x/2`","_a":"ExcGXxE="},{"t":"Any moment: no value of `x` is needed","_a":"EwgMXlZaQRU="},{"t":"0.75 m/s; tip 2.25 m/s","_a":"EwQNQBE="},{"t":"`6/x = 2/s`","_a":"EwsMEQ==","fb":"The big triangle’s base runs from the post to the shadow’s tip: `x + s`."},{"t":"`x = 4` m","_a":"EwsMEQ==","fb":"Nothing in the question fixes `x`. With `s = x/2`, `ds/dt` is the same at every moment."},{"t":"0.75 m/s; tip 0.75 m/s","_a":"EwsMEQ==","fb":"The tip is at `x + s` from the post; its speed is `dx/dt + ds/dt`."}],"done":"Setup complete: `s = x/2`, so the shadow lengthens at 0.75 m/s and its tip moves at 2.25 m/s.","alg":["`6/(x + s) = 2/s` gives `6s = 2x + 2s`, so `4s = 2x` and `s = x/2`.","Differentiate: `ds/dt = (1/2) dx/dt = (1/2)(1.5) = 0.75` m/s.","The tip is at `x + s` from the post: its speed is `dx/dt + ds/dt = 1.5 + 0.75 = 2.25` m/s."],"note":"The shadow’s length grows at 0.75 m/s at \u003cstrong>every\u003c/strong> moment (the rate doesn’t depend on `x`), and the tip moves at 1.5 + 0.75 = 2.25 m/s."},{"id":"s3","tab":"Balloon","t":"\u003cstrong>Balloon.\u003c/strong> Air is pumped into a spherical balloon at 100π cm³/s. How fast is the radius growing when the radius is 5 cm?","aria":"A spherical balloon of radius r.","chips":[{"t":"`dV/dt = 100π` cm³/s","_a":"EwIKRVZaFw=="},{"t":"`dr/dt` when `r = 5` cm","_a":"ExICXUcW"},{"t":"`V = (4/3)πr^3`","_a":"ExcGXxE="},{"t":"`r = 5` cm","_a":"EwgMXlZaQRU="},{"t":"1 cm/s","_a":"EwQNQBE="},{"t":"`dr/dt = 100π` cm/s","_a":"EwsMEQ==","fb":"100π cm³/s is a volume per second, so it’s `dV/dt`, not `dr/dt`."},{"t":"`V = 4πr^2`","_a":"EwsMEQ==","fb":"That’s the surface area. A sphere’s volume is `V = (4/3)πr^3`."},{"t":"3 cm/s","_a":"EwsMEQ==","fb":"That uses `(4/3)πr^2` as the derivative. Bring down the 3: `dV/dt = 4πr^2 dr/dt`."}],"done":"Setup complete: `dV/dt = 4πr^2 dr/dt`, so `dr/dt = 1` cm/s.","alg":["`V = (4/3)πr^3`, so `dV/dt = 4πr^2 dr/dt`.","`100π = 4π(25) dr/dt`.","`dr/dt = 1`: the radius grows at 1 cm/s."]},{"id":"s4","tab":"Two cars","t":"\u003cstrong>Two cars.\u003c/strong> From one corner, car A drives north at 60 km/h and car B drives east at 80 km/h; they leave at the same time. How fast is the distance between them changing after 1 h? (Let `x` be B’s distance east, `y` be A’s distance north and `z` the distance between them.)","aria":"Two roads at right angles from a corner: car B at distance x east, car A at distance y north, and the distance z between them across the right triangle.","chips":[{"t":"`dx/dt = 80` km/h and `dy/dt = 60` km/h","_a":"EwIKRVZaFw=="},{"t":"`dz/dt` after 1 h","_a":"ExICXUcW"},{"t":"`z^2 = x^2 + y^2`","_a":"ExcGXxE="},{"t":"`x = 80`, `y = 60`, `z = 100`","_a":"EwgMXlZaQRU="},{"t":"100 km/h","_a":"EwQNQBE="},{"t":"`z = x + y`","_a":"EwsMEQ==","fb":"The roads meet at a right angle, so use the Pythagorean theorem: `z^2 = x^2 + y^2`."},{"t":"`x = 80`, `y = 60`, `z = 140`","_a":"EwsMEQ==","fb":"`z` is the hypotenuse: `√{80^2 + 60^2} = 100`."},{"t":"140 km/h","_a":"EwsMEQ==","fb":"Adding the speeds would be right only if the cars drove in opposite directions."}],"done":"Setup complete: `z dz/dt = x dx/dt + y dy/dt`, so `dz/dt = 100` km/h.","alg":["`z^2 = x^2 + y^2`, so `2z dz/dt = 2x dx/dt + 2y dy/dt`.","After 1 h: `x = 80`, `y = 60`, `z = 100`.","`100 dz/dt = 80(80) + 60(60) = 10 000`, so `dz/dt = 100` km/h."],"note":"The distance grows at 100 km/h at every moment, because both cars started together and the triangle keeps its shape."}],"quickCheck":{"title":"Quick check","summary":"Set up the relation quick check","items":[{"id":"q1","goal":4,"prompt":"When do you substitute the moment’s values?","choices":[{"t":"After differentiating","fb":"Right. Differentiate while every changing quantity is still a variable, then substitute.","_n":"14768","_k":"d51e98a5"},{"t":"Either","fb":"Substituting first freezes a changing quantity.","_n":"15738","_k":"aaeb811e"},{"t":"Never","fb":"You do need the moment’s values, but only after differentiating. Substituting first freezes a changing quantity.","_n":"16748","_k":"3c3b520e"},{"t":"Before differentiating","fb":"Substituting first freezes a changing quantity.","_n":"17798","_k":"8326797a"}]},{"id":"q2","goal":3,"prompt":"A tank drains at 3 L/s. Write the given rate.","choices":[{"t":"`dV/dt = 3` L/s","fb":"Draining means `V` is decreasing.","_n":"187a8","_k":"2a84bd19"},{"t":"`V = -3` L","fb":"Draining means `V` is decreasing, and a rate is a change per second, not a volume.","_n":"19778","_k":"64abfb66"},{"t":"`dt/dV = -3`","fb":"Draining means `V` is decreasing: the rate of volume with respect to time is `dV/dt`.","_n":"1a788","_k":"039c7501"},{"t":"`dV/dt = -3` L/s","fb":"Right. Draining means `V` is decreasing, so its rate is negative.","_n":"1b6d8","_k":"875f46a2"}]},{"id":"q3","goal":5,"prompt":"Shadow scene: how fast does the shadow’s tip move?","choices":[{"t":"2.25 m/s","fb":"Right. The tip is at `x + s`: 1.5 + 0.75.","_n":"1c6e8","_k":"315fb326"},{"t":"3 m/s","fb":"The tip is at `x + s`: 1.5 + 0.75.","_n":"1d7b8","_k":"35898af6"},{"t":"1.5 m/s","fb":"The tip is at `x + s`: 1.5 + 0.75.","_n":"1e7a8","_k":"c4dfc05c"},{"t":"0.75 m/s","fb":"The tip is at `x + s`: 1.5 + 0.75.","_n":"1f7d8","_k":"f9d57d8e"}]},{"id":"q4","goal":1,"prompt":"Balloon: `d/dt [(4/3)πr^3] =` …","choices":[{"t":"`(4/3)πr^2 dr/dt`","fb":"Chain rule: 3 × (4/3) = 4, times `dr/dt`.","_n":"1g7c8","_k":"5f503ec0"},{"t":"`4πr dr/dt`","fb":"Chain rule: 3 × (4/3) = 4, times `dr/dt`.","_n":"1h778","_k":"9210f63f"},{"t":"`4πr^2`","fb":"Chain rule: 3 × (4/3) = 4, times `dr/dt`.","_n":"1i768","_k":"3e0e52e7"},{"t":"`4πr^2 dr/dt`","fb":"Right. Chain rule: 3 × (4/3) = 4, times `dr/dt`.","_n":"1j798","_k":"a900c8c4"}]}]}},"practice":{"activities":[{"id":"steps","type":"custom","title":"Put the steps in order","summary":"Steps in order","goal":[4,6],"instruction":"Put each solution’s steps in a working order.","how":"Tap a step, then use Move up and Move down to put it in place. Press Check when the order is right.","general":"Ask what has to happen before it can be done.","sequences":[{"id":"o1","goal":[4,6],"prompt":"A 13 m ladder’s foot slides out at 1 m/s. How fast is the top moving when the foot is 5 m out?","steps":["Draw and label: foot `x`, top `y`, ladder 13.","Relation: `x^2 + y^2 = 169`.","Differentiate with respect to `t`: `2x dx/dt + 2y dy/dt = 0`.","Find the missing value at the moment: `x = 5`, so `y = 12`.","Substitute: `2(5)(1) + 2(12) dy/dt = 0`.","Solve and interpret: `dy/dt = -5/12`; the top slides down at 5/12 m/s."],"start":[1,4,0,2,5,3],"accept":[[0,1,3,2,4,5]],"rules":[{"a":4,"b":2,"fb":"`x` is changing. If you replace it by 5 first, its derivative becomes 0. Differentiate, then substitute."}],"hints":["What must you have before you can differentiate?","Relation first, then differentiate, then put in the moment’s values.","Draw → relation → differentiate → find `y` → substitute → solve and interpret."],"why":"Draw → relation → differentiate → find the missing value → substitute → solve. (Finding `y = 12` before differentiating also works; substituting must wait.)"},{"id":"o2","goal":[5,6],"prompt":"A cone (point down) has top radius 4 cm and height 12 cm and drains at 2π cm³/s. How fast is the level changing when `h = 6` cm?","steps":["Similar triangles: `r = h/3`.","Volume in one variable: `V = πh^3/27`.","Differentiate: `dV/dt = (πh^2/9) dh/dt`.","Substitute `h = 6` and `dV/dt = -2π`.","Solve: `dh/dt = -1/2` cm/s; the level falls at 0.5 cm/s."],"start":[3,1,2,0,4],"rules":[{"a":3,"b":2,"fb":"`h` is changing. If you replace it by 6 first, its derivative becomes 0. Differentiate, then substitute."},{"a":1,"b":0,"fb":"You need `r` in terms of `h` first."}],"hints":["Which variable has to go before you can write `V` with one variable?","Similar triangles give `r = h/3`; then `V` uses `h` only.","Similar triangles → one-variable volume → differentiate → substitute → solve."],"why":"Similar triangles → volume in one variable → differentiate → substitute → solve."}]},{"id":"solve","type":"custom","title":"Solve it","summary":"Solve it","star":true,"goal":[2,3,4,5,6],"instruction":"Set up, differentiate, then substitute the moment. Items 4 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type numbers, fractions, π or exact roots (such as 60π, 5/12 or 3√2/2), then press Check.","items":[{"id":"s1","goal":[2,3],"prompt":"A circle’s radius grows at 3 cm/s. How fast is its area growing when `r = 10` cm?","boxes":[{"k":"v","label":"`dA/dt =`","unit":"cm²/s"}],"_a":"SkcVEQkWAwf+5UFO","display":"60π cm²/s","wrong":[{"v":"20π","fb":"`r` depends on `t`, so `dA/dt = 2πr dr/dt`. Multiply by `dr/dt = 3`."}],"hints":["Relation: `A = πr^2`.","Differentiate with respect to `t`: `dA/dt = 2πr dr/dt`.","`dA/dt = 2π(10)(3) = 60π` cm²/s."],"why":"`dA/dt = 2πr dr/dt = 2π(10)(3) = 60π` cm²/s."},{"id":"s2","goal":2,"prompt":"A cube’s edge grows at 2 cm/s. How fast is its volume growing when the edge is 5 cm?","boxes":[{"k":"v","label":"`dV/dt =`","unit":"cm³/s"}],"_a":"SkcVEQkWBAIBRx4=","display":"150 cm³/s","wrong":[{"v":"75","fb":"The edge `x` depends on `t`, so `d/dt (x^3) = 3x^2 dx/dt`. Multiply by `dx/dt = 2`."}],"hints":["Relation: `V = x^3` for an edge `x`.","`dV/dt = 3x^2 dx/dt`.","`dV/dt = 3(25)(2) = 150` cm³/s."],"why":"`dV/dt = 3x^2 dx/dt = 3(25)(2) = 150` cm³/s."},{"id":"s3","goal":[2,3],"prompt":"Air is pumped into a spherical balloon at 36π cm³/s. How fast is the radius growing when `r = 3` cm?","boxes":[{"k":"v","label":"`dr/dt =`","unit":"cm/s"}],"_a":"SkcVEQkWBBVM","display":"1 cm/s","wrong":[{"v":"1/3","fb":"`4πr^2` at `r = 3` is 36π."}],"hints":["`V = (4/3)πr^3`, so `dV/dt = 4πr^2 dr/dt`.","At `r = 3`: `4πr^2 = 36π`.","`36π = 36π dr/dt`, so `dr/dt = 1` cm/s."],"why":"`36π = 4π(9) dr/dt = 36π dr/dt`, so `dr/dt = 1` cm/s."},{"id":"s4","goal":4,"star":true,"prompt":"A 13 m ladder’s foot slides away at 1 m/s. How fast does the top slide down when the foot is 5 m from the wall?","boxes":[{"k":"v","label":"The top slides down at","unit":"m/s"}],"_a":"SkcVEQkWABgAV0FO","display":"5/12 m/s","wrong":[{"v":"12/5","fb":"The ratio is `x/y = 5/12`."}],"hints":["`x^2 + y^2 = 169`; at `x = 5`, `y = 12`.","Differentiate: `2x dx/dt + 2y dy/dt = 0`.","`2(5)(1) + 2(12) dy/dt = 0`, so `dy/dt = -5/12`: the top slides down at 5/12 m/s."],"why":"`2(5)(1) + 2(12) dy/dt = 0` gives `dy/dt = -5/12`: the top slides down at 5/12 m/s (about 0.42 m/s)."},{"id":"s5","goal":[3,5],"star":true,"prompt":"A cone-shaped cup (point down) has top radius 4 cm and height 12 cm. Water drains at 2π cm³/s. How fast is the level falling when it’s 6 cm deep?","note":"Give the speed (0.5) or the signed rate `dh/dt` (−0.5): both are accepted.","boxes":[{"k":"v","label":"The level falls at","unit":"cm/s"}],"_a":"SkcVEQkWBBgDRx4=","anySign":true,"display":"0.5 cm/s (`dh/dt = -1/2`)","wrong":[{"v":"1/18","fb":"`r = h/3`, not `3h`: with `r/h = 4/12` the radius is a third of the height. (1/18 comes from dividing by `πh^2 = 36π`, as if `r = h`.)"},{"v":"1/162","fb":"`r = h/3`, not `3h`."}],"hints":["`r = h/3`.","`V = πh^3/27`, `dV/dt = (πh^2/9) dh/dt`.","`-2π = 4π dh/dt`: `dh/dt = -1/2`."],"why":"`r = h/3`, `V = πh^3/27`, `dV/dt = (πh^2/9) dh/dt`; at `h = 6`: `-2π = 4π dh/dt`, so `dh/dt = -1/2`. The level falls at 0.5 cm/s."},{"id":"s6","goal":[4,6],"star":true,"prompt":"Ship A is 30 km east of a port, sailing west at 20 km/h. At the same moment ship B leaves the port sailing north at 15 km/h. How fast is the distance between them changing after 1 hour? Is it growing or shrinking?","boxes":[{"k":"v","label":"`dz/dt =`","unit":"km/h","exact":true}],"choose":{"k":"dir","label":"The distance is","options":[{"id":"grow","t":"growing"},{"id":"shrink","t":"shrinking"}]},"_a":"SkcVEQkWANW5/1IAHAUGFR1HB1pBFg8VVhcMRBFJ","display":"growing at `{5√13}/{13}` km/h (about 1.39 km/h)","wrong":[{"v":"−5√13/13","fb":"`x dx/dt + y dy/dt = 10(-20) + 15(15) = +25 > 0`, so the distance is growing."},{"dir":"shrink","fb":"`x dx/dt + y dy/dt = 10(-20) + 15(15) = +25 > 0`, so the distance is growing."}],"hints":["After 1 h: A is 10 km east (`x = 10`, `dx/dt = -20`); B is 15 km north (`y = 15`, `dy/dt = 15`).","`z^2 = x^2 + y^2`, so `z dz/dt = x dx/dt + y dy/dt`, with `z = √325 = 5√13`.","`dz/dt = 25/(5√13) = {5√13}/{13} > 0`: growing."],"why":"`z dz/dt = 10(-20) + 15(15) = 25` with `z = 5√13`, so `dz/dt = 25/(5√13) = {5√13}/{13}` km/h. It’s positive, so the distance is growing."}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Sanjay","how":"","goal":[2,4,5],"instruction":"Sanjay made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"A 10 m ladder’s foot slides out at 0.6 m/s. How fast is the top sliding down when the foot is 6 m from the wall?","steps":["`x^2 + y^2 = 100`.","At this moment `x = 6`, so `y = 8`.","Since `x = 6`, the relation becomes `36 + y^2 = 100`.","Differentiate: `2y dy/dt = 0`, so `dy/dt = 0`. The top isn’t moving."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking.","Finding `y` at the moment is fine.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"`x` is changing; fixing it at 6 makes its rate 0.","_n":"1k788","_k":"73e4715f"},{"t":"Differentiate `x^2 + y^2 = 100` first: `2x dx/dt + 2y dy/dt = 0`. Then `2(6)(0.6) + 2(8) dy/dt = 0`, so `dy/dt = -0.45` m/s.","why":"Differentiating while `x` is still a variable keeps `dx/dt` in the equation; the top slides down at 0.45 m/s.","_n":"1l738","_k":"e151503c"},{"t":"The top moves at 0.6 m/s too.","why":"The rates are linked by `x dx/dt + y dy/dt = 0`, so they’re equal only when `x = y`.","_n":"1m728","_k":"782f25f7"},{"t":"Use `x = 6` and differentiate 36 as 12.","why":"36 is a constant once you substitute; that’s the problem.","_n":"1n698","_k":"29df4984"}],"hints":["Is `x` constant?","No: it grows at 0.6 m/s.","Differentiate before substituting."]},{"id":"e2","goal":2,"task":"Air enters a spherical balloon at 72π cm³/s. How fast is the radius growing when `r = 3` cm?","steps":["`V = (4/3)πr^3`.","Differentiate: `dV/dt = 4πr^2`.","At `r = 3`: `dV/dt = 36π`.","So the radius grows at 36π cm/s."],"_a":"AA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier.","Step 4 follows step 2’s derivative. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"`r` depends on `t`, so a `dr/dt` is missing.","_n":"1o6a8","_k":"75982c89"},{"t":"`dV/dt = 4πr^2 dt/dr`.","why":"The factor is `dr/dt`.","_n":"1p6b8","_k":"9baabc91"},{"t":"`dV/dt = 4πr^2 dr/dt`, so `72π = 36π dr/dt` and `dr/dt = 2` cm/s.","why":"The chain rule puts `dr/dt` in the derivative, so the radius grows at 2 cm/s.","_n":"1q6c8","_k":"26f25bba"},{"t":"`dV/dt = (4/3)πr^2`.","why":"Bring down the 3.","_n":"1r658","_k":"e49ebe74"}],"hints":["Is `r` changing with time?","Yes, so use the chain rule.","`dr/dt = 2` cm/s."]},{"id":"e3","goal":5,"task":"A cone tank (point down) is 6 m deep with top radius 3 m. Water flows in at 4π m³/min. How fast is the level rising when `h = 4` m?","steps":["`V = (1/3)πr^2h`.","Similar triangles: `r = 2h`.","`V = (4/3)πh^3`, so `dV/dt = 4πh^2 dh/dt`.","`4π = 64π dh/dt`, so `dh/dt = 1/16` m/min."],"_a":"AA==","stepFb":["Step 1 is correct.","","Step 3 is right for step 2’s `r`. The mistake is earlier.","Step 4 follows step 2’s `r`. The mistake is earlier."],"fixes":[{"t":"`r = 3` at every depth.","why":"The water’s radius shrinks with depth.","_n":"1s668","_k":"6210da4a"},{"t":"Step 2 is correct.","why":"At the top, `h = 6` would give `r = 12`, but the radius there is 3.","_n":"1t678","_k":"056f7870"},{"t":"`r = h - 3`.","why":"Similar triangles scale; they don’t subtract.","_n":"1u688","_k":"ea9b5fca"},{"t":"`r/h = 3/6`, so `r = h/2` and `V = πh^3/12`. Then `4π = (π/4)(16) dh/dt`, so `dh/dt = 1` m/min.","why":"With the right ratio the level rises at 1 m/min.","_n":"1v718","_k":"ab074bd8"}],"hints":["Check `r = 2h` at the top of the tank.","`h = 6` should give `r = 3`.","`r = h/2`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: the ladder’s top speeding up, or the cone filling more and more slowly?"},{"id":"j2","q":"In your own words, why must you differentiate before you substitute the values at the moment?"},{"id":"j3","q":"Explain to a friend how similar triangles help in the cone problem."},{"id":"j4","q":"Which step do you find hardest: the relation, the derivative, or the signs and units? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`x` and `y` both change with time, and `x^2 + y^2 = 169`. Which equation is true?","options":[{"t":"`2x + 2y = 0`","why":"Each term needs its rate factor.","_n":"1w728","_k":"5f2662a1"},{"t":"`2x dy/dt + 2y dx/dt = 0`","why":"`d/dt (x^2) = 2x dx/dt`: each variable with its own rate.","_n":"1x6f8","_k":"c88dc17d"},{"t":"`2x dx/dt + 2y dy/dt = 169`","why":"The derivative of 169 is 0.","_n":"1y6e8","_k":"0d671f83"},{"t":"`2x dx/dt + 2y dy/dt = 0`","why":"Each variable gets its own rate factor, and the derivative of 169 is 0.","_n":"1z6d8","_k":"2a5c0a4a"}]},"b":{"prompt":"`a` and `b` both change with time, and `a^2 + b^2 = 400`. Which equation is true?","options":[{"t":"`2a da/dt + 2b db/dt = 0`","why":"Each variable gets its own rate factor, and the derivative of 400 is 0.","_n":"206c8","_k":"a7b287a2"},{"t":"`2a db/dt + 2b da/dt = 0`","why":"`d/dt (a^2) = 2a da/dt`: each variable with its own rate.","_n":"216b8","_k":"1c6ae879"},{"t":"`2a da/dt + 2b db/dt = 400`","why":"The derivative of 400 is 0.","_n":"226a8","_k":"c9a94e05"},{"t":"`2a + 2b = 0`","why":"Each term needs its rate factor.","_n":"23698","_k":"79bf4c40"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A circle’s radius grows at 2 cm/s. How fast is its area growing when `r = 5` cm?","options":[{"t":"10π cm²/s","why":"That’s `2πr` without `dr/dt`.","_n":"24688","_k":"3eb8b922"},{"t":"25π cm²/s","why":"That’s the area, not its rate.","_n":"25778","_k":"790c1c1b"},{"t":"20π cm²/s","why":"`dA/dt = 2πr dr/dt = 2π(5)(2)`.","_n":"26768","_k":"7f2afc2a"},{"t":"4π cm²/s","why":"That’s `π(dr/dt)^2`.","_n":"27ed6","_k":"7c8832e2"}]},"b":{"prompt":"A circle’s radius grows at 3 cm/s. How fast is its area growing when `r = 4` cm?","options":[{"t":"24π cm²/s","why":"`dA/dt = 2πr dr/dt = 2π(4)(3)`.","_n":"28ee6","_k":"27af861f"},{"t":"8π cm²/s","why":"That’s `2πr` without `dr/dt`.","_n":"29eb6","_k":"9fea9926"},{"t":"16π cm²/s","why":"That’s the area, not its rate.","_n":"2aec6","_k":"eaa38fcb"},{"t":"9π cm²/s","why":"That’s `π(dr/dt)^2`.","_n":"2be96","_k":"f2819a9e"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Water drains from a tank at 5 L/min. Which statement is correct?","options":[{"t":"`dt/dV = -5` min/L","why":"The rate of volume with respect to time is `dV/dt`.","_n":"2cea6","_k":"cf8a7d0f"},{"t":"`dV/dt = -5` L/min","why":"The volume is decreasing.","_n":"2de76","_k":"1642420d"},{"t":"`dV/dt = 5` L/min","why":"Draining means the volume is decreasing: `dV/dt = -5` L/min.","_n":"2ee86","_k":"a63e55b0"},{"t":"`V = -5` L","why":"That’s a volume, and a negative one.","_n":"2ff56","_k":"8c899f23"}]},"b":{"prompt":"A balloon loses air at 20 cm³/s. Which statement is correct?","options":[{"t":"`V = -20` cm³","why":"That’s a volume, and a negative one.","_n":"2gf66","_k":"4047fda5"},{"t":"`dV/dt = 20` cm³/s","why":"Losing air means the volume is decreasing: `dV/dt = -20` cm³/s.","_n":"2hf36","_k":"42fbcb03"},{"t":"`dt/dV = -20` s/cm³","why":"The rate of volume with respect to time is `dV/dt`.","_n":"2if26","_k":"3b870b3f"},{"t":"`dV/dt = -20` cm³/s","why":"Losing air means the volume is decreasing.","_n":"2jf56","_k":"210cfff4"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A 13 m ladder’s foot slides away from a wall at 0.5 m/s. How fast is the top sliding down when the foot is 12 m from the wall?","options":[{"t":"1.2 m/s","why":"`y = 5`; `2(12)(0.5) + 2(5) dy/dt = 0`, so `dy/dt = -1.2`.","_n":"2kf46","_k":"5d1849b8"},{"t":"5/24 m/s","why":"That uses `y/x` instead of `x/y`.","_n":"2lf76","_k":"dbe1afdb"},{"t":"0.5 m/s","why":"The speeds are equal only when `x = y`.","_n":"2mf66","_k":"3823854f"},{"t":"0 m/s","why":"Substituting `x = 12` before differentiating freezes `x`.","_n":"2nf96","_k":"33220c87"}]},"b":{"prompt":"A 10 m ladder’s foot slides away at 0.3 m/s. How fast is the top sliding down when the foot is 8 m from the wall?","options":[{"t":"0.4 m/s","why":"`y = 6`; `dy/dt = -(8/6)(0.3)`.","_n":"2of86","_k":"0338f440"},{"t":"0 m/s","why":"Substituting `x = 8` before differentiating freezes `x`.","_n":"2peb6","_k":"19118f17"},{"t":"0.225 m/s","why":"Ratio upside down: that uses `y/x` instead of `x/y`.","_n":"2qea6","_k":"ed496609"},{"t":"0.3 m/s","why":"The speeds are equal only when `x = y`.","_n":"2rc79","_k":"b025cb07"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A cone tank (point down) has top radius 2 m and height 8 m. Water flows in at π m³/min. How fast is the level rising when the water is 4 m deep?","options":[{"t":"1/256 m/min","why":"That uses `r = 4h`.","_n":"2sc69","_k":"1c39a157"},{"t":"1 m/min","why":"`r = h/4`, `V = πh^3/48`, `dV/dt = (πh^2/16) dh/dt`; `π = π dh/dt`.","_n":"2tc59","_k":"4af68cd4"},{"t":"0 m/min","why":"Substituting `h = 4` before differentiating.","_n":"2uc49","_k":"791d12ff"},{"t":"3/4 m/min","why":"That keeps `r = 2` at every depth, as if the tank were a cylinder-like shape.","_n":"2vcb9","_k":"dee10092"}]},"b":{"prompt":"A cone tank (point down) has top radius 3 m and height 9 m. Water flows in at 2π m³/min. How fast is the level rising when the water is 6 m deep?","options":[{"t":"2/3 m/min","why":"`r` isn’t constant.","_n":"2wca9","_k":"54cfc6cc"},{"t":"1/162 m/min","why":"That uses `r = 3h`.","_n":"2xc99","_k":"53472d57"},{"t":"0 m/min","why":"Substituting `h = 6` before differentiating freezes `h`.","_n":"2yc89","_k":"50c47f1f"},{"t":"1/2 m/min","why":"`r = h/3`, `V = πh^3/27`; `2π = (π(36)/9) dh/dt`.","_n":"2zcf9","_k":"2d5c7cc5"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A 1.8 m student walks away from a 5.4 m lamp post at 1.2 m/s. How fast is the tip of their shadow moving?","options":[{"t":"3.6 m/s","why":"That multiplies by the ratio of heights, 5.4/1.8, which isn’t how the tip’s distance depends on `x`.","_n":"30ce9","_k":"00388df4"},{"t":"1.2 m/s","why":"That’s the student’s speed; the tip moves faster.","_n":"31c19","_k":"9be5fd2d"},{"t":"0.6 m/s","why":"That’s how fast the shadow lengthens.","_n":"32c29","_k":"25d98c49"},{"t":"1.8 m/s","why":"`5.4/(x + s) = 1.8/s` gives `s = x/2`; the tip is at `x + s = 1.5x`, so it moves at 1.5 × 1.2.","_n":"33c39","_k":"f3eba3de"}]},"b":{"prompt":"A 2 m person walks away from an 8 m lamp post at 1.5 m/s. How fast is the tip of their shadow moving?","options":[{"t":"2 m/s","why":"`8s = 2(x + s)` gives `s = x/3`; tip at `4x/3`.","_n":"34c49","_k":"5ce823f2"},{"t":"6 m/s","why":"That multiplies by the ratio of heights, 8/2, which isn’t how the tip’s distance depends on `x`.","_n":"35c59","_k":"ef59e635"},{"t":"1.5 m/s","why":"That’s the person’s speed; the tip moves faster.","_n":"36c69","_k":"a4c8bb69"},{"t":"0.5 m/s","why":"That’s how fast the shadow lengthens.","_n":"37c79","_k":"76553d91"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why you differentiate the ladder equation before substituting `x = 6`?","options":[{"t":"“`x` is changing with time. Substituting 6 first turns `x` into a constant whose derivative is 0, which hides `dx/dt`. Differentiating first keeps every rate in the equation.”","why":"It names the real reason: substituting first wipes out the rate `dx/dt`.","_n":"38c89","_k":"c6b6c53a"},{"t":"“Because substituting first gives the wrong value of `y`.”","why":"`y = 8` is correct either way; the rate is what goes wrong.","_n":"39c99","_k":"3e871efd"},{"t":"“Because 6 is not a solution of the equation.”","why":"`x = 6`, `y = 8` does satisfy it.","_n":"3aca9","_k":"dc88e00d"},{"t":"“It doesn’t matter; both orders give the same answer.”","why":"`x` is changing. If you replace it by 6 first, its derivative becomes 0. Differentiate, then substitute.","_n":"3bd39","_k":"c489ef95"}]},"b":{"prompt":"Which is the best explanation of why `r` must be written in terms of `h` before differentiating the cone’s volume?","options":[{"t":"“It isn’t needed; differentiate `(1/3)πr^2h` with `r` fixed.”","why":"That treats `r` as constant, which is wrong.","_n":"3cd29","_k":"e7c3d80d"},{"t":"“Both `r` and `h` change as the tank fills. Replacing `r` by `h/2` leaves one variable, so the derivative gives `dV/dt` in terms of `dh/dt` only, the rate we want.”","why":"One variable left means one unknown rate: `dh/dt`.","_n":"3dd59","_k":"c69b86a2"},{"t":"“Because `r` is constant.”","why":"The surface radius grows as the water rises.","_n":"3ed49","_k":"8b1ddee5"},{"t":"“Because the formula for a cone only works with `h`.”","why":"It works with both; we don’t know `dr/dt`.","_n":"3fd79","_k":"524ea425"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"For a draining tank, `dV/dt = -3` m³/min when `h = 2` m. What does this mean?","options":[{"t":"“The depth is falling at 3 m/min.”","why":"That would be `dh/dt`.","_n":"3gd69","_k":"e460521d"},{"t":"“At the moment the water is 2 m deep, the volume is decreasing at 3 m³ per minute.”","why":"A rate is a change per unit of time at that moment, and the minus sign means decreasing.","_n":"3hd99","_k":"0e213d92"},{"t":"“The volume is −3 m³.”","why":"`dV/dt = -3` m³/min describes how fast the volume changes, not the volume itself.","_n":"3id89","_k":"3184aa65"},{"t":"“After 2 minutes, 3 m³ has drained.”","why":"`h = 2` is a depth, not a time.","_n":"3jcb9","_k":"b5c8c2d1"}]},"b":{"prompt":"For a filling tank, `dh/dt = 0.25` m/min when `V = 10` m³. What does this mean?","options":[{"t":"“The volume grows at 0.25 m³/min.”","why":"That would be `dV/dt`.","_n":"3kca9","_k":"ae92835f"},{"t":"“After 10 minutes, the level rises 0.25 m.”","why":"`V = 10` is a volume, not a time.","_n":"3lcd9","_k":"cb12428d"},{"t":"“At the moment the tank holds 10 m³, the water level is rising at 0.25 m per minute.”","why":"A rate is a change per unit of time at that moment, and the plus sign means rising.","_n":"3mce9","_k":"fe1ccf0a"},{"t":"“The level is 0.25 m.”","why":"`dh/dt = 0.25` m/min describes how fast the level changes, not the level itself.","_n":"3ncb9","_k":"e826eaad"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Two cyclists leave the same corner at the same time, one riding north at 45 km/h, the other east at 60 km/h. How fast is the distance between them growing?","options":[{"t":"15 km/h","why":"Subtracting would be right only if they rode the same way.","_n":"3occ9","_k":"9f8213b5"},{"t":"105 km/h","why":"Adding the speeds would be right only if they rode in opposite directions.","_n":"3pc99","_k":"40fa4368"},{"t":"52.5 km/h","why":"Averaging has no basis.","_n":"3qca9","_k":"2504b51d"},{"t":"75 km/h","why":"After `t` hours: `45t` and `60t`, so the distance is `75t`; `z dz/dt = x dx/dt + y dy/dt` gives 75 at every moment.","_n":"3rc79","_k":"7ed8cfab"}]},"b":{"prompt":"Two trains leave the same station at the same time, one going north at 72 km/h, the other east at 96 km/h. How fast is the distance between them growing?","options":[{"t":"120 km/h","why":"After `t` hours: `72t` and `96t`, so the distance is `120t`; it grows at 120 km/h at every moment.","_n":"3sc89","_k":"da3a5c75"},{"t":"84 km/h","why":"Averaging has no basis.","_n":"3td59","_k":"e67fcae5"},{"t":"168 km/h","why":"Adding the speeds would be right only if they went in opposite directions.","_n":"3ud69","_k":"58a3334b"},{"t":"24 km/h","why":"Subtracting would be right only if they went the same way.","_n":"3v5fa","_k":"1349bfdf"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Sand pours onto a cone-shaped pile at 9π m³/min. The pile’s height always equals its radius. How fast is the height growing when the pile is 3 m high?","options":[{"t":"1/3 m/min","why":"That uses the cylinder formula `πr^2h`.","_n":"3w5ea","_k":"80709b15"},{"t":"1 m/min","why":"`V = (1/3)πh^3`, `dV/dt = πh^2 dh/dt`; `9π = 9π dh/dt`.","_n":"3x5da","_k":"202ea2dc"},{"t":"9 m/min","why":"That divides by π only; divide by `πh^2 = 9π`.","_n":"3y5ca","_k":"a56ea881"},{"t":"3 m/min","why":"That divides by `πh`, not `πh^2`.","_n":"3z5ba","_k":"2aff77bf"}]},"b":{"prompt":"Sand pours onto a cone-shaped pile at 2π m³/min. The height is always twice the radius. How fast is the height growing when the pile is 4 m high?","options":[{"t":"1/2 m/min","why":"`r = h/2`, `V = πh^3/12`, `dV/dt = (πh^2/4) dh/dt`; `2π = 4π dh/dt`.","_n":"405aa","_k":"35059b7c"},{"t":"1/32 m/min","why":"That uses `r = 2h`.","_n":"4159a","_k":"bad4016e"},{"t":"2 m/min","why":"Divide by `πh^2/4 = 4π`, not π.","_n":"4258a","_k":"9b0c06b0"},{"t":"1/6 m/min","why":"Cylinder formula: a cone holds a third of that.","_n":"4357a","_k":"e5505746"}]}}]},"task":{"title":"Design a ladder moment","summary":"Design a ladder moment","statement":"\u003cp>Choose a ladder length, a foot distance and a speed for the foot. Meet every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The top of the ladder is at a whole number of metres up the wall.\u003c/li>\u003cli>The top slides down faster than the foot slides out.\u003c/li>\u003cli>The top is sliding down at exactly 1.2 m/s.\u003c/li>\u003cli>The foot moves slower than 1 m/s.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Ladder length `L`: whole metres from 5 to 15. Foot distance `x`: whole metres from 1 to `L - 1`. Foot speed `dx/dt`: 0.1 to 2.0 m/s in steps of 0.1. The top is `y` m up the wall.\u003c/p>","checks":["Top at a whole-number height","Top faster than foot","Top at 1.2 m/s","Foot slower than 1 m/s"],"tips":["A whole-number height needs a Pythagorean triple: 3-4-5, 6-8-10, 5-12-13, 9-12-15.","The top is faster when `x/y > 1`: the foot must be farther out than the top is high.","S
