.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 52: Normal and plane (V1 3D view with three modes and V12 readouts), Converting between forms stations,
   Build the equation coefficient boxes, Plane to order task */
.cp-mag{color:var(--f4)}
.cp-ex{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.cp-main,.cp-side{min-width:0}
@media (max-width:760px){.cp-ex{grid-template-columns:minmax(0,1fr)}}
.cp-eq{min-height:1.6em}
canvas.plot.cp-cv{touch-action:none;cursor:grab}
canvas.plot.cp-cv:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.cp-vbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.cp-vnote{margin:4px 0 0}
.cp-tipn{margin:8px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cp-h{font-weight:700;margin:12px 0 6px}
.cp-side .cp-h:first-child{margin-top:0}
.cp-modes{flex-wrap:wrap}
.cp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cp-step{display:flex;flex-direction:column;gap:2px;min-width:0}
.cp-sl{font-size:.92rem}
.cp-sr{display:flex;align-items:center;gap:3px}
.cp-sr .btn{min-width:28px;min-height:30px;padding:0 6px}
.cp-sr input.numin{width:2.9rem;min-width:0;text-align:center;padding-left:2px;padding-right:2px}
.cp-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px}
.cp-row input.numin{width:3.4rem;min-width:0;text-align:center}
.cp-rg{margin:6px 0 0}
.cp-side dl.read.cp-read{margin-top:14px}
.cp-st .cp-stg{align-items:start}
.cp-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cp-sti{padding:6px 10px;border-left:4px solid var(--rule);border-radius:0 8px 8px 0}
.cp-sti.on{border-left-color:var(--hi);background:var(--info-bg)}
.cp-sti .btn{white-space:normal;text-align:left}
.cp-rv{margin:6px 0 0;overflow-x:auto;max-width:100%}
.cp-meth{margin:0 0 10px}
.cp-meth .btn{white-space:normal;text-align:left}
.cp-pls,.cp-rels{gap:6px;margin:0 0 8px}
.cp-angh{margin:6px 0 4px;font-weight:700}
.cp-tally{margin:8px 0 0;font-weight:700}
.cp-bin{margin:6px 0 4px}
.cp-ptin{display:flex;flex-direction:column;gap:6px}
.cp-pgh{margin:8px 0 4px}
@media (max-width:480px){.cp-row input.numin{width:2.9rem}.cp-grid{gap:6px}.cp-sr .btn{min-width:26px;padding:0 4px}}

-a-line-in-r2","title":"Cartesian Equation of a Line in R²","kind":"topic","group":"8"},{"nn":"50","slug":"equations-of-lines-in-r3","title":"Vector, Parametric and Symmetric Equations of Lines in R³","kind":"topic","group":"8"},{"nn":"51","slug":"vector-equation-of-a-plane","title":"Vector Equation of a Plane","kind":"topic","group":"8"},{"nn":"52","slug":"cartesian-equation-of-a-plane","title":"Cartesian Equation of a Plane","kind":"topic","group":"8"},{"nn":"53","slug":"intersection-of-lines-with-planes","title":"Intersection of Lines with Planes","kind":"topic","group":"9"},{"nn":"54","slug":"intersection-of-lines","title":"Intersection of Lines in R² and R³","kind":"topic","group":"9"},{"nn":"55","slug":"systems-of-equations-matrices","title":"Systems of Equations (Matrices)","kind":"topic","group":"9"},{"nn":"56","slug":"intersection-of-two-planes","title":"Intersection of Two Planes","kind":"topic","group":"9"},{"nn":"57","slug":"intersection-of-three-planes","title":"Intersection of Three Planes","kind":"topic","group":"9"},{"nn":"58","slug":"distance-point-to-line","title":"Distance from a Point to a Line in R² and R³","kind":"topic","group":"9"},{"nn":"59","slug":"distance-point-to-plane","title":"Distance from a Point to a Plane","kind":"topic","group":"9"}]},"salt":"b4e0ba65","content":{"id":"52-cartesian-equation-of-a-plane","kind":"topic","title":"Cartesian equation of a plane","topic":"Cartesian Equation of a Plane","readyTopic":"the Cartesian equation of a plane","hero":{"eq":"`@c{vec{n}} · (vec{r} - vec{r}_0) = 0` ⟶ `@c{A}x + @c{B}y + @c{C}z + D = 0`","eqLabel":"n vector dot the quantity r vector minus r zero vector equals 0, which expands to A x plus B y plus C z plus D equals 0, with normal n equal to A, B, C.","eqSize":"sm","headline":"One arrow decides the tilt","text":"Every plane has a \u003cstrong>normal\u003c/strong>: a vector perpendicular to it. Fix a point and a normal and the plane is fixed. Its \u003cstrong>scalar equation\u003c/strong> `Ax + By + Cz + D = 0` holds the normal in plain sight: the coefficients `(A, B, C)`. Tilt the normal and the plane tilts with it.","fig":{"aria":"A 3D view: the point P₀(1, 1, 1) with the normal n = (1, 2, 2) and the plane x + 2y + 2z − 5 = 0 painted by an arrow that stays at right angles to the normal.","shape":"square"}},"goals":["I can explain what a normal vector is and read it from `Ax + By + Cz + D = 0`.","I can write a plane’s scalar equation from a point and a normal, three points, or a vector equation.","I can convert a scalar equation into vector and parametric form.","I can recognize and describe special planes (missing variables, intercepts, coordinate planes).","I can decide whether two planes are parallel, perpendicular or neither, and find the angle between them.","I can solve problems with scalar equations of planes (heights on a sloped surface, planes through a point parallel to another)."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Cross product","goal":2,"prompt":"Find `(1, 2, 0) × (0, 1, 3)`.","options":[{"t":"`(6, -3, 1)`","why":"`(2·3 - 0·1, 0·0 - 1·3, 1·1 - 2·0)`.","_n":"068a","_k":"a8b9b334"},{"t":"`(-6, 3, -1)`","why":"That’s `(0, 1, 3) × (1, 2, 0)`: order matters.","_n":"165a","_k":"bf3b47f7"},{"t":"`(0, 2, 0)`","why":"That’s not the cross product; it’s the start of a dot product.","_n":"266a","_k":"165e492b"},{"t":"`(6, 3, 1)`","why":"The `y`-component is `a_3 b_1 - a_1 b_3 = 0 - 3`.","_n":"36ba","_k":"89d8fb36"}],"hints":["Use `(a_2 b_3 - a_3 b_2, a_3 b_1 - a_1 b_3, a_1 b_2 - a_2 b_1)`.","`x`: `2·3 - 0·1 = 6`.","`(6, -3, 1)`."]},{"id":"w2","skill":"Dot product","goal":1,"prompt":"Which vector is perpendicular to `(2, -1, 3)`?","options":[{"t":"`(1, 5, 1)`","why":"`2 - 5 + 3 = 0`.","_n":"46ca","_k":"e75ca093"},{"t":"`(-2, 1, -3)`","why":"That’s parallel (opposite direction).","_n":"569a","_k":"91b8da7f"},{"t":"`(1, 2, 1)`","why":"`2 - 2 + 3 = 3`, not 0.","_n":"66aa","_k":"05ebb020"},{"t":"`(1, 2, 3)`","why":"`2 - 2 + 9 = 9`.","_n":"76fa","_k":"fab099e6"}],"hints":["Perpendicular means the dot product is 0.","Test each: `2a - b + 3c`.","`(1, 5, 1)`."]},{"id":"w3","skill":"Vector equations of planes","goal":3,"prompt":"Which point is on `vec{r} = (1, 0, 2) + s(1, 1, 0) + t(0, 2, 1)`?","options":[{"t":"`(0, 0, 0)`","why":"No `s` and `t` reach the origin here.","_n":"870a","_k":"1d9e43c4"},{"t":"`(2, 3, 3)`","why":"`s = 1`, `t = 1`.","_n":"9702","_k":"f10ac33b"},{"t":"`(1, 1, 0)`","why":"Directions aren’t points of the plane.","_n":"a6f2","_k":"608575a5"},{"t":"`(2, 3, 2)`","why":"`z = 2 + t = 3`.","_n":"b722","_k":"a3fa6399"}],"hints":["Pick values of `s` and `t`.","`s = t = 1`: `(1 + 1, 0 + 1 + 2, 2 + 1)`.","`(2, 3, 3)`."]},{"id":"w4","skill":"Cross product","goal":2,"prompt":"Which vector is perpendicular to both `(1, 0, 1)` and `(0, 1, 1)`?","options":[{"t":"`(1, 1, 1)`","why":"`(1, 1, 1) · (1, 0, 1) = 2`.","_n":"c712","_k":"8a7c74f3"},{"t":"`(-1, -1, 1)`","why":"Their cross product; check: `-1 + 0 + 1 = 0` and `0 - 1 + 1 = 0`.","_n":"d742","_k":"84393522"},{"t":"`(0, 0, 1)`","why":"`(0, 0, 1) · (1, 0, 1) = 1`.","_n":"e732","_k":"a7f8676b"},{"t":"`(1, 1, 2)`","why":"The sum lies in their plane.","_n":"f762","_k":"8fcb08c9"}],"hints":["The cross product is perpendicular to both.","`(0·1 - 1·1, 1·0 - 1·1, 1·1 - 0·0)`.","`(-1, -1, 1)`."]},{"id":"w5","skill":"Solving for a variable","goal":4,"prompt":"In `2x - y + 3z = 6`, find `y` when `x = 1` and `z = 2`.","options":[{"t":"−2","why":"Divide by −1.","_n":"g752","_k":"73d2b123"},{"t":"2","why":"`2 - y + 6 = 6`, so `y = 2`.","_n":"h682","_k":"d1373f15"},{"t":"6","why":"Substitute first, then solve.","_n":"i672","_k":"c6bd9f08"},{"t":"14","why":"`-y = 6 - 2 - 6`.","_n":"jde1","_k":"52efd052"}],"hints":["Substitute `x` and `z`.","`8 - y = 6`.","`y = 2`."]},{"id":"w6","skill":"Dot product","goal":5,"prompt":"What is the angle between `(1, 0, 1)` and `(0, 1, 1)`?","options":[{"t":"30°","why":"`cos 30° = √3/2`.","_n":"kdf1","_k":"54420ce4"},{"t":"90°","why":"The dot product is 1, not 0.","_n":"le01","_k":"fbcab656"},{"t":"45°","why":"Divide by both: `√2 · √2 = 2`.","_n":"me11","_k":"0f5202ca"},{"t":"60°","why":"`cos θ = 1/(√2 · √2) = 1/2`.","_n":"ne21","_k":"3ee5afb5"}],"hints":["`cos θ = {vec{a} · vec{b}}/{|vec{a}||vec{b}|}`.","Dot product 1; magnitudes `√2` and `√2`.","`cos θ = 1/2`: 60°."]}],"refreshers":{"Cross product":"`vec{a} × vec{b}` is perpendicular to both. Use the determinant pattern, and watch the middle sign.","Dot product":"`vec{a} · vec{b} = 0` means perpendicular. `cos θ = {vec{a} · vec{b}}/{|vec{a}||vec{b}|}`.","Vector equations of planes":"`vec{r} = vec{r}_0 + s vec{a} + t vec{b}`: choose `s` and `t` to get points.","Solving for a variable":"Substitute the known values, collect constants, then divide."}}},"explore":{"heading":"Normal and plane","intro":"Tilt the normal and watch the plane follow. Type an equation and see its normal, intercepts and special features. Then compare two planes.","txt":{"modes":{"np":"Normal + point","eq":"Equation","two":"Two planes"},"modeL":"Mode","normalH":"Normal `vec{n} = (A, B, C)`","pointH":"Point `P_0`","testH":"Test point `Q`","eqH":"Coefficients of `Ax + By + Cz + D = 0`","p1H":"Plane 1 (blue)","p2H":"Plane 2 (teal)","ranges":{"np":"Each from −4 to 4; `Q` from −5 to 5.","eq":"`A`, `B`, `C` from −6 to 6; `D` from −20 to 20.","two":"Whole numbers from −6 to 6."},"tidy":"Tidy","tidyNote":"Tidy makes the leading coefficient positive.","tip":"Normal tip","tipLabel":"Normal tip handle. Left and Right arrows change A, Up and Down change B, Page Up and Page Down change C.","tipNote":"Drag the dot at the normal’s tip, or focus \u003cstrong>Normal tip\u003c/strong> and use the arrow keys.","rows":{"normal":"Normal","point":"Point","eq":"Equation","d":"`D`","icpt":"Intercepts","special":"Special","test":"Test point","p1":"Plane 1","p2":"Plane 2","dot":"`vec{n}_1 · vec{n}_2`","rel":"Two planes"},"notPlane":"Not a plane: `A`, `B` and `C` can’t all be 0.","onP":"on the plane","plusSide":"on the side the normal points to","minusSide":"on the other side","same":"Same plane: the equations are multiples","par":"Parallel: the normals are parallel","perp":"Perpendicular: angle 90°","meet":"Neither: the planes meet at","normalsAt":"the normals meet at","mask":"Make your prediction first.","off":"(outside the view)"},"predIntro":"Make a prediction first. Then the 3D view shows you what really happens.","predictions":[{"id":"p1","prompt":"Start: `vec{n} = (1, 2, 2)`, `P_0(1, 1, 1)`. Change the normal to `(2, 4, 4)`, keeping `P_0`. What happens to the plane?","options":[{"t":"It moves twice as far","_n":"oe31","_k":"860359de"},{"t":"Nothing: same plane","_n":"pe41","_k":"d237fa89"},{"t":"It becomes a line","_n":"qe51","_k":"5cf69102"},{"t":"It tilts","_n":"re61","_k":"041560fa"}],"explain":"Every multiple of a normal is a normal; the equation just doubled: `2x + 4y + 4z - 10 = 0`."},{"id":"p2","prompt":"Set `A = 0`, `B = 0`, `C = 1`, `D = -3`, so the equation is `z = 3`. What will you see?","options":[{"t":"The point `(0, 0, 3)`","_n":"se71","_k":"eebaf42e"},{"t":"A horizontal plane 3 units up","_n":"te41","_k":"770cccb5"},{"t":"A vertical plane","_n":"ue31","_k":"f962db6c"},{"t":"A line","_n":"ve21","_k":"5debf80a"}],"explain":"`x` and `y` are free, so every point with `z = 3` is included."},{"id":"p3","prompt":"`x + z = 4` has no `y`-term. How does the plane sit?","options":[{"t":"Parallel to the `y`-axis","_n":"we11","_k":"9ee997f3"},{"t":"Through the origin","_n":"xe81","_k":"072c9fea"},{"t":"Perpendicular to the `y`-axis","_n":"ye71","_k":"b93af944"},{"t":"Parallel to the `x`-axis","_n":"ze61","_k":"0a3df1e2"}],"explain":"The normal `(1, 0, 1)` has no `y`-part, so the plane contains the `y`-direction. It’s a slanted wall through `(4, 0, 0)` and `(0, 0, 4)`."},{"id":"p4","prompt":"Plane 1: `x + y + z = 1`. Plane 2: `x - y = 0`. Parallel, perpendicular or neither?","options":[{"t":"The same plane","_n":"10e51","_k":"194ea970"},{"t":"Parallel","_n":"11ec1","_k":"a63868bb"},{"t":"Neither","_n":"12eb1","_k":"2b727a9d"},{"t":"Perpendicular","_n":"13e22","_k":"2ed3507a"}],"explain":"`(1, 1, 1) · (1, -1, 0) = 0`."}],"chalIntro":"Use the 3D tool, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Build the plane through `(2, 0, -1)` with normal `(3, 1, -2)`, and enter its scalar equation in \u003cstrong>Equation\u003c/strong> mode.","why":"`3x + y - 2z + D = 0` through `(2, 0, -1)`: `6 + 0 + 2 + D = 0`, so `D = -8`.","hints":["Coefficients = normal: `3x + y - 2z + D = 0`.","Substitute `(2, 0, -1)`: `6 + 0 + 2 + D = 0`.","`D = -8`."],"msgs":{"mode":"Enter the equation in \u003cstrong>Equation\u003c/strong> mode: type `A`, `B`, `C` and `D`.","sign":"Check `(2, 0, -1)`: `6 + 0 + 2 + 8 ≠ 0`. `D = -(6 + 0 + 2) = -8`.","swap":"The normal gives the coefficients; the point gives `D`.","origin":"That plane passes through the origin, not `(2, 0, -1)`.","general":"Not yet: the coefficients come from the normal, and `(2, 0, -1)` must make the equation true."}},{"id":"tc2","goal":4,"prompt":"Equation mode: make a plane with `x`-intercept 2, `y`-intercept 3 and `z`-intercept 6, using whole-number coefficients.","why":"`x/2 + y/3 + z/6 = 1`; multiply by 6: `3x + 2y + z - 6 = 0`.","hints":["Intercept form: `x/2 + y/3 + z/6 = 1`.","Multiply by 6.","`3x + 2y + z - 6 = 0`."],"msgs":{"mode":"Switch to \u003cstrong>Equation\u003c/strong> mode and type the coefficients.","coef":"Intercepts aren’t coefficients: that plane’s intercepts are 1/2, 1/3, 1/6.","onlyZ":"Only the `z`-intercept is right.","sign":"Set `y = z = 0`: `3x = -6` gives −2.","general":"Not yet: watch the Intercepts row. You need 2, 3 and 6."}},{"id":"tc3","goal":5,"stretch":true,"prompt":"Two planes mode: plane 1 is `x + 2y - 2z = 4`. Make plane 2 pass through `(1, 1, 1)`, be \u003cstrong>perpendicular\u003c/strong> to plane 1, and be \u003cstrong>parallel to the `z`-axis\u003c/strong>.","why":"No `z`-term and `(A, B, 0) · (1, 2, -2) = 0` give `(2, -1, 0)`; through `(1, 1, 1)`: `2x - y - 1 = 0`. It’s the only such plane.","hints":["Parallel to the `z`-axis means no `z`-term: `C = 0`.","Perpendicular means `(A, B, 0) · (1, 2, -2) = 0`, so `A + 2B = 0`: `(2, -1, 0)` works.","`2x - y + D = 0` through `(1, 1, 1)`: `D = -1`."],"msgs":{"mode":"Switch to \u003cstrong>Two planes\u003c/strong> mode.","p1":"First set plane 1 to `x + 2y - 2z - 4 = 0`.","par":"That’s parallel to plane 1, not perpendicular.","noPerp":"Parallel to the `z`-axis, but `(1, 2, 0) · (1, 2, -2) = 5 ≠ 0`.","meetsZ":"Perpendicular to plane 1, but it meets the `z`-axis at `(0, 0, 2)` instead of running parallel to it.","point":"`(1, 1, 1)` gives `2 - 1 + 1 ≠ 0`.","general":"Not yet: check all three conditions. Through `(1, 1, 1)`, normals perpendicular, and no `z`-term."}}]},"part3":{"slug":"convert","name":"Convert","heading":"Converting between forms","intro":"Move between the vector side and the scalar side. Each station shows its steps on a 3D view so you can check every step. Then try the quick check.","labels":{"vec":"Vector side","sca":"Scalar side","working":"Check it with algebra","show":"Show","next":"Next step"},"st1":{"title":"Station 1: vector → scalar","text":"`vec{r} = (1, 0, 2) + s(1, 1, 0) + t(0, 1, 3)`. Press each step to reveal it. The 3D view draws the normal at right angles to both direction arrows.","fig":"3D view of the plane through (1, 0, 2) with direction arrows (1, 1, 0) in blue and (0, 1, 3) in teal.","steps":[{"b":"1. Normal = cross product of the directions","r":"`(1, 1, 0) × (0, 1, 3) = (3, -3, 1)`."},{"b":"2. Write the equation with the normal’s components","r":"`3x - 3y + z + D = 0`."},{"b":"3. Substitute `(1, 0, 2)`","r":"`3 - 0 + 2 + D = 0`, so `D = -5`: `3x - 3y + z - 5 = 0`."},{"b":"4. Check another point (`s = t = 1`)","r":"`(2, 2, 5)`: `6 - 6 + 5 - 5 = 0` ✓."}]},"st2":{"title":"Station 2: scalar → vector","text":"`2x - y + z = 4`. Find a vector equation two ways.","fig":"3D view of the plane 2x − y + z = 4 with its normal.","methA":{"b":"Method A: two variables as parameters","r":"Let `x = s`, `y = t`, so `z = 4 - 2s + t`: `vec{r} = (0, 0, 4) + s(1, 0, -2) + t(0, 1, 1)`."},"methB":{"b":"Method B: three points from the intercepts","r":"`(2, 0, 0)`, `(0, -4, 0)`, `(0, 0, 4)`. Directions: `(0, 0, 4) - (2, 0, 0) = (-2, 0, 4)` and `(0, -4, 0) - (2, 0, 0) = (-2, -4, 0)`: `vec{r} = (2, 0, 0) + s(-2, 0, 4) + t(-2, -4, 0)`."},"trap":{"b":"Use the normal as a direction","msg":"Directions in the plane are perpendicular to the normal. The normal sticks out of the plane. Using `(2, -1, 1)` as a direction draws a plane at right angles to the real one."},"alg":["Method A directions: `(1, 0, -2) · (2, -1, 1) = 2 + 0 - 2 = 0` and `(0, 1, 1) · (2, -1, 1) = 0 - 1 + 1 = 0`.","Method B directions: `(-2, 0, 4) · (2, -1, 1) = -4 + 4 = 0` and `(-2, -4, 0) · (2, -1, 1) = -4 + 4 = 0`.","Both directions of each form dot the normal `(2, -1, 1)` to 0, so they lie along the plane."]},"st3":{"title":"Station 3: comparing planes","text":"Tap two planes, then choose \u003cstrong>parallel\u003c/strong>, \u003cstrong>perpendicular\u003c/strong> or \u003cstrong>neither\u003c/strong> (and the angle). Classify all six pairs.","fig":"3D view of the two chosen planes and their normals.","planes":[{"name":"Π₁","eq":"`x + y = 3`","c":[1,1,0,-3]},{"name":"Π₂","eq":"`y + z = 1`","c":[0,1,1,-1]},{"name":"Π₃","eq":"`2x + 2y - 7 = 0`","c":[2,2,0,-7]},{"name":"Π₄","eq":"`x - y + z = 0`","c":[1,-1,1,0]}],"pick":"Tap two planes.","pickOne":"Tap one more plane.","rels":{"par":"parallel","perp":"perpendicular","nei":"neither"},"angH":"The angle between the planes:","angles":[30,45,60],"msgs":{"par":"✓ Parallel: the normals are multiples.","perp":"✓ Perpendicular: `vec{n}_1 · vec{n}_2 = 0`.","nei":"✓ Neither: the planes meet at","notPar":"The normals aren’t multiples, so the planes aren’t parallel.","notPerp":"Perpendicular planes have perpendicular normals, but here `vec{n}_1 · vec{n}_2 ≠ 0`.","isPar":"The normals are multiples: the planes are parallel.","isPerp":"`vec{n}_1 · vec{n}_2 = 0`: the planes are perpendicular.","ang":"The angle between planes is acute: use `|vec{n}_1 · vec{n}_2|` in `cos θ`."},"rows":{"n1":"First normal","n2":"Second normal","dot":"`vec{n}_1 · vec{n}_2`","angN":"Angle between normals","angP":"Angle between planes"},"tally":"Pairs classified:"},"quickCheck":{"title":"Quick check","summary":"Convert quick check","items":[{"id":"q1","goal":1,"prompt":"A normal to `4x - z + 7 = 0`?","choices":[{"t":"`(4, -1, 7)`","fb":"No `y`-term means `B = 0`; `D` isn’t part of the normal.","_n":"14e32","_k":"ec9266cb"},{"t":"`(4, 0, 1)`","fb":"No `y`-term means `B = 0`; `D` isn’t part of the normal.","_n":"15e02","_k":"1ba7081d"},{"t":"`(4, 0, -1)`","fb":"Right. No `y`-term means `B = 0`; `D` isn’t part of the normal.","_n":"16e12","_k":"dd577ee4"},{"t":"`(4, -1, 0)`","fb":"No `y`-term means `B = 0`; `D` isn’t part of the normal.","_n":"17e62","_k":"a6019d15"}]},{"id":"q2","goal":2,"prompt":"Scalar equation of `vec{r} = (0, 0, 1) + s(1, 0, 0) + t(0, 1, 0)`?","choices":[{"t":"`z = 0`","fb":"Normal `(1, 0, 0) × (0, 1, 0) = (0, 0, 1)`; through `(0, 0, 1)`.","_n":"18e72","_k":"a63c2e0b"},{"t":"`z - 1 = 0`","fb":"Right. Normal `(1, 0, 0) × (0, 1, 0) = (0, 0, 1)`; through `(0, 0, 1)`.","_n":"19e42","_k":"90d55192"},{"t":"`x + y - 1 = 0`","fb":"Normal `(1, 0, 0) × (0, 1, 0) = (0, 0, 1)`; through `(0, 0, 1)`.","_n":"1ae52","_k":"e874e448"},{"t":"`x + y + z = 1`","fb":"Normal `(1, 0, 0) × (0, 1, 0) = (0, 0, 1)`; through `(0, 0, 1)`.","_n":"1bea2","_k":"5217ccc3"}]},{"id":"q3","goal":5,"prompt":"Angle between the planes `x = 2` and `x + z = 1`?","choices":[{"t":"45°","fb":"Right. `(1, 0, 0) · (1, 0, 1) = 1`; `cos θ = 1/√2`.","_n":"1ceb2","_k":"ee306d9a"},{"t":"135°","fb":"`(1, 0, 0) · (1, 0, 1) = 1`; `cos θ = 1/√2`.","_n":"1de82","_k":"dc38f03c"},{"t":"60°","fb":"`(1, 0, 0) · (1, 0, 1) = 1`; `cos θ = 1/√2`.","_n":"1ee72","_k":"97cf902e"},{"t":"90°","fb":"`(1, 0, 0) · (1, 0, 1) = 1`; `cos θ = 1/√2`.","_n":"1fea2","_k":"7b1b06b7"}]},{"id":"q4","goal":5,"prompt":"Which plane is parallel to `2x - y + 3z = 1`?","choices":[{"t":"`3x - y + 2z = 1`","fb":"`(-4, 2, -6) = -2(2, -1, 3)`: parallel normals. `D` sets the position, not the tilt.","_n":"1ge92","_k":"68200a5e"},{"t":"`-4x + 2y - 6z = 5`","fb":"Right. `(-4, 2, -6) = -2(2, -1, 3)`: parallel normals. `D` sets the position, not the tilt.","_n":"1he42","_k":"b3507fa7"},{"t":"`2x + y + 3z = 1`","fb":"`(-4, 2, -6) = -2(2, -1, 3)`: parallel normals. `D` sets the position, not the tilt.","_n":"1ie32","_k":"b90d0076"},{"t":"None: parallel planes need equal `D`","fb":"`(-4, 2, -6) = -2(2, -1, 3)`: parallel normals. `D` sets the position, not the tilt.","_n":"1je62","_k":"cb9b4028"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Equation ↔ description","summary":"Equation ↔ description","goal":[1,4],"instruction":"Match each equation with its description. Two cards on the right have no partner.","leftTitle":"Equation","rightTitle":"Description","left":[{"id":"l1","t":"`z = 2`"},{"id":"l2","t":"`x = 0`"},{"id":"l3","t":"`y + z = 3`"},{"id":"l4","t":"`x - y = 0`","hints":["Test the point `(0, 0, 5)`.","`0 - 0 = 0` ✓, for any `z`.","So the whole `z`-axis lies in it."]},{"id":"l5","t":"`x + y + z = 6`"},{"id":"l6","t":"`2x + 3y + 6z = 6`"},{"id":"l7","t":"`x + 2y - z = 0`"},{"id":"l8","t":"`3x - z = 3`","hints":["Which variable is missing?","`y`: parallel to the `y`-axis.","`y = z = 0`: `3x = 3`, so `x = 1`."]}],"right":[{"id":"r1","t":"Horizontal plane 2 units above the `xy`-plane"},{"id":"r2","t":"The `yz`-plane"},{"id":"r3","t":"Parallel to the `x`-axis"},{"id":"r4","t":"Contains the `z`-axis"},{"id":"r5","t":"Intercepts 6, 6 and 6"},{"id":"r6","t":"Intercepts 3, 2 and 1"},{"id":"r7","t":"Through the origin, containing no coordinate axis"},{"id":"r8","t":"Parallel to the `y`-axis, `x`-intercept 1"},{"id":"r9","t":"Perpendicular to the `x`-axis"},{"id":"r10","t":"Intercepts 2, 3 and 6"}],"_a":"GRYJAUBbFEdTFkkSDlMUD0BGVxJOQ1oGQA5HQlFDGhcOAEcKQBMCF04WCQVAWxRHVxZJEg5XFA9ARlMSTkNaAkAOR0JVQxoXDgxHCkATDhcf","wrong":{"l3|r9":"No `x`-term means `x` is free: the plane runs parallel to the `x`-axis.","l6|r10":"Set `y = z = 0`: `2x = 6` gives 3.","l4|r7":"`x - y = 0` holds for every point `(0, 0, z)`, so it contains the `z`-axis.","l7|r4":"`x - y = 0` holds for every point `(0, 0, z)`, so it contains the `z`-axis; `x + 2y - z = 0` doesn’t."},"wrongDefault":"Set two variables to 0, or look for a missing variable."},{"id":"build","type":"custom","title":"Build the equation","summary":"Build the equation","star":true,"goal":[2,5,6],"instruction":"Fill in the coefficients of each plane’s scalar equation. Items 4 to 6 are non-routine; 6 goes beyond the Final Check.","how":"Type whole numbers in the four boxes (use 0 for a missing term), then press Check. Any non-zero multiple of the equation counts.","msgs":{"fill":"Fill in every box with a whole number (use 0 for a missing term).","zero":"`A`, `B` and `C` can’t all be 0.","general":"Not yet. Find the normal first, then substitute a point for `D`."},"items":[{"id":"s1","goal":2,"prompt":"Point `(1, 2, -1)`, normal `(2, 0, 3)`.","_a":"OQZJAE5SGgQ/","wrong":[{"c":[2,0,3,-1],"fb":"`D = -(2 - 3) = 1`."}],"why":"`2x + 3z + D = 0` through `(1, 2, -1)`: `2 - 3 + D = 0`, so `D = 1`."},{"id":"s2","goal":2,"prompt":"Points `(1, 0, 0)`, `(0, 2, 0)`, `(0, 0, 3)`.","_a":"OQJJA05TGhhUaQ==","wrong":[{"c":[1,2,3,-1],"fb":"Intercepts aren’t coefficients."}],"why":"`x/1 + y/2 + z/3 = 1`; times 6: `6x + 3y + 2z - 6 = 0`."},{"id":"s3","goal":2,"prompt":"`vec{r} = (2, 1, 0) + s(1, 0, 1) + t(0, 2, -1)`.","_a":"OQZJHVNNGwdOGVZt","wrong":[{"c":[1,0,1,-2],"fb":"`(1, 0, 1)` is a direction, not the normal."},{"n":[1,0,1],"fb":"`(1, 0, 1)` is a direction, not the normal."},{"n":[0,2,-1],"fb":"`(0, 2, -1)` is a direction, not the normal."}],"why":"`(1, 0, 1) × (0, 2, -1) = (-2, 1, 2)`; through `(2, 1, 0)`: `-2x + y + 2z + 3 = 0`, the same plane as `2x - y - 2z - 3 = 0`."},{"id":"s4","goal":6,"star":true,"prompt":"Through `(1, -2, 3)`, parallel to `4x - y + 2z = 7`.","_a":"OQBJHVNNBBlPBVdt","wrong":[{"c":[4,-1,2,-7],"fb":"Same normal, but `D` must fit `(1, -2, 3)`."},{"c":[4,-1,2,7],"fb":"Same normal, but `D` must fit `(1, -2, 3)`."}],"why":"Same normal `(4, -1, 2)`; `4 + 2 + 6 + D = 0`, so `D = -12`."},{"id":"s5","goal":2,"star":true,"prompt":"Contains the line `vec{r} = (1, 0, 1) + u(1, 1, 0)` and the point `(2, 0, 3)`.","_a":"OQZJHVBNGwROGVRt","wrong":[],"general":"Directions `(1, 1, 0)` and `(2, 0, 3) - (1, 0, 1) = (1, 0, 2)`; normal = their cross product.","why":"`(1, 1, 0) × (1, 0, 2) = (2, -2, -1)`; through `(1, 0, 1)`: `D = -1`.","hints":["You need two directions.","`(1, 1, 0)` and `(1, 0, 2)`.","Cross product `(2, -2, -1)`; `D` from `(1, 0, 1)`: −1."]},{"id":"s6","goal":5,"star":true,"prompt":"Through `(0, 0, 0)` and `(1, 1, 1)`, perpendicular to `x + 2y + 3z = 4`.","_a":"OQVJHVBNBxlSaQ==","wrong":[{"n":[1,2,3],"fb":"That’s parallel to the given plane."}],"why":"Directions `(1, 1, 1)` and `(1, 2, 3)`: `(1, 1, 1) × (1, 2, 3) = (1, -2, 1)`, through the origin.","hints":["A plane perpendicular to Π contains the direction of Π’s normal.","So the directions are `(1, 1, 1)` and `(1, 2, 3)`.","`(1, 1, 1) × (1, 2, 3) = (1, -2, 1)`, through the origin: `x - 2y + z = 0`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Camila","how":"","goal":[2,3],"instruction":"Camila made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the scalar equation of the plane through `P(2, -1, 4)` with normal `(3, 1, -2)`.","steps":["`3x + y - 2z + D = 0`.","Substitute `P`: `3(2) + (-1) - 2(4) + D = 0`.","`6 - 1 - 8 + D = 0`, so `D = -3`.","`3x + y - 2z - 3 = 0`."],"_a":"UA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"`D = -3` is right; the normal should be `(2, -1, 4)`.","why":"The normal is perpendicular to the plane. From a vector equation, it’s `vec{a} × vec{b}`, not either direction; from `Ax + By + Cz + D = 0`, it’s `(A, B, C)` with no `D`.","_n":"1ke52","_k":"b3b63bf6"},{"t":"Step 3 is correct.","why":"Check `P`: `6 - 1 - 8 - 3 = -6 ≠ 0`.","_n":"1lf02","_k":"74df80d5"},{"t":"`-3 + D = 0` gives `D = 3`: `3x + y - 2z + 3 = 0`.","why":"Check `P`: `6 - 1 - 8 + 3 = 0` ✓.","_n":"1mef2","_k":"40e448f0"},{"t":"Leave out `D`: `3x + y - 2z = 0`.","why":"Substitute `P_0` and solve for `D`: the plane passes through `P_0`, not the origin.","_n":"1n762","_k":"29233042"}],"hints":["Substitute `P` into Camila’s final equation.","It gives −6, not 0.","`-3 + D = 0` means `D = +3`."]},{"id":"e2","goal":2,"task":"Find the scalar equation of `vec{r} = (1, 2, 0) + s(2, 1, 1) + t(1, 0, 3)`.","steps":["The normal is `(2, 1, 1)`.","`2x + y + z + D = 0`.","Substitute `(1, 2, 0)`: `D = -4`."],"_a":"Ug==","stepFb":["","Step 2 uses step 1’s normal. The mistake is earlier.","The arithmetic is right; the normal isn’t."],"fixes":[{"t":"Use `(1, 2, 0)` as the normal.","why":"That’s a point.","_n":"1o772","_k":"0528a43a"},{"t":"`vec{n} = (2, 1, 1) × (1, 0, 3) = (3, -5, -1)`, so `3x - 5y - z + 7 = 0`.","why":"The normal is perpendicular to both directions: their cross product. `D = -(3 - 10) = 7`.","_n":"1p782","_k":"5da990d9"},{"t":"Step 1 is correct.","why":"`(2, 1, 1)` lies \u003cstrong>along\u003c/strong> the plane; a normal must be perpendicular to it.","_n":"1q792","_k":"f898dd2e"},{"t":"Use `(1, 0, 3)` as the normal instead.","why":"The normal is perpendicular to the plane. From a vector equation, it’s `vec{a} × vec{b}`, not either direction; from `Ax + By + Cz + D = 0`, it’s `(A, B, C)` with no `D`.","_n":"1r722","_k":"9ea7f1a2"}],"hints":["Is `(2, 1, 1)` perpendicular to itself?","The normal is perpendicular to both directions.","Cross product: `(3, -5, -1)`; `D = -(3 - 10) = 7`."]},{"id":"e3","goal":3,"task":"Find a vector equation of `2x + y - z = 6`.","steps":["A point: `x = 0`, `y = 0` gives `z = -6`, so `(0, 0, -6)`.","One direction: the normal `(2, 1, -1)`.","Another direction: `(1, 0, 2)`.","`vec{r} = (0, 0, -6) + s(2, 1, -1) + t(1, 0, 2)`."],"_a":"Uw==","stepFb":["Step 1 is correct.","","`(1, 0, 2)` is a valid direction, but check the step before.","Step 4 uses step 2. The mistake is earlier."],"fixes":[{"t":"Use `(2, 1, -6)` as a direction.","why":"That mixes the normal with `D`.","_n":"1s732","_k":"ee7ee06a"},{"t":"Use the point `(2, 1, -1)`.","why":"Changing the point doesn’t fix step 2: the normal is still being used as a direction. The normal is perpendicular to the plane. From a vector equation, it’s `vec{a} × vec{b}`, not either direction; from `Ax + By + Cz + D = 0`, it’s `(A, B, C)` with no `D`.","_n":"1t742","_k":"5477cece"},{"t":"Use two directions perpendicular to the normal, e.g. `(1, 0, 2)` and `(0, 1, 1)`.","why":"Both dot `(2, 1, -1)` to 0, so they lie along the plane.","_n":"1u752","_k":"0c2c9759"},{"t":"Step 2 is correct.","why":"The normal sticks \u003cstrong>out\u003c/strong> of the plane: `(2, 1, -1) · (2, 1, -1) = 6 ≠ 0`.","_n":"1v6e2","_k":"268e5e0e"}],"hints":["Which vectors lie along a plane?","Those with zero dot product with the normal.","`(1, 0, 2)` and `(0, 1, 1)` both work."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: that doubling the normal changed nothing, or how `x + z = 4` sits?"},{"id":"j2","q":"In your own words, why are the coefficients of `x`, `y` and `z` a normal to the plane?"},{"id":"j3","q":"Explain to a friend how to turn a vector equation of a plane into a scalar equation."},{"id":"j4","q":"Which conversion or test still feels shaky? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which vector is normal to the plane `3x - 2y + 5 = 0` in R³?","options":[{"t":"`(3, -2, 0)`","why":"Coefficients of `x`, `y`, `z`; no `z`-term means 0.","_n":"1w6f2","_k":"e998010b"},{"t":"`(0, 0, 1)`","why":"A missing `z` means the plane is parallel to the `z`-axis, so `(0, 0, 1)` lies along it.","_n":"1x7c2","_k":"3a3ec761"},{"t":"`(3, -2, 5)`","why":"5 is the constant `D`, not a component.","_n":"1y7b2","_k":"2032b639"},{"t":"`(2, 3, 0)`","why":"That’s perpendicular to the normal: a direction along the plane (the R² line rule).","_n":"1z7a2","_k":"fce5e9e5"}]},"b":{"prompt":"Which vector is normal to the plane `4y + z - 2 = 0`?","options":[{"t":"`(4, 1, -2)`","why":"−2 is the constant `D`, not a component, and the `x`-component is 0.","_n":"20792","_k":"5699db96"},{"t":"`(1, 0, 0)`","why":"A missing `x` means the plane is parallel to the `x`-axis, so `(1, 0, 0)` lies along it.","_n":"21782","_k":"3d3557ae"},{"t":"`(0, 1, -4)`","why":"That’s perpendicular to the normal: a direction along the plane.","_n":"22772","_k":"1c7705be"},{"t":"`(0, 4, 1)`","why":"Coefficients of `x`, `y`, `z`; no `x`-term means 0.","_n":"23762","_k":"2bd91ec9"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"The plane through `(1, 3, -2)` with normal `(2, -1, 4)`?","options":[{"t":"`x + 3y - 2z + 9 = 0`","why":"Point and normal swapped.","_n":"24752","_k":"515da9be"},{"t":"`2x - y + 4z = 0`","why":"That passes through the origin.","_n":"25742","_k":"5f47ebe6"},{"t":"`2x - y + 4z + 9 = 0`","why":"`D = -(2 - 3 - 8) = 9`.","_n":"26732","_k":"1a4535b9"},{"t":"`2x - y + 4z - 9 = 0`","why":"Check `(1, 3, -2)`: `2 - 3 - 8 - 9 ≠ 0`.","_n":"277a3","_k":"5a7aa816"}]},"b":{"prompt":"The plane through `(-1, 2, 0)` with normal `(3, 0, -1)`?","options":[{"t":"`-x + 2y + 3 = 0`","why":"Point and normal swapped.","_n":"287b3","_k":"556ecd9e"},{"t":"`3x - z = 0`","why":"That passes through the origin.","_n":"29783","_k":"32557789"},{"t":"`3x - z + 3 = 0`","why":"`D = -(-3 + 0 - 0) = 3`.","_n":"2a793","_k":"889cd3f3"},{"t":"`3x - z - 3 = 0`","why":"Check `(-1, 2, 0)`: `-3 - 0 - 3 ≠ 0`.","_n":"2b763","_k":"9cb3ccf0"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which describes the plane `y = -2` in R³?","options":[{"t":"A line parallel to the `x`-axis","why":"In R³ one equation gives a plane: `x` and `z` are free.","_n":"2c773","_k":"34f5c4c8"},{"t":"Parallel to the `xz`-plane, 2 units on the negative `y` side","why":"`x` and `z` are free; every point has `y = -2`.","_n":"2d743","_k":"263e5403"},{"t":"Perpendicular to the `xz`-plane","why":"Its normal `(0, 1, 0)` is perpendicular to the `xz`-plane, so the plane is parallel to it.","_n":"2e753","_k":"e9655cf8"},{"t":"The point `(0, -2, 0)`","why":"Every point with `y = -2` is included.","_n":"2f723","_k":"a362a538"}]},"b":{"prompt":"Which describes the plane `x + y = 4` in R³?","options":[{"t":"A line with slope −1","why":"In R³ one equation gives a plane: `z` is free.","_n":"2g733","_k":"b68e2360"},{"t":"A vertical plane parallel to the `z`-axis, through `(4, 0, 0)` and `(0, 4, 0)`","why":"`z` is free, so the plane is made of vertical lines.","_n":"2h603","_k":"4acc5b58"},{"t":"A plane through the origin","why":"`(0, 0, 0)` gives 0 ≠ 4.","_n":"2i5f3","_k":"0a746b39"},{"t":"A plane perpendicular to the `z`-axis","why":"No `z`-term means `z` is free: the plane is parallel to the `z`-axis.","_n":"2j623","_k":"003bf51b"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Scalar equation of `vec{r} = (1, 0, 1) + s(1, 2, 0) + t(0, 1, 1)`?","options":[{"t":"`2x - y + z + 3 = 0`","why":"Check `(1, 0, 1)`: `2 + 1 + 3 ≠ 0`.","_n":"2k613","_k":"5eef58c1"},{"t":"`2x - y + z - 3 = 0`","why":"`(1, 2, 0) × (0, 1, 1) = (2, -1, 1)`; `D = -(2 + 1) = -3`.","_n":"2l643","_k":"69da2250"},{"t":"`x + 2y - 1 = 0`","why":"That uses a direction as the normal.","_n":"2m633","_k":"6d3151f5"},{"t":"`2x + y + z - 3 = 0`","why":"The middle component of the cross product is `0·0 - 1·1 = -1`.","_n":"2n663","_k":"f364a963"}]},"b":{"prompt":"Scalar equation of `vec{r} = (0, 2, 1) + s(1, 0, 2) + t(1, 1, 0)`?","options":[{"t":"`-2x - 2y + z + 3 = 0`","why":"Middle sign slip in the cross product.","_n":"2o653","_k":"484594f1"},{"t":"`x + 2z - 2 = 0`","why":"That uses a direction as the normal.","_n":"2p683","_k":"3109d6bb"},{"t":"`2x - 2y - z - 5 = 0`","why":"Check `(0, 2, 1)`: `0 - 4 - 1 - 5 ≠ 0`.","_n":"2q673","_k":"336104cd"},{"t":"`2x - 2y - z + 5 = 0`","why":"Cross product `(-2, 2, 1)`; through `(0, 2, 1)`.","_n":"2rc2d","_k":"e736e9c2"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"For which `k` are `2x - y + kz = 3` and `x + 3y + 2z = 1` perpendicular?","options":[{"t":"`k = 4`","why":"That tries to make the normals proportional, the test for parallel.","_n":"2sc1d","_k":"e65f9de7"},{"t":"No value: perpendicular planes need matching coefficients","why":"Perpendicular planes have perpendicular normals: `vec{n}_1 · vec{n}_2 = 0`.","_n":"2tc0d","_k":"dec762b5"},{"t":"`k = 1/2`","why":"`(2, -1, k) · (1, 3, 2) = 2 - 3 + 2k = 0`.","_n":"2ubfd","_k":"353130b6"},{"t":"`k = -1/2`","why":"Sign slip: `2k = 1`.","_n":"2vc6d","_k":"f567496d"}]},"b":{"prompt":"For which `k` are `x + ky - z = 2` and `3x - y + z = 0` perpendicular?","options":[{"t":"`k = -2`","why":"Sign slip: `-k = -2`.","_n":"2wc5d","_k":"02fc071f"},{"t":"`k = -1/3`","why":"Proportional normals is the parallel test.","_n":"2xc4d","_k":"0cff519d"},{"t":"`k = 2`","why":"`3 - k - 1 = 0`.","_n":"2yc3d","_k":"8ef20bc0"},{"t":"No value","why":"Perpendicular planes have perpendicular normals: `vec{n}_1 · vec{n}_2 = 0`.","_n":"2zbad","_k":"9ae4c27d"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"What is the angle between the planes `x - z = 4` and `y + z = 1`?","options":[{"t":"30°","why":"`cos θ = 1/2` gives 60°.","_n":"30b9d","_k":"c6d4a710"},{"t":"45°","why":"Divide by both magnitudes: `√2 · √2 = 2`.","_n":"313cd","_k":"9a50b624"},{"t":"60°","why":"`(1, 0, -1) · (0, 1, 1) = -1`; the normals meet at 120°, so the planes meet at 60°.","_n":"323dd","_k":"ab98925f"},{"t":"120°","why":"The angle between planes is the acute one.","_n":"333ed","_k":"6b3d7564"}]},"b":{"prompt":"What is the angle between the planes `x - y = 2` and `y - z = 5`?","options":[{"t":"30°","why":"`cos θ = 1/2` gives 60°.","_n":"343fd","_k":"9dbda7ec"},{"t":"45°","why":"Divide by both magnitudes: `√2 · √2 = 2`.","_n":"3540d","_k":"47223b52"},{"t":"60°","why":"`(1, -1, 0) · (0, 1, -1) = -1`; take the acute angle.","_n":"3641d","_k":"0ab1082b"},{"t":"120°","why":"The angle between planes is the acute one.","_n":"3742d","_k":"27ac51da"}]}},{"id":"c1","cat":"C","goal":[1,3],"a":{"prompt":"Which is the best explanation of why `(2, 1, -1)` can’t be a direction vector of the plane `2x + y - z = 5`?","options":[{"t":"“It can: any vector made from the coefficients lies in the plane.”","why":"Directions in the plane are perpendicular to the normal. The normal sticks out of the plane.","_n":"3843d","_k":"2e0a4c94"},{"t":"“A direction vector can’t have negative components.”","why":"Signs don’t matter.","_n":"3934d","_k":"2fd4922b"},{"t":"“`(2, 1, -1)` is the normal. A direction along the plane must be perpendicular to the normal, but `(2, 1, -1) · (2, 1, -1) = 6 ≠ 0`.”","why":"Directions in the plane are perpendicular to the normal. The normal sticks out of the plane.","_n":"3a35d","_k":"7ad3ecfd"},{"t":"“Because the plane doesn’t pass through the origin.”","why":"Directions don’t depend on where the plane is.","_n":"3baee","_k":"1708bf30"}]},"b":{"prompt":"Which is the best explanation of why `(1, -3, 2)` can’t be a direction vector of the plane `x - 3y + 2z = 0`?","options":[{"t":"“A direction vector can’t have negative components.”","why":"Signs don’t matter.","_n":"3cade","_k":"1a690ca4"},{"t":"“`(1, -3, 2)` is the normal. A direction along the plane must be perpendicular to it, but `(1, -3, 2) · (1, -3, 2) = 14 ≠ 0`.”","why":"Directions in the plane are perpendicular to the normal. The normal sticks out of the plane.","_n":"3db0e","_k":"8ad93f1d"},{"t":"“It can: any vector made from the coefficients lies in the plane.”","why":"Directions in the plane are perpendicular to the normal. The normal sticks out of the plane.","_n":"3eafe","_k":"918539ac"},{"t":"“Because the plane passes through the origin.”","why":"Irrelevant to directions.","_n":"3fb2e","_k":"7d293daa"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the best description of the plane `2x + 3z = 6`?","options":[{"t":"“It’s perpendicular to the `y`-axis because `y` is missing.”","why":"In R³ one equation gives a plane: a missing variable can be anything, so the plane runs parallel to that axis.","_n":"3gb1e","_k":"7656d768"},{"t":"“It’s parallel to the `y`-axis: `y` can be anything, so the plane is made of lines parallel to the `y`-axis through the line `2x + 3z = 6` in the `xz`-plane. It meets the `x`-axis at 3 and the `z`-axis at 2.”","why":"No `y`-term: `y` is free.","_n":"3hb4e","_k":"b00d8205"},{"t":"“It meets the axes at `x = 3`, `y = 0` and `z = 2`.”","why":"It never meets the `y`-axis: `(0, y, 0)` gives 0 ≠ 6.","_n":"3ib3e","_k":"148ef9a4"},{"t":"“It’s a line in the `xz`-plane with intercepts 3 and 2.”","why":"In R³ one equation gives a plane: a missing variable can be anything, so the plane runs parallel to that axis.","_n":"3jb6e","_k":"b602a012"}]},"b":{"prompt":"Which is the best description of the plane `x - 2y = 4`?","options":[{"t":"“It meets the axes at `x = 4`, `y = -2` and `z = 0`.”","why":"It never meets the `z`-axis: `(0, 0, z)` gives 0 ≠ 4.","_n":"3kb5e","_k":"bb181618"},{"t":"“It’s parallel to the `z`-axis: `z` can be anything, so the plane is made of vertical lines through the line `x - 2y = 4` in the `xy`-plane. It meets the `x`-axis at 4 and the `y`-axis at −2.”","why":"No `z`-term: `z` is free.","_n":"3lc8e","_k":"3e1f39b2"},{"t":"“It’s a line in the `xy`-plane with intercepts 4 and −2.”","why":"In R³ one equation gives a plane: a missing variable can be anything, so the plane runs parallel to that axis.","_n":"3mc9e","_k":"3bf87a15"},{"t":"“It’s perpendicular to the `z`-axis because `z` is missing.”","why":"In R³ one equation gives a plane: a missing variable can be anything, so the plane runs parallel to that axis.","_n":"3nc6e","_k":"0399c6cd"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A ramp’s surface lies in the plane through `A(0, 0, 0)`, `B(4, 0, 1)` and `C(0, 3, 0)`, in metres (`z` is height). How high is the ramp above the floor point `(2, 1, 0)`?","options":[{"t":"8 m","why":"That inverts rise and run: `z = 4x`.","_n":"3oc7e","_k":"9a6a0e25"},{"t":"0.5 m","why":"Normal `(4, 0, 1) × (0, 3, 0) = (-3, 0, 12)`, so `x - 4z = 0` and `z = x/4 = 0.5`.","_n":"3pc4e","_k":"1921c60a"},{"t":"1 m","why":"That’s the height at `B`, the far end.","_n":"3qc5e","_k":"6255a5ad"},{"t":"0.25 m","why":"That uses `y = 1`; the ramp rises along `x`, not `y`.","_n":"3rc2e","_k":"4d6f1795"}]},"b":{"prompt":"A ramp lies in the plane through `A(0, 0, 0)`, `B(0, 6, 2)` and `C(5, 0, 0)`, in metres. How high is it above the floor point `(1, 3, 0)`?","options":[{"t":"1/3 m","why":"That uses `x = 1`; the ramp rises along `y`, not `x`.","_n":"3sc3e","_k":"dc7156ed"},{"t":"2 m","why":"That’s `B`’s height.","_n":"3tc0e","_k":"b441b615"},{"t":"1 m","why":"Normal `(0, 6, 2) × (5, 0, 0) = (0, 10, -30)`, so `y - 3z = 0` and `z = y/3 = 1`.","_n":"3uc1e","_k":"8b4fab12"},{"t":"9 m","why":"That inverts rise and run: `z = 3y`.","_n":"3v3ae","_k":"d07e196a"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A glass shelf must be parallel to the plane `x + y + 2z = 0` and pass through the bracket at `(1, 2, 3)`. Where does the shelf’s plane meet the `z`-axis?","options":[{"t":"`z = 3`","why":"That’s the bracket’s height; the shelf is tilted.","_n":"3w39e","_k":"a0e82697"},{"t":"`z = 0`","why":"A parallel plane through `(1, 2, 3)` can’t pass through the origin.","_n":"3x38e","_k":"a17a2321"},{"t":"`z = 9/2`","why":"`x + y + 2z = 1 + 2 + 6 = 9`; on the `z`-axis `2z = 9`.","_n":"3y37e","_k":"49bbfdc0"},{"t":"`z = 9`","why":"Divide by the coefficient 2.","_n":"3z36e","_k":"6ac5c471"}]},"b":{"prompt":"A shelf is parallel to `2x - y + 4z = 0` and passes through `(1, -1, 2)`. Where does it meet the `z`-axis?","options":[{"t":"`z = 11/4`","why":"`2 + 1 + 8 = 11`, so `4z = 11`.","_n":"4035e","_k":"b5941dea"},{"t":"`z = 0`","why":"A parallel plane through `(1, -1, 2)` can’t pass through the origin.","_n":"4134e","_k":"29e0c82d"},{"t":"`z = 11`","why":"Divide by 4.","_n":"4233e","_k":"d57d2abd"},{"t":"`z = 2`","why":"That’s the bracket’s height; the shelf is tilted.","_n":"4342e","_k":"1509e7d4"}]}}]},"task":{"title":"Plane to order","summary":"Plane to order","statement":"\u003cp>Design a plane `Ax + By + Cz + D = 0` that meets every condition. There are many answers. How many can you find?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>It passes through `P(1, 2, 3)`.\u003c/li>\u003cli>It’s perpendicular to the plane `x - y + z = 5`.\u003c/li>\u003cli>It isn’t parallel to any coordinate axis.\u003c/li>\u003cli>It meets the `z`-axis above the origin.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">`A`, `B`, `C` are whole numbers from −6 to 6; `D` is a whole number from −20 to 20. The 3D view shows `P`, the given plane (teal) and your plane (blue), with your `z`-intercept marked.\u003c/p>","checks":["Passes through `P(1, 2, 3)`","Perpendicular to `x - y + z = 5`","Not parallel to any axis","Meets the `z`-axis above the origin"],"tips":["Substitute `P`: you need `A + 2B + 3C + D = 0`. Choose `A`, `B`, `C` first, then `D` is forced.","Perpendicular planes have perpendicular normals: `(A, B, C) · (1, -1, 1) = 0`.","A zero coefficient makes the plane parallel to that axis.","The `z`-intercept is `-D/C`. Try flipping the signs of `A`, `B` and `C` together, or choose different coefficients."],"explainPrompt":"Explain how you chose the normal and how you found `D`.","vocab":"Use the words normal, perpendicular, dot product and intercept.","more":"Multiples of one plane count as the same answer. How many different planes can you find?","after3":"Every answer has a normal perpendicular to `(1, -1, 1)`, and `D` is then forced by `P`. Each normal you choose spins the plane about a line through `P`.","labels":{"invalid":"Choose whole numbers: `A`, `B`, `C` from −6 to 6 (not all 0) and `D` from −20 to 20.","eq":"Your plane","atP":"At `P(1, 2, 3)`","dotRow":"`(A, B, C) · (1, -1, 1)`","zRow":"`z`-intercept","none":"none (no `z`-term)","graph":"3D view: P, the given plane (teal) and your plane (blue)"}},"cards":[["Normal vector","A vector perpendicular to the plane."],["Scalar equation","`Ax + By + Cz + D = 0`, with normal `vec{n} = (A, B, C)`."],["Finding `D`","Substitute a point: `D = -(Ax_0 + By_0 + Cz_0)`."],["Vector → scalar","`vec{n} = vec{a} × vec{b}`, then find `D` from `vec{r}_0`."],["Scalar → vector","Let two variables be `s` and `t`, or use three points."],["Multiples","`vec{n}` and `2vec{n}` are both normals; an equation times `k ≠ 0` is the same plane."],["Missing variable","`x + z = 4` is parallel to the `y`-axis."],["`z = 3`","A horizontal plane, parallel to the `xy`-plane."],["Intercepts","Set two variables to 0: `x`-intercept `-D/A`."],["Parallel planes","Normals are parallel (multiples)."],["Perpendicular planes","Normals are perpendicular: `vec{n}_1 · vec{n}_2 = 0`."],["Angle between planes","`cos θ = {|vec{n}_1 · vec{n}_2|}/{|vec{n}_1||vec{n}_2|}`, the acute angle."]]}};</script>
