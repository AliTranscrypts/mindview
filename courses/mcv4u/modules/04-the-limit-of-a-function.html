.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 04: lim typesetting, hero, approach explorer (V6 approach table), challenge 2 box, long-run stations, practice */
/* lim with the approach underneath: the box's baseline is "lim", so it sits on the text baseline */
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.hero-eq .lm-hero .lm-lu{font-size:.5em;font-weight:700;margin-top:.14em;border-bottom:.06em solid currentColor;padding:0 .08em .04em}
.lm-L{display:inline-block;background:var(--hi-soft);border-radius:.16em;padding:0 .18em}
.face .lm-L{background:none;padding:0}
.opt .m,.chip .m,.fchip .m,.read dd .m,.read dt .m,.lm-say .m{white-space:normal}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim,.sq-p .lm-lim,.mitem .lm-lim{margin-bottom:.1em}

/* piecewise caption */
.lm-pw{display:inline-flex;align-items:center;vertical-align:middle;gap:.12em}
.lm-br{font:400 2.3em/1 var(--font-math);transform:scaleX(.7);margin-top:-.08em}
.lm-cases{display:flex;flex-direction:column;gap:.08em;font-size:.78em;line-height:1.15}
.lm-case{display:flex;gap:.9em;align-items:baseline;white-space:nowrap}
.lm-cond{font-size:.82em;color:var(--ink-2)}

/* approach explorer */
.lm-ex .eq-cap{min-height:2.6em;display:flex;align-items:center}
.lm-pline{margin:8px 0 0;font-size:.95rem;min-height:1.5em}
.lm-pline .m{font-size:1.05em}
.lm-tview{margin:4px 0 0}
.lm-sub{margin:0 0 6px}
.lm-sub [hidden]{display:none}
.lm-sub .seg-wrap{margin-top:0}
.lm-sl output{color:var(--ink)}
.lm-asym .seg button .m{font-size:1.05em}
.lm-probe{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.lm-mode .seg-wrap,.lm-zoom .seg-wrap{margin-top:4px}
.lm-locked .lm-probe button,.lm-locked .lm-types .chip{opacity:.6}

/* V6 approach table */
.lm-v6{margin:0}
.lm-v6g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lm-v6s{min-width:0;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
table.lm-v6t{width:100%;border-collapse:collapse;font-family:var(--font-math);font-size:1.05rem}
table.lm-v6t th,table.lm-v6t td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.lm-v6t th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.lm-v6t th .m{font-size:1.15em;color:var(--ink)}
table.lm-v6t tr:last-child td{border-bottom:0}
table.lm-v6t .hl{background:var(--hi-soft)}
.lm-v6h{font-weight:700}
.lm-v6at{margin:10px 0 0;font-size:1rem}
.lm-v6n{margin:6px 0 0}
.lm-v6l{margin:0 0 6px}

/* challenge 2 box */
.lm-tc2{margin-top:18px;border:1.5px dashed var(--ink-2);border-radius:8px;padding:10px 14px 14px;background:var(--paper)}
.lm-tc2 h4{margin:0 0 10px}
.lm-tc2row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 4px;font:400 1.2rem var(--font-math)}
.lm-tc2row input{font-size:1.05rem}
.lm-tc2n{margin:4px 0 0}

/* Part 3 stations */
.lm-st{margin:0 0 6px}
.lm-st .seg-wrap{margin-top:0}
.lm-h{margin:14px 0 10px}
.lm-say{margin:12px 0 10px;font-size:1.02rem}
.lm-zs .seg-wrap{margin:0 0 8px}
.lm-th{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.lm-thumb{display:block;max-width:100%;height:auto}
.lm-thl{font-weight:700;font-size:.9rem}

/* Practice: read the limits, tables and reasoning */
.lm-rd{align-items:start}
.lm-rdnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.lm-rdn{min-width:44px}
.lm-rdn[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.lm-rdn.done{border-color:var(--green)}
.lm-rdc{margin:12px 0}
.lm-rdc .chip{font-size:1rem}
.lm-tq .lm-v6{margin:10px 0 12px}
.lm-tbx{display:flex;flex-wrap:wrap;gap:10px 18px}
.lm-tbx label{display:flex;align-items:center;gap:8px;font:400 1.15rem var(--font-math)}
.lm-tin .numrow{margin-top:4px}

@media (max-width:820px){
  .lm-rdg{max-width:480px;margin:0 auto;width:100%}
}
@media (max-width:560px){
  .lm-v6g{grid-template-columns:minmax(0,1fr);gap:8px}
  .lm-probe{flex-wrap:nowrap;gap:6px}
  .lm-probe .btn{flex:1 1 0;padding-left:.4em;padding-right:.4em;white-space:normal;line-height:1.15}
  .lm-case{gap:.6em}
  .lm-ex .eq-cap{font-size:1.5rem}
}

an>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{4x - 2}/{2x + 5}`?","choices":[{"t":"−2/5","fb":"For huge `x`, the leading terms dominate: `{4x}/{2x} = 2`.","_n":"1c16b","_k":"0b03f02f"},{"t":"0","fb":"For huge `x`, the leading terms dominate: `{4x}/{2x} = 2`.","_n":"1d23b","_k":"0b69a2d8"},{"t":"2","fb":"Right. For huge `x`, the leading terms dominate: `{4x}/{2x} = 2`.","_n":"1e22b","_k":"f6247bbf"},{"t":"4","fb":"For huge `x`, the leading terms dominate: `{4x}/{2x} = 2`.","_n":"1f21b","_k":"d682fed8"}]},{"id":"q4","goal":5,"prompt":"`g(x) = {2x^2 + x}/{x^2 + 1}` crosses `y = 2` at `x = 2`. Is `y = 2` still its horizontal asymptote?","choices":[{"t":"Only for `x \u003c 2`","fb":"Crossing at a finite `x` is allowed.","_n":"1g20b","_k":"bbdcd2b4"},{"t":"No: the limit is 1","fb":"Crossing at a finite `x` is allowed.","_n":"1h1fb","_k":"d9425aa8"},{"t":"No: asymptotes are never crossed","fb":"Crossing at a finite `x` is allowed.","_n":"1i1eb","_k":"1d45c57e"},{"t":"Yes: an asymptote describes the long run","fb":"Right. Crossing at a finite `x` is allowed.","_n":"1j1db","_k":"47c49327"}]}]}},"practice":{"activities":[{"id":"read","type":"custom","title":"Read the limits","summary":"Read the limits","goal":[1,2,4],"instruction":"Read each limit or value from the graph. Tap a chip to answer.","how":"Tap an item number to move between items. Every item uses the same chips.","chips":[{"id":"m1","t":"−1"},{"id":"p1","t":"1"},{"id":"p2","t":"2"},{"id":"p3","t":"3"},{"id":"up","t":"grows without bound"},{"id":"dn","t":"decreases without bound"},{"id":"dne","t":"does not exist"}],"wrongDefault":"Follow the graph toward `x = a` from the side asked. Try another chip.","items":[{"id":"L1","goal":[2,4],"ask":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`","_a":"QxRTEQ==","why":"Both sides head to the open circle at (0, 1); the filled dot doesn’t matter.","wrong":{"m1":"That’s `f(0)`, the filled dot."},"hints":["Ignore the dot at `x = 0`.","Where are both sides heading?","1."]},{"id":"L2","goal":2,"ask":"`f(0)`","_a":"QwlTEQ==","why":"The value is the filled dot, (0, −1).","wrong":{"p1":"The value is the filled dot, −1."}},{"id":"L3","goal":[1,2],"ask":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2^{-}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`","_a":"QxRREQ==","why":"From the left, the curve heads to the open circle at (2, 3).","wrong":{"p1":"`2^{-}` means from the left."}},{"id":"L4","goal":[1,2],"ask":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2^{+}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`","_a":"QxRTEQ==","why":"From the right, the curve starts at the filled dot (2, 1).","wrong":{"p3":"`2^{-}` means from the left; `2^{+}` means from the right."}},{"id":"L5","goal":[2,4],"ask":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`","_a":"QwAMVkE=","why":"The left side heads to 3 and the right side to 1: they disagree.","wrong":{"p3":"The sides disagree.","p1":"The sides disagree."}},{"id":"L6","goal":[1,2],"ask":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -2^{+}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`","_a":"QxESEQ==","why":"Just to the right of the asymptote `x = -2`, the curve shoots upward."},{"id":"L7","goal":[2,4],"ask":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`","_a":"QwAMVkE=","why":"From the left it decreases without bound and from the right it grows without bound: no limit.","wrong":{"up":"From the left it decreases without bound, so the sides disagree."},"hints":["Check each side of `x = -2` separately.","Left: decreases without bound. Right: grows without bound.","They don’t match: no limit."]},{"id":"L8","goal":2,"ask":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 4`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`","_a":"QxRQEQ==","why":"The curve passes smoothly through (4, 2), so both sides head to 2."}]},{"id":"tables","type":"custom","title":"Tables and reasoning","summary":"Tables and reasoning","star":true,"goal":[3,4,5],"instruction":"The tool computes each table. Use the tables and your reasoning to find each answer, then press Check.","how":"Type a number such as 4, 0.5 or 1/2. If you think a limit doesn’t exist or is undefined, type that in words.","items":[{"id":"T1","goal":[3,4],"prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 - 4}/{x - 2}`","table":{"fn":"t1","a":2},"_a":"VQ==","why":"Both sides head to 4: `{(x - 2)(x + 2)}/{x - 2} = x + 2` for `x ≠ 2`.","wrong":[{"word":"undef","fb":"Both sides head to 4."}]},{"id":"T2","goal":3,"prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√x - 1}/{x - 1}`","table":{"fn":"t2","a":1,"steps":[0.1,0.01]},"_a":"UUpX","why":"The left column falls toward 0.5 and the right column rises toward 0.5.","wrong":[{"match":[0.5132,0.5013,0.4881,0.4988],"fb":"That’s one entry."}]},{"id":"T3","goal":3,"star":true,"prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{2^x - 1}/{x}`, to 3 decimal places","table":{"fn":"t3","a":0},"_a":"UUpUClA=","dp":3,"why":"The closest values from both sides, 0.6929 and 0.6934, both round to 0.693.","wrong":[{"match":[0.7],"fb":"Use the closest values from both sides."}]},{"id":"T4","goal":5,"star":true,"prompt":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`n → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `(1 + {1}/{n})^n`, to 2 decimal places","table":{"fn":"t4","inf":true},"_a":"U0pVAQ==","dp":2,"why":"Reading down the table, the values settle near 2.718…, which is 2.72 to 2 decimal places.","wrong":[{"match":[1],"fb":"`1 + {1}/{n} → 1`, but the power `n` grows too; trust the table."}],"hints":["Read down the table.","2.7169, 2.7181, …","About 2.72. (You’ll meet this number, `e`, in module 25.)"]},{"id":"T5","goal":4,"star":true,"prompt":"`f(x) = x^2 - k` for `x \u003c 3` and `kx + 1` for `x > 3`. Find `k` so \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)` exists.","boxes":[{"id":"k","label":"`k =`"}],"_a":"GkYJEVkASw==","why":"The left side heads to `9 - k` and the right side to `3k + 1`. `9 - k = 3k + 1` gives `4k = 8`, so `k = 2` (both sides head to 7).","wrong":[{"k":4,"fb":"`9 - k = 3k + 1` gives `4k = 8`."}]},{"id":"T6","goal":4,"star":true,"prompt":"`f(x) = {x^2 + ax - 6}/{x - 2}`. Find `a` so \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)` exists, then find the limit.","boxes":[{"id":"a","label":"`a =`"},{"id":"L","label":"limit ="}],"_a":"GkYDEVkDGhYtRlgGHg==","why":"`a = 1` makes the numerator 0 at `x = 2`; then `{(x + 3)(x - 2)}/{x - 2} = x + 3` for `x ≠ 2`, so the limit is 5.","wrong":[{"a":3,"fb":"For a finite limit the numerator must be 0 at `x = 2`: `4 + 2a - 6 = 0`."}],"hints":["If the numerator isn’t 0 at `x = 2`, the values grow without bound.","`4 + 2a - 6 = 0` gives `a = 1`.","`x^2 + x - 6 = (x + 3)(x - 2)`, so the limit is 2 + 3 = 5."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Deepa","how":"","goal":[3,4],"instruction":"Deepa made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Find \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`, where `f(x) = 2x + 1` for `x \u003c 3`, `f(3) = 10`, and `f(x) = x^2 - 2` for `x > 3`.","steps":["From the left: 2(3) + 1 = 7.","From the right: 9 − 2 = 7.","`f(3) = 10`, which doesn’t match 7.","So the limit does not exist."],"_a":"Ug==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is a true statement.",""],"fixes":[{"t":"Step 4 is correct.","why":"The limit ignores the value at `x = 3`.","_n":"1k1cb","_k":"66962b16"},{"t":"Both one-sided limits are 7, so the limit is 7; `f(3) = 10` doesn’t affect it.","why":"The limit ignores the value at `x = 3`.","_n":"1l1bb","_k":"73ce0e7b"},{"t":"The limit is 8.5.","why":"The limit ignores the value at `x = 3`.","_n":"1m1ab","_k":"a236b946"},{"t":"The limit is 10.","why":"The limit ignores the value at `x = 3`.","_n":"1n09b","_k":"e480001a"}],"hints":["What decides whether a limit exists?","Only the two one-sided limits.","Both are 7."]},{"id":"e2","goal":3,"task":"Find \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 - 1}/{x - 1}` from a table.","steps":["`x = 0.9` gives 1.9; `x = 0.99` gives 1.99.","`x = 1.1` gives 2.1; `x = 1.01` gives 2.01.","At `x = 1` the expression is 0/0.","So the limit does not exist."],"_a":"Ug==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is true.",""],"fixes":[{"t":"Step 4 is correct.","why":"Undefined at `a` doesn’t stop a limit.","_n":"1o0ab","_k":"a8cf5bd7"},{"t":"The limit is 1.99.","why":"Undefined at `a` doesn’t stop a limit.","_n":"1p07b","_k":"cab9bb2a"},{"t":"The limit is 0.","why":"Undefined at `a` doesn’t stop a limit.","_n":"1q08b","_k":"f374c45c"},{"t":"Both sides approach 2, so the limit is 2, even though the expression is undefined at 1.","why":"Undefined at `a` doesn’t stop a limit.","_n":"1r0db","_k":"ffdf0ae4"}],"hints":["Where are both columns heading?","1.9, 1.99 and 2.1, 2.01.","2."]},{"id":"e3","goal":4,"task":"Find \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{1}/{x - 2}`.","steps":["`x = 2.1` gives 10; `x = 2.01` gives 100.","`x = 1.9` gives −10; `x = 1.99` gives −100.","From the right the values grow without bound; from the left they decrease without bound.","The two sides cancel, so the limit is 0."],"_a":"Ug==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"The sides are unbounded in opposite directions, so the limit does not exist.","why":"Values near `x = 2` are huge, not near 0.","_n":"1s0eb","_k":"2ecf46ec"},{"t":"The limit is 2.","why":"Values near `x = 2` are huge, not near 0.","_n":"1t0bb","_k":"5262cee7"},{"t":"Step 4 is correct.","why":"Values near `x = 2` are huge, not near 0.","_n":"1u0cb","_k":"19748a8f"},{"t":"The limit grows without bound.","why":"Values near `x = 2` are huge, not near 0.","_n":"1v11b","_k":"f8f89e89"}],"hints":["Are the values near 0?","No: they’re ±100 and beyond.","No limit."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the approach explorer: a limit existing at a hole, or not existing at a jump?"},{"id":"j2","q":"In your own words, what’s the difference between \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → a`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)` and `f(a)`?"},{"id":"j3","q":"Explain to a friend how to estimate a limit from a table of values."},{"id":"j4","q":"Which case still confuses you (moved point, jump, asymptote, long run)? What will you try?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What does \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 4^{-}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 7` mean?","options":[{"t":"`f(x)` is less than 7 near `x = 4`.","why":"The minus sign is about `x`, not `f(x)`.","_n":"1w12b","_k":"9c60327f"},{"t":"As `x` approaches 4 through values less than 4, `f(x)` approaches 7.","why":"The minus sign means from values less than 4, on the left.","_n":"1x8fb","_k":"31d0eb24"},{"t":"`f(4) = 7`.","why":"The limit is where the graph is heading as `x` approaches `4`. The dot at `x = 4` doesn’t affect it.","_n":"1y8eb","_k":"384a4f6d"},{"t":"As `x` approaches 4 through values greater than 4, `f(x)` approaches 7.","why":"The minus sign means from values \u003cstrong>less\u003c/strong> than 4, on the left.","_n":"1z91b","_k":"24f25165"}]},"b":{"prompt":"What does \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -1^{+}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `g(x) = 2` mean?","options":[{"t":"As `x` approaches −1 through values less than −1, `g(x)` approaches 2.","why":"The plus sign means from values \u003cstrong>greater\u003c/strong> than −1, on the right.","_n":"2090b","_k":"fed744fb"},{"t":"`g(-1) = 2`.","why":"The limit is where the graph is heading as `x` approaches `-1`. The dot at `x = -1` doesn’t affect it.","_n":"218bb","_k":"b4756327"},{"t":"As `x` approaches −1 through values greater than −1, `g(x)` approaches 2.","why":"The plus sign means from values greater than −1, on the right.","_n":"228ab","_k":"98a3a0fc"},{"t":"`g(x)` is greater than 2 near `x = -1`.","why":"The plus sign is about `x`, not `g(x)`.","_n":"238db","_k":"30dfca43"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A graph is one unbroken curve except at `x = 3`, where it has an open circle at (3, 5) and a filled dot at (3, 1). What is \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`?","options":[{"t":"5","why":"Both sides head to the open circle’s height.","_n":"248cb","_k":"91465968"},{"t":"It doesn’t exist","why":"The sides agree, so it exists.","_n":"2597b","_k":"a2ed61a5"},{"t":"3","why":"That’s the `x`-value.","_n":"2696b","_k":"64e7147f"},{"t":"1","why":"That’s `f(3)`. The limit is where the graph is heading as `x` approaches `3`. The dot at `x = 3` doesn’t affect it.","_n":"2795c","_k":"e6f3be5e"}]},"b":{"prompt":"Open circle at (−2, 4), filled dot at (−2, 0). What is \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`?","options":[{"t":"0","why":"That’s `f(-2)`. The limit is where the graph is heading as `x` approaches `-2`. The dot at `x = -2` doesn’t affect it.","_n":"2896c","_k":"1f2393d2"},{"t":"It doesn’t exist","why":"The sides agree, so it exists.","_n":"2997c","_k":"4347f696"},{"t":"−2","why":"That’s the `x`-value.","_n":"2a98c","_k":"fc5f10e5"},{"t":"4","why":"Both sides head to the open circle’s height.","_n":"2b99c","_k":"8d7cfeb8"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"`x`: 1.9, 1.99, 1.999 give `f(x)`: 4.61, 4.9601, 4.996. `x`: 2.1, 2.01, 2.001 give 5.41, 5.0401, 5.004. What is the best estimate of \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`?","options":[{"t":"5","why":"Both sides close in on 5.","_n":"2c9ac","_k":"7f107609"},{"t":"4.996","why":"One entry. Check both sides and look at where the values are heading, not at one entry.","_n":"2d9bc","_k":"dacd4d82"},{"t":"It doesn’t exist, since no entry equals 5.","why":"A limit doesn’t need to be reached.","_n":"2e9cc","_k":"adcb543e"},{"t":"5.004","why":"One entry. Check both sides and look at where the values are heading, not at one entry.","_n":"2f8dc","_k":"8fb93e25"}]},"b":{"prompt":"`x`: 2.9, 2.99, 2.999 give 6.41, 6.9401, 6.994. `x`: 3.1, 3.01, 3.001 give 7.61, 7.0601, 7.006. Best estimate of \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`?","options":[{"t":"7.006","why":"One entry. Check both sides and look at where the values are heading, not at one entry.","_n":"2g8ec","_k":"76ac365d"},{"t":"6.994","why":"One entry. Check both sides and look at where the values are heading, not at one entry.","_n":"2h9bc","_k":"b8ddf28e"},{"t":"7","why":"Both sides close in on 7.","_n":"2i9ac","_k":"9eeba6b7"},{"t":"It doesn’t exist","why":"A limit doesn’t need to be reached: both sides close in on 7.","_n":"2j99c","_k":"811222e3"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"`f(x) = {x^2 + 2x - 15}/{x - 3}`. What is \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`, and is `f(3)` defined?","options":[{"t":"The limit is 0 and `f(3) = 0`.","why":"0/0 isn’t 0.","_n":"2k98c","_k":"58749cdf"},{"t":"The limit is 8; `f(3)` is undefined.","why":"`{(x + 5)(x - 3)}/{x - 3} = x + 5` for `x ≠ 3`.","_n":"2l9fc","_k":"21004db9"},{"t":"The limit is 8 and `f(3) = 8`.","why":"`f(3)` is 0/0: undefined.","_n":"2m9ec","_k":"98a44854"},{"t":"Both are undefined.","why":"A hole doesn’t stop the approach. Both sides head to 8, so the limit is 8, even though `f(3)` is undefined.","_n":"2n9dc","_k":"fec230d2"}]},"b":{"prompt":"`f(x) = {x^2 - x - 12}/{x - 4}`. What is \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 4`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)`, and is `f(4)` defined?","options":[{"t":"Both are undefined.","why":"A hole doesn’t stop the approach. Both sides head to 7, so the limit is 7, even though `f(4)` is undefined.","_n":"2o9cc","_k":"e24be074"},{"t":"The limit is 0 and `f(4) = 0`.","why":"0/0 isn’t 0.","_n":"2p93c","_k":"422cacbf"},{"t":"The limit is 7; `f(4)` is undefined.","why":"`{(x + 3)(x - 4)}/{x - 4} = x + 3` for `x ≠ 4`.","_n":"2q92c","_k":"a3994578"},{"t":"The limit is 7 and `f(4) = 7`.","why":"`f(4)` is 0/0: undefined.","_n":"2rce6","_k":"66251fea"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"`f(x) = x + 2` for `x \u003c 1` and `f(x) = 5 - 2x` for `x ≥ 1`. Which is true?","options":[{"t":"The limit is 3, but `f(1) = 5`.","why":"`f(1) = 5 - 2 = 3`.","_n":"2scd6","_k":"25db7832"},{"t":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 3`","why":"Left: 3. Right: 5 − 2 = 3.","_n":"2td06","_k":"2e8f348f"},{"t":"Left 3, right 5, so there’s no limit.","why":"The right side is 5 − 2(1) = 3.","_n":"2ucf6","_k":"33f5d9b2"},{"t":"The limit doesn’t exist because the formula changes at 1.","why":"Changing formulas is fine if the sides agree.","_n":"2vd26","_k":"56c98ee4"}]},"b":{"prompt":"`f(x) = x^2` for `x \u003c 2` and `f(x) = 8 - 2x` for `x ≥ 2`. Which is true?","options":[{"t":"Left 4, right 8, so there’s no limit.","why":"The right side is 8 − 2(2) = 4.","_n":"2wd16","_k":"61d2ce1e"},{"t":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 4`","why":"Left: 4. Right: 8 − 4 = 4.","_n":"2xd46","_k":"99f882e7"},{"t":"The limit doesn’t exist because the formula changes at 2.","why":"Changing formulas is fine if the sides agree.","_n":"2yd36","_k":"3f72d06a"},{"t":"The limit is 4, but `f(2) = 8`.","why":"`f(2) = 8 - 4 = 4`.","_n":"2zc66","_k":"ab9c110d"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"`t_n = {5n - 2}/{n + 1}`. What is \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`n → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `t_n`?","options":[{"t":"It grows without bound.","why":"Top and bottom grow at the same rate.","_n":"30c56","_k":"e9d643eb"},{"t":"0","why":"The terms approach 5, not 0.","_n":"31c85","_k":"2ba1d502"},{"t":"−2","why":"That’s the ratio of the constants.","_n":"32c95","_k":"7cc65720"},{"t":"5","why":"For huge `n`, `{5n - 2}/{n + 1} ≈ {5n}/{n}`.","_n":"33c65","_k":"d7481f65"}]},"b":{"prompt":"`t_n = {3n + 7}/{2n}`. What is \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`n → ∞`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `t_n`?","options":[{"t":"5","why":"That’s the first term, `t_1 = 10/2`.","_n":"34c75","_k":"eb7de4bc"},{"t":"0","why":"The terms approach 3/2, not 0.","_n":"35c45","_k":"d43fc05a"},{"t":"3/2","why":"For huge `n`, `{3n + 7}/{2n} ≈ {3n}/{2n} = {3}/{2}`.","_n":"36c55","_k":"d1356dc3"},{"t":"It grows without bound.","why":"Top and bottom grow at the same rate.","_n":"37c25","_k":"28b05a9a"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"`f` has a jump at `x = 2`: the left-hand limit is 1 and the right-hand limit is 4. Which is the best explanation of why \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)` doesn’t exist?","options":[{"t":"“A two-sided limit exists only when both one-sided limits exist and are equal. Here they are 1 and 4.”","why":"The left side heads to 1 and the right side to 4. They disagree, so the two-sided limit doesn’t exist.","_n":"38c35","_k":"db45ddc7"},{"t":"“Because limits never exist where a formula changes.”","why":"They do when the sides agree.","_n":"39d05","_k":"9c4a1c2b"},{"t":"“Because the limit would be the average, 2.5, which isn’t on the graph.”","why":"A limit is never an average of the two sides. The left side heads to 1 and the right side to 4: they disagree, so the two-sided limit doesn’t exist.","_n":"3ad15","_k":"ff8c53b6"},{"t":"“Because `f(2)` is undefined.”","why":"The value at 2 doesn’t matter.","_n":"3b425","_k":"5e56048e"}]},"b":{"prompt":"Left-hand limit −2, right-hand limit 3 at `x = 5`. Best explanation of why the limit doesn’t exist?","options":[{"t":"“Because the average, 0.5, isn’t on the graph.”","why":"A limit is never an average of the two sides. The left side heads to −2 and the right side to 3: they disagree, so the two-sided limit doesn’t exist.","_n":"3c415","_k":"234382d8"},{"t":"“Because limits never exist where a formula changes.”","why":"They do when the sides agree.","_n":"3d405","_k":"fff12ca2"},{"t":"“Because `f(5)` is undefined.”","why":"The value at 5 doesn’t matter.","_n":"3e3f5","_k":"8a29cde4"},{"t":"“The one-sided limits, −2 and 3, aren’t equal.”","why":"A two-sided limit exists only when both one-sided limits exist and are equal.","_n":"3f465","_k":"e9596f71"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which statement correctly describes `y = {1}/{(x - 5)^2}` near `x = 5`?","options":[{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 5`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `y = 5`.”","why":"That’s the `x`-value.","_n":"3g455","_k":"1507c278"},{"t":"“`y` decreases without bound from the left and grows without bound from the right.”","why":"Squaring makes both sides positive.","_n":"3h445","_k":"0eefc8aa"},{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 5`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `y = 0`.”","why":"The values grow without bound, so there’s no number to approach. The limit does not exist.","_n":"3i435","_k":"4e8bbf98"},{"t":"“As `x → 5` from either side, `y` grows without bound, so \u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 5`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `y` does not exist.”","why":"Squaring makes both sides positive, and the values grow without bound, so there’s no number to approach.","_n":"3j4a5","_k":"9eb03c02"}]},"b":{"prompt":"Which statement correctly describes `y = -{1}/{(x + 1)^2}` near `x = -1`?","options":[{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `y = -1`.”","why":"That’s the `x`-value.","_n":"3k495","_k":"3503e7b8"},{"t":"“As `x → -1` from either side, `y` decreases without bound, so the limit doesn’t exist.”","why":"Squaring makes both sides positive, so `y` is negative on both sides and decreases without bound: there’s no number to approach.","_n":"3l3c5","_k":"230252c3"},{"t":"“\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → -1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `y = 0`.”","why":"The values decrease without bound, so there’s no number to approach. The limit does not exist.","_n":"3m3d5","_k":"5ea1a042"},{"t":"“`y` grows without bound from the left and decreases from the right.”","why":"Squaring makes both sides the same sign, so both sides decrease without bound.","_n":"3n3e5","_k":"afa57f98"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A drug’s concentration in the blood is `C(t) = {20t}/{t + 4}` mg/L after `t` hours. What happens in the long run?","options":[{"t":"It approaches 20 mg/L.","why":"For huge `t`, `{20t}/{t + 4} ≈ 20`.","_n":"3o3f5","_k":"a237fdc1"},{"t":"It grows without bound.","why":"Top and bottom grow at the same rate.","_n":"3p405","_k":"d9b047ee"},{"t":"It approaches 5 mg/L.","why":"20/4 is a ratio of the wrong numbers.","_n":"3q415","_k":"e6434156"},{"t":"It approaches 0 mg/L.","why":"The numerator grows too.","_n":"3r425","_k":"c85d489e"}]},"b":{"prompt":"`C(t) = {30t}/{t + 6}` mg/L. What happens in the long run?","options":[{"t":"It approaches 0 mg/L.","why":"The numerator grows too.","_n":"3s435","_k":"100519ae"},{"t":"It approaches 5 mg/L.","why":"30/6 is a ratio of the wrong numbers.","_n":"3t445","_k":"9f8f74de"},{"t":"It grows without bound.","why":"Top and bottom grow at the same rate.","_n":"3u455","_k":"ac226e46"},{"t":"It approaches 30 mg/L.","why":"For huge `t`, `{30t}/{t + 6} ≈ 30`.","_n":"3v466","_k":"1964fb18"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A ball’s average velocity over `[2, 2 + h]` is `15 - 5h` m/s, for `h ≠ 0`. What is its instantaneous velocity at `t = 2`?","options":[{"t":"Undefined, because `h ≠ 0`.","why":"The limit never needs `h = 0` itself.","_n":"3w456","_k":"f62aa6d9"},{"t":"15 m/s","why":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `(15 - 5h) = 15`.","_n":"3x486","_k":"1f2dee98"},{"t":"0 m/s","why":"`15 - 5h` approaches 15.","_n":"3y476","_k":"1ed3604d"},{"t":"10 m/s","why":"That uses `h = 1`, one secant.","_n":"3z426","_k":"9ac82a33"}]},"b":{"prompt":"Average velocity over `[3, 3 + h]` is `-10 - 5h` m/s. Instantaneous velocity at `t = 3`?","options":[{"t":"0 m/s","why":"`-10 - 5h` approaches −10.","_n":"40416","_k":"4f7d3f97"},{"t":"−15 m/s","why":"That uses `h = 1`, one secant.","_n":"41446","_k":"c4a4c65b"},{"t":"Undefined, because `h ≠ 0`.","why":"The limit never needs `h = 0` itself.","_n":"42436","_k":"2f3ef19f"},{"t":"−10 m/s","why":"\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`h → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `(-10 - 5h) = -10`.","_n":"434e6","_k":"a790cf3f"}]}}]},"task":{"title":"Build a limit puzzle","summary":"Build a limit puzzle","statement":"\u003cp>`f(x) = mx + b` for `x \u003c 2`, `f(2) = 5`, and `f(x) = x^2 + c` for `x > 2`. Choose `m`, `b` and `c` to meet every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)` exists.\u003c/li>\u003cli>That limit is strictly between 0 and 3.\u003c/li>\u003cli>The left piece is decreasing.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers from −5 to 5 for `m`, `b` and `c`. The graph shows both pieces with their open circles at `x = 2`, the filled dot at (2, 5), and the readout gives both one-sided limits.\u003c/p>","checks":["The limit at 2 exists","`0 \u003c` limit `\u003c 3`","Left piece decreasing"],"tips":["The left side heads to `2m + b`; the right side to `4 + c`. Make them equal.","The right side’s limit is `4 + c`, so `c` must be −3 or −2.","A decreasing line has a negative slope."],"explainPrompt":"Explain why the limit at `x = 2` can be 1 even though `f(2) = 5`.","vocab":"Use the words left-hand limit, right-hand limit, exists and value.","success":"Your puzzle works!","more":"There’s more than one answer. Can you find them all?","after3":"Each one has a limit (1 or 2) that differs from `f(2) = 5`: a moved point. `m = -2` with `c = -2` would need `b = 6`, outside the range."},"cards":[["\u003cspan class=\"lm-lim\">\u003cspan class=\"lm-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"lm-lu\">`x → a`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = L`","As `x` gets close to `a` (not equal to `a`), `f(x)` gets close to `L`."],["`x → a^{-}`","From the left: values less than `a`."],["`x → a^{+}`","From the right: values greater than `a`."],["When a limit exists","Both one-sided limits exist and are equal."],["Hole","The limit can exist even though `f(a)` is undefined."],["Moved point","The limit can differ from `f(a)`."],["Jump","The one-sided limits differ, so there’s no limit."],["Vertical asymptote","The values grow (or decrease) without bound, so there’s no limit."],["Estimatin
