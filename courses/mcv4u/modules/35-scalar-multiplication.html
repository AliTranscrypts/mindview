.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 35: hero track, Stretch dial (V3 vector board), Vectors in geometry stations, Express it figure, Undo the stretch task */
.smv-heq2{display:block;margin-top:.3em;font-size:.82em}
.smv-hero canvas.plot{aspect-ratio:16/9}
.smv-ex{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.smv-main,.smv-side{min-width:0}
canvas.plot.smv-board{aspect-ratio:1/1;touch-action:none}
canvas.plot.smv-geo{aspect-ratio:1/1;touch-action:none}
.smv-key{margin:8px 0 0}
.smv-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.smv-h{font-weight:700;min-width:3.6rem}
.smv-note{margin:4px 0 8px}
.smv-sl{margin-top:6px}
.smv-sl input{width:100%;min-height:28px}
.smv-sl output{font-weight:700}
.smv-kv{font-weight:700}
.smv-w p{margin:6px 0 0}
.smv-step{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 8px}
.smv-sh{font-weight:700;min-width:4.6rem}
.smv-Lo{min-width:2.2rem;text-align:center;font-weight:700;font-size:1.05rem}
.smv-ub{margin:6px 0 4px}
.smv-side dl.read.smv-read{margin-top:14px}
/* Part 3 */
.smv-st h3{margin-top:0}
.smv-st:first-child{margin-top:0;padding-top:0;border-top:0}
.smv-stg{align-items:start}
.smv-gnote{margin:6px 0 0}
.smv-ph{font-weight:700;margin:14px 0 6px}
.smv-alg{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.smv-alg li{padding:5px 10px;border-left:4px solid var(--rule);border-radius:0 8px 8px 0;font-size:1.04rem;overflow-x:auto;max-width:100%}
.smv-alg li.cur{border-left-color:var(--hi);background:var(--info-bg)}
.smv-mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;width:100%}
/* Express it */
.smv-fig{margin:6px 0 14px}
.smv-tri{display:block;width:100%;max-width:420px;height:auto;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px}
.smv-fl{stroke:var(--ink-2);stroke-width:1.8}
.smv-fm{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:5 5}
.smv-fva{stroke:var(--pen);stroke-width:3;marker-end:url(#smv-ha)}
.smv-fvb{stroke:var(--f3);stroke-width:3;marker-end:url(#smv-hb)}
.smv-fa{fill:var(--pen)}
.smv-fb{fill:var(--f3)}
.smv-fd{fill:var(--ink)}
.smv-ft{fill:var(--ink);font:italic 600 15px var(--font-math)}
.smv-fta{fill:var(--pen);font-size:17px}
.smv-ftb{fill:var(--f3);font-size:17px}
.smv-frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.1rem;margin:4px 0 8px}
.smv-frame .numin.short{width:4.2rem}
.smv-fl2{white-space:nowrap}
/* task */
.smv-tst label{min-width:8.5rem}
@media (max-width:760px){
  .smv-ex{grid-template-columns:minmax(0,1fr)}
}

ise 2","_n":"100b1","_k":"46791e6a"},{"t":"run −2, rise 1","_n":"11161","_k":"85b091ec"},{"t":"run −1, rise 3","_n":"12151","_k":"d3fd4e4f"},{"t":"run 5, rise 5","_n":"13040","_k":"b47565b0"}],"explain":"(2, 4) − (3, 1) = (−1, 3). Run −4, rise 2 is `2(vec{u} - vec{v})`, which doubles `vec{v}` too."}],"chalIntro":"Set up the stretch dial, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Stretch: `vec{u}` = run 2, rise −1. Set `k` so that `k vec{u}` has magnitude `3√5` and points opposite to `vec{u}`.","why":"`|vec{u}| = √5`, so `|k| = 3`; opposite means `k = -3`, and `-3vec{u}` = run −6, rise 3.","hints":["`|vec{u}| = √5`.","`|k| × √5 = 3√5`, so `|k| = 3`.","Opposite: `k = -3`."],"msgs":{"setU":"Set `vec{u}` to run 2, rise −1 first: drag its tip.","locked":"Hide `vec{w}` first, so that `k` can move.","k3":"Right length, wrong way.","k15":"Length `1.5√5`; you need twice that.","general":"Not yet: `|k vec{u}|` must be `3√5`, and `k vec{u}` must point opposite to `vec{u}`."}},{"id":"tc2","goal":4,"prompt":"Unit mode: `vec{u}` = run 3, rise −4. Use the buttons and `L` to build a vector of length 10 in the direction of `vec{u}`, then set `k` in Stretch mode to match it.","why":"`vec{u}/5` = run 3/5, rise −4/5; times 10 gives run 6, rise −8, which is `2vec{u}`. So `k = 2`.","hints":["Unit vector first: divide by 5.","(3/5, −4/5) × 10.","(6, −8) = `2vec{u}`, so `k = 2`."],"msgs":{"setU":"Set `vec{u}` to run 3, rise −4 first: drag its tip.","mulFirst":"Length 50. Divide by `|vec{u}| = 5` first.","build":"Not yet: build the vector of length 10 in Unit mode first.","k10":"Divide by the magnitude first to get length 1; then multiply by the length you want.","kneg":"Opposite direction.","kset":"Your vector of length 10 is ready. Now set `k` in Stretch mode so that `k vec{u}` matches it."}},{"id":"tc3","goal":3,"stretch":true,"prompt":"Stretch mode, with `k` locked at 1: the fixed vector }`","wrong":[{"a":0.5,"b":0.5,"fb":"That’s M. G is ⅔ of the way from O to M."}],"why":"`vec{OG} = ⅔vec{OM} = ⅔(½vec{a} + ½vec{b})`.","hints":["G lies on the median from O to M.","`vec{OG} = ⅔vec{OM}`.","`⅔(½vec{a} + ½vec{b}) = ⅓vec{a} + ⅓vec{b}`."]},{"id":"x6","goal":5,"star":true,"v":"`vec{OQ}`, where Q lies on AB with AQ:QB = 3:1","_a":"ThNZFQoEFwMAHRpVEg4JHwIERQ==","display":"`vec{OQ} = ¼vec{a} + ¾vec{b}`","wrong":[{"a":0.75,"b":0.25,"fb":"Closer to B, so more `vec{b}`: `vec{a} + ¾(vec{b} - vec{a})`."}],"why":"`vec{OQ} = vec{a} + ¾(vec{b} - vec{a}) = ¼vec{a} + ¾vec{b}`.","hints":["`vec{OQ} = vec{OA} + vec{AQ}`.","`vec{AQ} = ¾vec{AB} = ¾(vec{b} - vec{a})`.","`vec{a} - ¾vec{a} + ¾vec{b} = ¼vec{a} + ¾vec{b}`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Iris","how":"","goal":[4,5,6],"instruction":"Iris made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"`vec{u}` = run 6, rise −8. Find a vector of length 15 pointing opposite to `vec{u}`.","steps":["`|vec{u}| = √(36 + 64) = 10`.","Unit vector: `vec{u}/10` = run 3/5, rise −4/5.","Length 15: 15 × (3/5, −4/5) = run 9, rise −12.","So the answer is run 9, rise −12."],"_a":"Bw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 copies step 3."],"fixes":[{"t":"Opposite: −15 × (3/5, −4/5) = run −9, rise 12.","why":"Opposite to `vec{u}` needs a negative scalar: −15 times the unit vector.","_n":"1k0b0","_k":"6f042b91"},{"t":"`15 × vec{u}` = run 90, rise −120.","why":"Divide by the magnitude first to get length 1; then multiply by the length you want.","_n":"1l120","_k":"0e296162"},{"t":"`-15 × vec{u}` = run −90, rise 120.","why":"Divide by the magnitude first to get length 1; then multiply by the length you want.","_n":"1m110","_k":"fc6e4ec4"},{"t":"Step 3 is correct.","why":"Run 9, rise −12 points the same way as `vec{u}`.","_n":"1n100","_k":"4a7903b6"}],"hints":["Which way should the answer point?","Opposite to `vec{u}`: use a negative scalar.","−15 × the unit vector."]},{"id":"e2","goal":5,"task":"`vec{OA} = vec{a}`, `vec{OB} = vec{b}`. P lies on AB with AP:PB = 2:3. Find `vec{OP}`.","steps":["`vec{AB} = vec{b} - vec{a}`.","`vec{AP} = ⅔vec{AB}`.","`vec{OP} = vec{a} + ⅔(vec{b} - vec{a})`.","`= ⅓vec{a} + ⅔vec{b}`."],"_a":"BA==","stepFb":["Step 1 is correct.","","Step 3 uses step 2 correctly.","The algebra in step 4 is right."],"fixes":[{"t":"`vec{AP} = ⅗vec{AB}`.","why":"That’s AP:PB = 3:2.","_n":"1o110","_k":"54febeda"},{"t":"`vec{AP} = ⅖vec{AB}`, so `vec{OP} = ⅗vec{a} + ⅖vec{b}`.","why":"AP:PB = 2:3 cuts `vec{AB}` into 5 equal parts; `vec{AP}` takes 2 of them: ⅖`vec{AB}`.","_n":"1p0e0","_k":"10ec6c9d"},{"t":"Step 2 is correct.","why":"2:3 means 5 equal parts in all. AP:PB = 2:3 cuts `vec{AB}` into 5 equal parts; `vec{AP}` takes 2 of them: ⅖`vec{AB}`.","_n":"1q0f0","_k":"93762a50"},{"t":"`vec{AP} = 2vec{AB}`.","why":"AP is part of AB.","_n":"1r0c0","_k":"0c671b7e"}],"hints":["How many equal parts does AB have?","2 + 3 = 5.","⅖`vec{AB}`."]},{"id":"e3","goal":6,"task":"M and N are the midpoints of AB and AC. Show that `vec{MN}` is parallel to `vec{BC}` and half as long.","steps":["`vec{AM} = ½vec{AB}` and `vec{AN} = ½vec{AC}`.","`vec{MN} = vec{AM} - vec{AN}`.","`= ½vec{AB} - ½vec{AC} = ½vec{CB}`.","So `vec{MN}` is half of `vec{CB}`, so parallel to `vec{BC}`."],"_a":"BA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2.","The conclusion follows, but the vector equation behind it is reversed."],"fixes":[{"t":"`vec{MN} = vec{AM} + vec{AN}`.","why":"That’s twice the median to the midpoint of BC.","_n":"1s0d0","_k":"e077d7a0"},{"t":"`vec{MN} = vec{BC}`.","why":"It’s half.","_n":"1t0a0","_k":"bdb2eb2a"},{"t":"`vec{MN} = vec{AN} - vec{AM} = ½(vec{AC} - vec{AB}) = ½vec{BC}`.","why":"`vec{MN}` goes from M to N: `vec{AN} - vec{AM}` (end minus start).","_n":"1u0b0","_k":"85166b23"},{"t":"Step 2 is correct.","why":"`vec{AM} - vec{AN} = vec{NM}`, from N to M.","_n":"1v180","_k":"c231ccd6"}],"hints":["From M to N: end minus start, measured from A.","`vec{AN} - vec{AM}`.","½`vec{BC}`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the stretch dial: watching `k vec{u}` shrink to `vec{0}` and come out the other side?"},{"id":"j2","q":"In your own words, why does dividing a vector by its magnitude give a unit vector?"},{"id":"j3","q":"Explain to a friend how to test whether two vectors are collinear."},{"id":"j4","q":"Which still slows you down: ratios, directions in a figure, or unit vectors? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`|vec{u}| = 4`. Which describes `-3vec{u}`?","options":[{"t":"Magnitude 12, same direction as `vec{u}`","why":"Negative `k` reverses.","_n":"1w190","_k":"032833ea"},{"t":"Magnitude 12, opposite to `vec{u}`","why":"`|-3| × 4 = 12`; the minus sign reverses the direction.","_n":"1x961","_k":"ae09605a"},{"t":"Magnitude 7, opposite to `vec{u}`","why":"Multiply, don’t add.","_n":"1y951","_k":"0599096f"},{"t":"Magnitude −12, same direction as `vec{u}`","why":"Lengths are never negative. The minus sign reverses the direction; the length is `|k||vec{u}|`.","_n":"1z981","_k":"51e6bf7d"}]},"b":{"prompt":"`|vec{v}| = 6`. Which describes `-½vec{v}`?","options":[{"t":"Magnitude 12, opposite to `vec{v}`","why":"½ halves the length.","_n":"20971","_k":"b86a0ff5"},{"t":"Magnitude 3, opposite to `vec{v}`","why":"`|-½| × 6 = 3`; the minus sign reverses the direction.","_n":"219a1","_k":"8c10bdf1"},{"t":"Magnitude 3, same direction as `vec{v}`","why":"Negative `k` reverses.","_n":"22991","_k":"8521c715"},{"t":"Magnitude −3, same direction as `vec{v}`","why":"Lengths are never negative. The minus sign reverses the direction; the length is `|k||vec{u}|`.","_n":"239c1","_k":"9900e302"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which is the unit vector in the direction of `vec{u}` = run 5, rise −12?","options":[{"t":"run 5/17, rise −12/17","why":"Divide by the magnitude 13, not by 5 + 12.","_n":"249b1","_k":"b55cd0a0"},{"t":"run 1, rise −1","why":"Length `√2`, and a different direction.","_n":"258e1","_k":"05db0325"},{"t":"run 5/13, rise −12/13","why":"`|vec{u}| = √(25 + 144) = 13`; divide each component by 13.","_n":"268d1","_k":"6058c400"},{"t":"run −5/13, rise 12/13","why":"That’s the opposite direction.","_n":"278c2","_k":"77c521f8"}]},"b":{"prompt":"Which is the unit vector in the direction of `vec{u}` = run −8, rise 6?","options":[{"t":"run −8/14, rise 6/14","why":"Divide by the magnitude first to get length 1; then multiply by the length you want. The magnitude is 10, not 8 + 6.","_n":"288d2","_k":"c76b3628"},{"t":"run −1, rise 1","why":"Length `√2`, and a different direction.","_n":"298e2","_k":"98308bc0"},{"t":"run −4/5, rise 3/5","why":"`|vec{u}| = √(64 + 36) = 10`: run −8/10, rise 6/10.","_n":"2a8f2","_k":"7ee6d3ec"},{"t":"run 4/5, rise −3/5","why":"That’s the opposite direction.","_n":"2b882","_k":"b8b0d05e"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which vector is collinear with `vec{u}` = run 2, rise −3?","options":[{"t":"run −6, rise 9","why":"`-3vec{u}`.","_n":"2c892","_k":"f22da779"},{"t":"run 3, rise −2","why":"Swapped, not scaled.","_n":"2d8a2","_k":"a12c4615"},{"t":"run 4, rise −3","why":"Only the run doubled.","_n":"2e8b2","_k":"ea8d5e2f"},{"t":"run 2, rise 3","why":"One sign changed: not a multiple.","_n":"2f942","_k":"5b13d161"}]},"b":{"prompt":"Which vector is collinear with `vec{u}` = run −4, rise 1?","options":[{"t":"run 1, rise −4","why":"Swapped, not scaled. Collinear means one is `k` times the other, component by component; `k` may be negative.","_n":"2g952","_k":"41aa84c5"},{"t":"run −8, rise 1","why":"Only the run doubled. Collinear means one is `k` times the other, component by component; `k` may be negative.","_n":"2h122","_k":"e1ca115d"},{"t":"run 8, rise −2","why":"`-2vec{u}`.","_n":"2i112","_k":"dd22abd8"},{"t":"run 4, rise 1","why":"One sign changed: not a multiple.","_n":"2j102","_k":"87dd1db1"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Which vector has length 15 and points opposite to `vec{u}` = run 3, rise 4?","options":[{"t":"run −9, rise −12","why":"−15 × (3/5, 4/5).","_n":"2k0f2","_k":"d1e762ba"},{"t":"run 9, rise 12","why":"Same direction.","_n":"2l0e2","_k":"e8b9f3e1"},{"t":"run −45, rise −60","why":"Length 75. Divide by the magnitude first to get length 1; then multiply by the length you want.","_n":"2m0d2","_k":"e39b0c59"},{"t":"run −3, rise −4","why":"Length 5.","_n":"2n0c2","_k":"345b5c35"}]},"b":{"prompt":"Which vector has length 26 and points the same way as `vec{u}` = run 5, rise −12?","options":[{"t":"run 10, rise −24","why":"26 × (5/13, −12/13).","_n":"2o0b2","_k":"30c8069a"},{"t":"run 5, rise −12","why":"Length 13.","_n":"2p1a2","_k":"ec7c3c1a"},{"t":"run 130, rise −312","why":"Divide by the magnitude first to get length 1; then multiply by the length you want.","_n":"2q192","_k":"03764d4b"},{"t":"run −10, rise 24","why":"Opposite direction.","_n":"2r27a","_k":"1aa177a6"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"In triangle OAB, `vec{OA} = vec{a}` and `vec{OB} = vec{b}`. P lies on AB with AP:PB = 1:3. Which is `vec{OP}`?","options":[{"t":"½`vec{a}` + ½`vec{b}`","why":"That’s the midpoint.","_n":"2s26a","_k":"9f0086d2"},{"t":"¾`vec{a}` + ¼`vec{b}`","why":"`vec{a} + ¼(vec{b} - vec{a})`.","_n":"2t29a","_k":"215822b1"},{"t":"¼`vec{a}` + ¾`vec{b}`","why":"That puts P near B.","_n":"2u28a","_k":"9738f73a"},{"t":"⅔`vec{a}` + ⅓`vec{b}`","why":"1:3 means quarters, not thirds.","_n":"2v23a","_k":"f0d6616e"}]},"b":{"prompt":"Same triangle; P lies on AB with AP:PB = 2:1. Which is `vec{OP}`?","options":[{"t":"⅓`vec{a}` + ⅔`vec{b}`","why":"`vec{a} + ⅔(vec{b} - vec{a})`.","_n":"2w22a","_k":"4fabc325"},{"t":"½`vec{a}` + ½`vec{b}`","why":"That’s the midpoint.","_n":"2x25a","_k":"50ac1c06"},{"t":"⅔`vec{a}` + ⅓`vec{b}`","why":"AP:PB = 2:1 puts P closer to B, so more `vec{b}`.","_n":"2y24a","_k":"d9f39b7a"},{"t":"`-vec{a} + 2vec{b}`","why":"`vec{AP}` is part of `vec{AB}`, not twice it.","_n":"2z1fa","_k":"7579ce5a"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A(1, 2), B(4, 3) and C(10, 5). Which statement is true?","options":[{"t":"They aren’t collinear: `vec{AB} ≠ vec{BC}`","why":"`vec{BC} = 2vec{AB}`: still a multiple.","_n":"301ea","_k":"f8dad934"},{"t":"They’re collinear: `vec{AC} = 3vec{AB}`, so B is ⅓ of the way from A to C","why":"`vec{AB}` = (3, 1) and `vec{AC}` = (9, 3) = 3(3, 1).","_n":"31a1a","_k":"b6f8bd4e"},{"t":"They aren’t collinear: `|vec{AB}| ≠ |vec{AC}|`","why":"Collinear means one is `k` times the other, component by component; `k` may be negative.","_n":"32a2a","_k":"aa25da69"},{"t":"They’re collinear because every coordinate is positive","why":"Position isn’t the test.","_n":"339fa","_k":"43de378c"}]},"b":{"prompt":"A(−2, 1), B(0, 2) and C(6, 5). Which statement is true?","options":[{"t":"They’re collinear because B is between A and C on the `x`-axis","why":"That alone doesn’t decide it.","_n":"34a0a","_k":"01fe1f99"},{"t":"They aren’t collinear: `|vec{AB}| ≠ |vec{AC}|`","why":"Collinear means one is `k` times the other, component by component; `k` may be negative.","_n":"35a5a","_k":"a5bfb381"},{"t":"They aren’t collinear: `vec{AB} ≠ vec{BC}`","why":"`vec{BC} = 3vec{AB}`: still a multiple.","_n":"36a6a","_k":"a5e8a689"},{"t":"They’re collinear: `vec{AC} = 4vec{AB}`, so B is ¼ of the way from A to C","why":"`vec{AB}` = (2, 1) and `vec{AC}` = (8, 4) = 4(2, 1).","_n":"37a3a","_k":"b44988b6"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `|-2vec{u}| = 2|vec{u}|`, not `-2|vec{u}|`?","options":[{"t":"“Scalars don’t change magnitude.”","why":"They multiply it by `|k|`.","_n":"38a4a","_k":"8367b7b9"},{"t":"“Multiplying by −2 doubles the length and reverses the direction. A length can’t be negative; the minus sign shows up as the reversal.”","why":"The length is multiplied by `|-2| = 2`; the sign only flips the direction.","_n":"3999a","_k":"082757c6"},{"t":"“`|-2vec{u}|` is negative because −2 is negative.”","why":"Lengths are never negative. The minus sign reverses the direction; the length is `|k||vec{u}|`.","_n":"3a9aa","_k":"dd3e0c99"},{"t":"“Because `-2vec{u} = 2vec{u}`.”","why":"They point opposite ways.","_n":"3b9ba","_k":"539fed91"}]},"b":{"prompt":"Which is the best explanation of why `vec{u}` and `-4vec{u}` are collinear?","options":[{"t":"“Because −4 is a whole number.”","why":"Any real `k` works.","_n":"3c9aa","_k":"3b9df08b"},{"t":"“`-4vec{u}` is a scalar multiple of `vec{u}`: it lies on `vec{u}`’s line, 4 times as long, pointing the opposite way.”","why":"A scalar multiple always lies on the same line.","_n":"3d99a","_k":"d2807bef"},{"t":"“Because they have the same magnitude.”","why":"`-4vec{u}` is 4 times as long.","_n":"3e98a","_k":"23906d70"},{"t":"“They aren’t, because they point in opposite directions.”","why":"Collinear means one is `k` times the other, component by component; `k` may be negative.","_n":"3f97a","_k":"e48412a4"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"M and N are the midpoints of AB and AC. Which is the clearest vector proof that `vec{MN}` is parallel to `vec{BC}` and half as long?","options":[{"t":"“`vec{MN} = vec{AM} - vec{AN} = ½vec{AB} - ½vec{AC}`, so it’s parallel.”","why":"That vector is `vec{NM}`. `vec{MN}` goes from M to N: `vec{AN} - vec{AM}` (end minus start).","_n":"3g96a","_k":"4077c480"},{"t":"“`vec{MN} = vec{AN} - vec{AM} = ½vec{AC} - ½vec{AB} = ½(vec{AC} - vec{AB}) = ½vec{BC}`: a scalar multiple of `vec{BC}` with factor ½.”","why":"End minus start, then factor out ½: a scalar multiple of `vec{BC}`.","_n":"3h95a","_k":"05bdbd17"},{"t":"“Measure MN and BC on the diagram: MN is half.”","why":"Measuring one drawing isn’t a proof.","_n":"3i94a","_k":"232d1460"},{"t":"“`vec{MN} = ½vec{AB} + ½vec{AC}`.”","why":"That vector goes from A to the midpoint of BC.","_n":"3ja3a","_k":"ca2be044"}]},"b":{"prompt":"`vec{AC} = 3vec{AB}`. Which is the clearest argument that A, B and C are collinear?","options":[{"t":"“Because 3 is positive.”","why":"Any non-zero `k` would do.","_n":"3ka2a","_k":"0f7ba548"},{"t":"“Because `|vec{AC}| = 3|vec{AB}|`.”","why":"Lengths alone don’t fix direction. Collinear means one is `k` times the other, component by component; `k` may be negative.","_n":"3l95a","_k":"50e24788"},{"t":"“Because `vec{AB} + vec{BC} = vec{AC}`.”","why":"That’s true for any three points.","_n":"3m96a","_k":"1464447a"},{"t":"“`vec{AC}` is a scalar multiple of `vec{AB}`, so they’re parallel. They share the point A, so they lie on one line.”","why":"Parallel, plus a shared point, means one line.","_n":"3n97a","_k":"b577af9f"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A drone at the origin must fly 20 m straight toward the point (12, 9) (units in metres). Where does it stop?","options":[{"t":"(16, 12)","why":"Unit vector (12, 9)/15 = (4/5, 3/5); × 20.","_n":"3o98a","_k":"c8ad586d"},{"t":"(240, 180)","why":"20 × (12, 9) is 300 m long. Divide by the magnitude first to get length 1; then multiply by the length you want.","_n":"3p91a","_k":"b80958c8"},{"t":"(12, 9)","why":"That point is only 15 m away.","_n":"3q92a","_k":"be030e92"},{"t":"(20, 20)","why":"That’s not toward (12, 9).","_n":"3r93a","_k":"389a2324"}]},"b":{"prompt":"A drone at the origin must fly 39 m straight toward the point (−10, 24). Where does it stop?","options":[{"t":"(−10, 24)","why":"That point is 26 m away.","_n":"3s94a","_k":"02363442"},{"t":"(−15, 36)","why":"Unit vector (−10, 24)/26; × 39.","_n":"3t9da","_k":"fec2b05a"},{"t":"(−390, 936)","why":"Divide by the magnitude first to get length 1; then multiply by the length you want.","_n":"3u9ea","_k":"c313b879"},{"t":"(39, 39)","why":"That’s not toward (−10, 24).","_n":"3v8f9","_k":"c5db3bd2"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"In a game, a character moves by `vec{v}` = (4, −2) every second for 3 s, then by `-½vec{v}` every second for 2 s. It starts at (1, 1). Where does it end up?","options":[{"t":"(9, −3)","why":"`3vec{v} + 2(-½vec{v}) = 2vec{v}` = (8, −4); from (1, 1).","_n":"3w8e9","_k":"82424b27"},{"t":"(11, −4)","why":"`-½vec{v}` applies for \u003cstrong>2\u003c/strong> seconds.","_n":"3x919","_k":"24c508a8"},{"t":"(8, −4)","why":"That’s the displacement; add the start.","_n":"3y909","_k":"dcc8111c"},{"t":"(17, −7)","why":"The second part moves backward: `-½vec{v}`.","_n":"3z939","_k":"145a7904"}]},"b":{"prompt":"A character moves by `vec{v}` = (−2, 6) every second for 2 s, then by `-½vec{v}` every second for 4 s. It starts at (3, 0). Where does it end up?","options":[{"t":"(−5, 24)","why":"The second part moves backward.","_n":"40929","_k":"59aebb06"},{"t":"(0, 9)","why":"`-½vec{v}` applies for 4 seconds.","_n":"41959","_k":"c3e07738"},{"t":"(0, 0)","why":"That’s the displacement; add the start.","_n":"42949","_k":"d5d2952e"},{"t":"(3, 0)","why":"`2vec{v} + 4(-½vec{v}) = vec{0}`: back where it began.","_n":"43979","_k":"4c11a97f"}]}}]},"task":{"title":"Undo the stretch","summary":"Undo the stretch","statement":"\u003cp>Choose a scalar `k` and a vector `vec{u}` so that every condition holds. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`k vec{u}` = (6, −6).\u003c/li>\u003cli>`vec{u}` points opposite to (6, −6).\u003c/li>\u003cli>`vec{u}` is shorter than `k vec{u}`.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">`k` runs from −3 to 3 in steps of 0.5 (not 0); `vec{u}` has whole-number run and rise from −6 to 6. The drawing shows `vec{u}`, `k vec{u}` and the target (6, −6).\u003c/p>","checks":["`k vec{u}` = (6, −6)","`vec{u}` points opposite to (6, −6)","`vec{u}` is shorter than `k vec{u}`"],"tips":["`vec{u}` = (6, −6)/`k`: its components must be whole numbers.","Opposite means `k` is negative.","`|k vec{u}| = |k||vec{
