.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 21: critical point classifier (V5 panels, probe and zoom sliders, Build sliders, V11 sign chart builder),
   Test it stations (factor boxes, sketch picker, shift graph), Find and design boxes (V8), task inputs */
.cp-ex [hidden],.cp-st [hidden],#task-sheet [hidden]{display:none !important}
.cp-ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.cp-main,.cp-side{min-width:0}
.cp-eq{min-height:1.6em}
canvas.plot.cp-top{aspect-ratio:16/10}
canvas.plot.cp-low{aspect-ratio:16/7}
.cp-panels .plot-wrap + .plot-wrap{margin-top:6px}
.cp-psl,.cp-zsl{margin-top:10px}
.cp-psl output,.cp-zsl output,.cp-bsl output{color:var(--ink)}
.cp-psl input,.cp-zsl input,.cp-bsl input{width:100%;min-height:28px}
.cp-zh{font-weight:700;margin:10px 0 4px}
.cp-zch{gap:6px;margin-bottom:4px}
.cp-zch .chip{font-size:.9rem}
.cp-key{margin:8px 0 0}
.cp-fns{margin-bottom:6px;gap:6px}
.cp-fns .chip{font-size:.86rem}
.cp-fns .chip .m{font-size:1.05em}
.cp-lock{font:400 .75rem var(--font-ui);color:var(--ink-2)}
.cp-how{margin:8px 0 10px}
.cp-read{margin-top:8px}
.cp-bsl{margin:0 0 2px}
.cp-chartwrap{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:14px}
.cp-cht{margin:0 0 6px;font-size:1.05rem}

/* V11 sign chart (builder and finished) */
.cp-chh{font-weight:700;margin:6px 0 4px}
.cp-xs{gap:6px;margin-bottom:10px}
.cp-xs .chip{min-height:34px;padding:.2em .7em}
.cp-xs .chip .m{font-size:1em}
.cp-scw{overflow-x:auto;position:relative;margin:4px 0}
table.cp-sct th,table.cp-sct td{padding:5px 8px;text-align:center;white-space:nowrap;vertical-align:middle}
table.cp-sct tbody th{text-align:left;font-weight:600}
table.cp-sct thead th.cp-ptc{background:var(--hi-soft)}
table.cp-sct td.cp-pt{font:600 .8rem var(--font-ui);color:var(--ink-2)}
table.cp-sct td.cp-auto span[aria-hidden]{font-size:1.25rem;line-height:1;display:block}
.cp-w{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.cp-sct .cp-trow td{font-size:.85rem;color:var(--ink-2)}
table.cp-sct .cp-drow td{font-weight:700}
.cp-sg,.cp-ar,.cp-kd{min-width:40px;min-height:36px;border:2px dashed var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:8px;font:700 1.15rem var(--font-math);padding:0 .5em;cursor:pointer}
.cp-kd{min-width:84px;font:700 .85rem var(--font-ui)}
.cp-sg.on,.cp-ar.on,.cp-kd.on{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--hi-soft)}
.cp-sg:not(:disabled):hover,.cp-ar:not(:disabled):hover,.cp-kd:not(:disabled):hover{border-color:var(--pen)}
.cp-sg:disabled,.cp-ar:disabled,.cp-kd:disabled{cursor:default;opacity:.9}
.cp-chhow{margin:4px 0 8px}
.cp-val{margin:10px 0 6px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:8px}
.cp-val .cp-zh{margin-top:0}
.cp-cube{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:1.15rem}
.cp-cube .numin.short{width:4.6rem}
.cp-rad{font:400 1.6rem var(--font-math);margin-right:-4px}
.cp-rin{border-top-width:2.5px;border-top-color:var(--ink)}

/* Part 3 */
.cp-st h3{margin-top:0}
.cp-st:first-child{margin-top:0;padding-top:0;border-top:0}
.cp-fac{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:1.15rem;margin:6px 0 4px}
.cp-fac .numin.short{width:4rem}
.cp-res{margin-top:10px}
.cp-res canvas.plot.wide{max-width:640px}
.cp-call{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--hi);background:var(--info-bg);border-radius:0 8px 8px 0}
.cp-call p{margin:0 0 6px}
.cp-call p:last-child{margin-bottom:0}
.cp-sks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:8px 0}
.cp-sk{display:block;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:4px;min-width:0;cursor:pointer}
.cp-sk canvas.plot{border:0;aspect-ratio:4/3;display:block;width:100%}
.cp-sk:not(:disabled):hover{border-color:var(--pen)}
.cp-sk.on{border-color:var(--red)}
.cp-sk.on.good{border-color:var(--green);background:var(--good-bg)}
.cp-sk:disabled{cursor:default}
.cp-shift{margin-top:12px}
.cp-shift canvas.plot.wide{max-width:640px}
.cp-shift output{color:var(--ink)}
.cp-shift input{width:100%;max-width:420px}
.cp-note{font-weight:600;margin:8px 0 0}

/* Practice 2: V8 design boxes */
.cp-dt{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.cp-dr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cp-dl2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cp-dl{min-width:9.5rem}
.cp-dpt{display:inline-flex;align-items:center;gap:4px;font-size:1.1rem}
.cp-dq .numin.short{width:4.6rem}
.cp-dq .numin.cp-list{width:8rem}
.cp-br{min-width:34px;min-height:36px;border:2px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:6px;font:700 1.25rem var(--font-math);padding:0 .3em}
.cp-br:not(:disabled):hover{border-color:var(--pen)}

/* task */
.cp-tin{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.cp-step{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.cp-step label{min-width:8.5rem}
.cp-step .numin.short{width:4.2rem}
.cp-pl{min-width:8.5rem;font-weight:600}
.cp-pl .m{font-size:1em}
#td-plot{margin-top:4px}
.cp-all{font-weight:600}

@media (max-width:760px){
  .cp-ex{grid-template-columns:minmax(0,1fr)}
  .cp-sks{grid-template-columns:repeat(2,minmax(0,1fr))}
  canvas.plot.cp-top{aspect-ratio:4/3}
  canvas.plot.cp-low{aspect-ratio:16/9}
  .cp-dl{min-width:0}
  .cp-fac{gap:4px;font-size:1.05rem}
  .cp-fac .numin.short{width:2.8rem;padding-left:.3em;padding-right:.3em}
}

</style>

`f′(#1)` exists and isn’t 0, so `x = #1` isn’t a critical number.","mSignBlank":"Choose + or − for every interval.","mSign":"Check the sign on #1. Test a value in each interval. An even power like `x^2` never changes sign.","mArrowBlank":"Choose ↗ or ↘ for every interval.","mArrow":"Where `f′ > 0`, `f` is increasing (↗); where `f′ \u003c 0`, it’s decreasing (↘).","mKindBlank":"Classify every critical number: local max, local min or neither.","mNeither":"At `x = #1`, `f′` doesn’t change sign. `f′` must \u003cstrong>change sign\u003c/strong> for a max or min, so there’s neither.","mMax":"Rising then falling makes a peak: + to − is a local \u003cstrong>maximum\u003c/strong>.","mMin":"Falling then rising makes a valley: − to + is a local \u003cstrong>minimum\u003c/strong>.","mExt":"`f′` changes sign at `x = #1`, so there is a local maximum or minimum there.","mVal":"Your chart is right. Now type the local minimum value `f(2)` in the □∛□ box.","mValBad":"Not quite: `f(2) = 2^{2/3}(2 - 5)`, and `2^{2/3} = ∛4`.","good":"\u003cstrong>✓ Chart complete.\u003c/strong> The diamonds on the graphs are now filled in and labelled."}},"predIntro":"Make a prediction first. Then the classifier shows you what really happens.","predictions":[{"id":"p1","prompt":"F2 `x^3`. `f′(0) = 0`. What happens at `x = 0`?","options":[{"t":"Neither: the graph flattens but keeps rising","_n":"oeda","_k":"1e1b83cb"},{"t":"A local maximum","_n":"pf0a","_k":"cd18b976"},{"t":"`f′` doesn’t exist there","_n":"qefa","_k":"6ab9c690"},{"t":"A local minimum","_n":"rfaa","_k":"a0556b2d"}],"explain":"`f′ = 3x^2` is positive on both sides of 0. No sign change, no max or min."},{"id":"p2","prompt":"F4 `x^{2/3}`. Is there a critical number at `x = 0`?","options":[{"t":"No: 0 isn’t in the domain","_n":"sf9a","_k":"e69d8a74"},{"t":"No: `f′` is never 0","_n":"teca","_k":"ebbc7ccc"},{"t":"Yes: `f′` doesn’t exist there (a cusp)","_n":"ueda","_k":"e16f0935"},{"t":"Yes: `f′(0) = 0`","_n":"veaa","_k":"ab11b5e0"}],"explain": s a min at −1 and a max at 1.","c1":"`f′ = 3x^2 - 1` has zeros `±{1}/{√3}`, not ±1.","general":"Make `f′` zero at `x = -1` and `x = 1` first, then fix the heights."}}]},"part3":{"slug":"test","name":"Test it","heading":"Test it","intro":"In Explore you found and classified points with a probe and zoom. Here you carry out the first derivative test the way you’ll write it, as a table, on polynomials and rational functions. Then you run it backwards. Finish with the quick check.","chart":{"pick":"Critical numbers: tap to add or remove","check":"Check the table","rowX":"`x`","rowTest":"test value","rowSign":"sign of `f′`","rowF":"`f`","testAt":"`x = #1`","how":"Tap a sign, an arrow or a classification to change it."},"s1":{"title":"Station 1: The test table (polynomial)","text":"`f(x) = 3x^4 - 4x^3 - 12x^2 + 5`, so `f′(x) = 12x^3 - 12x^2 - 24x`.","step1":"\u003cstrong>Step 1.\u003c/strong> Factor `f′`: fill in the coefficients.","step2":"\u003cstrong>Step 2.\u003c/strong> Place the critical numbers on the chart, test one value in each interval, choose the sign of `f′` and an arrow, then classify each critical number.","check":"Check the factors","f":{"pre":"`f′(x) =`","mid1":"`x(x -`","mid2":"`)(x +`","post":"`)`"},"fGood":"\u003cstrong>✓ Right:\u003c/strong> `f′(x) = 12x(x - 2)(x + 1)`. Its zeros are the critical numbers.","fFill":"Fill in all three boxes with whole numbers.","fCommon":"Take out the common factor `12x` first: `12x^3 - 12x^2 - 24x = 12x(x^2 - x - 2)`.","fSwap":"`(x - 1)(x + 2) = x^2 + x - 2`, but you need `x^2 - x - 2`. Swap the numbers.","fPair":"Factor `x^2 - x - 2`: find two numbers that multiply to −2 and add to −1.","result":"\u003cstrong>✓ First derivative test done:\u003c/strong> local min (−1, 0), local max (0, 5), local min (2, −27).","alg":["`f(-1) = 3 + 4 - 12 + 5 = 0`","`f(0) = 5`","`f(2) = 48 - 32 - 48 + 5 = -27`"],"graph":"Graph of `f(x) = 3x^4 - 4x^3 - 12x^2 + 5` with the three critical points."},"s2":{"title":"Station 2: The test table (rational)","tabs":[{"id":"r1","t":"`x + {4}/{x}`"},{"id":"r2","t":"`{x}/{x^2 + 4}`"}],"r1":{"text":"`f(x) = x + {4}/{x}`, so `f′(x) = {(x - 2)(x + 2)}/{x^2}`. The chart already has `x = 0` as a boundary: it isn’t in the domain.","result":"\u003cstrong>✓ Signs + | − | − | +:\u003c/strong> a local max at (−2, −4) and a local min at (2, 4)."},"r2":{"text":"`f(x) = {x}/{x^2 + 4}`, so `f′(x) = {4 - x^2}/{(x^2 + 4)^2}`.","result":"\u003cstrong>✓ Signs − | + | −:\u003c/strong> a local min at `(-2, -{1}/{4})` and a local max at `(2, {1}/{4})`."},"callout":"The local max is lower than the local min. How?","reveal":"Show the answer","because":"They’re on different branches. Local means ‘compared with nearby points’.","graphHow":"The graph appears when your table is right."},"s3":{"title":"Station 3: Run it backwards","text":"Here is `f′(x) = (x + 1)^2(x - 2)`. Tap the sketch that could be `f`.","sketches":[{"id":"a","aria":"Sketch: falls, levels off for a moment at x = −1 and keeps falling, then turns up at a minimum at x = 2.","fb":"\u003cstrong>✓ Right.\u003c/strong> `(x + 1)^2` never changes sign, so `f` levels off at −1 and keeps falling; `f′` goes from − to + at 2: a minimum.","_n":"14ed9","_k":"6cff0cb1"},{"id":"b","aria":"Sketch: a maximum at x = −1 and a minimum at x = 2.","fb":"`(x + 1)^2` doesn’t change sign at −1, so there’s no maximum there.","_n":"15ec9","_k":"e5b13c20"},{"id":"c","aria":"Sketch: a minimum at x = −1 and a maximum at x = 2.","fb":"`f′` goes from − to + at 2, so `f` has a minimum there, not a maximum. And `(x + 1)^2` doesn’t change sign at −1.","_n":"16eb9","_k":"7155cf9e"},{"id":"d","aria":"Sketch: a minimum at x = −1 and a minimum at x = 2.","fb":"Two minimums need a maximum between them, but `f′` is only 0 at −1 and 2. And `(x + 1)^2` doesn’t change sign at −1.","_n":"17f29","_k":"916a1d1e"}],"shift":"Shift the sketch up or down","shiftNote":"Every one of these has the same `f′`. Infinitely many graphs fit."},"quickCheck":{"title":"Quick check", e the fix.","problems":[{"id":"e1","goal":2,"task":"Find and classify the critical points of `f(x) = 3x^{2/3} - x`.","steps":["`f′(x) = 2x^{-1/3} - 1`.","`f′ = 0`: `{2}/{∛x} = 1`, so `∛x = 2` and `x = 8`.","So the only critical number is `x = 8`.","`f′` is + before 8 and − after, so there’s a local max at (8, 4)."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is fine, but something was missed before it."],"fixes":[{"t":"`x = 8` isn’t critical, because `f(8) ≠ 0`.","why":"Critical numbers come from `f′`, not `f`.","_n":"1o799","_k":"a50f12fe"},{"t":"`f′ = {2 - ∛x}/{∛x}` is also undefined at `x = 0`, which is in the domain. So 0 is critical too: `f′` is − then +, a local min at (0, 0).","why":"`x = 0` is critical: a local min (a cusp).","_n":"1p7c9","_k":"c4028158"},{"t":"Step 3 is correct: critical numbers come only from `f′ = 0`.","why":"A corner, cusp or vertical tangent is also critical: `f′` doesn’t exist there, but `f` does.","_n":"1q7b9","_k":"1baca4e3"},{"t":"`x = -8` is also critical.","why":"`f′(-8) = {2}/{-2} - 1 = -2 ≠ 0`.","_n":"1r7e9","_k":"ad12aed3"}],"hints":["Is there an `x` where `f′` doesn’t exist?","`x^{-1/3} = {1}/{∛x}`.","`x = 0` is critical: a local min (a cusp)."]},{"id":"e2","goal":4,"task":"Classify the critical points of `f(x) = 3x^5 - 5x^3`.","steps":["`f′ = 15x^4 - 15x^2` `= 15x^2(x - 1)(x + 1)`.","Critical numbers: −1, 0, 1.","Signs of `f′`: + on `(-∞, -1)`, − on `(-1, 0)`, − on `(0, 1)`, + on `(1, ∞)`.","`f′(0) = 0`, so there’s a turning point at `x = 0`: a local min at (0, 0).","Local max at (−1, 2), local min at (1, −2)."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct. Check what’s concluded from it.","","Step 5 is right. The mistake is earlier."],"fixes":[{"t":"`x = 0` isn’t a critical number.","why":"`f′(0) = 0`, so it is critical.","_n":"1s7d9","_k":"f4e5b22b"},{"t":"Step 4 is correct.","why":"`f′` must \u003cstrong>change sign\u003c/strong>. Here it’s ","_n":"2ffeb","_k":"b12138ff"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"`f′` is negative on `(-∞, 4)` and positive on `(4, ∞)`. What does `f` have at `x = 4`?","options":[{"t":"A local minimum","why":"Falling then rising.","_n":"2gfdb","_k":"d8719a03"},{"t":"A local maximum","why":"Falling then rising makes a valley: − to + is a local \u003cstrong>minimum\u003c/strong>.","_n":"2hf0b","_k":"c3ed931b"},{"t":"Neither, because `f′(4)` might not be 0","why":"If `f′` changes sign and `f(4)` exists, there’s an extremum either way.","_n":"2if1b","_k":"c8ebaf27"},{"t":"A point where `f` is undefined","why":"Nothing says that.","_n":"2jf2b","_k":"b73d933b"}]},"b":{"prompt":"`f′` is positive on `(-∞, -1)` and negative on `(-1, ∞)`. What does `f` have at `x = -1`?","options":[{"t":"A local minimum","why":"Rising then falling makes a peak: + to − is a local \u003cstrong>maximum\u003c/strong>.","_n":"2kf3b","_k":"315ea497"},{"t":"A point where `f` is undefined","why":"Nothing says that.","_n":"2lecb","_k":"8f5b58a5"},{"t":"A local maximum","why":"Rising then falling.","_n":"2medb","_k":"d31c8514"},{"t":"Neither, because `f′(-1)` might not be 0","why":"If `f′` changes sign and `f(-1)` exists, there’s an extremum either way.","_n":"2neeb","_k":"8afe96fd"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Classify the critical points of `f(x) = 3x^4 - 8x^3`.","options":[{"t":"Neither at 0; a local maximum at (2, −16)","why":"`f′` goes from − to + at 2: Falling then rising makes a valley: − to + is a local \u003cstrong>minimum\u003c/strong>.","_n":"2oefb","_k":"6f78d62b"},{"t":"A local min at (2, −16) only, because 0 isn’t a critical number","why":"`f′(0) = 0`, so 0 is critical; it just isn’t an extremum.","_n":"2pf8b","_k":"0c71bc9b"},{"t":"A local max at (0, 0) and a local min at (2, −16)","why":"`f′` doesn’t change sign at 0.","_n":"2qf9b","_k":"a73defb7"},{"t":"Neither at `x = 0`; a local minimum at (2, −16)","why":"`f′ = 12x^2(x - 2)`: − | − | +.","_n":"2r1c8","_k":"d0a468e6"}]},"b":{"prompt":"Classify the critical points of `f(x) = 3x^4 + 4x^3`.","options":[{"t":"A local min at (−1, −1) only, because 0 isn’t a critical number","why":"`f′(0) = 0`, so 0 is critical; it just isn’t an extremum.","_n":"2s1d8","_k":"3b27b28b"},{"t":"A local minimum at (−1, −1); neither at `x = 0`","why":"`f′ = 12x^2(x + 1)`: − | + | +.","_n":"2t1e8","_k":"cbc18a52"},{"t":"A local maximum at (−1, −1); neither at 0","why":"`f′` goes from − to + at −1: Falling then rising makes a valley: − to + is a local \u003cstrong>minimum\u003c/strong>.","_n":"2u1f8","_k":"ffe012c3"},{"t":"A local min at (−1, −1) and a local max at (0, 0)","why":"`f′` doesn’t change sign at 0.","_n":"2v188","_k":"491f9ece"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Which statement about `f(x) = x^{1/3}(x + 4)` is true?","options":[{"t":"Local min at (−1, −3); `x = 0` is critical but neither","why":"`f′ = {4(x + 1)}/{3x^{2/3}}`: − | + | +, undefined at 0.","_n":"2w198","_k":"44862245"},{"t":"Local max at (−1, −3); `x = 0` isn’t critical","why":"`f′` goes from − to + at −1 (a minimum), and 0 is critical because `f′` doesn’t exist there.","_n":"2x1a8","_k":"d549d63d"},{"t":"Local min at (−1, −3) and local max at (0, 0)","why":"`f′` is + on both sides of 0: no sign change, so neither.","_n":"2y1b8","_k":"a0041d73"},{"t":"The only critical number is −1, a local minimum","why":"`f′` is undefined at 0, and 0 is in the domain. A corner, cusp or vertical tangent is also critical: `f′` doesn’t exist there, but `f` does.","_n":"2z248","_k":"ed59cc03"}]},"b":{"prompt":"Which statement about `f(x) = x^{1/3}(x - 4)` is true?","options":[{"t":"Local min at (1, −3) and local max at (0, 0)","why":"`f′` is − on both sides of 0: no sign change, so neither.","_n":"30258","_k":"59752d4f"},{"t":"Local min at (1, −3); `x = 0` is critical but neither","why":"`f′ = {4(x - 1)}/{3x^{2/3}}`: − | − | +.","_n":"31228","_k":"8ace79ea"},{"t":"The only critical number is 1, a local minimum","why":"`f′` is undefined at 0, and 0 is in the domain. A corner, cusp or vertical tangent is also critical: `f′` doesn’t exist there, but `f` does.","_n":"32218","_k":"cf39ac11"},{"t":"Local max at (1, −3); `x = 0` isn’t critical","why":"`f′` goes from − to + at 1 (a minimum), and 0 is critical because `f′` doesn’t exist there.","_n":"33208","_k":"145900fd"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Which is true for `f(x) = x + {9}/{x}`?","options":[{"t":"Local max (−3, −6) and local min (3, 6)","why":"`f′ = {(x - 3)(x + 3)}/{x^2}`: + | − | − | +, with 0 not in the domain.","_n":"341f8","_k":"f33f970a"},{"t":"Critical numbers −3, 0 and 3, with a local max at 0","why":"`x = 0` isn’t in the domain of `f`, so it can’t be a critical number. It still splits the sign chart.","_n":"351e8","_k":"dd26e3c3"},{"t":"Local min (−3, −6) and local max (3, 6)","why":"A local max can be lower than a local min on another branch.","_n":"361d8","_k":"79df91c1"},{"t":"Critical numbers ±9","why":"`1 - {9}/{x^2} = 0` gives `x^2 = 9`.","_n":"371c8","_k":"269e20b3"}]},"b":{"prompt":"Which is true for `f(x) = 4x + {1}/{x}`?","options":[{"t":"Local min `(-{1}/{2}, -4)` and local max `({1}/{2}, 4)`","why":"A local max can be lower than a local min on another branch.","_n":"381b8","_k":"55705355"},{"t":"Local max `(-{1}/{2}, -4)` and local min `({1}/{2}, 4)`","why":"`f′ = {4x^2 - 1}/{x^2}`.","_n":"392a8","_k":"56740879"},{"t":"Critical numbers `-{1}/{2}`, 0 and `{1}/{2}`, with a local max at 0","why":"`x = 0` isn’t in the domain of `f`, so it can’t be a critical number. It still splits the sign chart.","_n":"3a298","_k":"a99a4046"},{"t":"Critical numbers `±{1}/{4}`","why":"`4x^2 = 1` gives `x^2 = {1}/{4}`, so `x = ±{1}/{2}`.","_n":"3b288","_k":"13394708"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"A student says: “`f′(2) = 0`, so `f` has a max or a min at `x = 2`.” Which response is best?","options":[{"t":"“Yes: every critical number gives a max or a min.”","why":"`f′` must \u003cstrong>change sign\u003c/strong>. For `y = x^3`, `f′ ≥ 0` on both sides of 0, so there’s neither.","_n":"3c298","_k":"986ec204"},{"t":"“No: `f′(2) = 0` means `f` is constant near 2.”","why":"Only the tangent is flat, and only at that point.","_n":"3d268","_k":"30e523e0"},{"t":"“Not necessarily, because `f′` might not exist at 2.”","why":"It does exist; it’s 0.","_n":"3e278","_k":"c1e9c40c"},{"t":"“Not necessarily. `f′(2) = 0` makes 2 a critical number, but there’s an extremum only if `f′` changes sign there. For `f(x) = (x - 2)^3`, `f′ ≥ 0` on both sides, so there’s neither.”","why":"A critical number is only a candidate; the sign change decides.","_n":"3f2c8","_k":"e9a7056c"}]},"b":{"prompt":"A student says: “`f′` doesn’t exist at `x = 1`, so `f` can’t have a max or min there.” Which response is best?","options":[{"t":"“True, unless `f(1) = 0`.”","why":"The value of `f` doesn’t decide it.","_n":"3g2d8","_k":"f563c89d"},{"t":"“False, because every point where `f′` fails is a maximum.”","why":"Vertical tangents (like `∛x`) give neither.","_n":"3h2a8","_k":"cdb13173"},{"t":"“True: extrema need a horizontal tangent.”","why":"A corner, cusp or vertical tangent is also critical: `f′` doesn’t exist there, but `f` does.","_n":"3i2b8","_k":"3ac2f675"},{"t":"“That’s not true. `f(x) = |x - 1|` has a local min at `x = 1`, where `f′` doesn’t exist. Check the signs of `f′` on each side.”","why":"Corners and cusps can be extrema; the sign change decides.","_n":"3j208","_k":"c262bdab"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"`f′(x) = -2(x + 1)(x - 3)`. Which summary is correct and correctly written?","options":[{"t":"“`f` decreases on `(-∞, -1)` and `(3, ∞)` and increases on `(-1, 3)`; local min at (−1, 0), local max at (3, 0).”","why":"`f′ = 0` there, not `f`. The critical number is the `x`. The max or min value is `f(c)`, not `f′(c)`.","_n":"3k218","_k":"8d4f0a04"},{"t":"“`f` decreases on `(-∞, -1)` and `(3, ∞)` and increases on `(-1, 3)`; local min at `x = -1`, local max at `x = 3`.”","why":"The −2 makes `f′` negative outside −1 and 3 and positive between them.","_n":"3lae8","_k":"a9dc6609"},{"t":"“`f` increases on `(-∞, -1)` and `(3, ∞)` and decreases on `(-1, 3)`; local max at `x = -1`, local min at `x = 3`.”","why":"The −2 flips every sign.","_n":"3mad8","_k":"f9a9c9da"},{"t":"“`f` decreases on `(-∞, -1]` and `[3, ∞)` and increases on `[-1, 3]`; local min at −1, local max at 3.”","why":"Intervals of increase and decrease are written as open intervals.","_n":"3nb08","_k":"67bde164"}]},"b":{"prompt":"`f′(x) = -3(x + 2)(x - 1)`. Which summary is correct and correctly written?","options":[{"t":"“`f` increases on `(-∞, -2)` and `(1, ∞)` and decreases on `(-2, 1)`; local max at −2, local min at 1.”","why":"The −3 flips every sign.","_n":"3oaf8","_k":"7939ed4e"},{"t":"“`f` decreases on `(-∞, -2]` and `[1, ∞)` and increases on `[-2, 1]`; local min at −2, local max at 1.”","why":"Intervals of increase and decrease are written as open intervals.","_n":"3paa8","_k":"e17ddb6e"},{"t":"“`f` decreases on `(-∞, -2)` and `(1, ∞)` and increases on `(-2, 1)`; local min at (−2, 0), local max at (1, 0).”","why":"`f′ = 0` there, not `f`. The critical number is the `x`. The max or min value is `f(c)`, not `f′(c)`.","_n":"3qa98","_k":"05872553"},{"t":"“`f` decreases on `(-∞, -2)` and `(1, ∞)` and increases on `(-2, 1)`; local min at `x = -2`, local max at `x = 1`.”","why":"The −3 makes `f′` negative outside −2 and 1 and positive between them.","_n":"3rac8","_k":"a0af046d"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A reservoir holds `V(t) = t^3 - 15t^2 + 63t + 200` megalitres `t` months after January 1, for `0 ≤ t ≤ 12`. When does the volume reach a local maximum, and what is it?","options":[{"t":"After 3 months: 281 ML","why":"`V′ = 3(t - 3)(t - 7)`: + then − at 3; `V(3) = 27 - 135 + 189 + 200 = 281`.","_n":"3sab8","_k":"92db3379"},{"t":"After 3 months: 281 ML, and again after 7 months","why":"At 7, `V′` goes − to +: a minimum.","_n":"3ta68","_k":"00dbbc9d"},{"t":"After 5 months, halfway between the critical numbers","why":"A max happens at a critical number, not between them.","_n":"3ua58","_k":"0f522d43"},{"t":"After 7 months: 249 ML","why":"That’s the local minimum.","_n":"3va47","_k":"dedff284"}]},"b":{"prompt":"`V(t) = t^3 - 18t^2 + 96t + 100`, for `0 ≤ t ≤ 12`. When does the volume reach a local maximum, and what is it?","options":[{"t":"After 8 months: 228 ML","why":"That’s the local minimum.","_n":"3wa57","_k":"1a50f750"},{"t":"After 6 months","why":"Not a critical number.","_n":"3xa67","_k":"73111944"},{"t":"After 4 months: 260 ML","why":"`V′ = 3(t - 4)(t - 8)`; `V(4) = 64 - 288 + 384 + 100 = 260`.","_n":"3ya77","_k":"ad07b6a3"},{"t":"After 4 months: 260 ML, and again after 8 months","why":"At 8, `V′` goes − to +: a minimum.","_n":"3za87","_k":"59cc266c"}]}},{"id":"a2","cat":"A","goal":[5,6],"a":{"prompt":"The average cost of making `x` thousand phone cases is `A(x) = x + {16}/{x} + 2` (dollars per case), `x > 0`. At what production level does the average cost have a local minimum, and what is it?","options":[{"t":"16 thousand cases, $19 per case","why":"`1 = {16}/{x^2}` gives `x^2 = 16`, so `x = 4`.","_n":"40a97","_k":"6781c7ae"},{"t":"4 thousand cases, $0 per case","why":"`A′(4) = 0`; the cost is `A(4)`.","_n":"41aa7","_k":"68c7b743"},{"t":"At `x = -4` and `x = 4`","why":"Production can’t be negative: −4 isn’t in the domain.","_n":"42ab7","_k":"97e6d16b"},{"t":"4 thousand cases, $10 per case","why":"`A′ = 1 - {16}/{x^2} = 0` at `x = 4` (−4 isn’t in the domain); − then +; `A(4) = 4 + 4 + 2 = 10`.","_n":"439c7","_k":"bfd7dbfc"}]},"b":{"prompt":"`A(x) = x + {25}/{x} + 1`, `x > 0`. At what production level does the average cost have a local minimum, and what is it?","options":[{"t":"5 thousand cases, $11 per case","why":"`A′ = 1 - {25}/{x^2} = 0` at `x = 5`; `A(5) = 5 + 5 + 1 = 11`.","_n":"449d7","_k":"1747d334"},{"t":"5 thousand cases, $0 per case","why":"`A′(5) = 0`; the cost is `A(5)`.","_n":"45aa7","_k":"f203d87f"},{"t":"At `x = -5` and `x = 5`","why":"Production can’t be negative: −5 isn’t in the domain.","_n":"46a97","_k":"b2d05748"},{"t":"25 thousand cases, $27 per case","why":"`x^2 = 25` gives `x = 5`.","_n":"47a87","_k":"feed0414"}]}}]},"task":{"title":"Design the derivative","summary":"Design the derivative","statement":"\u003cp>Choose a derivative `f′(x) = a(x - p)^m(x - q)^n` so that the function `f` meets every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`f` has a local minimum at `x = 1`.\u003c/li>\u003cli>`f` has a critical number at a negative `x` where it has neither a max nor a min.\u003c/li>\u003cli>`f′(0) = -4`.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">`a` is a whole number from −5 to 5 (not 0); `p` and `q` are whole numbers from −5 to 5; `m` and `n` are 1, 2 or 3. The sign chart and the sketch of `f` (drawn with `f(0) = 0`) update as you go.\u003c/p>","checks":["Local min at `x = 1`","A negative critical number that is neither","`f′(0) = -4`"],"tips":["A minimum needs `f′` to go from − to +. Use an odd power for the factor `(x - 1)`, and check the sign of `a`.","A critical point with no sign change needs an even power: `(x - q)^2` with `q \u003c 0`.","Substitute `x = 0` into your `f′`."],"explainPrompt":"Explain how you chose the powers and why `f′(0) = -4` left so few choices.","vocab":"Use the words critical number, sign change, local minimum and even power.","more":"There’s more than one answer. Can you find them all?","afterAll":"`f′(0) = -aq^2` when the power on `(x - 1)` is odd, so `aq^2 = 4`. That allows only `a = 1`, `q = -2` or `a = 4`, `q = -1`.","labels":{"a":"`a`","p":"`p`","q":"`q`","m":"`m`","n":"`n`","aRange":"(−5 to 5, not 0)","pRange":"(−5 to 5)","pow":"power","invalid":"Choose whole numbers: `a` from −5 to 5 (not 0), `p` and `q` from −5 to 5, and a power for each factor.","chart":"Sign chart of your `f′`","sketch":"Sketch of `f` with `f(0) = 0`"}},"cards":[["Critical number","`c` in the domain with `f′(c) = 0` or `f′(c)` undefined."],["Critical point","The point `(c, f(c))`."],["Stationary point","`f′(c) = 0`: the tangent is horizontal."],["Where `f′` doesn’t exist","Corners (`|x|`), cusps (`x^{2/3}`), vertical tangents (`x^{1/3}`)."],["Not critical","Values outside the domain (asymptotes, holes), even if `f′` is undefined there."],["First derivative test: + to −","Local maximum."],["First derivative test: − to +","Local minimum."],["No sign change","Neither: e.g. `y = x^3` at 0, or a squared factor in `f′`."],["Even power in `f′`","`(x - c)^2` doesn’t change sign: no extremum at `c`."],["Local vs absolute","Local compares with nearby points only; a local max can be lower than a local min."],["Zoom test","Smooth points straighten when you zoom in; corners and cusps never do."],["Infinitely many `f`","The same `f′` fits `f + C` for every constant `C`."]]}};</script>
