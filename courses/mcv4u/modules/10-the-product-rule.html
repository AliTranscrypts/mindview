.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 10: growing rectangle (hero + Explore), graph panels, Expand-or-rule stations, V8 coefficient boxes, task steppers */
.pr-svgbox{min-width:0}
.pr-svg{display:block;width:100%;height:auto;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px}
.pr-svg .pr-b{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.pr-svg .pr-st{fill:var(--f3);fill-opacity:.2;stroke:var(--f3);stroke-width:1.5}
.pr-svg .pr-ss{fill:var(--pen);fill-opacity:.2;stroke:var(--pen);stroke-width:1.5}
.pr-svg .pr-cn{fill:var(--hi);stroke:var(--ink);stroke-width:1}
.pr-svg .pr-ef{stroke:var(--pen);stroke-width:4.5;stroke-linecap:round}
.pr-svg .pr-eg{stroke:var(--f3);stroke-width:4.5;stroke-linecap:round}
.pr-svg .pr-ld{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.pr-svg text{font:600 15px var(--font-ui)}
.pr-svg .pr-it{font-family:var(--font-math);font-style:italic;font-size:16px}
.pr-svg .pr-tf{fill:var(--pen)}
.pr-svg .pr-tg{fill:var(--f3)}
.pr-svg .pr-tk{fill:var(--ink)}
.pr-svg .pr-tm{fill:var(--ink-2);font:600 13px var(--font-ui)}
.pr-hero{width:100%}
#pr-hero-ctl .player{justify-content:center}
.pr-msg{margin:0;padding:2.2em 1em;border:1.5px dashed var(--rule);border-radius:8px;text-align:center;color:var(--ink-2)}
.pr-ex{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.pr-main,.pr-side{min-width:0}
canvas.plot.pr-top{aspect-ratio:16/10}
canvas.plot.pr-low{aspect-ratio:16/8;margin-top:6px}
.pr-key{margin:6px 0 0}
.pr-lab{font-weight:700;margin:0 0 4px}
.pr-pairs{margin-bottom:8px}
.pr-pairs .chip,.pr-side .chips .chip{font-size:.86rem}
.pr-side .chips{margin-bottom:8px}
.pr-sl output{color:var(--ink)}
.pr-sl{margin-top:4px}
.pr-how{margin:8px 0 6px}
.pr-zrow{margin:4px 0 12px}
.pr-read{margin-top:8px}
.pr-read > div{padding:7px 0}
/* Part 3 */
.p3-st:first-child{margin-top:0;padding-top:0;border-top:0}
.p3-st h3{margin-top:0}
.pr-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.pr-col{min-width:0;border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px}
.pr-col.ok{border-color:var(--green)}
.pr-col h4{margin:0 0 6px;color:var(--ink-2);font-size:.9rem}
.pr-line{margin:4px 0;overflow-wrap:anywhere}
.pr-line .m{white-space:normal}
.pr-ask{margin:10px 0 4px;font-weight:700}
.pr-race{margin:10px 0 4px}
.pr-same{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:8px 0;background:var(--sheet)}
.pr-same .chips{margin:0}
.pr-s3row{margin:0 0 12px}
.pr-pred{border-top:1px solid var(--rule);padding-top:10px}
.pr-pred .chips{margin-bottom:6px}
/* V8 coefficient boxes */
.cb-frame{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-family:var(--font-math);font-size:1.15rem;margin:6px 0 2px}
.cb-frame > .m{font-size:1em}
input.numin.cb-in{width:3.4em;padding:.25em .3em;text-align:center;font-size:1.05rem}
input.numin.cb-in.cb-sup{width:2.6em;font-size:.85rem;padding:.15em .2em}
.cb-frame > sup{align-self:flex-start;line-height:1;margin-top:-4px}
.cb-word{font-family:var(--font-ui);font-size:.95rem;font-weight:700;margin-right:2px}
.cb-frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px}
.cb-fn,.cb-fd{display:flex;align-items:center;gap:4px;padding:3px 4px}
.cb-fn{border-bottom:2px solid var(--ink)}
/* task */
.pr-tk{display:grid;gap:8px;margin:4px 0 12px}
.pr-tkrow{display:flex;align-items:center;gap:8px}
.pr-tklab{min-width:1.4em;font-size:1.25rem}
.pr-tkrow .btn{min-width:40px;font-size:1.1rem}
.pr-tkrow .numin.short{width:5rem;text-align:center}
.pr-tkeq{font-size:clamp(1.15rem,3.2vw,1.5rem);margin:0 0 6px}
@media (max-width:820px){
  .pr-ex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .pr-cols{grid-template-columns:minmax(0,1fr)}
  .cb-frame{gap:3px;font-size:1.05rem}
  input.numin.cb-in{width:2.7em;padding:.25em .15em}
  .pr-same{position:sticky;bottom:0;z-index:2;border-top:1.5px solid var(--rule);padding:8px 4px}
  canvas.plot.pr-top{aspect-ratio:auto;height:210px}
  canvas.plot.pr-low{aspect-ratio:auto;height:180px}
}

teps":["A rectangle with width `f(x)` (blue edge) and height `g(x)` (teal edge).","Nudge `x` forward. The rectangle grows a strip along the top (`fΔg`), a strip down the side (`gΔf`) and a small corner square (`ΔfΔg`).","Shrink `Δx`. The strips thin in proportion…","…but the corner shrinks much faster…","…and fades out.","Divide by `Δx` and let it shrink: the top strip gives `fg′`, the side strip gives `f′g`, and the corner gives 0. So `(fg)′ = f′g + fg′`."]},"goals":["I can state the product rule and explain it with the growing rectangle.","I can verify the product rule by expanding and differentiating a product of polynomials.","I can apply the product rule to products of polynomial and power functions, including radicals.","I can use the product rule to find tangent lines and horizontal tangents.","I can extend the rule to three factors and to `[f(x)]^2`, and use given values of `f`, `f′`, `g`, `g′`.","I can apply the product rule to rates in context, such as revenue = price × quantity."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Power rule","goal":3,"prompt":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `(3x^4 - 2x)` = ?","options":[{"t":"`12x^3`","why":"You dropped the linear term’s derivative: `-2x → -2`.","_n":"0aa5","_k":"81115813"},{"t":"`12x^4 - 2`","why":"Lower the exponent by 1: `x^4` becomes `4x^3`.","_n":"1a75","_k":"1b810b30"},{"t":"`12x^3 - 2`","why":"Term by term: `3 × 4x^3` and −2.","_n":"2a85","_k":"da9ae967"},{"t":"`3x^3 - 2`","why":"Multiply by the exponent too: `3 × 4 = 12`.","_n":"3a55","_k":"56e05e94"}],"hints":["Term by term.","`3 × 4x^3` and −2.","`12x^3 - 2`."]},{"id":"w2","skill":"Power rule","goal":3,"prompt":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `(x^{3/2})` = ?","options":[{"t":"`x^{1/2}`","why":"You forgot the factor 3/2 that comes down from the exponent.","_n":"4a65","_k":"ca7f6178"},{"t":"`(2/3)x^{1/2}`","why":"Bring down 3/2 as it is; don’t flip it.","_n":"5a35","_k":"d1ccf2d0"},{"t":"`(3/2) `.","_n":"j6ad","_k":"7bdabde4"}],"hints":["Point (1, 2), slope 5.","`y - 2 = 5(x - 1)`.","`y = 5x - 3`."]},{"id":"w6","skill":"Tangent lines","goal":4,"prompt":"Where does a graph have a horizontal tangent?","options":[{"t":"Where `f(x) = 0`","why":"That’s where the height is 0, not the slope.","_n":"k6bd","_k":"87e53b81"},{"t":"Where `f(x) = f′(x)`","why":"That equation has no special meaning here. Horizontal means slope 0.","_n":"l6cd","_k":"2e67abfb"},{"t":"Where `f′(x) = 0`","why":"Horizontal means slope 0, and the slope is `f′(x)`.","_n":"m6dd","_k":"f258463e"},{"t":"Where `f′(x)` is undefined","why":"That’s a corner, cusp or vertical tangent.","_n":"n66d","_k":"263ede2c"}],"hints":["Horizontal means slope 0.","The slope is `f′(x)`.","`f′(x) = 0`."]}],"refreshers":{"Power rule":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `(x^n) = nx^{n-1}`; rewrite roots and reciprocals as powers first (module 09).","Expanding":"Multiply every term of one bracket by every term of the other, then collect like terms.","Tangent lines":"Point `(a, f(a))`, slope `f′(a)`: `y - f(a) = f′(a)(x - a)`. Horizontal tangents are where `f′(x) = 0`."}}},"explore":{"heading":"Growing rectangle","intro":"A rectangle has width `f(x)` and height `g(x)`. Nudge `x` and watch where the new area comes from. Then shrink the nudge.","pairs":[{"id":"P1","chip":"\u003cstrong>P1\u003c/strong> `f = x + 1`, `g = x^2`","eq":"`f(x) = x + 1`, `g(x) = x^2`"},{"id":"P2","chip":"\u003cstrong>P2\u003c/strong> `f = 2x`, `g = x + 3`","eq":"`f(x) = 2x`, `g(x) = x + 3`"},{"id":"P3","chip":"\u003cstrong>P3\u003c/strong> `f = x^2`, `g = √x`","eq":"`f(x) = x^2`, `g(x) = √x`"},{"id":"P4","chip":"\u003cstrong>P4\u003c/strong> `f = x`, `g = x` (a square)","eq":"`f(x) = x`, `g(x) = x` (a square)"},{"id":"B","chip":"\u003cstrong>Build\u003c/strong> `f = x`, choose `g`","eq":"Build: `f(x) = x`, `g(x)` = ?"},{"id":"K","chip":"\u003cstrong>Tune `k`\u003c/strong> `f = x^2`, `g = x - k`","eq":"`f(x) = x^2`, `g(x) =  Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Differentiate `(x^2 + 1)(3x - 2)`.","steps":["Let `f = x^2 + 1` and `g = 3x - 2`.","`f′ = 2x` and `g′ = 3`.","`(fg)′ = f′g′ = 6x`."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"`(fg)′ = f′g + fg′ = 2x(3x - 2) + 3(x^2 + 1) = 9x^2 - 4x + 3`.","why":"Expand to check: `3x^3 - 2x^2 + 3x - 2` has derivative `9x^2 - 4x + 3`.","_n":"1of3d","_k":"322a3d18"},{"t":"`(fg)′ = f′g′ + fg`.","why":"Each term has exactly one derivative in it.","_n":"1pf4d","_k":"bea69b3f"},{"t":"Step 3 is correct.","why":"Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`. Expand to check: `3x^3 - 2x^2 + 3x - 2` has derivative `9x^2 - 4x + 3`.","_n":"1qf5d","_k":"3a65bf8b"},{"t":"`(fg)′ = f′g = 2x(3x - 2)`.","why":"Both factors change, so there are two terms: `f′g` \u003cstrong>and\u003c/strong> `fg′`.","_n":"1rf6d","_k":"e71db91f"}],"hints":["Test the rule on `x · x`.","`f′g′` gives 1, but `(x^2)′ = 2x`.","Use `f′g + fg′`."]},{"id":"e2","goal":4,"task":"Find the tangent to `y = x^3(x - 2)` at `x = 1`.","steps":["`y′ = 3x^2(x - 2) + x^3(1)`.","At `x = 1`: `3(1)(-1) + 1 = -2`.","`y(1) = 1 × (-1) = -1`.","So the slope is −1: `y + 1 = -1(x - 1)`.","`y = -x`."],"_a":"Ug==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4."],"fixes":[{"t":"Step 4 is correct.","why":"`y(1)` is the height of the product, not its slope.","_n":"1sf7d","_k":"fbbb202b"},{"t":"`y = -2x - 1`.","why":"Check: at `x = 1` this gives −3, not −1.","_n":"1tf8d","_k":"98852737"},{"t":"`y - 1 = -2(x + 1)`.","why":"The point is (1, −1).","_n":"1uf9d","_k":"ecb7310b"},{"t":"The slope is `y′(1) = -2`, not `y(1) = -1`: `y + 1 = -2(x - 1)`, so `y = -2x + 1`.","why":"Use slope −2 through (1, −1).","_n":"1vead","_k":"61e38fc2"}],"hints":["Which line found the slope?","Step 2: −2.","Use slope −2 through (1, −1)."]},{"id":"e3","goal":3,"task":"Differentiate `(5 - 2x)^2` with the product rule.","steps":["`(5 - 2x)^2 = (5 - 2x)(5 - 2x)`.","`f = g = 5 - 2x`, so `f′ = g′ = 2`.","`(fg)′ = 2(5 - 2x) + (5 - 2x)(2) = 20 - 8x`."],"_a":"UA==","stepFb":["Step 1 is correct.","","Step 3 applies the rule correctly to step 2’s values."],"fixes":[{"t":"`f′ = 5 - 2 = 3`.","why":"The derivative of 5 is 0.","_n":"1webd","_k":"4ef3ca9b"},{"t":"`f′ = g′ = -2`, so `(fg)′ = -2(5 - 2x) - 2(5 - 2x) = 8x - 20`.","why":"Check by expanding `25 - 20x + 4x^2`: its derivative is `-20 + 8x`.","_n":"1xf8d","_k":"596db1c8"},{"t":"`(5 - 2x)^2 = 25 + 4x^2`, so the derivative is `8x`.","why":"The middle term `-20x` is missing.","_n":"1yf7d","_k":"8e293cc1"},{"t":"Step 2 is correct.","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `(5 - 2x) = -2`. Keep the sign.","_n":"1zf6d","_k":"ad070ab7"}],"hints":["What is the slope of `5 - 2x`?","−2.","Both terms are `-2(5 - 2x)`: total `8x - 20`. Check by expanding `25 - 20x + 4x^2`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the growing rectangle: how quickly the corner disappeared, or how far `f′g′` was from the truth?"},{"id":"j2","q":"In your own words, why does the product rule have two terms?"},{"id":"j3","q":"Explain to a friend when you’d expand instead of using the product rule, and when you wouldn’t."},{"id":"j4","q":"Which part still slips (choosing `f` and `g`, signs, or simplifying)? What will you check next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"The product rule says `(fg)′` = …","options":[{"t":"`f′g′ + fg`","why":"Each term has exactly one derivative in it.","_n":"20f5d","_k":"02610903"},{"t":"`f′g + fg′`","why":"Differentiate the first factor and keep the second, then keep the first and differentiate the second.","_n":"21fcd","_k":"0e6793e3"},{"t":"`f′g - fg′`","why":"That minus sign belongs to the quotient rule (module 11).","_n":"22fbd","_k":"60107d8e"},{"t":"`f′g′`","why":"Check wit  horizontal tangents?","options":[{"t":"`x = 0` only","why":"Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`. Here `f′g′ = 2x`.","_n":"2sf5e","_k":"8040135f"},{"t":"`x = 0` and `x = -1`","why":"`3x^2 + 6x = 3x(x + 2)`.","_n":"2tf4e","_k":"93876ac9"},{"t":"`x = 0` and `x = -2`","why":"`y′ = 2x(x + 3) + x^2 = 3x(x + 2)`.","_n":"2uf3e","_k":"aad4b87c"},{"t":"`x = 0` and `x = -3`","why":"Those are where `y = 0`.","_n":"2vf2e","_k":"41918f55"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`f(1) = 2`, `f′(1) = 3`, `g(1) = -1`, `g′(1) = 4`. Find `(fg)′(1)`.","options":[{"t":"−3","why":"Both factors change, so there are two terms: `f′g` \u003cstrong>and\u003c/strong> `fg′`.","_n":"2wf1e","_k":"1c9721af"},{"t":"−2","why":"That’s `f(1)g(1)`. `f(a)g(a)` is the height of the product, not its slope.","_n":"2xf0e","_k":"82725fc9"},{"t":"5","why":"`3(-1) + 2(4)`.","_n":"2yefe","_k":"500324c0"},{"t":"12","why":"Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`.","_n":"2zfee","_k":"cb4bbeb6"}]},"b":{"prompt":"`f(2) = -3`, `f′(2) = 2`, `g(2) = 5`, `g′(2) = -1`. Find `(fg)′(2)`.","options":[{"t":"−15","why":"That’s `f(2)g(2)`. `f(a)g(a)` is the height of the product, not its slope.","_n":"30fde","_k":"258f52d2"},{"t":"−2","why":"Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`.","_n":"31f0e","_k":"df82e94f"},{"t":"10","why":"Both factors change, so there are two terms: `f′g` \u003cstrong>and\u003c/strong> `fg′`.","_n":"32f1e","_k":"f62b5ecd"},{"t":"13","why":"`2(5) + (-3)(-1)`.","_n":"33f2e","_k":"cc2b525c"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"`p(x) = [f(x)]^2`, with `f(3) = -2` and `f′(3) = 5`. Find `p′(3)`.","options":[{"t":"−20","why":"`p = f · f`, so `p′ = 2ff′ = 2(-2)(5)`.","_n":"34f3e","_k":"a306a22e"},{"t":"−4","why":"`[f]^2 = f · f`, so its derivative is `f′f + ff′ = 2ff′`. `2f` alone forgets `f′`.","_n":"35ece","_k":"3828793d"},{"t":"10","why":"That’s `2f′`; you need `f` too.","_n":"36ede","_k":"564ebb59"},{"t":"25","why":"That’s `[f′]^2`.", s exactly one derivative in it.","_n":"3j7ae","_k":"cb6d4856"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which line correctly starts differentiating `y = √x(x^2 - 1)`?","options":[{"t":"`y′ = √x(2x) - ({1}/{2√x})(x^2 - 1)`","why":"The product rule adds; the minus is from the quotient rule.","_n":"3k79e","_k":"43cf00c3"},{"t":"`y′ = ({1}/{2√x})(2x)`","why":"Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`.","_n":"3lfce","_k":"66de6929"},{"t":"`y′ = ({1}/{2√x})(x^2 - 1) + √x(2x)`","why":"`f′g + fg′` with `f = √x` and `g = x^2 - 1`.","_n":"3mfde","_k":"b7ffd23c"},{"t":"`y′ = ({1}/{2√x})(x^2 - 1)`","why":"Both factors change, so there are two terms: `f′g` \u003cstrong>and\u003c/strong> `fg′`.","_n":"3nfae","_k":"83f31149"}]},"b":{"prompt":"Which line correctly starts differentiating `y = x^{-1}(x^3 + 2)`?","options":[{"t":"`y′ = -x^{-2}(3x^2)`","why":"Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`.","_n":"3ofbe","_k":"cb25750b"},{"t":"`y′ = -x^{-2}(x^3 + 2) + x^{-1}(3x^2)`","why":"`f′g + fg′` with `f = x^{-1}`, so `f′ = -x^{-2}`.","_n":"3p00e","_k":"908cd7ff"},{"t":"`y′ = -x^{-1}(x^3 + 2) + x^{-1}(3x^2)`","why":"\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `(x^{-1}) = -x^{-2}`, not `-x^{-1}`.","_n":"3q01e","_k":"48c65cb4"},{"t":"`y′ = -x^{-2}(x^3 + 2)`","why":"Both factors change, so there are two terms: `f′g` \u003cstrong>and\u003c/strong> `fg′`.","_n":"3rfee","_k":"0177cd81"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A theatre’s revenue is `R = p · q`. The ticket price is $40 and rising at $2 per month; 500 tickets are sold per month, and that number is falling by 10 per month. How fast is revenue changing?","options":[{"t":"$20 000 per month","why":"That’s the revenue itself.","_n":"3sffe","_k":"9af4dbcb"},{"t":"Falling at $20 per month","why":"That’s `p′q′ = 2 × (-10)`. Revenue changes because price changes (`p′q`) \u003cstrong>and\u003c/strong> because sales change (`pq′`).","_n":"3tf4e","_k":"1e30a4de"},{"t":"Rising at $1000 per month","why":"That’s only the price effect, `p′q`. Revenue changes because price changes (`p′q`) \u003cstrong>and\u003c/strong> because sales change (`pq′`).","_n":"3uf5e","_k":"d1564d3a"},{"t":"Rising at $600 per month","why":"`R′ = p′q + pq′ = 2(500) + 40(-10)`.","_n":"3v7ed","_k":"028c45de"}]},"b":{"prompt":"The price of a class is $15 and rising at $1 per month; 800 people sign up per month, and that number is falling by 40 per month. How fast is revenue changing?","options":[{"t":"Rising at $800 per month","why":"That’s only the price effect, `p′q`. Revenue changes because price changes (`p′q`) \u003cstrong>and\u003c/strong> because sales change (`pq′`).","_n":"3w7dd","_k":"a6ab62a9"},{"t":"$12 000 per month","why":"That’s the revenue itself.","_n":"3x7cd","_k":"bc109fe5"},{"t":"Rising at $200 per month","why":"`1(800) + 15(-40)`.","_n":"3y7bd","_k":"e8304c2a"},{"t":"Falling at $40 per month","why":"That’s `p′q′ = 1 × (-40)`. Revenue changes because price changes (`p′q`) \u003cstrong>and\u003c/strong> because sales change (`pq′`).","_n":"3z82d","_k":"8d90be47"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A rectangle has length `L(t) = 2t + 3` cm and width `W(t) = t^2` cm at time `t` s. How fast is its area growing at `t` = 1 s?","options":[{"t":"12 cm²/s","why":"`A′ = L′W + LW′ = 2(1) + 5(2)`.","_n":"4081d","_k":"3a43872c"},{"t":"5 cm²/s","why":"That’s the area at `t = 1`, not its rate.","_n":"4180d","_k":"b8dc80d7"},{"t":"10 cm²/s","why":"Only `LW′`. Both factors change, so there are two terms: `f′g` \u003cstrong>and\u003c/strong> `fg′`.","_n":"427fd","_k":"2372bb07"},{"t":"4 cm²/s","why":"`L′W′ = 2 × 2`. Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`.","_n":"4376d","_k":"126a03e6"}]},"b":{"prompt":"A rectangle has length `L(t) = 3t + 1` cm and width `W(t) = t^2` cm. How fast is its area growing at `t` = 1 s?","options":[{"t":"6 cm²/s","why":"`L′W′ = 3 × 2`. Check with `x · x = x^2`: `f′g′ = 1`, but `(x^2)′ = 2x`.","_n":"4475d","_k":"8e1b967e"},{"t":"11 cm²/s","why":"`3(1) + 4(2)`.","_n":"4578d","_k":"ffe1744d"},{"t":"4 cm²/s","why":"That’s the area at `t = 1`, not its rate.","_n":"4679d","_k":"f539007c"},{"t":"8 cm²/s","why":"Only `LW′`. Both factors change, so there are two terms: `f′g` \u003cstrong>and\u003c/strong> `fg′`.","_n":"477ad","_k":"a9c41fdd"}]}}]},"task":{"title":"Flat at `x = 1`","summary":"Flat at x = 1","statement":"\u003cp>Design `y = (x + p)(x^2 + q)` that meets every condition. Find all the answers.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The graph has a horizontal tangent at `x = 1`.\u003c/li>\u003cli>The graph has exactly three different `x`-intercepts.\u003c/li>\u003cli>The `y`-intercept is negative.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers from −12 to 12 for `p` and `q`. The graph shows the tangent at `x = 1`; the readout gives `y′ = (x^2 + q) + 2x(x + p)` and the `x`-intercepts.\u003c/p>","checks":["Horizontal tangent at `x = 1`","Exactly three different `x`-intercepts","Negative `y`-intercept"],"tips":["Use the product rule: `y′(1) = (1 + q) + 2(1 + p)`.","`x^2 + q` gives two intercepts only if `q \u003c 0`; make sure `-p` isn’t one of them.","The `y`-intercept is `p × q`."],"explainPrompt":"Explain how the product rule gave the condition `3 + 2p + q = 0`, and why (3, −9) doesn’t work.","vocab":"Use the words product rule, horizontal tangent, factor and intercept.","after3":"Line 1 gives `q = -3 - 2p`. Lines 2 and 3 need `q \u003c 0 \u003c p`. (3, −9) fails line 2 because −3 is a root of both factors."},"cards":[["Product rule","`(fg)′ = f′g + fg′`."],["Leibniz form","\u003cspan class=\"m\">d/d\u003ci>x\u003c/i>\u003c/span> `(uv) = u′v + uv′`."],["Not `f′g′`","Test: `x · x = x^2`. `f′g′ = 1`, but `(x^2)′ = 2x`."],["Growing rectangle","New area = `fΔg + gΔf + ΔfΔg`; the corner vanishes in the limit."],["Three factors","`(fgh)′ = f′
