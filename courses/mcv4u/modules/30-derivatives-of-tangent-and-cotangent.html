.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 30: Steep tangent (V5 two-panel slope tool with asymptotes, marks, candidates, Derive it step-through),
   Using the trig derivatives stations (V8 frame, drone and shadow SVGs), Exact slopes frames, Two flat spots task */
.tn-heq2{display:block;margin-top:.3em;font-size:.82em}
.tn-hero canvas.plot.tn-htop{aspect-ratio:16/10}
.tn-hero canvas.plot.tn-hlow{aspect-ratio:16/7;margin-top:6px}
.tn-ex{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.tn-main,.tn-side{min-width:0}
.tn-eq{min-height:1.6em}
canvas.plot.tn-top{aspect-ratio:16/11;touch-action:none}
canvas.plot.tn-low{aspect-ratio:16/7;margin-top:6px}
.tn-key{margin:8px 0 0}
.tn-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.tn-h{font-weight:700;margin:10px 0 4px}
.tn-ctl .tn-h{margin:0;min-width:4.6rem}
.tn-sl{margin-top:4px}
.tn-sl input{width:100%;min-height:28px}
.tn-sl output{color:var(--ink);font-weight:700}
.tn-note{margin:4px 0 0}
.tn-ang{gap:6px;margin:0}
.tn-mk{margin:10px 0 4px}
.tn-marks{margin:4px 0 0}
.tn-ml{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tn-ml li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:4px 8px;border:1.5px solid var(--rule);border-radius:8px}
.tn-mx{min-width:5.5rem}
.tn-rad{display:inline-flex;gap:6px}
.tn-rad .chip{min-height:32px}
.tn-rm{margin-left:auto}
.tn-mmsg{margin:6px 0 0;color:var(--ink-2)}
.tn-side dl.read.tn-read{margin-top:16px}
.tn-ph{font-weight:700;margin:12px 0 6px}
.tn-cand .chips{gap:6px}
.tn-cst{margin:8px 0 0;min-height:1.4em}
.tn-ok{color:var(--green)}
.tn-derive{margin-top:4px}
.tn-dl{list-style:none;margin:8px 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tn-dl li{padding:6px 10px;border-left:4px solid var(--rule);border-radius:0 8px 8px 0}
.tn-dl li.cur{border-left-color:var(--hi);background:var(--info-bg)}
.tn-dline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.tn-dn{font-weight:700;color:var(--ink-2)}
.tn-dt{font-size:1.08rem;overflow-x:auto;min-width:0;max-width:100%;padding-bottom:2px}
.tn-dline .btn{margin-left:auto}
.tn-dres{margin:6px 0 0;font-size:.95rem}
/* Part 3 */
.tn-st h3{margin-top:0}
.tn-st:first-child{margin-top:0;padding-top:0;border-top:0}
.tn-stg{align-items:start}
.tn-frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.1rem;margin:4px 0 8px}
.tn-frame .numin.short{width:3.9rem}
.tn-frame .numin.short.tn-den{width:3.2rem}
.tn-fl{white-space:nowrap}
.tn-svg{display:block;width:100%;max-width:420px;height:auto;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px}
.tn-sg{stroke:var(--ink-2);stroke-width:2}
.tn-so{fill:var(--ink)}
.tn-ssight{stroke:var(--ink-2);stroke-width:1.8;stroke-dasharray:6 5}
.tn-sarc{fill:none;stroke:var(--ink);stroke-width:1.8}
.tn-stx{fill:var(--ink);font:600 13px var(--font-ui)}
.tn-sth{font:italic 600 15px var(--font-math)}
.tn-sh{stroke:var(--ink);stroke-width:2}
.tn-sra{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.tn-sdr{fill:var(--pen)}
.tn-srot{stroke:var(--pen);stroke-width:2.4;stroke-linecap:round}
.tn-sray{stroke:var(--ink-2);stroke-width:1.8;stroke-dasharray:6 5}
.tn-sun{fill:var(--hi);stroke:var(--ink-2);stroke-width:1.2}
.tn-sshadow{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.tn-spole{stroke:var(--pen);stroke-width:5;stroke-linecap:round}
.tn-play{display:flex;gap:8px;margin:10px 0 2px}
.tn-q{margin:12px 0 0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.tn-qq{margin:0 0 6px}
.tn-qrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tn-qrow .numin.short{width:5.4rem}
.tn-unit{color:var(--ink-2)}
.tn-qfb .fb{margin:8px 0 0}
/* Practice 2 */
.tn-dq .tn-frame{margin:6px 0 4px}
/* task */
.fs-in{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.fs-step{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.fs-step label{min-width:8.5rem}
.fs-step .numin.short{width:4.4rem}
.fs-step .btn{min-width:40px;min-height:40px}
.fs-gh{font-weight:700;margin:10px 0 4px}
@media (max-width:820px){
  .tn-ex{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  canvas.plot.tn-top{aspect-ratio:1/1}
  canvas.plot.tn-low{aspect-ratio:16/10}
  .tn-frame{font-size:1rem}
  .tn-frame .numin.short{width:3.4rem}
  .tn-frame .numin.short.tn-den{width:2.9rem}
  .tn-dline .btn{margin-left:0}
  .tn-dt{flex:1 1 100%;font-size:.95rem}
  .tn-frame .numin.short.tn-pib{width:3rem}
}

efined","fb":"`{ds}/{dθ} = -6 csc^2 θ \u003c 0`.","_n":"1j7a4","_k":"f5f4b570"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Function ↔ derivative","summary":"Function ↔ derivative","goal":2,"instruction":"Match each function with its derivative. One card on the right has no partner.","leftTitle":"Function","rightTitle":"Derivative","left":[{"id":"l1","t":"`tan(3x)`"},{"id":"l2","t":"`cot(x/2)`","hints":["Inside `x/2` has derivative 1/2.","`-csc^2(x/2) · (1/2)`.","`-(1/2) csc^2(x/2)`."]},{"id":"l3","t":"`tan^2 x`","hints":["Write it as `(tan x)^2`.","`2 tan x · (tan x)′`.","`2 tan x sec^2 x`."]},{"id":"l4","t":"`x tan x`"},{"id":"l5","t":"`tan(x^2)`"},{"id":"l6","t":"`tan x + cot x`"}],"right":[{"id":"r1","t":"`3 sec^2(3x)`"},{"id":"r2","t":"`-(1/2) csc^2(x/2)`"},{"id":"r3","t":"`2 tan x sec^2 x`"},{"id":"r4","t":"`tan x + x sec^2 x`"},{"id":"r5","t":"`2x sec^2(x^2)`"},{"id":"r6","t":"`sec^2 x - csc^2 x`"},{"id":"r7","t":"`(1/2) csc^2(x/2)`"}],"_a":"QkEJCEYDFEsIQUkbCAsUAxsRVxtIG1oKG1lHS1cbGhtVV0cDRksCGxVBCQxGAxRLDEFJGwgPFAMbEVMbGQ==","wrong":{"l3|r5":"`tan^2 x = (tan x)^2`; `tan(x^2)` has `x^2` inside.","l5|r3":"`tan^2 x = (tan x)^2`; `tan(x^2)` has `x^2` inside.","l2|r7":"`cot`’s derivative is negative.","l4|r1":"`x tan x` is a product: use the product rule."},"wrongDefault":"Outside derivative, inside kept, times the inside’s derivative."},{"id":"slopes","type":"custom","title":"Exact slopes and tangent lines","summary":"Exact slopes and tangent lines","star":true,"goal":[2,3,4],"instruction":"Give exact slopes, tangent lines and `x`-values. Items 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type whole numbers or fractions in the boxes (`√3` is allowed). A blank box in front of π means 1; a blank bottom box means 1. Then press Check.","msgs":{"fill":"Fill in every box first.","err":"Type exact numbers only, such as 3, −4/3 or √3.","dec":"Give the exact value: whole numbers or fractions, not decimals.","piIn":"The π is neral":"Not yet. Solve `-csc^2 x = -4/3`: `sin^2 x = 3/4`.","why":"`csc^2 x = 4/3` means `sin x = √3/2`: `x = π/3` or `2π/3`."},{"id":"t5","goal":3,"star":true,"prompt":"`y = tan x - 2x` on `(-π/2, π/2)`: at what `x` is the local minimum?","form":"pi1","parts":["`x =`",{"k":"p","pi":true},"π /",{"k":"q","den":true}],"_a":"QkETG14JGA4BVlYAXAgACgpaUg1QAQVE","display":"`x = π/4`","wrong":[{"v":-0.7853981633974483,"fb":"That’s the local maximum: `y′ = sec^2 x - 2` goes + to − there."}],"general":"Not yet. Set `y′ = sec^2 x - 2 = 0` and test the signs.","why":"`y′ = sec^2 x - 2` is − on `(-π/4, π/4)` and + after `π/4`: a minimum at `π/4`.","hints":["`y′ = sec^2 x - 2 = 0`.","`cos^2 x = 1/2`, so `x = ±π/4`.","Signs of `y′`: − on `(-π/4, π/4)`, + after `π/4`: a minimum at `π/4`."]},{"id":"t6","goal":4,"star":true,"prompt":"The tangent to `y = tan x` at `x = π/4` crosses the `x`-axis where?","form":"piMinusFrac","parts":["`x =`",{"k":"p","pi":true},"π /",{"k":"q","den":true},"−",{"k":"a"},"/",{"k":"b","den":true}],"_a":"QkETG14JGAsBVlYAXAgACgpaUg1QAQVE","display":"`x = π/4 - 1/2`","wrong":[],"general":"The tangent is `y = 2x + 1 - π/2`. Set `y = 0`.","why":"`0 = 2x + 1 - π/2`, so `x = π/4 - 1/2`.","hints":["Write the tangent first.","`y = 2x + 1 - π/2`.","`0 = 2x + 1 - π/2`, so `x = π/4 - 1/2`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Dmitri","how":"","goal":[1,4],"instruction":"Dmitri made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Show that `d/dx tan x = sec^2 x`.","steps":["`tan x = sin x/cos x`.","Quotient rule: `{(cos x)(cos x) - (sin x)(-sin x)}/{cos^2 x}`.","`= {cos^2 x - sin^2 x}/{cos^2 x}`.","`= 1 - tan^2 x`."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 simplifies step 3 correctly."],"fixes":[{"t":"Step 3 is correct.","why":"Minus a negative is plus.","_n":"1k7b4","_k":"16067052"},{"t":"`cos^2 x - sin^2 x = 1`, so the answer is `sec^2 x`.","why":"`cos^2 x - sin^2 x` is `cos 2x`, not 1.","_n":"1l7c4","_k":"bf657c10"},{"t":"`= {cos 2x}/{cos^2 x}`.","why":"That keeps the sign mistake, just renamed.","_n":"1m7d4","_k":"9484b666"},{"t":"`= {cos^2 x + sin^2 x}/{cos^2 x} = {1}/{cos^2 x} = sec^2 x`.","why":"`cos x · cos x - sin x · (-sin x)`: minus a negative is plus.","_n":"1n865","_k":"46eb0d66"}],"hints":["Look at `- (sin x)(-sin x)`.","That’s `+ sin^2 x`.","`cos^2 x + sin^2 x = 1`."]},{"id":"e2","goal":4,"task":"Find the slope of `y = cot(2x)` at `x = π/8`.","steps":["`y′ = -csc^2(2x) · 2`.","At `x = π/8`, `2x = π/4`.","`csc(π/4) = √2/2`.","`y′ = -2(√2/2)^2 = -2 · 1/2 = -1`."],"_a":"Cw==","stepFb":["Step 1 is correct: chain factor 2.","Step 2 is correct.","","Step 4 uses step 3’s value correctly."],"fixes":[{"t":"`csc(π/4) = 1`.","why":"That’s `tan(π/4)`.","_n":"1o855","_k":"294c15af"},{"t":"`csc(π/4) = √2/2`, but square it to 1/4.","why":"`√2/2` is `sin(π/4)`, and `(√2/2)^2 = 1/2`.","_n":"1p885","_k":"912736f9"},{"t":"Step 3 is correct.","why":"`√2/2` is `sin(π/4)`; csc is its reciprocal.","_n":"1q875","_k":"31d7fcc3"},{"t":"`csc(π/4) = 1/sin(π/4) = √2`, so `y′ = -2 · 2 = -4`.","why":"csc is the reciprocal of sin: `csc(π/4) = √2` and `csc^2(π/4) = 2`.","_n":"1r8a5","_k":"ba462ab5"}],"hints":["`csc = 1/sin`.","`sin(π/4) = √2/2`.","`csc(π/4) = √2`; `csc^2 = 2`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the tangent graph: that the slope never drops below 1, or that `sec^2 x` and `1 + tan^2 x` gave the same curve?"},{"id":"j2","q":"In your own words, why does the quotient rule for `sin x/cos x` simplify so neatly?"},{"id":"j3","q":"Explain to a friend how to remember the signs of the tan and cot derivatives by looking at their graphs."},{"id":"j4","q":"What part of using these derivatives in angle problems are you unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"`d/dx (3 tan x)` = ?","options":[{"t":"`-3 sec^2 x`","why":"tan rises: positive derivative.","_n":"1s895","_k":"7f29053f"},{"t":"`3 sec^2 x`","why":"`d/dx tan x = sec^2 x`, times 3.","_n":"1t8c5","_k":"99ce3981"},{"t":"`3 sec x tan x`","why":"That’s the derivative of `3 sec x`.","_n":"1u8b5","_k":"22a7e196"},{"t":"`3 sec x`","why":"sec is squared. `tan x = sin x/cos x`; the quotient rule gives `1/cos^2 x = sec^2 x`: squared, and positive.","_n":"1v7e5","_k":"5ac9d1d3"}]},"b":{"prompt":"`d/dx (5 cot x)` = ?","options":[{"t":"`-5 csc x cot x`","why":"That’s the derivative of `5 csc x`.","_n":"1w7d5","_k":"017c3d7b"},{"t":"`5 csc^2 x`","why":"`cot x` falls everywhere, so its derivative is negative: `-csc^2 x`.","_n":"1x805","_k":"6db027b9"},{"t":"`-5 csc^2 x`","why":"`d/dx cot x = -csc^2 x`, times 5.","_n":"1y815","_k":"5da2c3be"},{"t":"`-5 sec^2 x`","why":"cot pairs with csc.","_n":"1z7e5","_k":"03980ebf"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`d/dx tan(4x)` = ?","options":[{"t":"`4 sec(4x)`","why":"sec is squared. `tan x = sin x/cos x`; the quotient rule gives `1/cos^2 x = sec^2 x`: squared, and positive.","_n":"207f5","_k":"f2433bdf"},{"t":"`4 sec^2 x`","why":"Keep the inside `4x`.","_n":"217c5","_k":"1482fdb3"},{"t":"`sec^2(4x)`","why":"The inside `4x` changes 4 times as fast: `4 sec^2(4x)`.","_n":"227d5","_k":"441d148b"},{"t":"`4 sec^2(4x)`","why":"The inside `4x` changes 4 times as fast, and the sec is squared.","_n":"237a5","_k":"c491dca4"}]},"b":{"prompt":"`d/dx cot(3x)` = ?","options":[{"t":"`-3 csc^2 x`","why":"Keep the inside `3x`.","_n":"247b5","_k":"07357257"},{"t":"`-csc^2(3x)`","why":"The inside `3x` changes 3 times as fast: `-3 csc^2(3x)`.","_n":"25885","_k":"5fe8baa9"},{"t":"`3 csc^2(3x)`","why":"`cot x` falls everywhere, so its derivative is negative: `-csc^2 x`.","_n":"26895","_k":"3550976f"},{"t":"`-3 csc^2(3x)`","why":"The inside `3x` changes 3 times as fast, and cot’s derivative is negative.","_n":"27026","_k":"2826596b"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"What is the slope of `y = tan x` at `x = π/3`?","options":[{"t":"4/3","why":"That’s `sec^2(π/6)`.","_n":"28016","_k":"5a4ee4a4"},{"t":"`√3`","why":"That’s `tan(π/3)`, the height.","_n":"29006","_k":"ce8e5d4c"},{"t":"4","why":"`sec^2(π/3) = 2^2 = 4`.","_n":"2aff6","_k":"a956afbb"},{"t":"2","why":"That’s `sec(π/3)`; square it.","_n":"2bfe6","_k":"8606283c"}]},"b":{"prompt":"What is the slope of `y = tan x` at `x = -π/6`?","options":[{"t":"`-1/√3`","why":"That’s `tan(-π/6)`, the height.","_n":"2cfd6","_k":"a9e8ae98"},{"t":"4/3","why":"`sec^2(-π/6) = 4/3`: squaring removes the sign.","_n":"2dfc6","_k":"71bb10df"},{"t":"−4/3","why":"tan is odd, but its slope `sec^2 x` is never negative.","_n":"2efb6","_k":"df96a710"},{"t":"`2/√3`","why":"That’s `sec(-π/6)`; square it.","_n":"2f0a6","_k":"e69dca02"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Which statement about `y = tan x` on `(-π/2, π/2)` is true?","options":[{"t":"It has a local minimum at `x = 0`, where its slope is 0.","why":"The slope at 0 is 1. At `x = 0` the slope is `sec^2 0 = 1`, not 0. `tan x` never levels off.","_n":"2g096","_k":"aff95bcf"},{"t":"Its slope is greatest at `x = 0`.","why":"That’s where it’s least.","_n":"2hfc6","_k":"80f70828"},{"t":"Its slope is negative for `x \u003c 0`.","why":"The height is negative there; the slope `sec^2 x` isn’t.","_n":"2ifd6","_k":"cbc67862"},{"t":"It is increasing everywhere, because `sec^2 x ≥ 1 > 0`.","why":"Every slope is `sec^2 x`, at least 1.","_n":"2jfe6","_k":"931aecb7"}]},"b":{"prompt":"Which statement about `y = cot x` on (0, π) is true?","options":[{"t":"Its slope is positive for `x > π/2`.","why":"The height is negative there; the slope is still negative.","_n":"2kff6","_k":"f4a10552"},{"t":"Its slope is closest to 0 near `x = 0`.","why":"Near 0 the slope goes to −∞.","_n":"2lf86","_k":"16b6aa7b"},{"t":"It has a local maximum at `x = π/2`, where its slope is 0.","why":"The slope at `π/2` is −1.","_n":"2mf96","_k":"2cf4a52f"},{"t":"It is decreasing everywhere, because `-csc^2 x ≤ -1 \u003c 0`.","why":"Every slope is `-csc^2 x`, at most −1.","_n":"2nfa6","_k":"23871fe7"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"What is the `y`-intercept of the tangent to `y = tan x` at `x = π/4`?","options":[{"t":"`1 - π/4`","why":"That uses slope 1 (the height) instead of 2.","_n":"2ofb6","_k":"dd3653ca"},{"t":"`1 - π/2`","why":"Slope 2 through `(π/4, 1)`: `y = 2x + 1 - π/2`.","_n":"2p046","_k":"d4ee9b1a"},{"t":"`1 - √2π/4`","why":"That uses slope `√2`: square `sec(π/4)`.","_n":"2q056","_k":"a9203b75"},{"t":"1","why":"That’s the height of the point, not the intercept.","_n":"2rf00","_k":"63ea1e3b"}]},"b":{"prompt":"What is the `y`-intercept of the tangent to `y = tan x` at `x = π/3`?","options":[{"t":"`√3 - 2π/3`","why":"That uses slope 2: square `sec(π/3)`.","_n":"2sf10","_k":"7c0645d7"},{"t":"`√3`","why":"That’s the height of the point.","_n":"2tf20","_k":"2bd5deaf"},{"t":"`√3 - √3π/3`","why":"That uses the height `√3` as the slope.","_n":"2uf30","_k":"2803a48b"},{"t":"`√3 - 4π/3`","why":"Slope 4 through `(π/3, √3)`.","_n":"2vec0","_k":"8ed949b6"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"`f(x) = tan x · cot x` on `(0, π/2)`. What is `f′(x)`?","options":[{"t":"0","why":"`tan x · cot x = 1`, a constant.","_n":"2wed0","_k":"d09a83b8"},{"t":"`-sec^2 x csc^2 x`","why":"That multiplies the two derivatives; use the product rule, or simplify first.","_n":"2xee0","_k":"666d82cd"},{"t":"`sec^2 x`","why":"`cot x` is a factor too; the product is 1.","_n":"2yef0","_k":"e974f723"},{"t":"`csc^2 x`","why":"The product is constant, so its derivative is 0.","_n":"2zf80","_k":"e9dcef2b"}]},"b":{"prompt":"`g(x) = 1/cot x` on `(0, π/2)`. What is `g′(x)`?","options":[{"t":"`-sec^2 x`","why":"`1/cot x = tan x`, which rises: positive derivative.","_n":"30f90","_k":"df15a92f"},{"t":"`-sin^2 x`","why":"That’s 1 over the derivative of `cot x`; the reciprocal of a derivative isn’t the derivative of the reciprocal.","_n":"31760","_k":"ae6082ae"},{"t":"`sec^2 x`","why":"`1/cot x = tan x`.","_n":"32750","_k":"fc024ec5"},{"t":"`-csc^2 x`","why":"That’s the derivative of `cot x`, not of `1/cot x`.","_n":"33740","_k":"8bef2eaa"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"In deriving `d/dx tan x`, which step makes the result simplify to `sec^2 x`?","options":[{"t":"“`sin x/cos x` simplifies to `sec x` before differentiating.”","why":"`sin x/cos x = tan x`, not `sec x`.","_n":"34730","_k":"e78beeb6"},{"t":"“`cos^2 x - sin^2 x = 1`.”","why":"The numerator is a sum, and `cos^2 x - sin^2 x = cos 2x`.","_n":"35720","_k":"edd5095e"},{"t":"“The derivative of `sin x/cos x` is `cos x/(-sin x)`.”","why":"That divides the derivatives; use the quotient rule.","_n":"36710","_k":"fa5c0f1a"},{"t":"“`(cos x)(cos x) - (sin x)(-sin x) = cos^2 x + sin^2 x = 1`, so the quotient is `1/cos^2 x`.”","why":"Minus a negative is plus, and the Pythagorean identity makes the numerator 1.","_n":"37700","_k":"2981c4b5"}]},"b":{"prompt":"In deriving `d/dx cot x`, which step makes the result simplify to `-csc^2 x`?","options":[{"t":"“`(-sin x)(sin x) - (cos x)(cos x) = -(sin^2 x + cos^2 x) = -1`, so the quotient is `-1/sin^2 x`.”","why":"Both products are subtracted, and the Pythagorean identity makes the numerator −1.","_n":"386f0","_k":"aad6dd9b"},{"t":"“`sin^2 x - cos^2 x = 1`.”","why":"The numerator is `-(sin^2 x + cos^2 x)`, and `sin^2 x - cos^2 x` isn’t 1.","_n":"397e0","_k":"a1fafa45"},{"t":"“The derivative of `cos x/sin x` is `(-sin x)/cos x`.”","why":"That divides the derivatives; use the quotient rule.","_n":"3a7d0","_k":"cbcf878c"},{"t":"“`cos x/sin x` simplifies to `csc x` before differentiating.”","why":"`cos x/sin x = cot x`, not `csc x`.","_n":"3b7c0","_k":"8ff69214"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"A drone’s height is `h = 50 tan θ` m when the angle of elevation from a point 50 m away is θ. Which statement about `{dh}/{dθ} = 50 sec^2 θ` at `θ = π/3` is best?","options":[{"t":"“The height increases 200 m per degree.”","why":"The rate is per radian.","_n":"3c7d0","_k":"0f70882a"},{"t":"“At `θ = π/3` the height increases about 200 m per radian, so a small extra angle of 0.01 rad means about 2 m more height.”","why":"`50 sec^2(π/3) = 200` m per radian is a rate: `200 × 0.01 = 2` m.","_n":"3d7a0","_k":"19811927"},{"t":"“The drone is 200 m high.”","why":"Its height is `50√3 ≈ 87` m; 200 is a rate. `50 sec^2 θ` tells how fast the height changes per radian, not the height itself.","_n":"3e7b0","_k":"db63267e"},{"t":"“`{dh}/{dθ}` = 100 m per radian.”","why":"`sec^2(π/3) = 4`, not 2.","_n":"3f800","_k":"bc8dbf1a"}]},"b":{"prompt":"A balloon’s height is `h = 30 tan θ` m when seen from 30 m away. Which statement about `{dh}/{dθ}` at `θ = π/4` is best?","options":[{"t":"“At `θ = π/4` the height increases about 60 m per radian, so 0.01 rad more angle means about 0.6 m more height.”","why":"`30 sec^2(π/4) = 60` m per radian, and `60 × 0.01 = 0.6` m.","_n":"3g810","_k":"b5f47025"},{"t":"“The height increases 60 m per degree.”","why":"The rate is per radian.","_n":"3h7e0","_k":"9ab74e8c"},{"t":"“`{dh}/{dθ} = 30√2` m per radian.”","why":"`sec^2(π/4) = 2`, not `√2`.","_n":"3i7f0","_k":"f8945cd6"},{"t":"“The balloon is 60 m high.”","why":"Its height is 30 m.","_n":"3j740","_k":"a75308cb"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A camera 20 m from a launch pad tracks a rocket rising straight up, so `h = 20 tan θ`. When `θ = π/4`, θ is increasing at 0.1 rad/s. How fast is the rocket rising?","options":[{"t":"2 m/s","why":"That uses `tan(π/4) = 1` instead of `sec^2(π/4) = 2`.","_n":"3k750","_k":"7731de03"},{"t":"40 m/s","why":"Multiply by `{dθ}/{dt} = 0.1`.","_n":"3l821","_k":"006f85b5"},{"t":"`2√2` m/s","why":"`sec(π/4)` must be squared.","_n":"3m811","_k":"db544c93"},{"t":"4 m/s","why":"`{dh}/{dt} = 20 sec^2 θ · {dθ}/{dt} = 20 · 2 · 0.1`.","_n":"3n841","_k":"541e3486"}]},"b":{"prompt":"A camera 30 m away tracks a
