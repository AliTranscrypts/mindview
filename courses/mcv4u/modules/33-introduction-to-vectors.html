.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 33: hero vector symbol, V3 vector board (Explore), compass dial, Part 3 stations, pair tiles (Practice 1),
   degree boxes (Practice 2), task steppers */
.vc-heq{display:inline-flex;align-items:center;gap:.25em}
.vc-harr{width:.9em;height:1em;flex:0 0 auto}
.vc-harl{stroke:var(--pen);stroke-width:3.4;stroke-linecap:round;fill:none}
.vc-harh{fill:var(--pen)}
.vc-hmeta{font:600 .3em/1.35 var(--font-ui);color:var(--ink-2);text-align:left;margin-left:.3em}
.vc-hmeta .m{font-size:1.15em;color:var(--ink)}

.vc-ex{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.vc-main,.vc-side{min-width:0}
.vc-side .seg-wrap{margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.vc-lab{font-weight:700;margin:0}
.vc-how{margin:4px 0 10px}
.vc-note{min-height:1.2em;margin:4px 0;color:var(--ink-2);font-weight:600}
.vc-read{margin:6px 0 10px}
#vc-cmp[hidden],#vc-cps[hidden],#vc-tc3[hidden],#vc-chipbox[hidden],#vc-d2row[hidden],.vc-p3s .btn[hidden]{display:none}
#vc-cmp .chips{margin:4px 0 6px}
#vc-hide.on{background:var(--hi-soft);color:var(--ink)}
#vc-chipbox{margin-top:8px}
.vc-dialrow{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.vc-dialbox{flex:0 0 auto;width:120px}
.vc-dialout{margin:0;display:flex;flex-direction:column;gap:2px}
.vc-dialout output{font:700 1.15rem var(--font-ui);color:var(--ink)}
.vc-dial{display:block;width:120px;height:120px;touch-action:none;cursor:pointer;border-radius:50%}
.vc-dial:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.vc-dial[aria-disabled="true"]{opacity:.55;cursor:default}
.vc-dface{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.vc-dtick{stroke:var(--ink-2);stroke-width:1.4}
.vc-dl{fill:var(--ink);font:700 11px var(--font-ui);text-anchor:middle;dominant-baseline:middle}
.vc-darc{fill:none;stroke:var(--hi);stroke-width:3.2;stroke-linecap:round}
.vc-dneedle{stroke:var(--pen);stroke-width:4;stroke-linecap:round}
.vc-dhub{fill:var(--ink)}

.vc-st{margin:0 0 18px}
.vc-st h4{margin:0 0 6px}
.vc-p3{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px 24px;align-items:start;margin:8px 0}
.vc-p3g,.vc-p3s{min-width:0}
.vc-cap2{font-weight:700;color:var(--ink);min-height:1.4em;margin:4px 0 8px}
.vc-real{margin:10px 0 0;padding-left:1.2em}
.vc-real li{margin:2px 0}

.vc-pair{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.vc-pair svg{display:block;max-width:100%;height:auto}
.vc-pg{stroke:var(--plot-grid);stroke-width:1;fill:none}
.vc-pax{stroke:var(--plot-axis);stroke-width:1.3;fill:none}
.vc-pa{stroke:var(--pen);stroke-width:2.6;stroke-linecap:round;fill:none}
.vc-pah{fill:var(--pen)}
.vc-pb{stroke:var(--f3);stroke-width:2.6;stroke-linecap:round;fill:none}
.vc-pbh{fill:var(--f3)}
.vc-pcap{font:600 .74rem/1.35 var(--font-ui);color:var(--ink);text-align:left}
.vc-k1{color:var(--pen);font-weight:800}
.vc-k2{color:var(--f3);font-weight:800}
.chip-in .vc-pair svg{width:90px}
.chip-in .vc-pcap{font-size:.66rem}

.vc-deg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.vc-deg span:first-child{font-weight:600}
.vc-dq .chips{margin:6px 0}

.vc-trow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 10px}
.vc-tname{font-size:1.25rem;min-width:1.6em;font-weight:700}
.vc-tstep{display:inline-flex;align-items:center;gap:4px}
.vc-tstep label{min-width:2.3em}
.vc-tstep input{width:4.2em}

@media (max-width:760px){
  .vc-ex,.vc-p3{grid-template-columns:minmax(0,1fr)}
}

terclockwise from the positive `x`-axis).","label":"True bearing","_a":"AQUI","wrong":[{"v":120,"fb":"Bearing = 90° − angle, plus 360° if negative."}]},{"id":"d4","goal":4,"prompt":"Angle from the positive `x`-axis for the true bearing 045°.","label":"Angle","_a":"BgM=","wrong":[{"v":135,"fb":"Bearing 045° is north-east, which is also 45° from east."}]},{"id":"d5","goal":6,"star":true,"prompt":"A ship sails S 25° E. On the way back, what true bearing does it sail?","label":"True bearing","_a":"AQUN","wrong":[{"v":155,"fb":"That’s the way out. Reverse: add 180°."},{"v":245,"fb":"Reversing is 180°, not 90°."}]},{"id":"d6","goal":6,"star":true,"prompt":"Bearing from A to B is 070°. Bearing from B to A?","label":"True bearing","_a":"AAMI","wrong":[{"v":160,"fb":"The opposite direction is 180° away, not 90°."},{"v":290,"fb":"Subtracting from 360° reflects; it doesn’t reverse."}]},{"id":"d7","goal":4,"star":true,"prompt":"A vector at true bearing 210° is turned 90° counterclockwise. New quadrant bearing?","chips":true,"choices":[{"t":"S 60° W","fb":"A quarter turn from 210° lands on 120° or 300°, never 240°.","_n":"1o4a0","_k":"9945b8eb"},{"t":"S 60° E","fb":"210° − 90° = 120°, which is 60° short of south, toward east.","_n":"1p4b0","_k":"4aaf3804"},{"t":"S 30° W","fb":"Bearings start at north and turn clockwise; angles start at east and turn counterclockwise.","_n":"1q4c0","_k":"dae8e81f"},{"t":"N 60° W","fb":"Counterclockwise lowers the bearing: 210° − 90° = 120°.","_n":"1r4d0","_k":"5af8af03"}],"hints":["Counterclockwise turns subtract from a bearing.","210° − 90° = 120°.","120° is 60° short of south, toward east: S 60° E."]},{"id":"d8","goal":4,"star":true,"prompt":"Two vectors: one at bearing 340°, one at N 20° E. What’s the angle between them?","label":"Angle between","_a":"BgY=","wrong":[{"v":320,"fb":"Take the smaller angle between the directions."},{"v":0,"fb":"N 20° E is 020°, on the other side of north from 340°."}],"hints":["Write both as true bearings.","340° and 020°.","From 340° to 360° is 20°, then 20° more: 40°."]}],"wrongDefault":"Sketch a compass: N 0°, E 90°, S 180°, W 270°. Then find the direction on it."},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Gia","how":"","goal":[3,4],"instruction":"Gia made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Write the true bearing 290° as a quadrant bearing and as an angle from the positive `x`-axis.","steps":["290° is between 270° (west) and 360° (north).","290° − 270° = 20°, so the quadrant bearing is N 20° W.","As an angle: 90° − 290° = −200°, so 160°.","So the vector is at N 20° W, or 160°."],"_a":"Aw==","stepFb":["Step 1 is correct.","","Step 3 is correct on its own: −200° + 360° = 160°.","Step 4 copies step 2’s answer."],"fixes":[{"t":"S 20° W.","why":"290° is on the north side.","_n":"1s4e0","_k":"cf0ca6b3"},{"t":"Step 2 is correct.","why":"20° is measured from west, but quadrant bearings start at north.","_n":"1t4f0","_k":"f5d1d0c7"},{"t":"Measure from north: 360° − 290° = 70°, so N 70° W.","why":"Quadrant bearings start at north or south.","_n":"1u500","_k":"29c6bf18"},{"t":"W 20° N is the standard form.","why":"Quadrant bearings start from N or S.","_n":"1v510","_k":"3d95ce71"}],"hints":["Where does a quadrant bearing start?","North (or south).","360° − 290° = 70°: N 70° W."]},{"id":"e2","goal":3,"task":"`vec{u}` goes from P(−2, 1) to Q(3, 4). Draw `-vec{u}` with its tail at the origin, and give its magnitude.","steps":["`vec{u}` has run 5 and rise 3.","`-vec{u}` has run −3 and rise 5.","So `-vec{u}` goes from (0, 0) to (−3, 5).","Its magnitude is `√34`."],"_a":"Aw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2.","The magnitude is right for any of these."],"fixes":[{"t":"`-vec{u}` has run 5 and rise −3.","why":"Flip \u003cstrong>both\u003c/strong> signs.","_n":"1w520","_k":"52e7082f"},{"t":" ° E","why":"Past 180° is toward west.","_n":"285e2","_k":"1565672c"},{"t":"S 40° W","why":"40° is measured from west. N 40° W means: face north, then turn 40° toward west.","_n":"295b2","_k":"36102c46"},{"t":"N 50° W","why":"230° is on the south side.","_n":"2a5c2","_k":"566d8aeb"},{"t":"S 50° W","why":"230° − 180° = 50° past south, toward west.","_n":"2b612","_k":"24ebb7b8"}]},"b":{"prompt":"What is the quadrant bearing of the true bearing 110°?","options":[{"t":"N 70° E","why":"110° is past east, on the south side.","_n":"2c622","_k":"2842e75d"},{"t":"S 70° W","why":"Before 180° is toward east.","_n":"2d5f2","_k":"5129755f"},{"t":"S 20° E","why":"20° is measured from east. N 40° W means: face north, then turn 40° toward west.","_n":"2e602","_k":"893a63c9"},{"t":"S 70° E","why":"180° − 110° = 70° from south, toward east.","_n":"2f552","_k":"360c4ab1"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"What is `|vec{AB}|` for A(−2, 3) and B(4, −5)?","options":[{"t":"2","why":"6 + (−8): signed components can’t be added for a length.","_n":"2g562","_k":"0761f570"},{"t":"10","why":"Run 6, rise −8: `√(36 + 64)`.","_n":"2h633","_k":"f991842b"},{"t":"14","why":"Magnitude is the hypotenuse: `√(6^2 + 8^2) = 10`.","_n":"2i623","_k":"84aa8f7c"},{"t":"100","why":"That’s the square of the magnitude.","_n":"2j653","_k":"ff24671c"}]},"b":{"prompt":"What is `|vec{AB}|` for A(1, −4) and B(−4, 8)?","options":[{"t":"7","why":"−5 + 12: signed components can’t be added for a length.","_n":"2k643","_k":"c1587738"},{"t":"13","why":"Run −5, rise 12: `√(25 + 144)`.","_n":"2l5f3","_k":"56b0e1df"},{"t":"17","why":"Magnitude is the hypotenuse: `√(5^2 + 12^2) = 13`.","_n":"2m5e3","_k":"33cb1656"},{"t":"169","why":"That’s the square of the magnitude.","_n":"2n613","_k":"c290ba94"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"`vec{u}` goes from P(1, 2) to Q(4, 6). Which arrow is equal to `vec{u}`?","options":[{"t":"From (0, 0) to (4, 6)","why":"Run 4, rise 6: you used Q’s coordinates.","_n":"2o603","_k":"13ddfea8"},{"t":"From (−3, 0) to (0, 4)","why":"Run 3, rise 4, like `vec{u}`.","_n":"2p5b3","_k":"17bb23c7"},{"t":"From (1, 2) to (4, 7)","why":"Rise 5, not 4.","_n":"2q5a3","_k":"6b31e066"},{"t":"From (4, 6) to (1, 2)","why":"That’s `-vec{u}`. `vec{BA}` starts at B and ends at A: same length, opposite direction. `vec{BA} = -vec{AB}`.","_n":"2ra58","_k":"2d0c2748"}]},"b":{"prompt":"`vec{u}` goes from P(−1, 3) to Q(2, −1). Which arrow is equal to `vec{u}`?","options":[{"t":"From (2, 2) to (5, −2)","why":"Run 3, rise −4.","_n":"2sa48","_k":"603c06af"},{"t":"From (2, −1) to (−1, 3)","why":"That’s `-vec{u}`: same length, opposite direction.","_n":"2ta38","_k":"bec8d3a4"},{"t":"From (2, 2) to (5, 2)","why":"Rise 0, not −4.","_n":"2ua28","_k":"410a2730"},{"t":"From (0, 0) to (2, −1)","why":"That uses Q’s coordinates.","_n":"2va18","_k":"c33d8600"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A drone flies at a true bearing of 300°. What is its direction as an angle counterclockwise from the positive `x`-axis?","options":[{"t":"60°","why":"360° − 300° reflects the bearing; it doesn’t convert it.","_n":"2wa08","_k":"9587233c"},{"t":"210°","why":"300° − 90° turns the wrong way.","_n":"2x9f8","_k":"12d015c5"},{"t":"300°","why":"Bearings start at north and turn clockwise; angles start at east and turn counterclockwise.","_n":"2y9e8","_k":"b2307d8b"},{"t":"150°","why":"90° − 300° = −210°; add 360°.","_n":"2z9d8","_k":"26689e86"}]},"b":{"prompt":"A drone flies at a true bearing of 200°. What is its direction as an angle counterclockwise from the positive `x`-axis?","options":[{"t":"250°","why":"90° − 200° = −110°; add 360°.","_n":"309c8","_k":"270ff150"},{"t":"110°","why":"200° − 90° turns the wrong way.","_n":"319f8","_k":"6c744f83"},{"t":"160°","why":"360° − 200° reflects it.","_n":"32a08","_k":"c7c189de"},{"t":"200°","why":"Bearings start at north and turn clockwise; angles start at east and turn counterclockwise.","_n":"33a18","_k":"d08f2932"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A hiker walks 5 km east, then 5 km north. Which describes her displacement from the start?","options":[{"t":"`5√2` km at N 45° W","why":"She went east, not west.","_n":"34a28","_k":"4ffa3cce"},{"t":"`5√2` km at N 45° E","why":"A right triangle with legs 5 and 5.","_n":"359b8","_k":"e89eafa8"},{"t":"`5√2` km at S 45° W","why":"That’s the way back to the start.","_n":"369c8","_k":"40b31039"},{"t":"10 km at N 45° E","why":"10 km is the distance walked, not the displacement.","_n":"379d8","_k":"7df7474b"}]},"b":{"prompt":"A hiker walks `2√3` km south, then 2 km west. Which describes her displacement from the start?","options":[{"t":"4 km at S 60° W","why":"60° is measured from west.","_n":"389e8","_k":"fdef16dd"},{"t":"`(2 + 2√3)` km at S 30° W","why":"That’s the distance walked. Magnitude is the hypotenuse: `√(12 + 4) = 4`.","_n":"39978","_k":"746f486a"},{"t":"4 km at N 30° E","why":"That’s the way back.","_n":"3a988","_k":"37a5c66d"},{"t":"4 km at S 30° W","why":"`√(12 + 4) = 4`; `tan φ = 2/(2√3) = 1/√3`, so 30° from south.","_n":"3b119","_k":"bf79e7d7"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"`vec{AB}` and `vec{CD}` are drawn in different places on a map. Which is the best explanation of how they can be equal?","options":[{"t":"“They’re equal because they have the same length.”","why":"Direction matters too.","_n":"3c109","_k":"ba814068"},{"t":"“A vector is defined only by its magnitude and direction. If `vec{AB}` and `vec{CD}` have the same length and point the same way, sliding one onto the other matches them exactly.”","why":"Position doesn’t matter.","_n":"3d139","_k":"bb0c4047"},{"t":"“They’re equal because they’re parallel.”","why":"Parallel arrows can point opposite ways or have different lengths.","_n":"3e129","_k":"4eacc0d8"},{"t":"“They can’t be equal, because they start at different points.”","why":"A vector is only a magnitude and a direction. Slide one arrow onto the other: if it matches, they’re equal.","_n":"3f0d9"
