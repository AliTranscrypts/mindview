.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 24: hero checklist, Sketch assembler (checklist, graph + strips, V14 sketch pad, gauge), stations, full sketches, task */
.cs-heq{display:inline-block;line-height:1.5}
.cs-hwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.cs-hlist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font:600 .86rem var(--font-ui);color:var(--ink-2)}
.cs-hlist li{display:flex;align-items:center;gap:6px;opacity:.55;transition:opacity .3s ease}
.cs-hlist li.on{opacity:1;color:var(--ink)}
.cs-hlist li.cur{opacity:1;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.cs-hmk{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;border:1.5px solid var(--rule);font-size:.8rem}
.cs-hlist li.on .cs-hmk{background:var(--green);border-color:var(--green);color:var(--sheet)}
@media (prefers-reduced-motion:reduce){ .cs-hlist li{transition:none} }
@media (max-width:640px){
  .cs-hwrap{grid-template-columns:minmax(0,1fr)}
  .cs-hlist{flex-direction:row;flex-wrap:wrap;gap:4px 10px;font-size:.78rem}
}

/* Explore layout: top bar; checklist beside the graph (above it on phones); readouts under the checklist */
.cs-ex{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-rows:auto auto 1fr;grid-template-areas:"top top" "main steps" "main read";gap:12px 26px;align-items:start}
.cs-top{grid-area:top;min-width:0}
.cs-stepsbox{grid-area:steps;min-width:0}
.cs-main{grid-area:main;min-width:0}
.cs-read{grid-area:read;min-width:0}
.cs-ex .cs-stepsbox[hidden]{display:none}
@media (max-width:820px){
  .cs-ex{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"top" "steps" "main" "read"}
}
.cs-fns{margin-bottom:8px}
.cs-fns .chip{font-size:.88rem}
.cs-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.cs-tog{display:inline-flex;align-items:center;gap:6px;font:600 .9rem var(--font-ui);min-height:32px}
.cs-tog input{width:18px;height:18px}
.cs-how{margin:6px 0 0}
.cs-sbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cs-sb{display:inline-flex;align-items:center;gap:6px;min-height:34px;border:1.5px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink);padding:3px 10px 3px 4px;font:600 .82rem var(--font-ui);cursor:pointer}
.cs-sb:disabled{opacity:.5;cursor:default}
.cs-sb.on{border-color:var(--ink);background:var(--hi-soft)}
.cs-sbn{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--rule);font-size:.78rem}
.cs-sb.done .cs-sbn{background:var(--green);border-color:var(--green);color:var(--sheet)}
.cs-stepq{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.cs-sq{margin:0 0 8px}
.cs-fd{margin:4px 0 8px;font-size:1.05rem}
.cs-opts .opt{padding:.45em .7em}
.cs-inrow{margin-top:8px}
.cs-inrow label{flex:1 1 100%;font-weight:600;font-size:.92rem}
.cs-num{width:11rem}
.cs-eq{min-height:1.8em}
.cs-badge{display:inline-block;margin-left:8px;padding:1px 10px;border:1.5px solid var(--ink-2);border-radius:999px;font:600 .82rem var(--font-ui);color:var(--ink);vertical-align:middle}
canvas.plot.cs-g{aspect-ratio:16/11}
canvas.plot.cs-strip{aspect-ratio:auto;height:64px}
.cs-main .plot-wrap + .plot-wrap{margin-top:4px}
.cs-key{margin:6px 0 0}
.cs-sk{margin-top:10px;border-top:1.5px solid var(--rule);padding-top:8px}
.cs-sk[hidden]{display:none}
.cs-scw{overflow-x:auto;margin:6px 0}
table.cs-sct th,table.cs-sct td{padding:5px 8px;white-space:nowrap}
table.cs-sct tbody th{text-align:left;font-weight:600}
table.cs-sct .cs-bad{background:var(--bad-bg)}
.cs-x{color:var(--red);font-weight:700;margin-right:3px}
.cs-cell{min-width:40px;min-height:34px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:700 1.1rem var(--font-ui);cursor:pointer}
.cs-cell:hover:not(:disabled){border-color:var(--ink)}

/* V14 sketch pad controls */
.cs-ptin{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:6px 0}
.cs-ptl{display:inline-flex;align-items:center;gap:6px}
.cs-ptl .cs-num{width:6.5rem}
.cs-skmsg{margin:4px 0;font-weight:600;color:var(--red)}
.cs-ptlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cs-ptc{font-family:var(--font-math)}
.cs-shh{margin:10px 0 4px}
.cs-shrow{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:6px}
@media (max-width:640px){ .cs-shrow{flex-wrap:nowrap;overflow-x:auto} }
.cs-shg{flex:0 0 auto;border:1.5px solid var(--rule);border-radius:8px;margin:0;padding:4px 6px 6px;min-width:0}
.cs-shg legend{font:600 .8rem var(--font-math);padding:0 4px;white-space:nowrap}
.cs-shc{display:inline-flex;align-items:center;justify-content:center;position:relative;min-width:44px;min-height:36px;border:1.5px solid var(--rule);border-radius:6px;margin:2px;font:700 1.05rem var(--font-ui);cursor:pointer;background:var(--sheet)}
.cs-shc input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.cs-shc.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.cs-shc:focus-within{outline:3px solid var(--pen);outline-offset:1px}
.cs-gauge{margin-top:8px}
.cs-gcells{display:flex;flex-wrap:wrap;gap:6px}
.cs-gc{display:flex;flex-direction:column;gap:2px;border-radius:8px;padding:5px 9px;font:600 .82rem var(--font-ui)}
.cs-gc.good{background:var(--good-bg)}
.cs-gc.bad{background:var(--bad-bg)}
.cs-gciv{font-family:var(--font-math);font-weight:400}
.cs-gpts{margin:6px 0 0}

/* Part 3 */
.cs-st h3{margin-top:0}
.cs-st:first-child{margin-top:0;padding-top:0;border-top:0}
.cs-cluep{border-left:4px solid var(--hi);padding:4px 10px;background:var(--paper)}
.cs-clue1.off{text-decoration:line-through;color:var(--ink-2)}
.cs-tabs{margin:4px 0}
.cs-st canvas.plot.wide{max-width:720px}
.cs-shift{margin-top:10px;border-top:1.5px solid var(--rule);padding-top:8px}
.cs-shift[hidden]{display:none}
.cs-shmsg{min-height:1.4em;font-weight:700}
canvas.plot.cs-s2strip{aspect-ratio:auto;height:58px}
.cs-s2lab{margin:8px 0 0}
.cs-mkrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.cs-pm{min-width:40px;font-size:1.1rem}
.cs-mkout{min-width:4.5em;text-align:center;font-size:1.05rem}
.cs-marks [aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink)}
#cs-s2done{margin-top:8px}
.cs-m3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px 20px;align-items:start}
.cs-eqs{display:flex;flex-direction:column;gap:8px}
.cs-sks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cs-skb{display:flex;flex-direction:column;gap:4px;border:2px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:6px;cursor:pointer;text-align:left;min-width:0}
.cs-skb:hover:not(:disabled){border-color:var(--ink)}
.cs-skb.done{border-color:var(--green);cursor:default}
.cs-skb canvas.plot{margin:0;pointer-events:none}
.cs-skn{font:600 .85rem var(--font-ui)}
@media (max-width:640px){ .cs-m3{grid-template-columns:minmax(0,1fr)} }

/* Practice: full sketches */
.cs-knav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
canvas.plot.cs-kg{aspect-ratio:16/11}

/* Task */
.cs-clues{margin:6px 0 10px;padding-left:1.4em}
.cs-tstep{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.cs-tstep label{min-width:9.5em}
.cs-tin{width:5.5rem}
.cs-tnow{min-height:1.6em;font-size:1.1rem;margin:8px 0}

vity\u003c/strong> one at a time. Put them together in order and the graph almost draws itself: each step adds a feature, and the signs of `f′` and `f″` choose one of four \u003cstrong>shapes\u003c/strong> on every interval.","fig":{"html":"\u003cdiv class=\"cs-hwrap\">\u003col class=\"cs-hlist\" id=\"cs-hlist\" aria-hidden=\"true\">\u003cli data-hs=\"0\">\u003cspan class=\"cs-hmk\">1\u003c/span>\u003cspan>Domain\u003c/span>\u003c/li>\u003cli data-hs=\"1\">\u003cspan class=\"cs-hmk\">2\u003c/span>\u003cspan>Intercepts\u003c/span>\u003c/li>\u003cli data-hs=\"2\">\u003cspan class=\"cs-hmk\">3\u003c/span>\u003cspan>Symmetry\u003c/span>\u003c/li>\u003cli data-hs=\"3\">\u003cspan class=\"cs-hmk\">4\u003c/span>\u003cspan>Asymptotes\u003c/span>\u003c/li>\u003cli data-hs=\"4\">\u003cspan class=\"cs-hmk\">5\u003c/span>\u003cspan>`f′`: rise and fall\u003c/span>\u003c/li>\u003cli data-hs=\"5\">\u003cspan class=\"cs-hmk\">6\u003c/span>\u003cspan>`f″`: bend\u003c/span>\u003c/li>\u003cli data-hs=\"6\">\u003cspan class=\"cs-hmk\">7\u003c/span>\u003cspan>Sketch\u003c/span>\u003c/li>\u003c/ol>\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"The curve-sketching checklist builds the graph of f(x) = (x² + 3)/(x − 1) one feature at a time.\">\u003c/canvas>\u003c/div>"},"caps":["Start with empty axes.","Domain: every `x` except 1.","`y`-intercept (0, −3); no `x`-intercepts.","No symmetry.","Asymptotes `x = 1` and `y = x + 1`.","`f′`: ↗ ↘ ↘ ↗, a max at (−1, −2) and a min at (3, 6).","`f″`: ∩ ∩ ∪ ∪.","The curve joins the evidence: `f(x) = {x^2 + 3}/{x - 1}`."]},"goals":["I can carry out each step of the curve-sketching algorithm (domain, intercepts, symmetry, asymptotes).","I can use symmetry and end behaviour to check and shorten my work.","I can choose the correct shape on each interval from the signs of `f′` and `f″`.","I can sketch a polynomial with all its key features labelled.","I can sketch a rational function with asymptotes, extrema and concavity.","I can sketch possible graphs from derivative information and explain why infinitely many graphs fit."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Symmetry","goal":2,"prompt":"Which function is even?","options":[{"t":"`f(x) = (x - 1)^2`","why":"`f(-x) = (-x - 1)^2 = (x + 1)^2 ≠ f(x)`.","_n":"081d","_k":"1056e757"},{"t":"`f(x) = x^3 + x`","why":"`f(-x) = -f(x)`: odd.","_n":"17ed","_k":"89072a8b"},{"t":"`f(x) = x^4 - 3x^2`","why":"`f(-x) = f(x)`: only even powers.","_n":"27fd","_k":"172f94dc"},{"t":"`f(x) = x^2 + x`","why":"`f(-x) = x^2 - x`: neither.","_n":"37cd","_k":"7e75f643"}],"hints":["Replace `x` with `-x`.","Even powers don’t change sign.","`x^4 - 3x^2`."]},{"id":"w2","skill":"Symmetry","goal":2,"prompt":"`f` is odd and has a local max at (2, 5). What else must be true?","options":[{"t":"`f` has a local min at (−2, −5)","why":"Odd: rotate 180° about the origin.","_n":"47dd","_k":"8ea50f5c"},{"t":"A local max at (−2, 5)","why":"That’s a reflection in the `y`-axis.","_n":"57ad","_k":"e76e9993"},{"t":"A local min at (−2, 5)","why":"Rotating changes the `y`-sign too.","_n":"67bd","_k":"27572e3f"},{"t":"A local max at (2, −5)","why":"The point (2, 5) is given.","_n":"788d","_k":"3441dd71"}],"hints":["Odd means `f(-x) = -f(x)`.","(2, 5) maps to (−2, −5).","A peak becomes a valley."]},{"id":"w3","skill":"Asymptotes","goal":1,"prompt":"Asymptotes of `f(x) = {2x^2 + 1}/{x^2 - 9}`?","options":[{"t":"VA `x = ±3`; HA `y = 0`","why":"Equal degrees give the ratio of leading coefficients.","_n":"889d","_k":"0c959c17"},{"t":"VA `x = ±3`; HA `y = 2`","why":"Equal degrees: 2/1.","_n":"91bb","_k":"21d1acf7"},{"t":"VA `x = ±3`; OA `y = 2x`","why":"The degrees are equal: no oblique asymptote.","_n":"a1ab","_k":"474cd513"},{"t":"VA `x = 3` only; HA `y = 2`","why":"`x^2 = 9` has two roots.","_n":"b1db","_k":"4697775d"}],"hints":["Where is the denominator 0?","`x = ±3`; the numerator isn’t 0 there.","Equal degrees: `y = 2`."]},{"id":"w4","skill":"Asymptotes","goal":1,"prompt":"Oblique asymptote of `{x^2 + 3}/{x - 1}`?","options":[{"t":"`y = x + 5`","why":"The remainder isn’t part of the line.","_n":"c1cb","_k":"d578c807"},{"t":"`y = x`","why":"Divide fully.","_n":"d17b","_k":"df7e1048"},{"t":"`y = x + 1`","why":"`x^2 + 3 = (x - 1)(x + 1) + 4`.","_n":"e16b","_k":"765fdfef"},{"t":"`y = x - 1`","why":"That’s the denominator.","_n":"f19b","_k":"a52ea960"}],"hints":["Divide `x^2 + 3` by `x - 1`.","Quotient `x + 1`, remainder 4.","`y = x + 1`."]},{"id":"w5","skill":"Reading signs","goal":3,"prompt":"On an interval, `f′ \u003c 0` and `f″ > 0`. Which shape?","options":[{"t":"Falling and concave down","why":"`f″ > 0` means concave up.","_n":"g18b","_k":"b77bf41c"},{"t":"Rising and concave up","why":"`f′ \u003c 0` means falling.","_n":"h23b","_k":"0ffe0515"},{"t":"Falling and concave up (↘∪)","why":"Going down, bending up: like the left side of a valley.","_n":"i22b","_k":"dabd3bce"},{"t":"Rising and concave down","why":"Both signs are reversed.","_n":"ja9a","_k":"de53aa95"}],"hints":["`f′ \u003c 0`: up or down?","Down. `f″ > 0`: which way does it bend?","Falling, concave up."]},{"id":"w6","skill":"Reading signs","goal":3,"prompt":"`f′` goes from + to −, and `f″ \u003c 0` there. What does `f` have?","options":[{"t":"A local minimum","why":"+ to − is a peak.","_n":"kaaa","_k":"eda35d1c"},{"t":"A vertical asymptote","why":"Nothing says `f` is undefined.","_n":"laba","_k":"49f2a270"},{"t":"A point of inflection","why":"`f″` doesn’t change sign.","_n":"maca","_k":"498bc08c"},{"t":"A local maximum","why":"Rising then falling, concave down.","_n":"na5a","_k":"4333ba8a"}],"hints":["+ to − in `f′`.","Rising then falling.","A local max."]}],"refreshers":{"Symmetry":"Even: `f(-x) = f(x)`, mirror in the `y`-axis. Odd: `f(-x) = -f(x)`, rotate 180° about the origin.","Asymptotes":"Vertical: denominator 0 after cancelling. Horizontal: compare degrees. Oblique: divide.","Reading signs":"`f′` gives the direction (↗ ↘); `f″` gives the bend (∪ ∩). Together they choose one  - 16 = 4(3x^2 - 4)`","dom":[{"t":"ℝ","why":"A polynomial is defined for every `x`.","_n":"oa6a","_k":"36b3eb34"},{"t":"`{x ∈ ℝ | x ≠ ±1}`","why":"±1 are `x`-intercepts, not gaps: `f(1) = 0`.","_n":"pa7a","_k":"6c5c406d"},{"t":"`{x ∈ ℝ | x ≥ 0}`","why":"Negative `x`-values work too: `f(-1) = 0`.","_n":"qa8a","_k":"c78cd38b"},{"t":"`{x ∈ ℝ | x ≠ 0}`","why":"`f(0) = 7`: `x = 0` is in the domain.","_n":"ra1a","_k":"a0b78965"}],"asy":[{"t":"None: a polynomial has no asymptotes","why":"`x^4` dominates: `f` grows without bound at both ends.","_n":"sa2a","_k":"5959e9d4"},{"t":"VA `x = ±1`","why":"`f(±1) = 0`: those are intercepts.","_n":"tafa","_k":"2791187c"},{"t":"HA `y = 7`","why":"7 is the `y`-intercept; `x^4` grows without bound.","_n":"uaea","_k":"b0df6036"},{"t":"HA `y = 0`","why":"`x^4` dominates: `f` grows without bound at both ends.","_n":"vada","_k":"61daf948"}],"fb":{"y":"`f(0) = 0 - 0 + 7 = 7`.","x":"Factor: `(x^2 - 1)(x^2 - 7) = 0`.","x7":"`x^4 - 8x^2 + 7 = (x^2 - 1)(x^2 - 7)`: `x^2 = 7` gives `±√7 ≈ ±2.65`.","sym":"`f(-x) = (-x)^4 - 8(-x)^2 + 7 = f(x)`: only even powers.","crit":"`4x(x - 2)(x + 2) = 0` at −2, 0 and 2.","sg1":"Test one value in each interval marked ✗: for example `f′(-3) = 4(-3)(-5)(-1) \u003c 0`.","sg2":"`3x^2 - 4` is negative between `±2/√3` and positive outside.","infl":"`f″` changes sign at `x = ±2/√3`."},"read":{"domain":"ℝ","ints":"`y`-int (0, 7); `x`-ints ±1, `±√7 ≈ ±2.65`","sym":"even: mirror in the `y`-axis","asym":"none (a polynomial)","d1":"`4x(x - 2)(x + 2)`: − | + | − | +. Critical numbers −2, 0, 2","d2":"`4(3x^2 - 4)`: + | − | +. Inflections at `x = ±2/√3 ≈ ±1.15`","keys":"max (0, 7), mins (±2, −9), inflections (`±2/√3`, `-17/9`)","shapes":"(−∞, −2) ↘∪ · (−2, `-2/√3`) ↗∪ · (`-2/√3`, 0) ↗∩ · (0, `2/√3`) ↘∩ · (`2/√3`, 2) ↘∪ · (2, ∞) ↗∪"}},{"id":"S2","chip":"S2 `{x^2}/{x^2 - 4}`","eq":"`f(x) = {x^2}/{x^2 - 4}`","d1":"`f′(x) = {-8x}/{(x^2 - 4)^2}`","d2":"`f″(x) = {8(3x^2 + 4)}/{(x^2 - 4)^3}`","dom":[{"t":"`{x ∈ ℝ | x ≠ ±2}`","why":"`x^2 - 4 = 0` at `x = ±2`.","_n":"waca","_k":"81438f21"},{"t":"`{x ∈ ℝ | x ≠ 2}`","why":"`x^2 = 4` has two roots: ±2.","_n":"xaba","_k":"7c62d85c"},{"t":"ℝ","why":"The denominator is 0 at ±2.","_n":"yaaa","_k":"beb71cfe"},{"t":"`{x ∈ ℝ | x ≠ 0}`","why":"`f(0) = 0`: the numerator can be 0.","_n":"za9a","_k":"e93bb2e5"}],"asy":[{"t":"VA `x = ±2`; HA `y = 1`","why":"Equal degrees: 1/1.","_n":"10a8a","_k":"4b2f1746"},{"t":"VA `x = ±2`; HA `y = 0`","why":"Equal degrees give the ratio of leading coefficients.","_n":"11a7a","_k":"f6b2b82f"},{"t":"VA `x = 2` only; HA `y = 1`","why":"`x^2 = 4` has two roots.","_n":"12a6a","_k":"1fa6d8f1"},{"t":"VA `x = ±2`; no end asymptote","why":"Equal degrees: HA `y = 1`.","_n":"131da","_k":"f97ea1a6"}],"fb":{"y":"`f(0) = 0/(-4) = 0`.","x":"The numerator `x^2` is 0 only at 0.","sym":"`f(-x) = {(-x)^2}/{(-x)^2 - 4} = f(x)`.","crit":"Only `x = 0`: `f′(0) = 0`.","sg1":"The denominator is a square: the sign of `f′` is the sign of `-8x`.","sg2":"The sign of `f″` is the sign of `(x^2 - 4)^3`: negative only between −2 and 2.","infl":"`f″` changes sign only at ±2, which aren’t in the domain: no points of inflection."},"read":{"domain":"`{x ∈ ℝ | x ≠ ±2}`","ints":"(0, 0) is both intercepts","sym":"even: mirror in the `y`-axis","asym":"VA `x = ±2`; HA `y = 1`","d1":"`{-8x}/{(x^2 - 4)^2}`: + | + | − | −. Critical number 0; ±2 not in the domain","d2":"`{8(3x^2 + 4)}/{(x^2 - 4)^3}`: + | − | +. No inflection: ±2 not in the domain","keys":"max (0, 0)","shapes":"(−∞, −2) ↗∪ · (−2, 0) ↗∩ · (0, 2) ↘∩ · (2, ∞) ↘∪"}},{"id":"S3","chip":"S3 `{x^2 + 3}/{x - 1}`","eq":"`f(x) = {x^2 + 3}/{x - 1}`","d1":"`f′(x) = {(x - 3)(x + 1)}/{(x - 1)^2}`","d2":"`f″(x) = 8/(x - 1)^3`","dom":[{"t":"`{x ∈ ℝ | x ≠ 1}`","why":"`x - 1 = 0` at `x = 1`.","_n":"141ea","_k":"78464c0f"},{"t":"ℝ","why":"Division by 0 at `x = 1`.","_n":"151ba","_k":"3e64f9e2"},{"t":"`{x ∈ ℝ | x ≠ -1}`","why":"Set the denominator, `x - 1`, to 0.","_n":"161ca","_k":"2811fb24"},{"t":"`{x ∈ ℝ | x ≠ ±√3}`","wh ends.","_n":"1g24a","_k":"3d9ad304"},{"t":"VA `x = 4`","why":"`f(4) = 0`, a zero.","_n":"1h27a","_k":"aec83927"},{"t":"HA `y = 0`","why":"Degree 4: `f` grows without bound.","_n":"1i26a","_k":"90f028db"},{"t":"VA `x = 0`","why":"`f(0) = 0`: it’s an intercept.","_n":"1j29a","_k":"a238721b"}],"fb":{"y":"`f(0) = 0 · (-4)^3 = 0`.","x":"`x(x - 4)^3 = 0` at 0 and 4.","sym":"`f(-x) = -x(-x - 4)^3 = x(x + 4)^3`: neither.","crit":"`4(x - 1)(x - 4)^2 = 0` at 1 and 4.","sg1":"An even-power factor doesn’t change sign. Test each interval.","sg2":"`12(x - 2)(x - 4)`: + | − | +.","infl":"`f″` changes sign at 2 and at 4.","infl1":"`x = 1` is where `f′ = 0` (the minimum), not where `f″` changes sign."},"read":{"domain":"ℝ","ints":"(0, 0) and (4, 0); `y`-int (0, 0)","sym":"neither","asym":"none (a polynomial)","d1":"`4(x - 1)(x - 4)^2`: − | + | +. Critical numbers 1, 4","d2":"`12(x - 2)(x - 4)`: + | − | +. Inflections at 2 and 4","keys":"min (1, −27); inflections (2, −16) and (4, 0) (flat)","shapes":"(−∞, 1) ↘∪ · (1, 2) ↗∪ · (2, 4) ↗∩ · (4, ∞) ↗∪"}}],"cmsg":{"fn":"Choose {fn} first.","miss":"Not every point the challenge asks for is placed yet (each within 0.15 of the true point).","extra":"{pt} isn’t a key point of this graph. Remove it, or move it onto one.","unset":"Choose a shape on every interval.","shape":"The shape on {iv} doesn’t match the signs of `f′` and `f″` there."},"predIntro":"Make a prediction first. Then the assembler shows you what really happens.","predictions":[{"id":"p1","fn":"S2","prompt":"S2, `f(x) = {x^2}/{x^2 - 4}`. Before any calculus: what symmetry does the graph have?","options":[{"t":"Even: a mirror image in the `y`-axis","_n":"1k28a","_k":"eb98c0bc"},{"t":"Both even and odd","_n":"1l1ba","_k":"1d071f43"},{"t":"Odd","_n":"1m1aa","_k":"47b641a1"},{"t":"Neither","_n":"1n119","_k":"490cb01a"}],"explain":"`f(-x) = {(-x)^2}/{(-x)^2 - 4} = f(x)`. Do the right half; reflect it."},{"id":"p2","fn":"S2","prompt":"S2. `f′(x) = {-8x}/{(x^2 - 4)^2}`. How many local extrema does `f` have?","options":[{"t":"2: at `x = ±2`","_n":"1o129","_k":"63b3fd48"},{"t":"0","_n":"1p139","_k":"41ba86a2"},{"t":"1: a local max at (0, 0)","_n":"1q149","_k":"1ab2d777"},{"t":"3: at `x = -2`, 0, 2","_n":"1r159","_k":"a3624b32"}],"explain":"`x = ±2` aren’t in the domain. Only `x = 0` is critical, where `f′` goes + to −."},{"id":"p3","fn":"S3","prompt":"S3, `f(x) = {x^2 + 3}/{x - 1}`. The local max is (−1, −2) and the local min is (3, 6). Is that possible?","options":[{"t":"No: they must be reversed","_n":"1s169","_k":"89334688"},{"t":"Yes: they’re on different branches, separated by the asymptote `x = 1`","_n":"1t179","_k":"1d2e458d"},{"t":"No: a max must be higher than a min","_n":"1u189","_k":"80af94fc"},{"t":"Only if one is a point of inflection","_n":"1v199","_k":"f9c7f23a"}],"explain":"Local means compared with nearby points. The left branch never gets above −2; the right branch never drops below 6."},{"id":"p4","fn":"S4","prompt":"S4, `f(x) = x(x - 4)^3`. `f′(4) = 0`. Will the sketch show a turning point at `x = 4`?","options":[{"t":"Yes: a local max","_n":"1w1a9","_k":"beebde93"},{"t":"Yes: a local min","_n":"1x17a","_k":"78183cee"},{"t":"No: it flattens for a moment and keeps rising","_n":"1y16a","_k":"5f3e0bad"},{"t":"No: it’s a cusp","_n":"1z15a","_k":"8847e922"}],"explain":"`f′ = 4(x - 1)(x - 4)^2`: `(x - 4)^2` doesn’t change sign. Since `f″` changes sign at 4, it’s a flat point of inflection."}],"challenges":[{"id":"tc1","goal":[3,4],"fn":"S1","prompt":"Guided mode on S1: place the three local extrema and the four `x`-intercepts, then choose the shapes.","msgs":{"i7":"`x^4 - 8x^2 + 7 = (x^2 - 1)(x^2 - 7)`: `x^2 = 7` gives `±√7 ≈ ±2.65`.","one":"`f″ = 4(3x^2 - 4)` changes sign at `-2/√3`: the bend switches inside that interval."},"hints":["Even function: find everything for `x ≥ 0` and mirror it.","`f′ = 4x(x - 2)(x + 2)`; `f″ = 4(3x^2 - 4)`, zero at `±2/√3 ≈ ±1.15`.","Max (0, 7), mins (±2, −9), inflections (`±2/√3`, `-17/9`), intercepts ±1 and `±√7`."]},{"id":"tc2","goal":[3,5],"fn":"S3","prompt":"Sketch mode on S3: choose the shape on each of the four intervals.","msgs":{"a":"`f″ = 8/(x - 1)^3 \u003c 0` for `x \u003c 1`: concave down.","b":"`f′ \u003c 0` on (1, 3): falling."},"hints":["Use the two sign rows.","`f′`: + | − | − | +. `f″`: − (left of 1) | + (right of 1).","↗∩, ↘∩, ↘∪, ↗∪."]},{"id":"tc3","goal":[3,4],"fn":"S4","stretch":true,"prompt":"Free mode on S4: build the complete sketch. Place the local min, both points of inflection and both intercepts, then choose shapes on (−∞, 1), (1, 2), (2, 4) and (4, ∞).","msgs":{"flat":"`f′ ≥ 0` on both sides of 4.","b12":"`f″ = 12(x - 4)(x - 2) > 0` for `x \u003c 2`.","i1":"`x = 1` is where `f′ = 0` (the minimum), not where `f″` changes sign."},"hints":["`f′ = 4(x - 1)(x - 4)^2`, `f″ = 12(x - 2)(x - 4)`.","`f′`: − | + | + (signs change only at 1). `f″`: + | − | + (changes at 2 and 4).","Min (1, −27); inflections (2, −16) and (4, 0); shapes ↘∪, ↗∪, ↗∩, ↗∪."]}]},"part3":{"slug":"clues","name":"Clues","heading":"From clues to curve","intro":"Now the algorithm runs backwards. You get derivative information instead of an equation, and you sketch graphs that \u003cem>could\u003c/em> fit. You’ll see why there are infinitely many.","s1":{"title":"Station 1: two possible sketches","clues":"`f′ \u003c 0` on (−∞, 1), `f′ > 0` on (1, ∞); `f″ > 0` everywhere; \u003cspan class=\"cs-clue1\">`f(1) = -2`\u003c/span>.","text":"Build a sketch that fits every clue: place points and choose a shape on each side of 1. Then build a second, different one. The checker accepts any sketch that fits.","tabs":["Sketch 1","Sketch 2"],"check":"Check this sketch","fb":{"min":"Place the point the clue `f(1) = -2` gives: (1, −2).","more":"Add at least one more point, so the sketch shows how steep it is.","unset":"Choose a shape on each side of 1.","left":"`f′ \u003c 0` and `f″ > 0` on (−∞, 1): falling and concave up, ↘∪.","right":"`f′ > 0` and `f″ > 0` on (1, ∞): rising and concave up, ↗∪.","dir":"Your points must fall toward (1, −2) from the left and rise after it: `f′` decides that.","bend":"With `f″ > 0`, the slopes between neighbouring points must keep increasing. Somewhere your points bend the wrong way.","same":"That’s the same as sketch 1. Change the steepness: move or add a point.","ok1":"✓ Sketch 1 fits every clue. Now build a different one.","ok2":"✓ Both sketches fit. Two different graphs, the same clues."},"shiftHead":"Now remove the clue `f(1) = -2`.","shift":"Vertical shift","shiftMsg":"Every height works: infinitely many graphs."},"s2":{"title":"Station 2: from the graph of `f′` to `f`","text":"The graph shows `f′(x) = (x + 1)(x - 2)`, a parabola crossing at −1 and 2. Mark on the strip for `f` where `f` has its extrema and its point of inflection.","how":"Tap the strip (or use − and +) to move the marker, then tap what `f` has there. Tap again to remove a mark.","marks":{"max":"Local max here","min":"Local min here","infl":"Inflection here"},"check":"Check my marks","fb":{"missing":"Mark one local max, one local min and one point of inflection.","zeroInfl":"Zeros of `f′` are extrema of `f`.","vertexExt":"Extrema of `f′` are inflections of `f`.","swap":"`f′` goes + to − at −1: rising then falling is a peak. At 2 it goes − to +: a valley.","wrong":"Look at where `f′` crosses the axis and where it turns.","done":"✓ Right: a max at −1, a min at 2 and an inflection at `x = 1/2`, the vertex of `f′`."},"algLines":["With the extra clue `f(0) = 0`: `f(x) = {x^3}/{3} - {x^2}/{2} - 2x`.","Check: `f′(x) = x^2 - x - 2 = (x + 1)(x - 2)`.","Max: `f(-1) = -{1}/{3} - {1}/{2} + 2 = {7}/{6}`, so (−1, `7/6`).","Min: `f(2) = {8}/{3} - 2 - 4 = -{10}/{3}`, so (2, `-10/3`)."],"origin":"Does this `f` pass through (0, 0)?","originYes":"`f(0) = 0 - 0 - 0 = 0` ✓ The sketch passes through (0, 0), so this is the graph from the family that the clue picks."},"s3":{"title":"Station 3: equation ↔ sketch","text":"Match each equation to its sketch. Tap an equation, then tap the sketch it belongs to.","eqs":[{"id":"a","t":"`y = x^3 - 3x^2`","desc":"rises to a peak at (0, 0), falls to a valley at (2, −4), then rises, crossing the x-axis at 3","clue":"`x^3 - 3x^2 = x^2(x - 3)`: end behaviour Q3 to Q1, touching the `x`-axis at 0 and crossing at 3."},{"id":"b","t":"`y = -x^3 + 3x`","desc":"comes down from the upper left to a valley at (−1, −2), rises to a peak at (1, 2), then falls to the lower right","clue":"Odd, with end behaviour Q2 to Q4."},{"id":"c","t":"`y = (x^2 - 1)^2`","desc":"a W shape that touches the x-axis at −1 and 1, with a peak at (0, 1)","clue":"Even and never negative: it touches at ±1."},{"id":"d","t":"`y = {x}/{x^2 + 1}`","desc":"hugs the x-axis at both ends, with a valley at (−1, −1/2) and a peak at (1, 1/2)","clue":"Odd, with horizontal asymptote `y = 0`."}],"sketchName":"Sketch","wrong":"Not a match. Look for the deciding clue: {clue}","right":"✓ Matched. {clue}","done":"✓ All four matched."},"quickCheck":{"title":"Quick check","summary":"From clues to curve quick check","items":[{"id":"q1","goal":3,"prompt":"`f′ > 0` and `f″ \u003c 0` on (0, 5). The shape there is…","choices":[{"t":"↘∪","fb":"Rising and bending down.","_n":"2014a","_k":"5a831ac4"},{"t":"↗∪","fb":"Rising and bending down.","_n":"211ba","_k":"4b56261f"},{"t":"↗∩","fb":"Right. Rising and bending down.","_n":"221aa","_k":"24a03b5c"},{"t":"↘∩","fb":"Rising and bending down.","_n":"2319a","_k":"010c5a36"}]},{"id":"q2","goal":3,"prompt":"`f′ = (x - 3)^2`, `f″ = 2(x - 3)`. At `x = 3`, `f` has…","choices":[{"t":"a vertical asymptote","fb":"`f′ ≥ 0` on both sides; `f″` changes sign.","_n":"2418a","_k":"344a4c3c"},{"t":"a flat point of inflection","fb":"Right. `f′ ≥ 0` on both sides; `f″` changes sign.","_n":"251fa","_k":"6b3e1454"},{"t":"a local min","fb":"`f′ ≥ 0` on both sides; `f″` changes sign.","_n":"261ea","_k":"ab6db057"},{"t":"a local max","fb":"`f′ ≥ 0` on both sides; `f″` changes sign.","_n":"2725c","_k":"dee2f309"}]},{"id":"q3","goal":6,"prompt":"Given only the sign chart of `f′`, how many different graphs fit?","choices":[{"t":"Exactly one","fb":"Any vertical shift has the same `f′`.","_n":"2826c","_k":"71a2f439"},{"t":"Infinitely many","fb":"Right. Any vertical shift has the same `f′`.","_n":"2923c","_k":"f1a6b8ae"},{"t":"None","fb":"Any vertical shift has the same `f′`.","_n":"2a24c","_k":"dab29672"},{"t":"Two","fb":"Any vertical shift has the same `f′`.","_n":"2b29c","_k":"746125c4"}]},{"id":"q4","goal":6,"prompt":"The graph of `f′` has its minimum at `x = 4`. What does `f` have at `x = 4`?","choices":[{"t":"A local maximum","fb":"Extrema of `f′` are inflections of `f`.","_n":"2c2ac","_k":"098a1fc9"},{"t":"A vertical asymptote","fb":"Extrema of `f′` are inflections of `f`.","_n":"2d27c","_k":"b6ddfddc"},{"t":"A local minimum","fb":"Extrema of `f′` are inflections of `f`.","_n":"2e28c","_k":"c0d4daca"},{"t":"A point of inflection","fb":"Right. Extrema of `f′` are inflections of `f`.","_n":"2f1dc","_k":"26646ebf"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Function ↔ feature summary","summary":"Function ↔ feature summary","goal":[1,2,3,4,5],"instruction":"Match each function to its feature summary.","leftTitle":"Function","rightTitle":"Feature summary","left":[{"id":"l1","t":"`x^3 - 3x`","goal":4},{"id":"l2","t":"`x^4 - 2x^2`","goal":4},{"id":"l3","t":"`{x^2}/{x^2 - 1}`","goal":5},{"id":"l4","t":"`{x}/{x^2 + 1}`","goal":5},{"id":"l5","t":"`{x^2 + 1}/{x}`","goal":5},{"id":"l6","t":"`x^3 + 3x`","goal":3},{"id":"l7","t":"`{1}/{x^2 + 1}`","goal":1},{"id":"l8","t":"`(x - 2)^2(x + 1)`","goal":4,"hints":["Expand: `x^3 - 3x^2 + 4`.","`f′ = 3x(x - 2)`; `f″ = 6x - 6`.","Max (0, 4), min (2, 0), inflection (1, 2)."]}],"right":[{"id":"r1","t":"Odd; max (−1, 2), min (1, −2); inflection (0, 0)"},{"id":"r2","t":"Even; max (0, 0), mins (±1, −1); inflections at `x = ±1/√3`"},{"id":"r3","t":"Even; VA `x = ±1`; HA `y = 1`; max (0, 0)"},{"id":"r4","t":"Odd; HA `y = 0`; max (1, `1/2`), min (−1, `-1/ cepts (±2, 0), min (0, 4). Shapes: (−∞, −1) ↘∩ · (−1, 0) ↘∪ · (0, 1) ↗∪ · (1, ∞) ↗∩.","named":{"shape1u":"`f′ = 6x/(x^2 - 1)^2 \u003c 0` for `x \u003c 0`."},"hints":["Even function: sketch `x ≥ 0` and reflect. VA `x = ±1`; HA `y = 1`.","`f′ = 6x/(x^2 - 1)^2`: − | − | + | +. `f″ = -6(3x^2 + 1)/(x^2 - 1)^3`: − | + | −.","Intercepts (±2, 0), min (0, 4); shapes ↘∩, ↘∪, ↗∪, ↗∩."]},{"id":"k3","goal":5,"model":"K3","star":true,"f":"`f(x) = {x^2 - 2x + 4}/{x - 2}`","solved":"VA `x = 2`; OA `y = x`; max (0, −2), min (4, 6); no `x`-intercepts. Shapes: (−∞, 0) ↗∩ · (0, 2) ↘∩ · (2, 4) ↘∪ · (4, ∞) ↗∪.","named":{"xint":"`x^2 - 2x + 4` has discriminant −12: none."},"hints":["Divide: `f(x) = x + 4/(x - 2)`, so OA `y = x` and VA `x = 2`.","`f′ = 1 - 4/(x - 2)^2 = 0` at 0 and 4. `f″ = 8/(x - 2)^3`: − | +.","Max (0, −2), min (4, 6); shapes ↗∩, ↘∩, ↘∪, ↗∪."]},{"id":"k4","goal":5,"model":"K4","star":true,"f":"`f(x) = {x^3}/{x^2 - 3}`","solved":"Odd; VA `x = ±√3`; OA `y = x`; max (−3, `-9/2`), min (3, `9/2`); flat inflection (0, 0). Shapes: (−∞, −3) ↗∩ · (−3, `-√3`) ↘∩ · (`-√3`, 0) ↘∪ · (0, `√3`) ↘∩ · (`√3`, 3) ↘∪ · (3, ∞) ↗∪.","named":{"shape3u":"`f′ = x^2(x^2 - 9)/(x^2 - 3)^2 \u003c 0` for `0 \u003c |x| \u003c 3`."},"hints":["Odd function: sketch `x ≥ 0` and rotate.","`f′ = x^2(x - 3)(x + 3)/(x^2 - 3)^2`: zero at 0 and ±3. `f″ = 6x(x^2 + 9)/(x^2 - 3)^3`.","For `x > 0`: falls on (0, `√3`) concave down, falls on (`√3`, 3) concave up to the min (3, `9/2`), then rises toward `y = x`."]}],"msgs":{"miss":"Not every key point is there yet. Look for the intercepts, the local extrema and the points of inflection.","extra":"{pt} isn’t a key point of this function.","unset":"Choose a shape on every interval.","shape":"The shape on {iv} doesn’t match the signs of `f′` and `f″` there.","peek":"You compared before checking, so this one won’t count as first try."}},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Ximena","how":"","goal":[4,5,6],"instruction":"Ximena made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":5,"task":"Find the key features of `f(x) = {x^2}/{x^2 - 9}`.","steps":["Domain: `x ≠ ±3`. Intercept (0, 0). Even.","HA `y = 1`; VA `x = ±3`.","`f′(x) = {-18x}/{(x^2 - 9)^2}`.","Critical numbers: `x = -3`, 0 and 3.","`f′`: + | + | − | −, so a max at (0, 0)."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5’s signs are right."],"fixes":[{"t":"There are no critical numbers.","why":"`f′(0) = 0` and 0 is in the domain.","_n":"2g1ec","_k":"3f3ea000"},{"t":"Step 4 is correct.","why":"`f` isn’t defined at an asymptote. It splits the sign chart but isn’t a critical point or inflection.","_n":"2h2bc","_k":"98ac155d"},{"t":"±3 aren’t in the domain; the only critical number is 0, a local max at (0, 0).","why":"Only `x = 0` is critical.","_n":"2i2ac","_k":"3f7c0fdc"},{"t":"The critical numbers are ±3 only.","why":"`f′(0) = 0`.","_n":"2j2dc","_k":"222d1691"}],"hints":["Is `f(3)` defined?","No: it’s an asymptote.","Only `x = 0` is critical."]},{"id":"e2","goal":4,"task":"Find where `f(x) = x^4 + 4x^3` increases and decreases.","steps":["`f′ = 4x^3 + 12x^2 = 4x^2(x + 3)`.","Critical numbers: −3 and 0.","Signs of `f′`: − on (−∞, −3), + on (−3, 0), − on (0, ∞).","So a min at (−3, −27) and a max at (0, 0)."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"The signs are + | − | +.","why":"Test `x = -4`: `4(16)(-1) \u003c 0`.","_n":"2k2cc","_k":"bc9710cf"},{"t":"Only −3 is critical.","why":"`f′(0) = 0`.","_n":"2l27c","_k":"edb11434"},{"t":"Step 3 is correct.","why":"An even-power factor doesn’t change sign. Test each interval.","_n":"2m26c","_k":"3c411070"},{"t":"`4x^2` doesn’t change sign at 0: `f′ > 0` on (0, ∞) too. `f` decreases on (−∞, −3) and increases on (−3, ∞); a min at (−3, −27) and a flat inflection at (0, 0).","why":"`f′ > 0` on (0, ∞): no max at 0.","_n":"2n29c","_k":"2b956fb3"}],"hints":["Test `x = 1`.","`4(1)(4) > 0`.","`f′ > 0` on (0, ∞): no max at 0."]},{"id":"e3","goal":6,"task":"`f′ > 0` for `x \u003c 2`, `f′ \u003c 0` for `x > 2`, and `f(2) = 5`. Sketch `f`.","steps":["`f` increases to the left of 2 and decreases to the right.","So `f` has a local max at (2, 5).","So the graph must be the parabola `y = -(x - 2)^2 + 5`."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"The max is at (5, 2).","why":"`f(2) = 5` gives (2, 5).","_n":"2o28c","_k":"59e5e27c"},{"t":"Step 3 is correct.","why":"`f` and `f + 5` have the same derivative. Without a point, the height isn’t fixed.","_n":"2p23c","_k":"39f75dc4"},{"t":"It must be `y = -|x - 2| + 5`.","why":"That’s one more possibility, not the only one.","_n":"2q22c","_k":"19b44c28"},{"t":"Many graphs fit: any curve rising to (2, 5) and falling after it, such as `y = -2(x - 2)^2 + 5` or `y = -(x - 2)^4 + 5`. The clues don’t fix the shape.","why":"Infinitely many graphs fit.","_n":"2r769","_k":"2b0deb0d"}],"hints":["Do the clues say anything about concavity or steepness?","No.","Infinitely many graphs fit."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the sketch assembler: the max below the min, or the flat point that wasn’t a turning point?"},{"id":"j2","q":"In your own words, why are four shapes enough to describe any interval between key points?"},{"id":"j3","q":"Explain to a friend the order you’d use to sketch a rational function, and why that order saves work."},{"id":"j4","q":"Which step of the algorithm do you most often get wrong? What will you check next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is the domain of `f(x) = {x - 1}/{x^2 + 2x - 8}`?","options":[{"t":"`{x ∈ ℝ | x ≠ 4, -2}`","why":"`(x + 4) = 0` at `x = -4`.","_n":"2s759","_k":"dcdc577c"},{"t":"`{x ∈ ℝ | x ≠ -4, 2}`","why":"`x^2 + 2x - 8 = (x + 4)(x - 2)`.","_n":"2t749","_k":"b36e1e65"},{"t":"`{x ∈ ℝ | x ≠ 1}`","why":"1 is a zero of the numerator.","_n":"2u739","_k":"6560ee60"},{"t":"`{x ∈ ℝ | x ≠ -4, 1, 2}`","why":"The numerator being 0 is allowed.","_n":"2v729","_k":"50be2c82"}]},"b":{"prompt":"What is the domain of `f(x) = {x + 3}/{x^2 - x - 12}`?","options":[{"t":"`{x ∈ ℝ | x ≠ -3}`","why":"`x = 4` also makes the denominator 0.","_n":"2w719","_k":"dbeb2474"},{"t":"`{x ∈ ℝ | x ≠ -4, 3}`","why":"Factor: `x^2 - x - 12 = (x - 4)(x + 3)`.","_n":"2x709","_k":"6012e78a"},{"t":"`{x ∈ ℝ}`","why":"−3 makes it undefined (a hole), even though it cancels.","_n":"2y6f9","_k":"cf36168e"},{"t":"`{x ∈ ℝ | x ≠ 4, -3}`","why":"`(x - 4)(x + 3)`.","_n":"2z6e9","_k":"282e4995"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which describes the symmetry of `f(x) = {x^3}/{x^2 + 1}`?","options":[{"t":"Odd: rotating the graph 180° about the origin leaves it unchanged","why":"`f(-x) = {-x^3}/{x^2 + 1} = -f(x)`.","_n":"306d9","_k":"9c300ea9"},{"t":"Both even and odd","why":"Only `f(x) = 0` is both.","_n":"31708","_k":"9008c1cb"},{"t":"Neither","why":"Check `f(-x)`.","_n":"32718","_k":"2b76552d"},{"t":"Even: mirror image in the `y`-axis","why":"`f(-x) ≠ f(x)`.","_n":"33728","_k":"a3ac35e7"}]},"b":{"prompt":"Which describes the symmetry of `f(x) = {x^4 + 1}/{x^2}`?","options":[{"t":"Even: mirror image in the `y`-axis","why":"Only even powers.","_n":"34738","_k":"8c2643ea"},{"t":"Neither","why":"Check `f(-x)`: only even powers.","_n":"356c8","_k":"f724cc27"},{"t":"Both even and odd","why":"Only `f(x) = 0` is both.","_n":"366d8","_k":"1abf2f6f"},{"t":"Odd","why":"`f(-x) = f(x)`, not `-f(x)`.","_n":"376e8","_k":"2280cce3"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"`f′ > 0` on (−∞, −2) and `f′ \u003c 0` on (−2, ∞); `f″ \u003c 0` everywhere. Which describes the graph?","options":[{"t":"It rises bending up, then falls","why":"`f″ \u003c 0` means concave down throughout.","_n":"386f8","_k":"695daff3"},{"t":"It rises then falls, bending down everywhere, with a local max at `x = -2`","why":"`f′` goes + to − at −2, and `f″ \u003c 0` means concave down throughout.","_n":"39688","_k":"0d8738ab"},{"t":"It falls then rises, like a ∪","why":"`f′` goes + to −.","_n":"3a698","_k":"16679eb1"},{"t":"It rises then falls, with a point of inflection at −2","why":"`f″` never changes sign.","_n":"3be29","_k":"c680b883"}]},"b":{"prompt":"`f′ \u003c 0` on (−∞, 1) and `f′ > 0` on (1, ∞); `f″ > 0` everywhere. Which describes the graph?","options":[{"t":"It falls then rises, bending up everywhere, with a local min at `x = 1`","why":"`f′` goes − to + at 1, and `f″ > 0` means concave up throughout.","_n":"3ce19","_k":"2497785e"},{"t":"It rises then falls, like a ∩","why":"`f′` goes − to +.","_n":"3de49","_k":"a107ef9f"},{"t":"It falls then rises, with a point of inflection at 1","why":"`f″` never changes sign.","_n":"3ee39","_k":"39c3c3e1"},{"t":"It falls bending down, then rises","why":"`f″ > 0` means concave up throughout.","_n":"3fde9","_k":"85ec1def"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Which set of features belongs to `f(x) = x^3 - 3x^2 - 9x + 5`?","options":[{"t":"Local max (1, −6), local min (−3, −22)","why":"`f′ = 3(x - 3)(x + 1)`, so the critical numbers are 3 and −1.","_n":"3gdd9","_k":"f838c947"},{"t":"Local max (−1, 10), local min (3, −22), point of inflection (1, −6)","why":"`f′ = 3(x - 3)(x + 1)`; `f″ = 6x - 6`.","_n":"3he09","_k":"cdad8244"},{"t":"Local max (3, −22), local min (−1, 10), inflection (1, −6)","why":"+ to − happens at −1.","_n":"3idf9","_k":"ff223e53"},{"t":"Local max (−1, 10), local min (3, −22), inflection (0, 5)","why":"The inflection is where `f″ = 0`, at `x = 1`.","_n":"3jea9","_k":"55294eb8"}]},"b":{"prompt":"Which set of features belongs to `f(x) = x^3 + 3x^2 - 9x - 2`?","options":[{"t":"Local max (−3, 25), local min (1, −7), point of inflection (−1, 9)","why":"`f′ = 3(x + 3)(x - 1)`; `f″ = 6x + 6`.","_n":"3ke99","_k":"1c2974ee"},{"t":"Local max (−1, 9), local min (3, 25)","why":"The critical numbers are −3 and 1.","_n":"3ldc9","_k":"23150bd3"},{"t":"Local max (1, −7), local min (−3, 25), inflection (−1, 9)","why":"+ to − happens at −3.","_n":"3mdd9","_k":"07edc481"},{"t":"Local max (−3, 25), local min (1, −7), inflection (0, −2)","why":"The inflection is where `f″ = 0`, at `x = -1`.","_n":"3nda9","_k":"c9e39f23"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Which describes `f(x) = {x^2 + 1}/{x^2 - 1}`?","options":[{"t":"A local max at (0, −1), which can’t be right because the graph also reaches `y = 1`","why":"The branches outside ±1 stay above 1; the max is local.","_n":"3odb9","_k":"cd193e05"},{"t":"A local min at (0, −1)","why":"`f′` goes + to − at 0.","_n":"3pe09","_k":"2d67e8df"},{"t":"Points of inflection at `x = ±1`, because the concavity changes there","why":"±1 aren’t in the domain.","_n":"3qe19","_k":"dfbcf49b"},{"t":"A local max at (0, −1); concave up for `|x| > 1` and concave down on (−1, 1); no points of inflection","why":"`f′ = {-4x}/{(x^2 - 1)^2}`; `f″ = {4(3x^2 + 1)}/{(x^2 - 1)^3}`.","_n":"3rde9","_k":"5edc1788"}]},"b":{"prompt":"Which describes `f(x) = {x^2 - 2}/{x^2 - 4}`?","options":[{"t":"A local max at (0, `1/2`), which can’t be right because the graph also reaches `y = 1`","why":"The branches outside ±2 stay above 1; the max is local.","_n":"3sdf9","_k":"4d4c5abd"},{"t":"A local min at (0, `1/2`)","why":"`f′` goes + to − at 0.","_n":"3te49","_k":"4ab2598f"},{"t":"A local max at (0, `1/2`); concave up for `|x| > 2` and concave down on (−2, 2); no points of inflection","why":"`f′ = {-4x}/{(x^2 - 4)^2}`.","_n":"3ue59","_k":"7a1e5d10"},{"t":"Points of inflection at `x = ±2`","why":"±2 aren’t in the domain.","_n":"3vde8","_k":"5d7898f4"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"The graph of `f′` is a parabola opening up that crosses the `x`-axis at −1 and 3. Which statement about `f` must be true?","options":[{"t":"`f` is increasing on (−1, 3)","why":"`f′ \u003c 0` there.","_n":"3wdd8","_k":"b84aa86c"},{"t":"`f` has points of inflection at `x = -1` and `x = 3`","why":"Zeros of `f′` are extrema of `f`.","_n":"3xdc8","_k":"596c19dc"},{"t":"`f` has a local min at `x = 1`","why":"The vertex of `f′` is an inflection of `f`.","_n":"3ydb8","_k":"0df9f92c"},{"t":"`f` has a local max at `x = -1`, a local min at `x = 3` and a point of inflection at `x = 1`","why":"`f′`: + | − | +; the vertex of `f′` is at 1.","_n":"3ze28","_k":"468f0723"}]},"b":{"prompt":"The graph of `f′` is a parabola opening up that crosses the `x`-axis at −2 and 4. Which statement about `f` must be true?","options":[{"t":"`f` is increasing on (−2, 4)","why":"`f′ \u003c 0` there.","_n":"40e18","_k":"774e8b18"},{"t":"`f` has a local min at `x = 1`","why":"The vertex of `f′` is an inflection of `f`.","_n":"41e08","_k":"60e8aa9c"},{"t":"`f` has points of inflection at `x = -2` and `x = 4`","why":"Zeros of `f′` are extrema of `f`.","_n":"42df8","_k":"bbfed602"},{"t":"`f` has a local max at `x = -2`, a local min at `x = 4` and a point of inflection at `x = 1`","why":"`f′`: + | − | +; the vertex of `f′` is at 1.","_n":"43e68","_k":"adb01f57"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which best explains why infinitely many graphs fit a given sign chart for `f′`?","options":[{"t":"“The chart fixes where `f` rises and falls, but not how high the graph is (or how steep). Adding any constant to `f` gives the same `f′`, so infinitely many graphs fit.”","why":"`f` and `f + C` have the same derivative.","_n":"44e58","_k":"c5ea2d13"},{"t":"“Because `f′` can be any polynomial.”","why":"The chart is fixed; it’s `f` that varies.","_n":"45d88","_k":"44e99233"},{"t":"“Because the domain is infinite.”","why":"The domain isn’t the reason.","_n":"46d98","_k":"2b5fda39"},{"t":"“Only one graph fits once you know the signs exactly.”","why":"`f` and `f + 5` have the same derivative. Without a point, the height isn’t fixed.","_n":"47da8","_k":"73a8a068"}]},"b":{"prompt":"Two students sketch different graphs from the same sign charts for `f′` and `f″`. Which explanation shows both can be correct?","options":[{"t":"“The charts give only where `f` rises, falls and bends. The heights of the points and how steep each piece is aren’t fixed, so different curves fit.”","why":"Heights and steepness aren’t fixed by sign charts.","_n":"48db8","_k":"699b15f7"},{"t":"“Only the one through the origin is correct.”","why":"No point was given.","_n":"49dc8","_k":"7f84e1d4"},{"t":"“They must have made an error: a sign chart gives a unique graph.”","why":"`f` and `f + 5` have the same derivative. Without a point, the height isn’t fixed.","_n":"4add8","_k":"64bf1f0b"},{"t":"“Both are wrong: you need the equation to sketch.”","why":"Derivative information is enough for possible sketches.","_n":"4bde8","_k":"99cd1281"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which summary of `f(x) = x^3 - 12x` is correct and correctly written?","options":[{"t":"“… local max 16 at `x = 2`; local min −16 at `x = -2`; …”","why":"`f(-2) = -8 + 24 = 16`: the max is at `x = -2`.","_n":"4cdf8","_k":"4c7f425b"},{"t":"“… concave up on (−∞, 0), down on (0, ∞); …”","why":"`f″ = 6x \u003c 0` for `x \u003c 0`.","_n":"4de08","_k":"44089b25"},{"t":"“Increasing on (−∞, −2] and [2, ∞); decreasing on [−2, 2]; …”","why":"Use open intervals.","_n":"4ee18","_k":"1e8bafa9"},{"t":"“Increasing on (−∞, −2) and (2, ∞); decreasing on (−2, 2); local max (−2, 16); local min (2, −16); concave down on (−∞, 0), up on (0, ∞); point of inflection (0, 0).”","why":"`f′ = 3(x - 2)(x + 2)`; `f″ = 6x`.","_n":"4f6a8","_k":"2a22bdfc"}]},"b":{"prompt":"Which summary of `f(x) = x^3 - 27x` is correct and correctly written?","options":[{"t":"“Increasing on (−∞, −3) and (3, ∞); decreasing on (−3, 3); local max (−3, 54); local min (3, −54); concave down on (−∞, 0), up on (0, ∞); point of inflection (0, 0).”","why":"`f′ = 3(x - 3)(x + 3)`; `f″ = 6x`.","_n":"4g698","_k":"83f0c03d"},{"t":"“… concave up on (−∞, 0), down on (0, ∞); …”","why":"`f″ = 6x \u003c 0` for `x \u003c 0`.","_n":"4h6c8","_k":"de2ef75b"},{"t":"“Increasing on (−∞, −3] and [3, ∞); decreasing on [−3, 3]; …”","why":"Use open intervals.","_n":"4i6b8","_k":"4de50c6f"},{"t":"“… local max 54 at `x = 3`; local min −54 at `x = -3`; …”","why":"`f(-3) = -27 + 81 = 54`: the max is at `x = -3`.","_n":"4j6e8","_k":"b323952f"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"After a dose, a drug’s concentration is `C(t) = {20t}/{t^2 + 4}` mg/L, `t ≥ 0` hours. Which describes the graph?","options":[{"t":"It rises to a maximum at `t = 4` h","why":"`t^2 = 4` gives `t = 2`.","_n":"4k6d8","_k":"bb7f451b"},{"t":"It rises to a maximum of 10 mg/L at 2 h","why":"`C(2) = 40/8 = 5`.","_n":"4l708","_k":"84fb87f7"},{"t":"It rises to a maximum of 5 mg/L at 2 h, then falls toward 0, switching from concave down to concave up at `t = 2√3` h","why":"`C′ = {20(4 - t^2)}/{(t^2 + 4)^2}`; `C″` changes sign at `t^2 = 12`.","_n":"4m6f8","_k":"f9daa34c"},{"t":"It rises to 5 mg/L at 2 h and then levels off at 5 mg/L","why":"The degree of the top is smaller: `C -> 0`.","_n":"4n628","_k":"ae8f8724"}]},"b":{"prompt":"`C(t) = {30t}/{t^2 + 9}` mg/L, `t ≥ 0`. Which describes the graph?","options":[{"t":"It rises to a maximum of 10 mg/L at 3 h","why":"`C(3) = 90/18 = 5`.","_n":"4o618","_k":"311a33ba"},{"t":"It rises to a maximum at `t = 9` h","why":"`t^2 = 9` gives `t = 3`.","_n":"4pe48","_k":"44e4bead"},{"t":"It rises to 5 mg/L at 3 h and then levels off at 5 mg/L","why":"The degree of the top is smaller: `C -> 0`.","_n":"4qe58","_k":"55face29"},{"t":"It rises to a maximum of 5 mg/L at 3 h, then falls toward 0, switching from concave down to concave up at `t = 3√3` h","why":"`C(3) = 90/18 = 5`.","_n":"4re28","_k":"d739c052"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A company’s profit `P` (thousands of dollars) changes at the rate `P′(x) = -3(x - 2)(x - 8)` when it sells `x` hundred units, `0 ≤ x ≤ 10`. Which describes the profit?","options":[{"t":"Profit peaks at 500 units","why":"At 500, `P′` is largest: the fastest rise, not the peak.","_n":"4se38","_k":"f8001551"},{"t":"Profit falls until 200 units, then rises for every `x` after that","why":"`P′ \u003c 0` after 800.","_n":"4te08","_k":"94fac815"},{"t":"Profit rises until 200 units, then falls until 800","why":"The factor −3 makes `P′` negative before 2.","_n":"4ue18","_k":"c5bbb099"},{"t":"Profit falls until 200 units, rises fastest at 500 units, peaks at 800 units, then falls","why":"`P′`: − | + | −; `P″ = -6(x - 5)`.","_n":"4vde8","_k":"3978e322"}]},"b":{"prompt":"`P′(x) = -2(x - 1)(x - 7)`, `0 ≤ x ≤ 10` (hundreds of units). Which describes the profit?","options":[{"t":"Profit peaks at 400 units","why":"At 400, `P′` is largest: the fastest rise, not the peak.","_n":"4wdf8","_k":"79d16f0f"},{"t":"Profit falls until 100 units, rises fastest at 400 units, peaks at 700 units, then falls","why":"`P″ = -2(2x - 8) = -4(x - 4)`.","_n":"4xec8","_k":"a4048265"},{"t":"Profit rises until 100 units, then falls until 700","why":"The factor −2 makes `P′` negative before 1.","_n":"4yed8","_k":"351fbef0"},{"t":"Profit falls until 100 units, then rises for every `x` after that","why":"`P′ \u003c 0` after 700.","_n":"4ze6a","_k":"f13d2b6e"}]}}]},"task":{"title":"Clue designer","summary":"Clue designer","statement":"\u003cp>Choose `b`, `c` and `d` so that the cubic `f(x) = x^3 + bx^2 + cx + d` matches every clue. Can you find all the answers?\u003c/p>\u003col class=\"cs-clues\">\u003cli>`f` has a local maximum at `x = -1`.\u003c/li>\u003cli>`f` has a point of inflection at `x = 1`.\u003c/li>\u003cli>`f` has three `x`-intercepts.\u003c/li>\u003cli>The local maximum value is greater than 12.\u003c/li>\u003c/ol>","checks":["Local max at `x = -1`","Inflection at `x = 1`","Three `x`-intercepts","Max value > 12"],"tips":["`f′ = 3x^2 + 2bx + c` must be 0 at −1, and `f` must be concave down there.","`f″ = 6x + 2b`: set it to 0 at `x = 1`.","Three intercepts: the max must be above the `x`-axis and the min below it.","Once `b` and `c` are fixed, `f(-1) = 5 + d`."],"explainPrompt":"Explain the order in which you used the clues, and why the cubic’s shape forced the intercept and maximum conditions to limit `d`.","vocab":"Use the words local maximum, point of inflection, intercept and concave down.","success":"Your cubic matches every clue!","after3":"Clues 1 and 2 fix `b` and `c`. Clue 3 needs `-5 \u003c d \u003c 27`, and clue 4 needs `d > 7`. The rest is the input range.","afterAt":5,"inputs":{"range":"(whole numbers, −12 to 12)","none":"Enter whole numbers from −12 to 12 for `b`, `c` and `d`."}},"cards":[["The algorithm","Domain → intercepts → symmetry → asymptotes → `f′` → `f″` → sketch."],["Four shapes","↗∪, ↗∩, ↘∪, ↘∩: `f′` gives the direction, `f″` the bend."],["Key `x`-values","Critical numbers, inflection candidates and asymptotes split the `x`-axis into intervals."],["Even function","Mirror in the `y`-axis: sketch `x ≥ 0`, then reflect."],["Odd function","Rotate 180° about the origin: a max at (`a`, `b`) means a min at (`-a`, `-b`)."],["Asymptotes in sign charts","Boundaries only: never critical numbers or points of inflection."],["Flat inflection","`f′ = 0` but no sign change, while `f″` changes sign, e.g. `x(x - 4)^3` at 4."],["Max below min","Possible on different branches of a rational function."],["From the graph of `f′`","Zeros of `f′` → extrema of `f`; extrema of `f′` → inflections of `f`."],["Infinitely many graphs","Derivative information fixes shape, not height: `f + C` fits too."],["A point fixes the height","One known point (like `f(0) = 0`) picks one graph from the family."],["Check your sketch","Symmetry, end behaviour and intercepts should agree with the calculus."]]}};</script>
