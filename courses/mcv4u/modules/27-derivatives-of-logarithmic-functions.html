.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 27: Mirror slopes (square mirror graph, V5 slope-trail panels, other-bases graph, point and base chips, V8 exact box),
   Logs in chains stations (linked g / ln g panels, two routes line by line, ln(kx) graph), Tangents and rates boxes, task */
.lg-heq{display:block;font:400 .34em/1.3 var(--font-ui);color:var(--ink-2);margin-top:.35em;letter-spacing:0}
.lg-heq .m{font-size:1.15em}
.lg-ex{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.lg-main,.lg-side{min-width:0}
.lg-eq{min-height:1.6em}
#lg-gm[hidden],#lg-gt[hidden],#lg-gb[hidden],.lg-bwrap[hidden],.lg-tact[hidden]{display:none}
canvas.plot.lg-mir{touch-action:none}
canvas.plot.lg-bas{aspect-ratio:4/3}
.lg-pan{margin-top:4px}
.lg-pan[hidden]{display:none}
.lg-pcap{margin:4px 0 2px;font-size:.95rem;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-height:1.5em}
.lg-pcap .m{white-space:nowrap}
.lg-sw{display:inline-block;width:18px;height:4px;border-radius:2px;flex:0 0 auto}
.lg-sw.dash{height:0;border-top:3px dashed;background:none}
.lg-capsep{color:var(--ink-2)}
canvas.plot.lg-c-f{aspect-ratio:16/8}
canvas.plot.lg-c-d1{aspect-ratio:16/7}
canvas.plot.lg-c-g{aspect-ratio:16/9}
canvas.plot.lg-c-lg{aspect-ratio:16/6}
.lg-key{margin:8px 0 0}
#lg-mode{margin-top:2px}
.lg-how{margin:8px 0 10px}
.lg-sl{margin-top:8px;display:block}
.lg-sl input{width:100%;min-height:28px}
.lg-sl output{color:var(--ink);font-weight:700}
.lg-xch{gap:6px;margin:6px 0 2px}
.lg-xch .chip,.lg-bch .chip{min-height:36px;min-width:44px}
.lg-note{margin:4px 0 0}
.lg-bwrap{margin-top:12px}
.lg-bh{font-weight:700;margin:0 0 4px}
.lg-bch{gap:6px;margin:0}
.lg-bchip{border-color:var(--p-b)}
.lg-bchip .m{color:var(--p-b)}
.lg-bchip.on .m{color:inherit}
.lg-tact{margin-top:10px}
.lg-side dl.read.lg-read{margin-top:16px}
.lg-exact{margin-top:14px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:8px}
.lg-exh{font-weight:700;margin:0 0 2px}
.lg-frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;font-size:1.1rem}
.lg-frow .numin.short{width:7rem}
.lg-fl{white-space:nowrap}
.lg-ok{color:var(--green);font-weight:700}
/* Part 3 */
.lg-st h3{margin-top:0}
.lg-st:first-child{margin-top:0;padding-top:0;border-top:0}
.lg-stg{align-items:start}
.lg-rel{margin:10px 0;padding:8px 12px;border-left:4px solid var(--hi);background:var(--info-bg);border-radius:0 8px 8px 0}
.lg-dom{margin:6px 0 12px;padding:8px 12px;border:1.5px solid var(--rule);border-radius:8px;font-weight:600}
.lg-routes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:14px 18px;align-items:start}
.lg-route{min-width:0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lg-route h4{margin:0 0 6px}
.lg-lines{margin:0 0 6px;padding-left:1.4em;min-height:2.4em}
.lg-lines li{margin:6px 0}
.lg-lines li.lg-empty{list-style:none;margin-left:-1.4em;color:var(--ink-2);font-style:italic}
.lg-rule{display:block;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.lg-le{display:block;overflow-x:auto;padding:2px 0}
.lg-val{margin:4px 0;font-weight:700;min-height:1.2em}
.lg-note3{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--hi);background:var(--info-bg);border-radius:0 8px 8px 0}
/* Practice 2: V8 boxes */
.lg-dt{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.lg-dr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1.05rem}
.lg-dl{font-weight:600}
.lg-dpt{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.lg-dr .numin.short{width:7.4rem}
/* task */
.lp-in{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.lp-step{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.lp-step label{min-width:9.5rem}
.lp-step .numin.short{width:4.4rem}
.lp-step .btn{min-width:40px;min-height:40px}
.lp-gh{font-weight:700;margin:10px 0 4px}
@media (max-width:820px){
  .lg-ex{grid-template-columns:minmax(0,1fr)}
  .lg-routes{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .lg-dr .numin.short{width:6rem}
  .lg-frow .numin.short{width:6.4rem}
  canvas.plot.lg-c-f{aspect-ratio:16/10}
  canvas.plot.lg-c-d1{aspect-ratio:16/9}
  canvas.plot.lg-c-lg{aspect-ratio:16/8}
}

d":"l2","goal":5,"prompt":"Tangent to `y = ln x` at `x = e`: enter the slope and `y`-intercept.","boxes":[{"k":"t","line":true}],"_a":"HxtFEwk5Bh9XDwYJBFsCBVUIBgAHVgQCVxUBbE4=","display":"`y = (1/e)x + 0`, that is `y = x/e`","wrong":[{"k":"t","i":1,"v":1,"fb":"The point is `(e, 1)`; `y = 1 + (x - e)/e = x/e`."}],"why":"The slope is `1/e` and the point is `(e, 1)`: `y = 1 + (x - e)/e = x/e`."},{"id":"l3","goal":5,"star":true,"prompt":"Where does `y = x - 2 ln x` have a horizontal tangent? Enter the point.","boxes":[{"k":"p","pre":"Point","pt":true}],"_a":"HxtBEwk5BB1UFwcAAFUGBFIKCQkLUgcBXQ1sTA==","display":"`(2, 2 - 2 ln 2)`","wrong":[{"k":"p","i":0,"v":0.5,"fb":"`1 - 2/x = 0` gives `x = 2`."}],"why":"`y′ = 1 - 2/x = 0` gives `x = 2`, and `y(2) = 2 - 2 ln 2`."},{"id":"l4","goal":[3,5],"star":true,"prompt":"`f(x) = ln(x^2 - 4x + 5)`. Where is `f′(x) = 0`, and what is `f` there?","boxes":[{"k":"x","pre":"`x =`"},{"k":"f","pre":"`f` there"}],"_a":"HxtJEwlQGhMCGwsBTg==","display":"`x = 2`, `f(2) = 0`","general":"`f′ = (2x - 4)/(x^2 - 4x + 5)`; the inside is always positive, so the domain is every real `x`.","why":"`f′ = (2x - 4)/(x^2 - 4x + 5)` is 0 at `x = 2`, and `f(2) = ln 1 = 0`. The inside is always positive, so the domain is every real `x`."},{"id":"l5","goal":5,"star":true,"prompt":"At what `x` do `y = ln x` and `y = √x` have equal slopes?","boxes":[{"k":"x","pre":"`x =`"}],"_a":"HxtJEwlWSw==","display":"`x = 4`","wrong":[{"k":"x","eq":2,"fb":"`1/x = 1/(2√x)` gives `x = 2√x`, so `√x = 2`."}],"why":"`1/x = 1/(2√x)` gives `x = 2√x`, so `√x = 2` and `x = 4`.","hints":["Set the two derivatives equal.","`1/x = 1/(2√x)`.","`x = 2√x`, so `√x = 2` and `x = 4`."]},{"id":"l6","goal":[3,5],"star":true,"prompt":"For `y = ln(x^2 + 1)`, at what `x > 0` is the slope greatest, and what is that slope?","boxes":[{"k":"x","pre":"`x =`"},{"k":"s","pre":"Greatest slope"}],"_a":"HxtJEwlTGhMXGwsATg==","display":"`x = 1`, slope 1","general":"Slope `s(x) = 2x/(x^2 + 1)`. Maximize it: `s′(x) = (2 - 2x^2)/(x^2 + 1)^2 = 0` at `x = 1`.","why":"Slope `s(x) = 2x/(x^2 + 1)`. Maximize it: `s′(x) = (2 - 2x^2)/(x^2 + 1)^2 = 0` at `x = 1`, where the slope is `2/2 = 1`.","hints":["The slope is a function of `x`; you want its maximum.","Differentiate `2x/(x^2 + 1)` with the quotient rule.","Zero at `x = 1`; slope `2/2 = 1`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Adebayo","how":"","goal":[3,4],"instruction":"Adebayo made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Differentiate `y = ln(x^2 + 3x)`.","steps":["`y = ln u`, with `u = x^2 + 3x`.","`dy/du = 1/u`.","`du/dx = 2x + 3`.","`dy/dx = 1/u + (2x + 3)`.","`= 1/(x^2 + 3x) + 2x + 3`."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.","","Step 5 substitutes into step 4 correctly."],"fixes":[{"t":"`dy/dx = 1/(2x + 3)`.","why":"It’s `g′` over `g`. Check: `ln(5x)` has slope `5/(5x) = 1/x`, not `5x/5`.","_n":"1k2e5","_k":"ba19877c"},{"t":"Step 4 is correct.","why":"The chain rule multiplies the rates; it doesn’t add them.","_n":"1l3d5","_k":"225c17ad"},{"t":"`dy/dx = (x^2 + 3x)/(2x + 3)`.","why":"It’s `g′` over `g`. Check: `ln(5x)` has slope `5/(5x) = 1/x`, not `5x/5`.","_n":"1m3c5","_k":"f297127f"},{"t":"`dy/dx = (1/u)(2x + 3) = (2x + 3)/(x^2 + 3x)`.","why":"The chain rule multiplies `dy/du` by `du/dx`.","_n":"1nbb5","_k":"561aba59"}],"hints":["How does the chain rule combine `dy/du` and `du/dx`?","It multiplies them.","`(2x + 3)/(x^2 + 3x)`."]},{"id":"e2","goal":4,"task":"Differentiate `y = ln(x(x + 5))` for `x > 0`.","steps":["For `x > 0` both factors are positive, so log laws apply.","`ln(x(x + 5)) = ln x · ln(x + 5)`.","Product rule: `y′ = {1}/{x} ln(x + 5) + ln x · {1}/{x + 5}`.","That’s the final answer."],"_a":"VQ==","stepFb":["Step 1 is correct: it checks the domain.","","Step 3 differentiates step 2 correctly.","This follows; but is step 2’s rewrite true?"],"fixes":[{"t":"`ln(x(x + 5)) = ln x + ln(x + 5)`, so `y′ = 1/x + 1/(x + 5)`.","why":"The log of a product is a sum of logs.","_n":"1obc5","_k":"2698fecd"},{"t":"Step 2 is correct.","why":"Test `x = 1`: `ln 6 ≈ 1.79`, but `ln 1 · ln 6 = 0`.","_n":"1pb95","_k":"469641c7"},{"t":"`ln(x(x + 5)) = 2 ln x + ln 5`.","why":"`ln(ab) = ln a + ln b`. There is no law for `ln(a + b)`.","_n":"1qba5","_k":"581ecbae"},{"t":"`ln(x(x + 5)) = ln x + 5`.","why":"The 5 is inside a sum, not a factor.","_n":"1rbf5","_k":"a8e7b0de"}],"hints":["What does the product law say?","The log of a product is a \u003cstrong>sum\u003c/strong> of logs.","`1/x + 1/(x + 5)`."]},{"id":"e3","goal":3,"task":"Find the slope of `y = (ln x)^2` at `x = e^2`.","steps":["`(ln x)^2 = 2 ln x`.","`y′ = 2/x`.","At `x = e^2`: `2/e^2`."],"_a":"VA==","stepFb":["","Step 2 differentiates step 1 correctly.","Step 3 evaluates step 2 correctly."],"fixes":[{"t":"`(ln x)^2` is the square of `ln x`: `y′ = 2 ln x · (1/x)`, so at `e^2`: `2 · 2/e^2 = 4/e^2`.","why":"Chain rule with `u = ln x`.","_n":"1sc05","_k":"f0202bbd"},{"t":"Step 1 is correct.","why":"The power law is for `ln(x^2)`, not `(ln x)^2`.","_n":"1tbd5","_k":"b7971172"},{"t":"`y′ = 2 ln x`, so the slope is 4.","why":"The chain factor `1/x` is missing.","_n":"1ube5","_k":"5d0a3f96"},{"t":"`y′ = 2/(x ln x)`, so `1/e^2`.","why":"That divides by `ln x` instead of multiplying.","_n":"1vb35","_k":"a454d37b"}],"hints":["Is the square on `x` or on `ln x`?","On `ln x`: use the chain rule with `u = ln x`.","`2u · u′ = 2 ln x/x`; at `e^2`, `4/e^2`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the mirror: that the twin slopes always multiply to 1, or that `ln x` keeps rising forever?"},{"id":"j2","q":"In your own words, why is the slope of `ln x` equal to `1/x`?"},{"id":"j3","q":"Explain to a friend when simplifying with log laws first saves work, and when it isn’t allowed."},{"id":"j4","q":"Which kind of log derivative still trips you up? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"`d/dx log_{5} x` = ?","options":[{"t":"`ln 5/x`","why":"`ln 5` belongs in the denominator. `log_{b} x = ln x/ln b`, so the slope is `1/(x ln b)`.","_n":"1wb45","_k":"c97186ad"},{"t":"`1/(x log 5)`","why":"Natural log, not base 10. `log_{b} x = ln x/ln b`, so the slope is `1/(x ln b)`.","_n":"1xc16","_k":"a9572681"},{"t":"`1/(x ln 5)`","why":"`log_{5} x = ln x/ln 5`.","_n":"1yc06","_k":"2623c61e"},{"t":"`1/(5x)`","why":"The base isn’t a factor of `x`.","_n":"1zc36","_k":"89404f75"}]},"b":{"prompt":"`d/dx log_{7} x` = ?","options":[{"t":"`1/(x log 7)`","why":"Natural log, not base 10. `log_{b} x = ln x/ln b`, so the slope is `1/(x ln b)`.","_n":"20c26","_k":"381cab4f"},{"t":"`1/(x ln 7)`","why":"`log_{7} x = ln x/ln 7`.","_n":"21bd6","_k":"a06a50e4"},{"t":"`1/(7x)`","why":"The base isn’t a factor of `x`.","_n":"22bc6","_k":"b08a90b7"},{"t":"`ln 7/x`","why":"`ln 7` belongs in the denominator. `log_{b} x = ln x/ln b`, so the slope is `1/(x ln b)`.","_n":"23bf6","_k":"05998f17"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"`d/dx ln(x^3 + 2x)` = ?","options":[{"t":"`1/(3x^2 + 2)`","why":"It’s `g′` over `g`. Check: `ln(5x)` has slope `5/(5x) = 1/x`, not `5x/5`.","_n":"24be6","_k":"b85e8ec7"},{"t":"`1/(x^3 + 2x)`","why":"ln of an inside function: divide the inside’s \u003cstrong>derivative\u003c/strong> by the inside.","_n":"25b96","_k":"b4afcb42"},{"t":"`(x^3 + 2x)/(3x^2 + 2)`","why":"It’s `g′` over `g`. Check: `ln(5x)` has slope `5/(5x) = 1/x`, not `5x/5`.","_n":"26b86","_k":"6ac28df4"},{"t":"`(3x^2 + 2)/(x^3 + 2x)`","why":"Inside’s derivative over the inside.","_n":"27a73","_k":"381fa96b"}]},"b":{"prompt":"`d/dx ln(x^4 - x)` = ?","options":[{"t":"`(x^4 - x)/(4x^3 - 1)`","why":"It’s `g′` over `g`. Check: `ln(5x)` has slope `5/(5x) = 1/x`, not `5x/5`.","_n":"28a83","_k":"45683e90"},{"t":"`1/(x^4 - x)`","why":"ln of an inside function: divide the inside’s \u003cstrong>derivative\u003c/strong> by the inside.","_n":"29a93","_k":"cd9c105c"},{"t":"`1/(4x^3 - 1)`","why":"It’s `g′` over `g`. Check: `ln(5x)` has slope `5/(5x) = 1/x`, not `5x/5`.","_n":"2aaa3","_k":"2883aa0c"},{"t":"`(4x^3 - 1)/(x^4 - x)`","why":"Inside’s derivative over the inside.","_n":"2bab3","_k":"46a3d4d7"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"`d/dx ln(7x)` = ?","options":[{"t":"`7/x`","why":"`ln(7x)` isn’t `7 ln x`.","_n":"2cac3","_k":"e1cdb5a0"},{"t":"`1/x`","why":"`ln 7 + ln x`; `ln 7` is a constant.","_n":"2dad3","_k":"924d919b"},{"t":"`1/(7x)`","why":"Multiply `1/(7x)` by the inside’s derivative, 7.","_n":"2eae3","_k":"f385852c"},{"t":"7","why":"The inside goes in the denominator.","_n":"2faf3","_k":"37eca7e4"}]},"b":{"prompt":"`d/dx ln(x/3)` = ?","options":[{"t":"`-1/3`","why":"`ln 3` is constant; its derivative is 0, and `ln x` gives `1/x`.","_n":"2gb03","_k":"d247c2d6"},{"t":"`1/x`","why":"`ln x - ln 3`.","_n":"2had3","_k":"35cce56f"},{"t":"`3/x`","why":"`1/(x/3)` still needs the factor `1/3`.","_n":"2iac3","_k":"bc2a6c0a"},{"t":"`1/(3x)`","why":"`ln(x/3)` differs from `ln x` only by a constant.","_n":"2jab3","_k":"c92579ec"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"At what point does `y = x^2 - 8 ln x` have a horizontal tangent?","options":[{"t":"`(4, 16 - 16 ln 2)`","why":"That solves `2x = 8`, not `2x = 8/x`.","_n":"2kaa3","_k":"d6b24b1e"},{"t":"`(2, 4 - 8 ln 2)`","why":"`2x - 8/x = 0` gives `x^2 = 4`, and `x > 0`.","_n":"2lb13","_k":"859246ef"},{"t":"`(2√2, 8 - 12 ln 2)`","why":"That uses `x - 8/x`: `d/dx x^2 = 2x`.","_n":"2mb03","_k":"c8bd6e68"},{"t":"`(-2, 4 - 8 ln 2)`","why":"`ln x` needs `x > 0`.","_n":"2naf3","_k":"4814a90c"}]},"b":{"prompt":"At what point does `y = 2x^2 - 16 ln x` have a horizontal tangent?","options":[{"t":"`(2, 8 - 16 ln 2)`","why":"`4x - 16/x = 0` gives `x^2 = 4`.","_n":"2oae3","_k":"7ba495c9"},{"t":"`(-2, 8 - 16 ln 2)`","why":"ln only accepts positive inputs. `x = -2` isn’t in the domain of `ln x`.","_n":"2pb53","_k":"ad2bde6c"},{"t":"`(2√2, 16 - 24 ln 2)`","why":"That uses `2x` for the derivative of `2x^2`.","_n":"2qb43","_k":"43a9a250"},{"t":"`(4, 32 - 32 ln 2)`","why":"That solves `4x = 16`.","_n":"2r3af","_k":"ac02031e"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"`f(x) = ln[(x - 1)^2(x + 2)]`. Find `f′(2)`.","options":[{"t":"1/4","why":"`1/[(x - 1)^2(x + 2)]` needs the inside’s derivative on top.","_n":"2s39f","_k":"941d192b"},{"t":"1/2","why":"Logs of factors add; their derivatives add too.","_n":"2t3cf","_k":"b624e736"},{"t":"5/4","why":"The power 2 comes to the front: `2 ln(x - 1)`.","_n":"2u3bf","_k":"303dbf66"},{"t":"9/4","why":"`f = 2 ln(x - 1) + ln(x + 2)` near `x = 2`, so `f′(2) = 2/1 + 1/4`.","_n":"2v3ef","_k":"8066e8f1"}]},"b":{"prompt":"`f(x) = ln[(x + 1)^3/(x - 1)]`. Find `f′(3)`.","options":[{"t":"−1/4","why":"The power 3 comes to the front.","_n":"2w3df","_k":"238dbf86"},{"t":"1/32","why":"ln of an inside function: divide the inside’s \u003cstrong>derivative\u003c/strong> by the inside.","_n":"2x40f","_k":"3a5ad9d0"},{"t":"1/4","why":"`f = 3 ln(x + 1) - ln(x - 1)`, so `f′(3) = 3/4 - 1/2`.","_n":"2y3ff","_k":"51260bc9"},{"t":"5/4","why":"A quotient gives a difference, not a sum.","_n":"2z42f","_k":"139ad748"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Which function has the same derivative as `y = ln x`?","options":[{"t":"`y = 5 ln x`","why":"Stretched: slope `5/x`.","_n":"3041f","_k":"22570716"},{"t":"`y = ln(x + 5)`","why":"Shifted left: slope `1/(x + 5)`.","_n":"31d4f","_k":"90f65ee2"},{"t":"`y = ln(5x)`","why":"`ln 5 + ln x`: shifted up, same slopes.","_n":"32d5f","_k":"9179284b"},{"t":"`y = log_{5} x`","why":"Slope `1/(x ln 5)`.","_n":"33d2f","_k":"aa866a86"}]},"b":{"prompt":"Which function has derivative `3/x`?","options":[{"t":"`y = log_{3} x`","why":"Slope `1/(x ln 3)`.","_n":"34d3f","_k":"b5fb80d8"},{"t":"`y = ln(x^3)`","why":"`3 ln x`.","_n":"35d0f","_k":"94fff045"},{"t":"`y = (ln x)^3`","why":"Slope `3(ln x)^2/x`.","_n":"36d1f","_k":"830d9ec8"},{"t":"`y = ln(3x)`","why":"`ln 3 + ln x`: slope `1/x`.","_n":"37cef","_k":"98cd235c"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why the slope of `y = ln x` at `(4, ln 4)` is 1/4?","options":[{"t":"“At `x = 4`, `ln x` is about 1.39, which is close to 1/4 after rounding.”","why":"1.39 isn’t close to 0.25; the slope is a different number from the height.","_n":"38cff","_k":"4b6de42c"},{"t":"“`(4, ln 4)` on `ln x` mirrors `(ln 4, 4)` on `e^x`, where the slope equals the height, 4. Reflecting in `y = x` swaps rise and run, so the slope becomes 1/4.”","why":"Mirror points have reciprocal slopes.","_n":"39ccf","_k":"0268257b"},{"t":"“The slope of `ln x` is ln of the slope of `e^x`.”","why":"`ln 4 ≈ 1.39`, not 1/4.","_n":"3acdf","_k":"18b130bb"},{"t":"“`ln x` and `e^x` are inverses, so their slopes are opposites: −4 becomes 1/4.”","why":"Reflection gives reciprocals, not opposites.","_n":"3bcee","_k":"35b592d4"}]},"b":{"prompt":"Which is the best explanation of why the slope of `y = ln x` at `(1/2, -ln 2)` is 2?","options":[{"t":"“`(1/2, -ln 2)` mirrors `(-ln 2, 1/2)` on `e^x`, where the slope equals the height, 1/2. Reflection swaps rise and run, so the slope on `ln x` is 2.”","why":"Mirror points have reciprocal slopes.","_n":"3ccde","_k":"b08df2d7"},{"t":"“The slope of `ln x` is the height of `ln x` doubled.”","why":"The height is `-ln 2 ≈ -0.69`.","_n":"3dcce","_k":"01b52120"},{"t":"“`ln x` is negative there, so its slope must be negative.”","why":"`ln x` always rises: its slope is always positive.","_n":"3ecbe","_k":"445bfcd8"},{"t":"“The slopes are opposites: −1/2 becomes 2.”","why":"Reciprocals, not opposites.","_n":"3fd2e","_k":"094711fa"}]}},{"id":"c2","cat":"C","goal":[3,4],"a":{"prompt":"Which is the clearest correct first step to differentiate `y = ln(x^3√{x + 1})` for `x > 0`?","options":[{"t":"“Rewrite as `3 ln x + (1/2) ln(x + 1)`, then differentiate term by term.”","why":"Product → sum, powers to the front.","_n":"3gd1e","_k":"d64d1407"},{"t":"“Rewrite as `ln(x^3) · ln(√{x + 1})`.”","why":"`ln(ab) = ln a + ln b`. There is no law for `ln(a + b)`.","_n":"3hd0e","_k":"b84d6a2e"},{"t":"“Rewrite as `(ln x)^3 + √{ln(x + 1)}`.”","why":"The power law brings the exponent to the front of the log.","_n":"3icfe","_k":"a32ff8c0"},{"t":"“Rewrite as `3 ln x · (1/2) ln(x + 1)`.”","why":"Logs of factors add.","_n":"3jc6e","_k":"f22b479f"}]},"b":{"prompt":"Which is the clearest correct first step to differentiate `y = ln(x^2/(x - 4)^5)` for `x > 4`?","options":[{"t":"“Rewrite as `2 ln x + 5 ln(x - 4)`.”","why":"A quotient gives a difference.","_n":"3kc5e","_k":"fc5d1cb1"},{"t":"“Rewrite as `ln(x^2)/ln((x - 4)^5)`.”","why":"`ln(ab) = ln a + ln b`. There is no law for `ln(a + b)`.","_n":"3lc8e","_k":"55ddd7e3"},{"t":"“Rewrite as `2 ln x - 5 ln(x - 4)`, then differentiate term by term.”","why":"Quotient → difference, powers to the front.","_n":"3mc9e","_k":"ec6d9c78"},{"t":"“Rewrite as `(ln x)^2 - (ln(x - 4))^5`.”","why":"`(ln x)^2` is a square of `ln x`: chain rule gives `2 ln x · (1/x)`. `ln(x^2) = 2 ln x` gives `2/x`.","_n":"3ncae","_k":"a1757da4"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"After `t` weeks of practice, a student types `S(t) = 30 + 20 ln(t + 1)` words per minute. How fast is the speed increasing at `t = 4` weeks?","options":[{"t":"4 words per minute per week","why":"`S′(t) = 20/(t + 1) = 20/5`.","_n":"3ocbe","_k":"440f036d"},{"t":"`20/(5 ln 10)` words per minute per week","why":"ln is base `e`: no `ln 10`.","_n":"3pcce","_k":"66945704"},{"t":"`20 ln 5` words per minute","why":"That’s the gain since `t = 0`, not a rate.","_n":"3qcde","_k":"d755594e"},{"t":"5 words per minute per week","why":"`d/dt ln(t + 1)` is `1/(t + 1)`, not `1/t`.","_n":"3rcee","_k":"1d0682e4"}]},"b":{"prompt":"A toddler knows `V(t) = 50 + 300 ln(t + 1)` words after `t` months of a program. How fast is the vocabulary growing at `t = 5` months?",
