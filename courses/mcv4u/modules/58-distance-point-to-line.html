.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 58: Shortest path (V3 2D board + V1 3D view, distance graph, Formula view), Feet and parallels stations,
   Beyond the formula box frames, Five from P task */
.dp-heq2{display:block;margin-top:.35em;font-size:.8em}
.dp-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
.dp-hsvg{width:100%;height:auto;display:block}
.dp-ex{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.dp-main,.dp-side{min-width:0}
.dp-ex [hidden],.dp-st [hidden]{display:none!important}
.dp-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:0 0 8px}
.dp-vw{display:inline-flex;flex-wrap:wrap;gap:6px}
.dp-tg[aria-pressed="true"]{background:var(--info-bg);border-color:var(--ink);font-weight:700}
.dp-tg[aria-pressed="true"]::before{content:"✓ "}
canvas.plot.dp-c2{touch-action:none}
.dp-svg{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);touch-action:none;cursor:grab}
.dp-svg:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dp-pre{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0}
.dp-h{font-weight:700;margin:0 4px 0 0}
.dp-rn{margin:6px 0 0}
.dp-note{min-height:1.4em;margin:8px 0 0;font-weight:700}
.dp-key{margin:4px 0 0}
.dp-dg{margin-top:10px}
.dp-dg .dp-h{margin:0 0 4px}
canvas.plot.dp-dgc{aspect-ratio:16/7}
.dp-sl{margin-top:4px}
.dp-sl input{width:100%;min-height:28px}
.dp-sl output{color:var(--ink);font-weight:700}
.dp-pn{margin:2px 0 8px}
.dp-side dl.read.dp-read{margin-top:12px}
.dp-steps{margin:0 0 10px;padding-left:1.4em}
.dp-steps li{margin:0 0 6px;color:var(--ink-2)}
.dp-steps li.dp-on{color:var(--ink);font-weight:600}
.dp-stg{align-items:start}
.dp-frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.dp-frame .dp-in{width:5.2rem}
.dp-ft{white-space:nowrap}
.dp-stp{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.dp-stp label{min-width:7.5rem}
.dp-stp input{width:4.6rem}
@media (max-width:760px){
  .dp-ex{grid-template-columns:minmax(0,1fr)}
  .dp-hero{grid-template-columns:minmax(0,1fr)}
}

r2","title":"Cartesian Equation of a Line in R²","kind":"topic","group":"8"},{"nn":"50","slug":"equations-of-lines-in-r3","title":"Vector, Parametric and Symmetric Equations of Lines in R³","kind":"topic","group":"8"},{"nn":"51","slug":"vector-equation-of-a-plane","title":"Vector Equation of a Plane","kind":"topic","group":"8"},{"nn":"52","slug":"cartesian-equation-of-a-plane","title":"Cartesian Equation of a Plane","kind":"topic","group":"8"},{"nn":"53","slug":"intersection-of-lines-with-planes","title":"Intersection of Lines with Planes","kind":"topic","group":"9"},{"nn":"54","slug":"intersection-of-lines","title":"Intersection of Lines in R² and R³","kind":"topic","group":"9"},{"nn":"55","slug":"systems-of-equations-matrices","title":"Systems of Equations (Matrices)","kind":"topic","group":"9"},{"nn":"56","slug":"intersection-of-two-planes","title":"Intersection of Two Planes","kind":"topic","group":"9"},{"nn":"57","slug":"intersection-of-three-planes","title":"Intersection of Three Planes","kind":"topic","group":"9"},{"nn":"58","slug":"distance-point-to-line","title":"Distance from a Point to a Line in R² and R³","kind":"topic","group":"9"},{"nn":"59","slug":"distance-point-to-plane","title":"Distance from a Point to a Plane","kind":"topic","group":"9"}]},"salt":"4398b954","content":{"id":"58-distance-point-to-line","kind":"topic","title":"Distance from a point to a line","topic":"Distance from a Point to a Line in R² and R³","readyTopic":"the distance from a point to a line","hero":{"eq":"`d = {|vec{QP} × vec{m}|}/{|vec{m}|}` \u003cspan class=\"dp-heq2\">R²: `d = {|Ax_0 + By_0 + C|}/{√{A^2 + B^2}}`\u003c/span>","eqLabel":"d equals the magnitude of Q P cross m, over the magnitude of m. In R 2: d equals the absolute value of A x nought plus B y nought plus C, over the square root of A squared plus B squared.","eqSize":"sm","headline":"The shortest way to a line is straight across","text":"From a point, you can reach a line in many ways, but only one is shortest: the path that meets the line at a \u003cstrong>right angle\u003c/strong>. Its end is the \u003cstrong>foot of the perpendicular\u003c/strong>. Projections and cross products measure that path without having to find the foot first.","fig":{"html":"\u003cdiv class=\"dp-hero\">\u003cdiv class=\"plot-wrap\">\u003ccanvas class=\"plot\" id=\"hero-plot\" role=\"img\" aria-label=\"The line 3x + 4y − 12 = 0 and the point P(3, 7). A dashed segment from P to a point sliding along the line stretches and shrinks; its length label ticks down to 5.0 and stops at F(0, 3), where a right-angle mark appears.\">\u003c/canvas>\u003c/div>\u003csvg class=\"dp-hsvg\" id=\"hero-3d\" viewBox=\"0 0 420 300\" role=\"img\" aria-label=\"A line in space with the point P off it. The parallelogram on vector QP and the direction m shades in, and its height, from P straight across to the line, glows. Caption: height = area ÷ base.\" focusable=\"false\">\u003c/svg>\u003c/div>"}},"goals":["I can explain why the shortest distance from a point to a line is along the perpendicular.","I can find the distance from a point to a line in R² using `{|Ax_0 + By_0 + C|}/{√{A^2 + B^2}}`.","I can find the distance from a point to a line in R³ using `{|vec{QP} × vec{m}|}/{|vec{m}|}`.","I can find the foot of the perpendicular (the closest point on the line).","I can find the distance between two parallel lines.","I can solve problems involving the distance from a point to a line in context."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Projections","goal":2,"prompt":"What is the scalar projection of `(3, 4)` on `(1, 0)`?","options":[{"t":"5","why":"That’s `|(3, 4)|`.","_n":"00e0","_k":"9be832ae"},{"t":"4","why":"Projects onto the `y`-direction: `(1, 0)` points along `x`.","_n":"1110","_k":"5f8581ec"},{"t":"3","why":"`(3, 4) · (1, 0) ÷ 1 = 3`.","_n":"2100","_k":"53e354f1"},{"t":"`(3, 0)`","why":"That’s the vector projection. The scalar projection is a number.","_n":"3130","_k":"950761c0"}],"hints":["`(vec{a} · vec{b})/|vec{b}|`.","`3 × 1 + 4 × 0 = 3`.","3."]},{"id":"w2","skill":"Projections","goal":2,"prompt":"What is the scalar projection of `vec{a} = (2, 6)` on `vec{n} = (3, 4)`?","options":[{"t":"6/5","why":"Dividing by `|vec{n}|^2` gives the factor for the vector projection.","_n":"4120","_k":"9d97ad4e"},{"t":"`2√10`","why":"That’s the length of `vec{a}`, not its shadow.","_n":"5150","_k":"f1573674"},{"t":"30","why":"Divide by 5: you need `|vec{n}|`.","_n":"6140","_k":"dad45e06"},{"t":"6","why":"`(6 + 24)/5 = 6`.","_n":"7070","_k":"297e5f20"}],"hints":["Dot, then divide by `|vec{n}|`.","`vec{a} · vec{n} = 30`, `|vec{n}| = 5`.","6."]},{"id":"w3","skill":"Cross product and area","goal":3,"prompt":"What is the area of the parallelogram with sides `(1, 0, 0)` and `(0, 2, 0)`?","options":[{"t":"0","why":"The dot product is 0; the area isn’t.","_n":"8060","_k":"a849b165"},{"t":"1","why":"That’s the triangle.","_n":"9451","_k":"b4ee78d0"},{"t":"2","why":"`|(0, 0, 2)| = 2`.","_n":"a461","_k":"76124e58"},{"t":"3","why":"Area multiplies.","_n":"b471","_k":"a63b0d85"}],"hints":["Area `= |vec{a} × vec{b}|`.","`(1, 0, 0) × (0, 2, 0) = (0, 0, 2)`.","2."]},{"id":"w4","skill":"Cross product and area","goal":3,"prompt":"`|vec{a}| = 4`, `|vec{b}| = 3` and the angle between them is 30°. What is `|vec{a} × vec{b}|`?","options":[{"t":"6","why":"`4 × 3 × sin 30° = 12 × 1/2`.","_n":"c481","_k":"7d12703c"},{"t":"`6√3`","why":"Cross product magnitude uses `sin θ`.","_n":"d491","_k":"b2eba00d"},{"t":"3","why":"`4 × 3 × 1/2 = 6`.","_n":"e4a1","_k":"1b764ba8"},{"t":"12","why":"That ignores the angle: multiply by `sin 30° = 1/2`.","_n":"f4b1","_k":"62f10718"}],"hints":["`|vec{a} × vec{b}| = |vec{a}||vec{b}| sin θ`.","`sin 30° = 1/2`.","6."]},{"id":"w5","skill":"Equations of lines","goal":2,"prompt":"Write `y = 2x - 3` in the form `Ax + By + C = 0`.","options":[{"t":"`2x + y - 3 = 0`","why":"The `y` changes sign when it moves.","_n":"g4c1","_k":"480fbc40"},{"t":"`2x - y - 3 = 0`","why":"Move `y` to the right side.","_n":"h3d1","_k":"dd4f1b3a"},{"t":"`2x - y + 3 = 0`","why":"Check `(0, -3)`: `0 + 3 + 3 ≠ 0`.","_n":"i3e1","_k":"ff89dc3d"},{"t":"`-2x - y - 3 = 0`","why":"Check `(0, -3)`: `0 + 3 - 3 = 0` ✓, but `(1, -1)`: `-2 + 1 - 3 ≠ 0`.","_n":"jb71","_k":"10e11387"}],"hints":["Get everything on one side.","`0 = 2x - y - 3`.","`2x - y - 3 = 0`."]},{"id":"w6","skill":"Equations of lines","goal":4,"prompt":"Which vector is a normal to the line `vec{r} = (1, 2) + t(3, -1)`?","options":[{"t":"`(3, -1)`","why":"That’s the direction.","_n":"kb61","_k":"e41f141b"},{"t":"`(1, 3)`","why":"`(1, 3) · (3, -1) = 0`.","_n":"lb91","_k":"6072c82c"},{"t":"`(1, 2)`","why":"`(1, 2)` is a position, not a normal.","_n":"mb81","_k":"88996d43"},{"t":"`(-3, 1)`","why":"Still parallel to the line.","_n":"nbb1","_k":"ae67152a"}],"hints":["A normal is perpendicular to the direction.","Swap the components and change one sign.","`(1, 3)`."]}],"refreshers":{"Projections":"The scalar projection of `vec{a}` on `vec{b}` is `(vec{a} · vec{b})/|vec{b}|`, the signed length of `vec{a}`’s shadow on `vec{b}`’s line.","Cross product and area":"`|vec{a} × vec{b}| = |vec{a}||vec{b}| sin θ` is the area of the parallelogram on `vec{a}` and `vec{b}`.","Equations of lines":"In R², `Ax + By + C = 0` has normal `(A, B)`. A direction `(a, b)` has normal `(b, -a)`."}}},"explore":{"heading":"Shortest path","intro":"Slide the point F along the line and watch the distance from P. Find where it’s smallest, and see what’s special about that spot.","txt":{"mode":"Space","r2":"R²","r3":"R³","views":"Views","graph":"Distance graph","formula":"Formula view","tSlider":"F on the line: `t`","tNote":"Arrow keys move F by 0.25; Shift + arrows move it by 1.","pNote":"Drag P, or tap P and use the arrow keys (it stays on whole numbers from −8 to 8).","px":"P: `x`","py":"P: `y`","pz":"P: `z`","presets":"3D view","iso":"Isometric","front":"Front (xz)","side":"Side (yz)","top":"Top (xy)","rotNote":"Drag the 3D view, or tap it and use the arrow keys, to turn it.","show":"Show the shortest distance","hidden":"(find it, or press Show)","perp":"0: perpendicular ✓","rows":{"line":"Line","p":"P","f":"F","pf":"`|PF|`","dot":"`vec{PF} · vec{m}`","best":"Shortest distance","formula":"Formula"},"key2":"Line in blue; `vec{n}` magenta; `vec{QP}` teal; the distance PF in ink.","key3":"Line `L` and `vec{m}` in blue; `vec{QP}` teal; the distance PF in ink.","dgLabel":"`|PF|` against `t`","at":"at","reflect":"(the reflection of P in the line is 2F − P)"},"predIntro":"Make a prediction first. Then the shortest-path tool shows you what really happens.","predictions":[{"id":"p1","prompt":"R², F at `t = 0`, i.e. (4, 0). As F slides from (4, 0) toward (0, 3), what happens to `|PF|`?","options":[{"t":"It keeps decreasing","_n":"oba1","_k":"df466320"},{"t":"It keeps increasing","_n":"pbd1","_k":"5d77bc32"},{"t":"It decreases to 5, then increases","_n":"qbc1","_k":"16fe954f"},{"t":"It stays the same","_n":"rbf1","_k":"4e4d5352"}],"explain":"The distance is least at one point, the foot F(0, 3). (4, 0) is just the point named in the equation."},{"id":"p2","prompt":"At the closest point, what’s the angle between `vec{PF}` and the line?","options":[{"t":"It depends on where P is","_n":"sbe1","_k":"8523c480"},{"t":"90°","_n":"t511","_k":"f84dff71"},{"t":"45°","_n":"u521","_k":"643b4a14"},{"t":"0°","_n":"v4f1","_k":"5d27046c"}],"explain":"If the angle weren’t 90°, sliding F a little toward P’s side would shorten PF."},{"id":"p3","prompt":"R², Formula view, P moved to (−1, −2). Now `3x_0 + 4y_0 - 12 = -23`. What is the distance?","options":[{"t":"−23/5","_n":"w501","_k":"be4bc6b0"},{"t":"23/25","_n":"x4d1","_k":"64272650"},{"t":"23/5","_n":"y4e1","_k":"0045c4d3"},{"t":"23","_n":"z4b1","_k":"5668a464"}],"explain":"The negative sign says P is on the other side of the line. Distance is `|-23|/5`."},{"id":"p4","prompt":"R³, P(5, −1, 1). `|vec{QP}| = 3√2` for Q(1, 0, 2). Is the distance from P to the line `3√2`?","options":[{"t":"Yes","_n":"104c1","_k":"9d69a18e"},{"t":"You can’t tell without a scalar equation","_n":"11491","_k":"becbc72d"},{"t":"No, it’s larger","_n":"124a1","_k":"bb1c5c06"},{"t":"No, it’s smaller","_n":"13c31","_k":"3653abaf"}],"explain":"Q is just the line’s starting point. The perpendicular height of the parallelogram is `9 ÷ 3 = 3`."}],"chalIntro":"Use the shortest-path tool, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"R² mode: slide F to the closest point to P(3, 7), then press Check.","why":"At `t = -1`, F = (0, 3): `vec{PF} · vec{m} = 25 + 25t = 0`, and the distance is 5.","hints":["Watch the `vec{PF} · vec{m}` row.","`vec{PF} · vec{m} = 25 + 25t`.","`t = -1`: F(0, 3), distance 5."],"msgs":{"mode":"Switch to R² mode first.","p":"Put P back at (3, 7) first.","t0":"That’s (4, 0), the point in the equation, not the closest.","close":"Close. At the closest point, `vec{PF} · vec{m} = 0`.","general":"Not yet: F isn’t the closest point. Watch `|PF|` and the `vec{PF} · vec{m}` row."}},{"id":"tc2","goal":2,"prompt":"R² mode: move P so that it’s exactly \u003cstrong>2\u003c/strong> units from the line `3x + 4y - 12 = 0`, \u003cstrong>above\u003c/strong> the line.","why":"`3x + 4y - 12 = 10`, so `|10|/5 = 2`, and the positive sign puts P above the line (`B > 0`).","hints":["`|3x + 4y - 12|/5 = 2`.","Above: `3x + 4y - 12 = 10`, so `3x + 4y = 22`.","(2, 4): `6 + 16 = 22`."],"msgs":{"mode":"Switch to R² mode first.","side":"Right distance, wrong side.","num":"You’ve made the numerator 2. Divide by `√{3^2 + 4^2} = 5`.","general":"Not yet: P must be exactly 2 units from the line, above it. Watch the Formula view."}},{"id":"tc3","goal":4,"stretch":true,"prompt":"R³ mode: place P so that its distance to `L` is 3 \u003cstrong>and\u003c/strong> the foot of the perpendicular is (1, 0, 2).","why":"P − (1, 0, 2) is perpendicular to `(2, 1, -2)` and has length 3, so F = (1, 0, 2) and the distance is 3.","hints":["P = (1, 0, 2) + `vec{v}`, where `vec{v} ⟂ (2, 1, -2)` and `|vec{v}| = 3`.","Whole-number vectors of length 3 look like `(2, 2, 1)` or `(3, 0, 0)`, with signs and order changed.","`(2, -2, 1)`: `4 - 2 - 2 = 0`, so P(3, −2, 3)."],"msgs":{"mode":"Switch to R³ mode first.","foot":"The distance is right, but the closest point isn’t (1, 0, 2). `vec{PF}` must be perpendicular to `vec{m}` at F(1, 0, 2).","len":"Perpendicular, but the offset has length","len2":"≠ 3.","general":"Not yet: P − (1, 0, 2) must be perpendicular to `(2, 1, -2)` and have length 3."}}]},"part3":{"slug":"parallel","name":"Feet and parallels","heading":"Feet and parallels","intro":"Explore found the minimum by sliding. Here you compute the foot exactly, step by step, and stretch the distance idea to parallel lines. The picture checks each step.","labels":{"toggle":"Write the second line as `6x + 8y + 16 = 0`"},"st1":{"title":"Station 1: the foot in R³","text":"`L`: `vec{r} = (1, 0, 2) + t(2, 1, -2)`, P(5, −1, 1). Step through the algebra; the 3D view marks F and the right angle.","fig":"3D view of the line L and the point P(5, −1, 1).","steps":["F = `(1 + 2t, t, 2 - 2t)`.","`vec{PF} = (2t - 4, t + 1, 1 - 2t)`.","`vec{PF} · vec{m} = 9t - 9 = 0`, so `t = 1`.","F = (3, 1, 0), and `|PF| = |(-2, 2, -1)| = 3`, which matches the cross-product formula: `9 ÷ 3 = 3`."]},"st2":{"title":"Station 2: parallel lines in R²","text":"`3x + 4y - 12 = 0` and `3x + 4y + 8 = 0` have the same normal `(3, 4)`, so they’re parallel. Step through, then try the toggle.","fig":"Graph of the two parallel lines with the point (4, 0) on the first.","steps":["Pick (4, 0) on the first line.","Its distance to the second line is `|12 + 0 + 8|/5 = 4`.","Shortcut: `|C_1 - C_2|/√{A^2 + B^2} = 20/5 = 4`, \u003cstrong>only after\u003c/strong> the `A` and `B` match."],"stepsAlt":["Pick (4, 0) on the first line.","Its distance to `6x + 8y + 16 = 0` is `|24 + 0 + 16|/√{36 + 64} = 40/10 = 4`.","Shortcut: the `A` and `B` don’t match yet. Divide by 2 first: `3x + 4y + 8 = 0`, then `|-12 - 8|/5 = 4`. Without dividing, `|-12 - 16|/5` gives the wrong 28/5."]},"st3":{"title":"Station 3: parallel lines in R³","text":"`vec{r} = (1, 0, 2) + t(2, 1, -2)` and `vec{r} = (5, -1, 1) + s(2, 1, -2)` share the direction `(2, 1, -2)`.","fig":"3D view of two parallel lines joined by a strip of equal perpendicular segments.","steps":["The lines are parallel: both have direction `(2, 1, -2)`.","The distance is the distance from (5, −1, 1) to the first line: `|vec{QP} × vec{m}|/|vec{m}| = 9 ÷ 3 = 3`.","Every perpendicular segment between the lines has the same length, 3."]},"quickCheck":{"title":"Quick check","summary":"Feet and parallels quick check","items":[{"id":"q1","goal":2,"prompt":"Distance from (1, 2) to `4x - 3y + 7 = 0`?","choices":[{"t":"1/5","fb":"Divide by `√25 = 5`, not 25.","_n":"14c21","_k":"f8d556b2"},{"t":"1","fb":"Right. `|4 - 6 + 7|/5 = 5/5 = 1`.","_n":"15c11","_k":"9bd950ef"},{"t":"9/5","fb":"The constant is +7.","_n":"16c01","_k":"5e8222f6"},{"t":"5","fb":"Divide by 5. Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"17bf1","_k":"b56a5662"}]},{"id":"q2","goal":4,"prompt":"Foot of the perpendicular from P(0, 5) to `vec{r} = t(1, 1)` in R²?","choices":[{"t":"(5, 5)","fb":"`vec{PF} = (t, t - 5)`; `vec{PF} · (1, 1) = 2t - 5 = 0`.","_n":"18be1","_k":"e0959222"},{"t":"(0, 0)","fb":"`vec{PF} = (t, t - 5)`; `vec{PF} · (1, 1) = 2t - 5 = 0`.","_n":"19bd1","_k":"6d13b0a6"},{"t":"(5/2, 5/2)","fb":"Right. `vec{PF} = (t, t - 5)`; `vec{PF} · (1, 1) = 2t - 5 = 0`, so `t = 5/2`.","_n":"1abc1","_k":"2cc2e786"},{"t":"(1, 1)","fb":"`vec{PF} = (t, t - 5)`; `vec{PF} · (1, 1) = 2t - 5 = 0`.","_n":"1bcb1","_k":"87802f94"}]},{"id":"q3","goal":5,"prompt":"Distance between `2x - y + 3 = 0` and `2x - y - 7 = 0`?","choices":[{"t":"`2√5`","fb":"Right. `|3 - (-7)|/√5 = 10/√5 = 2√5`.","_n":"1cca1","_k":"28674d75"},{"t":"10","fb":"`|3 - (-7)|/√5 = 10/√5 = 2√5`.","_n":"1dbd1","_k":"175fb02b"},{"t":"2","fb":"`|3 - (-7)|/√5 = 10/√5 = 2√5`.","_n":"1ebe1","_k":"f8e45aff"},{"t":"`4/√5`","fb":"`|3 - (-7)|/√5 = 10/√5 = 2√5`.","_n":"1fbf1","_k":"6d1b7373"}]},{"id":"q4","goal":3,"prompt":"In R³, the distance from P to the line through Q with direction `vec{m}` is…","choices":[{"t":"`{|vec{QP} · vec{m}|}/{|vec{m}|}`","fb":"The dot version measures along the line, not across it. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"1gc01","_k":"4dbd363b"},{"t":"`{|vec{QP} × vec{m}|}/{|vec{QP}|}`","fb":"The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"1hb91","_k":"ffd35e66"},{"t":"`|vec{QP}|`","fb":"That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"1iba1","_k":"2a1c95e7"},{"t":"`{|vec{QP} × vec{m}|}/{|vec{m}|}`","fb":"Right. Parallelogram height = area ÷ base.","_n":"1jbb1","_k":"1d0e5550"}]}]}},"practice":{"activities":[{"id":"calc","type":"numeric","title":"Distance calculator","summary":"Distance calculator","goal":[2,3,5],"instruction":"Find each distance. Give exact values.","how":"Type an exact answer, then press Check: whole numbers, fractions such as 6/13, or roots such as √5, 2√2 or 3/√10.","items":[{"id":"d1","goal":2,"prompt":"(2, −1) to `5x + 12y - 4 = 0`","_a":"BB0NDlMMBgwABQgNUQEBAgUGDw==","display":"6/13","keypad":"text","why":"`|10 - 12 - 4|/13 = 6/13`.","wrong":[{"match":6,"fb":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative."},{"match":-0.46153846153846156,"fb":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative."},{"match":-6,"fb":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative."}],"hints":["`d = {|Ax_0 + By_0 + C|}/{√{A^2 + B^2}}`.","`5(2) + 12(-1) - 4 = -6`, and `√{25 + 144} = 13`.","`|-6|/13 = 6/13`."]},{"id":"d2","goal":2,"prompt":"(−3, 4) to `y = 2x + 5`","_a":"Bh0LC1QJAwMNBA4MWwACDQ==","display":"`√5`","keypad":"text","why":"`2x - y + 5 = 0`: `|-6 - 4 + 5|/√5 = 5/√5 = √5`.","general":"Rearrange: `2x - y + 5 = 0`. Rearrange first: `y = 3x - 4` is `3x - y - 4 = 0`, so `B = -1`.","hints":["Rearrange first.","`2x - y + 5 = 0`; `2(-3) - 4 + 5 = -5`.","`5/√5 = √5`."]},{"id":"d3","goal":2,"prompt":"The origin to `x + y - 4 = 0`","_a":"Bh0BCloNBwMFAQ0PVg8EDQQA","display":"`2√2`","keypad":"text","why":"`|0 + 0 - 4|/√2 = 4/√2 = 2√2`.","wrong":[{"match":4,"fb":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative."},{"match":-4,"fb":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative."}],"hints":["Substitute (0, 0).","`|-4|/√{1 + 1}`.","`4/√2 = 2√2`."]},{"id":"d4","goal":2,"prompt":"(1, 1) to `vec{r} = (3, 0) + t(4, 3)` in R²","_a":"Bg==","display":"2","keypad":"text","why":"Normal `(3, -4)`: `3x - 4y - 9 = 0`, so `|3 - 4 - 9|/5 = 2`.","wrong":[{"match":1,"fb":"Using `(4, 3)` as the normal: In R², a direction `(a, b)` gives a normal `(b, -a)`. The formula needs the normal. Normal `(3, -4)`: `3x - 4y - 9 = 0`."}],"hints":["Find a normal from the direction `(4, 3)`.","Normal `(3, -4)`: `3x - 4y - 9 = 0`.","`|3 - 4 - 9|/5 = 10/5 = 2`."]},{"id":"d5","goal":3,"prompt":"(3, 1, 4) to `vec{r} = (0, 1, 1) + t(1, 2, 2)`","_a":"Bw==","display":"3","keypad":"text","why":"`|(-6, -3, 6)| = 9`, and `9 ÷ 3 = 3`.","wrong":[{"match":9,"fb":"Divide by `|vec{m}| = 3`. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`."}],"hints":["Q(0, 1, 1), `vec{QP} = (3, 0, 3)`.","`vec{QP} × vec{m} = (-6, -3, 6)`, length 9.","`9 ÷ 3 = 3`."]},{"id":"d6","goal":3,"prompt":"(4, 1, −2) to the `x`-axis","_a":"Bh0LC1QJAwMNBA4MWwACDQ==","display":"`√5`","keypad":"text","why":"The closest point on the `x`-axis is (4, 0, 0), so `d = √{1 + 4} = √5`.","wrong":[{"match":4.58257569495584,"fb":"That’s the distance to the origin (M1). The closest point on the `x`-axis is (4, 0, 0)."}],"hints":["The `x`-axis is `vec{r} = t(1, 0, 0)`.","The foot is (4, 0, 0).","`√{1^2 + (-2)^2} = √5`."]},{"id":"d7","goal":3,"prompt":"(4, 5, −2) to `vec{r} = t(2, 1, 2)`","_a":"Ag==","display":"6","keypad":"text","why":"`vec{OP} × vec{m} = (12, -12, -6)`, length 18, and `18 ÷ 3 = 6`.","wrong":[{"match":6.708203932499369,"fb":"That’s `|OP|`. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller."},{"match":18,"fb":"Divide by `|vec{m}| = 3`. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`."}],"hints":["Q is the origin, so `vec{QP} = (4, 5, -2)`.","`(4, 5, -2) × (2, 1, 2) = (12, -12, -6)`, length 18.","`18 ÷ 3 = 6`."]},{"id":"d8","goal":5,"prompt":"Between `6x - 8y + 1 = 0` and `3x - 4y - 2 = 0`","_a":"BB0M","display":"1/2","keypad":"text","why":"`6x - 8y - 4 = 0`, so `|1 - (-4)|/10 = 1/2`.","wrong":[{"match":0.3,"fb":"Match the coefficients first: `6x - 8y - 4 = 0`, then `|1 - (-4)|/10`."}],"hints":["Are the normals parallel?","Double the second equation.","`|1 + 4|/10 = 1/2`."]}]},{"id":"beyond","type":"custom","title":"Beyond the formula","summary":"Beyond the formula","star":true,"goal":[2,4,5,6],"instruction":"Non-routine distance problems. N5 and N6 go beyond the Final Check.","how":"Type exact numbers in the boxes (whole numbers, fractions such as −7/2, or roots such as √5), then press Check.","msgs":{"fill":"Fill in every box first.","err":"Type exact numbers only, such as 3, −7/2 or √5.","general":"Not yet. Check your work and try again."},"items":[{"id":"n1","goal":2,"star":true,"prompt":"Find both values of `k` for which `(k, 1)` is 3 units from `4x - 3y + 2 = 0`.","parts":["`k =`",{"k":"a"},"or `k =`",{"k":"b"}],"set":true,"_a":"TxFKXRYbD28AHxQLTAxoSQ==","display":"`k = 4` or `k = -7/2`","wrong":[{"has":[4],"fb":"`|4k - 1| = 15` has two cases."}],"why":"`|4k - 3 + 2|/5 = 3`, so `4k - 1 = ±15`: `k = 4` or `k = -7/2`.","hints":["`|4k - 3 + 2|/5 = 3`.","`4k - 1 = 15` or `4k - 1 = -15`.","`k = 4` or `-7/2`."]},{"id":"n2","goal":5,"star":true,"prompt":"Find both lines parallel to `5x + 12y - 3 = 0` and 2 units from it.","parts":["`5x + 12y +`",{"k":"a"},"`= 0` and `5x + 12y +`",{"k":"b"},"`= 0`"],"set":true,"_a":"TxFKXRYbD28GABUVUABoSQ==","display":"`5x + 12y + 23 = 0` and `5x + 12y - 29 = 0`","wrong":[{"set":[-1,-5],"fb":"The constants must differ by `2 × 13 = 26`."}],"why":"`|C - (-3)|/13 = 2`, so `C + 3 = ±26`: `C = 23` or `C = -29`.","hints":["Parallel lines keep `A = 5` and `B = 12`.","`|C + 3|/13 = 2`.","`C + 3 = ±26`: `C = 23` or `-29`."]},{"id":"n3","goal":4,"star":true,"prompt":"Find the point on `vec{r} = (3, 3, 0) + t(1, 2, 2)` closest to the origin, and the distance.","parts":["point (",{"k":"x"},",",{"k":"y"},",",{"k":"z"},"); distance",{"k":"d"}],"_a":"TxFBGlgLGRZNEQMJThtPFg4eCxRAXRcOB04=","display":"(2, 1, −2); distance 3","wrong":[{"when":{"x":3,"y":3,"z":0},"fb":"(3, 3, 0) is the point in the equation. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller."}],"why":"F = `(3 + t, 3 + 2t, 2t)`; `vec{OF} · (1, 2, 2) = 9 + 9t = 0`, so `t = -1`: F(2, 1, −2), distance `√{4 + 1 + 4} = 3`.","hints":["F = `(3 + t, 3 + 2t, 2t)`, and `vec{OF} · vec{m} = 0`.","`9 + 9t = 0`, so `t = -1`.","F(2, 1, −2), distance 3."]},{"id":"n4","goal":6,"star":true,"prompt":"Triangle A(1, 2, 0), B(3, 3, 2), C(4, 5, 0): find the height from C to line AB, then the area.","parts":["height",{"k":"h"},"; area",{"k":"a"}],"_a":"TxFRGlgKGRZVEQMMTAxI","display":"height 3; area 9/2","wrong":[{"when":{"a":9},"fb":"That’s the parallelogram; halve it."}],"why":"`vec{AC} × vec{AB} = (6, -6, -3)`, length 9, and `|vec{AB}| = 3`: height `9 ÷ 3 = 3`, area `1/2 × 3 × 3 = 9/2`.","hints":["`vec{AB} = (2, 1, 2)`, `vec{AC} = (3, 3, 0)`.","`|vec{AC} × vec{AB}| = 9`, `|vec{AB}| = 3`.","Height 3; area `9/2`."]},{"id":"n5","goal":5,"star":true,"prompt":"Distance between the parallel lines `vec{r} = (1, 0, 2) + t(2, 1, -2)` and `vec{r} = (7, 0, -1) + s(-4, -2, 4)`.","parts":["distance",{"k":"d"}],"_a":"TxFdGlgKSA==","display":"3","general":"Use any point of one line and the other line’s direction.","why":"P(7, 0, −1), Q(1, 0, 2): `vec{QP} = (6, 0, -3)`; `vec{QP} × (2, 1, -2) = (3, 6, 6)`, length 9, and `9 ÷ 3 = 3`.","hints":["Take P(7, 0, −1) on the second line and Q(1, 0, 2), `vec{m} = (2, 1, -2)` on the first.","`vec{QP} × vec{m} = (3, 6, 6)`, length 9.","`9 ÷ 3 = 3`."]},{"id":"n6","goal":4,"star":true,"prompt":"Find the reflection of P(3, 7) in the line `3x + 4y - 12 = 0`.","parts":["P′ = (",{"k":"x"},",",{"k":"y"},")"],"_a":"TxFBGlgUBhgWShsCTwhI","display":"(−3, −1)","wrong":[{"when":{"x":0,"y":3},"fb":"That’s the foot F. The reflection is as far past F as P is before it: 2F − P."}],"why":"F(0, 3), so P′ = 2F − P = (−3, −1).","hints":["Find the foot F first.","F(0, 3) (from Explore).","P′ = 2F − P = (−3, −1)."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Leo","how":"","goal":[2,3,4],"instruction":"Leo made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the distance from P(2, 5) to the line `y = 3x - 4`.","steps":["Write the line as `3x + y - 4 = 0`.","Substitute: `3(2) + 5 - 4 = 7`.","Divide by `√{9 + 1}`: `d = 7/√10`."],"_a":"BA==","stepFb":["","Step 2 substitutes correctly into step 1’s equation. The mistake is earlier.","Step 3 follows."],"fixes":[{"t":"`3x - y + 4 = 0`.","why":"Check `(0, -4)`: `0 + 4 + 4 ≠ 0`.","_n":"1kbc1","_k":"8e4bd287"},{"t":"`y - 3x - 4 = 0`.","why":"Check `(0, -4)`: `-4 - 0 - 4 ≠ 0`.","_n":"1lc51","_k":"9f8ea2cd"},{"t":"`3x - y - 4 = 0`, so `d = |6 - 5 - 4|/√10 = 3/√10 = 3√10/10`.","why":"Moving `y` to the right side changes its sign.","_n":"1mc61","_k":"05bda4d0"},{"t":"Step 1 is correct.","why":"Rearrange first: `y = 3x - 4` is `3x - y - 4 = 0`, so `B = -1`.","_n":"1n4f2","_k":"0b539664"}],"hints":["Does `(0, -4)` satisfy step 1’s equation?","`0 - 4 - 4 ≠ 0`.","`3x - y - 4 = 0`."]},{"id":"e2","goal":3,"task":"Find the distance from P(4, 1, −1) to `vec{r} = (1, 0, 1) + t(2, 2, 1)`.","steps":["Q(1, 0, 1), so `vec{QP} = (3, 1, -2)`.","`vec{QP} × vec{m} = (3, 1, -2) × (2, 2, 1) = (5, -7, 4)`.","`|vec{QP} × vec{m}| = √{25 + 49 + 16} = √90 = 3√10`.","`d = 3√10 ÷ |vec{QP}| = 3√10/√14`."],"_a":"Bw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct.","why":"The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"1o4e2","_k":"86b566b6"},{"t":"Divide by `|vec{m}|^2 = 9`.","why":"That gives `√10/3`; the height is area ÷ base length, `|vec{m}|`.","_n":"1p512","_k":"6d7430da"},{"t":"Divide by `|vec{m}| = 3`: `d = √10`.","why":"The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"1q502","_k":"f5536571"},{"t":"Use the dot product instead: `|vec{QP} · vec{m}|/|vec{m}| = 2`.","why":"That’s the shadow along the line, not the distance across.","_n":"1r4b2","_k":"d1a244bc"}],"hints":["Which side of the parallelogram lies along the line?","The base is `vec{m}`.","`3√10 ÷ 3 = √10`."]},{"id":"e3","goal":4,"task":"Find the foot of the perpendicular from P(0, 7) to `vec{r} = (1, 1) + t(1, 2)`.","steps":["A point on the line: F = `(1 + t, 1 + 2t)`.","`vec{PF} = (1 + t, -6 + 2t)`.","`vec{PF} · vec{m} = (1 + t) + 2(-6 + 2t) = 5t - 11 = 0`, so `t = 11/5`.","So the foot is (11/5, 22/5)."],"_a":"Bw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"`t` should be `-11/5`.","why":"`5t - 11 = 0` gives `t = 11/5`.","_n":"1s4a2","_k":"62d78c6e"},{"t":"F = (1, 1) + (11/5)(1, 2) = (16/5, 27/5).","why":"F = `vec{r}_0 + t vec{m}`, with `t` from `vec{PF} · vec{m} = 0`. Substitute `t` back into the whole line.","_n":"1t4d2","_k":"ea19e297"},{"t":"Step 4 is correct.","why":"(11/5, 22/5) is `t vec{m}`, which leaves out `vec{r}_0`. F = `vec{r}_0 + t vec{m}`, with `t` from `vec{PF} · vec{m} = 0`. Substitute `t` back into the whole line.","_n":"1u4c2","_k":"22fc1a32"},{"t":"F = (11/5, 11/5).","why":"That isn’t on the line.","_n":"1v472","_k":"51069bd1"}],"hints":["Substitute `t` into the line, not just the direction.","(1 + 11/5, 1 + 22/5).","(16/5, 27/5)."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the distance graph: that the minimum is where `vec{PF} · vec{m} = 0`, or something else?"},{"id":"j2","q":"In your own words, why does the R² formula divide by `√{A^2 + B^2}`?"},{"id":"j3","q":"Explain to a friend how to find the distance from a point to a line in R³, and why you can’t use the R² formula."},{"id":"j4","q":"Which step still trips you up: rearranging the line, the cross product, or finding the foot? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Find the distance from (1, −2) to `3x - 4y + 4 = 0`.","options":[{"t":"1/5","why":"Sign slip: `-4(-2) = +8`.","_n":"1w462","_k":"3f422349"},{"t":"3/5","why":"Divide by 5, not 25.","_n":"1x492","_k":"beff5829"},{"t":"3","why":"`|3 + 8 + 4|/5 = 15/5`.","_n":"1y4a2","_k":"7895839f"},{"t":"15","why":"Divide by `√{9 + 16} = 5`. Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"1z472","_k":"1e39a82d"}]},"b":{"prompt":"Find the distance from (2, 3) to `5x + 12y - 7 = 0`.","options":[{"t":"39/169","why":"Divide by 13, not 169.","_n":"20482","_k":"d6b9ea2d"},{"t":"33/13","why":"Sign slip on `12y`.","_n":"214d2","_k":"75c8a4dc"},{"t":"3","why":"`|10 + 36 - 7|/13 = 39/13`.","_n":"224e2","_k":"1e699fe9"},{"t":"39","why":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"234b2","_k":"5c253488"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which expression gives the distance from P to the line `vec{r} = vec{r}_0 + t vec{m}` in R³, where Q is the point `vec{r}_0`?","options":[{"t":"`{|vec{QP} · vec{m}|}/{|vec{m}|}`","why":"That’s the projection along the line. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"244c2","_k":"22c062d6"},{"t":"`{|vec{QP} × vec{m}|}/{|vec{QP}|}`","why":"The base lying on the line is `vec{m}`. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"25412","_k":"fb209661"},{"t":"`|vec{QP}|`","why":"Q isn’t usually the closest point. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"26422","_k":"58e7eff1"},{"t":"`{|vec{QP} × vec{m}|}/{|vec{m}|}`","why":"Parallelogram height = area ÷ base.","_n":"273b0","_k":"c4248184"}]},"b":{"prompt":"Which describes the distance from P to a line in R³?","options":[{"t":"The height of the parallelogram on `vec{QP}` and `vec{m}`: its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","why":"Parallelogram height = area ÷ base.","_n":"283a0","_k":"81adbd24"},{"t":"`{|Ax_0 + By_0 + Cz_0 + D|}/{√{A^2 + B^2 + C^2}}` using the line’s scalar equation.","why":"A line in R³ has no single scalar equation; that formula is for planes. A line in R³ has no single scalar equation. Use the cross product.","_n":"29390","_k":"3536f19e"},{"t":"`|vec{QP}|`, the distance to the point Q on the line.","why":"That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"2a380","_k":"9a41be87"},{"t":"The scalar projection of `vec{QP}` on `vec{m}`.","why":"That measures along the line. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"2b3f0","_k":"ea3d20ce"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"P is 5 units from a line. Which is true for every point Q on the line?","options":[{"t":"`|PQ| ≤ 5`","why":"5 is the least distance, not the greatest.","_n":"2c3e0","_k":"1d2e56e4"},{"t":"`|PQ| = 5` at exactly two points","why":"That’s a circle meeting a line, not the closest point.","_n":"2d3d0","_k":"06d89416"},{"t":"`|PQ| ≥ 5`, with equality only at the foot of the perpendicular","why":"5 is the shortest distance, reached only at the foot.","_n":"2e3c0","_k":"f0640233"},{"t":"`|PQ| = 5`","why":"Only one point of the line is 5 away.","_n":"2f430","_k":"2574187a"}]},"b":{"prompt":"F is the foot of the perpendicular from P to a line with direction `vec{m}`. Which is true?","options":[{"t":"`vec{PF} · vec{m} = 0`, and F is the point of the line closest to P","why":"The foot is where the perpendicular meets the line, the closest point.","_n":"2g420","_k":"35817c75"},{"t":"`vec{PF}` is perpendicular to the line only in R²","why":"It’s perpendicular in R³ too.","_n":"2h34f","_k":"70249d88"},{"t":"F is always the point `vec{r}_0` in the line’s equation","why":"That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"2i35f","_k":"5ae6c0b8"},{"t":"`vec{PF}` is parallel to `vec{m}`","why":"Then PF would run along the line.","_n":"2j36f","_k":"f571e964"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Find the foot of the perpendicular from P(4, 3, 6) to `vec{r} = (0, 1, 1) + t(1, 2, 2)`.","options":[{"t":"(2, 4, 4)","why":"That’s `2vec{m}`, without `vec{r}_0`. F = `vec{r}_0 + t vec{m}`, with `t` from `vec{PF} · vec{m} = 0`. Substitute `t` back into the whole line.","_n":"2k37f","_k":"ddd412fc"},{"t":"(6, 13, 13)","why":"`t = 18 ÷ |vec{m}| = 6` divides by `|vec{m}|`, not `|vec{m}|^2 = 9`. F = `vec{r}_0 + t vec{m}`, with `t` from `vec{PF} · vec{m} = 0`. Substitute `t` back into the whole line.","_n":"2l38f","_k":"5bab9be8"},{"t":"(0, 1, 1)","why":"That’s `vec{r}_0`. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"2m39f","_k":"0a91fb78"},{"t":"(2, 5, 5)","why":"`vec{PF} · vec{m} = 9t - 18 = 0`, so `t = 2`.","_n":"2n3af","_k":"5054c350"}]},"b":{"prompt":"Find the foot of the perpendicular from P(5, −1, 1) to `vec{r} = (1, 0, 2) + t(2, 1, -2)`.","options":[{"t":"(3, 1, 0)","why":"`t = 1`.","_n":"2o3bf","_k":"761faab6"},{"t":"(1, 0, 2)","why":"That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"2p3cf","_k":"4e260edb"},{"t":"(2, 1, −2)","why":"F = `vec{r}_0 + t vec{m}`, with `t` from `vec{PF} · vec{m} = 0`. Substitute `t` back into the whole line.","_n":"2q3df","_k":"869d01ad"},{"t":"(7, 3, −4)","why":"`t = 9 ÷ 3 = 3` divides by `|vec{m}|`. F = `vec{r}_0 + t vec{m}`, with `t` from `vec{PF} · vec{m} = 0`. Substitute `t` back into the whole line.","_n":"2r832","_k":"879a58dc"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Find the distance between `3x - 4y + 2 = 0` and `-6x + 8y + 6 = 0`.","options":[{"t":"1/2","why":"Rescaled difference 5, but divided by `|(-6, 8)| = 10`.","_n":"2s842","_k":"4c042d02"},{"t":"4/5","why":"That uses the constants 2 and 6 without rescaling.","_n":"2t852","_k":"924cab4c"},{"t":"1","why":"Divide the second by −2: `3x - 4y - 3 = 0`, so `|2 - (-3)|/5 = 1`.","_n":"2u862","_k":"6218e831"},{"t":"5","why":"Divide by 5. Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"2v872","_k":"7eba266c"}]},"b":{"prompt":"Find the distance between `6x + 8y - 5 = 0` and `3x + 4y + 5 = 0`.","options":[{"t":"1","why":"That uses +5 without doubling it: `|-5 - 5|/10`.","_n":"2w882","_k":"b6bb9b9a"},{"t":"3/2","why":"Double the second: `6x + 8y + 10 = 0`; `|-5 - 10|/10`.","_n":"2x892","_k":"7f8dc87f"},{"t":"3","why":"`15 ÷ 5` mixes the two lines’ scales.","_n":"2y8a2","_k":"5235ed31"},{"t":"15","why":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"2z7b2","_k":"dda4b850"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Find the distance from P(4, 4, 0) to the line through A(1, 1, 0) and B(3, 2, 2).","options":[{"t":"9","why":"Divide by `|vec{m}| = 3`. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"307c2","_k":"f46d17c0"},{"t":"`3√2`","why":"That’s `|AP|`. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"31092","_k":"8dfc77d6"},{"t":"1","why":"Divide by `|vec{m}| = 3`, not `|vec{m}|^2 = 9`.","_n":"32082","_k":"37b85424"},{"t":"3","why":"`vec{m} = (2, 1, 2)`, `vec{AP} = (3, 3, 0)`; `vec{AP} × vec{m} = (6, -6, -3)`, length 9; `9 ÷ 3`.","_n":"33072","_k":"bc8e1815"}]},"b":{"prompt":"Find the distance from P(3, 1, 4) to the line through A(0, 1, 1) and B(1, 3, 3).","options":[{"t":"9","why":"Divide by `|vec{m}| = 3`. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"34062","_k":"e563dd7c"},{"t":"`3√2`","why":"That’s `|AP|`. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"350d2","_k":"a713e70b"},{"t":"1","why":"Divide by `|vec{m}| = 3`, not `|vec{m}|^2 = 9`.","_n":"360c2","_k":"c5507b07"},{"t":"3","why":"`vec{m} = (1, 2, 2)`, `vec{AP} = (3, 0, 3)`; `vec{AP} × vec{m} = (-6, -3, 6)`, length 9; `9 ÷ 3`.","_n":"370b2","_k":"12d5736c"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `d = {|Ax_0 + By_0 + C|}/{√{A^2 + B^2}}` gives the distance from P(`x_0`, `y_0`) to `Ax + By + C = 0`?","options":[{"t":"It projects `vec{QP}` onto the direction of the line.","why":"That measures along the line. In R², a direction `(a, b)` gives a normal `(b, -a)`. The formula needs the normal.","_n":"380a2","_k":"a755e8ab"},{"t":"For any point Q on the line, the distance is the length of the projection of `vec{QP}` onto the normal `vec{n} = (A, B)`: `|vec{QP} · vec{n}|/|vec{n}|`, which simplifies to the formula.","why":"The perpendicular runs along the normal, so the projection on `vec{n}` measures it.","_n":"39012","_k":"da325779"},{"t":"It’s `|vec{QP}|` for the point Q where `x = 0`.","why":"That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"3a002","_k":"9e3e372b"},{"t":"It works because `A^2 + B^2` is the slope squared.","why":"The slope is `-A/B`; the denominator is `|vec{n}|`.","_n":"3b0f3","_k":"0a5cd56d"}]},"b":{"prompt":"Why does the formula need an absolute value?","options":[{"t":"Because the square root could be negative.","why":"√ is never negative.","_n":"3c103","_k":"f7ef0381"},{"t":"`Ax_0 + By_0 + C` is negative for points on one side of the line, but a distance is never negative.","why":"The sign tells the side; the distance is its absolute value.","_n":"3d0d3","_k":"b34202e6"},{"t":"It isn’t needed; a negative distance means below the line.","why":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"3e0e3","_k":"250855f1"},{"t":"Because `A` or `B` might be negative.","why":"The denominator is already positive; the numerator’s sign shows the side.","_n":"3f0b3","_k":"43813e2d"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which correctly describes how to find the foot F of the perpendicular from P to `vec{r} = vec{r}_0 + t vec{m}`?","options":[{"t":"Write F = `vec{r}_0 + t vec{m}`, solve `vec{PF} · vec{m} = 0` for `t`, then substitute `t` back into the line.","why":"The foot is on the line, and PF is perpendicular to it.","_n":"3g0c3","_k":"3d625512"},{"t":"Solve `vec{PF} · vec{m} = 0` for `t`; the foot is `t vec{m}`.","why":"F = `vec{r}_0 + t vec{m}`, with `t` from `vec{PF} · vec{m} = 0`. Substitute `t` back into the whole line.","_n":"3h093","_k":"5a013368"},{"t":"Solve `vec{PF} × vec{m} = vec{0}` for `t`.","why":"That makes PF parallel to the line.","_n":"3i0a3","_k":"163c9c49"},{"t":"Take F = `vec{r}_0`.","why":"That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"3j073","_k":"0e32b574"}]},"b":{"prompt":"Which statement about the closest point F on a line to P is correct?","options":[{"t":"`|PF| = |vec{QP} × vec{m}|`, with no division needed.","why":"The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"3k083","_k":"bd0387d6"},{"t":"`|PF|` is the distance from P to the line, and `vec{PF} · vec{m} = 0`.","why":"F is the foot of the perpendicular.","_n":"3lf53","_k":"4fb33e69"},{"t":"`vec{PF}` is parallel to `vec{m}`.","why":"Then PF would run along the line.","_n":"3mf43","_k":"38dc87c2"},{"t":"F is where the line crosses the `x`-axis.","why":"That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"3nf73","_k":"59411f86"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"On a map (units: km), a straight pipeline runs along `3x + 4y - 24 = 0`. A farmhouse is at (2, 1). How long is the shortest straight connector pipe?","options":[{"t":"2.8 km","why":"`|6 + 4 - 24|/5 = 14/5`.","_n":"3of63","_k":"bd135b35"},{"t":"0.56 km","why":"Divide by 5, not 25.","_n":"3pf93","_k":"078b68ee"},{"t":"6.8 km","why":"Sign slip: the constant is −24.","_n":"3qf83","_k":"d6d54fd2"},{"t":"14 km","why":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"3rfb3","_k":"e5663e2f"}]},"b":{"prompt":"A pipeline runs along `5x + 12y - 60 = 0` and a farmhouse is at (2, 2). Shortest connector?","options":[{"t":"about 0.15 km","why":"26/169 divides by 169, not 13.","_n":"3sfa3","_k":"1c6a11a5"},{"t":"about 10.2 km","why":"That’s the distance to the pipeline’s `x`-intercept (12, 0). That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"3tfd3","_k":"24b8da97"},{"t":"2 km","why":"`|10 + 24 - 60|/13 = 26/13`.","_n":"3ufc3","_k":"535139fe"},{"t":"26 km","why":"Divide by `|vec{n}| = √{A^2 + B^2}`, and take the absolute value: distance is never negative.","_n":"3v7b3","_k":"0f512ebc"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A drone climbs along `vec{r} = (0, 0, 4) + t(1, 2, 2)` (metres). A sensor sits at S(6, 0, 10). What’s the closest the drone’s path comes to the sensor?","options":[{"t":"2 m","why":"Divide by 3, not 9.","_n":"3w7c3","_k":"cbd552d4"},{"t":"`6√2` m","why":"That’s `|QS|`, from the start point. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"3x7d3","_k":"74e91610"},{"t":"18 m","why":"Divide by `|vec{m}| = 3`. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"3y7e3","_k":"3b6cb298"},{"t":"6 m","why":"`vec{QS} = (6, 0, 6)`; `vec{QS} × vec{m} = (-12, -6, 12)`, length 18; `18 ÷ 3`.","_n":"3z773","_k":"3c444a1a"}]},"b":{"prompt":"A drone flies along `vec{r} = (1, 0, 0) + t(2, 1, 2)`. A sensor sits at S(1, −3, 6). Closest approach?","options":[{"t":"`3√5` m","why":"That’s `|QS|`, from the start point. That’s the distance to one point of the line. The shortest distance is along the perpendicular, and it’s smaller.","_n":"40783","_k":"13360879"},{"t":"6 m","why":"`vec{QS} = (0, -3, 6)`; `vec{QS} × vec{m} = (-12, 12, 6)`, length 18; `18 ÷ 3`.","_n":"41793","_k":"a17fc3ce"},{"t":"18 m","why":"Divide by `|vec{m}| = 3`. The parallelogram’s height is its area `|vec{QP} × vec{m}|` divided by its base `|vec{m}|`.","_n":"427a3","_k":"a3a21afa"},{"t":"2 m","why":"Divide by 3, not 9.","_n":"43833","_k":"e8b59084"}]}}]},"task":{"title":"Five from P","summary":"Five from P","statement":"\u003cp>Design a line ℓ: `Ax + By + C = 0` that meets every condition. How many can you find?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>ℓ is exactly 5 units from P(3, 7).\u003c/li>\u003cli>ℓ is within 3 units of the origin.\u003c/li>\u003cli>ℓ is neither horizontal nor vertical.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">`A` and `B` are whole numbers from −5 to 5, not both 0; `C` is a whole number from −70 to 70. The graph and both distances update as you go. Multiples of a line count as the same line.\u003c/p>","checks":["5 units from P(3, 7)","Within 3 units of the origin","Not horizontal or vertical"],"tips":["`d = {|3A + 7B + C|}/{√{A^2 + B^2}}` must equal 5. Pick a normal whose length is a whole number, like `(3, 4)`, so the distance can come out exact.","The distance from the origin is `{|C|}/{√{A^2 + B^2}}`.","`A = 0` makes ℓ horizontal; `B = 0` makes it vertical."],"explainPrompt":"Explain how you chose `C` once you’d picked the normal `(A, B)`, and why there are two choices of `C` for each normal.","vocab":"Use the words normal, distance, absolute value and side.","more":"There’s more than one answer. Can you find them all?","after3":"Each is tangent to the circle of radius 5 around P. Every other whole-number tangent line is too far from the origin or parallel to an axis.","labels":{"A":"`A`","B":"`B`","C":"`C`","rangeAB":"(−5 to 5)","rangeC":"(−70 to 70)","invalid":"Choose whole numbers: `A` and `B` from −5 to 5 (not both 0) and `C` from −70 to 70.","circle":"Show the circle","line":"ℓ","dP":"Distance from P(3, 7)","dO":"Distance from O(0, 0)","graph":"ℓ in blue, P and the origin; the faint circle has radius 5 around P."}},"cards":[["Shortest distance to a line","Along the perpendicular, to the foot F, where `vec{PF} · vec{m} = 0`."],["Point to line in R²","`d = {|Ax_0 + By_0 + C|}/{√{A^2 + B^2}}`."],["Where the R² formula comes from","The projection of `vec{QP}` onto the normal `(A, B)`."],["Point to line in R³","`d = {|vec{QP} × vec{m}|}/{|vec{m}|}` (parallelogram height = area ÷ base)."],["Why no R² formula in R³","A line in R³ has no single scalar equation."],["Foot of the perpendicular","F = `vec{r}_0 + t vec{m}`; solve `vec{PF} · vec{m} = 0`; substitute `t` back."],["Rea
