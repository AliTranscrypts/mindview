.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 09: hero typography, rule checker (V5 panels, stacked slope bar), slope dial, tangent and normal, V8 entry rows, task */
canvas.plot.dp-top{aspect-ratio:16/10}
canvas.plot.dp-low{aspect-ratio:16/8}
.dp-panels .dp-panel + .dp-panel,.rc-hero canvas + canvas{margin-top:6px}
.rc-hero canvas.plot.dp-top{aspect-ratio:16/9}
.rc-hero canvas.plot.dp-low{aspect-ratio:16/7}
.dp-ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.dp-main,.dp-side{min-width:0}

/* hero */
.rc-hx{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 0 8px;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.15;min-height:2.5em}
.hx-row{white-space:nowrap}
.hx-row .m{font-size:1em}
.hx-co{display:inline-block;opacity:0}
.hx-sup{display:inline-grid;vertical-align:super;font-size:.55em;line-height:1}
.hx-sup > span{grid-area:1/1;display:inline-block;transform-origin:50% 50%}
.hx-new{opacity:0}
.hx-r2{font-size:.82em}
.hx-t{display:inline-grid}
.hx-t > span{grid-area:1/1;white-space:pre}
.hx-a{opacity:0;color:var(--f3)}
.hx-r1 .hx-co,.hx-r1 .hx-new{color:var(--f3)}

/* rule checker */
.rc-cap{min-height:1.6em}
.rc-key{margin:6px 0 0}
.rc-how{margin:8px 0 10px}
.rc-lab{margin:8px 0 4px;font-weight:700}
.rc-chips{margin-bottom:4px}
.rc-chips .chip .m{font-size:1.05em}
#rc-ctl .seg-wrap{margin:2px 0 4px}
#rc-ctl .q-actions{margin-top:4px}
.rc-xsl{margin-top:8px}
.rc-xsl output{color:var(--ink)}
.rc-read{margin-top:6px}
.rc-yes{color:var(--green);font-weight:700}
.rc-no{color:var(--red);font-weight:700}
.rc-bar{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.rc-bar-h{margin:0 0 6px;font-weight:700}
.rc-bar-tr{position:relative;padding:4px 0}
.rc-lane{position:relative;height:16px;margin:4px 0}
.rc-seg{position:absolute;top:0;bottom:0;border-radius:3px;min-width:2px}
.rc-sf{background:var(--f3)}
.rc-sg{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,var(--ink-2) 4px 7px)}
.rc-zero{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--ink-2)}
.rc-tot{position:absolute;top:-2px;bottom:-2px;border-left:3px solid var(--ink);margin-left:-1.5px}
.rc-bar-k{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;font-size:.85rem}
.rc-bar-k span{display:inline-flex;align-items:center;gap:5px}
.rc-sw{display:inline-block;width:14px;height:10px;border-radius:2px}
.rc-sw.rc-st{width:3px;height:14px;background:var(--ink)}
.rc-proof p{margin:10px 0 0}

/* Part 3 */
.p3-st h3{margin-top:0}
.p3-st:first-child{margin-top:0;padding-top:0;border-top:0}
.gs-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px 26px;align-items:start}
.gs-pan,.gs-side{min-width:0}
.gs-dialbox{position:relative;border-radius:12px;padding:2px}
.gs-dialbox:focus-within{outline:3px solid var(--pen);outline-offset:2px}
.gs-dial{display:block;width:min(100%,230px);margin:0 auto;touch-action:none;cursor:pointer}
.gs-trk{fill:none;stroke:var(--rule);stroke-width:7;stroke-linecap:round}
.gs-tk{stroke:var(--ink-2);stroke-width:1.5}
.gs-tk.big{stroke:var(--ink);stroke-width:2.2}
.gs-tl{fill:var(--ink-2);font:600 12px var(--font-ui);text-anchor:middle}
.gs-ndl{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.gs-hub{fill:var(--ink)}
.gs-val{fill:var(--ink);font:italic 700 17px var(--font-math);text-anchor:middle}
.gs-msl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;margin:0}
.gs-eh{margin:12px 0 6px;font-weight:700}
.gs-pts,.pe-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.gs-pt,.pe-pt,.pe-ln,.pe-lab{display:inline-flex;align-items:center;gap:4px;font:400 1.2rem var(--font-math)}
.gs-and,.pe-and{font-size:.9rem;color:var(--ink-2)}
input.numin.gs-in,input.numin.pe-in{width:4.6em;min-width:0;text-align:center}
#gs-alg .alg-lines > div{overflow-wrap:anywhere}
#gs-alg .alg-lines small{display:inline}
canvas.plot.gs-sq{aspect-ratio:4/3.2}

/* Practice 1: coefficient rows */
.df-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;margin:8px 0 4px}
.df-lab{font-size:1.15rem;margin-right:2px}
.df-term{display:inline-flex;align-items:flex-start;gap:2px;padding-top:12px}
.df-x{font-size:1.35rem;line-height:44px}
.df-sup{vertical-align:top;line-height:1;margin-top:-12px}
input.numin.df-in{text-align:center;min-width:0}
input.numin.df-c{width:4.4em}
input.numin.df-e{width:3.6em;font-size:.92rem;padding-top:3px;padding-bottom:3px;min-height:34px}
.df-plus{font:400 1.25rem var(--font-math);color:var(--ink-2)}
.df-ctl,.pe-ctl{margin-top:4px}
.pe-row{margin:8px 0 4px}

/* task */
.tk-step{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.tk-lab{min-width:1.5em;font-size:1.2rem}
.tk-val{min-width:2.2em;text-align:center;font:600 1.35rem var(--font-math)}
.tk-step .btn{min-width:40px;font-size:1.1rem}
.tk-eq{font-size:clamp(1.1rem,3.2vw,1.45rem);margin:12px 0 4px}
.pk-read{margin-top:10px}

@media (max-width:820px){
  .dp-ex,.gs-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .dp-ex canvas.plot.dp-top,.dp-ex canvas.plot.dp-low{aspect-ratio:auto;height:220px}
  .gs-dial{display:none}
  .gs-dialbox:focus-within{outline:0}
  .gs-msl{position:static;width:auto;height:auto;overflow:visible;clip:auto;clip-path:none;white-space:normal;margin:0 0 6px}
}

g> (constants have slope 0), the \u003cstrong>constant multiple rule\u003c/strong> and the \u003cstrong>sum rule\u003c/strong>, and you can differentiate any polynomial in one line. Rewrite roots and reciprocals as powers, and the rule still works.","fig":{"html":"\u003cdiv class=\"rc-hero\">\u003cdiv class=\"rc-hx\" id=\"rc-hx\" aria-hidden=\"true\">\u003c/div>\u003ccanvas class=\"plot dp-top\" id=\"hero-plot\" role=\"img\" aria-label=\"Top panel: y = x cubed with a tangent line.\">\u003c/canvas>\u003ccanvas class=\"plot dp-low\" id=\"hero-d\" role=\"img\" aria-label=\"Bottom panel: the slopes of the tangent, plotted against x.\">\u003c/canvas>\u003c/div>"}},"goals":["I can apply the power rule \u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(x^n) = nx^{n-1}` and check it against tangent slopes.","I can use the constant, constant multiple, sum and difference rules, and explain why each works.","I can rewrite radicals and reciprocals as powers and differentiate them.","I can find the slope and the equation of the tangent (and normal) at a point.","I can find the points where the tangent has a given slope, including horizontal tangents.","I can interpret a derivative as a rate of change in context."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Exponent laws","goal":1,"prompt":"Simplify `x^5 ÷ x^2`.","options":[{"t":"`x^{10}`","why":"That multiplies the exponents. That’s a power of a power.","_n":"0709","_k":"a0a536bb"},{"t":"`x^{5/2}`","why":"That divides the exponents. Dividing powers subtracts exponents.","_n":"16f9","_k":"34309123"},{"t":"`x^7`","why":"That adds the exponents. That’s multiplication.","_n":"26e9","_k":"d765fa6f"},{"t":"`x^3`","why":"Subtract exponents.","_n":"36d9","_k":"369513a0"}],"hints":["`x^a ÷ x^b = x^{a - b}`.","5 − 2.","`x^3`."]},{"id":"w2","skill":"Exponent laws","goal":3,"prompt":"Write `{1}/{x^4}` as a power of `x`.","options":[{"t":"`x^{1/4}`","why":"That confuses a reciprocal with a root: `x^{1/4}` is the fourth root of `x`.","_n":"46c9","_k":"b105d67f"},{"t":"`-x^4`","why":"That puts the negative on the coefficient. `-x^4` is negative for every `x ≠ 0`; `{1}/{x^4}` is positive.","_n":"56b9","_k":"6b14696b"},{"t":"`x^{-4}`","why":"A reciprocal flips the sign of the exponent.","_n":"66a9","_k":"9d0010cc"},{"t":"`x^4`","why":"That ignores the reciprocal. A reciprocal flips the sign of the exponent.","_n":"7699","_k":"0925f276"}],"hints":["`{1}/{x^n} = x^{-n}`.","`n = 4`.","`x^{-4}`."]},{"id":"w3","skill":"Powers from radicals","goal":3,"prompt":"Write `√{x^3}` as a power of `x`.","options":[{"t":"`x^{3/2}`","why":"The square root is the power 1/2: `(x^3)^{1/2}`.","_n":"8689","_k":"765af50b"},{"t":"`x^{5/2}`","why":"That adds 3 and 1/2. A power of a power multiplies.","_n":"93a4","_k":"56e44428"},{"t":"`x^{2/3}`","why":"That flips the fraction. The root’s index goes in the denominator.","_n":"a3b4","_k":"1859c6b3"},{"t":"`3x^{1/2}`","why":"That brings the 3 down. That’s not a derivative step.","_n":"b384","_k":"50706fc6"}],"hints":["`√u = u^{1/2}`.","`(x^3)^{1/2}`.","`x^{3/2}`."]},{"id":"w4","skill":"Powers from radicals","goal":3,"prompt":"Write `{6}/{√x}` in the form `ax^n`.","options":[{"t":"`6x^{1/2}`","why":"That ignores the reciprocal. Dividing by `x^{1/2}` makes the exponent negative.","_n":"c394","_k":"1d5f1276"},{"t":"`6x^{-1/2}`","why":"`{1}/{√x} = x^{-1/2}`.","_n":"d3e4","_k":"92117706"},{"t":"`x^{-1/12}`","why":"That moves the 6 into the exponent. The 6 stays in front as the coefficient.","_n":"e3f4","_k":"0b746ef3"},{"t":"`6x^{-2}`","why":"√ doesn’t mean squared. The square root is the power 1/2.","_n":"f3c4","_k":"82861d79"}],"hints":["`√x = x^{1/2}`.","Dividing by it gives `x^{-1/2}`.","`6x^{-1/2}`."]},{"id":"w5","skill":"Slopes and lines","goal":1,"prompt":"From module 08, what is the derivative of `x^2`?","options":[{"t":"2","why":"That’s the second derivative, from module 14.","_n":"g3d4","_k":"ddec8d7f"},{"t":"`2x`","why":"First principles give `{2xh + h^2}/{h} = 2x + h`, which approaches `2x` as `h → 0`.","_n":"h324","_k":"fefa5add"},{"t":"`x`","why":"That lowers the exponent only. Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"i334","_k":"f7b13ea2"},{"t":"`2x^2`","why":"That multiplies only. Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"jb44","_k":"e6c113a5"}],"hints":["First principles: `{2xh + h^2}/{h}`.","`2x + h → ?`","`2x`."]},{"id":"w6","skill":"Slopes and lines","goal":4,"prompt":"Find the equation of the line through (2, 5) with slope 3.","options":[{"t":"`y = 3x - 1`","why":"`y - 5 = 3(x - 2)`.","_n":"kb34","_k":"c7fc544c"},{"t":"`y = 5x - 7`","why":"That swaps the slope and the `y`-value: the slope is 3 and the point is (2, 5).","_n":"lb24","_k":"3b31ade5"},{"t":"`y = 3x + 11`","why":"Sign slip: that’s `y - 5 = 3(x + 2)`. Use `x - 2`.","_n":"mb14","_k":"48c7b2eb"},{"t":"`y = 3x + 5`","why":"That uses the `y`-coordinate as the intercept. 5 is the height at `x = 2`, not at `x = 0`.","_n":"nb04","_k":"31c22545"}],"hints":["Point–slope form: `y - y_1 = m(x - x_1)`.","`y - 5 = 3(x - 2)`.","`y = 3x - 1`."]}],"refreshers":{"Exponent laws":"`x^a · x^b = x^{a + b}`; `x^a ÷ x^b = x^{a - b}`; `{1}/{x^n} = x^{-n}`.","Powers from radicals":"`√x = x^{1/2}`; `∛x = x^{1/3}`; `√{x^3} = x^{3/2}`; `{1}/{√x} = x^{-1/2}`.","Slopes and lines":"The line through `(x_1, y_1)` with slope `m` is `y - y_1 = m(x - x_1)`. Perpendicular slopes multiply to −1."}}},"explore":{"heading":"Rule checker","intro":"Three experiments. Stretch a graph and watch its slopes. Add two graphs and watch their slopes add. Then test the power rule on any power, even fractions.","modes":[{"id":"mul","t":"Multiply"},{"id":"add","t":"Add"},{"id":"pow","t":"Any power"}],"subs":[{"id":"pair","t":"Pair"},{"id":"build","t":"Build"}],"modeHow":{"mul":"`g(x) = @a{k} · f(x)`. Choose `f`, then stretch it with `@a{k}`: the violet `@a{k}` does the job of a vertical stretch. Compare the two tangent slopes.","add":"Choose `f` and `g`. The top panel shows `f + g` in black; at the probe, the bar shows `f′(x)` and `g′(x)` adding to `(f + g)′(x)`.","build":"Build a sum: tap chips to add them (each one once), tap again to remove. The readout differentiates the sum term by term.","pow":"`y = @a{k}x^{@n{n}}`. Set the exponent `@n{n}` (blue) and the stretch `@a{k}` (violet). For a fractional `@n{n}`, the graph is drawn for `x > 0` only."},"bases":[{"id":"x2","t":"`x^2`"},{"id":"x3","t":"`x^3`"},{"id":"sqrt","t":"`√x`"}],"addChips":[{"id":"x","t":"`x`"},{"id":"x2","t":"`x^2`"},{"id":"x3","t":"`x^3`"},{"id":"m2x2","t":"`-2x^2`"},{"id":"c4","t":"4"},{"id":"sqrt","t":"`√x`"}],"buildChips":[{"id":"x3","t":"`x^3`"},{"id":"x2","t":"`x^2`"},{"id":"mx2","t":"`-x^2`"},{"id":"m2x","t":"`-2x`"},{"id":"m3x","t":"`-3x`"},{"id":"c5","t":"5"},{"id":"sqrt","t":"`√x`"}],"predIntro":"Make a prediction first. Then the rule checker sets itself up and shows you what really happens.","predictions":[{"id":"p1","prompt":"Multiply mode, `f(x) = x^2`, `@a{k} = 3`, probe at `x = 2`. The slope of `x^2` at `x = 2` is 4. What is the slope of `g(x) = 3x^2` there?","options":[{"t":"4","_n":"oaf4","_k":"bb8ea3af"},{"t":"7","_n":"pae4","_k":"d3c4f45b"},{"t":"12","_n":"qad4","_k":"f754851c"},{"t":"36","_n":"rbc4","_k":"14a3c802"}],"explain":"The tangents on both curves have slopes 4 and 12, and the readout says `g′(x) ÷ f′(x) = 3`. A vertical stretch by 3 makes every rise 3 times bigger, so every slope triples."},{"id":"p2","prompt":"Add mode, `f(x) = x^2`, `g(x) = 4`. `f + g = x^2 + 4`. How does its derivative compare with that of `x^2`?","options":[{"t":"They’re the same","_n":"sbb4","_k":"55fdb7b1"},{"t":"It’s 4 times as large","_n":"tae4","_k":"5d096a07"},{"t":"It’s 1 more","_n":"uaf4","_k":"ccd2fe79"},{"t":"It’s 4 more","_n":"vb04","_k":"e1be0cad"}],"explain":"The bar has no `g′` segment, and the two tangents stay parallel. Adding 4 lifts the graph without tilting it; the derivative of a constant is 0."},{"id":"p3","prompt":"Any power, `@n{n} = -1`, `x = 2`. What does the power rule predict for the slope of `y = x^{-1}` at `x = 2`?","options":[{"t":"−1","_n":"wb14","_k":"1e6c83a9"},{"t":"−1/2","_n":"xaa4","_k":"7d2cab37"},{"t":"−1/4","_n":"yab4","_k":"c42695ce"},{"t":"1/4","_n":"zac4","_k":"0849e98b"}],"explain":"The measured slope is −0.2500. `(-1)x^{-2} = -{1}/{x^2}`, so −1/4. The exponent goes from −1 to −2, not to 0."},{"id":"p4","prompt":"Any power, `@n{n} = 1/2`, `x = 4`. Predict the slope of `y = √x` at `x = 4`.","options":[{"t":"1/16","_n":"10ad4","_k":"60a7844f"},{"t":"1/4","_n":"11b64","_k":"6e32013a"},{"t":"1/2","_n":"12b74","_k":"d906df33"},{"t":"2","_n":"13a84","_k":"1f982208"}],"explain":"The measured slope is 0.2500. `{1}/{2}x^{-1/2} = {1}/{2√x} = {1}/{4}`. 2 is the height `√4`; 1/16 comes from lowering the exponent to −3/2."}],"chalIntro":"Use the rule checker to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Any power, `@a{k} = 1`: choose `@n{n}` so that the tangent to `y = x^n` at `x = 4` has slope 48.","why":"`n = 3`: the slope is `3 · 4^2 = 48`.","hints":["The slope is `n · 4^{n-1}`.","Try whole numbers: 2 · 4 = 8, 3 · 16 = …","3 · 16 = 48."],"msgs":{"mode":"Switch to \u003cstrong>Any power\u003c/strong> mode first.","k":"Set `@a{k} = 1` first: the challenge is about `y = x^n`.","n2":"Slope 2(4) = 8.","n4":"Slope 4(64) = 256.","n35":"Slope 3.5(32) = 112.","other":"At `x = 4` the slope is {s}. You need 48."}},{"id":"tc2","goal":2,"prompt":"Add, Build sub-mode: choose chips so that the sum has slope 0 at `x = 1` and slope 9 at `x = 2`.","why":"`x^3 - 3x` has slope `3x^2 - 3`: 0 at `x = 1` and 9 at `x = 2`. Adding 5 doesn’t change any slope.","hints":["Find each chip’s derivative: `x^3 → 3x^2`, `-3x → -3`, and so on.","You need `f′(1) = 0` and `f′(2) = 9`. Which chip gives 12 at `x = 2`?","`3x^2 - 3`: 0 at 1 and 9 at 2."],"msgs":{"mode":"Switch to \u003cstrong>Add\u003c/strong> mode, then \u003cstrong>Build\u003c/strong>.","empty":"Tap chips to build a sum.","x2m2x":"Slope 0 at `x = 1` ✓, but only 2 at `x = 2`.","x3m2x":"Slope 1 at `x = 1`.","sqrt":"`√x` gives slope `{1}/{2√2}` at 2, which isn’t a whole number.","other":"Slope {a} at `x = 1` and {b} at `x = 2`. You need 0 and 9."}},{"id":"tc3","goal":[1,2],"stretch":true,"prompt":"Any power: set `@a{k}` and `@n{n}` so that `y = @a{k}x^{@n{n}}` passes through (4, 16) \u003cstrong>and\u003c/strong> has slope 6 there.","why":"`k = 2`, `n = 3/2`: `2 · 4^{3/2} = 16`, and the slope is `2({3}/{2})(4)^{1/2} = 6`.","hints":["Two conditions: `k · 4^n = 16` and `kn · 4^{n-1} = 6`.","Divide the second by the first: `{n}/{4} = {6}/{16}`, so `n = 3/2`.","`k · 4^{3/2} = 8k = 16`, so `k = 2`. Check: `2({3}/{2})(4)^{1/2} = 6`."],"msgs":{"mode":"Switch to \u003cstrong>Any power\u003c/strong> mode first.","k1n2":"Through (4, 16), but the slope is 8.","k4n1":"Through (4, 16), but the slope is 4.","k2":"`y(4) = 2 · 4^n` must equal 16.","through":"Through (4, 16), but the slope is {s}.","miss":"`y(4)` = {y}, not 16: the curve must pass through (4, 16)."}}],"blocks":[{"title":"Why the rules work","html":"\u003cp>Each rule has a picture: a horizontal line has slope 0; a vertical stretch by `@a{k}` multiplies every rise, so every slope; adding two graphs adds their rises, so their slopes. The proofs from first principles say the same thing with limits.\u003c/p>\u003cdetails class=\"alg rc-proof\">\u003csummary>See the proof\u003c/summary>\u003cp>Each rule follows from first principles, `f′(x) = ` \u003cspan class=\"rc-lim\" data-sub=\"h -> 0\">lim (h → 0)\u003c/span> `{f(x + h) - f(x)}/{h}`.\u003c/p>\u003cp>\u003cstrong>Constant rule.\u003c/strong> If `f(x) = c`, then `f(x + h) - f(x) = c - c = 0`, so every difference quotient is `{0}/{h} = 0` and the limit is 0.\u003c/p>\u003cp>\u003cstrong>Constant multiple rule.\u003c/strong> `{kf(x + h) - kf(x)}/{h} = k · {f(x + h) - f(x)}/{h}`. The factor `k` doesn’t depend on `h`, so the limit is `k · f′(x)`.\u003c/p>\u003cp>\u003cstrong>Sum and difference rules.\u003c/strong> `{[f(x + h) ± g(x + h)] - [f(x) ± g(x)]}/{h} = {f(x + h) - f(x)}/{h} ± {g(x + h) - g(x)}/{h}`. Each quotient has its own limit, so the limit is `f′(x) ± g′(x)`.\u003c/p>\u003cp>\u003cstrong>Power rule for natural `n`.\u003c/strong> Expanding gives `(x + h)^n = x^n + nx^{n-1}h +` (terms with `h^2` or higher powers of `h`). Subtract `x^n` and divide by `h`: `nx^{n-1} +` (terms with `h`). As \u003cspan class=\"rc-lim\" data-sub=\"h -> 0\">lim (h → 0)\u003c/span>, that’s `nx^{n-1}`. Module 08 did this for `n` = 1, 2, 3, 4; the tangent slopes in the rule checker confirm it for negative and fractional `n`.\u003c/p>\u003c/details>"}]},"part3":{"slug":"given-slope","name":"Given a slope","heading":"Given a slope, find the point","intro":"Explore asked “what is the slope here?”. Now turn the question around: set a slope, and find the points where the tangent has it. Then add normal lines. Then try the quick check.","stations":[{"id":"st1","title":"Station 1: Slope dial","text":"`f(x) = x^3 - 6x^2 + 9x + 1`, so `f′(x) = 3x^2 - 12x + 9 = 3(x - 1)(x - 3)`. Turn the dial to set a slope `m` from −6 to 12. Every point whose tangent has slope `m` lights up, with its tangent drawn. Enter the points, then check them with algebra.","msgs":{"0":"(1, 5) and (3, 1): the two horizontal tangents.","9":"(0, 1) and (4, 5): a pair of parallel tangents.","-3":"One point, (2, 3): the least slope.","none":"The slope is never below −3: the vertex of `f′` is at (2, −3).","good":"Every point with slope `m` is there.","missing":"A quadratic `f′` can give two `x`-values. Check both.","swap":"The point is `(a, f(a))`; the slope is `f′(a)`.","other":"Solve `3x^2 - 12x + 9 = m`, then find `f(x)` for each solution.","extra":"Only {n} point{s} {have} this slope.","partial":"Fill in both coordinates of each point, or leave a point empty.","empty":"Enter a point, or press \u003cstrong>No point has this slope\u003c/strong>."}},{"id":"st2","title":"Station 2: Tangent and normal","text":"Tap a point on `y = x^2 - 4x` (or drag it, or use the slider). The tangent is solid; the \u003cstrong>normal\u003c/strong>, the line perpendicular to the tangent at the point, is dashed, with a right-angle mark."}],"quickCheck":{"title":"Quick check","summary":"Given a slope quick check","items":[{"id":"q1","goal":5,"prompt":"On the dial curve, how many points have slope 0?","choices":[{"t":"0","fb":"`3(x - 1)(x - 3) = 0` at `x = 1` and 3.","_n":"14a74","_k":"4b95d248"},{"t":"1","fb":"`3(x - 1)(x - 3) = 0` at `x = 1` and 3.","_n":"15aa4","_k":"75d061d3"},{"t":"2","fb":"Right. `3(x - 1)(x - 3) = 0` at `x = 1` and 3.","_n":"16a94","_k":"0ea001fb"},{"t":"3","fb":"`3(x - 1)(x - 3) = 0` at `x = 1` and 3.","_n":"17ac4","_k":"5d42e297"}]},{"id":"q2","goal":5,"prompt":"How many points have slope −5?","choices":[{"t":"None","fb":"Right. The least slope is −3.","_n":"18ab4","_k":"58b8a46e"},{"t":"3","fb":"The least slope is −3.","_n":"19ae4","_k":"5d0f0103"},{"t":"1","fb":"The least slope is −3.","_n":"1aad4","_k":"91cf0b62"},{"t":"2","fb":"The least slope is −3.","_n":"1bb04","_k":"c8490e74"}]},{"id":"q3","goal":4,"prompt":"The tangent at a point has slope 3. The normal’s slope is…","choices":[{"t":"−3","fb":"Negative reciprocal: 3 × (−1/3) = −1.","_n":"1caf4","_k":"cca598ee"},{"t":"−1/3","fb":"Right. Negative reciprocal: 3 × (−1/3) = −1.","_n":"1d423","_k":"473b34f8"},{"t":"1/3","fb":"Negative reciprocal: 3 × (−1/3) = −1.","_n":"1e433","_k":"0a19d603"},{"t":"3","fb":"Negative reciprocal: 3 × (−1/3) = −1.","_n":"1f403","_k":"113a0823"}]},{"id":"q4","goal":5,"prompt":"Where is the tangent to `y = x^2 + 1` parallel to `y = 6x`?","choices":[{"t":"`x = 3`","fb":"Right. Parallel means slope 6: `2x = 6`.","_n":"1g413","_k":"f4ed8a80"},{"t":"`x = 36`","fb":"Parallel means slope 6: `2x = 6`. `√5` solves `y = 6`, not `y′ = 6`.","_n":"1h3e3","_k":"2b0263d1"},{"t":"`x = √5`","fb":"Parallel means slope 6: `2x = 6`. `√5` solves `y = 6`, not `y′ = 6`.","_n":"1i3f3","_k":"c1484fa7"},{"t":"`x = 6`","fb":"Parallel means slope 6: `2x = 6`. `√5` solves `y = 6`, not `y′ = 6`.","_n":"1j3c3","_k":"95928691"}]}]}},"practice":{"activities":[{"id":"diff","type":"custom","title":"Differentiate it","summary":"Differentiate it","goal":[1,2,3],"instruction":"Find `f′(x)` for each function. Rewrite roots, reciprocals, products and quotients as powers of `x` first.","how":"Type the coefficient and the exponent of each term of `f′(x)` (whole numbers or fractions such as −1/2), and its constant in the last box. Leave a box empty if you don’t need it; an empty exponent means 1.","general":{"m2":"A constant’s graph is horizontal: slope 0.","m1":"Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","other":"Rewrite each term as a power of `x`, then use the power rule on each term: bring the exponent down and lower it by 1."},"items":[{"id":"d1","fx":"`4x^5 - 3x^2 + 7`","display":"`20x^4 - 6x`","_a":"Ym9BVFMXHRMNFj5KOBccBxsYQVdBaGw=","goal":[1,2],"wrong":[{"has":["7","0"],"fb":"The +7 is still there. A constant’s graph is horizontal: slope 0."},{"has":["4","4"],"fb":"Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1."}],"why":"Term by term: `4(5)x^4 - 3(2)x + 0`.","hints":["Differentiate term by term.","`4(5)x^{5-1} - 3(2)x^{2-1} + 0`.","`20x^4 - 6x`."]},{"id":"d2","fx":"`{x^4}/{2} - 5x`","display":"`2x^3 - 5`","_a":"Ym9BVEEZEwIbaU89QRgEExUWU0Q+aA==","goal":[1,2],"wrong":[{"has":["1/2","3"],"fb":"4 × 1/2 = 2. Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1."}],"why":"`{x^4}/{2} = {1}/{2}x^4`, so the first term gives `{1}/{2}(4)x^3 = 2x^3`.","hints":["Write `{x^4}/{2}` as `{1}/{2}x^4`.","`{1}/{2}(4)x^3 - 5`.","`2x^3 - 5`."]},{"id":"d3","fx":"`6√x`","display":"`3x^{-1/2}` (= `{3}/{√x}`)","_a":"Ym9BVUEZExwIG1FEPmg=","goal":3,"wrong":[{"has":["3","1/2"],"fb":"Subtract 1 from the exponent: −2 − 1 = −3, and 1/2 − 1 = −1/2."}],"why":"`6x^{1/2} → 6({1}/{2})x^{-1/2} = 3x^{-1/2}`.","hints":["Rewrite as `6x^{1/2}`.","`6({1}/{2})x^{1/2 - 1}`.","`3x^{-1/2} = {3}/{√x}`."]},{"id":"d4","fx":"`{2}/{x^3}`","display":"`-6x^{-4}` (= `-{6}/{x^4}`)","_a":"Ym9BS1UXHRMUAEE7Pg==","goal":3,"wrong":[{"has":["2/3","−2"],"fb":"Rewrite as a power first: `{1}/{x^3} = x^{-3}`."},{"has":["−6","−2"],"fb":"Subtract 1 from the exponent: −2 − 1 = −3, and 1/2 − 1 = −1/2."}],"why":"`2x^{-3} → 2(-3)x^{-4} = -6x^{-4}`.","hints":["Rewrite as `2x^{-3}`.","Bring down −3: `2(-3)x^{-3 - 1}`.","`-6x^{-4} = -{6}/{x^4}`."]},{"id":"d5","fx":"`(x + 3)(x - 1)`","display":"`2x + 2`","_a":"Ym9BVEEZEwAbaU89QQcTHRsEQTs+","goal":2,"wrong":[{"exact":[["1","0"]],"fb":"Expand first: `x^2 + 2x - 3`. (The product rule comes in module 10.)"}],"why":"Expand first: `x^2 + 2x - 3`, then differentiate term by term.","hints":["Expand first.","`x^2 + 2x - 3`.","`2x + 2`."]},{"id":"d6","fx":"`{x^2 + 4x}/{x}`, `x ≠ 0`","display":"1","_a":"Ym9BV0EZEwEbaT4=","goal":3,"general":"Divide each term by `x`: `x + 4`.","why":"Divide each term by `x`: `x + 4`, whose derivative is 1.","hints":["Divide each term by `x`.","`x + 4`.","1."]},{"id":"d7","fx":"`∛{x^2}`","display":"`{2}/{3}x^{-1/3}`","_a":"Ym9BVEwGEx0bGVJJUBdsbA==","goal":3,"wrong":[{"has":["3/2","1/2"],"fb":"`∛{x^2} = x^{2/3}`."}],"why":"`x^{2/3} → {2}/{3}x^{2/3 - 1} = {2}/{3}x^{-1/3}`.","hints":["`∛{x^2} = x^{2/3}`.","`{2}/{3}x^{2/3 - 1}`.","2/3 − 1 = −1/3."]},{"id":"d8","fx":"`(2x - 1)^2`","display":"`8x - 4`","_a":"Ym9BXkEZEwAbaU89QRgFExUWU0Q+aA==","goal":2,"wrong":[{"exact":[["4","1"],["−2","0"]],"fb":"Expand: `4x^2 - 4x + 1`."}],"why":"Expand: `4x^2 - 4x + 1`, then differentiate: `8x - 4`.","hints":["Expand first.","`4x^2 - 4x + 1`.","`8x - 4`."]}]},{"id":"points","type":"custom","title":"Find the points","summary":"Find the points","star":true,"goal":[4,5],"instruction":"Use `f′` to find points, coefficients and tangent lines. Items 4 to 7 (★) are non-routine; 6 and 7 go beyond the Final Check.","how":"Type whole numbers or fractions such as 1/8. Points can go in either order; leave the second point empty if there’s only one.","msgs":{"partial":"Fill in both coordinates of each point, or leave the second point empty.","partialLine":"Fill in both boxes of each line.","number":"Type a number in each box, such as 4, −2 or 1/8.","empty":"Type your answer first.","both":"Fill in both boxes first.","missing":"A quadratic `f′` can give two `x`-values. Check both.","missingLine":"Two tangents pass through that point: find both.","xok":"The `x`-values are right. Now find the heights: The point is `(a, f(a))`; the slope is `f′(a)`."},"items":[{"id":"s1","form":"pts","goal":[4,5],"prompt":"`f(x) = x^2 - 5x + 2`: find the point where the slope is 3.","_a":"Ym9XSk4HbGw=","display":"(4, −2)","wrong":[{"pts":[[4,3]],"fb":"3 is the slope; find `f(4)`. The point is `(a, f(a))`; the slope is `f′(a)`."}],"general":"Solve `f′(x) = 3`, then find `f(x)` there.","why":"`2x - 5 = 3` gives `x = 4`, and `f(4) = -2`.","hints":["Solve `f′(x) = 3`.","`2x - 5 = 3`, so `x = 4`.","`f(4) = 16 - 20 + 2 = -2`: the point is (4, −2)."]},{"id":"s2","form":"pts","goal":5,"prompt":"`f(x) = x^3 - 12x`: find the points with horizontal tangents.","_a":"Ym9RSk4EB2wVb05UTwQHbGQ=","display":"(2, −16) and (−2, 16)","wrong":[{"pts":[[2,-16]],"fb":"A quadratic `f′` can give two `x`-values. Check both."}],"general":"Horizontal tangents have slope 0: solve `f′(x) = 0`.","why":"`3x^2 - 12 = 0` gives `x = ±2`: (2, −16) and (−2, 16).","hints":["Horizontal means `f′(x) = 0`.","`3x^2 - 12 = 0`, so `x = ±2`.","`f(2) = -16` and `f(-2) = 16`: (2, −16) and (−2, 16)."]},{"id":"s3","form":"pts","goal":5,"prompt":"`f(x) = x^3 + 3x^2 - 7x + 1`: find the points where the tangent is parallel to `y = 2x + 5`.","_a":"Ym9SSk4HbB1iGVBKUQdsbA==","display":"(1, −2) and (−3, 22)","general":"Solve `3x^2 + 6x - 7 = 2`: `(x - 1)(x + 3) = 0`.","why":"Parallel means slope 2: `(x - 1)(x + 3) = 0`, so (1, −2) and (−3, 22).","hints":["Parallel means slope 2.","`3x^2 + 6x - 7 = 2`, so `x^2 + 2x - 3 = 0`.","`x = 1` or `x = -3`: (1, −2) and (−3, 22)."]},{"id":"s4","form":"pts","star":true,"goal":[4,5],"prompt":"`f(x) = √x`: find the point where the tangent is perpendicular to `y = -4x + 1`.","_a":"Ym9XSlFobA==","display":"(4, 2)","wrong":[{"pts":[[0.015625,0.125]],"fb":"Perpendicular to slope −4 means slope 1/4, not −4. Perpendicular slopes multiply to −1: the normal’s slope is `-1/m`."}],"general":"Perpendicular to slope −4 means slope 1/4. Solve `f′(x) = {1}/{4}`.","why":"`{1}/{2√x} = {1}/{4}` gives `√x = 2`: the point (4, 2).","hints":["Perpendicular slopes multiply to −1.","You need `f′(x) = {1}/{4}`: `{1}/{2√x} = {1}/{4}`.","`√x = 2`, so `x = 4` and the point is (4, 2)."]},{"id":"s5","form":"ab","star":true,"goal":4,"prompt":"`f(x) = ax^2 + bx` has the tangent slope 8 at the point (1, 5). Find `a` and `b`.","_a":"QhYCRFkGHRNbFllUHg==","display":"`a = 3`, `b = 2`","general":"Two equations: `a + b = 5` and `2a + b = 8`.","why":"The point gives `a + b = 5`; the slope gives `2a + b = 8`. Subtract: `a = 3`, so `b = 2`.","hints":["The point gives `f(1) = 5`; the slope gives `f′(1) = 8`.","`a + b = 5` and `2a + b = 8`.","Subtract: `a = 3`, then `b = 2`."]},{"id":"s6","form":"c","star":true,"goal":4,"prompt":"The line `y = 4x + c` is tangent to `y = x^2 - 2x + 5`. Find `c`.","_a":"QhYARFkYBUw=","display":"`c = -4`","general":"Slope 4 at `x = 3`; the point is (3, 8); `8 = 12 + c`.","why":"`2x - 2 = 4` at `x = 3`; the point is (3, 8), and `8 = 4(3) + c` gives `c = -4`.","hints":["A tangent with slope 4: where is `f′(x) = 4`?","`2x - 2 = 4`, so `x = 3`, and `f(3) = 8`.","`8 = 4(3) + c`."]},{"id":"s7","form":"lines","star":true,"goal":4,"prompt":"Find both tangents to `y = x^2` that pass through (1, −3) (not on the curve).","_a":"Ym9VSk4MbB1iGVFKTgRsbA==","display":"`y = 6x - 9` and `y = -2x - 1`","general":"A tangent at `(t, t^2)` is `y = 2tx - t^2`. Make it pass through (1, −3): `t^2 - 2t - 3 = 0`.","why":"`t^2 - 2t - 3 = 0` gives `t = 3` or `t = -1`: `y = 6x - 9` and `y = -2x - 1`.","hints":["Name the point of tangency `(t, t^2)`; its slope is `2t`.","Tangent: `y - t^2 = 2t(x - t)`, so `y = 2tx - t^2`.","Substitute (1, −3): `-3 = 2t - t^2`, so `t = 3` or −1."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Ines","how":"","goal":[3,4,5],"instruction":"Ines made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Differentiate `f(x) = {3}/{x^2} - 4√x`.","steps":["Rewrite: `f(x) = 3x^{-2} - 4x^{1/2}`.","`f′(x) = -6x^{-1} - 2x^{-1/2}`.","`f′(x) = -{6}/{x} - {2}/{√x}`."],"_a":"CA==","stepFb":["Step 1 is correct.","","Step 3 rewrites step 2 correctly."],"fixes":[{"t":"−2 − 1 = −3: `f′(x) = -6x^{-3} - 2x^{-1/2} = -{6}/{x^3} - {2}/{√x}`.","why":"Bring down −2 and subtract 1: the exponent becomes −3. The second term was already right.","_n":"1k3d3","_k":"332bb200"},{"t":"`f′(x) = 6x^{-3} - 2x^{-1/2}`.","why":"The −2 comes down with its sign.","_n":"1l3a3","_k":"49a82071"},{"t":"`f′(x) = {3}/{2x} - {4}/{2√x}`.","why":"Rewrite as a power first: `{3}/{x^2} = 3x^{-2}`.","_n":"1m3b3","_k":"0c2d1d47"},{"t":"Step 2 is correct.","why":"Subtract 1 from the exponent: −2 − 1 = −3, and 1/2 − 1 = −1/2.","_n":"1n3c3","_k":"69a8698d"}],"hints":["Check the new exponent on the first term.","−2 − 1 = ?","−3."]},{"id":"e2","goal":4,"task":"Find the tangent to `f(x) = x^3 - 2x` at `x = 2`.","steps":["`f′(x) = 3x^2 - 2`.","`f′(2) = 10`.","`f(2) = 8 - 4 = 4`.","Tangent: `y - 10 = 4(x - 2)`.","`y = 4x + 2`."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4."],"fixes":[{"t":"The point is (2, 4) and the slope is 10: `y - 4 = 10(x - 2)`, so `y = 10x - 16`.","why":"The point is `(2, f(2)) = (2, 4)`; the slope is `f′(2) = 10`.","_n":"1o3b3","_k":"d1999a0a"},{"t":"Step 4 is correct.","why":"The point is `(a, f(a))`; the slope is `f′(a)`.","_n":"1p3a3","_k":"28569ddd"},{"t":"`y = 10x + 4`.","why":"4 is the `y`-value at `x = 2`, not the intercept.","_n":"1q393","_k":"40ccba5c"},{"t":"`y - 4 = 10(x + 2)`.","why":"Sign: `x - 2`.","_n":"1r403","_k":"7b0b61cf"}],"hints":["Which number is the slope and which is the `y`-coordinate?","Slope `f′(2) = 10`; point (2, 4).","`y - 4 = 10(x - 2)`."]},{"id":"e3","goal":5,"task":"Find the points on `f(x) = x^3 - 3x^2` where the tangent is parallel to `y = 9x`.","steps":["`f′(x) = 3x^2 - 6x`.","Set `3x^2 - 6x = 9`.","`3x^2 - 6x - 9 = 0`, so `x^2 - 2x - 3 = 0`.","`(x - 3)(x + 1) = 0`, so `x = 3`.","The point is (3, 0)."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4."],"fixes":[{"t":"`x = 3` or `x = -1`: the points are (3, 0) and (−1, −4).","why":"Each factor gives an `x`-value: `f(3) = 0` and `f(-1) = -4`.","_n":"1s3f3","_k":"af05a97a"},{"t":"`x = 3` only, since `x` must be positive.","why":"Nothing restricts `x` here.","_n":"1t3e3","_k":"6c9abe9d"},{"t":"`x = -3` or `x = 1`.","why":"`x - 3 = 0` gives 3; `x + 1 = 0` gives −1.","_n":"1u3d3","_k":"10c196c5"},{"t":"Step 4 is correct.","why":"A quadratic `f′` can give two `x`-values. Check both.","_n":"1v343","_k":"4ea50076"}],"hints":["How many factors are there?","Two: each gives an `x`-value.","`x = -1` too; `f(-1) = -1 - 3 = -4`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the rule checker: that constants vanish, or that the power rule works for fractions?"},{"id":"j2","q":"In your own words, why does a vertical stretch by `@a{k}` multiply every slope by `@a{k}`?"},{"id":"j3","q":"Explain to a friend how to find every point where a curve’s tangent is parallel to a given line."},{"id":"j4","q":"Which step trips you up (rewriting as powers, exponent arithmetic, or the tangent equation)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"\u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(x^7) = ?`","options":[{"t":"`7x^7`","why":"Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"1w333","_k":"7c20b754"},{"t":"`6x^7`","why":"The exponent comes down; it doesn’t become the coefficient minus one.","_n":"1x363","_k":"ed92e886"},{"t":"`x^6`","why":"Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"1y373","_k":"2a64132e"},{"t":"`7x^6`","why":"Bring the 7 down and lower the exponent to 6.","_n":"1z383","_k":"7bd106e1"}]},"b":{"prompt":"\u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(x^9) = ?`","options":[{"t":"`8x^9`","why":"The exponent comes down; it doesn’t become the coefficient minus one.","_n":"20393","_k":"24665fd4"},{"t":"`x^8`","why":"Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"213a3","_k":"5ce4ff05"},{"t":"`9x^9`","why":"Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"223b3","_k":"aa54e1d1"},{"t":"`9x^8`","why":"Bring the 9 down and lower the exponent to 8.","_n":"233c3","_k":"6ca2bf2e"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`f(x) = 4x^3 - 5x + 9`. What is `f′(x)`?","options":[{"t":"`12x^2`","why":"The derivative of `-5x` is −5.","_n":"243d3","_k":"d0f5d7cd"},{"t":"`12x^2 - 5 + 9`","why":"The derivative of 9 is 0. A constant’s graph is horizontal: slope 0.","_n":"252e3","_k":"a6e23846"},{"t":"`12x^2 - 5`","why":"Term by term: `12x^2`, then −5, then 0 for the constant.","_n":"262f3","_k":"d7bdfda5"},{"t":"`4x^2 - 5`","why":"Multiply the 4 by the exponent 3. Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"27303","_k":"b0ba0522"}]},"b":{"prompt":"`f(x) = 2x^4 + 3x - 8`. What is `f′(x)`?","options":[{"t":"`8x^3 + 3 - 8`","why":"The derivative of −8 is 0. A constant’s graph is horizontal: slope 0.","_n":"282f3","_k":"ed464990"},{"t":"`8x^3 + 3`","why":"Term by term: `8x^3`, then 3, then 0 for the constant.","_n":"29323","_k":"40e53915"},{"t":"`8x^3`","why":"The derivative of `3x` is 3.","_n":"2a313","_k":"fbfd3c65"},{"t":"`2x^3 + 3`","why":"Multiply the 2 by the exponent 4. Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"2b2c3","_k":"526fb17b"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"\u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`({1}/{x^2}) = ?`","options":[{"t":"`-{2}/{x^3}`","why":"`x^{-2} → -2x^{-3}`.","_n":"2c2b3","_k":"31df807c"},{"t":"`{1}/{2x}`","why":"Rewrite as a power first: `{1}/{x^2} = x^{-2}`.","_n":"2d2e3","_k":"90c0c33b"},{"t":"`-{2}/{x}`","why":"−2 − 1 = −3, not −1.","_n":"2e2d3","_k":"13342cef"},{"t":"`{2}/{x^3}`","why":"The −2 comes down with its sign.","_n":"2f383","_k":"749479d3"}]},"b":{"prompt":"\u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(√x) = ?`","options":[{"t":"`{1}/{2}x^{3/2}`","why":"1/2 − 1 = −1/2.","_n":"2g373","_k":"69a46e79"},{"t":"`{1}/{2√x}`","why":"`x^{1/2} → {1}/{2}x^{-1/2}`.","_n":"2haa3","_k":"ca5f0829"},{"t":"`{1}/{2}√x`","why":"The exponent must drop by 1.","_n":"2iab3","_k":"1aa3ba04"},{"t":"`{1}/{√x}`","why":"Don’t forget the factor 1/2.","_n":"2ja83","_k":"641e6255"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"At which points does `y = x^3 - 3x^2 - 9x + 2` have a horizontal tangent?","options":[{"t":"(3, −25) and (−1, 7)","why":"`y′ = 3(x - 3)(x + 1)`.","_n":"2ka93","_k":"e333d136"},{"t":"(3, 0) and (−1, 0)","why":"0 is the slope there, not the height.","_n":"2lae3","_k":"d0c08b6e"},{"t":"(3, −25) only","why":"A quadratic `f′` can give two `x`-values. Check both.","_n":"2maf3","_k":"91e3dca4"},{"t":"(−3, −25) and (1, −9)","why":"Sign slip: `(x - 3)(x + 1) = 0` gives 3 and −1.","_n":"2nac3","_k":"301afc9e"}]},"b":{"prompt":"At which points does `y = x^3 + 3x^2 - 24x + 1` have a horizontal tangent?","options":[{"t":"(2, −27) and (−4, 81)","why":"`y′ = 3(x - 2)(x + 4)`.","_n":"2oad3","_k":"938c895b"},{"t":"(2, 0) and (−4, 0)","why":"0 is the slope there, not the height.","_n":"2pb23","_k":"5f6dc03c"},{"t":"(−2, 53) and (4, 17)","why":"Sign slip: `(x - 2)(x + 4) = 0` gives 2 and −4.","_n":"2qb33","_k":"6c6a93f8"},{"t":"(2, −27) only","why":"A quadratic `f′` can give two `x`-values. Check both.","_n":"2r80b","_k":"3db33855"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Find the equation of the normal to `y = x^2 - 4x` at `x = 3`.","options":[{"t":"`y = -{x}/{2} - {3}/{2}`","why":"Tangent slope `y′(3) = 2`, so the normal’s slope is `-1/2`; the point is (3, −3).","_n":"2s81b","_k":"6d8a1b5a"},{"t":"`y = 2x - 9`","why":"That’s the tangent.","_n":"2t7eb","_k":"09dd416b"},{"t":"`y = -2x + 3`","why":"Negative, but not the reciprocal. Perpendicular slopes multiply to −1: the normal’s slope is `-1/m`.","_n":"2u7fb","_k":"2fa828d1"},{"t":"`y = {x}/{2} - {9}/{2}`","why":"Reciprocal without the sign change.","_n":"2v7cb","_k":"6adaac73"}]},"b":{"prompt":"Find the equation of the normal to `y = x^2 + 2x` at `x = 1`.","options":[{"t":"`y = {x}/{4} + {11}/{4}`","why":"Reciprocal without the sign change.","_n":"2w7db","_k":"9e3a1f1d"},{"t":"`y = 4x - 1`","why":"That’s the tangent.","_n":"2x7ab","_k":"a169e5d3"},{"t":"`y = -4x + 7`","why":"Negative, but not the reciprocal. Perpendicular slopes multiply to −1: the normal’s slope is `-1/m`.","_n":"2y7bb","_k":"0a09d5f9"},{"t":"`y = -{x}/{4} + {13}/{4}`","why":"Slope 4, so the normal’s slope is `-1/4`; the point is (1, 3).","_n":"2z78b","_k":"437321ab"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"`f(x) = ax^3 + bx`. The tangent at `x = 1` is horizontal, and `f(1) = -4`. Find `a` and `b`.","options":[{"t":"`a = 6`, `b = -2`","why":"`a` and `b` swapped: check `f′(1) = 18 - 2 ≠ 0`.","_n":"3079b","_k":"1ffff7a4"},{"t":"`a = 2`, `b = -6`","why":"`3a + b = 0` and `a + b = -4`.","_n":"3166b","_k":"f150e31e"},{"t":"`a = -2`, `b = 6`","why":"Sign slip when subtracting the equations.","_n":"3265b","_k":"71fb31f5"},{"t":"`a = 1`, `b = -3`","why":"That meets `3a + b = 0` but gives `f(1) = -2`.","_n":"3368b","_k":"a246d9ad"}]},"b":{"prompt":"`f(x) = ax^2 + bx`. The tangent at `x = 2` is horizontal, and `f(2) = -8`. Find `a` and `b`.","options":[{"t":"`a = -2`, `b = 8`","why":"Sign slip when subtracting the equations.","_n":"3467b","_k":"6da314e9"},{"t":"`a = 1`, `b = -4`","why":"`f(2) = -4`, not −8.","_n":"356ab","_k":"c2bd3916"},{"t":"`a = -8`, `b = 2`","why":"`a` and `b` swapped: check `f′(2) = -32 + 2 ≠ 0`.","_n":"3669b","_k":"6b3056e5"},{"t":"`a = 2`, `b = -8`","why":"`4a + b = 0` and `4a + 2b = -8`.","_n":"376cb","_k":"3b32b529"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Why is \u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(x^2 + 7)` the same as \u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(x^2)`?","options":[{"t":"“Because \u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(7) = 7`, which cancels.”","why":"The derivative of 7 is 0. A constant’s graph is horizontal: slope 0.","_n":"386bb","_k":"15ff4b94"},{"t":"“Adding 7 shifts the graph up 7. Every tangent shifts up too, so no slope changes: the derivative of a constant is 0.”","why":"A vertical shift moves every tangent without tilting it.","_n":"396eb","_k":"539566c1"},{"t":"“Because 7 is too small to matter.”","why":"Any constant works the same way.","_n":"3a6db","_k":"eb1cfec3"},{"t":"“Because you only differentiate the highest power.”","why":"Every term is differentiated.","_n":"3bf4a","_k":"bde20a51"}]},"b":{"prompt":"Why is \u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(5x^3) = 5 ·` \u003cspan class=\"m\">\u003cspan class=\"frac\">\u003cspan class=\"fn\">\u003cspan class=\"fnm\">d\u003c/span>\u003c/span>\u003cspan class=\"fd\">\u003cspan class=\"fnm\">d\u003c/span>\u003ci>x\u003c/i>\u003c/span>\u003c/span>\u003c/span>`(x^3)`?","options":[{"t":"“Because the derivative of `5x^3` is `5x^3`.”","why":"Two moves: the exponent comes down as a factor \u003cstrong>and\u003c/strong> drops by 1.","_n":"3cf5a","_k":"684dfc8d"},{"t":"“Because the 5 becomes part of the exponent.”","why":"The coefficient stays in front.","_n":"3df6a","_k":"32374665"},{"t":"“Because 5 is a constant, so its derivative is 0.”
