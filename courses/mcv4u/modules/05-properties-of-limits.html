.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 05: lim typesetting, hero, 0/0 detective (V7 rule chooser, algebra steps, V6 table, law cards), workbench,
   one-sided stations, V8 fraction box, fillable-hole task */
/* lim with the approach underneath: the box's baseline is "lim", so it sits on the text baseline */
.pl-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.pl-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.pl-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.pl-lu .m{font-size:1em;white-space:nowrap}
.opt .m,.chip .m,.fchip .m,.read dd .m,.read dt .m,.tile .m,.chip-in .m,.pl-say .m{white-space:normal}
.read dt .pl-lim{font-weight:400}
.opt .pl-lim,.sq-p .pl-lim,.tile .pl-lim,.chip-in .pl-lim,.q-prompt .pl-lim,.task .pl-lim{margin-bottom:.1em}
.face .pl-lim{margin-bottom:.15em}

/* hero */
.hero-eq .pl-lim{margin-right:.16em}
.pl-badge{display:inline-block;background:var(--hi-soft);color:var(--ink);border-radius:.2em;padding:0 .25em;font-style:normal;white-space:nowrap}
.hero-eq .pl-badge{font-weight:700}
.pl-harr{font-family:var(--font-ui);font-size:.7em;color:var(--ink-2);padding:0 .08em}
#hero-cap{min-height:3.3em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.25em .4em}
.pl-hnote{font:400 .85em var(--font-ui);color:var(--ink-2)}
.pl-x{text-decoration:line-through;text-decoration-color:var(--ink-2);text-decoration-thickness:.09em;color:var(--ink-2)}
.pl-fade .pl-x{opacity:.2;transition:opacity 1s}

/* piecewise caption */
.pl-pw{display:inline-flex;align-items:center;vertical-align:middle;gap:.12em}
.pl-br{font:400 2.3em/1 var(--font-math);transform:scaleX(.7);margin-top:-.08em}
.pl-cases{display:flex;flex-direction:column;gap:.08em;font-size:.78em;line-height:1.15}
.pl-case{display:flex;gap:.9em;align-items:baseline;white-space:nowrap}
.pl-cond{font-size:.82em;color:var(--ink-2)}

/* 0/0 detective: controls first, then the graph column; readout on the right */
.pg.pl-pg{grid-template-areas:"ctrl read" "graph read"}
.pl-pg .eq-cap{min-height:2.4em;display:flex;align-items:center;flex-wrap:wrap;gap:.1em .6em}
.pl-giv{white-space:nowrap}
.pl-lab{margin:0 0 6px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.pl-lims{margin:0 0 12px}
.pl-lchip{font-size:1rem;display:inline-flex;align-items:center;gap:.35em}
.pl-cn{font:700 .78rem var(--font-ui);color:var(--ink-2)}
.pl-lchip[aria-pressed="true"] .pl-cn{color:var(--hi-ink)}
.pl-stp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 10px}
.pl-sn{font:700 .8rem var(--font-ui);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);min-width:3.6rem}
.pl-sl2{font-size:.9rem;font-weight:700}
.pl-stp2 .pl-techs{flex:1 1 100%}
.pl-acts{display:flex;flex-wrap:wrap;gap:8px}
.pl-rg{display:inline-flex;flex-wrap:wrap;gap:6px}
.pl-rg button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.pl-rg button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.pl-rg button:disabled{opacity:.6}
.pl-rg button .m{white-space:nowrap}
.pl-fb .fb{margin-top:6px}
.pl-locked .pl-lims .fchip,.pl-locked .pl-echip,.pl-locked .pl-lawb{opacity:.65}
.pl-subl{margin:2px 0 10px;font-size:1.02rem;min-height:1.6em}
.pl-subl .m{font-size:1.08em}
.pl-no{color:var(--red)}
.pl-steps,.pl-laws{margin:0 0 12px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--paper)}
.pl-sth{margin:0 0 8px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.pl-lines{display:grid;gap:6px}
.pl-ln{padding:4px 8px;border-radius:6px}
.pl-ln.cur{background:var(--hi-soft)}
.pl-lm{font:400 1.2rem var(--font-math);overflow-x:auto;overflow-y:hidden;padding:2px 0}
.pl-lm .m{font-size:1em}
.pl-pre{font:700 .85rem var(--font-ui);color:var(--ink-2)}
.pl-note{margin:4px 0 2px;font-size:.9rem;color:var(--ink-2)}
.pl-steps .player{margin-top:8px}
.pl-tbl{margin-top:10px}

/* limit laws */
.pl-echip{font-size:1rem}
.pl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.6rem,1fr));gap:8px}
.pl-lawb{min-height:40px;white-space:normal;line-height:1.15}
.pl-lexp{margin:0 0 8px;font-size:1.2rem}
.pl-lemp{margin:0}
.pl-slots{margin:0;padding-left:1.5em;display:grid;gap:10px}
.pl-slots li{padding-left:2px}
.pl-slots li.no .pl-card{border-color:var(--red);color:var(--red)}
.pl-card{display:inline-block;font:700 .82rem var(--font-ui);border:1.5px solid var(--ink-2);border-radius:6px;padding:.1em .5em;margin:0 0 4px}
.pl-sline{display:block;font-size:1.1rem;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.pl-sline .m{font-size:1em;white-space:normal;line-height:1.9}
.pl-laws .fb{margin-top:10px}

/* V6 approach table */
.pl-v6{margin:0}
.pl-v6g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.pl-v6s{min-width:0;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden}
table.pl-v6t{width:100%;border-collapse:collapse;font-family:var(--font-math);font-size:1.05rem}
table.pl-v6t th,table.pl-v6t td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.pl-v6t th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.pl-v6t th .m{font-size:1.15em;color:var(--ink)}
table.pl-v6t tr:last-child td{border-bottom:0}
table.pl-v6t .hl{background:var(--hi-soft)}
.pl-v6h{font-weight:700}
.pl-v6at{margin:10px 0 0;font-size:1rem}
.pl-v6n{margin:6px 0 0}

/* challenge workbench */
.pl-wb{margin-top:18px;border:1.5px dashed var(--ink-2);border-radius:8px;padding:10px 14px 14px;background:var(--paper)}
.pl-wbh{margin:0 0 8px}
.pl-wbr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:10px 0}
.pl-wbq{font:400 1.2rem var(--font-math);margin:0;display:inline-flex;align-items:center;gap:.25em}
.pl-wbn{font:700 .82rem var(--font-ui);color:var(--ink-2);min-width:6.4rem}
.pl-wbt{margin:0 0 6px}
.pl-wb3{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.pl-wb3 .pl-wbn{display:block}
.pl-wb3 .pl-wbq{margin:6px 0 8px}
.pl-sl output{color:var(--ink)}
.pl-tc3c{margin:4px 0 8px}

/* Part 3 stations */
.pl-st{margin:0 0 6px}
.pl-st .seg-wrap{margin-top:0}
.pl-h{margin:12px 0 10px}
.pl-fns{margin:0 0 8px}
.pl-p3cap{font-size:1.6rem;min-height:2.2em;display:flex;align-items:center}
.pl-probe{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.pl-pline{margin:4px 0 0;min-height:1.5em}
.pl-say{margin:12px 0 10px;font-size:1.02rem}
.pl-grey{color:var(--ink-2);font-style:italic}

/* V8 fraction box */
.pl-v8{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0 4px}
.pl-v8l{font-size:1.15rem}
.pl-v8f{display:inline-flex;flex-direction:column;align-items:stretch;gap:5px}
.pl-v8f .numin{width:6.5rem;text-align:center}
.pl-v8bar{display:block;border-top:2px solid var(--ink)}

/* task */
.pl-tcap{font:400 1.45rem var(--font-math);margin:0 0 8px;min-height:2.2em}
.pl-after4{margin-top:8px}

@media (max-width:820px){
  .pg.pl-pg{grid-template-areas:"ctrl" "graph" "read"}
}
@media (max-width:560px){
  .pl-v6g{grid-template-columns:minmax(0,1fr);gap:8px}
  .pl-cards{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .pl-pg .eq-cap{font-size:1.5rem}
  .pl-p3cap{font-size:1.35rem}
  .pl-wbn{min-width:0;flex:1 1 100%}
  .pl-lm{font-size:1.08rem}
  .pl-modes .seg-wrap{display:block}
  .pl-modes .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;margin-top:4px}
  .pl-modes .seg button{padding:.4em .3em;font-size:.84rem;line-height:1.15}
}

03c/span>\u003c/span> `(x + 3) = 6`\u003c/span>","eqLabel":"The limit of (x squared minus 9) over (x minus 3), as x approaches 3: substitution gives 0 over 0, so simplify; the limit of x plus 3, as x approaches 3, is 6.","eqSize":"sm","headline":"0/0 means: do more work","text":"The \u003cstrong>limit laws\u003c/strong> say limits of sums, products and quotients combine just like the functions do, so often you can simply \u003cstrong>substitute\u003c/strong>. When substitution gives \u003cstrong>0/0\u003c/strong>, the form is \u003cstrong>indeterminate\u003c/strong>: simplify by factoring, rationalizing or combining fractions, then substitute into the simpler expression.","fig":{"aria":"The graph of y = (x² − 9)/(x − 3): the line y = x + 3 with an open circle at (3, 6). Substituting x = 3 gives 0/0. The numerator factors into (x − 3)(x + 3), the x − 3 factors cancel because x ≠ 3, and a ring marks the limit 6 at the hole, which stays open."}},"goals":["I can use the limit laws and direct substitution when they apply.","I can recognize the indeterminate form 0/0 and explain what it does and doesn’t tell me.","I can evaluate 0/0 limits by factoring and cancelling.","I can evaluate 0/0 limits by rationalizing, combining fractions or changing the variable.","I can find one-sided limits of piecewise and absolute-value functions and decide whether the limit exists."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Factoring","goal":3,"prompt":"Factor `x^2 - 5x + 6`.","options":[{"t":"`(x - 1)(x - 6)`","why":"The sum is −7.","_n":"0c5f","_k":"ff91af84"},{"t":"`(x - 2)(x - 3)`","why":"Product 6, sum −5.","_n":"1c2f","_k":"f6b1ef7d"},{"t":"`(x - 2)(x + 3)`","why":"That gives `+x - 6`.","_n":"2c3f","_k":"79ad60c4"},{"t":"`(x + 2)(x + 3)`","why":"That expands to `x^2 + 5x + 6`.","_n":"3c8f","_k":"ea3e1c46"}],"hints":["Two numbers: product 6, sum −5.","−2 and −3.","`(x - 2)(x - 3)`."]},{"id":"w2","skill":"Factoring","goal":3,"prompt":"Factor `x^3 - 8`.","options":[{"t":"`(x 5bbd"},{"t":"−5","_n":"1137d","_k":"0d21dbf1"},{"t":"11","_n":"1236d","_k":"04ea3ed0"},{"t":"You can’t tell without the formulas","_n":"13bde","_k":"a7d613bb"}],"explain":"Product law, then sum law: 4(−2) + 3 = −5. The laws let you combine the limits without knowing the functions. A quotient would need \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → a`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `g(x) ≠ 0`; here it’s −2, so `f/g → -2` as well."}],"chalIntro":"Use the detective and the challenge workbench under it, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Find \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → -1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 + 4x + 3}/{x + 1}`. Type it in the workbench.","why":"`{(x + 1)(x + 3)}/{x + 1} = x + 3` for `x ≠ -1`, so the limit is −1 + 3 = 2.","hints":["Substitute: 0/0. Factor the numerator.","`{(x + 1)(x + 3)}/{x + 1} = x + 3` for `x ≠ -1`.","−1 + 3 = 2."]},{"id":"tc2","goal":4,"prompt":"Find \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√{9 + x} - 3}/{x}`. Type it in the workbench.","why":"Rationalizing gives `{1}/{√{9 + x} + 3}`, which approaches `{1}/{3 + 3} = {1}/{6}`.","hints":["0/0: rationalize the numerator.","You get `{1}/{√{9 + x} + 3}`.","`{1}/{3 + 3} = {1}/{6}`."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Find the value of `a` so that \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√{ax + 9} - 3}/{x} = 2`. Use the `a` slider and its live table in the workbench.","why":"Rationalizing gives `{a}/{√{ax + 9} + 3}`, which approaches `{a}/{6}`; `{a}/{6} = 2` when `a = 12`.","hints":["Rationalize: the numerator becomes `ax + 9 - 9 = ax`.","The expression simplifies to `{a}/{√{ax + 9} + 3}`, which approaches `{a}/{6}`.","`{a}/{6} = 2`, so `a = 12`."]}]},"part3":{"slug":"one-sided","name":"One-sided","heading":"One-sided limits and piecewise functions","intro":"Not every limit problem yields to algebra on one formula. Absolute values and piecewise rules need each side checked separately. Visit the three stations, send the probes toward the point from each side, then try the quick check.","quickCheck":{"title":"Quick check","summary":"One-sided quick check","items":[{"id":"q1","goal":5,"prompt":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 5^{-}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{|x - 5|}/{x - 5}`?","choices":[{"t":"does not exist","fb":"Left of 5, `|x - 5| = -(x - 5)`.","_n":"14bee","_k":"ee0aa315"},{"t":"1","fb":"Left of 5, `|x - 5| = -(x - 5)`.","_n":"15bbe","_k":"692b745b"},{"t":"−1","fb":"Right. Left of 5, `|x - 5| = -(x - 5)`, so the quotient is −1.","_n":"16bce","_k":"1728c9a6"},{"t":"0","fb":"Left of 5, `|x - 5| = -(x - 5)`.","_n":"17c1e","_k":"82117ea5"}]},{"id":"q2","goal":5,"prompt":"`f(x) = 2x + 1` for `x \u003c 3` and `x^2 - k` for `x ≥ 3`. Which `k` makes the limit at 3 exist?","choices":[{"t":"−2","fb":"The left side heads to 2(3) + 1 = 7: `7 = 9 - k`.","_n":"18c2e","_k":"a1f5973d"},{"t":"2","fb":"Right. The left side heads to 7 and the right side to `9 - k`, so `7 = 9 - k` and `k = 2`.","_n":"19bfe","_k":"61078558"},{"t":"7","fb":"The left side heads to 2(3) + 1 = 7: `7 = 9 - k`.","_n":"1ac0e","_k":"cfae943e"},{"t":"16","fb":"The left side heads to 2(3) + 1 = 7: `7 = 9 - k`.","_n":"1bb5e","_k":"fe092837"}]},{"id" `{x^2 + x - 6}/{x - 2}`","_a":"FVYHEg==","why":"Substitution gives 0/0. `{(x + 3)(x - 2)}/{x - 2} = x + 3`, so the limit is 5.","wrong":{},"goal":3},{"id":"s2","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 9`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√x - 3}/{x - 9}`","_a":"FUIFEg==","why":"The radical makes it 0/0. Rationalizing gives `{1}/{√x + 3}`, so the limit is `{1}/{6}`.","wrong":{"fc":"The radical is what makes it 0/0; rationalize."},"goal":4},{"id":"s3","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 + 1}/{x + 3}`","_a":"FVQXEg==","why":"Substitution gives `{1 + 1}/{1 + 3}`: the limit is `{1}/{2}`.","wrong":{"fc":"Substitute first: it isn’t 0/0.","ra":"Substitute first: it isn’t 0/0.","cd":"Substitute first: it isn’t 0/0."},"goal":1},{"id":"s4","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{{1}/{x + 4} - {1}/{4}}/{x}`","_a":"FVMAEg==","why":"Combine the fractions on top: `{-x}/{4(x + 4)}`. Dividing by `x` leaves `{-1}/{4(x + 4)}`, so the limit is `-{1}/{16}`.","wrong":{"fc":"Combine the fractions in the numerator first."},"goal":4},{"id":"s5","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → -3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^3 + 27}/{x + 3}`","_a":"FVYHEg==","why":"Sum of cubes: `(x + 3)(x^2 - 3x + 9)`. Cancel `x + 3`: the limit is 27.","wrong":{},"goal":3,"hints":["Substitute: 0/0.","Sum of cubes: `(x + 3)(x^2 - 3x + 9)`.","Factor and cancel; the limit is 9 + 9 + 9 = 27."]},{"id":"s6","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√{x + 1} - 1}/{x}`","_a":"FUIFEg==","why":"The radical makes it 0/0. Rationalizing gives `{1}/{√{x + 1} + 1}`, so the limit is `{1}/{2}`.","wrong":{"fc":"The radical is what makes it 0/0; rationalize."},"goal":4},{"id":"s7","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{{1}/{x} - {1}/{3}}/{x - 3}`","_a":"FVMAEg==","why":"`{1}/{x} - {1}/{3} = {3 - x}/{3x}`, so the expression is `-{1}/{3x}` and the limit is `-{1}/{9}`.","wrong":{"fc":"Combine the fractions in the numerator first."},"goal":4},{"id":"s8","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^4 - 16}/{x - 2}`","_a":"FVYHEg==","why":"`x^4 - 16 = (x - 2)(x + 2)(x^2 + 4)`. Cancel `x - 2`: the limit is 32.","wrong":{"ds":"Substitution gives 0/0."},"goal":3,"hints":["`x^4 - 16` is a difference of squares.","`(x^2 - 4)(x^2 + 4) = (x - 2)(x + 2)(x^2 + 4)`.","Factor and cancel: 4 × 8 = 32."]},{"id":"s9","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 5`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `√{x + 4}`","_a":"FVQXEg==","why":"Substitution gives `√9`: the limit is 3.","wrong":{"fc":"Substitute first: it isn’t 0/0.","ra":"Substitute first: it isn’t 0/0.","cd":"Substitute first: it isn’t 0/0."},"goal":1},{"id":"s10","t":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{2x^2 - 3x}/{x}`","_a":"FVYHEg==","why":"Common factor: `{x(2x - 3)}/{x} = 2x - 3`, so the limit is −3.","wrong":{},"goal":3}]},{"id":"evaluate","type":"custom","title":"Evaluate the limit","summary":"Evaluate the limit","star":true,"goal":[3,4],"instruction":"Evaluate each limit exactly. Type a whole number or a fraction, then press Check.","how":"Fill in the top and bottom boxes of the fraction. Leave the bottom empty for a whole number. Use − for a negative answer.","items":[{"id":"v1","goal":3,"ask":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → -2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 - 4}/{x + 2}`","_a":"FR1QEg==","why":"`{(x - 2)(x + 2)}/{x + 2} = x - 2`, which approaches −4.","wrong":[{"v":"4","fb":"`x - 2` at `x = -2` is −4."}]},{"id":"v2","goal":3,"ask":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^3 - 1}/{x^2 - 1}`","_a":"FQNLAhI=","why":"`{(x - 1)(x^2 + x + 1)}/{(x - 1)(x + 1)} = {x^2 + x + 1}/{x + 1}`, which approaches `{3}/{2}`.","wrong":[{"v":"3","fb":"Cancel `x - 1` from both: `{x^2 + x + 1}/{x + 1}`."}]},{"id":"v3","goal":4,"star":true,"ask":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√{4 + x} - √{4 - x}}/{x}`","_a":"FQFLAhI=","why":"The numerator becomes `2x`, so the expression is `{2}/{√{4 + x} + √{4 - x}}`, which approaches `{2}/{4} = {1}/{2}`.","wrong":[{"v":"1/4","fb":"The numerator becomes `(4 + x) - (4 - x) = 2x`."}],"hints":["Multiply by the conjugate `√{4 + x} + √{4 - x}`.","The numerator becomes `2x`.","`{2}/{2 + 2} = {1}/{2}`."]},{"id":"v4","goal":3,"star":true,"ask":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{(x + 3)^2 - 9}/{x}`","_a":"FQZG","why":"`{x^2 + 6x}/{x} = x + 6`, which approaches 6.","wrong":[{"v":"9","fb":"Expand: `x^2 + 6x`."}]},{"id":"v5","goal":4,"star":true,"ask":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 8`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{∛x - 2}/{x - 8}` (change of variable)","_a":"FQFLAQIV","why":"With `u = ∛x`, `{u - 2}/{u^3 - 8} = {1}/{u^2 + 2u + 4}`, which approaches `{1}/{12}`.","wrong":[{"v":"1/4","fb":"With `u = ∛x`, `x - 8 = u^3 - 8 = (u - 2)(u^2 + 2u + 4)`."}],"hints":["Let `u = ∛x`. As `x → 8`, `u → 2`.","`{u - 2}/{u^3 - 8} = {1}/{u^2 + 2u + 4}`.","`{1}/{4 + 4 + 4} = {1}/{12}`."]},{"id":"v6","goal":4,"star":true,"ask":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{{1}/{(x + 1)^2} - 1}/{x}`","_a":"FR1WEg==","why":"`{1 - (x + 1)^2}/{(x + 1)^2} = {-2x - x^2}/{(x + 1)^2}`; dividing by `x` gives `{-2 - x}/{(x + 1)^2}`, which approaches −2.","wrong":[{"v":"2","fb":"The numerator is `1 - (x + 1)^2`, which is negative near 0."}],"hints":["Combine: `{1 - (x + 1)^2}/{(x + 1)^2}`.","`1 - (x + 1)^2 = -2x - x^2`, so dividing by `x` gives `{-2 - x}/{(x + 1)^2}`.","`{-2}/{1} = -2`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Eli","how":"","goal":[3,4,5],"instruction":"Eli made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 - 2x - 3}/{x - 3}`.","steps":["Direct substitution gives 0/0, so more work is needed.","Factor: `{(x - 3)(x + 1)}/{x - 3}`.","Cancel the `x` terms everywhere, leaving `{(-3)(1)}/{-3}`.","So the limit is 1."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"The limit is 0.","why":"Only whole factors cancel, not individual terms. 0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"1kc0e","_k":"5987c614"},{"t":"Cancel the common factor `(x - 3)`, since `x ≠ 3`, leaving `x + 1`, which approaches 4.","why":"Only whole factors cancel, not individual terms.","_n":"1lbbe","_k":"10e6cd55"},{"t":"The limit is −1.","why":"Only whole factors cancel, not individual terms.","_n":"1mbae","_k":"9a0f8a60"},{"t":"Step 3 is correct.","why":"Only whole factors cancel, not individual terms.","_n":"1nb1e","_k":"0cc72bdf"}],"hints":["What exactly can cancel in a fraction?","Common factors: `(x - 3)` on top and bottom.","`x + 1 → 4`."]},{"id":"e2","goal":4,"task":"Find \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√x - 1}/{x - 1}`.","steps":["Substitution gives 0/0, so rationalize.","Multiply the top and bottom by `√x + 1`.","Numerator: `(√x)^2 - 1 = x - 1`.","So the expression is `{x - 1}/{(x - 1)(√x - 1)}`.","`= {1}/{√x - 1}`, so the limit doesn’t exist."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4."],"fixes":[{"t":"The denominator is `(x - 1)(√x + 1)`, so the expression is `{1}/{√x + 1}`, and the limit is `{1}/{2}`.","why":"The bottom was multiplied by `√x + 1`, not `√x - 1`.","_n":"1ob2e","_k":"3b59c23a"},{"t":"The limit is 0.","why":"The bottom was multiplied by `√x + 1`, not `√x - 1`.","_n":"1pb3e","_k":"32dd9af3"},{"t":"The limit is 1.","why":"The bottom was multiplied by `√x + 1`, not `√x - 1`.","_n":"1qb4e","_k":"e4a0a8a5"},{"t":"Step 4 is correct.","why":"The bottom was multiplied by `√x + 1`, not `√x - 1`.","_n":"1rade","_k":"3025a48f"}],"hints":["What was the bottom multiplied by in step 2?","`√x + 1`.","`{1}/{1 + 1} = {1}/{2}`."]},{"id":"e3","goal":5,"task":"Find \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{|x - 2|}/{x - 2}`.","steps":["Direct substitution gives 0/0.","For `x > 2`, `|x - 2| = x - 2`, so the expression is 1.","For `x \u003c 2`, `|x - 2| = x - 2` as well, so the expression is 1.","So the limit is 1."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"The limit is 0.","why":"Try `x = 1`: `|1 - 2| = 1`, but `1 - 2 = -1`.","_n":"1saee","_k":"c74ddd43"},{"t":"The limit is −1.","why":"Try `x = 1`: `|1 - 2| = 1`, but `1 - 2 = -1`.","_n":"1tafe","_k":"9952705f"},{"t":"Step 3 is correct.","why":"Try `x = 1`: `|1 - 2| = 1`, but `1 - 2 = -1`.","_n":"1ub0e","_k":"52e1c49d"},{"t":"For `x \u003c 2`, `|x - 2| = -(x - 2)`, so the expression is −1. The one-sided limits differ, so the limit doesn’t exist.","why":"Try `x = 1`: `|1 - 2| = 1`, but `1 - 2 = -1`.","_n":"1vb9e","_k":"3e50f09c"}],"hints":["Test a value just left of 2.","`x = 1.9`: `{|-0.1|}/{-0.1} = -1`.","Left −1, right 1: no limit."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the 0/0 detective: that 0/0 limits can give different answers, or that the hole never closes?"},{"id":"j2","q":"In your own words, what’s the difference between 0/0 and 5/0 when you substitute?"},{"id":"j3","q":"Explain to a friend how you decide which technique to use on a 0/0 limit."},{"id":"j4","q":"Which technique is least comfortable for you? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 5` and \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `g(x) = -3`. What is \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `[2f(x) - g(x)]^2`?","options":[{"t":"13","why":"Square the result.","_n":"1wbae","_k":"0e1bd766"},{"t":"49","why":"`-g` gives +3, not −3: (10 − 3)² is a sign slip.","_n":"1xb7e","_k":"79baba2f"},{"t":"64","why":"Multiply `f`’s limit by 2 first: (5 + 3)² forgets it.","_n":"1yb6e","_k":"aa1f3f3b"},{"t":"169","why":"(10 + 3)².","_n":"1zb5e","_k":"71c598fc"}]},"b":{"prompt":"\u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = -2` and \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `g(x) = 3`. What is \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `[f(x) - 2g(x)]^2`?","options":[{"t":"−8","why":"Square the result.","_n":"20b4e","_k":"705f88dd"},{"t":"16","why":"That’s a sign slip: (−2 + 6)².","_n":"21b3e","_k":"4d4a4cab"},{"t":"25","why":"(−2 − 3)² forgets the 2.","_n":"22b2e","_k":"3a629ab9"},{"t":"64","why":"(−2 − 6)².","_n":"23b1e","_k":"f4c23278"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Direct substitution in \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 4`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 - 16}/{x - 4}` gives 0/0. What does this mean?","options":[{"t":"The limit is 0.","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"24b0e","_k":"b1c73a55"},{"t":"The limit is 1.","why":"0/0 isn’t 1. 0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"25bfe","_k":"b73c8b0e"},{"t":"The expression is undefined at 4, but the limit may still exist: simplify first.","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number. Here `{(x - 4)(x + 4)}/{x - 4} = x + 4`, so the limit is 8.","_n":"26bee","_k":"370dfea5"},{"t":"The limit does not exist.","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2735c","_k":"050a3c6e"}]},"b":{"prompt":"Direct substitution in \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → -5`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 - 25}/{x + 5}` gives 0/0. What does this mean?","options":[{"t":"The expression is undefined at −5, but the limit may exist: simplify first.","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number. Here `{(x + 5)(x - 5)}/{x + 5} = x - 5`, so the limit is −10.","_n":"2836c","_k":"56c7d811"},{"t":"The limit does not exist.","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2933c","_k":"1aa2ab8a"},{"t":"The limit is 0.","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2a34c","_k":"78edcaa9"},{"t":"The limit is 1.","why":"0/0 isn’t 1. 0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2b31c","_k":"93d7046f"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Evaluate \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → -4`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 + x - 12}/{x + 4}`.","options":[{"t":"−7","why":"`{(x + 4)(x - 3)}/{x + 4} = x - 3 → -7`.","_n":"2c32c","_k":"c7a1597e"},{"t":"Doesn’t exist (0/0).","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2d2fc","_k":"ace0bc41"},{"t":"0","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2e30c","_k":"3a596a49"},{"t":"7","why":"`x - 3` at `x = -4` is −7.","_n":"2f3dc","_k":"3232341e"}]},"b":{"prompt":"Evaluate \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → -3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{x^2 - 2x - 15}/{x + 3}`.","options":[{"t":"−8","why":"`{(x + 3)(x - 5)}/{x + 3} = x - 5 → -8`.","_n":"2g3ec","_k":"c8801aa1"},{"t":"Doesn’t exist","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2h3bc","_k":"af2e13a2"},{"t":"8","why":"`x - 5` at `x = -3` is −8.","_n":"2i3ac","_k":"02d6d374"},{"t":"0","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2j3dd","_k":"b5c43e33"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Evaluate \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√{x + 16} - 4}/{x}`.","options":[{"t":"0","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2k3cc","_k":"e0782bd8"},{"t":"1/8","why":"Rationalize: `{1}/{√{x + 16} + 4} → {1}/{8}`.","_n":"2l3fd","_k":"3d4ec220"},{"t":"1/4","why":"The denominator is `√16 + 4 = 8`.","_n":"2m3ed","_k":"e8584e99"},{"t":"8","why":"The fraction is flipped.","_n":"2n41d","_k":"9f74597b"}]},"b":{"prompt":"Evaluate \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 0`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{√{x + 25} - 5}/{x}`.","options":[{"t":"0","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2o40d","_k":"f359990b"},{"t":"1/10","why":"Rationalize: `{1}/{√{x + 25} + 5} → {1}/{10}`.","_n":"2p33c","_k":"6bb5de90"},{"t":"1/5","why":"The denominator is `√25 + 5 = 10`.","_n":"2q32c","_k":"622feceb"},{"t":"10","why":"The fraction is flipped.","_n":"2r3a0","_k":"8386d862"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Evaluate \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 2`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{{1}/{x} - {1}/{2}}/{x - 2}`.","options":[{"t":"0","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2s390","_k":"046e3a8b"},{"t":"1/4","why":"`2 - x = -(x - 2)`: the sign is negative.","_n":"2t380","_k":"2e8507f9"},{"t":"−1/4","why":"`{2 - x}/{2x(x - 2)} = -{1}/{2x} → -{1}/{4}`.","_n":"2u370","_k":"9694b44c"},{"t":"Doesn’t exist (0/0).","why":"0/0 is indeterminate: it says “simplify first”. The limit could be any number.","_n":"2v3e0","_k":"853c115a"}]},"b":{"prompt":"Evaluate \u003cspan class=\"pl-lim\">\u003cspan class=\"pl-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"pl-lu\">`x → 5`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `{{1}/{x} - {1}/{5}}/{x - 5}`.","options":[
