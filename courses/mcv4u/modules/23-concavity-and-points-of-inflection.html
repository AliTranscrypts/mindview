.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 23: hero equation, bend detector (V5 panels + V11 concavity strip), Part 3 stations (radios, cards, stepper, growth
   panels), V11 sign chart, Bend it fields and the task steppers */
.cv-heq{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.1em;line-height:1.3}
.cv-ht{white-space:nowrap}
.cv-hdot{display:none}
.cv-f4,.cv-f4 .m{color:var(--f4)}

.cv-ex{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.cv-main,.cv-side{min-width:0}
.cv-eq{min-height:1.6em}
.cv-pan{margin-top:4px}
.cv-pan[hidden]{display:none}
.cv-pcap{margin:4px 0 2px;font-size:.95rem;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-height:1.5em}
.cv-pcap .m{white-space:nowrap}
.cv-sw{display:inline-block;width:18px;height:4px;border-radius:2px;flex:0 0 auto}
canvas.plot.cv-c-f{aspect-ratio:16/9}
canvas.plot.cv-c-strip{aspect-ratio:auto;height:58px}
canvas.plot.cv-c-d1,canvas.plot.cv-c-d2{aspect-ratio:16/5}
.cv-fns{margin-bottom:6px}
.cv-fns .chip{font-size:.86rem}
.cv-fns .chip .m{font-size:1.05em}
.cv-bsl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;margin:2px 0 4px}
.cv-bsl output{color:var(--ink)}
#cv-mode{margin-top:6px}
.cv-how{margin:8px 0 10px}
.cv-sl output{color:var(--ink)}
.cv-skip,.cv-mnote{min-height:1.2em;margin:0 0 6px;color:var(--ink-2);font-weight:600}
.cv-mk{margin:4px 0 4px}
.cv-mk .chip{min-height:34px}
.cv-sum{margin-top:10px}
.cv-sum summary{cursor:pointer;font-weight:700}
.cv-sum .read{margin-top:8px}
.cv-ibbox{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.cv-ibh{margin:0 0 4px;font-size:1.05rem}

.cv-st h3{margin-top:0}
.cv-st:first-child{margin-top:0;padding-top:0;border-top:0}
.cv-rg{display:inline-flex;flex-wrap:wrap;gap:6px}
.cv-rg button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.cv-rg button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cv-rg button:disabled{opacity:.65}
.cv-cpt{margin:0 0 14px}
.cv-cl{margin:0 0 6px}
.cv-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin-top:6px}
.cv-card{min-width:0;border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.cv-cf{margin:0 0 6px;font-size:1.05rem}
.cv-card .cv-rgh{margin-top:8px}
.cv-steps{list-style:none;margin:0 0 8px;padding:0}
.cv-steps li{display:flex;gap:8px;padding:5px 8px;border-radius:6px;margin:2px 0}
.cv-steps li.cur{background:var(--hi-soft)}
.cv-steps .sn{font-weight:700;min-width:1.4em}
canvas.plot.cv-c-n{aspect-ratio:16/8}
canvas.plot.cv-c-n1{aspect-ratio:16/6}
.cv-s3b{margin-top:6px}

.cv-sc-wrap{overflow-x:auto;position:relative}
table.cv-sct th,table.cv-sct td{padding:5px 8px;text-align:center;white-space:nowrap}
table.cv-sct tbody th{text-align:left;font-weight:600}
.cv-sc-k{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.cv-sct .cv-sc-u{font:600 .78rem var(--font-ui);color:var(--ink-2)}
table.cv-sct .cv-sc-ar span[aria-hidden]{font-size:1.25rem;line-height:1;display:block}
.cv-sc-w{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.cv-sct .cv-sc-d td{font-weight:700}

.cv-bf{margin:8px 0 6px}
.cv-bl{margin:6px 0 2px;font-weight:600}
.cv-bfiv{border-left:3px solid var(--rule);padding-left:10px}
.cv-bnum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:400 1.05rem var(--font-math)}
.cv-bpts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.cv-bpt{display:inline-flex;align-items:center;gap:4px}
.cv-bpt .m{font-size:1.2rem}
.cv-bpt .numin.short{width:4.6rem}
.cv-band{color:var(--ink-2);font-size:.9rem}

.cv-tstep{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.cv-tstep label{min-width:7rem}
.cv-tlab{font-size:1.2rem}
.cv-tstep .btn{min-width:40px;font-size:1.1rem}
.cv-tstep .numin.short{width:5rem}
.cv-tpan canvas.plot.cv-ttop{aspect-ratio:16/9}
.cv-tpan canvas.plot.cv-tlow{aspect-ratio:16/6}

@media (max-width:820px){
  .cv-ex{grid-template-columns:minmax(0,1fr)}
  .cv-cards{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  canvas.plot.cv-c-f{aspect-ratio:auto;height:220px}
  canvas.plot.cv-c-d1,canvas.plot.cv-c-d2{aspect-ratio:auto;height:120px}
  canvas.plot.cv-c-strip{height:52px}
  .cv-bsl{grid-template-columns:minmax(0,1fr)}
  .cv-bpt .numin.short{width:3.8rem}
}

dline":"Which way is the graph bending?","text":"When the slopes of the tangents keep increasing, the graph bends upward: it’s \u003cstrong>concave up\u003c/strong>. When they keep decreasing, it’s \u003cstrong>concave down\u003c/strong>. The second derivative measures that change. Where the bending switches direction, there’s a \u003cstrong>point of inflection\u003c/strong>.","fig":{"aria":"The graph of y = x³ − 6x² + 9x + 1 with a tangent line sliding along it.","shape":"wide"}},"goals":["I can find intervals of concavity from the sign of `f″` and explain concavity using slopes of tangents.","I can connect the graphs of `f`, `f′` and `f″`: concave up ↔ `f′` increasing ↔ `f″ > 0`.","I can find points of inflection, checking that the concavity really changes at a point on the graph.","I can use the second derivative test to classify critical points, and recognize when it gives no conclusion.","I can analyse concavity for rational functions and functions with fractional exponents.","I can interpret concavity and points of inflection in context (“growing, but more slowly”)."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Second derivatives","goal":1,"prompt":"`f(x) = x^4 - 2x^3`. What is `f″(x)`?","options":[{"t":"`12x^2 - 6x`","why":"`-6x^2` becomes `-12x`.","_n":"0206","_k":"2cf7ae7a"},{"t":"`12x^2 - 12x`","why":"`f′ = 4x^3 - 6x^2`, then differentiate again.","_n":"11d6","_k":"eac2ccfd"},{"t":"`4x^3 - 6x^2`","why":"That’s the first derivative.","_n":"21e6","_k":"990c2ed0"},{"t":"`12x - 12`","why":"That’s `f‴`.","_n":"3236","_k":"b64b7f2e"}],"hints":["Differentiate, then differentiate again.","`f′ = 4x^3 - 6x^2`.","`f″ = 12x^2 - 12x`."]},{"id":"w2","skill":"Second derivatives","goal":5,"prompt":"`f(x) = 1/x`. What is `f″(x)`?","options":[{"t":"`-2/x^3`","why":"(−1)(−2) = 2.","_n":"4246","_k":"761fbb52"},{"t":"`-1/x^2`","why":"Differentiate once more.","_n":"5216","_k":"63619f22"},{"t":"`1/(2x)`","why":"Write `1/x` as `x^{-1}` first.","_n":"6226","_k":"7ddc2306"},{"t":"`2/x^3`","why":"`f = x^{-1}`, `f′ = -x^{-2}`, `f″ = 2x^{-3}`.","_n":"7176","_k":"f13f0ca4"}],"hints":["Write `f = x^{-1}`.","`f′ = -x^{-2}`.","`f″ = 2x^{-3}`."]},{"id":"w3","skill":"Sign charts","goal":1,"prompt":"Where is `6x - 12` negative?","options":[{"t":"`x \u003c 2`","why":"`6x - 12 \u003c 0` when `x \u003c 2`.","_n":"8186","_k":"c0a9581c"},{"t":"`x \u003c -2`","why":"`6x = 12` at `x = 2`.","_n":"9df3","_k":"40c6a114"},{"t":"`x > 2`","why":"Try `x = 0`: −12.","_n":"ade3","_k":"8b058d1b"},{"t":"`x \u003c 12`","why":"Divide by 6.","_n":"be13","_k":"5ee837cf"}],"hints":["Solve `6x - 12 = 0`.","`x = 2`.","Negative to the left: `x \u003c 2`."]},{"id":"w4","skill":"Sign charts","goal":3,"prompt":"On which intervals is `12(x - 1)(x + 1)` positive?","options":[{"t":"All `x`","why":"It’s 0 at ±1 and negative between.","_n":"ce03","_k":"24b7c6ab"},{"t":"`(1, ∞)` only","why":"Try `x = -2`: `12(-3)(-1) > 0`.","_n":"de33","_k":"70b35317"},{"t":"`(-1, 1)`","why":"At `x = 0`: `12(-1)(1) \u003c 0`.","_n":"ee23","_k":"8bdbc70b"},{"t":"`(-∞, -1)` and `(1, ∞)`","why":"Test 0: negative in the middle.","_n":"fe53","_k":"ebaceacc"}],"hints":["Zeros at ±1.","Test `x = -2`, 0, 2.","+, −, +."]},{"id":"w5","skill":"First derivative test","goal":4,"prompt":"`f′` changes from + to − at `x = 3`. What does `f` have there?","options":[{"t":"A local maximum","why":"Rising, then falling.","_n":"ge43","_k":"96696d90"},{"t":"Nothing","why":"A sign change in `f′` gives an extremum.","_n":"he73","_k":"fe7807a7"},{"t":"A local minimum","why":"+ to − is a peak.","_n":"ie63","_k":"94523033"},{"t":"A point of inflection","why":"That’s about `f″`, not `f′`.","_n":"j6d2","_k":"f2d41cc4"}],"hints":["+ means rising.","Rising, then falling.","A local max."]},{"id":"w6","skill":"First derivative test","goal":4,"prompt":"`f′(x) = 3x^2`. Does `f` have a local extremum at `x = 0`?","options":[{"t":"No: `f′` is positive on both sides","why":"No sign change.","_n":"k6e2","_k":"4222b143"},{"t":"Yes, because `f′(0) = 0`","why":"That makes 0 critical, not an extremum.","_n":"l6f2","_k":"a7f2da60"},{"t":"Yes, a maximum","why":"`f′` is never negative.","_n":"m702","_k":"11a810a4"},{"t":"Yes, a minimum","why":"`f′` must change sign.","_n":"n712","_k":"3af59492"}],"hints":["Test `x = -1` and `x = 1`.","Both give 3.","No sign change: no extremum."]}],"refreshers":{"Second derivatives":"Differentiate the first derivative. Rewrite fractions as powers first: `1/x = x^{-1}`.","Sign charts":"Mark the zeros, test one value in each interval, and write open intervals.","First derivative test":"+ to −: max. − to +: min. No sign change: neither."}}},"explore":{"heading":"Bend detector","intro":"Slide the tangent along the curve. Watch whether the curve sits above or below it, and how the slopes change. Then find where the bending switches.","fns":[{"id":"C1","chip":"`x^3 - 6x^2 + 9x + 1`","f":"x^3 - 6x^2 + 9x + 1","d1":"3x^2 - 12x + 9","d2":"6x - 12","d1x":"3(x - 1)(x - 3)","d2x":"6(x - 2)"},{"id":"C2","chip":"`x^4 - 6x^2`","f":"x^4 - 6x^2","d1":"4x^3 - 12x","d2":"12x^2 - 12","fx":"x^2(x^2 - 6)","d1x":"4x(x^2 - 3)","d2x":"12(x - 1)(x + 1)"},{"id":"C3","chip":"`x^4`","f":"x^4","d1":"4x^3","d2":"12x^2"},{"id":"C4","chip":"`∛x`","f":"∛x","d1":"{1}/{3}x^{-2/3}","d2":"-{2}/{9}x^{-5/3}","d1x":"{1}/{3∛{x^2}}","d2x":"-{2}/{9x∛{x^2}}"},{"id":"C5","chip":"`1/x`","f":"{1}/{x}","d1":"-{1}/{x^2}","d2":"{2}/{x^3}"},{"id":"C6","chip":"`x^3`","f":"x^3","d1":"3x^2","d2":"6x"},{"id":"B","chip":"Build","form":"`x^4 + bx^3 + cx^2`"}],"modes":[{"id":"tan","t":"Tangent"},{"id":"slopes","t":"Slopes"},{"id":"three","t":"Three panels"}],"modeHow":{"tan":"The tangent follows the probe. Solid tint: the curve is above the tangent (∪ concave up). Hatched tint: the curve is below it (∩ concave down).","slopes":"Short tangents every 0.5 units show their slopes. Read them left to right: are they increasing or decreasing? The `f′` panel shows the same slopes as heights.","three":"`f`, `f′` and `f″` share one probe line. Hollow rings mark the candidates: where `f″ = 0` or `f″` doesn’t exist."},"probeHow":"Drag the point on the graph, or use the slider. Arrow keys move the probe by 0.05; Shift + arrow keys move it by 0.5.","buildNote":"`b` and `c` are whole numbers from −20 to 20.","stripCap":"Slopes of `f`: trace the curve to fill in the strip. ∪ means the slopes are increasing; ∩ means they’re decreasing.","rows":{"fx":"`f(x)`","d1":"`f′(x)`","d2":"`f″(x)`","at":"At the probe","vs":"Curve vs tangent","slopes":"Slopes","ivs":"Concavity intervals","pois":"Points of inflection"},"vs":{"up":"above the tangent: concave up","down":"below the tangent: concave down","cross":"crosses the tangent: point of inflection","vert":"the vertical tangent crosses the curve: point of inflection","upBoth":"above the tangent on both sides: concave up","downBoth":"below the tangent on both sides: concave down"},"slopes":{"up":"increasing as `x` increases","down":"decreasing as `x` increases","fmin":"stop decreasing and start increasing: `f′` has a local minimum here","fmax":"stop increasing and start decreasing: `f′` has a local maximum here","steepDown":" (the steepest moment going down)","steepUp":" (the steepest moment going up)","least":" (the least steep moment)","flatPt":" (a flat point of inflection)","flatUp":"momentarily steady, then increasing again","flatDown":"momentarily steady, then decreasing again","undef":"undefined here: the tangent is vertical"},"none":{"zero":"none (`f″ = 0` at {x} but no sign change)","domain":"none ({x} isn’t in the domain)","never":"none (`f″` never changes sign)"},"summaryLabel":"Show the concavity summary","skip":"Skipped `x = 0`: `1/x` isn’t defined there.","markBtn":"Mark point of inflection","clearBtn":"Clear marks","factBtn":"Factored forms","markNote":{"yes":"Marked: the concavity changes here, so this is a point of inflection.","no":"Marked. Check whether the concavity really changes here.","off":"Mark removed.","cleared":"Marks cleared."},"ibTitle":"Interval builder (challenge 2)","ibText":"Build an interval for challenge 2 here. Drag the ends, or Tab to an end and use the arrow keys; O and C set open or closed.","predIntro":"Make a prediction first. Then the bend detector shows you what really happens.","predictions":[{"id":"p1","fn":"C1","prompt":"C1: `f″(2) = 0`. What will the tangent do at `x = 2`?","options":[{"t":"Stay below the curve","_n":"o722","_k":"41271600"},{"t":"Stay above the curve","_n":"p732","_k":"0775242a"},{"t":"Cross the curve","_n":"q742","_k":"0aa80617"},{"t":"Be horizontal","_n":"r652","_k":"a28e6641"}],"explain":"Concavity changes at 2, so the curve switches from below the tangent to above it. `f′(2) = -3`, so the tangent isn’t horizontal."},{"id":"p2","fn":"C3","prompt":"C3 `x^4`: `f″(0) = 0`. Is (0, 0) a point of inflection?","options":[{"t":"No: concave up on both sides","_n":"s662","_k":"d9c9828c"},{"t":"Yes, and also a maximum","_n":"t732","_k":"9424536e"},{"t":"Yes","_n":"u722","_k":"4e6ab416"},{"t":"Can’t tell from a graph","_n":"v712","_k":"51a97d0a"}],"explain":"`f″ = 12x^2 >= 0`: no sign change, no inflection."},{"id":"p3","fn":"C4","prompt":"C4 `∛x`: `f″(0)` doesn’t exist. Is (0, 0) a point of inflection?","options":[{"t":"No: the tangent is vertical","_n":"w702","_k":"1869ec12"},{"t":"Yes: the concavity changes there","_n":"x772","_k":"cf452811"},{"t":"No: `f″` must be 0","_n":"y762","_k":"dca73df6"},{"t":"No: `f′` doesn’t exist","_n":"z752","_k":"5af1b9d2"}],"explain":"`f″ = -{2}/{9x^{5/3}}` is + for `x \u003c 0` and − for `x > 0`, and (0, 0) is on the graph."},{"id":"p4","fn":"C5","prompt":"C5 `1/x`: it’s concave down on `(-∞, 0)` and up on `(0, ∞)`. Is there a point of inflection at `x = 0`?","options":[{"t":"Yes, at (0, 0)","_n":"10742","_k":"a4b5effa"},{"t":"Yes, at the asymptote","_n":"116b2","_k":"1e2ba5f2"},{"t":"Yes, because `f″` changes sign","_n":"126a2","_k":"46cb72b6"},{"t":"No: 0 isn’t in the domain","_n":"13713","_k":"0611fbe0"}],"explain":"A point of inflection has to be a point of the graph."}],"chalIntro":"Use the bend detector to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"On C2, move the probe to each point of inflection and press \u003cstrong>Mark point of inflection\u003c/strong>.","why":"`f″ = 12(x - 1)(x + 1)` changes sign at −1 and at 1: the points of inflection are (−1, −5) and (1, −5).","hints":["Use Three panels: where does `f″` change sign?","`f″ = 12(x - 1)(x + 1)`.","`x = -1` and `x = 1`: (−1, −5) and (1, −5)."],"msgs":{"fn":"Choose C2 first, then mark its points of inflection.","none":"Move the probe to a point of inflection and press Mark point of inflection.","zero":"At `x = 0` the curve is concave down on both sides (`f″(0) = -12`): that’s a local max, not an inflection.","mins":"Those are the local minimums (`f′ = 0`).","other":"The concavity doesn’t change at {x}: `f″` has the same sign on both sides. Clear that mark.","one":"One more: C2 has two points of inflection."}},{"id":"tc2","goal":[1,2],"prompt":"For C1, build the interval where `f` is \u003cstrong>concave up and decreasing\u003c/strong> (use the interval builder below the graph).","why":"Decreasing on (1, 3), where `f′ = 3(x - 1)(x - 3) \u003c 0`; concave up on (2, ∞). Both: (2, 3).","hints":["Decreasing: where `f′ = 3(x - 1)(x - 3) \u003c 0`.","Decreasing on (1, 3); concave up where `6x - 12 > 0`, on (2, ∞).","Both: (2, 3)."],"msgs":{"dec":"That’s all of the decreasing part; it’s concave down on (1, 2).","up":"That’s all of the concave-up part; `f` increases after 3.","closed":"Use open intervals for concavity and for increasing and decreasing.","general":"Find where `f′ \u003c 0` (decreasing) and where `f″ > 0` (concave up), then keep only the part where both are true."}},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Build mode: choose `b` and `c` (sliders −20 to 20, step 1) so that `f(x) = x^4 + bx^3 + cx^2` has points of inflection at `x = 1` and `x = 3`.","why":"`f″ = 12x^2 + 6bx + 2c` must equal `12(x - 1)(x - 3) = 12x^2 - 48x + 36`: `6b = -48` and `2c = 36`, so `b = -8`, `c = 18`.","hints":["Differentiate twice: `f″ = 12x^2 + 6bx + 2c`.","It must equal `12(x - 1)(x - 3) = 12x^2 - 48x + 36`.","`6b = -48` and `2c = 36`: `b = -8`, `c = 18`."],"msgs":{"fn":"Choose Build first, then set `b` and `c` with the sliders.","quad":"You matched `x^2 - 4x + 3`, but `f″ = 12x^2 + 6bx + 2c`. Match `12(x - 1)(x - 3)` instead.","sign":"Inflections at −1 and −3: check the sign of `b`.","one3":"`f″(3)` must also be 0.","one1":"`f″(1)` must also be 0.","other":"Your `f″` has value {v1} at `x = 1` and {v3} at `x = 3`. Both must be 0."}}]},"part3":{"slug":"second-test","name":"2nd derivative test","heading":"The second derivative test","intro":"Concavity gives a second way to classify critical points. A cup shape at a stationary point must be a valley, and a cap must be a peak. Try it, watch it fail when `f″ = 0`, then use it on rational functions and growth. Then try the quick check.","radioAria":"Cup or cap","st1":{"title":"Station 1: Cups and caps","text":"`f(x) = x^3 - 3x^2`, with `f′(x) = 3x(x - 2)` and `f″(x) = 6x - 6`. The critical numbers are 0 and 2. For each one, choose cup or cap from the sign of `f″`, then press \u003cstrong>Reveal\u003c/strong>.","choices":[{"id":"cup","t":"Cup ∪ (local min)"},{"id":"cap","t":"Cap ∩ (local max)"}],"pts":[{"x":0,"y":0,"d2":-6,"_a":"QFpQQhQ=","label":"`x = 0`","right":"`f″(0) = -6 \u003c 0`: a cap, so a local max at (0, 0).","wrong":"`f″(0) = -6 \u003c 0`: concave down, a cap. It’s a local max at (0, 0)."},{"x":2,"y":-4,"d2":6,"_a":"QFpEQhQ=","label":"`x = 2`","right":"`f″(2) = 6 > 0`: a cup, so a local min at (2, −4).","wrong":"`f″(2) = 6 > 0`: concave up, a cup. It’s a local min at (2, −4)."}],"alg":["`f′(x) = 3x(x - 2)` is + on `(-∞, 0)`, − on `(0, 2)` and + on `(2, ∞)`.","At 0, `f′` changes from + to −: a local max at (0, 0).","At 2, `f′` changes from − to +: a local min at (2, −4).","The first derivative test gives the same answers as the cups and caps."]},"st2":{"title":"Station 2: When the test is silent","text":"Each card has `f′(0) = 0` and `f″(0) = 0`, so the second derivative test can’t decide. Predict what each function has at `x = 0`, then press \u003cstrong>Reveal\u003c/strong>.","choices":[{"id":"min","t":"Local min"},{"id":"max","t":"Local max"},{"id":"neither","t":"Neither"}],"cards":[{"id":"a","f":"`f(x) = x^4`","plain":"y = x⁴","_a":"QFRYXBQ=","reveal":"`f′ = 4x^3`: − then +, so a local min at (0, 0)."},{"id":"b","f":"`f(x) = -x^4`","plain":"y = −x⁴","_a":"QFRQShQ=","reveal":"`f′ = -4x^3`: + then −, so a local max at (0, 0)."},{"id":"c","f":"`f(x) = x^3`","plain":"y = x³","_a":"QFdUW0IMVBBA","reveal":"`f′ = 3x^2`: + on both sides, so neither. (0, 0) is a point of inflection."}],"done":"`f″(c) = 0` gives no conclusion. Use the first derivative test.","right":"✓ Correct.","wrong":"✗ Not quite."},"st3":{"title":"Station 3: Rational functions and steepest moments","textA":"`f(x) = x + 1/x`. Step through the second derivative test.","steps":["`f′(x) = 1 - 1/x^2 = 0` when `x^2 = 1`: critical numbers −1 and 1.","`f″(x) = 2/x^3`.","`f″(1) = 2 > 0`: concave up, so a local min at (1, 2).","`f″(-1) = -2 \u003c 0`: concave down, so a local max at (−1, −2).","Concave down on `(-∞, 0)` and up on `(0, ∞)`. The concavity changes at 0, but 0 isn’t in the domain: no point of inflection."],"textB":"A growth curve: `N(t) = -t^3 + 9t^2 + 3t`. Move the time slider to the moment of \u003cstrong>fastest growth\u003c/strong>, then press \u003cstrong>Check\u003c/strong>.","fast":"Right. `N″ = -6t + 18 = 0` at `t = 3`, changing from + to −, so `N′(3) = 30` is the maximum of `N′`. Fastest growth is the maximum of `f′`, which is a point of inflection of `f`.","biggest":"At `t = 6`, `N` is largest on this window, but it’s growing at only `N′(6) = 3`. Fastest growth is the maximum of `f′`, which is a point of inflection of `f`.","other":"Here `N′` = {v}. Look at the `N′` panel: where is it highest?","alg":["`N′(t) = -3t^2 + 18t + 3`","`N″(t) = -6t + 18`, which is 0 at `t = 3`, + before and − after.","So `N′` rises, then falls: its maximum is `N′(3) = -27 + 54 + 3 = 30`.","The point of inflection (3, 63) of `N` is the moment of fastest growth."]},"quickCheck":{"title":"Quick check","summary":"Second derivative test quick check","items":[{"id":"q1","goal":4,"prompt":"`f′(1) = 0` and `f″(1) = -4`. At `x = 1`, `f` has…","choices":[{"t":"a local max","fb":"Right. `f″ \u003c 0`: concave down, a cap.","_n":"14723","_k":"3ec75188"},{"t":"a local min","fb":"`f″ \u003c 0`: concave down, a cap.","_n":"156f3","_k":"3d8a838d"},{"t":"no conclusion","fb":"`f″ \u003c 0`: concave down, a cap.","_n":"16703","_k":"7cee75df"},{"t":"a point of inflection","fb":"`f″ \u003c 0`: concave down, a cap.","_n":"17753","_k":"f9c49b5b"}]},{"id":"q2","goal":4,"prompt":"`f′(0) = 0` and `f″(0) = 0`. The second derivative test says…","choices":[{"t":"a local min","fb":"Use the first derivative test instead.","_n":"18763","_k":"d5f9c473"},{"t":"a local max","fb":"Use the first derivative test instead.","_n":"19733","_k":"7a5d0467"},{"t":"nothing","fb":"Right. Use the first derivative test instead.","_n":"1a743","_k":"b41cf377"},{"t":"a point of inflection","fb":"Use the first derivative test instead.","_n":"1b693","_k":"6c7d8f11"}]},{"id":"q3","goal":1,"prompt":"`f″(x) = 6(x + 2)`. Where is `f` concave up?","choices":[{"t":"everywhere","fb":"`6(x + 2) > 0` when `x > -2`.","_n":"1c6a3","_k":"145b0634"},{"t":"`(2, ∞)`","fb":"`6(x + 2) > 0` when `x > -2`.","_n":"1d773","_k":"3ec6230e"},{"t":"`(-2, ∞)`","fb":"Right. `6(x + 2) > 0` when `x > -2`.","_n":"1e763","_k":"96994ff9"},{"t":"`(-∞, -2)`","fb":"`6(x + 2) > 0` when `x > -2`.","_n":"1f793","_k":"f7badd5e"}]},{"id":"q4","goal":6,"prompt":"A population model has `P″ = 0` at `t = 5`, with `P″` changing from + to −. What happens at `t = 5`?","choices":[{"t":"It grows fastest","fb":"Right. `P′` is largest where `P″` changes from + to −.","_n":"1g783","_k":"0fa4f9d9"},{"t":"It grows slowest","fb":"`P′` is largest where `P″` changes from + to −.","_n":"1h733","_k":"dbf68fe6"},{"t":"It is largest","fb":"`P′` is largest where `P″` changes from + to −.","_n":"1i723","_k":"97b1535e"},{"t":"It stops growing","fb":"`P′` is largest where `P″` changes from + to −.","_n":"1j753","_k":"a8a61b46"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Inflection or not?","summary":"Inflection or not?","noun":"function","goal":[3,5],"instruction":"Decide whether each function has a point of inflection at the given `x`-value.","boxes":[{"id":"yes","label":"Point of inflection here"},{"id":"no","label":"No point of inflection here"}],"items":[{"id":"i1","goal":3,"t":"`f(x) = x^3 - 3x`, at `x = 0`","_a":"QEBUQRQ=","why":"`f″ = 6x` changes sign at 0.","wrong":{"no":"`f″ = 6x` changes sign at 0."}},{"id":"i2","goal":3,"t":"`f(x) = x^4 + x`, at `x = 0`","_a":"QFdeEA==","why":"`f″ = 12x^2` doesn’t change sign.","wrong":{"yes":"`f″ = 12x^2` doesn’t change sign."}},{"id":"i3","goal":5,"t":"`f(x) = x^{5/3}`, at `x = 0`","_a":"QEBUQRQ=","why":"`f″ = {10}/{9}x^{-1/3}` changes sign; `f″(0)` doesn’t exist.","wrong":{"no":"`f″ = {10}/{9}x^{-1/3}` changes sign; `f″(0)` doesn’t exist."},"hints":["Find `f′` and `f″`.","`f″ = {10}/{9}x^{-1/3}`, undefined at 0.","Negative for `x \u003c 0`, positive for `x > 0`: concavity changes at (0, 0)."]},{"id":"i4","goal":5,"t":"`f(x) = (x - 2)^{2/3}`, at `x = 2`","_a":"QFdeEA==","why":"`f″ = -{2}/{9}(x - 2)^{-4/3} \u003c 0` on both sides: a cusp, concave down on both sides.","wrong":{"yes":"`f″ = -{2}/{9}(x - 2)^{-4/3} \u003c 0` on both sides: a cusp, concave down on both sides."}},{"id":"i5","goal":[3,5],"t":"`f(x) = 1/(x - 1)`, at `x = 1`","_a":"QFdeEA==","why":"`x = 1` isn’t in the domain.","wrong":{"yes":"`x = 1` isn’t in the domain."}},{"id":"i6","goal":3,"t":"`f(x) = x^5`, at `x = 0`","_a":"QEBUQRQ=","why":"`f″ = 20x^3` changes sign.","wrong":{"no":"`f″ = 20x^3` changes sign."}},{"id":"i7","goal":3,"t":"`f(x) = x^4 - 4x^3`, at `x = 0`","_a":"QEBUQRQ=","why":"`f″ = 12x(x - 2)` changes sign at 0 (a flat point of inflection).","wrong":{"no":"`f″ = 12x(x - 2)` changes sign at 0 (a flat point of inflection)."}},{"id":"i8","goal":3,"t":"`f(x) = x^4 - 4x^3`, at `x = 2`","_a":"QEBUQRQ=","why":"`f″` changes sign at 2 as well.","wrong":{"no":"`f″` changes sign at 2 as well."}},{"id":"i9","goal":3,"t":"`f″(x) = (x - 1)^2`, at `x = 1`","_a":"QFdeEA==","why":"A square doesn’t change sign.","wrong":{"yes":"A square doesn’t change sign."}},{"id":"i10","goal":3,"t":"`f″(x) = x(x + 2)^2`, at `x = -2`","_a":"QFdeEA==","why":"`(x + 2)^2` doesn’t change sign, and `x \u003c 0` on both sides of −2.","wrong":{"yes":"`(x + 2)^2` doesn’t change sign, and `x \u003c 0` on both sides of −2."},"hints":["What sign is `x(x + 2)^2` just left and just right of −2?","`x` is negative and `(x + 2)^2` positive on both sides.","Negative on both sides: no change."]}],"wrongDefault":"Check whether `f″` changes sign there, and whether the point is on the graph."},{"id":"bend","type":"custom","title":"Bend it","summary":"Bend it","star":true,"goal":[1,2,3,4,5],"instruction":"Find intervals of concavity, points of inflection and missing coefficients. Items 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Build intervals on the number lines (drag the ends, or Tab to an end and use the arrow keys; O and C set open or closed). Type numbers or fractions such as 1/4 in the boxes, then press Check.","msgs":{"empty":"Fill in every answer first.","num":"Type a number or a fraction, such as −2 or 1/4, in each box.","ivEnds":"Check your interval: where does `f″` change sign?","closed":"Use open intervals for concavity.","inf":"Infinity always takes a round bracket.","pts":"Check your points: where does `f″` change sign, and what is `f` there?","onePt":"One point is right. Find the other one."},"items":[{"id":"s1","goal":1,"prompt":"Intervals of concavity and the point of inflection of `f(x) = x^3 + 3x^2 - 9x`.","fields":[{"k":"down","kind":"iv","label":"Concave down on","min":-5,"max":5},{"k":"up","kind":"iv","label":"Concave up on","min":-5,"max":5},{"k":"p","kind":"pts","n":1,"label":"Point of inflection"}],"_a":"GRtVXUEKE1g5V0ReWkgcUz8VE0dGRgs5TwgdXEMIXT9OG0EQDD9qT1MVAANrOUw=","display":"concave down on `(-∞, -1)`, up on `(-1, ∞)`; point of inflection (−1, 11)","wrong":[{"k":"p","pts":[[-1,0]],"fb":"The point’s `y`-value is `f(-1)`, not `f″(-1)`."}],"why":"`f″ = 6x + 6` is negative for `x \u003c -1` and positive for `x > -1`, and `f(-1) = -1 + 3 + 9 = 11`."},{"id":"s2","goal":3,"prompt":"Points of inflection of `f(x) = x^4 - 4x^3 + 10`.","fields":[{"k":"p","kind":"pts","n":2,"label":"Points of inflection"}],"_a":"GRtBEAw/alJOCAFvGj8DTk8PbG9L","display":"(0, 10) and (2, −6)","wrong":[{"k":"p","only":[[2,-6]],"fb":"`f″ = 12x(x - 2)` changes sign at 0 too."}],"why":"`f″ = 12x^2 - 24x = 12x(x - 2)` changes sign at 0 and at 2; `f(0) = 10` and `f(2) = -6`."},{"id":"s3","goal":3,"star":true,"prompt":"`f(x) = ax^3 + bx^2` has a point of inflection at (1, 4). Find `a` and `b`.","fields":[{"k":"a","kind":"num","label":"`a =`"},{"k":"b","kind":"num","label":"`b =`"}],"_a":"GRtQEAxJA05AWxMIABk=","display":"`a = -2`, `b = 6`","wrongDefault":"Two conditions: `f″(1) = 6a + 2b = 0` and `f(1) = a + b = 4`.","why":"`f″(1) = 6a + 2b = 0` gives `b = -3a`; `f(1) = a + b = 4` gives `-2a = 4`, so `a = -2` and `b = 6`."},{"id":"s4","goal":[3,5],"star":true,"prompt":"For which values of `k` does `f(x) = x^4 + kx^3 + 6x^2` have \u003cstrong>no\u003c/strong> points of inflection?","fields":[{"k":"k","kind":"iv","label":"Values of `k`","min":-8,"max":8,"v":"k"}],"_a":"GRtaEAw/HFZODR1GRBFUThZLRFdrGQ==","display":"`-4 \u003c= k \u003c= 4`","wrong":[{"k":"k","iv":[-4,4,false,false],"fb":"At `k = ±4`, `f″ = 12(x ± 1)^2` never changes sign: include the endpoints."}],"why":"`f″ = 12x^2 + 6kx + 12` must never change sign, so its discriminant `36k^2 - 576 \u003c= 0`: `k^2 \u003c= 16`.","hints":["`f″ = 12x^2 + 6kx + 12`.","No inflection means `f″` never changes sign: the quadratic can’t have two different roots.","Discriminant `36k^2 - 576 \u003c= 0`: `k^2 \u003c= 16`."]},{"id":"s5","goal":2,"star":true,"prompt":"The graph of `f′` is a parabola opening up with vertex (2, −3). Where does `f` have a point of inflection, and what is its concavity on each side?","fields":[{"k":"x","kind":"num","label":"Point of inflection at `x =`"},{"k":"down","kind":"iv","label":"Concave down on","min":-5,"max":5},{"k":"up","kind":"iv","label":"Concave up on","min":-5,"max":5}],"_a":"GRtJEAxWHUAGVkZcFF5qDBdVXR4EOR1AF0kTCG1WHQwXVV1vSw==","display":"`x = 2`; concave down on `(-∞, 2)`, concave up on `(2, ∞)`","wrong":[{"k":"x","notv":2,"fb":"Inflections of `f` are at the max or min of `f′`, here its vertex. Zeros of `f′` are candidates for max and min. Points of inflection come from `f″`."}],"why":"`f′` decreases until its vertex at 2 and increases after, so `f″ \u003c 0` on `(-∞, 2)` and `f″ > 0` on `(2, ∞)`."},{"id":"s6","goal":5,"star":true,"prompt":"Find the points of inflection of `f(x) = x^2/(x^2 + 3)`.","fields":[{"k":"p","kind":"pts","n":2,"label":"Points of inflection"}],"_a":"GRtBEAw/ak9TFQEcBFFsTjkIHQIYVgQ/P0Q=","display":"(−1, 1/4) and (1, 1/4)","wrong":[{"k":"p","has":[0,0],"fb":"That’s where `f′ = 0` (a minimum). Zeros of `f′` are candidates for max and min. Points of inflection come from `f″`."}],"why":"`f″ = 18(1 - x^2)/(x^2 + 3)^3` changes sign at ±1, where `f = 1/4`.","hints":["Write `f = 1 - 3/(x^2 + 3)`.","`f′ = 6x/(x^2 + 3)^2`.","`f″ = 18(1 - x^2)/(x^2 + 3)^3`: sign changes at ±1, where `f = 1/4`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Wren","how":"","goal":[3,4],"instruction":"Wren made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Find the points of inflection of `f(x) = x^4 - 4x^3 + 6x^2`.","steps":["`f′(x) = 4x^3 - 12x^2 + 12x`.","`f″(x) = 12x^2 - 24x + 12 = 12(x - 1)^2`.","`f″ = 0` at `x = 1`, so there’s a point of inflection at (1, 3)."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"`12(x - 1)^2` is positive on both sides of 1, so the concavity doesn’t change: there is no point of inflection (`f` is concave up everywhere else).","why":"Check for a sign change. `f″ = 12x^2` is 0 at 0, but positive on both sides: no inflection.","_n":"1k743","_k":"d9c747a1"},{"t":"There are inflections at `x = 1` and `x = -1`.","why":"`f″` has only the double zero 1.","_n":"1l6f3","_k":"ef5237a0"},{"t":"Step 3 is correct.","why":"Check for a sign change. `f″ = 12x^2` is 0 at 0, but positive on both sides: no inflection.","_n":"1m6e3","_k":"9d341d1a"},{"t":"The point of inflection is (1, 0).","why":"`f(1) = 3`, but that isn’t the issue.","_n":"1ne53","_k":"89027118"}],"hints":["What sign is `f″` at `x = 0` and at `x = 2`?","12 and 12.","No sign change: no point of inflection."]},{"id":"e2","goal":4,"task":"Use the second derivative test on `f(x) = 2x^3 - 3x^2 - 12x`.","steps":["`f′ = 6x^2 - 6x - 12 = 6(x - 2)(x + 1)`.","Critical numbers: 2 and −1. `f″ = 12x - 6`.","`f″(2) = 18 > 0`, so there’s a local max at (2, −20).","`f″(-1) = -18 \u003c 0`, so there’s a local min at (−1, 7)."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 repeats the same reversal."],"fixes":[{"t":"Step 3 is correct.","why":"`f″ > 0` means concave up, a cup shape: that’s a local \u003cstrong>minimum\u003c/strong>.","_n":"1oe63","_k":"99568e82"},{"t":"`f″ > 0` means concave up (a cup), so (2, −20) is a local min; `f″(-1) \u003c 0` makes (−1, 7) a local max.","why":"`f″ > 0` means concave up, a cup shape: that’s a local \u003cstrong>minimum\u003c/strong>.","_n":"1pe73","_k":"3c05bc33"},{"t":"The test fails because `f″(2) != 0`.","why":"The test works when `f″ != 0`.","_n":"1qe83","_k":"a1983416"},{"t":"`f″(2) = 18` means the max value is 18.","why":"`f″` gives the shape, not the value.","_n":"1re13","_k":"ac8b3c70"}],"hints":["What shape does `f″ > 0` give?","Concave up: ∪.","The bottom of a ∪ is a minimum."]},{"id":"e3","goal":4,"task":"Classify the critical point of `f(x) = (x - 1)^4 + 2`.","steps":["`f′(x) = 4(x - 1)^3`.","The critical number is `x = 1`.","`f″(x) = 12(x - 1)^2`, so `f″(1) = 0`.","`f″(1) = 0`, so (1, 2) is a point of inflection."],"_a":"UQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"`f″(1) = 0` means the second derivative test gives no conclusion. `f′` changes from − to + at 1, so (1, 2) is a local minimum; `f″ >= 0` on both sides, so it’s not a point of inflection.","why":"Check for a sign change. `f″ = 12x^2` is 0 at 0, but positive on both sides: no inflection.","_n":"1se23","_k":"d72917b5"},{"t":"(1, 2) is a local maximum.","why":"`f′` goes from − to +.","_n":"1te33","_k":"ac4d20d8"},{"t":"There’s no critical point.","why":"`f′(1) = 0`.","_n":"1ue43","_k":"a07a20ae"},{"t":"Step 4 is correct.","why":"Check for a sign change. `f″ = 12x^2` is 0 at 0, but positive on both sides: no inflection.","_n":"1ved3","_k":"f26e7a91"}],"hints":["What does the test say when `f″(c) = 0`?","Nothing. Use the first derivative test.","− then +: a local min."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the bend detector: the tangent crossing the curve, `x^4` with no inflection, or `∛x` having one?"},{"id":"j2","q":"In your own words, how are ‘concave up’, ‘slopes increasing’ and ‘`f″ > 0`’ the same idea?"},{"id":"j3","q":"Explain to a friend how to check whether a point where `f″ = 0` is really a point of inflection."},{"id":"j4","q":"When would you choose the first derivative test over the second? What are you still unsure about?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"On which interval ":"64e2c237"}]},"b":{"prompt":"What are the points of inflection of `f(x) = x^4 - 24x^2 + 3`?","options":[{"t":"(0, 3) only","why":"That’s where `f′ = 0` (a local max). Zeros of `f′` are candidates for max and min. Points of inflection come from `f″`.","_n":"286a1","_k":"3921f48c"},{"t":"(−2, 0) and (2, 0)","why":"The `y`-value is `f(±2)`, not `f″(±2)`.","_n":"29671","_k":"47b1d617"},{"t":"(−2, −77) and (2, −77)","why":"`f″ = 12(x - 2)(x + 2)`.","_n":"2a681","_k":"8e2b7153"},{"t":"(−2√3, −141) and (2√3, −141)","why":"Those are the local minimums. Zeros of `f′` are candidates for max and min. Points of inflection come from `f″`.","_n":"2b651","_k":"234e4d66"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"`f′(4) = 0` and `f″(4) = -3`. What does `f` have at `x = 4`?","options":[{"t":"A local maximum","why":"Concave down at a stationary point: a cap.","_n":"2c661","_k":"ad64ba2f"},{"t":"A local minimum","why":"`f″ \u003c 0` means concave down, a cap shape: that’s a local \u003cstrong>maximum\u003c/strong>.","_n":"2d631","_k":"d774cd2e"},{"t":"A point of inflection","why":"`f″(4) != 0` and the concavity doesn’t change there.","_n":"2e641","_k":"0c4f8f28"},{"t":"No conclusion is possible","why":"The test is silent only when `f″(c) = 0`.","_n":"2f711","_k":"e62434e5"}]},"b":{"prompt":"`f′(-1) = 0` and `f″(-1) = 5`. What does `f` have at `x = -1`?","options":[{"t":"A point of inflection","why":"`f″(-1) != 0` and the concavity doesn’t change there.","_n":"2g721","_k":"6a21a5d3"},{"t":"A local minimum","why":"Concave up at a stationary point: a cup.","_n":"2hef1","_k":"a21bd4dd"},{"t":"A local maximum","why":"`f″ > 0` means concave up, a cup shape: that’s a local \u003cstrong>minimum\u003c/strong>.","_n":"2iee1","_k":"abeacdb8"},{"t":"No conclusion is possible","why":"The test is silent only when `f″(c) = 0`.","_n":"2jf11","_k":"f0a2f9d2"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"Which is a point of inflection of `f(x) = x^{5/3} - 5x^{2/3}`?","options":[{"t":"(−1, −6) and (0, 0)","why":"Undefined isn’t enough: the sign must change.","_n":"2kf01","_k":"81f0b266"},{"t":"(2, −3∛4), where `f′ = 0`","why":"Zeros of `f′` are candidates for max and min. Points of inflection come from `f″`.","_n":"2lf31","_k":"b7706036"},{"t":"(−1, −6) only","why":"`f″ = {10}/{9}x^{-4/3}(x + 1)`: it changes sign at −1. At 0 it’s undefined but positive on both sides.","_n":"2mf21","_k":"2760e42d"},{"t":"(0, 0) only, where `f″` doesn’t exist","why":"`f″ > 0` on both sides of 0: no change.","_n":"2nf51","_k":"07c4d99a"}]},"b":{"prompt":"Which is a point of inflection of `f(x) = x^{5/3} + 5x^{2/3}`?","options":[{"t":"(0, 0) only, where `f″` doesn’t exist","why":"`f″ \u003c 0` on both sides of 0: no change.","_n":"2of41","_k":"92309976"},{"t":"(−2, 3∛4), where `f′ = 0`","why":"Zeros of `f′` are candidates for max and min. Points of inflection come from `f″`.","_n":"2pe71","_k":"c9fe269f"},{"t":"(1, 6) only","why":"`f″ = {10}/{9}x^{-4/3}(x - 1)`.","_n":"2qe61","_k":"b3d0cde0"},{"t":"(1, 6) and (0, 0)","why":"Undefined isn’t enough: the sign must change.","_n":"2r8c8","_k":"8bed10bd"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"`f′(x) = x^2 - 4x`. Which statement about `f` is true?","options":[{"t":"`f` is concave down on `(-∞, 2)` and up on `(2, ∞)`, with a point of inflection at `x = 2`","why":"`f″ = 2x - 4`.","_n":"2s8b8","_k":"5d2c6d62"},{"t":"`f` is concave down on `(0, 4)`","why":"That’s where `f` decreases. Concavity is about the \u003cstrong>slope\u003c/strong> changing. A graph can rise while bending down.","_n":"2t8a8","_k":"ab9744e9"},{"t":"`f` is concave up on `(-∞, 0)` and `(4, ∞)`","why":"That’s where `f′ > 0`, so `f` increases. Concavity is about the \u003cstrong>slope\u003c/strong> changing. A graph can rise while bending down.","_n":"2u898","_k":"10e174a8"},{"t":"`f` has points of inflection at `x = 0` and `x = 4`","why":"Those are the zeros of `f′`: the max and min of `f`. Zeros of `f′` are candidates for max and min. Points of inflectio ^3 = 27`; `f″ = 2 + 108/x^3`.","_n":"350a8","_k":"21aaf740"},{"t":"It has a local min at (3, 27) and a point of inflection at `x = 0`","why":"0 isn’t in the domain.","_n":"360b8","_k":"2ff26e6b"},{"t":"It has a local max at (3, 27), since `f″(3) = 6`","why":"`f″ > 0` means concave up, a cup shape: that’s a local \u003cstrong>minimum\u003c/strong>.","_n":"370c8","_k":"91652ac3"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best description of what ‘concave down on an interval’ means?","options":[{"t":"“The curve has a maximum on the interval.”","why":"`y = √x` is concave down and has no maximum.","_n":"380d8","_k":"46a61ac3"},{"t":"“`f″ = 0` on the interval.”","why":"`f″ \u003c 0` on the interval.","_n":"390e8","_k":"365b4f9b"},{"t":"“The function is decreasing on the interval.”","why":"Concavity is about the \u003cstrong>slope\u003c/strong> changing. A graph can rise while bending down.","_n":"3a0f8","_k":"4898a1f0"},{"t":"“As `x` increases, the slopes of the tangents decrease, so `f′` is decreasing and the curve lies below its tangent lines.”","why":"Concave down is about the slopes decreasing: `f′` decreasing, `f″ \u003c 0`.","_n":"3b988","_k":"3dd56295"}]},"b":{"prompt":"Which is the best description of what ‘concave up on an interval’ means?","options":[{"t":"“`f′ > 0` on the interval.”","why":"That’s increasing. Concavity is about the \u003cstrong>slope\u003c/strong> changing. A graph can rise while bending down.","_n":"3c978","_k":"8c860a58"},{"t":"“As `x` increases, the slopes of the tangents increase, so `f′` is increasing and the curve lies above its tangent lines.”","why":"Concave up is about the slopes increasing: `f′` increasing, `f″ > 0`.","_n":"3d9a8","_k":"08c4d78e"},{"t":"“The function is increasing on the interval.”","why":"Concavity is about the \u003cstrong>slope\u003c/strong> changing. A graph can rise while bending down.","_n":"3e998","_k":"0909b20c"},{"t":"“The curve has a minimum on the interval.”","why":"`y = 1/x` for `x > 0` is concave up and has no minimum.","_n":"3f9c8","_k":"76769115"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which statement correctly justifies that (0, 0) is a point of inflection of `f(x) = x^5 + x`?","options":[{"t":"“`f″(x) = 20x^3` changes from negative to positive at `x = 0`, and (0, 0) is on the graph, so the concavity changes at that point.”","why":"A sign change of `f″` at a point on the graph.","_n":"3g9b8","_k":"f3f78926"},{"t":"“`f` changes from decreasing to increasing at 0.”","why":"`f′ = 5x^4 + 1 > 0`: always increasing. Concavity is about the \u003cstrong>slope\u003c/strong> changing. A graph can rise while bending down.","_n":"3h9e8","_k":"d1e9e929"},{"t":"“`f′(0) = 0`, so it’s a flat point of inflection.”","why":"`f′(0) = 1`.","_n":"3i9d8","_k":"99f661a5"},{"t":"“`f″(0) = 0`, so (0, 0) is a point of inflection.”","why":"Check for a sign change. `f″ = 12x^2` is 0 at 0, but positive on both sides: no inflection.","_n":"3j908","_k":"62c6d942"}]},"b":{"prompt":"Which statement correctly justifies that (1, −2) is a point of inflection of `f(x) = x^3 - 3x^2`?","options":[{"t":"“`f` changes from increasing to decreasing at 1.”","why":"`f′(1) = -3`: `f` is decreasing on both sides of 1. Concavity is about the \u003cstrong>slope\u003c/strong> changing. A graph can rise while bending down.","_n":"3k8f8","_k":"d425fe22"},{"t":"“`f′(1) = 0`, so it’s a flat point of inflection.”","why":"`f′(1) = -3`.","_n":"3l928","_k":"74442aba"},{"t":"“`f″(1) = 0`, so (1, −2) is a point of inflection.”","why":"Check for a sign change. `f″ = 12x^2` is 0 at 0, but positive on both sides: no inflection.","_n":"3m938","_k":"fc3f1bde"},{"t":"“`f″(x) = 6x - 6` changes from negative to positive at `x = 1`, and (1, −2) is on the graph.”","why":"A sign change of `f″` at a point on the graph.","_n":"3n908","_k":"0f27e9f1"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"`N(t) = -t^3 + 9t^2 + 3t` is the number of people (in hundreds) who have heard a rumour `t` days after it starts, `0 \u003c= t \u003c= 6`. When is the rumour spreading fastest, and how fast?","options":[{"t":"Day 3, at 6300 people per day","why":"`N(3) = 63` hundred is the number who have heard, not the rate.","_n":"3o918","_k":"3cb1c2d2"},{"t":"About day 6.2, when `N′ = 0`","why":"`N′ = 0` is when the spreading stops (the max of `N`), not when it’s fastest.","_n":"3p8e8","_k":"83224342"},{"t":"Day 3, at 30 people per day","why":"`N` is in hundreds: 30 hundred = 3000.","_n":"3q8f8","_k":"8e3e6298"},{"t":"Day 3, at 3000 people per day","why":"`N″ = -6t + 18 = 0` at `t = 3`, changing from + to −; `N′(3) = -27 + 54 + 3 = 30` hundred per day.","_n":"3r8c8","_k":"65b58379"}]},"b":{"prompt":"`N(t) = -t^3 + 12t^2 + 4t` (hundreds of people), `0 \u003c= t \u003c= 8`. When is the rumour spreading fastest, and how fast?","options":[{"t":"Day 4, at 5200 people per day","why":"`N″ = -6t + 24 = 0` at `t = 4`; `N′(4) = -48 + 96 + 4 = 52` hundred per day.","_n":"3s8d8","_k":"59c671fb"},{"t":"About day 8.2, when `N′ = 0`","why":"`N′ = 0` is when the spreading stops (the max of `N`), not when it’s fastest.","_n":"3t9a8","_k":"934386b1"},{"t":"Day 4, at 52 people per day","why":"Hundreds.","_n":"3u9b8","_k":"da452897"},{"t":"Day 4, at 14 400 people per day","why":"`N(4) = 144` hundred.","_n":"3v248","_k":"512472c7"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A town’s population (thousands) `t` years after 2020 is `P(t) = 40 + 6t - t^2/4` for `0 \u003c= t \u003c= 10`. Which describes the population over this decade?","options":[{"t":"It grew by more each year","why":"`P″ \u003c 0`: the growth rate decreases.","_n":"3w238","_k":"0a3b0bbd"},{"t":"It shrank by less each year","why":"`P′ > 0`: it grew.","_n":"3x228","_k":"8bb47fcf"},{"t":"It grew, then shrank","why":"`P′ = 0` only at `t = 12`, after the decade.","_n":"3y218","_k":"7a5ca6d1"},{"t":"It grew every year, but by less each year","why":"`P′ = 6 - t/2 > 0` for `t \u003c 12`; `P″ = -1/2 \u003c 0`.","_n":"3z208","_k":"0229f8bc"}]},"b":{"
