.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 06: lim typesetting (copied from 04 as .ct-lim), piecewise captions, Pencil test, V6 approach table, Repair shop, practice */
/* lim with the approach underneath: the box's baseline is "lim", so it sits on the text baseline */
.ct-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.ct-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.ct-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.ct-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .ct-lim{margin-right:.18em}
.hero-eq .ct-hero .ct-lu{font-size:.5em;font-weight:700;margin-top:.14em}
.opt .m,.chip .m,.fchip .m,.read dd .m,.read dt .m,.tile .m{white-space:normal}
.read dt .ct-lim{font-weight:400}
.opt .ct-lim,.sq-p .ct-lim,.q-prompt .ct-lim,.sbtn .ct-lim,.alg-lines .ct-lim{margin-bottom:.1em}

/* piecewise caption */
.ct-pw{display:inline-flex;align-items:center;vertical-align:middle;gap:.12em}
.ct-br{font:400 2.3em/1 var(--font-math);transform:scaleX(.7);margin-top:-.08em}
.ct-cases{display:flex;flex-direction:column;gap:.08em;font-size:.78em;line-height:1.15}
.ct-case{display:flex;gap:.9em;align-items:baseline;white-space:nowrap}
.ct-cond{font-size:.82em;color:var(--ink-2)}
.ct-at{font:400 .55em var(--font-ui);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.ct-at .m{font-size:1.25em}

/* Pencil test */
.ct-ex .eq-cap{min-height:2.6em;display:flex;flex-wrap:wrap;align-items:center;gap:.1em .3em}
.ct-ex .pg-ctrl > div{margin:0 0 8px}
.ct-ex .pg-ctrl [hidden]{display:none}
.ct-fns{display:flex;flex-wrap:wrap;gap:6px}
.fchip.ct-fc{font:400 .95rem var(--font-ui);padding:.3em .65em;text-align:left}
.fchip.ct-fc .m{font-size:1.12em}
.ct-ex .seg-wrap{margin-top:0}
.ct-sl output{color:var(--ink)}
.ct-shift{margin:0}
.ct-tr{display:flex;flex-wrap:wrap;gap:8px}
.ct-locked .pg-ctrl button,.ct-locked .pg-ctrl input{opacity:.6}
.ct-tview{margin:10px 0 0}
.ct-card{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px 10px;background:var(--sheet)}
.ct-card > summary,.ct-rd > summary{font-weight:700;cursor:pointer;min-height:28px;display:list-item}
.ct-card > summary .m{font-size:1.1em}
.ct-card .ct-v6{margin-top:8px}
.ct-rd > summary{margin:0 0 8px;color:var(--ink-2);font-size:.9rem}
.ct-yes{color:var(--green)}
.ct-no{color:var(--red)}
.ct-yes .m,.ct-no .m{color:var(--ink)}
.ct-yes > span[aria-hidden],.ct-no > span[aria-hidden]{font-weight:700}

/* V6 approach table */
.ct-v6{margin:0}
.ct-v6g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.ct-v6s{min-width:0;border:1.5px solid var(--rule);border-radius:8px;overflow:auto}
table.ct-v6t{width:100%;border-collapse:collapse;font-family:var(--font-math);font-size:1.05rem}
table.ct-v6t th,table.ct-v6t td{padding:5px 10px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.ct-v6t th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.ct-v6t th .m{font-size:1.15em;color:var(--ink)}
table.ct-v6t tr:last-child td{border-bottom:0}
.ct-v6h{font-weight:700}
.ct-v6at{margin:10px 0 0;font-size:1rem}
.ct-v6n{margin:6px 0 0}

/* Repair shop */
.ct-st .seg-wrap,.ct-c3 .seg-wrap{margin:0 0 10px}
.ct-st .seg button{min-width:52px}
.ct-stg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.ct-stg > *{min-width:0}
.ct-cap{min-height:2.4em;display:flex;flex-wrap:wrap;align-items:center;gap:.1em .3em;font-size:clamp(1.4rem,3.6vw,2rem)}
.ct-mh{margin:0 0 8px}
.ct-menu{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ct-rc .fb{margin-top:0}
.ct-val{font:400 1.3rem var(--font-math);margin:10px 0 4px}
.ct-badges{min-height:1.8em;margin-top:6px}
.ct-badge{display:inline-block;border:2px solid var(--ink);background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:.1em .7em;font-weight:700;font-size:.92rem}
.ct-badge.ok{background:var(--good-bg);border-color:var(--green);color:var(--ink)}
.ct-s4r{margin:8px 0}
.ct-goals{margin:8px 0 0}
.ct-alg{margin-top:12px}
.ct-alg .alg-lines{font-size:1.02rem}
.ct-rfb .fb{margin-top:10px}

/* Practice: repair the constants */
.ct-bxs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0 4px}
.ct-bxs label{display:flex;align-items:center;gap:8px;font:400 1.15rem var(--font-math)}

@media (max-width:820px){
  .ct-ex.pg{grid-template-areas:"graph" "read" "ctrl"}
  .ct-stg{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .ct-v6g{grid-template-columns:minmax(0,1fr);gap:8px}
  .ct-ex .eq-cap{font-size:1.4rem}
  .ct-case{gap:.6em}
  .fchip.ct-fc{font-size:.9rem}
}

inuous. But there’s no single tangent at the corner, so it isn’t smooth."}],"challenges":[{"id":"tc1","goal":1,"prompt":"Find the function whose limit at `a` exists and whose value `f(a)` exists, but which is still discontinuous at `a`.","why":"`g` has a hole at (2, 4) and a separate dot at (2, 1): rows 1 and 2 pass, and row 3 fails because 4 ≠ 1.","hints":["You need rows 1 and 2 to pass and row 3 to fail.","Look for a hole with a separate dot.","`g`: hole at (2, 4), dot at (2, 1)."]},{"id":"tc2","goal":4,"prompt":"\u003cstrong>Builder:\u003c/strong> `f(x) = x^2 + c` for `x \u003c 1`, and `3x - 1` for `x ≥ 1`. Set `c` so that `f` is continuous at `x = 1`. \u003cspan class=\"tiny muted\">(Choose Builder, then Two pieces.)\u003c/span>","why":"With `c = 1`, the left limit is 1 + `c` = 2 = `f(1)`.","hints":["Make the two pieces meet at `x = 1`.","Left: `1^2 + c`. Right: `3(1) - 1 = 2`.","`1 + c = 2`, so `c = 1`."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>Builder:\u003c/strong> `f(x) = x + a` for `x \u003c 1`; `bx^2` for `1 ≤ x \u003c 2`; `2x + 4` for `x ≥ 2`. Set `a` and `b` so that `f` is continuous everywhere. \u003cspan class=\"tiny muted\">(Choose Builder, then Three pieces.)\u003c/span>","why":"At `x = 2`: `4b = 8`, so `b = 2`. At `x = 1`: `1 + a = b`, so `a = 1`.","hints":["There are two joins. Start with the one that has only one unknown.","At `x = 2`: `b(2)^2 = 2(2) + 4`, so `4b = 8` and `b = 2`.","At `x = 1`: `1 + a = b(1)^2 = 2`, so `a = 1`."]}]},"part3":{"slug":"repair","name":"Repair shop","heading":"Make it continuous","intro":"Four broken graphs, with each break glowing. At each station, choose a repair from the menu, set it, then press \u003cstrong>Retrace\u003c/strong> to see whether the pencil gets through. Some breaks can’t be repaired, and the last station asks for more than continuity.","quickCheck":{"title":"Quick check","summary":"Repair shop quick check","items":[{"id":"q1","goal":[2,4],"prompt":"`f(x) = {x^2 - 1}/{x - 1}`. How checks; the corner means no single tangent.","_n":"1i27d","_k":"12a7cb99"},{"t":"Smooth but not continuous","fb":"It passes the three checks; the corner means no single tangent.","_n":"1j28d","_k":"bde7c7ee"}]}]}},"practice":{"activities":[{"id":"classify","type":"sorter","title":"Classify the point","summary":"Classify the point","noun":"function","goal":[1,2,3,5],"instruction":"Decide what happens at the given point: is the function continuous there, or which kind of discontinuity is it?","boxes":[{"id":"b1","label":"Continuous"},{"id":"b2","label":"Removable"},{"id":"b3","label":"Jump"},{"id":"b4","label":"Infinite"}],"wrongDefault":"Check the three conditions in order. Try another box.","items":[{"id":"i1","goal":[2,3],"t":"`{x^2 - 9}/{x + 3}` at `x = -3`","_a":"FFJXEg==","why":"`x + 3` cancels, leaving `x - 3`: a hole at (−3, −6).","wrong":{"b1":"−3 makes the denominator 0, so `f(-3)` isn’t defined."}},{"id":"i2","goal":[2,3],"t":"`{x + 1}/{x - 2}` at `x = 2`","_a":"FFJREg==","why":"The denominator is 0 at `x = 2` and no factor cancels: a vertical asymptote."},{"id":"i3","goal":[1,5],"t":"`|x + 4|` at `x = -4`","_a":"FFJUEg==","why":"`f(-4) = 0`, and both sides approach 0. It has a corner, but the pencil doesn’t lift."},{"id":"i4","goal":[1,5],"t":"`x^2` for `x \u003c 1`; `2 - x` for `x ≥ 1`, at `x = 1`","_a":"FFJUEg==","why":"Both pieces give 1 at `x = 1`: continuous, with a corner.","wrong":{"b3":"Both pieces give 1 at `x = 1`. The corner doesn’t break the graph."}},{"id":"i5","goal":2,"t":"`x + 3` for `x \u003c 0`; `x^2 + 1` for `x ≥ 0`, at `x = 0`","_a":"FFJWEg==","why":"Left → 3, right → 1: finite but different."},{"id":"i6","goal":2,"t":"`x/|x|` at `x = 0`","_a":"FFJWEg==","why":"Left → −1, right → 1: two different one-sided limits.","wrong":{"b2":"Left → −1, right → 1: the sides disagree."},"hints":["For `x > 0`, `|x| = x`; for `x \u003c 0`, `|x| = -x`.","So `x/|x|` is 1 on the right and −1 on the left.","Two different one-sided limits: a jump."]},{"id":"i7","goal":[2,3],"t":"`{x - 1}/{x^2 - 1}` at `x = 1`","_a":"FFJXEg==","why":"`x - 1` cancels: `{1}/{x + 1}` for `x ≠ 1`, so there’s a hole at (1, 1/2).","wrong":{"b4":"`(x - 1)` cancels: `{1}/{x + 1}` for `x ≠ 1`, so there’s a hole at (1, 1/2), not an asymptote."},"hints":["Factor `x^2 - 1`.","`{x - 1}/{(x - 1)(x + 1)}`.","The factor cancels, so it’s a hole: removable."]},{"id":"i8","goal":[2,3],"t":"`{x - 1}/{x^2 - 1}` at `x = -1`","_a":"FFJREg==","why":"`x + 1` stays in the denominator after cancelling: a vertical asymptote."},{"id":"i9","goal":[2,3],"t":"`{1}/{x^2}` at `x = 0`","_a":"FFJREg==","why":"Both sides grow without bound: a vertical asymptote."},{"id":"i10","goal":[1,2],"t":"`{x^2 - 4}/{x - 2}` for `x ≠ 2`, with value 5 at `x = 2`","_a":"FFJXEg==","why":"The limit is 4, but `f(2) = 5`: redefining one point fixes it.","wrong":{"b1":"`f(2) = 5`, but the limit is 4."}}]},{"id":"constants","type":"custom","title":"Repair the constants","summary":"Repair the constants","star":true,"goal":[3,4,5],"instruction":"Find the constant (or constants) that repair each function. Items 3 to 6 are non-routine.","how":"Type a number in each box, then press Check. Fractions such as 1/4 are fine.","items":[{"id":"R1","goal":4,"prompt":"`f(x) = kx - 1` for `x \u003c 2`; `x^2 + 1` for `x ≥ 2`. Find `k`.","boxes":[{"k":"k","label":"`k =`"}],"_a":"TRIOElwESQ==","why":"The pieces meet when `2k - 1 = 2^2 + 1 = 5`, so `k = 3`.","wrong":[{"k":2,"fb":"Solve `2k - 1 = 5` carefully."}]},{"id":"R2","goal":[3,4],"prompt":"`f(x) = {x^2 - 25}/{x - 5}` for `x ≠ 5`; `f(5) = k`. Find `k`.","boxes":[{"k":"k","label":"`k =`"}],"_a":"TRIOElwGBE0=","why":"`{(x - 5)(x + 5)}/{x - 5} = x + 5 → 10`, so `f(5)` must be 10.","wrong":[{"k":0,"fb":"0/0 isn’t a value. Cancel to `x + 5`."}]},{"id":"R3","goal":[3,4],"star":true,"prompt":"`f(x) = {√x - 2}/{x - 4}` for `x ≠ 4`; `f(4) = k`. Find `k`.","boxes":[{"k":"k","label":"`k =`"}],"_a":"TRIOElwHGgIDTQ==","why":"`{√x - 2}/{x - 4} = {1}/{√x + 2}` for `x ≠ 4`, which approaches 1/4.","wrong":[{"k":0,"fb":"Rationalize the numerator (module 01): `{1}/{√x + 2} → {1}/{4}`."},{"word":"undef","fb":"Rationalize the numerator (module 01): `{1}/{√x + 2} → {1}/{4}`."}]},{"id":"R4","goal":4,"star":true,"prompt":"`f(x) = x^2 + a` for `x \u003c -1`; `ax + 7` for `x ≥ -1`. Find `a`.","boxes":[{"k":"a","label":"`a =`"}],"_a":"TRIEElwESQ==","why":"Left → `1 + a`; right `-a + 7`. `1 + a = 7 - a` gives `2a = 6`, so `a = 3`.","wrong":[{"a":4,"fb":"The right piece at −1 is `-a + 7`, not `a + 7`."}]},{"id":"R5","goal":[3,4],"star":true,"prompt":"`f(x) = {x^2 + ax + b}/{x - 3}` for `x ≠ 3`; `f(3) = 7`. Find `a` and `b`.","boxes":[{"k":"a","label":"`a =`"},{"k":"b","label":"`b =`"}],"_a":"TRIEElwGGBJUEl8dVwVJ","why":"`x^2 + x - 12 = (x - 3)(x + 4)`, and `x + 4 → 7` as `x → 3`.","general":"For a finite limit the top must be 0 at `x = 3`. Write it as `(x - 3)(x + c)` with `3 + c = 7`.","hints":["If the top weren’t 0 at `x = 3`, the limit would be infinite.","So `x^2 + ax + b = (x - 3)(x + c)`, and the limit is `3 + c`.","`3 + c = 7` gives `c = 4`: `(x - 3)(x + 4) = x^2 + x - 12`."]},{"id":"R6","goal":[4,5],"star":true,"prompt":"`f(x) = x^2` for `x ≤ 2`; `mx + b` for `x > 2`. Find `m` and `b` so the graph is continuous \u003cstrong>and\u003c/strong> has no corner at `x = 2`.","boxes":[{"k":"m","label":"`m =`"},{"k":"b","label":"`b =`"}],"_a":"TRIIElwDGBJUEl8dUko=","why":"Same slope: `m = 4`. Same height: `2m + b = 4`, so `b = 4 - 8 = -4`.","wrong":[{"m":2,"fb":"The slope of `x^2` at `x = 2` is 4 (module 02)."},{"m":4,"b":0,"fb":"Then `2m + b = 8 ≠ 4`."}],"hints":["Two conditions: same height and same slope at `x = 2`.","Slope: `m = 4`. Height: `2m + b = 4`.","`b = 4 - 8 = -4`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Farah","how":"","goal":[3,4],"instruction":"Farah made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Is `f(x) = x^2 + 1` for `x \u003c 2`, `3x - 2` for `x ≥ 2`, continuous at `x = 2`?","steps":["`f(2) = 3(2) - 2 = 4`.","Left-hand limit: \u003cspan class=\"ct-lim\">\u003cspan class=\"ct-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"ct-lu\">`x → 2^{-}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 3(2) - 2 = 4`.","Right-hand limit: \u003cspan class=\"ct-lim\">\u003cspan class=\"ct-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"ct-lu\">`x → 2^{+}`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 4`.","Both sides give 4 and `f(2) = 4`, so `f` is continuous at 2."],"_a":"Bw==","stepFb":["Step 1 is correct: `x = 2` uses the second rule.","","Step 3 is fine; the problem is earlier.","Step 4 follows from step 2. Check step 2."],"fixes":[{"t":"Average the sides: the limit is 4.5.","why":"A limit isn’t an average.","_n":"1k29d","_k":"44fe816a"},{"t":"Step 2 is correct.","why":"Left of 2, the rule is `x^2 + 1`.","_n":"1l22d","_k":"43a42ab2"},{"t":"For `x \u003c 2`, use `x^2 + 1`: the left-hand limit is 5. The sides disagree, so there’s a jump at `x = 2`.","why":"To the left of the join, use the rule for `x \u003c a`; to the right, the rule for `x ≥ a`.","_n":"1m23d","_k":"3df31939"},{"t":"Recalculate `f(2)` with `x^2 + 1 = 5`.","why":"`x = 2` belongs to `x ≥ 2`.","_n":"1n9ce","_k":"7f84c32f"}],"hints":["Which rule applies when `x \u003c 2`?","`x^2 + 1`.","`2^2 + 1 = 5 ≠ 4`: a jump."]},{"id":"e2","goal":3,"task":"Where is `f(x) = {x^2 - x - 6}/{x^2 - 9}` discontinuous, and what type is each discontinuity?","steps":["Factor: `{(x - 3)(x + 2)}/{(x - 3)(x + 3)}`.","`f` is undefined at `x = 3` and `x = -3`.","Cancel: `f(x) = {x + 2}/{x + 3}` for `x ≠ 3`.","So there are vertical asymptotes at `x = 3` and `x = -3`.","Both are infinite discontinuities."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4. The mistake is earlier."],"fixes":[{"t":"There’s no discontinuity at `x = 3`, because it cancelled.","why":"Cancelling doesn’t create `f(3)`; the point is still missing.","_n":"1o9be","_k":"30204cd3"},{"t":"Step 4 is correct.","why":"If the factor cancels, there’s a hole, not an asymptote.","_n":"1p9ee","_k":"97740563"},{"t":"`x = 3` cancelled, so it’s a hole at (3, 5/6): removable. `x = -3` is a vertical asymptote: infinite.","why":"If the factor cancels, there’s a hole, not an asymptote.","_n":"1q9de","_k":"2681b30c"},{"t":"The hole is at `x = -3` and the asymptote at `x = 3`.","why":"`x + 3` is the factor that remains.","_n":"1r98e","_k":"a9ef1858"}],"hints":["Which factor cancelled?","`x - 3` cancelled; `x + 3` didn’t.","Hole at `x = 3`, value `{3 + 2}/{3 + 3} = {5}/{6}`; asymptote at `x = -3`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the pencil test: the hole that a formula hid, or the corner that didn’t lift the pencil?"},{"id":"j2","q":"In your own words, why does continuity need all three conditions? Give a graph that passes two and fails one."},{"id":"j3","q":"Explain to a friend how to find a constant that makes a piecewise function continuous."},{"id":"j4","q":"Which kind of discontinuity do you still mix up? What will you check next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which three conditions together mean `f` is continuous at `x = a`?","options":[{"t":"`f(a)` is defined; `f(a)` is finite; the graph is smooth","why":"Being defined isn’t enough. The graph must also arrive at that value from both sides. A corner doesn’t lift the pencil. It’s continuous, just not smooth.","_n":"1s97e","_k":"2a292316"},{"t":"`f(a)` is defined; `f(a) ≠ 0`; the graph has no corner","why":"Corners are allowed; zero values are allowed.","_n":"1t9ae","_k":"22fb049b"},{"t":"`f(a)` is defined; \u003cspan class=\"ct-lim\">\u003cspan class=\"ct-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"ct-lu\">`x → a`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)` exists; the limit equals `f(a)`","why":"`f(a)` defined, the limit exists, and they’re equal: all three must hold.","_n":"1u99e","_k":"a0f2813d"},{"t":"Both one-sided limits exist; `f(a)` is defined; `f` is a polynomial","why":"They must also agree and equal `f(a)`.","_n":"1va4e","_k":"a33c0578"}]},"b":{"prompt":"`f(4) = 7` and \u003cspan class=\"ct-lim\">\u003cspan class=\"ct-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"ct-lu\">`x → 4`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x) = 7`. What can you conclude?","options":[{"t":"`f` has a removable discontinuity at 4","why":"Removable means the limit ≠ `f(4)` or `f(4)` is missing.","_n":"1wa3e","_k":"e79a4c96"},{"t":"`f` is continuous only if 7 is also the right-hand limit of `f′`","why":"Derivatives aren’t part of continuity.","_n":"1x16d","_k":"bc7dd07b"},{"t":"`f` is continuous at `x = 4`","why":"All three conditions hold.","_n":"1y17d","_k":"faa02cd4"},{"t":"Nothing yet; the graph must also be smooth at 4","why":"A corner doesn’t lift the pencil. It’s continuous, just not smooth.","_n":"1z14d","_k":"ac74355f"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`f(x) = x + 2` for `x \u003c 1`, and `5 - x` for `x ≥ 1`. What happens at `x = 1`?","options":[{"t":"An infinite discontinuity","why":"Both sides stay finite.","_n":"2015d","_k":"67e4e0b1"},{"t":"A removable discontinuity","why":"The sides disagree, so no single point fixes it.","_n":"211ad","_k":"e844a720"},{"t":"A jump discontinuity","why":"Left → 3, right → 4.","_n":"221bd","_k":"a79aa543"},{"t":"It’s continuous, since `f(1) = 4` is defined","why":"Being defined isn’t enough. The graph must also arrive at that value from both sides. To the left of 1, use `x + 2`: the left side arrives at 3, not 4.","_n":"2318d","_k":"59482a27"}]},"b":{"prompt":"`f(x) = 2x` for `x \u003c 3`, and `x + 4` for `x ≥ 3`. What happens at `x = 3`?","options":[{"t":"It’s continuous, since `f(3) = 7` is defined","why":"Being defined isn’t enough. The graph must also arrive at that value from both sides. To the left of 3, use `2x`: the left side arrives at 6, not 7.","_n":"2419d","_k":"15e2ce69"},{"t":"A removable discontinuity","why":"The sides disagree, so no single point fixes it.","_n":"251ed","_k":"79e94608"},{"t":"A jump discontinuity","why":"Left → 6, right → 7.","_n":"261fd","_k":"e5d7b6eb"},{"t":"An infinite discontinuity","why":"Both sides stay finite.","_n":"27a8e","_k":"9894bbb8"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Where is `f(x) = {x + 1}/{x^2 - 4}` discontinuous?","options":[{"t":"`x = 4`","why":"Solve `x^2 - 4 = 0`, not `x - 4 = 0`.","_n":"28a7e","_k":"f83063e0"},{"t":"`x = -1`","why":"That’s a zero of `f`, not a break.","_n":"29a6e","_k":"30190494"},{"t":"`x = 2` only","why":"`(-2)^2 - 4 = 0` too.","_n":"2aa5e","_k":"d189854f"},{"t":"`x = 2` and `x = -2`","why":"`x^2 - 4 = 0` there, and neither factor cancels.","_n":"2bace","_k":"b4813f61"}]},"b":{"prompt":"Where is `f(x) = {x - 5}/{x^2 - 1}` discontinuous?","options":[{"t":"Nowhere, because `x - 5` doesn’t cancel","why":"A zero denominator always breaks the graph.","_n":"2cabe","_k":"9c94378a"},{"t":"`x = 1` and `x = -1`","why":"`x^2 - 1 = 0` there, and neither factor cancels.","_n":"2daae","_k":"326056d1"},{"t":"`x = 5`","why":"That’s a zero of `f`, not a break.","_n":"2ea9e","_k":"d248e4bf"},{"t":"`x = 1` only","why":"`(-1)^2 - 1 = 0` too.","_n":"2fa0e","_k":"b83e5e29"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"`f(x) = kx^2 - 3` for `x \u003c 2`, and `kx + 5` for `x ≥ 2`. Find `k` so that `f` is continuous.","options":[{"t":"`k = 1`","why":"Sign slip: that solves `4k + 3 = 2k + 5`.","_n":"2g9fe","_k":"9c926752"},{"t":"`k = 2`","why":"That uses only the constant 5 on the right; the right piece is `2k + 5`.","_n":"2ha2e","_k":"bb9b9a39"},{"t":"`k = -1`","why":"Sign slip: that solves `4k - 3 = 2k - 5`.","_n":"2ia3e","_k":"ad8e55b5"},{"t":"`k = 4`","why":"`4k - 3 = 2k + 5`, so `2k = 8`.","_n":"2ja4e","_k":"35d4c476"}]},"b":{"prompt":"`f(x) = kx + 1` for `x \u003c 3`, and `kx^2 - 5` for `x ≥ 3`. Find `k`.","options":[{"t":"`k = -2/3`","why":"Sign slip: `3k + 1 = 9k + 5`.","_n":"2ka5e","_k":"207fb16d"},{"t":"`k = -2`","why":"That solves `3k + 1 = -5`, ignoring `9k`.","_n":"2la6e","_k":"24127999"},{"t":"`k = 1`","why":"`3k + 1 = 9k - 5`, so `6 = 6k`.","_n":"2ma7e","_k":"0cbd636a"},{"t":"`k = 1/2`","why":"That adds `9k` instead of subtracting: `12k = 6`.","_n":"2na8e","_k":"e259bce9"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Which describes the discontinuities of `f(x) = {x^2 - 3x + 2}/{x^2 - 1}`?","options":[{"t":"Removable at `x = 1` (a hole at (1, −1/2)); infinite at `x = -1`","why":"`{(x - 1)(x - 2)}/{(x - 1)(x + 1)}`: `x - 1` cancels.","_n":"2oa9e","_k":"3945a352"},{"t":"Infinite at both `x = 1` and `x = -1`","why":"If the factor cancels, there’s a hole, not an asymptote.","_n":"2p9ae","_k":"3990040a"},{"t":"Removable at `x = -1`, infinite at `x = 1`","why":"`x + 1` is the factor that stays.","_n":"2q9be","_k":"1d7803b0"},{"t":"Removable at `x = 2`, infinite at `x = -1`","why":"`x = 2` is a zero of `f`, not a break.","_n":"2rbc7","_k":"a030df6d"}]},"b":{"prompt":"Which describes the discontinuities of `f(x) = {x^2 + x - 6}/{x^2 - 4}`?","options":[{"t":"Removable at `x = 2` (a hole at (2, 5/4)); infinite at `x = -2`","why":"`{(x + 3)(x - 2)}/{(x - 2)(x + 2)}`: `x - 2` cancels.","_n":"2sbd7","_k":"3db3b608"},{"t":"Infinite at both `x = 2` and `x = -2`","why":"If the factor cancels, there’s a hole, not an asymptote.","_n":"2tbe7","_k":"61dfcdad"},{"t":"Removable at `x = -2`, infinite at `x = 2`","why":"`x + 2` is the factor that stays.","_n":"2ubf7","_k":"c4f52f57"},{"t":"Removable at `x = -3`, infinite at `x = -2`","why":"`x = -3` is a zero of `f`.","_n":"2vc07","_k":"7711a619"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"`f(x) = x^2 + ax` for `x \u003c 1`; `b` at `x = 1`; `2x + 3` for `x > 1`. `f` is continuous at `x = 1`. Find `a` and `b`.","options":[{"t":"`a = 5`, `b = 5`","why":"`1^2 + a`, so the left side is `1 + a`, not `a`.","_n":"2wc17","_k":"0613e571"},{"t":"`a = 4`, `b = 5`","why":"Right → 5, so `b = 5`; left `1 + a = 5`.","_n":"2xc27","_k":"d7d15fce"},{"t":"`a = -4`, `b = 5`","why":"Sign slip: `1 + a = 5`.","_n":"2yc37","_k":"79631c11"},{"t":"`a = 4`, `b` can be any number","why":"`f(1)` must equal the limit.","_n":"2zc47","_k":"0ad4dcc1"}]},"b":{"prompt":"`f(x) = ax - x^2` for `x \u003c 2`; `b` at `x = 2`; `x + 6` for `x > 2`. `f` is continuous at `x = 2`. Find `a` and `b`.","options":[{"t":"`a = 6`, `b = 8`","why":"Right → 8; left `2a - 4 = 8`.","_n":"30c57","_k":"16d673ce"},{"t":"`a = 6`, `b` can be any number","why":"`f(2)` must equal the limit.","_n":"31c27","_k":"c66f93b3"},{"t":"`a = 4`, `b = 8`","why":"That forgets the `-x^2` term: `2a = 8`.","_n":"32c17","_k":"b44a2b1f"},{"t":"`a = 2`, `b = 8`","why":"That subtracts 4 instead of adding: `2a = 4`.","_n":"33c07","_k":"29d7f8ef"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"\u003cspan class=\"ct-lim\">\u003cspan class=\"ct-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"ct-lu\">`x → 3`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `g(x) = 6` and `g(3) = 2`. Which is the best description?","options":[{"t":"“`g` is continuous at 3 because `g(3)` is defined.”","why":"Being defined isn’t enough. The graph must also arrive at that value from both sides.","_n":"34bf7","_k":"2aa12349"},{"t":"“`g` is continuous at 3 because the limit exists.”","why":"A hole has a limit but no point (or the wrong point). The limit must \u003cstrong>equal\u003c/strong> `f(a)`.","_n":"35c67","_k":"728ec053"},{"t":"“`g` has a removable discontinuity at 3. The limit exists but doesn’t equal `g(3)`; redefining `g(3) = 6` would fix it.”","why":"A hole: the limit exists, but `g(3)` is different. Redefining one point fixes it.","_n":"36c57","_k":"36a06cf4"},{"t":"“`g` has a jump at 3 because 6 and 2 differ.”","why":"A jump needs the \u003cstrong>left and right limits\u003c/strong> to differ.","_n":"37c47","_k":"a3b444d7"}]},"b":{"prompt":"\u003cspan class=\"ct-lim\">\u003cspan class=\"ct-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"ct-lu\">`x → -1`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `h(x) = 4`, and `h(-1)` is undefined. Which is the best description?","options":[{"t":"“`h` has a removable discontinuity at −1: there’s a hole at (−1, 4). Defining `h(-1) = 4` would make it continuous.”","why":"A hole: the limit exists, but `h(-1)` is missing. Defining one point fixes it.","_n":"38c37","_k":"930a5fe0"},{"t":"“`h` has a jump at −1.”","why":"Both sides approach 4.","_n":"39ca7","_k":"7a4789b4"},{"t":"“`h` is continuous at −1 because the limit exists.”","why":"A hole has a limit but no point (or the wrong point). The limit must \u003cstrong>equal\u003c/strong> `f(a)`.","_n":"3ac97","_k":"db135414"},{"t":"“`h` has an infinite discontinuity, because `h(-1)` is undefined.”","why":"Undefined isn’t the same as infinite.","_n":"3bc87","_k":"9439cde6"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which statement about `y = |x - 2|` at `x = 2` is correct?","options":[{"t":"“It’s undefined at 2 because |0| has no value.”","why":"`|0| = 0`.","_n":"3cc97","_k":"2dd7fbf6"},{"t":"“It’s discontinuous at 2 because of the corner.”","why":"A corner doesn’t lift the pencil. It’s continuous, just not smooth.","_n":"3dc67","_k":"ea2ea99a"},{"t":"“It’s smooth at 2 because it’s continuous.”","why":"A corner doesn’t lift the pencil. It’s continuous, just not smooth.","_n":"3ec77","_k":"5b2c6a42"},{"t":"“It’s continuous at 2 but not smooth: the graph has a corner, so there’s no single tangent there.”","why":"It passes the three checks; the corner means no single tangent.","_n":"3fc47","_k":"68a18899"}]},"b":{"prompt":"`f(x) = x^2` for `x \u003c 1`, and `x` for `x ≥ 1`. Which statement is correct?","options":[{"t":"“It’s smooth because the pieces meet.”","why":"A corner doesn’t lift the pencil. It’s continuous, just not smooth.","_n":"3gc57","_k":"d3b55d56"},{"t":"“It’s discontinuous because the pieces are different formulas.”","why":"To the left of the join, use the rule for `x \u003c a`; to the right, the rule for `x ≥ a`. Here both rules give 1 at `x = 1`, so the pieces meet.","_n":"3hc27","_k":"6b7f0762"},{"t":"“It’s discontinuous because the slopes differ.”","why":"Different slopes make a corner, not a break.","_n":"3ic37","_k":"ec7537ea"},{"t":"“It’s continuous but not smooth: the pieces meet at (1, 1), but their slopes there are 2 and 1.”","why":"A smooth join needs the same height \u003cstrong>and\u003c/strong> the same slope at the join.","_n":"3jd07","_k":"d83c2be4"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A parking garage charges `C(t) = 4t` dollars for `0 \u003c t ≤ 3` hours, and `C(t) = 2t + k` for `t > 3`. The owner wants no sudden jump in price at 3 h. Find `k`.","options":[{"t":"0","why":"“No jump” means the pieces meet, not `k = 0`.","_n":"3kd17","_k":"d7065b87"},{"t":"6","why":"`C(3) = 12`, and `2(3) + k = 12`.","_n":"3l4e8","_k":"02353c4a"},{"t":"12","why":"That ignores the `2t` part: the second rule at `t = 3` is `6 + k`.","_n":"3m4d8","_k":"a44ca765"},{"t":"18","why":"That adds 6 to 12 instead of subtracting.","_n":"3n508","_k":"aee099bd"}]},"b":{"prompt":"A courier charges `C(m) = 3m` dollars for `0 \u003c m ≤ 4` kg, and `C(m) = m + k` for `m > 4`. Find `k` so the price has no jump at 4 kg.","options":[{"t":"0","why":"“No jump” means the pieces meet, not `k = 0`.","_n":"3o4f8","_k":"6397f2d5"},{"t":"8","why":"12 = 4 + `k`.","_n":"3p528","_k":"f931f392"},{"t":"12","why":"That ignores the `m` part: the second rule at `m = 4` is `4 + k`.","_n":"3q518","_k":"d564f7c3"},{"t":"16","why":"That adds 4 to 12 instead of subtracting.","_n":"3r548","_k":"15b3796d"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A depth sensor’s model is `D(t) = {t^2 - 16}/{t - 4}` cm, but the formula fails at `t = 4` s. What depth should be recorded for `t = 4` so the model is continuous?","options":[{"t":"It can’t be determined.","why":"This is a hole, which can be filled by its limit.","_n":"3s538","_k":"29e1f3cf"},{"t":"8 cm","why":"`{(t - 4)(t + 4)}/{t - 4} = t + 4 → 8`.","_n":"3t468","_k":"04eecf99"},{"t":"4 cm","why":"That’s the time, not the depth.","_n":"3u458","_k":"9521fa0c"},{"t":"0 cm","why":"0/0 isn’t 0; it means simplify.","_n":"3v548","_k":"f50421a1"}]},"b":{"prompt":"A model is `D(t) = {t^2 - 6t + 5}/{t - 5}` cm, which fails at `t = 5` s. What value at `t = 5` makes it continuous?","options":[{"t":"4 cm","why":"`{(t - 1)(t - 5)}/{t - 5} = t - 1 → 4`.","_n":"3w558","_k":"0c69129a"},{"t":"It can’t be determined.","why":"This is a hole, which can be filled by its limit.","_n":"3x568","_k":"6d85ac09"},{"t":"5 cm","why":"That’s the time, not the depth.","_n":"3y578","_k":"907f899d"},{"t":"0 cm","why":"0/0 isn’t 0; it means simplify.","_n":"3z508","_k":"c788df91"}]}}]},"task":{"title":"Smooth join","summary":"Smooth join","statement":"\u003cp>Design `f(x) = ax + b` for `x \u003c 1`, and `x^2 + c` for `x ≥ 1`, that meets every condition. There’s more than one answer.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>`f` is continuous at `x = 1`.\u003c/li>\u003cli>`f` has no corner at `x = 1` (the two pieces have the same slope there).\u003c/li>\u003cli>`f(0)` is negative.\u003c/li>\u003cli>`f(2)` is positive.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose whole numbers from −10 to 10 for `a`, `b` and `c`. The graph marks the join; the tool shows the left and right heights at `x = 1` and the slope of each piece there (the slope of `x^2 + c` at `x = 1` is 2).\u003c/p>","checks":["Continuous at `x = 1`","No corner at `x = 1`","`f(0)` negative","`f(2)` positive"],"tips":["Make the heights match: `a(1) + b` must equal `1^2 + c`.","The right piece has slope 2 at `x = 1`, so the line needs slope 2 too.","`f(0)` uses the left piece: it’s `b`.","`f(2)` uses the right piece: `4 + c`."],"explainPrompt":"Explain why every answer has `a = 2`, and how you chose `c`.","vocab":"Use the words continuous, smooth, corner and slope.","afterAll":"Lines 1 and 2 force `a = 2` and `b = c - 1`. Line 3 needs `c \u003c 1`, and line 4 needs `c > -4`."},"cards":[["Continuous at `x = a`","`f(a)` defined, \u003cspan class=\"ct-lim\">\u003cspan class=\"ct-lt\">lim\u003c/span>\u003cspan class=\"vh\"> (\u003c/span>\u003cspan class=\"ct-lu\">`x → a`\u003c/span>\u003cspan class=\"vh\">)\u003c/span>\u003c/span> `f(x)` exists, and they’re equal."],["Removable discontinuity","A hole: the limit exists, but `f(a)` is missing or different. Fix it by redefining one point."],["Jump discontinuity","Left and right limits are finite but different. Can’t be fixed by one point."],["Infinite discontinuity","At least one side → ±∞: a vertical asymptote."],["Rational function: hole or asymptote?","A cancelled factor gives a hole; a remaining factor of the denominator gives an asymptote."],["Piecewise join","Continuous when the left and right pieces give the same height at the join."],["Smooth","Continuous with no corners: one tangent at every point."],["`y = |x|` at 0","Continuous, not smooth (a corner)."],["Pencil test","Can you trace through `x = a` without lifting?"],["0/0","Not a value. Simplify, then take the limit."],["Smooth join of two pieces","Same height \u003cstrong>and\u003c/strong> same slope at the join."]]}};</script>
