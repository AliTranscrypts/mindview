.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 29: hero panels, Slope of a wave (linked panels, unit circle twin, controls), Chain rule stations with the overlay
   gauge, Exact slopes boxes, Wave design task. Prefix sw- (sine wave), wd- (wave design). */
.sw-heq1{display:block;white-space:nowrap}
.sw-heq1 + .sw-heq1{margin-top:.12em}
.sw-heq{display:block;font:400 .34em/1.3 var(--font-ui);color:var(--ink-2);margin-top:.35em;letter-spacing:0}
.sw-heq .m{font-size:1.15em}
.sw-hero{display:flex;flex-direction:column;gap:8px}
canvas.plot.sw-hp{aspect-ratio:2/1}
/* Explore */
.sw-ex{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.sw-main,.sw-side{min-width:0}
.sw-ex.sw-full{grid-template-columns:minmax(0,1fr)}
.sw-ex.sw-full .sw-side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 28px;align-items:start}
.sw-ex.sw-full .sw-side > *{grid-column:1}
.sw-ex.sw-full .sw-side > .sw-read{grid-column:2;grid-row:1 / span 8;margin-top:0}
.sw-eq{min-height:1.6em}
.sw-pans{display:flex;flex-direction:column;gap:6px}
.sw-pan[hidden]{display:none}
canvas.plot.sw-pc{aspect-ratio:16/7;touch-action:none}
canvas.sw-uc{display:block;width:100%;height:240px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);touch-action:none}
.sw-pcap{margin:4px 0 2px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.sw-key{margin:8px 0 0}
.sw-lab{font-weight:700;font-size:.85rem;margin:10px 0 4px}
.sw-side > div:first-child .sw-lab{margin-top:0}
.sw-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.sw-chips .chip{min-height:36px;min-width:40px}
.sw-how{margin:8px 0 10px}
.sw-sl{margin-top:8px}
.sw-sl input{width:100%;min-height:28px}
.sw-sl output{color:var(--ink)}
.sw-sl output.sw-kout{color:var(--p-k);font-weight:700}
.sw-note{margin:4px 0 6px}
.sw-angc{margin:6px 0 4px}
.sw-angc .chip{min-width:44px}
.sw-marks{margin-top:8px}
.sw-mact{margin:6px 0 4px}
.sw-mlist{margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw-mchip{min-height:32px}
.sw-kbox{margin-top:8px;padding-top:6px;border-top:1px solid var(--rule)}
.sw-kbox[hidden]{display:none}
.sw-tact{margin:8px 0 0;flex-wrap:wrap}
.sw-side dl.read.sw-read{margin-top:16px}
/* Part 3 */
.sw-stbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sw-stbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px 26px;align-items:start}
.sw-stl,.sw-str{min-width:0}
.sw-sth{margin:0 0 4px}
.sw-brow{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:6px 10px;align-items:center;margin:6px 0}
.sw-blab{font-size:.88rem;font-weight:600;color:var(--ink-2)}
.sw-cand{margin:12px 0 6px;font-size:1.08rem;font-weight:600}
canvas.plot.sw-sc1{aspect-ratio:16/6}
canvas.plot.sw-sc2{aspect-ratio:16/9}
.sw-gauge{margin-top:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.sw-gh{font-weight:700;margin:0 0 6px}
.sw-bar{height:14px;border:1.5px solid var(--ink-2);border-radius:7px;overflow:hidden;background:var(--paper)}
.sw-bar span{display:block;height:100%;background:var(--f3)}
.sw-bar.ok{border-color:var(--green)}
.sw-gv{margin:6px 0 0}
.sw-ok{color:var(--green)}
/* Practice 2 */
.sw-dt{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.sw-dr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1.05rem}
.sw-dl{font-weight:600;min-width:6.5rem}
.sw-dr .numin.short{width:8.5rem}
.sw-dr .numin.short.sw-long{width:12rem;max-width:100%}
/* task */
.wd-in{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.wd-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.wd-lab{min-width:1.6rem;font-weight:700;font-size:1.1rem}
.wd-a .chip.on{background:var(--acol);border-color:var(--acol);color:var(--sheet)}
.wd-k .chip.on{background:var(--p-k);border-color:var(--p-k);color:var(--sheet)}
.wd-a .chip.on .m,.wd-k .chip.on .m{color:inherit}
.wd-gh{font-weight:700;margin:10px 0 4px}
@media (max-width:820px){
  .sw-ex,.sw-stbody{grid-template-columns:minmax(0,1fr)}
  .sw-ex.sw-full .sw-side{display:block}
}
@media (max-width:560px){
  canvas.plot.sw-pc{aspect-ratio:5/3}
  canvas.plot.sw-hp{aspect-ratio:16/9}
  .sw-brow{grid-template-columns:minmax(0,1fr)}
  .sw-dl{min-width:0}
}

`.","why":"Cosine’s derivative is `-sin`.","_n":"1k512","_k":"52b1e5a5"},{"t":"`y′ = -sin(6x)`.","why":"Keep the inside as it is and multiply by its derivative: `-6x sin(3x^2)`.","_n":"1l5a2","_k":"1c943f06"},{"t":"Step 2 is correct.","why":"cos falls right after 0, so its derivative starts negative.","_n":"1m5b2","_k":"51cbb580"},{"t":"`d/du cos u = -sin u`, so `y′ = -6x sin(3x^2)`.","why":"Cosine’s derivative is `-sin`; the chain factor `6x` stays.","_n":"1n643","_k":"7fff9a50"}],"hints":["What is the derivative of cos?","`-sin`.","`-6x sin(3x^2)`."]},{"id":"e2","goal":3,"task":"Find the slope of `y = sin^2 x` at `x = π/4`.","steps":["`y = (sin x)^2`.","`y′ = 2 sin x`.","At `π/4`: `2 · √2/2 = √2`."],"_a":"VQ==","stepFb":["Step 1 is correct.","","Step 3 evaluates step 2 correctly."],"fixes":[{"t":"`y′ = 2 sin x · cos x`; at `π/4`: `2(√2/2)(√2/2) = 1`.","why":"Power first, then times the inside’s derivative `cos x`.","_n":"1o633","_k":"8256c862"},{"t":"`y′ = cos^2 x`: at `π/4`, `1/2`.","why":"`sin^2 x = (sin x)^2`. Power first, then the inside: `2 sin x · cos x`.","_n":"1p663","_k":"732a2b5f"},{"t":"`y′ = 2 cos x`: `√2`.","why":"That differentiates sin but loses the power’s factor `sin x`.","_n":"1q653","_k":"d211024d"},{"t":"Step 2 is correct.","why":"The inside `sin x` has derivative `cos x`.","_n":"1r603","_k":"e9b73633"}],"hints":["Power of a function: chain rule.","Outside `u^2`, inside `sin x`.","`2 sin x cos x = 1` at `π/4`."]},{"id":"e3","goal":2,"task":"The height of a point on a turning wheel is `h(θ) = sin θ`, with `θ` in \u003cstrong>degrees\u003c/strong>. Find `dh/dθ` at `θ = 60°`.","steps":["`dh/dθ = cos θ`.","At 60°: `cos 60° = 1/2`.","So `h` rises `1/2` unit per degree at 60°."],"_a":"VA==","stepFb":["","Step 2 evaluates step 1 correctly.","This follows; but could the height (at most 1) rise half a unit per degree?"],"fixes":[{"t":"`dh/dθ = -cos θ`.","why":"The derivative of sine is `+cos`; the problem is the degrees.","_n":"1s5f3","_k":"2a6460a1"},{"t":"In degrees, `sin θ° = sin(πθ/180)`, so `dh/dθ = (π/180) cos θ°`: at 60°, `π/360` per degree.","why":"The chain rule brings in the factor `π/180`.","_n":"1t623","_k":"e4dd9134"},{"t":"`dh/dθ = (180/π) cos θ`.","why":"That makes the slope bigger, not smaller.","_n":"1u613","_k":"22515ddd"},{"t":"Step 1 is correct.","why":"The rule `cos θ` needs radians.","_n":"1v5c3","_k":"6393025d"}],"hints":["Is `θ` in radians?","Convert: `θ° = πθ/180` radians.","Chain rule: `(π/180) cos θ°`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the slope trail: that the slopes made a cosine wave, or that the degrees trap shrank every slope?"},{"id":"j2","q":"In your own words, why is `d/dx cos x` negative just after `x = 0`?"},{"id":"j3","q":"Explain to a friend how to differentiate `sin^2(3x)` one layer at a time."},{"id":"j4","q":"Which trig derivative still slows you down? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"`d/dx (5 sin x - 2 cos x)` = ?","options":[{"t":"`5 cos x + 2 sin x`","why":"`sin x` → `cos x`, and `-2 cos x` → `+2 sin x`.","_n":"1w5b3","_k":"c1d0afa6"},{"t":"`-5 cos x - 2 sin x`","why":"`sin′ = +cos`.","_n":"1x5e3","_k":"24157c31"},{"t":"`-5 cos x + 2 sin x`","why":"Both signs flipped.","_n":"1y5f3","_k":"5a22aaeb"},{"t":"`5 cos x - 2 sin x`","why":"`-2 cos x` differentiates to `+2 sin x`.","_n":"1z5c3","_k":"296c40b1"}]},"b":{"prompt":"`d/dx (3 cos x + 4 sin x)` = ?","options":[{"t":"`3 sin x + 4 cos x`","why":"`3 cos x` differentiates to `-3 sin x`.","_n":"205d3","_k":"72a51499"},{"t":"`-3 sin x + 4 cos x`","why":"`cos x` → `-sin x`, and `sin x` → `cos x`.","_n":"21623","_k":"b326f8ec"},{"t":"`3 sin x - 4 cos x`","why":"Both signs flipped.","_n":"22633","_k":"393a8215"},{"t":"`-3 sin x - 4 cos x`","why":"`sin′ = +cos`, so `4 sin x` gives `+4 cos x`.","_n":"23603","_k":"7f40567f"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"`d/dx sin(5x)` = ?","options":[{"t":"`-5 cos(5x)`","why":"sin differentiates to `+cos`.","_n":"24613","_k":"4aae4ce1"},{"t":"`cos(5x)`","why":"The inside `5x` changes 5 times as fast as `x`: `5 cos(5x)`.","_n":"25563","_k":"06696706"},{"t":"`5 cos(5x)`","why":"Chain factor 5: the inside `5x` changes 5 times as fast as `x`.","_n":"26573","_k":"9a91ebbb"},{"t":"`5 cos x`","why":"Keep the inside `5x`.","_n":"27501","_k":"3c2ac978"}]},"b":{"prompt":"`d/dx cos(6x)` = ?","options":[{"t":"`6 sin(6x)`","why":"cos differentiates to `-sin`.","_n":"284f1","_k":"1bf9ba2e"},{"t":"`-6 sin(6x)`","why":"Outside: `-sin`; inside’s derivative: 6.","_n":"294e1","_k":"ee61486b"},{"t":"`-sin(6x)`","why":"The inside `6x` changes 6 times as fast as `x`: multiply by 6.","_n":"2a4d1","_k":"faa67cbd"},{"t":"`-6 sin x`","why":"Keep the inside `6x`.","_n":"2b541","_k":"0a815909"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"What is the slope of `y = cos x` at `x = 2π/3`?","options":[{"t":"`-1/2`","why":"That’s `cos(2π/3)`, the height.","_n":"2c531","_k":"d1a0086f"},{"t":"`1/2`","why":"That’s neither `-sin` nor `cos` at `2π/3`; check the reference angle.","_n":"2d521","_k":"2c4b6e9d"},{"t":"`-√3/2`","why":"`-sin(2π/3) = -√3/2`.","_n":"2e511","_k":"f171e1cc"},{"t":"`√3/2`","why":"The slope of cos is `-sin`.","_n":"2f581","_k":"1076ac09"}]},"b":{"prompt":"What is the slope of `y = sin x` at `x = 5π/6`?","options":[{"t":"`-1/2`","why":"The reference angle `π/6` gives `√3/2` for cosine.","_n":"2g571","_k":"a424c65f"},{"t":"`-√3/2`","why":"`cos(5π/6) = -√3/2`.","_n":"2h4a1","_k":"a0367dd6"},{"t":"`1/2`","why":"That’s `sin(5π/6)`, the height.","_n":"2i4b1","_k":"b2c2765f"},{"t":"`√3/2`","why":"Cosine is negative in quadrant 2.","_n":"2j4c1","_k":"e1eb33f9"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"`y = x^2 sin x`. Find `y′` at `x = π`.","options":[{"t":"`-2π`","why":"That’s `2x cos x`, the product of the derivatives.","_n":"2k4d1","_k":"833a8843"},{"t":"`π^2`","why":"`cos π = -1`, so the second term is negative.","_n":"2l4e1","_k":"e741f879"},{"t":"`-π^2`","why":"`y′ = 2x sin x + x^2 cos x = 0 + π^2(-1)`.","_n":"2m4f1","_k":"8fe194ec"},{"t":"0","why":"`sin π = 0` removes only the first term.","_n":"2n501","_k":"18bd1969"}]},"b":{"prompt":"`y = x^2 cos x`. Find `y′` at `x = π/2`.","options":[{"t":"`-π^2/4`","why":"`2x cos x - x^2 sin x = 0 - π^2/4`.","_n":"2o511","_k":"2242d2fa"},{"t":"`π^2/4`","why":"cos differentiates to `-sin`, so the second term is `-x^2 sin x`.","_n":"2p521","_k":"39c65561"},{"t":"`-π`","why":"`2x · (-sin x)` multiplies the derivatives.","_n":"2q531","_k":"86d4fa0d"},{"t":"0","why":"`cos(π/2) = 0` removes only the first term.","_n":"2rd09","_k":"9c0b3932"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Where in `[0, 2π]` does `y = 2 sin x + x` have horizontal tangents?","options":[{"t":"`x = π/3` and `5π/3`","why":"Those give `cos x = +1/2`.","_n":"2sd19","_k":"20dd206a"},{"t":"Nowhere","why":"`2 cos x + 1` does reach 0.","_n":"2td29","_k":"1c9be0de"},{"t":"`x = 7π/6` and `11π/6`","why":"Those solve `2 sin x + 1 = 0`; the derivative of sin is cos.","_n":"2ud39","_k":"3b37e9de"},{"t":"`x = 2π/3` and `4π/3`","why":"`2 cos x + 1 = 0` gives `cos x = -1/2`.","_n":"2vd49","_k":"997277b5"}]},"b":{"prompt":"Where in `[0, 2π]` does `y = 2 cos x + x` have horizontal tangents?","options":[{"t":"`x = π/6` and `5π/6`","why":"`-2 sin x + 1 = 0` gives `sin x = 1/2`.","_n":"2wd59","_k":"94186d6d"},{"t":"`x = π/3` and `5π/3`","why":"Those solve `cos x = 1/2`.","_n":"2xd69","_k":"b6e79d36"},{"t":"`x = 7π/6` and `11π/6`","why":"That uses `+2 sin x`.","_n":"2yd79","_k":"8167ef66"},{"t":"Nowhere","why":"`-2 sin x + 1` does reach 0.","_n":"2zc89","_k":"c36a3f5b"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"`f(x) = sin(πx)`. What is `f′(1/3)`?","options":[{"t":"`π√3/2`","why":"That uses `sin(π/3)` instead of cos.","_n":"30c99","_k":"71df5eeb"},{"t":"`-π/2`","why":"sin differentiates to `+cos`.","_n":"31d69","_k":"0cb48138"},{"t":"`π/2`","why":"`f′ = π cos(πx) = π cos(π/3)`.","_n":"32d59","_k":"4409548b"},{"t":"`1/2`","why":"The inside `πx` contributes a factor `π`.","_n":"33d49","_k":"0ea7bfc8"}]},"b":{"prompt":"`g(x) = cos(πx/2)`. What is `g′(1)`?","options":[{"t":"0","why":"That’s `cos(π/2)`, the height.","_n":"34d39","_k":"0ecfdd40"},{"t":"`-π/2`","why":"`g′ = -(π/2) sin(πx/2) = -(π/2) sin(π/2)`.","_n":"35da9","_k":"91fb15c8"},{"t":"`π/2`","why":"cos differentiates to `-sin`.","_n":"36d99","_k":"097918c0"},{"t":"−1","why":"The inside `πx/2` contributes a factor `π/2`.","_n":"37d89","_k":"3fcdea80"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `d/dx sin x = cos x`?","options":[{"t":"The slope of `sin x` is greatest at its peak, where `cos x = 1`.","why":"At the peak the slope is 0.","_n":"38d79","_k":"d53baf18"},{"t":"Sine and cosine are the same wave shifted, and shifting a graph doesn’t change its slope.","why":"Shifting moves where each slope happens; the slopes of sin are a shifted copy of sin, which is cos.","_n":"39ce9","_k":"a3e60c0a"},{"t":"As a tangent slides along `y = sin x` (in radians), its slope is 1 at `x = 0`, 0 at `π/2`, −1 at `π` and 0 at `3π/2`: the values of `cos x` at those points.","why":"The slopes, point by point, are the values of `cos x`.","_n":"3acd9","_k":"c4db8fcc"},{"t":"Both `sin x` and `cos x` stay between −1 and 1.","why":"Many functions do; that says nothing about slopes.","_n":"3bdc9","_k":"0eb07542"}]},"b":{"prompt":"Which is the best explanation of why `d/dx cos x = -sin x`?","options":[{"t":"Cosine’s derivative is sine, and the minus sign is optional.","why":"At `x = π/2`, `cos x` is falling (slope −1), and `sin(π/2) = 1`. So the derivative must be `-sin x`.","_n":"3cdd9","_k":"a1c5cbe8"},{"t":"The slopes of `y = cos x` are 0 at `x = 0`, −1 at `π/2`, 0 at `π` and 1 at `3π/2`: the values of `-sin x`.","why":"The slopes, point by point, are the values of `-sin x`.","_n":"3dda9","_k":"69090a89"},{"t":"Cosine is sine shifted, so its derivative is the same: `cos x`.","why":"The slopes start at 0 and go negative; `cos x` starts at 1.","_n":"3edb9","_k":"695b4588"},{"t":"The slope of `cos x` is largest at `x = 0`, where `cos x = 1`.","why":"At `x = 0`, cos has a peak: slope 0.","_n":"3fd89","_k":"d906c87d"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Why do the rules `d/dx sin x = cos x` and `d/dx cos x = -sin x` need `x` in radians?","options":[{"t":"Radians make the graph periodic.","why":"The graph is periodic in degrees too.","_n":"3gd99","_k":"ba6abf7d"},{"t":"Only in radians is the slope of `sin x` at 0 exactly 1. In degrees the slope at 0 is `π/180`, and every derivative picks up that factor.","why":"The size of the unit on the `x`-axis sets every slope.","_n":"3hd69","_k":"f722d062"},{"t":"In degrees, the derivative of sin is `-cos`.","why":"In degrees, `sin x° = sin(πx/180)`, so the slope is `(π/180) cos x°`.","_n":"3id79","_k":"13d7947d"},{"t":"Calculators work in radians.","why":"The reason is about slopes, not calculators.","_n":"3jd49","_k":"4a2c663d"}]},"b":{"prompt":"A student graphs `y = sin x` with `x` in degrees and measures a slope of about 0.0175 at `x = 0`. Which explains it?","options":[{"t":"The slope is small because `sin 0 = 0`.","why":"The height is 0, but the slope isn’t the height.","_n":"3kd59","_k":"7304f00d"},{"t":"Degrees make the derivative `-sin x`, which is 0 at `x = 0`.","why":"The derivative of sin is `+cos`; degrees only add the factor `π/180`.","_n":"3l429","_k":"8fa28335"},{"t":"The graph was drawn wrong; the slope at 0 is always 1.","why":"In degrees, `sin x° = sin(πx/180)`, so the slope is `(π/180) cos x°`.","_n":"3m419","_k":"60e1cff3"},{"t":"In degrees, `sin x° = sin(πx/180)`, so the slope at 0 is `π/180 ≈ 0.0175`. The rule `cos x` needs radians.","why":"The chain rule brings in the factor `π/180`.","_n":"3n449","_k":"623d45be"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A mass on a spring is at `s(t) = 6 cos(πt/2)` cm, `t` in seconds. What is its velocity at `t = 1/3` s?","options":[{"t":"`-3π/2` cm/s","why":"`v = -6(π/2) sin(πt/2) = -3π sin(π/6)`.","_n":"3o439","_k":"386f4690"},{"t":"−3 cm/s","why":"The inside’s derivative `π/2` multiplies.","_n":"3p469","_k":"f8c4f96d"},{"t":"`3π/2` cm/s","why":"cos differentiates to `-sin`.","_n":"3q459","_k":"112e194b"},{"t":"`-3π√3/2` cm/s","why":"`πt/2 = π/6` and `sin(π/6) = 1/2`.","_n":"3r489","_k":"c628dd41"}]},"b":{"prompt":"A mass on a spring is at `s(t) = 4 sin(πt/3)` cm. What is its velocity at `t = 1` s?","options":[{"t":"2 cm/s","why":"The inside’s derivative `π/3` multiplies.","_n":"3s479","_k":"ac37387b"},{"t":"`2π/3` cm/s","why":"`v = 4(π/3) cos(π/3)`.","_n":"3t4a9","_k":"c6d47169"},{"t":"`-2π/3` cm/s","why":"sin differentiates to `+cos`.","_n":"3u499","_k":"1f715383"},{"t":"`2π√3/3` cm/s","why":"`cos(π/3) = 1/2`, not `√3/2`.","_n":"3v489","_k":"8cf079dd"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A Ferris wheel rider’s height is `h(t) = 12 - 10 cos(πt/30)` m, `t` in seconds. When in the first 60 s is the rider rising fastest?","options":[{"t":"At `t = 15` s","why":"`h′ = (π/3) sin(πt/30)`, largest when `πt/30 = π/2`.","_n":"3w499","_k":"9310aa6a"},{"t":"At `t = 45` s","why":"That’s where the rider falls fastest.","_n":"3x4a9","_k":"d39fdc82"},{"t":"At `t = 0` s","why":"The rider is at the bottom, momentarily not rising.","_n":"3y4b9","_k":"faae5434"},{"t":"At `t = 30` s","why":"That’s the top, where `h′ = 0`.","_n":"3z449","_k":"aa72361d"}]},"b":{"prompt":"A Ferris wheel rider’s height is `h(t) = 9 - 8 cos(πt/20)` m. When in the first 40 s is the rider rising fastest?","options":[{"t":"At `t = 0` s","why":"The rider is at the bottom, momentarily not rising.","_n":"40459","_k":"2d2ed93f"},{"t":"At `t = 20` s","why":"That’s the top, where `h′ = 0`.","_n":"41469","_k":"2ee78c11"},{"t":"At `t = 10` s","why":"`h′ = (2π/5) sin(πt/20)`, largest at `πt/20 = π/2`.","_n":"42479","_k":"6ba66f3c"},{"t":"At `t = 30` s","why":"That’s where the rider falls fastest.","_n":"43509","_k":"b41997fa"}]}}]},"task":{"title":"Wave design","summary":"Wave design","statement":"\u003cp>Design `y = @a{a} sin(@k{k}x)` that meets every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The tangent at the origin has slope 6.\u003c/li>\u003cli>The wave’s maximum value is at least 2.\u003c/li>\u003cli>The tangent at `x = π/4` does not slope downward.\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"tiny muted\">Choose `@a{a}` (a whole number from 1 to 8) and `@k{k}`. The graph shows the tangent lines at `x = 0` and `x = π/4` with their slopes.\u003c/p>","checks":["Slope 6 at the origin","Maximum value at least 2","Tangent at `π/4` not sloping down"],"tips":["`y′ = @a{a}@k{k} cos(@k{k}x)`, so the slope at 0 is `@a{a}@k{k}`.","The maximum of `@a{a} sin(@k{k}x)` is `@a{a}`.","You need `cos(@k{k}π/4) ≥ 0`, so `@k{k}π/4` can’t be past `π/2` (for these `@k{k}`)."],"explainPrompt":"Explain how the derivative `@a{a}@k{k} cos(@k{k}x)` linked the three conditions, and why (2, 3) fails.","vocab":"Use the words derivative, slope, chain rule and maximum.","more":"There’s more than one answer. Can you find them all?","after3":"(2, 3) has slope 6 at the origin, but at `π/4` its slope is `6 cos(3π/4) = -3√2`. (1, 6) passes line 3 (slope 0) but its maximum is only 1. At (3, 2) the tangent at `π/4` is exactly horizontal, which still counts as not sloping down.","labels":{"a":"`@a{a}`","k":"`@k{k}`","aAria":"a","kAria":"k","fRow":"Function","dRow":"Derivative","s0":"Slope at `x = 0`","s4":"Slope at `x = π/4`","max":"Maximum value","graph":"Graph with the tangents at `x = 0` and `x = π/4`","flat":"horizontal"}},"cards":[["`d/dx sin x`","`cos x` (radians)."],["`d/dx cos x`","`-sin x` (radians)."],["Why the minus?","`cos x` falls right after `x = 0`, so its slope starts negative."],["Radians only","In degrees, every trig derivative has an extra factor `π/180`."],["`d/dx sin(kx)`","`k cos(kx)`."],["`d/dx cos(g(x))`","`-sin(g(x)) · g′(x)`."],["`d/dx sin^2 x`","`2 sin x cos x = sin 2x`."],["`sin(x^2)` vs `sin^2 x`","`2x cos(x^2)` vs `2 sin x cos x`."],["Steepest point of a sine wave","Where it crosses its axis; slope ±(amplitude × `k`)."],["Horizontal tangents of `sin x`","At peaks and troughs: `π/2 + nπ`."],["Unit circle picture","Moving at unit speed, the height `sin θ` changes at rate `cos θ`."],["Product with trig","`d/dx (x sin x) = sin x + x cos x`."]]}};</script>
