.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 25: Find the special base (V5 shared-axes slope tool, brown base slider with nudges, ratio table, match gauge,
   V8 exact boxes), eˣ and ln stations (mirror, undo chips, solve boxes, chain rule measured), Tangents and rates boxes, task */
.ee-heq{display:block;font:400 .34em/1.3 var(--font-ui);color:var(--ink-2);margin-top:.35em;letter-spacing:0}
.ee-heq .m{font-size:1.15em}
.ee-ex{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.ee-main,.ee-side{min-width:0}
.ee-eq{min-height:1.6em}
canvas.plot.ee-plot{aspect-ratio:16/12;touch-action:none}
.ee-key{margin:8px 0 0}
.ee-how{margin:8px 0 10px}
.ee-sl{margin-top:8px}
.ee-sl input{width:100%;min-height:28px}
.ee-sl output{color:var(--ink)}
.ee-sl output.ee-bout{color:var(--p-b);font-weight:700}
.ee-nudge{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.ee-nudge .btn{min-height:40px;min-width:62px;font-variant-numeric:tabular-nums}
.ee-nudge .ee-ebtn{border:2px solid var(--p-b);color:var(--p-b);background:var(--sheet)}
.ee-note{margin:4px 0 0}
.ee-side dl.read.ee-read{margin-top:18px}
.ee-read dd .tiny{color:var(--ink-2)}
.ee-tbl{margin-top:10px;max-width:100%}
.ee-tbl .tbl-wrap{max-height:260px;overflow:auto}
.ee-gauge{margin-top:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ee-gh{font-weight:700;margin:0 0 6px}
.ee-grow{display:flex;align-items:center;gap:10px;margin:4px 0}
.ee-bar{flex:1;height:14px;border:1.5px solid var(--ink-2);border-radius:7px;overflow:hidden;background:var(--paper)}
.ee-bar span{display:block;height:100%;background:var(--f3)}
.ee-bar.ee-fine.ok{border-color:var(--green)}
.ee-gv{margin:6px 0 0}
.ee-ok{color:var(--green)}
.ee-exact{margin-top:14px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:8px}
.ee-exh{font-weight:700;margin:0 0 2px}
.ee-frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 0;font-size:1.1rem}
.ee-frow .numin.short{width:4.4rem}
.ee-fl{white-space:nowrap}
.ee-ln{font:400 1.15rem var(--font-math);margin:0 2px}
.ee-e{font:italic 400 1.25rem var(--font-math);margin-left:2px}
.ee-sup{display:inline-flex;align-self:flex-start;margin-top:-8px}
.ee-sup .numin.short.ee-pow{width:3.6rem;font-size:.9rem;min-height:30px}
/* Part 3 */
.ee-st h3{margin-top:0}
.ee-st:first-child{margin-top:0;padding-top:0;border-top:0}
.ee-stg{align-items:start}
.ee-pair{font-weight:600;margin:10px 0}
.ee-undo{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px}
.ee-urow{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:6px 12px;align-items:center}
.ee-uex{font-size:1.15rem;white-space:nowrap}
.ee-urow .chips{gap:6px;margin:0}
.ee-ufb{grid-column:1/-1}
.ee-ufb .fb{margin:0}
.chip.good{border-color:var(--green);background:var(--good-bg)}
.ee-svh{font-weight:700;margin:16px 0 4px}
.ee-solve{margin:10px 0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.ee-sq{margin:0 0 6px}
.ee-frame{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:1.1rem}
.ee-frame .numin.short{width:4.4rem}
.ee-meas{font-weight:700;margin:0 0 8px}
.ee-pq{font-weight:600;margin:10px 0 6px}
.ee-pch{gap:6px}
.ee-cmp{margin:10px 0 0;font-size:1.05rem}
.ee-note2{margin:8px 0 0;padding:8px 12px;border-left:4px solid var(--hi);background:var(--info-bg);border-radius:0 8px 8px 0}
/* Practice 2: V8 boxes */
.ee-dt{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.ee-dr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1.05rem}
.ee-dl{font-weight:600}
.ee-dpt{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.ee-dr .numin.short{width:5.2rem}
/* task */
.pk-in{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.pk-step{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.pk-step label{min-width:7.5rem}
.pk-step .numin.short{width:4rem}
.pk-step .btn{min-width:40px;min-height:40px}
.pk-gh{font-weight:700;margin:10px 0 4px}
@media (max-width:820px){
  .ee-ex{grid-template-columns:minmax(0,1fr)}
  .ee-urow{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  canvas.plot.ee-plot{aspect-ratio:1/1}
  .ee-frow .ee-fl:first-child{flex-basis:100%}
  .ee-frow .numin.short,.ee-frame .numin.short{width:3.9rem}
}

pe graph of `y = (1/2)^x` look like?","options":[{"t":"Zero everywhere","_n":"108e6","_k":"3269a4e9"},{"t":"It doesn’t exist","_n":"11936","_k":"bf3e5075"},{"t":"The same shape flipped below the `x`-axis","_n":"12946","_k":"e78f7456"},{"t":"The same graph","_n":"138d5","_k":"9e5825f6"}],"explain":"`(1/2)^x` decreases, so every slope is negative: `k ≈ -0.693`."}],"chalIntro":"Use the slope tool to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Set the base so that slope ÷ height = 1 to three decimal places.","why":"At `@b{a} ≈ 2.718` the slope graph lands on the curve: slope = height. This base is the number `e`.","hints":["`k \u003c 1` at 2 and `k > 1` at 3.","Try 2.7 and 2.75, then narrow down.","`@b{a} ≈ 2.718`: that’s `e`."],"msgs":{"a27":"`k ≈ 0.993`: still a little low; nudge up.","a272":"`k ≈ 1.0006`: just over.","low":"`k ≈ #1`: still too low; raise the base.","high":"`k ≈ #1`: too high; lower the base."}},{"id":"tc2","goal":[2,3],"prompt":"Set the base to `e` (button). Move the probe to the point where the tangent has slope 5, then enter that `x` exactly.","why":"For `y = e^x`, slope = height, so `e^x = 5` and `x = ln 5 ≈ 1.609`.","hints":["For `y = e^x`, slope = `y`-value.","So you need `e^x = 5`.","`x = ln 5 ≈ 1.609`."],"msgs":{"base":"Press \u003cstrong>Set to `e`\u003c/strong> first: this challenge needs the base `e`.","x5":"The slope at `x = 5` is `e^5 ≈ 148`. For `e^x`, slope = height, so solve `e^x = 5`.","x5e":"Solve `e^x = 5` with ln, not by dividing.","probe":"Move the probe until the slope readout is about 5.","blank":"Now enter that `x` exactly in the □ ln □ box.","approx":"Close, but enter it exactly: use ln.","general":"For `y = e^x`, slope = height: solve `e^x = 5`."}},{"id":"tc3","goal":[1,4],"stretch":true,"prompt":"Find the base `@b{a}` for which `y = @b{a}^x` has slope \u003cstrong>2\u003c/strong> at `x = 0`. Set it on the slider, then enter it exactly.","why":"`(e^2)^x = e^{2x}`, and `d/dx e^{2x} = 2e^{2x}`, which is 2 at `x = 0`. So `@b{a} = e^2 ≈ 7.39`.","hints":["At `x = 0`, slope = `k · @b{a}^0 = k`. You need `k = 2`.","`(e^2)^x = e^{2x}`, and by the chain rule `d/dx e^{2x} = 2e^{2x}`.","At `x = 0` that’s 2, so `@b{a} = e^2 ≈ 7.39`."],"msgs":{"a2e":"Doubling the base doesn’t double `k`: for `2e`, `k ≈ 1.69`. Squaring the base does.","a2":"For base 2 the slope at 0 is about 0.693.","slider":"Move the probe to `x = 0` and tune the base until the slope there is 2.","blank":"Now enter the base exactly in the □`e`^□ box.","approx":"Close, but enter it exactly with `e`.","general":"Not yet: the slope at `x = 0` must be 2."}}]},"part3":{"slug":"ln","name":"eˣ and ln","heading":"`e^x` and `ln x`: an inverse pair","intro":"Explore found the special base `e`. Here you meet its inverse, the natural logarithm `ln x = log_{e} x`: see the reflection, practise undoing, use ln to solve the equations that slope questions produce, and check a chain-rule derivative against measured slopes. Then try the quick check.","st1":{"title":"Station 1: The mirror","text":"`y = e^x` and `y = ln x` are reflections of each other in the line `y = x`. Step through the points on `y = e^x` (or tap one on the graph) to see each one’s mirror image on `y = ln x`.","pts":[{"a":"0","b":"1","av":0,"bv":1},{"a":"1","b":"e","av":1,"bv":2.718281828459045},{"a":"ln 2","b":"2","av":0.6931471805599453,"bv":2}],"pair":"`(#1, #2)` on `y = e^x` ↔ `(#2, #1)` on `y = ln x`: the coordinates swap.","head":["","`y = e^x`","`y = ln x`"],"rows":[["Domain","all real `x`","`x > 0`"],["Range","`y > 0`","all real `y`"]],"tableNote":"The domain and range swap, just as the coordinates do.","alg":["`e^{ln x} = x` for `x > 0`: `ln x` is the power of `e` that gives `x`.","`ln(e^x) = x` for every `x`: the power of `e` in `e^x` is `x`.","So `(p, q)` on `y = e^x` means `(q, p)` on `y = ln x`."],"graph":"Graph of y = e to the x in blue, y = ln x in tea rates","star":true,"goal":[3,4,5],"instruction":"Find tangent lines, horizontal tangents and critical points with exact values. Items 3 to 6 are non-routine; 5 and 6 go beyond the Final Check.","how":"Type exact values: whole numbers, fractions, and `e` where you need it (`e`, `2e`, `1/e`, `e^-1`, `4e^-2`). Separate several values with commas. Then press Check.","msgs":{"fill":"Fill in every box first.","err":"Type exact values only, such as −3, 1/2, `e`, `1/e` or `4e^-2`.","exact":"Close, but give the exact value with `e` (such as `1/e` or `e^-2`), not a decimal.","general":"Not yet. Check your work and try again."},"items":[{"id":"s1","goal":[4,5],"prompt":"Equation of the tangent to `y = e^{2x}` at `x = 0`.","boxes":[{"k":"t","line":true}],"_a":"SkREGwtuAxkAO00=","display":"`y = 2x + 1`","wrong":[{"k":"t","eq":[1,1],"fb":"The slope is `2e^0 = 2`."}],"why":"`y′ = 2e^{2x}`, so the slope at 0 is 2, and the point is (0, 1)."},{"id":"s2","goal":5,"prompt":"The point where `f(x) = xe^{-x}` has a horizontal tangent.","boxes":[{"k":"p","pre":"Point","pt":true}],"_a":"SkRAGwtuABkBSAMPBg0GDAVSAQgGBAUBA1UDZEw=","display":"`(1, e^{-1})`","wrong":[{"k":"p","eq":[0,0],"fb":"`f′ = (1 - x)e^{-x}`, zero only at `x = 1`."}],"why":"`f′ = (1 - x)e^{-x}` is zero only at `x = 1`, and `f(1) = e^{-1}`."},{"id":"s3","goal":5,"star":true,"prompt":"Find and classify the critical points of `f(x) = x^2e^x`.","boxes":[{"k":"max","pre":"Local max at","pt":true},{"k":"min","pre":"Local min at","pt":true}],"_a":"SkRdWEkXC24cVBwJHwAFBAJSAQgCBwgBB1IFCQloHRdcD14bC24BGQE7TQ==","display":"local max `(-2, 4e^{-2})`; local min (0, 0)","general":"`f′ = x(x + 2)e^x`; `e^x > 0`, so the sign comes from `x(x + 2)`.","why":"`f′ = x(x + 2)e^x`: + on `(-∞, -2)`, − on `(-2, 0)`, + on `(0, ∞)`."},{"id":"s4","goal":4,"star":true,"prompt":"Find every `k` for which `y = e^{kx}` satisfies `y″ - 5y′ + 6y = 0`.","boxes":[{"k":"k","pre":"`k =`","list":true}],"_a":"SkRbGwtuAxkCO00=","display":"`k = 2` or `k = 3`","general":"`y′ = ke^{kx}`, `y″ = k^2e^{kx}`: `(k^2 - 5k + 6)e^{kx} = 0`.","why":"`e^{kx} ≠ 0`, so `k^2 - 5k + 6 = 0`: `(k - 2)(k - 3) = 0`.","hints":["Find `y′` and `y″`.","Substitute: `e^{kx}(k^2 - 5k + 6) = 0`.","`e^{kx} ≠ 0`, so `k^2 - 5k + 6 = 0`: `k = 2` or 3."]},{"id":"s5","goal":5,"star":true,"prompt":"The tangent to `y = e^x` at `x = a` passes through the origin. Find the point of tangency.","boxes":[{"k":"p","pre":"Point","pt":true}],"_a":"SkRAGwtuABkDSAcICQcJBAlUCA0EDAEBBDtN","display":"`(1, e)`","wrong":[{"k":"p","eq":[0,1],"fb":"The tangent at 0 is `y = x + 1`, which misses the origin."}],"why":"The tangent at `x = a` is `y - e^a = e^a(x - a)`; (0, 0) on it gives `a = 1`.","hints":["The tangent at `x = a` is `y - e^a = e^a(x - a)`.","Put in (0, 0): `-e^a = -ae^a`.","Divide by `e^a > 0`: `a = 1`, so the point is `(1, e)`."]},{"id":"s6","goal":[4,5],"star":true,"prompt":"Where does the tangent to `y = e^{x/2}` at `x = 2` cross the `x`-axis?","boxes":[{"k":"x","pre":"`x =`"}],"_a":"SkRIGwsFTA==","display":"`x = 0`","wrong":[{"k":"x","eq":4,"fb":"Slope `(1/2)e`, point `(2, e)`: `0 - e = (e/2)(x - 2)` gives `x = 0`."}],"why":"Slope `(1/2)e`, point `(2, e)`: `0 - e = (e/2)(x - 2)` gives `x = 0`."}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Yusuf","how":"","goal":[2,3,4],"instruction":"Yusuf made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Differentiate `y = e^{x^3 - 2x}`.","steps":["The outer function is `e^u`; the inner function is `u = x^3 - 2x`.","`d/du e^u = e^u`.","So `dy/dx = e^{x^3 - 2x}`."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"`dy/dx = (x^3 - 2x)e^{x^3 - 2x - 1}`.","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"248e5","_k":"b8098565"},{"t":"`dy/dx = e^{3x^2 - 2}`.","why":"Don’t replace the exponent; multiply by its derivative.","_n":"259b5","_k":"14856930"},{"t":"Step 3 is correct.","why":"Multiply by the derivative of the exponent: `d/dx e^{3x} = 3e^{3x}`.","_n":"269c5","_k":"6b6a8156"},{"t":"Multiply by `u′ = 3x^2 - 2`: `dy/dx = (3x^2 - 2)e^{x^3 - 2x}`.","why":"The chain rule multiplies by the inner derivative.","_n":"27957","_k":"129ffcb4"}],"hints":["What does the chain rule multiply by?","The inner derivative.","`(3x^2 - 2)e^{x^3 - 2x}`."]},{"id":"e2","goal":2,"task":"Differentiate `y = e^x + x^e`.","steps":["`e^x` is exponential, so its derivative is `e^x`.","`x^e` is also exponential, so its derivative is `x^e`.","So `dy/dx = e^x + x^e`."],"_a":"AA==","stepFb":["Step 1 is correct.","","Step 3 follows from step 2."],"fixes":[{"t":"`x^e` is a power function (variable base, constant exponent `e ≈ 2.718`). The power rule gives `e · x^{e - 1}`, so `dy/dx = e^x + ex^{e - 1}`.","why":"The variable is in the base, so it’s like `x^3`.","_n":"28947","_k":"e9071ca2"},{"t":"Step 2 is correct.","why":"Exponential means the variable is in the exponent.","_n":"29937","_k":"173b35c3"},{"t":"Its derivative is `x^e ln x`.","why":"That would be for a variable exponent.","_n":"2a927","_k":"7f0b7fda"},{"t":"Its derivative is 0, because `e` is a constant.","why":"`e` is a constant, but `e^x` isn’t: its exponent changes with `x`.","_n":"2b917","_k":"b8b31b2a"}],"hints":["Where is the variable in `x^e`?","In the base: it’s like `x^3`.","Power rule: `ex^{e - 1}`."]},{"id":"e3","goal":3,"task":"Find the point on `y = e^{2x}` where the tangent has slope 6.","steps":["`dy/dx = 2e^{2x}`.","`2e^{2x} = 6`, so `e^{2x} = 3`.","Take ln of both sides: `2x = ln 3`, so `x = ln(3/2)`.","The point is `(ln(3/2), 3)`."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 uses step 3’s value."],"fixes":[{"t":"`x = ln 3 - 2`.","why":"Divide by 2, don’t subtract.","_n":"2c907","_k":"8df384f6"},{"t":"Step 3 is correct.","why":"ln and `e^{( )}` undo each other: `ln(e^x) = x`. And `(ln 3)/2` isn’t `ln(3/2)`. `(ln 3)/2 ≈ 0.549`, but `ln(3/2) ≈ 0.405`.","_n":"2d8f7","_k":"f2762b88"},{"t":"`x = 3/2`.","why":"ln is needed to undo `e^{( )}`.","_n":"2e8e7","_k":"48132b66"},{"t":"`2x = ln 3` gives `x = (ln 3)/2`. The point is `((ln 3)/2, 3)`.","why":"Divide both sides by 2.","_n":"2f9d7","_k":"160808d0"}],"hints":["From `2x = ln 3`, what’s `x`?","Divide both sides by 2.","`(ln 3)/2`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you tuned the base: that every exponential’s slope graph is a stretched copy, or where `e` turned up?"},{"id":"j2","q":"In your own words, why is `d/dx e^x = e^x`, and what does it mean on the graph?"},{"id":"j3","q":"Explain to a friend how ln helps you find where the slope of `e^{2x}` is 6."},{"id":"j4","q":"Which rule with `e^x` do you still mix up (power rule vs exponential, the chain factor, products)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"`d/dx (4e^x - x^4)` = ?","options":[{"t":"`-4x^3`","why":"`e` is a constant, but `e^x` isn’t: its exponent changes with `x`.","_n":"2g9c7","_k":"ed8c5c35"},{"t":"`4e^x - 4x^3`","why":"`d/dx e^x = e^x`.","_n":"2h0f7","_k":"8a2cd29f"},{"t":"`4xe^{x - 1} - 4x^3`","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"2i107","_k":"88f24a34"},{"t":"`4e^x - x^4`","why":"`x^4` must be differentiated too.","_n":"2j117","_k":"a197285a"}]},"b":{"prompt":"`d/dx (x^3 + 7e^x)` = ?","options":[{"t":"`3x^2`","why":"`e` is a constant, but `e^x` isn’t: its exponent changes with `x`.","_n":"2k127","_k":"83de14f0"},{"t":"`3x^2 + 7e^x`","why":"`d/dx e^x = e^x`, so `7e^x` stays `7e^x`.","_n":"2l0b7","_k":"d0eb5c5f"},{"t":"`3x^2 + 7xe^{x - 1}`","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"2m0c7","_k":"1c616034"},{"t":"`3x^2 + 7e^x + 7`","why":"The derivative of `7e^x` is just `7e^x`.","_n":"2n0d7","_k":"ecad3808"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"`d/dx e^{5x - 2}` = ?","options":[{"t":"`5e^5`","why":"Keep the whole exponent.","_n":"2o0e7","_k":"d1cbed30"},{"t":"`5e^{5x - 2}`","why":"Chain factor 5.","_n":"2p177","_k":"369700fd"},{"t":"`(5x - 2)e^{5x - 3}`","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"2q187","_k":"044e8304"},{"t":"`e^{5x - 2}`","why":"Multiply by the derivative of the exponent: `d/dx e^{3x} = 3e^{3x}`.","_n":"2rd41","_k":"81d7e342"}]},"b":{"prompt":"`d/dx e^{4 - 3x}` = ?","options":[{"t":"`-3e^{4 - 3x}`","why":"Chain factor −3.","_n":"2sd51","_k":"43d1c67d"},{"t":"`3e^{4 - 3x}`","why":"The inner derivative is −3.","_n":"2td61","_k":"2ede7d1e"},{"t":"`(4 - 3x)e^{3 - 3x}`","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"2ud71","_k":"f3adcd0e"},{"t":"`e^{4 - 3x}`","why":"Multiply by the derivative of the exponent: `d/dx e^{3x} = 3e^{3x}`.","_n":"2vd01","_k":"bd45af92"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Simplify `ln(e^{4x}) + e^{ln 3}`.","options":[{"t":"`4x + ln 3`","why":"`e^{ln 3} = 3`.","_n":"2wd11","_k":"294eb67a"},{"t":"`4x + 3`","why":"Each pair undoes.","_n":"2xd21","_k":"b996e1a9"},{"t":"`e^{4x} + ln 3`","why":"ln and `e^{( )}` undo each other: `ln(e^x) = x`. And `(ln 3)/2` isn’t `ln(3/2)`.","_n":"2yd31","_k":"7fc7a556"},{"t":"`4 + 3x`","why":"`ln(e^{4x}) = 4x`.","_n":"2zdc1","_k":"8be6cc7d"}]},"b":{"prompt":"Simplify `e^{ln 5} - ln(e^{2x})`.","options":[{"t":"`5 - e^{2x}`","why":"`ln(e^{2x}) = 2x`.","_n":"30dd1","_k":"3ebf5017"},{"t":"`ln 5 - e^{2x}`","why":"ln and `e^{( )}` undo each other: `ln(e^x) = x`. And `(ln 3)/2` isn’t `ln(3/2)`.","_n":"31da1","_k":"4c87002b"},{"t":"`5 - 2`","why":"Keep the `x`.","_n":"32d91","_k":"791c4bc0"},{"t":"`5 - 2x`","why":"Each pair undoes.","_n":"33d81","_k":"b0711f13"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"At which `x`-values does `f(x) = (x^2 - 3)e^x` have horizontal tangents?","options":[{"t":"`x = 0` only","why":"That’s from `2x · e^x` alone; the product rule adds `(x^2 - 3)e^x`.","_n":"34d71","_k":"7c723520"},{"t":"`x = -3`, `x = 1`, and wherever `e^x = 0`","why":"`e^x` is never 0.","_n":"35d61","_k":"6f1cdbd8"},{"t":"`x = -3` and `x = 1`","why":"`f′ = (x^2 + 2x - 3)e^x = (x + 3)(x - 1)e^x`.","_n":"36d51","_k":"a8ec182b"},{"t":"`x = -√3` and `x = √3`","why":"Those make `f = 0`, not `f′ = 0`.","_n":"37d41","_k":"daf15b68"}]},"b":{"prompt":"At which `x`-values does `f(x) = (x^2 - 8)e^x` have horizontal tangents?","options":[{"t":"`x = -4` and `x = 2`","why":"`f′ = (x^2 + 2x - 8)e^x = (x + 4)(x - 2)e^x`.","_n":"38d31","_k":"3aa2d5eb"},{"t":"`x = -4`, `x = 2`, and wherever `e^x = 0`","why":"`e^x` is never 0.","_n":"39e21","_k":"25ac89f7"},{"t":"`x = 0` only","why":"That’s from `2x · e^x` alone; the product rule adds `(x^2 - 8)e^x`.","_n":"3ae11","_k":"89c7266c"},{"t":"`x = -2√2` and `x = 2√2`","why":"Those make `f = 0`, not `f′ = 0`.","_n":"3be01","_k":"fac8c7da"}]}},{"id":"t2","cat":"T","goal":1,"a":{"prompt":"For `f(x) = 4^x`, the slope at `x = 0` is about 1.386. What is the slope at `x = 3`?","use":"`e ≈ 2.718`, `e^2 ≈ 7.39`, `ln 2 ≈ 0.693`, `ln 3 ≈ 1.099`, `ln 4 ≈ 1.386`","options":[{"t":"About 1.386","why":"The ratio is constant, not the slope.","_n":"3ce11","_k":"4423a1de"},{"t":"About 1.386 × 64","why":"Slope = `k` × height, and `f(3) = 64`.","_n":"3dde1","_k":"5a3d3419"},{"t":"64","why":"Slope = height only for base `e`.","_n":"3edf1","_k":"52462cd8"},{"t":"`3 × 4^2 = 48`","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"3fe41","_k":"7216f682"}]},"b":{"prompt":"For `f(x) = 3^x`, the slope at `x = 0` is about 1.099. What is the slope at `x = 2`?","use":"`e ≈ 2.718`, `e^2 ≈ 7.39`, `ln 2 ≈ 0.693`, `ln 3 ≈ 1.099`, `ln 4 ≈ 1.386`","options":[{"t":"9","why":"Slope = height only for base `e`.","_n":"3ge51","_k":"2aa0936e"},{"t":"`2 × 3^1 = 6`","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"3he21","_k":"d8d1113e"},{"t":"About 1.099 × 9","why":"Slope = `k` × height, and `f(2) = 9`.","_n":"3ie31","_k":"770caeed"},{"t":"About 1.099","why":"The ratio is constant, not the slope.","_n":"3jd81","_k":"32b5afd5"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"What is the equation of the tangent to `y = (x + 1)e^{2x}` at `x = 0`?","options":[{"t":"`y = 3x`","why":"`y(0) = 1`, not 0.","_n":"3kd91","_k":"10524495"},{"t":"`y = 2x + 1`","why":"That differentiates only `e^{2x}`. `xe^x` is a product: `(x)′e^x + x(e^x)′ = (1 + x)e^x`.","_n":"3le61","_k":"e6968f4e"},{"t":"`y = x + 1`","why":"That differentiates only `x + 1`. `xe^x` is a product: `(x)′e^x + x(e^x)′ = (1 + x)e^x`.","_n":"3me51","_k":"74eab92c"},{"t":"`y = 3x + 1`","why":"`y′ = (2x + 3)e^{2x}`; slope 3 at 0; point (0, 1).","_n":"3ne81","_k":"e58f5951"}]},"b":{"prompt":"What is the equation of the tangent to `y = (x + 2)e^{-x}` at `x = 0`?","options":[{"t":"`y = -x`","why":"`y(0) = 2`.","_n":"3oe71","_k":"e46b29d0"},{"t":"`y = x + 2`","why":"That differentiates only `x + 2`. `xe^x` is a product: `(x)′e^x + x(e^x)′ = (1 + x)e^x`.","_n":"3pe21","_k":"f9c82046"},{"t":"`y = -x + 2`","why":"`y′ = -(x + 1)e^{-x}`; slope −1; point (0, 2).","_n":"3qe11","_k":"30aa2faf"},{"t":"`y = -2x + 2`","why":"That differentiates only `e^{-x}`. `xe^x` is a product: `(x)′e^x + x(e^x)′ = (1 + x)e^x`.","_n":"3re41","_k":"f4715bc6"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which best describes the relationship between `y = 3^x` and its derivative?","options":[{"t":"“The derivative is `3^x` shifted to the left.”","why":"The ratio of slope to height is constant: a stretch, not a shift.","_n":"3se31","_k":"8df6a988"},{"t":"“The derivative is `x · 3^{x - 1}`.”","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"3tde1","_k":"956c0ed6"},{"t":"“The derivative is a vertical stretch of `y = 3^x`: at every `x`, the slope is about 1.10 times the height.”","why":"Slope ÷ height is the same at every `x`: about 1.10 for base 3.","_n":"3udd1","_k":"6e1c8141"},{"t":"“The derivative equals `3^x`.”","why":"For `a^x` the slope is `k` times the height, with the same `k` everywhere. Only for `e` is `k = 1`.","_n":"3vdc0","_k":"a94bd0b5"}]},"b":{"prompt":"Which best describes the relationship between `y = 2^x` and its derivative?","options":[{"t":"“The derivative is `x · 2^{x - 1}`.”","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"3wdd0","_k":"6da40d23"},{"t":"“The derivative equals `2^x`.”","why":"For `a^x` the slope is `k` times the height, with the same `k` everywhere. Only for `e` is `k = 1`.","_n":"3xde0","_k":"539c7ff5"},{"t":"“The derivative is `2^x` shifted to the right.”","why":"The ratio of slope to height is constant: a compression, not a shift.","_n":"3ydf0","_k":"256a3e0f"},{"t":"“The derivative is a vertical compression of `y = 2^x`: at every `x`, the slope is about 0.69 times the height.”","why":"Slope ÷ height is the same at every `x`: about 0.69 for base 2.","_n":"3ze00","_k":"94575aa2"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why `d/dx e^x = e^x`?","options":[{"t":"“For every `y = a^x`, slope ÷ height is the same at every `x`; `e` is the base for which that ratio is exactly 1.”","why":"That’s what tuning the base shows: `k = 1` only for `e`.","_n":"40e10","_k":"fec52888"},{"t":"“By the power rule: bring down the exponent.”","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"41e20","_k":"93c5891d"},{"t":"“Because `e` is a constant, and constants don’t change.”","why":"`e` is a constant, but `e^x` isn’t: its exponent changes with `x`.","_n":"42e30","_k":"56bc8f27"},{"t":"“Because `e^x` passes through (0, 1).”","why":"Every `a^x` passes through (0, 1).","_n":"43d40","_k":"f3fd97c2"}]},"b":{"prompt":"A student says the tangent to `y = e^x` at `(2, e^2)` has slope 2. Which response is best?","options":[{"t":"“The slope is `2e`: bring down the exponent.”","why":"The power rule is for `x^n`: variable base, fixed exponent. In `e^x` the exponent is the variable.","_n":"44d50","_k":"cfd7b8b4"},{"t":"“Correct: the slope equals `x`.”","why":"For `a^x` the slope is `k` times the height, with the same `k` everywhere. Only for `e` is `k = 1`.","_n":"45621","_k":"47c00a0f"},{"t":"“For `y = e^x` the slope at any point equals the `y`-value, so the slope at `(2, e^2)` is `e^2 ≈ 7.39`, not 2.”","why":"Slope = height for `e^x`.","_n":"46611","_k":"78d839c0"},{"t":"“The slope is 0, because `e` is a constant.”","why":"`e` is a constant, but `e^x` isn’t: its exponent changes with `x`.","_n":"47601","_k":"e61019bf"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A bacteria culture has `P(t) = 500e^{0.4t}` cells after `t` hours. How fast is it growing at `t = 5`?","use":"`e ≈ 2.718`, `e^2 ≈ 7.39`, `ln 2 ≈ 0.693`, `ln 3 ≈ 1.099`, `ln 4 ≈ 1.386`","options":[{"t":"200 cells per hour","why":"That’s the rate at `t = 0`.","_n":"485f1","_k":"7f27bcaf"},{"t":"About 1478 cells per hour","why":"`P′ = 200e^{0.4t}`; `P′(5) = 200e^2 ≈ 200 × 7.39`.","_n":"49661","_k":"2264bf9c"},{"t":"About 3 cells per hour","why":"`0.4e^2` forgets the 500.","_n":"4a651","_k":"e6013f44"},{"t":"About 3695 cells per hour","why":"That’s `P(5) = 500e^2`: the size, not the rate.","_n":"4b641","_k":"6b435126"}]},"b":{"prompt":"`P(t) = 300e^{0.5t}` cells. How fast is it growing at `t = 4`?","use":"`e ≈ 2.718`, `e^2 ≈ 7.39`, `ln 2 ≈ 0.693`, `ln 3 ≈ 1.099`, `ln 4 ≈ 1.386`","options":[{"t":"About 4 cells per hour","why":"`0.5e^2` forgets the 300.","_n":"4c631","_k":"7b5914c0"},{"t":"About 2217 cells per hour","why":"That’s `P(4) = 300e^2`: the size, not the rate.","_n":"4d5a1","_k":"d381a1cc"},{"t":"About 1109 cells per hour","why":"`P′ = 150e
