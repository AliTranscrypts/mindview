.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 18: hero strip (hoodie tag, crowd), revenue and profit dashboard, V10 shape stages (bars, heater), V11 sign chart,
   money boxes, task. Module tokens for the two terms that pull against each other in Part 3 (light and dark):
     --ec-a  the shrinking term (setup shared, driver wages): same hexes as --p-t
     --ec-b  the growing term (crowding, fuel): same hexes as --f5 */
:root{--ec-a:#00648A;--ec-b:#A84C05}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--ec-a:#7FD3F5;--ec-b:#FF9F5A} }
:root[data-theme="dark"]{--ec-a:#7FD3F5;--ec-b:#FF9F5A}

.ec-heq-a{font-style:normal;color:var(--ink-2);margin:0 .2em}

/* hero */
.ec-hero canvas.plot{aspect-ratio:16/10}
.ec-hstrip{display:flex;align-items:center;gap:14px;margin:0 0 8px}
.ec-hoodie-box{flex:0 0 auto;width:104px}
.ec-hoodie{display:block;width:100%;height:auto}
.ec-hd{fill:var(--sheet);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ec-hd-l{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.ec-tag rect{fill:var(--hi);stroke:var(--ink);stroke-width:1.5}
.ec-tag circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.ec-tag text{fill:var(--hi-ink);font:700 15px var(--font-ui);text-anchor:middle;dominant-baseline:middle}
.ec-crowd-box{flex:1 1 auto;min-width:0}
.ec-crowd{display:flex;flex-wrap:wrap;gap:3px}
.ec-person{width:18px;height:29px;fill:var(--ink-2)}
.ec-person.off{opacity:.14}
@media (prefers-reduced-motion:no-preference){ .ec-person{transition:opacity .25s} }
.ec-crowd-n{margin:4px 0 0;font:700 .95rem var(--font-ui);color:var(--ink)}
.ec-lg{display:inline-flex;align-items:center;gap:6px;margin-right:14px;white-space:nowrap}
.ec-sw{display:inline-block;width:26px;height:0;border-top:3px solid var(--pen);flex:0 0 auto}
.ec-sw-r{border-top-color:var(--pen)}
.ec-sw-p{border-top:4.5px solid var(--ink)}
.ec-sw-c{border-top:2.5px dashed var(--ink-2)}
.ec-sw-d{border-top-color:var(--f3)}
.ec-sw-z{height:14px;border:0;background:var(--hi-soft);border-radius:3px;width:20px}

/* dashboard */
.ec-dash{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.ec-main,.ec-side{min-width:0}
.ec-g + .ec-g{margin-top:14px}
.ec-gcap{margin:0 0 4px;font-weight:700;font-size:.95rem}
.ec-legend{display:flex;flex-wrap:wrap;gap:4px 0;margin:6px 0 0;font-size:.9rem}
.ec-model{margin:0 0 4px}
.ec-model p + p{margin-top:6px}
.ec-now{color:var(--ink)}
.ec-short{display:none}
.ec-sl{margin-top:12px}
.ec-sl[hidden]{display:none}
.ec-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0 0}
.ec-rl{font-size:.875rem;font-weight:700;flex:0 0 100%}
.ec-row .chip{min-height:34px}
.ec-ans{margin:14px 0 0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.ec-ans label{display:block;font-weight:700;margin:0 0 6px}
.ec-ans-in,.ec-bin{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.ec-pre{font:600 1.15rem var(--font-math)}
.ec-ans .numin{width:9rem}
.ec-ans .tiny{margin:6px 0 0}
.ec-read{margin-top:12px}
@media (max-width:820px){
  .ec-dash{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .ec-long{display:none}
  .ec-short{display:inline}
  .ec-dash[data-view="price"] .ec-g[data-g="qty"],.ec-dash[data-view="qty"] .ec-g[data-g="price"]{display:none}
  .ec-g + .ec-g{margin-top:0}
  .ec-g canvas.plot.wide{aspect-ratio:4/3}
}

/* Part 3 stations: V10 shape stage */
.ec-stns{margin-bottom:6px}
.ec-stchip{font:600 .95rem var(--font-ui)}
.ec-stp h3{margin:8px 0 6px}
.ec-stp .m,.ec-alg-steps .m,.ec-legend .m{white-space:normal}
.ec-ss{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px 22px;align-items:start}
.ec-ss-fig,.ec-ss-g{min-width:0}
.ec-ss-sl{margin-top:10px}
.ec-bar{display:block;width:100%;max-width:170px;height:auto;margin:0 auto}
.ec-bar-ax{stroke:var(--ink-2);stroke-width:1.5}
.ec-bar-top{stroke:var(--ink);stroke-width:2}
.ec-bar-tot{fill:var(--ink);font:700 15px var(--font-ui)}
.ec-seg{stroke:var(--sheet);stroke-width:1}
.ec-seg-a{fill:var(--ec-a);background:var(--ec-a)}
.ec-seg-b{fill:var(--ec-b);background:var(--ec-b)}
.ec-seg-c{fill:var(--ink-2);background:var(--ink-2)}
.ec-parts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:.9rem}
.ec-parts li{display:flex;align-items:baseline;gap:8px}
.ec-parts .ec-sw{width:14px;height:14px;border:0;border-radius:3px;align-self:center}
.ec-parts b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.ec-sread{margin-top:12px}
.ec-best{color:var(--green);font-weight:700}
.ec-revbox{margin-top:10px}
.ec-alg-steps{margin:10px 0 0;padding-left:1.3em;display:grid;gap:4px}
.ec-sch{margin:12px 0 6px;font-weight:700;font-size:.95rem}
.ec-heat{display:block;width:100%;max-width:260px;height:auto;margin:0 auto}
.ec-batt{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.ec-batt-t{fill:var(--ink)}
.ec-wire{fill:none;stroke:var(--ink-2);stroke-width:2.5}
.ec-htr{fill:none;stroke:var(--ink);stroke-width:2}
.ec-coil{fill:none;stroke:var(--ink-2);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ec-coil.hot{stroke:var(--ec-b)}
.ec-glow{fill:url(#ec-glow-g);opacity:0}
.ec-glow-s0{stop-color:var(--hi);stop-opacity:1}
.ec-glow-s1{stop-color:var(--hi);stop-opacity:0}
@media (prefers-reduced-motion:no-preference){ .ec-glow{transition:opacity .2s} }
.ec-svg-t{fill:var(--ink);font:700 14px var(--font-ui)}
.ec-svg-s{fill:var(--ink-2);font:600 11px var(--font-ui)}
@media (max-width:560px){
  .ec-ss{grid-template-columns:minmax(0,1fr)}
  .ec-bar{max-width:130px}
}

/* V11 sign chart */
.ec-sc-wrap{overflow-x:auto;position:relative}
table.ec-sct th,table.ec-sct td{padding:5px 8px;text-align:center;white-space:nowrap}
table.ec-sct tbody th{text-align:left;font-weight:600}
table.ec-sct th .m,table.ec-sct td .m{white-space:nowrap}
.ec-sc-k{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2)}
table.ec-sct .ec-sc-u{font:600 .8rem var(--font-ui);color:var(--ink-2)}
table.ec-sct .ec-sc-ar{font-size:1.25rem;line-height:1}
table.ec-sct .ec-sc-d td{font-weight:700}

/* money boxes (Solve it) */
.ec-sb{display:grid;gap:8px;margin:8px 0 0}
.ec-brow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.ec-brow label{min-width:10rem;font-weight:600}
.ec-bin .numin{width:9rem}
.ec-u{color:var(--ink-2)}

</style>

d by the price; it doesn’t add them.","_n":"3961","_k":"276e4c85"}],"hints":["What is revenue?","Number sold × price each.","`x(5 - 0.01x)`."]},{"id":"w2","skill":"Revenue","goal":4,"prompt":"A gym has 300 members paying $40 a month. Each $1 increase loses 5 members. After `n` increases, what is the revenue?","options":[{"t":"`(40 + n)(300 - n)`","why":"Each increase loses 5, so `5n`.","_n":"4971","_k":"b6794f07"},{"t":"`(40 + n)(300 - 5n)`","why":"New price × new membership.","_n":"5981","_k":"ee5a9e0e"},{"t":"`(40 - n)(300 + 5n)`","why":"The price goes up by `n` dollars and the membership goes down by `5n`.","_n":"6991","_k":"e02b5c67"},{"t":"`40(300 - 5n)`","why":"The price rises too: it’s `40 + n` after `n` increases.","_n":"7a21","_k":"b93d422d"}],"hints":["What’s the price after `n` increases?","`40 + n`; members `300 - 5n`.","Multiply."]},{"id":"w3","skill":"Derivative of k/x","goal":5,"prompt":"What is the derivative of `A(x) = x + 400/x`?","options":[{"t":"`1 - 400`","why":"Rewrite as a power first.","_n":"8a31","_k":"7a16f2b7"},{"t":"`1 + 400/x^2`","why":"`k/x = kx^{-1}`, so its derivative is `-k/x^2`.","_n":"9701","_k":"e66268bb"},{"t":"`1 - 400/x`","why":"The exponent drops to −2.","_n":"a6f1","_k":"6f0bf97a"},{"t":"`1 - 400/x^2`","why":"`400/x = 400x^{-1} -> -400x^{-2}`.","_n":"b6e1","_k":"cc1f40d1"}],"hints":["Write `400/x` as `400x^{-1}`.","Bring down −1.","`1 - 400/x^2`."]},{"id":"w4","skill":"Derivative of k/x","goal":5,"prompt":"Solve `1 - 400/x^2 = 0` for `x > 0`.","options":[{"t":"`x = 200`","why":"`x^2 = 400`.","_n":"c6d1","_k":"a3f29d7a"},{"t":"`x = 400`","why":"Take the square root.","_n":"d6c1","_k":"2c1caa46"},{"t":"`x = ±20`","why":"The question asks for `x > 0`, so only 20 counts.","_n":"e6b1","_k":"4215978a"},{"t":"`x = 20`","why":"`x^2 = 400`.","_n":"f6a1","_k":"c8ed6f39"}],"hints":["Move the fraction across.","`x^2 = 400`.","`x = 20`."]},{"id":"w5","skill":"Quadratic maximum","goal":4,"prompt":"For `R(p) = 200p - 4p^2`, which price give  at `x = 30`, so the least average cost is `A(30) = 30 + 10 + 30` = $70.","why":"`k/x = kx^{-1}`, so its derivative is `-k/x^2`.","_n":"1odf0","_k":"dd029125"},{"t":"`A′(x) = 2x + 10`.","why":"That’s `C′`, not `A′`.","_n":"1pdc0","_k":"5f1bf010"},{"t":"Step 2 is correct.","why":"`x^{-1}` differentiates to `-x^{-2}`.","_n":"1qdd0","_k":"5f32a5f6"},{"t":"`A′(x) = 1 - 900/x`.","why":"The exponent becomes −2.","_n":"1rda0","_k":"5879bbe0"}],"hints":["Rewrite `900/x` as a power.","`900x^{-1} -> -900x^{-2}`.","`x = 30`, $70."]},{"id":"e3","goal":5,"task":"A 300 km delivery: the driver earns $48/h and fuel costs `v^2/75` dollars per hour. Find the cheapest speed.","steps":["Time for the trip: 300/`v` hours.","Cost per hour: `48 + v^2/75` dollars.","Total cost: `C(v) = 300(48 + v^2/75)`.","`C′(v) = 8v > 0`, so drive as slowly as possible."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"Cost per hour must be multiplied by hours, 300/`v`.","_n":"1sdb0","_k":"51f9e7ea"},{"t":"`C(v) = 48 + v^2/75`.","why":"That’s one hour’s cost.","_n":"1td80","_k":"ddae141f"},{"t":"`C(v) = (300/v)(48 + v^2/75) = 14 400/v + 4v`; `C′ = 0` at `v = 60` km/h; cost $480.","why":"Trip cost = hours × cost per hour, and hours = distance ÷ speed.","_n":"1ud90","_k":"272f2e3c"},{"t":"`C(v) = 300v(48 + v^2/75)`.","why":"Multiply by time, not by distance × speed.","_n":"1ve60","_k":"8f06d03c"}],"hints":["What do you multiply a cost \u003cstrong>per hour\u003c/strong> by?","The number of hours, 300/`v`.","`v = 60` km/h."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the dashboard: that the best-profit price is higher than the best-revenue price, or that the fixed cost didn’t move it?"},{"id":"j2","q":"In your own words, what does it mean when marginal revenue equals marginal cost?"},{"id":"j3","q":"Explain to a friend how to set up a trip-cost problem from “cost per hour” and a distance."},{"id":"j4","q":"Which model still feels shaky (demand, average cost, or trip cost)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A bakery’s cost to make `x` cakes is `C(x) = 500 + 8x + x^2` dollars. What is `C′(10)`, and what does it mean?","options":[{"t":"$28: about the cost of making one more cake when 10 are made","why":"`C′(x) = 8 + 2x`.","_n":"1we70","_k":"82bfb76b"},{"t":"$68: the average cost per cake for 10 cakes","why":"That’s `C(10)/10`.","_n":"1xe40","_k":"3599fb3c"},{"t":"$8: the cost of each cake","why":"Only when `x = 0`; `C′` grows with `x`.","_n":"1ye30","_k":"5c533c76"},{"t":"$680: the total cost of 10 cakes","why":"That’s `C(10)`.","_n":"1ze60","_k":"bc3f0a88"}]},"b":{"prompt":"`C(x) = 300 + 5x + x^2`. What is `C′(20)`, and what does it mean?","options":[{"t":"$800: the total cost of 20 items","why":"That’s `C(20)`.","_n":"20e50","_k":"b29ebd24"},{"t":"$5: the cost of each item","why":"Only when `x = 0`; `C′` grows with `x`.","_n":"21e80","_k":"5dc8d4bc"},{"t":"$45: about the cost of one more item when 20 are made","why":"`C′(x) = 5 + 2x`.","_n":"22e70","_k":"10bd2b1b"},{"t":"$40: the average cost per item","why":"That’s `C(20)/20`.","_n":"23ea0","_k":"e040c93b"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Demand is `p = 80 - 2x` dollars and cost is `C = 20x + 100`. Which is the profit function?","options":[{"t":"`P(x) = 60x - 2x^2 - 100`","why":"`R = x(80 - 2x)`; `P = R - C`.","_n":"24e90","_k":"6153aa07"},{"t":"`P(x) = 80 - 2x - (20x + 100)`","why":"Use revenue, not price.","_n":"25dc0","_k":"ce838360"},{"t":"`P(x) = 60x - 2x^2`","why":"The $100 fixed cost is missing.","_n":"26db0","_k":"b514827a"},{"t":"`P(x) = 80x - 2x^2 + 20x + 100`","why":"Cost is subtracted.","_n":"275a2","_k":"13abd97d"}]},"b":{"prompt":"Demand `p = 120 - 3x`, cost `C = 30x + 200`. Which is the profit function?","options":[{"t":"`P(x) = 120 - 3x - (30x + 200)`","why":"Use revenue, not price.","_n":"285b2","_k":"23b267f1"},{"t":"`P(x) = 120x - 3x^2 + 30x + 200`","why":"Cost is subtracted.","_n":"295c2","_k":"1bc61f65"},{"t":"`P(x) = 90x - 3x^2 - 200`","why":"`R = x(120 - 3x)`; `P = R - C`.","_n":"2a5d2","_k":"5f448521"},{"t":"`P(x) = 90x - 3x^2`","why":"The $200 fixed cost is missing.","_n":"2b562","_k":"423c7103"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"At a production level of 60 units, `R′(60) = 12` and `C′(60) = 20`. Should the company make more than 60 units?","options":[{"t":"No: the next unit brings in about $12 but costs about $20, so profit would fall.","why":"`R′(60) \u003c C′(60)`, so `P′(60) \u003c 0`.","_n":"2c572","_k":"2cd91f54"},{"t":"No: marginal cost is positive.","why":"Marginal cost is almost always positive; compare it with `R′`.","_n":"2d582","_k":"a6192dcf"},{"t":"Yes: revenue is still increasing.","why":"Revenue rises, but cost rises faster.","_n":"2e592","_k":"af8af763"},{"t":"Yes: `R′` is positive.","why":"Compare `R′` with `C′`, not with 0.","_n":"2f622","_k":"9acf1652"}]},"b":{"prompt":"At 40 units, `R′(40) = 25` and `C′(40) = 18`. Should the company make more than 40 units?","options":[{"t":"Yes: the next unit brings in about $25 but costs about $18, so profit rises.","why":"`R′(40) > C′(40)`, so `P′(40) > 0`.","_n":"2g632","_k":"9900a529"},{"t":"Yes: because 25 > 0.","why":"Compare `R′` with `C′`.","_n":"2h602","_k":"d401afee"},{"t":"No: revenue is already at its maximum.","why":"`R′ = 25 > 0`, so revenue is still rising.","_n":"2i5f2","_k":"8701ad7c"},{"t":"No: marginal cost is positive.","why":"Marginal cost is almost always positive; compare it with `R′`.","_n":"2j5e2","_k":"f54b4f34"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A bike shop rents 60 bikes a day at $20. Each $2 increase means 3 fewer rentals. Which price gives the most revenue?","options":[{"t":"$20","why":"`R′(0) = 60 > 0`, so raising the price helps.","_n":"2k5d2","_k":"de5c6b98"},{"t":"$25","why":"That reads the increase as $1 a step; each step is $2.","_n":"2l5c2","_k":"371a27c8"},{"t":"$30","why":"`R(n) = (20 + 2n)(60 - 3n) = 1200 + 60n - 6n^2`, `R′ = 0` at `n = 5`: $30 × 45 = $1350.","_n":"2m5b2","_k":"2851b67f"},{"t":"$40","why":"That halves the rentals (`n = 10`): $40 × 30 = $1200.","_n":"2n5a2","_k":"3dd13144"}]},"b":{"prompt":"A kayak stand rents 100 kayaks a day at $20. Each $5 increase means 10 fewer rentals. Which price gives the most revenue?","options":[{"t":"$20","why":"`R′(0) > 0`.","_n":"2o592","_k":"cdca771d"},{"t":"$23","why":"Each step is $5, not $1.","_n":"2p682","_k":"0cfa6f4e"},{"t":"$35","why":"`R(n) = (20 + 5n)(100 - 10n)`, `R′ = 300 - 100n = 0` at `n = 3`: $35 × 70 = $2450.","_n":"2q672","_k":"4709d1ef"},{"t":"$45","why":"That halves the rentals.","_n":"2r896","_k":"3e1309a7"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`C(x) = 4x^2 + 20x + 900`. At what production level is the average cost least?","options":[{"t":"`x = 15`","why":"`A = 4x + 20 + 900/x`; `A′ = 4 - 900/x^2 = 0` at `x = 15` (`A` = $140).","_n":"2s886","_k":"bf08971c"},{"t":"`x = 140`","why":"$140 is the least average cost, not the level.","_n":"2t8b6","_k":"37347abe"},{"t":"`x = 225`","why":"That’s `x^2`, not `x`.","_n":"2u8a6","_k":"c26abee4"},{"t":"`x = 30`","why":"That differentiates `4x` as 1; `A′ = 4 - 900/x^2`.","_n":"2v856","_k":"0da5bcbf"}]},"b":{"prompt":"`C(x) = 2x^2 + 30x + 800`. At what production level is the average cost least?","options":[{"t":"`x = 110`","why":"$110 is the least average cost, not the level.","_n":"2w846","_k":"8b119f37"},{"t":"`x = 20`","why":"`A′ = 2 - 800/x^2 = 0` at `x = 20` (`A` = $110).","_n":"2x876","_k":"45094fe0"},{"t":"`x = 400`","why":"That’s `x^2`.","_n":"2y866","_k":"36fbef0b"},{"t":"`x = 20√2`","why":"That drops the 2 in `A′ = 2 - 800/x^2`.","_n":"2z816","_k":"1a9bfa67"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A 560 km trip: the driver earns $49/h and fuel costs `v^2/100` dollars per hour. Which speed costs least? (Speeds 40 to 100 km/h.)","options":[{"t":"35 km/h","why":"Outside the legal range, and `C′(35) \u003c 0`.","_n":"30806","_k":"b849611b"},{"t":"49 km/h","why":"Matching the speed to the wage has no basis.","_n":"31836","_k":"5922bed1"},{"t":"70 km/h","why":"`C = (560/v)(49 + v^2/100) = 27 440/v + 5.6v`; `C′ = 0` when `v^2 = 4900`. Cost $784.","_n":"32846","_k":"df615a8a"},{"t":"100 km/h","why":"`C(100)` = 274.40 + 560 = $834.40 > $784.","_n":"33816","_k":"8bf4c561"}]},"b":{"prompt":"A 480 km trip: the driver earns $36/h and fuel costs `v^2/100` dollars per hour. Which speed costs least?","options":[{"t":"100 km/h","why":"`C(100)` = 172.80 + 480 = $652.80 > $576.","_n":"34826","_k":"9fd9bd2d"},{"t":"36 km/h","why":"Matching the speed to the wage has no basis.","_n":"35876","_k":"6202f141"},{"t":"60 km/h","why":"`C′ = 0` when `v^2 = 3600`. Cost 8 h × $72 = $576.","_n":"36886","_k":"772454f2"},{"t":"30 km/h","why":"`C′(30) \u003c 0`: the cost is still falling at 30 km/h.","_n":"37856","_k":"68efe521"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why the price that maximizes \u003cstrong>revenue\u003c/strong> usually doesn’t maximize \u003cstrong>profit\u003c/strong>?","options":[{"t":"“Profit also depends on cost. At the revenue peak, raising the price a little loses almost no revenue but saves the cost of the items no longer made, so profit is still rising.”","why":"At the revenue peak one more sale adds about $0 of revenue but still costs money to make, so a slightly higher price and fewer sales raise profit.","_n":"38866","_k":"20d72bd2"},{"t":"“Revenue and profit always peak at the same price.”","why":"Revenue ignores cost. At $25 each extra sale costs $10 to make, so a higher price, fewer sales and lower costs give more profit.","_n":"397b6","_k":"d81af645"},{"t":"“Profit is greatest at the lowest price, when the most items sell.”","why":"Selling more also costs more.","_n":"3a7c6","_k":"bf82fbb0"},{"t":"“The fixed cost moves the best price.”","why":"A fixed cost doesn’t change `P′`.","_n":"3b7d6","_k":"1f7ac998"}]},"b":{"prompt":"Which is the best explanation of why raising the \u003cstrong>fixed\u003c/strong> cost doesn’t change the best price?","options":[{"t":"“Because revenue doesn’t depend on price.”","why":"Revenue does depend on price.","_n":"3c7c6","_k":"5851d93e"},{"t":"“A fixed cost subtracts the same amount from profit at every price. The profit graph moves down, but its peak stays at the same price because `P′` is unchanged.”","why":"The derivative of a constant is 0.","_n":"3d7b6","_k":"9f821c17"},{"t":"“It does change it: the price must rise to cover the cost.”","why":"A fixed cost subtracts the same amount at every price: the peak moves down, not sideways.","_n":"3e7a6","_k":"3b20ed1e"},{"t":"“Because fixed costs are zero at the maximum.”","why":"They’re the same at every price.","_n":"3f796","_k":"62fdeb85"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"A graph shows `R′(x)` and `C′(x)` crossing at `x = 50`, with `R′` above `C′` for `x \u003c 50` and below it after. Which describes the profit?","options":[{"t":"“Profit rises until `x = 50` and falls after, so the maximum profit is at `x = 50`.”","why":"`P′ = R′ - C′` changes from + to − at `x = 50`.","_n":"3g786","_k":"2a4a1fda"},{"t":"“Profit is zero at `x = 50`.”","why":"`R′ = C′` means the \u003cstrong>next\u003c/strong> item adds no profit: profit is at its peak there, not zero.","_n":"3h776","_k":"5b87a819"},{"t":"“Profit is greatest where `R′` is greatest.”","why":"`R′` is greatest at the start, where profit is still climbing.","_n":"3i766","_k":"a1414771"},{"t":"“Profit is least at `x = 50`.”","why":"`P′` changes from + to −: a maximum.","_n":"3j856","_k":"e4a02808"}]},"b":{"prompt":"`R′` and `C′` cross at `x = 120`, with `R′` above `C′` before and below after. Which describes the profit?","options":[{"t":"“Profit is greatest where `R′` is greatest.”","why":"`R′` is greatest at the start, where profit is still climbing.","_n":"3k846","_k":"1886e060"},{"t":"“Profit rises until `x = 120` and falls after: maximum profit at `x = 120`.”","why":"`P′ = R′ - C′` changes from + to − at `x = 120`.","_n":"3lf76","_k":"9b8ced55"},{"t":"“Profit is zero at `x = 120`.”","why":"`R′ = C′` means the \u003cstrong>next\u003c/strong> item adds no profit: profit is at its peak there, not zero.","_n":"3mf86","_k":"bf832768"},{"t":"“Profit is least at `x = 120`.”","why":"`P′` changes from + to −: a maximum.","_n":"3nf96","_k":"6427f346"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A club sells `x` calendars at `p = 20 - x/10` dollars each; costs are `C = 4x + 240`. Which price maximizes profit, and what is the profit?","options":[{"t":"$12 each; $640 profit","why":"Subtract the $240 fixed cost.","_n":"3ofa6","_k":"2b1de1df"},{"t":"$12 each; $400 profit","why":"`P = 16x - x^2/10 - 240`; `P′ = 0` at `x = 80`; `p = 20 - 8`.","_n":"3pf36","_k":"7df9643d"},{"t":"$80 each","why":"80 is the number of calendars.","_n":"3qf46","_k":"b6a4d4d0"},{"t":"$10 each; $360 profit","why":"That’s the revenue-maximizing price.","_n":"3rf56","_k":"1a856fb6"}]},"b":{"prompt":"`p = 30 - x/20` dollars, `C = 6x + 1000`. Which price maximizes profit, and what is the profit?","options":[{"t":"$240 each","why":"240 is the number of items.","_n":"3sf66","_k":"976fc200"},{"t":"$18 each; $1880 profit","why":"`P = 24x - x^2/20 - 1000`; `x = 240`; `p = 30 - 12`.","_n":"3tff6","_k":"b00ce604"},{"t":"$18 each; $2880 profit","why":"Subtract the $1000 fixed cost.","_n":"3u006","_k":"916acd22"},{"t":"$15 each; $1700 profit","why":"That’s the revenue-maximizing price.","_n":"3vf16","_k":"1ba3c9c6"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A battery with internal resistance 5 Ω delivers `P(R) = {100R}/{(R + 5)^2}` watts to a device of resistance `R`. Which `R` gives the most power, and how much?","options":[{"t":"`R` = 5 Ω; 5 W","why":"`P′(R) = {100(5 - R)}/{(R + 5)^3} = 0` at `R = 5`; `P = 500/100`.","_n":"3wf06","_k":"5832730d"},{"t":"`R` = 0 Ω","why":"With no resistance, no power is delivered to the device: `P(0) = 0`.","_n":"3xf36","_k":"0bb28982"},{"t":"`R` = 10 Ω","why":"`P(10) = 1000/225 \u003c 5`.","_n":"3yf26","_k":"54730486"},{"t":"`R` = 5 Ω; 20 W","why":"100 × 5/25 forgets to square `(R + 5)`.","_n":"3zf56","_k":"145cdece"}]},"b":{"prompt":"`P(R) = {64R}/{(R + 2)^2}` watts. Which `R` gives the most power, and how much?","options":[{"t":"`R` = 0 Ω","why":"`P(0) = 0`.","_n":"40f46","_k":"80816774"},{"t":"`R` = 2 Ω; 32 W","why":"Square `(R + 2)`.","_n":"41f76","_k":"964121ea"},{"t":"`R` = 4 Ω","why":"`P(4) = 256/36 \u003c 8`.","_n":"42f66","_k":"0632a254"},{"t":"`R` = 2 Ω; 8 W","why":"`P′ = 0` at `R = 2`; `P = 128/16`.","_n":"43f96","_k":"67355a51"}]}}]},"task":{"title":"Set up shop","summary":"Set up shop","statement":"\u003cp>The hoodie demand is still `x = 200 - 4p`. You choose the cost per hoodie and the fixed cost. Meet every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The conditions\u003c/h4>\u003col style=\"margin:0;padding-left:1.3em\">\u003cli>The best price (for profit) is a whole number of dollars.\u003c/li>\u003cli>The best price is between $30 and $40.\u003c/li>\u003cli>The maximum profit is between $400 and $600.\u003c/li>\u003cli>The fixed cost is at least $500.\u003c/li>\u003c/ol>\u003c/div>","inputs":{"u":"Cost per hoodie `u`","F":"Fixed cost `F`","note":"`u` goes from $0 to $40 in steps of $5; `F` from $0 to $2000 in steps of $100."},"read":{"best":"Best price","max":"Maximum profit","target":"target"},"checks":["Best price is whole dollars","Best price $30 to $40","Maximum profit $400 to $600","Fixed cost at least $500"],"tips":["`P(p) = (p - u)(200 - 4p) - F`, so `P′ = 200 + 4u - 8p` and the best price is `25 + u/2`.","For a price from $30 to $40, `u` must be from $10 to $30.","Substitute the best price: the maximum profit is `(50 - u)^2 - F`.","A bigger fixed cost lowers the maximum profit dollar for dollar."],"explainPrompt":"Explain why the best price depends on the cost per hoodie but not on the fixed cost.","vocab":"Use the words marginal cost, fixed cost, profit and derivative.","more":"There’s more than one answer. Can you find them all?","afterAll":"With `u` = $30 the best price is $40 but the maximum profit is only 400 − `F`, so any fixed cost of $500 or more makes a loss."},"cards":[["Demand function","The price `p(x)` at which `x` items sell, e.g. `p = 50 - x/4`."],["Revenue","`R(x) = x · p(x)`."],["Profit","`P(x) = R(x) - C(x)`."],["Marginal cost","`C′(x)` ≈ the cost of one more item."],["Marginal revenue","`R′(x)` ≈ the revenue from one more sale."],["Maximum profit","Where `R′(x) = C′(x)` (and `P′` changes from + to −)."],["Revenue max ≠ profit max","Hoodies: most revenue at $25, most profit at $30."],["Fixed cost","Lowers profit by the same amount everywhere; doesn’t move the best price."],["Average cost","`C(x)/x`; at its minimum it equals the marginal cost."],["Trip cost","(distance/`v`) × (cost per hour)."],["“Each $1 increase loses `k`”","`R(n)` = (price + `n`)(customers − `kn`)."],["Derivative of `k/x`","`-k/x^2`."]]}};</script>
