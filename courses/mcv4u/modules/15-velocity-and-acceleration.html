.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 15: hero equation colours, V9 motion track, Motion simulator (Explore: track / V5 panels / V11 chart), Part 3 stations,
   Practice 1 graph thumbnails, Practice 2 boxes, task */
.va-heq{display:inline-flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:6px 12px}
.va-ht{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.va-hm{white-space:nowrap}
.va-hs .m{color:var(--pen)}
.va-hv .m{color:var(--f3)}
.va-ha .m{color:var(--f4)}
.va-u{font:600 .46em/1.2 var(--font-ui);color:var(--ink-2)}
.va-arr{color:var(--ink-2);font-size:.8em;line-height:1.3}

/* V9 motion track */
.mt-box{position:relative}
.mt-c{position:absolute;inset:0;display:block;width:100%;height:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);touch-action:pan-y}
.mt-ctl{margin-top:6px}
.mt-btns{margin-top:0}
.mt-sl{margin-top:8px}
.mt-sl output{color:var(--ink)}
.mt-tip{margin:0}

/* Motion simulator */
.va-ex{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-areas:"main side" "main read";grid-template-rows:auto 1fr;gap:12px 26px;align-items:start}
.va-main{grid-area:main;min-width:0}
.va-side{grid-area:side;min-width:0}
.va-rd{grid-area:read;min-width:0}
.va-eq{font-size:clamp(1.15rem,2.6vw,1.6rem);min-height:1.5em;margin-bottom:6px}
.va-stage .va-trk{height:176px}
.va-stage.vert.m-track .va-trk{height:340px}
.va-stage.horz.m-graphs .va-trk,.va-stage.horz.m-sign .va-trk{height:122px}
.va-stage.vert.m-graphs,.va-stage.vert.m-sign{display:grid;grid-template-columns:124px minmax(0,1fr);gap:10px;align-items:start}
.va-stage.vert.m-graphs .va-trk,.va-stage.vert.m-sign .va-trk{height:340px}
.va-pn{display:grid;gap:6px;margin-top:8px}
.va-stage.vert .va-pn,.va-stage.vert .va-sc{margin-top:0}
.va-pn[hidden],.va-sc[hidden]{display:none}
canvas.plot.va-pc{aspect-ratio:16/6}
.va-tabs{display:none}
.va-tabs i{font-family:var(--font-math)}
.va-cnt{display:flex;flex-wrap:wrap;gap:2px 20px;margin:8px 0 0;font-size:.95rem;color:var(--ink-2)}
.va-cnt strong{color:var(--ink);font-size:1.08rem}
.va-note{min-height:1.3em;margin:6px 0 0;font-weight:600}
.va-mos{margin-bottom:6px}
.va-mos .chip{font-size:.86rem}
.va-mos .chip .m{font-size:1.04em}
.va-bsl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;margin:2px 0 4px}
.va-bsl output{color:var(--ink)}
.va-how{margin:8px 0 8px}
.va-tgs{margin:2px 0 4px}
.va-read dd{overflow-wrap:anywhere}

/* V11 chart */
.va-sc{margin-top:10px}
.va-sch{margin:0 0 6px;font-size:.95rem}
.va-scwrap{overflow-x:auto}
table.va-sct th,table.va-sct td{padding:5px 6px;text-align:center;white-space:nowrap;vertical-align:middle}
table.va-sct tbody th{text-align:left;font-weight:600}
table.va-sct .hl{background:var(--hi-soft)}
table.va-sct td.va-sg{font-weight:700;font-size:1.05rem}
table.va-sct td.va-pt{font:600 .78rem var(--font-ui);color:var(--ink-2);white-space:normal;min-width:3.4em}
table.va-sct td.va-mc{font:400 .85rem var(--font-ui);white-space:normal;min-width:7.2em}
.va-mch .chip{font-family:var(--font-ui)}
.va-mch{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.va-mch .chip{font-size:.8rem;padding:.2em .55em;min-height:28px;justify-content:center}
.va-ok{color:var(--green);font-weight:700}
.va-no{color:var(--red);font-weight:700}
.va-no s{color:var(--ink-2);font-weight:400}
.va-scmsg{color:var(--ink-2);margin:6px 0 0}

/* Part 3 */
.va-st h3{margin-top:0}
.va-st:first-child{margin-top:0;padding-top:0;border-top:0}
.va-tp{font-weight:600;margin:10px 0 6px}

.va-sgc{flex-wrap:nowrap;gap:4px}
.va-sgc .chip{min-width:34px;justify-content:center;font-weight:700}
.va-mot{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
.va-mot .chip{font-size:.82rem}
table.va-s1tb tr.va-bad{background:var(--bad-bg)}
table.va-s1tb tr.va-good{background:var(--good-bg)}
#va-s1tab{margin-top:10px}
.va-s2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px 24px;align-items:start;margin-top:8px}
.va-trk2{height:190px}
.va-s3{display:grid;grid-template-columns:minmax(190px,250px) minmax(0,1fr);gap:14px 24px;align-items:start;margin-top:8px}
.va-trk3{height:370px}
.va-gh{font-weight:700;margin:6px 0 4px;font-size:.88rem;color:var(--ink-2)}
.va-gh:first-child{margin-top:0}
.va-bxs{display:flex;flex-wrap:wrap;gap:8px 16px}
.va-bx{display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.va-bw{display:inline-flex;align-items:center;gap:6px}
.va-bx .numin.short{width:5.5rem}
.va-unit{color:var(--ink-2);font-size:.92rem}

.sel-bar .va-th{display:inline-block;width:110px;vertical-align:middle}

/* Practice 2 */
.va-stem{font-weight:600;margin:0 0 8px}
.va-nr .va-unit{margin-left:2px}
.va-ib{margin-top:6px}
.va-s4c{margin-top:10px}

/* task */
.vt-step{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
.vt-step label{min-width:7.5rem}
.vt-lab{font-size:1.2rem}
.vt-step .btn{min-width:40px;font-size:1.1rem}
.vt-step .numin.short{width:5.5rem}
.vt-trk{height:150px}
.vt-ctl{margin-bottom:10px}

  .va-tabs{display:inline-flex;margin:0 0 4px}

  canvas.plot.va-pc{aspect-ratio:auto;height:210px}

  table.va-s1tb tbody th{grid-column:1/-1;padding:0;border:0;background:none}
  table.va-s1tb td{padding:0;border:0;display:flex;align-items:center;gap:8px}
  table.va-s1tb td[data-l]::before{content:attr(data-l);font:italic 600 1.05rem var(--font-math);color:var(--ink-2)}

  .va-read > div{padding:3px 0}
  .vt-step label{flex-basis:100%;min-width:0}
}

>\u003cspan class=\"va-u\">m/s²\u003c/span>\u003c/span>\u003c/span>","eqLabel":"s of t, in metres; then v of t equals s prime of t, in metres per second; then a of t equals v prime of t equals s double prime of t, in metres per second squared","eqSize":"sm","headline":"Position, velocity, acceleration: one derivative apart","text":"For an object moving along a line, the derivative of \u003cstrong>position\u003c/strong> is \u003cstrong>velocity\u003c/strong>, and the derivative of velocity is \u003cstrong>acceleration\u003c/strong>. The signs tell the story: which way it’s moving, when it’s \u003cstrong>at rest\u003c/strong>, and whether it’s \u003cstrong>speeding up\u003c/strong> or \u003cstrong>slowing down\u003c/strong>.","fig":{"aria":"A dot moves along a horizontal track following s(t) = t³ − 6t² + 9t: right to 4 m, back to 0, then right again. A teal velocity arrow above it shrinks, flips and grows; a magenta acceleration arrow flips at t = 2.","shape":"wide"}},"goals":["I can find velocity and acceleration from a position function, with correct units.","I can interpret the sign of `v` (direction), `v = 0` (at rest) and speed = `|v|`.","I can decide when an object is speeding up or slowing down by comparing the signs of `v` and `a`.","I can find the total distance travelled over an interval, splitting it where the direction changes.","I can solve vertical motion problems: maximum height, time in the air and impact velocity.","I can connect `s`–`t`, `v`–`t` and `a`–`t` graphs."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Derivatives","goal":1,"prompt":"`s(t) = t^3 - 6t^2 + 9t`. Find `s′(t)`.","options":[{"t":"`t^2 - 6t + 9`","why":"Bring each exponent down.","_n":"0f8c","_k":"5d24fe67"},{"t":"`3t^2 - 12t`","why":"`9t` has derivative 9.","_n":"1f9c","_k":"c107672b"},{"t":"`3t^2 - 12t + 9t`","why":"`9t -> 9`.","_n":"2fac","_k":"a4b63680"},{"t":"`3t^2 - 12t + 9`","why":"Term by term.","_n":"3fbc","_k":"031e57ad"}],"hints":["Power rule.","`3t^2`, `-12t`, 9.","`3t^2 - 12t + 9`."]},{"id":"w2","skill":"Derivatives","goal":1,"prompt":"`f(t) = -5t^2 + 20t + 3`. Find `f″(t)`.","options":[{"t":"`-10t + 20`","why":"Differentiate again.","_n":"4fcc","_k":"dcf78bac"},{"t":"−10","why":"`f′ = -10t + 20`, then −10.","_n":"5fdc","_k":"c28469fd"},{"t":"−5","why":"`-5 · 2 = -10`.","_n":"6fec","_k":"fe9ead38"},{"t":"0","why":"`f″` is the second derivative.","_n":"7ffc","_k":"4bb7834a"}],"hints":["Find `f′` first.","`f′ = -10t + 20`.","`f″ = -10`."]},{"id":"w3","skill":"Solving quadratics","goal":2,"prompt":"Solve `3t^2 - 12t + 9 = 0`.","options":[{"t":"`t = 1` or `t = 9`","why":"Factor out 3 first: `t^2 - 4t + 3`.","_n":"800c","_k":"74081171"},{"t":"`t = 1` or `t = 3`","why":"`3(t - 1)(t - 3) = 0`.","_n":"9db2","_k":"bc0f52ea"},{"t":"`t = -1` or `t = -3`","why":"`t - 1 = 0` at `t = 1`.","_n":"ada2","_k":"ce1b59da"},{"t":"`t = 3` only","why":"Both factors can be 0.","_n":"bd92","_k":"1f11a0bd"}],"hints":["Common factor 3.","`t^2 - 4t + 3 = (t - 1)(t - 3)`.","1 or 3."]},{"id":"w4","skill":"Solving quadratics","goal":5,"prompt":"Solve `-5t^2 + 20t + 25 = 0` for `t ≥ 0`.","options":[{"t":"`t = 2`","why":"That’s where the height is greatest, not where it’s 0.","_n":"cd82","_k":"47ea2a8d"},{"t":"`t = 5`","why":"`-5(t - 5)(t + 1) = 0`; `t = -1` is rejected.","_n":"ddf2","_k":"8814c04b"},{"t":"`t = 1` or `t = -5`","why":"`t - 5 = 0` at 5.","_n":"ede2","_k":"c082f16a"},{"t":"`t = -1` or `t = 5`","why":"The question says `t ≥ 0`.","_n":"fdd2","_k":"4961d1e0"}],"hints":["Divide by −5.","`t^2 - 4t - 5 = (t - 5)(t + 1)`.","`t = 5`."]},{"id":"w5","skill":"Rates and units","goal":1,"prompt":"A cyclist is at 20 m when `t = 2` s and at 50 m when `t = 8` s. What is the average velocity?","options":[{"t":"5 m/s","why":"(50 − 20)/(8 − 2) = 30/6.","_n":"gdc2","_k":"247049e9"},{"t":"30 m/s","why":"30 m is the change in position.","_n":"he32","_k":"53b54c9a"},{"t":"6.25 m/s","why":"Use changes: `Δs/Δt`.","_n":"ie22","_k":"78643116"},{"t":"10 m/s","why":"Use both readings.","_n":"je12","_k":"9b9930ae"}],"hints":["`Δs/Δt`.","30/6.","5 m/s."]},{"id":"w6","skill":"Rates and units","goal":1,"prompt":"`s` is in metres and `t` in seconds. What are the units of `s″(t)`?","options":[{"t":"m²/s","why":"Differentiating divides by a time unit; it doesn’t square metres.","_n":"ke22","_k":"b641b648"},{"t":"m/s","why":"That’s `s′`.","_n":"ldf2","_k":"b9d14e10"},{"t":"m/s²","why":"Metres per second, per second.","_n":"me02","_k":"5cc4db7b"},{"t":"m","why":"That’s `s`.","_n":"ndd2","_k":"e08193b8"}],"hints":["Each derivative with respect to `t` divides the units by s.","m → m/s → ?","m/s²."]}],"refreshers":{"Derivatives":"Use the power rule term by term. For `f″`, differentiate twice.","Solving quadratics":"Factor out any common factor, then set each factor to 0. In motion problems, reject negative times.","Rates and units":"Average rate = `Δs/Δt`. Units divide: m per s, then m/s per s = m/s²."}}},"explore":{"heading":"Motion simulator","intro":"Play the motion and watch the dot on its track and the three graphs at once. The readout names what’s happening at every moment.","motions":[{"id":"M1","chip":"`s = t^3 - 6t^2 + 9t`","eq":"`s(t) = t^3 - 6t^2 + 9t`, `0 ≤ t ≤ 4.5`","plain":"s(t) = t³ − 6t² + 9t"},{"id":"M2","chip":"`s = t^2 - 8t + 12`","eq":"`s(t) = t^2 - 8t + 12`, `0 ≤ t ≤ 8`","plain":"s(t) = t² − 8t + 12"},{"id":"M3","chip":"vertical `h = -5t^2 + 20t + 25`","eq":"`h(t) = -5t^2 + 20t + 25`, `0 ≤ t ≤ 5` (vertical: height above the ground)","plain":"h(t) = −5t² + 20t + 25"},{"id":"M4","chip":"`s = t^3 - 12t^2 + 45t`","eq":"`s(t) = t^3 - 12t^2 + 45t`, `0 ≤ t ≤ 7`","plain":"s(t) = t³ − 12t² + 45t"},{"id":"B","chip":"Build","eq":"`s(t) = t^3 + bt^2 + ct`, `0 ≤ t ≤ 6`","plain":"s(t) = t³ + bt² + ct"}],"modes":[{"id":"track","t":"Track"},{"id":"graphs","t":"Graphs"},{"id":"sign","t":"Sign chart"}],"modeHow":{"track":"The dot moves on its track, leaving a ghost trail. The teal arrow is the velocity `v` (its length grows with the speed); the magenta arrow is the acceleration `a`.","graphs":"Linked `s`–`t`, `v`–`t` and `a`–`t` graphs share one time probe. Tap a graph to move the time.","sign":"Sign chart of `v` and `a` on the motion’s interval. Fill in the motion row (speeding up or slowing down) for each interval, then press Reveal."},"toggles":[{"id":"trail","t":"Trail"},{"id":"varr","t":"Velocity arrow"},{"id":"aarr","t":"Acceleration arrow"}],"rows":{"time":"Time","pos":"Position","vel":"Velocity","speed":"Speed","acc":"Acceleration","dir":"Direction","spd":"Speed is…","since":"Since `t = 0`"},"predIntro":"Make a prediction first. Then the simulator shows you what really happens.","predictions":[{"id":"p1","mo":"M1","prompt":"M1. At `t = 1.5` s the acceleration is −3 m/s². Is the particle speeding up or slowing down?","options":[{"t":"slowing down","_n":"ode2","_k":"2cf5edf8"},{"t":"speeding up","_n":"pdb2","_k":"2a94420b"},{"t":"at rest","_n":"qdc2","_k":"d771ef30"},{"t":"moving at constant speed","_n":"re92","_k":"8c7acade"}],"explain":"`v(1.5) = -2.25` is negative too. Same signs: speeding up."},{"id":"p2","mo":"M1","prompt":"M1. When is the particle at rest?","options":[{"t":"never","_n":"sea2","_k":"9f75c737"},{"t":"`t = 0` s and `t = 3` s","_n":"te73","_k":"7e4dc165"},{"t":"`t = 2` s","_n":"ue63","_k":"e91fa0b9"},{"t":"`t = 1` s and `t = 3` s","_n":"ve93","_k":"d2f4aada"}],"explain":"`v = 3(t - 1)(t - 3) = 0`. At `t = 2` the acceleration is 0, and at `t = 0` and 3 the position is 0; neither means at rest."},{"id":"p3","mo":"M1","prompt":"M1, played from 0 to 4. The displacement from `t = 0` to `t = 4` is `s(4) - s(0) = 4` m. What’s the total distance?","options":[{"t":"0 m","_n":"we83","_k":"efdae041"},{"t":"4 m","_n":"xeb3","_k":"97a97adc"},{"t":"8 m","_n":"yea3","_k":"c451da4e"},{"t":"12 m","_n":"zed3","_k":"3aaa2fe7"}],"explain":"Right 4 m (to `s = 4`), left 4 m (back to 0), right 4 m (to `s = 4`)."},{"id":"p4","mo":"M3","prompt":"M3, the throw. At the top of the throw, what is the ball’s acceleration?","options":[{"t":"−10 m/s²","_n":"10ec3","_k":"959d3a6d"},{"t":"undefined","_n":"11df3","_k":"fb61f5c1"},{"t":"10 m/s²","_n":"12de3","_k":"052b6f81"},{"t":"0 m/s²","_n":"13ed3","_k":"d1d0efee"}],"explain":"`a = h″ = -10` the whole time. If `a` were 0 at the top, the ball would hang there."}],"chalIntro":"Use the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"M2: set the time when the object is moving left at 4 m/s.","why":"`v = 2t - 8 = -4` at `t = 2`: the negative sign means moving left, and the speed is 4 m/s.","hints":["Moving left at 4 m/s means `v = -4`.","`2t - 8 = -4`.","`t = 2`."],"msgs":{"mo":"Choose M2 first.","t6":"`v = +4` there: moving right.","t4":"At rest.","other":"Here `v =` {v} m/s. Moving left at 4 m/s means `v = -4`."}},{"id":"tc2","goal":[2,3],"prompt":"M4: find a time when the particle is moving left \u003cstrong>and\u003c/strong> speeding up.","why":"For `3 \u003c t \u003c 4`, `v \u003c 0` (moving left) and `a \u003c 0`: the same signs, so it’s speeding up.","hints":["`v = 3(t - 3)(t - 5)`; `a = 6t - 24`.","Moving left: `3 \u003c t \u003c 5`. Speeding up needs `a \u003c 0` too.","`a \u003c 0` when `t \u003c 4`: so `3 \u003c t \u003c 4`."],"msgs":{"mo":"Choose M4 first.","slow":"Moving left, but `a > 0`: slowing down.","right":"`v > 0`: moving right.","rest":"At rest: `v = 0` here.","a0":"At `t = 4`, `a = 0`: neither speeding up nor slowing down."}},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"Build: choose `b` and `c` so that the particle is at rest exactly once, at `t = 3`, and never moves left.","why":"`b = -9`, `c = 27`: `v = 3t^2 - 18t + 27 = 3(t - 3)^2`, which is 0 only at `t = 3` and never negative.","hints":["`v = 3t^2 + 2bt + c` must be 0 only at `t = 3` and never negative.","So `v` must be `3(t - 3)^2`.","`3t^2 - 18t + 27`: `b = -9`, `c = 27`."],"msgs":{"mo":"Choose Build first, then set `b t times where `v` changes sign; add every leg’s length."],["Vertical motion","`h(t) = -5t^2 + v_0 t + h_0` (`g ≈ 10` m/s²); `a = -10` throughout."],["Maximum height","Where `v = 0`."],["Impact","Solve `h = 0` for `t > 0`, then find `v` there."]]}};</script>
