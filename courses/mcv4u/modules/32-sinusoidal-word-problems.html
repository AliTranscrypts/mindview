.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--f4:#B0286F;--f5:#A84C05}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--f4:#F49AC8;--f5:#FF9F5A}
}
:root[data-theme="dark"]{--f4:#F49AC8;--f5:#FF9F5A}
.vec.wide{padding:0 .04em}
.vec.wide::before{content:"";position:absolute;left:.08em;right:.2em;top:-.13em;border-top:.075em solid currentColor}
.vec.wide::after{content:"";left:auto;right:.04em;top:-.275em;width:0;height:0;font-size:1em;line-height:0;
border-left:.32em solid currentColor;border-top:.15em solid transparent;border-bottom:.15em solid transparent}
.lm-lim{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .14em 0 .04em;vertical-align:baseline}
.lm-lt{font-family:var(--font-math);font-style:normal;font-weight:inherit}
.lm-lu{font-size:.64em;margin-top:.12em;white-space:nowrap;font-style:normal}
.lm-lu .m{font-size:1em;white-space:nowrap}
.hero-eq .lm-lim{margin-right:.18em}
.read dt .lm-lim{font-weight:400}
.opt .lm-lim{margin-bottom:.1em}
/* MCV4U 32: hero wheel and panels, Ride the model (scenario picture, linked panels, controls, readout), Optimization with
   angles stations, Rates and times boxes, Design a Ferris wheel task. Prefix sr- (sinusoidal rates), fw- (Ferris wheel task). */
.sr-heq1{display:block;white-space:nowrap}
.sr-heq1 + .sr-heq1{margin-top:.12em}
.sr-hero{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:8px;align-items:center}
canvas.plot.sr-hw{aspect-ratio:4/5}
.sr-hg{display:flex;flex-direction:column;gap:6px;min-width:0}
canvas.plot.sr-hp{aspect-ratio:2/1}
/* Explore */
.sr-ex{display:flex;flex-direction:column;gap:14px}
.sr-main{min-width:0}
.sr-eq{min-height:1.6em}
.sr-stage{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.5fr);gap:12px 20px;align-items:start}
.sr-picw,.sr-pans{min-width:0}
canvas.plot.sr-pic{aspect-ratio:4/5}
.sr-pans{display:flex;flex-direction:column;gap:4px}
.sr-pan[hidden],#sr-fer[hidden],#sr-tid[hidden],#sr-day[hidden],.sr-tbar [hidden]{display:none}
.sr-pcap{margin:2px 0;font-size:.85rem;font-weight:700;color:var(--ink-2)}
canvas.plot.sr-pc{aspect-ratio:16/6;touch-action:none}
canvas.plot.sr-pc.sr-pc2{aspect-ratio:16/5}
.sr-key{margin:8px 0 0}
.sr-ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 28px;align-items:start}
.sr-c1,.sr-c2{min-width:0}
.sr-tbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.sr-sl{margin-top:8px}
.sr-sl input{width:100%;min-height:28px}
.sr-sl output{color:var(--ink);font-weight:700}
.sr-sl output.sr-or{color:var(--acol)}
.sr-sl output.sr-oH{color:var(--p-c)}
.sr-note{margin:4px 0 6px}
.sr-lab{font-weight:700;font-size:.85rem;margin:12px 0 4px}
.sr-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.sr-chips .chip{min-height:36px}
dl.read.sr-read{margin-top:0}
.sr-more{display:none;margin-top:6px}
/* Part 3 */
.sr-stbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.sr-st{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px 26px;align-items:start}
.sr-stl,.sr-str{min-width:0}
.sr-sth{margin:0 0 4px}
canvas.plot.sr-fig{aspect-ratio:16/10}
canvas.plot.sr-gr{aspect-ratio:16/11}
.sr-fn{margin:0 0 6px;font-weight:600}
.sr-algbox{margin-top:8px}
.sr-algbox ol{margin:0;padding-left:1.3em}
.sr-algbox li + li{margin-top:4px}
/* Practice 2 */
.sr-dt{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
.sr-dr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:1.05rem}
.sr-dl{font-weight:600;min-width:6.5rem}
.sr-du{color:var(--ink-2)}
.sr-dr .numin.short{width:8.5rem}
.sr-dr .numin.short.sr-long{width:12rem;max-width:100%}
/* task */
.fw-in{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.fw-pv{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:10px 16px;align-items:start;margin-top:10px}
.fw-w,.fw-g{min-width:0}
canvas.plot.fw-wc{aspect-ratio:4/5}
canvas.plot.fw-gc{aspect-ratio:2/1}
.fw-g{display:flex;flex-direction:column;gap:6px}
.fw-gh{font-weight:700;margin:0}
@media (max-width:820px){
  .sr-st{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:700px){
  .sr-stage,.sr-ctl{grid-template-columns:minmax(0,1fr)}
  canvas.plot.sr-pic{aspect-ratio:4/3}
  .sr-read .sr-x{display:none}
  .sr-read.sr-open .sr-x{display:block}
  .sr-more{display:inline-flex}
}
@media (max-width:560px){
  .sr-hero{grid-template-columns:minmax(0,1fr)}
  canvas.plot.sr-hw{aspect-ratio:4/3}
  canvas.plot.sr-pc{aspect-ratio:5/3}
  canvas.plot.sr-pc.sr-pc2{aspect-ratio:16/7}
  .fw-pv{grid-template-columns:minmax(0,1fr)}
  canvas.plot.fw-wc{aspect-ratio:4/3}
}

20`.","_n":"1mdbc","_k":"7a4850a1"},{"t":"`h′(t) = (8π/20) sin(πt/20) = (2π/5) sin(πt/20)`, so `h′(5) = π√2/5 ≈ 0.89` m/s.","why":"The inside `πt/20` has derivative `π/20`.","_n":"1ndac","_k":"c4e9193e"}],"hints":["What’s the inside function?","`πt/20`, with derivative `π/20`.","`(2π/5) sin(πt/20)`."]},{"id":"e2","goal":5,"task":"Depth `d(t) = 2 cos(πt/6) + 6` (m, `t` in hours). When in `0 ≤ t ≤ 12` is the water falling fastest?","steps":["`d′(t) = -(π/3) sin(πt/6)`.","Falling fastest means `d′` is as negative as possible.","That happens when `sin(πt/6) = -1`.","So `πt/6 = 3π/2` and `t = 9` h."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"When `sin(πt/6) = 0`, so `t = 6` h.","why":"That’s low tide: rate 0.","_n":"1odbc","_k":"0a738087"},{"t":"Step 3 is correct.","why":"`-(π/3)(-1) = +π/3`: that’s rising fastest.","_n":"1pd8c","_k":"72d6e4ca"},{"t":"`d′` is most negative when `sin(πt/6) = +1`, so `t = 3` h, falling at `π/3` m/h.","why":"`-(π/3)(+1) = -π/3`: the most negative rate.","_n":"1qd9c","_k":"18046aed"},{"t":"When `cos(πt/6) = -1`.","why":"That gives the minimum depth, not the fastest fall.","_n":"1rdec","_k":"e9c6f519"}],"hints":["Substitute sin = −1 into step 1. What sign do you get?","`+π/3`: rising.","sin = +1: `t = 3` h."]},{"id":"e3","goal":6,"task":"Maximize `A(θ) = 18 sin θ(1 + cos θ)` for `0 ≤ θ ≤ π/2`.","steps":["`A′ = 18[cos θ(1 + cos θ) - sin^2 θ]`.","`= 18[2cos^2 θ + cos θ - 1]`.","`= 18(2 cos θ - 1)(cos θ + 1)`.","So `cos θ = 1/2` or `cos θ = 1`.","`θ = π/3` or `θ = 0`; the maximum is at `θ = 0`."],"_a":"Vg==","stepFb":["Step 1 is correct: product rule.","Step 2 is correct: `sin^2 θ = 1 - cos^2 θ`.","Step 3 factors correctly.","","Step 5 follows from step 4."],"fixes":[{"t":"Divide by `(cos θ + 1)` first.","why":"Legal here, but it hides why `θ = π` is rejected.","_n":"1sdfc","_k":"2df72f8f"},{"t":"`cos θ = -1/2` or 1.","why":"`2 cos θ - 1 = 0` gives `+1/2`.","_n":"1tdcc","_k":"ef1db999"},{"t":"`cos θ + 1 = 0` gives `cos θ = -1` (`θ = π`, outside the interval). Only `θ = π/3` remains: `A(π/3) = 27√3/2`, larger than `A(0) = 0` and `A(π/2) = 18`.","why":"Check the allowed angles, and compare the critical value with the endpoints.","_n":"1uddc","_k":"ac4f1738"},{"t":"Step 4 is correct.","why":"`cos θ + 1 = 0` means `cos θ = -1`.","_n":"1vd2c","_k":"31d4da0e"}],"hints":["Solve `cos θ + 1 = 0` carefully.","`cos θ = -1` at `θ = π`.","Reject `π`; compare `A(π/3)` with the endpoints."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the Ferris wheel: that the rider rises fastest at the axle height, not at the top?"},{"id":"j2","q":"In your own words, why does the amplitude times 2π/period give the fastest rate?"},{"id":"j3","q":"Explain to a friend how to find the times when a tide is falling fastest."},{"id":"j4","q":"Which step still trips you up: the chain-rule factor, the sign, or reading the answer in context? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`h(t) = 4 sin(πt/5) + 6`. Which is `h′(t)`?","options":[{"t":"`4 cos(πt/5)`","why":"The inside `πt/5` has derivative `π/5`. Multiply by it.","_n":"1wd3c","_k":"59f75396"},{"t":"`-(4π/5) cos(πt/5)`","why":"`d/dt sin = +cos`.","_n":"1x60c","_k":"d461771c"},{"t":"`(4π/5) cos(πt/5)`","why":"`4 · cos(πt/5) · π/5`.","_n":"1y5fc","_k":"f4ea6f1d"},{"t":"`(4π/5) cos(πt/5) + 6`","why":"The axle height lifts the whole graph; the derivative of a constant is 0.","_n":"1z62c","_k":"07b1ebbc"}]},"b":{"prompt":"`h(t) = 3 cos(πt/4) + 8`. Which is `h′(t)`?","options":[{"t":"`-3 sin(πt/4)`","why":"The inside `πt/4` has derivative `π/4`. Multiply by it.","_n":"2061c","_k":"6b4a7fa4"},{"t":"`(3π/4) sin(πt/4)`","why":"`d/dt cos u = -sin u · u′`.","_n":"215cc","_k":"ff2c9216"},{"t":"`-(3π/4) sin(πt/4)`","why":"`3 · (-sin(πt/4)) · π/4`.","_n":"225bc","_k":"9bc5eb4b"},{"t":"`-(3π/4) sin(πt/4) + 8`","why":"The axle height lifts the whole graph; the derivative of a constant is 0.","_n":"235ec","_k":"41c66566"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Where on a sinusoidal model is the rate of change zero?","options":[{"t":"Only at the maximum","why":"Minimums too: the graph turns there.","_n":"245dc","_k":"801c1ae4"},{"t":"Nowhere: the graph never stops changing","why":"At a turning point the tangent is horizontal.","_n":"2558c","_k":"d5fc960d"},{"t":"At the axis","why":"That’s where the rate is largest.","_n":"2657c","_k":"9c93a9b9"},{"t":"At every maximum and minimum","why":"The graph turns there, so the tangent is horizontal.","_n":"27c6a","_k":"544468e6"}]},"b":{"prompt":"Where on a sinusoidal model is the rate of change largest in size?","options":[{"t":"At every maximum","why":"At the top the height stops increasing: `h′ = 0`. The rate is largest at the axis.","_n":"28c7a","_k":"d8e9ff9f"},{"t":"At `t = 0`","why":"That depends on the start, not on the shape.","_n":"29c8a","_k":"bc16e00d"},{"t":"Where the graph crosses its axis","why":"The rate peaks at the points of inflection, on the axis.","_n":"2ac9a","_k":"24a71f6b"},{"t":"Halfway between a maximum and the axis","why":"The rate is largest at the axis itself.","_n":"2bcaa","_k":"215625f7"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"What is the fastest rate of change of `h(t) = 5 sin(πt/10) + 9`?","options":[{"t":"5","why":"Multiply the amplitude by `k = π/10`.","_n":"2ccba","_k":"2127fdb9"},{"t":"14","why":"That’s the maximum height.","_n":"2dcca","_k":"f0582e6f"},{"t":"`π/2`","why":"`|a|k = 5 × π/10`.","_n":"2ecda","_k":"919b2902"},{"t":"`π/10`","why":"That’s `k` alone.","_n":"2fcea","_k":"feb02757"}]},"b":{"prompt":"What is the fastest rate of change of `h(t) = 8 cos(πt/6) + 10`?","options":[{"t":"18","why":"That’s the maximum height.","_n":"2gcfa","_k":"330a5259"},{"t":"8","why":"Multiply the amplitude by `k = π/6`.","_n":"2h4ca","_k":"56e66816"},{"t":"`4π/3`","why":"`8 × π/6`.","_n":"2i4ba","_k":"8b45acc9"},{"t":"`π/6`","why":"That’s `k` al
