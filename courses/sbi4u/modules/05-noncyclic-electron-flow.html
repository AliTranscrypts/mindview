.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}

.omoves{display:flex;flex-direction:column;gap:4px}

.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}

.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}

.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 05: Z-scheme (S2), membrane view (S4), cyclic loop, Emerson zoom, ATP bars (S3), ordering, accounting, task, hero.
   Module tokens: --nz-lumen (lumen tint: ink-2 over the sheet), --nz-core (lipid core). Particles: electrons --bio-e, H⁺ --bio-h,
   NADPH --bio-nadh, O₂ and H₂O --bio-o2 (blue), ATP --bio-atp. Lamps and photons in ink; flashes --hi; fluorescence a --red halo,
   always labelled in text; inhibitors a dark ink "block" icon. */
:root{--nz-lumen:color-mix(in srgb,var(--ink-2) 18%,var(--sheet));--nz-core:color-mix(in srgb,var(--ink-2) 9%,var(--sheet))}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--nz-lumen:color-mix(in srgb,var(--ink-2) 15%,var(--sheet));--nz-core:color-mix(in srgb,var(--ink-2) 8%,var(--sheet))}
}
:root[data-theme="dark"]{--nz-lumen:color-mix(in srgb,var(--ink-2) 15%,var(--sheet));--nz-core:color-mix(in srgb,var(--ink-2) 8%,var(--sheet))}

/* radio groups (from SBI4U 03 / 01 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* centrepiece layout */
.nz-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.nz-stage svg{display:block;width:100%;height:auto}
.nz-mscroll{overflow-x:auto;max-width:100%;border-radius:8px}
.nz-stage-m{min-width:520px}
.nz-cap{margin:8px 0 4px;font-size:.92rem;min-height:2.6em}
.nz-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.nz-legend span{display:inline-flex;align-items:center;gap:5px}
.nz-legend svg{width:14px;height:14px;flex:none}
.nz-abbr{display:block}
.nz-fs{border:0;margin:0;padding:0;min-width:0;display:grid;gap:12px}
.nz-fs:disabled{opacity:.7}
.nz-row{min-width:0}
.nz-lamprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px}
.nz-lamplab{font-size:.92rem}
.nz-btns{display:inline-flex;flex-wrap:wrap;gap:6px}
.nz-cont[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.nz-tc3{border-top:1px solid var(--rule);padding-top:10px}
.nz-tc3 h4{margin:0 0 6px;font-size:.95rem}
.nz-tc3 .numrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px;margin:4px 0}
.nz-tc3 .numin{width:6.5em}
.nz-hl{background:var(--hi-soft);color:inherit;padding:0 .15em;border-radius:3px}
.nz-model{margin-top:18px}
.nz-rules{margin:10px 0 8px;padding-left:1.2em;display:grid;gap:6px}

/* challenge 1: carrier chips */
.nz-path{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.nz-pi{margin:0 0 6px;font-weight:700;font-size:.92rem}
.nz-pchips{display:flex;flex-wrap:wrap;gap:6px}
.nz-pchip{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.25em .75em;font-size:.88rem;min-height:34px}
.nz-pchip:disabled{opacity:.45;text-decoration:line-through}
.nz-trail{margin:8px 0 6px;font-size:.92rem;overflow-wrap:anywhere}
.nz-trail-l{font-weight:700;color:var(--ink-2)}
.nz-pbtns{display:inline-flex;gap:6px}

/* SVG: the Z and the membrane */
.nz-axis{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.nz-ah{stroke-dasharray:none !important;stroke-linejoin:round}
.nz-axis.nz-ah{fill:none}
.nz-line{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.nz-line.nz-ah{fill:none;stroke-width:2.2}
.nz-up{stroke:var(--ink);stroke-width:2.8;fill:none;stroke-linecap:round}
.nz-up.nz-ah{fill:none}
.nz-thin{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:4 3;fill:none}
.nz-thin.nz-ah{fill:none}
.nz-route{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3;fill:none;opacity:.8}
.nz-route.nz-ah{fill:none}
.nz-loop{stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:6 4;fill:none;opacity:.7}
.nz-loop.on{stroke:var(--ink);stroke-width:2.4;opacity:1}
.nz-loop.nz-ah{fill:none}
.nz-lvl{stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:3 2}
.nz-node{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.nz-node.miss{stroke:var(--ink-2);stroke-dasharray:3 3}
.nz-lab{font:700 13px var(--font-ui);fill:var(--ink)}
.nz-lab-s{font-size:11.5px}
.nz-sub{font:600 10.5px var(--font-ui);fill:var(--ink-2)}
.nz-tokt{font:700 10.5px var(--font-ui);fill:var(--sheet)}
.nz-tok-o{fill:var(--bio-o2)}
.nz-tok-h{fill:var(--bio-h)}
.nz-tok-n{fill:var(--bio-nadh)}
.nz-tok-k{fill:var(--ink)}
.nz-e{fill:var(--bio-e);stroke:var(--sheet);stroke-width:1.2}
.nz-pip{fill:var(--sheet);stroke:var(--bio-o2);stroke-width:1.3}
.nz-pip.on{fill:var(--bio-o2)}
.nz-glow{fill:var(--hi)}
.nz-lamp{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.nz-lamp.on{fill:var(--hi)}
.nz-lbase{fill:var(--ink)}
.nz-lampt{font:700 10px var(--font-ui);fill:var(--ink)}
.nz-rays{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;fill:none}
.nz-photon{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.nz-photon.thin{stroke-width:1.1}
.nz-block circle{fill:var(--ink)}
.nz-block rect{fill:var(--sheet)}
.nz-blockt{font:700 10.5px var(--font-ui);fill:var(--ink)}
.nz-halo{fill:none;stroke:var(--red);stroke-width:2.4;stroke-dasharray:3 2}
.nz-halo-t{font:700 10.5px var(--font-ui);fill:var(--red)}
.nz-num circle{fill:var(--ink)}
.nz-numt{font:700 11px var(--font-ui);fill:var(--sheet)}
.nz-stroma{fill:var(--leaf-fill)}
.nz-core{fill:var(--nz-core)}
.nz-lumen{fill:var(--nz-lumen)}
.nz-mline{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.nz-cx{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.5}
.nz-seat{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
.nz-hdot{fill:var(--bio-h)}
.nz-bart{fill:var(--paper);stroke:var(--rule)}
.nz-barf{fill:var(--ink-2)}

/* Part 3 */
.nz-p3 h3{margin-top:0}
.nz-st + .nz-s2,.nz-s2 + .nz-st{margin-top:24px}
.nz-st + .nz-s2{margin-top:24px}
.nz-tblw{margin:10px 0 4px;max-width:420px}
.nz-tbl{border-collapse:collapse;width:100%}
.nz-tbl th,.nz-tbl td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:left}
.nz-tbl td{text-align:right;font-variant-numeric:tabular-nums}
.nz-tbl tbody tr:last-child th,.nz-tbl tbody tr:last-child td{border-bottom:0}
.nz-s2b{margin:10px 0}
.nz-s2b .numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.nz-s2b .numin{width:6em}
.nz-concl{margin-top:14px;border-bottom:0}
.nz-zoom{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.nz-zoom h4{margin:0 0 8px}
.nz-stage-zoom{max-width:560px;margin-top:10px}
.nz-s3ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin:8px 0 12px}
.nz-stepper{display:inline-flex;align-items:center;gap:8px}
.nz-step-l{font-weight:700}
.nz-stepper output{min-width:2ch;text-align:center;font-weight:700;font-size:1.1rem}
.nz-bars{display:grid;gap:10px;margin:10px 0}
.nz-bar{display:grid;grid-template-columns:minmax(6.5em,auto) minmax(0,1fr);grid-template-areas:"l t" "l v";gap:2px 12px;align-items:center}
.nz-bar-l{grid-area:l;font-weight:700;font-size:.92rem}
.nz-bar-t{grid-area:t;position:relative;height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--rule);overflow:visible}
.nz-bar-t i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .25s}
.nz-bar-v{grid-area:v;font-size:.86rem}
.nz-need{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2.5px dashed var(--ink)}
.nz-f-n{background:var(--bio-nadh)}
.nz-f-h{background:var(--bio-h)}
.nz-f-a{background:var(--bio-atp)}
.nz-f-o{background:var(--bio-o2)}
.nz-f-p{background:var(--ink-2)}
.nz-s3msg{min-height:1.5em;font-weight:600}
@media (prefers-reduced-motion:reduce){.nz-bar-t i{transition:none}}

/* phones: larger SVG text (user units scale down with the diagram) */
@media (max-width:600px){
  .nz-lab{font-size:15px}.nz-lab-s{font-size:13px}.nz-sub,.nz-halo-t,.nz-blockt{font-size:12.5px}
  .nz-stage-m .nz-lab{font-size:13px}.nz-stage-m .nz-sub{font-size:11.5px}
}

/* practice */
.nz-unit{color:var(--ink-2);font-size:.9rem}

/* task */
.nz-reqs{margin:6px 0 10px;padding-left:1.4em}
.nz-tin{display:grid;gap:12px;margin:12px 0}
.nz-trow label{font-weight:700;display:block;margin-bottom:4px}
.nz-trow output{font-size:1.1rem}
.nz-tctl{display:flex;align-items:center;gap:8px}
.nz-tctl input[type=range]{flex:1;min-width:0}

/* hero */
.nz-hero{width:100%}
.nz-hero svg{display:block;width:100%;height:auto;background:var(--sheet);border:1.5px solid var(--rule);border-radius:8px}

<body>

rt-chain","title":"The Electron Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"944ac881","content":{"id":"05-noncyclic-electron-flow","kind":"topic","title":"Noncyclic electron flow","topic":"Noncyclic Electron Flow","readyTopic":"noncyclic electron flow","hero":{"headline":"One electron, two boosts of light","text":"Light lifts an electron at \u003cstrong>photosystem II\u003c/strong>. It slides downhill through a chain of carriers, giving up energy to pump H⁺, until \u003cstrong>photosystem I\u003c/strong> lifts it again, high enough to reach \u003cstrong>NADP⁺\u003c/strong> and make \u003cstrong>NADPH\u003c/strong>. The electron PSII lost is replaced by splitting \u003cstrong>water\u003c/strong>, which releases the O₂ you breathe.","fig":{"html":"\u003cdiv class=\"nz-hero\" id=\"nz-hero\" role=\"img\" aria-label=\"The Z-scheme, an energy diagram. Electron energy rises upward. Water gives an electron to P680 in photosystem II; light lifts it up the first stroke of the Z; it slides down through plastoquinone, cytochrome b6f (which pumps H+ into the lumen) and plastocyanin to P700 in photosystem I; a second flash of light lifts it to the top; it slides through ferredoxin and NADP+ reductase to NADP+, making NADPH. After four electrons, two water molecules have been split and one O2 is released.\">\u003c/div>"}},"goals":["I can trace an electron’s path in noncyclic flow, naming each carrier in order, and explain the Z-scheme.","I can explain photolysis: why water is split, and what becomes of its electrons, H⁺ and oxygen.","I can count photons, electrons, NADPH, O₂ and H⁺ for any amount of noncyclic flow.","I can predict the effect of blocking a carrier, or removing NADP⁺, on O₂ and NADPH production.","I can compare cyclic and noncyclic flow and explain why plants need both."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Photosystems","goal":1,"prompt":"In a photosystem, what does the reaction centre do when it receives energy from the antenna?","options":[{"t":"Sends an excited electron to the primary electron acceptor","why":"Module 03.","_n":"0e44","_k":"b5cb8581"},{"t":"Makes ATP","why":"ATP synthase makes ATP (module 06).","_n":"1e34","_k":"0acfeb0c"},{"t":"Releases O₂ directly","why":"O₂ comes from splitting water, a separate step.","_n":"2e24","_k":"a09f39fe"},{"t":"Sends energy back to the antenna","why":"Energy flows inward, toward the reaction centre.","_n":"3e14","_k":"50f60518"}],"hints":["What’s special about the reaction centre?","It’s where an electron actually leaves.","It goes to the primary acceptor."]},{"id":"w2","skill":"Photosystems","goal":1,"prompt":"Which type of molecule forms the reaction centre of a photosystem?","options":[{"t":"Chlorophyll \u003ci>a\u003c/i>","why":"A special pair of chlorophyll \u003ci>a\u003c/i> molecules.","_n":"4e04","_k":"feba3879"},{"t":"Carotene","why":"An accessory pigment in the antenna.","_n":"5df4","_k":"e1f7dba6"},{"t":"NADP⁺","why":"NADP⁺ is the final electron acceptor, far down the chain.","_n":"6de4","_k":"5a4e78ee"},{"t":"Chlorophyll \u003ci>b\u003c/i>","why":"Chlorophyll \u003ci>b\u003c/i> is in the antenna.","_n":"7ed4","_k":"75524a91"}],"hints":["Which pigment is the main photosynthetic pigment?","Module 02 called it the main one.","Chlorophyll \u003ci>a\u003c/i>."]},{"id":"w3","skill":"Light reactions’ inputs and outputs","goal":2,"prompt":"Which molecule is the source of the O₂ released in photosynthesis?","options":[{"t":"CO₂","why":"Labelled CO₂ never labels the O₂.","_n":"8ec4","_k":"9469b639"},{"t":"Water","why":"Shown with ¹⁸O tracers (module 04).","_n":"9da9","_k":"d4196a21"},{"t":"Glucose","why":"Glucose is a product.","_n":"adb9","_k":"f862678d"},{"t":"NADPH","why":"NADPH contains no O₂ to release.","_n":"bd89","_k":"c43f0770"}],"hints":["Recall the tracer experiments.","Labelled water gave labelled O₂.","Water."]},{"id":"w4","skill":"Light reactions’ inputs and outputs","goal":1,"prompt":"Which two energy carriers do the light reactions make for the Calvin cycle?","options":[{"t":"NADH and FADH₂","why":"Those are respiration’s carriers (Unit 2).","_n":"cd99","_k":"e2db1070"},{"t":"Glucose and O₂","why":"Glucose is made in the Calvin cycle; O₂ is a by-product.","_n":"dde9","_k":"fde925db"},{"t":"ADP and NADP⁺","why":"Those are the empty forms that come back.","_n":"edf9","_k":"eb59677d"},{"t":"ATP and NADPH","why":"The light reactions load ATP and NADPH; the Calvin cycle spends them (module 04).","_n":"fdc9","_k":"e50d68cc"}],"hints":["Module 04’s conveyor.","One stores energy in phosphate bonds; one carries electrons.","ATP and NADPH."]},{"id":"w5","skill":"Energy and electrons","goal":1,"prompt":"When an electron moves ‘downhill’ from one carrier to the next, it…","options":[{"t":"releases some energy, which can be used for work","why":"Like water falling through a turbine.","_n":"gdd9","_k":"b228ee92"},{"t":"gains energy","why":"Gaining energy is ‘uphill’; that needs light here.","_n":"he29","_k":"66d96c67"},{"t":"disappears","why":"Electrons are passed on, not destroyed.","_n":"ie39","_k":"3d248b6b"},{"t":"turns into a proton","why":"Electrons and protons are different particles.","_n":"j749","_k":"c6f757c5"}],"hints":["Think of a ball rolling down stairs.","Each step releases energy.","It releases energy."]},{"id":"w6","skill":"Energy and electrons","goal":2,"prompt":"A molecule that \u003cstrong>gains\u003c/strong> electrons is said to be…","options":[{"t":"excited","why":"Excited means an electron is raised in energy, not gained.","_n":"k739","_k":"36441ec7"},{"t":"reduced","why":"Gaining electrons is reduction (module 11 covers redox in depth).","_n":"l729","_k":"60dfa9e6"},{"t":"split","why":"Splitting is a different event.","_n":"m719","_k":"becea447"},{"t":"oxidized","why":"Oxidized means losing electrons.","_n":"n709","_k":"3887d16d"}],"hints":["Remember OIL RIG.","Reduction Is Gain.","Reduced."]}],"refreshers":{"Photosystems":"The antenna funnels energy to a reaction-centre chlorophyll \u003ci>a\u003c/i> pair, which sends an excited electron to the primary acceptor.","Light reactions’ inputs and outputs":"Inputs: light, water, ADP + Pᵢ, NADP⁺. Outputs: O₂, ATP, NADPH.","Energy and electrons":"Downhill electron moves release energy; light provides the uphill moves. Gaining electrons is reduction: NADP⁺ is reduced to NADPH."}}},"explore":{"heading":"The Z-scheme climb","intro":"Flash light at each photosystem and follow electrons from water to NADPH. Add an inhibitor or run out of NADP⁺, and see where the chain jams.","pathIntro":"Challenge 1: tap the carriers in the order an electron visits them.","pathParts":[["h2o","H₂O"],["psii","PSII (P680)"],["pq","plastoquinone"],["b6f","cytochrome b₆f"],["pc","plastocyanin"],["psi","PSI (P700)"],["fd","ferredoxin"],["fnr","NADP⁺ reductase"],["nadp","NADP⁺"]],"legendAbbr":"\u003cstrong>PQ\u003c/strong> plastoquinone · \u003cstrong>b₆f\u003c/strong> cytochrome b₆f complex · \u003cstrong>PC\u003c/strong> plastocyanin · \u003cstrong>Fd\u003c/strong> ferredoxin · \u003cstrong>FNR\u003c/strong> NADP⁺ reductase","modelTitle":"How the model counts","modelRules":["\u003cstrong>Lamp A flash\u003c/strong> (680 nm, mostly PSII): P680 sends one electron to plastoquinone, which passes it to b₆f (1 H⁺ pumped into the lumen), then to plastocyanin, where it waits. P680⁺ refills from water: +1 H⁺ released into the lumen, and the water-splitting cluster gains one ‘step’. Every 4th step splits 2 H₂O and releases 1 O₂.","\u003cstrong>Lamp B flash\u003c/strong> (700 nm, mostly PSI): if P700 holds an electron, it sends it to ferredoxin, then to NADP⁺ reductase. P700⁺ then takes the waiting electron from plastocyanin if there is one. If not, it stays empty: ‘P700 is waiting for an electron from PSII.’","\u003cstrong>NADPH:\u003c/strong> each 2 electrons at NADP⁺ reductase + 1 H⁺ from the stroma + NADP⁺ make 1 NADPH. If NADP⁺ is used up, electrons back up at ferredoxin, and further PSI flashes give ‘energy lost as heat and fluorescence’.","\u003cstrong>DCMU:\u003c/strong> PSII flashes excite P680, but the electron can’t reach plastoquinone. No water is split and no O₂ is released; the energy is lost as fluorescence.","\u003cstrong>Plastocyanin missing:\u003c/strong> electrons stop at b₆f; PSI fires once, then waits.","Each carrier is empty or holds one electron (NADP⁺ reductase collects two). A flash that can’t be used is counted as energy lost, not as a photon absorbed. Continuous lamps flash 4 times per second, alternating A then B when both are on.","\u003cstrong>Starting state\u003c/strong> after Reset: P700 holds one electron and every other carrier is empty."],"modelNote":"Simplified model values: 1 H⁺ per electron at b₆f and 4 H⁺ per ATP, so the arithmetic works by hand. Real values are about 2 H⁺ at b₆f (with the Q cycle) and about 4.7 H⁺ per ATP; module 06 covers the gradient itself. Real light excites both photosystems to some degree: Lamp A and Lamp B are teaching simplifications. Part 3 shows Emerson’s data.","tc3Title":"Counter boxes (challenge 3)","tc3Boxes":[["nadph","NADPH made"],["photons","Photons absorbed"],["h2o","H₂O split"],["hplus","H⁺ added to the lumen"]],"predIntro":"Make a prediction first. Then the Z-scheme will show you what really happens.","predictions":[{"id":"p1","start":{"run":"p1"},"prompt":"\u003cspan class=\"muted\">After Reset, press Lamp B \u003cstrong>Flash\u003c/strong> three times (Lamp A off).\u003c/span> What will happen?","options":[{"t":"One electron moves to ferredoxin, then PSI waits for an electron from PSII","_n":"o6f9","_k":"78896cc6"},{"t":"Three electrons reach NADP⁺, making NADPH","_n":"p6e9","_k":"4be60ed1"},{"t":"O₂ is released","_n":"q6d9","_k":"037438d5"},{"t":"Electrons flow backwards to water","_n":"r6c9","_k":"2d9afead"}],"explain":"PSI can only send an electron if it gets one back, and those come from PSII."},{"id":"p2","start":{"run":"p2"},"prompt":"\u003cspan class=\"muted\">Both lamps Continuous; then DCMU.\u003c/span> What happens to O₂ release and NADPH production?","options":[{"t":"NADPH stops, O₂ continues","_n":"s6b9","_k":"fba5e829"},{"t":"O₂ stops, NADPH continues","_n":"t6e9","_k":"5864533d"},{"t":"Neither changes","_n":"u6f9","_k":"e73d3347"},{"t":"Both stop","_n":"v709","_k":"3a0f3242"}],"explain":"With PSII cut off, water isn’t split (no O₂), and no electrons reach PSI (no NADPH)."},{"id":"p3","start":{"run":"p3"},"prompt":"\u003cspan class=\"muted\">Both lamps Continuous; NADP⁺ supply → Used up.\u003c/span> What happens to electron flow?","options":[{"t":"It speeds up","_n":"w719","_k":"e46511dd"},{"t":"Electrons go to O₂ instead","_n":"x6a9","_k":"fb0ea775"},{"t":"It backs up and stops, and energy is lost as heat and fluorescence","_n":"y6b9","_k":"5e3c5c14"},{"t":"Nothing changes","_n":"z6c9","_k":"83992cf5"}],"explain":"With no final acceptor, there’s nowhere for electrons to go."},{"id":"p4","start":{"run":"p4"},"prompt":"How many photons does it take to make one NADPH?","options":[{"t":"1","_n":"106d9","_k":"ab6840c5"},{"t":"2","_n":"11669","_k":"dc73152a"},{"t":"4","_n":"12679","_k":"095e794b"},{"t":"8","_n":"13689","_k":"a3407b8e"}],"explain":"2 electrons per NADPH × 2 photons per electron. (Reset, then 2 A-flashes and 2 B-flashes give NADPH 1; P700’s starting electron carries the first.)"}],"chalIntro":"Use the Z-scheme (challenge 1: the carrier chips under the diagram; challenge 3: the counter boxes under the controls), then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Tap the carriers in the order an electron visits them, from water to NADP⁺.","why":"H₂O → PSII (P680) → plastoquinone → cytochrome b₆f → plastocyanin → PSI (P700) → ferredoxin → NADP⁺ reductase → NADP⁺.","general":"Tap all nine carrier chips under the diagram, in order. Press Clear to start again.","hints":["Start where the electrons come from.","PSII → PQ → b₆f → PC → PSI.","Then ferredoxin → NADP⁺ reductase → NADP⁺."]},{"id":"tc2","goal":[1,3],"prompt":"From Reset, make exactly 3 NADPH using the fewest flashes. \u003cspan class=\"muted\">(After Reset, P700 already holds one electron.)\u003c/span>","why":"5 A-flashes and 6 B-flashes (11 flashes). Each successful B-flash delivers one electron, so 6 electrons reach NADP⁺ reductase. The first was already waiting at P700, so only 5 had to come from PSII.","hints":["3 NADPH need 6 electrons.","Each electron needs a PSI flash to reach NADP⁺, and every one after the first needs a PSII flash to refill P700.","6 B-flashes and 5 A-flashes."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"A long run with no inhibitors released exactly 3 O₂. Set the counter boxes to what the run must have shown: NADPH made, photons absorbed, H₂O split and H⁺ added to the lumen. Ignore the starting electron.","why":"3 O₂ means 12 electrons: 12 e⁻ → 6 NADPH, 24 photons, 6 H₂O, 24 H⁺.","hints":["3 O₂ means how many electrons?","4 per O₂: 12 electrons.","12 e⁻ → 6 NADPH, 24 photons, 6 H₂O, 24 H⁺."]}]},"part3":{"slug":"cyclic","name":"Cyclic","heading":"Cyclic vs noncyclic","intro":"The Explore chain runs one way, from water to NADPH. Here you’ll add a loop around PSI, check the evidence for two photosystems, and work out why the loop matters for the Calvin cycle.","s1":{"title":"Station 1: the cyclic route","how":"Choose a route, then run Lamp B (PSI only). Watch the counters: which ones rise?","banner":"Cyclic flow pumps H⁺ for ATP, but it makes no NADPH and splits no water.","stall":"Without the loop, PSI stalls: P700 is waiting for an electron from PSII."},"s2":{"title":"Station 2: Check it with data — two photosystems","how":"Robert Emerson’s two-light experiments measured O₂ release from algae lit with red light, far-red light, or both at once.","head":["Light","O₂ rate (model units)"],"rows":[["650 nm (red) alone","10"],["710 nm (far red) alone","4"],["Both together","20"]],"boxes":[{"id":"sum","label":"Sum of the separate rates","_a":"CAA=","wrong":[{"match":20,"fb":"20 is the rate with both lights together. Add the two separate rates."}]},{"id":"extra","label":"Extra from using both together","_a":"Dw==","wrong":[{"match":10,"fb":"Compare with 10 + 4 = 14."},{"match":14,"fb":"14 is the sum. How much more is 20 than 14?"}]}],"concl":{"prompt":"Which conclusion do the data support?","options":[{"t":"Two photosystems, absorbing different wavelengths, work in series","why":"Each light excites mostly one photosystem; together the chain runs fully, so the rate beats the sum.","_n":"14679","_k":"2f21a00d"},{"t":"Red light is simply brighter, so it adds more O₂","why":"Brightness can’t explain why the pair beats the sum of the two alone.","_n":"156a9","_k":"dca5eeb1"},{"t":"Far-red light damages the leaf, so it lowers the rate","why":"Far red alone still gave some O₂, and adding red raised the rate far above the sum.","_n":"16699","_k":"107e84fe"},{"t":"Two lamps warm the algae, speeding up every enzyme","why":"Warmth would raise both separate rates too; the boost appears only when the two wavelengths work together.","_n":"176c9","_k":"65307431"}]},"zoomTitle":"Zoom to the molecules","zoom":{"red":"650 nm (red) excites both photosystems, but PSII more than PSI. PSI can’t keep up, so the chain runs at half speed.","far":"710 nm (far red) excites mostly PSI and hardly PSII. P700 soon waits for electrons, so little water is split.","both":"Together, each photosystem gets the light it absorbs best. The chain runs fully, and O₂ release jumps to 20."},"zoomNote":"Model: the O₂ rate follows the slower photosystem (PSII and PSI work in series)."},"s3":{"title":"Station 3: the ATP budget","how":"The Calvin cycle needs \u003cstrong>3 ATP and 2 NADPH\u003c/strong> per CO₂ (module 08). Model counts: 2 H⁺ per noncyclic electron, 1 H⁺ per cyclic trip, 4 H⁺ per ATP. Four noncyclic electrons are already running. Add cyclic trips until the ATP bar reaches 3.","done":"3 ATP and 2 NADPH: exactly what one CO₂ needs. The 4 cyclic trips added 4 H⁺, one more ATP, and no NADPH.","note":"Real numbers differ (about 3 H⁺ per electron, about 4.7 H⁺ per ATP), but linear flow alone still falls short of 3 ATP per 2 NADPH."},"quickCheck":{"title":"Quick check","summary":"Cyclic quick check","items":[{"id":"q1","goal":5,"prompt":"Which does cyclic flow produce?","choices":[{"t":"O₂ and NADPH","fb":"Cyclic flow only moves H⁺ (to make ATP). No water is split and no NADP⁺ is reduced.","_n":"186b9","_k":"3607b697"},{"t":"NADPH only","fb":"Cyclic flow only moves H⁺ (to make ATP). No water is split and no NADP⁺ is reduced.","_n":"196e9","_k":"dd3d2369"},{"t":"H⁺ gradient (for ATP) only","fb":"Cyclic flow only moves H⁺ (to make ATP). No water is split and no NADP⁺ is reduced.","_n":"1a6d9","_k":"49bbf247"},{"t":"O₂ only","fb":"Cyclic flow only moves H⁺ (to make ATP). No water is split and no NADP⁺ is reduced.","_n":"1b609","_k":"9900599f"}]},{"id":"q2","goal":5,"prompt":"Which photosystem takes part in cyclic flow?","choices":[{"t":"Neither","fb":"Electrons loop from PSI back to PSI.","_n":"1c5f9","_k":"296de9b9"},{"t":"Both","fb":"Electrons loop from PSI back to PSI.","_n":"1de29","_k":"7a74120a"},{"t":"PSII only","fb":"Electrons loop from PSI back to PSI.","_n":"1ee39","_k":"f8ee0356"},{"t":"PSI only","fb":"Electrons loop from PSI back to PSI.","_n":"1fe09","_k":"dad20591"}]},{"id":"q3","goal":1,"prompt":"Emerson’s two lights together gave more than the sum of each alone. Why?","choices":[{"t":"Far red damages PSII","fb":"Each light excites mostly one photosystem; together the chain runs fully.","_n":"1ge19","_k":"ad4c9b02"},{"t":"The plant was warmer","fb":"Each light excites mostly one photosystem; together the chain runs fully.","_n":"1hde9","_k":"c3794b22"},{"t":"Red light is brighter","fb":"Each light excites mostly one photosystem; together the chain runs fully.","_n":"1idf9","_k":"44cc5134"},{"t":"Two photosystems work in series","fb":"Each light excites mostly one photosystem; together the chain runs fully.","_n":"1jdc9","_k":"766b5a79"}]},{"id":"q4","goal":5,"prompt":"Why do plants need cyclic flow?","choices":[{"t":"To top up ATP for the Calvin cycle","fb":"Linear flow alone makes slightly too little ATP.","_n":"1kdd9","_k":"1a067177"},{"t":"To make more O₂","fb":"Linear flow alone makes slightly too little ATP.","_n":"1lea9","_k":"4abc8769"},{"t":"To split CO₂","fb":"Linear flow alone makes slightly too little ATP.","_n":"1meb9","_k":"0ba5f85b"},{"t":"To make extra NADPH","fb":"Linear flow alone makes slightly too little ATP.","_n":"1ndc8","_k":"8772521d"}]}]}},"practice":{"activities":[{"id":"steps","type":"custom","title":"Put the steps in order","summary":"Put the steps in order","goal":[1,2],"instruction":"Put each sequence of events in the order it happens.","how":"Tap a step, then use Move up and Move down to put it in place. Press Check when the order is right.","sequences":[{"id":"sa","goal":1,"prompt":"An electron’s trip from PSII to NADPH.","steps":["Light excites P680 in PSII.","The excited electron passes to the primary acceptor, then to plastoquinone.","Plastoquinone carries it to cytochrome b₆f, which pumps H⁺ into the lumen.","Plastocyanin carries it to PSI.","Light excites P700, and its electron passes to ferredoxin.","NADP⁺ reductase transfers 2 electrons and an H⁺ to NADP⁺.","NADPH is formed in the stroma."],"start":[4,1,6,0,3,5,2],"rules":[{"first":[0,1],"then":[4,5,6],"fb":"The electron reaches PSI only after travelling from PSII."}],"why":"PSII → plastoquinone → b₆f → plastocyanin → PSI → ferredoxin → NADP⁺ reductase → NADPH.","hints":["What starts everything?","Light at PSII.","PSII → PQ → b₆f → PC → PSI → ferredoxin → NADP⁺ reductase."]},{"id":"sb","goal":2,"prompt":"Replacing PSII’s electrons: photolysis.","steps":["P680 loses an electron and becomes P680⁺.","P680⁺ pulls an electron from water.","After four electrons, two water molecules have been split.","Four H⁺ are released into the lumen.","One O₂ molecule is released."],"start":[4,2,0,3,1],"rules":[{"first":[1,2],"then":[4],"fb":"O₂ forms when water is split."}],"why":"Every electron P680 loses is replaced from water; four replacements split 2 H₂O, releasing 4 H⁺ and 1 O₂.","hints":["What does P680 need after it sends an electron away?","A replacement electron, pulled from water.","P680⁺ → electron from water → 2 H₂O split after four electrons → 4 H⁺ → O₂."]}]},{"id":"accounting","type":"custom","title":"Electron accounting and inhibitors","summary":"Electron accounting","star":true,"goal":[3,4],"instruction":"Six problems on counting and on blocked chains. The ★ problems are non-routine.","how":"","items":[{"id":"z1","kind":"num","goal":3,"prompt":"How many electrons must flow for one O₂ to be released?","_a":"DQ==","display":"4 electrons","unit":"electrons","wrong":[{"match":2,"fb":"2 H₂O → 4H⁺ + 4e⁻ + O₂."}],"hints":["Write out photolysis.","2H₂O → 4H⁺ + 4e⁻ + O₂.","4 electrons for each O₂."]},{"id":"z2","kind":"num","goal":3,"prompt":"How many photons are needed to make 5 NADPH?","_a":"CwQ=","display":"20 photons","unit":"photons","wrong":[{"match":10,"fb":"Each electron needs 2 photons, and each NADPH needs 2 electrons."}],"hints":["How many electrons does 5 NADPH need?","5 × 2 = 10 electrons.","10 electrons × 2 photons = 20 photons."]},{"id":"z3","kind":"sel","goal":4,"star":true,"prompt":"Atrazine, a herbicide used on Ontario corn fields, blocks electrons from PSII reaching plastoquinone. In a sprayed weed, select \u003cstrong>all\u003c/strong> that happen.","options":[{"t":"O₂ release stops","why":"Water isn’t split if PSII can’t pass its electrons on.","_n":"1odb8","_k":"332244ba"},{"t":"NADPH production stops","why":"Without PSII’s electrons, PSI has nothing to send.","_n":"1pda8","_k":"43343ee6"},{"t":"PSII’s fluorescence increases","why":"Energy PSII absorbs but can’t use comes back out as fluorescence.","_n":"1qd98","_k":"ebfbf90b"},{"t":"PSI keeps making NADPH from water","why":"Without PSII’s electrons, PSI has nothing to send.","_n":"1re08","_k":"1c0863ed"}],"fb":"Without PSII’s electrons, PSI has nothing to send.","hints":["Where is the block?","Right after PSII: everything downstream starves.","O₂ stops, NADPH stops, and PSII’s unused energy comes out as fluorescence."]},{"id":"z4","kind":"mc","goal":4,"star":true,"prompt":"A copper shortage leaves a plant with little plastocyanin. Where do electrons pile up, and what state is P700 left in?","options":[{"t":"Nowhere; P700 keeps working normally","why":"Plastocyanin is the link to PSI.","_n":"1sdf8","_k":"28b56505"},{"t":"At ferredoxin; P700 left holding an electron","why":"Plastocyanin is the link to PSI.","_n":"1tde8","_k":"aa84e5e9"},{"t":"At cytochrome b₆f (and plastoquinone); P700 left oxidized (P700⁺, waiting)","why":"Plastocyanin is the link to PSI.","_n":"1udd8","_k":"44e0451e"},{"t":"At NADP⁺ reductase; P700 left excited (P700*)","why":"Plastocyanin is the link to PSI.","_n":"1ve48","_k":"b95f0485"}],"hints":["Which carrier does plastocyanin pass electrons to?","PSI: without it, electrons stop just before, at b₆f.","Electrons pile up at b₆f and plastoquinone; P700 sends its electron and waits as P700⁺."]},{"id":"z5","kind":"num","goal":4,"star":true,"prompt":"Emerson data: red light alone gives 10, far red alone gives 4, both together give 20. By how much does the combined rate beat the sum of the separate rates?","_a":"Dw==","display":"6 model units","unit":"units","wrong":[{"match":10,"fb":"Compare with 10 + 4 = 14."},{"match":14,"fb":"14 is the sum. How much more is 20?"}],"hints":["First add the separate rates.","10 + 4 = 14.","20 − 14 = 6."]},{"id":"z6","kind":"mc","goal":4,"star":true,"prompt":"A herbicide grabs electrons from PSI’s acceptor side, before ferredoxin, and passes them to O₂ instead (mechanism only). Which result follows?","options":[{"t":"Both stop","why":"The chain from water through PSI still runs; only the last step is stolen.","_n":"1we38","_k":"bd0c1867"},{"t":"O₂ stops, but NADPH continues","why":"The chain from water through PSI still runs; only the last step is stolen.","_n":"1xd68","_k":"cc33ed26"},{"t":"NADPH stops, but O₂ release from water continues","why":"The chain from water through PSI still runs; only the last step is stolen.","_n":"1yd78","_k":"c9cd2301"},{"t":"Neither changes","why":"The chain from water through PSI still runs; only the last step is stolen.","_n":"1zd88","_k":"d950c012"}],"hints":["Where in the chain is the block?","After PSI: everything before it still runs.","Water is still split (O₂ continues); NADP⁺ gets no electrons."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Bashir","how":"","instruction":"Bashir made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Describe noncyclic electron flow.","steps":["Light first excites photosystem I, because it’s number one.","Its electron passes to plastoquinone, then cytochrome b₆f.","Then on to the other photosystem and finally to NADP⁺."],"_a":"CQ==","stepFb":["","Step 2 follows step 1’s mistake.","Step 3 follows."],"fixes":[{"t":"Light first excites photosystem II (P680); the numbers record the order of discovery.","why":"PSII hands electrons to plastoquinone; PSI hands them to ferredoxin.","_n":"20d98","_k":"2e086533"},{"t":"Light excites both at once, and they don’t connect.","why":"PSII hands electrons to plastoquinone; PSI hands them to ferredoxin.","_n":"21da8","_k":"6fd03311"},{"t":"Light first excites cytochrome b₆f.","why":"PSII hands electrons to plastoquinone; PSI hands them to ferredoxin.","_n":"22db8","_k":"46be7069"},{"t":"Step 1 is correct.","why":"PSII hands electrons to plastoquinone; PSI hands them to ferredoxin.","_n":"23dc8","_k":"7f416429"}],"hints":["Which photosystem splits water?","PSII.","So PSII must come first."]},{"id":"e2","goal":2,"task":"Explain photolysis and its products.","steps":["When light excites P680, it loses an electron.","P680⁺ is a strong oxidizer that pulls electrons from water.","Water is split: 2H₂O → 4H⁺ + 4e⁻ + O₂.","The O₂ is then used to make NADPH."],"_a":"Cg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct.","why":"NADPH contains no oxygen from O₂.","_n":"24dd8","_k":"4167abe9"},{"t":"The O₂ is used to make glucose.","why":"NADPH contains no oxygen from O₂.","_n":"25de8","_k":"7aee3281"},{"t":"The O₂ is released as a by-product; NADPH is made from NADP⁺, electrons and H⁺.","why":"NADPH contains no oxygen from O₂.","_n":"26df8","_k":"cc012c86"},{"t":"The O₂ goes into ATP.","why":"NADPH contains no oxygen from O₂.","_n":"27f0b","_k":"08251ef6"}],"hints":["What does the leaf do with photosynthesis’s O₂?","Releases it.","NADPH comes from NADP⁺."]},{"id":"e3","goal":3,"task":"How many photons are needed to make one NADPH?","steps":["Each NADPH needs 2 electrons.","Each electron is excited once, at PSII.","So one NADPH needs 2 photons."],"_a":"CA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"Look at the Z: two uphill strokes.","_n":"28efb","_k":"4606dc86"},{"t":"Each NADPH needs 1 electron.","why":"Look at the Z: two uphill strokes.","_n":"29f2b","_k":"feb56d6a"},{"t":"Each electron is excited twice, at PSII and at PSI, so one NADPH needs 4 photons.","why":"Look at the Z: two uphill strokes.","_n":"2af1b","_k":"20f244da"},{"t":"Each electron is excited once, at PSI.","why":"Look at the Z: two uphill strokes.","_n":"2becb","_k":"01afa939"}],"hints":["How many uphill strokes does the Z have?","Two.","2 photons × 2 electrons = 4."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you: PSI stalling on its own, or one herbicide stopping NADPH while O₂ kept coming?"},{"id":"j2","q":"In your own words, why does the plant split water at all?"},{"id":"j3","q":"Explain to a friend how to work out the photons needed for a given amount of NADPH."},{"id":"j4","q":"Which carrier or step are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In noncyclic flow, which photosystem passes its electron on first?","options":[{"t":"Photosystem I (P700)","why":"Its number reflects the order of discovery, not the order of flow.","_n":"2cebb","_k":"b827eeb5"},{"t":"Neither: plastoquinone absorbs the light first","why":"Plastoquinone is a carrier, not a pigment.","_n":"2deeb","_k":"75ac1345"},{"t":"Both at the same moment, independently","why":"They work in series.","_n":"2eedb","_k":"d24639e1"},{"t":"Photosystem II (P680)","why":"Electrons go through PSII first, then PSI.","_n":"2fe8b","_k":"f968cebd"}]},"b":{"prompt":"Which molecule is the final electron acceptor in noncyclic flow?","options":[{"t":"NADP⁺","why":"NADP⁺ reductase hands the electrons to NADP⁺, making NADPH.","_n":"2ge7b","_k":"9bfc262b"},{"t":"Water","why":"Water gives electrons; it doesn’t accept them.","_n":"2heaa","_k":"9f14d8e4"},{"t":"O₂","why":"O₂ is the final acceptor in cellular respiration, not here.","_n":"2ieba","_k":"7967d84e"},{"t":"Plastocyanin","why":"Plastocyanin is a middle carrier.","_n":"2je8a","_k":"9ebb226b"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Where do the electrons that replace those lost by P680 come from?","options":[{"t":"NADPH","why":"NADPH is at the far end of the chain.","_n":"2ke9a","_k":"e00f0b97"},{"t":"Water","why":"Photolysis: 2H₂O → 4H⁺ + 4e⁻ + O₂.","_n":"2leea","_k":"75511a8f"},{"t":"CO₂","why":"CO₂ is used in the Calvin cycle.","_n":"2mefa","_k":"9aa24fde"},{"t":"Photosystem I","why":"PSI receives electrons; it doesn’t supply PSII.","_n":"2neca","_k":"4d536dc4"}]},"b":{"prompt":"What is released when water is split at PSII?","options":[{"t":"CO₂ and H⁺","why":"There’s no carbon in water.","_n":"2oeda","_k":"2289ad9a"},{"t":"NADPH","why":"NADPH is made at the other end of the chain.","_n":"2pe2a","_k":"b439400f"},{"t":"Glucose","why":"Glucose is made in the Calvin cycle.","_n":"2qe3a","_k":"c47b03f3"},{"t":"O₂ and H⁺ (its electrons go to P680)","why":"2H₂O → 4H⁺ + 4e⁻ + O₂: the electrons refill P680.","_n":"2r682","_k":"e6661958"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"Which carrier delivers electrons from cytochrome b₆f to photosystem I?","options":[{"t":"Ferredoxin","why":"Ferredoxin takes electrons from PSI.","_n":"2s692","_k":"58aa2f67"},{"t":"Plastoquinone","why":"Plastoquinone carries from PSII to b₆f.","_n":"2t662","_k":"ad4b11a3"},{"t":"Plastocyanin","why":"Plastocyanin, a copper protein in the lumen, carries electrons from b₆f to PSI.","_n":"2u672","_k":"e034b354"},{"t":"NADP⁺ reductase","why":"That’s the last enzyme.","_n":"2v642","_k":"f9f9d383"}]},"b":{"prompt":"Which carrier moves electrons from photosystem II to cytochrome b₆f?","options":[{"t":"NADP⁺ reductase","why":"That’s the last enzyme.","_n":"2w652","_k":"57c5f5c7"},{"t":"Plastoquinone","why":"Plastoquinone moves through the membrane from PSII to b₆f.","_n":"2x622","_k":"8c05d268"},{"t":"Plastocyanin","why":"Plastoquinone: PSII → b₆f (in the membrane). Plastocyanin: b₆f → PSI (in the lumen). Ferredoxin: after PSI.","_n":"2y632","_k":"835a3857"},{"t":"Ferredoxin","why":"Plastoquinone: PSII → b₆f (in the membrane). Plastocyanin: b₆f → PSI (in the lumen). Ferredoxin: after PSI.","_n":"2z702","_k":"4d58e968"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"How many photons are absorbed, and how many NADPH are made, for each O₂ released in noncyclic flow?","options":[{"t":"4 photons; 2 NADPH","why":"Each electron needs 2 photons.","_n":"30712","_k":"762558a4"},{"t":"4 photons; 1 NADPH","why":"Each electron is boosted twice, at PSII and at PSI: 2 photons per electron.","_n":"31ee2","_k":"687d8473"},{"t":"8 photons; 2 NADPH","why":"4 electrons × 2 photons; 4 electrons ÷ 2.","_n":"32ed2","_k":"35f54506"},{"t":"8 photons; 4 NADPH","why":"Each NADPH takes 2 electrons.","_n":"33f02","_k":"a9a4377d"}]},"b":{"prompt":"To make 4 NADPH, how many photons are absorbed and how many O₂ are released?","options":[{"t":"16 photons; 4 O₂","why":"O₂ needs 4 electrons each.","_n":"34ef2","_k":"d79ad569"},{"t":"8 photons; 1 O₂","why":"Each electron is boosted twice, at PSII and at PSI: 2 photons per electron.","_n":"35f22","_k":"8c3119c9"},{"t":"16 photons; 2 O₂","why":"8 electrons × 2 photons; 8 ÷ 4.","_n":"36f12","_k":"dd0c9552"},{"t":"8 photons; 2 O₂","why":"Each electron is boosted twice, at PSII and at PSI: 2 photons per electron.","_n":"37f42","_k":"1bdf82ed"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"DCMU blocks electrons from passing from PSII to plastoquinone. In lit thylakoids with DCMU, which result follows?","options":[{"t":"NADPH stops, but O₂ continues.","why":"Water isn’t split if PSII can’t pass its electrons on.","_n":"38f32","_k":"85014851"},{"t":"O₂ stops, but NADPH continues because PSI is still lit.","why":"P700 has to get back an electron for every one it sends. Those come from PSII, through plastocyanin.","_n":"39e62","_k":"3ca6e1f4"},{"t":"O₂ release and NADPH production both stop.","why":"With PSII cut off, water isn’t split (no O₂), and no electrons reach PSI (no NADPH).","_n":"3ae52","_k":"dd1c07a0"},{"t":"Neither changes, because DCMU acts after PSI.","why":"It acts right after PSII.","_n":"3b5c2","_k":"bee80ae2"}]},"b":{"prompt":"A herbicide takes electrons from PSI’s acceptor side before they reach ferredoxin. Which result follows?","options":[{"t":"O₂ stops, but NADPH continues.","why":"That’s backwards.","_n":"3c5d2","_k":"4b4a45e8"},{"t":"Both stop.","why":"Everything before PSI still runs.","_n":"3d5e2","_k":"a58e0a2e"},{"t":"Neither changes.","why":"NADP⁺ gets no electrons.","_n":"3e5f2","_k":"cb879800"},{"t":"NADPH production stops, but O₂ release continues.","why":"The chain from water through PSI still runs; only the last step is stolen.","_n":"3f602","_k":"476c8f03"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Thylakoids are lit only with far-red light (710 nm), which excites PSI but hardly PSII. After a brief burst, NADPH production stops. Why?","options":[{"t":"PSI splits water too slowly.","why":"PSI doesn’t split water at all.","_n":"3g612","_k":"1c7479f4"},{"t":"The NADP⁺ runs out immediately.","why":"Only a brief burst was made.","_n":"3h622","_k":"6fdc715c"},{"t":"Far-red light damages PSI.","why":"PSI works; it’s starved.","_n":"3i632","_k":"a61077a0"},{"t":"P700 can’t be refilled, because almost no electrons arrive from PSII.","why":"PSI sends the electrons it holds, then waits: its replacements must come from PSII.","_n":"3j642","_k":"39093893"}]},"b":{"prompt":"A mutant plant lacks working PSI but has normal PSII. In light, what happens?","options":[{"t":"Nothing at all happens, even briefly.","why":"PSII can push a few electrons into the empty carriers first.","_n":"3k652","_k":"dcc8a83c"},{"t":"It makes NADPH normally using PSII alone.","why":"PSII alone can’t lift electrons high enough to reach NADP⁺: PSI’s boost is needed.","_n":"3l622","_k":"c82515d8"},{"t":"It makes NADPH but no O₂.","why":"NADPH needs PSI.","_n":"3m612","_k":"39a80c46"},{"t":"A little O₂ is released until the carriers between the photosystems fill up; then flow stops and no NADPH is made.","why":"PSII can fill the empty carriers, but with no PSI nothing drains them.","_n":"3n602","_k":"94b648bb"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why water must be split in noncyclic flow?","options":[{"t":"“Water is split to make the O₂ that NADPH needs.”","why":"O₂ is a by-product of splitting water. NADPH’s electrons come from water, via both photosystems.","_n":"3o5f2","_k":"abdcee9e"},{"t":"“Water is split to provide carbon for sugar.”","why":"Water has no carbon.","_n":"3p662","_k":"310dffd8"},{"t":"“Every electron that leaves P680 must be replaced. Water supplies the replacements, releasing H⁺ and O₂ as it does.”","why":"Photolysis replaces P680’s electrons; O₂ and H⁺ are released along the way.","_n":"3q652","_k":"f97d8e01"},{"t":"“Water is split to cool the chloroplast.”","why":"Splitting water doesn’t cool anything.","_n":"3r642","_k":"a8837a58"}]},"b":{"prompt":"Which is the best explanation of why this pathway is called ‘noncyclic’?","options":[{"t":"“Because it makes ATP only.”","why":"That describes cyclic flow.","_n":"3s632","_k":"1aeee072"},{"t":"“Because it doesn’t involve light.”","why":"It needs light at both photosystems.","_n":"3t6a2","_k":"dd88f927"},{"t":"“Electrons travel one way, from water to NADPH, and never return to where they started.”","why":"Water → PSII → PSI → NADPH: the electrons end up in NADPH.","_n":"3u692","_k":"e61fce59"},{"t":"“Because it happens only once in a leaf’s life.”","why":"It runs continuously in light.","_n":"3v603","_k":"680db0ab"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which description of the Z-scheme is correct?","options":[{"t":"“Light lifts an electron at PSII; it releases energy as it falls through carriers to PSI; light lifts it again at PSI, then it passes to NADP⁺.”","why":"Two uphill boosts by light, with a downhill run between them.","_n":"3w613","_k":"1d15693c"},{"t":"“Light lifts electrons from NADPH up to water.”","why":"The direction is water → NADPH.","_n":"3x5e3","_k":"ee7e73e5"},{"t":"“Light lifts an electron once at PSI, and it falls to PSII and then to NADP⁺.”","why":"The numbers record the order of discovery. Electrons go through PSII first, then PSI.","_n":"3y5f3","_k":"f8655bbf"},{"t":"“Electrons gain energy at cytochrome b₆f.”","why":"Energy is released there, used to pump H⁺.","_n":"3z643","_k":"2fc96e3b"}]},"b":{"prompt":"Which best explains why the diagram has the shape of a Z?","options":[{"t":"“It shows electrons looping back to PSI.”","why":"That’s cyclic flow.","_n":"40653","_k":"66480d99"},{"t":"“It shows one long uphill climb from water to NADP⁺.”","why":"Each electron is boosted twice, at PSII and at PSI: 2 photons per electron.","_n":"41623","_k":"5c4fb807"},{"t":"“It shows two uphill boosts by light (at PSII and PSI) with a downhill run between them.”","why":"Each boost is one stroke of the Z; the fall between them releases energy.","_n":"42633","_k":"861eafaa"},{"t":"“It shows the layout of the thylakoid membrane.”","why":"It’s an energy diagram, not a map.","_n":"43683","_k":"1e82f49f"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Runoff carrying a PSII-blocking herbicide reaches a stream. Predict the effect on the stream’s algae.","options":[{"t":"Their O₂ release and NADPH production fall, so their growth slows.","why":"With PSII blocked, water isn’t split and no electrons reach NADP⁺, so the algae make less sugar.","_n":"44693","_k":"3c94caee"},{"t":"They make extra NADPH to compensate.","why":"Find where the block is: everything downstream loses electrons, and everything upstream backs up.","_n":"45663","_k":"e99c509f"},{"t":"Only their respiration stops.","why":"The herbicide targets photosynthesis.","_n":"46653","_k":"b9b8dd3b"},{"t":"Nothing, because algae don’t have PSII.","why":"Algae photosynthesize like plants.","_n":"47683","_k":"bb270afb"}]},"b":{"prompt":"A PSII-blocking herbicide makes sensitive weeds’ leaves fluoresce more brightly. A resistant weed’s fluorescence stays normal after spraying. Which explanation fits?","options":[{"t":"The resistant weed makes NADPH without PSI.","why":"P700 has to get back an electron for every one it sends. Those come from PSII, through plastocyanin.","_n":"48673","_k":"ab92e6cf"},{"t":"The resistant weed has no chlorophyll.","why":"Then it couldn’t photosynthesize.","_n":"49623","_k":"af7b7d8f"},{"t":"In the resistant weed, electrons still flow from PSII to plastoquinone, so absorbed energy isn’t wasted as fluorescence.","why":"Fluorescence rises only when PSII’s electrons can’t move on; in the resistant weed they still can.","_n":"4a613","_k":"1370ac3b"},{"t":"Fluorescence only depends on the weather.","why":"The difference is between weeds in the same weather.","_n":"4b643","_k":"be0eaa5e"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"The Calvin cycle needs 3 ATP and 2 NADPH per CO₂. Using the module’s model (2 H⁺ per noncyclic electron, 1 H⁺ per cyclic trip, 4 H⁺ per ATP), how many cyclic trips are needed to top up the ATP for one CO₂?","options":[{"t":"1","why":"One trip moves 1 H⁺, which isn’t a whole ATP.","_n":"4c633","_k":"f69f1dc8"},{"t":"2","why":"That’s 2 H⁺: half an ATP.","_n":"4d6e3","_k":"b4dab9ad"},{"t":"4","why":"4 noncyclic electrons give 2 NADPH and 8 H⁺ (2 ATP); 1 more ATP needs 4 H⁺ = 4 cyclic trips.","_n":"4e6d3","_k":"aec848de"},{"t":"8","why":"That would give 2 extra ATP.","_n":"4ff42","_k":"81073f05"}]},"b":{"prompt":"For 2 CO₂ (6 ATP and 4 NADPH), how many cyclic trips are needed with the same model?","options":[{"t":"2","why":"Count H⁺, not ATP.","_n":"4gf52","_k":"16debd99"},{"t":"4","why":"That tops up only 1 ATP.","_n":"4hf62","_k":"357ac699"},{"t":"8","why":"8 noncyclic electrons give 4 NADPH and 16 H⁺ (4 ATP); 2 more ATP need 8 H⁺.","_n":"4if72","_k":"4cd4e82a"},{"t":"16","why":"That would give 4 extra ATP.","_n":"4jf02","_k":"178017fd"}]}}]},"task":{"title":"Feed the Calvin cycle","summary":"Feed the Calvin cycle","statement":"\u003cp>The Calvin cycle wants to fix 2 CO₂, which needs \u003cstrong>4 NADPH and 6 ATP\u003c/strong>. Choose how much noncyclic and cyclic flow to run. Can you find every answer?\u003c/p>\u003col class=\"nz-reqs\">\u003cli>Exactly the NADPH needed: 4 NADPH.\u003c/li>\u003cli>Enough ATP: at least 6.\u003c/li>\u003cli>Photon budget: at most 26 photons.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">\u003cspan class=\"bio-model\">Model\u003c/span> Counts from Explore: NADPH = \u003ci>P\u003c/i>. H⁺ = 4\u003ci>P\u003c/i> + \u003ci>C\u003c/i>; ATP = whole number of (H⁺ ÷ 4). Photons = 4\u003ci>P\u003c/i> + \u003ci>C\u003c/i>. O₂ = \u003ci>P\u003c/i> ÷ 2. (\u003ci>P\u003c/i>: noncyclic electron pairs, 0–8. \u003ci>C\u003c/i>: cyclic trips, 0–16.)\u003c/p>","checks":["Exactly 4 NADPH","At least 6 ATP","Within the photon budget"],"tips":["Each noncyclic pair makes one NADPH; the cycle wants exactly 4.","Four noncyclic pairs give 16 H⁺, only 4 ATP. Cyclic trips add H⁺ without NADPH.","Every trip costs a photon. Don’t overspend."],"after3":"In (4, 9) and (4, 10), the extra 1 or 2 H⁺ isn’t wasted: it carries over toward the next ATP.","explainPrompt":"Explain why the cycle can’t be fed by noncyclic flow alone, and what cyclic flow adds.","vocab":"Use the words noncyclic, cyclic, NADPH, ATP and H⁺ gradient.","more":"There’s more than one answer. Can you find another?"},"cards":[["Noncyclic electron flow","Electrons flow one way: H₂O → PSII → PQ → b₆f → PC → PSI → ferredoxin → NADP⁺ reductase → NADPH."],["P680","Reaction centre of photosystem II; light excites it first."],["P700","Reaction centre of photosystem I; light excites it second."],["Photolysis","2H₂O → 4H⁺ + 4e⁻ + O₂, at PSII. Source of photosynthesis’s O₂."],["Plastoquinone (PQ)","Mobile carrier in the membrane: PSII → cytochrome b₆f."],[
