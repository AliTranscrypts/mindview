.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 21 Structure and Replication: S5 dnaDraw strands, builder slots, S1 zoom, forkView, evidence stations, density tube,
   label quiz, puzzles, task. Tokens only. DNA roles (course plan §3): template / parent --ink, second parent --ink-2,
   new DNA --pen, RNA primer --bio-h (magenta), mRNA --bio-nadh. */
/* radio groups (copied from SBI4U 15) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* sequences in a monospace font */
.dn-sq{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-size:.95em;letter-spacing:.02em;white-space:nowrap}
.hero .hero-eq .dn-heq{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.15;font-size:.9em}
.dn-heq .dn-sq{font-size:1em}
.dn-heqb{display:flex;gap:0;padding-left:2.35ch;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;color:var(--ink-2);font-size:.75em;line-height:1}
.dn-heqb i{font-style:normal;width:2ch;text-align:left}
.dn-heq2{color:var(--ink-2)}
.dn-hero{max-width:460px;margin:0 auto}

/* SVG pieces (dnaDraw) */
.dn-svg{display:block;width:100%;height:auto;overflow:visible}
.dn-r-tpl{--dn:var(--ink)}
.dn-r-cod{--dn:var(--ink-2)}
.dn-r-new{--dn:var(--pen)}
.dn-r-pri{--dn:var(--bio-h)}
.dn-r-rna{--dn:var(--bio-nadh)}
.dn-bb{fill:none;stroke:var(--dn);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.dn-ph{fill:var(--dn);stroke:var(--sheet);stroke-width:1}
.dn-tab{fill:var(--sheet);stroke:var(--dn);stroke-width:2.2}
.dn-tab.dn-empty{stroke-dasharray:4 3;stroke-width:1.6;fill:none}
.dn-tab.dn-bad{stroke:var(--red);stroke-width:2.6;fill:var(--bad-bg)}
.dn-tab.dn-sel{stroke:var(--hi);stroke-width:4.5}
.dn-tab.dn-bad.dn-sel{stroke:var(--hi)}
.dn-bl{font:700 15px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:var(--ink)}
.dn-blbad{fill:var(--red)}
.dn-end{font:700 14px var(--font-ui);fill:var(--ink)}
.dn-hb{stroke:var(--ink-2);stroke-width:1.8;stroke-dasharray:3 2.5}
.dn-hbz{stroke-width:2.4}
.dn-x{font:700 16px var(--font-ui);fill:var(--red)}
.dn-lab{font:700 11px var(--font-ui);fill:var(--ink)}
.dn-sm{font:400 11px var(--font-ui);fill:var(--ink-2)}
.dn-b{font-weight:700;fill:var(--ink)}
.dn-cn{font:700 11px var(--font-ui);fill:var(--ink-2)}
.dn-ring{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.dn-rl{font:700 16px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:var(--ink)}
.dn-rls{font:700 12px var(--font-ui);fill:var(--ink)}
.dn-bond{stroke:var(--ink);stroke-width:2;fill:none}
.dn-phz{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.dn-sug{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.dn-sugbox{fill:var(--sheet);stroke:var(--dn);stroke-width:2}
.dn-chr-o{fill:none;stroke:var(--ink);stroke-width:38;stroke-linecap:round}
.dn-chr-i{fill:none;stroke:var(--sheet);stroke-width:34;stroke-linecap:round}
.dn-coilh{stroke:var(--ink-2);stroke-width:1.6}
.dn-cen{fill:var(--ink-2)}
.dn-zbox{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3}
.dn-zline{stroke:var(--ink-2);stroke-width:1.2;fill:none;stroke-dasharray:3 3}
.dn-inset{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.dn-coil{fill:none;stroke:var(--ink);stroke-width:2.4}
.dn-histone{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.4}

/* Explore: builder */
.dn-modebar{margin-bottom:10px}
.dn-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.dn-stage{position:relative;width:100%}
.dn-stage .dn-svg{position:absolute;inset:0;width:100%;height:100%}
.dn-ov{position:absolute;inset:0}
.dn-slot{position:absolute;background:transparent;border:1.5px dashed transparent;border-radius:8px;padding:0;margin:0;cursor:pointer;min-width:0}
.dn-slot:hover{border-color:var(--ink-2)}
.dn-slot:focus-visible{outline:3px solid var(--pen);outline-offset:-3px}
.dn-endb{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--sheet);color:var(--ink);border:2px solid var(--ink-2);border-radius:8px;font:700 .95rem var(--font-ui);padding:0;min-width:0;cursor:pointer}
.dn-endb.unset{border-style:dashed;color:var(--ink-2)}
.dn-endb:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.dn-cap{font-size:.92rem;margin:8px 0 0}
.dn-row{margin:0 0 10px}
.dn-how{margin:4px 0 8px}
.dn-pad{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.dn-base{min-width:44px;min-height:44px;border:2px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 1.1rem ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.dn-base:disabled{opacity:.45}
.dn-base[data-base="U"]{border-style:dashed}
.dn-info{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--info-bg)}
.dn-info p{margin:0 0 4px}
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs,.s1-tags{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1.5px dashed transparent;border-radius:8px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}
.s1-b.on{border:2.5px solid var(--ink);background:var(--hi-soft)}
.s1-b.good{border:2px solid var(--green)}
.s1-tag.l{transform:translate(0,-50%)}
.s1-tag.r{transform:translate(-100%,-50%)}
.s1-tag{position:absolute;transform:translate(-50%,-50%);font:700 .72rem/1.3 var(--font-ui);background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.05em .55em;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dn-bad{color:var(--red);font-weight:700}

/* Explore: fork */
.dn-fstage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.dn-fs{fill:none;stroke:var(--dn);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.dn-prim{stroke-width:5}
.dn-rung{stroke:var(--ink-2);stroke-width:1.2;opacity:.75}
.dn-nick{fill:none;stroke:var(--red);stroke-width:1.6}
.dn-twist{fill:none;stroke:var(--ink);stroke-width:2}
.dn-enz{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.dn-enz.on{fill:var(--hi)}
.dn-mitt{fill:var(--hi-soft)}
.dn-ssb{fill:var(--ink-2);opacity:.8}
.dn-gl{font:700 10.5px var(--font-ui);fill:var(--ink)}
.dn-glw{fill:var(--red)}
.dn-glb{font-size:11.5px}
.dn-key{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;margin:8px 0 0;padding:0;font-size:.85rem}
.dn-key li{display:flex;align-items:center;gap:6px}
.dn-sw{display:inline-block;width:22px;height:5px;border-radius:3px;background:var(--dn)}
.dn-nk{color:var(--red);font-weight:700}
.dn-h{margin:0 0 6px;font-size:1rem}
.dn-pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.dn-ez{border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .7em;font-size:.9rem;min-height:40px}
.dn-ez.done{border-color:var(--green);color:var(--green)}
.dn-ez:disabled{opacity:.7}
.dn-chain{margin:0 0 8px;padding-left:1.6em;font-size:.92rem}
.dn-empty-li{color:var(--ink-2)}
.dn-ordre{margin-top:6px}
.dn-ko{border:1.5px solid var(--rule);border-radius:8px;margin:12px 0 10px;padding:6px 12px 8px}
.dn-ko legend{font-weight:700;font-size:.92rem;padding:0 4px}
.dn-chk{display:flex;align-items:center;gap:8px;min-height:32px;font-size:.92rem}
.dn-chk input{width:20px;height:20px}
.dn-player{display:flex;flex-wrap:wrap;gap:6px}
.dn-note{margin-top:8px}

/* Part 3: stations */
.dn-stn{margin-top:6px}
.dn-sth{margin:6px 0 4px}
.dn-q{margin:0 0 6px}
.dn-data{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;margin:8px 0}
.dn-tbl{border-collapse:collapse;font-size:.92rem;width:100%}
.dn-tbl th,.dn-tbl td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:middle}
.dn-tbl caption{text-align:left;padding-bottom:4px}
.dn-num td{text-align:right;font-variant-numeric:tabular-nums}
.dn-hl{font-weight:700;background:var(--hi-soft)}
.dn-run{text-align:left}
.dn-ask{margin:12px 0 6px}
.dn-cho .opt{min-height:44px}
.dn-note2{font-size:.88rem;color:var(--ink-2);margin:10px 0 0}
.dn-snav{margin-top:12px}
.dn-bar{display:inline-block;vertical-align:middle;width:70px;height:10px;border:1px solid var(--ink-2);border-radius:5px;overflow:hidden}
.dn-bar i{display:block;height:100%;background:var(--ink)}
.dn-hcfig{max-width:460px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px;margin:8px 0}
.dn-cell{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.dn-coat{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.dn-tail{fill:none;stroke:var(--ink);stroke-width:2}
.dn-pdna{fill:none;stroke:var(--ink);stroke-width:2}
.dn-hot{fill:var(--hi);stroke:var(--ink)}
.dn-hotl{stroke:var(--ink);stroke-width:3}
.dn-hotd{stroke:var(--ink);stroke-width:3.2;filter:drop-shadow(0 0 2px var(--hi))}
.dn-pats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dn-pats .chip{min-height:40px}
.dn-xfig{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:14px;align-items:start}
.dn-xfig figure{margin:0}
.dn-xray{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.dn-spot{fill:var(--ink)}
.dn-evs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.dn-ev,.dn-inf{border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .7em;min-height:40px;text-align:left;font-size:.92rem}
.dn-ev[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.dn-ev.done{border-color:var(--green);color:var(--green)}
.dn-msfig{max-width:420px}
.dn-tube{fill:none;stroke:var(--ink-2);stroke-width:2}
.dn-grad{fill:var(--ink-2);opacity:.08}
.dn-band{fill:var(--ink)}
.dn-ms{stroke:var(--dn);stroke-width:4;stroke-linecap:butt}
.dn-match{margin:4px 0 10px;font-weight:700}
.dn-match.yes{color:var(--green)}
.dn-match.no{color:var(--red)}
.dn-key2{display:inline-flex;align-items:center;gap:6px;margin-left:6px}

/* Practice: label quiz, puzzles */
.lq-labs{margin:4px 0 8px}
.dn-lq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;margin-top:10px;align-items:start}
.dn-lq p{margin:0 0 4px}
.dn-seqin{width:12ch;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.08em}
.dn-pad-s .dn-base{min-width:40px;min-height:40px;font-size:1rem}
.dn-unit{margin-left:6px}

/* task */
.dn-conds{margin:6px 0 10px;padding-left:1.4em}
.dn-tstage{position:relative;max-width:360px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.dn-tstage .dn-ov{inset:4px}
.dn-tread{margin-top:10px}

@media (max-width:700px){
  .dn-xfig{grid-template-columns:minmax(0,1fr)}
  .dn-xfig figure{max-width:200px}
  .dn-lq{grid-template-columns:minmax(0,1fr)}
}

y System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"766a4041","content":{"id":"21-dna-structure-and-replication","kind":"topic","title":"DNA structure and replication","topic":"Structure and Replication","readyTopic":"DNA structure and replication","hero":{"eq":"\u003cspan class=\"dn-heq\">\u003cspan class=\"dn-sq\">5′-A T G C-3′\u003c/span>\u003cspan class=\"dn-heqb\" aria-hidden=\"true\">\u003ci>⋮\u003c/i>\u003ci>⋮\u003c/i>\u003ci>⋮\u003c/i>\u003ci>⋮\u003c/i>\u003c/span>\u003cspan class=\"dn-sq dn-heq2\">3′-T A C G-5′\u003c/span>\u003c/span>","eqLabel":"Top strand 5′ A T G C 3′, paired with the bottom strand 3′ T A C G 5′","eqSize":"sm","headline":"Two strands, opposite directions, perfect partners","text":"DNA is two strands wound into a \u003cstrong>double helix\u003c/strong>. The strands run in opposite directions (\u003cstrong>antiparallel\u003c/strong>), and their bases pair only A with T and G with C. Because each strand fixes its partner’s sequence, a cell can copy DNA by separating the strands and building a new partner for each: \u003cstrong>semiconservative replication\u003c/strong>.","fig":{"html":"\u003cdiv class=\"dn-hero\" id=\"dn-hero\" role=\"img\" aria-label=\"A short DNA ladder draws in rung by rung. The top strand reads 5′ A T G C 3′ and the bottom strand 3′ T A C G 5′; dashed hydrogen bonds join each pair, 2 for A–T and 3 for G–C. The ladder twists into a helix. Then it unzips from one end, and a new blue strand grows along each old strand, leaving two helices that are each one old strand and one new strand.\">\u003c/div>"}},"goals":["I can describe the structure of DNA: nucleotides, the sugar–phosphate backbone, antiparallel strands and complementary base pairs.","I can use base-pairing rules and Chargaff’s rules to find complementary sequences and base percentages.","I can explain what “semiconservative” means and how the Meselson–Stahl experiment showed it.","I can name the enzymes at a replication fork and the job each does, in order.","I can predict what happens to replication when one enzyme is missing.","I can explain how key experiments showed that DNA is the genetic material and revealed its structure."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Nucleotides and bonds","goal":1,"prompt":"A DNA nucleotide is made of…","options":[{"t":"two bases joined by hydrogen bonds","why":"A nucleotide has one base.","_n":"0d50","_k":"e6e79d03"},{"t":"an amino acid, a sugar and a base","why":"Amino acids build proteins.","_n":"1d20","_k":"2dad2095"},{"t":"a phosphate, a ribose sugar and a base","why":"DNA’s sugar is deoxyribose (one fewer O).","_n":"2d30","_k":"f5418cef"},{"t":"a phosphate, a deoxyribose sugar and a nitrogenous base","why":"Three parts.","_n":"3d00","_k":"1990dc72"}],"hints":["Think of the “letters” plus the backbone.","Backbone = sugar + phosphate.","Phosphate, deoxyribose, base."]},{"id":"w2","skill":"Nucleotides and bonds","goal":1,"prompt":"Which bonds hold the two strands of DNA together?","options":[{"t":"Peptide bonds","why":"Peptide bonds join amino acids.","_n":"4d10","_k":"d5d29203"},{"t":"Ionic bonds between phosphates","why":"Phosphates are on the outside and repel each other.","_n":"5ce0","_k":"a725e3cf"},{"t":"Hydrogen bonds between the bases","why":"Weak bonds, so the strands can be separated.","_n":"6cf0","_k":"2e2b89c8"},{"t":"Covalent bonds between the sugars","why":"Covalent phosphodiester bonds run \u003cstrong>along\u003c/strong> each strand.","_n":"7dc0","_k":"4fe32342"}],"hints":["The strands must come apart for copying. Strong or weak bonds?","Weak bonds between the bases.","Hydrogen bonds."]},{"id":"w3","skill":"Base pairing","goal":2,"prompt":"Which base pairs with guanine in DNA?","options":[{"t":"Thymine","why":"T pairs with A.","_n":"8dd0","_k":"a8fcfd3a"},{"t":"Uracil","why":"Uracil is in RNA, and it pairs with A.","_n":"9c6a","_k":"726620f3"},{"t":"Adenine","why":"Two purines are too wide for the helix.","_n":"ac5a","_k":"032680c8"},{"t":"Cytosine","why":"G–C, with 3 hydrogen bonds.","_n":"bc8a","_k":"902d21f1"}],"hints":["A purine pairs with a pyrimidine.","G’s partner has one ring.","C."]},{"id":"w4","skill":"Base pairing","goal":2,"prompt":"A strand reads \u003cspan class=\"dn-sq\">5′-AACG-3′\u003c/span>. Which strand pairs with it?","options":[{"t":"\u003cspan class=\"dn-sq\">3′-UUGC-5′\u003c/span>","why":"DNA uses T.","_n":"cc7a","_k":"e62e5d0c"},{"t":"\u003cspan class=\"dn-sq\">3′-TTGC-5′\u003c/span>","why":"Complementary bases, opposite direction.","_n":"dc2a","_k":"d974d519"},{"t":"\u003cspan class=\"dn-sq\">3′-AACG-5′\u003c/span>","why":"Pairs are A–T and G–C.","_n":"ec1a","_k":"dca96db0"},{"t":"\u003cspan class=\"dn-sq\">5′-TTGC-3′\u003c/span>","why":"The partner strand runs the other way.","_n":"fc4a","_k":"f75ddec6"}],"hints":["Pair each base.","A–T, A–T, C–G, G–C.","\u003cspan class=\"dn-sq\">3′-TTGC-5′\u003c/span>."]},{"id":"w5","skill":"Cell division","goal":3,"prompt":"When must a cell copy its DNA?","options":[{"t":"Before it divides, so each daughter cell gets a full set","why":"S phase of interphase.","_n":"gc3a","_k":"2ea280bf"},{"t":"After division, in each daughter cell","why":"Each daughter would get only half.","_n":"hcea","_k":"7b06c8dd"},{"t":"Only in sex cells","why":"All dividing cells copy their DNA.","_n":"icda","_k":"a325e7ed"},{"t":"During mitosis, as chromosomes separate","why":"Copying is finished before mitosis begins.","_n":"j549","_k":"943bcb30"}],"hints":["Each new cell needs a complete set.","So copying comes first.","Before division (S phase)."]},{"id":"w6","skill":"Cell division","goal":6,"prompt":"Which molecule did most scientists in the 1930s think carried genes, before the experiments in Part 3?","options":[{"t":"Carbohydrates","why":"Sugars store energy.","_n":"k559","_k":"a0f9dc44"},{"t":"Protein","why":"Proteins seemed more complex: 20 building blocks instead of 4.","_n":"l569","_k":"360e7133"},{"t":"Lipids","why":"Lipids weren’t serious candidates.","_n":"m579","_k":"9b3de22c"},{"t":"DNA","why":"DNA was thought too simple at the time.","_n":"n509","_k":"e6c152a0"}],"hints":["Which molecule has more kinds of building blocks?","20 amino acids vs 4 nucleotides.","Protein."]}],"refreshers":{"Nucleotides and bonds":"A nucleotide = phosphate + deoxyribose + base. Covalent bonds link nucleotides along a strand; weak hydrogen bonds hold the two strands together.","Base pairing":"A–T and G–C. Write the partner strand in the opposite direction: \u003cspan class=\"dn-sq\">5′-AACG-3′\u003c/span> pairs with \u003cspan class=\"dn-sq\">3′-TTGC-5′\u003c/span>.","Cell division":"DNA is copied in S phase, before mitosis, so each daughter cell gets a full, identical set."}}},"explore":{"heading":"Build it, then copy it","intro":"First build a DNA molecule base by base. Then switch to the replication fork, add the enzymes in order, and see what goes wrong if one is missing.","given":"ATGCCGTA","freeLen":10,"buildHow":"Tap a slot, then a base (or press A, T, G or C). Tap an end of the bottom strand to label it 5′ or 3′.","zoom":{"chromo":{"name":"Chromosome","note":"Zoomed out: a copied chromosome before mitosis.","spots":[{"id":"chromatid","name":"Chromatid","job":"One complete DNA molecule. Replication made two identical copies, the sister chromatids.","to":"Zoom in to see the double helix."},{"id":"centromere","name":"Centromere","job":"Holds the two copies together until they separate in mitosis.","to":"Each copy goes to one daughter cell."},{"id":"coil","name":"Coiled DNA","job":"The long DNA molecule is wound around proteins and coiled tightly so it fits in the nucleus.","to":"Unwind it to reach the helix."}]},"pair":{"name":"Base pair","note":"Zoomed in on the base pair you selected (or the first one).","spots":[{"id":"purine","name":"Purine (A or G)","job":"A base with two rings.","to":"It always pairs with a pyrimidine, so every rung is the same width."},{"id":"pyrimidine","name":"Pyrimidine (T or C)","job":"A base with one ring.","to":"It always pairs with a purine."},{"id":"hbonds","name":"Hydrogen bonds","job":"Weak bonds between the bases: 2 in A–T, 3 in G–C.","to":"Helicase breaks them to separate the strands."},{"id":"backbone","name":"Sugar–phosphate backbone","job":"Deoxyribose and phosphate joined by covalent phosphodiester bonds, running along each strand.","to":"The two backbones run in opposite directions."}]},"nt":{"name":"Nucleotide","note":"One nucleotide, with its parts labelled.","spots":[{"id":"phosphate","name":"Phosphate","job":"Attached to the sugar’s 5′ carbon. It links to the 3′ carbon of the next sugar.","to":"Together with the sugars, it forms the backbone."},{"id":"sugar","name":"Deoxyribose","job":"A five-carbon sugar, numbered 1′ to 5′. It has one fewer oxygen than ribose.","to":"The base hangs off carbon 1′."},{"id":"base","name":"Nitrogenous base","job":"A, T, G or C: the “letter” of the code.","to":"It pairs with a base on the other strand."},{"id":"c5","name":"5′ carbon","job":"Carries the phosphate.","to":"The strand end with a free phosphate is the 5′ end."},{"id":"c3","name":"3′ carbon","job":"Carries an –OH group.","to":"New nucleotides are added here: polymerase needs a free 3′ –OH."}]}},"model":"Model: a 40-bp segment, copied by the enzyme team of the bacterium \u003ci>Escherichia coli\u003c/i>. Other cells use similar teams.","enzymes":[{"id":"hel","t":"Helicase","s":"helicase","job":"Unwinds the helix and separates the strands, breaking the hydrogen bonds between bases.","ko":"Nothing unwinds; no copying."},{"id":"ssb","t":"Single-strand binding proteins (SSBs)","s":"SSBs","job":"Hold the separated strands apart.","ko":"Strands snap back together behind helicase; no copying."},{"id":"gyr","t":"Gyrase","s":"gyrase","job":"Relieves the twisting (supercoiling) that builds up ahead of the fork.","ko":"The fork advances 20 bp, then stalls as twisting builds ahead (“supercoiling: high”)."},{"id":"pri","t":"Primase","s":"primase","job":"Lays down short RNA primers.","ko":"Strands separate, but no new DNA (no 3′ end to start from)."},{"id":"p3","t":"DNA polymerase III","s":"pol III","job":"Builds new DNA from each primer.","ko":"Primers are laid down, but no DNA is added to them."},{"id":"p1","t":"DNA polymerase I","s":"pol I","job":"Replaces the RNA primers with DNA.","ko":"New strands are made, but the RNA primers stay in them."},{"id":"lig","t":"DNA ligase","s":"ligase","job":"Seals the gaps (nicks) in the backbone.","ko":"New strands are made, but one new strand stays in unjoined pieces with nicks."}],"early":{"ssb":"There are no single strands to hold yet: helicase hasn’t opened the helix.","gyr":"No twisting has built up yet: helicase hasn’t started unwinding.","pri":"Primase can’t reach the bases until the strands are open and held apart, with the twisting ahead relieved.","p3":"Polymerase III has no 3′ end to add to.","p1":"There are no RNA primers inside new DNA to replace yet.","lig":"There are no gaps between new pieces to seal yet."},"orderDone":"Assembly line complete: helicase, SSBs, gyrase, primase, polymerase III, polymerase I, ligase.","predIntro":"Make a prediction first. Then the builder or the fork will show you what really happens.","predictions":[{"id":"p1","prompt":"Free build. A double-stranded DNA sample is 30% A. What percent is G?","options":[{"t":"30%","_n":"o519","_k":"af6a2c1c"},{"t":"70%","_n":"p529","_k":"bc976ff0"},{"t":"20%","_n":"q539","_k":"6f679e07"},{"t":"40%","_n":"r4c9","_k":"4ddd5cfc"}],"explain":"A = T = 30% makes 60%. The other 40% splits evenly between G and C."},{"id":"p2","prompt":"Replication fork, with primase knocked out. What will polymerase III do?","options":[{"t":"Nothing: there’s no 3′ end to add to","_n":"s4d9","_k":"337cc479"},{"t":"Start new strands anywhere","_n":"t5a9","_k":"d9e6c7bf"},{"t":"Make RNA instead","_n":"u599","_k":"0597f65e"},{"t":"Copy only the top strand","_n":"v589","_k":"2f457c20"}],"explain":"DNA polymerase can only extend an existing strand. Primase’s RNA primer provides the first 3′ end."},{"id":"p3","prompt":"Replication fork, with ligase knocked out. What will the new DNA look like?","options":[{"t":"No new DNA at all","_n":"w579","_k":"6bf626f6"},{"t":"New DNA with RNA left in it","_n":"x569","_k":"f5c76d9c"},{"t":"Complete in length, but one new strand is in separate pieces","_n":"y559","_k":"c518b821"},{"t":"The fork stalls after 20 bp","_n":"z549","_k":"8ae969c0"}],"explain":"Ligase seals the backbone between pieces. Without it, the pieces stay unjoined. (Module 22 explains why one strand is made in pieces.)"},{"id":"p4","prompt":"Replication fork, with all enzymes; the fork completes. After one round of replication, each daughter molecule contains…","options":[{"t":"two new strands (and the other daughter has two old)","_n":"10539","_k":"92f5077e"},{"t":"one old strand and one new strand","_n":"11529","_k":"35d88905"},{"t":"only new DNA","_n":"12519","_k":"44ac208a"},{"t":"strands that are each half old, half new","_n":"13c89","_k":"e2e6ec3c"}],"explain":"That’s semiconservative replication."}],"chalIntro":"Use the builder or the fork to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build the partner strand for \u003cspan class=\"dn-sq\">5′-ATGCCGTA-3′\u003c/span>, with both ends labelled.","why":"The partner reads \u003cspan class=\"dn-sq\">3′-TACGGCAT-5′\u003c/span>: every base paired, and the strand runs the opposite way.","general":"Choose the 8-base strand, fill every bottom slot, and label both ends of the bottom strand.","msgs":{"ends":"The partner runs the opposite way. The strands are antiparallel. If the top reads 5′ → 3′ left to right, its partner reads 3′ → 5′ left to right.","u":"DNA uses T; U is RNA’s base.","copy":"Each base pairs: A–T, G–C.","empty":"Fill every slot of the bottom strand first.","unlabelled":"Label both ends of the bottom strand (tap each end).","mode":"Choose the 8-base strand \u003cspan class=\"dn-sq\">5′-ATGCCGTA-3′\u003c/span> in Build mode.","mismatch":"Check the pairs marked ✗. Each base pairs: A–T, G–C."},"hints":["Pair each base.","A↔T and G↔C; then think about direction.","\u003cspan class=\"dn-sq\">3′-TACGGCAT-5′\u003c/span>."]},{"id":"tc2","goal":2,"prompt":"In free build, make a \u003cstrong>10-bp\u003c/strong> double strand with \u003cstrong>exactly 25 hydrogen bonds\u003c/strong>.","why":"5 G–C pairs × 3 + 5 A–T pairs × 2 = 15 + 10 = 25 hydrogen bonds.","general":"Choose Free build, then fill all 10 top slots and all 10 bottom slots with complementary pairs.","msgs":{"four":"One more G–C pair adds 1 bond.","six":"One too many G–C pairs.","mismatch":"Every pair must be complementary.","mode":"Choose Free build: it has 10 slots.","empty":"Fill all 10 pairs (top and bottom slots) first.","u":"DNA uses T; U is RNA’s base."},"hints":["A–T = 2, G–C = 3.","If \u003ci>g\u003c/i> pairs are G–C: 3\u003ci>g\u003c/i> + 2(10 − \u003ci>g\u003c/i>) = 25.","\u003ci>g\u003c/i> = 5."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Fork mode: knock out \u003cstrong>exactly two\u003c/strong> enzymes so that the fork copies normally for 20 bp, then stops, \u003cstrong>and\u003c/strong> the copied DNA still contains RNA.","why":"Without gyrase, twisting stalls the fork at 20 bp; without polymerase I, the RNA primers stay in the copied DNA.","general":"Tick two enzymes in the knockout panel, then run the fork to test your idea.","msgs":{"gyrLig":"It stalls at 20 bp, but the defect is nicks, not RNA.","priP1":"Without primase, no DNA is made at all.","ssbP1":"Without SSBs, the strands snap back; nothing is copied.","one":"Each symptom needs its own missing enzyme.","none":"Knock out exactly two enzymes.","many":"Knock out exactly two enzymes, no more."},"hints":["Which missing enzyme makes the fork stall partway?","Gyrase: twisting builds up ahead. Which enzyme removes RNA primers?","Gyrase and DNA polymerase I."]}]},"part3":{"slug":"history","name":"History","heading":"The experiments that found it","intro":"Six experiments, each answering one question. At each station, read the data, then choose what it shows.","panel":"Check it with data","stations":[{"id":"s1","n":1,"t":"Griffith (1928)","q":"Can something from dead bacteria change living ones?","text":"Griffith injected mice with \u003ci>Streptococcus pneumoniae\u003c/i>: the S strain (smooth, disease-causing) or the R strain (rough, harmless). Tap each experiment to see what happened.","rows":[{"id":"r1","t":"Live S","res":"Mouse dies","bad":true},{"id":"r2","t":"Live R","res":"Mouse lives"},{"id":"r3","t":"Heat-killed S","res":"Mouse lives"},{"id":"r4","t":"Heat-killed S + live R","res":"Mouse dies, and live S bacteria are recovered","bad":true}],"ask":"What does experiment 4 show?","choices":[{"t":"Live R cells cause disease on their own.","fb":"Live R alone was harmless: that mouse lived.","_n":"14c99","_k":"ace70bc2"},{"t":"Heating made the S cells more dangerous.","fb":"Heat-killed S alone didn’t harm the mouse.","_n":"15c69","_k":"5d1724c8"},{"t":"The heat-killed S cells came back to life.","fb":"Heat-killed S alone didn’t harm the mouse, so the S cells stayed dead.","_n":"16c79","_k":"463d6622"},{"t":"Something from the dead S cells \u003cstrong>transformed\u003c/strong> R cells into S cells.","fb":"Live S bacteria were recovered, so the harmless R cells had become S cells: they were transformed.","_n":"17c49","_k":"b74ea6ef"}]},{"id":"s2","n":2,"t":"Avery, MacLeod and McCarty (1944)","q":"Which molecule is the transforming factor?","text":"An extract of heat-killed S cells was treated with an enzyme before it was mixed with live R cells. Tap each enzyme to run it.","rows":[{"id":"r1","t":"Protease (destroys protein)","res":"Transformation still happens"},{"id":"r2","t":"RNase (destroys RNA)","res":"Transformation still happens"},{"id":"r3","t":"DNase (destroys DNA)","res":"\u003cstrong>No transformation\u003c/strong>","bad":true}],"ask":"What do the results show?","choices":[{"t":"The transforming factor is RNA.","fb":"Transformation still happened after RNase.","_n":"18c59","_k":"e33229e2"},{"t":"The enzymes themselves cause transformation.","fb":"Only DNase changed the result, and it stopped transformation.","_n":"19c29","_k":"90eacc60"},{"t":"The transforming factor is protein.","fb":"Transformation still happened after protease.","_n":"1ac39","_k":"2f60cea5"},{"t":"The transforming factor is DNA.","fb":"Destroying DNA destroyed the transforming factor.","_n":"1bd09","_k":"520334f7"}],"note":"A Canadian connection: Oswald Avery was born in Halifax."},{"id":"s3","n":3,"t":"Hershey and Chase (1952)","q":"Is a virus’s genetic material its DNA or its protein?","text":"Two batches of viruses (phages) infected bacteria. One batch had ³⁵S-labelled protein coats; the other had ³²P-labelled DNA. After infection, a blender shook the virus coats off the cells. Choose a batch, then press Infect and blend.","ask":"What do the results show?","choices":[{"t":"The virus injects its protein, so genes are protein.","fb":"Sulfur is in proteins (not DNA); phosphorus is in DNA’s backbone. Only the ³²P label went into the cells.","_n":"1cd19","_k":"d339ced4"},{"t":"Protein and DNA both enter equally.","fb":"Mostly ³²P went in.","_n":"1dce9","_k":"7ee9be96"},{"t":"The blender destroyed the DNA.","fb":"The ³²P stayed with the cells; blending only knocked the empty coats off.","_n":"1ecd9","_k":"4dfbd7be"},{"t":"The virus injects its DNA, so genes are DNA.","fb":"The ³²P (DNA) went into the cells; the ³⁵S (protein) stayed outside.","_n":"1fd09","_k":"faae11b3"}],"zoom":"\u003cstrong>Sulfur\u003c/strong> is in some amino acids, so it is in protein but not DNA. \u003cstrong>Phosphorus\u003c/strong> is in DNA’s sugar–phosphate backbone. So ³⁵S labels the virus’s protein coat, and ³²P labels its DNA."},{"id":"s4","n":4,"t":"Chargaff (about 1950)","q":"Is there a pattern in the bases?","text":"Base percentages in DNA from four sources. Tap \u003cstrong>every\u003c/strong> pattern that holds, then press Check.","head":["Source","A","T","G","C"],"data":[["Human",30,30,20,20],["Wheat",27,27,23,23],["A bacterium",25,25,25,25],["Sea urchin",32,32,18,18]],"patterns":[{"id":"at","t":"A = T in every species","_n":"1gcf9","_k":"be52e265"},{"id":"gc","t":"G = C in every species","_n":"1hd29","_k":"43d4ffbf"},{"id":"ratio","t":"The A : G ratio differs between species","_n":"1id19","_k":"0d65052d"},{"id":"ag","t":"A = G in every species","fb":"%A = %T and %G = %C. Then %A + %G = 50%.","_n":"1jd49","_k":"512a5a68"},{"id":"all25","t":"Every species has 25% of each base","fb":"Only the bacterium does; the human sample is 30% A.","_n":"1kd39","_k":"9f7f2362"}],"missing":"Look again: more than one pattern holds.","good":"A = T and G = C in every species, but the A : G ratio differs between species."},{"id":"s5","n":5,"t":"Franklin, Wilkins, Watson and Crick (1952–53)","q":"What shape is DNA?","text":"Rosalind Franklin and Maurice Wilkins shone X-rays through DNA fibres. Tap a piece of evidence, then tap what it tells you.","ev":[{"id":"x","t":"An X-shaped diffraction pattern"},{"id":"sp","t":"Regular spacing in the pattern"},{"id":"ch","t":"Chargaff’s ratios"}],"inf":[{"id":"repeat","t":"a repeating structure"},{"id":"pairs","t":"A pairs with T, G with C"},{"id":"helix","t":"a helix"}],"_a":"TBROQw4SXFRbX05DGBJHQRUMFBNRQFFQQxQaQ1dYFgsVRlcIRkMWTA==","wrong":"That isn’t what this evidence tells you. Try another.","good":"Watson and Crick’s model combines the evidence: a double helix of two antiparallel strands, with A–T and G–C pairs inside.","note":"Franklin’s data was shared without her knowledge. She died in 1958, before the 1962 Nobel Prize was awarded to Watson, Crick and Wilkins.","fig":"A drawn schematic of the X-shaped diffraction pattern, not the original photograph."},{"id":"s6","n":6,"t":"Meselson and Stahl (1958)","q":"How is DNA copied?","text":"Bacteria grown on heavy nitrogen (¹⁵N) were moved to light nitrogen (¹⁴N). DNA was spun in a density tube after 0, 1 and 2 generations: heavy DNA sinks lower. Choose a generation, then compare each model’s prediction with the data.","models":[{"id":"cons","t":"Conservative","d":"One daughter keeps both old strands; the other is all new."},{"id":"disp","t":"Dispersive","d":"Every strand is a patchwork of old and new pieces."},{"id":"semi","t":"Semiconservative","d":"Each daughter has one old strand and one new strand."}],"ask":"Which model matches the data at every generation?","choices":[{"t":"Semiconservative","fb":"Each daughter molecule has one whole old strand and one whole new strand. One intermediate band at generation 1, then intermediate + light in equal amounts at generation 2.","_n":"1lc69","_k":"b2c833a2"},{"t":"Conservative","fb":"Conservative copying would give heavy and light bands, never intermediate.","_n":"1mc59","_k":"b1c4f533"},{"t":"Dispersive","fb":"Dispersive copying predicts one band between intermediate and light at generation 2.","_n":"1nbc8","_k":"e6c61a96"}]}],"quickCheck":{"title":"Quick check","summary":"The experiments that found it quick check","items":[{"id":"q1","goal":6,"prompt":"In Avery’s experiment, which enzyme stopped transformation?","choices":[{"t":"DNase","fb":"Destroying DNA destroyed the transforming factor.","_n":"1obd8","_k":"9025502f"},{"t":"Protease","fb":"Destroying DNA destroyed the transforming factor.","_n":"1pbe8","_k":"4efbf08e"},{"t":"None of them","fb":"Destroying DNA destroyed the transforming factor.","_n":"1qbf8","_k":"3348a440"},{"t":"RNase","fb":"Destroying DNA destroyed the transforming factor.","_n":"1rc08","_k":"f4d54d0e"}]},{"id":"q2","goal":6,"prompt":"Which label did Hershey and Chase find inside infected bacteria?","choices":[{"t":"Both equally","fb":"Phosphorus is in DNA; the DNA went in.","_n":"1sc18","_k":"5db187fe"},{"t":"³²P","fb":"Phosphorus is in DNA; the DNA went in.","_n":"1tc28","_k":"e7baed21"},{"t":"Neither","fb":"Phosphorus is in DNA; the DNA went in.","_n":"1uc38","_k":"ca823b36"},{"t":"³⁵S","fb":"Phosphorus is in DNA; the DNA went in.","_n":"1vc48","_k":"fe605146"}]},{"id":"q3","goal":3,"prompt":"Which Meselson–Stahl result ruled out conservative replication?","choices":[{"t":"No bands","fb":"Conservative copying would give heavy and light bands, never intermediate.","_n":"1wc58","_k":"1ef2d576"},{"t":"One intermediate band at generation 1","fb":"Conservative copying would give heavy and light bands, never intermediate.","_n":"1xc29","_k":"db61ccb2"},{"t":"A light band at generation 2","fb":"Conservative copying would give heavy and light bands, never intermediate.","_n":"1yc19","_k":"a5237783"},{"t":"A heavy band at generation 0","fb":"Conservative copying would give heavy and light bands, never intermediate.","_n":"1zc09","_k":"8bc2b2e9"}]},{"id":"q4","goal":2,"prompt":"Chargaff found 18% C in a sample. What % is A?","choices":[{"t":"18%","fb":"C = G = 18% makes 36%; A = T = 32%.","_n":"20bf9","_k":"73ebf193"},{"t":"32%","fb":"C = G = 18% makes 36%; A = T = 32%.","_n":"21c69","_k":"22899466"},{"t":"36%","fb":"C = G = 18% makes 36%; A = T = 32%.","_n":"22c59","_k":"57fb3845"},{"t":"64%","fb":"C = G = 18% makes 36%; A = T = 32%.","_n":"23c49","_k":"f1996655"}]}]}},"practice":{"activities":[{"id":"label","type":"custom","title":"Label the molecule","summary":"Label the molecule","goal":[1,4],"how":"","instruction":"Tap a label, then tap the part of a diagram it names. The first diagram is a 3-base-pair ladder; the second is a replication fork.","labels":[{"id":"phos","t":"Phosphate","where":"a circle on the backbone","job":"Links one sugar to the next."},{"id":"sugar","t":"Deoxyribose","where":"a pentagon on the backbone","job":"The sugar of each nucleotide."},{"id":"base","t":"Nitrogenous base","where":"one half of a rung","job":"A, T, G or C: the “letter”."},{"id":"hb","t":"Hydrogen bonds","where":"the dashes between bases","job":"Weak bonds that hold the strands together."},{"id":"pde","t":"Phosphodiester bond","where":"the link between a sugar and the next phosphate","job":"The strong covalent bond along each strand.","hints":["Which bond is strong and covalent?","It runs along the strand.","Between a sugar and the next phosphate."]},{"id":"e5","t":"5′ end","where":"the strand end with a free phosphate","job":"Where the strand starts."},{"id":"e3","t":"3′ end","where":"the strand end with a free sugar (–OH)","job":"Where new nucleotides are added.","hints":["Which end does polymerase add to?","The end with a free –OH.","The free sugar end."]},{"id":"hel","t":"Helicase","where":"at the fork’s point, between the strands","job":"Unwinds and separates the strands."},{"id":"pri","t":"Primase / RNA primer","where":"a short magenta piece on a template","job":"The first 3′ end for polymerase."},{"id":"lig","t":"DNA ligase","where":"at a nick between two new pieces","job":"Seals the nick."}],"pairs":{"hb|pde":"Hydrogen bonds join the \u003cstrong>bases\u003c/strong>; phosphodiester bonds join the \u003cstrong>backbone\u003c/strong>.","e3|e5":"The 3′ end finishes with the sugar’s –OH, where new nucleotides are added.","hel|lig":"Helicase opens; ligase seals."},"wrongDefault":"Check the name against the job. Try another spot."},{"id":"puzzles","type":"custom","title":"Base-pairing puzzles","summary":"Base-pairing puzzles","star":true,"goal":[2,3],"instruction":"Six puzzles. Puzzles 3 to 6 are non-routine (★); the last two go beyond the Final Check.","items":[{"id":"b1","kind":"seq","goal":2,"prompt":"Write the partner of \u003cspan class=\"dn-sq\">5′-GATTACA-3′\u003c/span>, \u003cstrong>written 5′ → 3′\u003c/strong>.","_a":"FWJxNXVxYHIV","display":"\u003cspan class=\"dn-sq\">5′-TGTAATC-3′\u003c/span>","why":"Pair each base (\u003cspan class=\"dn-sq\">3′-CTAATGT-5′\u003c/span>), then read it from its 5′ end.","wrong":[{"match":"CTAATGT","fb":"Those bases are right, but that’s the partner read 3′ → 5′. Reverse it."},{"match":"GATTACA","fb":"Pairs are A–T and G–C."}],"general":"Pair each base (A–T, G–C), then write the partner starting from its 5′ end."},{"id":"b2","kind":"num","goal":2,"prompt":"A 200-bp DNA molecule has 60 adenines. How many guanines?","_a":"BgIG","unit":"guanines","display":"140","why":"There are 400 bases in 200 pairs: A = T = 60, so G + C = 400 − 120 = 280, and G = 140.","wrong":[{"match":40,"fb":"There are 400 bases in 200 pairs: G + C = 400 − 120 = 280."}],"general":"There are 400 bases in 200 pairs. Use A = T and G = C."},{"id":"b3","kind":"num","goal":2,"star":true,"prompt":"How many hydrogen bonds hold that 200-bp molecule together?","_a":"AgIG","unit":"hydrogen bonds","display":"540","why":"60 A–T pairs × 2 = 120; 140 G–C pairs × 3 = 420; 120 + 420 = 540.","wrong":[{"match":500,"fb":"60 A–T pairs × 2 = 120; 140 G–C pairs × 3 = 420."}],"general":"Count the A–T pairs and the G–C pairs first."},{"id":"b4","kind":"num","goal":2,"star":true,"prompt":"\u003cstrong>One\u003c/strong> strand of a DNA molecule is 20% A, 30% T, 25% G, 25% C. What % of the \u003cstrong>double-stranded\u003c/strong> molecule is A?","_a":"BQM=","unit":"%","display":"25%","why":"The other strand’s A pairs with this strand’s T (30%): (20 + 30) ÷ 2 = 25%.","wrong":[{"match":20,"fb":"The other strand’s A pairs with this strand’s T (30%): (20 + 30) ÷ 2."}],"general":"Find the other strand’s A first, then average over both strands.","hints":["Each strand’s A pairs with the other strand’s T.","The other strand is 30% A.","Average over both strands: 25%."]},{"id":"b5","kind":"num","goal":3,"star":true,"prompt":"Meselson–Stahl, generation 3: what fraction of the DNA molecules are hybrid (intermediate)?","_a":"BxgEVA==","unit":"","display":"1/4","why":"After 3 generations there are 8 molecules; only the 2 holding an original strand are hybrid: 2/8 = 1/4.","wrong":[{"match":0.5,"fb":"After 3 generations there are 8 molecules; only the 2 holding an original strand are hybrid."}],"general":"Count the molecules after each generation, then find the ones that still hold an original strand.","hints":["Count molecules each generation: 1, 2, 4, 8.","The two original heavy strands are always in 2 molecules.","2/8 = 1/4."]},{"id":"b6","kind":"num","goal":2,"star":true,"prompt":"A 20-bp segment has 14 G–C pairs. Another 20-bp segment has 54 hydrogen bonds. How many G–C pairs does the second have?","_a":"BgI=","unit":"G–C pairs","display":"14","why":"3\u003ci>g\u003c/i> + 2(20 − \u003ci>g\u003c/i>) = 54 gives \u003ci>g\u003c/i> = 14: the same segment type.","wrong":[],"general":"Let \u003ci>g\u003c/i> be the number of G–C pairs: 3\u003ci>g\u003c/i> + 2(20 − \u003ci>g\u003c/i>) = 54."}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Lior","how":"","instruction":"Lior made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Write the partner strand of \u003cspan class=\"dn-sq\">5′-AGCTTC-3′\u003c/span>.","steps":["The given strand is \u003cspan class=\"dn-sq\">5′-AGCTTC-3′\u003c/span>.","Pair each base: A–T, G–C, C–G, T–A.","The partner bases, left to right: \u003cspan class=\"dn-sq\">TCGAAG\u003c/span>.","So the partner is \u003cspan class=\"dn-sq\">5′-TCGAAG-3′\u003c/span>."],"_a":"BA==","stepFb":["Step 1 just restates it.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"The partner is \u003cspan class=\"dn-sq\">3′-UCGAAG-5′\u003c/span>.","why":"DNA uses T.","_n":"24c39","_k":"089c1cc1"},{"t":"The partner is \u003cspan class=\"dn-sq\">5′-AGCTTC-3′\u003c/span>.","why":"That copies the strand instead of pairing it.","_n":"25ca9","_k":"0f766702"},{"t":"The partner is \u003cspan class=\"dn-sq\">3′-TCGAAG-5′\u003c/span>, which is \u003cspan class=\"dn-sq\">5′-GAAGCT-3′\u003c/span> written the usual way.","why":"The strands are antiparallel. If the top reads 5′ → 3′ left to right, its partner reads 3′ → 5′ left to right.","_n":"26c99","_k":"60d39bc2"},{"t":"Step 4 is correct.","why":"The strands are antiparallel.","_n":"27d0b","_k":"dd8f4ab1"}],"hints":["Which way does the partner run?","Opposite: its left end is 3′.","\u003cspan class=\"dn-sq\">3′-TCGAAG-5′\u003c/span> = \u003cspan class=\"dn-sq\">5′-GAAGCT-3′\u003c/span>."]},{"id":"e2","goal":2,"task":"A DNA sample is 35% G. Find the % of A.","steps":["G pairs with C, so C = 35%.","G + C = 70%.","So A + T = 30%.","So A = 30%."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"A = T, so A = 30% ÷ 2 = 15%.","why":"%A = %T and %G = %C. Then %A + %G = 50%.","_n":"28d1b","_k":"9e989694"},{"t":"Step 4 is correct.","why":"A and T share the 30%.","_n":"29ceb","_k":"dca61bbf"},{"t":"A = 35%, the same as G.","why":"%A = %T and %G = %C. Then %A + %G = 50%.","_n":"2acfb","_k":"8a4a5170"},{"t":"A = 65%.","why":"That’s 100 − 35.","_n":"2bd4b","_k":"a475e60c"}],"hints":["A and T are equal.","Together they’re 30%.","15% each."]},{"id":"e3","goal":4,"task":"Describe the start of DNA replication at a fork.","steps":["Helicase unwinds the helix, breaking the hydrogen bonds between bases.","Single-strand binding proteins keep the strands apart.","DNA polymerase III starts each new strand directly on the template.","DNA ligase joins the new pieces together."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is true; the mistake is earlier."],"fixes":[{"t":"Primase first lays down a short RNA primer; DNA polymerase III adds nucleotides to the primer’s 3′ end.","why":"Polymerase can only add to an existing 3′ end. Primase lays down an RNA primer first.","_n":"2cd5b","_k":"81492c8f"},{"t":"Ligase starts each new strand.","why":"Helicase unwinds and separates; gyrase relieves twisting ahead; ligase seals gaps in the backbone.","_n":"2dd2b","_k":"840e8304"},{"t":"Helicase builds each new strand.","why":"Helicase unwinds and separates; gyrase relieves twisting ahead; ligase seals gaps in the backbone.","_n":"2ed3b","_k":"229f221c"},{"t":"Step 3 is correct.","why":"Polymerase can’t start from nothing.","_n":"2fc8b","_k":"425cf711"}],"hints":["What does DNA polymerase need before it can add a nucleotide?","An existing 3′ end.","An RNA primer from primase."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: how the knockouts each left a different “fingerprint”, or how the Meselson–Stahl bands ruled out two models?"},{"id":"j2","q":"In your own words, why does base pairing make semiconservative copying possible?"},{"id":"j3","q":"Explain to a friend how to write the partner of a DNA strand without getting the direction wrong."},{"id":"j4","q":"Which enzyme’s job do you still mix up? What will you do to fix it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which statement about base pairing in DNA is correct?","options":[{"t":"A pairs with U by 2 hydrogen bonds","why":"U is RNA’s base.","_n":"2gc9b","_k":"67d49781"},{"t":"A pairs with T by 3 hydrogen bonds; G pairs with C by 2","why":"A–T has 2 hydrogen bonds; G–C has 3. A purine always pairs with a pyrimidine.","_n":"2hd6b","_k":"7ef38bec"},{"t":"A pairs with G, and C pairs with T","why":"Each pair is a purine with a pyrimidine: A–T, G–C.","_n":"2id5b","_k":"8894c45e"},{"t":"A pairs with T by 2 hydrogen bonds; G pairs with C by 3","why":"A–T has 2 hydrogen bonds; G–C has 3. A purine always pairs with a pyrimidine.","_n":"2jd8b","_k":"d9511d83"}]},"b":{"prompt":"Which describes DNA’s backbone?","options":[{"t":"Alternating deoxyribose and phosphate joined by covalent phosphodiester bonds","why":"Each strand is a sugar–phosphate backbone: deoxyribose joined to phosphate by phosphodiester bonds.","_n":"2kd7b","_k":"729545a1"},{"t":"Alternating bases and sugars joined by hydrogen bonds","why":"Hydrogen bonds join bases across the strands.","_n":"2ld2b","_k":"61ad21fc"},{"t":"Alternating ribose and phosphate","why":"Ribose is RNA’s sugar.","_n":"2md1b","_k":"77fc0fee"},{"t":"A chain of amino acids joined by peptide bonds","why":"That’s a protein.","_n":"2nd4b","_k":"6ec9f4e8"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which enzyme relieves the twisting that builds up ahead of the replication fork?","options":[{"t":"Gyrase","why":"Helicase unwinds and separates; gyrase relieves twisting ahead; ligase seals gaps in the backbone.","_n":"2od3b","_k":"8eeb8a71"},{"t":"Helicase","why":"Helicase unwinds and separates; the twisting builds up ahead of it.","_n":"2pceb","_k":"0d977d92"},{"t":"Primase","why":"Primase lays down RNA primers.","_n":"2qcdb","_k":"79447a7a"},{"t":"Ligase","why":"Helicase unwinds and separates; gyrase relieves twisting ahead; ligase seals gaps in the backbone.","_n":"2rce4","_k":"b255b1de"}]},"b":{"prompt":"Which enzyme removes RNA primers and fills the gaps with DNA?","options":[{"t":"Primase","why":"Primase makes the primers.","_n":"2scd4","_k":"c9a5c30e"},{"t":"DNA ligase","why":"Ligase seals the last nick but doesn’t remove RNA.","_n":"2tcc4","_k":"cd86a8a2"},{"t":"DNA polymerase III","why":"Polymerase III builds most of the new DNA, starting from the primers.","_n":"2ucb4","_k":"8fc8946a"},{"t":"DNA polymerase I","why":"Polymerase I replaces primers with DNA.","_n":"2vca4","_k":"abf42e99"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"In the Hershey–Chase experiment, which radioactive label was found inside the bacteria, and what did that show?","options":[{"t":"³⁵S, which labels DNA, so DNA is the genetic material","why":"Sulfur labels protein.","_n":"2wc94","_k":"7aac0e07"},{"t":"³²P, which labels DNA, so DNA is the genetic material","why":"Sulfur is in proteins (not DNA); phosphorus is in DNA’s backbone. Only the ³²P label went into the cells.","_n":"2xc84","_k":"c46e424a"},{"t":"Both labels equally, so both carry genes","why":"Mostly ³²P went in.","_n":"2yc74","_k":"ad5e547b"},{"t":"³⁵S, which labels protein, so protein is the genetic material","why":"Sulfur is in proteins (not DNA); phosphorus is in DNA’s backbone. Only the ³²P label went into the cells.","_n":"2zc64","_k":"1764751d"}]},"b":{"prompt":"In Avery, MacLeod and McCarty’s experiment, which treatment of the heat-killed extract \u003cstrong>stopped\u003c/strong> transformation, and what did that show?","options":[{"t":"Heat, so the factor must be alive","why":"Griffith’s bacteria were already heat-killed, and transformation still happened.","_n":"30c54","_k":"32bf3a27"},{"t":"Protease, so protein is the transforming factor","why":"Transformation still happened after protease.","_n":"31c84","_k":"eff3c7fb"},{"t":"DNase, so DNA is the transforming factor","why":"Destroying DNA destroyed the transforming factor.","_n":"32c94","_k":"49cf7e2a"},{"t":"RNase, so RNA is the transforming factor","why":"Transformation still happened after RNase.","_n":"33ca4","_k":"bddf6fec"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"A double-stranded DNA sample is 22% T. What percent is G?","options":[{"t":"22%","why":"That sets G = T.","_n":"34cb4","_k":"1216313c"},{"t":"28%","why":"A = T = 22% → 44%; G = C = 56% ÷ 2.","_n":"35c44","_k":"267479b8"},{"t":"78%","why":"That’s 100 − 22.","_n":"36c54","_k":"b0f8c725"},{"t":"56%","why":"That’s G + C together.","_n":"37c64","_k":"4c43645f"}]},"b":{"prompt":"A double-stranded DNA sample is 18% C. What percent is A?","options":[{"t":"82%","why":"%A = %T and %G = %C. Then %A + %G = 50%.","_n":"38c74","_k":"1175bf1d"},{"t":"18%","why":"%A = %T and %G = %C. Then %A + %G = 50%.","_n":"39c04","_k":"a76f9e7b"},{"t":"32%","why":"G = C = 18% → 36%; A = T = 64% ÷ 2.","_n":"3ac14","_k":"4b6f919d"},{"t":"64%","why":"That’s A + T together.","_n":"3b3a5","_k":"5a1bf8f2"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A bacterial strain has a temperature-sensitive ligase that stops working at 42 °C. Its DNA is copied at 42 °C. What will the new DNA look like?","options":[{"t":"No new DNA at all","why":"Ligase isn’t needed to make DNA, only to join pieces.","_n":"3c395","_k":"cdba680f"},{"t":"Copying stops after a short distance","why":"That’s a missing gyrase.","_n":"3d3c5","_k":"b24578ba"},{"t":"New strands containing RNA pieces","why":"That’s a missing polymerase I.","_n":"3e3b5","_k":"5326d66a"},{"t":"Full-length new strands, but one of them in many unjoined pieces","why":"Ligase seals the nicks between pieces.","_n":"3f365","_k":"c3b2f2de"}]},"b":{"prompt":"A strain makes working primase and polymerase III but no working DNA polymerase I. What will its new DNA contain?","options":[{"t":"Short stretches of RNA where the primers were","why":"Polymerase I replaces primers with DNA.","_n":"3g355","_k":"b2dcaad4"},{"t":"Only one new strand per molecule","why":"Both strands are still copied.","_n":"3h385","_k":"6100c84d"},{"t":"Nothing; no new strands are made","why":"Primase and polymerase III still make new strands.","_n":"3i375","_k":"85ce00d7"},{"t":"Unjoined pieces but no RNA","why":"Ligase can’t join DNA to a primer that hasn’t been replaced, and the RNA stays.","_n":"3j425","_k":"027628b0"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Meselson and Stahl moved bacteria from ¹⁵N to ¹⁴N. If replication were \u003cstrong>conservative\u003c/strong>, what would the DNA show after \u003cstrong>one\u003c/strong> generation?","options":[{"t":"One intermediate band","why":"That’s what semiconservative (or dispersive) copying predicts.","_n":"3k415","_k":"fb67e35e"},{"t":"One light band only","why":"The original heavy strands are still there.","_n":"3l345","_k":"a9c1e3ad"},{"t":"Two bands: one heavy, one light","why":"One molecule all old (heavy), one all new (light).","_n":"3m355","_k":"690960ca"},{"t":"Heavy and intermediate bands","why":"No intermediate molecules form in conservative copying.","_n":"3n325","_k":"c639aea5"}]},"b":{"prompt":"If replication were \u003cstrong>dispersive\u003c/strong> (every strand a patchwork of old and new), what would the DNA show after \u003cstrong>two\u003c/strong> generations?","options":[{"t":"One band, between intermediate and light","why":"Every molecule is about one-quarter heavy.","_n":"3o335","_k":"1498c68a"},{"t":"Heavy and light bands","why":"That’s conservative.","_n":"3p385","_k":"a0c66875"},{"t":"Intermediate and light bands","why":"That’s the semiconservative result.","_n":"3q395","_k":"844fb945"},{"t":"One intermediate band","why":"After two generations, the heavy fraction is diluted to about 1/4.","_n":"3r365","_k":"ffdfecfd"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best description of what “antiparallel” means for DNA?","options":[{"t":"“Both strands run 5′ → 3′ from left to right.”","why":"The strands are antiparallel. If the top reads 5′ → 3′ left to right, its partner reads 3′ → 5′ left to right.","_n":"3s375","_k":"c30ec255"},{"t":"“Each strand has the same sequence as the other.”","why":"Each is complementary, not identical.","_n":"3t3c5","_k":"d522e9aa"},{"t":"“The two strands are not parallel; they cross each other.”","why":"They are parallel, just pointing opposite ways.","_n":"3u3d5","_k":"b5793920"},{"t":"“The two strands run in opposite directions: where one has its 5′ end, the other has its 3′ end.”","why":"That’s antiparallel: \u003cspan class=\"dn-sq\">5′-ATG-3′\u003c/span> pairs with \u003cspan class=\"dn-sq\">3′-TAC-5′\u003c/span>.","_n":"3v364","_k":"fa38edd1"}]},"b":{"prompt":"Which correctly shows a DNA strand with its partner?","options":[{"t":"\u003cspan class=\"dn-sq\">5′-CAGT-3′\u003c/span> over \u003cspan class=\"dn-sq\">3′-GTCA-5′\u003c/span>","why":"Complementary bases, opposite direction.","_n":"3w354","_k":"43126edf"},{"t":"\u003cspan class=\"dn-sq\">5′-CAGT-3′\u003c/span> over \u003cspan class=\"dn-sq\">3′-CAGT-5′\u003c/span>","why":"That copies the bases instead of pairing them.","_n":"3x344","_k":"e3d23e36"},{"t":"\u003cspan class=\"dn-sq\">5′-CAGT-3′\u003c/span> over \u003cspan class=\"dn-sq\">5′-GTCA-3′\u003c/span>","why":"The strands are antiparallel. If the top reads 5′ → 3′ left to right, its partner reads 3′ → 5′ left to right.","_n":"3y334","_k":"a21954c8"},{"t":"\u003cspan class=\"dn-sq\">5′-CAGT-3′\u003c/span> over \u003cspan class=\"dn-sq\">3′-GUCA-5′\u003c/span>","why":"DNA uses T.","_n":"3z3a4","_k":"ecf2a15d"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of “semiconservative replication”?","options":[{"t":"“One daughter molecule is entirely old, and the other entirely new.”","why":"That’s the conservative model.","_n":"40394","_k":"ded8db6a"},{"t":"“Half of the DNA molecules are copied, and half are kept as they were.”","why":"Every molecule is copied.","_n":"41384","_k":"a7aba91a"},{"t":"“Each new DNA molecule is made of one original strand and one newly built strand.”","why":"Each daughter molecule has one whole old strand and one whole new strand.","_n":"42374","_k":"3a3eca3d"},{"t":"“Each strand is half old pieces and half new pieces.”","why":"That’s the dispersive model.","_n":"433e4","_k":"80d20a89"}]},"b":{"prompt":"Which observation is the strongest evidence for semiconservative replication?","options":[{"t":"“Heavy DNA was found at generation 0.”","why":"That’s the starting point.","_n":"443d4","_k":"4e3dfa23"},{"t":"“DNA has 2 hydrogen bonds in A–T pairs.”","why":"That’s about structure, not copying.","_n":"45304","_k":"25a7f61e"},{"t":"“After one generation in ¹⁴N, all the DNA formed a single intermediate band, and after two generations, intermediate and light bands appeared in equal amounts.”","why":"The intermediate band rules out conservative copying, and the light band at generation 2 rules out dispersive copying.","_n":"46314","_k":"eda5c083"},{"t":"“After one generation, the DNA formed a single intermediate band.”","why":"That alone doesn’t rule out the dispersive model.","_n":"47324","_k":"165cf3f2"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"Two 100-bp DNA samples are heated slowly in a lab. Sample X is 30% G–C pairs; sample Y is 60% G–C pairs. Which separates into single strands first, and why?","options":[{"t":"Both at the same time, because they’re the same length","why":"Length isn’t the only factor; pair type matters.","_n":"48334","_k":"9ff6fd10"},{"t":"Y, because it has more G–C pairs, which are weaker","why":"G–C has 3 bonds: stronger.","_n":"49344","_k":"4b273f5e"},{"t":"X, because it has fewer G–C pairs and so fewer hydrogen bonds to break","why":"X has 230 hydrogen bonds; Y has 260.","_n":"4a354","_k":"a29c27cc"},{"t":"X, because A–T pairs are joined by covalent bonds","why":"Base pairs are held by hydrogen bonds.","_n":"4b364","_k":"9462ab23"}]},"b":{"prompt":"Two 50-bp segments: P has 20 A–T pairs; Q has 35 A–T pairs. Which needs more heat to separate?","options":[{"t":"Q, because it has more A–T pairs","why":"A–T has 2 hydrogen bonds; G–C has 3. A purine always pairs with a pyrimidine.","_n":"4c374","_k":"bae737ab"},{"t":"Q, because A–T pairs have 3 bonds","why":"A–T has 2 hydrogen bonds; G–C has 3. A purine always pairs with a pyrimidine.","_n":"4d384","_k":"9fff326f"},{"t":"P, because it has 30 G–C pairs (3 bonds each) vs Q’s 15","why":"P: 40 + 90 = 130 bonds; Q: 70 + 45 = 115.","_n":"4e394","_k":"613151ac"},{"t":"Neither; both have 50 pairs","why":"Pair type matters.","_n":"4fc24","_k":"36919df3"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Some antiviral drugs are nucleotides whose sugar has no 3′ –OH group. Once polymerase adds one to a growing viral DNA strand, what happens?","options":[{"t":"The drug pairs with nothing, so it’s skipped","why":"It pairs normally; the problem is the missing 3′ end.","_n":"4gc14","_k":"989f8219"},{"t":"The strand grows faster","why":"There’s nowhere to attach the next nucleotide.","_n":"4hc44","_k":"07dd5667"},{"t":"Ligase repairs it and copying continues normally","why":"Ligase seals nicks; it can’t add a missing –OH.","_n":"4ic34","_k":"fa5f3d61"},{"t":"The strand can’t grow any further, because the next nucleotide has no 3′ –OH to bond to","why":"Polymerase can only add to an existing 3′ end.","_n":"4jc64","_k":"46ae1de8"}]},"b":{"prompt":"A DNA-sequencing method adds a few nucleotides that lack a 3′ –OH to a copying reaction. Why does this give a mixture of strands of different lengths?","options":[{"t":"They make the polymerase skip bases","why":"Without a 3′ –OH, nothing more can be added.","_n":"4kc54","_k":"81539381"},{"t":"They pair with the wrong bases","why":"They pair normally.","_n":"4lc84","_k":"8f3a88f7"},{"t":"These nucleotides cut the template at random","why":"They don’t cut; they end the new strand.","_n":"4mc74","_k":"7e2a0429"},{"t":"Each time one of these nucleotides is added, that strand stops growing, at a different position each time","why":"Without a 3′ –OH, nothing more can be added, so each strand ends where one was added.","_n":"4nba4","_k":"b2aa4bc4"}]}}]},"task":{"title":"Cut here","summary":"Cut here","statement":"\u003cp>Design a 6-base-pair DNA segment that meets every condition. (Each answer turns out to be a real “cut here” site used in module 33.) Can you find all the answers?\u003c/p>\u003col class=\"dn-conds\">\u003cli>It is held together by exactly 16 hydrogen bonds.\u003c/li>\u003cli>It’s a palindrome: the top strand read 5′ → 3′ is the same as the bottom strand read 5′ → 3′.\u003c/li>\u003cli>The top strand starts 5′-G.\u003c/li>\u003cli>The middle two base pairs (positions 3 and 4) are A–T or T–A pairs.\u003c/li>\u003c/ol>","checks":["Exactly 16 hydrogen bonds","Palindrome","Starts with G","Middle pairs are A–T"],"tips":["6 pairs with 16 bonds: how many must be G–C?","In a palindrome, position 6 pairs with position 1, 5 with 2, and 4 with 3.","The first base is fixed as G, so the last is C.","Positions 3 and 4 must pair with each other: AT or TA."],"explainPrompt":"Explain how you used base pairing and the 16-bond rule to narrow the choices.","vocab":"Use the words complementary, antiparallel, hydrogen bond and palindrome.","success":"Your segment meets every condition!","more":"Can you find all the answers?","afterAt":4,"after3":"Line 1 forces exactly 4 G–C pairs, and in a palindrome pairs come in mirror pairs. With G at position 1 and A/T in the middle, only positions 2 and 5 are left to choose, giving 4 answers."},"cards":[["Nucleotide","Phosphate + deoxyribose + a base (A, T, G or C)."],["Base pairs","A–T (2 hydrogen bonds); G–C (3). Purine with pyrimidine."],["Antiparallel","The strands run opposite ways: \u003cspan class=\"dn-sq\">5′-ATG-3′\u003c/span> pairs with \u003cspan class=\"dn-sq\">3′-TAC-5′\u003c/span>."],["Chargaff’s rules","%A = %T and %G = %C, so %A + %G = 50%."],["Semiconservative","Each new molecule = 1 old strand + 1 new strand."],["Helicase / SSBs","Unwinds and separates the strands / keeps them apart."],["Gyrase","Relieves twisting (supercoiling) ahead of the fork."],["Primase","Lays down a short RNA primer, the first 3′ end."],["DNA polymerase III / I","III builds new DNA from primers; I replaces RNA primers with DNA."],["DNA ligase","Seals nicks in the backbone between new pieces."],["Hershey–Chase","³²P (DNA) entered cells; ³⁵S (protein) didn’t: genes are DNA."],["Meselson–Stahl","¹⁵N → ¹⁴N: one intermediate band, then intermediate + light: semiconservative."]]}};</script>
