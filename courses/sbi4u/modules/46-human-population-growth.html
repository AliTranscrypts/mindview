ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}

.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}

pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}

.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}

.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

}

.hd-btns .btn,.home-link{padding:.4em .6em}

.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}

}

@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 46: hero J-curve, demographic transition explorer (S10), Footprints and food stations, practice, task.
   Colours (plan build notes): birth-rate curve --pen, death-rate curve orange --p-k, the gap --hi-soft; population curve --pen;
   pyramid bars --ink-2 with a followed cohort in --hi; footprint biocapacity marker --ink. Values are always written beside
   bars and curves, never colour alone. */

/* hero */
.hp-heq{display:inline}
.hp-heq1{display:block;line-height:1.35}
.hp-heq1 + .hp-heq1{margin-top:.25em}
.hp-heq3{display:block;margin-top:.3em;font-size:.6em;color:var(--ink-2)}
.hp-hero{max-width:480px;margin:0 auto}
.hp-hsvg{display:block;width:100%;height:auto}
.hp-hsvg text,.hp-gsvg text,.hp-pyrfig text,.hp-trio text{font-family:var(--font-ui)}
.hp-popw{stroke-width:3.4}
.hp-gbar{fill:var(--ink-2);opacity:.55}
.hp-gbv{font-size:12px;font-weight:700;fill:var(--ink)}

/* graph parts */
.hp-gsvg{display:block;width:100%;height:auto}
.hp-t{font-size:12px;fill:var(--ink)}
.hp-tl{font-size:11px;fill:var(--ink-2)}
.hp-at{font-size:11.5px;font-weight:700;fill:var(--ink-2)}
.hp-grid{stroke:var(--plot-grid);stroke-width:1}
.hp-ax{stroke:var(--plot-axis);stroke-width:1.2}
.hp-pop{fill:none;stroke:var(--pen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.hp-dash{stroke-dasharray:7 6}
.hp-ghost{opacity:.22;stroke-dasharray:4 5}
.hp-band{fill:var(--pen);fill-opacity:.12;stroke:none}
.hp-now{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 4}
.hp-mile{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.hp-ml{font-size:11.5px;font-weight:700;fill:var(--ink)}
.hp-cur{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 4}
.hp-curdot{fill:var(--hi);stroke:var(--ink);stroke-width:1.5}
.hp-cl{font-size:12.5px;font-weight:700;fill:var(--ink)}
.hp-stg{fill:var(--paper);stroke:var(--rule);stroke-width:1}
.hp-stg.on{fill:var(--hi-soft);stroke:var(--ink)}
.hp-stl{font-size:11px;font-weight:700;fill:var(--ink)}
.hp-gap{fill:var(--hi-soft);stroke:none}
.hp-br{fill:none;stroke:var(--pen);stroke-width:3.2;stroke-linejoin:round}
.hp-dr{fill:none;stroke:var(--p-k);stroke-width:3.2;stroke-linejoin:round}
.hp-cn{font-size:12px;font-weight:700}
.hp-cnb{fill:var(--pen)}
.hp-cnd{fill:var(--p-k)}
.hp-wd{fill:none;stroke:var(--ink);stroke-width:2}
.hp-dotb{fill:var(--pen);stroke:var(--sheet);stroke-width:1.5}
.hp-dotd{fill:var(--p-k);stroke:var(--sheet);stroke-width:1.5}
.hp-dbl{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 5}
.hp-dtk{fill:var(--ink-2)}

/* pyramids */
.hp-pb{fill:var(--ink-2)}
.hp-pbh{fill:var(--hi)}
.hp-pax{stroke:var(--ink);stroke-width:1}
.hp-pyrrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start;margin-top:10px}
.hp-pyrfig{margin:0}
.hp-pyrfig svg{display:block;width:100%;max-width:300px;height:auto;margin:0 auto}
.hp-pyrc{font-size:.88rem;text-align:center;margin-top:4px}
.hp-key{font-size:.8rem;color:var(--ink-2)}
.hp-swh{display:inline-block;width:.85em;height:.85em;background:var(--hi);border-radius:2px;vertical-align:-.08em;margin-right:4px}
.hp-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hp-trio figure{margin:0;text-align:center}
.hp-trio svg{display:block;width:100%;height:auto}
.hp-trio figcaption{font-size:.78rem;line-height:1.25;margin-top:2px}
@media (max-width:600px){ .hp-pyrrow{grid-template-columns:minmax(0,1fr)} }

/* explore layout and controls */
.hp-pg [hidden]{display:none!important}
@media (min-width:821px){ .pg.hp-pg{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)} }
.hp-pg .pg-ctrl{display:grid;gap:12px}
.hp-panel{display:grid;gap:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.hp-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.hp-note{margin:10px 0 0}
.hp-fixed{margin:0}
.hp-runrow{margin:0}
.hp-switch{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;font-size:.92rem;text-align:left;cursor:pointer}
.hp-swk{flex:none;position:relative;width:38px;height:22px;border-radius:11px;background:var(--rule);transition:background .2s}
.hp-swk::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--sheet);transition:left .2s}
.hp-switch[aria-checked="true"] .hp-swk{background:var(--ink)}
.hp-switch[aria-checked="true"] .hp-swk::after{left:19px}
.hp-swv{margin-left:auto;font-size:.85rem}
@media (prefers-reduced-motion:reduce){ .hp-swk,.hp-swk::after{transition:none} }

/* radio groups (from SBI4U 18 / 14 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button small{color:var(--ink-2)}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button[aria-checked="true"] small{color:var(--hi-ink)}

/* stepper and slider */
.hp-stp{display:inline-flex;align-items:center;gap:6px}
.hp-stb{min-width:40px;min-height:40px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:1.15rem;font-weight:700;line-height:1}
.hp-stb:disabled{opacity:.4;cursor:default}
.hp-stp output{min-width:2.2ch;padding:0 .4em;text-align:center;font-weight:700}
.hp-sl{margin:0}
.hp-sl input{width:100%;accent-color:var(--ink)}
.hp-sl output{font:700 1.05rem var(--font-ui)}

/* Part 3 */
.hp-p3{display:grid;gap:18px}
.hp-st{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px}
.hp-st h3{margin-top:0}
.hp-data{margin-top:10px}
.hp-fpgrid,.hp-hagrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}
@media (max-width:700px){ .hp-fpgrid,.hp-hagrid{grid-template-columns:minmax(0,1fr)} }
.hp-fpc{display:grid;gap:10px}
.hp-fpbar{margin:4px 0 8px}
.hp-fpt{position:relative;display:flex;height:22px;border:1.5px solid var(--ink-2);border-radius:4px;overflow:visible;background:var(--sheet)}
.hp-fpt i{display:block;height:100%}
.hp-fpm{position:absolute;top:-6px;bottom:-6px;width:0;border-left:3px solid var(--ink)}
.hp-fpsc{position:relative;display:flex;justify-content:space-between;font-size:.75rem;color:var(--ink-2);margin-top:4px;height:2.4em}
.hp-fpbl{position:absolute;top:1.1em;transform:translateX(-30%);font-weight:700;color:var(--ink);white-space:nowrap}
.hp-fs0{background:var(--ink-2)}
.hp-fs1{background:var(--f3)}
.hp-fs2{background:var(--p-k)}
.hp-fs3{background:var(--p-t)}
.hp-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;margin-right:4px}
.hp-big{margin:6px 0;font-size:1rem}
.hp-earths{display:flex;flex-wrap:wrap;gap:4px}
.hp-earths svg{width:30px;height:30px}
.hp-eo{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.hp-ef{fill:var(--pen);opacity:.8}
.hp-leg{list-style:none;padding:0;margin:6px 0 0;font-size:.85rem;display:grid;gap:2px}
.hp-habar{margin-bottom:8px}
.hp-hal{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.hp-hat{display:flex;height:22px;border:1.5px solid var(--ink-2);border-radius:4px;overflow:hidden;margin:3px 0}
.hp-hat i{display:block;height:100%}
.hp-hd{background:var(--leaf)}
.hp-hl{background:var(--p-b)}
.hp-haleg{display:grid;gap:2px;font-size:.82rem}
.hp-people svg{display:block;width:100%;max-width:420px;height:auto}
.hp-pe{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.hp-pf{fill:var(--pen);stroke:var(--pen);stroke-width:1.4}
.hp-cergrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:10px}
@media (max-width:700px){ .hp-cergrid{grid-template-columns:minmax(0,1fr)} }
.hp-cerside{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.hp-cerside h4{margin:0 0 6px}
.hp-cerside .chips{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.hp-cerside .chip{text-align:left;border-radius:8px;line-height:1.3}
.hp-cerside p.rg-lab{margin:10px 0 4px}
.hp-cerdl{margin:8px 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.9rem}
.hp-cerdl dt{font-weight:700}
.hp-cerdl dd{margin:0}

/* practice */
.hp-mpyr{display:block}
.hp-mpyr svg{display:block;width:110px;height:auto;margin:0 auto}
.hp-mcap{display:block;font-size:.8rem;line-height:1.25;margin-top:3px;text-align:center}
.hp-unit{margin-left:6px}

/* task */
.hp-conds{margin:.4em 0 0 1.2em}
.hp-tin{display:grid;gap:10px}
.hp-tin small{font-weight:400}
.hp-tpv h4{margin:0 0 8px}
.hp-tbars{display:grid;gap:10px}
.hp-grow{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.5em;grid-template-rows:auto auto;gap:2px 8px;align-items:center}
.hp-gl{font-size:.85rem;font-weight:700}
.hp-gt2{position:relative;display:flex;height:20px;border:1.5px solid var(--ink-2);border-radius:4px;overflow:visible}

.hp-gv{text-align:right}
.hp-gml{grid-column:2;font-size:.75rem;color:var(--ink-2)}
.hp-tb{background:var(--leaf)}
.hp-tc{background:var(--p-k)}
.hp-tf{background:var(--p-b)}
.hp-glg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0}
.hp-tread{margin-top:10px}

t upward in a \u003cstrong>J-curve\u003c/strong>. You’ll follow countries through the \u003cstrong>demographic transition\u003c/strong>, read their \u003cstrong>age pyramids\u003c/strong>, and then ask the big question: how many people can the land feed, and how?","fig":{"html":"\u003cdiv class=\"hp-hero\" id=\"hp-hero\" role=\"img\" aria-label=\"A timeline from 1700 to 2025 draws the world population curve: almost flat, then rising steeply in a J-curve. Milestone dots mark 1 billion around 1800, 2 billion around 1927, 4 billion around 1974 and 8 billion in 2022. The gaps between billions shrink from more than a century to about 12 years.\">\u003c/div>"}},"goals":["I can describe how the human population has grown and explain why growth sped up after 1800.","I can explain the stages of the demographic transition using birth and death rates.","I can read age pyramids and use them, including population momentum, to predict future growth.","I can calculate growth rates from birth, death and migration rates, and doubling times with the rule of 70.","I can explain ecological footprints and use the 10% energy rule to compare how many people a hectare can feed.","I can weigh the benefits and risks of a Canadian food technology using evidence."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Rates per 1000","goal":4,"prompt":"A town of 20 000 people has 300 births in a year. What is its birth rate per 1000 people?","options":[{"t":"300 per 1000","why":"Divide by the number of thousands.","_n":"0e35","_k":"97c552cd"},{"t":"1.5 per 1000","why":"20 000 is 20 thousands.","_n":"1e05","_k":"462c3297"},{"t":"66.7 per 1000","why":"That’s 20 000 ÷ 300.","_n":"2e15","_k":"c6647b71"},{"t":"15 per 1000","why":"300 ÷ 20 = 15 births for each 1000 people.","_n":"3e65","_k":"5aa57434"}],"hints":["How many groups of 1000 are in 20 000?","20.","300 ÷ 20 = 15."]},{"id":"w2","skill":"Rates per 1000","goal":4,"prompt":"Convert a growth rate of 12 per 1000 to a percentage.","options":[{"t":"120%","why":"A percentage is per 100.","_n":"4e75","_k":"b65b4475"},{"t":"12%","why":"12 per 1000 is 1.2 per 100.","_n":"5e45","_k":"2ca92427"},{"t":"0.12%","why":"Divide by 10.","_n":"6e55","_k":"54293001"},{"t":"1.2%","why":"Per 1000 ÷ 10 = per 100.","_n":"7ea5","_k":"a2cc4e6f"}],"hints":["Percent means per 100.","12 per 1000 = 1.2 per 100.","1.2%."]},{"id":"w3","skill":"Exponential growth","goal":4,"prompt":"From module 43: a population grows 7% per year. About how long does it take to double?","options":[{"t":"About 14 years","why":"That’s for 5%.","_n":"8eb5","_k":"785c11e0"},{"t":"About 1000 years","why":"Use 7, not 0.07.","_n":"9938","_k":"60a53937"},{"t":"About 490 years","why":"Divide 70 by the rate.","_n":"a928","_k":"6343de8e"},{"t":"About 10 years","why":"70 ÷ 7.","_n":"b958","_k":"ff3a6c35"}],"hints":["Rule of 70.","70 ÷ 7.","10 years."]},{"id":"w4","skill":"Exponential growth","goal":1,"prompt":"A population doubles every 25 years. Starting at 1 million, how big is it after 75 years?","options":[{"t":"3 million","why":"Doubling multiplies.","_n":"c948","_k":"daa5f606"},{"t":"8 million","why":"Three doublings: 2, 4, 8.","_n":"d978","_k":"1cac1e2d"},{"t":"75 million","why":"That’s 1 million per year.","_n":"e968","_k":"ec23477e"},{"t":"6 million","why":"1 × 2 × 3? Each doubling multiplies by 2.","_n":"f998","_k":"fe9fa03a"}],"hints":["How many doublings in 75 years?","Three.","1 → 2 → 4 → 8."]},{"id":"w5","skill":"Energy in food chains","goal":5,"prompt":"From module 18: about what fraction of the energy at one trophic level passes to the next?","options":[{"t":"About 90%","why":"90% is lost.","_n":"g988","_k":"702c82f6"},{"t":"About 10%","why":"Most is lost as heat or isn’t eaten.","_n":"h8b8","_k":"c3e44a2f"},{"t":"About 50%","why":"Far less than half passes on.","_n":"i8a8","_k":"9465a2f6"},{"t":"100%","why":"Energy is lost at every step.","_n":"j018","_k":"7a982625"}],"hints":["Think of an energy pyramid’s shape.","Each level is much narrower.","About 10%."]},{"id":"w6","skill":"Energy in food chains","goal":5,"prompt":"Grass stores 10 000 kJ. About how much of it ends up in a cow that eats the grass, and then in a person who eats the cow?","options":[{"t":"Cow 1000 kJ; person 1000 kJ","why":"Energy is lost at the second step too.","_n":"k028","_k":"91ba0c5f"},{"t":"Cow 10 000 kJ; person 1000 kJ","why":"Loss happens at every step.","_n":"l038","_k":"d94247a1"},{"t":"Cow 9000 kJ; person 8100 kJ","why":"Only about 10% is kept, not lost.","_n":"m048","_k":"a18732af"},{"t":"Cow 1000 kJ; person 100 kJ","why":"10% at each step.","_n":"n058","_k":"183d17b2"}],"hints":["About 10% passes each step.","10% of 10 000 = 1000.","10% of 1000 = 100."]}],"refreshers":{"Rates per 1000":"Rate per 1000 = count ÷ (population ÷ 1000). To convert to a percentage, divide the rate per 1000 by 10.","Exponential growth":"Growth at a steady percentage doubles in about 70 ÷ (rate in %) years. Each doubling multiplies by 2, so three doublings multiply by 8.","Energy in food chains":"About 10% of the energy at one level reaches the next. Each extra link loses about 90% of what’s left."}}},"explore":{"heading":"Demographic transition explorer","intro":"Move through time and watch birth rates, death rates and the age pyramid change together. Then run projections with the rule of 70.","table":[[0,40,38,1],[10,40,36,1],[20,40,33,2],[30,40,30,2],[40,40,26,2],[50,39,22,2],[60,38,18,2],[70,35,16,3],[80,32,14,3],[90,28,12,3],[100,24,11,3],[110,20,10,3],[120,17,10,3],[130,14,10,3],[140,12,10,4],[150,11,10,4],[160,10,10,4],[170,9,10,5],[180,9,11,5]],"stages":["","high birth and death rates","death rate falling, birth rate high","birth rate falling","both rates low","births below deaths"],"world":{"pts":[[1700,0.6],[1750,0.79],[1804,1],[1850,1.26],[1900,1.65],[1927,2],[1950,2.5],[1960,3],[1974,4],[1987,5],[1999,6],[2011,7],[2022,8],[2025,8.2]],"proj":[[2025,8.2,8.2,8.2],[2030,8.5,8.4,8.6],[2040,9.1,8.9,9.3],[2050,9.7,9.4,10],[2060,10,9.5,10.5],[2070,10.2,9.6,10.9],[2080,10.3,9.5,11.4],[2090,10.3,9.2,11.9],[2100,10.2,8.9,12.4]],"miles":[[1,1804],[2,1927],[3,1960],[4,1974],[5,1987],[6,1999],[7,2011],[8,2022]]},"modelNote":"Transition rates, pyramid shapes and the momentum run are model values. World figures are rounded estimates; beyond 2025 the dashed curve is a UN-style projection with its likely range shaded.","predictions":[{"id":"p1","prompt":"As a country begins to modernize, which changes first?","options":[{"t":"Both stay the same","_n":"o068","_k":"b2da31ff"},{"t":"The birth rate falls","_n":"p078","_k":"368e3ff9"},{"t":"The death rate falls","_n":"q088","_k":"181450dc"},{"t":"The birth rate rises","_n":"r098","_k":"532e7bf5"}],"explain":"Clean water, food and medicine save lives quickly; family sizes change more slowly.","start":{"mode":"trans","year":0},"act":"p1"},{"id":"p2","prompt":"When is the population growing fastest?","options":[{"t":"In stage 4","_n":"s0a8","_k":"2c57ff14"},{"t":"At the end of stage 2, when the gap between the curves is widest","_n":"t078","_k":"9008b3da"},{"t":"In stage 1","_n":"u068","_k":"9bb67355"},{"t":"When the birth rate is highest","_n":"v058","_k":"253435dd"}],"explain":"Growth depends on the gap, not on either rate alone.","start":{"mode":"trans","year":0},"act":"p2"},{"id":"p3","prompt":"Will the population stop growing right away?","options":[{"t":"Yes, immediately","_n":"w048","_k":"c3a420c5"},{"t":"It starts shrinking immediately","_n":"x0b8","_k":"63d0d134"},{"t":"It grows faster than ever","_n":"y0a8","_k":"4aeaa01e"},{"t":"No, it keeps growing for decades","_n":"z098","_k":"77f5202a"}],"explain":"Today’s many children become tomorrow’s many parents. That’s population momentum.","start":{"mode":"trans","year":120,"fert":true},"act":"p3"},{"id":"p4","prompt":"Which pyramid belongs to the fastest-growing population?","options":[{"t":"Wide base, narrow top","_n":"10088","_k":"8a7976a2"},{"t":"All grow equally","_n":"110f8","_k":"d1963322"},{"t":"Narrow base","_n":"120e8","_k":"de4549ba"},{"t":"Straight sides","_n":"13058","_k":"10289083"}],"explain":"A wide base means many young people: high births now and many parents later.","start":{"mode":"trans","year":0,"trio":true},"act":"p4"}],"challenges":[{"id":"tc1","goal":[2,4],"prompt":"\u003cstrong>Transition:\u003c/strong> set the slider to the year of fastest natural increase.","why":"Year 60: 38 − 18 = 20 per 1000 = 2.0%, the widest gap.","named":{"mode":"Switch to the Transition mode first.","y50":"The death rate is still falling. Keep going.","y70":"The birth rate has started falling; the gap just passed its widest.","y0":"A high birth rate alone isn’t enough; look at the gap.","other":"Natural increase there is {r}%. Find where the shaded gap is widest."},"hints":["Natural increase = (birth − death) ÷ 10.","Find where the shaded gap is widest.","Year 60: 38 − 18 = 20 per 1000 = 2.0%."]},{"id":"tc2","goal":[2,4],"prompt":"\u003cstrong>Transition:\u003c/strong> find the first year when the doubling time is \u003cstrong>longer than 100 years\u003c/strong>.","why":"Year 130: 0.4% per year, so 70 ÷ 0.4 ≈ 175 years.","named":{"mode":"Switch to the Transition mode first.","y120":"70 ÷ 0.7 = exactly 100 years, not longer.","late":"Doubling time is already over 100 years at an earlier year.","early":"At year {y} the rate is {r}%: 70 ÷ {r} ≈ {d} years, under 100. Keep going."},"hints":["Doubling time > 100 means rate \u003c 0.7%.","At year 120 the rate is exactly 0.7%.","Year 130: 0.4%, about 175 years."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>Projection:\u003c/strong> a country of 20 million must reach \u003cstrong>80 million\u003c/strong>. Set a growth rate and a number of years that does it exactly.","why":"80 ÷ 20 = 4: two doublings, so years = 2 × (70 ÷ rate). On the slider steps that’s 2.0% for 70 years or 3.5% for 40 years.","named":{"mode":"Switch to the Projection mode first.","one":"That’s one doubling. 80 million is four times 20: two doublings.","four":"That’s 320 million.","other":"20 million → {p} million. 80 million needs exactly two doublings."},"hints":["80 ÷ 20 = 4 = 2 × 2: two doublings.","Years = 2 × doubling time = 2 × (70 ÷ rate).","3.5% → 20-year doublings → 40 years; or 2.0% → 35-year doublings → 70 years."]}]},"part3":{"slug":"footprint","name":"Footprints","heading":"Footprints and food","intro":"How many people can the Earth feed, and at what cost? Build a footprint, run a hectare’s crops through the energy pyramid, then weigh a Canadian food technology with evidence. Each station has a \u003cstrong>Check it with data\u003c/strong> panel.","st1":{"title":"Station 1: footprint builder","text":"Choose a diet, a way of travelling and a home. A footprint counts the land and water needed for your food, goods, energy and housing, measured in global hectares (gha).","base":1,"bio":1.6,"groups":[{"id":"diet","label":"Diet","opts":[{"id":"plants","t":"Mostly plants","v":0.8},{"id":"mixed","t":"Mixed","v":1.4},{"id":"meat","t":"High-meat","v":2.4}]},{"id":"travel","label":"Travel","opts":[{"id":"transit","t":"Transit and bike","v":0.3},{"id":"some","t":"Some driving","v":1.2},{"id":"lots","t":"Mostly driving and flights","v":2.6}]},{"id":"home","label":"Home","opts":[{"id":"apt","t":"Small apartment","v":0.5},{"id":"avg","t":"Average house","v":1.2},{"id":"big","t":"Large house","v":2}]}],"note":"Canada’s average footprint is among the world’s largest per person.","data":"Earths needed = footprint ÷ 1.6. The smallest choices give 1.0 + 0.8 + 0.3 + 0.5 = 2.6 gha ≈ 1.6 Earths; the largest give 8.0 gha = 5 Earths."},"st2":{"title":"Station 2: an energy pyramid on a hectare","text":"One hectare grows crops holding 40 000 000 kJ of food energy a year. A person needs about 4 000 000 kJ a year. Choose how much of the crop goes to livestock first.","crop":40000000,"need":4000000,"shares":[0,25,50,75,100],"data":"Eaten directly: 40 000 000 ÷ 4 000 000 = 10 people. Fed to livestock first, about 10% passes to meat: 4 000 000 kJ = 1 person. With a share \u003cem>s\u003c/em> fed to livestock: people = 10 × (1 − \u003cem>s\u003c/em>) + 1 × \u003cem>s\u003c/em>."},"st3":{"title":"Station 3: Canadian food technologies","how":"Choose a card. Build one benefit claim and one risk claim: choose a claim, then the evidence that supports it, and press Check.","cards":[{"id":"canola","t":"Canola","blurb":"Bred from rapeseed by Canadian plant breeders in the 1970s, with low levels of erucic acid and glucosinolates, giving an edible oil and a protein-rich meal for livestock. Herbicide-tolerant varieties followed in the 1990s.","ev":[{"id":"e1","t":"Breeders lowered erucic acid and glucosinolates, so the oil is edible."},{"id":"e2","t":"Crushed seed gives an oil and a protein-rich meal for livestock."},{"id":"e3","t":"Herbicide-tolerant varieties let farmers control weeds with one herbicide and till the soil less."},{"id":"e4","t":"Spraying one herbicide year after year can select for herbicide-resistant weeds."},{"id":"e5","t":"Canola fields turn bright yellow when they flower."}],"ben":[{"id":"b1","t":"Canola turns one crop into food for people and feed for livestock.","ev":["e1","e2"],"why":"An edible oil and a protein meal come from the same seed, so one hectare does two jobs."},{"id":"b2","t":"Herbicide-tolerant canola can protect the soil.","ev":["e3"],"why":"Less tillage leaves the soil covered, so less of it erodes."},{"id":"b3","t":"Canola is better than every other crop.","bad":"No evidence here compares canola with every other crop."}],"risk":[{"id":"r1","t":"Relying on one herbicide can create weeds it no longer kills.","ev":["e3","e4"],"why":"Repeated spraying selects for resistant weeds, so farmers need to rotate herbicides and crops."},{"id":"r2","t":"Canola oil is unsafe because breeders changed the plant.","bad":"The evidence says the opposite: breeding lowered erucic acid and made the oil edible."}]},{"id":"green","t":"Greenhouse vegetables","blurb":"Greenhouses (for example, around Leamington, Ontario) grow vegetables year-round, with high yields per hectare, and water can be recycled, but heating them in winter uses a lot of energy.","ev":[{"id":"g1","t":"Greenhouses give high yields per hectare, all year."},{"id":"g2","t":"Water in a greenhouse can be collected and recycled."},{"id":"g3","t":"Heating a greenhouse through a Canadian winter uses a lot of energy."},{"id":"g4","t":"The plants grow under glass or plastic."}],"ben":[{"id":"b1","t":"Greenhouses grow more food on less land.","ev":["g1"],"why":"More food per hectare means less land is needed to feed the same number of people."},{"id":"b2","t":"Greenhouses can save water.","ev":["g2"],"why":"Recycled water isn’t lost to the soil or the air."},{"id":"b3","t":"Greenhouse food has no environmental cost.","bad":"No technology is free: the heating is a real cost."}],"risk":[{"id":"r1","t":"Winter heating gives greenhouse vegetables a large energy footprint.","ev":["g3"],"why":"The energy for heating adds to the footprint of every vegetable grown in winter."},{"id":"r2","t":"Greenhouse vegetables have no nutrients.","bad":"Unsupported: nothing in the evidence says so."}]},{"id":"waste","t":"Reducing food waste","blurb":"A large share of food is wasted along the chain, from farm to fridge. Cutting waste saves the land, water and energy already used to grow the food.","ev":[{"id":"w1","t":"A large share of food is wasted between the farm and the fridge."},{"id":"w2","t":"Wasted food also wastes the land, water and energy used to grow it."},{"id":"w3","t":"Cutting waste needs changes by farms, stores and households, such as better storage and planning."},{"id":"w4","t":"Food kept past its safe storage time can carry harmful microbes."},{"id":"w5","t":"Some food scraps can be composted."}],"ben":[{"id":"b1","t":"Wasting less food feeds more people without new farmland.","ev":["w1","w2"],"why":"Food that is saved has already used its land, water and energy, so nothing extra is needed to grow it."},{"id":"b2","t":"Reducing food waste ends hunger everywhere.","bad":"No single change does that; the evidence only shows savings."}],"risk":[{"id":"r1","t":"Results can be slow, because many people must change their habits.","ev":["w3"],"why":"Waste happens at every step, so every step has to change."},{"id":"r2","t":"Keeping food longer to avoid waste can make it unsafe to eat.","ev":["w4"],"why":"Saving food must not go past safe storage times."},{"id":"r3","t":"Composting makes food waste harmless, so cutting waste doesn’t matter.","bad":"Composting returns nutrients, but the land, water and energy used to grow the food are still lost."}]}],"evBad":"That evidence doesn’t support this claim. Choose the facts that back it up.","evNone":"Choose at least one piece of evidence."},"quickCheck":{"title":"Quick check","summary":"Footprints and food quick check","items":[{"id":"q1","goal":5,"prompt":"A footprint of 4.8 gha with a biocapacity of 1.6 gha per person means everyone living this way would need…","choices":[{"t":"0.33 Earths","fb":"4.8 ÷ 1.6 = 3.","_n":"14068","_k":"10a29f0f"},{"t":"3 Earths","fb":"4.8 ÷ 1.6 = 3.","_n":"15038","_k":"64bfaf00"},{"t":"6.4 Earths","fb":"4.8 ÷ 1.6 = 3.","_n":"16048","_k":"e930173f"},{"t":"4.8 Earths","fb":"4.8 ÷ 1.6 = 3.","_n":"17098","_k":"35d22beb"}]},{"id":"q2","goal":5,"prompt":"Crops worth 20 000 000 kJ feed how many people (4 000 000 kJ each per year) if eaten directly?","choices":[{"t":"0.5","fb":"20 000 000 ÷ 4 000 000 = 5.","_n":"180a8","_k":"0a650fb4"},{"t":"2","fb":"20 000 000 ÷ 4 000 000 = 5.","_n":"19078","_k":"b7c633fb"},{"t":"5","fb":"20 000 000 ÷ 4 000 000 = 5.","_n":"1a088","_k":"323ca3bf"},{"t":"50","fb":"20 000 000 ÷ 4 000 000 = 5.","_n":"1b0d8","_k":"34deac4b"}]},{"id":"q3","goal":5,"prompt":"The same crops are fed to cattle first. About how many people does the beef feed?","choices":[{"t":"0.5","fb":"About 10% passes on: 2 000 000 kJ, half a person’s need.","_n":"1c0e8","_k":"e67adf90"},{"t":"4.5","fb":"Only about 10% passes on: 2 000 000 kJ.","_n":"1d0b9","_k":"1f744710"},{"t":"5","fb":"Only about 10% passes on: 2 000 000 kJ.","_n":"1e0a9","_k":"9865383e"},{"t":"50","fb":"Only about 10% passes on: 2 000 000 kJ.","_n":"1f0d9","_k":"a4661194"}]},{"id":"q4","goal":6,"prompt":"Which statement about canola is supported by evidence?","choices":[{"t":"It is a wild plant never changed by people","fb":"Canadian breeders developed it from rapeseed in the 1970s.","_n":"1g0c9","_k":"9fd9400e"},{"t":"It is used only for fuel","fb":"Canadian breeders developed it from rapeseed in the 1970s.","_n":"1h079","_k":"c16eef55"},{"t":"It grows only in greenhouses","fb":"Canadian breeders developed it from rapeseed in the 1970s.","_n":"1i069","_k":"cce0b9ed"},{"t":"It was bred in Canada from rapeseed to make an edible oil","fb":"Canadian breeders developed it from rapeseed in the 1970s.","_n":"1j099","_k":"fdf8e99e"}]}]}},"practice":{"activities":[{"id":"pyr","type":"match","title":"Pyramid ↔ story","summary":"Pyramid ↔ story","goal":[2,3],"instruction":"Match each age pyramid (model shapes) with the story it tells.","leftTitle":"Pyramid","rightTitle":"Story","left":[{"id":"l1","t":"\u003cspan class=\"hp-mpyr\">\u003csvg viewBox=\"0 0 120 110\" role=\"img\" aria-label=\"Age pyramid: Very wide base, sides slope steeply inward\" focusable=\"false\">\u003crect class=\"hp-pb\" x=\"7.0\" y=\"100\" width=\"52.0\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"61\" y=\"100\" width=\"52.0\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"15.3\" y=\"94\" width=\"43.7\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"61\" y=\"94\" width=\"43.7\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"22.1\" y=\"88\" width=\"36.9\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"61\" y=\"88\" width=\"36.9\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"28.3\" y=\"82\" width=\"30.7\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"61\" y=\"82\" width=\"30.7\" height=\"5\"/>\u003crect class=\"hp-pb\" x=\"33.0\" y=\"76\" wi [4,5],"instruction":"Seven calculations. Items 4–7 are non-routine (★); the last two go beyond the Final Check.","use":"Growth rate (%) = (births − deaths + net migration, per 1000) ÷ 10. Doubling time ≈ 70 ÷ growth rate (%). About 10% of food energy passes to the next level.","items":[{"id":"h1","goal":4,"prompt":"Birth rate 30 per 1000, death rate 10 per 1000, no migration. Growth rate (%)?","boxes":[{"label":"Growth rate","unit":"%","_a":"Vw==","wrong":[{"match":20,"fb":"Per 1000 ÷ 10 = %."}]}],"display":"2.0%","why":"(30 − 10) ÷ 10 = 2.0%.","general":"Subtract deaths from births, then divide by 10."},{"id":"h2","goal":4,"prompt":"Doubling time at that rate?","boxes":[{"label":"Doubling time","unit":"years","_a":"VlQ=","wrong":[{"match":3500,"fb":"Use 2, not 0.02."}]}],"display":"35 years","why":"70 ÷ 2 = 35 years.","general":"Divide 70 by the growth rate in percent."},{"id":"h3","goal":4,"prompt":"Birth rate 12, death rate 8, net migration +6 (all per 1000). Growth rate, and doubling time?","boxes":[{"label":"Growth rate","unit":"%","_a":"VA==","wrong":[{"match":0.4,"fb":"Add net migration."},{"match":10,"fb":"Per 1000 ÷ 10 = %."}]},{"label":"Doubling time","unit":"years","_a":"UlE=","wrong":[{"match":175,"fb":"Add net migration first: the rate is larger."},{"match":7000,"fb":"Use the percentage, not the decimal."}]}],"display":"1.0%; 70 years","why":"(12 − 8 + 6) ÷ 10 = 1.0%; 70 ÷ 1 = 70 years.","general":"Growth = births − deaths + net migration, per 1000, then ÷ 10."},{"id":"h4","goal":4,"star":true,"prompt":"Birth rate 10, death rate 8, immigration 8 (all per 1000). What percentage of the growth comes from immigration?","boxes":[{"label":"Share from immigration","unit":"%","_a":"XVE=","wrong":[{"match":8,"fb":"Growth = 10 − 8 + 8 = 10 per 1000; immigration is 8 of the 10."},{"match":0.8,"fb":"That’s the fraction. Multiply by 100 for the percentage."}]}],"display":"80%","why":"Growth = 10 − 8 + 8 = 10 per 1000; immigration is 8 of the 10: 80%.","general":"Find the total growth per 1000 first, then the immigration part of it.","hints":["Total growth per 1000 = births − deaths + immigrants.","10 − 8 + 8 = 10.","8 ÷ 10 = 80%."]},{"id":"h5","goal":5,"star":true,"prompt":"A hectare’s crops hold 40 000 000 kJ; a person needs 4 000 000 kJ a year. People fed directly, and if the crops go to livestock first (10%)?","boxes":[{"label":"Fed directly","unit":"people","_a":"VFE="},{"label":"Through livestock","unit":"people","_a":"VA==","wrong":[{"match":9,"fb":"Only 10% passes on; you subtracted 10%."}]}],"display":"10; 1","why":"40 000 000 ÷ 4 000 000 = 10 directly; 10% of that is 4 000 000 kJ: 1 person.","general":"Divide the crop energy by one person’s need; through livestock, only about 10% is left."},{"id":"h6","goal":5,"star":true,"prompt":"Half the crops are eaten directly and half go to livestock. How many people can the hectare feed?","boxes":[{"label":"People fed","unit":"people","_a":"UE8N","wrong":[{"match":5,"fb":"Don’t forget the 0.5 person fed by the meat."},{"match":10,"fb":"Half the energy goes through livestock."}]}],"display":"5.5 people","why":"Half eaten directly feeds 5; the other half through livestock feeds 0.5: 5.5 people.","general":"Work out each half separately, then add."},{"id":"h7","goal":4,"star":true,"prompt":"A country of 30 million grows 2% per year. When does it reach 120 million, and what is it after 105 years at the same rate?","boxes":[{"label":"Reaches 120 million after","unit":"years","_a":"UlE=","wrong":[{"match":35,"fb":"35 years is one doubling: 60 million. 120 million is two doublings."}]},{"label":"Population after 105 years","unit":"million","_a":"V1UI","wrong":[{"match":60,"fb":"105 ÷ 35 = 3 doublings: × 8."},{"match":90,"fb":"105 ÷ 35 = 3 doublings: × 8."}]}],"display":"70 years; 240 million","why":"Doubling time 35 years: 120 = 30 × 4 is two doublings (70 years); 105 years is three doublings: 30 × 8 = 240 million.","general":"Find the doubling time first, then count doublings.","hints":["Doubling time = 70 ÷ 2 = 35 years.","120 = 30 × 4: two doublings = 70 years.","105 years = 3 doublings: 30 × 8 = 240 million."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Rohan","how":"","instruction":"Rohan made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"A population grows 0.5% per year. Find its doubling time.","steps":["Rule of 70: doubling time ≈ 70 ÷ growth rate.","Write the rate as a decimal: 70 ÷ 0.005.","Doubling time ≈ 14 000 years."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 divides correctly. The mistake is earlier."],"fixes":[{"t":"The rule uses the percentage: 70 ÷ 0.5 = 140 years.","why":"Use the percentage: 2% gives 70 ÷ 2 = 35 years, not 70 ÷ 0.02.","_n":"1k089","_k":"c1498f46"},{"t":"70 × 0.5 = 35 years.","why":"Divide, don’t multiply.","_n":"1l139","_k":"4fe760e2"},{"t":"0.5 ÷ 70 years.","why":"That’s upside down.","_n":"1m129","_k":"4bc1a566"},{"t":"Step 2 is correct.","why":"Use the percentage: 2% gives 70 ÷ 2 = 35 years, not 70 ÷ 0.02.","_n":"1n998","_k":"1b7f1841"}],"hints":["Try the rule at 7%: 70 ÷ 7 = 10 years. Which form of 7% did that use?","The percentage number.","70 ÷ 0.5 = 140 years."]},{"id":"e2","goal":2,"task":"Explain why a country’s population grew rapidly in stage 2.","steps":["In stage 1, birth and death rates are both high, so growth is slow.","In stage 2, better food, clean water and medicine lower the death rate.","At the same time, birth rates rise sharply.","The rising birth rate is what causes the rapid growth."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 builds on step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Birth rates stayed about the same at first. It was falling death rates that opened the gap.","_n":"1o9a8","_k":"358330ac"},{"t":"Birth rates stay high for a while; the gap opened by the falling death rate causes the rapid growth.","why":"Birth rates stayed about the same at first. It was falling death rates that opened the gap.","_n":"1p9b8","_k":"31ab652b"},{"t":"Death rates rise in stage 2.","why":"They fall.","_n":"1q9c8","_k":"5f353e0c"},{"t":"Both rates fall together in stage 2.","why":"Birth rates fall later, in stage 3.","_n":"1r958","_k":"8c343f91"}],"hints":["Look at the transition graph: does the birth-rate curve go up in stage 2?","It stays about level.","The falling death rate creates the gap."]},{"id":"e3","goal":3,"task":"A country’s fertility has just fallen to replacement level (about 2.1 children per woman). Its pyramid has a wide base. Predict its growth.","steps":["Replacement fertility means each pair of parents is replaced by about two children.","The wide base shows that many children and teens are alive now.","So the population stops growing right away.","Its total will stay the same from now on."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 repeats step 3’s idea."],"fixes":[{"t":"Fertility will rise again.","why":"Nothing suggests that.","_n":"1s968","_k":"142c435f"},{"t":"Step 3 is correct.","why":"A young population has many future parents. Births stay high for decades: population momentum.","_n":"1t978","_k":"6b6264a1"},{"t":"It will start shrinking right away.","why":"Replacement fertility doesn’t shrink a young population.","_n":"1u988","_k":"c88f79c3"},{"t":"Those many young people will soon have children of their own, so births stay high for decades: the population keeps growing for a generation or two (momentum).","why":"A young population has many future parents. Births stay high for decades: population momentum.","_n":"1v918","_k":"919a076e"}],"hints":["What will the children at the base of the pyramid be doing in 20 years?","Having children.","So births stay high for a while: momentum."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: how fast the last billions arrived, or that growth continues after fertility falls?"},{"id":"j2","q":"In your own words, why did the human population boom after 1800?"},{"id":"j3","q":"Explain to a friend why eating lower on the food chain can feed more people from the same land."},{"id":"j4","q":"Which idea or calculation is still shaky for you? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"In which stage of the demographic transition does the death rate fall quickly while the birth rate stays high?","options":[{"t":"Stage 4","why":"Both rates are low in stage 4.","_n":"1w928","_k":"afd702e7"},{"t":"Stage 3","why":"In stage 3 the birth rate falls.","_n":"1x9f8","_k":"4676dc64"},{"t":"Stage 1","why":"Both rates are high in stage 1.","_n":"1y9e8","_k":"b27b9842"},{"t":"Stage 2","why":"Food, clean water and medicine lower the death rate first; the birth rate stays high.","_n":"1z9d8","_k":"5c0f684b"}]},"b":{"prompt":"In which stage does the birth rate fall most quickly?","options":[{"t":"Stage 3","why":"Stage 3 is when family sizes shrink and the birth rate drops.","_n":"209c8","_k":"2be99297"},{"t":"Stage 5","why":"Rates are low and births are below deaths.","_n":"219b8","_k":"b0207330"},{"t":"Stage 4","why":"Both rates are already low.","_n":"229a8","_k":"6cb586c0"},{"t":"Stage 2","why":"The birth rate stays high in stage 2.","_n":"23998","_k":"343c6f15"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"A population grows 1.4% per year. By the rule of 70, about how long does it take to double?","options":[{"t":"50 years","why":"70 ÷ 1.4.","_n":"24988","_k":"47394498"},{"t":"5000 years","why":"Use 1.4, not 0.014.","_n":"25978","_k":"de99ba19"},{"t":"0.02 years","why":"That’s 1.4 ÷ 70, upside down.","_n":"26968","_k":"f1ec1d0b"},{"t":"98 years","why":"That’s 70 × 1.4; divide instead.","_n":"279d9","_k":"33a78a87"}]},"b":{"prompt":"A population grows 3.5% per year. About how long does it take to double?","options":[{"t":"245 years","why":"70 × 3.5; divide instead.","_n":"289e9","_k":"439b82ed"},{"t":"20 years","why":"70 ÷ 3.5 = 20.","_n":"299b9","_k":"756b8250"},{"t":"0.05 years","why":"Upside down: 3.5 ÷ 70.","_n":"2a9c9","_k":"eab0b79e"},{"t":"2000 years","why":"Use 3.5, not 0.035.","_n":"2b999","_k":"78be4d53"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"An age pyramid has a narrow base and a wide middle. What does it most likely show?","options":[{"t":"Mostly elderly people with no adults","why":"The middle is the widest part.","_n":"2c9a9","_k":"1348a0fa"},{"t":"A low birth rate; the population may soon shrink","why":"Fewer children than adults means fewer future parents.","_n":"2d979","_k":"276aabac"},{"t":"Rapid growth with many children","why":"Many children would make the base wide.","_n":"2e989","_k":"f78893d9"},{"t":"A high death rate among the young","why":"A narrow base reflects fewer births.","_n":"2f959","_k":"533f0413"}]},"b":{"prompt":"An age pyramid has a very wide base and a narrow top. What does it most likely show?","options":[{"t":"Rapid growth, with many young people","why":"Many children now means many parents later.","_n":"2g969","_k":"b4fbc74e"},{"t":"An aging population","why":"The young groups are the largest.","_n":"2h839","_k":"2c3db044"},{"t":"A stable population","why":"Stable pyramids have nearly straight sides.","_n":"2i829","_k":"caad9b2c"},{"t":"A shrinking population","why":"A wide base means many future parents.","_n":"2j859","_k":"6e36bba0"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A country has a birth rate of 14 per 1000, a death rate of 9 per 1000 and net immigration of 5 per 1000. What is its growth rate, and its doubling time by the rule of 70?","options":[{"t":"1.0%; about 70 years","why":"(14 − 9 + 5) ÷ 10 = 1.0.","_n":"2k849","_k":"751b6d4b"},{"t":"10%; about 7 years","why":"10 per 1000 is 1%, not 10%.","_n":"2l879","_k":"1c83f134"},{"t":"0.5%; about 140 years","why":"Immigration adds 5 per 1000.","_n":"2m869","_k":"d38dcd9c"},{"t":"2.8%; about 25 years","why":"Deaths subtract: 14 − 9 + 5, not 14 + 9 + 5.","_n":"2n899","_k":"f3ac4118"}]},"b":{"prompt":"Birth rate 12 per 1000, death rate 9 per 1000, net immigration 11 per 1000. Growth rate and doubling time?","options":[{"t":"0.3%; about 233 years","why":"Include immigration.","_n":"2o889","_k":"520605f0"},{"t":"1.4%; about 50 years","why":"(12 − 9 + 11) ÷ 10 = 1.4; 70 ÷ 1.4 = 50.","_n":"2p8b9","_k":"fe4d2286"},{"t":"14%; about 5 years","why":"Per 1000 ÷ 10.","_n":"2q8a9","_k":"9668c907"},{"t":"3.2%; about 22 years","why":"Deaths subtract.","_n":"2r7ae","_k":"0837d225"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Country Y’s fertility fell to replacement level five years ago, but its age pyramid still has a wide base. Over the next 30 years, its population will most likely…","options":[{"t":"stop growing immediately","why":"A young population has many future parents. Births stay high for decades: population momentum.","_n":"2s79e","_k":"f099e240"},{"t":"grow faster than ever","why":"Fertility per person is lower now; growth slows over time.","_n":"2t78e","_k":"687d99de"},{"t":"keep growing for decades, then level off","why":"Momentum: many young people are about to become parents.","_n":"2u77e","_k":"0967725f"},{"t":"start shrinking immediately","why":"Too many young people for that.","_n":"2v7ee","_k":"985fd86d"}]},"b":{"prompt":"Country Z’s fertility has been below replacement for 30 years. Its pyramid has a narrow base and a bulge at ages 50–65. With no immigration, over the next 30 years its population will most likely…","options":[{"t":"double by the rule of 70","why":"The growth rate is negative.","_n":"2w7de","_k":"3c86b095"},{"t":"stay exactly the same","why":"Deaths will soon outnumber births.","_n":"2x7ce","_k":"6fe33441"},{"t":"shrink, as the large older group ages and few children are born","why":"Few future parents and a large group reaching old age: deaths outnumber births.","_n":"2y7be","_k":"92b0a916"},{"t":"grow quickly, because the bulge means many people","why":"The bulge is past child-bearing age.","_n":"2z72e","_k":"e45237fe"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A hectare’s crops hold 30 000 000 kJ of food energy a year, and a person needs about 3 000 000 kJ a year. About 10% of the energy passes from crops to livestock. How many people can the hectare feed if the crops are eaten directly, and how many if they’re fed to livestock first?","options":[{"t":"10 directly; 9 through livestock","why":"About 10% is kept, not lost.","_n":"3071e","_k":"37c01558"},{"t":"100 directly; 10 through livestock","why":"30 000 000 ÷ 3 000 000 = 10.","_n":"31f4d","_k":"242d799c"},{"t":"10 directly; 1 through livestock","why":"30 000 000 ÷ 3 000 000 = 10; about 10% of that passes to meat: 1.","_n":"32f5d","_k":"b02a74ad"},{"t":"1 directly; 10 through livestock","why":"The livestock step loses energy.","_n":"33f6d","_k":"25ec5a8c"}]},"b":{"prompt":"A hectare’s crops hold 60 000 000 kJ a year; a person needs 4 000 000 kJ. How many people can it feed directly, and through livestock?","options":[{"t":"15 directly; 1.5 through livestock","why":"60 000 000 ÷ 4 000 000 = 15; about 10% of that: 1.5.","_n":"34f7d","_k":"7661f641"},{"t":"150 directly; 15 through livestock","why":"60 000 000 ÷ 4 000 000 = 15.","_n":"35f8d","_k":"3542849c"},{"t":"1.5 directly; 15 through livestock","why":"About 90% of the crop’s energy is lost at the livestock step, so the same hectare feeds about a tenth as many people.","_n":"36f9d","_k":"52d0b4a2"},{"t":"15 directly; 13.5 through livestock","why":"About 90% of the crop’s energy is lost at the livestock step, so the same hectare feeds about a tenth as many people.","_n":"37fad","_k":"0c07e0f7"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of the steep rise in the world population since about 1800?","options":[{"t":"“Death rates fell, thanks to a better food supply, clean water, sanitation, vaccines and medicine, while birth rates fell only later, so births outnumbered deaths by a growing margin.”","why":"It names the cause (falling death rates) and the timing of the birth rate.","_n":"38fbd","_k":"a1bbb09c"},{"t":"“The Earth’s carrying capacity doubled every year.”","why":"Carrying capacity doesn’t double each year.","_n":"39ecd","_k":"a80ef182"},{"t":"“Birth rates rose sharply after 1800.”","why":"Birth rates stayed about the same at first. It was falling death rates that opened the gap.","_n":"3aedd","_k":"5d950305"},{"t":"“People began living for hundreds of years.”","why":"Life expectancy rose, but not like that.","_n":"3b66e","_k":"61bdfcde"}]},"b":{"prompt":"The world’s growth rate (%) has fallen since the 1960s, yet the population keeps rising. Which is the best explanation?","options":[{"t":"“The data must be wrong: a falling rate means a falling population.”","why":"A smaller percentage of a larger population can still be a big yearly increase. The population shrinks only when the rate is negative.","_n":"3c65e","_k":"20f50324"},{"t":"“Death rates have risen.”","why":"Death rates have mostly fallen.","_n":"3d68e","_k":"506a6ae6"},{"t":"“A smaller percentage of a much larger population still adds many people each year; the population shrinks only if the growth rate becomes negative.”","why":"A smaller percentage of a larger population can still be a big yearly increase. The population shrinks only when the rate is negative.","_n":"3e67e","_k":"bef8489b"},{"t":"“Migration between countries adds people to the world.”","why":"Migration moves people; it doesn’t add to the world’s total.","_n":"3f6ae","_k":"671ce3fd"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"A student wants to show the age and sex structure of Canada’s population in one image. Which representation is best?","options":[{"t":"A line graph of the total population over time","why":"That shows size, not structure.","_n":"3g69e","_k":"ef510974"},{"t":"A map of provinces","why":"That shows where, not what ages.","_n":"3h6ce","_k":"59f9c659"},{"t":"An age pyramid","why":"Bars for each age group, males on one side and females on the other.","_n":"3i6be","_k":"058fdb4a"},{"t":"A pie chart of the birth rate","why":"One number doesn’t need a pie chart.","_n":"3j6ee","_k":"a1c2b935"}]},"b":{"prompt":"A student wants to show how birth and death rates change through the demographic transition. Which representation is best?","options":[{"t":"A pie chart of today’s population","why":"It shows no change over time.","_n":"3k6de","_k":"ac1a5b31"},{"t":"A single bar for the current growth rate","why":"It shows no stages.","_n":"3l80e","_k":"28228a0c"},{"t":"A line graph of both rates against time, with the gap between them shaded","why":"It shows both rates changing and the gap that sets the growth rate.","_n":"3m81e","_k":"e4d67ae7"},{"t":"An age pyramid for one year","why":"That shows structure at one moment.","_n":"3n7ee","_k":"1e1c760a"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Herbicide-tolerant canola lets farmers control weeds with one herbicide and till the soil less. Which statement best weighs a benefit against a risk using evidence?","options":[{"t":"“It makes canola oil unsafe to eat.”","why":"This claim isn’t supported by the evidence presented.","_n":"3o7fe","_k":"63ff4a3c"},{"t":"“It’s dangerous because it isn’t natural.”","why":"No evidence is given.","_n":"3p7ce","_k":"1004f8ae"},{"t":"“It has no risks because it’s approved.”","why":"Approval doesn’t mean zero risk.","_n":"3q7de","_k":"f0e0f1c4"},{"t":"“Less tillage reduces soil erosion and fuel use, but relying on one herbicide can select for herbicide-resistant weeds, so farmers need to rotate herbicides and crops.”","why":"It names a benefit and a risk, each backed by evidence.","_n":"3r7ae","_k":"48b84895"}]},"b":{"prompt":"Greenhouses near Leamington grow vegetables year-round. Which statement best weighs a benefit against a risk using evidence?","options":[{"t":"“Greenhouses are bad because the food isn’t grown outdoors.”","why":"No evidence is given.","_n":"3s7be","_k":"0635b394"},{"t":"“Greenhouse vegetables have no nutrients.”","why":"Unsupported.","_n":"3t78e","_k":"2a008001"},{"t":"“Greenhouses give high yields per hectare and can recycle water, but heating them through Canadian winters uses a lot of energy.”","why":"It names benefits and a risk, each backed by evidence.","_n":"3u79e","_k":"cf0b5cd6"},{"t":"“Greenhouses solve all food problems.”","why":"No technology does that.","_n":"3vf2e","_k":"279cc5ae"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A person’s footprint is 6.4 gha and Earth’s biocapacity is 1.6 gha per person (model values). How many Earths would we need if everyone lived this way, and how many after they switch from a high-meat diet (2.4 gha) to a mostly-plant diet (0.8 gha)?","options":[{"t":"4 Earths, then 3 Earths","why":"6.4 ÷ 1.6 = 4; (6.4 − 1.6) ÷ 1.6 = 3.","_n":"3wf1e","_k":"fe9cdfaf"},{"t":"4 Earths, then still 4","why":"Diet is part of the footprint.","_n":"3xf0e","_k":"f00c79ba"},{"t":"4 Earths, then 2.4","why":"Subtract the 1.6 gha saving first, then divide.","_n":"3yefe","_k":"58727014"},{"t":"0.25 Earths, then 0.33","why":"That’s biocapacity ÷ footprint, upside down.","_n":"3zeee","_k":"c7a192ac"}]},"b":{"prompt":"A footprint of 8.0 gha, biocapacity 1.6 gha per person. Earths needed, and after the same diet switch (saving 1.6 gha)?","options":[{"t":"5 Earths, then 3.4","why":"(8.0 − 1.6) ÷ 1.6 = 4.","_n":"40ede","_k":"23d2d052"},{"t":"0.2 Earths, then 0.25","why":"Upside down.","_n":"41ece","_k":"9d3c0094"},{"t":"5 Earths, then still 5","why":"A footprint counts the land and water needed for your food, goods, energy and housing, not just carbon from driving.","_n":"42ebe","_k":"292994d2"},{"t":"5 Earths, then 4 Earths","why":"8.0 ÷ 1.6 = 5; (8.0 − 1.6) ÷ 1.6 = 4.","_n":"43fae","_k":"a462fdfe"}]}}]},"task":{"title":"Feed the family","summary":"Feed the family","statement":"\u003cp>Plan a week of protein servings for one person that uses little land
