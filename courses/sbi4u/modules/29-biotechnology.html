s-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"2ed769bb","content":{"id":"29-biotechnology","kind":"topic","title":"Biotechnology","topic":"Biotechnology","readyTopic":"biotechnology","hero":{"eq":"\u003cspan class=\"bt-heq\">\u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-nadh)\">insulin mRNA\u003c/span> \u003cspan class=\"bt-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003csmall>reverse transcriptase\u003c/small>\u003c/span> \u003cspan class=\"bio-tok\" style=\"--tok:var(--pen)\">cDNA\u003c/span> \u003cspan class=\"bt-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003csmall>✂ restriction enzyme\u003c/small>\u003c/span> \u003cspan class=\"bt-hw\">cut gene + plasmid\u003c/span> \u003cspan class=\"bt-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003csmall>DNA ligase\u003c/small>\u003c/span> \u003cspan class=\"bio-tok\" style=\"--tok:var(--ink)\">recombinant plasmid\u003c/span> \u003cspan class=\"bt-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003csmall>transformation\u003c/small>\u003c/span> \u003cspan class=\"bt-hw\">bacteria\u003c/span> \u003cspan class=\"bt-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003csmall>protein synthesis\u003c/small>\u003c/span> \u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">human insulin\u003c/span>\u003c/span>","eqLabel":"Insulin mRNA is copied into cDNA by reverse transcriptase. A restriction enzyme cuts the gene and a plasmid. DNA ligase joins them into a recombinant plasmid. Transformation puts it into bacteria, which make human insulin.","eqSize":"sm","headline":"Every tool solves one problem","text":"\u003cstrong>Biotechnology\u003c/strong> uses living things and their molecules to make products and solve problems. In \u003cstrong>genetic engineering\u003c/strong>, scientists cut DNA with \u003cstrong>restriction enzymes\u003c/strong>, join it with \u003cstrong>DNA ligase\u003c/strong>, and carry it into cells on a \u003cstrong>vector\u003c/strong> such as a plasmid. The result is \u003cstrong>recombinant DNA\u003c/strong>: DNA from two sources in one molecule. When a cell takes it up (\u003cstrong>transformation\u003c/strong>), the cell can make a protein it never made before.","fig":{"html":"\u003cdiv class=\"bt-hero\" id=\"bt-hero\" role=\"img\" aria-label=\"A pancreas cell glows. An insulin mRNA strand in teal slides out and becomes a blue DNA copy labelled cDNA. A plasmid ring opens where scissors cut it, and the blue gene slips into the gap. A ligase tag seals both joins. The plasmid drifts into a rod-shaped bacterium, which divides into 2, 4, then 8 cells, and small brown insulin shapes appear beside them.\">\u003c/div>"}},"goals":["I can name the main biotechnology tools and explain what problem each one solves.","I can describe how a recombinant plasmid is made and put into host cells, and how transformed cells are picked out.","I can explain why a human gene must be given to bacteria as cDNA (without introns).","I can tell gene cloning from reproductive cloning, and describe examples of genetic modification in medicine, industry and agriculture.","I can identify which Canadian body or law applies to a biotechnology product.","I can weigh the benefits and risks of a biotechnology application using evidence and reasoning."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Base pairing","goal":2,"prompt":"Which strand pairs with 5′-ATGCCG-3′?","options":[{"t":"5′-TACGGC-3′","why":"The partner’s ends are flipped: its 3′ end sits across from the 5′ end.","_n":"0330","_k":"7183c862"},{"t":"3′-ATGCCG-5′","why":"Each base pairs with its partner: A with T, G with C.","_n":"1340","_k":"956f6e6c"},{"t":"3′-UACGGC-5′","why":"DNA has T, not U.","_n":"2350","_k":"103da15a"},{"t":"3′-TACGGC-5′","why":"A pairs with T and G with C, and the partner strand runs the opposite way.","_n":"3360","_k":"8ef851db"}],"hints":["Pair each base, then label the ends.","A–T, T–A, G–C, C–G, C–G, G–C gives TACGGC.","Opposite direction: 3′-TACGGC-5′."]},{"id":"w2","skill":"Base pairing","goal":2,"prompt":"A double-stranded DNA sample is 30% adenine. What percentage is guanine?","options":[{"t":"70%","why":"T is also 30%.","_n":"4370","_k":"46387ac2"},{"t":"20%","why":"A = T = 30%, so A + T = 60%. That leaves 40% for G + C, so G = 20%.","_n":"5380","_k":"978bea37"},{"t":"30%","why":"G pairs with C, not A.","_n":"6390","_k":"732b920a"},{"t":"40%","why":"40% is G and C together; G is half.","_n":"73a0","_k":"91ac3803"}],"hints":["A pairs with T, so they’re equal.","A + T = 60%.","(100 − 60) ÷ 2 = 20%."]},{"id":"w3","skill":"Gene expression","goal":3,"prompt":"Which molecule carries a gene’s instructions from the nucleus to a ribosome?","options":[{"t":"rRNA","why":"rRNA is part of the ribosome itself.","_n":"83b0","_k":"a378764b"},{"t":"mRNA","why":"Messenger RNA is transcribed from the gene and translated at the ribosome.","_n":"9336","_k":"4340bd82"},{"t":"tRNA","why":"tRNA brings amino acids to the ribosome; it doesn’t carry the gene’s message.","_n":"a326","_k":"9df23be0"},{"t":"DNA polymerase","why":"That enzyme copies DNA during replication.","_n":"b316","_k":"f6dd368c"}],"hints":["Which RNA is a copy of the gene?","The “messenger”.","mRNA."]},{"id":"w4","skill":"Gene expression","goal":3,"prompt":"A eukaryotic pre-mRNA has 3 exons and 2 introns. What does the mature mRNA contain?","options":[{"t":"All 5 pieces","why":"That’s the pre-mRNA.","_n":"c306","_k":"a71612bc"},{"t":"The 3 exons, joined together","why":"Splicing removes the introns and joins the exons.","_n":"d376","_k":"80b6e38b"},{"t":"The 3 exons and 1 intron","why":"Splicing removes every intron.","_n":"e366","_k":"f2a624c0"},{"t":"The 2 introns only","why":"Introns are removed; exons are expressed.","_n":"f356","_k":"88aeeb14"}],"hints":["Which pieces are expressed?","Introns are cut out.","Exons only, joined."]},{"id":"w5","skill":"Mutations","goal":1,"prompt":"A mutation changes one base, but the amino acid stays the same. What kind of mutation is it?","options":[{"t":"Nonsense","why":"Nonsense makes a stop codon.","_n":"g346","_k":"5181b8c4"},{"t":"Silent","why":"Several codons code for the same amino acid.","_n":"h3b6","_k":"f8fef4fa"},{"t":"Missense","why":"Missense changes the amino acid.","_n":"i3a6","_k":"d4340f27"},{"t":"Frameshift","why":"A frameshift comes from inserting or deleting bases, not a one-base swap.","_n":"j396","_k":"f27e12ec"}],"hints":["Did the protein change?","No change in the amino acid.","Silent."]},{"id":"w6","skill":"Bacteria and plasmids","goal":2,"prompt":"What is a plasmid?","options":[{"t":"The bacterium’s main chromosome","why":"Plasmids are extra DNA rings, separate from it.","_n":"k3a6","_k":"1e2d8001"},{"t":"A small, circular DNA molecule in bacteria, separate from the main chromosome, that is copied on its own","why":"Plasmids are small extra rings of DNA, copied on their own and passed on when the cell divides.","_n":"l376","_k":"edd527a3"},{"t":"A ribosome subunit","why":"Ribosomes are made of rRNA and protein.","_n":"m386","_k":"bc3d645e"},{"t":"The protein coat around a bacterium","why":"That’s a cell wall or capsule, not DNA.","_n":"n356","_k":"1582f32c"}],"hints":["It’s DNA.","Small, circular and extra.","A small, circular DNA molecule, separate from the main chromosome."]}],"refreshers":{"Base pairing":"A pairs with T (U in RNA), and G with C. The two strands are antiparallel: the 5′ end of one sits across from the 3′ end of the other. In double-stranded DNA, %A = %T and %G = %C.","Gene expression":"DNA → mRNA (transcription) → protein (translation). In eukaryotes, the pre-mRNA is spliced: introns out, exons joined.","Mutations":"Silent: same amino acid. Missense: a different amino acid. Nonsense: a stop codon. Frameshift: bases added or removed (not in threes) shift the reading frame.","Bacteria and plasmids":"Bacteria have one main circular chromosome and often small extra rings called plasmids, which are copied on their own and passed on when the cell divides."}}},"explore":{"heading":"Biotech toolkit map","intro":"Explore the tools, then chain them into a route that makes a product. Run your route to see where it works and where it breaks.","chalIntro":"Use the \u003cstrong>Route builder\u003c/strong> to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 unlocks the rice goal once challenge 1 is met. Each challenge has three levels of help.","cards":[{"id":"re","t":"Restriction enzyme","problem":"Cut DNA at one exact sequence","deeper":"33"},{"id":"lig","t":"DNA ligase","problem":"Seal two DNA pieces into one molecule","deeper":"33"},{"id":"vec","t":"Plasmid vector","problem":"Carry a gene into a cell, where it gets copied","deeper":"33"},{"id":"rt","t":"Reverse transcriptase","problem":"Make a DNA copy (cDNA) of an mRNA, with no introns"},{"id":"pcr","t":"PCR","problem":"Make millions of copies of one DNA region","deeper":"30"},{"id":"gel","t":"Gel electrophoresis","problem":"Sort DNA fragments by size","deeper":"32"},{"id":"seq","t":"DNA sequencing","problem":"Read the exact order of bases"},{"id":"cr","t":"CRISPR-Cas9","problem":"Change the DNA at one chosen site in a living cell","deeper":"31","note":"Precise, targeted DNA changes started earlier: Canadian Michael Smith shared the 1993 Nobel Prize in Chemistry for a method to change one chosen base."},{"id":"tf","t":"Transformation and selection","problem":"Get the plasmid into cells, then keep only cells that took it up","deeper":"33"},{"id":"clone","t":"Reproductive cloning","problem":"Make a whole organism genetically identical to a donor"}],"deeper":{"30":{"file":"30-pcr.html","t":"30 PCR"},"31":{"file":"31-crispr.html","t":"31 CRISPR gene editing"},"32":{"file":"32-gel-electrophoresis.html","t":"32 Gel electrophoresis"},"33":{"file":"33-restriction-enzymes-and-recombinant-dna.html","t":"33 Restriction enzymes and recombinant DNA"}},"goalsList":[{"id":"insulin","t":"Insulin from bacteria"},{"id":"gfp","t":"Glowing reporter bacteria (GFP)"},{"id":"rice","t":"Beta-carotene rice"}],"tiles":[{"id":"T1","t":"Make cDNA from mRNA (reverse transcriptase)","card":"rt"},{"id":"T2","t":"Copy the gene from chromosome DNA (PCR)","card":"pcr"},{"id":"T3","t":"Cut gene and vector with the \u003cstrong>same\u003c/strong> restriction enzyme","card":"re"},{"id":"T4","t":"Cut gene and vector with \u003cstrong>two different\u003c/strong> enzymes","card":"re"},{"id":"T5","t":"Seal with DNA ligase","card":"lig"},{"id":"T6","t":"Put the plasmid into bacteria (transformation)","card":"vec"},{"id":"T7","t":"Deliver the DNA into plant cells (gene gun)","card":"gun"},{"id":"T8","t":"Selection: a marker gene lets only transformed cells grow","card":"tf"},{"id":"T9","t":"Grow whole plants from transformed cells","card":"plant"},{"id":"T10","t":"Check the insert: gel electrophoresis","card":"gel"},{"id":"T11","t":"Check the insert: DNA sequencing","card":"seq"},{"id":"T12","t":"Grow in a fermentation tank","card":"tank"},{"id":"T13","t":"Purify the protein","card":"pure"},{"id":"T14","t":"Reproductive cloning","card":"clone"},{"id":"T15","t":"CRISPR edit","card":"cr"}],"rules":{"introns":"Faulty protein: bacteria can’t remove introns.","t4":"No recombinant plasmids: the ends don’t pair.","t5":"Nothing to seal yet.","mixed":"Unreliable, since you can’t tell which cells have the gene.","t12":"Nothing to grow yet.","t14bact":"Reproductive cloning copies a whole animal; it doesn’t put a gene into bacteria.","t14rice":"Reproductive cloning copies a whole organism; it doesn’t put a new gene into a plant.","t15":"CRISPR changes DNA that’s already in a cell; this goal needs a whole new gene added.","noGene":"There’s no gene to cut yet. Start with a copy of the gene.","cutTwice":"The gene and vector are already cut.","geneLate":"The gene is already copied and cut; another copy isn’t needed here.","sealTwice":"The pieces are already sealed.","notJoined":"Plasmid and gene not joined yet: cut them with the same enzyme and seal them first.","t6rice":"That puts the plasmid into bacteria; the host here is rice.","t7bact":"A gene gun delivers DNA into plant cells; the host here is bacteria.","twice":"The DNA is already in the cells.","t8early":"Nothing to select yet: no cells have been given the plasmid.","t9bact":"Bacteria don’t grow into plants.","t9early":"There are no transformed plant cells yet.","checkEarly":"Nothing to check yet: no cells carry the recombinant plasmid.","checkSel":"Pick out the transformed cells first, then check the insert in them.","checkPlant":"Grow whole plants first, then check the insert in them.","checkLate":"Check the insert before you scale up in the tank.","t12rice":"Rice isn’t grown in a tank.","t13rice":"The beta-carotene is wanted in the grain itself; there’s nothing to purify.","t13early":"Nothing to purify yet: grow the cells in the tank first.","noCells":"The plasmid never got into any cells.","noTank":"Only a few colonies: grow the cells in a fermentation tank to make enough.","noPure":"The insulin is mixed with bacterial proteins: purify it.","noCheck":"The insert was never checked, so you can’t be sure the gene went in correctly.","noPlants":"Transformed cells aren’t plants yet. Grain comes from a whole plant grown from those cells.","empty":"Place tiles on the stations first."},"tc2Route":["T2","T4","T5","T6","T8","T10","T12","T13",null],"predictions":[{"id":"p1","prompt":"The gene was copied straight from human chromosome DNA. What will the bacteria make?","options":[{"t":"Normal human insulin","_n":"o366","_k":"44c7e9de"},{"t":"Insulin plus a separate protein for each intron","_n":"p336","_k":"3a4a8928"},{"t":"A faulty protein, because bacteria can’t remove the introns","_n":"q346","_k":"996b8bc1"},{"t":"Nothing, because bacteria can’t read human DNA","_n":"r416","_k":"f11cd239"}],"explain":"Bacteria have no spliceosomes. The intron sequences stay in the mRNA and get translated (or hit a stop codon). Bacteria \u003cem>can\u003c/em> read human codons, though: the code is nearly universal.","reveal":"Every station passed, but the product is a misshapen protein: the intron-coded segments (marked) were translated too.","start":{"kind":"route","slots":["T2","T3","T5","T6","T8","T10","T12","T13",null]}},{"id":"p2","prompt":"The plasmid and gene were cut with two different enzymes whose sticky ends don’t match. Will ligase join them?","options":[{"t":"No: the ends can’t pair, so few or no recombinant plasmids form","_n":"s426","_k":"458fecc8"},{"t":"Yes, ligase joins any ends","_n":"tbf7","_k":"237a2f01"},{"t":"Yes, but the gene goes in backwards","_n":"ube7","_k":"34f49f4b"},{"t":"Only if the mixture is heated","_n":"vc17","_k":"3c3c4a23"}],"explain":"Ligase only seals a backbone gap once complementary bases have paired. Different overhangs don’t pair.","reveal":"The ends came close, failed to pair and drifted apart. The plasmid closed on itself with no gene inside.","start":{"kind":"route","slots":["T1","T4","T5","T6","T8","T10","T12","T13",null]}},{"id":"p3","prompt":"Now the cells are spread on a selection plate. What grows?","options":[{"t":"All the cells, but only some make insulin","_n":"wc07","_k":"535f45b3"},{"t":"Only the cells without a plasmid","_n":"xc37","_k":"9df65f1b"},{"t":"No cells","_n":"yc27","_k":"12bb8203"},{"t":"Only the cells that took up the plasmid","_n":"zc57","_k":"3db10b40"}],"explain":"The plasmid carries a marker gene that lets only transformed cells grow on the selection plate. That’s how you find the few that took it up.","reveal":"Two colonies grew, one from each transformed cell. The other 38 cells didn’t grow.","start":{"kind":"plate"}},{"id":"p4","prompt":"Each PCR cycle doubles the copies. Starting from 1 copy, how many after 10 cycles?","options":[{"t":"20","_n":"10c47","_k":"0b156743"},{"t":"100","_n":"11b77","_k":"841fe722"},{"t":"512","_n":"12b67","_k":"7031f7c8"},{"t":"1024","_n":"13c57","_k":"c407d2be"}],"explain":"2¹⁰ = 1024. Doubling, not adding: 20 would be +2 per cycle; 512 is only 9 doublings.","reveal":"The counter doubled 10 times: 1, 2, 4, 8, … 512, 1024.","start":{"kind":"pcr"}}],"challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build a working route for insulin from bacteria.","why":"T1, T3, T5, T6, T8, a check, T12, T13: every link solves one problem, so the product reads “Working human insulin”.","general":"Run the route to see where it breaks, then fix that station.","named":{"goal":"Switch the goal to \u003cstrong>Insulin from bacteria\u003c/strong>.","mode":"Switch to the \u003cstrong>Route builder\u003c/strong> first.","noT8":"Most cells never took up the plasmid. Add a selection station so only transformed cells grow.","t12":"There’s nothing to grow until the cells have the plasmid.","t14":"Gene cloning copies a gene; reproductive cloning copies a whole organism; selective breeding chooses parents; genetic modification inserts or changes DNA.","t15":"Editing isn’t adding a gene.","t2":"Bacteria can’t remove introns. Give them cDNA, made from mature mRNA, which holds only the exons.","t4":"Sticky ends join only if their unpaired bases are complementary. Cut both pieces with the same enzyme.","noCheck":"Add a check of the insert (gel or sequencing) before the tank."},"hints":["Start with the right copy of the gene: bacteria can’t remove introns.","Cut, then seal, then get it into cells, then keep only the transformed ones.","T1, T3, T5, T6, T8, a check, T12, T13."]},{"id":"tc2","goal":[2,3],"prompt":"This route makes no insulin. Fix it by swapping \u003cstrong>exactly two\u003c/strong> tiles. (Press \u003cstrong>Load challenge 2’s route\u003c/strong> in the Route builder.)","why":"Station 1 needed cDNA (T1), and station 2 needed the same enzyme on both pieces (T3). The T4 problem stopped the run early; the intron problem was hiding behind it.","general":"Run it, find where it breaks, then swap tiles.","named":{"goal":"Switch the goal to \u003cstrong>Insulin from bacteria\u003c/strong>.","mode":"Switch to the \u003cstrong>Route builder\u003c/strong> first.","only2":"One problem was hiding behind the other. Which station still causes trouble later?","only1":"No recombinant plasmids: the ends still don’t pair.","extra":"Two swaps are enough. Undo the others.","load":"Press \u003cstrong>Load challenge 2’s route\u003c/strong> first, then swap exactly two tiles."},"hints":["Run it. Where does it stop? That’s one problem; is there a second that would show up later?","Different enzymes → unmatched ends. Chromosome DNA → introns.","Station 1 → T1, station 2 → T3."]},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Goal: a rice plant that makes beta-carotene (a vitamin A precursor) in its grain. Build the shortest working route. (Unlocks after challenge 1.)","why":"T1 or T2, T3, T5, T7, T8, T9, then a check: plant cells splice introns, the gene gun delivers the DNA, and the grain comes from whole plants, so there’s no tank and nothing to purify.","general":"Run the route to see where it breaks, then fix that station.","named":{"locked":"Meet challenge 1 first; that unlocks the rice goal.","goal":"Switch the goal to \u003cstrong>Beta-carotene rice\u003c/strong>.","mode":"Switch to the \u003cstrong>Route builder\u003c/strong> first.","t13":"The beta-carotene is wanted in the grain itself; there’s nothing to purify.","t12":"Rice isn’t grown in a tank.","noT9":"Transformed cells aren’t plants yet. Grain comes from a whole plant grown from those cells.","t6":"That puts the plasmid into bacteria; the host here is rice.","long":"It works, but one station isn’t needed. (Hint: plant cells \u003cem>can\u003c/em> remove introns, so either gene copy works, and there’s no tank.)"},"hints":["What’s different about a plant host compared with bacteria? Think about introns, and about where the product ends up.","Plant cells splice introns, so T1 or T2 both work. You need to deliver DNA into plant cells, select, then grow whole plants.","T1 (or T2), T3, T5, T7, T8, T9, then a check."]}]},"part3":{"slug":"society","name":"Society","heading":"Biotech and society","intro":"From building routes to judging their use: sort who checks each product in Canada, read a field trial’s data, then build an argument from evidence. Finish with the quick check.","st1":{"title":"Station 1: Who checks it?","how":"Tap a card, then tap the box it belongs in.","boxes":[{"id":"hc","t":"Health Canada"},{"id":"cfia","t":"CFIA (Canadian Food Inspection Agency)"},{"id":"ahra","t":"Assisted Human Reproduction Act"},{"id":"court","t":"The courts and patent law"}],"cards":[{"id":"c1","t":"Is food from a new genetically engineered crop safe to eat?","box":"hc"},{"id":"c2","t":"Is a recombinant insulin medicine safe and effective?","box":"hc"},{"id":"c3","t":"Can a genetically engineered crop be grown in open fields?","box":"cfia"},{"id":"c4","t":"Is a modified crop safe as livestock feed?","box":"cfia"},{"id":"c5","t":"May a clinic create a human clone, or make DNA changes to an embryo that could be passed on?","box":"ahra","after":"Prohibited."},{"id":"c6","t":"Can a company patent a modified mouse?","box":"court","after":"Harvard mouse case, Supreme Court of Canada, 2002: higher life forms aren’t patentable."}],"wrong":"Health Canada judges whether it’s safe to eat or use as a medicine; the CFIA judges what happens when a plant is released into fields or fed to animals.","wrongOther":"In Canada, Health Canada assesses food and drug safety, the CFIA assesses crops released into the environment, and the Assisted Human Reproduction Act sets limits on human embryos.","done":"✓ All six cards are in the right boxes. Each body answers a different question about the same kind of product."},"st2":{"title":"Station 2: Check it with data","text":"A fictional field trial of a drought-tolerant wheat variety. Each variety grew in 4 replicate plots in a dry year and in a normal year, in the same fields.","cols":["Year type","Standard wheat (t/ha)","Drought-tolerant wheat (t/ha)","Plot-to-plot variation"],"rows":[["Dry year","2.4","3.6","±0.2"],["Normal year","4.1","4.0","±0.2"]],"qs":[{"id":"d1","prompt":"In which year type does the new variety help?","choices":[{"t":"Both year types","fb":"In the normal year the 0.1 t/ha difference is within the ±0.2 variation, so there’s no real advantage.","_n":"14c67","_k":"56799501"},{"t":"Neither year type","fb":"In the dry year the gap is 1.2 t/ha, much larger than the ±0.2 variation.","_n":"15c77","_k":"ea65beb1"},{"t":"Dry years only","fb":"In the dry year it gave 3.6 t/ha against 2.4 t/ha, far more than the ±0.2 variation. In the normal year the 0.1 t/ha difference is within the ±0.2 variation.","_n":"16c87","_k":"bc23390e"},{"t":"Normal years only","fb":"In the normal year the 0.1 t/ha difference is within the ±0.2 variation. Look at the dry year.","_n":"17c17","_k":"eead6171"}]},{"id":"d2","prompt":"Why grow standard wheat in the same fields?","choices":[{"t":"To give the farmer a backup crop","fb":"It’s the \u003cstrong>control\u003c/strong>: same soil and weather, so the difference is due to the variety.","_n":"18c27","_k":"c16add61"},{"t":"To make the total harvest bigger","fb":"It’s the \u003cstrong>control\u003c/strong>: same soil and weather, so the difference is due to the variety.","_n":"19c37","_k":"61fc9811"},{"t":"It’s the control: same soil and weather, so the difference is due to the variety","fb":"The control shares everything except the variety, so any difference comes from the variety.","_n":"1ac47","_k":"d06b23d5"},{"t":"Standard wheat helps the new variety grow","fb":"It’s the \u003cstrong>control\u003c/strong>: same soil and weather, so the difference is due to the variety.","_n":"1bbd7","_k":"1c39031e"}]},{"id":"d3","prompt":"Why four plots of each?","choices":[{"t":"Replication: it shows how much results vary by chance","fb":"The ±0.2 comes from comparing the replicate plots.","_n":"1cbe7","_k":"f9c6465d"},{"t":"Four plots make each yield four times larger","fb":"Yield is per hectare, so it doesn’t grow with the number of plots. \u003cstrong>Replication\u003c/strong> shows how much results vary by chance.","_n":"1dcb7","_k":"12c404f5"},{"t":"To use up all the seed","fb":"\u003cstrong>Replication\u003c/strong> shows how much results vary by chance.","_n":"1eca7","_k":"0fac4d5b"},{"t":"So each plot can get a different treatment","fb":"All four plots of a variety get the same treatment. \u003cstrong>Replication\u003c/strong> shows how much results vary by chance.","_n":"1fc97","_k":"e7738450"}]}]},"st3":{"title":"Station 3: Weigh it up","caseQ":"Should this drought-tolerant wheat be approved for Prairie farms?","how":"Choose one claim, tap the evidence that supports it (one or more), then choose the reasoning that links them. Then press Check my argument.","claims":[{"id":"ap","t":"Approve"},{"id":"mon","t":"Approve after further field monitoring"},{"id":"no","t":"Do not approve yet"}],"evidence":[{"id":"dry","t":"Dry-year yields: 3.6 vs 2.4 t/ha"},{"id":"norm","t":"Normal-year yields: 4.0 vs 4.1 t/ha"},{"id":"safe","t":"Assessed for food safety"},{"id":"gap","t":"Environmental effects not yet studied over several seasons"},{"id":"cost","t":"Seed costs more"},{"id":"pref","t":"Some consumers prefer non-modified foods"}],"reasons":[{"id":"r1","t":"Drought is a main risk to Prairie farms, so a variety that holds its yield in dry years protects harvests."},{"id":"r2","t":"How a crop affects fields, soil and other species must be known before it’s grown widely."},{"id":"r3","t":"The dry-year benefit is real, but the missing environmental data should be gathered as the crop is grown."},{"id":"r4","t":"If some people dislike a crop, it must be risky."}],"accept":[{"claim":"mon","need":["dry","gap"],"reason":"r3","t":"Approve after further monitoring, backed by the dry-year yields and the gap in environmental data."},{"claim":"ap","need":["dry","safe"],"reason":"r1","t":"Approve, backed by the dry-year yields and the food-safety assessment, with reasoning about drought risk."},{"claim":"no","need":["gap"],"reason":"r2","t":"Do not approve yet, backed by the environmental data gap, with reasoning that field effects must be known first."}],"msg":{"claim":"Choose a claim first.","ev":"Tap at least one piece of evidence.","reason":"Choose the reasoning that links your evidence to your claim.","pref":"Preference is a value, not evidence about the crop.","norm":"The data show no advantage in normal years.","r4":"Disliking something isn’t evidence that it’s risky. Ask what this product does, what the data show, and what the risks are. One case doesn’t decide another.","need":{"ap":"To approve, show the benefit (the dry-year yields) and that it passed a food-safety assessment.","mon":"Back this claim with both the benefit (the dry-year yields) and the gap (environmental effects not yet studied).","no":"Which evidence shows that something important is still unknown?"},"link":"That reasoning doesn’t connect your evidence to this claim. Which reasoning explains why the evidence leads there?","good":"✓ A sound argument: the claim rests on evidence, and the reasoning links them.","more":"There’s more than one sound argument here. Try another claim."}},"quickCheck":{"title":"Biotech and society quick check","summary":"Biotech and society quick check","items":[{"id":"q1","goal":5,"prompt":"Which body assesses a new modified crop before it’s grown in open fields?","choices":[{"t":"Assisted Human Reproduction Act","fb":"Health Canada covers food safety; field release is the CFIA’s job.","_n":"1gc87","_k":"39ed51b8"},{"t":"Health Canada","fb":"Health Canada covers food safety; field release is the CFIA’s job.","_n":"1hc77","_k":"2ebd08c4"},{"t":"Supreme Court","fb":"Health Canada covers food safety; field release is the CFIA’s job.","_n":"1ic67","_k":"ff001bb4"},{"t":"CFIA","fb":"Field release is the CFIA’s job.","_n":"1jc57","_k":"7aabc7c3"}]},{"id":"q2","goal":5,"prompt":"Which body assesses whether food from a modified crop is safe to eat?","choices":[{"t":"CFIA","fb":"Food and drug safety is Health Canada’s role.","_n":"1kc47","_k":"c14a8448"},{"t":"Environment Canada weather service","fb":"Food and drug safety is Health Canada’s role.","_n":"1lc37","_k":"05f26d2c"},{"t":"Health Canada","fb":"Food and drug safety is Health Canada’s role.","_n":"1mc27","_k":"f396d56f"},{"t":"Patent office","fb":"Food and drug safety is Health Canada’s role.","_n":"1n317","_k":"c5bc6e80"}]},{"id":"q3","goal":5,"prompt":"In the 2002 Harvard mouse case, the Supreme Court of Canada ruled that…","choices":[{"t":"modified foods must be labelled","fb":"The ruling was about patents on whole animals.","_n":"1o327","_k":"148f138e"},{"t":"modified mice can be patented","fb":"The ruling was about patents on whole animals.","_n":"1p2f7","_k":"3207bb7e"},{"t":"a higher life form, such as a whole mouse, can’t be patented","fb":"The ruling was about patents on whole animals.","_n":"1q307","_k":"8d048fa1"},{"t":"genes can’t be studied","fb":"The ruling was about patents on whole animals.","_n":"1r357","_k":"70281488"}]},{"id":"q4","goal":6,"prompt":"In a claim–evidence–reasoning argument, which of these is evidence?","choices":[{"t":"“Many people dislike modified crops”","fb":"The first is a measurement. The others are a claim, reasoning and an opinion.","_n":"1s367","_k":"90060fd6"},{"t":"“Dry-year yield: 3.6 t/ha vs 2.4 t/ha”","fb":"A measurement is evidence.","_n":"1t337","_k":"9d50cd37"},{"t":"“Because droughts are common, dry-year yield matters”","fb":"The first is a measurement. The others are a claim, reasoning and an opinion.","_n":"1u347","_k":"077b8a56"},{"t":"“The crop should be approved”","fb":"The first is a measurement. The others are a claim, reasoning and an opinion.","_n":"1v397","_k":"ce2a71f0"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Problem → tool","summary":"Problem → tool","goal":[1,3],"instruction":"Eight problems. Match each one to the tool that solves it.","leftTitle":"Problem","rightTitle":"Tool","left":[{"id":"l1","t":"Cut DNA at one specific sequence","goal":1},{"id":"l2","t":"Seal two DNA pieces into one molecule","goal":1},{"id":"l3","t":"Carry a gene into a bacterium, where it gets copied","goal":1},{"id":"l4","t":"Make millions of copies of one short DNA region","goal":1},{"id":"l5","t":"Sort DNA fragments by size","goal":1},{"id":"l6","t":"Read the exact order of bases","goal":1},{"id":"l7","t":"Change the DNA at one chosen site in a living cell","goal":1,"hints":["Which tool works on DNA already inside a living cell?","It uses a guide RNA to find its site.","CRISPR-Cas9."]},{"id":"l8","t":"Make a DNA copy of an mRNA, with no introns","goal":3,"hints":["Which tool starts from RNA?","It writes DNA using an RNA template, the reverse of transcription.","Reverse transcriptase."]}],"right":[{"id":"r1","t":"Restriction enzyme"},{"id":"r2","t":"DNA ligase"},{"id":"r3","t":"Plasmid vector"},{"id":"r4","t":"PCR"},{"id":"r5","t":"Gel electrophoresis"},{"id":"r6","t":"DNA sequencing"},{"id":"r7","t":"CRISPR-Cas9"},{"id":"r8","t":"Reverse transcriptase"}],"_a":"SUcIBhQDQBADR0gVWgtAWBAXVhUaGw5REF9GRQUbTkBeUUYNFEtWQB5HCAIUA0AQB0dIFVoPQFgQF1IVGhsOVRBfRkUBG05AXl1GDRRLWkBP","wrong":{"l1|r2":"A restriction enzyme cuts; ligase seals.","l2|r1":"A restriction enzyme cuts; ligase seals.","l3|r4":"Both lead to copies, but PCR copies a region in a tube; a plasmid is copied inside living cells.","l4|r3":"Both lead to copies, but PCR copies a region in a tube; a plasmid is copied inside living cells.","l5|r6":"A gel tells you sizes. A one-base change keeps the size the same, so only sequencing finds it.","l6|r5":"A gel tells you sizes. A one-base change keeps the size the same, so only sequencing finds it.","l7|r1":"Both cut, but CRISPR is guided by RNA to a chosen site inside a cell; a restriction enzyme cuts wherever its sequence appears.","l1|r7":"Both cut, but CRISPR is guided by RNA to a chosen site inside a cell; a restriction enzyme cuts wherever its sequence appears."},"wrongDefault":"Ask: does this tool cut, join, carry, copy, sort, read or edit?"},{"id":"lab","type":"mc","title":"Troubleshoot the lab","summary":"Troubleshoot the lab","goal":[1,2,3,4],"instruction":"Six lab problems. Choose the most likely cause or the best next step. Problems 4–6 are non-routine (★); 5 and 6 go beyond the Final Check.","items":[{"id":"s1","goal":2,"prompt":"After transformation, no colonies grow on the selection plate, though the plate worked in other tests. Most likely cause?","options":[{"t":"Too many cells took up the plasmid","why":"Then you’d see lots of colonies.","_n":"1w3a7","_k":"35b51ef1"},{"t":"The insulin gene was too short","why":"The gene’s length doesn’t decide which cells grow; the marker gene on the plasmid does.","_n":"1x377","_k":"c1d014e4"},{"t":"The marker gene stopped the cells growing","why":"The marker is what lets transformed cells grow. Only a small fraction of cells take up the plasmid. A marker gene lets only those cells grow on the selection plate.","_n":"1y367","_k":"78fe10b4"},{"t":"The cells didn’t take up the plasmid","why":"Only cells with the plasmid can grow on the selection plate. No colonies means no cell took it up.","_n":"1z397","_k":"c1d3428f"}]},{"id":"s2","goal":2,"prompt":"Colonies grow, but a gel shows every plasmid is its original size, with no insert. What happened?","options":[{"t":"The cut plasmid closed on itself without the gene","why":"A plasmid that closes on itself still carries the marker, so the cells grow, but there’s no insert.","_n":"20387","_k":"ea2b1e2d"},{"t":"The bacteria removed the gene’s introns","why":"Bacteria can’t remove introns, and that wouldn’t change the plasmid’s size.","_n":"21337","_k":"d813268c"},{"t":"The gene went in twice","why":"Then the plasmid would be larger.","_n":"22327","_k":"407c85fe"},{"t":"The gel ran backwards","why":"Then you wouldn’t see the plasmids at their expected size at all.","_n":"23357","_k":"0aea6024"}]},{"id":"s3","goal":2,"prompt":"\u003cstrong>Investigation:\u003c/strong> To show that the selection plate lets \u003cstrong>only\u003c/strong> transformed cells grow, which control plate should be added?","options":[{"t":"Transformed cells on a plain plate","why":"Useful to show the cells are alive, but it doesn’t test the plate.","_n":"24347","_k":"03c1f96a"},{"t":"An empty selection plate","why":"With no cells on it, it can’t show whether the plate stops untransformed cells.","_n":"253f7","_k":"07cd5a95"},{"t":"Untransformed cells on a selection plate (expect no growth)","why":"If untransformed cells can’t grow on it, the plate really does select for the plasmid.","_n":"263e7","_k":"2f976a86"},{"t":"Transformed cells on a selection plate","why":"That’s the test itself, not a control.","_n":"273d7","_k":"86028841"}]},{"id":"s4","goal":1,"star":true,"prompt":"An insulin cDNA clone gives a protein missing one amino acid. A gel shows the insert is the expected size. Which check finds the cause?","options":[{"t":"Run the gel longer","why":"A three-base deletion changes the size by only 3 base pairs: invisible on a gel. Sequencing reads every base.","_n":"283e7","_k":"1feb7a97"},{"t":"Cut with a different enzyme","why":"A three-base deletion changes the size by only 3 base pairs: invisible on a gel. Sequencing reads every base.","_n":"293f7","_k":"d2ee3c01"},{"t":"Sequence the insert","why":"Sequencing reads every base, so it finds a three-base deletion that a gel can’t show.","_n":"2a407","_k":"1ea95d4d"},{"t":"Copy the insert by PCR","why":"A three-base deletion changes the size by only 3 base pairs: invisible on a gel. Sequencing reads every base.","_n":"2b417","_k":"7a4672dc"}]},{"id":"s5","goal":2,"star":true,"prompt":"A circular plasmid is cut by an enzyme that has \u003cstrong>2\u003c/strong> sites in it. How many fragments form?","options":[{"t":"1","why":"One cut opens the ring into 1 piece; the second cut splits it again.","_n":"2c427","_k":"31d5a5aa"},{"t":"2","why":"In a ring, 2 cuts leave 2 arcs: 2 fragments.","_n":"2d437","_k":"b4878183"},{"t":"3","why":"3 is the answer for a straight (linear) piece of DNA. In a ring, each cut adds one end-pair, so 2 cuts make 2 pieces.","_n":"2e447","_k":"06ff97ea"},{"t":"4","why":"Count the arcs between the cuts: there are 2.","_n":"2f357","_k":"2706faf9"}],"hints":["Draw a circle and mark 2 cuts.","Count the arcs between cuts.","2 arcs: 2 fragments."]},{"id":"s6","goal":3,"star":true,"prompt":"A human protein only works if sugar groups are attached after translation, which bacteria can’t do. Which host is best?","options":[{"t":"No living host can make it","why":"Eukaryotic cells can add sugar groups after translation.","_n":"2g367","_k":"3a3221a7"},{"t":"\u003cem>E. coli\u003c/em>, since it grows fastest","why":"Fast growth doesn’t help if the protein can’t be finished.","_n":"2h438","_k":"2fd3b7a9"},{"t":"Cultured eukaryotic cells (yeast or mammalian)","why":"Eukaryotic cells can attach sugar groups to proteins after translation.","_n":"2i428","_k":"b8cc6956"},{"t":"Any bacterium, if it’s given cDNA","why":"cDNA solves the intron problem, not the sugar groups.","_n":"2j418","_k":"9dbbd171"}],"hints":["Which cells can add sugar groups to proteins?","Eukaryotic cells modify proteins after translation.","Yeast or mammalian cells in culture."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Raina","how":"","instruction":"Raina made one mistake in each piece of work. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Plan how to get bacteria to make human insulin.","steps":["Collect insulin mRNA from pancreas cells that make insulin.","Use DNA ligase to copy the mRNA into DNA.","Cut the DNA copy and a plasmid with the same restriction enzyme.","Seal them with DNA ligase.","Put the plasmid into bacteria and grow them on a selection plate."],"_a":"Aw==","stepFb":["Step 1 is correct: these cells have lots of insulin mRNA. Keep checking.","","Step 3 is a good step. The mistake is earlier.","Step 4 is correct.","Step 5 is correct."],"fixes":[{"t":"Use reverse transcriptase to make cDNA from the mRNA.","why":"Reverse transcriptase writes DNA from an RNA template, giving cDNA with the exons only.","_n":"2k408","_k":"ca1f68a6"},{"t":"Step 2 is correct.","why":"Ligase seals gaps; it can’t copy a template.","_n":"2l478","_k":"450f0689"},{"t":"Use DNA polymerase to turn the mRNA straight into protein.","why":"Polymerase makes nucleic acids, not protein.","_n":"2m468","_k":"f3ed3df9"},{"t":"Use a restriction enzyme to copy the mRNA.","why":"Restriction enzymes cut DNA.","_n":"2n458","_k":"898c76a1"}],"hints":["Which enzyme writes DNA using an RNA template?","The “reverse” of transcription.","Reverse transcriptase."]},{"id":"e2","goal":2,"task":"Explain how the recombinant plasmid forms.","steps":["The plasmid is cut with enzyme E, which leaves 5′-AATT overhangs.","The insulin cDNA is cut with enzyme H, which leaves 5′-AGCT overhangs.","The sticky ends pair by complementary base pairing.","Ligase seals the sugar–phosphate backbone."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is true in general, but it can’t happen with these ends. The mistake is earlier.","Step 4 is correct."],"fixes":[{"t":"Any sticky ends pair, so step 2 is fine.","why":"AATT and AGCT aren’t complementary.","_n":"2o448","_k":"b475a669"},{"t":"Use ligase in step 2 instead of enzyme H.","why":"Ligase doesn’t cut.","_n":"2p3b8","_k":"c4b2d3d9"},{"t":"Cut the cDNA with enzyme E too, so both pieces have 5′-AATT overhangs that pair.","why":"Sticky ends join only if their unpaired bases are complementary. Cut both pieces with the same enzyme.","_n":"2q3a8","_k":"ec9da9c8"},{"t":"Cut the plasmid with H and the cDNA with E.","why":"Swapping still leaves unmatched ends.","_n":"2r0e5","_k":"9f779ed2"}],"hints":["Do the two overhangs pair?","Line up AATT against AGCT: most bases don’t match.","Use the same enzyme on both."]},{"id":"e3","goal":6,"task":"Raina’s argument about a drought-tolerant wheat.","steps":["Claim: the variety should go to field trials in Saskatchewan.","Evidence: in greenhouse tests it kept 80% of its yield with half the water; standard wheat kept 50%.","Reasoning: so it will be safe for every ecosystem in Canada.","Conclusion: approve it with no further review."],"_a":"AA==","stepFb":["Step 1 is a reasonable claim. Keep checking.","Step 2 is relevant evidence.","","Step 4 follows from step 3, so fix step 3 first."],"fixes":[{"t":"Remove the evidence; the claim is enough.","why":"An argument needs evidence.","_n":"2s0d5","_k":"903d26ca"},{"t":"Step 3 is correct.","why":"Yield data can’t show ecosystem safety.","_n":"2t105","_k":"e4c05ca6"},{"t":"Reasoning: better yield with less water matters in dry years, but yield data say nothing about environmental effects, so field trials should test those next.","why":"The reasoning stays within what the evidence shows.","_n":"2u0f5","_k":"45b6fdf9"},{"t":"Reasoning: all modified crops are risky, so reject it.","why":"That ignores this crop’s data.","_n":"2v125","_k":"b414c252"}],"hints":["What do the greenhouse numbers actually measure?","Yield, not effects on other species.","Keep the reasoning within what the evidence shows."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the route builder: that the intron problem stayed hidden until the end, or something else?"},{"id":"j2","q":"In your own words, why must the plasmid and the gene be cut with the same enzyme?"},{"id":"j3","q":"Explain to a friend why bacteria need cDNA but a rice plant doesn’t."},{"id":"j4","q":"Pick a biotechnology product you’ve heard of. What evidence would you want before deciding whether it should be used, and what are you still unsure about?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which tool seals two DNA fragments together by joining their sugar–phosphate backbones?","options":[{"t":"DNA polymerase","why":"Polymerase builds a new strand from a template.","_n":"2w115","_k":"84d9b330"},{"t":"DNA ligase","why":"Ligase seals the backbone gaps between pieces.","_n":"2x145","_k":"1a85a359"},{"t":"A restriction enzyme","why":"Restriction enzymes cut DNA.","_n":"2y135","_k":"95b0a298"},{"t":"Helicase","why":"Helicase unzips the double helix.","_n":"2z065","_k":"4956ba49"}]},"b":{"prompt":"Which tool cuts DNA wherever one specific base sequence appears?","options":[{"t":"DNA ligase","why":"Ligase seals.","_n":"30055","_k":"8d6cde23"},{"t":"Reverse transcriptase","why":"It makes DNA from RNA.","_n":"31085","_k":"35d2cc77"},{"t":"A restriction enzyme","why":"Each restriction enzyme cuts at its own recognition sequence.","_n":"32095","_k":"4dbdf07e"},{"t":"Gel electrophoresis","why":"A gel sorts fragments; it doesn’t cut.","_n":"33065","_k":"ed92dd5b"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In genetic engineering, what is a vector?","options":[{"t":"A DNA molecule, such as a plasmid, that carries a gene into a host cell, where it is copied","why":"The vector is the carrier; the host is the cell that receives it.","_n":"34075","_k":"d64d89a6"},{"t":"The protein the new gene codes for","why":"That’s the product.","_n":"35045","_k":"d70603df"},{"t":"The enzyme that cuts the DNA","why":"That’s a restriction enzyme.","_n":"36055","_k":"0a1f91c9"},{"t":"The organism that receives the new gene","why":"That’s the host.","_n":"37025","_k":"bcf3dc1b"}]},"b":{"prompt":"In genetic engineering, what is transformation?","options":[{"t":"A mutation that changes a gene’s sequence","why":"Transformation adds DNA from outside.","_n":"38035","_k":"b2465df1"},{"t":"A cell dividing into two identical cells","why":"That’s cell division, not taking up DNA.","_n":"39105","_k":"70792dd4"},{"t":"Turning mRNA into protein","why":"That’s translation.","_n":"3a115","_k":"336f6ac1"},{"t":"A cell taking up foreign DNA, such as a recombinant plasmid","why":"Transformation adds DNA from outside the cell.","_n":"3b025","_k":"c119fc9d"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which is an example of \u003cstrong>gene\u003c/strong> cloning rather than reproductive cloning?","options":[{"t":"Growing a new plant from a cutting","why":"That copies a whole plant.","_n":"3c015","_k":"ddfc08ec"},{"t":"Identical twins forming from one embryo","why":"Natural clones of a whole organism.","_n":"3d005","_k":"9e62fee6"},{"t":"Bacteria copying a recombinant plasmid that carries the human insulin gene as they divide","why":"Many copies of one gene are made: that’s gene cloning.","_n":"3eff5","_k":"0bb89a4c"},{"t":"Producing a sheep genetically identical to an adult donor by nuclear transfer","why":"That copies a whole organism.","_n":"3f065","_k":"e599444a"}]},"b":{"prompt":"Which is an example of reproductive cloning?","options":[{"t":"Bacteria copying a plasmid as they divide","why":"That’s gene cloning.","_n":"3g055","_k":"0100e92c"},{"t":"Making a calf with the same nuclear DNA as an adult cow, by moving a body-cell nucleus into an egg cell whose nucleus was removed","why":"A whole organism is copied from a donor.","_n":"3h045","_k":"7cd63c31"},{"t":"Copying one gene many times by PCR","why":"That’s copying a gene.","_n":"3i035","_k":"bcf6da14"},{"t":"Inserting a GFP gene into bacteria","why":"That’s genetic modification, not copying an organism.","_n":"3j0a5","_k":"f69f7101"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A team inserts a human gene copied straight from chromosome DNA into a plasmid and transforms \u003cem>E. coli\u003c/em>. The bacteria make a protein, but it doesn’t work. What is the most likely reason?","options":[{"t":"Ligase changed the gene’s sequence when it sealed it","why":"Ligase only seals the backbone.","_n":"3k095","_k":"e642764c"},{"t":"The plasmid was never taken up","why":"Then there would be no human protein at all.","_n":"3l7c5","_k":"fcf4984c"},{"t":"The gene still has its introns; bacteria can’t remove them, so the protein has wrong amino acids or stops early","why":"Bacteria can’t remove introns. Give them cDNA, made from mature mRNA, which holds only the exons.","_n":"3m7d5","_k":"fbb7fd09"},{"t":"Bacteria use a different genetic code and misread every codon","why":"The code is nearly universal.","_n":"3n7e5","_k":"31db3c4c"}]},"b":{"prompt":"A team wants \u003cem>E. coli\u003c/em> to make a working human enzyme. Which starting material should they use for the gene?","options":[{"t":"cDNA made from the enzyme’s mature mRNA by reverse transcriptase","why":"Bacteria can’t remove introns. Give them cDNA, made from mature mRNA, which holds only the exons.","_n":"3o7f5","_k":"38128f2d"},{"t":"The pre-mRNA from the nucleus, copied into DNA before splicing","why":"Pre-mRNA still has its introns.","_n":"3p805","_k":"8c327a42"},{"t":"A version of the gene with bases changed so bacteria can read it","why":"Bacteria already read human codons.","_n":"3q815","_k":"1dcaa6aa"},{"t":"The gene cut straight from human chromosome DNA","why":"It still contains introns.","_n":"3r825","_k":"b36a1ea2"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"A plasmid is cut with enzyme P, which leaves 5′-AATT overhangs. A gene is cut with enzyme Q, which leaves 5′-AGCT overhangs. A student mixes them with DNA ligase. What is the most likely result?","options":[{"t":"The gene goes in, but backwards, because the ends differ","why":"Unmatched ends don’t pair either way round.","_n":"3s835","_k":"b85bf08a"},{"t":"Enzyme P trims Q’s overhangs until they match","why":"Each enzyme cuts only at its own sequence.","_n":"3t845","_k":"9971d052"},{"t":"Few or no recombinant plasmids: the overhangs aren’t complementary, so the pieces can’t pair before ligase seals them","why":"Sticky ends join only if their unpaired bases are complementary. Cut both pieces with the same enzyme.","_n":"3u855","_k":"15ea75cd"},{"t":"Recombinant plasmids form normally, because ligase joins any two ends","why":"Sticky ends join only if their unpaired bases are complementary. Cut both pieces with the same enzyme.","_n":"3v866","_k":"2f6095ef"}]},"b":{"prompt":"A plasmid is cut with enzyme R, which leaves 5′-GATC overhangs. Which gene preparation will join it?","options":[{"t":"A gene cut with an enzyme that also leaves 5′-GATC overhangs","why":"Sticky ends join only if their unpaired bases are complementary. Cut both pieces with the same enzyme.","_n":"3w856","_k":"fd996dc2"},{"t":"A gene cut with an enzyme that leaves 5′-AATT overhangs","why":"AATT doesn’t pair with GATC.","_n":"3x886","_k":"54b37faf"},{"t":"A gene with no overhangs, since blunt ends pair best","why":"Blunt ends have no bases to pair.","_n":"3y876","_k":"14d59c29"},{"t":"Any gene, since ligase makes the overhangs match","why":"Ligase doesn’t change bases.","_n":"3z826","_k":"45a93507"}]}},{"id":"t3","cat":"T","goal":1,"a":{"prompt":"Investigators recover a tiny amount of DNA at a crime scene and want to compare it with a suspect’s DNA. Which order of tools makes sense?","options":[{"t":"Transform bacteria with the crime-scene DNA, then compare their proteins","why":"That’s for making products, not for comparing people.","_n":"40816","_k":"3e357863"},{"t":"Gel electrophoresis first, then PCR on the bands","why":"With so little DNA, there’s nothing to see on a gel yet.","_n":"41846","_k":"be8721cf"},{"t":"Ligase to join the fragments into one strand, then sequencing","why":"Joining unrelated pieces destroys the information.","_n":"42836","_k":"4028b6f3"},{"t":"PCR to copy specific regions many times, then gel electrophoresis to compare fragment sizes","why":"PCR makes enough DNA to see; the gel then compares the sizes.","_n":"438e6","_k":"6f3b34f3"}]},"b":{"prompt":"A lab compares a child’s DNA with two possible parents at several regions that vary in length between people. Which pair of tools does it need?","options":[{"t":"Restriction enzymes, then ligase","why":"That’s for building recombinant DNA.","_n":"448d6","_k":"aa6c5496"},{"t":"Reverse transcriptase, then PCR","why":"No mRNA is needed to compare DNA.","_n":"45806","_k":"b147cbbf"},{"t":"CRISPR-Cas9, then sequencing","why":"Editing isn’t comparing.","_n":"46816","_k":"c2d18755"},{"t":"PCR to copy those regions, then gel electrophoresis to compare their lengths","why":"PCR copies the regions; the gel compares their lengths.","_n":"477e6","_k":"732efa06"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why insulin-making bacteria are given a cDNA copy of the human insulin gene?","options":[{"t":"“Bacteria use different codons, and cDNA translates the code for them.”","why":"The genetic code is nearly universal: bacteria read human codons correctly. The problem is introns, not the code.","_n":"487f6","_k":"6bd8e6d1"},{"t":"“cDNA is smaller, so it fits into the plasmid more easily.”","why":"Size isn’t the reason; the introns are.","_n":"49846","_k":"b5d005f7"},{"t":"“Bacteria can’t remove introns. cDNA is made from mature mRNA, so it contains only the exons, and the bacteria can translate it into the correct amino acid sequence.”","why":"It names the problem (introns), where cDNA comes from, and why that fixes it.","_n":"4a856","_k":"e5446b25"},{"t":"“cDNA can’t be switched off, so the bacteria always make insulin.”","why":"Control isn’t the point; the introns are.","_n":"4b826","_k":"b989e036"}]},"b":{"prompt":"Which is the best explanation of why the same restriction enzyme is used to cut both the plasmid and the gene?","options":[{"t":"“It’s cheaper, and ligase can join any ends anyway.”","why":"Sticky ends join only if their unpaired bases are complementary. Cut both pieces with the same enzyme.","_n":"4c836","_k":"f1f1109e"},{"t":"“The same enzyme glues the pieces together after cutting them.”","why":"A restriction enzyme cuts, ligase seals, PCR copies, a gel sorts by size, sequencing reads, CRISPR edits.","_n":"4d886","_k":"c10f5bf2"},{"t":"“Different enzymes would destroy the gene.”","why":"Different enzymes cut fine; their ends just don’t match.","_n":"4e896","_k":"14b1b67a"},{"t":"“It leaves matching sticky ends on both, so their unpaired bases can pair; ligase then seals the backbone, making one recombinant molecule.”","why":"It links the matching ends, the pairing, and ligase’s sealing.","_n":"4f9a6","_k":"79aa77e1"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"A town debates planting a drought-tolerant wheat variety (a fictional case). Which response best uses evidence and reasoning?","options":[{"t":"“Scientists made it, so it must be safe to plant everywhere.”","why":"Ask what this product does, what the data show, and what the risks are. One case doesn’t decide another.","_n":"4g996","_k":"eebb2d57"},{"t":"“All genetically modified crops are unsafe, so it should be banned.”","why":"Ask what this product does, what the data show, and what the risks are. One case doesn’t decide another.","_n":"4h986","_k":"f2d34551"},{"t":"“In three dry seasons of trials, the variety out-yielded standard wheat, and it passed a food-safety assessment. Because drought is a main risk to Prairie farms, the evidence supports planting it, while its environmental effects continue to be monitored.”","why":"It gives data, links them to the claim, and names what still needs watching.","_n":"4i976","_k":"e0804958"},{"t":"“It’s drought tolerant, so it’s better.”","why":"A claim with no data and no reasoning.","_n":"4j966","_k":"0abdc269"}]},"b":{"prompt":"A class debates a rice variety engineered to make beta-carotene (a vitamin A precursor) in its grain. Which response best uses evidence and reasoning?","options":[{"t":"“Studies in the case file show the body converts the grain’s beta-carotene to vitamin A. Where many children lack vitamin A, adding it to a staple food could reduce the deficiency, so the rice is worth growing alongside other programs such as supplements.”","why":"It gives evidence, reasons from it, and keeps the claim within what the evidence supports.","_n":"4k956","_k":"cab64b84"},{"t":"“Yellow rice looks unnatural, so people should refuse it.”","why":"Looks aren’t evidence.","_n":"4l946","_k":"27ca3ec9"},{"t":"“It adds a vitamin, so no other programs are needed.”","why":"The evidence supports helping, not replacing every other program.","_n":"4m936","_k":"8f62cdd3"},{"t":"“Every modified food is unsafe.”","why":"Ask what this product does, what the data show, and what the risks are. One case doesn’t decide another.","_n":"4n926","_k":"02a06ba1"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A company wants to sell a new canola variety with a genetically engineered trait in Canada, both as a crop to grow and as cooking oil. Which bodies assess it?","options":[{"t":"The CFIA (growing it in fields and using it as livestock feed) and Health Canada (food safety)","why":"In Canada, Health Canada assesses food and drug safety, the CFIA assesses crops released into the environment, and the Assisted Human Reproduction Act sets limits on human embryos.","_n":"4o916","_k":"d3967df4"},{"t":"No review is needed, because canola was first bred in Canada","why":"Each new trait is assessed.","_n":"4p146","_k":"f945a8cd"},{"t":"Health Canada alone, because the oil is a food","why":"Growing it in open fields is assessed by the CFIA.","_n":"4q156","_k":"369bcc59"},{"t":"The CFIA alone, because canola is a plant","why":"Food safety is Health Canada’s job.","_n":"4r166","_k":"fcf43109"}]},"b":{"prompt":"A clinic proposes to change the DNA of human embryos so that the change would pass to future generations. What does Canadian law say?","options":[{"t":"It’s allowed if Health Canada approves it as a drug","why":"In Canada, Health Canada assesses food and drug safety, the CFIA assesses crops released into the environment, and the Assisted Human Reproduction Act sets limits on human embryos.","_n":"4s176","_k":"0a3a70b5"},{"t":"The Assisted Human Reproduction Act prohibits changing a human cell or embryo’s genome in a way that can be passed on to descendants","why":"The Act sets limits on human cloning and heritable changes.","_n":"4t106","_k":"b9b146da"},{"t":"No Canadian law covers it","why":"In Canada, Health Canada assesses food and drug safety, the CFIA assesses crops released into the environment, and the Assisted Human Reproduction Act sets limits on human embryos.","_n":"4u116","_k":"7ccea371"},{"t":"The CFIA regulates it, because it’s a modified organism","why":"The CFIA covers crops and feed, not human embryos.","_n":"4v126","_k":"55204cc1"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Researchers join the gene for green fluorescent protein (GFP) to a gene they’re studying, so cells glow wherever that gene is being expressed. What is GFP being used as?","options":[{"t":"A reporter that makes the gene’s activity visible","why":"The glow reports where and when the gene is on.","_n":"4w136","_k":"e6358ee2"},{"t":"A vector that carries the gene into cells","why":"A restriction enzyme cuts, ligase seals, PCR copies, a gel sorts by size, sequencing reads, CRISPR edits.","_n":"4x0c6","_k":"e3c2d991"},{"t":"A clone of the jellyfish the gene came from","why":"Gene cloning copies a gene; reproductive cloning copies a whole organism; selective breeding chooses parents; genetic modification inserts or changes DNA.","_n":"4y0d6","_k":"74ff2c0f"},{"t":"A restriction enzyme that marks where to cut","why":"A restriction enzyme cuts, ligase seals, PCR copies, a gel sorts by size, sequencing reads, CRISPR edits.","_n":"4z7e7","_k":"5b0dbe33"}]},"b":{"prompt":"A plant breeder inserts a gene for a protein that helps cells survive ice crystals during frost. How is this best described?","options":[{"t":"Selective breeding","why":"Selective breeding chooses parents; it doesn’t insert a gene.","_n":"507d7","_k":"4a22f883"},{"t":"Genetic modification in agriculture: a new trait from inserted DNA","why":"Inserting a gene to give a crop a new trait is genetic modification.","_n":"51807","_k":"ce173cac"},{"t":"Gene therapy","why":"Gene therapy treats a person’s cells; this changes a crop.","_n":"527f7","_k":"be0c49ff"},{"t":"Reproductive cloning of the plant","why":"Gene cloning copies a gene; reproductive cloning copies a whole organism; selective breeding chooses parents; genetic modification inserts or changes DNA.","_n":"53827","_k":"8f9fa6af"}]}}]},"task":{"title":"Pick your production line","summary":"Pick your production line","statement":"\u003cp>Plan a production line that makes working human insulin, and lets you confirm the inserted gene before you scale up. Can you find all the answers?\u003c/p>\u003col class=\"bt-conds\">\u003cli>The host can be grown in a fermentation tank.\u003c/li>\u003cli>The gene has no introns to remove.\u003c/li>\u003cli>The gene and vector ends will join.\u003c/li>\u003cli>Transformed cells can be picked out.\u003c/li>\u003cli>The insert is checked before scale-up.\u003c/li>\u003c/ol>","inputs":{"host":"Host","gene":"Gene source","cut":"Cutting plan","vec":"Vector","chk":"Check"},"checks":["Grows in a tank","No introns","Ends will join","Transformed cells can be picked out","Insert checked"],"tips":["A rice plant grows in a field, not a tank.","Bacteria can’t remove introns, and yeast cells don’t reliably remove human introns. Start from mRNA.","Sticky ends pair only if they match: use the same enzyme on both.","Only a few cells take up the plasmid. A marker gene lets only those grow on the selection plate.","Check the insert first, by its size (gel) or its exact bases (sequencing)."],"success":"Your production line works!","explainPrompt":"Explain why every answer must use cDNA and the same enzyme, and what your choice of check can and can’t tell you.","vocab":"Use the words cDNA, intron, sticky ends, marker gene and transformation.","after3":"Both bacteria and yeast are used to make insulin commercially. Sequencing is the stronger check, because a one-base change keeps the insert the same size on a gel.","afterAt":4},"cards":[["Biotechnology","Using living things or their molecules to make products or solve problems."],["Recombinant DNA","DNA that combines pieces from two sources, e.g. a human gene in a bacterial plasmid."],["Restriction enzyme","Cuts DNA at one specific sequence, often leaving sticky ends."],["DNA ligase","Seals DNA pieces by joining their sugar–phosphate backbones."],["Vector","DNA (often a plasmid) that carries a gene into a host cell, where it’s copied."],["Transformation","A cell taking up foreign DNA."],["Marker gene","A gene on the plasmid that lets only transformed cells grow on the selection plate."],["cDNA","DNA copied from mature mRNA by reverse transcriptase: exons only, so bacteria can use it."],["Gene cloning vs reproductive cloning","Copying a gene vs making a whole organism genetically identical to a donor."],["Reporter gene","A gene such as GFP that makes another gene’s activity visible."],["Who checks it in Canada?","Health Canada: food and drug safety. CFIA: crops in fields and livestock feed. AHRA: limits on human cloning and heritable changes."],["Judging a biotech case","Claim + evidence + reasoning, case by case: what does it do, what do the data show, what are the risks?"]]}};</script>
