.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 34: feedback loop builder (S8), hero, Two systems (race, hypothalamus–pituitary explorer), task.
   Roles (plan build notes): blood pressure / CO₂ / contraction line --pen; normal band --hi-soft (never green); set point --ink-2
   dashed; ADH cerulean (--p-t); oxytocin, epinephrine and other hormones in --ink with a label; icons are line art in --ink. */

/* hero */
.hero .hero-eq .ho-heq{display:inline-flex;flex-direction:column;gap:.35em;align-items:flex-start;font-size:.5em;line-height:1.25}
.ho-hrow{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.25em}
.ho-ha{margin:0 .1em}
.ho-hret{font-size:.75em;font-weight:700;color:var(--ink-2)}
.ho-hsign{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;border:2px solid var(--ink);color:var(--ink)}
.ho-hero{max-width:460px;margin:0 auto}
.ho-hsvg{display:block;width:100%;height:auto}
.ho-hb{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.ho-hb.on{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2.2}
.ho-hb.pulse{stroke-width:3.4}
.ho-hbt{font:700 12px var(--font-ui);fill:var(--ink)}
.ho-hbs{font:600 10.5px var(--font-ui);fill:var(--ink-2)}
.ho-har{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ho-hsg{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.ho-hsgt{font:700 15px var(--font-ui);fill:var(--ink)}
.ho-hband{fill:var(--hi-soft)}
.ho-hset{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:6 5}
.ho-hax{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.ho-hline{fill:none;stroke:var(--pen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ho-hdot{fill:var(--pen)}
.ho-hfig{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ho-hok{font:700 13px var(--font-ui);fill:var(--ink)}
.ho-pst{display:block;font-size:.88em;font-weight:700;color:var(--ink-2);margin-bottom:.2em}

/* radio groups (from SBI4U 20 / 14 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* switches */
.ho-sw{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .8em .3em .4em;font-size:.88rem;min-height:40px}
.ho-swt{position:relative;width:34px;height:20px;border-radius:10px;background:var(--rule);flex:none}
.ho-swt::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--sheet);transition:left .15s}
.ho-sw[aria-checked="true"] .ho-swt{background:var(--ink)}
.ho-sw[aria-checked="true"] .ho-swt::after{left:17px}
.ho-swv{font-weight:700;color:var(--ink-2);font-size:.8rem}
.ho-sw:disabled{opacity:.55}

/* explore: builder */
.ho-ex [hidden],.ho-p3 [hidden]{display:none!important}
.ho-top{margin-bottom:12px}
.ho-build{display:grid;gap:10px;margin-bottom:16px}
.ho-how{margin:0}
.ho-tray{display:flex;flex-wrap:wrap;gap:8px}
.ho-card{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.4em .7em;font-size:.88rem;min-height:44px;text-align:left;max-width:240px}
.ho-card[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ho-trayd{margin:0;font-size:.88rem;color:var(--ink-2)}
.ho-loop{border:1.5px solid var(--rule);border-radius:10px;padding:12px;background:var(--sheet)}
.ho-row{display:flex;align-items:stretch;gap:0}
.ho-slot{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:10px;transition:background-color .2s}
.ho-slot.lit{background:var(--hi-soft)}
.ho-slot.off{opacity:.5}
.ho-sn{font-size:.78rem;font-weight:700;letter-spacing:.02em;color:var(--ink-2);text-transform:uppercase}
.ho-drop{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:72px;border:2px dashed var(--ink-2);border-radius:10px;background:var(--sheet);color:var(--ink);padding:6px;font-size:.84rem;line-height:1.25}
.ho-drop.ready{border-color:var(--ink);border-style:solid}
.ho-drop.is-fixed{border-style:solid;border-color:var(--ink-2)}
.ho-ct{font-weight:600}
.ho-empty{color:var(--ink-2);font-style:italic}
.ho-off{font-size:.75rem;font-weight:700;color:var(--red);text-align:center}
.ho-arr{flex:0 0 16px;align-self:center;height:2px;background:var(--ink);position:relative;margin-top:18px}
.ho-arr::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:7px solid var(--ink);border-right:0}
.ho-ret{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-top:10px;padding-top:10px;border-top:2px solid var(--ink)}
.ho-retl{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.ho-reta{width:18px;height:14px;border:2px solid var(--ink);border-top:0;border-radius:0 0 8px 8px}
.ho-msg .fb{margin:0}
@media (min-width:821px){ .pg.ho-pg{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} }
.ho-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.ho-ph{margin:0}
.ho-lock{margin:0;font-size:.9rem;color:var(--ink-2)}
#ho-bpc{display:grid;gap:10px;justify-items:start}
.ho-brk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ho-player{display:flex;flex-wrap:wrap;gap:8px}
.ho-time{margin:0;font-size:.9rem;font-weight:700}
.ho-warn{margin:0 0 8px;padding:.5em .8em;border-radius:8px;background:var(--bad-bg);color:var(--ink);font-weight:700}
.ho-note{margin:8px 0 0}
.ho-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.ho-heart{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.9rem}
.ho-heart svg{width:34px;height:30px;flex:none}
.ho-heart path{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.ho-h-rest svg{animation:ho-beat .9s ease-in-out infinite}
.ho-h-fast svg{animation:ho-beat .42s ease-in-out infinite}
.ho-h-slow svg{animation:ho-beat 1.4s ease-in-out infinite}
@keyframes ho-beat{0%,100%{transform:scale(1)}20%{transform:scale(1.16)}}
@media (prefers-reduced-motion:reduce){ .ho-heart svg{animation:none!important} .ho-slot,.ho-swt::after{transition:none} }

/* phone: slots stack, arrows point down, tray scrolls sideways */
@media (max-width:600px){
  .ho-row{flex-direction:column}
  .ho-arr{flex:0 0 14px;width:2px;height:14px;align-self:center;margin:0}
  .ho-arr::after{right:-5px;top:auto;bottom:-2px;border:6px solid transparent;border-top:7px solid var(--ink);border-bottom:0}
  .ho-drop{min-height:52px}
  .ho-tray{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
  .ho-card{flex:0 0 auto;max-width:200px}
}

/* Part 3 */
.ho-sta h3{margin-top:0}
.ho-fig{border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.ho-fig svg{display:block;width:100%;height:auto}
.ho-two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){ .ho-two{grid-template-columns:minmax(0,1fr)} }
.ho-lab,.ho-sm{font:600 11.5px var(--font-ui);fill:var(--ink-2)}
.ho-clock{font:700 14px var(--font-ui);fill:var(--ink)}
.ho-ln{font:700 12.5px var(--font-ui);fill:var(--ink)}
.ho-neuron{stroke:var(--ink-2);stroke-width:3;fill:none}
.ho-node{fill:var(--ink-2)}
.ho-imp{fill:var(--pen)}
.ho-vessel{stroke:var(--ink-2);stroke-width:1.6;fill:none}
.ho-hor{fill:var(--ink)}
.ho-goal{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.ho-goal.on{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2.2}
.ho-gt{font:700 11px var(--font-ui);fill:var(--ink)}
.ho-st{font:700 12.5px var(--font-ui);fill:var(--ink)}
.ho-reg{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.ho-lobe{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.ho-reg.on,.ho-lobe.on{fill:var(--hi-soft);stroke:var(--ink);stroke-width:3}
.ho-stalk{stroke:var(--ink-2);stroke-width:2;fill:none}
.ho-nc{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.ho-nc.on{fill:var(--hi-soft);stroke-width:3}
.ho-axon{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ho-axon.on{stroke-width:4}
.ho-term{fill:var(--ink)}
.ho-portal{fill:none;stroke:var(--red);stroke-width:2.4;stroke-dasharray:6 3;stroke-linejoin:round}
.ho-portal.on,.ho-cap1.on{stroke-width:4}
.ho-cap1{fill:none;stroke:var(--red);stroke-width:2}
.ho-blood{fill:none;stroke:var(--red);stroke-width:3}
.ho-blood.thin{stroke-width:2}
.ho-blood.on{stroke-width:5}
.ho-adh{fill:var(--p-t);stroke:var(--sheet);stroke-width:1.5}
.ho-adht{font:700 12px var(--font-ui);fill:var(--p-t)}
.ho-rh{fill:var(--ink);stroke:var(--sheet);stroke-width:1.5}
.ho-rht{font:700 12px var(--font-ui);fill:var(--ink)}
.ho-steps{margin:8px 0 12px;padding-left:1.3em;font-size:.92rem}
.ho-steps li{color:var(--ink-2)}
.ho-steps li.on{color:var(--ink)}
.ho-parts{display:flex;flex-wrap:wrap;gap:6px}
.ho-infob{margin-top:10px}
.ho-infob h4{margin:0 0 4px}
.ho-ask{margin-top:14px}
.ho-rowbtns{display:grid;gap:6px}

/* practice */
.ho-round + .ho-round{margin-top:18px;padding-top:12px;border-top:1.5px solid var(--rule)}
.ho-round h4{margin:0 0 6px}

/* task */

etabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"c785070c","content":{"id":"34-homeostasis","kind":"topic","title":"Homeostasis","topic":"Homeostasis","readyTopic":"homeostasis","hero":{"eq":"\u003cspan class=\"ho-heq\">\u003cspan class=\"ho-hrow\">Stimulus \u003cspan class=\"ho-ha\" aria-hidden=\"true\">→\u003c/span> Receptor \u003cspan class=\"ho-ha\" aria-hidden=\"true\">→\u003c/span> Control centre \u003cspan class=\"ho-ha\" aria-hidden=\"true\">→\u003c/span> Effector \u003cspan class=\"ho-ha\" aria-hidden=\"true\">→\u003c/span> Response\u003c/span>\u003cspan class=\"ho-hret\">\u003cspan aria-hidden=\"true\">↺\u003c/span> \u003cspan class=\"ho-hsign\">−\u003c/span> opposes the change\u003c/span>\u003c/span>","eqLabel":"A loop: stimulus, then receptor, then control centre, then effector, then response. A return arrow from the response back to the stimulus is marked minus: it opposes the change.","eqSize":"sm","headline":"Stable doesn’t mean still","text":"Your blood pressure dips every time you stand up, and your blood CO₂ climbs every time you run for a bus. \u003cstrong>Homeostasis\u003c/strong> is the set of \u003cstrong>feedback loops\u003c/strong> that notice these changes and pull each variable back into its \u003cstrong>normal range\u003c/strong> around a \u003cstrong>set point\u003c/strong>. In this module you’ll build those loops, break them, and see why most of them run on \u003cstrong>negative feedback\u003c/strong>.","fig":{"html":"\u003cdiv class=\"ho-hero\" id=\"ho-hero\" role=\"img\" aria-label=\"A blood-pressure graph with a shaded normal band from 80 to 100 mmHg. A person stands up and the line dips to 70. Five loop boxes light in order: stimulus, receptor (baroreceptors), control centre (medulla), effector (heart) and response. The line climbs back into the band and settles: back in range in about 2 seconds.\">\u003c/div>"}},"goals":["I can explain homeostasis as keeping a variable within a normal range around a set point.","I can identify the stimulus, receptor, control centre, effector and response in a feedback loop.","I can tell negative feedback from positive feedback and give an example of each.","I can predict what happens when part of a loop fails, or when a loop is slow or too strong.","I can compare nervous and endocrine control and describe how the hypothalamus and pituitary link them.","I can build a flow-chart model of a homeostatic mechanism and use it to explain data."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Body systems","goal":1,"prompt":"A healthy person’s body temperature is measured every hour for a day. Which result is most likely?","options":[{"t":"It reads exactly 37.0 °C every hour.","why":"No real variable is held perfectly constant.","_n":"00b6","_k":"971e7ea4"},{"t":"It varies a little, staying between about 36.5 °C and 37.5 °C","why":"Regulated variables wobble within a narrow range.","_n":"10c6","_k":"bf5c4b8f"},{"t":"It rises steadily all day.","why":"A steady rise would be a fever or illness, not normal regulation.","_n":"20d6","_k":"75df9e78"},{"t":"It follows the outdoor temperature.","why":"Humans regulate core temperature.","_n":"3066","_k":"ff26321f"}],"hints":["Is anything in the body perfectly constant?","Think of a normal range.","Small changes within a range: it varies a little, between about 36.5 °C and 37.5 °C."]},{"id":"w2","skill":"Body systems","goal":5,"prompt":"Which system carries signals in the blood?","options":[{"t":"The skeletal system","why":"Bones support and protect; they don’t signal.","_n":"4076","_k":"2d352b11"},{"t":"The digestive system","why":"It absorbs nutrients; it doesn’t carry signals.","_n":"5086","_k":"59855327"},{"t":"The nervous system","why":"Nerves carry electrical impulses along neurons, not through the blood.","_n":"6096","_k":"6d46dd7d"},{"t":"The endocrine system","why":"Glands release hormones into the blood.","_n":"7126","_k":"e7bb2fa3"}],"hints":["What do glands make?","Hormones travel in the blood.","Endocrine."]},{"id":"w3","skill":"Stimulus and response","goal":2,"prompt":"You touch a hot pan and pull your hand away. Which part \u003cstrong>detected\u003c/strong> the heat?","options":[{"t":"The heat itself","why":"Heat is the stimulus, the change being detected.","_n":"8136","_k":"a3669d2e"},{"t":"Receptors in the skin","why":"Sensory receptors detect the stimulus.","_n":"91a7","_k":"3d9741dd"},{"t":"Pulling the hand away","why":"That’s the response.","_n":"a197","_k":"7fd1240a"},{"t":"The arm muscles","why":"Muscles carry out the response; they’re effectors.","_n":"b187","_k":"d36a18e4"}],"hints":["Detecting ≠ acting.","Which cells sense temperature?","Skin receptors."]},{"id":"w4","skill":"Stimulus and response","goal":2,"prompt":"In the same reflex, which part is the \u003cstrong>effector\u003c/strong>?","options":[{"t":"The skin receptors","why":"They detect; they don’t act.","_n":"c177","_k":"b10eb3ca"},{"t":"The spinal cord","why":"It’s the control centre here: it connects sensory and motor neurons.","_n":"d167","_k":"9a360538"},{"t":"The arm muscles that contract","why":"Effectors are muscles or glands that act.","_n":"e157","_k":"87a69eed"},{"t":"The pain you feel","why":"That’s a sensation, not a part of the loop.","_n":"f147","_k":"6e01bf34"}],"hints":["Effectors carry out the response.","What moves the hand?","Muscles."]},{"id":"w5","skill":"Reading a time graph","goal":6,"prompt":"A graph shows heart rate (beats per minute) against time. At 2 min the line jumps from 70 to 110, then slowly falls back to 72 by 8 min. What happened at 2 min?","options":[{"t":"The heart rate fell at 2 min.","why":"It went from 70 up to 110.","_n":"g137","_k":"727a536a"},{"t":"A disturbance raised the heart rate, and it then recovered","why":"The jump is the disturbance; the slow fall is the recovery.","_n":"h127","_k":"e9f26853"},{"t":"The heart rate was steady the whole time.","why":"The line jumps by 40.","_n":"i117","_k":"06ab7a2a"},{"t":"The person’s set point changed permanently to 110.","why":"It returned to about 72.","_n":"j008","_k":"dcbaa026"}],"hints":["Read the values before and after 2 min.","It goes up, then comes back.","A disturbance, then recovery."]},{"id":"w6","skill":"Reading a time graph","goal":6,"prompt":"On the same graph, about how long did recovery take?","options":[{"t":"About 6 minutes","why":"From 2 min to 8 min.","_n":"k018","_k":"fc48aee1"},{"t":"About 2 minutes","why":"That’s when the jump happened.","_n":"lfe8","_k":"10cac9df"},{"t":"About 40 minutes","why":"40 is the rise in beats per minute, not a time.","_n":"mff8","_k":"489b1a79"},{"t":"About 8 minutes","why":"Recovery starts at 2 min, not 0.","_n":"n048","_k":"0adf3866"}],"hints":["When did it start falling, and when did it level off?","8 − 2.","6 minutes."]}],"refreshers":{"Body systems":"The nervous system sends fast electrical signals along neurons; the endocrine system sends hormones through the blood. Body variables stay within a normal range; they aren’t fixed at one value.","Stimulus and response":"A stimulus is a change. Receptors detect it, a control centre (often in the brain or spinal cord) decides, and effectors (muscles or glands) respond. Example: hot pan → skin receptors → spinal cord → arm muscles → hand pulls away.","Reading a time graph":"Read the axes first. A sudden jump marks a disturbance; the time to return is the later time minus the time of the jump."}}},"explore":{"heading":"Feedback loop builder","intro":"Build a loop, then put it to work. Stand the model person up, watch the blood pressure, and then change how strong and how slow the loop is.","chalIntro":"Use the loop builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","buildHow":"Tap a card, then tap a slot. Tap a filled slot to send its card back. Then set the return arrow.","modelNote":"Teaching model, not clinical data. One step = 1 s. Set point 90 mmHg, normal range 80–100 mmHg. Each second the loop corrects by a quarter (Weak), a half (Medium) or all (Strong) of the gap it senses, using a reading 0, 1 or 2 s old.","birthNote":"Teaching model: contraction strength starts at 2 units and is multiplied by 1.5 with each contraction. Oxytocin is shown as a relative level.","slots":[{"id":"stim","t":"Stimulus"},{"id":"rec","t":"Receptor"},{"id":"cc","t":"Control centre"},{"id":"eff","t":"Effector"},{"id":"resp","t":"Response"}],"cards":[{"id":"c1","t":"Fall in blood pressure","_a":"QURMXF0V"},{"id":"c2","t":"Baroreceptors in the aorta and carotid arteries","_a":"QUVdVhI="},{"id":"c3","t":"Cardiovascular centre in the medulla","_a":"QVRbFw=="},{"id":"c4","t":"Heart and arteriole muscles","_a":"QVJeUxI="},{"id":"c5","t":"Faster heart rate; arterioles narrow","_a":"QUVdRkAV"},{"id":"d1","t":"Thermoreceptors in the skin","_a":"QVlXW1UV"},{"id":"d2","t":"Sweat glands","_a":"QVlXW1UV"},{"id":"d3","t":"Pancreas","_a":"QVlXW1UV"},{"id":"d4","t":"Slower breathing","_a":"QVlXW1UV"}],"birthCards":["Baby’s head stretches the cervix","Stretch receptors in the cervix","Hypothalamus","Posterior pituitary releases oxytocin; uterine muscle","Stronger contractions"],"cardFb":{"d1|rec":"They sense temperature, not pressure.","c4|rec":"They act; they don’t detect. That’s the effector’s job.","d3|cc":"The pancreas controls blood glucose. Blood pressure is managed by the cardiovascular centre in the medulla."},"signFb":"A + arrow would push pressure further down. Try running it to see.","predictions":[{"id":"p1","prompt":"\u003cspan class=\"ho-pst\">Start: the correct loop, Medium / 0 s, “Receptor damaged” on.\u003c/span> The person stands up. What happens to blood pressure?","options":[{"t":"It stays at 70 mmHg","_n":"o058","_k":"d943cea1"},{"t":"It rises above 100","_n":"p028","_k":"9abba62e"},{"t":"It keeps falling below 70","_n":"q038","_k":"8f49db96"},{"t":"It returns to 90 within a second","_n":"r088","_k":"e528a396"}],"explain":"With no receptor, the control centre is never told the pressure fell, so nothing corrects it. (This is one reason some people feel faint when they stand up.)","reveal":"The line stays flat at 70 mmHg; the receptor box is greyed out.","start":{"str":"medium","del":0,"sign":"-","brkR":true,"brkE":false}},{"id":"p2","prompt":"\u003cspan class=\"ho-pst\">Start: Medium / 0 s, with the return arrow switched to +.\u003c/span> What happens now?","options":[{"t":"Pressure swings around 90","_n":"s098","_k":"21d7fdee"},{"t":"Pressure returns to 90 faster","_n":"t868","_k":"051644e6"},{"t":"Nothing changes","_n":"u858","_k":"8c1e48ec"},{"t":"Pressure keeps falling","_n":"v888","_k":"198da1fd"}],"explain":"A + arrow amplifies the change. The farther pressure is from 90, the more it is pushed down. Positive feedback can’t hold a variable steady.","reveal":"70, 60, 45, 22.5 mmHg: the display stops at 40.","start":{"str":"medium","del":0,"sign":"+","brkR":false,"brkE":false}},{"id":"p3","prompt":"\u003cspan class=\"ho-pst\">Start: Strong / 1 s.\u003c/span> A strong response sounds good. What will the pressure do?","options":[{"t":"Swing between 70 and 110 without settling","_n":"w878","_k":"632c765f"},{"t":"Stay at 70","_n":"x828","_k":"861a1c5e"},{"t":"Return slowly without passing 90","_n":"y818","_k":"8ad40384"},{"t":"Return to 90 in 1 s and stay","_n":"z848","_k":"181b716a"}],"explain":"The control centre is acting on old information. By the time it sees the pressure is back, it has already over-corrected.","reveal":"70, 70, 90, 110, 110, 90, 70, 70, … mmHg: it never settles.","start":{"str":"strong","del":1,"sign":"-","brkR":false,"brkE":false}},{"id":"p4","prompt":"\u003cspan class=\"ho-pst\">Start: Childbirth, contraction 0.\u003c/span> Each contraction makes the next one stronger. What stops this loop?","options":[{"t":"Negative feedback slowly takes over","_n":"10838","_k":"9499170c"},{"t":"Each contraction gets weaker","_n":"118e8","_k":"cb4680a3"},{"t":"Delivery removes the stretch stimulus","_n":"128d8","_k":"ebcce696"},{"t":"Oxytocin runs out","_n":"137c7","_k":"d16357a3"}],"explain":"Positive feedback drives an event to completion. It ends when an outside event removes the stimulus.","reveal":"Strength climbed 2, 3, 4.5, … 22.8; “Delivery” appeared, the stimulus box went dark and oxytocin dropped to 0.","start":{"scn":"birth"}}],"challenges":[{"id":"tc1","goal":[2,4],"prompt":"Build the blood-pressure loop: every card in the right slot, and the right sign.","why":"Fall in pressure → baroreceptors → cardiovascular centre → heart and arterioles → faster heart, narrower arterioles, with a − arrow: the response opposes the fall.","general":"Some cards aren’t in the right slots yet. Check the “Loop parts placed” readout.","named":{"scn":"Switch the scenario to \u003cstrong>Blood pressure\u003c/strong> first.","empty":"Fill all five slots first.","swap":"Baroreceptors detect; heart and arteriole muscles act.","plus":"Run it: a + loop makes the drop worse.","pancreas":"Many loops run through the hypothalamus or medulla, but the pancreas, for example, senses and controls blood glucose itself."},"hints":["Start with what changed: the stimulus.","Which card can \u003cem>sense\u003c/em> pressure?","Fall in pressure → baroreceptors → cardiovascular centre → heart and arterioles → faster heart, narrower arterioles; sign −."]},{"id":"tc2","goal":4,"prompt":"Get the pressure back into the normal range within \u003cstrong>2 seconds\u003c/strong> of standing, and keep it there for the whole run.","why":"Medium / 0 s and Strong / 0 s are back in 1 s; Medium / 1 s is back in 2 s. Each corrects firmly without overshooting out of the range.","general":"The swings grow: it never settles.","named":{"scn":"Switch the scenario to \u003cstrong>Blood pressure\u003c/strong> first.","build":"Build the loop correctly first (challenge 1).","plus":"Set the return arrow to −: a + loop makes the drop worse.","broken":"Switch off “Receptor damaged” and “Effector blocked”: a broken loop can’t correct.","weak":"Too slow: 3 s or more.","s1":"It overshoots to 110 and never settles.","m2":"It overshoots to 105, outside the range."},"hints":["A weak response is steady but slow.","A strong response is fine only if the sensor has no delay.","Try Medium / 0 s, Strong / 0 s or Medium / 1 s."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"A slow sensor: the delay is locked at 2 s. Choose the \u003cstrong>one\u003c/strong> strength that brings the pressure back into range and never lets it leave again. You get one Check, so reason first.","why":"Weak / 2 s is back in range at 4 s and peaks at about 92.8 mmHg: slow, but it never overshoots out of the range.","general":"Set the sensor delay to 2 s: this challenge’s sensor is slow.","named":{"scn":"Switch the scenario to \u003cstrong>Blood pressure\u003c/strong> first.","build":"Build the loop correctly first (challenge 1).","plus":"Set the return arrow to −: a + loop makes the drop worse.","broken":"Switch off “Receptor damaged” and “Effector blocked”: a broken loop can’t correct.","m2":"Reaches 105: the 2-second-old reading still says ‘too low’ when pressure is already at 90.","s2":"The swings grow: each correction is based on readings 2 s old."},"hints":["With a delay, the control centre keeps correcting after the problem is fixed.","The bigger each correction, the further it overshoots.","Choose Weak: slow, but it never overshoots out of range."]}]},"part3":{"slug":"systems","name":"Two systems","heading":"Nervous vs endocrine control","intro":"The nervous and endocrine systems both carry the signals in your feedback loops. Race them side by side, then trace the link between them: the place where a nerve signal becomes a hormone signal.","st1":{"title":"Station 1: The race","text":"Two lanes start together. Press \u003cstrong>Start the race\u003c/strong> and watch which signal arrives first, how it travels and how long its effect lasts.","lanes":[{"id":"nerve","name":"Nerve: withdrawal reflex","by":"Neurons","time":"About 0.05 s","lasts":"Ends as soon as the impulse stops","cells":"Only those the neurons reach","end":"Hand pulls away"},{"id":"epi","name":"Hormone: epinephrine (adrenaline)","by":"Blood","time":"A few seconds","lasts":"Minutes","cells":"Every cell with the receptor","end":"Heart speeds up"},{"id":"thy","name":"Hormone: thyroid hormone","by":"Blood","time":"Hours to days","lasts":"Days","cells":"Every cell with the receptor","end":"Metabolic rate rises"}],"rows":["Signal travels by","Time to response","How long it lasts","Which cells respond"],"addThy":"Add thyroid hormone","note":"Race times are typical values. The nerve impulse reaches the arm muscles in about 0.05 s; epinephrine from the adrenal glands spreads through the blood and the heart speeds up after a few seconds."},"st2":{"title":"Station 2: The link","text":"The hypothalamus links the two systems through the pituitary gland. Trace each path, then tap a structure to see its job.","paths":[{"id":"p1","t":"Trace path 1: ADH","steps":["A neuron in the hypothalamus makes ADH.","ADH travels down the neuron’s own axon to the \u003cstrong>posterior pituitary\u003c/strong>.","It is released into the blood. A nerve cell that releases a hormone."]},{"id":"p2","t":"Trace path 2: releasing hormone","steps":["The hypothalamus releases a \u003cstrong>releasing hormone\u003c/strong> into tiny blood vessels.","The vessels lead to the \u003cstrong>anterior pituitary\u003c/strong>.","The anterior pituitary releases its own hormone (for example TSH, FSH or LH) into the blood."]}],"parts":[{"id":"hyp","t":"Hypothalamus","job":"Part of the brain that senses the body’s state (for example blood concentration and temperature) and controls the pituitary. Its neurons make ADH and oxytocin, and releasing hormones."},{"id":"axon","t":"Neurosecretory axons","job":"Hypothalamus neurons whose axons run down the stalk. They carry ADH and oxytocin to the posterior pituitary."},{"id":"post","t":"Posterior pituitary","job":"Stores and releases ADH and oxytocin, made by hypothalamus neurons, into the blood. It makes no hormones of its own."},{"id":"portal","t":"Portal blood vessels","job":"Tiny blood vessels that carry releasing hormones straight from the hypothalamus to the anterior pituitary."},{"id":"ant","t":"Anterior pituitary","job":"Gland tissue that makes its own hormones (TSH, FSH, LH, growth hormone) and releases them when releasing hormones arrive."},{"id":"blood","t":"Bloodstream","job":"Carries pituitary hormones to every cell in the body; only cells with the matching receptor respond."}]},"data":{"title":"Check it with data","head":["Response","Signal","Time to start","Lasts"],"rows":[["Pupil narrows in bright light","Nerve","under 1 s","while the light is bright"],["Heart speeds up when startled","Nerve, then epinephrine","about 1 s, then seconds","minutes"],["Metabolic rate rises after thyroid hormone","Hormone","hours to days","days"]],"asks":[{"id":"fast","t":"Tap the row that best fits “fast, brief, targeted”.","_a":"Uw==","fb":["✓ Right. A nerve signal: under a second to start, over as soon as the light dims, and only the iris muscles respond.","It starts fast, but the epinephrine keeps it going for minutes and reaches many cells. Try another row.","Hours to days to start and days to wear off: that’s the opposite. Try another row."]},{"id":"slow","t":"Tap the row that best fits “slow, long-lasting, widespread”.","_a":"UQ==","fb":["That’s a quick, brief nerve response. Try another row.","Part of it is a fast nerve signal, and the effect lasts minutes, not days. Try another row.","✓ Right. A hormone that takes hours to days, lasts days and reaches almost every cell."]}]},"quickCheck":{"title":"Two systems quick check","summary":"Two systems quick check","items":[{"id":"q1","goal":5,"prompt":"Which signal reaches every cell that has the right receptor?","choices":[{"t":"A nerve impulse","fb":"Hormones travel in the blood; nerve impulses go only where neurons lead.","_n":"147d7","_k":"f664189f"},{"t":"A hormone","fb":"Hormones travel in the blood; nerve impulses go only where neurons lead.","_n":"157e7","_k":"513d3ee4"},{"t":"A synapse","fb":"Hormones travel in the blood; nerve impulses go only where neurons lead.","_n":"167f7","_k":"4d7bf35b"},{"t":"A reflex","fb":"Hormones travel in the blood; nerve impulses go only where neurons lead.","_n":"17807","_k":"e04024e5"}]},{"id":"q2","goal":5,"prompt":"Which part of the pituitary releases ADH made in the hypothalamus?","choices":[{"t":"Neither","fb":"ADH is made by hypothalamus neurons and released from their endings in the posterior pituitary.","_n":"18817","_k":"018ad1d7"},{"t":"Anterior","fb":"ADH is made by hypothalamus neurons and released from their endings in the posterior pituitary.","_n":"19827","_k":"527e2b69"},{"t":"Posterior","fb":"ADH is made by hypothalamus neurons and released from their endings in the posterior pituitary.","_n":"1a837","_k":"db4d06b3"},{"t":"Both","fb":"ADH is made by hypothalamus neurons and released from their endings in the posterior pituitary.","_n":"1b847","_k":"d87f23dc"}]},{"id":"q3","goal":5,"prompt":"Which control is fastest?","choices":[{"t":"Endocrine","fb":"Impulses take milliseconds; hormones take seconds to days.","_n":"1c857","_k":"34152344"},{"t":"Depends on the hormone only","fb":"Impulses take milliseconds; hormones take seconds to days.","_n":"1d827","_k":"9ed390ac"},{"t":"Nervous","fb":"Impulses take milliseconds; hormones take seconds to days.","_n":"1e817","_k":"17eb2d7d"},{"t":"They’re equal","fb":"Impulses take milliseconds; hormones take seconds to days.","_n":"1f807","_k":"d7e55ecc"}]},{"id":"q4","goal":3,"prompt":"Blood pressure \u003cstrong>rises\u003c/strong> and the loop brings it \u003cstrong>down\u003c/strong>. What kind of feedback is that?","choices":[{"t":"Positive","fb":"Negative means opposing the change, whether the change was up or down.","_n":"1g7f7","_k":"6198aea2"},{"t":"Both","fb":"Negative means opposing the change, whether the change was up or down.","_n":"1h867","_k":"ab058cf4"},{"t":"Neither","fb":"Negative means opposing the change, whether the change was up or down.","_n":"1i857","_k":"bb7b4d62"},{"t":"Negative","fb":"Negative means opposing the change, whether the change was up or down.","_n":"1j847","_k":"a5189aa7"}]}]}},"practice":{"activities":[{"id":"loops","type":"custom","title":"Build the loop","summary":"Build the loop","goal":[2,6],"noun":"card","txt":true,"instruction":"Ten cards, two loops. Sort each card into its part of the loop: round 1 is blood CO₂; round 2 is body water.","how":"","boxes":[{"id":"stim","label":"Stimulus"},{"id":"rec","label":"Receptor"},{"id":"cc","label":"Control centre"},{"id":"eff","label":"Effector"},{"id":"resp","label":"Response"}],"wrongDefault":"Ask: does this card detect, decide, act, or describe a change?","rounds":[{"id":"r1","title":"Round 1: Blood CO₂","items":[{"id":"i1","t":"Blood CO₂ rises during exercise","_a":"QURMXF0V","why":"The rise in CO₂ is the change that sets the loop off."},{"id":"i2","t":"Chemoreceptors in the medulla and in the carotid and aortic bodies","_a":"QUVdVhI=","why":"Chemoreceptors detect the rise in CO₂.","wrong":{"eff":"Receptors detect the change."}},{"id":"i3","t":"Respiratory centre in the medulla","_a":"QVRbFw==","why":"It receives the signal and decides how hard to breathe.","wrong":{"eff":"The respiratory centre decides; muscles carry it out."}},{"id":"i4","t":"Diaphragm and rib (intercostal) muscles","_a":"QVJeUxI=","why":"These muscles act: they move air in and out.","wrong":{"rec":"Muscles and kidney ducts act; they don’t sense."}},{"id":"i5","t":"Faster, deeper breathing; CO₂ falls","_a":"QUVdRkAV","why":"The response opposes the rise: negative feedback.","wrong":{"stim":"That’s the result of the loop, not what set it off."}}]},{"id":"r2","title":"Round 2: Body water","items":[{"id":"i6","t":"Blood becomes more concentrated (water lost by sweating)","_a":"QURMXF0V","why":"The change in blood concentration sets the loop off."},{"id":"i7","t":"Osmoreceptors in the hypothalamus","_a":"QUVdVhI=","why":"Osmoreceptors detect the more concentrated blood.","wrong":{"eff":"Receptors detect the change."}},{"id":"i8","t":"Hypothalamus signals the posterior pituitary to release ADH","_a":"QVRbFw==","why":"The hypothalamus decides, and the posterior pituitary releases the hormone.","hints":["Who decides to release the hormone?","The hypothalamus controls the posterior pituitary.","Control centre."]},{"id":"i9","t":"Collecting ducts of the kidneys","_a":"QVJeUxI=","why":"ADH acts on the collecting ducts, which reabsorb more water.","wrong":{"rec":"Muscles and kidney ducts act; they don’t sense."},"hints":["Where does ADH act?","On the kidney’s collecting ducts.","Effector."]},{"id":"i10","t":"More water reabsorbed; less, more concentrated urine","_a":"QUVdRkAV","why":"Keeping water dilutes the blood again: negative feedback.","wrong":{"stim":"That’s the result of the loop, not what set it off."}}]}]},{"id":"next","type":"mc","title":"What happens next?","summary":"What happens next?","goal":[3,4,6],"star":true,"instruction":"Six scenarios. Predict what happens. Items 3–6 are non-routine (★); 5 and 6 go beyond the Final Check.","items":[{"id":"s1","goal":4,"prompt":"A drug blocks the effect of ADH on the kidneys. Predict the urine.","options":[{"t":"Large volumes of dilute urine","why":"Without ADH acting, the collecting ducts reabsorb less water, so more, weaker urine is made.","_n":"1k837","_k":"83c36a91"},{"t":"No change in the urine","why":"ADH is the signal that tells the collecting ducts to keep water; blocking it changes the urine.","_n":"1l8a7","_k":"39db770b"},{"t":"Small volumes of concentrated urine","why":"Without ADH acting, less water is reabsorbed.","_n":"1m897","_k":"f3741caa"},{"t":"No urine at all","why":"The kidneys still filter the blood; they just reabsorb less water.","_n":"1n887","_k":"a7e0229c"}]},{"id":"s2","goal":3,"prompt":"During labour, a hospital gives extra oxytocin. Predict the contractions.","options":[{"t":"No change, because oxytocin acts only on the brain","why":"Oxytocin travels in the blood to the uterine muscle.","_n":"1o897","_k":"00e454f4"},{"t":"They become stronger and more frequent","why":"Oxytocin is the signal in the + loop; more of it strengthens contractions.","_n":"1p867","_k":"f3e9a2bf"},{"t":"They become weaker","why":"Oxytocin is the signal in the + loop; more of it strengthens contractions.","_n":"1q877","_k":"d082fdc4"},{"t":"They stop","why":"Oxytocin drives contractions; it doesn’t stop them. Delivery is what ends the loop.","_n":"1r847","_k":"d8578dcc"}]},{"id":"s3","goal":3,"prompt":"★ In severe heat stroke, a very high temperature stops the sweat glands working, so the body heats up even faster. What kind of feedback is this?","options":[{"t":"Positive feedback, and helpful","why":"It amplifies the change, so it’s positive, but a runaway temperature is harmful.","_n":"1s857","_k":"787174b4"},{"t":"Positive feedback, and harmful","why":"The change makes itself worse: that’s positive feedback, and here it’s dangerous.","_n":"1t827","_k":"fcc9d52f"},{"t":"Negative feedback","why":"The change makes itself worse: that’s positive, even though nothing about it is helpful.","_n":"1u837","_k":"ab03b484"},{"t":"No feedback: the sweat glands are just tired","why":"The high temperature feeds back to push itself higher: that’s a loop.","_n":"1v907","_k":"4cac163f"}]},{"id":"s4","goal":4,"prompt":"★ A graph of blood glucose after a meal rises, falls \u003cstrong>below\u003c/strong> the starting level, then climbs back. Which loop feature best explains the dip?","options":[{"t":"A blocked effector","why":"Then glucose would have stayed high.","_n":"1w917","_k":"50d3688b"},{"t":"A delay, so the response continued after glucose was back to normal","why":"Insulin keeps acting after glucose is already back, so the loop over-corrects.","_n":"1x8e7","_k":"8cf185f8"},{"t":"A damaged receptor","why":"Then glucose wouldn’t have come back down.","_n":"1y8d7","_k":"5f2092a3"},{"t":"Positive feedback","why":"Positive feedback would push glucose further up, not bring it back.","_n":"1z907","_k":"f5f95733"}],"hints":["The level went past the set point.","What makes a loop over-correct?","A delay: insulin keeps acting after glucose is already back."]},{"id":"s5","goal":6,"prompt":"★ A student wants to test whether standing up changes heart rate. Which design gives a fair test?","options":[{"t":"The same people measured sitting, then 30 s after standing, at the same time of day, three times each","why":"Only posture changes, and the repeats show whether the pattern is reliable.","_n":"208f7","_k":"e9c66f1e"},{"t":"Measure one person once sitting and once standing","why":"One reading each can’t show a reliable pattern.","_n":"21927","_k":"c8193493"},{"t":"Compare a group of athletes with a group of non-athletes","why":"That changes two things at once: posture and fitness.","_n":"22917","_k":"36ad60db"},{"t":"Measure people sitting in the morning and standing in the evening","why":"Time of day changes too.","_n":"23947","_k":"7eb16333"}]},{"id":"s6","goal":3,"prompt":"★ Blood clotting is positive feedback. Name the event that ends it, and explain why a body needs an end event.","options":[{"t":"The heart pumps the platelets away from the cut","why":"Platelets stay at the damage while the signal lasts; it’s the end of the damage signal that stops the loop.","_n":"24937","_k":"99a1adfb"},{"t":"The platelets run out","why":"Platelets are plentiful; it’s the end of the damage signal that stops the loop.","_n":"25867","_k":"fba689fc"},{"t":"Negative feedback takes over and dissolves the clot","why":"The loop ends because its stimulus ends, not because it switches type.","_n":"26857","_k":"974de604"},{"t":"The vessel is sealed, so no new damage signals are released; without an end, clots would keep spreading through the blood","why":"Positive feedback stops only when its stimulus ends: here, the damage signal.","_n":"27049","_k":"89641631"}],"hints":["What starts the loop?","Chemicals released at the damaged vessel.","Once the hole is sealed, the signal stops; otherwise clotting would spread."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Siddharth","how":"","instruction":"Siddharth made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain how the body cools down on a hot day.","steps":["The stimulus is a rise in body temperature.","The sweat glands detect the rise.","The hypothalamus sends signals out.","Sweat evaporates and cools the skin."],"_a":"Ug==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is fine on its own. The mistake is earlier.","Step 4 is correct."],"fixes":[{"t":"Thermoreceptors in the skin and the hypothalamus detect the rise; sweat glands are the effectors.","why":"Receptors detect the change; effectors (muscles and glands) act to change the variable.","_n":"28059","_k":"fa415a6f"},{"t":"The sweat itself detects the rise.","why":"Sweat is part of the response.","_n":"29069","_k":"6805a57a"},{"t":"The skin muscles detect the rise.","why":"Muscles are effectors, not receptors.","_n":"2a079","_k":"e67b755f"},{"t":"Step 2 is correct.","why":"Glands act; they don’t sense.","_n":"2b009","_k":"089afdb3"}],"hints":["Which parts detect, and which parts act?","Sweat glands produce sweat.","Thermoreceptors detect; glands respond."]},{"id":"e2","goal":3,"task":"Explain the feedback in childbirth.","steps":["The baby’s head stretches the cervix.","Stretch receptors send signals to the hypothalamus.","The posterior pituitary releases oxytocin.","Oxytocin makes the contractions stronger, which reduces the stretch, so this is negative feedback.","The loop stops when the baby is delivered."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 is correct."],"fixes":[{"t":"Stronger contractions push the baby further and \u003cem>increase\u003c/em> the stretch, so oxytocin release rises: positive feedback.","why":"Positive feedback pushes a change further until an outside event ends it, as delivery ends labour.","_n":"2c019","_k":"1c2963e8"},{"t":"It’s neither, because no hormone is involved.","why":"Oxytocin is a hormone.","_n":"2d029","_k":"6b106ab7"},{"t":"It’s negative feedback because the pain is negative.","why":"Negative means the response \u003cstrong>opposes\u003c/strong> the change, whichever direction it was in. It keeps you stable.","_n":"2e039","_k":"bb3027bf"},{"t":"Step 4 is correct.","why":"Each contraction makes the next stronger; that’s amplifying.","_n":"2f0c9","_k":"97b9d494"}],"hints":["Does the response reduce the stimulus or increase it?","More pushing means more stretch.","Positive feedback."]},{"id":"e3","goal":1,"task":"Interpret a graph: blood glucose was 5 mmol/L, rose to 8 after lunch, and was back to 5.5 two hours later.","steps":["Glucose rose after the meal because sugar was absorbed.","Homeostasis failed, because the glucose level changed.","Then insulin brought it back down."],"_a":"Ug==","stepFb":["Step 1 is correct.","","Step 3 is true, but the mistake is earlier."],"fixes":[{"t":"Homeostasis worked: the level moved away from the set point, and negative feedback returned it to the normal range.","why":"Regulated variables move all the time. Homeostasis keeps them within a normal range around a set point.","_n":"2g0d9","_k":"7fd3a511"},{"t":"It’s positive feedback because glucose went up.","why":"Negative means the response \u003cstrong>opposes\u003c/strong> the change, whichever direction it was in. It keeps you stable.","_n":"2h0a9","_k":"371cf568"},{"t":"Step 2 is correct.","why":"Changing and then returning is exactly what homeostasis looks like.","_n":"2i099","_k":"934ba625"},{"t":"Homeostasis failed because 5.5 isn’t exactly 5.","why":"Regulated variables move all the time. Homeostasis keeps them within a normal range around a set point.","_n":"2j089","_k":"511f2733"}],"hints":["Did the level come back?","Homeostasis is about returning to a range.","It worked."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most in the loop builder: the swinging pressure, or the loop that made things worse?"},{"id":"j2","q":"In your own words, why does almost every homeostatic loop use negative feedback?"},{"id":"j3","q":"Explain to a friend how to find the receptor and the effector in any loop."},{"id":"j4","q":"Which part of feedback still feels shaky to you? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which statement best describes homeostasis?","options":[{"t":"Changing internal conditions to match the environment","why":"That describes a body that doesn’t regulate.","_n":"2k079","_k":"509979a1"},{"t":"Keeping every internal condition exactly constant","why":"Variables move and are pulled back.","_n":"2l069","_k":"a67cd5db"},{"t":"Keeping internal conditions within a narrow range around a set point as conditions change","why":"Regulated variables move, and feedback keeps them within a normal range.","_n":"2m059","_k":"202f2d7a"},{"t":"Using positive feedback to amplify every change","why":"Positive feedback pushes a change further until an outside event ends it, as delivery ends labour.","_n":"2n049","_k":"474f7a4b"}]},"b":{"prompt":"Blood pressure dips when a person stands, then returns to normal within seconds. What does this show?","options":[{"t":"The set point moved down when the person stood","why":"Pressure came back to the same normal range.","_n":"2o039","_k":"1959cb81"},{"t":"Positive feedback, because the pressure changed","why":"Negative means the response \u003cstrong>opposes\u003c/strong> the change, whichever direction it was in. It keeps you stable.","_n":"2p129","_k":"f2cd6d1c"},{"t":"Homeostasis: a change away from the set point is corrected by negative feedback","why":"The dip is the change; the quick return is negative feedback at work.","_n":"2q119","_k":"d2fef631"},{"t":"Homeostasis failed, because the pressure changed","why":"Regulated variables move all the time. Homeostasis keeps them within a normal range around a set point.","_n":"2r82d","_k":"a4eabfbe"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In the loop that cools the body by sweating, what is the \u003cstrong>effector\u003c/strong>?","options":[{"t":"Sweat glands","why":"They act to change body temperature.","_n":"2s81d","_k":"663c039f"},{"t":"Evaporation of sweat","why":"That’s the response, not a structure.","_n":"2t84d","_k":"2078fe5e"},{"t":"Thermoreceptors in the skin","why":"They detect the change.","_n":"2u83d","_k":"c9f98608"},{"t":"The hypothalamus","why":"It’s the control centre.","_n":"2v7ed","_k":"92718d68"}]},"b":{"prompt":"In the loop that controls blood CO₂, what is the \u003cstrong>receptor\u003c/strong>?","options":[{"t":"Faster breathing","why":"That’s the response.","_n":"2w7dd","_k":"8a3c4710"},{"t":"The respiratory centre in the medulla","why":"That’s the control centre.","_n":"2x80d","_k":"5f105776"},{"t":"Chemoreceptors","why":"They detect the rise in CO₂.","_n":"2y7fd","_k":"919ae8c3"},{"t":"The diaphragm","why":"It’s an effector.","_n":"2z7ad","_k":"6bd09ce0"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which is an example of \u003cstrong>positive\u003c/strong> feedback?","options":[{"t":"Shivering when the body is cold","why":"Negative: it raises a falling temperature.","_n":"3079d","_k":"1995b745"},{"t":"Oxytocin strengthening uterine contractions during childbirth","why":"Stronger contractions increase the stretch, which releases more oxytocin: the response amplifies the change.","_n":"317cd","_k":"544cb941"},{"t":"Sweating when the body is hot","why":"That opposes the change: negative.","_n":"327dd","_k":"869ec236"},{"t":"Releasing ADH when the blood is too concentrated","why":"Negative: it restores water balance.","_n":"337ad","_k":"e8373cda"}]},"b":{"prompt":"Which is an example of \u003cstrong>positive\u003c/strong> feedback?","options":[{"t":"Insulin release after a meal","why":"Negative: it lowers rising glucose.","_n":"347bd","_k":"85a549a2"},{"t":"Platelets at a cut releasing chemicals that attract more platelets","why":"Each platelet that arrives brings more: the response amplifies the change until the cut is sealed.","_n":"3580d","_k":"2c52bb3f"},{"t":"Arterioles narrowing when blood pressure falls","why":"Negative: it raises the falling pressure.","_n":"3681d","_k":"4c404fee"},{"t":"Faster breathing when CO₂ rises","why":"Negative: it lowers the rising CO₂.","_n":"377ed","_k":"eed7fb02"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A patient’s baroreceptors are damaged. They stand up quickly. Predict what happens and why.","options":[{"t":"Pressure recovers normally because the heart senses pressure itself","why":"Receptors detect the change; effectors (muscles and glands) act to change the variable.","_n":"387fd","_k":"2f1a04ea"},{"t":"Blood pressure stays low longer, because the control centre isn’t told it fell","why":"With no receptor signal, the cardiovascular centre doesn’t act, so nothing corrects the drop.","_n":"3974d","_k":"4da77e26"},{"t":"Pressure rises above normal because the heart works harder","why":"Nothing tells the heart to work harder.","_n":"3a75d","_k":"35de84f0"},{"t":"Pressure falls further because positive feedback takes over","why":"A missing receptor means no correction, not a + loop.","_n":"3b76d","_k":"13fe44cc"}]},"b":{"prompt":"The nerve from the respiratory centre to the diaphragm is damaged. The person exercises. Predict what happens to blood CO₂ and why.","options":[{"t":"CO₂ rises, then the receptors bring it down by themselves","why":"Receptors detect the change; effectors (muscles and glands) act to change the variable.","_n":"3c75d","_k":"62e827be"},{"t":"CO₂ stays normal because the chemoreceptors still work","why":"Detecting isn’t enough; something must act.","_n":"3d74d","_k":"65e3455c"},{"t":"CO₂ falls because the receptors over-react","why":"The signal can’t reach the diaphragm.","_n":"3e73d","_k":"37fcb19a"},{"t":"CO₂ rises and stays high, because the effector can’t respond even though the change is detected","why":"The chemoreceptors detect the rise, but the diaphragm never gets the signal to act.","_n":"3f72d","_k":"143c3957"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"After a disturbance, a variable returns toward its set point, passes it, and swings back and forth several times before settling. Which loop feature best explains this?","options":[{"t":"Positive feedback","why":"The variable would run away, not settle.","_n":"3g71d","_k":"6c306486"},{"t":"A damaged receptor","why":"The variable wouldn’t return at all.","_n":"3h70d","_k":"73901924"},{"t":"A very weak response","why":"A weak response is slow but doesn’t overshoot.","_n":"3i6fd","_k":"5c378abc"},{"t":"A strong response combined with a delay","why":"With a delay in the loop, a strong response overshoots and swings back and forth.","_n":"3j7ed","_k":"d27954e4"}]},"b":{"prompt":"After a disturbance, a variable creeps back to its normal range over a long time and never passes the set point. Which loop feature best explains this?","options":[{"t":"A blocked effector","why":"The variable wouldn’t return at all.","_n":"3k7dd","_k":"6c41de5f"},{"t":"A strong response with a long delay","why":"That would overshoot.","_n":"3l70d","_k":"9f327240"},{"t":"Positive feedback","why":"The variable wouldn’t return.","_n":"3m71d","_k":"b37b3858"},{"t":"A weak response with little delay","why":"Each step corrects only a little of the gap, so it’s slow but never overshoots.","_n":"3n72d","_k":"7eb2fecf"}]}},{"id":"t3","cat":"T","goal":[2,3],"a":{"prompt":"When the centre of a honeybee hive rises above about 35 °C, workers fan their wings at the entrance and spread water droplets; when it cools, they stop. Which describes this?","options":[{"t":"Positive feedback, because more bees fan as it gets hotter","why":"More effort is used, but its effect opposes the change.","_n":"3o73d","_k":"6ff5d0b4"},{"t":"Not feedback, because no hormone is involved","why":"Feedback can run on behaviour.","_n":"3p6cd","_k":"8937759c"},{"t":"Negative feedback: the bees act as effectors that move the temperature back toward the set point","why":"Fanning and evaporating water oppose the rise in temperature.","_n":"3q6dd","_k":"df155871"},{"t":"The fanning is the stimulus","why":"The rise in temperature is the stimulus.","_n":"3r6ed","_k":"abc8b5a8"}]},"b":{"prompt":"A desert lizard moves into shade when its body temperature rises above 38 °C and back into the sun when it drops below 32 °C. Which describes this?","options":[{"t":"The sun is the control centre","why":"The lizard’s brain is.","_n":"3s6fd","_k":"0b1fd08e"},{"t":"Not homeostasis, because the lizard can’t make its own heat","why":"Behaviour still keeps the temperature in a range.","_n":"3t78d","_k":"4aaa32c0"},{"t":"Positive feedback, because the lizard keeps moving","why":"Each move opposes the change.","_n":"3u79d","_k":"f7688e88"},{"t":"Negative feedback through behaviour; the lizard’s muscles carry out the response","why":"Each move opposes the change, keeping the temperature between 32 °C and 38 °C.","_n":"3vead","_k":"4c1d9c4e"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why positive feedback can’t keep a variable stable?","options":[{"t":"“It is slower than negative feedback.”","why":"Speed isn’t the issue; direction is.","_n":"3we9d","_k":"85f7ce0c"},{"t":"“It has no receptor.”","why":"It has all five parts.","_n":"3xecd","_k":"dde89119"},{"t":"“It only happens when you are ill.”","why":"Childbirth is healthy positive feedback.","_n":"3yebd","_k":"0a0b3555"},{"t":"“It amplifies a change, pushing the variable further from where it started, so it needs an outside event to end it.”","why":"It names the direction (amplifying) and why an end event is needed.","_n":"3zeed","_k":"99f2b5d6"}]},"b":{"prompt":"Which is the best explanation of how negative feedback keeps blood pressure stable?","options":[{"t":"“When pressure changes, receptors signal the control centre, which makes effectors change pressure the opposite way until it is back in range.”","why":"It names the parts in order and says the change is reversed until pressure is back in range.","_n":"40edd","_k":"f98e92ec"},{"t":"“The heart senses pressure and adjusts itself.”","why":"Receptors detect the change; effectors (muscles and glands) act to change the variable.","_n":"41f0d","_k":"8c72f86b"},{"t":"“Negative feedback lowers pressure whenever it is measured.”","why":"Negative means the response \u003cstrong>opposes\u003c/strong> the change, whichever direction it was in. It keeps you stable.","_n":"42efd","_k":"72e20aa3"},{"t":"“Negative feedback stops pressure from ever changing.”","why":"Regulated variables move all the time. Homeostasis keeps them within a normal range around a set point.","_n":"43f2d","_k":"1b9e2acb"}]}},{"id":"c2","cat":"C","goal":[2,6],"a":{"prompt":"Which flow chart correctly shows the response to a rise in blood CO₂?","options":[{"t":"↑ CO₂ → hormone in the blood → every cell → faster breathing → CO₂ falls","why":"This loop runs on nerves.","_n":"44f1d","_k":"7f8f9c93"},{"t":"↑ CO₂ → diaphragm → respiratory centre → chemoreceptors → faster breathing → CO₂ falls","why":"The order of detect, decide, act is scrambled.","_n":"4504d","_k":"75a88abd"},{"t":"↑ CO₂ → chemoreceptors → respiratory centre → diaphragm → slower breathing → CO₂ rises further","why":"That would amplify the change.","_n":"4605d","_k":"02cb9517"},{"t":"↑ CO₂ → chemoreceptors → respiratory centre (medulla) → diaphragm and rib muscles → faster, deeper breathing → CO₂ falls","why":"Detect, decide, act, and the response opposes the rise.","_n":"4702d","_k":"385509e6"}]},"b":{"prompt":"Which flow chart correctly shows the response to a fall in blood pressure?","options":[{"t":"↓ pressure → pancreas → insulin → pressure rises","why":"Many loops run through the hypothalamus or medulla, but the pancreas, for example, senses and controls blood glucose itself.","_n":"4803d","_k":"4187369f"},{"t":"↓ pressure → baroreceptors → cardiovascular centre (medulla) → heart and arterioles → faster heart rate, narrower arterioles → pressure rises","why":"Detect, decide, act, and the response opposes the fall.","_n":"4900d","_k":"06524ec2"},{"t":"↓ pressure → heart → cardiovascular centre → baroreceptors → pressure rises","why":"The order of detect, decide, act is scrambled. Receptors detect the change; effectors (muscles and glands) act to change the variable.","_n":"4a01d","_k":"92aebc2c"},{"t":"↓ pressure → baroreceptors → cardiovascular centre → heart → slower heart rate → pressure falls further","why":"That would amplify the change.","_n":"4bfed","_k":"60a5fe29"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A patient takes a medicine that weakens the heart’s response to nerve signals. Why might they feel dizzy when standing up quickly?","options":[{"t":"The effector can’t respond strongly, so pressure takes longer to recover and the brain briefly gets less blood","why":"The receptors and control centre still work, but the weakened effector corrects slowly.","_n":"4cffd","_k":"8578ea2c"},{"t":"The medicine damages the baroreceptors","why":"It acts on the heart’s response, the effector.","_n":"4dfcd","_k":"c1554df1"},{"t":"The control centre stops working","why":"It still sends signals; the heart responds weakly.","_n":"4efdd","_k":"5bc03e3b"},{"t":"Standing up makes pressure rise too high","why":"Standing makes it fall.","_n":"4ffec","_k":"5ac15bb8"}]},"b":{"prompt":"A person loses a large amount of blood in an accident. Why does their heart rate rise?","options":[{"t":"Positive feedback: the damaged heart speeds itself up","why":"Positive feedback pushes a change further until an outside event ends it, as delivery ends labour.","_n":"4gfdc","_k":"34e17e14"},{"t":"The blood is warmer after an accident","why":"Temperature isn’t the stimulus here.","_n":"4hfcc","_k":"3ab45018"},{"t":"The heart pumps faster to push the lost blood out","why":"That would make things worse; the loop corrects pressure.","_n":"4ifbc","_k":"0af262dc"},{"t":"Pressure falls; baroreceptors signal the cardiovascular centre, which speeds the heart to raise pressure","why":"The same negative-feedback loop that corrects standing up corrects blood loss.","_n":"4j02c","_k":"cbcd824e"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A student wants to test whether standing up changes blood pressure. Which plan is the fairest test?","options":[{"t":"Measure one group seated and a different group standing","why":"Two groups differ in more than posture.","_n":"4k01c","_k":"c6a056a7"},{"t":"Measure one person once seated and once standing","why":"One reading each can’t show a reliable pattern.","_n":"4l00c","_k":"ea776995"},{"t":"Measure the same people seated and then 30 s after standing, at the same time of day, several times each","why":"Only posture changes, and repeats make the result reliable.","_n":"4mffc","_k":"14794f5f"},{"t":"Measure seated in the morning and standing at night","why":"Time of day changes too.","_n":"4nf6c","_k":"0565d5cf"}]},"b":{"prompt":"A student wants to test whether slow breathing lowers heart rate. Which plan is the fairest test?","options":[{"t":"Let each person choose whether to try slow breathing","why":"The groups may differ in many ways.","_n":"4of5c","_k":"c6d7445d"},{"t":"Measure heart rate only after slow breathing","why":"There’s nothing to compare it with.","_n":"4p78c","_k":"4bffe954"},{"t":"Measure the same people before and after 2 min of slow breathing, seated, and compare with people who sit quietly for 2 min","why":"Before-and-after readings plus a comparison group that only sits quietly isolate the slow breathing.","_n":"4q79c","_k":"9d14629f"},{"t":"Compare athletes who breathe slowly with non-athletes who don’t","why":"Fitness differs too.","_n":"4r7ac","_k":"e43e0fbf"}]}}]},"task":{"title":"Steady breathing","summary":"Steady breathing","statement":"\u003cp>Design a breathing-control loop that brings blood CO₂ back to normal after exercise without over-correcting. There’s more than one design that works. Can you find them all?\u003c/p>\u003col class=\"ho-conds\">\u003cli>The receptor can detect CO₂.\u003c/li>\u003cli>The control centre is the one that controls breathing.\u003c/li>\u003cli>The effector can change breathing.\u003c/li>\u003cli>The loop is negative feedback.\u003c/li>\u003cli>After the disturbance, CO₂ is back in the normal range (35–45 mmHg) within 4 s and stays there.\u003c/li>\u003cli>CO₂ never falls more than 2 mmHg below the set point (40 mmHg).\u003c/li>\u003c/ol>","inputs":{"rec":"Receptor","cc":"Control centre","eff":"Effector","sign":"Sign","str":"Strength","del":"Delay"},"recs":[{"id":"chemo","t":"Chemoreceptors"},{"id":"thermo","t":"Thermoreceptors"},{"id":"baro","t":"Baroreceptors"}],"ccs":[{"id":"resp","t":"Respiratory centre (medulla)"},{"id":"hypo","t":"Hypothalamus"},{"id":"cardio","t":"Cardiovascular centre"}],"effs":[{"id":"dia","t":"Diaphragm and rib muscles"},{"id":"sweat","t":"Sweat glands"},{"id":"heart","t":"Heart"}],"modelNote":"Teaching model, not clinical data: C(t + 1) = C(t) − g × [C(t − d) − 40], starting at 55 mmHg at t = 0 and 40 before; g = 1/4, 1/2 or 1. A loop with a wrong part can’t correct, so CO₂ stays at 55.","checks":["Receptor detects CO₂","Breathing control centre","Effector changes breathing","Negative feedback","In range within 4 s, and stays","No big over-correction"],"tips":["Which receptors respond to chemicals in the blood?","Breathing is controlled in the medulla.","Which muscles move air?","The response must oppose the rise.","Too weak or too slow: try a stronger response or a shorter delay.","It dips too low: a delay with a strong response over-corrects."],"success":"Your loop holds CO₂ steady!","explainPrompt":"Explain why some strength and delay combinations failed, using what happened to the CO₂ line.","vocab":"Use the words receptor, effector, negative feedback, delay and overshoot.","after3":"Every design that works is either gentle or quick to sense. A delay forces a gentler response.","afterAt":4},"cards":[["Homeostasis","Keeping internal conditions within a narrow range around a set point as conditions change."],["Set point and normal range","The target value and the band of acceptable values around it (e.g. blood pressure model: 90; 80–100 mmHg)."],["Five parts of a loop","Stimulus → receptor → control centre → effector → response."],["Receptor","Detects a change (e.g. baroreceptors, chemoreceptors, thermoreceptors)."],["Effector","A muscle or gland that acts to change the variable."],["Negative feedback","The response opposes the change. Example: faster breathing lowers rising CO₂."],["Positive feedback","The response amplifies the change until an outside event ends i
