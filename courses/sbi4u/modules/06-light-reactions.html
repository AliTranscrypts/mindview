.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

.jq{margin:0 0 18px}

textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}

.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}

.bars{display:grid;gap:10px;margin:14px 0}

.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}

ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}

ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}

.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}

.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}

.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}

}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 06: thylakoid membrane simulator (S4), energy ledger (S3), acid-bath bench (S7), ATP synthase close-up, task, hero.
   Module tokens: --lr-lumen (lumen tint: --hi over the sheet, lighter in dark mode so magenta H⁺ stays visible), --lr-buf (buffer).
   Roles: H⁺ --bio-h, e⁻ --bio-e, ATP --bio-atp, NADPH --bio-nadh, O₂/H₂O --bio-o2, membrane --leaf (illustration only). */
:root{--lr-lumen:color-mix(in srgb,var(--hi) 22%,var(--sheet));--lr-buf:color-mix(in srgb,var(--ink-2) 9%,var(--sheet));--lr-cx:color-mix(in srgb,var(--ink-2) 15%,var(--sheet))}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--lr-lumen:color-mix(in srgb,var(--hi) 12%,var(--sheet))} }
:root[data-theme="dark"]{--lr-lumen:color-mix(in srgb,var(--hi) 12%,var(--sheet))}

/* hero equation */
.hero .hero-eq .lr-heq{font-size:.8em}
.lr-heq .lr-harr{display:inline-block;margin:0 .1em}
.lr-c-o2{color:var(--bio-o2);font-weight:700}.lr-c-atp{color:var(--bio-atp);font-weight:700}.lr-c-nadh{color:var(--bio-nadh);font-weight:700}
.lr-hero{width:100%;aspect-ratio:520 / 290}
.lr-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 01 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* switches */
.lr-sws{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lr-swb{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .6em;min-height:44px;font-size:.88rem;line-height:1.25}
.lr-swb > span:nth-child(2){flex:1 1 auto;min-width:0}
.lr-swk{flex:0 0 30px;height:16px;border-radius:8px;border:1.5px solid var(--ink-2);position:relative;background:var(--paper)}
.lr-swk::after{content:"";position:absolute;top:1.5px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.lr-swb[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.lr-swb[aria-checked="true"] .lr-swk{background:var(--ink);border-color:var(--ink)}
.lr-swb[aria-checked="true"] .lr-swk::after{left:15px;background:var(--sheet)}
.lr-swst{font-size:.75rem;font-weight:700;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){ .lr-swk::after{transition:none} }

/* explore layout */
.lr-pg [hidden]{display:none!important}
@media (min-width:821px){ .lr-pg{grid-template-rows:auto 1fr} }
.lr-pg .pg-ctrl{display:grid;gap:12px}
.lr-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.lr-ptitle,.lr-pnote,.lr-note{margin:0}
.lr-note{margin-top:10px}
.lr-sl{margin:0}
.lr-sl input{width:100%;accent-color:var(--ink)}
.lr-stage{position:relative;width:100%;aspect-ratio:520 / 290;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.lr-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lr-stage-bench,.lr-stage-zoom{aspect-ratio:520 / 250}
.lr-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.lr-legend span{display:inline-flex;align-items:center;gap:4px}
.lr-legend svg{width:14px;height:14px}
.lr-legend svg[viewBox^="0 0 22"]{width:22px}
.lr-lg-t{background:var(--c);color:var(--sheet);font-weight:700;border-radius:999px;padding:0 .5em}
.lr-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}

/* SVG drawing */
.lr-stroma{fill:var(--sheet)}
.lr-lumen{fill:var(--lr-lumen)}
.lr-mem{fill:var(--leaf-fill)}
.lr-lip{fill:var(--leaf-edge);opacity:.55}
.lr-edge{stroke:var(--leaf-edge);stroke-width:2}
.lr-pore{fill:var(--lr-lumen);stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3}
.lr-cx{fill:var(--lr-cx);stroke:var(--ink-2);stroke-width:1.5}
.lr-cr{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.lr-fo{fill:var(--lr-cx);stroke:var(--ink-2);stroke-width:1.5}
.lr-rot{fill:var(--ink-2)}
.lr-stalk{fill:var(--ink-2)}
.lr-stator{stroke:var(--ink-2);stroke-width:3;fill:none;stroke-linecap:round}
.lr-head{fill:var(--lr-cx);stroke:var(--ink-2);stroke-width:1.6}
.lr-lobe{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.lr-plug{fill:var(--ink)}
.lr-plugx{stroke:var(--sheet);stroke-width:2;fill:none}
.lr-h{fill:var(--bio-h);stroke:var(--sheet);stroke-width:.8}
.lr-e{fill:var(--bio-e);stroke:var(--sheet);stroke-width:1.1}
.lr-photon{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lr-epath{fill:none;stroke:var(--bio-e);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.lr-hpath{fill:none;stroke:var(--bio-h);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.lr-cyc{stroke-dasharray:2 4}
.lr-ah{stroke-dasharray:none}
.lr-rotarr{fill:none;stroke:var(--ink);stroke-width:1.8}
.lr-tpath{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:4 3}
.lr-flash{fill:var(--hi)}
.lr-tokt{font:700 9.5px var(--font-ui);fill:var(--sheet)}
.lr-t{font:600 11px var(--font-ui);fill:var(--ink-2)}
.lr-tb{font:700 11.5px var(--font-ui);fill:var(--ink)}
.lr-ts{font:600 10px var(--font-ui);fill:var(--ink-2)}
.lr-tc{font:700 12px var(--font-ui);fill:var(--ink)}
.lr-tcs{font:700 10px var(--font-ui);fill:var(--ink)}
.lr-tplug{font:700 9px var(--font-ui);fill:var(--sheet)}
.lr-tbig{font:700 15px var(--font-ui);fill:var(--ink)}
.lr-etxt{font:700 11px var(--font-ui);fill:var(--bio-e)}
.lr-halo{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
/* bench and close-up */
.lr-buf{fill:var(--lr-buf)}
.lr-glass{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.lr-thy{fill:var(--lr-lumen);stroke:var(--leaf);stroke-width:6}
.lr-lamp{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.lr-lampx{stroke:var(--ink);stroke-width:2}
.lr-gauge{fill:var(--paper);stroke:var(--rule);stroke-width:1}
.lr-gauge-f{fill:var(--bio-atp)}
.lr-stator2{fill:none;stroke:var(--ink-2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.lr-csub{fill:color-mix(in srgb,var(--ink-2) 32%,var(--sheet));stroke:var(--ink-2);stroke-width:1.2}
.lr-ring{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.lr-mark{fill:var(--sheet)}
.lr-alpha{fill:var(--lr-cx);stroke:var(--ink-2);stroke-width:1.5}
.lr-beta{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.8}
@media (max-width:560px){
  .lr-tb{font-size:15px}.lr-ts{font-size:13.5px}.lr-tc{font-size:14px}.lr-tcs{font-size:12px}.lr-tokt{font-size:11px}.lr-tbig{font-size:18px}
}

/* S3 energy ledger */
.lr-ledger{display:grid;gap:12px;margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.lr-lgh{margin:0 0 6px;font-size:.92rem}
.lr-br{display:grid;grid-template-columns:4.4em minmax(0,1fr) 2.4em;gap:8px;align-items:center;font-size:.85rem;margin-top:4px}
.lr-bl{color:var(--ink-2);font-weight:700}
.lr-br b{text-align:right}
.lr-bt{position:relative;display:block;height:14px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);overflow:hidden}
.lr-bt i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.lr-bs{background:var(--lc)}
.lr-bd{background:repeating-linear-gradient(45deg,var(--lc) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 2px var(--lc)}

/* Part 3 */
.lr-st h3{margin-top:0}
.lr-zst{margin-top:20px}
.lr-fig{margin:8px 0;max-width:700px}
.lr-fig figcaption{margin-top:6px}
.lr-bcap{font-weight:700}
.lr-data{margin:20px 0}
.lr-tbl{border-collapse:collapse;width:100%;font-size:.88rem}
.lr-tbl th,.lr-tbl td{text-align:left;vertical-align:middle;padding:6px 8px;border-bottom:1px solid var(--rule)}
.lr-tbl thead th{font-size:.8rem;color:var(--ink-2);vertical-align:bottom}
.lr-tbl tr:last-child th,.lr-tbl tr:last-child td{border-bottom:0}
.lr-tbl tr.on td{background:var(--hi-soft)}
.lr-tbl tr.ok td{font-weight:700}
.lr-rowb{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.3em .6em;font-weight:700;font-size:.88rem;min-height:36px;text-align:left;white-space:nowrap}
.lr-rowb[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.lr-rowb:disabled{opacity:.8}
.lr-tnote{margin:6px 0 0}
.lr-dq{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.lr-dqp{font-weight:700;margin:6px 0}
.lr-dqc{margin:6px 0}

/* practice */
.lr-pair{display:grid;gap:6px}
.lr-unit{margin-left:6px;color:var(--ink-2)}
.lr-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

/* task */
.lr-tlist{margin:.3em 0 .6em 1.3em;padding:0}
.lr-tin{display:grid;gap:12px;margin:12px 0}
.lr-tin .lr-sws{grid-template-columns:minmax(0,1fr)}
.lr-tpv h4{margin:0 0 4px}
.lr-tpv .lr-ledger{margin-top:6px}

Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"b21e67c5","content":{"id":"06-light-reactions","kind":"topic","title":"Light reactions","topic":"Light Reactions","readyTopic":"the light reactions","hero":{"eq":"\u003cspan class=\"lr-heq\">light + \u003cspan class=\"lr-c-o2\">H₂O\u003c/span> + ADP + Pᵢ + NADP⁺ \u003cspan class=\"lr-harr\">→\u003c/span> \u003cspan class=\"lr-c-o2\">O₂\u003c/span> + \u003cspan class=\"lr-c-atp\">ATP\u003c/span> + \u003cspan class=\"lr-c-nadh\">NADPH\u003c/span>\u003c/span>","eqLabel":"light plus H₂O plus ADP plus Pᵢ plus NADP⁺ gives O₂ plus ATP plus NADPH","eqSize":"sm","headline":"Light pumps the battery; H⁺ spins the turbine","text":"In the thylakoid membrane, excited electrons do work as they move. Their energy piles \u003cstrong>H⁺ ions\u003c/strong> up inside the thylakoid, making a steep \u003cstrong>gradient\u003c/strong>. The only easy way back out is through \u003cstrong>ATP synthase\u003c/strong>, which uses the flow to make \u003cstrong>ATP\u003c/strong>. This is \u003cstrong>chemiosmosis\u003c/strong>, and it’s the same trick your mitochondria use.","fig":{"html":"\u003cdiv class=\"lr-hero\" id=\"lr-hero\" role=\"img\" aria-label=\"A thylakoid membrane in cross-section, stroma above and lumen below. A photon hits photosystem II and an electron hops along the chain: plastoquinone, cytochrome b₆f, plastocyanin, photosystem I, ferredoxin and NADP⁺ reductase, where NADPH appears in the stroma. As it passes cytochrome b₆f, H⁺ slips into the lumen; water splits at photosystem II, releasing O₂ and more H⁺ into the lumen. The lumen fills with H⁺ and its pH drops from 8 to 5. Then H⁺ streams out through ATP synthase, its rotor turns, and ATP appears in the stroma.\">\u003c/div>"}},"goals":["I can say where H⁺ builds up and where ATP and NADPH are made in a chloroplast.","I can list the inputs and products of the light reactions.","I can explain how an H⁺ gradient drives ATP synthase (chemiosmosis).","I can predict what happens to O₂, NADPH and ATP when a part of the system is blocked or made leaky.","I can interpret data from experiments on chemiosmosis, including the acid-bath experiment.","I can apply the light reactions to herbicides, crops and other organisms."],"start":{"warmup":{"questions":[{"id":"w1","skill":"pH and H⁺ concentration","goal":1,"prompt":"Which solution has the higher concentration of H⁺ ions: one at pH 5 or one at pH 8?","options":[{"t":"pH 8","why":"pH goes \u003cstrong>down\u003c/strong> as H⁺ goes up.","_n":"0550","_k":"96d68c3e"},{"t":"They’re equal, because both are below 14","why":"The pH value itself tells you the H⁺ level.","_n":"1560","_k":"ca9f33f0"},{"t":"You can’t tell without the volume","why":"pH is a concentration, so volume doesn’t matter.","_n":"2570","_k":"3a27cfba"},{"t":"pH 5","why":"Lower pH means more H⁺.","_n":"3500","_k":"f5c91833"}],"hints":["Is a pH of 1 strongly acidic or basic?","Acidic means lots of H⁺.","pH 5 has more H⁺."]},{"id":"w2","skill":"pH and H⁺ concentration","goal":3,"prompt":"Solution X is pH 6 and solution Y is pH 7. How many times as many H⁺ ions per litre does X have?","options":[{"t":"1 time (they’re about the same)","why":"A 1-unit change is a tenfold change.","_n":"4510","_k":"d64b12ee"},{"t":"100 times","why":"That would be 2 pH units.","_n":"5520","_k":"bb888208"},{"t":"1.17 times (7 ÷ 6)","why":"pH is a logarithmic scale.","_n":"6530","_k":"b44f4902"},{"t":"10 times","why":"One pH unit is a factor of 10.","_n":"75c0","_k":"f48bc394"}],"hints":["pH is a logarithmic scale.","Each unit lower means 10 times more H⁺.","10 times."]},{"id":"w3","skill":"Membrane transport","goal":3,"prompt":"Ions move through an open channel protein without any energy input. Which way do they move?","options":[{"t":"From higher to lower concentration","why":"That’s diffusion down the gradient: no energy needed.","_n":"85d0","_k":"d4985fa4"},{"t":"From lower to higher concentration","why":"Moving against a gradient needs a pump and energy.","_n":"953d","_k":"62880f21"},{"t":"They don’t move without ATP","why":"Diffusion through channels is passive.","_n":"a52d","_k":"aee23d28"},{"t":"Either way, equally","why":"There’s a net flow down the gradient.","_n":"b51d","_k":"a6acf6d0"}],"hints":["Which way does food colouring spread in water?","Toward where there’s less.","High to low."]},{"id":"w4","skill":"Membrane transport","goal":3,"prompt":"A membrane protein moves H⁺ from a region of low H⁺ concentration to one of high H⁺ concentration. What must be true?","options":[{"t":"Nothing; ions can always cross membranes freely","why":"Charged ions can’t cross the lipid bilayer on their own.","_n":"c50d","_k":"f25a93cc"},{"t":"It uses an energy source, so this is active transport","why":"Moving against a gradient takes energy.","_n":"d4fd","_k":"00e4dbf1"},{"t":"The H⁺ is diffusing","why":"Diffusion goes from high to low.","_n":"e4ed","_k":"115f952c"},{"t":"It is a channel, so no energy is needed","why":"Channels only let ions run downhill.","_n":"f4dd","_k":"9ec7e916"}],"hints":["Is this uphill or downhill for H⁺?","Uphill needs energy.","Active transport."]},{"id":"w5","skill":"Electron flow (from 05)","goal":2,"prompt":"In noncyclic electron flow, which molecule finally accepts the electrons?","options":[{"t":"ADP, which becomes ATP","why":"ATP is made by ATP synthase, not by accepting electrons.","_n":"g4cd","_k":"213c1aa8"},{"t":"NADP⁺, which becomes NADPH","why":"NADP⁺ reductase hands two electrons and an H⁺ to NADP⁺.","_n":"h4bd","_k":"d4448b69"},{"t":"O₂, which becomes water","why":"O₂ is a \u003cstrong>product\u003c/strong> here, not the acceptor.","_n":"i4ad","_k":"6e8005c4"},{"t":"CO₂, which becomes sugar","why":"CO₂ is handled later, in the Calvin cycle.","_n":"j39d","_k":"c04f941e"}],"hints":["What does the chain end with in the stroma?","Ferredoxin → NADP⁺ reductase → …","NADP⁺."]},{"id":"w6","skill":"Electron flow (from 05)","goal":2,"prompt":"Photosystem II keeps losing excited electrons. What replaces them?","options":[{"t":"Nothing; PSII is used up","why":"PSII is refilled every time from water.","_n":"k3ad","_k":"0820d20f"},{"t":"Electrons from photosystem I","why":"Electrons flow PSII → PSI, not back.","_n":"l37d","_k":"92e4fd52"},{"t":"Electrons from glucose","why":"No glucose is broken down here.","_n":"m38d","_k":"d94514ec"},{"t":"Electrons from splitting water","why":"2H₂O → 4H⁺ + 4e⁻ + O₂ (photolysis).","_n":"n3dd","_k":"98e85944"}],"hints":["Where does the O₂ of photosynthesis come from?","Splitting water.","Water’s electrons."]}],"refreshers":{"pH and H⁺ concentration":"Lower pH = more H⁺. Each pH unit is a factor of 10, so pH 5 has 1000 times the H⁺ of pH 8.","Membrane transport":"Downhill (high → low) through a channel needs no energy. Uphill (low → high) needs a pump and an energy source.","Electron flow (from 05)":"Water → PSII → plastoquinone → cytochrome b₆f → plastocyanin → PSI → ferredoxin → NADP⁺ reductase → NADPH."}}},"explore":{"heading":"Thylakoid membrane simulator","intro":"Set the light and switch parts of the membrane on or off. Watch the H⁺ in the lumen, the pH, and what the membrane makes each second.","modelNote":"Model values. Real chloroplasts move a few more H⁺ per ATP. The model also holds the stroma at pH 8; real stroma rises from about pH 7 in the dark to about pH 8 in the light.","toggles":[["herb","PSII-blocking herbicide"],["unc","Uncoupler (H⁺ leak)"],["blk","ATP synthase blocker"]],"predIntro":"Make a prediction first. Then the simulator will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"mem","L":0},"to":{"L":3},"prompt":"\u003cspan class=\"muted\">Membrane mode, light Off.\u003c/span> The light goes from Off to High. What happens to the pH inside the thylakoid (the lumen)?","options":[{"t":"The stroma falls to 5 instead","_n":"o3ed","_k":"e76989c7"},{"t":"It stays at 8","_n":"p3bd","_k":"50251dd3"},{"t":"It falls to about 5","_n":"q3cd","_k":"66f00848"},{"t":"It rises to about 11","_n":"r41d","_k":"70832bcf"}],"explain":"H⁺ is released into the lumen when water splits and is moved in by cytochrome b₆f. More H⁺ means a lower pH."},{"id":"p2","start":{"mode":"mem","L":3},"to":{"unc":true},"prompt":"\u003cspan class=\"muted\">High light, normal membrane.\u003c/span> The uncoupler is switched on. Which product stops?","options":[{"t":"All three","_n":"s42d","_k":"f64fadcd"},{"t":"ATP only","_n":"tbfe","_k":"d1d0451c"},{"t":"O₂ only","_n":"ubee","_k":"d1c8ce15"},{"t":"NADPH and ATP","_n":"vc1e","_k":"65cfa9a5"}],"explain":"Electrons still flow from water to NADP⁺. Only the gradient that drives ATP synthase is lost."},{"id":"p3","start":{"mode":"mem","L":3},"to":{"herb":true},"prompt":"\u003cspan class=\"muted\">High light, normal membrane.\u003c/span> The PSII-blocking herbicide is switched on. What happens to O₂ release?","options":[{"t":"It continues, but ATP stops","_n":"wc0e","_k":"8dc1b315"},{"t":"It continues, because water still splits","_n":"xbbe","_k":"b25fa43f"},{"t":"It stops","_n":"ybae","_k":"d7e5448a"},{"t":"It increases","_n":"zbde","_k":"deb57c03"}],"explain":"PSII can’t pass its electrons on, so it can’t take new ones from water: no water splitting, no O₂, and nothing downstream."},{"id":"p4","start":{"mode":"budget","L":2,"c":0,"t":2},"reveal":true,"prompt":"\u003cspan class=\"muted\">Energy budget mode: Medium light, cyclic flow 0, Calvin demand 2 CO₂ per second.\u003c/span> What does the Calvin cycle run short of?","options":[{"t":"Nothing: supply matches","_n":"10bce","_k":"18035525"},{"t":"Both ATP and NADPH","_n":"11c7e","_k":"ea7d360b"},{"t":"NADPH, by 2 per second","_n":"12c6e","_k":"95c4dec9"},{"t":"ATP, by 2 per second","_n":"13b5c","_k":"5dca665d"}],"explain":"Supply: 4 ATP and 4 NADPH. Demand: 6 ATP and 4 NADPH. Noncyclic flow gives 1 ATP per NADPH, but the Calvin cycle uses 3 ATP for every 2 NADPH. Cyclic flow makes up the extra ATP."}],"chalIntro":"Use the simulator (Membrane mode) to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Set the light so the lumen holds exactly 100 times as many H⁺ as the stroma.","why":"Medium light: lumen pH 6, stroma pH 8. Two pH units: 10 × 10 = 100 times.","hints":["How many pH units make a factor of 100?","2 units: the lumen must be pH 6.","Medium light gives lumen pH 6."]},{"id":"tc2","goal":4,"prompt":"At High light, keep O₂ and NADPH flowing at the full rate but make ATP production 0.","why":"The uncoupler lets H⁺ leak back without passing through ATP synthase. The electron chain runs at full speed (3 O₂ and 6 NADPH per second), but there’s no gradient, so no ATP.","hints":["Which toggle removes the gradient without touching the electron chain?","A leak lets H⁺ back without passing through ATP synthase.","Uncoupler on, herbicide off."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Make the lumen hold 10 000 times as many H⁺ as the stroma.","why":"High light with ATP synthase blocked: H⁺ keeps being moved in but can’t get out, so the lumen drops to pH 8 − 3 − 1 = 4. Four pH units: 10 000 times.","hints":["10 000 times needs a 4-unit difference: lumen pH 4.","What happens if H⁺ keeps being pumped in but can’t leave through ATP synthase?","High light and block ATP synthase."]}]},"part3":{"slug":"acid-bath","name":"Acid bath","heading":"The acid-bath experiment","intro":"The simulator is a model. Here is real evidence: thylakoids that make ATP in the dark, powered only by a difference in pH. Watch the set-up, read the data, then zoom in on ATP synthase.","bench":{"title":"Station 1: the set-up","how":"Press \u003cstrong>Step\u003c/strong> (or \u003cstrong>Play\u003c/strong>) to run the experiment one stage at a time.","steps":["Isolated thylakoids soak in a pH 4 buffer, in the dark.","H⁺ seeps in until the lumen is also pH 4.","The thylakoids are moved quickly to a pH 8 buffer containing ADP and Pᵢ, still in the dark.","H⁺ rushes out through ATP synthase, down the gradient: a burst of ATP is measured."],"short":["soak at pH 4","lumen reaches pH 4","move to pH 8 + ADP + Pᵢ","burst of ATP"],"caption":"Based on a 1966 experiment by André Jagendorf and Ernest Uribe. The numbers below are model data."},"data":{"title":"Station 2: Check it with data","how":"Each tube held thylakoids, kept in the dark the whole time. Answer each prompt: for the first two, tap the tube rows in the table, then press \u003cstrong>Check\u003c/strong>.","head":["Tube","Soaked in (dark)","Moved to (dark)","Also added","ATP made (relative units)"],"rows":[["pH 4","pH 8","ADP + Pᵢ","100"],["pH 4","pH 4","ADP + Pᵢ","0"],["pH 8","pH 8","ADP + Pᵢ","0"],["pH 4","pH 8","ADP + Pᵢ + uncoupler","0"],["pH 4","pH 8","Pᵢ only (no ADP)","0"],["pH 5","pH 8","ADP + Pᵢ","40"]],"prompts":[{"id":"d1","kind":"rows","prompt":"Which tubes show that a \u003cstrong>difference\u003c/strong> in pH is needed?","_a":"OQAdVms=","right":"Tubes 2 and 3 had the same pH inside and out (4 and 4, or 8 and 8), and neither made ATP. Acid alone isn’t enough: there has to be a difference.","rowFb":{"1":"Tube 1 had a difference (pH 4 inside, pH 8 outside), and it made ATP.","4":"Tube 4 had a difference; it made no ATP because of the uncoupler, not because the pH matched.","5":"Tube 5 had a difference; it made no ATP because there was no ADP.","6":"Tube 6 had a difference (pH 5 inside, pH 8 outside), and it made ATP."},"missing":"One more tube shows it too: look for every tube with the same pH inside and out."},{"id":"d2","kind":"rows","prompt":"Which tube shows the H⁺ must pass through the membrane’s proteins, not leak?","_a":"OQZs","right":"Tube 4 matches tube 1 except for the uncoupler, which lets H⁺ leak across the membrane instead of passing through ATP synthase. Same gradient, no ATP.","rowFb":{"1":"Tube 1 made ATP: it’s the comparison, not the evidence.","2":"Tube 2 had no pH difference to begin with.","3":"Tube 3 had no pH difference to begin with.","5":"Tube 5 lacked ADP: it shows ADP is a raw material, not anything about leaks.","6":"Tube 6 had a smaller gradient, not a leak."},"missing":"Pick the one tube where something lets H⁺ leak across the membrane."},{"id":"d3","kind":"chips","prompt":"What is the independent variable across tubes 1, 2 and 6?","options":[{"t":"The pH difference","why":"Tubes 1, 2 and 6 differ only in their pH difference (4, 0 and 3 units); everything else is kept the same.","_n":"14b6c","_k":"19ac033d"},{"t":"The ADP and Pᵢ added","why":"All three tubes had ADP + Pᵢ: that was a controlled variable.","_n":"15b7c","_k":"ac43d6d6"},{"t":"The light","why":"Every tube was kept in the dark: light was a controlled variable.","_n":"16b8c","_k":"8cdc186e"},{"t":"The ATP made","why":"That’s the dependent variable: what was measured.","_n":"17b9c","_k":"0a4f7b9a"}]},{"id":"d4","kind":"chips","prompt":"Why was the whole experiment done in the dark?","options":[{"t":"Because light breaks down ATP","why":"Light doesn’t break down ATP. Keeping it dark rules out light as the energy source.","_n":"18bac","_k":"2c55546d"},{"t":"Because thylakoids only make ATP in the dark","why":"Lit thylakoids make ATP too (Explore). Keeping it dark rules out light as the energy source.","_n":"19bbc","_k":"8d25438f"},{"t":"To keep the buffers from warming up","why":"Temperature isn’t the point. Keeping it dark rules out light as the energy source.","_n":"1abcc","_k":"8305077e"},{"t":"To show that light isn’t needed once a gradient exists","why":"With no light, the only energy source was the pH gradient, so the ATP must have come from it.","_n":"1bbdc","_k":"ac549839"}]}]},"zoom":{"title":"Station 3: Zoom to the molecules","how":"Press \u003cstrong>Play the close-up\u003c/strong> to watch ATP synthase work. Then press \u003cstrong>Reverse the gradient\u003c/strong>.","normal":"H⁺ enters the membrane part from the lumen side and turns the rotor ring. The turning stalk changes the shape of the head in the stroma, which presses ADP and Pᵢ together into ATP.","reversed":"Reversed: the outside (stroma side) is now more acidic than the inside. H⁺ would have to flow in, not out through ATP synthase, so the rotor stops: no ATP."},"quickCheck":{"title":"Quick check","summary":"Acid bath quick check","items":[{"id":"q1","goal":5,"prompt":"What does tube 1 show?","choices":[{"t":"An H⁺ gradient alone can drive ATP synthesis","fb":"It was dark, so the energy came from the gradient.","_n":"1cbec","_k":"7aa1155d"},{"t":"Thylakoids store ATP","fb":"It was dark, so the energy came from the gradient.","_n":"1dbbd","_k":"77074ccf"},{"t":"ADP is made from ATP","fb":"It was dark, so the energy came from the gradient.","_n":"1ebad","_k":"ad789369"},{"t":"Light is needed to make ATP","fb":"It was dark, so the energy came from the gradient.","_n":"1fb9d","_k":"b52c754e"}]},{"id":"q2","goal":[3,5],"prompt":"Tube 6 made less ATP than tube 1 because…","choices":[{"t":"it was lit","fb":"pH 5 → 8 is a 1000-fold difference; pH 4 → 8 is 10 000-fold.","_n":"1gb8d","_k":"3f14bd72"},{"t":"pH 5 is basic","fb":"pH 5 → 8 is a 1000-fold difference; pH 4 → 8 is 10 000-fold.","_n":"1hbfd","_k":"a56c5157"},{"t":"it had less ADP","fb":"pH 5 → 8 is a 1000-fold difference; pH 4 → 8 is 10 000-fold.","_n":"1ibed","_k":"0810a2f9"},{"t":"its gradient was smaller (3 units, not 4)","fb":"pH 5 → 8 is a 1000-fold difference; pH 4 → 8 is 10 000-fold.","_n":"1jbdd","_k":"7073c364"}]},{"id":"q3","goal":5,"prompt":"Which tube is the control for the uncoupler’s effect?","choices":[{"t":"1","fb":"Tube 1 is identical except for the uncoupler.","_n":"1kbcd","_k":"95a4d0e2"},{"t":"2","fb":"Tube 1 is identical except for the uncoupler.","_n":"1lc3d","_k":"7c9b70a1"},{"t":"3","fb":"Tube 1 is identical except for the uncoupler.","_n":"1mc2d","_k":"7097c8f1"},{"t":"5","fb":"Tube 1 is identical except for the uncoupler.","_n":"1nc1d","_k":"a7df38d5"}]},{"id":"q4","goal":[3,5],"prompt":"Thylakoids soaked at pH 8 and moved to pH 4 make…","choices":[{"t":"the same ATP","fb":"The gradient points the wrong way: H⁺ would flow in, not out through ATP synthase.","_n":"1oc2d","_k":"b6837b8f"},{"t":"no ATP","fb":"The gradient points the wrong way: H⁺ would flow in, not out through ATP synthase.","_n":"1pbfd","_k":"a325a32c"},{"t":"ATP only in light","fb":"The gradient points the wrong way: H⁺ would flow in, not out through ATP synthase.","_n":"1qc0d","_k":"40097cb7"},{"t":"twice the ATP","fb":"The gradient points the wrong way: H⁺ would flow in, not out through ATP synthase.","_n":"1rbdd","_k":"62cf7a9f"}]}]}},"practice":{"activities":[{"id":"where","type":"sorter","title":"Where does it happen?","noun":"card","goal":[1,2],"txt":true,"instruction":"Twelve events in the light reactions. Sort each one into the part of the chloroplast where it happens.","boxes":[{"id":"lu","label":"Inside the thylakoid (lumen)"},{"id":"mem","label":"In the thylakoid membrane"},{"id":"st","label":"In the stroma"}],"items":[{"id":"i1","t":"Photosystem II absorbs light","_a":"QF9UCBQ=","why":"Photosystems are protein complexes set in the membrane.","wrong":{"lu":"Photosystems are protein complexes set in the membrane.","st":"Photosystems are protein complexes set in the membrane."}},{"id":"i2","t":"H⁺ builds up to about pH 5","_a":"QF5ERw==","why":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid.","wrong":{"mem":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid.","st":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid."}},{"id":"i3","t":"Water is split, releasing O₂ and H⁺","_a":"QF5ERw==","why":"PSII’s water-splitting site faces the lumen, so the H⁺ is released inside.","wrong":{"mem":"PSII’s water-splitting site faces the lumen, so the H⁺ is released inside.","st":"PSII’s water-splitting site faces the lumen, so the H⁺ is released inside."},"hints":["Where do the H⁺ from water end up?","They add to the gradient.","Lumen."]},{"id":"i4","t":"ATP is formed from ADP and Pᵢ","_a":"QEFFRw==","why":"ATP synthase’s head sits in the stroma.","wrong":{"lu":"ATP synthase’s head sits in the stroma.","mem":"ATP synthase’s head sits in the stroma."},"hints":["Where is the Calvin cycle?","ATP is made where it’s used.","Stroma."]},{"id":"i5","t":"NADPH is formed","_a":"QEFFRw==","why":"NADP⁺ reductase works on the stroma side.","wrong":{"lu":"NADP⁺ reductase works on the stroma side.","mem":"NADP⁺ reductase works on the stroma side."}},{"id":"i6","t":"Plastoquinone carries electrons and H⁺","_a":"QF9UCBQ=","why":"Plastoquinone moves within the membrane.","wrong":{"lu":"Plastoquinone moves within the membrane.","st":"Plastoquinone moves within the membrane."}},{"id":"i7","t":"Plastocyanin carries electrons to PSI","_a":"QF5ERw==","why":"Plastocyanin is a small protein moving in the lumen.","wrong":{"mem":"Plastocyanin is a small protein moving in the lumen.","st":"Plastocyanin is a small protein moving in the lumen."}},{"id":"i8","t":"Ferredoxin carries electrons to NADP⁺ reductase","_a":"QEFFRw==","why":"Ferredoxin works on the stroma side.","wrong":{"lu":"Ferredoxin works on the stroma side.","mem":"Ferredoxin works on the stroma side."}},{"id":"i9","t":"The Calvin cycle uses ATP and NADPH","_a":"QEFFRw==","why":"The Calvin cycle’s enzymes are in the stroma.","wrong":{"lu":"The Calvin cycle’s enzymes are in the stroma.","mem":"The Calvin cycle’s enzymes are in the stroma."}},{"id":"i10","t":"H⁺ flows through ATP synthase’s channel","_a":"QF9UCBQ=","why":"The channel crosses the membrane.","wrong":{"lu":"The channel crosses the membrane.","st":"The channel crosses the membrane."}},{"id":"i11","t":"Cytochrome b₆f moves H⁺ inward","_a":"QF9UCBQ=","why":"It’s a membrane complex acting as a pump.","wrong":{"lu":"It’s a membrane complex acting as a pump.","st":"It’s a membrane complex acting as a pump."}},{"id":"i12","t":"The pH is about 8 in bright light","_a":"QEFFRw==","why":"H⁺ is removed from the stroma, so its pH rises.","wrong":{"lu":"H⁺ is removed from the stroma, so its pH rises.","mem":"H⁺ is removed from the stroma, so its pH rises."}}]},{"id":"calc","type":"custom","title":"Predict and calculate","summary":"Predict and calculate","star":true,"goal":[3,4,5,6],"instruction":"Seven problems on pH ratios, the model’s numbers and blocked or changed parts. Problems 3 to 7 are non-routine; the last two go beyond the Final Check.","how":"","items":[{"id":"r1","kind":"num","goal":3,"prompt":"Lumen pH 5, stroma pH 8. How many times as many H⁺ are in the lumen?","_a":"UwIBVQ==","display":"1000 times as many","unit":"times","wrong":[{"match":3,"fb":"Each unit is ×10."},{"match":30,"fb":"Each unit is ×10."}]},{"id":"r2","kind":"num","goal":3,"prompt":"Lumen pH 6.5, stroma pH 8.5. How many times as many H⁺?","_a":"UwIB","display":"100 times as many","unit":"times","wrong":[{"match":2,"fb":"That’s the pH difference, not the ratio. Each unit is ×10."}]},{"id":"r3","kind":"pair","goal":[2,3],"star":true,"use":"Model values (simulator): 4 electrons per O₂; 2 electrons per NADPH; 8 H⁺ into the lumen per O₂; 4 H⁺ per ATP; each cyclic electron pair moves 2 H⁺.","prompt":"In the model, a membrane releases 2 O₂ per second (noncyclic only). How many NADPH and ATP per second?","_a":"OQYdUWs=","labels":["NADPH per second","ATP per second"],"display":"4 NADPH and 4 ATP per second","wrongFb":"4 electrons per O₂; 2 electrons per NADPH; 8 H⁺ per O₂ and 4 H⁺ per ATP."},{"id":"r4","kind":"num","goal":[3,6],"star":true,"use":"Model values (simulator): 4 electrons per O₂; 2 electrons per NADPH; 8 H⁺ into the lumen per O₂; 4 H⁺ per ATP; each cyclic electron pair moves 2 H⁺.","prompt":"The Calvin cycle fixes 2 CO₂ per second (needs 6 ATP and 4 NADPH). Noncyclic flow supplies 4 NADPH and 4 ATP. How many cyclic electron pairs per second make up the ATP?","_a":"Vg==","display":"4 cyclic pairs per second","unit":"pairs per second","wrong":[{"match":2,"fb":"Each cyclic pair moves 2 H⁺, and 4 H⁺ make 1 ATP: 2 ATP need 8 H⁺ = 4 pairs."}],"hints":["How many extra ATP are needed?","6 − 4 = 2 ATP, which needs 8 H⁺.","8 H⁺ ÷ 2 H⁺ per pair = 4 pairs."]},{"id":"r5","kind":"chips","goal":6,"star":true,"prompt":"A weed’s PSII has a changed binding site, so a PSII-blocking herbicide can’t attach. Sprayed in sunlight, its O₂ release will be…","options":[{"t":"normal but no ATP","why":"If the herbicide can’t bind, the chain runs as usual: this is herbicide resistance.","_n":"1sbed","_k":"614d592b"},{"t":"zero","why":"If the herbicide can’t bind, the chain runs as usual: this is herbicide resistance.","_n":"1tbbd","_k":"2314d3df"},{"t":"doubled","why":"If the herbicide can’t bind, the chain runs as usual: this is herbicide resistance.","_n":"1ubcd","_k":"28854f1b"},{"t":"normal","why":"If the herbicide can’t bind, the chain runs as usual: this is herbicide resistance.","_n":"1vc9d","_k":"8a94e0f2"}]},{"id":"r6","kind":"chips","goal":[4,5],"star":true,"prompt":"Lit thylakoids are given ADP, Pᵢ, an uncoupler and a blue dye that turns colourless when it accepts electrons. Predict both observations.","options":[{"t":"dye turns colourless, ATP made","why":"Electrons still flow (the dye accepts them), but the leak removes the gradient.","_n":"1wcad","_k":"fd7d8cc4"},{"t":"dye turns colourless, no ATP","why":"Electrons still flow (the dye accepts them), but the leak removes the gradient.","_n":"1xc7d","_k":"3666f9c6"},{"t":"dye stays blue, no ATP","why":"Electrons still flow (the dye accepts them), but the leak removes the gradient.","_n":"1yc6d","_k":"ff9a0fe9"},{"t":"dye stays blue, ATP made","why":"Electrons still flow (the dye accepts them), but the leak removes the gradient.","_n":"1zc9d","_k":"288d3a69"}],"hints":["Does the uncoupler touch the electron chain?","No: electrons still reach an acceptor.","Colourless dye, no ATP."]},{"id":"r7","kind":"chips","goal":3,"star":true,"prompt":"If the stroma were pH 7 instead of 8 while the lumen stayed at pH 5, how would the H⁺ ratio change?","options":[{"t":"unchanged","why":"1000-fold becomes 100-fold: one pH unit less of difference.","_n":"20c8d","_k":"a61cacf3"},{"t":"10 times smaller","why":"1000-fold becomes 100-fold: one pH unit less of difference.","_n":"21cbd","_k":"69faa8db"},{"t":"10 times larger","why":"1000-fold becomes 100-fold: one pH unit less of difference.","_n":"22cad","_k":"5dc4f0f4"},{"t":"1 unit smaller","why":"1000-fold becomes 100-fold: one pH unit less of difference.","_n":"23cdd","_k":"860f4f68"}]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Bella","how":"","instruction":"Bella made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain how light leads to ATP in a chloroplast.","steps":["Light excites electrons in photosystem II.","The electrons pass along the chain, and cytochrome b₆f uses their energy to move H⁺ out of the thylakoid into the stroma.","This makes the stroma acidic.","H⁺ flows back through ATP synthase, which makes ATP."],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows from step 2. The mistake is earlier.","Step 4 is fine on its own. Look earlier."],"fixes":[{"t":"Cytochrome b₆f moves H⁺ \u003cstrong>into\u003c/strong> the thylakoid lumen, making the lumen acidic (about pH 5).","why":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid. The lumen becomes acidic (about pH 5); the stroma becomes less acidic (about pH 8).","_n":"24ccd","_k":"76270567"},{"t":"Step 2 is correct.","why":"The lumen, not the stroma, becomes acidic.","_n":"25bfd","_k":"372adb6f"},{"t":"Cytochrome b₆f moves electrons into the stroma.","why":"Electrons stay on the carriers.","_n":"26bed","_k":"230c09db"},{"t":"Cytochrome b₆f makes ATP directly.","why":"ATP synthase is turned by \u003cstrong>H⁺\u003c/strong> flowing down its gradient. Electrons never pass through it.","_n":"273de","_k":"8edd7d77"}],"hints":["Which compartment ends up at pH 5?","The lumen.","H⁺ is moved into the lumen."]},{"id":"e2","goal":4,"task":"Predict the effect of an uncoupler on lit chloroplasts.","steps":["An uncoupler lets H⁺ leak across the thylakoid membrane.","So the H⁺ gradient disappears.","So electrons stop flowing and no O₂ is released.","So no NADPH or ATP is made."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Only O₂ stops.","why":"An uncoupler only lets H⁺ leak back. Electrons still flow, so O₂ and NADPH are still made; only ATP stops.","_n":"283ee","_k":"fba272d1"},{"t":"Electrons still flow from water to NADP⁺, so O₂ and NADPH are still made; only ATP stops.","why":"An uncoupler only lets H⁺ leak back. Electrons still flow, so O₂ and NADPH are still made; only ATP stops.","_n":"293fe","_k":"47b513ac"},{"t":"Electrons flow faster and ATP doubles.","why":"No gradient means no ATP.","_n":"2a40e","_k":"d245b390"},{"t":"Step 3 is correct.","why":"The leak doesn’t block any electron carrier.","_n":"2b39e","_k":"ba0307e7"}],"hints":["Which part does the uncoupler affect?","Only the membrane’s tightness to H⁺.","Only ATP stops."]},{"id":"e3","goal":3,"task":"The lumen is pH 4.5 and the stroma pH 7.5. Compare their H⁺ concentrations.","steps":["The difference is 7.5 − 4.5 = 3 pH units.","Each pH unit is a factor of 10.","So the lumen has 3 × 10 = 30 times as many H⁺.","So the gradient is quite small."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. Look earlier."],"fixes":[{"t":"Multiply three factors of 10: 10 × 10 × 10 = 1000 times as many H⁺.","why":"Each pH unit is a factor of 10. A 3-unit difference is 10 × 10 × 10 = 1000 times.","_n":"2c3ae","_k":"e9d9d56d"},{"t":"7.5 ÷ 4.5 ≈ 1.7 times.","why":"Dividing pH values doesn’t work: the scale is logarithmic.","_n":"2d3be","_k":"d76bacd2"},{"t":"3 + 10 = 13 times.","why":"Factors of 10 multiply.","_n":"2e3ce","_k":"3bfd5722"},{"t":"Step 3 is correct.","why":"Factors of 10 multiply.","_n":"2f45e","_k":"2268d0fe"}],"hints":["One unit is ×10; two units?","×100.","Three units: ×1000."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the simulator: that an uncoupler stops only ATP, or that blocking ATP synthase makes the gradient steeper?"},{"id":"j2","q":"In your own words, explain why the H⁺ gradient is called the ‘middleman’ between electrons and ATP."},{"id":"j3","q":"Explain to a friend how the acid-bath experiment shows light isn’t needed once a gradient exists."},{"id":"j4","q":"Which part of the light reactions is still fuzzy for you? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"During the light reactions, where do H⁺ ions build up?","options":[{"t":"In the cytoplasm outside the chloroplast","why":"The gradient is across the thylakoid membrane.","_n":"2g46e","_k":"1cd18550"},{"t":"In the stroma","why":"The stroma loses H⁺ and rises to about pH 8.","_n":"2h43e","_k":"8c7a218e"},{"t":"In the intermembrane space","why":"That’s a mitochondrial space.","_n":"2i42e","_k":"8529dfde"},{"t":"Inside the thylakoid (the lumen)","why":"H⁺ is pumped in and released there when water splits.","_n":"2j41e","_k":"f9f4e0c9"}]},"b":{"prompt":"Where does a chloroplast’s ATP synthase release the ATP it makes?","options":[{"t":"Into the intermembrane space","why":"That’s in mitochondria.","_n":"2k40e","_k":"8cad5fce"},{"t":"Into the thylakoid membrane","why":"ATP is a soluble molecule released from the head.","_n":"2l3fe","_k":"5b0c8ee6"},{"t":"Into the lumen","why":"The lumen is where H⁺ builds up, not where ATP appears.","_n":"2m3ee","_k":"26a36390"},{"t":"Into the stroma","why":"Its head faces the stroma, beside the Calvin cycle.","_n":"2n3de","_k":"8106c8ad"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which list gives all three products the light reactions send on or release?","options":[{"t":"Glucose and O₂","why":"Glucose comes from the Calvin cycle.","_n":"2o3ce","_k":"d48fe7a8"},{"t":"ATP, NADPH and O₂","why":"ATP and NADPH go on to the Calvin cycle; O₂ is released.","_n":"2p4be","_k":"49564600"},{"t":"ATP, NADPH and CO₂","why":"CO₂ is used by the Calvin cycle; it isn’t made here.","_n":"2q4ae","_k":"9f903815"},{"t":"ATP and O₂ only","why":"NADPH, the electron carrier, is a product too.","_n":"2r8f7","_k":"71ed2ad7"}]},"b":{"prompt":"Which list gives the inputs of the light reactions?","options":[{"t":"Light, CO₂ and ATP","why":"CO₂ goes to the Calvin cycle.","_n":"2s8e7","_k":"c9cd7849"},{"t":"Light, H₂O and CO₂","why":"CO₂ is used in the Calvin cycle, in the stroma. The light reactions make ATP, NADPH and O₂.","_n":"2t917","_k":"8af80ea5"},{"t":"Glucose and O₂","why":"Those are the inputs of cellular respiration.","_n":"2u907","_k":"374fdf79"},{"t":"Light, H₂O, ADP + Pᵢ and NADP⁺","why":"Light and water go in, with ADP + Pᵢ and NADP⁺ returning from the Calvin cycle.","_n":"2v8b7","_k":"8a6a3974"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"What directly turns the rotor of ATP synthase?","options":[{"t":"Light absorbed by ATP synthase","why":"ATP synthase has no pigment.","_n":"2w8a7","_k":"411991f9"},{"t":"H⁺ ions flowing down their gradient, from the lumen to the stroma","why":"The flow of H⁺ through the membrane part turns the rotor, and the turning drives ATP synthesis.","_n":"2x8d7","_k":"a34713dc"},{"t":"H⁺ being pumped into the lumen by ATP synthase","why":"That’s cytochrome b₆f’s job; ATP synthase lets H⁺ out.","_n":"2y8c7","_k":"ee1f2075"},{"t":"Electrons passing through it from PSI","why":"Electrons travel on the carriers, never through ATP synthase.","_n":"2z877","_k":"92f0f0ae"}]},"b":{"prompt":"Which describes the H⁺ flow through a chloroplast’s ATP synthase?","options":[{"t":"From the stroma into the lumen, against the gradient","why":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid. The lumen becomes acidic (about pH 5); the stroma becomes less acidic (about pH 8).","_n":"30867","_k":"28235a8a"},{"t":"From the lumen into the stroma, down the gradient","why":"H⁺ flows from high concentration (the lumen, about pH 5) to low (the stroma, about pH 8).","_n":"31897","_k":"3110fe03"},{"t":"In both directions equally","why":"Net flow is downhill, from high H⁺ to low.","_n":"328a7","_k":"7bb61477"},{"t":"From PSII to PSI","why":"That’s the electron path.","_n":"33877","_k":"3f2c82cc"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"An uncoupler that lets H⁺ leak through the thylakoid membrane is added to lit chloroplasts. Which outcome is expected?","options":[{"t":"O₂, NADPH and ATP all stop","why":"An uncoupler only lets H⁺ leak back. Electrons still flow, so O₂ and NADPH are still made; only ATP stops.","_n":"34887","_k":"efb3843c"},{"t":"O₂ stops, but ATP continues","why":"The leak doesn’t affect water splitting.","_n":"358d7","_k":"24bfda69"},{"t":"NADPH stops, but ATP continues","why":"Without a gradient there’s no ATP.","_n":"368e7","_k":"4bc0e387"},{"t":"ATP production stops, but O₂ and NADPH are still made","why":"The chain still runs; only the gradient is lost.","_n":"378b7","_k":"e8f2c10a"}]},"b":{"prompt":"A herbicide that blocks electrons leaving PSII is added to lit chloroplasts. Which outcome is expected?","options":[{"t":"O₂ continues because water still splits","why":"PSII can’t take new electrons from water if it can’t pass on its own.","_n":"388c7","_k":"c456f6df"},{"t":"O₂, NADPH and ATP from noncyclic flow all stop","why":"No electrons leave PSII, so water isn’t split and nothing downstream runs.","_n":"39817","_k":"57027643"},{"t":"NADPH continues because PSI still absorbs light","why":"PSI has no electrons arriving from PSII to pass on.","_n":"3a827","_k":"f3af987f"},{"t":"Only ATP stops","why":"That’s an uncoupler’s effect.","_n":"3b837","_k":"68d90f71"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"In bright light the lumen is pH 5 and the stroma pH 8. How many times as many H⁺ are in the lumen?","options":[{"t":"3","why":"That’s the pH difference, not the ratio.","_n":"3c827","_k":"8dabfc09"},{"t":"30","why":"Factors of 10 multiply.","_n":"3d817","_k":"a40b5cd5"},{"t":"300","why":"Each pH unit is a factor of 10. A 3-unit difference is 10 × 10 × 10 = 1000 times.","_n":"3e807","_k":"df853ebd"},{"t":"1000","why":"10³: three pH units, each a factor of 10.","_n":"3f7f7","_k":"af6996ce"}]},"b":{"prompt":"In a lab test the lumen is pH 4.5 and the outside buffer pH 7.5. How many times as many H⁺ are inside?","options":[{"t":"1.7","why":"Dividing pH values doesn’t work: the scale is logarithmic.","_n":"3g7e7","_k":"2cb8c13f"},{"t":"3","why":"That’s the pH difference, not the ratio.","_n":"3h7d7","_k":"9fde3d41"},{"t":"30","why":"Factors of 10 multiply.","_n":"3i7c7","_k":"8f0ac7c3"},{"t":"1000","why":"3 units: 10³.","_n":"3j8b7","_k":"956dbfdb"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Thylakoids soaked at pH 4 are moved in the dark to pH 8 with ADP and Pᵢ, and ATP is made. A second batch soaked at pH 4 is moved to pH 4. What happens in the second batch, and what does the pair show?","options":[{"t":"No ATP in either batch, because it’s dark","why":"The first batch did make ATP in the dark.","_n":"3k8a7","_k":"b14e4e76"},{"t":"More ATP, because there are more H⁺ outside","why":"H⁺ has to flow \u003cstrong>out\u003c/strong> through ATP synthase; with no difference there’s no flow.","_n":"3l7d7","_k":"f8ce82a5"},{"t":"No ATP; a pH difference, not light or acid alone, drives ATP synthesis","why":"Both batches were acidic inside, but only the one moved to pH 8 had a difference for H⁺ to flow down.","_n":"3m7e7","_k":"53a7a8ea"},{"t":"The same ATP; any acid makes ATP","why":"Acid alone isn’t enough: with pH 4 inside and out there’s no difference, so no H⁺ flows through ATP synthase.","_n":"3n7f7","_k":"c775c039"}]},"b":{"prompt":"Thylakoids soaked at pH 8 are moved in the dark to pH 4 with ADP and Pᵢ. What happens, and why?","options":[{"t":"ATP is made, because pH 4 is acidic","why":"H⁺ would flow \u003cstrong>into\u003c/strong> the thylakoid, not out through ATP synthase.","_n":"3o807","_k":"ba59dbbb"},{"t":"ATP is made, but only if light is added","why":"Light isn’t the issue; the direction of the gradient is.","_n":"3p797","_k":"ad38f564"},{"t":"ATP is made, because there is a 4-unit difference","why":"H⁺ must flow from the lumen side out through ATP synthase. A gradient pointing the other way makes no ATP.","_n":"3q7a7","_k":"5e86da05"},{"t":"No ATP is made, because the gradient points the wrong way for ATP synthase","why":"H⁺ must flow from the lumen side out through ATP synthase. A gradient pointing the other way makes no ATP.","_n":"3r7b7","_k":"243ef0a6"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the clearest explanation of chemiosmosis in a chloroplast?","options":[{"t":"“Light hits ATP synthase and turns ADP into ATP.”","why":"ATP synthase has no pigment: H⁺ flow, not light, turns it.","_n":"3s7c7","_k":"b01fd101"},{"t":"“Energy from excited electrons moves H⁺ into the thylakoid. The H⁺ can only flow back out through ATP synthase, and that flow powers the joining of ADP and Pᵢ into ATP in the stroma.”","why":"It names the energy source, which way H⁺ moves, the only way back out, and where the ATP is made.","_n":"3t857","_k":"4cd4cb7e"},{"t":"“Electrons flow through ATP synthase into the stroma, making ATP.”","why":"ATP synthase is turned by \u003cstrong>H⁺\u003c/strong> flowing down its gradient. Electrons never pass through it.","_n":"3u867","_k":"f33d697f"},{"t":"“H⁺ is pumped into the stroma and then used to make NADPH.”","why":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid. The lumen becomes acidic (about pH 5); the stroma becomes less acidic (about pH 8).","_n":"3vf76","_k":"0bfacd18"}]},"b":{"prompt":"Which flow chart best shows the energy conversions in the light reactions?","options":[{"t":"Heat → light → ATP","why":"The input is light; some energy is \u003cstrong>lost\u003c/strong> as heat at each step (second law).","_n":"3wf66","_k":"0b29cb14"},{"t":"Light energy → ATP → H⁺ gradient → excited electrons","why":"The order is reversed.","_n":"3xf96","_k":"828c0df8"},{"t":"Light energy → excited electrons → H⁺ gradient → chemical energy in ATP (with NADPH also made)","why":"Each step stores the energy in a new form, with some lost as heat along the way.","_n":"3yf86","_k":"7d9a3f2f"},{"t":"Light energy → glucose → ATP","why":"CO₂ is used in the Calvin cycle, in the stroma. The light reactions make ATP, NADPH and O₂.","_n":"3zfb6","_k":"ac22961d"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which best explains why the lumen’s pH falls in the light?","options":[{"t":"“H⁺ moves from the lumen to the stroma.”","why":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid. The lumen becomes acidic (about pH 5); the stroma becomes less acidic (about pH 8).","_n":"40fa6","_k":"0709a665"},{"t":"“H⁺ is released into the lumen when water is split and is moved in by cytochrome b₆f, while making NADPH removes H⁺ from the stroma.”","why":"Two sources add H⁺ to the lumen, and making NADPH takes it from the stroma: more H⁺ inside means a lower pH.","_n":"41fd6","_k":"3155adb2"},{"t":"“ATP synthase pumps H⁺ into the lumen.”","why":"ATP synthase lets H⁺ out.","_n":"42fc6","_k":"fc4d2485"},{"t":"“O₂ is acidic, and it builds up in the lumen.”","why":"O₂ isn’t an acid; H⁺ sets the pH.","_n":"43ff6","_k":"f56eff25"}]},"b":{"prompt":"Which best explains why blocking ATP synthase makes the lumen even more acidic?","options":[{"t":"“The stroma becomes more acidic instead.”","why":"H⁺ is moved \u003cstrong>into\u003c/strong> the thylakoid. The lumen becomes acidic (about pH 5); the stroma becomes less acidic (about pH 8).","_n":"44fe6","_k":"bba08a6d"},{"t":"“ATP synthase normally adds H⁺ to the lumen.”","why":"ATP synthase is turned by \u003cstrong>H⁺\u003c/strong> flowing down its gradient. Electrons never pass through it.","_n":"45116","_k":"a691c92d"},{"t":"“H⁺ is still being moved in, but its main exit is closed, so it piles up until back-pressure slows electron flow.”","why":"H⁺ keeps arriving but can’t leave through ATP synthase. In the model, the lumen drops one more pH unit and electron flow halves.","_n":"46126","_k":"ee63cbca"},{"t":"“Blocking ATP synthase stops water splitting.”","why":"Water splitting continues, although more slowly.","_n":"470f6","_k":"71b2a827"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Some weedkillers bind to photosystem II. Why does a sprayed weed starve even in full sunlight?","options":[{"t":"The weed’s chlorophyll stops absorbing light","why":"Light is absorbed; the electrons just can’t move on.","_n":"48106","_k":"0b5a5565"},{"t":"No electrons leave PSII, so no ATP or NADPH is made; the Calvin cycle stops and no sugar is produced","why":"Without ATP and NADPH the Calvin cycle can’t fix CO₂, so the weed runs out of sugar.","_n":"490d6","_k":"332eade8"},{"t":"The weed makes too much ATP","why":"No electrons flow, so no extra ATP.","_n":"4a0e6","_k":"48941426"},{"t":"The weed can’t take in water","why":"Water uptake isn’t the target.","_n":"4b0b6","_k":"ce6686d2"}]},"b":{"prompt":"A chemical that makes thylakoid membranes leaky to H⁺ is sprayed on leaves. Why does sugar production stop?","options":[{"t":"No NADPH can be made","why":"Electrons still reach NADP⁺.","_n":"4c0c6","_k":"bf2c0eca"},{"t":"The leaves can’t absorb CO₂","why":"Stomata aren’t affected; the Calvin cycle lacks ATP.","_n":"4d096","_k":"e43fa0e3"},{"t":"The gradient collapses, so no ATP is made; without ATP the Calvin cycle can’t run, even though NADPH is still made","why":"The Calvin cycle needs both ATP and NADPH; the leak removes the gradient that makes ATP.","_n":"4e0a6","_k":"1e48c819"},{"t":"Water can’t be split","why":"An uncoupler only lets H⁺ leak back. Electrons still flow, so O₂ and NADPH are still made; only ATP stops.","_n":"4f0b6","_k":"e20b91be"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Some salt-loving microbes use a light-driven pump to push H⁺ \u003cstrong>out\u003c/strong> of the cell across the cell membrane. Their ATP synthase is in that same membrane. Where is its ATP-making head, and which way do H⁺ ions flow through it?","options":[{"t":"There is no head; light makes ATP directly","why":"Light only powers the pump. ATP synthase still needs H⁺ flowing back through it to make ATP.","_n":"4g0a6","_k":"833475b4"},{"t":"Inside the cell, with H⁺ flowing back into the cell","why":"Same rule: H⁺ is pumped to one side and flows back through ATP synthase, whose head faces the side where ATP is used.","_n":"4h096","_k":"0407604c"},{"t":"Outside the cell, with H⁺ flowing out","why":"H⁺ is already outside; it must flow back in.","_n":"4i086","_k":"b85e4267"},{"t":"Inside the cell, with H⁺ flowing out","why":"That’s against the gradient.","_n":"4j0f6","_k":"5d2f7556"}]},"b":{"prompt":"In a mitochondrion, H⁺ is pumped from the matrix into the intermembrane space. Where is ATP synthase’s head, and which way does H⁺ flow through it?","options":[{"t":"In the matrix, with H⁺ flowing from the intermembrane space into the matrix","why":"H⁺ is pumped out into the intermembrane space and flows back into the matrix, where the head makes ATP: the same rule as in the chloroplast.","_n":"4k0e6","_k":"645d5b7f"},{"t":"In the stroma","why":"That’s a chloroplast space.","_n":"4l0d6","_k":"619b0b3a"},{"t":"In the matrix, with H⁺ flowing into the intermembrane space","why":"That’s uphill.","_n":"4m0c6","_k":"30da58bc"},{"t":"In the intermembrane space, with H⁺ flowing out of the matrix","why":"That’s the pumping direction, not the return.","_n":"4n036","_k":"b576d3d3"}]}}]},"task":{"title":"Balance the budget","summary":"Balance the budget","statement":"\u003cp>The Calvin cycle in a leaf cell will fix \u003ci>t\u003c/i> CO₂ per second, using 3 ATP and 2 NADPH for each CO₂. Design light-reaction settings that supply exactly what it needs, with no waste. Can you find all the answers?\u003c/p>\u003col class=\"lr-tlist\">\u003cli>ATP supply equals ATP demand.\u003c/li>\u003cli>NADPH supply equals NADPH demand.\u003c/li>\u003cli>The thylakoid membrane is sealed (no uncoupler).\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">\u003cspan class=\"bio-model\">Model\u003c/span> As in the simulator’s Energy budget mode: supply ATP = 2\u003ci>L\u003c/i> + \u003ci>c\u003c/i>/2 and NADPH = 2\u003ci>L\u003c/i> (light level \u003ci>L\u003c/i> = 0 to 3, \u003ci>c\u003c/i> cyclic electron pairs per second); demand ATP = 3\u003ci>t\u003c/i> and NADPH = 2\u003ci>t\u003c/i>. The live bars show supply and demand.\u003c/p>","checks":["ATP supply = demand","NADPH supply = demand","Membrane sealed"],"tips":["Each CO₂ needs 3 ATP. Noncyclic flow gives only 2 ATP for every 2 NADPH. Where can extra ATP come from without extra NADPH?","NADPH comes only from noncyclic flow: 2 per light level. Match the light level to the demand.","A leak wastes the gradient, so no ATP is made."],"explainPrompt":"Explain why the light reactions need cyclic electron flow to keep the Calvin cycle running, and how you chose \u003ci>L\u003c/i> and \u003ci>c\u003c/i>.","vocab":"Use the words noncyclic, cyclic, NADPH, ATP and gradient.","more":"There’s more than one answer. Can you find another?","after3":"Every answer has \u003ci>L\u003c/i> = \u003ci>t\u003c/i> and \u003ci>c\u003c/i> = 2\u003ci>t\u003c/i>. Cyclic flow must supply one extra ATP per 2 NADPH, which takes 4 H⁺, or 2 cyclic pairs, for each CO₂."},"cards":[["Light reactions: inputs","Light, H₂O, ADP + Pᵢ, NADP⁺"],["Light reactions: products","O₂ (released), ATP and NADPH (to the Calvin cycle)"],["Where H⁺ builds up","Inside the thylakoid (lumen), about pH 5 in bright light"],["Where ATP and NADPH appear","The stroma, beside the Calvin cycle"],["Two sources of lumen H⁺","Splitting water (photolysis) and pumping by cytochrome b₆f"],["Chemiosmosis","Using the flow of H⁺ down its gradient through ATP synthase to make ATP"],["Photophosphorylation","Making ATP using energy that came from light"],["pH 5 vs pH 8","1000 times as many H⁺ (each pH unit is ×10)"],["Uncoupler","Lets H⁺ leak: electrons, O₂ and NADPH continue; ATP stops"],["PSII-blocking herbicide","Stops electron flow from PSII: no O₂, NADPH or ATP from noncyclic flow"],["Why cyclic flow?","Noncyclic flow gives about 1 ATP per NADPH; the Calvin cycle needs 3 ATP per 2 NADPH"],["Acid-bath experiment","A pH gradient made in the dark is enough to make ATP: evidence for chemiosmosis"]]}};</script>
