.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 33 Restriction Enzymes and Recombinant DNA: sequence view, ring maps, mini-gel, plate, Part 3 stations, task.
   Tokens only. Plasmid backbone --ink; inserted gene --pen; lacZ teal outline (--bio-nadh); marker gene orange outline
   (--bio-atp); recognition sites --hi-soft. Colonies use literal blue and white fills, always with a text label. */
:root{--rz-colb:#2F64C8;--rz-colw:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--rz-colb:#6C9BF0;--rz-colw:#FFFFFF}}
:root[data-theme="dark"]{--rz-colb:#6C9BF0;--rz-colw:#FFFFFF}

/* radio groups (copied from SBI4U 21) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* sequences */
.rz-sq{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-size:.95em;letter-spacing:.02em;white-space:nowrap}
.hero .hero-eq .rz-heq{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.2;font-size:.9em}
.rz-heq .rz-sq{font-size:1em}
.rz-heqn{font-size:.62em;color:var(--ink-2);margin-top:.25em;white-space:normal}
.rz-hero{max-width:460px;margin:0 auto}

/* SVG text and parts */
.rz-svg{display:block;width:100%;height:auto;overflow:visible}
.rz-lab{font:700 12px var(--font-ui);fill:var(--ink)}
.rz-sm{font:400 11px var(--font-ui);fill:var(--ink-2)}
.rz-xs{font:400 10px var(--font-ui);fill:var(--ink-2)}
.rz-b{font-weight:700;fill:var(--ink)}
.rz-end{font:700 13px var(--font-ui);fill:var(--ink)}
.rz-bl{font:700 16px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:var(--ink)}
.rz-bs{font:700 13px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:var(--ink)}
.rz-ovh{fill:var(--pen);text-decoration:underline}
.rz-hl{fill:var(--hi-soft)}
.rz-hb{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:2 2.5;opacity:.7}
.rz-bbl{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.rz-cutl{fill:none;stroke:var(--red);stroke-width:2.2;stroke-dasharray:5 3}
.rz-near{fill:none;stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3;opacity:.6}
.rz-near.on{stroke:var(--red);opacity:1;stroke-width:1.8}
.rz-bb{fill:none;stroke:var(--ink);stroke-width:3}
.rz-f{fill:none;stroke-width:13}
.rz-fin{fill:none;stroke:var(--sheet);stroke-width:8.5}
.rz-f-mk{stroke:var(--bio-atp)}
.rz-f-lac{stroke:var(--bio-nadh)}
.rz-f-ori{stroke:var(--ink-2)}
.rz-fl-mk{fill:var(--bio-atp);font-weight:700}
.rz-fl-lac{fill:var(--bio-nadh);font-weight:700}
.rz-ins{fill:none;stroke:var(--pen);stroke-width:7;stroke-linecap:butt}
.rz-insh{fill:var(--pen)}
.rz-tick{stroke:var(--ink-2);stroke-width:1.6}
.rz-tickhi{stroke:var(--ink);stroke-width:2.6}
.rz-tickbad{stroke:var(--red)}
.rz-arc{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.rz-arcsel{stroke:var(--hi);stroke-width:8}
.rz-arcok{stroke:var(--pen)}
.rz-lin{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.rz-tag{fill:var(--ink)}
.rz-tagt{fill:var(--sheet);font-weight:700}
.rz-don{stroke-width:3}
.rz-gene{fill:var(--pen)}
.rz-brk{fill:none;stroke:var(--pen);stroke-width:1.6}
/* mini-gel */
.rz-gel{fill:var(--paper);stroke:var(--rule);stroke-width:1.2}
.rz-well{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.rz-band{fill:var(--ink)}
.rz-band.rz-lad{fill:var(--ink-2)}
.rz-band.rz-bhi{fill:var(--pen)}
.rz-gelsvg{max-width:340px}
/* plate */
.rz-dish{fill:none;stroke:var(--ink-2);stroke-width:2}
.rz-agar{fill:var(--paper);stroke:var(--rule);stroke-width:1}
.rz-colb{fill:var(--rz-colb);stroke:var(--ink);stroke-width:1}
.rz-colw{fill:var(--rz-colw);stroke:var(--ink-2);stroke-width:1.5}
.rz-colhi{fill:none;stroke:var(--hi);stroke-width:3}

/* Explore layout */
.rz-row{margin:6px 0}
.rz-btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.rz-nearb{margin-top:4px}
.rz-nearb[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.rz-cap{margin:8px 0 0;font-size:.92rem;color:var(--ink-2);min-height:1.3em}
.rz-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:8px;padding:6px 4px;background:var(--sheet)}
.rz-seqsvg{min-width:640px}
.rz-steps{margin:0;padding-left:1.3em;display:grid;gap:8px}
.rz-steps li{padding-left:2px}
.rz-steps li::marker{font-weight:700;color:var(--ink-2)}
.rz-bgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.rz-bcell{min-width:0}
.rz-ringsvg{max-width:300px;margin:0 auto}
.rz-donsvg{max-width:380px}
.rz-platesvg{max-width:200px;margin:0 auto}
.rz-platebox p{margin:4px 0 0;text-align:center}
.rz-h{margin:6px 0 2px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.rz-note{margin-top:10px}
@media (max-width:640px){.rz-bgrid{grid-template-columns:1fr}}

/* Part 3 */
.rz-sth{margin:14px 0 4px;font-size:1.05rem}
.rz-sl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:8px 0}
.rz-sl input[type=range]{flex:1 1 180px;min-width:160px;accent-color:var(--ink)}
.rz-count{font-weight:700;margin:6px 0}
.rz-s1svg{max-width:560px}
.rz-s2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media (max-width:640px){.rz-s2{grid-template-columns:1fr}}
.rz-ovw{position:relative;max-width:340px;margin:0 auto}
.rz-ovl{position:absolute;inset:0;pointer-events:none}
.rz-ob{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;min-width:32px;min-height:32px;border-radius:999px;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);font:700 .9rem var(--font-ui);padding:0 6px}
.rz-ob.sel{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.rz-ob.ok{border-color:var(--green);color:var(--green)}
.rz-ob.rz-obb{min-width:56px;width:15%;min-height:24px;height:24px;border-radius:6px;background:transparent;border-style:dashed;border-color:var(--ink-2)}
.rz-ob.rz-obb.ok{border-style:solid;border-color:var(--green)}
.rz-ob:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

/* practice */
.rz-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rz-chips .chip{text-align:left}
.rz-chips .chip.good{border-color:var(--green);background:var(--good-bg)}
.rz-chips .chip.bad{border-color:var(--red);background:var(--bad-bg)}
.rz-seqin{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;text-transform:uppercase;max-width:9em}
.rz-listin{max-width:16em}
.rz-unit{margin-left:6px}

/* task */
.rz-conds{margin:8px 0 0 1.2em;padding:0}
.rz-maps p{margin:6px 0}
.rz-tpv .rz-ringsvg{max-width:260px}

ug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"65fc2d2f","content":{"id":"33-restriction-enzymes-and-recombinant-dna","kind":"topic","title":"Restriction enzymes and recombinant DNA","topic":"Restriction Enzymes and Recombinant DNA","readyTopic":"restriction enzymes and recombinant DNA","hero":{"eq":"\u003cspan class=\"rz-heq\">\u003cspan class=\"rz-sq\">5′-G↓AATTC-3′\u003c/span>\u003cspan class=\"rz-sq\">3′-CTTAA↑G-5′\u003c/span>\u003cspan class=\"rz-heqn\">→ two sticky ends, each with a 5′-AATT overhang\u003c/span>\u003c/span>","eqLabel":"The EcoRI site: top strand 5′ G, cut, A A T T C 3′; bottom strand 3′ C T T A A, cut, G 5′. The cut leaves two sticky ends, each with a 5′ AATT overhang.","eqSize":"sm","headline":"Cut here, paste there","text":"Bacteria make \u003cstrong>restriction enzymes\u003c/strong> that cut DNA at one exact, short sequence. Cut a \u003cstrong>plasmid\u003c/strong> and a \u003cstrong>gene\u003c/strong> with the same enzyme and their \u003cstrong>sticky ends\u003c/strong> match. \u003cstrong>DNA ligase\u003c/strong> seals them into \u003cstrong>recombinant DNA\u003c/strong>, and bacteria then copy it, and make its protein, every time they divide.","fig":{"html":"\u003cdiv class=\"rz-hero\" id=\"rz-hero\" role=\"img\" aria-label=\"A 12-base-pair double strand slides in and the six bases GAATTC light up on both strands. A zigzag cut runs between G and A on each strand, and the halves pull apart to show AATT overhangs. A plasmid ring opened at the same site appears, and a blue gene fragment with matching ends drifts into the gap. The overhangs pair with dotted hydrogen bonds, a ligase tag passes over and the backbone gaps turn solid. The ring closes, labelled recombinant plasmid.\">\u003c/div>"}},"goals":["I can explain what a restriction enzyme does, what makes its recognition site palindromic, and how it leaves sticky or blunt ends.","I can find recognition sites in a sequence and predict the number of fragments and the type of ends a cut makes.","I can explain why the plasmid and the gene are cut with the same enzyme(s), and how ligase joins them into recombinant DNA.","I can describe how recombinant plasmids get into bacteria, and how selection and blue–white screening identify the cells I want.","I can predict fragment sizes for single and double digests of circular and linear DNA, and read a restriction map from gel bands.","I can describe uses of recombinant DNA, such as insulin and GFP, and evaluate one of its benefits or limits."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Complementary strands","goal":2,"prompt":"A top strand reads \u003cspan class=\"rz-sq\">5′-ATGCCT-3′\u003c/span>. Write the bottom strand 5′ → 3′.","options":[{"t":"\u003cspan class=\"rz-sq\">5′-TACGGA-3′\u003c/span>","why":"TACGGA is the bottom strand read 3′ → 5′.","_n":"06ad","_k":"7e5a0944"},{"t":"\u003cspan class=\"rz-sq\">5′-AGGCAT-3′\u003c/span>","why":"Complement each base, then read the partner strand from its own 5′ end.","_n":"16dd","_k":"8cc5ef1f"},{"t":"\u003cspan class=\"rz-sq\">5′-TCCGTA-3′\u003c/span>","why":"Each base must pair: A with T, G with C.","_n":"26cd","_k":"f5cf83c4"},{"t":"\u003cspan class=\"rz-sq\">5′-UACGGA-3′\u003c/span>","why":"DNA uses T, not U.","_n":"367d","_k":"5b97006d"}],"hints":["The strands are antiparallel.","The complement, read 3′ → 5′, is TACGGA.","Read it backwards from its 5′ end: AGGCAT."]},{"id":"w2","skill":"Complementary strands","goal":1,"prompt":"Which base pair is held by three hydrogen bonds?","options":[{"t":"G–C","why":"G–C has three; A–T has two.","_n":"466d","_k":"b34dbff4"},{"t":"A–U","why":"U is found in RNA, not in a DNA double strand.","_n":"569d","_k":"0a461e9d"},{"t":"A–T","why":"A–T has two hydrogen bonds.","_n":"668d","_k":"26c9996b"},{"t":"G–A","why":"G pairs with C, not with A.","_n":"773d","_k":"99066dd2"}],"hints":["Which pair is harder to separate?","G–C regions need more heat to separate.","G–C: three."]},{"id":"w3","skill":"Biotech tools","goal":3,"prompt":"What does DNA ligase do?","options":[{"t":"Joins DNA pieces by sealing the sugar–phosphate backbone","why":"It makes covalent bonds between neighbouring nucleotides.","_n":"872d","_k":"6084da2b"},{"t":"Separates fragments by size","why":"That’s what a gel does.","_n":"9534","_k":"a6b77322"},{"t":"Cuts DNA at a specific sequence","why":"Cutting is the restriction enzyme’s job.","_n":"a544","_k":"72c87d45"},{"t":"Makes copies of a DNA sequence","why":"Copying is done by DNA polymerase.","_n":"b554","_k":"f4fe035f"}],"hints":["“Liga-” as in ligament: it ties things.","It works after cutting.","It seals the backbone."]},{"id":"w4","skill":"Biotech tools","goal":4,"prompt":"What is a plasmid?","options":[{"t":"A ring of RNA that carries amino acids","why":"Plasmids are DNA.","_n":"c564","_k":"ab3bdcf1"},{"t":"A linear chromosome found in human cells","why":"Plasmids are rings found mainly in bacteria.","_n":"d4f4","_k":"ed84b6bd"},{"t":"A small, circular piece of DNA in a bacterium, separate from its main chromosome, that is copied on its own","why":"Small, circular, and copied on its own.","_n":"e504","_k":"70f527fa"},{"t":"The bacterium’s main, circular chromosome","why":"Plasmids are extra, smaller rings.","_n":"f514","_k":"3bcc5817"}],"hints":["Think “extra DNA ring”.","It is separate from the chromosome.","Small, circular, copied on its own."]},{"id":"w5","skill":"Gel electrophoresis","goal":5,"prompt":"Fragments of 300, 1200, 2500 and 4000 bp are run on a gel. Which travels farthest from the wells?","options":[{"t":"They all travel the same distance","why":"All DNA has the same charge per base pair, so size decides the distance.","_n":"g524","_k":"eab063a1"},{"t":"300 bp","why":"Small pieces slip through the gel fastest.","_n":"h4b4","_k":"5fd43602"},{"t":"It depends on how many A and G bases each has","why":"Size, not base sequence, sets the distance.","_n":"i4c4","_k":"59b40575"},{"t":"4000 bp","why":"Big pieces move slowest.","_n":"jc54","_k":"fabf9f45"}],"hints":["The gel is a mesh.","Which piece gets through a mesh fastest?","The smallest: 300 bp."]},{"id":"w6","skill":"The \u003ci>lac\u003c/i> operon","goal":4,"prompt":"In \u003ci>E. coli\u003c/i>, what does \u003ci>lacZ\u003c/i> code for?","options":[{"t":"β-galactosidase, the enzyme that breaks down lactose","why":"\u003ci>lacZ\u003c/i> is the first of the three structural genes.","_n":"kc44","_k":"7b5500aa"},{"t":"The \u003ci>lac\u003c/i> repressor","why":"That’s \u003ci>lacI\u003c/i>.","_n":"lc74","_k":"60454485"},{"t":"The permease that brings lactose into the cell","why":"That’s \u003ci>lacY\u003c/i>.","_n":"mc64","_k":"f1b70535"},{"t":"The operator","why":"The operator is a stretch of DNA, not a protein.","_n":"nc14","_k":"12498965"}],"hints":["Z, Y, A are the three structural genes.","\u003ci>lacZ\u003c/i> comes first.","β-galactosidase."]}],"refreshers":{"Complementary strands":"A pairs with T, G with C, and the strands run in opposite directions. To write the partner strand 5′ → 3′, complement every base, then reverse the order.","Biotech tools":"A restriction enzyme cuts, ligase joins, polymerase copies, a gel sorts by size, and a plasmid is a small DNA ring that bacteria copy on their own.","Gel electrophoresis":"DNA is negative, so it moves toward the positive end; smaller fragments move farther.","The \u003ci>lac\u003c/i> operon":"\u003ci>lacZ\u003c/i> codes for β-galactosidase. If something is inserted into the middle of \u003ci>lacZ\u003c/i>, the enzyme isn’t made."}}},"explore":{"heading":"Cut-and-paste lab","intro":"Scan DNA for recognition sites and cut it. Then build a recombinant plasmid and see what grows.","seq":"ATGAATTCGCGGATCCTTCCCGGGATGAATTGCAAGAATTCTGA","near":"GAATTG","model":"This is a model. Real plates show a few unexpected colonies.","safety":"All sequences, plasmids and maps here are made up for teaching.","markerJob":"lets only cells carrying the plasmid grow on the selection plate","why":{"bw":"White: insulin sequence inside \u003ci>lacZ\u003c/i>. Blue: plasmid closed on itself.","ligOff":"Nothing sealed the backbone, so the plasmid stayed open.","noMatch":"The donor’s ends don’t match the plasmid’s {p} ends; the plasmid closed on itself.","bam":"White colonies carry pieces of DNA, but BamHI cut the insulin sequence in two: the gene isn’t complete.","hind":"White colonies carry pieces of DNA, but HindIII cuts the donor only at 1600, on one side of the gene: no piece holds the whole gene between two HindIII ends.","pst":"PstI also cuts inside the marker gene, so cells can’t grow on the selection plate.","blunt":"Blunt plasmid ends can’t pair with sticky donor ends; the plasmid rejoined itself.","noDonor":"SmaI has no site in the donor DNA, so no donor piece is freed; the plasmid closed on itself.","uncut":"An uncut plasmid has nowhere for the gene to go."},"aha":"A match between ends decides everything. Both the plasmid and the gene must be cut by the same enzyme(s), in the right places, and the selection plate and the \u003ci>lacZ\u003c/i> colour reveal which cells got what.","predIntro":"Make a prediction first. Then the lab will show you what really happens.","predictions":[{"id":"p1","prompt":"Mode A, EcoRI selected. EcoRI cuts G↓AATTC on both strands. What will the cut ends look like?","options":[{"t":"Blunt ends","_n":"oc04","_k":"8737c85d"},{"t":"Overhangs of GAATTC","_n":"pc34","_k":"97bc3e35"},{"t":"Single-stranded overhangs of AATT","_n":"qc24","_k":"b74ec0d2"},{"t":"Overhangs of a single base","_n":"rcd4","_k":"7ddcc9dc"}],"explain":"The cut is between G and A on each strand, which is staggered by 4 bases, so each end keeps a 4-base single strand. The site reads GAATTC 5′ → 3′ on both strands."},{"id":"p2","prompt":"A ring plasmid with 3 EcoRI sites. How many pieces does EcoRI make?","options":[{"t":"2","_n":"scc4","_k":"70c9cd7a"},{"t":"3","_n":"tbf4","_k":"3d5b6268"},{"t":"4","_n":"uc04","_k":"f29b31eb"},{"t":"6","_n":"vbd4","_k":"2289d71b"}],"explain":"A circle cut 3 times gives 3 pieces. A line cut 3 times would give 4."},{"id":"p3","prompt":"Mode B: plasmid with EcoRI, donor with HindIII, ligase on. What grows on the plate?","options":[{"t":"No colonies","_n":"wbe4","_k":"040f3047"},{"t":"Blue and white colonies","_n":"xc34","_k":"c7b75c1d"},{"t":"Only blue colonies","_n":"yc44","_k":"07c05f28"},{"t":"Only white colonies","_n":"zc14","_k":"edf53a81"}],"explain":"AATT ends can’t pair with AGCT ends, so the insulin piece can’t join, and the plasmid closes on itself with \u003ci>lacZ\u003c/i> intact."},{"id":"p4","prompt":"Mode B: the working recipe (EcoRI on both, ligase on). What colour will colonies carrying the insulin insert be?","options":[{"t":"Blue","_n":"10c24","_k":"4be42729"},{"t":"White","_n":"11c74","_k":"beb6a9ba"},{"t":"They won’t grow","_n":"12c84","_k":"cbf6e0bd"},{"t":"Green","_n":"13c13","_k":"ff0fd550"}],"explain":"The insert interrupts \u003ci>lacZ\u003c/i>, so no β-galactosidase is made and X-gal stays colourless."}],"chalIntro":"Use the lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,5],"prompt":"Mode A: cut sequence S into exactly 3 pieces using one enzyme.","why":"EcoRI has 2 sites in S, and a line cut twice gives 3 pieces.","general":"A line cut \u003ci>n\u003c/i> times gives \u003ci>n\u003c/i> + 1 pieces.","msgs":{"cut":"In Mode A, choose one enzyme and press Cut.","one":"One site cuts a line into 2 pieces.","none":"No site in S, so nothing is cut.","near":"GAATTG isn’t GAATTC. An enzyme recognizes one exact short sequence. GAATTG isn’t GAATTC, so EcoRI ignores it."},"hints":["A line cut \u003ci>n\u003c/i> times gives \u003ci>n\u003c/i> + 1 pieces.","You need an enzyme with exactly 2 sites.","EcoRI has 2 sites in S."]},{"id":"tc2","goal":3,"prompt":"Mode B: get white colonies that carry the \u003cstrong>complete\u003c/strong> insulin coding sequence.","why":"EcoRI cuts the plasmid once inside \u003ci>lacZ\u003c/i> and the donor at 700 and 1250, on both sides of the gene. The AATT ends match, and ligase seals them.","general":"Which enzyme frees the whole gene with ends that match the plasmid’s?","msgs":{"bam":"White colonies, but BamHI cut the gene in two.","ends":"The ends don’t match. Overhangs join only if their bases are complementary. EcoRI’s AATT can’t pair with BamHI’s GATC.","lig":"Nothing sealed the backbone.","pst":"It also cuts the marker gene."},"hints":["Which enzyme cuts on \u003cstrong>both\u003c/strong> sides of the insulin sequence without cutting inside it?","EcoRI cuts the donor at 700 and 1250; the gene runs from 800 to 1130.","EcoRI on both, ligase on."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Mode C: in the model, an EcoRI insert can go in either way round. A white colony’s plasmid, cut with BamHI, gives bands at \u003cstrong>320 bp\u003c/strong> and \u003cstrong>5230 bp\u003c/strong>. Set the orientation toggle so the model’s gel matches.","why":"The recombinant plasmid is 5000 + 550 = 5550 bp. The plasmid’s own BamHI site sits 20 bp past the right-hand EcoRI junction. The insert’s BamHI site is 300 bp from its left end and 250 bp from its right end. \u003cstrong>Forward:\u003c/strong> the insert’s site is 250 + 20 = 270 bp from the plasmid’s site, giving 270 + 5280. \u003cstrong>Reversed:\u003c/strong> it is 300 + 20 = 320 bp away, giving 320 + 5230.","general":"Compare the model’s BamHI bands with 320 and 5230.","msgs":{"fwd":"Forward gives 270 and 5280.","eco":"EcoRI cuts out the whole 550 bp insert either way round, so it can’t show orientation.","mode":"Open Mode C (plate a run that gives white colonies first), then set the orientation toggle.","other":"The bands come from a BamHI digest: choose BamHI for the gel."},"hints":["The two BamHI sites, one in the insert and one in the plasmid, give two fragments. The short one is the distance between them.","Measure from the insert’s BamHI site to the right-hand junction, then add 20.","320 = 300 + 20, so the 300 bp side faces the plasmid’s BamHI site: reversed."]}]},"part3":{"slug":"maps","name":"Maps","heading":"Restriction maps","intro":"Restriction maps are how scientists check what they built. At each station, go from a map to a gel and back. The \u003cstrong>Check it with data\u003c/strong> panel runs each digest on a mini-gel.","panel":"Check it with data","s1":{"t":"Rings vs lines","text":"The same sites drawn on a 6000 bp ring and on a 6000 bp line. Move the slider to change the number of sites; both molecules are cut at every site.","sites":[800,2000,3500,5000]},"s2":{"t":"Single and double digests","text":"Plasmid pMAP (made up, ring, 6000 bp) has EcoRI sites at 1000 and 3500 and a BamHI site at 2000. Choose a digest. Tap a fragment’s arc on the ring, then tap the band it makes.","rule":"Every digest’s fragments add up to 6000."},"s3":{"t":"Work backwards","text":"A 5000 bp plasmid gives one 5000 bp band with EcoRI alone, one 5000 bp band with HindIII alone, and bands at 1200 and 3800 with both. The EcoRI site is at 0 (the top). Place the HindIII site on the ring, then press Check.","good":"Gels give distances, not directions. A third enzyme would settle it.","more":"Both placements work. Can you find the other one?"},"blocks":[{"title":"A Canadian connection","html":"\u003cp>Michael Smith, at the University of British Columbia, found a way to change a DNA sequence at one chosen spot (site-directed mutagenesis). His work on changing DNA sequences earned a share of the 1993 Nobel Prize in Chemistry.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Restriction maps quick check","items":[{"id":"q1","goal":5,"prompt":"A 4000 bp \u003cstrong>ring\u003c/strong> is cut at 500 and 1500. Fragments?","choices":[{"t":"500, 1000 and 2500","fb":"A ring cut twice gives two pieces: 1500 − 500 = 1000, and 4000 − 1000 = 3000. A circle cut \u003ci>n\u003c/i> times gives \u003ci>n\u003c/i> pieces. Only a line gives \u003ci>n\u003c/i> + 1.","_n":"14c03","_k":"e5393b7e"},{"t":"500 and 1500","fb":"A ring cut twice gives two pieces: 1500 − 500 = 1000, and 4000 − 1000 = 3000.","_n":"15bf3","_k":"49556386"},{"t":"1000 and 3000","fb":"Right. A ring cut twice gives two pieces: 1500 − 500 = 1000, and 4000 − 1000 = 3000.","_n":"16be3","_k":"30be72dd"},{"t":"4000","fb":"A ring cut twice gives two pieces: 1500 − 500 = 1000, and 4000 − 1000 = 3000.","_n":"17c53","_k":"a8b498f0"}]},{"id":"q2","goal":5,"prompt":"A 4000 bp \u003cstrong>line\u003c/strong> is cut at 500 and 1500. Fragments?","choices":[{"t":"1000 and 2500","fb":"A line cut twice gives three pieces, from each end to each cut.","_n":"18c43","_k":"f77246de"},{"t":"500 and 1500","fb":"A line cut twice gives three pieces, from each end to each cut.","_n":"19c33","_k":"e95e4b3c"},{"t":"500, 1000 and 2500","fb":"Right. A line cut twice gives three pieces, from each end to each cut.","_n":"1ac23","_k":"46d51cb2"},{"t":"1000 and 3000","fb":"A line cut twice gives three pieces, from each end to each cut.","_n":"1bc93","_k":"3145aef1"}]},{"id":"q3","goal":5,"prompt":"Fragments of 1000 and 3000 bp are run on a gel. Which band is closer to the wells?","choices":[{"t":"3000 bp","fb":"Right. Large fragments move slowest, so they stay near the wells.","_n":"1cc83","_k":"fb407ed6"},{"t":"1000 bp","fb":"Large fragments move slowest, so they stay near the wells.","_n":"1dbb3","_k":"9d418aa7"},{"t":"They run together","fb":"Large fragments move slowest, so they stay near the wells.","_n":"1ebc3","_k":"8c5e8033"},{"t":"Neither moves","fb":"Large fragments move slowest, so they stay near the wells.","_n":"1fbd3","_k":"717ffb73"}]},{"id":"q4","goal":5,"prompt":"A plasmid cut with BamHI gives a single band at its full length, 5000 bp. How many BamHI sites does it have?","choices":[{"t":"0","fb":"One cut opens the ring into one 5000 bp line. Two sites would give two bands, unless the pieces were the same size.","_n":"1gbe3","_k":"f1d02acf"},{"t":"1","fb":"Right. One cut opens the ring into one 5000 bp line.","_n":"1hbf3","_k":"c49a1cf4"},{"t":"2","fb":"One cut opens the ring into one 5000 bp line. Two sites would give two bands, unless the pieces were the same size.","_n":"1ic03","_k":"3efcdf3b"},{"t":"5","fb":"One cut opens the ring into one 5000 bp line. Two sites would give two bands, unless the pieces were the same size.","_n":"1jc13","_k":"926bef61"}]}]}},"practice":{"activities":[{"id":"cuts","type":"custom","title":"Cut, ends and joins","summary":"Cut, ends and joins","goal":[1,2,3,4,6],"how":"","instruction":"Eight quick-fire items. Tap a chip, or type your answer and press Check. Item 6 is an investigation item; item 7 is about insulin in society.","items":[{"id":"c1","kind":"num","goal":2,"prompt":"How many EcoRI sites are in \u003cspan class=\"rz-sq\">5′-TTGAATTCAGGATCCTTGAATTGCAGAATTCTA-3′\u003c/span>?","_a":"BA==","display":"2","unit":"sites","wrong":[{"match":3,"fb":"GAATTG isn’t a site. An enzyme recognizes one exact short sequence. GAATTG isn’t GAATTC, so EcoRI ignores it."}]},{"id":"c2","kind":"seq","goal":1,"prompt":"Which overhang does BamHI (G↓GATCC) leave? Type the bases.","_a":"FHInN3FG","display":"\u003cspan class=\"rz-sq\">GATC\u003c/span>","wrong":[{"match":"GGATCC","fb":"The overhang is the part between the two staggered cuts."}]},{"id":"c3","kind":"chips","goal":3,"prompt":"Can an EcoRI end be joined directly to a BamHI end?","choices":[{"t":"Yes","fb":"AATT and GATC aren’t complementary. Overhangs join only if their bases are complementary. EcoRI’s AATT can’t pair with BamHI’s GATC.","_n":"1kc23","_k":"8f9bfa97"},{"t":"No","fb":"AATT and GATC aren’t complementary.","_n":"1lc33","_k":"0240bb6e"}]},{"id":"c4","kind":"chips","goal":3,"prompt":"Can two blunt SmaI ends be joined by ligase?","choices":[{"t":"Yes","fb":"Ligase can seal any two blunt ends; there is no overhang to match, so it is just less efficient.","_n":"1mc43","_k":"4c8dcbb0"},{"t":"No","fb":"Ligase can seal any two blunt ends; there is no overhang to match, so it is just less efficient.","_n":"1n4d4","_k":"97a68ab8"}]},{"id":"c5","kind":"num","goal":2,"prompt":"On average, how often does a particular 6-base sequence occur in random DNA? Once every ___ bp.","_a":"AgVfVQ==","display":"4096","unit":"bp","wrong":[{"match":1296,"fb":"There are 4 bases, so 4⁶ = 4096, not 6⁴."},{"match":24,"fb":"4 × 6 counts choices, not combinations."}],"hints":["Each position has 4 possible bases.","For 6 positions: 4 × 4 × 4 × 4 × 4 × 4.","4⁶ = 4096."]},{"id":"c6","kind":"chips","goal":4,"prompt":"One plate is spread with bacteria that were given \u003cstrong>no\u003c/strong> plasmid. What is it for?","choices":[{"t":"To grow extra insulin-making bacteria","fb":"It isn’t for making insulin. It shows that growth on the other plates is due to the plasmid.","_n":"1o4c4","_k":"23beafae"},{"t":"A control: no colonies should grow, which shows the selection plate stops cells without the plasmid","fb":"It shows that growth on the other plates is due to the plasmid.","_n":"1p4f4","_k":"55fcca8f"},{"t":"To find out which colonies are white","fb":"It isn’t for screening colonies. It shows that growth on the other plates is due to the plasmid.","_n":"1q4e4","_k":"d69f3816"}]},{"id":"c7","kind":"chips","goal":6,"prompt":"Recombinant human insulin replaced insulin purified from animal pancreases. Which is the fairest evaluation?","choices":[{"t":"It cures diabetes, so the switch solved the problem completely","fb":"It doesn’t cure diabetes.","_n":"1r514","_k":"3a3c10ca"},{"t":"Animal insulin had no drawbacks, so nothing was gained","fb":"Animal insulin worked for many people, but supply and slight differences from human insulin were limits.","_n":"1s504","_k":"5ca4714e"},{"t":"It matches human insulin exactly and can be made in large amounts; cost and access to medicine are still issues","fb":"A fair evaluation weighs a benefit against a limit that remains.","_n":"1t534","_k":"2033bcad"}]},{"id":"c8","kind":"chips","goal":[3,6],"prompt":"Why is the insulin gene copied from mRNA (cDNA) before it goes into bacteria?","choices":[{"t":"Bacteria can’t remove introns; mRNA has none","fb":"Human genes contain introns, and bacteria can’t remove them. The gene is copied from mRNA (cDNA), which has no introns.","_n":"1u524","_k":"27b34bd9"},{"t":"Bacteria can’t read human DNA","fb":"Bacteria can read human DNA (the genetic code is shared); introns are the problem.","_n":"1v454","_k":"0da7e711"},{"t":"mRNA is easier to cut with restriction enzymes","fb":"Restriction enzymes cut double-stranded DNA; introns are the problem.","_n":"1w444","_k":"f9690589"}],"hints":["What does the spliceosome do in our cells?","Bacteria have no spliceosome.","Use a copy of the mature mRNA: cDNA."]}]},{"id":"maps","type":"custom","title":"Map detective","summary":"Map detective","star":true,"goal":[2,5],"how":"","instruction":"Six map puzzles. Items 3 to 6 are non-routine (★); the last two go beyond the Final Check. For a list, type the sizes in any order, separated by commas.","items":[{"id":"r1","kind":"num","goal":5,"prompt":"A 3000 bp ring has EcoRI sites at 400 and 1900. How many \u003cstrong>bands\u003c/strong> appear on the gel?","_a":"Bw==","display":"1","unit":"band(s)","wrong":[{"match":2,"fb":"Both fragments are 1500 bp, so they run together as one band."}]},{"id":"r2","kind":"num","goal":5,"prompt":"The same sites on a 3000 bp \u003cstrong>line\u003c/strong>: list the fragments.","_a":"bQFWUx5VA1YGGVdWAlRv","display":"400, 1100 and 1500 bp","unit":"bp","wrong":[{"match":[1500,1500],"fb":"That’s the ring answer. A circle cut \u003ci>n\u003c/i> times gives \u003ci>n\u003c/i> pieces. Only a line gives \u003ci>n\u003c/i> + 1."}]},{"id":"r3","kind":"num","goal":5,"star":true,"prompt":"A 5000 bp plasmid gives one 5000 bp band with EcoRI, one with BamHI, and 800 + 4200 with both. How far apart are the two sites (the shorter way round)?","_a":"DgVW","display":"800 bp","unit":"bp","wrong":[{"match":4200,"fb":"That’s the longer way round."}]},{"id":"r4","kind":"chips","goal":5,"star":true,"prompt":"A 4000 bp plasmid: HindIII gives 1500 + 2500; EcoRI gives one 4000 band; both give 500 + 1000 + 2500. Where is the EcoRI site?","choices":[{"t":"Inside the 2500 bp HindIII fragment","fb":"Inside the 2500 piece would split 2500, not 1500.","_n":"1x474","_k":"1b147dd5"},{"t":"Inside the 1500 bp HindIII fragment, 500 bp from one HindIII site","fb":"1500 is replaced by 500 + 1000.","_n":"1y484","_k":"2e31a998"},{"t":"Exactly on a HindIII site","fb":"Then the double digest would look like HindIII alone: 1500 + 2500.","_n":"1z454","_k":"0a1a057d"}],"hints":["Which HindIII fragment disappears in the double digest?","1500 is replaced by 500 + 1000.","EcoRI lies inside the 1500 bp piece, 500 bp from one end."]},{"id":"r5","kind":"num","goal":[3,5],"star":true,"prompt":"A 750 bp EcoRI fragment is inserted into a 4000 bp plasmid cut once with EcoRI. Sizes of the recombinant, and of the bands after cutting it with EcoRI?","parts":[{"id":"a","label":"Recombinant","unit":"bp","_a":"AgJTUw==","wrong":[{"match":4000,"fb":"The insert adds its length."}]},{"id":"b","label":"EcoRI bands","unit":"bp","_a":"bQFWUwJIBVMGaA==","wrong":[{"match":[4000],"fb":"The insert adds its length; cutting with EcoRI frees it again."},{"match":[4750],"fb":"EcoRI cuts at both junctions."}]}],"display":"4750 bp; bands at 4000 and 750 bp"},{"id":"r6","kind":"num","goal":5,"star":true,"prompt":"A 4000 bp plasmid has its EcoRI cloning site at 1000 and a BamHI site at 1100. A 600 bp insert has a BamHI site 150 bp from its left end. If the insert is \u003cstrong>forward\u003c/strong>, what are the two BamHI fragments?","_a":"bQBTUx5QAlMGaA==","display":"550 and 4050 bp","unit":"bp","wrong":[{"match":[250,4350],"fb":"That’s the reversed orientation."}],"hints":["The recombinant is 4600 bp; the plasmid’s BamHI site moves to 1700.","Forward: the insert’s BamHI site is at 1000 + 150 = 1150.","1700 − 1150 = 550; 4600 − 550 = 4050."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Selin","how":"","instruction":"Selin made one mistake in each piece of work. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":5,"task":"A 6000 bp plasmid has EcoRI sites at 1000, 2500 and 4500. Predict the fragments.","steps":["The plasmid is a circle.","There are three sites, so EcoRI cuts it three times.","Three cuts make four pieces: 0–1000, 1000–2500, 2500–4500 and 4500–6000.","So the fragments are 1000, 1500, 2000 and 1500 bp."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Four pieces, but all 1500 bp.","why":"That doesn’t add to 6000 in the right places.","_n":"20464","_k":"826195e9"},{"t":"Step 3 is correct.","why":"0 and 6000 are the same point on a ring.","_n":"21434","_k":"7433f97d"},{"t":"Three cuts in a circle make three pieces: 1500, 2000 and 2500 bp (from 4500 round to 1000).","why":"A circle cut \u003ci>n\u003c/i> times gives \u003ci>n\u003c/i> pieces. Only a line gives \u003ci>n\u003c/i> + 1.","_n":"22444","_k":"a8d41c26"},{"t":"Two pieces, because the ring must be opened first.","why":"Every cut counts.","_n":"23414","_k":"a8335215"}],"hints":["Is there an end at 0 on a ring?","No: 4500 to 1000 is one piece.","1500, 2000, 2500."]},{"id":"e2","goal":3,"task":"Plan how to insert the insulin coding sequence into pLAB.","steps":["Cut pLAB with EcoRI; it cuts once, inside \u003ci>lacZ\u003c/i>.","Cut the donor DNA with HindIII to free the gene.","Mix the pieces and add DNA ligase.","Transform bacteria and grow them on the selection plate with X-gal.","Pick white colonies."],"_a":"Bw==","stepFb":["Step 1 is correct.","","Step 3 is fine on its own; the problem comes earlier.","This step is fine.","This step is fine."],"fixes":[{"t":"Cut the plasmid with HindIII as well.","why":"pLAB’s HindIII site would match, but HindIII cuts the donor only at 1600, on one side of the gene.","_n":"24424","_k":"d2a1f179"},{"t":"Cut the donor with EcoRI too: it cuts at 700 and 1250, on both sides of the gene, and its ends match the plasmid’s.","why":"Overhangs join only if their bases are complementary. EcoRI’s AATT can’t pair with BamHI’s GATC.","_n":"254f4","_k":"6da1a51f"},{"t":"Add more ligase.","why":"No amount of ligase joins AATT to AGCT.","_n":"26504","_k":"2cc54d7e"},{"t":"Step 2 is correct.","why":"HindIII ends can’t pair with EcoRI ends.","_n":"27c95","_k":"e15f7af7"}],"hints":["Do the plasmid’s ends and the gene fragment’s ends match?","Which enzyme cuts on both sides of the gene?","EcoRI on both."]},{"id":"e3","goal":4,"task":"Explain the plate: 70 blue and 30 white colonies grew on the selection plate with X-gal.","steps":["Only bacteria carrying the plasmid grow here, because the plasmid has the marker gene.","The cloning site is inside \u003ci>lacZ\u003c/i>.","Blue colonies make β-galactosidase, so their \u003ci>lacZ\u003c/i> is intact: no insert.","White colonies don’t have a plasmid.","So we keep the blue colonies."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows step 4. The mistake is earlier."],"fixes":[{"t":"White colonies are dead.","why":"Dead cells don’t form colonies.","_n":"28c85","_k":"a5dc7001"},{"t":"Step 4 is correct.","why":"Step 1 says every colony here has a plasmid.","_n":"29c75","_k":"b515d2b3"},{"t":"White colonies have two plasmids.","why":"One insert is enough to break \u003ci>lacZ\u003c/i>.","_n":"2ac65","_k":"5a926a6e"},{"t":"White colonies have a plasmid whose \u003ci>lacZ\u003c/i> was broken by the insert: these 30 are the recombinant ones to keep.","why":"On the selection plate every colony has a plasmid. White means the insert broke \u003ci>lacZ\u003c/i>; blue means the plasmid closed with no insert.","_n":"2bc55","_k":"0dd193fd"}],"hints":["Look back at step 1.","Every colony on this plate has a plasmid.","White = insert inside \u003ci>lacZ\u003c/i>."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the cut-and-paste lab: the plate that grew only blue colonies, or the plate with no colonies at all?"},{"id":"j2","q":"In your own words, why must the plasmid and the gene be cut with the same enzyme(s)?"},{"id":"j3","q":"Explain to a friend how blue–white screening tells you which colonies carry the gene."},{"id":"j4","q":"Which part of restriction mapping still trips you up (rings vs lines, or working backwards)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which top-strand sequence (5′ → 3′) is a palindromic recognition site?","options":[{"t":"\u003cspan class=\"rz-sq\">GGATCG\u003c/span>","why":"Close, but the partner strand reads CGATCC.","_n":"2cc45","_k":"ff621d02"},{"t":"\u003cspan class=\"rz-sq\">TTTTTT\u003c/span>","why":"Repetition isn’t the rule; the partner strand reads AAAAAA.","_n":"2dc35","_k":"f411b7d6"},{"t":"\u003cspan class=\"rz-sq\">GATTAG\u003c/span>","why":"It reads the same backwards on one strand, but its partner strand reads CTAATC.","_n":"2ec25","_k":"87fde186"},{"t":"\u003cspan class=\"rz-sq\">GGATCC\u003c/span>","why":"Its partner strand, read 5′ → 3′, is also GGATCC.","_n":"2fd15","_k":"8cd8f740"}]},"b":{"prompt":"Which top-strand sequence (5′ → 3′) is a palindromic recognition site?","options":[{"t":"\u003cspan class=\"rz-sq\">AAGCTA\u003c/span>","why":"Close, but the partner strand reads TAGCTT.","_n":"2gd05","_k":"79e2c93b"},{"t":"\u003cspan class=\"rz-sq\">AAGGAA\u003c/span>","why":"Its partner strand reads TTCCTT.","_n":"2hc35","_k":"efe1ab7a"},{"t":"\u003cspan class=\"rz-sq\">GGGGGG\u003c/span>","why":"Its partner strand reads CCCCCC.","_n":"2ic45","_k":"142feb30"},{"t":"\u003cspan class=\"rz-sq\">AAGCTT\u003c/span>","why":"Its partner strand, read 5′ → 3′, is also AAGCTT.","_n":"2jc55","_k":"06331d45"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"What does DNA ligase do when a gene is joined to a plasmid?","options":[{"t":"It cuts the plasmid at its recognition site","why":"That’s the restriction enzyme.","_n":"2kc65","_k":"58ff06a4"},{"t":"It makes many copies of the gene","why":"That’s PCR, or the bacteria dividing.","_n":"2lbf5","_k":"9767c0d8"},{"t":"It forms covalent bonds that seal the sugar–phosphate backbone between the gene and the plasmid","why":"The overhangs pair on their own by hydrogen bonds; ligase makes the covalent backbone bonds that lock the pieces together.","_n":"2mc05","_k":"3a33261b"},{"t":"It pairs the overhanging bases with hydrogen bonds","why":"The overhangs pair on their own.","_n":"2nc15","_k":"1a429cd2"}]},"b":{"prompt":"Two complementary sticky ends line up. What holds them together at first, and what does ligase add?","options":[{"t":"Covalent bonds between the bases; ligase adds hydrogen bonds","why":"That’s backwards.","_n":"2oc25","_k":"c9412dc4"},{"t":"Hydrogen bonds between the overhang bases; ligase adds covalent backbone bonds","why":"The overhangs pair on their own by hydrogen bonds; ligase makes the covalent backbone bonds that lock the pieces together.","_n":"2pcb5","_k":"a2a1e68c"},{"t":"Nothing holds them; ligase pairs the bases","why":"The overhangs pair on their own by hydrogen bonds; ligase makes the covalent backbone bonds that lock the pieces together.","_n":"2qcc5","_k":"927adb6f"},{"t":"Ligase holds them, and polymerase seals the backbone","why":"Polymerase builds new strands; ligase seals gaps.","_n":"2r3cb","_k":"c334eb6d"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"On a selection plate with X-gal, a colony is \u003cstrong>white\u003c/strong>. What does that tell you?","options":[{"t":"Its \u003ci>lacZ\u003c/i> is working","why":"A working \u003ci>lacZ\u003c/i> turns X-gal blue.","_n":"2s3db","_k":"78cd5293"},{"t":"It has the insert, in the correct orientation","why":"White shows an insert, not which way round it is.","_n":"2t3eb","_k":"ba635789"},{"t":"It has a plasmid with an insert that broke \u003ci>lacZ\u003c/i>","why":"On the selection plate every colony has a plasmid. White means the insert broke \u003ci>lacZ\u003c/i>; blue means the plasmid closed with no insert.","_n":"2u3fb","_k":"a1f06778"},{"t":"It has no plasmid","why":"Without the plasmid it couldn’t grow on this plate.","_n":"2v38b","_k":"62331a86"}]},"b":{"prompt":"On a selection plate with X-gal, a colony is \u003cstrong>blue\u003c/strong>. What does that tell you?","options":[{"t":"It has the recombinant plasmid","why":"The insert would break \u003ci>lacZ\u003c/i>.","_n":"2w39b","_k":"3de7e68e"},{"t":"It has the plasmid, but no insert: \u003ci>lacZ\u003c/i> is intact","why":"On the selection plate every colony has a plasmid. White means the insert broke \u003ci>lacZ\u003c/i>; blue means the plasmid closed with no insert.","_n":"2x3ab","_k":"31e606c6"},{"t":"It has the insert in reverse","why":"Either orientation breaks \u003ci>lacZ\u003c/i>.","_n":"2y3bb","_k":"3d69cddb"},{"t":"It has no plasmid","why":"Without the plasmid it couldn’t grow here.","_n":"2z44b","_k":"b3797e97"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"\u003cspan class=\"rz-sq\">5′-TTGAATTCAGGATCCTTGAATTGCAGAATTCTA-3′\u003c/span> is a linear piece of DNA. It is cut with EcoRI (GAATTC) and BamHI (GGATCC) together. How many fragments are made?","options":[{"t":"2","why":"That counts only the BamHI cut.","_n":"3045b","_k":"873ffe07"},{"t":"3","why":"3 cuts in a ring would give 3; this is a line.","_n":"3142b","_k":"aae98c49"},{"t":"4","why":"2 EcoRI sites + 1 BamHI site = 3 cuts; a line cut 3 times gives 4 pieces.","_n":"3241b","_k":"e4821546"},{"t":"5","why":"GAATTG isn’t an EcoRI site.","_n":"3340b","_k":"fc212499"}]},"b":{"prompt":"\u003cspan class=\"rz-sq\">5′-GCAAGCTTGACCCGGGTAAGCTACTAAGCTTAG-3′\u003c/span> is a linear piece of DNA. It is cut with HindIII (AAGCTT) and SmaI (CCCGGG) together. How many fragments are made?","options":[{"t":"2","why":"That counts only the SmaI cut.","_n":"343fb","_k":"7d9426d5"},{"t":"3","why":"A circle cut \u003ci>n\u003c/i> times gives \u003ci>n\u003c/i> pieces. Only a line gives \u003ci>n\u003c/i> + 1.","_n":"353eb","_k":"3c02216f"},{"t":"4","why":"2 HindIII sites + 1 SmaI site = 3 cuts; a line cut 3 times gives 4 pieces.","_n":"363db","_k":"96aa26f6"},{"t":"5","why":"AAGCTA isn’t a HindIII site.","_n":"373cb","_k":"b81d20cf"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A 5000 bp plasmid has EcoRI sites at 1000 and 3000 and a BamHI site at 4000. What fragments come from cutting with both?","options":[{"t":"1000, 2000 and 2000 bp","why":"Cuts at 1000, 3000 and 4000 on a ring: 2000, 1000, and 4000 round to 1000 = 2000.","_n":"383bb","_k":"d49dc18a"},{"t":"1000, 3000 and 4000 bp","why":"Those are the site positions, not the fragment sizes.","_n":"394ab","_k":"0800e046"},{"t":"1000, 1000, 1000 and 2000 bp","why":"That treats the ring as a line.","_n":"3a49b","_k":"dc5365c6"},{"t":"2000 and 3000 bp","why":"That’s EcoRI alone.","_n":"3b48c","_k":"24d6ef27"}]},"b":{"prompt":"A 6000 bp plasmid has HindIII sites at 500 and 2500 and a BamHI site at 4000. What fragments come from cutting with both?","options":[{"t":"2000 and 4000 bp","why":"That’s HindIII alone.","_n":"3c49c","_k":"24a3b0e7"},{"t":"500, 2500 and 4000 bp","why":"Those are positions.","_n":"3d46c","_k":"c96e2467"},{"t":"500, 1500, 2000 and 2000 bp","why":"That treats the ring as a line. A circle cut \u003ci>n\u003c/i> times gives \u003ci>n\u003c/i> pieces. Only a line gives \u003ci>n\u003c/i> + 1.","_n":"3e47c","_k":"a6da9dff"},{"t":"1500, 2000 and 2500 bp","why":"Cuts at 500, 2500 and 4000: 2000, 1500, and 4000 round to 500 = 2500.","_n":"3f4cc","_k":"57485017"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"In a donor DNA, the GFP gene has an EcoRI site just to its left and a HindIII site just to its right, and no sites inside. The plasmid’s cloning region has one EcoRI and one HindIII site. Which plan inserts GFP in one fixed orientation?","options":[{"t":"Cut both with EcoRI and HindIII, and skip ligase because the ends match","why":"Matching ends still need ligase to seal them.","_n":"3g4dc","_k":"c75e71e6"},{"t":"Cut both the donor and the plasmid with EcoRI and HindIII, then add ligase","why":"Different ends on each side can only pair one way.","_n":"3h4ac","_k":"51215c13"},{"t":"Cut both with EcoRI only, then add ligase","why":"EcoRI cuts the donor on one side only, so the gene isn’t freed.","_n":"3i4bc","_k":"2a0dcfee"},{"t":"Cut the plasmid with EcoRI and the donor with HindIII, then add ligase","why":"The ends don’t match.","_n":"3j40c","_k":"8fea2747"}]},"b":{"prompt":"The GFP gene has a BamHI site just to its left and a HindIII site just to its right, and no sites inside. The plasmid’s cloning region has one BamHI and one HindIII site. Which plan inserts GFP in one fixed orientation?","options":[{"t":"Cut both with both enzymes and skip ligase","why":"Matching ends still need ligase to seal them. The overhangs pair on their own by hydrogen bonds; ligase makes the covalent backbone bonds that lock the pieces together.","_n":"3k41c","_k":"1983f8e7"},{"t":"Cut the plasmid with BamHI and the donor with HindIII","why":"The ends don’t match. Overhangs join only if their bases are complementary. EcoRI’s AATT can’t pair with BamHI’s GATC.","_n":"3lcec","_k":"d1aa3685"},{"t":"Cut both with BamHI only, then add ligase","why":"BamHI cuts on one side only.","_n":"3mcdc","_k":"f015cf6d"},{"t":"Cut both the donor and the plasmid with BamHI and HindIII, then add ligase","why":"Different ends on each side can only pair one way.","_n":"3nd0c","_k":"58187088"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why a bacterium’s restriction enzymes don’t destroy its own DNA?","options":[{"t":"“Restriction enzymes only cut RNA.”","why":"They cut double-stranded DNA.","_n":"3ocfc","_k":"e1975209"},{"t":"“Bacterial DNA has no recognition sites.”","why":"Sites occur about every 4096 bp by chance; bacterial DNA has many.","_n":"3pcac","_k":"e470512d"},{"t":"“The enzymes are kept outside the cell.”","why":"They work inside the cell, where incoming DNA arrives.","_n":"3qc9c","_k":"cff1602c"},{"t":"“The bacterium adds methyl groups to the recognition sites in its own DNA, so its enzymes don’t cut there; DNA entering from bacteriophages lacks these marks and is cut.”","why":"Methyl marks protect the cell’s own sites.","_n":"3rccc","_k":"71bf8b56"}]},"b":{"prompt":"Which is the best explanation of the term “sticky ends”?","options":[{"t":"“The flat ends left by SmaI.”","why":"Those are blunt ends.","_n":"3scbc","_k":"e8200ff9"},{"t":"“Ends that can pair with any other cut end.”","why":"Overhangs join only if their bases are complementary. EcoRI’s AATT can’t pair with BamHI’s GATC.","_n":"3tc6c","_k":"02e57e72"},{"t":"“Short single-stranded overhangs whose bases can pair with a complementary overhang, holding two fragments together until ligase seals them.”","why":"The “stickiness” is base pairing.","_n":"3uc5c","_k":"933cedd7"},{"t":"“Ends coated with proteins that act like glue.”","why":"The “stickiness” is base pairing.","_n":"3vc4b","_k":"bd65ebe9"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which flow chart shows the steps for making bacteria that carry the insulin gene?","options":[{"t":"Cut → ligase → transform → plate → pick blue","why":"On the selection plate every colony has a plasmid. White means the insert broke \u003ci>lacZ\u003c/i>; blue means the plasmid closed with no insert.","_n":"3wc5b","_k":"f532d759"},{"t":"Cut the plasmid and the gene with the same enzyme → mix and add ligase → transform bacteria → grow them on the selection plate with X-gal → pick white colonies","why":"Cut, then seal, then transform, then select and screen: white colonies carry the insert.","_n":"3xc6b","_k":"3ddf3386"},{"t":"Add ligase → cut the plasmid and the gene → transform → plate → pick white","why":"Ligase joins pieces that already exist; cut first.","_n":"3yc7b","_k":"c15ba2c1"},{"t":"Cut → transform → add ligase → plate → pick white","why":"The plasmid must be sealed before it goes into the cells.","_n":"3zc8b","_k":"98687841"}]},"b":{"prompt":"Which flow chart shows the steps for making bacteria that carry the GFP gene?","options":[{"t":"Cut the plasmid and the GFP gene with the same enzymes → mix and add ligase → transform bacteria → grow them on the selection plate with X-gal → pick white colonies","why":"Cut, then seal, then transform, then select and screen: white colonies carry the insert.","_n":"40c9b","_k":"c11a5d60"},{"t":"Cut → ligase → plate → transform → pick white","why":"Plating comes after the cells take in the plasmid.","_n":"41cab","_k":"056c8646"},{"t":"Transform → cut → ligase → plate → pick white","why":"The bacteria need the finished recombinant plasmid.","_n":"42cbb","_k":"42692c72"},{"t":"Cut → ligase → transform → plate → pick blue","why":"On the selection plate every colony has a plasmid. White means the insert broke \u003ci>lacZ\u003c/i>; blue means the plasmid closed with no insert.","_n":"43bcb","_k":"c4d4d96d"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A team inserts the human insulin gene, copied straight from chromosomal DNA, into \u003ci>E. coli\u003c/i>, and expects working insulin. What is the most likely result, and the fix?","options":[{"t":"It works, because bacteria remove introns the way human cells do","why":"Human genes contain introns, and bacteria can’t remove them. The gene is copied from mRNA (cDNA), which has no introns.","_n":"44bdb","_k":"4e6bf499"},{"t":"Nothing is made, because bacteria can’t read human DNA","why":"The genetic code is shared; introns are the problem.","_n":"45cab","_k":"be2d702a"},{"t":"The protein will be wrong, because bacteria can’t remove introns; use a copy made from mRNA (cDNA)","why":"Human genes contain introns, and bacteria can’t remove them. The gene is copied from mRNA (cDNA), which has no introns.","_n":"46c9b","_k":"6a7595e6"},{"t":"It works, provided a blunt-cutting enzyme is used","why":"The cutting enzyme doesn’t affect introns.","_n":"47c8b","_k":"843d3809"}]},"b":{"prompt":"Why do scientists copy the insulin gene from mRNA (as cDNA) before putting it into \u003ci>E. coli\u003c/i>?","options":[{"t":"mRNA is double-stranded and easier to cut","why":"mRNA is single-stranded; cDNA is made from it.","_n":"48c7b","_k":"0e63e445"},{"t":"Chromosomal DNA has no promoter","why":"The issue is introns, not promoters.","_n":"49ceb","_k":"e30afc52"},{"t":"Mature mRNA has no introns, and bacteria can’t remove introns themselves","why":"Human genes contain introns, and bacteria can’t remove them. The gene is copied from mRNA (cDNA), which has no introns.","_n":"4acdb","_k":"dba4aed4"},{"t":"Bacteria can only read RNA, not DNA","why":"Bacteria transcribe DNA, as our cells do.","_n":"4bccb","_k":"fbbc1c0f"}]}},{"id":"a2","cat":"A","goal":[ nzymes are different.\u003c/li>\u003c/ol>","checks":["Each cuts pLAB once, in \u003ci>lacZ\u003c/i>","No cut inside GFP","Cuts on both sides","Two different enzymes"],"tips":["PstI also cuts pLAB at 1500, inside the marker gene; cells couldn’t grow on the selection plate.","SmaI cuts the donor at 1400, inside GFP.","You need one cut left of 1000 and one right of 1720.","One enzyme alone lets the gene go in either way round, and lets the plasmid close on itself."],"explainPrompt":"Explain why your enzyme pair gives the gene only one way to fit, and why each rejected enzyme fails.","vocab":"Use the words recognition site, sticky end, orientation, marker gene and \u003ci>lacZ\u003c/i>.","success":"Your pair inserts GFP one way round!","more":"Can you find every pair that works?","after3":"HindIII cuts the donor twice (900 and 1800), but both cuts are outside GFP, so the gene stays whole. What matters is where the cuts are, not how many there are."},"cards":[["Restriction enzyme","Cuts double-stranded DNA at one specific short sequence (usually 4–8 bp). Made by bacteria as a defence against bacteriophages."],["Recognition site","The exact sequence an enzyme cuts, e.g. EcoRI: \u003cspan class=\"rz-sq\">5′-GAATTC-3′\u003c/span>."],["Palindromic site","Reads the same 5′ → 3′ on both strands: GAATTC pairs with GAATTC."],["Sticky ends","Staggered cuts leave single-stranded overhangs (EcoRI: AATT) that pair with complementary overhangs."],["Blunt ends","A straight cut with no overhang (SmaI: CCC↓GGG)."],["DNA ligase","Seals the sugar–phosphate backbone with covalent bonds after the overhangs pair."],["Vector","DNA that carries a gene into a cell; often a plasmid."],["Recombinant DNA","DNA joined from two sources, e.g. pLAB + the insulin coding sequence."],["Selection","A marker gene on the plasmid lets only cells carrying the plasmid grow on the selection plate."],["Blue–white screening","Insert inside \u003ci>lacZ\u003c/i> → no β-galactosidase → white colony (recombinant). B
