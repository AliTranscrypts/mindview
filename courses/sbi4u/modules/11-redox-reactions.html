.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 11: hero (glucose → CO₂, O₂ → H₂O), tug-of-war (bond tug, molecules with carbon scores, ladder), electron flow (S2),
   energy drop (S3), reaction-type stations, fuel practice, Electron drop task.
   Roles (course plan §3): electrons --bio-e, H⁺ --bio-h, carbon and carbon compounds --bio-carbon, O₂ / H₂O / oxygen atoms
   --bio-o2 (blue), NADH --bio-nadh (Part 3 station 1 only), ATP --bio-atp. Partial charges in --ink. The fire icon is --ink-2. */

/* radio groups (from SBI4U 05 / 03 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* hero reaction with its two arcs */
.rx-heq{display:inline-block;position:relative;max-width:100%;vertical-align:top}
.rx-heq-row{display:block;white-space:nowrap}
.rx-heq-arcs{display:block;width:100%;height:56px;overflow:visible;margin-top:.2em}
.rx-arc{fill:none;stroke-width:2.2;stroke-linecap:round}
.rx-arc-c{stroke:var(--bio-carbon)}
.rx-arc-o{stroke:var(--bio-o2)}
.rx-arc.rx-ah{stroke-linejoin:round}
.rx-heqt{font:700 13px var(--font-ui);fill:var(--ink)}
@media (max-width:560px){ .hero .hero-eq.sm .rx-heq{font-size:min(1em,6.3vw)} }
.rx-hero svg{display:block;width:100%;height:auto}

/* centrepiece */
.rx-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.rx-stage svg{display:block;width:100%;height:auto}
.rx-stage + .rx-stage{margin-top:8px}
#rx-en{margin-top:8px}
.rx-cap{margin:8px 0 4px;font-size:.92rem;min-height:2.6em}
.rx-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.rx-legend span{display:inline-flex;align-items:center;gap:5px}
.rx-legend svg{width:14px;height:14px;flex:none}
.rx-fs{border:0;margin:0;padding:0;min-width:0;display:grid;gap:12px}
.rx-fs:disabled{opacity:.7}
.rx-row{min-width:0}
.rx-row > .rg-lab{display:block;margin-bottom:4px}
.rx-chips{display:flex;flex-wrap:wrap;gap:6px}
.rx-chip{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.9rem;min-height:34px}
.rx-chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rx-chip:disabled{opacity:.55}
.rx-rule{margin:0}
.rx-eqline{margin:0 0 8px;font-size:1.12rem;font-weight:700}
.rx-eqline .rx-eqa,.rx-eqline .rx-eqb{white-space:nowrap}
.rx-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.rx-card{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;display:grid;gap:8px;min-width:0}
.rx-card-h{margin:0}
.rx-card .rg-wrap{gap:4px 8px}
.rx-read .rx-narrow{display:none}
.rx-rnote{margin:8px 0 0}
.rx-model{margin-top:18px}
.rx-rules{margin:10px 0 8px;padding-left:1.2em;display:grid;gap:6px}
.rx-extra{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 24px;margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
.rx-extra[hidden]{display:none}
.rx-box h4{margin:0 0 6px;font-size:.98rem}
.rx-box .tiny{margin:0 0 4px}
.rx-frule{margin:0 0 8px;font-size:.95rem}
.rx-ft{border-collapse:collapse;width:100%}
.rx-ft th,.rx-ft td{padding:4px 6px;text-align:left;border-bottom:1px solid var(--rule);font-size:.92rem;vertical-align:middle}
.rx-ft .numin{width:6em;font-size:1.05rem;padding:.3em .5em}
.rx-box .rx-row{margin-top:10px}
@media (max-width:820px){ .rx-extra{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){
  .rx-stage .rx-sub{font-size:12.5px}
  .rx-stage .rx-bubt-s{font-size:10px}
  .rx-read .rx-wide{display:none}
  .rx-read .rx-narrow{display:inline}
  .rx-eqline .rx-eqa,.rx-eqline .rx-eqb{display:block}
}

/* SVG: atoms, bonds, electrons, labels */
.rx-lab{font:700 13px var(--font-ui);fill:var(--ink)}
.rx-lab-l{font-size:15px}
.rx-lab-e{fill:var(--bio-e)}
.rx-sub{font:600 11px var(--font-ui);fill:var(--ink-2)}
.rx-a{stroke-width:1.6}
.rx-aC{fill:var(--bio-carbon);stroke:var(--bio-carbon)}
.rx-aO{fill:var(--bio-o2);stroke:var(--bio-o2)}
.rx-aH{fill:var(--sheet);stroke:var(--ink)}
.rx-aW .rx-aH{fill:var(--bio-o2);stroke:var(--bio-o2)}
.rx-at{font-family:var(--font-ui);font-weight:700;fill:var(--sheet)}
.rx-atH{fill:var(--ink)}
.rx-aW .rx-atH{fill:var(--sheet)}
.rx-bond{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}
.rx-bond-m{stroke-width:2.2}
.rx-mid{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3}
.rx-e{fill:var(--bio-e)}
.rx-hp{fill:var(--bio-h)}
.rx-hpt{font-family:var(--font-ui);font-weight:700;fill:var(--sheet)}
.rx-delta{font:italic 700 18px var(--font-math);fill:var(--ink)}
.rx-delta-s{font-size:14px}
.rx-tug{stroke:var(--ink);stroke-width:2;fill:none}
.rx-tug.rx-ah{fill:none;stroke-linejoin:round}
.rx-ah{fill:none;stroke-linejoin:round}
.rx-divide{stroke:var(--rule);stroke-width:1.2;stroke-dasharray:4 4}
.rx-axis{stroke:var(--ink-2);stroke-width:1.6;fill:none}
.rx-tick{stroke:var(--ink-2);stroke-width:1.4}
.rx-mark{fill:var(--hi);stroke:var(--ink);stroke-width:1.4}
.rx-mark2{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.rx-bub{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.rx-bubt{font:700 11.5px var(--font-ui);fill:var(--ink)}
.rx-bubt-s{font-size:9px}
.rx-lead{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 2}
.rx-brk{fill:none;stroke:var(--ink);stroke-width:1.6}
.rx-brkt{font:700 11.5px var(--font-ui);fill:var(--bio-e)}
.rx-pill{stroke:none}
.rx-pt{font:700 13px var(--font-ui);fill:var(--sheet)}
.rx-pt-s{font-size:11px}
.rx-pt-l{font-size:15px}
.rx-guide{fill:none;stroke:var(--bio-e);stroke-width:1.6;stroke-dasharray:5 4;opacity:.85}
.rx-guide.rx-ah{stroke-dasharray:none}
.rx-ghost{fill:none;stroke:var(--rule);stroke-width:2;stroke-dasharray:4 4}
.rx-drop{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.rx-ball{fill:var(--ink-2)}
.rx-flame{fill:var(--ink-2);opacity:.85}
.rx-glow{fill:var(--hi);fill-opacity:.5}
.rx-hlab{font-size:14px}
.rx-ring{fill:color-mix(in srgb,var(--bio-carbon) 18%,var(--sheet));stroke:var(--bio-carbon);stroke-width:2.6;stroke-linejoin:round}

/* Part 3 */
.rx-st{margin-top:10px}
.rx-st .rx-stage{max-width:640px}
.rx-st-eq{margin:0 0 8px;font-weight:700;font-size:1.05rem}
.rx-zoom{margin-top:12px}
.rx-zoom p{margin:8px 0 2px}
.rx-key{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.rx-key h4{margin:0 0 6px}

/* practice */
.rx-arule{margin:0 0 6px;padding:10px 12px;border-left:4px solid var(--rule);background:var(--info-bg);border-radius:4px;font-size:.95rem}
.rx-unit{color:var(--ink-2);font-weight:700}
.rx-r7{display:flex;flex-wrap:wrap;gap:0 18px}

/* task */
.rx-qt{border-collapse:collapse;margin:8px 0}
.rx-qt th,.rx-qt td{padding:4px 10px;border-bottom:1px solid var(--rule);text-align:left;font-size:.95rem}
.rx-qt td:last-child{text-align:center;font-weight:700}
.rx-reqs{margin:8px 0;padding-left:1.3em;display:grid;gap:4px}
.rx-tin{display:grid;gap:12px;margin:10px 0}
.rx-lvl{stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:4 3}
.rx-lvl.on{stroke:var(--ink);stroke-width:3;stroke-dasharray:none}
.rx-dropa{stroke:var(--ink);stroke-width:2.6;fill:none}
.rx-upa{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 4;fill:none}
.rx-upa.rx-ah{stroke-dasharray:none}

</style>

<script>window.MV_PAYLOAD={"meta":{"id":"11-redox-reactions","nn":"11","slug":"redox-reactions","course":"sbi4u","site":"sbi4u","code":"SBI4U","kind":"topic","groupLabel":"Unit 2","groupName":"Cellular Respiration","trivium":"","size":"S","storageKey":"sbi4u-11-redox-reactions-v1","progressKey":"sbi4u-progress-v1:11-redox-reactions","toolkit":"1.0.7"},"course":{"course":"sbi4u","site":"sbi4u","code":"SBI4U","title":"Biology","modules":[{"nn":"01","slug":"leaf-structure","title":"Leaf Structure","kind":"topic","group":"1"},{"nn":"02","slug":"light-and-pigments","title":"Light and Photosynthetic Pigments","kind":"topic","group":"1"},{"nn":"03","slug":"chlorophyll-and-chloroplasts","title":"Chlorophyll and Chloroplasts","kind":"topic","group":"1"},{"nn":"04","slug":"overview-of-photosynthesis","title":"Overview of Photosynthesis","kind":"topic","group":"1"},{"nn":"05","slug":"noncyclic-electron-flow","title":"Noncyclic Electron Flow","kind":"topic","group":"1"},{"nn":"06","slug":"light-reactions","title":"Light Reactions","kind":"topic","group":"1"},{"nn":"07","slug":"stomata","title":"Stomata Opening and Closing","kind":"topic","group":"1"},{"nn":"08","slug":"the-calvin-cycle","title":"The Calvin Cycle","kind":"topic","group":"1"},{"nn":"09","slug":"c3-c4-cam","title":"C3, C4 and CAM Photosynthesis and Photorespiration","kind":"topic","group":"1"},{"nn":"10","slug":"introduction-to-metabolism","title":"Introduction to Metabolism","kind":"topic","group":"2"},{"nn":"11","slug":"redox-reactions","title":"Redox Reactions","kind":"topic","group":"2"},{"nn":"12","slug":"nad-and-fad","title":"NAD⁺ and FAD","kind":"topic","group":"2"},{"nn":"13","slug":"overview-of-cellular-respiration","title":"Overview of Cellular Respiration","kind":"topic","group":"2"},{"nn":"14","slug":"glycolysis","title":"Glycolysis","kind":"topic","group":"2"},{"nn":"15","slug":"krebs-cycle","title":"Krebs Cycle","kind":"topic","group":"2"},{"nn":"16","slug":"electron-transport-chain","title":"The Electron Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"cad8df65","content":{"id":"11-redox-reactions","kind":"topic","title":"Redox reactions","topic":"Redox Reactions","readyTopic":"redox reactions","hero":{"eq":"\u003cspan class=\"rx-heq\" id=\"rx-heq\">\u003cspan class=\"rx-heq-row bio-chem\">\u003cspan data-sp=\"glu\">C₆H₁₂O₆\u003c/span> + \u003cspan data-sp=\"o2\">6O₂\u003c/span> → \u003cspan data-sp=\"co2\">6CO₂\u003c/span> + \u003cspan data-sp=\"h2o\">6H₂O\u003c/span>\u003c/span>\u003csvg class=\"rx-heq-arcs\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003c/span>","eqLabel":"C₆H₁₂O₆ plus 6 O₂ gives 6 CO₂ plus 6 H₂O. Glucose, which becomes CO₂, is oxidized. O₂, which becomes H₂O, is reduced.","eqSize":"sm","headline":"Follow the electrons.","text":"When one molecule loses electrons, another gains them. Losing electrons is \u003cstrong>oxidation\u003c/strong>; gaining them is \u003cstrong>reduction\u003c/strong>. In cells the electrons usually travel with hydrogen, and oxygen pulls them hardest of all. That pull is where the energy in your food comes from.","fig":{"html":"\u003cdiv class=\"rx-hero\" id=\"rx-hero\" role=\"img\" aria-label=\"A glucose molecule: six brown carbon atoms in a ring, each holding an oxygen and two hydrogen atoms. The 12 hydrogen atoms glow and come off in pairs, each pair as 2 magenta H⁺ and 2 violet electrons. A stream of 24 violet electrons, with the H⁺, travels right to six blue O₂ molecules, which become six H₂O. The glucose carbons, now bonded only to oxygen, become six CO₂. A label rises: Glucose: oxidized (lost H). O₂: reduced (gained H).\">\u003c/div>"}},"goals":["I can define oxidation and reduction in terms of electrons, and in terms of hydrogen and oxygen in biology.","I can identify what is oxidized and what is reduced, and name the oxidizing and reducing agents.","I can explain why electrons moving toward oxygen release energy, and compare the energy stored in fats and sugars.","I can classify a reaction as redox, hydrolysis, condensation or neutralization.","I can explain why cells release energy from glucose in small steps rather than all at once."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Electrons and ions","goal":1,"prompt":"A sodium atom becomes Na⁺. It has…","options":[{"t":"lost one proton","why":"That would change it into a different element.","_n":"020f","_k":"39b3be52"},{"t":"gained one proton","why":"Ions form by electron transfer; the nucleus doesn’t change.","_n":"11df","_k":"083edc02"},{"t":"lost one electron","why":"Losing a negative electron leaves a positive ion.","_n":"21ef","_k":"3f7292bb"},{"t":"gained one electron","why":"Gaining an electron would make Na⁻.","_n":"323f","_k":"4d066ae6"}],"hints":["Electrons are negative.","Losing a negative leaves a positive.","Lost one electron."]},{"id":"w2","skill":"Electrons and ions","goal":1,"prompt":"A chlorine atom becomes Cl⁻. It has…","options":[{"t":"lost one electron","why":"That would make Cl⁺.","_n":"424f","_k":"02bf168a"},{"t":"gained one electron","why":"One extra negative charge.","_n":"521f","_k":"d606c60d"},{"t":"lost one proton","why":"Protons don’t move in chemical reactions.","_n":"622f","_k":"55a4517e"},{"t":"gained a neutron","why":"Neutrons have no charge.","_n":"727f","_k":"b6a7e526"}],"hints":["What carries negative charge?","One more electron.","Gained one electron."]},{"id":"w3","skill":"Electronegativity","goal":3,"prompt":"In an O–H bond, the shared electrons are…","options":[{"t":"transferred completely to hydrogen","why":"O–H is a polar covalent bond, not an ionic one.","_n":"828f","_k":"3dc23a02"},{"t":"shared exactly equally","why":"Only identical atoms share exactly equally.","_n":"9823","_k":"f93b6c0c"},{"t":"pulled closer to the oxygen","why":"Oxygen is more electronegative than hydrogen.","_n":"a813","_k":"321dcd60"},{"t":"pulled closer to the hydrogen","why":"Hydrogen pulls weakly.","_n":"b843","_k":"078e7ae9"}],"hints":["Which atom is more electronegative?","Oxygen (3.4) vs hydrogen (2.2).","Closer to oxygen."]},{"id":"w4","skill":"Electronegativity","goal":3,"prompt":"Which atom is the most electronegative?","options":[{"t":"Hydrogen","why":"Hydrogen is 2.2.","_n":"c833","_k":"9f8a8093"},{"t":"Nitrogen","why":"Nitrogen is 3.0: close, but less than oxygen.","_n":"d863","_k":"7de4bdbd"},{"t":"Oxygen","why":"3.4 on the Pauling scale: the strongest pull of these.","_n":"e853","_k":"3afdffd0"},{"t":"Carbon","why":"Carbon is 2.6.","_n":"f883","_k":"37fbc7d1"}],"hints":["Electronegativity increases toward the top right of the periodic table (not counting noble gases).","O is right of N and C.","Oxygen."]},{"id":"w5","skill":"Reading formulas","goal":2,"prompt":"How many hydrogen atoms are in one glucose molecule, C₆H₁₂O₆?","options":[{"t":"2","why":"H₂ is the hydrogen gas formula, not glucose.","_n":"g873","_k":"a86ab303"},{"t":"6","why":"6 is for carbon (and oxygen).","_n":"h7a3","_k":"f8ac39ab"},{"t":"12","why":"The subscript after H.","_n":"i793","_k":"f0425bf5"},{"t":"24","why":"Read the subscript as written.","_n":"jf03","_k":"7e00ee2b"}],"hints":["Find the number after H.","H₁₂.","12."]},{"id":"w6","skill":"Reading formulas","goal":4,"prompt":"In 6CO₂, how many oxygen atoms are there in total?","options":[{"t":"2","why":"There are 6 molecules.","_n":"kf13","_k":"74664bef"},{"t":"6","why":"Each CO₂ has 2 O.","_n":"lf23","_k":"a9d200bf"},{"t":"8","why":"Multiply 6 × 2.","_n":"mf33","_k":"242b0ce3"},{"t":"12","why":"6 molecules × 2 oxygen atoms.","_n":"nf43","_k":"efb29510"}],"hints":["The coefficient counts molecules.","Each has 2 O.","12."]}],"refreshers":{"Electrons and ions":"An atom that loses electrons becomes positive (Na → Na⁺ + e⁻); one that gains becomes negative (Cl + e⁻ → Cl⁻).","Electronegativity":"Electronegativity is how hard an atom pulls shared electrons. O 3.4 &gt; N 3.0 &gt; C 2.6 &gt; H 2.2. In O–H and C–O bonds, the electrons sit nearer the oxygen.","Reading formulas":"Subscripts count atoms in one molecule; coefficients count molecules. 6CO₂ has 6 C and 12 O."}}},"explore":{"heading":"Electron tug-of-war","intro":"Watch which atom wins the pull on shared electrons, then tag who loses and who gains electrons in real reactions.","modes":[["A","Tug-of-war"],["B","Who loses, who gains?"]],"bonds":[["hh","H–H"],["ch","C–H"],["cc","C–C"],["co","C–O"],["oh","O–H"],["oo","O=O"]],"mols":[["ch4","CH₄","methane"],["ch3oh","CH₃OH","methanol"],["hcho","HCHO","formaldehyde"],["hcooh","HCOOH","formic acid"],["co2","CO₂","carbon dioxide"],["glu","glucose","C₆H₁₂O₆"],["palm","palmitic acid","a fatty acid, C₁₆H₃₂O₂"]],"scoreRule":"\u003cstrong>Carbon score\u003c/strong> (a model): each C–H bond counts −1, each C–O bond +1 (a C=O counts +2), each C–C 0. For big molecules the counter shows the average per carbon.","orderTitle":"Challenge 2: one-carbon molecules, most reduced (top) to most oxidized (bottom)","orderStart":["hcooh","ch4","co2","hcho","ch3oh"],"fuelTitle":"Fuel calculator (challenge 3)","fuelRule":"Electrons given to O ittle toward C for C–H.","\u003cstrong>Carbon score\u003c/strong> (model): each C–H bond −1, each C–O bond +1, a C=O +2, each C–C 0. The lower the score, the more reduced the carbon, and the more electrons it can still give to O₂ on the way to CO₂ (+4).","\u003cstrong>Electron count rule\u003c/strong>: C\u003csub>\u003ci>a\u003c/i>\u003c/sub>H\u003csub>\u003ci>b\u003c/i>\u003c/sub>O\u003csub>\u003ci>c\u003c/i>\u003c/sub> gives 4\u003ci>a\u003c/i> + \u003ci>b\u003c/i> − 2\u003ci>c\u003c/i> electrons to O₂ when fully oxidized; each O₂ takes 4."],"modelNote":"The carbon score is a simplified bookkeeping model for this course, not the full method chemists use. The tug-of-war positions are model positions, not measured ones.","predIntro":"Make a prediction first. Then the tug-of-war will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"B","rx":"B4"},"prompt":"\u003cspan class=\"muted\">Reaction B4.\u003c/span> In cellular respiration, what happens to O₂?","options":[{"t":"It is reduced to H₂O","_n":"of53","_k":"727d2d6c"},{"t":"It is unchanged","_n":"pf63","_k":"e1411f3f"},{"t":"It is oxidized to H₂O","_n":"qf73","_k":"612f2adb"},{"t":"It is oxidized to CO₂","_n":"rf83","_k":"866ef19b"}],"explain":"O₂ gains electrons and hydrogen: reduction. The oxygen in CO₂ comes from glucose and water, not from O₂."},{"id":"p2","start":{"mode":"B","rx":"B6"},"prompt":"\u003cspan class=\"muted\">Reaction B6.\u003c/span> Malate loses 2 hydrogen atoms to NAD⁺. Malate is…","options":[{"t":"both","_n":"sf93","_k":"15a2b26f"},{"t":"reduced","_n":"t763","_k":"ef15aabc"},{"t":"oxidized","_n":"u753","_k":"0993b60d"},{"t":"neither, because no oxygen is involved","_n":"v743","_k":"f9a77cd0"}],"explain":"Losing H means losing electrons, so it’s oxidation even without O₂."},{"id":"p3","start":{"mode":"B","rx":"B1","tagNa":true},"prompt":"\u003cspan class=\"muted\">Reaction B1, with Na tagged “oxidized”.\u003c/span> Which must be true of Cl?","options":[{"t":"It is reduced","_n":"w733","_k":"cb4144c5"},{"t":"It loses a proton","_n":"x7a3","_k":"3df62bdb"},{"t":"It is unchanged","_n":"y793","_k":"1bc54572"},{"t":"It is also oxidized","_n":"z783","_k":"880a09c0"}],"explain":"Electrons lost by one atom must be gained by another."},{"id":"p4","start":{"mode":"A","mol":"ch4"},"prompt":"\u003cspan class=\"muted\">Mode A: compare CH₄ and CH₃OH.\u003c/span> Which carbon can lose more electrons on the way to CO₂?","options":[{"t":"Both the same","_n":"10773","_k":"ce98166a"},{"t":"CH₃OH (score −2)","_n":"117e3","_k":"fbe667bd"},{"t":"CH₄ (score −4)","_n":"127d3","_k":"c3f98fdc"},{"t":"Neither","_n":"13f44","_k":"666e5054"}],"explain":"CH₄ is 8 steps from CO₂; CH₃OH is only 6. More electrons to give means more energy released."}],"chalIntro":"Use the tug-of-war (challenge 1: Mode B; challenges 2 and 3: the panels under Mode A), then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Tag reaction B3 completely: oxidized, reduced, oxidizing agent and reducing agent.","why":"CH₄ is oxidized and is the reducing agent; O₂ is reduced and is the oxidizing agent. CO₂ and H₂O are products, so they aren’t tagged.","general":"Choose reaction B3 in Mode B (Who loses, who gains?), then tag both reactants.","hints":["Where do CH₄’s hydrogens end up?","In H₂O, attached to oxygen from O₂: O₂ gained electrons.","CH₄: oxidized, reducing agent. O₂: reduced, oxidizing agent."]},{"id":"tc2","goal":[2,3],"prompt":"Mode A: put the five one-carbon molecules in order from most reduced to most oxidized.","why":"CH₄ (−4) → CH₃OH (−2) → HCHO (0) → HCOOH (+2) → CO₂ (+4).","hints":["Count C–H bonds (−1 each) and C–O bonds (+1 each).","CH₄ −4, CH₃OH −2, HCHO 0.","Then HCOOH +2, CO₂ +4."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Use the electron count rule to find how many O₂ molecules are needed to fully oxidize one glucose (C₆H₁₂O₆) and one palmitic acid (C₁₆H₃₂O₂). Then decide which gives more electrons \u003cstrong>per carbon\u003c/strong>.","why":"Glucose: 24 electrons, 6 O₂. Palmitic acid: 92 electrons, 23 O₂. Per carbon: glucose 4, palmitic acid 5.75, so the fat gives more.","hints":["Glucose: 4(6) + 12 − 2(6) = 24 electrons.","Palmitic acid: 4(16) + 32 − 2(2) = 92; 92 ÷ 4 = 23 O₂.","Per carbon: 24 ÷ 6 = 4 and 92 ÷ 16 = 5.75. The fat’s carbons are more reduced, so they release more energy."]}]},"part3":{"slug":"reaction-types","name":"Reaction types","heading":"Four reaction types","intro":"Redox is one of four main types of biochemical reaction. Step through each station and watch what moves: electrons, water in, water out, or H⁺. Then tell them apart.","how":"Choose a station, then use Step (or Play) to run its animation. Open \u003cstrong>Zoom to the molecules\u003c/strong> for a closer look.","stations":[{"id":"redox","name":"Redox","eq":"NAD⁺ + 2H → NADH + H⁺","steps":["A substrate (here, malate) holds two H atoms. NAD⁺ is an empty electron carrier.","An enzyme pulls off the 2 H atoms. Each one travels as H⁺ + e⁻.","NAD⁺ takes both electrons and one H⁺: it is reduced to NADH. The other H⁺ is released.","Electrons (with H) moved from one molecule to another: that’s redox. The substrate is oxidized; NAD⁺ is reduced."],"zoom":"NAD⁺ picks up both electrons and one H⁺ together, as a hydride ion (H⁻), on one ring of the molecule; the second H⁺ goes into the surrounding water. This is a preview: module 12 looks at NAD⁺ and FAD up close."},{"id":"hydro","name":"Hydrolysis","eq":"sucrose + H₂O → glucose + fructose","steps":["Sucrose is two sugar rings, glucose and fructose, joined through an oxygen. A water molecule arrives.","The water molecule splits into H and OH.","The link between the rings breaks. H joins one sugar and OH joins the other.","Water went in, and one molecule became two: hydrolysis."],"zoom":"The enzyme sucrase, in your small intestine, adds water across the C–O–C link between the rings. Digestion works this way: hydrolysis takes starch, proteins and fats apart into their building blocks."},{"id":"cond","name":"Condensation","eq":"glucose + glucose → maltose + H₂O","steps":["Two glucose molecules line up: one has an OH and the other an H facing each other.","The OH from one sugar and the H from the other leave together as water.","The rings join through an oxygen bridge: one bigger molecule, maltose.","Two molecules joined and water came out: condensation (dehydration synthesis). It’s hydrolysis in reverse."],"zoom":"The same kind of reaction links amino acids into proteins, glucose into starch and glycogen, and fatty acids onto glycerol to make a fat. Each new link releases one H₂O."},{"id":"neut","name":"Neutralization","eq":"H⁺ + HCO₃⁻ → H₂CO₃; HCl + NaOH → NaCl + H₂O","steps":["In blood: extra H⁺ (from an acid) meets bicarbonate, HCO₃⁻, a base.","The base takes up the H⁺: H⁺ + HCO₃⁻ → H₂CO₃. The blood doesn’t become too acidic.","In a flask: HCl + NaOH. The acid gives H⁺; the base gives OH⁻.","H⁺ meets OH⁻ and forms water; Na⁺ and Cl⁻ are left as a salt. An acid’s H⁺ met a base: neutralization."],"zoom":"Neutralization moves H⁺, not electrons, so nothing is oxidized or reduced. In blood, the bicarbonate buffer soaks up extra H⁺ and keeps the pH close to 7.4."}],"keyTitle":"How to tell","keyLocked":"Finish all four stations (step each one to the end) to unlock the key.","keyHead":["What you see","Type"],"keyRows":[["Electrons or H atoms move from one molecule to another","Redox"],["Water goes \u003cstrong>in\u003c/strong> and one molecule splits into two","Hydrolysis"],["Two molecules join and water comes \u003cstrong>out\u003c/strong>","Condensation"],["An acid’s H⁺ meets a base (OH⁻ or HCO₃⁻)","Neutralization"]],"quickCheck":{"title":"Quick check","summary":"Four reaction types quick check","items":[{"id":"q1","goal":4,"prompt":"Two amino acids join into a dipeptide, releasing H₂O.","choices":[{"t":"condensation","fb":"Right. Water comes out as two molecules join.","_n":"14f54","_k":"9b672339"},{"t":"hydrolysis","fb":"Water comes out as two molecules join.","_n":"15f24","_k":"a476533c"},{"t":"neutralization","fb":"Water comes out as two molecules join.","_n":"16f34","_k":"708ef6a2"},{"t":"redox","fb":"Water comes out as two molecules join.","_n":"17f84","_k":"e001f184"}]},{"id":"q2","goal":4,"prompt":"Lactase splits lactose into glucose and galactose, using water.","choices":[{"t":"redox","fb":"Water goes in; one molecule becomes two.","_n":"18f94","_k":"ab7c2ca6"},{"t":"neutralization","fb":"Water goes in; one molecule becomes two.","_n":"19f64","_k":"609a837c"},{"t":"condensation","fb":"Water goes in; one molecule becomes two.","_n":"1af74","_k":"b9506755"},{"t":"hydrolysis","fb":"Right. Water goes in; one molecule becomes two.","_n":"1bfc4","_k":"5caa0209"}]},{"id":"q3","goal":4,"prompt":"Stomach acid (HCl) reacts with an antacid (Mg(OH)₂).","choices":[{"t":"hydrolysis","fb":"Acid + base gives a salt and water.","_n":"1cfd4","_k":"b110d894"},{"t":"condensation","fb":"Acid + base gives a salt and water.","_n":"1dfa4","_k":"26febea2"},{"t":"neutralization","fb":"Right. Acid + base gives a salt and water.","_n":"1ef94","_k":"7af7ff04"},{"t":"redox","fb":"Acid + base gives a salt and water.","_n":"1ffc4","_k":"5d71b402"}]},{"id":"q4","goal":4,"prompt":"FADH₂ gives two electrons to ubiquinone and becomes FAD.","choices":[{"t":"neutralization","fb":"Electrons move from one molecule to another.","_n":"1gfb4","_k":"9012a686"},{"t":"condensation","fb":"Electrons move from one molecule to another.","_n":"1hf64","_k":"b7c86021"},{"t":"hydrolysis","fb":"Electrons move from one molecule to another.","_n":"1if54","_k":"320f5c0f"},{"t":"redox","fb":"Right. Electrons move from one molecule to another.","_n":"1jf84","_k":"3bb1097a"}]}]}},"practice":{"activities":[{"id":"oxred","type":"sorter","title":"Oxidized or reduced?","summary":"Oxidized or reduced?","noun":"change","goal":[1,2],"txt":true,"instruction":"Ten changes from cells and chemistry. Sort each one by what happens to the substance on the left of the arrow.","boxes":[{"id":"ox","label":"Oxidized","sub":"loses electrons (or H)"},{"id":"red","label":"Reduced","sub":"gains electrons (or H)"}],"wrongDefault":"Ask what the substance on the left does: lose electrons (or H atoms), or gain them?","items":[{"id":"i1","t":"NAD⁺ → NADH","_a":"QRMBXEY=","why":"NAD⁺ gains 2 electrons (and an H⁺): reduced."},{"id":"i2","t":"FADH₂ → FAD","_a":"QQ4cGg==","why":"FADH₂ loses 2 H atoms, and their electrons: oxidized."},{"id":"i3","t":"Fe²⁺ → Fe³⁺ (in a cytochrome)","_a":"QQ4cGg==","why":"Fe²⁺ → Fe³⁺: one more positive charge, so one electron lost.","wrong":{"red":"Fe²⁺ → Fe³⁺: one more positive charge, so one electron lost."}},{"id":"i4","t":"O₂ → H₂O","_a":"QRMBXEY=","why":"O₂ gains electrons and H to become water.","wrong":{"ox":"O₂ gains electrons and H to become water."}},{"id":"i5","t":"CO₂ → glucose (photosynthesis)","_a":"QRMBXEY=","why":"Carbon gains H atoms, and their electrons, as CO₂ becomes glucose: reduced."},{"id":"i6","t":"glucose → CO₂ (respiration)","_a":"QQ4cGg==","why":"Glucose loses its H atoms, and their electrons, as it ends as CO₂: oxidized."},{"id":"i7","t":"Na → Na⁺","_a":"QQ4cGg==","why":"Losing a negative electron leaves a positive ion: oxidized."},{"id":"i8","t":"Cl → Cl⁻","_a":"QRMBXEY=","why":"Gaining an electron makes a negative ion: reduced."},{"id":"i9","t":"lactate → pyruvate (loses 2 H)","_a":"QQ4cGg==","why":"Losing H atoms means losing electrons: oxidized.","wrong":{"red":"Losing H atoms means losing electrons."}},{"id":"i10","t":"H₂O → O₂ (water split in photosynthesis)","_a":"QQ4cGg==","why":"Water’s oxygen ends up as O₂, losing its H and electrons: oxidized.","wrong":{"red":"Water’s oxygen ends up as O₂, losing its H and electrons."},"hints":["Where do water’s H atoms go?","They leave as H⁺ + e⁻.","Losing electrons: oxidized."]}]},{"id":"fuel","type":"custom","title":"Carbon scores and fuel value","summary":"Carbon scores and fuel value","star":true,"goal":[2,3],"instruction":"Seven problems on carbon scores and fuel value. Problems 4 to 7 are non-routine; the last two go beyond the Final Check.","how":"","rule":"\u003cstrong>Electron count rule:\u003c/strong> C\u003csub>\u003ci>a\u003c/i>\u003c/sub>H\u003csub>\u003ci>b\u003c/i>\u003c/sub>O\u003csub>\u003ci>c\u003c/i>\u003c/sub> gives 4\u003ci>a\u003c/i> + \u003ci>b\u003c/i> − 2\u003ci>c\u003c/i> electrons to O₂ when fully oxidized; each O₂ takes 4. \u003cstrong>Carbon score:\u003c/strong> C–H −1, C–O +1, C=O +2, C–C 0.","items":[{"id":"r1","kind":"num","goal":2,"prompt":"Carbon score of the carbon in CH₃OH (methanol)?","_a":"TlM=","display":"−2","unit":"","keypad":"text","general":"Count the bonds to this carbon: C–H −1, C–O +1, C=O +2.","wrong":[{"match":-3,"fb":"Three C–H (−3) plus one C–O (+1)."}]},{"id":"r2","kind":"num","goal":2,"prompt":"Carbon score of the carbon in HCOOH (formic acid)?","_a":"UQ==","display":"+2","unit":"","keypad":"text","general":"Count the bonds to this carbon: C–H −1, C–O +1, C=O +2.","wrong":[{"match":1,"fb":"C=O counts +2, C–O +1, C–H −1."}]},{"id":"r3","kind":"mc","goal":2,"prompt":"Which is more oxidized: formaldehyde (HCHO) or formic acid (HCOOH)?","options":[{"t":"formaldehyde (HCHO)","why":"+2 is further toward CO₂ than 0.","_n":"1kf74","_k":"7cbb8a3f"},{"t":"formic acid (HCOOH)","why":"Formic acid scores +2 and formaldehyde 0: +2 is further toward CO₂ than 0.","_n":"1l024","_k":"0bb05454"}]},{"id":"r4","kind":"num","goal":3,"star":true,"prompt":"How many electrons does one ethanol (C₂H₆O) give to O₂ when fully oxidized?","_a":"UlM=","display":"12 electrons","unit":"electrons","general":"Use the electron count rule in the box above.","wrong":[{"match":8,"fb":"4(2) + 6 − 2(1) = 12."}],"hints":["\u003ci>a\u003c/i> = 2, \u003ci>b\u003c/i> = 6, \u003ci>c\u003c/i> = 1.","8 + 6 − 2.","12 electrons."]},{"id":"r5","kind":"num","goal":3,"star":true,"prompt":"How many O₂ molecules does that take?","_a":"UA==","display":"3 O₂","unit":"O₂","general":"Each O₂ takes 4 electrons.","wrong":[{"match":12,"fb":"Each O₂ takes 4 electrons."}]},{"id":"r6","kind":"mc","goal":3,"star":true,"prompt":"Per carbon, which releases more electrons: ethanol (C₂H₆O) or glucose (C₆H₁₂O₆)?","options":[{"t":"ethanol","why":"Ethanol: 12 ÷ 2 = 6 per carbon. Glucose: 24 ÷ 6 = 4.","_n":"1m014","_k":"9e430dfa"},{"t":"glucose","why":"Fats have more C–H bonds and less oxygen, so their electrons have further to fall toward O₂. 12 ÷ 2 = 6 per carbon; 24 ÷ 6 = 4.","_n":"1n883","_k":"5fe8eaae"}]},{"id":"r7","kind":"r7","goal":3,"star":true,"prompt":"A molecule C₃H₈O₃ (glycerol) is fully oxidized. How many O₂ does it use, and how many CO₂ and H₂O form?","basis":[["1","per 1 glycerol"],["2","per 2 glycerol"]],"boxes":[["o2","O₂ used"],["co2","CO₂ formed"],["h2o","H₂O formed"]],"_a":"GENVGl4dFFpRQ14LSlMaFwAOVhpeVRoXC1MLGl5SSxlBU0YCH0RZB0FbUxRGBVkHQVtSFEYOBFpBW1xFGQ==","display":"3.5 O₂ (7 per 2 glycerol); 3 CO₂; 4 H₂O","fb":"4(3) + 8 − 2(3) = 14 electrons → 14 ÷ 4 = 3.5 O₂. Carbon gives 3 CO₂; 8 H give 4 H₂O.","hints":["Electrons: 4\u003ci>a\u003c/i> + \u003ci>b\u003c/i> − 2\u003ci>c\u003c/i>.","12 + 8 − 6 = 14, so 3.5 O₂ (write the equation for 2 glycerol to avoid halves: 7 O₂).","2C₃H₈O₃ + 7O₂ → 6CO₂ + 8H₂O."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Eitan","how":"","instruction":"Eitan made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, what is oxidized and what is reduced?","steps":["Glucose loses its hydrogen atoms.","So glucose loses electrons: it is oxidized.","O₂ reacts with glucose, so O₂ is oxidized too.","So both reactants are oxidized."],"_a":"UQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Glucose is reduced instead.","why":"Glucose loses H.","_n":"1o893","_k":"af0c7326"},{"t":"O₂ gains the hydrogen atoms (and their electrons) to form H₂O, so O₂ is reduced.","why":"O₂ gains electrons (and H) to become H₂O: it is reduced. Electrons don’t vanish. Every electron lost by one substance is gained by another.","_n":"1p8a3","_k":"9988780a"},{"t":"O₂ is neither oxidized nor reduced.","why":"O₂ → H₂O gains electrons.","_n":"1q8b3","_k":"995671d3"},{"t":"Step 3 is correct.","why":"Something must gain the electrons glucose loses.","_n":"1r843","_k":"0a0bfb1e"}],"hints":["Where do glucose’s hydrogens end up?","In H₂O, with oxygen from O₂.","The fix: O₂ gains the hydrogen atoms (and their electrons) to form H₂O, so O₂ is reduced."]},{"id":"e2","goal":4,"task":"Classify: maltose + H₂O → glucose + glucose.","steps":["One molecule becomes two.","Water appears in the equation.","Water is involved, so this is condensation.","Condensation joins molecules together."],"_a":"UQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","True in general, but it doesn’t match step 1. The mistake is earlier."],"fixes":[{"t":"It’s neutralization because water is involved.","why":"Condensation joins two molecules into one bigger one. Neutralization is acid + base: H⁺ meets OH⁻ (or a base).","_n":"1s853","_k":"d1a4cab6"},{"t":"Step 3 is correct.","why":"Condensation releases water; here water is consumed.","_n":"1t863","_k":"b9757c32"},{"t":"Water is used up (it’s on the left), and one molecule splits into two, so this is hydrolysis.","why":"Water goes in; one molecule becomes two.","_n":"1u873","_k":"b5eeeb2d"},{"t":"It’s redox because glucose is a fuel.","why":"No electrons move between molecules here.","_n":"1v803","_k":"9f92880e"}],"hints":["Is water a reactant or a product?","A reactant: water goes in.","Hydrolysis: water is used up and one molecule splits into two."]},{"id":"e3","goal":2,"task":"In malate + NAD⁺ → oxaloacetate + NADH + H⁺, name the oxidizing agent.","steps":["Malate loses 2 H atoms.","So malate is oxidized.","The oxidizing agent is the substance that is oxidized, so it’s malate.","NAD⁺ is the reducing agent."],"_a":"UQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","This follows from step 3. The mistake is earlier."],"fixes":[{"t":"Both are oxidizing agents.","why":"The reducing agent \u003cem>gives\u003c/em> electrons, so it is oxidized. The oxidizing agent \u003cem>takes\u003c/em> electrons, so it is reduced.","_n":"1w813","_k":"ae9fea76"},{"t":"Step 3 is correct.","why":"The reducing agent \u003cem>gives\u003c/em> electrons, so it is oxidized. The oxidizing agent \u003cem>takes\u003c/em> electrons, so it is reduced.","_n":"1x0e4","_k":"4a72c924"},{"t":"The oxidizing agent causes oxidation by taking electrons, so it is itself reduced: NAD⁺ is the oxidizing agent, and malate is the reducing agent.","why":"The reducing agent \u003cem>gives\u003c/em> electrons, so it is oxidized. The oxidizing agent \u003cem>takes\u003c/em> electrons, so it is reduced.","_n":"1y0d4","_k":"75e0f19f"},{"t":"H⁺ is the oxidizing agent.","why":"H⁺ is released, not the electron acceptor.","_n":"1z0c4","_k":"eed50000"}],"hints":["What does an oxidizing agent \u003cem>do\u003c/em> to the other substance?","It oxidizes it, by taking its electrons.","NAD⁺ takes the electrons, so NAD⁺ is the oxidizing agent and malate is the reducing agent."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the tug-of-war: that losing hydrogen counts as oxidation, or that O₂ is the one being reduced?"},{"id":"j2","q":"In your own words, why does oxidizing a fat release more energy than oxidizing a sugar?"},{"id":"j3","q":"Explain to a friend how to tell hydrolysis, condensation, redox and neutralization apart."},{"id":"j4","q":"Which part is still unclear: the agents, the carbon scores or the reaction types? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Oxidation is…","options":[{"t":"the gain of oxygen only","why":"Gaining O is one kind of oxidation, but losing electrons (or H) is the general rule.","_n":"200b4","_k":"6e318832"},{"t":"the gain of electrons","why":"That’s reduction.","_n":"210a4","_k":"435732f0"},{"t":"the loss of electrons","why":"OIL: oxidation is loss.","_n":"22094","_k":"bdf78bd0"},{"t":"the gain of hydrogen","why":"Gaining H is reduction.","_n":"23084","_k":"2baeff0b"}]},"b":{"prompt":"In biology, a molecule that gains hydrogen atoms is usually…","options":[{"t":"hydrolyzed","why":"Hydrolysis uses water to split a molecule.","_n":"24074","_k":"d531a88b"},{"t":"neutralized","why":"Neutralization is acid + base.","_n":"25064","_k":"43997c23"},{"t":"reduced","why":"Each H brings an electron.","_n":"26054","_k":"335f0288"},{"t":"oxidized","why":"Oxidation is losing electrons. In biology that is often losing H atoms: lactate → pyruvate is an oxidation, with no oxygen involved.","_n":"278c4","_k":"9e4b9ccc"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O, which is reduced?","options":[{"t":"CO₂","why":"CO₂ is a product.","_n":"288d4","_k":"7c09c95c"},{"t":"Glucose","why":"Glucose loses H: oxidized.","_n":"298a4","_k":"7b302c00"},{"t":"Nothing; this is combustion, not redox","why":"Electrons don’t vanish. Every electron lost by one substance is gained by another.","_n":"2a8b4","_k":"9a74f99b"},{"t":"O₂","why":"It gains electrons and H, becoming water.","_n":"2b884","_k":"7b18d245"}]},"b":{"prompt":"In photosynthesis, 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂, which is reduced?","options":[{"t":"H₂O","why":"Water loses H and becomes O₂: oxidized.","_n":"2c894","_k":"fc95cc8a"},{"t":"O₂","why":"O₂ is a product here.","_n":"2d864","_k":"1505ed1a"},{"t":"CO₂","why":"It gains H (electrons) and becomes glucose.","_n":"2e874","_k":"62107fa5"},{"t":"Glucose","why":"Glucose is a product.","_n":"2f844","_k":"3c3d917a"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Glycerol + 3 fatty acids → a fat + 3 H₂O. This is…","options":[{"t":"neutralization","why":"No acid meets a base here; three molecules join.","_n":"2g854","_k":"aa784f72"},{"t":"redox","why":"No electrons move between molecules.","_n":"2hf25","_k":"5e3a26eb"},{"t":"condensation","why":"Molecules join and water comes out.","_n":"2if15","_k":"629fe656"},{"t":"hydrolysis","why":"Hydrolysis uses water to split.","_n":"2jf45","_k":"a226a1ef"}]},"b":{"prompt":"A fat + 3 H₂O → glycerol + 3 fatty acids. This is…","options":[{"t":"neutralization","why":"Condensation joins two molecules into one bigger one. Neutralization is acid + base: H⁺ meets OH⁻ (or a base).","_n":"2kf35","_k":"83f354c9"},{"t":"hydrolysis","why":"Water goes in, and one molecule splits into smaller ones.","_n":"2lf65","_k":"cfebcdd0"},{"t":"condensation","why":"Water is used, not released.","_n":"2mf55","_k":"f1649c79"},{"t":"redox","why":"No electron transfer.","_n":"2nf85","_k":"7fcb17df"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Which molecule releases the most energy per carbon when fully oxidized to CO₂?","options":[{"t":"CO₂","why":"CO₂ is already fully oxidized.","_n":"2of75","_k":"808fced9"},{"t":"CH₄ (methane)","why":"Carbon score −4: the most electrons to give.","_n":"2pfa5","_k":"fc683803"},{"t":"CH₃OH (methanol)","why":"Score −2.","_n":"2qf95","_k":"ac241169"},{"t":"HCOOH (formic acid)","why":"Score +2: already mostly oxidized.","_n":"2rf12","_k":"0149f6bf"}]},"b":{"prompt":"Which releases the least energy per carbon when fully oxidized?","options":[{"t":"HCOOH (formic acid)","why":"Score +2: only 2 electrons left to give per carbon.","_n":"2sf02","_k":"7df28e40"},{"t":"CH₃OH","why":"Score −2.","_n":"2tef2","_k":"66f1bc03"},{"t":"CH₄","why":"Score −4.","_n":"2uee2","_k":"e0fe9315"},{"t":"HCHO","why":"Score 0.","_n":"2vf52","_k":"6d5cb147"}]}},{"id":"t2","cat":"T","goal":[1,2],"a":{"prompt":"In muscle, lactate + NAD⁺ → pyruvate + NADH + H⁺. Which is correct?","options":[{"t":"Nothing is oxidized, because no oxygen is involved","why":"Oxidation is losing electrons. In biology that is often losing H atoms: lactate → pyruvate is an oxidation, with no oxygen involved.","_n":"2wf42","_k":"a2d79663"},{"t":"NAD⁺ is the reducing agent","why":"NAD⁺ takes electrons: it’s the oxidizing agent.","_n":"2xf32","_k":"98f0f3d7"},{"t":"Lactate is oxidized and is the reducing agent","why":"It loses 2 H to NAD⁺.","_n":"2yf22","_k":"283c7148"},{"t":"Lactate is reduced, because it reacts with NAD⁺","why":"Oxidation is losing electrons. In biology that is often losing H atoms: lactate → pyruvate is an oxidation, with no oxygen involved.","_n":"2ze92","_k":"6623982a"}]},"b":{"prompt":"In yeast, acetaldehyde + NADH + H⁺ → ethanol + NAD⁺. Which is correct?","options":[{"t":"NAD⁺ is the reducing agent","why":"The reducing agent \u003cem>gives\u003c/em> electrons, so it is oxidized. The oxidizing agent \u003cem>takes\u003c/em> electrons, so it is reduced.","_n":"30e82","_k":"fdd8f776"},{"t":"NADH is reduced","why":"NADH gives up H; it is oxidized to NAD⁺.","_n":"31eb2","_k":"b123e7f5"},{"t":"Acetaldehyde is oxidized","why":"Oxidation is losing electrons. In biology that is often losing H atoms: lactate → pyruvate is an oxidation, with no oxygen involved.","_n":"32ec2","_k":"18a343df"},{"t":"Acetaldehyde is reduced, and NADH is the reducing agent","why":"Acetaldehyde gains 2 H from NADH.","_n":"33ed2","_k":"b57aaae2"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Some bacteria near deep-sea vents get energy by changing H₂S into sulfur (S). In this change, H₂S is…","options":[{"t":"reduced, because it becomes an element","why":"It loses H atoms: oxidation.","_n":"34ee2","_k":"1be5ff3b"},{"t":"hydrolyzed","why":"No water splits it.","_n":"35ef2","_k":"689141bd"},{"t":"neither, because no oxygen is involved","why":"Oxidation is losing electrons. In biology that is often losing H atoms: lactate → pyruvate is an oxidation, with no oxygen involved.","_n":"36f02","_k":"cf6411c5"},{"t":"oxidized, because it loses hydrogen (electrons)","why":"H₂S gives up its H atoms, and their electrons, as it becomes S.","_n":"37f12","_k":"68fb6a4e"}]},"b":{"prompt":"Some microbes in wetlands make methane: CO₂ + 4H₂ → CH₄ + 2H₂O. The carbon is…","options":[{"t":"oxidized, because the product contains hydrogen","why":"Gaining H is reduction.","_n":"38f22","_k":"c74aa979"},{"t":"reduced: its score goes from +4 to −4","why":"The carbon gains H (and electrons): reduction.","_n":"39e32","_k":"69b2a10b"},{"t":"unchanged","why":"Its bonds change from all-oxygen to all-hydrogen.","_n":"3ae42","_k":"08d65723"},{"t":"neutralized","why":"Condensation joins two molecules into one bigger one. Neutralization is acid + base: H⁺ meets OH⁻ (or a base).","_n":"3b5d2","_k":"2470e154"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why cells don’t oxidize glucose in one step, the way a fire does?","options":[{"t":"“A single step would release more energy than glucose contains.”","why":"ΔG is the same either way.","_n":"3c5c2","_k":"6e0722d6"},{"t":"“The total ΔG is the same, but passing electrons through carriers in small steps lets the cell capture part of the energy as ATP instead of losing it all as heat and light.”","why":"Same overall ΔG, but the cell passes electrons through carriers step by step, so it can capture energy as ATP.","_n":"3d5f2","_k":"645e3f27"},{"t":"“Cells can’t oxidize glucose at all; they reduce it.”","why":"Respiration oxidizes glucose.","_n":"3e5e2","_k":"3ce53342"},{"t":"“One step would leave the electrons nowhere to go.”","why":"The electrons go to O₂ either way.","_n":"3f612","_k":"acaed370"}]},"b":{"prompt":"Which is the best explanation of why every oxidation in a cell comes with a reduction?","options":[{"t":"“Reduction always happens first and causes oxidation.”","why":"They happen together.","_n":"3g602","_k":"032127ac"},{"t":"“Electrons can’t vanish: each one lost by one molecule is gained by another.”","why":"Electrons don’t vanish. Every electron lost by one substance is gained by another.","_n":"3h632","_k":"19398097"},{"t":"“Enzymes require two reactions at once.”","why":"It’s electron bookkeeping, not an enzyme rule.","_n":"3i622","_k":"964d4950"},{"t":"“Cells need equal amounts of oxygen and hydrogen.”","why":"It’s about electrons, not equal atoms.","_n":"3j652","_k":"b68558a8"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which flow chart best shows electrons in aerobic respiration?","options":[{"t":"glucose → NAD⁺/FAD (carriers) → electron transport chain → O₂ (forms H₂O)","why":"Glucose’s electrons ride the carriers to the chain, which hands them to O₂, the final acceptor.","_n":"3k642","_k":"12847faf"},{"t":"glucose → CO₂ → O₂","why":"The electrons don’t stay with the carbon; CO₂ is what’s left of the carbon.","_n":"3lf72","_k":"80b9cdc4"},{"t":"O₂ → glucose → CO₂","why":"Electrons flow \u003cem>to\u003c/em> O₂.","_n":"3mf82","_k":"1f3f0bc6"},{"t":"glucose → O₂ directly in one step","why":"Same overall ΔG, but the cell passes electrons through carriers step by step, so it can capture energy as ATP.","_n":"3nf52","_k":"0d7cfd24"}]},"b":{"prompt":"Which statement uses the terms correctly?","options":[{"t":"“NADH is the reduced form; it carries electrons to the chain.”","why":"NADH is the loaded (reduced) form; NAD⁺ is the empty (oxidized) form.","_n":"3of62","_k":"fc3789f5"},{"t":"“NADH is oxidized when it picks up electrons.”","why":"The reducing agent \u003cem>gives\u003c/em> electrons, so it is oxidized. The oxidizing agent \u003cem>takes\u003c/em> electrons, so it is reduced.","_n":"3pf32","_k":"246ee53c"},{"t":"“NADH carries oxygen to the chain.”","why":"It carries electrons and hydrogen.","_n":"3qf42","_k":"8f930e5e"},{"t":"“NAD⁺ is the reduced form.”","why":"NAD⁺ is empty: oxidized.","_n":"3rf12","_k":"49cccf9c"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"An antacid tablet contains Mg(OH)₂. In the stomach: Mg(OH)₂ + 2HCl → MgCl₂ + 2H₂O. Which reaction type is it, and why does it ease heartburn?","options":[{"t":"Hydrolysis: water splits the acid","why":"Water is a product.","_n":"3sf22","_k":"d9c33132"},{"t":"Redox: magnesium gains electrons","why":"No electrons move.","_n":"3tef2","_k":"3d042a14"},{"t":"Condensation: water is released","why":"No two molecules join into a larger one.","_n":"3uf02","_k":"870d8926"},{"t":"Neutralization: the base removes stomach acid’s H⁺","why":"The base’s OH⁻ meets the acid’s H⁺, making water and a salt.","_n":"3v693","_k":"2c3ecb70"}]},"b":{"prompt":"In blood, H⁺ + HCO₃⁻ → H₂CO₃ stops the blood from becoming too acidic. Which reaction type is it?","options":[{"t":"Neutralization (buffering): a base takes up H⁺","why":"HCO₃⁻ is a base: it takes up the extra H⁺.","_n":"3w683","_k":"82b11fac"},{"t":"Condensation","why":"Condensation joins two molecules into one bigger one. Neutralization is acid + base: H⁺ meets OH⁻ (or a base).","_n":"3x673","_k":"813d3843"},{"t":"Redox: H⁺ is reduced","why":"H⁺ isn’t gaining electrons; it’s combining with a base.","_n":"3y663","_k":"46de4f67"},{"t":"Hydrolysis","why":"No water splits anything.","_n":"3z653","_k":"7212cf63"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A hibernating bear stores fat rather than sugar. Which is the best chemical reason?","use":"fat ≈ 37 kJ/g, carbohydrate ≈ 17 kJ/g","options":[{"t":"Sugar contains more energy, but fat is lighter to carry","why":"Fats have more C–H bonds and less oxygen, so their electrons have further to fall toward O₂.","_n":"40643","_k":"a7de4db1"},{"t":"Fat is already oxidized, so it’s safer to store","why":"Fat is more \u003cem>reduced\u003c/em> than sugar.","_n":"41633","_k":"4f482e77"},{"t":"Fat doesn’t need oxygen to release energy","why":"Fat oxidation needs plenty of O₂.","_n":"42623","_k":"9e6a8f05"},{"t":"Fat’s carbons carry more C–H bonds and less oxygen, so oxidizing it releases more energy per gram","why":"About 37 kJ/g for fat vs 17 kJ/g for carbohydrate (approximate).","_n":"43713","_k":"cefa8fcb"}]},"b":{"prompt":"Which fuel releases more energy per carbon when fully oxidized: ethanol (C₂H₆O) or acetic acid (vinegar, C₂H₄O₂)?","options":[{"t":"Acetic acid, because it has more oxygen","why":"More oxygen means \u003cem>less\u003c/em> left to oxidize.","_n":"44703","_k":"9a753f7e"},{"t":"Neither releases energy","why":"Both can be oxidized to CO₂.","_n":"45632","_k":"4bedc6e0"},{"t":"They’re the same; both have 2 carbons","why":"Their carbons have different scores.","_n":"46642","_k":"e060ef40"},{"t":"Ethanol: 12 electrons for 2 carbons, versus 8 for acetic acid","why":"4(2) + 6 − 2 = 12; 4(2) + 4 − 4 = 8.","_n":"47652","_k":"8620620f"}]}}]},"task":{"title":"Electron drop","summary":"Electron drop","statement":"\u003cp>In this model, each electron carrier has an \u003cstrong>electron pull score\u003c/strong>. Higher scores pull electrons harder. Electrons only release energy when they move to a carrier with a \u003cstrong>higher\u003c/strong> score. Design one electron transfer that meets every condition. Can you find all the answers?\u003c/p>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"rx-qt\">\u003ccaption class=\"vh\">Pull scores\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Carrier (reduced / oxidized form)\u003c/th>\u003cth scope=\"col\">Pull score\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>NADH / NAD⁺\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>FADH₂ / FAD\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ubiquinol / ubiquinone (QH₂ / Q)\u003c/td>\u003ctd>4\u003c/td>\u003c/tr>\u003ctr>\u003ctd>cytochrome \u003ci>c\u003c/i> (reduced / oxidized)\u003c/td>\u003ctd>6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>H₂O / O₂\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003col class=\"rx-reqs\">\u003cli>The electrons move “downhill”: the acceptor’s score is higher than the donor’s.\u003c/li>\u003cli>The transfer releases at least 3 units (enough, in this model, to pump protons).\u003c/li>\u003cli>The acceptor is \u003cstrong>not\u003c/strong> O₂: this is a step inside the chain, not the last one.\u003c/li>\u003cli>The donor is a reduced carrier (NADH, FADH₂, QH₂ or reduced cytochrome \u003ci>c\u003c/i>).\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">\u003cspan class=\"bio-model\">Model\u003c/span> Pull scores are model units in the right order, not measured values. The diagram draws glucose at 0, below NADH, because glucose hands its electrons to NAD⁺ and FAD first.\u003c/p>","donors":[["nadh","NADH",1],["fadh2","FADH₂",2],["qh2","QH₂",4],["cytr","reduced cytochrome \u003ci>c\u003c/i>",6],["glu","glucose",0]],"acceptors":[["nad","NAD⁺",1],["fad","FAD",2],["q","Q",4],["cyto","oxidized cytochrome \u003ci>c\u003c/i>",6],["o2","O₂",10]],"levels":[[0,"glucose (fuel)"],[1,"NADH / NAD⁺"],[2,"FADH₂ / FAD"],[4,"QH₂ / Q"],[6,"cytochrome \u003ci>c\u003c/i>"],[10,"H₂O / O₂"]],"checks":["Downhill","Releases at least 3 units","Not the final step","Donor is a reduced carrier"],"tips":["Electrons only release energy moving to a stronger pull.","Pick a bigger gap between the two scores.","O₂ is the last acceptor. Find a step earlier in the chain.","Glucose gives its electrons to NAD⁺ and FAD first; choose a carrier."],"after3":"In real mitochondria, electrons visit every carrier in order (module 16): NADH → Q → cytochrome \u003ci>c\u003c/i> → O₂. This model only asks which transfers \u003cem>could\u003c/em> release energy.","explainPrompt":"Explain why electrons release energy when they move to a carrier with a higher pull, and why O₂ is at the bottom of the staircase.","vocab":"Use the words oxidized, reduced, electronegative and electron carrier.","more":"There’s more than one answer. Can you find all of them?"},"cards":[["OIL RIG","Oxidation Is Loss, Reduction Is Gain (of electrons)."],["Oxidation in biology","Often loss of H atoms (H⁺ + e⁻), or gain of O. Example: lactate → pyruvate."],["Reduction in biology","Often gain of H atoms. Example: NAD⁺ → NADH; O₂ → H₂O."],["Reducing agent","Gives electrons, so it is oxidized."],["Oxidizing agent","Takes electrons, so it is reduced. O₂ is the strongest in cells."],["Respiration’s redox","Glucose is oxidized to CO₂; O₂ is reduced to H₂O."],["Electronegativity","Pull on shared electrons: O 3.4 &gt; N 3.0 &gt; C 2.6 &gt; H 2.2."],["Why fats store more energy","More C–H bonds, less O: more electrons to fall toward O₂."],["Electron count rule","C\u003csub>\u003ci>a\u003c/i>\u003c/sub>H\u003csub>\u003ci>b\u003c/i>\u003c/sub>O\u003csub>\u003ci>c\u003c/i>\u003c/sub> gives 4\u003ci>a\u003c/i> + \u003ci>b\u003c/i> − 2\u003ci>c\u003c/i> electrons to O₂; each O₂ takes 4."],["Hydrolysis vs condensation","Hydrolysis: water in, split. Condensation: join, water out."],["Neutralization","Acid + base: H⁺ meets OH⁻ or another base (HCO₃⁻ in blood)."]]}};</script>
