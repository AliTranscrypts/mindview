.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 14: glycolysis stepper (S2), ledger strip (S3), Part 3 stations, practice and task.
   Roles (course plan §3): carbon chains and pyruvate --bio-carbon; ATP and the phosphates that came from ATP --bio-atp;
   Pᵢ from solution and ADP --ink-2; NADH --bio-nadh (NAD⁺ an --ink-2 outline); H₂O --pen; H⁺ --bio-h (Part 3 station 2 only);
   PFK gauge --ink; enzymes --ink-2 outlines. */
:root{--gl-enzf:color-mix(in srgb,var(--ink-2) 12%,var(--sheet))}

/* hero equation */
.gl-heq{display:inline}
.gl-arr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .15em;line-height:1}
.gl-arr small{font-size:.42em;font-weight:700;white-space:nowrap;margin-bottom:.1em}
.gl-harm{color:var(--bio-atp)}
.gl-harp{color:var(--ink)}
.gl-hnet{display:inline-block;margin-left:.3em;font-size:.6em;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:.1em .45em;vertical-align:middle}
.gl-hero{max-width:460px;margin:0 auto}
.gl-hsvg{display:block;width:100%;height:auto}
.gl-hbg{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.gl-hlab{font:600 13px var(--font-ui);fill:var(--ink-2)}
.gl-hc{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1.5}
.gl-hct{font:700 15px var(--font-ui);fill:var(--sheet)}
.gl-hnum{font:700 15px var(--font-ui);fill:var(--ink)}
.gl-htal{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.gl-htalt{font:700 14px var(--font-ui);fill:var(--ink)}

/* radio groups (from SBI4U 10 / 06 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* stepper and slider */
.gl-stp{display:inline-flex;align-items:center;gap:6px}
.gl-stb{min-width:40px;min-height:40px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:1.15rem;font-weight:700;line-height:1}
.gl-stb:disabled{opacity:.4;cursor:default}
.gl-stp output{min-width:2ch;padding:0 .4em;text-align:center;font-weight:700}
.gl-sl{margin:0}
.gl-sl input{width:100%;accent-color:var(--ink)}

/* explore layout */
.gl-ex [hidden]{display:none!important}
@media (min-width:821px){ .pg.gl-pg{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)} }
.gl-pg .pg-ctrl{display:grid;gap:12px}
.gl-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.gl-player{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.gl-ctr{font-size:.9rem;font-weight:700;color:var(--ink-2)}
.gl-main{display:grid;grid-template-columns:minmax(150px,190px) minmax(0,1fr);gap:12px;align-items:start}
.gl-phh{margin:0 0 4px;font-size:.78rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.02em}
.gl-path{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:3px}
.gl-sb{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 8px;align-items:center;text-align:left;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:3px 8px;font-size:.85rem;min-height:30px;line-height:1.25}
.gl-sb .gl-sn{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid var(--ink-2);font-weight:700;font-size:.8rem}
.gl-sb.done .gl-sn{background:var(--ink-2);border-color:var(--ink-2);color:var(--sheet)}
.gl-sb.cur{border:2px solid var(--ink);background:var(--hi-soft);font-weight:700}
.gl-sb.cur .gl-sn{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.gl-sb.blk{border-style:dashed}
.gl-se{min-width:0;overflow-wrap:anywhere}
.gl-sd{grid-column:1 / -1;display:block;margin-top:3px;font-weight:400;font-size:.82rem;overflow-wrap:anywhere}
.gl-sd small{display:block;color:var(--ink-2);font-size:.95em}
.gl-bltag{font-weight:700;font-size:.78rem}
.gl-stage{border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.gl-svg{display:block;width:100%;height:auto}
.gl-watch{margin-top:8px}
.gl-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:8px 0 0;color:var(--ink-2)}
.gl-kk{display:inline-grid;place-items:center;width:20px;height:20px;font-size:.72rem;font-weight:700;color:var(--sheet)}
.gl-kk-c{background:var(--bio-carbon);border-radius:50%}
.gl-kk-p{background:var(--bio-atp);border-radius:50%}
.gl-kk-i{background:var(--ink-2);border-radius:4px}
.gl-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.gl-ans{margin:0;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px 10px}
.gl-ans legend{font-size:.88rem;font-weight:700;color:var(--ink-2);padding:0 4px}
.gl-ansh{margin:6px 0 4px;font-size:.85rem;font-weight:700}
.gl-ansrow{display:flex;flex-wrap:wrap;gap:6px 14px}
.gl-ansrow .numrow{margin:0}
.gl-ansrow .numin{width:5.5em}
.gl-note{margin:10px 0 0}

/* S3 ledger strip (sticky under the step bar on phones) */
.gl-led{margin:0 0 12px}
.gl-lrow{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.gl-cell{display:grid;grid-template-columns:auto auto;gap:0 6px;align-items:baseline;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;min-width:0;flex:1 1 auto}
.gl-cell.on{border:2px solid var(--ink);background:var(--hi-soft)}
.gl-cl{font-size:.75rem;font-weight:700;color:var(--ink-2)}
.gl-cell > b{font-size:1.1rem;font-variant-numeric:tabular-nums;text-align:right}
.gl-tal{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:2px;min-height:10px;margin-top:2px}
.gl-tal i{display:block;width:6px;height:10px;border-radius:1px;background:var(--c)}
.gl-tal.gl-hol i{background:transparent;border:1.5px solid var(--c)}
.gl-tal b{font-size:.75rem;color:var(--ink-2)}
.gl-gauge{grid-column:1 / -1;display:block;height:10px;margin-top:3px;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;min-width:70px}
.gl-gauge i{display:block;height:100%;background:var(--ink)}
@media (max-width:640px){
  .gl-led{position:sticky;top:var(--gl-top,0px);z-index:6;margin:0 -4px 12px;background:var(--paper);padding-top:4px}
  .gl-lrow{gap:4px;padding:5px}
  .gl-cell{padding:2px 6px}
  .gl-cell > b{font-size:1rem}
  .gl-tal{display:none}
  .gl-gauge{min-width:44px}
  .gl-main{grid-template-columns:minmax(0,1fr)}
  .gl-stw{order:-1}
  .gl-path{gap:2px}
}

/* stage SVG */
.gl-bg{fill:var(--sheet)}
.gl-bond{stroke:var(--bio-carbon);stroke-width:4;stroke-linecap:round}
.gl-c{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1.5}
.gl-ctx{font:700 12.5px var(--font-ui);fill:var(--sheet)}
.gl-pb{stroke:var(--ink-2);stroke-width:2}
.gl-pa{fill:var(--bio-atp);stroke:var(--sheet);stroke-width:1.5}
.gl-pi{fill:var(--ink-2);stroke:var(--sheet);stroke-width:1.5}
.gl-pt{font:700 12px var(--font-ui);fill:var(--sheet)}
.gl-pit{font-size:10.5px}
.gl-nm{font:600 13px var(--font-ui);fill:var(--ink)}
.gl-hd{font:600 12px var(--font-ui);fill:var(--ink-2)}
.gl-held{font:700 13px var(--font-ui);fill:var(--ink)}
.gl-pl-atp{fill:var(--bio-atp)}
.gl-pl-adp{fill:var(--ink-2)}
.gl-pl-nad{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.gl-pl-nadh{fill:var(--bio-nadh)}
.gl-pl-h2o{fill:var(--pen)}
.gl-plt{font:700 11.5px var(--font-ui);fill:var(--sheet)}
.gl-plt.gl-pl-nad-t,.gl-plt.gl-miss-t{fill:var(--ink-2)}
.gl-pl-miss{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3}
.gl-miss-x{font:700 13px var(--font-ui);fill:var(--ink)}
.gl-blk{fill:none;stroke:var(--ink);stroke-width:2.5}
.gl-spot .gl-kc,.gl-spot .gl-kp,.gl-spot .gl-ka,.gl-spot .gl-kn,.gl-spot .gl-kw{opacity:.16}
.gl-sp-carbon .gl-kc,.gl-sp-phosphate .gl-kp,.gl-sp-atp .gl-ka,.gl-sp-nadh .gl-kn{opacity:1}
.gl-sp-carbon .gl-c,.gl-sp-phosphate .gl-pa,.gl-sp-phosphate .gl-pi{stroke:var(--ink);stroke-width:2.2}

/* Part 3 */
.gl-p3{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.gl-st{min-width:0}
.gl-st > h3{margin-top:0}
.gl-st + .gl-st{border-top:1.5px solid var(--rule);padding-top:20px}
.gl-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px 24px;align-items:start}
@media (max-width:820px){ .gl-row{grid-template-columns:minmax(0,1fr)} }
.gl-fig{margin:0}
.gl-side{display:grid;gap:12px;min-width:0}
.gl-side p{margin:0}
.gl-big{font-weight:700;font-size:1.05rem;padding:8px 12px;border-left:4px solid var(--ink);background:var(--paper)}
.gl-leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--ink-2)}
.gl-pstage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.gl-pstage svg{display:block;width:100%;height:auto}
.gl-pcap{margin:8px 0;font-size:.92rem;min-height:2.6em}
.gl-enz{fill:var(--gl-enzf);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.gl-plab{font:600 12.5px var(--font-ui);fill:var(--ink)}
.gl-plab-b{font-weight:700}
.gl-plab-s{font-size:11px;fill:var(--ink-2)}
.gl-hie{font:700 18px var(--font-ui);fill:var(--ink)}
.gl-mem{fill:var(--paper)}
.gl-meml{stroke:var(--ink-2);stroke-width:2}
.gl-syn{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.5}
.gl-synl{stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}
.gl-hp{fill:var(--bio-h)}
.gl-hpt{font:700 10px var(--font-ui);fill:var(--sheet)}
/* comparison table */
.gl-bank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.gl-chip{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .8em;font-size:.88rem;min-height:34px;text-align:left}
.gl-chip.sel{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.gl-tw{max-width:100%}
.gl-ctbl{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
.gl-ctbl th,.gl-ctbl td{border:1px solid var(--rule);padding:4px;vertical-align:top;text-align:left}
.gl-ctbl thead th{background:var(--paper);padding:6px 8px}
.gl-ctbl tbody th{padding:6px 8px;width:30%}
.gl-cellb{width:100%;min-height:40px;text-align:left;border:1.5px dashed var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:4px 8px;font-size:.9rem}
.gl-cellb.full{border-style:solid;border-color:var(--ink-2)}
.gl-cellb.bad{border-color:var(--red);background:var(--bad-bg)}
.gl-ok{color:var(--green);font-weight:700}
.gl-no{color:var(--red);font-weight:700}
/* station 3 */
.gl-gw{min-width:0;display:grid;gap:10px}
.gl-pread{margin:0}
.gl-cpd{fill:var(--bio-carbon)}
.gl-cpdt{font:700 14px var(--font-ui);fill:var(--sheet)}
.gl-flow{stroke:var(--ink);stroke-linecap:round}
.gl-flow.gl-thin{stroke-width:2}
.gl-flowh{fill:var(--ink)}
.gl-lead{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 3}
.gl-allo,.gl-allo-atp{fill:var(--bio-atp);stroke:var(--sheet);stroke-width:1.2}
.gl-amp{fill:var(--ink);stroke:var(--sheet);stroke-width:1.5}
.gl-ampt{font:700 10px var(--font-ui);fill:var(--sheet)}
.gl-fb{fill:none;stroke:var(--ink);stroke-width:2}
.gl-fbh{fill:var(--ink)}
.gl-minus{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.gl-minust{font:700 18px var(--font-ui);fill:var(--ink)}
.gl-data{margin-top:12px}
.gl-tw3{max-height:300px;overflow:auto}
.gl-dtbl{border-collapse:collapse;width:100%;min-width:360px;font-size:.92rem;font-variant-numeric:tabular-nums}
.gl-dtbl th,.gl-dtbl td{border-bottom:1px solid var(--rule);padding:4px 10px;text-align:right}
.gl-dtbl thead th{position:sticky;top:0;background:var(--sheet)}
.gl-dtbl tr.on th,.gl-dtbl tr.on td{background:var(--hi-soft);font-weight:700}
@media (max-width:640px){ .gl-pstage .gl-plab{font-size:14px} .gl-pstage .gl-plab-s{font-size:12.5px} .gl-pstage .gl-cpdt{font-size:16px} }

/* practice */
.gl-unit{margin-left:6px;color:var(--ink-2);font-weight:700}
.gl-pair{display:grid;gap:6px}
.gl-achips{margin:6px 0 10px}
.gl-achips .chip{color:var(--ink);text-align:left}
.gl-achips .chip[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* performance task */
.gl-conds{margin:8px 0 0;padding-left:1.4em}
.gl-conds li{margin:2px 0}
.gl-tin{display:grid;gap:12px;margin:12px 0}
.gl-tpv h4{margin:0 0 8px}
.gl-gauge2{display:grid;gap:8px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.gl-grow{display:grid;grid-template-columns:118px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:.88rem}
.gl-gl{font-weight:700}
.gl-gt{position:relative;display:flex;height:16px;background:var(--paper);border-radius:3px}
.gl-gt i{display:block;height:100%}
.gl-gt i:first-child{border-radius:3px 0 0 3px}
.gl-gm{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink)}
.gl-grow > b{text-align:right;font-variant-numeric:tabular-nums}
.gl-gu{background:var(--ink)}
.gl-ge{background:var(--pen)}
.gl-gf{background:var(--bio-carbon)}
.gl-ga{background:var(--bio-atp)}
.gl-glg{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--ink-2)}
.gl-sw{display:inline-block;width:12px;height:12px;border-radius:2px}
.gl-gbal{margin:0;font-weight:700}
.gl-all{font-weight:700}

</style>
</head>

ect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"5bd0f873","content":{"id":"14-glycolysis","kind":"topic","title":"Glycolysis","topic":"Glycolysis","readyTopic":"glycolysis","hero":{"eq":"\u003cspan class=\"gl-heq\">\u003cspan class=\"bio-chem\">glucose (6C)\u003c/span> \u003cspan class=\"gl-arr\">\u003csmall class=\"gl-harm\">−2 ATP\u003c/small>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/span> \u003cspan class=\"bio-chem\">2 G3P (3C)\u003c/span> \u003cspan class=\"gl-arr\">\u003csmall class=\"gl-harp\">+4 ATP, +2 NADH\u003c/small>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/span> \u003cspan class=\"bio-chem\">2 pyruvate (3C)\u003c/span> \u003cspan class=\"gl-hnet\">net 2 ATP\u003c/span>\u003c/span>","eqLabel":"Glucose, with 6 carbons, becomes 2 G3P, spending 2 ATP. The 2 G3P become 2 pyruvate, with 3 carbons each, making 4 ATP and 2 NADH. Net 2 ATP.","eqSize":"sm","headline":"Spend 2, earn 4.","text":"\u003cstrong>Glycolysis\u003c/strong> splits one glucose into two \u003cstrong>pyruvate\u003c/strong> in the cytosol, without oxygen. The cell first \u003cem>invests\u003c/em> 2 ATP to prime the sugar, then splits it and collects a \u003cem>payoff\u003c/em> of 4 ATP and 2 \u003cstrong>NADH\u003c/strong>. It’s the oldest energy pathway in life, used by nearly every cell on Earth.","fig":{"html":"\u003cdiv class=\"gl-hero\" id=\"gl-hero\" role=\"img\" aria-label=\"A brown hexagon, glucose, enters the cytosol. Two orange ATP each leave one orange phosphate on the sugar: minus 2 ATP. The sugar, now with a phosphate at each end, splits into two 3-carbon pieces, each carrying one phosphate. Each piece picks up a grey inorganic phosphate from solution and loads a teal NADH: plus 2 NADH. Each piece hands both its phosphates to ADP, one at a time, and four orange ATP pop out: plus 4 ATP. Two brown triangles, pyruvate, remain. A tally reads net 2 ATP, 2 NADH, 2 pyruvate.\">\u003c/div>"}},"goals":["I can describe glycolysis as an investment phase and a payoff phase, and say where it happens.","I can state the inputs and outputs of glycolysis per glucose, and the net ATP.","I can follow the carbon atoms and phosphate groups through the main steps.","I can explain substrate-level phosphorylation and how it differs from oxidative phosphorylation.","I can explain how glycolysis is controlled at phosphofructokinase.","I can predict what happens when a step is blocked or NAD⁺ runs out."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Stages of respiration","goal":1,"prompt":"Where in the cell does glycolysis happen?","options":[{"t":"The mitochondrial matrix","why":"That’s the Krebs cycle.","_n":"0115","_k":"bf669acb"},{"t":"The cytosol","why":"Outside the mitochondria.","_n":"10e5","_k":"13f7026a"},{"t":"The nucleus","why":"The nucleus stores DNA.","_n":"20f5","_k":"e48cced5"},{"t":"The inner mitochondrial membrane","why":"That’s the electron transport chain.","_n":"30c5","_k":"f4c82b31"}],"hints":["Is it inside or outside the mitochondrion?","Outside.","The cytosol."]},{"id":"w2","skill":"Stages of respiration","goal":2,"prompt":"What is the end product of glycolysis?","options":[{"t":"Lactate","why":"Lactate is made only in fermentation.","_n":"40d5","_k":"28cdac69"},{"t":"CO₂","why":"Glycolysis releases no CO₂.","_n":"50a5","_k":"69aaecdd"},{"t":"Acetyl-CoA","why":"That’s made in pyruvate oxidation, the next stage.","_n":"60b5","_k":"f1722695"},{"t":"Pyruvate","why":"Two per glucose.","_n":"7185","_k":"0384966e"}],"hints":["It’s a 3-carbon molecule.","Its name starts with “pyr”.","Pyruvate."]},{"id":"w3","skill":"ATP and phosphates","goal":4,"prompt":"When ATP gives away a phosphate group, it becomes…","options":[{"t":"AMP","why":"AMP has one phosphate; that takes two removals.","_n":"8195","_k":"8d45d3db"},{"t":"NADH","why":"NADH is an electron carrier.","_n":"9447","_k":"9148343a"},{"t":"ADP","why":"Adenosine diphosphate: two phosphates left.","_n":"a437","_k":"4413b286"},{"t":"ATP again","why":"It has lost a phosphate.","_n":"b467","_k":"dbf9053b"}],"hints":["Tri- → ?","Two phosphates left: di-.","ADP."]},{"id":"w4","skill":"ATP and phosphates","goal":4,"prompt":"Adding a phosphate group to a molecule is called…","options":[{"t":"hydrolysis","why":"Hydrolysis splits with water.","_n":"c457","_k":"03e0d2dd"},{"t":"oxidation","why":"Oxidation is losing electrons.","_n":"d407","_k":"4fbdc5f3"},{"t":"phosphorylation","why":"Kinase enzymes do it.","_n":"e3f7","_k":"63d533fe"},{"t":"reduction","why":"Reduction is gaining electrons.","_n":"f427","_k":"f028600b"}],"hints":["The word contains “phosphate”.","Phosphor- + -ylation.","Phosphorylation."]},{"id":"w5","skill":"Enzymes and inhibition","goal":5,"prompt":"In feedback inhibition, a pathway’s product…","options":[{"t":"is destroyed by the last enzyme","why":"Products aren’t destroyed by feedback.","_n":"g417","_k":"9810f72d"},{"t":"becomes a new substrate","why":"That’s a different idea.","_n":"h4c7","_k":"91a6ddc0"},{"t":"inhibits an early enzyme of the same pathway","why":"It switches off its own production.","_n":"i4b7","_k":"015ad223"},{"t":"activates the first enzyme","why":"That would make even more product.","_n":"jd27","_k":"de7c796f"}],"hints":["“Feedback” loops back to the start.","Too much product → slow down.","Inhibits an early enzyme."]},{"id":"w6","skill":"Enzymes and inhibition","goal":5,"prompt":"An allosteric inhibitor binds…","options":[{"t":"to the substrate","why":"Inhibitors bind the enzyme.","_n":"kd37","_k":"77a4f1a7"},{"t":"in the active site","why":"That’s a competitive inhibitor.","_n":"ld47","_k":"46a6e467"},{"t":"away from the active site, changing the enzyme’s shape","why":"Allo- means “other”: it binds another site, and the change of shape slows the enzyme.","_n":"md57","_k":"7bfbb494"},{"t":"permanently, destroying the enzyme","why":"Allosteric inhibition is reversible.","_n":"nce7","_k":"c2d6efed"}],"hints":["Allo- means “other”.","Another site.","Away from the active site, changing the enzyme’s shape."]}],"refreshers":{"Stages of respiration":"Glycolysis (cytosol) → pyruvate oxidation and Krebs (matrix) → chain (inner membrane). Glycolysis ends with 2 pyruvate.","ATP and phosphates":"ATP → ADP + Pᵢ releases energy. Adding a phosphate is phosphorylation; enzymes that do it are kinases.","Enzymes and inhibition":"Allosteric inhibitors bind away from the active site. In feedback inhibition, an end product slows an early enzyme."}}},"explore":{"heading":"Glycolysis stepper","intro":"Step through glycolysis one reaction at a time. Watch the carbons, the phosphates, the ATP and the NADH, then break it on purpose and see what happens.","chalIntro":"Use the stepper to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. For challenges 2 and 3, type your numbers in the answer boxes under the controls. Each challenge has three levels of help.","modelNote":"PFK activity percentages are model values.","steps":[{"n":1,"r":"glucose → glucose-6-phosphate","e":"hexokinase","tok":"−1 ATP; P on C6"},{"n":2,"r":"glucose-6-phosphate → fructose-6-phosphate","e":"isomerase","tok":"rearranged"},{"n":3,"r":"fructose-6-phosphate → fructose-1,6-bisphosphate","e":"phosphofructokinase (PFK)","tok":"−1 ATP; 2 P on the sugar"},{"n":4,"r":"fructose-1,6-bisphosphate → DHAP + G3P","e":"aldolase","tok":"6C → 3C + 3C"},{"n":5,"r":"DHAP → G3P","e":"isomerase","tok":"now 2 G3P"},{"n":6,"r":"G3P + NAD⁺ + Pᵢ → 1,3-bisphosphoglycerate + NADH + H⁺","e":"G3P dehydrogenase","tok":"+1 NADH each; Pᵢ added"},{"n":7,"r":"1,3-bisphosphoglycerate + ADP → 3-phosphoglycerate + ATP","e":"phosphoglycerate kinase","tok":"+1 ATP each"},{"n":8,"r":"3-phosphoglycerate → 2-phosphoglycerate","e":"mutase","tok":"phosphate moves"},{"n":9,"r":"2-phosphoglycerate → phosphoenolpyruvate (PEP) + H₂O","e":"enolase","tok":"water removed"},{"n":10,"r":"PEP + ADP → pyruvate + ATP","e":"pyruvate kinase","tok":"+1 ATP each"}],"stages":[{"n":1,"name":"Prime","t":"steps 1–3: −2 ATP"},{"n":2,"name":"Split","t":"steps 4–5: 2 G3P"},{"n":3,"name":"Oxidize","t":"step 6: 2 NADH"},{"n":4,"name":"Pay off","t":"steps 7–10: +4 ATP, 2 pyruvate"}],"predictions":[{"id":"p1","prompt":"All-10 view, 1 glucose: step to the end of step 3. What is the net ATP so far?","options":[{"t":"−1","_n":"ocf7","_k":"a91dc80b"},{"t":"0","_n":"pd07","_k":"5b6a174f"},{"t":"+2","_n":"qd17","_k":"10e8fb9f"},{"t":"−2","_n":"rca7","_k":"cf47f8c2"}],"explain":"Steps 1 and 3 each spend one ATP to prime the sugar.","reveal":"The ATP strip shows 2 spent, 0 made: net −2.","start":{"view":"all","pos":0,"spot":"none","block":"none"},"to":3},{"id":"p2","prompt":"Step 4. What happens to the 6-carbon sugar?","options":[{"t":"It loses a CO₂","_n":"scb7","_k":"ae093bf3"},{"t":"It splits into six 1-carbon pieces","_n":"td87","_k":"d11588fb"},{"t":"It splits into two 3-carbon sugars","_n":"ud77","_k":"83f0d476"},{"t":"It becomes pyruvate","_n":"vd67","_k":"ed3a0f67"}],"explain":"From here, every step happens twice per glucose.","reveal":"Aldolase split the sugar into DHAP + G3P; then step 5 turned the DHAP into a second G3P.","start":{"view":"all","pos":3,"spot":"none","block":"none"},"to":5},{"id":"p3","prompt":"Spotlight Phosphate; step 6. Where does the new phosphate at step 6 come from?","options":[{"t":"NADH","_n":"wd57","_k":"fe7aedf9"},{"t":"Inorganic phosphate (Pᵢ) in the cytosol","_n":"xd47","_k":"29aebbe8"},{"t":"An ATP molecule","_n":"yd37","_k":"665ae461"},{"t":"Pyruvate","_n":"zd27","_k":"7d5ff29f"}],"explain":"The energy from oxidizing G3P powers adding a free phosphate. No ATP is spent at step 6.","reveal":"A grey Pᵢ joined each G3P as NADH was loaded. The ATP spent is still 2.","start":{"view":"all","pos":5,"spot":"phosphate","block":"none"},"to":6},{"id":"p4","prompt":"Block step 10; run 1 glucose. What is the net ATP per glucose now?","options":[{"t":"−2","_n":"10d17","_k":"35560fa9"},{"t":"0","_n":"11d07","_k":"df30673e"},{"t":"2","_n":"12cf7","_k":"075d301d"},{"t":"4","_n":"13466","_k":"39c6e26a"}],"explain":"Step 7 pays back the investment, but step 10’s 2 ATP never come.","reveal":"Steps 1–9 ran; the counter reads spent 2, made 2: net 0.","start":{"view":"all","pos":0,"spot":"none","block":"10"},"to":10}],"challenges":[{"id":"tc1","goal":[2,3],"prompt":"Step forward to the exact moment the net ATP first returns to 0.","why":"Steps 1 and 3 spent 2 ATP. Step 7 makes 2 ATP, one per 3C piece, so the net is back to 0.","general":"Use the All 10 steps view with 1 glucose, and watch the net ATP counter as you step.","named":{"view":"Switch the view to “All 10 steps” first.","g":"Use 1 glucose.","block":"Set “Block a step” to none first.","s6":"Step 6 makes NADH, not ATP.","s10":"By then the net is +2.","late":"The net is 0 here, but it got back to 0 at an earlier step. Step back.","start":"Nothing has happened yet. Step forward.","neg":"The net is still negative. Keep stepping."},"hints":["Net starts at −2 after step 3.","Which is the first step that makes ATP?","Step 7 makes 2 ATP (one per 3C piece): net 0."]},{"id":"tc2","goal":2,"prompt":"Run 3 glucose with plenty of NAD⁺. Enter the totals: NADH, net ATP, pyruvate.","why":"Per glucose: 2 NADH, net 2 ATP, 2 pyruvate. × 3: 6, 6, 6.","general":"Find the per-glucose values first, then multiply by 3.","named":{"blank":"Type all three totals (NADH, net ATP, pyruvate) in the answer boxes for challenge 2.","nadh":"2 NADH per glucose, one per G3P.","atp":"That’s the ATP made. Subtract the 6 spent.","pyr":"2 pyruvate per glucose."},"hints":["Find the per-glucose values first.","Per glucose: 2 NADH, net 2 ATP, 2 pyruvate.","× 3: 6, 6, 6."]},{"id":"tc3","goal":6,"stretch":true,"prompt":"Limited pool of \u003cstrong>8 NAD⁺\u003c/strong>, nothing regenerates it. Glucose keeps arriving, but you choose how many to let in. Find the number of glucose that gives the \u003cstrong>largest net ATP\u003c/strong>, and enter that net ATP.","why":"8 NAD⁺ ÷ 2 = 4 glucose can finish, and 4 × net 2 = 8 ATP. A fifth glucose would spend 2 ATP and then stall at step 6.","general":"Each glucose needs 2 NAD⁺. Set the number of glucose that uses the pool exactly, then enter the net ATP.","named":{"pool":"Choose “Limited pool” and set the pool to 8 NAD⁺.","g5":"The fifth glucose is primed with 2 ATP, then stalls at step 6 with no NAD⁺. Letting it in costs you.","g8":"Each glucose needs 2 NAD⁺, so the pool runs out after 4.","blank":"Type the net ATP in the answer box for challenge 3.","e16":"16 is the ATP made; 8 were spent."},"hints":["How many NAD⁺ does each glucose need?","2 each: 8 ÷ 2 = 4 glucose can finish.","4 × net 2 = 8 ATP. A fifth glucose would spend 2 ATP and get stuck: net 6."]}]},"part3":{"slug":"phosphorylation","name":"Two ways","heading":"Two ways to make ATP","intro":"Glycolysis makes its ATP one way; later stages make most of the cell’s ATP another way. Zoom in on each, fill in the comparison table, then check with data how the cell turns glycolysis up and down at phosphofructokinase (PFK).","st1":{"title":"Station 1: Zoom to the molecules (substrate-l hN+EAFSFRhUSlYOARBOCRdDUBBERBNKWRoXTkZVCl1UR0cNChASSlZdRhILQhIYVl1RQgdYA1VeXEYPC0MPSxVu","fb":"Substrate-level: glycolysis and the Krebs cycle. Oxidative: the electron transport chain and chemiosmosis."},{"id":"r6","t":"ATP per glucose (textbook)","_a":"bkBQEkoa1bq9QlcCRGU=","fb":"Substrate-level: 4 (net 2 in glycolysis + 2 in the Krebs cycle). Oxidative: about 32."}],"done":"✓ Table complete. Glycolysis makes its ATP only by substrate-level phosphorylation."},"st3":{"title":"Station 3: Check it with data (control at PFK)","how":"Move the probe along the fructose-6-phosphate axis and read PFK’s activity under three conditions. Tap a condition to see what is bound to PFK.","text":"PFK is the “gatekeeper”: step 3 commits the sugar to glycolysis. ATP binds an allosteric site and slows PFK; AMP (a sign of low energy) reverses that.","link":"This is feedback inhibition, as in \u003ca href=\"10-introduction-to-metabolism.html#enzymes\">module 10’s enzyme stations\u003c/a>: a product of the pathway (ATP) slows an early enzyme.","conds":[{"id":"low","t":"Low ATP","d":"PFK is free: its active site is open."},{"id":"high","t":"High ATP","d":"ATP sits in PFK’s allosteric site, so the active site is partly shut."},{"id":"amp","t":"High ATP + high AMP","d":"AMP binds too and reverses ATP’s effect, so the active site reopens."}],"model":"Model curves (activity as % of the maximum): low ATP levels off at 100%, high ATP at 30%, high ATP + high AMP at 85%."},"quickCheck":{"title":"Two ways quick check","summary":"Two ways quick check","items":[{"id":"q1","goal":4,"prompt":"How is ATP made at step 10 of glycolysis?","choices":[{"t":"substrate-level phosphorylation","fb":"PEP hands its phosphate straight to ADP.","_n":"14476","_k":"017384d7"},{"t":"oxidative phosphorylation","fb":"PEP hands its phosphate straight to ADP.","_n":"15446","_k":"892d1e4e"},{"t":"photophosphorylation","fb":"PEP hands its phosphate straight to ADP.","_n":"16456","_k":"9b7ca274"},{"t":"by NADH directly","fb":"PEP hands its phosphate straight to ADP.","_n":"17426","_k":"ab8a588a"}]},{"id":"q2","goal":4,"prompt":"Which needs an H⁺ gradient across a membrane?","choices":[{"t":"neither","fb":"Substrate-level phosphorylation needs only the enzyme and a phosphorylated substrate.","_n":"18436","_k":"19a7849c"},{"t":"substrate-level phosphorylation","fb":"Substrate-level phosphorylation needs only the enzyme and a phosphorylated substrate.","_n":"19406","_k":"9ff2e4e6"},{"t":"both","fb":"Substrate-level phosphorylation needs only the enzyme and a phosphorylated substrate.","_n":"1a416","_k":"4f407bbb"},{"t":"oxidative phosphorylation","fb":"Substrate-level phosphorylation needs only the enzyme and a phosphorylated substrate.","_n":"1b4e6","_k":"bfcd5a1b"}]},{"id":"q3","goal":5,"prompt":"On the graph, PFK activity at 6 mM fructose-6-phosphate is 100% at low ATP and about 30% at high ATP. What does high ATP do?","choices":[{"t":"activates PFK","fb":"Plenty of ATP → slow glycolysis down.","_n":"1c4f6","_k":"f7610dea"},{"t":"destroys PFK","fb":"Plenty of ATP → slow glycolysis down.","_n":"1d4c6","_k":"7d659348"},{"t":"has no effect","fb":"Plenty of ATP → slow glycolysis down.","_n":"1e4b6","_k":"62844870"},{"t":"inhibits PFK","fb":"Plenty of ATP → slow glycolysis down.","_n":"1f4e6","_k":"5a16cf87"}]},{"id":"q4","goal":5,"prompt":"Why is step 3 a good place to control glycolysis?","choices":[{"t":"it’s the first step that commits sugar to glycolysis","fb":"Controlling an early, committed step avoids piling up intermediates.","_n":"1g4d6","_k":"0b280c47"},{"t":"it makes the most ATP","fb":"Controlling an early, committed step avoids piling up intermediates.","_n":"1h506","_k":"9e9f0428"},{"t":"it uses O₂","fb":"Controlling an early, committed step avoids piling up intermediates.","_n":"1i4f6","_k":"8fd1dce8"},{"t":"it’s the last step","fb":"Controlling an early, committed step avoids piling up intermediates.","_n":"1j526","_k":"df1743ec"}]}]}},"practice":{"activities":[{"id":"order","type":"custom","title":"Put glycolysis in order","summary":"Put glycolysis in order","goal":[1,3],"instruction":"Two sequences. Put each set of steps in the order they happen.","sequences":[{"id":"sA","goal":[1,3],"prompt":"The investment phase.","steps":["Glucose enters the cell and is phosphorylated, using 1 ATP.","The sugar is rearranged from glucose-6-phosphate to fructose-6-phosphate.","PFK adds a second phosphate, using another ATP.","The 6-carbon sugar splits into two 3-carbon sugars.","DHAP is converted, so both pieces are G3P."],"start":[3,0,4,2,1],"wrongIf":[{"before":[3,2],"fb":"The sugar is only split after \u003cem>both\u003c/em> phosphates are on: fructose-1,6-\u003cem>bis\u003c/em>phosphate."}],"why":"Phosphorylate, rearrange, phosphorylate again, split, then convert DHAP: two G3P, and 2 ATP spent.","hints":["What has to happen to the sugar before it can split?","Both phosphates go on (steps 1 and 3) before the split.","Phosphorylate → rearrange → phosphorylate again → split → convert DHAP."]},{"id":"sB","goal":[1,3],"prompt":"The payoff phase, for one G3P.","steps":["G3P is oxidized: NAD⁺ → NADH, and a free Pᵢ is added.","A phosphate moves to ADP, making the first ATP.","The remaining phosphate moves to a different carbon.","Water is removed, forming PEP.","PEP gives its phosphate to ADP, making pyruvate and a second ATP."],"start":[2,4,0,3,1],"wrongIf":[{"before":[1,0],"fb":"Oxidation comes first; it adds the phosphate that step 7 then gives to ADP."},{"before":[4,3],"fb":"PEP must form first; then pyruvate kinase acts."}],"why":"Oxidize, make ATP, shift the phosphate, remove water, make the second ATP: 1 NADH and 2 ATP per G3P.","hints":["What does G3P dehydrogenase do?","It oxidizes G3P first.","Oxidize → ATP → shift → water out → ATP."]}]},{"id":"acct","type":"custom","title":"Accounting and control","summary":"Accounting and control","star":true,"goal":[2,5,6],"instruction":"Seven items. Type a number (use − for a negative) or tap a chip. Items 4–7 are non-routine (★); 6 and 7 go beyond the Final Check.","items":[{"id":"a1","kind":"num","goal":2,"prompt":"Net ATP from glycolysis for 5 glucose?","_a":"BFI=","display":"10 ATP","unit":"ATP","why":"2 net ATP per glucose × 5 = 10.","wrong":[{"match":20,"fb":"That’s the ATP made; 10 were spent."}]},{"id":"a2","kind":"num","goal":2,"prompt":"ATP invested for 5 glucose?","_a":"BFI=","display":"10 ATP","unit":"ATP","why":"2 ATP invested per glucose × 5 = 10.","wrong":[{"match":5,"fb":"2 per glucose."}]},{"id":"a3","kind":"num","goal":2,"prompt":"NAD⁺ needed for 5 glucose?","_a":"BFI=","display":"10 NAD⁺","unit":"NAD⁺","why":"One NAD⁺ per G3P, two G3P per glucose: 2 × 5 = 10.","wrong":[{"match":5,"fb":"One per G3P, two G3P per glucose."}]},{"id":"a4","kind":"num","goal":6,"star":true,"prompt":"If step 7 were blocked, what is the net ATP per glucose?","_a":"GFA=","display":"−2 ATP","unit":"ATP","why":"2 ATP were spent in steps 1 and 3, and nothing is paid back: net −2.","wrong":[{"match":0,"fb":"Step 7 never runs, so step 10 is never reached: nothing is paid back."},{"match":2,"fb":"Nothing is paid back, so the 2 ATP spent count against you: use a minus sign."}]},{"id":"a5","kind":"num","goal":2,"star":true,"prompt":"Glucose units from glycogen enter as glucose-6-phosphate, with no ATP spent on that phosphate. Net ATP per glucose unit?","_a":"Bg==","display":"3 ATP","unit":"ATP","why":"Only step 3 spends ATP now: 4 − 1 = 3.","wrong":[{"match":2,"fb":"Only step 3 spends ATP now: 4 − 1 = 3."}],"hints":["Which step’s ATP is skipped?","Step 1.","Spent 1, made 4: net 3."]},{"id":"a6","kind":"pair","goal":2,"star":true,"prompt":"Glycerol (from fat) is converted to DHAP, using 1 ATP and loading 1 NADH (model). From one glycerol to pyruvate, what is the net ATP and the total NADH?","labels":["Net ATP","Total NADH"],"units":["ATP","NADH"],"_a":"blNIAjs=","display":"net 1 ATP; 2 NADH","why":"−1 ATP, then one G3P’s payoff: +2 ATP and +1 NADH. Net ATP 2 − 1 = 1; NADH 1 + 1 = 2.","general":"−1 ATP, then one G3P’s payoff: +2 ATP and +1 NADH. Plus the NADH from making DHAP.","hints":["Count the investment: 1 ATP for glycerol → DHAP.","DHAP → G3P → one pass of steps 6–10: +1 NADH, +2 ATP.","Net ATP 2 − 1 = 1; NADH 1 + 1 = 2."]},{"id":"a7","kind":"chips","goal":5,"star":true,"prompt":"A muscle at rest has high ATP and high citrate. Predict PFK activity and the rate of glycolysis.","options":[{"t":"PFK activated; glycolysis speeds up","why":"Both are signals of plenty; both inhibit PFK.","_n":"1k516","_k":"1dbf20d2"},{"t":"PFK inhibited; glycolysis slows","why":"Both are signals of plenty; both inhibit PFK.","_n":"1l446","_k":"19e7dd98"},{"t":"PFK inhibited; glycolysis speeds up","why":"PFK controls step 3, so when it slows, the whole pathway slows.","_n":"1m436","_k":"7bff10b5"},{"t":"PFK unchanged; glycolysis unchanged","why":"Both are signals of plenty; both inhibit PFK.","_n":"1n3a6","_k":"19e12265"}],"display":"PFK inhibited; glycolysis slows","why":"Both are signals of plenty; both inhibit PFK."}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Freya","how":"","instruction":"Freya made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the net ATP from glycolysis per glucose.","steps":["Glucose is split into two 3-carbon molecules.","Each 3-carbon molecule makes 2 ATP in the payoff phase.","So glycolysis makes 4 ATP.","So the net yield is 4 ATP per glucose."],"_a":"Bg==","stepFb":["Step 1 is correct.","Step 2 is correct.","4 are made: correct so far.",""],"fixes":[{"t":"Step 4 is correct.","why":"4 ATP are made, but 2 were spent in steps 1 and 3: net 2.","_n":"1o3b6","_k":"30789cc7"},{"t":"Two ATP were spent in the investment phase (steps 1 and 3), so the net is 4 − 2 = 2 ATP.","why":"4 ATP are made, but 2 were spent in steps 1 and 3: net 2.","_n":"1p3c6","_k":"e2901b32"},{"t":"The net is 8 ATP, because there are two molecules.","why":"The 4 already counts both.","_n":"1q3d6","_k":"6d603efb"},{"t":"The net is 36 ATP.","why":"That’s for all of respiration.","_n":"1r3e6","_k":"ff61a9a5"}],"hints":["Were any ATP spent?","Steps 1 and 3.","The fix that says two ATP were spent in the investment phase."]},{"id":"e2","goal":1,"task":"Explain why glycolysis stops in a cell with no O₂ and no fermentation.","steps":["Without O₂, the electron transport chain stops.","Glycolysis uses O₂ at step 6.","Without O₂, step 6 can’t happen.","So glycolysis stops at G3P."],"_a":"BA==","stepFb":["Step 1 is correct.","","This follows from step 2. The mistake is earlier.","The conclusion is right, but the reason in step 2 is wrong."],"fixes":[{"t":"Glycolysis uses O₂ at step 3.","why":"Glycolysis is in the cytosol and uses no O₂. It needs NAD⁺, which O₂ helps regenerate later.","_n":"1s3f6","_k":"3fd85d87"},{"t":"Step 2 is correct.","why":"Glycolysis is in the cytosol and uses no O₂. It needs NAD⁺, which O₂ helps regenerate later.","_n":"1t406","_k":"469db2e7"},{"t":"Glycolysis never stops; it doesn’t need anything.","why":"It needs NAD⁺.","_n":"1u416","_k":"731385ef"},{"t":"Step 6 needs NAD⁺, not O₂. Without O₂ the chain can’t regenerate NAD⁺ from NADH, so NAD⁺ runs out and glycolysis stalls at step 6.","why":"Glycolysis is in the cytosol and uses no O₂. It needs NAD⁺, which O₂ helps regenerate later.","_n":"1v426","_k":"e0a6d084"}],"hints":["What does step 6 actually need?","NAD⁺.","The fix that says step 6 needs NAD⁺, not O₂."]},{"id":"e3","goal":4,"task":"Describe how glycolysis makes ATP.","steps":["In the payoff phase, ATP is formed from ADP.","The phosphate comes from a phosphorylated intermediate, such as PEP.","ATP synthase in the cytosol joins the phosphate to ADP, powered by an H⁺ gradient.","This is oxidative phosphorylation."],"_a":"Bw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","This follows from step 3. The mistake is earlier."],"fixes":[{"t":"NADH donates the phosphate.","why":"NADH carries electrons, not phosphate.","_n":"1w436","_k":"a8d79757"},{"t":"An enzyme (a kinase) transfers the phosphate directly from the substrate to ADP: substrate-level phosphorylation. No gradient or ATP synthase is involved.","why":"In glycolysis an enzyme transfers a phosphate from a substrate to ADP: substrate-level phosphorylation. No gradient, no ATP synthase.","_n":"1x406","_k":"8fad28b8"},{"t":"The phosphate comes from O₂.","why":"O₂ has no phosphate.","_n":"1y3f6","_k":"a0227fd1"},{"t":"Step 3 is correct.","why":"In glycolysis an enzyme transfers a phosphate from a substrate to ADP: substrate-level phosphorylation. No gradient, no ATP synthase.","_n":"1z3e6","_k":"be7302cd"}],"hints":["Is there a membrane gradient in the cytosol?","No.","The fix that says a kinase transfers the phosphate directly from the substrate to ADP."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the stepper: that the cell spends ATP first, or that letting in an extra glucose can lose ATP?"},{"id":"j2","q":"In your own words, why does step 6 decide whether glycolysis keeps going?"},{"id":"j3","q":"Explain to a friend the difference between substrate-level and oxidative phosphorylation."},{"id":"j4","q":"Which part of glycolysis is still fuzzy: the steps, the accounting or the control? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"What is the net ATP yield of glycolysis per glucose?","options":[{"t":"0","why":"The payoff exceeds the investment.","_n":"203d6","_k":"d15e9173"},{"t":"2","why":"4 made − 2 spent.","_n":"21446","_k":"5a1cdc9c"},{"t":"4","why":"That’s the ATP made, before subtracting the investment.","_n":"22436","_k":"9831631b"},{"t":"36","why":"That’s for all of respiration (textbook).","_n":"23426","_k":"898c0b0b"}]},"b":{"prompt":"How many NADH does glycolysis load per glucose?","options":[{"t":"1","why":"There are two G3P per glucose.","_n":"24416","_k":"5ef05607"},{"t":"2","why":"One per G3P.","_n":"25486","_k":"47892404"},{"t":"4","why":"That’s the ATP made.","_n":"26476","_k":"1916663b"},{"t":"10","why":"That’s for all of respiration.","_n":"274e8","_k":"7a4a06e6"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"How many ATP are spent in the investment phase of glycolysis?","options":[{"t":"0","why":"Priming the sugar costs ATP.","_n":"284f8","_k":"7f3858e2"},{"t":"1","why":"Two separate steps each spend one.","_n":"294c8","_k":"f798c70e"},{"t":"2","why":"Steps 1 and 3.","_n":"2a4d8","_k":"cf67b80e"},{"t":"4","why":"4 are made in the payoff phase.","_n":"2b528","_k":"c8ec7653"}]},"b":{"prompt":"How many ATP are made in the payoff phase per glucose?","options":[{"t":"2","why":"2 is the \u003cem>net\u003c/em>; or the count for one G3P.","_n":"2c538","_k":"cbe61b57"},{"t":"4","why":"2 per G3P × 2.","_n":"2d508","_k":"9df28a88"},{"t":"8","why":"2 per G3P, not 4.","_n":"2e518","_k":"a3184797"},{"t":"36","why":"All of respiration.","_n":"2f468","_k":"9bda6f04"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Glycolysis makes ATP by…","options":[{"t":"photophosphorylation","why":"That’s in chloroplasts, using light.","_n":"2g478","_k":"96537d24"},{"t":"the hydrolysis of NADH","why":"NADH isn’t hydrolyzed to make ATP.","_n":"2h548","_k":"f1ba4a13"},{"t":"substrate-level phosphorylation","why":"An enzyme moves a phosphate from a substrate straight to ADP (steps 7 and 10).","_n":"2i538","_k":"3d5784ce"},{"t":"oxidative phosphorylation","why":"In glycolysis an enzyme transfers a phosphate from a substrate to ADP: substrate-level phosphorylation. No gradient, no ATP synthase.","_n":"2j568","_k":"6abaf1af"}]},"b":{"prompt":"In substrate-level phosphorylation, the phosphate added to ADP comes from…","options":[{"t":"a phosphorylated substrate, transferred by an enzyme","why":"The enzyme moves it straight from the substrate to ADP: no gradient needed.","_n":"2k558","_k":"5453ed26"},{"t":"NADH","why":"NADH carries electrons.","_n":"2l508","_k":"8864d763"},{"t":"an H⁺ gradient through ATP synthase","why":"In glycolysis an enzyme transfers a phosphate from a substrate to ADP: substrate-level phosphorylation. No gradient, no ATP synthase.","_n":"2m4f8","_k":"539b6a1f"},{"t":"O₂","why":"O₂ has no phosphate.","_n":"2n528","_k":"808c9f17"}]}},{"id":"t1","cat":"T","goal":6,"a":{"prompt":"A toxin blocks G3P dehydrogenase (step 6). Per glucose that enters, what is the net ATP, and what builds up?","options":[{"t":"Net 0 ATP; NADH builds up","why":"Step 6 is where NADH is made, so no NADH forms.","_n":"2o518","_k":"1b331ba9"},{"t":"Net 2 ATP; pyruvate builds up","why":"If the payoff steps are blocked, the 2 ATP invested aren’t paid back: the net can be 0 or even −2.","_n":"2p4c8","_k":"6f2cff8f"},{"t":"Net −2 ATP; G3P (and the steps before it) build up","why":"The 2 ATP invested are never paid back.","_n":"2q4b8","_k":"02e7b1e4"},{"t":"Net 4 ATP; G3P builds up","why":"4 ATP are made, but 2 were spent in steps 1 and 3: net 2.","_n":"2r6a1","_k":"83012d7e"}]},"b":{"prompt":"A toxin blocks pyruvate kinase (step 10). Per glucose, what is the net ATP, and what builds up?","options":[{"t":"Net 2 ATP; pyruvate builds up","why":"If the payoff steps are blocked, the 2 ATP invested aren’t paid back: the net can be 0 or even −2.","_n":"2s691","_k":"0ddd3b07"},{"t":"Net 4 ATP; PEP builds up","why":"4 ATP are made, but 2 were spent in steps 1 and 3: net 2.","_n":"2t681","_k":"e800acf9"},{"t":"Net −2 ATP; G3P builds up","why":"Steps 6 and 7 still run.","_n":"2u671","_k":"415dab6f"},{"t":"Net 0 ATP; PEP builds up","why":"Step 7 repays the 2 ATP; step 10’s 2 ATP are lost.","_n":"2v661","_k":"4b72199a"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"A cell has a pool of 10 NAD⁺, no O₂ and no fermentation. How many glucose can fully pass through glycolysis, and what is the total net ATP?","options":[{"t":"Unlimited, because glycolysis doesn’t need O₂","why":"It needs NAD⁺.","_n":"2w651","_k":"dd2e6ecf"},{"t":"10 glucose; 20 ATP","why":"Each glucose uses 2 NAD⁺, not 1.","_n":"2x641","_k":"a0d8d911"},{"t":"5 glucose; 10 ATP","why":"2 NAD⁺ per glucose; 2 net ATP each.","_n":"2y631","_k":"e5a81a84"},{"t":"5 glucose; 20 ATP","why":"20 is the ATP made; the net is 10.","_n":"2z621","_k":"6c6e406d"}]},"b":{"prompt":"A cell has a pool of 14 NAD⁺, no O₂ and no fermentation. How many glucose can fully pass through glycolysis, and what is the total net ATP?","options":[{"t":"7 glucose; 28 ATP","why":"28 is the ATP made; the net is 14.","_n":"30611","_k":"4de171cf"},{"t":"7 glucose; 14 ATP","why":"2 NAD⁺ per glucose; 2 net ATP each.","_n":"31641","_k":"fd26257c"},{"t":"14 glucose; 28 ATP","why":"Everything after the split happens twice per glucose. Each glucose uses 2 NAD⁺, not 1.","_n":"32651","_k":"43fcde85"},{"t":"Unlimited","why":"It needs NAD⁺.","_n":"33661","_k":"c93f830f"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A molecule enters glycolysis already as G3P, with no ATP spent. From one G3P to pyruvate, how many ATP and NADH form?","options":[{"t":"4 ATP and 2 NADH","why":"That’s for a whole glucose (two G3P).","_n":"34671","_k":"ba89e959"},{"t":"0 ATP and 1 NADH","why":"Steps 7 and 10 each make an ATP.","_n":"35601","_k":"74deb3c7"},{"t":"2 ATP and 1 NADH","why":"One pass of steps 6–10.","_n":"36611","_k":"f2bc8162"},{"t":"2 ATP and 0 NADH","why":"Step 6 loads an NADH.","_n":"37621","_k":"2a328597"}]},"b":{"prompt":"Glucose units from glycogen enter as glucose-6-phosphate, with no ATP spent on that phosphate. What is the net ATP per glucose unit from glycolysis?","options":[{"t":"1","why":"4 made, 1 spent.","_n":"38631","_k":"9ade4a01"},{"t":"2","why":"Step 1’s ATP is skipped.","_n":"395c1","_k":"03c860b5"},{"t":"3","why":"Only step 3 spends ATP: 4 − 1.","_n":"3a5d1","_k":"2076fb5d"},{"t":"4","why":"Step 3 still spends one.","_n":"3bd61","_k":"e4ccc8b0"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why the cell spends 2 ATP at the start of glycolysis?","options":[{"t":"“The ATP provides the phosphates that are later given back as 4 ATP.”","why":"Two of the four phosphates come from free Pᵢ at step 6.","_n":"3cd51","_k":"1aba2a9e"},{"t":"“ATP is spent because glycolysis is endergonic overall.”","why":"Overall, glycolysis releases free energy.","_n":"3dd81","_k":"07de4d08"},{"t":"“The ATP is needed to supply oxygen.”","why":"Glycolysis is in the cytosol and uses no O₂. It needs NAD⁺, which O₂ helps regenerate later.","_n":"3ed71","_k":"ade1389a"},{"t":"“Adding phosphates traps glucose in the cell and makes it unstable enough to split into two 3-carbon pieces, which then repay the investment.”","why":"It says what the phosphates do (trap and prime the sugar) and why the cost is worth it.","_n":"3fd21","_k":"e4ae7033"}]},"b":{"prompt":"Which is the best description of substrate-level phosphorylation?","options":[{"t":"“NADH gives its phosphate to ADP.”","why":"NADH has no phosphate to give.","_n":"3gd11","_k":"aac40b0e"},{"t":"“An enzyme transfers a phosphate group directly from a high-energy substrate molecule to ADP.”","why":"That’s what happens at steps 7 and 10.","_n":"3hd41","_k":"643e622b"},{"t":"“Light energy joins Pᵢ to ADP.”","why":"That’s photophosphorylation.","_n":"3id31","_k":"c40926d2"},{"t":"“H⁺ flows through ATP synthase, joining Pᵢ to ADP.”","why":"In glycolysis an enzyme transfers a phosphate from a substrate to ADP: substrate-level phosphorylation. No gradient, no ATP synthase.","_n":"3jde1","_k":"253237eb"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which is the correct net equation for glycolysis?","options":[{"t":"glucose + 2 NADH → 2 pyruvate + 2 NAD⁺ + 2 ATP","why":"NAD⁺ is the input; NADH the output.","_n":"3kdd1","_k":"0eb074d3"},{"t":"glucose → 2 pyruvate + 4 ATP + 2 NADH","why":"Net ATP is 2.","_n":"3ld01","_k":"66a1e688"},{"t":"glucose + 6O₂ → 2 pyruvate + 2 ATP","why":"Glycolysis uses no O₂.","_n":"3md11","_k":"868ae8c8"},{"t":"glucose + 2 NAD⁺ + 2 ADP + 2 Pᵢ → 2 pyruvate + 2 NADH + 2 H⁺ + 2 ATP + 2 H₂O","why":"Every input and output per glucose, with the net 2 ATP.","_n":"3nce1","_k":"3fac5a61"}]},"b":{"prompt":"Which statement about glycolysis and O₂ is correct?","options":[{"t":"“Glycolysis runs forever without O₂.”","why":"It needs NAD⁺ back.","_n":"3ocf1","_k":"cc5dbe20"},{"t":"“Glycolysis happens only when O₂ is absent.”","why":"It runs with or without O₂.","_n":"3pd41","_k":"76838670"},{"t":"“Glycolysis uses no O₂, but it can only continue for long if NAD⁺ is regenerated, by the chain (with O₂) or by fermentation.”","why":"Step 6 needs NAD⁺, not O₂.","_n":"3qd51","_k":"52726073"},{"t":"“Glycolysis needs O₂ at step 6.”","why":"Glycolysis is in the cytosol and uses no O₂. It needs NAD⁺, which O₂ helps regenerate later.","_n":"3rd21","_k":"e6199904"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"In a PET scan, patients receive FDG, a radioactive glucose look-alike. Hexokinase phosphorylates it (step 1), but the next enzyme can’t use it, so it’s trapped. Why do many tumours show up brightly?","options":[{"t":"Tumour cells take up and phosphorylate glucose very fast, so FDG builds up in them","why":"Many cancer cells rely heavily on glycolysis.","_n":"3sd31","_k":"f1c7753f"},{"t":"Tumours have no hexokinase","why":"Without hexokinase, FDG wouldn’t be trapped.","_n":"3td81","_k":"565610f8"},{"t":"FDG is oxidized by the tumour’s chain","why":"FDG stops at step 1.","_n":"3ud91","_k":"74f219f8"},{"t":"Tumours make FDG themselves","why":"FDG is given to the patient.","_n":"3vd20","_k":"b33801bb"}]},"b":{"prompt":"During a sprint, AMP rises sharply in muscle cells. What happens to glycolysis?","options":[{"t":"Nothing; PFK isn’t regulated","why":"PFK is the main control point.","_n":"3wd10","_k":"3f2a0e81"},{"t":"Glycolysis moves into the mitochondria","why":"Glycolysis is in the cytosol and uses no O₂. It needs NAD⁺, which O₂ helps regenerate later.","_n":"3xd00","_k":"aa2fa5d7"},{"t":"AMP activates PFK, so glycolysis speeds up","why":"AMP signals low energy and reverses ATP’s inhibition.","_n":"3ycf0","_k":"b564a11e"},{"t":"AMP inhibits PFK, so glycolysis slows","why":"High ATP means the cell has plenty, so ATP inhibits PFK and glycolysis slows. That’s feedback inhibition. AMP is the opposite signal: low energy.","_n":"3zd60","_k":"698cbfc3"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A well-fed liver cell at rest has high ATP. What happens at PFK, and why is this useful?","options":[{"t":"ATP inhibits PFK, slowing glycolysis, so glucose can be stored instead of burned","why":"Plenty of ATP is the signal to slow down.","_n":"40d50","_k":"d84d7270"},{"t":"ATP activates PFK, so glycolysis speeds up","why":"High ATP means the cell has plenty, so ATP inhibits PFK and glycolysis slows. That’s feedback inhibition.","_n":"41d40","_k":"8ecc5853"},{"t":"ATP denatures PFK permanently","why":"The inhibition is reversible.","_n":"42d30","_k":"e7a763ef"},{"t":"Nothing changes until O₂ runs out","why":"ATP itself is the signal.","_n":"43da0","_k":"ad927cb4"}]},"b":{"prompt":"Citrate (from the Krebs cycle) builds up when the Krebs cycle is running at full speed. What does citrate do to glycolysis?","options":[{"t":"It activates PFK","why":"High ATP means the cell has plenty, so ATP inhibits PFK and glycolysis slows. That’s feedback inhibition.","_n":"44d90","_k":"afdc730b"},{"t":"It replaces NAD⁺ at step 6","why":"Citrate isn’t an electron carrier.","_n":"45cc0","_k":"432e5009"},{"t":"It inhibits PFK, slowing glycolysis so pyruvate doesn’t pile up","why":"Citrate, like ATP, is a sign of plenty.","_n":"46cd0","_k":"01d62a06"},{"t":"It has no effect","why":"Citrate is an allosteric inhibitor of PFK.","_n":"47ce0","_k":"d1651021"}]}}]},"task":{"title":"Sprint budget","summary":"Sprint budget","statement":"\u003cp>A sprinting muscle cell processes \u003ci>g\u003c/i> glucose per second through glycolysis. Every glucose uses 2 NAD⁺, which must be regenerated, either by the electron transport chain (limited by O₂) or by turning pyruvate into lactate. Design a budget that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"gl-conds\">\u003cli>NAD⁺ is balanced: the NAD⁺ regenerated each second equals the NAD⁺ used (\u003ci>e\u003c/i> + \u003ci>f\u003c/i> = 2\u003ci>g\u003c/i>).\u003c/li>\u003cli>Glycolysis makes at least 8 net ATP per second.\u003c/li>\u003cli>O₂ is limited: the chain can regenerate at most 4 NAD⁺ per second.\u003c/li>\u003cli>Lactate is limited: at most 6 lactate per second (each regenerates one NAD⁺).\u003c/li>\u003c/ol>","inputs":{"g":"\u003ci>g\u003c/i>: glucose per second","e":"\u003ci>e\u003c/i>: NAD⁺ per second regenerated by the chain","f":"\u003ci>f\u003c/i>: NAD⁺ per second regenerated by lactate formation"},"modelNote":"The O₂ and lactate limits are model values.","checks":["NAD⁺ balanced","At least 8 ATP per second","O₂ limit","Lactate limit"],"tips":["Each glucose uses 2 NAD⁺; regenerate exactly that many.","Net ATP from glycolysis is 2 per glucose.","The chain can’t regenerate more than 4 per second here. Let fermentation do the rest.","Too much lactate: use the chain’s full 4, or process less glucose."],"explainPrompt":"Explain why the cell must regenerate exactly as much NAD⁺ as glycolysis uses, and what limits a sprint.","vocab":"Use the words NAD⁺, NADH, glycolysis, fermentation and electron transport chain.","allFound":"You’ve found all four answers. To make 12 ATP per second (6 glucose) you’d need 12 NAD⁺ back each second, but O₂ and lactate limits cap you at 10. That’s one reason a sprint can’t last."},"cards":[["Glycolysis","Cytosol; no O₂; glucose (6C) → 2 pyruvate (3C)."],["Net yield","2 ATP, 2 NADH, 2 pyruvate per glucose (4 ATP made − 2 spent)."],["Investment phase","Steps 1–5: 2 ATP spent (hexokinase, PFK); sugar splits into 2 G3P."],["Payoff phase","Steps 6–10, twice per glucose: 1 NADH and 2 ATP per G3P."],["Step 6","G3P + NAD⁺ + Pᵢ → 1,3-bisphosphoglycerate + NADH + H⁺. Needs NAD⁺."],["Substrate-level phosphorylation","An enzyme moves a phosphate from a substrate straight to ADP (steps 7 and 10)."],["Oxidative phosphorylation","ATP synthase makes ATP using an H⁺ gradient (the chain)."],["PFK","Step 3 enzyme; the main control point. Inhibited by ATP and citrate; activated by ADP and AMP."],["Net equation","glucose + 2 NAD⁺ + 2 ADP + 2 Pᵢ → 2 pyruvate + 2 NADH + 2 H⁺ + 2 ATP + 2 H₂O"],["Why it needs NAD⁺ back","Without NAD⁺, step 6 stops. The chain (with O₂) or fermentation regenerates it."],["Glycogen’s glucose","Enters as glucose-6-phosphate: net 3 ATP per glucose unit."],["Oldest pathway","Glycolysis happens in nearly all living things, with or without O₂."]]}};</script>
