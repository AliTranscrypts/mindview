.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 02: spectrum lab (S7), Elodea tank, chromatography lab (S9), spectrum reading, grow-light task.
   Pigment colours for chromatogram bands are depictions of the real pigments (module 02 only), always labelled. */
:root{--lp-car:var(--p-k);--lp-carotene:#D9821C;--lp-xan:#C9A40C;--lp-chla:#17876A;--lp-chlb:#869E1F;--lp-antho:#A3243F}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--lp-carotene:#F2A24A;--lp-xan:#E6CC4D;--lp-chla:#52C9A4;--lp-chlb:#B5CD52;--lp-antho:#EE8095}
}
:root[data-theme="dark"]{--lp-carotene:#F2A24A;--lp-xan:#E6CC4D;--lp-chla:#52C9A4;--lp-chlb:#B5CD52;--lp-antho:#EE8095}

/* radio groups (from SBI4U 01 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* spectrum lab */
.lp-pg .pg-ctrl{display:grid;gap:10px}
.lp-row{margin:0}
.lp-sl{margin:0}
.lp-sl input{width:100%;accent-color:var(--ink)}
.lp-sl[hidden],.lp-panel[hidden]{display:none}
.lp-sl .tiny{display:block}
.lp-panel{display:grid;gap:8px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.lp-note,.lp-mnote{margin:0}
.lp-mnote{margin-top:8px}
.lp-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;border:1px solid var(--ink-2);vertical-align:-.08em;margin-right:.35em}
.lp-tgs{display:flex;flex-wrap:wrap;gap:6px}
.lp-tg{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.3em .7em;font-size:.9rem;min-height:36px;text-align:left}
.lp-tg svg{width:28px;height:8px;flex:0 0 auto}
.lp-tg[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.lp-tg[aria-pressed="false"] svg{opacity:.35}
.lp-tg .lp-sw{margin-right:0}
.lp-tick{display:inline-block;width:1em;height:1em;border:1.5px solid var(--ink-2);border-radius:3px;position:relative;flex:0 0 auto}
.lp-tg[aria-pressed="true"] .lp-tick::after{content:"✓";position:absolute;inset:-.25em 0 0 .1em;font-size:.95em;font-weight:700;color:var(--ink)}
.lp-ln-a{stroke:var(--ink);stroke-width:3}
.lp-ln-b{stroke:var(--ink-2);stroke-width:3;stroke-dasharray:6 4}
.lp-ln-c{stroke:var(--lp-car);stroke-width:3}
.lp-rec{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.lp-picks{margin:0;font-size:.92rem}
.lp-engbtns{margin:0;align-items:center}
.lp-big{font:700 1.5rem var(--font-math)}
/* Elodea tank */
.lp-tank{margin:0 0 12px}
.lp-tank svg{width:100%;max-width:340px;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lp-tank figcaption{margin-top:4px}
.lp-lamp{fill:var(--paper);stroke:var(--ink-2);stroke-width:2}
.lp-lamp-b{stroke:var(--ink-2);stroke-width:2;fill:none}
.lp-wave{fill:none;stroke:var(--ink);stroke-width:1.6}
.lp-filt{stroke:var(--ink);stroke-width:1.2}
.lp-water{fill:var(--pen);fill-opacity:.1}
.lp-glass{fill:none;stroke:var(--ink-2);stroke-width:2}
.lp-stem{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.lp-elleaf{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:1.2}
.lp-bubble{fill:var(--sheet);fill-opacity:.6;stroke:var(--pen);stroke-width:1.3}
.lp-tx{font:600 10px var(--font-ui);fill:var(--ink-2)}

/* Practice: read the spectra */
.lp-rs{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px 22px;align-items:start}
.lp-rs .lp-sl{margin-top:8px}
.lp-rschips{margin:0 0 6px}
.lp-unit{font-size:.95rem;color:var(--ink-2)}

/* task */
.lp-conds{margin:6px 0 8px;padding-left:1.4em}
.gl-in{display:grid;gap:6px;margin:10px 0 12px}
.lp-meter{display:grid;gap:4px;margin-top:10px}
.lp-meter-l{font-size:.88rem;color:var(--ink-2)}
.lp-meter-l strong{color:var(--ink)}
.lp-meter-t{position:relative;display:block;height:12px;border:1.5px solid var(--ink-2);border-radius:999px;overflow:hidden;background:var(--paper)}
.lp-meter-t i{display:block;height:100%;background:var(--pen)}
.lp-aim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}

/* chromatography */
.cg-st > p{margin-top:4px}
.cg-s1,.cg-s2{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:14px 22px;align-items:start}
.cg-s2{grid-template-columns:minmax(170px,280px) minmax(0,1fr)}
.cg-fig{margin:0}
.cg-fig svg{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.cg-fig figcaption{margin-top:4px;min-height:1.4em}
.cg-log{margin:0 0 10px;padding-left:1.4em;font-size:.92rem}
.cg-log:empty{display:none}
.cg-menu{display:grid;gap:6px}
.cg-opt{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.45em .7em;font-size:.92rem;min-height:40px}
.cg-opt:not(:disabled):hover{border-color:var(--pen)}
.cg-opt.done{border-color:var(--green);background:var(--good-bg)}
.cg-opt:disabled{opacity:.6}
.cg-opt.done:disabled{opacity:.85}
.cg-ck{color:var(--green);font-weight:700}
#cg-fb1{margin-top:10px}
.cg-paper{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.cg-wet{fill:var(--pen);fill-opacity:.08}
.cg-pool{fill:var(--pen);fill-opacity:.16}
.cg-pool.tint{fill:var(--lp-chla);fill-opacity:.4}
.cg-glass{fill:none;stroke:var(--ink-2);stroke-width:2}
.cg-rod{stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}
.cg-line{stroke:var(--ink-2);stroke-width:1.4}
.cg-line.pen{stroke:var(--pen);stroke-width:2}
.cg-ink{fill:var(--pen);fill-opacity:.45}
.cg-lost{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:2 4;opacity:.5}
.cg-tx{font:600 10px var(--font-ui);fill:var(--ink)}
.cg-tx.b{font-size:14px;font-weight:700}
.cg-bowl{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.6}
.cg-pestle{stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.cg-ruler{fill:var(--paper);stroke:var(--ink-2);stroke-width:1}
.cg-tick{stroke:var(--ink);stroke-width:1}
.cg-lead{fill:none;stroke:var(--ink-2);stroke-width:.8}
.cg-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cg-card{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;min-width:0}
.cg-bh{margin:0 0 6px;font-size:.92rem}
.cg-sw{display:inline-block;width:.95em;height:.95em;border-radius:50%;border:1px solid var(--ink-2);vertical-align:-.12em;margin-right:.4em}
.cg-in{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cg-in input{width:6rem}
.cg-okm{color:var(--green);font-weight:700}
.cg-msg{margin:6px 0 0;font-size:.88rem}
.cg-msg.good{color:var(--ink)}
.cg-id{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.cg-id .chip{font-size:.84rem;padding:.2em .7em}
#cg-fb2{margin-top:10px}
#cg-data{margin-top:12px}
.cg-s3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;max-width:620px}
.cg-fig3{margin:0;min-width:0}
.cg-fig3 svg{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.cg-fig3 figcaption{font-size:.85rem;margin-top:4px;display:grid;gap:2px}
#cg-anote{margin-top:10px}

@media (max-width:760px){
  .lp-rs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .cg-s1,.cg-s2{grid-template-columns:minmax(0,1fr)}
  .cg-fig{max-width:240px}
  .cg-cards{grid-template-columns:minmax(0,1fr)}
  .lp-pg .rg.seg button{padding:.4em .6em;font-size:.86rem}
}
.lp-legend{margin:6px 0 0}

</style>
</head>
<body>

,"slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"f9a9e10e","content":{"id":"02-light-and-pigments","kind":"topic","title":"Light and photosynthetic pigments","topic":"Light and Photosynthetic Pigments","readyTopic":"light and photosynthetic pigments","hero":{"headline":"Leaves are green because they throw green away","text":"Sunlight is a mix of colours. \u003cstrong>Chlorophyll\u003c/strong> absorbs violet-blue and red light strongly and reflects most of the green. \u003cstrong>Accessory pigments\u003c/strong> catch some of the colours chlorophyll misses and pass the energy on. The light a leaf absorbs is the light that powers photosynthesis.","fig":{"aria":"A beam of white light enters a prism and fans into a rainbow. A leaf slides into the rainbow: the violet-blue and red light fades into the leaf (absorbed) while the green bounces off toward your eye, and the leaf glows green. Below, a rainbow band from 380 to 750 nm carries chlorophyll a’s absorption curve, high over the violet-blue and red ends and low over green."}},"goals":["I can relate a light’s colour to its wavelength and to the energy of its photons.","I can read absorption spectra of chlorophyll \u003ci>a\u003c/i>, chlorophyll \u003ci>b\u003c/i> and carotenoids, and explain why leaves look green.","I can compare an absorption spectrum with an action spectrum and explain what accessory pigments do.","I can interpret experiments that vary the colour of light (Engelmann’s bacteria; oxygen bubbles).","I can separate pigments by chromatography, calculate Rf values and identify each pigment.","I can explain autumn leaf colours and other everyday uses of pigment knowledge."],"start":{"warmup":{"questions":[{"id":"w1","skill":"The visible spectrum","goal":1,"prompt":"Which colour of visible light has the shortest wavelength?","options":[{"t":"Red","why":"Red is the long end, about 700 nm.","_n":"0857","_k":"f33cc39d"},{"t":"Violet","why":"Violet light is about 400 nm, the short end of the visible spectrum.","_n":"1847","_k":"01773a12"},{"t":"Yellow","why":"Yellow is about 580 nm.","_n":"2837","_k":"212483a9"},{"t":"Green","why":"Green is in the middle, about 530 nm.","_n":"3827","_k":"e86513e1"}],"hints":["Remember the order: red, orange, yellow, green, blue, violet.","Wavelength shrinks from red toward violet.","Violet."]},{"id":"w2","skill":"The visible spectrum","goal":1,"prompt":"Which carries more energy per photon: blue light (450 nm) or red light (675 nm)?","options":[{"t":"They carry the same","why":"Photon energy depends on wavelength.","_n":"4817","_k":"fc1cf60d"},{"t":"Red","why":"Longer waves carry \u003cstrong>less\u003c/strong> energy per photon.","_n":"5807","_k":"0b576e15"},{"t":"It depends on how bright the light is","why":"Brightness is the number of photons, not the energy of each one.","_n":"67f7","_k":"21136429"},{"t":"Blue","why":"Shorter wavelength, more energy per photon.","_n":"77e7","_k":"05facbb4"}],"hints":["Think of ultraviolet light: short wavelength, enough energy to burn skin.","Energy goes up as wavelength goes down.","Blue."]},{"id":"w3","skill":"Reading graphs","goal":2,"prompt":"A graph has absorbance on the vertical axis and wavelength on the horizontal axis. A tall peak at 430 nm means…","options":[{"t":"the pigment absorbs 430 nm light strongly","why":"High absorbance means more light absorbed.","_n":"87d7","_k":"bf2e6046"},{"t":"the pigment gives off 430 nm light","why":"Absorbance measures light taken in, not given off.","_n":"9202","_k":"b268988c"},{"t":"430 nm light is the brightest in sunlight","why":"The graph is about the pigment, not the sun.","_n":"a212","_k":"3a2cdf29"},{"t":"the pigment reflects 430 nm light strongly","why":"Absorbed light isn’t reflected.","_n":"b1e2","_k":"b0c7a623"}],"hints":["What does ‘absorbance’ measure?","How much light the sample takes in.","Strong absorption at 430 nm."]},{"id":"w4","skill":"Reading graphs","goal":4,"prompt":"A water plant gives off 24 bubbles per minute in blue light and 6 per minute in green light. How many times faster is the blue rate?","options":[{"t":"0.25 times","why":"That’s green compared with blue.","_n":"c1f2","_k":"7656d8fd"},{"t":"4 times","why":"24 ÷ 6 = 4.","_n":"d242","_k":"bfc6d39a"},{"t":"18 times","why":"24 − 6 = 18 is the difference, not the ratio.","_n":"e252","_k":"afc16b81"},{"t":"3 times","why":"Check: 6 × 3 = 18, not 24.","_n":"f222","_k":"dd748a89"}],"hints":["‘How many times’ means divide.","Blue ÷ green.","24 ÷ 6 = 4."]},{"id":"w5","skill":"Photosynthesis measurements","goal":4,"prompt":"Which gas is counted as bubbles to measure the rate of photosynthesis in a water plant?","options":[{"t":"Nitrogen","why":"Nitrogen isn’t a product of photosynthesis.","_n":"g232","_k":"56bbc33d"},{"t":"Oxygen","why":"Photosynthesis releases O₂, which forms bubbles.","_n":"h182","_k":"ef0260f7"},{"t":"Water vapour","why":"Underwater plants don’t release water vapour bubbles.","_n":"i192","_k":"aeffc988"},{"t":"Carbon dioxide","why":"CO₂ is taken in, not given off, in light.","_n":"j9a2","_k":"a4685a07"}],"hints":["Which gas does photosynthesis produce?","It’s the one we breathe in.","Oxygen."]},{"id":"w6","skill":"Photosynthesis measurements","goal":4,"prompt":"A student wants to compare the rate of photosynthesis under red and green light. Which must stay the same in both trials?","options":[{"t":"The number of bubbles","why":"That’s the result being measured.","_n":"k992","_k":"80f27b86"},{"t":"The lamp’s brightness and distance","why":"Only the colour should change.","_n":"l982","_k":"6a3f5f8b"},{"t":"Nothing, as long as the student is careful","why":"Uncontrolled variables can change the result.","_n":"m972","_k":"a98a64e2"},{"t":"The colour of the light","why":"Colour is what’s being tested: it must change.","_n":"n962","_k":"642b7e80"}],"hints":["What’s being tested?","Everything else must be kept the same.","Brightness and distance."]}],"refreshers":{"The visible spectrum":"From red (≈ 700 nm) to violet (≈ 400 nm), wavelength gets shorter and each photon carries more energy. Brightness is how many photons arrive, a separate idea.","Reading graphs":"Read the axis labels first. ‘How many times’ means divide one value by the other: 24 ÷ 6 = 4.","Photosynthesis measurements":"Counting O₂ bubbles from a water plant measures the rate. Change one variable (the independent variable), measure the bubbles (the dependent variable), and keep everything else the same (controlled variables)."}}},"explore":{"heading":"Spectrum lab","intro":"Slide through the spectrum to see which colours each pigment absorbs. Then shine coloured light on a water plant, and replay a famous experiment with bacteria.","modelNote":"Rounded model values shaped like real measurements. Absorption curves are for pigments extracted in solvent.","actionNote":"The action spectrum comes from a living plant. Inside a leaf, pigments are attached to proteins and light bounces around, so the plant uses a slightly wider range than the extracted pigments absorb.","plantNote":"Elodea (Canadian waterweed, \u003ci>Elodea canadensis\u003c/i>): O₂ bubbles per minute at the same lamp brightness under every filter.","engNote":"A green algal filament lies across a spread spectrum, with oxygen-seeking bacteria in the water around it. Press \u003cstrong>Run\u003c/strong> and watch where they settle.","filters":[{"nm":420,"name":"violet","bubbles":20},{"nm":450,"name":"blue","bubbles":24},{"nm":530,"name":"green","bubbles":6},{"nm":580,"name":"yellow","bubbles":8},{"nm":610,"name":"orange","bubbles":14},{"nm":660,"name":"red","bubbles":22},{"nm":730,"name":"far red","bubbles":2,"note":"barely visible"}],"predIntro":"Make a prediction first. The spectrum lab then sets itself up (Absorption mode for the first two, Engelmann mode for the third, Action mode for the last) and shows you what really happens.","predictions":[{"id":"p1","start":{"mode":"abs","pig":{"a":true,"b":false,"c":false},"wl":430},"to":550,"prompt":"How much will chlorophyll \u003ci>a\u003c/i> absorb at 550 nm (green)?","options":[{"t":"It absorbs green best","_n":"o952","_k":"b1a8e0d6"},{"t":"Almost none","_n":"p942","_k":"2541b983"},{"t":"About half","_n":"q932","_k":"8ba09e4a"},{"t":"Most of it","_n":"ra22","_k":"1d9dfa30"}],"explain":"Green is the colour chlorophyll leaves behind, which is why leaves look green."},{"id":"p2","start":{"mode":"abs","pig":{"a":true,"b":true,"c":true},"wl":430},"to":480,"prompt":"Which pigment absorbs most at 480 nm?","options":[{"t":"Carotenoids","_n":"sa12","_k":"7a9b86e1"},{"t":"Chlorophyll \u003ci>a\u003c/i>","_n":"t942","_k":"44ae2ab4"},{"t":"Chlorophyll \u003ci>b\u003c/i>","_n":"u952","_k":"fe2ca180"},{"t":"None of them","_n":"v962","_k":"05b6f218"}],"explain":"Carotenoids fill the blue-green gap between chlorophyll \u003ci>a\u003c/i>’s peak and the green dip."},{"id":"p3","start":{"mode":"eng","spread":true},"prompt":"Bacteria that need O₂ swim toward where it’s made. Where will they crowd along the filament?","options":[{"t":"U \u003ci>b\u003c/i> was only 20 of 111.","_n":"29181","_k":"7c3341c4"},{"t":"640 nm","why":"At 640 nm, \u003ci>b\u003c/i> is 59 of 73: 81%.","_n":"2a171","_k":"05cb2230"}],"hints":["Without chlorophyll \u003ci>b\u003c/i>, the plant loses \u003ci>b\u003c/i>’s absorption at each wavelength.","Compare \u003ci>b\u003c/i> with the total absorbance at each wavelength.","At 640 nm, \u003ci>b\u003c/i> is 59 of 73: 81%."]},{"id":"x5","kind":"mc","goal":6,"star":true,"prompt":"Greenhouse LED lights in southwestern Ontario often glow purple. Why?","options":[{"t":"Purple light keeps insects away","why":"Red + blue looks purple to us; it puts energy where the pigments absorb.","_n":"2b121","_k":"7e09e7e9"},{"t":"Purple light is the most energetic colour","why":"Red + blue looks purple to us; it puts energy where the pigments absorb.","_n":"2c111","_k":"08be6253"},{"t":"They mix red and blue LEDs, the colours chlorophyll absorbs best, and skip most green","why":"Red + blue looks purple to us; it puts energy where the pigments absorb.","_n":"2d141","_k":"313b6862"},{"t":"Plants absorb purple best","why":"Red + blue looks purple to us; it puts energy where the pigments absorb.","_n":"2e131","_k":"c836c363"}],"hints":["Which colours does chlorophyll absorb best?","Red and blue. What do red and blue look like together?","They mix red and blue LEDs, which look purple to us, and skip most green."]},{"id":"x6","kind":"mc","goal":[3,6],"star":true,"prompt":"Light on the floor of a dense maple forest is rich in green and far red. Which explanation fits?","options":[{"t":"The canopy leaves have absorbed most of the blue and red","why":"The canopy’s chlorophyll takes the blue and red; what passes through is the light chlorophyll uses least.","_n":"2f1e1","_k":"35b8cee5"},{"t":"Far red comes from the soil","why":"The canopy’s chlorophyll takes the blue and red; what passes through is the light chlorophyll uses least.","_n":"2g1d1","_k":"ce21506e"},{"t":"The canopy reflects blue upward only","why":"The canopy’s chlorophyll takes the blue and red; what passes through is the light chlorophyll uses least.","_n":"2h901","_k":"0335b02d"},{"t":"Green light is made by the forest floor","why":"The canopy’s chlorophyll takes the blue and red; what passes through is the light chlorophyll uses least.","_n":"2i911","_k":"97d63251"}],"hints":["What happens to sunlight as it passes through the canopy leaves?","Chlorophyll absorbs blue and red strongly and lets green and far red through.","The canopy leaves have absorbed most of the blue and red."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Ahmed","how":"","instruction":"Ahmed made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain why leaves look green.","steps":["Sunlight contains all the visible colours.","Chlorophyll absorbs mostly green light.","The absorbed green light powers photosynthesis.","So the leaf looks green."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier.","Step 4 follows."],"fixes":[{"t":"Chlorophyll gives off green light.","why":"Leaves reflect light; they don’t glow.","_n":"2j8e1","_k":"a274dcc5"},{"t":"Step 2 is correct.","why":"If green were absorbed, it wouldn’t reach your eye.","_n":"2k8f1","_k":"93d36de3"},{"t":"Chlorophyll absorbs mostly violet-blue and red, and very little green, so green is reflected.","why":"We see the colours a pigment does \u003cstrong>not\u003c/strong> absorb. Leaves look green because chlorophyll absorbs little green.","_n":"2l941","_k":"03bc1302"},{"t":"Carotenoids absorb green.","why":"Carotenoids absorb blue and blue-green (about 420–500 nm), not green.","_n":"2m951","_k":"8a96dc41"}],"hints":["Do we see absorbed light or reflected light?","Reflected.","So chlorophyll must absorb little green."]},{"id":"e2","goal":5,"task":"Find the Rf of a band 6.3 cm from the start when the solvent front is 9.0 cm from the start.","steps":["Rf = distance moved by the solvent ÷ distance moved by the pigment.","Rf = 9.0 ÷ 6.3 ≈ 1.43.","An Rf above 1 means the pigment is very soluble: carotene."],"_a":"Vg==","stepFb":["","Step 2 uses step 1’s formula. The mistake is earlier.","Step 3 builds on the wrong value."],"fixes":[{"t":"Rf = pigment ÷ solvent = 6.3 ÷ 9.0 = 0.70: xanthophyll.","why":"Rf = pigment distance ÷ solvent distance. The pigment never passes the solvent, so Rf is between 0 and 1.","_n":"2n921","_k":"37045be2"},{"t":"Rf = 6.3 × 9.0.","why":"Rf divides the two distances: pigment ÷ solvent.","_n":"2o931","_k":"4a2b4019"},{"t":"Step 1 is correct.","why":"The pigment never moves farther than the solvent, so Rf can’t exceed 1.","_n":"2p981","_k":"82c85dfd"},{"t":"Rf = 9.0 − 6.3 = 2.7.","why":"That’s the difference in distances.","_n":"2q991","_k":"0ac34f21"}],"hints":["Can a pigment travel farther than the solvent carrying it?","So Rf must be less than 1.","6.3 ÷ 9.0 = 0.70."]},{"id":"e3","goal":1,"task":"Compare red and blue light for photosynthesis.","steps":["Red light has a longer wavelength than blue light.","Longer waves carry more energy, so red photons carry more energy than blue ones.","Chlorophyll \u003ci>a\u003c/i> absorbs both colours strongly.","Both can drive photosynthesis."],"_a":"Vw==","stepFb":["Step 1 is correct.","","Step 3 is correct, but the mistake is earlier.","Step 4 is correct."],"fixes":[{"t":"Shorter waves carry more energy, so blue photons carry more energy than red ones.","why":"Shorter wavelength, more energy per photon: a 450 nm photon carries 1.5 times the energy of a 675 nm one.","_n":"2r5fb","_k":"e3852d93"},{"t":"All photons carry the same energy.","why":"Photon energy depends on wavelength.","_n":"2s60b","_k":"37d45a3a"},{"t":"Step 2 is correct.","why":"A 450 nm photon carries 1.5 times the energy of a 675 nm one.","_n":"2t5db","_k":"6e94d2a8"},{"t":"Only blue light drives photosynthesis.","why":"Chlorophyll \u003ci>a\u003c/i> absorbs red strongly too (≈ 660 nm), so red drives photosynthesis as well.","_n":"2u5eb","_k":"22f78ba4"}],"hints":["Which is more dangerous to skin: ultraviolet or infrared?","Ultraviolet: shorter wavelength, more energy.","So blue beats red per photon."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the spectrum lab or in Engelmann’s experiment?"},{"id":"j2","q":"In your own words, what’s the difference between an absorption spectrum and an action spectrum?"},{"id":"j3","q":"Explain to a friend how to calculate an Rf value and what it tells you."},{"id":"j4","q":"Which idea about light and pigments are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which colour of visible light carries the most energy per photon?","options":[{"t":"Red","why":"Red has the longest wavelength and the least energy.","_n":"2v5bb","_k":"6c50e770"},{"t":"Green","why":"Green is in the middle.","_n":"2w5cb","_k":"96a9b13c"},{"t":"Violet","why":"Shortest wavelength, most energy.","_n":"2x59b","_k":"c4f43862"},{"t":"All colours carry the same energy","why":"Energy depends on wavelength.","_n":"2y5ab","_k":"f3fc764c"}]},"b":{"prompt":"Which colour of visible light carries the least energy per photon?","options":[{"t":"Violet","why":"Violet carries the most.","_n":"2z57b","_k":"6b15d4bd"},{"t":"All colours carry the same energy","why":"Energy depends on wavelength.","_n":"3058b","_k":"5b2a05d3"},{"t":"Red","why":"Longest wavelength, least energy.","_n":"3145b","_k":"930ba637"},{"t":"Blue","why":"Blue is near the energetic end.","_n":"3244b","_k":"248d9116"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Why do most leaves look green?","options":[{"t":"Chlorophyll absorbs little green light, so green is reflected and transmitted to our eyes.","why":"We see the colours a pigment does \u003cstrong>not\u003c/strong> absorb. Leaves look green because chlorophyll absorbs little green.","_n":"3347b","_k":"aca641c7"},{"t":"Chlorophyll absorbs green light most strongly.","why":"We see the colours a pigment does \u003cstrong>not\u003c/strong> absorb. Leaves look green because chlorophyll absorbs little green.","_n":"3446b","_k":"65c8c6b2"},{"t":"Chloroplasts give off green light.","why":"Leaves reflect light; they don’t glow.","_n":"3549b","_k":"096f20bc"},{"t":"Carotenoids are green.","why":"Carotenoids are yellow-orange.","_n":"3648b","_k":"13def73e"}]},"b":{"prompt":"Why do carrots look orange?","options":[{"t":"Carotene gives off orange light.","why":"It reflects; it doesn’t glow.","_n":"374bb","_k":"e9787469"},{"t":"Carotene absorbs orange light most strongly.","why":"We see the colours a pigment does \u003cstrong>not\u003c/strong> absorb, so an orange carrot can’t be absorbing orange most.","_n":"384ab","_k":"3ef45265"},{"t":"Carrots contain orange chlorophyll.","why":"Chlorophyll is green; the roots have carotene.","_n":"394db","_k":"ca028af1"},{"t":"Carotene absorbs blue and blue-green light, and reflects the yellow-orange.","why":"We see the colours a pigment does \u003cstrong>not\u003c/strong> absorb: carotene takes the blue and blue-green and leaves the yellow-orange.","_n":"3a4cb","_k":"4adb8f15"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"On a chromatogram, the solvent moved 8.0 cm and a pigment moved 6.0 cm. What is the pigment’s Rf?","options":[{"t":"0.25","why":"That’s 2.0 ÷ 8.0.","_n":"3bd3b","_k":"b001be75"},{"t":"0.75","why":"6.0 ÷ 8.0.","_n":"3cd4b","_k":"4e647ea8"},{"t":"1.33","why":"That’s solvent ÷ pigment.","_n":"3dd5b","_k":"9585744d"},{"t":"2.0","why":"That’s the difference in distances.","_n":"3ed6b","_k":"d59b5b5f"}]},"b":{"prompt":"The solvent moved 12.0 cm and a pigment moved 3.0 cm. What is the pigment’s Rf?","options":[{"t":"0.25","why":"3.0 ÷ 12.0.","_n":"3fd7b","_k":"b7b5bd72"},{"t":"0.75","why":"That’s 9.0 ÷ 12.0.","_n":"3gd8b","_k":"cc78fe93"},{"t":"4.0","why":"That’s solvent ÷ pigment. Rf = pigment distance ÷ solvent distance. The pigment never passes the solvent, so Rf is between 0 and 1.","_n":"3hd9b","_k":"47d6e5cd"},{"t":"9.0","why":"That’s the difference.","_n":"3idab","_k":"22717880"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"The action spectrum shows a fairly high rate at 470 nm, where chlorophyll \u003ci>a\u003c/i> absorbs almost nothing. Which explanation fits best?","options":[{"t":"Chlorophyll \u003ci>a\u003c/i> actually absorbs strongly at 470 nm.","why":"The model curve is near 0 there (about 3).","_n":"3jcbb","_k":"5a14a9a9"},{"t":"Action spectra are unreliable.","why":"The difference has a cause. Other pigments absorb where chlorophyll \u003ci>a\u003c/i> doesn’t and pass the energy along, so the action spectrum is broader.","_n":"3kccb","_k":"0b878791"},{"t":"Accessory pigments (chlorophyll \u003ci>b\u003c/i> and carotenoids) absorb 470 nm light and pass the energy to chlorophyll \u003ci>a\u003c/i>.","why":"Other pigments absorb where chlorophyll \u003ci>a\u003c/i> doesn’t and pass the energy along, so the action spectrum is broader.","_n":"3ld9b","_k":"39aeea36"},{"t":"Accessory pigments make their own O₂ without chlorophyll \u003ci>a\u003c/i>.","why":"Accessory pigments pass their absorbed energy to chlorophyll \u003ci>a\u003c/i> in the reaction centre.","_n":"3md8b","_k":"e45d6309"}]},"b":{"prompt":"The action spectrum shows a fairly high rate at 640 nm, where chlorophyll \u003ci>a\u003c/i> absorbs only weakly. Which explanation fits best?","options":[{"t":"Chlorophyll \u003ci>b\u003c/i> absorbs strongly at 640 nm and passes the energy to chlorophyll \u003ci>a\u003c/i>.","why":"Other pigments absorb where chlorophyll \u003ci>a\u003c/i> doesn’t and pass the energy along, so the action spectrum is broader.","_n":"3nd7b","_k":"3b189dba"},{"t":"Action spectra are unreliable.","why":"The difference has a cause. Other pigments absorb where chlorophyll \u003ci>a\u003c/i> doesn’t and pass the energy along, so the action spectrum is broader.","_n":"3od6b","_k":"7cd4eba5"},{"t":"Chlorophyll \u003ci>b\u003c/i> makes its own O₂ without chlorophyll \u003ci>a\u003c/i>.","why":"Accessory pigments pass their absorbed energy to chlorophyll \u003ci>a\u003c/i> in the reaction centre.","_n":"3pddb","_k":"7947b874"},{"t":"Carotenoids absorb strongly at 640 nm.","why":"Carotenoids absorb nothing in the red.","_n":"3qdcb","_k":"7035a102"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"In Engelmann’s experiment with a green alga, bacteria crowded under blue and red light. What does this show?","options":[{"t":"O₂ was made fastest where the alga’s chlorophyll absorbs most, so the light chlorophyll absorbs drives photosynthesis.","why":"Most O₂ is made where the alga’s pigments absorb most light.","_n":"3rdbb","_k":"8fe87113"},{"t":"The bacteria simply prefer red and blue light.","why":"The bacteria follow O₂, not colour.","_n":"3sdab","_k":"aea93072"},{"t":"Green light kills bacteria.","why":"Green light gave less O₂, so fewer bacteria gathered.","_n":"3td1b","_k":"71b96959"},{"t":"The bacteria were photosynthesizing.","why":"They were using O₂, not making it.","_n":"3ud0b","_k":"dbfc5899"}]},"b":{"prompt":"The experiment is repeated with a red seaweed whose extra pigments absorb green light well. Where will bacteria crowd?","options":[{"t":"Under red only.","why":"Its chlorophyll still absorbs blue.","_n":"3vd7c","_k":"055e3512"},{"t":"Under green as well as under blue and red, because the seaweed’s pigments absorb green and use it.","why":"Different pigments mean a different action spectrum: this seaweed absorbs green, so it makes O₂ under green too.","_n":"3wd8c","_k":"8af1afeb"},{"t":"Nowhere, because red seaweeds reflect green.","why":"This seaweed absorbs green.","_n":"3xd5c","_k":"ee8ddbfe"},{"t":"Under blue and red only, as with the green alga.","why":"Different pigments mean a different action spectrum.","_n":"3yd6c","_k":"96d3f538"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A mutant plant has no chlorophyll \u003ci>b\u003c/i>. Compared with a normal plant, around which wavelength will its photosynthesis rate drop the most?","options":[{"t":"660 nm","why":"Chlorophyll \u003ci>a\u003c/i> absorbs 74 there and is still present.","_n":"3zdbc","_k":"c76a37f3"},{"t":"700 nm","why":"Neither plant absorbs much at 700 nm.","_n":"40dcc","_k":"db7dd46d"},{"t":"640 nm","why":"Most of the light absorbed there is absorbed by chlorophyll \u003ci>b\u003c/i>.","_n":"41d9c","_k":"0852eb2d"},{"t":"550 nm","why":"Nothing absorbs much there in either plant.","_n":"42dac","_k":"938fafdd"}]},"b":{"prompt":"A mutant plant has no carotenoids. Around which wavelength will its photosynthesis rate drop the most?","options":[{"t":"660 nm","why":"Carotenoids absorb nothing in the red.","_n":"43cfc","_k":"0836c01a"},{"t":"550 nm","why":"Nothing absorbs much there in either plant.","_n":"44d0c","_k":"f50328be"},{"t":"480 nm","why":"Carotenoids absorb 91 there; chlorophyll \u003ci>a\u003c/i> absorbs 0.","_n":"45ddc","_k":"08faf3f8"},{"t":"430 nm","why":"Chlorophyll \u003ci>a\u003c/i> still absorbs strongly there.","_n":"46dcc","_k":"51e7de57"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which statement best distinguishes an absorption spectrum from an action spectrum?","options":[{"t":"“An absorption spectrum shows the colours a leaf reflects.”","why":"We see the colours a pigment does \u003cstrong>not\u003c/strong> absorb. Leaves look green because chlorophyll absorbs little green.","_n":"47dfc","_k":"51c972e3"},{"t":"“An action spectrum shows how much light the sun gives off at each wavelength.”","why":"It’s about the plant’s rate, not the sun.","_n":"48dec","_k":"c573d84f"},{"t":"“They are the same graph with different titles.”","why":"Other pigments absorb where chlorophyll \u003ci>a\u003c/i> doesn’t and pass the energy along, so the action spectrum is broader.","_n":"49d9c","_k":"14c67322"},{"t":"“An absorption spectrum shows how much of each wavelength a pigment absorbs; an action spectrum shows how fast photosynthesis runs at each wavelength.”","why":"One graph is about what a pigment takes in; the other is about how fast the plant photosynthesizes.","_n":"4ad8c","_k":"1a83e590"}]},"b":{"prompt":"Which statement best explains why the action spectrum is broader than chlorophyll \u003ci>a\u003c/i>’s absorption spectrum?","options":[{"t":"“Accessory pigments do their own photosynthesis.”","why":"Accessory pigments pass their absorbed energy to chlorophyll \u003ci>a\u003c/i> in the reaction centre.","_n":"4bdbc","_k":"55a9f162"},{"t":"“Green light is the main driver of photosynthesis.”","why":"Green gives the lowest rate of the visible colours, but not zero.","_n":"4cdac","_k":"b8418f74"},{"t":"“Chlorophyll \u003ci>a\u003c/i> absorbs every colour equally.”","why":"Its curve has two clear peaks.","_n":"4dd5c","_k":"8d6cb88b"},{"t":"“Chlorophyll \u003ci>b\u003c/i> and carotenoids absorb wavelengths that chlorophyll \u003ci>a\u003c/i> misses and pass the energy to chlorophyll \u003ci>a\u003c/i>.”","why":"Other pigments absorb where chlorophyll \u003ci>a\u003c/i> doesn’t and pass the energy along, so the action spectrum is broader.","_n":"4ed4c","_k":"c9718ab8"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which best explains why sugar maple leaves turn yellow-orange in autumn?","options":[{"t":"“The leaves make new carotenoids in autumn.”","why":"Carotenoids were in the leaf all summer, hidden by chlorophyll. Reds (anthocyanins) are new.","_n":"4f4bc","_k":"8231769e"},{"t":"“Cold weather turns chlorophyll yellow.”","why":"Chlorophyll breaks down; it doesn’t change colour.","_n":"4g4cc","_k":"4a6d9e26"},{"t":"“Shorter, cooler days lead to chlorophyll breaking down; the yellow-orange carotenoids that were there all along now show.”","why":"Carotenoids were in the leaf all summer, hidden by chlorophyll.","_n":"4h4dc","_k":"3bd36ae9"},{"t":"“Autumn sunlight contains more yellow light.”","why":"The leaf changed, not the light.","_n":"4i4ec","_k":"3fb5a566"}]},"b":{"prompt":"Which best explains why red maple leaves turn red in autumn?","options":[{"t":"“The red pigments were hidden under the chlorophyll all summer.”","why":"Anthocyanins are made new in autumn.","_n":"4j47c","_k":"7f2a90cf"},{"t":"“As chlorophyll breaks down, the leaf makes new red pigments (anthocyanins) in its cells, which reflect red.”","why":"Carotenoids were in the leaf all summer, hidden by chlorophyll. Reds (anthocyanins) are new.","_n":"4k48c","_k":"2f6c6c32"},{"t":"“The leaves absorb red light in autumn.”","why":"We see the colours a pigment does \u003cstrong>not\u003c/strong> absorb, so a red leaf is reflecting red.","_n":"4l49c","_k":"44840577"},{"t":"“Carotenoids are red.”","why":"Carotenoids are yellow-orange.","_n":"4m4ac","_k":"aa7b2006"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A student counts Elodea bubbles under a red filter, then moves the lamp closer before counting under a green filter. Why are the results unfair?","options":[{"t":"The student should have counted CO₂ bubbles instead.","why":"The bubbles are O₂.","_n":"4n53c","_k":"cd124664"},{"t":"The filter colour should have stayed the same.","why":"Colour is the variable being tested.","_n":"4o54c","_k":"ab722c82"},{"t":"Light brightness wasn’t controlled, so the green count isn’t comparable.","why":"Only the colour should change.","_n":"4pd1c","_k":"35e881b8"},{"t":"Green light can’t make bubbles.","why":"Green gives the lowest rate of the visible colours, but not zero.","_n":"4qd0c","_k":"2cd1919b"}]},"b":{"prompt":"A student counts Elodea bubbles under a blue filter, then uses a different, bigger Elodea sprig for the green filter. Why are the results unfair?","options":[{"t":"The student should have counted CO₂ bubbles instead.","why":"The bubbles are O₂.","_n":"4rcfc","_k":"3d8e609b"},{"t":"Green light can’t make bubbles.","why":"Green gives the lowest rate of the visible colours, but not zero.","_n":"4scec","_k":"a5635605"},{"t":"The filter colour should have stayed the same.","why":"Colour is the variable being tested.","_n":"4tcdc","_k":"66d0f7e3"},{"t":"The plant wasn’t controlled: a bigger sprig photosynthesizes more, whatever the colour.","why":"Only the colour should change.","_n":"4uccc","_k":"a4cffe6e"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A seedling grower can buy LEDs of exactly two colours and wants to match chlorophyll \u003ci>a\u003c/i>’s two absorption peaks. Which pair?","options":[{"t":"About 450 nm and 480 nm","why":"Both blue: no red peak.","_n":"4vcbc","_k":"65e6f47b"},{"t":"About 430 nm and 660 nm","why":"Chlorophyll \u003ci>a\u003c/i>’s peaks are near 430 nm and 660 nm.","_n":"4wcac","_k":"ccbbe852"},{"t":"About 530 nm and 580 nm","why":"Green and yellow are absorbed least.","_n":"4xd9c","_k":"239f708b"},{"t":"About 660 nm and 730 nm","why":"Far red is absorbed very little.","_n":"4yd8c","_k":"8b952b1b"}]},"b":{"prompt":"A grower wants two LED colours that match chlorophyll \u003ci>b\u003c/i>’s two absorption peaks. Which pair?","options":[{"t":"About 530 nm and 580 nm","why":"Green and yellow are absorbed least.","_n":"4zcfa","_k":"dc1912b9"},{"t":"About 430 nm and 660 nm","why":"Those are chlorophyll \u003ci>a\u003c/i>’s peaks.","_n":"50d0a","_k":"06166bdf"},{"t":"About 450 nm and 640 nm","why":"Chlorophyll \u003ci>b\u003c/i>’s peaks are near 450 nm and 640 nm.","_n":"51cda","_k":"fe178a64"},{"t":"About 480 nm and 500 nm","why":"Those are in the carotenoid region.","_n":"52cea","_k":"7fc490dd"}]}}]},"task":{"title":"Design a grow-light","summary":"Design a grow-light","statement":"\u003cp>Build a grow-light for a greenhouse from 25 W LED lamps. Can you find every design that works?\u003c/p>\u003col class=\"lp-conds\">\u003cli>Includes chlorophyll \u003ci>a\u003c/i>’s red peak (a 660 nm lamp).\u003c/li>\u003cli>Total model photosynthesis of at least 56 bubbles per minute.\u003c/li>\u003cli>Fits the power budget: at most 75 W.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Each lamp adds its action-spectrum value from the Spectrum lab (Elodea bubbles per minute) to the total.\u003c/p>","lamps":[420,450,530,580,610,660,730],"watts":25,"budget":75,"target":56,"legend":"Bars: your lamps, with their bubbles per minute (right-hand scale). Faint curves: chlorophyll \u003ci>a\u003c/i> (solid), chlorophyll \u003ci>b\u003c/i> (dashed) and carotenoids (orange).","checks":["Includes the red peak","Enough photosynthesis","Within the power budget"],"tips":["Chlorophyll \u003ci>a\u003c/i>’s red peak is near 662 nm.","Green, yellow and far-red lamps add little: look at the action spectrum.","Each lamp costs 25 W, so you can afford three."],"explainPrompt":"Explain why your lamps work, using the absorption and action spectra.","vocab":"Use the words wavelength, absorb, chlorophyll a, accessory pigment and action spectrum.","more":"Can you find every design that works?","allFound":"You’ve found every design that works.","after3":"Every design pairs the red peak with violet-blue or orange light the pigments use well, and skips green. That’s why grow-lights glow purple-pink."},"cards":[["Photon","A packet of light energy. Shorter wavelength → more energy per photon."],["Visible light","About 380 nm (violet) to 750 nm (red). Plants use mostly 400–700 nm."],["Pigment","A molecule that absorbs certain wavelengths; we see the colours it doesn’t absorb."],["Chlorophyll \u003ci>a\u003c/i>","The main photosynthetic pigment; peaks near 430 nm and 660 nm."],["Chlorophyll \u003ci>b\u003c/i>","An accessory pigment; peaks near 450 nm and 640 nm."],["Carotenoids","Yellow-orange accessory pigments; absorb blue and blue-green (about 420–500 nm)."],["Accessory pigment","Absorbs light chlorophyll \u003ci>a\u003c/i> misses and passes the energy to chlorophyll \u003ci>a\u003c/i>."],["Absorption spectrum","A graph of how much light a pigment absorbs at each wavelength."],["Action spectrum","A graph of the rate of photosynthesis at each wavelength."],["Engelmann’s experiment","Oxygen-seeking bacteria crowded where an alga absorbed blue and red light: evidence that absorbed light drives photosynthesis."],["Rf value","Pigment distance ÷ solvent distance; always between 0 and 1."],["Autumn colours","Chlorophyll breaks down; carotenoids (already there) show; reds are new anthocyanins."]]}};</script>
