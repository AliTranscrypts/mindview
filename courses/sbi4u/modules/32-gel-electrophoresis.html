.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 32: Virtual gel (S9 procedure lab), standard curve (S7), Read the gel stations, practice ladder strips, task preview, hero.
   Colours (plan §5): electrodes in ink (red is kept for "wrong"); ladder bands --ink-2, sample bands --ink, selection --hi,
   dye front dotted --ink-2. Light mode: pale grey slab, dark bands; dark mode: dark slab, light bands (imaging screen).
   Module tokens: --ge-slab (gel), --ge-well, --ge-buf (tank buffer). */
:root{--ge-slab:color-mix(in srgb,var(--ink-2) 15%,var(--sheet));--ge-well:color-mix(in srgb,var(--ink) 40%,var(--sheet));--ge-buf:color-mix(in srgb,var(--ink-2) 6%,var(--sheet))}

/* hero */
.hero .hero-eq .ge-heq{display:inline-block;line-height:1.3}
.ge-hero{width:100%;aspect-ratio:520 / 232}
.ge-hero svg{width:100%;height:100%;display:block}
.ge-ht{font:700 13px var(--font-ui);fill:var(--ink)}
.ge-hs{font:600 10.5px var(--font-ui);fill:var(--ink-2)}
.ge-hdl{fill:var(--ink-2)}
.ge-hds{fill:var(--ink)}
.ge-farr{stroke:var(--ink);stroke-width:2.5}

/* radio groups (from SBI4U 19 / 17 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .8em;font-size:.9rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{color:var(--ink-2);opacity:.6}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;min-width:44px;min-height:40px;padding:.2em .8em;font-weight:700;font-variant-numeric:tabular-nums}
.rg.chips button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* explore layout */
.ge-pg [hidden]{display:none!important}
.ge-pg .pg-ctrl{display:grid;gap:12px;align-content:start}
.ge-mhelp{margin:-4px 0 0}
.ge-gels{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.ge-gels.cmp{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ge-gw{margin:0;display:grid;gap:6px;justify-items:center;min-width:0}
.ge-gw > div{justify-self:stretch}
.ge-gcap{font-weight:700;font-size:.92rem}
.ge-svg{display:block;width:100%;max-width:420px;height:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ge-cap{min-height:2.6em;font-size:.92rem;margin:8px 0 6px}
.ge-load{display:grid;gap:10px}
.ge-lrow{display:grid;gap:6px}
.ge-tray{display:flex;flex-wrap:wrap;gap:6px}
.ge-tube{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;min-height:40px;padding:.25em .8em;font-weight:700;font-size:.88rem}
.ge-tube.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.ge-tube.ge-empty{border-style:dashed}
.ge-tube:disabled,.ge-lane:disabled{opacity:.55}
.ge-lanes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ge-lane{display:grid;gap:2px;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;min-height:44px;padding:.3em .45em;font-size:.8rem;line-height:1.2}
.ge-ln{font-weight:700}
.ge-lt{color:var(--ink-2);overflow-wrap:anywhere}
.ge-sl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.ge-sl input[type=range]{width:100%;min-height:40px;accent-color:var(--ink)}
.ge-sl output{font-weight:700;font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
.ge-vnote{margin:-4px 0 0;color:var(--ink-2)}
.ge-run{display:flex;flex-wrap:wrap;gap:8px}
.ge-swv{display:inline-block;margin-left:.35em;padding:0 .45em;border-radius:999px;border:1px solid currentColor;font-size:.8em}
.ge-sw[aria-checked="true"] .ge-swv{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.ge-note{color:var(--ink-2);margin-top:10px}

/* gel SVG */
.ge-buf{fill:var(--ge-buf);stroke:var(--rule);stroke-width:1}
.ge-elec{fill:var(--ink)}
.ge-et{font:700 11.5px var(--font-ui);fill:var(--sheet)}
.ge-slab{fill:var(--ge-slab);stroke:var(--ink-2);stroke-width:1}
.ge-well{fill:var(--ge-well)}
.ge-ax{stroke:var(--ink-2);stroke-width:1}
.ge-t{font:500 9.5px var(--font-ui);fill:var(--ink-2)}
.ge-ts{font:600 9.5px var(--font-ui);fill:var(--ink-2)}
.ge-tk{font:700 10px var(--font-ui);fill:var(--ink)}
.ge-lc{font:700 10px var(--font-ui);fill:var(--ink)}
.ge-big{font:700 13px var(--font-ui);fill:var(--ink)}
.ge-bl{fill:var(--ink-2)}
.ge-bs{fill:var(--ink)}
.ge-dye{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:2 3}
.ge-out{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3;fill:none}
.ge-outh{fill:var(--ink)}
.ge-dot{fill:var(--ink)}
.ge-hit{fill:transparent}
.ge-bd{cursor:pointer;outline:none}
.ge-bd:focus-visible .ge-hit{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 2}
.ge-ring{fill:none;stroke:var(--hi);stroke-width:2.4}
.ge-rul{stroke:var(--hi);stroke-width:1.8;fill:none}
.ge-rl{font:700 10px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--ge-slab);stroke-width:3px;stroke-linejoin:round}
.ge-gl{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 2}
.ge-gb{stroke:var(--ink);stroke-width:1.6;fill:none}
.ge-gt{font:700 9.5px var(--font-ui);fill:var(--ink)}

/* Part 3 */
.ge-p3{display:grid;gap:22px}
.ge-stn > h3{margin-top:0}
.ge-srow{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
.ge-sgw{min-width:0}
.ge-ssvg{max-width:280px}
.ge-tbl{border-collapse:collapse;font-size:.92rem}
.ge-tbl th,.ge-tbl td{border-bottom:1px solid var(--rule);padding:.35em .6em;text-align:left}
.ge-rule{margin:.4em 0}
.ge-q{font-weight:700;margin:.6em 0 .3em}
.ge-sq{margin-top:10px}
.ge-cw{max-width:520px}
.ge-cw svg{display:block;width:100%;height:auto}
.ge-grid{stroke:var(--rule);stroke-width:1}
.ge-fit{stroke:var(--ink-2);stroke-width:2}
.ge-pt{fill:var(--ink-2);stroke:var(--sheet);stroke-width:1.5}
.ge-ptc{fill:none;stroke:var(--hi);stroke-width:2.5}
.ge-mk{fill:var(--ink)}
.ge-guide{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 3}
.ge-drop{font-weight:700}

/* practice strips */
.ge-strip{margin:6px 0 10px;max-width:520px}
.ge-strip svg{display:block;width:100%;height:auto}
.ge-strip figcaption{margin-top:2px}

/* task */
.ge-tin{display:grid;gap:12px}
.ge-tpv h4{margin:0 0 8px}
.ge-tpv .read{margin-top:10px}
.ge-tlist{margin:.4em 0 .6em 1.2em}

@media (max-width:640px){
  .ge-gels.cmp{grid-template-columns:minmax(0,1fr)}
  .ge-lanes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ge-srow{grid-template-columns:minmax(0,1fr)}
  .ge-sl{grid-template-columns:minmax(0,1fr) auto}
  .ge-sl label{grid-column:1 / -1}
}

" role=\"img\" aria-label=\"A gel slab with six wells at the left, negative end; the right end is the positive electrode. DNA dots sit in two wells. An arrow points toward plus, and the dots stream right: short fragments pull ahead and long ones lag. The dots settle into sharp bands beside a ladder lane, with 1000 bp near the wells and 100 bp far away.\">\u003c/div>"}},"goals":["I can explain why DNA moves toward the positive electrode, and set up a gel so that it does.","I can explain why smaller DNA fragments travel farther through a gel than larger ones.","I can estimate a fragment’s size by comparing its band with a ladder.","I can predict how gel percentage, voltage and run time change a gel, and choose settings for a task.","I can use controls to decide whether a gel result can be trusted.","I can interpret banding patterns in forensic and parentage comparisons, including what a match does and doesn’t show."],"start":{"warmup":{"questions":[{"id":"w1","skill":"DNA structure","goal":1,"prompt":"Which part of a DNA nucleotide carries a negative charge?","options":[{"t":"The deoxyribose sugar","why":"The sugar is neutral; it links the phosphates.","_n":"0323","_k":"ca8c5417"},{"t":"The hydrogen bonds","why":"Hydrogen bonds are attractions between bases, not charged groups.","_n":"1313","_k":"1e26dfc1"},{"t":"The phosphate group","why":"Each phosphate in the backbone carries a negative charge.","_n":"2303","_k":"fd12b188"},{"t":"The nitrogenous base","why":"The bases pair by hydrogen bonds; the charge is on the phosphates.","_n":"3373","_k":"9a9f6139"}],"hints":["Which part of the backbone is acidic?","The backbone alternates sugar and phosphate.","The phosphate group."]},{"id":"w2","skill":"DNA structure","goal":2,"prompt":"A DNA fragment is described as 300 bp. What does that tell you?","options":[{"t":"It has a mass of 300 g","why":"bp is a length unit, not a mass.","_n":"4363","_k":"95c70ef7"},{"t":"It contains 300 genes","why":"A gene is usually thousands of .5 mm is halfway between, so halfway between 200 and 300.","_n":"h9c2","_k":"5fc932fc"},{"t":"275","why":"Halfway between 200 and 300 is 250.","_n":"i9d2","_k":"63105385"},{"t":"350","why":"Values get \u003cstrong>bigger\u003c/strong> as the distance gets \u003cstrong>smaller\u003c/strong> here.","_n":"j9e2","_k":"27b7666f"}],"hints":["Which way does the scale run?","200 at 30 mm, 300 at 25 mm: bigger values are closer to 0 mm.","Halfway: 250."]},{"id":"w6","skill":"PCR and controls","goal":5,"prompt":"Why does an experiment include a control?","options":[{"t":"To guarantee the hypothesis is right","why":"A control can show the hypothesis is wrong.","_n":"k9d2","_k":"4dc6440b"},{"t":"To use up extra materials","why":"Every control answers a question.","_n":"l9c2","_k":"82b88f83"},{"t":"To make the experiment take less time","why":"Controls add work; they add trust.","_n":"m9b2","_k":"b0213b27"},{"t":"To show what happens without the factor being tested, so you can tell whether the result is real","why":"A control shows what ‘no effect’ looks like, so you have something to compare with.","_n":"na22","_k":"10568363"}],"hints":["What would you compare your result to?","A run where the factor is missing.","It shows what ‘no effect’ looks like."]}],"refreshers":{"DNA structure":"DNA’s backbone is sugar–phosphate–sugar–phosphate. Each phosphate is negative, so the whole molecule is negative, and the charge grows with length. Length is counted in base pairs (bp).","Electric charge":"Opposite charges attract. A negative particle moves toward the positive electrode.","PCR and controls":"PCR copies only the region between two primers, so its product has a set size. Controls show what a result looks like when something is missing, so you know whether your result is trustworthy.","Reading a scale":"Check which way a scale runs before reading between marks. On a gel, size gets smaller as distance from the wells gets bigger."}}},"explore":{"heading":"Virtual gel","intro":"Set up nd \u003ci>b\u003c/i> depend on the gel: 0.8% 50, 18 · 1.0% 44, 22 · 1.5% 39, 29 · 2.0% 33, 32. The gel is 60 mm long; the dye front is a model 50 bp fragment. Distances are rounded to 0.1 mm, and every check uses the rounded value. Real gels only roughly follow this.","aha":"Negative DNA runs to +; small fragments go farther; a higher percentage spreads small fragments apart but slows everything; and the run has to stop before the small bands run off.","predIntro":"Make a prediction first. Then the virtual gel will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"run","orient":"pos","lanes":["l100","A","","","",""],"gel":"1.5","V":100,"t":60},"prompt":"\u003cspan class=\"muted\">Wells at the + end; lane 1 the 100 bp ladder, lane 2 Sample A; 1.5%; 100 V; 60 min.\u003c/span> Where will the DNA be after the run?","options":[{"t":"Out of the gel: it left the wells away from the gel","_n":"oa12","_k":"096f1681"},{"t":"Halfway down the gel","_n":"pa02","_k":"0121bf38"},{"t":"Still in the wells","_n":"q9f2","_k":"7ee9003f"},{"t":"Normal bands down the gel","_n":"r962","_k":"c221d920"}],"reveal":"DNA streams out of the backs of the wells; the gel lanes are empty.","explain":"DNA moves toward +. With the wells next to the + electrode, ‘+’ is behind the wells, outside the gel."},{"id":"p2","start":{"mode":"run","orient":"neg","lanes":["","B","","","",""],"gel":"1.5","V":100,"t":60},"prompt":"\u003cspan class=\"muted\">Wells at the − end; Sample B (600 bp and 250 bp); 1.5%; 100 V; 60 min.\u003c/span> Which band ends up farther from the wells?","options":[{"t":"It depends on which was loaded first","_n":"s952","_k":"f97fb2f6"},{"t":"250 bp","_n":"t981","_k":"7f1bbf5a"},{"t":"They stay together","_n":"u991","_k":"14bc4311"},{"t":"600 bp","_n":"v9a1","_k":"d847beea"}],"reveal":"Bands at 27.5 mm (250 bp) and 16.4 mm (600 bp).","explain":"Same charge per base pair, but the shorter fragment slips through the mesh faster."},{"id":"p3","start":{"mode":"compare","orient":"neg","lanes":["l100","","","","",""],"gel":"0.8","gel2":"2.0","V":100,"t":60},"prompt":"\u003cspan class=\"muted\">Compare mode: 0.8% and 2.0%, the 100 bp ladder in both, 100 V, 60 min.\u003c/span> On which gel does the 100 bp band travel farther?","options":[{"t":"Same distance","_n":"w9b1","_k":"7b454c58"},{"t":"0.8%","_n":"x9c1","_k":"b7421a35"},{"t":"2.0%","_n":"y9d1","_k":"3ac39c04"},{"t":"Neither: it runs off both","_n":"z9e1","_k":"536ba282"}],"reveal":"The 100 bp band: 50.0 mm on 0.8%, 33.0 mm on 2.0%.","explain":"A lower percentage means bigger pores, so DNA moves more easily."},{"id":"p4","start":{"mode":"run","orient":"neg","lanes":["l100","","","","",""],"gel":"1.5","V":100,"t":30,"sel":[300,400]},"to":60,"prompt":"\u003cspan class=\"muted\">The 100 bp ladder on 1.5% at 100 V, stopped at 30 min, then run on to 60 min.\u003c/span> What happens to the gap between the 300 bp and 400 bp bands from 30 to 60 minutes?","options":[{"t":"It halves","_n":"109f1","_k":"c35ec5fa"},{"t":"It doubles (about 1.8 mm to 3.6 mm)","_n":"11901","_k":"bca29816"},{"t":"The bands merge","_n":"12911","_k":"9f535c6f"},{"t":"It stays the same","_n":"13a22","_k":"8d84a7ec"}],"reveal":"The gap m&#101;ter reads 1.8 mm, then 3.6 mm.","explain":"Each band moves at its own steady speed, so the gap grows with time. That’s why longer runs separate close sizes, until the smallest bands run off."}],"chalIntro":"Use the virtual gel to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help. In Compare mode, the checks use the left gel.","challenges":[{"id":"tc1","goal":[1,4],"prompt":"Load the 100 bp ladder. Make its 500 bp band stop between 25.0 and 30.0 mm from the wells.","why":"Any setting that puts the 500 bp band from 25.0 to 30.0 mm works: for example 1.0% at 100 V for 60 min (28.6 mm), 0.8% at 70 V for 60 min (26.2 mm) or 1.5% at 90 V for 90 min (25.3 mm).","wrong":{"pos":"Your DNA left the gel: the wells must be at the negative end.","far":"Too far: lower the voltage or stop sooner.","near":"Not far enough: raise the voltage, run longer, or choose a lower percentage.","load":"Load the 100 bp ladder into a lane first."},"hints":["Distance grows with voltage and with time.","On 1.0% at 100 V, the 500 bp band moves 28.6 mm per hour.","1.0%, 100 V, 60 min gives 28.6 mm."]},{"id":"tc2","goal":4,"prompt":"Separate the 400 bp and 500 bp ladder bands by at least 3.0 mm, while the 100 bp band is still on the gel.","why":"Only 1.5% or 2.0% gels can do it: for example 2.0% at 100 V for 60 min (gap 3.1 mm, 100 bp at 33.0 mm) or 1.5% at 100 V for 70 min (gap 3.3 mm, 100 bp at 45.5 mm).","wrong":{"pos":"Your DNA left the gel: the wells must be at the negative end.","low":"On this gel, by the time those bands are 3 mm apart, the 100 bp band has run off. Try a higher percentage.","close":"Close: run a little longer.","off":"Too long: the small fragments ran off.","load":"Load the 100 bp ladder into a lane first."},"hints":["Which gels spread small fragments apart most?","Per hour at 100 V, the 400–500 gap is 1.7 mm (0.8%), 2.1 mm (1.0%), 2.8 mm (1.5%) or 3.1 mm (2.0%).","2.0% at 100 V for 60 min: gap 3.1 mm, 100 bp band at 33.0 mm."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"At 100 V, find the \u003cstrong>shortest\u003c/strong> run (in 10-minute steps), on any gel, that separates 250 bp from 300 bp by at least 2.0 mm with the 100 bp band still on the gel. (Sample A and the ladder’s 300 bp marker are loaded.)","why":"2.0% for 50 min: gap 2.1 mm, with the 100 bp band at 27.5 mm. The 2.0% gel spreads these sizes fastest.","wrong":{"pos":"Your DNA left the gel: the wells must be at the negative end.","volt":"Set the voltage to 100 V.","g15":"That works, but the 2.0% gel gets there sooner.","g20t40":"Gap 1.7 mm: not yet.","g10":"Works, but slower.","works":"That works, but a shorter run also works.","notYet":"Not yet: the gap is under 2.0 mm.","off":"The 100 bp band ran off the gel."},"hints":["The gap grows at a steady rate on each gel. Which gel’s rate is fastest?","Gap per hour for 250 vs 300 bp: 0.8% 1.4 mm, 1.0% 1.7 mm, 1.5% 2.3 mm, 2.0% 2.5 mm.","On 2.0% you need 2.0 ÷ 2.5 of an hour, about 48 min, so 50 min."]}]},"part3":{"slug":"read-gel","name":"Read the gel","heading":"Read the gel","intro":"Explore was about \u003cem>making\u003c/em> a gel. Here you read gels as evidence: size an unknown with a standard curve, compare banding patterns, and judge a PCR by its controls.","curve":{"panel":"Check it with data: the standard curve","how":"The 1.5%, 60 min ladder positions, plotted as size (log scale) against distance from the wells.","note":"The points fall on a straight line in this model; on real gels the line is close to straight in the middle sizes.","text":"The ladder turns distance into size. It only works because the ladder ran on the same gel, at the same voltage, for the same time.","drop":"Sample C’s band (23.2 mm) dropped onto the line reads across to about 350 bp."},"s1":{"title":"Station 1: size an unknown","how":"Sample C runs beside the 100 bp ladder on the default gel (1.5%, 100 V, 60 min). Tap the two ladder bands on either side of the unknown band.","unknown":"That’s the unknown band. Tap the ladder bands just above and just below it.","far":"That ladder band isn’t next to the unknown’s 23.2 mm. Tap the ladder bands on either side of it.","one":"Good: that one is next to the unknown. Now tap the ladder band on its other side.","done":"The unknown at 23.2 mm sits between 300 bp (25.2 mm) and 400 bp (21.5 mm). Read across on the curve: about 350 bp."},"s2":{"title":"Station 2: forensic comparison","how":"Made-up profiles, four markers, run on one gel. Tap the person who can’t be excluded as the source of the scene sample.","lanes":[["Scene sample",[180,260,340,470]],["Person 1",[180,260,340,470]],["Person 2",[180,290,340,470]],["Person 3",[200,260,380,520]]],"choices":[{"t":"Person 1","fb":"Person 2 differs in one band, so they are excluded (if the gel ran properly). Person 1 matches at every marker, so they can’t be excluded. How strong that is depends on how rare this pattern is in the population.","_n":"14a12","_k":"757f489b"},{"t":"Person 2","fb":"Person 2 differs in one band (290 bp where the scene has 260 bp), so they are excluded, if the gel ran properly. One clear mismatch excludes.","_n":"15a42","_k":"f077c488"},{"t":"Person 3","fb":"Person 3 differs at three markers (200, 380 and 520 bp), so they are excluded.","_n":"16a32","_k":"5a247d94"}]},"s3":{"title":"Station 3: parentage","how":"Made-up profiles. Which possible parent fits the child?","rule":"Every band in the child must come from one parent or the other.","lanes":[["Child",[210,330,450,580]],["Mother",[210,450,620]],["Possible parent A",[330,500,580]],["Possible parent B",[330,490,640]]],"choices":[{"t":"Possible parent A","fb":"The child’s bands not from the mother are 330 and 580; only A has both.","_n":"179e2","_k":"3ab7a8c8"},{"t":"Possible parent B","fb":"B has the 330 band but no 580 band, so the child’s 580 band would have no source. The child’s bands not from the mother are 330 and 580; only A has both.","_n":"189d2","_k":"6f31cbbd"}]},"s4":{"title":"Station 4: checking a PCR","how":"Expected product: 450 bp. Lane 1 is the 100 bp ladder (normal); lane 2 the sample; lane 3 the positive control (known template); lane 4 the no-template control.","lanes":[["100 bp ladder","ladder"],["Sample",[450]],["Positive control",[450]],["No-template control",[450]]],"q":"Can the lab report the sample as positive?","choices":[{"t":"No: the no-template control has a band","fb":"No. The no-template control should be empty; a band means contamination, so the sample’s band can’t be trusted. Repeat with fresh materials.","_n":"19a02","_k":"91a4253b"},{"t":"Yes: the sample band is the right size","fb":"The size is right, but the no-template control has a band too. The no-template control has no DNA to copy. A band there means something was contaminated, so the sample’s band can’t be trusted.","_n":"1a9f2","_k":"fc5bde0e"},{"t":"Yes: the positive control worked","fb":"The positive control only shows the PCR can work. The no-template control should be empty. The no-template control has no DNA to copy. A band there means something was contaminated, so the sample’s band can’t be trusted.","_n":"1b9a2","_k":"41cb0992"}]},"quickCheck":{"title":"Quick check","summary":"Read the gel quick check","items":[{"id":"q1","goal":3,"prompt":"On the standard curve (log size vs distance), what do the ladder points make in this model?","choices":[{"t":"A horizontal line","fb":"Size falls steadily (on a log scale) as distance grows, which is why you can read across.","_n":"1c992","_k":"bb0b6dd3"},{"t":"A U-shape","fb":"Size falls steadily (on a log scale) as distance grows, which is why you can read across.","_n":"1d9c2","_k":"191c3f6a"},{"t":"Random scatter","fb":"Size falls steadily (on a log scale) as distance grows, which is why you can read across.","_n":"1e9d2","_k":"857e4810"},{"t":"A straight line","fb":"Right. Size falls steadily (on a log scale) as distance grows, which is why you can read across.","_n":"1f9a2","_k":"2965b669"}]},{"id":"q2","goal":6,"prompt":"Child: 210, 330. Mother: 210, 400. Which band must the other parent have?","choices":[{"t":"400","fb":"The child’s 330 band didn’t come from the mother.","_n":"1g9b2","_k":"e78c7dc8"},{"t":"210","fb":"The child’s 330 band didn’t come from the mother.","_n":"1ha02","_k":"4c2b3db1"},{"t":"Any of them","fb":"The child’s 330 band didn’t come from the mother.","_n":"1ia12","_k":"7365b5ad"},{"t":"330","fb":"Right. The child’s 330 band didn’t come from the mother.","_n":"1j9e2","_k":"9686a819"}]},{"id":"q3","goal":5,"prompt":"The no-template control shows a band. What does that mean?","choices":[{"t":"Contamination: results can’t be trusted","fb":"Right. With no template, nothing should be copied.","_n":"1k9f2","_k":"5f28ce43"},{"t":"The gel ran too long","fb":"With ile the current is on.","_n":"2j920","_k":"9fc2fe32"},{"t":"55.0 mm","why":"Half the time, half the distance.","_n":"2k930","_k":"b1e9e0d6"},{"t":"13.7 mm","why":"Half the time, half the distance: 27.5 ÷ 2 ≈ 13.7 mm.","_n":"2l900","_k":"6bf4527d"},{"t":"6.9 mm","why":"That’s a quarter of the distance. Half the time, half the distance.","_n":"2m910","_k":"7f959c8e"}],"goal":4,"hints":["Does each band move at a steady speed?","Yes, in this model.","Half of 27.5 is 13.75, so about 13.7 mm."]}]},{"id":"detective","type":"custom","title":"Gel detective","summary":"Gel detective","star":true,"goal":[1,4,5,6],"instruction":"Six gel puzzles. Puzzles 2 to 6 are non-routine (★); puzzles 3 and 6 go beyond the Final Check.","items":[{"id":"d1","kind":"mc","goal":4,"prompt":"The same ladder runs for 60 min at 100 V on 1.0% and on 2.0%. On which gel are the 400 and 500 bp bands farther apart?","options":[{"t":"1.0%","why":"Lower percentage moves DNA farther overall but spreads small fragments less.","_n":"2n8e0","_k":"8a344702"},{"t":"2.0%","why":"3.1 mm on 2.0% vs 2.1 mm on 1.0%.","_n":"2o8f0","_k":"8c7dd82b"},{"t":"The same on both","why":"Gel percentage changes the spacing. A higher percentage means smaller pores: everything moves more slowly, but small fragments spread farther apart.","_n":"2p9c0","_k":"81624bcd"}]},{"id":"d2","kind":"mc","star":true,"goal":4,"prompt":"A 200 bp band is at 30.3 mm after 60 min at 100 V. Where would it be after 60 min at 50 V?","options":[{"t":"30.3 mm","why":"Voltage sets the speed. Half the voltage, half the speed.","_n":"2q9d0","_k":"000621b7"},{"t":"About 15 mm","why":"Half the voltage, half the speed: 30.3 ÷ 2 ≈ 15 mm.","_n":"2r1c8","_k":"30dcb908"},{"t":"60 mm","why":"Half the voltage, half the speed.","_n":"2s1d8","_k":"0c839349"}]},{"id":"d3","kind":"mc","star":true,"goal":3,"prompt":"An unknown band sits between the 300 and 400 bp markers, much closer to the 400 bp band. Which size fits best?","options":[{"t":"380 bp","why":"Close to the 400 bp band means a size close to 400.","_n":"2t1a8","_k":"8be69430"},{"t":"320 bp","why":"Farther from the wells means smaller. A band past the 300 bp marker is less than 300 bp. Closer to 400 means nearer 400 in size.","_n":"2u1b8","_k":"1b76fd25"},{"t":"420 bp","why":"It’s between the markers, so under 400.","_n":"2v208","_k":"adc93205"},{"t":"280 bp","why":"280 bp would be past the 300 bp marker, not between the markers.","_n":"2w218","_k":"7582cd19"}],"hints":["Distance to each marker?","Close to the 400 bp band means a size close to 400.","380 bp."]},{"id":"d4","kind":"sel","star":true,"goal":4,"prompt":"\u003cspan class=\"tag\">Investigation\u003c/span> You test whether voltage changes how far a 500 bp fragment travels. Which must stay the same? (Select all that apply.)","options":[{"t":"Gel percentage","_n":"2x1e8","_k":"ae7a84c0"},{"t":"Run time","_n":"2y1f8","_k":"3bc1735a"},{"t":"The sample","_n":"2z148","_k":"50aa4467"},{"t":"Voltage","why":"That’s what you’re changing: the independent variable.","_n":"30158","_k":"a176e574"}],"why":"Gel percentage, run time and the sample are controlled variables; voltage is the independent variable.","hints":["What are you changing on purpose?","Voltage is the independent variable.","Keep the gel percentage, the run time and the sample the same."]},{"id":"d5","kind":"mc","star":true,"goal":5,"prompt":"One lane shows a long smear from the wells to 40 mm instead of a sharp band. What is the most likely explanation?","options":[{"t":"The ladder was missing","why":"The ladder is in its own lane; it can’t smear this one.","_n":"31228","_k":"1deb5a27"},{"t":"The wells faced the + end","why":"Then nothing would be in the gel at all.","_n":"32218","_k":"caff7ed3"},{"t":"The gel percentage was too high","why":"A higher percentage slows bands and spreads small ones, but each size still makes a sharp band.","_n":"33248","_k":"c716e813"},{"t":"The DNA was broken into many different lengths","why":"Many different lengths stop at negative, so DNA moves toward \u003cstrong>+\u003c/strong>. Wells go at the negative end.","_n":"391a8","_k":"626c5335"},{"t":"The phosphate backbone is actually positive.","why":"Phosphates are negative.","_n":"3a198","_k":"2d6c7745"},{"t":"Run the gel longer to see the bands.","why":"The DNA left the gel; more time won’t help.","_n":"3b908","_k":"0a07ea9f"},{"t":"Negative DNA moves toward the \u003cstrong>positive\u003c/strong> electrode, so the wells go at the negative end.","why":"The phosphate backbone is negative, so DNA moves toward \u003cstrong>+\u003c/strong>. Wells go at the negative end.","_n":"3c918","_k":"c1e41d18"}],"hints":["Do opposite charges attract or repel?","Attract: negative DNA goes to +.","Fix step 2."]},{"id":"e2","goal":3,"task":"Estimate the size of a band at 27.5 mm (ladder: 200 bp at 30.3 mm, 300 bp at 25.2 mm).","steps":["The ladder shows 200 bp at 30.3 mm and 300 bp at 25.2 mm.","My band at 27.5 mm lies between those two markers.","It’s past the 300 bp band, so it’s bigger than 300 bp.","So it’s about 350 bp.","Its PCR product is the right size."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier.","Step 5 follows from the earlier steps. The mistake is earlier."],"fixes":[{"t":"It’s about 2750 bp.","why":"Distance in mm isn’t size in bp.","_n":"3d928","_k":"8f0bf737"},{"t":"It’s exactly 275 bp.","why":"Halfway between 200 and 300 is 250.","_n":"3e938","_k":"c082b3e3"},{"t":"Farther from the wells means smaller: it’s between 200 and 300 bp, about 250 bp.","why":"Farther from the wells means smaller. A band past the 300 bp marker is less than 300 bp.","_n":"3f8c8","_k":"be719148"},{"t":"Step 3 is correct.","why":"Farther from the wells means smaller. A band past the 300 bp marker is less than 300 bp.","_n":"3g8d8","_k":"9e0de325"}],"hints":["Is the 300 bp band nearer or farther from the wells than the 200 bp band?","Nearer (25.2 mm vs 30.3 mm).","A band at 27.5 mm is between 200 and 300: about 250 bp."]},{"id":"e3","goal":6,"task":"Compare a scene sample (bands 180, 240, 310, 420 bp) with two people.","steps":["Person 1 has bands 180, 240, 310, 420.","Person 2 has bands 180, 260, 310, 420.","Person 2 matches 3 of 4 bands, so Person 2 could also be the source.","So both people are equally likely sources."],"_a":"Vw==","stepFb":["Step 1 reads the gel correctly.","Step 2 reads the gel correctly.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"A full match means the person can’t be excluded; its strength depends on how rare the pattern is. One clear mismatch excludes them.","_n":"3h8e8","_k":"3a94f593"},{"t":"Neither can be compared without more markers.","why":"The mismatch already excludes Person 2.","_n":"3i8f8","_k":"f9813b39"},{"t":"Three matches out of four proves Person 2 is the source.","why":"A full match means the person can’t be excluded; its strength depends on how rare the pattern is. One clear mismatch excludes them.","_n":"3j988","_k":"2d7ef9df"},{"t":"One clear mismatch (260 vs 240) excludes Person 2, if the gel ran properly. Only Person 1 can’t be excluded.","why":"A full match means the person can’t be excluded; its strength depends on how rare the pattern is. One clear mismatch excludes them.","_n":"3k998","_k":"3b7976d8"}],"hints":["Must a source match at every marker?","Yes: a person’s DNA profile doesn’t change.","Person 2 is excluded."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the virtual gel: the backward-wells result, or how gel percentage changed the spacing?"},{"id":"j2","q":"In your own words, why does a small fragment travel farther than a large one, even though it carries less charge?"},{"id":"j3","q":"Explain to a friend how to read the size of an unknown band from a ladder."},{"id":"j4","q":"Which part of reading a gel are you least sure about (controls, sizing or matching)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Why does DNA move toward the positive electrode in gel electrophoresis?","options":[{"t":"Its bases are positively charged","why":"Bases aren’t the charged part; phosphates are, and they’re negative.","_n":"3l968","_k":"dfccfcdb"},{"t":"The gel pushes it in that direction","why":"The gel only slows DNA; the electric field moves it.","_n":"3m958","_k":"acae75fd"},{"t":"Its phosphate backbone is negatively charged","why":"Opposite charges attract: the negative phosphates pull DNA toward +.","_n":"3n948","_k":"b3f8a474"},{"t":"Larger fragments are heavier and sink that way","why":"Gravity isn’t involved; charge is.","_n":"3o938","_k":"569f809d"}]},"b":{"prompt":"A student sets up a gel with the wells beside the positive electrode. What happens to the DNA?","options":[{"t":"It stays in the wells","why":"The field still moves it.","_n":"3p928","_k":"755389cb"},{"t":"It runs through the gel faster","why":"Direction, not speed, is the problem.","_n":"3q918","_k":"25de9a25"},{"t":"It runs through the gel normally","why":"DNA moves toward +, which is behind these wells.","_n":"3r908","_k":"66fe2d8f"},{"t":"It moves out of the wells away from the gel, so no bands appear","why":"The phosphate backbone is negative, so DNA moves toward \u003cstrong>+\u003c/strong>. Wells go at the negative end.","_n":"3s8f8","_k":"dfde1c50"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"One lane holds fragments of 300, 800 and 1500 bp. Which band ends up closest to the wells?","options":[{"t":"800 bp","why":"The middle size ends up in the middle.","_n":"3t9e8","_k":"98ba0430"},{"t":"All three end up together","why":"Same charge per base pair, but different sizes move at different speeds.","_n":"3u9d8","_k":"51d433c4"},{"t":"1500 bp","why":"The largest fragment is held back most by the mesh.","_n":"3v247","_k":"55449aa0"},{"t":"300 bp","why":"The smallest travels farthest from the wells.","_n":"3w257","_k":"841150d7"}]},"b":{"prompt":"One lane holds fragments of 200, 600 and 2000 bp. Which band ends up farthest from the wells?","options":[{"t":"2000 bp","why":"The gel is a mesh. Small fragments slip through faster, so they end up \u003cstrong>farther\u003c/strong> from the wells.","_n":"3x227","_k":"76680d4b"},{"t":"200 bp","why":"The gel is a mesh. Small fragments slip through faster, so they end up \u003cstrong>farther\u003c/strong> from the wells.","_n":"3y237","_k":"8d9944fc"},{"t":"600 bp","why":"The middle size ends up in the middle.","_n":"3z207","_k":"333fbbf3"},{"t":"All three end up together","why":"Every base pair carries the same charge, so the push per base pair is the same. Size, not charge, decides how fast a fragment moves.","_n":"40217","_k":"72ce58f1"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A run is repeated with the gel changed from 1.0% to 2.0% agarose, with the same voltage and time. What changes?","options":[{"t":"All bands travel farther","why":"Smaller pores slow DNA down.","_n":"411e7","_k":"6988b921"},{"t":"Large fragments spread farther apart","why":"Large fragments barely move in a 2.0% gel.","_n":"421f7","_k":"434eb8d1"},{"t":"Nothing changes","why":"Percentage sets pore size.","_n":"431c7","_k":"b40ffd71"},{"t":"All bands travel less far, but small fragments spread farther apart","why":"A higher percentage means smaller pores: everything moves more slowly, but small fragments spread farther apart.","_n":"441d7","_k":"39c62126"}]},"b":{"prompt":"To separate fragments of 4000 and 5000 bp, which gel is the better choice?","options":[{"t":"2.0% agarose","why":"In a 2.0% gel, fragments this large barely leave the wells.","_n":"458a7","_k":"b8755482"},{"t":"Either: percentage doesn’t matter","why":"A higher percentage means smaller pores: everything moves more slowly, but small fragments spread farther apart.","_n":"46897","_k":"e4c8e60d"},{"t":"1.5% agarose","why":"Still too dense for fragments this large.","_n":"478c7","_k":"9b68d822"},{"t":"0.8% agarose","why":"Lower-percentage gels are for large fragments.","_n":"488b7","_k":"279f699b"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"The 300 bp ladder band is at 25.2 mm and the 400 bp band at 21.5 mm. An unknown band is at 23.2 mm. Best estimate?","options":[{"t":"23 bp","why":"That reads the distance in mm as a size.","_n":"498e7","_k":"dc68930a"},{"t":"About 450 bp","why":"450 bp would be nearer the wells than the 400 bp band.","_n":"4a8d7","_k":"5d462373"},{"t":"About 250 bp","why":"250 bp would be farther than the 300 bp band.","_n":"4b907","_k":"67a5a323"},{"t":"About 350 bp","why":"23.2 mm is between the 300 and 400 bp bands.","_n":"4c8f7","_k":"63f85d70"}]},"b":{"prompt":"The 200 bp ladder band is at 30.3 mm and the 300 bp band at 25.2 mm. An unknown band is at 27.5 mm. Best estimate?","options":[{"t":"About 350 bp","why":"Farther from the wells means smaller. A band past the 300 bp marker is less than 300 bp.","_n":"4d927","_k":"1f2c300b"},{"t":"About 250 bp","why":"27.5 mm is between the 200 and 300 bp bands.","_n":"4e917","_k":"e2eef46e"},{"t":"27 bp","why":"That reads the distance as a size.","_n":"4f187","_k":"d37bc197"},{"t":"About 150 bp","why":"150 bp would be farther than the 200 bp band.","_n":"4g197","_k":"fec4c453"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Products of 250 and 300 bp are only 1.5 mm apart after 40 min on a 1.5% gel at 100 V. The 100 bp band is at 26 mm. Using the same gel, what is the best fix?","options":[{"t":"Lower the voltage for the same 40 min","why":"Slower movement makes the gap smaller.","_n":"4h1a7","_k":"ff980a00"},{"t":"Run it longer, about 80 min: the gap doubles to about 3 mm, and the 100 bp band (about 52 mm) stays on the gel","why":"Each band moves at a steady speed, so doubling the time doubles the gap.","_n":"4i1b7","_k":"abc71865"},{"t":"Reverse the electrodes","why":"The DNA would leave the gel.","_n":"4j1c7","_k":"db82c20c"},{"t":"Switch to a 1 kb ladder","why":"The ladder doesn’t change the samples’ spacing.","_n":"4k1d7","_k":"3f1face2"}]},"b":{"prompt":"After 60 min at 100 V on a 0.8% gel, bands of 400 and 500 bp are only 1.7 mm apart. Which change separates them most in the same 60 min?","options":[{"t":"Run for 30 min","why":"Less time, smaller gap.","_n":"4l1e7","_k":"ad5e8a20"},{"t":"Load twice as much DNA","why":"More DNA makes thicker bands, not more space.","_n":"4m1f7","_k":"53e056ca"},{"t":"A 2.0% gel (gap about 3.1 mm)","why":"A higher percentage spreads small fragments farther apart.","_n":"4n107","_k":"ca0dbc94"},{"t":"A 0.5% gel","why":"Lower percentage spreads small fragments \u003cstrong>less\u003c/strong>.","_n":"4o117","_k":"b6409ad3"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A child’s bands are 220, 340, 410 and 560 bp; the mother’s are 220, 410 and 600. Every band in the child must come from one parent. Which possible father fits?","options":[{"t":"Bands 340, 560, 700","why":"The child’s 340 and 560 bands didn’t come from the mother; this father has both.","_n":"4p1e7","_k":"3325d7bf"},{"t":"Bands 340, 480, 700","why":"No 560 band: the child’s 560 band has no source.","_n":"4q1d7","_k":"e2632600"},{"t":"Bands 220, 410, 600","why":"That matches the mother; the child’s 340 and 560 bands still need a source.","_n":"4r1c7","_k":"1efea264"},{"t":"Bands 300, 560, 650","why":"No 340 band.","_n":"4s1b7","_k":"af659cd0"}]},"b":{"prompt":"A child’s bands are 250, 310, 470 and 520 bp; the mother’s are 250, 380 and 520. Which possible father fits?","options":[{"t":"Bands 310, 400, 470","why":"The child’s 310 and 470 bands didn’t come from the mother; this father has both.","_n":"4t227","_k":"981d012d"},{"t":"Bands 250, 380, 520","why":"That matches the mother; 310 and 470 still need a source.","_n":"4u217","_k":"af22f0c0"},{"t":"Bands 290, 470, 610","why":"No 310 band.","_n":"4v207","_k":"62365b9a"},{"t":"Bands 310, 450, 600","why":"No 470 band.","_n":"4w1f7","_k":"4e0a8ff0"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why smaller DNA fragments travel farther through a gel?","options":[{"t":"“Smaller fragments are lighter, so gravity pulls them less.”","why":"Gravity plays no part.","_n":"4x167","_k":"e577e5ab"},{"t":"“Large fragments are stuck in the wells for good.”","why":"Large fragments move, just slowly.","_n":"4y157","_k":"dff23669"},{"t":"“Smaller fragments carry more negative charge.”","why":"Charge grows with length, not the other way.","_n":"4z8c7","_k":"05dc31ef"},{"t":"“Every base pair carries the same negative charge, so all fragments feel the same pull per base pair. The gel’s mesh slows long fragments more, so short ones get farther in the same time.”","why":"Every base pair carries the same charge, so the push per base pair is the same. Size, not charge, decides how fast a fragment moves.","_n":"508d7","_k":"0a95c63a"}]},"b":{"prompt":"Which is the best explanation of why a 2000 bp fragment travels less far than a 200 bp fragment in the same lane?","options":[{"t":"“Both carry the same charge per base pair, so the pull per base pair is equal. The longer fragment is held back more by the gel’s mesh, so it moves more slowly.”","why":"Every base pair carries the same charge, so the push per base pair is the same. Size, not charge, decides how fast a fragment moves.","_n":"518a7","_k":"89bcf25e"},{"t":"“The 200 bp fragment was loaded first.”","why":"Both start at the same moment.","_n":"528b7","_k":"d941ede9"},{"t":"“The 2000 bp fragment has less charge.”","why":"Every base pair carries the same charge, so the push per base pair is the same. Size, not charge, decides how fast a fragment moves.","_n":"53907","_k":"573dd811"},{"t":"“The 2000 bp fragment is pulled toward the negative electrode.”","why":"The phosphate backbone is negative, so DNA moves toward \u003cstrong>+\u003c/strong>. Wells go at the negative end.","_n":"54917","_k":"c49fa4d3"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"A scene sample matches Person 2’s banding pattern at all five markers tested. Which statement is best?","options":[{"t":"“This means nothing, since other people share some bands.”","why":"A match at every marker is strong evidence.","_n":"558e7","_k":"13c97281"},{"t":"“This shows Person 2 is related to the victim.”","why":"The comparison is with the scene sample, not the victim.","_n":"568f7","_k":"cc5c9629"},{"t":"“Person 2 can’t be excluded as the source. How strong this evidence is depends on how rare the pattern is in the population; it doesn’t prove guilt by itself.”","why":"A full match means the person can’t be excluded; its strength depends on how rare the pattern is. One clear mismatch excludes them.","_n":"57947","_k":"5ca39fee"},{"t":"“This proves Person 2 committed the crime.”","why":"A full match means the person can’t be excluded; its strength depends on how rare the pattern is. One clear mismatch excludes them.","_n":"58957","_k":"3a34312b"}]},"b":{"prompt":"A scene sample differs from Person 4’s pattern at 2 of 5 markers, on a gel whose ladder and controls ran properly. Which statement is best?","options":[{"t":"“Person 4 is the source, and the gel is wrong.”","why":"The controls show the gel ran properly.","_n":"59127","_k":"8ca7ffbd"},{"t":"“No conclusion is possible without a full match.”","why":"A clear mismatch is a conclusion: exclusion.","_n":"5a117","_k":"aac01bea"},{"t":"“Person 4 is excluded as the source of the scene sample.”","why":"One clear mismatch excludes; here there are two.","_n":"5b147","_k":"0ffb1223"},{"t":"“Person 4 matches 3 of 5, so is probably the source.”","why":"A full match means the person can’t be excluded; its strength depends on how rare the pattern is. One clear mismatch excludes them.","_n":"5c137","_k":"8954261e"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A lab expects a 450 bp PCR product. The ladder is normal, the sample shows a band near 450 bp, and the no-template control also shows a band near 450 bp. What should the lab conclude?","options":[{"t":"The control proves the PCR worked","why":"That’s the positive control’s job; this control should be empty.","_n":"5d0e7","_k":"07610760"},{"t":"The ladder must be wrong","why":"The ladder is normal.","_n":"5e0d7","_k":"959bf7b8"},{"t":"The product is confirmed, because the sample band is the right size","why":"The no-template control has no DNA to copy. A band there means something was contaminated, so the sample’s band can’t be trusted.","_n":"5f107","_k":"049c94a8"},{"t":"Something was contaminated, so the sample’s result can’t be trusted and the test must be repeated","why":"The no-template control has no DNA to copy. A band there means something was contaminated, so the sample’s band can’t be trusted.","_n":"5g0f7","_k":"fba2b65b"}]},"b":{"prompt":"A lab expects a 300 bp product. The ladder is normal and the positive control shows a 300 bp band, but the sample lane is empty. What is the best conclusion?","options":[{"t":"The sample’s product ran off the gel","why":"A 300 bp band would sit beside the control’s band.","_n":"5h1a7","_k":"20f152ef"},{"t":"The PCR failed for every tube","why":"The positive control worked.","_n":"5i197","_k":"26602eca"},{"t":"The gel ran backward","why":"The ladder and control bands show it ran correctly.","_n":"5j9de","_k":"07df790e"},{"t":"The gel and the PCR worked, so the problem is the sample: its target wasn’t present or wasn’t copied","why":"The ladder and the positive control rule out the gel and the PCR.","_n":"5k9ce","_k":"7b0c5ca3"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A researcher needs to tell apart fragments of 150 and 200 bp. Which set-up is best?","options":[{"t":"A 2.0% gel with a 100 bp ladder","why":"A high percentage spreads small fragments, and the ladder has bands at 100 and 200 bp.","_n":"5l9fe","_k":"52474c01"},{"t":"A 0.8% gel with a 1 kb ladder","why":"Low percentage and a ladder with no bands this small.","_n":"5m9ee","_k":"379c5cd4"},{"t":"A 2.0% gel with a 1 kb ladder","why":"The gel is right, but the ladder has no bands near 150–200 bp.","_n":"5na1e","_k":"8e5a597b"},{"t":"A 0.8% gel with a 100 bp ladder","why":"A low-percentage gel spreads small fragments too little.","_n":"5oa0e","_k":"68f0f1cf"}]},"b":{"prompt":"A researcher needs to tell apart fragments of 6000 and 8000 bp. Which set-up is best?","options":[{"t":"A 0.8% gel with a 100 bp ladder","why":"The gel is right, but the ladder has no bands near 6000–8000 bp.","_n":"5pa3e","_k":"1057b70b"},{"t":"A 0.8% gel with a 1 kb ladder","why":"A low percentage lets large fragments move, and the ladder has bands at 6000 and 8000 bp.","_n":"5qa2e","_k":"0857188c"},{"t":"A 2.0% gel with a 1 kb ladder","why":"A higher percentage means smaller pores: everything moves more slowly, but small fragments spread farther apart.","_n":"5ra5e","_k":"b4423dfb"},{"t":"A 2.0% gel with a 100 bp ladder","why":"Fragments this large barely move in 2.0%, and the ladder stops at 1000.","_n":"5sa4e","_k":"54cf8507"}]}}]},"task":{"title":"Plan the run","summary":"Plan the run","statement":"\u003cp>Your PCR should give a 250 bp product, and a common side product is 300 bp. Plan a gel that will show which one you made. Can you find all the plans that work?\u003c/p>\u003col class=\"ge-tlist\">\u003cli>The DNA enters the gel.\u003c/li>\u003cli>The ladder can size these bands.\u003c/li>\u003cli>The 250 and 300 bp bands end up at least 2.0 mm apart.\u003c/li>\u003cli>Small DNA stays on the gel: a 100 bp fragment is still on the 60 mm gel.\u003c/li>\u003c/ol>\u003cp class=\"muted\">Voltage is fixed at 100 V.\u003c/p>","checks":["DNA enters the gel","Ladder can size these bands","250 and 300 bp at least 2.0 mm apart","100 bp fragment still on the gel"],"tips":["DNA is negative. Put the wells where it will move \u003cstrong>into\u003c/strong> the gel.","The 1 kb ladder’s smallest band is 1000 bp, far from 250 and 300.","Close sizes need a higher percentage or a longer run.","Long runs on low-percentage gels push small DNA off the end."],"wells":[["neg","Negative end"],["pos","Positive end"]],"ladders":[["l100","100 bp ladder"],["l1k","1 kb ladder"]],"gels":["0.8","1.0","1.5","2.0"],"times":[20,40,60,80,100],"explainPrompt":"Explain how you chose the gel percentage and run time, and why the ladder and the wells’ position matter.","vocab":"Use the words negative charge, positive electrode, ladder, agarose percentage and fragment size.","after3":"A higher percentage spreads small fragments faster and slows everything down. That’s why 2.0% still works at 100 min, while 1.0% only works at exactly 80 min, the one time when the bands are far enough apart and the 100 bp band hasn’t run off.","afterAt":6},"cards":[["Gel electrophoresis","Separating DNA fragments by size by pulling them through a gel with an electric field."],["Which way does DNA move?","Toward the \u003cstrong>positive\u003c/strong> electrode. Its phosphate backbone is negative."],["Where do the wells go?","At the negative end, so DNA moves into the gel."],["Size and distance","Smaller fragments travel farther; larger ones stay nearer the wells."],["Why size, not charge?","Every base pair carries the same charge, so the gel’s mesh decides the speed."],["Ladder","Fragments of known sizes run on the same gel; used to read the sizes of unknown bands."],["Agarose percentage","Higher % = smaller pores: slower, and better for small fragments. Lower % for large fragments."],["Voltage and time","More voltage or more time: every band travels farther, and gaps grow. Stop before small bands run off."],["Standard curve","Ladder sizes (log scale) vs distance: read an unknown’s size from its distance."],["No-template control","All PCR ingredients but no DNA template. It should show no band; a band means contamination."],["DNA profile match","Can’t exclude the person; strength depends on how rare the pattern is. One clear mismatch excludes."],["Parentage rule","Every band in a child must come from one parent or the other."]]}};</script>
