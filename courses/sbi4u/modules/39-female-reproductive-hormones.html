.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 39: 28-day timeline (S11) + feedback view (S8), Part 3 stations, task preview, hero.
   Roles: FSH --bio-nadh, LH --bio-e, estrogen --bio-h, progesterone --bio-carbon, hCG --bio-fadh; lining --ink-2; synthetic doses --ink dashed.
   Module token: --fr-sheet2 (alternate strip fill). */
:root{--fr-sheet2:color-mix(in srgb,var(--ink-2) 8%,var(--sheet))}

/* hero */
.fr-c{font-weight:700}
.fr-c-fsh{color:var(--bio-nadh)}.fr-c-lh{color:var(--bio-e)}.fr-c-est{color:var(--bio-h)}.fr-c-prog{color:var(--bio-carbon)}
.fr-hero{width:100%;aspect-ratio:560 / 330}
.fr-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 19 / 17 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .8em;font-size:.9rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{color:var(--ink-2);opacity:.6}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;min-width:44px;min-height:40px;padding:.2em .8em;font-weight:700;font-variant-numeric:tabular-nums}
.rg.chips button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* stepper (from SBI4U 19) */
.fr-stp{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.fr-stb{min-width:40px;min-height:40px;border:0;background:var(--sheet);color:var(--ink);font-size:1.2rem;font-weight:700;padding:0}
.fr-stb:disabled{opacity:.4}
.fr-stp output{min-width:4.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:0 .4em;line-height:40px}

/* explore layout */
.fr-pg [hidden]{display:none!important}
.fr-pg .pg-ctrl{display:grid;gap:12px;align-content:start}
.fr-stage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.fr-stage svg{display:block;width:100%;height:auto}
.fr-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0;color:var(--ink-2)}
.fr-lg{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fr-lg svg{flex:none}
.fr-dayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.fr-dl{font-weight:700;white-space:nowrap}
.fr-dl output{font-variant-numeric:tabular-nums}
.fr-range{flex:1 1 180px;min-width:0;min-height:32px;accent-color:var(--ink)}
.fr-cap{min-height:1.4em;font-size:.92rem;margin:4px 0}
.fr-mhelp{margin:-4px 0 0}
.fr-sw{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--sheet)}
.fr-sw summary{font-weight:700;cursor:pointer;min-height:28px}
.fr-swb{display:grid;gap:10px;margin-top:8px}
.fr-swr{display:grid;gap:6px}
.fr-chk{display:flex;align-items:center;gap:8px;font-weight:600;min-height:32px}
.fr-chk input{width:20px;height:20px;accent-color:var(--ink)}
.fr-pillf{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px;display:grid;gap:8px}
.fr-pillf legend{font-weight:700;padding:0 4px}
.fr-fbv{margin-top:10px}
.fr-h4{font-weight:700;margin:0 0 4px}
.fr-fbv svg{display:block;width:100%;max-width:420px;height:auto}
.fr-tbl{margin-top:10px}
.fr-tbl summary{font-weight:700;cursor:pointer;min-height:28px}
.fr-tbl .tbl-wrap{max-height:320px;overflow:auto}
.fr-note{margin-top:10px;color:var(--ink-2)}

/* timeline graph (SVG) */
.fr-line{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.fr-l-fsh{stroke:var(--bio-nadh)}
.fr-l-lh{stroke:var(--bio-e);stroke-width:3}
.fr-l-est{stroke:var(--bio-h);stroke-dasharray:8 4}
.fr-l-prog{stroke:var(--bio-carbon);stroke-dasharray:1.5 4.5;stroke-width:3.2}
.fr-l-hcg{stroke:var(--bio-fadh);stroke-dasharray:10 3 2 3}
.fr-dot{stroke:var(--sheet);stroke-width:1.2}
.fr-d-fsh{fill:var(--bio-nadh)}.fr-d-lh{fill:var(--bio-e)}.fr-d-est{fill:var(--bio-h)}.fr-d-prog{fill:var(--bio-carbon)}.fr-d-hcg{fill:var(--bio-fadh)}
.fr-syn{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.fr-synp{stroke-dasharray:2 3}
.fr-synt{font:italic 400 10.5px var(--font-ui);fill:var(--ink)}
.fr-grid{stroke:var(--plot-grid);stroke-width:1}
.fr-axl{stroke:var(--plot-axis);stroke-width:1.2}
.fr-ax{font:400 11px var(--font-ui);fill:var(--ink-2)}
.fr-axh{fill:var(--bio-fadh)}
.fr-mark{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3}
.fr-flagl{stroke:var(--ink-2);stroke-width:1}
.fr-fl{font:700 10.5px var(--font-ui);fill:var(--ink)}
.fr-seg0{fill:var(--sheet);stroke:var(--rule)}
.fr-seg1{fill:var(--fr-sheet2);stroke:var(--rule)}
.fr-pl{font:700 10px var(--font-ui);fill:var(--ink-2)}
.fr-rl{font:700 10px var(--font-ui);fill:var(--ink-2)}
.fr-div{stroke:var(--rule);stroke-width:1.2}
.fr-endo{fill:var(--ink-2);fill-opacity:.5;stroke:var(--ink-2);stroke-width:1}
.fr-drop{fill:var(--ink)}
.fr-hide{fill:var(--fr-sheet2);stroke:var(--rule);stroke-dasharray:4 4}
.fr-q{font:700 28px var(--font-ui);fill:var(--ink-2)}
.fr-ov{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.fr-fol{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.fr-open{fill:none}
.fr-egg{fill:var(--ink)}
.fr-clb{fill:var(--ink-2)}
.fr-dash{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:2 2}
.fr-x{stroke:var(--ink);stroke-width:1.6}
.fr-x2{stroke:var(--red);stroke-width:2.4}
.fr-wk{stroke:var(--rule);stroke-width:1.2;stroke-dasharray:3 3}
.fr-wkt{font:700 10.5px var(--font-ui);fill:var(--ink-2)}

/* feedback view (SVG) */
.fr-box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
.fr-boxd{stroke-dasharray:5 3}
.fr-bt{font:700 11.5px var(--font-ui);fill:var(--ink)}
.fr-bs{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.fr-arr{stroke:var(--ink);stroke-width:1.6;fill:none}
.fr-dsh{stroke-dasharray:4 3}
.fr-ah{fill:var(--ink)}
.fr-loop{stroke-width:2}
.fr-pos{stroke:var(--hi);stroke-width:2.6}
.fr-al{font:400 10.5px var(--font-ui);fill:var(--ink)}
.fr-alb{font:700 10.5px var(--font-ui);fill:var(--ink)}
.fr-sg{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.fr-sgp{fill:var(--hi-soft);stroke:var(--hi)}
.fr-sgt{font:700 17px var(--font-ui);fill:var(--ink)}

/* Part 3 */
.fr-p3{display:grid;gap:18px}
.fr-st h3{margin:0 0 8px}
.fr-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.fr-fig{margin:0}
.fr-fig figcaption{font-weight:700;font-size:.92rem;margin-bottom:4px}
.fr-tapw{position:relative;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.fr-tapw svg{display:block;width:100%;height:auto}
.fr-zones{position:absolute;inset:0}
.fr-zone{position:absolute;min-width:24px;min-height:24px;background:transparent;border:1.5px dashed var(--rule);border-radius:6px;color:var(--ink);font-weight:700;padding:0}
.fr-zone:hover,.fr-zone:focus-visible{background:var(--hi-soft)}
.fr-zone.on{background:var(--hi-soft);border:2px solid var(--hi)}
.fr-zone.miss{border:2px solid var(--red)}
.fr-ivs{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px;margin:8px 0;max-width:520px}
.fr-ivs svg{display:block;width:100%;height:auto}
.fr-ivstep{min-height:2.8em}
.fr-risk{border-left:4px solid var(--ink-2);padding:4px 10px;background:var(--fr-sheet2)}
.fr-mt{border-collapse:collapse;font-size:.92rem}
.fr-mt th,.fr-mt td{border:1px solid var(--rule);padding:.35em .7em;text-align:center}
.fr-mt tbody th{text-align:left}
.fr-cg{margin:10px 0}
.fr-cgt{font-weight:700;margin:0 0 6px}
.fr-chips .chip{text-align:left;white-space:normal;max-width:100%}
.fr-note2{margin-top:10px}

/* task */
.fr-tlist{margin:.4em 0 .6em 1.2em}
.fr-wkf{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px;margin:0 0 8px;display:grid;gap:6px}
.fr-wkf legend{font-weight:700;padding:0 4px}
.fr-tpv h4{margin:0 0 6px}

@media (max-width:700px){
  .fr-two{grid-template-columns:1fr}
}
@media (max-width:560px){
  .fr-ax{font-size:15px}.fr-fl{font-size:14.5px}.fr-pl{font-size:13.5px}.fr-rl{font-size:12px}.fr-synt{font-size:14px}.fr-wkt{font-size:14px}
  .fr-bt{font-size:13px}.fr-bs,.fr-al,.fr-alb{font-size:12px}
}

"electron-transport-chain","title":"The Electron Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"e1e18a5d","content":{"id":"39-female-reproductive-hormones","kind":"topic","title":"Female reproductive hormones","topic":"Female Reproductive Hormones","readyTopic":"the hormones of the cycle","hero":{"eq":"hypothalamus (GnRH) → pituitary (\u003cspan class=\"fr-c fr-c-fsh\">FSH\u003c/span>, \u003cspan class=\"fr-c fr-c-lh\">LH\u003c/span>) → ovary (\u003cspan class=\"fr-c fr-c-est\">estrogen\u003c/span>, \u003cspan class=\"fr-c fr-c-prog\">progesterone\u003c/span>)","eqLabel":"hypothalamus, GnRH, to pituitary, FSH and LH, to ovary, estrogen and progesterone","eqSize":"sm","headline":"One loop, two kinds of feedback","text":"Across about four weeks, \u003cstrong>FSH\u003c/strong> and \u003cstrong>LH\u003c/strong> from the pituitary grow a follicle, the follicle’s \u003cstrong>estrogen\u003c/strong> builds the uterine lining, and a sudden \u003cstrong>LH surge\u003c/strong> releases an egg. The \u003cstrong>corpus luteum\u003c/strong> left behind makes \u003cstrong>progesterone\u003c/strong>. Whether that progesterone keeps flowing decides what happens next.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later. This module uses a 28-day model cycle. Real cycles vary from person to person and month to month.","fig":{"html":"\u003cdiv class=\"fr-hero\" id=\"fr-hero\" role=\"img\" aria-label=\"A 28-day model cycle. Four hormone curves sit above two strips: the ovary and the uterine lining. A day marker sweeps from day 1 to day 28. Days 1 to 5: the lining is shed and FSH rises. Days 6 to 12: a follicle grows, estrogen climbs and the lining thickens. Day 13: LH surges. Day 14: the egg is released. Days 15 to 24: the corpus luteum makes progesterone and the lining thickens further. Days 25 to 28: the corpus luteum fades, progesterone drops and the lining starts to shed.\">\u003c/div>"}},"goals":["I can name where FSH, LH, estrogen, progesterone and hCG are made and what each does in the cycle.","I can line up the ovarian and uterine phases and explain what drives each change.","I can explain when estrogen’s feedback is negative and when it is positive, and how the LH surge causes ovulation.","I can explain how the corpus luteum, progesterone and hCG decide between menstruation and pregnancy.","I can explain how hormonal contraception, fertility treatment and menopause follow from the feedback loops.","I can use hormone and temperature data to identify cycle events and timing."],"start":{"warmup":{"questions":[{"id":"w1","skill":"GnRH chain","goal":1,"prompt":"In module 38, GnRH from the hypothalamus made the anterior pituitary release which two hormones?","options":[{"t":"LH and FSH","why":"The same two hormones act on the ovaries.","_n":"08c4","_k":"2aafd5bd"},{"t":"TSH and TRH","why":"That’s the thyroid chain.","_n":"18b4","_k":"e271d672"},{"t":"ADH and oxytocin","why":"Those are released by the posterior pituitary.","_n":"28a4","_k":"709d3c8a"},{"t":"Testosterone and inhibin","why":"Those come from the testes.","_n":"3894","_k":"1d185323"}],"hints":["Both names end in H for ‘hormone’.","Luteinizing and follicle-stimulating.","LH and FSH."]},{"id":"w2","skill":"GnRH chain","goal":1,"prompt":"If a gland at the end of a chain stops making its hormone, what usually happens to the pituitary hormones above it?","options":[{"t":"They rise, because the negative feedback brake is gone","why":"Low end-hormone means no brake.","_n":"4884","_k":"4989fb8a"},{"t":"They stay the same","why":"Feedback responds to the change.","_n":"5874","_k":"0e0e087b"},{"t":"They fall, because the chain is broken","why":"The pituitary still works; it just isn’t braked.","_n":"6864","_k":"69ac02b1"},{"t":"They turn into the missing hormone","why":"Hormones don’t convert into each other like that.","_n":"7954","_k":"a373a074"}],"hints":["What does the end hormone normally do to the pituitary?","It brakes it.","Brake removed: the levels rise."]},{"id":"w3","skill":"Positive and negative feedback","goal":3,"prompt":"During childbirth, contractions cause more oxytocin, which causes stronger contractions. This is…","options":[{"t":"positive feedback","why":"The response amplifies the change.","_n":"8944","_k":"3ade718d"},{"t":"negative feedback","why":"Negative feedback would reduce the contractions.","_n":"9908","_k":"674f41a7"},{"t":"homeostasis","why":"Positive feedback moves the body away from its normal state, toward an endpoint.","_n":"a918","_k":"0cf7a40e"},{"t":"a set point","why":"A set point is a target value, not a type of loop.","_n":"b8e8","_k":"e9fadef2"}],"hints":["Does the response grow or shrink the change?","Contractions get stronger.","Positive."]},{"id":"w4","skill":"Positive and negative feedback","goal":3,"prompt":"Which statement about positive feedback is true?","options":[{"t":"It drives a quick, large change that ends with an event","why":"Like birth, or the LH surge you’ll meet today.","_n":"c8f8","_k":"7617c95b"},{"t":"It never happens in healthy bodies","why":"Birth and clotting are healthy examples.","_n":"d948","_k":"62619f42"},{"t":"It always lasts for months","why":"Positive loops are short bursts.","_n":"e958","_k":"95d70cfe"},{"t":"It keeps a variable steady near a set point","why":"That’s negative feedback.","_n":"f928","_k":"7379bb22"}],"hints":["Think of a snowball rolling downhill.","It builds quickly to a finish.","A quick, large change ending in an event."]},{"id":"w5","skill":"Reading multi-line graphs","goal":6,"prompt":"On a graph with four hormone curves sharing one time axis, how do you find each hormone’s level on day 10?","options":[{"t":"Add all four values together","why":"The hormones are separate; adding them has no meaning.","_n":"g938","_k":"a7d0cac6"},{"t":"Find where each curve peaks","why":"The peak may not be on day 10.","_n":"h988","_k":"3467592a"},{"t":"Read the highest curve only","why":"Every curve has its own value on that day.","_n":"i998","_k":"306eb34e"},{"t":"Draw a vertical line at day 10 and read where it crosses each curve","why":"One day, four readings.","_n":"j2a7","_k":"361dc896"}],"hints":["Same day for every curve.","A vertical line.","Read each crossing."]},{"id":"w6","skill":"Reading multi-line graphs","goal":6,"prompt":"A curve rises steeply to a sharp peak on one day and falls the next. Which word fits?","options":[{"t":"A plateau","why":"A plateau is flat.","_n":"k297","_k":"636765fc"},{"t":"A surge","why":"A sudden, brief, large rise.","_n":"l287","_k":"76e9937d"},{"t":"A decline","why":"A decline goes down.","_n":"m277","_k":"646439e4"},{"t":"A baseline","why":"The baseline is the low resting level.","_n":"n267","_k":"ee5b20ee"}],"hints":["Sudden and brief.","It shoots up, then down.","Surge."]}],"refreshers":{"GnRH chain":"Hypothalamus (GnRH) → anterior pituitary (FSH, LH) → gonad (ovary or testis) → end hormones, which feed back to the top.","Positive and negative feedback":"Negative feedback opposes a change and keeps things steady; positive feedback amplifies a change until an event ends it.","Reading multi-line graphs":"Pick the time, draw a vertical line, read each curve. Look for surges (sharp peaks) and crossovers (one hormone taking over from another)."}}},"explore":{"heading":"28-day cycle timeline","intro":"Scrub through the model cycle. Watch what each hormone does, then change the feedback and see what breaks.","modes":[["normal","Normal cycle"],["preg","Pregnancy"],["switch","Feedback switches"],["pill","Pill"]],"modeHelp":{"normal":"Normal cycle: the 28-day model cycle. Drag the day slider or press Play.","preg":"Pregnancy: fertilization on day 15 and implantation on day 21. The scrubber runs to day 40.","switch":"Feedback switches: turn estrogen’s positive feedback off, remove the corpus luteum, or give an LH pulse.","pill":"Pill: synthetic estrogen and progestin taken days 1–21, then placebo days 22–28."},"model":{"days":[1,3,5,7,10,12,13,14,15,17,21,24,26,28],"fsh":[30,38,40,35,25,22,45,40,20,15,12,15,22,30],"lh":[15,15,15,15,18,30,95,80,25,15,12,12,13,15],"est":[10,12,15,30,55,80,70,40,30,40,55,45,25,12],"prog":[2,2,2,2,2,3,4,6,15,40,70,55,25,5],"endo":[4,3,2,5,8,9,10,10,10,11,13,12,9,5],"hcg":[[21,2],[24,10],[26,25],[28,60],[35,200],[40,300]],"testAt":25},"hormones":[["fsh","FSH"],["lh","LH"],["est","Estrogen"],["prog","Progesterone"],["hcg","hCG"]],"status":{"dev":"Several follicles developing","dom":"One dominant follicle","mat":"Mature follicle","matS":"Mature follicle: LH surge","ovu":"Ovulation","cl":"Corpus luteum","clh":"Corpus luteum, kept going by hCG","brk":"Corpus luteum breaking down","wait":"Mature follicle, waiting for a surge","deg":"Follicle degenerating: no ovulation","rem":"Corpus luteum removed","small":"Follicles stay small: FSH is too low","next":"Several follicles developing (next cycle)"},"feedback":{"neg":"Estrogen and progesterone are low or moderate: \u003cstrong>negative\u003c/strong> feedback keeps FSH and LH modest.","flip":"Estrogen is at its peak and has stayed high: the feedback is flipping to \u003cstrong>positive\u003c/strong>, and LH starts to climb.","pos":"Estrogen has been high for two days: \u003cstrong>positive\u003c/strong> feedback on the pituitary, so LH surges.","ovu":"The LH surge peaked yesterday: the egg is released, and the empty follicle becomes the corpus luteum.","ovuP":"The LH pulse yesterday did the surge’s job: the egg is released, and the empty follicle becomes the corpus luteum.","pulseOk":" The follicle is mature, so ovulation follows tomorrow.","pulseEarly":" The follicle isn’t mature yet (before day 12), so nothing happens.","pulseLate":" The follicle has started to degenerate (after day 15), so nothing happens.","lut":"Progesterone and estrogen from the corpus luteum: \u003cstrong>negative\u003c/strong> feedback keeps FSH and LH low.","brk":"The corpus luteum is breaking down: progesterone and estrogen fall, the brake eases, and FSH starts to rise for the next cycle.","off":"Estrogen’s positive feedback is switched off: estrogen only brakes the pituitary (\u003cstrong>negative\u003c/strong>), so there’s no natural LH surge.","pulse":"An LH pulse is given today, like a fertility ‘trigger’ shot.","rem":"The corpus luteum is gone: progesterone falls, the brake comes off, and FSH starts to rise.","preg":"hCG from the implanted embryo keeps the corpus luteum making progesterone; progesterone and estrogen keep FSH and LH low (\u003cstrong>negative\u003c/strong> feedback).","pill":"Steady synthetic estrogen and progestin brake the pituitary (\u003cstrong>negative\u003c/strong> feedback): FSH stays low and there’s no LH surge.","pillE":"Synthetic estrogen keeps FSH below 15 (\u003cstrong>negative\u003c/strong> feedback), so no follicle matures and nothing sets off a surge.","pillFail":"The doses are too low: FSH is still 15 or more and there’s no progestin, so a follicle matures and the surge happens.","placebo":"Placebo week: the synthetic hormones are withdrawn, so the lining is shed (withdrawal bleed) and FSH starts to rise.","none":"No active doses: this is the natural cycle."},"switches":{"title":"Feedback switches","pf":"Estrogen’s positive feedback","r":"Remove the corpus luteum","rDay":"on day \u003ci>R\u003c/i>","d":"Give an LH pulse","dDay":"on day \u003ci>D\u003c/i>"},"pill":{"title":"Pill doses (days 1–21)","e":"Synthetic estrogen \u003ci>E\u003c/i>","p":"Progestin \u003ci>P\u003c/i>","note":"Model dose levels, not real medicine amounts."},"modelNote":"\u003cstrong>Model values\u003c/strong> in arbitrary units (AU); the endometrium (uterine lining) in mm. Values are joined by straight lines between the listed days, and every rule is fixed, so the same settings always give the same curves. This is a 28-day model cycle: real cycles vary from person to person and month to month.","aha":"The same hormone (estrogen) can brake or trigger the pituitary depending on its level and timing, and the end of the cycle is caused by a hormone \u003cstrong>falling\u003c/strong>.","predIntro":"Make a prediction first. The days ahead stay hidden until the timeline plays.","predictions":[{"id":"p1","start":{"mode":"normal","day":11},"to":13,"prompt":"\u003cspan class=\"muted\">Normal cycle, day 11.\u003c/span> Estrogen is high and still rising. What will LH do over the next two days?","options":[{"t":"Stay flat","_n":"o257","_k":"918bfe3c"},{"t":"Surge sharply","_n":"p247","_k":"e79ebacd"},{"t":"Fall, because estrogen brakes the pituitary","_n":"q237","_k":"3ee4f0a4"},{"t":"Fall to zero","_n":"r227","_k":"f7846bc6"}],"reveal":"LH jumps from 30 to 95 on day 13.","explain":"High, sustained estrogen flips the pituitary’s response to positive feedback."},{"id":"p2","start":{"mode":"switch","day":17},"set":{"rOn":true,"R":17},"to":28,"prompt":"\u003cspan class=\"muted\">Feedback switches, day 17.\u003c/span> The corpus luteum is removed on day 17. What happens next?","options":[{"t":"FSH falls","_n":"s217","_k":"6e871dfc"},{"t":"Nothing until day 28","_n":"t247","_k":"9f98e786"},{"t":"A second ovulation on day 18","_n":"u257","_k":"6e309b12"},{"t":"Progesterone falls and menstruation starts early, on day 21","_n":"v267","_k":"d57f8d19"}],"reveal":"The progesterone curve (brown) drops; the lining sheds from day 21.","explain":"The lining depends on progesterone. Remove its source, and it’s shed about four days later."},{"id":"p3","start":{"mode":"preg","day":21},"to":28,"prompt":"\u003cspan class=\"muted\">Pregnancy, day 21: implantation.\u003c/span> Play to day 28. What happens to progesterone?","options":[{"t":"It falls as usual","_n":"w277","_k":"ca6e038a"},{"t":"It stays high","_n":"x207","_k":"a2a6ba51"},{"t":"It falls to zero","_n":"y217","_k":"9ecf9c52"},{"t":"It surges like LH","_n":"z227","_k":"2a313e3e"}],"reveal":"hCG rises, the corpus luteum stays, and progesterone holds at 70.","explain":"hCG from the implanted embryo keeps the corpus luteum working."},{"id":"p4","start":{"mode":"pill","day":1,"E":2,"P":2},"to":21,"prompt":"\u003cspan class=\"muted\">Pill mode, \u003ci>E\u003c/i> = 2, \u003ci>P\u003c/i> = 2.\u003c/span> Play days 1–21. Does ovulation happen?","options":[{"t":"Yes, twice","_n":"10237","_k":"d9015df4"},{"t":"Yes, on day 14","_n":"111c7","_k":"cb102e14"},{"t":"No","_n":"121d7","_k":"e2dc4083"},{"t":"Only in the placebo week","_n":"131e7","_k":"319eef1c"}],"reveal":"FSH stays at 10, LH stays flat, and no follicle matures.","explain":"Steady estrogen and progestin keep the brakes on: FSH is too low to grow a follicle, and there’s no surge."}],"chalIntro":"Use the timeline to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Normal cycle: scrub to the day when the LH surge peaks.","why":"Day 13: LH peaks at 95 AU, the day after estrogen’s peak.","wrong":{"mode":"Switch the mode to \u003cstrong>Normal cycle\u003c/strong> first.","d14":"That’s ovulation; LH is already falling (80).","d12":"That’s estrogen’s peak; the surge starts next."},"hints":["Find the violet curve’s highest point.","It comes just after estrogen’s peak.","Day 13."]},{"id":"tc2","goal":4,"prompt":"Feedback switches: make menstruation start on day 21 instead of day 1 of the next cycle.","why":"Removing the corpus luteum on day 17 drops progesterone, and the lining is shed 4 days later, on day 21.","wrong":{"mode":"Switch the mode to \u003cstrong>Feedback switches\u003c/strong> first.","off":"Turn on \u003cstrong>Remove the corpus luteum\u003c/strong> and choose a day.","r21":"Menstruation starts 4 days after removal: that gives day 25.","late":"The corpus luteum is already breaking down.","nocl":"There’s no corpus luteum to remove on that day: it forms after ovulation."},"hints":["What does the lining need to stay?","Progesterone from the corpus luteum.","Menstruation comes 4 days after removal: 21 − 4 = 17."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Feedback switches: turn estrogen’s positive feedback off. Then use one LH pulse to make ovulation happen on day 14.","why":"A pulse on day 13 gives ovulation on day 14. This is how a fertility ‘trigger’ shot is timed.","wrong":{"mode":"Switch the mode to \u003cstrong>Feedback switches\u003c/strong> first.","pf":"The natural surge would do the job. Turn it off first.","off":"Turn on \u003cstrong>Give an LH pulse\u003c/strong> and choose a day.","d14":"Ovulation follows the pulse by a day: that gives day 15.","early":"The follicle isn’t mature until day 12: no ovulation.","late":"After day 15 the follicle has started to degenerate: no ovulation."},"hints":["What does the natural surge do, and when?","Ovulation comes one day after the LH peak, and the follicle must be mature (days 12–15).","A pulse on day 13 gives ovulation on day 14. This is how a fertility ‘trigger’ shot is timed."]}]},"part3":{"slug":"medicine","name":"Medicine","heading":"Hormones as medicine","intro":"\u003cspan class=\"tag\">STSE\u003c/span> Each treatment below is a deliberate change to the feedback loop you just explored. Check the pill against data, step through fertility treatment, then build an argument from evidence about menopause.","pill":{"title":"Station 1: the pill","panel":"Check it with data","how":"Two model cycles of the pituitary hormones, FSH and LH: a natural cycle and a pill cycle (\u003ci>E\u003c/i> = 2, \u003ci>P\u003c/i> = 2). Tap the \u003cstrong>two\u003c/strong> places on the graphs where the two cycles differ most.","text":"In the pill cycle, FSH stays near 10, LH never surges, and the lining stays thin; in the placebo week the hormones fall and a withdrawal bleed occurs. Estrogen mainly keeps FSH low, so no follicle matures; progestin mainly prevents the LH surge and thickens cervical mucus.","zones":[{"a":1,"b":2,"fb":"FSH is a little higher in the natural cycle here, but look for a bigger gap.","_n":"141d7","_k":"07d34556"},{"a":3,"b":7,"fb":"Natural FSH rises to about 40 AU to grow follicles; on the pill it stays at 10.","_n":"15207","_k":"e2dbc23d"},{"a":8,"b":11,"fb":"The gap is smaller here: natural FSH is already falling.","_n":"161f7","_k":"afd796b2"},{"a":12,"b":14,"fb":"The natural cycle’s LH surge (95 AU on day 13) is missing from the pill cycle.","_n":"17227","_k":"6b6647bd"},{"a":15,"b":21,"fb":"In the luteal phase the natural cycle’s FSH and LH are braked too, so the two cycles look alike.","_n":"18217","_k":"62ccf5a2"},{"a":22,"b":28,"fb":"Placebo week: the pill cycle’s FSH starts to rise, so the cycles come closer.","_n":"19247","_k":"615ec7e2"}],"done":"Both found: the pill removes the FSH rise that grows follicles and the LH surge that releases an egg."},"ivf":{"title":"Station 2: fertility treatment (IVF)","levelLabel":"FSH injection level","levels":[["none","none (natural)",1],["low","low",4],["medium","medium",8],["high","high",12]],"head":["FSH injection level","Mature follicles (model)"],"steps":["FSH injections grow several follicles at once.","A medicine that blocks GnRH’s action prevents an early, natural LH surge.","An hCG ‘trigger’ injection (hCG acts on LH receptors) completes egg maturation and times the eggs’ release, so they can be collected about a day and a half later.","After an embryo is placed in the uterus, progesterone keeps the lining ready."],"risk":"Too many follicles can over-stimulate the ovaries, which is why doses are adjusted."},"cer":{"title":"Station 3: menopause and hormone therapy","panel":"Claim–evidence–reasoning","intro":"Choose one claim, the evidence that supports it, and the reasoning that links them. Then press Check. There are two valid arguments to find.","head":["","Age 30 (cycle average)","Age 55"],"rows":[["Estrogen","40","8"],["FSH","30","90"],["LH","25","60"]],"claims":[{"id":"c1","t":"FSH is high because the ovaries are overactive","fb":"FSH is high because low estrogen releases the brake: the pituitary is calling and the ovaries can’t answer."},{"id":"c2","t":"FSH is high because low estrogen no longer brakes the pituitary"},{"id":"c3","t":"Hormone therapy is right for everyone","fb":"The evidence shows benefits and risks that differ from person to person, so no therapy is right for everyone."},{"id":"c4","t":"Hormone therapy has benefits and risks that depend on the person"}],"evidence":[{"id":"e1","t":"Estrogen: 40 AU at age 30, 8 AU at age 55"},{"id":"e2","t":"FSH: 30 AU at age 30, 90 AU at age 55"},{"id":"e3","t":"LH: 25 AU at age 30, 60 AU at age 55"},{"id":"e4","t":"Estrogen therapy can reduce hot flashes and slow bone loss"},{"id":"e5","t":"Some studies link certain therapies to higher risks of blood clots and some cancers, depending on type, dose, age and duration"}],"reasons":[{"id":"r1","t":"Low estrogen no longer brakes the pituitary, so FSH and LH rise (the brake is removed)."},{"id":"r2","t":"Decisions weigh each person’s individual benefits and risks."},{"id":"r3","t":"High estrogen triggers an LH surge (positive feedback)."},{"id":"r4","t":"The ovaries make FSH, so active ovaries raise it."}],"_a":"HhMEEwIaFwcJUAxcGlsXB1cTSRNWBFAARws+E11QF0hHVFcTZU0XBQldCkYaW25GAAJHbBRDRwEEQgpfGlsXFlQTGB0aAxdeHhMGXVkIWEZfEwYFGk0XCgBUARMCOhcBURNJE11UFzlJEwRdVA5CRl9qOB0aE1AFFl4LEwJDR1ZHTBg=","fbA":"Strong argument: estrogen fell from 40 to 8 AU while FSH rose from 30 to 90 AU, because low estrogen no longer brakes the pituitary.","fbB":"Strong argument: therapy can ease hot flashes and slow bone loss, but some therapies carry risks that depend on type, dose, age and duration, so the choice is individual.","evA":"For this claim, choose the estrogen and FSH values from the table (LH may be added), and no health studies.","evB":"For this claim, choose both health evidence chips: one about benefits, one about risks, and no table values.","reason":"That reasoning doesn’t link this evidence to this claim. Which statement explains why?","pick":"Choose one claim, at least one piece of evidence and one reasoning first.","more":"Now build the other valid argument.","done":"Both arguments built.","note":"Medical decisions are made with a health professional."},"quickCheck":{"title":"Quick check","summary":"Hormones as medicine quick check","items":[{"id":"q1","goal":1,"prompt":"Which hormone does a home pregnancy test detect?","choices":[{"t":"hCG","fb":"Right. hCG is made after implantation.","_n":"1a237","_k":"c1b935fe"},{"t":"LH","fb":"Ovulation kits detect LH; pregnancy tests detect hCG.","_n":"1b167","_k":"fc4f95a6"},{"t":"FSH","fb":"Ovulation kits detect LH; pregnancy tests detect hCG.","_n":"1c157","_k":"d919921c"},{"t":"progesterone","fb":"Ovulation kits detect LH; pregnancy tests detect hCG.","_n":"1d987","_k":"32adc1ea"}]},{"id":"q2","goal":5,"prompt":"Why does the combined pill prevent ovulation?","choices":[{"t":"It destroys eggs","fb":"It works through negative feedback on the pituitary.","_n":"1e997","_k":"a11f15fe"},{"t":"It raises LH","fb":"It works through negative feedback on the pituitary.","_n":"1f967","_k":"8fd0645a"},{"t":"It removes the corpus luteum","fb":"It works through negative feedback on the pituitary.","_n":"1g977","_k":"370635e6"},{"t":"Steady hormones keep FSH low and block the LH surge","fb":"Right. It works through negative feedback on the pituitary.","_n":"1h947","_k":"a462eacd"}]},{"id":"q3","goal":5,"prompt":"Why is hCG used as a fertility ‘trigger’?","choices":[{"t":"It acts on LH receptors, like a surge","fb":"Right. hCG mimics the LH surge to finish egg maturation.","_n":"1i957","_k":"5512b3d9"},{"t":"It blocks estrogen","fb":"hCG mimics the LH surge to finish egg maturation.","_n":"1j927","_k":"029044ca"},{"t":"It grows follicles like FSH","fb":"hCG mimics the LH surge to finish egg maturation.","_n":"1k937","_k":"828cc09e"},{"t":"It shrinks the lining","fb":"hCG mimics the LH surge to finish egg maturation.","_n":"1la07","_k":"0aba66f2"}]},{"id":"q4","goal":5,"prompt":"After menopause, FSH is high because…","choices":[{"t":"progesterone is high","fb":"The brake is gone; the pituitary is calling.","_n":"1ma17","_k":"0b5b0436"},{"t":"low estrogen no longer brakes the pituitary","fb":"Right. The brake is gone; the pituitary is calling.","_n":"1n927","_k":"09d3ca41"},{"t":"hCG is present","fb":"The brake is gone; the pituitary is calling.","_n":"1o917","_k":"1e5a1d2c"},{"t":"the ovaries are overactive","fb":"The brake is gone; the pituitary is calling.","_n":"1p907","_k":"bf97a0ae"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Hormone or structure ↔ role","summary":"Hormone or structure ↔ role","goal":[1,4],"instruction":"Match each hormone or structure with its role in the cycle.","leftTitle":"Hormone or structure","rightTitle":"Role","left":[{"id":"l1","t":"GnRH"},{"id":"l2","t":"FSH"},{"id":"l3","t":"LH surge"},{"id":"l4","t":"Estrogen"},{"id":"l5","t":"Progesterone"},{"id":"l6","t":"Corpus luteum","hints":["What’s left in the ovary after the egg is released?","Its name means ‘yellow body’.","Corpus luteum."]},{"id":"l7","t":"hCG"},{"id":"l8","t":"Fall in progesterone"}],"right":[{"id":"r1","t":"From the hypothalamus; drives FSH and LH release"},{"id":"r2","t":"Grows follicles in the early follicular phase"},{"id":"r3","t":"Triggers ovulation about a day later"},{"id":"r4","t":"Made by the growing follicle; thickens the lining (proliferative phase)"},{"id":"r5","t":"Made by the corpus luteum; keeps the lining ready (secretory phase)"},{"id":"r6","t":"What the follicle becomes after ovulation"},{"id":"r7","t":"Made after implantation; keeps the corpus luteum working"},{"id":"r8","t":"Causes the lining to be shed"}],"_a":"HhMJABpbFxZUE0kTVFMXXkdDVxMUQ1lXRwtHQwtDGUYJBUcLGhMBRkkTCQQaWxcWUBNJE1RXF15HQ1MTFENZU0cLR0MPQxlGCQlHCxoTDUYY","wrong":{"l2|r3":"The \u003cstrong>LH\u003c/strong> surge triggers ovulation.","l4|r5":"Estrogen builds the lining; progesterone maintains it.","l8|r3":"A fall in progesterone ends the cycle; it doesn’t start ovulation."},"wrongDefault":"Place it on the timeline: early, middle or late in the cycle?"},{"id":"read","type":"custom","title":"Read the cycle","summary":"Read the cycle","star":true,"goal":[2,3,6],"instruction":"Use the model cycle’s data to answer each item. Items 4 to 8 are non-routine; the last three go beyond the Final Check.","items":[{"id":"r1","kind":"num","goal":6,"prompt":"Snapshot: LH 95, estrogen 70, progesterone 4. Which day of the model cycle?","_a":"VAI=","display":"Day 13","why":"LH peaks at 95 on day 13, the surge.","wrong":[{"match":14,"fb":"Ovulation day; LH has already dropped to 80."}],"general":"Find the day when LH is 95 in Explore."},{"id":"r2","kind":"chips","goal":2,"prompt":"Snapshot: progesterone 70, estrogen 55, LH 12. Which ovarian phase?","chips":[{"t":"Luteal","fb":"Progesterone 70 comes from the corpus luteum, after ovulation.","_n":"1q8f7","_k":"da12a84d"},{"t":"Follicular","fb":"Progesterone only rises after ovulation.","_n":"1r967","_k":"c18adf3e"},{"t":"Ovulation","fb":"On ovulation day LH is still high (80) and progesterone is low.","_n":"1s957","_k":"90117d84"}]},{"id":"r3","kind":"chips","goal":2,"prompt":"Snapshot: FSH 38, estrogen 12, endometrium being shed. Which uterine phase?","chips":[{"t":"Menstrual","fb":"Shedding of the lining is the menstrual phase (days 1–5).","_n":"1t947","_k":"c977d4b1"},{"t":"Secretory","fb":"Shedding is the menstrual phase. Ovary: follicular, ovulation, luteal. Uterus: menstrual, proliferative, secretory.","_n":"1u937","_k":"36495f60"},{"t":"Proliferative","fb":"The proliferative phase builds the lining; here it’s being shed.","_n":"1v9a7","_k":"8ae2b1f1"}]},{"id":"r4","kind":"num","goal":6,"star":true,"prompt":"A person’s cycles are regularly 32 days. Using the model (luteal phase 14 days), on which day is ovulation most likely?","_a":"VAk=","display":"Day 18","why":"32 − 14 = 18.","wrong":[{"match":14,"fb":"The luteal phase is the steady part; the follicular phase changes length. In the model, the luteal phase lasts 14 days, so ovulation ≈ cycle length − 14."}],"general":"Which phase stays 14 days long?","hints":["Which phase stays about 14 days long?","The luteal phase, from ovulation to the end.","32 − 14 = 18."]},{"id":"r5","kind":"num","goal":6,"star":true,"prompt":"Cycles are regularly 26 days. On which day is ovulation most likely?","_a":"VAM=","display":"Day 12","why":"26 − 14 = 12.","wrong":[{"match":14,"fb":"In the model, the luteal phase lasts 14 days, so ovulation ≈ cycle length − 14."}],"general":"In the model, the luteal phase lasts 14 days, so ovulation ≈ cycle length − 14."},{"id":"r6","kind":"chips","goal":6,"star":true,"prompt":"Implantation happened on day 21, but a test on day 22 is negative. Best explanation?","chips":[{"t":"hCG is still below the test’s detection level","fb":"hCG starts low and doubles every couple of days; in the model the test turns positive around day 26.","_n":"1w997","_k":"df02f29f"},{"t":"There is no pregnancy","fb":"hCG starts low and doubles every couple of days; in the model the test turns positive around day 26. Home pregnancy tests detect \u003cstrong>hCG\u003c/strong>; ovulation predictor kits detect LH.","_n":"1x8c7","_k":"01164f36"},{"t":"The test detects progesterone","fb":"Home pregnancy tests detect \u003cstrong>hCG\u003c/strong>; ovulation predictor kits detect LH.","_n":"1y8d7","_k":"87436a4c"},{"t":"hCG is made only after day 40","fb":"hCG starts low and doubles every couple of days; in the model the test turns positive around day 26.","_n":"1z8e7","_k":"6888067a"}]},{"id":"r7","kind":"num","goal":[3,6],"star":true,"prompt":"\u003cspan class=\"tag\">Investigation\u003c/span> A morning temperature chart is steady at 36.4 °C, then rises to about 36.7 °C on day 17 and stays up. Progesterone raises resting temperature. When did ovulation most likely happen?","_a":"PgBQHQlXaA==","display":"Day 16 (day 15 is accepted too)","why":"The rise follows ovulation, once the corpus luteum makes progesterone: about the day before, day 16.","wrong":[{"match":17,"fb":"The rise follows ovulation, once the corpus luteum makes progesterone."},{"match":14,"fb":"That assumes a 28-day cycle; read this chart."}],"general":"What makes the temperature rise, and when does it start?","hints":["What makes the temperature rise?","Progesterone from the corpus luteum, after ovulation.","The day before the rise: about day 16."]},{"id":"r8","kind":"chips","goal":3,"star":true,"prompt":"An ovulation kit detects LH in urine. In the model cycle, on which day should it first turn positive, and why does that warn of ovulation?","chips":[{"t":"Day 13: the LH surge comes about a day before ovulation","fb":"The kit catches the surge, so ovulation is about a day away.","_n":"208f7","_k":"43678de5"},{"t":"Day 14: ovulation day, when LH is highest","fb":"By ovulation day the surge has passed its peak.","_n":"21907","_k":"92f949e6"},{"t":"Day 12: when estrogen peaks","fb":"Estrogen peaks on day 12, but the kit detects LH, which surges on day 13.","_n":"22917","_k":"278ae6c8"},{"t":"Day 21: when progesterone peaks","fb":"The kit detects LH, not progesterone; by day 21 ovulation is long past.","_n":"23927","_k":"706c254a"}]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Yuki","goal":[2,3,4],"how":"","instruction":"Yuki made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Explain why menstruation happens when there’s no pregnancy.","steps":["After ovulation, the follicle becomes the corpus luteum.","The corpus luteum makes progesterone, which maintains the lining.","With no hCG, the corpus luteum breaks down after about 10 days.","Rising progesterone then makes the lining shed.","FSH starts to rise for the next cycle."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.","","Step 5 is correct."],"fixes":[{"t":"Falling progesterone means the lining is no longer maintained, so it is shed.","why":"Menstruation follows a \u003cstrong>fall\u003c/strong> in progesterone when the corpus luteum breaks down.","_n":"24937","_k":"145e9e6b"},{"t":"Rising estrogen then makes the lining shed.","why":"Estrogen is also falling at this point.","_n":"25947","_k":"9bd97c56"},{"t":"Rising LH then makes the lining shed.","why":"LH doesn’t act on the lining.","_n":"26957","_k":"306b1938"},{"t":"Step 4 is correct.","why":"A breaking-down corpus luteum can’t raise progesterone.","_n":"27a69","_k":"cbddf5c8"}],"hints":["What happens to the corpus luteum’s output when it breaks down?","Progesterone falls.","Falling progesterone causes shedding."]},{"id":"e2","goal":2,"task":"Match the phases of the ovary and uterus.","steps":["Days 1–5: the uterus is in its menstrual phase.","Days 6–14: the uterus is in its proliferative phase, as estrogen builds the lining.","Days 15–28: the uterus is in its luteal phase.","During days 15–28, progesterone keeps the lining ready."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"Days 15–28: the uterus is in its proliferative phase.","why":"Proliferative ends at ovulation.","_n":"28a59","_k":"3986bd5c"},{"t":"Step 3 is correct.","why":"Luteal names the ovary’s phase, not the uterus’s.","_n":"29a89","_k":"b298da04"},{"t":"Days 15–28: the uterus is in its follicular phase.","why":"Follicular is an ovarian phase before ovulation.","_n":"2aa79","_k":"c49394e3"},{"t":"Days 15–28: the uterus is in its secretory phase (the ovary is in its luteal phase).","why":"Ovary: follicular, ovulation, luteal. Uterus: menstrual, proliferative, secretory.","_n":"2ba29","_k":"8c6439b6"}],"hints":["Which organ has a ‘luteal’ phase?","The ovary, because of the corpus luteum.","The uterus is secretory."]},{"id":"e3","goal":3,"task":"Explain what triggers ovulation.","steps":["FSH helps a follicle grow.","The growing follicle makes more and more estrogen.","High estrogen always brakes the pituitary, so LH falls.","Ovulation happens about a day after the LH surge."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is right, but it contradicts step 3."],"fixes":[{"t":"High, sustained estrogen switches to positive feedback, so the pituitary releases an LH surge.","why":"High, sustained estrogen flips to \u003cstrong>positive\u003c/strong> feedback on the pituitary: that’s the LH surge.","_n":"2ca19","_k":"c586d1e0"},{"t":"Step 3 is correct.","why":"If LH fell, there would be no surge to trigger ovulation.","_n":"2da49","_k":"ce3c17d5"},{"t":"High progesterone triggers the surge.","why":"Progesterone is low before ovulation.","_n":"2ea39","_k":"7d1f72c3"},{"t":"High estrogen makes FSH surge, which releases the egg.","why":"The \u003cstrong>LH\u003c/strong> surge triggers ovulation; estrogen is what sets it off.","_n":"2f9e9","_k":"d5575aaa"}],"hints":["Can estrogen’s feedback ever be positive?","Yes, when it’s high for a couple of days.","Positive feedback → LH surge."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: that estrogen’s feedback can flip, or that the cycle ends because a hormone falls?"},{"id":"j2","q":"In your own words, why does hCG decide between menstruation and pregnancy?"},{"id":"j3","q":"Explain to a friend how the combined pill uses the body’s own feedback to prevent ovulation."},{"id":"j4","q":"Which phase names or hormone roles do you still mix up? What will you do about it?"}]},"final":{"intro":"Ten questions: 3 Knowledge, 3 Thinking, 2 Communication, 2 Application. No hints; choose your confidence for each. The 28-day model cycle applies unless a question says otherwise.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which structure makes most of the progesterone after ovulation?","options":[{"t":"The growing follicle before ovulation","why":"Before ovulation the follicle mainly makes estrogen.","_n":"2g9d9","_k":"1c3d2b16"},{"t":"The corpus luteum","why":"The empty follicle becomes the corpus luteum, which makes progesterone.","_n":"2ha09","_k":"f20e4d12"},{"t":"The anterior pituitary","why":"The pituitary makes FSH and LH.","_n":"2ia19","_k":"20c4b169"},{"t":"The endometrium","why":"The lining responds to progesterone; it doesn’t make it.","_n":"2j9e9","_k":"d68e890e"}]},"b":{"prompt":"Which hormone’s surge triggers ovulation?","options":[{"t":"Estrogen","why":"Estrogen sets off the surge; it isn’t the surge.","_n":"2k9f9","_k":"2e7116d4"},{"t":"Progesterone","why":"Progesterone is low until after ovulation.","_n":"2la49","_k":"cbb4b56d"},{"t":"FSH","why":"FSH rises a little, but the LH surge triggers ovulation.","_n":"2ma59","_k":"01e61509"},{"t":"LH","why":"The LH surge triggers ovulation about a day later.","_n":"2na29","_k":"b2c107aa"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"During which \u003cstrong>uterine\u003c/strong> phase does estrogen thicken the lining?","options":[{"t":"Secretory","why":"That comes after ovulation, under progesterone.","_n":"2oa39","_k":"e53ece41"},{"t":"Menstrual","why":"The lining is shed then.","_n":"2p989","_k":"0eb0149d"},{"t":"Proliferative","why":"Days 6–14: estrogen from the growing follicle builds the lining.","_n":"2q999","_k":"0c31d62e"},{"t":"Luteal","why":"Luteal is an ovarian phase.","_n":"2r83b","_k":"7a8f6832"}]},"b":{"prompt":"Which \u003cstrong>ovarian\u003c/strong> phase is dominated by progesterone?","options":[{"t":"Menstrual","why":"Ovary: follicular, ovulation, luteal. Uterus: menstrual, proliferative, secretory.","_n":"2s84b","_k":"084ad34c"},{"t":"Luteal","why":"After ovulation, the corpus luteum makes progesterone.","_n":"2t81b","_k":"d00c65d1"},{"t":"Follicular","why":"Progesterone is low before ovulation.","_n":"2u82b","_k":"22dce6ac"},{"t":"Proliferative","why":"That’s a uterine phase.","_n":"2v7fb","_k":"90cae6d2"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"What does hCG do in early pregnancy?","options":[{"t":"It triggers ovulation","why":"hCG appears after implantation, long after ovulation.","_n":"2w80b","_k":"56252f8c"},{"t":"It raises FSH to grow new follicles","why":"FSH stays low in pregnancy.","_n":"2x7db","_k":"2b63cf62"},{"t":"It causes menstruation","why":"It prevents menstruation.","_n":"2y7eb","_k":"9aa5c27a"},{"t":"It keeps the corpus luteum making progesterone","why":"So the lining stays and there is no menstruation.","_n":"2z8bb","_k":"e69cfed4"}]},"b":{"prompt":"Which hormone does a home pregnancy test detect?","options":[{"t":"Progesterone","why":"Home pregnancy tests detect \u003cstrong>hCG\u003c/strong>; ovulation predictor kits detect LH.","_n":"308cb","_k":"223bbdeb"},{"t":"hCG","why":"Home pregnancy tests detect \u003cstrong>hCG\u003c/strong>; ovulation predictor kits detect LH.","_n":"3109b","_k":"8fa5867f"},{"t":"LH","why":"Ovulation kits detect LH.","_n":"3208b","_k":"82f5d2ee"},{"t":"Estrogen","why":"Home pregnancy tests detect \u003cstrong>hCG\u003c/strong>; ovulation predictor kits detect LH.","_n":"330bb","_k":"55e7d179"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"On day 12, estrogen is high and has been rising for two days. What happens next, and why?","options":[{"t":"Menstruation begins, because estrogen peaks","why":"Menstruation follows the fall in progesterone.","_n":"340ab","_k":"3a4af9f5"},{"t":"LH surges, because high sustained estrogen has positive feedback on the pituitary","why":"High, sustained estrogen flips to \u003cstrong>positive\u003c/strong> feedback on the pituitary: that’s the LH surge.","_n":"350db","_k":"135c28d6"},{"t":"LH falls, because estrogen has negative feedback on the pituitary","why":"High, sustained estrogen flips to \u003cstrong>positive\u003c/strong> feedback on the pituitary: that’s the LH surge.","_n":"360cb","_k":"69d80865"},{"t":"Progesterone surges, because the follicle switches hormones","why":"Progesterone rises after ovulation.","_n":"370fb","_k":"2a9c83d9"}]},"b":{"prompt":"On day 21, progesterone and estrogen are both high. What are FSH and LH doing, and why?","options":[{"t":"Staying low, because progesterone and estrogen brake the pituitary","why":"In the luteal phase the feedback is negative.","_n":"380eb","_k":"c3a0007a"},{"t":"Surging, because estrogen is high","why":"In the luteal phase, progesterone keeps the feedback negative.","_n":"3901b","_k":"71fd17bc"},{"t":"Rising, to start a new follicle","why":"That happens after progesterone falls.","_n":"3a00b","_k":"5e88e109"},{"t":"Falling to zero","why":"They stay low, not zero.","_n":"3b77b","_k":"8e6114bc"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"The corpus luteum is removed on day 18 (model rule: menstruation starts 4 days after it is lost). What happens?","options":[{"t":"Progesterone falls, and menstruation starts around day 22","why":"18 + 4 = 22: without progesterone the lining isn’t maintained.","_n":"3c78b","_k":"726e741d"},{"t":"Progesterone rises and the lining thickens","why":"Menstruation follows a \u003cstrong>fall\u003c/strong> in progesterone when the corpus luteum breaks down.","_n":"3d79b","_k":"2784bdb8"},{"t":"Nothing changes until day 28","why":"The lining depends on progesterone now.","_n":"3e7ab","_k":"1a49a07d"},{"t":"Ovulation happens again on day 19","why":"A new follicle hasn’t matured.","_n":"3f7bb","_k":"40336331"}]},"b":{"prompt":"An egg is fertilized, but the embryo fails to implant. What happens to the corpus luteum, and why?","options":[{"t":"It releases a second egg","why":"The corpus luteum doesn’t release eggs.","_n":"3g7cb","_k":"7ad32599"},{"t":"It breaks down on schedule, because no hCG is made to maintain it","why":"hCG comes only from an implanted embryo.","_n":"3h7db","_k":"d7ba97f2"},{"t":"It keeps going, because fertilization happened","why":"hCG comes from the implanted embryo.","_n":"3i7eb","_k":"9ce1a40d"},{"t":"It grows larger, because LH rises","why":"LH stays low in the luteal phase.","_n":"3j7fb","_k":"e0d20299"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"After menopause, blood tests show high FSH, high LH and low estrogen. Why are FSH and LH high?","options":[{"t":"The ovaries are overactive, making FSH","why":"FSH comes from the pituitary.","_n":"3k80b","_k":"447c78cb"},{"t":"The ovaries make little estrogen, so the pituitary is no longer braked","why":"FSH is high because low estrogen releases the brake: the pituitary is calling and the ovaries can’t answer.","_n":"3l7db","_k":"aaeb5d06"},{"t":"The hypothalamus has stopped working","why":"Then FSH and LH would be low.","_n":"3m7cb","_k":"1864c9c7"},{"t":"Progesterone is high, stimulating the pituitary","why":"Progesterone is low.","_n":"3n7bb","_k":"2b3d0369"}]},"b":{"prompt":"Both ovaries are surgically removed. What happens to FSH and LH?","options":[{"t":"They fall, because their target is gone","why":"The pituitary still works; it isn’t braked.","_n":"3o7ab","_k":"6ef931c3"},{"t":"Only LH rises; FSH falls","why":"Both lose their brake.","_n":"3p81b","_k":"b5784229"},{"t":"They rise, because estrogen and progesterone no longer brake the pituitary","why":"No ovaries, no end hormones, no brake.","_n":"3q80b","_k":"321138ae"},{"t":"They stay the same","why":"Feedback responds to the loss.","_n":"3r7fb","_k":"499d0451"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of how the combined pill prevents ovulation?","options":[{"t":"“The pill kills eggs in the ovary.”","why":"It works through hormones, not by destroying eggs.","_n":"3s7eb","_k":"23d21ceb"},{"t":"“Steady synthetic estrogen and progestin brake the pituitary: FSH stays too low for a follicle to mature, and there is no LH surge to release an egg.”","why":"It uses negative feedback on the pituitary.","_n":"3t85b","_k":"64237b56"},{"t":"“The pill makes the lining shed every day.”","why":"The lining stays thin; shedding happens in the placebo week.","_n":"3u84b","_k":"80160e71"},{"t":"“The pill raises LH so high that ovulation can’t happen.”","why":"It keeps LH low and flat.","_n":"3v7bc","_k":"9c2d9f3e"}]},"b":{"prompt":"Which is the best explanation of why menstruation begins at the end of a cycle without pregnancy?","options":[{"t":"“The lining grows too thick and falls off.”","why":"It’s hormone withdrawal, not thickness.","_n":"3w7cc","_k":"6c938866"},{"t":"“With no hCG, the corpus luteum breaks down, progesterone falls, and the lining is no longer maintained, so it is shed.”","why":"Menstruation follows a \u003cstrong>fall\u003c/strong> in progesterone when the corpus luteum breaks down.","_n":"3x79c","_k":"7af5cbbc"},{"t":"“Estrogen surges and breaks down the lining.”","why":"Estrogen is falling too.","_n":"3y7ac","_k":"83c4dad6"},{"t":"“LH surges and releases the lining.”","why":"The \u003cstrong>LH\u003c/strong> surge triggers ovulation; estrogen is what sets it off.","_n":"3z7fc","_k":"263646e6"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which sequence of events is correct?","options":[{"t":"FSH rises → follicle grows and makes estrogen → LH surge → ovulation → corpus luteum makes progesterone","why":"Each step sets up the next.","_n":"4080c","_k":"99a3d6c9"},{"t":"Progesterone rises → ovulation → estrogen rises → LH surge","why":"Progesterone comes after ovulation.","_n":"417dc","_k":"830f7ac2"},{"t":"FSH rises → corpus luteum forms → follicle grows → ovulation","why":"The corpus luteum forms after ovulation.","_n":"427ec","_k":"deb1cca8"},{"t":"LH surge → FSH rises → ovulation → follicle grows","why":"The follicle must grow before the surge.","_n":"4383c","_k":"9e2adf3e"}]},"b":{"prompt":"Which pairing of ovarian and uterine phases is correct?","options":[{"t":"Follicular phase ↔ menstrual then proliferative phases; luteal phase ↔ secretory phase","why":"Ovary: follicular, ovulation, luteal. Uterus: menstrual, proliferative, secretory.","_n":"4484c","_k":"3ade9db9"},{"t":"Luteal ↔ menstrual only","why":"Ovary: follicular, ovulation, luteal. Uterus: menstrual, proliferative, secretory.","_n":"4581c","_k":"6e3ddf82"},{"t":"Ovulation ↔ menstrual","why":"Menstruation is at the start of the cycle.","_n":"4680c","_k":"cd34e794"},{"t":"Follicular ↔ secretory; luteal ↔ proliferative","why":"Swapped. Ovary: follicular, ovulation, luteal. Uterus: menstrual, proliferative, secretory.","_n":"4783c","_k":"c2c1b8d2"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Why are FSH injections given at the start of IVF treatment?","options":[{"t":"To make several follicles mature at once, so more eggs can be collected","why":"More FSH, more follicles (model: up to 12).","_n":"4882c","_k":"f27ddc2b"},{"t":"To keep the lining ready after transfer","why":"That’s progesterone’s job.","_n":"497dc","_k":"e9c1644a"},{"t":"To trigger ovulation immediately","why":"That’s the job of the LH-like trigger.","_n":"4a7cc","_k":"aa0943d9"},{"t":"To lower estrogen","why":"Growing follicles raise estrogen.","_n":"4b7fc","_k":"02ccdaa7"}]},"b":{"prompt":"Why is an hCG ‘trigger’ injection given near the end of the follicle-growing phase?","options":[{"t":"hCG lowers progesterone","why":"hCG keeps progesterone up.","_n":"4c7ec","_k":"c26bf571"},{"t":"hCG prevents the corpus luteum from forming","why":"It does the opposite: it supports it.","_n":"4d89c","_k":"fcc1ca5b"},{"t":"hCG grows more follicles, like FSH","why":"It acts like LH, not FSH.","_n":"4e88c","_k":"77ca6583"},{"t":"hCG acts on LH receptors, so it mimics the LH surge and times the final egg maturation","why":"It stands in for the natural surge.","_n":"4f0fb","_k":"cfbf21de"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Cycles are regularly 30 days. Using the model’s 14-day luteal phase, on which day is ovulation most likely?","options":[{"t":"Day 14","why":"In the model, the luteal phase lasts 14 days, so ovulation ≈ cycle length − 14.","_n":"4g10b","_k":"7694f71d"},{"t":"Day 30","why":"That’s the last day of the cycle.","_n":"4h11b","_k":"477235fb"},{"t":"Day 16","why":"30 − 14 = 16.","_n":"4i12b","_k":"b3dd025a"},{"t":"Day 15","why":"30 − 14 = 16, not 15.","_n":"4j0bb","_k":"eebfae79"}]},"b":{"prompt":"Cycles are regularly 27 days. Using the model’s 14-day luteal phase, on which day is ovulation most likely?","options":[{"t":"Day 12","why":"27 − 14 = 13.","_n":"4k0cb","_k":"9153fe61"},{"t":"Day 13","why":"27 − 14 = 13.","_n":"4l0db","_k":"ac3405d6"},{"t":"Day 27","why":"That’s the last day of the cycle.","_n":"4m0eb","_k":"1757ef91"},{"t":"Day 14","why":"In the model, the luteal phase lasts 14 days, so ovulation ≈ cycle length − 14.","_n":"4n07b","_k":"b9eda4f4"}]}}]},"task":{"title":"Design a model hormone schedule","summary":"Design a model hormone schedule","statement":"\u003cp>Using the Pill-mode model, set the synthetic estrogen (\u003ci>E\u003c/i>) and progestin (\u003ci>P\u003c/i>) levels for each week of a 4-week pack so that every condition is met. These are model levels, not real medicine amounts. Can you find more than one schedule?\u003c/p>\u003col class=\"fr-tlist\">\u003cli>No LH surge in weeks 1–3.\u003c/li>\u003cli>FSH stays below 15 in weeks 1–3, so no follicle matures.\u003c/li>\u003cli>A withdrawal bleed happens in week 4.\u003c/li>\u003cli>The estrogen level never goes above 2 (in the model, higher estrogen adds clot risk).\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Model: FSH in week \u003ci>w\u003c/i> = 40 − 10\u003ci>E\u003c/i>\u003csub>\u003ci>w\u003c/i>\u003c/sub> − 5\u003ci>P\u003c/i>\u003csub>\u003ci>w\u003c/i>\u003c/sub> (never below 5); an LH surge is possible in week \u003ci>w\u003c/i> if \u003ci>P\u003c/i>\u003csub>\u003ci>w\u003c/i>\u003c/sub> = 0; a withdrawal bleed happens in week 4 when \u003ci>E\u003c/i>\u003csub>4\u003c/sub> = \u003ci>P\u003c/i>\u003csub>4\u003c/sub> = 0 after active weeks.\u003c/p>","checks":["No surge in weeks 1–3","FSH below 15 in weeks 1–3","Withdrawal bleed in week 4","Estrogen never above 2"],"tips":["Progestin is what blocks the surge in this model.","Each estrogen level lowers FSH by 10 and each progestin level by 5. You need FSH below 15.","The bleed comes when the hormones are withdrawn.","With estrogen capped at 2, how much progestin do you need to keep FSH below 15?"],"explainPrompt":"Explain how your schedule uses negative feedback to prevent ovulation, and why week 4 is hormone-free.","vocab":"Use the words negative feedback, FSH, LH surge and withdrawal.","after3":"Every answer uses estrogen 2 and progestin 2 or 3. With estrogen capped, progestin does part of the work of keeping FSH down: 40 − 20 − 10 = 10."},"cards":[["Ovarian cycle","Follicular phase → ovulation → luteal phase."],["Uterine cycle","Menstrual → proliferative → secretory phase."],["FSH (female)","From the anterior pituitary; grows follicles early in the cycle."],["LH surge","A sharp LH peak (about day 13 in the model) that triggers ovulation about a day later."],["Estrogen’s two feedbacks","Low or moderate: negative (brakes FSH and LH). High and sustained: positive (triggers the LH surge)."],["Corpus luteum","The follicle after ovulation; makes progesterone (and estrogen)."],["Progesterone","Keeps the lining ready (secretory phase); brakes FSH and LH; raises resting temperature slightly."],["Why menstruation starts","The corpus luteum breaks down, progesterone falls, and the lining is shed."],["hCG","Made after implantation; keeps the corpus luteum working; detected by pregnancy tests."],["Combined pill","Steady estrogen and progestin keep FSH low and prevent the LH surge, so there’s no ovulation."],["Menopause hormones","Low estrogen → no brake → high FSH and LH."],["Ovulation day estimate (model)","Cycle length − 14 (the luteal phase is the steady part)."]]}};</script>
