.jq{margin:0 0 18px}

.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 43: S10 population model, hero herd, Part 3 woodlot / pond / maps / survivorship, task preview.
   Roles (course plan §3, plan build notes): population curve species-1 blue --pen; K line --ink-2 dashed; births bar --pen,
   deaths bar --ink-2; survivorship I / II / III in --pen / --bio-atp / --bio-nadh, always labelled; trillium dots --leaf. */

/* hero */
.hero .hero-eq .po-heq{display:inline-block;max-width:100%}
.po-n{color:var(--pen)}
.po-k{border-bottom:2px dashed var(--ink-2);padding-bottom:1px}
.po-fac{display:inline-block;transition:opacity .6s}
.po-fac.po-off{opacity:0}
.po-hero{max-width:480px;margin:0 auto}
.po-hsvg{display:block;width:100%;height:auto}
.po-hmap{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.po-deer{fill:none;stroke:var(--pen);stroke-width:4.2;stroke-linecap:round}
.po-hn{font:700 13px var(--font-math);fill:var(--pen)}

/* warm-up graph */
.po-wg{display:block;width:180px;max-width:100%;height:auto;margin:8px 0 0}
.po-wg-ax{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.po-wg-c{fill:none;stroke:var(--pen);stroke-width:3;stroke-linecap:round}
.po-wg-t{font:600 11px var(--font-ui);fill:var(--ink-2)}

/* radio groups (from SBI4U 20 / 14 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.po-sl{margin:0}
.po-sl input{width:100%;accent-color:var(--ink)}

/* explore layout */
.po-ex [hidden],.po-p3 [hidden]{display:none!important}
@media (min-width:821px){ .pg.po-pg{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} }
.po-pg .pg-ctrl{display:grid;gap:12px}
.po-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.po-player{display:flex;flex-wrap:wrap;gap:8px}
#po-view{margin:0 0 8px}
.po-gbox{border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.po-gbox svg{display:block;width:100%;height:auto}
.po-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.po-note{margin:10px 0 0}
.po-more{display:none;margin-top:8px}
@media (max-width:820px){
  .po-read .po-x{display:none}
  .po-read .po-x.on{display:block}
  .po-more{display:inline-flex}
}

/* births / deaths bars */
.po-bd{margin:10px 0 0;display:grid;gap:6px}
.po-bdh{margin:0;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.po-bdrow{display:grid;grid-template-columns:3.2em minmax(0,1fr) 3.4em;align-items:center;gap:8px;font-size:.9rem}
.po-bdl{font-weight:700}
.po-bdt{display:block;height:14px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);overflow:hidden}
.po-bdt i{display:block;height:100%;transition:width .25s}
.po-bb{background:var(--pen)}
.po-bx{background:var(--ink-2)}
.po-bdrow b{text-align:right;font-family:var(--font-math)}

/* graph SVG */
.po-grid{stroke:var(--grid);stroke-width:1}
.po-zero{stroke:var(--ink-2);stroke-width:1.3}
.po-axis{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.po-tick{font:500 11.5px var(--font-ui);fill:var(--ink-2)}
.po-axl{font:600 12px var(--font-ui);fill:var(--ink-2)}
.po-lab,.po-sm{font:600 12px var(--font-ui);fill:var(--ink-2)}
.po-curve{fill:none;stroke:var(--pen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.po-pt{fill:var(--pen)}
.po-dot{fill:var(--pen);stroke:var(--sheet);stroke-width:2}
.po-kl{fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-dasharray:7 5}
.po-klab{font:700 12px var(--font-ui);fill:var(--ink-2)}
.po-gbar{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:1}
.po-gl{font:700 10.5px var(--font-ui);fill:var(--ink)}
.po-hump{fill:none;stroke:var(--ink-2);stroke-width:2}
.po-peak{fill:var(--sheet);stroke:var(--ink);stroke-width:2.2}
.po-trail{fill:none;stroke:var(--pen);stroke-width:1.4;stroke-dasharray:3 3}

/* Part 3 */
.po-sta h4{margin:16px 0 6px}
.po-qctl{display:flex;flex-wrap:wrap;gap:10px 18px;margin:0 0 10px}
.po-wood{overflow:auto;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);-webkit-overflow-scrolling:touch}
.po-wood:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.po-wood svg{display:block;width:100%;min-width:520px;height:auto}
.po-wbg{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.po-wgrid{stroke:var(--rule);stroke-width:1;stroke-dasharray:3 4}
.po-tril{fill:none;stroke:var(--leaf);stroke-width:2.3;stroke-linecap:round}
.po-quad{fill:none;stroke:var(--ink);stroke-width:1.8}
.po-qlab{font:700 12px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.po-cur{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:3 2}
.po-qread{margin-top:6px}
.po-note2{margin:10px 0 0;font-weight:600}
.po-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:700px){ .po-two{grid-template-columns:1fr} }
.po-fig{border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.po-fig svg{display:block;width:100%;height:auto}
.po-scap{margin:8px 0;font-size:.92rem}
.po-pond{fill:var(--info-bg);stroke:var(--ink-2);stroke-width:1.6}
.po-net{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4}
.po-tur{fill:var(--ink-2);stroke:var(--sheet);stroke-width:1}
.po-tur.dim{opacity:.35}
.po-paint{fill:var(--hi);stroke:var(--ink);stroke-width:.8}
.po-sw{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .8em;min-height:40px;font-weight:700}
.po-swt{width:30px;height:16px;border-radius:8px;background:var(--rule);position:relative}
.po-swt::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--sheet);transition:left .2s}
.po-sw[aria-checked="true"] .po-swt{background:var(--ink)}
.po-sw[aria-checked="true"] .po-swt::after{left:16px}
.po-swv{font-weight:400;color:var(--ink-2)}
.po-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.po-card{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px}
.po-card.on{border-color:var(--ink-2)}
.po-cardb{width:100%;text-align:left;border:0;background:none;color:var(--ink);font-weight:700;padding:4px 0;min-height:36px}
.po-cardb::before{content:"▸ ";color:var(--ink-2)}
.po-card.on .po-cardb::before{content:"▾ "}
.po-broke{margin:4px 0 2px;font-size:.92rem}
.po-maps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.po-map svg{display:block;width:100%;height:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.po-mbg{fill:var(--paper)}
.po-mdot{fill:var(--ink)}
.po-mt{margin:6px 0;font-weight:700;font-size:.92rem}
.po-lognote{margin:0 0 6px;font-size:.92rem;color:var(--ink-2)}
.po-svfig{max-width:560px}
.po-sc{fill:none;stroke-width:3;stroke-linecap:round}
.po-sc.sel{stroke-width:4}
.po-shit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.po-s1{stroke:var(--pen)}.po-s2{stroke:var(--bio-atp)}.po-s3{stroke:var(--bio-nadh)}
.po-sl2{font:700 12.5px var(--font-ui)}
.po-s1t{fill:var(--pen)}.po-s2t{fill:var(--bio-atp)}.po-s3t{fill:var(--bio-nadh)}
.po-orgs{display:grid;gap:10px;margin:10px 0 0}
.po-ocards,.po-tgts{display:flex;flex-wrap:wrap;gap:8px}
.po-tgt{border-width:2px}
.po-s1b{border-color:var(--pen)}.po-s2b{border-color:var(--bio-atp)}.po-s3b{border-color:var(--bio-nadh)}
.po-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0 0}
.po-zone{border-left:4px solid var(--rule);padding:4px 10px;display:grid;gap:2px;font-size:.92rem}
.po-s1z{border-left-color:var(--pen)}.po-s2z{border-left-color:var(--bio-atp)}.po-s3z{border-left-color:var(--bio-nadh)}
.po-tblw{overflow-x:auto}
.po-tbl{border-collapse:collapse;min-width:320px;font-size:.92rem}
.po-tbl th,.po-tbl td{border-bottom:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
.po-tbl thead th{color:var(--ink-2)}

/* task */
.po-conds{margin:8px 0;padding-left:1.4em}
.po-tin{display:grid;gap:12px}
.po-tpvw h4{margin:0 0 6px}
.po-tgtl{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:2 4}
.po-gain{fill:none;stroke:var(--ink);stroke-width:2}
.po-glab{font:700 12px var(--font-ui);fill:var(--ink)}

</style>

:"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"85b574cd","content":{"id":"43-population-ecology","kind":"topic","title":"Population ecology","topic":"Population Ecology","readyTopic":"population ecology","hero":{"eq":"\u003cspan class=\"po-heq\">growth rate = \u003ci>r\u003c/i>\u003ci class=\"po-n\">N\u003c/i>\u003cspan class=\"po-fac\">(\u003ci class=\"po-k\">K\u003c/i> − \u003ci class=\"po-n\">N\u003c/i>)/\u003ci class=\"po-k\">K\u003c/i>\u003c/span>\u003c/span>","eqLabel":"Growth rate equals r times N, times K minus N, over K.","eqSize":"sm","headline":"Every population meets a ceiling","text":"Give a population food and space and it \u003cstrong>grows exponentially\u003c/strong>: the more individuals, the more young. But every habitat has a \u003cstrong>carrying capacity\u003c/strong>, `K`. As a population nears it, food, space and safety run short, and growth slows to a stop. You’ll model both kinds of growth, then estimate real populations the way field biologists do.","fig":{"html":"\u003cdiv class=\"po-hero\" id=\"po-hero\" role=\"img\" aria-label=\"A small herd of 10 deer dots on a map multiplies year by year while a population graph traces a steepening J-curve. A dashed line labelled K = 500 fades in; the curve bends, passes the halfway mark at its steepest, and levels off just under the line.\">\u003c/div>"}},"goals":["I can describe a population by its size, density, distribution pattern and survivorship.","I can calculate a per-capita growth rate from births, deaths, immigration and emigration, and use it to predict the next size.","I can use exponential and logistic models to predict population size and growth, and say where growth is fastest.","I can explain carrying capacity and sort limiting factors into density-dependent and density-independent.","I can estimate population size with quadrats and mark–recapture, and explain what makes an estimate biased.","I can compare r-selected and K-selected strategies and the three survivorship curves."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Percentages","goal":2,"prompt":"A population of 400 grows by 10% in one year. What is its size after that year?","options":[{"t":"410","why":"10% means 10 per 100, so 40 for 400.","_n":"0f04","_k":"4c85561f"},{"t":"440","why":"10% of 400 is 40, and 400 + 40 = 440.","_n":"1ef4","_k":"1bebdb56"},{"t":"800","why":"Doubling is a 100% increase.","_n":"2ee4","_k":"4e856011"},{"t":"4000","why":"That’s a 900% increase.","_n":"3ed4","_k":"93602f3d"}],"hints":["Find 10% of 400 first.","10% of 400 = 40.","400 + 40 = 440."]},{"id":"w2","skill":"Percentages","goal":2,"prompt":"A population of 500 has 60 births and 35 deaths in a year, with no one arriving or leaving. What is the change in size?","options":[{"t":"+95","why":"Deaths remove individuals.","_n":"4ec4","_k":"7b0016ad"},{"t":"+25","why":"60 − 35 = 25 more individuals.","_n":"5eb4","_k":"298443c6"},{"t":"−25","why":"There were more births than deaths, so the population grew.","_n":"6ea4","_k":"b25b9c81"},{"t":"+60","why":"The 35 deaths count too.","_n":"7f94","_k":"c2b563b5"}],"hints":["Births add; deaths remove.","60 added, 35 removed.","+25."]},{"id":"w3","skill":"Reading graphs","goal":3,"prompt":"A population graph rises slowly at first, then more and more steeply. Which description fits?\u003csvg class=\"po-wg\" viewBox=\"0 0 180 110\" role=\"img\" aria-label=\"A population graph: population size against time. The curve rises slowly at first, then more and more steeply.\" focusable=\"false\">\u003cpath class=\"po-wg-ax\" d=\"M24 8 L24 92 L172 92\"/>\u003cpath class=\"po-wg-c\" d=\"M26 89 C80 88 118 80 140 60 C152 48 160 30 166 12\"/>\u003ctext class=\"po-wg-t\" x=\"98\" y=\"106\" text-anchor=\"middle\">time\u003c/text>\u003ctext class=\"po-wg-t\" x=\"14\" y=\"52\" text-anchor=\"middle\" transform=\"rotate(-90 14 52)\">population\u003c/text>\u003c/svg>","options":[{"t":"Decline","why":"The curve rises, so the population is growing.","_n":"8f84","_k":"e0067def"},{"t":"Linear growth","why":"A straight line adds the same amount each year.","_n":"954b","_k":"56da1765"},{"t":"Exponential (J-shaped) growth","why":"The steepening curve means each year adds more than the last.","_n":"a55b","_k":"837dad9b"},{"t":"Logistic (S-shaped) growth","why":"An S-curve levels off; this one keeps getting steeper.","_n":"b52b","_k":"4b2e47ac"}],"hints":["Is the slope constant, increasing or decreasing?","It keeps increasing.","Exponential."]},{"id":"w4","skill":"Reading graphs","goal":4,"prompt":"A population graph levels off at 800 individuals and stays near there. What does 800 most likely represent?","options":[{"t":"The starting population","why":"The start is at the left of the graph.","_n":"c53b","_k":"d0cac908"},{"t":"The year growth stopped","why":"800 is on the population axis, not the time axis.","_n":"d58b","_k":"99bccdfc"},{"t":"The largest population the habitat can support over time (its carrying capacity)","why":"The resources limit it there.","_n":"e59b","_k":"85425853"},{"t":"The number born each year","why":"The `y`-axis shows population size, not births.","_n":"f56b","_k":"3bd99a3c"}],"hints":["Which axis is 800 on?","Population size, where the curve flattens.","Carrying capacity."]},{"id":"w5","skill":"Ecology terms","goal":1,"prompt":"Which is a population?","options":[{"t":"All the animals in Algonquin Park","why":"Many species together are a community.","_n":"g57b","_k":"41a56070"},{"t":"The deer and the wolves that hunt them","why":"Two species interacting are part of a community.","_n":"h5cb","_k":"a85cc74f"},{"t":"All the white-tailed deer in Algonquin Park","why":"One species, one place, one time.","_n":"i5db","_k":"ae5f72d2"},{"t":"The park’s living things and its soil, water and climate","why":"That’s an ecosystem.","_n":"j6eb","_k":"944ba1fa"}],"hints":["How many species are in a population?","One.","The deer."]},{"id":"w6","skill":"Ecology terms","goal":4,"prompt":"Which is an abiotic factor?","options":[{"t":"A predator","why":"Predators are biotic.","_n":"k6db","_k":"2cae9b1e"},{"t":"A late spring frost","why":"Weather is non-living.","_n":"l6cb","_k":"ea30bafd"},{"t":"A parasite","why":"Parasites are living: biotic.","_n":"m6bb","_k":"26f7f1a6"},{"t":"Competition for food","why":"Competition happens between living things.","_n":"n6ab","_k":"f85b224a"}],"hints":["Abiotic means non-living.","Which choice isn’t an organism or an interaction between organisms?","The frost."]}],"refreshers":{"Percentages":"To grow by `p`%, add `p`/100 of the current size. 10% of 400 is 40, so the new size is 440. Births add; deaths remove.","Reading graphs":"A straight line means the same change each step. A curve getting steeper means faster and faster growth; one that flattens is levelling off at a limit.","Ecology terms":"Population: one species in one area. Community: all the populations together. Ecosystem: the community plus the non-living (abiotic) factors such as weather, water and soil."}}},"explore":{"heading":"Population growth simulator","intro":"Choose a model, set the starting population and growth rate, and run the years. Watch how many individuals are added each year, not just the total.","chalIntro":"Set the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","modelNote":"One step per year. Exponential: `N_{t+1} = N_t(1 + r)`. Logistic: `N_{t+1} = N_t + rN_t(K - N_t)/K`. Cycle: `N = ` average + swing × sin(2π`t`/length). Values are shown rounded to whole individuals.","demoNote":"Logistic births per year = (`r` + 0.1)`N` − (`r`/2)`N`²/`K`; deaths per year = 0.1`N` + (`r`/2)`N`²/`K`. Their difference is the logistic gain.","predictions":[{"id":"p1","prompt":"Exponential, `N_0` = 50, `r` = 1.0. The population doubles every year. How big is it after 4 years?","options":[{"t":"200","_n":"o69b","_k":"f758b45b"},{"t":"250","_n":"p68b","_k":"f9c73f61"},{"t":"400","_n":"q67b","_k":"71a2d463"},{"t":"800","_n":"r66b","_k":"89ab184a"}],"explain":"Each year doubles the \u003cem>current\u003c/em> size, so the gains double too. 250 would be adding 50 every year.","reveal":"50 → 100 → 200 → 400 → 800. The gains (+50, +100, +200, +400) are stacked as bars under the curve.","start":{"model":"exp","n0":50,"r10":10,"year":0,"view":"time"},"to":4},{"id":"p2","prompt":"Logistic, `N_0` = 20, `r` = 0.5, `K` = 500. When will the population add the most individuals in one year?","options":[{"t":"The gain is the same every year","_n":"s65b","_k":"34f922b3"},{"t":"At the start, when it’s 20","_n":"te8b","_k":"1fbed8fc"},{"t":"When it’s near 250, half of `K`","_n":"ue9b","_k":"4f696933"},{"t":"When it’s near 500","_n":"veab","_k":"bced9cb7"}],"explain":"Near 250 there are many parents and still plenty of room. Near 500 the habitat is full.","reveal":"The “Growth vs population” view drew the hump. Its peak is at `N` = 250, half of `K`.","start":{"model":"log","n0":20,"r10":5,"K":500,"year":0,"view":"growth"},"to":20},{"id":"p3","prompt":"Logistic, `N_0` = 700, `r` = 0.5, `K` = 500. The population starts above carrying capacity. What happens?","options":[{"t":"It keeps rising","_n":"webb","_k":"6fe7b471"},{"t":"It falls toward 500","_n":"xe4b","_k":"f5502b47"},{"t":"It stays at 700","_n":"ye5b","_k":"5f7e72a0"},{"t":"It crashes to 0","_n":"ze6b","_k":"6e7e9408"}],"explain":"Above `K`, (`K − N`) is negative, so the ‘growth’ is a loss until `N` returns to `K`.","reveal":"700 → 560 → 526 → 513 …: the deaths bar is taller than the births bar until `N` is back at 500. (The `N_0` slider runs to 700 for this prediction only.)","start":{"model":"log","n0":700,"r10":5,"K":500,"year":0,"view":"time"},"to":6},{"id":"p4","prompt":"Logistic, run to year 20, so `N` ≈ `K`. The population is at carrying capacity. Are individuals still being born?","options":[{"t":"Yes, and just as many die each year","_n":"10e7b","_k":"53fc1725"},{"t":"No, nothing dies once the habitat is full","_n":"11e0b","_k":"c0a94fb0"},{"t":"Yes, and more are born than die","_n":"12e1b","_k":"4da55112"},{"t":"No, births stop at `K`","_n":"13e2a","_k":"5d201ced"}],"explain":"Carrying capacity is a balance of births and deaths, not a freeze.","reveal":"At year 20 the bars read 175 born / 175 died (`r` = 0.5, `K` = 500).","start":{"model":"log","n0":50,"r10":5,"K":500,"year":0,"view":"time"},"to":20}],"challenges":[{"id":"tc1","goal":[3,4],"prompt":"Exponential mode: make the population \u003cstrong>exactly 640\u003c/strong> in year 3.","why":"80 × 2 × 2 × 2 = 640: with `r` = 1.0 the population doubles each year.","general":"Exponential growth multiplies; it doesn’t add the same amount.","named":{"mode":"Switch the model to \u003cstrong>Exponential\u003c/strong> first.","n160":"One doubling too many. Work backwards from 640: 320, 160, 80.","r05":"Growing by half each year is too slow; 640 ÷ 80 = 8 = 2 × 2 × 2."},"hints":["Three years of growth: `N_0 × (1 + r) × (1 + r) × (1 + r) = 640`.","If the population doubles each year (`r` = 1.0), then `N_0` × 8 = 640.","`N_0` = 80, `r` = 1.0."]},{"id":"tc2","goal":[3,4],"prompt":"Logistic mode: set `r` and `K` so the fastest possible yearly gain (at `N = K/2`) is \u003cstrong>exactly 50\u003c/strong>.","why":"The gain at `K/2` is `r × (K/2) × (1/2) = rK/4`, so `rK` = 200. The peak is at half of `K`, not at `K`, where the gain is 0.","general":"The fastest gain is `rK/4`. Change `r` or `K` until it is 50.","named":{"mode":"Switch the model to \u003cstrong>Logistic\u003c/strong> first.","rk100":"You used `r × K/2`. Don’t forget the crowding factor: at `K/2` it’s (`K − K/2`)/`K` = 1/2.","rk50":"`rK/4` must be 50, so `rK` = 200."},"hints":["Gain = `rN(K - N)/K`. Put `N = K/2`.","That gives `rK/4`.","`rK/4` = 50, so `rK` = 200: for example `r` = 0.4, `K` = 500."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Logistic mode: the population must gain \u003cstrong>exactly 90\u003c/strong> in its first year, and must start \u003cstrong>below half of `K`\u003c/strong>.","why":"`rN_0(K - N_0)/K` = 90 with `N_0 \u003c K/2`. The plans that work: (100, 1.0, 1000), (150, 0.8, 600), (150, 0.9, 450) and (200, 0.6, 800).","general":"Find the first-year gain `rN_0(K - N_0)/K`. It must be exactly 90, with `N_0` below `K/2`.","named":{"mode":"Switch the model to \u003cstrong>Logistic\u003c/strong> first.","half":"That gains 90, but 200 is exactly half of 400, not below it.","halfAny":"That gains 90, but `N_0` isn’t below half of `K`.","crowd":"`rN_0` = 90 forgets (`K − N_0`)/`K`, which is always less than 1."},"hints":["Choose `N_0` and `K` first, then solve for `r`.","Try `K` = 1000 and `N_0` = 100: (`K − N_0`)/`K` = 0.9, so `r` × 100 × 0.9 = 90.","`r` = 1.0. Others: (150, 0.8, 600), (150, 0.9, 450), (200, 0.6, 800)."]}]},"part3":{"slug":"sampling","name":"Sampling","heading":"Measure a population","intro":"The models need real numbers. Ecologists estimate rather than count: quadrats for plants and slow animals, mark–recapture for animals that move. Work through the three stations, then try the quick check.","st1":{"title":"Station 1: Quadrats in a woodlot","text":"A 50 m × 40 m woodlot (2000 m²) of trilliums, which grow in clumps. Each quadrat is 1 m².","random":[[8,11],[31,5],[42,32],[15,31],[47,15],[25,18],[6,24],[34,25],[12,5],[20,25]],"bias":"Random placement keeps your choices from steering the result.","steady":"With 10 quadrats the running estimate steadies: more samples help with a clumped distribution."},"st2":{"title":"Station 2: Mark–recapture at a pond","text":"Painted turtles. First capture: `M` = 40 turtles get a dab of paint on the shell and are released. Second capture: `n` = 30 are caught, and `m` = 8 of them are marked.","M":40,"n":30,"m":8,"mWorn":6,"cards":[{"id":"a1","t":"Marks don’t wear off","broke":"If paint wears off, marked turtles are counted as unmarked. `m` comes out too small, so `N` comes out too big."},{"id":"a2","t":"Marked turtles mix back in","broke":"If marked turtles stay together near where they were released, the second sample’s fraction marked doesn’t match the pond’s, and the estimate can be off in either direction."},{"id":"a3","t":"No births, deaths or migration between captures","broke":"New unmarked turtles arriving or hatching dilute the marks, so `m` is too small and `N` too big. Marked turtles dying or leaving does the same."},{"id":"a4","t":"Being marked doesn’t change the chance of being caught","broke":"Trap-shy marked turtles make `m` too small and `N` too big. Trap-happy ones make `m` too big and `N` too small."}]},"st3":{"title":"Station 3: Patterns and strategies","maps":[{"id":"clumped","t":"Trilliums around moist hollows","fb":"Clumped: the plants gather where the soil stays moist."},{"id":"uniform","t":"Nesting gannets","fb":"Uniform: each bird pecks at neighbours within reach, so nests end up evenly spaced."},{"id":"random","t":"Dandelions in a lawn","fb":"Random: wind-blown seeds land anywhere, with no pattern."}],"m8":"Type III: huge early losses, so few young survive (cod, maple seeds). Type I: most live to old age (humans, bears).","logNote":"The `y`-axis is a log scale: each grid line is 10 times the one below.","orgs":[{"id":"o1","t":"Humans","type":"I"},{"id":"o2","t":"Black bears","type":"I"},{"id":"o3","t":"American robins","type":"II"},{"id":"o4","t":"Atlantic cod","type":"III"},{"id":"o5","t":"Sugar maple seeds","type":"III"}],"typeWhy":{"I":"Type I: most live to old age, then losses climb late in life.","II":"Type II: a roughly constant risk at every age.","III":"Type III: huge early losses; the few survivors can live long."},"table":{"head":["","r-selected","K-selected"],"rows":[["Offspring number","Many","Few"],["Parental care","Little or none","Much"],["Age at first reproduction","Early","Late"],["Lifespan","Short","Long"],["Typical survivorship","Type III","Type I"]]}},"quickCheck":{"title":"Measure a population quick check","summary":"Measure a population quick check","items":[{"id":"q1","goal":5,"prompt":"Five 1 m² quadrats hold 2, 4, 3, 5 and 1 plants. The field is 600 m². Estimate the population.","choices":[{"t":"15","fb":"Mean = 15 ÷ 5 = 3 per m²; 3 × 600 = 1800. 15 is only the plants in the quadrats.","_n":"14e1a","_k":"d99cd7b9"},{"t":"1800","fb":"Mean = 15 ÷ 5 = 3 per m²; 3 × 600 = 1800.","_n":"15e4a","_k":"c93bf266"},{"t":"3000","fb":"Mean = 15 ÷ 5 = 3 per m²; 3 × 600 = 1800. 15 is only the plants in the quadrats.","_n":"16e3a","_k":"e843034d"},{"t":"9000","fb":"Mean = 15 ÷ 5 = 3 per m²; 3 × 600 = 1800. 15 is only the plants in the quadrats.","_n":"17e6a","_k":"bafa355d"}]},{"id":"q2","goal":5,"prompt":"`M` = 50 marked; a second sample of `n` = 40 has `m` = 10 marked. Estimate `N`.","choices":[{"t":"12.5","fb":"`N = M × n ÷ m` = 50 × 40 ÷ 10. 12.5 flips the ratio.","_n":"18e5a","_k":"ff135c61"},{"t":"100","fb":"`N = M × n ÷ m` = 50 × 40 ÷ 10. 12.5 flips the ratio.","_n":"19e8a","_k":"d3c416e1"},{"t":"200","fb":"`N = M × n ÷ m` = 50 × 40 ÷ 10 = 200.","_n":"1ae7a","_k":"7828c119"},{"t":"2000","fb":"`N = M × n ÷ m` = 50 × 40 ÷ 10. 12.5 flips the ratio.","_n":"1bdaa","_k":"ac258270"}]},{"id":"q3","goal":1,"prompt":"Nesting seabirds peck at any neighbour within reach, so nests end up evenly spaced. Distribution?","choices":[{"t":"Exponential","fb":"Even spacing from territorial behaviour is uniform.","_n":"1cd9a","_k":"f00ca6e5"},{"t":"Random","fb":"Even spacing from territorial behaviour is uniform.","_n":"1ddca","_k":"d3ddbf9c"},{"t":"Clumped","fb":"Even spacing from territorial behaviour is uniform.","_n":"1edda","_k":"9fdca476"},{"t":"Uniform","fb":"Even spacing from territorial behaviour is uniform.","_n":"1fdaa","_k":"e1960a87"}]},{"id":"q4","goal":6,"prompt":"A tree makes thousands of seeds; almost all die as seedlings, but survivors live long. Survivorship type?","choices":[{"t":"II","fb":"Huge early losses: type III.","_n":"1gdba","_k":"64d3c08a"},{"t":"Logistic","fb":"Huge early losses: type III.","_n":"1hd8a","_k":"1b52a5db"},{"t":"I","fb":"Huge early losses: type III.","_n":"1id9a","_k":"3d34cd43"},{"t":"III","fb":"Huge early losses: type III.","_n":"1jd6a","_k":"992e483c"}]}]}},"practice":{"activities":[{"id":"sorter","type":"sorter","title":"Limiting factor sorter","summary":"Limiting factor sorter","goal":4,"noun":"factor","txt":true,"instruction":"Ten limiting factors. Sort each one: does it depend on how crowded the population is?","boxes":[{"id":"dd","label":"Density-dependent"},{"id":"di","label":"Density-independent"}],"wrongDefault":"Ask: would this hit harder if the population were more crowded? Try the other box.","items":[{"id":"i1","t":"A contagious disease spreads through a crowded deer yard","_a":"GlEGFw==","why":"Crowding helps a disease spread.","wrong":{"di":"Crowding helps it spread or bite harder, so it depends on density."}},{"id":"i2","t":"A late spring frost kills apple blossoms","_a":"GlELFw==","why":"A frost kills the same fraction however crowded the trees are.","wrong":{"dd":"Would it hit harder if the population were more crowded? A frost kills the same fraction either way."}},{"id":"i3","t":"Moose compete for scarce winter browse","_a":"GlEGFw==","why":"More moose means less browse for each.","wrong":{"di":"Crowding helps it spread or bite harder, so it depends on density."}},{"id":"i4","t":"A lightning-caused forest fire","_a":"GlELFw==","why":"Fire burns crowded and sparse populations alike.","wrong":{"dd":"Would it hit harder if the population were more crowded? A frost kills the same fraction either way."}},{"id":"i5","t":"Owls catch more voles in years when voles are abundant","_a":"GlEGFw==","why":"More voles, more successful hunts.","wrong":{"di":"Crowding helps it spread or bite harder, so it depends on density."},"hints":["Do owls eat a bigger share when voles are common?","Yes: more voles, more successful hunts.","Density-dependent."]},{"id":"i6","t":"A spring flood washes out shoreline nests","_a":"GlELFw==","why":"A flood doesn’t depend on how many nests there are.","wrong":{"dd":"Would it hit harder if the population were more crowded? A frost kills the same fraction either way."}},{"id":"i7","t":"Tadpoles in a crowded pond each get less food","_a":"GlEGFw==","why":"Competition for food grows with crowding.","wrong":{"di":"Crowding helps it spread or bite harder, so it depends on density."}},{"id":"i8","t":"Acid rain lowers a lake’s pH","_a":"GlELFw==","why":"Crowding doesn’t change the rain.","wrong":{"dd":"Would it hit harder if the population were more crowded? A frost kills the same fraction either way."},"hints":["Does crowding change the rain?","No.","Density-independent."]},{"id":"i9","t":"Parasites pass more easily between animals living close together","_a":"GlEGFw==","why":"Close contact speeds transmission.","wrong":{"di":"Crowding helps it spread or bite harder, so it depends on density."}},{"id":"i10","t":"Crowding stress lowers the number of young per female in a rodent colony","_a":"GlEGFw==","why":"Crowding is the cause, so it depends on density.","wrong":{"di":"Crowding is the cause here, so it depends on density."}}]},{"id":"calc","type":"numeric","title":"Population calculations","summary":"Population calculations","goal":[1,2,3,4,5],"instruction":"Eight problems. Problems 5–8 are non-routine (★); 7 and 8 go beyond the Final Check.","how":"Type a number, then press Check.","items":[{"id":"c1","goal":1,"prompt":"1200 trilliums grow in a 0.3 ha woodlot. Density in plants per hectare?","_a":"DAVSBQ==","display":"4000 per hectare","unit":"per hectare","why":"1200 ÷ 0.3 = 4000.","wrong":[{"match":360,"fb":"That multiplies; density divides by area."}]},{"id":"c2","goal":2,"prompt":"A population of 800 has 120 births, 40 deaths, 30 immigrants and 10 emigrants in a year. Find `r`.","_a":"CBtTBwI=","display":"`r` = 0.125 per year","unit":"per year","why":"(120 + 30 − 40 − 10) ÷ 800 = 100 ÷ 800 = 0.125.","wrong":[{"match":0.1,"fb":"You left out migration: +30 − 10."},{"match":0.25,"fb":"Deaths and emigrants subtract."}]},{"id":"c3","goal":2,"prompt":"With the same `r`, what is the population after one year?","_a":"AQVS","display":"900","unit":"individuals","why":"800 × 0.125 = 100, so 900.","wrong":[{"match":925,"fb":"800 × 0.125 = 100, so 900."}]},{"id":"c4","goal":3,"prompt":"A population grows 5% per year. Doubling time by the rule of 70?","_a":"CQE=","display":"14 years","unit":"years","why":"70 ÷ 5 = 14.","wrong":[{"match":1400,"fb":"Use the percentage, 5, not 0.05."}]},{"id":"c5","goal":3,"star":true,"prompt":"Logistic: `r` = 0.4, `K` = 1000, `N` = 250. Gain this year?","_a":"DwA=","display":"75","unit":"individuals","why":"0.4 × 250 × 750/1000 = 100 × 0.75 = 75.","wrong":[{"match":100,"fb":"That’s `rN`; multiply by (`K − N`)/`K` = 0.75."}],"hints":["Gain = `rN(K - N)/K`.","0.4 × 250 × 750/1000.","100 × 0.75 = 75."]},{"id":"c6","goal":[3,4],"star":true,"prompt":"Same `r` and `K`: at what `N` is the gain largest, and what is it? Type `N`, then the gain, separated by a comma.","_a":"YwBSBRsFU1Rl","display":"`N` = 500; gain 100","label":"`N`, gain:","why":"The gain is largest at `K/2` = 500: 0.4 × 500 × 500/1000 = 100.","wrong":[{"match":[1000,400],"fb":"At `K` the gain is 0."}]},{"id":"c7","goal":5,"star":true,"prompt":"A study expects about 600 animals. If 60 are marked and a second sample of 50 is caught, how many marked animals should be in it?","_a":"DQ==","display":"5 marked","unit":"marked","why":"`m = Mn/N` = 60 × 50 ÷ 600 = 5.","wrong":[{"match":0.5,"fb":"Rearrange `N = Mn/m`: `m = Mn/N` = 60 × 50 ÷ 600."},{"match":50,"fb":"Rearrange `N = Mn/m`: `m = Mn/N` = 60 × 50 ÷ 600."}],"hints":["Fraction marked in the sample = fraction marked in the population.","`m`/50 = 60/600 = 1/10.","`m` = 5."]},{"id":"c8","goal":3,"star":true,"prompt":"400 animals grow exponentially at `r` = 0.25 per year (yearly steps). After how many whole years does the population first pass 900?","_a":"DA==","display":"4 years","unit":"years","why":"500, 625, 781.25, 976.6: year 4 is the first past 900.","wrong":[{"match":5,"fb":"Year 4 gives 976.6, already past 900."},{"match":3,"fb":"Year 3 is 781.25."},{"match":6,"fb":"That adds 100 every year; the gains grow."}],"hints":["Multiply by 1.25 each year.","500, 625, 781.25, …","Year 4: 976.6."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Kenji","how":"","instruction":"Kenji made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":5,"task":"30 turtles are marked. Later, 24 are caught and 6 of them are marked. Estimate the population.","steps":["Fraction marked in the second sample: 6/24 = 1/4.","Assume the same fraction in the whole pond: 30/`N` = 1/4.","So `N` = 30 × 1/4 = 7.5.","About 8 turtles."],"_a":"Cg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 rounds step 3 correctly. The mistake is earlier."],"fixes":[{"t":"`N` = 30 + 24 = 54.","why":"Adding samples ignores the recaptures.","_n":"1kd7a","_k":"46572a0f"},{"t":"30/`N` = 1/4 means `N` = 30 × 4 = 120 turtles.","why":"`N = M × n ÷ m`. If marked animals are under-counted in the second sample, `m` is too small, so `N` comes out too big.","_n":"1le4a","_k":"63bd8403"},{"t":"Step 3 is correct.","why":"Fewer turtles than were marked can’t be right.","_n":"1me5a","_k":"02117b74"},{"t":"`N` = 24 × 4 = 96.","why":"That uses the second sample, not the 30 marked.","_n":"1nd6a","_k":"f21a1a2b"}],"hints":["Could the pond hold fewer turtles than the 30 that were marked?","Solve 30/`N` = 1/4 for `N`.","`N` = 120."]},{"id":"e2","goal":2,"task":"A deer herd of 500 has 90 births, 50 deaths, 20 deer arriving and 10 leaving in one year. Find `r`.","steps":["Births − deaths = 90 − 50 = 40.","Net migration = 20 − 10 = 10.","Total change = 40 − 10 = 30.","`r` = 30 ÷ 500 = 0.06 per year."],"_a":"Cg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 divides correctly. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"10 more deer arrived than left, so migration adds 10.","_n":"1od5a","_k":"5f68f4d5"},{"t":"Ignore migration: `r` = 40/500 = 0.08.","why":"Change = (births + immigrants) − (deaths + emigrants). All four count.","_n":"1pd4a","_k":"4ba97d1f"},{"t":"Net migration of +10 adds: 40 + 10 = 50, so `r` = 0.10 per year.","why":"Change = (births + immigrants) − (deaths + emigrants). All four count.","_n":"1qd3a","_k":"26086b1a"},{"t":"Add everything: 90 + 50 + 20 + 10 = 170.","why":"Deaths and emigrants subtract.","_n":"1rdaa","_k":"a11b17e0"}],"hints":["Is net migration a gain or a loss here?","A gain of 10.","50 ÷ 500 = 0.10."]},{"id":"e3","goal":3,"task":"Logistic growth, `r` = 0.6, `K` = 800. At what size is the population growing fastest, and by how much per year?","steps":["Gain = `rN(K - N)/K`.","The gain is largest when `N` is largest, at `N = K` = 800.","Gain = 0.6 × 800 = 480 per year."],"_a":"CQ==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2 (and also drops the crowding factor). The first mistake is earlier."],"fixes":[{"t":"The gain is largest at `N = K/2` = 400: 0.6 × 400 × 400/800 = 120 per year.","why":"At `K`, births equal deaths, so growth is 0. Growth is fastest at `K/2`, where there are many parents and still plenty of room.","_n":"1sd9a","_k":"e79f62a2"},{"t":"Largest at `N` = 800, but the gain is 0.6 × 800 × 800/800 = 480.","why":"At `K`, births equal deaths, so growth is 0. Growth is fastest at `K/2`, where there are many parents and still plenty of room.","_n":"1td8a","_k":"a7c586b7"},{"t":"Step 2 is correct.","why":"At `N` = 800, (`K − N`) = 0: no growth at all.","_n":"1ud7a","_k":"a34b4fdd"},{"t":"Largest at the start, when `N` is smallest.","why":"Few parents means few young.","_n":"1vdea","_k":"3f70b320"}],"hints":["What is (`K − N`) when `N = K`?","0, so the gain is 0 at `K`.","The peak is halfway: `N` = 400, gain 120."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the simulator: how fast exponential growth runs away, or that a population at `K` still has births?"},{"id":"j2","q":"In your own words, why does logistic growth slow down as `N` approaches `K`?"},{"id":"j3","q":"Explain to a friend how mark–recapture works, and one way it can give the wrong answer."},{"id":"j4","q":"Which calculation still trips you up? What will you practise before the next module?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A 2 ha woodlot contains 900 red-backed salamanders. What is their population density?","options":[{"t":"450 per hectare","why":"900 ÷ 2.","_n":"1wdda","_k":"7254b803"},{"t":"900 per hectare","why":"That ignores the area.","_n":"1x50a","_k":"625f5900"},{"t":"0.002 per hectare","why":"That’s area ÷ number, upside down.","_n":"1y51a","_k":"e19d3a3c"},{"t":"1800 per hectare","why":"Density divides by area.","_n":"1z52a","_k":"a83eadc4"}]},"b":{"prompt":"A 4 ha marsh holds 1000 leopard frogs. What is their population density?","options":[{"t":"0.004 per hectare","why":"Upside down.","_n":"2053a","_k":"779a4bd2"},{"t":"1000 per hectare","why":"That ignores the area. Density is size ÷ area: 900 salamanders in 2 ha is 450 per hectare.","_n":"2154a","_k":"3ef0a2d4"},{"t":"250 per hectare","why":"1000 ÷ 4.","_n":"2255a","_k":"b3b25d35"},{"t":"4000 per hectare","why":"Density divides by area. Density is size ÷ area: 900 salamanders in 2 ha is 450 per hectare.","_n":"2356a","_k":"d09658d0"}]}},{"id":"k2","cat":"K","goal":6,"a":{"prompt":"Which organism most likely has a type III survivorship curve?","options":[{"t":"Humans","why":"Most people survive to old age: type I.","_n":"2457a","_k":"7971c70a"},{"t":"American robins","why":"A roughly constant risk at every age: type II.","_n":"2558a","_k":"cd492f7c"},{"t":"Atlantic cod, which releases millions of eggs and gives no care","why":"Huge early losses.","_n":"2659a","_k":"ee112bcd"},{"t":"Black bears","why":"Few cubs and long care: type I.","_n":"27eac","_k":"c0d29b11"}]},"b":{"prompt":"Which organism most likely has a type I survivorship curve?","options":[{"t":"African elephants, which raise one calf at a time for years","why":"Most survive to old age.","_n":"28e9c","_k":"df4c535d"},{"t":"Oysters","why":"Type III. Type III: huge early losses, so few young survive (cod, maple seeds). Type I: most live to old age (humans, bears).","_n":"29ecc","_k":"dc0286d1"},{"t":"Sugar maple seeds","why":"Almost all die young: type III.","_n":"2aebc","_k":"6b0901f8"},{"t":"American robins","why":"Type II.","_n":"2be6c","_k":"2d1193e3"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which is a density-independent limiting factor?","options":[{"t":"Competition for nest sites","why":"Ask: would this hit harder if the population were more crowded? A blizzard doesn’t care; a disease does.","_n":"2ce5c","_k":"1871fd29"},{"t":"A disease spreading through a crowded herd","why":"Ask: would this hit harder if the population were more crowded? A blizzard doesn’t care; a disease does.","_n":"2de8c","_k":"f9eaf5ff"},{"t":"An early autumn blizzard","why":"It kills the same fraction however crowded the population is.","_n":"2ee7c","_k":"e209b086"},{"t":"Predators catching more prey when prey are common","why":"Ask: would this hit harder if the population were more crowded? A blizzard doesn’t care; a disease does.","_n":"2fe2c","_k":"a6da0e13"}]},"b":{"prompt":"Which is a density-dependent limiting factor?","options":[{"t":"Parasites spreading faster in a crowded colony","why":"Crowding helps transmission.","_n":"2ge1c","_k":"65e3019e"},{"t":"A forest fire","why":"Ask: would this hit harder if the population were more crowded? A blizzard doesn’t care; a disease does.","_n":"2h64c","_k":"d202a3ea"},{"t":"A summer drought","why":"Ask: would this hit harder if the population were more crowded? A blizzard doesn’t care; a disease does.","_n":"2i65c","_k":"3456dfbe"},{"t":"A volcanic eruption","why":"Ask: would this hit harder if the population were more crowded? A blizzard doesn’t care; a disease does.","_n":"2j62c","_k":"6209fec6"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A population grows logistically with `K` = 1200 and `r` = 0.5. At what size does it add the most individuals per year, and how many?","options":[{"t":"`N` = 600; 150 per year","why":"0.5 × 600 × 600/1200 = 150.","_n":"2k63c","_k":"23e31685"},{"t":"`N` = 300; 112.5 per year","why":"That’s the gain at 300; it’s larger at 600.","_n":"2l68c","_k":"ba7a99a2"},{"t":"`N` = 1200; 600 per year","why":"At `K` the gain is 0.","_n":"2m69c","_k":"2e618cbe"},{"t":"`N` = 600; 300 per year","why":"That’s `rN`; it leaves out (`K − N`)/`K` = 1/2.","_n":"2n66c","_k":"b0653b96"}]},"b":{"prompt":"`K` = 800, `r` = 0.4. At what size is the gain largest, and how many?","options":[{"t":"`N` = 200; 60 per year","why":"Growth is smaller before the halfway point.","_n":"2o67c","_k":"61d53f5a"},{"t":"`N` = 400; 160 per year","why":"`rN` without the crowding factor.","_n":"2p5cc","_k":"4ae8b974"},{"t":"`N` = 400; 80 per year","why":"0.4 × 400 × 400/800 = 80.","_n":"2q5dc","_k":"685f0b65"},{"t":"`N` = 800; 320 per year","why":"At `K`, births equal deaths, so growth is 0. Growth is fastest at `K/2`, where there are many parents and still plenty of room.","_n":"2rbfd","_k":"a6071fff"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"A lake’s loon population is 200. In one year 30 chicks join it, 18 loons die, 6 arrive and 8 leave. Assuming `r` stays the same, what is `r`, and about how many loons will there be 2 years later?","options":[{"t":"`r` = 0.31; about 343","why":"Deaths and departures subtract.","_n":"2sc0d","_k":"580a8077"},{"t":"`r` = 0.06; about 225","why":"That leaves out migration.","_n":"2tbdd","_k":"14dc8ceb"},{"t":"`r` = 0.05; exactly 220","why":"That adds 10 each year; the second year adds 10.5.","_n":"2ubed","_k":"e4c43d97"},{"t":"`r` = 0.05; about 221","why":"(30 + 6 − 18 − 8)/200 = 0.05; 200 × 1.05 × 1.05 = 220.5.","_n":"2vbbd","_k":"a8ed9b8c"}]},"b":{"prompt":"A heron colony of 400 has 60 young join, 32 die, 4 arrive and 12 leave in a year. With the same `r`, what is `r`, and about how many herons will there be 2 years later?","options":[{"t":"`r` = 0.07; about 458","why":"Change = (births + immigrants) − (deaths + emigrants). All four count.","_n":"2wbcd","_k":"9611635b"},{"t":"`r` = 0.05; 440","why":"`r` is per individual. 0.05 of a bigger population is a bigger number, so the additions grow.","_n":"2xb9d","_k":"c337b3b2"},{"t":"`r` = 0.05; about 441","why":"(60 + 4 − 32 − 12)/400 = 0.05; 400 × 1.05² = 441.","_n":"2ybad","_k":"2e034014"},{"t":"`r` = 0.27; about 645","why":"Deaths and departures subtract.","_n":"2zc7d","_k":"4ced9619"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Biologists mark 60 bats with paint, but some paint wears off before the second capture. They catch 50 bats and see paint on 6, so they estimate 60 × 50 ÷ 6 = 500. How does the true population compare with 500?","options":[{"t":"It’s larger than 500, because fewer marks were seen","why":"Fewer recaptures inflate the estimate.","_n":"30c8d","_k":"f4796a8b"},{"t":"It can’t be compared, because the formula no longer applies","why":"You can still say which way the error goes.","_n":"31c5d","_k":"aa9e8237"},{"t":"It’s smaller than 500: lost marks make `m` too small, so the estimate is too big","why":"`N = M × n ÷ m`. If marked animals are under-counted in the second sample, `m` is too small, so `N` comes out too big.","_n":"32c4d","_k":"1feb2e66"},{"t":"It’s exactly 500: the formula accounts for lost marks","why":"The formula assumes marks stay on.","_n":"33c7d","_k":"65b32723"}]},"b":{"prompt":"40 hares are marked, but marked hares become trap-shy. A second sample of 30 includes 4 marked hares, giving 40 × 30 ÷ 4 = 300. How does the true population compare with 300?","options":[{"t":"It’s exactly 300","why":"Trap-shyness breaks an assumption.","_n":"34c6d","_k":"80988c99"},{"t":"It can’t be compared","why":"The direction of the error can be reasoned out.","_n":"35c9d","_k":"b4cfb4a7"},{"t":"It’s larger than 300","why":"`N = M × n ÷ m`. If marked animals are under-counted in the second sample, `m` is too small, so `N` comes out too big.","_n":"36c8d","_k":"33bb0441"},{"t":"It’s smaller than 300: trap-shy hares make `m` too small, so the estimate is too big","why":"`N = M × n ÷ m`. If marked animals are under-counted in the second sample, `m` is too small, so `N` comes out too big.","_n":"37cbd","_k":"60df78fd"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why logistic growth levels off at carrying capacity?","options":[{"t":"“`K` is the most young a female can produce in her lifetime.”","why":"`K` is a property of the habitat, not of one animal.","_n":"38cad","_k":"a6daf5f2"},{"t":"“Individuals stop reproducing once the population reaches `K`.”","why":"At `K`, individuals are still born and still die, in equal numbers. It’s a balance, not a freeze.","_n":"39bdd","_k":"fa08f2b9"},{"t":"“The growth rate `r` drops to zero because the animals get older.”","why":"Ageing isn’t the cause; crowding is.","_n":"3abcd","_k":"cec1740e"},{"t":"“As `N` nears `K`, each individual gets fewer resources, so births per individual fall and deaths rise until they’re equal; the population then stays near `K`.”","why":"It names the cause (fewer resources each), what changes (births and deaths per individual) and the balance at `K`.","_n":"3b33d","_k":"00050c49"}]},"b":{"prompt":"Which is the best explanation of why an exponentially growing population adds more individuals each year even though `r` stays the same?","options":[{"t":"“The birth rate rises because the animals get more food each year.”","why":"`r` is constant in this model.","_n":"3c34d","_k":"6d1a9ac0"},{"t":"“Deaths stop when the population is growing.”","why":"Deaths still happen; `r` is a net rate.","_n":"3d35d","_k":"6e32ce12"},{"t":"“Each year’s gain is a fixed fraction of the current size, and the new individuals also reproduce, so the same fraction of a bigger number is bigger.”","why":"It ties the growing gain to the growing population, with `r` fixed.","_n":"3e36d","_k":"4af27d5b"},{"t":"“`r` increases every year.”","why":"`r` is per individual. 0.05 of a bigger population is a bigger number, so the additions grow.","_n":"3f37d","_k":"3d996b16"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Choose the words that best complete: ‘In winter, moose gather where willow browse is dense, leaving other areas empty. This is a ____ distribution, most likely caused by ____.’","options":[{"t":"clumped; patchy food","why":"The moose gather where the food is.","_n":"3g38d","_k":"22cc076b"},{"t":"random; patchy food","why":"Random means no pattern; this one follows the food.","_n":"3h39d","_k":"78015eca"},{"t":"uniform; patchy food","why":"Uniform means evenly spaced.","_n":"3i3ad","_k":"3c1a408b"},{"t":"clumped; animals spacing themselves apart","why":"Spacing apart produces a uniform pattern.","_n":"3j3bd","_k":"8b455c97"}]},"b":{"prompt":"‘Male red-winged blackbirds defend territories of similar size along a marsh edge. This is a ____ distribution, most likely caused by ____.’","options":[{"t":"clumped; territorial behaviour","why":"Territories push birds apart, not together.","_n":"3k3cd","_k":"c85f87ff"},{"t":"random; territorial behaviour","why":"Defending territories creates a pattern.","_n":"3lb9d","_k":"fa00f07d"},{"t":"uniform; territorial behaviour","why":"Defended territories of similar size space the birds evenly.","_n":"3mb8d","_k":"3967366e"},{"t":"uniform; patchy food","why":"Patchy food would clump them.","_n":"3nb7d","_k":"5d08bed9"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"Zebra mussels in a lake grow about 35% per year. By the rule of 70, about how long does the population take to double, and about how many times larger is it after 8 years?","options":[{"t":"About 200 years; barely larger","why":"Use 35, not 0.35.","_n":"3ob6d","_k":"4fd198ad"},{"t":"About 2 years; about 8 times","why":"4 doublings multiply by 2 four times.","_n":"3pbdd","_k":"6effb5c4"},{"t":"About 2 years; about 4 times","why":"That counts the doublings instead of multiplying.","_n":"3qbcd","_k":"2864ef3e"},{"t":"About 2 years; about 16 times","why":"70 ÷ 35 = 2; 8 years = 4 doublings = 2 × 2 × 2 × 2.","_n":"3rbbd","_k":"e4a22d4b"}]},"b":{"prompt":"An invasive fish grows about 10% per year. About how long does it take to double, and how many times larger is it after 21 years?","options":[{"t":"About 7 years; about 8 times","why":"70 ÷ 10 = 7; 21 years = 3 doublings = 2³.","_n":"3sbad","_k":"a77b1831"},{"t":"About 700 years; barely larger","why":"Use 10, not 0.10.","_n":"3tc1d","_k":"282df9f6"},{"t":"About 7 years; about 3 times","why":"That counts doublings.","_n":"3uc0d","_k":"cda4d0e6"},{"t":"About 7 years; about 6 times","why":"3 doublings multiply by 2 three times. `r` is per individual. 0.05 of a bigger population is a bigger number, so the additions grow.","_n":"3v37e","_k":"e3061a49"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A lake trout population grows logistically with `K` = 6000 and `r` = 0.4. Managers want the largest catch they can take every year forever, taking exactly what the population adds each year. At what population should they hold the stock, and how many fish per year can they take?","options":[{"t":"3000 fish; 600 per year","why":"The gain is largest at `K/2`: 0.4 × 3000 × 3000/6000 = 600.","_n":"3w38e","_k":"7acc64c0"},{"t":"6000 fish; 2400 per year","why":"At `K` the population adds nothing.","_n":"3x35e","_k":"77368c59"},{"t":"3000 fish; 1200 per year","why":"That’s `rN` without the crowding factor.","_n":"3y36e","_k":"e7497807"},{"t":"1500 fish; 450 per year","why":"A smaller stock adds less: 0.4 × 1500 × 4500/6000 = 450.","_n":"3z3be","_k":"d72bf7bc"}]},"b":{"prompt":"A whitefish population has `K` = 9000 and `r` = 0.2. At what size should it be held for the largest sustainable catch, and how big is that catch?","options":[{"t":"3000 fish; 400 per year","why":"0.2 × 3000 × 6000/9000 = 400: less than at 4500.","_n":"403ce","_k":"d88165e6"},{"t":"4500 fish; 900 per year","why":"`rN` without crowding.","_n":"4139e","_k":"7f5d010d"},{"t":"9000 fish; 1800 per year","why":"At `K`, births equal deaths, so growth is 0. Growth is fastest at `K/2`, where there are many parents and still plenty of room.","_n":"423ae","_k":"c9dcd87a"},{"t":"4500 fish; 450 per year","why":"0.2 × 4500 × 4500/9000.","_n":"433fe","_k":"f25b80eb"}]}}]},"task":{"title":"Plan a reintroduction","summary":"Plan a reintroduction","statement":"\u003cp>Swift foxes are being returned to a prairie reserve (model numbers). Choose how many to release, the support plan (which sets the growth rate) and the release site (which sets the carrying capacity) so the plan meets every condition. Can you find all the plans that work?\u003c/p>\u003col class=\"po-conds\">\u003cli>Release no more than 30 foxes (budget).\u003c/li>\u003cli>The population gains at least 15 foxes in year 1.\u003c/li>\u003cli>There are at least 200 foxes by year 5.\u003c/li>\u003cli>The site’s carrying capacity is 400 or less (larger sites overlap ranchland).\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">The growth rates and capacities here are invented. Real swift fox reintroductions on the Canadian prairies began in the 1980s.\u003c/p>","inputs":{"n0":"Foxes released","r":"Support plan","K":"Release site"},"plans":["Plan 1","Plan 2","Plan 3","Plan 4","Plan 5"],"sites":["Site A","Site B","Site C","Site D","Site E"],"modelNote":"Logistic model, yearly steps: `N_{t+1} = N_t + rN_t(K - N_t)/K`.","checks":["Release at most 30","Year-1 gain at least 15","At least 200 by year 5","Site `K` ≤ 400"],"tips":["Your budget covers 30 foxes at most.","The first-year gain is `rN_0(K - N_0)/K`. A faster growth rate or more founders raises it.","`N` can never pass `K`, so a site with `K` = 200 can’t reach 200 by year 5. Pick a larger site or a faster rate.","Sites with `K` above 400 aren’t available."],"success":"Your plan works!","explainPrompt":"Explain how you balanced the number released against the growth rate, and why the site’s carrying capacity matters even in the first five years.","vocab":"Use the words carrying capacity, per-capita growth rate, logistic and founders.","after3":"Notice the trade-off: with fewer founders you need a faster growth rate. Every plan needs `K` of at least 300, because a population can’t pass its carrying capacity."},"cards":[["Population density","Number of individuals ÷ area. 900 in 2 ha = 450 per ha."],["Four ways a population changes","Births and immigration add; deaths and emigration remove."],["Per-capita growth rate `r`","(births + immigrants − deaths − emigrants) ÷ `N`."],["Exponential growth","Constant `r`; each year adds more than the last; J-curve."],["Logistic growth","Gain = `rN(K - N)/K`; S-curve; fastest at `K/2`; zero at `K`."],["Carrying capacity `K`","The largest population a habitat can support over time; births = deaths there."],[
