*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}

:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 10: energy landscape (Plot canvas), ΔG bars, energy-accounting ledger (S3), enzyme stations (SVG), ΔG calculator, task.
   Roles: reaction --pen; uncatalysed hill --ink-2 dashed; ATP --bio-atp (ADP and Pᵢ in --ink-2); carbon compounds (glucose,
   substrate, pathway A–D) --bio-carbon; enzyme outlines --ink-2; competitive inhibitor --f3; allosteric inhibitor --acol;
   heat bar --ink-2 fill with an orange (--p-k) outline and the word "heat". */
:root{--ez-enzf:color-mix(in srgb,var(--ink-2) 12%,var(--sheet))}

/* hero equation */
.em-heq .em-hdg{display:block;font-size:.78em;margin-top:.2em;color:var(--ink-2)}
.em-c-atp{color:var(--bio-atp);font-weight:700}

/* radio groups (from SBI4U 06 / 01 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips.em-rxc button{border-radius:8px;text-align:left;line-height:1.3}

/* stepper */
.em-step{display:inline-flex;align-items:center;gap:6px}
.em-stb{min-width:40px;min-height:40px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:1.15rem;font-weight:700;line-height:1}
.em-stb:disabled{opacity:.4;cursor:default}
.em-sto{padding:0 .5em;text-align:center;font-weight:700}

/* explore layout */
.em-pg [hidden]{display:none!important}
.em-pg .pg-ctrl{display:grid;gap:12px}
.em-panel{display:grid;gap:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.em-pnote,.em-note{margin:0}
.em-note{margin-top:10px}
.em-runrow{margin:0}
.em-sl{margin:0}

.em-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.em-legend span{display:inline-flex;align-items:center;gap:5px}

.em-lg-pen{stroke:var(--pen);stroke-width:3}
.em-lg-unc{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 4}
.em-lg-atp{stroke:var(--bio-atp);stroke-width:3}
.em-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.em-more{display:none;margin-top:6px}
@media (max-width:640px){
  .em-more{display:inline-flex}

/* ΔG bars */
.em-bars{margin-top:10px;display:grid;gap:6px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.em-brow{display:grid;grid-template-columns:76px minmax(0,1fr) 52px;align-items:center;gap:8px;font-size:.88rem}
.em-bl{font-weight:700}

.em-bz{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.em-bf{position:absolute;top:2px;bottom:2px;border-radius:2px}

.em-batp{background:var(--bio-atp)}
.em-bnet{background:var(--ink)}
.em-bv{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.em-bsc{margin:0}

/* energy accounting (S3 ledger) */
.em-acct{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--sheet);display:grid;gap:10px}
.em-ah{margin:0;font-weight:700}

.em-arow b{text-align:right;font-variant-numeric:tabular-nums}
.em-al{font-size:.9rem;font-weight:700}
.em-at{position:relative;height:26px;background:var(--paper);border-radius:4px}
.em-af{position:absolute;left:0;top:0;bottom:0;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.em-fin{background:var(--ink)}
.em-fuse{background:var(--pen)}
.em-fheat{background:var(--ink-2);box-shadow:inset 0 0 0 3px var(--p-k)}
.em-fheat span{color:var(--sheet);font-weight:700;font-size:.82rem}
.em-typ{position:absolute;top:-5px;bottom:-5px;border:2px solid var(--ink);border-radius:3px;background:transparent;min-width:4px}
.em-typl{margin:0}
.em-typk{display:inline-block;width:12px;height:12px;border:2px solid var(--ink);border-radius:3px;vertical-align:-2px}
.em-laws{border-top:1px solid var(--rule);padding-top:8px;display:grid;gap:4px;font-size:.92rem}
.em-laws p{margin:0}
.em-ok{color:var(--green);font-weight:700}
.em-blk{color:var(--red);font-weight:700}

/* final check data tables */
.em-qt{border-collapse:collapse;margin:8px 0;font-size:.95rem}
.em-qt th,.em-qt td{border:1px solid var(--rule);padding:4px 14px;text-align:center}
.em-qt thead th{background:var(--paper)}

.em-sortx{display:block;margin-top:4px;font-weight:400}

.ez-p3{display:grid;gap:26px}

.ez-gwrap{min-width:0}
.ez-leg2{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}

.ez-k-comp{background:var(--f3)}
.ez-k-allo{background:var(--acol)}
.ez-data{margin-top:12px}

.ez-tbl{border-collapse:collapse;width:100%;min-width:340px;font-size:.92rem;font-variant-numeric:tabular-nums}

.ez-tbl tr.on th,.ez-tbl tr.on td{background:var(--hi-soft);font-weight:700}
.ez-key{margin:10px 0 0}

.ez-ft{display:block;height:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.ez-ft i{display:block;height:100%;background:var(--ink)}

/* Part 3 SVG */
.ez-bg{fill:var(--sheet)}
.ez-enz{fill:var(--ez-enzf);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.ez-sub{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1.2;stroke-linejoin:round}
.ez-comp{fill:var(--f3);stroke:var(--sheet);stroke-width:1.2;stroke-linejoin:round}

:"electron-transport-chain","title":"The Electron Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"e308b3cb","content":{"id":"10-introduction-to-metabolism","kind":"topic","title":"Introduction to metabolism","topic":"Introduction to Metabolism","readyTopic":"the introduction to metabolism","hero":{"eq":"\u003cspan class=\"em-heq\">\u003cspan class=\"bio-chem\">\u003cspan class=\"em-c-atp\">ATP\u003c/span> + H₂O → ADP + Pᵢ\u003c/span> \u003cspan class=\"em-hdg\">ΔG ≈ −30.5 kJ/mol\u003c/span>\u003c/span>","eqLabel":"ATP plus water gives ADP plus inorganic phosphate. Delta G is about minus 30.5 kilojoules per mole.","eqSize":"sm","headline":"Every reaction in you runs downhill, or gets pushed.","text":"Your cells run thousands of reactions a second. Together they are your \u003cstrong>metabolism\u003c/strong>. \u003cstrong>Catabolic\u003c/strong> reactions break molecules down and release free energy; \u003cstrong>anabolic\u003c/strong> reactions build molecules and need it. The free-energy change, \u003cstrong>ΔG\u003c/strong>, tells you which is which. \u003cstrong>Enzymes\u003c/strong> decide how fast it all happens.","fig":{"aria":"An energy diagram. Glucose sits high on the left, CO₂ and water sit lower on the right, and a tall hill stands between them. An enzyme arrives and lowers the hill to a third of its height; the glucose rolls over and down. The ΔG bracket on the right stays the same size.","shape":"wide"}},"goals":["I can tell catabolic from anabolic reactions and give examples of each.","I can use the sign of ΔG to decide whether a reaction is exergonic or endergonic.","I can explain how coupling to ATP hydrolysis drives an endergonic reaction, and calculate the net ΔG.","I can explain how an enzyme speeds a reaction by lowering activation energy, without changing ΔG.","I can tell competitive from allosteric inhibition from a description or from rate data, and explain feedback inhibition.","I can use the first and second laws of thermodynamics to explain why cells lose energy as heat."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Energy in reactions","goal":1,"prompt":"Which reaction releases energy to the surroundings?","options":[{"t":"Charging a phone battery","why":"Charging stores energy; it takes energy in.","_n":"0797","_k":"6d5025c4"},{"t":"Melting ice","why":"Melting absorbs heat from the surroundings.","_n":"1787","_k":"d31fb8cc"},{"t":"Burning wood","why":"Combustion is exothermic: energy flows out as heat and light.","_n":"2777","_k":"401231cf"},{"t":"Building a protein from amino acids","why":"Building large molecules takes energy in.","_n":"3767","_k":"00019f64"}],"hints":["Does the surroundings’ temperature go up or down?","Exothermic: heat flows out.","Burning wood."]},{"id":"w2","skill":"Energy in reactions","goal":2,"prompt":"On an energy diagram, the products sit \u003cstrong>higher\u003c/strong> than the reactants. The reaction is…","options":[{"t":"exothermic: energy is released","why":"Higher products means energy was added.","_n":"4757","_k":"a2584fec"},{"t":"fast","why":"Height difference says nothing about speed.","_n":"5747","_k":"1bd32c44"},{"t":"impossible","why":"It can happen if energy is supplied.","_n":"6737","_k":"2ffb7e54"},{"t":"endothermic: energy is absorbed","why":"Products hold more energy than reactants, so energy had to go in.","_n":"7827","_k":"8f8fdbfa"}],"hints":["Compare the heights of the reactants and products.","The products are higher.","Energy was absorbed: endothermic."]},{"id":"w3","skill":"Bonds and molecules","goal":1,"prompt":"Hydrolysis of a dipeptide gives…","options":[{"t":"a tripeptide and water","why":"That builds a bigger molecule and releases water.","_n":"8817","_k":"546c8ba9"},{"t":"two amino acids and a water molecule released","why":"Water is used, not released.","_n":"983a","_k":"d6ebcdf4"},{"t":"two amino acids, using one water molecule","why":"Hydro- (water) + -lysis (splitting): water breaks the peptide bond.","_n":"a84a","_k":"a208de78"},{"t":"glucose","why":"Peptides are made of amino acids, not sugars.","_n":"b81a","_k":"b23bcb21"}],"hints":["What does hydro- mean?","Water is added to break a bond.","Two amino acids."]},{"id":"w4","skill":"Bonds and molecules","goal":3,"prompt":"ATP stands for…","options":[{"t":"amino triphosphate","why":"Adenosine is adenine (a base) plus ribose (a sugar).","_n":"c82a","_k":"5272611f"},{"t":"adenosine triphosphate","why":"Adenine + ribose + three phosphate groups.","_n":"d87a","_k":"72f3bcbe"},{"t":"adenosine diphosphate","why":"Di- means two: that’s ADP.","_n":"e88a","_k":"2e76f163"},{"t":"adenosine triprotein","why":"There’s no protein in ATP.","_n":"f85a","_k":"91003ab1"}],"hints":["Tri- means three.","Three phosphate groups.","Adenosine triphosphate."]},{"id":"w5","skill":"Proteins and shape","goal":4,"prompt":"Why does a protein’s shape matter?","options":[{"t":"Its function depends on its 3D shape","why":"An enzyme’s active site only fits substrates of the right shape.","_n":"g86a","_k":"f2f09d4c"},{"t":"Shape changes the amino-acid sequence","why":"The sequence decides the shape, not the other way round.","_n":"h8ba","_k":"45864c6c"},{"t":"Shape only affects its colour","why":"Shape determines what a protein binds.","_n":"i8ca","_k":"816687d4"},{"t":"All proteins have the same shape","why":"Different amino-acid sequences fold into different shapes.","_n":"j9da","_k":"5c3940eb"}],"hints":["Think about a lock and key.","Binding needs a matching shape.","Function depends on shape."]},{"id":"w6","skill":"Proteins and shape","goal":5,"prompt":"A protein is heated to 70 °C and stops working. Most likely…","options":[{"t":"it became a carbohydrate","why":"Heat doesn’t change what kind of molecule it is.","_n":"k9ca","_k":"02dc85dd"},{"t":"its amino acids were destroyed","why":"The sequence (covalent peptide bonds) usually stays intact; the folding is lost.","_n":"l9ba","_k":"c68065df"},{"t":"it worked faster and ran out","why":"Above its optimum, an enzyme slows and stops.","_n":"m9aa","_k":"9d8ba6bd"},{"t":"it denatured: its shape changed","why":"Heat breaks the weak bonds that hold the folded shape.","_n":"n99a","_k":"e2576b19"}],"hints":["What holds a protein’s 3D shape?","Weak bonds break with heat.","Denatured."]}],"refreshers":{"Energy in reactions":"Exothermic: energy out (products lower). Endothermic: energy in (products higher). Example: burning releases energy; photosynthesis absorbs it.","Bonds and molecules":"Condensation joins molecules and releases water; hydrolysis uses water to split them. ATP is adenine + ribose + three phosphates.","Proteins and shape":"A protein’s amino-acid sequence decides how it folds, and its folded shape decides its job. Heat or the wrong pH can unfold (denature) it."}}},"explore":{"heading":"Energy landscape","intro":"Pick a reaction and watch the ball try to cross the hill. Add an enzyme, or couple the reaction to ATP, and see what changes and what doesn’t.","modelNote":"Every activation energy, and ΔG for R3–R6, is a model value. Only −30.5 kJ/mol (ATP) and −2870 kJ/mol (glucose) are standard course values.","reactions":[{"id":"R1","t":"Glucose + 6O₂ → 6CO₂ + 6H₂O","rl":"glucose + 6O₂","pl":"6CO₂ + 6H₂O","dg":-2870,"ea":200,"eaE":40,"steps":8,"cat":true,"dgModel":false},{"id":"R2","t":"ATP + H₂O → ADP + Pᵢ","rl":"ATP + H₂O","pl":"ADP + Pᵢ","dg":-30.5,"ea":120,"eaE":50,"cat":true,"dgModel":false},{"id":"R3","t":"Sucrose + H₂O → glucose + fructose","rl":"sucrose + H₂O","pl":"glucose + fructose","dg":-29,"ea":110,"eaE":45,"cat":true,"dgModel":true},{"id":"R4","t":"Glucose + fructose → sucrose + H₂O","rl":"glucose + fructose","pl":"sucrose + H₂O","dg":29,"ea":110,"eaE":45,"cat":false,"dgModel":true,"couple":true},{"id":"R5","t":"Glutamate + NH₃ → glutamine + H₂O","rl":"glutamate + NH₃","pl":"glutamine + H₂O","dg":14,"ea":90,"eaE":35,"cat":false,"dgModel":true,"couple":true},{"id":"R6","t":"“Reaction X” (an anabolic step)","rl":"reactants","pl":"products","dg":40,"ea":100,"eaE":40,"cat":false,"dgModel":true,"couple":true}],"conversions":[{"id":"B1","t":"Glucose → ATP in a muscle cell","lo":34,"hi":38,"typ":"≈ 34–38%"},{"id":"B2","t":"Light → sugar in a leaf","lo":1,"hi":2,"typ":"≈ 1–2% of sunlight striking the leaf"},{"id":"B3","t":"ATP → muscle movement","lo":25,"hi":25,"typ":"≈ 25%"}],"blocked":"No real conversion reaches 100%: the second law.","blockedRow":"Blocked: some energy is always released as heat","runMsg":{"back":"Uphill: the ball climbs part way and rolls back. With net ΔG above zero, the reaction can’t proceed on its own.","stuck":"Downhill overall… but the hill is in the way. Almost no reaction.","slow":"Downhill, and the hill is medium-sized: it crosses, but slowly.","fast":"Downhill with a low hill: it crosses quickly."},"predIntro":"Make a prediction first. Then the energy landscape will show you what really happens.","predictions":[{"id":"p1","prompt":"Glucose has a ΔG of −2870 kJ/mol when it’s oxidized. What happens when you press Run without enzymes?","options":[{"t":"The ball can’t get over the hill: almost no reaction","_n":"o98a","_k":"ecdd263d"},{"t":"It explodes","_n":"p97a","_k":"6ce55aa2"},{"t":"It crosses quickly because ΔG is so negative","_n":"q96a","_k":"b9e2ce9e"},{"t":"It crosses, then rolls back","_n":"r95a","_k":"777e3f96"}],"explain":"A big negative ΔG means lots of energy \u003cem>can\u003c/em> be released, but the activation energy is high. Sugar in a bowl doesn’t burst into flame.","start":{"r":"R1","enz":false,"n":0},"act":"run"},{"id":"p2","prompt":"R3, toggle the enzyme on. What will the enzyme change?","options":[{"t":"Only the height of the hill","_n":"s94a","_k":"a7d0aa45"},{"t":"Neither","_n":"t97a","_k":"8d6db886"},{"t":"Both the hill and ΔG","_n":"u98a","_k":"40aefef0"},{"t":"Only ΔG","_n":"v99a","_k":"d2074f5e"}],"explain":"Enzymes lower activation energy. The reactants and products are the same, so ΔG is the same.","start":{"r":"R3","enz":false,"n":0},"act":"enzyme"},{"id":"p3","prompt":"R5, enzyme on, 0 ATP, Run. Will the reaction proceed?","options":[{"t":"Yes: the enzyme makes it go","_n":"w9aa","_k":"bbd586a7"},{"t":"No: it’s uphill (ΔG = +14)","_n":"x93a","_k":"2febf7d9"},{"t":"Only backwards","_n":"y94a","_k":"404ba5e0"},{"t":"Yes, but slowly","_n":"z95a","_k":"1fe1ab9e"}],"explain":"An enzyme can’t push a reaction uphill. Something has to supply energy.","start":{"r":"R5","enz":true,"n":0},"act":"run"},{"id":"p4","prompt":"Now set 1 ATP. Net ΔG becomes…","options":[{"t":"−30.5 kJ/mol","_n":"1096a","_k":"88aa294e"},{"t":"−16.5 kJ/mol","_n":"118fa","_k":"ee0abf93"},{"t":"+14 kJ/mol","_n":"1290a","_k":"58f0053e"},{"t":"+44.5 kJ/mol","_n":"1311a","_k":"5b036212"}],"explain":"Coupled reactions add: +14 + (−30.5) = −16.5.","start":{"r":"R5","enz":true,"n":0},"act":"atp"}],"challenges":[{"id":"tc1","goal":3,"prompt":"Make R5 proceed on its own, using the fewest ATP.","why":"+14 + (−30.5) = −16.5 kJ/mol, which is below zero, so one ATP is enough.","general":"Choose R5, then set the number of ATP so the net ΔG is just below zero.","named":{"mode":"Switch to Mode A (Landscape) first.","rx":"Choose R5 (glutamate + NH₃ → glutamine + H₂O) first.","spare":"It proceeds, but one ATP was already enough. Cells don’t waste ATP.","enz0":"The enzyme only lowers the hill; ΔG is still +14.","zero":"ΔG is still +14 kJ/mol: uphill. Something has to supply energy."},"hints":["What must the sign of the net ΔG be?","Each ATP adds −30.5 kJ/mol.","+14 − 30.5 = −16.5 &lt; 0. One ATP is enough."]},{"id":"tc2","goal":[3,4],"prompt":"Make R6 (Reaction X) both possible \u003cstrong>and\u003c/strong> fast.","why":"2 ATP: +40 − 61 = −21 kJ/mol, so it can proceed; the enzyme lowers the hill to 40 kJ/mol, so it’s fast.","general":"Choose R6. Then fix two separate problems: the sign of the net ΔG and the height of the hill.","named":{"mode":"Switch to Mode A (Landscape) first.","rx":"Choose R6 (Reaction X) first.","n1":"+40 − 30.5 = +9.5: still uphill.","noEnz":"It’s downhill now, but the hill is 100 kJ/mol: very slow.","n3":"Possible and fast, but one ATP is wasted. Try 2.","zero":"+40 kJ/mol is uphill, and an enzyme lowers only the hill. Something has to supply energy."},"hints":["Two separate problems: the sign of ΔG and the height of the hill.","One ATP gives +9.5. How many make it negative?","2 ATP: +40 − 61 = −21 kJ/mol; then switch the enzyme on."]},{"id":"tc3","goal":6,"stretch":true,"prompt":"Mode B, conversion B1. Set the useful output to the textbook value for respiration (36 ATP × 30.5 kJ/mol out of 2870 kJ/mol), rounded to the nearest 5.\u003cp class=\"uses\">\u003cstrong>Use these values\u003c/strong>36 × 30.5 = 1098; 1098 ÷ 2870 ≈ 0.38.\u003c/p>","why":"36 × 30.5 = 1098 kJ/mol, and 1098 ÷ 2870 ≈ 0.38: 38%, which rounds to 40. The rest, about 62%, is released as heat.","general":"Useful energy = 36 × 30.5 = 1098 kJ/mol out of 2870 kJ/mol. What percentage is that, to the nearest 5?","named":{"mode":"Switch to Mode B (Energy accounting) first.","conv":"Choose conversion B1 (glucose → ATP in a muscle cell).","blocked":"Blocked: no real conversion reaches 100%. Some energy is always released as heat (the second law).","u35":"38% is closer to 40 than to 35.","u30":"That’s closer to the current estimate with about 30 ATP: 30 × 30.5 = 915, ≈ 32%. The question asks for the textbook 36."},"hints":["Useful energy = number of ATP × 30.5 kJ/mol.","36 × 30.5 = 1098 kJ/mol.","1098 ÷ 2870 ≈ 0.38, so 38%, which rounds to 40 on the slider. The rest, about 62%, is heat."]}]},"part3":{"slug":"enzymes","name":"Enzymes","heading":"Enzymes and their control","intro":"Explore showed \u003cem>what\u003c/em> an enzyme does to energy. Here you zoom in to \u003cem>how\u003c/em>: the active site, inhibitors, and the control of whole pathways. Station 2 swaps the energy diagram for a rate graph, so you read and generate rate data.","st1":{"title":"Station 1: Zoom to the molecules (the active site)","how":"Step through one turn of an enzyme. Switch between the induced-fit model and the older lock-and-key model, then move the temperature and pH away from the optimum and step through again.","steps":["The substrate approaches.","The active site changes shape slightly to grip it (induced fit).","The enzyme–substrate complex forms.","The bonds strain, and the products leave.","The enzyme is unchanged and ready again."],"short":["substrate approaches","induced fit","complex forms","products leave","enzyme ready again"],"lock":"Lock and key (the older model): the active site already has exactly the substrate’s shape, like a lock for a key. Nothing changes shape as it binds.","denat":"The active site has lost its shape (the enzyme is denatured), so the substrate can’t bind and no enzyme–substrate complex forms.","poor":"The active site is distorted, so the substrate fits poorly and the rate drops.","note":"Model enzyme from the human body: optimum 37 °C and pH 7; it denatures above about 45 °C."},"st2":{"title":"Station 2: Check it with data (inhibitors)","how":"Move the substrate concentration (the independent variable) and read the rate (the dependent variable) for the enzyme alone, with a competitive inhibitor, and with an allosteric inhibitor.","curves":"Model curves: no inhibitor, rate = 100\u003ci>S\u003c/i> ÷ (2 + \u003ci>S\u003c/i>); competitive, rate = 100\u003ci>S\u003c/i> ÷ (6 + \u003ci>S\u003c/i>); allosteric, rate = 50\u003ci>S\u003c/i> ÷ (2 + \u003ci>S\u003c/i>). Rates in model units; \u003ci>S\u003c/i> in mM.","key":"At low substrate both inhibitors look the same. Add lots of substrate and the competitive inhibitor is out-competed, but the allosteric one isn’t.","comp":"Competitive inhibitor: it looks like the substrate and sits in the active site.","allo":"Allosteric inhibitor: it binds a second site and bends the active site shut."},"st3":{"title":"Station 3: Feedback inhibition","how":"Raise the amount of the end product D. D binds the allosteric site of enzyme 1, the first enzyme of the pathway.","example":"Real example: high ATP inhibits phosphofructokinase, an early enzyme of glycolysis (module 14)."},"quickCheck":{"title":"Quick check","summary":"Enzymes and their control quick check","items":[{"id":"q1","goal":5,"prompt":"Adding much more substrate restores the full rate. The inhibitor is…","choices":[{"t":"competitive","fb":"Only a competitor for the active site can be out-numbered by substrate.","_n":"1410a","_k":"2ae4afd3"},{"t":"a denatured enzyme","fb":"Only a competitor for the active site can be out-numbered by substrate.","_n":"1513a","_k":"f2da6942"},{"t":"an activator","fb":"Only a competitor for the active site can be out-numbered by substrate.","_n":"1612a","_k":"e0ef7aec"},{"t":"allosteric","fb":"Only a competitor for the active site can be out-numbered by substrate.","_n":"1715a","_k":"ab582752"}]},{"id":"q2","goal":5,"prompt":"In feedback inhibition, the end product usually inhibits…","choices":[{"t":"the substrate","fb":"Stopping the first step stops the whole pathway without wasting intermediates.","_n":"1814a","_k":"2ddad738"},{"t":"the last enzyme","fb":"Stopping the first step stops the whole pathway without wasting intermediates.","_n":"1917a","_k":"40b4c582"},{"t":"every enzyme","fb":"Stopping the first step stops the whole pathway without wasting intermediates.","_n":"1a16a","_k":"863cbe47"},{"t":"the first enzyme","fb":"Stopping the first step stops the whole pathway without wasting intermediates.","_n":"1b09a","_k":"0048907f"}]},{"id":"q3","goal":4,"prompt":"An enzyme’s activity drops sharply above 45 °C because…","choices":[{"t":"ΔG becomes positive","fb":"Heat denatures the protein; ΔG isn’t changed by the enzyme at all.","_n":"1c08a","_k":"e6e65a54"},{"t":"it runs out of ATP","fb":"Heat denatures the protein; ΔG isn’t changed by the enzyme at all.","_n":"1d0ba","_k":"a92c83fd"},{"t":"its active site loses its shape","fb":"Heat denatures the protein; ΔG isn’t changed by the enzyme at all.","_n":"1e0ca","_k":"40830342"},{"t":"the substrate melts","fb":"Heat denatures the protein; ΔG isn’t changed by the enzyme at all.","_n":"1f09a","_k":"4c420b08"}]},{"id":"q4","goal":5,"prompt":"At \u003ci>S\u003c/i> = 18 mM, the rates are 90 (no inhibitor), 75 and 45. Which is the allosteric inhibitor?","choices":[{"t":"45","fb":"The allosteric inhibitor lowers the maximum rate, so it stays low even with lots of substrate.","_n":"1g0aa","_k":"e27aaa32"},{"t":"75","fb":"The allosteric inhibitor lowers the maximum rate, so it stays low even with lots of substrate.","_n":"1h07a","_k":"b35afc78"},{"t":"90","fb":"The allosteric inhibitor lowers the maximum rate, so it stays low even with lots of substrate.","_n":"1i08a","_k":"569d8f52"},{"t":"can’t tell","fb":"The allosteric inhibitor lowers the maximum rate, so it stays low even with lots of substrate.","_n":"1j05a","_k":"0dadaaa8"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Catabolic or anabolic? Exergonic or endergonic?","summary":"Catabolic or anabolic?","goal":[1,2],"noun":"reaction","txt":true,"instruction":"Sort each reaction into the box that describes it. Not every box must be used.","doneNote":"Breaking down usually releases free energy; building up usually needs it.","boxes":[{"id":"b1","label":"Catabolic, exergonic"},{"id":"b2","label":"Anabolic, endergonic"},{"id":"b3","label":"Catabolic, endergonic"},{"id":"b4","label":"Anabolic, exergonic"}],"items":[{"id":"i1","t":"Digesting starch into glucose","_a":"R1EBGg==","why":"Starch is broken into smaller glucose molecules, and free energy is released.","wrong":{"b2":"Catabolic means breaking down into smaller molecules. Anabolic means building up bigger ones.","b4":"Catabolic means breaking down into smaller molecules. Anabolic means building up bigger ones."}},{"id":"i2","t":"Photosynthesis making glucose","_a":"R1ECGg==","why":"Glucose is built from CO₂ and water using light energy: uphill.","wrong":{"b1":"Building large molecules stores energy in new bonds, so it’s uphill.","b4":"Building large molecules stores energy in new bonds, so it’s uphill."}},{"id":"i3","t":"Joining amino acids into a protein","_a":"R1ECGg==","why":"A large molecule is built up, and that needs free energy.","wrong":{"b1":"Building large molecules stores energy in new bonds, so it’s uphill.","b4":"Building large molecules stores energy in new bonds, so it’s uphill."}},{"id":"i4","t":"Cellular respiration of glucose","_a":"R1EBGg==","why":"Glucose is broken down to CO₂ and water, releasing free energy (ΔG ≈ −2870 kJ/mol)."},{"id":"i5","t":"ATP → ADP + Pᵢ","_a":"R1EBGg==","why":"Breaking off a phosphate releases free energy (ΔG ≈ −30.5 kJ/mol)."},{"id":"i6","t":"Building glycogen from glucose in the liver","_a":"R1ECGg==","why":"Glycogen is built from many glucose molecules, and that needs free energy.","wrong":{"b1":"Building large molecules stores energy in new bonds, so it’s uphill.","b4":"Building large molecules stores energy in new bonds, so it’s uphill."}},{"id":"i7","t":"Breaking a fat into glycerol and fatty acids","_a":"R1EBGg==","why":"The fat is broken into smaller molecules, and free energy is released.","wrong":{"b2":"Glycerol and fatty acids are smaller than the fat.","b4":"Glycerol and fatty acids are smaller than the fat."}},{"id":"i8","t":"Copying DNA (joining nucleotides)","_a":"R1ECGg==","why":"Nucleotides are joined into a long strand: building up, which needs free energy.","wrong":{"b1":"Building large molecules stores energy in new bonds, so it’s uphill.","b4":"Building large molecules stores energy in new bonds, so it’s uphill."}},{"id":"i9","t":"ADP + Pᵢ → ATP","_a":"R1ECGg==","why":"It’s the reverse of ATP → ADP + Pᵢ, so the sign of ΔG flips: +30.5 kJ/mol.","wrong":{"b1":"Making ATP joins a phosphate on: building up, and it needs energy (ΔG ≈ +30.5).","b3":"Making ATP joins a phosphate on: building up, and it needs energy (ΔG ≈ +30.5)."},"hints":["Is ADP + Pᵢ → ATP the reverse of item 5 (ATP → ADP + Pᵢ)?","Reversing a reaction flips the sign of ΔG.","+30.5 kJ/mol: anabolic, endergonic."]},{"id":"i10","t":"Breaking down a protein into amino acids","_a":"R1EBGg==","why":"The protein is broken into smaller amino acids, and free energy is released.","wrong":{"b2":"Catabolic means breaking down into smaller molecules. Anabolic means building up bigger ones.","b4":"Catabolic means breaking down into smaller molecules. Anabolic means building up bigger ones."}}],"wrongDefault":"Ask two questions: is a molecule being broken down or built up, and does that release free energy or need it?"},{"id":"calc","type":"custom","title":"ΔG calculator","summary":"ΔG calculator","star":true,"goal":[2,3,6],"instruction":"Seven calculations. Type each ΔG with its sign: + for endergonic (uphill), − for exergonic (downhill). Decimals are fine. The last four are non-routine (★).","items":[{"id":"d1","kind":"dg","goal":3,"prompt":"ΔG of a reaction is +18 kJ/mol. Coupled with 1 ATP, the net ΔG is…","_a":"SAICFlc=","display":"−12.5 kJ/mol","unit":"kJ/mol","why":"+18 + (−30.5) = −12.5 kJ/mol.","wrong":[{"match":48.5,"fb":"ATP hydrolysis is −30.5, so add a negative."}]},{"id":"d2","kind":"dg","goal":2,"prompt":"ΔG of A → B is −12 kJ/mol. What is ΔG of B → A?","_a":"VAE=","display":"+12 kJ/mol","unit":"kJ/mol","why":"Reversing a reaction flips the sign of ΔG.","wrong":[{"match":-12,"fb":"Reversing a reaction flips the sign."}]},{"id":"d3","kind":"num","goal":3,"prompt":"How many ATP must be coupled to make a +50 kJ/mol step exergonic?","_a":"Vw==","display":"2 ATP","unit":"ATP","why":"+50 − 61 = −11 kJ/mol, which is below zero.","wrong":[{"match":1,"fb":"+50 − 30.5 = +19.5: still uphill."}]},{"id":"d4","kind":"dg","goal":2,"star":true,"prompt":"A two-step pathway: A → B (+20 kJ/mol), then B → C (−35 kJ/mol). What is ΔG for A → C?","_a":"SAIF","display":"−15 kJ/mol","unit":"kJ/mol","why":"+20 + (−35) = −15 kJ/mol.","wrong":[{"match":55,"fb":"Add the steps with their signs: +20 + (−35)."},{"match":-55,"fb":"Add the steps with their signs: +20 + (−35)."}]},{"id":"d5","kind":"dg","goal":2,"star":true,"prompt":"An enzyme lowers E\u003csub>a\u003c/sub> from 80 to 30 kJ/mol for a reaction with ΔG = −20 kJ/mol. What is ΔG with the enzyme?","_a":"SAEA","display":"−20 kJ/mol","unit":"kJ/mol","why":"The enzyme changes E\u003csub>a\u003c/sub> only; ΔG stays −20 kJ/mol.","wrong":[{"match":-70,"fb":"The enzyme changes E\u003csub>a\u003c/sub> only; ΔG stays −20."},{"match":30,"fb":"The enzyme changes E\u003csub>a\u003c/sub> only; ΔG stays −20."}]},{"id":"d6","kind":"num","goal":6,"star":true,"prompt":"A cell makes 3 ATP from a step that releases 120 kJ/mol. What percentage of the energy is captured in ATP? (Use 30.5 × 3 = 91.5.)","use":"91.5 ÷ 120 ≈ 0.76","_a":"UgU=","tol":1,"display":"≈ 76%","unit":"%","why":"91.5 ÷ 120 ≈ 0.76, so about 76% is captured; the rest is released as heat.","wrong":[{"match":24,"fb":"That’s the heat lost, not the energy captured."}],"hints":["Captured = 91.5 kJ/mol.","91.5 ÷ 120.","≈ 0.76, so about 76%."]},{"id":"d7","kind":"pair","goal":3,"star":true,"prompt":"Step 1: +30 kJ/mol. Step 2: −10 kJ/mol. Step 3: +8 kJ/mol. What is the fewest ATP that makes the whole pathway exergonic, and what is the net ΔG then?","labels":["Fewest ATP","Net ΔG (kJ/mol)"],"_a":"PgIcFVAdVj8=","display":"1 ATP; −2.5 kJ/mol","why":"+30 − 10 + 8 = +28; +28 − 30.5 = −2.5 kJ/mol, which is exergonic.","general":"+30 − 10 + 8 = +28; +28 − 30.5 = −2.5.","hints":["Add the three steps first.","+30 − 10 + 8 = +28 kJ/mol.","One ATP: +28 − 30.5 = −2.5 kJ/mol, which is exergonic."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Divya","how":"","instruction":"Divya made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Explain why sucrose doesn’t break down in a sugar bowl, even though its hydrolysis is exergonic.","steps":["Sucrose hydrolysis has ΔG ≈ −29 kJ/mol, so it’s exergonic.","Exergonic reactions happen quickly.","So sucrose must need a catalyst to become exergonic.","Sucrase supplies the missing energy."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 builds on step 2. The mistake is earlier.","This follows from the earlier mistake."],"fixes":[{"t":"Step 2 is correct.","why":"Speed depends on activation energy, not on ΔG.","_n":"1k06a","_k":"6947a486"},{"t":"Exergonic means it \u003cem>can\u003c/em> proceed, but its activation energy is high, so it’s very slow without an enzyme. Sucrase lowers E\u003csub>a\u003c/sub>.","why":"ΔG &lt; 0 says the reaction \u003cem>can\u003c/em> go on its own. Speed depends on the activation energy, so glucose sits in air for years without reacting.","_n":"1l13a","_k":"3c8f0668"},{"t":"Sucrose hydrolysis is actually endergonic.","why":"ΔG ≈ −29: it’s exergonic.","_n":"1m14a","_k":"34671ead"},{"t":"Exergonic reactions never happen without ATP.","why":"ATP isn’t needed for a downhill reaction.","_n":"1n059","_k":"579fd784"}],"hints":["Does ΔG tell you the speed?","No: the hill height (E\u003csub>a\u003c/sub>) does.","The fix that says the activation energy is high, so it’s very slow without an enzyme."]},{"id":"e2","goal":6,"task":"A runner’s muscles convert ATP into movement. Where does the energy go?","steps":["ATP hydrolysis releases free energy.","Some of it moves the muscle proteins.","The rest of the energy is destroyed.","That’s why the runner’s temperature stays the same."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","This follows from step 3. The mistake is earlier."],"fixes":[{"t":"All of it moves the muscles.","why":"Energy is never destroyed (first law), but every conversion releases some as heat that cells can’t use (second law).","_n":"1o049","_k":"f88a2b6c"},{"t":"The rest is released as heat. Energy isn’t destroyed (first law), and no conversion is 100% efficient (second law), so the runner warms up.","why":"Energy is never destroyed (first law), but every conversion releases some as heat that cells can’t use (second law).","_n":"1p039","_k":"3eb4842f"},{"t":"Step 3 is correct.","why":"The first law says energy is never destroyed.","_n":"1q029","_k":"debc2f44"},{"t":"The rest is stored as new ATP.","why":"Hydrolyzed ATP doesn’t re-form by itself.","_n":"1r099","_k":"74b11d54"}],"hints":["Can energy be destroyed?","What do you feel during a run?","Heat: the fix that says the rest is released as heat."]},{"id":"e3","goal":5,"task":"A drug slows an enzyme. Doubling the substrate concentration does not restore the rate. Classify the drug.","steps":["The drug lowers the reaction rate, so it’s an inhibitor.","Extra substrate didn’t help.","So the drug must be binding the active site and blocking it.","It’s a competitive inhibitor."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct: that’s the key observation.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"The drug must be denaturing the substrate.","why":"Substrates aren’t proteins that denature.","_n":"1s089","_k":"d30ae22c"},{"t":"It’s an activator.","why":"The rate went down.","_n":"1t079","_k":"68ffd03c"},{"t":"Step 3 is correct.","why":"If it competed for the active site, more substrate would win.","_n":"1u069","_k":"7d612264"},{"t":"Extra substrate would out-compete an active-site blocker. Since it didn’t, the drug binds elsewhere: an allosteric (non-competitive) inhibitor.","why":"More substrate wins only against a competitive inhibitor, which competes for the active site. An allosteric inhibitor changes the enzyme’s shape, so more substrate can’t undo it.","_n":"1v0d9","_k":"a34e5d26"}],"hints":["Which inhibitor can be out-competed?","A competitive one.","Not out-competed, so allosteric: the fix that says the drug binds elsewhere."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the energy landscape: that the enzyme left ΔG alone, or that sugar needs a push to react?"},{"id":"j2","q":"In your own words, what’s the difference between whether a reaction \u003cem>can\u003c/em> happen and how \u003cem>fast\u003c/em> it happens?"},{"id":"j3","q":"Explain to a friend how one ATP lets a cell build glutamine, using numbers."},{"id":"j4","q":"Which idea is still fuzzy: ΔG signs, inhibitors, or the second law? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a catabolic reaction?","options":[{"t":"Making DNA from nucleotides","why":"Building up: anabolic.","_n":"1w0c9","_k":"3b710e73"},{"t":"ADP + Pᵢ → ATP","why":"Adding a phosphate builds ATP: anabolic.","_n":"1xff9","_k":"8bdd5ca3"},{"t":"Hydrolysis of glycogen into glucose","why":"A large molecule is broken into smaller ones.","_n":"1y009","_k":"47c91a95"},{"t":"Joining glucose molecules into starch","why":"That builds a larger molecule: anabolic.","_n":"1z019","_k":"6dd790b4"}]},"b":{"prompt":"Which is an anabolic reaction?","options":[{"t":"Joining amino acids into a protein","why":"Building a larger molecule.","_n":"20029","_k":"2661e10f"},{"t":"Respiration of glucose","why":"Glucose is broken down to CO₂ and water.","_n":"21039","_k":"30d3aa14"},{"t":"ATP → ADP + Pᵢ","why":"Breaking off a phosphate: catabolic.","_n":"22049","_k":"62ebdb58"},{"t":"Breaking a fat into fatty acids","why":"Breaking down: catabolic.","_n":"23059","_k":"e6265af0"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"What does an enzyme change about a reaction?","options":[{"t":"It supplies energy to uphill reactions","why":"Enzymes don’t supply energy; ATP coupling does.","_n":"24069","_k":"ffe2963c"},{"t":"It is used up in the reaction","why":"An enzyme is unchanged and reused.","_n":"25079","_k":"6172ab54"},{"t":"It lowers the activation energy","why":"So more molecules cross the hill each second.","_n":"26089","_k":"5a166a53"},{"t":"It makes ΔG more negative","why":"Reactants and products are unchanged, so ΔG is too.","_n":"2719c","_k":"35ec0625"}]},"b":{"prompt":"Which is true of a reaction with and without its enzyme?","options":[{"t":"ΔG is more negative with the enzyme","why":"The enzyme lowers the hill, not the drop. The start and end energies, and so ΔG, are the same with or without it.","_n":"2818c","_k":"ccb0bb4f"},{"t":"The products are different with the enzyme","why":"Same reactants, same products.","_n":"291bc","_k":"f948b73c"},{"t":"ΔG is the same; the activation energy is lower with the enzyme","why":"The enzyme lowers the hill, not the drop.","_n":"2a1ac","_k":"6f4434c0"},{"t":"Both ΔG and activation energy are lower with the enzyme","why":"The enzyme lowers the hill, not the drop. The start and end energies, and so ΔG, are the same with or without it.","_n":"2b15c","_k":"6d1b1978"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"A competitive inhibitor binds to…","options":[{"t":"an allosteric site","why":"That’s where non-competitive (allosteric) inhibitors bind.","_n":"2c14c","_k":"2d5795e4"},{"t":"the substrate","why":"Inhibitors bind the enzyme, not the substrate.","_n":"2d17c","_k":"1b11a928"},{"t":"the product","why":"Inhibitors act on the enzyme.","_n":"2e16c","_k":"aaec1634"},{"t":"the active site","why":"It competes with the substrate for the same place.","_n":"2f11c","_k":"b2005a2b"}]},"b":{"prompt":"An allosteric inhibitor binds to…","options":[{"t":"ATP","why":"Allosteric inhibitors bind the enzyme itself.","_n":"2g10c","_k":"0567225c"},{"t":"the active site","why":"That’s a competitive inhibitor.","_n":"2h13b","_k":"94a8b923"},{"t":"a site other than the active site, changing the enzyme’s shape","why":"The shape change bends the active site, so the substrate fits poorly.","_n":"2i14b","_k":"15dc609e"},{"t":"the substrate","why":"Inhibitors bind the enzyme.","_n":"2j11b","_k":"2924772f"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"Rates (units) for an enzyme with and without a drug:\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"em-qt\">\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003ci>S\u003c/i> (mM)\u003c/th>\u003cth scope=\"col\">No drug\u003c/th>\u003cth scope=\"col\">With drug\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">2\u003c/th>\u003ctd>50\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">18\u003c/th>\u003ctd>90\u003c/td>\u003ctd>75\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>What kind of inhibitor is the drug?","options":[{"t":"Competitive: its effect shrinks as substrate increases","why":"At high \u003ci>S\u003c/i> the rate approaches the uninhibited rate.","_n":"2k12b","_k":"41eb620e"},{"t":"It denatures the enzyme","why":"A denatured enzyme wouldn’t speed up with more substrate.","_n":"2l17b","_k":"69fc53bb"},{"t":"Not an inhibitor: the rate still rises with \u003ci>S\u003c/i>","why":"Every enzyme’s rate rises with \u003ci>S\u003c/i>; the drug lowers it.","_n":"2m18b","_k":"9abef129"},{"t":"Allosteric: it lowers the rate at both concentrations","why":"An allosteric inhibitor would keep the rate far below at high \u003ci>S\u003c/i>: about half.","_n":"2n15b","_k":"76fed36f"}]},"b":{"prompt":"Rates (units) with and without a second drug:\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"em-qt\">\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003ci>S\u003c/i> (mM)\u003c/th>\u003cth scope=\"col\">No drug\u003c/th>\u003cth scope=\"col\">With drug\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">2\u003c/th>\u003ctd>50\u003c/td>\u003ctd>25\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">18\u003c/th>\u003ctd>90\u003c/td>\u003ctd>45\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>What kind of inhibitor is it?","options":[{"t":"It is the substrate","why":"The substrate raises the rate.","_n":"2o16b","_k":"ebf68979"},{"t":"It’s an activator","why":"The rate went down.","_n":"2p0bb","_k":"cfeba9d5"},{"t":"Competitive: it lowers the rate at low \u003ci>S\u003c/i>","why":"A competitor would be out-competed at high \u003ci>S\u003c/i>.","_n":"2q0cb","_k":"611d7cbd"},{"t":"Allosteric: the rate stays about half even at high substrate","why":"Extra substrate can’t undo a shape change, so the maximum rate stays halved.","_n":"2r1bb","_k":"b8797193"}]}},{"id":"t2","cat":"T","goal":[2,3],"a":{"prompt":"A cell needs to run a reaction with ΔG = +45 kJ/mol. It couples it to 2 ATP. Which is correct?","options":[{"t":"Net ΔG = +14.5 kJ/mol; it needs a third ATP","why":"That’s with only one ATP: +45 − 30.5.","_n":"2s1cb","_k":"70d3d784"},{"t":"Net ΔG = −16 kJ/mol, so the coupled reaction can proceed","why":"+45 − 61 = −16.","_n":"2t19b","_k":"f1219b1a"},{"t":"It proceeds quickly because the net ΔG is negative","why":"Negative ΔG says it \u003cem>can\u003c/em> proceed; speed needs an enzyme.","_n":"2u1ab","_k":"9546b0f4"},{"t":"Net ΔG = +106 kJ/mol, so it can’t proceed","why":"ATP hydrolysis is negative: subtract.","_n":"2v17b","_k":"8ec6de65"}]},"b":{"prompt":"A reaction has ΔG = +20 kJ/mol and is coupled to 1 ATP. Which is correct?","options":[{"t":"Net ΔG = −10.5 kJ/mol, so it can proceed","why":"+20 + (−30.5) = −10.5.","_n":"2w18b","_k":"5483c27c"},{"t":"Net ΔG = +20 kJ/mol, because ATP doesn’t change ΔG","why":"Coupled reactions add their ΔG values.","_n":"2x15b","_k":"ad23f6a5"},{"t":"It proceeds fast because it’s now exergonic","why":"ΔG &lt; 0 says the reaction \u003cem>can\u003c/em> go on its own. Speed depends on the activation energy, so glucose sits in air for years without reacting.","_n":"2y16b","_k":"773c2573"},{"t":"Net ΔG = +50.5 kJ/mol","why":"Coupled reactions add their ΔG values: +20 + (−30.5) = −10.5 kJ/mol.","_n":"2z23b","_k":"9339cee0"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"In a bacterium, the pathway threonine → (enzyme 1) → … → (enzyme 5) → isoleucine is controlled by feedback inhibition. Isoleucine builds up. What happens?","options":[{"t":"Isoleucine inhibits enzyme 1, so the whole pathway slows","why":"Switching off the first step saves threonine and avoids wasted intermediates.","_n":"3024b","_k":"34121749"},{"t":"The pathway speeds up to use the isoleucine","why":"Excess product slows its own making.","_n":"3121b","_k":"3dc89866"},{"t":"Isoleucine inhibits enzyme 5, so intermediates pile up","why":"Blocking the last step would waste the earlier steps’ products.","_n":"3220b","_k":"7a623468"},{"t":"Threonine is destroyed","why":"Feedback inhibition slows an enzyme; it doesn’t destroy the substrate.","_n":"3323b","_k":"b53e12e6"}]},"b":{"prompt":"In the same pathway, the cell suddenly uses up all its isoleucine to build proteins. What happens to enzyme 1?","options":[{"t":"Its inhibition is released, so the pathway speeds up","why":"With no isoleucine bound to its allosteric site, enzyme 1 works again.","_n":"3422b","_k":"94851577"},{"t":"It is denatured","why":"Feedback inhibition is reversible binding, not denaturing.","_n":"3525b","_k":"efee3c26"},{"t":"It stays inhibited until more threonine arrives","why":"The inhibitor is isoleucine, not threonine.","_n":"3624b","_k":"a78902d0"},{"t":"Enzyme 5 is inhibited instead","why":"The end product switches off the \u003cstrong>first\u003c/strong> enzyme of the pathway, so no intermediates pile up.","_n":"3727b","_k":"89f2c546"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why your body stays warm while you rest?","options":[{"t":"“Resting cells don’t use energy, so the heat comes from outside.”","why":"Cells metabolize constantly, even at rest.","_n":"3826b","_k":"dfec0fb4"},{"t":"“Every metabolic conversion releases some energy as heat. Energy isn’t destroyed (first law), and no conversion is 100% efficient (second law), so that heat warms the body.”","why":"It uses both laws: energy is conserved, and every conversion releases some heat.","_n":"3919b","_k":"98cfec08"},{"t":"“Cells destroy energy they don’t need, which makes heat.”","why":"Energy is never destroyed.","_n":"3a18b","_k":"49843296"},{"t":"“Enzymes produce heat when they speed up reactions.”","why":"The heat comes from the reactions’ energy, not from the enzyme.","_n":"3b0fa","_k":"f4eac981"}]},"b":{"prompt":"Which is the best explanation of why a cell can’t turn all of glucose’s energy into ATP?","options":[{"t":"“Some energy is destroyed in each step.”","why":"Energy is never destroyed (first law), but every conversion releases some as heat that cells can’t use (second law).","_n":"3c10a","_k":"fe9f47d9"},{"t":"“Each energy conversion releases some energy as heat (second law), so only part of glucose’s free energy ends up in ATP.”","why":"No conversion is 100% efficient; the rest becomes heat.","_n":"3d11a","_k":"f0d6afa0"},{"t":"“ATP can’t store more than 30.5 kJ/mol, so the rest is used up.”","why":"Energy is never destroyed (first law), but every conversion releases some as heat that cells can’t use (second law).","_n":"3e12a","_k":"a6c702a9"},{"t":"“Enzymes absorb part of the energy.”","why":"Enzymes are unchanged; they don’t absorb energy.","_n":"3f13a","_k":"7fd58e87"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which energy diagram description correctly compares a reaction with and without its enzyme?","options":[{"t":"“The same starting and ending heights; a lower hill with the enzyme.”","why":"The enzyme lowers the hill, not the drop.","_n":"3g14a","_k":"4df3738e"},{"t":"“A lower ending height with the enzyme.”","why":"Products are the same, so the ending height is the same.","_n":"3h15a","_k":"3e1cfac3"},{"t":"“A taller hill with the enzyme, because the enzyme must be broken.”","why":"The hill is lower.","_n":"3i16a","_k":"2e1bf3e1"},{"t":"“No hill at all with the enzyme.”","why":"Enzymes lower activation energy but don’t remove it.","_n":"3j17a","_k":"248190bf"}]},"b":{"prompt":"A student draws the uncatalyzed reaction as a hill from 50 up to 150 and down to 20 kJ/mol. With an enzyme the peak falls to 90. What is ΔG with the enzyme?","options":[{"t":"−30 kJ/mol, the same as without it","why":"20 − 50 = −30 in both cases.","_n":"3k18a","_k":"72f0e736"},{"t":"−60 kJ/mol","why":"The enzyme doesn’t change ΔG.","_n":"3l15b","_k":"c1ccf432"},{"t":"−70 kJ/mol","why":"That’s 20 − 90, using the peak instead of the start.","_n":"3m14b","_k":"17b00046"},{"t":"+40 kJ/mol","why":"That’s 90 − 50: the new activation energy.","_n":"3n13b","_k":"f1871842"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Methanol is poisonous because the liver enzyme alcohol dehydrogenase converts it into a toxic product. Doctors may give ethanol, which the same enzyme also acts on. How does this help?","options":[{"t":"Ethanol reacts with methanol to neutralize it","why":"The two compete for the enzyme; they don’t react together.","_n":"3o12b","_k":"f0c42ffe"},{"t":"Ethanol denatures the enzyme","why":"Ethanol is a substrate here, not a denaturant.","_n":"3p19b","_k":"58a0c10a"},{"t":"Ethanol competes for the enzyme’s active site, so less methanol is converted","why":"A competitive inhibitor in action; the methanol is then excreted more slowly but safely.","_n":"3q18b","_k":"4f1b0779"},{"t":"Ethanol binds an allosteric site and switches off the liver","why":"It competes at the active site.","_n":"3r17b","_k":"4c7f217a"}]},"b":{"prompt":"A pesticide binds to an insect enzyme away from its active site and bends the active site shut. Spraying more of the enzyme’s normal substrate into the insect…","options":[{"t":"won’t restore the enzyme’s activity, because the inhibition is allosteric","why":"Extra substrate can’t reopen an active site that has been bent shut.","_n":"3s16b","_k":"ea874be1"},{"t":"makes the reaction endergonic","why":"Inhibitors don’t change ΔG.","_n":"3t1db","_k":"d3f825a7"},{"t":"restores activity, because the substrate out-competes it","why":"More substrate wins only against a competitive inhibitor, which competes for the active site. An allosteric inhibitor changes the enzyme’s shape, so more substrate can’t undo it.","_n":"3u1cb","_k":"c7b6c84d"},{"t":"denatures the enzyme","why":"Substrate doesn’t denature enzymes.","_n":"3v93b","_k":"4406f962"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Muscle cells link creatine and phosphate to make creatine phosphate (ΔG ≈ +43 kJ/mol, model value). How many ATP must be hydrolyzed, at a minimum, to drive this?","options":[{"t":"3","why":"It works, but 2 is the minimum.","_n":"3w94b","_k":"e688bce8"},{"t":"0, if an enzyme is present","why":"The enzyme lowers the hill, not the drop. The start and end energies, and so ΔG, are the same with or without it.","_n":"3x91b","_k":"94bfcdd2"},{"t":"2","why":"+43 − 30.5 = +12.5 (still uphill); +43 − 61 = −18.","_n":"3y92b","_k":"6329f687"},{"t":"1","why":"One ATP leaves +12.5 kJ/mol: still endergonic.","_n":"3z97b","_k":"b7b6cb1a"}]},"b":{"prompt":"A plant cell runs a step with ΔG ≈ +58 kJ/mol (model value). What is the fewest ATP that makes the coupled reaction exergonic, and what is the net ΔG?","options":[{"t":"2 ATP; net ΔG = −3 kJ/mol","why":"+58 − 61 = −3.","_n":"4098b","_k":"92b37bb9"},{"t":"2 ATP; net ΔG = +119 kJ/mol","why":"ATP hydrolysis is −30.5 kJ/mol each: subtract, don’t add.","_n":"4195b","_k":"071ee8be"},{"t":"0 ATP, with enough enzyme","why":"The enzyme lowers the hill, not the drop. The start and end energies, and so ΔG, are the same with or without it.","_n":"4296b","_k":"1907b53e"},{"t":"1 ATP; net ΔG = +27.5 kJ/mol","why":"Still uphill.","_n":"439bb","_k":"e1d55d43"}]}}]},"task":{"title":"Couple it, don’t waste it","summary":"Couple it, don’t waste it","statement":"\u003cp>You’re designing one step of a cell’s metabolism. Choose a reaction, the number of ATP to couple, and whether an enzyme is present, so that every condition is met. Can you find all the answers?\u003c/p>\u003col class=\"em-conds\">\u003cli>The coupled reaction is exergonic (net ΔG &lt; 0).\u003c/li>\u003cli>No ATP is wasted: with one fewer ATP, the net ΔG would not be negative.\u003c/li>\u003cli>It is fast: an enzyme is present.\u003c/li>\u003cli>It doesn’t waste energy as heat: the net ΔG is −20 kJ/mol or higher (closer to zero).\u003c/li>\u003c/ol>","reactions":[14,25,40,55],"modelNote":"Each ATP adds −30.5 kJ/mol. The hill in the diagram is a model value: 100 kJ/mol without an enzyme, 40 kJ/mol with one.","checks":["Exergonic overall","No spare ATP","Fast","Not too much heat"],"tips":["Each ATP adds −30.5 kJ/mol. The total must be below zero.","Remove one ATP: if it’s still exergonic, that ATP was spare.","Without an enzyme the hill is too high to cross quickly.","A very negative net ΔG means lots of energy is lost as heat. Try a reaction whose ΔG is closer to a multiple of 30.5."],"explainPrompt":"Explain how you chose the number of ATP, and why switching the enzyme on didn’t change the net ΔG.","vocab":"Use the words exergonic, endergonic, coupling, activation energy and ΔG.","more":"Can you find all the answers?","allFound":"You’ve found all three answers.","after3":"The +40 reaction needs 2 ATP, which gives −21: just past the heat limit. Cells match their ATP use to the job."},"cards":[["Metabolism","All the chemical reactions in a cell."],["Catabolic","Breaks large molecules into smaller ones; usually releases free energy (respiration)."],["Anabolic","Builds large molecules from smaller ones; needs free energy (photosynthesis, protein synthesis)."],["ΔG &lt; 0","Exergonic: free energy is released; the reaction can proceed on its own."],["ΔG &gt; 0","Endergonic: needs an energy input, often from coupling to ATP."],["ATP hydrolysis","ATP + H₂O → ADP + Pᵢ, ΔG ≈ −30.5 kJ/mol."],["Coupling","Add the ΔG values: +14 + (−30.5) = −16.5 kJ/mol, so the pair proceeds."],["Activation energy","The energy hill to start a reaction. Enzymes lower it; ΔG stays the same."],["Induced fit","The active site changes shape slightly to grip the substrate, forming the enzyme–substrate complex."],["Competitive vs allosteric inhibitor","Competitive: active site, overcome by more substrate. Allosteric: another site, changes shape, not overcome."],["Feedback inhibition","A pathway’s end product inhibits its first enzyme."],["Laws of thermodynamics","1st: energy is converted, not created or destroyed. 2nd: every conversion loses some as heat."]]}};</script>
