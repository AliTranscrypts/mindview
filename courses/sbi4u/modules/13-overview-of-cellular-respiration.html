.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 13 Overview of Cellular Respiration: respiration map (S1 / S2 / S3), the cycle (Venn, loop, jar tubes), lab task.
   Tokens only. Module tokens: compartment fills built from the base tokens; indicator colours are data, so they keep
   fixed hues in both themes and are always drawn with an --ink outline and named in text. */
:root{--cr-cyto:color-mix(in srgb,var(--paper) 55%,var(--sheet));--cr-ims:var(--paper);--cr-mx:var(--sheet);
  --btb-blue:#2F6BD0;--btb-green:#3C9A52;--btb-yellow:#E2C230;--lime-clear:rgba(200,214,226,.25);--lime-cloudy:#C9CCCF;--lime-milky:#F1EFE8;--iodine:#B2611C}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--btb-blue:#2F6BD0;--btb-green:#3C9A52;--btb-yellow:#E2C230;--lime-clear:rgba(200,214,226,.25);--lime-cloudy:#C9CCCF;--lime-milky:#F1EFE8;--iodine:#B2611C}
}
:root[data-theme="dark"]{--btb-blue:#2F6BD0;--btb-green:#3C9A52;--btb-yellow:#E2C230;--lime-clear:rgba(200,214,226,.25);--lime-cloudy:#C9CCCF;--lime-milky:#F1EFE8;--iodine:#B2611C}

/* radio groups (copied from SBI4U 04) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* hero */
.cr-heq{display:inline-block;line-height:1.3;font-size:.82em}
.cr-heq-n{font-family:var(--font-ui);font-size:.62em;font-weight:700;color:var(--ink-2);white-space:nowrap}
.cr-hero{max-width:520px;margin:0 auto}
.cr-totb{fill:var(--sheet);stroke:var(--bio-atp);stroke-width:2}
.cr-tot{font:700 10.5px var(--font-ui);fill:var(--ink)}

/* S1 stage (copied from SBI4U 03; buttons are transparent targets over the drawn zones) */
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1px dashed transparent;border-radius:8px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}

/* the respiration map */
.cr-svg{display:block;width:100%;height:auto;overflow:visible}
.cr-cell{fill:var(--cr-cyto);stroke:var(--ink-2);stroke-width:2}
.cr-nuc{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.cr-nuc2{fill:none;stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.cr-nucl{fill:var(--ink-2);opacity:.35}
.cr-om{fill:var(--cr-ims);stroke:var(--ink-2);stroke-width:2.2}
.cr-im{fill:var(--cr-mx);stroke:var(--ink-2);stroke-width:2.2}
.cr-cris{fill:var(--cr-ims);stroke:var(--ink-2);stroke-width:2.2;stroke-linejoin:round}
.cr-crm{stroke:var(--cr-ims);stroke-width:4}
.cr-ring{fill:none;stroke:var(--bio-carbon);stroke-width:3}
.cr-ringh{fill:none;stroke:var(--bio-carbon);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cr-cdot{fill:var(--bio-carbon)}
.cr-cx{fill:var(--sheet);stroke:var(--ink);stroke-width:1.8}
.cr-synst{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.cr-synb{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.cr-synh{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.cr-synr{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.cr-lead2{fill:none;stroke:var(--ink-2);stroke-width:1.1;stroke-dasharray:3 3}
.cr-dim{opacity:.32}
.cr-hot{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2}
.cr-stt{font:700 11.5px var(--font-ui);fill:var(--ink)}
.cr-sts{font:700 10px var(--font-ui);fill:var(--ink-2)}
.cr-sts.cr-s-running{fill:var(--green)}
.cr-sts.cr-s-noO2,.cr-sts.cr-s-noNAD{fill:var(--red)}
.cr-sub{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.cr-lab{font:700 10.5px var(--font-ui);fill:var(--ink)}
.cr-tt{font:700 9.5px var(--font-ui);fill:var(--sheet)}
.cr-glu{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1}
.cr-cmol{fill:var(--bio-carbon)}
.cr-cin{fill:var(--sheet)}
.cr-ofill{fill:var(--bio-o2)}
.cr-cfill{fill:var(--bio-carbon)}
.cr-oring{fill:var(--sheet);stroke:var(--bio-o2);stroke-width:2}
.cr-halo{fill:var(--hi-soft);stroke:var(--hi);stroke-width:3}
.cr-tag{fill:var(--hi)}
.cr-tagt{font:700 10px var(--font-ui);fill:var(--hi-ink)}
.cr-clab{font:700 10.5px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--cr-mx);stroke-width:3px;stroke-linejoin:round}
.cr-e{fill:var(--bio-e)}
.cr-h{fill:var(--bio-h)}
/* Mode A: drop zones */
.cr-lead{stroke:var(--ink);stroke-width:1.4}
.cr-leadd{fill:var(--ink)}
.cr-zone{fill:color-mix(in srgb,var(--sheet) 86%,transparent);stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:5 4}
.cr-zone.ready{stroke:var(--ink);stroke-width:2.2}
.cr-zn{font:700 11.5px var(--font-ui);fill:var(--ink)}
.cr-pill{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
.cr-pill.sel{fill:var(--hi);stroke:var(--ink)}
.cr-pill.ok{fill:var(--good-bg);stroke:var(--green);stroke-width:2.6}
.cr-pt{font:700 10.5px var(--font-ui);fill:var(--ink)}

/* Explore panel */
.cr-pg .pg-graph{position:relative}
.cr-cap{font-size:.92rem;margin:8px 0 0;min-height:2.6em}
.cr-row{margin:0 0 12px}
.cr-panel{margin-top:4px}
.cr-how{margin:0 0 8px}
.cr-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:8px}
.cr-card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.45em .7em;min-height:44px;font:inherit;cursor:pointer}
.cr-card[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink)}
.cr-card.ok{border-color:var(--green);box-shadow:0 0 0 2px var(--good-bg)}
.cr-cn{font-weight:700;font-size:.92rem}
.cr-cw{font-size:.8rem;color:var(--ink-2)}
.cr-card[aria-pressed="true"] .cr-cw{color:var(--hi-ink)}
.cr-chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.92rem;min-height:32px}
.cr-chk input,.cr-sw input{width:20px;height:20px;accent-color:var(--ink)}
.cr-player{margin:0 0 10px}
.cr-cnt,.cr-sws{border:1.5px solid var(--rule);border-radius:8px;padding:6px 12px 8px;margin:0 0 12px}
.cr-cnt legend,.cr-sws legend{font-weight:700;font-size:.88rem;color:var(--ink-2);padding:0 4px}
.cr-cnt .numrow{flex-wrap:wrap}
.cr-cnt label{font-size:.9rem}
.cr-sw{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-height:36px;font-size:.92rem}
.cr-swn{font-weight:700}
.cr-swst{font-size:.82rem;color:var(--ink-2)}
.cr-sw.stop .cr-swn{opacity:.5}
.cr-swst.s-running{color:var(--green)}
.cr-swst.s-noO2,.cr-swst.s-noNAD{color:var(--red);font-weight:700}
.cr-note{margin-top:10px}
.read > div.cr-hotr{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi) inset;border-radius:4px;padding-left:6px;padding-right:6px}
/* S3 ledger */
.cr-led{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.cr-led summary{cursor:pointer;font-weight:700;font-size:.9rem}
.cr-ltw{margin:8px 0}
.cr-lt{border-collapse:collapse;font-size:.8rem;width:100%;min-width:300px}
.cr-lt th,.cr-lt td{border:1px solid var(--rule);padding:3px 4px;text-align:center}
.cr-lt th[scope="row"]{text-align:left;font-weight:700}
.cr-lt thead th{font-size:.74rem;line-height:1.2}
.cr-lt tr.off th,.cr-lt tr.off td{color:var(--ink-2);opacity:.6}
.cr-lt tr.tot th,.cr-lt tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.cr-tals{margin:6px 0}
.cr-tr{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:8px;align-items:center;margin:4px 0;font-size:.86rem}
.cr-tn{font-weight:700}
.cr-tal{display:inline-flex;flex-wrap:wrap;gap:2px;min-width:0}
.cr-tal i{display:block;width:6px;height:11px;border-radius:2px;background:var(--c)}
.cr-eb{margin:8px 0 2px}
.cr-ebh{margin:0 0 4px;font-size:.86rem;font-weight:700}
.cr-br{display:grid;grid-template-columns:8.4em minmax(0,1fr) 3.8em;align-items:center;gap:8px;font-size:.84rem;margin:3px 0}
.cr-br b{white-space:nowrap}
.cr-bt{position:relative;height:12px;border:1px solid var(--rule);border-radius:6px;background:var(--plot-grid);overflow:hidden}
.cr-bt i{display:block;height:100%;box-sizing:border-box}
.cr-bs{background:var(--c)}
.cr-bo{border:2px solid var(--c);background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--c) 40%,transparent) 4px 6px)}
.cr-br b{text-align:right;font-variant-numeric:tabular-nums}
.cr-lnote{margin:4px 0 0}

/* Part 3 */
.cr-s h3{margin-top:0}
.cr-vtray{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cr-venn{position:relative;max-width:560px;margin:10px auto 4px}
.cr-vsvg{display:block;width:100%;height:auto}
.cr-vc1{fill:color-mix(in srgb,var(--leaf) 12%,transparent);stroke:var(--ink-2);stroke-width:2}
.cr-vc2{fill:color-mix(in srgb,var(--bio-carbon) 12%,transparent);stroke:var(--ink-2);stroke-width:2}
.cr-vbtns{position:absolute;inset:0}
.cr-vb{position:absolute;top:24%;height:52%;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px dashed var(--ink-2);border-radius:12px;background:color-mix(in srgb,var(--sheet) 70%,transparent);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;padding:2px}
.cr-vb.ready{border:2px solid var(--ink);background:color-mix(in srgb,var(--hi) 30%,var(--sheet))}
.cr-vb:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.cr-vlists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.cr-vl{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--sheet)}
.cr-vl h4{margin:0 0 4px;font-size:.92rem}
.cr-vl ul{margin:0;padding-left:1.1em;font-size:.88rem}
.cr-vl li.muted{list-style:none;margin-left:-1.1em}
.cr-loop{max-width:520px;margin:6px auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:6px}
.cr-larc{fill:none;stroke:var(--ink-2);stroke-width:2.2}
.cr-larch{fill:none;stroke:var(--ink-2);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cr-lbox{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.cr-lbt{font:700 12.5px var(--font-ui);fill:var(--ink)}
.cr-lmol{font:700 12px var(--font-ui);fill:var(--ink)}
.cr-photon,.cr-heat{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cr-heat{stroke-dasharray:2 3}
.cr-elab{font:700 10.5px var(--font-ui);fill:var(--ink)}
.cr-faint{opacity:.35}
.cr-halo2{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2.5}
.cr-en{fill:var(--ink);stroke:var(--sheet);stroke-width:1}
.cr-lcap{margin:6px 0 0}
.cr-key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;margin:6px 0 10px}
.cr-key span{display:inline-flex;align-items:center;gap:6px}
.cr-swc{display:inline-block;width:1em;height:1em;border-radius:3px;border:1.5px solid var(--ink)}
.cr-tubes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cr-tb{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);font:inherit;padding:6px 4px 8px;cursor:pointer;min-height:44px}
.cr-tb:hover{border-color:var(--ink-2)}
.cr-tb.on{border-color:var(--ink)}
.cr-tb:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.cr-tube{display:block;width:64px;height:auto}
.cr-tbn{font-weight:700;font-size:.92rem}
.cr-tbc{font-size:.8rem;color:var(--ink-2);text-align:center}
.cr-tbr{font-weight:700;font-size:.86rem}
.cr-sun{fill:none;stroke:var(--ink);stroke-width:1.8}
.cr-sunr{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.cr-moon{fill:var(--ink-2);stroke:var(--ink);stroke-width:1}
.cr-stop{fill:var(--ink-2)}
.cr-glass{fill:none;stroke:var(--ink);stroke-width:2}
.cr-glass-b{fill:var(--sheet)}
.cr-liq{stroke:var(--ink);stroke-width:1}
.cr-liq0{fill:var(--plot-grid);stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.cr-elo{fill:none;stroke:var(--leaf);stroke-width:2.6;stroke-linecap:round}
.cr-snb{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.cr-sns{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.cr-snl{fill:none;stroke:var(--ink);stroke-width:1.2}
.cr-pea{fill:var(--leaf);stroke:var(--ink);stroke-width:1}
.cr-pea.dry{fill:var(--bio-carbon)}
.cr-pea.boiled{fill:var(--sheet)}
.cr-pea.bead{fill:var(--sheet);stroke-dasharray:2 1.5}
.cr-gauze{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:2 2}
.cr-jl{margin:12px 0 0;padding-left:1.2em}
.cr-jl li{margin:4px 0}
.cr-jl li.new{background:var(--hi-soft);border-radius:4px}
.cr-jclose{margin:8px 0 0}
/* Practice */
.cr-unit{font-weight:700}
/* Task */
.cr-conds{margin:.4em 0 .8em}
.cr-tkin{display:grid;gap:10px;margin:10px 0 14px}
.cr-tkh{margin:0 0 6px;font-size:.95rem}
.cr-tkts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cr-tkt{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px}
.cr-tkt .cr-tube{width:70px}
.cr-tkl{margin:6px 0 0;font-size:.88rem;text-align:center}

@media (max-width:820px){
  .cr-vlists{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  /* map text grows on phones so it stays readable when the 420-unit drawing is about 320 px wide */
  .cr-zn{font-size:14px}.cr-pt{font-size:12.5px}.cr-stt{font-size:13.5px}.cr-sts{font-size:12px}
  .cr-lab,.cr-clab,.cr-tot{font-size:12.5px}.cr-sub{font-size:12.5px}.cr-tt{font-size:10.5px}.cr-tagt{font-size:11px}
  .cr-lbt{font-size:14px}.cr-lmol{font-size:13.5px}.cr-elab{font-size:12.5px}
  .cr-tubes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cr-cards{grid-template-columns:minmax(0,1fr)}
  .cr-vb{font-size:.74rem;padding:0}
}

</style>
</head>

<script>window.MV_PAYLOAD={"meta":{"id":"13-overview-of-cellular-respiration","nn":"13","slug":"overview-of-cellular-respiration","course":"sbi4u","site":"sbi4u","code":"SBI4U","kind":"topic","groupLabel":"Unit 2","groupName":"Cellular Respiration","trivium":"","size":"S","storageKey":"sbi4u-13-overview-of-cellular-respiration-v1","progressKey":"sbi4u-progress-v1:13-overview-of-cellular-respiration","toolkit":"1.0.8"},"course":{"course":"sbi4u","site":"sbi4u","code":"SBI4U","title":"Biology","modules":[{"nn":"01","slug":"leaf-structure","title":"Leaf Structure","kind":"topic","group":"1"},{"nn":"02","slug":"light-and-pigments","title":"Light and Photosynthetic Pigments","kind":"topic","group":"1"},{"nn":"03","slug":"chlorophyll-and-chloroplasts","title":"Chlorophyll and Chloroplasts","kind":"topic","group":"1"},{"nn":"04","slug":"overview-of-photosynthesis","title":"Overview of Photosynthesis","kind":"topic","group":"1"},{"nn":"05","slug":"noncyclic-electron-flow","title":"Noncyclic Electron Flow","kind":"topic","group":"1"},{"nn":"06","slug":"light-reactions","title":"Light Reactions","kind":"topic","group":"1"},{"nn":"07","slug":"stomata","title":"Stomata Opening and Closing","kind":"topic","group":"1"},{"nn":"08","slug":"the-calvin-cycle","title":"The Calvin Cycle","kind":"topic","group":"1"},{"nn":"09","slug":"c3-c4-cam","title":"C3, C4 and CAM Photosynthesis and Photorespiration","kind":"topic","group":"1"},{"nn":"10","slug":"introduction-to-metabolism","title":"Introduction to Metabolism","kind":"topic","group":"2"},{"nn":"11","slug":"redox-reactions","title":"Redox Reactions","kind":"topic","group":"2"},{"nn":"12","slug":"nad-and-fad","title":"NAD⁺ and FAD","kind":"topic","group":"2"},{"nn":"13","slug":"overview-of-cellular-respiration","title":"Overview of Cellular Respiration","kind":"topic","group":"2"},{"nn":"14","slug":"glycolysis","title":"Glycolysis","kind":"topic","group":"2"},{"nn":"15","slug":"krebs-cycle","title":"Krebs Cycle","kind":"topic","group":"2"},{"nn":"16","slug":"electron-transport-chain","title":"The Electron Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"827258e7","content":{"id":"13-overview-of-cellular-respiration","kind":"topic","title":"Overview of cellular respiration","topic":"Overview of Cellular Respiration","readyTopic":"the overview of cellular respiration","hero":{"eq":"\u003cspan class=\"cr-heq\">\u003cspan class=\"bio-chem\">C₆H₁₂O₆ + 6O₂ →\u003c/span> \u003cspan class=\"bio-chem\">6CO₂ + 6H₂O\u003c/span> \u003cspan class=\"bio-chem\">+ energy \u003cspan class=\"cr-heq-n\">(ATP + heat)\u003c/span>\u003c/span>\u003c/span>","eqLabel":"C₆H₁₂O₆ plus 6 O₂ gives 6 CO₂ plus 6 H₂O plus energy, as ATP and heat","eqSize":"sm","headline":"One sugar, four stages, about 36 ATP.","text":"Every cell in your body breaks down glucose to release energy: \u003cstrong>cellular respiration\u003c/strong>. It happens in four stages: \u003cstrong>glycolysis\u003c/strong> in the cytosol, then \u003cstrong>pyruvate oxidation\u003c/strong>, the \u003cstrong>Krebs cycle\u003c/strong> and the \u003cstrong>electron transport chain\u003c/strong> in the mitochondria. Oxygen waits at the very end, ready to accept the electrons.","fig":{"html":"\u003cdiv class=\"cr-hero\" id=\"cr-hero\" role=\"img\" aria-label=\"A cell with a mitochondrion. A brown glucose hexagon enters the cytosol and splits into two pyruvates, making 2 ATP (glycolysis). The pyruvates enter the matrix, each losing a CO₂ (pyruvate oxidation), and two acetyl groups enter a turning wheel (the Krebs cycle), which releases 4 more CO₂. Teal NADH and cerulean FADH₂ carry electrons to the inner membrane, where blue O₂ becomes H₂O and ATP synthase turns out orange ATP. Total: about 36 ATP (textbook), about 30 to 32 (current estimate).\">\u003c/div>"}},"goals":["I can write the summary equation for aerobic respiration and say where the energy goes.","I can name the four stages of aerobic respiration and where in the cell each one happens.","I can list the main inputs and outputs of each stage, per glucose.","I can trace the carbon, hydrogen and oxygen atoms from the reactants to the products.","I can compare respiration with photosynthesis using a flow chart or table.","I can plan and interpret a simple investigation of the products of respiration."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Cell structures","goal":2,"prompt":"Which organelle carries out most of aerobic cellular respiration?","options":[{"t":"The mitochondrion","why":"Pyruvate oxidation, the Krebs cycle and the chain all happen there.","_n":"08bd","_k":"479a4820"},{"t":"The lungs","why":"Lungs are organs for breathing; respiration happens inside cells.","_n":"18ad","_k":"24d13f79"},{"t":"The nucleus","why":"The nucleus holds DNA.","_n":"289d","_k":"3475b3f2"},{"t":"The chloroplast","why":"Chloroplasts carry out photosynthesis.","_n":"388d","_k":"00ef5aba"}],"hints":["It’s called the powerhouse of the cell.","It has a folded inner membrane.","Mitochondrion."]},{"id":"w2","skill":"Cell structures","goal":2,"prompt":"The folds of the inner mitochondrial membrane are called…","options":[{"t":"thylakoids","why":"Those are in chloroplasts.","_n":"487d","_k":"4244a08a"},{"t":"the matrix","why":"The matrix is the fluid inside the inner membrane.","_n":"586d","_k":"ddf85d72"},{"t":"cristae","why":"They give the membrane a large area for the electron transport chain.","_n":"685d","_k":"799dd37d"},{"t":"ribosomes","why":"Ribosomes make proteins.","_n":"794d","_k":"21db1555"}],"hints":["It’s a Latin word for ‘crests’.","Not the fluid, but the folds.","Cristae."]},{"id":"w3","skill":"The summary equation","goal":1,"prompt":"Which are the reactants of aerobic respiration?","options":[{"t":"Glucose and oxygen","why":"\u003cspan class=\"bio-chem\">C₆H₁₂O₆ + 6O₂ → …\u003c/span>","_n":"893d","_k":"d4421e02"},{"t":"Oxygen and water","why":"Water is a product.","_n":"98a3","_k":"48b2bd6c"},{"t":"Carbon dioxide and water","why":"Those are the products.","_n":"a8b3","_k":"bcf17243"},{"t":"Glucose and carbon dioxide","why":"CO₂ is released, not used.","_n":"b883","_k":"18f6f6aa"}],"hints":["What do you need to breathe in and eat?","Food (glucose) and O₂.","Glucose and oxygen."]},{"id":"w4","skill":"The summary equation","goal":1,"prompt":"How many CO₂ molecules form from one glucose?","options":[{"t":"1","why":"One per carbon atom.","_n":"c893","_k":"7de00952"},{"t":"3","why":"Two pyruvates of 3 C each: 6 total.","_n":"d8e3","_k":"9ad3da1d"},{"t":"6","why":"Glucose has 6 carbons, and each leaves as one CO₂.","_n":"e8f3","_k":"44fdef40"},{"t":"12","why":"12 is the number of O atoms in 6CO₂.","_n":"f8c3","_k":"14a1e879"}],"hints":["Count glucose’s carbons.","C₆.","6 CO₂."]},{"id":"w5","skill":"Electron carriers","goal":3,"prompt":"Which carriers take electrons from glucose to the chain?","options":[{"t":"NADPH and NADP⁺","why":"NADPH is the photosynthesis (anabolic) carrier.","_n":"g8d3","_k":"c0f74db3"},{"t":"ATP and ADP","why":"ATP carries energy, not electrons.","_n":"h923","_k":"e8225b19"},{"t":"NADH and FADH₂","why":"Loaded in glycolysis, pyruvate oxidation and the Krebs cycle.","_n":"i933","_k":"682ee6aa"},{"t":"O₂ and H₂O","why":"O₂ is the final acceptor.","_n":"j243","_k":"653aa530"}],"hints":["Think of module 12.","The loaded forms.","NADH and FADH₂."]},{"id":"w6","skill":"Electron carriers","goal":3,"prompt":"Per glucose, how many NADH are loaded altogether?","options":[{"t":"2","why":"That’s glycolysis only.","_n":"k233","_k":"409b70fe"},{"t":"6","why":"That’s the Krebs cycle only.","_n":"l223","_k":"b730d670"},{"t":"10","why":"2 + 2 + 6.","_n":"m213","_k":"f5229b15"},{"t":"12","why":"There are 10 NADH and 2 FADH₂.","_n":"n203","_k":"1086bc50"}],"hints":["Add three stages.","Glycolysis 2, pyruvate oxidation 2, Krebs 6.","10."]}],"refreshers":{"Cell structures":"A mitochondrion has an outer membrane, an inner membrane folded into cristae, the intermembrane space between them, and the matrix inside.","The summary equation":"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy. Glucose’s 6 carbons give 6 CO₂.","Electron carriers":"10 NADH and 2 FADH₂ per glucose carry electrons to the chain, where O₂ accepts them."}}},"explore":{"heading":"Respiration map","intro":"Place each stage where it happens, follow the atoms through the whole process, then switch stages on and off to see what each one contributes.","stages":[{"id":"gly","t":"Glycolysis","short":"Glycolysis"},{"id":"po","t":"Pyruvate oxidation","short":"Pyruvate oxidation"},{"id":"kr","t":"Krebs cycle","short":"Krebs cycle"},{"id":"ch","t":"Electron transport and chemiosmosis","short":"Chain"}],"zones":[{"id":"cyto","t":"cytosol"},{"id":"om","t":"outer membrane"},{"id":"ims","t":"intermembrane space"},{"id":"im","t":"inner membrane (cristae)"},{"id":"matrix","t":"matrix"},{"id":"nuc","t":"nucleus"}],"atoms":[{"id":"c","t":"Carbon from glucose","iso":"¹⁴C","end":"CO₂","short":"C from glucose"},{"id":"h","t":"Hydrogen from glucose","iso":"³H","end":"H₂O","short":"H from glucose"},{"id":"o2","t":"Oxygen from O₂","iso":"¹⁸O","end":"H₂O","short":"O from O₂"},{"id":"og","t":"Oxygen from glucose","iso":"¹⁸O","end":"CO₂","short":"O from glucose"}],"modelNote":"Per glucose. ATP: textbook (eukaryote) 36, current estimate ≈ 30–32; module 19 explains the difference. Energy: ATP ≈ 30.5 kJ/mol, glucose ≈ 2870 kJ/mol.","waterNote":"The chain forms 12 H₂O per glucose, but other steps use some water, so the net is 6 H₂O.","predictions":[{"id":"p1","prompt":"Where does glycolysis happen?","options":[{"t":"On the inner membrane","_n":"o1f3","_k":"d521ce2e"},{"t":"In the cytosol","_n":"p1e3","_k":"513e5595"},{"t":"In the matrix","_n":"q1d3","_k":"e9a6d71e"},{"t":"In the intermembrane space","_n":"r1c3","_k":"e372d86a"}],"explain":"Glycolysis happens outside the mitochondrion, which is why even cells without mitochondria (like red blood cells) can do it.","start":{"mode":"a"}},{"id":"p2","prompt":"A cell is given O₂ labelled with ¹⁸O. Where will the label appear?","options":[{"t":"In ATP","_n":"s1b3","_k":"e1f49b8e"},{"t":"In CO₂","_n":"t1e3","_k":"e8e9be16"},{"t":"In glucose","_n":"u1f3","_k":"dc160e0c"},{"t":"In water","_n":"v203","_k":"b162b67b"}],"explain":"O₂ is the final electron acceptor; it becomes water. The CO₂’s oxygen came from glucose and water.","start":{"mode":"b","atom":"o2","label":true}},{"id":"p3","prompt":"Which stage releases the most CO₂ per glucose?","options":[{"t":"The chain (6)","_n":"w213","_k":"7d0360bc"},{"t":"The Krebs cycle (4)","_n":"x1a3","_k":"ae4aede9"},{"t":"Pyruvate oxidation (2)","_n":"y1b3","_k":"051275a4"},{"t":"Glycolysis (2)","_n":"z1c3","_k":"8747e822"}],"explain":"Glycolysis releases no CO₂. Pyruvate oxidation releases 2 and the Krebs cycle 4.","start":{"mode":"c","on":[],"o2":true}},{"id":"p4","prompt":"All four stages are running. Then the O₂ is switched off. What happens?","options":[{"t":"Only the chain stops; the other stages carry on","_n":"101d3","_k":"1f5a4e8e"},{"t":"Nothing changes","_n":"11163","_k":"4fc5cd6d"},{"t":"The chain stops; then pyruvate oxidation and the Krebs cycle stop because NAD⁺ isn’t regenerated; glycolysis continues only if the cell ferments","_n":"12173","_k":"91580b38"},{"t":"Everything stops at once, including glycolysis, which uses O₂","_n":"13183","_k":"8f3d64fd"}],"explain":"O₂ is used only at the chain, but the other stages need the NAD⁺ the chain gives back.","start":{"mode":"c","on":["gly","po","kr","ch"],"o2":true}}],"challenges":[{"id":"tc1","goal":2,"prompt":"\u003cstrong>Place the stages:\u003c/strong> place all four stages correctly.","why":"Glycolysis: cytosol. Pyruvate oxidation and the Krebs cycle: matrix. Electron transport: inner membrane.","hints":["Only one stage happens outside the mitochondrion.","Two stages share the matrix.","Cytosol; matrix; matrix; inner membrane."]},{"id":"tc2","goal":4,"prompt":"\u003cstrong>Follow the atoms:\u003c/strong> follow the carbon. Enter how many of glucose’s carbons leave as CO₂ in pyruvate oxidation, and how many in the Krebs cycle.","why":"Each pyruvate (3C) loses one carbon as CO₂ in pyruvate oxidation (2 in all); the remaining 4 carbons leave in the Krebs cycle.","hints":["Each pyruvate (3C) becomes acetyl (2C) + CO₂.","2 pyruvates → 2 CO₂.","The remaining 4 carbons leave in the Krebs cycle."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"\u003cstrong>Stage switches:\u003c/strong> set the switches so that, per glucose, the cell loads \u003cstrong>exactly 4 NADH\u003c/strong> and releases \u003cstrong>exactly 2 CO₂\u003c/strong>.","why":"Glycolysis loads 2 NADH and releases no CO₂; pyruvate oxidation loads 2 NADH and releases 2 CO₂. Stopping before the Krebs cycle gives 4 NADH and 2 CO₂.","hints":["Which stages produce NADH? Which release CO₂?","Glycolysis: 2 NADH, 0 CO₂. Pyruvate oxidation: 2 NADH, 2 CO₂.","Run those two and stop before the Krebs cycle."]}]},"part3":{"slug":"cycle","name":"The cycle","heading":"Photosynthesis and respiration as a cycle","intro":"The two processes are linked end of the chain. The other stages depend on O₂ only indirectly, because they need NAD⁺ back.","_n":"2r189","_k":"08c1adc7"}]},"b":{"prompt":"Which stage needs no mitochondria at all?","options":[{"t":"Glycolysis","why":"It runs in the cytosol.","_n":"2s199","_k":"d9738728"},{"t":"The Krebs cycle","why":"Glycolysis: cytosol. Pyruvate oxidation and the Krebs cycle: matrix. Electron transport: inner membrane.","_n":"2t169","_k":"a20ba65b"},{"t":"The chain","why":"It’s in the inner membrane.","_n":"2u179","_k":"9e23e667"},{"t":"Pyruvate oxidation","why":"It happens in the matrix.","_n":"2v149","_k":"5521e9bf"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A mouse breathes O₂ labelled with ¹⁸O. In which product will most of the label first appear?","options":[{"t":"Glucose","why":"Glucose is broken down, not made.","_n":"2w159","_k":"48ae470b"},{"t":"Carbon dioxide","why":"The oxygen atoms of O₂ end up in water at the end of the chain. CO₂’s oxygen comes from glucose (and water).","_n":"2x129","_k":"8959842b"},{"t":"ATP","why":"O₂ isn’t built into ATP.","_n":"2y139","_k":"ba5dc79f"},{"t":"Water","why":"O₂ is reduced to H₂O at complex IV.","_n":"2z209","_k":"20285a75"}]},"b":{"prompt":"Yeast is fed glucose labelled with ¹⁴C. In which product will the label appear?","options":[{"t":"O₂","why":"O₂ has no carbon.","_n":"30219","_k":"ed8aba82"},{"t":"Carbon dioxide","why":"All of glucose’s carbons leave as CO₂.","_n":"311ea","_k":"73977cd5"},{"t":"ATP","why":"ATP’s carbon comes from its own ribose and adenine, not from this glucose.","_n":"321da","_k":"cfef32d4"},{"t":"Water","why":"Water has no carbon.","_n":"3320a","_k":"58fa7d70"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"Bromothymol blue with germinating seeds turns from blue to yellow in 20 min; with boiled seeds it stays blue. What is the best conclusion?","options":[{"t":"Boiled seeds respire faster","why":"Boiled seeds are dead.","_n":"341fa","_k":"7516d6c4"},{"t":"Living seeds respire and release CO₂, which acidifies the BTB","why":"The boiled-seed control rules out everything except living, respiring seeds.","_n":"3522a","_k":"61e7d947"},{"t":"Living seeds release O₂, which turns BTB yellow","why":"Limewater turns milky with CO₂. Bromothymol blue turns yellow as CO₂ (acid) builds up.","_n":"3621a","_k":"52004e10"},{"t":"BTB breaks down near seeds","why":"The control shows the BTB is stable.","_n":"3724a","_k":"178fa750"}]},"b":{"prompt":"In a sealed flask, the limewater with germinating peas turns milky, and with glass beads it stays clear. What is the best conclusion?","options":[{"t":"The peas released O₂","why":"Limewater turns milky with CO₂. Bromothymol blue turns yellow as CO₂ (acid) builds up.","_n":"3823a","_k":"fb6f687c"},{"t":"The peas released CO₂ by respiring","why":"Milky limewater shows CO₂, and the glass-bead control shows the flask adds none.","_n":"3916a","_k":"8ee1d87e"},{"t":"The beads absorbed CO₂","why":"Beads are inert.","_n":"3a15a","_k":"08a13142"},{"t":"Limewater only reacts with peas","why":"Limewater reacts with CO₂.","_n":"3b8c9","_k":"8a8082d0"}]}},{"id":"t3","cat":"T","goal":[2,3],"a":{"prompt":"Red blood cells have no mitochondria. Which stage of respiration can they still carry out?","options":[{"t":"All four, using the cytosol","why":"The Krebs cycle and chain need mitochondria.","_n":"3c8d9","_k":"c04b0882"},{"t":"Only the Krebs cycle","why":"It needs a matrix.","_n":"3d8e9","_k":"e0cdabf0"},{"t":"Only glycolysis (then they must ferment to regenerate NAD⁺)","why":"Glycolysis runs in the cytosol; fermentation gives back the NAD⁺ it needs.","_n":"3e8f9","_k":"b0cd9411"},{"t":"None","why":"Glycolysis needs no mitochondria.","_n":"3f909","_k":"3c31a174"}]},"b":{"prompt":"Aerobic bacteria have no mitochondria. Where is their electron transport chain?","options":[{"t":"They have no chain, so they can’t respire aerobically","why":"Many bacteria respire aerobically.","_n":"3g919","_k":"7a4def20"},{"t":"In the cytosol, floating freely","why":"The chain needs a membrane to build an H⁺ gradient.","_n":"3h929","_k":"923af084"},{"t":"In their nucleus","why":"Bacteria have no nucleus.","_n":"3i939","_k":"2d915b30"},{"t":"In the cell (plasma) membrane","why":"Their membrane does the job of the inner mitochondrial membrane.","_n":"3j949","_k":"8123db8f"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best description of cellular respiration?","options":[{"t":"“A series of reactions in every cell that oxidizes glucose, using O₂ as the final electron acceptor, to capture energy as ATP.”","why":"It says where (every cell), what changes (glucose is oxidized), the role of O₂ and the product (ATP).","_n":"3k959","_k":"a7a53263"},{"t":"“Breathing in O₂ and out CO₂.”","why":"Breathing moves air; cellular respiration is the chemistry in every cell that uses O₂ to release energy from food.","_n":"3l929","_k":"0f1231c8"},{"t":"“Making glucose from CO₂ and water.”","why":"That’s photosynthesis.","_n":"3m919","_k":"c60b68ea"},{"t":"“Burning glucose in one step to make heat.”","why":"It happens in many steps, capturing ATP.","_n":"3n909","_k":"7743a78c"}]},"b":{"prompt":"Which flow chart best summarizes aerobic respiration?","options":[{"t":"glucose → (Krebs) → pyruvate → (glycolysis) → CO₂","why":"Glycolysis comes first.","_n":"3o8f9","_k":"dad6f9c0"},{"t":"glucose → (glycolysis) → pyruvate → (pyruvate oxidation) → acetyl-CoA → (Krebs) → CO₂ + NADH/FADH₂ → (chain) → H₂O + ATP","why":"The four stages in order, with each one’s main products.","_n":"3p969","_k":"642843db"},{"t":"glucose + light → O₂","why":"That mixes in photosynthesis.","_n":"3q959","_k":"7d5746f2"},{"t":"O₂ → (glycolysis) → CO₂","why":"O₂ is used in only one place: complex IV at the end of the chain. The other stages depend on O₂ only indirectly, because they need NAD⁺ back.","_n":"3r949","_k":"5b09c654"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which statement best compares photosynthesis and respiration?","options":[{"t":"“Energy cycles between them just like carbon.”","why":"Matter cycles; energy flows through once and leaves as heat.","_n":"3s939","_k":"4a0efe12"},{"t":"“They are the same reactions in the same organelle.”","why":"Different organelles, opposite directions.","_n":"3t9a9","_k":"b17acbd3"},{"t":"“Photosynthesis reduces CO₂ to sugar using light energy; respiration oxidizes sugar to CO₂ to make ATP. Atoms cycle between them, but energy ends as heat.”","why":"It gives each process’s direction and energy, and says that matter cycles while energy flows through.","_n":"3u999","_k":"ecfce2bd"},{"t":"“Plants photosynthesize and animals respire.”","why":"Plants respire all the time, day and night. In bright light photosynthesis just outpaces it.","_n":"3v90a","_k":"39b7486c"}]},"b":{"prompt":"Which statement about plants is correct?","options":[{"t":"“Plants respire all the time; in bright light their photosynthesis is faster than their respiration.”","why":"Respiration never stops; in light, photosynthesis runs on top of it.","_n":"3w91a","_k":"b9f52b3b"},{"t":"“Plants respire only at night.”","why":"Plants respire all the time, day and night. In bright light photosynthesis just outpaces it.","_n":"3x8ea","_k":"5f497104"},{"t":"“Plants don’t respire because they make their own O₂.”","why":"Plants respire all the time, day and night. In bright light photosynthesis just outpaces it.","_n":"3y8fa","_k":"5a10dc62"},{"t":"“Plants photosynthesize at night and respire by day.”","why":"Photosynthesis needs light.","_n":"3z94a","_k":"68e60de4"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Grain stored in a damp, sealed silo warms up and its CO₂ level rises. What is the best explanation?","options":[{"t":"The grain is photosynthesizing","why":"No light in a silo.","_n":"4095a","_k":"39d7db52"},{"t":"Respiration by the grain and by microbes releases heat and CO₂","why":"Heat and CO₂ are both products of respiration by living cells.","_n":"4192a","_k":"706f307f"},{"t":"Water reacts with grain to make CO₂","why":"That’s respiration, done by living cells.","_n":"4293a","_k":"706f4072"},{"t":"The silo’s walls trap sunlight","why":"The CO₂ rise points to respiration.","_n":"4398a","_k":"38cb9ce8"}]},"b":{"prompt":"A compost heap’s centre can reach 60 °C. What is the main source of the heat?","options":[{"t":"Sunlight stored in the heap","why":"Sunlight doesn’t warm the centre of the heap.","_n":"4499a","_k":"189bb2ea"},{"t":"Respiration by decomposer microbes, releasing energy as heat","why":"Most of the energy from respiring the plant material leaves as heat.","_n":"4596a","_k":"988cb9a7"},{"t":"Photosynthesis inside the heap","why":"No light inside the heap.","_n":"4695a","_k":"6ea9bbc4"},{"t":"Chemical reactions with no living things involved","why":"Microbes do the respiring.","_n":"4798a","_k":"89bdcb7c"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Endurance training increases the number of mitochondria in muscle cells. Which benefit follows most directly?","options":[{"t":"Muscles make glucose from CO₂","why":"That’s photosynthesis.","_n":"4897a","_k":"67bcc7e4"},{"t":"Muscles need less O₂","why":"More mitochondria use more O₂, efficiently.","_n":"4992a","_k":"b8c84884"},{"t":"More glycolysis in the mitochondria","why":"Glycolysis: cytosol. Pyruvate oxidation and the Krebs cycle: matrix. Electron transport: inner membrane.","_n":"4a91a","_k":"3880d20f"},{"t":"More ATP from aerobic respiration, so less reliance on fermentation","why":"More mitochondria can run more pyruvate oxidation, Krebs cycle and chain.","_n":"4b94a","_k":"fe3ed1d2"}]},"b":{"prompt":"A rare genetic disorder damages the electron transport chain. Which organs would you expect to be affected most?","options":[{"t":"None, because glycolysis makes most of the ATP","why":"The chain makes about 32 of 36.","_n":"4c93a","_k":"1ecf9ed3"},{"t":"High-energy organs such as the brain and heart","why":"They depend most on the chain’s ATP.","_n":"4d9ea","_k":"2e7673f1"},{"t":"Organs that photosynthesize","why":"Human organs don’t.","_n":"4e9da","_k":"b7fe5cba"},{"t":"Only the lungs","why":"The problem is in every cell’s mitochondria.","_n":"4f24a","_k":"b9dd5608"}]}}]},"task":{"title":"Design a fair respiration test","summary":"Design a fair respiration test","statement":"\u003cp>Set up two tubes and an indicator to show that germinating seeds release CO₂ by respiring. Every condition must be met. Can you find all the answers?\u003c/p>\u003col class=\"cr-conds\">\u003cli>Tube A will clearly respire: germinating peas at 25 °C.\u003c/li>\u003cli>Tube B (the control) can’t respire: boiled peas or glass beads.\u003c/li>\u003cli>It’s a fair test: both tubes are at the same temperature.\u003c/li>\u003cli>The indicator detects CO₂: limewater or bromothymol blue.\u003c/li>\u003c/ol>","aList":[{"id":"germ","t":"germinating peas"},{"id":"dry","t":"dry peas"},{"id":"boiled","t":"boiled peas"}],"bList":[{"id":"germ","t":"germinating peas"},{"id":"dry","t":"dry peas"},{"id":"boiled","t":"boiled peas"},{"id":"beads","t":"glass beads"}],"temps":[10,25],"inds":[{"id":"lime","t":"limewater"},{"id":"btb","t":"bromothymol blue"},{"id":"iodine","t":"iodine"}],"previewNote":"Model results after 20 min. Germinating peas respire fast at 25 °C and slowly at 10 °C; dry peas respire very slowly; boiled peas and glass beads don’t respire.","checks":["Tube A respires clearly","Control can’t respire","Fair test","Indicator detects CO₂"],"tips":["Germinating seeds respire fastest, and warmth speeds it up.","A control should be the same in every way but unable to respire.","Change only one thing between the tubes.","Iodine tests for starch, not CO₂."],"explainPrompt":"Explain what result you expect in each tube and what it would show about respiration.","vocab":"Use the words control, independent variable, dependent variable and carbon dioxide.","more":"Can you find all the answers?","allFound":"You’ve found all four answers.","afterAll":"Boiled peas control for ‘peas without life’; glass beads control for ‘something taking up the same space’. Doing both rules out more explanations."},"cards":[["Summary equation","C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (ATP + heat)."],["Glycolysis","Cytosol. Glucose → 2 pyruvate; net 2 ATP, 2 NADH."],["Pyruvate oxidation","Matrix. 2 pyruvate → 2 acetyl-CoA + 2 CO₂ + 2 NADH."],["Krebs cycle (per glucose)","Matrix. 4 CO₂, 6 NADH, 2 FADH₂, 2 ATP."],["Electron transport and chemiosmosis","Inner membrane. Carriers unload; O₂ → H₂O; ATP synthase makes most ATP."],["Where O₂ is used","Only at complex IV, as the final electron acceptor."],["Where O₂’s atoms go","Into water, not CO₂."],["ATP per glucose","≈ 36 (textbook, eukaryote); ≈ 30–32 (current estimate)."],["Mitochondrion parts","Outer membrane, intermembrane space, inner membrane (cristae), matrix."],["Testing for CO₂","Limewater turns milky; bromothymol blue turns yellow."],["Photosynthesis vs respiration","Reduce CO₂ with light energy vs oxidize sugar to make ATP. Matter cycles; energy flows."],["Plants respire too","All the time; in bright light photosynthesis outpaces respiration."]]}};</script>
