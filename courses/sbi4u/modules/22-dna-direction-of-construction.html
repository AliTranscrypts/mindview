y System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"91acbaf7","content":{"id":"22-dna-direction-of-construction","kind":"topic","title":"DNA direction of construction","topic":"DNA Direction of Construction","readyTopic":"the direction of DNA construction","hero":{"eq":"\u003cspan class=\"dd-heq\">\u003cspan class=\"dd-hl\">\u003cspan class=\"dd-seq\">3′-TACGTC-5′\u003c/span> \u003cspan class=\"dd-hlab\">template, read 3′ → 5′\u003c/span>\u003c/span>\u003cspan class=\"dd-hl dd-hn\">\u003cspan class=\"dd-seq\">5′-ATGCAG-3′\u003c/span> \u003cspan class=\"dd-hlab\">new strand, built 5′ → 3′\u003c/span>\u003c/span>\u003c/span>","eqLabel":"Template 3′ T A C G T C 5′, read 3′ to 5′. New strand 5′ A T G C A G 3′, built 5′ to 3′.","eqSize":"sm","headline":"Always 5′ to 3′, even when that means going backwards","text":"DNA polymerase adds nucleotides only to a \u003cstrong>3′ end\u003c/strong>, so every new strand grows \u003cstrong>5′ → 3′\u003c/strong>. On one template, that’s toward the opening fork: the \u003cstrong>leading strand\u003c/strong>. On the other, it’s away from the fork, so that strand is built in short \u003cstrong>Okazaki fragments\u003c/strong> that are later joined: the \u003cstrong>lagging strand\u003c/strong>.","fig":{"html":"\u003cdiv class=\"dd-hero\" id=\"dd-hero\" role=\"img\" aria-label=\"A replication fork drawn sideways as a Y. The upper template, 3′ on the left to 5′ on the right, has one long blue new strand growing toward the fork. The lower template, 5′ to 3′, has short blue pieces, each starting from a magenta primer and pointing away from the fork. Every blue piece grows 5′ to 3′. The fork opens one step; the long strand follows it; a new primer appears near the fork and a fragment grows backwards until it meets the previous one; polymerase I swaps the old primer for DNA and ligase seals the nick.\">\u003c/div>"}},"goals":["I can explain why new DNA is always built 5′ → 3′ and the template read 3′ → 5′.","I can describe how the lagging strand is made in Okazaki fragments, and the roles of primase, polymerase I and ligase.","I can decide whether a new strand is leading or lagging from the template’s direction and the fork’s movement.","I can count primers and forks for a stretch of DNA, a bubble or a chromosome with several origins.","I can describe proofreading, mismatch repair and excision repair, and use error rates to show how they combine.","I can explain the end-replication problem, telomeres and telomerase, and connect them to aging and cancer."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Strand ends","goal":1,"prompt":"What is at the 3′ end of a DNA strand?","options":[{"t":"A free –OH group on the sugar","why":"Carbon 3′ of deoxyribose.","_n":"0f02","_k":"5ee56dc8"},{"t":"A hydrogen bond","why":"Hydrogen bonds join bases across strands.","_n":"1f32","_k":"90131e75"},{"t":"A free phosphate group","why":"That’s the 5′ end. The phosphate hangs off carbon 5′.","_n":"2f22","_k":"50bb067b"},{"t":"A base with no partner","why":"Ends are about the backbone, not the bases.","_n":"3ed2","_k":"36e67dcd"}],"hints":["The numbers 3′ and 5′ name carbons on the sugar.","The 5′ carbon carries the phosphate.","The 3′ end has a free –OH."]},{"id":"w2","skill":"Strand ends","goal":1,"prompt":"A strand reads \u003cspan class=\"dd-seq\">5′-CATG-3′\u003c/span>. Its partner is written…","options":[{"t":"\u003cspan class=\"dd-seq\">5′-GTAC-3′\u003c/span>","why":"The partner runs the other way.","_n":"4ec2","_k":"9de5c425"},{"t":"\u003cspan class=\"dd-seq\">3′-CATG-5′\u003c/span>","why":"That copies instead of pairing.","_n":"5ef2","_k":"3a333815"},{"t":"\u003cspan class=\"dd-seq\">3′-GTAC-5′\u003c/span>","why":"Complementary and antiparallel.","_n":"6ee2","_k":"573d45aa"},{"t":"\u003cspan class=\"dd-seq\">3′-GUAC-5′\u003c/span>","why":"DNA uses T.","_n":"7e92","_k":"165d0ca0"}],"hints":["Pair the bases.","C–G, A–T, T–A, G–C.","\u003cspan class=\"dd-seq\">3′-GTAC-5′\u003c/span>."]},{"id":"w3","skill":"The fork’s enzymes","goal":2,"prompt":"Which enzyme lays down RNA primers?","options":[{"t":"DNA polymerase I","why":"Polymerase I \u003cstrong>removes\u003c/strong> primers.","_n":"8e82","_k":"76dd9da6"},{"t":"Primase","why":"Polymerase needs a 3′ end to start from.","_n":"9476","_k":"0177cc10"},{"t":"Ligase","why":"Ligase seals nicks.","_n":"a486","_k":"bb042d88"},{"t":"Helicase","why":"Helicase unwinds.","_n":"b496","_k":"f36acd4a"}],"hints":["The name hints at ‘first’.","It makes a short RNA start.","Primase."]},{"id":"w4","skill":"The fork’s enzymes","goal":2,"prompt":"Which enzyme seals the nicks in the backbone between new pieces of DNA?","options":[{"t":"Helicase","why":"Helicase breaks hydrogen bonds between strands.","_n":"c4a6","_k":"26a7a017"},{"t":"Gyrase","why":"Gyrase relieves twisting.","_n":"d436","_k":"346db2be"},{"t":"DNA ligase","why":"It forms the final phosphodiester bond.","_n":"e446","_k":"82c3cd23"},{"t":"Primase","why":"Primase starts pieces; it doesn’t join them.","_n":"f456","_k":"92a4e062"}],"hints":["‘Ligate’ means to tie.","It joins backbone to backbone.","DNA ligase."]},{"id":"w5","skill":"Base pairing","goal":3,"prompt":"Which template base pairs with an incoming adenine nucleotide?","options":[{"t":"Adenine","why":"Pairs are complementary, not identical.","_n":"g466","_k":"a6d7e398"},{"t":"Uracil","why":"Uracil is in RNA.","_n":"h4f6","_k":"0b699063"},{"t":"Thymine","why":"A–T.","_n":"i506","_k":"8ed562e8"},{"t":"Guanine","why":"G pairs with C.","_n":"j596","_k":"90e632a9"}],"hints":["A’s DNA partner?","Two hydrogen bonds.","T."]},{"id":"w6","skill":"Base pairing","goal":5,"prompt":"A new strand has G opposite a template T. What kind of error is this?","options":[{"t":"A thymine dimer","why":"Dimers are two neighbouring Ts on one strand, joined by UV.","_n":"k586","_k":"8c384895"},{"t":"A mismatch: G should pair with C, and T with A","why":"G–T isn’t one of the two allowed pairs, so it’s a mismatch.","_n":"l5b6","_k":"7f70f5e7"},{"t":"A correct pair","why":"G–T isn’t a Watson–Crick pair.","_n":"m5a6","_k":"61f2c3ba"},{"t":"A frameshift","why":"A frameshift is an insertion or deletion.","_n":"n556","_k":"7a3c6ed9"}],"hints":["What should pair with T?","A.","So G–T is a mismatch."]}],"refreshers":{"Strand ends":"The 5′ end has a free phosphate; the 3′ end has a free sugar –OH. Partners are antiparallel: \u003cspan class=\"dd-seq\">5′-CATG-3′\u003c/span> pairs with \u003cspan class=\"dd-seq\">3′-GTAC-5′\u003c/span>.","The fork’s enzymes":"Helicase unwinds, primase primes, polymerase III builds, polymerase I swaps primers for DNA, ligase seals.","Base pairing":"A–T and G–C. Any other pair is a mismatch."}}},"explore":{"heading":"Leading and lagging strands","intro":"Open the fork step by step. Place primers where polymerase can use them, and watch which new strand keeps up with the fork and which has to be built backwards in pieces.","howBoard":"Tap a template position (a circle on a template strand), then press \u003cstrong>Primase here\u003c/strong>. On a keyboard, the arrow keys move along a strand, up and down switch strands, and Enter places a primer.","modelNote":"Model rule: Okazaki fragments are 10 nucleotides long here. Real ones are about 1000–2000 nucleotides in bacteria and about 100–200 in eukaryotes. The model counts one primer per leading strand per fork, and polymerase I replaces every primer once its piece is built.","flagMsg":"Polymerase would have nothing to copy from here.","predictions":[{"id":"p1","prompt":"One fork opened 20 nt, both strands complete; now open 10 more. What does the leading strand need?","options":[{"t":"It waits until the lagging strand catches up","_n":"o546","_k":"3ce64b4d"},{"t":"A new primer","_n":"p576","_k":"177d3869"},{"t":"Nothing new: polymerase keeps extending its 3′ end toward the fork","_n":"q566","_k":"4a6e5a22"},{"t":"Ligase","_n":"r516","_k":"2ba98259"}],"explain":"Its 3′ end faces the fork, so each newly opened base can be added straight on. Leading: one primer per fork. Lagging: one primer per Okazaki fragment.","start":{"mode":"one","open":20,"build":"done"},"act":"open"},{"id":"p2","prompt":"The fork opens 40 nt with 10-nt fragments. How many primers will the \u003cstrong>lagging\u003c/strong> strand need?","options":[{"t":"0","_n":"s506","_k":"50c52035"},{"t":"1","_n":"t536","_k":"54775619"},{"t":"4","_n":"u546","_k":"f7be4ce8"},{"t":"40","_n":"v516","_k":"468196a5"}],"explain":"Every fragment starts from its own primer. Leading: one primer per fork. Lagging: one primer per Okazaki fragment.","start":{"mode":"one","open":40,"build":"none"},"act":"primeLag"},{"id":"p3","prompt":"Bubble mode, opened 20 nt each way. On the right fork, the top template carries the leading strand. On the left fork, the top template carries…","options":[{"t":"no new strand","_n":"w526","_k":"b8dceda3"},{"t":"both strands","_n":"x576","_k":"3d8479e1"},{"t":"the lagging strand","_n":"y586","_k":"4a3b15f0"},{"t":"the leading strand too","_n":"z556","_k":"c816fc85"}],"explain":"The forks move in opposite directions, so the roles swap. At a bubble the same template strand is leading on one fork and lagging on the other.","start":{"mode":"bub","open":20,"build":"right"},"act":"leftTop"},{"id":"p4","prompt":"Which direction is the lagging strand \u003cstrong>built\u003c/strong> in?","options":[{"t":"Both directions at once","_n":"10566","_k":"d1d57679"},{"t":"3′ → 5′, in pieces","_n":"114b6","_k":"82ed963b"},{"t":"5′ → 3′, in pieces pointing away from the fork","_n":"124c6","_k":"0ebc982e"},{"t":"3′ → 5′, continuously toward the fork","_n":"13d55","_k":"efe3766f"}],"explain":"Polymerase only adds to 3′ ends, so nothing is ever built 3′ → 5′.","start":{"mode":"one","open":40,"build":"lagPrimers"},"act":"extendLag"}],"challenges":[{"id":"tc1","goal":2,"prompt":"Fork opened 30 nt. Finish the lagging strand completely: no gaps, no RNA, no nicks.","why":"Three primers, polymerase III, polymerase I, then ligase: 30 nt of continuous DNA.","named":{"setup":"Use One fork mode with the fork opened 30 nt.","facing":"Its 3′ end must point away from the fork on this template.","gaps":"Each 10-nt stretch of the lagging template needs its own primer.","unbuilt":"Polymerase III hasn’t built the fragments yet.","rna":"RNA is still in the strand.","nicks":"The pieces aren’t joined."},"hints":["One primer per 10-nt fragment.","Extend with polymerase III, then replace the primers.","Primers → pol III → pol I → ligase."]},{"id":"tc2","goal":4,"prompt":"Fork opened 40 nt. Copy \u003cstrong>both\u003c/strong> strands using as few primers as possible.","why":"1 leading primer + 4 lagging primers = 5. The leading strand’s 3′ end keeps up with the fork.","named":{"setup":"Use One fork mode with the fork opened 40 nt.","lead":"The leading strand needs only one; its 3′ end keeps up with the fork.","lag":"The lagging strand needs one per fragment.","finish":"Both strands must be complete: build them, replace the primers and seal the nicks.","extra":"Both strands are done, but a primer was wasted. Clear the strands and try with fewer."},"hints":["How many does the leading strand need?","One. The lagging strand: 40 ÷ 10.","1 + 4 = 5."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Bubble mode: the bubble has opened 30 nt \u003cstrong>each way\u003c/strong> from the origin. Build every new strand completely. Use exactly as many primers as the job needs, and enter that number.","why":"Two forks, each with 1 leading primer and 3 lagging primers: 2 × (1 + 3) = 8.","named":{"setup":"Use Replication bubble mode with the bubble opened 30 nt each way.","n2":"Each fork has its own lagging strand.","n4":"That counts one fork’s lagging strand.","n6":"Each fork’s leading strand needs a primer too: 2 + 6.","finish":"Build all four new strands completely: no gaps, no RNA, no nicks.","extra":"All four strands are done, but more primers were used than the job needs.","count":"Count the primers again: the readout shows how many you laid down.","enter":"Enter the number of primers the job needs in the ‘Primers this bubble needs’ box."},"hints":["How many forks does one origin make?","Two forks, each with 1 leading primer and 30 ÷ 10 = 3 lagging primers.","2 × (1 + 3) = 8."]}]},"part3":{"slug":"repair","name":"Repair","heading":"Proofreading and repair","intro":"Zoom in from the fork to single base pairs. Step through each station, then use the error-rate data to see how the layers of checking combine.","st1":{"title":"Station 1: proofreading","steps":["A polymerase adds a G opposite a T.","A bump in the helix appears, and polymerase backs up one nucleotide.","It cuts the G off: its 3′ → 5′ exonuclease activity.","It adds the correct A and continues."],"short":["wrong base added","back up","cut it off","add A, carry on"],"card":"Proofreading happens during copying."},"st2":{"title":"Station 2: mismatch repair","steps":["A mismatch slipped through proofreading: G sits opposite T after copying.","Repair proteins detect the distortion and identify the \u003cstrong>new\u003c/strong> strand (in \u003cem>E. coli\u003c/em>, the parent strand carries chemical tags).","They cut out a stretch of the new strand.","A polymerase refills the gap, copying the parent strand.","Ligase seals it."],"short":["mismatch","detect, tell strands apart","cut out","refill","seal"],"card":"Polymerases (including polymerase II) take part in repair."},"st3":{"title":"Station 3: excision repair","steps":["UV light joins two neighbouring thymines into a \u003cstrong>thymine dimer\u003c/strong> that kinks the strand.","Enzymes cut out the damaged stretch.","A polymerase refills it.","Ligase seals it."],"short":["UV makes a dimer","cut out","refill","seal"],"card":"Health link: people with xeroderma pigmentosum lack this repair and are extremely sensitive to sunlight. For everyone, sunscreen and the UV index help limit the UV that makes dimers. Canada was the first country to report a daily UV index, starting in 1992."},"st4":{"title":"Station 4: error rates (data)","rows":[["Polymerase alone","1 in 100 000 (10⁵)"],["After proofreading","1 in 10 million (10⁷)"],["After mismatch repair","1 in a billion (10⁹)"]],"head":["Stage","Errors per base copied (approximate)"],"how":"Compute how much each layer improves the error rate, then the overall improvement. Type a whole number, then press Check.","asks":[{"id":"f1","t":"Proofreading improves the rate by","_a":"CAFR","wrong":[{"match":2,"fb":"Compare the rates, not the exponents: 10⁷ ÷ 10⁵ = 100."}]},{"id":"f2","t":"Mismatch repair improves it a further","_a":"CAFR","wrong":[{"match":2,"fb":"Compare the rates, not the exponents: 10⁹ ÷ 10⁷ = 100."}]},{"id":"f3","t":"Overall, the improvement is","_a":"CAFRU1I=","wrong":[{"match":200,"fb":"Each layer cuts the remaining errors by its factor, so the factors multiply."},{"match":4,"fb":"Compare the rates, not the exponents: 10⁹ ÷ 10⁵."}]}],"general":"Divide the later ‘1 in …’ number by the earlier one.","done":"✓ 100 × 100 = 10 000: each layer cuts the remaining errors by its factor, so the factors multiply."},"st5":{"title":"Station 5: the ends of the line","steps":["A linear chromosome end. The lagging strand’s last primer sits at the very tip.","The last primer is removed, and no 3′ end is available to fill the gap.","So the chromosome loses a little DNA each round. \u003cstrong>Telomeres\u003c/strong> (in humans, many repeats of \u003cspan class=\"dd-seq\">TTAGGG\u003c/span>) are the buffer.","\u003cstrong>Telomerase\u003c/strong> carries its own RNA template and extends the 3′ end."],"short":["last primer","gap can’t be filled","a little shorter","telomerase extends"],"card":"Telomerase is active in stem cells, germ-line cells and most cancer cells, but not in most body cells. Bacteria’s circular chromosomes have no ends, so no problem.","cells":[{"id":"body","t":"Most body cells","tel":false},{"id":"stem","t":"Stem or germ-line cell","tel":true},{"id":"cancer","t":"Most cancer cells","tel":true}],"model":"In this model a telomere starts with 8 repeat blocks, a division without telomerase loses 1 block, and the cell stops dividing when 2 blocks are left. Real telomeres hold thousands of repeats."},"quickCheck":{"title":"Quick check","summary":"Proofreading and repair quick check","items":[{"id":"q1","goal":5,"prompt":"Which repair removes a thymine dimer?","choices":[{"t":"Ligase alone","fb":"UV damage is cut out and refilled.","_n":"14d45","_k":"252f656d"},{"t":"Telomerase","fb":"UV damage is cut out and refilled.","_n":"15d35","_k":"f53a3aef"},{"t":"Excision repair","fb":"UV damage is cut out and refilled.","_n":"16d25","_k":"c3e2bf76"},{"t":"Proofreading","fb":"UV damage is cut out and refilled.","_n":"17d95","_k":"30f39f57"}]},{"id":"q2","goal":5,"prompt":"Proofreading happens…","choices":[{"t":"Only after copying","fb":"Polymerase checks each base as it adds it.","_n":"18d85","_k":"ef0d402d"},{"t":"Only in sunlight","fb":"Polymerase checks each base as it adds it.","_n":"19d75","_k":"7aa1d1f7"},{"t":"Only at telomeres","fb":"Polymerase checks each base as it adds it.","_n":"1ad65","_k":"07108202"},{"t":"During copying","fb":"Polymerase checks each base as it adds it.","_n":"1bcd5","_k":"ecdf5329"}]},{"id":"q3","goal":5,"prompt":"Rate 1 in 10⁵, then a 100× improvement. New rate?","choices":[{"t":"1 in 10⁶","fb":"10⁵ × 10² = 10⁷.","_n":"1ccc5","_k":"8162f5cc"},{"t":"1 in 10⁷","fb":"10⁵ × 10² = 10⁷.","_n":"1d4f5","_k":"46363fd8"},{"t":"1 in 10⁵⁰⁰","fb":"10⁵ × 10² = 10⁷.","_n":"1e505","_k":"8084561f"},{"t":"1 in 10³","fb":"10⁵ × 10² = 10⁷.","_n":"1f515","_k":"cd938779"}]},{"id":"q4","goal":6,"prompt":"Why don’t bacteria need telomerase?","choices":[{"t":"Their chromosome is circular","fb":"No ends, no end-replication problem.","_n":"1g525","_k":"1a711b28"},{"t":"They don’t divide","fb":"No ends, no end-replication problem.","_n":"1h535","_k":"3bdcc9b9"},{"t":"They have no DNA polymerase","fb":"No ends, no end-replication problem.","_n":"1i545","_k":"e0ac6aa7"},{"t":"Their DNA has no primers","fb":"No ends, no end-replication problem.","_n":"1j555","_k":"66386721"}]}]}},"practice":{"activities":[{"id":"order","type":"custom","title":"Put the steps in order","summary":"Put the steps in order","goal":[2,5],"instruction":"Two sequences. Tap the steps in the order they happen. A step that doesn’t belong can be left out.","sequences":[{"id":"s1","goal":2,"prompt":"One Okazaki fragment, from start to finish.","tiles":["Helicase opens a new stretch of the fork.","Primase lays down an RNA primer on the lagging template.","Polymerase III adds DNA to the primer’s 3′ end, moving away from the fork.","The fragment reaches the primer of the previous fragment.","Polymerase I replaces the RNA primer with DNA.","Ligase seals the nick between the fragments."],"_a":"YgFNUk5TSgQVBU1WPw==","wrongIf":[{"before":[4,2],"fb":"There’s nothing to replace yet; the fragment hasn’t been built."},{"before":[5,4],"fb":"Ligase can’t join DNA to RNA; the primer must be replaced first."},{"before":[2,1],"fb":"Polymerase needs the primer’s 3′ end. Leading: one primer per fork. Lagging: one primer per Okazaki fragment."}],"why":"Open, prime, extend away from the fork, meet the previous fragment, swap its primer for DNA, seal.","hints":["What does polymerase need first?","A primer, then extension.","Replace the RNA, then seal."]},{"id":"s2","goal":5,"prompt":"Mismatch repair.","tiles":["Polymerase leaves a mismatched pair that proofreading missed.","Repair proteins detect the distortion in the helix.","The new strand is identified and a stretch of it is cut out.","A polymerase refills the gap using the parent strand as template.","Ligase seals the backbone.","The parent strand is identified and a stretch of it is cut out."],"_a":"YgFNUk5TSgQVBTw=","bad":[{"tile":5,"fb":"The parent strand holds the correct sequence."}],"wrongIf":[{"before":[2,1],"fb":"Damage has to be found before it’s cut out."}],"why":"Find the mismatch, tell the new strand from the parent, cut out the new stretch, refill from the parent, seal."}]},{"id":"puzzles","type":"custom","title":"Direction and counting puzzles","summary":"Direction and counting puzzles","star":true,"goal":[1,4,5,6],"instruction":"Six puzzles. Items 3–6 are non-routine (★); items 4 and 5 go beyond the Final Check.","items":[{"id":"d1","kind":"seq","goal":1,"prompt":"Template \u003cspan class=\"dd-seq\">3′-TACGGA-5′\u003c/span>. Write the new strand with its ends.","template":"TACGGA","_a":"YhNUQU5DJ2N+ciI3QDw=","display":"\u003cspan class=\"dd-seq\">5′-ATGCCT-3′\u003c/span>","why":"Complementary and antiparallel: the new strand’s left end is 5′.","wrongEnds":"The new strand is antiparallel to the template.","wrongBases":"Pair each base with its partner: A–T and G–C.","wrongU":"DNA uses T, not U.","sameStrand":"That’s the same strand written from its other end. Lined up under the template, it reads \u003cspan class=\"dd-seq\">5′-ATGCCT-3′\u003c/span>."},{"id":"d2","kind":"chips","goal":1,"prompt":"To which end of a growing strand does polymerase add nucleotides?","options":[{"t":"3′","why":"Only the 3′ –OH can form the next bond.","_n":"1k565","_k":"0c0dc4b8"},{"t":"Both at once","why":"Only the 3′ –OH can form the next bond.","_n":"1l475","_k":"77d55a26"},{"t":"5′","why":"Only the 3′ –OH can form the next bond. No strand is ever built 3′ → 5′. The lagging strand is built 5′ → 3′ too, in short pieces that point away from the fork.","_n":"1m485","_k":"64b39f9c"},{"t":"Either","why":"Only the 3′ –OH can form the next bond.","_n":"1nc15","_k":"a252910b"}]},{"id":"d3","kind":"num","goal":4,"star":true,"prompt":"A bacterial lagging strand of 6000 nucleotides is made in 1000-nucleotide fragments. How many primers does it need?","_a":"Dw==","display":"6 primers","why":"6000 ÷ 1000 = 6 fragments, one primer each.","wrong":[{"match":1,"fb":"That’s the leading strand’s count. Leading: one primer per fork. Lagging: one primer per Okazaki fragment."}],"general":"One primer per fragment: how many fragments?"},{"id":"d4","kind":"num","goal":5,"star":true,"prompt":"A bacterium copies a 4 000 000-bp chromosome with 1 error per billion bases copied. On average, how many divisions pass before one error is made?","_a":"CwRR","display":"250 divisions","why":"4 × 10⁶ ÷ 10⁹ = 0.004 errors per copy, so one error every 1 ÷ 0.004 = 250 copies.","wrong":[{"match":4000000,"fb":"Expected errors per copy = 4 000 000 ÷ 1 000 000 000 = 0.004, so 1 ÷ 0.004 = 250."},{"match":0.004,"fb":"That’s the errors per copy. How many copies pass before one error?"}],"general":"Work out the errors per single copy first.","hints":["How many errors per single copy of the chromosome?","4 × 10⁶ ÷ 10⁹ = 0.004.","One error every 1 ÷ 0.004 = 250 copies."]},{"id":"d5","kind":"num","goal":6,"star":true,"prompt":"In a model, a cell’s telomere is 8000 bp and shrinks by 50 bp per division. The cell stops dividing at 5000 bp. How many divisions can it make?","_a":"DwE=","display":"60 divisions","why":"Only 8000 − 5000 = 3000 bp can be lost: 3000 ÷ 50 = 60.","wrong":[{"match":160,"fb":"Only the 3000 bp above the limit can be lost: 3000 ÷ 50."},{"match":100,"fb":"That’s how far 5000 bp would last. Only the 3000 bp above the limit can be lost."}],"general":"How much telomere can be lost before the limit?","hints":["How much telomere can be lost?","8000 − 5000 = 3000 bp.","3000 ÷ 50 = 60."]},{"id":"d6","kind":"num","goal":4,"star":true,"prompt":"A linear chromosome has 3 origins. How many replication forks form?","_a":"Dw==","display":"6 forks","why":"Each origin opens a bubble with 2 forks: 3 × 2 = 6.","wrong":[{"match":3,"fb":"Each origin opens a bubble with 2 forks. At a bubble the same template strand is leading on one fork and lagging on the other."}],"general":"How many forks does one origin make?"}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Soren","how":"","instruction":"Soren made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain why the lagging strand is made in pieces.","steps":["Both template strands are exposed as the fork opens.","DNA polymerase can add nucleotides only to a 3′ end.","So on the lagging template, polymerase builds the new strand 3′ → 5′, toward the fork.","Ligase then joins the pieces."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is true; the mistake is earlier."],"fixes":[{"t":"So both strands are built continuously.","why":"Then nothing would be made in pieces. No strand is ever built 3′ → 5′. The lagging strand is built 5′ → 3′ too, in short pieces that point away from the fork.","_n":"1oc05","_k":"82281733"},{"t":"So on the lagging template, polymerase builds 5′ → 3′ \u003cstrong>away\u003c/strong> from the fork, starting a new piece each time more template is exposed.","why":"Every new strand grows 5′ → 3′; on the lagging side that’s away from the fork.","_n":"1pc35","_k":"cd2990a8"},{"t":"So polymerase reads the lagging template 5′ → 3′ and builds 5′ → 3′ too.","why":"The template is always read 3′ → 5′.","_n":"1qc25","_k":"e54c8dcb"},{"t":"Step 3 is correct.","why":"Nothing is ever built 3′ → 5′.","_n":"1rc55","_k":"dff21ba3"}],"hints":["Which direction are all new strands built in?","5′ → 3′.","On the lagging side, that’s away from the fork."]},{"id":"e2","goal":1,"task":"Write the new strand made on the template \u003cspan class=\"dd-seq\">5′-CGTAAG-3′\u003c/span>.","steps":["The template is \u003cspan class=\"dd-seq\">5′-CGTAAG-3′\u003c/span>.","Pair each base: C–G, G–C, T–A, A–T, A–T, G–C.","So the new strand is \u003cspan class=\"dd-seq\">5′-GCATTC-3′\u003c/span>.","Polymerase built it from its 5′ end to its 3′ end."],"_a":"Cw==","stepFb":["Step 1 restates it.","Step 2 is correct.","","Step 4’s rule is right; the ends in step 3 are wrong."],"fixes":[{"t":"The new strand is \u003cspan class=\"dd-seq\">5′-CGTAAG-3′\u003c/span>.","why":"That copies the template.","_n":"1sc45","_k":"df9a896b"},{"t":"The new strand is \u003cspan class=\"dd-seq\">3′-GCAUUC-5′\u003c/span>.","why":"DNA uses T.","_n":"1tc75","_k":"c69af7c3"},{"t":"The new strand is \u003cspan class=\"dd-seq\">3′-GCATTC-5′\u003c/span>, which reads \u003cspan class=\"dd-seq\">5′-CTTACG-3′\u003c/span> the usual way.","why":"Antiparallel: under a template written 5′ → 3′, the new strand’s left end is 3′.","_n":"1uc65","_k":"31aecc80"},{"t":"Step 3 is correct.","why":"The new strand is antiparallel: if the template reads 3′ → 5′ left to right, the new strand reads 5′ → 3′ left to right.","_n":"1vc95","_k":"59ce678b"}],"hints":["Which way does the new strand run?","Opposite to the template: its left end is 3′.","\u003cspan class=\"dd-seq\">5′-CTTACG-3′\u003c/span>."]},{"id":"e3","goal":6,"task":"Explain why chromosomes shorten and what telomerase does.","steps":["At the end of a linear chromosome, the last primer on the lagging strand is removed.","No 3′ end is available to fill that gap with DNA.","So the chromosome gets slightly shorter with each round of copying.","Telomerase rebuilds the ends in all body cells, so normal cells never lose telomere length."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct.","why":"Telomeres are non-coding repeats. Telomerase is active in a few cell types (stem and germ cells) and most cancer cells.","_n":"1wc85","_k":"ef8e2243"},{"t":"Telomerase cuts telomeres shorter.","why":"Telomerase extends the ends; it doesn’t cut them.","_n":"1xdb5","_k":"27854083"},{"t":"Telomerase is a DNA polymerase that needs a primer.","why":"It carries its own RNA template.","_n":"1ydc5","_k":"5e612633"},{"t":"Telomerase extends telomeres in a few cell types (stem and germ cells) and in most cancer cells; most body cells’ telomeres slowly shorten.","why":"Telomeres are non-coding repeats. Telomerase is active in a few cell types (stem and germ cells) and most cancer cells.","_n":"1zd95","_k":"db82fd59"}],"hints":["Do most of your body cells have active telomerase?","No; it’s mostly in stem cells, germ cells and cancer cells.","Most cells’ telomeres shorten."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you about the fork: that one strand runs ‘backwards’ in pieces, or that the roles swap across a bubble?"},{"id":"j2","q":"In your own words, explain how the single rule ‘add only to a 3′ end’ creates leading and lagging strands."},{"id":"j3","q":"Explain to a friend how proofreading, mismatch repair and excision repair work together, using the error-rate numbers."},{"id":"j4","q":"Which counting question (primers, forks, telomeres) still trips you up? What’s your plan?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"DNA polymerase adds each new nucleotide to the…","options":[{"t":"Either end, whichever is closer to the fork","why":"No strand is ever built 3′ → 5′. The lagging strand is built 5′ → 3′ too, in short pieces that point away from the fork.","_n":"20da5","_k":"3ad1eaf1"},{"t":"5′ end of the growing strand, so strands grow 3′ → 5′","why":"No strand is ever built 3′ → 5′. The lagging strand is built 5′ → 3′ too, in short pieces that point away from the fork.","_n":"21d75","_k":"56f1b87e"},{"t":"3′ end of the growing strand, so strands grow 5′ → 3′","why":"Only the free 3′ –OH can form the next bond.","_n":"22d85","_k":"582fd9cd"},{"t":"3′ end on the leading strand, but the 5′ end on the lagging strand","why":"Both new strands grow at their 3′ ends.","_n":"23d55","_k":"814b96f6"}]},"b":{"prompt":"In which direction does DNA polymerase read the template strand?","options":[{"t":"3′ → 5′, while building the new strand 5′ → 3′","why":"The template and the new strand are antiparallel.","_n":"24d65","_k":"154b8d35"},{"t":"3′ → 5′ on the leading template, 5′ → 3′ on the lagging template","why":"Every template is read 3′ → 5′.","_n":"25d35","_k":"109b7fbe"},{"t":"It reads both directions at once","why":"No strand is ever built 3′ → 5′. The lagging strand is built 5′ → 3′ too, in short pieces that point away from the fork.","_n":"26d45","_k":"2c3f37d2"},{"t":"5′ → 3′, while building the new strand 5′ → 3′","why":"The two strands are antiparallel.","_n":"27dd5","_k":"e9b67277"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What are Okazaki fragments?","options":[{"t":"Short pieces of RNA that become the leading strand","why":"Primers are RNA, but the fragments are DNA.","_n":"28dc5","_k":"0a494507"},{"t":"Fragments made on the leading strand","why":"The leading strand is continuous.","_n":"29db5","_k":"bb5a81c7"},{"t":"Short pieces of new DNA on the lagging strand, each started from its own RNA primer","why":"The lagging strand is made in pieces, one primer per piece.","_n":"2ada5","_k":"c09bad7f"},{"t":"Pieces of the old template cut out during repair","why":"Polymerase proofreads as it goes; mismatch repair catches what slips past; excision repair fixes damage at any time.","_n":"2bd95","_k":"15ad1577"}]},"b":{"prompt":"On the lagging strand, which enzyme replaces each RNA primer with DNA?","options":[{"t":"Primase","why":"Primase makes primers.","_n":"2cd85","_k":"a67b3acf"},{"t":"DNA polymerase I","why":"Polymerase I swaps each primer for DNA.","_n":"2dd75","_k":"66b8640c"},{"t":"DNA ligase","why":"Ligase seals nicks; it doesn’t swap RNA for DNA.","_n":"2ed65","_k":"b239814f"},{"t":"Helicase","why":"Helicase unwinds.","_n":"2fd55","_k":"d49cec8f"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Which repair fixes damage from UV light, such as a thymine dimer?","options":[{"t":"Excision repair: the damaged stretch is cut out and refilled","why":"Enzymes cut out the dimer; a polymerase refills and ligase seals.","_n":"2gd45","_k":"a6dfb444"},{"t":"Proofreading by DNA polymerase","why":"Proofreading checks bases as they’re added during copying.","_n":"2hd74","_k":"5c20b7e8"},{"t":"Primase","why":"Primase makes primers.","_n":"2id84","_k":"ef82f66e"},{"t":"Telomerase","why":"Telomerase extends chromosome ends.","_n":"2jd94","_k":"ef9959f4"}]},"b":{"prompt":"Which mechanism corrects a wrong base the moment it’s added?","options":[{"t":"Ligase","why":"Ligase seals nicks.","_n":"2kda4","_k":"1260f705"},{"t":"Mismatch repair","why":"Mismatch repair works after copying, on what proofreading missed.","_n":"2ld34","_k":"5d3f11f8"},{"t":"Excision repair","why":"That fixes damage, such as UV dimers.","_n":"2md44","_k":"4e2f0e26"},{"t":"Proofreading by DNA polymerase","why":"Polymerase backs up and removes the wrong base during copying.","_n":"2nd54","_k":"d0b0aaef"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A fork is moving to the right. The top template runs 3′ (on the left) to 5′ (on the right). Is the new strand made on the top template leading or lagging?","options":[{"t":"Lagging, because the top strand is always the lagging template","why":"At a bubble the same template strand is leading on one fork and lagging on the other.","_n":"2od64","_k":"9b6d9c0e"},{"t":"Lagging, because the template ends at 5′ on the right","why":"Work out which way the \u003cstrong>new\u003c/strong> strand grows.","_n":"2pcf4","_k":"3b9167e8"},{"t":"Leading: the new strand runs 5′ → 3′ left to right, so its 3′ end faces the moving fork","why":"Its 3′ end keeps up with the fork.","_n":"2qd04","_k":"deea2931"},{"t":"Neither; the top strand isn’t copied","why":"Both strands are copied.","_n":"2r4c3","_k":"4405fd17"}]},"b":{"prompt":"A fork is moving to the right. The bottom template runs 5′ (on the left) to 3′ (on the right). Is the new strand made on the bottom template leading or lagging?","options":[{"t":"Leading, because the template’s 3′ end faces the fork","why":"The template’s direction is opposite to the new strand’s.","_n":"2s4d3","_k":"0e4ea335"},{"t":"Leading, because the bottom strand is always leading","why":"At a bubble the same template strand is leading on one fork and lagging on the other.","_n":"2t4e3","_k":"82f35957"},{"t":"Lagging: the new strand runs 3′ → 5′ left to right, so its 3′ end points away from the fork","why":"It grows 5′ → 3′ leftward, away from the fork, in pieces.","_n":"2u4f3","_k":"aaf3aa86"},{"t":"Lagging, because it’s built 3′ → 5′","why":"Right answer, wrong reason: it’s built 5′ → 3′ away from the fork.","_n":"2v483","_k":"b7983ba4"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A bacterial fork has opened 3000 nucleotides. The lagging strand is made in 1000-nucleotide fragments. How many primers has the lagging strand needed so far?","options":[{"t":"1","why":"That’s the leading strand.","_n":"2w493","_k":"e947253c"},{"t":"3","why":"3000 ÷ 1000.","_n":"2x4a3","_k":"5ecf6dec"},{"t":"4","why":"That adds the leading strand’s primer; the question asks about the lagging strand.","_n":"2y4b3","_k":"d005dc91"},{"t":"3000","why":"One primer per fragment, not per nucleotide.","_n":"2z443","_k":"596280f4"}]},"b":{"prompt":"A eukaryotic fork has opened 2000 nucleotides with 200-nucleotide fragments. How many primers has the lagging strand needed?","options":[{"t":"1","why":"Leading: one primer per fork. Lagging: one primer per Okazaki fragment.","_n":"30453","_k":"554c63b4"},{"t":"10","why":"2000 ÷ 200.","_n":"31523","_k":"24f987aa"},{"t":"11","why":"That adds the leading primer.","_n":"32513","_k":"c9f34bc5"},{"t":"200","why":"That’s the fragment length.","_n":"33503","_k":"ab4422c9"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Polymerase alone makes about 1 error in 10⁵ bases. Proofreading improves this 100-fold, and mismatch repair a further 1000-fold. What’s the final error rate?","options":[{"t":"About 1 in 10⁸","why":"That leaves out proofreading’s 100-fold improvement.","_n":"344f3","_k":"fad1061f"},{"t":"About 1 in 10¹⁰","why":"10⁵ × 10² × 10³.","_n":"354e3","_k":"9ae4c396"},{"t":"About 1 in 1100","why":"That ignores the starting rate.","_n":"364d3","_k":"01dd0397"},{"t":"About 1 in 1.1 × 10⁸","why":"That adds the improvements (100 + 1000 = 1100-fold); they multiply.","_n":"374c3","_k":"ae72ef3d"}]},"b":{"prompt":"Polymerase alone makes about 1 error in 10⁴ bases. Proofreading improves this 1000-fold, and mismatch repair a further 100-fold. What’s the final rate?","options":[{"t":"About 1 in 1.1 × 10⁷","why":"The improvements multiply, not add.","_n":"384b3","_k":"6d846d87"},{"t":"About 1 in 10⁹","why":"10⁴ × 10³ × 10².","_n":"394a3","_k":"f7d13abe"},{"t":"About 1 in 10⁷","why":"That leaves out mismatch repair.","_n":"3a493","_k":"cbb6e111"},{"t":"About 1 in 10⁶","why":"That leaves out proofreading.","_n":"3bb84","_k":"97e03cd4"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why one new strand is made in pieces?","options":[{"t":"“The lagging template is damaged, so it can only be copied in pieces.”","why":"Nothing is damaged; it’s about direction.","_n":"3cb94","_k":"be9947b8"},{"t":"“Polymerase can only add to a 3′ end, so the new strands grow 5′ → 3′. On one template that means growing away from the opening fork, so polymerase must keep starting new pieces as more template is exposed.”","why":"It starts from the 3′-end rule and links it to the fork’s direction.","_n":"3db64","_k":"2f9858df"},{"t":"“The lagging strand is built 3′ → 5′, which is slower.”","why":"No strand is ever built 3′ → 5′. The lagging strand is built 5′ → 3′ too, in short pieces that point away from the fork.","_n":"3eb74","_k":"daadb9a0"},{"t":"“There isn’t enough polymerase to copy both strands continuously.”","why":"It’s direction, not supply.","_n":"3fbc4","_k":"38f27f43"}]},"b":{"prompt":"Which is the best explanation of why the leading strand needs only one primer?","options":[{"t":"“It uses ligase instead of primers.”","why":"Ligase joins pieces; it doesn’t start strands.","_n":"3gbd4","_k":"be5a7d91"},{"t":"“Primers are only needed on the lagging strand’s template because it’s RNA.”","why":"Both templates are DNA.","_n":"3hba4","_k":"fcc22dff"},{"t":"“It’s built 3′ → 5′, which doesn’t need primers.”","why":"No strand is ever built 3′ → 5′. The lagging strand is built 5′ → 3′ too, in short pieces that point away from the fork.","_n":"3ibb4","_k":"39d5a8c9"},{"t":"“Its 3′ end faces the fork, so as each new base pair is exposed, polymerase adds straight onto the same growing strand.”","why":"One start, then continuous growth toward the fork.","_n":"3jc04","_k":"05df1104"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which is the best description of the end-replication problem?","options":[{"t":"“Genes at the ends are copied twice.”","why":"Nothing is copied twice.","_n":"3kc14","_k":"756d51e7"},{"t":"“When the last RNA primer at a chromosome’s end is removed, there is no 3′ end to extend into the gap, so a little DNA is lost each round; telomeres are the expendable buffer.”","why":"It names the cause (no 3′ end for the last gap) and the buffer.","_n":"3lbe4","_k":"00a94844"},{"t":"“Helicase can’t open the DNA at chromosome ends.”","why":"Unwinding isn’t the problem.","_n":"3mbd4","_k":"2dbde2ab"},{"t":"“Telomerase removes DNA from the ends each round.”","why":"Telomeres are non-coding repeats. Telomerase is active in a few cell types (stem and germ cells) and most cancer cells.","_n":"3nc04","_k":"d293cc1b"}]},"b":{"prompt":"Which statement about telomeres is accurate?","options":[{"t":"“They contain the most important genes, which is why they’re protected.”","why":"Telomeres are non-coding repeats. Telomerase is active in a few cell types (stem and germ cells) and most cancer cells.","_n":"3obf4","_k":"498f6f8b"},{"t":"“They are found in bacterial chromosomes.”","why":"Circular chromosomes have no ends.","_n":"3pba4","_k":"8312e1f7"},{"t":"“They are repeated, non-coding sequences at chromosome ends that shorten with each division in most body cells.”","why":"Telomeres are non-coding repeats. Telomerase is active in a few cell types (stem and germ cells) and most cancer cells.","_n":"3qb94","_k":"38939915"},{"t":"“They shorten only in cancer cells.”","why":"Cancer cells usually \u003cstrong>keep\u003c/strong> their length with telomerase.","_n":"3rbc4","_k":"83855b2f"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Most cancer cells switch telomerase on. A drug that blocks telomerase is being tested. Which effect would it be expected to have on the cancer cells?","options":[{"t":"It would lengthen their telomeres","why":"Blocking telomerase does the opposite.","_n":"3sbb4","_k":"ce662a63"},{"t":"Their telomeres would shorten each division, eventually limiting how many more times they can divide","why":"Without telomerase, the end-replication problem returns.","_n":"3tc64","_k":"dfae2c08"},{"t":"Their DNA would gain mutations everywhere","why":"Telomerase isn’t a repair enzyme.","_n":"3uc54","_k":"9cced421"},{"t":"They would stop copying DNA immediately","why":"Telomerase only affects the chromosome ends.","_n":"3vb43","_k":"77a83df9"}]},"b":{"prompt":"People with xeroderma pigmentosum can’t do excision repair. Which advice and explanation fit?","options":[{"t":"Take telomerase supplements","why":"Telomeres are non-coding repeats. Telomerase is active in a few cell types (stem and germ cells) and most cancer cells.","_n":"3wb53","_k":"6f30862d"},{"t":"No precautions are needed, because proofreading fixes UV damage","why":"Polymerase proofreads as it goes; mismatch repair catches what slips past; excision repair fixes damage at any time.","_n":"3xb63","_k":"8326b5c5"},{"t":"Avoid UV exposure: thymine dimers can’t be removed, so mutations and skin cancers are far more likely","why":"UV makes dimers that only excision repair removes.","_n":"3yb73","_k":"2d86d24e"},{"t":"Avoid sugar, because their polymerase can’t proofread","why":"The defect is in excision repair.","_n":"3zb83","_k":"82d12511"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"\u003cem>E. coli\u003c/em> has one circular chromosome with a single origin. How many replication forks form, and how many leading strands are made?","options":[{"t":"2 forks and 1 leading strand","why":"Each fork has its own leading strand.","_n":"40b93","_k":"fe3e552f"},{"t":"4 forks and 4 leading strands","why":"One origin makes one bubble with two forks.","_n":"41ba3","_k":"3ce4b2aa"},{"t":"1 fork and 1 leading strand","why":"An origin opens in both directions.","_n":"42bb3","_k":"31788aee"},{"t":"2 forks and 2 leading strands","why":"One bubble: two forks, each with a leading strand.","_n":"43bc3","_k":"7ffb80f5"}]},"b":{"prompt":"A linear eukaryotic chromosome uses 4 origins. How many replication forks form?","options":[{"t":"2","why":"That’s one origin.","_n":"44bd3","_k":"235e296e"},{"t":"4","why":"At a bubble the same template strand is leading on one fork and lagging on the other.","_n":"45ba3","_k":"f597b78e"},{"t":"5","why":"Origins don’t share forks.","_n":"46b93","_k":"e7afb3c5"},{"t":"8","why":"Each origin opens a bubble with 2 forks.","_n":"47b83","_k":"8dd71f36"}]}}]},"task":{"title":"Origins on the map","summary":"Origins on the map","statement":"\u003cp>A model chromosome is 120 nucleotides long. Choose where to put the origins of replication so that copying meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"dd-conds\">\u003cli>Copying finishes in at most 3 time steps.\u003c/li>\u003cli>It uses exactly 3 origins.\u003c/li>\u003cli>No two origins are closer than 40 nucleotides.\u003c/li>\u003cli>It uses at most 18 primers in total.\u003c/li>\u003c/ol>","how":"Tap a position to place or remove an origin. Then press Run copying to watch the bubbles open.","model":"Each origin opens a bubble with two forks. Forks move 10 nt per step and stop at a chromosome end or when they meet a fork from the next bubble. Each fork’s leading strand needs 1 primer, and its lagging strand needs 1 primer for every 10 nt (or part of 10) the fork travels.","checks":["Finishes in ≤ 3 steps","Exactly 3 origins","Origins at least 40 nt apart","At most 18 primers"],"tips":["The forks at each end have to reach the chromosome’s end. Keep the outer origins within 30 nt of the ends.","The task asks for exactly three origins.","Spread them out.","A fork that travels 15 nt needs 2 lagging primers; gaps that are multiples of 20 waste none."],"explainPrompt":"Explain how you balanced speed (finishing quickly) against the number of primers.","vocab":"Use the words origin, replication fork, leading strand, lagging strand and primer.","afterAt":5,"after3":"Only {20, 60, 100} finishes in 2 steps: every fork travels exactly 20 nt. The others take 3 steps but still use only 18 primers, because every gap is a multiple of 20."},"cards":[["The direction rule","Polymerase adds only to a 3′ end: new strands grow 5′ → 3′; templates are read 3′ → 5′."],["Leading strand","Made continuously toward the fork from one primer."],["Lagging strand","Made away from the fork in Okazaki fragments, each with its own primer."],["Okazaki fragment","A short piece of lagging-strand DNA (about 1000–20
