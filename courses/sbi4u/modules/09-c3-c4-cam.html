.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 09: rubisco's dilemma simulator, S3 carbon bars, TC3 grid, S2 strategy steppers, Part 3 stations and climate board,
   enzyme zoom, problems, "A plant for its place" task, hero.
   Roles: carbon/CO₂ --bio-carbon, O₂ --bio-o2, ATP --bio-atp, plant tissue --leaf (illustration only), rubisco --ink-2. */
:root{--cc-air:color-mix(in srgb,var(--ink-2) 7%,var(--sheet));--cc-vac:color-mix(in srgb,var(--bio-carbon) 9%,var(--sheet));--cc-chl:color-mix(in srgb,var(--leaf) 13%,var(--sheet))}

/* hero equation */
.hero .hero-eq .cc-heq{display:flex;flex-direction:column;gap:.2em;font-size:.62em;line-height:1.25}
.cc-heql{display:block}
.cc-co2{color:var(--bio-carbon);font-weight:700;white-space:nowrap}
.cc-o2{color:var(--bio-o2);font-weight:700}
.cc-co2 .cc-cdot{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--bio-carbon);margin-right:.12em;vertical-align:.08em}
.cc-hero{width:100%;aspect-ratio:520 / 300}
.cc-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 06 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.45}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* switch */
.cc-swb{display:inline-flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .7em;min-height:44px;font-size:.9rem;font-weight:700}
.cc-swk{flex:0 0 30px;height:16px;border-radius:8px;border:1.5px solid var(--ink-2);position:relative;background:var(--paper)}
.cc-swk::after{content:"";position:absolute;top:1.5px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.cc-swb[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.cc-swb[aria-checked="true"] .cc-swk{background:var(--ink);border-color:var(--ink)}
.cc-swb[aria-checked="true"] .cc-swk::after{left:15px;background:var(--sheet)}
.cc-swb:disabled{opacity:.5}
.cc-swst{font-size:.75rem;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){ .cc-swk::after{transition:none} }

/* explore layout */
.cc-top{margin-bottom:14px}
.cc-pg[hidden],.cc-strat[hidden],.cc-pg [hidden],.cc-aha[hidden]{display:none!important}
@media (min-width:821px){ .cc-pg{grid-template-rows:auto 1fr} }
.cc-pg .pg-ctrl{display:grid;gap:12px}
.cc-dim{opacity:.6}
.cc-sl{margin:0}
.cc-sl input{width:100%;accent-color:var(--ink)}
.cc-stage{position:relative;width:100%;aspect-ratio:520 / 300;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.cc-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cc-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.cc-legend > span{display:inline-flex;align-items:center;gap:4px}
.cc-legend svg{width:14px;height:14px}
.cc-lg-t{background:var(--c);color:var(--sheet);font-weight:700;border-radius:999px;padding:0 .5em}
.cc-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.cc-note{margin:10px 0 0}
#cc-read .read > div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0}
#cc-read .read dd{margin:0;text-align:right;font-weight:700}
.cc-aha{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--ink);background:var(--paper);border-radius:6px;font-size:.92rem}

/* SVG drawing */
.cc-air{fill:var(--cc-air);stroke:var(--rule);stroke-width:1}
.cc-epi{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1}
.cc-guard{fill:var(--leaf-fill);stroke:var(--leaf);stroke-width:1.4}
.cc-cell{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:2}
.cc-chl{fill:var(--cc-chl);stroke:var(--leaf);stroke-width:1.6}
.cc-bs{fill:color-mix(in srgb,var(--leaf) 30%,var(--sheet));stroke:var(--leaf);stroke-width:1.4}
.cc-bs-on{stroke:var(--ink);stroke-width:2.2}
.cc-bs0{fill:var(--sheet);stroke:var(--leaf-edge);stroke-width:1}
.cc-mes{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:1}
.cc-chlo{fill:var(--leaf)}
.cc-vein{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.cc-vac{fill:var(--cc-vac);stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:5 3}
.cc-enz{fill:color-mix(in srgb,var(--ink-2) 16%,var(--sheet));stroke:var(--ink-2);stroke-width:2}
.cc-pep{fill:var(--sheet);stroke-dasharray:4 2}
.cc-idle{opacity:.45}
.cc-wring{fill:none;stroke:var(--ink-2);stroke-width:2}
.cc-wspoke{stroke:var(--ink-2);stroke-width:1.2}
.cc-whub{fill:var(--ink-2)}
.cc-cdot{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1}
.cc-odot{fill:var(--bio-o2);stroke:var(--sheet);stroke-width:1}
.cc-sugar{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1}
.cc-tokt{font:700 9.5px var(--font-ui);fill:var(--sheet)}
.cc-t{font:600 11px var(--font-ui);fill:var(--ink-2)}
.cc-ts{font:600 10.5px var(--font-ui);fill:var(--ink-2)}
.cc-tb{font:700 11.5px var(--font-ui);fill:var(--ink)}
.cc-thd{font:700 20px var(--font-ui);fill:var(--ink)}
.cc-badge{font:700 12.5px var(--font-ui);fill:var(--ink)}
.cc-halo{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.cc-ah{stroke-dasharray:none!important}
.cc-conv{fill:none;stroke:var(--rule);stroke-width:2;stroke-dasharray:3 3}
.cc-cpath{fill:none;stroke:var(--bio-carbon);stroke-width:1.8;stroke-dasharray:5 4;stroke-linejoin:round}
.cc-opath{fill:none;stroke:var(--bio-o2);stroke-width:1.8;stroke-dasharray:5 4;stroke-linejoin:round}
.cc-spath{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round}
.cc-tpath{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-linejoin:round}
.cc-gauge{fill:var(--paper);stroke:var(--rule);stroke-width:1}
.cc-gfill{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:.8}
.cc-gtick{stroke:var(--ink);stroke-width:1.4}
.cc-gmark{fill:var(--ink)}
.cc-tfill{fill:var(--ink-2)}
.cc-tbulb{fill:var(--ink-2)}
.cc-dial{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.cc-night{fill:color-mix(in srgb,var(--ink-2) 28%,var(--sheet))}
.cc-tick{stroke:var(--ink);stroke-width:1.4}
.cc-hand{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.cc-sun{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.cc-ray{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.cc-moon{fill:var(--ink-2)}
.cc-cloud{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3}
.cc-drop{stroke:var(--bio-o2);stroke-width:1.6;stroke-linecap:round}
.cc-hpan{fill:var(--sheet);stroke:var(--rule);stroke-width:1.4}
.cc-zbg{fill:var(--cc-air)}
.cc-tbg{fill:var(--sheet)}
/* leaf cross-section (copied from SBI4U 01) */
.ccl-air{fill:var(--paper)}
.ccl-cut{fill:var(--rule);stroke:var(--ink-2);stroke-width:.8}
.ccl-epi{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.ccl-tis{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:1.2}
.ccl-vein-in{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1}
.ccl-xy{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
.ccl-ph{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.ccl-pit{fill:var(--paper);stroke:none}
.ccl-gsm{fill:var(--leaf);stroke:var(--leaf-edge);stroke-width:.6}
.ccl-kranz{fill:var(--leaf);fill-opacity:.75;stroke:var(--leaf-edge);stroke-width:.6}
@media (max-width:560px){
  .cc-tb{font-size:15px}.cc-ts{font-size:14px}.cc-tokt{font-size:10px}.cc-badge{font-size:17px}
  .cc-sstage .cc-ts{font-size:12px}
}

/* S3 carbon bars */
.cc-bars{display:grid;gap:10px;margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.cc-bgh{margin:0 0 4px;font-weight:700;font-size:.92rem}
.cc-br{display:grid;grid-template-columns:6.6em minmax(0,1fr) 2.4em;gap:8px;align-items:center;font-size:.85rem;margin-top:4px}
.cc-bl{color:var(--ink-2);font-weight:700}
.cc-br b{text-align:right}
.cc-bt{position:relative;display:block;height:14px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);overflow:hidden}
.cc-bt i{position:absolute;top:0;bottom:0}
.cc-bt .cc-zero{position:absolute;top:-1px;bottom:-1px;width:1.5px;background:var(--ink)}
.cc-b-fix{background:var(--bio-carbon)}
.cc-b-lost{background:repeating-linear-gradient(45deg,var(--bio-carbon) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--bio-carbon)}
.cc-b-net{background:var(--ink)}
.cc-bnote{margin:0}

/* compare readout */
.cc-cmpt{border-collapse:collapse;width:100%;font-size:.88rem}
.cc-cmpt caption{text-align:left;font-weight:700;padding-bottom:4px}
.cc-cmpt th,.cc-cmpt td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.cc-cmpt thead th{color:var(--ink-2);font-size:.8rem}
.cc-cmpt td{font-weight:700}

/* TC3 grid */
.cc-grid{margin-top:14px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.cc-gh{margin:0 0 6px;font-size:.9rem}
.cc-gt{border-collapse:collapse;font-size:.85rem}
.cc-gt th{padding:3px 6px;text-align:center;color:var(--ink-2)}
.cc-gt tbody th{text-align:left;white-space:nowrap}
.cc-gt td{padding:2px}
.cc-gb{width:44px;height:44px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);font-weight:700;font-size:1.1rem}
.cc-gb[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.cc-gb.cc-here{outline:2.5px dashed var(--ink);outline-offset:1px}

/* three strategies */
.cc-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cc-pan{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;min-width:0}
.cc-pan h3{margin:0;font-size:1.15rem}
.cc-sub{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.cc-plants{margin:2px 0 6px}
.cc-sstage{width:100%;aspect-ratio:300 / 214;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.cc-sstage svg{width:100%;height:100%;display:block}
.cc-steps{list-style:none;margin:8px 0;padding:0;display:grid;gap:5px}
.cc-stepb{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.3em .55em;min-height:36px;font-size:.88rem}
.cc-stepb.on{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.cc-sn{flex:0 0 1.5em;height:1.5em;border-radius:50%;border:1.5px solid var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.cc-scap{font-size:.9rem;margin:8px 0 4px;min-height:4.2em}
.cc-carbon{margin:0}
.cc-cct{display:inline-block;font-weight:700;color:var(--bio-carbon);margin-right:4px}
@media (max-width:980px){ .cc-panels{grid-template-columns:minmax(0,1fr)} .cc-pan{max-width:560px} }

/* Part 3 */
.cc-p3 h3{margin-top:0}
.cc-s1row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.cc-s1pl{max-width:520px}
.cc-s1leg{margin:6px 0 0}
.cc-key{display:inline-block;width:26px;height:0;vertical-align:middle;border-top:3px solid var(--pen)}
.cc-key-c{border-top:3px dashed var(--ink)}
.cc-tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.cc-tbl th,.cc-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule)}
.cc-tbl thead th{font-size:.8rem;color:var(--ink-2)}
.cc-tnote{margin:6px 0 0}
.cc-prs{margin-top:10px}
.cc-pr{padding:10px 0;border-top:1px solid var(--rule)}
.cc-prq{font-weight:700;margin:0 0 6px}
.cc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.cc-chips .chip{text-align:left}
.cc-bench{max-width:520px}
@media (max-width:820px){ .cc-s1row{grid-template-columns:minmax(0,1fr)} }
/* climate board */
.cc-tray{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;min-height:44px}
.cc-plant{border:2px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .8em;font-weight:700;min-height:40px}
.cc-plant[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.cc-clims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.cc-clim{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:left;border:1.5px solid var(--ink-2);border-radius:10px;background:var(--sheet);color:var(--ink);padding:10px;min-height:86px}
.cc-clim.ready{border-style:dashed;border-color:var(--ink)}
.cc-clh{display:flex;align-items:center;gap:8px}
.cc-ci{width:28px;height:22px;flex:0 0 auto}
.cc-cli{display:flex;flex-wrap:wrap;gap:6px}
.cc-ptag{font-size:.75rem;font-weight:700;color:var(--ink-2)}
@media (max-width:560px){ .cc-clims{grid-template-columns:minmax(0,1fr)} }
/* zoom */
.cc-zoom{margin-top:16px}
.cc-zstage{width:100%;max-width:620px;aspect-ratio:520 / 190;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.cc-zstage svg{width:100%;height:100%;display:block}
.cc-zcap{margin:6px 0 0;font-size:.92rem}

/* practice */
.cc-pair{display:grid;gap:6px}
.cc-unit{margin-left:6px;color:var(--ink-2)}
.cc-chl-lab{margin:8px 0 0;font-size:.9rem;font-weight:700}

/* task */
.cc-tlist{margin:.3em 0 .6em 1.3em;padding:0}
.cc-tin{display:grid;gap:12px;margin:10px 0 14px}
.cc-tpvw h4{margin:0 0 6px}
.cc-tpvw svg{width:100%;max-width:420px;height:auto;display:block;border:1.5px solid var(--rule);border-radius:10px}

</style>
</head>

lism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"f2f9fa41","content":{"id":"09-c3-c4-cam","kind":"topic","title":"C3, C4 and CAM photosynthesis","topic":"C3, C4 and CAM Photosynthesis and Photorespiration","readyTopic":"C3, C4 and CAM photosynthesis","hero":{"eq":"\u003cspan class=\"cc-heq\">\u003cspan class=\"cc-heql\">Rubisco + \u003cspan class=\"cc-co2\">\u003ci class=\"cc-cdot\" aria-hidden=\"true\">\u003c/i>CO₂\u003c/span> → sugar (Calvin cycle)\u003c/span>\u003cspan class=\"cc-heql\">Rubisco + \u003cspan class=\"cc-o2\">O₂\u003c/span> → wasted carbon (photorespiration)\u003c/span>\u003c/span>","eqLabel":"Rubisco plus CO₂ gives sugar (Calvin cycle). Rubisco plus O₂ gives wasted carbon (photorespiration).","eqSize":"sm","headline":"The world’s most important enzyme makes a costly mistake","text":"Rubisco fixes nearly all the carbon in the food you eat, but it can’t always tell CO₂ from O₂. When it grabs O₂, the plant loses carbon and energy; this is \u003cstrong>photorespiration\u003c/strong>. \u003cstrong>C4\u003c/strong> and \u003cstrong>CAM\u003c/strong> plants have found ways to keep rubisco surrounded by CO₂. One divides the work between cells; the other divides it between night and day.","fig":{"html":"\u003cdiv class=\"cc-hero\" id=\"cc-hero\" role=\"img\" aria-label=\"Rubisco, an enzyme with an open active site, sits in a leaf cell. CO₂ and O₂ molecules drift past. When CO₂ lands, its brown carbon dot joins a growing sugar chain and the Calvin cycle wheel turns. When O₂ lands, a carbon-lost badge appears, a carbon floats away as CO₂ and an orange ATP is spent. A thermometer rises and the stomata in the corner close: more O₂ lands. Then the picture splits into three panels: C3, a leaf cross-section; C4, a ring of bundle-sheath cells around a vein; CAM, a sun and moon clock.\">\u003c/div>"}},"goals":["I can explain photorespiration and why hot, dry conditions increase it.","I can describe how C4 plants separate CO₂ capture and the Calvin cycle in space.","I can describe how CAM plants separate CO₂ capture and the Calvin cycle in time.","I can predict how temperature and stomata affect a C3 plant’s net carbon gain.","I can interpret data to tell C3 plants from C4 plants.","I can match plants and strategies to climates and apply this to crops and climate change."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Rubisco and the Calvin cycle","goal":1,"prompt":"What does rubisco normally do?","options":[{"t":"It joins CO₂ to RuBP at the start of the Calvin cycle","why":"That’s carbon fixation: CO₂ + RuBP, the first step of the Calvin cycle.","_n":"02aa","_k":"19298d55"},{"t":"It breaks glucose down","why":"That’s respiration.","_n":"127a","_k":"c92d1249"},{"t":"It makes ATP in the thylakoid","why":"That’s ATP synthase.","_n":"228a","_k":"5d5ed159"},{"t":"It splits water to release O₂","why":"That happens at PSII.","_n":"325a","_k":"3a01dfe9"}],"hints":["First step of the Calvin cycle?","Carbon fixation.","CO₂ + RuBP."]},{"id":"w2","skill":"Rubisco and the Calvin cycle","goal":2,"prompt":"How many ATP does the Calvin cycle use for each CO₂ fixed?","options":[{"t":"2","why":"That’s the NADPH per CO₂.","_n":"426a","_k":"66934f41"},{"t":"3","why":"9 ATP per 3 CO₂.","_n":"523a","_k":"06c17116"},{"t":"9","why":"That’s per 3 CO₂ (one G3P).","_n":"624a","_k":"0d4b7569"},{"t":"18","why":"That’s per glucose.","_n":"731a","_k":"d95c46f2"}],"hints":["9 ATP make one G3P.","One G3P needs 3 CO₂.","9 ÷ 3 = 3."]},{"id":"w3","skill":"Stomata and gases","goal":1,"prompt":"On a hot, dry afternoon a plant closes its stomata. What happens to the CO₂ inside the leaf as photosynthesis continues?","options":[{"t":"It rises, because the leaf makes CO₂","why":"By day, photosynthesis uses more CO₂ than respiration makes.","_n":"832a","_k":"3946bb8a"},{"t":"It turns into O₂","why":"O₂ comes from water, not CO₂.","_n":"9ba9","_k":"cbe3117b"},{"t":"It falls, because no new CO₂ enters","why":"The Calvin cycle keeps using CO₂, and none comes in to replace it.","_n":"ab99","_k":"fa77d428"},{"t":"It stays the same","why":"It’s being used with none coming in.","_n":"bbc9","_k":"55451ac2"}],"hints":["Is CO₂ coming in?","No, the door is shut.","It falls."]},{"id":"w4","skill":"Stomata and gases","goal":1,"prompt":"With the stomata closed, what happens to the O₂ inside the leaf?","options":[{"t":"It builds up, because the light reactions keep making it","why":"Water keeps being split, and the O₂ can’t get out.","_n":"cbb9","_k":"c58051f9"},{"t":"It falls","why":"O₂ is produced, not used up, by photosynthesis.","_n":"db69","_k":"18a533b9"},{"t":"It becomes water","why":"That’s respiration’s final step, which uses little of it.","_n":"eb59","_k":"e2bb48e3"},{"t":"It stays the same","why":"It can’t escape.","_n":"fb89","_k":"1bbb4e65"}],"hints":["What do the light reactions release?","O₂.","Trapped, it builds up."]},{"id":"w5","skill":"Leaf anatomy","goal":2,"prompt":"Which cells form a ring tightly around each vein in a leaf?","options":[{"t":"Xylem cells","why":"Xylem is inside the vein.","_n":"gb79","_k":"e0d0a6c3"},{"t":"Bundle-sheath cells","why":"They wrap the vascular bundle (the vein) like a sheath.","_n":"hc29","_k":"a55be415"},{"t":"Guard cells","why":"Guard cells surround stomata.","_n":"ic19","_k":"adc37c1c"},{"t":"Palisade cells","why":"They line up under the upper epidermis.","_n":"j489","_k":"40271e6f"}],"hints":["What’s ‘bundle’ short for?","The vascular bundle (vein).","Bundle-sheath cells."]},{"id":"w6","skill":"Leaf anatomy","goal":3,"prompt":"Which part of a plant cell can store large amounts of dissolved acids and other substances?","options":[{"t":"The cell wall","why":"The wall is a structural layer.","_n":"k499","_k":"e3c09827"},{"t":"The central vacuole","why":"The big central vacuole is the cell’s storage sac.","_n":"l4a9","_k":"fa31de0b"},{"t":"The nucleus","why":"The nucleus holds DNA.","_n":"m4b9","_k":"a68a548e"},{"t":"The chloroplast’s lumen","why":"The lumen holds H⁺ during the light reactions, not stores of acid.","_n":"n449","_k":"fd8b4e87"}],"hints":["Which organelle is a big storage sac?","It fills most of a mature plant cell.","The vacuole."]}],"refreshers":{"Rubisco and the Calvin cycle":"Rubisco fixes CO₂ onto RuBP. Each CO₂ fixed costs 3 ATP and 2 NADPH.","Stomata and gases":"Closed stomata stop CO₂ entering and O₂ leaving, so inside the leaf CO₂ falls and O₂ rises.","Leaf anatomy":"Mesophyll cells fill the leaf; bundle-sheath cells wrap each vein; plant cells store substances in a large vacuole."}}},"explore":{"heading":"Rubisco’s dilemma","intro":"Change the temperature and the stomata, then switch pathways. Watch how often rubisco grabs O₂ instead of CO₂, and what that costs the plant.","modelNote":"Model values, rounded: each O₂ event loses half a CO₂ and costs 2 ATP to salvage; C4 spends 5 ATP per CO₂ (3 for the Calvin cycle, 2 to concentrate CO₂). Real values vary with species and conditions. The model shows rubisco’s surroundings, not the whole leaf’s CO₂ budget: a real C4 leaf still needs some CO₂ to enter.","aha":"Photorespiration depends on temperature and stomata. C4 trades ATP for freedom from photorespiration; CAM trades speed for water. There’s no single best pathway.","strategies":{"intro":"Tap any step in a diagram to highlight the molecule’s path and read what happens, or press \u003cstrong>Play\u003c/strong> to run the pathway.","c3":{"name":"C3","sub":"one cell type","plants":"wheat, canola, soybeans, most trees","steps":[{"t":"CO₂ enters by day","cap":"By day the stomata open and CO₂ diffuses into a mesophyll cell.","carbon":"CO₂: 1C"},{"t":"Rubisco fixes CO₂","cap":"In the mesophyll cell’s chloroplast, rubisco joins CO₂ to RuBP. O₂ from the light reactions is right there too, so on hot days rubisco often grabs O₂ instead.","carbon":"1C (CO₂) + 5C (RuBP) = 6C → 2 × 3C"},{"t":"Calvin cycle makes sugar","cap":"The Calvin cycle turns the fixed carbon into G3P and sugar, in the same mesophyll cell.","carbon":"3 CO₂ (3C) → 1 G3P (3C)"}]},"c4":{"name":"C4","sub":"separated in space","plants":"corn, sugarcane","steps":[{"t":"CO₂ enters by day","cap":"By day the stomata open and CO₂ diffuses into a mesophyll cell.","carbon":"CO₂: 1C"},{"t":"PEP carboxylase fixes CO₂","cap":"PEP carboxylase, which ignores O₂, fixes the CO₂ (as bicarbonate) onto PEP, making a 4-carbon acid.","carbon":"1C (CO₂) + 3C (PEP) = 4C acid"},{"t":"The acid moves inward","cap":"The 4-carbon acid passes into a tightly packed bundle-sheath cell next to the vein (Kranz anatomy).","carbon":"4C acid moves"},{"t":"CO₂ is released around rubisco","cap":"The acid releases its CO₂, so rubisco in the bundle-sheath cell is surrounded by CO₂ and seldom meets O₂. The 3-carbon leftover returns to the mesophyll; rebuilding PEP costs about 2 ATP per CO₂.","carbon":"4C → 1C (CO₂) + 3C (back to the mesophyll)"},{"t":"Calvin cycle makes sugar","cap":"The Calvin cycle runs in the bundle-sheath cell, turning the concentrated CO₂ into sugar.","carbon":"3 CO₂ (3C) → 1 G3P (3C)"}]},"cam":{"name":"CAM","sub":"separated in time","plants":"pineapple, cacti, jade plant","steps":[{"t":"Night: CO₂ enters","cap":"In the cool night the stomata open and CO₂ diffuses into a mesophyll cell, losing little water.","carbon":"CO₂: 1C"},{"t":"Night: stored as malic acid","cap":"PEP carboxylase fixes the CO₂ into a 4-carbon acid, stored as malic acid in the vacuole. The vacuole’s pH falls all night.","carbon":"1C (CO₂) + 3C (PEP) = 4C malic acid"},{"t":"Day: stomata close, CO₂ released","cap":"By day the stomata close to save water. Malic acid leaves the vacuole and releases its CO₂ inside the same cell.","carbon":"4C → 1C (CO₂) + 3C"},{"t":"Day: Calvin cycle runs","cap":"With light-made ATP and NADPH, rubisco and the Calvin cycle turn the released CO₂ into sugar, surrounded by CO₂ behind closed stomata.","carbon":"3 CO₂ (3C) → 1 G3P (3C)"}]}},"predIntro":"Make a prediction first. Then the simulator will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"dil","path":"c3","st":"open","T":20},"to":{"T":40},"prompt":"\u003cspan class=\"muted\">C3, stomata open, 20 °C.\u003c/span> The leaf warms to 40 °C. How many of every 10 rubisco reactions will use O₂?","options":[{"t":"2 (no change)","_n":"o459","_k":"9bfb396f"},{"t":"1 (down from 2)","_n":"p469","_k":"0ee558a3"},{"t":"4 (up from 2)","_n":"q479","_k":"f298db00"},{"t":"10","_n":"r409","_k":"4700ab0f"}],"explain":"Heat makes rubisco grab O₂ more often, and CO₂ dissolves less well in warm cell fluids than O₂ does."},{"id":"p2","start":{"mode":"dil","path":"c3","st":"open","T":30},"to":{"st":"closed"},"prompt":"\u003cspan class=\"muted\">C3, stomata open, 30 °C.\u003c/span> The stomata close. What happens to the net carbon gained per 10 reactions?","options":[{"t":"It falls from 5.5 to 1","_n":"s419","_k":"90ea0ba4"},{"t":"It falls to 0 exactly","_n":"t4e9","_k":"e31d4b44"},{"t":"It rises, because water is saved","_n":"u4d9","_k":"2f91a584"},{"t":"It stays at 5.5","_n":"v4c9","_k":"f368e8f8"}],"explain":"Closed stomata trap O₂ and starve rubisco of CO₂, so photorespiration jumps."},{"id":"p3","start":{"mode":"dil","path":"c3","st":"closed","T":40},"to":{"path":"c4"},"prompt":"\u003cspan class=\"muted\">C3, stomata closed, 40 °C (net −0.5).\u003c/span> The pathway switches to C4. How often will rubisco now use O₂?","options":[{"t":"Almost never (0 in the model)","_n":"w4b9","_k":"757064d3"},{"t":"Never, because C4 plants have no rubisco","_n":"x4a9","_k":"f18d9b1c"},{"t":"Just as often as in C3","_n":"y499","_k":"21945421"},{"t":"More often, since C4 plants live in heat","_n":"z489","_k":"fbcaccff"}],"explain":"PEP carboxylase pumps CO₂ into the bundle-sheath cells, where rubisco works surrounded by CO₂."},{"id":"p4","start":{"mode":"dil","path":"cam","clock":20},"to":{"clock":6},"prompt":"\u003cspan class=\"muted\">CAM, clock at 20 h (dusk).\u003c/span> The clock runs to 6 h (dawn). What happens to the pH of the vacuoles?","options":[{"t":"It stays at 6","_n":"10479","_k":"61948f0d"},{"t":"It falls from 6 to about 4","_n":"11469","_k":"a25185d2"},{"t":"It rises to about 8","_n":"12459","_k":"b72baf1d"},{"t":"It falls only in daylight","_n":"133c9","_k":"4676ecc7"}],"explain":"All night, captured CO₂ is stored as malic acid in the vacuole. By day it’s released to the Calvin cycle and the pH climbs back."}],"chalIntro":"Use the simulator (Rubisco’s dilemma mode) to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[1,4],"prompt":"C3 pathway: make the net carbon gain exactly 7 per 10 reactions.","why":"2 O₂ events: 10 − 1.5 × 2 = 7. Open stomata at 20 °C and partly closed stomata at 10 °C both give 2.","hints":["Net = 10 − 1.5 × (O₂ events).","7 means 2 O₂ events.","Open at 20 °C, or partly closed at 10 °C."]},{"id":"tc2","goal":[1,4],"prompt":"C3 pathway: find the setting where the leaf \u003cstrong>loses\u003c/strong> more carbon than it gains.","why":"Closed stomata at 40 °C: 7 O₂ events, so the net is 10 − 1.5 × 7 = −0.5. Photorespiration releases more carbon than rubisco fixes.","hints":["Net is below 0 when 1.5 × (O₂ events) is more than 10.","That needs 7 O₂ events.","Closed stomata at 40 °C."]},{"id":"tc3","goal":[4,6],"stretch":true,"prompt":"Use the ‘Compare C3 and C4’ switch. Mark every temperature-and-stomata cell where a \u003cstrong>C4\u003c/strong> leaf spends \u003cstrong>fewer\u003c/strong> ATP per carbon gained than a C3 leaf. (Use the grid below the readout.)","why":"C4 always costs 5.0 ATP per carbon. C3 costs more in the nine cells with 3 or more O₂ events per 10, and at closed stomata and 40 °C it gains no carbon at all. In cool, open conditions C3 is cheaper.","hints":["C4 always costs 5.0 ATP per carbon.","C3’s cost passes 5.0 once there are 3 or more O₂ events per 10.","Mark every cell with 3 or more O₂ events."]}]},"part3":{"slug":"climates","name":"Climates","heading":"Which plant wins where?","intro":"The simulator explains the mechanism. Now test it against data and real places: read a graph, interpret an experiment, then match plants to climates.","s1":{"title":"Station 1: rate vs temperature","panel":"Check it with data","intro":"Net photosynthesis of wheat (C3) and corn (C4) at four leaf temperatures. Read the graph and the table, then answer the prompts.","head":["Leaf temperature","10 °C","20 °C","30 °C","40 °C"],"rows":[["Wheat (C3)",40,60,45,20],["Corn (C4)",20,55,80,70]],"yLabel":"net photosynthesis (relative units)","prompts":[{"id":"s1a","prompt":"Between which temperatures do the curves cross?","options":[{"t":"10 and 20 °C","why":"Wheat is ahead at both 10 °C (40 vs 20) and 20 °C (60 vs 55).","_n":"143d9","_k":"74406643"},{"t":"20 and 30 °C","why":"At 20 °C wheat leads (60 vs 55); at 30 °C corn leads (80 vs 45). The curves cross in between.","_n":"153a9","_k":"da7caf8c"},{"t":"30 and 40 °C","why":"Corn is already ahead at 30 °C (80 vs 45) and stays ahead at 40 °C (70 vs 20).","_n":"163b9","_k":"b1ec757b"}]},{"id":"s1b","shuffle":true,"prompt":"Why does wheat beat corn at 10 °C?","options":[{"t":"Photorespiration is low in the cold, and C4’s extra ATP cost isn’t repaid","why":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"17389","_k":"07f401d3"},{"t":"Corn has no rubisco","why":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it.","_n":"18399","_k":"90f55dc6"},{"t":"Cold makes wheat’s rubisco grab O₂ more often","why":"Cold makes rubisco grab O₂ \u003cstrong>less\u003c/strong> often. That’s why C3 does well there.","_n":"19369","_k":"956b1564"}]},{"id":"s1c","shuffle":true,"prompt":"Why does corn keep working at 40 °C?","options":[{"t":"CO₂ is concentrated in its bundle-sheath cells, so rubisco seldom meets O₂","why":"PEP carboxylase delivers CO₂ to rubisco in the bundle sheath, so heat doesn’t bring on photorespiration.","_n":"1a379","_k":"f13e2a86"},{"t":"It opens its stomata at night","why":"That’s CAM. C4: two cell types (space). CAM: night and day (time).","_n":"1b449","_k":"0d5a3a80"},{"t":"Corn has a different, heat-proof rubisco","why":"It’s the same enzyme. Corn keeps it surrounded by CO₂.","_n":"1c459","_k":"eb225d90"}]}]},"s2":{"title":"Station 2: the oxygen test","intro":"Two unknown plants are measured at normal air (21% O₂) and at low oxygen (2% O₂). Light, CO₂ and temperature (30 °C) are kept the same.","head":["Plant","Rate at 21% O₂","Rate at 2% O₂"],"rows":[["A",30,45],["B",50,51]],"prompts":[{"id":"s2a","prompt":"Which plant is C3?","options":[{"t":"Plant A","why":"Removing O₂ removes photorespiration, so plant A’s rate jumps from 30 to 45.","_n":"1d429","_k":"e58c6853"},{"t":"Plant B","why":"Plant B barely changed (50 to 51): it has little photorespiration to remove, so it’s probably C4.","_n":"1e419","_k":"dd7e216e"}]},{"id":"s2b","prompt":"Which variables were controlled, and why?","options":[{"t":"The rate of photosynthesis: so it can be compared","why":"The rate is what was measured: the dependent variable.","_n":"1f449","_k":"d0b7f3a4"},{"t":"The O₂ level: so the test is fair","why":"The O₂ level is the variable changed on purpose: the independent variable.","_n":"1g439","_k":"6d1b9ea6"},{"t":"Light, CO₂ and temperature: so only O₂ explains the change","why":"Each of these also changes photosynthesis, so keeping them the same makes O₂ the only possible cause.","_n":"1h469","_k":"cf02c0bb"},{"t":"None: the plants were the only difference","why":"Light, CO₂ and temperature all change photosynthesis, so they had to be kept the same.","_n":"1i459","_k":"50a8e756"}]},{"id":"s2c","prompt":"What is the dependent variable?","options":[{"t":"The O₂ level","why":"That’s the independent variable: it was changed on purpose.","_n":"1j489","_k":"3e0f3b54"},{"t":"The rate of photosynthesis","why":"It’s what was measured as the O₂ level changed.","_n":"1k479","_k":"9f068b71"},{"t":"The amount of light","why":"Light was a controlled variable.","_n":"1l3a9","_k":"eb225692"},{"t":"The temperature","why":"Temperature was a controlled variable, kept at 30 °C.","_n":"1m399","_k":"bbfae2af"}]}]},"s3":{"title":"Station 3: the climate board","intro":"Tap a plant card, then tap the climate where it does best. Each card shows its pathway once it’s placed.","climates":[{"id":"cool","t":"Cool, moist Ontario spring"},{"id":"belt","t":"Hot, humid summer corn belt"},{"id":"tropic","t":"Tropical lowland"},{"id":"desert","t":"Hot desert"}],"plants":[{"id":"wheat","t":"Wheat","path":"C3","why":"Wheat is C3. In a cool, moist spring rubisco seldom grabs O₂, so wheat doesn’t need to pay for a CO₂ pump."},{"id":"canola","t":"Canola","path":"C3","why":"Canola is C3: a cool-season crop that grows well where photorespiration is low."},{"id":"corn","t":"Corn","path":"C4","why":"Corn is C4: in hot weather it concentrates CO₂ around rubisco and avoids photorespiration."},{"id":"sugarcane","t":"Sugarcane","path":"C4","why":"Sugarcane is C4: heat and bright light suit a plant that concentrates CO₂."},{"id":"pineapple","t":"Pineapple","path":"CAM","why":"Pineapple is CAM: it opens its stomata at night, so it gets through hot, dry spells with little water. It’s grown in the dry tropics."},{"id":"saguaro","t":"Saguaro cactus","path":"CAM","why":"The saguaro is CAM: night-time stomata keep water loss low in the desert."},{"id":"maple","t":"Maple tree","path":"C3","why":"Maples are C3 trees of cool, moist forests, where photorespiration is low."}],"_a":"HRARUQMAQBNcaURaCQ5YEzseRFoHD1tdBxBcYkQCW14KEDsVRAxVQQpXRAM9Q1deCV5EZEpDV14UXEQDPUNWVApGRBVEFUZeFlsFGztNFkITVQdLBQBaVEQIPRsEBFhFRB5ETRQORFgFEDsVRBJVVhNTFFZEW28TAlcVXBQVFmxKEBZQCARVQRZeAxtcOhZVA0EDSxJDGBMSQAlJDwIWbBs=","wrong":{"C3|hot":"It’s a C3 plant: in the heat its rubisco grabs O₂ often, and photorespiration wastes much of its carbon.","C3|desert":"It’s a C3 plant: on hot, dry days its stomata close and photorespiration soars.","C4|cool":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","C4|desert":"C4 plants open their stomata by day. In a desert that loses too much water.","CAM|cool":"CAM plants grow slowly. In a cool, moist climate photorespiration is already low, so C3 plants grow faster.","CAM|hot":"Where water is plentiful, CAM’s night-only CO₂ capture is too slow, so faster C4 plants win."},"done":"Board complete. C3 plants win in the cool, C4 plants in hot, wet places, and CAM plants where water is scarce.","zoom":{"title":"Zoom to the molecules","intro":"Offer each enzyme a molecule and watch what it does.","co2":"CO₂ (as HCO₃⁻)","pep":"PEP carboxylase","rub":"Rubisco","capCO2":"Both enzymes bind CO₂. PEP carboxylase takes it as bicarbonate (HCO₃⁻) and fixes it onto PEP; rubisco fixes CO₂ onto RuBP.","capO2":"PEP carboxylase never binds O₂. Rubisco binds O₂ as well as CO₂: that’s photorespiration. So a C4 or CAM plant’s first step can’t be fooled by O₂.","cap0":"PEP carboxylase binds CO₂ (as bicarbonate) but never O₂; rubisco binds both."}},"blocks":[{"title":"STSE: C4 rice and a rising-CO₂ world","html":"\u003cp>Rice feeds billions of people, but it’s a C3 plant, so it loses carbon to photorespiration in hot weather. Research projects are trying to give rice C4 traits, such as Kranz anatomy and PEP carboxylase working in the mesophyll cells, to raise yields in hot climates. \u003cspan class=\"tiny muted\">(This research is ongoing.)\u003c/span>\u003c/p>\u003cp>As CO₂ in the air rises, rubisco grabs O₂ less often. That tends to help C3 crops, such as Canada’s wheat, canola and soybeans, more than C4 crops such as corn. C4 plants already concentrate CO₂. Extra CO₂ mostly helps C3 plants, by cutting their photorespiration.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Climates quick check","items":[{"id":"q1","goal":5,"prompt":"In the oxygen test, plant B barely changed. B is probably…","choices":[{"t":"a CAM plant at noon","fb":"Little photorespiration to remove.","_n":"1nb08","_k":"f1b4f4a5"},{"t":"C4","fb":"Right. B has little photorespiration to remove, so lowering O₂ barely changes its rate.","_n":"1ob18","_k":"7c92ca86"},{"t":"not photosynthesizing","fb":"Little photorespiration to remove.","_n":"1pb28","_k":"b97945c9"},{"t":"C3","fb":"Little photorespiration to remove.","_n":"1qb38","_k":"a92cfd45"}]},{"id":"q2","goal":5,"prompt":"In the oxygen test, why keep the temperature the same?","choices":[{"t":"It doesn’t matter","fb":"Control every variable except O₂.","_n":"1rb48","_k":"e3f0cfdd"},{"t":"Plants need 30 °C","fb":"Control every variable except O₂.","_n":"1sb58","_k":"9c716879"},{"t":"It’s easier","fb":"Control every variable except O₂.","_n":"1tb68","_k":"d857e229"},{"t":"Temperature also changes photorespiration","fb":"Right. Temperature also changes photorespiration: control every variable except O₂.","_n":"1ub78","_k":"bd2f836a"}]},{"id":"q3","goal":6,"prompt":"A crop for a cool, moist Ontario spring:","choices":[{"t":"pineapple (CAM)","fb":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"1vb88","_k":"fa22f815"},{"t":"corn (C4)","fb":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"1wb98","_k":"c616f599"},{"t":"wheat (C3)","fb":"Right. Photorespiration is low in the cool, so wheat doesn’t need a costly CO₂ pump.","_n":"1xb68","_k":"9617ba42"},{"t":"any, equally","fb":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"1yb58","_k":"955fc51b"}]},{"id":"q4","goal":2,"prompt":"PEP carboxylase helps C4 plants because it…","choices":[{"t":"replaces the Calvin cycle","fb":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it. The Calvin cycle still makes the sugar.","_n":"1zb48","_k":"8c5b39f5"},{"t":"makes ATP","fb":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it. The Calvin cycle still makes the sugar.","_n":"20b38","_k":"b7324ccd"},{"t":"ignores O₂","fb":"Right. PEP carboxylase grabs CO₂ but never O₂, so it can deliver concentrated CO₂ to rubisco.","_n":"21ba8","_k":"96e94e65"},{"t":"opens stomata","fb":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it. The Calvin cycle still makes the sugar.","_n":"22b98","_k":"a0a9e7dd"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"C3, C4 or CAM?","noun":"statement","goal":[2,3,6],"txt":true,"instruction":"Twelve statements about the three pathways. Sort each one into C3, C4 or CAM.","boxes":[{"id":"c3","label":"C3"},{"id":"c4","label":"C4"},{"id":"cam","label":"CAM"}],"items":[{"id":"i1","t":"Rubisco fixes CO₂ directly in mesophyll cells","_a":"RFFVGw==","why":"Only C3 skips the 4-carbon step.","wrong":{"c4":"Only C3 skips the 4-carbon step.","cam":"Only C3 skips the 4-carbon step."}},{"id":"i2","t":"CO₂ is first fixed into a 4-carbon acid in mesophyll cells and released in bundle-sheath cells","_a":"RFFSGw==","why":"Two cell types: separation in space.","wrong":{"c3":"Two cell types: separation in space.","cam":"Two cell types: separation in space."},"hints":["How many cell types are involved?","Two: mesophyll and bundle sheath.","C4."]},{"id":"i3","t":"Stomata open at night","_a":"RFEHVEQ=","why":"Night opening is CAM’s water saver.","wrong":{"c3":"Night opening is CAM’s water saver.","c4":"Night opening is CAM’s water saver."}},{"id":"i4","t":"Malic acid builds up in vacuoles overnight","_a":"RFEHVEQ=","why":"CO₂ is stored as acid until daylight.","wrong":{"c3":"CO₂ is stored as acid until daylight.","c4":"CO₂ is stored as acid until daylight."}},{"id":"i5","t":"Kranz anatomy: chloroplast-rich cells ringing each vein","_a":"RFFSGw==","why":"Kranz anatomy is the C4 ring of bundle-sheath cells, where rubisco works surrounded by CO₂.","wrong":{"c3":"Kranz anatomy is the C4 ring of bundle-sheath cells, where rubisco works surrounded by CO₂.","cam":"Kranz anatomy is the C4 ring of bundle-sheath cells, where rubisco works surrounded by CO₂."}},{"id":"i6","t":"Most photorespiration on hot, dry days","_a":"RFFVGw==","why":"No CO₂-concentrating step.","wrong":{"c4":"No CO₂-concentrating step.","cam":"No CO₂-concentrating step."}},{"id":"i7","t":"Corn and sugarcane","_a":"RFFSGw==","why":"Corn and sugarcane are C4 crops of hot, sunny places.","wrong":{"c3":"Corn and sugarcane are C4 crops of hot, sunny places.","cam":"Corn and sugarcane are C4 crops of hot, sunny places."}},{"id":"i8","t":"Wheat, canola and maple trees","_a":"RFFVGw==","why":"Wheat, canola and maple trees are C3 plants.","wrong":{"c4":"Wheat, canola and maple trees are C3 plants.","cam":"Wheat, canola and maple trees are C3 plants."}},{"id":"i9","t":"Pineapple and cacti","_a":"RFEHVEQ=","why":"Pineapple and cacti are CAM plants.","wrong":{"c3":"Pineapple and cacti are CAM plants.","c4":"Pineapple and cacti are CAM plants."}},{"id":"i10","t":"Spends about 2 extra ATP per CO₂ to concentrate it in other cells","_a":"RFFSGw==","why":"The cost of separating in space.","wrong":{"c3":"The cost of separating in space.","cam":"The cost of separating in space."}},{"id":"i11","t":"Captures CO₂ and runs the Calvin cycle at different times of day","_a":"RFEHVEQ=","why":"C4: two cell types (space). CAM: night and day (time).","wrong":{"c3":"C4: two cell types (space). CAM: night and day (time).","c4":"C4: two cell types (space). CAM: night and day (time)."},"hints":["Separation in time or space?","Time.","CAM."]},{"id":"i12","t":"Usually the best performer in cool, moist climates","_a":"RFFVGw==","why":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","wrong":{"c4":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","cam":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better."}}]},{"id":"probs","type":"custom","title":"Photorespiration problems","summary":"Photorespiration problems","star":true,"goal":[1,4,5,6],"instruction":"Eight problems on the Rubisco’s dilemma model and on telling C3 plants from C4 plants. Problems 3 to 8 are non-routine; the last two go beyond the Final Check.","how":"","items":[{"id":"r1","kind":"num","goal":4,"prompt":"C3, 3 O₂ events per 10. Net carbon gained?","_a":"UxxT","display":"5.5 per 10 reactions","unit":"per 10 reactions","why":"CO₂ fixed = 10 − 3 = 7; CO₂ lost = 3 ÷ 2 = 1.5; net = 7 − 1.5 = 5.5.","wrong":[{"match":7,"fb":"Each O₂ event also loses half a CO₂: 7 − 1.5."}]},{"id":"r2","kind":"num","goal":1,"prompt":"C3, 5 O₂ events per 10. CO₂ lost to photorespiration?","_a":"VBxT","display":"2.5 CO₂","unit":"CO₂","why":"Half a CO₂ per O₂ event: 5 ÷ 2 = 2.5.","general":"Half a CO₂ per O₂ event."},{"id":"r3","kind":"num","goal":4,"star":true,"prompt":"C3, Partly closed, 30 °C: ATP per carbon gained?","_a":"XxxT","display":"9.5 ATP per carbon","unit":"ATP per carbon","why":"\u003ci>o\u003c/i> = 4: ATP spent = 30 + 2 × 4 = 38; net gain = 10 − 1.5 × 4 = 4; 38 ÷ 4 = 9.5.","general":"\u003ci>o\u003c/i> = 4: 38 ÷ 4."},{"id":"r4","kind":"num","goal":4,"star":true,"prompt":"At what number of O₂ events per 10 does a C3 leaf gain no net carbon at all? Give the exact value.","_a":"UBxQD1BXAgdQBFAPUFcCB1E=","display":"20/3 (≈ 6.7) O₂ events","unit":"O₂ events per 10","why":"10 − 1.5\u003ci>o\u003c/i> = 0, so \u003ci>o\u003c/i> = 10 ÷ 1.5 = 20/3 ≈ 6.7.","general":"10 − 1.5\u003ci>o\u003c/i> = 0.","near":"Close, but that’s a rounded decimal. Give the exact value as a fraction.","hints":["Set the net gain to 0.","1.5\u003ci>o\u003c/i> = 10.","\u003ci>o\u003c/i> = 10 ÷ 1.5 = 20/3 ≈ 6.7."]},{"id":"r5","kind":"chips","goal":5,"star":true,"prompt":"Design the experiment: you want to know whether a new grass is C3 or C4. Which single variable should you change?","options":[{"t":"species and O₂","why":"Change one variable; keep light, CO₂ and temperature fixed.","_n":"23b88","_k":"eab1cdd9"},{"t":"O₂ level","why":"Change only the O₂ level and keep light, CO₂ and temperature fixed: a big jump in rate at low O₂ means C3.","_n":"24b78","_k":"36442172"},{"t":"nothing","why":"Change one variable; keep light, CO₂ and temperature fixed.","_n":"25be8","_k":"96f95432"},{"t":"light and O₂ together","why":"Change one variable; keep light, CO₂ and temperature fixed.","_n":"26bd8","_k":"812ea09c"}]},{"id":"r6","kind":"numchip","goal":5,"star":true,"prompt":"A plant’s rate rises from 40 to 60 when O₂ drops from 21% to 2%. By what percentage did removing O₂ raise its rate, and which pathway is it?","_a":"PQdWFUQiBxM7","label":"Rise in rate","unit":"%","chipLabel":"Pathway","chips":["C3","C4","CAM"],"display":"50%; C3","why":"20 ÷ 40 = 50%: a big jump means much photorespiration, so it’s C3.","wrongFb":"20 ÷ 40 = 50%: a big jump means much photorespiration."},{"id":"r7","kind":"pair","goal":[2,6],"star":true,"prompt":"A C4 leaf fixes 10 CO₂. How many ATP does it spend in total, and how many of those are the C4 ‘extra’?","_a":"PQdWFVRRaQ==","labels":["ATP spent in total","ATP that are the C4 ‘extra’"],"display":"50 total; 20 extra","why":"5 per CO₂ in all: 10 × 5 = 50. The Calvin cycle uses 3 per CO₂ (30), so the extra is 20.","wrongFb":"5 per CO₂ in all; the Calvin cycle uses 3, so 2 per CO₂ is the C4 cost.","hints":["C4 spends 5 ATP per CO₂ in the model.","10 × 5 = 50.","The Calvin cycle’s share is 30, so the extra is 20."]},{"id":"r8","kind":"pair","goal":3,"star":true,"use":"10\u003csup>1.6\u003c/sup> ≈ 40","prompt":"A CAM plant’s vacuole pH falls by 0.2 each hour of the night, from 6.0. What is its pH after 8 hours, and how many times more H⁺ does the vacuole hold than at dusk?","_a":"PQZIDUpVBGw=","tol":[0.001,1],"labels":["pH after 8 hours","Times more H⁺ than at dusk"],"display":"pH 4.4; about 40 times as much H⁺","why":"8 × 0.2 = 1.6, so the pH is 6.0 − 1.6 = 4.4. A 1.6-unit drop is 10\u003csup>1.6\u003c/sup> ≈ 40 times as much H⁺.","wrongFb":"6.0 − 1.6 = 4.4; a 1.6-unit drop is 10\u003csup>1.6\u003c/sup> times."}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Darius","how":"","instruction":"Darius made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain why photorespiration is wasteful.","steps":["Rubisco sometimes adds O₂ to RuBP instead of CO₂.","This happens more when the leaf is hot and its stomata are closed.","Photorespiration makes ATP, but less than cellular respiration does.","So it’s only a little less efficient."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. Look earlier."],"fixes":[{"t":"Step 3 is correct.","why":"Photorespiration \u003cstrong>uses\u003c/strong> ATP and releases CO₂ without making sugar or ATP. It’s a costly side-reaction of rubisco.","_n":"27c4a","_k":"a1028d49"},{"t":"Photorespiration \u003cstrong>uses\u003c/strong> ATP and \u003cstrong>releases\u003c/strong> CO₂ that was already fixed, without making any sugar.","why":"Photorespiration \u003cstrong>uses\u003c/strong> ATP and releases CO₂ without making sugar or ATP. It’s a costly side-reaction of rubisco.","_n":"28c5a","_k":"b5f7a4c4"},{"t":"Photorespiration makes glucose more slowly.","why":"It makes no sugar.","_n":"29c2a","_k":"b2e88715"},{"t":"Photorespiration happens only at night.","why":"It happens in the light, alongside photosynthesis.","_n":"2ac3a","_k":"c8157d20"}],"hints":["Does photorespiration produce anything useful?","It costs ATP and loses CO₂.","It uses ATP; it doesn’t make it."]},{"id":"e2","goal":2,"task":"Describe how a corn plant avoids photorespiration.","steps":["Corn is a C4 plant.","It opens its stomata at night and stores CO₂ as malic acid.","By day it releases the CO₂ to rubisco."],"_a":"Vw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"That’s CAM, separation in time. C4: two cell types (space). CAM: night and day (time).","_n":"2bc8a","_k":"fc871f6c"},{"t":"Its mesophyll cells fix CO₂ into a 4-carbon acid and pass it to bundle-sheath cells, where CO₂ is released around rubisco.","why":"C4 separates the steps in space. C4: two cell types (space). CAM: night and day (time).","_n":"2cc9a","_k":"07105faf"},{"t":"It has no rubisco.","why":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it.","_n":"2dc6a","_k":"ed0afd38"},{"t":"It keeps its stomata closed all day and night.","why":"It still needs CO₂ from the air.","_n":"2ec7a","_k":"b08b9300"}],"hints":["C4 separates the steps in space or in time?","Space: two cell types.","Mesophyll → bundle sheath."]},{"id":"e3","goal":6,"task":"Advise a farmer near Thunder Bay, where summers are cool and moist.","steps":["In cool weather, rubisco grabs O₂ less often.","So photorespiration is low for C3 crops there.","C4 crops are always more efficient, so the farmer should grow only C4 crops.","Corn will out-yield wheat in this climate."],"_a":"VA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"No crop can grow there.","why":"Plenty of C3 crops grow well in cool climates.","_n":"2fbca","_k":"8917c838"},{"t":"Grow CAM crops for more growth.","why":"CAM plants grow slowly.","_n":"2gbda","_k":"55a43946"},{"t":"C4’s extra ATP cost isn’t repaid when photorespiration is low, so C3 crops like wheat or canola are usually the better choice.","why":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"2hcab","_k":"eabb89e9"},{"t":"Step 3 is correct.","why":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"2ic9b","_k":"2c81bb63"}],"hints":["Is C4 free?","It costs about 2 extra ATP per CO₂.","In the cool, C3 is cheaper."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Rubisco’s dilemma: that a C3 leaf can lose carbon on a hot day, or that C4 isn’t always cheaper?"},{"id":"j2","q":"In your own words, explain the difference between separating steps in space (C4) and in time (CAM)."},{"id":"j3","q":"Explain to a friend how the oxygen test can tell a C3 plant from a C4 plant."},{"id":"j4","q":"Which part of this module are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is photorespiration?","options":[{"t":"Cellular respiration that happens in leaves in the light","why":"Photorespiration \u003cstrong>uses\u003c/strong> ATP and releases CO₂ without making sugar or ATP. It’s a costly side-reaction of rubisco.","_n":"2jccb","_k":"c44a0772"},{"t":"Making ATP from light in the thylakoids","why":"That’s photophosphorylation.","_n":"2kcbb","_k":"b125bd82"},{"t":"The release of O₂ from splitting water","why":"That’s photolysis.","_n":"2lc6b","_k":"3c681561"},{"t":"Rubisco adding O₂ instead of CO₂ to RuBP, which uses ATP and releases fixed carbon as CO₂ without making sugar","why":"It’s a costly side-reaction of rubisco: ATP is spent and carbon is lost, with nothing useful made.","_n":"2mc5b","_k":"6547dfa8"}]},"b":{"prompt":"Which conditions increase photorespiration in a C3 plant?","options":[{"t":"Cool temperatures with open stomata","why":"Those keep it low.","_n":"2nc8b","_k":"cc53b539"},{"t":"Hot temperatures with closed stomata, which raise the O₂ : CO₂ ratio inside the leaf","why":"Heat makes rubisco grab O₂ more often, and closed stomata trap O₂ and let CO₂ run down.","_n":"2oc7b","_k":"07122c14"},{"t":"Darkness","why":"Rubisco and the light reactions are idle in the dark.","_n":"2pc2b","_k":"fa60cc99"},{"t":"High CO₂ in the air","why":"More CO₂ makes O₂ grabs \u003cstrong>less\u003c/strong> likely.","_n":"2qc1b","_k":"f9f7f513"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"How does a C4 plant keep rubisco surrounded by CO₂?","options":[{"t":"PEP carboxylase in mesophyll cells fixes CO₂ into a 4-carbon acid, which is moved to bundle-sheath cells and releases CO₂ around rubisco","why":"The two cell types separate CO₂ capture from the Calvin cycle in space.","_n":"2r836","_k":"a38ffc34"},{"t":"It closes its stomata permanently","why":"It still needs CO₂ from the air.","_n":"2s826","_k":"1f9d625f"},{"t":"It stores CO₂ in its vacuoles at night","why":"That’s CAM.","_n":"2t816","_k":"82d901a3"},{"t":"It has no rubisco and makes sugar with PEP carboxylase","why":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it.","_n":"2u806","_k":"8c6590bb"}]},"b":{"prompt":"What is Kranz anatomy?","options":[{"t":"Chloroplasts arranged in stacks called grana","why":"Grana are inside every chloroplast.","_n":"2v7f6","_k":"fd498f4f"},{"t":"A thick cuticle on desert plants","why":"That’s not specific to C4.","_n":"2w7e6","_k":"7297ccd5"},{"t":"Sunken stomata with hairs","why":"That’s a water-saving feature.","_n":"2x7d6","_k":"92e28327"},{"t":"A ring of chloroplast-rich bundle-sheath cells around each vein, where C4 plants run the Calvin cycle","why":"‘Kranz’ is German for wreath: the ring of bundle-sheath cells.","_n":"2y7c6","_k":"12eb8136"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"How does a CAM plant capture and use CO₂?","options":[{"t":"It runs the Calvin cycle at night","why":"There’s no ATP or NADPH from light at night.","_n":"2z7b6","_k":"5aca0d8f"},{"t":"It takes in CO₂ through its roots","why":"CO₂ enters through stomata.","_n":"307a6","_k":"6aa3d45d"},{"t":"It opens its stomata at night and stores CO₂ as malic acid, then releases it to the Calvin cycle by day with its stomata closed","why":"CAM separates CO₂ capture and the Calvin cycle in time.","_n":"31fd6","_k":"d7875979"},{"t":"It passes CO₂ from mesophyll to bundle-sheath cells","why":"That’s C4.","_n":"32fe6","_k":"34d509c8"}]},"b":{"prompt":"Where and in what form does a CAM plant store its CO₂ overnight?","options":[{"t":"In the bundle-sheath cells, as CO₂ gas","why":"C4: two cell types (space). CAM: night and day (time).","_n":"33ff6","_k":"95e93a86"},{"t":"In the chloroplasts, as glucose","why":"At night CAM plants only \u003cstrong>capture\u003c/strong> CO₂. The Calvin cycle runs by day, when ATP and NADPH are made.","_n":"34006","_k":"c9a6d6c1"},{"t":"In the air spaces, as O₂","why":"O₂ isn’t stored CO₂.","_n":"35f96","_k":"ed22fe93"},{"t":"In the vacuoles, as malic acid","why":"The vacuole fills with malic acid all night, so its pH falls.","_n":"36fa6","_k":"cf8465eb"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"In the model, a C3 leaf at 30 °C goes from open to closed stomata. Predict its net carbon gain per 10 rubisco reactions and explain.","options":[{"t":"It stays at 5.5, because temperature hasn’t changed","why":"Closed stomata trap O₂ from the light reactions and let CO₂ run down, so photorespiration \u003cstrong>rises\u003c/strong>.","_n":"37fb6","_k":"d726790e"},{"t":"It falls to 7","why":"7 corresponds to only 2 O₂ events.","_n":"38fc6","_k":"74bc2a5c"},{"t":"It falls from 5.5 to 1: O₂ events rise from 3 to 6, and each one also costs half a CO₂","why":"10 − 1.5 × 3 = 5.5 and 10 − 1.5 × 6 = 1.","_n":"39f56","_k":"bac0b348"},{"t":"It rises, because closing stomata saves water","why":"Closed stomata trap O₂ from the light reactions and let CO₂ run down, so photorespiration \u003cstrong>rises\u003c/strong>.","_n":"3af66","_k":"a183a484"}]},"b":{"prompt":"In the model, a C3 leaf with open stomata cools from 30 °C to 10 °C. Predict its net carbon gain and explain.","options":[{"t":"It rises from 5.5 to 8.5: O₂ events fall from 3 to 1","why":"10 − 1.5 × 3 = 5.5 and 10 − 1.5 × 1 = 8.5.","_n":"3b6f6","_k":"9306acb4"},{"t":"It falls, because cold slows rubisco","why":"In the model, cooling cuts photorespiration.","_n":"3c6e6","_k":"e8fa1981"},{"t":"It rises to 10","why":"There’s still 1 O₂ event per 10.","_n":"3d716","_k":"3d342b51"},{"t":"It stays at 5.5","why":"Temperature changes the O₂ events.","_n":"3e706","_k":"0805e719"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Plant X photosynthesizes at 30 units in 21% O₂ and 45 units in 2% O₂. Plant Y gives 50 and 51. Which conclusion fits?","options":[{"t":"The data can’t tell them apart","why":"The O₂ effect is exactly the test.","_n":"3f6b6","_k":"da122757"},{"t":"Both are C3, because both rates rose","why":"Y’s change of 1 unit is too small.","_n":"3g6a6","_k":"c7625209"},{"t":"X is a C3 plant: removing O₂ removed its photorespiration; Y is a C4 plant","why":"A big rise at low O₂ means a lot of photorespiration was removed.","_n":"3h6d6","_k":"d2ac7fcc"},{"t":"X is C4, because its rate changed more","why":"A big change means a lot of photorespiration to remove.","_n":"3i6c6","_k":"9a3fdb6d"}]},"b":{"prompt":"Two crops are grown at 10 °C and at 35 °C. Crop P’s rate falls from 50 to 30; crop Q’s rises from 25 to 70. Which conclusion fits?","options":[{"t":"Both are CAM","why":"CAM plants grow slowly at both temperatures.","_n":"3j776","_k":"3fee256d"},{"t":"P is C4, because it does better in the cold","why":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"3k766","_k":"2cfde6c5"},{"t":"P is probably C3 and Q probably C4: Q copes with heat because it avoids photorespiration","why":"C3 rates usually fall in heat as photorespiration rises; C4 rates keep climbing.","_n":"3l696","_k":"f904e07d"},{"t":"Q is C3, because its rate rose","why":"C3 rates usually fall in heat.","_n":"3m6a6","_k":"c8dd13e3"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A newly described plant has thick, fleshy leaves; its stomata open at night; its leaf sap is far more acidic at dawn than at dusk. Which pathway and habitat are most likely?","options":[{"t":"C4, in a cool marsh","why":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"3n676","_k":"4eacf21e"},{"t":"CAM, in a hot, dry place","why":"Night-open stomata and acid that builds up overnight (malic acid) are CAM’s signature, a water saver for dry places.","_n":"3o686","_k":"e682b48f"},{"t":"C3, in a cool forest","why":"C3 plants don’t build up acid overnight.","_n":"3p6d6","_k":"4241a5f7"},{"t":"C4, in a hot, humid grassland","why":"C4 plants open their stomata by day.","_n":"3q6e6","_k":"31c5fde3"}]},"b":{"prompt":"A newly described grass has a ring of chloroplast-rich cells around each vein; its outer leaf cells contain PEP carboxylase but almost no rubisco; its stomata open by day. Which pathway and habitat are most likely?","options":[{"t":"C4, in a hot, sunny grassland","why":"Kranz anatomy and PEP carboxylase in the outer (mesophyll) cells are C4’s signature, which pays off in heat and bright light.","_n":"3r6b6","_k":"ba726890"},{"t":"C3, in a cool, shady forest","why":"C3 plants lack this anatomy.","_n":"3s6c6","_k":"a505c5b7"},{"t":"CAM, in a desert","why":"CAM opens its stomata at night.","_n":"3t716","_k":"d3985761"},{"t":"CAM, in a cool lake","why":"C4: two cell types (space). CAM: night and day (time).","_n":"3u726","_k":"9e48dbdb"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the clearest explanation of why C4 plants rarely photorespire?","options":[{"t":"“They first fix CO₂ with PEP carboxylase, which ignores O₂, and release it in the bundle-sheath cells, so rubisco there is surrounded by CO₂ and seldom meets O₂.”","why":"It names the enzyme that ignores O₂, where the CO₂ is released, and why rubisco then seldom meets O₂.","_n":"3veb5","_k":"dd14afc8"},{"t":"“They photosynthesize only at night.”","why":"C4: two cell types (space). CAM: night and day (time).","_n":"3wea5","_k":"35c70b19"},{"t":"“They keep their stomata closed all day.”","why":"Closed stomata would \u003cstrong>raise\u003c/strong> photorespiration in a C3 plant; C4 plants still take in CO₂.","_n":"3xe95","_k":"1ef8923e"},{"t":"“They don’t have rubisco.”","why":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it.","_n":"3ye85","_k":"8c1de2e2"}]},"b":{"prompt":"Which is the clearest explanation of how CAM saves water?","options":[{"t":"“CAM plants don’t need CO₂.”","why":"All photosynthesis needs CO₂.","_n":"3zef5","_k":"2fcf4acb"},{"t":"“CAM plants make water in their vacuoles.”","why":"Malic acid stores CO₂, not water.","_n":"40ee5","_k":"cdae0323"},{"t":"“CAM plants run the Calvin cycle at night when it’s cooler.”","why":"At night CAM plants only \u003cstrong>capture\u003c/strong> CO₂. The Calvin cycle runs by day, when ATP and NADPH are made.","_n":"41ed5","_k":"b574e847"},{"t":"“Stomata open only in the cool, humid night, when less water is lost per unit of CO₂; the CO₂ is stored as malic acid and used by day with the stomata shut.”","why":"It says when the stomata open, why that saves water, and how the CO₂ is kept for the day.","_n":"42ec5","_k":"2b140078"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which flow chart best shows why photorespiration is wasteful?","options":[{"t":"Rubisco adds O₂ → ATP made → more growth","why":"Photorespiration \u003cstrong>uses\u003c/strong> ATP and releases CO₂ without making sugar or ATP. It’s a costly side-reaction of rubisco.","_n":"43f35","_k":"6247d80b"},{"t":"Cool day → more O₂ events → plant dies","why":"Cool weather lowers photorespiration.","_n":"44f25","_k":"a93009d5"},{"t":"Hot day → stomata open → more CO₂ → more sugar","why":"Closed stomata trap O₂ from the light reactions and let CO₂ run down, so photorespiration \u003cstrong>rises\u003c/strong>.","_n":"45655","_k":"b401176b"},{"t":"Hot, dry day → stomata close → O₂ rises, CO₂ falls → rubisco adds O₂ to RuBP → ATP spent salvaging, CO₂ released → less net sugar","why":"Each step follows from the one before, ending in the real cost: ATP spent and carbon lost.","_n":"46665","_k":"4f2c8e64"}]},"b":{"prompt":"Which best explains why photorespiration rises as a C3 leaf heats up, even with its stomata open?","options":[{"t":"“Open stomata let in too much CO₂.”","why":"C4 plants already concentrate CO₂. Extra CO₂ mostly helps C3 plants, by cutting their photorespiration.","_n":"47675","_k":"7f1a736b"},{"t":"“Warm leaves make extra O₂ by respiration.”","why":"Respiration uses O₂.","_n":"48685","_k":"9974431f"},{"t":"“Warmth makes rubisco grab O₂ relatively more often, and CO₂ dissolves less well in warm cell fluid than O₂ does.”","why":"Both effects raise the O₂ : CO₂ competition at rubisco.","_n":"49695","_k":"1b4c2778"},{"t":"“Heat destroys the Calvin cycle.”","why":"It raises the O₂ : CO₂ competition at rubisco.","_n":"4a6a5","_k":"159d56fb"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"An Ontario farmer has a field in a region with hot, humid July weather. Why does corn often out-produce wheat in midsummer there?","options":[{"t":"C4 plants are better everywhere","why":"C4 costs about 2 extra ATP per CO₂. In cool climates, where photorespiration is low, C3 plants often do better.","_n":"4b6b5","_k":"b97054af"},{"t":"Wheat closes its stomata at night","why":"Wheat is C3; its stomata open by day.","_n":"4c6c5","_k":"f9cbca1b"},{"t":"Corn has no rubisco","why":"All three use the Calvin cycle and rubisco. C4 and CAM just deliver concentrated CO₂ to it.","_n":"4d6d5","_k":"ac16cb27"},{"t":"Corn is C4, so it avoids photorespiration in the heat, while wheat (C3) loses much of its fixed carbon","why":"In July heat, C4’s extra ATP cost is repaid many times over.","_n":"4e6e5","_k":"66f5c738"}]},"b":{"prompt":"A heat wave hits a Prairie wheat crop in July. Why does the crop’s growth drop more than a nearby corn field’s?","options":[{"t":"Heat stops all photosynthesis in C3 plants","why":"It reduces the net gain; it doesn’t stop it.","_n":"4ff76","_k":"b5594487"},{"t":"Corn opens its stomata at night","why":"C4: two cell types (space). CAM: night and day (time).","_n":"4gf66","_k":"e16ddd5b"},{"t":"Wheat is C3: heat and closed stomata raise its photorespiration, while corn’s C4 pathway keeps rubisco supplied with CO₂","why":"The heat wave hurts the pathway with no CO₂ concentrator.","_n":"4hf96","_k":"fda0f61c"},{"t":"Wheat has more rubisco","why":"That isn’t why heat hurts it more.","_n":"4if86","_k":"e862fcfb"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"As CO₂ in the atmosphere rises, which crops would you expect to gain more in photosynthesis, and why?","options":[{"t":"C3 crops, because more CO₂ makes rubisco grab O₂ less often, cutting their photorespiration","why":"C4 plants already concentrate CO₂. Extra CO₂ mostly helps C3 plants, by cutting their photorespiration.","_n":"4jfb6","_k":"afe2a7dd"},{"t":"CAM crops, because they store more CO₂","why":"Their bottleneck is night storage, not air CO₂.","_n":"4kfa6","_k":"f43370d4"},{"t":"No crops: CO₂ doesn’t affect photosynthesis","why":"CO₂ is the raw material.","_n":"4lfd6","_k":"9d72cae2"},{"t":"C4 crops, because they love CO₂","why":"They already concentrate it.","_n":"4mfc6","_k":"52a35aa8"}]},"b":{"prompt":"A greenhouse adds extra CO₂ to its air. Which plants benefit most: its tomatoes (C3) or its corn seedlings (C4)?","options":[{"t":"Both equally","why":"Their response to CO₂ differs.","_n":"4nef6","_k":"58d770e3"},{"t":"The corn, because C4 plants use more CO₂","why":"C4 plants already concentrate CO₂. Extra CO₂ mostly helps C3 plants, by cutting their photorespiration.","_n":"4oee6","_k":"a71f14fd"},{"t":"The tomatoes: extra CO₂ reduces their photorespiration, while the corn already supplies rubisco with concentrated CO₂","why":"C4 plants already concentrate CO₂. Extra CO₂ mostly helps C3 plants, by cutting their photorespiration.","_n":"4pf16","_k":"46251f9c"},{"t":"Neither: greenhouses are already full of CO₂","why":"Plants deplete greenhouse CO₂ during the day.","_n":"4qf26","_k":"0725dec9"}]}}]},"task":{"title":"A plant for its place","summary":"A plant for its place","statement":"\u003cp>Build a plant whose parts match its pathway and suit its home. Can you find all the answers?\u003c/p>\u003col class=\"cc-tlist\">\u003cli>The parts match the pathway.\u003c/li>\u003cli>Little photorespiration in this region.\u003c/li>\u003cli>Water loss fits the region.\u003c/li>\u003cli>No wasted energy.\u003c/li>\u003cli>Fast growth where water allows it.\u003c/li>\u003c/ol>","inputs":{"path":{"label":"Pathway","options":[["C3","C3"],["C4","C4"],["CAM","CAM"]]},"enz":{"label":"First enzyme to fix CO₂","options":[["rub","Rubisco"],["pep","PEP carboxylase"]]},"loc":{"label":"Calvin cycle location","options":[["meso","Mesophyll cells"],["bs","Bundle-sheath cells"]]},"sto":{"label":"Stomata open","options":[["day","Day"],["night","Night"]]},"reg":{"label":"Region","options":[["cool","Cool and moist (Ontario spring)"],["humid","Hot and humid (tropical lowland)"],["dry","Hot and dry (desert)"]]}},"checks":["Parts match the pathway","Little photorespiration here","Water loss fits","No wasted energy","Fast growth where water allows"],"tips":["Check each pathway’s three parts: first enzyme, where the Calvin cycle runs, and when the stomata open.","In hot places, rubisco needs a CO₂ concentrator.","In a desert, only night-opening keeps water loss low enough.","In a cool climate, photorespiration is already low, so concentrating CO₂ wastes ATP.","Where water is plentiful, CAM’s night-only CO₂ capture is too slow."],"explainPrompt":"Explain why each pathway suits only one of the three regions.","vocab":"Use the words photorespiration, rubisco, PEP carboxylase, stomata and ATP.","more":"There’s more than one answer. Can you find another?","after3":"Each pathway has exactly one home where it beats the others. That’s why wheat, corn and pineapple grow in such different places."},"cards":[["Photorespiration","Rubisco adds O₂ to RuBP; ATP is spent and fixed CO₂ is lost, with no sugar made"],["What raises photorespiration","Heat and closed stomata (high O₂ : CO₂ inside the leaf)"],["C3 plant","Rubisco fixes CO₂ directly in mesophyll cells (wheat, canola, maple)"],["C4 plant","CO₂ first fixed into a 4-carbon acid in mesophyll, then released around rubisco in bundle-sheath cells (corn, sugarcane)"],["Kranz anatomy","A ring of chloroplast-rich bundle-sheath cells around each vein"],["PEP carboxylase","The enzyme that first fixes CO₂ in C4 and CAM plants; it ignores O₂"],["CAM plant","Stomata open at night; CO₂ stored as malic acid; Calvin cycle by day (pineapple, cacti)"],["Space vs time","C4 separates the steps in space (two cell types); CAM in time (night and day)"],["Cost of C4","About 2 extra ATP per CO₂"],["Best in the cool","C3: photorespiration is low, so concentrating CO₂ isn’t worth it"],["Oxygen test","Lowering O₂ boosts a C3 plant’s rate a lot; a C4 plant’s barely changes"],["Rising CO₂","Helps C3 crops more, by cutting their photorespiration"]]}};</script>
