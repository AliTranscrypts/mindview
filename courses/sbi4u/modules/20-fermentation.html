.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 20: oxygen-switch map (S2), ledger strip (S3), NAD⁺ gauge, Part 3 stations, task fermenter.
   Roles (course plan §3, plan build notes): carbon tokens (pyruvate, lactate, acetaldehyde, ethanol, CO₂'s carbon) --bio-carbon;
   NADH, NAD⁺ loops and the NAD⁺ gauge --bio-nadh; ATP --bio-atp; FADH₂ --bio-fadh; O₂ and H₂O --pen (--bio-o2);
   cytosol and mitochondrion outlines --ink-2; entry arrows (Other fuels) --ink on a --hi-soft underlay. */

/* hero equation */
.hero .hero-eq .fe-heq{display:inline-flex;flex-direction:column;gap:.45em;align-items:flex-start;font-size:.47em;line-height:1.2}
.fe-nw{white-space:nowrap}
.fe-hl{display:inline-flex;flex-wrap:wrap;align-items:flex-start;gap:.3em}
.fe-hl .bio-tok{font-size:.9em}
.fe-arr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;margin:0 .1em}
.fe-loop{display:block;font-size:.52em;font-weight:700;color:var(--bio-nadh);white-space:nowrap;margin-top:.2em}
.fe-hero{max-width:460px;margin:0 auto}
.fe-hsvg{display:block;width:100%;height:auto}

/* radio groups (from SBI4U 14 / 10 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.fe-sl{margin:0}
.fe-sl input{width:100%;accent-color:var(--ink)}

/* explore layout */
.fe-ex [hidden],.fe-p3 [hidden]{display:none!important}
@media (min-width:821px){ .pg.fe-pg{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} }
.fe-pg .pg-ctrl{display:grid;gap:12px}
.fe-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.fe-enote{margin:-4px 0 0}
.fe-time{display:grid;gap:6px}
.fe-player{display:flex;flex-wrap:wrap;gap:8px}
.fe-map{border:1.5px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--sheet)}
.fe-map svg{display:block;width:100%;height:auto}
.fe-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:8px 0 0;color:var(--ink-2)}
.fe-kk{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:.68rem;font-weight:700;color:var(--sheet)}
.fe-kk-c{background:var(--bio-carbon)}.fe-kk-n{background:var(--bio-nadh)}.fe-kk-o{background:var(--bio-o2)}.fe-kk-a{background:var(--bio-atp)}
.fe-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.fe-ans{margin:0;border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px 10px}
.fe-ans legend{font-size:.88rem;font-weight:700;color:var(--ink-2);padding:0 4px}
.fe-ansrow{display:flex;flex-wrap:wrap;gap:6px 14px}
.fe-ansrow .numrow{margin:0}
.fe-ansrow .numin{width:5.5em}
.fe-note{margin:10px 0 0}

/* map SVG */
.fe-cell{fill:none;stroke:var(--ink-2);stroke-width:2}
.fe-wall{fill:none;stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3}
.fe-title{font:700 14px var(--font-ui);fill:var(--ink)}
.fe-lab,.fe-sm{font:600 12.5px var(--font-ui);fill:var(--ink-2)}
.fe-c{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1.2}
.fe-ct{font:700 11px var(--font-ui);fill:var(--sheet)}
.fe-co2{fill:var(--sheet);stroke:var(--bio-carbon);stroke-width:1.8}
.fe-co2t{font:700 10.5px var(--font-ui);fill:var(--bio-carbon)}
.fe-co2l{font:700 13px var(--font-ui);fill:var(--bio-carbon)}
.fe-lane{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:6 4}
.fe-lanehd{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.fe-gbox{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.fe-gbox.off{stroke-dasharray:5 4}
.fe-bt{font:700 13.5px var(--font-ui);fill:var(--ink)}
.fe-atpt{font:700 11.5px var(--font-ui);fill:var(--bio-atp)}
.fe-nt{font:700 11px var(--font-ui);fill:var(--bio-nadh)}
.fe-stop{font:700 12.5px var(--font-ui);fill:var(--ink)}
.fe-mo{fill:none;stroke:var(--ink-2);stroke-width:2}
.fe-mi{fill:none;stroke:var(--ink-2);stroke-width:1.1;stroke-dasharray:7 4}
.fe-stn{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.fe-st{font:700 12.5px var(--font-ui);fill:var(--ink)}
.fe-st2{font:700 11.5px var(--font-ui);fill:var(--ink)}
.fe-ar{fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linejoin:round}
.fe-rt{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.fe-rt.on{stroke:var(--ink);stroke-width:2.6;stroke-dasharray:none}
.fe-rt.blk{stroke-dasharray:3 5}
.fe-hd{stroke-dasharray:none}
.fe-enz{font:italic 600 11.5px var(--font-ui);fill:var(--ink)}
.fe-blk{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.fe-pile{font:700 11.5px var(--font-ui);fill:var(--ink)}
.fe-loop{fill:none;stroke:var(--bio-nadh);stroke-width:2.2}
.fe-nadh{fill:var(--bio-nadh)}
.fe-lt{font:700 10px var(--font-ui);fill:var(--bio-nadh)}
.fe-o2{fill:var(--bio-o2)}
.fe-o2t{font:700 11px var(--font-ui);fill:var(--sheet)}
.fe-o2a{fill:none;stroke:var(--bio-o2);stroke-width:2}
.fe-o2l{font:700 11px var(--font-ui);fill:var(--bio-o2)}
.fe-noo2{font:italic 700 12px var(--font-ui);fill:var(--ink-2)}
.fe-gl{font:700 13px var(--font-ui);fill:var(--ink)}
.fe-gt{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.fe-gf{fill:var(--bio-nadh)}
.fe-gm{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 3}
.fe-gv{font:700 12.5px var(--font-ui);fill:var(--ink)}
.fe-o2bar{fill:var(--bio-o2)}
/* other fuels */
.fe-enu{fill:none;stroke:var(--hi-soft);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.fe-en{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.fe-enl{font:700 12px var(--font-ui);fill:var(--ink)}
.fe-ringh{fill:none;stroke:var(--hi-soft);stroke-width:9}
.fe-ring{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:4 3}
.fe-chain{fill:none;stroke:var(--bio-carbon);stroke-width:2.5}
.fe-bead{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1}
.fe-cut{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:3 2}
.fe-nh2{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.fe-nh2t{font:700 11px var(--font-ui);fill:var(--ink)}

/* S3 ledger strip (sticky under the step bar on phones) */
.fe-led{margin:0 0 12px}
.fe-lrow{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.fe-cell{display:grid;grid-template-columns:auto auto;gap:0 6px;align-items:baseline;padding:4px 8px;border:1px solid var(--rule);border-radius:6px;min-width:0;flex:1 1 auto}
.fe-cl{font-size:.75rem;font-weight:700;color:var(--ink-2)}
.fe-cell > b{font-size:1.05rem;font-variant-numeric:tabular-nums;text-align:right}
.fe-catp{flex:2 1 220px}
.fe-tal{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:2px;min-height:10px;margin-top:2px}
.fe-tal i{display:block;width:6px;height:10px;border-radius:1px;background:var(--c)}
.fe-tal b{font-size:.75rem;color:var(--ink-2)}
.fe-abar{grid-column:1 / -1;position:relative;display:block;height:12px;margin:4px 0 14px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--sheet)}
.fe-abar i{position:absolute;left:0;top:0;bottom:0;background:var(--bio-atp);border-radius:2px}
.fe-abar b{position:absolute;top:-3px;bottom:-3px;width:0;border-left:1.5px solid var(--ink)}
.fe-abar em{position:absolute;top:13px;transform:translateX(-50%);font-style:normal;font-size:.68rem;font-weight:700;color:var(--ink-2)}
@media (max-width:640px){
  .fe-lrow{gap:4px;padding:6px}
  .fe-cell{padding:2px 6px}
  .fe-cell > b{font-size:.95rem}
  .fe-tal{display:none}
}

/* Part 3 */
.fe-sta h3{margin-top:0}
.fe-two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:720px){ .fe-two{grid-template-columns:minmax(0,1fr)} }
.fe-fig{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);overflow:hidden}
.fe-fig svg{display:block;width:100%;height:auto}
.fe-scap{margin:8px 0 0;font-size:.95rem;min-height:2.6em}
.fe-bowl{fill:none;stroke:var(--ink-2);stroke-width:2.5}
.fe-dough{fill:var(--paper);stroke:var(--ink-2);stroke-width:2}
.fe-dough.baked{stroke:var(--ink);stroke-width:3.5}
.fe-bub{fill:var(--sheet);stroke:var(--bio-carbon);stroke-width:1.6}
.fe-yc{fill:none;stroke:var(--ink);stroke-width:1.5}
.fe-x{font:700 11px var(--font-ui);fill:var(--ink)}
.fe-heat{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round}
.fe-jar{fill:none;stroke:var(--ink-2);stroke-width:2.2}
.fe-milk{fill:var(--paper)}
.fe-rod{fill:var(--ink-2)}
.fe-prot{fill:var(--ink);opacity:.75}
.fe-tick{stroke:var(--ink-2);stroke-width:1.5}
.fe-ph{fill:var(--ink);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.fe-phv{font:700 13px var(--font-ui);fill:var(--ink)}
.fe-rxn{font-size:1.05rem;display:flex;flex-wrap:wrap;align-items:center;gap:.35em}
.fe-nadp{display:inline-block;border:2px solid var(--bio-nadh);color:var(--bio-nadh);border-radius:999px;padding:0 .5em;font-size:.85em;font-weight:700}
.fe-chainl{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center}
.fe-chainl li{border:1.5px solid var(--rule);border-radius:8px;padding:.3em .6em;font-size:.92rem;color:var(--ink-2);background:var(--sheet)}
.fe-chainl li + li::before{content:"→";margin:0 .45em 0 -.2em;color:var(--ink-2)}
.fe-chainl li.on{border-color:var(--ink);color:var(--ink);font-weight:700;background:var(--hi-soft)}
.fe-bal2{margin-top:12px}
.fe-ful{fill:var(--paper);stroke:var(--ink-2);stroke-width:2}
.fe-beam{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.fe-str{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.fe-pan{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.8}
.fe-bench{margin:8px 0}
.fe-flask{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.fe-liq{fill:var(--paper)}
.fe-yst{fill:var(--ink-2)}
.fe-neck{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.fe-bal{fill:var(--sheet);stroke:var(--bio-carbon);stroke-width:2}
.fe-tgt{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.fe-vol{font:700 12px var(--font-ui);fill:var(--bio-carbon)}
.fe-vtray{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;min-height:36px}
.fe-roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){ .fe-roles{grid-template-columns:minmax(0,1fr)} }
.fe-role .bin{width:100%;min-height:auto}
.fe-rin{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:30px}
.fe-rin .chip{font-size:.85rem}
.fe-t5r{margin:6px 0 0}
.fe-key5{display:inline-block;width:18px;height:3px;background:var(--bio-carbon);vertical-align:middle}
.fe-zbox{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.fe-zbox.on{stroke:var(--ink);stroke-width:2.6}
.fe-nadhp{fill:var(--bio-nadh)}
.fe-nadht{font:700 10.5px var(--font-ui);fill:var(--sheet)}
.fe-m5{margin-top:14px}
@media (max-width:560px){
  .hero .hero-eq .fe-heq{font-size:.62em}
  .fe-bench .fe-sm,.fe-bench .fe-vol{font-size:18px}
  .fe-zfig .fe-st{font-size:15px}
}
.fe-sta .plot-wrap{max-width:680px}
.fe-zfig{max-width:620px}
#fe-conc .opts{grid-template-columns:minmax(0,1fr)}
.fe-role{min-width:0}

/* task */
.fe-conds{margin:6px 0 10px;padding-left:1.4em}
.fe-tin{display:grid;gap:10px;margin:8px 0}
.fe-tpvw h4{margin:0 0 6px}
.fe-tpvw .fe-fig{max-width:260px}

/* phones: the map scales to about 70 %, so its labels grow a little */
@media (max-width:560px){
  .fe-map .fe-sm,.fe-map .fe-lab{font-size:14px}
  .fe-map .fe-title{font-size:15.5px}
  .fe-map .fe-st{font-size:13.5px}
  .fe-map .fe-st2{font-size:12.5px}
  .fe-map .fe-bt{font-size:14.5px}
  .fe-map .fe-nt,.fe-map .fe-atpt,.fe-map .fe-ct{font-size:12px}
  .fe-map .fe-enz{font-size:13px}
  .fe-map .fe-pile{font-size:13px}
  .fe-map .fe-enl{font-size:13.5px}
  .fe-map .fe-lt{font-size:10.5px}
  .fe-map .fe-gl{font-size:14px}
  .fe-map .fe-co2t,.fe-map .fe-o2t,.fe-map .fe-o2l{font-size:11.5px}
}

/* Chrome's details content slot drops the inherited border-box, so re-set it for what sits inside the panels */
.fe-p3 details > *{box-sizing:border-box}

</style>

that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"0b46c07a","content":{"id":"20-fermentation","kind":"topic","title":"Alternate pathways (fermentation)","topic":"Alternate Pathways (Fermentation)","readyTopic":"fermentation","hero":{"eq":"\u003cspan class=\"fe-heq\">\u003cspan class=\"fe-hl\">\u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">glucose\u003c/span> \u003cspan class=\"fe-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/span> \u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">2 pyruvate\u003c/span> \u003cspan class=\"fe-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003csmall class=\"fe-loop\">\u003cspan aria-hidden=\"true\">↻\u003c/span> NADH → NAD⁺\u003c/small>\u003c/span> \u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">2 lactate\u003c/span>\u003c/span>\u003cspan class=\"fe-hl\">\u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">glucose\u003c/span> \u003cspan class=\"fe-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/span> \u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">2 pyruvate\u003c/span> \u003cspan class=\"fe-arr\">\u003cspan aria-hidden=\"true\">→\u003c/span>\u003csmall class=\"fe-loop\">\u003cspan aria-hidden=\"true\">↻\u003c/span> NADH → NAD⁺\u003c/small>\u003c/span> \u003cspan class=\"fe-nw\">\u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">2 ethanol\u003c/span> + \u003cspan class=\"bio-tok\" style=\"--tok:var(--bio-carbon)\">2 CO₂\u003c/span>\u003c/span>\u003c/span>\u003c/span>","eqLabel":"Lactate fermentation: glucose, then 2 pyruvate, then 2 lactate. Alcohol fermentation: glucose, then 2 pyruvate, then 2 ethanol plus 2 CO₂. Under each second arrow, NADH is turned back into NAD⁺.","eqSize":"sm","headline":"No oxygen? Recycle the carrier.","text":"Glycolysis needs a steady supply of \u003cstrong>NAD⁺\u003c/strong>. With oxygen, the electron transport chain recycles NADH back to NAD⁺. Without it, cells use \u003cstrong>fermentation\u003c/strong>: pyruvate takes the electrons instead, becoming \u003cstrong>lactate\u003c/strong> in your muscles or \u003cstrong>ethanol and CO₂\u003c/strong> in yeast. The cell gets only the \u003cstrong>2 ATP\u003c/strong> from glycolysis, but it stays alive.","fig":{"html":"\u003cdiv class=\"fe-hero\" id=\"fe-hero\" role=\"img\" aria-label=\"A muscle cell. A blue O₂ supply bar drains to empty. Inside, the glycolysis lane keeps turning while a teal NAD⁺ gauge falls toward zero. Just before it hits zero, an arrow from pyruvate to lactate lights up and a teal loop, NADH to NAD⁺, spins. The gauge refills and glycolysis keeps running.\">\u003c/div>"}},"goals":["I can explain why fermentation is needed: it regenerates NAD⁺ so glycolysis can continue.","I can describe lactate and alcohol fermentation: reactants, products, CO₂ and ATP per glucose.","I can predict what happens to a cell when oxygen or a fermentation enzyme is missing.","I can compare the ATP yield of aerobic respiration and fermentation, and use it in calculations.","I can describe how fats and proteins enter cellular respiration.","I can apply fermentation to food, fuel and exercise, and interpret data from a fermentation experiment."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Glycolysis totals","goal":4,"prompt":"What is the \u003cstrong>net\u003c/strong> ATP yield of glycolysis per glucose?","options":[{"t":"2 ATP","why":"4 made by substrate-level phosphorylation, minus 2 invested.","_n":"0973","_k":"baf67a14"},{"t":"0 ATP","why":"4 made − 2 spent = 2.","_n":"1943","_k":"28cdbd5d"},{"t":"36 ATP","why":"That’s the theoretical total for all four stages.","_n":"2953","_k":"2ed2ccb3"},{"t":"4 ATP","why":"Gross, not net. Two ATP were spent in the investment phase.","_n":"3923","_k":"8bc20a7d"}],"hints":["Glycolysis has an investment phase and a payoff phase.","Spent 2, made 4.","Net 2 ATP."]},{"id":"w2","skill":"Glycolysis totals","goal":2,"prompt":"Glycolysis splits one glucose (6C) into…","options":[{"t":"2 lactate","why":"Lactate is made \u003cstrong>after\u003c/strong> glycolysis, only without O₂.","_n":"4933","_k":"f043a4cf"},{"t":"2 pyruvate (3C each)","why":"6 carbons become 2 × 3.","_n":"5903","_k":"9eee52da"},{"t":"6 CO₂","why":"CO₂ is released later, in pyruvate oxidation and the Krebs cycle.","_n":"6913","_k":"b1e63143"},{"t":"3 pyruvate (2C each)","why":"Acetyl groups (2C) come later, in pyruvate oxidation.","_n":"78e3","_k":"a6124f69"}],"hints":["Count the carbons.","6 = 2 × 3.","2 pyruvate."]},{"id":"w3","skill":"NAD⁺ and NADH","goal":1,"prompt":"During glycolysis, NAD⁺ is…","options":[{"t":"oxidized to NADH","why":"OIL RIG: gaining electrons is reduction.","_n":"88f3","_k":"0008fded"},{"t":"used up and never regenerated","why":"Carriers are recycled; that’s what this module is about.","_n":"9e5d","_k":"f9fed60d"},{"t":"reduced to NADH","why":"It gains electrons (and a hydrogen) from the sugar.","_n":"ae4d","_k":"536ba4f7"},{"t":"turned into ATP","why":"NADH carries electrons; ATP is separate.","_n":"be7d","_k":"c33f35dc"}],"hints":["Does NAD⁺ gain or lose electrons in glycolysis?","It picks up 2 electrons and a proton.","Reduced to NADH."]},{"id":"w4","skill":"NAD⁺ and NADH","goal":1,"prompt":"A cell has a fixed, small pool of NAD⁺. What happens if NADH is never turned back into NAD⁺?","options":[{"t":"Glycolysis stops once the NAD⁺ is used up","why":"Glycolysis needs NAD⁺ to accept electrons.","_n":"ce6d","_k":"4844615b"},{"t":"Glycolysis speeds up","why":"More NADH doesn’t mean more energy here. Without NAD⁺, the step that needs it can’t happen.","_n":"de1d","_k":"f92568d8"},{"t":"The cell makes NAD⁺ from glucose","why":"NAD⁺ is a carrier made from a vitamin (niacin), not from glucose.","_n":"ee0d","_k":"e0ef46b4"},{"t":"Nothing; NADH works just as well","why":"NADH is already full of electrons; it can’t accept more.","_n":"fe3d","_k":"0b5ebe6c"}],"hints":["Which form accepts electrons?","NAD⁺, the empty form.","No NAD⁺ → glycolysis stops."]},{"id":"w5","skill":"Aerobic respiration","goal":4,"prompt":"In aerobic respiration, what is the final electron acceptor?","options":[{"t":"CO₂","why":"CO₂ is a waste product, released from carbon compounds.","_n":"ge2d","_k":"d208b6d0"},{"t":"Pyruvate","why":"That’s fermentation. Pyruvate accepts electrons only when O₂ is absent (lactate fermentation).","_n":"hddd","_k":"4d372e36"},{"t":"O₂, forming water","why":"Oxygen pulls the electrons at the end of the chain.","_n":"idcd","_k":"7eb0153b"},{"t":"NAD⁺","why":"NAD⁺ starts the electrons’ journey; O₂ ends it.","_n":"jd3d","_k":"35fe0873"}],"hints":["What do you breathe in, and why?","It ends up as H₂O.","O₂."]},{"id":"w6","skill":"Aerobic respiration","goal":4,"prompt":"Using the theoretical count (3 ATP per NADH, 2 per FADH₂), how many ATP does a eukaryotic cell make per glucose aerobically?","options":[{"t":"2","why":"That’s the fermentation figure: glycolysis alone.","_n":"kd4d","_k":"ed37f8dd"},{"t":"30","why":"About 30–32 is the \u003cstrong>current estimate\u003c/strong> (2.5 and 1.5 per carrier), not the theoretical count.","_n":"ld5d","_k":"66dc5d8b"},{"t":"36","why":"The glycerol-phosphate shuttle costs 2 of the 38.","_n":"md6d","_k":"9d64fed6"},{"t":"38","why":"That’s the prokaryote figure. Prokaryotes skip the mitochondrial shuttle cost.","_n":"ncfd","_k":"0586bcb7"}],"hints":["Check the assumption in the question.","Theoretical eukaryote, using the glycerol-phosphate shuttle.","36."]}],"refreshers":{"Glycolysis totals":"Per glucose: 2 ATP spent, 4 made (net 2), 2 NADH made, 2 pyruvate (3C) formed. It happens in the cytosol and needs no O₂.","NAD⁺ and NADH":"NAD⁺ is the empty carrier; NADH is loaded with 2 electrons. A cell has only a small pool, so NADH must be emptied back to NAD⁺ for glycolysis to continue.","Aerobic respiration":"O₂ is the final electron acceptor. The theoretical yield is 36 ATP (eukaryote) or 38 (prokaryote); current estimates are about 30–32."}}},"explore":{"heading":"Oxygen switch","intro":"Choose a cell, then turn the oxygen off. Watch where pyruvate goes, what happens to the NAD⁺ supply, and how much ATP the cell gets per glucose.","chalIntro":"Use the oxygen switch to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. For challenge 3, switch to \u003cstrong>Other fuels\u003c/strong> and type your numbers in the answer boxes under the controls. Each challenge has three levels of help.","modelNote":"Glycolysis runs at 10 glucose/s while it has NAD⁺. The NAD⁺ pool starts at 100 units, and each glucose uses 2. O₂ (through the chain) or a working fermentation enzyme returns them. Settings apply from 0 s.","enzNote":"Muscle cell: lactate dehydrogenase. Yeast cell: alcohol dehydrogenase (pyruvate decarboxylase stays on).","predictions":[{"id":"p1","prompt":"Yeast in a sealed bottle of sugar water: what gas bubbles out?","options":[{"t":"O₂","_n":"od0d","_k":"183cd8ad"},{"t":"H₂","_n":"pd1d","_k":"d8c48f03"},{"t":"CO₂","_n":"qd2d","_k":"4972749e"},{"t":"No gas","_n":"rdbd","_k":"c5288e92"}],"explain":"Pyruvate (3C) loses one carbon as CO₂ to become acetaldehyde (2C), which is then reduced to ethanol.","reveal":"Brown CO₂ tokens leave each pyruvate as acetaldehyde forms. The CO₂ row reads 2 per glucose.","start":{"cell":"yeast","o2":"absent","enz":"working","t":0},"to":8},{"id":"p2","prompt":"How much CO₂ does lactate fermentation release per glucose?","options":[{"t":"0","_n":"sdcd","_k":"527e61bd"},{"t":"1","_n":"td9d","_k":"752345cf"},{"t":"2","_n":"ud8d","_k":"214c260f"},{"t":"6","_n":"vd7d","_k":"74942c7b"}],"explain":"NADH hands its electrons straight to pyruvate. No carbon is removed.","reveal":"Pyruvate became lactate with all three carbons kept. The CO₂ row reads 0.","start":{"cell":"muscle","o2":"absent","enz":"working","t":0},"to":8},{"id":"p3","prompt":"Muscle cell, O₂ absent, enzyme \u003cstrong>blocked\u003c/strong>; Play from 0 s. What happens to glycolysis?","options":[{"t":"It speeds up to make up for the lost ATP","_n":"wd6d","_k":"7735a053"},{"t":"It keeps making 2 ATP per glucose","_n":"xd5d","_k":"5c1cf20f"},{"t":"It stops when the NAD⁺ runs out","_n":"yd4d","_k":"bb71b62c"},{"t":"It switches to the Krebs cycle","_n":"zd3d","_k":"2b160023"}],"explain":"Without O₂ \u003cstrong>and\u003c/strong> without fermentation, nothing turns NADH back into NAD⁺. Fermentation’s whole job is that recycling.","reveal":"The NAD⁺ gauge drained to 0 at 5 s and the glycolysis lane froze.","start":{"cell":"muscle","o2":"absent","enz":"blocked","t":0},"to":8},{"id":"p4","prompt":"Yeast, O₂ absent → switch O₂ to present (theoretical count). ATP per glucose jumps from 2 to…","options":[{"t":"4","_n":"10d2d","_k":"841b5e93"},{"t":"18","_n":"11e1d","_k":"626ce5e2"},{"t":"36","_n":"12e0d","_k":"aa43f783"},{"t":"38","_n":"1367c","_k":"eced58da"}],"explain":"Yeast are eukaryotes, so with the 3/2 assumption and the glycerol-phosphate shuttle the theoretical total is 36: 18 times the fermentation yield.","reveal":"The route switched to the mitochondrion; the ledger reads 36 ATP per glucose.","start":{"cell":"yeast","o2":"absent","enz":"working","t":10},"to":10}],"challenges":[{"id":"tc1","goal":[1,3],"prompt":"Keep a muscle cell’s glycolysis running for the full 60 s with \u003cstrong>no oxygen\u003c/strong>.","why":"Lactate dehydrogenase hands NADH’s electrons to pyruvate, so NAD⁺ keeps coming back and the pool stays at 100 units.","general":"Run the time all the way to 60 s with glycolysis still running.","named":{"mode":"Switch to \u003cstrong>Oxygen switch\u003c/strong> mode first.","cell":"The challenge is about a muscle cell.","blocked":"The NAD⁺ ran out at 5 s. Something has to take the electrons from NADH.","o2":"That works, but the challenge says no oxygen.","time":"Glycolysis is running. Now run the time to 60 s (press Play, or drag the time slider)."},"hints":["What does glycolysis need a constant supply of?","NAD⁺. Which pathway recycles it without O₂?","Lactate fermentation: keep the enzyme working."]},{"id":"tc2","goal":3,"prompt":"Set up a cell that makes \u003cstrong>2 CO₂ and 2 ATP\u003c/strong> per glucose.","why":"Alcohol fermentation: each pyruvate loses one CO₂, and the cell keeps glycolysis’s net 2 ATP.","general":"Look at the ATP and CO₂ rows of the ledger: you need 2 and 2.","named":{"mode":"Switch to \u003cstrong>Oxygen switch\u003c/strong> mode first.","muscle":"2 ATP, but lactate fermentation makes no CO₂.","aerobic":"That’s aerobic: 6 CO₂ and 36 ATP.","blocked":"Glycolysis stopped at 5 s; acetaldehyde piles up."},"hints":["Which fermentation releases CO₂?","Alcohol fermentation, in yeast.","Yeast, O₂ absent, enzyme working."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Other fuels: choose the fatty-acid length that gives \u003cstrong>exactly 7 acetyl-CoA\u003c/strong>, then enter the number of NADH and FADH₂ made by its beta-oxidation (before the Krebs cycle).","why":"14 carbons make 7 two-carbon acetyl-CoA. Cutting a strip into 7 pieces takes 6 cuts, and each round of beta-oxidation makes 1 NADH and 1 FADH₂: 6 and 6.","general":"Check the chain length first, then count the rounds of beta-oxidation.","named":{"fuel":"Choose \u003cstrong>Other fuels\u003c/strong>, then \u003cstrong>Fatty acid\u003c/strong>.","len":"Each acetyl-CoA has 2 carbons, so 7 of them need 14.","blank":"Type the NADH and FADH₂ numbers in the answer boxes for challenge 3.","n7":"Count the cuts, not the pieces: 7 two-carbon pieces need only 6 cuts, and each cut (round) makes 1 NADH and 1 FADH₂.","n21":"Those are the Krebs-cycle NADH (3 per acetyl-CoA); the question stops before the Krebs cycle."},"hints":["Acetyl-CoA is a 2-carbon unit.","14 carbons → 7 pieces. How many cuts does it take to cut a strip into 7 pieces?","6 rounds: 6 NADH and 6 FADH₂."]}]},"part3":{"slug":"industry","name":"At work","heading":"Fermentation at work","intro":"Five stations: bread, yogurt and cheese, fuel ethanol, a yeast experiment, and a sprinter’s muscles. Each one runs on the pathways from the oxygen switch. Work through them, then try the quick check.","st1":{"title":"Station 1: Bread","steps":[{"id":"mix","t":"Mix","cap":"Flour, water, sugar and yeast are mixed. The yeast cells start to ferment the flour’s sugars."},{"id":"rise","t":"Let it rise","cap":"Yeast cells ferment the flour’s sugars. The CO₂ bubbles are trapped by gluten, and the dough rises."},{"id":"bake","t":"Bake","cap":"In the oven, the ethanol evaporates and the yeast die. The trapped bubbles set into bread."}],"note":"In real dough, yeast ferment even before the O₂ is gone when sugar is plentiful; this module’s model keeps the simpler textbook switch."},"st2":{"title":"Station 2: Yogurt and cheese","text":"Lactic acid bacteria ferment lactose (milk sugar) into lactate. The pH falls from about 6.5 to about 4.5, milk proteins clump, and the milk thickens and sours.","zoom":"Zoom to the molecules","zoomText":"The same pyruvate → lactate step as in your muscles: lactate dehydrogenase hands NADH’s electrons to pyruvate and gives back NAD⁺. No CO₂ is released."},"st3":{"title":"Station 3: Fuel ethanol","chain":["Corn or wheat starch","glucose","yeast fermentation","ethanol","blended into gasoline"],"left":"Renewable carbon","right":"Land, water and energy inputs","ask":"Weigh it: which side do you think is heavier?","views":[{"id":"l","t":"Renewable carbon weighs more"},{"id":"e","t":"About balanced"},{"id":"r","t":"The inputs weigh more"}],"after":"There’s no single right answer here. Scientists and governments weigh the same two sides, and the balance changes with the crop, the farm and the energy used to make the fuel."},"st4":{"title":"Station 4: The yeast experiment","setup":"Five flasks, each with the same mass of yeast, 10 g of sugar and 100 mL of water, sealed with balloons and kept at different temperatures for 20 min.","temps":[15,25,35,45,55],"co2":[4,10,14,6,0],"vars":[{"id":"temp","t":"Temperature","_a":"EgtaUkE="},{"id":"co2","t":"CO₂ volume","_a":"EgZRRkE="},{"id":"yeast","t":"Mass of yeast","_a":"EgFbWEE="},{"id":"sugar","t":"Mass of sugar","_a":"EgFbWEE="},{"id":"water","t":"Volume of water","_a":"EgFbWEE="},{"id":"time","t":"Time","_a":"EgFbWEE="}],"roles":[{"id":"ind","t":"Independent variable","sub":"what you change"},{"id":"dep","t":"Dependent variable","sub":"what you measure"},{"id":"con","t":"Controlled variables","sub":"kept the same (find two)"}],"varsDone":"✓ Temperature is the independent variable, the CO₂ volume is the dependent variable, and the mass of yeast, mass of sugar, volume of water and time are all kept the same.","conclusion":{"prompt":"Choose the best conclusion.","options":[{"t":"The rate rises to a maximum in the tested range near 35 °C, then falls as the enzymes denature.","why":"It describes the whole pattern, stays within the tested range, and gives the reason.","_n":"1468c","_k":"61760821"},{"t":"The warmer the yeast, the faster they ferment.","why":"That fits 15–35 °C only. At 45 °C and 55 °C the volume falls.","_n":"1565c","_k":"bf6ef93e"},{"t":"Temperature has no effect on fermentation.","why":"The volumes range from 0 mL to 14 mL as the temperature changes.","_n":"1666c","_k":"a9c97f4a"},{"t":"35 °C is the exact best temperature for every kind of yeast.","why":"Only five temperatures were tested, 10 °C apart, with one kind of yeast. The data say “near 35 °C” for this yeast.","_n":"1763c","_k":"adfb2e72"}]},"control":{"label":"yeast + water, no sugar, 35 °C","why":"It shows the gas comes from fermenting the sugar."}},"st5":{"title":"Station 5: After the sprint","text":"Blood lactate is about 1 mmol/L at rest. It rises to about 12 mmol/L after a 400 m sprint and falls back over the next hour, while extra oxygen use stays high for the first minutes.","zoom":"Zoom to the molecules","zoomSteps":["In the muscle: pyruvate + NADH → lactate + NAD⁺, while O₂ delivery can’t keep up.","The blood carries the lactate to the liver.","In the liver, lactate is oxidized back to pyruvate and rebuilt into glucose. That uses ATP made with the extra O₂: the “oxygen debt”."],"card":"Lactate is carried to the liver and rebuilt into pyruvate and glucose. Soreness a day or two later comes from small muscle injuries, not lactate."},"quickCheck":{"title":"Fermentation at work quick check","summary":"Fermentation at work quick check","items":[{"id":"q1","goal":6,"prompt":"What makes bread dough rise?","choices":[{"t":"Lactate","fb":"Alcohol fermentation releases CO₂, trapped as bubbles.","_n":"1864c","_k":"e5ccb7ae"},{"t":"Ethanol vapour","fb":"Alcohol fermentation releases CO₂, trapped as bubbles.","_n":"1961c","_k":"5d0ef3ee"},{"t":"CO₂ from yeast","fb":"Alcohol fermentation releases CO₂, trapped as bubbles.","_n":"1a62c","_k":"1c4d3b1e"},{"t":"O₂ from yeast","fb":"Alcohol fermentation releases CO₂, trapped as bubbles.","_n":"1b5fc","_k":"13336fa7"}]},{"id":"q2","goal":6,"prompt":"In the yeast data, why is the volume 0 mL at 55 °C?","choices":[{"t":"Ethanol is a gas","fb":"At high temperature, enzyme shapes change and fermentation stops.","_n":"1c60c","_k":"a5d7c231"},{"t":"Enzymes denatured","fb":"At high temperature, enzyme shapes change and fermentation stops.","_n":"1d4dc","_k":"15651eff"},{"t":"O₂ was present","fb":"At high temperature, enzyme shapes change and fermentation stops.","_n":"1e4cc","_k":"0696a586"},{"t":"No sugar was added","fb":"At high temperature, enzyme shapes change and fermentation stops.","_n":"1f4fc","_k":"fe24c3fc"}]},{"id":"q3","goal":6,"prompt":"Which is a controlled variable in the yeast experiment?","choices":[{"t":"Temperature","fb":"Temperature is what’s changed; CO₂ is what’s measured.","_n":"1g4ec","_k":"93dfc492"},{"t":"CO₂ volume","fb":"Temperature is what’s changed; CO₂ is what’s measured.","_n":"1h51c","_k":"355095ee"},{"t":"Balloon colour","fb":"Temperature is what’s changed; CO₂ is what’s measured.","_n":"1i50c","_k":"9dee9072"},{"t":"Mass of sugar","fb":"Temperature is what’s changed; CO₂ is what’s measured.","_n":"1j53c","_k":"8acd938d"}]},{"id":"q4","goal":6,"prompt":"After a sprint, where is most lactate turned back into glucose?","choices":[{"t":"The liver","fb":"Lactate travels in the blood to the liver.","_n":"1k52c","_k":"bcf18a19"},{"t":"The kidneys","fb":"Lactate travels in the blood to the liver.","_n":"1l55c","_k":"30feb1b6"},{"t":"It’s breathed out","fb":"Lactate travels in the blood to the liver.","_n":"1m54c","_k":"9723b562"},{"t":"The lungs","fb":"Lactate travels in the blood to the liver.","_n":"1ndbc","_k":"9f4a0700"}]}]}},"practice":{"activities":[{"id":"which","type":"sorter","title":"Which pathway?","summary":"Which pathway?","goal":[1,2],"noun":"statement","txt":true,"instruction":"Ten statements. Sort each one into the route it describes.","boxes":[{"id":"b1","label":"Aerobic respiration only"},{"id":"b2","label":"Lactate fermentation only"},{"id":"b3","label":"Alcohol fermentation only"},{"id":"b4","label":"All three"}],"wrongDefault":"Check what happens to pyruvate in that route. Try another box.","items":[{"id":"i1","t":"O₂ is the final electron acceptor","_a":"EgAFFA==","why":"Only the chain uses O₂, at its very end."},{"id":"i2","t":"Pyruvate takes electrons from NADH directly, losing no carbon","_a":"EgAGFA==","why":"Lactate keeps all three carbons.","wrong":{"b3":"Alcohol fermentation removes a carbon first; lactate keeps all three."}},{"id":"i3","t":"Pyruvate loses CO₂ to become acetaldehyde","_a":"EgAHFA==","why":"Only alcohol fermentation removes CO₂ (pyruvate → acetaldehyde).","hints":["Which route makes a gas?","Yeast: CO₂ is removed first.","Alcohol only."]},{"id":"i4","t":"Begins with glycolysis, making a net 2 ATP","_a":"EgAAFA==","why":"Every route starts with glycolysis.","wrong":{"b1":"Every route starts with glycolysis."}},{"id":"i5","t":"Lets a sprinter’s muscles keep going when O₂ delivery lags","_a":"EgAGFA==","why":"Muscle cells make lactate when O₂ can’t keep up."},{"id":"i6","t":"Makes bread dough rise","_a":"EgAHFA==","why":"Yeast’s CO₂ is trapped as bubbles in the dough."},{"id":"i7","t":"The Krebs cycle runs","_a":"EgAFFA==","why":"Without O₂ the chain stops, and the Krebs cycle backs up too."},{"id":"i8","t":"NADH is turned back into NAD⁺","_a":"EgAAFA==","why":"The chain recycles NADH with O₂; fermentation recycles it without.","wrong":{"b1":"Fermentation also regenerates NAD⁺; that’s its whole purpose."},"hints":["Which molecule does glycolysis need back?","NAD⁺. The chain recycles it with O₂; fermentation recycles it without.","All three."]},{"id":"i9","t":"Used to make yogurt","_a":"EgAGFA==","why":"Lactic acid bacteria ferment lactose to lactate."},{"id":"i10","t":"Releases 6 CO₂ per glucose","_a":"EgAFFA==","why":"2 CO₂ in pyruvate oxidation + 4 in the Krebs cycle = 6.","wrong":{"b3":"Alcohol fermentation releases only 2 CO₂ per glucose."}}]},{"id":"fuel","type":"numeric","title":"Fuel accounting","summary":"Fuel accounting","goal":[4,5],"instruction":"Six problems. Problems 3–6 are non-routine (★); 5 and 6 go beyond the Final Check.","how":"Type a number, then press Check.","items":[{"id":"f1","goal":5,"prompt":"How many acetyl-CoA come from a 16-carbon fatty acid?","_a":"CA==","display":"8 acetyl-CoA","unit":"acetyl-CoA","why":"16 carbons ÷ 2 carbons per acetyl-CoA = 8.","wrong":[{"match":16,"fb":"Each acetyl-CoA carries \u003cstrong>2\u003c/strong> carbons."}]},{"id":"f2","goal":5,"prompt":"How many rounds of beta-oxidation does that 16-carbon chain need?","_a":"Bw==","display":"7 rounds","unit":"rounds","why":"8 two-carbon pieces need 7 cuts.","wrong":[{"match":8,"fb":"The last cut makes \u003cstrong>two\u003c/strong> acetyl-CoA, so 8 pieces need 7 cuts."}]},{"id":"f3","goal":4,"star":true,"prompt":"A yeast culture ferments 4 glucose molecules. How many CO₂ molecules are released?","_a":"CA==","display":"8 CO₂","unit":"CO₂","why":"Alcohol fermentation releases 2 CO₂ per glucose: 4 × 2 = 8.","wrong":[{"match":24,"fb":"That’s aerobic (6 per glucose). Alcohol fermentation releases 2 per glucose."}]},{"id":"f4","goal":4,"star":true,"prompt":"A muscle cell needs 72 ATP. How many glucose molecules must it use by lactate fermentation?","_a":"A1Q=","display":"36 glucose","unit":"glucose","why":"Fermentation gives 2 ATP per glucose: 72 ÷ 2 = 36.","wrong":[{"match":2,"fb":"That’s the aerobic answer (36 ATP each). Fermentation gives only 2 per glucose."}]},{"id":"f5","goal":[4,5],"star":true,"prompt":"Using the values box, how many ATP does a 12-carbon fatty acid yield in total?","_a":"CVc=","display":"95 ATP","unit":"ATP","use":"Per acetyl-CoA through the Krebs cycle and chain: 12 ATP. Per NADH: 3 ATP. Per FADH₂: 2 ATP. Activating a fatty acid costs 2 ATP.","why":"6 acetyl-CoA × 12 = 72; 5 rounds give 5 × 3 + 5 × 2 = 25; 72 + 25 − 2 = 95.","wrong":[{"match":97,"fb":"Subtract the 2 ATP used to activate it."},{"match":72,"fb":"Add the NADH and FADH₂ from the 5 rounds: 5 × 3 + 5 × 2 = 25."}],"hints":["12 carbons: how many acetyl-CoA, and how many rounds?","6 acetyl-CoA (72 ATP); 5 rounds give 5 NADH (15) and 5 FADH₂ (10).","72 + 15 + 10 − 2 = 95."]},{"id":"f6","goal":5,"star":true,"prompt":"Fat stores about 37 kJ/g; glycogen about 17 kJ/g. A runner stores 0.5 kg of glycogen and 10 kg of fat. About how many times more energy is in the fat?","_a":"BFEaAw==","tol":0.0115,"display":"about 44 times","unit":"times","why":"Fat: 10 000 g × 37 = 370 000 kJ. Glycogen: 500 g × 17 = 8500 kJ. 370 000 ÷ 8500 ≈ 43.5, about 44 times.","wrong":[{"match":20,"fb":"Compare the energies, not the masses: 10 000 × 37 ÷ (500 × 17)."}],"hints":["Energy = mass × energy per gram.","Fat: 10 000 g × 37 = 370 000 kJ. Glycogen: 500 g × 17 = 8500 kJ.","370 000 ÷ 8500 ≈ 43.5, about 44 times."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Karim","how":"","instruction":"Karim made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain why yeast make ethanol when oxygen runs out.","steps":["Without O₂, the electron transport chain stops.","So NADH can’t unload its electrons, and NAD⁺ runs low.","Yeast convert pyruvate to ethanol to make extra ATP.","The products are ethanol and CO₂."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is true, but the mistake is earlier."],"fixes":[{"t":"Yeast convert ethanol into pyruvate to make NADH.","why":"That’s backwards. Fermentation \u003cstrong>uses\u003c/strong> NADH and \u003cstrong>gives back\u003c/strong> NAD⁺. NADH is made in glycolysis.","_n":"1odcc","_k":"0bbb1840"},{"t":"Yeast convert pyruvate to lactate to make extra ATP.","why":"Wrong product, and still no extra ATP.","_n":"1pddc","_k":"5623f658"},{"t":"Step 3 is correct.","why":"The ethanol step makes no ATP at all.","_n":"1qdec","_k":"43301c80"},{"t":"Yeast convert pyruvate to ethanol to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","why":"Converting pyruvate to lactate or ethanol makes \u003cstrong>no\u003c/strong> ATP. Its job is to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","_n":"1rdfc","_k":"12e18f3b"}],"hints":["Does the pyruvate → ethanol route make any ATP?","No. What does it make instead?","NAD⁺."]},{"id":"e2","goal":4,"task":"Count the ATP from one glucose by lactate fermentation.","steps":["Glycolysis spends 2 ATP.","Glycolysis makes 4 ATP.","So glycolysis nets 2 ATP.","Turning 2 pyruvate into 2 lactate makes 2 more ATP, for a total of 4."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Turning pyruvate into lactate makes no ATP, so the total stays at 2.","why":"Converting pyruvate to lactate or ethanol makes \u003cstrong>no\u003c/strong> ATP. Its job is to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","_n":"1se0c","_k":"ed245beb"},{"t":"It makes 4 more ATP, for a total of 6.","why":"Converting pyruvate to lactate or ethanol makes \u003cstrong>no\u003c/strong> ATP. Its job is to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","_n":"1te1c","_k":"dab2ace2"},{"t":"The total is 4, because gross glycolysis is 4.","why":"Glycolysis makes 4 ATP but spends 2, so the net is 2.","_n":"1ue2c","_k":"32b8aeb0"},{"t":"Step 4 is correct.","why":"Converting pyruvate to lactate or ethanol makes \u003cstrong>no\u003c/strong> ATP. Its job is to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","_n":"1vd3c","_k":"8bc0db09"}],"hints":["What does lactate dehydrogenase do?","It moves electrons from NADH to pyruvate.","No ATP: total 2."]},{"id":"e3","goal":2,"task":"Describe lactate fermentation in a sprinter’s leg muscle.","steps":["O₂ delivery can’t keep up with demand.","Glycolysis continues, making pyruvate and NADH.","Each pyruvate releases one CO₂ and becomes lactate.","The lactate is later carried to the liver."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is true; the mistake is earlier."],"fixes":[{"t":"Each pyruvate releases two CO₂.","why":"Only alcohol fermentation removes CO₂ (pyruvate → acetaldehyde). Lactate keeps all three carbons.","_n":"1wd4c","_k":"633eef3b"},{"t":"Step 3 is correct.","why":"Only alcohol fermentation releases CO₂.","_n":"1x61c","_k":"0c52d74b"},{"t":"Each pyruvate becomes ethanol.","why":"That’s yeast.","_n":"1y60c","_k":"8039ca67"},{"t":"Each pyruvate takes electrons from NADH and becomes lactate, with no CO₂ released.","why":"Only alcohol fermentation removes CO₂ (pyruvate → acetaldehyde). Lactate keeps all three carbons.","_n":"1z5fc","_k":"5cb2d0dc"}],"hints":["How many carbons does lactate have?","Three, the same as pyruvate.","No CO₂ is lost."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the oxygen switch: that fermentation makes no ATP, or how fast glycolysis stopped when the enzyme was blocked?"},{"id":"j2","q":"In your own words, why does a cell that can’t get oxygen still need fermentation?"},{"id":"j3","q":"Explain to a friend the difference between what happens to pyruvate in your muscles and in yeast."},{"id":"j4","q":"Which part of fuel accounting (fats, proteins, ATP totals) still feels shaky? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is the main job of fermentation?","options":[{"t":"To store energy as lactate for later","why":"Lactate is a by-product; the point is recycling NAD⁺.","_n":"205ec","_k":"3f58b227"},{"t":"To regenerate NAD⁺ so glycolysis can continue","why":"Fermentation passes NADH’s electrons to pyruvate (or a product of it), giving back the NAD⁺ that glycolysis needs.","_n":"2165c","_k":"9a1bac14"},{"t":"To release CO₂ from glucose","why":"Only one kind of fermentation releases CO₂, and that isn’t its purpose.","_n":"2264c","_k":"bf7c0d3d"},{"t":"To make extra ATP from pyruvate","why":"The pyruvate step makes no ATP.","_n":"2363c","_k":"ab26f6ab"}]},"b":{"prompt":"Which molecule do both kinds of fermentation regenerate?","options":[{"t":"NAD⁺","why":"Both hand NADH’s electrons to pyruvate (or acetaldehyde), giving back NAD⁺.","_n":"2462c","_k":"2d795e12"},{"t":"ATP","why":"Converting pyruvate to lactate or ethanol makes \u003cstrong>no\u003c/strong> ATP. Its job is to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","_n":"2559c","_k":"dfb900b2"},{"t":"NADH","why":"NADH is used up; NAD⁺ is regenerated.","_n":"2658c","_k":"e0022394"},{"t":"Pyruvate","why":"Pyruvate is consumed, not regenerated.","_n":"27cfc","_k":"97ec6b8d"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What does alcohol fermentation produce from one glucose?","options":[{"t":"2 ethanol, 2 CO₂ and a net 4 ATP","why":"Net glycolysis is 2.","_n":"28d0c","_k":"7d58e015"},{"t":"2 lactate and a net 2 ATP","why":"That’s lactate fermentation.","_n":"29cdc","_k":"921b4c4d"},{"t":"6 CO₂, 6 H₂O and 36 ATP","why":"That’s aerobic respiration.","_n":"2acec","_k":"9a54a354"},{"t":"2 ethanol, 2 CO₂ and a net 2 ATP","why":"Each pyruvate loses one CO₂ and becomes ethanol; the ATP is glycolysis’s net 2.","_n":"2bd3c","_k":"103a6307"}]},"b":{"prompt":"What does lactate fermentation produce from one glucose?","options":[{"t":"2 lactate, 2 CO₂ and a net 2 ATP","why":"Lactate fermentation releases no CO₂.","_n":"2cd4c","_k":"bf2c5f56"},{"t":"2 lactate and a net 4 ATP","why":"Glycolysis makes 4 ATP but spends 2, so the net is 2.","_n":"2dd1c","_k":"d29fb8c8"},{"t":"2 lactate and a net 2 ATP","why":"Pyruvate is reduced straight to lactate: no CO₂, and the ATP is glycolysis’s net 2.","_n":"2ed2c","_k":"7e497609"},{"t":"2 ethanol, 2 CO₂ and a net 2 ATP","why":"That’s yeast.","_n":"2fd7c","_k":"87044eb4"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"How do the fatty acids from fats enter cellular respiration?","options":[{"t":"They are deaminated and enter as pyruvate","why":"Deamination is for amino acids.","_n":"2gd8c","_k":"c05377ce"},{"t":"They enter glycolysis as 3-carbon pieces","why":"That’s glycerol, not the fatty acids.","_n":"2hd5c","_k":"f0602260"},{"t":"Beta-oxidation cuts them into 2-carbon acetyl-CoA units, which enter the Krebs cycle","why":"Each round cuts off one 2-carbon unit, making 1 NADH and 1 FADH₂.","_n":"2id4c","_k":"cc71686b"},{"t":"They are converted into glucose first","why":"Fatty acids can’t be turned into glucose in animals.","_n":"2jd7c","_k":"90e6fc18"}]},"b":{"prompt":"What must happen to an amino acid before its carbon skeleton can be used for energy?","options":[{"t":"It’s cut into 2-carbon units by beta-oxidation","why":"That’s fatty acids.","_n":"2kd6c","_k":"0fa48c88"},{"t":"Nothing; it enters the chain directly","why":"The electron transport chain takes electrons, not amino acids.","_n":"2ld1c","_k":"f369b230"},{"t":"It’s converted into glycerol","why":"Glycerol comes from fats.","_n":"2md0c","_k":"acde6de8"},{"t":"Its amino group is removed (deamination), and the nitrogen leaves the body as urea","why":"The carbon skeleton then enters as pyruvate, acetyl-CoA or a Krebs-cycle intermediate.","_n":"2nd3c","_k":"80d1f2ab"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A mutant bacterium can do \u003cstrong>only\u003c/strong> lactate fermentation for anaerobic life, but its lactate-making enzyme is broken. It’s placed in a flask with glucose and \u003cstrong>no O₂\u003c/strong>. Predict what happens.","options":[{"t":"It keeps making 2 ATP per glucose from glycolysis alone","why":"Glycolysis needs NAD⁺ back.","_n":"2od2c","_k":"d0c82b58"},{"t":"Glycolysis runs briefly, then stops when NAD⁺ runs out, so the cell can make no ATP","why":"With no O₂ and no working fermentation enzyme, nothing turns NADH back into NAD⁺.","_n":"2pddc","_k":"2b8dee46"},{"t":"It switches to the Krebs cycle to recycle NAD⁺","why":"The Krebs cycle also makes NADH, and needs O₂ to keep going.","_n":"2qdcc","_k":"558fd7c3"},{"t":"It makes ethanol instead","why":"It has no alcohol fermentation enzymes.","_n":"2r5a7","_k":"a6241dcd"}]},"b":{"prompt":"Yeast are given a drug that blocks alcohol dehydrogenase (acetaldehyde → ethanol) and are kept with sugar and \u003cstrong>no O₂\u003c/strong>. Predict what happens.","options":[{"t":"Ethanol production speeds up","why":"The ethanol step is blocked.","_n":"2s597","_k":"09813220"},{"t":"The yeast switch to the electron transport chain","why":"With no O₂ to accept electrons at the end of the chain, everything upstream backs up. Only glycolysis plus fermentation keeps going.","_n":"2t587","_k":"a9bddc02"},{"t":"CO₂ and acetaldehyde build up briefly, then glycolysis stops as NAD⁺ runs out","why":"Pyruvate decarboxylase still works, but nothing regenerates NAD⁺.","_n":"2u577","_k":"c703e53f"},{"t":"Glycolysis continues normally, since CO₂ is still released","why":"Releasing CO₂ doesn’t recycle NAD⁺; the blocked step does.","_n":"2v567","_k":"d307df0a"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Using 36 ATP per glucose for aerobic respiration, how many times more glucose must a cell use by fermentation to get the same ATP?","options":[{"t":"2","why":"That’s the fermentation yield itself.","_n":"2w557","_k":"91e878e8"},{"t":"9","why":"That uses 4 ATP for fermentation.","_n":"2x547","_k":"a827aca2"},{"t":"18","why":"36 ÷ 2.","_n":"2y537","_k":"5e24b4df"},{"t":"34","why":"That’s the difference, not the ratio.","_n":"2z627","_k":"2ab0a833"}]},"b":{"prompt":"Using 30 ATP per glucose for aerobic respiration, how many times more glucose must a cell use by fermentation to get the same ATP?","options":[{"t":"7.5","why":"Glycolysis makes 4 ATP but spends 2, so the net is 2.","_n":"30617","_k":"70597811"},{"t":"15","why":"30 ÷ 2.","_n":"31547","_k":"14cf050b"},{"t":"28","why":"Difference, not ratio.","_n":"32557","_k":"0a425516"},{"t":"30","why":"That’s the aerobic yield.","_n":"33567","_k":"8194d7b4"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Before a 400 m race, a runner’s blood lactate is 1 mmol/L. Just after, it’s 12 mmol/L. An hour later, it’s back near 1 mmol/L, and the runner breathed hard for several minutes after finishing. Which explanation fits all the data?","options":[{"t":"The lactate stayed in the muscles and caused soreness the next day","why":"Lactate is carried to the liver and rebuilt into pyruvate and glucose. Soreness a day or two later comes from small muscle injuries, not lactate.","_n":"34577","_k":"b726fd8e"},{"t":"Lactate built up because the Krebs cycle sped up during the race","why":"Lactate builds when the chain can’t keep up, not when the Krebs cycle speeds up.","_n":"35507","_k":"0fc7a9d0"},{"t":"Muscles fermented pyruvate to lactate when O₂ delivery fell behind; afterwards, extra O₂ supported the liver in turning lactate back into pyruvate and glucose","why":"It explains the rise, the fall over the hour and the hard breathing.","_n":"36517","_k":"3cd3a3f1"},{"t":"The lactate was breathed out as CO₂ during the hard breathing","why":"Lactate isn’t exhaled; it’s processed, mainly in the liver.","_n":"37527","_k":"ae5e2404"}]},"b":{"prompt":"A rower’s blood lactate rises from 2 to 14 mmol/L during a 2 km race and returns to 2 mmol/L over the following hour. Oxygen use stays high for several minutes after the race. Which explanation fits?","options":[{"t":"Oxygen use stays high because muscles keep fermenting after the race","why":"Fermentation doesn’t use O₂.","_n":"38537","_k":"edcf9dc6"},{"t":"Fermentation made extra ATP, which is why lactate rose","why":"Converting pyruvate to lactate or ethanol makes \u003cstrong>no\u003c/strong> ATP. Its job is to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","_n":"395c7","_k":"5e906f7b"},{"t":"Lactate fermentation regenerated NAD⁺ when O₂ supply lagged; the extra O₂ afterwards supports converting the lactate back to pyruvate and glucose in the liver","why":"It explains the rise, the return to 2 mmol/L and the extra O₂ use.","_n":"3a5d7","_k":"587b6cab"},{"t":"The lactate was turned into ethanol and excreted","why":"Humans make lactate, not ethanol.","_n":"3be67","_k":"b8b7da01"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of how fermentation lets a cell survive without oxygen?","options":[{"t":"“It replaces oxygen as the final electron acceptor of the electron transport chain.”","why":"Fermentation doesn’t use the chain at all.","_n":"3ce57","_k":"7d8fa0eb"},{"t":"“It passes electrons from NADH to pyruvate (or a product of it), regenerating the NAD⁺ that glycolysis needs, so glycolysis can keep making 2 ATP per glucose.”","why":"It names the electron transfer, the NAD⁺ it regenerates, and where the ATP comes from.","_n":"3de87","_k":"b8c952c2"},{"t":"“It makes a lot of extra ATP from pyruvate when oxygen is gone.”","why":"Converting pyruvate to lactate or ethanol makes \u003cstrong>no\u003c/strong> ATP. Its job is to turn NADH back into NAD⁺, so glycolysis can keep making its 2 ATP.","_n":"3ee77","_k":"9308e41b"},{"t":"“It turns lactate back into glucose so the cell can respire again.”","why":"That happens later, in the liver.","_n":"3fe27","_k":"cff575e9"}]},"b":{"prompt":"Which is the best explanation of why fermentation yields only 2 ATP per glucose?","options":[{"t":"“Fermentation makes 2 ATP and glycolysis makes none.”","why":"It’s the other way round.","_n":"3ge17","_k":"985fa89b"},{"t":"“Only glycolysis makes ATP; the fermentation step only regenerates NAD⁺, and without O₂ the Krebs cycle and the chain can’t run.”","why":"It says where the 2 ATP come from and why nothing else adds to them.","_n":"3he47","_k":"3cbb4892"},{"t":"“Fermentation stops after 2 cycles.”","why":"There are no cycles in fermentation.","_n":"3ie37","_k":"2312c48b"},{"t":"“Fermentation makes 4 ATP but uses 2.”","why":"Glycolysis makes 4 ATP but spends 2, so the net is 2.","_n":"3jde7","_k":"4dadd435"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which flow chart correctly shows alcohol fermentation?","options":[{"t":"glucose → 2 pyruvate (2 NADH made) → 2 acetaldehyde + 2 CO₂ → 2 ethanol (2 NADH → 2 NAD⁺)","why":"Pyruvate first, then CO₂ removed, then NADH reduces acetaldehyde, giving back NAD⁺.","_n":"3kdd7","_k":"03d5248a"},{"t":"glucose → 2 pyruvate (2 NADH made) → 2 lactate + 2 CO₂ (2 NADH → 2 NAD⁺)","why":"Lactate fermentation releases no CO₂.","_n":"3le07","_k":"5b05bad5"},{"t":"glucose → 2 pyruvate (2 NAD⁺ made) → 2 acetaldehyde + 2 CO₂ → 2 ethanol (2 NAD⁺ → 2 NADH)","why":"The carriers are reversed.","_n":"3me17","_k":"3d2d4c99"},{"t":"glucose → 2 acetaldehyde + 2 CO₂ → 2 pyruvate → 2 ethanol","why":"Pyruvate comes first, from glycolysis.","_n":"3nde7","_k":"d322e131"}]},"b":{"prompt":"Which flow chart correctly shows lactate fermentation?","options":[{"t":"glucose → 2 pyruvate (2 NAD⁺ made) → 2 lactate (2 NAD⁺ → 2 NADH)","why":"Fermentation \u003cstrong>uses\u003c/strong> NADH and \u003cstrong>gives back\u003c/strong> NAD⁺. NADH is made in glycolysis.","_n":"3odf7","_k":"9e733b5f"},{"t":"glucose → 2 lactate → 2 pyruvate (2 ATP made)","why":"Lactate is the end product, and that step makes no ATP.","_n":"3pe47","_k":"1183656d"},{"t":"glucose → 2 pyruvate → 2 lactate + 2 CO₂","why":"Only alcohol fermentation removes CO₂ (pyruvate → acetaldehyde). Lactate keeps all three carbons.","_n":"3qe57","_k":"2109d429"},{"t":"glucose → 2 pyruvate (2 NADH made) → 2 lactate (2 NADH → 2 NAD⁺)","why":"NADH reduces pyruvate directly to lactate: no CO₂, and NAD⁺ comes back.","_n":"3re27","_k":"62806152"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A baker finds dough rises faster in a 30 °C room than a 10 °C room, but dough left in a 60 °C oven to rise doesn’t rise at all. Which explanation is best?","options":[{"t":"Warm dough rises because the air in it expands; yeast aren’t involved","why":"Expansion is small; the gas comes from fermentation.","_n":"3se37","_k":"958f5b91"},{"t":"At 60 °C the yeast switch to lactate fermentation, which makes no gas","why":"Yeast make ethanol; above about 50 °C they die.","_n":"3td87","_k":"d1f9904a"},{"t":"Yeast enzymes work faster as temperature rises toward an optimum; at 60 °C they denature and the yeast die, so no CO₂ is made","why":"It explains both observations with the enzymes’ optimum.","_n":"3ud97","_k":"9a2a571d"},{"t":"Yeast make O₂ faster when warm","why":"Yeast make CO₂, not O₂.","_n":"3ve26","_k":"e2d73576"}]},"b":{"prompt":"Milk left with lactic acid bacteria at 40 °C thickens and tastes sour. Which explanation is best?","options":[{"t":"The bacteria ferment lactose into lactate; the falling pH makes milk proteins clump together","why":"Lactate makes the milk sour, and the lower pH sets the proteins.","_n":"3we16","_k":"711dda13"},{"t":"The bacteria release CO₂, which curdles the milk","why":"Only alcohol fermentation removes CO₂ (pyruvate → acetaldehyde). Lactate keeps all three carbons.","_n":"3xe06","_k":"236e9f5e"},{"t":"The bacteria make ethanol, which thickens milk","why":"Lactic acid bacteria make lactate.","_n":"3ydf6","_k":"bae739a2"},{"t":"The heat alone thickens the milk","why":"Without bacteria, warm milk doesn’t sour or set.","_n":"3ze66","_k":"26b30536"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Late in a marathon, a runner’s glycogen is nearly gone and fat supplies more of the energy. Why does fat hold more energy per gram than glycogen?","options":[{"t":"Fatty acids are long chains rich in C–H bonds (highly reduced), so beta-oxidation and the Krebs cycle strip many electron pairs (NADH and FADH₂) from each gram","why":"More C–H bonds per gram means more electrons to hand to the chain.","_n":"40e56","_k":"4df38bb1"},{"t":"Fat contains more oxygen atoms per gram, which give more energy","why":"Fat has \u003cstrong>fewer\u003c/strong> O atoms; it’s more reduced.","_n":"41e46","_k":"365fa7e2"},{"t":"Fat is used by fermentation, which is more efficient","why":"Fermentation uses only glucose and yields little.","_n":"42e36","_k":"df0cabe6"},{"t":"Fat is turned into glucose, which is then respired twice","why":"Fatty acids are cut into acetyl-CoA by beta-oxidation and go straight into the Krebs cycle.","_n":"43da6","_k":"cd12ae9e"}]},"b":{"prompt":"During long fasting, the body breaks down some muscle protein for energy. Which waste product rises in the urine as a result?","options":[{"t":"Lactate, from fermenting the amino acids","why":"Amino acids aren’t fermented to lactate in the body.","_n":"44d96","_k":"5d726575"},{"t":"Ethanol","why":"Humans don’t make ethanol by fermentation.","_n":"45dc6","_k":"a4613372"},{"t":"Glucose, released from the protein","why":"Glucose in urine is a sign of high blood sugar, not protein use.","_n":"46dd6","_k":"f416ce16"},{"t":"Urea, made in the liver from the nitrogen removed by deamination","why":"Deamination removes the amino groups; the liver turns the nitrogen into urea.","_n":"47de6","_k":"ccc74081"}]}}]},"task":{"title":"Rise to the occasion","summary":"Rise to the occasion","statement":"\u003cp>Set up a fermenter for bread dough that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"fe-conds\">\u003cli>It produces CO₂ gas.\u003c/li>\u003cli>The cells are fermenting (making only 2 ATP per glucose).\u003c/li>\u003cli>It collects at least 30 mL of CO₂ in 30 min.\u003c/li>\u003cli>It’s kept at 35 °C or cooler (the dough can’t be cooked).\u003c/li>\u003c/ol>","inputs":{"org":"Organism","o2":"O₂","sugar":"Sugar","temp":"Temperature"},"modelNote":"Yeast: CO₂ in 30 min = (sugar in g ÷ 10) × 6, 15, 30, 24 or 0 mL at 10, 20, 30, 40 or 50 °C. Lactic acid bacteria make no gas.","checks":["Produces CO₂","Fermenting","At least 30 mL in 30 min","35 °C or cooler"],"tips":["Lactic acid bacteria don’t release CO₂. Which organism does?","With O₂ present, the yeast respire aerobically (36 ATP). Take the O₂ away.","More sugar or a warmer temperature (up to the optimum) gives more gas.","40 °C and 50 °C are too hot for the dough."],"success":"Your fermenter works!","explainPrompt":"Explain why each setting you chose matters, using the yeast data pattern.","vocab":"Use the words fermentation, NAD⁺, CO₂, enzyme and optimum.","after3":"There’s a trade-off: less sugar needs a warmer temperature. And 40 °C would give more gas than 20 °C, but it’s too hot for dough."},"cards":[["Purpose of fermentation","Regenerates NAD⁺ so glycolysis can keep running without O₂."],["Lactate fermentation","Pyruvate + NADH → lactate + NAD⁺. No CO₂. Muscle cells, yogurt bacteria."],["Alcohol fermentation","Pyruvate → acetaldehyde + CO₂; acetaldehyde + NADH → ethanol + NAD⁺. Yeast."],["ATP from fermentation","Net 2 per glucose, all from glycolysis. The fermentation step makes none."],["Aerobic vs anaerobic yield","About 36 (theoretical, eukaryote) or about 30–32 (current estimate) vs 2 ATP per glucose."],["Obligate vs facultative anaerobe","Obligate: can’t use O₂ (often harmed by it). Facultative: respires with O₂, ferments without (yeast)."],["Oxygen debt","Extra O₂ used after exercise, partly to turn lactate back into glucose in the liver."],["Beta-oxidation","Cuts fatty acids into 2-carbon acetyl-CoA; each round makes 1 NADH and 1 FADH₂."],["Glycerol","Enters glycolysis as a 3-carbon sugar phosphate (G3P)."],["Deamination","Removes an amino acid’s amino group; the nitrogen becomes urea in the liver."],["Energy per gram","Fat ≈ 37 kJ/g; carbohydrate and protein ≈ 17 kJ/g."],["Fermentation in industry","Bread (CO₂), yogurt and cheese (lactate), fuel ethanol, brewing."]]}};</script>
