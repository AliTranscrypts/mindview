.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 17: membrane simulator (S4, inner mitochondrial membrane), H⁺ split bar (S3), dam analogy, Part 3 label builders (S1),
   evidence cards, task, hero. Roles: H⁺ --bio-h, ATP --bio-atp (ADP and Pᵢ --ink-2), NADH/NADPH --bio-nadh, FADH₂ --bio-fadh,
   O₂/H₂O --bio-o2, food --bio-carbon; membrane and pumps --ink-2 (grey); heat = --ink-2 wavy lines.
   Module tokens: --cm-low (lower compartment tint), --cm-mem (bilayer), --cm-grey (pumps), --cm-part (synthase), --cm-water. */
:root{--cm-low:color-mix(in srgb,var(--ink-2) 7%,var(--sheet));--cm-mem:color-mix(in srgb,var(--ink-2) 20%,var(--sheet));--cm-grey:color-mix(in srgb,var(--ink-2) 38%,var(--sheet));
  --cm-part:color-mix(in srgb,var(--ink-2) 13%,var(--sheet));--cm-water:color-mix(in srgb,var(--bio-h) 24%,var(--sheet))}

/* hero */
.hero .hero-eq .cm-heq{font-size:.66em;line-height:1.45;display:inline-block}
.cm-c-h{color:var(--bio-h);font-weight:700}.cm-c-atp{color:var(--bio-atp);font-weight:700}
.cm-hero{width:100%;aspect-ratio:520 / 290}
.cm-hero svg{width:100%;height:100%;display:block}
.cm-dambg{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}

/* radio groups (from SBI4U 06 / 13 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}

/* switches (from SBI4U 06) */
.cm-sws{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cm-swb{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .6em;min-height:44px;font-size:.88rem;line-height:1.25}
.cm-swb > span:nth-child(2){flex:1 1 auto;min-width:0}
.cm-swk{flex:0 0 30px;height:16px;border-radius:8px;border:1.5px solid var(--ink-2);position:relative;background:var(--paper)}
.cm-swk::after{content:"";position:absolute;top:1.5px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.cm-swb[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.cm-swb[aria-checked="true"] .cm-swk{background:var(--ink);border-color:var(--ink)}
.cm-swb[aria-checked="true"] .cm-swk::after{left:15px;background:var(--sheet)}
.cm-swst{font-size:.75rem;font-weight:700;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){ .cm-swk::after{transition:none} }

/* explore layout */
.cm-pg [hidden]{display:none!important}
@media (min-width:821px){ .cm-pg{grid-template-rows:auto 1fr} }
.cm-pg .pg-ctrl{display:grid;gap:12px}
.cm-mhelp{margin:-4px 0 0}
.cm-sl{margin:0}
.cm-sl input{width:100%;accent-color:var(--ink)}
.cm-stage{position:relative;width:100%;aspect-ratio:520 / 290;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.cm-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cm-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.cm-legend span{display:inline-flex;align-items:center;gap:4px}
.cm-legend svg{width:14px;height:14px}
.cm-legend svg[viewBox^="0 0 22"]{width:22px}
.cm-lg-t{background:var(--c);color:var(--sheet);font-weight:700;border-radius:999px;padding:0 .5em}
.cm-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.cm-note{margin:12px 0 0;color:var(--ink-2);line-height:1.45}

/* SVG drawing */
.cm-ims,.cm-str{fill:var(--sheet)}
.cm-mat,.cm-lum{fill:var(--cm-low)}
.cm-tint{fill:var(--bio-h)}
.cm-mem{fill:var(--cm-mem)}
.cm-lip{fill:var(--ink-2);opacity:.4}
.cm-edge{stroke:var(--ink-2);stroke-width:1.6}
.cm-pore{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3}
.cm-pump{fill:var(--cm-grey);stroke:var(--ink-2);stroke-width:1.5}
.cm-fo{fill:var(--cm-part);stroke:var(--ink-2);stroke-width:1.5}
.cm-rot{fill:var(--ink-2)}
.cm-stalk{fill:var(--ink-2)}
.cm-stator{stroke:var(--ink-2);stroke-width:3;fill:none;stroke-linecap:round}
.cm-head{fill:var(--cm-part);stroke:var(--ink);stroke-width:1.6}
.cm-lobe{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.cm-plug{fill:var(--ink)}
.cm-h{fill:var(--bio-h);stroke:var(--sheet);stroke-width:.8}
.cm-heat{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round}
.cm-hpath{fill:none;stroke:var(--bio-h);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.cm-tpath{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3}
.cm-ah{stroke-dasharray:none}
.cm-photon{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cm-tokt{font:700 9.5px var(--font-ui);fill:var(--sheet)}
.cm-t{font:600 11px var(--font-ui);fill:var(--ink-2)}
.cm-tb{font:700 11.5px var(--font-ui);fill:var(--ink)}
.cm-ts{font:600 10px var(--font-ui);fill:var(--ink-2)}
.cm-tc{font:700 12px var(--font-ui);fill:var(--ink)}
.cm-tcs{font:700 10.5px var(--font-ui);fill:var(--ink)}
.cm-halo{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
@media (max-width:560px){
  .cm-stage .cm-tb,.cm-hero .cm-tb{font-size:15.5px}.cm-stage .cm-ts{font-size:13.5px}.cm-tc{font-size:15px}.cm-stage .cm-tokt{font-size:12px}
}

/* S3 split bar */
.cm-ledger{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.cm-lgh{margin:0 0 6px;font-size:.92rem;font-weight:700}
.cm-lbar{display:flex;height:16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);overflow:hidden}
.cm-lbar i{display:block;height:100%}
.cm-lth{background:var(--bio-atp)}
.cm-lhe{background:repeating-linear-gradient(45deg,var(--ink-2) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 2px var(--ink-2)}
.cm-lkey{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.cm-lsw{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* dam analogy */
.cm-dam-fig{margin:12px 0 0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 14px;align-items:center}
.cm-dam-fig figcaption{grid-column:1 / -1}
.cm-dam-stage{position:relative;width:100%;aspect-ratio:260 / 122}
.cm-dam-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cm-damkey{margin:0;font-size:.85rem}
.cm-damkey div{margin:0 0 4px}
.cm-damkey dt{display:inline;font-weight:700}
.cm-damkey dd{display:inline;margin:0 0 0 .3em}
.cm-water{fill:var(--cm-water)}
.cm-water2{opacity:.7}
.cm-dam{fill:var(--cm-grey);stroke:var(--ink-2);stroke-width:1.5}
.cm-ground{stroke:var(--ink-2);stroke-width:1.5}
.cm-chan{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1}
.cm-blade{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.cm-hub{fill:var(--ink)}
.cm-flowln{fill:none;stroke:var(--bio-h);stroke-width:2}
.cm-spill{fill:none;stroke:var(--bio-h);stroke-width:2;stroke-dasharray:5 3}
.cm-pumpln{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:4 3}
@media (max-width:560px){ .cm-dam-fig{grid-template-columns:minmax(0,1fr)} }

/* S1 stage (copied from SBI4U 13 / 03; buttons are transparent targets over the drawn zones) */
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1px dashed transparent;border-radius:8px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}

/* Part 3: builders */
.cm-st h3{margin-top:0}
.cm-ev{margin-top:24px}
.cm-blds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;margin:12px 0}
.cm-bld-bac{grid-column:1 / -1;max-width:560px}
.cm-bld h4{margin:0 0 6px}
.cm-labs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.cm-lab{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .8em;font-size:.88rem;font-weight:700;min-height:36px}
.cm-lab[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.cm-lab.placed{border-style:dashed;color:var(--ink-2);font-weight:600}
.cm-lab:disabled{opacity:.85}
.cm-bra{margin-top:6px}
.cm-bfb{min-height:1.5em;margin-top:8px}
.cm-bfb .fb{margin:0}
.cm-tag rect{fill:var(--sheet);stroke:var(--ink);stroke-width:1.4}
.cm-tag text{font:700 10.5px var(--font-ui);fill:var(--ink)}
.cm-sun{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.cm-ray{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.cm-tbl{border-collapse:collapse;width:100%;font-size:.9rem;min-width:480px}
.cm-tbl caption{text-align:left;font-weight:700;margin-bottom:6px}
.cm-tbl th,.cm-tbl td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--rule)}
.cm-tbl thead th{font-size:.82rem;color:var(--ink-2)}
.cm-tbl tbody th{font-weight:700;white-space:nowrap}
.cm-tbl td.cm-q{color:var(--ink-2)}
#cm-rule .fb{margin-top:10px}
@media (max-width:820px){ .cm-blds{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){ .cm-tag text{font-size:12px} }

/* Part 3: evidence cards */
.cm-cards{display:grid;gap:14px;margin-top:10px}
.cm-card{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:12px 18px;padding:12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.cm-card h4{margin:0 0 4px}
.cm-card p{margin:0 0 6px}
.cm-cfig svg{width:100%;height:auto;display:block}
.cm-cask{margin-top:6px!important;font-weight:700}
.cm-claims{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.cm-claims .chip{min-height:36px;text-align:left}
.cm-buf{fill:var(--cm-low)}
.cm-glass{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.cm-thy{fill:var(--cm-part);stroke:var(--ink-2);stroke-width:3}
.cm-ves{fill:var(--cm-low);stroke:var(--ink-2);stroke-width:5}
.cm-vstage svg{width:100%;height:auto;display:block}
.cm-vcap{margin:6px 0 0!important}
.cm-g3leg{margin:4px 0 0!important}
.cm-key{display:inline-block;width:22px;height:0;vertical-align:middle;border-top:3px solid}
.cm-key-o2{border-color:var(--bio-o2)}
.cm-key-atp{border-color:var(--bio-atp);border-top-style:dashed}
@media (max-width:640px){ .cm-card{grid-template-columns:minmax(0,1fr)} }

/* practice */
.cm-pair{display:grid;gap:6px}
.cm-unit{margin-left:6px;color:var(--ink-2)}
.cm-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cm-chips .chip{text-align:left}

/* task */
.cm-tlist{margin:.3em 0 .6em 1.3em;padding:0}
.cm-tin{display:grid;gap:12px;margin:12px 0}
.cm-tpv h4{margin:0 0 6px}
.cm-tpv .read{margin-top:10px}

</style>

that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"dde8d64f","content":{"id":"17-chemiosmosis","kind":"topic","title":"Chemiosmosis","topic":"Chemiosmosis","readyTopic":"chemiosmosis","hero":{"eq":"\u003cspan class=\"cm-heq\">\u003cspan class=\"cm-c-h\">H⁺\u003c/span> (intermembrane space) → through ATP synthase → \u003cspan class=\"cm-c-h\">H⁺\u003c/span> (matrix),\u003cbr>which drives ADP + Pᵢ → \u003cspan class=\"cm-c-atp\">ATP\u003c/span>\u003c/span>","eqLabel":"H⁺ in the intermembrane space flows through ATP synthase into the matrix, which drives ADP plus Pᵢ to ATP","eqSize":"sm","headline":"A dam, a turbine, and a stream of protons","text":"The electron transport chain fills a reservoir: it pumps \u003cstrong>H⁺\u003c/strong> into the intermembrane space until it’s crowded and positive there. The only way back is through \u003cstrong>ATP synthase\u003c/strong>, a protein turbine. As H⁺ rushes through, the rotor spins and the head joins \u003cstrong>ADP\u003c/strong> and \u003cstrong>Pᵢ\u003c/strong> into \u003cstrong>ATP\u003c/strong>. Using a gradient this way is called \u003cstrong>chemiosmosis\u003c/strong>.","fig":{"html":"\u003cdiv class=\"cm-hero\" id=\"cm-hero\" role=\"img\" aria-label=\"The inner mitochondrial membrane in cross-section, with the intermembrane space above and the matrix below. Grey pumps push magenta H⁺ up into the intermembrane space until it is crowded: pH 7 above, pH 8 below. Then H⁺ streams back down through ATP synthase, its rotor turns, and orange ATP tokens pop from the head into the matrix. A small dam-and-turbine sketch appears beside it as an analogy, then fades.\">\u003c/div>"}},"goals":["I can describe the H⁺ gradient across the inner mitochondrial membrane and why it stores energy.","I can explain how ATP synthase uses H⁺ flow to make ATP, and where the ATP is made.","I can predict the effects of blocking ATP synthase or adding an uncoupler on ATP, heat and O₂ use.","I can compare chemiosmosis in mitochondria, chloroplasts and bacteria.","I can calculate ATP made from H⁺ counts, including leaks.","I can use evidence from experiments to support the chemiosmotic model."],"start":{"warmup":{"questions":[{"id":"w1","skill":"ETC and H⁺ pumping","goal":1,"prompt":"Where does the electron transport chain pump H⁺?","options":[{"t":"Out of the cell","why":"That’s bacteria, not mitochondria.","_n":"0c42","_k":"10b1867f"},{"t":"From the intermembrane space into the matrix","why":"That’s the direction H⁺ flows back through ATP synthase.","_n":"1c52","_k":"e69891c7"},{"t":"From the matrix into the intermembrane space","why":"That builds the gradient.","_n":"2c62","_k":"a424f980"},{"t":"From the cytosol into the matrix","why":"The pumps are in the inner membrane.","_n":"3c72","_k":"526848a3"}],"hints":["Pumping builds up H⁺ somewhere.","Between the membranes.","Matrix → intermembrane space."]},{"id":"w2","skill":"ETC and H⁺ pumping","goal":5,"prompt":"Using the model values (NADH 10 H⁺, FADH₂ 6 H⁺), how many H⁺ are pumped for one NADH and one FADH₂?","options":[{"t":"4","why":"Add them.","_n":"4c82","_k":"f96597e7"},{"t":"12","why":"NADH is worth 10.","_n":"5c92","_k":"1951441f"},{"t":"16","why":"10 + 6.","_n":"6ca2","_k":"26bf5d97"},{"t":"20","why":"FADH₂ is worth 6, not 10.","_n":"7cb2","_k":"a5c9780e"}],"hints":["Add the two.","10 + 6.","16."]},{"id":"w3","skill":"Diffusion and gradients","goal":1,"prompt":"Particles diffuse…","options":[{"t":"only through ATP synthase","why":"Diffusion happens everywhere it’s allowed.","_n":"8cc2","_k":"eefbfefc"},{"t":"from where they are more concentrated to where they are less concentrated","why":"Down the gradient.","_n":"94cb","_k":"89a6c10b"},{"t":"only when ATP is used","why":"Diffusion is passive.","_n":"a4bb","_k":"7356bf85"},{"t":"from low to high concentration","why":"That needs energy (active transport).","_n":"b4ab","_k":"86c8a0c5"}],"hints":["Think of food colouring in water.","It spreads out.","High → low."]},{"id":"w4","skill":"Diffusion and gradients","goal":1,"prompt":"A solution at pH 6 compared with one at pH 8 has…","options":[{"t":"2 times more H⁺","why":"The scale is logarithmic: 10 × 10.","_n":"c49b","_k":"139edd48"},{"t":"the same H⁺ concentration","why":"The pH differs, so [H⁺] differs.","_n":"d50b","_k":"7aa4eab9"},{"t":"a lower H⁺ concentration","why":"Lower pH means more H⁺.","_n":"e4fb","_k":"ca314675"},{"t":"a higher H⁺ concentration (100 times higher)","why":"Each pH unit is a factor of 10.","_n":"f4eb","_k":"f08e19d2"}],"hints":["Low pH means acidic: more H⁺.","Each unit is ×10.","2 units: ×100."]},{"id":"w5","skill":"ATP","goal":2,"prompt":"Making ATP from ADP and Pᵢ…","options":[{"t":"needs an input of energy","why":"It’s the reverse of ATP hydrolysis (≈ −30.5 kJ/mol).","_n":"g4db","_k":"77ad8272"},{"t":"needs O₂ directly","why":"O₂ isn’t a reactant.","_n":"h54b","_k":"f86eb3c1"},{"t":"releases energy","why":"Hydrolysis releases energy; synthesis needs it.","_n":"i53b","_k":"a47eb773"},{"t":"happens only in chloroplasts","why":"Mitochondria and the cytosol make ATP too.","_n":"jd2b","_k":"5d9050a2"}],"hints":["Breaking ATP releases energy.","So making it…","Needs energy."]},{"id":"w6","skill":"ATP","goal":2,"prompt":"Which process makes ATP by moving a phosphate group directly from a substrate molecule?","options":[{"t":"Photolysis","why":"That splits water.","_n":"kd3b","_k":"b0849d52"},{"t":"Oxidative phosphorylation","why":"That uses the H⁺ gradient.","_n":"ld0b","_k":"bf5f3c36"},{"t":"Substrate-level phosphorylation","why":"As in glycolysis and the Krebs cycle.","_n":"md1b","_k":"0acf1e61"},{"t":"Chemiosmosis","why":"Chemiosmosis uses a gradient, not a substrate.","_n":"nceb","_k":"68728a00"}],"hints":["Which kind uses no membrane?","The phosphate comes from a molecule.","Substrate-level."]}],"refreshers":{"ETC and H⁺ pumping":"Complexes I, III and IV pump H⁺ from the matrix to the intermembrane space. Model values: NADH → 10 H⁺, FADH₂ → 6 H⁺.","Diffusion and gradients":"Particles move down a concentration gradient on their own. pH 7 vs pH 8 is a 10-fold difference in H⁺.","ATP":"ADP + Pᵢ → ATP needs ≈ 30.5 kJ/mol. Substrate-level phosphorylation moves a phosphate from a molecule; oxidative phosphorylation uses the H⁺ gradient."}}},"explore":{"heading":"Gradient and turbine","intro":"Run the pumps, then let H⁺ flow back. Find out what makes ATP, what makes heat, and what happens when you block the turbine or poke holes in the membrane.","modes":[["set","Set the pumps"],["resp","Respiratory control"],["brown","Brown fat"]],"modeHelp":{"set":"Set the pumps: you control the electron transport chain directly.","resp":"Respiratory control: the cell’s ATP demand sets the pace of the chain.","brown":"Brown fat: thermogenin channels let H⁺ back into the matrix on purpose."},"capIdle":"Change a control, then watch the H⁺, the rotor and the counts.","leaks":[[0,"none (0)"],[4,"low (4)"],[8,"high (8)"]],"toggles":[["dots","Show H⁺ dots"],["dam","Show dam analogy"]],"damTitle":"The dam analogy","damKey":[["Reservoir behind the dam","H⁺ crowded in the intermembrane space"],["Pump refilling the reservoir","the electron transport chain"],["Turbine in the dam","ATP synthase (the generator makes ATP)"],["Spillway","an uncoupler leak: the energy becomes heat"]],"modelNote":"\u003cstrong>How the model counts.\u003c/strong> ATP made per tick = (H⁺ through the synthase) ÷ 4. H⁺ through the synthase = pumping − leak, when the synthase is on. Heat (in “H⁺ units”) = the leak. O₂ used per 10 ticks = pumping ÷ 2 (NADH model: 10 H⁺ per electron pair, ½ O₂ per pair). Respiratory control: pumping = 4 × demand + leak, so the chain runs just fast enough to hold the gradient. Synthase blocked: the gradient rises to its maximum and pumping falls to the leak rate (the pumps can’t push against a steeper gradient). About 4 H⁺ per ATP delivered to the cytosol is a model value: about 3 turn the synthase and about 1 moves ATP, ADP and Pᵢ across the membrane; the exact number depends on the organism’s synthase. The pH values are model values too: the real pH difference is small, and the charge difference stores most of the energy in mitochondria.","predIntro":"Make a prediction first. Then the simulator will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"set","P":12,"L":0,"syn":true},"to":{"syn":false},"prompt":"\u003cspan class=\"muted\">Set the pumps: pumping 12, no leak.\u003c/span> Now ATP synthase is switched to “blocked”. What happens?","options":[{"t":"H⁺ flows back through the pumps and makes ATP there","_n":"ocfb","_k":"378f1fca"},{"t":"The gradient disappears","_n":"pccb","_k":"534c2db4"},{"t":"ATP stops; the gradient climbs to its maximum and the pumps stall","_n":"qcdb","_k":"37ddf16d"},{"t":"ATP is made in the intermembrane space instead","_n":"rdab","_k":"606e8d45"}],"explain":"With no way back, H⁺ piles up until the pumps can’t push more. ATP is made only where H⁺ exits through the synthase, on the matrix side."},{"id":"p2","start":{"mode":"set","P":12,"L":8,"syn":true},"hide":true,"prompt":"\u003cspan class=\"muted\">Pumping 12, high leak (8), synthase on.\u003c/span> How many ATP per tick?","options":[{"t":"0","_n":"sdbb","_k":"3a8b5447"},{"t":"1","_n":"td8c","_k":"0ba5cfe6"},{"t":"2","_n":"ud7c","_k":"a8279c3b"},{"t":"3","_n":"vdac","_k":"5ff5a65e"}],"explain":"12 − 8 = 4 through the turbine, and 4 ÷ 4 = 1 ATP. The other 8 H⁺ leak back as heat."},{"id":"p3","start":{"mode":"resp","D":3,"L":0,"syn":true},"to":{"L":8},"prompt":"\u003cspan class=\"muted\">Respiratory control: demand 3, no leak (pumping 12, O₂ 6 per 10 ticks).\u003c/span> Now the leak is set to high. What happens to O₂ use?","options":[{"t":"It rises (to 10 per 10 ticks)","_n":"wd9c","_k":"d3c5414c"},{"t":"It falls","_n":"xdcc","_k":"443c3922"},{"t":"No change","_n":"ydbc","_k":"912682ba"},{"t":"It stops","_n":"zdec","_k":"b5e312b6"}],"explain":"The leak drains the gradient, so the chain speeds up to keep ATP at 3, and burns more fuel and O₂."},{"id":"p4","start":{"mode":"brown","D":2,"T":0,"syn":true},"to":{"T":16},"prompt":"\u003cspan class=\"muted\">Brown fat: demand 2, thermogenin 0.\u003c/span> Now thermogenin is raised to 16. Which is true?","options":[{"t":"O₂ use stops","_n":"10ddc","_k":"edb874e6"},{"t":"ATP falls to 0","_n":"11d0c","_k":"d75415e3"},{"t":"ATP stays at 2, while O₂ use and heat rise","_n":"12cfc","_k":"5e4129b0"},{"t":"Heat falls","_n":"13dec","_k":"67d669e8"}],"explain":"Thermogenin is a built-in uncoupler: brown fat burns fuel mainly to make heat."}],"chalIntro":"Use the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":5,"prompt":"Set the pumps, with no leak: make exactly \u003cstrong>3 ATP per tick\u003c/strong>.","why":"12 H⁺ pass through the turbine, and 12 ÷ 4 = 3 ATP.","wrong":{"mode":"Switch the mode to \u003cstrong>Set the pumps\u003c/strong> first.","leak":"Set the leak to none first.","p16":"4 ATP: one step too many.","p8":"2 ATP.","blocked":"Nothing passes the turbine."},"hints":["How many H⁺ per ATP?","4.","3 × 4 = 12."]},{"id":"tc2","goal":5,"prompt":"Set the pumps, with a low leak: make exactly \u003cstrong>4 ATP per tick\u003c/strong>.","why":"20 − 4 = 16 H⁺ pass through the turbine, and 16 ÷ 4 = 4 ATP.","wrong":{"mode":"Switch the mode to \u003cstrong>Set the pumps\u003c/strong> first.","leak":"Use a low leak (4 H⁺ per tick).","p16":"16 − 4 = 12 through the turbine: only 3 ATP.","blocked":"Nothing passes the turbine."},"hints":["The leak takes 4 first.","You need 16 through the synthase.","16 + 4 = 20."]},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"Brown fat: release \u003cstrong>at least 8\u003c/strong> H⁺ per tick as heat while making exactly \u003cstrong>2 ATP per tick\u003c/strong>, using the \u003cstrong>least O₂\u003c/strong> possible.","why":"Demand 2 sends 8 H⁺ through the synthase, and thermogenin 8 releases 8 as heat. Pumping is 16, the least that does both, so O₂ use is 8 per 10 ticks.","wrong":{"mode":"Switch to \u003cstrong>Brown fat\u003c/strong> mode first.","more":"That works, but uses more O₂ (10 or 12 per 10 ticks) than needed.","t4":"Heat is only 4.","t0":"No H⁺ leaks, so there’s no heat.","d3":"That’s 3 ATP.","blocked":"Nothing passes the turbine: no ATP."},"hints":["Pumping = 4 × demand + leak, and O₂ rises with pumping.","Demand 2 means 8 H⁺ for ATP. The smallest leak that gives at least 8 heat is 8.","Demand 2, thermogenin 8: pumping 16, O₂ 8 per 10 ticks."]}]},"part3":{"slug":"compare","name":"Compare","heading":"Two chemiosmosis machines","intro":"Mitochondria and chloroplasts run the same mechanism. Set them side by side to see which way each pumps H⁺ and where each makes ATP, then test the model against the experiments that persuaded scientists.","builder":{"title":"Station 1: side-by-side builder","how":"Tap a label, then tap the place on the diagram where it belongs. The comparison table fills in as you go.","rule":"In every case, H⁺ is pumped away from where ATP is made.","labelHints":{"esrc":"Electrons enter the chain at its start.","eacc":"The final acceptor takes the electrons at the end of the chain.","energy":"Look for what powers the whole process."},"labels":[["hin","H⁺ pumped into"],["atp","ATP made in"],["esrc","Electrons come from"],["eacc","Final electron acceptor"],["energy","Energy source"]],"orgs":[{"id":"mit","name":"Mitochondrion","sub":"inner mitochondrial membrane","labels":["hin","atp","esrc","eacc","energy"],"zones":{"ims":"Intermembrane space","mem":"Inner mitochondrial membrane","mat":"Matrix","nadh":"NADH and FADH₂","o2":"O₂ (→ H₂O)","food":"Fuel from food"},"_a":"H0YNUQoUDkQNCRYaSBRVEhRGXxoJV0BESEYASxZVFlxGCgRcDBQYRAEFBltGDBYJVkZJGgFYURQDHUcCRlBbCQBGGA=="},{"id":"chl","name":"Chloroplast","sub":"thylakoid membrane","labels":["hin","atp","esrc","eacc","energy"],"zones":{"str":"Stroma","mem":"Thylakoid membrane","lum":"Thylakoid lumen","h2o":"Water (H₂O)","nadp":"NADP⁺ (→ NADPH)","light":"Light"},"_a":"H0YNUQoUDkQIEQgaSBRVEhRGXxoXQkZESEYASxZVFlxGDFdXRhoWAwUHBhpeFFoHABRHFEZTWgMWAxwaXhRYDwMMERoZ"},{"id":"bac","name":"Bacterium","sub":"plasma membrane","labels":["hin","atp"],"zones":{"out":"Outside the cell","mem":"Plasma membrane","cyt":"Cytoplasm"},"_a":"H0YNUQoUDkQLEREaSBRVEhRGXxoHT0BEGQ=="}],"bacDone":"Bacterium: H⁺ is pumped out across the plasma membrane, and ATP is made in the cytoplasm as H⁺ flows back in.","table":{"head":["Feature","Mitochondrion","Chloroplast"],"rows":[["Membrane","Inner mitochondrial membrane","Thylakoid membrane",null],["H⁺ builds up in","Intermembrane space","Thylakoid lumen (pumped in, and released there by water splitting)","hin"],["ATP made in","Matrix","Stroma","atp"],["Electrons come from","NADH and FADH₂ (food)","Water (energized by light)","esrc"],["Final electron acceptor","O₂ (→ H₂O)","NADP⁺ (→ NADPH)","eacc"],["Name","Oxidative phosphorylation","Photophosphorylation","all"]]}},"evidence":{"title":"Station 2: evidence for Mitchell’s idea","panel":"Check it with data","intro":"In 1961, Peter Mitchell proposed that a proton gradient, not a high-energy chemical intermediate, links electron transport to ATP synthesis. Many scientists doubted him at first. He received the 1978 Nobel Prize in Chemistry.","how":"For each experiment card, choose every claim it shows, then press \u003cstrong>Check\u003c/strong>.","claims":[["g","A gradient alone can drive ATP synthesis"],["i","The gradient must be intact"],["s","ATP synthase doesn’t need the ETC itself"]],"cards":[{"id":"x1","title":"The acid bath","from":"(from module 06)","text":"Thylakoids soaked at pH 4, then moved to pH 8 with ADP and Pᵢ, make ATP in the dark.","_a":"P0YCGjk=","right":"With no light, no electrons were moving: the pH difference alone made the ATP.","wrong":{"i":"Nothing in this experiment made the membrane leaky.","s":"These thylakoids still had their electron transport chain, even though it wasn’t running. Another card tests this directly."},"missing":"Choose the claim this experiment shows."},{"id":"x2","title":"Artificial vesicles","from":"","text":"A light-driven H⁺ pump from a microbe was placed in membrane vesicles with ATP synthase from mitochondria. In light, the vesicles made ATP; in the dark, none.","_a":"P0YCGkgUR0Q5","right":"There was no electron transport chain: only a light-driven pump and ATP synthase. The gradient alone drove ATP synthase, so the synthase doesn’t need the ETC itself.","wrong":{"i":"Nothing in this experiment made the membrane leaky."},"missing":"Another claim fits this card too: look at what was \u003cstrong>missing\u003c/strong> from the vesicles."},{"id":"x3","title":"Uncouplers","from":"","text":"Chemicals that let H⁺ cross membranes stop ATP synthesis, while O₂ use continues or rises.","_a":"P0YMGjk=","right":"The chain still runs (O₂ use continues), but with H⁺ leaking across the membrane no ATP is made: the gradient must be intact.","wrong":{"g":"Here a gradient was being built, but the uncoupler let it leak away.","s":"The chain was present and running here (O₂ use continued)."},"missing":"Choose the claim this experiment shows."}],"vesicle":{"on":"Light on: the pump moves H⁺ into the vesicle, and H⁺ flows out through ATP synthase. ATP made: yes.","off":"Light off: no pumping, no gradient. ATP made: none."},"graph":{"yLabel":"rates in relative units","added":"uncoupler added","o2":"O₂ use","atp":"ATP synthesis","describe":"Model data. Rates of O₂ use and ATP synthesis in mitochondria over 10 minutes. Both are steady at 8 units until an uncoupler is added at 5 minutes. Then O₂ use rises to 16 units and ATP synthesis falls to 0."}},"quickCheck":{"title":"Quick check","summary":"Two chemiosmosis machines quick check","items":[{"id":"q1","goal":4,"prompt":"In chloroplasts, where is ATP made?","choices":[{"t":"Lumen","fb":"H⁺ builds up in the lumen and flows out to the stroma through ATP synthase.","_n":"14dfc","_k":"4e99d2e4"},{"t":"Intermembrane space","fb":"H⁺ builds up in the lumen and flows out to the stroma through ATP synthase.","_n":"15e0c","_k":"d2e84e3c"},{"t":"Matrix","fb":"H⁺ builds up in the lumen and flows out to the stroma through ATP synthase.","_n":"16e1c","_k":"e5df2faa"},{"t":"Stroma","fb":"H⁺ builds up in the lumen and flows out to the stroma through ATP synthase.","_n":"17dac","_k":"ec0c476b"}]},{"id":"q2","goal":6,"prompt":"What did the artificial-vesicle experiment show?","choices":[{"t":"ATP needs O₂","fb":"There was no electron transport chain: only a light-driven pump and ATP synthase.","_n":"18dbc","_k":"585e373c"},{"t":"Light makes ATP directly","fb":"There was no electron transport chain: only a light-driven pump and ATP synthase.","_n":"19dcc","_k":"71987eec"},{"t":"A gradient alone can drive ATP synthase","fb":"There was no electron transport chain: only a light-driven pump and ATP synthase.","_n":"1addc","_k":"1159a3ac"},{"t":"Electrons pass through ATP synthase","fb":"There was no electron transport chain: only a light-driven pump and ATP synthase.","_n":"1bd6c","_k":"a29c87d6"}]},{"id":"q3","goal":4,"prompt":"Where does H⁺ build up in a bacterium?","choices":[{"t":"In a matrix","fb":"Bacteria have no mitochondria; their chain is in the plasma membrane.","_n":"1cd7c","_k":"03863ade"},{"t":"In a lumen","fb":"Bacteria have no mitochondria; their chain is in the plasma membrane.","_n":"1de4c","_k":"0c475855"},{"t":"Outside the plasma membrane","fb":"Bacteria have no mitochondria; their chain is in the plasma membrane.","_n":"1ee3c","_k":"e63b2568"},{"t":"In the cytoplasm","fb":"Bacteria have no mitochondria; their chain is in the plasma membrane.","_n":"1fe2c","_k":"4f101c65"}]},{"id":"q4","goal":4,"prompt":"What do mitochondria and chloroplasts share?","choices":[{"t":"The same electron source","fb":"Their acceptors (O₂ vs NADP⁺) and electron sources differ.","_n":"1ge1c","_k":"177a4f17"},{"t":"An H⁺ gradient driving ATP synthase","fb":"Their acceptors (O₂ vs NADP⁺) and electron sources differ.","_n":"1he0c","_k":"ea36fc1a"},{"t":"The same final electron acceptor","fb":"Their acceptors (O₂ vs NADP⁺) and electron sources differ.","_n":"1idfc","_k":"5062c519"},{"t":"The same location for ATP synthase in the cell","fb":"Their acceptors (O₂ vs NADP⁺) and electron sources differ.","_n":"1jdec","_k":"a3872159"}]}]}},"practice":{"activities":[{"id":"machine","type":"sorter","title":"Which machine?","noun":"card","goal":4,"txt":true,"instruction":"Ten features of chemiosmosis. Sort each one: does it belong to mitochondria only, chloroplasts only, or both?","boxes":[{"id":"mit","label":"Mitochondria only"},{"id":"chl","label":"Chloroplasts only"},{"id":"both","label":"Both"}],"wrongDefault":"Check the comparison table from Part 3.","items":[{"id":"i1","t":"ATP synthase","_a":"RgYKTAwU","why":"Both organelles make ATP by chemiosmosis, so both have ATP synthase.","wrong":{"mit":"Both organelles have ATP synthase.","chl":"Both organelles have ATP synthase."}},{"id":"i2","t":"H⁺ builds up in the thylakoid lumen","_a":"RgcNVEY=","why":"Only chloroplasts have thylakoids."},{"id":"i3","t":"O₂ is the final electron acceptor","_a":"RgkMTEY=","why":"O₂ accepts electrons at complex IV and becomes water.","wrong":{"both":"Chloroplast electrons end on NADP⁺, not O₂."}},{"id":"i4","t":"Electrons come from water","_a":"RgcNVEY=","why":"Photosystem II takes electrons from water (photolysis)."},{"id":"i5","t":"An electron transport chain pumps H⁺","_a":"RgYKTAwU","why":"Both chains pump H⁺ across a membrane to build a gradient."},{"id":"i6","t":"ATP is made in the matrix","_a":"RgkMTEY=","why":"The matrix is the inside of a mitochondrion.","wrong":{"both":"Chloroplasts make ATP in the stroma."}},{"id":"i7","t":"NADP⁺ is the final electron acceptor","_a":"RgcNVEY=","why":"NADP⁺ reductase hands the electrons to NADP⁺, making NADPH.","hints":["What do the light reactions make besides ATP?","NADPH.","So NADP⁺ accepts the electrons: chloroplasts only."]},{"id":"i8","t":"Chemiosmosis","_a":"RgYKTAwU","why":"Both make ATP with the energy of an H⁺ gradient."},{"id":"i9","t":"Electrons come from NADH and FADH₂","_a":"RgkMTEY=","why":"These carriers bring electrons from food to the mitochondrial chain."},{"id":"i10","t":"Light provides the energy to move electrons","_a":"RgcNVEY=","why":"Light energizes electrons at the photosystems."}]},{"id":"arith","type":"custom","title":"Gradient arithmetic and evidence","summary":"Gradient arithmetic and evidence","star":true,"goal":[3,5,6],"instruction":"Six problems on H⁺ counts and experiments. Problems 3 to 6 are non-routine; the last two go beyond the Final Check.","how":"","items":[{"id":"c1","kind":"num","goal":5,"prompt":"40 H⁺ pumped, no leak, 4 H⁺ per ATP. ATP made?","_a":"VVQ=","display":"10 ATP","unit":"ATP","wrong":[{"match":160,"fb":"Divide, don’t multiply."}]},{"id":"c2","kind":"num","goal":5,"prompt":"40 H⁺ pumped, 8 leak. ATP made?","use":"Model value: 4 H⁺ per ATP.","_a":"XA==","display":"8 ATP","unit":"ATP","wrong":[{"match":10,"fb":"Only H⁺ that passes through ATP synthase makes ATP. Subtract the leak first."}]},{"id":"c3","kind":"chips","goal":[3,6],"star":true,"prompt":"\u003cspan class=\"tag\">Investigation\u003c/span> Mitochondria with fuel use O₂ slowly. ADP is added: O₂ use jumps. Oligomycin is added: O₂ use falls back. DNP is added: O₂ use jumps again. Which statement explains the last step?","options":[{"t":"DNP blocks the electron transport chain","why":"If the chain were blocked, O₂ use would fall, not jump.","_n":"1kddc","_k":"84ca3621"},{"t":"DNP reverses oligomycin","why":"DNP doesn’t touch ATP synthase; it bypasses it.","_n":"1ldcc","_k":"019622d9"},{"t":"DNP makes ATP synthase run faster","why":"Oligomycin still blocks the synthase. DNP doesn’t touch ATP synthase; it bypasses it.","_n":"1mdbc","_k":"20322bd9"},{"t":"DNP lets H⁺ leak, so the chain runs fast even though ATP synthase is blocked","why":"DNP gives H⁺ another way back, so the gradient drains and the chain speeds up, but no ATP is made.","_n":"1n4ac","_k":"917214c6"}],"hints":["Oligomycin blocked the synthase, so H⁺ couldn’t return.","DNP gives H⁺ another way back.","The gradient drains, so the chain speeds up, but makes no ATP."]},{"id":"c4","kind":"pair","goal":5,"star":true,"prompt":"Using 10 H⁺ per NADH, 6 per FADH₂ and 4 per ATP: ATP per NADH, and per FADH₂?","_a":"P1ZLDUgHGlM5","labels":["ATP per NADH","ATP per FADH₂"],"display":"2.5 ATP per NADH and 1.5 ATP per FADH₂","wrongPair":[{"match":[3,2],"fb":"Those are the older whole-number values. Use the H⁺ counts given."}],"wrongFb":"Divide each H⁺ count by 4."},{"id":"c5","kind":"num","goal":3,"star":true,"pct":true,"prompt":"\u003cspan class=\"tag\">STSE\u003c/span> In the 1930s, DNP was sold as a weight-loss drug, and some people died of overheating. If a dose makes 75% of pumped H⁺ leak, what fraction of the gradient’s energy still makes ATP?","_a":"VlE=","display":"25% (one quarter)","unit":"%","label":"Your answer (as a percentage):","wrong":[{"match":75,"fb":"75% leaks as heat; only the rest passes the synthase."}]},{"id":"c6","kind":"num","goal":5,"star":true,"prompt":"A bacterium makes ATP in its cytoplasm, so it needs no transport step: 3 H⁺ per ATP. It pumps 30 H⁺, and 6 leak. ATP made?","_a":"XA==","display":"8 ATP","unit":"ATP","wrong":[{"match":6,"fb":"Use 3 H⁺ per ATP here, not 4: (30 − 6) ÷ 3 = 8."}],"hints":["Subtract the leak.","24 H⁺ through the synthase.","24 ÷ 3 = 8."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Isaac","goal":[2,3,4],"how":"","instruction":"Isaac made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain how ATP synthase makes ATP in a mitochondrion.","steps":["The ETC pumps H⁺ into the intermembrane space.","H⁺ is now more concentrated outside the matrix.","ATP synthase pumps H⁺ from the matrix into the intermembrane space, and this pumping makes ATP.","So ATP is made in the intermembrane space."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"ATP synthase uses ATP to pump H⁺.","why":"That’s its reverse direction, not ATP synthesis.","_n":"1o4bc","_k":"47b92b2f"},{"t":"Electrons flow through ATP synthase.","why":"Electrons stay in the chain. Protons (H⁺) flow through ATP synthase.","_n":"1p48c","_k":"0dff84d2"},{"t":"H⁺ flows back \u003cstrong>down\u003c/strong> its gradient through ATP synthase into the matrix; the flow turns the rotor, and ATP is made on the matrix side.","why":"H⁺ flows \u003cstrong>down\u003c/strong> its gradient: from the intermembrane space back into the matrix.","_n":"1q49c","_k":"c2abe695"},{"t":"Step 3 is correct.","why":"H⁺ flows \u003cstrong>down\u003c/strong> its gradient: from the intermembrane space back into the matrix.","_n":"1r4ec","_k":"08921d51"}],"hints":["Which way is downhill for H⁺?","From high to low concentration.","Intermembrane space → matrix."]},{"id":"e2","goal":3,"task":"Predict the effect of an uncoupler on a cell.","steps":["An uncoupler lets H⁺ cross the inner membrane without passing ATP synthase.","So less H⁺ passes through ATP synthase, and less ATP is made.","Because the gradient is gone, the ETC has no reason to run, so O₂ use stops.","So the cell stays cool."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"The chain keeps pumping, and even speeds up as the gradient drains: O₂ use rises, and the energy is released as heat.","why":"An uncoupler speeds the chain up: O₂ use rises, but the energy becomes heat instead of ATP.","_n":"1s4fc","_k":"26604654"},{"t":"Step 3 is correct.","why":"An uncoupler speeds the chain up: O₂ use rises, but the energy becomes heat instead of ATP.","_n":"1t4cc","_k":"0de8e1d1"},{"t":"The uncoupler blocks complex IV.","why":"That’s cyanide.","_n":"1u4dc","_k":"b0022323"},{"t":"ATP production rises.","why":"Less H⁺ passes the synthase.","_n":"1v52c","_k":"ea5fdc45"}],"hints":["Does the chain need a gradient to run?","It runs faster when the gradient is lower.","More O₂ use, more heat."]},{"id":"e3","goal":4,"task":"Compare chemiosmosis in a chloroplast with a mitochondrion.","steps":["Both organelles use an electron transport chain to pump H⁺.","In a chloroplast, H⁺ builds up in the thylakoid lumen.","So ATP synthase releases ATP into the lumen.","The Calvin cycle then uses this ATP in the lumen."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"ATP is made in the cytosol.","why":"The Calvin cycle is in the stroma.","_n":"1w53c","_k":"291ceac9"},{"t":"Chloroplasts don’t use ATP synthase.","why":"They do.","_n":"1x50c","_k":"4b7ccd8d"},{"t":"H⁺ flows out of the lumen through ATP synthase, so ATP is released into the stroma, where the Calvin cycle uses it.","why":"ATP synthase’s head faces the matrix (or stroma). ATP appears where the H⁺ comes out. In both, H⁺ is pumped away from where ATP is made: into the intermembrane space or lumen, with ATP made in the matrix or stroma.","_n":"1y4fc","_k":"d564ce86"},{"t":"Step 3 is correct.","why":"ATP synthase’s head faces the matrix (or stroma). ATP appears where the H⁺ comes out. In both, H⁺ is pumped away from where ATP is made: into the intermembrane space or lumen, with ATP made in the matrix or stroma.","_n":"1z52c","_k":"67e99641"}],"hints":["Where does H⁺ come out of ATP synthase?","Into the stroma.","ATP is made in the stroma."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the simulator: that blocking ATP synthase stops O₂ use, or that a leak speeds it up?"},{"id":"j2","q":"In your own words, why does an H⁺ gradient store energy?"},{"id":"j3","q":"Explain to a friend how to tell where ATP is made in any chemiosmosis machine."},{"id":"j4","q":"Which idea in this module is still shaky for you? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"In a mitochondrion, H⁺ flows through ATP synthase…","options":[{"t":"from the matrix into the intermembrane space","why":"That’s the pumping direction.","_n":"2051c","_k":"6e95a0b5"},{"t":"from the intermembrane space into the matrix","why":"H⁺ flows \u003cstrong>down\u003c/strong> its gradient: from the intermembrane space back into the matrix.","_n":"214cc","_k":"a76874a6"},{"t":"from the cytosol into the intermembrane space","why":"Both sides are inside the inner membrane system.","_n":"224bc","_k":"aebd803f"},{"t":"from the outer membrane into the cytosol","why":"ATP synthase is in the inner membrane.","_n":"234ec","_k":"87818d6d"}]},"b":{"prompt":"In a chloroplast, ATP synthase releases ATP into the…","options":[{"t":"thylakoid lumen","why":"H⁺ builds up there.","_n":"244dc","_k":"a67f5887"},{"t":"stroma","why":"ATP synthase’s head faces the matrix (or stroma). ATP appears where the H⁺ comes out.","_n":"2558c","_k":"6fcaa6f2"},{"t":"intermembrane space","why":"That’s a mitochondrial term.","_n":"2657c","_k":"1930e741"},{"t":"cytosol","why":"The Calvin cycle uses it in the stroma.","_n":"2756c","_k":"b2e6be45"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What passes through ATP synthase to drive it?","options":[{"t":"O₂ molecules","why":"O₂ is used at complex IV.","_n":"2857c","_k":"a2d65577"},{"t":"Electrons","why":"Electrons stay in the chain.","_n":"2958c","_k":"dd468b59"},{"t":"ATP molecules","why":"ATP is the product.","_n":"2a59c","_k":"ebb72bc0"},{"t":"Hydrogen ions (H⁺), moving down their gradient","why":"Electrons stay in the chain. Protons (H⁺) flow through ATP synthase.","_n":"2b5ac","_k":"72c1148c"}]},"b":{"prompt":"What turns when ATP synthase works?","options":[{"t":"The electron transport chain","why":"The chain doesn’t rotate.","_n":"2c5bc","_k":"23213b2d"},{"t":"Cytochrome \u003ci>c\u003c/i>","why":"That’s a mobile electron carrier.","_n":"2d5cc","_k":"52363967"},{"t":"The whole mitochondrion","why":"Only the synthase’s rotor turns.","_n":"2e5dc","_k":"88481969"},{"t":"A rotor in the membrane, spun by H⁺ flowing through it","why":"The flow turns the rotor, and the head (facing the matrix) attaches Pᵢ to ADP.","_n":"2f4ec","_k":"b61ed003"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"What is chemiosmosis?","options":[{"t":"Water moving across a membrane","why":"That’s osmosis.","_n":"2g4fc","_k":"0c37791e"},{"t":"Making ATP using the energy of an H⁺ gradient across a membrane","why":"The gradient stores energy, like water behind a dam, and ATP synthase uses it.","_n":"2hdcc","_k":"32feed43"},{"t":"Making ATP by moving a phosphate from a substrate","why":"That’s substrate-level phosphorylation.","_n":"2idbc","_k":"deda8f70"},{"t":"Splitting water with light","why":"That’s photolysis.","_n":"2jdac","_k":"379bd128"}]},"b":{"prompt":"What is oxidative phosphorylation?","options":[{"t":"ATP synthesis powered by the electron transport chain, through chemiosmosis","why":"ETC + chemiosmosis together are oxidative phosphorylation.","_n":"2kd9c","_k":"73d0b006"},{"t":"ATP made in glycolysis","why":"That’s substrate-level.","_n":"2le0c","_k":"6f842ef0"},{"t":"Using O₂ to attach phosphate to ADP directly","why":"O₂ only accepts electrons.","_n":"2mdfc","_k":"1b0f7200"},{"t":"The Krebs cycle’s ATP step","why":"That’s substrate-level.","_n":"2ndec","_k":"21d38c78"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Oligomycin blocks ATP synthase. In respiring mitochondria, what happens to ATP synthesis and O₂ use?","options":[{"t":"ATP synthesis rises","why":"The turbine is blocked.","_n":"2oddc","_k":"d983caf0"},{"t":"Both continue normally","why":"The synthase is the only way H⁺ makes ATP.","_n":"2pd4c","_k":"4875adab"},{"t":"ATP synthesis stops, but O₂ use rises","why":"That’s an uncoupler.","_n":"2qd3c","_k":"70d055b9"},{"t":"ATP synthesis stops, and O₂ use falls to a low level","why":"The gradient builds up and the chain stalls.","_n":"2rd31","_k":"80fb8cbb"}]},"b":{"prompt":"DNP is an uncoupler. In respiring mitochondria, what happens to ATP synthesis, O₂ use and heat?","options":[{"t":"All three fall","why":"The chain speeds up.","_n":"2sd21","_k":"80229600"},{"t":"ATP synthesis falls; O₂ use and heat rise","why":"An uncoupler speeds the chain up: O₂ use rises, but the energy becomes heat instead of ATP.","_n":"2td51","_k":"c7b75063"},{"t":"Nothing changes","why":"The leak drains the gradient.","_n":"2ud41","_k":"7c363320"},{"t":"ATP rises; O₂ use falls","why":"That reverses the effect.","_n":"2vd71","_k":"d9d22238"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Mitochondria pump 40 H⁺, and 8 leak back through an uncoupler. At 4 H⁺ per ATP, how many ATP are made?","options":[{"t":"8","why":"(40 − 8) ÷ 4.","_n":"2wd61","_k":"e7a052a3"},{"t":"10","why":"That ignores the leak.","_n":"2xd91","_k":"6d1e1a50"},{"t":"12","why":"That adds the leak.","_n":"2yd81","_k":"a372ec10"},{"t":"32","why":"Divide by 4.","_n":"2zcb1","_k":"36485a64"}]},"b":{"prompt":"Mitochondria pump 30 H⁺, and 6 leak back. At 4 H⁺ per ATP, how many ATP are made?","options":[{"t":"6","why":"(30 − 6) ÷ 4.","_n":"30ca1","_k":"46a0f939"},{"t":"7.5","why":"That ignores the leak.","_n":"31cd1","_k":"72323422"},{"t":"9","why":"That adds the leak.","_n":"32ce1","_k":"56332fa0"},{"t":"24","why":"Divide by 4.","_n":"33cb1","_k":"68e0029a"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Isolated mitochondria with no fuel are given ADP and Pᵢ. The solution outside is made acidic (low pH), so H⁺ is high in the intermembrane space and low in the matrix. What is the best prediction?","options":[{"t":"ATP is made briefly, until the gradient runs down","why":"A gradient alone can drive ATP synthase.","_n":"34cc1","_k":"a9047857"},{"t":"The ETC runs backward to make O₂","why":"Nothing like that happens.","_n":"35c91","_k":"cf994f47"},{"t":"No ATP, because no electrons are flowing","why":"The gradient is what the synthase uses.","_n":"36ca1","_k":"6ed1dd28"},{"t":"ATP is made continuously","why":"Without pumping, the gradient runs out.","_n":"37c71","_k":"c90c39ff"}]},"b":{"prompt":"Scientists make inside-out membrane vesicles from mitochondria, so the ATP synthase heads face outward. When the ETC runs, H⁺ is pumped \u003cstrong>into\u003c/strong> the vesicles. Where is ATP made?","options":[{"t":"In the membrane itself","why":"ATP is released from the head.","_n":"38c81","_k":"1495bae3"},{"t":"Inside the vesicles","why":"The heads face outward.","_n":"39d51","_k":"8a6a8086"},{"t":"Nowhere: inside-out vesicles can’t work","why":"The direction is reversed but consistent.","_n":"3ad61","_k":"9a593c25"},{"t":"In the solution outside the vesicles","why":"H⁺ flows out through the synthase, and the heads face out.","_n":"3bc71","_k":"9f4e06b9"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why the inner mitochondrial membrane must be almost impermeable to H⁺?","options":[{"t":"“So ATP can’t leave.”","why":"ATP leaves through a transporter.","_n":"3cc61","_k":"710b8116"},{"t":"“So O₂ can’t enter the matrix.”","why":"O₂ crosses easily.","_n":"3dc51","_k":"9033a3a6"},{"t":"“So electrons can’t escape.”","why":"H⁺ is the issue, not electrons.","_n":"3ec41","_k":"3031d15e"},{"t":"“If H⁺ could leak back freely, the gradient would collapse, and its energy would be lost as heat instead of driving ATP synthase.”","why":"The membrane must stay sealed: only H⁺ that flows back through ATP synthase makes ATP.","_n":"3fcb1","_k":"0005ce78"}]},"b":{"prompt":"Which is the best description of why the H⁺ gradient stores energy?","options":[{"t":"“The gradient stores electrons.”","why":"Electrons stay in the chain. Protons (H⁺) flow through ATP synthase.","_n":"3gca1","_k":"a8a15295"},{"t":"“Only the concentration difference matters.”","why":"Both count: more H⁺ outside means a concentration difference and a charge difference.","_n":"3hc91","_k":"b9f91846"},{"t":"“H⁺ ions contain ATP.”","why":"They don’t.","_n":"3ic81","_k":"7f6c038e"},{"t":"“H⁺ is crowded on one side and that side is more positive, so H⁺ tends to flow back. Both the concentration difference and the charge difference can do work.”","why":"Both count: more H⁺ outside means a concentration difference and a charge difference.","_n":"3jcf1","_k":"5fe1c3c8"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which row correctly compares the two organelles?","options":[{"t":"Mitochondrion: H⁺ builds up in the intermembrane space, ATP made in the matrix. Chloroplast: H⁺ builds up in the lumen, ATP made in the stroma.","why":"In both, H⁺ is pumped away from where ATP is made: into the intermembrane space or lumen, with ATP made in the matrix or stroma.","_n":"3kce1","_k":"9df63092"},{"t":"Mitochondrion: H⁺ in the matrix, ATP in the intermembrane space. Chloroplast: H⁺ in the stroma, ATP in the lumen.","why":"H⁺ flows \u003cstrong>down\u003c/strong> its gradient: from the intermembrane space back into the matrix. ATP synthase’s head faces the matrix (or stroma). ATP appears where the H⁺ comes out.","_n":"3lc10","_k":"b3cc2225"},{"t":"Both: H⁺ in the matrix, ATP in the stroma.","why":"In both, H⁺ is pumped away from where ATP is made: into the intermembrane space or lumen, with ATP made in the matrix or stroma.","_n":"3mc20","_k":"c517e37f"},{"t":"Mitochondrion: H⁺ in the intermembrane space, ATP in the matrix. Chloroplast: H⁺ in the stroma, ATP in the lumen.","why":"In both, H⁺ is pumped away from where ATP is made: into the intermembrane space or lumen, with ATP made in the matrix or stroma.","_n":"3nc30","_k":"2f3ee949"}]},"b":{"prompt":"Which description of a bacterium’s chemiosmosis is correct?","options":[{"t":"H⁺ is pumped out across the plasma membrane, and ATP is made in the cytoplasm as H⁺ flows back in","why":"Bacteria have no mitochondria; their chain is in the plasma membrane, and H⁺ is pumped away from where ATP is made.","_n":"3oc40","_k":"160e132c"},{"t":"Bacteria make all their ATP by substrate-level phosphorylation","why":"Many bacteria have ETCs.","_n":"3pc50","_k":"d752d7fd"},{"t":"H⁺ is pumped into the cytoplasm, and ATP is made outside the cell","why":"That’s backwards: H⁺ flows \u003cstrong>down\u003c/strong> its gradient, back into the cytoplasm, where ATP synthase’s head releases ATP.","_n":"3qc60","_k":"729d7537"},{"t":"Bacteria use mitochondria","why":"Bacteria have no mitochondria.","_n":"3rc70","_k":"f54d8699"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"Newborns and hibernating mammals have brown fat, whose mitochondria contain thermogenin, a protein channel that lets H⁺ back into the matrix. Why is this useful?","options":[{"t":"It makes extra ATP for shivering","why":"H⁺ bypasses ATP synthase.","_n":"3sc80","_k":"fa7ea487"},{"t":"It stores H⁺ for spring","why":"The gradient can’t be stored that way.","_n":"3tc90","_k":"e74670d5"},{"t":"It stops respiration to save fuel","why":"Respiration speeds up.","_n":"3uca0","_k":"f7db60e4"},{"t":"The gradient’s energy is released as heat, which warms the body","why":"Thermogenin is a built-in uncoupler: brown fat burns fuel mainly to make heat.","_n":"3vcb1","_k":"447ded08"}]},"b":{"prompt":"Why was DNP, once sold as a diet drug, dangerous?","options":[{"t":"It makes fat into ATP directly","why":"It wastes the gradient as heat.","_n":"3wca1","_k":"c4de16a5"},{"t":"It uncouples respiration: fuel is burned rapidly, the energy becomes heat, and body temperature can rise to fatal levels","why":"An uncoupler speeds the chain up: O₂ use rises, but the energy becomes heat instead of ATP.","_n":"3xcd2","_k":"a25aaba5"},{"t":"It stops all ATP use","why":"It cuts ATP production.","_n":"3ycc2","_k":"cb26508c"},{"t":"It blocks complex IV like cyanide","why":"It’s an uncoupler, not a blocker.","_n":"3zc71","_k":"90e2a10e"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"In a hibernating ground squirrel’s brown fat, mitochondria pump 80 H⁺ per second, and half of them leak through thermogenin. At 4 H⁺ per ATP, how many ATP are made per second?","options":[{"t":"5","why":"That takes off the leak twice: 40 H⁺ already pass the synthase, and 40 ÷ 4 = 10.","_n":"40c61","_k":"b8ad1508"},{"t":"10","why":"40 through the synthase ÷ 4.","_n":"41c91","_k":"60ffa565"},{"t":"20","why":"Subtract the leak.","_n":"42c81","_k":"45a0c370"},{"t":"40","why":"That’s H⁺, not ATP.","_n":"43d32","_k":"958f6f16"}]},"b":{"prompt":"A brown-fat cell’s mitochondria pump 90 H⁺ per second, and one third leak through thermogenin. At 4 H⁺ per ATP, how many ATP per second?","options":[{"t":"7.5","why":"That uses the leaked 30.","_n":"44d22","_k":"f208fd48"},{"t":"15","why":"60 ÷ 4.","_n":"45451","_k":"1d6556d0"},{"t":"22.5","why":"Subtract the leak.","_n":"46461","_k":"a85e0ba3"},{"t":"60","why":"That’s H⁺, not ATP.","_n":"47431","_k":"3d136597"}]}}]},"task":{"title":"Warm and working","summary":"Warm and working","statement":"\u003cp>Tune a brown-fat mitochondrion in the simulator so it keeps an animal warm and still makes ATP. Can you find all the answers?\u003c/p>\u003col class=\"cm-tlist\">\u003cli>At least 3 ATP per tick.\u003c/li>\u003cli>At least 8 H⁺ per tick released as heat.\u003c/li>\u003cli>O₂ use of at most 12 per 10 ticks.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">\u003cspan class=\"bio-model\">Model\u003c/span> As in the simulator: ATP = (pumping − leak) ÷ 4 with the synthase on; heat = the leak (H⁺ through thermogenin); O₂ per 10 ticks = pumping ÷ 2.\u003c/p>","checks":["At least 3 ATP per tick","At least 8 heat","O₂ at most 12 per 10 ticks"],"tips":["ATP needs at least 12 H⁺ through the synthase, after the leak.","Heat is the leak: at least 8.","O₂ caps pumping at 24. So pumping − leak ≥ 12 with pumping ≤ 24."],"explainPrompt":"Explain how the leak, the ATP target and the O₂ limit together decided your settings.","vocab":"Use the words gradient, ATP synthase, uncoupler and heat.","more":"There’s more than one answer. Can you find another?","after3":"The O₂ limit and the ATP need squeeze the leak: it can’t be more than 24 − 12 = 12."},"cards":[["Chemiosmosis","Making ATP with the energy of an H⁺ gradient across a membrane."],["Proton-motive force","The H⁺ gradient’s stored energy: a concentration difference plus a charge difference."],["ATP synthase","A protein turbine: H⁺ flowing down its gradient turns the rotor, and the head makes ATP."],["Mitochondrial H⁺ direction","Pumped matrix → intermembrane space; flows back through ATP synthase into the matrix."],["Where ATP is made","Mitochondria: matrix. Chloroplasts: stroma. Bacteria: cytoplasm."],["H⁺ per ATP (model)","About 4 per ATP delivered (≈ 3 to turn the synthase, ≈ 1 for transport)."],["Uncoupler","Lets H⁺ leak back without ATP synthase: less ATP, more O₂ use, more heat (DNP, thermogenin)."],["Oligomycin","Blocks ATP synthase: no ATP; the gradient builds; O₂ use falls."],["Brown fat","Thermogenin leaks H⁺ on purpose, making heat (newborns, hibernators)."],["Oxid
