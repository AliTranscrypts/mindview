.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}

.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}

.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 37: thyroid-axis chain (S8), metabolic-rate gauge, lab card, stress-and-growth timeline (S11), Part 3 stations and
   claim–evidence–reasoning builder (S12), task preview, hero. Roles: TRH --ink, TSH --bio-nadh (teal), T₃/T₄ --bio-e (violet),
   gauge --pen, steroids --bio-atp (testosterone role), amino acids --bio-carbon. Module token: --hm-sheet2 (tinted fills). */
:root{--hm-sheet2:color-mix(in srgb,var(--ink-2) 8%,var(--sheet))}

/* hero */
.hero .hero-eq .hm-heq{font-size:.6em;line-height:1.45;display:inline-block}
.hm-c-tsh{color:var(--bio-nadh);font-weight:700}.hm-c-t{color:var(--bio-e);font-weight:700}
.hm-hero{width:100%;max-width:360px;margin:0 auto;aspect-ratio:400 / 456}
.hm-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 19 / 17 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .8em;font-size:.9rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{color:var(--ink-2);opacity:.6}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;min-width:44px;min-height:40px;padding:.2em .8em;font-weight:700;font-variant-numeric:tabular-nums}
.rg.chips button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* explore layout */
.hm-pg [hidden],.hm-p3 [hidden]{display:none!important}
.hm-pg .pg-ctrl,.hm-ctl{display:grid;gap:12px}
.hm-cn{margin:-6px 0 0}
.hm-stage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px;max-width:440px;margin:0 auto}
.hm-stage svg,.hm-mstage svg{display:block;width:100%;height:auto}
.hm-cap{min-height:2.6em;font-size:.92rem;margin:8px 0 6px}
.hm-note{margin-top:10px;color:var(--ink-2)}

/* chain (SVG) */
.hm-box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.hm-bt{font:700 13px var(--font-ui);fill:var(--ink)}
.hm-bt2{font:700 12px var(--font-ui);fill:var(--ink)}
.hm-bs{font:400 11px var(--font-ui);fill:var(--ink-2)}
.hm-sz,.hm-sm{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.hm-sz.hm-big{font-weight:700;fill:var(--ink)}
.hm-lb{font:700 11.5px var(--font-ui);fill:var(--ink)}
.hm-trh{color:var(--ink)}.hm-tsh{color:var(--bio-nadh)}.hm-t{color:var(--bio-e)}
.hm-sh{stroke:currentColor;stroke-opacity:.38;stroke-linecap:round;fill:none}
.hm-hd{fill:currentColor}
.hm-dot{fill:currentColor;stroke:var(--sheet);stroke-width:1}
.hm-off{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 4;opacity:.6}
.hm-fbp{fill:none;stroke:currentColor;stroke-dasharray:7 5;stroke-linecap:round}
.hm-fbc{fill:var(--sheet);stroke:currentColor;stroke-width:2}
.hm-fbm{font:700 16px var(--font-ui);fill:currentColor}
.hm-gland{fill:var(--hm-sheet2);stroke:var(--ink);stroke-width:1.8;vector-effect:non-scaling-stroke}
.hm-glow{fill:var(--bio-e);opacity:.16}
.hm-ab{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.hm-pil{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:3 3}
.hm-pil.on{fill:var(--bio-e);stroke:var(--bio-e);stroke-dasharray:none}
.hm-pilt{font:700 10px var(--font-ui);fill:var(--ink-2)}
.hm-pilt.on{fill:var(--sheet)}
.hm-bbg{fill:var(--hm-sheet2);stroke:var(--rule);stroke-width:1}
.hm-bnorm{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:.8;stroke-dasharray:2 2}
.hm-bfill{fill:var(--pen)}

/* gauge, symptom card, lab card */
.hm-gauge{max-width:260px;margin:0 auto}
.hm-gauge svg{display:block;width:100%;height:auto}
.hm-ga{fill:none;stroke-width:14}
.hm-ga-lo,.hm-ga-hi{stroke:var(--rule)}
.hm-ga-n{stroke:var(--hi-soft)}
.hm-gl{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.hm-needle{stroke:var(--pen);stroke-width:3.5;stroke-linecap:round}
.hm-hub{fill:var(--pen)}
.hm-gv{font:700 17px var(--font-ui);fill:var(--ink)}
.hm-sym{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;margin:8px 0 10px;font-size:.92rem;display:grid;gap:2px}
.hm-symb{font-weight:700}
.hm-lab{border-collapse:collapse;width:100%;font-size:.9rem;margin:0 0 10px}
.hm-lab caption{text-align:left;font-weight:700;padding:0 0 4px}
.hm-lab th,.hm-lab td{border-bottom:1px solid var(--rule);padding:4px 6px;text-align:left}
.hm-fl-low,.hm-fl-high{font-weight:700}

/* timeline */
.hm-tlwrap{overflow-x:auto;border:1.5px solid var(--rule);border-radius:8px}
.hm-tl{display:block;width:100%;min-width:600px}
.hm-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.hm-leg span{display:inline-flex;align-items:center;gap:5px}
.hm-lg1,.hm-lg2{stroke:var(--ink);stroke-width:2.6}
.hm-lg2{stroke-dasharray:7 4}
.hm-lg3{stroke:var(--ink-2);stroke-width:2.6;stroke-dasharray:2 4}
.hm-sw{display:inline-block;width:14px;height:10px;background:var(--hi-soft);border:1px solid var(--rule)}
.hm-scrub label{font-weight:700;font-size:.92rem}
.hm-scrub input[type=range]{width:100%;min-height:32px;margin:4px 0 0;accent-color:var(--pen)}
.hm-scrub p{margin:2px 0 0}
.hm-ev{display:flex;flex-wrap:wrap;gap:6px}

/* Part 3 */
.hm-p3{display:grid;gap:18px}
.hm-st{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px}
.hm-st h3{margin-top:0}
.hm-mstage{border:1px solid var(--rule);border-radius:8px;max-width:520px}
.hm-cell{fill:var(--hm-sheet2);stroke:var(--ink);stroke-width:1.8}
.hm-rec{fill:none;stroke:var(--ink-2);stroke-width:2.2;stroke-linecap:round}
.hm-ster{fill:var(--bio-atp);stroke:var(--sheet);stroke-width:1}
.hm-aa{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1}
.hm-sdt{border-collapse:collapse;min-width:420px;font-size:.92rem}
.hm-sdt th,.hm-sdt td{border-bottom:1px solid var(--rule);padding:4px 6px;text-align:center}
.hm-sdt th[scope=row]{text-align:left}
.hm-sdt td,.hm-sdt th{font-variant-numeric:tabular-nums}
.hm-sdt .hm-on{background:var(--hi-soft)}
.hm-tb{font:inherit;font-weight:700;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:.25em .55em;min-height:36px}
.hm-tb[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.hm-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;list-style:none;padding:0;margin:8px 0}
.hm-cards li{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--hm-sheet2);font-size:.92rem}
.hm-ebar{position:relative;height:26px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);overflow:hidden;margin:12px 0 2px}
.hm-ebar i{position:absolute;top:0;bottom:0;left:0}
.hm-ez{left:78.57%!important;right:0;background:repeating-linear-gradient(135deg,var(--hi-soft) 0 6px,transparent 6px 11px);border-left:2px dashed var(--ink-2)}
.hm-ef{background:var(--ink-2);opacity:.75;transition:width .4s}
@media (prefers-reduced-motion:reduce){.hm-ef{transition:none}}
.hm-ezl{position:absolute;right:6px;top:3px;font-size:.78rem;font-weight:700;color:var(--ink)}
.hm-escale{position:relative;height:1.3em;margin:0 0 8px}
.hm-escale span{position:absolute;top:0}
.hm-escale span:nth-child(1){left:0}.hm-escale span:nth-child(2){left:78.57%;transform:translateX(-50%)}.hm-escale span:nth-child(3){right:0}
.hm-ce{display:grid;gap:6px;margin:0}
.hm-ce div{display:grid;grid-template-columns:6.5em 1fr;gap:8px}
.hm-ce dt{font-weight:700}.hm-ce dd{margin:0}
.hm-cerq{font-size:1.02rem}
.hm-cg h4,.hm-arg h4{margin:10px 0 6px;font-size:.92rem}
.hm-cg .chip{text-align:left}
.hm-arg{border:1.5px dashed var(--rule);border-radius:8px;padding:6px 12px;margin:12px 0 4px;background:var(--hm-sheet2)}
.hm-arg p{margin:4px 0;font-size:.92rem}

/* task */
.hm-tin{display:grid;gap:12px;margin:10px 0}
.hm-tlist{margin:6px 0 0 1.2em;padding:0}
.hm-tpv h4{margin:0 0 6px}

ry System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"72d825f1","content":{"id":"37-hormones-that-affect-metabolism","kind":"topic","title":"Hormones that affect metabolism","topic":"Hormones That Affect Metabolism","readyTopic":"hormones that affect metabolism","hero":{"eq":"\u003cspan class=\"hm-heq\">TRH → \u003cspan class=\"hm-c-tsh\">TSH\u003c/span> → \u003cspan class=\"hm-c-t\">T₄, T₃\u003c/span> → metabolic rate ↑\u003c/span>","eqLabel":"TRH leads to TSH, which leads to T4 and T3, which raise the metabolic rate","eqSize":"sm","headline":"One gland sets your pace, and two others set the gland","text":"How fast your cells burn fuel depends on \u003cstrong>thyroid hormones\u003c/strong>, T₄ and T₃, which need \u003cstrong>iodine\u003c/strong> to be made. But the thyroid doesn’t decide alone: the \u003cstrong>hypothalamus\u003c/strong> and the \u003cstrong>anterior pituitary\u003c/strong> run it with \u003cstrong>negative feedback\u003c/strong>. In this module you’ll break the chain in different places and learn to read the clues. Then you’ll look at hormones athletes misuse, and why the same feedback makes them risky.","fig":{"html":"\u003cdiv class=\"hm-hero\" id=\"hm-hero\" role=\"img\" aria-label=\"A vertical chain: hypothalamus (TRH), anterior pituitary (TSH), thyroid (T4, T3), body cells (metabolic rate). TRH dots flow to the pituitary, TSH dots travel to the thyroid, which glows and releases violet T3 and T4 dots. The body cells’ metabolic-rate bar rises to normal. Two curved minus arrows from T3 and T4 back to the pituitary and hypothalamus pulse, and the TRH and TSH flows thin out. Caption: Enough hormone? The chain eases off.\">\u003c/div>"}},"goals":["I can trace the thyroid axis (TRH → TSH → T₃/T₄) and explain its negative feedback.","I can explain why iodine deficiency and a damaged thyroid both cause low T₃/T₄ and high TSH, and how a goitre forms.","I can use TSH and T₃/T₄ results to identify where a thyroid problem lies.","I can compare epinephrine, cortisol and growth hormone by source, trigger, effect and time scale.","I can evaluate the benefits and risks of using hormones to enhance performance, using feedback and physiology."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Feedback and the pituitary","goal":1,"prompt":"Which part of the pituitary releases its own hormones when releasing hormones arrive from the hypothalamus?","options":[{"t":"The anterior pituitary","why":"Releasing hormones reach it through tiny blood vessels.","_n":"0f71","_k":"902e91a1"},{"t":"The posterior pituitary","why":"It releases hormones made by hypothalamus neurons (ADH, oxytocin).","_n":"1f81","_k":"9a85b4a8"},{"t":"Neither; the hypothalamus releases everything itself","why":"The pituitary releases TSH, FSH and others.","_n":"2f91","_k":"1fb5324a"},{"t":"Both equally","why":"Only the anterior lobe responds to releasing hormones.","_n":"3f21","_k":"ce8e1230"}],"hints":["Recall module 34’s two pathways.","One lobe is controlled by blood-borne releasing hormones.","Anterior."]},{"id":"w2","skill":"Feedback and the pituitary","goal":1,"prompt":"A hormone’s level rises and this reduces the signal that released it. What is this?","options":[{"t":"Positive feedback","why":"That would increase the signal.","_n":"4f31","_k":"e075c3e6"},{"t":"No feedback","why":"The output changes the input, so it’s feedback.","_n":"5f41","_k":"bc002360"},{"t":"A reflex","why":"A reflex is a fast nerve pathway.","_n":"6f51","_k":"89827a4a"},{"t":"Negative feedback","why":"The response turns down its own trigger.","_n":"7fe1","_k":"41d3a710"}],"hints":["Does the output boost or reduce its trigger?","Reduce.","Negative feedback."]},{"id":"w3","skill":"Metabolism","goal":1,"prompt":"If cells carry out more cellular respiration, what else increases?","options":[{"t":"Heat production and oxygen use","why":"Respiration uses O₂ and releases heat.","_n":"8ff1","_k":"80c01d60"},{"t":"Glucose storage","why":"More respiration uses glucose up.","_n":"92a3","_k":"4430ad0b"},{"t":"Body temperature falls","why":"More respiration makes more heat.","_n":"a293","_k":"7d6aeb6b"},{"t":"The amount of CO₂ in the air you breathe in","why":"You breathe \u003cem>out\u003c/em> more CO₂.","_n":"b283","_k":"e4d05741"}],"hints":["What are respiration’s inputs and outputs?","O₂ in; CO₂, water, ATP and heat out.","More heat, more O₂ used."]},{"id":"w4","skill":"Metabolism","goal":4,"prompt":"Which change would give muscles more fuel quickly during an emergency?","options":[{"t":"Making new muscle protein","why":"That’s slow, and builds rather than fuels.","_n":"c273","_k":"fd817edf"},{"t":"Building more glycogen","why":"That stores glucose away.","_n":"d263","_k":"f229e0c9"},{"t":"Slowing the heart","why":"Fuel and O₂ need faster delivery.","_n":"e253","_k":"d0929da3"},{"t":"Breaking down glycogen to release glucose into the blood","why":"Stored glucose becomes available in seconds.","_n":"f243","_k":"be510c6e"}],"hints":["Where is glucose stored?","As glycogen in the liver and muscle.","Break it down."]},{"id":"w5","skill":"Reading lab-style data","goal":3,"prompt":"A lab report gives a patient’s value as ‘250% of the normal mean’. What does that mean?","options":[{"t":"2.5 times the normal mean value","why":"250% = 2.5 ×.","_n":"g233","_k":"33c12b6c"},{"t":"Below normal","why":"Above 100% is higher than normal.","_n":"h223","_k":"d977be99"},{"t":"250 units above normal","why":"Percent compares; it isn’t units added.","_n":"i213","_k":"01cad88b"},{"t":"Slightly above normal","why":"2.5 times is far above.","_n":"j103","_k":"cdc76798"}],"hints":["100% is normal.","250 ÷ 100.","2.5 times normal."]},{"id":"w6","skill":"Reading lab-style data","goal":3,"prompt":"Two people both have a fast heart rate. Person X has high thyroid hormone; person Y has normal thyroid hormone but has just had a scare. Which statement is best supported?","options":[{"t":"The same symptom can have different causes, so a test is needed to tell them apart","why":"Symptoms alone don’t identify a cause.","_n":"k113","_k":"8dcac887"},{"t":"Neither has a fast heart rate for a real reason","why":"Both have real causes.","_n":"l0e3","_k":"3d95108c"},{"t":"Both must have a thyroid problem","why":"Y’s thyroid hormone is normal.","_n":"m0f3","_k":"215415ba"},{"t":"Y must have a thyroid problem too","why":"Y’s tests are normal.","_n":"n143","_k":"f6d356f0"}],"hints":["Are their causes the same?","One is thyroid, one is a scare.","Same symptom, different causes."]}],"refreshers":{"Feedback and the pituitary":"The hypothalamus sends releasing hormones to the anterior pituitary, which releases hormones that act on other glands. A hormone that reduces its own trigger is negative feedback.","Metabolism":"Metabolic rate is how fast cells use energy. Faster respiration uses more O₂ and glucose and releases more heat. Glycogen breakdown releases glucose quickly.","Reading lab-style data":"Percent of normal: 100% is typical, 200% is double. The same symptom can have several causes, so test results guide the explanation."}}},"explore":{"heading":"Thyroid axis simulator","intro":"Change the iodine, the gland’s condition and any hormone pills. Watch TRH, TSH and T₃/T₄ settle, then read the results like a lab report.","modes":[["axis","Thyroid axis"],["time","Stress and growth timeline"]],"iodine":[["vlow","Very low"],["low","Low"],["adeq","Adequate"]],"conds":[["healthy","Healthy"],["dam","Damaged"],["graves","Graves’"]],"condNote":{"healthy":"Healthy gland.","dam":"Damaged: makes less hormone.","graves":"Graves’: antibodies stimulate the gland."},"pills":[0,25,50,60,75,100,125,150],"symptoms":{"low":"Low: tired, cold, weight gain, slow heart rate","normal":"Normal","high":"High: weight loss, heat intolerance, fast heart rate, restlessness"},"feedback":{"weak":"Weak: T₃/T₄ too low to switch TSH off","even":"Steady: T₃/T₄ at 100% hold TSH at the gland’s share","strong":"Strong: high T₃/T₄ switch TSH off"},"events":[{"id":"wake","t":"Morning wake-up 07:00","at":60},{"id":"scare","t":"Sudden scare 10:00","at":241},{"id":"exam","t":"Exam 13:00–16:00","at":510},{"id":"sleep","t":"Deep sleep 23:00–01:00","at":1080}],"modelNote":"\u003cstrong>Model values\u003c/strong>, in % of normal (steady state). The pituitary aims for a total of 100% T₃/T₄; TSH can rise to at most 400%. Timeline values are relative to each hormone’s own baseline. Every pill setting is a model, not dosing advice.","aha":"TSH moves opposite to T₃/T₄ when the pituitary is working; the pattern of TSH, T₃/T₄ and goitre points to the cause; pills shut down your own gland before they push hormone levels up.","predIntro":"Make a prediction first. Then the simulator will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"axis","io":"adeq","cond":"healthy","pill":0},"to":{"io":"vlow"},"prompt":"\u003cspan class=\"muted\">Healthy gland, adequate iodine, no pill: everything at 100%. Change: iodine to Very low.\u003c/span> Predict TSH and T₃/T₄.","options":[{"t":"T₃/T₄ falls to 30% and TSH rises to its maximum","_n":"o153","_k":"684b7f47"},{"t":"TSH falls with T₃/T₄","_n":"p123","_k":"d3280874"},{"t":"Both stay normal","_n":"q133","_k":"0849f470"},{"t":"T₃/T₄ stays at 100% because TSH makes up for it","_n":"r183","_k":"c015e288"}],"reveal":"The TSH flow thickens, the gland swells, and the gauge drops to 30.","explain":"No iodine, no hormone. With almost no T₃/T₄ to switch it off, TSH climbs and the gland grows: a goitre."},{"id":"p2","start":{"mode":"axis","io":"adeq","cond":"healthy","pill":0},"to":{"pill":100},"prompt":"\u003cspan class=\"muted\">Healthy gland, adequate iodine. Change: pill from 0 to 100.\u003c/span> What happens to the person’s own thyroid output and the total?","options":[{"t":"TSH rises","_n":"s193","_k":"3d860914"},{"t":"Total doubles to 200%","_n":"t963","_k":"8624affc"},{"t":"Own output falls to 0; total stays at 100%","_n":"u953","_k":"7dd8d919"},{"t":"Own output stays at 100%","_n":"v983","_k":"396dc25c"}],"reveal":"The TSH flow fades to nothing and the gland stops; the gauge holds at 100.","explain":"The pill supplies the hormone, so negative feedback shuts TSH off and the gland rests."},{"id":"p3","start":{"mode":"axis","io":"adeq","cond":"healthy","pill":0},"to":{"cond":"graves"},"prompt":"\u003cspan class=\"muted\">Graves’, adequate iodine, no pill.\u003c/span> Antibodies are driving the thyroid. Predict TSH.","options":[{"t":"Normal","_n":"w973","_k":"006e706a"},{"t":"Close to 0","_n":"x923","_k":"3d0b4db7"},{"t":"Very high","_n":"y913","_k":"fa634b56"},{"t":"It can’t be predicted","_n":"z943","_k":"fb83ad34"}],"reveal":"The total climbs to 200, TSH drops to 0, and the gland enlarges.","explain":"High T₃/T₄ switches the pituitary off, but the antibodies keep the gland going anyway."},{"id":"p4","start":{"mode":"time","tmin":239},"sweep":true,"prompt":"\u003cspan class=\"muted\">Timeline mode at 09:59.\u003c/span> A sudden scare at 10:00. Which hormone rises first and falls back fastest?","options":[{"t":"Thyroxine","_n":"10933","_k":"c761bbaa"},{"t":"Epinephrine","_n":"119e3","_k":"f211b04a"},{"t":"Growth hormone","_n":"129d3","_k":"5c7bea7b"},{"t":"Cortisol","_n":"138c2","_k":"fb18b455"}],"reveal":"The epinephrine curve spikes and falls by 10:10; cortisol barely moves until the afternoon exam.","explain":"Epinephrine is released by nerve signals to the adrenal medulla within seconds. Cortisol works over hours."}],"chalIntro":"Use the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Using \u003cstrong>only\u003c/strong> the iodine setting (healthy gland, no pill), cause a goitre. What happens to TSH?","why":"With Low or Very low iodine the gland can’t make 100%, so feedback stays weak: TSH climbs to its 400% maximum and keeps stimulating the gland, which enlarges.","wrong":{"only":"Use the iodine setting only.","adeq":"With enough iodine the gland keeps up; TSH stays normal.","mode":"Switch to \u003cstrong>Thyroid axis\u003c/strong> mode first."},"hints":["What does the thyroid need to make T₄?","Less iodine, less hormone, weaker feedback.","Low or Very low."]},{"id":"tc2","goal":3,"prompt":"A patient’s gland is Damaged (adequate iodine). Choose a pill dose that brings total T₃/T₄ to exactly 100% \u003cstrong>and\u003c/strong> keeps TSH below 100% (no goitre).","why":"The damaged gland makes at most 40%, so the pill must cover at least 60%. At 60, 75 or 100 the total is 100% and TSH settles at the gland’s share (40%, 25% or 0%).","wrong":{"p50":"Total 90% is in the normal range, but TSH is at maximum and the gland is enlarging.","p125":"Total 125%: too much; hyperthyroid symptoms, and TSH is shut off.","setup":"Set the gland to \u003cstrong>Damaged\u003c/strong> with \u003cstrong>Adequate\u003c/strong> iodine first.","mode":"Switch to \u003cstrong>Thyroid axis\u003c/strong> mode first."},"hints":["The damaged gland can make at most 40%.","The pill must cover at least 60%.","60, 75 or 100."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"A lab report reads: \u003cstrong>TSH 0%, total T₃/T₄ 200%, gland enlarged\u003c/strong>. Set the model to match it. One Check only.","why":"Graves’ with adequate iodine and no pill: antibodies drive the gland to 200%, and the high hormone switches TSH off.","wrong":{"pill150":"TSH 0 and high hormone, but the total is 150% and the gland isn’t enlarged. Pills don’t cause a goitre.","lowio":"That gives \u003cem>high\u003c/em> TSH.","graveslow":"Total only 60%: Graves’ needs iodine to make hormone.","mode":"Switch to \u003cstrong>Thyroid axis\u003c/strong> mode first.","other":"Compare your lab card with the report: TSH 0%, total 200%, enlarged."},"hints":["TSH 0 means the pituitary is being switched off by high hormone.","What can enlarge a gland while TSH is 0?","Antibodies (Graves’) with enough iodine: 200%."]}]},"part3":{"slug":"performance","name":"Performance","heading":"Hormones and performance","intro":"Some athletes take hormones to train harder or recover faster. Visit four evidence stations, then build an argument from the evidence, not from opinion.","steroid":{"title":"Station 1: anabolic steroids","panel":"Check it with data","mech":"Synthetic testosterone-like molecules enter muscle cells, bind receptors and switch on genes that increase protein synthesis.","play":"Play the mechanism","replay":"Play it again","dataIntro":"An athlete’s blood and sperm tests before, during and after steroid use, as % of the athlete’s own pre-use levels.","head":["Measure","Before","Week 8 of use","3 months after stopping"],"rows":[["LH",100,15,70],["Own testosterone",100,20,60],["Sperm count",100,25,55]],"note":"Model values chosen to show negative feedback and partial recovery; real results vary from person to person.","askRow":"Tap the row that shows negative feedback.","askCol":"Tap the column that shows recovery taking time.","rowFb":[{"t":"Right. High steroid levels feed back on the hypothalamus and pituitary, so LH drops to 15%. The testes lose their signal.","_n":"148d2","_k":"1b23272a"},{"t":"Own testosterone falls, but only because its signal fell. Which row is the brain’s signal to the testes?","_n":"158e2","_k":"1eb67cc5"},{"t":"Sperm count falls as a result, further down the chain. Which row is the brain’s signal to the testes?","_n":"168f2","_k":"c88e9c5d"}],"colFb":[{"t":"That’s the starting point: every value is 100%.","_n":"17902","_k":"93949fa1"},{"t":"That shows the effect of use. Which column shows values still below 100 after the steroids stop?","_n":"18912","_k":"d4b7fb77"},{"t":"Right. Three months after stopping, LH is back to only 70%, testosterone 60% and sperm count 55%: the axis takes months to recover.","_n":"19922","_k":"0ab88266"}],"risksTitle":"Other risks","risks":["Heart disease (cholesterol changes)","Liver damage","Acne","Mood changes","In females, effects such as voice deepening that may not reverse"],"link":"Module 38 follows the testosterone feedback loop in detail."},"epo":{"title":"Station 2: EPO","intro":"Erythropoietin (EPO) from the kidneys tells bone marrow to make red blood cells.","levels":[["none","None",45,"normal"],["mod","Moderate",55,"↑"],["high","High",60,"↑"]],"label":"Extra EPO","zone":"clot risk","note":"Model values: the share of blood that is red cells."},"gh":{"title":"Station 3: growth hormone","claim":"Builds muscle in healthy adults.","evidence":"Mostly increases water retention and lean mass, with little proven strength gain.","risks":"Joint pain, enlarged hands and jaw (acromegaly-like), higher blood glucose."},"rules":{"title":"Station 4: rules and fairness","items":["Anti-doping in Canada is run by the Canadian Centre for Ethics in Sport under world anti-doping rules.","After the 1988 Seoul Olympics doping case, Canada held the Dubin Inquiry into drug use in sport.","\u003cstrong>Therapeutic use exemptions:\u003c/strong> an athlete with type 1 diabetes may use insulin under medical care."]},"cer":{"title":"Build the argument","prompt":"Should a 17-year-old cyclist use EPO to train harder?","how":"Choose one claim, then tap the evidence and reasoning chips that support it. Press \u003cstrong>Check my argument\u003c/strong>.","claims":[{"id":"c1","t":"No: the cyclist shouldn’t use EPO.","good":true},{"id":"c2","t":"Yes: it would let them train harder."},{"id":"c3","t":"Yes, as long as nobody finds out."}],"evidence":[{"id":"e1","t":"EPO raises red cells from about 45% to 60% of the blood (Station 2).","kind":"plain"},{"id":"e2","t":"Above 55% red cells, blood thickens into the clot-risk zone (Station 2).","kind":"risk"},{"id":"e3","t":"EPO is banned in sport; an exemption needs a documented medical need (Station 4).","kind":"rule"},{"id":"e4","t":"Steroid users’ LH fell to 15% of normal (Station 1).","kind":"off"},{"id":"e5","t":"Everyone at the top level does it.","kind":"opinion"}],"reasoning":[{"id":"r1","t":"Thicker blood makes clots and strokes more likely, so the health risk outweighs the training gain.","kind":"risk"},{"id":"r2","t":"Using a banned drug is unfair to other riders and can end a career with a ban.","kind":"rule"},{"id":"r3","t":"EPO is natural to the body, so extra EPO is safe.","kind":"opinion"},{"id":"r4","t":"If it helps you win, it’s worth it.","kind":"opinion"}],"fb":{"noClaim":"Choose a claim first.","noEv":"Add at least one evidence chip and one reasoning chip.","onlyOpinion":"Those chips are opinions, not evidence: ‘everyone does it’ doesn’t show what EPO does to the body. Use the stations.","opinion":"Your build includes an opinion chip. Opinions aren’t evidence: take it out and lean on the station data.","badClaim":"Your evidence points one way and your claim the other. Thick blood, clots and a ban are reasons \u003cem>not\u003c/em> to use EPO.","off":"The steroid data are about a different hormone. Choose evidence about EPO.","noRisk":"Add a physiological risk: what does extra EPO do to the blood?","noRule":"Add a fairness or rule point: what do anti-doping rules say?","good":"✓ A strong argument: a clear claim, a physiological risk (clotting) and a fairness or rule point, with no opinion chips."}},"quickCheck":{"title":"Quick check","summary":"Performance quick check","items":[{"id":"q1","goal":5,"prompt":"Why can steroid use shrink the testes?","choices":[{"t":"Steroids raise LH","fb":"The brain senses high androgen levels and stops signalling the testes.","_n":"1a932","_k":"3a45f87c"},{"t":"Steroids poison the testes directly","fb":"The brain senses high androgen levels and stops signalling the testes.","_n":"1b942","_k":"9eea36d0"},{"t":"Negative feedback lowers LH and FSH","fb":"Right. The brain senses high androgen levels and stops signalling the testes.","_n":"1c952","_k":"fbce627f"},{"t":"The muscles use up testosterone","fb":"The brain senses high androgen levels and stops signalling the testes.","_n":"1d922","_k":"08be7af4"}]},{"id":"q2","goal":5,"prompt":"EPO improves endurance because…","choices":[{"t":"more red blood cells carry more O₂","fb":"Right. EPO acts on bone marrow, so more red blood cells carry O₂ to muscles.","_n":"1e912","_k":"fc190a05"},{"t":"it adds glucose to the blood","fb":"EPO acts on bone marrow.","_n":"1f902","_k":"eccc2298"},{"t":"muscles get bigger","fb":"EPO acts on bone marrow.","_n":"1g8f2","_k":"18fc7880"},{"t":"it lowers heart rate","fb":"EPO acts on bone marrow.","_n":"1h962","_k":"577adc7c"}]},{"id":"q3","goal":5,"prompt":"EPO’s main health risk is…","choices":[{"t":"fever","fb":"More cells make blood more viscous.","_n":"1i952","_k":"faa6d972"},{"t":"low blood sugar","fb":"More cells make blood more viscous.","_n":"1j942","_k":"ea575fe8"},{"t":"weak bones","fb":"More cells make blood more viscous.","_n":"1k932","_k":"47d59c62"},{"t":"thicker blood and clots","fb":"Right. More cells make blood more viscous.","_n":"1l9a2","_k":"30187950"}]},{"id":"q4","goal":5,"prompt":"Which is a fair reason an athlete may use a banned hormone?","choices":[{"t":"They feel tired","fb":"A fair reason is a therapeutic use exemption: a documented medical need, approved in advance.","_n":"1m992","_k":"97b8e8c2"},{"t":"It’s natural to the body","fb":"A fair reason is a therapeutic use exemption: a documented medical need, approved in advance. Even the body’s own hormones cause harm at unnatural levels: thick blood from EPO, shrunken testes from steroids.","_n":"1n982","_k":"334db868"},{"t":"Others use it","fb":"A fair reason is a therapeutic use exemption: a documented medical need, approved in advance.","_n":"1o992","_k":"ddbd1b1c"},{"t":"A documented medical need, approved in advance","fb":"Right. That’s a therapeutic use exemption.","_n":"1p962","_k":"5dd48d07"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Hormone ↔ source and job","summary":"Hormone ↔ source and job","goal":[1,4],"instruction":"Match each hormone with its source and job.","leftTitle":"Hormone","rightTitle":"Source and job","left":[{"id":"l1","t":"TRH"},{"id":"l2","t":"TSH"},{"id":"l3","t":"T₄ and T₃"},{"id":"l4","t":"Growth hormone"},{"id":"l5","t":"ACTH","hints":["ACTH is ‘adreno-cortico-tropic’.","It targets the adrenal cortex.","Releases cortisol."]},{"id":"l6","t":"Cortisol"},{"id":"l7","t":"Epinephrine"},{"id":"l8","t":"EPO","hints":["Which organ senses low oxygen in the blood?","The kidneys.","EPO → red blood cells."]}],"right":[{"id":"r1","t":"Hypothalamus; tells the anterior pituitary to release TSH"},{"id":"r2","t":"Anterior pituitary; tells the thyroid to release T₃/T₄"},{"id":"r3","t":"Thyroid; raise metabolic rate, needed for growth and brain development"},{"id":"r4","t":"Anterior pituitary; growth of bone and muscle, protein synthesis"},{"id":"r5","t":"Anterior pituitary; tells the adrenal cortex to release cortisol"},{"id":"r6","t":"Adrenal cortex; raises blood glucose in long-term stress, reduces inflammation"},{"id":"r7","t":"Adrenal medulla; fight or → posterior pituitary releases TSH → thyroid → levels rise","why":"TSH is from the anterior lobe.","_n":"4abac","_k":"99021127"},{"t":"Low T₃/T₄ → thyroid releases TRH → hypothalamus releases TSH → levels rise","why":"The glands are in the wrong roles. The thyroid answers to TSH from the pituitary, which answers to TRH from the hypothalamus.","_n":"4bb7c","_k":"fd238c4e"},{"t":"Low T₃/T₄ → hypothalamus releases more TRH → anterior pituitary releases more TSH → thyroid releases more T₃/T₄ → levels rise and feedback eases","why":"Each gland answers to the one above it, and feedback eases as levels recover.","_n":"4cb8c","_k":"c277bc93"},{"t":"Low T₃/T₄ → less TRH → less TSH → levels rise","why":"Low T₃/T₄ means less negative feedback, so TSH \u003cstrong>rises\u003c/strong>.","_n":"4db5c","_k":"8da9e7e2"}]},"b":{"prompt":"Which flow chart correctly shows the body’s response to a sudden danger?","options":[{"t":"Danger → hypothalamus → TSH → thyroid → faster heart rate within seconds","why":"The thyroid axis is far too slow.","_n":"4eb6c","_k":"e385f128"},{"t":"Danger → nerve signals → adrenal medulla releases epinephrine → faster heart rate, glycogen broken down to glucose → body ready to act","why":"Nerves trigger the adrenal medulla in seconds.","_n":"4fb7c","_k":"a549d02d"},{"t":"Danger → growth hormone → muscles grow → body ready to act","why":"Growth takes weeks.","_n":"4gb6c","_k":"f456df3e"},{"t":"Danger → adrenal cortex releases cortisol within seconds → fight or flight","why":"Epinephrine is seconds-to-minutes fight or flight; cortisol is hours-long stress response.","_n":"4hb5c","_k":"d602d70e"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"An endurance athlete injects EPO. What is the main benefit sought, and the main health risk?","options":[{"t":"Bigger muscles; low blood sugar","why":"EPO acts on red blood cells.","_n":"4ib4c","_k":"37d2d79a"},{"t":"A faster metabolic rate; weight loss","why":"That’s thyroid hormone.","_n":"4jbbc","_k":"53f84b53"},{"t":"More red blood cells carry more O₂ to muscles; the blood becomes thicker, raising the risk of clots and stroke","why":"Even the body’s own hormones cause harm at unnatural levels: thick blood from EPO, shrunken testes from steroids.","_n":"4kbac","_k":"69fc25de"},{"t":"No real benefit or risk, because EPO is natural to the body","why":"Even the body’s own hormones cause harm at unnatural levels: thick blood from EPO, shrunken testes from steroids.","_n":"4lb9c","_k":"60333ffe"}]},"b":{"prompt":"A weightlifter uses anabolic steroids. What is the main benefit sought, and a risk explained by feedback?","options":[{"t":"More red blood cells; thicker blood","why":"That’s EPO.","_n":"4mb8c","_k":"b6231e82"},{"t":"No risk, because testosterone is natural","why":"Even the body’s own hormones cause harm at unnatural levels: thick blood from EPO, shrunken testes from steroids.","_n":"4nafc","_k":"5c00f2ca"},{"t":"More muscle protein synthesis; lower LH and FSH reduce the body’s own testosterone and sperm production","why":"Extra hormone triggers negative feedback: the body’s own production falls first.","_n":"4oaec","_k":"2c19179b"},{"t":"More muscle; higher LH and FSH","why":"Extra hormone triggers negative feedback: the body’s own production falls first.","_n":"4p31b","_k":"1cededce"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Regions where most homes use iodized salt have far fewer goitres than regions where few do. Which conclusion is best supported?","options":[{"t":"Iodized salt prevents every kind of thyroid disease","why":"Goitre is one condition, and one link can’t prove a cause.","_n":"4q32b","_k":"4a0e059c"},{"t":"Salt causes goitre","why":"The link is the other way: iodized salt goes with \u003cem>fewer\u003c/em> goitres.","_n":"4r33b","_k":"da3689aa"},{"t":"Iodine intake is linked to fewer goitres; with iodine’s known role in making T₄, this supports iodizing salt","why":"A link plus a known mechanism supports action. Linked results suggest a cause; a mechanism or controlled experiment is needed to support it.","_n":"4s34b","_k":"d3988caf"},{"t":"Goitre is only inherited, so salt doesn’t matter","why":"The data show an environmental link.","_n":"4t35b","_k":"71a1d6ae"}]},"b":{"prompt":"A study gives one group of tadpoles thyroxine and another group none, with the same temperature, food and tank size. What is the \u003cstrong>dependent\u003c/strong> variable?","options":[{"t":"Whether thyroxine is added","why":"That’s the independent variable.","_n":"4u36b","_k":"a1ef1afc"},{"t":"The time until metamorphosis","why":"It’s what’s measured, and it depends on the thyroxine.","_n":"4v37b","_k":"0f83b465"},{"t":"The amount of food","why":"That’s controlled.","_n":"4w38b","_k":"1a8c45ec"},{"t":"The water temperature","why":"That’s controlled.","_n":"4x29b","_k":"8b519a8d"}]}}]},"task":{"title":"Restore the balance","summary":"Restore the balance","statement":"\u003cp>A model patient has a damaged thyroid. Choose their iodine intake and pill dose so their hormones and gland are healthy, while their own thyroid keeps working. There’s more than one plan that works. Can you find them all?\u003c/p>\u003col class=\"hm-tlist\">\u003cli>Total T₃/T₄ is between 90% and 110%.\u003c/li>\u003cli>TSH is at most 100% (the gland isn’t being overdriven).\u003c/li>\u003cli>The patient’s own thyroid still makes some hormone (own output &gt; 0).\u003c/li>\u003cli>Iodine intake is not “Very low”.\u003c/li>\u003c/ol>","checks":["Hormone in range","Gland not overdriven","Own thyroid still working","Enough iodine"],"tips":["Too low: raise the pill dose. Too high: lower it.","TSH is maxed: the pill doesn’t cover enough of the shortfall.","The pill covers everything, so feedback has shut the gland off. Try a smaller dose.","Very low iodine starves the gland."],"explainPrompt":"Explain why a dose of 50 failed and a dose of 100 also failed, using TSH and negative feedback.","vocab":"Use the words TSH, negative feedback, T₃/T₄ and goitre.","more":"There’s more than one plan that works. Can you find another?","after3":"The pill and the gland share the work. Feedback sets TSH to exactly the gland’s share.","afterAt":4},"cards":[["Thyroid axis","Hypothalamus (TRH) → anterior pituitary (TSH) → thyroid (T₄, T₃)."],["What T₃/T₄ do","Raise metabolic rate; needed for growth and brain development."],["Thyroid feedback","High T₃/T₄ lowers TRH and TSH; low T₃/T₄ lets them rise."],["Iodine","Needed to make T₄ and T₃; Canada adds it to table salt."],["Goitre","An enlarged thyroid: from high TSH (iodine deficiency) or antibodies (Graves’)."],["Hypothyroidism","Low T₃/T₄: tired, cold, slow heart rate, weight gain; TSH high if the gland is the cause."],["Graves’ disease","Antibodies drive the thyroid: T₃/T₄ high, TSH low, goitre."],["Epinephrine","Adrenal medulla; fight or flight within seconds."],["Cortisol","Adrenal cortex (via ACTH); long-term stress; raises blood glucose; reduces inflammation."],["Growth hormone","Anterior pituitary; growth and protein synthesis; pulses in deep sleep."],["EPO","Kidney hormone; more red blood cells; misuse thickens blood (clot risk)."],["Anabolic steroids","Build muscle protein; feedback lowers LH, FSH and the body’s own testosterone."]]}};</script>
