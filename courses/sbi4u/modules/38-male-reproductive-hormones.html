.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 38: Testosterone feedback loop (S8 chain diagram, S11 strip chart, readout), Part 3 stations (receptor zoom,
   lake data, pill-to-lake ranking), Predict the blood test chip grid, task (tank grid + sample bars), hero.
   Roles: GnRH --ink, LH --bio-e, FSH --bio-nadh, testosterone --bio-atp, inhibin --bio-fadh, external androgen --ink dashed,
   estrogen --bio-h, vitellogenin --bio-carbon. Dark mode: brake arrows use --ink (plan §5). */
:root{--mr-sheet2:color-mix(in srgb,var(--ink-2) 7%,var(--sheet))}

/* hero */
.hero .hero-eq .mr-heq{font-size:.6em;line-height:1.45;display:inline-block}
.mr-c-g{color:var(--ink);fill:var(--ink);font-weight:700}
.mr-c-lh{color:var(--bio-e);fill:var(--bio-e);font-weight:700}
.mr-c-fsh{color:var(--bio-nadh);fill:var(--bio-nadh);font-weight:700}
.mr-c-t{color:var(--bio-atp);fill:var(--bio-atp);font-weight:700}
.mr-c-i{color:var(--bio-fadh);fill:var(--bio-fadh);font-weight:700}
.mr-c-e{fill:var(--bio-h)}
.mr-c-pen{fill:var(--pen)}
.mr-hero{width:100%;max-width:440px;margin:0 auto;aspect-ratio:400 / 390}
.mr-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 19 / 17 / 13 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:0}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .7em;font-size:.88rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;min-width:44px;min-height:40px;padding:.2em .8em;font-weight:700}
.rg.chips button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.rg.chips.mr-vlist{display:flex;flex-direction:column;align-items:stretch}
.rg.chips.mr-vlist button{border-radius:8px;text-align:left}

/* switch (from SBI4U 09 cc-swb) */
.mr-swb{display:inline-flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .7em;min-height:44px;font-size:.9rem;font-weight:700}
.mr-swk{flex:0 0 30px;height:16px;border-radius:8px;border:1.5px solid var(--ink-2);position:relative;background:var(--paper)}
.mr-swk::after{content:"";position:absolute;top:1.5px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.mr-swb[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.mr-swb[aria-checked="true"] .mr-swk{background:var(--ink);border-color:var(--ink)}
.mr-swb[aria-checked="true"] .mr-swk::after{left:15px;background:var(--sheet)}
.mr-swst{font-size:.75rem;color:var(--ink-2)}

/* explore layout */
.mr-pg [hidden]{display:none!important}
.mr-pg .pg-ctrl{display:grid;gap:12px;align-content:start}
.mr-stage,.mr-zstage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.mr-stage svg,.mr-zstage svg{display:block;width:100%;height:auto}
.mr-stage{max-width:460px;margin:0 auto}
.mr-cap{min-height:2.6em;font-size:.92rem;margin:8px 0 6px}
.mr-chartbox{border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet)}
.mr-chartbox svg{display:block;width:100%;height:auto}
.mr-ct{margin:0 0 2px;font-weight:700;font-size:.88rem}
.mr-chsum{margin:4px 0 0}
.mr-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.mr-leg span{display:inline-flex;align-items:center;gap:5px}
.mr-sw{display:inline-block;width:18px;height:0;border-top:3px solid var(--c)}
.mr-sw-ext{border-top-style:dashed}
.mr-sw-band{height:10px;border:0;background:color-mix(in srgb,var(--bio-h) 16%,var(--sheet));outline:1px solid var(--rule)}
.mr-pulse{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.mr-pulse input{flex:1 1 140px;accent-color:var(--ink);min-height:32px}
.mr-pulse output{font-weight:700;font-variant-numeric:tabular-nums;min-width:3em}
.mr-slots{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:6px}
.mr-slots li{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.mr-sl{font-size:.9rem}
.mr-slot{min-width:64px;min-height:40px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-weight:700;font-size:1.05rem}
.mr-slot-e{border-style:dashed;color:var(--ink-2);font-size:.85rem;font-weight:400}
.mr-note{margin-top:10px;color:var(--ink-2)}
.mr-read .mr-fbrow dd{font-weight:400}
.mr-more{display:none}
@media (max-width:600px){
  .mr-read > .mr-x{display:none}
  .mr-read.mr-open > .mr-x{display:flex}
  .mr-more{display:inline-flex;margin-top:6px}
}

/* chain diagram (SVG) */
.mr-t,.mr-bn{font:700 12px var(--font-ui);fill:var(--ink)}
.mr-bv{font:400 10.5px var(--font-ui);fill:var(--ink);font-variant-numeric:tabular-nums}
.mr-bs{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.mr-muted{font-style:italic}
.mr-lab{font:700 11.5px var(--font-ui)}
.mr-state{font:italic 700 12px var(--font-ui);fill:var(--ink)}
.mr-box{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.mr-body{stroke:var(--ink-2)}
.mr-glow{stroke:none}
.mr-testes{fill:var(--mr-sheet2);stroke:var(--ink-2);stroke-width:1.3}
.mr-tub{fill:var(--sheet);stroke:var(--ink-2);stroke-width:5}
.mr-lumen{fill:var(--mr-sheet2);stroke:none}
.mr-base{fill:none;stroke-width:2;opacity:.45}
.mr-hd{stroke:none}
.mr-flow{fill:none;stroke-width:6;stroke-linecap:round}
.mr-run{animation:mr-flow linear infinite}
@keyframes mr-flow{to{stroke-dashoffset:calc(-1px * var(--per))}}
.mr-brk{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mr-brk-t{stroke:var(--bio-atp)}
.mr-brk-i{stroke:var(--bio-fadh)}
.mr-head.mr-brk{stroke:none}
.mr-brk-t.mr-fillh{fill:var(--bio-atp)}
.mr-brk-i.mr-fillh{fill:var(--bio-fadh)}
.mr-empty{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.mr-extl{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4}
.mr-ext{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4}
.mr-dotj{fill:var(--ink)}
.mr-badge{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.mr-badge-e{stroke:var(--ink-2);stroke-dasharray:3 3}
.mr-badget{font:700 13px var(--font-ui);fill:var(--ink)}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .mr-brk-t,:root:not([data-theme="light"]) .mr-brk-i{stroke:var(--ink)}
  :root:not([data-theme="light"]) .mr-brk-t.mr-fillh,:root:not([data-theme="light"]) .mr-brk-i.mr-fillh{fill:var(--ink)}
}
:root[data-theme="dark"] .mr-brk-t,:root[data-theme="dark"] .mr-brk-i{stroke:var(--ink)}
:root[data-theme="dark"] .mr-brk-t.mr-fillh,:root[data-theme="dark"] .mr-brk-i.mr-fillh{fill:var(--ink)}

/* strip chart and lake chart */
.mr-cband{fill:color-mix(in srgb,var(--green) 12%,var(--sheet))}
.mr-cgrid{stroke:var(--rule);stroke-width:1}
.mr-caxis{stroke:var(--ink-2);stroke-width:1.3}
.mr-cs{font:400 10px var(--font-ui);fill:var(--ink-2)}
.mr-off{font-weight:700;fill:var(--ink)}
.mr-cl{fill:none;stroke-width:2.4;stroke-linejoin:round}
.mr-cl-ext{stroke-dasharray:6 4}
.mr-ccur{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 3}
.mr-eband{fill:color-mix(in srgb,var(--bio-h) 12%,var(--sheet))}
.mr-ycur{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3}
.mr-ltr{fill:none;stroke:var(--pen);stroke-width:2.6}
.mr-lref{fill:none;stroke:var(--ink-2);stroke-width:2.2;stroke-dasharray:6 4}
.mr-ptr{fill:var(--pen);stroke:var(--sheet);stroke-width:1.2}
.mr-pref{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.mr-pon{stroke:var(--ink);stroke-width:2}

/* Part 3 */
.mr-p3{display:grid;gap:18px}
.mr-st h3{margin:0 0 6px}
.mr-zstage{max-width:520px}
.mr-cell{fill:var(--mr-sheet2);stroke:var(--ink-2);stroke-width:1.5}
.mr-nuc{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:5 3}
.mr-dna{stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.mr-gene{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.mr-rec{fill:color-mix(in srgb,var(--ink-2) 30%,var(--sheet));stroke:var(--ink);stroke-width:1.4}
.mr-est{fill:var(--bio-h)}
.mr-esty{stroke:var(--bio-h);stroke-width:2.2;stroke-linecap:round}
.mr-vtg{fill:var(--bio-carbon)}
.mr-tokt{font:700 9.5px var(--font-ui);fill:var(--sheet)}
.mr-zres{min-height:1.4em;font-weight:700}
.mr-panel{border-left:4px solid var(--bio-h);padding:6px 10px;background:var(--mr-sheet2);border-radius:0 6px 6px 0}
.mr-yread{min-height:2.8em}
.mr-ltab{border-collapse:collapse;font-variant-numeric:tabular-nums}
.mr-ltab th,.mr-ltab td{padding:4px 10px;border-bottom:1px solid var(--rule);text-align:center}
.mr-ltab tr.mr-on{background:var(--hi-soft)}
.mr-flowd{list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0;margin:6px 0 10px}
.mr-flowd li{border:1.5px solid var(--ink-2);border-radius:8px;padding:.25em .6em;font-size:.9rem;background:var(--sheet)}
.mr-flowd li + li::before{content:"→";margin:0 8px 0 -2px;color:var(--ink-2);font-weight:700}
.mr-rlist{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.mr-rcard{display:flex;align-items:center;gap:10px;border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--sheet)}
.mr-rok{border-color:var(--green)}
.mr-rn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sheet);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.mr-rt{flex:1 1 auto;min-width:0}
.mr-rwhy{display:block;font-size:.88rem;color:var(--ink-2);margin-top:3px}
.mr-rbtns{display:flex;gap:4px;flex:0 0 auto}
.mr-rbtns .btn{min-width:40px;min-height:40px;padding:0}
.mr-stse{margin-top:10px}

/* Practice 2: chip grid */
.mr-gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0}
.mr-grid{border-collapse:collapse;min-width:440px}
.mr-grid th{text-align:left;font-weight:700;padding:6px 12px 6px 0;font-size:.92rem;white-space:nowrap}
.mr-grid td{padding:4px 0}
.mr-grid tr + tr th,.mr-grid tr + tr td{border-top:1px solid var(--rule)}
.mr-bchips,.mr-gchips{display:inline-flex;flex-wrap:wrap;gap:6px}
.mr-bchips .chip{min-width:52px;min-height:40px}
.mr-bchips .chip.mr-cok{border-color:var(--green)}

/* task */
.mr-tlist{margin:6px 0 10px;padding-left:1.3em}
.mr-tin{display:grid;gap:12px;margin:10px 0}
.mr-gchips .chip{min-height:40px}
.mr-tpv h4{margin:0 0 6px}
.mr-tpv .mr-zstage + .mr-zstage{margin-top:10px}
.mr-tank{stroke:var(--ink-2);stroke-width:1.3}
.mr-fm{fill:var(--ink)}
.mr-ff{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.mr-bar{fill:var(--bio-carbon)}
.mr-bar2{fill:var(--ink-2)}

@media (prefers-reduced-motion:reduce){
  .mr-run{animation:none}
  .mr-swk::after{transition:none}
}

opic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"31bb8969","content":{"id":"38-male-reproductive-hormones","kind":"topic","title":"Male reproductive hormones","topic":"Male Reproductive Hormones","readyTopic":"male reproductive hormones","hero":{"eq":"\u003cspan class=\"mr-heq\">\u003cspan class=\"mr-c-g\">GnRH\u003c/span> → \u003cspan class=\"mr-c-lh\">LH\u003c/span>, \u003cspan class=\"mr-c-fsh\">FSH\u003c/span> → \u003cspan class=\"mr-c-t\">testosterone\u003c/span>, \u003cspan class=\"mr-c-i\">inhibin\u003c/span> ⊣\u003c/span>","eqLabel":"GnRH leads to LH and FSH, which lead to testosterone and inhibin, which brake the chain","eqSize":"sm","headline":"The bottom of the chain controls the top","text":"Testosterone isn’t made on demand by the testes alone. The \u003cstrong>hypothalamus\u003c/strong> and \u003cstrong>anterior pituitary\u003c/strong> set the pace with \u003cstrong>GnRH\u003c/strong>, \u003cstrong>LH\u003c/strong> and \u003cstrong>FSH\u003c/strong>, and the testes report back. When testosterone and \u003cstrong>inhibin\u003c/strong> rise, the brain eases off: \u003cstrong>negative feedback\u003c/strong> keeps the whole chain steady.","fig":{"html":"\u003cdiv class=\"mr-hero\" id=\"mr-hero\" role=\"img\" aria-label=\"A vertical chain of boxes. GnRH dots drip from the hypothalamus to the anterior pituitary. The pituitary releases violet LH dots to the interstitial cells and teal FSH dots to the Sertoli cells in the testes. The interstitial cells glow and release orange testosterone dots. As testosterone rises, curved brake arrows back to the hypothalamus and pituitary light up, the GnRH drip slows, and the levels settle into a steady state.\">\u003c/div>"}},"goals":["I can trace the chain GnRH → LH and FSH → testosterone and inhibin, naming where each hormone is made and what it acts on.","I can explain how negative feedback from testosterone and inhibin keeps the hormone levels steady.","I can predict how the whole chain changes when one part fails or when an external hormone is added.","I can explain why anabolic steroids reduce the body’s own testosterone and sperm production.","I can evaluate evidence that hormone-like chemicals in the environment affect animals."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Feedback loops","goal":2,"prompt":"In negative feedback, what does a rise in the controlled variable cause?","options":[{"t":"A response that pushes the variable higher","why":"That’s positive feedback, as in childbirth.","_n":"0190","_k":"fad3aa47"},{"t":"A permanent new set point","why":"The set point stays; the response returns the variable to it.","_n":"1180","_k":"393e7ddb"},{"t":"No response until the variable doubles","why":"Receptors respond within the normal range.","_n":"2170","_k":"1f63b85f"},{"t":"A response that brings the variable back down","why":"Negative feedback opposes the change.","_n":"31e0","_k":"169550db"}],"hints":["Negative means ‘opposite’.","Opposite to the change that happened.","A rise leads to a fall."]},{"id":"w2","skill":"Feedback loops","goal":2,"prompt":"Body temperature rises during exercise and sweating begins. In this loop, sweat glands are the…","options":[{"t":"receptor","why":"Receptors detect the change: here, temperature sensors.","_n":"41d0","_k":"20e5cf06"},{"t":"stimulus","why":"The stimulus is the rise in temperature.","_n":"51c0","_k":"cb9427e4"},{"t":"effector","why":"They carry out the response.","_n":"61b0","_k":"222d78e1"},{"t":"control centre","why":"The hypothalamus is the control centre.","_n":"7220","_k":"073100da"}],"hints":["Which part does something to fix the change?","Sweating cools the body.","Effector."]},{"id":"w3","skill":"Hypothalamus–pituitary axis","goal":1,"prompt":"In module 37, TRH from the hypothalamus acted on the anterior pituitary, which released TSH. What did TSH act on?","options":[{"t":"Every cell, directly raising metabolism","why":"That’s what T₃ and T₄ do.","_n":"8210","_k":"1440298a"},{"t":"The posterior pituitary","why":"TSH comes from the anterior pituitary and acts on the thyroid.","_n":"9e9f","_k":"635eb6ec"},{"t":"The hypothalamus","why":"The hypothalamus starts the chain.","_n":"aeaf","_k":"996ccd7c"},{"t":"The thyroid gland","why":"TSH stimulates the thyroid to release T₃ and T₄.","_n":"be7f","_k":"73003632"}],"hints":["The ‘T’ in TSH stands for…","Thyroid-stimulating hormone.","The thyroid."]},{"id":"w4","skill":"Hypothalamus–pituitary axis","goal":2,"prompt":"When T₃ and T₄ are high, what happens to TSH?","options":[{"t":"It rises to push T₃ and T₄ higher","why":"That would make levels climb without limit.","_n":"ce8f","_k":"14352baf"},{"t":"It falls, because the thyroid stops absorbing TSH","why":"The pituitary releases less TSH; the thyroid doesn’t control it.","_n":"de5f","_k":"13b48225"},{"t":"It stays the same; feedback acts only on the thyroid","why":"The brake acts on the levels above.","_n":"ee6f","_k":"47f7a80b"},{"t":"It falls, because T₃ and T₄ inhibit the hypothalamus and pituitary","why":"Negative feedback from the end product.","_n":"fe3f","_k":"0f574482"}],"hints":["Which way does negative feedback push?","T₃ and T₄ act on the hypothalamus and pituitary.","TSH falls."]},{"id":"w5","skill":"Hormone basics","goal":1,"prompt":"How does a hormone reach its target cells?","options":[{"t":"It travels in the blood and acts only on cells with matching receptors","why":"Receptors decide which cells respond.","_n":"ge4f","_k":"2e3a0acc"},{"t":"It travels along nerves to its target","why":"Nerves use action potentials and synapses.","_n":"hf1f","_k":"e42bbe44"},{"t":"It acts on every cell in the body equally","why":"Only cells with receptors respond.","_n":"if2f","_k":"4f586a9a"},{"t":"It is pumped directly into the target cells","why":"Hormones are released into the blood, not pumped into cells.","_n":"je3f","_k":"0c6ef2b9"}],"hints":["Endocrine glands have no ducts.","They release hormones into the blood.","Receptors pick the targets."]},{"id":"w6","skill":"Hormone basics","goal":3,"prompt":"A gland is removed. What happens to the hormone it made?","options":[{"t":"Its level falls, because nothing else makes it","why":"No source, no hormone.","_n":"ke2f","_k":"e31f500a"},{"t":"Its level rises, because feedback calls for more","why":"Feedback can call for more, but with no gland nothing answers.","_n":"le1f","_k":"aec4e9d9"},{"t":"It turns into a different hormone","why":"Hormones don’t change identity.","_n":"me0f","_k":"a3b7bc35"},{"t":"Nothing changes; other glands take over at once","why":"Each hormone has its own source.","_n":"ne7f","_k":"c4b462c9"}],"hints":["Where does the hormone come from?","That source is gone.","The level falls."]}],"refreshers":{"Feedback loops":"Stimulus → receptor → control centre → effector → response. Negative feedback reverses a change; positive feedback amplifies it.","Hypothalamus–pituitary axis":"Hypothalamus → releasing hormone → anterior pituitary → stimulating hormone → gland → final hormone, which feeds back to damp the first two.","Hormone basics":"Hormones travel in the blood and act on cells that carry the matching receptor."}}},"explore":{"heading":"Testosterone feedback loop","intro":"Change one part of the chain and watch every hormone respond. Look for the brake arrows: they explain most of what you’ll see.","modes":[["adult","Adult"],["puberty","Puberty"],["steroid","External steroid"],["faults","Faults"],["wire","Wire it"]],"modeHelp":{"adult":"Adult: a healthy steady state. Switch inhibin off to see what it brakes.","puberty":"Puberty: set how strongly the hypothalamus pulses GnRH.","steroid":"External steroid: add an anabolic steroid (a synthetic androgen) at a chosen dose.","faults":"Faults: make one gland fail and read the blood test.","wire":"Wire it: set each arrow to + (stimulates), − (inhibits) or empty, then press Run 30 days."},"doses":[["0","None"],["1","Low"],["2","Moderate"],["3","High"]],"faults":[["none","None"],["hyp","Hypothalamus makes little GnRH"],["pit","Pituitary makes little LH and FSH"],["tes","Testes don’t respond to LH and FSH"]],"inhibinLabel":"Sertoli cells make inhibin","pulseLabel":"GnRH pulse level","table":{"adult":[50,50,50,50,0,50,50,100,100],"adultOff":[50,50,80,50,0,50,0,100,100],"st1":[30,30,30,30,40,70,30,60,85],"st2":[15,15,15,15,80,95,15,30,70],"st3":[5,5,5,5,120,125,5,10,60],"hyp":[10,10,10,10,0,10,10,10,70],"pit":[90,10,10,10,0,10,10,10,70],"tes":[90,90,90,10,0,10,10,10,70]},"feedback":{"adult":"Testosterone and inhibin are in the normal band, so the brakes hold GnRH, LH and FSH steady.","adultOff":"No inhibin: nothing brakes FSH, so it climbs to 80. Testosterone still keeps GnRH and LH in check.","st1":"Extra androgen tightens the brakes: GnRH, LH and FSH fall, so the testes make less of their own.","st2":"High androgen is braking the hypothalamus and pituitary: GnRH, LH and FSH are low.","st3":"Very high androgen clamps the brakes on: GnRH, LH and FSH are almost shut off, and the testes shrink.","hyp":"The hypothalamus makes little GnRH, so the pituitary and the testes get almost no signal: everything is low.","pit":"Testosterone is low, so the brakes are off and GnRH is high, but the pituitary can’t answer: LH and FSH stay low.","tes":"Low testosterone and inhibin release the brakes: the pituitary pours out LH and FSH, but the testes can’t answer.","pub0":"No GnRH pulses yet: the chain below is quiet.","pub":"GnRH pulses at {p}%: each gland responds to the one above it, so every level follows GnRH.","wireIdle":"Set the six arrows, then press Run 30 days.","wireEdit":"You changed the wiring. Press Run 30 days to test it."},"body":[[10,"none"],[20,"beginning"],[40,"developing"],[50,"adult"]],"slots":[{"id":"s1","from":"GnRH","to":"anterior pituitary","fwd":true},{"id":"s2","from":"LH","to":"interstitial cells","fwd":true},{"id":"s3","from":"FSH","to":"Sertoli cells","fwd":true},{"id":"s4","from":"Testosterone","to":"hypothalamus"},{"id":"s5","from":"Testosterone","to":"anterior pituitary"},{"id":"s6","from":"Inhibin","to":"anterior pituitary"}],"wireMsg":{"ok":"Testosterone stays in the normal band for all 30 days: three forward arrows stimulate, three return arrows brake.","fwdNeg":"A releasing hormone stimulates the next gland.","fwdEmpty":"An empty forward arrow breaks the chain: the next gland gets no signal, so the hormones below it fall.","posT":"Positive feedback: testosterone keeps climbing with no brake.","posI":"Positive feedback: inhibin pushes FSH higher and higher.","noT":"Nothing brakes testosterone: GnRH, LH and testosterone climb above the normal band.","oneT":"One brake isn’t enough here: testosterone drifts above the band. Testosterone brakes both the hypothalamus and the pituitary.","noI":"FSH drifts high. What brakes FSH?"},"readout":["GnRH","LH / FSH","Testosterone from the testes","Total androgen activity","Inhibin","Sperm production","Testis size","Body changes","Feedback now"],"modelNote":"Model values in arbitrary units (AU); the normal band is 40–60 AU for every hormone, and the same settings always give the same numbers. In reality, testosterone also brakes FSH somewhat, and inhibin isn’t the only brake on FSH. This simulator uses the textbook model.","aha":"The testes respond to the pituitary, and the pituitary responds to the testes; adding hormone from outside turns the body’s own production \u003cstrong>down\u003c/strong>.","predIntro":"Make a prediction first. Then the loop will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"adult","inh":true},"to":{"mode":"steroid","dose":3},"prompt":"\u003cspan class=\"muted\">Start: Adult. Change: External steroid → High.\u003c/span> What happens to LH?","reveal":"The violet LH dots thin out: LH drops from 50 to 5.","options":[{"t":"It rises, then the testes shrink","_n":"oe6f","_k":"9e60f7b5"},{"t":"It stays the same","_n":"pe5f","_k":"a31347f9"},{"t":"It falls","_n":"qe4f","_k":"7349659a"},{"t":"It rises","_n":"rebf","_k":"601dfa54"}],"explain":"Total androgen jumps to 125, so the brakes on the hypothalamus and pituitary tighten."},{"id":"p2","start":{"mode":"adult","inh":true},"to":{"mode":"adult","inh":false},"prompt":"\u003cspan class=\"muted\">Start: Adult. Change: switch inhibin off.\u003c/span> Which hormone changes most?","reveal":"FSH climbs to 80; the others hold.","options":[{"t":"Testosterone","_n":"seaf","_k":"5894e65a"},{"t":"FSH","_n":"tddf","_k":"eb7f8e20"},{"t":"GnRH","_n":"udef","_k":"3749ba3b"},{"t":"LH","_n":"vdff","_k":"5e2f16c3"}],"explain":"Inhibin brakes FSH at the anterior pituitary. Without it, FSH rises, while testosterone still keeps LH in check."},{"id":"p3","start":{"mode":"puberty","pulse":0},"to":{"mode":"puberty","pulse":100},"ramp":true,"prompt":"\u003cspan class=\"muted\">Start: Puberty at 0%. Change: the pulse level rises to 100% over 6 seconds.\u003c/span> In what order do the levels rise?","reveal":"The dots light up level by level down the chain.","options":[{"t":"Testosterone first, then LH","_n":"we0f","_k":"027dc47b"},{"t":"GnRH, then LH and FSH, then testosterone","_n":"xe1f","_k":"68c41982"},{"t":"LH and FSH first, then GnRH","_n":"ye2f","_k":"fe4c6613"},{"t":"All at the same moment","_n":"ze3f","_k":"0186ea69"}],"explain":"Each gland responds to the one above it."},{"id":"p4","start":{"mode":"faults","fault":"none"},"to":{"mode":"faults","fault":"tes"},"prompt":"\u003cspan class=\"muted\">Start: Faults → None. Change: Faults → “Testes don’t respond”.\u003c/span> What happens to LH?","reveal":"Testosterone falls to 10, the brakes go slack, and LH climbs to 90.","options":[{"t":"It drops to zero","_n":"10e4f","_k":"78ea0a05"},{"t":"It rises well above normal","_n":"11e5f","_k":"7beffbde"},{"t":"It stays normal","_n":"12e6f","_k":"500e76c9"},{"t":"It falls","_n":"13e80","_k":"0d014544"}],"explain":"Low testosterone releases the brake, so the pituitary pours out LH, but the testes can’t answer."}],"chalIntro":"Use the loop to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"External steroid mode: choose the lowest dose that cuts sperm production to 30% of normal or less.","why":"Moderate is the lowest dose that does it: total androgen 95 brakes LH and FSH to 15, and sperm production falls to 30%.","wrong":{"mode":"Switch the mode to \u003cstrong>External steroid\u003c/strong> first.","none":"With no steroid, sperm production is 100%.","low":"Sperm production is still 60%.","high":"That works, but it isn’t the lowest dose."},"hints":["Watch the sperm production row.","Each step up cuts LH and FSH further.","Moderate gives 30%."]},{"id":"tc2","goal":2,"prompt":"Wire it mode: wire the six arrows so the loop holds testosterone in the normal band for 30 days.","why":"GnRH, LH and FSH each stimulate (+) the next level; testosterone brakes (−) the hypothalamus and the pituitary, and inhibin brakes (−) the pituitary.","wrong":{"mode":"Switch the mode to \u003cstrong>Wire it\u003c/strong> first."},"hints":["Forward arrows (down the chain) stimulate.","Return arrows (from the testes up) inhibit.","Three +, three −."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Faults mode. A patient’s blood test shows LH 90, FSH 90 and testosterone 10. Set the fault that matches.","why":"The testes aren’t answering: low testosterone and inhibin take the brakes off, so LH and FSH climb to 90.","wrong":{"mode":"Switch the mode to \u003cstrong>Faults\u003c/strong> first.","pit":"That gives LH 10. The pituitary here is working overtime.","hyp":"Everything is low in that case.","none":"Testosterone would be 50."},"hints":["Is the pituitary making too little or too much?","LH is high, so the pituitary is working; testosterone is still low.","The testes aren’t answering the signal."]}]},"part3":{"slug":"environment","name":"Environment","heading":"Hormones in the environment","intro":"The body’s own loop isn’t the only place hormones act. Hormone-like chemicals from human activity reach rivers and lakes, and fish carry the same kind of receptors. Work through the three stations, then answer the quick check.","s1":{"title":"Station 1: why fish respond","panel":"Zoom to the molecules","how":"Choose a molecule and send it to the estrogen receptor in a fish liver cell.","mols":[["nat","Natural estrogen"],["syn","Synthetic estrogen (ethinylestradiol)"]],"send":"Send it to the receptor","reset":"Reset","result":{"nat":"Natural estrogen fits the receptor. The bound receptor switches on the vitellogenin gene, and the cell makes vitellogenin.","syn":"Ethinylestradiol, the synthetic estrogen from birth control pills, fits the receptor just as well. The vitellogenin gene switches on."},"text":"\u003cstrong>Vitellogenin\u003c/strong> is an egg-yolk protein that only females normally make.","panelText":"A male fish making vitellogenin is a sign it has been exposed to estrogen-like chemicals."},"s2":{"title":"Station 2: the whole-lake experiment","panel":"Check it with data","setting":"The setting: the \u003cstrong>Experimental Lakes Area\u003c/strong>, in northwestern Ontario. Scientists added synthetic estrogen at a few nanograms per litre to one lake for three summers; a nearby \u003cstrong>reference lake\u003c/strong> received none.","how":"Move through the years to read both lakes.","years":[1,2,3,4,5,6,7],"added":[false,false,true,true,true,false,false],"treated":[100,105,95,40,5,10,60],"reference":[100,98,102,97,101,99,103],"notes":["Before the additions: both lakes are similar.","Before the additions: both lakes are similar.","Male minnows begin making vitellogenin.","Few young fish survive to breed.","Few young fish survive to breed: the index is near zero.","The additions have stopped. The population starts to recover.","The population has recovered much of the way."],"head":["Year","Estrogen added?","Treated lake","Reference lake"],"model":"Model data based on the published pattern.","yLabel":"Fathead minnow population index"},"s3":{"title":"Station 3: from the pill to the lake","flow":["Medication","Body","Wastewater","Treatment plant (partial removal)","River or lake"],"how":"Rank the three actions by how much estrogen-like chemical they keep out of the water: the one that removes the most goes first. Use the arrows to move a card, then press Check ranking.","cards":[{"id":"adv","t":"Advanced wastewater treatment","why":"It removes much of the hormone that passes through people’s bodies, which is most of what reaches the water."},{"id":"take","t":"Returning unused medicines to a pharmacy take-back program","why":"It keeps unused pills out of the water, but it can’t remove the hormone that people taking the medicine excrete."},{"id":"flush","t":"Flushing unused pills","why":"This adds to the problem: flushed pills go straight into wastewater."}],"_a":"aBMDBk4bGhtHUAkHGhUUX19EEQoaZA==","wrong":"Not quite. Ask which action deals with the most hormone, and whether any action adds hormone instead of removing it.","stse":"Canada listed \u003cstrong>bisphenol A\u003c/strong>, a plastic chemical that can mimic estrogen, as toxic and banned it in baby bottles (2010)."},"quickCheck":{"title":"Quick check","summary":"Hormones in the environment quick check","items":[{"id":"q1","goal":5,"prompt":"Why did male minnows make vitellogenin?","choices":[{"t":"Synthetic estrogen bound their estrogen receptors","fb":"Right. The synthetic hormone fits the same receptor as natural estrogen.","_n":"14e70","_k":"73ad9b27"},{"t":"The water got warmer","fb":"The synthetic hormone fits the same receptor as natural estrogen.","_n":"15ea0","_k":"70a9181f"},{"t":"They were female","fb":"The synthetic hormone fits the same receptor as natural estrogen.","_n":"16e90","_k":"a854523c"},{"t":"Testosterone rose","fb":"The synthetic hormone fits the same receptor as natural estrogen.","_n":"17e40","_k":"4caf419c"}]},{"id":"q2","goal":5,"prompt":"Why does the reference lake matter?","choices":[{"t":"It had more fish","fb":"It’s the control: same region and weather, no added estrogen.","_n":"18e30","_k":"28d69fdc"},{"t":"It was cleaner to swim in","fb":"It’s the control: same region and weather, no added estrogen.","_n":"19e60","_k":"a61c169c"},{"t":"It proves estrogen is safe","fb":"It’s the control: same region and weather, no added estrogen.","_n":"1ae50","_k":"ea24c197"},{"t":"It shows what happens without the estrogen, all else equal","fb":"Right. It’s the control: same region and weather, no added estrogen.","_n":"1bf00","_k":"b8665d13"}]},{"id":"q3","goal":5,"prompt":"The population fell mainly because…","choices":[{"t":"adults were poisoned at once","fb":"Reproduction failed; the adults weren’t killed outright.","_n":"1cef0","_k":"215addca"},{"t":"the lake dried up","fb":"Reproduction failed; the adults weren’t killed outright.","_n":"1de20","_k":"e53f3bc1"},{"t":"few young fish survived to breed","fb":"Right. Reproduction failed; the adults weren’t killed outright.","_n":"1ee30","_k":"017a0cca"},{"t":"predators moved in","fb":"Reproduction failed; the adults weren’t killed outright.","_n":"1fe00","_k":"8ae450c5"}]},{"id":"q4","goal":5,"prompt":"Which action adds estrogen-like chemicals to water?","choices":[{"t":"Advanced treatment","fb":"Flushed pills go straight into wastewater.","_n":"1ge10","_k":"d46c4069"},{"t":"Pharmacy take-back","fb":"Flushed pills go straight into wastewater.","_n":"1he60","_k":"b1e097e9"},{"t":"Fewer plastic bottles","fb":"Flushed pills go straight into wastewater.","_n":"1ie70","_k":"dddaeb6d"},{"t":"Flushing unused pills","fb":"Right. Flushed pills go straight into wastewater.","_n":"1je40","_k":"fd8455f2"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Hormone ↔ source ↔ job","summary":"Hormone ↔ source ↔ job","goal":[1,2],"instruction":"Match each hormone, gland or stage with its source or job.","leftTitle":"Hormone or part","rightTitle":"Source or job","left":[{"id":"l1","t":"GnRH"},{"id":"l2","t":"LH"},{"id":"l3","t":"FSH"},{"id":"l4","t":"Testosterone"},{"id":"l5","t":"Inhibin","hints":["Which cell type makes inhibin?","The one that FSH stimulates.","Sertoli cells; inhibin brakes FSH."]},{"id":"l6","t":"Anterior pituitary"},{"id":"l7","t":"Seminiferous tubules"},{"id":"l8","t":"Puberty"}],"right":[{"id":"r1","t":"Made by the hypothalamus; stimulates the anterior pituitary"},{"id":"r2","t":"Stimulates the interstitial cells to make testosterone"},{"id":"r3","t":"Stimulates the Sertoli cells to support sperm production"},{"id":"r4","t":"Made by the interstitial cells; brakes GnRH and LH"},{"id":"r5","t":"Made by the Sertoli cells; brakes FSH"},{"id":"r6","t":"Releases LH and FSH"},{"id":"r7","t":"Where sperm are made, lined by Sertoli cells"},{"id":"r8","t":"Begins when GnRH pulses increase"}],"_a":"SBMOUxoDFEsCE05AVAsUAxFDUEAUG1oKEQtAEAsbGhtfBUBYGksCGx8TDlcaAxRLBhNOQFQPFAMRQ1RAFBtaDhELQBAPGxobXwlAWBpLDhtO","wrong":{"l2|r3":"Swap them: LH → interstitial cells, FSH → Sertoli cells.","l3|r2":"Swap them: LH → interstitial cells, FSH → Sertoli cells.","l5|r4":"Inhibin’s main brake is on FSH.","l6|r1":"The hypothalamus makes GnRH; the pituitary responds."},"wrongDefault":"Follow the chain from the top: hypothalamus, pituitary, testes."},{"id":"blood","type":"custom","title":"Predict the blood test","summary":"Predict the blood test","star":true,"goal":[3,4],"instruction":"For each scenario, predict whether each hormone rises (↑), falls (↓) or doesn’t change. Scenarios 3 to 6 are non-routine; the last two go beyond the Final Check.","how":"Choose a chip in every row, then press Check. All four rows must be right.","rows":["GnRH","LH","FSH","Testosterone (from the testes)"],"chips":[["up","↑","rises"],["dn","↓","falls"],["same","no change","no change"]],"general":"Follow the brakes: work out what each gland now receives, from the top of the chain down.","items":[{"id":"s1","goal":4,"prompt":"Months of high-dose anabolic steroids","_a":"aBMGDBoVFF1dE05AXFcUFRFVDEBl","why":"The steroid brakes the hypothalamus and pituitary, so GnRH, LH and FSH fall, and the testes’ own testosterone falls with them.","wrong":[{"row":3,"pick":"up","fb":"The blood level of \u003cstrong>total\u003c/strong> androgen rises, but the testes’ own output falls."}]},{"id":"s2","goal":3,"prompt":"The Sertoli cells stop making inhibin","_a":"aBMRA1VcFBURQgMPXRsaG0ZBQE4aSldUVhM/","why":"Only FSH loses its brake; testosterone still holds GnRH and LH.","wrong":[{"row":1,"pick":"up","fb":"Inhibin brakes FSH, not LH."}]},{"id":"s3","goal":3,"star":true,"prompt":"Both testes are removed (for example, in cancer treatment)","_a":"aBMXEhoVFExDE05ATUkUFRFVDEBl","why":"No testosterone and no inhibin means no brakes: GnRH, LH and FSH climb, and testosterone from the testes falls.","wrong":[{"row":1,"pick":"dn","fb":"No testosterone and no inhibin means no brakes: LH and FSH climb."}],"hints":["What do the testes send back up the chain?","Testosterone and inhibin both disappear.","No brakes: GnRH, LH and FSH rise; testosterone falls."]},{"id":"s4","goal":[3,4],"star":true,"prompt":"A medicine blocks GnRH receptors on the pituitary","_a":"aBMRA1VcSkxDE05AXFcUFRFVDEAUG1JXEWw=","why":"The pituitary can’t hear GnRH, so LH and FSH fall and testosterone follows. GnRH itself stays the same or rises as the brake eases.","wrong":[{"row":3,"pick":"same","fb":"Without GnRH’s signal, LH falls, so the interstitial cells slow down."}]},{"id":"s5","goal":3,"star":true,"prompt":"A medicine blocks androgen receptors in the hypothalamus and pituitary only","_a":"aBMXEhoVFExDE05AS1hbXE9EEkAUG0NJEWw=","why":"The brain can’t sense testosterone, so it releases more GnRH and LH, and the testes make more testosterone.","wrong":[{"all":"dn","fb":"The brain can’t sense testosterone, so it acts as if testosterone were low."}],"hints":["What does the brain ‘see’ if it can’t detect testosterone?","Low testosterone means the brakes come off.","GnRH and LH rise, so the testes make more testosterone."]},{"id":"s6","goal":3,"star":true,"prompt":"Sertoli cells are damaged, but the interstitial cells are fine","_a":"aBMRA1VcFBURQgMPXRsaG0ZBQE4aSldUVhM/","why":"Less inhibin takes the brake off FSH; the LH–testosterone branch is untouched.","wrong":[{"row":3,"pick":"dn","fb":"The interstitial cells and LH are unaffected; only the FSH–inhibin branch changes."}]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Xavier","goal":[1,4,5],"how":"","instruction":"Xavier made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Explain why anabolic steroids can reduce sperm production.","steps":["Anabolic steroids raise androgen activity in the blood.","The hypothalamus and pituitary detect the high level.","Positive feedback makes them release more GnRH, LH and FSH.","So the testes make more sperm."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"Then sperm production would rise, but it falls.","_n":"1ke50","_k":"349454f1"},{"t":"Positive feedback makes them release more GnRH only.","why":"No: high androgen brakes the chain.","_n":"1lea0","_k":"1733e9aa"},{"t":"Negative feedback makes them release less GnRH, LH and FSH, so the testes get less stimulation and make fewer sperm.","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"1meb0","_k":"a8fba537"},{"t":"The steroids go straight to the Sertoli cells and switch them off.","why":"The main effect comes through the falling LH and FSH.","_n":"1n7c0","_k":"895f9aa4"}],"hints":["Is this a brake or an accelerator?","High androgen is the brake signal.","Less GnRH, LH and FSH."]},{"id":"e2","goal":1,"task":"Describe the start of puberty as a flow chart.","steps":["The hypothalamus releases more GnRH, in pulses.","GnRH travels to the posterior pituitary.","The pituitary releases LH and FSH into the blood.","LH makes the interstitial cells release testosterone."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is right in itself, but the gland in step 2 is wrong.","Step 4 is correct."],"fixes":[{"t":"GnRH travels to the anterior pituitary.","why":"LH and FSH come from the \u003cstrong>anterior\u003c/strong> pituitary. The posterior pituitary releases ADH and oxytocin.","_n":"1o7b0","_k":"714d6f6f"},{"t":"GnRH travels to the thyroid.","why":"That’s TRH’s chain.","_n":"1p7a0","_k":"13b831fc"},{"t":"Step 2 is correct.","why":"The posterior pituitary releases ADH and oxytocin.","_n":"1q790","_k":"8621413d"},{"t":"GnRH travels directly to the testes.","why":"GnRH acts on the pituitary.","_n":"1r780","_k":"9b91ac5b"}],"hints":["Which part of the pituitary makes LH and FSH?","The front part.","Anterior."]},{"id":"e3","goal":5,"task":"Interpret the lake data from Part 3.","steps":["In the treated lake, the minnow index fell from about 100 to 5.","In the reference lake, the index stayed near 100.","So the estrogen poisoned and killed the adult fish.","After the additions stopped, the population recovered."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"So the reference lake must have been polluted too.","why":"Its index stayed steady.","_n":"1s770","_k":"0eabc6bd"},{"t":"Because only the treated lake changed, the estrogen is the likely cause; the population fell because few young fish survived to breed.","why":"The reference lake rules out weather and region; the data show reproduction failing.","_n":"1t760","_k":"4f9eac4c"},{"t":"Step 3 is correct.","why":"The data show reproduction failing, not adults dying at once.","_n":"1u750","_k":"f102bea5"},{"t":"So the fish left the treated lake.","why":"There’s no evidence of fish moving.","_n":"1v740","_k":"5a126c8b"}],"hints":["What does the reference lake show?","Only the treated lake changed.","The cause is likely the estrogen; the mechanism is reproductive failure."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most in the feedback loop: the steroid result, or the testes-fault blood test?"},{"id":"j2","q":"In your own words, why does adding a hormone from outside the body turn the body’s own production down?"},{"id":"j3","q":"Explain to a friend how a doctor could use LH and testosterone levels to tell a pituitary problem from a testis problem."},{"id":"j4","q":"Which part of the chain do you still mix up? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which cells in the testes release testosterone?","options":[{"t":"Cells of the anterior pituitary","why":"The pituitary makes LH, not testosterone.","_n":"1w730","_k":"3db18085"},{"t":"Interstitial cells, stimulated by LH","why":"LH → interstitial cells → testosterone. FSH → Sertoli cells → sperm support and inhibin.","_n":"1x760","_k":"985fa5d0"},{"t":"Sertoli cells, stimulated by FSH","why":"Sertoli cells support sperm production and make inhibin.","_n":"1y770","_k":"c011498b"},{"t":"Sperm cells in the seminiferous tubules","why":"Sperm don’t make hormones.","_n":"1z780","_k":"926a87c3"}]},"b":{"prompt":"Which cells respond to FSH to support sperm production?","options":[{"t":"Red blood cells","why":"They have no FSH receptors.","_n":"20790","_k":"df813535"},{"t":"Sertoli cells","why":"LH → interstitial cells → testosterone. FSH → Sertoli cells → sperm support and inhibin.","_n":"21720","_k":"51f0ff44"},{"t":"Cells of the hypothalamus","why":"The hypothalamus makes GnRH.","_n":"22730","_k":"77a60781"},{"t":"Interstitial cells","why":"They respond to LH.","_n":"23740","_k":"1ad88b3f"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Where is GnRH made?","options":[{"t":"The posterior pituitary","why":"LH and FSH come from the \u003cstrong>anterior\u003c/strong> pituitary. The posterior pituitary releases ADH and oxytocin.","_n":"24750","_k":"fd84c70d"},{"t":"The testes","why":"The testes make testosterone and inhibin.","_n":"256e0","_k":"f25b01c3"},{"t":"The anterior pituitary","why":"The pituitary responds to GnRH.","_n":"266f0","_k":"f5f7b48f"},{"t":"The hypothalamus","why":"GnRH is the hypothalamus’s releasing hormone.","_n":"27601","_k":"b8bdd29c"}]},"b":{"prompt":"Which gland releases LH and FSH?","options":[{"t":"The anterior pituitary","why":"GnRH stimulates it to release both.","_n":"285f1","_k":"d201c1ac"},{"t":"The posterior pituitary","why":"It releases ADH and oxytocin.","_n":"29621","_k":"c99b6f9b"},{"t":"The adrenal gland","why":"Not part of this chain.","_n":"2a611","_k":"f94985f0"},{"t":"The hypothalamus","why":"It releases GnRH.","_n":"2b641","_k":"05054f36"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"What does inhibin do?","options":[{"t":"It reduces FSH release from the anterior pituitary","why":"Inhibin’s target is the anterior pituitary, and it damps \u003cstrong>FSH\u003c/strong> in particular.","_n":"2c631","_k":"161b1463"},{"t":"It reduces LH release only","why":"Inhibin’s target is the anterior pituitary, and it damps \u003cstrong>FSH\u003c/strong> in particular.","_n":"2d661","_k":"c5fee4aa"},{"t":"It stimulates GnRH release","why":"Inhibin is a brake, not an accelerator.","_n":"2e651","_k":"97717398"},{"t":"It stimulates testosterone release","why":"That’s LH’s job.","_n":"2f681","_k":"65cb3c1e"}]},"b":{"prompt":"Which hormone is the main negative-feedback signal that reduces LH?","options":[{"t":"GnRH","why":"GnRH stimulates LH.","_n":"2g671","_k":"35c18348"},{"t":"FSH","why":"FSH is a pituitary hormone, not the feedback signal.","_n":"2h7a1","_k":"1fcfbd62"},{"t":"Inhibin","why":"Inhibin mainly reduces FSH.","_n":"2i7b1","_k":"18fe81b4"},{"t":"Testosterone","why":"Testosterone brakes GnRH and LH.","_n":"2j781","_k":"ac50e5c2"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"An athlete takes high doses of an anabolic steroid for several months. Which set of changes is expected?","options":[{"t":"No change, because the steroid isn’t the body’s own testosterone","why":"The hypothalamus and pituitary respond to androgen activity from any source.","_n":"2k791","_k":"30a643bd"},{"t":"LH falls, the testes’ own testosterone falls, and sperm production falls","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"2l761","_k":"94a166b6"},{"t":"LH rises, testosterone from the testes rises, and sperm production rises","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"2m771","_k":"5b8753c1"},{"t":"LH falls but the testes’ own testosterone rises","why":"With less LH, the interstitial cells slow down.","_n":"2n741","_k":"c1804225"}]},"b":{"prompt":"A patient receives regular testosterone injections. Which set of changes is expected?","options":[{"t":"GnRH and FSH fall, and sperm production falls","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"2o751","_k":"63fb10da"},{"t":"GnRH and FSH rise, and sperm production rises","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"2p721","_k":"d2ec0be1"},{"t":"FSH rises because inhibin falls","why":"The steroid’s brake on GnRH outweighs that; FSH falls overall.","_n":"2q731","_k":"4f1c90b9"},{"t":"Only testosterone changes; the pituitary is unaffected","why":"The extra testosterone brakes the pituitary.","_n":"2r1fd","_k":"3905372a"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A blood test shows high LH, high FSH and low testosterone. Where is the problem most likely?","options":[{"t":"The hypothalamus is making too much GnRH","why":"Then testosterone would be high too.","_n":"2s20d","_k":"98c94fb8"},{"t":"The testes: they aren’t responding to LH and FSH","why":"Low testosterone with \u003cstrong>high\u003c/strong> LH means the pituitary is shouting and the testes aren’t answering.","_n":"2t1dd","_k":"5b901575"},{"t":"Anabolic steroid use","why":"Steroids lower LH and FSH.","_n":"2u1ed","_k":"946bb706"},{"t":"The pituitary isn’t making enough LH","why":"LH is high, so the pituitary is working.","_n":"2v23d","_k":"0ce83522"}]},"b":{"prompt":"A person who takes no medicines or supplements has low LH, low FSH and low testosterone, and GnRH is high. Where is the problem most likely?","options":[{"t":"The hypothalamus isn’t making GnRH","why":"GnRH is high.","_n":"2w24d","_k":"e8770840"},{"t":"The testes aren’t responding to LH","why":"Then LH would be high.","_n":"2x21d","_k":"309d758e"},{"t":"Too much inhibin","why":"Inhibin wouldn’t lower LH.","_n":"2y22d","_k":"5e27d808"},{"t":"The anterior pituitary: it isn’t responding to GnRH","why":"GnRH is high but LH and FSH are low, so the pituitary isn’t answering.","_n":"2z27d","_k":"388028dd"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A medicine blocks androgen receptors in the hypothalamus and pituitary only. What happens to LH and testosterone from the testes?","options":[{"t":"Both fall, because the drug is a brake","why":"It blocks the brake’s receptor.","_n":"3028d","_k":"67baba1c"},{"t":"Neither changes; the testes have their own receptors","why":"The receptors that matter for feedback are blocked.","_n":"31a5d","_k":"125985d5"},{"t":"LH rises but testosterone falls","why":"More LH stimulates the interstitial cells.","_n":"32a4d","_k":"8679fe6f"},{"t":"Both rise, because the brain senses too little testosterone","why":"The brake can’t be felt, so the chain speeds up.","_n":"33a7d","_k":"a7343466"}]},"b":{"prompt":"Chemotherapy damages the Sertoli cells but not the interstitial cells. What happens to FSH and testosterone?","options":[{"t":"FSH falls; testosterone rises","why":"Less inhibin means \u003cstrong>more\u003c/strong> FSH.","_n":"34a6d","_k":"523af517"},{"t":"Both rise","why":"LH and testosterone aren’t braked by inhibin.","_n":"35a1d","_k":"d0b43cf5"},{"t":"FSH rises; testosterone stays about the same","why":"Less inhibin takes the brake off FSH; the LH branch is unaffected.","_n":"36a0d","_k":"fe9a52bc"},{"t":"Both fall","why":"The interstitial cells are fine.","_n":"37a3d","_k":"ce2b9b31"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why long-term steroid use can shrink the testes?","options":[{"t":"“High androgen levels brake the hypothalamus and pituitary. LH and FSH fall, so the testes get little stimulation and their tissue shrinks.”","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"38a2d","_k":"825a5834"},{"t":"“Steroids are toxic to every organ, including the testes.”","why":"General toxicity isn’t the main mechanism here.","_n":"39add","_k":"f18cb32c"},{"t":"“The testes shrink because they make too much testosterone.”","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"3aacd","_k":"6b29a6e3"},{"t":"“Steroids replace the testes, so the body removes them.”","why":"The body doesn’t remove organs.","_n":"3b33d","_k":"4aea6c4a"}]},"b":{"prompt":"Which is the best explanation of why this hormone chain is called negative feedback?","options":[{"t":"“Because each gland stimulates the next one.”","why":"That’s the forward chain; feedback runs back up.","_n":"3c34d","_k":"6cbd804c"},{"t":"“A rise in testosterone or inhibin causes a fall in the signals above it, which brings the levels back toward normal.”","why":"The response opposes the change.","_n":"3d35d","_k":"bc8018f9"},{"t":"“Because testosterone has a negative effect on the body.”","why":"Negative describes the direction of the response.","_n":"3e36d","_k":"9d66f06c"},{"t":"“Because it makes the hormone levels negative.”","why":"The levels stay positive; the response opposes the change.","_n":"3f2fd","_k":"fe55d3e4"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which flow chart is correct?","options":[{"t":"Hypothalamus (GnRH) → anterior pituitary (LH) → interstitial cells (testosterone) ⊣ hypothalamus and pituitary","why":"GnRH first, then LH, then testosterone, which brakes the two levels above.","_n":"3g30d","_k":"bb97de1f"},{"t":"Hypothalamus (GnRH) → posterior pituitary (LH) → Sertoli cells (testosterone)","why":"LH and FSH come from the \u003cstrong>anterior\u003c/strong> pituitary. The posterior pituitary releases ADH and oxytocin. LH → interstitial cells → testosterone.","_n":"3h31d","_k":"71b436d6"},{"t":"Hypothalamus (LH) → anterior pituitary (GnRH) → testes (testosterone)","why":"GnRH comes first, from the hypothalamus.","_n":"3i32d","_k":"b866cc9c"},{"t":"Anterior pituitary (GnRH) → hypothalamus (LH) → testes","why":"The order is reversed.","_n":"3j2bd","_k":"5de5faf4"}]},"b":{"prompt":"Which flow chart is correct?","options":[{"t":"Hypothalamus (FSH) → anterior pituitary (GnRH) → Sertoli cells","why":"GnRH comes first.","_n":"3k2cd","_k":"7e413e00"},{"t":"Hypothalamus (GnRH) → anterior pituitary (FSH) → Sertoli cells (inhibin) ⊣ anterior pituitary","why":"FSH acts on the Sertoli cells, whose inhibin brakes the pituitary.","_n":"3l39d","_k":"6d7ca895"},{"t":"Anterior pituitary (inhibin) → Sertoli cells (FSH)","why":"Inhibin comes from the Sertoli cells.","_n":"3m38d","_k":"5376d712"},{"t":"Hypothalamus (GnRH) → anterior pituitary (FSH) → interstitial cells (inhibin)","why":"LH → interstitial cells → testosterone. FSH → Sertoli cells → sperm support and inhibin.","_n":"3n37d","_k":"7f379572"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Some prostate cancers grow faster with testosterone. One treatment is a medicine that blocks GnRH receptors on the pituitary. Why does it lower testosterone?","options":[{"t":"The pituitary releases less LH, so the interstitial cells make less testosterone","why":"Without GnRH’s signal, LH falls.","_n":"3o36d","_k":"df92e4cd"},{"t":"It doesn’t; it only lowers FSH","why":"Both LH and FSH depend on GnRH.","_n":"3p35d","_k":"24f024ba"},{"t":"It raises inhibin, which blocks testosterone","why":"Inhibin brakes FSH, not testosterone.","_n":"3q34d","_k":"983ccd6a"},{"t":"It destroys the interstitial cells directly","why":"It acts on the pituitary.","_n":"3r33d","_k":"43d92ffa"}]},"b":{"prompt":"Researchers have tested testosterone injections as a possible male contraceptive. Why could this lower sperm counts?","options":[{"t":"It wouldn’t: more testosterone always means more sperm","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"3s32d","_k":"7df34482"},{"t":"Extra testosterone directly kills sperm cells","why":"The effect works through the pituitary.","_n":"3t31d","_k":"08e61b52"},{"t":"It raises FSH, which stops sperm production","why":"FSH supports sperm production, and here it falls.","_n":"3u30d","_k":"31c917a2"},{"t":"Negative feedback lowers LH and FSH, so the testes get less signal to support sperm production","why":"High testosterone is the brake signal. GnRH and LH fall, so the testes make \u003cstrong>less\u003c/strong> of their own.","_n":"3va7d","_k":"e0e59d6b"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Male fish living downstream of a wastewater plant have vitellogenin in their blood; males upstream don’t. Which explanation fits best?","options":[{"t":"Downstream water is warmer, which makes all fish produce egg proteins","why":"Temperature doesn’t explain a female-specific protein in males.","_n":"3wa8d","_k":"d1e4ba62"},{"t":"Upstream fish are younger","why":"Age isn’t the variable that differs.","_n":"3xa5d","_k":"0439e6f0"},{"t":"The downstream fish are actually females","why":"They were identified as males.","_n":"3ya6d","_k":"a895b046"},{"t":"Estrogen-like chemicals in the wastewater bind the males’ estrogen receptors","why":"Hormone-like chemicals pass through wastewater into rivers and lakes, where fish respond to them too.","_n":"3za3d","_k":"d92ae713"}]},"b":{"prompt":"Researchers want to test whether a plant’s wastewater causes vitellogenin in male fish. Which design is best?","options":[{"t":"Catch any fish downstream and measure vitellogenin","why":"There’s no comparison group.","_n":"40a4d","_k":"acb9b174"},{"t":"Put one male fish in wastewater and one in clean water","why":"One fish per group can’t separate the effect from chance.","_n":"41a1d","_k":"c99b7bdc"},{"t":"Keep groups of male fish in tanks of clean water and of diluted wastewater, with several tanks per group, and measure vitellogenin after a few weeks","why":"It has a control, replication and the right measure.","_n":"42a2d","_k":"895cbeff"},{"t":"Measure the wastewater’s temperature","why":"That doesn’t test the fish’s response.","_n":"43afd","_k":"732eb91d"}]}}]},"task":{"title":"Is the effluent the cause?","summary":"Is the effluent the cause?","statement":"\u003cp>\u003cspan class=\"tag\">Investigation\u003c/span> Design an experiment to test whether a treatment plant’s wastewater (effluent) makes male fathead minnows produce vitellogenin. Meet every condition. Can you find more than one good design?\u003c/p>\u003col class=\"mr-tlist\">\u003cli>There is a clean-water control group.\u003c/li>\u003cli>There are at least two different effluent strengths, so you can see whether more effluent means a bigger effect.\u003c/li>\u003cli>Each group has at least 3 tanks.\u003c/li>\u003cli>Only male fish are used.\u003c/li>\u003cli>The measured variable is vitellogenin in the fish’s blood.\u003c/li>\u003cli>The exposure lasts long enough for the fish to make the protein (3 weeks).\u003c/li>\u003c/ol>","groups":[["clean","Clean water"],["e25","25% effluent"],["e50","50% effluent"],["e100","100% effluent"],["adv","Effluent after advanced treatment"]],"tanks":[1,2,3,4],"fish":[["male","Males only"],["mixed","Mixed sexes"]],"measures":[["vtg","Vitellogenin in blood"],["len","Body length"],["temp","Water temperature"]],"durations":[["day","1 day"],["wk3","3 weeks"]],"checks":["Control group","Two or more effluent strengths","Replication","Males only","Measures vitellogenin","Long enough"],"tips":["Without clean water, what would you compare against?","One strength shows an effect; two or more show whether it grows with dose.","One or two tanks can’t separate the effect from chance differences between tanks.","Females make vitellogenin normally, so they would hide the effect.","Body length won’t change in 3 weeks; vitellogenin is the sign of estrogen exposure.","A day is too short for the liver to make the protein."],"more":"There’s more than one good design. Can you find another?","after3":"Adding the ‘advanced treatment’ group asks a second question: does better treatment remove the effect?","explainPrompt":"Explain why your design can show that the effluent, and not something else, causes vitellogenin in male fish.","vocab":"Use the words control, independent variable, dependent variable and replication."},"cards":[["GnRH","Gonadotropin-releasing hormone, made by the hypothalamus; stimulates the anterior pituitary to release LH and FSH."],["LH (male)","Luteinizing hormone: stimulates the interstitial cells to make testosterone."],["FSH (male)","Follicle-stimulating hormone: stimulates the Sertoli cells to support sperm production."],["Interstitial cells","Cells between the seminiferous tubules that make testosterone."],["Sertoli cells","Cells lining the seminiferous tubules that nourish developing sperm and make inhibin."],["Inhibin","Made by the Sertoli cells; brakes FSH release by the anterior pituitary."],["Testosterone’s feedback","High testosterone brakes GnRH and LH (negative feedback)."],["Puberty","GnRH pulses increase → LH and FSH rise → testosterone rises → body changes and sperm production."],["Anabolic steroids","Synthetic androgens. They brake GnRH, LH and FSH, so the testes’ own testosterone and sperm production fall."],["High LH + low testosterone","The testes aren’t responding; the pituitary is working hard."],["Endocrine disruptor","A chemical that mimics or blocks a hormone, e.g. synthetic estrogen in water."],["Vitellogenin in male fish","A sign of exposure to estrogen-like chemicals."]]}};</script>
