.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 42: hero (balance scale + 24-hour storyboard), Blood glucose day (S11 timeline graph, S8 feedback view), Part 3 stations, task.
   Roles: glucose --ink (thick line, dots); insulin --pen (= --bio-o2, blue); glucagon --bio-atp (orange, dashed on graphs);
   target band --hi-soft; kidney limit --ink-2 dashed. ATP doesn't appear in this module, so orange is free for glucagon. */

/* radio groups (from SBI4U 07 / 06 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .85em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.45}

/* stepper (from SBI4U 19) and switch (from SBI4U 12) */
.ig-stp{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.ig-stb{min-width:40px;min-height:40px;border:0;background:var(--sheet);color:var(--ink);font-size:1.2rem;font-weight:700;padding:0}
.ig-stb:disabled{opacity:.4}
.ig-stp output{min-width:4.6em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:0 .4em;line-height:40px}
.ig-swb{display:inline-flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .7em;min-height:44px;font-size:.9rem;font-weight:700}
.ig-swk{flex:0 0 30px;height:16px;border-radius:8px;border:1.5px solid var(--ink-2);position:relative;background:var(--paper)}
.ig-swk::after{content:"";position:absolute;top:1.5px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);transition:left .15s}
.ig-swb[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ig-swb[aria-checked="true"] .ig-swk{background:var(--ink);border-color:var(--ink)}
.ig-swb[aria-checked="true"] .ig-swk::after{left:15px;background:var(--sheet)}
.ig-swst{font-size:.75rem;color:var(--ink-2)}
.ig-sws{display:flex;flex-wrap:wrap;gap:8px}
@media (prefers-reduced-motion:reduce){ .ig-swk::after{transition:none} }

/* hero */
.ig-heq{white-space:normal}
.ig-hins{color:var(--pen);font-weight:700}
.ig-hglu{color:var(--bio-atp);font-weight:700}
.ig-hero{width:100%;display:grid;gap:8px}
.ig-scale{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);align-items:end;gap:4px}
.ig-pan{font-size:.78rem;line-height:1.3;padding:6px 8px;border:1.5px solid var(--rule);border-top:3px solid var(--ink-2);border-radius:0 0 10px 10px;background:var(--sheet);color:var(--ink)}
.ig-panl{border-top-color:var(--pen)}
.ig-panr{border-top-color:var(--bio-atp)}
.ig-beam{width:100%;height:auto;display:block}
.ig-tl{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ig-hband,.ig-hband2{fill:var(--hi-soft)}
.ig-hband2{stroke:var(--ink-2);stroke-width:1}
.ig-ptr{stroke:var(--ink);stroke-width:2}
.ig-ptrh{fill:var(--ink)}
.ig-beamb{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.ig-fulc{fill:var(--ink-2)}
.ig-str{stroke:var(--ink-2);stroke-width:1.2}
.ig-hax{stroke:var(--ink-2);stroke-width:1.2}
path.ig-hglc{fill:none;stroke:var(--ink);stroke-width:3.2;stroke-linejoin:round}
path.ig-hins{fill:none;stroke:var(--pen);stroke-width:2.4;stroke-linejoin:round}
path.ig-hglu{fill:none;stroke:var(--bio-atp);stroke-width:2.4;stroke-dasharray:6 4;stroke-linejoin:round}
.ig-plate{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.ig-plate2{fill:none;stroke:var(--ink-2);stroke-width:1}

/* SVG text and shapes */
.ig-t{font:600 12px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.ig-ts{font-weight:400;font-size:10.5px;fill:var(--ink-2)}
.ig-tb{font-size:12px}
.ig-tin{fill:var(--pen)}
.ig-tgl{fill:var(--bio-atp)}
.ig-islet{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.4}
.ig-beta{fill:color-mix(in srgb,var(--pen) 22%,var(--sheet));stroke:var(--pen);stroke-width:1.6}
.ig-beta.dead{fill:var(--sheet);stroke:var(--ink-2);stroke-dasharray:2 2}
.ig-alpha{fill:color-mix(in srgb,var(--bio-atp) 22%,var(--sheet));stroke:var(--bio-atp);stroke-width:1.6}
.ig-x{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.ig-vessel{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.4}
.ig-glc{fill:var(--ink)}
.ig-box{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.ig-ains line{stroke:var(--pen);stroke-linecap:round}
.ig-ains path{fill:var(--pen)}
.ig-aglu line{stroke:var(--bio-atp);stroke-linecap:round;stroke-dasharray:5 3}
.ig-aglu path{fill:var(--bio-atp)}
.ig-aglc line{stroke:var(--ink);stroke-linecap:round}
.ig-aglc path{fill:var(--ink)}

/* explore layout */
.ig-pg [hidden]{display:none!important}
.ig-pg .pg-ctrl{display:grid;gap:12px}
.ig-panel{display:grid;gap:8px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.ig-ph{margin:0;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.ig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ig-sl{margin:0}
.ig-sl input{width:100%;accent-color:var(--ink)}
canvas.plot.ig-hcv{aspect-ratio:16/7;margin-top:8px}
.ig-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.ig-key span{display:inline-flex;align-items:center;gap:5px}
.ig-key i{display:inline-block;width:22px;height:0;border-top:3.4px solid var(--ink)}
.ig-key i.ig-ki{border-top:3px solid var(--pen)}
.ig-key i.ig-kc{border-top:3px dashed var(--bio-atp)}
.ig-key i.ig-kb{height:10px;border:0;background:var(--hi-soft)}
.ig-key i.ig-kk{border-top:2px dashed var(--ink-2)}
.ig-fv{margin-top:10px;width:100%;aspect-ratio:360 / 214;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);position:relative;overflow:hidden}
.ig-fv svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ig-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.ig-note{margin-top:10px}
.ig-warn{margin:0 0 10px;padding:8px 12px;border:1.5px solid var(--red);border-radius:8px;background:var(--bad-bg);font-size:.92rem}
.ig-low{color:var(--red)}

/* Part 3 */
.ig-p3{display:grid;gap:18px}
.ig-st h3{margin-top:0}
.ig-note2{margin:10px 0;padding:8px 12px;border-left:4px solid var(--rule);background:var(--info-bg);border-radius:4px}
canvas.plot.ig-pcv{max-width:520px;margin:8px 0}
.ig-q{margin:10px 0 6px;font-weight:700}
.ig-chips{display:flex;flex-wrap:wrap;gap:6px}
.ig-chips .chip{text-align:left}
.ig-mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ig-mcol{display:grid;gap:8px;align-content:start}
.ig-card{border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.5em .7em;text-align:left;font-size:.9rem;min-height:44px}
.ig-card[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.ig-card.done{border-color:var(--green);background:var(--good-bg);opacity:1}
.ig-dish{width:100%;max-width:520px;aspect-ratio:360 / 166;position:relative}
.ig-dish svg{position:absolute;inset:0;width:100%;height:100%;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ig-bar{fill:var(--pen)}
.ig-bar0{fill:var(--ink-2)}

/* practice */
.ig-rule{margin:0 0 12px;padding:8px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);font-size:.92rem}
.ig-unit{font-size:.92rem;color:var(--ink-2)}

/* task */
.ig-conds{margin:8px 0 0;padding-left:1.4em}
.ig-tin{display:grid;gap:10px;margin:12px 0}
.ig-tot{margin:8px 0}

@media (max-width:520px){
  .ig-scale{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}
  .ig-pan{font-size:.72rem;padding:5px 6px}
  .ig-mgrid{gap:8px}
  .ig-card{font-size:.84rem}
}

</style>

:"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"996e1bc5","content":{"id":"42-insulin-and-glucagon","kind":"topic","title":"Insulin and glucagon","topic":"Insulin and Glucagon","readyTopic":"insulin and glucagon","hero":{"eq":"\u003cspan class=\"ig-heq\">\u003cspan class=\"ig-hins\">insulin\u003c/span> lowers glucose \u003cspan aria-hidden=\"true\">⇄\u003c/span> \u003cspan class=\"ig-hglu\">glucagon\u003c/span> raises glucose\u003c/span>","eqLabel":"Insulin lowers glucose; glucagon raises glucose","eqSize":"sm","headline":"Two hormones, one target","text":"After a meal, blood glucose rises and the \u003cstrong>beta cells\u003c/strong> of the pancreas release \u003cstrong>insulin\u003c/strong>: cells take glucose in, and the liver stores it as \u003cstrong>glycogen\u003c/strong>. Hours later, as glucose dips, \u003cstrong>alpha cells\u003c/strong> release \u003cstrong>glucagon\u003c/strong>, and the liver sends glucose back out. Each hormone switches itself off by fixing the problem that started it: \u003cstrong>negative feedback\u003c/strong>.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later. All numbers in this module are model values for learning, not medical advice.","fig":{"html":"\u003cdiv class=\"ig-hero\" id=\"ig-hero\" role=\"img\" aria-label=\"A balance scale. Left pan: glucose high, beta cells, insulin, glucose into cells and stored as glycogen. Right pan: glucose low, alpha cells, glucagon, liver releases glucose. The pointer sits in the 4 to 7 millimoles per litre band. Below, a 24-hour timeline: a meal at 07:00 makes glucose rise, insulin follows it up, and glucose dots enter the liver and muscle; glucose returns to 5. At 02:00 glucose dips slightly, glucagon rises, glucose dots leave the liver, and glucose levels off at 5.\">\u003c/div>"}},"goals":["I can identify the cells that release insulin and glucagon, and what each hormone makes the liver, muscle and fat cells do.","I can explain blood glucose regulation as negative feedback, with meals, fasting and exercise as disturbances.","I can distinguish type 1 and type 2 diabetes using glucose and insulin data.","I can use the module’s model rule to predict how a meal, an insulin dose and exercise combine.","I can describe how insulin was discovered in Canada and how recombinant DNA technology produces it today."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Negative feedback","goal":2,"prompt":"In a negative feedback loop, the response…","options":[{"t":"makes the change larger.","why":"That’s positive feedback.","_n":"04fa","_k":"e3e071de"},{"t":"reverses the change that triggered it","why":"It brings the variable back toward the set point.","_n":"152a","_k":"5f5e8a9b"},{"t":"permanently moves the set point.","why":"The set point stays put.","_n":"251a","_k":"b5d69f50"},{"t":"has no effect on the stimulus.","why":"The response acts on the stimulus.","_n":"354a","_k":"9d00def0"}],"hints":["‘Negative’ means opposite.","Opposite to the change.","It reverses it."]},{"id":"w2","skill":"Negative feedback","goal":2,"prompt":"Two hormones have opposite effects on the same variable. They are called…","options":[{"t":"synergistic.","why":"Synergistic hormones work in the same direction.","_n":"453a","_k":"e2ba7e48"},{"t":"antagonistic","why":"Like a pair of brakes and accelerator pedals on one car.","_n":"556a","_k":"91df40f3"},{"t":"identical.","why":"Their effects are opposite.","_n":"655a","_k":"8f087cf8"},{"t":"inhibitory only.","why":"One raises, one lowers.","_n":"748a","_k":"7583643b"}],"hints":["They work against each other.","‘Anti-’ means against.","Antagonistic."]},{"id":"w3","skill":"Carbohydrates and storage","goal":1,"prompt":"How do animals store glucose for later use?","options":[{"t":"As glycogen, mainly in the liver and muscles","why":"A branched chain of glucose.","_n":"847a","_k":"2d3c2490"},{"t":"As glucagon.","why":"Glucagon is a hormone. Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","_n":"9299","_k":"710d58ba"},{"t":"As cellulose.","why":"Cellulose is a plant cell-wall material.","_n":"a2a9","_k":"894b3ffa"},{"t":"As starch in the liver.","why":"Starch is the plant storage form.","_n":"b2b9","_k":"e95db756"}],"hints":["Plants use starch; animals use…","It ends in ‘-gen’.","Glycogen."]},{"id":"w4","skill":"Carbohydrates and storage","goal":1,"prompt":"Breaking a polysaccharide into glucose units uses which type of reaction?","options":[{"t":"Hydrolysis","why":"Water is used to split the bonds.","_n":"c2c9","_k":"2ab084a5"},{"t":"Condensation.","why":"Condensation builds the polymer and releases water.","_n":"d2d9","_k":"8147fd96"},{"t":"Redox only.","why":"Splitting glycogen is hydrolysis.","_n":"e2e9","_k":"a125fd92"},{"t":"Neutralization.","why":"That’s acid + base.","_n":"f2f9","_k":"f8bd7816"}],"hints":["Hydro- means water; -lysis means splitting.","Water splits the bond.","Hydrolysis."]},{"id":"w5","skill":"Reading time graphs","goal":3,"prompt":"A graph shows glucose rising after 12:00 and peaking at 13:00. When should the insulin peak be, if insulin responds to glucose?","options":[{"t":"Around 13:00, as glucose peaks","why":"Insulin follows glucose.","_n":"g309","_k":"a36151c5"},{"t":"At 18:00.","why":"Too late; glucose is back to normal by then.","_n":"h219","_k":"0bed592b"},{"t":"At 11:00, before the meal.","why":"Insulin responds to the rise; it doesn’t predict it.","_n":"i229","_k":"1c533669"},{"t":"Insulin stays flat all day.","why":"It rises and falls with glucose.","_n":"j9b9","_k":"23333c4f"}],"hints":["What triggers insulin?","High glucose.","When glucose peaks."]},{"id":"w6","skill":"Reading time graphs","goal":4,"prompt":"A line starts at 5, rises by 3 and then falls by 3. Where does it end?","options":[{"t":"At 11.","why":"Rises and falls cancel.","_n":"k9a9","_k":"54082c1d"},{"t":"At 2.","why":"That forgets the rise.","_n":"l9d9","_k":"66777ecb"},{"t":"At 8.","why":"That forgets the fall.","_n":"m9c9","_k":"0aa05abd"},{"t":"At 5","why":"5 + 3 − 3.","_n":"n9f9","_k":"d0c1e564"}],"hints":["Start at 5.","Add 3, then subtract 3.","5."]}],"refreshers":{"Negative feedback":"The response opposes the change. Antagonistic hormones push the same variable in opposite directions.","Carbohydrates and storage":"Glucose is stored as glycogen in the liver and muscles. Building glycogen is condensation; breaking it down is hydrolysis.","Reading time graphs":"Read the cause first (a meal, exercise), then the responses that follow it in time."}}},"explore":{"heading":"Blood glucose day","intro":"Run a 24-hour day and watch glucose, insulin and glucagon. Then switch to diabetes modes and see what changes, and what insulin injections can do.","modelNote":"Model rules: glucose in mmol/L, hormones in arbitrary units (AU). Every value comes from fixed rules, so the same settings always give the same day. Model numbers for learning, not medical advice.","predIntro":"Make a prediction first. Then the day will play and show you what really happens.","predictions":[{"id":"p1","prompt":"Start: Normal, 07:00 (breakfast). Change: Play to 08:00. Which hormone rises over the next hour?","options":[{"t":"Insulin","_n":"o9e9","_k":"c0291c3a"},{"t":"Glucagon","_n":"pa19","_k":"576b0bee"},{"t":"Neither","_n":"qa09","_k":"352a4f82"},{"t":"Both equally","_n":"ra39","_k":"a1cdecb2"}],"explain":"Glucose 8.0; insulin 70; glucagon stays 10. High glucose stimulates the beta cells.","start":{"mode":"normal","i":2},"to":{"i":4}},{"id":"p2","prompt":"Start: Normal, 01:00. Change: Play to 04:00. No food for hours. What stops glucose from falling too low?","options":[{"t":"Insulin makes the liver release glucose","_n":"sa29","_k":"d983f4d6"},{"t":"Glucagon makes the liver release glucose from glycogen","_n":"tb59","_k":"b6f19da0"},{"t":"Nothing; glucose falls steadily","_n":"ub69","_k":"cb167089"},{"t":"Muscles release glucose into the blood","_n":"vb39","_k":"1c19d107"}],"explain":"Glucose holds at 4.8; glucagon 14; the liver arrow points out. Glucagon’s job is to raise glucose between meals. Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","start":{"mode":"normal","i":38},"to":{"i":44}},{"id":"p3","prompt":"Start: Type 1, untreated, 12:00. Change: Play to 14:00. What happens?","options":[{"t":"Glucose climbs to 14 mmol/L and appears in urine","_n":"wb49","_k":"2d14b1ce"},{"t":"Glucagon brings glucose down","_n":"xb19","_k":"01c5d3cb"},{"t":"The kidneys stop working","_n":"yb29","_k":"42ad49e9"},{"t":"Glucose returns to 5","_n":"zaf9","_k":"b2178c33"}],"explain":"Glucose 14.0; glucose in urine: yes. With no insulin, cells can’t take up glucose. Above about 10 mmol/L, the kidneys can’t reabsorb it all. The kidney is working; there’s simply more glucose than its carriers can reabsorb (above about 10 mmol/L).","start":{"mode":"t1u","i":12},"to":{"i":16}},{"id":"p4","prompt":"Start: Normal, 08:00. Change: switch to Type 2 at the same time. Compared with Normal, insulin is…","options":[{"t":"The same","_n":"10b09","_k":"3c1db1ab"},{"t":"Lower, which is why glucose is high","_n":"11ad9","_k":"cd7b913b"},{"t":"Higher, yet glucose is also higher","_n":"12ae9","_k":"75c81c3a"},{"t":"Zero","_n":"1327a","_k":"d30f529b"}],"explain":"Insulin is twice the normal formula (200 AU instead of 70), and glucose is 9.5. In insulin resistance, the pancreas makes plenty of insulin, but cells respond poorly. Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","start":{"mode":"normal","i":4},"to":{"mode":"t2"}}],"challenges":[{"id":"tc1","goal":[2,4],"prompt":"Normal mode: find the time after breakfast when insulin is highest.","why":"Glucose peaks 1 hour after the meal (8.0 mmol/L with a medium breakfast), and insulin follows it.","general":"Move the time to the moment insulin peaks after breakfast.","hints":["Insulin follows glucose.","When does glucose peak after a meal?","1 hour after: 08:00."]},{"id":"tc2","goal":[2,4],"prompt":"Type 1 with insulin, medium meals, no run: set the doses so glucose is 5.0 three hours after \u003cstrong>every\u003c/strong> meal.","why":"A medium meal adds 3, and each 2 units remove 1, so 6 units bring every meal back to 5.0.","general":"Each 2 units lower the 3-h value by 1.","hints":["Each 2 units lower the 3-h value by 1.","A medium meal adds 3.","3 × 2 = 6 units."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Type 1 with insulin: a run follows lunch. Choose the lunch dose so glucose is 5.0 three hours after lunch and never below 4.0.","why":"The meal adds 3 and the run removes 1, so the dose must remove 2: 4 units. Working muscles take up glucose on their own, so less insulin is needed.","general":"The meal adds 3; the run removes 1.","hints":["What does exercise do to glucose?","Muscles take glucose in during the run, lowering the 3-h value by 1.","The meal adds 3 and the run removes 1, so the dose must remove 2: 4 units."]}]},"part3":{"slug":"discovery","name":"Discovery","heading":"A Canadian discovery","intro":"The day simulator shows the loop. Here you use historical and lab data: how insulin was found in Toronto, how bacteria make it today, and how a dish experiment shows insulin at work.","panel":"Check it with data","s1":{"title":"Station 1: Toronto, 1921–22","how":"Put the events in order. Tap an event, then use Move up and Move down. Press Check when the order is right.","events":["Frederick Banting proposes isolating the pancreas’s internal secretion (1920).","Banting and Charles Best begin experiments in J. J. R. Macleod’s laboratory at the University of Toronto (1921).","James Collip purifies the extract so it is safe enough for people (winter 1921–22).","A teenage patient with diabetes is successfully treated at Toronto General Hospital (January 1922).","The Nobel Prize goes to Banting and Macleod (1923); Banting shares his award with Best, and Macleod shares his with Collip."],"start":[2,4,0,3,1],"orderWhy":"Proposal → first experiments → purification → first successful treatment → Nobel Prize.","patent":"The discoverers sold the patent to the University of Toronto for a token sum so insulin could be made widely.","dataNote":"Model data illustrating the reported result.","days":[{"d":0,"g":25,"u":"yes"},{"d":1,"g":15,"u":"yes"},{"d":2,"g":9,"u":"no"},{"d":3,"g":7,"u":"no"}],"tapPrompt":"Tap the first day glucose drops below the kidney limit (10 mmol/L). Then explain why the urine test changes then.","dayFb":["Day 0 is before treatment: 25 mmol/L is far above the kidney limit.","15 mmol/L is still above the kidney limit, so glucose still spills into the urine.","","Glucose is below the limit on day 3, but it first dropped below it a day earlier."],"dayRight":"Day 2: glucose 9 mmol/L is below the kidney limit, so the kidney’s carriers reabsorb all the filtered glucose and none is left in the urine. The kidney is working; there’s simply more glucose than its carriers can reabsorb (above about 10 mmol/L)."},"s2":{"title":"Station 2: from pancreases to bacteria","text":"\u003cul>\u003cli>Early insulin came from cow and pig pancreases.\u003c/li>\u003cli>Since the early 1980s, human insulin has been made by bacteria (or yeast) given the human insulin gene in a plasmid, cut and joined with restriction enzymes and ligase (module 33). It was the first medicine made by recombinant DNA.\u003c/li>\u003c/ul>","how":"Match each feature of recombinant insulin to what it makes possible. Tap a feature, then tap its result.","left":[{"id":"f1","t":"Same amino acid sequence as human insulin"},{"id":"f2","t":"Grown in large fermenters"},{"id":"f3","t":"Genetic code shared by bacteria and humans"}],"right":[{"id":"r2","t":"Reliable supply"},{"id":"r3","t":"Bacteria can read the human gene"},{"id":"r1","t":"Fewer immune reactions"}],"pairs":{"f1":"r1","f2":"r2","f3":"r3"},"pairWhy":{"f1":"The body recognizes it as its own hormone.","f2":"Big tanks of bacteria make insulin in large, steady amounts.","f3":"Bacteria make insulin only after the human gene is inserted; the genetic code is shared, so they read it."},"wrong":"Not quite. Ask what that feature makes possible.","wrongF3":"Bacteria make insulin only after the human gene is inserted; the genetic code is shared, so they read it."},"s3":{"title":"Station 3: test it in a dish (investigation)","how":"Muscle cells in three dishes. Glucose taken up in 1 hour (AU).","dataNote":"Model data.","dishes":[{"t":"No insulin","v":10},{"t":"Insulin","v":50},{"t":"Insulin + a drug that blocks insulin receptors","v":12}],"q1":{"prompt":"Which dish is the control?","choices":[{"t":"No insulin","_n":"1426a","_k":"182a12b2"},{"t":"Insulin","_n":"1525a","_k":"a05ff75f"},{"t":"Insulin + receptor blocker","_n":"1624a","_k":"f8a973ed"}],"right":"The control shows uptake without the factor being tested: insulin.","wrong":"The control shows uptake without the factor being tested."},"q2":{"prompt":"What does the third dish show?","choices":[{"t":"The drug destroys glucose.","_n":"1723a","_k":"7707f95b"},{"t":"The blocker makes cells take up more glucose.","_n":"1822a","_k":"4cc3e1f5"},{"t":"Insulin works through its receptor; block the receptor, and uptake stays low, as in insulin resistance.","_n":"1921a","_k":"38384c94"},{"t":"Insulin has no effect on muscle cells.","_n":"1a20a","_k":"3156e1a2"}],"right":"Insulin works through its receptor; block the receptor, and uptake stays low, as in insulin resistance.","wrong":"Compare the third dish with the other two: insulin is present, yet uptake is close to the no-insulin dish."}},"quickCheck":{"title":"A Canadian discovery quick check","summary":"A Canadian discovery quick check","items":[{"id":"q1","goal":5,"prompt":"Who purified the extract so it could be used safely in people?","right":"Banting and Best did the first experiments; Collip purified the extract.","wrong":"Banting and Best did the first experiments; Collip purified the extract.","choices":[{"t":"James Collip","_n":"1b2fa","_k":"a85f5fec"},{"t":"Frederick Banting","_n":"1c2ea","_k":"b7fbe9d5"},{"t":"Charles Best","_n":"1d219","_k":"c3cf0eba"},{"t":"J. J. R. Macleod","_n":"1e229","_k":"8fb77be0"}]},{"id":"q2","goal":5,"prompt":"Why can bacteria make human insulin?","right":"Bacteria make insulin only after the human gene is inserted; the genetic code is shared, so they read it.","wrong":"Bacteria make insulin only after the human gene is inserted; the genetic code is shared, so they read it.","choices":[{"t":"Bacteria eat pancreas tissue","_n":"1f239","_k":"7a53da52"},{"t":"The human gene was inserted, and the genetic code is shared","_n":"1g249","_k":"f2654647"},{"t":"Insulin forms by itself in sugar water","_n":"1h1d9","_k":"7017f8d2"},{"t":"Bacteria naturally make insulin","_n":"1i1e9","_k":"ea597526"}]},{"id":"q3","goal":2,"prompt":"In 93dc"},{"t":"Type 2 (insulin resistance)","why":"In type 2, insulin is usually high. Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"1s2ea","_k":"175ed485"},{"t":"Type 1 with insulin","why":"Injected insulin would show up, and glucose would come back toward 5.","_n":"1t31a","_k":"66209019"},{"t":"Normal","why":"In a normal day, insulin rises after meals and glucose returns to about 5.","_n":"1u30a","_k":"36487429"}],"hints":["Look at the insulin line first.","Insulin near 0 means the beta cells aren’t making it.","Type 1, untreated."]},{"id":"r2","kind":"mc","goal":3,"prompt":"Chart B: glucose 9.5 mmol/L at 15:00; insulin twice the normal level. Which pattern?","options":[{"t":"Normal","why":"Normal glucose is back to 5.0 three hours after lunch.","_n":"1v2ba","_k":"3c24b2a7"},{"t":"Type 1 with insulin","why":"In type 1 the body makes little insulin; twice the normal level points to resistance.","_n":"1w2aa","_k":"a2bd89c5"},{"t":"Type 2 (insulin resistance)","why":"Plenty of insulin, yet glucose stays high: the cells respond poorly.","_n":"1x2da","_k":"794cac3c"},{"t":"Type 1, untreated","why":"Type 1 has little insulin; this chart has plenty. Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"1y2ea","_k":"8a977953"}],"hints":["Is insulin low or high?","High insulin with high glucose means the cells aren’t responding.","Type 2 (insulin resistance)."]},{"id":"r3","kind":"num","goal":4,"star":true,"prompt":"Large meal (+4), no run. Dose to reach 5.0 at 3 h?","_a":"AQ==","display":"8 units","unit":"units","why":"The meal adds 4, and 8 units remove 4: 5 + 4 − 4 = 5.0.","wrong":[{"match":6,"fb":"6 units remove 3; a large meal adds 4."}],"general":"A large meal adds 4, and each 2 units remove 1.","hints":["How much does a large meal add?","It adds 4, so the dose must remove 4.","4 × 2 = 8 units."]},{"id":"r4","kind":"num","goal":4,"star":true,"prompt":"Medium meal (+3), run after the meal. Dose to reach 5.0 at 3 h?","_a":"DQ==","display":"4 units","unit":"units","why":"5 + 3 = 8; the run takes 1 off (7); 4 units remove the last 2.","wrong":[{"match":6,"fb":"The run removes 1 already. Working muscles take up glucose on their own, so less insulin is needed."}],"general":"Start from 5 + 3 = 8, then count what the run removes.","hints":["Start from 5 + 3 = 8.","The run takes 1 off: 7.","Remove 2 more: 4 units."]},{"id":"r5","kind":"mc","goal":3,"star":true,"prompt":"On chart A, the kidney limit is about 10 mmol/L. Glucose is 8.0 at 06:00, 11.0 after breakfast, 14.0 after lunch. From which meal on is glucose in the urine, and why?","options":[{"t":"From breakfast on: 11.0 is above the limit","why":"Above about 10 mmol/L, the kidneys can’t reabsorb all the filtered glucose.","_n":"1z2ba","_k":"cafd3e20"},{"t":"Never: the kidneys are healthy","why":"The kidney is working; there’s simply more glucose than its carriers can reabsorb (above about 10 mmol/L).","_n":"202ca","_k":"7926b25d"},{"t":"From lunch on: 14.0 is above the limit","why":"11.0 after breakfast is already above the limit.","_n":"2131a","_k":"2a7b7cf1"},{"t":"Before breakfast: 8.0 is already high","why":"8.0 is below 10; the kidneys reabsorb it all. The kidney is working; there’s simply more glucose than its carriers can reabsorb (above about 10 mmol/L).","_n":"2232a","_k":"044a401d"}],"hints":["Compare each value with 10.","8.0 is below 10; 11.0 is above.","From breakfast on."]},{"id":"r6","kind":"mc","goal":4,"star":true,"prompt":"\u003cstrong>Investigation:\u003c/strong> You want to test whether a run lowers your 3-h glucose after breakfast. Which comparison is fair?","options":[{"t":"Different breakfasts on two days","why":"Change only the variable you’re testing; keep the meal and dose the same.","_n":"232fa","_k":"f4c0bf3b"},{"t":"A run one day and a large dinner the next","why":"Change only the variable you’re testing; keep the meal and dose the same.","_n":"2430a","_k":"ab026645"},{"t":"The same breakfast and dose on two days, one with a run and one without","why":"Only the run changes, so any difference in the 3-h glucose comes from the run.","_n":"2525a","_k":"a648e1f5"},{"t":"Two different people, one runs","why":"Change only the variable you’re testing; keep the meal and dose the same.","_n":"2626a","_k":"0b34ffc6"}],"hints":["What is the one variable you’re testing?","The run. Everything else must stay the same.","Same breakfast and dose; run one day, not the other."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Emeka","how":"","instruction":"Emeka made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain what happens after a meal.","steps":["After a meal, blood glucose rises.","Alpha cells in the islets release insulin.","Muscle and fat cells take up glucose.","The liver stores glucose as glycogen, and blood glucose falls."],"_a":"CA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is correct.","Step 4 is correct."],"fixes":[{"t":"The liver releases insulin.","why":"Insulin comes from the pancreas.","_n":"271f8","_k":"d4ef2471"},{"t":"Beta cells in the islets release insulin.","why":"\u003cstrong>Beta\u003c/strong> cells make insulin; \u003cstrong>alpha\u003c/strong> cells make glucagon.","_n":"281e8","_k":"c532d9d2"},{"t":"Alpha cells release glucagon.","why":"Glucagon is for low glucose, not after a meal.","_n":"291d8","_k":"2d18de31"},{"t":"Step 2 is correct.","why":"Alpha cells make glucagon; beta cells make insulin.","_n":"2a1c8","_k":"77275c8e"}],"hints":["Which islet cells respond to high glucose?","Beta cells.","Beta → insulin."]},{"id":"e2","goal":3,"task":"Explain type 1 diabetes.","steps":["In type 1 diabetes, body cells ignore insulin even though plenty is made.","So glucose stays high after meals.","Above about 10 mmol/L, glucose appears in urine.","Injected insulin, matched to food and activity, is the treatment."],"_a":"CQ==","stepFb":["","Step 2 is true, but step 1’s cause is wrong.","Step 3 is correct.","Step 4 is correct."],"fixes":[{"t":"Step 1 is correct.","why":"That describes insulin resistance, the main feature of type 2.","_n":"2b238","_k":"9c8081c0"},{"t":"In type 1 diabetes, the immune system destroys the beta cells, so little or no insulin is made.","why":"Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"2c228","_k":"a04ef60f"},{"t":"In type 1 diabetes, alpha cells make too much insulin.","why":"\u003cstrong>Beta\u003c/strong> cells make insulin; \u003cstrong>alpha\u003c/strong> cells make glucagon.","_n":"2d218","_k":"71eb5bb4"},{"t":"In type 1 diabetes, the liver can’t store glycogen.","why":"The liver is fine; insulin is missing.","_n":"2e208","_k":"a5ff0dc8"}],"hints":["Is insulin present in type 1?","Very little.","The beta cells are destroyed."]},{"id":"e3","goal":4,"task":"Medium meal (+3) at lunch, then a 30-minute run (−1). What dose returns glucose to 5.0 at 3 h?","steps":["Start at 5.0; the meal adds 3, giving 8.0.","Each 2 units of insulin remove 1.","To remove 3, I need 6 units.","So the dose is 6 units."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3."],"fixes":[{"t":"The run adds 1, so I need 8 units.","why":"Exercise lowers glucose. Working muscles take up glucose on their own, so less insulin is needed.","_n":"2f278","_k":"e7bc0620"},{"t":"The run removes 1, so insulin must remove only 2: 4 units.","why":"Working muscles take up glucose on their own, so less insulin is needed.","_n":"2g268","_k":"9404e027"},{"t":"Step 3 is correct.","why":"With the run as well, 6 units would take glucose to 4.0. Working muscles take up glucose on their own, so less insulin is needed.","_n":"2h198","_k":"650c76b9"},{"t":"To remove 3, I need 3 units.","why":"Each 2 units remove 1.","_n":"2i1a8","_k":"3795caf4"}],"hints":["What else lowers glucose after this lunch?","The run removes 1.","8 − 1 = 7; remove 2 more: 4 units."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: insulin being high in type 2, or how exercise changes the dose?"},{"id":"j2","q":"In your own words, why are insulin and glucagon an example of negative feedback?"},{"id":"j3","q":"Explain to a friend why glucose shows up in urine in untreated diabetes, even though the kidneys are healthy."},{"id":"j4","q":"Insulin was discovered in Toronto and is now made by bacteria. What do you think was the most important step from discovery to everyday treatment, and why?"}]},"final":{"intro":"Ten questions, no hints. Dose questions use the module’s model rule (stated in each question); the numbers are model values, not medical advice.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which cells release insulin?","options":[{"t":"Beta cells of the pancreatic islets","why":"\u003cstrong>Beta\u003c/strong> cells make insulin; \u003cstrong>alpha\u003c/strong> cells make glucagon.","_n":"2j1b8","_k":"4fa3d0f7"},{"t":"Liver cells.","why":"The liver responds to insulin.","_n":"2k1c8","_k":"56f82248"},{"t":"Alpha cells of the pancreatic islets.","why":"\u003cstrong>Beta\u003c/strong> cells make insulin; \u003cstrong>alpha\u003c/strong> cells make glucagon.","_n":"2l1d8","_k":"ef506900"},{"t":"Cells of the adrenal gland.","why":"They release epinephrine.","_n":"2m1e8","_k":"5c16198c"}]},"b":{"prompt":"Which cells release glucagon?","options":[{"t":"Muscle cells.","why":"Muscles store glycogen but don’t release glucagon.","_n":"2n1f8","_k":"2936883c"},{"t":"Alpha cells of the pancreatic islets","why":"\u003cstrong>Beta\u003c/strong> cells make insulin; \u003cstrong>alpha\u003c/strong> cells make glucagon.","_n":"2o208","_k":"dd2deaed"},{"t":"Cells of the anterior pituitary.","why":"Not part of this loop.","_n":"2p218","_k":"48158dd0"},{"t":"Beta cells of the pancreatic islets.","why":"\u003cstrong>Beta\u003c/strong> cells make insulin; \u003cstrong>alpha\u003c/strong> cells make glucagon.","_n":"2q228","_k":"2b0ab2f6"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"What is glycogenolysis?","options":[{"t":"The release of glucagon.","why":"Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","_n":"2r5d2","_k":"1b3bed78"},{"t":"The breakdown of glycogen into glucose, mainly in the liver","why":"Glycogen-lysis: splitting glycogen. Glucagon triggers it.","_n":"2s5e2","_k":"424acca7"},{"t":"Making glucose from amino acids.","why":"That’s gluconeogenesis.","_n":"2t5f2","_k":"4aa9f250"},{"t":"The building of glycogen from glucose.","why":"That’s glycogenesis.","_n":"2u602","_k":"ee11b08a"}]},"b":{"prompt":"What does insulin make the liver do?","options":[{"t":"Break glycogen down into glucose.","why":"That’s glucagon’s effect.","_n":"2v612","_k":"40535ca4"},{"t":"Take up glucose and store it as glycogen","why":"Insulin lowers blood glucose: the liver stores it as glycogen.","_n":"2w622","_k":"24664d6d"},{"t":"Excrete glucose into bile.","why":"The liver stores glucose.","_n":"2x632","_k":"49f023d0"},{"t":"Release glucagon.","why":"Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","_n":"2y642","_k":"61b1b74a"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"What is the main cause of type 1 diabetes?","options":[{"t":"Eating too much sugar in childhood.","why":"Type 1 is autoimmune.","_n":"2z552","_k":"63da4b95"},{"t":"Cells respond poorly to insulin.","why":"Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"30562","_k":"4d17a37b"},{"t":"The liver makes too much glycogen.","why":"Glycogen storage isn’t the cause.","_n":"31632","_k":"772cadc2"},{"t":"The immune system destroys the beta cells, so little insulin is made","why":"Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"32622","_k":"808a86b7"}]},"b":{"prompt":"What is insulin resistance, the main feature of type 2 diabetes?","options":[{"t":"The beta cells are destroyed.","why":"That’s type 1. Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"33612","_k":"ac1351c2"},{"t":"The kidneys can’t filter glucose.","why":"The kidneys aren’t the cause.","_n":"34602","_k":"f2103650"},{"t":"Glucagon is missing.","why":"Glucagon isn’t the problem.","_n":"35672","_k":"bd0b1132"},{"t":"Cells respond poorly to insulin, so glucose stays high even with plenty of insulin","why":"Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"36662","_k":"7c832d0f"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Data: fasting glucose 9.0 mmol/L; insulin much higher than normal. Which explanation fits best?","options":[{"t":"Too much glucagon only.","why":"That doesn’t explain the high insulin.","_n":"37652","_k":"d6623512"},{"t":"Insulin resistance (type 2 pattern)","why":"High glucose with high insulin: the cells respond poorly.","_n":"38642","_k":"4e704b73"},{"t":"A normal result after an overnight fast.","why":"Fasting glucose above 7 is above the band.","_n":"395b2","_k":"79661616"},{"t":"No insulin is made (type 1 pattern).","why":"Insulin is high, not missing. Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"3a5a2","_k":"361670a9"}]},"b":{"prompt":"Data: glucose 15 mmol/L after lunch; insulin almost zero; glucose in urine. Which explanation fits best?","options":[{"t":"Kidney failure.","why":"The kidney is working; there’s simply more glucose than its carriers can reabsorb (above about 10 mmol/L).","_n":"3b692","_k":"116e4663"},{"t":"Insulin resistance (type 2 pattern).","why":"Insulin would be high in that case. Type 1: little or no insulin is made. Type 2: insulin is made, but cells respond poorly.","_n":"3c6a2","_k":"19846162"},{"t":"A normal response to a large lunch.","why":"Healthy insulin would bring glucose back down.","_n":"3d672","_k":"e27cf563"},{"t":"Little or no insulin is made (type 1 pattern)","why":"High glucose with almost no insulin: the beta cells aren’t making it.","_n":"3e682","_k":"e02830ce"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Model rule: a meal adds \u003cem>r\u003c/em>; each 2 units of insulin remove 1; a run after the meal removes 1; target 5.0 at 3 h. A large meal (+4) with no run. What dose?","options":[{"t":"4 units","why":"4 units remove 2, leaving 7.0.","_n":"3f652","_k":"ad285a13"},{"t":"6 units","why":"6 units remove 3, leaving 6.0.","_n":"3g662","_k":"cf82b33d"},{"t":"8 units","why":"8 units remove 4: 5 + 4 − 4 = 5.0.","_n":"3h632","_k":"d3199d60"},{"t":"10 units","why":"10 units remove 5, leaving 4.0.","_n":"3i642","_k":"28fa8a81"}]},"b":{"prompt":"Same rule (a meal adds \u003cem>r\u003c/em>; each 2 units of insulin remove 1; a run after the meal removes 1; target 5.0 at 3 h). A medium meal (+3) followed by a run. What dose?","options":[{"t":"4 units","why":"5 + 3 − 1 = 7.0 after the run; 4 units remove the last 2.","_n":"3j612","_k":"1fc85f40"},{"t":"6 units","why":"The run removes 1, so 6 units would leave 4.0. Working muscles take up glucose on their own, so less insulin is needed.","_n":"3k622","_k":"2fc6b2e5"},{"t":"8 units","why":"Exercise lowers glucose; it doesn’t call for more insulin. Working muscles take up glucose on their own, so less insulin is needed.","_n":"3lcf3","_k":"bba4dc5e"},{"t":"2 units","why":"2 units remove 1: 5 + 3 − 1 − 1 = 6.0.","_n":"3mce3","_k":"cb1a7c30"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"A rare condition stops the liver responding to glucagon. When is the person most at risk of low blood glucose?","options":[{"t":"Right after meals, because insulin is high.","why":"After meals, glucose is high.","_n":"3nd13","_k":"786b6b86"},{"t":"During long fasts, such as overnight, because the liver can’t release stored glucose","why":"Between meals, glucagon is what makes the liver send glucose out.","_n":"3od03","_k":"570801d9"},{"t":"Never, because insulin can raise glucose.","why":"Insulin lowers glucose.","_n":"3pd33","_k":"c93a3faa"},{"t":"Only during sleep, because glucagon is made only then.","why":"Glucagon is released whenever glucose falls.","_n":"3qd23","_k":"dd5d84e2"}]},"b":{"prompt":"A tumour of beta cells releases insulin all the time, even when glucose is low. What happens?","options":[{"t":"Glucose falls too low, and glucagon rises to try to correct it","why":"Insulin keeps lowering glucose; the falling glucose triggers the alpha cells.","_n":"3rd53","_k":"dd102431"},{"t":"Glucose rises because of extra insulin.","why":"Insulin lowers glucose.","_n":"3sd43","_k":"a7ae8f6e"},{"t":"Glucose appears in urine.","why":"That happens when glucose is high.","_n":"3td73","_k":"2556029a"},{"t":"Nothing, because glucagon cancels it exactly.","why":"A constant insulin release can overwhelm the correction.","_n":"3ud63","_k":"f6e09352"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of how insulin returns blood glucose to normal after a meal?","options":[{"t":"“Rising glucose stimulates beta cells to release insulin; insulin makes muscle and fat cells take up glucose and the liver store it as glycogen, so blood glucose falls and insulin release slows.”","why":"Stimulus, hormone, effects and the loop switching itself off: negative feedback.","_n":"3vd53","_k":"aae51035"},{"t":"“Insulin breaks glucose down into water and carbon dioxide in the blood.”","why":"Insulin is a signal: it makes cells take in and store glucose. The glucose stays in the body.","_n":"3wd63","_k":"6fbb95ac"},{"t":"“Insulin carries glucose out of the body in urine.”","why":"Insulin is a signal: it makes cells take in and store glucose. The glucose stays in the body.","_n":"3xd73","_k":"6bc815be"},{"t":"“Glucagon is converted into insulin after a meal.”","why":"Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","_n":"3yd83","_k":"21e0a7ac"}]},"b":{"prompt":"Which is the best explanation of why glucose appears in urine in untreated diabetes?","options":[{"t":"“Insulin makes the kidneys release glucose.”","why":"Insulin is low or ineffective here.","_n":"3zd13","_k":"9124dbda"},{"t":"“Blood glucose is so high that more glucose is filtered into the nephrons than the carriers can reabsorb, so the excess stays in the urine.”","why":"The kidney is working; there’s simply more glucose than its carriers can reabsorb (above about 10 mmol/L).","_n":"40d23","_k":"36084f71"},{"t":"“The kidneys are damaged and leak glucose.”","why":"The kidneys are working at full capacity. The kidney is working; there’s simply more glucose than its carriers can reabsorb (above about 10 mmol/L).","_n":"41d33","_k":"fd764166"},{"t":"“Glucagon sends glucose to the bladder.”","why":"Glucagon acts on the liver.","_n":"42d43","_k":"893f28f2"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which flow chart is correct?","options":[{"t":"Glucose low → alpha cells → glucagon → liver breaks down glycogen → glucose rises","why":"Low glucose triggers the alpha cells; glucagon makes the liver release glucose.","_n":"43dd3","_k":"6a6f6d88"},{"t":"Glucose low → alpha cells → glycogen → liver releases glucagon","why":"Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","_n":"44de3","_k":"aa61b469"},{"t":"Glucose high → alpha cells → glucagon → glucose falls","why":"Glucagon raises glucose.","_n":"45db3","_k":"7c192983"},{"t":"Glucose low → beta cells → insulin → liver stores glycogen → glucose rises","why":"That lowers glucose.","_n":"46da3","_k":"ad55324b"}]},"b":{"prompt":"Which statement uses the terms correctly?","options":[{"t":"“Glucagon is stored in the liver as glycogen.”","why":"Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","_n":"47d93","_k":"6445832a"},{"t":"“Insulin and glucagon are antagonistic hormones: insulin lowers blood glucose and glucagon raises it.”","why":"Antagonistic: opposite effects on the same variable.","_n":"48d83","_k":"cbee2e9b"},{"t":"“Insulin and glucagon are synergistic: both lower glucose.”","why":"They work in opposite directions.","_n":"49d73","_k":"288c1ec2"},{"t":"“Glycogen is the hormone that raises glucose.”","why":"Glucag\u003cstrong>on\u003c/strong> is a hormone; glycog\u003cstrong>en\u003c/strong> is the stored carbohydrate that glucagon tells the liver to break down.","_n":"4ad63","_k":"fcb93753"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Today most insulin is made by microorganisms. Why can bacteria make human insulin?","options":[{"t":"The human insulin gene was inserted into a plasmid, and bacteria read the same genetic code","why":"Bacteria make insulin only after the human gene is inserted; the genetic code is shared, so they read it.","_n":"4bd53","_k":"2efcb588"},{"t":"Bacteria have always made human insulin.","why":"Bacteria make insulin only after the human gene is inserted; the genetic code is shared, so they read it.","_n":"4cd43","_k":"5260225b"},{"t":"The insulin is taken from human pancreases and copied by bacteria.","why":"The gene, not the protein, is put into the bacteria.","_n":"4de33","_k":"c4e49260"},{"t":"Bacteria convert sugar into insulin without any gene.","why":"Proteins are made from genes.","_n":"4ee23","_k":"bdaa4cc4"}]},"b":{"prompt":"Why did recombinant human insulin replace insulin from pig and cow pancreases?","options":[{"t":"Recombinant insulin needs no injection.","why":"It’s still injected.","_n":"4f613","_k":"7b760225"},{"t":"Animal insulin doesn’t lower glucose at all.","why":"It does; it differs slightly in sequence.","_n":"4g623","_k":"c17bd68f"},{"t":"Bacteria make insulin naturally, so it was cheaper to collect.","why":"Bacteria make insulin only after the human gene is inserted; the genetic code is shared, so they read it.","_n":"4h5f3","_k":"9a3ced61"},{"t":"It has the same amino acid sequence as human insulin and can be made reliably in large amounts","why":"Fewer immune reactions and a reliable supply.","_n":"4i603","_k":"7129b2e0"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"An athlete with type 1 diabetes usually takes 6 units with a medium lunch. Today a training session follows lunch. Using the model rule (a meal adds \u003cem>r\u003c/em>; each 2 units of insulin remove 1; a run after the meal removes 1; target 5.0 at 3 h), what should the lunch dose be to reach 5.0 at 3 h?","options":[{"t":"0 units, because exercise replaces insulin completely.","why":"0 units leaves 5 + 3 − 1 = 7.0.","_n":"4j653","_k":"5809178d"},{"t":"8 units, because exercise uses energy.","why":"Working muscles take up glucose on their own, so less insulin is needed.","_n":"4k663","_k":"fb9ca99f"},{"t":"4 units, because exercising muscles take up glucose too","why":"Working muscles take up glucose on their own, so less insulin is needed.","_n":"4l633","_k":"981f08aa"},{"t":"6 units, because exercise doesn’t affect glucose.","why":"The run removes 1.","_n":"4m643","_k":"367cd6ab"}]},"b":{"prompt":"Someone with type 1 diabetes took their usual dose, then ran, and now feels shaky with glucose at 3.5 mmol/L. Which response would raise glucose most directly, and why?","options":[{"t":"More insulin, to help cells use glucose.","why":"Insulin would lower glucose further.","_n":"4n593","_k":"9dd1f77c"},{"t":"Waiting for the next meal.","why":"Low glucose needs a prompt response.","_n":"4o5a3","_k":"1dad9831"},{"t":"A long run, to burn off the insulin.","why":"Exercise lowers glucose. Working muscles take up glucose on their own, so less insulin is needed.","_n":"4p673","_k":"5bd466a5"},{"t":"Fast-acting sugar, because it is absorbed quickly into the blood","why":"Low glucose needs glucose in the blood quickly.","_n":"4q663","_k":"49cefb66"}]}}]},"task":{"title":"Plan a model day","summary":"Plan a model day","statement":"\u003cp>Plan meal sizes, insulin doses and one run for a model day with type 1 diabetes. Meet every condition. These are model numbers for learning, not a real treatment plan. Can you find all the answers?\u003c/p>\u003col class=\"ig-conds\">\u003cli>Every meal returns glucose to exactly 5.0 mmol/L three hours later.\u003c/li>\u003cli>There is a 30-minute run after exactly one meal.\u003c/li>\u003cli>The total insulin for the day is at most 14 model units.\u003c/li>\u003cli>Lunch is the large meal.\u003c/li>\u003c/ol>","model":"Each meal’s 3-h value = 5 + \u003cem>r\u003c/em> − \u003cem>d\u003c/em>/2 − \u003cem>e\u003c/em> (\u003cem>e\u003c/em> = 1 if the run follows that meal).","checks":["Every meal back to 5.0","One run","Total insulin ≤ 14","Large lunch"],"tips":["For each meal, the dose must remove what the meal adds, minus anything the run removes.","Pick one meal to follow with a run.","Each meal size adds 2 units to the total. Smaller meals elsewhere leave room for a large lunch.","Set lunch to large."],"explainPrompt":"Explain how you chose each dose, including how the run changed one of them.","vocab":"Use the words insulin, glucose uptake, set point and negative feedback.","more":"Can you find all the answers?","after3":"The total is always 2 × (2 + 4 + 2 − 1) = 14. A run anywhere saves 2 units, and a large lunch forces small meals elsewhere."},"cards":[["Islets of Langerhans","Clusters of hormone cells in the pancreas: beta cells (insulin) and alpha cells (glucagon)."],["Insulin","Released when glucose is high; makes cells take up glucose and the liver store glycogen. Lowers blood glucose."],["Glucagon","Released when glucose is low; makes the liver break down glycogen and make new glucose.
