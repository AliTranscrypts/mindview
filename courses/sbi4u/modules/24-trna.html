--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;

}
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{
margin:0;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:24px 24px;
font:400 1.0625rem/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
img,svg{max-width:100%}
header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mv-top));z-index:9;background:var(--paper);border-bottom:1.5px solid var(--rule)}
.top-inner{max-width:1060px;margin:0 auto;padding:10px 18px 0}
.top-row{display:flex;align-items:center;gap:12px 18px}
.brand{flex:1 1 auto;min-width:0;line-height:1.2}

.prog{display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--ink-2);flex:0 0 auto}
.prog-bar{width:110px;height:8px;border-radius:99px;background:var(--rule);overflow:hidden}

.hd-btns{display:flex;gap:8px;flex:0 0 auto}
.home-link{flex:0 0 auto}
.theme-btn{min-width:2.6em;justify-content:center}

.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.save-off{max-width:1060px;margin:10px auto 0;padding:0 18px}

main{max-width:1060px;margin:0 auto;padding:6px 18px 40px}
h1,h2{font-family:var(--font-math);font-weight:600;line-height:1.15;margin:0 0 .45em}

p{margin:0 0 .8em;max-width:68ch}
.muted{color:var(--ink-2)}

.p-k{color:var(--p-k)} .p-d{color:var(--p-d)} .p-c{color:var(--p-c)} .p-b{color:var(--p-b)} .p-t{color:var(--p-t)}

.uses{margin:10px 0 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);font-size:.95rem;max-width:68ch}
.q-prompt canvas.plot,.task + canvas.plot,.fig-sm{max-width:380px;margin-top:8px;font-weight:400}

.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--sheet)}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}

.plot-wrap{position:relative}

.rate{display:flex;flex-wrap:wrap;gap:6px}

.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}

.q-prompt{flex:1;font-weight:700;min-width:0}

.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

.result{margin-top:14px}

.slider{display:block;margin:0 0 6px}

.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 24 tRNA: trnaDraw (cloverleaf / L), S1 anatomy explorer, charging station, wobble reader, S6 codon table,
   matching stations, S12 chips, wobble puzzles, task. Tokens only. Roles (plan §5): tRNA --bio-e (violet), mRNA --bio-nadh
   (teal), amino acids --bio-carbon (brown), ATP --bio-atp (orange), synthetase / release factor --ink-2 outlines,
   wobble position --hi, base-pair lines --ink. */
/* radio groups (copied from SBI4U 21 / 15) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* S1 diagram explorer (copied from SBI4U 17) */
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1px dashed transparent;border-radius:8px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.s1-b.on{border-color:var(--hi)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}

/* sequences */
.tr-sq{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-size:.95em;letter-spacing:.02em;white-space:nowrap}
.hero .hero-eq .tr-heq{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.15;font-size:.9em}
.tr-heq .tr-sq{font-size:1em}
.tr-hac{color:var(--bio-e)}
.tr-hco{color:var(--bio-nadh)}
.tr-hb{display:flex;padding-left:3ch;height:.7em}
.tr-hb i{display:block;width:1ch;margin-right:0;border-left:2px solid var(--ink);height:100%;margin-left:.45ch;margin-right:.55ch;font-style:normal}
.tr-hero{max-width:440px;margin:0 auto}
.tr-hsvg,.tr-svg{display:block;width:100%;height:auto}

/* trnaDraw */
.tr-st{fill:none;stroke:var(--bio-e);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.tr-loop{fill:var(--sheet)}
.tr-rung{stroke:var(--bio-e);stroke-width:1.6;opacity:.7}
.tr-tab{fill:var(--sheet);stroke-width:2.2}
.tr-tab.tr-t{stroke:var(--bio-e)}
.tr-tab.tr-m{stroke:var(--bio-nadh)}
.tr-tab.tr-cur{stroke-width:3.4}
.tr-wobo{fill:none;stroke:var(--hi);stroke-width:2.6;stroke-dasharray:5 3}
.tr-bl{font:700 14px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:var(--ink)}
.tr-nt{fill:var(--sheet);stroke:var(--bio-e);stroke-width:2}
.tr-ntl{font:700 9px ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:var(--ink)}
.tr-aa{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1.5}
.tr-aat{font:700 10.5px var(--font-ui);fill:var(--sheet)}
.tr-aa0{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 3}
.tr-glow{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2}
.tr-end{font:700 13px var(--font-ui);fill:var(--ink)}
.tr-lab{font:700 11px var(--font-ui);fill:var(--ink)}
.tr-sm{font:400 11px var(--font-ui);fill:var(--ink-2)}
.tr-mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.tr-ruler{stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:6 5}
.tr-rul{font:700 13px var(--font-ui);fill:var(--ink-2)}
.tr-enz{fill:none;stroke:var(--ink-2);stroke-width:2.4}
.tr-enzl{font:700 11px var(--font-ui);fill:var(--ink-2)}
.tr-atp{fill:var(--bio-atp)}
.tr-atpl{font:700 11px var(--font-ui);fill:var(--sheet)}
.tr-x{font:700 16px var(--font-ui);fill:var(--red)}
.tr-mrna{fill:var(--bio-nadh)}
.tr-bp{stroke:var(--ink);stroke-width:2.2}
.tr-bpw{stroke-dasharray:4 3}

/* Explore layout */
.tr-fig,.tr-scroll{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.tr-scroll{overflow-x:auto}
.tr-ssvg{min-width:400px}
.tr-cap{margin:.5em 0 0;font-size:.92rem}
.tr-chain{margin:.4em 0 0;font-weight:700;font-size:.92rem;min-height:1em}
.tr-chain:empty{display:none}
.tr-panel{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.tr-panel[hidden]{display:none}
.tr-rotw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tr-rotw[hidden]{display:none}
.tr-rotw p{flex-basis:100%;margin:0}
.tr-rotw input{flex:1 1 140px;min-height:32px}
.tr-parts,.tr-place,.tr-pick,.tr-bases{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tr-parts .chip.on,.tr-pick .chip.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.tr-place .chip{min-width:56px;min-height:40px}
.tr-hand{margin:0;font-size:.92rem}
.tr-card{margin:0;padding:.5em .7em;border-left:4px solid var(--hi);background:var(--info-bg);border-radius:4px;font-size:.88rem}
.tr-msg{margin:.6em 0 0;font-size:.92rem;min-height:1.2em}

/* S6 codon table */
.tr-ct{border-collapse:collapse;font-size:.82rem;min-width:420px}
.tr-ct caption{font-weight:700;text-align:left;padding:.3em 0}
.tr-ct th,.tr-ct td{border:1px solid var(--rule);padding:.25em .4em;vertical-align:top}
.tr-ct thead th{background:var(--paper)}
.tr-ctr{display:block;white-space:nowrap}
.tr-dlg{max-width:min(640px,calc(100vw - 24px));width:100%;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:12px 14px}
.tr-dlg::backdrop{background:rgba(0,0,0,.45)}
.tr-dlgh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tr-dlgh h3{margin:0}

/* Part 3 */
.tr-sta{margin:0 0 1.4em}
.tr-wb2{display:flex;flex-direction:column;gap:4px;overflow-x:auto;padding:4px 0}
.tr-wrow{display:flex;align-items:center;gap:6px}
.tr-wrow.tr-gap{margin-top:12px}
.tr-wl{flex:0 0 9.5em;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.tr-we{flex:0 0 2.2em;font:700 .95rem ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;text-align:center}
.tr-slot,.tr-cb{flex:0 0 40px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font:700 1.05rem ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;border-radius:6px}
.tr-slot{border:2px solid var(--bio-e);background:var(--sheet);color:var(--ink);cursor:pointer;padding:0}
.tr-slot.empty{border-style:dashed;color:var(--ink-2)}
.tr-slot.on{outline:3px solid var(--hi);outline-offset:1px}
.tr-cb{border:2px solid var(--bio-nadh);background:var(--sheet)}
.tr-lines .tr-pl{flex:0 0 40px;height:14px;display:flex;justify-content:center}
.tr-pl.on{background:linear-gradient(var(--ink),var(--ink)) center/2.5px 100% no-repeat}
.tr-bases{margin:.6em 0}
.tr-bases .chip{min-width:44px;min-height:40px}
.tr-dt{border-collapse:collapse;font-size:.9rem}
.tr-dt th,.tr-dt td{border:1px solid var(--rule);padding:.3em .55em;text-align:left}
.tr-cer{display:flex;flex-direction:column;gap:6px;margin:.4em 0}
.tr-cchip{text-align:left;border-radius:10px;padding:.4em .7em;min-height:40px;line-height:1.3}
.tr-cchip.on{background:var(--hi-soft);border-color:var(--hi)}
.tr-role{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);margin-right:.3em}
.tr-expl{border:1.5px dashed var(--rule);border-radius:8px;padding:.5em .8em;margin:.5em 0}
.tr-expl ol{margin:.3em 0 0;padding-left:1.4em}
.tr-fam{display:flex;flex-wrap:wrap;gap:8px;margin:.6em 0}
.tr-fc{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--rule);border-radius:8px;padding:.35em .6em;min-width:86px}
.tr-fcod{font-weight:700;color:var(--ink)}
.tr-fby{font-size:.8rem;color:var(--ink-2)}
.tr-big{margin:.35em 0;font-size:.98rem}
.tr-swrow{margin:.6em 0}
.tr-sw[aria-checked="true"]{background:var(--hi-soft);border-color:var(--hi)}

/* practice + task */
.tr-also{margin:.6em 0 0;display:flex;flex-direction:column;gap:6px}
.tr-tin{display:flex;flex-direction:column;gap:12px}
.tr-tpv{border:1.5px solid var(--rule);border-radius:8px;padding:.6em .8em;background:var(--sheet)}
.tr-th{margin:.2em 0 .3em;font-size:.95rem}
.tr-rl{list-style:none;padding:0;margin:0}
.tr-rl li{padding:.15em 0}
.tr-rl li.no{color:var(--red)}
.tr-conds{margin:.4em 0 0;padding-left:1.4em}
.tr-sk{display:inline-flex;flex-direction:column;gap:2px}

@media (max-width:560px){
  .tr-wl{flex-basis:6.5em;font-size:.78rem}
  .tr-slot,.tr-cb{flex-basis:36px;width:36px;height:36px}
  .tr-lines .tr-pl{flex-basis:36px}
}

</style>

ormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"852cd081","content":{"id":"24-trna","kind":"topic","title":"tRNA","topic":"tRNA","readyTopic":"tRNA","hero":{"eq":"\u003cspan class=\"tr-heq\">\u003cspan class=\"tr-sq tr-hac\">3′-UAC-5′\u003c/span>\u003cspan class=\"tr-hb\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"tr-sq tr-hco\">5′-AUG-3′\u003c/span>\u003c/span>","eqLabel":"Anticodon 3′ U A C 5′ paired with the codon 5′ A U G 3′","eqSize":"sm","headline":"One end reads, the other end carries","text":"Ribosomes can’t read amino acids, and amino acids can’t read mRNA. \u003cstrong>Transfer RNA\u003c/strong> connects the two. Its \u003cstrong>anticodon\u003c/strong> pairs with a \u003cstrong>codon\u003c/strong>, and its \u003cstrong>3′ end\u003c/strong> carries the matching amino acid, loaded by an enzyme called an \u003cstrong>aminoacyl-tRNA synthetase\u003c/strong>.","fig":{"html":"\u003cdiv class=\"tr-hero\" id=\"tr-hero\" role=\"img\" aria-label=\"A flat cloverleaf tRNA appears with its arms labelled, then folds into an L shape. A synthetase grips the L, an ATP splits, and a methionine snaps onto the 3′ CCA end. The charged tRNA drifts down to an mRNA strip, and its anticodon 3′ U A C 5′ pairs with the codon 5′ A U G 3′, with three base-pair lines.\">\u003c/div>"}},"goals":["I can describe the structure of a tRNA: the anticodon loop, the 3′ CCA end that carries the amino acid, and its folded L shape.","I can explain how aminoacyl-tRNA synthetases charge each tRNA with the correct amino acid, using ATP.","I can write the anticodon that pairs with a codon, keeping track of 5′ and 3′ ends.","I can use wobble rules to work out which codons a tRNA can read, and the fewest tRNAs needed for a set of codons.","I can use evidence to explain why the ribosome reads the anticodon, not the amino acid."],"start":{"blocks":[{"title":"The codon table","html":"\u003cdetails class=\"alg\">\u003csummary>Open the codon table\u003c/summary>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"tr-ct\">\u003ccaption>The genetic code: codons written 5′ → 3′\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">1st base\u003c/th>\u003cth scope=\"col\">2nd base U\u003c/th>\u003cth scope=\"col\">2nd base C\u003c/th>\u003cth scope=\"col\">2nd base A\u003c/th>\u003cth scope=\"col\">2nd base G\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">U\u003c/th>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">UUU\u003c/span> Phe\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">UUC\u003c/span> Phe\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">UUA\u003c/span> Leu\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">UUG\u003c/span> Leu\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">UCU\u003c/span> Ser\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">UCC\u003c/span> Ser\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">UCA\u003c/s \u003cspan class=\"tr-sq\">CAG\u003c/span> Gln\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">CGU\u003c/span> Arg\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">CGC\u003c/span> Arg\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">CGA\u003c/span> Arg\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">CGG\u003c/span> Arg\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">A\u003c/th>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AUU\u003c/span> Ile\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AUC\u003c/span> Ile\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AUA\u003c/span> Ile\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AUG\u003c/span> Met\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">ACU\u003c/span> Thr\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">ACC\u003c/span> Thr\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">ACA\u003c/span> Thr\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">ACG\u003c/span> Thr\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AAU\u003c/span> Asn\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AAC\u003c/span> Asn\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AAA\u003c/span> Lys\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AAG\u003c/span> Lys\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AGU\u003c/span> Ser\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AGC\u003c/span> Ser\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AGA\u003c/span> Arg\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">AGG\u003c/span> Arg\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">G\u003c/th>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GUU\u003c/span> Val\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GUC\u003c/span> Val\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GUA\u003c/span> Val\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GUG\u003c/span> Val\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GCU\u003c/span> Ala\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GCC\u003c/span> Ala\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GCA\u003c/span> Ala\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GCG\u003c/span> Ala\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GAU\u003c/span> Asp\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GAC\u003c/span> Asp\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GAA\u003c/span> Glu\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GAG\u003c/span> Glu\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GGU\u003c/span> Gly\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GGC\u003c/span> Gly\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GGA\u003c/span> Gly\u003c/span>\u003cspan class=\"tr-ctr\">\u003cspan class=\"tr-sq\">GGG\u003c/span> Gly\u003c/span>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"tiny muted\">AUG codes Met and is also the start codon. UAA, UAG and UGA are stop codons.\u003c/p>\u003c/details>"}],"warmup":{"questions":[{"id":"w1","skill":"Base pairing in RNA","goal":3,"prompt":"In RNA, which base pairs with adenine (A)?","options":[{"t":"Guanine (G)","why":"G pairs with C.","_n":"0709","_k":"cad58e40"},{"t":"Thymine (T)","why":"T is in DNA, not RNA.","_n":"16d9","_k":"0d978236"},{"t":"Uracil (U)","why":"RNA uses U in place of T, and U pairs with A.","_n":"26e9","_k":"773e5647"},{"t":"Adenine (A)","why":"A doesn’t pair with itself.","_n":"36b9","_k":"828b88ea"}],"hints":["Which base does RNA use instead of thymine?","In DNA, A pairs with T.","In RNA, A pairs with U."]},{"id":"w2","skill":"RNA vs DNA","goal":1,"prompt":"Which feature does tRNA share with mRNA but \u003cstrong>not\u003c/strong> with DNA?","options":[{"t":"It is made by DNA polymerase.","why":"RNA polymerase makes RNA.","_n":"46c9","_k":"b1f2621c"},{"t":"It contains ribose and uracil.","why":"All RNA has ribose and U.","_n":"5699","_k":"51df46c8"},{"t":"It is a double helix along its whole length.","why":"DNA is; tRNA has short paired stems only.","_n":"66a9","_k":"93ce9e8c"},{"t":"It contains thymine.","why":"Thymine is a DNA base.","_n":"7679","_k":"db33e377"}],"hints":["Think about the sugar and the bases.","DNA: deoxyribose and T. RNA: …","Ribose and U."]},{"id":"w3","skill":"RNA vs DNA","goal":1,"prompt":"A single RNA strand can fold back on itself and form short double-stranded stems. Why?","options":[{"t":"Parts of the strand have complementary bases that pair with each other.","why":"That’s how tRNA gets its cloverleaf.","_n":"8689","_k":"65ff0c70"},{"t":"Uracil pairs with uracil.","why":"U pairs with A (and, at wobble, with G).","_n":"97aa","_k":"5631b008"},{"t":"RNA always has a partner strand.","why":"mRNA and tRNA are single strands.","_n":"a79a","_k":"571043a8"},{"t":"Ribose is sticky.","why":"Hydrogen bonds between bases hold the stems.","_n":"b7ca","_k":"d9875a21"}],"hints":["What holds two DNA strands together?","Hydrogen bonds between complementary bases.","Complementary stretches in one strand pair with each other."]},{"id":"w4","skill":"Reading the codon table","goal":4,"prompt":"Using the codon table, which amino acid does \u003cspan class=\"tr-sq\">5′-GGA-3′\u003c/span> code for?","options":[{"t":"A stop signal","why":"The stops are UAA, UAG and UGA.","_n":"c7ba","_k":"a9ed4349"},{"t":"Glycine (Gly)","why":"Every GG_ codon is glycine.","_n":"d76a","_k":"aae36579"},{"t":"Arginine (Arg)","why":"Arg is CG_ (and AGA, AGG).","_n":"e75a","_k":"88b43d58"},{"t":"Proline (Pro)","why":"Pro is CC_.","_n":"f78a","_k":"d330f24e"}],"hints":["Find the first base (G) as the row.","Then the second base (G) as the column.","GGU, GGC, GGA, GGG: glycine."]},{"id":"w5","skill":"Base pairing in RNA","goal":3,"prompt":"Which RNA strand pairs with \u003cspan class=\"tr-sq\">5′-AUC-3′\u003c/span>?","options":[{"t":"\u003cspan class=\"tr-sq\">5′-UAG-3′\u003c/span>","why":"Same direction: the ends don’t match up.","_n":"g77a","_k":"29413c1c"},{"t":"\u003cspan class=\"tr-sq\">3′-AUC-5′\u003c/span>","why":"That’s the same bases, not the complement.","_n":"h72a","_k":"aa29c526"},{"t":"\u003cspan class=\"tr-sq\">3′-TAG-5′\u003c/span>","why":"RNA uses U, not T.","_n":"i71a","_k":"d2b05688"},{"t":"\u003cspan class=\"tr-sq\">3′-UAG-5′\u003c/span>","why":"Antiparallel and complementary: A–U, U–A, C–G.","_n":"je8a","_k":"5bd71a9f"}],"hints":["Strands pair antiparallel: one 5′ → 3′, the other 3′ → 5′.","Complements: A–U, U–A, C–G.","\u003cspan class=\"tr-sq\">3′-UAG-5′\u003c/span>."]},{"id":"w6","skill":"Reading the codon table","goal":4,"prompt":"How many different codons code for leucine (Leu)?","options":[{"t":"1","why":"Most amino acids have more than one codon.","_n":"ke9a","_k":"537516e8"},{"t":"3","why":"Count all six.","_n":"leaa","_k":"621ee4a7"},{"t":"4","why":"That counts only the CU_ box; UUA and UUG are Leu too.","_n":"meba","_k":"a1b478a5"},{"t":"6","why":"CUU, CUC, CUA, CUG, UUA and UUG.","_n":"ne4a","_k":"01c8b1d7"}],"hints":["Look for every Leu in the table.","One full box of four, plus two more.","6."]}],"refreshers":{"Base pairing in RNA":"A pairs with U and G pairs with C. Paired strands run antiparallel: one 5′ → 3′, the other 3′ → 5′. Example: \u003cspan class=\"tr-sq\">5′-GAC-3′\u003c/span> pairs with \u003cspan class=\"tr-sq\">3′-CUG-5′\u003c/span>.","RNA vs DNA":"RNA has ribose and uracil and is usually single-stranded, but one strand can fold so that complementary stretches pair into stems.","Reading the codon table":"Find the first base (row), then the second (column), then the third (within the box). Most amino acids have 2–6 codons; AUG is both Met and “start”; UAA, UAG and UGA are stops."}}},"explore":{"heading":"tRNA anatomy and charging","intro":"Turn a tRNA to see its parts, load it at a synthetase, then try it against codons on an mRNA strip.","modes":[{"id":"anat","t":"Anatomy"},{"id":"charge","t":"Charging station"},{"id":"wob","t":"Wobble reader"}],"parts":[{"id":"acc","name":"Acceptor stem and 3′ end (CCA)","read":"3′ end (CCA): the amino acid attaches here","job":"The amino acid is attached to the last A of …CCA-3′, about 7 nm from the anticodon, at the other end of the L."},{"id":"p5","name":"5′ end","read":"5′ end: part of the acceptor stem","job":"The 5′ end pairs with the strand next to the 3′ end in the acceptor stem. Nothing attaches here."},{"id":"ac","name":"Anticodon loop","read":"Anticodon loop: three bases that pair with a codon","job":"Three bases in this loop pair with an mRNA codon, antiparallel."},{"id":"d","name":"D arm","read":"D arm: a side loop","job":"A side loop that helps the tRNA fold and fit the ribosome."},{"id":"t","name":"T arm","read":"T arm: a side loop","job":"A side loop that helps the tRNA fold and fit the ribosome."}],"trnas":["CAU","CCA","GAA","IAG","IGC","GCU","ICC","CCC","UCC","GCC","ACC"],"wobbleCard":"\u003cstrong>Wobble rules (simplified)\u003c/strong>: anticodon 5′ base → codon 3′ base: G → C or U · U → A or G · I → U, C or A · C → G only · A → U only. (I is inosine.)","strips":[["AUG","UGG","UUC","UAA"],["UUU","UUC","UUA","UUG"],["CUU","CUC","CUA","CUG"],["GGU","GGC","GGA","GGG"],["GCU","GCC","GCA","GCG"],["AGU","AGC","AGA","AGG"],["UGU","UGU","UGU","UGU"],["UGG","UAA"]],"predIntro":"Make a prediction first. Then the model will show you what really happens.","predictions":[{"id":"p1","prompt":"Start: a tRNA with anticodon \u003cspan class=\"tr-sq\">5′-CAU-3′\u003c/span>. Which codon will this tRNA pair with?","options":[{"t":"\u003cspan class=\"tr-sq\">5′-UAC-3′\u003c/span>","_n":"oe5a","_k":"759a34f8"},{"t":"\u003cspan class=\"tr-sq\">5′-AUG-3′\u003c/span>","_n":"pe6a","_k":"3d243337"},{"t":"\u003cspan class=\"tr-sq\">5′-GUA-3′\u003c/span>","_n":"qe7a","_k":"54ae65b0"},{"t":"\u003cspan class=\"tr-sq\">5′-CAU-3′\u003c/span>","_n":"rf0a","_k":"3f894505"}],"explain":"Turn the anticodon around: \u003cspan class=\"tr-sq\">3′-UAC-5′\u003c/span> pairs base by base with \u003cspan class=\"tr-sq\">5′-AUG-3′\u003c/span>."},{"id":"p2","prompt":"Start: a charged Cys-tRNA (its anticodon reads UGU). A chemical treatment (the beaker) changes its cysteine into alanine; the anticodon is untouched. The mRNA has UGU. What will the ribosome add?","options":[{"t":"Both","_n":"sf1a","_k":"de567e89"},{"t":"Cysteine","_n":"teea","_k":"f456de3b"},{"t":"Alanine","_n":"ueda","_k":"c0706e94"},{"t":"Nothing: the ribosome rejects it","_n":"veca","_k":"5265dfbb"}],"explain":"The ribosome checks only codon–anticodon pairing. Whatever is on the tRNA gets added. A real experiment in 1962 showed exactly this."},{"id":"p3","prompt":"Start: tRNA\u003csup>Phe\u003c/sup>, anticodon \u003cspan class=\"tr-sq\">5′-GAA-3′\u003c/span>, over the strip UUU · UUC · UUA · UUG. How many of these codons can it read?","options":[{"t":"1","_n":"weba","_k":"046649d7"},{"t":"2","_n":"xeaa","_k":"46ade568"},{"t":"3","_n":"ye9a","_k":"47c493ba"},{"t":"4","_n":"ze8a","_k":"8810009c"}],"explain":"G at the anticodon’s 5′ end pairs with C or U at the codon’s third position. It reads UUC (normal) and UUU (wobble G–U); UUA and UUG fail (they’re Leu anyway)."},{"id":"p4","prompt":"Start: the strip shows UGG · UAA. Which tRNA reads UAA?","options":[{"t":"One with anticodon \u003cspan class=\"tr-sq\">5′-UUA-3′\u003c/span>","_n":"10e7a","_k":"5539c7c2"},{"t":"None: stop codons have no tRNA","_n":"11f6a","_k":"98fc77ac"},{"t":"Any tRNA by wobble","_n":"12f5a","_k":"e4bb0edb"},{"t":"One carrying Met","_n":"137ca","_k":"5b11722b"}],"explain":"Only 61 codons have tRNAs. A protein called a release factor reads stop codons."}],"chalIntro":"Use the three modes to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Charge the tRNA that reads \u003cspan class=\"tr-sq\">5′-UGG-3′\u003c/span> and place it on the strip.","why":"tRNA \u003cspan class=\"tr-sq\">5′-CCA-3′\u003c/span> pairs as \u003cspan class=\"tr-sq\">3′-ACC-5′\u003c/span> under UGG, and the tryptophan synthetase loaded its Trp using one ATP.","general":"Pick the tRNA at the charging station, load its amino acid, then choose a strip with UGG in Wobble reader and tap UGG to place it.","msgs":{"acc":"ACC is the complement written the same way round. Flip it: \u003cspan class=\"tr-sq\">5′-CCA-3′\u003c/span>.","wrongTrna":"The tryptophan synthetase rejects that tRNA: its anticodon doesn’t read a Trp codon.","uncharged":"Load the tRNA with its amino acid at the charging station first.","strip":"Choose a strip that has UGG on it in Wobble reader, then tap UGG to place the tRNA.","place":"Now tap UGG in Wobble reader to place the charged tRNA."},"hints":["Write the complement of UGG, then turn it around.","Complement: ACC, running 3′ → 5′.","\u003cspan class=\"tr-sq\">5′-CCA-3′\u003c/span>, loaded with Trp."]},{"id":"tc2","goal":4,"prompt":"Find one tRNA that reads all three codons CUU, CUC and CUA.","why":"Inosine at the wobble position pairs with U, C and A, so \u003cspan class=\"tr-sq\">5′-IAG-3′\u003c/span> (charged with Leu) reads CUU, CUC and CUA.","general":"The tRNA in hand must read CUU, CUC and CUA and carry the right amino acid. Use the wobble base chips in Wobble reader to try other 5′ bases.","msgs":{"gag":"G at the wobble position reads C and U, but not A.","uag":"U reads A and G, not U or C.","aa":"CU_ codons are leucine.","uncharged":"Charge it with its amino acid at the charging station."},"hints":["The first two codon bases are the same, so the anticodon’s 3′ and middle bases are fixed: …AG-3′.","You need a wobble base that pairs with U, C \u003cstrong>and\u003c/strong> A.","Inosine: \u003cspan class=\"tr-sq\">5′-IAG-3′\u003c/span>."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Use the fewest tRNAs to read all four glycine codons: GGU, GGC, GGA and GGG.","why":"Two Gly-tRNAs are enough: for example ICC (reads GGU, GGC, GGA) with CCC (reads GGG).","general":"Choose the strip GGU · GGC · GGA · GGG in Wobble reader, then place charged Gly-tRNAs on it.","msgs":{"ione":"I reads U, C and A, but not G: GGG is left over.","gc":"Nothing reads GGA.","many":"That works, but two can do it.","strip":"Choose the strip GGU · GGC · GGA · GGG in Wobble reader, then place Gly-tRNAs on it.","gly":"Each tRNA on the strip must carry glycine: load it at the charging station first.","none":"Place charged Gly-tRNAs on the strip first: a tRNA counts once it pairs 3 of 3 with a codon.","left":"Nothing reads "},"hints":["Every anticodon ends …CC-3′. Only the wobble base changes.","Which wobble base reads the most codons? Which codon does it miss?","I covers U, C and A; add C (reads G) or U (reads A and G). Or pair G with U."]}]},"part3":{"slug":"matching","name":"Matching","heading":"Codon–anticodon matching","intro":"Three stations: write anticodons both ways, read the evidence that tRNA is an adapter, and count how many tRNAs wobble saves.","s1":{"title":"Station 1: Write it both ways","text":"A codon appears (5′ → 3′). Build its anticodon in both boxes: tap a slot, then a base. The pairing lines draw only when both are right.","codons":["AUG","GCA","UUC","CAG","UGG","AAU"],"box1":"As it pairs (3′ → 5′)","box2":"Written 5′ → 3′","msgs":{"t":"tRNA is RNA: it uses U, never T.","box1":"Pair each base under the codon: A–U, U–A, G–C, C–G.","same":"Pairing is antiparallel. The complement runs 3′ → 5′, so written 5′ → 3′ it reads the other way round.","box2":"Read the top box backwards, starting from its 5′ end.","empty":"Fill all six slots first."},"good":"Both ways are right."},"s2":{"title":"Station 2: The adapter experiment","text":"In 1962, researchers loaded tRNA\u003csup>Cys\u003c/sup> with radioactive cysteine, then chemically changed the cysteine to alanine while it sat on the tRNA. They added it to a system translating an mRNA rich in UGU (a Cys codon) and measured which amino acid entered the protein.","head":["Amino acid on the tRNA","Codon read","Amino acid found in the protein"],"rows":[["Cysteine (normal)","UGU","Cysteine"],["Alanine (changed)","UGU","Alanine"]],"ask":"Build the conclusion: tap a claim, the evidence and the reasoning, in an order that makes sense, then press Check.","chips":[{"id":"c","role":"Claim","t":"The ribosome reads the anticodon, not the amino acid.","good":true},{"id":"e","role":"Evidence","t":"Row 2: alanine on tRNA\u003csup>Cys\u003c/sup> went in at UGU, a cysteine codon.","good":true},{"id":"r","role":"Reasoning","t":"The anticodon was unchanged, so pairing was unchanged.","good":true},{"id":"xc","role":"Claim","t":"The ribosome checks the amino acid before adding it.","fb":"The synthetase attaches the amino acid. The ribosome only checks codon–anticodon pairing, so a wrongly loaded tRNA delivers the wrong amino acid."},{"id":"xe","role":"Evidence","t":"Row 1: cysteine went in at UGU.","fb":"Row 1 is the normal result. Only row 2, with the changed amino acid, tests the idea."},{"id":"xr","role":"Reasoning","t":"The synthetase changed the anticodon to match alanine.","fb":"The anticodon was untouched; only the amino acid was changed."}],"need":"Use exactly three chips: one claim, one piece of evidence and one reason.","order":"Those are the right chips. Put the claim first or last, so the evidence and the reasoning lead to it or back it up.","good":"Claim, evidence and reasoning agree: the ribosome trusts the pairing, so whatever amino acid the tRNA carries goes in."},"s3":{"title":"Station 3: Wobble counts","text":"Pick a four-codon family. Compare how many tRNAs a cell would need with no wobble and with wobble.","families":[{"id":"gly","aa":"Gly","codons":["GGU","GGC","GGA","GGG"],"set":["ICC","CCC"]},{"id":"ala","aa":"Ala","codons":["GCU","GCC","GCA","GCG"],"set":["IGC","CGC"]},{"id":"val","aa":"Val","codons":["GUU","GUC","GUA","GUG"],"set":["IAC","CAC"]},{"id":"pro","aa":"Pro","codons":["CCU","CCC","CCA","CCG"],"set":["IGG","CGG"]},{"id":"thr","aa":"Thr","codons":["ACU","ACC","ACA","ACG"],"set":["IGU","CGU"]}],"all":"All 61 sense codons","allNo":"61 tRNAs","allYes":"fewer than 61","note":"The exact minimum depends on the organism, so no single number is given."},"quickCheck":{"title":"Quick check","summary":"Codon–anticodon matching quick check","items":[{"id":"q1","goal":3,"prompt":"Codon \u003cspan class=\"tr-sq\">5′-CAG-3′\u003c/span>. Anticodon written 5′ → 3′?","choices":[{"t":"CUG","fb":"Right: the complement GUC runs 3′ → 5′; flipped, it’s \u003cspan class=\"tr-sq\">5′-CUG-3′\u003c/span>.","_n":"147da","_k":"fd54978c"},{"t":"CAG","fb":"The complement GUC runs 3′ → 5′; flipped, it’s \u003cspan class=\"tr-sq\">5′-CUG-3′\u003c/span>.","_n":"157aa","_k":"ca3bda33"},{"t":"GTC","fb":"The complement GUC runs 3′ → 5′; flipped, it’s \u003cspan class=\"tr-sq\">5′-CUG-3′\u003c/span>.","_n":"167ba","_k":"6140ba7f"},{"t":"GUC","fb":"The complement GUC runs 3′ → 5′; flipped, it’s \u003cspan class=\"tr-sq\">5′-CUG-3′\u003c/span>.","_n":"1778a","_k":"e35c5c5c"}]},{"id":"q2","goal":5,"prompt":"In the adapter experiment, why did alanine end up at a cysteine codon?","choices":[{"t":"The anticodon still paired with UGU","fb":"Right: the ribosome trusts the pairing.","_n":"1879a","_k":"1197e235"},{"t":"The synthetase fixed it","fb":"The ribosome trusts the pairing.","_n":"1976a","_k":"fa4b3418"},{"t":"UGU codes Ala","fb":"The ribosome trusts the pairing.","_n":"1a77a","_k":"f40a27fd"},{"t":"The ribosome changed it","fb":"The ribosome trusts the pairing.","_n":"1b74a","_k":"b5a8bc91"}]},{"id":"q3","goal":4,"prompt":"Which anticodon base sits in the wobble position?","choices":[{"t":"Its 3′ base","fb":"It pairs with the codon’s third (3′) base.","_n":"1c75a","_k":"d64e3849"},{"t":"Any base","fb":"It pairs with the codon’s third (3′) base.","_n":"1de2a","_k":"4b7966c7"},{"t":"Its middle base","fb":"It pairs with the codon’s third (3′) base.","_n":"1ee1a","_k":"fbb6b2c5"},{"t":"Its 5′ base","fb":"Right: it pairs with the codon’s third (3′) base.","_n":"1fe4a","_k":"27f87664"}]},{"id":"q4","goal":4,"prompt":"Anticodon \u003cspan class=\"tr-sq\">5′-IGC-3′\u003c/span> reads how many codons?","choices":[{"t":"1","fb":"I pairs with U, C and A: GCU, GCC and GCA (all Ala).","_n":"1ge3a","_k":"cdf1f3a9"},{"t":"2","fb":"I pairs with U, C and A: GCU, GCC and GCA (all Ala).","_n":"1he6a","_k":"82654cf7"},{"t":"3","fb":"Right: I pairs with U, C and A: GCU, GCC and GCA (all Ala).","_n":"1ie5a","_k":"911a6bba"},{"t":"4","fb":"I pairs with U, C and A: GCU, GCC and GCA (all Ala).","_n":"1je8a","_k":"7f0810e7"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Codon ↔ anticodon","summary":"Codon ↔ anticodon","goal":3,"instruction":"Tap a codon, then tap the anticodon that pairs with it. Anticodons are written 5′ → 3′.","leftTitle":"Codon (5′ → 3′)","rightTitle":"Anticodon (5′ → 3′)","left":[{"id":"l1","t":"\u003cspan class=\"tr-sq\">AUG\u003c/span>","why":"The complement UAC runs 3′ → 5′, so written 5′ → 3′ the anticodon is CAU."},{"id":"l2","t":"\u003cspan class=\"tr-sq\">UGG\u003c/span>","why":"The complement ACC runs 3′ → 5′, so written 5′ → 3′ the anticodon is CCA."},{"id":"l3","t":"\u003cspan class=\"tr-sq\">GCA\u003c/span>","why":"The complement CGU runs 3′ → 5′, so written 5′ → 3′ the anticodon is UGC.","hints":["Complement of GCA?","CGU, running 3′ → 5′.","Reverse it: \u003cspan class=\"tr-sq\">5′-UGC-3′\u003c/span>."]},{"id":"l4","t":"\u003cspan class=\"tr-sq\">UUC\u003c/span>","why":"The complement AAG runs 3′ → 5′, so written 5′ → 3′ the anticodon is GAA."},{"id":"l5","t":"\u003cspan class=\"tr-sq\">CAG\u003c/span>","why":"The complement GUC runs 3′ → 5′, so written 5′ → 3′ the anticodon is CUG."},{"id":"l6","t":"\u003cspan class=\"tr-sq\">AAU\u003c/span>","why":"The complement UUA runs 3′ → 5′, so written 5′ → 3′ the anticodon is AUU."},{"id":"l7","t":"\u003cspan class=\"tr-sq\">GGC\u003c/span>","why":"The complement CCG runs 3′ → 5′, so written 5′ → 3′ the anticodon is GCC."},{"id":"l8","t":"\u003cspan class=\"tr-sq\">UAC\u003c/span>","why":"The complement AUG runs 3′ → 5′, so written 5′ → 3′ the anticodon is GUA.","hints":["Complement of UAC?","AUG, running 3′ → 5′.","\u003cspan class=\"tr-sq\">5′-GUA-3′\u003c/span>."]}],"right":[{"id":"r1","t":"\u003cspan class=\"tr-sq\">CAU\u003c/span>"},{"id":"r2","t":"\u003cspan class=\"tr-sq\">CCA\u003c/span>"},{"id":"r3","t":"\u003cspan class=\"tr-sq\">UGC\u003c/span>"},{"id":"r4","t":"\u003cspan class=\"tr-sq\">GAA\u003c/span>"},{"id":"r5","t":"\u003cspan class=\"tr-sq\">CUG\u003c/span>"},{"id":"r6","t":"\u003cspan class=\"tr-sq\">AUU\u003c/span>"},{"id":"r7","t":"\u003cspan class=\"tr-sq\">GCC\u003c/span>"},{"id":"r8","t":"\u003cspan class=\"tr-sq\">GUA\u003c/span>"}],"_a":"QxdeUkYKGkMJFx5BCAIaCxpHAEFIElQCGg8QEVcSFBNUARBZRkIMExQXXlZGChpDDRceQQgGGgsaRwRBSBJUBhoPEBFTEhQTVA0QWUZCABNF","wrongDefault":"Write the complement, then reverse it."},{"id":"wobble","type":"custom","title":"Wobble puzzles","summary":"Wobble puzzles","star":true,"goal":[4,5],"how":"","instruction":"Six puzzles. Puzzles 3 to 6 are non-routine (★); the last two go beyond the Final Check.","card":"\u003cstrong>Wobble rules (simplified)\u003c/strong>: anticodon 5′ base → codon 3′ base: G → C or U · U → A or G · I → U, C or A · C → G only · A → U only.","items":[{"id":"w1","kind":"pick","goal":4,"prompt":"Which codons does \u003cspan class=\"tr-sq\">5′-GAA-3′\u003c/span> read?","chips":["UUU","UUC","UUA","UUG"],"_a":"YxdnNicSFBNtYGdBOQ==","display":"UUC, UUU","why":"G at the wobble position pairs with C or U.","wrong":[{"match":["UUA","UUC","UUG","UUU"],"fb":"G reads C or U only."}]},{"id":"w2","kind":"pick","goal":4,"prompt":"Which codons does \u003cspan class=\"tr-sq\">5′-UCA-3′\u003c/span> read, and what goes wrong?","chips":["UGU","UGC","UGA","UGG"],"_a":"YxdnJCUSFBNtcnVBOQ==","display":"UGA and UGG","why":"It would read a stop codon (UGA) as well as Trp.","also":{"q":"What goes wrong?","options":[{"t":"It would read a stop codon (UGA) as well as Trp (UGG).","_n":"1ke7a","_k":"cabdea56"},{"t":"Nothing: every codon it reads is Trp.","_n":"1leaa","_k":"d34169fc"}],"fb":"UGA is a stop codon."},"wrong":[{"match":["UGG"],"fb":"U at the wobble position reads A \u003cstrong>and\u003c/strong> G. A real Trp tRNA uses C (\u003cspan class=\"tr-sq\">5′-CCA-3′\u003c/span>) so it never reads UGA."}]},{"id":"w3","kind":"num","goal":4,"star":true,"prompt":"Fewest tRNAs to read the six serine codons UCU, UCC, UCA, UCG, AGU, AGC?","_a":"Cw==","unit":"tRNAs","display":"3","why":"IGA (UCU, UCC, UCA) + CGA (UCG) + GCU (AGU, AGC) = 3.","wrong":[{"match":2,"fb":"The UC_ box needs two (I can’t read G); AGU/AGC need a third."},{"match":6,"fb":"Use wobble."}],"hints":["Split the six codons into the UC_ box and the AG_ pair.","One tRNA can cover three of UC_, but not all four.","IGA (UCU, UCC, UCA) + CGA (UCG) + GCU (AGU, AGC) = 3."]},{"id":"w4","kind":"num","goal":4,"star":true,"prompt":"Fewest tRNAs to read all six leucine codons?","_a":"Cw==","unit":"tRNAs","display":"3","why":"Two for the CU_ box; one with U at the wobble position (\u003cspan class=\"tr-sq\">5′-UAA-3′\u003c/span>) for UUA and UUG.","general":"The CU_ box needs 2; UUA and UUG share one tRNA with U at the wobble position (\u003cspan class=\"tr-sq\">5′-UAA-3′\u003c/span>)."},{"id":"w5","kind":"pick","goal":5,"star":true,"prompt":"A tRNA carries Ile and has anticodon \u003cspan class=\"tr-sq\">5′-IAU-3′\u003c/span>. List every codon it reads. Is "Antiparallel strands can’t share the same 5′ end.","_n":"1o719","_k":"24a28341"},{"t":"\u003cspan class=\"tr-sq\">5′-GCA-3′\u003c/span>.","why":"That’s the codon itself.","_n":"1p729","_k":"de4541c1"},{"t":"The complement runs 3′ → 5′: \u003cspan class=\"tr-sq\">3′-CGU-5′\u003c/span>, which is \u003cspan class=\"tr-sq\">5′-UGC-3′\u003c/span>.","why":"Pairing is antiparallel. The complement CGU runs 3′ → 5′, so written 5′ → 3′ the anticodon is UGC.","_n":"1q739","_k":"067e8ef6"},{"t":"\u003cspan class=\"tr-sq\">5′-CGT-3′\u003c/span>.","why":"tRNA is RNA: it uses U, never T.","_n":"1r749","_k":"1ba6e299"}],"hints":["Which way does the anticodon run when it pairs?","3′ → 5′.","\u003cspan class=\"tr-sq\">5′-UGC-3′\u003c/span>."]},{"id":"e2","goal":2,"task":"Explain how a tRNA ends up carrying the right amino acid.","steps":["Each amino acid has its own aminoacyl-tRNA synthetase.","The synthetase binds its amino acid and an ATP.","It recognizes the matching tRNAs and attaches the amino acid to the 3′ end.","At the ribosome, the amino acid is checked against the codon before it is added.","So mistakes in charging are always caught."],"_a":"Cw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","This follows from step 4, which is wrong."],"fixes":[{"t":"Step 4 is correct.","why":"The 1962 alanine-on-tRNA\u003csup>Cys\u003c/sup> result shows otherwise.","_n":"1s759","_k":"4777f321"},{"t":"At the ribosome, the anticodon chooses the amino acid.","why":"The synthetase attaches the amino acid. The ribosome only checks codon–anticodon pairing, so a wrongly loaded tRNA delivers the wrong amino acid.","_n":"1t769","_k":"a4246eb1"},{"t":"At the ribosome, only the anticodon is checked against the codon; the amino acid is added whatever it is.","why":"The synthetase attaches the amino acid. The ribosome only checks codon–anticodon pairing, so a wrongly loaded tRNA delivers the wrong amino acid.","_n":"1u779","_k":"d9034ce6"},{"t":"Charging happens at the ribosome.","why":"Charging happens before, at the synthetase.","_n":"1v689","_k":"0e30dafe"}],"hints":["Which experiment tested this?","Ala on a Cys tRNA was added at a Cys codon.","Only pairing is checked."]},{"id":"e3","goal":4,"task":"How many codons can the tRNA with anticodon \u003cspan class=\"tr-sq\">5′-GCU-3′\u003c/span> read?","steps":["The wobble base is the anticodon’s 3′ base, U.","U at the wobble position pairs with A or G.","So it reads 2 codons."],"_a":"CA==","stepFb":["","This would be right for U, but step 1 chose the wrong base.","The count happens to be 2, but for the wrong reason, and the codons would be wrong."],"fixes":[{"t":"The wobble base is the anticodon’s 5′ base, G. G pairs with C or U, so it reads AGC and AGU (both Ser).","why":"Wobble happens at the codon’s \u003cstrong>third\u003c/strong> base, which pairs with the anticodon’s \u003cstrong>5′\u003c/strong> base.","_n":"1w699","_k":"6d2eb32d"},{"t":"Step 1 is correct.","why":"The codon’s third base pairs with the anticodon’s 5′ base.","_n":"1x76a","_k":"e4ff41ed"},{"t":"There is no wobble; it reads only AGC.","why":"G at the wobble position pairs with U as well as C, so it reads AGU too.","_n":"1y75a","_k":"e814deab"},{"t":"The wobble base is the middle base, C.","why":"Wobble happens at the codon’s \u003cstrong>third\u003c/strong> base, which pairs with the anticodon’s \u003cstrong>5′\u003c/strong> base.","_n":"1z74a","_k":"3a40f159"}],"hints":["Line up codon 5′ → 3′ with anticodon 3′ → 5′.","The codon’s third base faces the anticodon’s 5′ base.","G: AGC and AGU."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: that the ribosome doesn’t check the amino acid, or that one tRNA can read three codons?"},{"id":"j2","q":"In your own words, why is tRNA called an “adapter”?"},{"id":"j3","q":"Explain to a friend how to write the anticodon for a codon without getting the direction wrong."},{"id":"j4","q":"Which part still feels shaky (direction, wobble or charging)? Wha e is the codon’s \u003cstrong>third\u003c/strong> base, not its first.","_n":"2oe79","_k":"4e67c2ec"},{"t":"CCU, CCC, CCA and CCG","why":"I doesn’t pair with G.","_n":"2pf29","_k":"8949701b"},{"t":"CCC only","why":"That ignores wobble.","_n":"2qf19","_k":"4ad7f509"},{"t":"CCU, CCC and CCA","why":"The codon starts CC; I pairs with U, C or A at the third base. All three are Pro.","_n":"2r589","_k":"d91232e1"}]},"b":{"prompt":"A tRNA has the anticodon \u003cspan class=\"tr-sq\">5′-IAU-3′\u003c/span>. Which codons can it read?","options":[{"t":"AUU, AUC and AUA","why":"All three are Ile.","_n":"2s579","_k":"85900e03"},{"t":"AUU, AUC, AUA and AUG","why":"I doesn’t pair with G, so AUG (Met) isn’t read.","_n":"2t569","_k":"ef3c1e52"},{"t":"UUA, CUA and AUA","why":"Wobble happens at the codon’s \u003cstrong>third\u003c/strong> base, which pairs with the anticodon’s \u003cstrong>5′\u003c/strong> base.","_n":"2u559","_k":"5bc238b0"},{"t":"AUA only","why":"That ignores wobble.","_n":"2v549","_k":"8c66367e"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A faulty synthetase loads phenylalanine onto a tRNA whose anticodon reads the lysine codon AAA. The mRNA is \u003cspan class=\"tr-sq\">5′-AUG AAA UUU UAA-3′\u003c/span>. What polypeptide is made?","options":[{"t":"Met–Lys–Lys","why":"UUU codes Phe.","_n":"2w539","_k":"d71593e0"},{"t":"Met–Phe–Phe","why":"AAA receives the mis-loaded Phe; UUU is Phe anyway; UAA stops.","_n":"2x529","_k":"6fc1f8ad"},{"t":"Met–Phe","why":"UUU still adds a Phe before the stop.","_n":"2y519","_k":"da2cd2d0"},{"t":"Met–Lys–Phe","why":"The ribosome can’t tell the amino acid is wrong.","_n":"2z609","_k":"472f79e3"}]},"b":{"prompt":"A faulty synthetase loads alanine onto a tRNA whose anticodon reads the glycine codon GGU. The mRNA is \u003cspan class=\"tr-sq\">5′-AUG GGU GCU UGA-3′\u003c/span>. What polypeptide is made?","options":[{"t":"Met–Ala–Ala","why":"GGU receives the mis-loaded Ala; GCU is Ala anyway.","_n":"305f9","_k":"e798b0aa"},{"t":"Met–Gly–  only, and only within limits.","_n":"3d66a","_k":"5c916e24"},{"t":"“It connects two languages: its anticodon pairs with an mRNA codon, and its 3′ end carries the amino acid that codon stands for, loaded by a matching synthetase.”","why":"One end reads, the other end carries.","_n":"3e65a","_k":"e0042001"},{"t":"“It adapts the mRNA so the ribosome can read it.”","why":"It doesn’t change the mRNA.","_n":"3f60a","_k":"783c9860"}]},"b":{"prompt":"Which is the best explanation of why charging errors are dangerous for a cell?","options":[{"t":"“The mRNA will be changed.”","why":"Charging doesn’t touch the mRNA.","_n":"3g5fa","_k":"db487bea"},{"t":"“The tRNA’s anticodon will change to match.”","why":"The synthetase attaches the amino acid. The ribosome only checks codon–anticodon pairing, so a wrongly loaded tRNA delivers the wrong amino acid.","_n":"3h62a","_k":"fb40b8dc"},{"t":"“The ribosome checks only codon–anticodon pairing, so a wrong amino acid on a tRNA goes straight into the protein.”","why":"The synthetase attaches the amino acid. The ribosome only checks codon–anticodon pairing, so a wrongly loaded tRNA delivers the wrong amino acid.","_n":"3i61a","_k":"376454d1"},{"t":"“The ribosome will stop translating.”","why":"It doesn’t notice the error.","_n":"3j5ca","_k":"5fe8295e"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which labelled sketch is correct?","options":[{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-AUG-3′\u003c/span> paired with anticodon \u003cspan class=\"tr-sq\">3′-UAC-5′\u003c/span>\u003c/span>\u003cspan>Met on the anticodon loop\u003c/span>\u003c/span>","why":"The amino acid is attached at the 3′ end (…CCA), about 7 nm from the anticodon, at the other end of the L.","_n":"3k5ba","_k":"de2fdf22"},{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-AUG-3′\u003c/span> paired with anticodon \u003cspan class=\"tr-sq\">5′-UAC-3′\u003c/span>\u003c/span>\u003c/span>","why":"Pairing is antiparallel: write the complement, then reverse it so it reads 5′ → 3′.","_n":"3l5e9","_k":"25d58f12"},{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-AUG-3′\u003c/span> (top) paired with anticodon \u003cspan class=\"tr-sq\">3′-UAC-5′\u003c/span> (bottom)\u003c/span>\u003cspan>Met on the tRNA’s 3′ end, at the far end of the L from the anticodon\u003c/span>\u003c/span>","why":"Antiparallel pairing, U (not T), and the amino acid at the 3′ end.","_n":"3m5f9","_k":"9a50caa3"},{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-ATG-3′\u003c/span> paired with anticodon \u003cspan class=\"tr-sq\">3′-TAC-5′\u003c/span>\u003c/span>\u003c/span>","why":"tRNA is RNA: it uses U, never T.","_n":"3n5c9","_k":"ba2e2522"}]},"b":{"prompt":"Which labelled sketch is correct?","options":[{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-UGG-3′\u003c/span> paired with anticodon \u003cspan class=\"tr-sq\">3′-ACC-5′\u003c/span>\u003c/span>\u003cspan>Trp on the anticodon loop\u003c/span>\u003c/span>","why":"The amino acid is attached at the 3′ end (…CCA), about 7 nm from the anticodon, at the other end of the L.","_n":"3o5d9","_k":"4afca144"},{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-UGG-3′\u003c/span> paired with anticodon \u003cspan class=\"tr-sq\">3′-ACC-5′\u003c/span>\u003c/span>\u003cspan>Trp on the tRNA’s 3′ end\u003c/span>\u003c/span>","why":"Antiparallel pairing, U (not T), and the amino acid at the 3′ end.","_n":"3p629","_k":"3e10d25f"},{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-UGG-3′\u003c/span> paired with anticodon \u003cspan class=\"tr-sq\">5′-ACC-3′\u003c/span>\u003c/span>\u003c/span>","why":"Pairing is antiparallel: write the complement, then reverse it so it reads 5′ → 3′.","_n":"3q639","_k":"d45a4a38"},{"t":"\u003cspan class=\"tr-sk\">\u003cspan>Codon \u003cspan class=\"tr-sq\">5′-TGG-3′\u003c/span> paired with anticodon \u003cspan class=\"tr-sq\">3′-ACC-5′\u003c/span>\u003c/span>\u003c/span>","why":"tRNA is RNA: it uses U, never T.","_n":"3r609","_k":"63bbb46c"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"The antibiotic mupirocin, used in skin ointments, blocks the bacterial synthetase that loads isoleucine. Why does this stop bacterial growth?","options":[{"t":"Ribosomes add a different amino acid instead, which the bacteria can’t detect.","why":"No other synthetase loads Ile-tRNAs, so nothing arrives.","_n":"3s619","_k":"07aabed8"},{"t":"Without Ile-tRNAs, ribosomes stall at isoleucine codons, so the bacteria can’t finish their proteins.","why":"No charged Ile-tRNAs arrive at Ile codons.","_n":"3t569","_k":"7a7683ae"},{"t":"The bacteria run out of ATP.","why":"Charging uses ATP, but blocking one synthetase doesn’t drain it.","_n":"3u579","_k":"3f75c885"},{"t":"The bacteria’s mRNA can no longer be made.","why":"Transcription is untouched.","_n":"3v609","_k":"9a6cb568"}]},"b":{"prompt":"A new drug blocks the bacterial synthetase that loads threonine, but not the human version. Why could it be a useful antibiotic?","options":[{"t":"It changes the bacteria’s threonine codons.","why":"Drugs that block enzymes don’t edit DNA.","_n":"3w5f9","_k":"bfd6b212"},{"t":"Bacteria can’t charge Thr-tRNAs, so their ribosomes stall at Thr codons, while human cells keep translating.","why":"Only the bacterial enzyme is blocked.","_n":"3x5e9","_k":"c1f43991"},{"t":"Human cells don’t use threonine.","why":"They do; the human enzyme is just different enough not to be blocked.","_n":"3y5d9","_k":"008b66a2"},{"t":"It makes bacterial ribosomes read Thr codons as stops.","why":"Stops need release factors; this just stalls.","_n":"3z649","_k":"63b5c5d0"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Scientists add a new tRNA with the anticodon \u003cspan class=\"tr-sq\">5′-CUA-3′\u003c/span>, plus a synthetase that loads an unusual amino acid X onto it. Which codon in an mRNA will now receive X
