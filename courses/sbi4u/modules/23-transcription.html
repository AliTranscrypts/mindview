.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 23 Transcription. Roles (course plan §3): template --ink, coding strand --ink-2, mRNA teal --bio-nadh,
   introns --ink-2 at 30 %, amino acids brown --bio-carbon. */
.tx-sq{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;font-size:.95em;letter-spacing:.02em;white-space:nowrap}
.tx-rsq{white-space:normal;word-break:break-all}
.tx-u{color:var(--bio-nadh);font-weight:800;text-decoration:underline;text-underline-offset:2px}
.tx-aa{color:var(--bio-carbon);font-weight:700}
.tx-mr{color:var(--bio-nadh)}
/* hero */
.hero .hero-eq .tx-heq{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.2;font-size:.85em}
.tx-heq .tx-sq{font-size:1em}
.tx-hc{color:var(--ink-2)}
.tx-ht{color:var(--ink);font-weight:700}
.tx-hm{color:var(--bio-nadh)}
.tx-hm b{text-decoration:underline;text-underline-offset:3px}
.tx-hero{max-width:480px;margin:0 auto}
.tx-hero svg{width:100%;height:auto;display:block}
/* SVG text and shapes */
.tx-sl{font:500 10.5px/1 system-ui,sans-serif;fill:var(--ink-2)}
.tx-bl{font:700 10.5px/1 system-ui,sans-serif;fill:var(--ink)}
.tx-mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.tx-b{font:500 14px/1 ui-monospace,Menlo,Consolas,monospace}
.tx-b.tx-r-tpl{fill:var(--ink);font-weight:800}
.tx-b.tx-r-cod,.tx-b.tx-r-un{fill:var(--ink-2)}
.tx-bb{fill:none;stroke-width:2.4;stroke-linejoin:round}
.tx-bb.tx-r-tpl{stroke:var(--ink);stroke-width:3.2}
.tx-bb.tx-r-cod,.tx-bb.tx-r-un{stroke:var(--ink-2)}
.tx-hb{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.tx-rung{stroke:var(--ink-2);stroke-width:1.4;opacity:.75}
.tx-end{font:700 11px/1 system-ui,sans-serif;fill:var(--ink-2)}
.tx-mend{fill:var(--bio-nadh)}
.tx-m{font:600 14px/1 ui-monospace,Menlo,Consolas,monospace;fill:var(--bio-nadh)}
.tx-mu{font-weight:900;text-decoration:underline}
.tx-mbb,.tx-mline{stroke:var(--bio-nadh);stroke-width:3;stroke-linecap:round}
.tx-mtxt{fill:var(--bio-nadh)}
.tx-hmr{fill:none;stroke:var(--bio-nadh);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.tx-intr{fill:var(--ink-2);opacity:.3}
.tx-prom{fill:var(--hi-soft);stroke:var(--hi);stroke-width:1.5}
.tx-term{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4}
.tx-arr{fill:none;stroke:var(--ink);stroke-width:2.2}
.tx-arrh{fill:var(--ink)}
.tx-pol{fill:var(--ink-2);fill-opacity:.16;stroke:var(--ink-2);stroke-width:1.6}
.tx-poll{font:700 10.5px/1 system-ui,sans-serif;fill:var(--ink)}
.tx-capc{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.tx-rib{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.tx-nuc{fill:var(--ink-2);opacity:.55}
.tx-barbg{fill:none;stroke:var(--rule);stroke-width:1.2}
.tx-bar{fill:var(--bio-nadh)}
.tx-dna{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
/* Explore */
.tx-path{display:flex;flex-wrap:wrap;gap:.3rem;list-style:none;margin:0 0 .5rem;padding:0;font-size:.82rem}
.tx-path li{border:1px solid var(--rule);border-radius:999px;padding:.15rem .6rem;color:var(--ink-2)}
.tx-path li.done{border-color:var(--green);color:var(--ink)}
.tx-path li.cur{border-color:var(--pen);color:var(--ink);font-weight:700}
.tx-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
#tx-svg{display:block;width:100%;height:auto;margin:0 auto}
.tx-key{display:flex;flex-wrap:wrap;gap:.8rem;margin:.4rem 0 0}

.tx-kc::before{background:var(--ink-2)}
.tx-km::before{background:var(--bio-nadh)}
.tx-ki::before{background:var(--ink-2);opacity:.3;height:.8em;vertical-align:-.05em}
.tx-cap{min-height:1.4em;margin:.5rem 0 0;font-size:.92rem}
.tx-player{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.pg-ctrl .tx-sw{margin-top:.5rem}
.tx-sw b{margin-left:.2em}
.tx-sw[aria-checked="true"]{border-color:var(--pen)}
.tx-read dd{min-width:0}
.tx-proc{margin-top:.8rem;border-top:1px solid var(--rule);padding-top:.6rem}
.tx-ph{margin:0 0 .4rem;font-size:1rem}
.tx-pbtns{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}
.tx-segs{display:flex;flex-wrap:wrap;gap:.3rem;align-items:stretch;margin:.4rem 0}
.tx-seg{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.15rem;min-height:44px;padding:.3rem .5rem;border-radius:8px;border:2px solid var(--bio-nadh);background:var(--sheet);color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer;transition:opacity .45s,transform .45s}
.tx-seg .tx-sq{color:var(--bio-nadh);font-size:.9rem}
.tx-seg.tx-in{border-color:var(--ink-2);border-style:dashed;background:color-mix(in srgb,var(--ink-2) 30%,var(--sheet))}
.tx-seg.tx-in .tx-sq{color:var(--ink)}
.tx-seg.off{border-style:dotted;opacity:.75;text-decoration:line-through}
.tx-seg.gone{border-style:dotted;background:var(--sheet);color:var(--ink-2);min-height:44px}
.tx-seg.cutting{opacity:0;transform:translateY(-14px) scale(.6)}
.tx-seg:disabled{cursor:default}
.tx-sgl{font-size:.75rem;font-weight:700;color:var(--ink-2)}
.tx-capg,.tx-tailg{display:inline-flex;align-items:center;padding:.2rem .45rem;border-radius:8px;border:2px solid var(--ink);font-size:.8rem;font-weight:700}
.tx-tailg{border-color:var(--bio-nadh);color:var(--bio-nadh);font-family:ui-monospace,Menlo,Consolas,monospace}
.tx-pmsg{min-height:1.3em;margin:.2rem 0;font-size:.9rem}
.tx-mat{margin:.2rem 0 0}
/* Part 3 */
.tx-p3 .tx-st{border-top:1px solid var(--rule);padding-top:.8rem;margin-top:1rem}
.tx-p3 h3{margin:.2rem 0 .4rem;font-size:1.08rem}
.tx-card{background:var(--info-bg);border-radius:8px;padding:.55rem .75rem;margin:.6rem 0}
.tx-out{min-height:1.4em}
.tx-s1fig,.tx-s5fig{max-width:520px}
.tx-s1fig svg,.tx-s5fig svg{width:100%;height:auto;display:block}
.tx-nts{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin:.5rem 0}
.tx-nt{min-width:26px;height:32px;padding:0;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);color:var(--bio-nadh);font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.tx-nt.in{background:color-mix(in srgb,var(--ink-2) 30%,var(--sheet));color:var(--ink)}
.tx-nt.start,.tx-nt.endm{outline:2px solid var(--pen);outline-offset:1px}
.tx-nt:disabled{cursor:default}
.tx-exrow{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0}
.tx-exb{border:2px solid var(--bio-nadh);border-radius:8px;padding:.25rem .5rem;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.tx-exb.off{border-style:dotted;opacity:.6}
.tx-found{font-size:.92rem}
.tx-hq{margin-top:.6rem}
/* Practice */
.tx-seqrow{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}
.tx-seqin{font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.06em;width:14ch;max-width:60vw}
.tx-unit{color:var(--ink-2)}
/* Task */
.tx-tl{margin:.5rem 0 .1rem;font-weight:700;font-size:.9rem}
.tx-tsegs .tx-seg{cursor:default;min-height:0}
.tx-tpw h4{margin:0 0 .3rem}
.tx-conds{margin:.4rem 0 0 1.2rem}
@media (prefers-reduced-motion:reduce){.tx-seg{transition:none}}

he mRNA is then trimmed and finished before it leaves the nucleus.","fig":{"html":"\u003cdiv class=\"tx-hero\" id=\"tx-hero\" role=\"img\" aria-label=\"A DNA segment with a highlighted promoter. RNA polymerase lands on the promoter and opens a bubble in the DNA. A teal mRNA strand peels off behind the polymerase, growing at its 3′ end, while the DNA rewinds behind the bubble. At the terminator the polymerase falls off and the mRNA drifts away.\">\u003c/div>"}},"goals":["I can explain which strand RNA polymerase reads, in which direction, and how the mRNA relates to the template and coding strands.","I can write the mRNA transcribed from a given template or coding strand, with 5′ and 3′ ends.","I can describe initiation, elongation and termination, including the promoter, TATA box and terminator.","I can describe pre-mRNA processing (cap, tail, splicing) and calculate mature mRNA lengths.","I can compare DNA with RNA, and transcription in prokaryotes with eukaryotes.","I can apply transcription and splicing to mutations, alternative splicing and biotechnology."],"start":{"warmup":{"questions":[{"id":"w1","skill":"DNA vs RNA","goal":5,"prompt":"Which of these is true of RNA but \u003cstrong>not\u003c/strong> DNA?","options":[{"t":"It contains uracil and the sugar ribose","why":"RNA swaps one base (U for T) and one sugar (ribose for deoxyribose).","_n":"04df","_k":"c57e6d50"},{"t":"It is always double-stranded.","why":"RNA is usually single-stranded.","_n":"14cf","_k":"9da65c0d"},{"t":"It contains thymine.","why":"Thymine is DNA’s base.","_n":"24bf","_k":"10d75887"},{"t":"It has a sugar–phosphate backbone.","why":"Both have one.","_n":"34af","_k":"c4665e95"}],"hints":["Compare the sugars and the bases.","RNA swaps one base and one sugar.","Uracil and ribose."]},{"id":"w2","skill":"DNA vs RNA","goal":5,"prompt":"Which type of RNA carries a gene’s message to the ribosome?","options":[{"t":"tRNA","why":"tRNA carries amino acids.","_n":"449f","_k":"ae27c65e"},{"t":"DNA","why":"DNA stays in the nucleus.","_n":"548f","_k":"8c32ce76"},{"t":"rRNA","why":"rRNA is part of the ribosome itself.","_n":"647f","_k":"84078fda"},{"t":"mRNA (messenger RNA)","why":"Messenger RNA carries the copy of the gene.","_n":"746f","_k":"ca6e3d5d"}],"hints":["Which word means “message”?","Messenger.","mRNA."]},{"id":"w3","skill":"Base pairing and direction","goal":2,"prompt":"Which RNA base pairs with adenine on a DNA template?","options":[{"t":"Uracil","why":"In RNA, U takes T’s place.","_n":"845f","_k":"29abf181"},{"t":"Thymine","why":"RNA doesn’t contain T.","_n":"9f0a","_k":"2c0e6841"},{"t":"Guanine","why":"G pairs with C.","_n":"af1a","_k":"934dfe1c"},{"t":"Adenine","why":"Pairs are complementary.","_n":"beea","_k":"7472f472"}],"hints":["In DNA, A pairs with T.","What replaces T in RNA?","U."]},{"id":"w4","skill":"Base pairing and direction","goal":1,"prompt":"Any polymerase builds a new nucleic acid strand in which direction?","options":[{"t":"3′ → 5′","why":"Nothing is ever built 3′ → 5′.","_n":"cefa","_k":"3e4c8180"},{"t":"From the middle outward","why":"Each chain grows only at its 3′ end.","_n":"df4a","_k":"93227c90"},{"t":"5′ → 3′","why":"It adds to the 3′ end.","_n":"ef5a","_k":"ea9b3007"},{"t":"Either, depending on the strand","why":"The rule is the same for DNA and RNA polymerase.","_n":"ff2a","_k":"c5a860f4"}],"hints":["Recall module 22.","New nucleotides join the 3′ –OH.","5′ → 3′."]},{"id":"w5","skill":"Cell structures","goal":5,"prompt":"Where does transcription happen in a eukaryotic cell?","options":[{"t":"At the ribosomes","why":"That’s translation.","_n":"gf3a","_k":"3f4b5cd0"},{"t":"In the Golgi apparatus","why":"The Golgi packages proteins.","_n":"he8a","_k":"e3a07d79"},{"t":"In the cytoplasm","why":"Prokaryotes transcribe in the cytoplasm because they have no nucleus.","_n":"ie9a","_k":"7de7470d"},{"t":"In the nucleus","why":"The DNA is there.","_n":"jeaa","_k":"c15268a9"}],"hints":["Where is the DNA kept?","Inside a membrane-bound compartment.","The nucleus."]},{"id":"w6","skill":"Cell structures","goal":5,"prompt":"Why can’t a bacterium separate transcription from translation the way a eukaryotic cell does?","options":[{"t":"It has no nucleus, so its ribosomes reach the mRNA as soon as it’s made","why":"No nuclear envelope stands between its DNA and its ribosomes.","_n":"ke9a","_k":"5def8f64"},{"t":"It makes no mRNA.","why":"Bacteria make mRNA.","_n":"le8a","_k":"c6af797d"},{"t":"It has no ribosomes.","why":"Bacteria have ribosomes (smaller ones).","_n":"me7a","_k":"c678085b"},{"t":"It has no DNA.","why":"Bacteria have DNA (one circular chromosome).","_n":"ne6a","_k":"7ac58a5d"}],"hints":["What wall separates DNA from ribosomes in your cells?","The nuclear envelope.","Bacteria don’t have one."]}],"refreshers":{"DNA vs RNA":"RNA has ribose and uracil and is usually single-stranded. mRNA carries the message, tRNA carries amino acids, rRNA builds ribosomes.","Base pairing and direction":"DNA A pairs with RNA U; T with A; G with C. All chains grow 5′ → 3′.","Cell structures":"Eukaryotes transcribe in the nucleus and translate in the cytoplasm. Prokaryotes do both in the cytoplasm, at the same time."}}},"explore":{"heading":"Transcription machine","intro":"Choose a gene, decide which strand is the template, then step RNA polymerase through the gene. In eukaryote mode, finish the message: cap it, tail it and splice it.","genes":{"P":{"name":"Gene P","coding":"ATGAAACGCTAA","dir":1},"Q":{"name":"Gene Q (further along)","coding":"ATGGGATAA","dir":-1},"E":{"name":"Gene E","dir":1,"segs":[["e","ATGGCAAAC"],["i","GTAAGCAG"],["e","TGGCAT"],["i","GTCCTTAG"],["e","GAATAA"]]}},"model":"Model genes: Gene E’s introns are only 8 nucleotides so the screen stays readable. Real introns are usually hundreds to thousands of nucleotides long.","msgs":{"refuse":"The promoter points the other way. RNA polymerase binds so that it reads this gene’s template 3′ → 5′.","notGene":"This isn’t the gene’s message.","choose":"Choose a template strand first.","readyExport":"Ready for export"},"predIntro":"Make a prediction first. Then the machine will show you what really happens.","predictions":[{"id":"p1","prompt":"Gene P; the coding strand reads \u003cspan class=\"tx-sq\">5′-ATGAAACGC…-3′\u003c/span>. The mRNA will begin…","options":[{"t":"\u003cspan class=\"tx-sq\">5′-UACUUUGCG…-3′\u003c/span>","_n":"oe5a","_k":"8bf2fdb7"},{"t":"\u003cspan class=\"tx-sq\">5′-ATGAAACGC…-3′\u003c/span>","_n":"pe4a","_k":"bb1caf45"},{"t":"\u003cspan class=\"tx-sq\">5′-AUGAAACGC…-3′\u003c/span>","_n":"qe3a","_k":"6ba78740"},{"t":"\u003cspan class=\"tx-sq\">3′-AUGAAACGC…-5′\u003c/span>","_n":"rf2a","_k":"6addc6f0"}],"explain":"Same as the coding strand, with U for T, and written 5′ → 3′.","reveal":"The mRNA grows letter by letter, matching the coding strand with U for T."},{"id":"p2","prompt":"Initiation on Gene P. What does RNA polymerase need before it starts?","options":[{"t":"Only the promoter: it unwinds the DNA and starts without a primer","_n":"sf1a","_k":"a1ccb735"},{"t":"An RNA primer from primase","_n":"t64a","_k":"19248790"},{"t":"Helicase to open the DNA first","_n":"u65a","_k":"f96a4954"},{"t":"A DNA primer","_n":"v66a","_k":"284ef070"}],"explain":"Unlike DNA polymerase, RNA polymerase can start a chain from scratch.","reveal":"Polymerase binds the promoter, opens a bubble and begins: no primer, no helicase."},{"id":"p3","prompt":"Gene E after transcription (37 nt). After both introns (8 nt each) are spliced out, how long is the coding part of the mature mRNA?","options":[{"t":"21 nt","_n":"w67a","_k":"dabef5c7"},{"t":"29 nt","_n":"x60a","_k":"bb5af0e8"},{"t":"37 nt","_n":"y61a","_k":"96217b24"},{"t":"16 nt","_n":"z62a","_k":"0809b2c8"}],"explain":"37 − 8 − 8 = 21; the exons (9 + 6 + 6) remain.","reveal":"The two grey introns are removed; the counter reads 21 nt."},{"id":"p4","prompt":"A second gene, drawn further along the same DNA, has its promoter on the other strand, pointing left. Which strand is its template?","options":[{"t":"Both strands at once","_n":"1063a","_k":"acb4d8c2"},{"t":"Neither","_n":"116ca","_k":"f7605703"},{"t":"The other strand: its promoter makes polymerase read the top strand this time","_n":"126da","_k":"58b31018"},{"t":"The same bottom strand","_n":"135ea","_k":"fe79eb52"}],"explain":"Each gene’s promoter sets the direction, so different genes can use different strands.","reveal":"Polymerase binds facing left and reads the top strand."}],"chalIntro":"Use the machine to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Transcribe Gene P so the mRNA reads \u003cspan class=\"tx-sq\">5′-AUGAAACGCUAA-3′\u003c/span>.","why":"The bottom strand is the template, so the mRNA \u003cspan class=\"tx-sq\">5′-AUGAAACGCUAA-3′\u003c/span> matches the top (coding) strand, with U for T.","general":"Choose Prokaryote mode and Gene P, pick a template strand, then step the polymerase to the terminator.","msgs":{"top":"That gives \u003cspan class=\"tx-sq\">5′-UUAGCGUUUCAU-3′\u003c/span>: the polymerase must read the template, not the coding strand.","unfinished":"The message isn’t finished.","gene":"Choose Prokaryote mode and Gene P."},"hints":["Which strand pairs with the mRNA you want?","The mRNA matches the top strand, so the bottom one is the template.","Choose the bottom strand and run to the end."]},{"id":"tc2","goal":4,"prompt":"Make Gene E’s mature mRNA: 21 coding nucleotides, starting with AUG, capped and tailed.","why":"Both introns are out and all three exons are joined: \u003cspan class=\"tx-sq\">AUG GCA AAC UGG CAU GAA UAA\u003c/span> (Met–Ala–Asn–Trp–His–Glu–stop), with a cap and a tail.","general":"Choose Eukaryote mode, transcribe Gene E to the terminator, then use the processing controls.","msgs":{"intron":"An intron is still in; its bases would be read as codons.","exon":"That’s an exon. Exons stay; introns go.","capTail":"Without a cap and tail, the mRNA isn’t ready to leave the nucleus.","gene":"Choose Eukaryote mode (Gene E).","tpl":"Transcribe Gene E from its template (the bottom strand) first.","unfinished":"Transcribe Gene E to the terminator first."},"hints":["Which segments are introns?","The two grey segments that begin GU and end AG.","Remove both introns, add the cap and tail."]},{"id":"tc3","goal":[4,6],"stretch":true,"prompt":"Alternative splicing: from Gene E, make a different finished mRNA that \u003cstrong>still starts at AUG and ends with a stop codon in the same reading frame\u003c/strong>, but codes for a \u003cstrong>shorter protein\u003c/strong> than TC2’s.","why":"Exon 2 is 6 nt, two whole codons, so skipping it keeps the frame: \u003cspan class=\"tx-sq\">AUG GCA AAC GAA UAA\u003c/span> (Met–Ala–Asn–Glu–stop).","general":"Transcribe Gene E, remove the introns, add the cap and tail, then choose which exons to keep.","msgs":{"e1":"No AUG start.","e3":"AUG GCA AAC UGG CAU has no stop codon.","intron":"The intron’s bases get read as codons.","full":"That’s the full-length one.","capTail":"Without a cap and tail, the mRNA isn’t ready to leave the nucleus."},"hints":["Which exon could go without losing the start or the stop?","Exon 2 (6 nt) is a whole number of codons, so skipping it keeps the frame.","Exons 1 + 3: AUG GCA AAC GAA UAA."]}]},"part3":{"slug":"processing","name":"Processing","heading":"Pre-mRNA to mRNA","intro":"In eukaryotes the first transcript is finished in the nucleus before it is exported. Work through the five stations: cap and tail, a splicing puzzle, one gene with many proteins, a comparison, and the experiment that revealed introns.","panel":"Zoom to the molecules","s1":{"title":"Station 1: cap and tail","text":"A modified guanine (the \u003cstrong>5′ cap\u003c/strong>) is attached to the front of the pre-mRNA. After a signal sequence (\u003cspan class=\"tx-sq\">AAUAAA\u003c/span>), 50–250 A’s (the \u003cstrong>poly-A tail\u003c/strong>) are added at the back. Switch each one off to see what happens in the model cytoplasm.","card":"\u003cstrong>Cap and tail:\u003c/strong> protection (enzymes in the cytoplasm can’t chew the ends), export from the nucleus, and ribosome binding (the ribosome loads at the cap)."},"s2":{"title":"Station 2: splicing puzzle","text":"Each pre-mRNA has one intron hidden in it. Tap the nucleotide where the intron \u003cstrong>starts\u003c/strong>, then the one where it \u003cstrong>ends\u003c/strong>, and press Check. (Arrow keys move along the strand; Enter marks a boundary.)","rule":"\u003cstrong>Rule card:\u003c/strong> introns begin \u003cstrong>GU\u003c/strong> and end \u003cstrong>AG\u003c/strong>. The \u003cstrong>spliceosome\u003c/strong> (made of small RNA–protein particles) cuts them out and joins the exons. Cells also use the sequences around each boundary, so a GU on its own doesn’t always mark an intron. In these puzzles, the right choice is the only GU…AG that keeps the reading frame from AUG to a stop codon.","puzzles":[{"id":"z1","pre":"AUGCCAAACGUACUCAUCCAGUUCGGAUGA","_a":"OQtNBghp"},{"id":"z2","pre":"AUGCGUAACGUCCUUCAUCAGGAAUUCUAA","_a":"OQtNBghp","decoy":true}]},"s3":{"title":"Station 3: one gene, many proteins","text":"This gene has 4 exons. Exons 1 and 4 are always kept; exons 2 and 3 can each be included or skipped. Find all four mRNAs.","exons":["AUGUCC","AAAGAU","CCG","UUUUGA"],"card":"Humans have about 20 000 protein-coding genes but make many more kinds of protein, partly through \u003cstrong>alternative splicing\u003c/strong>."},"s4":{"title":"Station 4: prokaryote vs eukaryote","head":["Feature","Prokaryote","Eukaryote"],"rows":[["Where","Cytoplasm","Nucleus"],["RNA polymerase","One kind","Several; RNA polymerase II makes mRNA"],["Introns","Usually none","Common"],["Cap and tail","No","Yes"],["Translation starts","While transcription continues","After processing and export"],["Genes per mRNA","Often several (operons, module 26)","Usually one"]]},"s5":{"title":"Station 5: evidence for introns (Check it with data)","text":"A mature mRNA is mixed with single-stranded DNA from its gene, and the hybrid is viewed under a microscope. Where the mRNA pairs with the DNA, they form a double strand; where the DNA has no partner, it bulges out as single-stranded loops.","qs":[{"id":"h1","q":"How many introns does this gene have?","chips":[{"t":"3","fb":"Each loop is intron DNA with no mRNA partner.","_n":"145da","_k":"04d21863"},{"t":"4","fb":"Count the loops: each one is an intron.","_n":"1560a","_k":"193c6274"},{"t":"2","fb":"Count every single-stranded loop.","_n":"165fa","_k":"37f7bc0c"},{"t":"0","fb":"The loops are DNA with no partner in the mRNA: introns.","_n":"1762a","_k":"7f37d954"}]},{"id":"h2","q":"So how many exons?","chips":[{"t":"4","fb":"3 introns separate 4 exons.","_n":"1861a","_k":"f70bd217"},{"t":"3","fb":"There’s one more exon than introns between them.","_n":"1964a","_k":"d8f6f26c"},{"t":"7","fb":"Count only the paired (double-stranded) stretches.","_n":"1a63a","_k":"64ef3da3"},{"t":"2","fb":"Count the paired stretches between and around the loops.","_n":"1b66a","_k":"ffd83b65"}]}]},"blocks":[{"title":"Why it matters","html":"\u003cp>\u003cstrong>A Canadian connection.\u003c/strong> Insulin was discovered at the University of Toronto in 1921–22 by Frederick Banting, Charles Best, J. J. R. Macleod and James Collip. Today, most insulin for people with diabetes is made by microbes given a DNA copy of the human gene made \u003cstrong>from its mature mRNA\u003c/strong>, so it has no introns that a bacterium couldn’t splice out (Final Check A2; module 33).\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Pre-mRNA to mRNA quick check","items":[{"id":"q1","goal":4,"prompt":"Which part of pre-mRNA is removed by splicing?","choices":[{"t":"Introns","fb":"Right: introns are cut out and the exons are joined.","_n":"1c65a","_k":"a9212894"},{"t":"Exons","fb":"Exons are expressed; introns are cut out.","_n":"1d789","_k":"1d67d7f2"},{"t":"The start codon","fb":"Exons are expressed; introns are cut out.","_n":"1e799","_k":"76c11fba"},{"t":"The cap","fb":"Exons are expressed; introns are cut out.","_n":"1f769","_k":"8cdd4652"}]},{"id":"q2","goal":4,"prompt":"An mRNA–DNA hybrid shows 2 single-stranded DNA loops. How many introns?","choices":[{"t":"1","fb":"Each loop is unpaired intron DNA.","_n":"1g779","_k":"80df528a"},{"t":"2","fb":"Right: each loop is unpaired intron DNA.","_n":"1h749","_k":"b9718a75"},{"t":"3","fb":"Each loop is unpaired intron DNA.","_n":"1i759","_k":"2eeec79a"},{"t":"4","fb":"Each loop is unpaired intron DNA.","_n":"1j729","_k":"193d3f92"}]},{"id":"q3","goal":4,"prompt":"Which is added to the 3′ end of eukaryotic pre-mRNA?","choices":[{"t":"A promoter","fb":"The promoter is DNA where transcription starts; the tail goes on the 3′ end.","_n":"1k739","_k":"c84521fa"},{"t":"A 5′ cap","fb":"The cap goes on the 5′ end.","_n":"1l709","_k":"65ec0172"},{"t":"A primer","fb":"The cap goes on the 5′ end; the tail goes on the 3′ end. Transcription needs no primer.","_n":"1m719","_k":"690f9aaa"},{"t":"A poly-A tail","fb":"Right: the tail goes on the 3′ end.","_n":"1nf29","_k":"41601e7a"}]},{"id":"q4","goal":5,"prompt":"Why can a bacterium translate an mRNA before it’s finished?","choices":[{"t":"It has no introns","fb":"Without a nuclear envelope, ribosomes reach the mRNA at once.","_n":"1of19","_k":"7e26fa37"},{"t":"Its mRNA is DNA","fb":"Without a nuclear envelope, ribosomes reach the mRNA at once.","_n":"1pf09","_k":"5f831c81"},{"t":"No nucleus separates them","fb":"Right: without a nuclear envelope, ribosomes reach the mRNA at once.","_n":"1qef9","_k":"5749fae0"},{"t":"Its ribosomes are in the nucleus","fb":"Without a nuclear envelope, ribosomes reach the mRNA at once.","_n":"1rf69","_k":"1552f9ad"}]}]}},"practice":{"activities":[{"id":"terms","type":"match","title":"Term ↔ job","summary":"Term ↔ job","goal":[3,4,5],"instruction":"Tap a term, then tap the job it does."," tes?","options":[{"t":"“Prokaryotes remove exons; eukaryotes remove introns.”","why":"\u003cstrong>In\u003c/strong>trons stay \u003cstrong>in\u003c/strong> the nucleus (they’re cut out); \u003cstrong>ex\u003c/strong>ons are \u003cstrong>ex\u003c/strong>pressed.","_n":"3offc","_k":"544e16b4"},{"t":"“Both cap and splice their mRNA, but only eukaryotes have ribosomes.”","why":"Prokaryotes have no nucleus: ribosomes can start on mRNA while it’s still being made, and there’s usually no processing.","_n":"3p06c","_k":"9a2671d5"},{"t":"“Prokaryotes transcribe in the nucleus; eukaryotes in the cytoplasm.”","why":"Prokaryotes have no nucleus.","_n":"3q05c","_k":"7832269b"},{"t":"“Eukaryotes transcribe in the nucleus and process the pre-mRNA (cap, tail, splicing) before export; prokaryotes transcribe in the cytoplasm, usually with no introns, and ribosomes can start translating while transcription continues.”","why":"It compares where, processing and timing.","_n":"3r04c","_k":"2f9315d2"}]},"b":{"prompt":"Which is the best description of alternative splicing?","options":[{"t":"“Different combinations of a gene’s exons are joined in different mRNAs, so one gene can code for several proteins.”","why":"That’s alternative splicing: the exons vary.","_n":"3s03c","_k":"e0629574"},{"t":"“Bacteria splice their mRNA in different ways.”","why":"Prokaryotes have no nucleus: ribosomes can start on mRNA while it’s still being made, and there’s usually no processing.","_n":"3tfac","_k":"dedd57e4"},{"t":"“Different genes splice together into one mRNA.”","why":"Splicing happens within one pre-mRNA.","_n":"3uf9c","_k":"caa5c9c1"},{"t":"“Introns are kept in some mRNAs to make longer proteins.”","why":"Introns are removed; exons vary.","_n":"3v80c","_k":"274ada9d"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A mutation changes the AG at the end of an intron to AC. What is the most likely effect?","options":[{"t":"Transcription won’t start","why":"The promoter controls the start.","_n":"3w81c","_k":"bfa15b75"},{"t":"The cap won’t be added","why":"The cap is added at the 5′ end, regardless of introns.","_n":"3x7ec","_k":"62f55fa3"},{"t":"No effect, because introns are removed anyway","why":"The AG is part of the signal for \u003cstrong>where\u003c/strong> to remove the intron.","_n":"3y7fc","_k":"9eb138bd"},{"t":"The splice site isn’t recognized, so the intron may be kept or an exon skipped, changing the mRNA and the protein","why":"The AG is part of the signal for where the intron ends.","_n":"3z84c","_k":"ae3be3b2"}]},"b":{"prompt":"A mutation changes the GU at the start of an intron to AU. What is the most likely effect?","options":[{"t":"Splicing at that intron fails or shifts, so the mRNA may keep intron bases and code for an altered protein","why":"The GU is part of the signal for where the intron starts.","_n":"4085c","_k":"5df30fd8"},{"t":"The poly-A tail won’t be added","why":"The tail’s signal is elsewhere.","_n":"4182c","_k":"61c4f581"},{"t":"No effect, because the intron is non-coding","why":"Its boundary signal matters.","_n":"4283c","_k":"a7b9c967"},{"t":"The mRNA will be read 3′ → 5′","why":"Direction doesn’t change.","_n":"4378c","_k":"8e7779d4"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"To make a human protein in bacteria, scientists insert a DNA copy made from the \u003cstrong>mature mRNA\u003c/strong>, not the gene from a chromosome. Why?","options":[{"t":"Bacteria can’t splice out introns, so a copy without introns gives the right protein","why":"A copy made from mature mRNA has no introns.","_n":"4479c","_k":"8cb3ef85"},{"t":"Mature mRNA has no start codon","why":"It has AUG.","_n":"4586c","_k":"c046b7c1"},{"t":"Human genes use the opposite strand as template in bacteria","why":"The template is set by the promoter, not the species.","_n":"4685c","_k":"42dad549"},{"t":"Bacteria can’t read DNA from human chromosomes because it’s double-stranded","why":"Bacterial DNA is double-stranded too.","_n":"4788c","_k":"295202dd"}]},"b":{"
