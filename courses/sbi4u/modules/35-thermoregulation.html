.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 35: thermoregulation control room (S8 body form), core gauge, heat-load bar, Animals in the cold stations, task, hero.
   Roles: body figure, skin vessels and effector arrows --ink (line art; vessels never coloured); heat arrows wavy --ink-2;
   core gauge --pen on --sheet; status band --hi-soft; H⁺ --bio-h (brown fat). Module tokens: --thr-tint (clothing), --thr-ice. */
:root{--thr-tint:color-mix(in srgb,var(--ink) 12%,var(--sheet));--thr-tint2:color-mix(in srgb,var(--ink) 22%,var(--sheet));--thr-ice:color-mix(in srgb,var(--ink-2) 14%,var(--sheet))}

/* hero */
.thr-hero{width:100%;aspect-ratio:360 / 230}
.thr-hero svg{width:100%;height:100%;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}

/* radio groups (from SBI4U 07 / 06 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .85em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button[disabled]{opacity:.45;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* stepper */
.thr-step{display:inline-flex;align-items:center;gap:6px}
.thr-stb{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:1.2rem;font-weight:700;line-height:1}
.thr-stb[disabled]{opacity:.4;cursor:not-allowed}
.thr-sto{min-width:4.6em;text-align:center;font-weight:700}

/* explore layout */
.thr-pg [hidden]{display:none!important}
.thr-pg .pg-ctrl{display:grid;gap:12px}
.thr-drawer{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.thr-drawer summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
.thr-cgrid{display:grid;gap:10px;margin-top:8px}
.thr-flock{margin:0}
.thr-panel{display:grid;gap:8px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.thr-mt{margin:0;font-weight:700;font-size:.92rem}
.thr-fc{border:1px solid var(--rule);border-radius:6px;margin:0;padding:6px 10px 8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.thr-fc legend{font-size:.88rem;font-weight:700;padding:0 4px}
.thr-cb{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;min-height:32px}
.thr-cb input{width:18px;height:18px;accent-color:var(--ink)}
.thr-stage{position:relative;width:100%;aspect-ratio:360 / 250;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.thr-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.thr-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.thr-fpl{margin-top:8px}
.thr-grow{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:12px;align-items:start}
.thr-gauge{width:100%;height:auto;display:block}
.thr-note{margin-top:10px}
@media (max-width:820px){
  .thr-pg{grid-template-areas:"ctrl" "graph" "read"}
}

/* heat-load bar */
.thr-lb{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.thr-lbt{margin:0 0 6px;font-weight:700;font-size:.9rem}
.thr-lbtr{position:relative;height:18px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--paper)}
.thr-lbtr i{position:absolute;top:0;bottom:0;display:block}
.thr-lbfill{background:var(--ink);opacity:.7;top:3px!important;bottom:3px!important}
.thr-lbcap{border:2px dashed var(--ink);border-radius:2px;box-sizing:border-box}
.thr-lb0{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.thr-lbax{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-2);margin-top:3px}
.thr-lbk{margin:4px 0 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.thr-k1,.thr-k2{display:inline-block;width:16px;height:10px;border-radius:2px}
.thr-k1{background:var(--ink);opacity:.7}
.thr-k2{border:2px dashed var(--ink)}

/* SVG drawing */
.thr-t{font:600 11.5px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.thr-ts{font-weight:400;font-size:10.5px;fill:var(--ink-2)}
.thr-tb{font-weight:700}
.thr-limbo{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.thr-limbi{fill:none;stroke:var(--sheet);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.thr-slvo{fill:none;stroke:var(--ink);stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.thr-slvi{fill:none;stroke:var(--thr-tint);stroke-width:9.5;stroke-linecap:round;stroke-linejoin:round}
.thr-slvo.thr-pk{stroke-width:16}
.thr-slvi.thr-pk{stroke:var(--thr-tint2);stroke-width:12}
.thr-torso{fill:var(--thr-tint);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.thr-torso.thr-pk{fill:var(--thr-tint2);stroke-width:2.6}
.thr-zip{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 2}
.thr-neck{stroke:var(--ink);stroke-width:8}
.thr-head{fill:var(--sheet);stroke:var(--ink);stroke-width:1.8}
.thr-hat{fill:var(--thr-tint2);stroke:var(--ink);stroke-width:1.6}
.thr-hyp{fill:var(--ink)}
.thr-lead{fill:none;stroke:var(--ink-2);stroke-width:1}
.thr-motion{stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round}
.thr-pbox{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.thr-pan{opacity:.5}
.thr-pan.on{opacity:1}
.thr-pan.on .thr-pbox{stroke:var(--ink);stroke-width:2}
.thr-skin{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.thr-ves{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.thr-blood{fill:var(--ink);opacity:.14}
.thr-gland{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.thr-drop{fill:color-mix(in srgb,var(--ink) 14%,var(--sheet));stroke:var(--ink);stroke-width:1.3}
.thr-heat path{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-linecap:round}
.thr-heat path.thr-heath{fill:var(--ink-2);stroke:none}
.thr-musc{fill:var(--thr-tint);stroke:var(--ink);stroke-width:1.6}
.thr-str{stroke:var(--ink-2);stroke-width:1}
.thr-shv{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.thr-shiv{animation:thr-jit .18s steps(2) infinite}
@keyframes thr-jit{0%{transform:translateX(0)}100%{transform:translateX(1.6px)}}
.thr-thy{fill:var(--thr-tint);stroke:var(--ink);stroke-width:1.5}
.thr-arr line{stroke:var(--ink)}
.thr-arr path{fill:var(--ink)}
/* gauge */
.thr-gbg{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.thr-band{fill:var(--hi-soft)}
.thr-tubeo{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.thr-merc{fill:var(--pen)}
.thr-tick{stroke:var(--ink-2);stroke-width:1.2}
.thr-setm{fill:var(--ink)}
.thr-setl{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3}
/* hero */
.thr-otrack{stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}
.thr-omark{fill:var(--ink)}
.thr-brain{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}

/* Part 3 */
.thr-p3{display:grid;gap:22px}
.thr-st{border-top:1.5px solid var(--rule);padding-top:12px}
.thr-st:first-child{border-top:0;padding-top:0}
.thr-st h3{margin:0 0 6px}
.thr-stg{position:relative;width:100%;max-width:620px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden;margin:8px 0}
.thr-stg svg{width:100%;height:auto;display:block}
.thr-q{margin:10px 0 6px}
.thr-ok{margin:6px 0}
.thr-taps{display:flex;flex-wrap:wrap;gap:8px}
.thr-axis{fill:none;stroke:var(--ink);stroke-width:1.4}
.thr-lineA{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.thr-lineB{fill:none;stroke:var(--ink-2);stroke-width:2.6;stroke-linejoin:round;stroke-dasharray:7 4}
.thr-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.thr-hiband{fill:var(--hi-soft)}
.thr-ref{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 4}
.thr-duck{fill:var(--thr-tint);stroke:var(--ink);stroke-width:1.5}
.thr-legline{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.thr-ice{fill:var(--thr-ice);stroke:var(--ink-2);stroke-width:1}
.thr-art{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.thr-vein{stroke:var(--ink-2);stroke-width:5;stroke-linecap:round;stroke-dasharray:9 4}
.thr-flowa line,.thr-flowv line{stroke:var(--sheet)}
.thr-flowa path,.thr-flowv path{fill:var(--sheet)}
.thr-cell{fill:color-mix(in srgb,var(--ink) 5%,var(--sheet));stroke:var(--ink);stroke-width:1.8}
.thr-fat{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3}
.thr-mito{fill:var(--thr-tint);stroke:var(--ink);stroke-width:1.4}
.thr-mito.sel{stroke-width:2.8}
.thr-cris{fill:none;stroke:var(--ink-2);stroke-width:1}
.thr-inner{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.thr-hp{fill:var(--bio-h)}
.thr-zoombox{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3}
.thr-ims{fill:color-mix(in srgb,var(--bio-h) 7%,var(--sheet))}
.thr-memb{fill:var(--thr-tint);stroke:var(--ink-2);stroke-width:1}
.thr-prot{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.thr-dim{opacity:.5}
.thr-harr line{stroke:var(--bio-h)}
.thr-harr path{fill:var(--bio-h)}
.thr-flow circle{animation:thr-down 1.6s linear infinite}
@keyframes thr-down{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.thr-sq{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round}
.thr-bear{fill:none;stroke:var(--ink-2);stroke-width:2.2;stroke-dasharray:7 4;stroke-linejoin:round}

/* practice and task */
.thr-unit{margin-left:6px;color:var(--ink-2)}
.thr-conds{margin:.4em 0 .4em 1.2em;padding:0}
.thr-tin{display:grid;gap:10px}
.thr-tin p{margin:0}
.thr-tpv svg{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}

@media (prefers-reduced-motion:reduce){
  .thr-shiv,.thr-flow circle{animation:none}
}

 Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"9e9405e3","content":{"id":"35-thermoregulation","kind":"topic","title":"Thermoregulation","topic":"Thermoregulation","readyTopic":"thermoregulation","hero":{"eq":"Core ≈ 37 °C","eqLabel":"Core temperature about 37 degrees Celsius","eqSize":"md","headline":"37 °C at −30 °C and at 40 °C","text":"From a February morning in Thunder Bay to a July heat wave in Windsor, your core stays close to \u003cstrong>37 °C\u003c/strong>. The \u003cstrong>hypothalamus\u003c/strong> compares readings from \u003cstrong>thermoreceptors\u003c/strong> with a \u003cstrong>set point\u003c/strong> and calls on \u003cstrong>effectors\u003c/strong>: skin blood vessels, sweat glands, muscles and, over weeks, the thyroid. In this module you’ll push the system to its limits and see what happens when it can’t keep up.","fig":{"html":"\u003cdiv class=\"thr-hero\" id=\"thr-hero\" role=\"img\" aria-label=\"An outdoor thermometer slides from −30 °C to 40 °C. Between two panels a core thermometer stays locked at 37 °C under a small hypothalamus icon. At the cold end, in the Too cold panel, the skin vessel narrows and a muscle shivers. In the middle the vessels relax. At the hot end, in the Too hot panel, the skin vessel widens and sweat droplets appear and evaporate, with wavy heat arrows leaving the skin. The core still reads 37 °C.\">\u003c/div>"}},"goals":["I can name the receptors, control centre and effectors that regulate body temperature.","I can explain how vasodilation, sweating, vasoconstriction and shivering change heat gain or loss.","I can predict core temperature when the heat load from the surroundings, exercise and clothing changes.","I can explain a fever as a raised set point, including chills and the “break”.","I can compare how endotherms and ectotherms regulate temperature and explain adaptations to cold.","I can design a fair investigation of a temperature response."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Feedback loops","goal":1,"prompt":"In temperature control, which structure compares body temperature with the set point?","options":[{"t":"The sweat glands","why":"They’re effectors.","_n":"0a42","_k":"f8a19e82"},{"t":"The skin","why":"Skin has receptors; it doesn’t decide.","_n":"1a72","_k":"4d652d64"},{"t":"The heart","why":"It pumps blood; it doesn’t set temperature.","_n":"2a62","_k":"e1d1456e"},{"t":"The hypothalamus","why":"It’s the control centre.","_n":"3a92","_k":"97cc8fa7"}],"hints":["Which part of the brain links nerves and hormones?","It sits above the pituitary.","Hypothalamus."]},{"id":"w2","skill":"Feedback loops","goal":1,"prompt":"Body temperature rises and the response brings it back down. What kind of feedback is this?","options":[{"t":"Negative feedback","why":"The response opposes the change.","_n":"4a82","_k":"899d747d"},{"t":"Positive feedback","why":"That would push it higher still.","_n":"5ab2","_k":"f95dbaf1"},{"t":"No feedback","why":"There’s a response to a change, so it’s a loop.","_n":"6aa2","_k":"62670b81"},{"t":"Negative, because the temperature went down","why":"It’s negative because it opposes the change; a fall back after a rise is just one example.","_n":"7ad2","_k":"e66e8e01"}],"hints":["Does the response oppose or amplify?","It opposes.","Negative."]},{"id":"w3","skill":"Heat transfer","goal":2,"prompt":"Which process releases the most heat when you’re cold?","options":[{"t":"Widening skin blood vessels","why":"That increases heat loss.","_n":"8ac2","_k":"e6cfd641"},{"t":"Shivering, because it shows you’re losing heat","why":"Shivering \u003cem>makes\u003c/em> heat; it isn’t a sign of heat loss.","_n":"9657","_k":"a72f5930"},{"t":"Rapid muscle contractions (shivering)","why":"Muscle activity releases heat.","_n":"a667","_k":"b8ae52dc"},{"t":"Sweating","why":"Sweating removes heat.","_n":"b677","_k":"68c95f7d"}],"hints":["Where does body heat come from?","Cellular respiration in active muscle.","Shivering."]},{"id":"w4","skill":"Heat transfer","goal":2,"prompt":"Your hands look pale on a cold day. Why?","options":[{"t":"The blood itself turned cooler and paler","why":"The colour change comes from less blood, not cooler blood.","_n":"c687","_k":"8b87639b"},{"t":"Skin arterioles narrowed, so less warm blood reaches the skin","why":"Vasoconstriction keeps heat in the core.","_n":"d697","_k":"8bccab42"},{"t":"Sweat covered the skin","why":"You don’t sweat when cold.","_n":"e6a7","_k":"dfb890f0"},{"t":"Skin arterioles widened to warm the skin","why":"Widening would make the skin red and lose more heat.","_n":"f6b7","_k":"5bbb84bc"}],"hints":["Less blood in the skin means paler skin.","Why would the body send less blood there?","To lose less heat: vasoconstriction."]},{"id":"w5","skill":"Reading variables","goal":6,"prompt":"A student measures skin temperature every minute after a hand is taken out of cold water. What is the \u003cstrong>dependent\u003c/strong> variable?","options":[{"t":"Time","why":"Time is the independent variable here.","_n":"g6c7","_k":"95397860"},{"t":"The water temperature","why":"It was set before the test, so it’s a controlled variable.","_n":"h6d7","_k":"e8afb6a4"},{"t":"Skin temperature","why":"It’s what is measured.","_n":"i6e7","_k":"3e3910c3"},{"t":"The student’s hand","why":"That’s what is studied, not a variable.","_n":"jf78","_k":"b3e2bac0"}],"hints":["What does the student record?","The reading at each minute.","Skin temperature."]},{"id":"w6","skill":"Reading variables","goal":6,"prompt":"Which variable should the student keep the same in every trial?","options":[{"t":"How long the hand stays in the water","why":"Controlled variables must be kept constant.","_n":"kf68","_k":"dc061a67"},{"t":"The skin temperature","why":"That’s measured, not kept constant.","_n":"lf98","_k":"3b7c0d38"},{"t":"The time after removal","why":"That’s the independent variable.","_n":"mf88","_k":"fde99a34"},{"t":"Nothing; variety makes it fairer","why":"Uncontrolled changes make the results hard to compare.","_n":"nfb8","_k":"b4310be1"}],"hints":["Which variable could change the result if it differed?","Think about the cold exposure.","Time in the water."]}],"refreshers":{"Feedback loops":"Stimulus → receptor → control centre → effector → response. For temperature the control centre is the hypothalamus, and the loop is negative feedback.","Heat transfer":"Active muscles release heat. Blood carries heat to the skin, where it is lost to cooler air; evaporating sweat takes heat with it.","Reading variables":"Independent: what you change. Dependent: what you measure. Controlled: what you keep the same."}}},"explore":{"heading":"Body temperature control room","intro":"Set the weather, the clothing and the activity. Watch which responses the hypothalamus calls on, and whether the core stays at 37 °C.","modelNote":"Teaching model: heat load is counted in whole units, and each unit the body can’t handle moves the core 1 °C. Real bodies respond gradually.","predIntro":"Make a prediction first. Then the control room will show you what really happens.","predictions":[{"id":"p1","prompt":"Start: −30 °C, T-shirt, no hat, resting. Predict the core temperature.","options":[{"t":"30 °C","_n":"ofa8","_k":"27a67b0f"},{"t":"36 °C","_n":"pfd8","_k":"e04de639"},{"t":"37 °C","_n":"qfc8","_k":"09d08e0b"},{"t":"34 °C","_n":"ref8","_k":"afbc1d0f"}],"explain":"The load is −6 but the body can handle only 3 units. Three units short means 3 °C below 37.","start":{"surr":-30,"clo":"tee","hat":"off","act":"rest","water":"hyd","weeks":"off"},"mask":true,"to":{}},{"id":"p2","prompt":"Start: −10 °C, sweater, no hat, resting (shivering is on). The person starts running. What happens to shivering?","options":[{"t":"It stays the same","_n":"see8","_k":"417dfa9a"},{"t":"It stops, and sweating starts","_n":"tf17","_k":"adb577cd"},{"t":"It stops","_n":"uf27","_k":"1ecd72f4"},{"t":"It gets stronger","_n":"vef7","_k":"94447a45"}],"explain":"Running releases heat, so the hypothalamus no longer needs shivering to make it.","start":{"surr":-10,"clo":"sweater","hat":"off","act":"rest","water":"hyd","weeks":"off"},"to":{"act":"run"}},{"id":"p3","prompt":"Start: 40 °C, T-shirt, no hat, running, hydrated (core 38 °C). Now the runner is dehydrated. Predict the core.","options":[{"t":"39 °C","_n":"wf07","_k":"bc8754d7"},{"t":"37 °C","_n":"xed7","_k":"e2baaddd"},{"t":"38 °C","_n":"yee7","_k":"afd57db9"},{"t":"40 °C","_n":"zeb7","_k":"4e8627e2"}],"explain":"The load is +5. Hydrated, the body can handle 4; dehydrated, only 2. Three units are left over.","start":{"surr":40,"clo":"tee","hat":"off","act":"run","water":"hyd","weeks":"off"},"to":{"water":"dehyd"}},{"id":"p4","prompt":"Start: Fever mode, hour 0, a 20 °C room. The set point jumps to 39 °C. What does the person feel and do first?","options":[{"t":"Feel cold and shiver, even in a warm room","_n":"10ec7","_k":"b60508ac"},{"t":"Feel cold, so the fever is making them cooler","_n":"11f97","_k":"f4c8a815"},{"t":"Feel hot and sweat","_n":"12fa7","_k":"0d0b6a36"},{"t":"Feel nothing until the temperature reaches 39","_n":"13838","_k":"023e69d6"}],"explain":"The hypothalamus compares 37 with a target of 39: “too cold”. Chills are the loop doing its job.","fever":true}],"challenges":[{"id":"tc1","goal":[2,3],"prompt":"At −10 °C, standing still, keep the core at 37 °C \u003cstrong>with no shivering at all\u003c/strong>.","why":"A parka adds 3: the load is −1 (or 0 with a hat), so vasoconstriction alone is enough.","general":"Set the surroundings to −10 °C and the activity to Resting, then change the clothing.","hints":["Shivering switches on at a load of −2.","You need the load to be −1 or 0.","A parka adds 3: −4 + 3 = −1."]},{"id":"tc2","goal":3,"prompt":"It’s 40 °C and the person is dehydrated, in a T-shirt and no hat. What is the hardest activity they can do and still stay at 37 °C?","why":"Resting keeps the load at +2: vasodilation 1 + sweating 1 is all a dehydrated body can handle.","general":"Set 40 °C, Dehydrated, T-shirt and no hat, then choose the activity.","hints":["Dehydrated capacity: vasodilation 1 + sweating 1.","The heat already gives +2.","Only resting keeps the load at 2."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Fever mode. Before you press Play, mark which responses will be on during the \u003cstrong>chills\u003c/strong> (hours 1–2) and which during the \u003cstrong>break\u003c/strong> (hours 5–6).","why":"Chills: the core is below the raised target, so vasoconstriction and shivering warm the body. Break: the core is above the restored target, so vasodilation and sweating cool it.","general":"Mark every response that runs in each phase, and only those.","hints":["Compare the core with the set point at each time.","Chills: core 37 or 38 with a target of 39 → too cold. Break: core 39 with a target of 37 → too hot.","Chills: warming responses; break: cooling responses."]}]},"part3":{"slug":"cold","name":"Animals in the cold","heading":"Animals in the cold","intro":"Other animals solve the same problem in different ways. Use the same principles (heat gain, heat loss and a set point) to read four Canadian solutions.","s1":{"title":"Station 1: endotherm or ectotherm? Check it with data","how":"Body temperature against the surrounding temperature for two animals. Tap the graph, or use the buttons under it.","steps":[{"id":"endo","q":"Tap the line that shows an \u003cstrong>endotherm\u003c/strong>.","ok":"✓ Line A stays near 37 °C whatever the surroundings: the animal makes its own heat by metabolism."},{"id":"ecto","q":"Tap the line that shows an \u003cstrong>ectotherm\u003c/strong>.","ok":"✓ Line B follows the surroundings: the animal gets most of its heat from outside."},{"id":"beh","q":"Tap the stretch that shows \u003cstrong>behavioural regulation\u003c/strong>.","ok":"✓ Between about 24 °C and 34 °C line B levels off near 30 °C: the snake basks when it’s cool and moves into shade when it’s hot."}],"wrong":{"endo":"Line B follows the surroundings: that animal’s heat comes mostly from outside.","ectoA":"Line A stays near 37 °C whatever the surroundings: that animal makes its own heat.","behA":"Line A is flat because the mouse makes its own heat, not because of behaviour.","behB":"Most of line B follows the surroundings. Find where it levels off."},"reveal":"Animal A is a mouse; animal B is a garter snake. Ectotherms get most of their heat from outside, but they still regulate."},"s2":{"title":"Station 2: countercurrent exchange","how":"A duck stands on ice. Its leg has an artery (warm blood flowing down) and a vein (cold blood flowing up). Switch the vessels between side by side and apart.","on":"Heat passes from the artery to the vein all along the leg. The blood reaching the foot is already cool, so the foot loses little heat to the ice, and the blood returning to the body is rewarmed.","off":"With the vessels apart, warm blood reaches the foot and loses its heat to the ice, and cold blood returns to the body."},"s3":{"title":"Station 3: brown fat (zoom to the molecules)","steps":["A brown-fat cell: many small fat droplets and many mitochondria, which give the tissue its colour.","Zoom in to one mitochondrion. Its electron transport chain pumps H⁺ out of the matrix, building a gradient across the inner membrane.","A protein in the inner membrane, \u003cstrong>thermogenin\u003c/strong>, lets H⁺ flow back into the matrix \u003cstrong>without\u003c/strong> passing through ATP synthase, so the gradient’s energy is released as \u003cstrong>heat\u003c/strong> (module 17).","Brown fat is found in newborns and in hibernating mammals: heat without shivering."]},"s4":{"title":"Station 4: hibernation","how":"A Richardson’s ground squirrel’s year on the Prairies. Add the black bear for contrast.","text":"In winter torpor the squirrel’s body temperature falls to a few degrees above the burrow temperature, with brief rewarming bouts. The set point itself is lowered: this is regulation at a new target, not failure.","bear":"A black bear’s temperature drops only a few degrees during its winter sleep."},"quickCheck":{"title":"Quick check","summary":"Animals in the cold quick check","items":[{"id":"q1","goal":5,"prompt":"A lizard basks in the morning sun. What kind of regulation is this?","right":"Moving to warmth is behaviour; it regulates temperature.","wrong":"Moving to warmth is behaviour; it regulates temperature.","choices":[{"t":"Behavioural","_n":"14828","_k":"074802db"},{"t":"None","_n":"15818","_k":"1d96fd22"},{"t":"Sweating","_n":"16808","_k":"7f5bd6e8"},{"t":"Shivering","_n":"177f8","_k":"923f584a"}]},{"id":"q2","goal":5,"prompt":"Why do arteries and veins run side by side in a goose’s legs?","right":"The foot stays cool, so it loses little heat to the ice.","wrong":"The foot stays cool, so it loses little heat to the ice.","choices":[{"t":"So the legs can shiver","_n":"187e8","_k":"420ceb1a"},{"t":"So blood flows faster","_n":"197d8","_k":"c7a0ed02"},{"t":"So heat passes from outgoing to returning blood","_n":"1a7c8","_k":"afa636ba"},{"t":"So the feet stay warm","_n":"1b7b8","_k":"198ba553"}]},{"id":"q3","goal":5,"prompt":"Brown fat makes heat because its mitochondria…","right":"The gradient’s energy becomes heat instead of ATP.","wrong":"The gradient’s energy becomes heat instead of ATP.","choices":[{"t":"store more glucose","_n":"1c7a8","_k":"23fc79b9"},{"t":"let H⁺ leak back without making ATP","_n":"1dfd8","_k":"603c55af"},{"t":"make extra ATP","_n":"1efe8","_k":"e37289a8"},{"t":"have no electron transport chain","_n":"1fff8","_k":"fc5032bc"}]},{"id":"q4","goal":5,"prompt":"During hibernation, a ground squirrel’s set point…","right":"Its temperature is still regulated, around a new, lower target.","wrong":"Its temperature is still regulated, around a new, lower target.","choices":[{"t":"stays at 37 °C but the loop fails","_n":"1g008","_k":"6f6fe8f9"},{"t":"is lowered","_n":"1hf98","_k":"8ca775c2"},{"t":"rises","_n":"1ifa8","_k":"96e8b2c0"},{"t":"disappears","_n":"1jfb8","_k":"a254da7c"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Warm, cool or neither?","summary":"Warm, cool or neither","goal":[1,2],"txt":true,"noun":"response","instruction":"Sort each response by what it does to body temperature.","how":"Tap a response, then tap its box.","boxes":[{"id":"warm","label":"Warms the body"},{"id":"cool","label":"Cools the body"},{"id":"none","label":"Neither"}],"wrongDefault":"Does it add heat, keep heat in, or get rid of heat?","items":[{"id":"i1","t":"Shivering","_a":"GxJYRl0X","why":"Rapid muscle contractions release heat."},{"id":"i2","t":"Skin arterioles narrow","_a":"GxJYRl0X","why":"Warms the body by keeping heat in: less warm blood reaches the skin.","wrong":{"cool":"Narrow vessels mean less heat reaching the skin, so heat is kept in."}},{"id":"i3","t":"Sweating","_a":"GwZWW1wX","why":"Evaporating sweat takes heat from the skin."},{"id":"i4","t":"Skin arterioles widen","_a":"GwZWW1wX","why":"More warm blood at the surface, where heat is lost.","wrong":{"warm":"Wide vessels send warm blood to the skin, where it’s lost."}},{"id":"i5","t":"More thyroid hormone over several weeks","_a":"GxJYRl0X","why":"Thyroid hormone raises metabolic rate, so more heat is made.","hints":["What does thyroid hormone do to metabolism?","It raises it.","More metabolism, more heat: warms."]},{"id":"i6","t":"A dog panting","_a":"GwZWW1wX","why":"Air over a wet tongue speeds evaporation, which removes heat.","hints":["Panting moves air over a wet tongue.","Evaporation.","Cools."]},{"id":"i7","t":"Moving into shade","_a":"GwZWW1wX","why":"Behaviour: less heat is gained from the sun."},{"id":"i8","t":"Putting on a hat","_a":"GxJYRl0X","why":"Behaviour: less heat is lost from the head."},{"id":"i9","t":"Producing more urine","_a":"GwtWWlUX","why":"Urine output is about water balance, not temperature.","wrong":{"warm":"Urine output is about water balance, not temperature.","cool":"Urine output is about water balance, not temperature."}},{"id":"i10","t":"Skin thermoreceptors sending signals","_a":"GwtWWlUX","why":"They detect; they don’t change temperature.","wrong":{"warm":"Receptors report; they don’t act.","cool":"Receptors report; they don’t act."}}]},{"id":"heat","type":"custom","title":"Heat scenarios","summary":"Heat scenarios","star":true,"goal":[2,3,6],"instruction":"Six problems on the control-room model, sweat and fair tests. S3 to S6 are non-routine (★); S5 and S6 go beyond the Final Check.","how":"","items":[{"id":"s1","kind":"num","goal":3,"prompt":"In the model, what is the core temperature at 20 °C, T-shirt, no hat, walking?","_a":"ClI=","display":"37 °C","unit":"°C","why":"Load −1 + 1 = 0: no responses needed.","general":"Load −1 + 1 = 0: no responses needed.","hints":["Add up the load: surroundings, clothing, hat and activity.","20 °C gives −1; walking gives +1.","Load 0, so the core stays at 37 °C."]},{"id":"s2","kind":"num","goal":3,"prompt":"In the model, a hydrated person runs at 30 °C in a T-shirt. How much sweat do they lose per hour?","_a":"CA==","display":"1 L per hour","unit":"L/h","why":"Load +3: vasodilation handles 1 and sweating 2 units; 2 × 0.5 = 1 L/h.","general":"Load +3: vasodilation handles 1 and sweating 2 units; 2 × 0.5 = 1 L/h.","hints":["30 °C gives 0 and running gives +3.","Vasodilation handles 1 unit; sweating handles the rest.","2 sweating units × 0.5 L/h = 1 L/h."]},{"id":"s3","kind":"num","goal":6,"star":true,"prompt":"A runner weighs 60.0 kg before a 1-hour run in the heat and 58.8 kg after. They drank 0.5 L during the run. About how much sweat did they lose? (1 L of water ≈ 1 kg)","_a":"CEsO","display":"1.7 L","unit":"L","why":"Mass lost 1.2 kg = 1.2 L, plus the 0.5 L drunk: 1.7 L.","wrong":[{"match":1.2,"fb":"Add the water drunk: it was lost too."}],"general":"Sweat = mass lost + water drunk.","hints":["Mass lost = sweat − water drunk.","Sweat = mass lost + water drunk.","1.2 + 0.5 = 1.7 L."]},{"id":"s4","kind":"mc","goal":2,"star":true,"prompt":"Two days are both 32 °C, one dry and one very humid. On which day does the core rise more during the same run, and why?","options":[{"t":"The humid day; humid air holds more heat at the same temperature","why":"The air temperature is the same; evaporation is what differs.","_n":"1kfc8","_k":"87be49e0"},{"t":"The humid day; sweat evaporates more slowly in humid air, so less heat is removed","why":"Humid air slows evaporation, so sweating removes less heat.","_n":"1lf58","_k":"9dbc80c2"},{"t":"Neither; the air temperature is the same, so the core rises the same","why":"The temperature matches, but the evaporation doesn’t.","_n":"1mf68","_k":"d7de43b3"},{"t":"The dry day; dry air pulls the sweat away before it can cool the skin","why":"Dry air speeds evaporation.","_n":"1n6f8","_k":"f5cbff74"}],"hints":["How does sweat remove heat?","By evaporating.","Evaporation is slower in humid air: the humid day."]},{"id":"s5","kind":"mc","goal":6,"star":true,"prompt":"Design check: a student tests whether a wool or a cotton glove keeps a hand warmer in ice water. Which plan is fair?","options":[{"t":"The same hand, wool in ice water and cotton in cool tap water","why":"Change only the glove: keep the water temperature the same.","_n":"1o6e8","_k":"4a7d40f2"},{"t":"The same hand, wool for 1 minute and cotton for 5 minutes","why":"Keep the time in the water the same.","_n":"1p718","_k":"1be5b1a6"},{"t":"Wool on one student, cotton on another, in the same ice water","why":"Two hands differ in more than the glove.","_n":"1q708","_k":"4aee5d8e"},{"t":"The same hand, alternating gloves on different days, the same water temperature and time, skin temperature measured with the same probe","why":"Only the glove changes; everything else is controlled.","_n":"1r6b8","_k":"eee838e7"}],"hints":["What is the independent variable?","The glove material. Everything else must stay the same.","Same hand, same water, same time, same probe."]},{"id":"s6","kind":"mc","goal":3,"star":true,"fixedOrder":true,"prompt":"In the model at −30 °C, resting, with weeks in the cold on, which is the least clothing that keeps the core at 37 °C?","options":[{"t":"T-shirt, no hat","why":"Load −6 is two units beyond the 4 the body can handle.","_n":"1s6a8","_k":"eaf79a8a"},{"t":"T-shirt with a hat","why":"Load −5 is one unit beyond the 4 the body can handle.","_n":"1t6d8","_k":"38e2409c"},{"t":"Sweater, no hat","why":"Load −5 is one unit beyond the 4 the body can handle.","_n":"1u6c8","_k":"13ef627e"},{"t":"Sweater with a hat","why":"Load −4, exactly the capacity of 4.","_n":"1v778","_k":"fe9aa315"},{"t":"Parka, no hat","why":"That works, but it isn’t the least clothing.","_n":"1w768","_k":"d46152ba"},{"t":"Parka with a hat","why":"That works, but it isn’t the least clothing.","_n":"1x698","_k":"13a98255"}],"hints":["Weeks in the cold raises warming capacity to 4.","The load must be −4 or higher: −6 + clothing + hat ≥ −4.","A sweater (+1) and hat (+1) give −4: sweater with a hat."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Talia","how":"","instruction":"Talia made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain how the body keeps warm on a cold day.","steps":["Thermoreceptors detect a fall in skin and core temperature.","The hypothalamus sends signals to the effectors.","Skin arterioles widen so warm blood heats the skin.","Skeletal muscles shiver and release heat."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"Skin arterioles widen so the skin feels warmer.","why":"In the cold, skin arterioles narrow so less warm blood reaches the surface and less heat is lost.","_n":"1y6a8","_k":"708e9f40"},{"t":"Step 3 is correct.","why":"Wider vessels would lose more heat.","_n":"1z678","_k":"1b491619"},{"t":"Skin arterioles narrow so less warm blood reaches the skin and less heat is lost.","why":"In the cold, skin arterioles narrow so less warm blood reaches the surface and less heat is lost.","_n":"20688","_k":"66409eaa"},{"t":"Skin arterioles close completely forever.","why":"They narrow, and reopen as conditions change.","_n":"216d8","_k":"acd92384"}],"hints":["Where is heat lost: core or skin?","Less blood at the surface means less heat lost.","Vasoconstriction."]},{"id":"e2","goal":4,"task":"Explain why a person with a fever shivers.","steps":["Chemicals released during an infection reach the hypothalamus.","The infection breaks the temperature control loop.","So the body overheats.","Shivering adds even more heat."],"_a":"CA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2, but the mistake is earlier.","This follows the earlier mistake."],"fixes":[{"t":"Step 2 is correct.","why":"The loop still works; the target moved.","_n":"226e8","_k":"f25ffc22"},{"t":"The hypothalamus raises the set point, so a normal 37 °C is now “too cold” and warming responses switch on.","why":"In a fever the hypothalamus raises the set point, and the loop works normally around the new target.","_n":"236b8","_k":"40e52a83"},{"t":"The muscles are infected and twitch.","why":"Shivering is controlled by the hypothalamus.","_n":"246c8","_k":"d3e3a052"},{"t":"The infection lowers the set point.","why":"Then the person would sweat, not shiver.","_n":"25718","_k":"ed70dcce"}],"hints":["Is the loop broken, or is it aiming at something new?","Shivering is a normal response to “too cold”.","A raised set point."]},{"id":"e3","goal":2,"task":"Explain the result: a hiker shivers at −10 °C, then stops shivering after starting to jog.","steps":["At −10 °C the body loses heat faster than at rest indoors.","Shivering showed that the hiker was cooling down because shivering removes heat.","Jogging released heat from the leg muscles.","So shivering was no longer needed."],"_a":"CA==","stepFb":["Step 1 is correct.","","Step 3 is correct.","Step 4 is correct."],"fixes":[{"t":"Shivering cools the core to save energy.","why":"Shivering is rapid muscle contraction; it releases heat.","_n":"26728","_k":"ebad8892"},{"t":"Shivering is a heat-making response: muscles contract quickly and release heat.","why":"Shivering is rapid muscle contraction; it releases heat.","_n":"27fb8","_k":"ebbe655f"},{"t":"Step 2 is correct.","why":"Shivering adds heat.","_n":"28fa8","_k":"9bcfa08c"},{"t":"Shivering showed that the hiker was dehydrated.","why":"Dehydration affects sweating, not shivering.","_n":"29f98","_k":"e32f25a1"}],"hints":["What does muscle activity release?","Heat.","Shivering makes heat."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the control room: the fever chills, or how much water mattered in the heat?"},{"id":"j2","q":"In your own words, why does a dry wind cool you faster than still, humid air?"},{"id":"j3","q":"Explain to a friend the order in which the body calls on its warming responses."},{"id":"j4","q":"What’s one part of thermoregulation you’re still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which structure is the control centre for body temperature?","options":[{"t":"The pituitary gland","why":"It isn’t the temperature control centre.","_n":"2af88","_k":"85aadc88"},{"t":"The thyroid gland","why":"It’s an effector for long-term heat production.","_n":"2bff8","_k":"d4e81ef1"},{"t":"Thermoreceptors in the skin","why":"They detect. Skin and core thermoreceptors report to the hypothalamus, which decides.","_n":"2cfe8","_k":"de638997"},{"t":"The hypothalamus","why":"It compares readings from the thermoreceptors with the set point and calls on the effectors.","_n":"2dfd8","_k":"ba4eebe2"}]},"b":{"prompt":"Which structures act as \u003cstrong>effectors\u003c/strong> when the body is too warm?","options":[{"t":"The hypothalamus","why":"It’s the control centre.","_n":"2efc8","_k":"ac8ccabf"},{"t":"Skeletal muscles","why":"They shiver when you’re cold.","_n":"2ff38","_k":"fb800790"},{"t":"Thermoreceptors in the skin","why":"Skin and core thermoreceptors report to the hypothalamus, which decides.","_n":"2gf28","_k":"6eced52c"},{"t":"Sweat glands and skin arterioles","why":"Sweating and vasodilation carry out the cooling.","_n":"2hf58","_k":"30ebbc6b"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"When the body is too cold, what happens to arterioles in the skin?","options":[{"t":"They widen so the skin turns red","why":"Redness comes from widening in the heat. In the cold, skin arterioles narrow so less warm blood reaches the surface and less heat is lost.","_n":"2if68","_k":"b1f3ca6e"},{"t":"They stay the same; only shivering changes","why":"Vasoconstriction comes first.","_n":"2jf78","_k":"5549a538"},{"t":"They narrow, reducing blood flow to the skin","why":"Vasoconstriction keeps warm blood in the core, so less heat is lost.","_n":"2kf88","_k":"8147bcf5"},{"t":"They widen to warm the skin","why":"In the cold, skin arterioles narrow so less warm blood reaches the surface and less heat is lost.","_n":"2lf98","_k":"899f45e0"}]},"b":{"prompt":"When the body is too warm, what happens to arterioles in the skin?","options":[{"t":"They widen, sending more blood to the skin to lose heat","why":"Vasodilation brings warm blood to the surface, where heat is lost.","_n":"2mfa8","_k":"1ddd6e32"},{"t":"They stay the same; only sweating changes","why":"Vasodilation comes first.","_n":"2nfb8","_k":"249bd599"},{"t":"They narrow so sweat can form","why":"Sweat comes from glands, not from narrowing.","_n":"2ofc8","_k":"807e2175"},{"t":"They narrow to keep heat inside","why":"Narrowing is the cold response; in the heat they widen.","_n":"2ped8","_k":"6eb149a8"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Which best describes an \u003cstrong>ectotherm\u003c/strong>?","options":[{"t":"It makes most of its heat by metabolism","why":"That’s an endotherm.","_n":"2qee8","_k":"dc301eac"},{"t":"Its body temperature depends mostly on heat from the surroundings, and it regulates mainly by behaviour","why":"Basking and seeking shade are how ectotherms regulate.","_n":"2rece","_k":"86332465"},{"t":"It can’t regulate its temperature at all","why":"Ectotherms get most of their heat from the surroundings, but they regulate by behaviour, and many run warm in the sun.","_n":"2sede","_k":"07132d4c"},{"t":"It is always colder than its surroundings","why":"Ectotherms get most of their heat from the surroundings, but they regulate by behaviour, and many run warm in the sun.","_n":"2teee","_k":"e4e92e96"}]},"b":{"prompt":"Which best describes an \u003cstrong>endotherm\u003c/strong>?","options":[{"t":"It is always warmer than an ectotherm","why":"A basking lizard can be warmer than a cold mammal’s skin.","_n":"2uefe","_k":"42b3bb7c"},{"t":"It never needs to change its behaviour","why":"Endotherms use behaviour too.","_n":"2vf0e","_k":"681ecd7c"},{"t":"It makes most of its body heat by metabolism and keeps a fairly constant core temperature","why":"Mammals and birds make their own heat and hold a set point.","_n":"2wf1e","_k":"1de3d933"},{"t":"Its temperature follows the surroundings","why":"That’s an ectotherm.","_n":"2xf2e","_k":"70baf760"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Two runners do the same run at 38 °C, one hydrated and one dehydrated. Why does the dehydrated runner’s core temperature rise more?","options":[{"t":"Dehydration raises the set point","why":"The set point hasn’t changed.","_n":"2yf3e","_k":"1a52c9f4"},{"t":"Sweat from a dehydrated runner is warmer","why":"Cooling comes from evaporation, not sweat temperature.","_n":"2zf4e","_k":"c6e226b4"},{"t":"Less water is available for sweat, so less heat is removed by evaporation","why":"Dehydration limits sweating, and humid air slows evaporation, so cooling falls behind.","_n":"30f5e","_k":"fb7cc97b"},{"t":"Dehydrated muscles make less heat","why":"That would lower the core, not raise it.","_n":"31f2e","_k":"a7362a4e"}]},"b":{"prompt":"The same run is done on two 32 °C days, one dry and one humid. Why does the core rise more on the humid day?","options":[{"t":"Humid air makes the body sweat less","why":"The body may sweat more, but it doesn’t evaporate.","_n":"32f1e","_k":"008cab62"},{"t":"Humid air contains more heat at the same temperature, which the body absorbs","why":"The air temperature is the same; evaporation is what differs.","_n":"33f0e","_k":"4788cdae"},{"t":"Humidity lowers the set point","why":"In a fever the hypothalamus raises the set point, and the loop works normally around the new target.","_n":"34efe","_k":"d33572fe"},{"t":"Sweat evaporates more slowly in humid air, so less heat is removed","why":"Dehydration limits sweating, and humid air slows evaporation, so cooling falls behind.","_n":"35f6e","_k":"3c67f631"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"During a fever, why does a person shiver in a warm room?","options":[{"t":"The room feels cold because the skin is wet","why":"Shivering starts before any sweating.","_n":"36f5e","_k":"7db8cf5a"},{"t":"The infection makes the muscles twitch","why":"Shivering is ordered by the hypothalamus.","_n":"37f4e","_k":"63df127e"},{"t":"Thermoregulation has failed","why":"In a fever the hypothalamus raises the set point, and the loop works normally around the new target.","_n":"38f3e","_k":"0ae3e1ca"},{"t":"The set point is raised, so the hypothalamus treats normal body temperature as too cold","why":"In a fever the hypothalamus raises the set point, and the loop works normally around the new target.","_n":"39fae","_k":"168db5d2"}]},"b":{"prompt":"When a fever breaks, why does a person sweat heavily?","options":[{"t":"The set point returns to normal while the core is still high, so cooling responses switch on","why":"A core of 39 °C against a target of 37 °C counts as too hot.","_n":"3af9e","_k":"82445d62"},{"t":"The set point rises even higher","why":"Then they’d shiver.","_n":"3bf8f","_k":"61190d9a"},{"t":"The infection releases water","why":"Sweat comes from sweat glands.","_n":"3cf9f","_k":"cbddfd06"},{"t":"The loop stops working, so heat escapes","why":"In a fever the hypothalamus raises the set point, and the loop works normally around the new target.","_n":"3df6f","_k":"79c4c50a"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"An Arctic fox’s feet stay near freezing while its core is 37 °C. In its legs, arteries and veins lie side by side. How does this help?","options":[{"t":"Veins carry warm blood down to keep the feet warm","why":"Veins carry blood back toward the heart.","_n":"3ef7f","_k":"cb1a735e"},{"t":"The feet make heat by shivering","why":"That wouldn’t keep them near freezing.","_n":"3ff4f","_k":"bf9645da"},{"t":"Heat passes from warm arterial blood to cold venous blood, so little heat reaches the feet and is lost","why":"Countercurrent exchange keeps the heat in the body.","_n":"3gf5f","_k":"a6bc8a91"},{"t":"The feet have no blood flow at all","why":"They need blood, just cooler blood.","_n":"3hf2f","_k":"68afba0a"}]},"b":{"prompt":"A newborn has deposits of brown fat. How does brown fat keep the baby warm?","options":[{"t":"It stores extra glucose for shivering","why":"Newborns shiver very little.","_n":"3if3f","_k":"09dd9a36"},{"t":"Its mitochondria let H⁺ leak back across the inner membrane, so the energy is released as heat instead of making ATP","why":"Thermogenin lets H⁺ bypass ATP synthase.","_n":"3j00f","_k":"1ee57483"},{"t":"It insulates like a thick blanket","why":"All fat insulates; brown fat actively makes heat.","_n":"3k01f","_k":"1b521ee8"},{"t":"It contains more blood, which is warm","why":"Its heat comes from the mitochondria.","_n":"3lfef","_k":"70de195d"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of how sweating cools the body?","options":[{"t":"“Sweating slows heat production in the muscles.”","why":"It increases heat loss; it doesn’t change production.","_n":"3mfdf","_k":"82b32f31"},{"t":"“As sweat evaporates, it absorbs heat from the skin, cooling the blood flowing there.”","why":"Sweat cools only when it evaporates: evaporation takes heat from the skin.","_n":"3n00f","_k":"fb2d51bf"},{"t":"“Sweat is cooler than the body, so it chills the skin.”","why":"Sweat cools only when it evaporates: evaporation takes heat from the skin.","_n":"3offf","_k":"ab2a4d11"},{"t":"“Sweating removes hot water from the blood.”","why":"The cooling happens when it evaporates.","_n":"3p02f","_k":"f84970c8"}]},"b":{"prompt":"Which is the best explanation of why goosebumps barely warm a human?","options":[{"t":"“Goosebumps narrow the blood vessels.”","why":"That’s a separate response.","_n":"3q01f","_k":"c406b372"},{"t":"“Goosebumps only happen in fear, not cold.”","why":"They happen in both.","_n":"3r04f","_k":"a21e8d34"},{"t":"“Goosebumps release heat from the skin.”","why":"They’re tiny muscle contractions with little heat.","_n":"3s03f","_k":"596351a2"},{"t":"“Raised hairs trap a layer of air in furry mammals, but human body hair is too sparse to trap much.”","why":"The response works by trapping air, and humans have too little hair for it.","_n":"3tf6f","_k":"961b552d"}]}},{"id":"c2","cat":"C","goal":[1,2],"a":{"prompt":"Which flow chart correctly shows the response to a fall in core temperature?","options":[{"t":"↓ temperature → thermoreceptors → hypothalamus → sweat glands → sweating → temperature rises","why":"Sweating cools.","_n":"3uf5f","_k":"ab885a4c"},{"t":"↓ temperature → thermoreceptors → hypothalamus → skin arterioles → vasodilation → temperature rises","why":"In the cold, skin arterioles narrow so less warm blood reaches the surface and less heat is lost.","_n":"3v84f","_k":"7b10cc90"},{"t":"↓ temperature → skeletal muscles → hypothalamus → thermoreceptors → shivering → temperature rises","why":"The detect, decide, act order is scrambled.","_n":"3w85f","_k":"ba83b9b8"},{"t":"↓ temperature → thermoreceptors → hypothalamus → skin arterioles and skeletal muscles → vasoconstriction and shivering → temperature rises","why":"Detect, decide, act: the warming effectors bring the temperature back up.","_n":"3x86f","_k":"8ee52777"}]},"b":{"prompt":"Which flow chart correctly shows the response to a rise in core temperature?","options":[{"t":"↑ temperature → thermoreceptors → hypothalamus → sweat glands and skin arterioles → sweating and vasodilation → temperature falls","why":"Detect, decide, act: the cooling effectors bring the temperature back down.","_n":"3y87f","_k":"533201af"},{"t":"↑ temperature → thermoreceptors → hypothalamus → skin arterioles → vasoconstriction → temperature falls","why":"Narrowing keeps heat in; in the heat the arterioles widen.","_n":"3z80f","_k":"42d54288"},{"t":"↑ temperature → thermoreceptors → hypothalamus → skeletal muscles → shivering → temperature falls","why":"Shivering warms.","_n":"4081f","_k":"17b488e6"},{"t":"↑ temperature → sweat glands → thermoreceptors → hypothalamus → temperature falls","why":"Order scrambled.","_n":"4182f","_k":"94c664ac"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"During a heat warning, public health advice says to drink water often and rest in the shade during the hottest hours. Using thermoregulation, why?","options":[{"t":"Water keeps sweating going, and shade and rest lower the heat load the body has to remove","why":"Dehydration limits sweating, and humid air slows evaporation, so cooling falls behind.","_n":"4283f","_k":"1fa17e59"},{"t":"Water lowers the set point","why":"In a fever the hypothalamus raises the set point, and the loop works normally around the new target.","_n":"437cf","_k":"af64a476"},{"t":"Rest makes the skin’s vessels narrow","why":"Rest lowers heat production.","_n":"447df","_k":"e8af5d52"},{"t":"Shade increases sweating","why":"Shade reduces heat gained from the sun.","_n":"458af","_k":"be43318f"}]},"b":{"prompt":"Outdoor workers on a −25 °C day are advised to wear layers and take warm-up breaks. Using thermoregulation, why?","options":[{"t":"Breaks raise the set point","why":"In a fever the hypothalamus raises the set point, and the loop works normally around the new target.","_n":"4689f","_k":"a63456a0"},{"t":"Layers stop shivering, which wastes energy","why":"Shivering is a useful heat source; layers reduce the need for it.","_n":"4788f","_k":"dcae65d8"},{"t":"Layers reduce heat loss, and breaks prevent the heat loss from exceeding what vasoconstriction and shivering can make up","why":"Each warming response has a limit; layers and breaks keep the load within it.","_n":"4887f","_k":"a760b7b3"},{"t":"Layers make the body sweat, which warms it","why":"Sweat cools only when it evaporates: evaporation takes heat from the skin.","_n":"4986f","_k":"0bf65ae8"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A student tests how long skin temperature takes to recover after a hand is held in 10 °C water. Which should be the \u003cstrong>controlled\u003c/strong> variables?","options":[{"t":"Nothing; each trial should differ","why":"Uncontrolled differences make results unfair.","_n":"4a85f","_k":"8ec95f3f"},{"t":"The time after removal","why":"That’s the independent variable for the graph.","_n":"4b84f","_k":"8c26d0e5"},{"t":"The skin temperature and the recovery time","why":"Those are measured.","_n":"4c83f","_k":"1ed230db"},{"t":"The water temperature and how long the hand stays in the water","why":"Both could change the result, so both stay the same.","_n":"4d82f","_k":"a1164842"}]},"b":{"prompt":"A student tests whether a fan cools a wet arm faster than a dry arm. What is the \u003cstrong>independent\u003c/strong> variable?","options":[{"t":"The fan speed","why":"It should stay the same: controlled.","_n":"4e81f","_k":"41c48b0f"},{"t":"Skin temperature","why":"That’s measured: dependent.","_n":"4f70f","_k":"594d9c28"},{"t":"The room temperature","why":"It should be controlled.","_n":"4g71f","_k":"1552ddc0"},{"t":"Whether the arm is wet or dry","why":"It’s what the student changes.","_n":"4h6ef","_k":"30517767"}]}}]},"task":{"title":"Winter hike","summary":"Winter hike","statement":"\u003cp>Plan a hiker’s outfit and pace for a −10 °C morning so their body doesn’t have to work hard. There’s more than one plan that works. Can you find them all?\u003c/p>\u003col class=\"thr-conds\">\u003cli>The core stays at 37 °C.\u003c/li>\u003cli>No shivering.\u003c/li>\u003cli>No sweating (sweat-soaked layers lose their insulation in the cold).\u003c/li>\u003cli>The hiker keeps moving: walking or running.\u003c/li>\u003cli>Arms are covered (no T-shirt alone).\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">The surroundings are fixed at −10 °C and the hiker is hydrated.\u003c/p>","inputs":[{"id":"clo","label":"Clothing","options":[["tee","T-shirt"],["sweater","Sweater"],["parka","Parka"]]},{"id":"hat","label":"Hat","options":[["off","Off"],["on","On"]]},{"id":"act","label":"Activity","options":[["rest","Resting"],["walk","Walking"],["run","Running"]]}],"checks":["Core at 37 °C","No shivering","No sweating","Keeps moving","Arms covered"],"tips":["The load is beyond what the body can handle; add clothing or move faster.","Shivering means the load is −2 or lower: add a layer, a hat or pace.","Sweating means the load is +2 or higher: take something off or slow down.","Resting isn’t hiking.","Cover your arms."],"explainPrompt":"Explain why adding a hat could turn a failing plan into a working one, and why too much clothing could also fail.","vocab":"Use the words heat load, shivering, sweating, vasoconstriction and set point.","more":"There’s more than one plan that works. Can you find them all?","afterAt":5,"after3":"Every answer keeps the load between −1 and +1. More clothing calls for less pace."},"cards":[["Control centre for temperature","The hypothalamus, comparing readings with a set point near 37 °C."],["Vasoconstriction","Skin arterioles narrow; less blood at the surface; heat kept in."],["Vasodilation","Skin arterioles widen; more blood at the surface; heat lost."],["Shivering","Rapid skeletal muscle contractions that release heat."],["Sweating","Evaporation of sweat removes heat. It needs water and dry enough air."],["Long-term cold response","More thyroid hormone raises metabolic rate over weeks."],["Hypothermia","Core temperature below about 35 °C."],["Heat stroke","Core temperature about 40 °C or higher; dangerous."],["Fever","A raised set point. Chills as it rises; sweating as it breaks."],["Ectotherm vs endotherm","Heat mainly from outside (regulates by behaviour) vs heat mainly from metabolism."],["Countercurrent exchange","Warm outgoing blood warms cold returning blood, so extremities lose little heat."],["Brown fat","Mitochondria leak H⁺ back without making ATP, releasing heat (thermogenin)."]]}};</script>
