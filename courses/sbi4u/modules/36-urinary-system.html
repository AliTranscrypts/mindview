}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}

body{

.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 36: nephron drawings (S1 explorer, label quiz), concentration strip, dipstick, hormone stations, task, hero */
/* radio groups (from SBI4U 01 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* S1 diagram explorer */
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs,.s1-tags{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1px dashed transparent;border-radius:5px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}
.s1-b[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--hi-soft)}
.s1-b.good{border:2px solid var(--green)}
.s1-tag{position:absolute;transform:translate(0,-50%);font:700 .72rem/1.3 var(--font-ui);background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.05em .55em;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.s1-tag.r{transform:translate(-100%,-50%)}
.s1-tag.c{transform:translate(-50%,-50%)}
.s1-tag.ur-ptag{border-color:var(--ink-2);font-weight:600}

/* nephron drawing: outline --ink, capillaries --ink-2, medulla hatching (pattern, not colour) */
.ur-hl{stroke:var(--ink-2);stroke-width:1;opacity:.35}
.ur-zone{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 4}
.ur-svgt{font:600 11px var(--font-ui);fill:var(--ink)}
.ur-svgt.mut{fill:var(--ink-2)}
.ur-svgt.sm{font-size:10.5px}
.ur-svgt.b{font-weight:700}
.ur-cap{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linejoin:round}
.ur-vw{fill:none;stroke:var(--ink-2);stroke-linecap:round;stroke-linejoin:round}
.ur-vl{fill:none;stroke:var(--sheet);stroke-linecap:round;stroke-linejoin:round}
.ur-capfill{fill:var(--paper);stroke:none}
.ur-capsule{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.ur-knot{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.ur-tw{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.ur-tl{fill:none;stroke:var(--sheet);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.ur-gate{stroke-width:1.2}
.ur-gate.on{fill:var(--sheet);stroke:var(--pen)}
.ur-gate.off{fill:var(--ink);stroke:var(--ink)}
.ur-arr{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* molecule tokens: water --pen, glucose brown, urea --ink-2, Na⁺ ink with a label, proteins large --ink outlines, H⁺ magenta */
.ur-d-w{fill:var(--bio-o2)}
.ur-d-g{fill:var(--bio-carbon)}
.ur-d-u{fill:var(--ink-2)}
.ur-d-na{fill:var(--ink)}
.ur-d-h{fill:var(--bio-h)}
.ur-d-b{fill:var(--ink-2)}
.ur-d-t{font:700 7.5px var(--font-ui);fill:var(--sheet);text-anchor:middle}
.ur-d-t.big{font-size:9.5px}
.ur-d-p{fill:none;stroke:var(--ink);stroke-width:2}
.ur-d-p.thin{stroke-width:1}

/* explorer layout */
.ur-pg .pg-ctrl{display:grid;gap:10px}
.ur-pg .pg-ctrl > div[hidden]{display:none}
.ur-caption{margin:8px 0 0;font-size:.9rem;color:var(--ink-2);min-height:1.4em}
.ur-note{margin:6px 0 0}
.ur-readbox summary{font-weight:700;cursor:pointer}
.ur-strip{width:100%;height:auto;display:block;margin-top:8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ur-grid{stroke:var(--rule);stroke-width:1}
.ur-fil{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linejoin:round}
.ur-med{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:6 4;stroke-linejoin:round}
.ur-fdot{fill:var(--pen)}
.ur-dip{margin-top:12px;border:1.5px solid var(--ink-2);border-radius:8px;padding:8px 10px}
.ur-dip-h{margin:0 0 6px;font-weight:700;font-size:.9rem}
.ur-pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ur-pad{display:flex;flex-direction:column;border:1.5px solid var(--rule);border-radius:6px;padding:4px 8px;background:var(--paper)}
.ur-pad.flag{border:2.5px solid var(--ink)}
.ur-pad-l{font-size:.78rem;color:var(--ink-2);font-weight:700}
.ur-pad-v{font-weight:700;font-variant-numeric:tabular-nums}
.ur-unit{font-size:.95rem;color:var(--ink-2)}

/* Part 3: stations */
.ur-sttabs{margin:0 0 12px}
.ur-station[hidden]{display:none}
.ur-h4{margin:4px 0 6px}
.ur-loop{list-style:none;margin:12px 0 4px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 26px}
.ur-loop li:nth-child(4){grid-row:2;grid-column:3}
.ur-loop li:nth-child(5){grid-row:2;grid-column:2}
.ur-loop li:nth-child(6){grid-row:2;grid-column:1}
.ur-lp,.ur-ps{position:relative;display:flex;gap:8px;align-items:flex-start;border:1.5px dashed var(--rule);border-radius:8px;padding:8px 10px;min-height:3.4em;font-size:.92rem;color:var(--ink-2)}
.ur-lp.on,.ur-ps.on{border-style:solid;border-color:var(--ink-2);color:var(--ink)}
.ur-lp.cur,.ur-ps.cur{border:2.5px solid var(--ink);background:var(--hi-soft)}
.ur-lp.hi.on{border-color:var(--bio-fadh);border-width:2.5px}
.ur-ps.ald.on{border-color:var(--bio-carbon);border-width:2.5px}
.ur-lpn{flex:0 0 auto;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
.ur-loop li::after{position:absolute;color:var(--ink-2);font-weight:700}
.ur-loop li:nth-child(1)::after,.ur-loop li:nth-child(2)::after{content:"→";right:-20px;top:50%;transform:translateY(-50%)}
.ur-loop li:nth-child(3)::after{content:"↓";bottom:-20px;left:50%}
.ur-loop li:nth-child(4)::after,.ur-loop li:nth-child(5)::after{content:"←";left:-20px;top:50%;transform:translateY(-50%)}
.ur-loop li:nth-child(6)::after{content:"↑";top:-20px;left:50%}
.ur-back{margin:4px 0 0}
.ur-live{margin:8px 0;font-size:.92rem;min-height:1.4em}
.ur-path{list-style:none;margin:12px 0 4px;padding:0;display:grid;gap:18px}
.ur-path li + li::before{content:"↓";position:absolute;top:-18px;left:1.2em;color:var(--ink-2);font-weight:700}
.ur-hcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.ur-hcard{border:1.5px solid var(--rule);border-left:6px solid var(--ink-2);border-radius:8px;padding:8px 12px}
.ur-hcard.adh{border-left-color:var(--bio-fadh)}
.ur-hcard.ald{border-left-color:var(--bio-carbon)}
.ur-hcard h5{margin:0 0 6px;font-size:1rem}
.ur-hcard dl{margin:0;display:grid;gap:4px;font-size:.88rem}
.ur-hcard dt{color:var(--ink-2);font-weight:700}
.ur-hcard dd{margin:0}
.ur-phwrap{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.ur-phsvg,.ur-diasvg{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.ur-sl input{width:100%;accent-color:var(--ink)}
.ur-fl{fill:var(--paper)}
.ur-bl{fill:var(--paper);opacity:.6}
.ur-cell{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.ur-ph-arr{fill:none;stroke:var(--ink-2);stroke-linecap:round;stroke-linejoin:round}
.ur-ph-arr.h{stroke:var(--bio-h)}
.ur-ph-arr.g{stroke:var(--bio-carbon);stroke-width:1.6}
.ur-ph-arr.u{stroke:var(--ink-2)}
.ur-memb{stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}
.ur-clues{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ur-clue{border:2px dashed var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.45em .8em;min-height:44px;font-weight:700}
.ur-clue[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--hi-soft)}
.ur-clue.done{border-style:solid;border-color:var(--green);background:var(--good-bg);opacity:.9}
.ur-samples{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ur-sample{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;min-width:0}
.ur-sample.ready{border-color:var(--ink-2)}
.ur-sample:not(:disabled):hover{border-color:var(--pen)}
.ur-sample.done{border-color:var(--green);background:var(--good-bg)}
.ur-sample:disabled{color:var(--ink)}
.ur-sname{font-weight:700}
.ur-sdl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:.84rem}
.ur-sdl span:nth-child(odd){color:var(--ink-2);font-weight:700}
.ur-smatch{font-size:.84rem;font-weight:700}
#ur-uafb{margin-top:10px}
.ur-diactl{display:grid;gap:10px;margin:10px 0}
.ur-stse{margin-top:14px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px}
.ur-stse h5{margin:0 0 8px;font-size:1rem}
.ur-stse-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ur-stse-c{border:1.5px dashed var(--rule);border-radius:6px;padding:6px 10px}
.ur-stse-c h6{margin:0 0 4px;font-size:.92rem}
.ur-stse-c p{margin:0;font-size:.9rem}
.ur-canada{margin:10px 0 0;font-size:.92rem}

/* Practice: label quiz; task */
.lq-labs{margin:0 0 10px}
.lq-dx{margin-top:10px;max-width:640px}
.wk-inputs{display:grid;gap:10px;margin:12px 0}
.wk-model{margin:10px 0 4px}

/* hero */
.ur-hero{position:relative;width:100%;aspect-ratio:560/380}
.ur-hero svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ur-h-arr{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ur-h-t{font:600 15px var(--font-ui);fill:var(--ink)}
.ur-h-t.b{font-weight:700}
.ur-h-t.sm{font-size:13px}
.ur-h-big{font:800 22px var(--font-ui);fill:var(--ink)}

@media (max-width:820px){
  .ur-samples{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ur-phwrap{grid-template-columns:1fr}
}
@media (max-width:560px){
  .ur-loop{grid-template-columns:1fr;gap:20px}
  .ur-loop li:nth-child(n){grid-row:auto;grid-column:auto}
  .ur-loop li:nth-child(n)::after{content:"↓";left:1.2em;right:auto;top:auto;bottom:-19px;transform:none}
  .ur-loop li:nth-child(6)::after{content:"↺";bottom:-19px}
  .ur-hcards,.ur-stse-g{grid-template-columns:1fr}
  .ur-samples{grid-template-columns:1fr}
  .ur-pg .rg.seg button{padding:.4em .55em;font-size:.86rem}
}

rt Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"a3220973","content":{"id":"36-urinary-system","kind":"topic","title":"The urinary system","topic":"The Urinary System","readyTopic":"the urinary system","hero":{"headline":"Filter everything, keep almost all of it","text":"Your kidneys filter the liquid part of your blood about 60 times a day, then send almost all of it back. Each \u003cstrong>nephron\u003c/strong> \u003cstrong>filters\u003c/strong>, \u003cstrong>reabsorbs\u003c/strong> what the body needs and \u003cstrong>secretes\u003c/strong> what it doesn’t. Hormones such as \u003cstrong>ADH\u003c/strong> and \u003cstrong>aldosterone\u003c/strong> decide, minute by minute, how much water and salt you keep. In this module you’ll trace molecules through a nephron and use urine as evidence about the body.","fig":{"html":"\u003cdiv class=\"ur-hero\" id=\"ur-hero\" role=\"img\" aria-label=\"A single nephron beside its capillaries. Blood enters the glomerulus; water, glucose and urea are filtered into Bowman’s capsule, while proteins and blood cells stay in the blood. Along the proximal tubule all the glucose and most of the water return to the capillary. Around the loop of Henle water leaves the descending limb and salt leaves the ascending limb. A thin trickle reaches the collecting duct. Labelled arrows: Filtration (glomerulus to capsule), Reabsorption (tubule to blood), Secretion (blood to tubule). 180 L of filtrate a day at the capsule; about 1.5 L of urine at the collecting duct.\">\u003c/div>"}},"goals":["I can name the parts of the urinary system and the nephron and say what each does.","I can explain filtration, reabsorption and secretion, and trace a substance through a nephron.","I can explain how the loop of Henle and ADH produce concentrated or dilute urine.","I can explain how ADH, aldosterone and renin–angiotensin keep water, Na⁺ and blood pressure in balance, and how the kidney helps control pH.","I can predict and interpret what appears in urine when blood chemistry or the nephron changes.","I can explain how dialysis works and weigh it against a transplant."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Membrane transport","goal":3,"prompt":"Water moves by osmosis from a dilute solution to a more concentrated one through a membrane permeable to water. Which way does water move if a tube with filtrate at 300 mOsm/L passes through fluid at 900 mOsm/L?","options":[{"t":"Out of the tube, into the fluid","why":"Water moves toward the higher solute concentration.","_n":"02fa","_k":"dbf65014"},{"t":"Into the tube","why":"That’s toward the lower concentration: backwards.","_n":"130a","_k":"7bdc91a7"},{"t":"Neither way","why":"The concentrations differ, so water moves if the membrane lets it.","_n":"231a","_k":"9920b875"},{"t":"Out of the tube, but only if salt moves too","why":"Water moves on its own by osmosis.","_n":"32aa","_k":"c5730a47"}],"hints":["Water moves toward more solute.","Which side has more?","The outside fluid: out of the tube."]},{"id":"w2","skill":"Membrane transport","goal":2,"prompt":"Cells take glucose \u003cstrong>from\u003c/strong> a low concentration \u003cstrong>into\u003c/strong> a higher one. What kind of transport is this?","options":[{"t":"Diffusion","why":"Diffusion goes from high to low.","_n":"42ba","_k":"76829bdf"},{"t":"Filtration","why":"Filtration is pressure-driven, not against a gradient into cells.","_n":"52ca","_k":"d3a53883"},{"t":"Osmosis","why":"Osmosis is water, not glucose.","_n":"62da","_k":"67e21d73"},{"t":"Active transport","why":"Moving against a gradient needs energy.","_n":"726a","_k":"b0afc4b7"}],"hints":["Is it with or against the gradient?","Against needs energy (ATP).","Active transport."]},{"id":"w3","skill":"Feedback and hormones","goal":4,"prompt":"Which gland releases ADH into the blood?","options":[{"t":"The posterior pituitary","why":"ADH is made in the hypothalamus and released there.","_n":"827a","_k":"d7d41815"},{"t":"The kidney","why":"The kidney is ADH’s target.","_n":"9df5","_k":"aa70fad0"},{"t":"The anterior pituitary","why":"That releases TSH, FSH and LH; ADH comes from the posterior lobe.","_n":"ade5","_k":"1ec4d25b"},{"t":"The adrenal gland","why":"It releases aldosterone and epinephrine.","_n":"bdd5","_k":"1b06f89d"}],"hints":["Recall module 34’s two pathways.","Hypothalamus neurons end in one lobe.","Posterior pituitary."]},{"id":"w4","skill":"Feedback and hormones","goal":4,"prompt":"After a long run without drinking, your blood becomes more concentrated. What should your body do?","options":[{"t":"Make more urine, because ADH increases urine output","why":"ADH does the opposite.","_n":"cdc5","_k":"90521a1f"},{"t":"Make more urine to remove salt","why":"That would lose water you need.","_n":"ddb5","_k":"4ba2cb45"},{"t":"Stop all urine production","why":"Some urine is always needed to remove wastes.","_n":"eda5","_k":"11bbd24b"},{"t":"Keep more water, making less urine","why":"Negative feedback restores the water balance.","_n":"fd95","_k":"e9f094d3"}] t urine concentration: the medulla’s gradient and the duct’s water permeability.","Only a long loop builds a gradient above 2000.","Long loop and high ADH: 3000 mOsm/L."]}]},"part3":{"slug":"hormones","name":"Hormones","heading":"Hormones that tune the kidney","intro":"Five stations. Follow each hormone from the brain or the kidney itself to the tubule, zoom in on pH control, then use urine data and a dialysis machine as evidence.","stations":[{"id":"adh","t":"1. ADH"},{"id":"raas","t":"2. Renin–angiotensin"},{"id":"ph","t":"3. pH balance"},{"id":"ua","t":"4. Check it with data"},{"id":"dia","t":"5. Dialysis"}],"adh":{"intro":"Step through the water-balance loop. Then switch on \u003cstrong>Alcohol\u003c/strong> and step through again.","loop":["↑ Blood concentration (water is short)","Osmoreceptors in the hypothalamus detect it","The posterior pituitary releases ADH","Collecting ducts insert aquaporins","More water is reabsorbed: less, more concentrated urine","Blood concentration falls back to normal"],"alcohol":["Alcohol reaches the brain","Osmoreceptors in the hypothalamus","Alcohol reduces ADH release from the posterior pituitary","Fewer aquaporins in the collecting ducts","Less water is reabsorbed: larger, more dilute urine","The blood becomes more concentrated: thirst"],"rows":{"off":[["ADH release","Rises when blood is concentrated"],["Urine","Less, more concentrated"],["Blood","Concentration falls back to normal"]],"on":[["ADH release","Reduced by alcohol"],["Urine","Larger in volume, more dilute"],["Blood","More concentrated: thirst"]]}},"raas":{"intro":"Step through the response to low blood pressure.","steps":["↓ Blood pressure or volume","Cells near the glomerulus release \u003cstrong>renin\u003c/strong>","Angiotensinogen (from the blood) is converted to \u003cstrong>angiotensin II\u003c/strong>","Angiotensin II acts three ways: (a) arterioles constrict · (b) the adrenal cortex releases \u003cstrong>aldosterone\u003c/strong> · (c) thirst","More Na⁺ reabsorbed (and K⁺ secreted) in the distal tubule and collecting duct","Water follows the Na⁺ by osmosis","Blood volume and pressure rise"],"cards":[{"id":"adh","h":"ADH","from":"Posterior pituitary","trig":"Concentrated blood (osmoreceptors)","target":"Collecting duct","act":"Moves water: opens water channels (aquaporins)"},{"id":"ald","h":"Aldosterone","from":"Adrenal cortex","trig":"Low blood pressure (renin–angiotensin)","target":"Distal tubule and collecting duct","act":"Moves Na⁺, and water follows"}]},"ph":{"intro":"Zoom to the molecules: one tubule cell between the filtrate and the blood. Move the blood pH and watch what the cell does.","normal":"Normal blood pH: 7.35–7.45."},"ua":{"intro":"Four urinalysis cards. Tap a clue, then tap the sample that fits it.","samples":[{"id":"A","vol":"1.5","glu":"none","pro":"none","conc":"400"},{"id":"B","vol":"3.0","glu":"present","pro":"none","conc":"500"},{"id":"C","vol":"1.4","glu":"none","pro":"present","conc":"420"},{"id":"D","vol":"8.0","glu":"none","pro":"none","conc":"80"}],"clues":[{"id":"filter","t":"Filter damaged","_a":"Q3AQ","why":"Protein in urine means the glomerulus lets large molecules through."},{"id":"glucose","t":"Blood glucose above threshold","_a":"Q3EQ","why":"Glucose in urine: the carriers are saturated. Extra glucose in the filtrate holds water in by osmosis, which is why the volume is larger."},{"id":"adh","t":"Little or no ADH","_a":"Q3cQ","why":"A large volume of very dilute urine: the collecting duct is keeping its water."},{"id":"typical","t":"Typical","_a":"Q3IQ","why":"About 1.5 L a day, no glucose, no protein: a typical result."}],"wrong":"Read that card’s numbers again: protein points to the filter, glucose to blood glucose, and a large, very dilute volume to ADH. Try another sample."},"dia":{"intro":"A hemodialysis schematic: blood on one side of a partially permeable membrane, dialysis fluid on the other. Change the flow direction and the fluid.","stse":[{"h":"Dialysis","t":"Several sessions a week, each a few hours, for as long as the kidneys don’t work (or until a transplant)."},{"h":"Transplant","t":"One operation, after a wait on a waiting list for a matching kidney, then lifelong anti-rejection medicine."}],"canada":"In Canada, many more people need a kidney than receive one each year, so many wait on dialysis. In Ontario, people aged 16 and older can register their consent to donate organs and tissue through ServiceOntario or online at beadonor.ca."},"quickCheck":{"title":"Quick check","summary":"Hormones quick check","items":[{"id":"q1","goal":4,"prompt":"Which hormone mainly controls Na⁺ reabsorption?","choices":[{"t":"Insulin","fb":"ADH moves water; aldosterone moves Na⁺.","_n":"14625","_k":"4567d870"},{"t":"ADH","fb":"ADH moves water; aldosterone moves Na⁺.","_n":"15635","_k":"e29024e4"},{"t":"Renin","fb":"ADH moves water; aldosterone moves Na⁺.","_n":"16645","_k":"561d08a4"},{"t":"Aldosterone","fb":"Right. Aldosterone increases Na⁺ reabsorption, and water follows.","_n":"17655","_k":"c1c5eb43"}]},{"id":"q2","goal":[3,4],"prompt":"Alcohol lowers ADH release. The urine becomes…","choices":[{"t":"larger and more dilute","fb":"Right. Less ADH: the collecting duct keeps its water.","_n":"18665","_k":"63363acb"},{"t":"protein-rich","fb":"Less ADH: the collecting duct keeps its water.","_n":"19675","_k":"9cb1c174"},{"t":"smaller and more concentrated","fb":"Less ADH: the collecting duct keeps its water.","_n":"1a685","_k":"d323f7a3"},{"t":"unchanged","fb":"Less ADH: the collecting duct keeps its water.","_n":"1b595","_k":"c9f8db30"}]},{"id":"q3","goal":4,"prompt":"Blood is too acidic. The tubule cells…","choices":[{"t":"reabsorb more urea","fb":"Removing H⁺ and keeping bicarbonate raises blood pH.","_n":"1c5a5","_k":"c7963739"},{"t":"stop filtering","fb":"Removing H⁺ and keeping bicarbonate raises blood pH.","_n":"1d675","_k":"6faacee9"},{"t":"secrete more H⁺","fb":"Right. Removing H⁺ and keeping bicarbonate raises blood pH.","_n":"1e665","_k":"46d096f2"},{"t":"secrete more HCO₃⁻ into urine","fb":"Removing H⁺ and keeping bicarbonate raises blood pH.","_n":"1f655","_k":"e7204969"}]},{"id":"q4","goal":6,"prompt":"Why does dialysis fluid contain glucose?","choices":[{"t":"To thin the blood","fb":"Equal concentrations mean no net diffusion.","_n":"1g645","_k":"bf461305"},{"t":"To feed the patient","fb":"Equal concentrations mean no net diffusion.","_n":"1h6b5","_k":"f1f5058c"},{"t":"To remove urea faster","fb":"Equal concentrations mean no net diffusion.","_n":"1i6a5","_k":"3263d7e6"},{"t":"So glucose doesn’t diffuse out of the blood","fb":"Right. Equal concentrations mean no net diffusion.","_n":"1j695","_k":"e7b67736"}]}]}},"practice":{"activities":[{"id":"label","type":"custom","title":"Label the nephron","summary":"Label the nephron","goal":[1,2],"instruction":"Tap a label, then tap the structure it names. Its job appears when it’s right.","how":"","labels":[{"id":"glom","t":"Glomerulus","job":"A knot of capillaries where blood is filtered","hints":["Where does blood get filtered?","A knot of capillaries inside the cup.","Tap the knot of capillaries inside Bowman’s capsule."]},{"id":"caps","t":"Bowman’s capsule","job":"A cup that collects the filtrate","hints":["What collects the filtrate first?","It’s a cup.","Tap the cup around the knot of capillaries."]},{"id":"pct","t":"Proximal convoluted tubule","job":"Reabsorbs all glucose and amino acids, and most water and Na⁺","hints":["Where does the filtrate go right after the cup?","A twisted tube in the cortex, before the loop.","Tap the twisted tube leaving the capsule."]},{"id":"desc","t":"Descending limb of the loop","job":"Lets water out into the salty medulla","hints":["Which way does the filtrate flow first in the loop?","Down into the medulla, before the bend.","Tap the limb that runs down from the proximal tubule."]},{"id":"asc","t":"Ascending limb of the loop","job":"Pumps Na⁺ and Cl⁻ out; holds water in","hints":["Which limb comes after the bend?","I decimal)","_a":"WAocAA==","tol":0.05,"display":"99.2%","unit":"%","wrong":[{"match":0.8,"fb":"That’s the part that left."}],"hints":["Find the percentage that left first: 1.5 ÷ 180 × 100.","About 0.8% left as urine.","100 − 0.8 = 99.2% reabsorbed."]},{"id":"s2","kind":"num","goal":3,"prompt":"In the model with a medium loop, what volume of urine is made with ADH high?","_a":"UR0H","display":"0.5 L/day","unit":"L/day","wrong":[{"match":1.5,"fb":"That’s with moderate ADH."}],"hints":["With ADH high, the urine reaches the medulla’s maximum.","A medium loop’s maximum is 1200 mOsm/L, and V = 600 ÷ U.","600 ÷ 1200 = 0.5 L/day."]},{"id":"s3","kind":"mc","goal":3,"star":true,"prompt":"A person drinks 1 L of water quickly. Predict ADH, urine volume and urine concentration over the next hour.","options":[{"t":"ADH falls; more urine; more dilute","why":"Extra water dilutes the blood, so less ADH is released and the collecting duct keeps its water.","_n":"1k685","_k":"a7804ada"},{"t":"ADH rises; less urine; more concentrated","why":"Extra water dilutes the blood, so less ADH is released.","_n":"1l5f5","_k":"077bb369"},{"t":"ADH falls; less urine; more concentrated","why":"Less ADH means the collecting duct keeps its water: more urine, not less.","_n":"1m5e5","_k":"40b2b543"},{"t":"ADH stays the same; the urine doesn’t change","why":"Diluted blood is a change the hypothalamus responds to: negative feedback lowers ADH.","_n":"1n6d5","_k":"0646395c"}],"hints":["Does drinking water make the blood more or less concentrated?","Less concentrated, so the hypothalamus releases less ADH.","ADH falls; more urine; more dilute."]},{"id":"s4","kind":"mc","goal":3,"star":true,"prompt":"A drug blocks the Na⁺/Cl⁻ pumps in the ascending limb. Predict the medulla’s gradient and the urine.","options":[{"t":"Glucose appears in the urine","why":"Glucose is handled in the proximal tubule.","_n":"1o6e5","_k":"fb0b8428"},{"t":"The gradient grows; small, more concentrated urine","why":"With no salty medulla, water has nowhere to go.","_n":"1p6b5","_k":"d5c8ee64"},{"t":"The gradient shrinks; less water leaves the collecting duct; large, dilute urine","why":"No salt pumped out means no salty medulla, so water stays in the duct.","_n":"1q6c5","_k":"4b9b934b"},{"t":"No change, because ADH is still present","why":"ADH needs the gradient to work.","_n":"1r695","_k":"ab06e2f1"}],"hints":["What builds the medulla’s salt gradient?","The ascending limb’s pumps.","No gradient, so water stays in the duct: lots of dilute urine."]},{"id":"s5","kind":"mc","goal":5,"star":true,"prompt":"Fair test: a student compares urine output after drinking 500 mL of water vs 500 mL of a salty sports drink. Which plan is best?","options":[{"t":"The same people on two different mornings, the same time since breakfast, urine collected for the same 2 hours, the drink order swapped for half the group","why":"Each person is their own comparison, and timing and order are controlled.","_n":"1s6a5","_k":"ad78993b"},{"t":"The same people on two mornings, always water first","why":"A fixed order mixes up the drink with the day; swap the order for half the group.","_n":"1t675","_k":"12b48bf9"},{"t":"The same people, water in the morning and the sports drink that afternoon","why":"Urine output changes over a day; test at the same time since a meal, on different days.","_n":"1u685","_k":"6c34635f"},{"t":"Two different groups, one drink each","why":"People differ in size and habits; use each person as their own comparison.","_n":"1v655","_k":"8a2a0679"}],"hints":["What could differ between the two tests besides the drink?","The people, the time of day and the order.","Same people, same timing and collection period, order swapped for half the group."]},{"id":"s6","kind":"mc","goal":5,"star":true,"prompt":"A patient’s urine has protein and red blood cells but no glucose, and blood glucose is normal. Which part of the nephron is most likely damaged? Explain.","options":[{"t":"The proximal tubule","why":"Its damage would show up as glucose in urine, not protein.","_n":"1w665","_k":"82c65083"},{"t":"The collecting duct","why":"The collecting duct handles water; it can’t let proteins and cells into the filtrate.","_n":"1xd35","_k":"ba6558b7"},{"t":"The glomerulus (the filter): large proteins and cells are getting through","why":"A healthy filter holds back proteins and cells; these are getting through.","_n":"1yd25","_k":"83108564"},{"t":"The loop of Henle","why":"The loop builds the salt gradient; damage there changes urine concentration, not protein.","_n":"1zd55","_k":"3ca70353"}],"hints":["What normally stops proteins and cells?","The size of the glomerulus’s filter.","The glomerulus."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Tomas","how":"","instruction":"Tomas made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Describe what happens to glucose in a healthy nephron.","steps":["Blood enters the glomerulus under pressure.","Glucose stays in the blood because the body needs it.","So there is no glucose in the filtrate.","So there is no glucose in the urine."],"_a":"UA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. The mistake is earlier.","The conclusion is true, but for a different reason."],"fixes":[{"t":"Glucose is filtered and then reabsorbed in the collecting duct.","why":"It’s the proximal tubule.","_n":"20d45","_k":"67810151"},{"t":"Step 2 is correct.","why":"All small solutes are filtered, useful or not.","_n":"21d75","_k":"21136e3f"},{"t":"Glucose is too large to be filtered.","why":"Glucose is a small molecule.","_n":"22d65","_k":"f0bbf459"},{"t":"Glucose is small, so it’s filtered into Bowman’s capsule; then the proximal tubule actively reabsorbs all of it.","why":"All small solutes are filtered; the proximal tubule takes the glucose back.","_n":"23d95","_k":"c9e231c0"}],"hints":["What decides what passes the filter: usefulness or size?","Size.","Filtered, then reabsorbed."]},{"id":"e2","goal":3,"task":"Explain the urine of someone who is dehydrated.","steps":["Osmoreceptors detect that the blood is too concentrated.","The posterior pituitary releases more ADH.","ADH makes the collecting duct less permeable to water.","So the urine is small in volume and concentrated."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","The result is right, but step 3 gives the wrong reason."],"fixes":[{"t":"ADH makes the loop of Henle longer.","why":"Loop length is fixed by anatomy. Loop length sets how salty the medulla can get, which sets the most concentrated urine possible.","_n":"24d85","_k":"eec8b5c9"},{"t":"ADH makes the collecting duct \u003cstrong>more\u003c/strong> permeable, so water leaves into the salty medulla.","why":"More aquaporins let water leave by osmosis, so the urine is small and concentrated.","_n":"25db5","_k":"f7de8085"},{"t":"Step 3 is correct.","why":"Less permeable would mean more, dilute urine.","_n":"26da5","_k":"838dde2a"},{"t":"ADH increases Na⁺ reabsorption.","why":"That’s aldosterone.","_n":"27694","_k":"98e3e7fe"}],"hints":["Antidiuretic means ‘against urine flow’.","Keeping water needs a leakier duct.","More permeable."]},{"id":"e3","goal":6,"task":"Explain how hemodialysis cleans the blood.","steps":["Blood flows past a partially permeable membrane.","The dialysis fluid on the other side is pure water.","Urea diffuses out of the blood.","The fluid flows the opposite way to keep a gradient."],"_a":"UA==","stepFb":["Step 1 is correct.","","Step 3 is true.","Step 4 is correct."],"fixes":[{"t":"The fluid has normal blood levels of glucose and salts but no urea, so only the wastes diffuse out.","why":"Equal glucose and salt levels mean no net loss of them; urea still diffuses out.","_n":"286a4","_k":"2181a3b2"},{"t":"The fluid has extra urea to push urea out.","why":"Urea would diffuse \u003cem>in\u003c/em>.","_n":"296b4","_k":"37f3bc73"},{"t":"Step 2 is correct.","why":"Pure water would pull out glucose and salts too.","_n":"2a6c4","_k":"61f72a82"},{"t":"The fluid has no glucose, to lower blood sugar.","why":"Glucose would be lost.","_n":"2b654","_k":"ffe425bb"}],"hints":["Which substances should stay in the blood?","Glucose and salts.","Match them in the fluid; leave urea out."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the nephron explorer: how much is filtered, or how much comes back?"},{"id":"j2","q":"In your own words, why can a longer loop of Henle make more concentrated urine?"},{"id":"j3","q":"Explain to a friend the difference between what ADH does and what aldosterone does."},{"id":"j4","q":"Which part of the nephron is still confusing? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which order does filtrate pass through?","options":[{"t":"Bowman’s capsule → proximal tubule → loop of Henle → distal tubule → collecting duct","why":"Capsule, proximal tubule, loop, distal tubule, then the collecting duct.","_n":"2c664","_k":"4ddeb27a"},{"t":"Bowman’s capsule → loop of Henle → proximal tubule → distal tubule → collecting duct","why":"The proximal tubule comes right after the capsule.","_n":"2d674","_k":"24c2d9c7"},{"t":"Collecting duct → distal tubule → loop of Henle → proximal tubule → Bowman’s capsule","why":"That’s backwards.","_n":"2e684","_k":"ff885be5"},{"t":"Bowman’s capsule → proximal tubule → distal tubule → loop of Henle → collecting duct","why":"The loop sits between the two tubules.","_n":"2f614","_k":"5e4b94c3"}]},"b":{"prompt":"Where does filtration happen?","options":[{"t":"In the loop of Henle","why":"The loop reabsorbs; it doesn’t filter.","_n":"2g624","_k":"8b44b2fd"},{"t":"In the bladder","why":"The bladder only stores urine.","_n":"2hef4","_k":"e4a5c39b"},{"t":"From the glomerulus into Bowman’s capsule","why":"Blood pressure pushes water and small solutes out of the glomerulus into the capsule.","_n":"2iee4","_k":"681144ea"},{"t":"In the collecting duct","why":"That’s where ADH acts.","_n":"2jed4","_k":"688b2057"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which substance is in the filtrate but \u003cstrong>not\u003c/strong> in the urine of a healthy person?","options":[{"t":"Plasma protein","why":"It isn’t in the filtrate either.","_n":"2kec4","_k":"e229bad5"},{"t":"Glucose","why":"It’s filtered, then all reabsorbed.","_n":"2leb4","_k":"99ff88c0"},{"t":"Water","why":"Water is in both.","_n":"2mea4","_k":"82673f4d"},{"t":"Urea","why":"Much of it stays in the urine.","_n":"2ne94","_k":"38510ed6"}]},"b":{"prompt":"Which substance is \u003cstrong>not\u003c/strong> normally filtered at the glomerulus?","options":[{"t":"Urea","why":"Urea is filtered.","_n":"2oe84","_k":"cb5d6f3a"},{"t":"Plasma proteins","why":"They’re too large.","_n":"2pe74","_k":"bae6d34d"},{"t":"Glucose","why":"Glucose is filtered.","_n":"2qe64","_k":"5ba5128e"},{"t":"Na⁺","why":"Ions are filtered.","_n":"2re4b","_k":"d8b2b169"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"What does ADH do in the kidney?","options":[{"t":"Makes the collecting duct less permeable, so more urine is made","why":"ADH (\u003cem>anti\u003c/em>diuretic) makes the collecting duct \u003cstrong>more\u003c/strong> permeable to water: less, more concentrated urine.","_n":"2se3b","_k":"4a7e591b"},{"t":"Increases Na⁺ reabsorption in the distal tubule","why":"That’s aldosterone.","_n":"2te6b","_k":"c2c33879"},{"t":"Increases the rate of filtration","why":"ADH acts on the duct, not the filter.","_n":"2ue5b","_k":"7aea96d7"},{"t":"Makes the collecting duct more permeable to water, so more water is reabsorbed","why":"ADH opens water channels in the collecting duct.","_n":"2ve0b","_k":"1fd23866"}]},"b":{"prompt":"What does aldosterone do in the kidney?","options":[{"t":"Increases Na⁺ reabsorption in the distal tubule and collecting duct, and water follows","why":"Aldosterone moves Na⁺; water follows by osmosis.","_n":"2wdfb","_k":"6e4938c2"},{"t":"Increases glucose reabsorption","why":"Glucose is reabsorbed without hormones.","_n":"2xe2b","_k":"1bc1d6b9"},{"t":"Stops all urine production","why":"It reduces Na⁺ loss, not all urine.","_n":"2ye1b","_k":"d88717df"},{"t":"Opens water channels in the collecting duct","why":"That’s ADH.","_n":"2zecb","_k":"3e30ca9a"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"A person’s blood glucose is 15 mmol/L. Predict their urine and explain.","options":[{"t":"No glucose, because glucose is never filtered","why":"All the glucose in the plasma is filtered; the proximal tubule normally reabsorbs all of it.","_n":"30ebb","_k":"c36efa12"},{"t":"Glucose appears because the glomerulus is damaged","why":"Damage shows as protein.","_n":"31deb","_k":"750acc17"},{"t":"Glucose appears in the urine, because the proximal tubule’s carriers are saturated above about 10 mmol/L","why":"The carriers can’t take back all the extra glucose, so some stays in the filtrate.","_n":"32dfb","_k":"7401c5cc"},{"t":"No glucose, because the collecting duct reabsorbs the extra","why":"The collecting duct doesn’t reabsorb glucose.","_n":"33dcb","_k":"44cba3fb"}]},"b":{"prompt":"A medicine blocks the glucose carriers in the proximal tubule. Blood glucose is a normal 5 mmol/L. Predict the urine.","options":[{"t":"No glucose, because blood glucose is normal","why":"Filtered glucose can’t get back without its carriers.","_n":"34ddb","_k":"eecaec3b"},{"t":"Protein appears instead","why":"They’re too large to pass the glomerulus’s filter, so a healthy nephron never filters them.","_n":"35e2b","_k":"ba6c39a7"},{"t":"Glucose appears in the urine even though blood glucose is normal","why":"All the glucose is still filtered, but none can get back without its carriers.","_n":"36e3b","_k":"1ff86a4a"},{"t":"Less urine is made","why":"Glucose left in the filtrate holds water in: more urine, if anything.","_n":"37e0b","_k":"2c13133b"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Alcohol reduces ADH release. Predict the urine and the blood.","options":[{"t":"Less, concentrated urine; the blood becomes diluted","why":"ADH (\u003cem>anti\u003c/em>diuretic) makes the collecting duct \u003cstrong>more\u003c/strong> permeable to water: less, more concentrated urine.","_n":"38e1b","_k":"45dbddc5"},{"t":"No change, because alcohol acts on the liver","why":"It also lowers ADH release.","_n":"39e6b","_k":"cdcaab1f"},{"t":"More, dilute urine; the blood becomes more concentrated, causing thirst","why":"Less ADH: the collecting duct keeps its water, so the body loses water.","_n":"3ae7b","_k":"92ea424d"},{"t":"More urine, but just as concentrated as before","why":"Less water is reabsorbed, so the urine is diluted.","_n":"3bf8b","_k":"aa4f360b"}]},"b":{"prompt":"A medicine blocks the Na⁺/Cl⁻ pumps in the ascending limb. Predict the urine.","options":[{"t":"More, dilute urine, because the medulla’s salt gradient shrinks and less water leaves the collecting duct","why":"No salty medulla, so water stays in the duct.","_n":"3cf7b","_k":"ccd03516"},{"t":"Less, concentrated urine","why":"Without the gradient, water stays in the duct.","_n":"3df6b","_k":"01027123"},{"t":"Glucose appears in the urine","why":"Glucose is handled in the proximal tubule.","_n":"3ef5b","_k":"d97bc415"},{"t":"No change, because ADH is still present","why":"ADH needs the gradient to work.","_n":"3ff4b","_k":"a1551483"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A kangaroo rat lives in the desert and almost never drinks. Its loops of Henle are much longer than a human’s. Why?","options":[{"t":"Long loops build a steeper salt gradient in the medulla, so very concentrated urine can be made and water saved","why":"Loop length sets how salty the medulla can get, which sets the most concentrated urine possible.","_n":"3gf3b","_k":"2bdb43fe"},{"t":"Long loops secrete more urea","why":"The benefit is the gradient.","_n":"3hf2b","_k":"346114fb"},{"t":"Long loops filter more blood","why":"Filtering happens at the glomerulus.","_n":"3if1b","_k":"836c2b25"},{"t":"Long loops make more urine to cool the animal","why":"That would waste water.","_n":"3jf0b","_k":"438b7ddb"}]},"b":{"prompt":"A beaver lives in fresh water and has short loops of Henle. Why is that enough?","options":[{"t":"Beavers don’t need ADH","why":"They still regulate water; they just rarely need very concentrated urine.","_n":"3kefb","_k":"268fb529"},{"t":"Water is plentiful, so it doesn’t need a steep gradient; it makes larger amounts of dilute urine","why":"A shallow gradient is enough when water is easy to get.","_n":"3l72b","_k":"92791b3b"},{"t":"Short loops make more concentrated urine","why":"Shorter loops make shallower gradients.","_n":"3m73b","_k":"f9da79c0"},{"t":"Short loops filter more efficiently","why":"Loop length sets how salty the medulla can get, which sets the most concentrated urine possible.","_n":"3n74b","_k":"1ed1d9b0"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why healthy urine has no protein?","options":[{"t":"“Proteins are filtered, then reabsorbed in the proximal tubule.”","why":"They’re too large to pass the glomerulus’s filter, so a healthy nephron never filters them.","_n":"3o75b","_k":"7aab0188"},{"t":"“Plasma proteins are too large to pass through the glomerulus’s filter, so they stay in the blood.”","why":"Size decides what passes the filter, and proteins are too large.","_n":"3p6eb","_k":"51ee6333"},{"t":"“The collecting duct pumps protein back.”","why":"It handles water, not protein.","_n":"3q6fb","_k":"f65c550e"},{"t":"“Proteins are broken down into urea before reaching the kidney.”","why":"Some protein breakdown makes urea, but that isn’t why urine lacks protein.","_n":"3r70b","_k":"1c662240"}]},"b":{"prompt":"Which is the best explanation of how urine can be more concentrated than blood?","options":[{"t":"“The glomerulus filters only solutes, not water.”","why":"Water is filtered too.","_n":"3s71b","_k":"d7d65b28"},{"t":"“With ADH, the collecting duct lets water out by osmosis as it passes the salty medulla, leaving the solutes behind.”","why":"Water leaves by osmosis into the salty medulla; the solutes stay in the urine.","_n":"3t6ab","_k":"057ec6a3"},{"t":"“ADH pumps solutes into the duct.”","why":"ADH moves water, not solutes: it makes the collecting duct more permeable to water.","_n":"3u6bb","_k":"d89a2c86"},{"t":"“The kidney adds extra salt to the urine.”","why":"Water is removed; little extra solute is added.","_n":"3v6ca","_k":"99275821"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which flow chart correctly shows the response to dehydration?","options":[{"t":"↑ blood concentration → kidney releases ADH → glomerulus filters less → blood concentration falls","why":"ADH comes from the posterior pituitary.","_n":"3w6ba","_k":"6843cc7d"},{"t":"↑ blood concentration → osmoreceptors (hypothalamus) → posterior pituitary releases ADH → collecting ducts reabsorb more water → blood concentration falls","why":"Dehydration raises ADH, so more water is reabsorbed.","_n":"3x6ea","_k":"8b325b26"},{"t":"↑ blood concentration → osmoreceptors → less ADH → more water reabsorbed → blood concentration falls","why":"Dehydration raises ADH.","_n":"3y6da","_k":"24d3690d"},{"t":"↑ blood concentration → adrenal cortex releases ADH → more urine → blood concentration falls","why":"ADH comes from the posterior pituitary. ADH moves water; aldosterone moves Na⁺, and water follows the Na⁺.","_n":"3z70a","_k":"452b2ad9"}]},"b":{"prompt":"Which flow chart correctly shows the response to low blood pressure?","options":[{"t":"↓ blood pressure → kidney releases renin → angiotensin II → adrenal cortex releases aldosterone → more Na⁺ and water reabsorbed → blood pressure rises","why":"Renin starts the chain; aldosterone keeps Na⁺, and water follows.","_n":"406fa","_k":"36879344"},{"t":"↓ blood pressure → posterior pituitary releases aldosterone → less Na⁺ reabsorbed → blood pressure rises","why":"Aldosterone comes from the adrenal cortex and increases Na⁺ reabsorption. ADH moves water; aldosterone moves Na⁺, and water follows the Na⁺.","_n":"4172a","_k":"602d9071"},{"t":"↓ blood pressure → renin → angiotensin II → more urine → blood pressure rises","why":"More urine would lower volume.","_n":"4271a","_k":"8a29350d"},{"t":"↓ blood pressure → aldosterone → renin → angiotensin II → blood pressure falls","why":"Out of order, and the result is backwards.","_n":"4364a","_k":"6296bc36"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"In hemodialysis, why does the dialysis fluid contain normal levels of glucose and salts but \u003cstrong>no\u003c/strong> urea?","options":[{"t":"Because the fluid has to match normal urine","why":"Dialysis fluid matches normal blood levels of glucose and salts, but has no urea, so only the wastes diffuse out.","_n":"4463a","_k":"ece3c062"},{"t":"To stop urea from moving at all","why":"No urea in the fluid makes urea move out.","_n":"4566a","_k":"d4c71d8a"},{"t":"To add glucose to the patient’s blood","why":"Equal levels mean no net movement.","_n":"4667a","_k":"1ff94ac8"},{"t":"So urea diffuses out of the blood down its gradient while glucose and salts stay","why":"Dialysis fluid matches normal blood levels of glucose and salts, but has no urea, so only the wastes diffuse out.","_n":"4764a","_k":"5e51a49d"}]},"b":{"prompt":"In hemodialysis, why does the fluid flow in the \u003cstrong>opposite\u003c/strong> direction to the blood?","options":[{"t":"It keeps the blood warm","why":"Temperature isn’t the reason.","_n":"4865a","_k":"0849cbbc"},{"t":"It stops proteins from crossing","why":"The membrane’s pore size does that.","_n":"4962a","_k":"dd39d242"},{"t":"It makes the blood flow faster","why":"Flow direction changes the gradient, not the speed.","_n":"4a63a","_k":"3f7cc297"},{"t":"It keeps a concentration gradient along the whole membrane, so more urea diffuses out","why":"Fresh fluid meets the blood all along the membrane, so urea keeps diffusing out.","_n":"4b60a","_k":"38610020"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Four urinalysis results, given as volume (L/day), glucose, protein and concentration (mOsm/L):\u003cbr>P: 1.6, none, none, 380\u003cbr>Q: 1.5, none, present, 400\u003cbr>R: 7.5, none, none, 90\u003cbr>S: 2.8, present, none, 520\u003cbr>Which sample most suggests a \u003cstrong>damaged glomerulus\u003c/strong>?","options":[{"t":"Q","why":"Protein in urine means the filter lets large molecules through.","_n":"4c61a","_k":"66f3dee4"},{"t":"R","why":"Very dilute urine suggests low ADH.","_n":"4d6ea","_k":"e1b0c418"},{"t":"S","why":"Glucose suggests blood glucose above the threshold.","_n":"4e6fa","_k":"99b7632a"},{"t":"P","why":"This is a typical result.","_n":"4f60a","_k":"877e7e2f"}]},"b":{"prompt":"Four urinalysis results, given as volume (L/day), glucose, protein and concentration (mOsm/L):\u003cbr>P: 1.6, none, none, 380\u003cbr>Q: 1.5, none, present, 400\u003cbr>R: 7.5, none, none, 90\u003cbr>S: 2.8, present, none, 520\u003cbr>Using the same four results, which sample most suggests \u003cstrong>little or no ADH\u003c/strong>?","options":[{"t":"S","why":"Glucose suggests diabetes mellitus.","_n":"4g5fa","_k":"baa76909"},{"t":"Q","why":"Protein suggests filter damage.","_n":"4h5ea","_k":"e3a06ff5"},{"t":"R","why":"Large volume and very dilute.","_n":"4i5da","_k":"abc282e6"},{"t":"P","why":"Typical.","_n":"4j64a","_k":"2341e83f"}]}}]},"task":{"title":"Water-saving kidney","summary":"Water-saving kidney","statement":"\u003cp>Set the model kidney so its urine fits a water-saving profile while still clearing wastes. There’s more than one setting that works. Can you find them all?\u003c/p>","checks":["Concentrated enough: urine concentration is at least 1000 mOsm/L","Enough volume: urine volume is at least 0.5 L/day (enough to carry away wastes)","No glucose in the urine","No protein in the urine"],"tips":["Raise ADH, or use a longer loop for a steeper gradient.","Too concentrated: the volume is below 0.5 L. Ease off one setting.","Blood glucose is above the 10 mmol/L threshold.","A leaky filter lets protein through."],"inputs":[{"id":"loop","label":"Loop of Henle","options":[["short","Short"],["medium","Medium (human)"],["long","Long"]]},{"id":"adh","label":"ADH","options":[["none","None"],["moderate","Moderate"],["high","High"]]},{"id":"bg","label":"Blood glucose (mmol/L)","options":[["5","5"],["8","8"],["12","12"]]},{"id":"glom","label":"Glomerulus","options":[["intact","Intact"],["leaky","Leaky"]]}],"model":"\u003cstrong>Model:\u003c/strong> urine concentration \u003cem>U\u003c/em> = 100 mOsm/L with no ADH, one third of the medulla’s maximum with moderate ADH, and the maximum with high ADH (short 600, medium 1200, long 3000 mOsm/L). Urine volume \u003cem>V\u003c/em> = 600 ÷ \u003cem>U\u003c/em> L/day.","afterAll":"A steep gradient with a partly open duct, or a human gradient with a fully open duct: two routes to the same result.","explainPrompt":"Explain why both the loop length and ADH matter, using your working settings.","vocab":"Use the words loop of Henle, gradient, collecting duct, ADH and osmosis.","more":"There’s more than one answer. Can you find another?"},"cards":[["Nephron","The kidney’s working unit: filters blood and makes urine (about a million per kidney)."],["Filtration","Blood pressure pushes water and small solutes from the glomerulus into Bowman’s capsule."],["Reabsorption","Useful substances return from the tubule to the blood (all glucose; most water and Na⁺)."],["Secretion","Extra wastes, H⁺ and K⁺ move from the blood into the tubule."],["Loop of Henle","Builds a salt gradient in the medulla; longer loops build steeper gradients."],["ADH","From the posterior pituitary; opens water channels in the collecting duct: less, concentrated urine."],["Aldosterone","From the adrenal cortex; more Na⁺ reabsorbed (K⁺ secreted); water follows."],["Renin–angiotensin","Low blood pressure → renin → angiotensin II → cons
