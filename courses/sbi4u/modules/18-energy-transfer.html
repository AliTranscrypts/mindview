.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 18: hero Sankey, Energy flow meter (S3 flow bands, ATP pool gauge, ATP–ADP loop, ΔG bars), Part 3 stations, practice, task.
   Roles (course plan §3 + plan build notes): glucose and lactate --bio-carbon (lactate as an outline); ATP --bio-atp (ADP and Pᵢ
   in --ink-2); heat --ink-2 wavy lines (70% opacity); O₂ --bio-o2 (task bar only). The ΔG reaction bar is an --ink outline and the
   coupled bar solid --ink. Percentages and kJ are always written next to the bands, never colour alone. */

/* hero */
.et-heq{display:inline}
.et-heq2{display:block;margin-top:.35em;font-size:.6em;line-height:1.35;color:var(--ink-2)}
.et-c-atp{color:var(--bio-atp);font-weight:700}
.et-hero{max-width:470px;margin:0 auto}
.et-hsvg{display:block;width:100%;height:auto}
.et-gts{font-size:13px}

/* radio groups (from SBI4U 14 / 10 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button small{font-weight:400}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips.et-pathc{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;width:100%}
.rg.chips.et-pathc button,.rg.chips.et-cardc button{border-radius:8px;text-align:left;line-height:1.3}
.rg.chips.et-pathc button{display:flex;flex-direction:column;align-items:flex-start;padding:.3em .8em}
.et-pathc small{font-size:.8rem;color:var(--ink-2);font-weight:400}
.et-pathc button[aria-checked="true"] small{color:var(--hi-ink)}
.rg.chips.et-cardc{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;width:100%}
.et-dg{white-space:nowrap}

/* stepper and slider */
.et-stp{display:inline-flex;align-items:center;gap:6px}
.et-stb{min-width:40px;min-height:40px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:1.15rem;font-weight:700;line-height:1}
.et-stb:disabled{opacity:.4;cursor:default}
.et-stp output{min-width:2ch;padding:0 .4em;text-align:center;font-weight:700}
.et-sl{margin:0}
.et-sl input{width:100%;accent-color:var(--ink)}
.et-sl output{font:700 1.05rem var(--font-ui)}

/* explore layout */
.et-pg [hidden]{display:none!important}
@media (min-width:821px){ .pg.et-pg{grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)} }
.et-pg .pg-ctrl{display:grid;gap:12px}
.et-panel{display:grid;gap:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.et-runrow{margin:0}
.et-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.et-note{margin:10px 0 0}

/* flow bands (S3 ledger, Sankey form) */
.et-flowbox svg{display:block;width:100%;height:auto}
.et-flow.vert{max-width:420px;margin:0 auto}
.et-flow text,.et-hsvg text,.et-gauge text,.et-loop text{font-family:var(--font-ui)}
.et-glu{fill:var(--bio-carbon)}
.et-gt{font-weight:700;font-size:14px;fill:var(--sheet)}
.et-rib-heat{fill:var(--ink-2);fill-opacity:.16;stroke:var(--ink-2);stroke-width:1.2}
.et-rib-wave{stroke:none}
.et-wvp{fill:none;stroke:var(--ink-2);stroke-width:1.3;opacity:.8}
.et-rib-atp{fill:var(--bio-atp);fill-opacity:.88}
.et-rib-left{fill:var(--bio-carbon);fill-opacity:.13;stroke:var(--bio-carbon);stroke-width:2}
.et-rib-hi{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-dasharray:7 4}
.et-hw{fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.et-fl{font-size:13px;font-weight:600;fill:var(--ink)}
.et-lb{font-weight:700}
.et-lb.on{font-size:14.5px}
.et-tok{fill:var(--bio-atp);stroke:var(--sheet);stroke-width:1.2}
.et-adp{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.6}
.et-pi{fill:var(--ink-2)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .et-wvp,:root:not([data-theme="light"]) .et-hw{opacity:.7} }
:root[data-theme="dark"] .et-wvp,:root[data-theme="dark"] .et-hw{opacity:.7}

/* ATP–ADP cycle: gauge + loop */
.et-cyc{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:10px;align-items:center}
.et-cyc svg{display:block;width:100%;height:auto}
@media (max-width:560px){ .et-cyc{grid-template-columns:minmax(0,1fr)} .et-gauge{max-width:300px;margin:0 auto} }
.et-ctr{display:flex;flex-wrap:wrap;gap:4px 18px;margin:6px 0 0;font-size:.92rem;color:var(--ink-2)}
.et-ctr b{color:var(--ink);font-variant-numeric:tabular-nums}
.et-gtr{fill:none;stroke:var(--paper);stroke-width:16}
.et-gfill{fill:none;stroke:var(--bio-atp);stroke-width:16}
.et-gtk{stroke:var(--ink-2);stroke-width:2}
.et-gtl{font-size:11px;fill:var(--ink-2)}
.et-gnd{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}
.et-gpv{fill:var(--ink)}
.et-gcap{font-size:12.5px;font-weight:700;fill:var(--ink-2)}
.et-gval{font-size:13px;font-weight:700;fill:var(--ink)}
.et-lpw{fill:none;stroke:var(--ink)}
.et-lpr{fill:none;stroke:var(--bio-carbon)}
.et-lph{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.et-lph.et-lphb{stroke:var(--bio-carbon)}
.et-mus{fill:var(--paper);stroke:var(--ink-2);stroke-width:2}
.et-musl{stroke:var(--ink-2);stroke-width:1.4}
.et-lt{font-size:12px;font-weight:600;fill:var(--ink-2)}
.et-lv{font-size:13px;font-weight:700;fill:var(--ink)}
.et-natp{fill:var(--bio-atp)}
.et-nt{font-size:14px;font-weight:700;fill:var(--sheet)}
.et-nadp{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.et-nt2{font-size:12.5px;font-weight:700;fill:var(--ink-2)}
.et-cyp{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.et-cyd{stroke-dasharray:6 5}
.et-cyh{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.et-lin{stroke:var(--bio-carbon);stroke-width:3;stroke-linecap:round}
.et-lin.off{opacity:.35;stroke-dasharray:3 4}
.et-lg{font-size:12px;font-weight:600;fill:var(--bio-carbon)}

/* coupling: ΔG bars (from SBI4U 10) */
.et-couple{display:grid;gap:10px}
.et-cc{margin:0;font-weight:700}
.et-bars{display:grid;gap:6px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.et-brow{display:grid;grid-template-columns:96px minmax(0,1fr) 58px;align-items:center;gap:8px;font-size:.88rem}
.et-bl{font-weight:700}
.et-bt{position:relative;height:18px;background:var(--paper);border-radius:3px}
.et-bz{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.et-bf{position:absolute;top:2px;bottom:2px;border-radius:2px}
.et-bpen{background:var(--sheet);box-shadow:inset 0 0 0 2px var(--ink)}
.et-batp{background:var(--bio-atp)}
.et-bnet{background:var(--ink)}
.et-bv{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.et-bsc{margin:0}
.et-verdict{margin:0;font-size:1.05rem;font-weight:700;padding:8px 12px;border-radius:8px;border:1.5px solid var(--rule)}
.et-verdict.go{border-color:var(--ink)}

/* Part 3 */
.et-p3{display:grid;gap:18px}
.et-st{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px}
.et-st h3{margin-top:0}
.et-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){ .et-row{grid-template-columns:84px minmax(0,1fr);gap:10px} }
.et-person svg{display:block;width:100%;height:auto}
.et-pp,.et-pl{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.et-pt{font-size:12px;font-weight:700;fill:var(--ink-2);font-family:var(--font-ui)}
.et-side > p:first-child{margin-top:0}
.et-chips{margin:8px 0}
.et-chips .chip{text-align:left;line-height:1.3;border-radius:14px}
.et-data{margin-top:6px}
.et-pyr{display:grid;gap:4px;margin:10px 0 6px}
.et-lvl{display:flex;justify-content:center}
.et-lvb{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 10px;min-height:46px;padding:6px 10px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--paper);min-width:min(100%,260px);box-sizing:border-box}
.et-lvl.done .et-lvb{background:var(--sheet);border-color:var(--ink)}
.et-lvl.cur .et-lvb{border:2px solid var(--ink);background:var(--hi-soft)}
.et-lvn{font-weight:700}
.et-lvv{font-weight:700;font-variant-numeric:tabular-nums}
.et-lvq{color:var(--ink-2);font-weight:700}
.et-lvin{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.et-lvin .numin{width:6.5rem}
.et-lva{text-align:center;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.et-lvh{font-weight:400;white-space:nowrap}
.et-lvh svg{width:28px;height:12px;vertical-align:middle;margin:0 2px 0 8px}
.et-pyr .fb{margin:2px 0}
.et-pyrn{margin:0 0 10px}
.et-qq{margin:12px 0 4px}
.et-effg{display:grid;gap:10px;margin:6px 0}
.et-er{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) minmax(0,11rem);gap:6px 12px;align-items:center}
.et-el{font-weight:700;font-size:.92rem}
.et-et{position:relative;height:18px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.et-ef{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.et-efr{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 6px)}
.et-ev{font-size:.92rem}
.et-escale{margin:0}
@media (max-width:640px){ .et-er{grid-template-columns:minmax(0,1fr) auto} .et-et{grid-column:1 / -1;order:3} }

/* practice */
.et-unit{margin-left:2px;color:var(--ink-2);font-weight:700}

/* task */
.et-conds{margin:8px 0 0;padding-left:1.4em}
.et-conds li{margin:2px 0}
.et-tin{display:grid;gap:12px;margin:12px 0}
.et-tpv h4{margin:0 0 8px}
.et-tbars{display:grid;gap:8px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.et-grow{display:grid;grid-template-columns:86px minmax(0,1fr) 36px;grid-template-areas:"l t v" ". m .";gap:2px 8px;align-items:center;font-size:.88rem}
.et-gl{grid-area:l;font-weight:700}
.et-gt2{grid-area:t;position:relative;display:flex;height:16px;background:var(--paper);border-radius:3px}
.et-gt2 i{display:block;height:100%}
.et-gt2 i:first-child{border-radius:3px 0 0 3px}
.et-gm{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink)}
.et-gv{grid-area:v;text-align:right;font-variant-numeric:tabular-nums}
.et-gml{grid-area:m;font-size:.78rem;color:var(--ink-2)}
.et-ga1,.et-sw.et-ga1{background:var(--bio-atp)}
.et-ga2,.et-sw.et-ga2{background:repeating-linear-gradient(45deg,var(--bio-atp) 0 3px,var(--sheet) 3px 5px);box-shadow:inset 0 0 0 1px var(--bio-atp)}
.et-gg1{background:var(--bio-carbon)}
.et-gg2{background:repeating-linear-gradient(45deg,var(--bio-carbon) 0 3px,var(--sheet) 3px 5px);box-shadow:inset 0 0 0 1px var(--bio-carbon)}
.et-go{background:var(--bio-o2)}
.et-glg{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;color:var(--ink-2)}
.et-glg > span{white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.et-sw{display:inline-block;width:12px;height:12px;border-radius:2px}
.et-tread{margin-top:10px}

</style>
</head>

":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"77c897fb","content":{"id":"18-energy-transfer","kind":"topic","title":"Energy transfer","topic":"Energy Transfer","readyTopic":"energy transfer","hero":{"eq":"\u003cspan class=\"et-heq\">\u003cspan class=\"bio-chem\">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O\u003c/span>\u003cspan class=\"et-heq2\">\u003cspan class=\"bio-chem\">ΔG ≈ −2870 kJ/mol,\u003c/span> \u003cspan class=\"bio-chem\">which becomes ≈ 1098 kJ in \u003cspan class=\"et-c-atp\">36 ATP\u003c/span>\u003c/span> \u003cspan class=\"bio-chem\">+ ≈ 1772 kJ heat\u003c/span>\u003c/span>\u003c/span>","eqLabel":"C₆H₁₂O₆ plus 6 O₂ gives 6 CO₂ plus 6 H₂O, ΔG about −2870 kJ/mol, which becomes about 1098 kJ in 36 ATP plus about 1772 kJ of heat","eqSize":"sm","headline":"Where does a mole of glucose’s energy go?","text":"Energy can’t be created or destroyed. It can only change form (the \u003cstrong>first law\u003c/strong>). But every change lets some energy escape as \u003cstrong>heat\u003c/strong> (the \u003cstrong>second law\u003c/strong>). So when a cell oxidizes glucose, part of the energy is captured in \u003cstrong>ATP\u003c/strong>, and the rest warms you up. ATP isn’t a store: it’s spent and remade constantly in the \u003cstrong>ATP–ADP cycle\u003c/strong>.","fig":{"html":"\u003cdiv class=\"et-hero\" id=\"et-hero\" role=\"img\" aria-label=\"A brown glucose block labelled 2870 kJ. A flow band splits it in two: an orange stream flows into a stack of 36 ATP tokens labelled 1098 kJ, and a grey wavy stream labelled heat, 1772 kJ, rises off the top. The ATP tokens power a muscle, turning into ADP and Pᵢ, and are recharged from the glucose stream: the ATP–ADP cycle.\">\u003c/div>"}},"goals":["I can use the first and second laws of thermodynamics to explain where glucose’s energy goes in a cell.","I can calculate the energy captured in ATP, the heat released and the efficiency for a given ATP yield.","I can explain the ATP–ADP cycle and how ATP hydrolysis drives an uphill reaction (coupling).","I can compare aerobic respiration and fermentation, including where the unreleased energy stays.","I can connect cellular energy transfer to body heat and to energy flow in ecosystems."],"start":{"warmup":{"questions":[{"id":"w1","skill":"ΔG and ATP","goal":3,"prompt":"ATP → ADP + Pᵢ has ΔG ≈ −30.5 kJ/mol. What does the negative sign mean?","options":[{"t":"Energy must be added","why":"That would be a positive ΔG.","_n":"063e","_k":"6a378a86"},{"t":"The reaction can’t happen","why":"Negative ΔG means it can.","_n":"164e","_k":"cff43928"},{"t":"The reaction is very slow","why":"ΔG says nothing about speed; enzymes affect speed.","_n":"265e","_k":"3a27340a"},{"t":"Energy is released, so the reaction can happen on its own","why":"Exergonic.","_n":"35ee","_k":"1ad99e89"}],"hints":["ΔG &lt; 0 is exergonic.","Exergonic reactions release energy.","Energy is released, so the reaction can happen on its own."]},{"id":"w2","skill":"ΔG and ATP","goal":3,"prompt":"Making ATP from ADP + Pᵢ has ΔG of about…","options":[{"t":"−30.5 kJ/mol","why":"That’s hydrolysis.","_n":"45fe","_k":"ca99d052"},{"t":"+30.5 kJ/mol","why":"The reverse reaction has the opposite sign.","_n":"560e","_k":"d7bf15cb"},{"t":"0 kJ/mol","why":"It needs energy.","_n":"661e","_k":"012015f2"},{"t":"+2870 kJ/mol","why":"That’s the reverse of glucose oxidation.","_n":"76ae","_k":"f3fc0ffb"}],"hints":["Reverse a reaction and the sign of ΔG flips.","Hydrolysis is −30.5.","+30.5."]},{"id":"w3","skill":"ATP yield","goal":2,"prompt":"The theoretical ATP yield per glucose in a eukaryotic cell (3 per NADH, 2 per FADH₂, glycerol-phosphate shuttle) is…","options":[{"t":"2","why":"That’s fermentation.","_n":"86be","_k":"9c501f0b"},{"t":"4","why":"That’s only the substrate-level ATP.","_n":"98ea","_k":"9c541863"},{"t":"36","why":"Module 19 builds this count.","_n":"a8da","_k":"8048af81"},{"t":"38","why":"That’s prokaryotes (or the malate–aspartate shuttle).","_n":"b8ca","_k":"38d8d98a"}],"hints":["Eukaryote, theoretical values.","Prokaryotes get 38.","36."]},{"id":"w4","skill":"ATP yield","goal":4,"prompt":"How many ATP does fermentation make per glucose?","options":[{"t":"0","why":"Glycolysis still runs.","_n":"c8ba","_k":"f16bfd32"},{"t":"2","why":"Only glycolysis’s net ATP.","_n":"d8aa","_k":"3389dbf9"},{"t":"4","why":"That’s the gross ATP: 2 were invested.","_n":"e89a","_k":"0e8c3f03"},{"t":"36","why":"That’s aerobic respiration.","_n":"f88a","_k":"c9cc9395"}],"hints":["Which stage still runs without O₂?","Glycolysis.","2."]},{"id":"w5","skill":"Energy forms","goal":1,"prompt":"A muscle contracts using ATP. Which energy change is happening?","options":[{"t":"Chemical → nothing; it’s used up","why":"Energy changes form.","_n":"g87a","_k":"59ae4b7f"},{"t":"Chemical energy → mechanical energy (and heat)","why":"Some always becomes heat.","_n":"h86a","_k":"7813bd92"},{"t":"Heat → chemical","why":"Cells can’t run on heat.","_n":"i85a","_k":"2ef24763"},{"t":"Mechanical → chemical","why":"That’s backwards.","_n":"jf4b","_k":"911df236"}],"hints":["What does ATP hold?","Chemical energy.","It becomes motion plus heat."]},{"id":"w6","skill":"Energy forms","goal":5,"prompt":"Why do you get warm when you exercise?","options":[{"t":"Faster respiration and muscle work release more energy as heat","why":"Second law in action.","_n":"kf5b","_k":"1ededb25"},{"t":"ATP is a heat store","why":"ATP holds chemical energy.","_n":"lf2b","_k":"9bbb89de"},{"t":"Exercise creates new energy","why":"Energy isn’t created.","_n":"mf3b","_k":"8af753e2"},{"t":"Sweat produces heat","why":"Sweat removes heat.","_n":"nf8b","_k":"0c37d086"}],"hints":["More work means more conversions.","Each conversion loses some energy as heat.","Faster respiration and muscle work release more energy as heat."]}],"refreshers":{"ΔG and ATP":"Negative ΔG: energy released. ATP hydrolysis ≈ −30.5 kJ/mol; making ATP ≈ +30.5 kJ/mol.","ATP yield":"Theoretical 38 (prokaryote) or 36 (eukaryote); current estimate ≈ 30–32; fermentation 2.","Energy forms":"Cells convert chemical energy into mechanical, electrical and chemical work, and always some heat."}}},"explore":{"heading":"Energy flow m&#101;ter","intro":"Choose how glucose is used and watch where its energy goes. Then run the ATP–ADP cycle and use ATP to push an uphill reaction.","paths":[{"id":"38","t":"Aerobic, 38 ATP","sub":"prokaryote, theoretical","atp":38},{"id":"36","t":"Aerobic, 36 ATP","sub":"eukaryote, theoretical","atp":36},{"id":"32","t":"Aerobic, 32 ATP","sub":"current estimate","atp":32},{"id":"30","t":"Aerobic, 30 ATP","sub":"current estimate, glycerol-phosphate shuttle","atp":30},{"id":"ferm","t":"Fermentation to lactate","sub":"2 ATP","atp":2,"ferm":true}],"acts":[{"id":"rest","t":"Rest","demand":50},{"id":"walk","t":"Walk","demand":90},{"id":"sprint","t":"Sprint","demand":150}],"rxCards":[{"id":"A","t":"join two amino acids","dg":20},{"id":"B","t":"make glutamine","dg":14},{"id":"C","t":"build a phosphate bond","dg":45}],"modelNote":"Course values: ATP → ADP + Pᵢ, ΔG ≈ −30.5 kJ/mol; glucose oxidation, ΔG ≈ −2870 kJ/mol; glucose → 2 lactate releases ≈ 200 kJ/mol (model value). The cycle mode uses whole ATP-units per second; the pool’s size is a model value.","predictions":[{"id":"p1","prompt":"About what fraction of glucose’s energy ends up in ATP?","options":[{"t":"100%","_n":"of9b","_k":"7c754c2a"},{"t":"About 10%","_n":"pf6b","_k":"d3a6feee"},{"t":"About 90%","_n":"qf7b","_k":"fdee955a"},{"t":"About 40%","_n":"rfcb","_k":"20ef581a"}],"explain":"1098 of 2870 kJ (≈ 38%). Respiration is impressively efficient, but well under 100%.","start":{"mode":"where","path":"36"},"act":"atp"},{"id":"p2","prompt":"Where does the rest go?","options":[{"t":"It’s released as heat","_n":"sfdb","_k":"582dc6e4"},{"t":"It’s destroyed","_n":"tfab","_k":"ffecb871"},{"t":"It’s stored in CO₂","_n":"uf9b","_k":"9f0d7188"},{"t":"It becomes matter","_n":"vfcb","_k":"b65ee451"}],"explain":"First law: it isn’t destroyed. Second law: conversions release heat. CO₂ and water are low-energy products.","start":{"mode":"where","path":"36"},"act":"heat"},{"id":"p3","prompt":"Switch to fermentation. Where is most of glucose’s energy now?","options":[{"t":"Destroyed","_n":"wfbb","_k":"5ad3b355"},{"t":"Released as heat","_n":"xf6b","_k":"d6354336"},{"t":"Still in the lactate","_n":"yf5b","_k":"c2b1487b"},{"t":"Captured in ATP","_n":"zf8b","_k":"98aab162"}],"explain":"Fermentation only goes as far as glycolysis. The lactate can be oxidized later, by the liver or heart.","start":{"mode":"where","path":"36"},"act":"ferm"},{"id":"p4","prompt":"Rest (demand 50), aerobic supply 50. Your body holds only a small amount of ATP. What happens to the pool over a minute?","options":[{"t":"It stays about the same, because ATP is remade as fast as it’s spent","_n":"10f7b","_k":"3693f0c3"},{"t":"It’s replaced by glucose","_n":"1102b","_k":"e25509b2"},{"t":"It keeps growing as a store","_n":"1201b","_k":"c9ff525a"},{"t":"It runs out quickly","_n":"13f0a","_k":"f4681539"}] ell","intro":"The two laws that govern a mitochondrion also govern a body and a food chain. Zoom out through three stations, each a short reading of data.","st1":{"title":"Station 1: body heat","text":"At rest, an adult releases roughly 100 J every second as heat (about 100 W, \u003cstrong>approximate\u003c/strong>). Where does it come from?","chips":[{"t":"the ≈ 60% of food energy not captured in ATP, plus the energy of every ATP that’s spent","fb":"Second law: every conversion releases heat, and the energy of spent ATP ends up as heat too.","_n":"14f1a","_k":"56e05ec4"},{"t":"the Sun","fb":"Sunlight can warm your skin, but the steady 100 W comes from your own cells.","_n":"15f2a","_k":"350c450d"},{"t":"friction only","fb":"Friction is a tiny part. Most body heat comes from respiration and ATP use.","_n":"16f3a","_k":"3a075c77"}],"link":"Module 35 shows how the body controls this heat."},"st2":{"title":"Station 2: the trophic pyramid","how":"Use “about 10% passes on” to fill in each level, starting above the plants. Type the energy, then press Check.","levels":[{"id":"l0","t":"Plants","kj":20000},{"id":"l1","t":"Herbivores","_a":"BQdTCA=="},{"id":"l2","t":"Carnivores","_a":"BQdT"},{"id":"l3","t":"Top carnivores","_a":"BQc="}],"wrongMore":"That keeps 90%. Only about 10% passes on: divide by 10.","wrongOther":"About 10% passes on: divide the level below by 10.","text":"At each level, most energy is used for life’s work and lost as heat, or never eaten. That’s why food chains rarely have more than 4–5 links. The 10% figure is an approximate average; real values vary (roughly 5–20%).","question":"Why can’t energy cycle back to the plants?","chips":[{"t":"Heat can’t be used by plants to make food; only sunlight can.","fb":"Energy flows through the chain once and leaves as heat.","_n":"17f4a","_k":"a83c5a3e"},{"t":"The top carnivores keep all the energy.","fb":"They lose most of theirs as heat too.","_n":"18f5a","_k":"95009e8f"},{"t":"The energy is destroyed at the top of the chain.","fb":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"19f6a","_k":"de880fcd"}]},"st3":{"title":"Station 3: engines vs cells","rows":[{"t":"Cell respiration (theoretical)","v":"≈ 38%","lo":38,"hi":38},{"t":"Cell respiration (current estimate)","v":"≈ 34%","lo":34,"hi":34},{"t":"Typical car engine","v":"about 25–30% (\u003cstrong>approximate\u003c/strong>)","lo":25,"hi":30}],"question":"Both obey the second law. What does that mean for both?","chips":[{"t":"Some energy is always released as heat.","fb":"No conversion is 100% efficient, in a cell or in an engine.","_n":"1af7a","_k":"4b37e83b"},{"t":"Both could reach 100% with a better design.","fb":"The second law rules that out: some energy always leaves as heat.","_n":"1bf8a","_k":"9c0e18b8"},{"t":"Both destroy the energy they don’t use.","fb":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"1cf9a","_k":"9980b264"}]},"quickCheck":{"title":"Quick check","summary":"Energy beyond the cell quick check","items":[{"id":"q1","goal":5,"prompt":"Plants capture 50 000 kJ. Roughly how much reaches the next level (herbivores)?","choices":[{"t":"50 000 kJ","fb":"About 10% passes on.","_n":"1df6a","_k":"80a1d750"},{"t":"45 000 kJ","fb":"About 10% passes on.","_n":"1ef5a","_k":"b7a3e57a"},{"t":"500 kJ","fb":"About 10% passes on.","_n":"1ff4a","_k":"604e6a70"},{"t":"5000 kJ","fb":"About 10% of 50 000 kJ.","_n":"1gf3a","_k":"c803f3a9"}]},{"id":"q2","goal":5,"prompt":"Which cycles in an ecosystem?","choices":[{"t":"Matter","fb":"Atoms are reused; energy isn’t.","_n":"1hfaa","_k":"ef64cf18"},{"t":"Neither","fb":"Energy flows through and leaves as heat.","_n":"1if9a","_k":"1321f212"},{"t":"Energy","fb":"Energy flows through and leaves as heat.","_n":"1jf8a","_k":"6c1ff3d0"},{"t":"Both","fb":"Energy flows through and leaves as heat.","_n":"1kf7a","_k":"d0abba66"}]},{"id":"q3","goal":5,"prompt":"Where does most of your body heat come from?","choices":[{"t":"Energy not captured by respiration, and energy released when ATP is used","fb":"Second law: conversions release heat.","_n":"1lfea","_k":"f50b1028"},{"t":"Your clothes","fb":"Second law: conversions release heat.","_n":"1mfda","_k":"a4575c7f"},{"t":"The air","fb":"Second law: conversions release heat.","_n":"1n7ca","_k":"bd22f72c"},{"t":"Water","fb":"Second law: conversions release heat.","_n":"1o7da","_k":"614f3146"}]},{"id":"q4","goal":5,"prompt":"Why are food chains short?","choices":[{"t":"Predators are rare by choice","fb":"Only about 10% passes each step.","_n":"1p7aa","_k":"5d130b64"},{"t":"Matter runs out","fb":"Only about 10% passes each step.","_n":"1q7ba","_k":"58e02212"},{"t":"Energy is lost at each level","fb":"Only about 10% passes each step.","_n":"1r78a","_k":"1176daa8"},{"t":"Plants stop growing","fb":"Only about 10% passes each step.","_n":"1s79a","_k":"869b1423"}]}]}},"practice":{"activities":[{"id":"law","type":"sorter","title":"Which law?","summary":"Which law?","goal":1,"noun":"statement","txt":true,"instruction":"Sort each statement by the law it shows. A false statement goes in Neither.","boxes":[{"id":"b1","label":"First law","sub":"energy is conserved"},{"id":"b2","label":"Second law","sub":"some energy becomes heat; disorder increases"},{"id":"b3","label":"Neither","sub":"a false statement"}],"items":[{"id":"i1","t":"The energy in glucose ends up as ATP energy plus heat, with the same total.","_a":"FVVSGg==","why":"The total stays the same: energy is conserved."},{"id":"i2","t":"No energy conversion in a cell is 100% efficient.","_a":"FVVRGg==","why":"Every conversion releases some energy as heat."},{"id":"i3","t":"A cell creates energy when it makes ATP.","_a":"FVVQGg==","why":"False: ATP’s energy comes from glucose.","wrong":{"b1":"The cell converts energy; it doesn’t create it."}},{"id":"i4","t":"A hawk gets far less energy from a field than the plants captured.","_a":"FVVRGg==","why":"Each level loses most of its energy as heat.","hints":["Is energy disappearing, or being lost as heat?","Each level releases heat.","Second law."]},{"id":"i5","t":"Light energy becomes chemical energy in photosynthesis, with none appearing from nothing.","_a":"FVVSGg==","why":"Energy changes form; none is created."},{"id":"i6","t":"Energy is used up when muscles contract.","_a":"FVVQGg==","why":"False: the energy becomes motion and heat.","wrong":{"b1":"‘Used up’ breaks the first law; the energy changes form."}},{"id":"i7","t":"Your body releases heat even when you’re sitting still.","_a":"FVVRGg==","why":"Every conversion, even at rest, releases heat."},{"id":"i8","t":"The heat a mitochondrion releases can be used to make more glucose.","_a":"FVVQGg==","why":"False: cells can’t turn heat back into food energy.","wrong":{"b2":"Heat can’t power photosynthesis or respiration."}}],"wrongDefault":"Ask: is the total conserved, is some energy lost as heat, or is the statement false?"},{"id":"arith","type":"custom","title":"Energy arithmetic","summary":"Energy arithmetic","star":true,"goal":[2,3,4],"instruction":"Six calculations. Items 3–6 are non-routine (★); the last two go beyond the Final Check.","use":"30.5 kJ/mol per ATP; 2870 kJ/mol per glucose.","items":[{"id":"e1","kind":"num","goal":2,"prompt":"Energy captured in 38 ATP?","_a":"BgZWAQ==","unit":"kJ","display":"1159 kJ","why":"38 × 30.5 = 1159 kJ.","wrong":[{"match":1140,"fb":"38 × 30 = 1140; add 38 × 0.5 = 19."}],"general":"Multiply the number of ATP by 30.5 kJ."},{"id":"e2","kind":"num","goal":2,"prompt":"Heat released when 38 ATP are made from one glucose?","_a":"BgBSCQ==","unit":"kJ","display":"1711 kJ","why":"2870 − 1159 = 1711 kJ.","wrong":[{"match":1159,"fb":"That’s the captured part."}],"general":"Heat is what isn’t captured: 2870 kJ minus the energy in the ATP."},{"id":"e3","kind":"dg","goal":3,"star":true,"prompt":"Coupled ΔG: a reaction of +12 kJ/mol driven by one ATP?","_a":"GgZbFgw=","unit":"kJ/mol","display":"−18.5 kJ/mol","why":"+12 + (−30.5) = −18.5 kJ/mol: negative, so it runs.","wrong":[{"match":42.5,"fb":"ATP adds −30.5."},{"match":18.5,"fb":"A sign slip: +12 − 30.5 = −18.5."}],"general":"Add the reaction’s ΔG and ATP’s −30.5."},{"id":"e4","kind":"num","goal":4,"star":true,"prompt":"(Investigation) A student compares two yeast cultures. One ferments and one respires aerobically, each using 1 mole of glucose. How many times more ATP does the aerobic culture make (use 36)?","_a":"Bg8=","unit":"times","display":"18 times","why":"36 ÷ 2 = 18.","wrong":[{"match":34,"fb":"That’s the difference, not the ratio: 36 ÷ 2."}],"general":"Compare by dividing: aerobic ATP ÷ fermentation ATP."},{"id":"e5","kind":"num","goal":4,"star":true,"prompt":"Fermentation releases ≈ 200 kJ per mole of glucose and captures 2 ATP. What percent of the \u003cstrong>released\u003c/strong> energy is captured?","_a":"BAdNDQ==","unit":"%","display":"30.5%","why":"61 ÷ 200 = 0.305: 30.5%.","wrong":[{"match":2,"fb":"That’s percent of glucose’s total. Here, divide by 200."},{"match":2.1,"fb":"That’s percent of glucose’s total. Here, divide by 200."}],"general":"Captured ÷ released × 100.","hints":["Captured = 2 × 30.5.","61 of 200.","61 ÷ 200 = 0.305: 30.5%."]},{"id":"e6","kind":"ratio","goal":4,"star":true,"prompt":"A sprinter needs 150 ATP-units per second; aerobic respiration supplies at most 120. How many moles of glucose per second must fermentation use, compared with aerobic respiration (36 ATP each), to supply the gap? Give the ratio fermentation glucose : aerobic glucose.","_a":"AxlW","tol":0.06,"label":"Fermentation : aerobic","display":"15 : 3⅓ (that is, 4.5 : 1)","why":"30 ÷ 2 = 15 for fermentation; 120 ÷ 36 = 3⅓ for aerobic.","wrong":[{"match":0.2222,"fb":"That’s aerobic : fermentation. Put fermentation first."}],"general":"30 ÷ 2 = 15 for fermentation; 120 ÷ 36 = 3⅓ for aerobic.","hints":["The gap is 150 − 120 = 30 ATP-units.","Fermentation: 2 per glucose; aerobic: 36 per glucose.","15 vs 3⅓, so 4.5 times as much glucose ","why":"That’s the second law.","_n":"257aa","_k":"db9115c7"},{"t":"Heat can power photosynthesis","why":"Matter cycles; energy flows through and leaves as heat. About 10% passes each step.","_n":"2679a","_k":"1cde9113"},{"t":"Cells can create energy from ATP","why":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"27f8c","_k":"32dab306"},{"t":"Energy can’t be created or destroyed","why":"That’s the first law.","_n":"28f9c","_k":"918231f8"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"What is ΔG for ATP → ADP + Pᵢ (use the course value)?","options":[{"t":"≈ −2870 kJ/mol","why":"That’s glucose oxidation.","_n":"29fac","_k":"33c3dca5"},{"t":"≈ +30.5 kJ/mol","why":"That’s making ATP.","_n":"2afbc","_k":"707c0f22"},{"t":"≈ −305 kJ/mol","why":"A decimal slip.","_n":"2bf4c","_k":"8fb8998b"},{"t":"≈ −30.5 kJ/mol","why":"Hydrolysis releases energy, so ΔG is negative.","_n":"2cf5c","_k":"1fd7d534"}]},"b":{"prompt":"What is ΔG for the complete oxidation of glucose (use the course value)?","options":[{"t":"≈ −2870 kJ/mol","why":"Oxidizing a mole of glucose releases about 2870 kJ.","_n":"2df6c","_k":"dbc5478c"},{"t":"≈ +2870 kJ/mol","why":"That’s photosynthesis’s direction.","_n":"2ef7c","_k":"f7ae541b"},{"t":"≈ −1098 kJ/mol","why":"That’s the part captured in 36 ATP.","_n":"2f00c","_k":"2ac87345"},{"t":"≈ −30.5 kJ/mol","why":"That’s ATP hydrolysis.","_n":"2g01c","_k":"aadbd45d"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"In the ATP–ADP cycle, what recharges ADP + Pᵢ into ATP?","options":[{"t":"Nothing: ATP is made once and stored","why":"ATP is spent and remade within seconds. Long-term stores are glycogen and fat.","_n":"2hfec","_k":"8ae48834"},{"t":"Heat from the surroundings","why":"Matter cycles; energy flows through and leaves as heat. About 10% passes each step.","_n":"2ifdc","_k":"1d998a50"},{"t":"Energy from ATP itself","why":"ATP is what’s being made.","_n":"2jfcc","_k":"b9602310"},{"t":"Energy released by catabolism, such as cellular respiration","why":"Catabolism recharges ADP + Pᵢ; cell work spends ATP.","_n":"2kfbc","_k":"b2c9d507"}]},"b":{"prompt":"Which best describes ATP’s role in a cell?","options":[{"t":"A heat store","why":"ATP holds chemical energy.","_n":"2lfac","_k":"83d6ce4c"},{"t":"A long-term energy store","why":"Glycogen and fat are the stores.","_n":"2mf9c","_k":"919de479"},{"t":"A source of new energy","why":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"2nf8c","_k":"62d40473"},{"t":"A short-term energy currency, spent and remade constantly","why":"ATP turns over in the ATP–ADP cycle.","_n":"2of7c","_k":"6745e4e2"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"36 ATP capture 1098 kJ from a mole of glucose (2870 kJ). Which is closest to the efficiency?","options":[{"t":"38%","why":"1098 is a bit more than a third of 2870.","_n":"2p06c","_k":"0c0b9292"},{"t":"3.8%","why":"A decimal slip.","_n":"2q05c","_k":"ed91b1eb"},{"t":"62%","why":"That’s the fraction released as heat.","_n":"2r0aa","_k":"3cc646ce"},{"t":"100%","why":"Every conversion loses some energy as heat. Only about 34–38% ends up in ATP.","_n":"2s09a","_k":"e9da2b7b"}]},"b":{"prompt":"32 ATP capture 976 kJ from a mole of glucose (2870 kJ). Which is closest to the efficiency?","options":[{"t":"100%","why":"Every conversion loses some energy as heat. Only about 34–38% ends up in ATP.","_n":"2t0ca","_k":"8535cc42"},{"t":"66%","why":"Efficiency is captured ÷ total. Heat is the rest.","_n":"2u0ba","_k":"62b5165a"},{"t":"3.4%","why":"A decimal slip.","_n":"2v06a","_k":"7c17bc05"},{"t":"34%","why":"976 is about a third of 2870.","_n":"2w05a","_k":"f371e9b0"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A reaction has ΔG = +20 kJ/mol. It’s coupled to one ATP hydrolysis. What is the overall ΔG, and does it run?","options":[{"t":"−10.5 kJ/mol; it runs","why":"+20 + (−30.5) = −10.5: negative, so it runs.","_n":"2x08a","_k":"65bbe5c2"},{"t":"+50.5 kJ/mol; it doesn’t run","why":"ATP adds −30.5, not +30.5.","_n":"2y07a","_k":"dad6813f"},{"t":"+10.5 kJ/mol; it doesn’t run","why":"A sign slip: 20 − 30.5 = −10.5.","_n":"2z02a","_k":"24360ead"},{"t":"−50.5 kJ/mol; it runs","why":"+20 is uphill: add it, don’t subtract.","_n":"3001a","_k":"ea3e2baf"}]},"b":{"prompt":"A reaction has ΔG = +12 kJ/mol. It’s coupled to one ATP hydrolysis. What is the overall ΔG, and does it run?","options":[{"t":"−42.5 kJ/mol; it runs","why":"Add +12 to −30.5.","_n":"31049","_k":"538eb51b"},{"t":"+18.5 kJ/mol; it doesn’t run","why":"A sign slip.","_n":"32059","_k":"d2aeb5dd"},{"t":"−18.5 kJ/mol; it runs","why":"+12 + (−30.5) = −18.5: negative, so it runs.","_n":"33029","_k":"081f5fec"},{"t":"+42.5 kJ/mol; it doesn’t run","why":"Breaking ATP releases ≈ 30.5 kJ/mol (ΔG negative); making it needs that much.","_n":"34039","_k":"3e83356d"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Yeast ferment sugar into ethanol and CO₂, making 2 ATP per glucose. Why can ethanol still be burned as a fuel for cars?","options":[{"t":"Fermentation releases only a small part of glucose’s energy, so most of it is still in the ethanol","why":"Fermentation stops early: most of the energy is still in the lactate or ethanol.","_n":"35089","_k":"5ed8c970"},{"t":"The yeast add energy to the ethanol","why":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"36099","_k":"b824d275"},{"t":"Ethanol isn’t really a fuel","why":"It’s burned in many vehicles.","_n":"37069","_k":"e3a0183f"},{"t":"The energy came from the CO₂","why":"CO₂ is a low-energy product.","_n":"38079","_k":"b7b35995"}]},"b":{"prompt":"During a sprint, muscles make lactate. Later, the liver takes up the lactate and turns it back into glucose (or the heart oxidizes it). Why is this worthwhile?","options":[{"t":"The liver can create energy from lactate","why":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"39fc9","_k":"0e3a3a9a"},{"t":"Lactate still holds most of the original glucose’s energy","why":"Fermentation stops early: most of the energy is still in the lactate or ethanol.","_n":"3afd9","_k":"4684d772"},{"t":"Lactate releases heat to keep the liver warm","why":"Fermentation stops early: most of the energy is still in the lactate or ethanol.","_n":"3b7e9","_k":"e1083dd0"},{"t":"Lactate is pure waste with no energy","why":"Fermentation stops early: most of the energy is still in the lactate or ethanol.","_n":"3c7d9","_k":"683c5a48"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why a cell can’t capture 100% of glucose’s energy in ATP?","options":[{"t":"“Each energy conversion releases some energy as heat (second law), so the energy captured in ATP is always less than the energy released.”","why":"It names the law and says where the rest goes.","_n":"3d7c9","_k":"acd9aee7"},{"t":"“Cells don’t need that much ATP.”","why":"Demand doesn’t change efficiency.","_n":"3e7b9","_k":"b530227c"},{"t":"“Some energy is destroyed in each reaction.”","why":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"3f7a9","_k":"df600c58"},{"t":"“The rest is stored in CO₂.”","why":"CO₂ is a low-energy product.","_n":"3g799","_k":"10568855"}]},"b":{"prompt":"Which is the best explanation of why ATP, not glucose, powers most cell work directly?","options":[{"t":"“ATP releases energy in small packets (≈ 30.5 kJ/mol) that match the size of individual cell reactions, and it’s quickly remade.”","why":"It gives the packet size and the quick turnover.","_n":"3h789","_k":"d674a380"},{"t":"“ATP is a long-term store.”","why":"ATP is spent and remade within seconds. Long-term stores are glycogen and fat.","_n":"3i779","_k":"3f882e61"},{"t":"“Glucose can’t be broken down.”","why":"It’s broken down to make ATP.","_n":"3j869","_k":"69ea96d6"},{"t":"“ATP holds more energy than glucose.”","why":"A mole of glucose holds far more.","_n":"3k859","_k":"53b12048"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which energy flow summary is correct for 36 ATP per glucose?","options":[{"t":"Glucose 2870 kJ → ATP 1772 kJ + heat 1098 kJ","why":"Swapped.","_n":"3l789","_k":"a10e1277"},{"t":"Glucose 2870 kJ → ATP 1098 kJ + heat 1772 kJ","why":"36 × 30.5 = 1098; 2870 − 1098 = 1772.","_n":"3m799","_k":"7311b11c"},{"t":"Glucose 2870 kJ → ATP 2870 kJ","why":"Every conversion loses some energy as heat. Only about 34–38% ends up in ATP.","_n":"3n7a9","_k":"c62ad900"},{"t":"Glucose 2870 kJ → ATP 1098 kJ + heat 1098 kJ","why":"The parts must add to 2870.","_n":"3o7b9","_k":"15d6d3fe"}]},"b":{"prompt":"Which energy flow summary is correct for 38 ATP per glucose?","options":[{"t":"Glucose 2870 kJ → ATP 1159 kJ + heat 1159 kJ","why":"The parts must add to 2870.","_n":"3p749","_k":"bec11e67"},{"t":"Glucose 2870 kJ → ATP 1711 kJ + heat 1159 kJ","why":"Efficiency is captured ÷ total. Heat is the rest.","_n":"3q759","_k":"257ec62f"},{"t":"Glucose 2870 kJ → ATP 1159 kJ + heat 1711 kJ","why":"38 × 30.5 = 1159; 2870 − 1159 = 1711.","_n":"3r769","_k":"0a76e980"},{"t":"Glucose 2870 kJ → ATP 2870 kJ","why":"Every conversion loses some energy as heat. Only about 34–38% ends up in ATP.","_n":"3s779","_k":"0915958b"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Plants in a meadow capture 50 000 kJ. Using about 10% per step, roughly how much reaches hawks in the chain plants → mice → snakes → hawks?","options":[{"t":"50 kJ","why":"5000 → 500 → 50.","_n":"3t809","_k":"577c4311"},{"t":"500 kJ","why":"That’s the snakes’ level.","_n":"3u819","_k":"ff72fc36"},{"t":"5000 kJ","why":"That’s the mice’s level.","_n":"3v729","_k":"ac6919fb"},{"t":"45 000 kJ","why":"That subtracts 10% once instead of keeping 10% each step.","_n":"3w719","_k":"1bc4850d"}]},"b":{"prompt":"A pond’s algae capture 80 000 kJ. Using about 10% per step, roughly how much reaches herons in the chain algae → insect larvae → small fish → herons?","options":[{"t":"80 kJ","why":"8000 → 800 → 80.","_n":"3x749","_k":"5596fd9c"},{"t":"72 000 kJ","why":"Matter cycles; energy flows through and leaves as heat. About 10% passes each step.","_n":"3y739","_k":"379611ed"},{"t":"8000 kJ","why":"That’s the larvae.","_n":"3z769","_k":"2dfe7fdb"},{"t":"800 kJ","why":"That’s the small fish.","_n":"40759","_k":"a0fdb0bb"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Why does shivering warm you up?","options":[{"t":"Shivering reduces heat loss through the skin","why":"That’s narrowing blood vessels; shivering makes heat.","_n":"41789","_k":"5dbdb89f"},{"t":"Shivering stores ATP for later","why":"ATP is spent and remade within seconds. Long-term stores are glycogen and fat.","_n":"42779","_k":"bbfb0427"},{"t":"Shivering creates new energy","why":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"437a9","_k":"94a0a9b8"},{"t":"Muscle contractions use ATP rapidly, so respiration speeds up, and most of the energy released becomes heat","why":"More conversions, more heat: the second law at work.","_n":"44799","_k":"3ae743e0"}]},"b":{"prompt":"A cyclist’s body temperature rises during a long climb. What’s the best explanation?","options":[{"t":"Energy is being destroyed faster","why":"Energy is converted, not destroyed. What isn’t captured in ATP leaves as heat.","_n":"450c9","_k":"7b387431"},{"t":"ATP is a heat store","why":"ATP is spent and remade within seconds. Long-term stores are glycogen and fat.","_n":"460d9","_k":"6e7f6ff5"},{"t":"ATP use and respiration both speed up; each conversion releases heat","why":"More conversions, more heat: the second law at work.","_n":"470a9","_k":"e5dfdc8e"},{"t":"The sun is the only source of the extra heat","why":"Metabolic heat is the main source here.","_n":"480b9","_k":"d07e9c4d"}]}}]},"task":{"title":"Fuel a sprint","summary":"Fuel a sprint","statement":"\u003cp>A sprinter’s muscle fibres need energy fast. Choose how many moles of glucose to use aerobically (36 ATP each, 6 O₂ each) and by fermentation (2 ATP each) so that every condition is met. Can you find all the answers?\u003c/p>\u003col class=\"et-conds\">\u003cli>At least 80 ATP are made.\u003c/li>\u003cli>No more than 6 moles of glucose are used in total.\u003c/li>\u003cli>No more than 18 moles of O₂ are used (the blood can’t deliver more).\u003c/li>\u003cli>At least 1 mole of glucose is fermented (the burst outruns the O₂ supply).\u003c/li>\u003c/ol>","inputs":{"a":"Aerobic glucose, \u003cem>a\u003c/em> (moles)","f":"Fermented glucose, \u003cem>f\u003c/em> (moles)"},"checks":["At least 80 ATP","At most 6 glucose","At most 18 O₂","Some fermentation"],"tips":["Aerobic glucose gives far more ATP. How many can the O₂ supply allow?","18 O₂ ÷ 6 = 3 aerobic at most. With 2 aerobic you need 8 more ATP from fermentation.","The glucose limit caps fermentation once you’ve chosen \u003cem>a\u003c/em>."],"tip4":"At least 1 mole of glucose must be fermented: the burst outruns the O₂ supply.","previewNote":"Per mole of glucose: aerobic 36 ATP, 6 O₂, ≈ 1772 kJ heat; fermented 2 ATP, ≈ 139 kJ heat, ≈ 2670 kJ left in 2 lactate.","explainPrompt":"Explain how the O₂ limit and the ATP target together shaped your choice, and where the unused energy from the fermented glucose ends up.","vocab":"Use the words aerobic, fermentation, ATP yield and lactate.","afterAt":4,"after3":"Each fermented glucose adds only 2 ATP and leaves most of its energy in lactate. That’s why the body prefers aerobic respiration when O₂ allows."},"cards":[["First law of thermodynamics","Energy is converted, never created or destroyed."],["Second law of thermodynamics","Every conversion releases some energy as heat; none is 100% efficient."],["Glucose oxidation","ΔG ≈ −2870 kJ/mol."],["ATP hydrolysis","ΔG ≈ −30.5 kJ/mol; making ATP needs ≈ +30.5."],["Efficiency (36 ATP)","1098 ÷ 2870 ≈ 38%; the rest (1772 kJ) is heat."],["ATP–ADP cycle","ATP is spent for work and remade from ADP + Pᵢ by catabolism, constantly."],["Coupling","Uphill ΔG + ATP’s −30.5 must total less than 0 for the reaction to run."],["Fermentation’s energy","Only 2 ATP; most of the energy stays in lactate or ethanol."],["Body heat","Energy not captured in ATP, plus energy released when ATP is used."],["10% rule","About 10% of energy passes to the next trophic level; the rest is lost as heat."]]}};</script>
