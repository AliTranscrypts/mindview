.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 31 CRISPR gene editing. Colour roles (plan §5): guide RNA teal (--bio-nadh), PAM magenta outline (--bio-h),
   Cas9 --ink-2, template --pen, protein ink / --ink-2 at 40 %. No red or green except feedback. */
.cr-heq{font-size:.62em;letter-spacing:.01em}
.cr-hero{max-width:440px;margin:0 auto}
.cr-svg{display:block;width:100%;height:auto;overflow:visible}
.cr-svg text{font-family:var(--font-ui)}
.cr-ex [hidden],.cr-p3 [hidden]{display:none!important}

/* radio groups (from SBI4U 20 / 14 / 10 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* switch (role="switch") */
.cr-swb{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink);padding:.3em .85em;min-height:38px;font-size:.9rem}
.cr-swb b{min-width:2.2em;text-align:left}
.cr-swb[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.cr-swb:disabled{opacity:.55}

/* Explore layout */
@media (min-width:821px){ .pg.cr-pg{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} }
.cr-pg .pg-ctrl{display:grid;gap:12px}
.cr-row{margin:0 0 8px}
.cr-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.cr-panel .cr-row{margin:0}
.cr-h{margin:6px 0 6px;font-size:.95rem}
.cr-pams{display:flex;flex-wrap:wrap;gap:6px}
.cr-player{margin-top:0}
.cr-scroll{overflow-x:auto;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.cr-stage{position:relative;min-width:640px;aspect-ratio:880 / 190}
.cr-stage svg{position:absolute;inset:0;width:100%;height:100%}
.cr-ov{position:absolute;inset:0}
.cr-sb{position:absolute;background:transparent;border:0;border-radius:8px;padding:0;cursor:pointer}
.cr-sb:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.cr-sb[aria-pressed="true"]{outline:2px dashed var(--ink-2)}
.cr-hint{margin:6px 0 0}
.cr-cellp{border:1.5px solid var(--rule);border-radius:10px;margin-top:10px;background:var(--sheet);padding:4px 6px}
.cr-cap{margin:6px 0 0;font-size:.95rem}
.cr-key{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;padding:0;margin:8px 0 0;font-size:.85rem;color:var(--ink-2)}
.cr-sw{display:inline-block;width:14px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cr-swg{background:var(--bio-nadh)}
.cr-swp{border:2px solid var(--bio-h)}
.cr-swc{background:var(--ink-2);opacity:.45}
.cr-swt{background:var(--pen)}
.cr-swh{background:var(--hi-soft);border:1px solid var(--rule)}
.cr-about summary{cursor:pointer;font-weight:700}
.cr-about ol{margin:.5em 0;padding-left:1.3em}
.cr-about p{margin:0}
.cr-why{margin:0;padding-left:1.1em}
.cr-why li{margin:2px 0}
.cr-tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.cr-tbl th,.cr-tbl td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left;vertical-align:top}
.cr-tbl thead th{color:var(--ink-2);font-size:.85rem}
.tbl-wrap .cr-tbl caption{text-align:left;padding:6px 8px}
@media (max-width:560px){
  .cr-mt thead,.cr-cards thead{display:none}
  .cr-mt tr,.cr-cards tr{display:block;border:1px solid var(--rule);border-radius:8px;margin:0 0 8px;padding:6px 8px}
  .cr-mt th,.cr-mt td,.cr-cards th,.cr-cards td{display:block;border:0;padding:2px 0}
  .cr-mt td::before,.cr-cards td::before{content:attr(data-h) ": ";font-weight:700;color:var(--ink-2)}
}

/* SVG roles */
.cr-goi{fill:var(--hi-soft);stroke:none}
.cr-genex{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:5 4}
.cr-glab{font-size:13px;font-weight:700;fill:var(--ink-2)}
.cr-s1{stroke:var(--ink);stroke-width:2.5}
.cr-s2{stroke:var(--ink-2);stroke-width:2.5}
.cr-rung{stroke:var(--rule);stroke-width:2}
.cr-p{stroke:none}
.cr-p0{fill:var(--bio-e)}.cr-p1{fill:var(--bio-atp)}.cr-p2{fill:var(--bio-carbon)}.cr-p3{fill:var(--ink-2)}
.cr-g{fill:var(--bio-nadh)}
.cr-g.mis{fill:none;stroke:var(--bio-nadh);stroke-width:1}
.cr-gt{font-size:12px;font-weight:700;fill:var(--bio-nadh)}
.cr-pam{fill:none;stroke:var(--bio-h);stroke-width:2.2}
.cr-pamt{font-size:11px;font-weight:700;fill:var(--bio-h)}
.cr-sl{font-size:14px;font-weight:700;fill:var(--ink)}
.cr-st{font-size:12px;fill:var(--ink-2)}
.cr-stc{font-weight:700;fill:var(--ink)}
.cr-cnt{font-size:13px;font-weight:700;fill:var(--ink)}
.cr-res{font-size:15px;font-weight:700;fill:var(--ink)}
.cr-cut{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.cr-cas{fill:var(--ink-2);fill-opacity:.16;stroke:var(--ink-2);stroke-width:2}
.cr-bact,.cr-nuc{fill:none;stroke:var(--ink-2);stroke-width:2}
.cr-nuc{stroke-dasharray:6 5}
.cr-phage{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.cr-tail{stroke:var(--ink);stroke-width:2}
.cr-coil{fill:none;stroke:var(--ink);stroke-width:1.6}
.cr-spc{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}
.cr-spc.on{stroke:var(--bio-nadh);stroke-width:2.6}
.cr-hs1{fill:none;stroke:var(--ink);stroke-width:2.5}
.cr-hs2{fill:none;stroke:var(--ink-2);stroke-width:2.5}
.cr-gap{fill:var(--sheet)}
.cr-tpl{stroke:var(--pen);stroke-width:3}
.cr-tplr{stroke:var(--pen);stroke-width:2}
.cr-lost{fill:var(--ink-2)}
.cr-pchain{fill:none;stroke:var(--ink);stroke-width:2}
.cr-pchain.off{stroke:var(--ink-2);stroke-opacity:.4}
.cr-prot{fill:var(--ink)}
.cr-prot.off{fill:var(--ink-2);fill-opacity:.4}
.cr-prot.fix{fill:var(--pen)}
/* dark mode: pattern squares keep their token colours with a 1 px ink outline (plan §5) */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cr-p{stroke:var(--ink);stroke-width:1} }
:root[data-theme="dark"] .cr-p{stroke:var(--ink);stroke-width:1}

/* Part 3 */
.cr-sth{margin:12px 0 4px}
.cr-sth:focus{outline:none}
.cr-cards1{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cr-card{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.5em .8em;text-align:left;max-width:100%;min-height:40px}
.cr-card[aria-pressed="true"]{border-color:var(--hi);background:var(--hi);color:var(--hi-ink);font-weight:700}
.cr-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){ .cr-bins{grid-template-columns:minmax(0,1fr)} }
.cr-binw{border:1.5px dashed var(--rule);border-radius:10px;padding:8px}
.cr-bin{width:100%;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.5em .6em;min-height:44px}
.cr-bin:disabled{opacity:.7}
.cr-binl{list-style:none;margin:6px 0 0;padding:0;font-size:.88rem}
.cr-binl li{margin:4px 0}
.cr-case{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 8px}
.cr-case summary{cursor:pointer}
.cr-case p{margin:.5em 0 0}
.cr-tag{display:inline-block;font-size:.78rem;font-weight:700;border:1px solid var(--rule);border-radius:4px;padding:0 .4em;color:var(--ink-2);margin-left:6px}
.cr-law{padding:10px 12px;border-left:4px solid var(--ink-2);background:var(--info-bg);border-radius:4px}
.cr-claim{padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;margin-top:8px}
.cr-claim p{margin:0}
.cr-zoom{margin-top:8px}

/* task */
.cr-tin{display:grid;gap:10px}
.cr-tin .cr-row{margin:0}

</style>

"group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"c626d8cf","content":{"id":"31-crispr","kind":"topic","title":"CRISPR gene editing","topic":"CRISPR Gene Editing","readyTopic":"CRISPR gene editing","hero":{"eq":"\u003cspan class=\"cr-heq\">guide RNA + Cas9 → cut → repair\u003c/span>","eqLabel":"Guide RNA plus Cas9 gives a cut, then the cell repairs it","eqSize":"sm","headline":"A bacterial defence became a pair of molecular scissors.","text":"\u003cstrong>CRISPR–Cas9\u003c/strong> lets scientists cut DNA at one chosen place. A \u003cstrong>guide RNA\u003c/strong> finds the spot by base pairing; \u003cstrong>Cas9\u003c/strong> makes the cut, but only next to a short \u003cstrong>PAM\u003c/strong> sequence. Then the cell repairs the break, and the \u003cstrong>repair\u003c/strong> decides what changes.","fig":{"html":"\u003cdiv class=\"cr-hero\" id=\"cr-hero\" role=\"img\" aria-label=\"A virus (phage) injects its DNA into a bacterium. A Cas protein holding a teal guide RNA finds the matching viral DNA and cuts it, and the viral DNA fades: bacteria do this to remember and destroy viruses. The scene cross-fades to a human cell nucleus, where the same complex, Cas9 holding its teal guide, clamps onto a DNA double helix beside a magenta-outlined PAM tag and cuts it: scientists borrowed it.\">\u003c/div>"}},"goals":["I can describe the parts of the CRISPR–Cas9 system (guide RNA, Cas9, PAM, template) and what each does.","I can explain why Cas9 cuts only where the guide matches \u003cstrong>and\u003c/strong> a PAM sits next to the target.","I can compare NHEJ and HDR and predict the outcome of an edit.","I can explain off-target effects and how scientists reduce them.","I can distinguish somatic from germline editing and explain why the difference matters.","I can evaluate uses of gene editing in medicine, agriculture and research, using evidence."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Base pairing","goal":2,"prompt":"An RNA strand pairs with a DNA strand. Which pairing rule applies to the RNA’s U?","options":[{"t":"U pairs with C","why":"C pairs with G.","_n":"0bab","_k":"a6fb1842"},{"t":"U pairs with G","why":"G pairs with C.","_n":"1bdb","_k":"82cc147a"},{"t":"U pairs with T","why":"T is DNA’s partner for A; U and T are both partners of A, not of each other.","_n":"2bcb","_k":"a2960d22"},{"t":"U pairs with A","why":"In RNA–DNA pairing, U takes T’s place, so it pairs with A.","_n":"3b7b","_k":"f188e44c"}],"hints":["Which base does U replace?","U replaces T.","T pairs with A, so U pairs with A."]},{"id":"w2","skill":"Base pairing","goal":2,"prompt":"A probe that is 20 nucleotides long matches a stretch of DNA at 20 of 20 positions. Another stretch matches at 14 of 20. Which will the probe bind most strongly?","options":[{"t":"The 14-of-20 stretch","why":"Six mismatches weaken binding.","_n":"4b6b","_k":"314fc7ed"},{"t":"Both equally","why":"Binding depends on how many positions pair.","_n":"5b9b","_k":"f71cd6d7"},{"t":"Neither, because probes don’t bind DNA","why":"Probes and primers bind by base pairing (module 30).","_n":"6b8b","_k":"a57fdeb1"},{"t":"The 20-of-20 stretch","why":"More matching pairs means more hydrogen bonds holding it on.","_n":"7c3b","_k":"200df6cf"}],"hints":["What holds paired strands together?","Hydrogen bonds between each matching pair.","20 matches give the most bonds."]},{"id":"w3","skill":"DNA vs RNA","goal":1,"prompt":"Which feature is true of RNA but not DNA?","options":[{"t":"It contains uracil","why":"RNA uses U; DNA uses T.","_n":"8c2b","_k":"af3a1601"},{"t":"It has a sugar–phosphate backbone","why":"Both nucleic acids share this.","_n":"910f","_k":"a715575f"},{"t":"It contains phosphate","why":"Both nucleic acids share this.","_n":"a11f","_k":"43a4777a"},{"t":"It is made of nucleotides","why":"Both nucleic acids share this.","_n":"b12f","_k":"30e103aa"}],"hints":["Compare the bases.","One base differs.","U in RNA, T in DNA."]},{"id":"w4","skill":"Frameshift mutations","goal":3,"prompt":"Two bases are deleted near the start of a gene. What is the most likely effect on the protein?","options":[{"t":"One amino acid changes","why":"That’s a substitution, not a frameshift.","_n":"c13f","_k":"8861c916"},{"t":"The protein becomes two amino acids shorter and still works","why":"That would need 6 bases (two whole codons) removed in frame.","_n":"d0cf","_k":"6f6a0e52"},{"t":"No effect, because two bases are too few to matter","why":"Even one base shifts the frame.","_n":"e0df","_k":"38519604"},{"t":"Every codon after the deletion is read differently, usually giving a non-working protein","why":"Deleting a number of bases that isn’t a multiple of 3 shifts the reading frame.","_n":"f0ef","_k":"ee0dba41"}],"hints":["How are codons read?","In threes, from the start codon.","Removing 2 shifts every later codon."]},{"id":"w5","skill":"Genes to proteins","goal":1,"prompt":"Which molecule carries a gene’s message from the nucleus to the ribosome?","options":[{"t":"Cas9","why":"Cas9 is a DNA-cutting enzyme, not a messenger.","_n":"g0ff","_k":"a235d0f4"},{"t":"tRNA","why":"tRNA brings amino acids.","_n":"h08f","_k":"33175b19"},{"t":"DNA polymerase","why":"It copies DNA.","_n":"i09f","_k":"07401691"},{"t":"mRNA","why":"mRNA is the message (module 23).","_n":"j82f","_k":"34af7076"}],"hints":["Which RNA is the “message”?","It’s made by transcription.","mRNA."]},{"id":"w6","skill":"Frameshift mutations","goal":3,"prompt":"Which change keeps the reading frame?","options":[{"t":"Deleting 3 bases","why":"3 bases is one whole codon, so later codons stay in frame.","_n":"k81f","_k":"6d7e1a90"},{"t":"Inserting 2 bases","why":"Not a multiple of 3, so the frame shifts.","_n":"l84f","_k":"b4acc0f9"},{"t":"Inserting 4 bases","why":"Not a multiple of 3, so the frame shifts.","_n":"m83f","_k":"7a158fc7"},{"t":"Deleting 1 base","why":"Not a multiple of 3, so the frame shifts.","_n":"n7ef","_k":"4b547d57"}],"hints":["Codons are groups of 3.","Which number is a multiple of 3?","3."]}],"refreshers":{"Base pairing":"A–T (A–U in RNA) and G–C. More matching positions means a stronger hold.","DNA vs RNA":"RNA is single-stranded, has ribose and uses U instead of T.","Frameshift mutations":"Adding or removing bases in numbers that aren’t multiples of 3 changes every codon downstream, usually ruining the protein.","Genes to proteins":"DNA → mRNA (transcription) → protein (translation)."}}},"explore":{"heading":"Cas9 targeting simulator","intro":"Load a guide, let Cas9 search, and see what the cell does with the cut.","sites":[{"id":"T1","gene":"goi","where":"in the gene of interest"},{"id":"T2","gene":"goi","where":"in the gene of interest"},{"id":"T3","gene":"","where":"outside genes"},{"id":"T4","gene":"x","where":"in gene X"},{"id":"T5","gene":"","where":"outside genes"},{"id":"T6","gene":"","where":"outside genes"}],"match":{"A":[20,9,6,11,8,7],"B":[8,20,10,7,20,6],"C":[7,10,20,18,9,5]},"pam":[1,1,0,1,1,1],"spacers":[7,20,9],"about":"\u003col>\u003cli>\u003cstrong>Cut rule:\u003c/strong> Cas9 cuts a site only if the site has a PAM \u003cstrong>and\u003c/strong> the match is ≥ 18 of 20.\u003c/li>\u003cli>\u003cstrong>Repair rule:\u003c/strong> if a template is supplied \u003cstrong>and\u003c/strong> the cell is dividing, HDR repairs the cut and the outcome is \u003cstrong>precise change\u003c/strong>. Otherwise NHEJ repairs it and the outcome is \u003cstrong>gene disrupted\u003c/strong> (if the site is inside a gene) or \u003cstrong>change outside the gene\u003c/strong> (otherwise).\u003c/li>\u003cli>\u003cstrong>Gene membership:\u003c/strong> T1 and T2 are in the gene of interest; T4 is in a different gene, “gene X”; T3, T5 and T6 are outside genes.\u003c/li>\u003c/ol>\u003cp>Real cutting depends on more than a count. This model keeps the idea.\u003c/p>","aha":"The guide decides \u003cstrong>where\u003c/strong>, the PAM decides \u003cstrong>whether\u003c/strong>, and the cell decides \u003cstrong>what\u003c/strong>.","predIntro":"Make a prediction first. Then Cas9 runs the search and the cell panel shows what happens.","predictions":[{"id":"p1","start":{"guide":"A","tpl":false,"cell":"div"},"prompt":"Genome editing, Guide A, no template, dividing cells. Which site(s) will Cas9 cut?","options":[{"t":"Every site","_n":"o7df","_k":"c270dbcf"},{"t":"None","_n":"p80f","_k":"b1263d81"},{"t":"T1 only","_n":"q7ff","_k":"f2024a24"},{"t":"T1 and T4","_n":"r8af","_k":"76da0c16"}],"explain":"Guide A matches T1 at 20 of 20 and T1 has a PAM. No other site matches 18 or more."},{"id":"p2","start":{"guide":"C","tpl":false,"cell":"div"},"prompt":"Guide C matches T3 perfectly. What happens at T3?","options":[{"t":"No cut, because guide C is the wrong length","_n":"s89f","_k":"3dd0e673"},{"t":"A cut, because the match is perfect","_n":"t7cf","_k":"409ddf27"},{"t":"A cut, plus a cut at every other site","_n":"u7df","_k":"d6fba099"},{"t":"No cut, because T3 has no PAM","_n":"v7af","_k":"5e598ff8"}],"explain":"Cas9 checks for a PAM first. With no PAM, it never opens the DNA to test the match."},{"id":"p3","start":{"guide":"A","tpl":true,"cell":"div"},"prompt":"Guide A, template on, dividing cells. What ends up at T1?","options":[{"t":"New DNA designed by Cas9","_n":"w7bf","_k":"84e824b1"},{"t":"The change written in the template","_n":"x80f","_k":"07c2cfe6"},{"t":"A random new gene","_n":"y81f","_k":"01bcf291"},{"t":"The original DNA, unchanged","_n":"z7ef","_k":"703abec3"}],"explain":"HDR copies the supplied template. Cas9 only cut."},{"id":"p4","start":{"guide":"A","tpl":true,"cell":"non"},"prompt":"Guide A, template on, \u003cstrong>non-dividing\u003c/strong> cells. Now what happens at T1?","options":[{"t":"The cut stays open forever","_n":"107ff","_k":"e79dc7cb"},{"t":"The cell divides to use the template","_n":"1184f","_k":"1cbe9c11"},{"t":"HDR copies the template as before","_n":"1285f","_k":"1f612a6b"},{"t":"The ends are joined by NHEJ, often with a small insertion or deletion","_n":"137ee","_k":"2c835235"}],"explain":"HDR works mainly in dividing cells. NHEJ is the default and is error-prone."}],"chalIntro":"Use the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Knock out the gene of interest without touching any other gene.","why":"Guide A cuts only T1, and with no template NHEJ joins the ends, disrupting the gene of interest. No other gene is changed.","general":"Choose a guide that cuts only inside the gene of interest, and let NHEJ do the repair.","msgs":{"mode":"Choose Genome editing (or Experiment) mode: this goal is about editing a genome.","guideB":"Guide B also cuts T5. Look at its match list.","guideC":"Guide C never cuts the gene of interest: its only cut is T4, in gene X.","tplDiv":"With a template in dividing cells you get a precise change, not a knockout.","tplNon":"Here NHEJ still knocks the gene out, but the template sits unused. A knockout plan needs no template: turn it off.","sites":"With these site switches, Guide A doesn’t cut T1 alone. Put the PAM switches back to the start (T3 off, the rest on)."},"hints":["Which guide cuts only inside the gene?","Check each guide’s sites with ≥ 18 matches and a PAM.","Guide A, no template."]},{"id":"tc2","goal":3,"prompt":"Make a precise change in the gene of interest.","why":"Guide A cuts only T1; with a template in dividing cells, HDR copies the template: a precise change, and nothing else is cut.","general":"A precise change needs HDR, and only T1 should be cut.","msgs":{"mode":"Choose Genome editing (or Experiment) mode: this goal is about editing a genome.","guideB":"Guide B also cuts T5, outside the gene. That’s an unwanted extra cut.","guideC":"Guide C never cuts the gene of interest: its only cut is T4, in gene X.","non":"HDR needs dividing cells.","noTpl":"No template, so NHEJ repairs the cut: that’s a knockout, not a precise change.","sites":"With these site switches, Guide A doesn’t cut T1 alone. Put the PAM switches back to the start (T3 off, the rest on)."},"hints":["Precise change needs which repair?","HDR needs a template and dividing cells.","Guide A, template on, dividing cells."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Guide C was designed for T4, in gene X. Will it cut \u003cstrong>only\u003c/strong> T4? Predict, then run it in Experiment mode. Then make one change to the site switches so that Guide C cuts nothing.","why":"T4 matched only 18 of 20 positions, yet it was still cut. That’s how off-target effects happen.","general":"Predict, run Guide C with the original switches, then make one switch change.","chips":[{"id":"t4","t":"T4 only, because T3 (20 of 20) has no PAM","_n":"147de","_k":"09dbd347"},{"id":"t34","t":"T3 and T4, because both match 18 or more","fb":"T3 matches 20 of 20, but check its PAM.","_n":"157ce","_k":"78b0069e"},{"id":"t3","t":"T3 only, because it matches 20 of 20","fb":"No PAM, no cut. Cas9 checks for the PAM before it opens the DNA.","_n":"167be","_k":"882d7684"},{"id":"none","t":"No sites, because 18 of 20 isn’t a perfect match","fb":"In this model, 18 of 20 beside a PAM is enough for a cut.","_n":"1782e","_k":"29886af0"}],"msgs":{"tpl":"Templates change the repair, not where Cas9 cuts.","t3":"That makes things worse: T3 matches 20 of 20, so it would be cut too.","mode":"Switch to Experiment mode: the site switches work only there.","guide":"Load Guide C: this challenge is about the guide designed for T4.","pred":"Choose your prediction (in the Experiment panel) before you run Guide C.","predWrong":"The prediction you chose before the run didn’t hold up. Choose the prediction the run supports, then run Guide C again with the original switches.","run":"Run Guide C with the original switches (T3 off, the rest on), so the run can test your prediction.","zero":"Guide C still cuts T4. Now make one change to the site switches so that Guide C cuts nothing.","many":"Make just one change to the site switches.","other":"Guide C still cuts T4: that switch doesn’t affect it."},"hints":["Which sites reach 18 matches for guide C?","T3 (20) and T4 (18). Which of them has a PAM?","Only T4, so only T4 is cut. Turning off T4’s PAM stops all cutting."]}]},"part3":{"slug":"ethics","name":"Should we?","heading":"Should we?","intro":"Four stations, each a real-world use of gene editing. Classify it, weigh it, and connect it back to the mechanism. Your views are yours: only the evidence and the use of terms are checked.","stations":[{"id":"s1","n":1,"t":"Somatic or germline?","text":"Tap a card, then tap the bin it belongs in.","bins":[{"id":"som","t":"Somatic","sub":"only the patient"},{"id":"germ","t":"Germline","sub":"descendants too"},{"id":"nh","t":"Not human"}],"cards":[{"id":"c1","t":"Editing a patient’s own blood stem cells, outside the body, to treat an inherited blood disorder","_a":"QUVdW0Y=","why":"Blood stem cells are body (somatic) cells: only the patient is affected, not their descendants."},{"id":"c2","t":"Editing an embryo before implantation","_a":"QVFXRAka","why":"Every cell of the future child, including its eggs or sperm, carries the change, so descendants can inherit it."},{"id":"c3","t":"Editing a research mouse line","_a":"QVhaFA==","why":"Not human: the mice pass the change to their offspring, but no person or person’s descendant is affected."},{"id":"c4","t":"Editing a crop plant","_a":"QVhaFA==","why":"Not human: the change passes to the plant’s seeds, but no person is edited."},{"id":"c5","t":"Editing a patient’s liver cells inside the body","_a":"QUVdW0Y=","why":"Liver cells are somatic: only the patient is affected, not their descendants."}],"wrong":"Ask: could this change reach a person’s child? Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","wrongNh":"Is a person being edited at all? Research animals and crops go in “Not human”.","wrongHuman":"A person is being edited here, so the bin is Somatic or Germline."},{"id":"s2","n":2,"t":"The cases","text":"Three short, factual cases. Open each one.","cases":[{"id":"med","t":"A medical case","tag":"Somatic","text":"An approved therapy for an inherited blood disorder edits a patient’s own blood stem cells outside the body. The edited cells are checked, then returned to the patient, where they make blood cells for life.","zoom":"The guide targets one site in the patient’s blood stem cells; the edited cells are tested before they go back in."},{"id":"crop","t":"An agricultural case","tag":"Not human","text":"A crop is edited by knocking out one gene, with no foreign DNA added. The plant carries only a small change in one of its own genes.","zoom":"Cut inside the gene, no template: NHEJ adds or loses a few bases and the gene is knocked out."},{"id":"twins","t":"The 2018 case","tag":"Germline","text":"A researcher announced the birth of twins from edited embryos. The work was widely condemned by scientists around the world, and the researcher was later jailed.","zoom":"Embryo edits reach every cell of the child, including eggs or sperm, and off-target cuts or uneven edits can’t be checked in every cell first."}]},{"id":"s3","n":3,"t":"Canadian law","text":"Canada’s \u003cstrong>Assisted Human Reproduction Act\u003c/strong> (2004) prohibits altering the genome of a human cell or embryo in a way that could be passed to descendants.","ask":"Tap every Station 1 card this law covers, then press Check.","_a":"OBRRBEZl","fb":{"som":"That edit is somatic: it can’t pass to descendants, so this prohibition doesn’t cover it.","nh":"The Act is about human cells and embryos, not mice or crops.","missing":"One card describes a change that could pass to descendants. Find it.","good":"The Act covers the embryo edit, because that change could pass to descendants. Somatic edits and non-human edits fall outside this prohibition."}},{"id":"s4","n":4,"t":"Weigh it","text":"For the medical case, build a claim: choose one benefit, one risk and one condition.","groups":[{"id":"ben","t":"Benefit","chips":[{"id":"cause","t":"it treats the disorder at its cause, in the patient’s own cells"},{"id":"once","t":"it can work as a one-time treatment instead of lifelong care"},{"id":"donor","t":"it uses the patient’s own cells, so no donor match is needed"}]},{"id":"risk","t":"Risk","chips":[{"id":"off","t":"off-target cuts could change other genes","zoom":"A guide can pair with a near-match elsewhere; if a PAM sits beside it, Cas9 cuts there too. You saw this in Explore, challenge 3 (T4, 18 of 20)."},{"id":"cost","t":"cost and access could limit who gets it","zoom":"Each patient’s own stem cells are edited outside the body, checked and returned: the cut-and-repair process is made to order for every patient."},{"id":"long","t":"long-term effects are unknown","zoom":"The edited stem cells keep dividing for life, so any unwanted change from the cut or its repair is copied into new blood cells for years."}]},{"id":"cond","t":"Condition","chips":[{"id":"consent","t":"patients give informed consent"},{"id":"over","t":"independent oversight approves each use"},{"id":"follow","t":"patients are followed up for years"}]}],"need":"Choose one chip from each group: a benefit, a risk and a condition."}],"quickCheck":{"title":"Quick check","summary":"Should we? quick check","items":[{"id":"q1","goal":5,"prompt":"Which edit could be inherited?","choices":[{"t":"a blood stem cell edit","fb":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"1881e","_k":"5e8fea54"},{"t":"an embryo edit","fb":"Right. An embryo’s cells give rise to every cell of the child, including eggs or sperm.","_n":"1980e","_k":"a3dbfc9f"},{"t":"a liver edit","fb":"Liver cells are somatic. Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"1a7fe","_k":"83ec91d3"},{"t":"a skin cell edit","fb":"Skin cells are somatic. Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"1b86e","_k":"b4c4d3fd"}]},{"id":"q2","goal":6,"prompt":"Why do therapies edit blood stem cells outside the body first?","choices":[{"t":"Cas9 only works outside bodies","fb":"Cas9 can work inside the body too: think of the liver card in Station 1.","_n":"1c85e","_k":"ed910bc3"},{"t":"Blood cells have no DNA","fb":"Blood stem cells have a full set of DNA.","_n":"1d78e","_k":"77afa708"},{"t":"The edited cells can be checked before they are returned","fb":"Right. Edited cells can be tested, for example for off-target cuts, before they go back to the patient.","_n":"1e79e","_k":"3b073983"},{"t":"It makes the edit inherited","fb":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"1f7ae","_k":"5b897ce7"}]},{"id":"q3","goal":4,"prompt":"Which is a risk that comes straight from the mechanism?","choices":[{"t":"The PAM spreads to other cells","fb":"The PAM is a short sequence in the target DNA; it doesn’t move.","_n":"1g7be","_k":"47eb9791"},{"t":"The guide turns into protein","fb":"The guide is RNA that pairs with DNA; it isn’t translated.","_n":"1h7ce","_k":"4c5f1407"},{"t":"Cas9 copies itself","fb":"Cas9 is an enzyme that cuts; it doesn’t copy anything.","_n":"1i7de","_k":"ca298ded"},{"t":"Cuts at near-matching sites","fb":"Right. A near-match elsewhere can still be cut. Scientists choose guides with no close matches anywhere else.","_n":"1j7ee","_k":"316e21cc"}]},{"id":"q4","goal":6,"prompt":"Which Canadian law addresses heritable human genome changes?","choices":[{"t":"The Fisheries Act","fb":"That law covers other things; check Station 3.","_n":"1k7fe","_k":"83436289"},{"t":"The Food and Drugs Act","fb":"That law covers other things; check Station 3.","_n":"1l80e","_k":"3db7c635"},{"t":"The Assisted Human Reproduction Act","fb":"Right. It prohibits changes to the human genome that could be passed to descendants.","_n":"1m81e","_k":"57aa562a"},{"t":"The Canada Health Act","fb":"That law covers other things; check Station 3.","_n":"1n0ae","_k":"673e326e"}]}]}},"practice":{"activities":[{"id":"who","type":"sorter","title":"Who is affected?","summary":"Who is affected?","goal":[5,6],"noun":"edit","txt":true,"instruction":"Sort each edit by who it can affect.","boxes":[{"id":"som","label":"Somatic","sub":"only the patient"},{"id":"germ","label":"Germline","sub":"descendants too"},{"id":"nh","label":"Not human"}],"items":[{"id":"i1","t":"Edited bone marrow cells returned to a patient.","_a":"QUVdW0Y=","goal":5,"why":"Bone marrow cells are body cells: only the patient is affected.","wrong":{"germ":"Bone marrow cells aren’t eggs, sperm or embryos. Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","nh":"These are a patient’s own human cells."},"hints":["Could this change reach a child?","Gametes and embryos are germline.","Somatic: bone marrow cells are body cells, so only the patient is affected."]},{"id":"i2","t":"An edited fertilized egg implanted for pregnancy.","_a":"QVFXRAka","goal":5,"why":"A fertilized egg becomes every cell of the child, including its eggs or sperm.","wrong":{"som":"A fertilized egg becomes every cell of the child, including its eggs or sperm, so the change can reach descendants.","nh":"This is a human fertilized egg."},"hints":["Could this change reach a child?","Gametes and embryos are germline.","Germline: the fertilized egg becomes every cell of the child, including eggs or sperm."]},{"id":"i3","t":"Edited sperm-producing stem cells.","_a":"QVFXRAka","goal":5,"why":"Sperm-producing cells make gametes, so changes can reach children.","wrong":{"som":"Sperm-producing cells make gametes, so changes can reach children.","nh":"These are human cells that make sperm."},"hints":["Could this change reach a child?","Gametes and embryos are germline.","Germline: sperm-producing cells make gametes, so changes can reach children."]},{"id":"i4","t":"An edited cell line grown in a dish, never placed in a person.","_a":"QVhaFA==","goal":6,"why":"Not human: research cells in a dish, with no descendants.","wrong":{"som":"These cells never go into a person, so no patient is affected.","germ":"Cells in a dish have no descendants."},"hints":["Could this change reach a child?","Gametes and embryos are germline. Is any person involved here?","Not human: research cells in a dish, never placed in a person, have no descendants."]},{"id":"i5","t":"A knockout zebrafish line for studying heart development.","_a":"QVhaFA==","goal":6,"why":"Not human: a research fish line.","wrong":{"som":"No person is edited: it’s a fish.","germ":"The fish pass it on, but no person’s descendants are affected."},"hints":["Could this change reach a child?","Gametes and embryos are germline. Is a person involved here?","Not human: zebrafish are research animals."]},{"id":"i6","t":"A wheat line with a gene knocked out.","_a":"QVhaFA==","goal":6,"why":"Not human: a crop line.","wrong":{"som":"No person is edited: it’s a crop.","germ":"The wheat passes it on in its seeds, but no person’s descendants are affected."},"hints":["Could this change reach a child?","Gametes and embryos are germline. Is a person involved here?","Not human: wheat is a crop."]},{"id":"i7","t":"Edited eye cells injected into one eye.","_a":"QUVdW0Y=","goal":5,"why":"Eye cells are body cells: only the patient is affected.","wrong":{"germ":"Eye cells aren’t eggs, sperm or embryos. Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","nh":"These are a patient’s own human cells."},"hints":["Could this change reach a child?","Gametes and embryos are germline.","Somatic: eye cells are body cells, so only the patient is affected."]},{"id":"i8","t":"An edited early embryo used only for research and never implanted.","_a":"QVFXRAka","goal":5,"why":"Germline: the embryo’s cells \u003cem>could\u003c/em> pass changes on, and the law treats this seriously.","wrong":{"som":"Embryo cells could become every cell of a person, including eggs or sperm.","nh":"It is a human embryo, even though it is used only for research."},"hints":["Could this change reach a child?","Gametes and embryos are germline.","Germline: the embryo’s cells could pass changes on, and the law treats this seriously."]}],"wrongDefault":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic."},{"id":"outcome","type":"mc","title":"Predict the outcome","summary":"Predict the outcome","star":true,"goal":[2,3,4],"instruction":"Use the simulator’s rules without the simulator. Items 3 to 6 are non-routine (★); item 5 is an investigation.","items":[{"id":"r1","goal":3,"prompt":"A guide matches its target 20 of 20, a PAM is present, no template is supplied, and the cells are dividing. What is the most likely outcome?","options":[{"t":"Cut; HDR; a precise change","why":"No template, so no HDR. NHEJ joins the ends quickly and often adds or loses a few bases. That’s why it’s used to knock genes out.","_n":"1o09e","_k":"aad2f1ab"},{"t":"No cut","why":"A PAM and a 20-of-20 match: Cas9 cuts.","_n":"1p0ce","_k":"fa9b075a"},{"t":"Cas9 writes a new gene into the cut","why":"Cas9 only cuts. The cell’s own repair decides what ends up in the gap.","_n":"1q0be","_k":"934a2072"},{"t":"Cut; NHEJ; the gene is likely disrupted","why":"PAM and 20 of 20, so Cas9 cuts; with no template, NHEJ joins the ends and often shifts the frame.","_n":"1r0ee","_k":"c084a6a9"}],"hints":["Run the three rules: PAM? Match ≥ 18? Template and dividing?","Every rule up to repair passes: PAM yes, 20 of 20. Then: no template.","Cut; NHEJ; gene likely disrupted."]},{"id":"r2","goal":2,"prompt":"A guide matches its target 20 of 20, but there is \u003cstrong>no PAM\u003c/strong> next to the target. What happens?","options":[{"t":"A cut at the nearest PAM instead","why":"It cuts only where the guide matches.","_n":"1s0de","_k":"1095328e"},{"t":"A cut, then HDR","why":"No PAM, no cut, so there is nothing to repair.","_n":"1t10e","_k":"fd77c5fa"},{"t":"Cut","why":"No PAM, no cut. Cas9 checks for the PAM before it opens the DNA.","_n":"1u0fe","_k":"67fed2d2"},{"t":"No cut","why":"Cas9 checks for the PAM first.","_n":"1v02e","_k":"d3dcfa72"}],"hints":["Run the three rules: PAM? Match ≥ 18? Template and dividing?","The first rule fails: there’s no PAM.","No cut."]},{"id":"r3","goal":4,"prompt":"★ A guide matches the target 20 of 20 \u003cstrong>and\u003c/strong> a second gene 19 of 20, both with PAMs. Which may be cut?","options":[{"t":"Only the target","why":"19 of 20 is close enough to be cut in this model. A near-match elsewhere can still be cut. Scientists choose guides with no close matches anywhere else.","_n":"1w01e","_k":"72ec748b"},{"t":"Neither","why":"Both sites pass the PAM rule and the ≥ 18 rule.","_n":"1x04e","_k":"ba8dc77d"},{"t":"Both may be cut","why":"19 of 20 is ≥ 18 beside a PAM: an off-target cut.","_n":"1y05e","_k":"51e446c2"},{"t":"Only the second gene","why":"The target matches perfectly beside a PAM, so it is cut.","_n":"1z02e","_k":"7ea258f1"}],"hints":["Run the three rules: PAM? Match ≥ 18? Template and dividing?","Apply the rules to each site: both have a PAM, and 20 and 19 are both ≥ 18.","Both may be cut."]},{"id":"r4","goal":3,"prompt":"★ A scientist wants a precise correction in mature nerve cells. What is most likely?","options":[{"t":"The cells divide so that they can use the template","why":"Mature nerve cells don’t divide.","_n":"2003e","_k":"6f3eaa6b"},{"t":"NHEJ is likely instead, so this plan may give a knockout","why":"HDR works mainly in dividing cells; mature nerve cells don’t divide, so NHEJ joins the ends.","_n":"2100e","_k":"d4557432"},{"t":"No cut, because nerve cells have no PAM","why":"A PAM is part of the DNA next to the target, in any cell type.","_n":"2201e","_k":"31ac319b"},{"t":"HDR works, giving the precise correction","why":"HDR works mainly in dividing cells.","_n":"23fee","_k":"1f133ad4"}],"hints":["Run the three rules: PAM? Match ≥ 18? Template and dividing?","The repair rule fails: mature nerve cells don’t divide.","NHEJ is likely instead, so this plan may give a knockout."]},{"id":"r5","goal":2,"prompt":"★ Investigation. An editing experiment is done on cells in a dish. Which control best shows that the guide caused the change?","options":[{"t":"A different type of cell given the same guide and Cas9","why":"Changing the cells adds a second variable.","_n":"24ffe","_k":"ec0ebaec"},{"t":"The same cells given twice as much guide","why":"That changes the amount of guide, not whether it is there.","_n":"250ce","_k":"4fa6990a"},{"t":"Untreated cells only","why":"That tests everything at once; remove just the guide to isolate it.","_n":"260de","_k":"11fce2be"},{"t":"The same cells given Cas9 with no guide, or with a guide that matches nothing","why":"Only the guide differs, so any difference is caused by the guide.","_n":"27870","_k":"b81065ec"}],"hints":["A good control changes only one thing.","Which single part do you want to test? Remove just that part.","The same cells given Cas9 with no guide (or a guide that matches nothing)."]},{"id":"r6","goal":2,"prompt":"★ A virus that infects bacteria mutates the stretch that matches the bacterium’s spacer. What happens on the next infection?","options":[{"t":"The virus is still destroyed","why":"The guide no longer matches.","_n":"28860","_k":"9fe46bf9"},{"t":"Cas9 cuts the bacterium’s own DNA instead","why":"Cutting needs a guide match beside a PAM.","_n":"29850","_k":"e3728f53"},{"t":"The bacterium changes the PAM to match","why":"The PAM is in the virus’s DNA beside the target; the bacterium can’t change it.","_n":"2a840","_k":"2414f2aa"},{"t":"The virus escapes the defence","why":"The guide no longer matches, so Cas9 doesn’t cut.","_n":"2b830","_k":"df1e3029"}],"hints":["The spacer is copied into the guide. Does the guide still match?","The match rule fails: the matching stretch has changed.","The virus escapes the defence."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Ruby","how":"","instruction":"Ruby made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain how CRISPR–Cas9 knocks out a gene.","steps":["A guide RNA is made to match the target in the gene.","The guide pairs with the matching DNA next to a PAM.","Cas9 cuts both DNA strands there.","Cas9 then writes a short stop signal into the gap.","The gene now makes a non-working protein."],"_a":"UA==","stepFb":["Step 1 is correct: the guide is designed to match the target.","Step 2 is correct: base pairing next to a PAM.","Step 3 is correct: Cas9 cuts both strands.","","Step 5 is the goal of a knockout; the mistake is earlier."],"fixes":[{"t":"DNA polymerase deletes the gene.","why":"Repair joins the ends; it doesn’t delete the whole gene.","_n":"2c820","_k":"e33d161e"},{"t":"The guide RNA becomes part of the gene.","why":"The guide is not inserted.","_n":"2d810","_k":"4d1aa362"},{"t":"The cell joins the ends by NHEJ, often adding or losing bases, which shifts the reading frame.","why":"Cas9 only cuts. The cell’s own repair decides what ends up in the gap.","_n":"2e800","_k":"ff95aafd"},{"t":"Cas9 writes a random sequence.","why":"Cas9 doesn’t write anything.","_n":"2f8f0","_k":"b2faf077"}],"hints":["What does Cas9 do, and only do?","Cas9 only cuts. Who fills the gap?","The cell joins the ends by NHEJ, often adding or losing bases."]},{"id":"e2","goal":5,"task":"Explain whether a blood stem cell therapy changes a patient’s children.","steps":["The patient’s own blood stem cells are edited outside the body.","The edited cells are checked and returned.","They make healthy blood cells for life.","Because the change is in the patient’s DNA, the patient’s children will inherit it.","So the therapy affects future generations."],"_a":"UA==","stepFb":["Step 1 is correct: the cells are edited outside the body.","Step 2 is correct: the cells are checked, then returned.","Step 3 is correct: blood stem cells keep making blood cells.","","Step 5 follows from the mistake; the mistake is earlier."],"fixes":[{"t":"Children inherit it only if the patient is young.","why":"Age doesn’t matter; cell type does.","_n":"2g8e0","_k":"995ea13d"},{"t":"Children inherit it if the edit is precise.","why":"Precision doesn’t change which cells were edited.","_n":"2h810","_k":"a94f814e"},{"t":"Children inherit half of the edit.","why":"Somatic edits aren’t inherited at all.","_n":"2i820","_k":"27c54624"},{"t":"Blood stem cells are somatic; eggs and sperm are unchanged, so children don’t inherit the edit.","why":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"2j830","_k":"56baf681"}],"hints":["Which cells were edited?","Blood stem cells are somatic. Which cells pass DNA to children?","Only eggs and sperm pass DNA on, and they are unchanged."]}]}]},"reflect":{"journal":[{"id":"j1","q":"In Explore, which result surprised you most: the PAM rule, the non-dividing cell, or the 18-of-20 cut? Why?"},{"id":"j2","q":"In your own words, explain “the guide decides where, the PAM decides whether, the cell decides what”."},{"id":"j3","q":"Explain to a friend the difference between a somatic edit and a germline edit, using one example of each."},{"id":"j4","q":"Where do you stand on editing embryos? Name one piece of evidence and one value that shape your view, and one question you’d still want answered."}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In CRISPR–Cas9, what finds the target DNA?","options":[{"t":"The template, by attaching first","why":"The template is used only in HDR repair.","_n":"2k840","_k":"1d51a2b0"},{"t":"Cas9, by reading the protein","why":"Cas9 cuts once the guide has matched; it doesn’t read proteins.","_n":"2l7d0","_k":"70df40be"},{"t":"The guide RNA, by base pairing","why":"The guide pairs with the matching stretch.","_n":"2m7e0","_k":"4b2da029"},{"t":"The PAM, by moving to the gene","why":"The PAM is a fixed short sequence in the DNA.","_n":"2n7f0","_k":"a958b932"}]},"b":{"prompt":"In CRISPR–Cas9, what cuts the DNA?","options":[{"t":"DNA ligase","why":"Ligase joins DNA; it doesn’t cut.","_n":"2o800","_k":"b2d82fa0"},{"t":"The PAM","why":"The PAM is part of the DNA.","_n":"2p890","_k":"85d8720e"},{"t":"The guide RNA","why":"The guide matches; it doesn’t cut.","_n":"2q8a0","_k":"3b60028f"},{"t":"Cas9","why":"Cas9 is the enzyme that makes the double-strand cut.","_n":"2rd0f","_k":"4f78f234"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Besides a matching target, what must Cas9 find before it cuts?","options":[{"t":"A template","why":"Templates matter only for repair.","_n":"2sd1f","_k":"b07e02af"},{"t":"A start codon","why":"Start codons matter in translation, not cutting.","_n":"2td2f","_k":"bd780333"},{"t":"A second guide","why":"One guide is enough.","_n":"2ud3f","_k":"27e826c3"},{"t":"A PAM sequence right next to the target","why":"No PAM, no cut.","_n":"2vccf","_k":"44f197f2"}]},"b":{"prompt":"A target matches the guide perfectly but has no PAM beside it. What happens?","options":[{"t":"The guide changes to fit another site","why":"Guides don’t change.","_n":"2wcdf","_k":"a63e537b"},{"t":"Cas9 cuts at the nearest PAM instead","why":"It cuts only where the guide matches.","_n":"2xcef","_k":"27ca61e1"},{"t":"Cas9 doesn’t cut there","why":"Cas9 checks for the PAM first.","_n":"2ycff","_k":"cffd81d0"},{"t":"Cas9 cuts, because the match is perfect","why":"No PAM, no cut. Cas9 checks for the PAM before it opens the DNA.","_n":"2zd8f","_k":"98fd1d47"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which repair pathway needs a template?","options":[{"t":"Homology-directed repair (HDR)","why":"HDR copies the template.","_n":"30d9f","_k":"55e24204"},{"t":"Both","why":"Only HDR.","_n":"31d6f","_k":"e4b6c8f1"},{"t":"Neither","why":"HDR does.","_n":"32d5f","_k":"fff595e1"},{"t":"Non-homologous end joining (NHEJ)","why":"NHEJ joins the ends without one.","_n":"33d4f","_k":"c56b2b21"}]},"b":{"prompt":"Which repair pathway often adds or removes a few bases?","options":[{"t":"HDR","why":"HDR is the precise one.","_n":"34d3f","_k":"1a71e009"},{"t":"Both equally","why":"HDR is precise when a template is present.","_n":"35d2f","_k":"c01466a1"},{"t":"Neither","why":"NHEJ does.","_n":"36d1f","_k":"a1785da1"},{"t":"NHEJ","why":"It joins the ends quickly and imprecisely.","_n":"37d0f","_k":"3e33a3be"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A guide matches its target perfectly with a PAM. No template is given, and the cells divide. What is the most likely outcome?","options":[{"t":"No cut","why":"A perfect match beside a PAM is cut.","_n":"38cff","_k":"c2971af5"},{"t":"A cut, then NHEJ, likely disrupting the gene","why":"No template means no HDR.","_n":"39def","_k":"eb310ec1"},{"t":"A precise correction","why":"No template means no HDR. NHEJ joins the ends quickly and often adds or loses a few bases. That’s why it’s used to knock genes out.","_n":"3addf","_k":"9afd2323"},{"t":"The gene is removed completely","why":"NHEJ usually changes only a few bases.","_n":"3bdcf","_k":"d8670167"}]},"b":{"prompt":"Same guide and PAM, a template is given, and the cells divide. What is the most likely outcome?","options":[{"t":"NHEJ only","why":"With a template in dividing cells, HDR can copy it for a precise change.","_n":"3cddf","_k":"e241da21"},{"t":"Cas9 inserts the template","why":"The cell copies the template during HDR.","_n":"3ddaf","_k":"ce94a2fb"},{"t":"A cut, then HDR copying the template: a precise change","why":"With a template in dividing cells, HDR copies the template.","_n":"3edbf","_k":"dbeb140e"},{"t":"No cut","why":"A perfect match beside a PAM is cut.","_n":"3fe0f","_k":"bd3407a7"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Guide P matches the target 20/20 and another gene 19/20 (both with PAMs). Guide Q matches the target 20/20 and nothing else above 10/20. Which is the better choice, and why?","options":[{"t":"P, because it matches more sites","why":"A near-match elsewhere can still be cut. Scientists choose guides with no close matches anywhere else.","_n":"3ge1f","_k":"40dd9283"},{"t":"Q, because P risks an off-target cut in the other gene","why":"19 of 20 beside a PAM can be cut, so P risks changing the other gene.","_n":"3hdef","_k":"cad38a60"},{"t":"Neither; Cas9 ignores guides","why":"The guide RNA finds the target by base pairing. Cas9 is the enzyme that cuts once the guide has matched.","_n":"3idff","_k":"03eea699"},{"t":"Either; matches below 20/20 are never cut","why":"A near-match elsewhere can still be cut. Scientists choose guides with no close matches anywhere else.","_n":"3jd4f","_k":"3507671c"}]},"b":{"prompt":"A guide cuts its target and, unexpectedly, a second gene. What best explains this?","options":[{"t":"The second gene has a near-match beside a PAM","why":"A near-match elsewhere can still be cut. Scientists choose guides with no close matches anywhere else.","_n":"3kd5f","_k":"176b5faf"},{"t":"Cas9 cuts randomly","why":"Cuts follow the guide.","_n":"3l62f","_k":"4f5ef46a"},{"t":"The template inserted itself there","why":"Cas9 only cuts. The cell’s own repair decides what ends up in the gap.","_n":"3m61f","_k":"4e51b874"},{"t":"The PAM moved","why":"The PAM is a fixed short sequence in the DNA.","_n":"3n64f","_k":"5e5f8836"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"A bacterium carries a spacer from virus V. Virus V and virus W both infect it. Which is destroyed?","options":[{"t":"Only virus V","why":"Only V’s DNA matches the guide.","_n":"3o63f","_k":"d7dc3f87"},{"t":"Only virus W","why":"W doesn’t match.","_n":"3p5ef","_k":"98be3d6c"},{"t":"Neither","why":"This is exactly what the system evolved to do. Bacteria evolved it to fight viruses. Scientists adapted a natural system.","_n":"3q5df","_k":"c2a3fe48"},{"t":"Both","why":"Cutting needs a match.","_n":"3r60f","_k":"f5769e36"}]},"b":{"prompt":"Virus V’s DNA changes so it no longer matches the bacterium’s spacer. What happens on the next infection?","options":[{"t":"The spacer changes itself to match","why":"Spacers are added only after a new infection is survived.","_n":"3s5ff","_k":"7be8b7b4"},{"t":"The bacterium makes a new PAM","why":"PAMs belong to the target DNA.","_n":"3t5af","_k":"2289f8dc"},{"t":"V escapes, because the guide no longer matches","why":"No match, no cut.","_n":"3u59f","_k":"65182e02"},{"t":"V is still destroyed","why":"Cutting needs a guide match beside a PAM.","_n":"3v58e","_k":"10cca0d2"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the clearest explanation of why germline editing is debated more than somatic editing?","options":[{"t":"“Germline cells have no DNA.”","why":"They do.","_n":"3w59e","_k":"f56612ee"},{"t":"“Somatic editing is always safe.”","why":"No editing is risk-free.","_n":"3x5ae","_k":"ba75c909"},{"t":"“Germline editing uses a different enzyme.”","why":"Both use the same tools; what differs is which cells are edited.","_n":"3y5be","_k":"cb547e0b"},{"t":"“Germline changes pass to future generations, who can’t consent; somatic changes affect only the treated person.”","why":"Inheritance and consent are the key differences.","_n":"3z5ce","_k":"cdab7272"}]},"b":{"prompt":"Which sentence correctly describes a blood stem cell therapy?","options":[{"t":"“It’s germline because blood reaches every organ.”","why":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"405de","_k":"64cbc8ad"},{"t":"“It’s somatic: the edited cells make blood, and eggs and sperm are unchanged.”","why":"Blood stem cells are somatic.","_n":"415ee","_k":"38f7f17e"},{"t":"“It isn’t editing because the cells are outside the body.”","why":"It is.","_n":"425fe","_k":"be737619"},{"t":"“It’s germline because the edit is permanent.”","why":"Permanent ≠ inherited. Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"4350e","_k":"409bdd8a"}]}},{"id":"c2","cat":"C","goal":[1,3],"a":{"prompt":"Which best explains why NHEJ “knocks out” a gene?","options":[{"t":"“Joining the ends often adds or loses a few bases, shifting the reading frame, so the protein doesn’t work.”","why":"NHEJ joins the ends quickly and often adds or loses a few bases. That’s why it’s used to knock genes out.","_n":"4451e","_k":"a0569553"},{"t":"“NHEJ removes the whole chromosome.”","why":"Only a few bases change.","_n":"455ee","_k":"ae852d5d"},{"t":"“Cas9 writes a stop signal.”","why":"Cas9 only cuts. The cell’s own repair decides what ends up in the gap.","_n":"465de","_k":"9225f5b3"},{"t":"“The guide stays stuck in the gene.”","why":"The guide leaves.","_n":"475ce","_k":"a92e68dd"}]},"b":{"prompt":"Which best explains why HDR can make a precise change?","options":[{"t":"“The cell copies the supplied template, which carries the exact change wanted.”","why":"HDR copies the template.","_n":"485be","_k":"79624a04"},{"t":"“The PAM guides the new bases.”","why":"The PAM only lets Cas9 cut; the template supplies the change.","_n":"4962e","_k":"cdfb8577"},{"t":"“HDR deletes the gene.”","why":"It copies; it doesn’t delete.","_n":"4a61e","_k":"e8cd27cc"},{"t":"“Cas9 checks its own work.”","why":"Cas9 only cuts. The cell’s own repair decides what ends up in the gap.","_n":"4b60e","_k":"ba7b479e"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A breeder wants a crop plant that no longer makes an enzyme that causes browning. Which plan fits?","options":[{"t":"Cut inside the enzyme’s gene and let NHEJ disrupt it (no template)","why":"A knockout needs only a cut and NHEJ.","_n":"4c5fe","_k":"80ceb243"},{"t":"Supply a template with a new gene","why":"That adds DNA; a knockout doesn’t need it.","_n":"4d56e","_k":"57aa3af7"},{"t":"Edit the plant’s pollen only","why":"The goal is the plant itself.","_n":"4e55e","_k":"f0eb01dd"},{"t":"Edit only the PAM","why":"Changing the PAM would stop Cas9 cutting there, not knock out the gene.","_n":"4f64f","_k":"0107a16b"}]},"b":{"prompt":"Researchers want to replace a faulty version of a gene with a working version in dividing cells grown in a dish. Which plan fits?","options":[{"t":"Use a guide with no PAM nearby","why":"No PAM, no cut. Cas9 checks for the PAM before it opens the DNA.","_n":"4g65f","_k":"9b743907"},{"t":"Use non-dividing cells","why":"HDR needs dividing cells.","_n":"4h62f","_k":"395f6ee3"},{"t":"Cut with no template","why":"That gives a knockout.","_n":"4i63f","_k":"0250ff17"},{"t":"Cut near the fault and supply a template carrying the working version (HDR)","why":"HDR copies the template in dividing cells.","_n":"4j60f","_k":"c0e9f2d0"}]}},{"id":"a2","cat":"A","goal":[5,6],"a":{"prompt":"Which proposal would Canada’s Assisted Human Reproduction Act prohibit?","options":[{"t":"Editing a patient’s blood stem cells","why":"That’s somatic.","_n":"4k61f","_k":"3737a317"},{"t":"Editing research mice","why":"Not covered by this Act.","_n":"4l5ef","_k":"2941264d"},{"t":"Editing a crop","why":"That falls under food and plant regulators, not this Act.","_n":"4m5ff","_k":"634054f3"},{"t":"Editing an embryo so the change could be passed to descendants","why":"That would be a heritable change to the human genome.","_n":"4n5cf","_k":"ea262d8a"}]},"b":{"prompt":"Which proposal is somatic and so not a heritable change?","options":[{"t":"Editing a patient’s own liver cells","why":"Liver cells are somatic: the edit isn’t passed to children.","_n":"4o5df","_k":"82cf9f14"},{"t":"Editing sperm-producing stem cells","why":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"4pcaf","_k":"7d510ec7"},{"t":"Editing an embryo for implantation","why":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"4qc9f","_k":"f2140f5a"},{"t":"Editing an egg cell","why":"Only changes in eggs, sperm or embryos can pass to children. A patient’s blood cells are somatic.","_n":"4rccf","_k":"53a30b73"}]}}]},"task":{"title":"Plan an edit","summary":"Plan an edit","statement":"\u003cp>Plan a gene edit that does exactly what you intend. There’s more than one good plan.\u003c/p>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"cr-tbl cr-cards\">\u003ccaption class=\"tiny\">Target site cards\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Site\u003c/th>\u003cth scope=\"col\">PAM next to it?\u003c/th>\u003cth scope=\"col\">Other perfect or near matches in genome?\u003c/th>\u003cth scope=\"col\">Location\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">S1\u003c/th>\u003ctd data-h=\"PAM\">yes\u003c/td>\u003ctd data-h=\"Other matches\">none\u003c/td>\u003ctd data-h=\"Location\">inside the gene of interest\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">S2\u003c/th>\u003ctd data-h=\"PAM\">no\u003c/td>\u003ctd data-h=\"Other matches\">none\u003c/td>\u003ctd data-h=\"Locatio
