.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 01: leaf drawings (S1 diagram explorer), habitat cards, label quiz, investigations, desert-leaf task, hero */
/* radio groups (from MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* S1 diagram explorer */
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs,.s1-tags{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1px dashed transparent;border-radius:5px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}
.s1-b[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--hi-soft)}
.s1-b.good{border:2px solid var(--green)}
.s1-tag{position:absolute;transform:translate(0,-50%);font:700 .72rem/1.3 var(--font-ui);background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.05em .55em;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.s1-tag.r{transform:translate(-100%,-50%)}
.s1-tag.c{transform:translate(-50%,-50%)}
.s1-tag.lf-ctag{border-color:var(--ink-2);font-weight:600}
.s1-tag.lf-ltag{border-color:var(--ink-2);font-weight:600}

/* leaf tissue: --leaf fills 20 %, edges 70 % (course plan §3); clear cells outlined in ink-2 */
.lf-air{fill:var(--paper)}
.lf-cut{fill:var(--rule);stroke:var(--ink-2);stroke-width:.8}
.lf-wax{stroke-width:1.2}
.lf-epi{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.lf-tis{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:1.2}
.lf-chl{fill:var(--leaf);opacity:.85}
.lf-faint{opacity:.45}
.lf-chamber{fill:none;stroke:var(--ink-2);stroke-width:.8;stroke-dasharray:3 3;opacity:.7}
.lf-vein-in{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1}
.lf-sheath{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1}
.lf-xy{fill:var(--sheet);stroke:var(--ink);stroke-width:2.2}
.lf-xy.m{stroke-width:1.4}
.lf-ph{fill:var(--sheet);stroke:var(--ink);stroke-width:1}
.lf-pore{fill:transparent}
.lf-guard{stroke-width:1.4}
.lf-blade{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:2;stroke-linejoin:round}
.lf-vein{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;fill:none}
.lf-petiole{stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.lf-cutline{stroke:var(--ink);stroke-width:2;stroke-dasharray:7 5}
.lf-txt{font:600 12px var(--font-ui);fill:var(--ink)}
.lf-wall{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:7}
.lf-mem{fill:none;stroke:var(--leaf-edge);stroke-width:1}
.lf-vac{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.2}
.lf-nuc{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.2}
.lf-nucl{fill:var(--ink-2)}
.lf-gran{stroke:var(--sheet);stroke-width:1;opacity:.8}
.lf-pit{fill:var(--paper);stroke:none}
.lf-gsm{fill:var(--leaf);stroke:var(--leaf-edge);stroke-width:.6}
.lf-hair{fill:none;stroke:var(--ink-2);stroke-width:1}
.lf-kranz{fill:var(--leaf);fill-opacity:.75;stroke:var(--leaf-edge);stroke-width:.6}
/* light beams (photons: ink wavy arrows), gas tokens, direction arrows */
.lf-beam{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.lf-beam-h{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lf-refl{stroke-dasharray:3 3}
.lf-tok text{font:700 8.5px var(--font-ui);fill:var(--sheet)}
.lf-dir{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
.lf-dir-s{stroke-width:3;opacity:.8}

/* explorer layout */
.lf-pg .pg-ctrl{display:grid;gap:10px}
.lf-row{margin:0}
.lf-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.lf-panel[hidden]{display:none}
.lf-sl{margin:0}
.lf-sl input{width:100%;accent-color:var(--ink)}
.lf-note{margin:0}
.lf-cap{margin:8px 0 0;font-size:.9rem;color:var(--ink-2);min-height:1.4em}
.lf-trail{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px;padding:8px 10px;border:1.5px dashed var(--rule);border-radius:8px}
.lf-trail-p{margin:0;flex:1 1 220px;font-size:.92rem}
.lf-trail-lab{font-weight:700;color:var(--ink-2)}
.lf-step{display:inline-block;font-weight:700}
.lf-arr{margin:0 .3em;color:var(--ink-2)}
.lf-trail-btns{display:flex;gap:6px;flex-wrap:wrap}
.lf-meter{display:grid;gap:4px;margin-top:10px}
.lf-meter-l{font-size:.85rem;font-weight:700;color:var(--ink-2)}
.lf-meter-t{position:relative;display:block;height:12px;border:1.5px solid var(--ink-2);border-radius:999px;overflow:hidden;background:var(--paper)}
.lf-meter-t i{display:block;height:100%;background:var(--ink-2)}
.lf-aim{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.lf-bars{display:grid;gap:4px;margin-top:4px}
.lf-bar{display:grid;grid-template-columns:8.5em minmax(0,1fr) 2.6em;align-items:center;gap:6px;font-size:.85rem}
.lf-bar.on{font-weight:700}
.lf-bar-t{display:block;height:10px;background:var(--paper);border-radius:3px;overflow:hidden}
.lf-bar-t i{display:block;height:100%;background:var(--ink-2)}
.lf-bar.on .lf-bar-t i{background:var(--ink)}
.lf-bar-v{text-align:right;font-variant-numeric:tabular-nums}
.lf-unit{font-size:.95rem;color:var(--ink-2)}

/* Part 3: habitat cards */
.lfh-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lfh-card{border:1.5px solid var(--rule);border-radius:8px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.lfh-pick{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:6px;color:var(--ink)}
.lfh-pick svg{width:100%;height:auto;display:block}
.lfh-pick[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.lfh-pick:not(:disabled):hover{border-color:var(--pen)}
.lfh-pick.done{border-color:var(--green);background:var(--good-bg)}
.lfh-pick:disabled{color:var(--ink)}
.lfh-name{font-weight:700}
.lfh-res p{margin:0;font-size:.88rem}
.lfh-data{margin-top:0;padding:6px 10px}
.lfh-data summary{font-size:.9rem}
.lfh-mnote{margin:8px 0 6px}
.lfh-dl{margin:0;display:grid;gap:4px;font-size:.85rem}
.lfh-dl div{display:grid;gap:0}
.lfh-dl dt{color:var(--ink-2);font-weight:700}
.lfh-dl dd{margin:0}
.lfh-h{margin:14px 0 8px}
.lfh-habs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lfh-hab{border:2px dashed var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.55em .7em;text-align:left;min-height:44px}
.lfh-hab.ready{border-color:var(--ink-2)}
.lfh-hab:not(:disabled):hover{border-color:var(--pen);border-style:solid}
.lfh-hab.done{border-style:solid;border-color:var(--green);background:var(--good-bg);opacity:.85}
#lfh-fb{margin-top:10px}

/* Practice: label quiz, task */
.lq-labs{margin:0 0 10px}
.lq-dx{margin-top:10px;max-width:640px}
.dl-inputs{display:grid;gap:10px;margin:12px 0}
.dl-pv svg{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.dl-models{margin-top:10px}
.dl-models p{margin:6px 0 0}

/* hero */
.lf-hero{position:relative;width:100%;aspect-ratio:560/320}
.lf-hero svg,.lf-h-xs{position:absolute;inset:0;width:100%;height:100%;display:block}
.lf-h-leaf{transform-origin:50% 45%}
.lf-h-xs{transform-origin:50% 0}
.lf-h-txt{font:700 17px var(--font-ui);fill:var(--ink)}
.lf-lead{fill:none;stroke:var(--ink-2);stroke-width:1.2}

@media (max-width:820px){
  .lfh-cards,.lfh-habs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .lf-bar{grid-template-columns:7.5em minmax(0,1fr) 2.4em}
  .lf-pg .rg.seg button{padding:.4em .55em;font-size:.86rem}
}

</style>
</head>

<script>window.MV_PAYLOAD={"meta":{"id":"01-leaf-structure","nn":"01","slug":"leaf-structure","course":"sbi4u","site":"sbi4u","code":"SBI4U","kind":"topic","groupLabel":"Unit 1","groupName":"Photosynthesis","trivium":"","size":"S","storageKey":"sbi4u-01-leaf-structure-v1","progressKey":"sbi4u-progress-v1:01-leaf-structure","toolkit":"1.0.5"},"course":{"course":"sbi4u","site":"sbi4u","code":"SBI4U","title":"Biology","modules":[{"nn":"01","slug":"leaf-structure","title":"Leaf Structure","kind":"topic","group":"1"},{"nn":"02","slug":"light-and-pigments","title":"Light and Photosynthetic Pigments","kind":"topic","group":"1"},{"nn":"03","slug":"chlorophyll-and-chloroplasts","title":"Chlorophyll and Chloroplasts","kind":"topic","group":"1"},{"nn":"04","slug":"overview-of-photosynthesis","title":"Overview of Photosynthesis","kind":"topic","group":"1"},{"nn":"05","slug":"noncyclic-electron-flow","title":"Noncyclic Electron Flow","kind":"topic","group":"1"},{"nn":"06","slug":"light-reactions","title":"Light Reactions","kind":"topic","group":"1"},{"nn":"07","slug":"stomata","title":"Stomata Opening and Closing","kind":"topic","group":"1"},{"nn":"08","slug":"the-calvin-cycle","title":"The Calvin Cycle","kind":"topic","group":"1"},{"nn":"09","slug":"c3-c4-cam","title":"C3, C4 and CAM Photosynthesis and Photorespiration","kind":"topic","group":"1"},{"nn":"10","slug":"introduction-to-metabolism","title":"Introduction to Metabolism","kind":"topic","group":"2"},{"nn":"11","slug":"redox-reactions","title":"Redox Reactions","kind":"topic","group":"2"},{"nn":"12","slug":"nad-and-fad","title":"NAD⁺ and FAD","kind":"topic","group":"2"},{"nn":"13","slug":"overview-of-cellular-respiration","title":"Overview of Cellular Respiration","kind":"topic","group":"2"},{"nn":"14","slug":"glycolysis","title":"Glycolysis","kind":"topic","group":"2"},{"nn":"15","slug":"krebs-cycle","title":"Krebs Cycle","kind":"topic","group":"2"},{"nn":"16","slug":"electron-transport-chain","title":"The Electron Transport Chain","kind":"topic","group":"2"},{"nn":"17","slug":"chemiosmosis","title":"Chemiosmosis","kind":"topic","group":"2"},{"nn":"18","slug":"energy-transfer","title":"Energy Transfer","kind":"topic","group":"2"},{"nn":"19","slug":"atp-count","title":"Cellular Respiration ATP Count","kind":"topic","group":"2"},{"nn":"20","slug":"fermentation","title":"Alternate Pathways (Fermentation)","kind":"topic","group":"2"},{"nn":"21","slug":"dna-structure-and-replication","title":"Structure and Replication","kind":"topic","group":"3"},{"nn":"22","slug":"dna-direction-of-construction","title":"DNA Direction of Construction","kind":"topic","group":"3"},{"nn":"23","slug":"transcription","title":"Transcription","kind":"topic","group":"3"},{"nn":"24","slug":"trna","title":"tRNA","kind":"topic","group":"3"},{"nn":"25","slug":"overview-of-protein-synthesis","title":"Overview of Protein Synthesis","kind":"topic","group":"3"},{"nn":"26","slug":"the-lac-operon","title":"The lac Operon","kind":"topic","group":"3"},{"nn":"27","slug":"regulation-of-gene-expression","title":"Regulation of Gene Expression","kind":"topic","group":"3"},{"nn":"28","slug":"mutations","title":"Mutations","kind":"topic","group":"3"},{"nn":"29","slug":"biotechnology","title":"Biotechnology","kind":"topic","group":"3"},{"nn":"30","slug":"pcr","title":"PCR (Polymerase Chain Reaction)","kind":"topic","group":"3"},{"nn":"31","slug":"crispr","title":"CRISPR Gene Editing","kind":"topic","group":"3"},{"nn":"32","slug":"gel-electrophoresis","title":"Gel Electrophoresis","kind":"topic","group":"3"},{"nn":"33","slug":"restriction-enzymes-and-recombinant-dna","title":"Restriction Enzymes and Recombinant DNA","kind":"topic","group":"3"},{"nn":"34","slug":"homeostasis","title":"Homeostasis","kind":"topic","group":"4"},{"nn":"35","slug":"thermoregulation","title":"Thermoregulation","kind":"topic","group":"4"},{"nn":"36","slug":"urinary-system","title":"The Urinary System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"dc0635ad","content":{"id":"01-leaf-structure","kind":"topic","title":"Leaf structure","topic":"Leaf Structure","readyTopic":"leaf structure","hero":{"headline":"A leaf is a solar panel that breathes","text":"Every layer of a leaf has a job. The \u003cstrong>palisade mesophyll\u003c/strong> catches light, the \u003cstrong>spongy mesophyll\u003c/strong> lets gases spread, \u003cstrong>veins\u003c/strong> bring water and carry sugar away, and \u003cstrong>stomata\u003c/strong> let CO₂ in. But every open stoma also lets water out, so a leaf is always balancing the two.","fig":{"html":"\u003cdiv class=\"lf-hero\" id=\"lf-hero\" role=\"img\" aria-label=\"A maple leaf is sliced and the cut face turns toward you as a cross-section, labelled top to bottom: cuticle, upper epidermis, palisade mesophyll, spongy mesophyll, lower epidermis with a stoma. Sunlight enters from the top and fades in the palisade layer. CO₂ drifts in through the stoma and spreads through the air spaces; O₂ and water vapour drift out.\">\u003c/div>"}},"goals":["I can identify the tissues in a leaf cross-section and state each one’s job.","I can explain how the palisade and spongy mesophyll are built for catching light and exchanging gases.","I can trace the paths of CO₂, O₂ and water through a leaf, and explain why each gas moves the way it does.","I can explain how stomata, guard cells and the cuticle balance gas exchange against water loss.","I can link leaf features to the habitat a plant lives in."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Plant cells","goal":1,"prompt":"Which organelle carries out photosynthesis?","options":[{"t":"Vacuole","why":"The vacuole stores water and dissolved substances.","_n":"0b07","_k":"8da645d6"},{"t":"Chloroplast","why":"Chloroplasts hold chlorophyll and the enzymes that make sugar.","_n":"1af7","_k":"401536c7"},{"t":"Nucleus","why":"The nucleus holds DNA; it controls the cell but doesn’t make sugar.","_n":"2ae7","_k":"2e4204bc"},{"t":"Mitochondrion","why":"Mitochondria release energy from sugar.","_n":"3ad7","_k":"917c1ff0"}],"hints":["Which organelle is green?","It contains chlorophyll.","The chloroplast."]},{"id":"w2","skill":"Plant cells","goal":1,"prompt":"Which structure do plant cells have that animal cells don’t?","options":[{"t":"A cellulose cell wall","why":"Plant cells have a cell wall outside the membrane.","_n":"4ac7","_k":"32d1930b"},{"t":"Mitochondria","why":"Plant cells have mitochondria too; they respire all the time.","_n":"5ab7","_k":"c07ecd54"},{"t":"Ribosomes","why":"Every cell makes proteins on ribosomes.","_n":"6aa7","_k":"fbbe48dc"},{"t":"A cell membrane","why":"All cells have a membrane.","_n":"7b97","_k":"a6440448"}],"hints":["Which structure is rigid and lies outside the membrane?","It’s made of cellulose.","The cell wall."]},{"id":"w3","skill":"Diffusion","goal":3,"prompt":"In diffusion, particles move overall…","options":[{"t":"from higher concentration to lower concentration","why":"Random motion spreads particles out until they’re even.","_n":"8b87","_k":"f1314329"},{"t":"only when the cell spends ATP","why":"Diffusion is passive: no energy needed.","_n":"957b","_k":"0edc9d6a"},{"t":"only through water, never through air","why":"Gases diffuse through air, even faster than through water.","_n":"a58b","_k":"e71d1ea1"},{"t":"from lower to higher concentration","why":"Moving against a gradient needs energy and a pump.","_n":"b55b","_k":"cf6246f7"}],"hints":["Think of a smell spreading across a room.","Where there are many particles, more move away.","High to low concentration."]},{"id":"w4","skill":"Diffusion","goal":3,"prompt":"In bright light, the air outside a leaf has more CO₂ than the air spaces inside it. Which way does CO₂ move through an open stoma?","options":[{"t":"Into the leaf","why":"From higher (outside) to lower (inside).","_n":"c56b","_k":"3bf72226"},{"t":"Out of the leaf","why":"Out would be from lower to higher.","_n":"d5bb","_k":"ec01a7de"},{"t":"Neither way, because CO₂ is a small part of air","why":"Even a small difference drives diffusion.","_n":"e5cb","_k":"bded3f22"},{"t":"Into the leaf, but only if the guard cells pump it","why":"Guard cells open the pore; diffusion does the moving.","_n":"f59b","_k":"479b4b1f"}],"hints":["Where is the CO₂ concentration higher?","Outside.","So it diffuses in."]},{"id":"w5","skill":"Photosynthesis basics","goal":3,"prompt":"Which word equation describes photosynthesis?","options":[{"t":"carbon dioxide + water → glucose + oxygen","why":"Light energy, captured by chlorophyll, drives it.","_n":"g5ab","_k":"1871d129"},{"t":"glucose + oxygen → carbon dioxide + water","why":"That’s cellular respiration. It’s the reverse.","_n":"h5fb","_k":"d4e00ebe"},{"t":"water + oxygen → glucose + carbon dioxide","why":"CO₂ is taken in, not given off.","_n":"i60b","_k":"b4fae708"},{"t":"carbon dioxide + oxygen → glucose + water","why":"Oxygen is a product, not a reactant.","_n":"j71b","_k":"e192acd5"}],"hints":["What does a plant take in from the air?","CO₂ in; O₂ out.","CO₂ + water → glucose + oxygen."]},{"id":"w6","skill":"Photosynthesis basics","goal":3,"prompt":"Where does the water used in photosynthesis come from?","options":[{"t":"The soil, through the roots and up the xylem","why":"Water is pulled up from the roots.","_n":"k70b","_k":"cadb7d6a"},{"t":"The air, through the stomata","why":"Stomata let water vapour \u003cstrong>out\u003c/strong>; almost none comes in.","_n":"l6fb","_k":"45518613"},{"t":"Respiration inside the leaf","why":"Respiration makes a little water, far too little to supply photosynthesis.","_n":"m6eb","_k":"43871425"},{"t":"The phloem","why":"Phloem carries sugar.","_n":"n6db","_k":"d47cb873"}],"hints":["Which tissue carries water up a plant?","Xylem, from the roots.","Soil → roots → xylem."]}],"refreshers":{"Plant cells":"Plant cells have a cell wall, a large central vacuole and (in green parts) chloroplasts, as well as everything an animal cell has, including mitochondria.","Diffusion":"Particles spread from higher to lower concentration without any energy input. Example: CO₂ moves into a leaf because photosynthesis keeps the inside concentration low.","Photosynthesis basics":"carbon dioxide + water → glucose + oxygen, powered by light absorbed by chlorophyll. Water comes from the roots; CO₂ comes from the air."}}},"explore":{"heading":"Leaf cross-section explorer","intro":"Zoom into a leaf and tap each layer to see its job. Then switch on the gas and light views to watch what moves where.","darkNote":"In this model the stomata can stay open in the dark “for the experiment”. Most real plants close them at night (module 07 explains why).","lightNote":"Model values: of 100 units of light reaching the leaf, 8 are reflected, 62 are absorbed in the palisade, 22 in the spongy mesophyll, and 8 pass through.","hotspots":{"vein":{"name":"Vein","job":"Veins bring water in (xylem) and carry sugar away (phloem).","chl":"None","where":"Lines running through the leaf"},"cuticle":{"name":"Cuticle","job":"Clear, waxy, waterproof coating on the epidermis; cuts water loss.","chl":"None","where":"Thin coat on the very top surface"},"upper":{"name":"Upper epidermis","job":"One layer of clear cells (no chloroplasts, except guard cells) that protects the leaf.","chl":"None","where":"Top row of clear cells"},"palisade":{"name":"Palisade mesophyll","job":"Tall, tightly packed cells under the upper epidermis; most chloroplasts; absorbs most light.","chl":"Many","where":"Tall, tightly packed green cells"},"spongy":{"name":"Spongy mesophyll","job":"Loosely packed cells with air spaces: gases spread to every cell.","chl":"Some","where":"Loose, rounded green cells"},"air":{"name":"Air space","job":"Gas-filled space where CO₂, O₂ and water vapour diffuse.","chl":"None","where":"Large gap just above the pore"},"xylem":{"name":"Xylem","job":"Carries water and minerals up from the roots.","chl":"None","where":"Large thick-walled tubes, upper side of the vein"},"phloem":{"name":"Phloem","job":"Carries sugars from the leaf to the rest of the plant.","chl":"None","where":"Small cells, lower side of the vein"},"lower":{"name":"Lower epidermis","job":"One layer of clear cells (no chloroplasts, except guard cells) that protects the leaf.","chl":"None","where":"Bottom row of clear cells"},"stoma":{"name":"Stoma","job":"A pore, mostly in the lower epidermis, for CO₂ in and O₂ and water vapour out.","chl":"None","where":"Gap in the bottom surface"},"guard":{"name":"Guard cell","job":"The pair of cells around a stoma; they open and close it (module 07).","chl":"Yes","where":"Curved green cell beside the gap"},"wall":{"name":"Cell wall","job":"A rigid cellulose layer outside the membrane that supports the cell.","chl":"Not in the wall (this palisade cell has many)","where":"Outer edge of the cell"},"chloro":{"name":"Chloroplast","job":"Holds chlorophyll and the enzymes that make sugar.","chl":"This is one (this palisade cell has many)","where":"Small green bodies along the cell wall"},"vacuole":{"name":"Vacuole","job":"Stores water and dissolved substances.","chl":"Not in the vacuole (this palisade cell has many)","where":"Large space in the middle of the cell"},"nucleus":{"name":"Nucleus","job":"Holds DNA; it controls the cell but doesn’t make sugar.","chl":"Not in the nucleus (this palisade cell has many)","where":"Round body near the side of the cell"}},"predictions":[{"id":"p1","start":{"mode":"gas","gas":"o2","light":"on","open":50},"prompt":"Which way will O₂ move through the stoma?","options":[{"t":"It won’t move","_n":"o6cb","_k":"b60a4861"},{"t":"In and out equally","_n":"p6bb","_k":"d5798c5b"},{"t":"Out of the leaf","_n":"q6ab","_k":"da3c00f2"},{"t":"Into the leaf","_n":"r69b","_k":"de7854e6"}],"explain":"Photosynthesis makes O₂ inside, so the concentration inside is higher than outside."},{"id":"p2","start":{"mode":"gas","gas":"co2","light":"off","open":50},"prompt":"In the dark with the stomata open, which way will CO₂ move?","options":[{"t":"Into the leaf, then it’s stored","_n":"s68b","_k":"617c6a22"},{"t":"Out of the leaf","_n":"tebb","_k":"7303b471"},{"t":"Into the leaf","_n":"uecb","_k":"9e33d882"},{"t":"It won’t move","_n":"vedb","_k":"1da83786"}],"explain":"Cells respire day and night. With no photosynthesis to use the CO₂, it builds up inside and diffuses out."},{"id":"p3","start":{"mode":"gas","gas":"co2","light":"on","open":0},"prompt":"What happens to the CO₂ level in the air spaces over the next minute?","options":[{"t":"It falls, and photosynthesis slows","_n":"weeb","_k":"2ebfee2d"},{"t":"CO₂ starts entering through the cuticle","_n":"xe7b","_k":"bbdcc1fb"},{"t":"It rises","_n":"ye8b","_k":"125b9a89"},{"t":"It stays the same","_n":"ze9b","_k":"5038c173"}],"explain":"Photosynthesis keeps using CO₂, and none can get in."},{"id":"p4","start":{"mode":"light","intensity":100},"prompt":"Which layer absorbs the most light?","options":[{"t":"Cuticle","_n":"10eab","_k":"f6d98764"},{"t":"Spongy mesophyll","_n":"11e3b","_k":"a5b7bc17"},{"t":"Upper epidermis","_n":"12e4b","_k":"8231f91b"},{"t":"Palisade mesophyll","_n":"13e5b","_k":"baa73374"}],"explain":"The cuticle and epidermis are clear. The palisade cells, packed with chloroplasts, are the first green layer the light meets."}],"chalIntro":"Use the explorer to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Your taps on the diagram are listed under it; use \u003cstrong>Clear taps\u003c/strong> to start again. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Tap every structure whose cells contain chloroplasts, then press Check.","why":"Palisade cells, spongy cells and guard cells contain chloroplasts. The cuticle, the other epidermis cells and the vein cells don’t.","general":"Check each structure you tapped against the “Chloroplasts?” row in the readout.","hints":["Which layers look green in the cross-section?","Both mesophyll layers, plus one kind of epidermis cell.","Palisade, spongy and guard cells."]},{"id":"tc2","goal":3,"prompt":"Trace a CO₂ molecule from the outside air to a chloroplast in a palisade cell. Tap the structures in order.","why":"Stoma → air space → palisade cell → chloroplast: CO₂ diffuses in through the pore, spreads through the air spaces and is used in the chloroplasts.","general":"Start where CO₂ gets into the leaf, then follow it to where it’s used. Press Clear taps to start again.","hints":["Where are the pores?","After the pore, the CO₂ is in a large gas-filled space.","Stoma → air space → palisade cell → chloroplast."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Make the leaf release O₂ to the air while losing as little water as possible.","why":"Light on and stomata at 25%: O₂ is made and diffuses out, and water loss stays Low.","hints":["O₂ and water vapour leave through the same pores.","You need the pores open a little and O₂ being made.","Light on, stomata at the smallest opening above 0%: 25%."]}]},"part3":{"slug":"adaptations","name":"Habitats","heading":"Leaves built for their habitat","intro":"Six leaves from six habitats. Tap a leaf card, then tap the habitat it fits. Open \u003cstrong>Check it with data\u003c/strong> on any card to read its numbers.","cards":[{"id":"A","_a":"RhBFWBE=","why":"The same tree builds different leaves. Strong light can be used by two palisade layers. In shade, a thin, wide leaf catches more of the little light there is.","rows":[["Leaf thickness","0.25 mm"],["Palisade layers","2"],["Stomata per mm² (upper / lower)","0 / 250"],["Cuticle","Medium"],["Other features","—"]],"draw":{"t":0.25,"pal":2,"up":0,"low":250,"cut":2}},{"id":"B","_a":"RhBYV1dQQw==","why":"The same tree builds different leaves. Strong light can be used by two palisade layers. In shade, a thin, wide leaf catches more of the little light there is.","rows":[["Leaf thickness","0.12 mm"],["Palisade layers","1"],["Stomata per mm² (upper / lower)","0 / 150"],["Cuticle","Thin"],["Other features","Larger, thinner blade"]],"draw":{"t":0.12,"pal":1,"up":0,"low":150,"cut":1}},{"id":"C","_a":"RgdVRVZHFUY=","why":"A thick cuticle, sunken stomata and hairs trap still, humid air near the pores, so less water escapes.","rows":[["Leaf thickness","0.50 mm"],["Palisade layers","3"],["Stomata per mm² (upper / lower)","0 / 120"],["Cuticle","Thick"],["Other features","Stomata sunk in pits; hairs"]],"draw":{"t":0.5,"pal":3,"up":0,"low":120,"cut":4,"pits":true,"hairs":true}},{"id":"D","_a":"Rg9ZWkoX","why":"The underside touches water, so stomata are on top, facing the air. Large air spaces keep the leaf afloat.","rows":[["Leaf thickness","0.30 mm"],["Palisade layers","1"],["Stomata per mm² (upper / lower)","400 / 0"],["Cuticle","Thin"],["Other features","Very large air spaces"]],"draw":{"t":0.3,"pal":1,"up":400,"low":0,"cut":1,"bigAir":true}},{"id":"E","_a":"RhBAREZWBEY=","why":"In winter, the ground is frozen, so roots can’t replace lost water. Wax and a small surface area save water.","rows":[["Leaf thickness","Needle, 1 mm across"],["Palisade layers","—"],["Stomata per mm² (upper / lower)","Rows of sunken stomata"],["Cuticle","Very thick wax"],["Other features","Small surface area"]],"draw":{"needle":true}},{"id":"F","_a":"RgBfRF0X","why":"Corn concentrates CO₂ in those vein cells. Module 09 explains why that helps in heat.","rows":[["Leaf thickness","0.20 mm"],["Palisade layers","1"],["Stomata per mm² (upper / lower)","0 / 200"],["Cuticle","Medium"],["Other features","A ring of chloroplast-packed cells around each vein"]],"draw":{"t":0.2,"pal":1,"up":0,"low":200,"cut":2,"kranz":true}}],"habitats":[{"id":"sun","t":"Sunny top of a sugar maple"},{"id":"shade","t":"Shaded lower branch of the same maple"},{"id":"desert","t":"Hot desert shrub"},{"id":"lily","t":"Water lily floating on a pond"},{"id":"spruce","t":"White spruce in the boreal forest"},{"id":"corn","t":"Corn in an Ontario field (a C4 plant: more in module 09)"}],"modelNote":"Rounded model values, not measurements from one real leaf.","wrong":"Compare the card’s data with what that habitat demands: how much light, how much water, and whether the leaf touches air or water. Try another habitat.","quickCheck":{"title":"Quick check","summary":"Habitats quick check","items":[{"id":"q1","goal":5,"prompt":"Why do floating leaves have stomata on the upper surface?","choices":[{"t":"Water lilies don’t need CO₂","fb":"Gas exchange needs air; the underside touches water.","_n":"14e4b","_k":"26cfc899"},{"t":"Light enters from below","fb":"Gas exchange needs air; the underside touches water.","_n":"15e7b","_k":"8c1bd76f"},{"t":"The upper surface is cooler","fb":"Gas exchange needs air; the underside touches water.","_n":"16e6b","_k":"a734c535"},{"t":"The lower surface is against the water","fb":"Gas exchange needs air; the underside touches water.","_n":"17e9b","_k":"587e9bbc"}]},{"id":"q2","goal":5,"prompt":"A thin leaf with one palisade layer most likely grew…","choices":[{"t":"in full sun","fb":"Little light: a thin, wide leaf is cheaper to build and catches what light there is.","_n":"18e8b","_k":"564d9e59"},{"t":"in a desert","fb":"Little light: a thin, wide leaf is cheaper to build and catches what light there is.","_n":"19ebb","_k":"ece26cb2"},{"t":"underwater","fb":"Little light: a thin, wide leaf is cheaper to build and catches what light there is.","_n":"1aeab","_k":"c0ca2365"},{"t":"in shade","fb":"Little light: a thin, wide leaf is cheaper to build and catches what light there is.","_n":"1bddb","_k":"e8b426a3"}]},{"id":"q3","goal":[4,5],"prompt":"Which feature saves water in a desert leaf?","choices":[{"t":"A thinner cuticle","fb":"Pits hold still, humid air over the pore, so less water vapour diffuses out.","_n":"1cdcb","_k":"f0b63086"},{"t":"Larger air spaces","fb":"Pits hold still, humid air over the pore, so less water vapour diffuses out.","_n":"1ddfb","_k":"36f97cb4"},{"t":"Stomata sunk in pits","fb":"Pits hold still, humid air over the pore, so less water vapour diffuses out.","_n":"1ee0b","_k":"c98fe807"},{"t":"More stomata on top","fb":"Pits hold still, humid air over the pore, so less water vapour diffuses out.","_n":"1fddb","_k":"23b193ac"}]},{"id":"q4","goal":5,"prompt":"Why do spruce needles need to save water in winter?","choices":[{"t":"They photosynthesize faster in winter","fb":"Roots can’t take up frozen water, so lost water can’t be replaced.","_n":"1gdeb","_k":"e0b2a3fc"},{"t":"Snow blocks the stomata","fb":"Roots can’t take up frozen water, so lost water can’t be replaced.","_n":"1hdbb","_k":"a080a3bc"},{"t":"Winter air is too humid","fb":"Roots can’t take up frozen water, so lost water can’t be replaced.","_n":"1idcb","_k":"78311494"},{"t":"The soil water is frozen","fb":"Roots can’t take up frozen water, so lost water can’t be replaced.","_n":"1jd9b","_k":"5f26787e"}]}]}},"practice":{"activities":[{"id":"label","type":"custom","title":"Label the leaf","summary":"Label the leaf","goal":[1,3],"instruction":"Tap a label, then tap the structure it names.","how":"","labels":[{"id":"cuticle","t":"cuticle","hints":["Which layer is waxy and waterproof?","It coats the outside of the epidermis.","Tap the thin coat on the very top surface."]},{"id":"upper","t":"upper epidermis","hints":["Which layer is one row of clear cells?","It sits just under the waxy coat on top.","Tap the top row of clear cells."]},{"id":"palisade","t":"palisade mesophyll","hints":["Which cells catch most of the light?","Tall, tightly packed, near the top.","Tap the tall green cells under the upper epidermis."]},{"id":"spongy","t":"spongy mesophyll","hints":["Which cells let gases spread to every cell?","Loose, with air spaces between them.","Tap the loose, rounded green cells below the palisade."]},{"id":"air","t":"air space","hints":["Where do the gases spread inside the leaf?","Look for the large gas-filled gap just inside the pore.","Tap the gap just above the stoma."]},{"id":"xylem","t":"xylem","hints":["Which tissue carries water?","The wider tubes in the vein.","Tap the large tubes on the upper side of the vein."]},{"id":"phloem","t":"phloem","hints":["Which tissue carries sugar?","The smaller cells in the vein.","Tap the small cells on the lower side of the vein."]},{"id":"lower","t":"lower epidermis","hints":["Which row of clear cells has the pores in it?","It’s the bottom surface of the leaf.","Tap the bottom row of clear cells."]},{"id":"stoma","t":"stoma","hints":["Where do gases get in and out?","It’s a gap, not a cell.","Tap the gap between the two curved cells in the bottom surface."]},{"id":"guard","t":"guard cell","hints":["Which cells open and close the pore?","There are two of them, one on each side of the pore.","Tap one of the curved green cells beside the stoma."]}],"pairs":{"phloem|xylem":"Xylem (larger, thick-walled tubes, upper side of the vein) carries water; phloem (smaller cells, lower side) carries sugar.","guard|stoma":"The stoma is the pore; the guard cells are the pair of cells around it.","cuticle|upper":"The cuticle is the waxy coat on top of the epidermis cells.","palisade|spongy":"Palisade: tall, tightly packed, near the top. Spongy: loose, with air spaces."},"wrongDefault":"Read the job of each layer, then try again."},{"id":"investigations","type":"custom","title":"Leaf investigations","summary":"Leaf investigations","star":true,"goal":[2,4,5],"instruction":"Six questions from real-style leaf investigations: counting stomata, planning a fair test and reading results.","items":[{"id":"l1","kind":"num","goal":4,"prompt":"A student counts 30 stomata in a field of view with area 0.12 mm² on the lower surface. What is the stomatal density, in stomata per mm²?","_a":"VlYA","display":"250 stomata per mm²","unit":"stomata per mm²","wrong":[{"match":3.6,"fb":"Divide the count by the area, don’t multiply."}],"hints":["Stomatal density is the number of stomata in each mm².","Divide the count by the area: 30 ÷ 0.12.","30 ÷ 0.12 = 250 stomata per mm²."]},{"id":"l2","kind":"num","goal":4,"prompt":"In the same-sized field of view on the upper surface she counts 6. How many times denser are the stomata underneath?","_a":"UQ==","display":"5 times","unit":"times","wrong":[{"match":24,"fb":"That’s the difference in counts; the question asks for the ratio, 30 ÷ 6."}],"hints":["“How many times” asks for a ratio.","The fields of view are the same size, so compare the counts.","30 ÷ 6 = 5 times denser underneath."]},{"id":"l3","kind":"num","goal":4,"star":true,"prompt":"A leaf’s lower surface has area 4000 mm² and 250 stomata per mm². How many stomata are on it?","_a":"VVMABgMFUQ==","display":"1 000 000 stomata","unit":"stomata","wrong":[{"match":16,"fb":"Multiply density by area: 250 × 4000."}],"hints":["Density tells you how many stomata are in each mm².","There are 4000 mm², each with 250 stomata.","250 × 4000 = 1 000 000 stomata."]},{"id":"l4","kind":"sel","goal":5,"star":true,"prompt":"Comparing stomatal density in sun leaves and shade leaves of one tree: which must be kept the same? Select all.","options":[{"t":"same tree species","why":"","_n":"1kdab","_k":"411e7137"},{"t":"same leaf surface (lower)","why":"","_n":"1le7b","_k":"f8f82559"},{"t":"same field-of-view area","why":"","_n":"1me8b","_k":"28a42977"},{"t":"same number of leaves sampled","why":"","_n":"1nd9b","_k":"614181a2"},{"t":"same position on the tree","why":"Position on the tree \u003cstrong>is\u003c/strong> the independent variable (sun vs shade).","_n":"1od8b","_k":"c510b1e5"},{"t":"same number of stomata counted","why":"The number of stomata counted is the result you’re measuring.","_n":"1pd7b","_k":"72800fbd"}],"why":"Keep everything the same except the variable you’re testing (sun vs shade) and the result you’re measuring (the stomata count).","hints":["Which variable are you changing on purpose, and which are you measuring?","Sun vs shade is the independent variable; the stomata count is the result. Everything else stays the same.","Keep the same: tree species, leaf surface (lower), field-of-view area and number of leaves sampled."]},{"id":"l5","kind":"num","goal":4,"star":true,"prompt":"Four identical leaves were sealed with petroleum jelly and hung for 3 days. Mass lost: no jelly 2.4 g; upper surface coated 2.0 g; lower surface coated 0.6 g; both surfaces coated 0.2 g. About how much water left through the lower surface’s stomata?","_a":"VU0I","tol":0.001,"display":"1.8 g","unit":"g","wrong":[{"match":2,"fb":"That leaf still lost water through its open lower surface. Compare uncoated (2.4 g) with lower-coated (0.6 g)."},{"match":0.4,"fb":"That’s the upper surface’s share."}],"hints":["Coating a surface blocks its stomata.","The lower-coated leaf lost water only through the upper surface and the cuticle.","2.4 − 0.6 = 1.8 g through the lower surface."]},{"id":"l6","kind":"mc","goal":[2,4],"star":true,"prompt":"Ground-level ozone damages mesophyll cells, and it enters through stomata. On which afternoon would a bean crop take in the most ozone, if the ozone level is the same?","options":[{"t":"dark, stomata closed","why":"Ozone uses the same doors as CO₂. Wider stomata let more in, which is why air quality matters to farmers.","_n":"1qd6b","_k":"cf27e295"},{"t":"humid and bright, stomata wide open","why":"Ozone uses the same doors as CO₂. Wider stomata let more in, which is why air quality matters to farmers.","_n":"1rddb","_k":"445c3d93"},{"t":"hot and dry, stomata half-closed","why":"Ozone uses the same doors as CO₂. Wider stomata let more in, which is why air quality matters to farmers.","_n":"1sdcb","_k":"17b9b036"},{"t":"cloudy after a drought, stomata nearly shut","why":"Ozone uses the same doors as CO₂. Wider stomata let more in, which is why air quality matters to farmers.","_n":"1tdbb","_k":"00ac8348"}],"hints":["How does ozone get inside the leaf?","Through open stomata.","Most open stomata: most ozone."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Abigail","how":"","instruction":"Abigail made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Explain how CO₂ reaches a palisade cell.","steps":["CO₂ enters the leaf through stomata on the lower surface.","Guard cells pump it through the air spaces of the spongy mesophyll.","It dissolves in the moist cell walls of the palisade cells.","It diffuses into the chloroplasts."],"_a":"VQ==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is fine. The mistake is earlier.","Step 4 is fine."],"fixes":[{"t":"It’s carried in the phloem.","why":"Xylem brings water and minerals up from the roots; phloem carries sugars away from the leaf.","_n":"1udab","_k":"cf0a52ba"},{"t":"It diffuses through the air spaces, from higher to lower concentration.","why":"Diffusion carries the CO₂ through the air spaces.","_n":"1ve1b","_k":"a9635149"},{"t":"It travels up through the xylem.","why":"Veins carry liquids, not CO₂ from the air.","_n":"1we0b","_k":"d6e4d20a"},{"t":"Step 2 is correct.","why":"Guard cells only open and close the pore; diffusion moves the gas.","_n":"1x53a","_k":"a262ea13"}],"hints":["Do guard cells move gas?","They change the size of the pore.","Diffusion carries the CO₂ through the air spaces."]},{"id":"e2","goal":4,"task":"Explain why most tree leaves have more stomata on the lower surface.","steps":["Stomata let gases in and out, but water vapour escapes through them too.","The upper surface faces the sun, so it gets warmer.","Water evaporates faster from warmer surfaces, so stomata on top would lose more water.","So the lower surface has more stomata, which is why the lower epidermis does most of the photosynthesis."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"So the upper surface has more stomata after all.","why":"On most horizontal leaves, stomata are mainly underneath, away from the hot sun. Floating leaves are the exception.","_n":"1y54a","_k":"82d21ea5"},{"t":"So the cuticle does most of the gas exchange.","why":"The cuticle is a clear, waxy waterproof layer and almost gas-tight. Gases go through the stomata.","_n":"1z55a","_k":"f0b00713"},{"t":"So the lower surface has more stomata; photosynthesis still happens mainly in the palisade mesophyll.","why":"The chloroplasts are in the mesophyll, not the epidermis.","_n":"2056a","_k":"17cf2ea8"},{"t":"Step 4 is correct.","why":"Epidermis cells have no chloroplasts.","_n":"2157a","_k":"65a77ee7"}],"hints":["Which cells actually photosynthesize?","Where are the chloroplasts?","In the mesophyll, not the epidermis."]},{"id":"e3","goal":3,"task":"Trace water from the roots out of a leaf.","steps":["Water enters the root and moves up the stem in the phloem.","In the leaf, it leaves the vein and moves into mesophyll cells.","It evaporates from the cell surfaces into the air spaces.","Water vapour diffuses out through the stomata."],"_a":"VA==","stepFb":["","Step 2 is fine once step 1 is fixed.","Step 3 is fine.","Step 4 is fine."],"fixes":[{"t":"Step 1 is correct.","why":"Phloem carries sugar, not water from the roots.","_n":"2258a","_k":"ac595c13"},{"t":"…is absorbed by the leaf from the air.","why":"Stomata let water vapour out; almost none comes in.","_n":"2359a","_k":"3b824d7f"},{"t":"…moves up the stem through the air spaces.","why":"Air spaces hold gases inside the leaf; liquid water travels up the stem in the xylem.","_n":"245aa","_k":"40bf0890"},{"t":"…moves up the stem in the xylem.","why":"Xylem carries water and minerals up from the roots.","_n":"255ba","_k":"ac386b8d"}],"hints":["Which tissue carries water up?","Not the sugar-carrying tissue.","Xylem."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when you watched the gases at night?"},{"id":"j2","q":"In your own words, why is a stoma a ‘shared door’, and what does that cost the plant?"},{"id":"j3","q":"Explain to a friend how the palisade and spongy layers divide up the work."},{"id":"j4","q":"Which leaf tissue are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which leaf tissue contains the most chloroplasts?","options":[{"t":"Upper epidermis","why":"Clear cells with no chloroplasts.","_n":"265ca","_k":"e8767c3c"},{"t":"Palisade mesophyll","why":"Tall cells packed with chloroplasts, just under the upper epidermis.","_n":"27edd","_k":"6577a666"},{"t":"Xylem","why":"Xylem tubes carry water; they’re not even living when mature.","_n":"28ecd","_k":"00609b31"},{"t":"Spongy mesophyll","why":"It has chloroplasts, but fewer; its job is gas spreading.","_n":"29efd","_k":"9d6eb1b9"}]},"b":{"prompt":"Which leaf tissue is made of loosely packed cells with large air spaces?","options":[{"t":"Spongy mesophyll","why":"The air spaces let gases reach every cell.","_n":"2aeed","_k":"9c371a0d"},{"t":"Phloem","why":"Phloem carries sugar in the vein.","_n":"2be9d","_k":"0237bef5"},{"t":"Palisade mesophyll","why":"Palisade cells are tightly packed.","_n":"2ce8d","_k":"65a4ee09"},{"t":"Lower epidermis","why":"A single tight layer of clear cells.","_n":"2debd","_k":"5de42484"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"What changes the size of a stomatal opening?","options":[{"t":"The xylem","why":"Xylem brings water to the leaf.","_n":"2eead","_k":"3154830a"},{"t":"The cuticle","why":"The cuticle is a fixed waxy coat.","_n":"2fe5d","_k":"238e1d1d"},{"t":"The guard cells","why":"The pair of cells around the pore changes shape to open or close it.","_n":"2ge4d","_k":"24d4c386"},{"t":"The spongy mesophyll","why":"Its air spaces sit behind the stomata.","_n":"2h67d","_k":"d728dad8"}]},"b":{"prompt":"Through which structures does most water vapour leave a leaf?","options":[{"t":"The cuticle","why":"Only a little escapes through the waxy cuticle.","_n":"2i68d","_k":"4d50b062"},{"t":"The guard cells themselves","why":"They surround the pore; the vapour leaves through the pore.","_n":"2j65d","_k":"a3d86638"},{"t":"The xylem","why":"Xylem brings water in.","_n":"2k66d","_k":"194f099e"},{"t":"Stomata","why":"Water evaporates into the air spaces and diffuses out through open stomata.","_n":"2l6bd","_k":"afa07866"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which tissue carries sugars made in the leaf to the roots?","options":[{"t":"Spongy mesophyll","why":"It makes some sugar but doesn’t transport it.","_n":"2m6cd","_k":"e3e9186d"},{"t":"Phloem","why":"Phloem carries sugars from the leaf to the rest of the plant.","_n":"2n69d","_k":"e278d623"},{"t":"Stomata","why":"Stomata are pores for gases.","_n":"2o6ad","_k":"6c739ded"},{"t":"Xylem","why":"Xylem carries water and minerals up from the roots.","_n":"2p5fd","_k":"8e04442c"}]},"b":{"prompt":"Which tissue brings water into a leaf?","options":[{"t":"Xylem","why":"Xylem carries water and minerals up from the roots into the leaf.","_n":"2q60d","_k":"4e8861a5"},{"t":"Phloem","why":"Phloem carries sugars away.","_n":"2r051","_k":"c9f0c74d"},{"t":"Stomata","why":"Stomata let water vapour \u003cstrong>out\u003c/strong>; water comes from the roots.","_n":"2s061","_k":"7106315b"},{"t":"Guard cells","why":"They control the pores.","_n":"2t031","_k":"09685edd"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"On a sunny afternoon, the CO₂ concentration in a leaf’s air spaces stays lower than outside. Which explanation fits?","options":[{"t":"Guard cells pump CO₂ back out.","why":"Guard cells don’t pump gases.","_n":"2u041","_k":"462bed8f"},{"t":"The cuticle absorbs CO₂.","why":"The cuticle is a waxy barrier.","_n":"2v011","_k":"753cde6d"},{"t":"Photosynthesis uses CO₂ as fast as it arrives, keeping the inside level low, so CO₂ keeps diffusing in.","why":"Photosynthesis keeps the inside level low, and diffusion moves CO₂ from higher (outside) to lower (inside).","_n":"2w021","_k":"4a86e688"},{"t":"Respiration makes extra CO₂ in daylight.","why":"That would raise the inside level, not lower it.","_n":"2xff1","_k":"02e8efe2"}]},"b":{"prompt":"At night, the O₂ concentration in a leaf’s air spaces stays lower than outside. Which explanation fits?","options":[{"t":"Photosynthesis uses O₂ at night.","why":"Photosynthesis makes O₂ and needs light.","_n":"2y001","_k":"b4e88177"},{"t":"Guard cells pump O₂ out at night.","why":"Gases diffuse from higher to lower concentration. Photosynthesis and respiration keep the concentrations different.","_n":"2z0d1","_k":"6e96c978"},{"t":"O₂ leaks out through the cuticle.","why":"The cuticle is a clear, waxy waterproof layer and almost gas-tight. Gases go through the stomata.","_n":"300e1","_k":"58a0f694"},{"t":"Cells respire, using O₂, and there’s no photosynthesis to make more, so O₂ diffuses in.","why":"Respiration keeps the inside level low, and diffusion moves O₂ from higher (outside) to lower (inside).","_n":"310b1","_k":"44678961"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A plant’s stomata close on a hot, dry afternoon. Which pair of effects follows?","options":[{"t":"Water loss rises, because the leaf heats up.","why":"Closed stomata cut water loss.","_n":"320a1","_k":"c1020686"},{"t":"Water loss falls, and photosynthesis slows as the CO₂ inside is used up.","why":"Closed stomata cut the CO₂ supply, so photosynthesis slows as the CO₂ inside is used up, and less water vapour escapes.","_n":"330d1","_k":"6a6a8d95"},{"t":"Water loss falls, and photosynthesis speeds up because the leaf keeps more water.","why":"Water isn’t the limit here; CO₂ is.","_n":"340c1","_k":"b1b8911a"},{"t":"Nothing changes, because CO₂ can still enter through the cuticle.","why":"The cuticle is waxy and almost gas-tight. CO₂ enters through the stomata and spreads through the air spaces.","_n":"350f1","_k":"ff23670e"}]},"b":{"prompt":"On a cool, humid morning after rain, a plant’s stomata open wide. Which pair of effects follows?","options":[{"t":"Photosynthesis slows because water floods the air spaces.","why":"The air spaces don’t flood.","_n":"360e1","_k":"9fe1e0e6"},{"t":"Water loss falls because the stomata are open.","why":"Open stomata let more vapour out.","_n":"37111","_k":"badc3500"},{"t":"CO₂ can enter faster, so photosynthesis can speed up; water loss rises, but humid air keeps it modest.","why":"Open stomata let more CO₂ in and more water vapour out; humid air outside keeps the difference in water vapour small.","_n":"38101","_k":"0fe4159d"},{"t":"O₂ starts entering the leaf in daylight.","why":"In light, O₂ is made inside and leaves.","_n":"39031","_k":"ea5a9d63"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Leaf X: 3 palisade layers, 0.4 mm thick. Leaf Y: 1 palisade layer, 0.1 mm thick, twice the area. Both are from one tree species. Which statement is best supported?","options":[{"t":"X grew in shade, because it needs more layers to catch dim light.","why":"Extra layers only help if there’s enough light to reach them.","_n":"3a021","_k":"6c15372e"},{"t":"They grew in the same spot; thickness is random.","why":"Same species, different structure: the habitat is the likely cause.","_n":"3b791","_k":"85a3acdf"},{"t":"Y grew in a desert, because it is thin.","why":"Desert leaves are usually thick with a heavy cuticle.","_n":"3c7a1","_k":"eab61ed2"},{"t":"Y grew in shade: a thin, wide leaf catches scarce light cheaply, while X’s extra palisade layers suit bright sun.","why":"Same species, different structure: X is built like a sun leaf and Y like a shade leaf.","_n":"3d7b1","_k":"d819d9dd"}]},"b":{"prompt":"Leaf P: 350 stomata/mm² on top, none underneath, huge air spaces. Leaf Q: 200/mm² underneath, none on top, thick cuticle. Which statement is best supported?","options":[{"t":"P grew in a desert, because it has many stomata.","why":"Many stomata facing the sun would lose water fast.","_n":"3e7c1","_k":"9d804902"},{"t":"P floats on water: its stomata face the air and the air spaces keep it afloat.","why":"Stomata on top face the air, and large air spaces keep a floating leaf up.","_n":"3f7d1","_k":"39f6dfcd"},{"t":"Both are underwater leaves.","why":"Fully underwater leaves usually have few or no stomata.","_n":"3g7e1","_k":"3a9427a2"},{"t":"Q floats on water, because its stomata are underneath.","why":"Underneath would be against the water.","_n":"3h7f1","_k":"de7c0c0a"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why the spongy mesophyll has large air spaces?","options":[{"t":"“They store sugar until the phloem can take it.”","why":"Sugar is stored in cells, not air spaces.","_n":"3i801","_k":"8077a0b8"},{"t":"“They hold water for dry periods.”","why":"They hold air, not water.","_n":"3j811","_k":"527c3526"},{"t":"“They let CO₂, O₂ and water vapour diffuse quickly between the stomata and every photosynthesizing cell.”","why":"The air spaces link the stomata to every cell, so gases reach them quickly by diffusion.","_n":"3k821","_k":"7a8aae6b"},{"t":"“They let light reach the lower epidermis, where most photosynthesis happens.”","why":"Epidermis cells are clear, with no chloroplasts (except guard cells), so light passes through to the mesophyll.","_n":"3lff1","_k":"e63243c5"}]},"b":{"prompt":"Which is the best explanation of why palisade cells are tall and tightly packed just under the upper surface?","options":[{"t":"“They leave room for air spaces.”","why":"Tight packing leaves few air spaces; that’s the spongy layer.","_n":"3mfe1","_k":"b0053ec7"},{"t":"“They form a waterproof layer that stops water loss.”","why":"That’s the cuticle’s job.","_n":"3nfd1","_k":"e2cdbfb5"},{"t":"“They are the first green layer the light reaches, and packing many chloroplast-filled cells there absorbs most of it.”","why":"The palisade sits where the light arrives, so its chloroplasts absorb most of it.","_n":"3ofc1","_k":"09bfe910"},{"t":"“They carry sugar to the veins.”","why":"That’s the phloem.","_n":"3p031","_k":"91b311c6"}]}},{"id":"c2","cat":"C","goal":[1,3],"a":{"prompt":"Which flow chart correctly shows the path of a CO₂ molecule to the place where it’s used?","options":[{"t":"Air → stoma → guard cell → nucleus","why":"CO₂ is used in chloroplasts, not the nucleus.","_n":"3q021","_k":"62c2d5be"},{"t":"Air → stoma → xylem → palisade cell → chloroplast","why":"Veins carry liquids, not CO₂ from the air.","_n":"3r011","_k":"f6a9f296"},{"t":"Air → stoma → air space → palisade cell → chloroplast","why":"CO₂ enters through a stoma, spreads through the air spaces, and is used in the chloroplasts of the palisade cells.","_n":"3s001","_k":"f516a021"},{"t":"Air → cuticle → epidermis → palisade cell → chloroplast","why":"The cuticle is waxy and almost gas-tight. CO₂ enters through the stomata and spreads through the air spaces.","_n":"3t071","_k":"b7325b06"}]},"b":{"prompt":"Which flow chart correctly shows the path of water from a vein to the outside air?","options":[{"t":"Xylem → stoma → mesophyll cell → air","why":"The order is backwards in the middle.","_n":"3u061","_k":"349e3d7e"},{"t":"Xylem → cuticle → air","why":"Most water leaves through stomata.","_n":"3v7d2","_k":"40f46b67"},{"t":"Phloem → mesophyll cell → air space → stoma → air","why":"Xylem brings water and minerals up from the roots; phloem carries sugars away from the leaf.","_n":"3w7e2","_k":"e51b438f"},{"t":"Xylem → mesophyll cell → evaporates into an air space → stoma → air","why":"Water leaves the xylem, evaporates from mesophyll cells into the air spaces, then diffuses out through a stoma.","_n":"3x7b2","_k":"648b66e0"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"White spruce needles in the boreal forest have a thick waxy cuticle and stomata sunk in pits. Why does this help in winter?","options":[{"t":"They let more CO₂ in through the cuticle.","why":"The cuticle is waxy and almost gas-tight. CO₂ enters through the stomata and spreads through the air spaces.","_n":"3y7c2","_k":"0be3a8db"},{"t":"They trap heat so photosynthesis runs faster.","why":"The wax is for water, not heat.","_n":"3z812","_k":"0702f673"},{"t":"The ground is frozen, so roots can’t replace lost water; these features cut water loss.","why":"Wax and sunken stomata cut water loss when frozen soil means lost water can’t be replaced.","_n":"40822","_k":"8029eb28"},{"t":"They let the needles absorb snow for water.","why":"Leaves don’t absorb snow.","_n":"417f2","_k":"88d0ed47"}]},"b":{"prompt":"American beachgrass on Great Lakes sand dunes rolls its leaves into tubes in dry, windy weather, with its stomata on the inside of the roll. Why does this help?","options":[{"t":"Rolling lets more light reach the stomata.","why":"Stomata don’t need light to be absorbed.","_n":"42802","_k":"ed969e5b"},{"t":"Rolling moves the stomata to the cuticle.","why":"The cuticle is a clear, waxy waterproof layer. Most water vapour leaves through the stomata.","_n":"43852","_k":"2cd222e7"},{"t":"Rolling pumps CO₂ into the leaf.","why":"Gases diffuse from higher to lower concentration. Photosynthesis and respiration keep the concentrations different.","_n":"44862","_k":"7849ba4b"},{"t":"Still, humid air trapped inside the roll means less water vapour diffuses out of the stomata.","why":"Humid air over the pores makes the water-vapour difference smaller, so less diffuses out.","_n":"45832","_k":"022013f4"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Four identical maple leaves are coated with petroleum jelly (a waterproof seal): one uncoated, one coated on top, one coated underneath, one coated on both sides. Apart from the uncoated leaf, which loses the most mass over 3 days?","options":[{"t":"All three lose the same","why":"The surfaces don’t have the same number of stomata.","_n":"46822","_k":"f522ebbd"},{"t":"The leaf coated on both sides","why":"Both surfaces are sealed.","_n":"47852","_k":"f3f0e3f3"},{"t":"The leaf coated underneath","why":"Coating the underside blocks most stomata.","_n":"48842","_k":"b303bde5"},{"t":"The leaf coated on top","why":"Its lower surface, where most stomata are, is still open.","_n":"497f2","_k":"7ac27d5c"}]},"b":{"prompt":"The same test is done with four water lily leaves. Apart from the uncoated leaf, which loses the most mass?","options":[{"t":"The leaf coated on top","why":"On a water lily, coating the top blocks the stomata.","_n":"4a7e2","_k":"a2f9c6f0"},{"t":"The leaf coated on both sides","why":"Both surfaces are sealed.","_n":"4b812","_k":"3e4fe29e"},{"t":"All three lose the same","why":"The surfaces don’t have the same number of stomata.","_n":"4c802","_k":"cd899126"},{"t":"The leaf coated underneath","why":"Water lilies have their stomata on top, which is still open.","_n":"4d8b2","_k":"2f6d2f5c"}]}}]},"task":{"title":"Design a desert leaf","summary":"Design a desert leaf","statement":"\u003cp>Design a leaf for a hot, dry, sunny habitat that still does plenty of photosynthesis. Can you find all the answers?\u003c/p>","checks":["Low water loss: water-loss score of 2 or less","Plenty of photosynthesis: photosynthesis score of 5 or more","Stomata shaded from the midday sun","Waxy enough for the desert"],"tips":["Every stoma and every bit of surface area loses water. Hairs trap humid air and help.","Light is plentiful here, so more palisade layers pay off.","Put the pores where the sun doesn’t strike.","Desert plants need their thickest wax."],"inputs":[{"id":"cut","label":"Cuticle","options":[["thin","thin"],["medium","medium"],["thick","thick"]]},{"id":"on","label":"Stomata on","options":[["upper","upper only"],["lower","lower only"],["both","both"]]},{"id":"dens","label":"Stomatal density","options":[["low","low"],["medium","medium"],["high","high"]]},{"id":"pal","label":"Palisade layers","options":[["1","1"],["2","2"],["3","3"]]},{"id":"size","label":"Leaf size","options":[["small","small"],["medium","medium"],["large","large"]]},{"id":"hairs","label":"Hairs","options":[["no","no"],["yes","yes"]]}],"models":["\u003cstrong>Water-loss score\u003c/strong> = cuticle (thin 2, medium 1, thick 0) + stomata on (upper only 1, lower only 0, both 1) + density (low 0, medium 1, high 2) + size (small 0, medium 1, large 3) − hairs (yes 1, no 0). Never below 0.","\u003cstrong>Photosynthesis score\u003c/strong> = palisade layers (1, 2, 3) + density (low 0, medium 1, high 2) + size (small 0, medium 1, large 2)."],"afterAll":"Each answer trades something: more pores need a smaller leaf or hairs. That’s the leaf’s balancing act.","explainPrompt":"Explain how your leaf balances getting CO₂ against losing water.","vocab":"Use the words stomata, cuticle, palisade, diffusion and trade-off.","more":"There’s more than one answer. Can you find another?"},"cards":[["Cuticle","Clear, waxy, waterproof coating on the epidermis; cuts water loss."],["Epidermis","One layer of clear cells (no chloroplasts, except guard cells) that protects the leaf."],["Palisade mesophyll","Tall, tightly packed cells under the upper epidermis; most chloroplasts; absorbs most light."],["Spongy mesophyll","Loose cells with large air spaces; gases diffuse to every cell."],["Stoma (plural: stomata)","A
