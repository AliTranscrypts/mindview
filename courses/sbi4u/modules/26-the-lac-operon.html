.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 26: lac operon strips (hero, switchboard, task preview), trp strip, S12 builder.
   Roles (plan build notes, course plan §3): DNA --ink; mRNA teal --bio-nadh; sugars (lactose, allolactose, glucose) and Trp brown
   --bio-carbon; proteins (repressor, CAP, RNA polymerase) --ink-2 outlines with labels; enzymes made and output bars --pen. */

/* hero equation: the lac region as a row of labelled boxes */
.hero .hero-eq .lo-heq{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.5em;line-height:1.2}
.lo-hseg{display:inline-block;border:1.5px solid var(--ink);border-radius:4px;padding:.15em .45em;background:var(--sheet);color:var(--ink);font-weight:600}
.lo-hseg.op{outline:2px solid var(--ink-2);outline-offset:2px}
.lo-hdots{color:var(--ink-2);letter-spacing:.1em;padding:0 .1em}
.lo-hero{max-width:660px;margin:0 auto}
.lo-hsvg{display:block;width:100%;height:auto}

/* radio groups (from SBI4U 20 / 14 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.2em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.9rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* switchboard layout */
.lo-ex [hidden],.lo-p3 [hidden]{display:none!important}
@media (min-width:821px){ .pg.lo-pg{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)} }
.lo-pg .pg-ctrl{display:grid;gap:12px;align-content:start}
.lo-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.lo-fs{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px 10px;margin:0;display:grid;gap:8px}
.lo-fs legend{font-weight:700;font-size:.9rem;padding:0 .3em}
.lo-al3{display:flex;flex-wrap:wrap;gap:8px 16px}
.lo-note{margin:0}
.lo-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.lo-svg{display:block;width:100%;min-width:600px;height:auto}
.lo-cap{margin:8px 0 0;font-size:.95rem}
.lo-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:8px 0 0;color:var(--ink-2)}
.lo-kk{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:middle}
.lo-kd{border:2px solid var(--ink);background:var(--sheet)}
.lo-kp{border:2px solid var(--ink-2);border-radius:6px;background:var(--sheet)}
.lo-km{height:4px;background:var(--bio-nadh)}
.lo-ke{background:var(--pen)}
.lo-hexk{display:inline-block;width:12px;height:12px;background:var(--bio-carbon);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);vertical-align:middle}
.lo-bars{margin:10px 0 6px;display:grid;gap:6px}
.lo-bt{margin:0;font-weight:700;font-size:.9rem}
.lo-bar{display:grid;grid-template-columns:minmax(0,11em) 1fr;gap:8px;align-items:center;font-size:.86rem}
.lo-bt2{display:block;height:12px;border:1.5px solid var(--rule);border-radius:6px;overflow:hidden}
.lo-bt2 i{display:block;height:100%;background:var(--pen);transition:width .4s}
@media (prefers-reduced-motion:reduce){ .lo-bt2 i{transition:none} }

/* SVG roles */
.lo-svg text,.lo-hsvg text{font-family:inherit}
.lo-lab{fill:var(--ink-2);font-size:11.5px}
.lo-al{font-weight:700;fill:var(--ink)}
.lo-it{font-style:italic}
.lo-g{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.lo-site{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2}
.lo-site.mut,.lo-g.mut{stroke-dasharray:5 3}
.lo-gapl{stroke:var(--ink);stroke-width:2;stroke-dasharray:2 5;fill:none}
.lo-prot{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2.2}
.lo-pol{stroke-width:2.4}
.lo-pl{fill:var(--ink-2);font-size:11px;font-weight:700}
.lo-pt{fill:var(--ink-2);font-size:9.5px;font-weight:700}
.lo-camp{fill:var(--ink)}
.lo-sug{fill:var(--bio-carbon)}
.lo-trpt{fill:var(--sheet);font-size:9px;font-weight:700}
.lo-iptg{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.lo-iptgt{fill:var(--ink-2);font-size:8px;font-weight:700}
.lo-mrna{fill:none;stroke:var(--bio-nadh);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lo-ml{fill:var(--ink);font-size:11.5px;font-weight:700}
.lo-ms{fill:var(--ink-2);font-size:10.5px}
.lo-mt{fill:var(--bio-nadh);font-size:11px;font-weight:700}
.lo-enz{fill:var(--pen)}
.lo-enz.bad{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.lo-trace{fill:none;stroke:var(--pen);stroke-width:1.4;stroke-dasharray:3 3}
.lo-tag{fill:var(--ink);font-size:12px;font-weight:700}
.lo-ghost{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 4}
.lo-x{fill:var(--ink);font-size:13px;font-weight:700}
.lo-lv{fill:var(--ink);font-size:12px;font-weight:700}

/* Part 3 */
.lo-st h3{margin-top:0}
.lo-box{margin:8px 0}
.lo-sl{margin:8px 0}
.lo-sl input{width:100%;accent-color:var(--ink)}
.lo-cerrow{margin:8px 0}
.lo-cerq{margin:0 0 6px}
.lo-chips{display:flex;flex-wrap:wrap;gap:6px}
.lo-chip{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .85em;font-size:.92rem;min-height:36px;text-align:left}
.lo-chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.lo-chip:disabled{opacity:.7}

/* practice 2 and task */
.lo-pe6h{margin:0 0 4px}
.lo-star{margin-right:.3em}
.lo-tin{display:grid;gap:10px}
.lo-tpvw h4{margin:0 0 6px}
.lo-conds{margin:.4em 0 0 1.2em}

mones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"62b93e0e","content":{"id":"26-the-lac-operon","kind":"topic","title":"The lac operon","topic":"The lac Operon","readyTopic":"the lac operon","hero":{"eq":"\u003cspan class=\"lo-heq\">\u003cspan class=\"lo-hseg g\">\u003ci>lacI\u003c/i>\u003c/span>\u003cspan class=\"lo-hdots\" aria-hidden=\"true\">· · ·\u003c/span>\u003cspan class=\"lo-hseg\">CAP site\u003c/span>\u003cspan class=\"lo-hseg\">promoter\u003c/span>\u003cspan class=\"lo-hseg op\">operator\u003c/span>\u003cspan class=\"lo-hseg g\">\u003ci>lacZ\u003c/i>\u003c/span>\u003cspan class=\"lo-hseg g\">\u003ci>lacY\u003c/i>\u003c/span>\u003cspan class=\"lo-hseg g\">\u003ci>lacA\u003c/i>\u003c/span>\u003c/span>","eqLabel":"The lac region of the DNA, left to right: the lacI gene, a gap, then the CAP site, the promoter, the operator, and the genes lacZ, lacY and lacA. The repressor sits on the operator.","eqSize":"sm","headline":"A switch with two inputs","text":"\u003ci>E. coli\u003c/i> makes the enzymes for using lactose only when lactose is there and glucose isn’t. A \u003cstrong>repressor\u003c/strong> blocks the \u003cstrong>operator\u003c/strong> until an \u003cstrong>inducer\u003c/strong> pulls it off, and \u003cstrong>CAP\u003c/strong> boosts transcription when glucose runs low. Genes that are switched on and off together like this form an \u003cstrong>operon\u003c/strong>.","fig":{"html":"\u003cdiv class=\"lo-hero\" id=\"lo-hero\" role=\"img\" aria-label=\"The lac region of the DNA with the repressor on the operator and RNA polymerase stuck behind it. Lactose drifts in; one molecule becomes allolactose and clips onto the repressor, which changes shape and falls off. cAMP joins CAP, which docks at its site. RNA polymerase runs along lacZ, lacY and lacA, trailing one teal mRNA, and three enzymes appear: β-galactosidase, permease and transacetylase.\">\u003c/div>"}},"goals":["I can name the parts of the lac operon (promoter, operator, \u003ci>lacZ\u003c/i>, \u003ci>lacY\u003c/i>, \u003ci>lacA\u003c/i>) and the regulatory gene \u003ci>lacI\u003c/i>, and say what each does.","I can explain how the repressor and the inducer (allolactose) switch the operon off and on.","I can explain how CAP–cAMP and glucose set how strongly the operon is transcribed.","I can predict the operon’s output for any combination of lactose and glucose, and for mutant strains.","I can compare inducible (lac) and repressible (trp) operons.","I can apply operon control to biotechnology and interpret data from mutants."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Transcription basics","goal":1,"prompt":"Where does RNA polymerase bind to begin transcribing a gene?","options":[{"t":"The terminator","why":"That’s where transcription ends.","_n":"001f","_k":"fa8258ea"},{"t":"The promoter","why":"The promoter is the DNA sequence that says “start transcribing here”.","_n":"100f","_k":"fe15ae85"},{"t":"The start codon","why":"AUG is in the mRNA, read during translation.","_n":"2fff","_k":"0c4da395"},{"t":"The ribosome","why":"Ribosomes translate; they don’t bind DNA.","_n":"306f","_k":"34c247ee"}],"hints":["Which DNA sequence says ‘start transcribing here’?","In eukaryotes it often includes a TATA box.","The promoter."]},{"id":"w2","skill":"Transcription basics","goal":1,"prompt":"In bacteria, one mRNA can carry the code for several proteins. What does that allow?","options":[{"t":"The mRNA can be spliced","why":"Bacteria don’t splice.","_n":"405f","_k":"3916b94a"},{"t":"Several related genes can be switched on or off together","why":"One promoter controls them all, so they’re transcribed together.","_n":"504f","_k":"bcaad865"},{"t":"The proteins are joined into one big protein","why":"Each has its own start and stop codon.","_n":"603f","_k":"7cc40386"},{"t":"Translation is no longer needed","why":"Each gene is still translated.","_n":"7faf","_k":"ba256a6b"}],"hints":["Think about genes that are always needed together.","One promoter controls them all.","They’re switched together."]},{"id":"w3","skill":"Proteins binding DNA","goal":2,"prompt":"A protein binds tightly to a stretch of DNA between a promoter and a gene. What will it most likely do?","options":[{"t":"Translate the gene","why":"Proteins bound to DNA don’t translate.","_n":"8f9f","_k":"9877a844"},{"t":"Speed up DNA replication","why":"It’s in the way of transcription.","_n":"967f","_k":"3abe782b"},{"t":"Change the gene’s sequence","why":"Binding doesn’t change bases.","_n":"a68f","_k":"55102020"},{"t":"Block RNA polymerase from transcribing the gene","why":"It sits in RNA polymerase’s path.","_n":"b65f","_k":"e6ea79dd"}],"hints":["RNA polymerase has to travel along the DNA.","What happens if something sits in its path?","It blocks transcription."]},{"id":"w4","skill":"Proteins binding DNA","goal":2,"prompt":"A small molecule binds a protein at a site away from its active site and changes the protein’s shape. What is this called?","options":[{"t":"Allosteric regulation","why":"Like the allosteric inhibition in module 10.","_n":"c66f","_k":"0480b767"},{"t":"Hydrolysis","why":"That breaks bonds with water.","_n":"d63f","_k":"7924265a"},{"t":"Denaturation","why":"That’s unfolding by heat or pH.","_n":"e64f","_k":"5b057320"},{"t":"Competitive inhibition","why":"Competitive inhibitors use the active site.","_n":"f61f","_k":"df1f9d3a"}],"hints":["Recall enzyme control from module 10.","Binding elsewhere changes the shape.","Allosteric."]},{"id":"w5","skill":"Enzymes and energy","goal":6,"prompt":"Why would a bacterium \u003cstrong>not\u003c/strong> make lactose-digesting enzymes when no lactose is around?","options":[{"t":"The enzymes would digest the bacterium","why":"They act only on lactose-type sugars.","_n":"g62f","_k":"705898ac"},{"t":"The genes are missing until lactose arrives","why":"The genes are always there; they’re switched off.","_n":"h5ff","_k":"53a5a08e"},{"t":"Making unneeded proteins wastes energy and materials","why":"Each protein costs ATP and amino acids, and there’s no lactose to use them on.","_n":"i60f","_k":"c8e759a3"},{"t":"The enzymes can’t fold without lactose","why":"Folding doesn’t need the substrate.","_n":"j61e","_k":"8afb37cb"}],"hints":["Each protein costs ATP and amino acids.","No lactose, no use for the enzyme.","It saves energy."]},{"id":"w6","skill":"Enzymes and energy","goal":3,"prompt":"Glucose and lactose are both available. Which sugar can \u003ci>E. coli\u003c/i> use straight away, without making new enzymes?","options":[{"t":"Neither","why":"Glucose goes straight into glycolysis.","_n":"k60e","_k":"05a8e8df"},{"t":"Both equally","why":"Lactose needs extra enzymes.","_n":"l5fe","_k":"2dedc227"},{"t":"Glucose","why":"Glycolysis enzymes are always present.","_n":"m5ee","_k":"5c6b1d7a"},{"t":"Lactose","why":"It must first be split by β-galactosidase.","_n":"n65e","_k":"f87af51b"}],"hints":["Recall glycolysis from module 14.","Which sugar enters glycolysis directly?","Glucose."]}],"refreshers":{"Transcription basics":"RNA polymerase binds the \u003cstrong>promoter\u003c/strong> and copies genes into mRNA. In bacteria, one promoter can control several genes in a row.","Proteins binding DNA":"Regulatory proteins bind specific DNA sites. A protein sitting between the promoter and a gene blocks RNA polymerase. Small molecules can change a protein’s shape (allosteric change) and make it bind or let go.","Enzymes and energy":"Making proteins costs energy. Cells make enzymes only when there’s a job for them; glucose is used first because its enzymes are already there."}}},"explore":{"heading":"Operon switchboard","intro":"Flip the inputs, change the strain, and watch the repressor, CAP and RNA polymerase decide what the cell makes.","chalIntro":"Set the switches to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Challenge 3 uses \u003cstrong>Partial diploid\u003c/strong> mode. Each challenge has three levels of help.","modelNote":"Real output is a continuum; this model keeps three levels: Off (a trace), Low and High. The repressor sits on every O⁺ operator unless an inducer (allolactose or IPTG) is bound to it. Allolactose forms only when lactose is present and some working β-galactosidase exists. CAP–cAMP binds when glucose is absent.","iptgNote":"IPTG binds the repressor like allolactose but isn’t broken down.","predictions":[{"id":"p1","prompt":"Wild type, lactose absent, glucose present. What does the operon do?","options":[{"t":"Off (a trace)","_n":"o64e","_k":"96fb7c64"},{"t":"It depends on how much glucose","_n":"p63e","_k":"4d8dba23"},{"t":"Low","_n":"q62e","_k":"2fcbff57"},{"t":"High","_n":"r59e","_k":"58533f86"}],"explain":"No lactose means no inducer, so the repressor blocks transcription.","reveal":"The repressor stays on the operator; RNA polymerase can’t pass.","start":{"strain":"wt","lac":"absent","glu":"present","iptg":"off"}},{"id":"p2","prompt":"Wild type, lactose absent, glucose \u003cstrong>absent\u003c/strong>. CAP–cAMP is bound now. What does the operon do?","options":[{"t":"Off (a trace)","_n":"s58e","_k":"94265d1d"},{"t":"High","_n":"t5be","_k":"4e1d4fab"},{"t":"CAP pushes the repressor off","_n":"u5ce","_k":"1d286447"},{"t":"Low","_n":"v5de","_k":"37845dfb"}],"explain":"CAP only helps RNA polymerase bind. A bound repressor still stops it.","reveal":"CAP docks, but the repressor still blocks the way.","start":{"strain":"wt","lac":"absent","glu":"absent","iptg":"off"}},{"id":"p3","prompt":"Wild type, lactose present, glucose present. What does the operon do?","options":[{"t":"High, then off once lactose is used","_n":"w5ee","_k":"17d19fc7"},{"t":"Low","_n":"x5fe","_k":"3c4d4fe8"},{"t":"High","_n":"y60e","_k":"853686d1"},{"t":"Off","_n":"z61e","_k":"8f920b1b"}],"explain":"The repressor is gone, but with glucose around, cAMP is low and CAP can’t help.","reveal":"The repressor comes off, but CAP isn’t docked; the polymerase runs slowly.","start":{"strain":"wt","lac":"present","glu":"present","iptg":"off"}},{"id":"p4","prompt":"\u003ci>lacI\u003c/i>⁻ strain, lactose absent, glucose absent. What does the operon do?","options":[{"t":"High","_n":"1062e","_k":"4b4088ec"},{"t":"Nothing: the cell dies","_n":"1153e","_k":"37ff71e2"},{"t":"Low","_n":"1254e","_k":"38b9bd26"},{"t":"Off","_n":"1365f","_k":"52ac7c62"}],"explain":"With no repressor, nothing blocks transcription. The operon is \u003cstrong>constitutive\u003c/strong>: always on.","reveal":"No repressor appears, and CAP is docked.","start":{"strain":"i","lac":"absent","glu":"absent","iptg":"off"}}],"challenges":[{"id":"tc1","goal":[2,3],"prompt":"Wild type: set the inputs so the operon is transcribed at its highest level.","why":"An inducer (allolactose or IPTG) pulls the repressor off, and with glucose absent CAP–cAMP docks and helps RNA polymerase: High.","general":"Look at the readout: you need the repressor released \u003cstrong>and\u003c/strong> CAP–cAMP bound.","named":{"mode":"Switch to \u003cstrong>Single operon\u003c/strong> mode first.","strain":"This challenge uses the \u003cstrong>wild type\u003c/strong> strain.","both":"That’s only low: glucose keeps CAP away.","none":"CAP is ready, but the repressor still blocks."},"hints":["Two conditions must both be met.","Remove the repressor, and get CAP to help.","Lactose present, glucose absent."]},{"id":"tc2","goal":[2,4],"prompt":"Find a strain that makes β-galactosidase at a high level with \u003cstrong>no lactose and no IPTG\u003c/strong>.","why":"With no working repressor (\u003ci>lacI\u003c/i>⁻) or an operator it can’t bind (Oᶜ), nothing blocks transcription, so no inducer is needed; with glucose absent, CAP makes it high.","general":"Which mutation stops the repressor blocking the operator?","named":{"mode":"Switch to \u003cstrong>Single operon\u003c/strong> mode first.","lacZ":"Its β-galactosidase is faulty, and it can’t make allolactose either.","glucose":"Transcription is only low while glucose is around.","inducer":"The challenge says \u003cstrong>no lactose and no IPTG\u003c/strong>. Switch them off.","wt":"In the wild type, the repressor blocks the operator whenever there’s no inducer. Try a mutant strain."},"hints":["Which mutation stops the repressor blocking the operator?","Either remove the repressor or change the operator.","\u003ci>lacI\u003c/i>⁻ or Oᶜ, with glucose absent."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Partial-diploid mode. One copy of the operon has an Oᶜ operator (it must stay). Build a cell that makes \u003cstrong>working\u003c/strong> β-galactosidase \u003cstrong>only\u003c/strong> when lactose is present (glucose absent).","why":"The faulty \u003ci>Z\u003c/i>⁻ beside Oᶜ is on all the time but makes nothing useful. A repressor from any \u003ci>I\u003c/i>⁺ copy drifts to the O⁺ operator and holds the working \u003ci>Z\u003c/i>⁺ off until lactose provides the inducer.","general":"Check which genes sit beside which operator.","named":{"mode":"Switch to \u003cstrong>Partial diploid\u003c/strong> mode first.","noOc":"One copy must keep its Oᶜ operator.","twoOc":"Only one copy has the Oᶜ operator; the other copy needs O⁺.","ocZ":"Working β-galactosidase is made all the time from the copy beside the Oᶜ operator.","noI":"There’s no repressor anywhere, so the O⁺ copy is on all the time too.","opZ":"No working β-galactosidase at all."},"hints":["An operator only controls the genes right next to it.","The repressor is a protein that can drift to any O⁺ operator in the cell.","Put \u003ci>Z\u003c/i>⁻ beside Oᶜ, \u003ci>Z\u003c/i>⁺ beside O⁺, and keep at least one \u003ci>I\u003c/i>⁺."]}]},"part3":{"slug":"trp","name":"trp operon","heading":"The trp operon, the opposite switch","intro":"The lac operon breaks down a food. The trp operon builds an amino acid, so it is wired the other way round. Try its switchboard, then use real-style mutant data to see how the lac model was worked out.","st1":{"title":"Station 1: The trp switchboard","text":"\u003ci>trpR\u003c/i> (a separate gene) makes the trp repressor. The operon has a promoter, an operator and five genes for the enzymes that make tryptophan (Trp). Move the tryptophan level.","levels":["Low","Medium","High"],"compare":{"head":["","lac","trp"],"rows":[["Kind of pathway","Breaks down a sugar","Builds an amino acid"],["Default state","Off","On"],["Small molecule","Inducer (allolactose) \u003cstrong>removes\u003c/strong> the repressor","Corepressor (tryptophan) \u003cstrong>activates\u003c/strong> the repressor"],["Type","Inducible","Repressible"]]},"note":"Going further: the trp operon also has a second control, attenuation, that this module leaves out."},"st2":{"title":"Station 2: Mutant strains","text":"β-galactosidase activity (units) in four strains, with no lactose and with lactose (no glucose).","head":["Strain","No lactose","Lactose (no glucose)"],"rows":[["Wild type","1","1000"],["Strain X","1000","1000"],["Strain Y","1","1"],["Partial diploid: X on the chromosome + wild-type plasmid","1","2000"]],"control":"The wild type is the \u003cstrong>control\u003c/strong> strain: it shows what normal control looks like, so each mutant can be compared with it.","x":{"claimQ":"Claim: strain X is…","claims":[{"t":"an operator (Oᶜ) mutant","fb":"An Oᶜ operator only controls the genes beside it, so a plasmid couldn’t fix it. Look at the last row.","_n":"1464f","_k":"a00a3238"},{"t":"a repressor (\u003ci>lacI\u003c/i>⁻) mutant","_n":"1567f","_k":"88da2271"},{"t":"a \u003ci>lacZ\u003c/i>⁻ mutant","fb":"Strain X makes plenty of β-galactosidase, so \u003ci>lacZ\u003c/i> works.","_n":"1666f","_k":"a35f4288"}],"evQ":"Evidence: which row settles it?","evs":[{"t":"Row 1 (wild type)","fb":"The wild type is the control; it doesn’t test strain X.","_n":"1761f","_k":"a959edb2"},{"t":"Row 2 (strain X)","fb":"Row 2 shows X is always on, but both \u003ci>lacI\u003c/i>⁻ and Oᶜ would do that.","_n":"1860f","_k":"88547a58"},{"t":"Row 3 (strain Y)","fb":"Row 3 is about a different strain.","_n":"1963f","_k":"8ac18416"},{"t":"Row 4 (the partial diploid)","_n":"1a62f","_k":"6be22658"}],"reQ":"Reasoning:","res":[{"t":"β-galactosidase doubled, so strain X makes extra enzyme.","fb":"The doubling just shows two working \u003ci>lacZ\u003c/i> copies. Look at the no-lactose column.","_n":"1b5df","_k":"b068c9c3"},{"t":"The plasmid’s working repressor fixed it, and a repressor can act on both copies; an Oᶜ mutation couldn’t be fixed that way.","_n":"1c5cf","_k":"c3aefbee"},{"t":"Strain X makes β-galactosidase without lactose, so its operator must be broken.","fb":"A missing repressor gives the same result in row 2; row 4 tells them apart.","_n":"1d5ff","_k":"853f969b"}],"done":"✓ Strain X is a repressor (\u003ci>lacI\u003c/i>⁻) mutant. Row 4: with the plasmid’s working repressor, the cell is off again without lactose (1 unit). The repressor is a protein that diffuses anywhere in the cell. An operator only controls the genes right next to it."},"y":{"claimQ":"Strain Y makes almost no β-galactosidase, even with lactose. It is consistent with…","claims":[{"t":"\u003ci>lacI\u003c/i>⁻","fb":"No repressor would make it always on, not always off.","_n":"1e60f","_k":"81f1d95d"},{"t":"Oᶜ","fb":"Oᶜ would make it always on.","_n":"1f5df","_k":"4026a5ef"},{"t":"\u003ci>lacZ\u003c/i>⁻","_n":"1g5ef","_k":"309790f0"}],"done":"✓ Strain Y is consistent with \u003ci>lacZ\u003c/i>⁻: the gene is switched on, but the β-galactosidase it codes for doesn’t work."}},"quickCheck":{"title":"trp operon quick check","summary":"trp operon quick check","items":[{"id":"q1","goal":5,"prompt":"High tryptophan: the trp operon is…","choices":[{"t":"On","fb":"Trp activates the repressor.","_n":"1h63f","_k":"54b6ecc7"},{"t":"Induced","fb":"Trp activates the repressor.","_n":"1i64f","_k":"42d42c55"},{"t":"Low","fb":"Trp activates the repressor.","_n":"1j61f","_k":"dd417247"},{"t":"Off","fb":"Right. Tryptophan activates the repressor, which binds the operator.","_n":"1k62f","_k":"41fd9fee"}]},{"id":"q2","goal":5,"prompt":"Tryptophan is called a…","choices":[{"t":"Activator","fb":"It helps the repressor repress.","_n":"1l57f","_k":"98d0a046"},{"t":"Promoter","fb":"It helps the repressor repress.","_n":"1m58f","_k":"ac74c6d4"},{"t":"Corepressor","fb":"Right. It helps the repressor repress.","_n":"1nd9f","_k":"aa5b8242"},{"t":"Inducer","fb":"It helps the repressor repress.","_n":"1od8f","_k":"5509fb15"}]},{"id":"q3","goal":5,"prompt":"Which operon is ‘on’ by default?","choices":[{"t":"Neither","fb":"The cell usually needs to make Trp; lac waits for lactose.","_n":"1pd7f","_k":"8fa1edad"},{"t":"lac","fb":"The cell usually needs to make Trp; lac waits for lactose.","_n":"1qd6f","_k":"47522c25"},{"t":"Both","fb":"The cell usually needs to make Trp; lac waits for lactose.","_n":"1rd5f","_k":"f37b0c65"},{"t":"trp","fb":"Right. The cell usually needs to make Trp; lac waits for lactose.","_n":"1sd4f","_k":"42f4ee82"}]},{"id":"q4","goal":6,"prompt":"In the data, why does the partial diploid prove strain X is \u003ci>lacI\u003c/i>⁻?","choices":[{"t":"Lactose was absent","fb":"A repressor works on any operator; an Oᶜ operator couldn’t be rescued.","_n":"1td3f","_k":"0f76f5fd"},{"t":"β-galactosidase doubled","fb":"A repressor works on any operator; an Oᶜ operator couldn’t be rescued.","_n":"1ud2f","_k":"db83f675"},{"t":"The plasmid repressor restored control","fb":"Right. A repressor works on any operator; an Oᶜ operator couldn’t be rescued.","_n":"1ve1f","_k":"1b957f51"},{"t":"The plasmid had Oᶜ","fb":"A repressor works on any operator; an Oᶜ operator couldn’t be rescued.","_n":"1we0f","_k":"e643e43a"}]}]}},"practice":{"activities":[{"id":"olh","type":"sorter","title":"Off, low or high?","summary":"Off, low or high?","goal":[3,4],"noun":"situation","txt":true,"instruction":"Ten situations. Sort each one by how strongly the lac operon is transcribed.","boxes":[{"id":"b1","label":"Off"},{"id":"b2","label":"Low"},{"id":"b3","label":"High"}],"wrongDefault":"Ask two questions: is the repressor off? Is CAP on?","items":[{"id":"i1","t":"Wild type; no lactose; glucose present","_a":"FFBTGw==","why":"No lactose, no inducer: the repressor blocks."},{"id":"i2","t":"Wild type; lactose; glucose present","_a":"FFBQGw==","why":"The repressor is off, but glucose keeps CAP away.","wrong":{"b3":"With glucose around, cAMP is low and CAP doesn’t help, so transcription is only \u003cstrong>low\u003c/strong>."}},{"id":"i3","t":"Wild type; lactose; no glucose","_a":"FFBRGw==","why":"The repressor is off and CAP–cAMP helps."},{"id":"i4","t":"Wild type; no lactose; no glucose","_a":"FFBTGw==","why":"CAP is bound, but the repressor still blocks.","wrong":{"b3":"CAP helps RNA polymerase, but a bound repressor still blocks it: no lactose means off."}},{"id":"i5","t":"\u003ci>lacI\u003c/i>⁻; no lactose; no glucose","_a":"FFBRGw==","why":"No repressor, and CAP helps."},{"id":"i6","t":"\u003ci>lacI\u003c/i>⁻; no lactose; glucose present","_a":"FFBQGw==","why":"No repressor, but glucose keeps CAP away.","wrong":{"b3":"No repressor, but glucose still keeps CAP away: low."}},{"id":"i7","t":"Oᶜ; lactose; no glucose","_a":"FFBRGw==","why":"The repressor can’t bind Oᶜ, and CAP helps."},{"id":"i8","t":"Wild type; IPTG; glucose present","_a":"FFBQGw==","why":"IPTG pulls the repressor off, but glucose keeps CAP away."},{"id":"i9","t":"\u003ci>lacZ\u003c/i>⁻; lactose; no glucose (no IPTG)","_a":"FFBTGw==","why":"No working β-galactosidase means no allolactose, so the repressor stays on.","wrong":{"b3":"\u003ci>lacZ\u003c/i>⁻ can’t turn lactose into allolactose, so nothing removes the repressor."},"hints":["What makes allolactose?","β-galactosidase, which this strain can’t make in working form.","No inducer: Off."]},{"id":"i10","t":"Wild type; IPTG; no glucose","_a":"FFBRGw==","why":"IPTG removes the repressor, and CAP helps."}]},{"id":"pe","type":"custom","title":"Predict and explain","summary":"Predict and explain","goal":[4,6],"instruction":"Six problems. Problems 3–6 are non-routine (★); 5 and 6 go beyond the Final Check.","how":"Choose an answer, then press Check.","items":[{"id":"pe1","goal":4,"prompt":"A mutation stops cAMP binding to CAP. Lactose present, no glucose. Output?","options":[{"t":"Off","why":"Lactose still pulls the repressor off. The problem is CAP.","_n":"1xd3f","_k":"43d1f4c1"},{"t":"Low","why":"The repressor is off, but without cAMP, CAP can’t bind and help: low.","_n":"1yd4f","_k":"84635d4c"},{"t":"High","why":"Without CAP’s help, transcription stays low.","_n":"1zd5f","_k":"b471844d"}]},{"id":"pe2","goal":4,"prompt":"A mutation stops the repressor binding allolactose (but it still binds the operator). Lactose present, no glucose. Output?","options":[{"t":"Off","why":"The inducer can’t pull the repressor off, so it stays on the operator: off, whatever CAP does.","_n":"20d6f","_k":"a0207f7a"},{"t":"Low","why":"With the repressor stuck on the operator, there’s only a trace.","_n":"21cff","_k":"53016e91"},{"t":"High","why":"The inducer can’t pull it off, so it stays on the operator.","_n":"22d0f","_k":"59746a09"}]},{"id":"pe3","goal":[4,6],"prompt":"\u003cspan class=\"tag lo-star\">★ non-routine\u003c/span> Partial diploid: chromosome \u003ci>I\u003c/i>⁻ O⁺ \u003ci>Z\u003c/i>⁺; plasmid \u003ci>I\u003c/i>⁺ O⁺ \u003ci>Z\u003c/i>⁻. No lactose. Working β-galactosidase?","options":[{"t":"None (off)","why":"The plasmid’s repressor drifts to the chromosome’s operator and blocks the working \u003ci>Z\u003c/i>⁺. The repressor is a protein that diffuses anywhere in the cell. An operator only controls the genes right next to it.","_n":"23d1f","_k":"3d359b86"},{"t":"Made at a low level","why":"The repressor is a protein that diffuses anywhere in the cell. An operator only controls the genes right next to it. The plasmid’s repressor drifts to the chromosome’s operator.","_n":"24d2f","_k":"d320811d"},{"t":"Made at a high level","why":"The repressor is a protein that diffuses anywhere in the cell. An operator only controls the genes right next to it. The plasmid’s repressor drifts to the chromosome’s operator.","_n":"25dbf","_k":"77e7ec68"}]},{"id":"pe4","goal":[4,6],"prompt":"\u003cspan class=\"tag lo-star\">★ non-routine\u003c/span> Partial diploid: chromosome \u003ci>I\u003c/i>⁺ Oᶜ \u003ci>Z\u003c/i>⁺; plasmid \u003ci>I\u003c/i>⁺ O⁺ \u003ci>Z\u003c/i>⁻. No lactose, no glucose. Working β-galactosidase?","options":[{"t":"None (off)","why":"The repressor is a protein that diffuses anywhere in the cell. An operator only controls the genes right next to it. No repressor can bind an Oᶜ operator, and \u003ci>Z\u003c/i>⁺ sits beside it.","_n":"26dcf","_k":"f0c9eb22"},{"t":"Low","why":"There’s no glucose, so CAP is bound: high.","_n":"275de","_k":"c2bcfdca"},{"t":"High","why":"No repressor can bind an Oᶜ operator, and \u003ci>Z\u003c/i>⁺ sits beside it; with no glucose, CAP helps.","_n":"285ce","_k":"022ec1e5"}]},{"id":"pe5","goal":6,"prompt":"\u003cspan class=\"tag lo-star\">★ non-routine\u003c/span> A strain makes lac enzymes at high levels whatever the sugars. Adding a plasmid with a working \u003ci>lacI\u003c/i> gene changes nothing. Which mutation is it most likely to have?","options":[{"t":"Oᶜ (operator)","why":"A working repressor can’t bind an Oᶜ operator, so the plasmid can’t fix it. This is how Jacob and Monod tested their model: they moved working genes into mutant cells and saw which defects were fixed.","_n":"295fe","_k":"d3397905"},{"t":"\u003ci>lacI\u003c/i>⁻ (repressor)","why":"A working repressor would have fixed a \u003ci>lacI\u003c/i>⁻ strain.","_n":"2a5ee","_k":"d53a4f79"},{"t":"A CAP mutation","why":"Without CAP’s help, output would be low, not high.","_n":"2b61e","_k":"c237be23"},{"t":"\u003ci>lacZ\u003c/i>⁻","why":"A \u003ci>lacZ\u003c/i>⁻ strain makes no working β-galactosidase at all.","_n":"2c60e","_k":"a4760357"}],"hints":["Which part can be fixed by a protein made elsewhere?","The repressor can; the operator can’t.","Oᶜ."]}],"sequences":[{"id":"pe6","goal":[4,6],"prompt":"\u003cspan class=\"tag lo-star\">★ non-routine\u003c/span> \u003ci>E. coli\u003c/i> is moved from a glucose-only medium to a lactose-only medium. Put these events in order.","steps":["Glucose runs out","cAMP rises","Lactose enters and some becomes allolactose","Repressor releases the operator","Permease and β-galactosidase rise"],"start":[4,3,1,2,0],"accept":[[0,2,1,3,4]],"general":"Enzymes rise only after the operon is switched on, and that needs both signals first.","wrong":[{"order":[4,0,1,2,3],"fb":"Enzymes rise only after the operon is switched on."},{"order":[4,0,2,1,3],"fb":"Enzymes rise only after the operon is switched on."}],"why":"Glucose loss raises cAMP (so CAP can help), and lactose provides the inducer (so the repressor lets go). Only then is the operon transcribed, and the enzymes rise.","hints":["What does the cell sense first?","Glucose loss raises cAMP; lactose provides the inducer.","Both signals, then transcription, then enzymes."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Nikhil","how":"","instruction":"Nikhil made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Predict the lac operon’s output when both glucose and lactose are present.","steps":["Lactose is present, so some becomes allolactose.","Allolactose binds the repressor, which lets go of the operator.","Nothing is blocking RNA polymerase, so transcription is high.","The cell uses lactose before glucose."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","This follows from step 3, which is wrong."],"fixes":[{"t":"Glucose keeps cAMP low, so CAP doesn’t help RNA polymerase: transcription is only low, and glucose is used first.","why":"With glucose around, cAMP is low and CAP doesn’t help, so transcription is only \u003cstrong>low\u003c/strong>.","_n":"2d63e","_k":"fcd11a54"},{"t":"The repressor rebinds because glucose is present.","why":"Glucose acts through cAMP and CAP, not the repressor.","_n":"2e62e","_k":"8db9c40b"},{"t":"Transcription is off.","why":"Allolactose has pulled the repressor off, so it isn’t off.","_n":"2f55e","_k":"b61a315e"},{"t":"Step 3 is correct.","why":"CAP needs cAMP, which is low when glucose is present.","_n":"2g54e","_k":"9667732a"}],"hints":["What does glucose do to cAMP?","Lowers it, so CAP isn’t bound.","Low output."]},{"id":"e2","goal":2,"task":"Explain why the lac operon is off when there’s no lactose.","steps":["When lactose is absent, the \u003ci>lacI\u003c/i> gene is switched on and the repressor is made.","The repressor binds the operator.","RNA polymerase can’t get past, so \u003ci>lacZ\u003c/i>, \u003ci>lacY\u003c/i> and \u003ci>lacA\u003c/i> aren’t transcribed."],"_a":"Bg==","stepFb":["","Step 2 is correct, but there’s an earlier mistake.","Step 3 is correct."],"fixes":[{"t":"Step 1 is correct.","why":"The repressor is there whether or not lactose is; lactose changes its shape.","_n":"2h57d","_k":"2a66ea21"},{"t":"The operator makes the repressor.","why":"The operator is a stretch of DNA, a binding site, not a gene for a protein.","_n":"2i58d","_k":"728ad57b"},{"t":"\u003ci>lacZ\u003c/i> makes the repressor.","why":"\u003ci>lacZ\u003c/i> codes for β-galactosidase.","_n":"2j55d","_k":"9665729d"},{"t":"\u003ci>lacI\u003c/i> is transcribed all the time, so the repressor is always present; without an inducer, it binds the operator.","why":"\u003ci>lacI\u003c/i> is always transcribed. The repressor is always present; lactose changes its \u003cstrong>shape\u003c/strong>, not its amount.","_n":"2k56d","_k":"a22ce608"}],"hints":["Is \u003ci>lacI\u003c/i> part of the operon’s switch?","No: it has its own promoter and is always on.","The repressor is always present."]},{"id":"e3","goal":5,"task":"Explain what happens to the trp operon when tryptophan is plentiful.","steps":["The trp operon codes for enzymes that make tryptophan.","When tryptophan is plentiful, the cell doesn’t need to make more.","Tryptophan binds the trp repressor and pulls it off the operator.","So the trp genes are switched off."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 states the right result, but step 3’s mechanism would switch them on."],"fixes":[{"t":"Tryptophan binds the trp repressor and \u003cstrong>activates\u003c/strong> it, so it binds the operator and blocks transcription.","why":"Tryptophan is a \u003cstrong>corepressor\u003c/strong>: it \u003cstrong>activates\u003c/strong> the trp repressor so it binds the operator.","_n":"2l53d","_k":"a5143ad6"},{"t":"Tryptophan destroys the trp mRNA.","why":"It works through the repressor.","_n":"2m54d","_k":"c4321673"},{"t":"Step 3 is correct.","why":"Pulling a repressor off would turn genes \u003cstrong>on\u003c/strong>.","_n":"2n51d","_k":"7040d9ed"},{"t":"Tryptophan binds the operator.","why":"Small molecules like tryptophan bind the \u003cstrong>repressor protein\u003c/strong>, not the operator DNA.","_n":"2o52d","_k":"127f3373"}],"hints":["What does a corepressor do?","Helps the repressor repress.","It activates the repressor."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the switchboard: that lactose plus glucose gives only low output, or that CAP can’t overrule the repressor?"},{"id":"j2","q":"In your own words, why does it make sense for \u003ci>E. coli\u003c/i> to control the lac genes this way?"},{"id":"j3","q":"Explain to a friend the difference between an inducible and a repressible operon, using lac and trp."},{"id":"j4","q":"Which part of operon logic still trips you up? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What does the lac repressor do when no lactose is present?","options":[{"t":"It binds the operator and blocks RNA polymerase from transcribing the genes","why":"With no inducer, the repressor sits on the operator, between the promoter and the genes.","_n":"2p5fd","_k":"2b3664db"},{"t":"It is not made until lactose arrives","why":"\u003ci>lacI\u003c/i> is always transcribed. The repressor is always present; lactose changes its \u003cstrong>shape\u003c/strong>, not its amount.","_n":"2q60d","_k":"ee475066"},{"t":"It binds the promoter and helps RNA polymerase","why":"That describes CAP, which helps only when glucose is low.","_n":"2r9b1","_k":"a6c13ccd"},{"t":"It binds lactose and destroys it","why":"No lactose is there.","_n":"2s9c1","_k":"a2c896f1"}]},"b":{"prompt":"Which statement about the operator is correct?","options":[{"t":"It codes for β-galactosidase","why":"That’s \u003ci>lacZ\u003c/i>.","_n":"2t991","_k":"8df507f0"},{"t":"It is a DNA sequence where the repressor binds","why":"The operator is a binding site between the promoter and the genes.","_n":"2u9a1","_k":"d4227ff6"},{"t":"It is the protein that blocks transcription","why":"The operator is a stretch of DNA, a binding site, not a gene for a protein.","_n":"2v9f1","_k":"9e0e1ffd"},{"t":"It is where the ribosome binds","why":"Ribosomes bind mRNA, not the operator.","_n":"2wa01","_k":"d3a56ec6"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What does allolactose do in the lac operon?","options":[{"t":"It binds the repressor, changing its shape so it releases the operator","why":"Allolactose is the inducer: an allosteric change makes the repressor let go.","_n":"2x9d1","_k":"c2230ca2"},{"t":"It activates CAP","why":"cAMP activates CAP.","_n":"2y9e1","_k":"48e191e1"},{"t":"It is transcribed into mRNA","why":"It’s a sugar, not a gene.","_n":"2z931","_k":"a900d9d8"},{"t":"It binds the operator and blocks the repressor","why":"The inducer binds the \u003cstrong>repressor protein\u003c/strong>, which then lets go of the operator.","_n":"30941","_k":"e96ab772"}]},"b":{"prompt":"In the lab, IPTG is added to cells with the lac operon. What does it do?","options":[{"t":"It replaces glucose as food","why":"Cells can’t use IPTG as food.","_n":"31a11","_k":"1a6c0152"},{"t":"It binds the repressor like allolactose does, so the operator is freed, but it isn’t broken down","why":"IPTG is a lab inducer that the cell can’t use up.","_n":"32a01","_k":"6c2d6817"},{"t":"It destroys the repressor gene","why":"It’s a small molecule; it doesn’t change DNA.","_n":"33a31","_k":"d99424c6"},{"t":"It binds the operator directly","why":"The inducer binds the \u003cstrong>repressor protein\u003c/strong>, which then lets go of the operator.","_n":"34a21","_k":"3e626f0c"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"When glucose is scarce, what helps RNA polymerase bind the lac promoter strongly?","options":[{"t":"The repressor","why":"The repressor blocks; it never helps.","_n":"359d1","_k":"60e991e7"},{"t":"β-galactosidase","why":"That’s a product of the operon, not a regulator.","_n":"369c1","_k":"bf8b0deb"},{"t":"Allolactose bound to the promoter","why":"The inducer binds the \u003cstrong>repressor protein\u003c/strong>, which then lets go of the operator.","_n":"379f1","_k":"8735ae83"},{"t":"CAP with cAMP bound to it","why":"Low glucose raises cAMP; CAP–cAMP binds near the promoter and helps RNA polymerase.","_n":"389e1","_k":"b72dc4c4"}]},"b":{"prompt":"Why does glucose keep lac transcription low, even when lactose is present?","options":[{"t":"Glucose binds the operator","why":"The inducer binds the \u003cstrong>repressor protein\u003c/strong>, which then lets go of the operator.","_n":"39991","_k":"4b39e86a"},{"t":"Glucose keeps cAMP low, so CAP isn’t bound to help RNA polymerase","why":"With glucose around, cAMP is low and CAP doesn’t help, so transcription is only \u003cstrong>low\u003c/strong>.","_n":"3a981","_k":"706d0ddc"},{"t":"Glucose turns the repressor back on","why":"The repressor responds to the inducer, not glucose.","_n":"3b0f0","_k":"24b2f3aa"},{"t":"Glucose destroys lac mRNA","why":"It acts through cAMP and CAP.","_n":"3c100","_k":"1ae6296a"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A wild-type \u003ci>E. coli\u003c/i> cell is in a medium with both glucose and lactose. What is the lac operon’s output?","options":[{"t":"Low","why":"The repressor is off, but CAP isn’t helping.","_n":"3d110","_k":"c925b727"},{"t":"Off","why":"Lactose provides the inducer, so the repressor comes off.","_n":"3e120","_k":"4fb4d6b2"},{"t":"High","why":"With glucose around, cAMP is low and CAP doesn’t help, so transcription is only \u003cstrong>low\u003c/strong>.","_n":"3f0b0","_k":"c357e6ca"},{"t":"High at first, then off","why":"Output stays low while glucose is present.","_n":"3g0c0","_k":"3e39c8c2"}]},"b":{"prompt":"A wild-type \u003ci>E. coli\u003c/i> cell is in a medium with neither glucose nor lactose. What is the lac operon’s output?","options":[{"t":"Off (a trace)","why":"CAP is bound, but the repressor still blocks.","_n":"3h0d0","_k":"0f7333c5"},{"t":"Low","why":"Without an inducer the repressor stays on the operator.","_n":"3i0e0","_k":"24f4f54a"},{"t":"It depends on the amount of cAMP","why":"CAP helps RNA polymerase, but a bound repressor still blocks it: no lactose means off.","_n":"3j170","_k":"5c570540"},{"t":"High","why":"CAP helps RNA polymerase, but a bound repressor still blocks it: no lactose means off.","_n":"3k180","_k":"0049a64a"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"An Oᶜ mutant (operator the repressor can’t bind) is grown with no lactose and no glucose. What happens?","options":[{"t":"The repressor isn’t made","why":"The repressor is made; it just can’t bind.","_n":"3l151","_k":"2609b6d3"},{"t":"The operon is transcribed at a high level","why":"Nothing blocks it, and CAP helps.","_n":"3m141","_k":"f80c73a4"},{"t":"It is off, because there’s no lactose","why":"The repressor can’t bind the changed operator.","_n":"3n131","_k":"091303ab"},{"t":"It is low, because there’s no inducer","why":"No inducer is needed if the repressor can’t bind.","_n":"3o121","_k":"0d38bf27"}]},"b":{"prompt":"A \u003ci>lacI\u003c/i>⁻ mutant (no working repressor) is grown with no lactose and no glucose. What happens?","options":[{"t":"The operon is transcribed at a high level","why":"There’s no repressor to block it, and with no glucose CAP helps.","_n":"3p111","_k":"ff8a6c00"},{"t":"It is off, because there’s no lactose","why":"There’s no repressor to block it.","_n":"3q101","_k":"bf8dccef"},{"t":"It is low","why":"With no glucose, CAP is bound: high.","_n":"3r0f1","_k":"705947fd"},{"t":"It is off, because the operator is missing","why":"The operator is fine; the repressor is missing.","_n":"3s0e1","_k":"b4f23a3b"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"A cell has two copies of the lac region: the chromosome is \u003ci>I\u003c/i>⁻ O⁺ \u003ci>Z\u003c/i>⁺ and a plasmid is \u003ci>I\u003c/i>⁺ O⁺ \u003ci>Z\u003c/i>⁻. With no lactose (and no glucose), is working β-galactosidase made?","options":[{"t":"Yes, but only from the plasmid","why":"The plasmid’s \u003ci>Z\u003c/i> is faulty.","_n":"3t1d1","_k":"dc0ce42e"},{"t":"Yes, at a low level: there’s no glucose","why":"Without an inducer, the repressor blocks both.","_n":"3u1c1","_k":"950b4248"},{"t":"No: the plasmid’s repressor binds both operators, including the chromosome’s","why":"The repressor is a protein that diffuses anywhere in the cell. An operator only controls the genes right next to it.","_n":"3va30","_k":"b95f0adb"},{"t":"Yes, at a high level: the chromosome has no repressor gene","why":"Repressor proteins move freely in the cell.","_n":"3wa40","_k":"ce53ab82"}]},"b":{"prompt":"A cell’s chromosome is \u003ci>I\u003c/i>⁺ Oᶜ \u003ci>Z\u003c/i>⁺ and a plasmid is \u003ci>I\u003c/i>⁺ O⁺ \u003ci>Z\u003c/i>⁻. With no lactose (and no glucose), is working β-galactosidase made?","options":[{"t":"No: there’s no lactose","why":"Oᶜ doesn’t need an inducer.","_n":"3xa10","_k":"f57552d0"},{"t":"No: the plasmid’s working repressor shuts it off","why":"A repressor can’t bind an Oᶜ operator.","_n":"3ya20","_k":"6f2c3e8e"},{"t":"Yes, at a high level: the repressor can’t bind the Oᶜ operator next to \u003ci>Z\u003c/i>⁺","why":"The repressor is a protein that diffuses anywhere in the cell. An operator only controls the genes right next to it.","_n":"3z9f0","_k":"295259e6"},{"t":"Yes, but faulty","why":"The \u003ci>Z\u003c/i>⁺ copy is next to Oᶜ, so it’s the working one.","_n":"40a00","_k":"4534d214"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why \u003ci>E. coli\u003c/i>’s lac control helps it survive?","options":[{"t":"“It makes lactose enzymes only when lactose is available and glucose, the easier sugar, has run out, so it doesn’t waste energy on unneeded proteins.”","why":"It names both conditions and the energy saving.","_n":"419d0","_k":"301ce172"},{"t":"“It makes lactose enzymes all the time so it’s always ready.”","why":"That would waste energy.","_n":"429e0","_k":"9d51ea37"},{"t":"“It destroys glucose so it can use lactose.”","why":"It uses glucose first.","_n":"439b0","_k":"f1d26115"},{"t":"“It changes its DNA when lactose arrives.”","why":"Regulation switches genes; it doesn’t change them.","_n":"449c0","_k":"2e6da61b"}]},"b":{"prompt":"Which is the best explanation of why lac output is low when both sugars are present?","options":[{"t":"“The two sugars cancel out.”","why":"There’s a mechanism: the repressor and CAP.","_n":"45090","_k":"362811b3"},{"t":"“Lactose is broken down before it can act.”","why":"Some lactose still becomes allolactose.","_n":"46080","_k":"a31441c9"},{"t":"“Lactose removes the repressor, but glucose keeps cAMP low, so CAP can’t boost transcription; the cell keeps using glucose first.”","why":"It explains both regulators and the result.","_n":"470b0","_k":"dcadb1cd"},{"t":"“Glucose binds the repressor and puts it back on.”","why":"Glucose acts through cAMP and CAP.","_n":"480a0","_k":"3bea79be"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which map of the lac region is in the correct order (left to right, in the direction of transcription)?","options":[{"t":"\u003ci>lacZ\u003c/i> · \u003ci>lacY\u003c/i> · \u003ci>lacA\u003c/i> · operator · promoter","why":"Control sites come before the genes they control.","_n":"490d0","_k":"045c7a62"},{"t":"Operator · promoter · \u003ci>lacI\u003c/i> · \u003ci>lacZ\u003c/i> · \u003ci>lacY\u003c/i>","why":"\u003ci>lacI\u003c/i> is separate, with its own promoter.","_n":"4a0c0","_k":"2b4d0bdd"},{"t":"Promoter · \u003ci>lacZ\u003c/i> · operator · \u003ci>lacY\u003c/i> · \u003ci>lacA\u003c/i>","why":"The operator must sit between the promoter and the genes.","_n":"4b0f0","_k":"33143de3"},{"t":"\u003ci>lacI\u003c/i> (with its own promoter) · · · CAP site · promoter · operator · \u003ci>lacZ\u003c/i> · \u003ci>lacY\u003c/i> · \u003ci>lacA\u003c/i>","why":"Control sites come before the genes, with the operator between the promoter and \u003ci>lacZ\u003c/i>; \u003ci>lacI\u003c/i> is separate.","_n":"4c0e0","_k":"9af18c96"}]},"b":{"prompt":"Which map of the trp region is in the correct order?","options":[{"t":"Promoter · trp genes · operator","why":"The operator sits between the promoter and the genes.","_n":"4d110","_k":"df9e8d31"},{"t":"\u003ci>trpR\u003c/i> inside the operator","why":"The operator is a binding site, not a gene.","_n":"4e100","_k":"8a7c6ed5"},{"t":"Operator · trp genes · promoter","why":"Polymerase starts at the promoter, before the operator.","_n":"4f970","_k":"e2651f79"},{"t":"\u003ci>trpR\u003c/i> (separate, with its own promoter) · · · promoter · operator · the five trp enzyme genes","why":"The operator sits between the promoter and the genes; \u003ci>trpR\u003c/i> is separate.","_n":"4g980","_k":"1115af38"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Biotechnologists put a gene for a human protein after a lac promoter and operator on a plasmid. They grow the bacteria in a glucose-free medium, then add IPTG when the culture is dense. Why?","options":[{"t":"IPTG inserts the gene into the chromosome","why":"It doesn’t change DNA.","_n":"4h990","_k":"f3d3d69d"},{"t":"IPTG feeds the bacteria","why":"Cells can’t use IPTG as food.","_n":"4i9a0","_k":"a8ce0b18"},{"t":"IPTG releases the repressor, so the protein is made only when they choose, and IPTG isn’t used up, so production stays on","why":"The repressor keeps the gene off while the cells grow; IPTG switches it on for good.","_n":"4j9b0","_k":"76ee7b5b"},{"t":"Without IPTG, the plasmid is lost","why":"IPTG controls transcription only.","_n":"4k9c0","_k":"d6fad48c"}]},"b":{"prompt":"Why do biotechnologists usually switch on a lac-controlled gene with IPTG rather than lactose?","options":[{"t":"Lactose binds the operator and blocks the gene","why":"The inducer binds the \u003cstrong>repressor protein\u003c/strong>, which then lets go of the operator.","_n":"4l9d0","_k":"42522134"},{"t":"Lactose can’t enter bacteria","why":"Permease brings it in.","_n":"4m9e0","_k":"e7f982f0"},{"t":"Lactose is broken down by β-galactosidase, so its effect fades; IPTG binds the repressor but isn’t broken down","why":"A steady inducer keeps the gene on.","_n":"4n8f0","_k":"95b68d94"},{"t":"IPTG also adds glucose","why":"It doesn’t.","_n":"4o900","_k":"358cc00b"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"\u003ci>E. coli\u003c/i> is moved into a broth rich in tryptophan. What happens to its trp operon, and why?","options":[{"t":"It switches off: tryptophan activates the trp repressor, which binds the operator","why":"Tryptophan is a \u003cstrong>corepressor\u003c/strong>: it \u003cstrong>activates\u003c/strong> the trp repressor so it binds the operator.","_n":"4p9d0","_k":"2df8d8fb"},{"t":"It switches off because tryptophan breaks down the trp mRNA","why":"It works through the repressor.","_n":"4q9c0","_k":"977079e2"},{"t":"It stays on: the cell always needs tryptophan","why":"It can take Trp from the broth instead.","_n":"4r9b0","_k":"1461c830"},{"t":"It switches on: tryptophan is the inducer","why":"Tryptophan is a \u003cstrong>corepressor\u003c/strong>: it \u003cstrong>activates\u003c/strong> the trp repressor so it binds the operator.","_n":"4s9a0","_k":"059c3a76"}]},"b":{"prompt":"A culture runs out of tryptophan. What happens to its trp operon, and why?","options":[{"t":"It switches off, to save energy","why":"The cell now needs to make its own Trp.","_n":"4ta10","_k":"62c74d91"},{"t":"It switches on because tryptophan binds RNA polymerase","why":"Trp acts on the repressor.","_n":"4ua00","_k":"107e79d5"},{"t":"It switches on: with no corepressor, the repressor is inactive and leaves the operator","why":"The cell now needs to make its own Trp.","_n":"4v9f0","_k":"6370cb2b"},{"t":"It stays off until lactose arrives","why":"Lactose controls lac, not trp.","_n":"4w9e0","_k":"0bd4ee46"}]}}]},"task":{"title":"Build a lactose-ready strain","summary":"Build a lactose-ready strain","statement":"\u003cp>A lab wants \u003ci>E. coli\u003c/i> that is already making working lac enzymes at full strength \u003cstrong>before\u003c/strong> any lactose arrives, so it can start using lactose instantly. Choose a genotype and growth conditions that meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"lo-conds\">\u003cli>Working β-galactosidase is made at a \u003cstrong>high\u003c/strong> level.\u003c/li>\u003cli>There is \u003cstrong>no lactose\u003c/strong> (and no IPTG) in the medium.\u003c/li>\u003cli>Working permease is made, so lactose can get in when it arrives.\u003c/li>\u003c/ol>","inputs":{"I":"\u003ci>I\u003c/i>","O":"O","Z":"\u003ci>Z\u003c/i>","Y":"\u003ci>Y\u003c/i>","glu":"Glucose","lac":"Lactose","iptg":"IPTG"},"checks":["Working β-galactosidase, high","No lactose, no IPTG","Working permease"],"tips":["High output needs the repressor off the operator and CAP’s help.","With no inducer, which mutations stop the repressor blocking?","Lactose can’t get in without the permease from \u003ci>lacY\u003c/i>."],"success":"Your strain is lactose-ready!","explainPrompt":"Explain why each of your strains makes lac enzymes without lactose, and why glucose must be absent.","vocab":"Use the words repressor, operator, constitutive, CAP and cAMP.","after3":"All three are constitutive: the repressor is missing or can’t bind. In nature, such strains waste energy when there’s no lactose, which is why wild-type control is the norm."},"cards":[["Operon","Genes transcribed together from one promoter and controlled by one operator (bacteria)."],["\u003ci>lacZ\u003c/i>, \u003ci>lacY\u003c/i>, \u003ci>lacA\u003c/i>","β-galactosidase (splits lactose), permease (lets lactose in), transacetylase."],["\u003ci>lacI\u003c/i>","Separate gene, always on; makes the lac repressor."],["Operator","DNA site between the promoter and the genes, where the repressor binds."],["Inducer","Allolactose (or IPTG in the lab): binds the repressor so it lets go."],["CAP–cAMP","Helps RNA polymerase when glucose is low (cAMP high)."],["lac logic","High only with lactose present \u003cstrong>and\u003c/strong> glucose absent; low with both; off without lactose."],["Constitutive","Always on: \u003ci>lacI\u003c/i>⁻ or Oᶜ mutants."],["Cis vs trans","Operators act only on genes beside them; repressors act anywhere in the cell."],["Inducible operon","Off by default; switched on by an inducer (lac: breaking down a food)."],["Repressible operon","On by default; switched off by a corepressor (trp: building a product)."],["Corepressor","Tryptophan: activates the trp repressor so it binds the operator."]]}};</script>
