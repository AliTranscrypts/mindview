.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 40 Action Potential: membrane strip, trace, axon, stations, Label the trace, task. Tokens only.
   Na⁺ teal (--bio-nadh), K⁺ violet (--bio-e), ATP orange (--bio-atp), trace --pen, guides --ink-2 dashed, myelin --ink-2. */
/* radio groups (copied from SBI4U 04) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* hero */
.ap-heq{display:inline-block;font-size:.72em;line-height:1.35;font-family:var(--font-ui)}
.ap-hero{max-width:560px;margin:0 auto}
.ap-svg{display:block;width:100%;height:auto;overflow:visible}
.ap-lab{font:700 11px var(--font-ui);fill:var(--ink)}
.ap-sub{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.ap-guide{stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:7 5;fill:none}
.ap-flash{stroke:var(--hi);stroke-width:3;stroke-dasharray:none}
.ap-htr{fill:none;stroke:var(--pen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ap-htr.thin{stroke-width:2.2}
.ap-stim{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* S4 membrane strip */
.ap-mem{fill:var(--rule);opacity:.6}
.ap-meml{stroke:var(--ink-2);stroke-width:1.2}
.ap-pore{fill:var(--sheet)}
.ap-ch{fill:var(--sheet);stroke-width:2.4}
.ap-ch.ap-chna,.ap-gate.ap-chna{stroke:var(--bio-nadh)}
.ap-ch.ap-chk,.ap-gate.ap-chk{stroke:var(--bio-e)}
.ap-gate{stroke-width:5;stroke-linecap:round}
.ap-ball.ap-chna{fill:var(--bio-nadh)}
.ap-ball.ap-chk{fill:var(--bio-e)}
.ap-lock{fill:var(--ink)}
.ap-lockb{fill:none;stroke:var(--ink);stroke-width:1.6}
.ap-drug{fill:var(--ink)}
.ap-drugt{font:700 13px var(--font-ui);fill:var(--sheet)}
.ap-dna{fill:var(--bio-nadh);stroke:var(--sheet);stroke-width:1}
.ap-dk{fill:var(--bio-e);stroke:var(--sheet);stroke-width:1}
.ap-pump{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.ap-pump.on{stroke:var(--bio-atp);stroke-width:3}
.ap-atp{fill:var(--bio-atp)}
.ap-atpt{font:700 10px var(--font-ui);fill:var(--sheet)}
.ap-flna{font:700 11px var(--font-ui);fill:var(--bio-nadh)}
.ap-flk{font:700 11px var(--font-ui);fill:var(--bio-e)}

/* Explore */
.ap-row{margin:0 0 12px}
.ap-cb{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.92rem;min-height:32px}
.ap-cb input{width:20px;height:20px;accent-color:var(--ink)}
.ap-chips{display:flex;flex-wrap:wrap;gap:6px 10px;margin:8px 0 4px}
.ap-chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:999px;padding:.2em .75em;font-size:.88rem;font-weight:700;background:var(--sheet)}
.ap-chv{margin:4px 0 6px}
.ap-chv summary{cursor:pointer;font-weight:700;font-size:.92rem;padding:4px 0}
.ap-strip{max-width:560px}
.ap-cap{font-size:.92rem;color:var(--ink-2);margin:6px 0 0}
.ap-note{margin-top:12px}
.ap-watch{margin:4px 0 6px;font-size:.95rem}
.ap-sw{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.ap-axw{max-width:560px}

/* axon */
.ap-axon{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.ap-my{fill:var(--ink-2);opacity:.55}
.ap-myd{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:4 3}
.ap-pulse{fill:var(--hi);stroke:var(--ink);stroke-width:1.5}
.ap-dir{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Part 3 stations */
.ap-st h3{margin-top:0}
.ap-bars{display:flex;gap:8px;align-items:flex-end;margin:10px 0 12px;max-width:520px}
.ap-bar{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:6px 4px;cursor:pointer;min-height:44px}
.ap-bar:hover,.ap-bar:focus-visible{border-color:var(--ink)}
.ap-bar.good{border:2px solid var(--green);background:var(--good-bg)}
.ap-bar.bad{border:2px solid var(--red);background:var(--bad-bg)}
.ap-barv{position:relative;display:block;width:60%;height:110px}
.ap-barv i{position:absolute;left:0;right:0;bottom:0;background:var(--pen);border-radius:4px 4px 0 0}
.ap-barn{font-weight:700;font-size:.88rem}
.ap-barl{font-size:.8rem;color:var(--ink-2);text-align:center;line-height:1.2}
.ap-tbl{border-collapse:collapse;font-size:.9rem}
.ap-tbl th,.ap-tbl td{border:1px solid var(--rule);padding:4px 8px;text-align:center}
.ap-tbl th[scope="row"]{text-align:left}
.ap-wp{margin:12px 0 6px}
.ap-s2pic{max-width:560px}
.ap-patch{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3}
.ap-patch.fire{fill:var(--hi);stroke:var(--ink)}
.ap-patch.refr{fill:var(--rule);stroke:var(--ink-2);stroke-dasharray:4 3}
.ap-s2t{font-weight:700;margin:6px 0}

/* Practice: Label the trace */
.ap-lt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px 22px;align-items:start}
.ap-lt > *{min-width:0}
.ap-ltw{border-radius:8px}
.ap-ltw:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ap-ltw canvas{cursor:crosshair}
.ap-ltp{font-weight:700;margin:6px 0 0}
.ap-ltd{margin:10px 0 0;padding-left:1.4em;font-size:.9rem}
.ap-ltd li{margin:4px 0}
.ap-ok{color:var(--green);font-weight:700}
.ap-fu{border-left:4px solid var(--rule);padding-left:12px}

/* task */
.ap-tin > div{margin:0 0 12px}
.ap-ttr{max-width:560px;margin-top:6px}
.ap-conds{margin:.4em 0 0 1.2em}

@media (max-width:640px){
  .ap-lt{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){
  .ap-barv{height:80px}
  .ap-barl{font-size:.72rem}
  .ap-bars{gap:4px}
}

s the same size: \u003cstrong>all or none\u003c/strong>.","fig":{"html":"\u003cdiv class=\"ap-hero\" id=\"ap-hero\" role=\"img\" aria-label=\"Top: a voltage–time trace over about 4 ms. It sits flat at −70 mV, a stimulus nudges it to the −55 mV threshold, it shoots up to +35 mV, falls past −70 to −80 mV, and settles back at −70 mV. Bottom: a strip of axon membrane with a teal Na⁺ channel, a violet K⁺ channel and a pump with an orange ATP badge. Teal Na⁺ dots stream in through the open Na⁺ channel on the way up; the Na⁺ channel then locks (inactivated), the K⁺ channel opens and violet K⁺ dots stream out on the way down; the pump restores the dots at rest.\">\u003c/div>"}},"goals":["I can explain how the Na⁺/K⁺ pump and leak channels create the −70 mV resting potential.","I can describe each phase of an action potential in terms of which channels open or close and which ions move.","I can explain threshold and the all-or-none response.","I can explain the refractory period and how it limits frequency and keeps impulses moving one way.","I can explain how myelin and axon diameter affect conduction speed, and calculate travel time.","I can predict how drugs, toxins or disease that affect channels or myelin change nerve signals."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Neuron structure","goal":5,"prompt":"Which part of a neuron carries impulses away from the cell body?","options":[{"t":"The myelin sheath","why":"Myelin wraps the axon; it isn’t the pathway itself.","_n":"0d70","_k":"4a5118de"},{"t":"The axon","why":"Axons carry signals away; dendrites bring them in.","_n":"1d60","_k":"fd9f8579"},{"t":"The nucleus","why":"The nucleus holds DNA.","_n":"2d50","_k":"3624ceee"},{"t":"The dendrites","why":"Dendrites receive signals.","_n":"3d40","_k":"54c0d7ee"}],"hints":["Think of the long ‘cable’.","It ends at the axon terminals.","The axon."]},{"id":"w2","skill":"Neuron structure","goal":5,"prompt":"What is the myelin sheath made of?","options":[{"t":"Metal ions that conduct current","why":"Myelin is fatty and insulating.","_n":"4d30","_k":"d815cd6e"},{"t":"Protein fibres that pull the axon","why":"That describes muscle.","_n":"5d20","_k":"0cdf6af6"},{"t":"A layer of bone","why":"Bone protects the spinal cord, but myelin is membrane.","_n":"6d10","_k":"18da5e3e"},{"t":"Layers of cell membrane from glial cells wrapped around the axon","why":"Schwann cells (in nerves) or oligodendrocytes (in the brain and spinal cord).","_n":"7e00","_k":"5db02186"}],"hints":["It’s mostly lipid.","Glial cells wrap around the axon many times.","Layers of glial cell membrane."]},{"id":"w3","skill":"Diffusion and gradients","goal":1,"prompt":"If a channel for an ion opens, which way does the ion move by diffusion?","options":[{"t":"It doesn’t move unless ATP is used","why":"Diffusion through a channel needs no ATP.","_n":"8df0","_k":"0644a2a7"},{"t":"From lower to higher concentration","why":"That needs a pump and energy.","_n":"963a","_k":"dfafb2f2"},{"t":"From higher concentration to lower concentration","why":"Down its gradient.","_n":"a64a","_k":"d592195a"},{"t":"Always into the cell","why":"It depends on which side is higher.","_n":"b61a","_k":"fd6887bb"}],"hints":["Diffusion goes downhill.","High to low.","Down the gradient."]},{"id":"w4","skill":"Diffusion and gradients","goal":1,"prompt":"A pump moves ions against their gradient. What does it use?","options":[{"t":"Light energy","why":"That’s photosynthesis.","_n":"c62a","_k":"c51e5021"},{"t":"Energy from ATP","why":"Active transport.","_n":"d67a","_k":"fd432d78"},{"t":"Water pressure","why":"Pumps in membranes run on ATP.","_n":"e68a","_k":"d09cc7ed"},{"t":"Nothing; ions move by themselves","why":"Moving against a gradient takes energy.","_n":"f65a","_k":"3329d30b"}],"hints":["Is it uphill or downhill?","Uphill needs energy.","ATP."]},{"id":"w5","skill":"Ions and charge","goal":2,"prompt":"If positive ions flow \u003cstrong>into\u003c/strong> a cell, what happens to the inside’s charge?","options":[{"t":"It becomes neutral at exactly 0 mV","why":"It can overshoot 0.","_n":"g66a","_k":"35cbd1e9"},{"t":"It becomes less negative (more positive)","why":"Adding positive charge raises the voltage.","_n":"h6ba","_k":"7f3aa449"},{"t":"It doesn’t change","why":"Moving charge changes voltage.","_n":"i6ca","_k":"dc020d52"},{"t":"It becomes more negative","why":"That happens when positive ions leave.","_n":"jfda","_k":"d11792ca"}],"hints":["Positive in means…","…more positive inside.","Less negative."]},{"id":"w6","skill":"Ions and charge","goal":2,"prompt":"Which pair of ions matters most for nerve impulses?","options":[{"t":"Na⁺ and K⁺","why":"Sodium and potassium.","_n":"kfca","_k":"ee2b439f"},{"t":"Ca²⁺ and Fe²⁺","why":"Ca²⁺ matters at synapses (module 41); iron doesn’t.","_n":"lfba","_k":"fe220c7a"},{"t":"Na⁺ and Cl⁻ only","why":"Cl⁻ matters for inhibition; K⁺ is essential here.","_n":"mfaa","_k":"cc76c2d0"},{"t":"H⁺ and OH⁻","why":"Those are acid–base ions.","_n":"nf9a","_k":"bd7aeeef"}],"hints":["Bananas are known for one of them.","Table salt has the other.","Na⁺ and K⁺."]}],"refreshers":{"Neuron structure":"Dendrites → cell body → axon → axon terminals. Myelin is insulating membrane wrapped around the axon, with gaps called nodes of Ranvier.","Diffusion and gradients":"Through open channels, ions diffuse down their gradients (no ATP). Pumps use ATP to move ions up their gradients.","Ions and charge":"Positive ions entering make the inside more positive; positive ions leaving make it more negative."}}},"explore":{"heading":"Neuron membrane lab","intro":"Stimulate the membrane and watch the trace. Open the channel view to see which gates are open at each moment.","modelNote":"Model values: rest −70 mV, threshold −55 mV, peak +35 mV. Same settings, same numbers.","predIntro":"Make a prediction first. Then the membrane lab will show you what really happens.","predictions":[{"id":"p1","prompt":"Single spike, stimulus 10 mV. You press Play. What will the trace do?","options":[{"t":"Rise to −60 mV and fade, with no spike","_n":"of8a","_k":"4fbb9e18"},{"t":"Spike to +35 mV","_n":"pf7a","_k":"eb96937f"},{"t":"Drop to −80 mV","_n":"qf6a","_k":"89c692f3"},{"t":"Spike to a smaller peak, about 0 mV","_n":"rf5a","_k":"f846935f"}],"explain":"−60 mV is below the −55 mV threshold, so the Na⁺ gates never fling open.","start":{"mode":"single","stim":10,"t":0}},{"id":"p2","prompt":"Single spike at 15 mV. The stimulus goes up to 30 mV. How does the new spike compare?","options":[{"t":"Same peak, +35 mV","_n":"sf4a","_k":"0706e6f0"},{"t":"Shorter","_n":"tf7a","_k":"249d428b"},{"t":"Slightly taller","_n":"uf8a","_k":"0675b70d"},{"t":"Twice as tall","_n":"vf9a","_k":"38743b37"}],"explain":"All or none: once threshold is passed, the channels set the size.","start":{"mode":"single","stim":15,"t":5},"to":{"stim":30}},{"id":"p3","prompt":"Single spike, 30 mV. Now voltage-gated Na⁺ channels are blocked. What happens?","options":[{"t":"No spike: only a local depolarization","_n":"wfaa","_k":"cb763ba1"},{"t":"A bigger spike","_n":"xf3a","_k":"8e246993"},{"t":"A spike that never ends","_n":"yf4a","_k":"bd813e65"},{"t":"A normal spike, because the pump still works","_n":"zf5a","_k":"d9f702f7"}],"explain":"No Na⁺ rush, no depolarization phase. This is how local anaesthetics stop pain signals.","start":{"mode":"single","stim":30,"t":5},"to":{"blockNa":true}},{"id":"p4","prompt":"Propagation, 1.0 m, unmyelinated thin axon. You switch to a myelinated thick axon. How long does the trip take now?","options":[{"t":"100 ms","_n":"10f6a","_k":"21001f43"},{"t":"10 ms instead of 1000 ms","_n":"11efa","_k":"8b5fcbd0"},{"t":"The same time","_n":"12f0a","_k":"f1926097"},{"t":"500 ms","_n":"13f1a","_k":"ad28bc8b"}],"explain":"1.0 m ÷ 100 m/s = 0.01 s. Myelin plus a thick axon is 100 times faster here.","start":{"mode":"prop","my":"u","dia":"thin","dist":1},"to":{"my":"m","dia":"thick"}}],"challenges":[{"id":"tc1","goal":3,"prompt":"Single spike: find the weakest stimulus that fires an action potential.","why":"−70 + 15 = −55 mV: exactly threshold, so the voltage-gated Na⁺ channels fling open and the spike runs.","general":"Use Single spike mode with no blockers, and watch whether the trace passes −55 mV.","hints":["Threshold is −55 mV.","How far is −70 from −55?","15 mV."]},{"id":"tc2","goal":2,"prompt":"Scrub to the first moment the membrane is falling while the Na⁺ channels are still inactivated.","why":"At 1.5 ms the membrane has fallen to −20 mV: K⁺ is leaving while the Na⁺ channels are still inactivated.","general":"Use Single spike mode with a stimulus that fires and no blockers, then move the time slider.","hints":["Find the peak first.","Just after the peak, K⁺ is leaving.","1.5 ms."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Propagation: a reflex signal must travel 0.5 m in \u003cstrong>at most\u003c/strong> 10 ms. Choose the \u003cstrong>thinnest\u003c/strong> axon that does it.","why":"0.5 m ÷ 50 m/s = 10 ms: the thin myelinated axon just makes it.","general":"Use Propagation mode with the distance at 0.5 m and healthy myelin.","hints":["Travel time = distance ÷ speed.","10 ms = 0.01 s, so you need at least 0.5 ÷ 0.01 = 50 m/s.","The thin myelinated axon is exactly 50 m/s."]}]},"part3":{"slug":"coding","name":"Coding","heading":"How a signal codes strength","intro":"Every spike is the same size. So how does a neuron report a firm touch, what limits it, and what happens when myelin or channels fail? Work through the three stations, then try the quick check.","s1":{"title":"Station 1: pressure on a fingertip","intro":"Model recordings from one touch-sensitive neuron. Check it with data: tap the column where the firing rate stops rising.","cols":[{"id":"none","t":"none","rate":0,"peak":"—"},{"id":"light","t":"light","rate":10,"peak":"+35"},{"id":"medium","t":"medium","rate":40,"peak":"+35"},{"id":"firm","t":"firm","rate":80,"peak":"+35"},{"id":"vfirm","t":"very firm","rate":80,"peak":"+35"}],"_a":"bRsEUUdaRBkUTwRRR1pEaA==","colGood":"From firm to very firm the rate stays at 80 per second, while every spike still peaks at +35 mV. The rate has levelled off.","colBad":{"none":"No pressure, no spikes. Look further right, where the numbers stop climbing.","light":"The rate still rises after light (10 → 40). Look further right.","medium":"The rate still rises after medium (40 → 80). Look further right."},"whyPrompt":"Why does the rate stop rising?","options":[{"t":"The refractory period sets a maximum firing rate; this neuron can’t fire faster.","why":"Each spike is followed by a refractory period, so there is a top speed.","_n":"14f0a","_k":"b2380162"},{"t":"The pressure receptor wears out.","why":"The rate holds steady at 80; it doesn’t drop. Each spike needs time to reset.","_n":"15f3a","_k":"2ec45b3f"},{"t":"The pump runs out of ATP.","why":"The pump sets up the gradients over time. The action potential is driven by \u003cstrong>voltage-gated channels\u003c/strong>.","_n":"16f2a","_k":"0ddae215"},{"t":"The spikes get smaller, so they can’t be counted.","why":"Every action potential peaks at about +35 mV. Strength shows up as \u003cstrong>more\u003c/strong> action potentials per second.","_n":"17f5a","_k":"ba94447b"}]},"s2":{"title":"Station 2: why one way?","steps":["The impulse is at patch 3.","Patch 2, behind it, is in its absolute refractory period.","Patch 4, ahead, is depolarized to threshold and fires."],"text":"The refractory patch behind the spike can’t fire, so the impulse always moves forward."},"s3":{"title":"Station 3: when myelin or channels fail","intro":"Model data for conduction along a 0.5 m pathway. Choose a condition and send an impulse.","conds":[{"id":"h","t":"Healthy myelinated","ms":10},{"id":"p","t":"Partly demyelinated","ms":20},{"id":"s","t":"Severely demyelinated","ms":null}],"ms":"In multiple sclerosis, the immune system damages myelin in the brain and spinal cord, slowing or blocking signals. Canada has one of the highest rates of MS in the world.","blockers":"\u003cstrong>Channel blockers (mechanism only).\u003c/strong> A local anaesthetic blocks voltage-gated Na⁺ channels in pain-sensing neurons, so they can’t fire. Tetrodotoxin, from pufferfish, blocks the same channels throughout the body, which is why it is so dangerous."},"quickCheck":{"title":"Quick check","summary":"How a signal codes strength quick check","items":[{"id":"q1","goal":3,"prompt":"A firmer touch gives…","choices":[{"t":"more action potentials per second","fb":"Spike size is fixed; frequency rises.","_n":"18f4a","_k":"1c054962"},{"t":"taller action potentials","fb":"Spike size is fixed; frequency rises.","_n":"19f7a","_k":"48b97167"},{"t":"slower action potentials","fb":"Spike size is fixed; frequency rises.","_n":"1af6a","_k":"77c0eed2"},{"t":"longer action potentials","fb":"Spike size is fixed; frequency rises.","_n":"1be9a","_k":"a7564737"}]},{"id":"q2","goal":4,"prompt":"Why does the firing rate level off?","choices":[{"t":"The refractory period sets a maximum rate","fb":"Each spike needs time to reset.","_n":"1ce8a","_k":"cee39d78"},{"t":"The neuron runs out of Na⁺","fb":"Each spike needs time to reset.","_n":"1deb9","_k":"e3b25aea"},{"t":"The pump stops","fb":"Each spike needs time to reset.","_n":"1eec9","_k":"7c1336f6"},{"t":"Spikes get smaller","fb":"Each spike needs time to reset.","_n":"1fe99","_k":"12e4f003"}]},{"id":"q3","goal":4,"prompt":"Why can’t the impulse turn back?","choices":[{"t":"Myelin blocks backward flow","fb":"The patch just behind the impulse is refractory, so it can’t fire again right away.","_n":"1gea9","_k":"1b816862"},{"t":"The axon is one-way tubing","fb":"The patch just behind the impulse is refractory, so it can’t fire again right away.","_n":"1he79","_k":"93d2f29f"},{"t":"Na⁺ only moves forward","fb":"The patch just behind the impulse is refractory, so it can’t fire again right away.","_n":"1ie89","_k":"b96e0559"},{"t":"The patch behind it is refractory","fb":"The patch just behind the impulse is refractory, so it can’t fire again right away.","_n":"1je59","_k":"574595b8"}]},{"id":"q4","goal":6,"prompt":"Why does demyelination slow signals?","choices":[{"t":"The impulse can no longer jump between nodes","fb":"Myelin insulates; without it, conduction is slow and can fail.","_n":"1ke69","_k":"9bc6bcfe"},{"t":"Myelin makes the electricity","fb":"Myelin insulates; without it, conduction is slow and can fail.","_n":"1lf39","_k":"fc0b4bbe"},{"t":"Axons shrink","fb":"Myelin insulates; without it, conduction is slow and can fail.","_n":"1mf49","_k":"a5132ae8"},{"t":"Na⁺ channels multiply","fb":"Myelin insulates; without it, conduction is slow and can fail.","_n":"1n659","_k":"b62fe1e2"}]}]}},"practice":{"activities":[{"id":"trace","type":"custom","title":"Label the trace","summary":"Label the trace","goal":[2,3,4],"how":"","instruction":"Tap the point or stretch of the trace that each prompt asks for. Keyboard: Tab to the graph, move along the trace with the arrow keys, then press Enter.","items":[{"id":"l1","goal":2,"prompt":"Tap the resting potential.","_a":"bRRTFBgHSARr","name":"rest","done":"The flat line at −70 mV before the stimulus."},{"id":"l2","goal":3,"prompt":"Tap the threshold.","_a":"bQlMDBkHSANr","name":"threshold","done":"At −55 mV the steep rise begins."},{"id":"l3","goal":2,"prompt":"Tap where Na⁺ rushes in fastest.","_a":"bQlMDhkHSAxr","name":"Na⁺ in","done":"The steep rising stretch, −55 to +35 mV.","wrong":[{"range":[1.1,2],"fb":"Falling means K⁺ is leaving. Na⁺ rushes in on the way up."}]},{"id":"l4","goal":2,"prompt":"Tap the peak.","_a":"bQlMARkGSARr","name":"peak","done":"+35 mV."},{"id":"l5","goal":2,"prompt":"Tap where K⁺ is flowing out and the voltage is falling.","_a":"bQhMCRkFOw==","name":"K⁺ out","done":"The falling stretch, +35 down to −70 mV."},{"id":"l6","goal":2,"prompt":"Tap the hyperpolarization.","_a":"bQtMCRkESAxr","name":"hyperpolarization","done":"The dip below −70 mV, down to −80 mV."},{"id":"l7","goal":4,"prompt":"Tap a moment in the absolute refractory period.","_a":"bQhOCRsCOw==","name":"absolute","done":"1.0–1.5 ms: the Na⁺ channels are inactivated, so nothing can fire.","wrong":[{"range":[2,3],"fb":"Na⁺ channels have reset by then; that’s the relative period."}]},{"id":"l8","goal":4,"prompt":"Tap a moment when a stronger-than-usual stimulus could start a new spike.","_a":"bQtOC2g=","name":"relative","done":"The relative refractory period, 2.0–3.0 ms.","hints":["When have the Na⁺ channels reset but the membrane isn’t back to normal?","During the undershoot.","2.0–3.0 ms."]}],"wrongDefault":"Read the voltage at the point you tapped and compare it with the prompt."},{"id":"whatif","type":"custom","title":"What if…?","summary":"What if…?","star":true,"goal":[1,6],"how":"","instruction":"Predict what each change does to the neuron. Items marked ★ are non-routine.","items":[{"id":"wi1","goal":6,"prompt":"Voltage-gated K⁺ channels are blocked. What happens?","options":[{"t":"No spike","why":"“No spike” is what a Na⁺ blocker does.","_n":"1o649","_k":"d4c8f14e"},{"t":"No change","why":"Block Na⁺ channels: no action potential. Block K⁺ channels: an action potential that’s slow to end.","_n":"1p639","_k":"3eba6762"},{"t":"Longer spike that’s slow to end","why":"Block Na⁺ channels: no action potential. Block K⁺ channels: an action potential that’s slow to end.","_n":"1q629","_k":"691bc899"},{"t":"Bigger spike","why":"Block Na⁺ channels: no action potential. Block K⁺ channels: an action potential that’s slow to end.","_n":"1r699","_k":"970b213a"}]},{"id":"wi2","goal":6,"prompt":"A second stimulus arrives at 1.0 ms. What happens?","options":[{"t":"A smaller spike","why":"At 1.0 ms the Na⁺ channels are inactivated: the absolute refractory period.","_n":"1s689","_k":"69ec129e"},{"t":"A double-height spike","why":"At 1.0 ms the Na⁺ channels are inactivated: the absolute refractory period.","_n":"1t679","_k":"a129540a"},{"t":"No new spike","why":"At 1.0 ms the Na⁺ channels are inactivated: the absolute refractory period.","_n":"1u669","_k":"a33c9ba9"},{"t":"A second spike","why":"At 1.0 ms the Na⁺ channels are inactivated: the absolute refractory period.","_n":"1v6d9","_k":"265e4827"}]},{"id":"wi3","goal":6,"star":true,"prompt":"A strong second stimulus arrives at 2.5 ms. What happens?","options":[{"t":"A spike is possible","why":"2.5 ms is the relative refractory period: a strong enough stimulus can fire.","_n":"1w6c9","_k":"e3b2368e"},{"t":"Bigger spike","why":"2.5 ms is the relative refractory period: a strong enough stimulus can fire.","_n":"1x5f9","_k":"f0cf3a02"},{"t":"Impossible: absolute refractory","why":"2.5 ms is the relative refractory period: a strong enough stimulus can fire.","_n":"1y609","_k":"b5189f38"},{"t":"Spike in reverse","why":"2.5 ms is the relative refractory period: a strong enough stimulus can fire.","_n":"1z619","_k":"e64fdf1a"}]},{"id":"wi4","goal":1,"star":true,"prompt":"The Na⁺/K⁺ pump is stopped by a poison. What happens?","options":[{"t":"No effect ever","why":"Each spike moves only a tiny fraction of the ions. The pump maintains the gradients over time.","_n":"20629","_k":"a3c5ad1e"},{"t":"Spikes continue at first, then fade as the gradients run down","why":"Each spike moves only a tiny fraction of the ions. The pump maintains the gradients over time.","_n":"21639","_k":"fb3802ed"},{"t":"Spikes get bigger","why":"Each spike moves only a tiny fraction of the ions. The pump maintains the gradients over time.","_n":"22649","_k":"09ce8c72"},{"t":"Spikes stop instantly","why":"Each spike moves only a tiny fraction of the ions. The pump maintains the gradients over time.","_n":"23659","_k":"dd846256"}]},{"id":"wi5","goal":1,"star":true,"prompt":"The K⁺ concentration \u003cstrong>outside\u003c/strong> the neuron rises. What happens?","options":[{"t":"More negative","why":"With less K⁺ difference across the membrane, less K⁺ leaks out, so the inside stays less negative.","_n":"24669","_k":"19c243ce"},{"t":"Spikes get taller","why":"With less K⁺ difference across the membrane, less K⁺ leaks out, so the inside stays less negative.","_n":"25679","_k":"fb293462"},{"t":"No change","why":"With less K⁺ difference across the membrane, less K⁺ leaks out, so the inside stays less negative.","_n":"26689","_k":"bb752c2a"},{"t":"Resting potential becomes less negative","why":"With less K⁺ difference across the membrane, less K⁺ leaks out, so the inside stays less negative.","_n":"2779b","_k":"50382977"}],"hints":["Why does K⁺ leak out at rest?","Its concentration is much higher inside.","Shrink the difference and less K⁺ leaves: the inside is less negative."]},{"id":"wi6","goal":6,"star":true,"prompt":"The Na⁺ concentration \u003cstrong>outside\u003c/strong> falls. What happens?","options":[{"t":"No change","why":"A smaller Na⁺ gradient means less Na⁺ rushes in, so the peak is lower.","_n":"2878b","_k":"52b6b066"},{"t":"Spike peak is lower","why":"A smaller Na⁺ gradient means less Na⁺ rushes in, so the peak is lower.","_n":"297bb","_k":"bb8bbace"},{"t":"Spike peak is higher","why":"A smaller Na⁺ gradient means less Na⁺ rushes in, so the peak is lower.","_n":"2a7ab","_k":"d5f73cce"},{"t":"Resting potential becomes +35","why":"A smaller Na⁺ gradient means less Na⁺ rushes in, so the peak is lower.","_n":"2b75b","_k":"b528c861"}]}],"followUp":{"after":"wi4","id":"wi4x","title":"Investigation follow-up","prompt":"To test whether a poison stops the pump, which measurement over 30 minutes would you make?","options":[{"t":"Peak of one spike right away","why":"One spike right away will look normal: the gradients run down slowly.","_n":"2c74b","_k":"e9e4ba69"},{"t":"Axon length","why":"The poison doesn’t change the axon’s length.","_n":"2d77b","_k":"64d9f731"},{"t":"Resting potential, which should drift toward 0 mV","why":"As the gradients run down, less K⁺ is left to leak out, so the resting potential creeps toward 0 mV.","_n":"2e76b","_k":"716f3e56"},{"t":"Room temperature","why":"Room temperature is a variable to control, not the evidence.","_n":"2f71b","_k":"b6c05d79"}]}},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Amir","how":"","instruction":"Amir made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Describe the ion movements in an action potential.","steps":["At rest, the inside is about −70 mV.","A stimulus brings the membrane to threshold, about −55 mV.","Voltage-gated Na⁺ channels open and Na⁺ flows out.","The inside becomes positive, about +35 mV.","K⁺ channels open and K⁺ flows out, restoring a negative inside."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is the right result, but it can’t follow from step 3.","Step 5 is correct."],"fixes":[{"t":"Voltage-gated Na⁺ channels open and Na⁺ rushes \u003cstrong>in\u003c/strong>, down its gradient.","why":"Depolarization: Na⁺ rushes \u003cstrong>in\u003c/strong>. Repolarization: K⁺ flows \u003cstrong>out\u003c/strong>.","_n":"2g70b","_k":"a8032f5e"},{"t":"Step 3 is correct.","why":"Positive ions leaving would make the inside more negative.","_n":"2h73b","_k":"0c7062e9"},{"t":"Voltage-gated K⁺ channels open and K⁺ rushes in.","why":"K⁺ leaves; it doesn’t enter.","_n":"2i74b","_k":"35482bb7"},{"t":"The pump moves Na⁺ in.","why":"The pump moves Na⁺ out.","_n":"2j71b","_k":"28d6becd"}],"hints":["Where is Na⁺ more concentrated?","Outside.","So it rushes in."]},{"id":"e2","goal":1,"task":"Explain the resting potential.","steps":["The Na⁺/K⁺ pump moves 3 Na⁺ out and 2 K⁺ in for each ATP.","So Na⁺ is high outside and K⁺ is high inside.","Na⁺ leak channels are the most numerous, so Na⁺ leaks in and makes the inside negative.","The resting potential is about −70 mV."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"Cl⁻ is pumped in by ATP.","why":"The pump in this model moves Na⁺ and K⁺.","_n":"2k72b","_k":"710da3c7"},{"t":"K⁺ leak channels are the most numerous, so K⁺ leaks out, leaving the inside negative.","why":"K⁺ out leaves negative charge behind.","_n":"2l77b","_k":"9b763b06"},{"t":"The inside is negative because the cell has no ions.","why":"There are plenty of ions inside.","_n":"2m78b","_k":"07c5be3f"},{"t":"Step 3 is correct.","why":"Positive Na⁺ leaking in would make the inside less negative.","_n":"2n75b","_k":"66772d25"}],"hints":["Which ion leaks most at rest?","K⁺, through leak channels.","K⁺ out leaves negative charge behind."]},{"id":"e3","goal":5,"task":"Explain why myelinated axons are faster.","steps":["Myelin is made of glial cell membranes wrapped around the axon.","Myelin conducts the impulse like a copper wire.","The impulse jumps from node to node.","So myelinated axons conduct much faster."],"_a":"Bw==","stepFb":["Step 1 is correct.","","Step 3 is correct, but it doesn’t fit step 2.","Step 4 is correct."],"fixes":[{"t":"Step 2 is correct.","why":"Myelin is an insulator, not a conductor.","_n":"2o76b","_k":"fa55170f"},{"t":"Myelin pumps Na⁺ into the axon.","why":"Myelin has no pumps.","_n":"2p6bb","_k":"ca100183"},{"t":"Myelin makes each spike bigger.","why":"Every action potential peaks at about +35 mV. Strength shows up as \u003cstrong>more\u003c/strong> action potentials per second.","_n":"2q6cb","_k":"6ced64df"},{"t":"Myelin insulates the axon, so action potentials only happen at the gaps (nodes of Ranvier).","why":"Myelin \u003cstrong>insulates\u003c/strong>. The impulse jumps between the gaps, the nodes of Ranvier.","_n":"2rd6c","_k":"8dffe3b7"}],"hints":["Is fat a conductor or an insulator?","An insulator.","It forces the spikes to the nodes."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: that every spike is the same size, or how much faster myelinated axons are?"},{"id":"j2","q":"In your own words, why does a neuron need both Na⁺ channels and K⁺ channels to make one action potential?"},{"id":"j3","q":"Explain to a friend how your brain can tell a light touch from a firm one if every spike is identical."},{"id":"j4","q":"Which phase or channel state do you still mix up? What will you do about it?"}]},"final":{"intro":"Model values: rest −70 mV, threshold −55 mV, peak +35 mV.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What mainly keeps the resting potential at about −70 mV?","options":[{"t":"The pump firing action potentials","why":"The pump sets up the gradients over time. The action potential is driven by \u003cstrong>voltage-gated channels\u003c/strong>.","_n":"2sd7c","_k":"e3516ae4"},{"t":"K⁺ leaking out through leak channels, with the Na⁺/K⁺ pump maintaining the gradients","why":"K⁺ drifting out leaves the inside negative, and the pump keeps the gradients in place.","_n":"2td4c","_k":"2cdecef3"},{"t":"Na⁺ leaking in through leak channels","why":"That would make the inside less negative.","_n":"2ud5c","_k":"8a4e1768"},{"t":"Voltage-gated Na⁺ channels staying open","why":"They’re closed at rest.","_n":"2vd2c","_k":"8c70bb54"}]},"b":{"prompt":"Which ion rushes into the axon during depolarization?","options":[{"t":"Cl⁻","why":"Cl⁻ entering would make the inside more negative.","_n":"2wd3c","_k":"f46675e4"},{"t":"Na⁺","why":"Na⁺ is high outside, so it rushes in when the voltage-gated Na⁺ channels open.","_n":"2xd0c","_k":"b1734eab"},{"t":"K⁺","why":"K⁺ leaves, during repolarization.","_n":"2yd1c","_k":"9dac88e0"},{"t":"Ca²⁺","why":"Ca²⁺ matters at the axon terminal (module 41).","_n":"2zdec","_k":"2c1443cb"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What happens during repolarization?","options":[{"t":"Na⁺ channels open and Na⁺ flows in","why":"That’s depolarization.","_n":"30dfc","_k":"86e499e9"},{"t":"K⁺ flows in","why":"Depolarization: Na⁺ rushes \u003cstrong>in\u003c/strong>. Repolarization: K⁺ flows \u003cstrong>out\u003c/strong>.","_n":"31dcc","_k":"d8962f7d"},{"t":"The pump moves 3 K⁺ out","why":"The pump moves K⁺ in.","_n":"32dbc","_k":"ed487ac3"},{"t":"Voltage-gated K⁺ channels open and K⁺ flows out","why":"K⁺ leaving brings the inside back down.","_n":"33dec","_k":"d908f496"}]},"b":{"prompt":"Why does the membrane briefly drop below −70 mV after a spike?","options":[{"t":"The pump stops","why":"The pump keeps running.","_n":"34ddc","_k":"ba323f1b"},{"t":"Na⁺ keeps rushing in","why":"That would raise the voltage.","_n":"35e0c","_k":"0c5a82e9"},{"t":"K⁺ channels close slowly, so extra K⁺ leaves","why":"The extra K⁺ exit overshoots rest: hyperpolarization.","_n":"36dfc","_k":"9ecef0a0"},{"t":"Cl⁻ is pumped out","why":"Not part of this model.","_n":"37e2c","_k":"33133a7d"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"What are the nodes of Ranvier, and why do they matter?","options":[{"t":"Points where myelin conducts the current","why":"Myelin \u003cstrong>insulates\u003c/strong>. The impulse jumps between the gaps, the nodes of Ranvier.","_n":"38e1c","_k":"6b2dc281"},{"t":"Gaps in the myelin where action potentials occur, so the impulse jumps from node to node","why":"That jumping (saltatory conduction) makes myelinated axons fast.","_n":"39d4c","_k":"dbe5e509"},{"t":"The axon terminals that release neurotransmitter","why":"Those are at the end of the axon.","_n":"3ad3c","_k":"64d20c1d"},{"t":"Places where the axon has no Na⁺ channels","why":"Nodes are packed with Na⁺ channels.","_n":"3b4ac","_k":"55c30494"}]},"b":{"prompt":"What is the absolute refractory period?","options":[{"t":"The resting state before a stimulus","why":"Rest isn’t refractory.","_n":"3c4bc","_k":"a62831e2"},{"t":"A time when a weaker stimulus than usual can fire","why":"The opposite: no stimulus can.","_n":"3d4cc","_k":"5a67af68"},{"t":"A brief time when no new action potential can start, because the Na⁺ channels are inactivated","why":"Inactivated Na⁺ channels can’t open, whatever the stimulus.","_n":"3e4dc","_k":"58db1675"},{"t":"The time the pump takes to fill the cell with Na⁺","why":"The pump moves Na⁺ out.","_n":"3f4ec","_k":"4590dec4"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A stimulus brings the membrane from −70 mV to −60 mV. What happens?","options":[{"t":"A half-size spike","why":"All or none: no partial spikes.","_n":"3g4fc","_k":"fd02b8d2"},{"t":"The neuron is permanently depolarized","why":"It returns to rest.","_n":"3h50c","_k":"1c209120"},{"t":"A small local depolarization that fades; no action potential","why":"Below threshold, the depolarization fades and nothing fires.","_n":"3i51c","_k":"a913cfe7"},{"t":"A full spike to +35 mV","why":"−60 is below threshold.","_n":"3j52c","_k":"fe1d990c"}]},"b":{"prompt":"Stimulus X depolarizes by 20 mV and stimulus Y by 30 mV. How do their spikes compare?","options":[{"t":"X’s spike is taller because it’s quicker","why":"Spike height is fixed.","_n":"3k53c","_k":"13981048"},{"t":"Both peak at about +35 mV","why":"Both pass threshold, and the channels set the size.","_n":"3l50c","_k":"ab6b994f"},{"t":"Y’s spike is 1.5 times taller","why":"Every action potential peaks at about +35 mV. Strength shows up as \u003cstrong>more\u003c/strong> action potentials per second.","_n":"3m4fc","_k":"d2793ae4"},{"t":"Only Y fires","why":"−70 + 20 = −50 is past threshold too.","_n":"3n4ec","_k":"df378d7c"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"A drug blocks voltage-gated Na⁺ channels. A strong stimulus is applied. What is recorded?","options":[{"t":"A local depolarization that fades, with no action potential","why":"No Na⁺ rush, no upstroke.","_n":"3o4dc","_k":"c4578607"},{"t":"An action potential that doesn’t repolarize","why":"That’s a K⁺ blocker.","_n":"3p54c","_k":"b7217f1c"},{"t":"A spike to +70 mV","why":"There’s no spike at all.","_n":"3q53c","_k":"5715f342"},{"t":"A normal action potential","why":"Without Na⁺ rushing in, there’s no upstroke.","_n":"3r52c","_k":"d9bb2e24"}]},"b":{"prompt":"A drug blocks voltage-gated K⁺ channels. A stimulus above threshold is applied. What is recorded?","options":[{"t":"A normal upstroke to the peak, then a slow, prolonged return","why":"Block Na⁺ channels: no action potential. Block K⁺ channels: an action potential that’s slow to end.","_n":"3s51c","_k":"7482bd89"},{"t":"A taller peak","why":"The peak is set by Na⁺ entry.","_n":"3t58c","_k":"b58b4fbc"},{"t":"No action potential","why":"The Na⁺ channels still work.","_n":"3u57c","_k":"88b9ecf2"},{"t":"A faster return to rest","why":"The K⁺ exit is what speeds the return.","_n":"3v4ec","_k":"24f492f4"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"The K⁺ concentration in the fluid outside the neurons rises. What happens to the resting potential, and why?","options":[{"t":"No change, because the pump fixes it at once","why":"The leak depends on the gradient.","_n":"3w4fc","_k":"c8fda1c2"},{"t":"It becomes less negative, because a smaller K⁺ difference means less K⁺ leaks out","why":"Less K⁺ leaves, so less negative charge is left behind.","_n":"3x4cc","_k":"348950c7"},{"t":"It becomes +35 mV","why":"That’s the spike peak, not rest.","_n":"3y4dc","_k":"64f79656"},{"t":"It becomes more negative, because more K⁺ is outside","why":"Less leaves; the inside is less negative.","_n":"3z52c","_k":"6f10165c"}]},"b":{"prompt":"The Na⁺ concentration outside a neuron falls. What happens to the spike’s peak, and why?","options":[{"t":"It is higher, because Na⁺ leaves faster","why":"Na⁺ enters during the upstroke.","_n":"4053c","_k":"17b29a6a"},{"t":"No change; spikes are all-or-none","why":"All-or-none means fixed for given conditions; changing the gradient changes the peak.","_n":"4150c","_k":"98c5e000"},{"t":"There is no spike, ever","why":"A smaller gradient still allows a spike.","_n":"4251c","_k":"d95526de"},{"t":"It is lower, because less Na⁺ rushes in","why":"A smaller Na⁺ gradient drives less Na⁺ in.","_n":"4356c","_k":"38672bdb"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of ‘all-or-none’?","options":[{"t":"“All the ions leave the cell, or none do.”","why":"Only a tiny fraction of ions move.","_n":"4457c","_k":"b376047a"},{"t":"“Once threshold is reached, voltage-gated Na⁺ channels open fully and the spike always reaches the same peak; below threshold, there is no spike.”","why":"Threshold decides \u003cem>whether\u003c/em> it fires; the channels decide the size.","_n":"4554d","_k":"74316222"},{"t":"“A neuron either fires all its axons or none of them.”","why":"It’s about the size of each spike.","_n":"4653d","_k":"ab247b59"},{"t":"“Stronger stimuli give bigger spikes, up to a maximum.”","why":"Every action potential peaks at about +35 mV. Strength shows up as \u003cstrong>more\u003c/strong> action potentials per second.","_n":"4756d","_k":"20fe68e1"}]},"b":{"prompt":"Which is the best explanation of why an impulse travels in only one direction along an axon?","options":[{"t":"“Myelin blocks backward flow.”","why":"The patch just behind the impulse is refractory, so it can’t fire again right away.","_n":"4855d","_k":"e2bb0cf5"},{"t":"“The patch just behind the impulse is in its refractory period, so only the patch ahead can be triggered.”","why":"The refractory patch behind can’t fire, so the impulse moves forward.","_n":"4950d","_k":"0ff4cc32"},{"t":"“Na⁺ can only move toward the axon terminal.”","why":"Na⁺ moves across the membrane, not along it.","_n":"4a4fd","_k":"b7c0298c"},{"t":"“The axon is narrower at one end.”","why":"Diameter affects speed, not direction.","_n":"4b52d","_k":"3fc202f4"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which sequence is correct?","options":[{"t":"Threshold → K⁺ channels open → K⁺ in → Na⁺ out → rest","why":"Depolarization: Na⁺ rushes \u003cstrong>in\u003c/strong>. Repolarization: K⁺ flows \u003cstrong>out\u003c/strong>.","_n":"4c51d","_k":"1d003ada"},{"t":"Pump starts → Na⁺ in → K⁺ in → threshold","why":"The pump sets up the gradients over time. The action potential is driven by \u003cstrong>voltage-gated channels\u003c/strong>.","_n":"4d5cd","_k":"08a3d7ff"},{"t":"Na⁺ in → threshold → K⁺ in → peak","why":"Threshold comes first; K⁺ leaves.","_n":"4e5bd","_k":"3d228723"},{"t":"Threshold → Na⁺ channels open → Na⁺ in → Na⁺ channels inactivate, K⁺ channels open → K⁺ out → undershoot → rest","why":"Na⁺ in on the way up, K⁺ out on the way down, a brief undershoot, then rest.","_n":"4fe2c","_k":"5d5177e2"}]},"b":{"prompt":"Which sentence uses the terms correctly?","options":[{"t":"“Hyperpolarization is the peak at +35 mV.”","why":"That’s the overshoot of the spike, not hyperpolarization.","_n":"4ge3c","_k":"6e933d59"},{"t":"“Repolarization is when the pump makes the spike.”","why":"The pump sets up the gradients over time. The action potential is driven by \u003cstrong>voltage-gated channels\u003c/strong>.","_n":"4he4c","_k":"1b801479"},{"t":"“Depolarization is caused by Na⁺ entering; repolarization by K⁺ leaving; hyperpolarization is the dip below the resting potential.”","why":"Each term matches its ion movement.","_n":"4ie5c","_k":"6608469a"},{"t":"“Depolarization is caused by K⁺ leaving; repolarization by Na⁺ entering.”","why":"Depolarization: Na⁺ rushes \u003cstrong>in\u003c/strong>. Repolarization: K⁺ flows \u003cstrong>out\u003c/strong>.","_n":"4jdec","_k":"2a52f009"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A signal travels 0.8 m along a myelinated axon at 80 m/s. How long does it take?","options":[{"t":"10 ms","why":"0.8 ÷ 80 = 0.01 s.","_n":"4kdfc","_k":"3b3bc5ac"},{"t":"1 ms","why":"0.01 s is 10 ms.","_n":"4le0c","_k":"5f1ee5c9"},{"t":"100 ms","why":"0.8 ÷ 80 = 0.01 s, which is 10 ms.","_n":"4me1c","_k":"44337045"},{"t":"64 ms","why":"Divide distance by speed; don’t multiply.","_n":"4ndac","_k":"0e65e2b9"}]},"b":{"prompt":"The same 0.8 m pathway on an unmyelinated axon conducts at 2 m/s. How long does it take?","options":[{"t":"40 ms","why":"0.4 s = 400 ms.","_n":"4odbc","_k":"d5eb56ef"},{"t":"400 ms","why":"0.8 ÷ 2 = 0.4 s.","_n":"4pe8c","_k":"f0648b3a"},{"t":"1.6 ms","why":"Divide, don’t multiply.","_n":"4qe7c","_k":"040c1c43"},{"t":"4 ms","why":"0.4 s = 400 ms.","_n":"4re6c","_k":"dea2405d"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A dentist injects a local anaesthetic near a tooth. Why does the area go numb?","options":[{"t":"It makes action potentials bigger, so the brain ignores them","why":"Every action potential peaks at about +35 mV. Strength shows up as \u003cstrong>more\u003c/strong> action potentials per second.","_n":"4se5c","_k":"cb1b6127"},{"t":"It blocks Na⁺ channels in the sensory neurons there, so they can’t fire action potentials to the brain","why":"No Na⁺ rush, no action potential, no pain signal.","_n":"4te4c","_k":"7bae9022"},{"t":"It destroys the pain receptors permanently","why":"The effect wears off as the drug is cleared.","_n":"4ue3c","_k":"01648c5b"},{"t":"It blocks K⁺ channels so the neurons never reset","why":"Block Na⁺ channels: no action potential. Block K⁺ channels: an action potential that’s slow to end.","_n":"4ve2c","_k":"66bf18c5"}]},"b":{"prompt":"In multiple sclerosis, why can movement or vision be affected?","options":[{"t":"The Na⁺/K⁺ pump stops working in every cell","why":"MS targets myelin.","_n":"4we1c","_k":"4af06977"},{"t":"The neurons make spikes that are too large","why":"Every action potential peaks at about +35 mV. Strength shows up as \u003cstrong>more\u003c/strong> action potentials per second.","_n":"4xe0c","_k":"1b7feb8d"},{"t":"Myelin grows too thick and conducts too much current","why":"Myelin \u003cstrong>insulates\u003c/strong>. The impulse jumps between the gaps, the nodes of Ranvier.","_n":"4ydfc","_k":"80abb2f9"},{"t":"Damaged myelin slows or blocks impulses in the brain and spinal cord","why":"Without insulation, the impulse can’t jump node to node, so it slows or fails.","_n":"4ze6d","_k":"c7a83d9b"}]}}]},"task":{"title":"Design a fast, thin pathway","summary":"Design a fast, thin pathway","statement":"\u003cp>Choose an axon, a pathway and a stimulus so the signal meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"ap-conds\">\u003cli>The stimulus reaches threshold.\u003c/li>\u003cli>The signal reports a strong stimulus: at least 3 action potentials in 20 ms.\u003c/li>\u003cli>The first action potential arrives within 10 ms.\u003c/li>\u003cli>The axon is thin (to save space in a crowded nerve).\u003c/li>\u003c/ol>","stims":[10,15,20,25,30],"paths":{"arm":0.5,"leg":1},"checks":["Reaches threshold","Strong signal","Arrives within 10 ms","Thin axon"],"tips":["Rest is −70 mV and threshold −55 mV.","Stronger stimuli give more spikes, not bigger ones.","Time = distance ÷ speed. Which axon types are fast enough?","A thin axon needs help to go fast. What could provide it?"],"explainPrompt":"Explain how your design shows that the stimulus is strong, and why your axon is fast enough.","vocab":"Use the words threshold, frequency, myelin and saltatory conduction.","more":"Can you find all the answers?","after3":"The leg pathway would take 1.0 ÷ 50 = 20 ms on a thin myelinated axon. Long, fast pathways need thick myelinated axons."},"cards":[["Resting potential","About −70 mV inside; set up by the Na⁺/K⁺ pump and K⁺ leak channels."],["Na⁺/K⁺ pump","Uses ATP to move 3 Na⁺ out and 2 K⁺ in."],["Threshold","About −55 mV; past it, voltage-gated Na⁺ channels open."],["Depolarization","Na⁺ rushes in; the inside rises to about +35 mV."],["Repolarization","Na⁺ channels inactivate; K⁺ channels open and K⁺ flows out."],["Hyperpolarization","A brief dip to about −80 mV as K⁺ channels close slowly."],["All-or-none","Every action potential has the same size once threshold is reached."],["Absolute refractory period","No new spike possible (Na⁺ channels inactivated)."],["Relative refractory period","A stronger-than-usual stimulus can fire a new spike."],["Frequency coding","Stronger stimulus → more spikes per second, not bigger spikes."],["Saltatory conduction","Spikes jump between nodes of Ranvier on myelinated axons: much faster."],["Na⁺ channel blockers","Local anaesthetics (and tetrodotoxin) stop action potentials."]]}};</script>
