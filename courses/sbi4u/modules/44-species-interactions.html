.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 44 Predation, Competition and Symbiosis. Prey and species 1: --pen; predators: --bio-atp (orange);
   species 2: --bio-nadh (teal); K lines --ink-2 dashed; the balance point is an --ink cross. */
.si-heq{letter-spacing:.02em}
.si-hero{display:grid;gap:10px}
.si-hero svg{width:100%;height:auto;display:block;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.si-hgrid{opacity:0;transition:opacity .9s ease}
.si-hgrid.on{opacity:1}
.si-grid{width:100%;border-collapse:collapse;font:400 .78rem/1.25 var(--font-ui);table-layout:fixed}
.si-grid caption{font-size:.78rem;color:var(--ink-2);text-align:left;margin-bottom:4px}
.si-grid th,.si-grid td{border:1px solid var(--rule);padding:4px 5px;text-align:center;vertical-align:middle;background:var(--sheet);color:var(--ink)}
.si-grid th{font-weight:700;background:var(--paper)}
.si-grid td.si-hot{background:var(--hi-soft);font-weight:700;outline:2px solid var(--bio-atp);outline-offset:-2px}
.si-t{font:400 11px var(--font-ui);fill:var(--ink)}
.si-ts{font-size:10px;fill:var(--ink-2)}
.si-tb{font-weight:700;font-size:11.5px}
.si-tblue{fill:var(--pen)}
.si-torange{fill:var(--bio-atp)}
.si-sign{font:700 20px var(--font-ui);fill:var(--ink)}
.si-ax{stroke:var(--plot-axis);stroke-width:1.4}
.si-hc{fill:none;stroke:var(--pen);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.si-lc{fill:none;stroke:var(--bio-atp);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.si-brk line{stroke:var(--ink);stroke-width:1.8}
.si-brk line.si-brkd{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.si-hare{fill:var(--pen)}
.si-lynx{fill:var(--bio-atp)}

/* Explore */
.si-pg [hidden]{display:none!important}
.si-panel{display:grid;gap:6px;margin-top:10px}
.si-leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 0;font-size:.86rem}
.si-leg i.sw.si-dash{height:0;border-top:2px dashed var(--ink-2);background:none}
.si-x{display:inline-block;width:28px;text-align:center;font:700 1.1rem var(--font-ui);color:var(--ink)}
.si-gal{display:grid;gap:10px}
.si-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.si-card{display:grid;gap:2px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:8px 10px;min-height:44px;cursor:pointer;font:inherit}
.si-card[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.si-card:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.si-cn{font-weight:700}
.si-cp{font:700 1rem var(--font-ui)}
.si-cw{font-size:.8rem;color:var(--ink-2)}
.si-stage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.si-stage svg{width:100%;height:auto;display:block}
.si-cap{margin:0;font-size:.95rem;min-height:2.6em}
.si-pbox{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.si-dot{fill:var(--ink)}
.si-arr line{stroke:var(--ink-2)}
.si-arr path{fill:var(--ink-2)}
.si-att line{stroke-dasharray:5 4}
.si-snow{fill:var(--paper);stroke:var(--rule);stroke-width:1.2}
.si-res{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:1.2}
.si-numin{width:7.5rem}
.si-pf{display:inline-flex;flex-direction:column;gap:2px;font-size:.9rem}

/* Part 3: ripple effects */
.si-p3{display:grid;gap:26px}
.si-st h3{margin-bottom:4px}
.si-web{position:relative;width:100%;max-width:560px;margin:10px auto 4px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.si-web svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.si-node{position:absolute;transform:translate(-50%,-50%);width:31%;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:1.5px solid var(--ink);border-radius:10px;background:var(--sheet);color:var(--ink);padding:4px 6px;font:600 .8rem/1.15 var(--font-ui);text-align:center}
button.si-node{cursor:pointer}
button.si-node:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.si-node.si-fixed{background:var(--hi-soft);border-style:double;border-width:3px}
.si-node.good{border-color:var(--green);background:var(--good-bg)}
.si-node.bad{border-color:var(--red);background:var(--bad-bg)}
.si-node:disabled{opacity:1}
.si-nn{display:block}
.si-ns{display:block;font-weight:400;font-size:.76rem;color:var(--ink-2)}
.si-warr line{stroke:var(--ink);stroke-width:2}
.si-warr path{fill:var(--ink)}
.si-wdash line{stroke:var(--ink-2);stroke-dasharray:5 4}
.si-wdash path{fill:var(--ink-2)}
.si-wlabbg{fill:var(--sheet)}
.si-data{margin-top:10px;border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper)}
.si-data h4{margin:0 0 6px}
.si-data p{margin:8px 0 0}

/* Practice 2 chips */
.si-chg{display:grid;gap:6px;margin-top:10px}
.si-chrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.si-chrow .chips{margin:0}
.si-chl{min-width:7.5rem;font-weight:700}
.si-conds{margin:.4em 0 0 1.2em}

@media (max-width:560px){
  .si-node{width:32%;font-size:.72rem;padding:3px 4px}
  .si-ns{font-size:.68rem}
  .si-cards{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){ .si-hgrid{transition:none} }

</style>

Walleye eat perch.","_n":"09e3","_k":"2515039c"},{"t":"Algae","why":"That skips a link. Algae are eaten by zooplankton.","_n":"1a13","_k":"e9ffb4b5"},{"t":"Nothing; it’s a producer","why":"Producers are the algae at the start.","_n":"2a03","_k":"f7ab5013"},{"t":"Zooplankton","why":"Arrows point from food to eater.","_n":"3a33","_k":"37489a16"}],"hints":["Which way do the arrows point?","From the food to the eater.","Zooplankton → perch."]},{"id":"w2","skill":"Food chains","goal":5,"prompt":"In the same chain, which organism is a secondary consumer?","options":[{"t":"Walleye","why":"Walleye eat secondary consumers: tertiary.","_n":"4a23","_k":"0bd79a03"},{"t":"Zooplankton","why":"Zooplankton eat producers: primary consumers.","_n":"5a53","_k":"79fb891d"},{"t":"Algae","why":"Algae are producers.","_n":"6a43","_k":"f188657b"},{"t":"Yellow perch","why":"It eats a primary consumer (zooplankton).","_n":"7a73","_k":"47073c76"}],"hints":["Primary consumers eat producers.","Secondary consumers eat primary consumers.","Perch."]},{"id":"w3","skill":"Reading time-series graphs","goal":2,"prompt":"A graph shows a population rising from 100 in year 0 to a peak of 600 in year 5, then falling to 150 in year 9. When was it largest?","options":[{"t":"Year 5","why":"The peak is the highest point.","_n":"8a63","_k":"5ed1a628"},{"t":"Year 600","why":"You read the wrong axis. 600 is the population, not the year.","_n":"9c38","_k":"79a8293c"},{"t":"Year 9","why":"The last point isn’t the largest.","_n":"ac48","_k":"5eb4ffa3"},{"t":"Year 0","why":"100 is the smallest value shown.","_n":"bc58","_k":"03e6ff15"}],"hints":["Find the highest point.","It’s at 600 individuals.","That’s at year 5."]},{"id":"w4","skill":"Reading time-series graphs","goal":2,"prompt":"Two curves are on one graph: species X peaks in year 3, species Y in year 5. Which statement is true?","options":[{"t":"Y’s peak comes 2 years after X’s","why":"5 − 3 = 2.","_n":"cc68","_k":"4940bffc"},{"t":"Y’s peak is 2 times higher","why":"The years tell you when, not how high.","_n":"dc78","_k":"50c5b96d"},{"t":"X’s peak comes after Y’s","why":"3 is earlier than 5.","_n":"ec88","_k":"e6123233"},{"t":"They peak together","why":"Year 3 and year 5 are different.","_n":"fc98","_k":"8b29db1d"}],"hints":["Compare the years of the peaks.","3 and 5.","Y peaks 2 years later."]},{"id":"w5","skill":"Population growth","goal":3,"prompt":"From module 43, what is carrying capacity?","options":[{"t":"The number of young each female has","why":"That’s fecundity.","_n":"gca8","_k":"e99451ac"},{"t":"The fastest a population can grow","why":"That’s the growth rate, at \u003cem>K\u003c/em>/2 in logistic growth.","_n":"hcb8","_k":"e9f599ec"},{"t":"The largest population a habitat can support over time","why":"A logistic curve levels off at \u003cem>K\u003c/em>.","_n":"icc8","_k":"4b79558f"},{"t":"The starting population","why":"That’s \u003cem>N\u003c/em>₀.","_n":"jd58","_k":"762ba2d8"}],"hints":["Where does a logistic curve level off?","At \u003cem>K\u003c/em>.","The largest supportable population."]},{"id":"w6","skill":"Population growth","goal":3,"prompt":"Which is a density-dependent limiting factor?","options":[{"t":"A spring flood","why":"Floods don’t depend on crowding.","_n":"kd48","_k":"0fb2c090"},{"t":"Competition for food","why":"It gets worse as the population gets crowded.","_n":"ld78","_k":"da018c3f"},{"t":"A cold snap","why":"Weather is density-independent.","_n":"md68","_k":"a2acb8ec"},{"t":"A forest fire","why":"Fire is density-independent.","_n":"nd98","_k":"cfdf2de0"}],"hints":["Would it hit harder in a crowded population?","Only one choice depends on crowding.","Competition."]}],"refreshers":{"Food chains":"Arrows point from the food to the eater. Producers make food; primary consumers eat producers; secondary consumers eat primary consumers.","Reading time-series graphs":"Time runs along the bottom, numbers up the side. A peak is the highest point of a curve; compare when two curves peak to find the lag between them.","Population growth":"Carrying capacity \u003cem>K\u003c/em> is the largest population a habitat can support. Density-dependent factors such as competition and predation get stronger as a population grows."}}},"explore":{"heading":"Interaction simulator","intro":"Run a predator–prey model and a competition model. Change one setting at a time and watch both populations.","fixedNote":"Fixed in this model: hunting rate 0.01 and food-to-young conversion 0.1.","modelTitle":"How the model works","modelPP":"\u003cp>\u003cstrong>Predator–prey\u003c/strong> (model hares \u003cem>H\u003c/em> and lynx \u003cem>L\u003c/em>, drawn year by year):\u003c/p>\u003cp>prey change = \u003cem>aH\u003c/em> − 0.01\u003cem>HL\u003c/em>\u003cbr>predator change = 0.1 × 0.01\u003cem>HL\u003c/em> − \u003cem>dL\u003c/em>\u003c/p>\u003cp>Both changes are 0 at the balance point: prey balance = \u003cem>d\u003c/em> ÷ 0.001; predator balance = \u003cem>a\u003c/em> ÷ 0.01.\u003c/p>","modelComp":"\u003cp>\u003cstrong>Competition\u003c/strong> (two species sharing resources, starting at 50 each): each species grows logistically toward its carrying capacity, but every individual of the other species uses up \u003cem>α\u003c/em> of a space. Both grow at \u003cem>r\u003c/em> = 0.5 per year.\u003c/p>\u003cp>Species 2 survives only if \u003cem>K\u003c/em>₂ > \u003cem>α\u003c/em> × \u003cem>K\u003c/em>₁; species 1 only if \u003cem>K\u003c/em>₁ > \u003cem>α\u003c/em> × \u003cem>K\u003c/em>₂. When both survive, species 1’s balance = (\u003cem>K\u003c/em>₁ − \u003cem>α\u003c/em>\u003cem>K\u003c/em>₂) ÷ (1 − \u003cem>α\u003c/em>²), and the same for species 2.\u003c/p>","realNote":"Real hare–lynx fur-trade records cycle about every 10 years. This simple model shows the pattern, not the exact numbers.","cards":[{"id":"lynx","set":"int","name":"Predation","pair":"+/−","a":{"n":"Canada lynx","s":"+"},"b":{"n":"Snowshoe hare","s":"−"},"kind":"eat","flow":"food","cap":"The lynx kills and eats the hare: the lynx gains (+), the hare loses (−)."},{"id":"tick","set":"int","name":"Parasitism","pair":"+/−","a":{"n":"Winter ticks","s":"+"},"b":{"n":"Moose","s":"−"},"kind":"flow","flow":"blood","cap":"Thousands of ticks feed on one living moose for weeks. The ticks gain (+); the moose is weakened (−) but usually survives."},{"id":"warbler","set":"int","name":"Competition","pair":"−/−","a":{"n":"Cape May warbler","s":"−"},"b":{"n":"Bay-breasted warbler","s":"−"},"kind":"share","flow":"caterpillars","cap":"Both warblers eat the same caterpillars in the same tree layer. Each leaves less for the other, so both lose (−/−)."},{"id":"myco","set":"int","name":"Mutualism","pair":"+/+","a":{"n":"Mycorrhizal fungus","s":"+"},"b":{"n":"Sugar maple roots","s":"+"},"kind":"trade","flow":"sugars","back":"water, phosphorus","cap":"The fungus takes sugars from the roots and passes water and phosphorus back. Both gain (+/+)."},{"id":"barn","set":"int","name":"Commensalism","pair":"+/0","a":{"n":"Barnacles","s":"+"},"b":{"n":"Grey whale","s":"0"},"kind":"ride","flow":"a ride","cap":"Barnacles ride on a grey whale to food-rich water. They gain (+); the whale is unaffected (0)."},{"id":"camo","set":"def","name":"Camouflage","pair":"+/−","a":{"n":"Lynx (predator)","s":"+"},"b":{"n":"Snowshoe hare in winter","s":"−"},"kind":"hide","flow":"white coat on snow","cap":"The snowshoe hare’s white winter coat blends into the snow, so the lynx often passes it by."},{"id":"monarch","set":"def","name":"Chemical defence","pair":"+/−","a":{"n":"Bird (predator)","s":"+"},"b":{"n":"Monarch caterpillar","s":"−"},"kind":"toxic","flow":"milkweed toxins","cap":"Monarch caterpillars store toxins from the milkweed they eat. A bird that tries one gets sick and learns to leave them alone."},{"id":"hover","set":"def","name":"Batesian mimicry","pair":"+/−","a":{"n":"Bird (predator)","s":"+"},"b":{"n":"Hoverfly (harmless)","s":"−"},"kind":"bates","flow":"wasp look-alike","cap":"Harmless hoverflies have the black-and-yellow stripes of stinging wasps. Birds that have learned to avoid wasps avoid the hoverflies too."},{"id":"bee","set":"def","name":"Müllerian mimicry","pair":"+/−","a":{"n":"Bird (predator)","s":"+"},"b":{"n":"Bumblebee and yellowjacket","s":"−"},"kind":"mull","flow":"one shared warning","cap":"Bumblebees and yellowjackets can both sting and share black-and-yellow warning colours. One bad experience teaches a bird to avoid both."}],"predIntro":"Make a prediction first. Then the simulator will show you what really happens.","predictions":[{"id":"p1","prompt":"Predator–prey, start 400 hares and 20 lynx. Which population will reach its first peak first?","options":[{"t":"The hares","_n":"od88","_k":"21bad3bb"},{"t":"Both at the same time","_n":"pdb8","_k":"221ff575"},{"t":"Neither; they stay flat","_n":"qda8","_k":"10bb9377"},{"t":"The lynx","_n":"rcd8","_k":"01ed6f14"}],"explain":"Lynx increase only after there’s plenty to eat, and keep increasing until hares become scarce. Predators need time to turn plentiful food into more young, so their peak comes after the prey’s.","start":{"mode":"pp","view":"ts","a":0.5,"d":0.4,"h0":400,"l0":20},"to":16},{"id":"p2","prompt":"Predator–prey, with \u003cem>L\u003c/em>₀ = 0. With no lynx at all, what will the hares do in this model?","options":[{"t":"Rise, then cycle anyway","_n":"scc8","_k":"bfb9b27a"},{"t":"Level off right away","_n":"tcf8","_k":"fb0aef2c"},{"t":"Die out","_n":"ud08","_k":"0da71192"},{"t":"Rise faster and faster","_n":"vcd8","_k":"067eebd3"}],"explain":"Nothing in this model limits hares except lynx. A real habitat would cap them at its carrying capacity, as in module 43.","start":{"mode":"pp","view":"ts","a":0.5,"d":0.4,"h0":400,"l0":0},"to":20},{"id":"p3","prompt":"Competition, \u003cem>K\u003c/em>₁ = 600, \u003cem>K\u003c/em>₂ = 400, overlap 1.0. The two species need exactly the same resources. What happens?","options":[{"t":"Species 2 dies out","_n":"wce8","_k":"5591ce7b"},{"t":"They alternate in cycles","_n":"xcb8","_k":"1d9edfbc"},{"t":"Species 1 dies out","_n":"ycc8","_k":"8922994c"},{"t":"Both settle at half their \u003cem>K\u003c/em>","_n":"zc98","_k":"98b656b1"}],"explain":"With identical niches, one species wins. Here species 1, which the habitat supports in larger numbers, excludes species 2.","start":{"mode":"comp","k1":600,"k2":400,"al":1},"to":100},{"id":"p4","prompt":"Predator–prey, “Cycle plot” view. On a plot of lynx against hares, what shape will the path make?","options":[{"t":"A spiral out to infinity","_n":"10ca8","_k":"794b851a"},{"t":"A closed loop around the balance point","_n":"11d78","_k":"fdfb38e7"},{"t":"A straight line","_n":"12d88","_k":"236f78a0"},{"t":"A single point","_n":"13619","_k":"e2ffbd4d"}],"explain":"The same sequence (hares up, lynx up, hares down, lynx down) repeats, so the path returns to where it started. It loops counterclockwise around the cross at (400, 50).","start":{"mode":"pp","view":"cy","a":0.5,"d":0.4,"h0":400,"l0":20},"to":16}],"challenges":[{"id":"tc1","goal":2,"prompt":"Predator–prey, \u003cem>a\u003c/em> = 0.5 and \u003cem>d\u003c/em> = 0.4: choose starting numbers so that neither population changes.","why":"At 400 hares and 50 lynx, the lynx eat exactly as many hares as are born, and exactly as many lynx are born as die. Both curves stay flat.","general":"Both curves must stay flat. Start at the balance point shown in the readout.","hints":["At the balance point, both changes are 0.","Hares: 0.5\u003cem>H\u003c/em> = 0.01\u003cem>HL\u003c/em>, so \u003cem>L\u003c/em> = 50. Lynx: 0.001\u003cem>HL\u003c/em> = 0.4\u003cem>L\u003c/em>, so \u003cem>H\u003c/em> = 400.","Start at 400 hares and 50 lynx."]},{"id":"tc2","goal":3,"prompt":"Competition, \u003cem>K\u003c/em>₁ = 600, \u003cem>K\u003c/em>₂ = 400: choose an overlap that lets \u003cstrong>both\u003c/strong> species survive while they still compete (overlap above 0).","why":"Species 2 holds on because 400 is more than \u003cem>α\u003c/em> × 600, and species 1 easily passes its own test. The overlap is small enough to share.","general":"Check species 2: its \u003cem>K\u003c/em>₂ must be bigger than \u003cem>α\u003c/em> × \u003cem>K\u003c/em>₁.","hints":["Species 2 survives only if its \u003cem>K\u003c/em> is bigger than the crowding species 1 causes: \u003cem>K\u003c/em>₂ > \u003cem>α\u003c/em> × \u003cem>K\u003c/em>₁.","400 > \u003cem>α\u003c/em> × 600 means \u003cem>α\u003c/em> \u003c 2/3.","Any overlap from 0.1 to 0.6."]},{"id":"tc3","goal":2,"stretch":true,"prompt":"Predator–prey: change the settings so the balance point has \u003cstrong>800 hares and still 50 lynx\u003c/strong>.","why":"Hare balance = \u003cem>d\u003c/em> ÷ 0.001 = 0.8 ÷ 0.001 = 800, and the lynx balance stays at \u003cem>a\u003c/em> ÷ 0.01 = 50. Only the lynx death rate moves the hare balance.","general":"Read the balance-point row as you move each slider.","hints":["Read the balance-point row as you move each slider. Which slider moves the hare balance?","Hare balance = \u003cem>d\u003c/em> ÷ 0.001: only the lynx death rate changes it.","\u003cem>d\u003c/em> = 0.8 with \u003cem>a\u003c/em> = 0.5."]}]},"part3":{"slug":"ripples","name":"Ripples","heading":"Ripple effects","intro":"One population changes. Tap every other population to predict what happens to it (↑, ↓ or little change), then press Check. Arrows point from the food to the eater; dashed arrows show other links.","panel":"Check it with data","illus":"Illustrative values","m7":"Follow the arrows: a change in one population passes along to what it eats and what eats it.","states":[["up","↑ increase"],["down","↓ decrease"],["same","little change"]],"stations":[{"id":"s1","title":"Station 1: a keystone predator (British Columbia’s coast)","text":"Sea otters eat sea urchins; urchins graze kelp; kelp forests shelter young fish. \u003cstrong>Change: otters return.\u003c/strong>","h":250,"nodes":[{"id":"kelp","t":"Kelp","x":90,"y":40},{"id":"fish","t":"Kelp-sheltering fish","x":270,"y":125},{"id":"urch","t":"Sea urchins","x":90,"y":125},{"id":"otter","t":"Sea otters","x":90,"y":210,"fixed":"up","note":"otters return"}],"links":[{"f":"kelp","to":"urch"},{"f":"urch","to":"otter"},{"f":"kelp","to":"fish","dash":true,"lab":"shelter"}],"_a":"TUcTEQcMEgwUAQkUCkYcFF0AChNGXhJDRkdKQQINQ14UX0QWFEZN","fb":{"urch":"Otters eat urchins: more otters means fewer urchins.","kelp":"You skipped the urchin → kelp link: fewer urchins graze less kelp, so kelp grows back.","fish":"You skipped the kelp → fish link: more kelp forest means more shelter for young fish."},"data":{"head":["","Without otters","With otters"],"rows":[["Sea urchins (per m²)","60","5"],["Kelp cover","5%","60%"]]},"note":"A \u003cstrong>keystone species\u003c/strong> has an effect far larger than its numbers suggest."},{"id":"s2","title":"Station 2: an invasive filter feeder (the Great Lakes)","text":"Zebra mussels arrived in the late 1980s. They filter huge amounts of plankton from the water. \u003cstrong>Change: mussels ↑.\u003c/strong>","h":250,"nodes":[{"id":"plank","t":"Plankton","x":180,"y":40},{"id":"mus","t":"Zebra mussels","x":75,"y":125,"fixed":"up","note":"invasive, spreading"},{"id":"larv","t":"Plankton-eating larval fish","x":285,"y":125},{"id":"clar","t":"Water clarity","x":75,"y":210},{"id":"plant","t":"Rooted water plants","x":285,"y":210}],"links":[{"f":"plank","to":"mus"},{"f":"plank","to":"larv"},{"f":"mus","to":"clar","dash":true,"lab":"filtering"},{"f":"clar","to":"plant","dash":true,"lab":"light"}],"_a":"TUcWDwUKWxQMRwIMEwoSGhQGCgIWRgoUQxVET0YIUURAR1xBAAtHWBRJRBMIBV5CFF9EFhRGTQ==","fb":{"plank":"Mussels eat plankton: more mussels filter out more plankton.","clar":"You skipped the filtering link: with less plankton floating in it, the water gets clearer.","larv":"You skipped the plankton → larval fish link: less plankton means less food for young fish.","plant":"You skipped the clarity → plants link: clearer water lets more light reach the bottom, so rooted plants grow."},"data":{"head":["","Before mussels","After mussels"],"rows":[["Water clarity (how deep you can see)","2 m","5 m"],["Plankton biomass","100%","50% (down by half)"]]},"note":"Freed from the predators and parasites of its home range, an \u003cstrong>invasive species\u003c/strong> can spread fast and reshape a food web."},{"id":"s3","title":"Station 3: an invasive insect (Ontario woodlots)","text":"The emerald ash borer was first found in Canada in 2002. Its larvae tunnel under the bark and kill ash trees. \u003cstrong>Change: ash trees ↓.\u003c/strong>","h":250,"nodes":[{"id":"ash","t":"Ash trees","x":180,"y":40,"fixed":"down","note":"killed by the borer"},{"id":"eab","t":"Emerald ash borer larvae","x":60,"y":125,"fixed":"up","note":"plentiful in dying ash"},{"id":"ins","t":"Insects that feed only on ash","x":180,"y":125},{"id":"light","t":"Light at the forest floor","x":300,"y":125},{"id":"wood","t":"Woodpeckers","x":60,"y":210},{"id":"shrub","t":"Shrubs and young trees in the gaps","x":300,"y":210}],"links":[{"f":"ash","to":"eab"},{"f":"ash","to":"ins"},{"f":"ash","to":"light","dash":true,"lab":"shade"},{"f":"eab","to":"wood"},{"f":"light","to":"shrub","dash":true,"lab":"growth"}],"_a":"TUcRDAsAEgwUEBZBSEZZWEVHXEEAC0dYFElEDw0DWEIUX0QWFEYcFEUNFBYGRgoUQxVEHg==","fb":{"wood":"You skipped the borer → woodpecker link: dying ash trees are full of larvae to eat, so woodpeckers increase at first.","ins":"Insects that feed only on ash lose their only food.","light":"You skipped the shade link: dead ash trees lose their leaves and open the canopy.","shrub":"You skipped the light → shrubs link: more light at the forest floor lets shrubs and young trees fill the gaps (module 45)."},"data":{"head":["","Before the borer","Ten years later"],"rows":[["Ash canopy cover","40%","2%"]]},"note":"Gaps in the canopy start a new round of community change, as you’ll see in module 45."}],"quickCheck":{"title":"Quick check","summary":"Ripple effects quick check","items":[{"id":"q1","goal":5,"prompt":"In a lake, walleye eat perch and perch eat zooplankton. If walleye are overfished, zooplankton will most likely…","right":"Fewer walleye → more perch → more zooplankton eaten.","wrong":"Fewer walleye → more perch → more zooplankton eaten. Follow the arrows: a change in one population passes along to what it eats and what eats it.","choices":[{"t":"decrease","_n":"14609","_k":"ec706aa0"},{"t":"stay the same","_n":"155f9","_k":"b40a4635"},{"t":"increase","_n":"165e9","_k":"e17cc2bd"},{"t":"disappear completely","_n":"175d9","_k":"bde84e21"}]},{"id":"q2","goal":5,"prompt":"What makes a species ‘keystone’?","right":"Its effect on the community is far larger than its numbers.","wrong":"Keystones can be predators, but the definition is about the size of their effect.","choices":[{"t":"Its effect on the community is far larger than its numbers","_n":"185c9","_k":"b57284e6"},{"t":"It’s always a top predator","_n":"195b9","_k":"035b274d"},{"t":"It’s always a plant","_n":"1a5a9","_k":"2739593e"},{"t":"It’s the most numerous species","_n":"1b599","_k":"5b2b5105"}]},{"id":"q3","goal":1,"prompt":"A tapeworm living in a wolf’s gut for years is an example of…","right":"It feeds on a living host over a long time (+/−).","wrong":"It feeds on a living host over a long time (+/−). A parasite usually feeds on a living host for a long time; killing it quickly would end its food supply.","choices":[{"t":"predation","_n":"1c589","_k":"405c47a1"},{"t":"parasitism","_n":"1d5b9","_k":"4884993b"},{"t":"mutualism","_n":"1e5c9","_k":"e2fa0bec"},{"t":"commensalism","_n":"1f5d9","_k":"da07c740"}]},{"id":"q4","goal":5,"prompt":"Why are invasive species often so successful in a new place?","right":"Released from their natural controls, they spread quickly.","wrong":"Released from their natural controls, they spread quickly.","choices":[{"t":"They need no food","_n":"1g5e9","_k":"e6c5d854"},{"t":"They reproduce asexually","_n":"1h579","_k":"fb4ef8f5"},{"t":"They are always larger","_n":"1i589","_k":"b8a9c37b"},{"t":"Their usual predators, parasites and competitors aren’t there","_n":"1j599","_k":"f4b0560a"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Interaction sorter","summary":"Interaction sorter","goal":1,"noun":"interaction","txt":true,"instruction":"Sort each interaction by who gains (+), who loses (−) and who is unaffected (0).","boxes":[{"id":"pred","label":"Predation","sub":"+/−"},{"id":"comp","label":"Competition","sub":"−/−"},{"id":"mut","label":"Mutualism","sub":"+/+"},{"id":"comm","label":"Commensalism","sub":"+/0"},{"id":"para","label":"Parasitism","sub":"+/−"}],"wrongDefault":"Ask who gains (+), who loses (−) and who is unaffected (0), then match the pair to a box.","items":[{"id":"i1","t":"A Canada lynx chases down and eats snowshoe hares","_a":"FBUUBgBG","why":"The lynx gains and the hare is killed and eaten: +/−, predation.","wrong":{"para":"The hare is killed and eaten, not fed on while it lives."},"hints":["Who gains and who loses?","One animal kills and eats the other.","+/−, the prey is eaten: predation."]},{"id":"i2","t":"Mycorrhizal fungi trade nutrients for sugars with sugar maple roots","_a":"FAgTF0Y=","why":"The fungus gets sugars and the tree gets nutrients: +/+.","wrong":{"comm":"Both partners gain here.","para":"The fungus gives something back, so the tree gains too."},"hints":["Does each partner get something?","Yes: both gain.","+/+: mutualism."]},{"id":"i3","t":"Winter ticks feed on a moose’s blood for weeks","_a":"FBUHEQVG","why":"The ticks feed on a living host for a long time: +/−, parasitism.","wrong":{"pred":"Predators kill and eat their prey; parasites feed on a living host over time."},"hints":["Who gains and who loses?","One feeds on the other while it stays alive.","+/−, living host: parasitism."]},{"id":"i4","t":"Barnacles ride on a grey whale, which is unaffected","_a":"FAYJDglG","why":"The barnacles gain a ride; the whale is unaffected: +/0.","wrong":{"mut":"Does the second partner gain anything? If not, it’s commensalism."},"hints":["Is the second partner helped or harmed?","Neither: it’s unaffected.","+/0: commensalism."]},{"id":"i5","t":"Two warbler species feed on the same caterpillars in the same tree layer","_a":"FAYJDhRG","why":"Each warbler leaves less food for the other: −/−.","wrong":{"pred":"Neither warbler eats the other; they’re after the same food."},"hints":["Is either species eating the other?","No: both need the same limited food or space.","−/−: competition."]},{"id":"i6","t":"In a lichen, an alga makes sugars and a fungus supplies water and shelter","_a":"FAgTF0Y=","why":"Each partner supplies what the other needs: +/+.","wrong":{"comm":"Both partners gain here."},"hints":["Does each partner get something?","Yes: both gain.","+/+: mutualism."]},{"id":"i7","t":"A brown-headed cowbird lays its eggs in a warbler’s nest, and the warbler raises the chicks","_a":"FBUHEQVG","why":"The cowbird gains care; the warbler loses its effort and often its own chicks: brood parasitism (+/−).","wrong":{"pred":"Predators kill and eat their prey; parasites feed on a living host over time.","comm":"The warbler loses its effort and often its own chicks, so it isn’t unaffected."},"hints":["Who gains and who loses?","The cowbird gains care; the warbler loses its effort and often its own chicks.","+/−, living host: parasitism (brood parasitism)."]},{"id":"i8","t":"Wolves and coyotes both hunt white-tailed deer in the same area","_a":"FAYJDhRG","why":"Both predators need the same deer, so each leaves less for the other: −/−.","wrong":{"pred":"Wolves and coyotes aren’t eating each other; they’re after the same food."},"hints":["Is either species eating the other?","No: both need the same limited food or space.","−/−: competition."]},{"id":"i9","t":"Burdock seeds hook onto a fox’s fur and are carried away; the fox is unaffected","_a":"FAYJDglG","why":"The burdock gains a ride for its seeds; the fox is unaffected: +/0.","wrong":{"mut":"Does the second partner gain anything? If not, it’s commensalism."},"hints":["Is the fox helped or harmed?","Neither.","+/0: commensalism."]},{"id":"i10","t":"Bees collect nectar from blueberry flowers and carry their pollen","_a":"FAgTF0Y=","why":"The bees get nectar and the blueberries get pollinated: +/+.","wrong":{"comm":"Both partners gain here."},"hints":["Does each partner get something?","Yes: both gain.","+/+: mutualism."]},{"id":"i11","t":"A great horned owl catches and eats deer mice","_a":"FBUUBgBG","why":"The owl kills and eats the mice: +/−, predation.","wrong":{"para":"The mouse is killed and eaten, not fed on while it lives."},"hints":["Who gains and who loses?","One animal kills and eats the other.","+/−, the prey is eaten: predation."]}]},{"id":"model","type":"custom","title":"Model and ripple reasoning","summary":"Model and ripple reasoning","star":true,"goal":[2,3,5],"instruction":"Six problems on the simulator’s models and on food-web ripples. R3 to R6 are non-routine (★).","how":"","items":[{"id":"r1","kind":"pair","goal":2,"prompt":"Predator–prey model, \u003cem>a\u003c/em> = 0.6, \u003cem>d\u003c/em> = 0.3. Balance point? (hares, lynx)","fields":["Hares","Lynx"],"_a":"bVZWU0hSAGs=","display":"300 hares, 60 lynx","why":"Hare balance = \u003cem>d\u003c/em> ÷ 0.001 = 300; lynx balance = \u003cem>a\u003c/em> ÷ 0.01 = 60.","wrong":[{"match":[60,300],"fb":"Swapped. Hare balance = \u003cem>d\u003c/em> ÷ 0.001."}],"general":"Hare balance = \u003cem>d\u003c/em> ÷ 0.001; lynx balance = \u003cem>a\u003c/em> ÷ 0.01.","hints":["Which rate sets each balance?","Hare balance = \u003cem>d\u003c/em> ÷ 0.001; lynx balance = \u003cem>a\u003c/em> ÷ 0.01.","0.3 ÷ 0.001 = 300 hares; 0.6 ÷ 0.01 = 60 lynx."]},{"id":"r2","kind":"pair","goal":2,"prompt":"Now \u003cem>d\u003c/em> rises to 0.6 (a lynx disease). New balance?","fields":["Hares","Lynx"],"_a":"bVNWU0hSAGs=","display":"600 hares, 60 lynx","why":"Only the hare balance uses \u003cem>d\u003c/em>: 0.6 ÷ 0.001 = 600. The lynx balance stays at 0.6 ÷ 0.01 = 60.","wrong":[{"match":[300,30],"fb":"The lynx balance depends only on \u003cem>a\u003c/em>; the hare balance doubles. In the model, the prey’s balance depends on the predator’s death rate. Faster prey breeding feeds more predators instead."},{"match":[60,600],"fb":"Swapped. Hare balance = \u003cem>d\u003c/em> ÷ 0.001."}],"general":"Use the formulas again with \u003cem>d\u003c/em> = 0.6 and \u003cem>a\u003c/em> = 0.6.","hints":["Which rate appears in the hare balance?","Hare balance = \u003cem>d\u003c/em> ÷ 0.001 = 0.6 ÷ 0.001.","600 hares; lynx stay at 0.6 ÷ 0.01 = 60."]},{"id":"r3","kind":"pair","goal":2,"star":true,"prompt":"Time series: hares peak in years 3, 17 and 31; lynx in years 6, 20 and 34. Lag, and cycle length?","fields":["Lag (years)","Cycle length (years)"],"_a":"bVZKUlA5","display":"lag 3 years; cycle length 14 years","why":"Lag: 6 − 3 = 3 years between the two curves. Cycle length: 17 − 3 = 14 years between one curve’s peaks.","wrong":[{"match":[14,3],"fb":"The lag is between the two curves; the cycle length is between one curve’s peaks."}],"general":"The lag is between the two curves; the cycle length is between one curve’s peaks.","hints":["Lag: compare a hare peak with the lynx peak after it.","6 − 3 = 3. Cycle: compare two hare peaks.","Lag 3 years; cycle 17 − 3 = 14 years."]},{"id":"r4","kind":"num","goal":3,"star":true,"prompt":"Competition, \u003cem>K\u003c/em>₁ = \u003cem>K\u003c/em>₂ = 500, overlap 0.5. Each species’ balance? (Use \u003cem>N\u003c/em> = (\u003cem>K\u003c/em> − \u003cem>αK\u003c/em>\u003csub>other\u003c/sub>)/(1 − \u003cem>α\u003c/em>²).)","_a":"BVZVTVdXAw==","tol":0.5,"display":"333 each","unit":"individuals","why":"(500 − 0.5 × 500)/(1 − 0.25) = 250 ÷ 0.75 = 333.3, so about 333 each.","wrong":[{"match":250,"fb":"(500 − 250)/(1 − 0.25) = 333.3; don’t forget to divide by 0.75."}],"general":"Work out the top, then divide by 1 − 0.5².","hints":["Top: 500 − 0.5 × 500.","250 ÷ (1 − 0.25).","250 ÷ 0.75 = 333.3: about 333."]},{"id":"r5","kind":"chips","goal":5,"star":true,"prompt":"Bass eat perch, perch eat zooplankton, zooplankton eat algae. Anglers remove most bass. Predict perch, zooplankton and algae.","groups":[{"id":"perch","t":"Perch"},{"id":"zoo","t":"Zooplankton"},{"id":"alg","t":"Algae"}],"choices":[["up","↑"],["down","↓"],["same","little change"]],"_a":"TUcWBhYHWBQMRxMTRkgSTFkKRFlGAF9BWEdKQQUIVxQMRxMTRhk=","display":"perch ↑, zooplankton ↓, algae ↑","why":"Fewer bass → more perch → more zooplankton eaten → fewer zooplankton → less grazing → more algae.","wrong":{"alg":"Fewer zooplankton means less grazing, so algae increase. Follow the arrows: a change in one population passes along to what it eats and what eats it.","zoo":"More perch eat more zooplankton.","perch":"Bass eat perch: fewer bass, more perch."},"hints":["Start at the top: what happens to perch when bass are removed?","Perch ↑, so they eat more zooplankton.","Perch ↑, zooplankton ↓, algae ↑."]},{"id":"r6","kind":"num","goal":3,"star":true,"prompt":"Competition, \u003cem>K\u003c/em>₁ = 800, \u003cem>K\u003c/em>₂ = 600. What is the largest overlap (in steps of 0.1) that still lets species 2 survive?","_a":"BktR","tol":0.000001,"display":"0.7","unit":"","why":"Species 2 survives if 600 > \u003cem>α\u003c/em> × 800, so \u003cem>α\u003c/em> \u003c 0.75. The largest step of 0.1 below 0.75 is 0.7.","wrong":[{"match":0.8,"fb":"0.8 × 800 = 640 > 600."},{"match":0.75,"fb":"The slider moves in steps of 0.1."}],"general":"Species 2 survives only if \u003cem>K\u003c/em>₂ > \u003cem>α\u003c/em> × \u003cem>K\u003c/em>₁.","hints":["Species 2 survives if \u003cem>K\u003c/em>₂ > \u003cem>α\u003c/em> × \u003cem>K\u003c/em>₁.","600 > \u003cem>α\u003c/em> × 800 means \u003cem>α\u003c/em> \u003c 0.75.","Largest step below 0.75: 0.7."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Jonah","how":"","instruction":"Jonah made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain the hare–lynx cycle.","steps":["When hares are plentiful, lynx catch food easily.","Well-fed lynx raise more kittens, so lynx numbers rise.","So lynx numbers peak at the same time as hare numbers.","Then both populations fall together."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The first mistake is earlier."],"fixes":[{"t":"Lynx peak before hares, because predators control prey.","why":"The predator can’t increase before its food does.","_n":"1k5a9","_k":"fc012734"},{"t":"Step 3 is correct.","why":"Predators need time to turn plentiful food into more young, so their peak comes after the prey’s.","_n":"1l539","_k":"3e7ff6ed"},{"t":"Lynx numbers never change; only hares cycle.","why":"Both curves cycle.","_n":"1m549","_k":"3da90cd3"},{"t":"Lynx keep increasing while hares are still fairly common, so their peak comes after the hares’ peak; the hare decline then pulls lynx numbers down.","why":"Predators need time to turn plentiful food into more young, so their peak comes after the prey’s.","_n":"1ncd9","_k":"fdc15c25"}],"hints":["Can lynx numbers rise without plenty of food?","They keep rising while food lasts.","So their peak lags behind the hares’."]},{"id":"e2","goal":3,"task":"Two diving duck species eat the same snails at the same depth in one lake. Predict the outcome.","steps":["They need the same resource in the same place: their niches overlap completely.","Each snail one species eats is lost to the other.","So competition lowers both populations.","Both species will therefore survive indefinitely at lower numbers."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct.","why":"With identical niches, the better competitor wins in the end, unless the two divide the resource.","_n":"1occ9","_k":"a40bf160"},{"t":"With identical niches, the better competitor eventually excludes the other, unless the two come to divide the resource (different depths or times).","why":"With identical niches, the better competitor wins in the end, unless the two divide the resource.","_n":"1pcf9","_k":"8343fd8d"},{"t":"Both will die out.","why":"The winner survives.","_n":"1qce9","_k":"e912c834"},{"t":"They will form a mutualism.","why":"Competition is −/−.","_n":"1rc99","_k":"28f927cf"}],"hints":["What does competitive exclusion say about identical niches?","One species wins in the long run.","Coexistence needs partitioning."]},{"id":"e3","goal":4,"task":"Harmless hoverflies have yellow-and-black stripes like stinging wasps. Classify this defence.","steps":["Wasps can sting, so birds learn to avoid yellow-and-black stripes.","Hoverflies look similar but can’t sting.","Two harmful species sharing a warning pattern is Batesian mimicry.","So hoverflies show Batesian mimicry."],"_a":"BA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","The label in step 4 happens to be right, but it rests on the wrong definition in step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Batesian: a harmless species copies a harmful one. Müllerian: harmful species share one warning pattern.","_n":"1sc89","_k":"4676abf7"},{"t":"Two harmful species sharing a pattern is camouflage.","why":"Camouflage hides; warning colours advertise.","_n":"1tcb9","_k":"187daf22"},{"t":"A harmless species copying a harmful one is Batesian mimicry; harmful species sharing one pattern is Müllerian mimicry. Hoverflies are Batesian mimics.","why":"Batesian: a harmless species copies a harmful one. Müllerian: harmful species share one warning pattern.","_n":"1uca9","_k":"a16c04ef"},{"t":"Hoverflies show Müllerian mimicry.","why":"Müllerian mimics are all harmful.","_n":"1vd59","_k":"d65ef4f6"}],"hints":["Is the hoverfly harmful?","No: it only looks harmful.","Harmless copying harmful = Batesian."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the simulator: the lag, the loop, or the way the balance point responds?"},{"id":"j2","q":"In your own words, why can’t two species with identical needs share them forever?"},{"id":"j3","q":"Explain to a friend how removing one species from a lake can change the algae."},{"id":"j4","q":"Which interaction or idea is still fuzzy? How will you check it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Mycorrhizal fungi take sugars from a sugar maple’s roots and help the tree absorb water and phosphorus. What kind of interaction is this?","options":[{"t":"Competition","why":"They aren’t after the same resource.","_n":"1wd49","_k":"6f12d71e"},{"t":"Commensalism","why":"The tree gains too. Mutualism means both gain. If one partner is unaffected, it’s commensalism.","_n":"1x479","_k":"712625ea"},{"t":"Mutualism","why":"Both partners gain (+/+).","_n":"1y489","_k":"85ba32cb"},{"t":"Parasitism","why":"The fungus gives something back.","_n":"1z459","_k":"d7a7fed2"}]},"b":{"prompt":"Burdock seed heads hook onto a fox’s fur and are carried to new places; the fox is unaffected. What kind of interaction is this?","options":[{"t":"Commensalism","why":"+/0.","_n":"20469","_k":"bbd039b9"},{"t":"Predation","why":"Nothing is eaten.","_n":"214b9","_k":"59bedd07"},{"t":"Mutualism","why":"The fox gains nothing. Mutualism means both gain. If one partner is unaffected, it’s commensalism.","_n":"224c9","_k":"88e79aa1"},{"t":"Parasitism","why":"The fox isn’t harmed.","_n":"23499","_k":"769c464a"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Harmless hoverflies have yellow-and-black stripes like stinging wasps. What is this called?","options":[{"t":"Camouflage","why":"Camouflage blends in; these stripes stand out.","_n":"244a9","_k":"0d23719d"},{"t":"Müllerian mimicry","why":"Müllerian mimics are all harmful. Batesian: a harmless species copies a harmful one. Müllerian: harmful species share one warning pattern.","_n":"254f9","_k":"42092527"},{"t":"Chemical defence","why":"Hoverflies have no sting or toxin.","_n":"26509","_k":"3fe5cc31"},{"t":"Batesian mimicry","why":"A harmless species resembles a harmful one.","_n":"27d99","_k":"119d6ce9"}]},"b":{"prompt":"Bumblebees and yellowjackets, both able to sting, share black-and-yellow warning colours. What is this called?","options":[{"t":"Camouflage","why":"The colours advertise; they don’t hide.","_n":"28d89","_k":"95837094"},{"t":"Commensalism","why":"That’s a +/0 relationship, not a defence.","_n":"29d79","_k":"5c64de7e"},{"t":"Batesian mimicry","why":"Batesian mimics are harmless. Batesian: a harmless species copies a harmful one. Müllerian: harmful species share one warning pattern.","_n":"2ad69","_k":"2fb265c3"},{"t":"Müllerian mimicry","why":"Harmful species share one warning signal.","_n":"2bdd9","_k":"48fe8799"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which statement is the competitive exclusion principle?","options":[{"t":"Species with the same niche share resources equally forever","why":"With identical niches, the better competitor wins in the end, unless the two divide the resource.","_n":"2cdc9","_k":"2087137c"},{"t":"Competition always ends with both species dying out","why":"The winner survives.","_n":"2ddb9","_k":"a60d8786"},{"t":"Two species that need exactly the same resources in the same place can’t coexist indefinitely; one outcompetes the other","why":"That’s competitive exclusion: identical niches end with one winner.","_n":"2eda9","_k":"ed2946e3"},{"t":"Predators exclude their prey from the best habitats","why":"That’s about predation, not competition.","_n":"2fd19","_k":"f5c4d0f3"}]},"b":{"prompt":"Two warbler species feed in the same spruce trees, but one feeds at the tips of upper branches and the other near the trunk lower down. What best describes this?","options":[{"t":"Competitive exclusion","why":"Both species persist here.","_n":"2gd09","_k":"709712cb"},{"t":"Predation","why":"Neither eats the other.","_n":"2hd39","_k":"154631df"},{"t":"Resource partitioning, which lets them coexist","why":"Dividing the tree lowers the overlap, so both species persist.","_n":"2id49","_k":"dd6d3e32"},{"t":"Mutualism","why":"Neither helps the other.","_n":"2jd59","_k":"a4ac5efb"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"In a model hare–lynx cycle, hares peak in years 4, 14 and 24. In which years do lynx most likely peak?","options":[{"t":"2, 12 and 22","why":"Lynx can’t rise before their food does.","_n":"2kd69","_k":"30b1b77d"},{"t":"9, 19 and 29","why":"Halfway through the cycle hares are near their lowest; lynx would already be falling.","_n":"2ld79","_k":"87817d4f"},{"t":"6, 16 and 26","why":"A short lag after each hare peak.","_n":"2md89","_k":"43ddffda"},{"t":"4, 14 and 24","why":"Lynx need time to respond. Predators need time to turn plentiful food into more young, so their peak comes after the prey’s.","_n":"2nd99","_k":"9339d533"}]},"b":{"prompt":"Hares peak in years 3, 13 and 23. In which years do lynx most likely peak?","options":[{"t":"8, 18 and 28","why":"By then hares are near their lowest.","_n":"2oda9","_k":"d138c346"},{"t":"5, 15 and 25","why":"A short lag after each hare peak.","_n":"2pcb9","_k":"575a90f4"},{"t":"1, 11 and 21","why":"Predators can’t lead their food.","_n":"2qcc9","_k":"c163e317"},{"t":"3, 13 and 23","why":"Lynx need time to respond. Predators need time to turn plentiful food into more young, so their peak comes after the prey’s.","_n":"2recd","_k":"a60d5205"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"In the module’s model, the prey balance = (predator death rate) ÷ 0.001 and the predator balance = (prey birth rate) ÷ 0.01. A disease raises the lynx death rate from 0.3 to 0.5; the hare birth rate stays 0.4. What happens to the balance point?","options":[{"t":"Hares rise from 300 to 500; lynx stay at 40","why":"Only the hare balance uses the death rate.","_n":"2sedd","_k":"cb5e8754"},{"t":"Both fall","why":"Use the formulas: the hare balance goes up.","_n":"2teed","_k":"e57b8889"},{"t":"Lynx fall from 40 to 24; hares stay at 300","why":"Intuitive, but the lynx balance depends only on the hare birth rate.","_n":"2uefd","_k":"01f6c4d7"},{"t":"Hares fall from 300 to 180","why":"The death rate is in the numerator: 0.5 ÷ 0.001 = 500.","_n":"2vf0d","_k":"0b465f77"}]},"b":{"prompt":"In the module’s model, the prey balance = (predator death rate) ÷ 0.001 and the predator balance = (prey birth rate) ÷ 0.01. A mild winter raises the hare birth rate from 0.4 to 0.6; the lynx death rate stays 0.3. What happens to the balance point?","options":[{"t":"Hares stay at 300; lynx rise from 40 to 60","why":"Extra hare births feed more lynx.","_n":"2wf1d","_k":"ef4ed188"},{"t":"Hares fall; lynx rise","why":"The hare balance doesn’t change.","_n":"2xf2d","_k":"0eeadc1b"},{"t":"Both rise by half","why":"Only the lynx balance uses the hare birth rate.","_n":"2yf3d","_k":"e657848f"},{"t":"Hares rise from 300 to 450; lynx stay at 40","why":"In the model, the prey’s balance depends on the predator’s death rate. Faster prey breeding feeds more predators instead.","_n":"2zf4d","_k":"3a2ea44f"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"In the competition model, species 2 survives only if \u003cem>K\u003c/em>₂ > overlap × \u003cem>K\u003c/em>₁, and species 1 only if \u003cem>K\u003c/em>₁ > overlap × \u003cem>K\u003c/em>₂. With \u003cem>K\u003c/em>₁ = 500, \u003cem>K\u003c/em>₂ = 400 and overlap 0.9, what happens?","options":[{"t":"Both die out","why":"Species 1 passes its test.","_n":"30f5d","_k":"7f788d03"},{"t":"Both coexist at lower numbers","why":"Check species 2: 400 isn’t more than 450. With identical niches, the better competitor wins in the end, unless the two divide the resource.","_n":"31f2d","_k":"0a1096a1"},{"t":"Species 2 wins because its \u003cem>K\u003c/em> is smaller","why":"A smaller \u003cem>K\u003c/em> is a disadvantage here.","_n":"32f1d","_k":"d80db675"},{"t":"Species 1 survives and species 2 is excluded","why":"400 \u003c 0.9 × 500 = 450, but 500 > 0.9 × 400 = 360.","_n":"33f0d","_k":"15c094ee"}]},"b":{"prompt":"In the competition model, species 2 survives only if \u003cem>K\u003c/em>₂ > overlap × \u003cem>K\u003c/em>₁, and species 1 only if \u003cem>K\u003c/em>₁ > overlap × \u003cem>K\u003c/em>₂. With \u003cem>K\u003c/em>₁ = 600, \u003cem>K\u003c/em>₂ = 500 and overlap 0.8, what happens?","options":[{"t":"Both survive","why":"500 > 480 and 600 > 400.","_n":"34efd","_k":"50375e5e"},{"t":"Species 1 is excluded","why":"600 > 0.8 × 500 = 400.","_n":"35f6d","_k":"876b35f1"},{"t":"Species 2 is excluded","why":"500 is just over 0.8 × 600 = 480.","_n":"36f5d","_k":"f76587ad"},{"t":"Both die out","why":"Both pass their tests.","_n":"37f4d","_k":"21ef0011"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why the predator’s peak comes after the prey’s?","options":[{"t":"“The peaks are actually at the same time; graphs just show them shifted.”","why":"Predators need time to turn plentiful food into more young, so their peak comes after the prey’s.","_n":"38f3d","_k":"e4e2311d"},{"t":"“Predators wait until prey numbers are highest before they start hunting.”","why":"Predators hunt all the time.","_n":"39fad","_k":"9b1345d2"},{"t":"“Predators peak later because they’re bigger and grow more slowly.”","why":"Size isn’t the reason; the timing of food is.","_n":"3af9d","_k":"34a01fe2"},{"t":"“Predators need time to turn plentiful food into more young, so their numbers keep rising after prey start to fall; only when prey become scarce do predators decline.”","why":"The timing of food explains the lag.","_n":"3bf8d","_k":"1811f16f"}]},"b":{"prompt":"Which is the best explanation of why prey start to recover after predators decline?","options":[{"t":"“With fewer predators, fewer prey are eaten, so prey births outpace deaths and prey numbers rise again.”","why":"Fewer predators means fewer prey deaths.","_n":"3cf9d","_k":"752d9c3b"},{"t":"“Prey numbers never fall in a cycle.”","why":"They fall after their own peak.","_n":"3df6d","_k":"07bbc5cc"},{"t":"“Prey recover because they migrate in from elsewhere.”","why":"This model has no migration.","_n":"3ef7d","_k":"c6294e60"},{"t":"“Prey recover when predators reach their peak.”","why":"At the predator peak, prey are being eaten fastest.","_n":"3ff4d","_k":"ad44a7dc"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Brown-headed cowbirds lay eggs in warblers’ nests, and warblers raise the cowbird chicks, often losing their own. Which description is correct?","options":[{"t":"Parasitism: cowbird +, warbler −","why":"The cowbird exploits a living host that loses its effort and chicks.","_n":"3gf5d","_k":"c0343053"},{"t":"Mutualism: both +","why":"The warbler gains nothing.","_n":"3hf2d","_k":"6638fe0c"},{"t":"Predation: cowbird +, warbler −, because the cowbird eats the warbler","why":"No one is eaten; the host is exploited.","_n":"3if3d","_k":"978b6518"},{"t":"Commensalism: cowbird +, warbler 0","why":"The warbler loses its effort and chicks. Mutualism means both gain. If one partner is unaffected, it’s commensalism.","_n":"3j00d","_k":"cfe8d2ae"}]},"b":{"prompt":"A remora rides on a shark and eats scraps from its meals; the shark is unaffected. Which description is correct?","options":[{"t":"Commensalism: remora +, shark 0","why":"One gains and the other is unaffected.","_n":"3k01d","_k":"693f5519"},{"t":"Parasitism: remora +, shark −","why":"The shark isn’t harmed.","_n":"3l7ed","_k":"3fdea3d0"},{"t":"Mutualism: both +","why":"Mutualism means both gain. If one partner is unaffected, it’s commensalism.","_n":"3m7dd","_k":"b043f5d8"},{"t":"Competition: both −","why":"They aren’t competing.","_n":"3n80d","_k":"70a127b2"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Zebra mussels spread through Lake Erie, filtering large amounts of plankton from the water. Which set of effects is most likely?","options":[{"t":"Clearer water, less plankton, and fewer young fish that feed on plankton","why":"Filtering removes plankton, so the water clears and plankton-eaters lose food.","_n":"3o7fd","_k":"b54a39df"},{"t":"Clearer water and more young fish, because the water is cleaner","why":"Clear water here means less food for plankton-eaters. Follow the arrows: a change in one population passes along to what it eats and what eats it.","_n":"3p82d","_k":"1a48fb0e"},{"t":"Murkier water, more plankton and more young fish","why":"Filtering removes plankton.","_n":"3q81d","_k":"e6adbd1c"},{"t":"No change, because mussels eat only bottom algae","why":"They filter the open water.","_n":"3r84d","_k":"b5ada3aa"}]},"b":{"prompt":"Emerald ash borers kill most of the ash trees in an Ontario woodlot. Which set of effects is most likely in the next few years?","options":[{"t":"More woodpeckers feeding on the larvae, fewer insects that eat only ash, and more light reaching the forest floor","why":"The change passes to what eats the larvae, what eats the ash and what the ash shaded.","_n":"3s83d","_k":"4a62450f"},{"t":"No change except to the ash trees","why":"Follow the arrows: a change in one population passes along to what it eats and what eats it.","_n":"3t76d","_k":"51f481cb"},{"t":"Fewer woodpeckers, because the trees are dying","why":"Dying ash trees are full of larvae to eat.","_n":"3u75d","_k":"cfbefbb1"},{"t":"Less light at the forest floor, because dead trees shade it","why":"Dead trees lose their leaves and open the canopy.","_n":"3v84d","_k":"66ffe8ae"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"In a model park, elk have over-browsed streamside willows for years. Wolves are brought back and hunt the elk. Which chain of effects is most likely?","options":[{"t":"Elk increase because wolves eat their competitors","why":"Wolves prey on elk.","_n":"3w85d","_k":"b5fcb7f6"},{"t":"Only the elk are affected","why":"Follow the arrows: a change in one population passes along to what it eats and what eats it.","_n":"3x86d","_k":"6d970622"},{"t":"Fewer elk browse near streams, so willows regrow, and beavers that use willow increase","why":"The wolves’ effect passes through the elk to the willows and on to the beavers.","_n":"3y87d","_k":"eeaa68cd"},{"t":"Willows decline further because wolves trample them","why":"The main link is through the elk. Follow the arrows: a change in one population passes along to what it eats and what eats it.","_n":"3z80d","_k":"60814906"}]},"b":{"prompt":"Sea otters return to a stretch of coast where urchins had grazed the kelp to bare rock. Which chain of effects is most likely?","options":[{"t":"Urchins decline, kelp regrows, and fish that shelter in kelp increase","why":"Otters eat urchins, so grazing drops and the kelp forest returns.","_n":"4081d","_k":"60aae19b"},{"t":"Urchins increase because otters scare off their predators","why":"Otters eat urchins.","_n":"4182d","_k":"cf61b50a"},{"t":"Only urchins are affected","why":"Follow the arrows: a change in one population passes along to what it eats and what eats it.","_n":"4283d","_k":"9389a868"},{"t":"Kelp declines further","why":"Fewer urchins means less grazing. Follow the arrows: a change in one population passes along to what it eats and what eats it.","_n":"437cd","_k":"2d7c7cf8"}]}}]},"task":{"title":"Make room for two","summary":"Make room for two","statement":"\u003cp>Set up a competition between two species that compete strongly, where both still survive and the smaller one isn’t squeezed too hard. Can you find all the settings that work?\u003c/p>\u003col class=\"si-conds\">\u003cli>Both species survive.\u003c/li>\u003cli>They compete strongly: overlap at least 0.6.\u003c/li>\u003cli>Species 1 has the larger habitat: \u003cem>K\u003c/em>₁ > \u003cem>K\u003c/em>₂.\u003c/li>\u003cli>Species 2 keeps at least 150 individuals at the balance.\u003c/li>\u003c/ol>","checks":["Both survive","Strong competition","Species 1’s habitat is larger","Species 2 keeps at least 150"],"tips":["Species 2 survives only if \u003cem>K\u003c/em>₂ is bigger than \u003cem>α\u003c/em> × \u003cem>K\u003c/em>₁. With strong overlap, \u003cem>K\u003c/em>₂ must be close to \u003cem>K\u003c/em>₁.","Raise the overlap to at least 0.6.","Make species 1’s carrying capacity the larger one.","Species 2’s balance is (\u003cem>K\u003c/em>₂ − \u003cem>α\u003c/em>\u003cem>K\u003c/em>₁)/(1 − \u003cem>α\u003c/em>²). Bring \u003cem>K\u003c/em>₂ closer to \u003cem>K\u003c/em>₁ or lower the overlap a little."],"explainPrompt":"Explain why strong competitors can coexist only when their carrying capacities are close, using one of your designs.","vocab":"Use the words niche overlap, competitive exclusion, carrying capacity and balance.","more":"Can you find all the settings that work?","after3":"Strong competitors coexist only when their habitats are similar in size. The closer \u003cem>K\u003c/em>₂ is to \u003cem>K\u003c/em>₁, the more overlap they can tolerate."},"cards":[["Predation","+/−: one animal kills and eats another (lynx and hare)."],["Parasitism","+/−: the parasite feeds on a living host over time (winter ticks on moose)."],["Competition","−/−: both need the same limited resource."],["Mutualism","+/+: both partners gain (mycorrhizal fungi and tree roots)."],["Commensalism","+/0: one gains, the other is unaffected (barnacles on a whale)."],["Predator–prey cycle","Prey rise → predators rise → prey fall → predators fall → repeat. The predator’s peak lags."],["Competitive exclusion","Identical niches can’t coexist forever; one species wins."],["Resource partitioning","Dividing a resource (place, time, food size) so competitors can coexist."],["Batesian mimicry","A harmless species resembles a harmful one (hoverfly and wasp)."],["Müllerian mimicry","Harmful species share one warning pattern (bumblebee and yellowjacket)."],["Keystone species","Its effect on the community is far larger than its numbers (sea otters)."],["Invasive species","A non-native species that spreads and harms its new community, often freed from its natural controls (zebra mussel, emerald ash borer)."]]}};</script>
