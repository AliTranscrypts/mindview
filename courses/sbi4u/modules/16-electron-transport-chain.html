.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 16: electron staircase (S4 membrane scene + energy staircase), oxygen stations, route builder, poison detective, task, hero.
   Roles: e⁻ --bio-e, H⁺ --bio-h, NADH --bio-nadh, FADH₂ --bio-fadh, O₂ and H₂O --bio-o2; complexes in --ink-2 outlines;
   blocked complexes hatched in --ink with the word "Blocked". */

/* hero equation */
.hero .hero-eq .et-heq{display:flex;flex-direction:column;gap:.3em;line-height:1.2;font-size:.6em}
.et-heq1,.et-heq2{display:block;white-space:normal}
.et-hk{white-space:nowrap}
.et-heq2{font-size:.82em;color:var(--ink-2)}
.et-cn{color:var(--bio-nadh);font-weight:700}
.et-co{color:var(--bio-o2);font-weight:700}
.et-ce{color:var(--bio-e);font-weight:700}
.et-ch{color:var(--bio-h);font-weight:700}
.et-hero{width:100%;aspect-ratio:520 / 334}
.et-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 12 / 09 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.55}

/* explore layout */
.et-top{margin-bottom:14px}
.et-pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"scene scene" "ctrl read";gap:16px 28px;align-items:start}
.et-scene{grid-area:scene;min-width:0}.et-ctrl{grid-area:ctrl;min-width:0}.et-read{grid-area:read;min-width:0}
.et-pg [hidden],.et-aha[hidden]{display:none!important}
.et-figs{display:grid;grid-template-columns:minmax(0,1.73fr) minmax(0,1fr);gap:12px;align-items:start}
.et-figs.et-one{grid-template-columns:minmax(0,1fr)}
.et-figs.et-one .et-memw{max-width:720px}
.et-memw,.et-stw{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.et-memw svg{display:block;width:100%;height:auto;aspect-ratio:520 / 330}
.et-stw svg{display:block;width:100%;height:auto;aspect-ratio:300 / 330}
.et-queue{margin:8px 0 0;font-size:.92rem;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.et-gauges{display:grid;gap:6px;margin-top:8px}
.et-gauge{display:flex;align-items:center;gap:10px;font-size:.9rem}
.et-mlab{flex:0 0 11em;font-weight:700}
.et-mbar{position:relative;flex:1 1 auto;height:14px;border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet);overflow:hidden}
.et-mbar i{position:absolute;left:0;top:0;bottom:0}
.et-mbar-o i{background:var(--bio-o2)}
.et-mbar-h i{background:var(--bio-h)}
.et-gauge b{flex:0 0 2.5em;text-align:right}
.et-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:8px 0 0;color:var(--ink-2)}
.et-legend > span{display:inline-flex;align-items:center;gap:4px}
.et-ld{display:inline-block;width:10px;height:10px;border-radius:50%}
.et-ld-e{background:var(--bio-e)}.et-ld-h{background:var(--bio-h)}
.et-lk{display:inline-block;width:18px;height:10px;border-radius:5px}
.et-lk-n{background:var(--bio-nadh)}.et-lk-f{background:var(--bio-fadh)}.et-lk-o{background:var(--bio-o2)}
.et-cap{margin:8px 0 0;font-size:.95rem;min-height:2.8em}
.et-ctrl > div{display:grid;gap:10px}
.et-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.et-note1{margin:-4px 0 0}
.et-why{margin:0;color:var(--red);font-weight:600;min-height:1.2em}
.et-sl{margin:0}
.et-sl input{width:100%;accent-color:var(--ink)}
.et-blk{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px 10px;margin:0;display:grid;gap:6px}
.et-blk legend{font-size:.88rem;font-weight:700;color:var(--ink-2);padding:0 4px}
.et-chk{display:flex;align-items:center;gap:8px;min-height:32px;font-size:.92rem;cursor:pointer}
.et-chk input{width:20px;height:20px;accent-color:var(--ink);flex:0 0 auto}
.et-tog{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.et-rd > div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0}
.et-rd dt{flex:0 0 42%}
.et-rd dd{margin:0;text-align:right;font-weight:700}
.et-morebtn{display:none;margin-top:6px}
.et-mnote{margin:12px 0 0}
.et-aha{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--ink);background:var(--paper);border-radius:6px;font-size:.92rem}

/* membrane scene SVG */
.et-t{font:500 13px var(--font-ui);fill:var(--ink)}
.et-ts{font:500 12px var(--font-ui);fill:var(--ink-2)}
.et-tb{font:700 13px var(--font-ui);fill:var(--ink)}
.et-b{font-weight:700}
.et-dn{font:700 12px var(--font-ui);fill:var(--ink-2)}
.et-halo{paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.et-ims{fill:color-mix(in srgb,var(--bio-h) 5%,var(--sheet))}
.et-memb{fill:color-mix(in srgb,var(--ink-2) 16%,var(--sheet))}
.et-mat{fill:var(--sheet)}
.et-mline{stroke:var(--ink-2);stroke-width:1.4;fill:none}
.et-cx{fill:color-mix(in srgb,var(--ink-2) 8%,var(--sheet));stroke:var(--ink-2);stroke-width:2}
.et-cxl{fill:color-mix(in srgb,var(--bio-e) 16%,var(--sheet))}
.et-cxn{font:800 16px var(--font-ui);fill:var(--ink)}
.et-mob{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.8}
.et-mobl{fill:color-mix(in srgb,var(--bio-e) 16%,var(--sheet))}
.et-miss{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:4 3}
.et-ml{font:700 12px var(--font-ui);fill:var(--ink)}
.et-guide{fill:none;stroke:var(--bio-e);stroke-width:1.4;stroke-dasharray:3 5;opacity:.55}
.et-hbg{fill:var(--sheet);opacity:.35}
.et-hl{stroke:var(--ink);stroke-width:2}
.et-blkx{fill:url(#et-hatch);stroke:var(--ink);stroke-width:2.4}
.et-blkt{font:800 12.5px var(--font-ui);fill:var(--ink)}
.et-e{fill:var(--bio-e)}
.et-h{fill:var(--bio-h)}
.et-ch0{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 4;opacity:.6;fill:none}
.et-ch0h{fill:none;stroke:var(--ink-2);stroke-width:1.2;opacity:.6}
.et-chon{stroke:var(--bio-h);stroke-width:2.2;fill:none;opacity:.8}
.et-hp{font:800 12.5px var(--font-ui);fill:var(--bio-h)}
.et-pn{fill:var(--bio-nadh)}
.et-pf{fill:var(--bio-fadh)}
.et-pn0{fill:var(--sheet);stroke:var(--bio-nadh);stroke-width:2}
.et-pf0{fill:var(--sheet);stroke:var(--bio-fadh);stroke-width:2}
.et-pt{font:800 12px var(--font-ui);fill:var(--sheet)}
.et-ptn{font:800 12px var(--font-ui);fill:var(--bio-nadh)}
.et-ptf{font:800 12px var(--font-ui);fill:var(--bio-fadh)}
.et-o2{fill:var(--bio-o2)}
.et-o2x{fill:var(--sheet);stroke:var(--ink);stroke-width:1.8;stroke-dasharray:4 3}
.et-ptx{font:800 12px var(--font-ui);fill:var(--ink)}

/* staircase SVG */
.et-stair{fill:none;stroke:var(--ink-2);stroke-width:3;stroke-linejoin:round}
.et-stairf{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:4 3}
.et-sl{font:700 12.5px var(--font-ui);fill:var(--ink)}
.et-sln{fill:var(--bio-nadh)}.et-slf{fill:var(--bio-fadh)}.et-slo{fill:var(--bio-o2)}
.et-dl{font:700 12px var(--font-ui);fill:var(--ink-2)}
.et-dl.on{fill:var(--ink)}
.et-hp2{font:600 11.5px var(--font-ui);fill:var(--ink-2)}
.et-hp2.on{fill:var(--bio-h);font-weight:800}
.et-ax{stroke:var(--ink-2);stroke-width:1.4}
.et-axh{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.et-x{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.et-hc{font:800 14px var(--font-ui);fill:var(--bio-h)}
.et-kw{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:6 4}
.et-kwh{fill:none;stroke:var(--ink-2);stroke-width:2}

/* Part 3 */
.et-p3 h3{margin-top:0}
.et-lad{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:8px}
.et-ladw{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.et-ladw svg{display:block;width:100%;height:auto;aspect-ratio:390 / 340}
.et-ladc{display:grid;gap:10px}
.et-ladc p{margin:0}
.et-rail{stroke:var(--ink-2);stroke-width:3}
.et-rung{stroke:var(--ink-2);stroke-width:2.4}
.et-rung.on{stroke:var(--ink);stroke-width:4}
.et-ll{font:600 13px var(--font-ui);fill:var(--ink-2)}
.et-ll.on{fill:var(--ink);font-weight:800}
.et-lln{fill:var(--bio-nadh)}.et-llo{fill:var(--bio-o2)}
.et-lread{font-size:.95rem;min-height:3em}
.et-adds{margin:6px 0;padding-left:1.4em;display:flex;flex-wrap:wrap;gap:2px 22px}
.et-segs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.et-segb[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.et-segb.done{font-weight:800}
.et-qp{margin:10px 0 6px}
.et-chips{display:flex;flex-wrap:wrap;gap:8px}
.et-chips .chip{text-align:left;white-space:normal;max-width:100%;min-height:36px}
.et-chipcol{flex-direction:column;align-items:flex-start}
.et-ask{margin-top:14px}
.et-st2 .plot-wrap{max-width:640px}
.et-ask .fb,.et-p3 #et-segq .fb{margin-top:8px}

/* route builder */
.et-rlab{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:8px 0 4px}
.et-route{list-style:none;margin:0;padding:8px;display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center;min-height:48px;border:1.5px dashed var(--rule);border-radius:8px}
.et-route li{display:inline-flex;align-items:center;gap:4px}
.et-rempty{font-size:.9rem;padding:4px}
.et-rt,.et-tile{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.3em .7em;min-height:36px;font-size:.92rem;font-weight:600}
.et-rt{border-color:var(--ink);background:var(--hi-soft)}
.et-rt.good{border-color:var(--green);background:var(--good-bg)}
.et-rarr{color:var(--ink-2);font-weight:700}
.et-bank{display:flex;flex-wrap:wrap;gap:6px}

/* task */
.et-tlist{margin:0 0 .8em;padding-left:1.4em}
.et-trule{font-size:.92rem;padding:8px 12px;background:var(--paper);border-radius:6px}
.et-tin{display:grid;gap:12px;margin:10px 0}
.et-tpvw h4{margin:0 0 6px}
.et-tpvw svg{width:100%;height:auto;display:block;aspect-ratio:520 / 220}
.et-tread{margin:8px 0 4px;font-size:.95rem}
.et-tbg{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.et-o2s{fill:var(--sheet);stroke:var(--bio-o2);stroke-width:1.8}
.et-o2s.on{fill:var(--bio-o2)}
.et-tgt{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.et-gbg{fill:var(--paper);stroke:var(--rule);stroke-width:1.2}
.et-gband{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.4;stroke-dasharray:4 3}
.et-gfill{fill:var(--bio-h);opacity:.85}

/* phone */
@media (max-width:820px){
  .et-pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"scene" "ctrl" "read"}
  .et-figs{grid-template-columns:minmax(0,1fr)}
  .et-stw{max-width:420px}
  .et-lad{grid-template-columns:minmax(0,1fr)}
  .et-ladw{max-width:460px}
}
@media (max-width:600px){
  .et-morebtn{display:inline-block}
  .et-rd.et-col .et-x{display:none}
  .et-mlab{flex-basis:8.5em}
  .et-memw .et-ts{font-size:18px}
  .et-hero .et-ts{font-size:16px}
  .et-memw .et-dn{font-size:15px}
  .et-memw .et-ml,.et-memw .et-blkt{font-size:17px}
  .et-memw .et-pt,.et-memw .et-ptn,.et-memw .et-ptf,.et-memw .et-ptx{font-size:15px}
  .et-memw .et-hp,.et-hero .et-hp{font-size:17px}
  .et-memw .et-cxn{font-size:22px}
  .et-hero .et-sl,.et-hero .et-pt,.et-hero .et-ptn{font-size:15px}
  .et-hero .et-hc{font-size:18px}
  .et-stw .et-ts,.et-stw .et-hp2{font-size:13.5px}
  .et-stw .et-sl,.et-stw .et-dl{font-size:14px}
  .et-ladw .et-ll{font-size:14.5px}
  .et-ladw .et-ts,.et-ladw .et-hp2,.et-ladw .et-dl{font-size:13px}
  .et-tpvw .et-ts,.et-tpvw .et-tb,.et-tpvw .et-blkt{font-size:15px}
}

topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"afe29f0f","content":{"id":"16-electron-transport-chain","kind":"topic","title":"The electron transport chain","topic":"The Electron Transport Chain","readyTopic":"the electron transport chain","hero":{"eq":"\u003cspan class=\"et-heq\">\u003cspan class=\"et-heq1\">\u003cspan class=\"et-hk\">\u003cspan class=\"et-cn\">NADH\u003c/span> →\u003c/span> \u003cspan class=\"et-hk\">I →\u003c/span> \u003cspan class=\"et-hk\">Q →\u003c/span> \u003cspan class=\"et-hk\">III →\u003c/span> \u003cspan class=\"et-hk\">cyt \u003ci>c\u003c/i> →\u003c/span> \u003cspan class=\"et-hk\">IV →\u003c/span> \u003cspan class=\"et-hk et-co\">O₂\u003c/span>\u003c/span>\u003cspan class=\"et-heq2\">\u003cspan class=\"et-hk\">½\u003cspan class=\"et-co\">O₂\u003c/span> +\u003c/span> \u003cspan class=\"et-hk\">2\u003cspan class=\"et-ce\">e⁻\u003c/span> +\u003c/span> \u003cspan class=\"et-hk\">2\u003cspan class=\"et-ch\">H⁺\u003c/span> →\u003c/span> \u003cspan class=\"et-hk et-co\">H₂O\u003c/span>\u003c/span>\u003c/span>","eqLabel":"NADH passes its electrons to complex I, then ubiquinone Q, complex III, cytochrome c, complex IV and finally O₂. Underneath: one half O₂ plus 2 electrons plus 2 H⁺ gives H₂O.","eqSize":"sm","headline":"Electrons fall downhill, and every step pays","text":"NADH and FADH₂ arrive full of high-energy electrons. In the \u003cstrong>inner mitochondrial membrane\u003c/strong>, a chain of carriers passes those electrons along, each one holding them a little more tightly than the last. The energy released along the way \u003cstrong>pumps H⁺\u003c/strong> across the membrane. At the bottom of the staircase, \u003cstrong>oxygen\u003c/strong> takes the electrons and becomes \u003cstrong>water\u003c/strong>.","fig":{"html":"\u003cdiv class=\"et-hero\" id=\"et-hero\" role=\"img\" aria-label=\"A staircase sits below a membrane strip. A teal NADH waits on the top step. Two violet electrons hop down the steps: NADH, complex I, Q, complex III, cytochrome c, complex IV. At complex I, complex III and complex IV a magenta pair of H⁺ pops up through the membrane into the space above. At the bottom step a blue O₂ catches the electrons, takes H⁺ from below and becomes H₂O. A counter reads 10 H⁺ pumped, and the empty NAD⁺ floats back toward the Krebs cycle.\">\u003c/div>"}},"goals":["I can name the parts of the electron transport chain and where it is.","I can trace the path of electrons from NADH and from FADH₂ to O₂.","I can explain why electrons release energy in steps, and how that energy pumps H⁺ into the intermembrane space.","I can explain the role of O₂ as the final electron acceptor and predict what happens without it.","I can predict the effects of blocking a complex or carrier, using evidence such as O₂ use.","I can count H⁺ pumped and O₂ used for a given mix of NADH and FADH₂."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Carriers and redox","goal":2,"prompt":"When NADH gives up its electrons, what does it become?","options":[{"t":"NAD⁺, an empty carrier ready to be reused","why":"Unloading regenerates NAD⁺.","_n":"0933","_k":"7b1ccb0e"},{"t":"NADPH","why":"NADPH belongs to photosynthesis.","_n":"1943","_k":"13893e47"},{"t":"ATP","why":"NADH and ATP are different molecules.","_n":"2953","_k":"bbdd7c99"},{"t":"FADH₂","why":"NAD and FAD are separate carriers.","_n":"3963","_k":"7e73bb2b"}],"hints":["NADH is the loaded form.","Unloading removes electrons and H.","NAD⁺."]},{"id":"w2","skill":"Carriers and redox","goal":3,"prompt":"An atom that strongly attracts electrons is described as…","options":[{"t":"an electron donor","why":"Donors give electrons away.","_n":"4973","_k":"733c9a31"},{"t":"highly electronegative","why":"O is one of the most electronegative atoms.","_n":"5983","_k":"c992e434"},{"t":"reduced","why":"Reduced describes a molecule after gaining electrons.","_n":"6993","_k":"8b271749"},{"t":"positively charged","why":"Electronegativity isn’t a charge.","_n":"79a3","_k":"c181ca5c"}],"hints":["Think of the tug-of-war in module 11.","Which atom pulls hardest?","Electronegative."]},{"id":"w3","skill":"Mitochondrion structure","goal":1,"prompt":"Where are the electron transport chain proteins found?","options":[{"t":"In the inner mitochondrial membrane (including the cristae)","why":"The folds give more room for chains.","_n":"89b3","_k":"3efd51ab"},{"t":"In the matrix","why":"That’s where the Krebs cycle runs.","_n":"99eb","_k":"92356819"},{"t":"In the cytosol","why":"That’s glycolysis.","_n":"a9db","_k":"650fae2c"},{"t":"In the outer membrane","why":"The outer membrane is leaky to small molecules.","_n":"b9cb","_k":"d49a9c90"}],"hints":["A membrane is needed to separate H⁺.","Which membrane is folded?","The inner membrane."]},{"id":"w4","skill":"Mitochondrion structure","goal":3,"prompt":"Which space lies between the inner and outer mitochondrial membranes?","options":[{"t":"The intermembrane space","why":"H⁺ builds up here.","_n":"c9bb","_k":"d6dc519f"},{"t":"The stroma","why":"Chloroplast term.","_n":"da2b","_k":"e79df4c7"},{"t":"The matrix","why":"The matrix is inside the inner membrane.","_n":"ea1b","_k":"7f573c71"},{"t":"The lumen","why":"Lumen is the inside of a thylakoid.","_n":"fa0b","_k":"1e952773"}],"hints":["Between the two membranes.","It’s named for its position.","Intermembrane space."]},{"id":"w5","skill":"Per-glucose counts","goal":6,"prompt":"How many NADH does one glucose produce across glycolysis, pyruvate oxidation and the Krebs cycle?","options":[{"t":"3","why":"That’s one Krebs turn.","_n":"g9fb","_k":"b693709c"},{"t":"6","why":"Add glycolysis and pyruvate oxidation.","_n":"ha6b","_k":"16e8da7f"},{"t":"8","why":"Glycolysis makes 2 too.","_n":"ia5b","_k":"757f3b81"},{"t":"10","why":"2 + 2 + 6.","_n":"ja4b","_k":"a4e55f70"}],"hints":["Add stage by stage.","2 (glycolysis) + 2 (pyruvate oxidation) + 6 (Krebs).","10."]},{"id":"w6","skill":"Per-glucose counts","goal":6,"prompt":"How many FADH₂ does one glucose produce?","options":[{"t":"0","why":"The Krebs cycle makes FADH₂.","_n":"ka5b","_k":"d32cadc7"},{"t":"1","why":"One glucose turns the cycle twice.","_n":"la2b","_k":"de5c331f"},{"t":"2","why":"One per Krebs turn, two turns.","_n":"ma3b","_k":"1565b768"},{"t":"4","why":"Only the succinate step makes FADH₂.","_n":"na0b","_k":"198c7a2b"}],"hints":["Which stage makes FADH₂?","The Krebs cycle, once per turn.","2."]}],"refreshers":{"Carriers and redox":"NADH and FADH₂ are loaded carriers. Unloading them gives NAD⁺ and FAD back. Electrons move toward atoms that attract them more strongly (more electronegative), releasing energy.","Mitochondrion structure":"Outer membrane; intermembrane space; inner membrane, folded into cristae, which holds the ETC and ATP synthase; matrix inside.","Per-glucose counts":"10 NADH (2 + 2 + 6) and 2 FADH₂ per glucose: 12 electron pairs to feed the chain."}}},"explore":{"heading":"Electron staircase","intro":"Feed electrons into the chain and follow them down the staircase. Count the H⁺ pumped and the O₂ used. Then try blocking the chain.","modes":{"follow":"Follow one pair","steady":"Steady flow","poison":"Poisons lab"},"blockers":[{"id":"rot","t":"Rotenone","what":"blocks complex I"},{"id":"cn","t":"Cyanide","what":"blocks complex IV"},{"id":"noc","t":"No cytochrome \u003ci>c\u003c/i>","what":"a mutant"}],"modelNote":"Model values. H⁺ pumped per electron pair: complex I 4, complex III 4, complex IV 2, so NADH → 10 H⁺ and FADH₂ → 6 H⁺ (NADH passes three pumps, FADH₂ two). Energy released from NADH to O₂ ≈ 220 kJ/mol per pair: I ≈ 70, III ≈ 40, IV ≈ 110; the hand-overs between them are small. Every pair that reaches O₂ uses ½ O₂ and forms 1 H₂O. Steady flow: pairs per tick = feed × O₂ supply, rounded down (NADH pairs go first).","aha":"Electrons move downhill in steps, and each pumping step moves H⁺ outward. FADH₂ pays less. O₂ at the bottom keeps everything moving. A single block jams the whole chain.","predIntro":"Make a prediction first. Then the chain will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"follow","feed":["n"],"o2":true},"prompt":"\u003cspan class=\"muted\">Follow mode, “+ NADH”, O₂ present.\u003c/span> As this pair passes through the chain, how many complexes pump H⁺?","options":[{"t":"1","_n":"oa1b","_k":"ed896a27"},{"t":"2","_n":"p9eb","_k":"e5290b88"},{"t":"3","_n":"q9fb","_k":"e3a1fe89"},{"t":"4","_n":"racb","_k":"784df1e8"}],"explain":"Complexes I, III and IV pump. Q and cytochrome \u003ci>c\u003c/i> are carriers, not pumps, and complex II doesn’t pump."},{"id":"p2","start":{"mode":"follow","feed":["f"],"o2":true},"prompt":"\u003cspan class=\"muted\">“+ FADH₂” instead.\u003c/span> Compared with one NADH, how many H⁺ will one FADH₂ pump?","options":[{"t":"Fewer (6 instead of 10)","_n":"sadb","_k":"f6609515"},{"t":"More","_n":"taab","_k":"09e2ba40"},{"t":"None","_n":"ua9b","_k":"5ce08df9"},{"t":"The same","_n":"vacb","_k":"c813e1ac"}],"explain":"FADH₂’s electrons skip complex I’s pump."},{"id":"p3","start":{"mode":"follow","feed":["n","n"],"o2":false},"prompt":"\u003cspan class=\"muted\">O₂ absent, “+ NADH”.\u003c/span> What happens?","options":[{"t":"Pumping continues, but no water forms","_n":"wabb","_k":"82970708"},{"t":"The electrons stop at complex IV; carriers back up and pumping stops","_n":"xaeb","_k":"a3c5acab"},{"t":"Electrons are passed to CO₂ instead","_n":"yadb","_k":"29ec7acc"},{"t":"The electrons escape as light","_n":"zb0b","_k":"5e3c2f22"}],"explain":"With no final acceptor, nothing leaves complex IV, so nothing upstream can move either."},{"id":"p4","start":{"mode":"poison","rot":true,"o2":100},"prompt":"\u003cspan class=\"muted\">Poisons lab: rotenone on. “+ FADH₂”.\u003c/span> Does any pumping happen?","options":[{"t":"No, the whole chain stops","_n":"10afb","_k":"3b77dda0"},{"t":"Yes, but no water forms","_n":"11a2b","_k":"904e1165"},{"t":"Yes, at complexes III and IV","_n":"12a1b","_k":"1fcba4a2"},{"t":"Only at complex I","_n":"1330b","_k":"044f6633"}],"explain":"FADH₂ enters after complex I, so a complex I block doesn’t stop it."}],"chalIntro":"Use the chain to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[5,6],"prompt":"Follow mode: feed the chain so that exactly \u003cstrong>26 H⁺\u003c/strong> are pumped.","why":"2 NADH and 1 FADH₂: 10 × 2 + 6 = 26.","general":"Each NADH pumps 10; each FADH₂ pumps 6.","hints":["NADH = 10, FADH₂ = 6.","Try 2 NADH: 20. How many more?","20 + 6 = 26: 2 NADH and 1 FADH₂."]},{"id":"tc2","goal":[5,6],"prompt":"Poisons lab: rotenone is on and O₂ is at 100%. Get the O₂-use m&#101;ter above zero.","why":"FADH₂’s electrons enter at complex II, after the rotenone block, so they still reach O₂.","general":"Which donor doesn’t need complex I?","hints":["Which donor doesn’t need complex I?","FADH₂ enters at complex II.","Feed FADH₂."]},{"id":"tc3","goal":[5,6],"stretch":true,"prompt":"Follow mode: use exactly \u003cstrong>3 O₂\u003c/strong> and pump exactly \u003cstrong>52 H⁺\u003c/strong>.","why":"6 pairs use 3 O₂; 4 NADH and 2 FADH₂ pump 40 + 12 = 52 H⁺.","general":"Each pair uses ½ O₂. How many pairs for 3 O₂?","hints":["Each pair uses ½ O₂. How many pairs for 3 O₂?","6 pairs. With \u003ci>n\u003c/i> NADH and 6 − \u003ci>n\u003c/i> FADH₂: 10\u003ci>n\u003c/i> + 6(6 − \u003ci>n\u003c/i>) = 52.","4\u003ci>n\u003c/i> = 16, so 4 NADH and 2 FADH₂."]}],"fb":{"tc1a":"Each NADH pumps 10; each FADH₂ pumps 6.","tc1b":"FADH₂ alone can’t reach 26 in steps of 6.","tc2a":"NADH unloads only at complex I, which rotenone blocks.","tc2b":"Keep the poison on; find another way in.","tc3a":"Right O₂, too many H⁺: swap some NADH for FADH₂.","tc3b":"Right O₂, too few H⁺.","tc3c":"Only 2.5 O₂ used: you need 6 pairs."}},"part3":{"slug":"oxygen","name":"Oxygen","heading":"Why oxygen?","intro":"Explore showed the chain as a machine. Here you ask why O₂ is the only acceptor that works at the bottom, then test the model against a real kind of experiment: an oxygen-electrode trace.","s1":{"title":"Station 1: the electronegativity ladder","panel":"Zoom to the molecules","intro":"The carriers are lined up by how strongly they hold electrons, from NADH (weakest) to O₂ (strongest). Move the slider to take the pair down one rung at a time.","rungs":[{"id":"nadh","t":"NADH","hold":"weakest hold"},{"id":"I","t":"complex I"},{"id":"q","t":"ubiquinone (Q)"},{"id":"III","t":"complex III"},{"id":"c","t":"cytochrome \u003ci>c\u003c/i>"},{"id":"IV","t":"complex IV"},{"id":"o2","t":"O₂","hold":"strongest hold"}],"drops":[0,0,70,0,40,0,110],"text":"Oxygen is one of the most electronegative elements, so it pulls electrons off complex IV and releases the biggest single step of energy. If the energy were released all at once, it would be lost as heat. In steps, it can be captured by pumps."},"s2":{"title":"Station 2: the oxygen electrode (investigation)","panel":"Check it with data","intro":"A sealed chamber holds isolated mitochondria, and an electrode reads the O₂ left in it over 10 minutes. Four additions are marked by arrows. Tap each segment of the trace, then choose the chip that explains it.","adds":[{"t":2,"n":"pyruvate + malate","note":"an NADH source"},{"t":4,"n":"rotenone","note":""},{"t":6,"n":"succinate","note":"an FADH₂ source"},{"t":8,"n":"cyanide","note":""}],"segs":[{"id":"g1","a":2,"b":4,"shape":"falls","_a":"QwNUEA=="},{"id":"g2","a":4,"b":6,"shape":"goes flat","_a":"QwNXEA=="},{"id":"g3","a":6,"b":8,"shape":"falls again, less steeply","_a":"QwNWEA=="},{"id":"g4","a":8,"b":10,"shape":"goes flat","_a":"QwNREA=="}],"chips":[{"id":"e1","t":"NADH from pyruvate + malate unloads at complex I, so electrons flow to O₂."},{"id":"e2","t":"Rotenone blocks complex I, so NADH’s electrons can’t reach O₂."},{"id":"e3","t":"Electrons from FADH₂ enter at complex II, bypassing the rotenone block."},{"id":"e4","t":"Cyanide blocks complex IV, so no electrons reach O₂ by any route."},{"id":"e5","t":"The chamber has run out of O₂.","fb":"There’s still plenty of O₂ in the chamber: the trace is flat well above zero."}],"ask":{"id":"s2q","prompt":"Why does cyanide flatten the trace even though succinate is still present?","options":[{"t":"The O₂ in the chamber has run out.","why":"The trace is flat well above zero: O₂ is left, but nothing passes electrons to it.","_n":"1431b","_k":"0a1a2951"},{"t":"Complex IV is on every route to O₂, so blocking it stops all electron flow.","why":"Both NADH’s and FADH₂’s electrons must pass complex IV to reach O₂.","_n":"1532b","_k":"ce68c0a0"},{"t":"Cyanide breaks down succinate.","why":"Succinate is still there; the block is in the chain.","_n":"1633b","_k":"fe35242d"},{"t":"Cyanide blocks complex II.","why":"Cyanide blocks complex IV, which both routes share.","_n":"172cb","_k":"c2691f7b"}]}},"s3":{"title":"Station 3: carbon monoxide (STSE)","text":"CO binds hemoglobin and complex IV, so cells starve of both O₂ delivery and electron flow. That’s why fuel-burning furnaces and stoves must be vented, and why Ontario requires CO alarms in homes with fuel-burning appliances or attached garages.","ask":{"id":"s3q","prompt":"Why does CO poisoning make a person feel weak even though they’re breathing?","options":[{"t":"CO stops the lungs from taking in air.","why":"They are breathing; the problem is what happens to O₂ and electrons inside the body.","_n":"182db","_k":"01a4a407"},{"t":"Less O₂ reaches cells, and complex IV is blocked, so the chain can’t pump and little ATP is made.","why":"CO cuts O₂ delivery and blocks the last step of the chain, so the H⁺ gradient that drives ATP synthase isn’t built.","_n":"192eb","_k":"b9cb9d20"},{"t":"CO uses up the glucose in their cells.","why":"Glucose and NADH build up, unused: the block is in the chain.","_n":"1a2fb","_k":"22fbf194"},{"t":"CO speeds up the chain, so cells overheat.","why":"CO blocks complex IV: the chain stops.","_n":"1b28b","_k":"51f2b871"}]}},"quickCheck":{"title":"Quick check","summary":"Why oxygen? quick check","items":[{"id":"q1","goal":4,"prompt":"What does O₂ become at the end of the chain?","choices":[{"t":"Glucose","fb":"O₂ + 4e⁻ + 4H⁺ → 2H₂O.","_n":"1c29b","_k":"71f460bd"},{"t":"CO₂","fb":"O₂ + 4e⁻ + 4H⁺ → 2H₂O.","_n":"1d36c","_k":"130828ed"},{"t":"Water","fb":"Right. O₂ + 4e⁻ + 4H⁺ → 2H₂O.","_n":"1e35c","_k":"823e5a58"},{"t":"NADH","fb":"O₂ + 4e⁻ + 4H⁺ → 2H₂O.","_n":"1f34c","_k":"49073861"}]},{"id":"q2","goal":5,"prompt":"Rotenone is added, then succinate. O₂ use…","choices":[{"t":"reverses","fb":"Succinate’s FADH₂ enters at complex II, after the block.","_n":"1g33c","_k":"4e8385ab"},{"t":"stays at zero","fb":"Succinate’s FADH₂ enters at complex II, after the block.","_n":"1h32c","_k":"c2b363ad"},{"t":"resumes","fb":"Right. Succinate’s FADH₂ enters at complex II, after the block.","_n":"1i31c","_k":"40d38438"},{"t":"doubles","fb":"Succinate’s FADH₂ enters at complex II, after the block.","_n":"1j30c","_k":"fffb16a9"}]},{"id":"q3","goal":5,"prompt":"Cyanide is added. Which carriers end up loaded?","choices":[{"t":"None","fb":"The chain backs up all the way.","_n":"1k2fc","_k":"08a2baa1"},{"t":"Every carrier before complex IV","fb":"Right. The chain backs up all the way.","_n":"1l2ec","_k":"0a360d16"},{"t":"Only O₂","fb":"The chain backs up all the way.","_n":"1m2dc","_k":"7cd2d165"},{"t":"Only complex IV","fb":"The chain backs up all the way.","_n":"1n1cc","_k":"48d98878"}]},{"id":"q4","goal":3,"prompt":"Why are the energy steps small?","choices":[{"t":"To make CO₂","fb":"One big drop would be lost as heat.","_n":"1o1dc","_k":"67607a8e"},{"t":"To make light","fb":"One big drop would be lost as heat.","_n":"1p1ac","_k":"0c96e1a8"},{"t":"To save O₂","fb":"One big drop would be lost as heat.","_n":"1q1bc","_k":"517b2ca2"},{"t":"So pumps can capture the energy","fb":"Right. One big drop would be lost as heat.","_n":"1r20c","_k":"59c12da9"}]}]}},"practice":{"activities":[{"id":"route","type":"custom","title":"The electron route","summary":"The electron route","goal":[1,2],"instruction":"Two electron routes. Build each one from the donor to the final acceptor.","how":"","sequences":[{"id":"s1","goal":[1,2],"prompt":"Electrons from \u003cstrong>NADH\u003c/strong> (7 steps).","tiles":["NADH","complex I","ubiquinone (Q)","complex III","cytochrome \u003ci>c\u003c/i>","complex IV","O₂"],"_a":"OlZJAxVUHFVNUkkHFVBt","why":"NADH unloads at complex I, and its electrons pass three pumps (I, III and IV) on the way to O₂.","hints":["Where does NADH unload?","At complex I, which hands electrons to Q.","NADH → I → Q → III → cyt \u003ci>c\u003c/i> → IV → O₂."]},{"id":"s2","goal":[1,2],"prompt":"Electrons from \u003cstrong>FADH₂\u003c/strong> (7 steps). One tile doesn’t belong: leave it out.","tiles":["FADH₂","complex II","ubiquinone (Q)","complex III","cytochrome \u003ci>c\u003c/i>","complex IV","O₂","complex I"],"_a":"OlZJAxVUHFVNUkkHFVBt","why":"FADH₂ unloads at complex II, which passes the electrons to Q. They skip complex I, so they pass only two pumps.","hints":["Where does FADH₂ unload?","At complex II, which hands electrons to Q.","FADH₂ → II → Q → III → cyt \u003ci>c\u003c/i> → IV → O₂."]}],"fb":{"cBeforeIII":"Cytochrome \u003ci>c\u003c/i> carries electrons from III to IV.","qAfterIII":"Q carries electrons from I (or II) to III.","usedI":"FADH₂ skips complex I.","short":"The route isn’t finished yet: it runs from the donor all the way to O₂.","general":"Ask which carrier hands electrons to which."}},{"id":"detective","type":"custom","title":"Poison detective","summary":"Poison detective","star":true,"goal":[4,5],"instruction":"Each case gives observations from isolated mitochondria. Choose where the chain is blocked, or what is missing. Cases 3 to 6 are non-routine (★); the last two go beyond the Final Check.","how":"","items":[{"id":"d1","goal":5,"prompt":"With NADH: no O₂ use. With succinate (FADH₂): O₂ use normal.","options":[{"t":"Complex I","why":"NADH’s route is blocked but FADH₂’s isn’t: the block sits where only NADH passes.","_n":"1s21c","_k":"7a3154e5"},{"t":"Complex II","why":"Complex II is on succinate’s route, and succinate works.","_n":"1t1ec","_k":"350bb988"},{"t":"Complex III","why":"Then succinate would fail too: its route passes complex III.","_n":"1u1fc","_k":"65f3964a"},{"t":"Complex IV","why":"Then succinate would fail too.","_n":"1v24c","_k":"b4c88556"},{"t":"Cytochrome \u003ci>c\u003c/i> is missing","why":"Then succinate would fail too: both routes need cytochrome \u003ci>c\u003c/i>.","_n":"1w25c","_k":"68b2f21a"}],"hints":["Which route still works?","Succinate’s route skips complex I; NADH’s doesn’t.","Complex I."]},{"id":"d2","goal":5,"prompt":"With NADH or succinate: no O₂ use; cytochrome \u003ci>c\u003c/i> is fully loaded.","options":[{"t":"Complex I","why":"Succinate would still work.","_n":"1xa2c","_k":"cfce679f"},{"t":"Complex II","why":"NADH would still work.","_n":"1ya1c","_k":"1ec05815"},{"t":"Complex III","why":"Then cyt \u003ci>c\u003c/i> would be empty.","_n":"1za4c","_k":"4b07936f"},{"t":"Complex IV","why":"Cytochrome \u003ci>c\u003c/i> is loaded, so the block is after it: complex IV.","_n":"20a3c","_k":"0ee754b4"},{"t":"Cytochrome \u003ci>c\u003c/i> is missing","why":"Cytochrome \u003ci>c\u003c/i> is there, and it’s loaded.","_n":"219ec","_k":"c35d5ec8"}],"hints":["Loaded carriers sit before the block; empty ones after it.","Cytochrome \u003ci>c\u003c/i> is loaded, so the block is after it.","Complex IV."]},{"id":"d3","goal":5,"star":true,"prompt":"With NADH or succinate: no O₂ use; Q is loaded, but cytochrome \u003ci>c\u003c/i> is empty.","options":[{"t":"Complex I","why":"Succinate would still work.","_n":"229dc","_k":"297b4746"},{"t":"Complex II","why":"NADH would still work.","_n":"23a0c","_k":"e7f54cd7"},{"t":"Complex III","why":"Q is loaded and cyt \u003ci>c\u003c/i> is empty: complex III sits between them.","_n":"249fc","_k":"675319e1"},{"t":"Complex IV","why":"Then cytochrome \u003ci>c\u003c/i> would be loaded.","_n":"25aac","_k":"f99b1e20"},{"t":"Cytochrome \u003ci>c\u003c/i> is missing","why":"Cytochrome \u003ci>c\u003c/i> is there; it’s just empty because nothing reaches it.","_n":"26a9c","_k":"2d63b74f"}],"hints":["Loaded carriers sit before the block; empty ones after it.","Q is loaded and cyt \u003ci>c\u003c/i> is empty.","Complex III sits between them."]},{"id":"d4","goal":5,"star":true,"prompt":"Both donors work only when cytochrome \u003ci>c\u003c/i> is added to the flask.","options":[{"t":"Complex I","why":"Adding cyt \u003ci>c\u003c/i> wouldn’t fix complex I.","_n":"27a8c","_k":"7de2095b"},{"t":"Complex II","why":"Adding cyt \u003ci>c\u003c/i> wouldn’t fix complex II, and NADH doesn’t use complex II.","_n":"28a9c","_k":"c6ef7439"},{"t":"Complex III","why":"Adding cyt \u003ci>c\u003c/i> wouldn’t fix complex III.","_n":"29aac","_k":"3d20ec1c"},{"t":"Complex IV","why":"Adding cyt \u003ci>c\u003c/i> wouldn’t fix complex IV.","_n":"2aabc","_k":"f6ad35c3"},{"t":"Cytochrome \u003ci>c\u003c/i> is missing","why":"Adding the missing carrier restores both routes.","_n":"2bacc","_k":"6bdd8a1a"}],"hints":["What does adding something to the flask fix?","Only something that is missing.","Cytochrome \u003ci>c\u003c/i> is missing."]},{"id":"d5","goal":[4,5],"star":true,"prompt":"(Investigation) A student adds a new chemical and sees O₂ use stop with NADH. Which \u003cstrong>one\u003c/strong> extra test would best tell whether the block is at complex I or later?","options":[{"t":"Add more O₂","why":"O₂ isn’t missing: NADH’s electrons aren’t reaching it.","_n":"2cadc","_k":"c396fa1b"},{"t":"Add succinate and see whether O₂ use returns","why":"Succinate’s electrons skip complex I. If O₂ use returns, the block is at complex I; if not, it’s later in the chain.","_n":"2daec","_k":"7544847e"},{"t":"Add cyanide","why":"Cyanide stops every route, so it can’t tell the two sites apart.","_n":"2eafc","_k":"a7c82623"},{"t":"Add more NADH","why":"That repeats the same route.","_n":"2fa0c","_k":"8ef4230e"}],"hints":["Find a donor that enters the chain after complex I.","Succinate gives FADH₂, which enters at complex II.","Add succinate: if O₂ use returns, the block is at complex I."]},{"id":"d6","goal":[5,6],"star":true,"fixedOrder":true,"prompt":"With NADH: H⁺ pumped is 6 per pair instead of 10, and O₂ use is normal. With succinate, H⁺ pumped is 2 per pair instead of 6. Which complex has stopped pumping (but still passes electrons)?","options":[{"t":"Complex I","why":"Then succinate would still give 6.","_n":"2ga1c","_k":"7eb25f2a"},{"t":"Complex II","why":"Complex II never pumps, so losing it would change nothing.","_n":"2haec","_k":"5d3e7715"},{"t":"Complex III","why":"It lost 4 H⁺ on both routes, and both routes pass complex III. Electrons still flow, so it’s a pump failure, not a block.","_n":"2iadc","_k":"9bd4e376"},{"t":"Complex IV","why":"IV pumps only 2: losing it would give 8 with NADH.","_n":"2jacc","_k":"342f8c85"}],"hints":["10 − 6 = 4 H⁺ missing with NADH, so it’s a complex that pumps 4: I or III.","Succinate’s route skips I but passes III. It lost 4 too (6 → 2).","Complex III. Electrons still flow, so it’s a pump failure, not a block."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Imani","instruction":"Imani made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":6,"task":"Count the H⁺ pumped for 2 NADH and 2 FADH₂ (model values).","steps":["NADH electrons pass complexes I, III and IV.","So each NADH pumps 4 + 4 + 2 = 10 H⁺.","FADH₂ electrons also start at complex I, so each pumps 10 H⁺.","Total: 4 × 10 = 40 H⁺."],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"FADH₂ pumps 0 H⁺, because complex II doesn’t pump.","why":"It still passes III and IV.","_n":"2kabc","_k":"6c391261"},{"t":"Step 3 is correct.","why":"Step 3 is the first mistake. FADH₂’s electrons enter at complex II, after complex I, so they pass one fewer pump: 6 H⁺, not 10.","_n":"2lb2c","_k":"907775a3"},{"t":"NADH pumps 6 H⁺.","why":"NADH passes three pumps.","_n":"2mb1c","_k":"bfe82da1"},{"t":"FADH₂ enters at complex II and skips complex I: 6 H⁺ each. Total 20 + 12 = 32.","why":"FADH₂’s electrons enter at complex II, after complex I, so they pass one fewer pump: 6 H⁺, not 10.","_n":"2nb0c","_k":"e0682178"}],"hints":["Where does FADH₂ unload?","Complex II.","6 each: 32 in total."]},{"id":"e2","goal":4,"task":"Explain O₂’s role.","steps":["Electrons move from carrier to carrier, releasing energy.","O₂ enters at complex I to start the flow of electrons.","Without O₂, the chain can’t start.","So O₂ is needed for respiration."],"_a":"UA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows from step 2. The mistake is earlier.","The conclusion is true, but the reason is wrong."],"fixes":[{"t":"O₂ pumps H⁺.","why":"Complexes pump; O₂ accepts electrons.","_n":"2oafc","_k":"613456d9"},{"t":"O₂ combines with carbon to make CO₂.","why":"O₂ waits at the very end. It accepts the electrons after complex IV and becomes water.","_n":"2pa6c","_k":"c5adddb2"},{"t":"O₂ is the \u003cstrong>final\u003c/strong> acceptor at complex IV. It takes the electrons and H⁺ to form water. Without it, electrons back up and the chain stops.","why":"O₂ waits at the very end. It accepts the electrons after complex IV and becomes water.","_n":"2qa5c","_k":"ac984e83"},{"t":"Step 2 is correct.","why":"Step 2 is the first mistake. O₂ waits at the very end. It accepts the electrons after complex IV and becomes water.","_n":"2r44f","_k":"39421f76"}],"hints":["Which end of the chain is O₂ at?","The bottom.","Final acceptor → water."]},{"id":"e3","goal":3,"task":"Explain how the chain helps make ATP.","steps":["NADH and FADH₂ give electrons to the chain.","As electrons pass complexes I, III and IV, energy is released.","Each of these complexes uses that energy to attach a phosphate to ADP, making ATP.","So the chain makes ATP at three sites."],"_a":"Uw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"The energy is stored in O₂.","why":"O₂ accepts electrons; it doesn’t store the energy.","_n":"2s43f","_k":"40b07fb0"},{"t":"Step 3 is correct.","why":"Step 3 is the first mistake. The chain only pumps H⁺. ATP synthase uses the gradient to make ATP (module 17).","_n":"2t46f","_k":"05032f12"},{"t":"The energy is released as light.","why":"It’s captured by pumping.","_n":"2u45f","_k":"a280cc70"},{"t":"The complexes use the energy to pump H⁺ into the intermembrane space. ATP synthase later uses the H⁺ gradient to make ATP.","why":"The chain only pumps H⁺. ATP synthase uses the gradient to make ATP (module 17).","_n":"2v48f","_k":"42ba4921"}],"hints":["What do complexes I, III and IV move across the membrane?","H⁺.","ATP synthase makes the ATP."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the staircase: that FADH₂ pays less, or how one blocked complex jams everything?"},{"id":"j2","q":"In your own words, why is O₂ needed at the end of the chain?"},{"id":"j3","q":"Explain to a friend how to use observations (O₂ use, loaded and empty carriers) to find where a chain is blocked."},{"id":"j4","q":"Which part of the electron transport chain is still unclear to you? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is the final electron acceptor of the electron transport chain?","options":[{"t":"H₂O","why":"Water is the product, not the acceptor.","_n":"2w47f","_k":"ea030e60"},{"t":"O₂","why":"It forms water at complex IV.","_n":"2x4af","_k":"a2287da2"},{"t":"Cytochrome \u003ci>c\u003c/i>","why":"Cyt \u003ci>c\u003c/i> passes electrons on to complex IV.","_n":"2y49f","_k":"a6d5a960"},{"t":"NAD⁺","why":"NAD⁺ is regenerated at the \u003cstrong>start\u003c/strong>, when NADH unloads.","_n":"2z3cf","_k":"ef7572cc"}]},"b":{"prompt":"Where are the electron transport chain complexes in a eukaryotic cell?","options":[{"t":"The inner mitochondrial membrane","why":"The inner membrane, folded into cristae, holds the chain and keeps the H⁺ gradient sealed.","_n":"303bf","_k":"0ce87883"},{"t":"The outer mitochondrial membrane","why":"The ETC needs the sealed inner membrane.","_n":"313ef","_k":"b32d3806"},{"t":"The intermembrane space","why":"That’s where H⁺ builds up.","_n":"323ff","_k":"318de9a2"},{"t":"The matrix","why":"The matrix holds the Krebs cycle.","_n":"333cf","_k":"de6055de"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which complexes pump H⁺ across the membrane?","options":[{"t":"Only IV","why":"I and III pump too.","_n":"343df","_k":"7db81682"},{"t":"II and IV","why":"II doesn’t pump; I and III do.","_n":"353af","_k":"0566b7e6"},{"t":"I, II, III and IV","why":"Complex II doesn’t pump.","_n":"363bf","_k":"6f8ea70a"},{"t":"I, III and IV","why":"Complex II passes electrons on without pumping.","_n":"3738f","_k":"af2db67a"}]},"b":{"prompt":"Which two molecules shuttle electrons \u003cstrong>between\u003c/strong> the complexes?","options":[{"t":"ATP synthase and O₂","why":"Neither shuttles electrons.","_n":"3839f","_k":"93474fdf"},{"t":"Ubiquinone (Q) and cytochrome \u003ci>c\u003c/i>","why":"Q moves within the membrane from I or II to III; cyt \u003ci>c\u003c/i> moves on the intermembrane side from III to IV.","_n":"3946f","_k":"1b540323"},{"t":"NADH and FADH₂","why":"They deliver electrons \u003cstrong>to\u003c/strong> the chain.","_n":"3a47f","_k":"b6c10795"},{"t":"Complexes I and III","why":"They’re fixed in the membrane, not shuttles.","_n":"3bb8f","_k":"72b38867"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"Into which compartment do the complexes pump H⁺?","options":[{"t":"The matrix","why":"H⁺ is pumped out of the matrix.","_n":"3cb7f","_k":"fcb4f80d"},{"t":"The intermembrane space","why":"H⁺ is pumped out of the matrix and builds up between the membranes.","_n":"3db6f","_k":"3991a1dc"},{"t":"The thylakoid lumen","why":"That’s in chloroplasts.","_n":"3eb5f","_k":"ffe92589"},{"t":"The cytosol","why":"The outer membrane encloses the intermembrane space.","_n":"3fbcf","_k":"bd1ae2bc"}]},"b":{"prompt":"On which side of complex IV is water formed?","options":[{"t":"Inside the outer membrane","why":"The outer membrane has no ETC.","_n":"3gbbf","_k":"4231fc38"},{"t":"The matrix side","why":"O₂ takes H⁺ from the matrix.","_n":"3hbaf","_k":"75b9878b"},{"t":"The intermembrane-space side","why":"H⁺ is pumped \u003cstrong>out of\u003c/strong> the matrix \u003cstrong>into\u003c/strong> the intermembrane space.","_n":"3ib9f","_k":"0c7663d1"},{"t":"In the cytosol","why":"Complex IV is in the inner membrane.","_n":"3jc0f","_k":"c75bd114"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"Rotenone blocks complex I. Mitochondria are given only NADH, then only succinate (an FADH₂ source). What happens to O₂ use?","options":[{"t":"Zero with NADH; normal with succinate","why":"FADH₂’s electrons enter at complex II, after the block.","_n":"3kbff","_k":"3e7ebfbb"},{"t":"Zero with both","why":"Succinate bypasses complex I.","_n":"3lb2f","_k":"2b6a03f3"},{"t":"Normal with both","why":"NADH must unload at complex I.","_n":"3mb3f","_k":"046e1407"},{"t":"Normal with NADH; zero with succinate","why":"That reverses the routes.","_n":"3nb4f","_k":"500d89c7"}]},"b":{"prompt":"Antimycin A blocks complex III. Mitochondria are given only NADH, then only succinate. What happens to O₂ use?","options":[{"t":"Normal with NADH; zero with succinate","why":"Both routes need III.","_n":"3ob5f","_k":"4b91412b"},{"t":"Zero with both","why":"Both routes pass through complex III.","_n":"3pb6f","_k":"641040b8"},{"t":"Zero with NADH; normal with succinate","why":"Succinate’s route also needs complex III.","_n":"3qb7f","_k":"2f81b1f7"},{"t":"Normal with both","why":"III is on both routes.","_n":"3rb8f","_k":"7b2127b7"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"Using the model values (NADH 10 H⁺, FADH₂ 6 H⁺), how many H⁺ are pumped for 2 NADH and 2 FADH₂?","options":[{"t":"20","why":"Add FADH₂’s 12.","_n":"3sb9f","_k":"391d6173"},{"t":"24","why":"That counts each NADH as 6.","_n":"3tbaf","_k":"576d990c"},{"t":"32","why":"20 + 12.","_n":"3ubbf","_k":"7c09e535"},{"t":"40","why":"FADH₂ isn’t worth 10.","_n":"3vbd0","_k":"ded450b9"}]},"b":{"prompt":"Using the model values, how many H⁺ are pumped for 3 NADH and 1 FADH₂?","options":[{"t":"24","why":"That counts each NADH as 6.","_n":"3wbc0","_k":"ac20bfb3"},{"t":"30","why":"Add FADH₂’s 6.","_n":"3xbf0","_k":"c6c3acf5"},{"t":"36","why":"30 + 6.","_n":"3ybe0","_k":"ed15d078"},{"t":"40","why":"FADH₂’s electrons enter at complex II, after complex I, so they pass one fewer pump: 6 H⁺, not 10.","_n":"3zb90","_k":"4bce5a68"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A mutant cell has no cytochrome \u003ci>c\u003c/i>. Which prediction is correct?","options":[{"t":"Complex IV stays loaded","why":"IV gets no electrons, so it stays empty.","_n":"40b80","_k":"3d08dec2"},{"t":"Electrons from both NADH and FADH₂ stop at complex III; Q and complex III stay loaded; no O₂ is used","why":"Cyt \u003ci>c\u003c/i> is the only link from III to IV, and both routes need it.","_n":"41bb0","_k":"c819560a"},{"t":"Electrons skip to O₂ directly","why":"There’s no bypass.","_n":"42ba0","_k":"b2147731"},{"t":"Only NADH’s electrons are affected","why":"Both routes need cyt \u003ci>c\u003c/i>.","_n":"43c50","_k":"702075c7"}]},"b":{"prompt":"A mutant cell has no ubiquinone (Q). Which prediction is correct?","options":[{"t":"Electrons from both NADH and FADH₂ stop at complexes I and II; no O₂ is used","why":"Q carries electrons from both I and II to III, so both routes stop before it.","_n":"44c40","_k":"68b5a8c2"},{"t":"Pumping continues at complex I","why":"Electrons can’t leave I, so pumping stops.","_n":"45b70","_k":"6111c16c"},{"t":"Only complex IV is affected","why":"IV gets no electrons.","_n":"46b80","_k":"551f12f4"},{"t":"FADH₂’s electrons still reach O₂","why":"FADH₂’s route also passes Q.","_n":"47b50","_k":"3bb3d70c"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why electrons release energy in several small steps?","options":[{"t":"“Each carrier holds electrons more tightly than the one before, so each move releases some energy. Small steps let the pumps capture energy instead of losing it all as heat.”","why":"Electronegativity sets the steps, and small steps can be captured by pumps.","_n":"48b60","_k":"b1d9b1d7"},{"t":"“Each complex makes ATP from the energy.”","why":"The chain only pumps H⁺. ATP synthase uses the gradient to make ATP (module 17).","_n":"49bb0","_k":"a5984815"},{"t":"“O₂ is added at each step.”","why":"O₂ waits at the very end. It accepts the electrons after complex IV and becomes water.","_n":"4abc0","_k":"7ab666cc"},{"t":"“Electrons are used up a little at each step.”","why":"Electrons are passe
