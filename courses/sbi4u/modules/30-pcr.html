.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 30: thermocycler (S9) with molecule view, tray and count chart; S5 sequence workbench; Part 3 stations; task.
   Roles (plan build notes): top strand --ink, bottom strand --ink-2, new strands --pen, primers --bio-h (magenta;
   dark token #F49AC8), target region --hi-soft; temperature strip neutral with the current step outlined. */

/* hero */
.hero .hero-eq .pcr-heq{display:inline-flex;flex-direction:column;gap:.35em;align-items:flex-start;font-size:.62em;line-height:1.2}
.pcr-heq1,.pcr-heq2{white-space:normal}
.pcr-heq2{color:var(--pen)}
.pcr-hero{max-width:460px;margin:0 auto}
.pcr-svg{display:block;width:100%;height:auto}
.pcr-sq{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.04em;white-space:nowrap}

/* SVG roles */
.pcr-st{stroke-width:3.2;stroke-linecap:round;fill:none}
.pcr-st.top{stroke:var(--ink)}
.pcr-st.bot{stroke:var(--ink-2)}
.pcr-st.new{stroke:var(--pen)}
.pcr-st.thin{stroke-width:2.4}
.pcr-pri{stroke:var(--bio-h);stroke-width:4.2;stroke-linecap:round;fill:none}
.pcr-prh{fill:var(--bio-h);stroke:none}
.pcr-pri.loose{stroke-dasharray:4 3;stroke-width:3}
.pcr-prh.loose{opacity:.7}
.pcr-tg{fill:var(--hi-soft);stroke:none}
.pcr-hb{stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:2 2}
.pcr-stub{stroke:var(--ink-2);stroke-width:1.3}
.pcr-hbz{stroke:var(--ink);stroke-width:1.8;stroke-dasharray:3 2.5}
.pcr-ts{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.pcr-ts.on{stroke:var(--ink);stroke-width:3}
.pcr-tst{font:600 11px var(--font-ui);fill:var(--ink-2)}
.pcr-tst.on{fill:var(--ink);font-weight:700}
.pcr-lab,.pcr-sm{font:11px var(--font-ui);fill:var(--ink-2)}
.pcr-b{font-weight:700;fill:var(--ink)}
.pcr-bad{fill:var(--red);font-weight:700}
.pcr-x{font:700 16px var(--font-ui);fill:var(--red)}
.pcr-ctr{font:700 16px var(--font-ui);fill:var(--ink)}
.pcr-pol{fill:var(--sheet);stroke:var(--pen);stroke-width:2}
.pcr-pol.dead{stroke:var(--ink-2);stroke-dasharray:3 2;fill:var(--paper)}
.pcr-zt{stroke-width:1.6}
.pcr-zt.top{fill:var(--sheet);stroke:var(--ink)}
.pcr-zt.bot{fill:var(--sheet);stroke:var(--ink-2)}
.pcr-zt.pri{fill:var(--sheet);stroke:var(--bio-h)}
.pcr-zl{font:700 14px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--ink)}
.pcr-grid{stroke:var(--plot-grid);stroke-width:1}
.pcr-axis{stroke:var(--plot-axis);stroke-width:1.4}
.pcr-vis{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:6 4}
.pcr-bt{fill:var(--ink-2);opacity:.35}
.pcr-be{fill:var(--pen)}

/* radio groups (from SBI4U 20 / 14 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.55}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:36px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* explore layout */
.pcr-ex [hidden],.pcr-p3 [hidden]{display:none!important}
@media (min-width:821px){ .pg.pcr-pg{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} }
.pcr-pg .pg-ctrl{display:grid;gap:12px}
.pcr-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.pcr-fig{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:4px;margin-top:8px}
.pcr-cap{margin:8px 0 0}
.pcr-fixed{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;opacity:.7;border-top:1px dashed var(--rule);padding-top:8px}
.pcr-fl{font-weight:700}
.pcr-fv{font:600 1.2rem var(--font-math)}
.pcr-player{display:flex;flex-wrap:wrap;gap:8px}
.pcr-note{margin:0}
.pcr-case{margin:8px 0 0;padding:10px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--info-bg);display:grid;gap:8px;justify-items:start}
.pcr-case p{margin:0}
.pcr-tray{margin-top:10px}
.pcr-h{margin:0 0 6px;font-size:.98rem}
.pcr-tbl{margin-top:10px}
.pcr-tbl .tbl-wrap{max-height:220px;overflow:auto}
.pcr-key{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;margin:8px 0 0;padding:0;font-size:.85rem;color:var(--ink-2)}
.pcr-key li{display:inline-flex;align-items:center;gap:6px}
.pcr-sw{display:inline-block;width:18px;height:6px;border-radius:3px}
.pcr-sw.top{background:var(--ink)}.pcr-sw.bot{background:var(--ink-2)}.pcr-sw.pri{background:var(--bio-h)}.pcr-sw.new,.pcr-sw.ex{background:var(--pen)}
.pcr-sw.tg{background:var(--hi-soft);height:12px;border:1px solid var(--rule)}
.pcr-sw.tot{background:var(--ink-2);opacity:.45;height:12px}
.pcr-switch{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .9em .3em .4em;min-height:40px;font-size:.92rem;justify-self:start}
.pcr-swt{position:relative;width:34px;height:18px;border-radius:9px;background:var(--rule);flex:0 0 auto}
.pcr-swt::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--sheet);transition:left .15s}
.pcr-switch[aria-checked="true"] .pcr-swt{background:var(--ink)}
.pcr-switch[aria-checked="true"] .pcr-swt::after{left:18px}
.pcr-switch:disabled{opacity:.55}
@media (prefers-reduced-motion:reduce){ .pcr-swt::after{transition:none} }

/* S5 sequence workbench */
.pcr-wbox{margin:10px 0}
.pcr-wbs{overflow-x:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:6px 4px}
.pcr-wb{display:grid;gap:2px;width:max-content}
.pcr-wrow{display:grid;grid-template-columns:28px repeat(var(--n),24px) 28px;align-items:center}
.pcr-c{display:grid;place-items:center;width:24px;height:26px;font:600 .95rem ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink)}
.pcr-end{font:700 .8rem var(--font-ui);color:var(--ink-2);text-align:center}
.pcr-base{border:0;border-bottom:3px solid var(--ink);background:transparent;padding:0;border-radius:3px 3px 0 0;height:30px}
.pcr-base.bot{border-bottom:0;border-top:3px solid var(--ink-2);color:var(--ink-2);border-radius:0 0 3px 3px}
.pcr-base.tg{background:var(--hi-soft)}
button.pcr-base{cursor:pointer}
button.pcr-base.sel{background:var(--hi);color:var(--hi-ink);font-weight:800}
.pcr-lane .pcr-c{height:24px}
.pcr-l.pri,.pcr-arr.pri{color:var(--sheet);background:var(--bio-h);font-weight:700}
.pcr-arr.pri{border-radius:0 12px 12px 0}
.pcr-l.cmp{color:var(--ink);border:1.5px dashed var(--ink-2);border-radius:3px}
.pcr-l.bad{color:var(--bio-h);border:1.5px solid var(--bio-h);border-radius:3px;transform:translateY(-5px)}
.pcr-l.bad.x{color:var(--red);border-color:var(--red);text-decoration:line-through}
.pcr-in-d{animation:pcr-d .7s ease-out both}
.pcr-in-u{animation:pcr-u .7s ease-out both}
@keyframes pcr-d{from{transform:translate(-22px,-18px);opacity:0}to{transform:none;opacity:1}}
@keyframes pcr-u{from{transform:translate(22px,18px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){ .pcr-in-d,.pcr-in-u{animation:none} }
.pcr-selp{margin:6px 0 0}
.pcr-build{margin-top:8px}
.pcr-steps{flex-wrap:wrap}
.pcr-zoom{margin-top:10px}
.pcr-zoom svg{max-width:520px}

/* Part 3 stations */
.pcr-row{margin-bottom:12px}
.pcr-sth{margin:0 0 6px}
.pcr-stn > p{margin:6px 0}
.pcr-snav{margin-top:16px}
.pcr-cards{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pcr-boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.pcr-box{display:grid;gap:4px;align-content:start;text-align:left;border:1.5px dashed var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:10px 12px;min-height:72px}
.pcr-box:disabled{opacity:1;border-style:solid;border-color:var(--rule)}
.pcr-boxt{font-weight:700}

.pcr-ctl{padding:8px 12px;border-left:4px solid var(--ink-2);background:var(--paper)}
.pcr-rt{border-collapse:collapse;min-width:100%}
.pcr-rt th,.pcr-rt td{padding:6px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
.pcr-rt thead th{font-size:.85rem;color:var(--ink-2);background:var(--paper)}
.pcr-bsvg{display:block;width:48px;height:44px}
.pcr-glane{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.pcr-band{fill:var(--ink)}
.pcr-band.faint{opacity:.45}
.pcr-concl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px}
.pcr-concl p{margin:0}
.pcr-how{margin:8px 0}
.pcr-fvl{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.pcr-fvt{flex:1 1 260px}
.pcr-fvb{display:inline-flex;flex-wrap:wrap;gap:6px}
.pcr-tag{font-size:.85rem;font-weight:700;border-radius:999px;padding:.15em .7em;border:1.5px solid var(--green);color:var(--ink);background:var(--good-bg)}
.pcr-cer{margin-top:14px;display:grid;gap:10px}
.pcr-ev{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;display:grid;gap:6px;margin:0}
.pcr-ev legend{font-weight:700;padding:0 4px}
.pcr-chk{display:flex;gap:8px;align-items:flex-start}
.pcr-chk input{margin-top:.3em;width:18px;height:18px;flex:0 0 auto}
.pcr-rl{font-weight:700}
.pcr-ta{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.5em .7em;font:1rem var(--font-ui)}
.pcr-cl{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pcr-cl li.yes{color:var(--ink);font-weight:700}
.pcr-cl li.yes span[aria-hidden]{color:var(--green)}
.pcr-cl li.no{color:var(--ink-2)}
.pcr-cl li.note{font-size:.88rem;color:var(--ink-2);font-style:italic}

/* task */
.pcr-seqbox{overflow-x:auto;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);line-height:1.9}
.pcr-seqbox mark{background:var(--hi-soft);color:inherit}
.pcr-conds{margin:8px 0 0}
.pcr-tin{display:grid;gap:12px}
.pcr-tpv .pcr-say{margin:4px 0 8px}

</style>

nes That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"1b2a3c46","content":{"id":"30-pcr","kind":"topic","title":"PCR (Polymerase Chain Reaction)","topic":"PCR (Polymerase Chain Reaction)","readyTopic":"PCR","hero":{"eq":"\u003cspan class=\"pcr-heq\">\u003cspan class=\"pcr-heq1\">95 °C → 55 °C → 72 °C, repeat\u003c/span>\u003cspan class=\"pcr-heq2\">1 → 2 → 4 → 8 → … → 2\u003csup>\u003ci>n\u003c/i>\u003c/sup>\u003c/span>\u003c/span>","eqLabel":"95 degrees, then 55 degrees, then 72 degrees, repeated. 1, 2, 4, 8, and so on up to 2 to the n.","eqSize":"sm","headline":"Three temperatures, repeated, turn one molecule into a billion","text":"The \u003cstrong>polymerase chain reaction (PCR)\u003c/strong> copies one chosen stretch of DNA. Heat separates the strands, cooling lets two short \u003cstrong>primers\u003c/strong> mark the ends of the stretch, and a heat-proof enzyme, \u003cstrong>\u003ci>Taq\u003c/i> polymerase\u003c/strong>, builds new strands from them. Every cycle \u003cstrong>doubles\u003c/strong> the copies, so about 30 cycles turn a few cells’ worth of DNA into enough to see and study.","fig":{"html":"\u003cdiv class=\"pcr-hero\" id=\"pcr-hero\" role=\"img\" aria-label=\"A double-stranded DNA molecule with its target region shaded. A temperature strip lights 95 °C and the strands drift apart; at 55 °C two magenta primers slide onto the ends of the target; at 72 °C blue new strands grow from the primers’ 3′ ends. Two molecules sit where there was one and the counter reads 2. The loop speeds up: 4, 8, 16, and the counter reaches about 1 000 000 000 after 30 cycles.\">\u003c/div>"}},"goals":["I can describe the three steps of a PCR cycle, their temperatures, and what happens to the DNA in each.","I can explain why a heat-stable polymerase (\u003ci>Taq\u003c/i>) makes PCR possible.","I can explain what primers do and why the polymerase needs them.","I can calculate copy numbers after \u003ci>n\u003c/i> cycles and explain when exact-length copies appear.","I can predict and troubleshoot the result of changing a PCR condition, using a fair test.","I can design primers for a short sequence and explain how PCR is used in forensics, parentage testing and research."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Base pairing and direction","goal":6,"prompt":"Which strand pairs with \u003cspan class=\"pcr-sq\">5′-ATGC-3′\u003c/span>?","options":[{"t":"\u003cspan class=\"pcr-sq\">5′-TACG-3′\u003c/span>","why":"Its 5′ end would sit opposite the other strand’s 5′ end.","_n":"0105","_k":"c4152b85"},{"t":"\u003cspan class=\"pcr-sq\">3′-TACG-5′\u003c/span>","why":"Complementary bases (A–T, G–C), running the opposite way.","_n":"10f5","_k":"d468d7da"},{"t":"\u003cspan class=\"pcr-sq\">3′-UACG-5′\u003c/span>","why":"DNA uses T.","_n":"20e5","_k":"a8aa5475"},{"t":"\u003cspan class=\"pcr-sq\">3′-ATGC-5′\u003c/span>","why":"A pairs with T, not with A.","_n":"3155","_k":"cee50217"}],"hints":["Which base pairs with A? With G?","Complements: T, A, C, G.","Run it the opposite way: \u003cspan class=\"pcr-sq\">3′-TACG-5′\u003c/span>."]},{"id":"w2","skill":"Base pairing and direction","goal":6,"prompt":"Written 5′ → 3′, which strand pairs with \u003cspan class=\"pcr-sq\">5′-AAGTC-3′\u003c/span>?","options":[{"t":"\u003cspan class=\"pcr-sq\">5′-CTGAA-3′\u003c/span>","why":"C doesn’t pair with C.","_n":"4145","_k":"6a4e5f6d"},{"t":"\u003cspan class=\"pcr-sq\">5′-GACTT-3′\u003c/span>","why":"Complement TTCAG runs 3′ → 5′; read backwards it’s \u003cspan class=\"pcr-sq\">5′-GACTT-3′\u003c/span>.","_n":"5135","_k":"1d4b3c68"},{"t":"\u003cspan class=\"pcr-sq\">5′-TTCAG-3′\u003c/span>","why":"TTCAG is written 3′ → 5′ under the original.","_n":"6125","_k":"849d93f5"},{"t":"\u003cspan class=\"pcr-sq\">5′-AAGTC-3′\u003c/span>","why":"Identical strands don’t pair.","_n":"7095","_k":"c190c960"}],"hints":["Write the complement under each base.","That’s \u003cspan class=\"pcr-sq\">3′-TTCAG-5′\u003c/span>.","Read it from the 5′ end: \u003cspan class=\"pcr-sq\">5′-GACTT-3′\u003c/span>."]},{"id":"w3","skill":"Polymerase rules","goal":3,"prompt":"DNA polymerase adds new nucleotides to which end of a growing strand?","options":[{"t":"The 3′ end","why":"So new DNA grows 5′ → 3′ (module 22).","_n":"8085","_k":"3270b68d"},{"t":"The 5′ end","why":"That would grow 3′ → 5′.","_n":"96a4","_k":"30d27027"},{"t":"Either end","why":"Only the 3′ end has the free –OH it needs.","_n":"a6b4","_k":"a5e3cc1c"},{"t":"Whichever end is nearer the helicase","why":"Direction is fixed by chemistry, not position.","_n":"b684","_k":"15c318c1"}],"hints":["Recall leading and lagging strands.","Synthesis is 5′ → 3′.","The 3′ end."]},{"id":"w4","skill":"Polymerase rules","goal":3,"prompt":"Why does DNA copying in a cell need a primer?","options":[{"t":"The primer unwinds the double helix","why":"That’s helicase’s job.","_n":"c694","_k":"bf481ad5"},{"t":"The primer joins the Okazaki fragments","why":"That’s ligase.","_n":"d664","_k":"e1fa8829"},{"t":"Polymerase can only add to an existing 3′ end, and the primer supplies one","why":"Polymerase can’t start a strand from nothing; it extends the primer’s 3′ end.","_n":"e674","_k":"8f56c842"},{"t":"The primer marks where copying stops","why":"It marks where copying starts.","_n":"f644","_k":"6eab5189"}],"hints":["What can’t polymerase do alone?","It can’t start from nothing.","A primer provides a 3′ end to build on."]},{"id":"w5","skill":"Doubling","goal":4,"prompt":"What is 2⁶?","options":[{"t":"12","why":"That’s 2 × 6. A power multiplies six 2s together.","_n":"g654","_k":"5b022e85"},{"t":"32","why":"That’s 2⁵, one doubling short.","_n":"h624","_k":"84ca8fd1"},{"t":"36","why":"That’s 6², six squared.","_n":"i634","_k":"81f37365"},{"t":"64","why":"2 × 2 × 2 × 2 × 2 × 2.","_n":"j644","_k":"c9b99cf2"}],"hints":["Keep doubling from 2.","2, 4, 8, 16, 32, …","64."]},{"id":"w6","skill":"Doubling","goal":4,"prompt":"A culture of 3 cells doubles every hour. How many cells after 4 hours?","options":[{"t":"12","why":"That adds 3 each hour. Doubling multiplies by 2 each hour.","_n":"k634","_k":"6ae3cc87"},{"t":"24","why":"That’s 3 × 2³. 4 hours means 4 doublings.","_n":"l624","_k":"080e45f5"},{"t":"48","why":"3 × 2⁴ = 3 × 16.","_n":"m614","_k":"50800d08"},{"t":"81","why":"That’s 3⁴. The base is 2 (doubling), not 3.","_n":"n684","_k":"3826af6d"}],"hints":["Double 3 four times.","3, 6, 12, 24, …","48."]}],"refreshers":{"Base pairing and direction":"A pairs with T and G with C, and paired strands run in opposite directions. To write the partner of a strand 5′ → 3′, complement every base, then read the result backwards.","Polymerase rules":"DNA polymerase only adds nucleotides to an existing 3′ end, so it needs a primer to start, and new strands grow 5′ → 3′. Heat breaks the hydrogen bonds between strands, not the backbone.","Doubling":"Doubling \u003ci>n\u003c/i> times multiplies by 2ⁿ. Use these values: 2¹⁰ = 1024 ≈ 1000 and 2²⁰ ≈ 1 000 000."}}},"explore":{"heading":"Thermocycler","intro":"Run PCR one step at a time, then watch the copies pile up. Change a setting and see what breaks.","model":"Model values: strands separate at 90 °C or more; primers pair only at their sites from 50 to 60 °C; a band is visible at about 1 000 000 exact-length copies; the realistic ending levels off after 30 cycles. Real values depend on the primers and the lab.","extNote":"\u003ci>Taq\u003c/i> works best here","fault":{"den":95,"ann":44,"pol":"taq","pri":"both","n0":10,"cyc":16},"faultCase":"Case file: a crime-lab run with 10 starting copies gave extra bands and no visible target band. Fix it by changing \u003cstrong>exactly two\u003c/strong> settings.","predIntro":"Make a prediction first. Then the thermocycler will show you what really happens.","predictions":[{"id":"p1","prompt":"One molecule, before cycle 1. What does the first heating to 95 °C do to the DNA?","options":[{"t":"The DNA breaks into single nucleotides","_n":"o674","_k":"baac0c1f"},{"t":"The two strands separate","_n":"p664","_k":"f3dcb36a"},{"t":"Nothing; heating only activates the primers","_n":"q654","_k":"431cb82b"},{"t":"The DNA is cut at the primer sites","_n":"r5c4","_k":"28bc7513"}],"explain":"Only the hydrogen bonds between bases break. Each strand’s backbone is held by covalent bonds that 95 °C doesn’t break."},{"id":"p2","prompt":"One starting molecule; step to cycle 3. After 3 cycles, how many molecules are \u003cstrong>exactly\u003c/strong> the target length?","options":[{"t":"0","_n":"s5b4","_k":"e90ada77"},{"t":"2","_n":"tde4","_k":"a14c7fc3"},{"t":"6","_n":"udf4","_k":"2fb460d2"},{"t":"8","_n":"ve04","_k":"d22e6614"}],"explain":"Copies made from the two original strands run past the target. Exact-length molecules first appear in cycle 3: 2³ − 2(3) = 2."},{"id":"p3","prompt":"The polymerase is switched to human DNA polymerase, and the machine runs 10 cycles. What happens to the copy count?","options":[{"t":"Grows, but more slowly","_n":"we14","_k":"77ff0e98"},{"t":"Doubles as usual","_n":"xe24","_k":"84537814"},{"t":"No new copies at all","_n":"ye34","_k":"17630973"},{"t":"Starts doubling once the machine cools","_n":"ze44","_k":"1256483c"}],"explain":"Most polymerases are destroyed by heat before the first extension. \u003ci>Taq\u003c/i>, from a hot-spring bacterium, survives."},{"id":"p4","prompt":"Primers set to “forward only”, one starting molecule, 10 cycles. How many new strands after 10 cycles?","options":[{"t":"0","_n":"10e54","_k":"928748ae"},{"t":"10","_n":"11d64","_k":"770dc55c"},{"t":"20","_n":"12d74","_k":"1726fded"},{"t":"1024","_n":"13e85","_k":"edf8b18b"}],"explain":"With one primer, only the original bottom strand can be copied, once per cycle. The new strands have the forward primer’s sequence, so the forward primer can’t pair with them. Doubling needs both primers."}],"chalIntro":"Set the thermocycler to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[4,5],"prompt":"With 1 starting molecule and correct settings, get a visible band in as few cycles as possible.","why":"2²⁰ − 40 = 1 048 536 exact-length copies, just past 1 000 000. At 19 cycles there are only 524 250.","general":"Use 1 starting copy, both primers, \u003ci>Taq\u003c/i>, denaturation at 90 °C or more and annealing from 50 to 60 °C, then find the fewest cycles.","msgs":{"more":"Visible, but not the fewest.","loose":"A band, plus extra bands. Raise the annealing temperature.","c19":"About 524 000 exact copies: one more doubling needed.","n0":"Set the starting copies to 1.","few":"Not visible yet: you need about 1 000 000 exact-length copies."},"hints":["You need about a million exact-length copies.","2²⁰ ≈ 1 000 000.","20 cycles at 50–60 °C annealing with \u003ci>Taq\u003c/i>."]},{"id":"tc2","goal":[4,5],"prompt":"Now start with 100 copies. What’s the fewest number of cycles that gives a visible band?","why":"100 × (2¹⁴ − 28) = 100 × 16 356 = 1 635 600. At 13 cycles there are only 816 600.","general":"Keep the settings valid (both primers, \u003ci>Taq\u003c/i>, at least 90 °C, 50–60 °C), start with 100 copies and find the fewest cycles.","msgs":{"c20":"Works, but 100 copies is a head start of between 6 and 7 doublings.","c13":"816 600: just short.","more":"Visible, but not the fewest.","n0":"Set the starting copies to 100.","few":"Not visible yet: you need about 1 000 000 exact-length copies."},"hints":["You need about 1 000 000 ÷ 100 = 10 000 times more.","2¹³ = 8192 and 2¹⁴ = 16 384.","14 cycles."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Troubleshoot mode. A crime-lab run with 10 starting copies gave extra bands and no visible target band. Fix it by changing \u003cstrong>exactly two\u003c/strong> settings.","why":"Annealing from 50 to 60 °C stops the extra bands, and at 17 cycles 10 × 131 038 = 1 310 380 exact copies make a visible band (16 cycles gives only 655 040).","general":"Change exactly two settings so that the extra bands go and the target band becomes visible.","msgs":{"mode":"Switch to Troubleshoot mode to load the crime-lab run.","annOnly":"Extra bands gone, but 16 cycles gives about 655 000 exact copies.","cycOnly":"More copies, but the extra bands remain.","sample":"In a real case you can’t add more evidence. Change the run, not the sample.","none":"Nothing has changed yet: change exactly two settings.","many":"That changes more than two settings. Change exactly two."},"hints":["There are two problems: extra bands, and too few copies.","Extra bands mean the primers pair loosely. Raise the annealing temperature into 50–60 °C.","10 × (2ⁿ − 2\u003ci>n\u003c/i>) must reach 1 000 000: 16 cycles is too few, 17 is enough."]}]},"part3":{"slug":"primers","name":"Primers","heading":"Design the primers","intro":"Build the primers for a sequence yourself, then test a condition fairly and weigh a real use of PCR.","seqP":"GATCATGCCAGTTCGAATGGCTAGCTTACGGATCTCAAGT","tgt":[5,36],"stations":[{"id":"s1","n":1,"t":"The forward primer","text":"The shaded region of Sequence P is the target. Tap the \u003cstrong>first 8 bases of the target\u003c/strong> on the top strand (tap the first base, then the last). Keyboard: arrows move, Shift + arrow extends the highlight, Enter confirms.","banner":"The forward primer has the top strand’s sequence, so it pairs with the bottom strand.","msgs":{"none":"Tap the first base you want, then the last.","len":"A primer here is 8 bases long. Choose 8 bases.","outside":"That starts outside the shaded target.","right":"Those are the last bases of the target: that end belongs to the reverse primer. Start at the left end of the target.","inside":"Start right at the left edge of the shaded target."}},{"id":"s2","n":2,"t":"Build the reverse primer","text":"Three steps: select the \u003cstrong>last 8 target bases\u003c/strong> of the top strand, press \u003cstrong>Complement\u003c/strong>, then press \u003cstrong>Write 5′ → 3′\u003c/strong>. Test your primer at any stage to see what it would do.","msgs":{"none":"Select the last 8 bases of the target first.","len":"Choose 8 bases.","outside":"That runs outside the shaded target.","left":"Those are the first bases of the target: that end belongs to the forward primer.","inside":"Select the last 8 bases of the target: the right edge of the shading."},"good":"5′-GAGATCCG-3′ pairs with the top strand at the right end, and its 3′ end points left, into the target.","copy":"A copy of the top strand (5′-CGGATCTC-3′) pairs with the \u003cstrong>bottom\u003c/strong> strand at the right end, and its 3′ end points \u003cstrong>away\u003c/strong> from the target. Nothing between the primers would be copied.","unrev":"Written 5′ → 3′ without reversing, 5′-GCCTAGAG-3′ fails to pair: lined up antiparallel against the top strand, most of its bases are mismatched. The reverse primer pairs with the top strand, so it’s complementary \u003cstrong>and\u003c/strong> antiparallel: the complement, read backwards, written 5′ → 3′."},{"id":"s3","n":3,"t":"A fair test","text":"A student wants the best annealing temperature for Sequence P’s primers. They set up five reactions at 45, 50, 55, 60 and 65 °C. Tap a card, then the box it belongs in.","cards":[{"id":"v1","t":"Annealing temperature","_a":"EwtEQw=="},{"id":"v2","t":"Band brightness and extra bands","_a":"EwZEQw=="},{"id":"v3","t":"Starting DNA","_a":"EwFEQw=="},{"id":"v4","t":"Primers","_a":"EwFEQw=="},{"id":"v5","t":"Polymerase","_a":"EwFEQw=="},{"id":"v6","t":"Number of cycles","_a":"EwFEQw=="},{"id":"v7","t":"Denaturation and extension temperatures","_a":"EwFEQw=="}],"boxes":[{"id":"iv","t":"Independent variable","sub":"what the student changes"},{"id":"dv","t":"Dependent variable","sub":"what is measured"},{"id":"cv","t":"Controlled variables","sub":"kept the same"}],"wrong":{"iv":"The independent variable is the one setting the student deliberately changes.","dv":"The dependent variable is what the student looks at to see the effect.","cv":"Controlled variables are kept the same in every tube."},"control":"A sixth tube with \u003cstrong>no DNA added\u003c/strong> is the control. If it shows a band, something was contaminated with DNA.","tubes":[{"id":"t45","t":"45 °C","res":"Target band plus extra bands","kind":"extra"},{"id":"t50","t":"50 °C","res":"One clean band","kind":"clean"},{"id":"t55","t":"55 °C","res":"One clean band","kind":"clean"},{"id":"t60","t":"60 °C","res":"One clean band","kind":"clean"},{"id":"t65","t":"65 °C","res":"Nothing","kind":"none"},{"id":"tc","t":"No DNA (control)","res":"Nothing: no contamination","kind":"none"}],"concl":"The primers work cleanly from 50 to 60 °C.","_a":"SkBeDhFZAQYdQFoIEVkCBkw=","conclWrong":"Look at which tubes show one clean band, and nothing else."},{"id":"s4","n":4,"t":"Who gets to use DNA profiles?","text":"Canada’s National DNA Data Bank, run by the RCMP, stores DNA profiles from crime scenes and from people convicted of certain offences. Some police investigations have also searched consumer ancestry databases for relatives of an unknown suspect.","sortHow":"Sort each card: i "1je45","_k":"65e4c4be"}]}]}},"practice":{"activities":[{"id":"parts","type":"match","title":"PCR parts and steps","summary":"PCR parts and steps","goal":[1,2,3],"instruction":"Tap a term, then the description that matches it.","how":"","leftTitle":"Term","rightTitle":"What it is or does","left":[{"id":"l1","t":"Denaturation (≈ 95 °C)","goal":1,"why":"Heat breaks only the hydrogen bonds; the backbones stay whole."},{"id":"l2","t":"Annealing (≈ 55 °C)","goal":1,"why":"Cooling lets the primers pair with their sites.","hints":["What needs to stick to the single strands before copying?","Something short and complementary.","Annealing: primers pair with their sites."]},{"id":"l3","t":"Extension (72 °C)","goal":1,"why":"New strands grow 5′ → 3′ from each primer."},{"id":"l4","t":"\u003ci>Taq\u003c/i> polymerase","goal":2,"why":"It comes from a hot-spring bacterium."},{"id":"l5","t":"Primer","goal":3,"why":"Polymerase can only add to an existing 3′ end."},{"id":"l6","t":"Free nucleotides","goal":1,"why":"A, T, G and C units, joined into each new strand.","hints":["What does the polymerase join together?","A, T, G and C units.","Free nucleotides."]},{"id":"l7","t":"Thermocycler","goal":1,"why":"It runs the three temperatures again and again."},{"id":"l8","t":"2ⁿ","goal":1,"why":"Each ideal cycle doubles the copies."}],"right":[{"id":"r1","t":"Hydrogen bonds between base pairs break; the strands separate"},{"id":"r2","t":"Primers form hydrogen bonds with their matching sites"},{"id":"r3","t":"\u003ci>Taq\u003c/i> adds nucleotides to each primer’s 3′ end"},{"id":"r4","t":"A DNA polymerase that survives repeated heating"},{"id":"r5","t":"A short single strand that gives the polymerase a 3′ end to start from"},{"id":"r6","t":"The building blocks joined into each new strand"},{"id":"r7","t":"The machine that changes the temperature automatically, cycle after cycle"},{"id":"r8","t":"Copies of the target from one molecule after \u003ci>n\u003c/i> ideal cycles"}],"_a":"SkBeUBFZFkQAQB5DX1EWDBMQAEMfQVgFE1gQEwBBGBRdVhBbEREAFB1AXlQRWRZEBEAeQ19VFgwTEARDH0FYARNYEBMEQRgUXVoQWxERDBRM","wrong":{"l1|r3":"Nothing is built at 95 °C; that step only separates strands.","l5|r4":"That’s the polymerase. A primer is a short strand of nucleotides, not an enzyme.","l8|r6":"2ⁿ counts copies of the target, not of the whole genome."},"wrongDefault":"Picture what’s happening to the DNA at that moment of the cycle."},{"id":"copies","type":"numeric","title":"Count the copies","summary":"Count the copies","star":true,"goal":[4,5],"instruction":"Six problems. Problems 3 to 6 are non-routine (★); problems 5 and 6 go beyond the Final Check. Use these values: 2¹⁰ = 1024.","items":[{"id":"s1","goal":4,"prompt":"From 1 molecule, how many copies of the target after 5 ideal cycles?","_a":"AlA=","display":"32","unit":"copies","why":"2⁵ = 32.","wrong":[{"match":10,"fb":"That’s adding 2 each cycle. Each cycle \u003cstrong>doubles\u003c/strong> the copies: 1, 2, 4, 8, … 2ⁿ, not 2, 4, 6, 8."}],"hints":["Each cycle doubles the copies.","1, 2, 4, 8, 16, …","32."]},{"id":"s2","goal":4,"prompt":"From 3 molecules, how many copies after 4 cycles?","_a":"BVo=","display":"48","unit":"copies","why":"3 × 2⁴ = 3 × 16 = 48.","wrong":[{"match":12,"fb":"Each cycle \u003cstrong>doubles\u003c/strong> the copies: 1, 2, 4, 8, … 2ⁿ, not 2, 4, 6, 8. 3 × 2⁴."},{"match":81,"fb":"Each cycle \u003cstrong>doubles\u003c/strong> the copies: 1, 2, 4, 8, … 2ⁿ, not 2, 4, 6, 8. 3 × 2⁴."}],"hints":["Double 3 four times.","3 × 2⁴.","48."]},{"id":"s3","goal":4,"star":true,"prompt":"From 1 molecule, how many molecules are \u003cstrong>exactly\u003c/strong> the target length after 5 cycles?","_a":"A1A=","display":"22","unit":"molecules","why":"2⁵ − 2(5) = 32 − 10 = 22.","wrong":[{"match":32,"fb":"Copies made from the long original strands run past the target at one end. Exact-length molecules first appear in cycle 3."},{"match":30,"fb":"The longer molecules number 2\u003ci>n\u003c/i> = 10, not 2."}],"hints":["Exact-length = 2ⁿ − 2\u003ci>n\u003c/i>.","2⁵ = 32 and 2(5) = 10.","22."]},{"id":"s4","goal":4,"star":true,"prompt":"From 1 molecule, what’s the fewest number of cycles that gives more than 1000 copies?","_a":"AFI=","display":"10","unit":"cycles","why":"2⁹ = 512 is too few; 2¹⁰ = 1024 is more than 1000.","wrong":[{"match":9,"fb":"2⁹ = 512."}],"hints":["Find the first power of 2 above 1000.","2⁹ = 512 and 2¹⁰ = 1024.","10 cycles."]},{"id":"s5","goal":4,"star":true,"prompt":"A sample starts with 25 copies and ends with 800. How many ideal cycles ran?","_a":"BA==","display":"5","unit":"cycles","why":"800 ÷ 25 = 32 = 2⁵, so 5 doublings.","wrong":[{"match":32,"fb":"That’s how many times bigger; 32 = 2⁵."}],"hints":["How many times bigger is 800 than 25?","800 ÷ 25 = 32.","32 = 2⁵: 5 cycles."]},{"id":"s6","goal":5,"star":true,"prompt":"Sample X shows a detectable amount after 18 cycles; sample Y, run alongside it, after 22 cycles. How many times more starting DNA did X have?","_a":"AFQ=","display":"16","unit":"times","why":"Y needed 4 extra doublings to catch up: 2⁴ = 16.","wrong":[{"match":4,"fb":"Each cycle doubles: 4 extra cycles means 2⁴ times."}],"hints":["Y needed extra cycles to catch up.","Each extra cycle doubles: 22 − 18 = 4 doublings.","2⁴ = 16 times more."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Reza","goal":[1,4,6],"how":"","instruction":"Reza made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":6,"task":"Write the 8-base reverse primer for the target in Sequence P.","steps":["The target ends with the top-strand bases \u003cspan class=\"pcr-sq\">5′-CGGATCTC-3′\u003c/span>.","The reverse primer must pair with the top strand, so its bases are complementary.","The complement of \u003cspan class=\"pcr-sq\">CGGATCTC\u003c/span>, base by base, is \u003cspan class=\"pcr-sq\">GCCTAGAG\u003c/span>.","So the reverse primer is \u003cspan class=\"pcr-sq\">5′-GCCTAGAG-3′\u003c/span>.","Its 3′ end points into the target."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct: those are the paired bases.","","Step 5 follows step 4. The mistake is earlier."],"fixes":[{"t":"Use the first 8 bases of the top strand instead.","why":"That’s the forward primer.","_n":"1ke55","_k":"d79aee42"},{"t":"Use \u003cspan class=\"pcr-sq\">5′-CGGATCTC-3′\u003c/span>, the top strand itself.","why":"That pairs with the bottom strand and points away.","_n":"1lda5","_k":"9d96702a"},{"t":"The complement runs 3′ → 5′, so reverse it: \u003cspan class=\"pcr-sq\">5′-GAGATCCG-3′\u003c/span>.","why":"The reverse primer pairs with the top strand, so it’s complementary \u003cstrong>and\u003c/strong> antiparallel: the complement, read backwards, written 5′ → 3′.","_n":"1mdb5","_k":"34e807ef"},{"t":"Step 4 is correct.","why":"Written 5′ → 3′, the complement must be read backwards.","_n":"1ndc5","_k":"f0b1c7b2"}],"hints":["Which way does the complement run?","Under a 5′ → 3′ strand, the complement is 3′ → 5′.","Reverse it: \u003cspan class=\"pcr-sq\">5′-GAGATCCG-3′\u003c/span>."]},{"id":"e2","goal":4,"task":"Starting from one DNA molecule, how many molecules are exactly the target length after 4 cycles?","steps":["Each cycle doubles the number of molecules.","After 4 cycles there are 2⁴ = 16 molecules.","Every new strand starts at a primer, so all 16 are exactly the target length.","So the answer is 16."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"16 − 2 = 14: only the two original strands are longer.","why":"The first copies of the originals are longer too.","_n":"1odb5","_k":"10e710f2"},{"t":"0: exact-length molecules appear only after cycle 5.","why":"They appear in cycle 3.","_n":"1pda5","_k":"17079cce"},{"t":"Step 3 is correct.","why":"Copies made from the long original strands run past the target at one end. Exact-length molecules first appear in cycle 3.","_n":"1qd95","_k":"2db50fcb"},{"t":"Strands copied from the long originals run past the target at one end. Only 2⁴ − 2(4) = 8 are exact.","why":"Copies made from the long original strands run past the target at one end. Exact-length molecules first appear in cycle 3.","_n":"1rd85","_k":"5d34c80a"}],"hints":["Where does a copy of an original strand end?","Where the original ends: past the target.","16 − 8 = 8."]},{"id":"e3","goal":1,"task":"Describe one PCR cycle.","steps":["Heating to about 95 °C breaks the hydrogen bonds between base pairs, so the strands separate.","Cooling to about 55 °C lets the primers pair with their matching sites.","At 72 °C, \u003ci>Taq\u003c/i> polymerase adds nucleotides to the 5′ end of each primer.","So each new strand grows in the 3′ → 5′ direction."],"_a":"Aw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"\u003ci>Taq\u003c/i> adds to the 3′ end, so each new strand grows 5′ → 3′.","why":"Nucleotides join the \u003cstrong>3′ end\u003c/strong>, so every new strand grows 5′ → 3′.","_n":"1sd75","_k":"53f79414"},{"t":"\u003ci>Taq\u003c/i> adds to both ends of the primer.","why":"Only to the 3′ end.","_n":"1td65","_k":"128d72ad"},{"t":"Step 3 is correct.","why":"Nucleotides join the \u003cstrong>3′ end\u003c/strong>, so every new strand grows 5′ → 3′.","_n":"1ud55","_k":"e9c005b3"},{"t":"At 72 °C the primers are removed.","why":"They become part of the new strands.","_n":"1ve45","_k":"96943012"}],"hints":["Which end does every DNA polymerase extend?","Module 22: the 3′ end.","So new strands grow 5′ → 3′."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the thermocycler: how fast the copies grew, or that exact-length copies take three cycles to appear?"},{"id":"j2","q":"In your own words, why does PCR need a polymerase from a hot-spring bacterium?"},{"id":"j3","q":"Explain to a friend how to write a reverse primer from a top-strand sequence, and why the direction matters."},{"id":"j4","q":"Where would you draw the line on police use of DNA databases, and what fact from this module supports your view?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which step of a PCR cycle happens at about 55 °C?","options":[{"t":"Annealing: primers pair with their matching sites","why":"Cooling to about 55 °C lets the primers form hydrogen bonds with their sites.","_n":"1we35","_k":"31197f67"},{"t":"Ligation: the fragments are joined","why":"Ligation isn’t a PCR step.","_n":"1xd65","_k":"9a880589"},{"t":"Extension: \u003ci>Taq\u003c/i> builds the new strands","why":"That’s at 72 °C.","_n":"1yd75","_k":"f264c281"},{"t":"Denaturation: the strands separate","why":"That needs about 95 °C.","_n":"1zd85","_k":"24744a15"}]},"b":{"prompt":"What happens at about 95 °C in a PCR cycle?","options":[{"t":"Primers pair with the template","why":"That needs cooling to about 55 °C.","_n":"20d95","_k":"276d0c43"},{"t":"\u003ci>Taq\u003c/i> adds nucleotides to the primers","why":"That’s at 72 °C.","_n":"21d25","_k":"96bdd8e5"},{"t":"The hydrogen bonds between base pairs break, separating the strands","why":"Denaturation: the backbones stay whole.","_n":"22d35","_k":"69770e08"},{"t":"The DNA breaks into single nucleotides","why":"95 °C breaks only the \u003cstrong>hydrogen bonds\u003c/strong> between base pairs. Each strand’s sugar–phosphate backbone stays whole.","_n":"23d45","_k":"c40bda41"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Why is \u003ci>Taq\u003c/i> polymerase used in PCR?","options":[{"t":"It survives the repeated 95 °C steps, so it keeps working cycle after cycle","why":"It comes from a hot-spring bacterium, so it’s heat-stable.","_n":"24d55","_k":"27942328"},{"t":"It can start new strands without primers","why":"DNA polymerase can only \u003cstrong>add\u003c/strong> to an existing 3′ end. The primer supplies that end.","_n":"25de5","_k":"ca9301a6"},{"t":"It works only at room temperature","why":"It works best at 72 °C.","_n":"26df5","_k":"019de3ae"},{"t":"Any polymerase would do; \u003ci>Taq\u003c/i> is just cheaper","why":"Most polymerases are destroyed by the first 95 °C step. \u003ci>Taq\u003c/i> comes from a hot-spring bacterium and survives it.","_n":"27603","_k":"29b5070d"}]},"b":{"prompt":"Where does \u003ci>Taq\u003c/i> polymerase come from, and why does that matter?","options":[{"t":"Human cells, so it copies human DNA best","why":"Human polymerase is destroyed at 95 °C.","_n":"285f3","_k":"89cfb08d"},{"t":"It’s built from free nucleotides in the tube","why":"Enzymes are proteins; nucleotides are its building blocks.","_n":"29623","_k":"a0a475e9"},{"t":"Baker’s yeast, so it works at warm temperatures","why":"Yeast’s polymerase isn’t heat-stable.","_n":"2a613","_k":"b7dc7056"},{"t":"A bacterium that lives in hot springs, so the enzyme stays intact at high temperatures","why":"\u003ci>Thermus aquaticus\u003c/i> lives in hot springs; its polymerase survives 95 °C.","_n":"2b643","_k":"59a67073"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"What does a primer provide in PCR?","options":[{"t":"The template strand","why":"The template is the original DNA.","_n":"2c633","_k":"4066f5d6"},{"t":"The site where the DNA is cut","why":"PCR doesn’t cut DNA.","_n":"2d663","_k":"b49b03b4"},{"t":"The energy for copying","why":"The energy comes from the nucleotides themselves.","_n":"2e653","_k":"1b49dbde"},{"t":"A 3′ end that the polymerase can extend","why":"DNA polymerase can only \u003cstrong>add\u003c/strong> to an existing 3′ end. The primer supplies that end.","_n":"2f583","_k":"b800a8ce"}]},"b":{"prompt":"To which end of a primer does \u003ci>Taq\u003c/i> add nucleotides?","options":[{"t":"The 3′ end","why":"So each new strand grows 5′ → 3′.","_n":"2g573","_k":"d40499fc"},{"t":"Both ends","why":"Only the 3′ end has the free –OH.","_n":"2h5a3","_k":"d26cea nes form.","_n":"3l2b0","_k":"e4c8af09"},{"t":"“Covalent bonds break at 95 °C; hydrogen bonds join new nucleotides into a strand.”","why":"The backbone bonds are covalent; base pairs are hydrogen-bonded.","_n":"3m2a0","_k":"f32a3100"},{"t":"“They break at 95 °C and stay broken until the next cycle.”","why":"Primers and new bases pair by hydrogen bonds.","_n":"3n290","_k":"10fda307"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A swab from a crime scene yields about 1000 copies of a DNA region. The lab needs about 1 000 000 copies to see a band. Assuming perfect doubling, what is the fewest number of cycles?","use":"Use these values: 2¹⁰ = 1024.","options":[{"t":"9","why":"1000 × 512 = 512 000: not enough.","_n":"3o280","_k":"071b833b"},{"t":"10","why":"1000 × 2¹⁰ ≈ 1 000 000.","_n":"3p270","_k":"9292d3f4"},{"t":"20","why":"That’s starting from one copy.","_n":"3q260","_k":"8480aa6b"},{"t":"1000","why":"That’s adding copies one at a time. Each cycle \u003cstrong>doubles\u003c/strong> the copies: 1, 2, 4, 8, … 2ⁿ, not 2, 4, 6, 8.","_n":"3r250","_k":"d096d04f"}]},"b":{"prompt":"A hair root yields about 250 copies of a DNA region. The lab needs about 8000 copies to see a band. Assuming perfect doubling, what is the fewest number of cycles?","options":[{"t":"4","why":"250 × 16 = 4000: not enough.","_n":"3s240","_k":"7556418b"},{"t":"5","why":"250 × 2⁵ = 8000.","_n":"3t330","_k":"644c7c3f"},{"t":"6","why":"250 × 64 = 16 000: more than needed; 5 is the fewest.","_n":"3u320","_k":"15ffbfdc"},{"t":"32","why":"That’s how many times bigger: 32 = 2⁵.","_n":"3vb8f","_k":"2003ba4c"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"In a parentage test, short repeated regions are copied from cheek cells of a child, the mother and a possible father. Why is PCR needed before the regions are compared?","options":[{"t":"PCR copies the whole genome so everything can be compared","why":"PCR copies only the region between the two primers.","_n":"3wb9f","_k":"2f6f8228"},{"t":"PCR cuts the DNA into fragments of different sizes","why":"That’s what restriction enzymes do (module 33).","_n":"3xb6f","_k":"2f59e45c"},{"t":"PCR changes the regions so that relatives match","why":"PCR copies; it doesn’t change the sequence.","_n":"3yb7f","_k":"1f2118e8"},{"t":"A swab has too few copies to detect; PCR makes millions of copies of just those regions","why":"PCR copies only the chosen regions, until there’s enough to detect.","_n":"3zb4f","_k":"e0d4def7"}]},"b":{"prompt":"A lab identifies remains using a few cells from a bone. Why is PCR the first step?","options":[{"t":"PCR copies every gene in the bone cells","why":"PCR copies only the region between the two primers.","_n":"40b5f","_k":"743f8102"},{"t":"PCR repairs damaged DNA in old samples","why":"It copies what’s there; it doesn’t repair it.","_n":"41b2f","_k":"78620f48"},{"t":"PCR sorts DNA fragments by size","why":"That’s gel electrophoresis (module 32).","_n":"42b3f","_k":"6752eb4e"},{"t":"The few cells hold too little DNA to analyse; PCR copies the chosen regions millions of times","why":"PCR turns a trace of DNA into enough to study.","_n":"43b0f","_k":"8a0ab6a3"}]}}]},"task":{"title":"Design the run","summary":"Design the run","statement":"\u003cp>A crime lab has 10 copies of a region from a tiny sample. Set up a PCR run for Sequence Q that meets every condition. Can you find all the answers?\u003c/p>\u003cp class=\"pcr-seqbox\">\u003cspan class=\"pcr-sq\">5′-TTA\u003cmark>GCGACCTTGAGCATACGGTCAAGTCGATAGGCTCA\u003c/mark>TC-3′\u003c/span>\u003cbr>\u003cspan class=\"pcr-sq\">3′-AAT\u003cmark>CGCTGGAACTCGTATGCCAGTTCAGCTATCCGAGT\u003c/mark>AG-5′\u003c/span>\u003c/p>\u003cp class=\"tiny muted\">Sequence Q is made up for this module. The target (shaded) is bases 4–38 of the top strand, 35 base pairs. Starting copies are fixed at 10.\u003c/p>\u003col class=\"pcr-conds\">\u003cli>The forward primer pairs at the left end and points into the target.\u003c/li>\u003cli>The reverse primer pairs at the right end and points into the target.\u003c/li>\u003cli>The polymerase survives 95 °C.\u003c/li>\u003cli>The primers pair only at their sites.\u003c/li>\u003cli>There are enough cycles for a visible band.\u003c/li>\u003cli>The run stays out of the plateau.\u003c/li>\u003c/ol>","seqQ":"TTAGCGACCTTGAGCATACGGTCAAGTCGATAGGCTCATC","tgt":[4,38],"fwd":[{"id":"FA","t":"F-A","s":"GCGACCTT"},{"id":"FB","t":"F-B","s":"CGCTGGAA"},{"id":"FC","t":"F-C","s":"AAGGTCGC"}],"rev":[{"id":"RA","t":"R-A","s":"TAGGCTCA"},{"id":"RB","t":"R-B","s":"TGAGCCTA"},{"id":"RC","t":"R-C","s":"ATCCGAGT"}],"anns":[45,50,55,60,65],"cycles":[10,15,20,25,30,35,40],"checks":["Forward primer points in","Reverse primer points in","Polymerase survives 95 °C","Primers pair only at their sites","Enough cycles for a visible band","Out of the plateau"],"tips":["The forward primer has the same sequence as the top strand’s first target bases.","The reverse primer is the reverse complement of the top strand’s last 8 target bases.","Most polymerases are destroyed by the first heating.","Too cool and the primers stick loosely; too hot and they can’t hold on.","10 × 2¹⁵ is only about 330 000. Try more cycles.","More isn’t always better: past 30 cycles the run plateaus."],"explainPrompt":"Explain how you chose each primer and why your temperature and cycle count work.","vocab":"Use the words complementary, antiparallel, 3′ end, annealing and doubling.","success":"Your run meets every condition!","more":"Can you find all the answers?","afterAt":9,"after3":"The primers and the polymerase have only one right answer each. The temperature and the cycle count each have a range that works, and that’s why labs can tune a run."},"cards":[["PCR","Polymerase chain reaction: repeated cycles that copy one chosen region of DNA."],["Denaturation (≈ 95 °C)","Hydrogen bonds between base pairs break; the strands separate. The backbones stay whole."],["Annealing (≈ 55 °C)","Primers pair with their matching sites at the ends of the target."],["Extension (72 °C)","\u003ci>Taq\u003c/i> adds nucleotides to each primer’s 3′ end; new strands grow 5′ → 3′."],["\u003ci>Taq\u003c/i> polymerase","Heat-stable DNA polymerase from a hot-spring bacterium (\u003ci>Thermus aquaticus\u003c/i>)."],["Primer","Short single strand that pairs at one end of the target and supplies a 3′ end."],["Forward primer","Same sequence as the top strand’s first target bases (5′ → 3′)."],["Reverse primer","Reverse complement of the top strand’s last target bases."],["Copies after \u003ci>n\u003c/i> cycles","\u003ci>N\u003c/i>₀ × 2ⁿ (ideal). 2¹⁰ ≈ 1000; 2²⁰ ≈ 1 000 000."],["Exact-length copies","First appear in cycle 3; 2ⁿ − 2\u003ci>n\u003c/i> from one molecule."],["No-DNA control","A tube with no DNA added; a band there means contamination."],["PCR’s inventor and a Canadian Nobel","Kary Mullis (1983); he shared the 1993 Nobel Prize in Chemistry with Michael Smith of UBC."]]}};</script>
