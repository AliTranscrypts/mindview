*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

img,svg{max-width:100%}

.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}

.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 41: synapse simulator (S4 synapse layout), summation neuron + Plot trace, binding-site zoom, reuptake data, task bars, hero.
   Roles: Ca²⁺ --bio-fadh (cerulean), neurotransmitter --bio-h (magenta), Na⁺ --bio-nadh (teal), Cl⁻ --bio-carbon (brown);
   membrane traces --pen; threshold and rest --ink-2 dashed; drug shapes --ink outlines; the cleft is --sheet with an --ink-2 outline.
   Module tokens: --sy-cellf (neuron / terminal fill), --sy-mem (membranes), --sy-muscf (receiving cell), --sy-prot (channel proteins),
   --sy-drugf (drug fill). */
:root{--sy-cellf:color-mix(in srgb,var(--ink-2) 9%,var(--sheet));--sy-mem:color-mix(in srgb,var(--ink-2) 28%,var(--sheet));
  --sy-muscf:color-mix(in srgb,var(--ink-2) 15%,var(--sheet));--sy-prot:color-mix(in srgb,var(--ink-2) 42%,var(--sheet));
  --sy-drugf:color-mix(in srgb,var(--ink-2) 24%,var(--sheet))}

/* hero */
.hero .hero-eq .sy-heq{font-size:.62em;line-height:1.45;display:inline-block}
.sy-c-ca{color:var(--bio-fadh);font-weight:700}.sy-c-nt{color:var(--bio-h);font-weight:700}.sy-c-na{color:var(--bio-nadh);font-weight:700}
.sy-hero{width:100%;aspect-ratio:520 / 300}
.sy-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 17 / 06 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.rg.chips button{border:1.5px solid var(--ink-2);border-radius:999px;background:var(--sheet);color:var(--ink);padding:.35em .8em;font-size:.86rem;line-height:1.25;min-height:36px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:700}
@media (max-width:560px){
  .sy-drugs .rg.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .sy-drugs .rg.chips button{flex:0 0 auto;max-width:15em;white-space:normal}
}

/* steppers */
.sy-stp{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px}
.sy-stp-l{font-size:.9rem;font-weight:700;color:var(--ink)}
.sy-stp-c{display:inline-flex;align-items:center;gap:6px}
.sy-stp-b{min-width:40px;min-height:40px;font-size:1.1rem;font-weight:700;padding:0}
.sy-stp-v{min-width:4.2em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* explore layout */
.sy-pg [hidden]{display:none!important}
.sy-ctl{display:grid;gap:12px}
.sy-pg .pg-ctrl{display:grid;gap:14px}
.sy-btns{display:flex;flex-wrap:wrap;gap:8px}
.sy-e1{margin:0;color:var(--ink-2)}
.sy-stage{position:relative;width:100%;aspect-ratio:520 / 300;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.sy-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sy-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.sy-legend span{display:inline-flex;align-items:center;gap:4px}
.sy-legend svg{width:14px;height:14px}
.sy-legend svg[viewBox^="0 0 22"]{width:22px}
.sy-cap{margin:8px 0 0;font-size:.92rem;min-height:2.8em}
.sy-trw{margin-top:6px}
.sy-note{margin:12px 0 0;color:var(--ink-2);line-height:1.45}

/* SVG drawing */
.sy-bg{fill:var(--sheet)}
.sy-cell{fill:var(--sy-cellf);stroke:var(--ink-2);stroke-width:1.6}
.sy-memb{fill:var(--sy-mem)}
.sy-cleft{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 3}
.sy-musc{fill:var(--sy-muscf)}
.sy-stri{stroke:var(--ink-2);stroke-width:1;opacity:.18}
.sy-prot{fill:var(--sy-prot);stroke:var(--ink-2);stroke-width:1.2}
.sy-cup{fill:none;stroke:var(--ink-2);stroke-width:2.2;stroke-linecap:round}
.sy-ves{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.sy-nt,.sy-ntf{fill:var(--bio-h)}
.sy-ca{fill:var(--bio-fadh)}
.sy-na{fill:var(--bio-nadh)}
.sy-cl{fill:var(--bio-carbon)}
.sy-sc{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.sy-drug{fill:var(--sheet);stroke:var(--ink);stroke-width:1.8}
.sy-drug2{fill:var(--sy-drugf);stroke:var(--ink);stroke-width:1.8}
.sy-clamp{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.sy-pulse{fill:var(--pen);opacity:.45}
.sy-axon{stroke:var(--ink-2);stroke-width:6;stroke-linecap:round}
.sy-syn-e,.sy-syn-i{fill:var(--sy-cellf);stroke-width:2.6}
.sy-syn-e{stroke:var(--bio-nadh)}.sy-syn-i{stroke:var(--bio-carbon)}
.sy-syn-e.on{fill:var(--bio-nadh)}.sy-syn-i.on{fill:var(--bio-carbon)}
.sy-syn-e.off,.sy-syn-i.off{stroke-dasharray:4 3;opacity:.6}
.sy-arr,.sy-lead{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sy-lead{stroke:var(--ink-2);stroke-width:1.3}
.sy-arr-na{stroke:var(--bio-nadh)}
.sy-arr-n{stroke-width:2.2}
.sy-x{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.sy-numc{fill:var(--ink)}
.sy-numt{font:700 12px var(--font-ui);fill:var(--sheet)}
.sy-inset{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2}
.sy-trace{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linejoin:round}
.sy-restl{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 3}
.sy-thr{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 5}
.sy-tick{stroke:var(--ink-2);stroke-width:1.2}
.sy-bar{fill:var(--pen)}
.sy-bar2{fill:var(--sy-prot)}
.sy-t{font:600 11px var(--font-ui);fill:var(--ink-2)}
.sy-tb{font:700 11.5px var(--font-ui);fill:var(--ink)}
.sy-ts{font:600 10px var(--font-ui);fill:var(--ink-2)}
.sy-tv{font:700 15px var(--font-ui);fill:var(--pen)}
.sy-tw{font:700 11px var(--font-ui);fill:var(--sheet)}
.sy-tag{fill:var(--ink)}
.sy-halo{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.sy-lg-e,.sy-lg-i,.sy-lg-s{fill:none;stroke-width:2}
.sy-lg-e{stroke:var(--bio-nadh)}.sy-lg-i{stroke:var(--bio-carbon)}.sy-lg-s{stroke:var(--pen);stroke-width:3.4}
@media (max-width:560px){
  .sy-stage .sy-tb,.sy-hero .sy-tb{font-size:15px}.sy-stage .sy-ts,.sy-hero .sy-ts{font-size:13px}.sy-tv{font-size:18px}
  .sy-stage .sy-tag{font-size:11px}
}

/* Part 3 */
.sy-p3{display:grid;gap:22px}
.sy-st h3{margin:0 0 8px}
.sy-zoom{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.sy-zstage{width:100%;aspect-ratio:360 / 230;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.sy-zstage svg{width:100%;height:100%;display:block}
.sy-zctl{display:grid;gap:10px}
.sy-zlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sy-zb{width:100%;text-align:left}
.sy-zb[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.sy-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.sy-card{border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px;background:var(--sheet)}
.sy-card h4{margin:0 0 4px}
.sy-card p{margin:4px 0}
.sy-stepl{color:var(--ink-2);font-weight:700}
.sy-dq{border-bottom:0}
@media (max-width:820px){ .sy-zoom,.sy-cards{grid-template-columns:minmax(0,1fr)} }

/* task */
.sy-tin{display:grid;gap:14px;margin:12px 0}
.sy-tpv h4{margin:0 0 6px}
.sy-tstage{width:100%;aspect-ratio:360 / 170;border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.sy-tstage svg{width:100%;height:100%;display:block}
.sy-tpv .read{margin-top:10px}
.sy-tlist{margin:8px 0 8px 1.2em}

</style>

title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"177b6821","content":{"id":"41-synapses","kind":"topic","title":"Synapses","topic":"Synapses","readyTopic":"synapses","hero":{"eq":"\u003cspan class=\"sy-heq\">action potential → \u003cspan class=\"sy-c-ca\">Ca²⁺\u003c/span> in → \u003cspan class=\"sy-c-nt\">ACh\u003c/span> crosses the cleft → receptors → \u003cspan class=\"sy-c-na\">Na⁺\u003c/span> in\u003c/span>","eqLabel":"Action potential, then Ca²⁺ in, then ACh crosses the cleft, then receptors, then Na⁺ in","eqSize":"sm","headline":"Electrical, then chemical, then electrical again","text":"An action potential can’t leap the \u003cstrong>synaptic cleft\u003c/strong>. Instead, \u003cstrong>Ca²⁺\u003c/strong> floods the axon terminal, \u003cstrong>vesicles\u003c/strong> release \u003cstrong>neurotransmitter\u003c/strong>, and the transmitter drifts across to \u003cstrong>receptors\u003c/strong> on the next cell. There it opens ion channels, which can start or stop the next signal. An enzyme then clears it away, ready for the next message.","fig":{"html":"\u003cdiv class=\"sy-hero\" id=\"sy-hero\" role=\"img\" aria-label=\"An axon terminal above a narrow synaptic cleft above a receiving cell. A pulse runs down the axon; cerulean Ca²⁺ dots enter through opening channels; three vesicles dock and burst, releasing magenta ACh dots; the dots drift across the cleft and lock into receptors, teal Na⁺ dots stream into the receiving cell and a small +10 mV bump appears on a trace; then acetylcholinesterase (scissors) snips the ACh and the receptors empty.\">\u003c/div>"}},"goals":["I can describe, in order, how an action potential at an axon terminal releases a neurotransmitter and changes the next cell.","I can explain why transmission is one-way and why each signal is brief.","I can distinguish EPSPs from IPSPs and explain which ions cause each.","I can calculate whether summed EPSPs and IPSPs reach threshold (spatial and temporal summation).","I can predict the effect of agonists, antagonists, reuptake inhibitors, enzyme inhibitors and release blockers."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Action potentials","goal":3,"prompt":"In module 40, what is the threshold potential in the model?","options":[{"t":"+35 mV","why":"That’s the peak.","_n":"0882","_k":"a2658057"},{"t":"0 mV","why":"Threshold is still negative.","_n":"1872","_k":"77c99721"},{"t":"−70 mV","why":"That’s the resting potential.","_n":"2862","_k":"36fd412b"},{"t":"About −55 mV","why":"Below it, no spike; at or above it, a full spike.","_n":"3852","_k":"cc60b59e"}],"hints":["It sits between rest and the peak.","15 mV above rest.","−55 mV."]},{"id":"w2","skill":"Action potentials","goal":4,"prompt":"What happens if a stimulus raises the membrane from −70 mV to only −62 mV?","options":[{"t":"The neuron stays at −62 mV permanently","why":"It returns to rest.","_n":"4842","_k":"a3ebe4bf"},{"t":"A full spike fires","why":"−62 is below −55.","_n":"5832","_k":"8d4f5a91"},{"t":"A small action potential fires","why":"All or none: there are no small spikes.","_n":"6822","_k":"3fdd739b"},{"t":"It fades with no action potential","why":"Below threshold.","_n":"7812","_k":"a6e16c5e"}],"hints":["Compare −62 with −55.","It’s below threshold.","It fades."]},{"id":"w3","skill":"Membrane transport","goal":1,"prompt":"How do vesicles release their contents outside a cell?","options":[{"t":"By pumping the contents through a channel","why":"Large amounts leave by fusion, not through channels.","_n":"8802","_k":"d5241fa7"},{"t":"By fusing with the cell membrane (exocytosis)","why":"The vesicle membrane joins the cell membrane.","_n":"9fe8","_k":"bb097a10"},{"t":"By bursting inside the cell","why":"Then the contents would stay inside.","_n":"aff8","_k":"66e5e6c8"},{"t":"By diffusing through the membrane","why":"Most transmitters can’t cross the membrane directly.","_n":"bfc8","_k":"31d7f352"}],"hints":["Exo- means ‘out’.","The vesicle merges with the membrane.","Exocytosis."]},{"id":"w4","skill":"Membrane transport","goal":3,"prompt":"If negative ions such as Cl⁻ enter a neuron, what happens to the inside’s voltage?","options":[{"t":"It reaches threshold","why":"Moving away from threshold.","_n":"cfd8","_k":"6077db18"},{"t":"It becomes more negative","why":"Adding negative charge lowers the voltage.","_n":"d028","_k":"75a9f460"},{"t":"It becomes more positive","why":"That’s what positive ions entering do.","_n":"e038","_k":"d5bfa20b"},{"t":"Nothing changes","why":"Moving charge changes voltage.","_n":"f008","_k":"d5d75183"}],"hints":["Negative in means…","…more negative inside.","More negative."]},{"id":"w5","skill":"Enzymes and receptors","goal":5,"prompt":"A molecule fits a receptor’s binding site but doesn’t activate it. What effect does it have?","options":[{"t":"It blocks the normal signal molecule from binding","why":"It occupies the site.","_n":"g018","_k":"33ecfc08"},{"t":"None: it just floats away","why":"While bound, it blocks the site.","_n":"hf68","_k":"0456f13d"},{"t":"It destroys the receptor","why":"Binding isn’t destruction.","_n":"if78","_k":"8ee1d131"},{"t":"It activates the receptor more strongly","why":"It doesn’t activate it at all.","_n":"jf87","_k":"195bd964"}],"hints":["Think of a key that fits a lock but won’t turn.","The right key can’t get in.","It blocks."]},{"id":"w6","skill":"Enzymes and receptors","goal":2,"prompt":"If the enzyme that breaks down a signal molecule is inhibited, the signal molecule…","options":[{"t":"changes into a different molecule","why":"That’s what the enzyme normally does.","_n":"kf77","_k":"33b4987a"},{"t":"disappears at once","why":"That would need more enzyme.","_n":"lf67","_k":"01b541ac"},{"t":"stays around longer","why":"Less breakdown.","_n":"mf57","_k":"196c2181"},{"t":"is broken down faster","why":"Inhibiting the enzyme slows breakdown.","_n":"nf47","_k":"8619834c"}],"hints":["What does the enzyme normally do?","It breaks the molecule down.","Inhibit it, and the molecule lasts longer."]}],"refreshers":{"Action potentials":"Rest −70 mV, threshold −55 mV, peak +35 mV. A depolarization below threshold fades; at threshold, a full spike fires.","Membrane transport":"Vesicles release their contents by exocytosis. Positive ions entering make the inside more positive; negative ions entering make it more negative.","Enzymes and receptors":"Receptors respond to the molecule that fits them. Blockers occupy the site without activating it. Enzyme inhibitors make their substrate last longer."}}},"explore":{"heading":"Synapse simulator","intro":"Step through a signal crossing a synapse, then add drugs and toxins. In Summation mode, combine inputs and see whether the next neuron fires.","modes":[["nmj","Neuromuscular junction"],["sum","Summation"]],"drugs":[["none","No drug"],["ca","Ca²⁺ channel blocker"],["rel","Release blocker (botulinum-toxin-like)"],["ant","Receptor antagonist (curare-like)"],["ago","Receptor agonist, no nerve impulse (nicotine-like)"],["ache","Acetylcholinesterase inhibitor"]],"drugTag":{"ca":"Ca²⁺ channel blocker on the Ca²⁺ channels","rel":"Release blocker (botulinum-toxin-like): vesicles can’t fuse","ant":"Curare-like antagonist sitting in the receptors","ago":"Nicotine-like agonist in the cleft","ache":"Acetylcholinesterase inhibitor on the enzyme"},"steps":["Action potential reaches the axon terminal","Ca²⁺ channels open; Ca²⁺ enters","Vesicles fuse and release ACh","ACh diffuses across the cleft","ACh binds receptors; Na⁺ channels open","Acetylcholinesterase breaks ACh down"],"nmj":{"none":{"ca":"high","ves":"10 of 10","ach":"100 AU at 1 ms","ach6":"100 AU at 1 ms, 0 AU at 3 ms","rec":"80%","mem":"−40 mV (threshold reached)","res":"Single twitch","clr":"2 ms","caps":["Ready. Press \u003cstrong>Step\u003c/strong> or \u003cstrong>Play\u003c/strong> to send an action potential down the axon.","The action potential arrives at the axon terminal.","Voltage-gated Ca²⁺ channels open, and Ca²⁺ floods into the terminal.","All 10 vesicles fuse with the membrane and release ACh into the cleft.","ACh diffuses across the synaptic cleft: 100 AU at 1 ms.","ACh binds 80% of the receptors; their channels open, Na⁺ rushes in and the muscle membrane reaches −40 mV: a single twitch.","Acetylcholinesterase breaks ACh down within 2 ms (0 AU at 3 ms). The receptors empty and the membrane returns to −70 mV."]},"ca":{"ca":"low","ves":"0 of 10","ach":"0 AU at 1 ms","ach6":"0 AU at 1 ms, 0 AU at 3 ms","rec":"0%","mem":"−70 mV (stays at rest)","res":"None","clr":"—","caps":["Ready. Press \u003cstrong>Step\u003c/strong> or \u003cstrong>Play\u003c/strong> to send an action potential down the axon.","The action potential arrives at the axon terminal.","The Ca²⁺ channels are blocked: no Ca²⁺ enters the terminal (Ca²⁺ stays low).","With no Ca²⁺ trigger, the vesicles stay put: 0 of 10 released.","No ACh reaches the cleft (0 AU).","No receptors are bound, so the muscle membrane stays at −70 mV. No contraction.","There is no ACh for acetylcholinesterase to break down."]},"rel":{"ca":"high","ves":"0 of 10","ach":"0 AU at 1 ms","ach6":"0 AU at 1 ms, 0 AU at 3 ms","rec":"0%","mem":"−70 mV (stays at rest)","res":"None","clr":"—","caps":["Ready. Press \u003cstrong>Step\u003c/strong> or \u003cstrong>Play\u003c/strong> to send an action potential down the axon.","The action potential arrives at the axon terminal.","Voltage-gated Ca²⁺ channels open, and Ca²⁺ floods into the terminal.","Ca²⁺ is in, but the release blocker stops the vesicles fusing: they dock and stay shut. 0 of 10 released.","No ACh reaches the cleft (0 AU).","No receptors are bound, so the muscle membrane stays at −70 mV. No contraction.","There is no ACh for acetylcholinesterase to break down."]},"ant":{"ca":"high","ves":"10 of 10","ach":"100 AU at 1 ms","ach6":"100 AU at 1 ms, 0 AU at 3 ms","rec":"0%","mem":"−70 mV (stays at rest)","res":"None (paralysis)","clr":"2 ms","caps":["Ready. The antagonist already sits in the receptors. Press \u003cstrong>Step\u003c/strong> or \u003cstrong>Play\u003c/strong>.","The action potential arrives at the axon terminal.","Voltage-gated Ca²⁺ channels open, and Ca²⁺ floods into the terminal.","All 10 vesicles fuse with the membrane and release ACh into the cleft.","ACh diffuses across the synaptic cleft: 100 AU at 1 ms.","ACh reaches the receptors, but the antagonist fills them: 0% bound by ACh. The membrane stays at −70 mV: paralysis.","Acetylcholinesterase clears the unused ACh within 2 ms. The antagonist stays in the receptors."]},"ago":{"ca":"low","ves":"0 of 10","ach":"0 AU at 1 ms (agonist present)","ach6":"0 AU at 1 ms, 0 AU at 3 ms (agonist present)","rec":"60%","mem":"−45 mV (threshold reached)","res":"Twitch without a nerve signal","clr":"—","caps":["Ready. The agonist is in the cleft, and no nerve impulse will come. Press \u003cstrong>Step\u003c/strong> or \u003cstrong>Play\u003c/strong>.","No action potential arrives: the nerve is silent.","With no impulse, the Ca²⁺ channels stay shut (Ca²⁺ low).","No vesicles are released (0 of 10).","There is no ACh in the cleft, but the agonist is there.","The agonist binds 60% of the receptors and opens them: the membrane reaches −45 mV, a twitch without a nerve signal.","The agonist drifts off the receptors again, so the twitch ends. No ACh was involved, so there was nothing for acetylcholinesterase to clear."]},"ache":{"ca":"high","ves":"10 of 10","ach":"100 AU at 1 ms","ach6":"100 AU at 1 ms, 90 AU at 3 ms","rec":"80%","rec6":"80%, held","mem":"−40 mV (threshold reached)","mem6":"−40 mV, held","res5":"Contracting","res":"Sustained contraction (spasm)","clr":"> 20 ms","caps":["Ready. Press \u003cstrong>Step\u003c/strong> or \u003cstrong>Play\u003c/strong> to send an action potential down the axon.","The action potential arrives at the axon terminal.","Voltage-gated Ca²⁺ channels open, and Ca²⁺ floods into the terminal.","All 10 vesicles fuse with the membrane and release ACh into the cleft.","ACh diffuses across the synaptic cleft: 100 AU at 1 ms.","ACh binds 80% of the receptors; their channels open, Na⁺ rushes in and the muscle membrane reaches −40 mV: a single twitch.","The inhibited enzyme barely works: ACh is still 90 AU at 3 ms, the receptors stay bound and the membrane is held at −40 mV: sustained contraction (spasm)."]}},"sum":{"epsp":10,"ipsp":-5,"fade":10,"rest":-70,"thr":-55},"sumIdle":"Set the inputs, then press \u003cstrong>Play\u003c/strong> to watch the potentials add up at the axon hillock.","modelNote":"\u003cstrong>How the model works.\u003c/strong> Neuromuscular junction: the values come from one model table (muscle fibre rest −70 mV, threshold −55 mV; ACh in arbitrary units, AU). Summation: each excitatory firing adds an EPSP of +10 mV that fades evenly to 0 over 10 ms; I1 adds an IPSP of −5 mV that fades evenly over 10 ms. Hillock potential = −70 mV + what remains of each potential. The neuron fires if the hillock reaches −55 mV or higher at any moment (exactly −55 mV counts). Real EPSPs fade along a curve and vary in size; the straight-line fade and fixed sizes are a model.","predIntro":"Make a prediction first. Then the simulator will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"nmj","drug":"none"},"to":{"drug":"ca"},"prompt":"\u003cspan class=\"muted\">Neuromuscular junction, no drug.\u003c/span> Now the Ca²⁺ channel blocker is turned on and the signal plays. What happens?","options":[{"t":"No ACh is released, so no contraction","_n":"of37","_k":"534a8bb5"},{"t":"ACh is released but not cleared","_n":"pf27","_k":"e5599364"},{"t":"Normal contraction, since Na⁺ still arrives","_n":"qf17","_k":"974342be"},{"t":"A stronger contraction","_n":"r007","_k":"0385bc86"}],"explain":"The impulse arrives, no Ca²⁺ enters, and the vesicles stay put. Ca²⁺ entry is the trigger for vesicle fusion."},{"id":"p2","start":{"mode":"nmj","drug":"none"},"to":{"drug":"ache"},"prompt":"\u003cspan class=\"muted\">Neuromuscular junction, no drug.\u003c/span> Now the acetylcholinesterase inhibitor is turned on. What happens to the muscle?","options":[{"t":"It relaxes faster","_n":"sff7","_k":"c1dd9af3"},{"t":"It contracts normally","_n":"t727","_k":"9bd99947"},{"t":"It can’t contract at all","_n":"u737","_k":"180a1e1f"},{"t":"It stays contracted (spasm)","_n":"v747","_k":"8576fcfc"}],"explain":"ACh stays at 90 AU at 3 ms and the receptors stay bound. Without breakdown, ACh keeps stimulating the muscle."},{"id":"p3","start":{"mode":"sum","g":-1,"t2":-1,"ti":-1},"prompt":"\u003cspan class=\"muted\">Summation: only E1 fires, at 0 ms.\u003c/span> When you press Play, does the neuron fire?","options":[{"t":"No: the hillock reaches only −60 mV","_n":"w757","_k":"54d6dff4"},{"t":"Yes, at −60 mV","_n":"x6e7","_k":"853d8e7f"},{"t":"Yes, at +35 mV","_n":"y6f7","_k":"9a971785"},{"t":"No, it drops to −75 mV","_n":"z707","_k":"94da54ff"}],"explain":"One triangle peaks at −60 mV. One EPSP is +10 mV; threshold needs +15."},{"id":"p4","start":{"mode":"sum","g":-1,"t2":-1,"ti":-1},"to":{"t2":2},"prompt":"\u003cspan class=\"muted\">E1 fires at 0 ms.\u003c/span> Now E2 also fires, at 2 ms. Does the neuron fire?","options":[{"t":"Yes, but only if I1 fires too","_n":"10717","_k":"1c08a09d"},{"t":"No: only one input counts at a time","_n":"117a7","_k":"3c293314"},{"t":"No: inputs must arrive at exactly the same time","_n":"127b7","_k":"735d80a8"},{"t":"Yes: at 2 ms the hillock is at −52 mV","_n":"136c7","_k":"8662d1c8"}],"explain":"The sum peaks at −52 mV. E1 has faded to +8 by 2 ms; add E2’s +10 to get +18 above rest."}],"chalIntro":"Use the simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"Summation: fire E1 twice so the neuron fires, using the \u003cstrong>longest\u003c/strong> possible gap.","why":"At 5 ms the first EPSP still gives +5, and 5 + 10 = 15: exactly −55 mV, so the neuron fires.","wrong":{"mode":"Switch to \u003cstrong>Summation\u003c/strong> mode first.","others":"Use E1 only: switch E2 and I1 off.","off":"Make E1 fire a second time: set its gap.","g6":"E1 has faded to +4, so 4 + 10 = 14: −56 mV, just short.","short":"That fires, but a longer gap also works."},"hints":["How much of the first EPSP is left after \u003ci>g\u003c/i> ms?","10 − \u003ci>g\u003c/i> mV is left; add 10 for the second.","You need a total of 15: \u003ci>g\u003c/i> = 5."]},{"id":"tc2","goal":5,"prompt":"Neuromuscular junction: choose the one toggle that stops contraction even though ACh \u003cstrong>is\u003c/strong> released into the cleft.","why":"The antagonist sits in the receptors, so the released ACh can’t bind: no Na⁺ enters and the muscle stays at rest.","wrong":{"mode":"Switch to \u003cstrong>Neuromuscular junction\u003c/strong> mode first.","none":"With no drug, the muscle twitches normally. Choose a drug.","noRelease":"Then no ACh is released at all.","ache":"That makes contraction last longer.","ago":"That causes a twitch."},"hints":["ACh must be in the cleft, yet do nothing.","Something must stop it binding.","The receptor antagonist."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Summation: E1 fires at 0 ms; E2 and I1 fire together at \u003ci>t\u003c/i> ms. Choose \u003ci>t\u003c/i> so the neuron still fires.","why":"At \u003ci>t\u003c/i> = 0: 10 + 10 − 5 = 15, exactly −55 mV. Any later and E1 has started to fade.","wrong":{"mode":"Switch to \u003cstrong>Summation\u003c/strong> mode first.","gap":"Switch off E1’s second firing: E1 fires only at 0 ms here.","e2":"E2 must fire too.","i1":"I1 must fire too.","apart":"E2 and I1 must fire together: give them the same time.","t5":"Without I1 that works (15), but I1 removes 5: −60 mV.","t1":"9 + 10 − 5 = 14: −56 mV."},"hints":["I1 subtracts 5, so the excitatory total must reach 20.","E2 gives 10; E1 must still be giving 10.","E1 hasn’t faded at all only at \u003ci>t\u003c/i> = 0."]}]},"part3":{"slug":"drugs","name":"Drugs","heading":"Drugs at the synapse","intro":"Every drug and toxin here acts at one step of the synapse, so you can predict its effect instead of memorizing it. Zoom in on a receptor’s binding site, read some data, then meet the enzyme inhibitors and release blockers. Mechanisms only: no doses.","zoom":{"title":"Station 1: the binding site","panel":"Zoom to the molecules: the binding site","how":"Choose a molecule from the list to place it in the receptor’s binding site (Enter works too). Try all three.","shapes":[{"id":"tx","t":"The transmitter (ACh)","res":"ACh fits the binding site and switches the channel open: Na⁺ flows into the cell."},{"id":"ag","t":"An agonist (a different shape)","res":"A different shape, but its key part fits too, and it also switches the channel open. An agonist \u003cstrong>mimics\u003c/strong> the transmitter."},{"id":"an","t":"An antagonist","res":"It fits the binding site but leaves the channel shut. While it sits there, ACh can’t get in: an antagonist \u003cstrong>blocks\u003c/strong> the transmitter."}],"empty":"The binding site is empty and the channel is shut.","all":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","cards":[{"t":"Nicotine","d":"An \u003cstrong>agonist\u003c/strong> at one type of ACh receptor: it fits and opens the channel, as ACh does."},{"t":"Curare","d":"An \u003cstrong>antagonist\u003c/strong> at the neuromuscular junction: it fits the ACh receptor but blocks it. Historically a hunting-dart poison; related medicines relax muscles during surgery."}]},"data":{"title":"Station 2: reuptake inhibitors","panel":"Check it with data","intro":"Some transmitters, such as serotonin, are cleared mainly by \u003cstrong>reuptake\u003c/strong> transporters that pull them back into the terminal.","caption":"Model data: serotonin in the cleft (AU)","times":[0,2,5,10,20],"normal":[100,50,10,0,0],"inhib":[100,85,70,45,15],"rowN":"Normal","rowI":"With a reuptake inhibitor","describe":"Model data. Serotonin in the cleft over 20 ms after release, with a dashed line at 50 AU. Normal: 100, 50, 10, 0 and 0 AU at 0, 2, 5, 10 and 20 ms. With a reuptake inhibitor: 100, 85, 70, 45 and 15 AU. The normal curve crosses 50 AU at 2 ms; the inhibitor curve crosses it between 5 and 10 ms, at about 9 ms.","qs":[{"id":"sa","prompt":"Normal: for how long does serotonin stay above 50 AU?","choices":[{"t":"2 ms","fb":"Right: it has fallen to 50 AU by 2 ms.","_n":"146b7","_k":"22667a82"},{"t":"10 ms","fb":"By 10 ms it is gone.","_n":"156e7","_k":"523b4dab"},{"t":"5 ms","fb":"By 5 ms it is down to 10 AU.","_n":"166d7","_k":"8d1250a1"},{"t":"0 ms","fb":"It starts at 100 AU.","_n":"17707","_k":"c6c43e93"}]},{"id":"sb","prompt":"With a reuptake inhibitor: about how long does it stay above 50 AU?","choices":[{"t":"about 5 ms","fb":"At 5 ms it is still 70 AU.","_n":"186f7","_k":"3e6024e5"},{"t":"about 2 ms","fb":"At 2 ms it is still 85 AU.","_n":"19727","_k":"72594aa3"},{"t":"about 9 ms","fb":"Right: it is 70 AU at 5 ms and 45 AU at 10 ms, so it crosses 50 AU at about 9 ms, more than four times as long as normal.","_n":"1a717","_k":"aa8b05a7"},{"t":"about 20 ms","fb":"At 10 ms it is already down to 45 AU.","_n":"1b747","_k":"166280f2"}]}],"text":"SSRIs (selective serotonin reuptake inhibitors), used to treat depression, work this way. Some stimulant drugs, such as cocaine, block dopamine reuptake (mechanism only)."},"more":{"title":"Station 3: enzyme inhibitors and release blockers","cards":[{"t":"Acetylcholinesterase inhibitors","step":"Step changed: ACh breakdown in the cleft (step 6).","d":"Some insecticides use them (insects’ nerves are overstimulated), and some medicines for Alzheimer disease use them in carefully chosen amounts to boost weak ACh signalling."},{"t":"Botulinum toxin","step":"Step changed: vesicle release (step 3).","d":"It stops vesicles releasing ACh. Tiny medical doses relax overactive muscles."}]},"quickCheck":{"title":"Quick check","summary":"Drugs at the synapse quick check","items":[{"id":"q1","goal":5,"prompt":"A molecule binds the ACh receptor and opens its channel. It is…","choices":[{"t":"a release blocker","fb":"Fits \u003cstrong>and\u003c/strong> activates.","_n":"1c737","_k":"98d5d3e0"},{"t":"a reuptake inhibitor","fb":"Fits \u003cstrong>and\u003c/strong> activates.","_n":"1d867","_k":"9201ba87"},{"t":"an agonist","fb":"Right. It fits \u003cstrong>and\u003c/strong> activates, like the transmitter.","_n":"1e877","_k":"8be2d16c"},{"t":"an antagonist","fb":"Fits \u003cstrong>and\u003c/strong> activates.","_n":"1f847","_k":"a5943f67"}]},{"id":"q2","goal":5,"prompt":"Curare causes paralysis because…","choices":[{"t":"it destroys ACh","fb":"ACh is released but can’t bind.","_n":"1g857","_k":"9dfaeedf"},{"t":"it blocks Ca²⁺ entry","fb":"ACh is released but can’t bind.","_n":"1h827","_k":"0832604f"},{"t":"it inhibits acetylcholinesterase","fb":"ACh is released but can’t bind.","_n":"1i837","_k":"fb9f66e7"},{"t":"it blocks ACh receptors on muscle","fb":"Right. ACh is released but can’t bind.","_n":"1j807","_k":"f30614cc"}]},{"id":"q3","goal":5,"prompt":"An SSRI makes serotonin…","choices":[{"t":"release less","fb":"Blocking reuptake keeps it in the cleft.","_n":"1k817","_k":"c28d98c7"},{"t":"bind fewer receptors","fb":"Blocking reuptake keeps it in the cleft.","_n":"1l7e7","_k":"165e71f5"},{"t":"break down faster","fb":"Blocking reuptake keeps it in the cleft.","_n":"1m7f7","_k":"19dbeeb3"},{"t":"stay in the cleft longer","fb":"Right. Blocking reuptake keeps it in the cleft.","_n":"1n007","_k":"659736a8"}]},{"id":"q4","goal":5,"prompt":"Botulinum toxin relaxes muscles because…","choices":[{"t":"receptors are activated","fb":"No release, no signal.","_n":"1off7","_k":"1a712e52"},{"t":"vesicles can’t release ACh","fb":"Right. No release, no signal.","_n":"1pfe7","_k":"c6b17815"},{"t":"ACh is broken down faster","fb":"No release, no signal.","_n":"1qfd7","_k":"f1c60f56"},{"t":"Cl⁻ enters","fb":"No release, no signal.","_n":"1r047","_k":"0734bec3"}]}]}},"practice":{"activities":[{"id":"order","type":"order","title":"Put the steps in order","goal":[1,3],"instruction":"Put each sequence in order, from the action potential arriving to the effect on the next cell.","sequences":[{"id":"s1","goal":1,"prompt":"Excitatory (neuromuscular junction), 7 steps.","steps":["The action potential reaches the axon terminal.","Voltage-gated Ca²⁺ channels open and Ca²⁺ enters.","Vesicles fuse with the membrane and release ACh.","ACh diffuses across the synaptic cleft.","ACh binds receptors; their Na⁺ channels open.","Na⁺ enters and the muscle membrane depolarizes.","Acetylcholinesterase breaks ACh down."],"start":[2,5,0,6,3,1,4],"wrong":[{"order":[0,2,1,3,4,5,6],"fb":"Ca²⁺ is the trigger, so it comes first."},{"order":[2,0,1,3,4,5,6],"fb":"Ca²⁺ is the trigger, so it comes first."},{"order":[0,1,2,3,6,4,5],"fb":"The transmitter must act before it is cleared."},{"order":[0,1,2,6,3,4,5],"fb":"The transmitter must act before it is cleared."},{"order":[0,1,2,3,4,6,5],"fb":"The transmitter must act before it is cleared."}],"general":"Ask what has to happen before it can be done. Ca²⁺ is the trigger for release, and the transmitter must act before it is cleared.","why":"The electrical signal arrives, Ca²⁺ triggers release, ACh crosses and binds, Na⁺ enters, and the enzyme ends the signal.","hints":["Start with the electrical signal.","What triggers vesicles?","Ca²⁺ → release → diffusion → binding → Na⁺ in → breakdown."]},{"id":"s2","goal":3,"prompt":"Inhibitory, 5 steps.","steps":["The action potential reaches the axon terminal.","Ca²⁺ enters the terminal.","GABA is released into the cleft.","GABA binds receptors; their Cl⁻ channels open.","Cl⁻ enters and the membrane hyperpolarizes (IPSP)."],"start":[3,0,4,2,1],"wrong":[{"order":[0,2,1,3,4],"fb":"Ca²⁺ is the trigger, so it comes first."},{"order":[2,0,1,3,4],"fb":"Ca²⁺ is the trigger, so it comes first."}],"general":"Ask what has to happen before it can be done. The transmitter must be released before it can bind.","why":"Same start as an excitatory synapse, but GABA opens Cl⁻ channels. Cl⁻ entering makes the inside more negative, so the membrane hyperpolarizes rather than depolarizes.","hints":["The first two steps are the same as at any synapse.","Release, then binding, then the ions move.","Action potential → Ca²⁺ in → GABA released → GABA binds → Cl⁻ in."]}]},{"id":"detective","type":"mc","title":"Drug detective","star":true,"goal":5,"instruction":"Each row gives data from a synapse. Which drug or toxin is acting? Items 4 to 7 are non-routine; the last two go beyond the Final Check.","how":"","items":[{"id":"d1","goal":5,"prompt":"ACh released normally; receptors bound 0%; no EPSP.","options":[{"t":"Agonist","why":"An agonist would bind and activate the receptors, but none are bound.","_n":"1s037","_k":"c588fa51"},{"t":"Antagonist","why":"ACh is in the cleft but can’t bind: something occupies the receptors without activating them.","_n":"1t027","_k":"81881860"},{"t":"Reuptake inhibitor","why":"That would keep transmitter in the cleft longer, not leave the receptors empty.","_n":"1u017","_k":"1df6a2b5"},{"t":"Enzyme inhibitor","why":"That would hold ACh on the receptors longer; here none are bound.","_n":"1vf87","_k":"91a6e14d"},{"t":"Release blocker","why":"ACh \u003cstrong>is\u003c/strong> in the cleft.","_n":"1wf77","_k":"08b8798b"},{"t":"Ca²⁺ channel blocker","why":"ACh was released, so Ca²⁺ must have entered.","_n":"1xfa7","_k":"d2c6d036"}]},{"id":"d2","goal":5,"prompt":"Ca²⁺ enters normally, but no transmitter appears in the cleft.","options":[{"t":"Agonist","why":"An agonist acts on receptors; it doesn’t stop release.","_n":"1yfb7","_k":"75cdc67c"},{"t":"Antagonist","why":"An antagonist blocks receptors; transmitter would still appear in the cleft.","_n":"1zfc7","_k":"c48dabc6"},{"t":"Reuptake inhibitor","why":"That would leave more transmitter in the cleft, not none.","_n":"20fd7","_k":"50bc7cde"},{"t":"Enzyme inhibitor","why":"That would leave more transmitter in the cleft, not none.","_n":"21fe7","_k":"afc6a38a"},{"t":"Release blocker","why":"Ca²⁺ arrived, yet nothing was released: the step after the Ca²⁺ trigger is blocked.","_n":"22ff7","_k":"eb12d8d1"},{"t":"Ca²⁺ channel blocker","why":"Ca²⁺ entered normally.","_n":"23007","_k":"28ab6ec7"}]},{"id":"d3","goal":5,"prompt":"Serotonin stays in the cleft 6 times longer; enzyme activity normal; transporters blocked.","options":[{"t":"Agonist","why":"An agonist mimics the transmitter; it doesn’t change how long serotonin stays.","_n":"24017","_k":"bbcda11d"},{"t":"Antagonist","why":"An antagonist blocks receptors; it doesn’t keep serotonin in the cleft.","_n":"25f27","_k":"78c592dd"},{"t":"Reuptake inhibitor","why":"The transporters that pull serotonin back are blocked. Blocking reuptake \u003cstrong>keeps\u003c/strong> the transmitter in the cleft.","_n":"26f37","_k":"4ffa1c3c"},{"t":"Enzyme inhibitor","why":"The enzyme is working; the transporters aren’t.","_n":"27f46","_k":"fcbeb566"},{"t":"Release blocker","why":"Serotonin was released; it just stays longer.","_n":"28f36","_k":"d6cc1042"},{"t":"Ca²⁺ channel blocker","why":"Serotonin was released, so Ca²⁺ entered.","_n":"29f66","_k":"9b57a21a"}]},{"id":"d4","goal":5,"prompt":"\u003cspan class=\"tag\">★\u003c/span> Receptors 60% bound with no nerve impulse at all.","options":[{"t":"Agonist","why":"Receptors are bound and active although no transmitter was released: a drug that fits and activates them.","_n":"2af56","_k":"454e2b5a"},{"t":"Antagonist","why":"Antagonists block; these receptors are \u003cstrong>activated\u003c/strong>.","_n":"2bf06","_k":"24627707"},{"t":"Reuptake inhibitor","why":"With no impulse, no transmitter is released to keep in the cleft.","_n":"2cef6","_k":"2feb6275"},{"t":"Enzyme inhibitor","why":"With no impulse, there’s no ACh for the enzyme to act on.","_n":"2df26","_k":"7fe9e8e3"},{"t":"Release blocker","why":"Nothing was being released anyway; something else is binding the receptors.","_n":"2ef16","_k":"91b748e5"},{"t":"Ca²⁺ channel blocker","why":"That would stop release; it wouldn’t bind receptors.","_n":"2ffc6","_k":"0b452124"}]},{"id":"d5","goal":5,"prompt":"\u003cspan class=\"tag\">★\u003c/span> ACh stays at 90 AU at 3 ms; acetylcholinesterase activity 5%.","options":[{"t":"Agonist","why":"ACh itself is lingering; nothing new is activating the receptors.","_n":"2gfb6","_k":"61f9b968"},{"t":"Antagonist","why":"That blocks receptors; it doesn’t keep ACh in the cleft.","_n":"2hee6","_k":"c2e0a165"},{"t":"Reuptake inhibitor","why":"ACh is cleared mainly by the enzyme, and here the enzyme is barely working.","_n":"2ief6","_k":"f723c74b"},{"t":"Enzyme inhibitor","why":"Acetylcholinesterase is at 5%, so ACh isn’t broken down and stays in the cleft.","_n":"2jec6","_k":"2d8809c2"},{"t":"Release blocker","why":"ACh was released: it’s at 90 AU.","_n":"2ked6","_k":"6b0c861f"},{"t":"Ca²⁺ channel blocker","why":"ACh was released, so Ca²⁺ entered.","_n":"2lf26","_k":"e8991d7b"}]},{"id":"d6","goal":5,"prompt":"\u003cspan class=\"tag\">★\u003c/span> After an action potential, Ca²⁺ in the terminal stays low and no vesicles fuse.","options":[{"t":"Agonist","why":"That acts on receptors, after release.","_n":"2mf36","_k":"fed7182f"},{"t":"Antagonist","why":"That acts on receptors, after release.","_n":"2nf06","_k":"88ebc0db"},{"t":"Reuptake inhibitor","why":"That acts after release.","_n":"2of16","_k":"41ef9e8f"},{"t":"Enzyme inhibitor","why":"That acts after release.","_n":"2pf66","_k":"487aca63"},{"t":"Release blocker","why":"Look at Ca²⁺: it never rose.","_n":"2qf76","_k":"b880df6f"},{"t":"Ca²⁺ channel blocker","why":"The action potential arrived but Ca²⁺ never entered, so the trigger for release is missing.","_n":"2r51d","_k":"bcba2cc2"}],"hints":["Which step comes first in the terminal?","Ca²⁺ must enter before vesicles fuse.","Ca²⁺ never rose: the channels are blocked."]},{"id":"d7","goal":5,"prompt":"\u003cspan class=\"tag\">★\u003c/span> \u003cspan class=\"tag\">Investigation\u003c/span> Drug Q stops muscle contraction. Is it an antagonist or a release blocker? Which \u003cstrong>single\u003c/strong> measurement tells you?","options":[{"t":"Body temperature","why":"Neither drug changes temperature in a way that tells them apart.","_n":"2s52d","_k":"a587dfbb"},{"t":"Muscle strength","why":"Both drugs stop contraction, so muscle strength can’t tell them apart.","_n":"2t4fd","_k":"bb3f1b17"},{"t":"Heart rate","why":"That doesn’t show which step at the junction is blocked.","_n":"2u50d","_k":"673fd2eb"},{"t":"ACh level in the cleft","why":"With an antagonist ACh is present; with a release blocker it’s absent.","_n":"2v4dd","_k":"21fcc8f4"}]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Cora","goal":[1,4,5],"how":"","instruction":"Cora made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Explain how a signal crosses a synapse.","steps":["An action potential reaches the axon terminal.","Na⁺ entering the terminal makes the vesicles fuse.","Neurotransmitter diffuses across the cleft.","It binds receptors on the next cell, opening ion channels."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is correct.","Step 4 is correct."],"fixes":[{"t":"The electrical impulse jumps the cleft directly.","why":"The cleft is crossed by a \u003cstrong>chemical\u003c/strong>: neurotransmitter diffusing to receptors.","_n":"2w4ed","_k":"9459cfd7"},{"t":"Step 2 is correct.","why":"Na⁺ drives the action potential; Ca²⁺ triggers release.","_n":"2x4bd","_k":"c1dfd93f"},{"t":"Voltage-gated Ca²⁺ channels open, and Ca²⁺ entering makes the vesicles fuse.","why":"\u003cstrong>Ca²⁺\u003c/strong> entering the terminal triggers the vesicles to fuse.","_n":"2y4cd","_k":"fcc01314"},{"t":"K⁺ leaving the terminal makes the vesicles fuse.","why":"K⁺ is part of repolarization.","_n":"2z49d","_k":"1eab4c4e"}],"hints":["Which ion triggers exocytosis here?","It’s a 2+ ion.","Ca²⁺."]},{"id":"e2","goal":4,"task":"E1 fires twice, 6 ms apart (EPSP +10 mV, fading to 0 over 10 ms). Does the neuron fire?","steps":["Rest is −70 mV and threshold is −55 mV, so I need +15 mV.","The first EPSP is still +10 mV when the second arrives.","So the total is +20 mV, giving −50 mV.","The neuron fires."],"_a":"AA==","stepFb":["Step 1 is correct.","","Step 3 follows from step 2. The mistake is earlier.","Check the earlier steps."],"fixes":[{"t":"Step 2 is correct.","why":"EPSPs fade with time.","_n":"304ad","_k":"ad6aa8db"},{"t":"After 6 ms the first EPSP has faded to +4 mV, so the total is +14 mV: −56 mV, and it doesn’t fire.","why":"An EPSP fades over about 10 ms; add what’s \u003cstrong>left\u003c/strong> when the next one arrives.","_n":"3137d","_k":"5198635a"},{"t":"EPSPs can’t add together.","why":"They do: that’s temporal summation.","_n":"3236d","_k":"62649b93"},{"t":"The first EPSP has faded to 0, so the total is +10 mV.","why":"It fades over 10 ms, not 6.","_n":"3339d","_k":"b1ffa095"}],"hints":["How much of an EPSP is left after 6 of its 10 ms?","10 × (1 − 6/10) = 4 mV.","4 + 10 = 14 \u003c 15: no spike."]},{"id":"e3","goal":5,"task":"Explain how an SSRI affects serotonin signalling.","steps":["Serotonin is released into the cleft and binds receptors.","Normally, transporters pull serotonin back into the terminal.","An SSRI destroys serotonin faster, so less reaches the receptors.","So the serotonin signal changes."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is vague but true."],"fixes":[{"t":"Step 3 is correct.","why":"Blocking reuptake keeps serotonin around; it doesn’t destroy it.","_n":"3438d","_k":"c1a5045f"},{"t":"An SSRI blocks serotonin receptors.","why":"That would be an antagonist.","_n":"353bd","_k":"b979d0e4"},{"t":"An SSRI blocks the reuptake transporters, so serotonin stays in the cleft longer and keeps acting on receptors.","why":"Blocking reuptake \u003cstrong>keeps\u003c/strong> the transmitter in the cleft.","_n":"363ad","_k":"6fc977f3"},{"t":"An SSRI makes more vesicles fuse.","why":"It acts after release.","_n":"373dd","_k":"b87cfcfc"}],"hints":["What does ‘reuptake inhibitor’ mean?","It inhibits the pulling back.","Serotonin stays longer."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: the spasm from the enzyme inhibitor, or how close the summation sums came to threshold?"},{"id":"j2","q":"In your own words, why does a synapse turn an electrical signal into a chemical one and back?"},{"id":"j3","q":"Explain to a friend how you’d tell an antagonist from a release blocker using one measurement."},{"id":"j4","q":"Medicines that act at synapses help many people but can have side effects. What would you want to know before deciding a medicine’s benefits outweigh its risks?"}]},"final":{"intro":"Model: rest −70 mV, threshold −55 mV (the neuron fires at −55 mV or above).","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What directly triggers vesicles to release neurotransmitter?","options":[{"t":"The transmitter binding receptors","why":"Binding happens after release.","_n":"383cd","_k":"c6518f00"},{"t":"K⁺ leaving the terminal","why":"That’s repolarization.","_n":"393fd","_k":"65f7df24"},{"t":"Ca²⁺ entering the axon terminal","why":"\u003cstrong>Ca²⁺\u003c/strong> entering the terminal triggers the vesicles to fuse.","_n":"3a3ed","_k":"50a66abc"},{"t":"Na⁺ entering the axon terminal","why":"\u003cstrong>Ca²⁺\u003c/strong> entering the terminal triggers the vesicles to fuse.","_n":"3bc5c","_k":"6d71092d"}]},"b":{"prompt":"Which enzyme breaks down acetylcholine in the cleft?","options":[{"t":"Acetylcholinesterase","why":"It ends each signal by breaking ACh down.","_n":"3cc6c","_k":"e6e93330"},{"t":"ATP synthase","why":"That makes ATP.","_n":"3dc7c","_k":"12ce2a0d"},{"t":"Amylase","why":"That digests starch.","_n":"3ec8c","_k":"4b07589f"},{"t":"Helicase","why":"That unwinds DNA.","_n":"3fc9c","_k":"14778ce5"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which ion movement causes an IPSP at a GABA synapse?","options":[{"t":"Ca²⁺ entering the cell","why":"Ca²⁺ triggers release in the terminal.","_n":"3gcac","_k":"611a4f24"},{"t":"Na⁺ entering the cell","why":"That causes an EPSP.","_n":"3hcbc","_k":"c39971dc"},{"t":"Cl⁻ entering the cell","why":"Negative charge in makes the inside more negative, away from threshold.","_n":"3iccc","_k":"fcec0cbf"},{"t":"Cl⁻ leaving the cell","why":"Cl⁻ entering makes the inside more negative.","_n":"3jbdc","_k":"6258091f"}]},"b":{"prompt":"An EPSP moves the membrane…","options":[{"t":"away from threshold, by letting Cl⁻ in","why":"That’s an IPSP.","_n":"3kbec","_k":"ab086a4b"},{"t":"to exactly −70 mV","why":"That’s rest.","_n":"3l4bd","_k":"cd7fbb44"},{"t":"toward threshold, by letting positive ions such as Na⁺ in","why":"Positive charge in makes the inside less negative.","_n":"3m4ad","_k":"a0fe0981"},{"t":"all the way to +35 mV every time","why":"That’s an action potential.","_n":"3n49d","_k":"c629fab5"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Why does transmission at a chemical synapse go only one way?","options":[{"t":"The cleft has a one-way valve","why":"There’s no valve.","_n":"3o48d","_k":"f22afb5d"},{"t":"Vesicles are only in the axon terminal and receptors only on the receiving cell","why":"Transmitter is released on one side and detected only on the other.","_n":"3p4fd","_k":"9f9731df"},{"t":"The transmitter is too heavy to diffuse back","why":"It diffuses freely; there are just no receptors behind it.","_n":"3q4ed","_k":"2e8e4446"},{"t":"Ca²⁺ only moves one way","why":"That’s not what decides direction.","_n":"3r4dd","_k":"e3ed0394"}]},"b":{"prompt":"What is temporal summation?","options":[{"t":"A single EPSP reaching +35 mV","why":"A single EPSP is small (+10 mV in the model). Several must add up to reach −55 mV.","_n":"3s4cd","_k":"999e7632"},{"t":"Repeated EPSPs from one input arriving close together and adding up","why":"The second arrives before the first has faded.","_n":"3t43d","_k":"7f9f158a"},{"t":"EPSPs from several inputs at the same moment adding up","why":"That’s spatial summation.","_n":"3u42d","_k":"4614ac5d"},{"t":"An EPSP that lasts forever","why":"EPSPs fade.","_n":"3vc9d","_k":"836be198"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Three excitatory inputs of +8 mV each and one inhibitory input of −6 mV arrive at the same moment. Does the neuron fire?","options":[{"t":"Yes, but only because one input alone reaches threshold","why":"One input gives only −62.","_n":"3wcad","_k":"1c4a2819"},{"t":"No: inhibition cancels everything","why":"−6 doesn’t cancel +24.","_n":"3xc7d","_k":"9e63b234"},{"t":"No: −70 + 24 = −46, minus 6 is −52, which is below threshold","why":"−52 is \u003cstrong>above\u003c/strong> −55.","_n":"3yc8d","_k":"2dba0602"},{"t":"Yes: −70 + 24 − 6 = −52 mV, which is above threshold","why":"−52 mV is at or above −55 mV, so it fires.","_n":"3zcdd","_k":"17f7a426"}]},"b":{"prompt":"Two excitatory inputs of +8 mV each and one inhibitory input of −4 mV arrive at the same moment. Does the neuron fire?","options":[{"t":"Yes: any two inputs fire a neuron","why":"A single EPSP is small (+10 mV in the model). Several must add up to reach −55 mV.","_n":"40ced","_k":"ccab0f77"},{"t":"No: inhibitory input always wins","why":"It depends on the totals.","_n":"41cbd","_k":"90b9e9b1"},{"t":"No: −70 + 16 − 4 = −58 mV, which is below threshold","why":"The net is +12 mV, short of the +15 needed.","_n":"42ccd","_k":"fbec2d04"},{"t":"Yes: 8 + 8 = 16, which beats 15","why":"Don’t forget the −4: the net is +12.","_n":"43c1d","_k":"bed8271c"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A drug inhibits acetylcholinesterase at a neuromuscular junction. What happens?","options":[{"t":"ACh stays in the cleft, so the muscle stays contracted","why":"Less breakdown means ACh stays longer: the signal is \u003cstrong>stronger and longer\u003c/strong>.","_n":"44c2d","_k":"97e61f3f"},{"t":"The muscle can’t contract, because ACh is destroyed","why":"Less breakdown means ACh stays longer: the signal is \u003cstrong>stronger and longer\u003c/strong>.","_n":"45cfe","_k":"1ad49f96"},{"t":"The muscle contracts normally","why":"Breakdown is slowed, so the signal lasts.","_n":"46cee","_k":"4220bfd2"},{"t":"No ACh is released","why":"Release isn’t affected.","_n":"47d1e","_k":"4bf5a7ca"}]},"b":{"prompt":"A toxin blocks the voltage-gated Ca²⁺ channels in the axon terminal. What happens?","options":[{"t":"Transmitter stays in the cleft longer","why":"None is released.","_n":"48d0e","_k":"379c2040"},{"t":"Transmitter is released continuously","why":"Ca²⁺ is needed for release.","_n":"49cbe","_k":"3b454206"},{"t":"No transmitter is released, so the next cell isn’t stimulated","why":"\u003cstrong>Ca²⁺\u003c/strong> entering the terminal triggers the vesicles to fuse.","_n":"4acae","_k":"b6490eaa"},{"t":"Receptors are blocked","why":"Receptors are fine; nothing reaches them.","_n":"4bcde","_k":"0e9d551b"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A medicine blocks the transporters that take dopamine back into the terminal. What happens to dopamine signalling?","options":[{"t":"Dopamine receptors are blocked","why":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","_n":"4ccce","_k":"8c4de049"},{"t":"Dopamine stays in the cleft longer, so its signal is stronger or longer","why":"Blocking reuptake \u003cstrong>keeps\u003c/strong> the transmitter in the cleft.","_n":"4dc7e","_k":"9c6fb339"},{"t":"Dopamine is destroyed faster","why":"Blocking reuptake \u003cstrong>keeps\u003c/strong> the transmitter in the cleft.","_n":"4ec6e","_k":"c4123436"},{"t":"No dopamine is released","why":"Release isn’t affected.","_n":"4fbdd","_k":"ed0db0b7"}]},"b":{"prompt":"A toxin prevents vesicles from fusing with the terminal membrane. What happens at a neuromuscular junction?","options":[{"t":"The receptors are activated directly","why":"That’s an agonist.","_n":"4gbed","_k":"1fc2e2a3"},{"t":"The muscle stays contracted","why":"That’s what an enzyme inhibitor does.","_n":"4hbfd","_k":"088278bb"},{"t":"No ACh is released, so the muscle relaxes and can’t contract","why":"No release, no signal.","_n":"4ic0d","_k":"dcf1e2d8"},{"t":"ACh builds up in the cleft","why":"It never gets out of the vesicles.","_n":"4jb9d","_k":"1d21418e"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best description of how a signal crosses a synapse?","options":[{"t":"“The action potential jumps across the cleft to the next cell.”","why":"The cleft is crossed by a \u003cstrong>chemical\u003c/strong>: neurotransmitter diffusing to receptors.","_n":"4kbad","_k":"1ab57953"},{"t":"“The transmitter travels along the axon to the next neuron.”","why":"It’s released at the terminal and crosses the cleft.","_n":"4lbbd","_k":"dad9061b"},{"t":"“The action potential opens Ca²⁺ channels in the terminal; Ca²⁺ makes vesicles release transmitter, which diffuses across the cleft and binds receptors that open ion channels in the next cell.”","why":"The cleft is crossed by a \u003cstrong>chemical\u003c/strong>: neurotransmitter diffusing to receptors.","_n":"4mbcd","_k":"91729e54"},{"t":"“Na⁺ ions carry the impulse across the cleft.”","why":"Ions don’t carry the signal across; the transmitter does.","_n":"4nc5d","_k":"5753d56d"}]},"b":{"prompt":"Which is the best explanation of why two EPSPs from one input sometimes fire a neuron and sometimes don’t?","options":[{"t":"“The second EPSP is always bigger.”","why":"Each is the same size.","_n":"4oc6d","_k":"b3fa3607"},{"t":"“EPSPs only add when they come from different neurons.”","why":"Repeated EPSPs from one input add too: temporal summation.","_n":"4pc3d","_k":"b4dcec51"},{"t":"“Each EPSP fades over time. If the second arrives soon enough, enough of the first remains for the total to reach threshold.”","why":"An EPSP fades over about 10 ms; add what’s \u003cstrong>left\u003c/strong> when the next one arrives.","_n":"4qc2d","_k":"b0b6298e"},{"t":"“Neurons fire randomly.”","why":"The model is deterministic: it’s arithmetic.","_n":"4rc1d","_k":"924bac45"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which statement uses the terms correctly?","options":[{"t":"“An agonist stops transmitter release.”","why":"That’s a release blocker.","_n":"4sc0d","_k":"4b968efd"},{"t":"“An agonist binds a receptor and activates it; an antagonist binds but blocks it.”","why":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","_n":"4tbfd","_k":"cf3e13d4"},{"t":"“An agonist blocks a receptor; an antagonist activates it.”","why":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","_n":"4ubed","_k":"56f60cc9"},{"t":"“An antagonist destroys the transmitter.”","why":"That’s an enzyme’s job.","_n":"4vbdd","_k":"460afa87"}]},"b":{"prompt":"Which statement uses the terms correctly?","options":[{"t":"“A reuptake inhibitor breaks down the transmitter.”","why":"Blocking reuptake \u003cstrong>keeps\u003c/strong> the transmitter in the cleft.","_n":"4wbcd","_k":"51e72e85"},{"t":"“A reuptake inhibitor keeps transmitter in the cleft by blocking the transporters that remove it.”","why":"Blocking reuptake \u003cstrong>keeps\u003c/strong> the transmitter in the cleft.","_n":"4xcbd","_k":"e68b03eb"},{"t":"“A reuptake inhibitor stops Ca²⁺ entering.”","why":"That’s a Ca²⁺ channel blocker.","_n":"4ycad","_k":"92d93da2"},{"t":"“A reuptake inhibitor blocks the receptors.”","why":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","_n":"4z41c","_k":"c3fe2e65"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"During surgery, a curare-like medicine is used to relax muscles. How does it work?","options":[{"t":"It speeds up ACh breakdown","why":"It acts on the receptors.","_n":"5042c","_k":"b47aea33"},{"t":"It blocks ACh receptors on muscle, so ACh can’t trigger contraction","why":"It’s an antagonist: it fits the receptor but blocks it.","_n":"513fc","_k":"6af8af98"},{"t":"It activates ACh receptors","why":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","_n":"5240c","_k":"de3cc28b"},{"t":"It stops the brain from sending signals","why":"Signals still reach the junction.","_n":"533dc","_k":"73a32007"}]},"b":{"prompt":"Nicotine binds to one type of ACh receptor and opens its channel. What kind of drug is it at that receptor?","options":[{"t":"An agonist","why":"It fits and activates the receptor.","_n":"543ec","_k":"fe6b9c9e"},{"t":"An enzyme inhibitor","why":"It doesn’t affect acetylcholinesterase.","_n":"553bc","_k":"59fa188b"},{"t":"A reuptake inhibitor","why":"It acts on the receptor.","_n":"563cc","_k":"c7e8a171"},{"t":"An antagonist","why":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","_n":"5749c","_k":"37da2cbf"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Some insecticides inhibit acetylcholinesterase in insects. Why does this kill them?","options":[{"t":"ACh can’t be made at all","why":"It’s made; it just isn’t cleared.","_n":"584ac","_k":"4651b3ec"},{"t":"Their nerves stop releasing ACh","why":"Release continues.","_n":"5947c","_k":"3da3203f"},{"t":"Their receptors are blocked","why":"Agonist: fits \u003cstrong>and\u003c/strong> activates. Antagonist: fits but \u003cstrong>blocks\u003c/strong>.","_n":"5a46c","_k":"d0d0b67e"},{"t":"ACh builds up, so their nerves and muscles are overstimulated and can’t function normally","why":"Less breakdown means ACh stays longer: the signal is \u003cstrong>stronger and longer\u003c/strong>.","_n":"5b49c","_k":"26685c6d"}]},"b":{"prompt":"Some medicines for Alzheimer disease, where ACh signalling is weak, inhibit acetylcholinesterase. What’s the intended effect?","options":[{"t":"ACh lasts longer at synapses, boosting the weak signal","why":"Less breakdown means ACh stays longer: the signal is \u003cstrong>stronger and longer\u003c/strong>.","_n":"5c48c","_k":"3537a33d"},{"t":"Vesicles stop releasing ACh","why":"That would weaken the signal further.","_n":"5d4bc","_k":"7838391f"},{"t":"More ACh receptors are blocked","why":"They want more signalling, not less.","_n":"5e4ac","_k":"e7f8c0c9"},{"t":"ACh is broken down faster","why":"Less breakdown means ACh stays longer: the signal is \u003cstrong>stronger and longer\u003c/strong>.","_n":"5f4dc","_k":"3fd884ab"}]}}]},"task":{"title":"Every input counts","summary":"Every input counts","statement":"\u003cp>A neuron receives several excitatory inputs (+10 mV each) and several inhibitory inputs (−5 mV each), all arriving at the same moment. Choose how many of each fire so every condition is met. Can you find all the answers?\u003c/p>\u003col class=\"sy-tlist\">\u003cli>The neuron fires (the hillock reaches −55 mV or higher).\u003c/li>\u003cli>At least one inhibitory input is active.\u003c/li>\u003cli>Every excitatory input is needed: silence any one of them and the neuron no longer fires.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">\u003cspan class=\"bio-model\">Model\u003c/span> Rest −70 mV, threshold −55 mV. All inputs arrive together, so their potentials simply add (spatial summation).\u003c/p>","checks":["Fires","Inhibition present","Every excitatory input counts"],"tips":["You need a net +15 mV above rest.","Add at least one inhibitory input.","If removing one excitatory input still leaves +15 mV or more, you have one to spare."],"explainPrompt":"Explain how inhibitory inputs change the number of excitatory inputs a neuron needs, using your design’s numbers.","vocab":"Use the words EPSP, IPSP, threshold and spatial summation.","more":"There’s more than one answer. Can you find another?","after3":"In each answer the net is between +15 and +24 mV, and removing one +10 drops it below +15. That’s a neuron poised right at its threshold."},"cards":[["Synaptic cleft","The narrow gap between a neuron’s axon terminal and the next cell."],["Ca²⁺ at the terminal","An arriving action potential opens Ca²⁺ channels; Ca²⁺ entry makes vesicles release transmitter."],["Acetylcholine (ACh)","The transmitter at the neuromuscular junction (and many other synapses)."],["Acetylcholinesterase","The enzyme that breaks down ACh in the cleft, ending the signal."],["EPSP","Excitatory postsynaptic potential: positive ions (Na⁺) enter, moving the membrane toward threshold."],["IPSP","Inhibitory postsynaptic potential: Cl⁻ enters (e.g. at GABA synapses), moving the membrane away from threshold."],["Spatial summation","EPSPs and IPSPs from \u003cstrong>different\u003c/strong> inputs at the same time add up."],["Temporal summation","Repeated potentials from \u003cstrong>one\u003c/strong> input, close in time, add up."],["Agonist","Binds the receptor \u003cstrong>and\u003c/strong> activates it (e.g. nicotine at an ACh receptor)."],["Antagonist","Binds the receptor and \u003cstrong>blocks\u003c/strong> it (e.g. curare)."],["Reuptake inhibitor","Blocks transporters, so transmitter stays in the cleft longer (e.g. SSRIs)."],["One-way transmission","Vesicles are only presynaptic; receptors are only postsynaptic."]]}};</script>
