.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 04 Overview of Photosynthesis: factory stations, atom tracker, limiting-factor graphs, greenhouse task. Tokens only. */
/* radio groups (copied from SBI4U 03) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* hero equation: light energy above the arrow */
.fz-heq{display:inline-block;font-size:.78em;line-height:1.25;padding-top:.7em}
.fz-harr{position:relative;display:inline-block;margin:0 .2em}
.fz-harr small{position:absolute;left:50%;bottom:78%;transform:translateX(-50%);font:700 max(.36em,10px) var(--font-ui);letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}
.fz-hero{max-width:520px;margin:0 auto}

/* S2 station scene */
.fz-svg{display:block;width:100%;height:auto;overflow:visible}
.fz-st{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.fz-title{font:700 12.5px var(--font-ui);fill:var(--ink)}
.fz-sub{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.fz-lab{font:700 10.5px var(--font-ui);fill:var(--ink)}
.fz-thy{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:1.4}
.fz-thyl{fill:var(--leaf)}
.fz-ring{fill:none;stroke:var(--bio-carbon);stroke-width:3}
.fz-spoke{stroke:var(--bio-carbon);stroke-width:1.2;opacity:.55}
.fz-cdot{fill:var(--bio-carbon)}
.fz-hub{fill:var(--bio-carbon)}
.fz-belt{stroke:var(--rule);stroke-width:22;stroke-linecap:round}
.fz-belt-d{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 9;fill:none}
.fz-belt-h{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fz-guide{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:3 4;opacity:.7}
.fz-guide.fz-head{stroke-dasharray:none}
.fz-photon{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fz-tt{font:700 9.5px var(--font-ui);fill:var(--sheet)}
.fz-tt-o2{fill:var(--bio-o2)}
.fz-bub{fill:var(--sheet);stroke:var(--bio-o2);stroke-width:2}
.fz-glu{fill:var(--bio-carbon);stroke:var(--sheet);stroke-width:1}
.fz-mw{fill:var(--bio-o2)}
.fz-mo{fill:var(--sheet);stroke:var(--bio-o2);stroke-width:2}
.fz-mc{fill:var(--bio-carbon)}
.fz-halo{fill:none;stroke:var(--hi);stroke-width:3.5}
.fz-tag{fill:var(--hi)}
.fz-tagt{font:700 10px var(--font-ui);fill:var(--hi-ink)}
.fz-svg:not(.fz-trk) .fz-trkonly{display:none}
.fz-svg.fz-trk .fz-flab{display:none}

/* Explore panel */
.fz-pg .pg-graph{position:relative}
.fz-eq{font:400 clamp(1.02rem,2.6vw,1.3rem)/1.45 var(--font-math);margin:0 0 6px;min-height:1.5em}
.fz-eq .bio-chem{white-space:normal}
.fz-eqk{font:700 .82rem var(--font-ui);color:var(--ink-2)}
.fz-eqn{display:block;font-family:var(--font-ui)}
mark.fz-mk{background:var(--hi-soft);color:inherit;outline:2px solid var(--hi);border-radius:3px;padding:0 .12em .22em}
.fz-stage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:6px}
.fz-cap{font-size:.92rem;margin:8px 0 0;min-height:2.6em}
.fz-row{margin:0 0 12px}
.fz-panel{margin-top:4px}
.fz-sl{margin-bottom:10px}
.fz-play{margin-top:4px}
.fz-log{margin:12px 0}
.fz-h{font-size:.9rem;margin:0 0 4px}
.fz-log ol{margin:0 0 8px;padding-left:1.4em;font-size:.9rem}
.fz-log li{margin:2px 0}
.fz-log li.fz-none{list-style:none;margin-left:-1.4em}
.fz-note{margin-top:10px}
.fz-bars{display:grid;gap:4px;margin-top:2px}
.fz-b{display:grid;grid-template-columns:3.6em minmax(0,1fr) 2em;align-items:center;gap:8px;font-size:.88rem}
.fz-bn{font-weight:700}
.fz-bt{height:10px;border-radius:5px;background:var(--plot-grid);border:1px solid var(--rule);overflow:hidden}
.fz-bt i{display:block;height:100%}
.fz-bv{text-align:right;font-variant-numeric:tabular-nums}
.read > div.fz-hot{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi) inset;border-radius:4px;padding-left:6px;padding-right:6px}
.fz-unit{font-weight:700}
.fz-pair{display:grid;gap:4px}
.fz-chrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}
.fz-chs{margin:0}
.fz-chs .chip[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* Part 3: limiting-factor graphs */
.lf-g h3{margin-top:0}
.lf-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 26px;align-items:start}
.lf-row > *{min-width:0}
.lf-hits{position:absolute;inset:0;pointer-events:none}
.lf-hit{position:absolute;pointer-events:auto;background:transparent;border:1.5px dashed var(--ink-2);border-radius:8px;opacity:.55;padding:0;min-width:24px;min-height:24px;cursor:pointer}
.lf-hit.pt{border-radius:50%}
.lf-hit:hover,.lf-hit:focus-visible{opacity:1;background:var(--hi-soft);outline:2px solid var(--ink);outline-offset:1px}
.lf-hit.on{opacity:1;border:2px solid var(--ink);background:var(--hi-soft)}
.lf-hit:disabled{cursor:default;opacity:.25}
.lf-hit.on:disabled{opacity:.9}
.lf-leg{margin-top:6px}
.lf-task{margin:0 0 12px}
.lf-tp{margin:0 0 4px}
.lf-tp .tag{margin-right:6px}
.lf-xt{width:100%;min-height:3.2em;font:inherit;padding:8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink)}
.lf-tbl{border-collapse:collapse;font-size:.9rem;margin-top:8px}
.lf-tbl th,.lf-tbl td{border:1px solid var(--rule);padding:4px 10px;text-align:right}
.lf-tbl thead th{text-align:center}
.lf-zstage{margin:8px 0 4px;max-width:420px}
.lf-zcap{font-size:.92rem;margin:6px 0}
.lf-zbg{fill:var(--paper);stroke:var(--rule)}
.lf-enz{fill:var(--leaf-fill);stroke:var(--ink-2);stroke-width:2}

/* Task: greenhouse */
.gh-conds{margin:.4em 0 .8em}
.gh-in{display:grid;gap:10px;margin:10px 0 14px}
.gh-pic{border:1.5px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.gh-sky{fill:var(--sheet)}
.gh-glass{fill:var(--info-bg);stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round}
.gh-ground{stroke:var(--ink);stroke-width:2}
.gh-wire{stroke:var(--ink-2);stroke-width:1.5}
.gh-lamp{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.gh-lamp.on{fill:var(--ink)}
.gh-tank{fill:var(--sheet);stroke:var(--bio-carbon);stroke-width:2}
.gh-tankf{fill:var(--bio-carbon)}
.gh-heat{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.gh-wave{fill:none;stroke:var(--ink);stroke-width:1.4}
.gh-therm{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.gh-bulb{fill:var(--ink-2);stroke:var(--ink);stroke-width:1.5}
.gh-tfill{fill:var(--ink-2)}
.gh-stem{stroke:var(--leaf);stroke-width:2.6;stroke-linecap:round}
.gh-leaf{fill:var(--leaf);stroke:var(--leaf-edge)}
.gh-g{margin:8px 0}
.gh-gl{display:block;font-size:.9rem}
.gh-gt{position:relative;display:block;height:12px;border-radius:6px;background:var(--plot-grid);border:1px solid var(--rule);margin-top:3px}
.gh-gt i{display:block;height:100%;border-radius:6px}
.gh-gt b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.gh-mk{margin-top:2px}

@media (max-width:820px){
  .lf-row{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .fz-stage{padding:2px}
}

</style>
</head>

:"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"14bcf616","content":{"id":"04-overview-of-photosynthesis","kind":"topic","title":"Overview of photosynthesis","topic":"Overview of Photosynthesis","readyTopic":"the overview of photosynthesis","hero":{"eq":"\u003cspan class=\"fz-heq\">\u003cspan class=\"bio-chem\">6CO₂ + 6H₂O\u003c/span> \u003cspan class=\"fz-harr\">\u003csmall>light energy\u003c/small>\u003cspan>→\u003c/span>\u003c/span> \u003cspan class=\"bio-chem\">C₆H₁₂O₆ + 6O₂\u003c/span>\u003c/span>","eqLabel":"6 CO₂ plus 6 H₂O, powered by light energy, gives C₆H₁₂O₆ plus 6 O₂","eqSize":"sm","headline":"Two factories, one shared battery","text":"The \u003cstrong>light reactions\u003c/strong> turn light into chemical energy, charging up \u003cstrong>ATP\u003c/strong> and \u003cstrong>NADPH\u003c/strong> and releasing O₂ from water. The \u003cstrong>Calvin cycle\u003c/strong> spends that energy to build sugar from CO₂, then sends the empty carriers back. Neither stage can keep going without the other.","fig":{"html":"\u003cdiv class=\"fz-hero\" id=\"fz-hero\" role=\"img\" aria-label=\"Two stations joined by two conveyors. Left: Light reactions in the thylakoids. Light hits a stack of thylakoids, water molecules are split and O₂ bubbles drift away. Orange ATP and teal NADPH tokens roll along the top conveyor into the right station, the Calvin cycle in the stroma, where CO₂ joins a turning wheel and a small sugar block pops out. Grey ADP + Pᵢ and NADP⁺ tokens roll back along the lower conveyor to the light reactions.\">\u003c/div>"}},"goals":["I can write the overall equation for photosynthesis and name its two stages and where they happen.","I can describe the inputs and outputs of the light reactions and the Calvin cycle, and explain how each stage depends on the other.","I can use tracer evidence to show that the O₂ comes from water and the carbon in sugar comes from CO₂.","I can describe photosynthesis as an energy conversion, using the laws of thermodynamics.","I can identify the limiting factor from a graph and predict the effect of changing light, CO₂ or temperature."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Chloroplast parts","goal":1,"prompt":"Where in the chloroplast is light absorbed?","options":[{"t":"In the outer membrane","why":"The envelope has no photosystems.","_n":"0e32","_k":"e4c71886"},{"t":"In the stroma","why":"The stroma holds enzymes, not chlorophyll.","_n":"1e42","_k":"8919bb64"},{"t":"In the thylakoid membranes","why":"Photosystems sit there (module 03).","_n":"2e52","_k":"87b81899"},{"t":"In the stoma","why":"A stoma is a leaf pore.","_n":"3de1","_k":"5006f449"}],"hints":["Where are the photosystems?","In the stacked sacs.","Thylakoid membranes."]},{"id":"w2","skill":"Chloroplast parts","goal":1,"prompt":"Where in the chloroplast is CO₂ turned into sugar?","options":[{"t":"In the stroma","why":"The enzymes, including rubisco, are there.","_n":"4df1","_k":"dc03e19a"},{"t":"In the outer membrane","why":"The envelope just encloses everything.","_n":"5e02","_k":"3f6782dc"},{"t":"In the thylakoid membranes","why":"The membranes capture light.","_n":"6e12","_k":"80910fae"},{"t":"In the thylakoid lumen","why":"The lumen is inside the thylakoids, where H⁺ collects.","_n":"7ea2","_k":"ce8198df"}],"hints":["Sugar-making enzymes are dissolved in a fluid.","Which fluid surrounds the thylakoids?","The stroma."]},{"id":"w3","skill":"Equations and isotopes","goal":1,"prompt":"In \u003cspan class=\"bio-chem\">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂\u003c/span>, how many oxygen atoms are on each side?","options":[{"t":"9","why":"Multiply by the coefficients.","_n":"8eb2","_k":"3197d8cb"},{"t":"12","why":"Count the O in both CO₂ and H₂O.","_n":"98a6","_k":"2a4ebebe"},{"t":"18","why":"Left: 12 + 6. Right: 6 + 12.","_n":"a896","_k":"bd535101"},{"t":"24","why":"That double-counts the water.","_n":"b886","_k":"9d925974"}],"hints":["Each CO₂ has 2 O; each H₂O has 1.","Left: 6 × 2 + 6 × 1.","18 on each side."]},{"id":"w4","skill":"Equations and isotopes","goal":3,"prompt":"¹⁸O and ¹⁶O are isotopes of oxygen. This means they…","options":[{"t":"are the same element with different numbers of neutrons","why":"So ¹⁸O behaves the same chemically but can be detected by its mass.","_n":"c876","_k":"9169caad"},{"t":"are different elements","why":"Both are oxygen.","_n":"d866","_k":"ec225b7c"},{"t":"have different numbers of electrons","why":"That would make them ions.","_n":"e856","_k":"519be0d6"},{"t":"have different numbers of protons","why":"Then they’d be different elements.","_n":"f846","_k":"b58af65c"}],"hints":["What defines an element?","Its number of protons.","Isotopes differ only in neutrons."]},{"id":"w5","skill":"Energy and graphs","goal":5,"prompt":"A graph of rate vs light intensity rises, then levels off. In the flat part, more light will…","options":[{"t":"have no effect on the rate","why":"Something else is now limiting.","_n":"g836","_k":"17ceca9d"},{"t":"lower the rate","why":"Flat, not falling.","_n":"h826","_k":"b8288024"},{"t":"raise the rate a little","why":"Flat means no change.","_n":"i816","_k":"82d41bbe"},{"t":"double the rate","why":"That’s only true on the rising part, if at all.","_n":"j706","_k":"c3ab3c29"}],"hints":["What does a flat line mean?","No change in rate.","No effect."]},{"id":"w6","skill":"Energy and graphs","goal":4,"prompt":"Energy can’t be created or destroyed, only converted. Which describes photosynthesis?","options":[{"t":"Light energy is converted to chemical energy in sugar, with some lost as heat","why":"Light goes in; it ends up as chemical energy in sugar, plus heat.","_n":"k716","_k":"9515a34e"},{"t":"Sugar is converted to light energy","why":"Sugar is made, not used up.","_n":"l6e6","_k":"c4824831"},{"t":"Chemical energy is converted to light","why":"That’s the reverse.","_n":"m6f6","_k":"7c346df7"},{"t":"Energy is created from water and CO₂","why":"Energy is never created.","_n":"n746","_k":"aa3df6f1"}],"hints":["What energy goes in?","Light.","It ends up as chemical energy in sugar, plus heat."]}],"refreshers":{"Chloroplast parts":"Light is captured in the thylakoid membranes; sugar is built in the stroma around them.","Equations and isotopes":"Count atoms on each side using the coefficients. Isotopes such as ¹⁸O are the same element with extra neutrons, so they can trace atoms through a reaction.","Energy and graphs":"Energy is converted, never created. On a rate graph, a flat part means the factor on the horizontal axis is no longer limiting."}}},"explore":{"heading":"Two-stage factory","intro":"Run the chloroplast’s two stages as linked stations. Change the light, the CO₂ and the water, and watch what piles up and what runs out. Then label atoms to see where they go.","modelNote":"Numbers are model values (Blackman’s limiting-factor model). Play runs 1 model minute in 4 seconds.","labels":[{"id":"w18","t":"¹⁸O in water","log":"¹⁸O in water: every O₂ labelled; the glucose and the new water unlabelled","last":"¹⁸O water → O₂ labelled"},{"id":"c18","t":"¹⁸O in CO₂","log":"¹⁸O in CO₂: the glucose and the new water labelled; the O₂ never labelled","last":"¹⁸O CO₂ → glucose and new water labelled, O₂ not"},{"id":"c14","t":"¹⁴C in CO₂","log":"¹⁴C in CO₂: the sugar labelled","last":"¹⁴C CO₂ → sugar labelled"}],"conclusions":[{"id":"water","t":"The O₂ comes from water"},{"id":"co2","t":"The O₂ comes from CO₂"},{"id":"both","t":"The O₂ comes from both"}],"predIntro":"Make a prediction first. Then the factory will show you what really happens.","predictions":[{"id":"p1","prompt":"The factory runs at light 100% and CO₂ 100%. Then the light goes to 0. What will the Calvin cycle do over the next minute?","options":[{"t":"Start making O₂","_n":"o756","_k":"64845799"},{"t":"Keep going all night","_n":"p726","_k":"9c454a15"},{"t":"Keep going briefly, then stop when the ATP and NADPH run out","_n":"q736","_k":"c1f6eaaa"},{"t":"Speed up, because it’s the ‘dark reactions’","_n":"r786","_k":"266d8379"}],"explain":"The Calvin cycle doesn’t need light directly, but it needs the light reactions’ products.","start":{"mode":"factory","light":100,"co2":100,"water":true},"to":{"light":0}},{"id":"p2","prompt":"Atom tracker: the water is labelled with ¹⁸O. Where will the ¹⁸O end up?","options":[{"t":"In the glucose","_n":"s796","_k":"ea9de461"},{"t":"In the ATP","_n":"t766","_k":"ef7b3445"},{"t":"In the CO₂","_n":"u756","_k":"29a1271f"},{"t":"In the O₂","_n":"v786","_k":"5df0a112"}],"explain":"Splitting water releases its oxygen as O₂.","start":{"mode":"tracker","label":"w18"}},{"id":"p3","prompt":"The factory runs at full. Then the CO₂ supply goes to 0. What happens to O₂ release over the next minute?","options":[{"t":"It stays the same, because the light reactions don’t use CO₂","_n":"w776","_k":"0bde4593"},{"t":"It stops immediately","_n":"x726","_k":"e58294bd"},{"t":"It rises","_n":"y716","_k":"b5b807f7"},{"t":"It falls to zero","_n":"z746","_k":"47c8b2da"}],"explain":"With nothing spending ATP and NADPH, there’s no NADP⁺ left to take electrons, so the light reactions stall.","start":{"mode":"factory","light":100,"co2":100,"water":true},"to":{"co2":0}},{"id":"p4","prompt":"Light 100%, CO₂ 30%. What sets the rate now?","options":[{"t":"Neither: it’s at maximum","_n":"10736","_k":"f8837e8b"},{"t":"Light","_n":"117e6","_k":"33347578"},{"t":"Both equally","_n":"127d6","_k":"3d03ce2e"},{"t":"CO₂","_n":"136c5","_k":"d91ec1f9"}],"explain":"The factor in shortest supply sets the pace.","start":{"mode":"factory","light":100,"co2":100,"water":true},"to":{"co2":30}}],"challenges":[{"id":"tc1","goal":[2,5],"prompt":"With the light at 100%, make the factory produce exactly 0.5 glucose per minute.","why":"With the light at 100%, CO₂ at 50% is in shortest supply, so the rate is half the maximum: 0.5 glucose per minute.","hints":["0.5 glucose per minute is half the maximum rate.","With light at 100%, something else must be at half.","CO₂ at 50%."]},{"id":"tc2","goal":[2,5],"prompt":"Release 3 O₂ per minute using the \u003cstrong>least\u003c/strong> light possible.","why":"Light at 50% sets the rate at half the maximum, 3 O₂ per minute, as long as CO₂ doesn’t drop below it.","hints":["3 O₂ per minute is half of the maximum 6.","Light must be at least 50%, and CO₂ must not drop below it.","Light 50%, CO₂ 50% or more."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Use the atom tracker to \u003cstrong>prove\u003c/strong> that the O₂ comes from water and not from CO₂. Run the experiments you need, then choose the conclusion.","why":"Only the water run labels the O₂, and the CO₂ run never does.","general":"Run the experiments you need in Atom tracker mode, then choose the conclusion under the results log.","hints":["You need to label each possible source in turn.","Label water’s oxygen in one run and CO₂’s oxygen in another.","Only the water run labels the O₂."]}]},"part3":{"slug":"limiting","name":"Limiting factors","heading":"Limiting factors","intro":"The factory showed Blackman’s idea with sliders. Here it is as data graphs, with temperature added. For each graph, read the curves, then tap the part the task asks about.","graphs":[{"id":"g1","title":"Graph 1: rate vs light intensity at two CO₂ levels","legend":"Solid: high CO₂ (0.12%). Dashed: low CO₂ (0.04%). Rate = the smaller of 0.06 × light % and the CO₂ ceiling (3 at low CO₂, 6 at high CO₂), in model O₂ units per minute.","regions":[{"id":"rise","name":"the shared rising part (both curves, light 0–50%)"},{"id":"loFlat","name":"the flat part of the low-CO₂ curve (light above 50%)"},{"id":"hiRise","name":"the high-CO₂ curve above 50% light"}],"tasks":[{"id":"g1a","prompt":"Tap where \u003cstrong>light\u003c/strong> is limiting.","_a":"ahYQChVTExoTXAsxD0VUFGw=","fb":{"rise":"Both curves rise together here: more light raises the rate, so light is limiting.","hiRise":"The high-CO₂ curve is still rising here, so light is limiting. Light also limits both curves on the shared rising part, 0–50%.","loFlat":"The low-CO₂ curve is flat there: more light does nothing, so light isn’t the limit."}},{"id":"g1b","prompt":"Tap where \u003cstrong>CO₂\u003c/strong> is limiting.","_a":"ahYODCBaUEITaQ==","fb":{"loFlat":"The low-CO₂ curve is flat above 50%: more light does nothing, but more CO₂ lifts the curve.","rise":"Both curves are the same there: light is limiting, so the extra CO₂ makes no difference.","hiRise":"That curve is still rising with light, so light is limiting there."}}],"explain":{"id":"g1x","prompt":"Explain why the high-CO₂ curve keeps rising to 100%.","model":"More CO₂ lifts the ceiling, so light stays limiting longer."},"table":{"head":["Light (%)","Rate, low CO₂","Rate, high CO₂"],"rows":[["0","0","0"],["25","1.5","1.5"],["50","3","3"],["75","3","4.5"],["100","3","6"]]}},{"id":"g2","title":"Graph 2: rate vs CO₂ concentration in dim and bright light","legend":"Solid: bright light (100%). Dashed: dim light (25%). Rate = the smaller of 75 × CO₂ % and the light ceiling (1.5 in dim light, 6 in bright light).","regions":[{"id":"rise","name":"the shared rising part (both curves, CO₂ 0–0.02%)"},{"id":"dimFlat","name":"the flat part of the dim-light curve"},{"id":"brightRise","name":"the rising part of the bright-light curve (CO₂ 0.02–0.08%)"},{"id":"brightFlat","name":"the flat part of the bright-light curve"}],"tasks":[{"id":"g2a","prompt":"Tap the part of the \u003cstrong>dim-light\u003c/strong> curve where extra CO₂ can’t help.","_a":"ahYGCgtwXVdFFj8=","fb":{"dimFlat":"The dim-light curve flattens early: in dim light, extra CO₂ can’t help; light is the limit.","rise":"There, more CO₂ still raises the rate: CO₂ is limiting.","brightRise":"That’s the bright-light curve, and it’s still rising with CO₂.","brightFlat":"That’s the bright-light curve. Find the dim-light one (dashed)."}}],"table":{"head":["CO₂ (%)","Rate, dim light","Rate, bright light"],"rows":[["0","0","0"],["0.02","1.5","1.5"],["0.04","1.5","3"],["0.08","1.5","6"],["0.12","1.5","6"]]}},{"id":"g3","title":"Graph 3: rate vs temperature (bright light, high CO₂)","legend":"Model points for a temperate (C3) plant, in model O₂ units per minute.","points":[[5,1],[15,3],[25,5],[30,5.5],[35,4.5],[45,1]],"tasks":[{"id":"g3a","prompt":"Tap the \u003cstrong>optimum\u003c/strong>.","_a":"ahYWUFYUbA==","fb":{"t30":"The rate peaks at 30 °C: that’s the optimum temperature.","t25":"The rate is still rising at 25 °C: the peak comes later.","t35":"The rate has already started to fall at 35 °C.","t5":"That’s the lowest rate. Find the highest point.","t15":"The rate is still rising there. Find the highest point.","t45":"That’s where the rate has fallen. Find the highest point."}}],"table":{"head":["Temperature (°C)","Rate"],"rows":[["5","1.0"],["15","3.0"],["25","5.0"],["30","5.5"],["35","4.5"],["45","1.0"]]},"zoom":{"title":"Zoom to the molecules","intro":"A Calvin-cycle enzyme (rubisco) at work. Choose a temperature.","cool":"Warmer molecules move faster and reach the enzyme’s active 1ff05","_k":"4cc91188"}]},{"id":"q4","goal":5,"prompt":"Blackman’s rule in one line:","choices":[{"t":"Light always limits","fb":"Raise the limiting factor, not the others.","_n":"1gef5","_k":"824e6a82"},{"t":"Temperature always limits","fb":"Raise the limiting factor, not the others.","_n":"1hf65","_k":"d236e3e0"},{"t":"All factors add together","fb":"Raise the limiting factor, not the others.","_n":"1if55","_k":"0a2ab962"},{"t":"The rate is set by the factor in shortest supply","fb":"Raise the limiting factor, not the others.","_n":"1jf45","_k":"b7655893"}]}]}},"practice":{"activities":[{"id":"stage","type":"sorter","title":"Which stage?","summary":"Which stage?","goal":[1,2],"noun":"card","txt":true,"instruction":"Sort each process or molecule by the stage it belongs to.","boxes":[{"id":"b1","label":"Light reactions only"},{"id":"b2","label":"Calvin cycle only"},{"id":"b3","label":"Both","sub":"made in one stage, used in the other"}],"items":[{"id":"i1","t":"H₂O is split","_a":"E1ZTQQ==","why":"Water is split in the light reactions, on the thylakoid membranes."},{"id":"i2","t":"O₂ is released","_a":"E1ZTQQ==","why":"O₂ comes from splitting water in the light reactions.","wrong":{"b2":"O₂ comes from splitting water in the light reactions."}},{"id":"i3","t":"Light is absorbed","_a":"E1ZTQQ==","why":"Photosystems in the thylakoid membranes absorb the light."},{"id":"i4","t":"Chlorophyll","_a":"E1ZTQQ==","why":"Chlorophyll sits in the photosystems of the thylakoid membranes."},{"id":"i5","t":"CO₂ is fixed","_a":"E1ZQQQ==","why":"Rubisco fixes CO₂ in the stroma, in the Calvin cycle."},{"id":"i6","t":"Rubisco","_a":"E1ZQQQ==","why":"Rubisco is the Calvin cycle’s CO₂-fixing enzyme, in the stroma."},{"id":"i7","t":"G3P (sugar) is built","_a":"E1ZQQQ==","why":"The Calvin cycle spends ATP and NADPH to build G3P."},{"id":"i8","t":"ATP","_a":"E1ZRQQ==","why":"ATP is made in the light reactions and spent in the Calvin cycle.","wrong":{"b1":"ATP is made in the light reactions te is 40% of the maximum."]},{"id":"f3","kind":"pair","goal":2,"star":true,"prompt":"A plant releases 18 O₂ molecules. How many glucose molecules can it make, and how many water molecules were split?","labels":["Glucose molecules","Water molecules split"],"_a":"agdOUFBr","display":"3 glucose; 36 water","why":"18 ÷ 6 = 3 glucose, and 3 × 12 = 36 water molecules split.","wrongB":[{"match":18,"fb":"12 water molecules are split per glucose (6 O₂), so 3 × 12 = 36."}],"general":"Use the full equation: 6 O₂ are released and 12 water molecules are split for each glucose.","hints":["6 O₂ per glucose.","18 ÷ 6 = 3 glucose.","Each glucose needs 12 water split: 36."]},{"id":"f4","kind":"sel","goal":3,"star":true,"prompt":"CO₂ labelled with ¹⁸O is supplied. Select \u003cstrong>all\u003c/strong> the molecules that will carry the label.","options":[{"t":"glucose","why":"","_n":"1kf35","_k":"a4792671"},{"t":"water made by the Calvin cycle","why":"","_n":"1lfa5","_k":"cc77f840"},{"t":"O₂","why":"O₂’s oxygen comes only from the split water.","_n":"1mf95","_k":"db299e52"},{"t":"ATP","why":"ATP isn’t built from CO₂’s atoms.","_n":"1nf86","_k":"90d5d349"}],"why":"CO₂’s oxygen ends up in the glucose and in the new water. O₂’s oxygen comes only from the split water.","hints":["Where does each atom in CO₂ go in the Calvin cycle?","CO₂’s oxygen ends up in the sugar and in the new water the Calvin cycle makes.","Glucose and the water made by the Calvin cycle; never the O₂."]},{"id":"f5","kind":"mc","goal":5,"star":true,"prompt":"Ontario greenhouse growers often raise CO₂ to two or three times the outdoor level. On a dull winter day this barely helps. Why?","options":[{"t":"CO₂ is harmful in winter","why":"Raise the factor that’s actually limiting.","_n":"1of96","_k":"b791ebbd"},{"t":"The Calvin cycle stops in winter","why":"Raise the factor that’s actually limiting.","_n":"1pf66","_k":"cecc1a19"},{"t":"Plants can’t absorb CO₂ in cold air","why":"Raise the factor that’s actually limiting.","_n":"1qf76","_k":"21e193d5"},{"t":"Light is the limiting factor on dull days","why":"Raise the factor that’s actually limiting.","_n":"1rf46","_k":"411b4f26"}],"hints":["What limits the rate on a dull day?","Light is in short supply, so more CO₂ can’t help.","Light is the limiting factor on dull days."]},{"id":"f6","kind":"numch","goal":4,"star":true,"prompt":"Making 1 mol of glucose stores about 2870 kJ. A leaf absorbed about 9570 kJ of light to make it. What percentage of the absorbed energy was stored, and where did the rest go?","label":"Percentage stored:","unit":"%","_a":"AgQ=","tol":1,"display":"about 30% stored; the rest was lost as heat","chipLabel":"The rest of the energy was…","options":[{"t":"converted to heat","why":"","_n":"1sf56","_k":"bd9b7292"},{"t":"destroyed","why":"Not destroyed: converted to heat.","_n":"1tf26","_k":"5f0b37a9"}],"why":"2870 ÷ 9570 ≈ 0.30, so about 30% was stored. The rest became heat (second law).","wrong":[{"match":70,"fb":"That’s the share lost."}],"general":"Stored ÷ absorbed × 100.","hints":["Stored ÷ absorbed × 100.","2870 ÷ 9570 ≈ 0.30.","About 30% stored; the rest became heat (second law)."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Aurora","how":"","instruction":"Aurora made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Explain where the O₂ from photosynthesis comes from.","steps":["The overall equation is \u003cspan class=\"bio-chem\">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂\u003c/span>.","CO₂ is split, so its oxygen is released as O₂ and its carbon goes into glucose.","Water provides hydrogen for the glucose.","So all the O₂ comes from CO₂."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is correct, but the mistake is earlier.","Step 4 follows step 2."],"fixes":[{"t":"Water is split in the light reactions; its oxygen is released as O₂, and CO₂’s carbon goes into glucose.","why":"¹⁸O-labelled CO₂ never labels the O₂.","_n":"1uf36","_k":"0cf3834a"},{"t":"Glucose is split to release O₂.","why":"¹⁸O-labelled CO₂ never labels the O₂.","_n":"1v006","_k":"1c03a9cf"},{"t":"O₂ comes half from water, half from CO₂.","why":"¹⁸O-labelled CO₂ never labels the O₂.","_n":"1w016","_k":"977c4db7"},{"t":"Step 2 is correct.","why":"¹⁸O-labelled CO₂ never labels the O₂.","_n":"1xfe6","_k":"8bcf91f6"}],"hints":["What did the ¹⁸O experiments show?","Labelled water gave labelled O₂.","Water is split."]},{"id":"e2","goal":2,"task":"Explain what happens to the Calvin cycle at night.","steps":["The Calvin cycle doesn’t absorb light itself.","It uses ATP and NADPH made by the light reactions.","At night the light reactions stop.","So the Calvin cycle keeps running all night: that’s why it’s called the dark reactions."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"So the Calvin cycle speeds up at night.","why":"Without new ATP and NADPH it can’t continue.","_n":"1yfd6","_k":"0ec1e692"},{"t":"So the Calvin cycle switches to using O₂.","why":"Without new ATP and NADPH it can’t continue.","_n":"1z006","_k":"8ec8dac3"},{"t":"Step 4 is correct.","why":"Without new ATP and NADPH it can’t continue.","_n":"20ff6","_k":"526185ac"},{"t":"So the Calvin cycle stops once its stocks of ATP and NADPH run out.","why":"Without new ATP and NADPH it can’t continue.","_n":"21026","_k":"ac8a909c"}],"hints":["Steps 2 and 3 together: what runs out?","ATP and NADPH.","It stops."]},{"id":"e3","goal":5,"task":"Interpret a graph of rate vs light that levels off at high light.","steps":["At low light, the rate rises steadily as light increases.","So at low light, light is the limiting factor.","At high light the curve is flat, so light is no longer limiting.","So adding even more light will still raise the rate slightly."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"So the plant is dying at high light.","why":"Flat means no change.","_n":"22016","_k":"ffab2707"},{"t":"Step 4 is correct.","why":"Flat means no change.","_n":"23046","_k":"551ce9cb"},{"t":"So adding more light won’t change the rate; raise the limiting factor (such as CO₂) instead.","why":"Flat means no change.","_n":"24036","_k":"e55c8670"},{"t":"So light is still the main limit.","why":"Flat means no change.","_n":"25f66","_k":"dcb66509"}],"hints":["What does a flat line mean?","More light, same rate.","Find and raise the real limit."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the factory: how fast the Calvin cycle stopped in the dark, or how cutting CO₂ stopped the O₂?"},{"id":"j2","q":"In your own words, why do the two stages need each other?"},{"id":"j3","q":"Explain to a friend how the ¹⁸O experiments show where the O₂ comes from."},{"id":"j4","q":"Which idea about limiting factors are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which equation summarizes photosynthesis?","options":[{"t":"\u003cspan class=\"bio-chem\">6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂\u003c/span>","why":"CO₂ and water go in; glucose and O₂ come out, powered by light.","_n":"26f56","_k":"cb85bd82"},{"t":"\u003cspan class=\"bio-chem\">C₆H₁₂O₆ + 6H₂O → 6CO₂ + 6O₂\u003c/span>","why":"Glucose is made, not used.","_n":"27747","_k":"3fe46151"},{"t":"\u003cspan class=\"bio-chem\">6CO₂ + 6O₂ → C₆H₁₂O₆ + 6H₂O\u003c/span>","why":"O₂ is a product, not a reactant.","_n":"28757","_k":"2062c6cf"},{"t":"\u003cspan class=\"bio-chem\">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O\u003c/span>","why":"That’s cellular respiration.","_n":"29767","_k":"ba332671"}]},"b":{"prompt":"Which pair correctly matches each stage to its location?","options":[{"t":"Light reactions: stroma; Calvin cycle: thylakoid membranes","why":"Reversed.","_n":"2a777","_k":"ae118c98"},{"t":"Light reactions: thylakoid membranes; Calvin cycle: stroma","why":"Light is captured in the thylakoid membranes; sugar is built in the stroma around them.","_n":"2b707","_k":"2a68e13b"},{"t":"Both stages: stroma","why":"The light reactions need the membrane-bound photosystems.","_n":"2c717","_k":"a373f4f0"},{"t":"Light reactions: stomata; Calvin cycle: stroma","why":"Stomata are leaf pores.","_n":"2d727","_k":"a0de5a28"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which two products of the light reactions does the Calvin cycle use?","options":[{"t":"ATP and NADPH","why":"The Calvin cycle spends ATP and NADPH to turn CO₂ into sugar.","_n":"2e737","_k":"f0045e53"},{"t":"CO₂ and water","why":"CO₂ comes from the air; water is used by the light reactions.","_n":"2f7c7","_k":"ded15653"},{"t":"ADP and NADP⁺","why":"Those go the other way, back to be recharged.","_n":"2g7d7","_k":"17099c51"},{"t":"O₂ and glucose","why":"O₂ is released; glucose is the Calvin cycle’s product.","_n":"2h7a7","_k":"cfa6ed73"}]},"b":{"prompt":"Which molecules does the Calvin cycle send back to the light reactions?","options":[{"t":"ATP and NADPH","why":"Those come \u003cstrong>from\u003c/strong> the light reactions.","_n":"2i797","_k":"748eb762"},{"t":"Glucose and CO₂","why":"Glucose is exported; CO₂ is used up.","_n":"2j787","_k":"1e4927a8"},{"t":"O₂ and water","why":"O₂ leaves the leaf.","_n":"2k777","_k":"ec0431e2"},{"t":"ADP (with Pᵢ) and NADP⁺","why":"The empty carriers go back to the light reactions to be recharged.","_n":"2l767","_k":"d7b4cf37"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"On a graph of rate vs light intensity, the curve rises, then levels off. What limits the rate in the flat part?","options":[{"t":"Water, always","why":"Water could be one possibility, not always.","_n":"2m757","_k":"fe9220b2"},{"t":"Nothing: the plant has reached its absolute maximum","why":"Raising CO₂ usually lifts the plateau.","_n":"2n747","_k":"89057fc0"},{"t":"Some other factor, such as CO₂ concentration or temperature","why":"Light no longer limits the rate there, so something else does.","_n":"2o737","_k":"b2e36065"},{"t":"Light intensity","why":"More light no longer helps there.","_n":"2p827","_k":"cf433d85"}]},"b":{"prompt":"On a graph of rate vs CO₂ concentration, what limits the rate in the steep, rising part?","options":[{"t":"Temperature","why":"Temperature isn’t changing along this graph; more CO₂ raises the rate, so CO₂ is limiting.","_n":"2q817","_k":"93021053"},{"t":"CO₂ concentration","why":"In the rising part, more CO₂ raises the rate, so CO₂ is limiting.","_n":"2r40f","_k":"c8d301b1"},{"t":"Light intensity","why":"In the rising part, more CO₂ raises the rate, so CO₂ is limiting.","_n":"2s3ff","_k":"7ed5ef74"},{"t":"Chlorophyll","why":"Chlorophyll isn’t on this graph.","_n":"2t42f","_k":"0d81222a"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"In one experiment the water contained ¹⁸O; in another, the CO₂ did. Labelled O₂ appeared only in the first. What does this show?","options":[{"t":"The O₂ comes from CO₂.","why":"¹⁸O in the water labels the O₂; ¹⁸O in the CO₂ doesn’t. The O₂ comes from splitting water.","_n":"2u41f","_k":"1a14ac38"},{"t":"The O₂ comes equally from water and CO₂.","why":"The CO₂ run gave no labelled O₂.","_n":"2v3cf","_k":"6a1dcb6c"},{"t":"The O₂ comes from glucose.","why":"Glucose is a product.","_n":"2w3bf","_k":"c4bdc034"},{"t":"The O₂ released comes from water.","why":"¹⁸O in the water labels the O₂; ¹⁸O in the CO₂ doesn’t.","_n":"2x3ef","_k":"2f56c1a3"}]},"b":{"prompt":"CO₂ labelled with ¹⁴C is supplied to a plant in light. Where will the ¹⁴C end up?","options":[{"t":"In the water released","why":"Water contains no carbon.","_n":"2y3df","_k":"6fa69840"},{"t":"In the O₂ released","why":"O₂ contains no carbon.","_n":"2z38f","_k":"77a8c56f"},{"t":"In the ATP","why":"ATP isn’t built from CO₂’s carbon.","_n":"3037f","_k":"68f05dbd"},{"t":"In sugars made in the stroma","why":"The carbon in sugar comes from CO₂, fixed in the stroma by the Calvin cycle.","_n":"313af","_k":"6a9be1a9"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"A plant in bright light suddenly has its CO₂ supply cut off. What happens to its O₂ release over the next few minutes, and why?","options":[{"t":"It rises, because the light reactions no longer have to share energy.","why":"The stages depend on each other.","_n":"323bf","_k":"d400237a"},{"t":"It stays the same, because the light reactions don’t use CO₂.","why":"The light reactions make ATP and NADPH, and they need NADP⁺ and ADP back from the Calvin cycle.","_n":"3338f","_k":"e8330ddd"},{"t":"It stops instantly, because CO₂ is split to make O₂.","why":"¹⁸O in the water labels the O₂; ¹⁸O in the CO₂ doesn’t. The O₂ comes from splitting water.","_n":"3439f","_k":"7648ba67"},{"t":"It falls, because unused ATP and NADPH pile up and the light reactions run out of NADP⁺ and ADP.","why":"With nothing spending ATP and NADPH, there’s no NADP⁺ left to take electrons, so the light reactions stall.","_n":"353ef","_k":"15e7f8c9"}]},"b":{"prompt":"A plant’s light is switched off. What happens to its CO₂ uptake over the next few minutes, and why?","options":[{"t":"It stops instantly, because CO₂ can’t enter in the dark.","why":"Stomata aren’t the issue; the cycle runs out of fuel.","_n":"363ff","_k":"677f6512"},{"t":"It stays the same, because the Calvin cycle doesn’t need light.","why":"The Calvin cycle needs ATP and NADPH from the light reactions, so it stops soon after the light goes out.","_n":"373cf","_k":"1418584e"},{"t":"It rises, because the Calvin cycle is the dark reaction.","why":"The Calvin cycle needs ATP and NADPH from the light reactions, so it stops soon after the light goes out.","_n":"383df","_k":"c09a294a"},{"t":"It falls to zero once the Calvin cycle uses up its stored ATP and NADPH.","why":"The Calvin cycle runs on its stock of ATP and NADPH briefly, then stops.","_n":"3932f","_k":"f57440a6"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"At 20 °C, raising CO₂ from 0.04% to 0.1% doubles a crop’s rate in bright light but has no effect in dim light. Which explanation fits?","options":[{"t":"CO₂ is harmful in dim light.","why":"There’s no evidence of harm, just no gain.","_n":"3a33f","_k":"f3db8d34"},{"t":"Temperature is limiting in dim light.","why":"Temperature is the same in both.","_n":"3b34f","_k":"a29ffd04"},{"t":"In dim light, light is the limiting factor, so extra CO₂ can’t help.","why":"Only the factor in shortest supply limits the rate.","_n":"3c33f","_k":"2f9e823d"},{"t":"CO₂ only works at night.","why":"The Calvin cycle needs ATP and NADPH from the light reactions, so it stops soon after the light goes out.","_n":"3d32f","_k":"dd8eaec0"}]},"b":{"prompt":"At 30 °C in bright light, adding more light has no effect, but adding CO₂ raises the rate. What was limiting?","options":[{"t":"Temperature","why":"Changing CO₂ alone helped.","_n":"3e31f","_k":"78d2d98a"},{"t":"CO₂ concentration","why":"Adding CO₂ raised the rate, so CO₂ was in shortest supply.","_n":"3f30f","_k":"65722b8f"},{"t":"Light intensity","why":"More light did nothing.","_n":"3g2ff","_k":"135ff230"},{"t":"Chlorophyll","why":"Raising CO₂ wouldn’t help if chlorophyll were the limit.","_n":"3h2ef","_k":"77b879f8"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which statement best describes photosynthesis in terms of energy?","options":[{"t":"“Photosynthesis turns matter into energy.”","why":"Matter and energy are both conserved here.","_n":"3i2df","_k":"1c4a1c34"},{"t":"“Photosynthesis converts chemical energy into light.”","why":"That’s backwards.","_n":"3j3cf","_k":"583a64cf"},{"t":"“Photosynthesis creates energy from water and CO₂.”","why":"Energy is converted, not created: light energy becomes chemical energy, plus some heat.","_n":"3k3bf","_k":"64c16fff"},{"t":"“Light energy is converted into chemical energy stored in sugar; some is lost as heat, and no energy is created.”","why":"That’s the first law (energy is converted) and the second law (some becomes heat) together.","_n":"3laef","_k":"f587808a"}]},"b":{"prompt":"A leaf stores less energy in sugar than the light energy it absorbs. Which statement best explains why?","options":[{"t":"“The leaf creates new energy later.”","why":"Energy is converted, not created: light energy becomes chemical energy, plus some heat.","_n":"3maff","_k":"d65f5763"},{"t":"“The missing energy is stored as O₂.”","why":"O₂ isn’t an energy store here.","_n":"3nb0f","_k":"412dd937"},{"t":"“The missing energy is destroyed.”","why":"Energy is converted, not created: light energy becomes chemical energy, plus some heat.","_n":"3ob1f","_k":"88090b33"},{"t":"“No energy conversion is 100% efficient: some energy always becomes heat (the second law of thermodynamics).”","why":"The missing energy wasn’t lost from the universe; it became heat.","_n":"3paaf","_k":"eea89fea"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which flow chart best shows how the two stages depend on each other?","options":[{"t":"Light → Calvin cycle → ATP → light reactions → sugar","why":"The order is reversed.","_n":"3qabf","_k":"bf1bbd3b"},{"t":"Light + water → light reactions → ATP and NADPH → Calvin cycle (+ CO₂) → sugar; ADP, Pᵢ and NADP⁺ return to the light reactions","why":"Each stage feeds the other: charged carriers go one way, empty ones come back.","_n":"3racf","_k":"06120d7e"},{"t":"CO₂ → light reactions → O₂; water → Calvin cycle → sugar","why":"¹⁸O in the water labels the O₂; ¹⁸O in the CO₂ doesn’t. The O₂ comes from splitting water.","_n":"3sadf","_k":"a7ef274b"},{"t":"Light reactions → sugar; Calvin cycle → O₂","why":"The light reactions make ATP and NADPH, not sugar, and the O₂ comes from splitting water in the light reactions.","_n":"3tb6f","_k":"bc5cf67b"}]},"b":{"prompt":"Which statement best explains why ‘dark reactions’ is a misleading name for the Calvin cycle?","options":[{"t":"“It makes the light reactions run.”","why":"It recharges nothing; it spends.","_n":"3ub7f","_k":"a53730e7"},{"t":"“It actually absorbs light with rubisco.”","why":"Rubisco is an enzyme, not a pigment.","_n":"3va8f","_k":"a438b382"},{"t":"“It doesn’t absorb light, but it needs ATP and NADPH from the light reactions, so it runs in daylight.”","why":"Not absorbing light isn’t the same as working in the dark.","_n":"3wa7f","_k":"25bf111b"},{"t":"“It only runs at night.”","why":"The Calvin cycle needs ATP and NADPH from the light reactions, so it stops soon after the light goes out.","_n":"3xaaf","_k":"1baa1b15"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"On a sunny February day, a Leamington greenhouse is at 25 °C with outdoor-level CO₂. Which change would raise tomato growth the most?","options":[{"t":"Add more lamps","why":"It’s already sunny.","_n":"3ya9f","_k":"93f6de7c"},{"t":"Heat the greenhouse to 40 °C","why":"Above the optimum, enzymes lose their shape.","_n":"3zacf","_k":"68124b29"},{"t":"Add CO₂","why":"Light and temperature are good, so CO₂ is the likely limit.","_n":"40abf","_k":"509b0b8c"},{"t":"Mist water vapour into the air","why":"Water isn’t likely limiting.","_n":"41aef","_k":"62cca8a5"}]},"b":{"prompt":"On a dull, cloudy February day, the same greenhouse is at 25 °C with extra CO₂. Which change would help most?","options":[{"t":"Add even more CO₂","why":"Only the factor in shortest supply limits the rate. Adding more of something else does nothing.","_n":"42adf","_k":"75f80127"},{"t":"Heat the greenhouse to 40 °C","why":"Enzymes speed up as it warms, up to an optimum; past it they lose their shape and the rate falls.","_n":"43b0f","_k":"706cd03f"},{"t":"Cool the greenhouse to 10 °C","why":"Colder slows the enzymes.","_n":"44aff","_k":"79f3a0ff"},{"t":"Add lamps","why":"Light is the limiting factor.","_n":"45c2e","_k":"144cef4a"}]}},{"id":"a2","cat":"A","goal":1,"a":{"prompt":"A willow tree gains 70 kg over five years, but its soil loses only a few grams. Where did most of the new mass come from?","options":[{"t":"The soil","why":"The soil hardly changed.","_n":"46c3e","_k":"828e88d7"},{"t":"Fertilizer","why":"The soil lost only grams.","_n":"47c0e","_k":"3a01c829"},{"t":"Sunlight","why":"Light carries energy but no mass.","_n":"48c1e","_k":"8bd996af"},{"t":"CO₂ from the air, built into sugars and cellulose, along with water","why":"Most of a plant’s dry mass is carbon, and that carbon came from CO₂ in the air.","_n":"49bee","_k":"ccbf57a2"}]},"b":{"prompt":"A 2 g seed grows into a 2 kg squash plant in a pot of soil. Most of the plant’s dry mass (everything except water) came from…","options":[{"t":"CO₂ from the air","why":"Carbon makes up most of the dry mass, and it’s fixed from CO₂ in the air.","_n":"4abfe","_k":"be7694a1"},{"t":"Water only","why":"Water adds hydrogen and oxygen, but the carbon skeleton comes from CO₂.","_n":"4bbce","_k":"ecaa4d78"},{"t":"The soil","why":"Most of a plant’s dry mass is carbon, and that carbon came from CO₂ in the air.","_n":"4cbde","_k":"cca0fbee"},{"t":"Sunlight","why":"Light carries energy but no mass.","_n":"4dbae","_k":"b3a2411c"}]}}]},"task":{"title":"Tune the greenhouse","summary":"Tune the greenhouse","statement":"\u003cp>Choose the light, CO₂ and temperature for a greenhouse so the plants grow well without wasting money. Can you find all the answers?\u003c/p>\u003col class=\"gh-conds\">\u003cli>Growth of at least 0.5 glucose units per minute.\u003c/li>\u003cli>No resource wasted: light and CO₂ set to the same level.\u003c/li>\u003cli>Running cost of 7 or less.\u003c/li>\u003c/ol>","lights":[25,50,75,100],"co2s":[25,50,75,100],"temps":[15,20,25,30,35],"tfac":{"15":0.5,"20":0.75,"25":1,"30":1,"35":0.5},"heat":{"15":0,"20":1,"25":2,"30":3,"35":4},"modelTitle":"How the model works","model":"\u003cp>\u003cstrong>Growth\u003c/strong> = (the smaller of light and CO₂) ÷ 100 × temperature factor. Temperature factors: 15 °C 0.5, 20 °C 0.75, 25 °C 1.0, 30 °C 1.0, 35 °C 0.5.\u003c/p>\u003cp>\u003cstrong>Cost\u003c/strong> = light ÷ 25 + CO₂ ÷ 25 + heating. Heating: 15 °C 0, 20 °C 1, 25 °C 2, 30 °C 3, 35 °C 4.\u003c/p>","checks":["Enough growth","No
