.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 08 The Calvin Cycle: Calvin wheel (S2), energy ledger (S3), experiment graph, Where the sugar goes stations, sugar-order task. Tokens only. */
/* radio groups (copied from SBI4U 04) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* stepper */
.cc-stp{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.cc-stb{min-width:40px;min-height:40px;border:0;background:var(--sheet);color:var(--ink);font-size:1.2rem;font-weight:700;padding:0}
.cc-stb:disabled{opacity:.4}
.cc-stp output{min-width:2.6em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:0 .4em;line-height:40px}

/* hero equation: brown carbon dots over CO₂ and G3P; ATP orange, NADPH teal */
.hero .hero-eq .cc-heq{font-size:.7em;white-space:normal;line-height:1.75}
.cc-hc{position:relative;display:inline-block}
.cc-hd{position:absolute;left:50%;top:-.3em;transform:translateX(-50%);display:flex;gap:.14em}
.cc-hd b{display:block;width:.24em;height:.24em;border-radius:50%;background:var(--bio-carbon)}
.cc-ha{color:var(--bio-atp);font-weight:700}
.cc-hn{color:var(--bio-nadh);font-weight:700}
.cc-hero{max-width:480px;margin:0 auto}

/* S2 Calvin wheel */
.cc-svg{display:block;width:100%;height:auto;overflow:visible}
.cc-stroma{fill:var(--leaf);fill-opacity:.08;stroke:var(--leaf-edge);stroke-width:1}
.cc-thy{fill:var(--leaf);opacity:.9}
.cc-thyt{font:700 10.5px var(--font-ui);fill:var(--sheet)}
.cc-sub{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.cc-lab{font:700 10.5px var(--font-ui);fill:var(--ink)}
.cc-ph{font:700 12px var(--font-ui);fill:var(--ink)}
.cc-guide{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:3 4;opacity:.8}
.cc-ah{stroke-dasharray:none}
.cc-ring{fill:none;stroke:var(--ink);stroke-width:2.2}
.cc-ringh{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cc-rub{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.cc-rubt{font:700 10px var(--font-ui);fill:var(--ink-2)}
.cc-pool{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.cc-expb{stroke:var(--bio-carbon);stroke-dasharray:5 3}
.cc-pl{font:700 11.5px var(--font-ui);fill:var(--ink)}
.cc-ctr{font:700 11.5px var(--font-ui);fill:var(--ink-2)}
.cc-ctr2{font:700 14px var(--font-ui);fill:var(--ink)}
.cc-mol{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3}
.cc-g3p{fill:var(--bio-carbon);fill-opacity:.22;stroke:var(--bio-carbon);stroke-width:1.8}
.cc-c6{stroke:var(--bio-carbon);stroke-dasharray:3 2}
.cc-c{fill:var(--bio-carbon)}
.cc-tk{font:700 9px var(--font-ui);fill:var(--ink)}
.cc-tt{font:700 9.5px var(--font-ui);fill:var(--sheet)}

/* Explore panel */
.cc-stage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.cc-leg{margin:6px 0 0}
.cc-sw{display:inline-block;width:26px;height:0;border-top:3px solid var(--pen);vertical-align:middle;margin:0 5px 0 0}
.cc-sw2{border-top:3px dashed var(--ink);margin-left:12px}
.cc-cap{font-size:.92rem;margin:8px 0 0;min-height:2.6em}
.cc-row{margin:0 0 12px}
.cc-panel{margin-top:4px}
.cc-moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
.cc-mv{min-height:44px;width:100%}
.cc-stat{min-height:2.7em;font-size:.92rem;margin:4px 0;padding:4px 8px;border-radius:6px}
.cc-stat.bad{background:var(--bad-bg)}
.cc-sup{border:1.5px solid var(--rule);border-radius:8px;padding:6px 10px 8px;margin:4px 0 8px}
.cc-sup legend{font-weight:700;font-size:.88rem;color:var(--ink-2);padding:0 4px}
.cc-sup .numrow{margin:4px 0}
.cc-sup label{display:inline-block;min-width:4.2em;font-weight:700}
.cc-note{margin-top:8px}

/* S3 energy ledger */
.cc-led{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.cc-led summary{cursor:pointer;font-weight:700;font-size:.92rem}
.cc-lsd{font-weight:400;color:var(--ink-2);font-size:.85rem;text-decoration:underline}
.cc-led[open] .cc-lsd{display:none}
.cc-tr{display:grid;grid-template-columns:7em minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.cc-tn{font-weight:700}
.cc-tr.cc-tw{grid-template-columns:minmax(0,1fr) auto}
.cc-s1g{max-width:560px}
.cc-tg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.cc-tal{display:inline-flex;flex-wrap:wrap;gap:2px;min-width:0}
.cc-tal i{display:block;width:7px;height:12px;border-radius:2px;background:var(--c)}
.cc-tal b{font-size:.8rem;margin-left:3px}
.cc-on,.cc-off{font-weight:700;color:var(--ink)}
.cc-lg{margin:8px 0 10px}
.cc-lgh{margin:0 0 4px;font-size:.9rem}
.cc-br{display:grid;grid-template-columns:9em minmax(0,1fr) 2.8em;align-items:center;gap:8px;font-size:.86rem;margin:3px 0}
.cc-bt{position:relative;height:12px;border:1px solid var(--rule);border-radius:6px;background:var(--plot-grid)}
.cc-bt i{display:block;height:100%;border-radius:5px;box-sizing:border-box}
.cc-bt b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.cc-bs{background:var(--c)}
.cc-bu{background:var(--c);opacity:.5}
.cc-bn{border:2px solid var(--c);background:transparent}
.cc-bv{text-align:right;font-variant-numeric:tabular-nums}
.cc-mk{margin:2px 0 0}

/* Part 3: Where the sugar goes */
.cc-tbl{border-collapse:collapse;font-size:.92rem;min-width:380px}
.cc-tcap{margin:6px 0 0}
.cc-tbl th,.cc-tbl td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:right}
.cc-tbl th[scope="row"],.cc-tbl thead th:first-child{text-align:left}
.cc-tbl thead th,.cc-tbl td{white-space:nowrap}
.cc-tbl th[scope="row"]{min-width:9em}
.cc-tbl tr.cc-hit td{background:var(--hi-soft)}
.cc-rowb{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.25em .75em;font-size:.88rem;min-height:32px;text-align:left}
.cc-rowb.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cc-rowb:disabled{opacity:1}
.cc-task{margin:12px 0}
.cc-tp{margin:0 0 6px}
.cc-s2,.cc-s3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.cc-dests{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.cc-dst.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.cc-dst.seen::before{content:"✓ "}
.cc-dinfo p{margin:0 0 6px}
.cc-hl{display:none}
.cc-hl.on{display:inline}
.cc-hls{fill:var(--hi-soft);stroke:var(--hi);stroke-width:3}
.cc-wall{fill:var(--sheet);stroke:var(--leaf-edge);stroke-width:6}
.cc-chl{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:2}
.cc-starch{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.cc-arr{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cc-mito{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.8}
.cc-cris{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.cc-nit{fill:var(--ink-2)}
.cc-phl{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:2}
.cc-dl{font:700 11px var(--font-ui);fill:var(--ink)}
.cc-dq{font:700 12px var(--font-ui);fill:var(--ink-2)}
.cc-zs{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.cc-zbg{fill:var(--leaf);fill-opacity:.08}
.cc-swi{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.cc-swi.on{fill:var(--hi-soft);stroke:var(--hi)}
.cc-swt{font:700 10.5px var(--font-ui);fill:var(--ink)}
.cc-enz{fill:var(--ink-2);fill-opacity:.16;stroke:var(--ink-2);stroke-width:2}
.cc-enz.off{stroke-dasharray:6 4}
.cc-zslow{margin-top:10px}

/* Practice: detective */
.cc-chips{margin:8px 0}
.cc-unit{font-weight:700}

/* Task: Plan a sugar order */
.cc-conds{margin:6px 0 0;padding-left:1.4em}
.cc-tin{display:grid;gap:10px;margin:10px 0}
.cc-th{font-size:.95rem;margin:10px 0 4px}
.cc-batch p{margin:4px 0}
.cc-bsvg{display:block;height:32px;width:auto;max-width:100%}
.cc-hex{fill:var(--bio-carbon);fill-opacity:.25;stroke:var(--bio-carbon);stroke-width:1.6}

@media (max-width:700px){
  .cc-s2,.cc-s3{grid-template-columns:minmax(0,1fr)}
  .cc-tr{grid-template-columns:minmax(0,1fr) auto}
  .cc-tr .cc-tal,.cc-tr .cc-tg{grid-column:1 / -1;grid-row:2}
}

</style>
</head>

"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"85122ef2","content":{"id":"08-the-calvin-cycle","kind":"topic","title":"The Calvin cycle","topic":"The Calvin Cycle","readyTopic":"the Calvin cycle","hero":{"eq":"\u003cspan class=\"cc-heq bio-chem\">3 \u003cspan class=\"cc-hc\">CO₂\u003ci class=\"cc-hd\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003c/i>\u003c/span> + 9 \u003cspan class=\"cc-ha\">ATP\u003c/span> + 6 \u003cspan class=\"cc-hn\">NADPH\u003c/span> → \u003cspan class=\"cc-hc\">G3P\u003ci class=\"cc-hd\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003c/i>\u003c/span> + 9 ADP + 8 Pᵢ + 6 NADP⁺\u003c/span>","eqLabel":"3 CO₂ plus 9 ATP plus 6 NADPH gives 1 G3P plus 9 ADP plus 8 Pᵢ plus 6 NADP⁺","eqSize":"sm","headline":"Three in, one out, and the wheel keeps turning","text":"In the stroma, the enzyme \u003cstrong>rubisco\u003c/strong> grabs CO₂ and attaches it to a 5-carbon sugar, \u003cstrong>RuBP\u003c/strong>. Energy from \u003cstrong>ATP\u003c/strong> and electrons from \u003cstrong>NADPH\u003c/strong> turn the products into \u003cstrong>G3P\u003c/strong>, a 3-carbon sugar. Most of the G3P is recycled to rebuild RuBP, so the wheel keeps turning. One G3P in every six is the plant’s profit.","fig":{"html":"\u003cdiv class=\"cc-hero\" id=\"cc-hero\" role=\"img\" aria-label=\"A wheel in the stroma holds three RuBP, five brown carbon dots each. Three CO₂ drop in and rubisco joins them to the RuBP, making six 3-PGA with three carbon dots each. Six orange ATP and six teal NADPH fly in from the thylakoid on the left and turn the six 3-PGA into six G3P. One G3P rolls out of the wheel to the sugar box. The other five, with three more ATP, are rebuilt into three RuBP. A counter reads 18 carbons in, 18 carbons out of the wheel.\">\u003c/div>"}},"goals":["I can describe what rubisco does in carbon fixation.","I can name the three phases of the Calvin cycle and what happens in each.","I can count the carbon, ATP and NADPH needed to make G3P, glucose and other sugars.","I can predict how the cycle’s molecules change when light or CO₂ is removed.","I can interpret labelling data from experiments on the Calvin cycle.","I can apply the Calvin cycle to plants, crops and other organisms."],"start":{"warmup":{"questions":[{"id":"w1","skill":"The two stages","goal":2,"prompt":"Where in the chloroplast does the Calvin cycle take place?","options":[{"t":"In the mitochondria","why":"Mitochondria run respiration, not the Calvin cycle.","_n":"07b6","_k":"d220af19"},{"t":"In the thylakoid membrane","why":"That’s where the light reactions happen.","_n":"17c6","_k":"051f4a01"},{"t":"In the stroma","why":"Around the thylakoids, where ATP and NADPH are released.","_n":"27d6","_k":"c0f5db4e"},{"t":"In the thylakoid lumen","why":"The lumen is where H⁺ builds up.","_n":"37e6","_k":"661cb509"}],"hints":["Where do ATP and NADPH end up?","In the fluid around the thylakoids.","The stroma."]},{"id":"w2","skill":"The two stages","goal":2,"prompt":"What does the Calvin cycle receive from the light reactions?","options":[{"t":"Light energy directly","why":"The energy arrives packed in ATP and NADPH.","_n":"47f6","_k":"247920e9"},{"t":"CO₂ and water","why":"CO₂ comes from the air through the stomata.","_n":"5806","_k":"b761a40b"},{"t":"O₂ and glucose","why":"O₂ is released to the air; glucose is made \u003cstrong>by\u003c/strong> the Calvin cycle.","_n":"6816","_k":"5eb02051"},{"t":"ATP and NADPH","why":"The light reactions make ATP and NADPH in the stroma; the Calvin cycle spends them.","_n":"7826","_k":"3d4dccd8"}],"hints":["What do the light reactions make that stays inside the chloroplast?","Two energy carriers.","ATP and NADPH."]},{"id":"w3","skill":"Carbohydrates","goal":3,"prompt":"How many carbon atoms are in one glucose molecule, C₆H₁₂O₆?","options":[{"t":"3","why":"That’s a 3-carbon sugar like G3P.","_n":"8836","_k":"5fcbbf4d"},{"t":"6","why":"The subscript after C is 6.","_n":"9bca","_k":"02a68eb8"},{"t":"12","why":"C₆ means 6 carbons.","_n":"abba","_k":"9912f616"},{"t":"24","why":"Count only the C.","_n":"bbaa","_k":"75edb44a"}],"hints":["Look at the subscript after C.","C₆.","6."]},{"id":"w4","skill":"Carbohydrates","goal":6,"prompt":"Which carbohydrate do plants mainly use to \u003cstrong>store\u003c/strong> glucose in their leaves and roots?","options":[{"t":"Cellulose","why":"Cellulose builds cell walls; it isn’t a fuel store.","_n":"cb9a","_k":"fae885ab"},{"t":"Sucrose","why":"Sucrose is the form plants \u003cstrong>ship\u003c/strong> in the phloem.","_n":"dc0a","_k":"f99adb52"},{"t":"Glycogen","why":"Glycogen is the animal and fungal store.","_n":"ebfa","_k":"dab83ef6"},{"t":"Starch","why":"Starch is the plant polymer of glucose for storage: a potato is mostly starch.","_n":"fbea","_k":"ef32cf45"}],"hints":["What is a potato mostly made of?","A plant polymer of glucose for storage.","Starch."]},{"id":"w5","skill":"Counting atoms","goal":3,"prompt":"Three molecules of a 5-carbon sugar each gain one carbon from CO₂. p"},"to":"co2"}],"challenges":[{"id":"tc1","goal":[2,3],"prompt":"Starting from 3 RuBP, export exactly 1 G3P and get back to 3 RuBP, with nothing left over.","why":"3 CO₂ fixed, 9 ATP and 6 NADPH used: 15 of the 18 carbons rebuilt the 3 RuBP, and the other 3 left as one G3P.","general":"Use Turn the wheel, starting from 3 RuBP. End with 3 RuBP, no 3-PGA, no G3P in the wheel and 1 G3P exported.","hints":["Fix 3 CO₂ first.","Reduce all six 3-PGA.","Export 1 G3P, then regenerate with the other 5."]},{"id":"tc2","goal":[2,3],"prompt":"Factory order: enter the CO₂, ATP and NADPH needed for \u003cstrong>1 glucose\u003c/strong>.","why":"Glucose has 6 carbons: 6 CO₂ and 2 G3P, so 6 × 3 = 18 ATP and 6 × 2 = 12 NADPH.","general":"In Factory order, type your three numbers in the supply boxes.","hints":["How many carbons does glucose have?","6 C, so 6 CO₂ and 2 G3P.","6 × 3 = 18 ATP; 6 × 2 = 12 NADPH."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"A cell needs enough G3P to add 10 glucose units to its starch. Counting only the Calvin cycle, enter the CO₂, ATP and NADPH.","why":"10 glucose units hold 60 carbons: 60 CO₂, 60 × 3 = 180 ATP and 60 × 2 = 120 NADPH.","general":"In Factory order, type your three numbers in the supply boxes.","hints":["Carbons in 10 glucose units?","60 C, so 60 CO₂.","60 × 3 = 180 ATP; 60 × 2 = 120 NADPH."]}]},"part3":{"slug":"sugar","name":"Sugar","heading":"Where the sugar goes","intro":"The carbon counter is a model. Here is the evidence that revealed the cycle, radioactive carbon, and where its product goes in the plant.","s1":{"title":"Station 1: Following radioactive carbon","text":"Algae are given CO₂ made with radioactive carbon-14 for a few seconds, then killed, and the labelled compounds are separated.","caption":"Based on experiments by Melvin Calvin, Andrew Benson and James Bassham (1940s–1950s). The numbers below are model data.","head":["Share of the label (%)","2 s","5 s","30 s","90 s"],"rows":[{"id":"pga","t":"3-PGA","v":[85,60,25,10]},{"id":"g3p","t":"G3P and other sugar phosphates","v":[10,25,40,30]},{"id":"suc","t":"Sucrose","v":[0,5,20,40]},{"id":"aa","t":"Amino acids and others","v":[5,10,15,20]}],"tap":{"prompt":"Which compound is the first stable product of fixation? Tap its row.","_a":"GkVWUxA=","good":"3-PGA: it holds most of the label earliest.","bad":"Look at the 2 s column: which compound holds the most label at the earliest time?"},"prompts":[{"id":"s1b","q":"Why does sucrose’s share rise last?","a":"It’s built from G3P after several steps."},{"id":"s1c","q":"Each column adds to 100. Why?","a":"They’re shares of all the label."}],"graphTitle":"Check it with data","graphNote":"The same model data as a graph. Each line is one compound’s share of the label."},"s2":{"title":"Station 2: G3P’s destinations","text":"G3P is first made into glucose and fructose. Tap each destination to reveal where it goes.","dest":[{"id":"suc","t":"Sucrose","d":"Shipped in the phloem, to roots and fruit."},{"id":"sta","t":"Starch","d":"Stored in the chloroplast by day, broken down at night."},{"id":"cel","t":"Cellulose","d":"Builds the cell walls."},{"id":"aa","t":"Amino acids and fats","d":"Made from G3P with nitrogen and more energy."},{"id":"fuel","t":"Fuel","d":"Fuel for the plant’s own mitochondria."}],"done":"G3P is the cell’s raw material: sucrose to travel, starch to store, cellulose to build, and more."},"s3":{"title":"Station 3: Zoom to the molecules: “dark reactions?”","text":"A rubisco close-up. Switch the light on and off and watch the active site.","on":"In the light, the stroma becomes less acidic (about pH 8) and richer in Mg²⁺. These two light switches turn rubisco on: CO₂ enters the active site and joins RuBP.","off":"In the dark, the stroma becomes more acidic and loses Mg²⁺, so rubisco switches off. ATP and NADPH stop arriving too.","slow":"Rubisco is slow, at about 3 CO₂ per second per enzyme, so leaves make huge amounts of it. (The animation is slowed down.)","concl":"So the Calvin m","goal":[3,6],"star":true,"prompt":"In an hour, a leaf makes 1 sucrose and adds 3 glucose units to starch. How many NADPH did its Calvin cycle use?","_a":"DgU=","display":"60 NADPH","unit":"NADPH","why":"Sucrose 12 C + starch 18 C = 30 C = 30 CO₂; 2 NADPH each.","general":"Sucrose 12 C + starch 18 C = 30 C = 30 CO₂; 2 NADPH each.","hints":["Count the carbons first.","12 + 3 × 6 = 30 carbons, so 30 CO₂.","30 × 2 = 60."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Chiara","how":"","instruction":"Chiara made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"How many ATP does the Calvin cycle need to make one glucose?","steps":["Glucose has 6 carbons.","G3P has 3 carbons, so one glucose needs one G3P.","Each G3P costs 9 ATP.","So one glucose needs 9 ATP."],"_a":"CQ==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is a correct fact.","Step 4 follows step 2. Look earlier."],"fixes":[{"t":"Step 2 is correct.","why":"G3P has 3 carbons; glucose has 6. One glucose needs 2 G3P: 6 CO₂.","_n":"2041b","_k":"9709df31"},{"t":"One glucose needs 3 ATP.","why":"That’s per CO₂.","_n":"213cb","_k":"c8da75eb"},{"t":"6 ÷ 3 = 2, so one glucose needs \u003cstrong>two\u003c/strong> G3P: 18 ATP.","why":"G3P has 3 carbons; glucose has 6. One glucose needs 2 G3P: 6 CO₂.","_n":"223bb","_k":"70a97c3a"},{"t":"One glucose needs six G3P: 54 ATP.","why":"That’s one G3P per carbon.","_n":"233eb","_k":"0f909123"}],"hints":["How many 3-carbon pieces make 6 carbons?","Two.","2 × 9 = 18 ATP."]},{"id":"e2","goal":2,"task":"Describe carbon fixation.","steps":["Rubisco joins CO₂ to RuBP.","The 6-carbon product splits into two G3P.","The G3P then leaves the cycle as sugar."],"_a":"CQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. Look earlier."],"fixes":[{"t":"Step 2 is correct.","why":"It splits into two 3-PGA. ATP and NADPH then \u003cstrong>reduce\u003c/strong> 3-PGA to G3P.","_n":"243db","_k":"787118c1"},{"t":"It becomes glucose directly.","why":"Glucose needs two G3P.","_n":"2548b","_k":"ff498d7d"},{"t":"It splits into two 3-PGA; ATP and NADPH then reduce 3-PGA to G3P.","why":"It splits into two 3-PGA. ATP and NADPH then \u003cstrong>reduce\u003c/strong> 3-PGA to G3P.","_n":"2647b","_k":"c9a5c726"},{"t":"It splits into three CO₂.","why":"That would undo the fixation.","_n":"27c6b","_k":"73ad1bc0"}],"hints":["What happens in the reduction phase?","3-PGA becomes G3P.","So fixation makes 3-PGA."]},{"id":"e3","goal":4,"task":"Predict the effect of turning the lights off on 3-PGA.","steps":["With the lights off, the light reactions stop making ATP and NADPH.","So 3-PGA can no longer be reduced to G3P.","So the amount of 3-PGA falls.","And RuBP rises."],"_a":"Cg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows the same reasoning error."],"fixes":[{"t":"Fixation keeps making 3-PGA for a while, but it isn’t used, so 3-PGA \u003cstrong>rises\u003c/strong>; RuBP falls.","why":"Lights off: 3-PGA is still made but no longer used, so it rises; RuBP isn’t rebuilt, so it falls.","_n":"28c7b","_k":"a99942dd"},{"t":"Step 3 is correct.","why":"Lights off: 3-PGA is still made but no longer used, so it rises; RuBP isn’t rebuilt, so it falls.","_n":"29c8b","_k":"f0bf0154"},{"t":"3-PGA turns into RuBP.","why":"That needs G3P and ATP first.","_n":"2ac9b","_k":"1e412a51"},{"t":"3-PGA stays the same.","why":"It’s still being made.","_n":"2bcab","_k":"27881612"}],"hints":["Is 3-PGA still being made?","Yes, while RuBP lasts.","Made but not used: it rises."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the carbon counter: that only one G3P in six leaves, or the lights-off results?"},{"id":"j2","q":"In your own words, explain why most of the G3P has to stay in the cycle."},{"id":"j3","q":"Explain to a friend how to work out the ATP and NADPH needed for any sugar."},{"id":"j4","q":"Which part of the Calvin cycle are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which enzyme fixes CO₂ in the Calvin cycle?","options":[{"t":"NADP⁺ reductase","why":"It makes NADPH at the end of the electron chain.","_n":"2ccbb","_k":"581389c0"},{"t":"Rubisco","why":"Rubisco joins each CO₂ to RuBP.","_n":"2dccb","_k":"e19453bd"},{"t":"Amylase","why":"Amylase breaks down starch.","_n":"2ecdb","_k":"c986b69c"},{"t":"ATP synthase","why":"It makes ATP in the thylakoid membrane.","_n":"2fbeb","_k":"fa8e97f9"}]},"b":{"prompt":"In carbon fixation, rubisco attaches CO₂ to which molecule?","options":[{"t":"G3P","why":"G3P is a product, not the acceptor.","_n":"2gbfb","_k":"da8b0d17"},{"t":"3-PGA","why":"3-PGA is what fixation makes.","_n":"2hccb","_k":"cf1b2b46"},{"t":"RuBP, a 5-carbon sugar","why":"RuBP is the CO₂ acceptor; 5C + 1C = 6C, which splits into two 3-PGA.","_n":"2icbb","_k":"8b4190e9"},{"t":"Glucose","why":"Glucose is far downstream.","_n":"2jcab","_k":"ed44520a"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which shows the Calvin cycle’s phases in order?","options":[{"t":"Fixation → regeneration → reduction","why":"3-PGA must be reduced to G3P before RuBP can be rebuilt.","_n":"2kc9b","_k":"f7c732f7"},{"t":"Reduction → fixation → regeneration","why":"CO₂ must be fixed first.","_n":"2ld0b","_k":"65dc38b8"},{"t":"Photolysis → fixation → reduction","why":"Photolysis belongs to the light reactions.","_n":"2mcfb","_k":"1ee3a46e"},{"t":"Fixation → reduction → regeneration of RuBP","why":"CO₂ is fixed, 3-PGA is reduced to G3P, then G3P rebuilds RuBP.","_n":"2nceb","_k":"efaeb53d"}]},"b":{"prompt":"In which phase is NADPH used?","options":[{"t":"Photolysis","why":"O₂ comes from splitting water in the light reactions. The Calvin cycle uses CO₂, ATP and NADPH.","_n":"2ocdb","_k":"64d00e72"},{"t":"Reduction: turning 3-PGA into G3P","why":"ATP and NADPH reduce each 3-PGA to G3P.","_n":"2pc4b","_k":"964dc57a"},{"t":"Regeneration","why":"Regeneration uses ATP only.","_n":"2qc3b","_k":"96af2c6b"},{"t":"Fixation","why":"Fixation uses only RuBP, CO₂ and rubisco.","_n":"2r3bb","_k":"fc71198d"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"For every 3 CO₂ fixed, what does the cycle export and what does it cost?","options":[{"t":"1 G3P, costing 9 ATP and 6 NADPH","why":"6 G3P are made and 5 rebuild RuBP; 3 ATP and 2 NADPH per CO₂.","_n":"2s3ab","_k":"6b6c5754"},{"t":"1 glucose, costing 18 ATP","why":"G3P has 3 carbons; glucose has 6. One glucose needs 2 G3P: 6 CO₂.","_n":"2t3db","_k":"e9ebff81"},{"t":"3 G3P, costing 3 ATP and 3 NADPH","why":"For every 3 CO₂, 6 G3P are made, but 5 are needed to rebuild RuBP. Only 1 leaves.","_n":"2u3cb","_k":"a042f587"},{"t":"6 G3P, costing 9 ATP and 6 NADPH","why":"Five of the six are recycled.","_n":"2v3fb","_k":"d3fc41ad"}]},"b":{"prompt":"To make one glucose, what does the Calvin cycle need?","options":[{"t":"1 CO₂, 3 ATP and 2 NADPH","why":"That’s per CO₂.","_n":"2w3eb","_k":"17b87007"},{"t":"3 CO₂, 9 ATP and 6 NADPH","why":"G3P has 3 carbons; glucose has 6. One glucose needs 2 G3P: 6 CO₂.","_n":"2x41b","_k":"0c2857a9"},{"t":"6 CO₂, 18 ATP and 12 NADPH","why":"Glucose has 6 carbons: 6 CO₂, then 3 ATP and 2 NADPH per CO₂.","_n":"2y40b","_k":"ce238256"},{"t":"6 CO₂, 12 ATP and 18 NADPH","why":"ATP and NADPH are swapped.","_n":"2z33b","_k":"025700c0"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A leaf is suddenly put in the dark. Over the next minute, what happens to RuBP and 3-PGA, and why?","options":[{"t":"RuBP falls and 3-PGA rises: fixation continues briefly, but without ATP and NADPH, 3-PGA isn’t reduced and RuBP isn’t rebuilt","why":"Lights off: 3-PGA is still made but no longer used, so it rises; RuBP isn’t rebuilt, so it falls.","_n":"3032b","_k":"71b344cf"},{"t":"RuBP rises and 3-PGA falls, because rubisco stops in the dark","why":"Lights off: 3-PGA is still made but no longer used, so it rises; RuBP isn’t rebuilt, so it falls.","_n":"31b5a","_k":"f1cb2b38"},{"t":"Both fall, because the cycle stops at once","why":"Fixation doesn’t need ATP, so it continues briefly.","_n":"32b6a","_k":"ebd1a284"},{"t":"Neither changes, because the Calvin cycle doesn’t need light","why":"It needs ATP and NADPH from the light reactions, and its enzymes are switched on in the light.","_n":"33b3a","_k":"83a964f4"}]},"b":{"prompt":"The CO₂ supply to a lit leaf is cut off. What happens to RuBP and 3-PGA, and why?","options":[{"t":"RuBP rises and 3-PGA falls: RuBP is still rebuilt but not used, and 3-PGA is still reduced but not made","why":"With no CO₂, nothing uses RuBP, but reduction and regeneration keep going.","_n":"34b4a","_k":"e99f73d3"},{"t":"RuBP falls and 3-PGA rises","why":"That’s the lights-off pattern. With no CO₂, RuBP is rebuilt but not used.","_n":"35b1a","_k":"d0f888e0"},{"t":"Both fall","why":"RuBP is still being rebuilt.","_n":"36b2a","_k":"ece1a9e4"},{"t":"Both rise","why":"3-PGA can’t be made without CO₂.","_n":"37afa","_k":"33e40374"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"How many ATP does the Calvin cycle use to make the sugar in one sucrose molecule (C₁₂)?","options":[{"t":"9","why":"For every 3 CO₂, 6 G3P are made, but 5 are needed to rebuild RuBP. Only 1 leaves.","_n":"38b0a","_k":"97a1eb98"},{"t":"18","why":"That’s one glucose’s worth.","_n":"39bda","_k":"7e98dd8d"},{"t":"24","why":"That’s the NADPH (2 per CO₂).","_n":"3abea","_k":"d89c5778"},{"t":"36","why":"12 C means 12 CO₂; 3 ATP each.","_n":"3bafa","_k":"f8b56dd6"}]},"b":{"prompt":"How many NADPH does the Calvin cycle use to make 3 glucose units of starch?","options":[{"t":"6","why":"G3P has 3 carbons; glucose has 6. One glucose needs 2 G3P: 6 CO₂.","_n":"3caea","_k":"99a4f24b"},{"t":"18","why":"That’s the number of CO₂.","_n":"3dada","_k":"7c3857e1"},{"t":"36","why":"18 C means 18 CO₂; 2 NADPH each.","_n":"3eaca","_k":"3e30c1d4"},{"t":"54","why":"That’s the ATP (3 per CO₂).","_n":"3fb3a","_k":"b85d8901"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A seaweed is given carbon-14 CO₂. At 3 s, compound X holds 80% of the label and compound Y holds 5%. At 60 s, X holds 15% and Y holds 45%. What do the data suggest?","options":[{"t":"Y is made first, because it ends with more label","why":"Early shares show what’s made first.","_n":"3gb2a","_k":"284cfeb5"},{"t":"X is made first, and Y is made later from it (or from compounds made from it)","why":"The label shows up in X first, then moves on to Y.","_n":"3hb1a","_k":"621dc922"},{"t":"The label leaks out of X","why":"The total stays at 100%; it moves to other compounds.","_n":"3ib0a","_k":"ab30f1d1"},{"t":"X and Y are made at the same time","why":"Their shares change in opposite directions.","_n":"3jb7a","_k":"78d0a939"}]},"b":{"prompt":"In a different labelling run, compound P holds 70% of the label at 2 s and 10% at 90 s, while compound Q holds 0% at 2 s and 50% at 90 s. Which is most likely 3-PGA, and which sucrose?","options":[{"t":"Neither: the data can’t separate them","why":"Timing is exactly what separates them.","_n":"3kb6a","_k":"f72d9a05"},{"t":"P is sucrose and Q is 3-PGA","why":"Sucrose is several steps after fixation.","_n":"3la9a","_k":"b878c300"},{"t":"Both are 3-PGA","why":"Their timing is very different.","_n":"3maaa","_k":"66905bf9"},{"t":"P is 3-PGA and Q is sucrose","why":"The first product of fixation is labelled first; sucrose is built later.","_n":"3naba","_k":"05e5cbee"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which best explains why ‘dark reactions’ is a misleading name for the Calvin cycle?","options":[{"t":"“It doesn’t use light directly, but it needs ATP and NADPH from the light reactions, and its enzymes are switched on in the light, so it stops soon after dark.”","why":"It needs ATP and NADPH from the light reactions, and its enzymes are switched on in the light.","_n":"3oaca","_k":"a6954c92"},{"t":"“It makes light energy.”","why":"It stores chemical energy in sugar.","_n":"3pada","_k":"eda6c945"},{"t":"“It happens only at night.”","why":"It needs ATP and NADPH from the light reactions, and its enzymes are switched on in the light.","_n":"3qaea","_k":"ae105b51"},{"t":"“It needs darkness to work properly.”","why":"It needs ATP and NADPH from the light reactions, and its enzymes are switched on in the light.","_n":"3rafa","_k":"20112ab9"}]},"b":{"prompt":"Which best explains why the Calvin cycle is called a \u003cstrong>cycle\u003c/strong>?","options":[{"t":"“It runs only in daylight cycles.”","why":"The name is about RuBP being regenerated.","_n":"3sb0a","_k":"f205ea47"},{"t":"“ATP and NADPH are made and used in a loop.”","why":"They come from the light reactions.","_n":"3tb1a","_k":"d7e75c51"},{"t":"“Carbon goes round and round without leaving.”","why":"One G3P in six leaves.","_n":"3ub2a","_k":"3f550e33"},{"t":"“The CO₂ acceptor, RuBP, is rebuilt from G3P every turn, so the same steps repeat.”","why":"The name is about RuBP being regenerated.","_n":"3vb3b","_k":"09f93693"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which best explains why only 1 G3P in 6 leaves the cycle?","options":[{"t":"“5 G3P (15 carbons) are needed to rebuild the 3 RuBP (15 carbons) that fixed the 3 CO₂; only the remaining 3 carbons are new.”","why":"It’s carbon bookkeeping: 15 of the 18 carbons rebuild RuBP.","_n":"3wb2b","_k":"d19e5e67"},{"t":"“The other 5 G3P become starch.”","why":"Starch is made from the exported G3P.","_n":"3xb5b","_k":"01898278"},{"t":"“5 G3P are broken down for energy.”","why":"They’re rebuilt into RuBP, not broken down.","_n":"3yb4b","_k":"05b2ae6c"},{"t":"“Rubisco can only release one G3P at a time.”","why":"It’s carbon bookkeeping, not an enzyme limit.","_n":"3zafb","_k":"5e0f7540"}]},"b":{"prompt":"Which carbon count shows the cycle is balanced for 3 CO₂?","options":[{"t":"3 RuBP (15 C) + 3 CO₂ (3 C) = 18 C = 6 G3P (18 C); 5 G3P (15 C) rebuild 3 RuBP; 1 G3P (3 C) leaves","why":"Every carbon is accounted for: 18 in, 18 out.","_n":"40aeb","_k":"96e1e72f"},{"t":"3 RuBP (15 C) + 3 CO₂ (3 C) = 6 G3P (18 C); all 6 leave","why":"For every 3 CO₂, 6 G3P are made, but 5 are needed to rebuild RuBP. Only 1 leaves.","_n":"41b1b","_k":"9de8c860"},{"t":"6 G3P (18 C) = 3 glucose (18 C)","why":"Three of those carbons are new; the rest rebuild RuBP.","_n":"42b0b","_k":"cf4537ee"},{"t":"3 CO₂ (3 C) = 1 glucose (6 C)","why":"G3P has 3 carbons; glucose has 6. One glucose needs 2 G3P: 6 CO₂.","_n":"43bbb","_k":"c07a9705"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A new weedkiller blocks an enzyme in the regeneration phase. Why do sprayed weeds stop growing even with light and CO₂ available?","options":[{"t":"The weeds’ rubisco starts making O₂","why":"Rubisco doesn’t make O₂.","_n":"44bab","_k":"982b07dd"},{"t":"The weeds can’t absorb light","why":"The light reactions aren’t the target.","_n":"45adb","_k":"910fb334"},{"t":"The weeds make too much starch","why":"G3P becomes sucrose to travel and starch to store.","_n":"46aeb","_k":"faa0509e"},{"t":"RuBP isn’t rebuilt, so fixation stops once it runs out; no new G3P means no sugar for growth","why":"RuBP is the CO₂ acceptor; without regeneration it’s used up.","_n":"47abb","_k":"a7d21817"}]},"b":{"prompt":"Leaves invest a large share of their nitrogen in rubisco. Why do nitrogen-starved crops often photosynthesize slowly?","options":[{"t":"Rubisco needs nitrogen gas to fix CO₂","why":"Rubisco fixes CO₂ only.","_n":"48acb","_k":"c0566fd2"},{"t":"They can’t make enough rubisco, and rubisco is slow, so less CO₂ is fixed","why":"Rubisco fixes only about 3 CO₂ per second, so a leaf needs a lot of it, and building it takes nitrogen.","_n":"49b1b","_k":"54ca23eb"},{"t":"Without nitrogen, light can’t enter the leaf","why":"Light absorption isn’t the issue.","_n":"4ab2b","_k":"ac5d4f57"},{"t":"Nitrogen is part of glucose","why":"Glucose contains only C, H and O.","_n":"4bafb","_k":"821cad35"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Some bacteria near deep-sea vents run the Calvin cycle in total darkness, using energy from chemicals. What must their other reactions supply to the cycle?","options":[{"t":"O₂ and glucose","why":"O₂ comes from splitting water in the light reactions. The Calvin cycle uses CO₂, ATP and NADPH.","_n":"4cb0b","_k":"bb87b837"},{"t":"Nothing: the cycle runs on its own","why":"It always needs ATP and reducing power.","_n":"4db5b","_k":"ac354499"},{"t":"ATP and a reduced electron carrier (like NADPH), plus CO₂","why":"It always needs ATP and reducing power, plus CO₂ to fix.","_n":"4eb6b","_k":"42e66e64"},{"t":"Light and water","why":"It needs ATP and NADPH from the light reactions, and its enzymes are switched on in the light.","_n":"4f47b","_k":"c70b3a03"}]},"b":{"prompt":"An experimental ‘artificial leaf’ feeds ATP and NADPH from solar panels to isolated Calvin cycle enzymes. What must it supply to export 2 G3P?","options":[{"t":"6 CO₂, 18 ATP and 12 NADPH","why":"2 G3P hold 6 carbons: 6 CO₂, with 3 ATP and 2 NADPH per CO₂.","_n":"4g46b","_k":"6d945980"},{"t":"6 CO₂, 12 ATP and 12 NADPH","why":"Regeneration uses 6 more ATP.","_n":"4h45b","_k":"2f2ec7b7"},{"t":"6 H₂O and light","why":"O₂ comes from splitting water in the light reactions. The Calvin cycle uses CO₂, ATP and NADPH.","_n":"4i44b","_k":"c785488f"},{"t":"2 CO₂, 6 ATP and 4 NADPH","why":"For every 3 CO₂, 6 G3P are made, but 5 are needed to rebuild RuBP. Only 1 leaves.","_n":"4j43b","_k":"68a3cafb"}]}}]},"task":{"title":"Plan a sugar order","summary":"Plan a sugar order","statement":"\u003cp>Plan a batch of sugar for a leaf’s Calvin cycle. Choose the products and supply exactly the carbon and energy needed, within the energy budget. Can you find all the answers?\u003c/p>\u003col class=\"cc-conds\">\u003cli>The batch has at least 3 glucose-sized units (each glucose counts 1, each sucrose counts 2).\u003c/li>\u003cli>The carbon balances: CO₂ fixed = 6 × units.\u003c/li>\u003cli>ATP supplied = 3 × CO₂ fixed.\u003c/li>\u003cli>NADPH supplied = 2 × CO₂ fixed.\u003c/li>\u003cli>ATP supplied is at most 72.\u003c/li>\u003c/ol>","checks":["At least 3 units","Carbon balances","ATP matches","NADPH matches","Within budget"],"tips":["A sucrose is two hexose units joined: 12 carbons.","Each glucose-sized unit needs 6 CO₂.","3 ATP per CO₂.","2 NADPH per CO₂.","72 ATP covers at most 24 CO₂: 4 units."],"explainPrompt":"Explain how you worked out the CO₂, ATP and NADPH for your batch, and why the budget limits you to 3 or 4 units.","vocab":"Use the words G3P, carbon, ATP, NADPH and Calvin cycle.","success":"Your order works!","more":"Can you find all the answers?","allFound":"You’ve found all five answers.","afterAll":"The budget allows only 3 or 4 units. Sucrose and glucose cost the same per carbon, so only the number of units matters."},"cards":[["Calvin cycle","The stroma’s cycle that fixes CO₂ into sugar using ATP and NADPH"],["Rubisco","The enzyme that joins CO₂ to RuBP; slow, so leaves make lots of it"],["RuBP","Ribulose bisphosphate: the 5-carbon CO₂ acceptor, rebuilt every turn"],["3-PGA","The 3-carbon first stable product of fixation"],["G3P","Glyceraldehyde 3-phosphate: the 3-carbon sugar the cycle exports"],["Three phases","Fixation → reduction (uses ATP and NADPH) → regeneration of RuBP (uses ATP)"],["Per 3 CO₂","6 G3P made, 1 exported; costs 9 ATP and 6 NADPH"],["Per glucose","6 CO₂, 18 ATP, 12 NADPH (2 G3P)"],["Lights off","3-PGA rises, RuBP falls"],["CO₂ off","RuBP rises, 3-PGA falls"],["Where G3P goes","Sucrose (shipped), starch (stored), cellulose (walls), amino acids, fats"],["“Dark reactions”?","Misleading: the cycle needs ATP and NADPH from light and is switched on in the light"]]}};</script>
