.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 19: ATP ledger (S3 energyLedger, token board, per-stage table, compare cards, H⁺ calculator), Part 3 stations
   (H⁺ budget dots, leak dial, P/O data), task (chip rows + budget preview), hero. Roles: ATP --bio-atp, NADH --bio-nadh,
   FADH₂ --bio-fadh, H⁺ --bio-h (Part 3 and task only). Module tokens: --ac-sheet2 (ledger rows), --ac-grey (membrane). */
:root{--ac-sheet2:color-mix(in srgb,var(--ink-2) 7%,var(--sheet));--ac-grey:color-mix(in srgb,var(--ink-2) 45%,var(--sheet))}

/* hero */
.hero .hero-eq .ac-heq{font-size:.62em;line-height:1.45;display:inline-block}
.ac-c-atp{color:var(--bio-atp);font-weight:700}.ac-c-nadh{color:var(--bio-nadh);font-weight:700}.ac-c-fadh{color:var(--bio-fadh);font-weight:700}
.ac-hero{width:100%;aspect-ratio:520 / 272}
.ac-hero svg{width:100%;height:100%;display:block}

/* radio groups (from SBI4U 17 / 13 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .8em;font-size:.9rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{color:var(--ink-2);opacity:.6}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;min-width:44px;min-height:40px;padding:.2em .8em;font-weight:700;font-variant-numeric:tabular-nums}
.rg.chips button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* stepper (from SBI4U 15) */
.ac-stp{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.ac-stb{min-width:40px;min-height:40px;border:0;background:var(--sheet);color:var(--ink);font-size:1.2rem;font-weight:700;padding:0}
.ac-stb:disabled{opacity:.4}
.ac-stp output{min-width:3.4em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:0 .4em;line-height:40px}

/* explore layout */
.ac-pg [hidden]{display:none!important}
@media (min-width:821px){ .ac-pg{grid-template-rows:auto 1fr} }
.ac-pg .pg-ctrl{display:grid;gap:12px}
.ac-mhelp{margin:-4px 0 0}
.ac-stage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.ac-stage svg,.ac-bstage svg{display:block;width:100%;height:auto}
.ac-cap{min-height:2.6em;font-size:.92rem;margin:8px 0 6px}
.ac-steps{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 10px}
.ac-steps:empty{display:none}
.ac-stc{font-weight:700;font-size:.92rem}
.ac-note2{margin-top:10px;color:var(--ink-2)}

/* token board (SVG) */
.ac-th{font:700 12.5px var(--font-ui);fill:var(--ink)}
.ac-sl{font:700 11.5px var(--font-ui);fill:var(--ink-2)}
.ac-ms,.ac-gl{font:400 10px var(--font-ui);fill:var(--ink-2)}
.ac-note{font:italic 400 10.5px var(--font-ui);fill:var(--ink-2)}
.ac-tokt{font:700 10.5px var(--font-ui);fill:var(--sheet)}
.ac-ghost{fill:none;stroke:var(--bio-nadh);stroke-width:1.3;stroke-dasharray:3 3;opacity:.7}
.ac-mem{stroke:var(--ac-grey);stroke-width:4;stroke-dasharray:10 5}
.ac-gate{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.ac-sep{stroke:var(--rule);stroke-width:1.2}
.ac-totbox{fill:var(--ac-sheet2);stroke:var(--ink);stroke-width:1.5}
.ac-fl{font:700 11px var(--font-ui);fill:var(--ink-2)}
.ac-fs{font:400 9.5px var(--font-ui);fill:var(--ink-2)}
.ac-big{font:700 23px var(--font-ui);fill:var(--ink)}
.ac-fv{font:700 12.5px var(--font-ui);fill:var(--ink)}
.ac-fatp{fill:var(--bio-atp);font-size:16px}
.ac-tile{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.ac-tiled{stroke:var(--ink-2);stroke-width:1.2}
.ac-tilet{font:700 11.5px var(--font-ui);fill:var(--ink)}
.ac-glow{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2}
@media (max-width:560px){
  .ac-th{font-size:16px}.ac-sl{font-size:13px}.ac-tokt{font-size:12.5px}.ac-note{font-size:12px}.ac-ms,.ac-gl{font-size:12px}
  .ac-fl{font-size:13.5px}.ac-fs{font-size:12px}.ac-big{font-size:27px}.ac-fv{font-size:14.5px}.ac-fatp{font-size:18px}.ac-tilet{font-size:13.5px}
  .ac-bl{font-size:14px}.ac-br{font-size:15px}.ac-bn{font-size:12px}
}

/* ledger table (desktop: a table; phone: stacked cards with the totals card sticky at the bottom) */
.ac-lw{overflow-x:auto;margin-top:6px}
.ac-led{width:100%;border-collapse:collapse;font-size:.9rem}
.ac-led th,.ac-led td{border:1px solid var(--rule);padding:.35em .5em;text-align:center;vertical-align:middle}
.ac-led thead th{background:var(--ac-sheet2);font-size:.82rem}
.ac-led tbody th{text-align:left;white-space:nowrap}
.ac-led tbody tr{background:var(--sheet)}
.ac-led tbody tr:nth-child(odd){background:var(--ac-sheet2)}
.ac-led tr.ac-ok{background:var(--good-bg)}
.ac-led .ac-in{width:4.2em;font-size:1rem;padding:.3em .4em;text-align:center}
.ac-led .ac-in:disabled{opacity:1;background:transparent;border-color:transparent;color:var(--ink)}
.ac-okm{color:var(--green);font-weight:700;white-space:nowrap}
.ac-chkc{white-space:nowrap}
.ac-fbr td{text-align:left;background:var(--sheet)}
.ac-fbr .fb{margin:0}
.ac-tot th,.ac-tot td{font-weight:700;border-top:2px solid var(--ink)}
.ac-led .ac-ph{display:none}
.ac-conv{display:grid;gap:2px;margin:10px 0 0;font-size:.92rem}
.ac-conv > div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:.3em .5em;border-radius:6px;background:var(--ac-sheet2)}
.ac-conv dt{font-weight:700;color:var(--ink-2)}
.ac-conv dd{margin:0;font-variant-numeric:tabular-nums}
.ac-conv .ac-cvt{border:1.5px solid var(--ink);font-weight:700}
@media (max-width:560px){
  .ac-lw{overflow:visible}
  .ac-led,.ac-led tbody,.ac-led tr,.ac-led th,.ac-led td{display:block}
  .ac-led thead{display:none}
  .ac-led tbody tr{border:1.5px solid var(--rule);border-radius:8px;margin:0 0 8px;padding:6px 8px}
  .ac-led th,.ac-led td{border:0;padding:.15em 0;text-align:left}
  .ac-led tbody th{font-size:1rem;white-space:normal}
  .ac-led td{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ac-led td[data-l]::before{content:attr(data-l);font-weight:700;color:var(--ink-2);font-size:.85rem}
  .ac-led td.ac-wh{display:none}
  .ac-led td.ac-chkc{justify-content:flex-end}
  .ac-led td:empty{display:none}
  .ac-led tr.ac-tot{position:sticky;bottom:0;z-index:2;border:2px solid var(--ink);background:var(--sheet);box-shadow:0 -4px 10px rgba(0,0,0,.12)}
  .ac-led .ac-tot th,.ac-led .ac-tot td{border-top:0}
  .ac-led .ac-ph{display:flex;border-top:1px solid var(--rule);margin-top:4px;padding-top:4px}
  .ac-led tr.ac-fbr{border:0;padding:0;margin-top:-4px;background:transparent}
}

/* compare cards (phone: tabs, only the ledger the settings change is shown) */
.ac-cmps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.ac-card{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--ac-sheet2)}
.ac-card.on{border-color:var(--ink);border-width:2px}
.ac-card h4{margin:0 0 4px;font-size:1rem}
.ac-as{font-size:.82rem;color:var(--ink-2);margin:0 0 6px}
.ac-cd{margin:0;display:grid;gap:2px;font-size:.9rem}
.ac-cd > div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px}
.ac-cd dt{font-weight:700;color:var(--ink-2)}
.ac-cd dd{margin:0;font-variant-numeric:tabular-nums}
.ac-cd .ac-ct{border-top:1.5px solid var(--ink);padding-top:3px;margin-top:2px;font-weight:700}
.ac-cd .ac-ct dt{color:var(--ink)}
.ac-diff{font-weight:700;font-size:.92rem;margin:8px 0 0}
@media (max-width:560px){ .ac-cmps{grid-template-columns:minmax(0,1fr)} .ac-card:not(.on){display:none} }

/* H⁺ calculator */
.ac-calc{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px 12px;display:grid;gap:10px;margin:0;min-width:0}
.ac-calc legend{font-weight:700;padding:0 4px}
.ac-form{margin:0;font-size:.9rem;font-variant-numeric:tabular-nums}
.ac-calc .numrow{margin-top:0}
.ac-calc .numrow label{font-size:.9rem}
.ac-typed{width:7rem}

/* Part 3 */
.ac-p3{display:grid;gap:18px}
.ac-st{border:1.5px solid var(--rule);border-radius:8px;padding:10px 14px}
.ac-st h3{margin-top:0}
.ac-bstage{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px;margin:8px 0}
.ac-bstage svg{max-width:640px;margin:0 auto}
.ac-hdot{fill:var(--bio-h)}
.ac-hslot{fill:none;stroke:var(--bio-h);stroke-width:1.3;stroke-dasharray:2.5 2.5}
.ac-gbox{fill:var(--ac-sheet2);stroke:var(--ink-2);stroke-width:1.3}
.ac-gpart{stroke-dasharray:5 4}
.ac-bl{font:700 11px var(--font-ui);fill:var(--ink-2)}
.ac-br{font:700 13px var(--font-ui);fill:var(--bio-atp)}
.ac-bn{font:400 10.5px var(--font-ui);fill:var(--ink)}
.ac-brk{fill:none;stroke:var(--ink-2);stroke-width:1.2}
.ac-legend svg{display:inline-block;width:14px;height:14px;vertical-align:-2px}
.ac-bres{font-weight:700;min-height:1.4em}
.ac-lbar{display:flex;height:26px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;margin:12px 0 6px;background:var(--sheet)}
.ac-lbar i{display:block;height:100%;transition:width .5s}
.ac-ls{background:var(--bio-atp)}
.ac-lc{background:color-mix(in srgb,var(--bio-atp) 50%,var(--sheet))}
.ac-ll{background:repeating-linear-gradient(135deg,var(--ac-grey) 0 4px,var(--sheet) 4px 8px)}
@media (prefers-reduced-motion:reduce){ .ac-lbar i{transition:none} }
.ac-lkey{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0}
.ac-lkey span{display:inline-flex;align-items:center;gap:5px}
.ac-lsw{display:inline-block;width:14px;height:12px;border:1px solid var(--ink-2);border-radius:2px}
.ac-leq{font-size:1rem;margin:8px 0}

:"d593c3aa"}],"explain":"4 + 8 × 2.5 + 4 × 1.5 = 4 + 20 + 6 = 30. Same molecules, different assumptions: 2.5 and 1.5 come from counting H⁺."},{"id":"p4","start":{"org":"euk","vals":"cur","shut":"gp"},"cycle":true,"prompt":"Which part of the total never changes, whatever the settings?","reveal":"The substrate column glows in every setting: 38, 36, 32 and 30 all start with the same 4.","options":[{"t":"None of it","_n":"1052e","_k":"5314021a"},{"t":"The NADH contribution","_n":"114be","_k":"7d1d6a4c"},{"t":"The FADH₂ contribution","_n":"124ce","_k":"a6a1b742"},{"t":"The 4 substrate-level ATP","_n":"134de","_k":"df2369db"}],"explain":"Substrate-level ATP doesn’t depend on the chain or the gradient."}],"chalIntro":"Use the ledger to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Set the toggles so the total is exactly \u003cstrong>32\u003c/strong>.","why":"32 is a current-value total with every NADH counted at 2.5: a prokaryote, or a eukaryote with the malate–aspartate shuttle.","wrong":{"gp":"The shuttle costs 2 × (2.5 − 1.5) = 2.","theo":"32 needs the current values."},"hints":["32 is a current-value total.","It needs every NADH counted at 2.5.","Prokaryote, or eukaryote with malate–aspartate."]},{"id":"tc2","goal":1,"prompt":"Build mode: fill all three stage rows for one glucose correctly on the first check.","why":"2/2/0, 0/2/0 and 2/6/2: 4 substrate-level ATP, 10 NADH and 2 FADH₂.","wrong":{"mode":"Switch the mode to \u003cstrong>Build\u003c/strong> first.","blank":"Fill every box in all three rows first (type 0 for none).","other":"Some boxes aren’t right yet. Go stage by stage."},"hints":["Go stage by stage: glycolysis, pyruvate oxidation, the Krebs cycle.","Krebs: two turns per glucose.","2/2/0, 0/2/0, 2/6/2."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Compare mode, custom values, prokaryote: a hypothetical bacterium’s ATP synthase needs \u003cstrong  4 substrate-level = 29.2 in total.","_n":"1o40d","_k":"a34e6168"},{"t":"28","fb":"28 × 0.9 = 25.2, plus 4 substrate-level = 29.2 in total.","_n":"1p3fd","_k":"83c3596f"}]},{"id":"q4","goal":4,"prompt":"A P/O ratio measures…","choices":[{"t":"ATP made per O atom used","fb":"Right. Each O atom takes one electron pair.","_n":"1q3ed","_k":"489400c2"},{"t":"Glucose per ATP","fb":"Each O atom takes one electron pair.","_n":"1r45d","_k":"2a3b5663"},{"t":"H⁺ per electron","fb":"Each O atom takes one electron pair.","_n":"1s44d","_k":"ae2d9283"},{"t":"O₂ made per ATP","fb":"Each O atom takes one electron pair.","_n":"1t43d","_k":"a9a0b60b"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Stage ↔ products","summary":"Stage ↔ products","goal":[1,6],"instruction":"Match each stage or setting with its products or ATP total.","leftTitle":"Stage or setting","rightTitle":"Products or total","left":[{"id":"l1","t":"Glycolysis (per glucose)"},{"id":"l2","t":"Pyruvate oxidation (per glucose)"},{"id":"l3","t":"Krebs cycle (per glucose)"},{"id":"l4","t":"All substrate-level ATP"},{"id":"l5","t":"Prokaryote, theoretical total"},{"id":"l6","t":"Eukaryote, glycerol-phosphate, theoretical total"},{"id":"l7","t":"Eukaryote, glycerol-phosphate, current total","hints":["Current values, with 2 NADH shuttled as FADH₂.","8 × 2.5 + 4 × 1.5.","20 + 6 + 4 = 30."]},{"id":"l8","t":"Fermentation total"}],"right":[{"id":"r1","t":"2 ATP (net), 2 NADH"},{"id":"r2","t":"2 NADH, 2 CO₂"},{"id":"r3","t":"2 ATP, 6 NADH, 2 FADH₂, 4 CO₂"},{"id":"r4","t":"4"},{"id":"r5","t":"38"},{"id":"r6","t":"36"},{"id":"r7","t":"30"},{"id":"r8","t":"2"}],"_a":"HkMOUxtcRktUQ05AVVRGA0cTUEAVRAgKR1tAEApESBsJVUBYGxRQG0lDDlcbXEZLUENOQFVQRgNHE1RAFUQIDkdbQBAOREgbCVlAWBsUXBsY","wrong":{"l1|r4":"Glycolysis nets 2 ATP.","l6|r5":"The glycerol-phosphate shuttle costs 2.","l8|r5":"Fermentation stops after glycolysis: 2 ATP.","l8|r6":"Fermentation stops after glycolysis: 2 ATP.","l8|r7":"Fermentation stops after glycolysis: 2 ATP."},"wrongDefault":"Check the ledger table from Explore."},{"id":"puzzles","type":"numeric","title":"Counting puzzles","summary":"Counting puzzles","star":true,"goal":[2,4,5],"instruction":"Six counting puzzles. Puzzles 3 to 6 are non-routine; the last two go beyond the Final Check.","how":"Type your answer, then press Check. Use a decimal point for decimals, such as 26.4.","items":[{"id":"n1","goal":2,"prompt":"Prokaryote, theoretical: total ATP for 2 glucose?","_a":"Ulc=","display":"76 ATP","unit":"ATP","why":"38 per glucose × 2.","wrong":[{"match":38,"fb":"That’s one glucose."}]},{"id":"n2","goal":2,"prompt":"Eukaryote, current, malate–aspartate: ATP from NADH alone for 1 glucose?","_a":"V1Q=","display":"25 ATP","unit":"ATP","why":"10 × 2.5 = 25.","wrong":[{"match":20,"fb":"Malate–aspartate keeps all 10 NADH at 2.5."}]},{"id":"n3","goal":5,"star":true,"prompt":"\u003cspan class=\"tag\">Investigation\u003c/span> Isolated mitochondria are given 4 pyruvate (no glycolysis). Current values. Total ATP?","_a":"UFE=","display":"50 ATP","unit":"ATP","why":"Working: 4 × (4 NADH × 2.5 + 1 FADH₂ × 1.5 + 1 ATP) = 4 × 12.5 = 50.","wrong":[{"match":46,"fb":"Add the 4 substrate-level ATP from the Krebs cycle."},{"match":40,"fb":"Count FADH₂ and ATP too, not just NADH."}],"hints":["Each pyruvate: 1 NADH (pyruvate oxidation) + 1 Krebs turn.","Per pyruvate: 4 NADH × 2.5 = 10, 1 FADH₂ × 1.5 = 1.5, 1 ATP.","12.5 × 4 = 50."]},{"id":"n4","goal":5,"star":true,"prompt":"A muscle cell (glycerol-phosphate, current values) uses 3 glucose. How many ATP?","_a":"XFE=","display":"90 ATP","unit":"ATP","why":"30 per glucose × 3.","wrong":[{"match":96,"fb":"Glycerol-phosphate: 30 per glucose, not 32."}]},{"id":"n5","goal":[4,5],"star":true,"prompt":"A bacterium’s chain pumps 8 H⁺ per NADH and 4 per FADH₂; its synthase needs 4 H⁺ per ATP. Total ATP per glucose (4 substrate-level)?","_a":"V1c=","display":"26 ATP","unit":"ATP","why":"4 + 10 × 2 + 2 × 1 = 26.","wrong":[{"match":22,"fb":"Add the 4 substrate-level ATP: 4 + 10 × 2 + 2 × 1."}]},{"id":"n6","goal":[4,5],"star":true,"prompt":"Current values, eukaryote with malate–aspartate, and a 20% leak of pumped H⁺. Total ATP per glucose?","_a":"V1dMVg==","display":"26.4 ATP","unit":"ATP","why":"28 × 0.8 = 22.4; + 4 = 26.4.","wrong":[{"match":25.6,"fb":"The leak affects only the 28 from carriers: 28 × 0.8 = 22.4, + 4."}],"hints":["Substrate-level ATP isn’t affected by a leak.","Carriers: 25 + 3 = 28 at full value.","28 × 0.8 = 22.4; + 4 = 26.4."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Joon","goal":[1,2,3],"how":"","instruction":"Joon made one mistake in each count. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Count the theoretical ATP for a prokaryote.","steps":["Substrate-level ATP: 2 (glycolysis) + 2 (Krebs) = 4.","NADH: 2 (glycolysis) + 6 (Krebs) = 8.","FADH₂: 2.","Total: 4 + 8 × 3 + 2 × 2 = 32."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is correct, but look earlier.","Step 4 follows from step 2."],"fixes":[{"t":"NADH: 2 + 2 (pyruvate oxidation) + 6 = 10, so the total is 4 + 30 + 4 = 38.","why":"10 NADH: 2 from glycolysis + 2 from pyruvate oxidation + 6 from the Krebs cycle.","_n":"1u42d","_k":"a7d6cc70"},{"t":"NADH: 6 only.","why":"Glycolysis makes NADH too.","_n":"1v49d","_k":"697e28bb"},{"t":"NADH: 20.","why":"That double-counts.","_n":"1w48d","_k":"a416b34b"},{"t":"Step 2 is correct.","why":"10 NADH: 2 from glycolysis + 2 from pyruvate oxidation + 6 from the Krebs cycle.","_n":"1xbbd","_k":"7b4efa0c"}],"hints":["Which stage is missing?","Pyruvate oxidation.","10 NADH."]},{"id":"e2","goal":2,"task":"Count the current-value ATP for a prokaryote.","steps":["4 substrate-level ATP, 10 NADH, 2 FADH₂.","NADH: 10 × 2.5 = 25.","FADH₂: 2 × 2.5 = 5.","Total: 4 + 25 + 5 = 34."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"FADH₂ is worth ≈ 1.5 (6 H⁺ ÷ 4): 2 × 1.5 = 3, so the total is 32.","why":"FADH₂ enters after complex I: 2 (theoretical) or 1.5 (current), not 3 or 2.5.","_n":"1ybcd","_k":"75ebe2eb"},{"t":"FADH₂ is worth 0.","why":"It still pumps 6 H⁺.","_n":"1zbdd","_k":"805dd850"},{"t":"FADH₂ is worth 2.","why":"That’s the theoretical value; this count uses current values.","_n":"20bed","_k":"92d8a6c6"},{"t":"Step 3 is correct.","why":"FADH₂ enters after complex I: 2 (theoretical) or 1.5 (current), not 3 or 2.5.","_n":"21bfd","_k":"bc417d08"}],"hints":["Does FADH₂ pass complex I?","No: 6 H⁺, not 10.","1.5 each."]},{"id":"e3","goal":3,"task":"Explain why a skeletal muscle cell gets 36 (theoretical), not 38.","steps":["Glycolysis happens in the cytosol.","The 2 NADH from glycolysis can’t cross the inner mitochondrial membrane.","So those 2 NADH are wasted and give 0 ATP.","That’s 6 ATP lost, so the total is 32."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Cytosolic NADH’s electrons enter as FADH₂ through the glycerol-phosphate shuttle: worth 2, not 3.","_n":"22c0d","_k":"97e049ce"},{"t":"They’re turned into lactate.","why":"That’s fermentation.","_n":"23c1d","_k":"4941125e"},{"t":"Their electrons are passed into the mitochondrion by the glycerol-phosphate shuttle, arriving as FADH₂, worth 2 each instead of 3. That’s 2 ATP lost: 36.","why":"Cytosolic NADH’s electrons enter as FADH₂ through the glycerol-phosphate shuttle: worth 2, not 3.","_n":"24c2d","_k":"20a71179"},{"t":"They cross as NADH and are worth 3.","why":"That’s the malate–aspartate shuttle (38).","_n":"25c3d","_k":"3fd189be"}],"hints":["Are the electrons lost, or moved?","Moved, by a shuttle.","They arrive as FADH₂: 2 each."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the ledger: how many ‘right’ answers there are, or where 2.5 and 1.5 come from?"},{"id":"j2","q":"In your own words, why does the ATP count depend on assumptions?"},{"id":"j3","q":"Explain to a friend how to count ATP for any setting, step by step."},{"id":"j4","q":"Which part of the count do you still get wrong most often? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Using theoretical values (NADH 3, FADH₂ 2), what is the total ATP per glucose in a prokaryote?","options":[{"t":"32","why":"That counts only 8 NADH.","_n":"26c4d","_k":"aed24246"},{"t":"34","why":"That leaves out the 4 substrate-level ATP.","_n":"27560","_k":"01bb1a17"},{"t":"36","why":"Prokaryotes have no shuttle cost.","_n":"28550","_k":"3c99e3cb"},{"t":"38","why":"4 + 10 × 3 + 2 × 2 = 38.","_n":"29580","_k":"3fe818c8"}]},"b":{"prompt":"Using theoretical values, what is the total ATP per glucose in a eukaryotic cell using the glycerol-phosphate shuttle?","options":[{"t":"30","why":"That’s the current-value total.","_n":"2a570","_k":"7f9fd65c"},{"t":"32","why":"Add the 4 substrate-level ATP.","_n":"2b520","_k":"5b29f502"},{"t":"36","why":"4 + 8 × 3 + 4 × 2 = 36.","_n":"2c510","_k":"ceecf4ef"},{"t":"38","why":"The shuttle costs 2.","_n":"2d540","_k":"3e915e8e"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"How many ATP per glucose are made by substrate-level phosphorylation?","options":[{"t":"0","why":"Glycolysis and the Krebs cycle both make some directly.","_n":"2e530","_k":"c93f850c"},{"t":"2","why":"Add the Krebs cycle’s 2.","_n":"2f4e0","_k":"d25cc372"},{"t":"4","why":"2 (glycolysis, net) + 2 (Krebs).","_n":"2g4d0","_k":"7b2285f5"},{"t":"6","why":"That uses glycolysis’s gross 4.","_n":"2hcff","_k":"6fa03de0"}]},"b":{"prompt":"How many NADH per glucose are made in total (all stages)?","options":[{"t":"6","why":"That’s the Krebs cycle alone.","_n":"2id0f","_k":"9c6c192a"},{"t":"8","why":"Include pyruvate oxidation’s 2.","_n":"2jcdf","_k":"9cddade4"},{"t":"10","why":"10 NADH: 2 from glycolysis + 2 from pyruvate oxidation + 6 from the Krebs cycle.","_n":"2kcef","_k":"c98048e7"},{"t":"12","why":"That adds the 2 FADH₂.","_n":"2ld3f","_k":"1930677c"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"What range do current estimates give for ATP per glucose?","options":[{"t":"About 60–70","why":"Far too high.","_n":"2md4f","_k":"8015d45a"},{"t":"Exactly 38","why":"The total depends on assumptions. State the values per NADH and FADH₂, and the shuttle.","_n":"2nd1f","_k":"25ae0d6c"},{"t":"About 2–4","why":"That’s fermentation and substrate-level ATP.","_n":"2od2f","_k":"2ff1b49e"},{"t":"About 30–32","why":"NADH ≈ 2.5 and FADH₂ ≈ 1.5 give 30 or 32, depending on the shuttle.","_n":"2pc7f","_k":"062bc6d2"}]},"b":{"prompt":"What are the current estimated ATP values for one NADH and one FADH₂?","options":[{"t":"10 and 6","why":"Those are H⁺ pumped, not ATP.","_n":"2qc8f","_k":"429943d3"},{"t":"2.5 and 2.5","why":"FADH₂ enters after complex I: 2 (theoretical) or 1.5 (current), not 3 or 2.5.","_n":"2r42a","_k":"417b7c2e"},{"t":"≈ 2.5 and ≈ 1.5","why":"10 H⁺ ÷ 4 and 6 H⁺ ÷ 4.","_n":"2s43a","_k":"7f805181"},{"t":"3 and 2","why":"Those are the theoretical values.","_n":"2t40a","_k":"64e03592"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Using theoretical values, how many ATP per glucose come from oxidative phosphorylation (not substrate-level) in a eukaryote using the glycerol-phosphate shuttle?","options":[{"t":"30","why":"That’s the current-value total.","_n":"2u41a","_k":"7b603c3a"},{"t":"32","why":"36 − 4.","_n":"2v3ea","_k":"9321a29b"},{"t":"34","why":"That’s the prokaryote’s 38 − 4.","_n":"2w3fa","_k":"46c7ea1e"},{"t":"36","why":"Subtract the substrate-level 4.","_n":"2x3ca","_k":"5f2b4c94"}]},"b":{"prompt":"Using current values, how many ATP per glucose come from oxidative phosphorylation in a eukaryote using the glycerol-phosphate shuttle?","options":[{"t":"26","why":"30 − 4.","_n":"2y3da","_k":"e260d441"},{"t":"28","why":"That’s the malate–aspartate figure.","_n":"2z4aa","_k":"28eb440d"},{"t":"30","why":"Subtract the substrate-level 4.","_n":"304ba","_k":"367e27a7"},{"t":"32","why":"That’s a total, not just the oxidative part.","_n":"3148a","_k":"e59b4c6c"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Using current values, how many ATP does a prokaryote make from 3 glucose?","options":[{"t":"84","why":"That leaves out the substrate-level 4 each time.","_n":"3247a","_k":"d0f7ba08"},{"t":"96","why":"32 × 3.","_n":"334aa","_k":"5c637154"},{"t":"102","why":"That counts FADH₂ at 2.5: 34 per glucose.","_n":"3449a","_k":"3920b2d8"},{"t":"114","why":"That’s the theoretical 38 × 3.","_n":"354ca","_k":"6bbba3e3"}]},"b":{"prompt":"Using theoretical values, how many ATP does a eukaryote using the glycerol-phosphate shuttle make from 2 glucose?","options":[{"t":"64","why":"Add 4 substrate-level per glucose.","_n":"364ba","_k":"ae7b8b75"},{"t":"72","why":"36 × 2.","_n":"374ea","_k":"f853f104"},{"t":"76","why":"No shuttle cost would give 38.","_n":"384da","_k":"bd1047b5"},{"t":"80","why":"That counts FADH₂ at 3.","_n":"3940a","_k":"90a79ccc"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"A bacterium makes ATP inside its own cytoplasm, so it needs no transport step: its ATP synthase uses 3 H⁺ per ATP. Its chain pumps 10 H⁺ per NADH. About how many ATP per NADH?","options":[{"t":"About 3.3","why":"10 ÷ 3.","_n":"3a3fa","_k":"7c145d90"},{"t":"0.3","why":"That divides the wrong way.","_n":"3bb6a","_k":"16911f4b"},{"t":"2.5","why":"That assumes 4 H⁺ per ATP.","_n":"3cb7a","_k":"d6f774b7"},{"t":"30","why":"Divide, don’t multiply.","_n":"3db8a","_k":"75f85af3"}]},"b":{"prompt":"A plant mitochondrion’s ATP synthase uses 5 H⁺ per ATP, including transport. FADH₂ pumps 6 H⁺. About how many ATP per FADH₂?","options":[{"t":"0.83","why":"That divides the wrong way. ATP per carrier = H⁺ pumped ÷ H⁺ per ATP (≈ 4, including transport).","_n":"3eb9a","_k":"51a4edcf"},{"t":"1.2","why":"6 ÷ 5.","_n":"3fbaa","_k":"a10c4b43"},{"t":"1.5","why":"That assumes 4 H⁺ per ATP.","_n":"3gbba","_k":"f9001fda"},{"t":"30","why":"Divide, don’t multiply. ATP per carrier = H⁺ pumped ÷ H⁺ per ATP (≈ 4, including transport).","_n":"3hbca","_k":"472e10bc"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why one textbook says 36 ATP per glucose and another says about 30–32?","options":[{"t":"“Cells make different amounts of glucose.”","why":"The glucose is the same.","_n":"3ibda","_k":"810d4732"},{"t":"“Both count the same 4 ATP, 10 NADH and 2 FADH₂, but they assume different ATP values per carrier. Newer measurements show about 4 H⁺ per ATP, so NADH ≈ 2.5 and FADH₂ ≈ 1.5.”","why":"The total depends on assumptions. State the values per NADH and FADH₂, and the shuttle.","_n":"3jbea","_k":"9c590d33"},{"t":"“One of the textbooks is wrong about the number of NADH.”","why":"10 NADH: 2 from glycolysis + 2 from pyruvate oxidation + 6 from the Krebs cycle.","_n":"3kbfa","_k":"ca9b1b52"},{"t":"“There’s only one true answer, 36.”","why":"The total depends on assumptions. State the values per NADH and FADH₂, and the shuttle.","_n":"3l3ca","_k":"440c31d3"}]},"b":{"prompt":"Which is the best explanation of why NADH is worth about 2.5 ATP rather than 3?","options":[{"t":"“Some NADH is destroyed.”","why":"NADH is recycled to NAD⁺.","_n":"3m3ba","_k":"243a3263"},{"t":"“ATP synthase needs 10 H⁺ per ATP.”","why":"ATP per carrier = H⁺ pumped ÷ H⁺ per ATP (≈ 4, including transport).","_n":"3n3aa","_k":"897de517"},{"t":"“NADH passes only two pumps.”","why":"It passes three: I, III and IV.","_n":"3o39a","_k":"cf064aca"},{"t":"“NADH’s electrons pump about 10 H⁺, and each ATP made and exported uses about 4 H⁺, so 10 ÷ 4 ≈ 2.5.”","why":"ATP per carrier = H⁺ pumped ÷ H⁺ per ATP (≈ 4, including transport).","_n":"3p40a","_k":"8eaa1bfe"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which statement best compares the ATP yields of aerobic respiration and fermentation?","options":[{"t":"“Fermentation gives 0.”","why":"Glycolysis still nets 2.","_n":"3q3fa","_k":"4c4db973"},{"t":"“Aerobic respiration gives about 30–38 ATP per glucose, depending on assumptions; fermentation gives 2. So aerobic is about 15–19 times more productive.”","why":"Fermentation gives 2 ATP; aerobic respiration about 30–38: roughly 15–19 times more.","_n":"3r3ea","_k":"f3b3f69c"},{"t":"“They’re about the same, because both start with glycolysis.”","why":"Only aerobic continues past glycolysis.","_n":"3s3da","_k":"806a9af7"},{"t":"“Aerobic gives 36; fermentation gives 18.”","why":"Fermentation gives 2 ATP; aerobic respiration about 30–38: roughly 15–19 times more.","_n":"3t44a","_k":"f4c802b1"}]},"b":{"prompt":"Which ledger correctly summarizes one glucose (current values, prokaryote)?","options":[{"t":"Substrate-level 2 · NADH 10 × 2.5 = 25 · FADH₂ 2 × 1.5 = 3 · total 30","why":"Substrate-level: 2 (net, glycolysis) + 2 (Krebs) = 4.","_n":"3u43a","_k":"a243c993"},{"t":"Substrate-level 4 · NADH 10 × 2.5 = 25 · FADH₂ 2 × 1.5 = 3 · total 32","why":"4 + 25 + 3 = 32.","_n":"3vbab","_k":"9bdf15be"},{"t":"Substrate-level 4 · NADH 8 × 2.5 = 20 · FADH₂ 2 × 1.5 = 3 · total 27","why":"10 NADH: 2 from glycolysis + 2 from pyruvate oxidation + 6 from the Krebs cycle.","_n":"3wbbb","_k":"de6ed387"},{"t":"Substrate-level 4 · NADH 10 × 3 = 30 · FADH₂ 2 × 2 = 4 · total 32","why":"That adds to 38.","_n":"3xb8b","_k":"0c14cf9a"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"During hard exercise, a muscle (glycerol-phosphate shuttle, current values: 30 ATP per glucose) needs 600 ATP-units per second from aerobic respiration. How many glucose per second is that?","options":[{"t":"16.7","why":"That uses 36.","_n":"3yb9b","_k":"4db46526"},{"t":"20","why":"600 ÷ 30.","_n":"3zbeb","_k":"bc4fb82e"},{"t":"300","why":"That uses fermentation’s 2.","_n":"40bfb","_k":"4860a05d"},{"t":"18 750","why":"Divide, don’t multiply.","_n":"41bcb","_k":"13234aed"}]},"b":{"prompt":"A liver cell (malate–aspartate shuttle, current values: 32 ATP per glucose) needs 960 ATP-
