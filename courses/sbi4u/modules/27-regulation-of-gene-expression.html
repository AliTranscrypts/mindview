/* SBI4U 27: control ladder (Explore, hero, task), cell-types genome panel, Part 3 stations, Predict the output.

   thinner; protein brown --bio-carbon; activator --pen; repressor --bio-h; acetyl tags --bio-fadh; methyl tags --bio-e; phosphate

.gx-hero{max-width:440px;margin:0 auto}

y System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"2efa068a","content":{"id":"27-regulation-of-gene-expression","kind":"topic","title":"Regulation of gene expression","topic":"Regulation of Gene Expression","readyTopic":"regulation of gene expression","hero":{"headline":"Same DNA, different cells","text":"Your liver cells and nerve cells carry the same \u003cstrong>genome\u003c/strong>. They differ because each cell switches genes on and off at many points: how tightly the DNA is packed, which \u003cstrong>transcription factors\u003c/strong> are present, how the RNA is \u003cstrong>spliced\u003c/strong>, how long the mRNA lasts, and what happens to the protein afterwards.","fig":{"html":"\u003cdiv class=\"gx-hero\" id=\"gx-hero\" role=\"img\" aria-label=\"A control ladder beside one gene, with five rungs: chromatin, transcription, RNA processing, mRNA lifetime and translation, and protein changes. The gene, wound tightly on histone beads, loosens as acetyl tags appear. An activator lands on a distant enhancer and the DNA loops so it touches the promoter. RNA polymerase makes a teal pre-mRNA, which is spliced two ways into two teal mRNAs. A microRNA clips onto one mRNA, which fades. The other is translated into a brown protein that receives a phosphate tag and lights up as active.\">\u003c/div>"}},"goals":["I can name the levels at which a eukaryotic cell controls a gene, from chromatin to finished protein.","I can explain how chromatin packing (acetylation, methylation) and transcription factors (activators, repressors, enhancers) control transcription.","I can explain how alternative splicing, microRNAs and changes after translation control which protein is made and how much.","I can predict how a change at one level affects the amount and kind of protein a cell makes.","I can explain why cells with the same genome become different, using evidence (cloning, X inactivation).","I can apply gene regulation to cancer, hormones and medicine."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Transcription and splicing","goal":3,"prompt":"During RNA processing in eukaryotes, what is removed from pre-mRNA?","options":[{"t":"Introns","why":"Exons are kept and joined.","_n":"0767","_k":"2b055911"},{"t":"The start codon","why":"AUG is kept.","_n":"1777","_k":"ce2c2fa6"},{"t":"Exons","why":"Exons are the parts that are expressed.","_n":"2787","_k":"2d6ea736"},{"t":"The 5′ cap","why":"The cap is added, not removed.","_n":"3717","_k":"56b6b526"}],"hints":["Recall module 23.","Introns \u003cem>in\u003c/em>terrupt; exons are \u003cem>ex\u003c/em>pressed.","Introns."]},{"id":"w2","skill":"Transcription and splicing","goal":2,"prompt":"Which statement about a typical eukaryotic gene is correct?","options":[{"t":"It has no introns","why":"Most eukaryotic genes have introns.","_n":"4727","_k":"fd3c0b2e"},{"t":"It is translated in the nucleus","why":"Translation happens in the cytoplasm.","_n":"5737","_k":"0b264d56"},{"t":"It is part of an operon with several other genes","why":"Operons are mainly a bacterial arrangement.","_n":"6747","_k":"c5239596"},{"t":"It has its own promoter and is transcribed into its own mRNA","why":"Eukaryotic genes are usually controlled one at a time, each from its own promoter.","_n":"77d7","_k":"e199478c"}],"hints":["Compare with the lac operon.","Eukaryotic genes are usually controlled one at a time.","Its own promoter, its own mRNA."]},{"id":"w3","skill":"Operon logic","goal":2,"prompt":"In the lac operon, what does the repressor do?","options":[{"t":"It binds lactose in the medium","why":"It binds allolactose inside the cell.","_n":"87e7","_k":"3a8ca3a1"},{"t":"It helps RNA polymerase bind","why":"That’s CAP.","_n":"9494","_k":"5903acbc"},{"t":"It binds the operator and blocks RNA polymerase","why":"With the repressor on the operator, the polymerase can’t transcribe the genes.","_n":"a484","_k":"02cd5ee2"},{"t":"It splices the mRNA","why":"Bacteria don’t splice.","_n":"b474","_k":"91ca1209"}],"hints":["Recall module 26.","The repressor sits on a DNA site.","It blocks the polymerase."]},{"id":"w4","skill":"Operon logic","goal":4,"prompt":"A protein that \u003cstrong>increases\u003c/strong> transcription when it binds DNA is called…","options":[{"t":"An activator","why":"CAP is a bacterial example.","_n":"c464","_k":"c9994b36"},{"t":"A ribosome","why":"Ribosomes translate.","_n":"d454","_k":"23eb2f25"},{"t":"An operator","why":"The operator is DNA, not a protein.","_n":"e444","_k":"14b0b71d"},{"t":"A repressor","why":"Repressors decrease transcription.","_n":"f434","_k":"a005d269"}],"hints":["Think of CAP.","It helps RNA polymerase.","An activator."]},{"id":"w5","skill":"DNA packing","goal":2,"prompt":"In the nucleus, DNA is wrapped around proteins called…","options":[{"t":"Histones","why":"DNA plus histones = chromatin.","_n":"g424","_k":"03ba1e46"},{"t":"Centromeres","why":"A centromere is a region of a chromosome.","_n":"h414","_k":"b0020ffd"},{"t":"Enzymes","why":"Histones are packing proteins, not enzymes.","_n":"i404","_k":"34896c15"},{"t":"Ribosomes","why":"Ribosomes make proteins.","_n":"j2f4","_k":"3912b572"}],"hints":["The “beads on a string”.","The beads are protein spools.","Histones."]},{"id":"w6","skill":"DNA packing","goal":2,"prompt":"Why is tightly packed DNA hard to transcribe?","options":[{"t":"It is being replicated","why":"Packing isn’t replication.","_n":"k304","_k":"f4e63d26"},{"t":"Tightly packed DNA has no genes","why":"The genes are there, just hidden.","_n":"l2d4","_k":"5467fe76"},{"t":"It is single-stranded","why":"Packed DNA is still double-stranded.","_n":"m2e4","_k":"98543b9a"},{"t":"RNA polymerase and transcription factors can’t reach the promoter","why":"Packing hides the DNA, so the proteins that read it can’t touch it.","_n":"n334","_k":"8c3ce1c3"}],"hints":["Proteins need to touch the DNA to read it.","Packing hides the DNA.","They can’t reach it."]}],"refreshers":{"Transcription and splicing":"In eukaryotes, each gene has its own promoter. The pre-mRNA gets a 5′ cap and a poly-A tail, and introns are spliced out before the mRNA leaves the nucleus.","Operon logic":"In bacteria, repressors block and activators help RNA polymerase. Eukaryotes use the same two kinds of protein, at more places.","DNA packing":"DNA wraps around histones to form chromatin. Loosely packed chromatin can be read; tightly packed chromatin is silent."}}},"explore":{"heading":"Eukaryotic control panel","intro":"One gene, five levels of control. Set each switch and read how much protein the cell makes, and which one.","chalIntro":"Use the control panel to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","modelNote":"Transcription rate (pre-mRNA per hour) = 0 if the chromatin is closed; otherwise 10 × (4 if the activator is on) × (¼ if the repressor is on). Proteins per mRNA = 20, or 2 with the microRNA present (the mRNA is destroyed sooner). Proteins made per hour = transcription rate × proteins per mRNA. Real regulation isn’t a neat × 4 or × ¼: these are model numbers, and the point is which level each switch acts on.","cellBanner":"Same six genes in every nucleus. Different genes switched on.","predictions":[{"id":"p1","prompt":"Start: open chromatin, activator on (800 per hour). Change: the chromatin is set to closed (methylated). The activator is still in the cell. What happens to protein production?","options":[{"t":"Rises: the activator works harder","_n":"o344","_k":"6cf5327e"},{"t":"Halves to 400","_n":"p314","_k":"81897d80"},{"t":"Stays at 800","_n":"q324","_k":"1521f382"},{"t":"Drops to 0","_n":"r374","_k":"2a9dfad3"}],"explain":"Transcription factors can’t reach DNA that’s packed shut.","reveal":"The beads tightened; the activator couldn’t land, and transcription stopped.","start":{"c":"open","act":1,"rep":0,"iso":"A","mir":0,"phos":0,"dist":0},"change":{"c":"closed"}},{"id":"p2","prompt":"Start: open chromatin, no activator or repressor (10 pre-mRNA per hour, 200 proteins per hour). Change: the microRNA is present. What happens to transcription and to protein production?","options":[{"t":"Transcription drops; protein stays","_n":"s384","_k":"496e7ca6"},{"t":"Transcription stays at 10 per hour; protein drops to 20 per hour","_n":"t354","_k":"5f849ed3"},{"t":"Both drop to 0","_n":"u344","_k":"82c997a8"},{"t":"Nothing changes","_n":"v374","_k":"2766804c"}],"explain":"MicroRNAs act after transcription, on the mRNA.","reveal":"mRNAs are still made, but they’re blocked or destroyed sooner.","start":{"c":"open","act":0,"rep":0,"iso":"A","mir":0,"phos":0,"dist":0},"change":{"mir":1}},{"id":"p3","prompt":"Start: 200 proteins per hour, isoform A. Change: the splicing is set to isoform B. What changes?","options":[{"t":"The amount, not the kind","_n":"w364","_k":"d79f5c7c"},{"t":"The kind of protein, not the amount","_n":"x314","_k":"75b6407b"},{"t":"Neither","_n":"y304","_k":"f13bbd30"},{"t":"Both","_n":"z334","_k":"984b631c"}],"explain":"Same gene, same rate, different exons: a different protein.","reveal":"The gauge stayed at 200 and the label switched to isoform B, with exon 3 replacing exon 2.","start":{"c":"open","act":0,"rep":0,"iso":"A","mir":0,"phos":0,"dist":0},"change":{"iso":"B"}},{"id":"p4","prompt":"Start: activator on, enhancer 100 base pairs away (800 per hour). Change: the enhancer slider moves to 50 000 base pairs. What happens to output?","options":[{"t":"Nothing: still 800 per hour","_n":"10324","_k":"8da26647"},{"t":"Drops to 200","_n":"113d4","_k":"aab24623"},{"t":"Doubles","_n":"123c4","_k":"958d3f8b"},{"t":"Drops to 0","_n":"132b3","_k":"f7740411"}],"explain":"DNA bends and loops, so enhancers work from far away.","reveal":"The DNA loop grew, and the activator still touches the promoter.","start":{"c":"open","act":1,"rep":0,"iso":"A","mir":0,"phos":0,"dist":0},"change":{"dist":5}}],"challenges":[{"id":"tc1","goal":[2,4],"prompt":"Make 800 proteins per hour of isoform A.","why":"Open chromatin and the activator give 10 × 4 = 40 pre-mRNA per hour; with no microRNA, 40 × 20 = 800 proteins per hour of isoform A.","general":"Check the readout: you need 800 proteins per hour, and the protein must be isoform A.","named":{"mode":"Switch to \u003cstrong>Control panel\u003c/strong> mode first.","isoB":"Right amount, wrong protein: change the splicing.","rep":"The repressor cuts transcription back to 10 per hour."},"hints":["800 = 40 × 20.","40 pre-mRNA per hour needs the activator and no repressor.","Open, activator on, repressor off, no microRNA, isoform A."]},{"id":"tc2","goal":[3,4],"prompt":"Make isoform B at 20 proteins per hour \u003cstrong>without changing the transcription rate from 10 per hour\u003c/strong>.","why":"Transcription stays at 10 per hour; the microRNA cuts each mRNA’s output to 2 proteins, so 10 × 2 = 20 of isoform B. There are 2 ways to keep the rate at 10: no activator and no repressor, or both together.","general":"Check the readout: transcription must stay at 10 per hour, and you need 20 proteins per hour of isoform B.","named":{"mode":"Switch to \u003cstrong>Control panel\u003c/strong> mode first.","closed":"That stops transcription completely.","rep":"That changes transcription to 2.5 per hour."},"hints":["Which level cuts protein but not transcription?","20 = 10 × 2.","Add the microRNA; leave transcription at 10."]},{"id":"tc3","goal":[2,3,4],"stretch":true,"prompt":"The cell needs exactly 50 \u003cstrong>active\u003c/strong> proteins of isoform B per hour. Set the panel.","why":"The repressor alone gives 10 × ¼ = 2.5 pre-mRNA per hour, and with no microRNA 2.5 × 20 = 50. Isoform B, phosphorylated: active.","general":"Check the readout: you need 50 proteins per hour of isoform B, and they must be active.","named":{"mode":"Switch to \u003cstrong>Control panel\u003c/strong> mode first.","am":"40 × 2 = 80: close, but not 50.","phos":"50 per hour, but inactive.","isoA":"Right amount, wrong protein."},"hints":["List the possible transcription rates: 0, 2.5, 10, 40.","Which rate × 20 or × 2 gives 50?","2.5 × 20: repressor only, no microRNA, isoform B, phosphorylated."]}]},"part3":{"slug":"cell-types","name":"Cell types","heading":"Same genome, different cells","intro":"Explore showed the levels of control on one gene. Now the big question: why do cells with the same DNA end up so different? Three stations: the cloning evidence, X inactivation, and what happens when regulation fails.","st1":{"title":"Station 1: Check it with data: do cells lose genes?","panel":"In the 1960s, researchers put the nucleus of a frog’s intestinal cell into an egg whose own nucleus had been removed. In 1996, the nucleus of a sheep’s udder cell was used the same way, producing the sheep Dolly.","head":["Nucleus came from","Did a complete, normal animal develop?"],"rows":[["Frog egg cell (control)","Yes, usually"],["Frog intestinal cell","Yes, in a small fraction of attempts"],["Adult sheep udder cell","Yes, once in several hundred attempts"]],"claims":[{"id":"keep","t":"Specialized cells keep a complete genome","_n":"142c3","_k":"ffd6000c"},{"id":"lose","t":"Specialized cells lose the genes they don’t use","why":"A skin cell’s nucleus can still make a whole frog or sheep. Cells keep their genes; they \u003cstrong>express\u003c/strong> different ones.","_n":"152d3","_k":"2da617c1"},{"id":"egg","t":"Only egg cells contain a complete genome","why":"Rows 2 and 3: nuclei from an intestinal cell and an udder cell made whole animals.","_n":"162e3","_k":"eb16b043"},{"id":"none","t":"The nucleus has no effect on development","why":"The animal that grew matched the donor of the nucleus: the nucleus carried its genes.","_n":"172f3","_k":"47e4f909"}],"evNone":"Tap the rows of the table that support your claim.","evCtrl":"Row 1 is the control: an egg cell’s nucleus is expected to work. It can’t show whether a \u003cstrong>specialized\u003c/strong> cell kept its genes.","reasons":[{"id":"all","t":"A whole animal needs every gene, so none were lost","_n":"18303","_k":"29a9421c"},{"id":"egg","t":"The egg supplied the missing genes","why":"The egg’s own nucleus was removed: every gene came from the transplanted nucleus.","_n":"19313","_k":"7a70677f"},{"id":"add","t":"Cloning adds genes back to the nucleus","why":"Nuclear transfer moves a nucleus; it adds no genes.","_n":"1a323","_k":"29b35bf8"},{"id":"rare","t":"Success was rare, so most genes were lost","why":"Any success at all needs every gene. Rare success is about something else (see below).","_n":"1b333","_k":"813cd81a"}],"done":"✓ Claim: specialized cells keep a complete genome. Evidence: an intestinal-cell nucleus and an adult udder-cell nucleus each produced a complete, normal animal. Reasoning: a whole animal needs every gene, so none were lost.","rare":{"prompt":"So why did it work so rarely?","options":[{"id":"cant","t":"Eggs can’t use a nucleus from another cell","why":"Sometimes they can: rows 2 and 3 show it.","_n":"1c343","_k":"d7bd2ab8"},{"id":"miss","t":"Most specialized nuclei are missing genes","why":"A skin cell’s nucleus can still make a whole frog or sheep. Cells keep their genes; they \u003cstrong>express\u003c/strong> different ones.","_n":"1db13","_k":"bee5fc01"},{"id":"reset","t":"The old cell’s on/off patterns had to be reset","why":"The specialized cell’s chromatin and transcription factors were set for an udder or intestinal cell. The egg had to switch them back to an early-embryo pattern, and that rarely works completely.","_n":"1eb03","_k":"bb431602"},{"id":"mut","t":"The transplanted nucleus has mutations in every gene","why":"Mutation isn’t the cause: when it works, the animal is normal.","_n":"1faf3","_k":"00a7a479"}]},"ips":"In 2006, researchers found that adding just four transcription factors could turn adult cells back into stem cells, called \u003cstrong>induced pluripotent stem cells\u003c/strong>. Resetting the on/off pattern is regulation, not new genes."},"st2":{"title":"Station 2: X inactivation","text":"A female mammal has two X chromosomes. Early in development, one X in each cell is packed tightly into a \u003cstrong>Barr body\u003c/strong>, at random. The cells’ descendants keep the same choice.","cat":"Calico cats: a fur-colour gene on the X has an orange allele and a black allele. A cat with one of each shows patches, so a calico pattern needs two X chromosomes.","slider":"Cell divisions after inactivation"},"st3":{"title":"Station 3: When regulation fails (cancer)","acc":{"t":"Accelerator (proto-oncogene → oncogene)","text":"One mutated copy keeps the “divide” signal stuck on."},"brake":{"t":"Brake (tumour suppressor)","text":"One bad copy is usually covered by the good one; a second “hit” removes the brake."},"steps":["A normal cell: both proto-oncogene copies are normal, and both brake copies work. Division is controlled.","Hit 1: one tumour suppressor copy is lost. The other copy still brakes, so division stays controlled.","Hit 2: one proto-oncogene copy mutates into an oncogene. The accelerator is stuck on, but one working brake still holds.","Hit 3: the second tumour suppressor copy is lost. Accelerator stuck on, no brakes left: the cell divides out of control."],"banner":"Divides out of control"},"quickCheck":{"title":"Same genome, different cells quick check","summary":"Same genome, different cells quick check","items":[{"id":"q1","goal":5,"prompt":"Cloning from an udder cell shows that the cell…","choices":[{"t":"had only udder genes","fb":"A whole sheep needs every gene.","_n":"1gae3","_k":"2e2b1733"},{"t":"lost unused genes","fb":"A whole sheep needs every gene.","_n":"1hb53","_k":"6d936ce9"},{"t":"kept its whole genome","fb":"A whole sheep needs every gene.","_n":"1ib43","_k":"e28fb5d2"},{"t":"had no genes","fb":"A whole sheep needs every gene.","_n":"1jb33","_k":"01c3b60d"}]},{"id":"q2","goal":5,"prompt":"Why are calico cats almost always female?","choices":[{"t":"Females have more genes","fb":"Two X chromosomes, one silenced at random in each cell, give two colours.","_n":"1kb23","_k":"954d9ca9"},{"t":"The Y chromosome blocks colour","fb":"Two X chromosomes, one silenced at random in each cell, give two colours.","_n":"1lb93","_k":"60226281"},{"t":"Patches need two X chromosomes","fb":"Two X chromosomes, one silenced at random in each cell, give two colours.","_n":"1mb83","_k":"5b328342"},{"t":"Males can’t be orange","fb":"Two X chromosomes, one silenced at random in each cell, give two colours.","_n":"1nb73","_k":"6f8b742d"}]},{"id":"q3","goal":6,"prompt":"How many mutated copies of a proto-oncogene are usually enough to push a cell toward cancer?","choices":[{"t":"0","fb":"Gain of function: one stuck accelerator is enough.","_n":"1ob83","_k":"3158827b"},{"t":"1","fb":"Gain of function: one stuck accelerator is enough.","_n":"1pb53","_k":"9c8e893e"},{"t":"2","fb":"Gain of function: one stuck accelerator is enough.","_n":"1qb63","_k":"cce2e49b"},{"t":"4","fb":"Gain of function: one stuck accelerator is enough.","_n":"1rb33","_k":"07ec46f5"}]},{"id":"q4","goal":5,"prompt":"A Barr body is…","choices":[{"t":"an extra chromosome","fb":"It’s one X shut down by packing.","_n":"1sb43","_k":"dfd8ddc3"},{"t":"a mutated X","fb":"It’s one X shut down by packing.","_n":"1tb13","_k":"689065f1"},{"t":"a tightly packed, silenced X chromosome","fb":"It’s one X shut down by packing.","_n":"1ub23","_k":"c7406fe0"},{"t":"a ribosome cluster","fb":"It’s one X shut down by packing.","_n":"1vbf3","_k":"600f4d64"}]}]}},"practice":{"activities":[{"id":"which","type":"sorter","title":"Which level?","summary":"Which level?","goal":[1,2,3],"noun":"mechanism","txt":true,"instruction":"Ten mechanisms. Sort each one into the level of control where it acts.","boxes":[{"id":"b1","label":"Chromatin"},{"id":"b2","label":"Transcription"},{"id":"b3","label":"RNA processing"},{"id":"b4","label":"mRNA and translation"},{"id":"b5","label":"After translation"}],"wrongDefault":"Ask: is this happening to DNA packing, to transcription, to RNA, or to the protein?","items":[{"id":"i1","t":"Acetyl groups added to histones","_a":"EAdXQw==","why":"Acetylation loosens the chromatin."},{"id":"i2","t":"Methyl groups added to cytosines near a promoter","_a":"EAdXQw==","why":"Methylation helps pack the chromatin and silence the gene.","wrong":{"b2":"Methylation acts by packing the chromatin; it’s a chromatin-level control."}},{"id":"i3","t":"An activator binds an enhancer","_a":"EAdUQw==","why":"Activators on enhancers increase transcription."},{"id":"i4","t":"A repressor binds a silencer","_a":"EAdUQw==","why":"Repressors on silencers decrease transcription."},{"id":"i5","t":"Exon 3 is kept in muscle cells but skipped in nerve cells","_a":"EAdVQw==","why":"Alternative splicing happens during RNA processing."},{"id":"i6","t":"A microRNA pairs with an mRNA and it is destroyed","_a":"EAdSQw==","why":"The microRNA acts on the finished mRNA.","wrong":{"b2":"MicroRNAs act on the \u003cstrong>mRNA\u003c/strong>: they block its translation or have it destroyed. The gene and transcription are untouched."}},{"id":"i7","t":"A short poly-A tail makes an mRNA break down sooner","_a":"EAdSQw==","why":"The poly-A tail protects the mRNA; a short tail means a shorter mRNA lifetime.","hints":["What does a poly-A tail protect?","The mRNA.","mRNA and translation."]},{"id":"i8","t":"Proinsulin is cut to make active insulin","_a":"EAdTQw==","why":"Proinsulin is already a protein, so cutting it happens after translation.","wrong":{"b3":"Proinsulin is a protein; cutting it happens after translation."}},{"id":"i9","t":"A phosphate group switches an enzyme on","_a":"EAdTQw==","why":"Phosphorylation changes a finished protein."},{"id":"i10","t":"A protein tagged with ubiquitin is broken down","_a":"EAdTQw==","why":"Ubiquitin tags a finished protein for destruction."}]},{"id":"output","type":"custom","title":"Predict the output","summary":"Predict the output","goal":[4,6],"instruction":"Six items: type a number or choose an answer. Items 3–6 are non-routine (★); 5 and 6 go beyond the Final Check.","how":"For a number, type it and press Check. For choices, pick one and press Check.","items":[{"id":"o1","kind":"num","goal":4,"prompt":"Panel: open, activator on, repressor on, no microRNA. Proteins per hour?","_a":"AFVW","display":"200 proteins per hour","unit":"proteins per hour","why":"10 × 4 × ¼ = 10 pre-mRNA per hour, and 10 × 20 = 200.","wrong":[{"match":800,"fb":"The repressor divides transcription by 4: 10 × 4 × ¼ = 10."}]},{"id":"o2","kind":"num","goal":4,"prompt":"Panel: open, repressor on, microRNA present. Proteins per hour?","_a":"Bw==","display":"5 proteins per hour","unit":"proteins per hour","why":"10 × ¼ = 2.5 pre-mRNA per hour, and 2.5 × 2 = 5.","wrong":[{"match":50,"fb":"The microRNA cuts proteins per mRNA to 2: 2.5 × 2 = 5."}]},{"id":"o3","kind":"mc","goal":4,"star":true,"prompt":"Panel: start at 800 per hour. Which \u003cstrong>single\u003c/strong> switch change gives 80?","options":[{"t":"Add the microRNA","why":"Transcription stays at 40 per hour; proteins per mRNA fall to 2: 40 × 2 = 80.","_n":"1wc03","_k":"eb913b2b"},{"t":"Turn the activator off","why":"That gives 10 × 20 = 200.","_n":"1xbd3","_k":"7d1808a8"},{"t":"Add the repressor","why":"That gives 200.","_n":"1ybc3","_k":"4ac189b6"},{"t":"Close the chromatin","why":"That gives 0.","_n":"1zbf3","_k":"61467bc8"}]},{"id":"o4","kind":"num","goal":[3,4],"star":true,"prompt":"A gene has exons 1–6. Exons 1 and 6 are always kept; 2, 3, 4 and 5 can each be kept or skipped. How many different mRNAs are possible?","_a":"A1M=","display":"16 mRNAs","unit":"mRNAs","why":"Each optional exon doubles the count: 2⁴ = 16.","wrong":[{"match":4,"fb":"Each optional exon doubles the count: 2⁴. Alternative splicing keeps different exons, so one gene can make several proteins."}],"hints":["For each optional exon, how many choices?","Kept or skipped: 2.","2 × 2 × 2 × 2 = 16."]},{"id":"o5","kind":"mc","goal":6,"star":true,"prompt":"Estrogen enters a cell and binds a receptor protein, which then binds DNA near certain genes. Which level of control is this, and what kind of protein is the receptor acting as?","options":[{"t":"Translation; a ribosome protein","why":"The receptor binds DNA, so it acts on transcription.","_n":"20be3","_k":"f266fde0"},{"t":"After translation; an enzyme that adds phosphate","why":"It changes which genes are transcribed, not finished proteins.","_n":"21c13","_k":"547a95aa"},{"t":"Transcription; a transcription factor (activator)","why":"The hormone–receptor pair binds DNA and switches on transcription of its target genes.","_n":"22c03","_k":"60f4bd5b"},{"t":"Chromatin; a histone","why":"The receptor binds DNA near certain genes and switches them on; it isn’t a packing protein.","_n":"23c33","_k":"08a7fc46"}]},{"id":"o6","kind":"mc","goal":6,"star":true,"prompt":"A cell has one mutant copy of a tumour suppressor gene and no other mutations. Over many divisions, which single event is most likely to start uncontrolled division?","options":[{"t":"A microRNA that blocks the mutant copy’s mRNA","why":"The mutant copy already doesn’t work; the brake comes from the good copy.","_n":"24c23","_k":"66e9db68"},{"t":"Another mutation in the same copy","why":"The good copy still works; it has to be lost. An oncogene is a stuck accelerator: one copy is enough. A tumour suppressor is a brake: usually both copies must fail.","_n":"25b53","_k":"6a5d50c1"},{"t":"Loss or mutation of the second copy of that tumour suppressor","why":"With both brake copies gone, nothing slows division.","_n":"26b43","_k":"35d393a0"},{"t":"Nothing more: one mutant copy already causes uncontrolled division","why":"One working copy can still apply the brake.","_n":"27335","_k":"2b265b20"}],"hints":["How many working copies of the brake gene are left?","One.","Losing it removes the brake."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Noor","how":"","instruction":"Noor made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"A gene’s promoter region is heavily methylated, but its activator is present. Predict expression.","steps":["Methyl groups on DNA near a promoter are linked to tightly packed chromatin.","The activator is present in the nucleus.","Activators can always find their enhancer, so it binds and the gene is transcribed.","So the gene is expressed at a high level."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","This follows from step 3."],"fixes":[{"t":"The packed chromatin hides the enhancer and promoter, so the activator can’t bind; the gene stays silent.","why":"Transcription factors can’t reach DNA that is packed shut. The chromatin has to be opened first.","_n":"28345","_k":"e59a909f"},{"t":"The activator removes the methyl groups.","why":"Transcription factors can’t reach DNA that is packed shut. The chromatin has to be opened first.","_n":"29355","_k":"aaf2f3bc"},{"t":"Step 3 is correct.","why":"Closed chromatin overrides the activator.","_n":"2a365","_k":"20c90377"},{"t":"The gene is expressed at a medium level.","why":"Transcription factors can’t reach DNA that is packed shut. The chromatin has to be opened first.","_n":"2b2f5","_k":"7ec757cf"}],"hints":["Can a protein bind DNA it can’t reach?","No.","Silent."]},{"id":"e2","goal":3,"task":"Explain how a microRNA reduces the amount of a protein.","steps":["A microRNA is a short RNA, about 22 nucleotides long.","It base-pairs with a matching stretch of DNA in the gene.","This blocks RNA polymerase, so no mRNA is made."],"_a":"Aw==","stepFb":["Step 1 is correct.","","This follows from step 2."],"fixes":[{"t":"It replaces the mRNA in the ribosome.","why":"MicroRNAs act on the \u003cstrong>mRNA\u003c/strong>: they block its translation or have it destroyed. The gene and transcription are untouched.","_n":"2c305","_k":"84f84017"},{"t":"It binds the protein and destroys it.","why":"MicroRNAs act on the \u003cstrong>mRNA\u003c/strong>: they block its translation or have it destroyed. The gene and transcription are untouched.","_n":"2d315","_k":"58d46a71"},{"t":"Step 2 is correct.","why":"Transcription is unaffected: the target is the mRNA.","_n":"2e325","_k":"c1fc3adf"},{"t":"It base-pairs with a matching stretch of the \u003cstrong>mRNA\u003c/strong>, which blocks translation or leads to the mRNA being destroyed.","why":"MicroRNAs act on the \u003cstrong>mRNA\u003c/strong>: they block its translation or have it destroyed. The gene and transcription are untouched.","_n":"2f3b5","_k":"6f05d28b"}],"hints":["What does a microRNA pair with?","An RNA.","The mRNA."]},{"id":"e3","goal":6,"task":"Explain the difference between an oncogene and a tumour suppressor gene.","steps":["Proto-oncogenes normally encourage cells to divide when signalled.","A mutation can make one of them always active: an oncogene.","Tumour suppressor genes normally slow or stop division.","One mutated copy of a tumour suppressor is enough to remove the brake.","So tumour suppressors and oncogenes behave the same way."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","This follows from step 4."],"fixes":[{"t":"Usually \u003cstrong>both\u003c/strong> copies of a tumour suppressor must be lost, because one working copy can still apply the brake.","why":"An oncogene is a stuck accelerator: one copy is enough. A tumour suppressor is a brake: usually both copies must fail.","_n":"2g3c5","_k":"cbd58cd3"},{"t":"Oncogenes need both copies mutated.","why":"An oncogene is a stuck accelerator: one copy is enough. A tumour suppressor is a brake: usually both copies must fail.","_n":"2h395","_k":"1d4f7225"},{"t":"Tumour suppressors cause division.","why":"An oncogene is a stuck accelerator: one copy is enough. A tumour suppressor is a brake: usually both copies must fail.","_n":"2i385","_k":"e6223fd5"},{"t":"Step 4 is correct.","why":"One good brake is usually enough.","_n":"2j375","_k":"0f689535"}],"hints":["How many copies of each gene does a cell have?","Two.","One working brake still works."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the control panel: that closed chromatin beats an activator, or that an enhancer works from 50 000 base pairs away?"},{"id":"j2","q":"In your own words, why are your liver cells and nerve cells different if they have the same DNA?"},{"id":"j3","q":"Explain to a friend the levels of gene control, from chromatin to the finished protein, using one example at each level."},{"id":"j4","q":"Which level of control is hardest for you to remember or explain? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"What does adding acetyl groups to histones usually do?","options":[{"t":"Packs the chromatin tighter, silencing the genes","why":"That describes DNA methylation and deacetylation.","_n":"2k365","_k":"3894a05d"},{"t":"Cuts the DNA into pieces","why":"Acetylation doesn’t cut DNA.","_n":"2l355","_k":"02b89555"},{"t":"Loosens the chromatin, so the genes there are easier to transcribe","why":"Acetylated histones hold the DNA loosely, so transcription factors and RNA polymerase can reach it.","_n":"2m345","_k":"48102ef2"},{"t":"Blocks translation of the mRNA","why":"It acts on chromatin, before transcription.","_n":"2n335","_k":"5aa41995"}]},"b":{"prompt":"What does adding methyl groups to the DNA near a promoter usually do?","options":[{"t":"Changes the gene’s base sequence","why":"Methylation tags bases; it doesn’t change A, T, G, C.","_n":"2o325","_k":"9775443d"},{"t":"Removes introns","why":"That’s splicing.","_n":"2p415","_k":"ac0e7830"},{"t":"Opens the chromatin, so the gene is transcribed more","why":"That’s histone acetylation.","_n":"2q405","_k":"9d692020"},{"t":"Helps pack the chromatin and silence the gene","why":"Methylated DNA near a promoter is linked to tightly packed, silent chromatin.","_n":"2rf43","_k":"da07ff48"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is an enhancer?","options":[{"t":"A sequence that must sit right beside the promoter","why":"DNA loops, so an activator on an enhancer thousands of base pairs away can still reach the promoter.","_n":"2sf33","_k":"aa632d0d"},{"t":"A protein that speeds up translation","why":"An enhancer is DNA.","_n":"2tf63","_k":"36c34b6f"},{"t":"An intron that is spliced out","why":"Enhancers are control sites, not introns.","_n":"2uf53","_k":"b86f3bdd"},{"t":"A DNA sequence, sometimes far from the gene, where activator proteins bind to increase transcription","why":"The DNA loops so the activator can reach the promoter.","_n":"2vf03","_k":"988d5e30"}]},"b":{"prompt":"What is a silencer?","options":[{"t":"The stop codon at the end of a gene","why":"Stop codons end translation.","_n":"2wef3","_k":"064b4c71"},{"t":"A protein that packs histones","why":"A silencer is DNA.","_n":"2xf23","_k":"5cebeadf"},{"t":"A microRNA","why":"MicroRNAs act on mRNA.","_n":"2yf13","_k":"73a50dd5"},{"t":"A DNA sequence where repressor proteins bind to decrease transcription","why":"Silencers are the repressors’ landing sites.","_n":"2zec3","_k":"380c2b22"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"How does a microRNA reduce the amount of a protein?","options":[{"t":"It changes the gene’s sequence","why":"It doesn’t edit DNA.","_n":"30eb3","_k":"02d9d79d"},{"t":"It pairs with the protein’s mRNA, blocking translation or having the mRNA destroyed","why":"The microRNA’s target is the mRNA; the gene and transcription are untouched.","_n":"31ee3","_k":"da8e18c0"},{"t":"It cuts the protein into pieces","why":"It acts on mRNA, not protein.","_n":"32ef3","_k":"5e6eecfb"},{"t":"It binds the gene and blocks RNA polymerase","why":"MicroRNAs act on the \u003cstrong>mRNA\u003c/strong>: they block its translation or have it destroyed. The gene and transcription are untouched.","_n":"33ec3","_k":"7d7f18d3"}]},"b":{"prompt":"Which level of control does a microRNA work at?","options":[{"t":"Chromatin packing","why":"MicroRNAs act on the \u003cstrong>mRNA\u003c/strong>: they block its translation or have it destroyed. The gene and transcription are untouched.","_n":"34ed3","_k":"bdd73d43"},{"t":"After transcription: on the mRNA","why":"It pairs with the mRNA, blocking translation or having the mRNA destroyed.","_n":"35f23","_k":"882eb9de"},{"t":"After the protein is made","why":"It stops the protein being made.","_n":"36f33","_k":"63ddaf63"},{"t":"The promoter","why":"MicroRNAs act on the \u003cstrong>mRNA\u003c/strong>: they block its translation or have it destroyed. The gene and transcription are untouched.","_n":"37f03","_k":"7c6ac291"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"In a skin cell, the insulin gene’s chromatin is tightly packed and methylated. A scientist adds the activator proteins that turn insulin on in pancreas cells. What is the most likely result?","options":[{"t":"The skin cell’s insulin gene is missing, so nothing happens","why":"The gene is there; it’s packed away.","_n":"38f13","_k":"c7d74847"},{"t":"Insulin is made at pancreas levels","why":"Transcription factors can’t reach DNA that is packed shut. The chromatin has to be opened first.","_n":"39e63","_k":"155f6a8c"},{"t":"Little or no insulin is made, because the activators can’t reach the packed DNA","why":"Closed chromatin overrides the activators.","_n":"3ae73","_k":"edbd4732"},{"t":"Insulin is made, but spliced differently","why":"Without transcription there’s nothing to splice.","_n":"3be83","_k":"f8e522a1"}]},"b":{"prompt":"A drug blocks the enzymes that remove acetyl groups from histones, so more histones stay acetylated. What is the most likely effect on many silenced genes?","options":[{"t":"Some of them become more accessible and are transcribed more","why":"Acetylated histones loosen the chromatin.","_n":"3ce73","_k":"aa8489dc"},{"t":"They are silenced even more strongly","why":"Acetylation opens chromatin.","_n":"3de63","_k":"eb1a6c15"},{"t":"Their DNA sequences change","why":"Acetylation changes packing, not sequence.","_n":"3ee53","_k":"aff232ff"},{"t":"Their mRNAs are destroyed","why":"The drug acts on chromatin.","_n":"3fe43","_k":"c0b32879"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A gene has 5 exons. Exons 1 and 5 are always kept; exons 2, 3 and 4 can each be kept or skipped. How many different mRNAs can it make?","options":[{"t":"1","why":"Alternative splicing keeps different exons, so one gene can make several proteins.","_n":"3ge33","_k":"28043937"},{"t":"3","why":"Each optional exon gives 2 choices, and choices multiply.","_n":"3he23","_k":"fc2f7715"},{"t":"5","why":"Count combinations, not exons.","_n":"3ie13","_k":"c499a9c7"},{"t":"8","why":"2 × 2 × 2.","_n":"3jf03","_k":"b3dee07b"}]},"b":{"prompt":"A gene has 6 exons. Exons 1 and 6 are always kept; exons 2 to 5 can each be kept or skipped. How many different mRNAs can it make?","options":[{"t":"1","why":"Alternative splicing keeps different exons, so one gene can make several proteins.","_n":"3kef3","_k":"65bb6bbe"},{"t":"4","why":"Choices multiply.","_n":"3l623","_k":"a2d5824c"},{"t":"8","why":"There are four optional exons, not three.","_n":"3m633","_k":"9442d5e8"},{"t":"16","why":"2⁴.","_n":"3n643","_k":"e0836b9b"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Why can a single mutated copy of a proto-oncogene push a cell toward cancer, while a tumour suppressor usually needs both copies mutated?","options":[{"t":"Tumour suppressors are on the X chromosome","why":"They’re on many chromosomes.","_n":"3o653","_k":"70f33b6c"},{"t":"Oncogenes have more copies in the genome","why":"Both kinds have two copies.","_n":"3p5e3","_k":"0e491f3e"},{"t":"The oncogene’s protein is always active, which one copy can do; a tumour suppressor’s one remaining good copy can still apply the brake","why":"An oncogene is a stuck accelerator: one copy is enough. A tumour suppressor is a brake: usually both copies must fail.","_n":"3q5f3","_k":"5893f067"},{"t":"It’s the other way round","why":"An oncogene is a stuck accelerator: one copy is enough. A tumour suppressor is a brake: usually both copies must fail.","_n":"3r603","_k":"bc357af0"}]},"b":{"prompt":"A person inherits one non-working copy of a tumour suppressor gene. Why is their cancer risk higher than average?","options":[{"t":"Only one more mutation, in the remaining good copy, is needed to remove the brake in a cell","why":"Every cell already starts with one brake copy gone.","_n":"3s613","_k":"5b49792f"},{"t":"Their oncogenes are active","why":"This is about a tumour suppressor.","_n":"3t6a3","_k":"612254e3"},{"t":"They already have cancer","why":"One working copy still controls division.","_n":"3u6b3","_k":"51969af1"},{"t":"The bad copy makes extra growth signals","why":"A tumour suppressor’s loss removes a brake; it doesn’t add a signal.","_n":"3v5c3","_k":"2709a602"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why a liver cell and a nerve cell in one person are so different?","options":[{"t":"“They come from different fertilized eggs.”","why":"All your cells come from one zygote.","_n":"3w5b3","_k":"be16b20e"},{"t":"“They contain the same genome but express different sets of genes, controlled by chromatin packing, transcription factors and other levels of regulation.”","why":"It says what’s the same (the genome), what differs (which genes are expressed) and how (the levels of control).","_n":"3x5e3","_k":"c60bd629"},{"t":"“The liver cell has liver genes and the nerve cell has nerve genes.”","why":"A skin cell’s nucleus can still make a whole frog or sheep. Cells keep their genes; they \u003cstrong>express\u003c/strong> different ones.","_n":"3y5d3","_k":"1e8b4742"},{"t":"“Mutations made them different.”","why":"Differences come from regulation, not mutation.","_n":"3z603","_k":"8c84cb68"}]},"b":{"prompt":"Which is the best explanation of what Dolly the sheep showed?","options":[{"t":"“Udder cells contain only udder genes.”","why":"A skin cell’s nucleus can still make a whole frog or sheep. Cells keep their genes; they \u003cstrong>express\u003c/strong> different ones.","_n":"405f3","_k":"55150b50"},{"t":"“Cloning changes a cell’s DNA.”","why":"The DNA came unchanged from the udder cell.","_n":"41623","_k":"fe7ac7d4"},{"t":"“A specialized adult cell still holds a complete genome; its gene-expression pattern could be reset to make a whole animal.”","why":"It names the evidence (a whole animal) and what it shows (a complete genome, with its pattern reset).","_n":"42613","_k":"de2d34c3"},{"t":"“Every cell can easily become any other cell.”","why":"Success was rare: resetting is hard.","_n":"43643","_k":"2ce87df0"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which flow chart lists the levels of eukaryotic gene control in the order a gene passes through them?","options":[{"t":"Transcription → chromatin packing → translation → RNA processing → protein changes","why":"Chromatin must open before transcription, and processing comes before translation.","_n":"44633","_k":"40dbc5bc"},{"t":"Translation → transcription → RNA processing → chromatin","why":"Information flows DNA → RNA → protein.","_n":"45763","_k":"fb0ed4e3"},{"t":"Operator → promoter → structural genes","why":"That’s a bacterial operon.","_n":"46773","_k":"0e1eb7d9"},{"t":"Chromatin packing → transcription → RNA processing → mRNA lifetime and translation → changes to the protein","why":"The DNA must be open before it’s transcribed; the RNA is processed before it’s translated; the protein is changed last.","_n":"47743","_k":"5bc2f9ac"}]},"b":{"prompt":"Which statement correctly compares gene control in bacteria and eukaryotes?","options":[{"t":"“Eukaryotes control genes only at transcription.”","why":"They use many more levels.","_n":"48753","_k":"b9d73431"},{"t":"“Bacteria mainly switch transcription on and off (often for whole operons); eukaryotes control genes one by one, at several levels from chromatin to finished protein.”","why":"Eukaryotic genes each have their own promoter and are controlled one by one, at many levels.","_n":"49723","_k":"9cdedaf8"},{"t":"“Both use operons for most genes.”","why":"Eukaryotic genes each have their own promoter and are controlled one by one, at many levels.","_n":"4a733","_k":"e3fe80ca"},{"t":"“Bacteria control genes with splicing.”","why":"Bacteria don’t splice.","_n":"4b703","_k":"29d5b6a6"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Calico cats have patches of orange and black fur. Why are calico cats almost always female?","options":[{"t":"Females have more fur-colour genes on their autosomes","why":"The gene is on the X.","_n":"4c713","_k":"d088224e"},{"t":"The fur-colour gene is on the X chromosome; a female with one orange allele and one black allele silences one X at random in each cell, giving patches","why":"Each patch is a group of cells descended from one cell that kept the same active X.","_n":"4d6e3","_k":"99ed28e1"},{"t":"The Y chromosome blocks orange fur","why":"Y doesn’t carry this gene.","_n":"4e6f3","_k":"40d89b44"},{"t":"Males silence both X chromosomes","why":"Males have one X, and it stays active.","_n":"4ff02","_k":"7c39782a"}]},"b":{"prompt":"A woman carries one normal and one non-working allele of an X-linked gene needed for sweat glands. She has patches of skin with sweat glands and patches without. Why?","options":[{"t":"Her skin cells lost the gene in some patches","why":"A skin cell’s nucleus can still make a whole frog or sheep. Cells keep their genes; they \u003cstrong>express\u003c/strong> different ones.","_n":"4gef2","_k":"d94cdf90"},{"t":"In each patch, a different X chromosome was silenced early in development, and its cells kept that choice","why":"Where the X with the normal allele stayed active, sweat glands formed.","_n":"4hee2","_k":"340c589f"},{"t":"Her sweat glands have different DNA","why":"A skin cell’s nucleus can still make a whole frog or sheep. Cells keep their genes; they \u003cstrong>express\u003c/strong> different ones.","_n":"4ied2","_k":"32b9b490"},{"t":"The non-working allele is dominant in some patches","why":"Patchiness comes from X inactivation, not dominance.","_n":"4jf42","_k":"ed5f15ea"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Some drugs for certain blood cancers block the enzymes that add methyl groups to DNA. How could this help?","options":[{"t":"It mutates oncogenes back to normal","why":"It doesn’t change base sequences.","_n":"4kf32","_k":"eeb29990"},{"t":"It destroys the cancer cells’ DNA","why":"It changes tags, not sequence.","_n":"4lf22","_k":"e8cb24f2"},{"t":"It stops all transcription","why":"It would increase transcription of silenced genes.","_n":"4mf12","_k":"5b4f2c5c"},{"t":"Tumour suppressor genes silenced by methylation may be switched back on, restoring their brakes","why":"Less methylation can reopen the chromatin around silenced brake genes.","_n":"4ne82","_k":"3591ab5c"}]},"b":{"prompt":"A research drug blocks the enzymes that remove acetyl groups from histones in cancer cells. Why might it help?","options":[{"t":"More open chromatin can let silenced tumour suppressor genes be transcribed again","why":"Acetylated histones loosen the chromatin around silenced genes.","_n":"4oe72","_k":"fdf88eba"},{"t":"It removes the cancer cells’ oncogenes","why":"It changes packing, not genes.","_n":"4pea2","_k":"c2aded08"},{"t":"It blocks microRNAs","why":"It acts on chromatin.","_n":"4qeb2","_k":"f2b1959e"},{"t":"It packs the DNA tighter so cancer cells can’t divide","why":"It does the opposite.","_n":"4rec2","_k":"ed1d323c"}]}}]},"task":{"title":"Program a cell","summary":"Program a cell","statement":"\u003cp>Use the control panel to program Gene X. The cell needs a moderate supply of the \u003cstrong>active isoform B\u003c/strong> protein. Meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"gx-conds\">\u003cli>The cell makes between 50 and 300 proteins per hour (inclusive).\u003c/li>\u003cli>The protein made is isoform B.\u003c/li>\u003cli>The protein is active (phosphorylated).\u003c/li>\u003c/ol>","checks":["Between 50 and 300 per hour","Isoform B","Active protein"],"tips":["List the four possible transcription rates when the chromatin is open: 2.5, 10, 40, and 10 again (activator and repressor together).","Multiply each by 20 (no microRNA) or by 2 (microRNA). Which results land between 50 and 300?","Exons 1-3-4 make isoform B; a phosphate switches it on."],"success":"Your cell is programmed!","more":"There are 4 answers. Can you find another?","explainPrompt":"Explain how two of your answers reach their output through different levels of control.","vocab":"Use the words chromatin, activator, repressor, microRNA, alternative splicing and phosphorylation.","after3":"Two very different settings both give 200. Cells often have more than one way to reach the same output.","afterAt":4},"cards":[["Chromatin","DNA wrapped around histones; loose = readable, tight = silent."],["Histone acetylation","Opens chromatin; increases transcription."],["DNA methylation","Methyl tags on cytosines; helps silence genes."],["Transcription factor","A protein that binds DNA to control transcription (activator or repressor)."],["Enhancer","DNA site for activators; can be far from the gene (DNA loops)."],["Alternative splicing","Keeping different exons: one gene, several proteins."],["MicroRNA","Short RNA that pairs with mRNA to block translation or destroy it."],["After translation","Cutting (proinsulin → insulin), phosphorylation, ubiquitin tagging for breakdown."],["Same genome, different cells","Cells differ by which genes they express, not which genes they have."],["X inactivation","One X per female cell is packed into a Barr body at random; gives patches."],["Oncogene","Over-active version of a growth gene; one mutant copy is enough."],["Tumour suppressor","A “brake” gene; usually both copies must fail."]]}};</script>
