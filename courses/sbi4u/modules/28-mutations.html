.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;

--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}

--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}

.bio-chem{white-space:nowrap}
/* SBI4U 28 Mutations. Colour roles (plan §5): coding DNA --ink-2, template --ink, mRNA teal (--bio-nadh), amino acids brown

.mu-plates{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.mu-pl{margin:0;width:118px;text-align:center}
.mu-plate{fill:var(--paper);stroke:var(--ink-2);stroke-width:2}
.mu-col1{fill:var(--ink)}
.mu-cer{border-top:1px solid var(--rule);padding:10px 0 4px}
.mu-cer .mu-row{margin-bottom:6px}
/* Practice 2 */
.mu-seqin{width:5.5em;font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;text-transform:uppercase}
.mu-follow{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}
/* Task */
.mu-conds{margin:.4em 0 0}
.mu-slot{border:1px solid var(--rule);border-radius:8px;padding:8px 12px 4px;margin:0 0 10px}
.mu-slot legend{font-weight:700;padding:0 4px}
.mu-sel{min-height:40px;font-size:.95rem;border:1.5px solid var(--ink-2);border-radius:6px;background:var(--sheet);color:var(--ink);padding:0 6px}
.mu-tpv .mu-gene{--mu-w:22px;gap:10px 6px}
.mu-tread{margin-top:10px}
@media (max-width:520px){.mu-pg,.mu-gene{--mu-w:24px}.mu-gene{gap:10px 6px}.mu-el2,.mu-chl{min-width:0}.mu-tpv .mu-gene{--mu-w:20px}}

tabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"1e76311e","content":{"id":"28-mutations","kind":"topic","title":"Mutations","topic":"Mutations","readyTopic":"mutations","hero":{"eq":"\u003cspan class=\"mu-sq\">5′-ATG CCA G\u003cb class=\"mu-heqb\">A\u003c/b>G TGG AAA TGC TAA-3′\u003c/span>\u003cspan class=\"mu-heqp\">Met–Pro–Glu–Trp–Lys–Cys\u003c/span>","eqLabel":"Coding strand 5′ ATG CCA GAG TGG AAA TGC TAA 3′, coding Met, Pro, Glu, Trp, Lys, Cys. The A in GAG is highlighted: change me.","eqSize":"sm","headline":"One letter, three outcomes","text":"Change one base in a gene and the protein might not change at all (\u003cstrong>silent\u003c/strong>), might get one different amino acid (\u003cstrong>missense\u003c/strong>), or might stop short (\u003cstrong>nonsense\u003c/strong>). Add or remove a base and the whole reading \u003cstrong>frame\u003c/strong> can shift. \u003cstrong>Mutagens\u003c/strong> such as UV light, X-rays and some chemicals make these changes more likely.","fig":{"html":"\u003cdiv class=\"mu-hero\" id=\"mu-hero\" role=\"img\" aria-label=\"The gene ATG CCA GAG TGG AAA TGC TAA sits above its protein, Met–Pro–Glu–Trp–Lys–Cys. First the A of GAG flips to T: the codon becomes GTG and Glu becomes Val, a missense change. Then an extra A drops in after ATG: the codon dividers slide one place and every amino acid after Met changes. Last, UV light joins two neighbouring thymines into a dimer, and a repair enzyme cuts it out and the gap is refilled.\">\u003c/div>"}},"goals":["I can classify point mutations as silent, missense or nonsense, and insertions or deletions as frameshift or in-frame.","I can predict the protein made from a mutated DNA sequence using the codon table.","I can explain how UV light, ionizing radiation and chemical mutagens change DNA, and how repair can undo some damage.","I can work backwards from a changed protein to the DNA change that caused it.","I can describe chromosomal mutations and the difference between germ-line and somatic mutations.","I can apply mutations to real cases (sickle-cell anemia, cystic fibrosis) and evaluate mutagen-testing data."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Decoding","goal":2,"prompt":"The coding strand reads \u003cspan class=\"mu-sq\">5′-ATG TGG-3′\u003c/span>. What are the first two amino acids?","options":[{"t":"Met–Trp","why":"mRNA \u003cspan class=\"mu-sq\">AUG UGG\u003c/span>.","_n":"0b0b","_k":"831a735f"},{"t":"Met–stop","why":"UGA is the stop; UGG is Trp.","_n":"1b1b","_k":"20e7ab50"},{"t":"Tyr–Thr","why":"That treats the template as the message.","_n":"2b2b","_k":"a9e233c4"},{"t":"Met–Cys","why":"UGG is Trp; Cys is UGU or UGC.","_n":"3abb","_k":"b195c298"}],"hints":["The mRNA matches the coding strand with U for T.","\u003cspan class=\"mu-sq\">AUG UGG\u003c/span>.","Met–Trp."]},{"id":"w2","skill":"Decoding","goal":2,"prompt":"How many codons code for glutamic acid (Glu)?","options":[{"t":"1","why":"There are two.","_n":"4acb","_k":"3553f526"},{"t":"4","why":"GAU and GAC are Asp.","_n":"5adb","_k":"6fc6ea04"},{"t":"2 (GAA and GAG)","why":"GAA and GAG both code Glu.","_n":"6aeb","_k":"5c7b6b81"},{"t":"6","why":"Six is for Leu, Ser or Arg.","_n":"7a7b","_k":"e9e78b7d"}],"hints":["Find the GA_ box.","It’s split between Asp and Glu.","GAA, GAG."]},{"id":"w3","skill":"Reading frames","goal":1,"prompt":"Why does the ribosome read mRNA in groups of three?","options":[{"t":"Each codon is three bases, and reading starts at AUG, which sets the frame","why":"Three-base codons, read in order from AUG.","_n":"8a8b","_k":"694baf62"},{"t":"The ribosome reads any three bases it likes","why":"The frame is fixed by the start codon.","_n":"9714","_k":"9487a945"},{"t":"Because mRNA has three strands","why":"mRNA is single-stranded.","_n":"a704","_k":"ac22387c"},{"t":"Each base codes one amino acid","why":"Then there’d be only 4 amino acids.","_n":"b6f4","_k":"32569f2e"}],"hints":["How many bases are in a codon?","Where does reading begin?","Three-base codons from AUG."]},{"id":"w4","skill":"Reading frames","goal":1,"prompt":"THE CAT ATE THE RAT. Remove the first E. Reading in threes from the start, what do you get?","options":[{"t":"THC ATA TET HER AT","why":"Every word after the change is scrambled: a frameshift.","_n":"c6e4","_k":"fb64565b"},{"t":"TH CAT ATE THE RAT","why":"Reading in threes doesn’t skip the gap.","_n":"d6d4","_k":"ae894432"},{"t":"HEC ATA TET HER AT","why":"The first letter is still T.","_n":"e6c4","_k":"fdc8d8d8"},{"t":"THE CAT ATE THE RAT","why":"Something was removed.","_n":"f6b4","_k":"605c2dd6"}],"hints":["Write the letters without the E.","THCATATETHERAT.","Group in threes: THC ATA TET HER AT."]},{"id":"w5","skill":"DNA repair","goal":3,"prompt":"What does DNA polymerase’s proofreading do?","options":[{"t":"Prevents all mutations","why":"Some errors slip through.","_n":"g6a4","_k":"86535e58"},{"t":"Cuts out whole genes with errors","why":"It fixes single nucleotides.","_n":"h794","_k":"34e310b4"},{"t":"Removes a wrongly paired nucleotide right after adding it, then adds the correct one","why":"It steps back, removes the mismatch and replaces it.","_n":"i784","_k":"fef8c4ff"},{"t":"Reads the mRNA for errors","why":"Proofreading happens during DNA replication.","_n":"j774","_k":"dd3a717c"}],"hints":["Recall module 22.","Polymerase can step back one nucleotide.","It removes and replaces a mismatch."]},{"id":"w6","skill":"DNA repair","goal":3,"prompt":"After proofreading and repair, about how often does an uncorrected error remain when DNA is copied?","options":[{"t":"1 in 10 bases","why":"That would be far too many errors.","_n":"k784","_k":"77dbb312"},{"t":"1 in 1000 bases","why":"Repair brings it much lower than that.","_n":"l754","_k":"1221157c"},{"t":"Never","why":"Some errors always escape.","_n":"m764","_k":"3585676e"},{"t":"Roughly 1 in a billion bases","why":"Rare, but a human genome has about 6 billion bases, so a few new changes per cell division.","_n":"n7b4","_k":"bfd3e102"}],"hints":["Is copying perfect?","Very close to perfect.","About 1 in 10⁹."]}],"refreshers":{"Decoding":"mRNA = coding strand with U for T. Read from AUG in threes using the codon table. Most amino acids have more than one codon.","Reading frames":"The start codon sets the frame. Adding or removing bases that aren’t a multiple of three shifts every later codon.","DNA repair":"DNA polymerase proofreads as it copies; other enzymes fix mismatches and cut out damaged stretches (like UV dimers). Very few errors remain, about 1 in a billion bases."}}},"explore":{"heading":"Mutation lab","intro":"Edit the gene and watch the mRNA and protein update. Name each mutation by what it does.","gene":"ATGCCAGAGTGGAAATGCTAA","maxEdits":3,"editHow":"Tap a base (or move with the arrow keys and press Enter), then choose what to do with it. You can make up to 3 edits at a time.","chromo":{"c1":"ABCDEFGH","c2":"MNOP","how":"Tap one band, or tap two bands to select a segment, then choose a mutation. For a translocation, also tap a band on the second chromosome: the two end pieces swap from there."},"mutagens":[{"id":"uv","t":"UV light","fix":"Excision repair cuts out the damaged stretch, and DNA polymerase and ligase fill the gap.","caps":["UV light hits two neighbouring thymines (T T) on one strand.","The thymines bond to each other: a thymine dimer. The helix kinks.","Excision repair cuts out the stretch with the dimer.","The gap is refilled with the right bases. If the dimer is missed, replication can put in a wrong base."]},{"id":"ion","t":"Ionizing radiation (X-rays, gamma rays, radon’s radiation)","fix":"Break repair joins the broken ends, but sometimes loses or adds bases.","caps":["High-energy radiation passes through the DNA.","It breaks one or both strands of the backbone.","Break repair joins the ends back together…","…but a base pair was lost at the join: a deletion."]},{"id":"chem","t":"Chemical mutagens","fix":"Mismatch repair and excision repair fix many altered bases; the ones missed become mutations at the next replication.","caps":["A base-altering chemical changes a G, so it now pairs with T instead of C.","At the next replication the altered G gets T as its partner: a substitution.","An intercalating chemical slips between two base pairs.","Copying past it adds an extra base: an insertion (or a deletion). Benzo[a]pyrene from tobacco smoke is a real example."]}],"predIntro":"Make a prediction first. Then the lab will make the change and show you what happens.","predictions":[{"id":"p1","prompt":"The normal gene. Change base 6, A → G (CCA → CCG). What happens to the protein?","options":[{"t":"The protein stops after Met","_n":"o7c4","_k":"e78584bd"},{"t":"Every amino acid after Met changes","_n":"p794","_k":"c38e28fc"},{"t":"Pro becomes another amino acid","_n":"q7a4","_k":"5836a3dd"},{"t":"No change","_n":"r6f4","_k":"a9d7f331"}],"explain":"CCA and CCG both code Pro: a silent mutation."},{"id":"p2","prompt":"The normal gene. Change base 13, A → T (AAA → TAA). How long is the protein now?","options":[{"t":"4 amino acids","_n":"s704","_k":"24537525"},{"t":"6","_n":"t7d4","_k":"6bd2ea65"},{"t":"0","_n":"u7c4","_k":"bf4805bb"},{"t":"5","_n":"v7f4","_k":"b1238759"}],"explain":"TAA is a stop codon: a nonsense mutation cuts the protein short."},{"id":"p3","prompt":"The normal gene. Insert an A after base 3 (just after ATG). What happens to the protein?","options":[{"t":"The protein stops after Met","_n":"w7e4","_k":"a044a743"},{"t":"Nothing: one base is too small to matter","_n":"x794","_k":"da6736c4"},{"t":"One extra amino acid is added","_n":"y784","_k":"f4a661fc"},{"t":"Every amino acid after Met changes, and the original stop is no longer in frame","_n":"z7b4","_k":"8a0a24f6"}],"explain":"Adding one base shifts every later codon: a frameshift. Removing one base shifts every codon after it, so all the downstream amino acids change, often with an early stop."},{"id":"p4","prompt":"The normal gene. Delete bases 7–9 (GAG). What happens?","options":[{"t":"Glu is missing; the rest is unchanged","_n":"107a4","_k":"9b3671b8"},{"t":"Every amino acid after Pro changes","_n":"11754","_k":"301e1f9e"},{"t":"The protein stops early","_n":"12744","_k":"0492cab8"},{"t":"Nothing changes","_n":"13733","_k":"34328097"}],"explain":"Three bases is one codon: the frame is kept, and one amino acid is lost."}],"chalIntro":"Edit the gene to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,4],"prompt":"With one substitution, turn Glu into Val.","why":"Base 8, A → T: GAG becomes GTG, and GUG codes Val. That’s the sickle-cell change.","general":"Make exactly one substitution in codon 3 (GAG) so that it codes Val.","msgs":{"stop":"That’s a stop codon: nonsense.","third":"GAA keeps Glu, and GAC or GAT give Asp.","one":"Use exactly one substitution (Undo or Reset the other edits)."},"hints":["Which codons are Val?","GTN. Which single change turns GAG into GT_?","Change the middle A to T."]},{"id":"tc2","goal":[1,2],"prompt":"With one substitution, end the protein after exactly three amino acids (Met–Pro–Glu).","why":"TGG → TAG (base 11 G → A) or TGG → TGA (base 12 G → A): codon 4 becomes a stop.","general":"Make exactly one substitution that turns codon 4 into a stop codon.","msgs":{"c5":"That keeps Trp; the stop must replace codon 4.","taa":"TAA would need two changes.","one":"Use exactly one substitution (Undo or Reset the other edits)."},"hints":["Codon 4 (TGG) must become a stop.","Stops are TAA, TAG, TGA. Which differ from TGG by one base?","TAG or TGA."]},{"id":"tc3","goal":[1,4],"stretch":true,"prompt":"A frameshift can be cancelled by a second frameshift. Make \u003cstrong>one insertion and one deletion\u003c/strong> so that only amino acids 2 and/or 3 differ, and Trp–Lys–Cys at the end are back to normal.","why":"The frame was wrong only between your two edits. In 1961, Crick and Brenner used exactly this kind of double mutation in a virus to show that the code is read in triplets.","general":"Make exactly one insertion and one deletion, both inside codons 2 and 3.","msgs":{"far":"The frame is shifted for too long; Trp or Lys changes too.","twoIns":"Two extra bases leave the frame shifted by two.","twoDel":"Two missing bases leave the frame shifted by two.","stop":"The shifted frame hit a stop before you restored it.","same":"Amino acids 2 and 3 are still Pro–Glu: make the shifted stretch change at least one of them.","need":"Make exactly one insertion and one deletion (no substitutions)."},"hints":["The frame is wrong only between the two edits.","Keep both edits inside codons 2 and 3 (bases 4–9).","Try inserting just after ATG and deleting a base in GAG."]}]},"part3":{"slug":"cases","name":"Real cases","heading":"Mutations with consequences","intro":"Explore works on a toy gene. These four stations connect each type of mutation to real people and real data, and show how scientists test whether a chemical is a mutagen.","stations":[{"id":"s1","n":1,"t":"Sickle-cell anemia","text":"The β-globin gene, codon 6: one base changes.","rows":[["Coding DNA","GAG","GTG"],["mRNA","GAG","GUG"],["Amino acid","Glu","Val"]],"how":"Choose the hemoglobin and the oxygen level, and watch the red blood cell.","caps":{"nn":"Normal hemoglobin, normal oxygen: molecules stay separate; the cell is a flexible disc.","nl":"Normal hemoglobin, low oxygen: molecules still stay separate; the cell keeps its shape.","sn":"Sickle hemoglobin (Val), normal oxygen: molecules mostly stay separate.","sl":"Sickle hemoglobin, low oxygen: the Val patches stick molecules together into long fibres that bend the cell into a sickle. Sickled cells can block small blood vessels."},"side":"People with one copy of the sickle-cell allele are largely protected against severe malaria, which is why the allele is common where malaria is."},{"id":"s2","n":2,"t":"Cystic fibrosis","text":"The CFTR gene makes a chloride channel in the cell membrane. The most common mutation deletes three bases, removing one phenylalanine (Phe): an in-frame deletion.","how":"Switch between the normal and the mutant protein.","caps":{"n":"Normal CFTR folds correctly, reaches the cell membrane and lets Cl⁻ out of the cell.","m":"Missing one Phe, the protein misfolds; most of it is broken down and never reaches the membrane. Without the channel, the mucus in the lungs thickens."},"note":"The CFTR gene was identified in 1989 by a team led by Lap-Chee Tsui at the Hospital for Sick Children in Toronto, with collaborators."},{"id":"s3","n":3,"t":"A helpful mutation: CCR5-Δ32","text":"CCR5-Δ32 deletes 32 bases from the CCR5 gene. 32 isn’t a multiple of 3, so it’s a frameshift. People with two copies make no working CCR5 receptor, which many HIV strains use to enter cells.","ask":"Is this mutation helpful, harmful or neutral?","choices":[{"t":"It depends","fb":"It depends: helpful against those HIV strains, and mostly neutral otherwise. Many are neutral, some are harmful, and a few help, depending on the environment.","_n":"14743","_k":"aef2b028"},{"t":"Helpful","fb":"Only against the HIV strains that use CCR5; otherwise it’s mostly neutral. Many are neutral, some are harmful, and a few help, depending on the environment.","_n":"15753","_k":"b321fb93"},{"t":"Neutral","fb":"Not against HIV strains that use CCR5: there it helps. Many are neutral, some are harmful, and a few help, depending on the environment.","_n":"16763","_k":"924ddfaf"},{"t":"Harmful","fb":"It’s a frameshift, but losing CCR5 does little harm, and it blocks those HIV strains. Many are neutral, some are harmful, and a few help, depending on the environment.","_n":"17773","_k":"6e5353a7"}]},{"id":"s4","n":4,"t":"Check it with data: the Ames test","text":"Bacteria that can’t make histidine are spread on plates with no histidine. Only cells that mutate back to histidine-making can grow into colonies. More colonies than the control means the chemical causes mutations. Some chemicals become mutagenic only after liver enzymes process them, so plates are also run with a liver extract.","plates":[["ctl","Control (solvent only)",24],["p","Chemical P",26],["q","Chemical Q",310],["r","Chemical R",22],["rl","Chemical R + liver extract",240]],"how":"For each chemical, choose a claim and the evidence that supports it, then press Check.","claims":[{"id":"no","t":"Not mutagenic"},{"id":"yes","t":"Mutagenic"},{"id":"liver","t":"Mutagenic after processing by the body"}],"evidence":[{"id":"e26","t":"26 colonies vs the control’s 24"},{"id":"e310","t":"310 colonies vs the control’s 24"},{"id":"e240","t":"22 colonies alone (control 24), but 240 with liver extract"}],"chems":[{"id":"p","t":"Chemical P","_a":"EwtYSlYDB0c=","fb":{"yes":"26 vs 24 is within normal variation: no more mutations than the control.","liver":"P wasn’t tested with liver extract, and alone it matches the control."}},{"id":"q","t":"Chemical Q","_a":"ExxSRU9UAlQBRw==","fb":{"no":"310 is far more than the control’s 24.","liver":"Q is mutagenic on its own, without liver extract."}},{"id":"r","t":"Chemical R","_a":"EwleQFZDTQADUQcU","fb":{"no":"Alone, yes, but with liver extract it gave 240 colonies.","yes":"Alone, R gave 22 colonies, no more than the control. It needed the liver extract."}}],"evWrong":"Choose the plate counts for this chemical, compared with the control.","reason":"Reasoning: the control shows how many back-mutations happen anyway (24). Only a count well above it means the chemical caused extra mutations."}],"quickCheck":{"title":"Quick check","summary":"Real cases quick check","items":[{"id":"q1","goal":6,"prompt":"Sickle-cell: what type of mutation?","choices":[{"t":"Nonsense","fb":"One base, one amino acid changed (Glu → Val).","_n":"18783","_k":"ea2f8793"},{"t":"Missense","fb":"One base, one amino acid changed (Glu → Val).","_n":"19793","_k":"47407c98"},{"t":"Silent","fb":"One base, one amino acid changed (Glu → Val).","_n":"1a7a3","_k":"5dce702b"},{"t":"Frameshift","fb":"One base, one amino acid changed (Glu → Val).","_n":"1b6b3","_k":"1f796f20"}]},{"id":"q2","goal":1,"prompt":"The common cystic fibrosis mutation removes 3 bases. Why isn’t it a frameshift?","choices":[{"t":"It’s in an intron","fb":"The frame is kept; one amino acid is lost. Three bases is one whole codon. The frame after it is restored; one amino acid is added or lost (sometimes two neighbours merge).","_n":"1c6c3","_k":"abc10fdc"},{"t":"Frameshifts need 32 bases","fb":"The frame is kept; one amino acid is lost. Three bases is one whole codon. The frame after it is restored; one amino acid is added or lost (sometimes two neighbours merge).","_n":"1d793","_k":"ab1ae986"},{"t":"It’s a substitution","fb":"The frame is kept; one amino acid is lost. Three bases is one whole codon. The frame after it is restored; one amino acid is added or lost (sometimes two neighbours merge).","_n":"1e783","_k":"470a376e"},{"t":"3 bases is one codon","fb":"The frame is kept; one amino acid is lost.","_n":"1f773","_k":"77344719"}]},{"id":"q3","goal":6,"prompt":"In the Ames data, why is the control plate needed?","choices":[{"t":"It kills the bacteria","fb":"About 24 colonies grow even without a chemical.","_n":"1g763","_k":"fe95d7fe"},{"t":"It shows how many mutations happen anyway","fb":"About 24 colonies grow even without a chemical.","_n":"1h7d3","_k":"40abff04"},{"t":"It isn’t needed","fb":"About 24 colonies grow even without a chemical.","_n":"1i7c3","_k":"27780e55"},{"t":"It adds histidine","fb":"About 24 colonies grow even without a chemical.","_n":"1j7b3","_k":"b9217b17"}]},{"id":"q4","goal":6,"prompt":"Which chemical needed the liver extract to show its effect?","choices":[{"t":"R","fb":"R gave 22 colonies alone but 240 with the extract.","_n":"1k7a3","_k":"21db8dae"},{"t":"None","fb":"R gave 22 colonies alone but 240 with the extract.","_n":"1l713","_k":"1aaa57e6"},{"t":"P","fb":"R gave 22 colonies alone but 240 with the extract.","_n":"1m703","_k":"82c139de"},{"t":"Q","fb":"R gave 22 colonies alone but 240 with the extract.","_n":"1nff3","_k":"9ebd1a18"}]}]}},"practice":{"activities":[{"id":"name","type":"sorter","title":"Name that mutation","summary":"Name that mutation","goal":1,"noun":"change","txt":true,"instruction":"Changes are given as mRNA codons. Sort each change into the box that names it.","boxes":[{"id":"sil","label":"Silent"},{"id":"mis","label":"Missense"},{"id":"non","label":"Nonsense"},{"id":"fs","label":"Frameshift"},{"id":"inf","label":"In-frame insertion or deletion"}],"items":[{"id":"n1","t":"\u003cspan class=\"mu-sq\">GAA → GAG\u003c/span>","_a":"ExZeWhE=","why":"Silent (Glu → Glu).","wrong":{"mis":"Most amino acids have several codons. A change in the third base often keeps the same amino acid: a silent mutation."}},{"id":"n2","t":"\u003cspan class=\"mu-sq\">UGG → UGA\u003c/span>","_a":"EwtYWBE=","why":"Nonsense (Trp → stop)."},{"id":"n3","t":"\u003cspan class=\"mu-sq\">GCU → ACU\u003c/span>","_a":"EwheRRE=","why":"Missense (Ala → Thr)."},{"id":"n4","t":"One base inserted in codon 2 of a 10-codon gene","_a":"EwNEFA==","why":"One base shifts every later codon: a frameshift."},{"id":"n5","t":"Three bases (one whole codon) deleted","_a":"EwxZUBE=","why":"Three bases is one codon: the frame is kept.","wrong":{"fs":"Three bases is one whole codon. The frame after it is restored; one amino acid is added or lost (sometimes two neighbours merge)."}},{"id":"n6","t":"\u003cspan class=\"mu-sq\">CAU → CAC\u003c/span>","_a":"ExZeWhE=","why":"Silent (His → His).","wrong":{"mis":"Most amino acids have several codons. A change in the third base often keeps the same amino acid: a silent mutation."}},{"id":"n7","t":"\u003cspan class=\"mu-sq\">UAC → UAA\u003c/span>","_a":"EwtYWBE=","why":"Nonsense (Tyr → stop).","hints":["Look up UAA.","It’s a stop codon.","Nonsense."]},{"id":"n8","t":"\u003cspan class=\"mu-sq\">GUU → GAU\u003c/span>","_a":"EwheRRE=","why":"Missense (Val → Asp)."},{"id":"n9","t":"Two bases deleted from codon 4","_a":"EwNEFA==","why":"Two isn’t a multiple of three, so the frame shifts.","wrong":{"inf":"Two isn’t a multiple of three."}},{"id":"n10","t":"\u003cspan class=\"mu-sq\">AAA → AGA\u003c/span>","_a":"EwheRRE=","why":"Missense (Lys → Arg)."}],"wrongDefault":"Look the codons up: same amino acid, different amino acid, or stop?"},{"id":"detective","type":"custom","title":"Mutation detective","summary":"Mutation detective","star":true,"goal":[2,4,5],"how":"","instruction":"The normal gene is the Explore gene: \u003cspan class=\"mu-sq\">5′-ATG CCA GAG TGG AAA TGC TAA-3′\u003c/span> (Met–Pro–Glu–Trp–Lys–Cys). Puzzles 3 to 6 are non-routine (★); the last two go beyond the Final Check.","items":[{"id":"d1","kind":"codon","goal":4,"prompt":"A mutant makes only Met–Pro. Which single change?","target":"MP","_a":"E1YNYnJ2Ew==","display":"Base 7 G → T (GAG → TAG)","why":"Codon 3 must become a stop: GAG → TAG.","named":[{"codon":2,"fb":"Codon 3 must become the stop."}]},{"id":"d2","kind":"codon","goal":4,"prompt":"A mutant makes Met–Pro–Lys–Trp–Lys–Cys. Which single change?","target":"MPKWKC","_a":"E1YNd3J2Ew==","display":"Base 7 G → A (GAG → AAG)","why":"Lys is AAA or AAG; only AAG is one change from GAG.","named":[{"codon":3,"val":"AAA","fb":"That’s two changes."}]},{"id":"d3","kind":"codon","goal":4,"star":true,"prompt":"A mutant makes Met–Pro–Glu–Trp–Lys–Trp. Which single change?","target":"MPEWKW","_a":"E1MNYnR2Ew==","display":"Base 18 C → G (TGC → TGG)","why":"Trp has only one codon, UGG (TGG on the coding strand): TGC → TGG.","named":[{"codon":6,"val":"TGA","fb":"That’s a stop, not Trp."}],"hints":["Which codons are Trp?","Only TGG (UGG).","TGC → TGG: base 18."]},{"id":"d4","kind":"mc","goal":[4,5],"star":true,"prompt":"A mutant protein has Met, then every amino acid is different, and it runs past where it should stop. What kind of mutation, and where?","options":[{"t":"A frameshift (insertion or deletion of 1 or 2 bases) just after the start codon","why":"Every codon after the change is read in a new frame, and the old stop is no longer in frame.","_n":"1o003","_k":"54bdd39e"},{"t":"A nonsense mutation","why":"A nonsense mutation makes the protein shorter, not longer.","_n":"1pfd3","_k":"1ff9f764"},{"t":"An in-frame deletion of three bases","why":"Three bases keeps the frame, so most amino acids stay the same.","_n":"1qfe3","_k":"b50b90a8"},{"t":"A substitution","why":"Removing one base shifts every codon after it, so all the downstream amino acids change, often with an early stop. One substitution changes at most one amino acid.","_n":"1rfb3","_k":"45d382a0"}],"follow":{"prompt":"Follow-up: a chromosome \u003cspan class=\"mu-sq\">A B C D E F G H\u003c/span> becomes \u003cspan class=\"mu-sq\">A B E D C F G H\u003c/span>. Name the mutation.","options":[{"t":"Translocation","why":"Nothing moved to another chromosome; a segment flipped.","_n":"1sfc3","_k":"cb7a767c"},{"t":"Deletion","why":"All eight bands are still there.","_n":"1tf93","_k":"1d1419ed"},{"t":"Duplication","why":"No band appears twi ","cat":"K","goal":3,"a":{"prompt":"How does UV light most often damage DNA?","options":[{"t":"It joins neighbouring thymines on one strand into thymine dimers","why":"Thymine dimers kink the helix.","_n":"2kfe3","_k":"878bcb64"},{"t":"It turns thymine into uracil","why":"UV doesn’t swap bases like that.","_n":"2lfd3","_k":"67bc4401"},{"t":"It breaks both DNA strands","why":"That’s typical of X-rays and other ionizing radiation. UV’s main damage is thymine dimers. Strand breaks are the signature of ionizing radiation like X-rays.","_n":"2mfc3","_k":"8ef9d8a7"},{"t":"It slips between bases and causes insertions","why":"That’s how intercalating chemicals act.","_n":"2nfb3","_k":"a097e035"}]},"b":{"prompt":"How does ionizing radiation, such as X-rays, most often damage DNA?","options":[{"t":"It forms thymine dimers","why":"That’s UV’s typical damage. UV’s main damage is thymine dimers. Strand breaks are the signature of ionizing radiation like X-rays.","_n":"2ofa3","_k":"1f682647"},{"t":"It makes DNA single-stranded permanently","why":"Breaks, not unzipping.","_n":"2pf93","_k":"6e6d2738"},{"t":"It breaks one or both DNA strands","why":"Strand breaks are the signature of ionizing radiation.","_n":"2qf83","_k":"6270550f"},{"t":"It adds methyl groups to cytosine","why":"That’s normal gene regulation.","_n":"2rf5e","_k":"bf043720"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"What is a frameshift mutation?","options":[{"t":"A substitution of one base for another","why":"Substitutions keep the frame.","_n":"2sf4e","_k":"7a179134"},{"t":"An insertion or deletion of bases (not a multiple of 3) that changes how all later codons are read","why":"Every codon after it is read in a new frame.","_n":"2tf7e","_k":"c52d28bf"},{"t":"A mutation that moves a gene to another chromosome","why":"That’s a translocation.","_n":"2uf6e","_k":"10da6930"},{"t":"A deletion of exactly three bases","why":"Three bases is one whole codon. The frame after it is restored; one amino acid is added or d is added or lost (sometimes two neighbours merge).","_n":"4183d","_k":"f179f6c6"},{"t":"Three bases are deleted from the CFTR gene, removing one phenylalanine; the rest of the protein is read in frame, but it misfolds","why":"An in-frame deletion: one amino acid lost, the frame kept.","_n":"4282d","_k":"c4880ed7"},{"t":"One base is substituted, making a stop codon","why":"It’s a deletion.","_n":"4375d","_k":"6193544b"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Ames-test model data: control 20 colonies; chemical X 22; chemical Y 280; chemical Z 19. Which conclusion is best supported?","options":[{"t":"Z prevents mutations","why":"19 vs 20 is no real difference.","_n":"4474d","_k":"888a6949"},{"t":"Y is a mutagen; X and Z show no evidence of being mutagens","why":"Only Y gives many more colonies than the control.","_n":"45f7d","_k":"fd962b83"},{"t":"X is a mutagen because it has more colonies than the control","why":"22 vs 20 is within normal variation.","_n":"46f8d","_k":"5f6558a0"},{"t":"All three are mutagens, because colonies grew on every plate","why":"The control shows some colonies always grow.","_n":"47f5d","_k":"57390910"}]},"b":{"prompt":"Ames-test model data: control 18; chemical W alone 20; chemical W + liver extract 260. Which conclusion is best supported?","options":[{"t":"The liver extract is the mutagen","why":"You’d need an extract-only plate to claim that; the W-alone result points to processing W.","_n":"48f6d","_k":"b00cb0c8"},{"t":"W becomes a mutagen after liver enzymes process it","why":"Alone it matches the control; with liver extract it gives far more colonies.","_n":"49f3d","_k":"5ed3edbb"},{"t":"W prevents mutations","why":"20 vs 18 is no difference.","_n":"4af4d","_k":"6c3b5d07"},{"t":"W is not a mutagen","why":"With liver extract it clearly is.","_n":"4bf1d","_k":"9021bba5"}]}},{"id":"a2","cat":"A","goal":[3,5],"a":{"prompt":"Health Canada recommends testing homes for radon, a radioactive gas from the ground. How can radon lead to s–Cys), make \u003cstrong>exactly two\u003c/strong> single-base substitutions that meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"mu-conds\">\u003cli>The protein becomes Met–Pro–Glu–Trp–Lys–\u003cstrong>Ser\u003c/strong> (then stop).\u003c/li>\u003cli>The two substitutions are in different codons.\u003c/li>\u003cli>One substitution is silent and sits in codon 2 or codon 3.\u003c/li>\u003c/ol>","checks":["Protein Met–Pro–Glu–Trp–Lys–Ser","Different codons","Silent change in codon 2 or 3"],"tips":["Which Ser codons differ from TGC (Cys) by one base?","Changing Cys and something else in the same codon won’t work: they must be separate codons.","Which changes to CCA (Pro) or GAG (Glu) keep the same amino acid?"],"explainPrompt":"Explain how the genetic code’s redundancy let you make a silent change, and why only two single-base changes turn Cys into Ser.","vocab":"Use the words codon, substitution, silent, missense and redundancy.","success":"Your two substitutions meet every condition!","more":"Can you find all the answers?","afterAt":8,"after3":"Ser has six codons, but only TCC and AGC are one step from TGC. Pro tolerates any third base; Glu tolerates only A ↔ G."},"cards":[["Mutation","A permanent change in the DNA sequence."],["Silent","Substitution that keeps the same amino acid."],["Missense","Substitution that changes one amino acid (sickle-cell: Glu → Val)."],["Nonsense","Substitution that creates an early stop codon."],["Frameshift","Insertion or deletion not a multiple of 3; every later codon changes."],["In-frame deletion","Three bases removed; frame kept (cystic fibrosis’s common mutation)."],["UV damage","Thymine dimers; fixed by excision repair."],["Ionizing radiation","X-rays, gamma rays, radon: break DNA strands."],["Chemical mutagens","Alter bases or slip between them (benzo[a]pyrene in smoke)."],["Chromosomal mutations","Deletion, duplication, inversion, translocation of whole segments."],["Germ-line vs somatic","Only germ-line (egg or sperm) mutations are inherited."],["Ames test","More colonies than the control means the chemical causes mutations."]]}};</script>
