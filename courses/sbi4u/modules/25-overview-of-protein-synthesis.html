:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;

:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}

.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}

y System","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"055797c9","content":{"id":"25-overview-of-protein-synthesis","kind":"topic","title":"Overview of protein synthesis","topic":"Overview of Protein Synthesis","readyTopic":"protein synthesis","hero":{"eq":"\u003cspan class=\"ps-heq\">\u003cspan class=\"ps-hb\">\u003cb class=\"ps-hd\">DNA\u003c/b>\u003c/span>\u003cspan class=\"ps-ha\">→\u003csmall>transcription\u003c/small>\u003c/span>\u003cspan class=\"ps-hb\">\u003cb class=\"ps-hm\">mRNA\u003c/b>\u003csmall class=\"ps-hs\">5′-AUG UUU GGA AAC UGG UAA-3′\u003c/small>\u003c/span>\u003cspan class=\"ps-ha\">→\u003csmall>translation\u003c/small>\u003c/span>\u003cspan class=\"ps-hb\">\u003cb class=\"ps-hp\">polypeptide\u003c/b>\u003csmall class=\"ps-hs\">Met–Phe–Gly–Asn–Trp\u003c/small>\u003c/span>\u003c/span>","eqLabel":"DNA, by transcription, gives mRNA 5′-AUG UUU GGA AAC UGG UAA-3′; by translation, the mRNA gives the polypeptide Met–Phe–Gly–Asn–Trp","eqSize":"sm","headline":"Read three, add one","text":"A \u003cstrong>ribosome\u003c/strong> moves along an \u003cstrong>mRNA\u003c/strong> three bases at a time. Each \u003cstrong>codon\u003c/strong> calls in a \u003cstrong>tRNA\u003c/strong> with a matching \u003cstrong>anticodon\u003c/strong>, and its amino acid is joined to the growing chain by a \u003cstrong>peptide bond\u003c/strong>. The ribosome starts at \u003cstrong>AUG\u003c/strong> and stops at a \u003cstrong>stop codon\u003c/strong>.","fig":{"html":"\u003cdiv class=\"ps-hero\" id=\"ps-hero\" role=\"img\" aria-label=\"A teal mRNA strip slides in. A small ribosomal subunit clamps on near the 5′ end and slides to AUG. A violet tRNA carrying Met docks, and the large subunit drops on top. More tRNAs come and go, and the brown chain grows to Met–Phe–Gly–Asn–Trp. At UAA a release factor enters, the chain floats away and the two subunits separate.\">\u003c/div>"}},"goals":["I can describe the roles of mRNA, tRNA, rRNA and the ribosome’s A, P and E sites.","I can explain the three stages of translation: initiation, elongation and termination.","I can decode an mRNA, coding strand or template strand into an amino acid sequence, starting at AUG.","I can explain polyribosomes and compare protein synthesis in prokaryotes and eukaryotes.","I can predict how blocking one part of translation affects protein production.","I can apply protein synthesis to medicine and biotechnology (antibiotics, proteins made in bacteria)."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Transcription","goal":3,"prompt":"The coding strand of a gene reads 5′-ATG GCA-3′. What is the mRNA?","options":[{"t":"3′-UAC CGU-5′","why":"That’s the template strand’s sequence (in RNA letters).","_n":"01b8","_k":"e350e31f"},{"t":"5′-ATG GCA-3′","why":"mRNA uses U.","_n":"1188","_k":"0098c4a0"},{"t":"5′-UAC CGU-3′","why":"That’s the complement, made from the coding strand by mistake.","_n":"2198","_k":"cdb3c32a"},{"t":"5′-AUG GCA-3′","why":"The mRNA matches the coding strand, with U for T.","_n":"3168","_k":"7b50052b"}],"hints":["Which strand does the mRNA match?","The coding strand, with U for T.","5′-AUG GCA-3′."]},{"id":"w2","skill":"Transcription","goal":3,"prompt":"The template strand reads 3′-TAC GGA-5′. What is the mRNA?","options":[{"t":"5′-ATG CCT-3′","why":"That’s the coding strand (DNA).","_n":"4178","_k":"d0d3c576"},{"t":"3′-AUG CCU-5′","why":"The mRNA’s 5′ end pairs with the template’s 3′ end.","_n":"5148","_k":"8e7c4d88"},{"t":"5′-UAC GGA-3′","why":"That just swaps T for U.","_n":"6158","_k":"a1697ae2"},{"t":"5′-AUG CCU-3′","why":"Complement each base: T→A, A→U, C→G, G→C.","_n":"7128","_k":"e5260ee3"}],"hints":["The mRNA is complementary to the template.","T→A, A→U, C→G, G→C.","5′-AUG CCU-3′."]},{"id":"w3","skill":"Codon table","goal":3,"prompt":"Which amino acid does UGG code for?","options":[{"t":"Glycine (Gly)","why":"Gly is GG_.","_n":"8138","_k":"baae96a6"},{"t":"Tryptophan (Trp)","why":"UGG is the only codon for Trp.","_n":"9de6","_k":"085cf30b"},{"t":"A stop","why":"UGA is a stop; UGG is Trp.","_n":"add6","_k":"095e13dd"},{"t":"Cysteine (Cys)","why":"Cys is UGU and UGC.","_n":"be06","_k":"2d92f521"}],"hints":["Row U, column G.","The UG_ box: Cys, Cys, stop, Trp.","Trp."]},{"id":"w4","skill":"Codon table","goal":2,"prompt":"Which codons are stop codons?","options":[{"t":"AUG, UAA, UGA","why":"AUG is the start codon (Met).","_n":"cdf6","_k":"3523f52d"},{"t":"UUU, UUA, UAG","why":"UUU is Phe and UUA is Leu.","_n":"dda6","_k":"5916c2ad"},{"t":"UAA only","why":"There are three.","_n":"ed96","_k":"ac87df48"},{"t":"UAA, UAG, UGA","why":"Two in the UA_ box and one in the UG_ box.","_n":"fdc6","_k":"026fd612"}],"hints":["Look for ‘stop’ in the table.","Two in the UA_ box, one in the UG_ box.","UAA, UAG, UGA."]},{"id":"w5","skill":"tRNA pairing","goal":1,"prompt":"A tRNA has the anticodon 3′-AAG-5′. Which codon does it read?","options":[{"t":"5′-TTC-3′","why":"RNA uses U.","_n":"gdb6","_k":"aee1377d"},{"t":"5′-CUU-3′","why":"Reversed: line up the 5′ end of the codon with the 3′ end of the anticodon.","_n":"hd66","_k":"688536ba"},{"t":"5′-AAG-3′","why":"That’s the same bases.","_n":"id56","_k":"f1c86a58"},{"t":"5′-UUC-3′","why":"Complementary and antiparallel.","_n":"jcc6","_k":"bbe87ff3"}],"hints":["Codon 5′ → 3′ pairs with anticodon 3′ → 5′.","A–U, A–U, G–C.","5′-UUC-3′."]},{"id":"w6","skill":"tRNA pairing","goal":1,"prompt":"What does an aminoacyl-tRNA synthetase do?","options":[{"t":"Joins amino acids into a chain","why":"That’s the ribosome.","_n":"kcd6","_k":"111c0e66"},{"t":"Reads stop codons","why":"Release factors do.","_n":"lce6","_k":"0d3bd89c"},{"t":"Attaches the correct amino acid to a tRNA, using ATP","why":"It ‘charges’ each tRNA with its own amino acid.","_n":"mcf6","_k":"5dbc42c1"},{"t":"Makes tRNA from DNA","why":"RNA polymerase does that.","_n":"nc86","_k":"742f4bf3"}],"hints":["Think of the ‘charging station’ in module 24.","It loads tRNAs.","Attaches the amino acid, using ATP."]}],"refreshers":{"Transcription":"The mRNA is complementary to the \u003cstrong>template\u003c/strong> strand and has the same sequence as the \u003cstrong>coding\u003c/strong> strand (U for T). 3′-TAC-5′ on the template gives 5′-AUG-3′.","Codon table":"Row = first base, column = second, then the third base within the box. AUG = Met and start; UAA, UAG, UGA = stop.","tRNA pairing":"Anticodon pairs with codon, antiparallel. The synthetase, not the ribosome, chooses the amino acid."}}},"explore":{"heading":"Ribosome assembly line","intro":"Step the ribosome through a message. Watch which site each tRNA is in, and how the chain grows.","messages":[{"id":"m1","t":"M1","seq":"CAGAUGUUUGGAAACUGGUAAGC","show":"5′-CAG AUG UUU GGA AAC UGG UAA GC-3′"},{"id":"m2","t":"M2","seq":"AUGGCAUGUAAAUGA","show":"5′-AUG GCA UGU AAA UGA-3′"},{"id":"m3","t":"M3 (eukaryotic)","seq":"CAUGGAUGAAUAGC","show":"5′-C AUG GAU GAA UAG C-3′","pick":true},{"id":"own","t":"Build your own","pick":true}],"buildNote":"Up to 6 codons (18 bases). Tap a base to add it.","startNote":"Start position: tap a base to set where the small subunit begins, or scan from the 5′ end.","polyNote":"Each copy takes 30 s, set by the message length.","cellNote":"Same gene, two kinds of cell. Step through time.","gtpNote":"Not shown: initiation factors, and the GTP that elongation uses.","predIntro":"Make a prediction first. Then the assembly line will show you what really happens.","predictions":[{"id":"p1","prompt":"Start: M1, before initiation. Which amino acid will be first in the chain?","options":[{"t":"Any amino acid","_n":"oc96","_k":"73dfdf2b"},{"t":"Gln (from CAG)","_n":"pca6","_k":"44dc736c"},{"t":"Met","_n":"qcb6","_k":"767da391"},{"t":"Phe","_n":"rd46","_k":"d578105a"}],"explain":"Translation starts at the first AUG, which codes Met. CAG is before the start and isn’t read."},{"id":"p2","prompt":"Start: M1 with UAA in the A site. What enters the A site now?","options":[{"t":"Nothing; the chain stays attached","_n":"sd56","_k":"ffbade12"},{"t":"A tRNA carrying Met","_n":"td26","_k":"27750dd2"},{"t":"A tRNA with anticodon 3′-AUU-5′","_n":"ud16","_k":"3ddaf280"},{"t":"A release factor (a protein)","_n":"vd06","_k":"c8b293dd"}],"explain":"No tRNA has an anticodon for a stop codon. The replay with \u003cstrong>No release factor\u003c/strong> switched on shows the other case: the ribosome stalls with the chain still attached."},{"id":"p3","prompt":"Start: polyribosome mode, 5 ribosomes on M1. When every ribosome has finished, how many polypeptides are there?","options":[{"t":"It depends on the mRNA length","_n":"wcf6","_k":"996cdd40"},{"t":"25","_n":"xce6","_k":"abd1dea8"},{"t":"1","_n":"ycd6","_k":"24059818"},{"t":"5","_n":"zcc6","_k":"7d3f3aa3"}],"explain":"Each ribosome reads the whole message and makes its own copy."},{"id":"p4","prompt":"Start: bacterium vs eukaryote mode. In the bacterium, can ribosomes start on an mRNA before RNA polymerase has finished making it?","options":[{"t":"No: the mRNA must be finished first","_n":"10cb6","_k":"b0284df0"},{"t":"No: it must leave the nucleus first","_n":"11da6","_k":"8604d1b3"},{"t":"Only if there are no introns","_n":"12d96","_k":"c31bbd34"},{"t":"Yes","_n":"13606","_k":"8ebfc6ed"}],"explain":"Bacteria have no nucleus, so transcription and translation happen in the same place at the same time."}],"challenges":[{"id":"tc1","goal":2,"prompt":"Step M1 until the P site holds Met–Phe–Gly and the A site is empty, ready for the next tRNA.","why":"After the second translocation, the Gly-tRNA holds Met–Phe–Gly in the P site and the A site shows AAC, waiting for the next tRNA.","general":"Use the assembly line with M1, scanning from the 5′ end, and stop on a translocation step.","early":"The bond has formed, but the ribosome hasn’t moved yet: translocate.","late":"You’ve gone one step past.","hints":["Count elongation cycles: each adds one amino acid.","Met is there from initiation; Phe and Gly take two cycles.","Stop after the second translocation."]},{"id":"tc2","goal":3,"prompt":"Build a 4-codon message that makes Met–Trp–Lys and then stops.","why":"AUG · UGG · AAA or AAG · UAA, UAG or UGA: 2 Lys codons × 3 stops = 6 messages work.","general":"Choose Build your own and use exactly 4 codons (12 bases).","uga":"UGA is a stop codon; Trp is only UGG.","noAug":"The ribosome needs AUG to start.","hints":["Start with the start codon.","Trp has only one codon.","AUG UGG AAA UAA (or AAG, and any stop)."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"Message M3 (a eukaryotic mRNA) is 5′-CAUGGAUGAAUAGC-3′. Set the start where a real ribosome would, and run it. What is the polypeptide?","why":"A scanning ribosome starts at the first AUG (bases 2–4): AUG GAU GAA UAG gives Met–Asp–Glu, then stop.","general":"Choose M3, set the start, and step until the subunits separate.","base1":"His–Gly then a stop: translation doesn’t begin at the first base.","aug2":"Met–Asn–Ser and no stop in frame: a scanning ribosome stops at the \u003cstrong>first\u003c/strong> AUG from the 5′ end.","run":"Good start. Now run it to the end, until the subunits separate.","hints":["A eukaryotic ribosome scans from the 5′ end.","Find the first AUG, then read in threes from there.","AUG GAU GAA UAG: Met–Asp–Glu, then stop."]}]},"part3":{"slug":"decode","name":"Decode","heading":"Decode it","intro":"The assembly line always started from mRNA. Here you start from either DNA strand, keep track of the 5′ and 3′ ends yourself, and look at data on how a drug can block translation.","s1":{"title":"Station 1: Three starting points","text":"The same gene can be shown as the coding strand, the template strand or the mRNA. Choose which one you are given, fill in the other two, then translate.","coding":"ATGAAGTGGGCATAG","starts":[{"id":"coding","t":"Coding strand"},{"id":"template","t":"Template strand"},{"id":"mrna","t":"mRNA"}],"pairFb":"DNA strands pair A–T and C–G, antiparallel.","transBad":"The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U). RNA polymerase copies the \u003cstrong>template\u003c/strong> strand.","transGood":"RNA polymerase reads the template 3′ → 5′ and builds the mRNA 5′ → 3′: A→U, T→A, C→G, G→C.","needTemplate":"Fill in the template strand first: transcription copies the template.","fromMrna":"Pair the mRNA’s bases (U→A, A→T, C→G, G→C) to get the template strand.","q":"What polypeptide does this gene code for?","choices":[{"t":"Met–Lys–Trp–Ala–stop","fb":"Amino acids = codons from AUG up to, but not including, the stop codon.","_n":"14616","_k":"aa101f58"},{"t":"Met–Lys–Trp–Ala","fb":"AUG AAG UGG GCA, then UAG stops.","_n":"155e6","_k":"a38b21c7"},{"t":"Tyr–Phe–Thr–Arg","fb":"That reads the template as if it were mRNA. The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U).","_n":"165f6","_k":"8e860cdc"},{"t":"Met–Lys–Trp","fb":"GCA (Ala) comes before the stop.","_n":"175c6","_k":"f0d83d34"}]},"s2":{"title":"Station 2: Find the frame","text":"This mRNA has some leading bases. Tap the base where translation starts. The codon dividers follow from your start, and the protein appears only when the frame is right.","seq":"UCCACAUGGCUAAUGACUAG","good":"The frame starts at the first AUG: AUG GCU AAU GAC UAG gives Met–Ala–Asn–Asp, then stop.","notAug":"That base doesn’t start an AUG. The ribosome scans to the first AUG. Bases before it aren’t translated.","laterAug":"That AUG is out of frame and later in the message. A scanning ribosome stops at the \u003cstrong>first\u003c/strong> AUG from the 5′ end.","first":"The first base isn’t a start. The ribosome scans to the first AUG. Bases before it aren’t translated."},"s3":{"title":"Station 3: Blocking bacterial ribosomes (investigation)","text":"A growth experiment measured how much protein cells made in 30 min, with and without the antibiotic streptomycin.","dataTitle":"Check it with data","head":["Row","Culture","Antibiotic added","Protein made in 30 min (relative units)"],"rows":[["1","\u003ci>E. coli\u003c/i>","none","100"],["2","\u003ci>E. coli\u003c/i>","streptomycin (binds the bacterial small subunit)","8"],["3","Human cells grown in a dish","none","100"],["4","Human cells grown in a dish","streptomycin","97"]],"caption":"Results of a model experiment.","claim":{"q":"Claim","options":[{"t":"Streptomycin has no effect on protein synthesis","_n":"185d6","_k":"944f005c"},{"t":"Streptomycin blocks bacterial ribosomes but hardly affects human ribosomes","_n":"195a6","_k":"6659b90f"},{"t":"Streptomycin blocks human ribosomes more than bacterial ones","_n":"1a5b6","_k":"1a20d783"},{"t":"Streptomycin blocks protein synthesis in every kind of cell","_n":"1b586","_k":"bb6aee46"}]},"evQ":"Evidence: tap the rows that show the drug’s effect","_a":"awcZA2Q=","reason":{"q":"Reasoning","options":[{"t":"Human cells make protein without mRNA","_n":"1c596","_k":"855ecdca"},{"t":"Human cells have no ribosomes","_n":"1d466","_k":"4a85def9"},{"t":"Streptomycin can’t enter any cell","_n":"1e456","_k":"f6ae2e93"},{"t":"Bacterial ribosomes (70S) differ in structure from human cytoplasmic ribosomes (80S)","_n":"1f486","_k":"b5bf3cc2"}]},"claimFb":"Compare row 2 with row 1, and row 4 with row 3: the drug cuts bacterial protein synthesis but hardly changes human protein synthesis.","evFb":"Rows 2 and 4 show the drug’s effect on each kind of cell (rows 1 and 3 are the controls).","reasonFb":"Both kinds of cell have ribosomes; the drug can bind only the bacterial kind because their shapes differ.","done":"Claim, evidence and reasoning fit together: streptomycin cuts bacterial protein synthesis to 8 units (row 2) but leaves human cells at 97 (row 4), because bacterial (70S) and human cytoplasmic (80S) ribosomes differ in structure."},"quickCheck":{"title":"Quick check","summary":"Decode it quick check","items":[{"id":"q1","goal":3,"prompt":"Template 3′-TAC AAA-5′. The mRNA?","choices":[{"t":"3′-AUG UUU-5′","fb":"Complement the template; don’t just swap T for U.","_n":"1g476","_k":"4c55199b"},{"t":"5′-ATG TTT-3′","fb":"Complement the template; don’t just swap T for U.","_n":"1h4a6","_k":"4dd5d5f6"},{"t":"5′-UAC AAA-3′","fb":"Complement the template; don’t just swap T for U.","_n":"1i496","_k":"be815033"},{"t":"5′-AUG UUU-3′","fb":"Right. Each base is complemented: T→A, A→U.","_n":"1j4c6","_k":"38020ef9"}]},{"id":"q2","goal":3,"prompt":"mRNA 5′-GG AUG CCA UAG-3′. How many amino acids?","choices":[{"t":"2","fb":"Right. Met and Pro; then UAG stops.","_n":"1k4b6","_k":"494ee5a9"},{"t":"3","fb":"Met and Pro; GG is before the start and UAG adds nothing.","_n":"1l4e6","_k":"f814b126"},{"t":"4","fb":"Met and Pro; GG is before the start and UAG adds nothing.","_n":"1m4d6","_k":"fd3398ae"},{"t":"5","fb":"Met and Pro; GG is before the start and UAG adds nothing.","_n":"1nd45","_k":"1391e160"}]},{"id":"q3","goal":1,"prompt":"Which site does a new charged tRNA enter?","choices":[{"t":"P","fb":"A for ‘arrive’.","_n":"1od55","_k":"dd3d0fa0"},{"t":"A","fb":"Right. A for ‘arrive’.","_n":"1pd65","_k":"d5a6e4bf"},{"t":"Any free site","fb":"A for ‘arrive’.","_n":"1qd75","_k":"a96fe994"},{"t":"E","fb":"A for ‘arrive’.","_n":"1rd85","_k":"eaf06d20"}]},{"id":"q4","goal":6,"prompt":"In the data, why are human cells barely affected?","choices":[{"t":"They have no mRNA","fb":"Bacterial (70S) and human (80S) ribosomes have different shapes.","_n":"1sd95","_k":"de064510"},{"t":"Streptomycin can’t enter any cell","fb":"Bacterial (70S) and human (80S) ribosomes have different shapes.","_n":"1tda5","_k":"460c785f"},{"t":"They have no ribosomes","fb":"Bacterial (70S) and human (80S) ribosomes have different shapes.","_n":"1udb5","_k":"a0018769"},{"t":"Their ribosomes differ","fb":"Right. Bacterial (70S) and human (80S) ribosomes have different shapes.","_n":"1vcc5","_k":"1992d6ed"}]}]}},"practice":{"activities":[{"id":"order","type":"order","title":"Translation in order","summary":"Translation in order","goal":[1,2],"instruction":"Put the steps of translation in order.","sequences":[{"id":"s1","goal":[1,2],"prompt":"Initiation to the first peptide bond.","steps":["The small subunit binds the mRNA near its 5′ end.","It moves along to the first AUG.","The initiator tRNA carrying Met pairs with AUG.","The large subunit joins; the Met-tRNA is in the P site.","A charged tRNA matching the next codon enters the A site.","A peptide bond joins Met to the new amino acid."],"start":[3,1,5,0,4,2],"wrong":[{"order":[3],"fb":"The small subunit finds the mRNA and AUG first."},{"order":[1,0],"fb":"The small subunit has to bind the mRNA before it can move along it."}],"general":"The small subunit finds the mRNA and AUG first; the large subunit joins last in initiation.","why":"Small subunit, scan to AUG, Met-tRNA, large subunit; then the next tRNA arrives in the A site and the first peptide bond forms.","hints":["Which subunit finds the mRNA?","The small subunit binds, finds AUG and the Met-tRNA pairs, all before the large subunit joins.","Small subunit binds → moves to AUG → Met-tRNA pairs → large subunit joins → tRNA enters A → peptide bond."]},{"id":"s2","goal":[1,2],"prompt":"One elongation cycle and the end.","steps":["A charged tRNA enters the A site.","The chain moves from the P-site tRNA onto the A-site tRNA’s amino acid (a peptide bond forms).","The ribosome moves one codon toward the 3′ end.","The empty tRNA leaves from the E site.","When a stop codon reaches the A site, a release factor frees the chain."],"start":[2,4,0,3,1],"wrong":[{"order":[0,2],"fb":"The bond forms first; then the ribosome moves."},{"order":[2],"fb":"The bond forms first; then the ribosome moves."}],"general":"Arrive, bond, move, exit: the bond forms before the ribosome moves.","why":"Arrive (A site), bond (chain onto the A-site amino acid), translocate, exit from E; at a stop codon, a release factor ends it.","hints":["What has to be in the A site before a bond can form?","The bond forms before the ribosome moves; the empty tRNA can leave only after the move.","tRNA enters A → bond → move one codon → empty tRNA leaves E → release factor at the stop."]}]},{"id":"decode","type":"custom","title":"Decode set","summary":"Decode set","star":true,"goal":[3,5],"instruction":"Six decoding problems. Problems 3 to 6 are non-routine (★); the last two go beyond the Final Check.","items":[{"id":"d1","kind":"chain","goal":3,"prompt":"mRNA 5′-AUG CCU GAA UUC UAG-3′: polypeptide?","_a":"axd4Uk0VTxtgR1oVFRUkVUUXGRVpXwYbbQ==","wrong":[{"match":["Met","Pro","Glu","Phe","stop"],"fb":"Amino acids = codons from AUG up to, but not including, the stop codon."}],"why":"AUG CCU GAA UUC = Met–Pro–Glu–Phe; UAG stops and adds nothing.","hints":["Read the codons in threes from AUG.","AUG = Met, CCU = Pro, GAA = Glu, UUC = Phe.","Met–Pro–Glu–Phe (UAG is the stop)."]},{"id":"d2","kind":"chain","goal":3,"prompt":"Coding strand 5′-ATG GCA TGT AAA TGA-3′: polypeptide?","_a":"axd4Uk0VTxtxWVQVFRUgQEMXGRV1ThAbbQ==","wrong":[{"starts":"Tyr","fb":"The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U). The coding strand already matches the mRNA."},{"match":["Met","Ala","Cys","Lys","stop"],"fb":"Amino acids = codons from AUG up to, but not including, the stop codon."}],"why":"mRNA 5′-AUG GCA UGU AAA UGA-3′: Met–Ala–Cys–Lys, then stop.","hints":["Which strand does the mRNA match?","The coding strand, with U for T: AUG GCA UGU AAA UGA.","Met–Ala–Cys–Lys."]},{"id":"d3","kind":"chain","goal":3,"star":true,"prompt":"Template strand 3′-TAC CGG TTT ATC-5′: polypeptide?","_a":"axd4Uk0VTxtxWVQVFRUvQEMXaA==","wrong":[{"starts":"Tyr","fb":"The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U). That reads the template as if it were mRNA."},{"match":["Met","Ala","Lys","stop"],"fb":"Amino acids = codons from AUG up to, but not including, the stop codon."}],"why":"mRNA 5′-AUG GCC AAA UAG-3′: Met–Ala–Lys, then stop.","hints":["Is the mRNA the same as the template or complementary to it?","Complement each base: 5′-AUG GCC AAA UAG-3′.","Met–Ala–Lys."]},{"id":"d4","kind":"num","goal":3,"star":true,"prompt":"How many different mRNAs (start to stop codon included) could code for Met–Trp–Cys?","_a":"Bg==","unit":"mRNAs","wrong":[{"match":2,"fb":"Cys has 2 codons, and there are 3 stop codons: 1 × 1 × 2 × 3 = 6."},{"match":3,"fb":"Cys has 2 codons, and there are 3 stop codons: 1 × 1 × 2 × 3 = 6."}],"why":"Met (1 codon) × Trp (1) × Cys (2) × stop (3) = 6.","hints":["How many codons does each amino acid have? Don’t forget the stop.","Met 1, Trp 1, Cys 2, stop 3.","1 × 1 × 2 × 3 = 6."]},{"id":"d5","kind":"num","goal":[3,5],"star":true,"prompt":"A 900-base mRNA has its AUG at bases 51–53 and its stop codon at bases 750–752. How many amino acids are in the polypeptide?","_a":"AgYG","unit":"amino acids","wrong":[{"match":300,"fb":"Count only from AUG to the base before the stop: bases 51–749 = 699 bases = 233 codons."},{"match":234,"fb":"Amino acids = codons from AUG up to, but not including, the stop codon."}],"why":"Bases 51–749 = 699 bases = 233 codons, each one amino acid.","hints":["Which bases are translated?","From the A of AUG (base 51) to the base just before the stop (749).","699 ÷ 3 = 233."]},{"id":"d6","kind":"chain","goal":3,"star":true,"prompt":"Template strand 5′-TTA CTT GGC CAT-3′ (note the direction). Polypeptide?","_a":"axd4Uk0VTxtxWVQVFRUvQEMXaA==","wrongDefault":"Reading left to right gives nonsense: the template’s 3′ end is on the right, so the mRNA reads 5′-AUG GCC AAG UAA-3′.","why":"Read from the template’s 3′ end: 3′-TAC CGG TTC ATT-5′ → mRNA 5′-AUG GCC AAG UAA-3′: Met–Ala–Lys.","hints":["Find the template’s 3′ end.","Read the template from its 3′ end: 3′-TAC CGG TTC ATT-5′.","mRNA 5′-AUG GCC AAG UAA-3′: Met–Ala–Lys."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Olena","how":"","instruction":"Olena made one mistake in each answer. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"The template strand is 3′-TAC GGA CTT ACT-5′. Find the polypeptide.","steps":["The mRNA is copied from the template strand.","So the mRNA is 5′-UAC GGA CUU ACU-3′.","Codons: UAC, GGA, CUU, ACU.","Polypeptide: Tyr–Gly–Leu–Thr."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","","These follow from step 2.","This follows from step 2."],"fixes":[{"t":"Swap T for U only.","why":"That’s what she did. The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U).","_n":"1wcd5","_k":"1e4b34b0"},{"t":"Step 2 is correct.","why":"Then the protein wouldn’t start with Met. The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U).","_n":"1x5a5","_k":"1564a3fc"},{"t":"Read the template 5′ → 3′ instead.","why":"The direction isn’t the problem: each base must be complemented.","_n":"1y595","_k":"46729515"},{"t":"Complement each base: mRNA 5′-AUG CCU GAA UGA-3′, giving Met–Pro–Glu.","why":"The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U).","_n":"1z585","_k":"e8555368"}],"hints":["Is the mRNA the same as the template or complementary to it?","Complementary.","5′-AUG CCU GAA UGA-3′."]},{"id":"e2","goal":2,"task":"Describe one elongation cycle.","steps":["A charged tRNA matching the codon enters the A site.","The new amino acid is moved onto the chain held in the A site.","The ribosome moves one codon toward the 3′ end.","The empty tRNA leaves from the E site."],"_a":"AQ==","stepFb":["Step 1 is correct.","","Step 3 is correct, but there’s an earlier mistake.","Step 4 is correct."],"fixes":[{"t":"The growing chain (held by the P-site tRNA) is joined onto the amino acid on the A-site tRNA by a peptide bond.","why":"The new tRNA arrives in the \u003cstrong>A\u003c/strong>ccept site; the chain is held in the \u003cstrong>P\u003c/strong> site; the empty tRNA \u003cstrong>E\u003c/strong>xits.","_n":"20575","_k":"adf3facc"},{"t":"Step 2 is correct.","why":"The chain is in the P site, and it moves to the A-site tRNA, not the other way round.","_n":"215e5","_k":"20c1e288"},{"t":"The amino acid is moved onto the mRNA.","why":"Amino acids never join the mRNA.","_n":"225d5","_k":"b0df6386"},{"t":"The chain is held in the E site.","why":"The E site holds the empty tRNA on its way out. The new tRNA arrives in the \u003cstrong>A\u003c/strong>ccept site; the chain is held in the \u003cstrong>P\u003c/strong> site; the empty tRNA \u003cstrong>E\u003c/strong>xits.","_n":"235c5","_k":"117c9510"}],"hints":["Where is the chain before the bond forms?","In the P site.","Chain moves onto the A-site amino acid."]},{"id":"e3","goal":3,"task":"How many amino acids does 5′-GC AUG AAA UUU UAA-3′ code for?","steps":["Translation starts at AUG.","Codons from AUG: AUG, AAA, UUU, UAA.","Each codon gives one amino acid, so there are 4.","Met–Lys–Phe–stop."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","This follows from step 3."],"fixes":[{"t":"Include GC: 5 amino acids.","why":"The ribosome scans to the first AUG. Bases before it aren’t translated.","_n":"245b5","_k":"df039b72"},{"t":"UAA is a stop and adds no amino acid: 3 amino acids, Met–Lys–Phe.","why":"Amino acids = codons from AUG up to, but not including, the stop codon.","_n":"25525","_k":"1cdb6ba0"},{"t":"Step 3 is correct.","why":"A stop codon has no tRNA.","_n":"26515","_k":"ba611ddb"},{"t":"Count the bases: 14 ÷ 3.","why":"Amino acids = codons from AUG up to, but not including, the stop codon.","_n":"27c85","_k":"8a775e69"}],"hints":["What does UAA code for?","Nothing: it’s a stop.","3 amino acids."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the assembly line: that the chain moves onto the new tRNA, or that bacteria translate while still transcribing?"},{"id":"j2","q":"In your own words, explain what the A, P and E sites each do."},{"id":"j3","q":"Explain to a friend how to get from a template strand to a polypeptide without the usual mistake."},{"id":"j4","q":"Which step of translation is still fuzzy? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which ribosome site holds the tRNA carrying the growing chain, just after translocation?","options":[{"t":"The A site","why":"The A site is where new tRNAs arrive.","_n":"28c95","_k":"570ae1cf"},{"t":"The P site","why":"After translocation, the tRNA holding the chain sits in the P site.","_n":"29c65","_k":"55a702fa"},{"t":"The small subunit’s mRNA groove","why":"That holds the mRNA, not a tRNA.","_n":"2ac75","_k":"bb94bcb0"},{"t":"The E site","why":"Empty tRNAs leave from E.","_n":"2bcc5","_k":"34143683"}]},"b":{"prompt":"Which ribosome site does a new charged tRNA enter?","options":[{"t":"The E site","why":"That’s the exit.","_n":"2ccd5","_k":"37950629"},{"t":"The A site","why":"New charged tRNAs arrive in the A site.","_n":"2dca5","_k":"dd773498"},{"t":"The P site","why":"The new tRNA arrives in the \u003cstrong>A\u003c/strong>ccept site; the chain is held in the \u003cstrong>P\u003c/strong> site; the empty tRNA \u003cstrong>E\u003c/strong>xits.","_n":"2ecb5","_k":"bc6c1c45"},{"t":"Any free site","why":"New tRNAs enter only at A.","_n":"2fd05","_k":"066bada9"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What happens when a stop codon reaches the A site?","options":[{"t":"A release factor binds and the polypeptide is released from the last tRNA","why":"No tRNA matches a stop codon. A release factor binds there and frees the polypeptide.","_n":"2gd15","_k":"3bc07dd6"},{"t":"The ribosome skips to the next AUG","why":"It ends; it doesn’t skip.","_n":"2hce5","_k":"d9901a53"},{"t":"A tRNA with a matching anticodon adds a final amino acid","why":"No tRNA matches a stop codon. A release factor binds there and frees the polypeptide.","_n":"2icd5","_k":"99579d1b"},{"t":"The mRNA is cut at the stop codon","why":"The chain is released; the mRNA isn’t cut.","_n":"2jd05","_k":"8f3fc48d"}]},"b":{"prompt":"What happens during translocation?","options":[{"t":"The tRNA moves its amino acid to the mRNA","why":"Amino acids never join the mRNA.","_n":"2kcf5","_k":"d5b0704f"},{"t":"The ribosome moves toward the 5′ end","why":"Reading is 5′ → 3′.","_n":"2lca5","_k":"8c149fb3"},{"t":"A peptide bond forms","why":"That happens just before translocation.","_n":"2mc95","_k":"03287bb6"},{"t":"The ribosome moves one codon toward the mRNA’s 3′ end, shifting the tRNAs from A to P and from P to E","why":"That frees the A site for the next tRNA.","_n":"2ncc5","_k":"b88a6c34"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"mRNA: 5′-GA AUG GCA UGU AAA UGA-3′. What is the polypeptide?","options":[{"t":"Met–Ala–Cys–Lys","why":"Start at AUG; UGA stops.","_n":"2ocb5","_k":"c9b178e4"},{"t":"Met–Ala–Cys","why":"AAA (Lys) comes before the stop.","_n":"2pd65","_k":"33364101"},{"t":"Glu–Trp–His–…","why":"Translation starts at AUG, not at the first base.","_n":"2qd55","_k":"07faabf7"},{"t":"Met–Ala–Cys–Lys–stop","why":"The stop adds no amino acid.","_n":"2red4","_k":"d44c8b79"}]},"b":{"prompt":"mRNA: 5′-CC AUG CCU GAA UUC UAG-3′. What is the polypeptide?","options":[{"t":"Met–Pro–Glu–Phe","why":"Start at AUG; UAG stops.","_n":"2sec4","_k":"683049f8"},{"t":"Met–Pro–Glu","why":"UUC (Phe) comes before the stop.","_n":"2teb4","_k":"52e2c205"},{"t":"Pro–Cys–Leu–…","why":"Translation starts at AUG, not at the first base.","_n":"2uea4","_k":"16deda6b"},{"t":"Met–Pro–Glu–Phe–stop","why":"Amino acids = codons from AUG up to, but not including, the stop codon.","_n":"2ve94","_k":"c1053fb8"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"The template strand of a gene is 3′-TAC CGG TTT ATC-5′. What polypeptide does it code for?","options":[{"t":"Met–Ala–Lys","why":"mRNA 5′-AUG GCC AAA UAG-3′.","_n":"2we84","_k":"5c1da937"},{"t":"Met–Gly–Phe","why":"Complement CGG to GCC (Ala) and TTT to AAA (Lys).","_n":"2xe74","_k":"687d216c"},{"t":"Tyr–Arg–Phe–Ile","why":"That reads the template as if it were mRNA.","_n":"2ye64","_k":"89f7b3b8"},{"t":"Met–Ala–Lys–Ile","why":"ATC on the template becomes UAG, a stop.","_n":"2zf54","_k":"4005f509"}]},"b":{"prompt":"The template strand of a gene is 3′-TAC GGA CTT ACT-5′. What polypeptide does it code for?","options":[{"t":"Met–Pro–Glu–Thr","why":"ACT on the template becomes UGA, a stop.","_n":"30f44","_k":"e5679f05"},{"t":"Met–Gly–Leu","why":"Complement each base first.","_n":"31e74","_k":"45dc5a72"},{"t":"Met–Pro–Glu","why":"mRNA 5′-AUG CCU GAA UGA-3′.","_n":"32e84","_k":"e0d88509"},{"t":"Tyr–Gly–Leu–Thr","why":"The template strand is the \u003cstrong>complement\u003c/strong> of the mRNA. Only the coding strand matches the mRNA (with T for U).","_n":"33e94","_k":"df64fbd2"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Ribosomes load onto an mRNA every 5 s, and each one takes 30 s to make a complete polypeptide. The first loads at time 0. How many polypeptides are finished at 60 s?","options":[{"t":"1","why":"Each ribosome makes its own copy.","_n":"34ea4","_k":"452b27fd"},{"t":"2","why":"Ribosomes work at the same time, not one after another.","_n":"35e34","_k":"ce8e2bca"},{"t":"7","why":"Ribosomes loading at 0, 5, …, 30 s finish by 60 s: 7 of them.","_n":"36e44","_k":"22ef8639"},{"t":"12","why":"12 ribosomes have loaded by 55 s, but most haven’t finished.","_n":"37e54","_k":"d3e4f04a"}]},"b":{"prompt":"Ribosomes load every 4 s, and each takes 40 s to make a polypeptide. The first loads at 0. How many are finished at 60 s?","options":[{"t":"1","why":"Each ribosome makes its own complete copy. Five ribosomes → five polypeptides.","_n":"38e64","_k":"6f2e128e"},{"t":"3","why":"Count loadings from 0 to 20 s in steps of 4.","_n":"39ef4","_k":"77196bd3"},{"t":"6","why":"Those loading at 0, 4, …, 20 s finish by 60 s.","_n":"3af04","_k":"f990e487"},{"t":"15","why":"15 have loaded by 56 s, but most aren’t done.","_n":"3b794","_k":"c0a501f9"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A bacterium has a mutant release factor that can’t bind UAG. A gene in this bacterium ends with UAG. What is the most likely result for that protein?","options":[{"t":"The ribosome jumps back to AUG and starts again","why":"Ribosomes don’t jump backward.","_n":"3c784","_k":"39cf3661"},{"t":"The protein is released normally because UAG is a stop","why":"A stop codon works only when a release factor binds it.","_n":"3d7b4","_k":"51650300"},{"t":"A tyrosine is added at UAG","why":"UAU and UAC are Tyr; no tRNA reads UAG.","_n":"3e7a4","_k":"dc9f3fa2"},{"t":"The ribosome stalls at UAG and the polypeptide is not released","why":"No tRNA reads UAG, and the release factor can’t.","_n":"3f754","_k":"314c73be"}]},"b":{"prompt":"A drug stops tRNAs from leaving the E site. What happens to translation?","options":[{"t":"After a cycle or two, translocation is blocked and the ribosome stalls","why":"The E site stays full, so the tRNAs can’t shift along.","_n":"3g744","_k":"f47b4916"},{"t":"The ribosome reads the next codon twice","why":"It can’t move at all.","_n":"3h774","_k":"967bb1f1"},{"t":"Nothing: tRNAs aren’t needed after the bond forms","why":"They must leave to make room.","_n":"3i764","_k":"1c262e49"},{"t":"New tRNAs enter the E site instead","why":"New tRNAs enter only at A.","_n":"3j714","_k":"b2f37ce9"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best description of one elongation cycle?","options":[{"t":"“The mRNA moves through the tRNA, which builds the chain.”","why":"The ribosome joins amino acids; tRNAs deliver them.","_n":"3k704","_k":"82535fe1"},{"t":"“The ribosome reads the whole mRNA, then all the amino acids join at once.”","why":"The chain grows one amino acid per codon.","_n":"3l734","_k":"14a36d39"},{"t":"“A charged tRNA pairs with the codon in the A site; the chain on the P-site tRNA joins its amino acid by a peptide bond; the ribosome moves one codon, so the empty tRNA leaves from E.”","why":"The new tRNA arrives in the \u003cstrong>A\u003c/strong>ccept site; the chain is held in the \u003cstrong>P\u003c/strong> site; the empty tRNA \u003cstrong>E\u003c/strong>xits.","_n":"3m744","_k":"cc9f5684"},{"t":"“A tRNA in the P site brings an amino acid, which joins the A-site chain, and the ribosome moves backward.”","why":"The new tRNA arrives in the \u003cstrong>A\u003c/strong>ccept site; the chain is held in the \u003cstrong>P\u003c/strong> site; the empty tRNA \u003cstrong>E\u003c/strong>xits.","_n":"3n714","_k":"f49dc0ad"}]},"b":{"prompt":"Which is the best description of initiation?","options":[{"t":"“The Met-tRNA enters the A site first.”","why":"The new tRNA arrives in the \u003cstrong>A\u003c/strong>ccept site; the chain is held in the \u003cstrong>P\u003c/strong> site; the empty tRNA \u003cstrong>E\u003c/strong>xits.","_n":"3o724","_k":"6cd3a167"},{"t":"“The large subunit finds the AUG; the small subunit joins last.”","why":"The small subunit binds first.","_n":"3p774","_k":"b6da3b39"},{"t":"“Initiation starts at the first base of the mRNA.”","why":"The ribosome scans to the first AUG. Bases before it aren’t translated.","_n":"3q784","_k":"d6fa1f3f"},{"t":"“The small subunit binds the mRNA and finds the first AUG; the Met-tRNA pairs with it in the P site; then the large subunit joins.”","why":"Small subunit first, then the Met-tRNA in the P site, then the large subunit.","_n":"3r754","_k":"dab8edb2"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which flow chart is correct for a human cell making a protein that is secreted?","options":[{"t":"DNA → protein → mRNA → secreted","why":"mRNA comes before protein.","_n":"3s764","_k":"5dee755f"},{"t":"DNA (nucleus) → mRNA (processed, leaves the nucleus) → ribosome on rough ER → protein into the ER → Golgi → secreted","why":"Proteins for export are made on ribosomes bound to the rough ER.","_n":"3t6b4","_k":"8bf9e904"},{"t":"mRNA (nucleus) → DNA → protein","why":"Information flows DNA → RNA → protein.","_n":"3u6c4","_k":"1512cbcb"},{"t":"DNA (cytoplasm) → mRNA → ribosome on smooth ER → secreted","why":"Human DNA is in the nucleus, and ribosomes stud the \u003cstrong>rough\u003c/strong> ER.","_n":"3v753","_k":"0707a47c"}]},"b":{"prompt":"Which flow chart is correct for a bacterium?","options":[{"t":"DNA → protein, with no mRNA","why":"mRNA is always the go-between.","_n":"3w743","_k":"e7bc4334"},{"t":"DNA (nucleus) → mRNA leaves the nucleus → ribosome → protein","why":"Bacteria have no nucleus.","_n":"3x733","_k":"87915bf8"},{"t":"DNA → mRNA (introns spliced out) → protein","why":"Bacteria don’t splice.","_n":"3y723","_k":"c36a5170"},{"t":"DNA (cytoplasm) → mRNA, with ribosomes translating it while it is still being made → protein","why":"No nucleus, so translation can begin before transcription ends.","_n":"3z793","_k":"e3ac5d2f"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Streptomycin binds the small subunit of bacterial ribosomes. Why can it treat a bacterial infection without stopping protein synthesis in the patient’s cells?","options":[{"t":"Human cells don’t make proteins while they’re infected","why":"They do.","_n":"40783","_k":"c68e913e"},{"t":"Streptomycin only works on mRNA with introns","why":"It acts on ribosomes, not on introns.","_n":"41773","_k":"a064bdac"},{"t":"Bacterial ribosomes (70S) differ in structure from human cytoplasmic ribosomes (80S), so the drug binds only the bacterial ones","why":"Different shapes: the drug fits only the bacterial ribosome.","_n":"42763","_k":"52bede61"},{"t":"Humans have no small ribosomal subunit","why":"Both kinds have two subunits.","_n":"436d3","_k":"55914736"}]},"b":{"prompt":"Erythromycin binds the large subunit of bacterial ribosomes. Why can it treat infections safely?","options":[{"t":"Bacteria don’t need ribosomes","why":"Every cell needs ribosomes to make proteins.","_n":"446c3","_k":"52adb592"},{"t":"The bacterial large subunit differs from the human one, so the drug blocks bacterial translation but not human cytoplasmic translation","why":"Different shapes: the drug fits only the bacterial large subunit.","_n":"456f3","_k":"659b907d"},{"t":"Erythromycin destroys bacterial DNA","why":"It acts on ribosomes.","_n":"46703","_k":"4ec04f68"},{"t":"Human ribosomes have no large subunit","why":"They do; it’s a different shape.","_n":"47713","_k":"d5457310"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"To make human insulin in bacteria, scientists insert a copy of the insulin gene made from mRNA (cDNA), not the gene cut from human DNA. Why?","options":[{"t":"mRNA can’t be turned into DNA","why":"Reverse transcriptase does exactly that.","_n":"48723","_k":"a32b4358"},{"t":"The human gene has introns, and bacteria can’t splice them out; cDNA has no introns","why":"Bacteria have no spliceosomes, so a human gene must go in without introns (as cDNA).","_n":"49733","_k":"2ab06893"},{"t":"Bacteria can’t read DNA","why":"They read their own DNA all the time.","_n":"4a743","_k":"40bae2eb"},{"t":"The human gene has no start codon","why":"It does.","_n":"4b753","_k":"8f77a3a9"}]},"b":{"prompt":"A human gene inserted into bacteria, introns included, produces a wrong, usually much shorter protein. What is the best explanation?","options":[{"t":"Bacterial ribosomes skip introns automatically","why":"They can’t recognise introns.","_n":"4c763","_k":"03604cdf"},{"t":"Introns are removed by bacterial ribosomes but the exons are too","why":"Ribosomes don’t cut RNA.","_n":"4d673","_k":"4f2c7f0e"},{"t":"Bacteria have no spliceosomes, so the introns are translated as if they were coding sequence, and they often contain early stop codons","why":"Bacteria have no spliceosomes, so a human gene must go in without introns (as cDNA).","_n":"4e683","_k":"f1aebbab"},{"t":"Bacteria use a different genetic code","why":"The code is nearly universal.","_n":"4fe14","_k":"957a04d6"}]}}]},"task":{"title":"One message, two codes","summary":"One message, two codes","statement":"\u003cp>Human mitochondria read a few codons differently: UGA means Trp, and AGA and AGG mean stop. Design a 4-codon mRNA that gives the same polypeptide, Met–Pro–Trp, in both the cytoplasm and a mitochondrion. Can you find all the answers?\u003c/p>\u003col class=\"ps-conds\">\u003cli>The first codon is AUG.\u003c/li>\u003cli>In the standard code, the message makes Met–Pro–Trp and then stops.\u003c/li>\u003cli>In the mitochondrial code, the message makes Met–Pro–Trp and then stops.\u003c/li>\u003c/ol>","checks":["Starts with AUG","Standard code: Met–Pro–Trp, then stop","Mitochondrial code: Met–Pro–Trp, then stop"],"tips":["Translation needs a start.","Which codons are Pro? Which single codon is Trp in the standard code?","UGA is Trp in mitochondria but a stop in the cytoplasm. Which stop cod
