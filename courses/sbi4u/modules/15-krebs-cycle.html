.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 15 Krebs Cycle: carbon wheel (S2), energy ledger (S3), ¹⁴C tracker, totals table, data station, practice, task. Tokens only. */
/* radio groups (copied from SBI4U 08) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* stepper */
.kc-stp{display:inline-flex;align-items:stretch;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.kc-stb{min-width:40px;min-height:40px;border:0;background:var(--sheet);color:var(--ink);font-size:1.2rem;font-weight:700;padding:0}
.kc-stb:disabled{opacity:.4}
.kc-stp output{min-width:2.6em;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);padding:0 .4em;line-height:40px}

/* hero equation: brown carbon dots over the carbon compounds; NADH teal, FADH₂ cerulean, ATP orange */
.hero .hero-eq .kc-heq{font-size:.62em;white-space:normal;line-height:1.85}
.kc-hc{position:relative;display:inline-block}
.kc-hd{position:absolute;left:50%;top:-.3em;transform:translateX(-50%);display:flex;gap:.14em}
.kc-hd b{display:block;width:.24em;height:.24em;border-radius:50%;background:var(--bio-carbon)}
.kc-ha{color:var(--bio-atp);font-weight:700}
.kc-hn{color:var(--bio-nadh);font-weight:700}
.kc-hf{color:var(--bio-fadh);font-weight:700}
.kc-hero{max-width:480px;margin:0 auto}

/* SVG pieces */
.kc-svg{display:block;width:100%;height:auto;overflow:visible}
.kc-mat{fill:var(--ink-2);fill-opacity:.05;stroke:var(--ink-2);stroke-width:1.6}
.kc-mem{fill:none;stroke:var(--ink-2);stroke-width:1;opacity:.55}
.kc-hout{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.kc-hin{fill:var(--ink-2);fill-opacity:.06;stroke:var(--ink-2);stroke-width:1.6}
.kc-sub{font:400 10.5px var(--font-ui);fill:var(--ink-2)}
.kc-lab{font:700 10.5px var(--font-ui);fill:var(--ink)}
.kc-bxt{font:700 11px var(--font-ui);fill:var(--ink)}
.kc-nl{font:700 11.5px var(--font-ui);fill:var(--ink)}
.kc-hl{font:700 11px var(--font-ui);fill:var(--ink)}
.kc-stn{font:700 10.5px var(--font-ui);fill:var(--ink-2)}
.kc-enz{font:italic 400 10px var(--font-ui);fill:var(--ink)}
.kc-box{fill:var(--sheet);stroke:var(--rule);stroke-width:1.4}
.kc-arr{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kc-arr.hi{stroke:var(--hi);stroke-width:3.5}
.kc-ah{stroke-dasharray:none}
.kc-ring{fill:none;stroke:var(--ink-2);stroke-width:2.4}
.kc-ring.hi{stroke:var(--hi);stroke-width:4.5}
.kc-ringh{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.kc-ringh.hi{stroke:var(--hi);stroke-width:3.5}
.kc-faint{opacity:.35;stroke-dasharray:4 4}
.kc-gate{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.kc-glow{fill:var(--hi-soft);stroke:var(--hi);stroke-width:3}
.kc-mol{fill:var(--sheet);stroke:var(--bio-carbon);stroke-width:1.8}
.kc-hmol{stroke-width:2.6}
.kc-pill{fill:var(--sheet);stroke:var(--bio-carbon);stroke-width:1.5}
.kc-empty{fill:none;stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3;opacity:.7}
.kc-c{fill:var(--bio-carbon)}
.kc-cn{font:700 9px var(--font-ui);fill:var(--bio-carbon)}
.kc-ring14{fill:none;stroke:var(--ink);stroke-width:1.4}
.kc-cnt{font:700 11px var(--font-ui);fill:var(--ink)}
.kc-co2{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3}
.kc-tk{font:700 9px var(--font-ui);fill:var(--ink)}
.kc-cs{fill:var(--c);stroke:var(--c);stroke-width:1}
.kc-cst{font:700 9.5px var(--font-ui);fill:var(--sheet)}
.kc-co{fill:var(--sheet);stroke:var(--c);stroke-width:1.6}
.kc-cot{font:700 9.5px var(--font-ui);fill:var(--c)}
.kc-ctr{font:700 11px var(--font-ui);fill:var(--ink-2)}
.kc-ctrb{font:700 26px var(--font-ui);fill:var(--ink)}
.kc-ctrb2{font:700 15px var(--font-ui);fill:var(--ink)}
.kc-nadt{fill:var(--sheet);stroke:var(--bio-nadh);stroke-width:1.8}
.kc-tray{fill:var(--sheet);stroke:var(--rule);stroke-width:1.4;stroke-dasharray:4 3}
.kc-zone{fill:var(--sheet);stroke:var(--rule);stroke-width:1.4}
.kc-cyc{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:5 4}

/* Explore panel */
.kc-stage{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px}
.kc-cap{font-size:.92rem;margin:8px 0 0}
.kc-row{margin:0 0 12px}
.kc-fuel{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin:0 0 4px}
.kc-fuel .btn{min-height:40px}
.kc-fa{display:inline-flex;flex-direction:column;gap:2px}
.kc-player{margin:8px 0 4px}
.kc-player .btn{min-height:40px}
.kc-stat{min-height:2.7em;font-size:.92rem;margin:6px 0;padding:4px 8px;border-radius:6px}
.kc-stat.bad{background:var(--bad-bg)}
.kc-panel{margin:6px 0 10px}
.kc-sel select{font:inherit;font-size:.92rem;min-height:40px;padding:4px 8px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%}
.kc-tog{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 10px}
.kc-chk{display:inline-flex;align-items:center;gap:6px;min-height:32px;font-size:.92rem}
.kc-chk input{width:20px;height:20px;margin:0}
.kc-note{margin-top:6px}
.kc-conc{margin-top:10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.kc-ch{margin:0 0 6px;font-weight:700;font-size:.92rem}
.kc-br{display:grid;grid-template-columns:9.5em minmax(0,1fr) 2.4em;align-items:center;gap:8px;font-size:.86rem;margin:3px 0}
.kc-bt{position:relative;height:12px;border:1px solid var(--rule);border-radius:6px;background:var(--plot-grid)}
.kc-bt i{display:block;height:100%;border-radius:5px;background:var(--bio-carbon)}
.kc-bt b{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink)}
.kc-bv{text-align:right;font-variant-numeric:tabular-nums}

/* S3 energy ledger */
.kc-led{margin-top:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.kc-led summary{cursor:pointer;font-weight:700;font-size:.92rem}
.kc-lsd{font-weight:400;color:var(--ink-2);font-size:.85rem;text-decoration:underline}
.kc-led[open] .kc-lsd{display:none}
.kc-lh{font-weight:700;margin:8px 0 4px}
.kc-lt{border-collapse:collapse;font-size:.85rem;margin:8px 0;min-width:300px}
.kc-lt th,.kc-lt td{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:right}
.kc-lt th[scope="row"]{text-align:left}
.kc-lt thead th{font-size:.78rem;vertical-align:bottom}
.kc-gl{color:var(--ink-2);font-style:italic}
.kc-tr{display:grid;grid-template-columns:4.2em minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.kc-tn{font-weight:700}
.kc-tal{display:inline-flex;flex-wrap:wrap;gap:2px;min-width:0}
.kc-tal i{display:block;width:7px;height:12px;border-radius:2px;background:var(--c)}
.kc-tal b{font-size:.8rem;margin-left:3px}

/* Part 3 */
.kc-sta h3{margin-top:0}
.kc-s1btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.kc-s1btns .btn{min-height:40px}
.kc-done{opacity:1}
.kc-trk{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px;max-width:640px}
.kc-s1cap{margin:8px 0 4px;min-height:2.6em}
.kc-6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:360px;margin:4px 0}
.kc-6 i{display:block;height:16px;border-radius:4px;box-sizing:border-box}
.kc-6 i.org,.kc-k.org{background:var(--bio-carbon)}
.kc-6 i.gone,.kc-k.gone{background:var(--sheet);border:2px solid var(--ink-2)}
.kc-k{display:inline-block;width:.9em;height:.9em;border-radius:3px;vertical-align:-.1em;box-sizing:border-box}
.kc-ask{margin-top:12px}
.kc-unit{font-weight:700}
.kc-nchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.kc-nchip{touch-action:none;min-width:44px;min-height:40px;font-weight:700;font-variant-numeric:tabular-nums}
.kc-nchip.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.kc-tt{border-collapse:collapse;font-size:.92rem;min-width:520px;margin-top:6px}
.kc-tt th,.kc-tt td{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:center}
.kc-tt th[scope="row"],.kc-tt thead th:first-child,.kc-tt td:nth-child(2){text-align:left}
.kc-tt tr.kc-tot th,.kc-tt tr.kc-tot td{border-top:2px solid var(--ink)}
.kc-cell{min-width:64px;min-height:38px;border:1.5px dashed var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:6px;font-weight:700;font-size:.92rem;padding:2px 6px}
.kc-cell.ready{border-color:var(--hi);border-style:solid}
.kc-cell.ok{border:1.5px solid var(--green);background:var(--good-bg);opacity:1}
.kc-q{color:var(--ink-2)}
.kc-ghost{position:fixed;z-index:60;transform:translate(-50%,-50%);pointer-events:none;background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:.25em .8em;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.kc-dt{border-collapse:collapse;font-size:.92rem;width:100%;margin:8px 0}
.kc-dt th,.kc-dt td{padding:5px 8px;border-bottom:1px solid var(--rule);text-align:left}
.kc-pr{margin:14px 0}
.kc-tp{margin:0 0 6px}
.kc-prc{margin:6px 0}
.kc-prc .chip{text-align:left}

/* Practice */
.kc-tgp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kc-tgc label{font-weight:700}

/* Task */
.kc-conds{margin:6px 0 0;padding-left:1.4em}
.kc-tin{display:grid;gap:10px;margin:10px 0}
.kc-th{font-size:.95rem;margin:10px 0 4px}
.kc-fsvg{display:block;height:36px;width:auto;max-width:100%}
.kc-hex{fill:var(--sheet);stroke:var(--bio-carbon);stroke-width:1.6}
.kc-tpv .kc-br{grid-template-columns:minmax(0,11em) minmax(0,1fr) 2.4em}

@media (max-width:700px){
  .kc-br{grid-template-columns:7.5em minmax(0,1fr) 2.2em}
  .kc-tpv .kc-br{grid-template-columns:minmax(0,8em) minmax(0,1fr) 2.2em}
}
/* phones: the wheel is drawn at about 0.7 scale, so its text is set larger (sizes are in SVG units) */
@media (max-width:600px){
  .kc-stage{padding:2px;margin:0 -8px}
  .kc-nl{font-size:13.5px}
  .kc-sub,.kc-stn{font-size:12px}
  .kc-bxt{font-size:12.5px}
  .kc-enz{font-size:11.5px}
  .kc-ctr{font-size:12.5px}
  .kc-cst,.kc-cot{font-size:10.5px}
  .kc-tk{font-size:10px}
  .kc-hl{font-size:12.5px}
  .kc-trk .kc-bxt{font-size:14px}
  .kc-trk .kc-tk{font-size:10.5px}
}

-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"4906465e","content":{"id":"15-krebs-cycle","kind":"topic","title":"The Krebs cycle","topic":"Krebs Cycle","readyTopic":"the Krebs cycle","hero":{"eq":"\u003cspan class=\"kc-heq bio-chem\">\u003cspan class=\"kc-hc\">acetyl-CoA\u003ci class=\"kc-hd\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003cb>\u003c/b>\u003c/i>\u003c/span> (2C) + \u003cspan class=\"kc-hc\">oxaloacetate\u003ci class=\"kc-hd\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003c/i>\u003c/span> (4C) → \u003cspan class=\"kc-hc\">citrate\u003ci class=\"kc-hd\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003c/i>\u003c/span> (6C) → … → \u003cspan class=\"kc-hc\">oxaloacetate\u003ci class=\"kc-hd\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003cb>\u003c/b>\u003c/i>\u003c/span> (4C) + 2 \u003cspan class=\"kc-hc\">CO₂\u003ci class=\"kc-hd\" aria-hidden=\"true\">\u003cb>\u003c/b>\u003c/i>\u003c/span>, along with 3 \u003cspan class=\"kc-hn\">NADH\u003c/span>, 1 \u003cspan class=\"kc-hf\">FADH₂\u003c/span> and 1 \u003cspan class=\"kc-ha\">ATP\u003c/span>\u003c/span>","eqLabel":"acetyl-CoA (2C) plus oxaloacetate (4C) gives citrate (6C), then, after several steps, oxaloacetate (4C) plus 2 CO₂, along with 3 NADH, 1 FADH₂ and 1 ATP","eqSize":"sm","headline":"A wheel that strips a fuel down to CO₂","text":"Glycolysis left most of glucose’s energy locked inside two \u003cstrong>pyruvate\u003c/strong> molecules. In the mitochondrial \u003cstrong>matrix\u003c/strong>, each pyruvate is trimmed to a 2-carbon \u003cstrong>acetyl\u003c/strong> group, which is fed into the \u003cstrong>Krebs cycle\u003c/strong>. Turn by turn, the cycle pulls off carbon as \u003cstrong>CO₂\u003c/strong> and hands high-energy electrons to \u003cstrong>NAD⁺\u003c/strong> and \u003cstrong>FAD\u003c/strong>. At the end of each turn, \u003cstrong>oxaloacetate\u003c/strong> is back where it started.","fig":{"html":"\u003cdiv class=\"kc-hero\" id=\"kc-hero\" role=\"img\" aria-label=\"A pyruvate with three brown carbon dots drifts into the matrix of a mitochondrion. One carbon breaks off as CO₂ and an empty NAD⁺ fills to NADH; the other two carbons ride in on CoA. They join a 4-carbon oxaloacetate to make 6-carbon citrate. The wheel turns: two carbons peel off as CO₂, three NADH and one FADH₂ fill, and one ATP pops out. The wheel is back to 4-carbon oxaloacetate. A counter reads Turn 1 of 2 for one glucose.\">\u003c/div>"}},"goals":["I can describe pyruvate oxidation: where it happens, and what goes in and comes out.","I can describe the Krebs cycle: acetyl-CoA joining oxaloacetate, the carbon changes 6C → 5C → 4C, and oxaloacetate regenerated.","I can count the products per turn and per glucose (NADH, FADH₂, ATP, CO₂).","I can track all six carbons of glucose to CO₂.","I can predict what happens when a step is blocked or NAD⁺ runs out, and explain why the cycle depends on O₂.","I can apply the cycle to real situations: vitamins, other fuels, and experimental data."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Glycolysis products","goal":1,"prompt":"What does glycolysis produce from one glucose (net)?","options":[{"t":"2 pyruvate, 2 ATP, 2 NADH","why":"4 ATP are made, but 2 were invested, so the net is 2.","_n":"0d2f","_k":"6e7d7537"},{"t":"2 pyruvate, 4 ATP, 2 NADH","why":"2 ATP were spent in the investment phase.","_n":"1d3f","_k":"255ac7bc"},{"t":"1 pyruvate, 2 ATP, 1 NADH","why":"6C → 2 × 3C.","_n":"2d4f","_k":"93bf2a40"},{"t":"6 CO₂, 2 ATP, 2 NADH","why":"No CO₂ is released in glycolysis.","_n":"3d5f","_k":"aefdf730"}],"hints":["How many carbons in glucose, and in pyruvate?","6C splits into two 3C molecules.","2 pyruvate, net 2 ATP, 2 NADH."]},{"id":"w2","skill":"Glycolysis products","goal":4,"prompt":"How many carbon atoms are in one pyruvate molecule?","options":[{"t":"2","why":"Acetyl has 2; pyruvate has 3.","_n":"4d6f","_k":"f6323db4"},{"t":"3","why":"Glucose’s 6 carbons split evenly into two pyruvates.","_n":"5d7f","_k":"1b69aa5f"},{"t":"4","why":"Oxaloacetate has 4.","_n":"6d8f","_k":"ad6c8ab8"},{"t":"6","why":"That’s glucose.","_n":"7d9f","_k":"8ed081b8"}],"hints":["Glucose is C₆H₁₂O₆.","It splits into 2 equal pieces.","6 ÷ 2 = 3."]},{"id":"w3","skill":"Carriers and oxidation","goal":3,"prompt":"When NAD⁺ becomes NADH, what has happened?","options":[{"t":"NAD⁺ released energy as ATP","why":"NADH carries electrons; it isn’t ATP.","_n":"8daf","_k":"74030b9b"},{"t":"NAD⁺ was reduced: it gained 2 electrons and a hydrogen ion from a substrate","why":"The substrate that lost them was oxidized.","_n":"99ae","_k":"4f592583"},{"t":"NAD⁺ combined with O₂","why":"O₂ isn’t involved here.","_n":"a99e","_k":"8c50d3c0"},{"t":"NAD⁺ was oxidized","why":"Gaining electrons is reduction (RIG).","_n":"b98e","_k":"7c8f7f46"}],"hints":["OIL RIG.","NADH carries more electrons than NAD⁺.","Gained electrons, so reduced."]},{"id":"w4","skill":"Carriers and oxidation","goal":5,"prompt":"A cell’s supply of NAD⁺ runs out. What happens to steps that need NAD⁺?","options":[{"t":"They stop, because there is nothing to accept the electrons","why":"A dehydrogenase needs an empty carrier.","_n":"c97e","_k":"22cfa01b"},{"t":"They speed up","why":"Without the acceptor, the reaction can’t happen.","_n":"d9ee","_k":"942d6ef9"},{"t":"They use O₂ instead","why":"Those enzymes can’t hand electrons to O₂.","_n":"e9de","_k":"953c9c95"},{"t":"They continue but make FADH₂ only","why":"Each enzyme uses its own carrier.","_n":"f9ce","_k":"29f09bc9"}],"hints":["What does NAD⁺ do in these reactions?","It accepts electrons.","No acceptor, no reaction."]},{"id":"w5","skill":"Cell locations","goal":1,"prompt":"Where does glycolysis happen?","options":[{"t":"Mitochondrial matrix","why":"Glycolysis is outside the mitochondrion.","_n":"g9be","_k":"d9d6336d"},{"t":"Inner mitochondrial membrane","why":"That’s the electron transport chain.","_n":"ha2e","_k":"75c3b95a"},{"t":"Nucleus","why":"The nucleus holds DNA, not glycolysis.","_n":"ia1e","_k":"64c28438"},{"t":"Cytosol","why":"Glycolysis needs no organelle; even bacteria do it.","_n":"ja0e","_k":"b5ce4d41"}],"hints":["Do bacteria (no mitochondria) do glycolysis?","Yes.","Cytosol."]},{"id":"w6","skill":"Cell locations","goal":2,"prompt":"Which part of the mitochondrion is the fluid inside the inner membrane?","options":[{"t":"The intermembrane space","why":"That’s between the two membranes.","_n":"ka1e","_k":"f618f882"},{"t":"The matrix","why":"The Krebs cycle runs there.","_n":"l9ee","_k":"2818cf8e"},{"t":"The stroma","why":"Stroma is the fluid in a chloroplast.","_n":"m9fe","_k":"bbf1f5eb"},{"t":"The cristae","why":"Cristae are the folds of the inner membrane itself.","_n":"n9ce","_k":"be4859b1"}],"hints":["Inner membrane → inside it.","Not between membranes.","Matrix."]}],"refreshers":{"Glycolysis products":"One glucose (6C) → 2 pyruvate (3C each), net 2 ATP and 2 NADH, in the cytosol. No CO₂ yet.","Carriers and oxidation":"Oxidation is loss of electrons (often as H atoms); reduction is gain. NAD⁺ + 2H → NADH + H⁺ means NAD⁺ is reduced and the fuel is oxidized.","Cell locations":"Cytosol: glycolysis. Matrix: pyruvate oxidation and the Krebs cycle. Inner membrane: electron transport chain and ATP synthase."}}},"explore":{"heading":"Carbon wheel","intro":"Feed fuel into the matrix and turn the wheel step by step. Watch the carbons leave as CO₂ and the carriers fill up.","mols":[{"id":"cit","t":"citrate","c":6},{"id":"iso","t":"isocitrate","c":6},{"id":"akg","t":"α-ketoglutarate","c":5},{"id":"suc","t":"succinyl-CoA","c":4},{"id":"sca","t":"succinate","c":4},{"id":"fum","t":"fumarate","c":4},{"id":"mal","t":"malate","c":4},{"id":"oaa","t":"oxaloacetate","c":4}],"steps":[{"n":0,"eq":"pyruvate (3C) + CoA → acetyl-CoA (2C) + CO₂, with NAD⁺ → NADH","from":"pyruvate","to":"acetyl-CoA","enz":"pyruvate dehydrogenase complex","co2":1,"nadh":1},{"n":1,"eq":"acetyl-CoA (2C) + oxaloacetate (4C) → citrate (6C); CoA is released","from":"oxaloacetate","to":"citrate","enz":"citrate synthase"},{"n":2,"eq":"citrate (6C) → isocitrate (6C): a rearrangement","from":"citrate","to":"isocitrate","enz":"aconitase"},{"n":3,"eq":"isocitrate (6C) → α-ketoglutarate (5C) + CO₂, with NAD⁺ → NADH","from":"isocitrate","to":"α-ketoglutarate","enz":"isocitrate dehydrogenase","co2":1,"nadh":1},{"n":4,"eq":"α-ketoglutarate (5C) → succinyl-CoA (4C) + CO₂, with NAD⁺ → NADH","from":"α-ketoglutarate","to":"succinyl-CoA","enz":"α-ketoglutarate dehydrogenase","co2":1,"nadh":1},{"n":5,"eq":"succinyl-CoA (4C) → succinate (4C), with GDP + Pᵢ → GTP → ATP (substrate-level phosphorylation)","from":"succinyl-CoA","to":"succinate","enz":"succinyl-CoA synthetase","atp":1},{"n":6,"eq":"succinate (4C) → fumarate (4C), with FAD → FADH₂","from":"succinate","to":"fumarate","enz":"succinate dehydrogenase (sits in the inner membrane)","fadh":1},{"n":7,"eq":"fumarate (4C) + H₂O → malate (4C)","from":"fumarate","to":"malate","enz":"fumarase"},{"n":8,"eq":"malate (4C) → oxaloacetate (4C), with NAD⁺ → NADH","from":"malate","to":"oxaloacetate","enz":"malate dehydrogenase","nadh":1}],"blocks":[{"id":"none","t":"none"},{"id":"3","t":"isocitrate dehydrogenase"},{"id":"4","t":"α-ketoglutarate dehydrogenase"},{"id":"6","t":"succinate dehydrogenase"},{"id":"7","t":"fumarase"},{"id":"8","t":"malate dehydrogenase"}],"oaaNote":"The model matrix holds 3 oxaloacetate, so up to 3 acetyl groups can be in the wheel at once. FAD is always available.","acetylNote":"from fats: see module 20","predIntro":"Make a prediction first. Then the carbon wheel will show you what really happens.","predictions":[{"id":"p1","prompt":"Start: “+ 1 glucose” (2 pyruvate waiting). After pyruvate oxidation of both pyruvates (before the cycle), how many CO₂ have been released?","options":[{"t":"0","_n":"o9de","_k":"6d257f17"},{"t":"2","_n":"p9ae","_k":"3f175ce6"},{"t":"4","_n":"q9be","_k":"892a26fb"},{"t":"6","_n":"ra8e","_k":"487dee4e"}],"explain":"Each 3C pyruvate loses 1 carbon as CO₂ to become 2C acetyl. 2 pyruvate → 2 CO₂."},{"id":"p2","prompt":"Start: one turn from 1 acetyl-CoA. Which does one turn make most of?","options":[{"t":"CO₂","_n":"sa9e","_k":"09c7d1a2"},{"t":"NADH","_n":"ta6e","_k":"5f4fa465"},{"t":"ATP","_n":"ua5e","_k":"189dbc78"},{"t":"FADH₂","_n":"va8e","_k":"6edd3cfa"}],"explain":"The cycle is mainly a carrier-loading machine: 3 NADH and 1 FADH₂ per turn, but only 1 ATP."},{"id":"p3","prompt":"Start: NAD⁺ supply mode with a supply of 0, then “+ 1 acetyl-CoA”. Where does the wheel stop?","options":[{"t":"It never starts, because step 1 needs NAD⁺","_n":"wa7e","_k":"983fb1f4"},{"t":"It switches to using O₂","_n":"xaae","_k":"4f72f5e9"},{"t":"It keeps turning and makes FADH₂ only","_n":"ya9e","_k":"852b91e0"},{"t":"At step 3 (isocitrate → α-ketoglutarate), the first step that needs NAD⁺","_n":"zace","_k":"9f6c8ada"}],"explain":"Steps 1 and 2 need no carrier. Step 3 needs an empty NAD⁺. With none, the wheel jams, even though no step uses O₂ directly."},{"id":"p4","prompt":"Start: Block a step mode, with succinate dehydrogenase blocked; run 3 acetyl-CoA. Which intermediate’s bar grows?","options":[{"t":"Oxaloacetate","_n":"10abe","_k":"a68bd051"},{"t":"Citrate","_n":"119ee","_k":"7ac6e017"},{"t":"Succinate","_n":"129de","_k":"18b677e6"},{"t":"Fumarate","_n":"13acf","_k":"419bdf2a"}],"explain":"The blocked enzyme can’t use its substrate, so the substrate piles up and everything after it runs out, including the oxaloacetate the next turn needs."}],"challenges":[{"id":"tc1","goal":3,"prompt":"Start with “+ 1 glucose”. Run exactly enough to fully oxidize it, then press Check.","why":"2 pyruvate oxidations and 2 turns: 6 CO₂, 8 NADH, 2 FADH₂ and 2 ATP. All six carbons of the glucose have left as CO₂.","general":"Press Reset, then “+ 1 glucose”, and step until both turns are done.","hints":["How many acetyl-CoA come from one glucose?","2 pyruvate → 2 acetyl-CoA → 2 turns.","Step until the status reads “Waiting for acetyl-CoA” with 2 turns done."]},{"id":"tc2","goal":3,"prompt":"Using only “+ 1 pyruvate” and “+ 1 acetyl-CoA”, make the ledger read exactly \u003cstrong>11 NADH and 3 FADH₂\u003c/strong> after everything has run.","why":"2 pyruvate give 2 × 4 = 8 NADH and 1 acetyl-CoA gives 3: 11 NADH. Three fuels, three turns: 3 FADH₂.","general":"Press Reset, add your fuel with “+ 1 pyruvate” and “+ 1 acetyl-CoA”, then run everything.","hints":["Each fuel gives 1 turn, so 1 FADH₂. How many fuels in total?","3 fuels. Pyruvate gives 4 NADH (1 + 3); acetyl-CoA gives 3.","4\u003ci>p\u003c/i> + 3(3 − \u003ci>p\u003c/i>) = 11, so \u003ci>p\u003c/i> = 2: 2 pyruvate and 1 acetyl-CoA."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Feed in 1 acetyl-CoA. Choose a block, \u003cstrong>or\u003c/strong> an NAD⁺ supply, so that the ledger ends at exactly \u003cstrong>1 NADH and 1 CO₂\u003c/strong>, and the wheel stalls.","why":"Step 3 made the first NADH and released the first CO₂. With step 4 stopped (no enzyme, or no empty NAD⁺), the wheel jams there.","general":"Feed in 1 acetyl-CoA, choose a block or an NAD⁺ supply, and step until the wheel stalls.","hints":["Which steps release CO₂, and which make NADH? List them in order.","Step 3 makes the first NADH and the first CO₂. Step 4 makes the second of each.","Stop the wheel at step 4: block α-ketoglutarate dehydrogenase, or allow only 1 NAD⁺, so step 4 has no carrier."]}]},"part3":{"slug":"carbons","name":"Carbons","heading":"Where did the glucose go?","intro":"The wheel shows one turn at a time. Here you zoom out to the whole glucose molecule: track every carbon, add up every product across three stages, then check the model against real experimental data.","s1":{"title":"Station 1: The ¹⁴C tracker","text":"A glucose molecule’s six carbons are each tagged with a ¹⁴C marker (a ring around each brown dot). Press the buttons in order to move the markers forward.","stages":[{"id":"start","t":"Glucose","org":6,"co2":0,"cap":"One glucose: all six labelled carbons are in one organic molecule."},{"id":"gly","t":"Glycolysis","org":6,"co2":0,"cap":"Glycolysis splits glucose into 2 pyruvate (3C each). No carbon leaves yet."},{"id":"po","t":"Pyruvate oxidation","org":4,"co2":2,"cap":"Each pyruvate loses one labelled carbon as CO₂. Two acetyl groups (2C each) carry the other four into the cycle."},{"id":"t1","t":"Turn 1","org":4,"co2":2,"cap":"Turn 1 releases 2 CO₂, but they come from carbons that were already in the cycle. The labelled carbons are now part of the cycle’s intermediates."},{"id":"t2","t":"Turn 2","org":2,"co2":4,"avg":true,"cap":"Turn 2 releases 2 more CO₂. On average, two more labelled carbons have now left."},{"id":"more","t":"More turns","org":0,"co2":6,"cap":"After more turns, every labelled carbon has left as CO₂."}],"barOrg":"Labelled carbons still in organic molecules","barCo2":"Labelled carbons released as CO₂","zoomTitle":"Zoom to the molecules","zoom":"The two CO₂ released in one turn come from carbons that were already in the cycle (from oxaloacetate’s earlier load), not the exact acetyl carbons that just joined. Over several turns every carbon leaves, so the totals match.","ask":"How many CO₂ per glucose?","_a":"Ag==","askGood":"6 CO₂ per glucose: 2 from pyruvate oxidation and 4 from the cycle’s two turns.","askWrong":[{"match":4,"fb":"That’s the Krebs cycle alone. Add pyruvate oxidation’s 2."},{"match":2,"fb":"That’s pyruvate oxidation alone. Add the cycle’s 4."},{"match":3,"fb":"That’s one pyruvate. One glucose gives two."}],"askGeneral":"Count every labelled carbon: each one leaves as one CO₂."},"s2":{"title":"Station 2: Build the totals table","text":"Drag a number chip onto a cell, or tap a chip and then tap the cell. Each cell checks itself when the number lands.","chips":[0,1,2,3,4,6,8,10],"cols":["ATP","NADH","FADH₂","CO₂"],"rows":[{"id":"gly","stage":"Glycolysis","where":"Cytosol","_a":"bwscBBgGGVVp","net":true},{"id":"po","stage":"Pyruvate oxidation (×2)","where":"Matrix","_a":"bwkcBBgGGVdp"},{"id":"kr","stage":"Krebs cycle (×2 turns)","where":"Matrix","_a":"bwscABgEGVFp","perTurn":[1,3,1,2]},{"id":"tot","stage":"\u003cstrong>Total per glucose\u003c/strong>","where":"","_a":"bw0cBwQaB0kCZA==","total":true}],"fbTurn":"That’s one turn. One glucose turns the cycle twice.","fbPoNadh":"Each pyruvate makes 1 NADH as it’s trimmed.","fbTotal":"Add the three rows above.","fbGeneral":"Count this stage for one whole glucose.","done":"Table complete: 4 ATP, 10 NADH, 2 FADH₂ and 6 CO₂ per glucose, before the electron transport chain."},"s3":{"title":"Station 3: Isolated mitochondria (investigation)","text":"Mitochondria were separated from the rest of the cell and given different fuels. The flasks were then checked for CO₂.","dataTitle":"Check it with data","head":["Flask","Mitochondria given","O₂ present?","CO₂ released (relative units)"],"rows":[["1","Glucose","Yes","0"],["2","Pyruvate","Yes","30"],["3","Pyruvate","No","2 (then stops)"],["4","Nothing (control)","Yes","0"]],"caption":"Results of a model experiment.","prompts":[{"id":"f1","q":"Why does flask 1 release no CO₂?","choices":[{"t":"The mitochondria were damaged.","fb":"Flask 2 shows the same mitochondria work when given pyruvate.","_n":"14adf","_k":"e21cb3f2"},{"t":"Glucose enters the cycle too slowly to measure.","fb":"Only the 2-carbon acetyl group enters, carried by CoA. Glucose was split in glycolysis; pyruvate was trimmed in pyruvate oxidation.","_n":"15aef","_k":"d1fd29a6"},{"t":"Mitochondria can’t use glucose. Glycolysis happens in the cytosol, which was removed.","fb":"The cycle takes acetyl-CoA, which comes from pyruvate, which comes from glycolysis in the cytosol.","_n":"16aff","_k":"119220a9"},{"t":"The O₂ was used up making CO₂.","fb":"The carbon (and oxygen) in CO₂ comes from the fuel molecules. The O₂ you breathe in ends up in water.","_n":"17a8f","_k":"340e6829"}]},{"id":"f2","q":"Why does flask 3 release a little CO₂ and then stop?","choices":[{"t":"The cycle needs O₂ at step 1.","fb":"No step of the cycle uses O₂. It’s aerobic because NAD⁺ and FAD are regenerated only when the chain passes electrons to O₂.","_n":"18a9f","_k":"15d13e3f"},{"t":"The CO₂ is made from O₂, so it stops when O₂ is missing.","fb":"The carbon (and oxygen) in CO₂ comes from the fuel molecules. The O₂ you breathe in ends up in water.","_n":"19aaf","_k":"fa55bd86"},{"t":"The pyruvate runs out after a few seconds.","fb":"Flask 2 had the same pyruvate and released 30 units.","_n":"1aabf","_k":"14157a89"},{"t":"The cycle runs until the NAD⁺ is used up; without O₂ the chain can’t regenerate it.","fb":"No step of the cycle uses O₂. It’s aerobic because NAD⁺ and FAD are regenerated only when the chain passes electrons to O₂.","_n":"1ba4f","_k":"4014ef23"}]},{"id":"f3","q":"What is flask 4 for?","choices":[{"t":"It shows mitochondria make CO₂ on their own.","fb":"Flask 4 released 0: without fuel, no CO₂.","_n":"1ca5f","_k":"2892c354"},{"t":"It’s a spare flask with no purpose.","fb":"Every flask tests something. Compare flask 4 with flask 2.","_n":"1d32f","_k":"9d106342"},{"t":"A control: it shows the CO₂ comes from the fuel, not the mitochondria alone.","fb":"With no fuel, no CO₂: so the CO₂ in flask 2 came from the pyruvate.","_n":"1e31f","_k":"a14dee73"},{"t":"It tests whether O₂ is needed.","fb":"Flasks 2 and 3 compare O₂; flask 4 has no fuel.","_n":"1f30f","_k":"ce9c8646"}]}]},"quickCheck":{"title":"Quick check","summary":"Where did the glucose go? quick check","items":[{"id":"q1","goal":4,"prompt":"How many CO₂ does one glucose release in pyruvate oxidation and the Krebs cycle together?","choices":[{"t":"2","fb":"2 from pyruvate oxidation + 4 from two turns.","_n":"1g2ff","_k":"c6021ae6"},{"t":"3","fb":"2 from pyruvate oxidation + 4 from two turns.","_n":"1h2ef","_k":"5c82eb0e"},{"t":"4","fb":"2 from pyruvate oxidation + 4 from two turns.","_n":"1i2df","_k":"f9d54652"},{"t":"6","fb":"2 from pyruvate oxidation + 4 from two turns.","_n":"1j2cf","_k":"2e822675"}]},{"id":"q2","goal":4,"prompt":"Where are all of glucose’s carbons at the end of the Krebs cycle?","choices":[{"t":"In NADH","fb":"Carriers hold electrons, not carbon. Oxaloacetate is regenerated: it’s the cycle’s own molecule.","_n":"1k2bf","_k":"0e6454a6"},{"t":"In ATP","fb":"Carriers hold electrons, not carbon. Oxaloacetate is regenerated: it’s the cycle’s own molecule.","_n":"1l2af","_k":"f60e9d4e"},{"t":"In oxaloacetate","fb":"Carriers hold electrons, not carbon. Oxaloacetate is regenerated: it’s the cycle’s own molecule.","_n":"1m29f","_k":"5e9ea37f"},{"t":"In CO₂","fb":"Every carbon has left as CO₂. Carriers hold electrons, not carbon, and oxaloacetate is the cycle’s own molecule.","_n":"1n18f","_k":"31f4c3db"}]},{"id":"q3","goal":[1,6],"prompt":"Isolated mitochondria are given glucose and O₂. What happens?","choices":[{"t":"CO₂ is released fast","fb":"The cycle takes acetyl-CoA, which comes from pyruvate, which comes from glycolysis in the cytosol.","_n":"1o19f","_k":"a9876124"},{"t":"Glucose enters the cycle","fb":"The cycle takes acetyl-CoA, which comes from pyruvate, which comes from glycolysis in the cytosol.","_n":"1p16f","_k":"91bdbcfc"},{"t":"Lactate forms","fb":"The cycle takes acetyl-CoA, which comes from pyruvate, which comes from glycolysis in the cytosol.","_n":"1q17f","_k":"e47047e0"},{"t":"No CO₂: glycolysis is missing","fb":"The cycle takes acetyl-CoA, which comes from pyruvate, which comes from glycolysis in the cytosol.","_n":"1r1cf","_k":"ae6b5a98"}]},{"id":"q4","goal":3,"prompt":"Total NADH per glucose from all three stages?","choices":[{"t":"3","fb":"2 (glycolysis) + 2 (pyruvate oxidation) + 6 (two turns).","_n":"1s1df","_k":"dbce3e01"},{"t":"6","fb":"2 (glycolysis) + 2 (pyruvate oxidation) + 6 (two turns).","_n":"1t1af","_k":"6ddfb51b"},{"t":"8","fb":"2 (glycolysis) + 2 (pyruvate oxidation) + 6 (two turns).","_n":"1u1bf","_k":"6b85b8a5"},{"t":"10","fb":"2 (glycolysis) + 2 (pyruvate oxidation) + 6 (two turns).","_n":"1v20f","_k":"e8b6dbae"}]}]}},"practice":{"activities":[{"id":"tag","type":"custom","title":"Tag the cycle","summary":"Tag the cycle","goal":[2,3],"instruction":"For each step, tap every product it releases.","products":[{"id":"co2","t":"CO₂"},{"id":"nadh","t":"NADH"},{"id":"fadh","t":"FADH₂"},{"id":"atp","t":"ATP"},{"id":"none","t":"nothing extra"}],"offByOne":"Count CO₂ released: each CO₂ removes one carbon.","items":[{"id":"a1","step":"Pyruvate → acetyl-CoA","cin":"3","_a":"TxtTFA4EGUdEGwptFlVaVxYVElhVUl1HaUQ=","goal":[1,3],"why":"3 → 2: one carbon leaves as CO₂, and NAD⁺ is loaded to NADH.","hints":["Compare carbon counts before and after.","3 → 2: one carbon left.","CO₂ and NADH."]},{"id":"a2","step":"Acetyl-CoA + oxaloacetate → citrate","cin":"2 + 4","_a":"TxtTFA4AGUdEGwptFlhaC1EbbUs=","goal":2,"why":"2 + 4 = 6: carbons are joined, and no carrier is loaded.","wrong":{"co2":"Carbons are added here, not removed: 2 + 4 = 6."},"hints":["Compare carbon counts before and after.","2 + 4 → 6: carbons are joined, none leave.","Nothing extra."]},{"id":"a3","step":"Citrate → isocitrate","cin":"6","_a":"TxtTFA4AGUdEGwptFlhaC1EbbUs=","goal":2,"why":"6 → 6: a rearrangement, with nothing released.","hints":["Compare carbon counts before and after.","6 → 6: no carbon leaves.","Nothing extra: it’s a rearrangement."]},{"id":"a4","step":"Isocitrate → α-ketoglutarate","cin":"6","_a":"TxtTFA4DGUdEGwptFlVaVxYVElhVUl1HaUQ=","goal":[2,3],"why":"6 → 5: one carbon leaves as CO₂, and NAD⁺ is loaded to NADH.","hints":["Compare carbon counts before and after.","6 → 5: one carbon left.","CO₂ and NADH."]},{"id":"a5","step":"α-ketoglutarate → succinyl-CoA","cin":"5","_a":"TxtTFA4CGUdEGwptFlVaVxYVElhVUl1HaUQ=","goal":[2,3],"why":"5 → 4: one carbon leaves as CO₂, and NAD⁺ is loaded to NADH.","hints":["Compare carbon counts before and after.","5 → 4: one carbon left.","CO₂ and NADH."]},{"id":"a6","step":"Succinyl-CoA → succinate","cin":"4","_a":"TxtTFA4CGUdEGwptFldBFRZkTQ==","goal":3,"why":"4 → 4: GDP + Pᵢ → GTP, which becomes ATP (substrate-level phosphorylation).","hints":["Compare carbon counts before and after.","4 → 4: no carbon leaves; energy is captured directly.","ATP (via GTP)."]},{"id":"a7","step":"Succinate → fumarate","cin":"4","_a":"TxtTFA4CGUdEGwptFlBUAVwbbUs=","goal":3,"why":"4 → 4: succinate dehydrogenase loads FAD to FADH₂.","wrong":{"nadh":"This dehydrogenase uses FAD: the carbon–carbon bond being oxidized gives too little energy to load NAD⁺."},"hints":["Compare carbon counts before and after.","4 → 4: no carbon leaves; this dehydrogenase uses a different carrier.","FADH₂."]},{"id":"a8","step":"Malate → oxaloacetate","cin":"4","_a":"TxtTFA4CGUdEGwptFlhUAVwbbUs=","goal":[2,3],"why":"4 → 4: malate is oxidized and NAD⁺ is loaded to NADH. Oxaloacetate is back.","wrong":{"co2":"4C → 4C: no carbon is lost."},"hints":["Compare carbon counts before and after.","4 → 4: no carbon leaves.","NADH."]}]},{"id":"ledger","type":"custom","title":"Ledger puzzles","summary":"Ledger puzzles","star":true,"goal":[3,4,6],"instruction":"Six counting puzzles. Puzzles 3 to 6 are non-routine (★); the last two go beyond the Final Check.","items":[{"id":"l1","goal":[3,4],"prompt":"Two glucose are fully oxidized. How many CO₂ come from pyruvate oxidation and the Krebs cycle together?","boxes":[{"label":"CO₂","unit":"CO₂"}],"_a":"bwgCaw==","display":"12 CO₂","why":"6 CO₂ per glucose × 2 = 12.","wrong":[{"match":[8],"fb":"Add 4 from pyruvate oxidation."},{"match":[6],"fb":"That’s one glucose."}],"general":"Count pyruvate oxidation and both turns for each glucose.","hints":["How many CO₂ does one glucose give?","2 from pyruvate oxidation + 4 from two turns = 6.","6 × 2 = 12."]},{"id":"l2","goal":3,"prompt":"Three glucose: how many NADH from the Krebs cycle alone?","boxes":[{"label":"NADH","unit":"NADH"}],"_a":"bwgIaw==","display":"18 NADH","why":"Two turns per glucose: 6 NADH each. 3 × 6 = 18.","wrong":[{"match":[9],"fb":"Two turns per glucose: 6 NADH each."},{"match":[24],"fb":"Krebs only: leave out pyruvate oxidation."}],"general":"Krebs cycle only: count the turns first.","hints":["How many turns does one glucose give?","2 turns × 3 NADH = 6 NADH per glucose.","3 × 6 = 18."]},{"id":"l3","goal":3,"star":true,"prompt":"A cell has 6 pyruvate. How many turns of the cycle, and how many FADH₂?","boxes":[{"label":"Turns","unit":"turns"},{"label":"FADH₂","unit":"FADH₂"}],"_a":"bw8cAGk=","display":"6 turns; 6 FADH₂","why":"1 pyruvate → 1 acetyl-CoA → 1 turn, and each turn makes 1 FADH₂.","wrong":[{"match":[3],"box":0,"fb":"1 pyruvate → 1 acetyl-CoA → 1 turn."}],"general":"1 pyruvate → 1 acetyl-CoA → 1 turn.","hints":["How many acetyl-CoA come from one pyruvate?","1 pyruvate → 1 acetyl-CoA → 1 turn; 1 FADH₂ per turn.","6 turns and 6 FADH₂."]},{"id":"l4","goal":[4,6],"star":true,"prompt":"(Investigation) Isolated mitochondria are given 4 pyruvate and plenty of O₂. How many CO₂ will they release?","boxes":[{"label":"CO₂","unit":"CO₂"}],"_a":"bwgCaw==","display":"12 CO₂","why":"Every carbon of every pyruvate leaves as CO₂: 4 × 3 = 12.","wrong":[{"match":[8],"fb":"Each pyruvate also loses 1 carbon in pyruvate oxidation: 4 × 3 = 12."}],"general":"Each pyruvate has 3 carbons, and all of them leave as CO₂.","hints":["Each pyruvate has 3 carbons.","All of them leave as CO₂: 1 in pyruvate oxidation, 2 in the cycle.","4 × 3 = 12."]},{"id":"l5","goal":[3,6],"star":true,"prompt":"Per glucose, how many electron carriers (NADH + FADH₂) are loaded in all three stages? Compare this with the ATP made directly.","boxes":[{"label":"Carriers","unit":"carriers"},{"label":"ATP made directly","unit":"ATP"}],"_a":"bwgCGgBr","display":"12 carriers; 4 ATP","why":"10 NADH + 2 FADH₂ = 12 loaded carriers, against only 4 ATP made directly. Most of the energy is in the carriers.","wrong":[{"match":[4],"box":0,"fb":"Count NADH and FADH₂, not ATP: 10 + 2."}],"general":"Add the NADH and FADH₂ from glycolysis, pyruvate oxidation and the cycle.","hints":["List the NADH and FADH₂ from each stage.","NADH: 2 + 2 + 6 = 10. FADH₂: 2. ATP: 2 + 2.","12 carriers; 4 ATP."]},{"id":"l6","goal":6,"star":true,"prompt":"A cell oxidizes 2 glucose plus some acetyl-CoA from fat. Pyruvate oxidation and the cycle release 20 CO₂ in total. How many acetyl-CoA came from fat?","boxes":[{"label":"Acetyl-CoA from fat","unit":"acetyl-CoA"}],"_a":"bw1t","display":"4 acetyl-CoA","why":"2 glucose give 12 CO₂; the other 8 CO₂ come from fat at 2 per turn: 4 acetyl-CoA.","wrong":[{"match":[8],"fb":"2 glucose already give 12 CO₂; 8 more ÷ 2 per turn = 4."}],"general":"Find the glucose’s share of the CO₂ first.","hints":["Find the glucose’s share first.","2 glucose → 12 CO₂. 20 − 12 = 8 CO₂ from fat.","Each acetyl-CoA turn releases 2 CO₂: 4 acetyl-CoA."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Hugo","how":"","instruction":"Hugo made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Count the products of pyruvate oxidation and the Krebs cycle for one glucose.","steps":["Glycolysis makes 2 pyruvate from one glucose.","Each pyruvate is oxidized to acetyl-CoA, releasing 1 CO₂ and making 1 NADH.","So the Krebs cycle turns once for this glucose.","One turn makes 3 NADH, 1 FADH₂, 1 ATP and 2 CO₂.","Total CO₂: 2 + 2 = 4."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 is true per turn, but the mistake is earlier.","Step 5 follows from step 3. Look earlier."],"fixes":[{"t":"There are 2 acetyl-CoA, so the cycle turns twice: 6 NADH, 2 FADH₂, 2 ATP and 4 CO₂, which makes 6 CO₂ with pyruvate oxidation.","why":"One glucose gives 2 pyruvate, so 2 acetyl-CoA: the cycle turns \u003cstrong>twice\u003c/strong>.","_n":"1w21f","_k":"e5dfbf42"},{"t":"Glycolysis makes only 1 pyruvate.","why":"6C splits into two 3C pyruvates.","_n":"1x1ef","_k":"5f84eb23"},{"t":"The cycle turns 6 times, once for each carbon of glucose.","why":"Each turn takes one 2C acetyl group.","_n":"1y1df","_k":"31157db7"},{"t":"Step 3 is correct.","why":"Two pyruvates mean two acetyl-CoA.","_n":"1z20f","_k":"c5feba7d"}],"hints":["How many acetyl-CoA are there?","Two.","Two turns."]},{"id":"e2","goal":5,"task":"Explain where the CO₂ from the Krebs cycle comes from.","steps":["Citrate (6C) forms from acetyl (2C) and oxaloacetate (4C).","Two carbons are removed as CO₂ before oxaloacetate is remade.","These CO₂ molecules form when O₂ combines with the carbon in the matrix.","So the Krebs cycle uses O₂ directly."],"_a":"Bg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"No step of the cycle uses O₂.","_n":"201ff","_k":"0b2e09d9"},{"t":"The CO₂ was breathed in and is passing through.","why":"Breathed-in O₂ ends up in water.","_n":"211af","_k":"86c2d343"},{"t":"The CO₂ comes from NADH.","why":"NADH carries electrons, not carbon.","_n":"2219f","_k":"1a9f51b4"},{"t":"The CO₂ is cut off the carbon skeleton itself; its oxygen atoms come from the organic molecules (and water), not from O₂. O₂ is used only at the end of the electron transport chain.","why":"The carbon (and oxygen) in CO₂ comes from the fuel molecules. The O₂ you breathe in ends up in water.","_n":"231cf","_k":"1ab5829c"}],"hints":["Which steps release CO₂?","Steps 3 and 4: the carbon is removed by an enzyme.","No O₂ is involved."]},{"id":"e3","goal":2,"task":"Describe what happens at the end of one turn.","steps":["Acetyl-CoA joins oxaloacetate to make citrate.","Citrate goes through rearrangements and oxidations, losing 2 carbons.","Malate is oxidized, making NADH.","Oxaloacetate is released as a waste product along with CO₂.","So each turn needs a new oxaloacetate from glycolysis."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows from step 4."],"fixes":[{"t":"Oxaloacetate turns into pyruvate.","why":"It accepts acetyl again.","_n":"241bf","_k":"863d1611"},{"t":"Step 4 is correct.","why":"If oxaloacetate were waste, it wouldn’t be a cycle.","_n":"2526f","_k":"6f77c769"},{"t":"Oxaloacetate is regenerated and stays in the matrix to accept the next acetyl group, so the pathway is a cycle.","why":"Oxaloacetate is remade at the end of every turn, ready to accept the next acetyl group.","_n":"2625f","_k":"f1568962"},{"t":"Citrate is released as waste.","why":"Citrate is the first intermediate.","_n":"27a4f","_k":"e1769b48"}],"hints":["Why is it called a cycle?","Something is remade.","Oxaloacetate."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the carbon wheel: how little ATP the cycle makes, or that it jams without NAD⁺?"},{"id":"j2","q":"In your own words, why does the Krebs cycle count as aerobic even though no step uses O₂?"},{"id":"j3","q":"Explain to a friend how to count the CO₂ and NADH from one glucose without forgetting pyruvate oxidation."},{"id":"j4","q":"Which part of the cycle is still fuzzy for you: the names, the counts or the carbons? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In a eukaryotic cell, where does pyruvate oxidation happen?","options":[{"t":"The intermembrane space","why":"That’s where H⁺ builds up, between the two membranes.","_n":"28a5f","_k":"f9bdd796"},{"t":"The mitochondrial matrix","why":"Pyruvate is carried in from the cytosol.","_n":"29a6f","_k":"c6a7c8e3"},{"t":"The stroma","why":"Stroma is in chloroplasts.","_n":"2aa7f","_k":"86701cf5"},{"t":"The cytosol","why":"Pyruvate is carried into the mitochondrion first.","_n":"2ba8f","_k":"07eefdb1"}]},"b":{"prompt":"In a eukaryotic cell, where does the Krebs cycle happen?","options":[{"t":"The intermembrane space","why":"That’s the H⁺ reservoir, not the cycle.","_n":"2ca9f","_k":"e2859605"},{"t":"The mitochondrial matrix","why":"The cycle runs in the fluid inside the inner membrane.","_n":"2daaf","_k":"7844b009"},{"t":"The stroma","why":"Stroma is in chloroplasts.","_n":"2eabf","_k":"c142b038"},{"t":"The cytosol","why":"That’s where glycolysis happens.","_n":"2f9cf","_k":"2ef03fca"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"What does \u003cstrong>one turn\u003c/strong> of the Krebs cycle make?","options":[{"t":"4 NADH, 1 FADH₂, 1 ATP, 3 CO₂","why":"That adds pyruvate oxidation’s NADH and CO₂.","_n":"2g9df","_k":"af64f9d0"},{"t":"6 NADH, 2 FADH₂, 2 ATP, 4 CO₂","why":"That’s two turns: one glucose.","_n":"2haaf","_k":"02cd38ca"},{"t":"3 NADH, 1 FADH₂, 1 ATP, 2 CO₂","why":"One turn: 3 NADH, 1 FADH₂, 1 ATP (via GTP) and 2 CO₂.","_n":"2ia9f","_k":"4dbef550"},{"t":"1 NADH, 1 FADH₂, 3 ATP, 2 CO₂","why":"The cycle makes mostly NADH, not ATP.","_n":"2ja8f","_k":"3129a539"}]},"b":{"prompt":"How many CO₂ does the Krebs cycle itself (not pyruvate oxidation) release for \u003cstrong>one glucose\u003c/strong>?","options":[{"t":"2","why":"That’s one turn.","_n":"2ka7f","_k":"015b6783"},{"t":"3","why":"That’s per pyruvate, counting pyruvate oxidation.","_n":"2laef","_k":"4b8a35c2"},{"t":"4","why":"2 CO₂ per turn × 2 turns.","_n":"2madf","_k":"9b544a81"},{"t":"6","why":"That includes pyruvate oxidation’s 2.","_n":"2nacf","_k":"472d741a"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"What enters the Krebs cycle, and what does it combine with?","options":[{"t":"CO₂ combines with RuBP","why":"That’s carbon fixation in photosynthesis.","_n":"2oabf","_k":"d5f4d71e"},{"t":"Pyruvate (3C) combines with oxaloacetate","why":"Pyruvate is first trimmed to acetyl.","_n":"2pa2f","_k":"24a50bad"},{"t":"A 2-carbon acetyl group (from acetyl-CoA) combines with oxaloacetate (4C) to make citrate (6C)","why":"Only the 2-carbon acetyl group enters, carried by CoA. Glucose was split in glycolysis; pyruvate was trimmed in pyruvate oxidation.","_n":"2qa1f","_k":"69b710b0"},{"t":"Glucose (6C) combines with oxaloacetate","why":"Glucose was split in glycolysis.","_n":"2r177","_k":"563b3805"}]},"b":{"prompt":"Which molecule is regenerated at the end of every turn?","options":[{"t":"Oxaloacetate","why":"Oxaloacetate is remade at the end of every turn, ready to accept the next acetyl group.","_n":"2s167","_k":"0177047e"},{"t":"Citrate","why":"Citrate is the first product of each turn, not the molecule that is regenerated.","_n":"2t197","_k":"f6f40301"},{"t":"Acetyl-CoA","why":"Acetyl-CoA is consumed each turn.","_n":"2u187","_k":"890946b5"},{"t":"Pyruvate","why":"Pyruvate is never remade by the cycle.","_n":"2v1b7","_k":"c49b9df4"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"A drug blocks succinate dehydrogenase. Acetyl-CoA keeps arriving. Which molecule builds up \u003cstrong>first\u003c/strong>?","options":[{"t":"Succinate","why":"The blocked enzyme’s substrate piles up.","_n":"2w1a7","_k":"f35c97e1"},{"t":"Oxaloacetate","why":"Oxaloacetate is downstream of the block, so it runs out and the cycle stops.","_n":"2x1d7","_k":"20492c48"},{"t":"CO₂","why":"CO₂ release slows; it doesn’t build up.","_n":"2y1c7","_k":"568cf8d6"},{"t":"Fumarate","why":"Fumarate is made \u003cstrong>by\u003c/strong> the blocked enzyme, so it runs out.","_n":"2z0f7","_k":"02a95a53"}]},"b":{"prompt":"A drug blocks isocitrate dehydrogenase. Acetyl-CoA keeps arriving at first. Which molecules build up?","options":[{"t":"Oxaloacetate","why":"It runs out, because it’s downstream of the block.","_n":"300e7","_k":"09574a59"},{"t":"NADH","why":"NADH production falls.","_n":"31917","_k":"44693923"},{"t":"α-ketoglutarate","why":"That’s made by the blocked enzyme.","_n":"32927","_k":"2204dc7b"},{"t":"Isocitrate (and citrate)","why":"The block stops the cycle just after them.","_n":"338f7","_k":"288c9206"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Three glucose molecules are completely oxidized. How many CO₂ come from pyruvate oxidation and the Krebs cycle together?","options":[{"t":"6","why":"That’s one glucose.","_n":"34907","_k":"3e216793"},{"t":"9","why":"That counts one turn per glucose.","_n":"358d7","_k":"2df8297d"},{"t":"12","why":"That leaves out pyruvate oxidation’s 2 per glucose.","_n":"368e7","_k":"8275b66b"},{"t":"18","why":"6 per glucose × 3.","_n":"378b7","_k":"642b63c6"}]},"b":{"prompt":"Isolated mitochondria are given 4 pyruvate. How many NADH come from pyruvate oxidation and the Krebs cycle together?","options":[{"t":"12","why":"That leaves out pyruvate oxidation.","_n":"388c7","_k":"b431c8a3"},{"t":"16","why":"Each pyruvate: 1 (pyruvate oxidation) + 3 (one turn) = 4.","_n":"39997","_k":"bcfe9150"},{"t":"20","why":"That adds glycolysis, which these mitochondria don’t do.","_n":"3a9a7","_k":"fb6f4643"},{"t":"24","why":"One pyruvate gives one turn, not two.","_n":"3b8b7","_k":"d3388a54"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"Cells are given glucose with radioactive carbon (¹⁴C) in all six positions, with plenty of O₂. After complete oxidation, where is the radioactive carbon?","options":[{"t":"In oxaloacetate, permanently","why":"Oxaloacetate’s carbons also leave over later turns.","_n":"3c8a7","_k":"54d846f2"},{"t":"In CO₂ breathed out","why":"Every carbon leaves as CO₂ in pyruvate oxidation and the cycle.","_n":"3d897","_k":"7bae6cc6"},{"t":"In water","why":"Water forms from O₂ and H; it holds no carbon.","_n":"3e887","_k":"4e5cc0d1"},{"t":"In NADH and FADH₂","why":"Carriers hold electrons and hydrogen, not glucose’s carbon.","_n":"3f8f7","_k":"f6882a44"}]},"b":{"prompt":"Cells are given O₂ labelled with heavy oxygen (¹⁸O). After respiration, which product contains the label?","options":[{"t":"Glucose","why":"Glucose is being broken down, not made.","_n":"3g8e7","_k":"643807b2"},{"t":"CO₂","why":"The oxygen in CO₂ comes from the fuel molecules and water, not O₂.","_n":"3h8d7","_k":"5b4300a8"},{"t":"Oxaloacetate","why":"No cycle step uses O₂.","_n":"3i8c7","_k":"a27f25da"},{"t":"Water","why":"O₂ accepts electrons at the end of the chain and becomes H₂O.","_n":"3j937","_k":"c5a0d805"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why the Krebs cycle stops when O₂ runs out, even though no step uses O₂?","options":[{"t":"“Mitochondria die instantly without O₂.”","why":"The cycle stalls because of the carriers, not cell death.","_n":"3k927","_k":"328b92be"},{"t":"“The cycle needs empty NAD⁺ and FAD. Only the electron transport chain empties them, and the chain can’t run without O₂ to accept electrons.”","why":"No step of the cycle uses O₂. It’s aerobic because NAD⁺ and FAD are regenerated only when the chain passes electrons to O₂.","_n":"3l857","_k":"5d540c4a"},{"t":"“Without O₂, glucose can’t enter the cycle.”","why":"Glucose never enters the cycle.","_n":"3m867","_k":"366c403b"},{"t":"“O₂ is needed to make the CO₂ released by the cycle.”","why":"No step of the cycle uses O₂. It’s aerobic because NAD⁺ and FAD are regenerated only when the chain passes electrons to O₂. The carbon (and oxygen) in CO₂ comes from the fuel molecules. The O₂ you breathe in ends up in water.","_n":"3n877","_k":"058c7bbd"}]},"b":{"prompt":"Which is the best explanation of why the Krebs pathway is called a cycle?","options":[{"t":"“Because it turns twice per glucose.”","why":"Turning twice is about the input, not the name.","_n":"3o887","_k":"9b7f799f"},{"t":"“Oxaloacetate, which accepts each acetyl group, is regenerated at the end of every turn, so the same molecules are used again and again.”","why":"Oxaloacetate is remade at the end of every turn, ready to accept the next acetyl group.","_n":"3p897","_k":"dd4f2f7a"},{"t":"“Because CO₂ is recycled into glucose.”","why":"That’s photosynthesis.","_n":"3q8a7","_k":"2470d86c"},{"t":"“Because NAD⁺ goes around it.”","why":"NAD⁺ is used and regenerated elsewhere.","_n":"3r8b7","_k":"d9e36d24"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which sentence best describes the main purpose of the Krebs cycle in energy terms?","options":[{"t":"“It turns CO₂ into acetyl-CoA.”","why":"That’s backwards.","_n":"3s8c7","_k":"4e22e5cc"},{"t":"“It stores glucose for later.”","why":"It breaks fuel down.","_n":"3t8d7","_k":"fd9c8d74"},{"t":"“It strips electrons from acetyl groups and loads them onto NAD⁺ and FAD, so most of the energy can be harvested later by the electron transport chain.”","why":"Its real job is loading carriers: 3 NADH and 1 FADH₂ per turn.","_n":"3u8e7","_k":"9c645b6f"},{"t":"“It makes most of the cell’s ATP directly.”","why":"Each turn makes only 1 ATP. Its main products are 3 NADH and 1 FADH₂, whose electrons power most ATP production later.","_n":"3v8f8","_k":"6526f411"}]},"b":{"prompt":"Which flow chart for one turn is correct?","options":[{"t":"“Glucose → citrate → oxaloacetate; outputs 6 CO₂.”","why":"Only the 2-carbon acetyl group enters, carried by CoA. Glucose was split in glycolysis; pyruvate was trimmed in pyruvate oxidation.","_n":"3w8e8","_k":"a63aae6b"},{"t":"“Acetyl-CoA + oxaloacetate → citrate (6C) → … → oxaloacetate (4C); outputs 2 CO₂, 3 NADH, 1 FADH₂, 1 ATP”","why":"Acetyl (2C) joins oxaloacetate (4C); two carbons leave as CO₂ and oxaloacetate is remade.","_n":"3x918","_k":"c8643f6c"},{"t":"“Pyruvate + oxaloacetate → citrate; outputs 3 CO₂, 4 NADH.”","why":"Pyruvate oxidation is a separate step: 1 NADH and 1 CO₂ per pyruvate, before the cycle starts.","_n":"3y908","_k":"db8b23a3"},{"t":"“Acetyl-CoA + O₂ → citrate; outputs 2 CO₂ and water.”","why":"No step of the cycle uses O₂. It’s aerobic because NAD⁺ and FAD are regenerated only when the chain passes electrons to O₂.","_n":"3z8b8","_k":"63f6d079"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Pyruvate dehydrogenase needs thiamine (vitamin B₁). In severe thiamine deficiency, which change in the blood is most likely?","options":[{"t":"Pyruvate (and the lactate made from it) builds up, because pyruvate can’t be turned into acetyl-CoA","why":"Pyruvate is made by glycolysis but can’t move on to the cycle.","_n":"408a8","_k":"023f9c2a"},{"t":"Glucose can’t be broken down at all","why":"Glycolysis doesn’t need this enzyme.","_n":"418d8","_k":"0dd56af1"},{"t":"Acetyl-CoA builds up","why":"It can’t be made, so it falls.","_n":"428c8","_k":"b8b8596d"},{"t":"CO₂ output rises sharply","why":"Less pyruvate is oxidized, so less CO₂.","_n":"43978","_k":"ba24b403"}]},"b":{"prompt":"FAD is made from riboflavin (vitamin B₂). If FAD is scarce, which cycle step slows most directly?","options":[{"t":"Succinate → fumarate","why":"Succinate dehydrogenase loads FAD.","_n":"44968","_k":"4831c9fa"},{"t":"Malate → oxaloacetate","why":"That step uses NAD⁺.","_n":"45898","_k":"8ea92038"},{"t":"Isocitrate → α-ketoglutarate","why":"That step uses NAD⁺.","_n":"468a8","_k":"ebd2e86b"},{"t":"Acetyl-CoA + oxaloacetate → citrate","why":"No carrier is used there.","_n":"47878","_k":"54914ca4"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"During a long run, muscle breaks down a fatty acid that supplies 8 acetyl-CoA. How many turns of the cycle, and how many NADH from the cycle alone?","options":[{"t":"4 turns, 12 NADH","why":"One acetyl-CoA → one turn.","_n":"48888","_k":"7fea2c4c"},{"t":"8 turns, 32 NADH","why":"There’s no pyruvate oxidation for fat-derived acetyl-CoA.","_n":"498d8","_k":"326f5049"},{"t":"8 turns, 24 NADH","why":"One acetyl-CoA → one turn → 3 NADH: 8 × 3 = 24.","_n":"4a8e8","_k":"8bc680b3"},{"t":"16 turns, 48 NADH","why":"Each acetyl-CoA drives one turn, not two.","_n":"4b8b8","_k":"a688aa1c"}]},"b":{"prompt":"A cell oxidizes 5 acetyl-CoA. How many FADH₂ and how many ATP (via GTP) does the cycle make?","options":[{"t":"5 FADH₂, 15 ATP","why":"15 is the NADH count, not ATP.","_n":"4c8c8","_k":"4f333d34"},{"t":"5 FADH₂, 5 ATP","why":"One turn per acetyl-CoA, with 1 FADH₂ and 1 ATP each.","_n":"4d918","_k":"bd528b0d"},{"t":"2 FADH₂, 2 ATP","why":"That’s one glucose’s worth.","_n":"4e928","_k":"47993404"},{"t":"10 FADH₂, 10 ATP","why":"That doubles the turns.","_n":"4f237","_k":"5bbebac6"}]}}]},"task":{"title":"Fuel the cycle","summary":"Fuel the cycle","statement":"\u003cp>A muscle cell’s mitochondria can receive glucose (via glycolysis), extra pyruvate (from the blood) and acetyl-CoA (from fats). Choose a fuel mix that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"kc-conds\">\u003cli>The Krebs cycle turns exactly 6 times.\u003c/li>\u003cli>Pyruvate oxidation and the cycle release exactly 16 CO₂ in total.\u003c/li>\u003cli>At least two different kinds of fuel are used.\u003c/li>\u003c/ol>","checks":["Exactly 6 turns","Exactly 16 CO₂","At least two kinds of fuel"],"tips":["Each glucose gives 2 turns; each pyruvate or acetyl-CoA gives 1.","Each turn releases 2 CO₂. Pyruvate oxidation adds 1 CO₂ per pyruvate, so glucose adds 2 extra and extra pyruvate adds 1 extra. You need 16 − 2 × 6 = 4 extra.","Mix your fuels: one kind alone doesn’t count."],"explainPrompt":"Explain how you used the turns and the CO₂ count together to pin down the fuel mix.","vocab":"Use the words acetyl-CoA, pyruvate oxidation, turn and CO₂.","success":"Your fuel mix works!","more":"Can you find all the answers?","after3":"Every answer needs 2 acetyl-CoA. The “extra” CO₂ (2\u003ci>g\u003c/i> + \u003ci>p\u003c/i> = 4) fixes the glucose and pyruvate together, and the turns then leave exactly 2 for fat."},"cards":[["Pyruvate oxidation","Pyruvate (3C) → acetyl-CoA (2C) + CO₂ + NADH, in the matrix. Twice per glucose."],["Krebs cycle: entry","Acetyl (2C) + oxaloacetate (4C) → citrate (6C)."],["Per turn","3 NADH, 1 FADH₂, 1 ATP (via GTP), 2 CO₂."],["Per glucose","Two turns: 6 NADH, 2 FADH₂, 2 ATP, 4 CO₂."],["Oxaloacetate","The 4C molecule regenerated each turn, ready for the next acetyl group."],["Decarboxylation","Removing a carbon as CO₂: isocitrate → α-ketoglutarate, and α-ketoglutarate → succinyl-CoA."],["FAD step","Succinate → fumarate (succinate dehydrogenase, in the inner membrane)."],["Substrate-level ATP in the cycle","Succinyl-CoA → succinate makes GTP, which becomes ATP."],["Where","Matrix of the mitochondrion (cytoplasm in prokaryotes)."],["O₂ and the cycle","Not used directly; needed to regenerate NAD⁺ and FAD through the chain."],["Glucose’s six carbons","2 leave in pyruvate oxidation and 4 in the cycle: all 6 end up as CO₂."],["Main purpose","Load electron carriers (NADH, FADH₂) for the electron transport chain."]]}};</script>
