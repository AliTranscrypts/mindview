.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--bio-e:#7A3DB8;--bio-h:#B0286F;--bio-atp:#A84C05;--bio-nadh:#0B7372;--bio-fadh:#00648A;--bio-carbon:#6B5A1E;--leaf:#4F6B2E;
--leaf-fill:rgba(79,107,46,.2);--leaf-edge:rgba(79,107,46,.7);--bio-o2:var(--pen)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
}
:root[data-theme="dark"]{--bio-e:#C9A8FF;--bio-h:#F49AC8;--bio-atp:#FF9F5A;--bio-nadh:#5FD0CD;--bio-fadh:#7FD3F5;--bio-carbon:#D8D08F;--leaf:#A8C98A;
--leaf-fill:rgba(168,201,138,.2);--leaf-edge:rgba(168,201,138,.7);--bio-o2:var(--pen)}
.bio-tok{display:inline-block;background:var(--tok,var(--ink));color:var(--sheet);border-radius:999px;padding:.05em .5em;font-size:.85em;font-weight:700;line-height:1.35;white-space:nowrap}
.bio-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.bio-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
.bio-chem{white-space:nowrap}
/* SBI4U 03: chloroplast zoom (S1), photosystem simulator, process sorter and clips, label quiz, puzzles, tube builder, hero.
   Module tokens: --cz-lumen (lumen tint: ink-2 over the sheet), --cz-core (lipid core), --cz-room / --cz-room-ink (a dark room
   or dark box, and text on it). Electrons --bio-e; energy flashes --hi; fluorescence is a --red halo, always labelled. */
:root{--cz-lumen:color-mix(in srgb,var(--ink-2) 18%,var(--sheet));--cz-core:color-mix(in srgb,var(--ink-2) 9%,var(--sheet));--cz-room:#252B35;--cz-room-ink:#F3F0E8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--cz-lumen:color-mix(in srgb,var(--ink-2) 15%,var(--sheet));--cz-core:color-mix(in srgb,var(--ink-2) 8%,var(--sheet));--cz-room:#0B0E12;--cz-room-ink:#E9E5DA}
}
:root[data-theme="dark"]{--cz-lumen:color-mix(in srgb,var(--ink-2) 15%,var(--sheet));--cz-core:color-mix(in srgb,var(--ink-2) 8%,var(--sheet));--cz-room:#0B0E12;--cz-room-ink:#E9E5DA}

/* radio groups (from SBI4U 01 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.88rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
/* zoom levels as a breadcrumb row */
.rg.cz-crumbs{gap:6px 18px}
.rg.cz-crumbs button{position:relative}
.rg.cz-crumbs button + button::before{content:"›";position:absolute;left:-14px;top:50%;transform:translateY(-52%);color:var(--ink-2);font-weight:700;pointer-events:none}

/* S1 diagram explorer (from SBI4U 01) */
.s1-stage{position:relative;width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.s1-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.s1-hs,.s1-tags{position:absolute;inset:0;pointer-events:none}
.s1-b{position:absolute;pointer-events:auto;background:transparent;border:1px dashed transparent;border-radius:5px;padding:0;margin:0;cursor:pointer;min-width:0}
.s1-b:hover{border-color:var(--ink-2);background:color-mix(in srgb,var(--hi) 14%,transparent)}
.s1-b:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}
.s1-b[aria-pressed="true"]{border:2.5px solid var(--ink);background:var(--hi-soft)}
.s1-b.good{border:2px solid var(--green)}
.s1-tag{position:absolute;transform:translate(0,-50%);font:700 .72rem/1.3 var(--font-ui);background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:.05em .55em;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.s1-tag.r{transform:translate(-100%,-50%)}
.s1-tag.c{transform:translate(-50%,-50%)}

/* drawings: plant tissue --leaf (fill 20 %, edge 70 %), membranes in ink, lumen tinted */
.cz-tis{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:1.2}
.cz-faint{opacity:.45}
.cz-chl{fill:var(--leaf);opacity:.85}
.cz-gran{stroke:var(--sheet);stroke-width:1;opacity:.8}
.cz-wall{fill:var(--leaf-fill);stroke:var(--leaf-edge);stroke-width:7}
.cz-pm{fill:none;stroke:var(--leaf-edge);stroke-width:1}
.cz-vac{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.2}
.cz-nuc{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.2}
.cz-nucl{fill:var(--ink-2)}
.cz-focus{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.cz-env{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.cz-envi{fill:none;stroke:var(--ink);stroke-width:2}
.cz-stroma{fill:var(--leaf-fill)}
.cz-thy{fill:var(--cz-lumen);stroke:var(--ink);stroke-width:1.3}
.cz-thy-m{stroke-width:1.6}
.cz-thy-g{stroke-width:3}
.cz-lam-o{stroke:var(--ink);stroke-linecap:round;fill:none}
.cz-lam-i{stroke:var(--cz-lumen);stroke-linecap:round;fill:none}
.cz-starch{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.4}
.cz-dna{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.cz-ribo{fill:var(--ink-2)}
.cz-scale{stroke:var(--ink);stroke-width:2.4}
.cz-pig{fill:var(--leaf)}
.cz-brace{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.cz-lumen{fill:var(--cz-lumen)}
.cz-core{fill:var(--cz-core)}
.cz-lt{stroke:var(--ink-2);stroke-width:1;opacity:.75}
.cz-head{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.1}
.cz-psb{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.5}
.cz-enz{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.5}
.cz-mline{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:5 4}
.cz-mline2{stroke:var(--ink-2);stroke-width:1.2}
.cz-mrna{stroke:var(--ink-2);stroke-width:2.4;stroke-dasharray:6 3}
.cz-bond{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.cz-pent{fill:var(--sheet);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.cz-atom{fill:var(--sheet)}
.cz-atxt{font:700 8.5px var(--font-ui);fill:var(--ink)}
.cz-mg{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.cz-mgt{font-size:9.5px}
.cz-grpbox{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 3}
.cz-gtxt{font:700 13px var(--font-ui);fill:var(--ink)}
.cz-txt{font:600 11px var(--font-ui);fill:var(--ink-2)}
.cz-txt-s{font:600 10px var(--font-ui);fill:var(--ink-2)}
.cz-txt-b{font:700 11px var(--font-ui);fill:var(--ink)}
.cz-halo-t{paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.cz-lead{fill:none;stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}

/* photosystem */
.cz-psdisc{fill:var(--cz-core);stroke:var(--rule);stroke-width:1}
.cz-pa{fill:var(--leaf);stroke:var(--leaf-edge);stroke-width:1}
.cz-pb{fill:var(--leaf-fill);stroke:var(--leaf);stroke-width:2}
.cz-pc{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.8}
.cz-rc{fill:var(--leaf);stroke:var(--ink);stroke-width:2.2}
.cz-acc{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.cz-acc.off{stroke-dasharray:3 2}
.cz-x{stroke:var(--ink);stroke-width:2;fill:none}
.cz-busy{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.cz-photon{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cz-halo{fill:var(--hi)}
.cz-trail-u{fill:none;stroke:var(--hi);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.cz-trail{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:2 3;stroke-linecap:round}
.cz-trail-h{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cz-e{fill:var(--bio-e);stroke:var(--sheet);stroke-width:1.2}
.cz-etxt{font:700 11px var(--font-ui);fill:var(--bio-e)}
.cz-earrow{fill:none;stroke:var(--bio-e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cz-heat{fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round}
.cz-track{fill:none;stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:4 3}
.cz-track.cz-head{stroke-dasharray:none}
.cz-tokt{font:700 9px var(--font-ui);fill:var(--sheet)}

/* explorer layout */
.cz-pg [hidden]{display:none!important}
.cz-pg .pg-ctrl{display:grid;gap:10px}
.cz-row{margin:0}
.cz-panel{display:grid;gap:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.cz-sub{display:grid;gap:8px}
.cz-fire{margin:0}
.cz-sl{margin:0}
.cz-sl input{width:100%;accent-color:var(--ink)}
.cz-note,.cz-saved,.cz-savemsg{margin:0}
.cz-save .q-actions{margin:0}
.cz-savemsg{color:var(--ink);font-weight:700}
.cz-stage{position:relative;width:100%;aspect-ratio:400 / 270;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);overflow:hidden}
.cz-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cz-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;color:var(--ink-2)}
.cz-legend span{display:inline-flex;align-items:center;gap:4px}
.cz-legend svg{width:14px;height:14px}
.cz-cap{margin:8px 0 0;font-size:.9rem;color:var(--ink-2);min-height:1.4em}
.cz-path{margin-top:8px;padding:8px 10px;border:1.5px dashed var(--rule);border-radius:8px;display:grid;gap:6px}
.cz-pi,.cz-trail-p{margin:0;font-size:.92rem}
.cz-lab{font-weight:700;color:var(--ink-2)}
.cz-pchips{display:flex;flex-wrap:wrap;gap:6px}
.cz-pchip{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.25em .7em;font-size:.88rem;min-height:34px}
.cz-pchip:hover{background:var(--hi-soft)}
.cz-btns{display:flex;flex-wrap:wrap;gap:6px}
.cz-hl{background:var(--hi-soft);color:var(--ink);font-weight:700;padding:0 .25em;border-radius:3px}
.cz-meter{display:grid;gap:3px;margin-top:8px}
.cz-meter-l{font-size:.82rem;color:var(--ink-2)}
.cz-meter-t{position:relative;display:block;height:10px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);overflow:hidden}
.cz-meter-t i{position:absolute;left:0;top:0;bottom:0}
.cz-m-cap{background:var(--ink-2)}
.cz-m-e{background:var(--bio-e)}
.cz-m-lost{background:var(--hi)}
.cz-top{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
/* the P1 test tube: a dark room (module tokens) */
.cz-tubefig{margin:0 0 10px;max-width:440px}
.cz-stage-tube{aspect-ratio:340 / 150;border:0}
.cz-tubefig figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:4px;color:var(--ink-2)}
.cz-room{fill:var(--cz-room)}
.cz-rtxt{font:600 10px var(--font-ui);fill:var(--cz-room-ink)}
.cz-rline{stroke:var(--cz-room-ink);stroke-width:2;fill:none}
.cz-lamp{fill:var(--cz-room);stroke:var(--cz-room-ink);stroke-width:2}
.cz-lamp.on{fill:var(--pen)}
.cz-beam{fill:var(--pen)}
.cz-rwave{fill:none;stroke:var(--cz-room-ink);stroke-width:1.6;stroke-linecap:round}
.cz-glass{fill:none;stroke:var(--cz-room-ink);stroke-width:2}
.cz-extract{fill:var(--leaf);opacity:.9}
@media (max-width:820px){
  .cz-pg{grid-template-areas:"graph" "read" "ctrl"}
}

/* Part 3 */
.cz-p3 h3{margin-top:0}
.cz-cards{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.cz-card{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.45em .8em;font-size:.92rem;text-align:left;min-height:40px;max-width:100%}
.cz-card[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink);font-weight:700}
.cz-wdx{max-width:640px;margin:10px 0}
.cz-wdx .s1-stage{aspect-ratio:400 / 240}
.cz-wmem{fill:var(--cz-core);stroke:var(--ink);stroke-width:1.8}
.cz-wlu{fill:var(--cz-lumen);stroke:var(--ink);stroke-width:1.8}
.cz-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.cz-bin{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px}
.cz-bin h4{margin:0 0 6px;font-size:.95rem}
.cz-bin ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.cz-bin li{display:grid;gap:4px;font-size:.9rem}
.cz-bin li .btn{justify-self:start}
.cz-clip{border:1.5px solid var(--ink-2);border-radius:8px;padding:10px 12px;margin:10px 0}
.cz-clip h4{margin:0 0 8px}
.cz-clipfig{margin:0;max-width:640px}
.cz-stage-clip{aspect-ratio:400 / 200}
.cz-clipfig figcaption{margin-top:6px;color:var(--ink)}
.cz-data{margin-top:16px}
.cz-endo{border-collapse:collapse;width:100%;font-size:.88rem}
.cz-endo th,.cz-endo td{text-align:left;vertical-align:middle;padding:6px 8px;border-bottom:1px solid var(--rule)}
.cz-endo thead th{font-size:.8rem;color:var(--ink-2);vertical-align:bottom}
.cz-whys{margin:8px 0 0;padding-left:1.2em;display:grid;gap:4px;font-size:.92rem}
.cz-rowb{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.3em .6em;font-weight:700;font-size:.88rem;min-height:34px;text-align:left}
.cz-rowb[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.cz-endo tr.on td{font-weight:600}
.cz-closing{border-left:4px solid var(--ink);background:var(--info-bg);padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px}
.cz-closing p{margin:0}
@media (max-width:700px){ .cz-bins{grid-template-columns:minmax(0,1fr)} }

/* practice: label quiz, puzzles */
.lq-labs{margin:4px 0 8px}
.lq-dx{max-width:640px;margin-top:10px}
.cz-pair{display:grid;gap:6px}
.cz-unit{margin-left:6px;color:var(--ink-2)}

/* task: tube builder */
.cz-slots{display:grid;gap:8px;margin:10px 0}
.cz-slot{border:1.5px solid var(--rule);border-radius:8px;padding:4px 10px 8px;margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;min-width:0}
.cz-slot legend{font-weight:700;padding:0 4px}
.cz-slot .rg-lab{font-size:.8rem}
.cz-slot .rg.chips button{min-height:30px;padding:.2em .7em}
.cz-stage-rack{aspect-ratio:400 / 214}
.cz-liq{fill:var(--sheet)}
.cz-liq-f{fill:var(--leaf);opacity:.45}
.cz-liq-b{fill:var(--leaf);opacity:.2}
.cz-liq-dye{fill:var(--pen)}
.cz-glass2{fill:none;stroke:var(--ink);stroke-width:1.8}
.cz-glass.cz-empty{stroke:var(--ink-2);stroke-dasharray:4 3}
.cz-all{font-weight:700}

/* hero */
.cz-hero{width:100%;aspect-ratio:560 / 320}
.cz-hero svg{width:100%;height:100%;display:block}
.cz-bubbg{fill:var(--sheet);stroke:none}
.cz-bubring{fill:none;stroke:var(--ink);stroke-width:2}
.cz-hlab{font:700 13px var(--font-ui);fill:var(--ink)}
.cz-hsub{font-weight:600;font-size:11.5px;fill:var(--ink-2)}

</style>
</head>

","kind":"topic","group":"4"},{"nn":"37","slug":"hormones-that-affect-metabolism","title":"Hormones That Affect Metabolism","kind":"topic","group":"4"},{"nn":"38","slug":"male-reproductive-hormones","title":"Male Reproductive Hormones","kind":"topic","group":"4"},{"nn":"39","slug":"female-reproductive-hormones","title":"Female Reproductive Hormones","kind":"topic","group":"4"},{"nn":"40","slug":"action-potential","title":"Action Potential","kind":"topic","group":"4"},{"nn":"41","slug":"synapses","title":"Synapses","kind":"topic","group":"4"},{"nn":"42","slug":"insulin-and-glucagon","title":"Insulin and Glucagon","kind":"topic","group":"4"},{"nn":"43","slug":"population-ecology","title":"Population Ecology","kind":"topic","group":"5"},{"nn":"44","slug":"species-interactions","title":"Predation, Competition and Symbiosis","kind":"topic","group":"5"},{"nn":"45","slug":"ecological-succession","title":"Ecological Succession","kind":"topic","group":"5"},{"nn":"46","slug":"human-population-growth","title":"Human Population Growth","kind":"topic","group":"5"}]},"salt":"a3378342","content":{"id":"03-chlorophyll-and-chloroplasts","kind":"topic","title":"Chlorophyll and chloroplasts","topic":"Chlorophyll and Chloroplasts","readyTopic":"chlorophyll and chloroplasts","hero":{"headline":"Hundreds of pigments, one electron","text":"Inside every chloroplast, stacks of \u003cstrong>thylakoids\u003c/strong> hold \u003cstrong>photosystems\u003c/strong>. Hundreds of \u003cstrong>antenna\u003c/strong> pigments catch light and funnel its energy to one \u003cstrong>reaction centre\u003c/strong>, where a chlorophyll \u003ci>a\u003c/i> molecule finally sends an electron on its way. That single electron hop is where light becomes chemistry.","fig":{"html":"\u003cdiv class=\"cz-hero\" id=\"cz-hero\" role=\"img\" aria-label=\"A chloroplast cut open, labelled envelope, stroma and granum. A zoom bubble on one thylakoid membrane shows a photosystem: a ring of antenna pigments around a reaction centre. A photon lands on an outer antenna pigment; its energy hops from pigment to pigment toward the centre (dotted path), and the reaction centre sends one electron to the primary electron acceptor.\">\u003c/div>"}},"goals":["I can identify the parts of a chloroplast and say which processes happen in each.","I can describe a chlorophyll molecule’s structure and relate it to its job.","I can explain how an antenna passes energy to a reaction centre, and what the reaction centre does with it.","I can predict what happens to absorbed energy when the acceptor is blocked or when the light is stronger than the reaction centre can use.","I can explain the evidence that chloroplasts descended from bacteria."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Organelles","goal":5,"prompt":"Besides the nucleus, which of these organelles contains its own DNA?","options":[{"t":"Lysosome","why":"Lysosomes hold digestive enzymes.","_n":"012d","_k":"268b200d"},{"t":"Golgi body","why":"The Golgi packages proteins; it has no DNA.","_n":"113d","_k":"2af7a0d1"},{"t":"Chloroplast","why":"Chloroplasts (and mitochondria) carry small circular DNA molecules.","_n":"214d","_k":"7d8bc1a2"},{"t":"Ribosome","why":"Ribosomes read RNA; they don’t store DNA.","_n":"315d","_k":"40e719c1"}],"hints":["Which organelles can divide on their own?","The energy organelles.","Chloroplasts."]},{"id":"w2","skill":"Organelles","goal":1,"prompt":"What does it mean that a chloroplast has a ‘double membrane’?","options":[{"t":"Its membrane is made of two layers of phospholipids","why":"Every membrane is a bilayer; a double membrane is two bilayers.","_n":"416d","_k":"bf640ecd"},{"t":"It has a membrane and a cell wall","why":"Organelles don’t have cell walls.","_n":"517d","_k":"49254179"},{"t":"It is surrounded by two separate membranes","why":"An outer and an inner membrane, with a narrow space between.","_n":"618d","_k":"c57f7c72"},{"t":"It has two copies of each membrane protein","why":"‘Double’ refers to two whole membranes.","_n":"709d","_k":"e0676b42"}],"hints":["Every membrane is already a phospholipid bilayer.","So ‘double’ must mean two membranes.","Outer and inner."]},{"id":"w3","skill":"Membranes","goal":2,"prompt":"The fatty-acid tails of membrane phospholipids are…","options":[{"t":"made of protein","why":"Membrane proteins are separate molecules.","_n":"80ad","_k":"8d16e8d5"},{"t":"hydrophilic: they attract water","why":"That’s the phosphate heads.","_n":"9469","_k":"eb3c1e88"},{"t":"hydrophobic: they avoid water","why":"They face each other inside the bilayer.","_n":"a459","_k":"554d4ff0"},{"t":"charged, like ions","why":"The tails are uncharged hydrocarbon chains.","_n":"b449","_k":"d992020d"}],"hints":["Oil and water don’t mix.","The tails are like oil.","Hydrophobic."]},{"id":"w4","skill":"Membranes","goal":2,"prompt":"Which molecule would sit most comfortably in the middle of a membrane?","options":[{"t":"Water","why":"Water is polar; few water molecules sit in the core.","_n":"c439","_k":"bfa05d47"},{"t":"A sodium ion","why":"Charged particles avoid the oily core.","_n":"d4a9","_k":"6846676e"},{"t":"One with a long hydrocarbon tail","why":"Like dissolves like: the tail fits among the lipid tails.","_n":"e499","_k":"21189d78"},{"t":"Glucose","why":"Glucose is polar and stays in water.","_n":"f489","_k":"e2f13885"}],"hints":["The membrane’s core is oily.","Which option is oily?","The long hydrocarbon tail."]},{"id":"w5","skill":"Light and pigments","goal":3,"prompt":"Which is the main photosynthetic pigment?","options":[{"t":"Carotene","why":"Carotenoids are accessory pigments.","_n":"g479","_k":"92251b37"},{"t":"Chlorophyll \u003ci>b\u003c/i>","why":"Chlorophyll \u003ci>b\u003c/i> is an accessory pigment.","_n":"h3e9","_k":"e9766bf7"},{"t":"Xanthophyll","why":"Also an accessory pigment.","_n":"i3d9","_k":"b0ffca6f"},{"t":"Chlorophyll \u003ci>a\u003c/i>","why":"It’s in every reaction centre.","_n":"j4c9","_k":"64f0b225"}],"hints":["Which pigment did module 02 call the main one?","The others pass energy to it.","Chlorophyll \u003ci>a\u003c/i>."]},{"id":"w6","skill":"Light and pigments","goal":3,"prompt":"When a pigment molecule absorbs a photon, what happens first?","options":[{"t":"The pigment changes colour permanently","why":"It returns to its normal state very quickly.","_n":"k4d9","_k":"c7773c58"},{"t":"One of its electrons is raised to a higher energy level","why":"The pigment becomes ‘excited’.","_n":"l4a9","_k":"6c4df9b9"},{"t":"The pigment gets hot enough to glow","why":"Absorption excites an electron; any heat comes later.","_n":"m4b9","_k":"b4c8f118"},{"t":"The photon is stored inside the molecule as light","why":"The photon’s energy is transferred; it doesn’t stay as light.","_n":"n489","_k":"bc1045cd"}],"hints":["Absorbed energy has to go somewhere in the molecule.","Into an electron.","The electron is boosted to a higher level."]}],"refreshers":{"Organelles":"Chloroplasts and mitochondria each have two membranes, their own small circular DNA and their own ribosomes.","Membranes":"A membrane is a phospholipid bilayer: water-loving heads outside, oily tails inside. Molecules with long oily tails can sit inside it.","Light and pigments":"Absorbing a photon excites one of the pigment’s electrons. Chlorophyll \u003ci>a\u003c/i> is the main pigment; chlorophyll \u003ci>b\u003c/i> and carotenoids are accessory pigments."}}},"explore":{"heading":"Chloroplast zoom","intro":"Dive from a leaf cell into a single photosystem. Then fire photons into the antenna and watch where the energy goes.","levels":[["cell","Palisade cell"],["chloro","Chloroplast (≈ 5 µm long)"],["granum","Granum"],["mem","Thylakoid membrane"],["mol","Chlorophyll molecule"]],"hotspots":{"chloro":{"name":"Chloroplast","job":"The organelle where photosynthesis happens, about 5 µm long. Choose the Chloroplast zoom level to look inside."},"nucleus":{"name":"Nucleus","job":"Holds the cell’s own DNA, as linear chromosomes."},"vacuole":{"name":"Vacuole","job":"Stores water and dissolved substances."},"wall":{"name":"Cell wall","job":"A rigid cellulose layer outside the membrane that supports the cell."},"outer":{"name":"Outer membrane","job":"The outer layer of the double envelope; it faces the cytoplasm.","where":"Outermost line around the chloroplast"},"inner":{"name":"Inner membrane","job":"The inner layer of the envelope; it faces the stroma.","where":"Second line, just inside the outermost one"},"stroma":{"name":"Stroma","job":"Fluid inside the chloroplast, around the thylakoids; sugar-making enzymes, DNA, ribosomes.","where":"Fluid filling the inside"},"thylakoid":{"name":"Thylakoid","job":"A flattened membrane sac; its membrane holds the photosystems.","where":"End of one sac in the middle stack"},"granum":{"name":"Granum","job":"A stack of thylakoids (plural: grana).","where":"A whole stack of thin sacs"},"lumen":{"name":"Thylakoid lumen","job":"The space inside a thylakoid; H⁺ builds up here.","where":"Hollow centre of a sac in the middle stack"},"lamella":{"name":"Stroma lamella","job":"An unstacked thylakoid that bridges two grana.","where":"Thin bridge between two stacks"},"dna":{"name":"Chloroplast DNA","job":"Small circular DNA, like a bacterium’s; it carries some of the chloroplast’s own genes.","where":"Small looped strand"},"ribosome":{"name":"Ribosome","job":"Small (70S) ribosomes, like a bacterium’s, that make some of the chloroplast’s own proteins."},"starch":{"name":"Starch grain","job":"Stored sugar, made in the stroma.","where":"Large pale oval"},"tmem":{"name":"Thylakoid membrane","job":"Holds the photosystems and electron carriers; light is absorbed here."},"ps":{"name":"Photosystem","job":"An antenna of hundreds of pigments around a reaction centre. Choose Photosystem mode to fire photons at one."},"chl":{"name":"Chlorophyll","job":"Held in the photosystem’s proteins; its oily tail anchors it in the membrane. Zoom to the Chlorophyll molecule level."},"ring":{"name":"Ring","job":"The light-absorbing part of the molecule."},"mg":{"name":"Magnesium atom","job":"Sits at the centre of the ring. Without magnesium, a plant can’t make chlorophyll."},"tail":{"name":"Tail","job":"A long hydrocarbon chain that anchors the molecule in the thylakoid membrane. It doesn’t absorb light."},"group":{"name":"Side group","job":"−CH₃ in chlorophyll \u003ci>a\u003c/i>, −CHO in chlorophyll \u003ci>b\u003c/i>: the one small group that differs between them. It shifts the colours each one absorbs."}},"tubeNote":"Chlorophyll extracted from spinach, in a test tube in a dark room.","pathIntro":"Trace the photon (challenge 1): tap, in order, the parts it passes through or reaches.","pathParts":[["outer","outer membrane"],["inner","inner membrane"],["stroma","stroma"],["tmem","thylakoid membrane"],["stoma","stoma"],["lumen","thylakoid lumen"]],"modelNote":"Model values: photons captured per second = antenna size × light factor (Low 0.25, Moderate 0.5, High 1.0). A reaction centre’s top speed is 100 electrons per second. The numbers are illustrative: real antennas hold roughly 200–300 pigments per reaction centre.","predIntro":"Make a prediction first. Then the zoom or the photosystem will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"zoom","tube":true},"prompt":"\u003cspan class=\"muted\">A test tube holds chlorophyll extracted from spinach.\u003c/span> The tube is lit with blue light in a dark room. What will you see?","options":[{"t":"A red glow","_n":"o499","_k":"d84ffeda"},{"t":"Nothing at all","_n":"p469","_k":"1b06c0b5"},{"t":"Bubbles of O₂","_n":"q479","_k":"bc0e6d5d"},{"t":"A green glow","_n":"r449","_k":"c32e9f7d"}],"explain":"Isolated chlorophyll absorbs the light, but there’s no acceptor to take the excited electron. The energy comes back out as red light (fluorescence) and heat. No O₂: there’s no working photosystem."},{"id":"p2","start":{"mode":"ps","nm":550},"prompt":"\u003cspan class=\"muted\">A single 550 nm photon is fired at the antenna.\u003c/span> What will most likely happen to this green photon?","options":[{"t":"It turns into a red photon","_n":"s459","_k":"27e2eced"},{"t":"It is absorbed by chlorophyll \u003ci>a\u003c/i>","_n":"tb29","_k":"56833aa3"},{"t":"It passes through or is reflected","_n":"ub19","_k":"62204c1e"},{"t":"It sends two electrons","_n":"vb49","_k":"b0e5387f"}],"explain":"The pigments absorb little green (module 02)."},{"id":"p3","start":{"mode":"ps","nm":450,"slow":true},"prompt":"\u003cspan class=\"muted\">A single 450 nm photon, in slow motion.\u003c/span> As the energy moves from the first antenna pigment toward the centre, what is passed from pigment to pigment?","options":[{"t":"A proton","_n":"wb39","_k":"e50a2651"},{"t":"An electron","_n":"xb69","_k":"a9ea2a43"},{"t":"Energy","_n":"yb59","_k":"8979e556"},{"t":"An ATP molecule","_n":"zb89","_k":"10e11b07"}],"explain":"Energy hops between neighbouring pigments. Only the reaction centre hands an electron to the acceptor."},{"id":"p4","start":{"mode":"rate","light":"low","ant":100,"to":200},"prompt":"\u003cspan class=\"muted\">Rate view: Low light, and the antenna grows from 100 to 200 pigments.\u003c/span> What happens to the electrons sent per second?","options":[{"t":"They halve","_n":"10b79","_k":"ec435709"},{"t":"They stay at 25","_n":"11ba9","_k":"7e70aa82"},{"t":"They reach the maximum of 100","_n":"12b99","_k":"75b330cd"},{"t":"They double, from 25 to 50","_n":"13b89","_k":"12fd8536"}],"explain":"In dim light, the reaction centre is waiting for energy. A bigger antenna catches more."}],"chalIntro":"Use the zoom (challenge 1: the photon path under the diagram) or the photosystem (challenges 2 and 3), then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"A photon enters a chloroplast and is absorbed by chlorophyll. Tap, in order, the parts it passes through or reaches.","why":"Outer membrane → inner membrane → stroma → thylakoid membrane: through the envelope, across the fluid, to the chlorophyll held in a thylakoid’s membrane.","general":"Start at the envelope and end where the chlorophyll is. Use the photon path chips under the diagram in Zoom mode; press Clear to start again.","hints":["First get through the envelope.","Then cross the fluid to a thylakoid.","Outer → inner → stroma → thylakoid membrane."]},{"id":"tc2","goal":[3,4],"prompt":"At moderate light, set the \u003cstrong>smallest\u003c/strong> antenna that keeps the reaction centre at its top speed.","why":"200 × 0.5 = 100 photons per second: exactly the reaction centre’s top speed, with nothing wasted.","hints":["Top speed is 100 electrons per second.","Moderate light: each pigment catches 0.5 photons per second.","100 ÷ 0.5 = 200 pigments."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"A maple has shade leaves on its low branches (low light) and sun leaves at the top (high light). Set and save an antenna for each, so both reaction centres run at top speed with \u003cstrong>no\u003c/strong> energy wasted.","why":"Shade: 400 × 0.25 = 100. Sun: 100 × 1.0 = 100. Both reaction centres run at top speed, and nothing is wasted.","hints":["Divide 100 by each light factor.","Low: 100 ÷ 0.25; High: 100 ÷ 1.0.","Shade 400, sun 100. Real shade leaves do build bigger antennas, with more chlorophyll \u003ci>b\u003c/i>."]}]},"part3":{"slug":"where","name":"Where","heading":"Which reactions happen where?","intro":"You’ve explored the chloroplast’s parts. Now map the processes of photosynthesis onto them, then weigh the evidence for where chloroplasts came from.","sorterTitle":"Station 1: the process sorter","sorterHow":"Tap a card, then tap the region of the chloroplast where it happens: \u003cstrong>Thylakoid membrane\u003c/strong>, \u003cstrong>Thylakoid lumen\u003c/strong> or \u003cstrong>Stroma\u003c/strong>. Each correct card gets a \u003cstrong>Zoom to the molecules\u003c/strong> button that plays a 3-second clip of the event.","regions":[{"id":"tm","t":"Thylakoid membrane"},{"id":"lu","t":"Thylakoid lumen"},{"id":"st","t":"Stroma"}],"cards":[{"id":"c1","t":"Light is absorbed by chlorophyll","_a":"Q0deFQ==","clip":"A photon’s energy is absorbed by a chlorophyll held in a photosystem, in the thylakoid membrane."},{"id":"c2","t":"Photosystems and electron carriers are held in place","_a":"Q0deFQ==","clip":"The membrane holds the complexes in a fixed order, so an electron can pass from one to the next."},{"id":"c3","t":"ATP synthase sits here","_a":"Q0deFQ==","clip":"ATP synthase spans the thylakoid membrane. H⁺ flows through it from the lumen to the stroma."},{"id":"c4","t":"Water molecules are split and O₂ is released","_a":"Q19GFQ==","note":"On the membrane’s inner face.","clip":"At photosystem II, on the lumen side: 2H₂O → 4H⁺ + 4e⁻ + O₂. The H⁺ stays in the lumen."},{"id":"c5","t":"H⁺ ions build up to a high concentration","_a":"Q19GFQ==","clip":"H⁺ ions pile up inside the thylakoid, far more than in the stroma (module 06)."},{"id":"c6","t":"ATP is made (ATP synthase’s head faces this way)","_a":"Q0BHFQ==","wrong":{"tm":"ATP synthase is \u003cstrong>in\u003c/strong> the membrane, but the ATP is released into the stroma."},"clip":"In the head of ATP synthase, on the stroma side, ADP + Pᵢ → ATP."},{"id":"c7","t":"NADPH is made","_a":"Q0BHFQ==","clip":"On the stroma side of photosystem I, electrons and H⁺ turn NADP⁺ into NADPH."},{"id":"c8","t":"CO₂ is fixed by the enzyme rubisco","_a":"Q0BHFQ==","wrong":{"lu":"Rubisco works in the stroma."},"clip":"Rubisco joins CO₂ to a 5-carbon sugar; the product splits into two 3-carbon molecules (module 08)."},{"id":"c9","t":"Sugar (G3P) is built","_a":"Q0BHFQ==","clip":"ATP and NADPH from the light reactions power the building of G3P, a 3-carbon sugar."},{"id":"c10","t":"Chloroplast DNA and ribosomes are found","_a":"Q0BHFQ==","clip":"A 70S ribosome reads a message copied from the chloroplast’s own DNA and builds a protein, right in the stroma."}],"wrongDefault":"Check which side of the thylakoid membrane faces this space.","dataTitle":"Station 2: Check it with data — endosymbiosis","dataHow":"The table compares a cyanobacterium (a photosynthetic bacterium), a chloroplast, and the plant cell’s own nucleus and cytoplasm. Tap each row that supports endosymbiosis to see why.","table":{"head":["Feature","Cyanobacterium","Chloroplast","Plant cell (nucleus and cytoplasm)"],"rows":[{"id":"r1","cells":["DNA shape","Circular","Circular","Linear chromosomes"],"why":"The chloroplast’s DNA is circular, like the bacterium’s; the plant cell’s own chromosomes are linear."},{"id":"r2","cells":["Ribosome size","Small (70S)","Small (70S)","Large (80S)"],"why":"The chloroplast’s ribosomes are the small 70S type found in bacteria, not the plant cell’s 80S type."},{"id":"r3","cells":["Membranes around it","Its own cell membrane","Two (inner and outer)","n/a"],"why":"Two membranes: the inner from the bacterium’s own membrane, the outer from the host cell that engulfed it."},{"id":"r4","cells":["How it divides","Splits in two","Splits in two, on its own","Mitosis"],"why":"A chloroplast splits in two on its own, as a bacterium does; the cell can’t build one from scratch."},{"id":"r5","cells":["Photosynthesis genes","Similar","Similar","n/a"],"why":"The chloroplast’s photosynthesis genes are similar to the cyanobacterium’s, as you’d expect from a shared ancestor."}]},"closing":"Lynn Margulis argued for this idea in the 1960s; it’s now strongly supported. The inner membrane came from the bacterium, the outer from the host cell that engulfed it.","quickCheck":{"title":"Quick check","summary":"Where quick check","items":[{"id":"q1","goal":1,"prompt":"Where are photosystems found?","choices":[{"t":"Outer membrane","fb":"Pigments are anchored in the thylakoid membranes.","_n":"14b99","_k":"a29ca457"},{"t":"Thylakoid membrane","fb":"Pigments are anchored in the thylakoid membranes.","_n":"15ba9","_k":"56e513f9"},{"t":"Lumen","fb":"Pigments are 1p429","_k":"f1946642"},{"t":"It turns green","why":"Fluorescence is what’s left when no acceptor takes the electron.","_n":"1q439","_k":"a2ffa152"},{"t":"It stays the same","why":"Fluorescence is what’s left when no acceptor takes the electron.","_n":"1r489","_k":"0e11883a"}],"hints":["Why does extracted chlorophyll glow?","The excited electron has nowhere to go, so its energy comes back out as light.","With an acceptor, the energy leaves as electrons, so the glow dims."]},{"id":"y6","kind":"mc","goal":2,"star":true,"prompt":"Magnesium moves easily inside a plant, so in a magnesium-poor soil the plant moves it from old leaves to new ones. Which leaves turn yellow first, and why?","options":[{"t":"The veins only","why":"Mobile nutrients leave old leaves first, so the symptoms show there.","_n":"1s499","_k":"6a780e82"},{"t":"Older leaves, because their magnesium is moved out and their chlorophyll can’t be replaced","why":"Mobile nutrients leave old leaves first, so the symptoms show there.","_n":"1t469","_k":"1ce34b25"},{"t":"All leaves equally","why":"Mobile nutrients leave old leaves first, so the symptoms show there.","_n":"1u479","_k":"aaffad72"},{"t":"Young leaves, because they grow fastest","why":"Mobile nutrients leave old leaves first, so the symptoms show there.","_n":"1v3c9","_k":"04fdf63c"}],"hints":["Magnesium is at the centre of every chlorophyll.","If the plant moves it to new leaves, the old leaves lose it.","Old leaves turn yellow first."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Alejandro","how":"","instruction":"Alejandro made one mistake in each explanation. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Describe how light energy reaches the reaction centre.","steps":["A photon is absorbed by an antenna pigment, exciting one of its electrons.","That pigment passes the excited electron to the next pigment, and so on toward the centre.","T ylakoid’s."]},{"id":"e3","goal":5,"task":"Summarize the evidence that chloroplasts were once bacteria.","steps":["Chloroplasts have their own circular DNA, like bacteria.","Their ribosomes are the small 70S type found in bacteria.","They have a single membrane, as you’d expect for a bacterium swallowed whole.","They divide by splitting in two."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 is correct."],"fixes":[{"t":"Step 3 is correct.","why":"Engulfing wraps the bacterium in the host’s own membrane, which adds a second one.","_n":"2447a","_k":"ce17223e"},{"t":"They have two membranes: the inner from the bacterium, the outer from the host cell that engulfed it.","why":"Engulfing wraps the bacterium in the host’s own membrane, which adds a second one.","_n":"2542a","_k":"e141b3c5"},{"t":"They have three membranes.","why":"Engulfing wraps the bacterium in the host’s own membrane, which adds a second one.","_n":"2641a","_k":"86333e2a"},{"t":"They have no membrane at all.","why":"Engulfing wraps the bacterium in the host’s own membrane, which adds a second one.","_n":"27307","_k":"3ed6c31d"}],"hints":["How many membranes surround a chloroplast?","Two.","One from each partner."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you: the red glow of extracted chlorophyll, or the reaction centre’s speed limit?"},{"id":"j2","q":"In your own words, what’s the difference between what antenna pigments do and what the reaction centre does?"},{"id":"j3","q":"Explain to a friend where the stroma and the lumen are, and why the difference matters."},{"id":"j4","q":"Which part of the chloroplast are you still unsure about? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Where are the photosystems found?","options":[{"t":"In the thylakoid lumen","why":"The lumen is the space inside, not the membrane.","_n":"28317","_k":"abd130f3"},{"t":"In the thylakoid membranes","why":"Photosystems are protein complexes held in the thylakoid membranes, where light is absorbed.","_n":"29327","_k":"a0aab23a"},{"t":"Dissolved in the stroma","why":"Chlorophyll is held in protein complexes in the thylakoid membranes; its tail anchors it there.","_n":"2a337","_k":"09034694"},{"t":"In the outer membrane of the envelope","why":"The envelope just encloses the chloroplast.","_n":"2b347","_k":"f4daf484"}]},"b":{"prompt":"Where are the enzymes that fix CO₂ found?","options":[{"t":"In the thylakoid membranes","why":"The membranes hold the light-capturing parts.","_n":"2c357","_k":"7b60182c"},{"t":"In the thylakoid lumen","why":"The lumen is \u003cstrong>inside\u003c/strong> each thylakoid; the stroma is \u003cstrong>outside\u003c/strong> the thylakoids.","_n":"2d367","_k":"72577e1c"},{"t":"In the stroma","why":"Rubisco and the other sugar-making enzymes work in the stroma.","_n":"2e377","_k":"32b055df"},{"t":"In the stoma","why":"A stoma is a leaf pore.","_n":"2f387","_k":"ccbd6b5c"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which atom sits at the centre of a chlorophyll molecule’s ring?","options":[{"t":"Iron","why":"Iron is at the centre of heme in hemoglobin.","_n":"2g397","_k":"b117c254"},{"t":"Magnesium","why":"Magnesium sits at the centre of the light-absorbing ring.","_n":"2h367","_k":"95170f0b"},{"t":"Carbon","why":"The ring is mostly carbon, but its centre is a metal atom.","_n":"2i357","_k":"861107fe"},{"t":"Nitrogen","why":"Nitrogen atoms surround the centre; they aren’t the centre.","_n":"2j347","_k":"9debc0ac"}]},"b":{"prompt":"What does chlorophyll’s long hydrocarbon tail do?","options":[{"t":"Anchors the molecule in the thylakoid membrane","why":"The oily tail sits among the membrane’s lipid tails and holds the molecule in place.","_n":"2k337","_k":"3ccbcac9"},{"t":"Absorbs red light","why":"The ring absorbs light.","_n":"2l3a7","_k":"9f97fc27"},{"t":"Carries electrons to the acceptor","why":"The reaction centre ring sends the electron.","_n":"2m397","_k":"20a8ae4  it.","why":"Chlorophyll \u003ci>a\u003c/i> fluoresces too.","_n":"2y4ea","_k":"b39bf9c1"},{"t":"The extracted chlorophyll was damaged by the solvent.","why":"The extract still absorbs light; it just can’t pass electrons on.","_n":"2z51a","_k":"862722f5"}]},"b":{"prompt":"A herbicide blocks a photosystem’s primary electron acceptor. Predict what happens to the leaf’s red fluorescence.","options":[{"t":"It increases, because absorbed energy can no longer leave as electrons.","why":"With the acceptor blocked, more of the absorbed energy comes back out as red light and heat.","_n":"3050a","_k":"9d2db3ba"},{"t":"It stops, because the pigments are destroyed.","why":"The herbicide blocks the acceptor; the pigments still absorb.","_n":"31e3a","_k":"542d0ca7"},{"t":"It stays the same, because fluorescence doesn’t depend on the acceptor.","why":"Isolated chlorophyll absorbs light, but with no acceptor the energy comes back out as red light and heat.","_n":"32e4a","_k":"d7f6a04b"},{"t":"It decreases, because less light is absorbed.","why":"Absorption isn’t affected; only the electron’s exit is blocked.","_n":"33e1a","_k":"34ababbb"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"At moderate light each antenna pigment captures 0.5 photons per second, and a reaction centre’s top speed is 100 electrons per second. With 300 antenna pigments, how much energy is lost as heat and fluorescence each second?","options":[{"t":"None","why":"A bigger antenna isn’t free.","_n":"34e2a","_k":"e8b01f4f"},{"t":"100 photons’ worth","why":"That’s the amount used.","_n":"35dfa","_k":"e8be0131"},{"t":"50 photons’ worth","why":"150 captured − 100 used.","_n":"36e0a","_k":"981a3d88"},{"t":"150 photons’ worth","why":"That’s the amount captured.","_n":"37dda","_k":"d25242f9"}]},"b":{"prompt":"In low light each pigment captures 0.25 photons per second. With 300 antenna pigments, how much energy is lost each second?","options":[{"t":"None: 75 photons per second is below the reaction centre’s top speed","why":"300 × 0.25 = 75 photons per second, below the top speed of 100, so the reaction centre uses all of it.","_n":"38dea","_k":"89ecec50"},{"t":"200 photons’ worth","why":"That’s 300 − 100, which mixes pigments with photons.","_n":"39dba","_k":"17a64609"},{"t":"75 photons’ worth","why":"That’s the amount captured, all of it used.","_n":"3adca","_k":"408a7aa4"},{"t":"25 photons’ worth","why":"75 &lt; 100, so the reaction centre uses all of it.","_n":"3bdd9","_k":"d4bae8f0"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"An antibiotic that blocks bacterial 70S ribosomes stops protein-making inside chloroplasts but not in the rest of the plant cell. Which conclusion does this support?","options":[{"t":"Chloroplasts make all the cell’s proteins.","why":"The rest of the cell kept making proteins.","_n":"3cdc9","_k":"2d1d716a"},{"t":"Chloroplasts have no ribosomes.","why":"Then the antibiotic would have nothing to block there.","_n":"3ddb9","_k":"e7c8d8d0"},{"t":"Chloroplast ribosomes resemble bacterial ribosomes: evidence that chloroplasts came from bacteria.","why":"Only the chloroplasts’ protein-making stopped, so their ribosomes must be like bacterial 70S ribosomes.","_n":"3eda9","_k":"8fbf48f1"},{"t":"The antibiotic kills the plant cell’s nucleus.","why":"Protein-making outside the chloroplast continued.","_n":"3fe19","_k":"b4e7b896"}]},"b":{"prompt":"A drug that blocks bacterial DNA copying stops chloroplasts from dividing but doesn’t stop the nucleus from dividing. Which conclusion does this support?","options":[{"t":"The nucleus contains chloroplast DNA only.","why":"The nucleus kept dividing normally.","_n":"3ge09","_k":"da64a412"},{"t":"Chloroplasts copy their own DNA in a bacteria-like way: evidence that they came from bacteria.","why":"Only the chloroplasts were affected, so they copy their DNA the way bacteria do.","_n":"3hdf9","_k":"dd8d424b"},{"t":"The drug destroys chlorophyll.","why":"Nothing here involves pigments.","_n":"3ide9","_k":"650cca66"},{"t":"Chloroplasts have no DNA.","why":"Then there’d be nothing to copy.","_n":"3jd59","_k":"19fc4025"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why thylakoids are stacked into grana?","options":[{"t":"“Stacking keeps light out of the stroma.”","why":"Light isn’t kept out; it’s absorbed in the membranes.","_n":"3kd49","_k":"0f8c8115"},{"t":"“Stacks hold the stroma’s enzymes in place.”","why":"The enzymes are in the fluid around the stacks.","_n":"3ld79","_k":"f66ed449"},{"t":"“Grana store the sugar the chloroplast makes.”","why":"Sugar is stored as starch grains in the stroma.","_n":"3md89","_k":"7f1468cb"},{"t":"“Stacking packs a huge area of membrane into a small space, so each chloroplast can hold many photosystems.”","why":"More membrane means more photosystems in the same small chloroplast.","_n":"3nd99","_k":"2b51496a"}]},"b":{"prompt":"Which is the best explanation of why photosystems are built into a membrane instead of floating in the stroma?","options":[{"t":"“Membranes absorb green light that pigments miss.”","why":"Chlorophyll is held in protein complexes in the thylakoid membranes; its tail anchors it there.","_n":"3oda9","_k":"59384b38"},{"t":"“Floating pigments would dissolve in the stroma’s sugar.”","why":"That isn’t the reason.","_n":"3pdb9","_k":"95739224"},{"t":"“Membranes make ATP without any light.”","why":"ATP synthase needs a gradient powered by light.","_n":"3qdc9","_k":"317518dc"},{"t":"“The membrane holds pigments and carriers in a fixed order, so energy and electrons pass along efficiently, and it separates the lumen from the stroma.”","why":"A fixed order lets energy and electrons pass along quickly, and the membrane keeps the lumen and the stroma apart.","_n":"3rdd9","_k":"2eb7ff33"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which statement about chlorophyll \u003ci>a\u003c/i> and chlorophyll \u003ci>b\u003c/i> is correct?","options":[{"t":"“Chlorophyll \u003ci>b\u003c/i> has no tail, so it floats in the stroma.”","why":"Chlorophyll is held in protein complexes in the thylakoid membranes; its tail anchors it there.","_n":"3sde9","_k":"7958fcf0"},{"t":"“Chlorophyll \u003ci>b\u003c/i> is found only in the reaction centre.”","why":"Reaction centres use chlorophyll \u003ci>a\u003c/i>.","_n":"3tcf9","_k":"42cb3e8d"},{"t":"“They differ by one small group on the ring, which shifts the wavelengths each one absorbs.”","why":"Chlorophyll \u003ci>a\u003c/i> has −CH₃ where chlorophyll \u003ci>b\u003c/i> has −CHO; that one change shifts the absorption peaks.","_n":"3ud09","_k":"fe09e418"},{"t":"“They have different central atoms.”","why":"The ring, with magnesium at its centre, absorbs light; the tail anchors the molecule. Iron is in hemoglobin.","_n":"3ve1a","_k":"f829cd0e"}]},"b":{"prompt":"Which best explains why magnesium-deficient leaves turn yellow?","options":[{"t":"“The tail falls off chlorophyll without magnesium.”","why":"Magnesium sits in the ring, not the tail.","_n":"3we0a","_k":"6f0974ea"},{"t":"“Magnesium is a yellow pigment that builds up.”","why":"Magnesium isn’t a pigment.","_n":"3xe3a","_k":"a55c055e"},{"t":"“Magnesium deficiency turns chlorophyll \u003ci>a\u003c/i> into chlorophyll \u003ci>b\u003c/i>.”","why":"Both need magnesium.","_n":"3ye2a","_k":"d18c2b02"},{"t":"“Without magnesium, the plant can’t make chlorophyll, so the yellow carotenoids show through.”","why":"Magnesium is part of every chlorophyll; with less chlorophyll, the carotenoids’ yellow shows.","_n":"3zdda","_k":"794934f3"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"Plants on a dim forest floor build larger antennas around each reaction centre than plants in open fields. How does this help them?","options":[{"t":"A larger antenna catches enough of the scarce light to keep each reaction centre busy.","why":"In dim light each pigment catches few photons, so more pigments are needed to keep the reaction centre supplied.","_n":"40dca","_k":"6e596b73"},{"t":"Larger antennas reflect more green light.","why":"A reaction centre has a top speed; extra captured energy beyond it is wasted as heat and fluorescence, and can cause damage.","_n":"41dfa","_k":"00d4c21c"},{"t":"Larger antennas make more reaction centres.","why":"The number of reaction centres is separate.","_n":"42dea","_k":"7a49272c"},{"t":"Larger antennas need less light to be absorbed.","why":"Each pigment still needs photons to arrive.","_n":"43d9a","_k":"b301f96d"}]},"b":{"prompt":"Plants in full sun build smaller antennas around each reaction centre. How does this help them?","options":[{"t":"Smaller antennas absorb more light.","why":"They absorb less per reaction centre.","_n":"44d8a","_k":"586c900f"},{"t":"They avoid capturing more energy than the reaction centres can use, which would be wasted as heat and could cause damage.","why":"In bright light a small antenna already captures enough to keep the reaction centre at top speed.","_n":"455ba","_k":"309bdd30"},{"t":"Smaller antennas move electrons faster.","why":"Speed is limited by the reaction centre.","_n":"465ca","_k":"d06df635"},{"t":"Sun plants don’t need chlorophyll.","why":"They still need it in every photosystem.","_n":"4759a","_k":"7a4fe45a"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"An Ontario potato farmer sees yellowing between the veins of older leaves, and a soil test shows low magnesium. Which explanation and fix fit best?","options":[{"t":"Iron is missing from chlorophyll; add iron.","why":"The ring, with magnesium at its centre, absorbs light; the tail anchors the molecule. Iron is in hemoglobin.","_n":"485aa","_k":"c1d939f5"},{"t":"The leaves have too much chlorophyll; add less nitrogen.","why":"Yellowing means less chlorophyll, not more.","_n":"495fa","_k":"161087f3"},{"t":"Magnesium is needed to make chlorophyll; add a magnesium-containing fertilizer.","why":"Magnesium is the centre atom of every chlorophyll; adding it lets the plant make chlorophyll again.","_n":"4a60a","_k":"89454da3"},{"t":"The plant needs more sunlight; prune nearby trees.","why":"The soil test points to magnesium.","_n":"4b5da","_k":"86d5d8b6"}]},"b":{"prompt":"A hydroponic lettuce grower accidentally leaves magnesium out of the nutrient solution. What will happen over the next weeks?","options":[{"t":"Nothing, because magnesium isn’t used in photosynthesis.","why":"The ring, with magnesium at its centre, absorbs light; the tail anchors the molecule. Iron is in hemoglobin.","_n":"4c5ea","_k":"758561e2"},{"t":"Only the roots are affected.","why":"Chlorophyll is made in the leaves.","_n":"4d53a","_k":"bfd00907"},{"t":"Leaves turn yellow, starting with older ones, and photosynthesis slows because less chlorophyll is made.","why":"The plant moves its magnesium to new leaves, so old leaves lose chlorophyll first, and less chlorophyll captures less light.","_n":"4e54a","_k":"8dedee0e"},{"t":"Leaves turn darker green.","why":"There will be less chlorophyll, not more.","_n":"4f55a","_k":"5eb317bf"}]}}]},"task":{"title":"Prove the chloroplasts did it","summary":"Prove the chloroplasts did it","statement":"\u003cp>Isolated chloroplasts in light can pass electrons to a blue dye, DCPIP, which turns colourless when it gains electrons (Robert Hill showed this in 1937). Design a set of test tubes that shows the change needs \u003cstrong>working chloroplasts and light\u003c/strong>. Can you find all the designs?\u003c/p>\u003cp class=\"tiny muted\">Fill up to 5 tube slots. Each tube needs its chloroplasts, DCPIP and conditions. Press \u003cstrong>Run\u003c/strong> to see the predicted result.\u003c/p>","checks":["\u003cstrong>The test tube:\u003c/strong> fresh chloroplasts + DCPIP + light","\u003cstrong>Dark control:\u003c/strong> fresh chloroplasts + DCPIP + dark","\u003cstrong>Chloroplast control:\u003c/strong> no chloroplasts or boiled chloroplasts, + DCPIP + light","\u003cstrong>Every tube has DCPIP\u003c/strong>","\u003cstrong>3 or 4 tubes\u003c/strong> (different ones)"],"tips":["You need a tube where everything is present.","To show light is needed, change only the light.","To show working chloroplasts are needed, remove or boil them but keep the light.","A tube without dye can’t change colour, so it tells you nothing here.","Keep it tight: 3 or 4 different tubes."],"slots":5,"inputs":[{"id":"chl","label":"Chloroplasts","options":[["F","fresh"],["B","boiled"],["N","none"]]},{"id":"dye","label":"DCPIP","options":[["Y","yes"],["X","no"]]},{"id":"cond","label":"Conditions","options":[["L","light"],["D","dark"]]}],"afterAll":"Each design changes one thing at a time. That’s what makes it a fair test.","explainPrompt":"Explain what each tube in your design proves.","vocab":"Use the words control, variable, electron acceptor and thylakoid.","more":"There’s more than one design. Can you find another?"},"cards":[["Chloroplast envelope","Two membranes, outer and inner, around the chloroplast."],["Stroma","Fluid inside the chloroplast, around the thylakoids; sugar-making enzymes, DNA, ribosomes."],["Thylakoid","A flattened membrane sac; its membrane holds the photosystems."],["Granum","A stack of thylakoids (plural: grana)."],["Thylakoid lumen","The space inside a thylakoid; H⁺ builds up here."],["Chlorophyll structure","Light-absorbing ring with Mg at its centre, plus a hydrocarbon tail that anchors it in the membrane."],["Photosystem","An antenna of hundreds of pigments around a reaction centre."],["Antenna pigments","Absorb photons and pass the \u003cstrong>energy\u003c/strong> toward the reaction centre."],["Reaction centre","A special pair of chlorophyll \u003ci>a\u003c/i> molecules that sends an excited \u003cstrong>electron\u003c/strong> to the primary acceptor."],["Fluorescence","Light given off when absorbed energy can’t be used; isolated chlorophyll glows red."],["Endosymbiosis","Chloroplasts descend from bacteria engulfed by another cell: circular DNA, 70S ribosomes, two membranes."],["Stroma vs stoma","Stroma: chloroplast fluid. Stoma: leaf pore."]]}};</script>
