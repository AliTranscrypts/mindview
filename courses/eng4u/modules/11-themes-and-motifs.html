<script>window.MV_PAYLOAD={"meta":{"id":"11-themes-and-motifs","nn":"11","slug":"themes-and-motifs","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 2","groupName":"Shakespearean Tragedy, Hamlet","trivium":"Logic","size":"M","storageKey":"eng4u-11-themes-and-motifs-v1","progressKey":"eng4u-progress-v1:11-themes-and-motifs","toolkit":"1.0.8"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"8e9c7da5","content":{"id":"11-themes-and-motifs","kind":"topic","title":"Themes and motifs","topic":"Themes & Motifs","readyTopic":"themes and motifs in \u003cem>Hamlet\u003c/em>","hero":{"headline":"One image, again and again, until it means something","text":"Shakespeare plants the same pictures over and over: \u003cstrong>rot\u003c/strong> under the surface, \u003cstrong>poison\u003c/strong> poured into ears, people \u003cstrong>acting\u003c/strong> a part, \u003cstrong>skulls\u003c/strong> in the dirt. Each return is a clue. A \u003cstrong>motif\u003c/strong> is that pattern of returns; a \u003cstrong>theme\u003c/strong> is the claim the pattern lets you make about being human. In this module you’ll track the clues, then turn them into an argument.","fig":{"html":"\u003cdiv class='mt-hero' id='mt-hero'>\u003c/div>","caption":""},"line":"Something is rotten in the state of Denmark.","cite":"(\u003ci>Hamlet\u003c/i> 1.4.90)","aria":"The line “Something is rotten in the state of Denmark.” above a sketched map of Denmark. A brown stain spreads from the word “rotten” across the map. Four phrases surface around it, each tagged with its motif: “unweeded garden” (Disease & decay), “porches of my ears” (Poison & the ear), “smile, and smile” (Acting & seeming) and “quintessence of dust” (Mortality & dust). Threads join them to Acts 1, 1, 1 and 2.","phrases":[{"t":"unweeded garden","m":"dis","act":1},{"t":"porches of my ears","m":"poi","act":1},{"t":"smile, and smile","m":"act","act":1},{"t":"quintessence of dust","m":"mor","act":2}],"caption":"Four threads. Follow one to the end of the play.","listen":"Listen","watch":"Watch again","noVoice":"Read it aloud yourself, slowly, leaning on “rotten”.","act":"Act"},"goals":["I can tell a motif, a symbol and a theme apart, and explain how they work together.","I can track a motif across a play and explain what its pattern and placement suggest.","I can connect a motif to a theme, using it as evidence for a claim.","I can write a thematic statement that is specific and arguable, not a topic, a moral or a summary.","I can explain how the speaker and moment change what a recurring image means.","I can write an analytical paragraph that traces a motif with integrated, correctly cited quotations."],"start":{"blocks":[{"title":"Word story: motif","html":"\u003cp>\u003cstrong>\u003cem>Motif\u003c/em>\u003c/strong> comes to English from French \u003cem>motif\u003c/em>, “motive”, from Latin \u003cem>movere\u003c/em>, “to move”. In music, a motif is a short phrase that returns and develops, like the four notes that open Beethoven’s Fifth. A literary motif \u003cem>moves\u003c/em> through a work in the same way, and it moves the reader toward meaning.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Imagery and figurative language","goal":5,"prompt":"In “Here is your husband; like a mildew’d ear, / Blasting his wholesome brother” (3.4.64–65), what is Claudius compared to?","options":[{"t":"A person with an infected ear","why":"Here “ear” means an ear of grain, as in an ear of corn.","_n":"0316","_k":"b530b2eb"},{"t":"A storm that blasts the countryside","why":"Blasting here means blighting, a plant disease.","_n":"1306","_k":"8e7f10c3"},{"t":"A diseased ear of grain that spoils the healthy crop beside it","why":"Mildew is a crop disease; “blasting” means blighting. Claudius is the rot that killed his brother.","_n":"22f6","_k":"c8e172ba"},{"t":"A brother who protects his family","why":"“Wholesome brother” is old Hamlet; Claudius blights him.","_n":"32e6","_k":"834418c3"}],"hints":["Mildew grows on what?","An “ear” can be part of a wheat stalk.","Claudius is the diseased ear spoiling the healthy one."]},{"id":"w2","skill":"Imagery and figurative language","goal":1,"prompt":"Which line uses a metaphor rather than a literal statement?","options":[{"t":"“’Tis an unweeded garden, / That grows to seed”","why":"Hamlet calls the world a neglected garden: a metaphor for a corrupt world.","_n":"42d6","_k":"15935f26"},{"t":"“Where’s your father?”","why":"A plain question.","_n":"52c6","_k":"f03f1e23"},{"t":"“Alas, poor Yorick! I knew him, Horatio”","why":"This one is literal: he did know Yorick.","_n":"62b6","_k":"8e42a28d"},{"t":"“The point envenom’d too!”","why":"The sword point really is poisoned.","_n":"73a6","_k":"226cb63c"}],"hints":["Which line describes one thing as if it were another?","Is the world really a garden?","The unweeded garden."]},{"id":"w3","skill":"Hamlet’s plot","goal":2,"prompt":"How was old King Hamlet murdered, according to the Ghost?","options":[{"t":"He died in battle against Norway","why":"That’s the backstory of old Fortinbras, the King of Norway, whom old Hamlet killed in single combat.","_n":"8396","_k":"5397724b"},{"t":"He was stabbed through a curtain","why":"That’s Polonius’s death, behind the arras in 3.4.","_n":"9241","_k":"b56d50e9"},{"t":"He was poisoned with a cup of wine","why":"That’s Gertrude’s death in 5.2.","_n":"a251","_k":"07fcb8f4"},{"t":"Claudius poured poison into his ear while he slept in the orchard","why":"The Ghost describes “the leperous distilment” poured into “the porches of my ears”.","_n":"b221","_k":"de694027"}],"hints":["Think of Act 1, scene 5.","The Ghost was sleeping in his orchard.","Poison in the ear."]},{"id":"w4","skill":"Hamlet’s plot","goal":2,"prompt":"What is the purpose of the play-within-the-play in Act 3?","options":[{"t":"To entertain the court after Polonius’s death","why":"Wrong order: Polonius dies after the play.","_n":"c231","_k":"a79d42a8"},{"t":"To announce Hamlet’s engagement to Ophelia","why":"Nothing in the play supports that.","_n":"d281","_k":"9cbf8c48"},{"t":"To warn Gertrude about Laertes","why":"That mixes in later plot: Laertes’s revenge comes in Act 4.","_n":"e291","_k":"33480694"},{"t":"To test Claudius’s guilt by staging a murder like the one the Ghost described","why":"“The play’s the thing / Wherein I’ll catch the conscience of the king.”","_n":"f261","_k":"bb645fe7"}],"hints":["Hamlet says the play will “catch” something.","The conscience of the king.","A test of guilt."]},{"id":"w5","skill":"Analysis vs summary","goal":3,"prompt":"Which sentence analyses rather than summarizes?","options":[{"t":"“Hamlet says the world is like a garden full of weeds.”","why":"That’s paraphrase: it restates the line, and paraphrase is not analysis (module 04).","_n":"g271","_k":"ffac05a0"},{"t":"“The garden quotation is in Act 1, scene 2.”","why":"That gives a location without any interpretation.","_n":"h2c1","_k":"bc42466f"},{"t":"“By calling the world ‘an unweeded garden,’ Hamlet suggests that corruption grows when no one tends it.”","why":"It explains what the image means and how it works.","_n":"i2d1","_k":"37eea8d6"},{"t":"“In Act 1, Hamlet is sad about his father.”","why":"That’s summary: it reports what happens.","_n":"j3e1","_k":"37b3ebd4"}],"hints":["Which sentence answers “so what?”","Look for a verb like “suggests”.","“By calling the world ‘an unweeded garden,’ Hamlet suggests that corruption grows when no one tends it.”"]},{"id":"w6","skill":"MLA citation for drama","goal":6,"prompt":"Which is a correct MLA in-text citation for lines 135 to 137 of Act 1, scene 2 of \u003cem>Hamlet\u003c/em>?","options":[{"t":"(\u003ci>Hamlet\u003c/i> 1.2.135–137)","why":"Title, then act.scene.line.","_n":"k3d1","_k":"e01820f7"},{"t":"(Shakespeare 135)","why":"That’s the prose page format. Plays cite act, scene and line.","_n":"l3c1","_k":"60cda388"},{"t":"(Act 1, Scene 2, page 135)","why":"Plays use act.scene.line, not words and pages.","_n":"m3b1","_k":"9a2c3000"},{"t":"(\u003ci>Hamlet\u003c/i>, 135–137)","why":"The act and scene are missing.","_n":"n3a1","_k":"8a25a18c"}],"hints":["Plays use three numbers.","Act, scene, line, joined by periods.","(\u003ci>Hamlet\u003c/i> 1.2.135–137)."]}],"refreshers":{"Imagery and figurative language":"Imagery appeals to the senses; a figure (metaphor, simile) describes one thing as another. Shakespeare’s “ear” can be an ear of grain. Read the whole image before deciding what it’s literally about.","Hamlet’s plot":"Act 1: the Ghost reveals the murder (poison in the ear). Act 2: Hamlet feigns madness. Act 3: the play tests Claudius; Hamlet kills Polonius. Act 4: Hamlet is sent away; Ophelia’s madness. Act 5: the graveyard, the duel, the deaths.","Analysis vs summary":"Summary says what happens. Analysis says how the language makes meaning, and why it matters.","MLA citation for drama":"(\u003ci>Hamlet\u003c/i> 3.3.36): act, scene, line. Once the title is clear, (3.3.36) is enough."}}},"explore":{"heading":"Motif tracker","intro":"Twenty passages from \u003cem>Hamlet\u003c/em> are spread across the five acts. Tag each with the motif it belongs to, then watch the pattern appear. Then follow one thread from beginning to end.","motifs":[{"id":"dis","t":"Disease & decay","short":"Disease","keys":["disease","rot","rotten","decay","corruption","sick"]},{"id":"poi","t":"Poison & the ear","short":"Poison","keys":["poison","ear","venom","infect"]},{"id":"act","t":"Acting & seeming","short":"Acting","keys":["act","acting","perform","performance","seem","mask","play"]},{"id":"mor","t":"Mortality & dust","short":"Mortality","keys":["death","dust","skull","mortal","grave"]}],"none":"None of these","corpus":[{"id":"C1","act":1,"sc":2,"ref":"1.2.135–137","who":"Hamlet","grp":"hamlet","text":"’Tis an unweeded garden, / That grows to seed; things rank and gross in nature / Possess it merely.","moment":"Alone after the court scene, Hamlet despairs at his mother’s quick remarriage.","aim":"About: the world","why":"a garden gone to seed, overrun by things “rank and gross”: the world as rotting growth.","_a":"Q0dJQQ1GBVxLRxVBVggSWhpfYj5K"},{"id":"C2","act":1,"sc":2,"ref":"1.2.76","who":"Hamlet","grp":"hamlet","text":"Seems, madam! nay, it is; I know not ‘seems.’","moment":"Gertrude asks why his grief “seems” so particular; Hamlet throws the word back.","aim":"Answers: Gertrude","why":"Hamlet sets “seems” against “is”: appearance against reality.","_a":"Q0dJQQ1GAFZMRxVBVggSWhpfYj5K"},{"id":"C3","act":1,"sc":4,"ref":"1.4.90","who":"Marcellus","grp":"others","text":"Something is rotten in the state of Denmark.","moment":"On the battlements, as Hamlet follows the Ghost into the dark.","aim":"About: the state of Denmark","why":"“rotten” is decay at work inside the state.","_a":"Q0dJQQ1GBVxLRxVBVggSWhpfYj5K"},{"id":"C4","act":1,"sc":5,"ref":"1.5.36–38","who":"Ghost","grp":"ghost","text":"so the whole ear of Denmark / Is by a forged process of my death / Rankly abused","moment":"The Ghost tells Hamlet that the official story of his death is a lie.","aim":"Accuses: Claudius’s lie","why":"a false story poured into “the whole ear of Denmark”: poison by hearing.","_a":"Q0dJQQ1GEVpRRxVBVggSWhpfYkFWBxUXZRg="},{"id":"C5","act":1,"sc":5,"ref":"1.5.63–64","who":"Ghost","grp":"ghost","text":"And in the porches of my ears did pour / The leperous distilment","moment":"The Ghost describes his murder in the orchard.","aim":"Accuses: Claudius","why":"literal poison poured into an ear.","_a":"Q0dJQQ1GEVpRRxVBVggSWhpfYkFTDRIXZRg="},{"id":"C6","act":1,"sc":5,"ref":"1.5.108","who":"Hamlet","grp":"hamlet","text":"One may smile, and smile, and be a villain","moment":"Alone after the Ghost leaves, Hamlet writes down what he has learned.","aim":"Accuses: Claudius","why":"a smile worn as a mask over villainy: performance.","_a":"Q0dJQQ1GAFZMRxVBVggSWhpfYj5K"},{"id":"C7","act":1,"sc":5,"ref":"1.5.172","who":"Hamlet","grp":"hamlet","text":"To put an antic disposition on","moment":"Hamlet warns Horatio and Marcellus that he may pretend to be mad.","aim":"About: himself, a planned disguise","why":"he will wear madness like a costume: acting.","_a":"Q0dJQQ1GAFZMRxVBVggSWhpfYj5K"},{"id":"C8","act":2,"sc":2,"ref":"2.2.321","who":"Hamlet","grp":"hamlet","text":"What is this quintessence of dust?","moment":"Hamlet tells Rosencrantz and Guildenstern that he has lost all his mirth.","aim":"About: humankind","why":"the finest of creatures reduced to “dust”: mortality.","_a":"Q0dJQQ1GDFpKRxVBVggSWhpfYj5K"},{"id":"C9","act":2,"sc":2,"ref":"2.2.633–634","who":"Hamlet","grp":"hamlet","text":"The play’s the thing / Wherein I’ll catch the conscience of the king.","moment":"Alone at the end of Act 2, Hamlet plans to test Claudius with a play.","aim":"Aimed at: Claudius","why":"a staged play used as a trap: acting.","_a":"Q0dJQQ1GAFZMRxVBVggSWhpfYj5K"},{"id":"C10","act":3,"sc":2,"ref":"3.2.268","who":"Lucianus (in the play-within-the-play)","grp":"others","text":"Thou mixture rank, of midnight weeds collected","moment":"In \u003cem>The Mousetrap\u003c/em>, the murderer Lucianus readies his poison while Claudius watches.","aim":"Staged for: Claudius, watching","why":"the line describes the poison itself, a brew of midnight weeds.","_a":"Q0dJQQ1GEVpRRxVBVggSWhpfYkFWBxUXZRg="},{"id":"C11","act":3,"sc":2,"ref":"3.2.240","who":"Gertrude","grp":"others","text":"The lady protests too much, methinks.","moment":"Watching the play, Gertrude judges the Player Queen’s vows.","aim":"About: the Player Queen","why":"she judges a performance by how it is acted: seeming.","_a":"Q0dJQQ1GAFZMRxVBVggSWhpfYj5K"},{"id":"C12","act":3,"sc":3,"ref":"3.3.36","who":"Claudius","grp":"claudius","text":"O, my offence is rank, it smells to heaven","moment":"Alone, Claudius tries to pray.","aim":"Confesses: himself","why":"a crime so “rank” it smells: rot, confessed.","_a":"Q0dJQQ1GBVxLRxVBVggSWhpfYj5K"},{"id":"C13","act":3,"sc":3,"ref":"3.3.97–98","who":"Claudius","grp":"claudius","text":"My words fly up, my thoughts remain below: / Words without thoughts never to heaven go.","moment":"Claudius rises from his failed prayer.","aim":"Confesses: himself","why":"words with no inner truth behind them: a performance of prayer.","_a":"Q0dJQQ1GAFZMRxVBVggSWhpfYj5K"},{"id":"C14","act":3,"sc":4,"ref":"3.4.64–65","who":"Hamlet","grp":"hamlet","text":"Here is your husband; like a mildew’d ear, / Blasting his wholesome brother.","moment":"In his mother’s room, Hamlet compares the portraits of the two brothers.","aim":"Accuses: Claudius","why":"mildew blighting a crop: rot (the pun on “ear” also recalls the poison).","_a":"Q0dJQQ1GBVxLRxVBVggSWhpfYkFHCwgXZRg="},{"id":"C15","act":3,"sc":4,"ref":"3.4.147–149","who":"Hamlet","grp":"hamlet","text":"It will but skin and film the ulcerous place, / Whiles rank corruption, mining all within, / Infects unseen.","moment":"Hamlet tells his mother not to soothe her conscience by calling him mad.","aim":"Warns: Gertrude","why":"an ulcer skinned over while corruption spreads beneath: disease.","_a":"Q0dJQQ1GBVxLRxVBVggSWhpfYj5K"},{"id":"C16","act":4,"sc":3,"ref":"4.3.9–11","who":"Claudius","grp":"claudius","text":"Diseases desperate grown / By desperate appliance are relieved, / Or not at all.","moment":"After Polonius’s death, Claudius explains why Hamlet must be sent away at once.","aim":"About: Hamlet","why":"a desperate disease that needs a desperate cure, and the disease is Hamlet.","_a":"Q0dJQQ1GBVxLRxVBVggSWhpfYj5K"},{"id":"C17","act":4,"sc":5,"ref":"4.5.90–91","who":"Claudius","grp":"claudius","text":"And wants not buzzers to infect his ear / With pestilent speeches of his father’s death","moment":"Claudius tells Gertrude that Laertes has come home in secret.","aim":"About: Laertes","why":"rumour poured into Laertes’s ear: words as poison.","_a":"Q0dJQQ1GEVpRRxVBVggSWhpfYkFTDRIXZRg="},{"id":"C18","act":5,"sc":1,"ref":"5.1.202–203","who":"Hamlet","grp":"hamlet","text":"Alas, poor Yorick! I knew him, Horatio","moment":"In the graveyard, Hamlet holds the jester’s skull.","aim":"About: Yorick","why":"a skull dug out of the earth: mortality.","_a":"Q0dJQQ1GDFpKRxVBVggSWhpfYj5K","prose":true},{"id":"C19","act":5,"sc":1,"ref":"5.1.236–237","who":"Hamlet","grp":"hamlet","text":"Imperious Caesar, dead and turn’d to clay, / Might stop a hole to keep the wind away.","moment":"Hamlet traces the dust of great men to humble uses.","aim":"About: every ruler, even Caesar","why":"a great ruler turned to clay: death levels everyone.","_a":"Q0dJQQ1GDFpKRxVBVggSWhpfYj5K"},{"id":"C20","act":5,"sc":2,"ref":"5.2.332","who":"Hamlet","grp":"hamlet","text":"The point envenom’d too! Then, venom, to thy work.","moment":"Hamlet learns the sword is poisoned and turns it on Claudius.","aim":"Accuses: Claudius","why":"poison, finally used for real and in public.","_a":"Q0dJQQ1GEVpRRxVBVggSWhpfYj5K"}],"scenes":[5,2,4,7,2],"modes":[{"id":"tag","t":"Tag"},{"id":"pattern","t":"Pattern"},{"id":"thread","t":"Thread"}],"groups":[{"id":"all","t":"All"},{"id":"hamlet","t":"Hamlet"},{"id":"claudius","t":"Claudius"},{"id":"ghost","t":"Ghost"},{"id":"others","t":"Others"}],"labels":{"strip":"The five acts (tap a passage to open it)","filters":"Filters","act":"Act","who":"Speaker","motif":"Motif","all":"All","untagged":"Untagged","chipsFor":"Tag this passage (choose one or more)","read":"Read it aloud","stop":"Stop","noVoice":"Read it aloud yourself.","close":"Close","check":"Check tags","checkHow":"Compare every tagged card with the key: ✓ matches, ✗ look again.","focus":"Selected motif","key":"Show the key’s counts","keyLocked":"Check your tags in Tag mode to unlock the key’s counts.","bars":"Motif counts per act","timeline":"Placement along the play","speakers":"Speakers of the selected motif","you":"You","keyT":"Key","thread":"Your thread","tray":"Tagged with this motif, not in your thread yet","add":"Add","up":"Move up","down":"Move down","remove":"Remove","link":"How has the image changed?","emptyThread":"Your thread is empty. Add passages from the tray below, in the order you choose.","emptyTray":"Tag passages with this motif in Tag mode, and they appear here.","turn":"What’s the turn?","caseT":"Claudius’s two faces (challenge 3)","caseHow":"Choose one motif, then tap the two passages that prove Claudius uses it about himself and about Hamlet.","caseMotif":"Motif","casePass":"Passages","nomatch":"No passages match the filters in this act."},"readout":{"tagged":"Passages tagged","counts":"Motif counts","busiest":"Busiest act for the selected motif","speakers":"Speakers of the selected motif","thread":"Thread","open":"Open card","none":"none tagged yet"},"aha":"The motifs don’t spread evenly. Acting crowds Acts 1 and 3, where Hamlet plans and stages his test. Disease peaks in Act 3, where guilt surfaces. Mortality waits for Act 5. Poison is told in Act 1, staged in Act 3 and finally poured for real in Act 5. \u003cstrong>Placement is meaning.\u003c/strong>","support":"Mortality images touch on death. If any of this weighs on you, talk to someone you trust or contact Kids Help Phone: \u003cspan class='mt-nw'>1-800-668-6868\u003c/span> or text CONNECT to \u003cspan class='mt-nw'>686868\u003c/span>.","turns":[{"id":"t1","t":"Secret, then staged, then real: the poison moves from a hidden crime (Act 1) to a performance (Act 3) to a public catastrophe (Act 5)","_n":"o391","_k":"28c9fe4e"},{"id":"t2","t":"The poison gets weaker as the play goes on.","fb":"That reverses the pattern: the poison grows from a secret into a public catastrophe.","_n":"p381","_k":"6cc2a23f"},{"id":"t3","t":"Poison appears only in Act 1.","fb":"That misses the later returns in Acts 3, 4 and 5.","_n":"q371","_k":"ac5afc55"},{"id":"t4","t":"The poison is always literal.","fb":"Not always: C4 and C17 are figurative. A lie and a rumour can be poison too.","_n":"r361","_k":"1c21210f"}],"p3":{"swap":"Claudius","before":"Accuses: Claudius","after":"Accuses: himself"},"p4":{"from":"rotten","to":"wrong","broken":"Thread broken at Act 1"},"predIntro":"Make a prediction first. Then the tracker shows you what happens.","predictions":[{"id":"p1","fixedOrder":true,"prompt":"Before you tag anything: in which act do you predict disease and decay images will cluster most?","options":[{"t":"Act 1","_n":"s351","_k":"a94d0719"},{"t":"Act 3","_n":"tb81","_k":"77657a5b"},{"t":"Act 5","_n":"ub91","_k":"67328174"},{"t":"Spread evenly","_n":"vba1","_k":"c4afc013"}],"explain":"Act 3 holds Claudius’s confession (“O, my offence is rank”) and Hamlet’s attack in his mother’s room (“rank corruption, mining all within”). Rot surfaces when guilt does. The key’s bars: Disease has 2 in Act 1, 3 in Act 3 and 1 in Act 4."},{"id":"p2","prompt":"Where do you predict the mortality images sit?","options":[{"t":"Mostly Act 1","_n":"wbb1","_k":"40da7cc1"},{"t":"Mostly late (Act 5)","_n":"xb41","_k":"e52d387b"},{"t":"Only in Act 3","_n":"yb51","_k":"912c886c"},{"t":"Spread evenly","_n":"zb61","_k":"dbeb1e08"}],"explain":"Apart from one musing in Act 2, the skulls wait for the graveyard. The play turns toward death as Hamlet stops performing."},{"id":"p3","prompt":"Imagine Claudius, not Hamlet, said “One may smile, and smile, and be a villain.” What changes?","options":[{"t":"Nothing; an image means the same whoever says it","_n":"10b71","_k":"bacc8b0a"},{"t":"The motif changes from acting to mortality","_n":"11b01","_k":"c9eb11e4"},{"t":"It becomes a confession: the speaker would be describing himself","_n":"12b11","_k":"af10f7d1"},{"t":"It becomes a disease image","_n":"13b21","_k":"76e4d944"}],"explain":"Who speaks decides who is being exposed."},{"id":"p4","prompt":"Replace “rotten” with “wrong” in “Something is rotten in the state of Denmark.” What is lost?","options":[{"t":"Nothing; the meaning is the same","_n":"14b11","_k":"8385f27c"},{"t":"A joke","_n":"15b41","_k":"c8db0a84"},{"t":"The sense of decay spreading from inside, which connects this line to every later rot image","_n":"16b31","_k":"0f056347"},{"t":"The rhyme","_n":"17b61","_k":"2cf64e24"}],"explain":"“Wrong” is a judgment; “rotten” is a process. Rot spreads, and the play keeps showing it spreading. Word choice makes the motif."}],"chalIntro":"Use the tracker to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"\u003cstrong>Tag all 20 passages correctly.\u003c/strong> Some passages carry two motifs: a listed second tag is never marked wrong. \u003cbutton type='button' class='btn ghost sm mt-setup' data-setup='tc1'>Set it up\u003c/button>","msgs":{"untagged":"Tag every passage first: {n} still have no tag.","C14":"The pun on “ear” is sharp, and you can keep that tag. But the image is mildew blighting a crop: rot. Add Disease & decay.","C13":"Claudius mentions heaven, but the image is words with no inner truth behind them: performance. Try Acting & seeming.","C16":"No poison here. Claudius talks about a desperate disease needing a desperate cure. Who is the disease? (Hint: Hamlet.)","C10":"It’s inside the play-within-the-play, so acting fits as a second tag. But the line describes the poison itself.","none":"Every passage here belongs to at least one motif. Read it aloud and listen for rot, poison, acting or death."},"general":"{n} card(s) don’t match the key yet. Press \u003cstrong>Check tags\u003c/strong> to see which ones to look at again.","why":"All twenty match: six disease images, five poison, six acting and three mortality, with any listed second tags.","hints":["Ask what the image is made of: rot, poison, performance or death?","Some passages carry two motifs. Tag the main one first.","\u003cspan class='mt-h3'>The first card that doesn’t match yet, with its primary tag and the reason.\u003c/span>"]},{"id":"tc2","goal":[2,5],"prompt":"\u003cstrong>Build the thread for Poison & the ear, in play order, then choose the turn it takes.\u003c/strong> \u003cbutton type='button' class='btn ghost sm mt-setup' data-setup='tc2'>Set it up\u003c/button>","_a":"Y0d6VxVIQ3YNRxVBdFVRFxRHelIARk0Xe1cJQWo=","msgs":{"C17":"Check Act 4. Claudius fears “buzzers” infecting Laertes’s ear with rumour, so words can be poison too.","C10":"The Mousetrap play stages the poisoning: Act 3.","extra":"{ids}: the main image there isn’t poison, so leave it out of this thread. Keep the five passages whose main image is poison.","order":"Arrange them as the play does: act, then scene.","missing":"Your thread is missing a poison passage. Five passages: two in Act 1, one each in Acts 3, 4 and 5.","noTurn":"Your thread is right. Now choose the turn it takes, under the thread."},"general":"Not yet. Build the Poison & the ear thread in Thread mode.","why":"C4, C5, C10, C17, C20: the poison is told, then acted, then poured for real.","hints":["Filter by the motif, then sort by act.","Five passages: two in Act 1, one each in Acts 3, 4 and 5.","C4, C5, C10, C17, C20. The poison is told, then acted, then poured for real."]},{"id":"tc3","goal":[2,5],"stretch":true,"prompt":"\u003cstrong>Find the motif that Claudius uses \u003cem>both\u003c/em> about himself \u003cem>and\u003c/em> about Hamlet.\u003c/strong> Choose the motif and the two passages that prove it. \u003cbutton type='button' class='btn ghost sm mt-setup' data-setup='tc3'>Set it up\u003c/button>","_a":"Q0dUQQ1GBVxLRxVBXgASFwI+GyAGVkMZGiYIVRU5HA==","msgs":{"choose":"Choose a motif and exactly two passages first.","act":"Claudius does use performance language about himself (C13), but never about Hamlet in this set.","poi":"C17 is about Laertes, not Hamlet.","hamlet":"Those are Hamlet’s lines. Find the ones Claudius speaks."},"general":"Not yet. Find one passage where Claudius speaks about himself and one where he speaks about Hamlet, in the same motif.","banner":"Claudius knows his own rot (“it smells to heaven”) but treats Hamlet as the disease. The same motif, turned outward. That’s the kind of observation an essay is built on.","why":"Claudius knows his own rot (“it smells to heaven”) but treats Hamlet as the disease. The same motif, turned outward. That’s the kind of observation an essay is built on.","hints":["Filter by speaker: Claudius. Which motifs does he use?","He confesses his offence in 3.3. In 4.3 he talks about a “disease” he plans to cure.","C12 (his own “rank” offence) and C16 (Hamlet as a desperate disease)."]}],"blocks":[{"title":"The motif corpus, in full","html":"\u003cp class='tiny muted'>The twenty passages, with act, scene and line. The wording and line numbers follow the Globe edition of Shakespeare (Clark and Wright, 1864), which is in the public domain; line numbers in your class edition may differ by a few lines.\u003c/p>\u003cdiv id='mt-full'>\u003c/div>"}]},"part3":{"slug":"statement","name":"Statement","heading":"From topic to thematic statement","intro":"The tracker gives you evidence. Now turn evidence into a \u003cstrong>claim\u003c/strong>: a thematic statement that is specific and arguable, not a topic, a moral or a summary.","s1":{"title":"Station 1: four kinds of sentence","how":"Tap each card to see what kind of sentence it is.","cards":[{"t":"“Revenge in \u003cem>Hamlet\u003c/em>.”","kind":"Topic","fb":"A subject with no claim: it names what the play is about, not what it says."},{"t":"“People should never seek revenge.”","kind":"Moral","fb":"Advice to the reader: it tells people what to do."},{"t":"“Hamlet takes revenge on Claudius in the final scene.”","kind":"Summary","fb":"It reports what happens in the plot."},{"t":"“\u003cem>Hamlet\u003c/em> suggests that revenge corrupts the avenger as surely as the crime it answers.”","kind":"Thematic statement","fb":"A specific, arguable claim about what the play suggests about people."}]},"s2":{"title":"Station 2: the forge","how":"Choose a topic and a verb, finish the sentence, then attach at least two passages from the corpus as evidence.","topics":["revenge","corruption","appearance and reality","mortality","action and thought"],"verbs":["suggests","warns","questions","reveals"],"topicL":"Topic","verbL":"Verb","textL":"that …","textPh":"e.g. a hidden crime poisons every relationship around it","ask":"Ask yourself: what does the play suggest about {topic}?","evL":"Evidence tray (attach at least two)","flags":{"short":"This reads as a topic. Say something \u003cem>about\u003c/em> it.","command":"That’s advice. A theme observes; it doesn’t instruct.","broad":"That’s very broad. Can the play really prove it about everyone? Narrow it.","noEv":"Which passages make you think so? Attach two.","ok":"No flags: a specific claim, with two passages behind it."},"commands":["don’t","don't","do not","never","always","be","do","you should"],"broad":["always","all people","everyone"]},"s3":{"title":"Station 3: test it against the thread","how":"Your statement sits above a thread from Explore. Mark each passage.","prompt":"Does every passage in your thread support, complicate or contradict your statement?","marks":[{"id":"S","t":"S · supports"},{"id":"C","t":"C · complicates"},{"id":"X","t":"X · contradicts"}],"revise":"Revise the statement so it can hold the contradiction, or choose different evidence.","holds":"Your statement holds the whole thread. Complications are welcome: they make an essay interesting.","noStatement":"Write your statement in Station 2 first.","useEv":"No thread for this motif yet, so you’re testing the passages you attached in Station 2.","noPass":"Build a thread in Explore (Thread mode) or attach passages in Station 2 first.","threadL":"Thread to test"},"blocks":[{"title":"Craft → meaning","html":"\u003cp>A motif is a pattern of \u003cem>what\u003c/em>; a theme is an argument about \u003cem>why\u003c/em>. You need both: the motif keeps the theme honest, and the theme keeps the motif from being a list.\u003c/p>"}],"quickCheck":{"title":"Statement quick check","summary":"Statement quick check","intro":"What kind of sentence is each one?","items":[{"id":"q1","goal":4,"prompt":"“Appearance versus reality in \u003cem>Hamlet\u003c/em>.”","choices":[{"t":"Topic","fb":"Right. A subject, with no claim yet.","_n":"18b51","_k":"4f87cf2f"},{"t":"Moral","fb":"No claim yet: what does the play suggest about appearance and reality?","_n":"19b81","_k":"28aeab64"},{"t":"Summary","fb":"No claim yet: what does the play suggest about appearance and reality?","_n":"1ab71","_k":"43a1eae3"},{"t":"Thematic statement","fb":"No claim yet: what does the play suggest about appearance and reality?","_n":"1baa1","_k":"b7f60fb3"}]},{"id":"q2","goal":4,"prompt":"“Always tell the truth, even to your family.”","choices":[{"t":"Topic","fb":"It instructs the reader. A theme describes what the play explores.","_n":"1ca91","_k":"d3a0d51a"},{"t":"Moral","fb":"Right. It instructs the reader; a theme describes what the play explores.","_n":"1dac1","_k":"c012ab50"},{"t":"Summary","fb":"It instructs the reader. A theme describes what the play explores.","_n":"1ead1","_k":"66f31715"},{"t":"Thematic statement","fb":"It instructs the reader. A theme describes what the play explores.","_n":"1faa1","_k":"6ccdd70f"}]},{"id":"q3","goal":4,"prompt":"“Hamlet pretends to be mad to investigate his father’s death.”","choices":[{"t":"Topic","fb":"It reports events. What do those events suggest?","_n":"1gab1","_k":"5299b785"},{"t":"Moral","fb":"It reports events. What do those events suggest?","_n":"1ha81","_k":"d9989e44"},{"t":"Summary","fb":"Right. It reports events. The next step: what do those events suggest?","_n":"1ia91","_k":"8ce20ab3"},{"t":"Thematic statement","fb":"It reports events. What do those events suggest?","_n":"1ja61","_k":"679b6e6c"}]},{"id":"q4","goal":4,"prompt":"“\u003cem>Hamlet\u003c/em> suggests that in a court full of performers, even sincere grief can look like madness.”","choices":[{"t":"Topic","fb":"It’s specific, arguable and about human experience: a thematic statement.","_n":"1ka71","_k":"3d7db100"},{"t":"Moral","fb":"It’s specific, arguable and about human experience: a thematic statement.","_n":"1lb41","_k":"447d9aed"},{"t":"Summary","fb":"It’s specific, arguable and about human experience: a thematic statement.","_n":"1mb51","_k":"f8b2e2b9"},{"t":"Thematic statement","fb":"Right. It’s specific, arguable and about human experience.","_n":"1na60","_k":"4086f9b8"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“My words fly up, my thoughts remain below: / Words without thoughts never to heaven go.”\u003c/p>\u003cp class='eng-cite'>(\u003ci>Hamlet\u003c/i> 3.3.97–98)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> a balanced pair (“my words … my thoughts”), a colon, then a rhyming line that turns the pair into a rule.\u003c/p>\u003cp>\u003cstrong>Frame:\u003c/strong> “My ______ fly up, my ______ remain below: / ______ without ______ never ______.”\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “My plans run fast, my courage lingers slow: / Plans without courage never leave the shore.”\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"My words fly up, my thoughts remain below: / Words without thoughts never to heaven go.","source":"Hamlet 3.3.97–98","save":"Save it to my commonplace book"}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Motif, symbol, theme or topic?","summary":"Motif, symbol, theme or topic?","goal":[1,4],"txt":true,"noun":"item","instruction":"Sort each item into the right box. Trivium: Logic.","boxes":[{"id":"motif","label":"Motif","sub":"a recurring element"},{"id":"symbol","label":"Symbol","sub":"one object standing for an idea"},{"id":"theme","label":"Theme","sub":"a statement about life"},{"id":"topic","label":"Topic","sub":"a subject, not yet a claim"}],"wrongDefault":"Claims are sentences. Patterns repeat. Symbols are single objects.","items":[{"id":"i1","goal":1,"t":"Repeated images of rot, mildew and disease","_a":"GghWF14CQw==","why":"Rot, mildew and disease return again and again: a recurring pattern of images.","wrong":{"theme":"It’s the pattern, not the claim."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Motif: rot, mildew and disease keep returning, so it’s a pattern."]},{"id":"i2","goal":1,"t":"Yorick’s skull","_a":"GhZADlULDRc=","why":"One object standing for death’s equality.","wrong":{"motif":"It’s one object standing for death’s equality; it belongs \u003cem>to\u003c/em> the mortality motif."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Symbol: one object (a skull) standing for death’s equality."]},{"id":"i3","goal":4,"t":"“\u003cem>Hamlet\u003c/em> suggests that certainty may be impossible in a world of performers.”","_a":"GhFRBloBQw==","why":"A full sentence making an arguable claim about life.","wrong":{"topic":"It makes a claim; topics don’t."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Theme: a sentence that makes a claim about certainty and performers."]},{"id":"i4","goal":4,"t":"Appearance versus reality","_a":"GhFWE14HQw==","why":"A subject the play explores, but no claim yet.","wrong":{"theme":"A subject, not a statement."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Topic: it names a subject but says nothing about it."]},{"id":"i5","goal":1,"t":"Repeated references to ears, listening and rumour","_a":"GghWF14CQw==","why":"Ears, listening and rumour recur in many forms.","wrong":{"symbol":"It recurs in many forms; that makes it a motif."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Motif: ears, listening and rumour come back in many forms."]},{"id":"i6","goal":1,"t":"Mortality","_a":"GhFWE14HQw==","why":"One word naming a subject. The skulls and dust are the motif.","wrong":{"motif":"The \u003cem>images\u003c/em> of skulls and dust are the motif; “mortality” alone is a topic."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Topic: “mortality” alone is a subject, not a pattern of images."]},{"id":"i7","goal":1,"t":"The rosemary Ophelia hands out “for remembrance”","_a":"GhZADlULDRc=","why":"One object (rosemary) standing for an idea (remembrance).","wrong":{"theme":"An object that stands for an idea."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Symbol: one object, rosemary, standing for remembrance."]},{"id":"i8","goal":1,"t":"Repeated acting, plays, masks and pretending","_a":"GghWF14CQw==","why":"Acting, plays, masks and pretending keep returning.","wrong":{"topic":"It names recurring elements in the text."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Motif: acting, plays, masks and pretending keep coming back."]},{"id":"i9","goal":4,"t":"“\u003cem>Hamlet\u003c/em> suggests that delay can be a form of conscience, not only cowardice.”","_a":"GhFRBloBQw==","why":"An arguable claim about delay and conscience, written as a statement.","wrong":{"topic":"It doesn’t tell the reader what to do: it’s a claim about life.","motif":"It doesn’t tell the reader what to do: it’s a claim about life.","symbol":"It doesn’t tell the reader what to do: it’s a claim about life."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Theme: a sentence that makes a claim about delay and conscience."]},{"id":"i10","goal":4,"t":"Corruption","_a":"GhFWE14HQw==","why":"One word, no claim: a topic.","wrong":{"theme":"One word is never a theme."},"hints":["Is it a thing, a pattern, a subject or a claim?","Claims are sentences. Patterns repeat. Symbols are single objects.","Topic: a single word names a subject, never a claim."]}]},{"id":"blood","type":"custom","title":"Unseen pattern: \u003cem>Macbeth\u003c/em>’s blood","summary":"Unseen pattern","star":true,"goal":[2,3,5],"instruction":"Read five passages from \u003cem>Macbeth\u003c/em> (public domain, Globe edition), then follow the motif through them. Trivium: Logic. B2 to B6 are ★ non-routine; B5 and B6 sit above Final Check level.","passages":[{"k":"a","text":"Will all great Neptune’s ocean wash this blood / Clean from my hand?","ref":"2.2.60–61","who":"Macbeth"},{"k":"b","text":"A little water clears us of this deed","ref":"2.2.67","who":"Lady Macbeth"},{"k":"c","text":"It will have blood; they say, blood will have blood","ref":"3.4.122","who":"Macbeth"},{"k":"d","text":"Out, damned spot! out, I say!","ref":"5.1.39","who":"Lady Macbeth"},{"k":"e","text":"Here’s the smell of the blood still: all the perfumes of Arabia will not sweeten this little hand.","ref":"5.1.56–58","who":"Lady Macbeth"}],"passagesTitle":"The passages","items":[{"id":"b1","goal":2,"prompt":"\u003cstrong>B1.\u003c/strong> What motif links all five passages?","options":[{"t":"Perfume","why":"Water and perfume are the cures they try; blood is what returns.","_n":"1oa50","_k":"9ad7310d"},{"t":"Water and the sea","why":"Water and perfume are the cures they try; blood is what returns.","_n":"1pa40","_k":"7b9b29bb"},{"t":"Hands and gloves","why":"There are hands, but no gloves; what returns on the hands is blood.","_n":"1qa30","_k":"5c9f0939"},{"t":"Blood and washing","why":"Blood returns in every passage, and so do the attempts to wash it away.","_n":"1raa0","_k":"e022b74b"}],"hints":["What do all five passages share?","Water and perfume are what they use to clean.","Blood and washing: the blood keeps returning."]},{"id":"b2","goal":5,"star":true,"prompt":"\u003cstrong>B2 ★.\u003c/strong> Compare (b) and (d). What has changed for Lady Macbeth?","options":[{"t":"She now blames Macbeth","why":"In (d) she speaks to the stain, not to Macbeth.","_n":"1sa90","_k":"6bce3acd"},{"t":"Nothing; she says the same thing twice","why":"“A little water” in Act 2; “Out, damned spot” in Act 5: the motif reverses.","_n":"1ta80","_k":"6b9e8bd3"},{"t":"She has become cleaner","why":"The opposite: she can’t get the spot out.","_n":"1ua70","_k":"4f2dfed1"},{"t":"Her certainty that guilt washes off has collapsed into a stain she can’t remove","why":"Confidence in Act 2 collapses into a stain she can’t remove in Act 5.","_n":"1vae0","_k":"86384e83"}],"hints":["Note which act each line is in.","In (b) she sounds sure. In (d) she…","Confidence → collapse: the motif reverses."]},{"id":"b3","goal":2,"star":true,"prompt":"\u003cstrong>B3 ★.\u003c/strong> Which pairing shows the motif’s placement best?","options":[{"t":"(a)/(b) right after the murder; (d)/(e) in the sleepwalking scene","why":"Two clusters: fresh guilt, then guilt breaking through sleep.","_n":"1wad0","_k":"b505d867"},{"t":"Only in battle scenes","why":"None is a battle scene: the murder’s aftermath, a banquet, a sleepwalk.","_n":"1x200","_k":"9d5a0af2"},{"t":"Evenly in every scene","why":"The blood clusters where guilt is fresh, and returns where guilt breaks through sleep.","_n":"1y210","_k":"a732bc36"},{"t":"All in Act 1","why":"None of them is in Act 1: check the citations.","_n":"1z220","_k":"f6a1e4ca"}],"hints":["Note the act and scene of each passage.","Two passages come right after the murder (2.2); two come in Act 5, scene 1.","(a)/(b) right after the murder; (d)/(e) in the sleepwalking scene."]},{"id":"b4","goal":3,"star":true,"prompt":"\u003cstrong>B4 ★.\u003c/strong> Which passage supports the claim “guilt cannot be washed away” most directly?","options":[{"t":"(e)","why":"“All the perfumes of Arabia will not sweeten this little hand”: nothing can clean it.","_n":"20230","_k":"7903d7f7"},{"t":"none","why":"(e) says it directly: no perfume can sweeten the hand.","_n":"21240","_k":"9fce6266"},{"t":"(c)","why":"(c) says blood calls for more blood: violence breeds violence, which isn’t about washing guilt away.","_n":"22250","_k":"3317e700"},{"t":"(b)","why":"(b) claims the opposite, and the play proves it wrong.","_n":"23260","_k":"e2f6b3be"}],"hints":["Which passage says nothing can clean the hand?","Look for “will not”.","(e): “all the perfumes of Arabia will not sweeten this little hand.”"]},{"id":"b5","goal":3,"star":true,"prompt":"\u003cstrong>B5 ★.\u003c/strong> Choose the best thematic statement for this motif.","options":[{"t":"“Blood is in \u003cem>Macbeth\u003c/em>.”","why":"A topic: it names a subject but makes no claim.","_n":"24270","_k":"a6286ea4"},{"t":"“Lady Macbeth sleepwalks in Act 5.”","why":"A summary: it reports an event.","_n":"25280","_k":"3ce071b6"},{"t":"“\u003cem>Macbeth\u003c/em> suggests that guilt, once spilled, stains the mind more permanently than any hand.”","why":"Specific, arguable and about human experience.","_n":"26290","_k":"70703f9b"},{"t":"“Never commit murder.”","why":"A moral: it instructs the reader.","_n":"27ba3","_k":"63610c44"}],"hints":["Which option is a claim about human experience?","Rule out the topic, the moral and the summary.","“\u003cem>Macbeth\u003c/em> suggests that guilt, once spilled, stains the mind more permanently than any hand.”"]}],"write":{"id":"b6","goal":[3,6],"prompt":"\u003cstrong>B6 ★.\u003c/strong> Write one sentence linking (b) and (e) with a correct citation for either.","label":"Your sentence","check":"Check my sentence","cites":["2.2.67","5.1.56–58","5.1.57–58","5.1.56–57","5.1.56","5.1.57","5.1.58"],"tips":{"cite":"Add a citation right after your quotation: (2.2.67) for (b) or (5.1.56–58) for (e).","quote":"Put at least one quotation in quotation marks.","verb":"Use an analysis verb from the bank to say what the change means: suggests, implies, undercuts, juxtaposes, foreshadows, reframes, intensifies, complicates."},"ok":"Your sentence has a quotation, a correct citation and an analysis verb.","modelL":"One way it can be done","model":"Lady Macbeth’s confident claim that “A little water clears us of this deed” (2.2.67) curdles into the despair of “all the perfumes of Arabia will not sweeten this little hand” (5.1.57–58), suggesting that guilt outlasts every attempt to clean it.","hints":["Quote a few words, not the whole line.","Follow the quotation with (act.scene.line).","Use a verb like “suggests” or “undercuts” to say what the change means."]},"verbs":["suggests","implies","undercuts","juxtaposes","foreshadows","reframes","intensifies","complicates"]},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Marguerite","goal":[2,4,5],"instruction":"Marguerite made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Disease imagery","steps":["In \u003cem>Hamlet\u003c/em>, images of disease trace how one hidden crime spreads through Denmark.","Early on, Marcellus senses that “Something is rotten in the state of Denmark” (1.4.90).","Disease imagery appears six times in the play, which proves it is the most important motif.","Later, Hamlet warns that “rank corruption, mining all within, / Infects unseen” (3.4.148–149).","The rot moves from rumour to confession."],"_a":"Cg==","stepFb":["A clear claim. Keep reading.","Correctly quoted and cited.","","This sentence is fine; the problem came earlier.","This sentence is fine; the problem came earlier."],"fixes":[{"t":"Sentence 3 is fine.","why":"Frequency shows a pattern exists, not what it means.","_n":"28b93","_k":"50a1ca13"},{"t":"“Disease imagery appears more than any other motif.”","why":"Still just counting, and the count isn’t even true in this set: acting ties it.","_n":"29bc3","_k":"b9c4dc38"},{"t":"“The disease images gather in Act 3, in Claudius’s prayer and the closet scene, suggesting that hidden corruption eventually breaks into the open.”","why":"It reads the placement, not just the count.","_n":"2abb3","_k":"4ef75e6e"},{"t":"“Shakespeare uses a lot of disease imagery in many scenes.”","why":"Vaguer, and still no meaning.","_n":"2bb63","_k":"d43d3cc6"}],"hints":["Does sentence 3 interpret, or just count?","What does the placement of these images suggest?","Sentence 3. Replace it with: “The disease images gather in Act 3, in Claudius’s prayer and the closet scene, suggesting that hidden corruption eventually breaks into the open.”"]},{"id":"e2","goal":4,"task":"Theme","steps":["\u003cem>Hamlet\u003c/em> is about revenge.","Hamlet promises the Ghost to avenge his murder.","He delays, testing Claudius with a play.","By the end, almost everyone is dead."],"_a":"CA==","stepFb":["","Accurate summary, but the paragraph has no claim yet.","This sentence is fine; the problem came earlier.","This sentence is fine; the problem came earlier."],"fixes":[{"t":"“\u003cem>Hamlet\u003c/em> teaches that revenge is wrong.”","why":"A moral. The play explores more than it preaches.","_n":"2cb53","_k":"576d1fac"},{"t":"“\u003cem>Hamlet\u003c/em> is about the theme of revenge.”","why":"Still a topic: “the theme of revenge” says nothing about revenge.","_n":"2db83","_k":"1051e10e"},{"t":"Sentence 1 is fine; it’s short and clear.","why":"Clear, but not arguable.","_n":"2eb73","_k":"3aa84ca8"},{"t":"“\u003cem>Hamlet\u003c/em> suggests that revenge corrupts the avenger as surely as the crime it answers.”","why":"Now there is a claim someone could argue with.","_n":"2fb23","_k":"c30432f9"}],"hints":["Could anyone disagree with sentence 1?","A theme says something about revenge.","Sentence 1. Replace it with: “\u003cem>Hamlet\u003c/em> suggests that revenge corrupts the avenger as surely as the crime it answers.”"]},{"id":"e3","goal":5,"task":"Speaker","steps":["Images of rot follow Claudius through the play.","Alone at prayer, Claudius admits, “O, my offence is rank, it smells to heaven” (3.3.36).","Like Hamlet’s accusations, this line attacks the king’s corruption from outside.","Hamlet’s “mildew’d ear” (3.4.64) makes the same point.","So the rot is always someone else’s view of Claudius."],"_a":"Cg==","stepFb":["Fair claim.","Correct quotation and citation.","","This sentence builds on the mistake; the problem came earlier.","This sentence builds on the mistake; the problem came earlier."],"fixes":[{"t":"Sentence 3 is fine.","why":"Who is speaking? The king is accusing himself.","_n":"2gb13","_k":"d4fb8064"},{"t":"“This line is about Claudius’s actual illness.”","why":"Claudius isn’t describing an illness. The rot is moral: corruption that spreads from the throne.","_n":"2h342","_k":"6fcec9d6"},{"t":"“Unlike Hamlet’s accusations, this image comes from Claudius himself, so the rot is confessed from the inside.”","why":"Who speaks changes the meaning: here the king accuses himself.","_n":"2i352","_k":"b6886ac1"},{"t":"“This line is spoken by Hamlet.”","why":"Check the speaker: Claudius, alone.","_n":"2j322","_k":"23f5499e"}],"hints":["Who says the line in sentence 2?","Is he attacking someone, or confessing?","Sentence 3. Replace it with: “Unlike Hamlet’s accusations, this image comes from Claudius himself, so the rot is confessed from the inside.”"]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which placement surprised you most: acting crowding Act 3, mortality waiting for Act 5, or poison returning at the end? Why do you think Shakespeare placed it there?"},{"id":"j2","q":"In your own words, what is the difference between a motif and a theme? Use one example from \u003cem>Hamlet\u003c/em>."},{"id":"j3","q":"Explain to a friend how you’d turn the topic “revenge” into a thematic statement, step by step."},{"id":"j4","q":"Which motif would you choose for your own essay, and what do you still need to find out about it?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from today that you’d like to remember. Why that line? (Optional.)\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write a craft principle you now believe about patterns in writing. Then give a master’s example from today’s passages, and your own imitation. Keep it short enough to remember.","placeholder":"e.g. Plant an image early, and readers will watch for it to return.","examples":["Something is rotten in the state of Denmark. (\u003ci>Hamlet\u003c/i> 1.4.90)","Whiles rank corruption, mining all within, / Infects unseen. (\u003ci>Hamlet\u003c/i> 3.4.148–149)","O, my offence is rank, it smells to heaven (\u003ci>Hamlet\u003c/i> 3.3.36)","One may smile, and smile, and be a villain (\u003ci>Hamlet\u003c/i> 1.5.108)","My words fly up, my thoughts remain below: / Words without thoughts never to heaven go. (\u003ci>Hamlet\u003c/i> 3.3.97–98)","Imperious Caesar, dead and turn’d to clay, / Might stop a hole to keep the wind away. (\u003ci>Hamlet\u003c/i> 5.1.236–237)"]},"artSamples":[{"p":"A motif is a promise: plant an image early, and readers will watch for it to return changed.","m":"“Something is rotten in the state of Denmark” (\u003ci>Hamlet\u003c/i> 1.4.90) → “rank corruption, mining all within” (\u003ci>Hamlet\u003c/i> 3.4.148–149)"},{"p":"Let the speaker colour the image: the same rot means guilt from Claudius and accusation from Hamlet.","m":"“O, my offence is rank” (\u003ci>Hamlet\u003c/i> 3.3.36) and “a mildew’d ear” (\u003ci>Hamlet\u003c/i> 3.4.64)"}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which best defines a motif?","options":[{"t":"The central message of a work","why":"That’s a theme.","_n":"2k332","_k":"5d9ce4ee"},{"t":"A recurring element (an image, word, object or action) that a work keeps returning to","why":"Recurrence is the key.","_n":"2l382","_k":"b97c0b81"},{"t":"The main conflict of the plot","why":"Conflict drives plot; a motif recurs.","_n":"2m392","_k":"cf6624d6"},{"t":"A single object that stands for one idea","why":"That’s a symbol.","_n":"2n362","_k":"a61fcf76"}]},"b":{"prompt":"Which of these is a motif in \u003cem>Hamlet\u003c/em>?","options":[{"t":"“Revenge corrupts the avenger.”","why":"A thematic statement.","_n":"2o372","_k":"50a6a746"},{"t":"Hamlet’s decision to stage a play","why":"A single plot event.","_n":"2p2c2","_k":"fac78502"},{"t":"The play’s division into five acts","why":"Structure, not a recurring element.","_n":"2q2d2","_k":"723c9668"},{"t":"Repeated images of rot and disease","why":"A pattern of returning images.","_n":"2rfb8","_k":"c1e494d0"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which is a thematic statement?","options":[{"t":"\u003cem>Hamlet\u003c/em> suggests that performance can reveal truths that plain honesty cannot.","why":"Specific, arguable, about human experience.","_n":"2sfc8","_k":"17cfd51c"},{"t":"Hamlet stages a play to test Claudius.","why":"A summary.","_n":"2tf98","_k":"846e70ce"},{"t":"Always tell the truth.","why":"A moral.","_n":"2ufa8","_k":"5f9c7393"},{"t":"Revenge.","why":"A topic.","_n":"2vf78","_k":"f117fd02"}]},"b":{"prompt":"Which is a thematic statement?","options":[{"t":"Grief and madness.","why":"Topics.","_n":"2wf88","_k":"c1f6b3d8"},{"t":"Ophelia goes mad after her father dies.","why":"A summary.","_n":"2xf58","_k":"7f16f62e"},{"t":"\u003cem>Hamlet\u003c/em> suggests that grief, left unspoken, curdles into suspicion.","why":"Specific, arguable, about human experience.","_n":"2yf68","_k":"0f9fe653"},{"t":"Never trust your uncle.","why":"A moral, and a narrow one.","_n":"2z038","_k":"4b1fa66c"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"Which passage belongs to the poison-and-ear motif?","options":[{"t":"“Seems, madam! nay, it is”","why":"Acting and seeming.","_n":"30048","_k":"19b5fb56"},{"t":"“Frailty, thy name is woman!”","why":"An outburst about Gertrude, not one of the four motifs.","_n":"31018","_k":"0d47657a"},{"t":"“Alas, poor Yorick!”","why":"Mortality.","_n":"32008","_k":"5ad1f1b0"},{"t":"“And in the porches of my ears did pour / The leperous distilment”","why":"Literal poison poured into an ear.","_n":"33038","_k":"92f40bdd"}]},"b":{"prompt":"Which passage belongs to the acting-and-seeming motif?","options":[{"t":"“One may smile, and smile, and be a villain”","why":"A smile as a mask.","_n":"34028","_k":"a67f4267"},{"t":"“Something is rotten in the state of Denmark.”","why":"Disease and decay.","_n":"35058","_k":"df22cd3a"},{"t":"“Imperious Caesar, dead and turn’d to clay”","why":"Mortality.","_n":"36048","_k":"b9b29590"},{"t":"“Then, venom, to thy work.”","why":"Poison.","_n":"37078","_k":"f34f172a"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Acting-and-seeming images cluster in Acts 1 and 3 and are absent from Act 5, where mortality images take over. Which interpretation does this pattern best support?","options":[{"t":"Shakespeare ran out of acting images.","why":"Speculation about the author, not a reading.","_n":"38068","_k":"ba6ea5bc"},{"t":"Hamlet forgets about Claudius in Act 5.","why":"Unsupported: he kills Claudius in Act 5.","_n":"39f98","_k":"ea4ec41c"},{"t":"Hamlet moves from staging and testing appearances toward facing death, which no performance can change.","why":"The acting thins out as death takes over: the pattern tracks Hamlet’s change.","_n":"3af88","_k":"1f8a7f22"},{"t":"Mortality matters more than acting in every act.","why":"False for Act 1, which has no mortality images.","_n":"3b6f8","_k":"26ac105c"}]},"b":{"prompt":"Poison images appear in Act 1 (described), Act 3 (staged in a play) and Act 5 (used for real). Which interpretation does this pattern best support?","options":[{"t":"The poison is a different substance each time.","why":"Irrelevant to the pattern.","_n":"3c708","_k":"193631dc"},{"t":"The pattern shows Hamlet is a chemist.","why":"Literal and unsupported.","_n":"3d718","_k":"79a01566"},{"t":"The crime is told, then shown, then repeated: a secret poison becomes a public catastrophe.","why":"Told, staged, then done: the poison moves from secret to public.","_n":"3e728","_k":"634c323f"},{"t":"Poison matters only in Act 5.","why":"The earlier returns set up the ending.","_n":"3f738","_k":"a3add1b2"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Claudius says “Diseases desperate grown / By desperate appliance are relieved” (4.3.9–10) about Hamlet. What does the speaker add to the disease motif?","options":[{"t":"Claudius is literally sick.","why":"Claudius isn’t describing an illness. The rot is moral: corruption that spreads from the throne.","_n":"3g748","_k":"ebbaefcc"},{"t":"Claudius turns the image outward: Hamlet becomes the illness to be cut out, while Claudius’s own “rank” offence goes untreated.","why":"Same motif, turned outward: the speaker decides who is the disease.","_n":"3h758","_k":"9a9c3c39"},{"t":"Claudius is confessing his own guilt.","why":"That’s 3.3, not this line.","_n":"3i768","_k":"bdac443c"},{"t":"Who speaks doesn’t matter for a motif.","why":"The same image means something different from Hamlet’s mouth than from Claudius’s. Ask who is speaking, and about whom.","_n":"3j778","_k":"5df9c06a"}]},"b":{"prompt":"Hamlet calls Claudius “a mildew’d ear, / Blasting his wholesome brother” (3.4.64–65). What does the speaker add?","options":[{"t":"Hamlet makes Claudius the blight that killed a healthy plant, and the pun on “ear” links the rot to the poison poured in his father’s ear.","why":"Hamlet’s accusation joins two motifs in one image.","_n":"3k788","_k":"11c82fff"},{"t":"Claudius speaks this line about himself.","why":"Check the speaker: Hamlet, in his mother’s room.","_n":"3lf58","_k":"58f94319"},{"t":"Hamlet is praising Claudius’s farming.","why":"A literal misreading.","_n":"3mf48","_k":"319f8bb5"},{"t":"Hamlet means Claudius has an ear infection.","why":"A literal reading: the ear is an ear of grain, and the rot is moral.","_n":"3nf38","_k":"f5ac189d"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"In \u003cem>Romeo and Juliet\u003c/em>: “O, she doth teach the torches to burn bright!” (1.5.46); “It is the east, and Juliet is the sun.” (2.2.3); “Take him and cut him out in little stars” (3.2.22). Which statement best connects this motif to a theme?","options":[{"t":"Light appears once, so it isn’t a motif.","why":"Three returns across three acts.","_n":"3of28","_k":"8624ad41"},{"t":"Romeo is afraid of the dark.","why":"Unsupported.","_n":"3pf98","_k":"3da25c31"},{"t":"Light shining against darkness suggests a love that is dazzling but brief, burning brightest just before night falls.","why":"Light against dark, again and again: a love as bright as it is brief.","_n":"3qf88","_k":"548e4a52"},{"t":"The play is about astronomy.","why":"A literal reading.","_n":"3rf78","_k":"8cf47e4d"}]},"b":{"prompt":"In \u003cem>Macbeth\u003c/em>: “Macbeth does murder sleep” (2.2.36); “Sleep that knits up the ravell’d sleave of care” (2.2.37); and in Act 5, Lady Macbeth walks and talks in her sleep. Which statement best connects this motif to a theme?","options":[{"t":"\u003cem>Macbeth\u003c/em> suggests that guilt destroys the peace of rest: the murderers can no longer escape themselves even in sleep.","why":"Sleep keeps returning as the thing guilt destroys.","_n":"3sf68","_k":"db57f0a6"},{"t":"Sleep is a topic in \u003cem>Macbeth\u003c/em>.","why":"A topic, not a connection to a theme.","_n":"3tfd8","_k":"70e96150"},{"t":"Macbeth needs more sleep.","why":"A literal reading.","_n":"3ufc8","_k":"77387f2a"},{"t":"Sleep appears only in Act 2.","why":"It returns in Act 5.","_n":"3v739","_k":"08df3585"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which sentence best integrates and cites a quotation?","options":[{"t":"“O, my offence is rank, it smells to heaven.” This shows Claudius is guilty.","why":"A dropped quotation with no citation or analysis.","_n":"3w749","_k":"00b68207"},{"t":"Claudius confesses that his offence “is rank, it smells to heaven” (\u003ci>Hamlet\u003c/i> 3.3.36), turning rot from Hamlet’s accusation into the king’s own admission.","why":"Signal phrase, embedded quotation, correct citation, then analysis.","_n":"3x719","_k":"dc4af162"},{"t":"Claudius says his offence is rank (Act 3, Scene 3, page 36).","why":"MLA uses act.scene.line, not pages.","_n":"3y729","_k":"57a2e9c3"},{"t":"In 3.3, Claudius prays and talks about his offence.","why":"A summary; no quotation.","_n":"3z779","_k":"6f8742bd"}]},"b":{"prompt":"Which sentence best integrates and cites a quotation?","options":[{"t":"The Ghost explains his murder in Act 1.","why":"A summary.","_n":"40789","_k":"33bae2f5"},{"t":"The Ghost says poison went in his ears (Shakespeare 63).","why":"Prose format; plays use act.scene.line.","_n":"41759","_k":"75fbe069"},{"t":"“And in the porches of my ears did pour.” The Ghost talks about ears.","why":"Dropped quotation; no citation; thin analysis.","_n":"42769","_k":"1102bea5"},{"t":"The Ghost reveals that poison entered through “the porches of my ears” (\u003ci>Hamlet\u003c/i> 1.5.63), a detail that makes listening itself dangerous in Denmark.","why":"Integrated, cited, and it says what the detail does.","_n":"437b9","_k":"150241d7"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which revision best improves this weak statement: “\u003cem>Hamlet\u003c/em> is about appearance versus reality”?","options":[{"t":"\u003cem>Hamlet\u003c/em> teaches that people should always be honest.","why":"A moral: a theme observes; it doesn’t instruct.","_n":"447c9","_k":"34e6a722"},{"t":"In \u003cem>Hamlet\u003c/em>, appearance and reality are very important.","why":"Vague; no claim about them.","_n":"45799","_k":"67c02009"},{"t":"\u003cem>Hamlet\u003c/em> is about the theme of appearance versus reality in Denmark.","why":"Still a topic.","_n":"46789","_k":"2a0bcc33"},{"t":"\u003cem>Hamlet\u003c/em> suggests that when everyone performs, even honest grief can look like madness.","why":"A specific, arguable claim about appearance and reality.","_n":"477b9","_k":"35588a93"}]},"b":{"prompt":"Which revision best improves “\u003cem>Hamlet\u003c/em> is about death”?","options":[{"t":"\u003cem>Hamlet\u003c/em> teaches us not to fear death.","why":"A moral: a theme observes; it doesn’t instruct.","_n":"487a9","_k":"3b8d6ef8"},{"t":"Many characters die in \u003cem>Hamlet\u003c/em>.","why":"A summary.","_n":"49759","_k":"25245021"},{"t":"\u003cem>Hamlet\u003c/em> is about the theme of death and dying.","why":"Still a topic.","_n":"4a749","_k":"d7fdfa1c"},{"t":"\u003cem>Hamlet\u003c/em> suggests that facing death’s equality (king and jester alike become dust) frees Hamlet to act.","why":"Specific and arguable: it says what facing death does.","_n":"4b779","_k":"7058179b"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A designer wants a poster image for a new production that captures the poison-and-ear motif. Which concept fits the text best?","options":[{"t":"A sword wrapped in a red ribbon","why":"Generic violence; no ear, no poison.","_n":"4c769","_k":"628f02b0"},{"t":"A crown resting on a giant ear, with a dark drop sliding into it","why":"It joins power (the crown) to poison in the ear.","_n":"4d819","_k":"add3040e"},{"t":"A theatre mask cracked in half","why":"Acting and seeming.","_n":"4e809","_k":"32b0dd29"},{"t":"A skull lit from below","why":"Mortality, not poison.","_n":"4f078","_k":"3b7bb5f2"}]},"b":{"prompt":"Which poster concept best captures the acting-and-seeming motif?","options":[{"t":"A goblet of poisoned wine","why":"Poison.","_n":"4g088","_k":"a0ad1524"},{"t":"A gravedigger’s spade","why":"Mortality.","_n":"4h098","_k":"8618abd2"},{"t":"A smiling mask held in front of a scowling face","why":"“One may smile, and smile, and be a villain.”","_n":"4i0a8","_k":"98616bb0"},{"t":"An overgrown garden","why":"Disease and decay.","_n":"4j038","_k":"ffcfeaca"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"Which evidence plan best supports the claim “In \u003cem>Hamlet\u003c/em>, poison spreads from secret to public”?","options":[{"t":"Three quotations from Act 1","why":"No spread to show.","_n":"4k048","_k":"c62c5e64"},{"t":"Yorick’s skull, the unweeded garden and the antic disposition","why":"Wrong motifs.","_n":"4l058","_k":"4cfeadba"},{"t":"Only the final scene, because it has the most poison","why":"No development: a count isn’t a pattern.","_n":"4m068","_k":"15dc9520"},{"t":"The Ghost’s account (1.5), then the Mousetrap play (3.2), then the poisoned sword and cup (5.2)","why":"Three stages across the play.","_n":"4nff8","_k":"c23a3fda"}]},"b":{"prompt":"Which evidence plan best supports the claim “The disease motif shifts from Hamlet’s accusations to Claudius’s own words”?","options":[{"t":"Four passages spoken by Hamlet","why":"Doesn’t show the shift.","_n":"4o008","_k":"27876b44"},{"t":"The poisoned cup and the envenomed sword","why":"Poison, not disease.","_n":"4p8d9","_k":"be8df5b4"},{"t":"“Something is rotten” and nothing else","why":"One passage can’t show a shift.","_n":"4q8c9","_k":"e65c792e"},{"t":"The unweeded garden (1.2) and the mildewed ear (3.4) from Hamlet; then “O, my offence is rank” (3.3) and “Diseases desperate grown” (4.3) from Claudius","why":"Hamlet’s accusations, then Claudius’s own words: the plan can show the shift.","_n":"4r8b9","_k":"a77d57b3"}]}}]},"task":{"title":"Performance task: Follow the thread","summary":"Follow the thread","statement":"\u003cp>Choose one motif. Trace it across at least two acts of \u003cem>Hamlet\u003c/em> in an analytical paragraph that ends with a thematic statement.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg mt-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge (motif accuracy)\u003c/td>\u003ctd>Motif misidentified, or evidence off-motif\u003c/td>\u003ctd>Motif mostly accurate\u003c/td>\u003ctd>Accurate motif, apt evidence\u003c/td>\u003ctd>Precise, well-chosen evidence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking (insight into the pattern)\u003c/td>\u003ctd>Lists passages; no pattern\u003c/td>\u003ctd>Notes change but doesn’t explain it\u003c/td>\u003ctd>Explains the change between passages\u003c/td>\u003ctd>Insight into placement and speaker\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication (integration, citation, clarity)\u003c/td>\u003ctd>Dropped quotations; citation errors\u003c/td>\u003ctd>Some integration; some errors\u003c/td>\u003ctd>Smooth integration; correct citations\u003c/td>\u003ctd>Elegant integration; flawless citation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application (thematic statement)\u003c/td>\u003ctd>Topic or moral\u003c/td>\u003ctd>A statement, but vague\u003c/td>\u003ctd>Specific, arguable statement\u003c/td>\u003ctd>Statement that illuminates the whole play\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Your claim names your motif","Evidence from two different acts","Analysis after each quotation","Ends with a thematic statement","Length (110–240 words)"],"tips":["Name your motif in the first sentence so your reader knows which thread you’re following.","Choose passages from two different acts; the change between them is your argument.","After each quotation, say what the words \u003cem>do\u003c/em>. Try “suggests”, “intensifies”, “reframes”.","End with what the pattern suggests about people, not advice and not a topic.","Too short: add analysis. Too long: cut summary."],"explainPrompt":"Craft statement: Which passage did you choose to end your evidence with, and why that one? What did you cut, and why?","explainLabel":"Craft statement","vocab":"Use the words motif, placement, speaker and thematic statement.","checkLabel":"Check my paragraph","success":"Your paragraph has every part.","more":"Try another motif: each complete paragraph joins your list.","min":110,"max":240,"verbs":["suggests","implies","undercuts","juxtaposes","foreshadows","reframes","intensifies","complicates"],"linkVerbs":["suggests","shows","reveals","implies","warns","questions","explores"],"commands":["don’t","don't","never","always","be","do","you should"],"labels":{"motif":"Motif","claim":"Claim","claimHow":"Name your motif and what its pattern does.","ev":"Evidence","evHow":"Introduce a quotation, quote it exactly, then cite it: (1.5.63–64).","an":"Analysis","anHow":"At least 20 words: what do the words do? Use an analysis verb.","opt":"optional","link":"Link: your thematic statement","linkHow":"At least 8 words, with suggests, shows, reveals, implies, warns, questions or explores.","picker":"Quote picker","pickHow":"Choose a passage, tap the words you want (Shift+tap for a range), then add them to an evidence slot with their citation.","pickSel":"Passage","pickNone":"Choose a passage…","addTo":"Add to evidence","pv":"Your paragraph","words":"words","draft":"Save as a draft","drafts":"Saved drafts","cmp":"Compare draft {n} with now","bank":"Analysis verbs: suggests, implies, undercuts, juxtaposes, foreshadows, reframes, intensifies, complicates."},"modelsLabel":"One way it can be done (three models, three approaches)","models":[{"title":"Poison & the ear: words as poison","m":"poi","text":"In \u003cem>Hamlet\u003c/em>, poison travels through the ear, and the play gradually reveals that words can be as lethal as any vial. The Ghost first describes the literal crime: Claudius poured “the leperous distilment” into “the porches of my ears” (1.5.63–64). Yet even here the image widens, since “the whole ear of Denmark” has been “Rankly abused” by a lie (1.5.36–38), which suggests that the whole kingdom has been poisoned by a story. By Act 4, Claudius himself fears “buzzers” who “infect” Laertes’s “ear / With pestilent speeches” (4.5.90–91); the poison has become rumour, and the murderer now dreads the weapon he invented. \u003cem>Hamlet\u003c/em> suggests that a lie, once poured into a community, keeps spreading long after the first victim dies."},{"title":"Disease & decay: rot moves inward","m":"dis","text":"Disease imagery in \u003cem>Hamlet\u003c/em> charts how corruption moves from something sensed to something confessed. In Act 1, Marcellus only senses that “Something is rotten in the state of Denmark” (1.4.90), and the word “rotten” implies decay working unseen beneath a healthy surface. In Act 3 the rot finds a voice: alone at prayer, Claudius admits that “my offence is rank, it smells to heaven” (3.3.36). The smell that was once a rumour is now a confession, and the confession reframes every earlier image, because the source of the rot was the throne itself. Hamlet’s warning that “rank corruption, mining all within, / Infects unseen” (3.4.148–149) intensifies the point: hiding the disease only lets it spread. \u003cem>Hamlet\u003c/em> suggests that corruption at the top cannot be contained; it spreads until it reaches everyone beneath it."},{"title":"Acting & seeming: performance as the path to truth","m":"act","text":"\u003cem>Hamlet\u003c/em> is crowded with performances, and the acting motif suggests a paradox: in a court of liars, only a performance can expose the truth. At first Hamlet rejects acting completely, insisting “I know not ‘seems’” (1.2.76), as if sincerity were enough. By the end of Act 1 he chooses to “put an antic disposition on” (1.5.172), adopting the disguise he once scorned. In Act 2 he goes further and turns acting into a weapon: “The play’s the thing / Wherein I’ll catch the conscience of the king” (2.2.633–634). The progression implies that Hamlet learns to fight Claudius’s mask with masks of his own. Even Gertrude, watching the Player Queen, judges by performance: “The lady protests too much, methinks” (3.2.240), as if overacting were the surest sign of a lie. \u003cem>Hamlet\u003c/em> questions whether honesty can survive among performers without learning to perform."}],"rubric":[["Knowledge (motif accuracy)","Motif misidentified, or evidence off-motif","Motif mostly accurate","Accurate motif, apt evidence","Precise, well-chosen evidence"],["Thinking (insight into the pattern)","Lists passages; no pattern","Notes change but doesn’t explain it","Explains the change between passages","Insight into placement and speaker"],["Communication (integration, citation, clarity)","Dropped quotations; citation errors","Some integration; some errors","Smooth integration; correct citations","Elegant integration; flawless citation"],["Application (thematic statement)","Topic or moral","A statement, but vague","Specific, arguable statement","Statement that illuminates the whole play"]]},"cards":[["Motif","A recurring image, word, object or action. In \u003cem>Hamlet\u003c/em>: rot, poison in the ear, acting, skulls."],["Theme","What a work suggests about human life, as a statement."],["Thematic statement","Specific and arguable: “\u003cem>Hamlet\u003c/em> suggests that a hidden crime poisons every relationship around it.”"],["Topic vs theme","“Revenge” is a topic; “revenge corrupts the avenger” is a theme."],["Moral vs theme","“Don’t seek revenge” instructs; a theme observes."],["Symbol","One object standing for an idea: Yorick’s skull for death’s equality."],["Pattern and placement","Where a motif clusters (which act, which moment) is part of its meaning."],["Speaker matters","Claudius’s “O, my offence is rank” (3.3.36) confesses; Hamlet’s rot images accuse."],["Disease & decay","“Something is rotten in the state of Denmark.” (1.4.90)"],["Poison & the ear","“And in the porches of my ears did pour / The leperous distilment” (1.5.63–64)"],["Acting & seeming","“One may smile, and smile, and be a villain” (1.5.108)"],["Mortality & dust","“Imperious Caesar, dead and turn’d to clay, / Might stop a hole to keep the wind away.” (5.1.236–237)"]]}};</script>
