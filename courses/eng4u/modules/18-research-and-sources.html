doi.org/”.","datef":"MLA writes the day first and abbreviates the month: 14 Mar. 2022.","up":"MLA abbreviates University Press as UP.","edcap":"Mid-entry it’s lower case: edited by.","aiTitle":"For an AI prompt, describe the prompt in quotation marks, then the word “prompt”, in plain type.","order":"Core elements in MLA order: Author. Title of source. Title of container, Other contributors, Version, Number, Publisher, Publication date, Location.","general":"Put the elements in MLA order, choose each form, and set the punctuation: a period after the author and the title, commas inside the container, a period at the end."}},"predIntro":"Make a prediction first. Then the evaluator shows you what happens.","predictions":[{"id":"p1","prompt":"\u003cem>Evaluate mode, S2 (total 2).\u003c/em> Suppose \u003cem>QuickLit Notes\u003c/em> added a named author with a PhD, but still cited nothing and was reviewed by no one. What happens to its verdict?","options":[{"t":"It becomes “Background only”","_n":"od02","_k":"e02a3f29"},{"t":"It stays “Don’t use as evidence”: authority rises from 0 to 2, but the total is only 4","_n":"pcd2","_k":"fe6b887c"},{"t":"It becomes “Cite” because the author is an expert","_n":"qce2","_k":"bf330cd7"},{"t":"Nothing changes, because authority doesn’t count","_n":"rdb2","_k":"45626cda"}],"explain":"Credentials help, but a source still has to show its evidence and be checked."},{"id":"p2","prompt":"\u003cem>Notes mode, with a draft paraphrase prefilled:\u003c/em> “Nick’s narration doesn’t just tell Gatsby’s story; it cleans it. By arranging events out of order and dwelling on moments of beauty, Nick asks the reader to admire…” Three words were swapped. What will the overlap check find?","options":[{"t":"Several shared 4-word sequences, such as “by arranging events out” and “events out of order”: patchwriting","_n":"sdc2","_k":"d947bbdd"},{"t":"Overlap only in the quotation marks","_n":"td92","_k":"a677f2b3"},{"t":"One overlap at most","_n":"ud82","_k":"890372db"},{"t":"No overlap: the words were changed","_n":"vdb2","_k":"844b8bd6"}],"explain":"Swapped synonyms in the source’s sentence shape are still the source’s sentence."},{"id":"p3","prompt":"\u003cem>Cite mode, the S3 entry built.\u003c/em> Delete the author “Ng, Ricky.” What becomes the first element?","options":[{"t":"The date","_n":"wda2","_k":"8906b0dc"},{"t":"The website name, in italics","_n":"xdd2","_k":"ea2c70f6"},{"t":"The title, in quotation marks: “Why Nick Carraway Is a Liar.”","_n":"ydc2","_k":"5371e3cb"},{"t":"“Anonymous.”","_n":"zdf2","_k":"8959ee0e"}],"explain":"With no author, MLA begins with the title, and alphabetizes it by its first significant word."},{"id":"p4","prompt":"\u003cem>Evaluate mode, S5.\u003c/em> Ask TextPal, “What are your sources?” What do you predict?","options":[{"t":"The novel’s page numbers","_n":"10de2","_k":"98fbc504"},{"t":"A confident list that includes an article the library index can’t find","_n":"11d12","_k":"9ad4bbca"},{"t":"A refusal to answer","_n":"12d02","_k":"61a7440f"},{"t":"Accurate links to peer-reviewed articles","_n":"13df2","_k":"4cc5865c"}],"explain":"Chatbots can produce plausible but invented sources. Verify everything before you trust it."}],"chalIntro":"Use the evaluator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Give all six sources a verdict: Cite, Background only, or Don’t use as evidence. \u003cbutton type=\"button\" class=\"btn ghost sm rs-setup\" data-setup=\"tc1\">Set it up\u003c/button>","why":"Each verdict follows the evidence: totals by the rule, and the chatbot never counts as evidence.","hints":["Check each profile’s total against the verdict rule.","AI answers are always “Don’t use as evidence”.","Cite: S1, S6. Background: S3, S4. Don’t use: S2, S5."]},{"id":"tc2","goal":2,"prompt":"Write an honest paraphrase of the Okafor passage. It keeps K1, K2 and K3, shares \u003cstrong>no\u003c/strong> 4-word sequence with the source, has a signal phrase naming Okafor and the citation (120), and is 25–70 words. \u003cbutton type=\"button\" class=\"btn ghost sm rs-setup\" data-setup=\"tc2\">Set it up\u003c/button>","why":"Okafor’s idea in your own words and structure, credited twice over: by name and by page.","hints":["Read the passage, then hide it (the \u003cstrong>Hide source\u003c/strong> button).","Explain the idea aloud as if to a friend, then write that.","Start “According to Okafor, …” and end with (120). A model: “According to Okafor, Nick shapes Gatsby’s story rather than merely telling it: by reordering events and dwelling on beautiful moments, he steers readers toward an admiration that hides his own unresolved judgement (120).”"]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Catch the fabrications. In TextPal’s answer, mark each quotation and each reference as Verified or Unverified, using the check tools. \u003cbutton type=\"button\" class=\"btn ghost sm rs-setup\" data-setup=\"tc3\">Set it up\u003c/button>","why":"You just did what scholars do: never trust a quotation you haven’t seen in the original.","hints":["Search the novel for an exact phrase from each quotation.","Search the library index for the article title.","Two inventions, one real line."]}]},"part3":{"slug":"critics","name":"Critics","heading":"Using critics without hiding behind them","intro":"Explore taught you to judge and cite sources; this part teaches you to \u003cem>use\u003c/em> them. Let other voices strengthen your argument without taking it over.","moves":[{"id":"agree","t":"agree and extend"},{"id":"comp","t":"complicate"},{"id":"push","t":"push back"},{"id":"hide","t":"hiding"},{"id":"bg","t":"background only"}],"st1":[{"id":"m1","s":"Okafor rightly argues that Nick “launders” Gatsby’s story (120); the same laundering shapes how Nick describes Daisy.","_a":"ElBQEFdTRg==","why":"She’s right, and the writer carries her idea somewhere new: to Daisy."},{"id":"m2","s":"While Okafor shows how Nick flatters Gatsby (120), chapter 6, where Nick plainly exposes Gatsby’s invented past, suggests the laundering is never complete.","_a":"ElJYD0IU","why":"“While” accepts part of her claim; chapter 6 adds a limit."},{"id":"m3","s":"Okafor overlooks the final chapter, where Gatsby’s belief in “the green light” (Fitzgerald 180) belongs to Gatsby, not Nick, and so the ending honours the dreamer as much as the narrator.","_a":"EkFCEVoU","why":"“Overlooks” signals disagreement, and the novel supplies the evidence."},{"id":"m4","s":"Okafor says Nick “launders” the story (120). Lindqvist says dreams are “like loans that come due” (87).","_a":"ElleBlcU","why":"Two quotations, no claim: the writer has vanished. Whose argument is this paragraph? Start with your claim, then bring the critic in."},{"id":"m5","s":"The 1920s saw rapid economic growth and new consumer habits (“Jazz Age”).","_a":"ElNQQA==","why":"Context from the encyclopedia, not an argument about the novel."}],"st1Wrong":"Look at what the sentence does with the critic: does it build on her, limit her, oppose her, only repeat her, or just set the scene?","critics":[{"id":"oka","name":"Okafor","t":"Adaeze Okafor (S1): Nick’s narration “launders” Gatsby’s story (120)."},{"id":"lin","name":"Lindqvist","t":"Marta Lindqvist (S6): dreams in 1920s novels are “like loans that come due” (87)."},{"id":"bel","name":"Bélanger","t":"Thomas Bélanger: ash and gold are “twin currencies” in the novel (52)."}],"frames":{"agree":"[Critic] rightly argues that … (page); the same … also …","comp":"While [critic] shows … (page), chapter … suggests …","push":"[Critic] overlooks …, where … (Fitzgerald page), so …"},"hinges":["while","however","overlooks","extends","extend","like","although","though","rightly","but","yet","complicates","agree","agrees","same","also","whereas"],"policies":[{"id":"none","t":"No AI"},{"id":"brain","t":"Brainstorming with disclosure"},{"id":"edit","t":"Editing help with disclosure"}],"policyText":{"none":"No AI tools for any part of the ISU.","brain":"AI may be used to brainstorm topics or questions. Disclose every use. Every sentence you submit is your own.","edit":"AI may point out errors in your own writing (spelling, punctuation, grammar). Disclose every use. You make the fixes; the ideas and sentences stay yours."},"rule":"Never submit AI-written sentences as your own.","aiCite":"“Explain the symbolism of the green light in \u003cem>The Great Gatsby\u003c/em>” prompt. \u003cem>TextPal\u003c/em>, 2 Feb. version, Brightline Labs, 5 Feb. 2026, textpal.example.","judges":[{"id":"ok","t":"OK as is"},{"id":"disc","t":"OK with disclosure and citation"},{"id":"not","t":"Not OK"}],"scenarios":[{"id":"a1","policy":"none","t":"Jordan asks TextPal to summarize chapter 5 instead of rereading it, then builds notes from the summary.","_a":"El9YFhA=","why":"The policy allows no AI at all, and a secondhand summary can drift from the novel. Reread the chapter."},{"id":"a2","policy":"brain","t":"Priya asks TextPal for a list of possible ISU topics, picks one, and starts researching it.","_a":"ElVeEVEU","why":"Brainstorming is allowed here, but only with disclosure. Note the use as the policy asks."},{"id":"a3","policy":"edit","t":"Ravi pastes his paragraph into TextPal and accepts its rewritten version of every sentence.","_a":"El9YFhA=","why":"Rewriting isn’t editing help: those are AI-written sentences, not his."},{"id":"a4","policy":"none","t":"Chen finds Okafor’s article in the school library database and cites it in his Works Cited.","_a":"El5cQA==","why":"No AI was used, and a library database is a research tool. Cite the article as usual."},{"id":"a5","policy":"brain","t":"Dana asks TextPal to write her thesis statement and submits it unchanged.","_a":"El9YFhA=","why":"Brainstorming doesn’t cover writing the thesis. That sentence is AI-written."},{"id":"a6","policy":"edit","t":"Amir asks TextPal to point out comma splices in his own paragraph, then fixes them himself.","_a":"ElVeEVEU","why":"Editing help is allowed here with disclosure: note the use. The ideas and sentences remain his."}],"quickCheck":{"title":"Using critics quick check","summary":"Using critics quick check","items":[{"id":"q1","goal":5,"prompt":"Which sentence keeps the student in charge?","choices":[{"t":"A summary of a critic’s whole article","fb":"Your claim leads; critics join the conversation.","_n":"14e02","_k":"3f80fa6e"},{"t":"Two critics’ quotations back to back","fb":"Your claim leads; critics join the conversation.","_n":"15e12","_k":"64fde5ea"},{"t":"A critic’s quotation first, with no claim","fb":"Your claim leads; critics join the conversation.","_n":"16e22","_k":"8c9c71a2"},{"t":"My claim first, then the critic as support","fb":"Right. Your claim leads; critics join the conversation.","_n":"17db2","_k":"402d1f7f"}]},{"id":"q2","goal":5,"prompt":"“While Okafor shows X, chapter 6 suggests Y” is which move?","choices":[{"t":"push back completely","fb":"It accepts part of her claim and adds a limit.","_n":"18dc2","_k":"ea73ceea"},{"t":"complicate","fb":"Right. It accepts part of her claim and adds a limit.","_n":"19dd2","_k":"de58454f"},{"t":"background","fb":"It accepts part of her claim and adds a limit.","_n":"1ade2","_k":"08973719"},{"t":"agree and extend","fb":"It accepts part of her claim and adds a limit.","_n":"1bd72","_k":"6b5476d4"}]},{"id":"q3","goal":6,"prompt":"Your teacher allows AI for brainstorming \u003cem>with disclosure\u003c/em>. You used TextPal to list possible topics. What do you do?","choices":[{"t":"Nothing; it was only ideas","fb":"Follow the policy exactly; disclosure is part of integrity.","_n":"1cd82","_k":"72a148d2"},{"t":"Delete the history","fb":"Follow the policy exactly; disclosure is part of integrity.","_n":"1de53","_k":"068060e4"},{"t":"Disclose it as the policy asks","fb":"Right. Follow the policy exactly; disclosure is part of integrity.","_n":"1ee43","_k":"d1ff9e6b"},{"t":"Cite TextPal as evidence","fb":"Follow the policy exactly; disclosure is part of integrity.","_n":"1fe33","_k":"000b4254"}]},{"id":"q4","goal":4,"prompt":"Where should every quotation of the novel come from?","choices":[{"t":"A study guide","fb":"Primary evidence comes from the primary source.","_n":"1ge23","_k":"d6566158"},{"t":"A chatbot","fb":"Primary evidence comes from the primary source.","_n":"1he13","_k":"47eb065c"},{"t":"A critic’s article","fb":"Primary evidence comes from the primary source.","_n":"1ie03","_k":"d46322c8"},{"t":"Your copy of the novel","fb":"Right. Primary evidence comes from the primary source.","_n":"1jdf3","_k":"1e600331"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class=\"steal-line\">“Knowledge is of two kinds. We know a subject ourselves, or we know where we can find information upon it.”\u003c/p>\u003cp class=\"eng-cite\">Samuel Johnson, in Boswell’s \u003cem>Life of Johnson\u003c/em> (1791)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> a short definition sentence (“X is of two kinds.”) followed by a balanced either/or that names both kinds.\u003c/p>\u003cp>\u003cstrong>Model imitation (original):\u003c/strong> “Reading is of two kinds. We listen to a book, or we argue with it.”\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> write your own two sentences in Johnson’s shape. Then save it to your commonplace book.\u003c/p>","prompt":"Your imitation (“… is of two kinds. We …, or we ….”):"}]},"practice":{"activities":[{"id":"notes","type":"custom","title":"Quotation, paraphrase or summary?","summary":"Quotation, paraphrase or summary?","goal":[2,3],"instruction":"For each note, choose its type, then whether it’s correctly cited. The notes use Okafor (S1, pp. 115–38, the passage on p. 120), Lindqvist (S6) and the novel.","how":"Choose a type and a citation verdict for a note, then press Check.","types":[{"id":"quotation","t":"Quotation"},{"id":"paraphrase","t":"Paraphrase"},{"id":"summary","t":"Summary"},{"id":"patch","t":"Patchwriting"},{"id":"common","t":"Common knowledge"}],"cites":[{"id":"yes","t":"Correctly cited"},{"id":"missing","t":"Missing its citation"},{"id":"other","t":"Cited, but something else needs fixing"},{"id":"none","t":"No citation needed"}],"h1":"Exact words in quotation marks? Restated? Shortened?","h2":"Is it too close to the source?","items":[{"id":"n1","goal":2,"t":"Okafor argues that Nick’s narration “launders” Gatsby’s story (120).","_a":"axNGF11CBUFZXllAHhQdUEMTag==","why":"An embedded quotation: one exact word in quotation marks, a signal phrase and the page."},{"id":"n2","goal":2,"t":"Okafor claims Nick reshapes the story so readers admire what he can’t judge.","_a":"axNHA0BXFF1CUEQHEBpGWFlCRAtcUUZo","why":"A paraphrase, but it’s missing (120). The idea is borrowed even when the words are yours, so cite it."},{"id":"n3","goal":2,"t":"Okafor’s article reads Nick as a narrator who protects his own image by protecting Gatsby’s (115–38).","_a":"axNEF19bBUdJExtAS1MXF20=","why":"The whole article’s main point, much shorter, cited with its page range."},{"id":"n4","goal":3,"t":"“By arranging events out of order and lingering on moments of beauty” (Okafor 120).","_a":"axNGF11CBUFZXllAHhQLQVhURUBv","why":"Correctly cited, but it’s a fragment: it needs a signal phrase and your own sentence around it."},{"id":"n5","goal":2,"t":"Nick arranges events out of order and lingers on beautiful moments (Okafor 120).","_a":"axNHA0ZVDBccE1gWWlMWF20=","why":"Cited, but too close to the source. Same shape, new words is still the source’s sentence. Close the source, then write the idea your way."},{"id":"n6","goal":2,"t":"Lindqvist reads 1920s novels as stories of debt, in which dreams must be repaid (87).","_a":"axNHA0BXFF1CUEQHEBpGTFVCFT8=","why":"Her idea in new words and structure, with the page."},{"id":"n7","goal":3,"t":"The novel ends: “So we beat on, boats against the current, borne back ceaselessly into the past” (Fitzgerald 180).","_a":"axNGF11CBUFZXllAHhQdUEMTag==","why":"Exact words, a signal phrase, and the citation after the closing quotation mark."},{"id":"n8","goal":3,"t":"The 1920s were a time of rapid change.","_a":"axNUDV9bC1sSHRUMXVgBF20=","why":"Widely known facts that can be found in many general sources need no citation."}],"fbType":{"quotation":"Are these the source’s exact words in quotation marks?","paraphrase":"A paraphrase restates one idea in your own words and structure.","summary":"A summary shrinks a whole argument to its main point.","patch":"Patchwriting keeps the source’s sentence shape with a few words swapped.","common":"Common knowledge is a widely known fact, not someone’s idea."},"fbSpecial":{"n5|paraphrase":"Check the overlap: “arranging events out of order” is the source’s own phrase.","n8|cite":"Widely known facts that can be found in many general sources need no citation, but any specific claim does."},"fbCite":{"yes":"Look again at the citation, and at how the borrowed words sit in the sentence.","missing":"Is there really no citation? Look at the end of the note.","other":"Is anything wrong besides the citation?","none":"Is this a widely known fact, or someone’s idea? The idea is borrowed even when the words are yours, so cite it."}},{"id":"cases","type":"mc","title":"Integrity cases","summary":"Integrity cases","star":true,"goal":[4,6],"instruction":"Six scenarios. Choose the best judgement and fix. Cases I3–I6 (★) sit above Final Check level.","how":"Choose the best judgement, then press Check.","items":[{"id":"i1","goal":4,"prompt":"\u003cstrong>I1.\u003c/strong> Taylor quotes the novel’s last line from \u003cem>QuickLit Notes\u003c/em>, which says “endlessly”.","options":[{"t":"Misquotation: check your copy, which says “ceaselessly”, and quote the novel","why":"The primary source is the authority on its own words.","_n":"1kde3","_k":"6caa31e3"},{"t":"Replace “endlessly” with a synonym of her own","why":"Quotations must be exact; check the novel.","_n":"1ldd3","_k":"b3113722"},{"t":"Fine, if Taylor adds the website’s URL","why":"A fuller citation of a wrong quotation is still a wrong quotation.","_n":"1mdc3","_k":"d12d51c8"},{"t":"Fine, it’s cited","why":"Citing a wrong quotation doesn’t fix it. Check every quotation against your copy of the novel. Secondhand quotations drift, and AI ones can be invented.","_n":"1n4b3","_k":"0c4af69e"}],"hints":["Where should a quotation of the novel come from?","Your copy of the novel.","The novel says “ceaselessly”: quote it from your copy."]},{"id":"i2","goal":6,"prompt":"\u003cstrong>I2.\u003c/strong> Kim summarizes Okafor’s whole argument in her own words, with no citation, because “it’s a summary”.","options":[{"t":"Plagiarism of ideas: add (Okafor 115–38) or a signal phrase","why":"The idea is Okafor’s; credit it.","_n":"1o4c3","_k":"a6573679"},{"t":"Fine, because the words are all Kim’s","why":"The idea is borrowed even when the words are yours, so cite it.","_n":"1p493","_k":"17da08bb"},{"t":"Summaries are fine without citations","why":"The idea is borrowed even when the words are yours, so cite it.","_n":"1q4a3","_k":"3701723a"},{"t":"Kim should quote the whole article instead","why":"A summary is the right tool; it just needs a citation.","_n":"1r4f3","_k":"ffe03396"}],"hints":["Whose argument is it?","Okafor’s.","Add a signal phrase naming Okafor, or (Okafor 115–38)."]},{"id":"i3","goal":6,"star":true,"prompt":"\u003cstrong>I3 ★.\u003c/strong> Sam translates a French article with an online tool and pastes the English into his essay with the French citation.","options":[{"t":"Fine, as long as the tool is free","why":"Price has nothing to do with authorship.","_n":"1s503","_k":"862d58e2"},{"t":"Fine, because the French citation is included","why":"The pasted English is presented as Sam’s prose; it isn’t.","_n":"1t4d3","_k":"b538ce1a"},{"t":"Translation makes it his own","why":"Changing the language doesn’t change the author.","_n":"1u4e3","_k":"12a6295a"},{"t":"Still the author’s words: quote and cite the translation as such (or paraphrase and cite), and follow the teacher’s tool policy","why":"The sentences are the author’s in any language.","_n":"1v533","_k":"1c5bcd47"}],"hints":["Whose ideas and sentences are these?","The original author’s.","Cite the translation; never present it as your own."]},{"id":"i4","goal":6,"star":true,"prompt":"\u003cstrong>I4 ★.\u003c/strong> Ava’s teacher allows editing help with disclosure. She asks TextPal to fix comma splices in her own paragraph.","options":[{"t":"Not OK: any AI use is cheating","why":"The policy decides; here it’s allowed with disclosure.","_n":"1w543","_k":"26504ab2"},{"t":"OK, and no disclosure is needed","why":"This policy asks for disclosure.","_n":"1x513","_k":"325cc7bc"},{"t":"OK only if she cites TextPal as evidence","why":"Editing help isn’t evidence; she discloses it.","_n":"1y503","_k":"5a652dc8"},{"t":"OK with disclosure: note the use as the policy asks; the ideas and sentences remain hers","why":"The policy decides, and this use fits it.","_n":"1z533","_k":"c3233783"}],"hints":["What does this teacher’s policy allow?","Editing help, with disclosure.","It’s allowed: disclose it."]},{"id":"i5","goal":6,"star":true,"prompt":"\u003cstrong>I5 ★.\u003c/strong> Leo reuses two paragraphs from his Grade 11 essay on a different novel, without saying so.","options":[{"t":"Fine, if he changes a few words","why":"That hides the reuse; it doesn’t make it new.","_n":"20523","_k":"40cdf09a"},{"t":"Self-plagiarism: ask the teacher first, and disclose or rewrite","why":"Submitting old work as new needs permission.","_n":"214d3","_k":"c197a095"},{"t":"It’s his own work, so it’s fine","why":"Submitting old work as new needs permission.","_n":"224c3","_k":"36774cd6"},{"t":"Fine, because it was a different novel","why":"It’s still old work presented as new.","_n":"234f3","_k":"e15a3b52"}],"hints":["Is this new work for this assignment?","No: it was submitted before.","Ask the teacher, and disclose or rewrite."]},{"id":"i6","goal":4,"star":true,"prompt":"\u003cstrong>I6 ★.\u003c/strong> Mia finds a perfect line attributed to Fitzgerald on a quotes website, but can’t find it in the novel.","options":[{"t":"Don’t use it unless it’s verified in the novel (or a reliable edition of his letters or essays, cited as such)","why":"Verification comes before quotation.","_n":"244e3","_k":"051d63d1"},{"t":"Quote it with the website’s citation","why":"Unverified attributions are often false. Check every quotation against your copy of the novel. Secondhand quotations drift, and AI ones can be invented.","_n":"25593","_k":"15203d74"},{"t":"Quote it, because many websites repeat it","why":"Repetition isn’t verification.","_n":"26583","_k":"eed72cb2"},{"t":"Paraphrase it so it doesn’t need checking","why":"An idea you can’t trace can’t be credited honestly.","_n":"27573","_k":"e3e2adb4"}],"hints":["Where should a Fitzgerald quotation be checked?","In the novel, or a reliable edition of his other writing.","If you can’t verify it, don’t use it."]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Wesley","goal":[3,5,2],"how":"","instruction":"Wesley made one mistake in each piece. Tap the line or sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"unit":"Line","task":"Wesley’s Works Cited list, in order.","steps":["Fitzgerald, F. Scott. \u003cem>The Great Gatsby\u003c/em>. 1925. Scribner, 2004.","Lindqvist, Marta. \u003cem>Dreamers and Debts: The American Novel, 1920–1940\u003c/em>. Harbourfront UP, 2016.","Okafor, Adaeze. \u003cem>Borrowed Light: Narration and Guilt in The Great Gatsby\u003c/em>. “North Shore Review of Literature,” vol. 41, no. 2, 2019, pp. 115–38.","“Jazz Age.” \u003cem>Northern Encyclopedia of Literature\u003c/em>, 2018, northern-encyclopedia.example/jazz-age."],"_a":"Ag==","stepFb":["Correct MLA 9 for the novel.","Correct.","","Correct form, but it’s out of alphabetical order after Okafor; the first mistake is earlier."],"fixes":[{"t":"Okafor, Adaeze. Borrowed Light. North Shore Review, 2019.","why":"Missing elements, and no italics or quotation marks. Containers (journals, books, websites) are italic; parts inside them (articles, chapters, posts) go in quotation marks.","_n":"28583","_k":"1af039b4"},{"t":"Line 3 is correct.","why":"The article title belongs in quotation marks; the journal, its container, in italics.","_n":"29593","_k":"8e41b148"},{"t":"Okafor, Adaeze. “Borrowed Light: Narration and Guilt in \u003cem>The Great Gatsby\u003c/em>.” \u003cem>North Shore Review of Literature\u003c/em>, vol. 41, no. 2, 2019, pp. 115–38.","why":"The article is in quotation marks; the journal, its container, is italic.","_n":"2a5a3","_k":"30784efb"},{"t":"Keep line 3; move line 4 to the top.","why":"Alphabetical order matters too, but line 3 swaps italics and quotation marks. Containers (journals, books, websites) are italic; parts inside them (articles, chapters, posts) go in quotation marks.","_n":"2b5b3","_k":"fbdbd480"}],"hints":["Article or journal: which is the container?","Journal = italics; article = quotation marks.","Swap them in line 3."]},{"id":"e2","goal":5,"unit":"Sentence","task":"Wesley’s paragraph on Nick as narrator.","steps":["Adaeze Okafor writes that Nick’s narration “launders” Gatsby’s story (120).","Marta Lindqvist writes that dreams in such novels are “like loans that come due” (87).","Thomas Bélanger writes that ash and gold are “twin currencies” in the novel (52).","Therefore Nick is an unreliable narrator."],"_a":"AA==","stepFb":["","Another critic, but still no claim of Wesley’s own; the first slip came earlier.","Same pattern.","A claim at last, but it arrives unearned at the end."],"fixes":[{"t":"Add a fourth critic before sentence 4.","why":"More voices won’t make the paragraph Wesley’s. Whose argument is this paragraph? Start with your claim, then bring the critic in.","_n":"2c5c3","_k":"7fd543dc"},{"t":"Sentence 1 is correct.","why":"A paragraph that opens with a critic’s claim lets the critic own it. Whose argument is this paragraph? Start with your claim, then bring the critic in.","_n":"2d5d3","_k":"f6f8f5ec"},{"t":"Delete all the quotations.","why":"Critics can help; they just shouldn’t lead.","_n":"2e5e3","_k":"0281eb78"},{"t":"Begin with Wesley’s own claim, for example: “Nick protects himself by protecting Gatsby’s legend,” then bring in Okafor to support it.","why":"Now the paragraph is Wesley’s, and Okafor supports it.","_n":"2f4f3","_k":"a44ba9fc"}],"hints":["Whose claim does the paragraph open with?","Okafor’s, not Wesley’s.","Lead with your claim; use critics as support."]},{"id":"e3","goal":2,"unit":"Sentence","task":"Wesley’s paraphrase of Okafor (p. 120).","steps":["Nick’s narration does not simply tell Gatsby’s story; it cleans it.","By arranging events out of order and lingering on beautiful moments, Nick invites readers to admire Gatsby.","In this way the ending belongs to the narrator."],"_a":"AA==","stepFb":["","Also too close: “by arranging events out of order”.","Closer to his own words, but still uncited."],"fixes":[{"t":"Put sentences 1–3 in quotation marks.","why":"Then it must be an exact quotation, and it isn’t exact.","_n":"2g503","_k":"1b52952f"},{"t":"“According to Okafor, Nick shapes Gatsby’s story rather than merely recounting it, and in doing so he guides readers toward an admiration that hides his own unresolved judgement (120).”","why":"Her idea, Wesley’s words and structure, with a signal phrase and the page.","_n":"2hdd3","_k":"58cdfb40"},{"t":"Change “cleans” to “washes” and add (120).","why":"Still the source’s sentence shape: patchwriting. Same shape, new words is still the source’s sentence. Close the source, then write the idea your way.","_n":"2idc3","_k":"52cd91e1"},{"t":"Sentence 1 is correct.","why":"It copies the structure and most of the words of the source. Same shape, new words is still the source’s sentence. Close the source, then write the idea your way.","_n":"2jdb3","_k":"254e4547"}],"hints":["Run the overlap check on sentence 1.","“Nick’s narration does not simply” is the source’s phrase.","Rewrite in your own structure, with a signal phrase and (120)."]}]}]},"reflect":{"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one sentence, from Johnson, from a critic in this module, or from your own ISU research, that shows how ideas travel between people. Add one sentence on why it matters to you.\u003c/p>\u003cdiv id=\"cp-app\">\u003c/div>"}],"journal":[{"id":"j1","q":"Which source surprised you most: the fluent chatbot, the misquoting study guide, or the blog with a good idea? Why?"},{"id":"j2","q":"In your own words: what’s the difference between paraphrasing and patchwriting, and why does it matter?"},{"id":"j3","q":"Explain to a friend how to use a critic without letting the critic take over your paragraph."},{"id":"j4","q":"What is your teacher’s policy on AI tools for the ISU, and what will you do to follow it with confidence?"}],"art":{"intro":"Write one principle about using other people’s words honestly and powerfully. Add a master’s example (Johnson’s sentences, or a well-integrated critic sentence from this module) and your own imitation.","placeholder":"Your principle about using other people’s words honestly and powerfully (at least 6 words)","examples":["Knowledge is of two kinds. We know a subject ourselves, or we know where we can find information upon it. (Johnson)","While Okafor shows how Nick flatters Gatsby (120), chapter 6, where Nick plainly exposes Gatsby’s invented past, suggests the laundering is never complete.","Okafor overlooks the final chapter, where Gatsby’s belief in “the green light” (Fitzgerald 180) belongs to Gatsby, not Nick, and so the ending honours the dreamer as much as the narrator."]},"artSamples":"\u003cdetails class=\"alg art-samples\">\u003csummary>Two sample principles (models only; write your own)\u003c/summary>\u003cp class=\"an-note an-syntax\">“Lead with your claim; let critics follow.” \u003cspan class=\"muted\">Master: “While Okafor shows how Nick flatters Gatsby (120), chapter 6… suggests the laundering is never complete.” My imitation: “While Lindqvist reads dreams as debts (87), Daisy’s voice suggests some debts are never called in.”\u003c/span>\u003c/p>\u003cp class=\"an-note an-sound\">“Never quote what you haven’t seen in the original.” \u003cspan class=\"muted\">Master: Johnson’s “we know where we can find information upon it”. My imitation: “I know where my quotation lives: page 180, in my own copy.”\u003c/span>\u003c/p>\u003c/details>","commonplaceLines":["Knowledge is of two kinds. We know a subject ourselves, or we know where we can find information upon it. (Johnson)","Nick’s narration does not simply report Gatsby’s story; it launders it. (Okafor, fictional critic)","So we beat on, boats against the current, borne back ceaselessly into the past. (Fitzgerald)"],"cpNote":"Why it matters to you"},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which source is \u003cstrong>peer-reviewed\u003c/strong>?","options":[{"t":"A chatbot’s answer to your question","why":"Ask who’s accountable, what evidence is shown, and who checked it. An unsigned page or a chatbot can’t answer those.","_n":"2kda3","_k":"f37320b1"},{"t":"A blog written by a teacher","why":"Expertise, but no outside review.","_n":"2le13","_k":"e3773161"},{"t":"A popular website with many visitors","why":"Traffic isn’t review.","_n":"2me03","_k":"a9aeca95"},{"t":"An article in a scholarly journal whose submissions are evaluated by other experts before publication","why":"Peer review means experts check it before it’s published.","_n":"2ndf3","_k":"738affa4"}]},"b":{"prompt":"A \u003cstrong>secondary source\u003c/strong> for an ISU essay is…","options":[{"t":"a work that analyses or comments on the novel you’re studying","why":"It comments on the primary source.","_n":"2ode3","_k":"4c76cbce"},{"t":"any website","why":"Many websites aren’t sources you should cite.","_n":"2pd53","_k":"52aaacc2"},{"t":"the novel itself","why":"That’s the primary source.","_n":"2qd43","_k":"88ff7e82"},{"t":"your own notes","why":"Those are your working notes, not a source.","_n":"2r7c6","_k":"4b98b620"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which is the correct MLA 9 Works Cited entry?","options":[{"t":"Okafor, Adaeze. \u003cem>Borrowed Light: Narration and Guilt in The Great Gatsby\u003c/em>. “North Shore Review of Literature,” vol. 41, no. 2, 2019, pp. 115–38.","why":"Italics and quotation marks are swapped.","_n":"2s7b6","_k":"19925068"},{"t":"Okafor, Adaeze. “Borrowed Light: Narration and Guilt in \u003cem>The Great Gatsby\u003c/em>.” \u003cem>North Shore Review of Literature\u003c/em>, vol. 41, no. 2, 2019, pp. 115–38.","why":"Article in quotation marks, journal in italics, elements in MLA order.","_n":"2t7e6","_k":"686d9fe7"},{"t":"Okafor, Adaeze (2019). “Borrowed Light: Narration and Guilt in \u003cem>The Great Gatsby\u003c/em>.” North Shore Review of Literature, 41(2), 115–38.","why":"That’s APA-style punctuation, not MLA.","_n":"2u7d6","_k":"8db88e1c"},{"t":"Adaeze Okafor. “Borrowed Light.” \u003cem>North Shore Review of Literature\u003c/em>, 2019.","why":"Surname first, and elements are missing.","_n":"2v806","_k":"13c781da"}]},"b":{"prompt":"Which is the correct MLA 9 Works Cited entry for a book?","options":[{"t":"Lindqvist, Marta. “Dreamers and Debts: The American Novel, 1920–1940.” Harbourfront UP, 2016.","why":"Books are containers: italics.","_n":"2w7f6","_k":"75f28f18"},{"t":"Lindqvist, Marta. \u003cem>Dreamers and Debts: The American Novel, 1920–1940\u003c/em>. Harbourfront UP, 2016.","why":"A book is a container: italics, then publisher and date.","_n":"2x826","_k":"66a28201"},{"t":"Marta Lindqvist. \u003cem>Dreamers and Debts\u003c/em>. 2016, Harbourfront UP.","why":"Surname first; publisher before date.","_n":"2y816","_k":"d86be8b4"},{"t":"Lindqvist, M. (2016). \u003cem>Dreamers and Debts\u003c/em>. Harbourfront University Press.","why":"APA style, not MLA.","_n":"2z746","_k":"009f7af3"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which best describes \u003cstrong>patchwriting\u003c/strong>?","options":[{"t":"Copying a source’s sentence structure while swapping in a few synonyms","why":"Same shape, new words is still the source’s sentence. Close the source, then write the idea your way.","_n":"30736","_k":"499a133e"},{"t":"Quoting a source with a citation","why":"That’s legitimate quotation.","_n":"31766","_k":"93397b1d"},{"t":"Writing a summary that’s too short","why":"Length isn’t the issue.","_n":"32776","_k":"d558c78b"},{"t":"Combining quotations from several critics","why":"That’s hiding behind critics, a different problem.","_n":"33746","_k":"f1511f31"}]},"b":{"prompt":"Which note is an honest \u003cstrong>paraphrase\u003c/strong> of “Nick’s narration does not simply report Gatsby’s story; it launders it” (Okafor 120)?","options":[{"t":"“Okafor suggests that Nick reshapes Gatsby’s story instead of just telling it (120).”","why":"New words, new structure, a signal phrase and the page.","_n":"34756","_k":"b6afbde0"},{"t":"“Okafor says the narration ‘does not simply report Gatsby’s story’ (120), which is true.”","why":"That’s a quotation, not a paraphrase.","_n":"35726","_k":"42f91f8d"},{"t":"“Nick reshapes Gatsby’s story instead of just telling it.”","why":"No citation. The idea is borrowed even when the words are yours, so cite it.","_n":"36736","_k":"045e8153"},{"t":"“Nick’s narration does not just report Gatsby’s story; it cleans it (Okafor 120).”","why":"Patchwriting. Same shape, new words is still the source’s sentence. Close the source, then write the idea your way.","_n":"37706","_k":"0843fb69"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"You need evidence for an argument about Nick’s reliability. Which source is best to \u003cstrong>cite\u003c/strong>?","options":[{"t":"TextPal’s answer","why":"Unverified, and it contains inventions.","_n":"38716","_k":"0b5dc59b"},{"t":"Okafor’s peer-reviewed article, which analyses Nick’s narration with documented evidence","why":"Accountable, documented and reviewed.","_n":"397e6","_k":"aeae5d1d"},{"t":"\u003cem>QuickLit Notes\u003c/em>’ chapter summary","why":"No author, no evidence, and it misquotes the novel.","_n":"3a7f6","_k":"0612a77d"},{"t":"Ng’s blog post","why":"Good for ideas; it’s unreviewed, so look for scholarship to cite.","_n":"3b706","_k":"670b6870"}]},"b":{"prompt":"Ng’s blog makes a sharp point you want to develop. What’s the best use of it?","options":[{"t":"Quote it as your main evidence","why":"Unreviewed opinion shouldn’t carry an argument.","_n":"3c6f6","_k":"4b4555a4"},{"t":"Ignore it completely because blogs are worthless","why":"Blogs can spark good ideas; they just need checking.","_n":"3d6e6","_k":"9d786d74"},{"t":"Treat it as a lead: test the idea against the novel, look for scholarly support, and cite the blog if you use its idea","why":"Background only, verified, and credited.","_n":"3e6d6","_k":"30706f03"},{"t":"Use the idea without citing it, since it’s only a blog","why":"The idea is borrowed even when the words are yours, so cite it.","_n":"3f746","_k":"42b7af18"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A chatbot says a critic wrote “Gatsby is a mirror with no face” in a 2015 article, but no library index lists the article. What’s the best conclusion?","options":[{"t":"Quote it, because chatbots summarize real sources","why":"Chatbots can produce plausible but invented sources. Check every quotation against your copy of the novel. Secondhand quotations drift, and AI ones can be invented.","_n":"3g736","_k":"3e0a65be"},{"t":"Treat it as unverified and possibly invented: don’t quote it unless you can find the original","why":"No original, no quotation.","_n":"3h726","_k":"816f27ef"},{"t":"Quote it with the year 2015, because the year sounds precise","why":"Precision isn’t proof.","_n":"3i716","_k":"67381816"},{"t":"Quote it and cite the chatbot","why":"Citing the chatbot doesn’t verify the critic.","_n":"3j786","_k":"ef529f50"}]},"b":{"prompt":"A study guide quotes the novel’s last line as “…borne back endlessly into the past.” Your copy says “ceaselessly.” What’s best?","options":[{"t":"Quote your copy of the novel, the primary source, and treat the guide as unreliable","why":"The primary source decides.","_n":"3k776","_k":"b2aa6e11"},{"t":"Average the two by using neither word","why":"Quotations must be exact.","_n":"3l6a6","_k":"b3cf0d90"},{"t":"Quote the guide, because guides are written by experts","why":"Ask who’s accountable, what evidence is shown, and who checked it. An unsigned page or a chatbot can’t answer those.","_n":"3m6b6","_k":"b4298606"},{"t":"Use “endlessly” and cite the guide","why":"A cited misquotation is still a misquotation.","_n":"3n6c6","_k":"3c599310"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Okafor argues that Nick “launders” Gatsby’s story (120). You notice that in chapter 6 Nick plainly reveals Gatsby’s invented past. Which move fits best?","options":[{"t":"Complicate: agree that Nick shapes the story, but show that he also exposes Gatsby, so the laundering is incomplete","why":"Your evidence limits her claim without erasing it.","_n":"3o6d6","_k":"51eb633d"},{"t":"Push back: Okafor is entirely wrong","why":"Your evidence limits her claim; it doesn’t erase it.","_n":"3p6e6","_k":"19bf7038"},{"t":"Hide: quote Okafor and say nothing","why":"Whose argument is this paragraph? Start with your claim, then bring the critic in.","_n":"3q6f6","_k":"b3044656"},{"t":"Agree and extend: chapter 6 proves Okafor completely right","why":"Chapter 6 cuts against her, at least partly.","_n":"3r706","_k":"0a152580"}]},"b":{"prompt":"Lindqvist argues that dreams in 1920s novels are “like loans that come due” (87). You notice that Gatsby’s dream is paid for by others, like Myrtle and George Wilson. Which move fits best?","options":[{"t":"Background only: debts are just context","why":"This is an argument, not context.","_n":"3s716","_k":"ed442d38"},{"t":"Hide: quote Lindqvist twice","why":"Whose argument is this paragraph? Start with your claim, then bring the critic in.","_n":"3t726","_k":"0c6c4fc8"},{"t":"Push back: Lindqvist is wrong about debt","why":"Your evidence supports her idea.","_n":"3u736","_k":"3252d260"},{"t":"Agree and extend: the debt image fits, and the novel shows the loan being collected from people who never borrowed","why":"Your evidence supports her and carries the idea further.","_n":"3v747","_k":"c35967e0"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which sentence best integrates a critic while keeping the student’s voice in charge?","options":[{"t":"“Nick protects his own image by protecting Gatsby’s, which is why, as Okafor puts it, his narration ‘launders’ the story (120).”","why":"The student’s claim leads; Okafor supports it.","_n":"3w737","_k":"a4b630fe"},{"t":"“Nick launders the story.”","why":"Okafor’s idea, uncited. The idea is borrowed even when the words are yours, so cite it.","_n":"3x767","_k":"cdd316bb"},{"t":"“Okafor’s article is about Nick.”","why":"A topic, not an argument.","_n":"3y757","_k":"5e541b3d"},{"t":"“Okafor says, ‘Nick’s narration does not simply report Gatsby’s story; it launders it’ (120).”","why":"A quotation with no claim of the student’s own. Whose argument is this paragraph? Start with your claim, then bring the critic in.","_n":"3z707","_k":"294fb883"}]},"b":{"prompt":"Which sentence best \u003cstrong>pushes back\u003c/strong> on a critic, with evidence?","options":[{"t":"“Okafor is wrong.”","why":"A verdict with no evidence.","_n":"406f7","_k":"a7ed99b5"},{"t":"“Okafor overlooks the final chapter, where Gatsby’s belief in ‘the green light’ (Fitzgerald 180) belongs to Gatsby himself, so the ending honours the dreamer as much as the narrator.”","why":"A clear objection, grounded in the novel.","_n":"41727","_k":"001701c0"},{"t":"“Okafor overlooks things, as Lindqvist says (87).”","why":"Hides behind a second critic. Whose argument is this paragraph? Start with your claim, then bring the critic in.","_n":"42717","_k":"cfaa8357"},{"t":"“I don’t like Okafor’s article.”","why":"A preference, not an argument.","_n":"437c7","_k":"6f085058"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which in-text citation is correct MLA for Ng’s blog post, which has no page numbers?","options":[{"t":"(Ng 2022)","why":"MLA doesn’t add the year.","_n":"447b7","_k":"dc0ce2d6"},{"t":"(readinginthedark.example)","why":"The author comes first.","_n":"45ee7","_k":"2f46776e"},{"t":"(Ng, n.p.)","why":"MLA doesn’t use “n.p.” in the parentheses.","_n":"46ef7","_k":"e248d346"},{"t":"(Ng)","why":"No page numbers: the author alone.","_n":"47ec7","_k":"46fb60e9"}]},"b":{"prompt":"Which in-text citation is correct MLA for the unsigned encyclopedia entry “Jazz Age”?","options":[{"t":"(Jazz Age 2018)","why":"Quotation marks, no year.","_n":"48ed7","_k":"d0c407f6"},{"t":"(Anonymous)","why":"Use the title when there’s no author.","_n":"49f27","_k":"0ea8ff94"},{"t":"(\u003cem>Northern Encyclopedia of Literature\u003c/em>)","why":"Use the entry’s title, not the container.","_n":"4af37","_k":"06f8644d"},{"t":"(“Jazz Age”)","why":"With no author, the title in quotation marks.","_n":"4bf07","_k":"5846664e"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Your teacher allows AI tools for brainstorming only, with disclosure. You used TextPal to list possible ISU topics. What should you do?","options":[{"t":"Cite TextPal as evidence for your thesis","why":"Brainstorming help isn’t evidence.","_n":"4cf17","_k":"0a2fffad"},{"t":"Nothing: brainstorming doesn’t count","why":"The policy asks for disclosure.","_n":"4df67","_k":"5a0355a9"},{"t":"Disclose the use as the policy asks, and write every sentence of the essay yourself","why":"Follow the policy exactly.","_n":"4ef77","_k":"ec75544a"},{"t":"Use TextPal to write the introduction, since the topic came from it","why":"The policy allows brainstorming only.","_n":"4f087","_k":"6451bac3"}]},"b":{"prompt":"Your teacher bans AI tools for the ISU. A friend says grammar checkers are AI too. What’s best?","options":[{"t":"Use any tool your friend thinks is fine","why":"Your teacher’s policy decides.","_n":"4g077","_k":"7598dc19"},{"t":"Stop writing until the policy changes","why":"Ask; don’t stall.","_n":"4h067","_k":"6644f953"},{"t":"Ask your teacher which tools count before using any","why":"When a policy is unclear, ask the person who set it.","_n":"4i057","_k":"0d5aa482"},{"t":"Use AI as long as you don’t get caught","why":"That’s a breach of integrity.","_n":"4j047","_k":"25bd5a63"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Three days before your ISU is due, you can find only a study guide about your novel. What’s the best plan?","options":[{"t":"Ask a chatbot for critics’ quotations to use","why":"Check every quotation against your copy of the novel. Secondhand quotations drift, and AI ones can be invented.","_n":"4k037","_k":"03c759f1"},{"t":"Cite the study guide as your main secondary source","why":"Ask who’s accountable, what evidence is shown, and who checked it. An unsigned page or a chatbot can’t answer those.","_n":"4l027","_k":"40c5b013"},{"t":"Ask your school librarian for help finding a scholarly source, and meanwhile build your argument from your own close reading of the novel","why":"Get help, and keep the novel as your primary evidence.","_n":"4m017","_k":"3df9a5c2"},{"t":"Skip secondary sources and don’t mention it","why":"Ask for help, and be transparent with your teacher.","_n":"4n007","_k":"003e1123"}]},"b":{"prompt":"You find an excellent critical essay on your novel from the 1950s. Is it usable?","options":[{"t":"Only if you remove the date from the citation","why":"Never hide a date.","_n":"4off7","_k":"aca3f55a"},{"t":"Yes: literary criticism can stay valuable; note its date, and check whether later critics have responded to it","why":"In literary study an older essay can still be essential. Note its date and see who has responded to it.","_n":"4p027","_k":"a84464d4"},{"t":"No: anything older than ten years is outdated","why":"In literary study an older essay can still be essential. Note its date and see who has responded to it.","_n":"4q037","_k":"a1ab15df"},{"t":"Only if a chatbot confirms it","why":"Ask who’s accountable, what evidence is shown, and who checked it. An unsigned page or a chatbot can’t answer those.","_n":"4r047","_k":"9b7d901b"}]}}]},"task":{"title":"Annotated bibliography and a critic conversation","summary":"Annotated bibliography and a critic conversation","statement":"\u003cp>Build a three-source annotated bibliography, then write one paragraph that puts a critic in conversation with your own claim. Use the module’s sources (about \u003cem>The Great Gatsby\u003c/em>) or your own ISU sources.\u003c/p>\u003cp>\u003cstrong>What you make:\u003c/strong> (1) three Works Cited entries, built in the citation builder and alphabetized, each with a 40–90-word annotation that summarizes, evaluates and plans its use; (2) one paragraph of 100–200 words that opens with a claim you tag as \u003cstrong>My claim\u003c/strong>, brings in at least one critic from your bibliography, and uses at least one novel quotation with a citation; (3) a craft statement of at least 50 words.\u003c/p>\u003cp class=\"tiny muted\">This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class=\"alg\">\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"topic-tbl\">\u003cthead>\u003ctr>\u003cth scope=\"col\">Criterion\u003c/th>\u003cth scope=\"col\">Level 1\u003c/th>\u003cth scope=\"col\">Level 2\u003c/th>\u003cth scope=\"col\">Level 3\u003c/th>\u003cth scope=\"col\">Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge: MLA 9 and integrity\u003c/td>\u003ctd>Frequent errors; uncited ideas\u003c/td>\u003ctd>Some errors\u003c/td>\u003ctd>Accurate entries and citations\u003c/td>\u003ctd>Flawless entries; scrupulous attribution\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking: source evaluation\u003c/td>\u003ctd>Annotations only summarize\u003c/td>\u003ctd>Some evaluation\u003c/td>\u003ctd>Evaluates and plans the use of each source\u003c/td>\u003ctd>Weighs strengths and limits insightfully\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication: critic conversation\u003c/td>\u003ctd>Hides behind critics\u003c/td>\u003ctd>The student’s claim is present but weak\u003c/td>\u003ctd>A clear claim with a purposeful move\u003c/td>\u003ctd>An authoritative voice; the critic deepens the argument\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application: use of evidence\u003c/td>\u003ctd>Novel evidence missing or misquoted\u003c/td>\u003ctd>Evidence present, loosely tied\u003c/td>\u003ctd>Accurate novel evidence tied to the claim\u003c/td>\u003ctd>Precise evidence that tests the critic’s claim\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Three sources","MLA 9 form","Alphabetical","Annotations that evaluate and plan","A critic in the conversation","Your own claim","A move","Paragraph length","Craft statement"],"tips":["Add or remove entries to make exactly three.","Open the citation builder: it shows which element is in the wrong slot.","Alphabetize by the first word of each entry, skipping \u003cem>A\u003c/em>, \u003cem>An\u003c/em> and \u003cem>The\u003c/em>.","Say what the source argues, how useful it is, and how you’ll use it.","Bring one of your bibliography’s critics into the paragraph, with a citation.","Your claim should be yours: no quotation and no citation in that sentence.","Signal your move: agree and extend, complicate, or push back.","Aim for 100–200 words.","Explain your choices in at least 50 words."],"annWords":["useful","I will use","I can use","will help","limitation","however"],"moveWords":["agree","extends","while","however","overlooks","complicates","although","but"],"explainPrompt":"Craft statement: Which critic did you put in conversation with your claim, and which move did you choose (agree and extend, complicate, push back)? Why that move? How did you make sure every borrowed word and idea was credited?","explainLabel":"Craft statement","vocab":"Use the words secondary source, paraphrase, citation and claim.","success":"Your sources are judged, cited and in conversation with you. Try a different move with the same critic and notice how the paragraph’s argument shifts.","more":"Each combination of sources is a different answer.","bank":["s1","s1db","s2","s3","s4","s5","s6","bel","nov"],"own":[{"id":"last","t":"Author’s surname (leave blank if none)"},{"id":"first","t":"Author’s given name(s)"},{"id":"title","t":"Title of source"},{"id":"cont","t":"Title of container (journal, book, website)"},{"id":"pub","t":"Publisher"},{"id":"date","t":"Publication date"},{"id":"loc","t":"Location (pages, or URL without https://)"}],"models":[{"title":"Model 1: Agree and extend","wc":[["Bélanger, Thomas. “Ash Heaps and Gold: Waste in Fitzgerald.” \u003cem>New Readings of the Jazz Age\u003c/em>, edited by Priya Sandhu, Harbourfront UP, 2020, pp. 44–61.","Bélanger traces ash and gold as paired images, arguing that the novel’s glamour is built on what it throws away. His reading of the valley of ashes is detailed and well documented. It will help me connect Nick’s beautiful descriptions to the costs they hide, though he says little about narration itself."],["Lindqvist, Marta. \u003cem>Dreamers and Debts: The American Novel, 1920–1940\u003c/em>. Harbourfront UP, 2016.","Lindqvist reads 1920s novels as stories of debt, in which dreams behave like loans that must be repaid. Her chapter on Fitzgerald is useful because it gives me language for who pays for Gatsby’s dream. I will use her debt image to extend Okafor’s argument about Nick’s narration."],["Okafor, Adaeze. “Borrowed Light: Narration and Guilt in \u003cem>The Great Gatsby\u003c/em>.” \u003cem>North Shore Review of Literature\u003c/em>, vol. 41, no. 2, 2019, pp. 115–38.","Okafor argues that Nick reshapes Gatsby’s story so readers admire what he cannot judge. Her close readings of the final chapter are persuasive and carefully documented. I will use her idea of “laundering” to frame my claim about Nick’s reliability, while testing it against chapter 6."]],"para":"Nick’s narration does not only flatter Gatsby; it also moves the cost of Gatsby’s dream onto other people. Adaeze Okafor argues that Nick “launders” Gatsby’s story by lingering on its beauty (120), and her reading extends further than she takes it. Marta Lindqvist observes that dreams in such novels behave “like loans that come due” (87), and Nick’s account fits that pattern: he dwells on the “blue gardens” where “men and girls came and went like moths” (Fitzgerald 39; ch. 3), while the bill arrives in the valley of ashes. The laundering Okafor describes is also an accounting trick, one that charges Myrtle, George Wilson and finally Gatsby himself for a dream Nick prefers to admire."},{"title":"Model 2: Complicate","wc":[["“Jazz Age.” \u003cem>Northern Encyclopedia of Literature\u003c/em>, 2018, northern-encyclopedia.example/jazz-age.","This unsigned entry gives a reliable overview of 1920s American culture, including prohibition and the consumer boom, and notes that Fitzgerald popularized the phrase. It is useful only as background: it offers no analysis of the novel. I will use it to set the scene in my introduction, not to support my argument."],["Ng, Ricky. “Why Nick Carraway Is a Liar.” \u003cem>Reading in the Dark\u003c/em>, 14 Mar. 2022, readinginthedark.example/nick-liar.","Ng, a teacher writing on his book blog, argues that Nick’s claim to honesty is a lie because he hides his part in the affair. The post is lively but unreviewed, so it has limitations as evidence. However, it sharpened my question, and I will use it as a view to complicate rather than as authority."],["Okafor, Adaeze. “Borrowed Light: Narration and Guilt in \u003cem>The Great Gatsby\u003c/em>.” \u003cem>North Shore Review of Literature\u003c/em>, vol. 41, no. 2, 2019, pp. 115–38.","Okafor argues that Nick reshapes Gatsby’s story so readers admire what he cannot judge. Her evidence is careful and her argument is persuasive. I will use her account of Nick’s divided judgement to complicate the simpler view that Nick simply lies."]],"para":"Nick is less a liar than a narrator who cannot see the shape of his own bias. When Nick claims, “I am one of the few honest people that I have ever known” (Fitzgerald 59; ch. 3), Ricky Ng reads the line as proof that Nick is lying (Ng). That judgement is too simple. Adaeze Okafor shows that Nick “invites the reader to admire what he himself can neither fully condemn nor fully forgive” (120), which suggests divided loyalty rather than deliberate deceit. However, a narrator who cannot condemn may still mislead. The novel asks us to read Nick the way he refuses to read himself: closely, and against the grain of his own praise."},{"title":"Model 3: Push back","wc":[["Lindqvist, Marta. \u003cem>Dreamers and Debts: The American Novel, 1920–1940\u003c/em>. Harbourfront UP, 2016.","Lindqvist argues that 1920s novels treat dreams as debts that come due. Her account is useful for seeing who pays for Gatsby’s ambitions. However, her focus on economics leaves little room for the novel’s final tone of wonder, which is where I will build my counter-argument."],["Ng, Ricky. “Why Nick Carraway Is a Liar.” \u003cem>Reading in the Dark\u003c/em>, 14 Mar. 2022, readinginthedark.example/nick-liar.","Ng argues that Nick’s self-description as honest is ironic. As an unreviewed blog post it has limitations, but it is useful as an example of the common view that Nick is untrustworthy. I can use it to show that my reading of the ending runs against a popular interpretation."],["Okafor, Adaeze. “Borrowed Light: Narration and Guilt in \u003cem>The Great Gatsby\u003c/em>.” \u003cem>North Shore Review of Literature\u003c/em>, vol. 41, no. 2, 2019, pp. 115–38.","Okafor argues that the novel’s final images belong to Nick more than to Gatsby. Her evidence is strong, which makes her the critic I most need to answer. I will use her claim as the position my paragraph pushes back against."]],"para":"The novel’s ending belongs to Gatsby after all. Adaeze Okafor argues that the final images “belong less to Gatsby than to the narrator who needs Gatsby to have been great” (120), but she overlooks how the last page shifts from Nick’s judgement to Gatsby’s belief. “Gatsby believed in the green light, the orgastic future that year by year recedes before us” (Fitzgerald 180; ch. 9): the sentence grants Gatsby a faith Nick can only describe, not share. Although Nick holds the pen, the dreamer holds the image. The ending honours the capacity to hope, even as it shows that hope receding, and that double movement is Gatsby’s, not Nick’s."}],"modelNote":"Each model passes every line; the Fitzgerald page numbers are illustrative. The tagged claim is the first sentence."},"cards":[["Primary source","The text you analyse: your novel."],["Secondary source","A work that analyses or comments on the primary source."],["Peer review","Experts evaluate a scholarly article before it is published."],["Five questions for a source","Authority · Evidence · Review · Purpose · Currency."],["Paraphrase","The idea in your own words \u003cem>and\u003c/em> structure, cited."],["Patchwriting","The source’s sentence with synonyms swapped. Still plagiarism."],["Summary","The main point, much shorter, cited."],["Container (MLA)","The larger whole holding a source (journal, book, website), in \u003cem>italics\u003c/em>."],["In-text citation","(Okafor 120); no page: (Ng); no author: (“Jazz Age”)."],["Critic moves","Agree and extend · complicate · push back, always after your own claim."],["Invented citation","A plausible but non-existent quotation or source, as AI tools can produce. Verify everything."],["\u003cem>Plagiarius\u003c/em>","Latin “kidnapper”: Martial’s word for a poet who stole his verses."]]}};</script>
