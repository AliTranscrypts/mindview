--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;

}
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{
margin:0;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:24px 24px;
font:400 1.0625rem/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
img,svg{max-width:100%}
header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mv-top));z-index:9;background:var(--paper);border-bottom:1.5px solid var(--rule)}
.top-inner{max-width:1060px;margin:0 auto;padding:10px 18px 0}
.top-row{display:flex;align-items:center;gap:12px 18px}
.brand{flex:1 1 auto;min-width:0;line-height:1.2}
.brand b{display:block;font:600 1.3rem var(--font-math);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{display:block;font-size:.85rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--ink-2);flex:0 0 auto}
.prog-bar{width:110px;height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.hd-btns{display:flex;gap:8px;flex:0 0 auto}
.home-link{flex:0 0 auto}
.theme-btn{min-width:2.6em;justify-content:center}

.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink-2);font-weight:700;font-size:.95rem;padding:8px 8px 10px}
.step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.8rem}
.step.done .num{background:var(--green);border-color:var(--green);color:var(--sheet)}
.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.save-off{max-width:1060px;margin:10px auto 0;padding:0 18px}
.save-off p{margin:0;padding:10px 14px;border-left:4px solid var(--red);background:var(--bad-bg);border-radius:6px;max-width:none}
main{max-width:1060px;margin:0 auto;padding:6px 18px 40px}
h1,h2{font-family:var(--font-math);font-weight:600;line-height:1.15;margin:0 0 .45em}
h1{font-size:clamp(1.6rem,3.6vw,2.2rem)}
h2{font-size:clamp(1.55rem,3.3vw,2rem)}
h3{font-size:1.15rem;line-height:1.3;margin:0 0 .45em}
h4{font-size:1rem;margin:0 0 .3em}
p{margin:0 0 .8em;max-width:68ch}
.muted{color:var(--ink-2)}
.tiny{font-size:.875rem}
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:clamp(16px,3vw,30px);margin:22px 0}

.part{margin-top:30px;padding-top:24px;border-top:1.5px dashed var(--rule)}

.steps .step{position:relative}
sup{font-size:.68em;line-height:0}

.va,.p-a{color:var(--acol)} .vn,.p-n{color:var(--pen)}
.p-k{color:var(--p-k)} .p-d{color:var(--p-d)} .p-c{color:var(--p-c)} .p-b{color:var(--p-b)} .p-t{color:var(--p-t)}

.uses{margin:10px 0 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);font-size:.95rem;max-width:68ch}
.q-prompt canvas.plot,.task + canvas.plot,.fig-sm{max-width:380px;margin-top:8px;font-weight:400}

.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--rule)}
.btn.sm{font-size:.92rem;padding:.45em .9em}

.btn:not(:disabled):hover{border-color:var(--pen)}
.btn.primary:not(:disabled):hover{background:var(--pen);border-color:var(--pen)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}
.hero.solo{grid-template-columns:minmax(0,1fr)}
.hero p{font-size:1.12rem}

.hero-eq sup{font-size:.55em}
.hero-fig{margin:0;min-width:0}

.plot-wrap{position:relative}

.drag-h:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.goal{padding:14px 0;border-bottom:1px solid var(--rule)}

.rate{display:flex;flex-wrap:wrap;gap:6px}
.rbtn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.32em .9em;font-size:.92rem}
.rbtn.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.was{margin:6px 0 0}
.q{padding:18px 0;border-bottom:1.5px dashed var(--rule)}
.q:last-child{border-bottom:0}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.qn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:.9rem;margin-top:1px}
.q-prompt{flex:1;font-weight:700;min-width:0}
.q-prompt .m{white-space:normal}
.opt .m,.fb .m,.hints .m,.refresh .m,.read .m{white-space:normal}
.tag{flex:0 0 auto;font-size:.8rem;font-weight:700;border:1.5px solid var(--ink-2);color:var(--ink-2);border-radius:999px;padding:.1em .7em;margin-top:2px}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.6em .8em;min-width:0}
.opt > span:last-child{min-width:0;overflow-wrap:anywhere}
.opt-mark{flex:0 0 auto;font-weight:700;color:var(--ink-2);min-width:1em}

.opt.wrong{border-color:var(--red);background:var(--bad-bg)}

.opt:not(:disabled):hover{border-color:var(--pen)}

.conf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}

.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fb{margin-top:12px;padding:12px 14px;border-radius:6px;border-left:4px solid var(--ink-2);background:var(--info-bg)}
.fb.good{border-left-color:var(--green);background:var(--good-bg)}
.fb.bad{border-left-color:var(--red);background:var(--bad-bg)}
.fb:focus{outline:none}
.fb p{margin:0 0 .4em;max-width:none}.fb p:last-child{margin:0}
.hints{margin-top:12px;padding:10px 14px;border:1.5px dashed var(--ink-2);border-radius:6px}
.hints p{margin:0 0 .4em;max-width:none}.hints p:last-child{margin:0}
.result{margin-top:14px}
.big-score{font:600 2.2rem/1 var(--font-math);margin:0 0 .3em}
.refresh{margin-top:12px;padding:12px 14px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.refresh p{margin:0}
.pg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"graph read" "ctrl read";gap:16px 28px;align-items:start}
.pg-graph{grid-area:graph;min-width:0}.pg-ctrl{grid-area:ctrl;min-width:0}.pg-read{grid-area:read;min-width:0}

.banner{min-height:1.6em;margin:0 0 8px;font-weight:700}
.banner.good{color:var(--green)}.banner.bad{color:var(--red)}
.slider{display:block;margin:0 0 6px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

input[type=range]{width:100%;accent-color:var(--pen);height:34px;margin:0}
.seg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}

.pred-q{font-weight:700}

/* hero */

.rs-hero.rm *{transition:none !important}

.rs-hit{border-left:3px solid var(--rule);padding-left:6px}
.rs-none{font-weight:700}
.rs-marks{border-top:1.5px solid var(--rule);padding-top:6px}
.rs-mrow{margin:0 0 6px}
.rs-mt{margin:0 0 4px}
.rs-pass{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:6px 12px;margin:0 0 10px}
.rs-ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.rs-ptext{font:400 1.05rem/1.6 var(--font-math);margin:4px 0}
.rs-note{width:100%;min-height:110px}
.rs-npv{font:400 1.02rem/1.6 var(--font-math);border:1.5px dashed var(--rule);border-radius:8px;padding:6px 10px;margin:0 0 8px}
.rs-kk.chips{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.rs-kk .chip{text-align:left}
.wc-facts{border:1.5px solid var(--rule);border-radius:8px;padding:6px 12px;background:var(--paper);margin:0 0 8px}
.wc-facts p{margin:4px 0}
.wc-tpl{font-size:.88rem;margin:0 0 8px}
ol.wcb{list-style:none;counter-reset:wcb;margin:0 0 10px;padding:0;display:grid;gap:6px}
.wcb-r{counter-increment:wcb;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet)}
.wcb-r.bad{border:2px dashed var(--ink)}
.wcb-x{font-weight:700;color:var(--ink)}
.wcb-r::before{content:counter(wcb);font:700 .8rem var(--font-ui);color:var(--ink-2);min-width:1.2em}
.wcb-l{font:700 .82rem var(--font-ui);color:var(--ink-2);min-width:8.5em}
.wcb-v,.wcb-f{font-family:var(--font-math);flex:1 1 12em;min-width:0;max-width:100%}
@media (max-width:560px){ .wcb-l{flex:1 1 auto} .wcb-v,.wcb-f{flex:1 1 100%;width:100%} }
.wcb-p{width:auto;min-width:5.6em}
.wcb-mv{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.wcb-mv .btn{min-width:34px;padding:.2em .5em}
.wcb-o{margin:0}
.wc-e{display:block;font:400 1.05rem/1.6 var(--font-math);overflow-wrap:anywhere}
.wc-i i{font-style:normal}
.hang .wc-e,.wc-e.hang,.wcb-o .wc-e{padding-left:2em;text-indent:-2em}

/* Part 3 */
.rs3-st{margin-top:8px}
.rs3-s{border-bottom:1px solid var(--rule);padding:8px 0}
.rs3-q{margin:0 0 6px}
.rs3-b{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin:10px 0;background:var(--sheet)}
.rs3-b h4{margin:0 0 4px}
.rs3-b textarea{width:100%;min-height:70px}
.rs3-sel{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}
.rs3-sel label{font-size:.88rem;font-weight:700;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0;max-width:100%}
.rs3-ev{margin:4px 0}
.rs3-claim{width:100%}
.rs3-crit{margin:6px 0;padding-left:1.2em}
.rs3-craft{list-style:none;padding:0;margin:6px 0}
.rs3-craft li{margin:3px 0}
.rs3-pol{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--paper);margin:6px 0}
.rs3-rule{border-left:4px solid var(--ink);padding-left:8px}

/* task */
.tb-e{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;margin:0 0 10px;background:var(--sheet)}
.tb-eh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 6px}
.tb-own{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:6px 10px}
.tb-own label{display:grid;gap:2px}
.tb-ann{width:100%;min-height:80px}
.tb-paraIn{width:100%;min-height:170px}
.tb-wch{text-align:center;margin:4px 0 6px}
.tb-list .wc-e{line-height:2}
.tb-annp{margin:0 0 10px 2em;font-size:.95rem}
.tb-para{white-space:pre-wrap}

</style>
</head>

<script>window.MV_PAYLOAD={"meta":{"id":"18-research-and-sources","nn":"18","slug":"research-and-sources","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 4","groupName":"Independent Study Unit (ISU)","trivium":"Logic","size":"M","storageKey":"eng4u-18-research-and-sources-v1","progressKey":"eng4u-progress-v1:18-research-and-sources","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"017b26d5","content":{"id":"18-research-and-sources","kind":"topic","title":"Research and secondary sources","topic":"Research & Secondary Sources","readyTopic":"research and secondary sources","hero":{"headline":"Join the conversation; don’t hide in it.","text":"Research is how your reading joins a conversation that started long before you. A \u003cstrong>secondary source\u003c/strong> (a critic’s article, a scholar’s book) comments on your \u003cstrong>primary source\u003c/strong>, the novel. In this module you’ll learn to judge which voices deserve your trust, take notes that are honest and your own, cite with \u003cstrong>MLA 9\u003c/strong> precision, and put critics in conversation with \u003cem>your\u003c/em> argument.","fig":{"html":"\u003cdiv class='rs-hero' id='rs-hero' role='group' aria-label='Samuel Johnson’s two sentences about knowledge. As they are read, a single book glows at the centre; then thin lines run out from it to a ring of other books and papers, like a conversation map. Final frame: your novel in the centre, critics around it, and the caption Your novel. Your voice. Their voices.'>\u003c/div>","caption":""},"passage":["Knowledge is of two kinds.","We know a subject ourselves,","or we know where we can find information upon it."],"cite":"Samuel Johnson, as recorded in James Boswell’s \u003cem>Life of Johnson\u003c/em> (1791)","caption":"Your novel. Your voice. Their voices.","readIt":"Read it yourself: read it aloud. Which kind of knowing do you rely on more?","ring":["critic","scholar","journal","encyclopedia","blog","study guide"]},"goals":["I can evaluate the credibility and usefulness of a source for literary research.","I can take notes as quotation, paraphrase or summary, without patchwriting.","I can write MLA 9 Works Cited entries and in-text citations.","I can verify quotations and claims, including those from AI tools, against the primary text.","I can put a critic in conversation with my own argument: agree and extend, complicate, or push back.","I can act with academic integrity, including following my teacher’s policy on generative AI."],"start":{"blocks":[{"title":"Word story: \u003cem>plagiarism\u003c/em>","html":"\u003cp>From Latin \u003cem>plagiarius\u003c/em>, a kidnapper, someone who stole a child or enslaved a free person. The Roman poet Martial used the word for a rival who passed off Martial’s verses as his own: the poems were his “children”, stolen.\u003c/p>\u003cp>To plagiarize, then, is to kidnap someone’s words. Citing is how you return them home.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Primary and secondary sources","goal":1,"prompt":"For an essay on \u003cem>The Great Gatsby\u003c/em>, which is the \u003cstrong>primary\u003c/strong> source?","options":[{"t":"A study guide’s chapter summary","why":"Secondary (and weak).","_n":"02c5","_k":"81e79da6"},{"t":"An encyclopedia entry on the 1920s","why":"Background, secondary.","_n":"12d5","_k":"27df97a8"},{"t":"A scholar’s article about the novel","why":"That comments on the primary source: secondary.","_n":"22e5","_k":"f9fee9d2"},{"t":"The novel itself","why":"The text you’re analysing is primary.","_n":"32f5","_k":"b16a1ebb"}],"hints":["Which text are you analysing?","Everything else comments on it.","The novel."]},{"id":"w2","skill":"Primary and secondary sources","goal":1,"prompt":"A \u003cstrong>scholarly journal article\u003c/strong> usually differs from a blog post because it…","options":[{"t":"Is always longer","why":"Length isn’t the difference.","_n":"4305","_k":"b3cd7946"},{"t":"Is always more recent","why":"Many blog posts are newer.","_n":"5315","_k":"dcf9846e"},{"t":"Is reviewed by other experts before publication and cites its evidence","why":"Peer review and documentation.","_n":"6325","_k":"85092bed"},{"t":"Has pictures","why":"Irrelevant.","_n":"7335","_k":"1e04a70a"}],"hints":["Who checks it before it appears?","Other experts.","Peer review and citations."]},{"id":"w3","skill":"Quoting and paraphrasing","goal":2,"prompt":"Which best describes a \u003cstrong>paraphrase\u003c/strong>?","options":[{"t":"The source’s sentence with a few synonyms swapped","why":"That’s patchwriting. Same shape, new words is still the source’s sentence. Close the source, then write the idea your way.","_n":"8345","_k":"4a42647e"},{"t":"Your own idea, with no source","why":"Then nothing is being paraphrased.","_n":"94d2","_k":"b2383ceb"},{"t":"The source’s idea in your own words and sentence structure, with a citation","why":"Their idea, your words and structure, and a citation.","_n":"a4c2","_k":"365016f3"},{"t":"An exact copy in quotation marks","why":"That’s a quotation.","_n":"b4b2","_k":"6bbc805a"}],"hints":["Whose idea, whose words?","Their idea, your words \u003cem>and\u003c/em> structure.","A cited restatement in your own words."]},{"id":"w4","skill":"Quoting and paraphrasing","goal":2,"prompt":"Which notes need a citation?","options":[{"t":"None, if it’s for a bibliography","why":"Every borrowed idea is cited.","_n":"c4a2","_k":"301cf930"},{"t":"Quotations and summaries only","why":"Paraphrases borrow ideas too. The idea is borrowed even when the words are yours, so cite it.","_n":"d512","_k":"cff81874"},{"t":"Quotations, paraphrases and summaries","why":"All borrow someone’s ideas.","_n":"e502","_k":"9c83b1a3"},{"t":"Quotations only","why":"Paraphrases borrow ideas too. The idea is borrowed even when the words are yours, so cite it.","_n":"f4f2","_k":"5406c87a"}],"hints":["Is the idea yours or borrowed?","All three are borrowed.","All three."]},{"id":"w5","skill":"Citation basics","goal":3,"prompt":"In MLA style, which is set in \u003cstrong>italics\u003c/strong>?","options":[{"t":"The author’s name","why":"Names are plain.","_n":"g4e2","_k":"3aa6d9e0"},{"t":"The page numbers","why":"Plain.","_n":"h552","_k":"904c46bc"},{"t":"The title of a journal, book or website","why":"The container is italic.","_n":"i542","_k":"fa5e2e33"},{"t":"The title of an article","why":"Articles go in quotation marks. Containers (journals, books, websites) are italic; parts inside them (articles, chapters, posts) go in quotation marks.","_n":"jd32","_k":"e85fd69f"}],"hints":["Is it a container or a part inside one?","Containers are italic.","The journal, book or website."]},{"id":"w6","skill":"Citation basics","goal":3,"prompt":"Which in-text citation is correct MLA for page 120 of an article by Adaeze Okafor?","options":[{"t":"(Okafor, p. 120)","why":"MLA uses no comma or “p.”","_n":"kd42","_k":"c6a730b9"},{"t":"(Okafor 120)","why":"Author, then page: no comma, no “p.”.","_n":"ld12","_k":"46b457a0"},{"t":"(Adaeze Okafor, 2019)","why":"MLA doesn’t use the year in the parentheses.","_n":"md22","_k":"dbbc9799"},{"t":"(120 Okafor)","why":"The author comes first.","_n":"ncf2","_k":"13c230b7"}],"hints":["Author, then page.","No comma, no “p.”","(Okafor 120)."]}],"refreshers":{"Primary and secondary sources":"The primary source is the text you analyse. Secondary sources comment on it. Scholarly sources are reviewed by experts and cite their evidence.","Quoting and paraphrasing":"Quote exact words in quotation marks. Paraphrase the idea in your own words and structure. Summarize the main point briefly. Cite all three.","Citation basics":"In-text: (Author page), e.g. (Okafor 120). Works Cited: containers in italics, parts in quotation marks, elements in MLA’s order."}}},"explore":{"heading":"Source evaluator","intro":"Six sources are waiting outside your essay. Question each one, take honest notes, and cite it precisely. Then decide who gets to speak.","m1":"Ask who’s accountable, what evidence is shown, and who checked it. An unsigned page or a chatbot can’t answer those.","m2":"Same shape, new words is still the source’s sentence. Close the source, then write the idea your way.","m3":"The idea is borrowed even when the words are yours, so cite it.","m5":"Check every quotation against your copy of the novel. Secondhand quotations drift, and AI ones can be invented.","m6":"Containers (journals, books, websites) are italic; parts inside them (articles, chapters, posts) go in quotation marks.","aha":"\u003cstrong>The most fluent source in the room (TextPal) is the least trustworthy one.\u003c/strong> Fluency isn’t evidence: a source earns trust by showing its work.","crit":[{"id":"A","t":"Authority","q":"Who wrote it, and are they accountable?"},{"id":"E","t":"Evidence","q":"Does it show and cite its evidence?"},{"id":"R","t":"Review","q":"Did editors or other experts check it?"},{"id":"P","t":"Purpose","q":"Is it informing, arguing, selling or entertaining?"},{"id":"C","t":"Currency","q":"Is it recent \u003cem>enough\u003c/em>? For criticism, an older essay can still be essential."}],"verdicts":[{"id":"cite","t":"Cite"},{"id":"bg","t":"Background only"},{"id":"dont","t":"Don’t use as evidence"}],"rule":"Verdict rule: total ≥ 8 → \u003cstrong>Cite\u003c/strong>; 5–7 → \u003cstrong>Background only\u003c/strong> (ideas and context; verify before relying on it; he American Dream itself. As the novel’s final page says, "},{"id":"q2","kind":"quote","t":"“Gatsby believed in the green light, the orgastic future that year by year recedes before us.”","real":true}],"ask":"What are your sources?","_a":"EnlSEFcWBUdVEVobEkULQEJSUhEIFiJcREtQB0BXCFEcEXFMEmUHWkRFGUIOUwkLZFlSQnVEAVREEXADRkUGTAweUg8MGEQECQMCTBJhDVlDXllOEnwFWFVCGULQtvhyQlRSDBJ6DVJYRURCU1gAFXdeWwYc1OSoEA1SDwx8C0BCX1YOElkCFXFcUhBbVQVbEH1SFkZTFkYMHlIPDBpEBwAAAkwQ"},"novel":[{"id":"n1","ch":1,"t":"In my younger and more vulnerable years my father gave me some advice that I’ve been turning over in my mind ever since."},{"id":"n2","ch":1,"t":"Involuntarily I glanced seaward—and distinguished nothing except a single green light, minute and far away, that might have been the end of a dock."},{"id":"n3","ch":2,"t":"This is a valley of ashes—a fantastic farm where ashes grow like wheat into ridges and hills and grotesque gardens","part":true},{"id":"n4","ch":3,"t":"In his blue gardens men and girls came and went like moths among the whisperings and the champagne and the stars."},{"id":"n5","ch":3,"t":"Every one suspects himself of at least one of the cardinal virtues, and this is mine: I am one of the few honest people that I have ever known."},{"id":"n6","ch":6,"t":"The truth was that Jay Gatsby of West Egg, Long Island, sprang from his Platonic conception of himself."},{"id":"n7","ch":9,"t":"Gatsby believed in the green light, the orgastic future that year by year recedes before us."},{"id":"n8","ch":9,"t":"So we beat on, boats against the current, borne back ceaselessly into the past."}],"library":[["Okafor, Adaeze","Borrowed Light: Narration and Guilt in The Great Gatsby","North Shore Review of Literature, vol. 41, no. 2","2019"],["(no author)","The Great Gatsby: Chapter 3 Summary","QuickLit Notes (website)","2021"],["Ng, Ricky","Why Nick Carraway Is a Liar","Reading in the Dark (blog)","2022"],["(no author)","Jazz Age","Northern Encyclopedia of Literature","2018"],["Lindqvist
