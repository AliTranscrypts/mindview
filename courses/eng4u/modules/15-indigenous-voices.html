<script>window.MV_PAYLOAD={"meta":{"id":"15-indigenous-voices","nn":"15","slug":"indigenous-voices","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 3","groupName":"Canadian Literature","trivium":"Rhetoric, Logic","size":"L","storageKey":"eng4u-15-indigenous-voices-v1","progressKey":"eng4u-progress-v1:15-indigenous-voices","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"cbf7092d","content":{"id":"15-indigenous-voices","kind":"topic","title":"Indigenous voices and Thomas King","topic":"Indigenous Voices & Thomas King","readyTopic":"reading “Borders” and Indigenous voices","hero":{"headline":"Who tells the story decides what the story is.","text":"In Thomas King’s “Borders”, a mother and her son set out to visit family across the Canada–US border. When the guard asks her citizenship, she gives one word, and the trip stops. In this module you’ll ask four questions of every telling: \u003cstrong>who tells it, to whom, with what authority, and what it leaves out.\u003c/strong> You’ll also practise \u003cstrong>reading responsibly\u003c/strong>, paying attention to the specific writer and text in front of you.","fig":{"html":"\u003cdiv class='iv-hero' id='iv-hero'>\u003c/div>","caption":""},"line":"The truth about stories is that that’s all we are.","cite":"(King, \u003ci>Truth\u003c/i> [p.])","word":"Blackfoot.","wordCite":"(King [p.])","questions":["Who tells it?","To whom?","With what authority?","What’s left out?"],"aria":"King’s sentence “The truth about stories is that that’s all we are.” appears word by word. Below it, two small border booths are drawn in thin lines, one at each edge, with a car stopped in the space between them. The word “Blackfoot.” appears above the car and holds. Four questions fade in: Who tells it? To whom? With what authority? What’s left out?","listen":"Listen","watch":"Watch again","noVoice":"Read the sentence aloud yourself, slowly."},"goals":["I can identify who tells a story, to whom, and with what authority, and explain how that shapes meaning in “Borders”.","I can explain how King uses humour, understatement and a story within the story to make serious points.","I can find what a telling leaves out, and explain why its silences matter.","I can analyse perspective and bias in a specific text without generalizing about a whole people.","I can explain responsible reading practices: crediting tellers, appreciation vs appropriation, and why the TRC’s calls matter to classrooms.","I can write an analytical response, in my own voice, about how perspective shapes meaning in “Borders”, with integrated, cited quotations."],"start":{"blocks":[{"title":"Word story: border","html":"\u003cp>\u003cstrong>\u003cem>Border\u003c/em>\u003c/strong> comes from the Old French \u003cem>bordure\u003c/em>, “edge, hem”. It’s related to a ship’s \u003cem>board\u003c/em>, its side. A border was first the edge of a cloth or a field, a line you could see. Political borders are edges drawn on maps, and “Borders” asks what happens when a person’s nation doesn’t stop at the line.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Narrator, speaker and perspective","goal":1,"prompt":"A story about a flood is told twice: once as a weather report, once by a farmer whose barn washed away. What changes most between the two?","options":[{"t":"The facts must contradict each other","why":"Perspective doesn’t mean lying. Both can be accurate and still differ.","_n":"039e","_k":"4fb776a1"},{"t":"Only the length","why":"Length is the least of it.","_n":"136e","_k":"f29ab2b3"},{"t":"The perspective: what’s noticed, what matters and how it feels","why":"Same event, different teller, different truth.","_n":"237e","_k":"752d6866"},{"t":"Nothing; an event is an event","why":"Who tells it shapes what we learn.","_n":"33ce","_k":"50ac89e8"}],"hints":["What would each teller notice?","Rainfall in millimetres vs a lost barn.","The perspective changes everything."]},{"id":"w2","skill":"Narrator, speaker and perspective","goal":4,"prompt":"A short story begins, “My mother and I left before sunrise.” Who is speaking?","options":[{"t":"The mother","why":"She’s mentioned; she isn’t speaking.","_n":"43de","_k":"0cc8d46c"},{"t":"The reader","why":"The reader listens; the narrator tells.","_n":"53ae","_k":"19ef2208"},{"t":"The narrator, a character the author created","why":"Even an “I” in fiction is a narrator, not simply the author.","_n":"63be","_k":"456af347"},{"t":"The author, describing his own trip","why":"Never assume the narrator is the author.","_n":"730e","_k":"ceb84b5f"}],"hints":["Who says “I”?","A character inside the story.","The narrator."]},{"id":"w3","skill":"Inference","goal":3,"prompt":"A town’s history plaque says: “Founded in 1851 by settlers who cleared the wilderness.” What does the plaque leave out?","options":[{"t":"The year","why":"The year is given.","_n":"831e","_k":"cb162031"},{"t":"Nothing; plaques are complete","why":"Every record selects.","_n":"9fac","_k":"2526b0f9"},{"t":"The settlers","why":"They’re named as the founders.","_n":"af9c","_k":"745a10a9"},{"t":"Anyone who lived on that land before 1851","why":"“Wilderness” erases the people already there.","_n":"bfcc","_k":"f1bb723f"}],"hints":["What does “wilderness” assume?","That no one was there.","The people already living there."]},{"id":"w4","skill":"Inference","goal":1,"prompt":"A form has two boxes: ☐ Canadian ☐ American. A traveller writes a third word beside them. What does that act suggest?","options":[{"t":"The form is broken","why":"The form works; it just has no room for the answer.","_n":"cfbc","_k":"2821d230"},{"t":"The traveller doesn’t accept that the two boxes describe who they are","why":"Writing outside the boxes questions the boxes.","_n":"dfec","_k":"b10c54d7"},{"t":"The traveller is joking","why":"It might be witty, but it’s a real claim.","_n":"efdc","_k":"7f8e0be0"},{"t":"The traveller can’t read","why":"Choosing a third answer is deliberate.","_n":"f00c","_k":"d51e5a79"}],"hints":["What does each box assume?","That there are only two possibilities.","The traveller refuses that assumption."]},{"id":"w5","skill":"Figurative language","goal":4,"prompt":"“Her people… unheeded lie, / Like the dead husks that rustle through her hands” (Johnson, “The Corn Husker”). What kind of figure is this, and what is compared?","options":[{"t":"Personification of the corn","why":"The husks don’t act human; people are compared to husks.","_n":"gffc","_k":"24eb2cc0"},{"t":"Alliteration","why":"Alliteration repeats sounds; this is a comparison.","_n":"h02c","_k":"b77474c5"},{"t":"A metaphor comparing her hands to corn","why":"“Like” makes it a simile, and the comparison is to her people.","_n":"i01c","_k":"d3d6562b"},{"t":"A simile comparing her ignored people to dry, discarded husks","why":"“Like” signals a simile; people are compared to husks.","_n":"j88c","_k":"9f1f1612"}],"hints":["Find the comparing word.","“Like”.","A simile: people ↔ husks."]},{"id":"w6","skill":"Perspective and bias in texts","goal":4,"prompt":"A news headline calls a family at a border crossing “stranded travellers”. Another calls them “protesters”. What does the word choice reveal?","options":[{"t":"That the family has two members","why":"The words describe what they’re doing, not how many there are.","_n":"k89c","_k":"c2140f8d"},{"t":"That one outlet has the facts wrong","why":"Both may be accurate; they frame differently.","_n":"l8ac","_k":"338de75e"},{"t":"Each outlet’s view of what the family is doing: suffering bad luck, or making a point","why":"One word frames the whole story.","_n":"m8bc","_k":"1f00e553"},{"t":"Nothing; they’re neutral labels","why":"Labels carry viewpoints.","_n":"n8cc","_k":"6a254c7e"}],"hints":["What does “stranded” imply? “Protesters”?","Accident vs intention.","The words reveal each outlet’s view."]}],"refreshers":{"Narrator, speaker and perspective":"The narrator (fiction) or speaker (poems) is a created voice. Perspective is the position a telling comes from: who sees, who speaks, what they care about.","Inference":"Ask what a word, a form or a detail assumes, and what it leaves unsaid.","Figurative language":"Similes compare with “like” or “as”. Ask what each side of the comparison brings to the other.","Perspective and bias in texts":"Word choice (“wilderness”, “stranded”, “protesters”) reveals a viewpoint. Bias isn’t only lying; it’s choosing what to call things."}}},"explore":{"heading":"Who tells the story?","intro":"One event in “Borders” (a mother answers “Blackfoot” at the border) told four ways. Switch between the tellings. Watch who speaks, to whom, with what authority, and what each one leaves out.","slots":[{"id":"x1","name":"Laetitia","where":"Early in the story: the narrator’s sister Laetitia leaves Standoff for Salt Lake City, and their mother decides to visit her.","opens":"","closes":"","pg":"[p.]","paras":[]},{"id":"x2","name":"The first crossing","where":"At the American border: from the guard’s first question about citizenship to the refusal of entry.","opens":"","closes":"","pg":"[p.]","paras":[]},{"id":"x3","name":"The second crossing","where":"Back at the Canadian border: the same exchange again.","opens":"","closes":"","pg":"[p.]","paras":[]},{"id":"x4","name":"Between","where":"The time in the car in the duty-free store’s parking lot between the two borders, including the night the mother tells her son a story about the stars.","opens":"","closes":"","pg":"[p.]","paras":[]},{"id":"x5","name":"The cameras","where":"The arrival of the reporters and television crews.","opens":"","closes":"","pg":"[p.]","paras":[]},{"id":"x6","name":"Through","where":"The resolution: the crossing at last, and the drive away from the border.","opens":"","closes":"","pg":"[p.]","paras":[]}],"copy":{"title":"Read in your copy","text":"“Borders” is in copyright, so this module quotes only the mother’s one-word answer. The details below describe each passage in our own words. Keep your copy of \u003ci>One Good Story, That One\u003c/i> open beside the switcher.","pageNote":"Where this module shows \u003cstrong>[p.]\u003c/strong>, use the page number from your class edition.","slotLabel":"Passage","where":"Where in the story"},"imagined":"Imagined: not part of King’s story","tellings":[{"id":"son","t":"The son","sub":"“Borders”, the narrator’s telling","kind":"story","who":"son","to":"readers","auth":"witness","whoT":"The son, the story’s narrator","toT":"Readers of the story (the son tells what he saw)","note":"Paraphrased for this module. Read the exact words in your copy.","groups":[{"slot":"x1","d":[{"id":"x1a","t":"Laetitia, the narrator’s sister, leaves Standoff to live in Salt Lake City.","ev":["trip"]},{"id":"x1b","t":"Their mother decides to drive across the border to visit her.","ev":["trip"]}]},{"slot":"x2","d":[{"id":"d2a","t":"At the American border, the guard asks the mother her citizenship.","ev":["ask"]},{"id":"d2b","t":"She answers with one word: “Blackfoot.”","ev":["answer"]},{"id":"d2c","t":"The guard asks her to choose: Canadian or American.","ev":["choose"]},{"id":"d2d","t":"She repeats “Blackfoot,” and they are turned back.","ev":["answer","refused"]}]},{"slot":"x3","d":[{"id":"d3a","t":"Back at the Canadian border, the guard asks the same question.","ev":["ask"]},{"id":"d3b","t":"Her answer is the same: “Blackfoot.”","ev":["answer"]}]},{"slot":"x4","d":[{"id":"d4a","t":"With neither border letting them through, they wait in their car in the duty-free store’s parking lot between the two borders.","ev":["wait"]},{"id":"d4b","t":"One night in the car, the mother tells her son a story about the stars.","ev":["stars"]}]},{"slot":"x5","d":[{"id":"d5a","t":"Reporters arrive at the border.","ev":["media"]},{"id":"d5b","t":"The narrator notices the cameras and the television crews.","ev":["media"]}]},{"slot":"x6","d":[{"id":"d6a","t":"At last, they are allowed through.","ev":["through"]},{"id":"d6b","t":"The story closes as they drive away from the border.","ev":["through"]}]}]},{"id":"i1","t":"Incident report","sub":"an imagined border form","kind":"record","imagined":true,"who":"official","to":"record","auth":"official","whoT":"A border official","toT":"Other officials; the record","holds":"Two citizenship choices","groups":[{"d":[{"id":"i1o","t":"SECONDARY REFERRAL. Adult female and minor travelling to Salt Lake City, Utah, to visit a relative.","ev":["trip"]},{"id":"i1a","t":"Asked to state country of citizenship.","ev":["ask"]},{"id":"i1b","t":"Subject answered ‘Blackfoot’ and \u003cspan class='iv-dts'>declined to state\u003c/span> ‘Canadian’ or ‘American’.","ev":["answer","choose","declined"]},{"id":"i1c","t":"Entry refused. Directed to return to the Canadian port of entry. Vehicle and identification recorded.","ev":["refused","recorded"]}]}]},{"id":"i2","t":"Evening news","sub":"an imagined TV item","kind":"broadcast","imagined":true,"who":"reporter","to":"public","auth":"media","whoT":"A news reporter","toT":"The public, a broadcast audience","groups":[{"d":[{"id":"i2a","t":"A mother and her son have spent days in a parking lot between two countries.","ev":["wait"]},{"id":"i2b","t":"The woman says she isn’t Canadian or American. She says she’s Blackfoot.","ev":["answer","choose","isnt"]},{"id":"i2c","t":"Officials on both sides say the rules are clear.","ev":["officials"]},{"id":"i2d","t":"Supporters have begun to gather, and the story has reached audiences across the continent.","ev":["media"]}]}]},{"id":"mom","t":"The mother’s own words","sub":"only what she says in “Borders”","kind":"spoken","who":"mother","to":"present","auth":"self","whoT":"The mother herself","toT":"The people present: the guards, and her son","note":"Her words as the plan quotes them. The notes in brackets say where she speaks.","groups":[{"d":[{"id":"md2b","t":"“Blackfoot.” \u003cspan class='iv-where'>(to the American guard’s question)\u003c/span>","ev":["answer","self"]},{"id":"md2d","t":"“Blackfoot.” \u003cspan class='iv-where'>(again, when asked to choose)\u003c/span>","ev":["answer","self"]},{"id":"md3b","t":"“Blackfoot.” \u003cspan class='iv-where'>(at the Canadian border)\u003c/span>","ev":["answer","self"]},{"id":"md4b","t":"\u003cspan class='iv-where'>[Her story about the stars, told to her son in the car at night: read it in your copy.]\u003c/span>","ev":["stars","self"]}]}]}],"ev":{"trip":"the trip to visit Laetitia","ask":"the citizenship question","_a":"QQoDRRBYXBcUBxQbENuy+CEOB1RbX10LF4DmqhI=","choose":"the two choices, Canadian or American","declined":"“declined to state”","refused":"being turned back","recorded":"the vehicle and identification recorded","self":"her own naming of her nation, in her own words","wait":"the days in the car between the borders","stars":"the stars story","media":"the reporters and cameras","officials":"officials saying the rules are clear","through":"being let through at last","isnt":"“isn’t Canadian or American”"},"modes":[{"id":"tell","t":"Tellings"},{"id":"voice","t":"Listening for the voice"},{"id":"mine","t":"Your reading"}],"how":{"tell":"Choose a telling. Tap a detail to select it, then mark it: \u003cstrong>only in this telling\u003c/strong> or \u003cstrong>left out elsewhere\u003c/strong>. Fill the Four Questions for each telling; the readout confirms them.","voice":"King’s story carries features of oral storytelling. Tap a feature chip under a detail to tag it. Your tags are yours and are never scored; \u003cstrong>Show one reading\u003c/strong> lays a reading beside them.","mine":"Add up to 8 short quotations from your own copy of “Borders” (each up to 200 characters, with a page), and fill the Four Questions for each. Only the structure is checked; what you type stays on this device."},"fq":{"title":"The Four Questions","who":{"q":"Who tells?","opts":[{"id":"son","t":"The son (the narrator)"},{"id":"official","t":"A border official"},{"id":"reporter","t":"A news reporter"},{"id":"mother","t":"The mother herself"}]},"to":{"q":"To whom?","opts":[{"id":"readers","t":"Readers of the story"},{"id":"record","t":"Other officials; the record"},{"id":"public","t":"The public, watching"},{"id":"present","t":"The people present"}]},"auth":{"q":"Authority claimed","opts":[{"id":"official","t":"Official"},{"id":"media","t":"Media"},{"id":"witness","t":"Personal witness"},{"id":"self","t":"Self-identification"}]},"left":{"q":"What’s left out?","how":"Tap details in the \u003cem>other\u003c/em> tellings and mark them “left out elsewhere”. They appear in the silence strip."},"pick":"Choose…"},"marks":{"only":"Only in this telling","away":"Left out elsewhere","clear":"Clear mark","sel":"Selected:","none":"Tap a detail to select it.","onlyTag":"only here","awayTag":"left out elsewhere"},"compare":"Compare two","second":"Second telling","listen":"Listen","stop":"Stop","noVoice":"No local voice on this device: read the telling aloud yourself, slowly.","strip":{"title":"Silence strip","empty":"Nothing yet. Mark details in the other tellings as “left out elsewhere”, and the ones this telling lacks appear here.","lead":"Found in other tellings, missing here:"},"readout":{"teller":"Teller","listener":"Listener","auth":"Authority claimed","holds":"What the form can hold","sil":"Silences found","only":"Details only this telling has"},"authNo":"Not this one. Ask \u003cem>why\u003c/em> this teller expects to be believed.","tc3":{"title":"Silence map: the incident report (challenge 3)","how":"Choose the \u003cstrong>two\u003c/strong> things the report leaves out that King’s story supplies.","opts":[{"id":"A","t":"why her answer is “Blackfoot”: a nation older than the line"},{"id":"B","t":"the days in the car between the borders, and the stars story"},{"id":"C","t":"that they were travelling to Salt Lake City"},{"id":"D","t":"that entry was refused"},{"id":"E","t":"that she wouldn’t say “Canadian” or “American”"},{"id":"F","t":"that they were directed back to Canada"}]},"voice":{"lens":"Lens","feats":[{"id":"rep","t":"Repetition","role":"syntax"},{"id":"under","t":"Understatement","role":"diction"},{"id":"hum","t":"Humour","role":"sound"},{"id":"story","t":"Story within the story","role":"theme"},{"id":"place","t":"Sense of place","role":"image"}],"notes":{"rep":"the answer “Blackfoot”, given again and again","under":"the son reports without commenting","hum":"the guards’ polite, useless questions","story":"the mother’s stars story","place":"the parking lot between borders"},"key":{"d2a":["hum"],"d2b":["under"],"d2c":["hum"],"d2d":["rep"],"d3a":["hum","rep"],"d3b":["rep","under"],"d4a":["place","under"],"d4b":["story"]},"show":"Show one reading","hide":"Hide the reading","reading":"one reading","johnson":{"title":"Comparison card: E. Pauline Johnson (Tekahionwake), “The Two Sisters”","text":"You can see them as you look towards the north and the west, where the dream-hills swim into the sky amid their ever-drifting clouds of pearl and grey.","cite":"Johnson, \u003ci>Legends of Vancouver\u003c/i> (1911), “The Two Sisters”, opening sentence","tags":[{"t":"address to the listener","role":"syntax","w":"You can see them"},{"t":"place pointed to","role":"image","w":"the north and the west"}],"note":"Johnson’s opening speaks straight to a listener and points to a place you could stand and look from: two features of a telling meant to be heard."}},"mine":{"max":8,"maxChars":200,"quoteL":"Quotation (exact words, up to 200 characters)","pageL":"Page","add":"Add to my reading","del":"Delete","leftL":"What’s left out? (a few words)","empty":"No quotations yet. Add your first one above.","full":"You’ve added 8 quotations, the most this list holds.","need":"Fill in the quotation and a page number.","done":"✓ All four questions filled","todo":"Fill the Four Questions"},"p1":{"alt":"“Canadian,” my mother said.","cap":"Imagined: if she had said “Canadian”, the rest of the story would have nowhere to go."},"p4":{"cap":"“declined to state” (the form) beside “Blackfoot” (her answer)"},"aha":"\u003cstrong>The form\u003c/strong> records the facts and misses the meaning: to the form, “Blackfoot” is a refusal to answer; in the son’s telling, it’s the answer. \u003cstrong>The news\u003c/strong> gets closer, but “isn’t Canadian or American” frames her by what she \u003cem>isn’t\u003c/em>. \u003cstrong>The son\u003c/strong>’s telling is the only one that lets us sit in the car between the borders, and hear the stars story.","predIntro":"Make a prediction first. Then the switcher shows you what happens.","predictions":[{"id":"p1","prompt":"If the mother had answered “Canadian”, what would change?","options":[{"t":"Laetitia would come to the border instead","_n":"o8dc","_k":"306362a4"},{"t":"There would be no story: her refusal of the guards’ categories is the conflict","_n":"p8ec","_k":"d37bf479"},{"t":"Only the length of the trip","_n":"q8fc","_k":"8c30e5f8"},{"t":"The guards would refuse her anyway","_n":"r80c","_k":"de78f8b5"}],"explain":"She understands the question. Her answer refuses its two choices and names her nation. Everything that follows grows from that one word."},{"id":"p2","prompt":"The guards keep asking, politely, for her to choose Canadian or American, and she keeps answering “Blackfoot”. What does this repetition do?","options":[{"t":"It turns the scene into gentle comedy that exposes how little room the system has for her answer","_n":"s81c","_k":"5a5f2bba"},{"t":"It means the narrator is bored","_n":"t8ec","_k":"9cfd41aa"},{"t":"It fills space","_n":"u8dc","_k":"7a69bb42"},{"t":"It shows the guards are cruel","_n":"v8cc","_k":"c3495e46"}],"explain":"The joke is that nobody is wrong, yet nothing fits. That’s the story’s critique, made with a straight face."},{"id":"p3","prompt":"The son tells the story. If the mother narrated it instead, what would most likely be lost?","options":[{"t":"The plot","_n":"w8bc","_k":"40b540be"},{"t":"The understatement: the son reports without explaining, so readers must see the meaning themselves","_n":"x92c","_k":"d42668a1"},{"t":"The humour would increase","_n":"y91c","_k":"7d573f44"},{"t":"The border","_n":"z90c","_k":"3eaaa902"}],"explain":"A child’s eye records the absurd without labelling it. The reader does the interpreting, and feels it more."},{"id":"p4","prompt":"The imagined incident report says she “declined to state” her citizenship. Is that accurate?","options":[{"t":"No, it’s a lie","_n":"108fc","_k":"71768416"},{"t":"It doesn’t matter","_n":"1186c","_k":"70eafca7"},{"t":"It’s accurate to the form, but it misrepresents her: she did state a citizenship, Blackfoot, that the form has no box for","_n":"1285c","_k":"ea63278c"},{"t":"Yes, completely","_n":"138cd","_k":"afb40f41"}],"explain":"Official tellings record what their boxes can hold. Ask what the boxes leave out."}],"chalIntro":"Use the switcher to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Mark the moment the story’s conflict is born: select that detail in the son’s telling. \u003cbutton type='button' class='btn ghost sm iv-setup' data-setup='tc1'>Set it up\u003c/button>","msgs":{"none":"Tap a detail in the son’s telling first.","d2a":"That’s the question. The conflict begins with her answer.","d3b":"That’s the second crossing. Find the first.","x1":"The trip begins there, but the conflict hasn’t started yet.","other":"Not that one. When does the trip stop?"},"why":"d2b: her first answer, “Blackfoot”, at the American border. One word, and the trip stops.","hints":["When does the trip stop?","At the first border, after one word.","d2b: “Blackfoot”, at the American crossing."]},{"id":"tc2","goal":1,"prompt":"Match each telling to the authority it claims: set \u003cstrong>Authority claimed\u003c/strong> in the Four Questions for all four tellings. \u003cbutton type='button' class='btn ghost sm iv-setup' data-setup='tc2'>Set it up\u003c/button>","msgs":{"unset":"Set the authority for all four tellings first.","momWit":"She isn’t reporting events; she’s naming who she is.","newsOff":"The news quotes officials, but its authority is the broadcast audience."},"general":"Not yet. Ask \u003cem>why\u003c/em> each teller expects to be believed.","why":"The son: personal witness. The incident report: official. The evening news: media. The mother’s own words: self-identification.","hints":["Ask \u003cem>why\u003c/em> each teller expects to be believed.","A form, a broadcast, an eyewitness, a person naming her own nation.","Official · media · witness · self-identification."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Silence map. Which \u003cstrong>two\u003c/strong> things does the incident report leave out that King’s story supplies? Choose them in the silence map under the tellings. \u003cbutton type='button' class='btn ghost sm iv-setup' data-setup='tc3'>Set it up\u003c/button>","msgs":{"few":"Choose two.","rec":"The report records that. Find what it has no room for."},"general":"Not yet. Find what matters in the story that a form couldn’t hold.","banner":"You’ve mapped a silence. The report isn’t false; it just has no box for what matters most. Ask this of every “official” telling you meet.","why":"A and B: her reason (a nation older than the line) and the time between the borders, with the stars story.","hints":["Read the report. What \u003cem>does\u003c/em> it say?","Now find what matters in the story that a form couldn’t hold.","Her reason, and the time between."]}]},"part3":{"slug":"responsibly","name":"Responsibly","heading":"Reading responsibly","intro":"Reading responsibly is a skill. Work through the stations: each asks you to judge a sentence, a choice or a scenario, then read why.","support":"This module touches on the history of injustice toward Indigenous peoples in Canada. If it brings up difficult feelings, talk to someone you trust, or contact the Hope for Wellness Help Line (1-855-242-3310, for Indigenous people across Canada) or Kids Help Phone (1-800-668-6868, or text CONNECT to 686868).","s1":{"title":"Station 1: one voice is not every voice","how":"Sort each sentence: does it read the text specifically, or sweep over a whole people?","bins":[{"id":"spec","t":"Specific to this text"},{"id":"sweep","t":"Sweeps over a whole people"}],"items":[{"id":"a","t":"In “Borders”, the mother’s one-word answer refuses the guards’ two categories.","_a":"QREWUlMb"},{"id":"b","t":"Indigenous people always refuse to cooperate with officials.","_a":"QRERUlVJEA==","better":"In “Borders”, the mother stays polite with the guards but will not choose between their two categories."},{"id":"c","t":"In “The Corn Husker”, Johnson ends with a simile that ties the husks in the woman’s hands to her people, “unheeded”.","_a":"QREWUlMb"},{"id":"d","t":"Native poems are all about nature.","_a":"QRERUlVJEA==","better":"In “The Corn Husker”, Johnson sets the woman’s labour in a clearing at harvest, then turns to her people’s loss of their lands."},{"id":"e","t":"The son in “Borders” reports the standoff without explaining it.","_a":"QREWUlMb"},{"id":"f","t":"Indigenous writers all use humour the way King does.","_a":"QRERUlVJEA==","better":"In “Borders”, King uses the guards’ polite, repeated questions to make their two categories look absurd."},{"id":"g","t":"Johnson’s “The Two Sisters” opens by pointing the listener toward a place: “the north and the west”.","_a":"QREWUlMb"},{"id":"h","t":"Every Indigenous family has the same story about borders.","_a":"QRERUlVJEA==","better":"In “Borders”, this family’s trip to visit Laetitia becomes a standoff over one word."}],"good":"Specific: it points to one text and one moment.","sweepOk":"Right: it speaks for a whole people. Rewrite it about this character and this scene. A better version:","wrongSpec":"Look again. It names one text and one moment, so it reads specifically.","wrongSweep":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author. Rewrite it about this character and this scene. A better version:"},"s2":{"title":"Station 2: the land before the line","card":"\u003cp>The story’s family comes from Standoff, Alberta, on the Kainai (Blood) reserve.\u003c/p>\u003cp>The Kainai are one of the nations of the Blackfoot Confederacy, whose territory stretches across what is now the Canada–US border.\u003c/p>","q":"How does knowing that the border was drawn \u003cem>through\u003c/em> Blackfoot territory change the meaning of the mother’s answer?","chips":[{"id":"a","t":"Her answer names a nation that existed before the line","best":true,"fb":"Yes. The line was drawn through her nation’s territory; her answer is older than the question."},{"id":"b","t":"Her answer is a joke with no meaning","fb":"The scene is funny, but the answer is a real claim: it names a nation."},{"id":"c","t":"Her answer shows she is lost","fb":"She understands the question perfectly. Her answer refuses its choices."},{"id":"d","t":"Her answer is about her sister","fb":"Laetitia is why they travel; the answer is about who the mother is."}]},"s3":{"title":"Station 3: credit the teller","card":"\u003cp>E. Pauline Johnson (Tekahionwake, 1861–1913) wrote \u003ci>Legends of Vancouver\u003c/i> (1911). The book names the teller of its legends: Chief Joe Capilano of the Squamish Nation.\u003c/p>","q":"Why does naming the teller matter?","chips":[{"id":"a","t":"It honours whose story it is and where it comes from","best":true,"fb":"Yes. A story belongs to a teller and a community; naming them keeps that link visible."},{"id":"b","t":"It makes the book longer","fb":"A name takes a line. What does it tell the reader?"},{"id":"c","t":"It proves the story is fiction","fb":"Naming a teller says where a story comes from, not whether it’s fiction."},{"id":"d","t":"It’s only a legal formality","fb":"It’s a matter of respect and accuracy, not just law."}]},"s4":{"title":"Station 4: appreciation or appropriation?","how":"For each scenario, choose, then read the explanation.","opts":[{"id":"ok","t":"Respectful"},{"id":"takes","t":"Takes what isn’t theirs"}],"items":[{"id":"a","t":"A class reads several Indigenous authors and studies each author’s Nation and context.","_a":"QQ0NFQ==","why":"Reading several writers, each in their own context, is specific and respectful."},{"id":"b","t":"A student writes a story narrated by a Blackfoot mother at a border.","_a":"QRYHXFVKEA==","why":"Respond in your own voice. Telling a community’s story as if you belonged to it can take what isn’t yours to take. Respond in your own voice instead: write \u003cem>about\u003c/em> “Borders”, as yourself."},{"id":"c","t":"A teacher invites a local Indigenous storyteller, following the community’s protocols and offering an honorarium.","_a":"QQ0NFQ==","why":"The storyteller tells their own stories, on the community’s terms, and is paid for their knowledge."},{"id":"d","t":"A team wears a headdress as a costume for spirit day.","_a":"QRYHXFVKEA==","why":"Some regalia carries sacred meaning and is earned or given, not worn as a costume."},{"id":"e","t":"A student quotes “Borders”, with full credit, in an essay.","_a":"QQ0NFQ==","why":"Quoting with credit, in your own analytical voice, is how readers respond to a text."}]},"s5":{"title":"Station 5: why schools teach these voices","card":"\u003cp>Canada’s Truth and Reconciliation Commission (final report, 2015) issued 94 Calls to Action. Several concern education, including calls to teach about residential schools, Treaties, and Indigenous peoples’ historical and contemporary contributions.\u003c/p>","q":"How does reading Indigenous writers in their own words differ from reading \u003cem>about\u003c/em> Indigenous peoples?","label":"Your answer (unscored; it stays on this device)"},"s6":{"title":"Station 6: who is an author speaking for?","card":"\u003cp>Readers sometimes ask how a writer’s own life and background relate to the stories they tell. These questions are worth asking carefully, with your teacher, and are never settled by guessing about any one person.\u003c/p>\u003cul>\u003cli>What does a reader owe a text, and what does a reader owe its author?\u003c/li>\u003cli>Who decides who belongs to a community, and who may speak about it?\u003c/li>\u003cli>How can you write about a story responsibly when questions about its author are open?\u003c/li>\u003c/ul>\u003cp class='tiny muted'>Discuss in class. Your teacher will guide the conversation.\u003c/p>"},"quickCheck":{"title":"Reading responsibly quick check","summary":"Reading responsibly quick check","items":[{"id":"q1","goal":4,"prompt":"Which sentence reads “Borders” specifically?","choices":[{"t":"The story is about every Indigenous family","fb":"Stay with this story and this character.","_n":"148dd","_k":"2a2c3bb9"},{"t":"Indigenous people never follow rules","fb":"Stay with this story and this character.","_n":"158ad","_k":"65b5d2f5"},{"t":"The mother’s answer refuses the guards’ two categories","fb":"Right. It stays with this story and this character.","_n":"168bd","_k":"ff2e303a"},{"t":"All Native stories are about borders","fb":"Stay with this story and this character.","_n":"1790d","_k":"582154d9"}]},{"id":"q2","goal":3,"prompt":"Why does the mother’s answer carry weight beyond the scene?","choices":[{"t":"It shows she misunderstood","fb":"Station 2 explains the land before the line.","_n":"1891d","_k":"5333fa3f"},{"t":"It’s about the duty-free shop","fb":"Station 2 explains the land before the line.","_n":"198ed","_k":"aab0cf3d"},{"t":"It’s only a joke","fb":"Station 2 explains the land before the line.","_n":"1a8fd","_k":"8c8c279e"},{"t":"It names a nation whose territory the border crosses","fb":"Right. The line was drawn through Blackfoot territory.","_n":"1b84d","_k":"dff133ac"}]},{"id":"q3","goal":5,"prompt":"A student wants to honour King’s story. Which choice is respectful?","choices":[{"t":"Invent a Blackfoot legend","fb":"Respond as yourself, a reader.","_n":"1c85d","_k":"adbb83f7"},{"t":"Write an essay about the story, in the student’s own voice","fb":"Right. Respond as yourself, a reader.","_n":"1d92d","_k":"6544c51b"},{"t":"Write a sequel narrated as the mother","fb":"Respond as yourself, a reader.","_n":"1e91d","_k":"9526dcee"},{"t":"Retell a sacred story found online","fb":"Respond as yourself, a reader.","_n":"1f94d","_k":"447faa68"}]},{"id":"q4","goal":5,"prompt":"The TRC’s Calls to Action (2015) include calls about…","choices":[{"t":"Education about residential schools, Treaties and Indigenous contributions","fb":"Right. Several calls concern what schools teach.","_n":"1g93d","_k":"4cdb65b5"},{"t":"School sports funding","fb":"Several calls concern what schools teach.","_n":"1h8ed","_k":"7fe9e564"},{"t":"Building new highways","fb":"Several calls concern what schools teach.","_n":"1i8dd","_k":"4793fbac"},{"t":"Changing the national anthem","fb":"Several calls concern what schools teach.","_n":"1j90d","_k":"a40b19d0"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“Age in her fingers, hunger in her face”\u003c/p>\u003cp class='eng-cite'>(Johnson, “The Corn Husker”, line 5)\u003c/p>\u003cp>\u003cstrong>Pattern:\u003c/strong> [noun] in her (his, their) [body part], [noun] in her (his, their) [body part]: a two-part portrait in which each feeling or force is lodged in a part of the body.\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “Patience in her hands, the whole border in her silence.”\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> write one about a person you know. Make it a real person seen closely, never a stereotype or caricature.\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"Age in her fingers, hunger in her face","source":"Johnson, “The Corn Husker”","save":"Save it to my Art of Language notebook"}},"practice":{"activities":[{"id":"sweep","type":"sorter","title":"Specific or sweeping?","summary":"Specific or sweeping?","goal":[4,5],"noun":"claim","txt":true,"instruction":"Sort each claim about a text.","how":"Tap a claim, then tap the box it belongs in.","boxes":[{"id":"close","label":"Reads the text closely"},{"id":"sweep","label":"Sweeps over a whole people"},{"id":"nosup","label":"Not supported by the text"}],"wrongDefault":"Ask: does it point to a specific text? Does it speak for a whole people? Does the text back it up?","items":[{"id":"i1","t":"“In ‘Borders’, the mother answers ‘Blackfoot’ at both crossings, refusing the guards’ two choices.”","_a":"QQEKWENcEA==","why":"It points to one story and one repeated moment.","wrong":{"sweep":"It names one story and one character.","nosup":"She does answer “Blackfoot” at both crossings."},"hints":["Does the claim point to a specific text?","Does it speak for a whole people?","Reads the text closely: one story, one repeated moment."]},{"id":"i2","t":"“Indigenous people are always connected to nature.”","_a":"QRERUlVJEA==","why":"It speaks for millions of people and points to no text.","wrong":{"close":"There’s no text here: it’s a claim about millions of people. Point to one writer and one passage.","nosup":"It’s worse than unsupported: it speaks for a whole people."},"hints":["Does the claim point to a specific text?","Does it speak for a whole people?","Sweeps over a whole people: no text, millions of people."]},{"id":"i3","t":"“The narrator’s calm, unexplained reporting lets the absurdity of the standoff speak for itself.”","_a":"QQEKWENcEA==","why":"It describes how this narrator tells this story.","hints":["Does the claim point to a specific text?","Does it speak for a whole people?","Reads the text closely: it describes this narrator’s method."]},{"id":"i4","t":"“The mother in ‘Borders’ hates the guards.”","_a":"QQwJREVJEA==","why":"She stays calm and polite; nothing shows hatred.","wrong":{"close":"She stays calm and polite; nothing shows hatred.","sweep":"It’s about one character, but the story doesn’t back it up."},"hints":["Does the claim point to a specific text?","Does the text back it up?","Not supported: she stays calm and polite."]},{"id":"i5","t":"“All Indigenous stories have tricksters.”","_a":"QRERUlVJEA==","why":"“All” speaks for every storyteller of many Nations.","wrong":{"close":"There’s no text here. Point to one writer and one passage."},"hints":["Does the claim point to a specific text?","Does it speak for a whole people?","Sweeps over a whole people: “all” stories, of many Nations."]},{"id":"i6","t":"“The mother’s story about the stars is a story told inside the story.”","_a":"QQEKWENcEA==","why":"It names one element of this story’s structure.","hints":["Does the claim point to a specific text?","Does it speak for a whole people?","Reads the text closely: a story within the story."]},{"id":"i7","t":"“The guards in ‘Borders’ break the law by refusing entry.”","_a":"QQwJREVJEA==","why":"Nothing in the story shows the guards breaking the law; they apply the rules they have.","wrong":{"close":"The guards apply their rules; the story never shows them breaking the law."},"hints":["Does the claim point to a specific text?","Does the text back it up?","Not supported: the guards apply the rules they have."]},{"id":"i8","t":"“Native writers only write about the past.”","_a":"QRERUlVJEA==","why":"It speaks for every Native writer; “Borders” itself is set at a modern border crossing.","wrong":{"close":"There’s no text here. Point to one writer and one passage."},"hints":["Does the claim point to a specific text?","Does it speak for a whole people?","Sweeps over a whole people: every Native writer."]},{"id":"i9","t":"“In ‘The Corn Husker’, the speaker blames ‘might’s injustice’ for her people’s loss of land.”","_a":"QQEKWENcEA==","why":"It quotes line 10 of one poem.","hints":["Does the claim point to a specific text?","Does it speak for a whole people?","Reads the text closely: it quotes line 10."]},{"id":"i10","t":"“The mother in ‘Borders’ plans to move to the United States for good.”","_a":"QQwJREVJEA==","why":"She’s travelling to visit Laetitia.","wrong":{"close":"She’s travelling to visit Laetitia."},"hints":["Does the claim point to a specific text?","Does the text back it up?","Not supported: she’s travelling to visit Laetitia."]}]},{"id":"husker","type":"custom","title":"“The Corn Husker”: an unseen poem","summary":"The Corn Husker","star":true,"goal":[1,3,4,6],"instruction":"Read the poem by E. Pauline Johnson (Tekahionwake). Then answer six questions. R4 to R6 sit above Final Check level.","how":"","poem":["Hard by the Indian lodges, where the bush","Breaks in a clearing, through ill-fashioned fields,","She comes to labour, when the first still hush","Of autumn follows large and recent yields.","","Age in her fingers, hunger in her face,","Her shoulders stooped with weight of work and years,","But rich in tawny colouring of her race,","She comes a-field to strip the purple ears.","","And all her thoughts are with the days gone by,","Ere might’s injustice banished from their lands","Her people, that to-day unheeded lie,","Like the dead husks that rustle through her hands."],"cite":"E. Pauline Johnson (Tekahionwake), “The Corn Husker”, \u003ci>Flint and Feather\u003c/i> (1912)","period":"This poem was published over a century ago and uses some terms of its time (“Indian lodges”, “race”). When you quote it, quote accurately; when you write about it, use current, specific terms such as “Indigenous”, “First Nations”, or the Nation’s own name.","items":[{"id":"r1","goal":1,"prompt":"\u003cstrong>R1.\u003c/strong> Who sees the woman in the poem?","options":[{"t":"Her people","why":"Her people are remembered in her thoughts; they don’t see her in the poem.","_n":"1k8fd","_k":"b0fa407c"},{"t":"The reader, who is addressed as “you”","why":"The poem never says “you”; an observing speaker describes her.","_n":"1l8ad","_k":"5edb6a94"},{"t":"The woman herself","why":"She’s described (“she comes”), not speaking; the speaker watches.","_n":"1m89d","_k":"39cc8635"},{"t":"An observing speaker, outside her","why":"The speaker watches and describes her.","_n":"1n00c","_k":"fb7bb949"}],"hints":["Is the woman speaking, or being described?","“She comes”: third person.","An observing speaker, outside her."]},{"id":"r2","goal":3,"prompt":"\u003cstrong>R2.\u003c/strong> Where does the poem turn from the present scene to history?","options":[{"t":"Line 5, “Age in her fingers, hunger in her face”","why":"Line 5 continues the portrait; line 9 moves into memory.","_n":"1o01c","_k":"1d0f3e1e"},{"t":"Line 9, “And all her thoughts are with the days gone by”","why":"“Days gone by” moves from the field into memory.","_n":"1p02c","_k":"aa446945"},{"t":"Line 12, “Like the dead husks that rustle through her hands”","why":"Line 12 returns to her hands; the turn to memory comes earlier.","_n":"1q03c","_k":"aa0e4fba"},{"t":"Line 1, “Hard by the Indian lodges, where the bush”","why":"Line 1 sets the present scene.","_n":"1rfcc","_k":"8420cb87"}],"hints":["Look for a time phrase.","“Days gone by”.","Line 9."]},{"id":"r3","goal":4,"prompt":"\u003cstrong>R3.\u003c/strong> In the final simile, what is compared to “dead husks”?","options":[{"t":"Her hands","why":"The husks rustle \u003cem>through\u003c/em> her hands; her people are what they’re compared to.","_n":"1sfdc","_k":"69302fa1"},{"t":"Her thoughts","why":"Her thoughts are with the days gone by; the simile compares her people.","_n":"1tfec","_k":"312a7bb7"},{"t":"The fields","why":"The fields are the setting; the simile compares her people.","_n":"1uffc","_k":"0afa7c0d"},{"t":"Her people, “unheeded”","why":"“Her people… unheeded lie, / Like the dead husks”.","_n":"1v08c","_k":"14283529"}],"hints":["Find “Like”.","What “unheeded lie”?","Her people."]},{"id":"r4","goal":3,"star":true,"prompt":"\u003cstrong>R4 ★.\u003c/strong> Why might the poem end on the sound of husks “that rustle through her hands”?","options":[{"t":"The faint sound makes the ignored people audible, just barely, so the reader hears what the world “unheeds”","why":"The ending lets us hear the “unheeded”.","_n":"1w09c","_k":"65d75121"},{"t":"Because husks are the loudest part of corn","why":"A rustle is quiet: easy to ignore, but there.","_n":"1x86c","_k":"73d2f5de"},{"t":"To show that she is tired of her work","why":"The line is about her people, not her mood.","_n":"1y85c","_k":"83f40d90"},{"t":"To describe the harvest","why":"That reads the line literally; the simile ties the harvest to a people’s dispossession.","_n":"1z84c","_k":"f844b73e"}],"hints":["What kind of sound is a rustle?","Quiet, easy to ignore, but there.","The ending lets us hear the “unheeded”."]},{"id":"r5","goal":4,"star":true,"prompt":"\u003cstrong>R5 ★.\u003c/strong> Which phrase most directly names the cause of loss?","options":[{"t":"“ill-fashioned fields” (line 2)","why":"That describes the fields, not who caused the banishment.","_n":"2083c","_k":"107de27a"},{"t":"“might’s injustice” (line 10)","why":"Power used unjustly “banished” her people “from their lands”.","_n":"2182c","_k":"2a00b105"},{"t":"“weight of work and years” (line 6)","why":"That explains her stooped shoulders, not her people’s loss.","_n":"2281c","_k":"7a113cea"},{"t":"“the days gone by” (line 9)","why":"That names the time remembered, not the cause.","_n":"2380c","_k":"2feda352"}],"hints":["Which phrase says \u003cem>why\u003c/em> they lost their lands?","Look at line 10.","“might’s injustice”."]},{"id":"r6","goal":6,"star":true,"prompt":"\u003cstrong>R6 ★ (transfer).\u003c/strong> Johnson’s speaker makes the “unheeded” audible; King’s son makes a one-word answer impossible to ignore. What do the two techniques share?","options":[{"t":"Both make a quiet, overlooked voice the centre of attention","why":"Each text turns attention to what others overlook.","_n":"247fc","_k":"a6108b61"},{"t":"Both are angry","why":"Neither text shouts; both work through restraint.","_n":"258ec","_k":"6ae69f7d"},{"t":"Both are told by the author","why":"A speaker and a narrator, created voices, tell them.","_n":"268dc","_k":"83ec7fd3"},{"t":"Both use rhyme","why":"“Borders” is prose; the shared move is about attention, not sound.","_n":"2784b","_k":"96828d25"}],"hints":["What does each text make us notice?","Something quiet that others overlook.","Both centre an overlooked voice, with restraint."]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Tomiko","goal":[1,4,6],"instruction":"Tomiko made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"Citations use the class-edition page, shown here as [p.].","problems":[{"id":"e1","goal":4,"task":"Analyse the narrator’s perspective in “Borders”.","steps":["“Borders” is told by the son, who travels with his mother to visit his sister in Salt Lake City.","King tells us he didn’t understand why his mother wouldn’t just say “Canadian.”","Because the narrator reports without explaining, the reader has to grasp the meaning of “Blackfoot” (King [p.]).","That gap between what he says and what we understand is where the story’s irony lives."],"_a":"Ug==","stepFb":["Correct.","","Fine; the problem is earlier.","Good analysis."],"fixes":[{"t":"“King admits he was confused.”","why":"Author ≠ narrator.","_n":"2885b","_k":"83cbd1b3"},{"t":"Delete the sentence.","why":"The idea is useful; the attribution is wrong.","_n":"2982b","_k":"db1c23fd"},{"t":"Sentence 2 is correct.","why":"King wrote the story; the son narrates it.","_n":"2a83b","_k":"806f6950"},{"t":"“The son never explains his mother’s answer; he simply reports it, leaving readers to understand why she won’t say ‘Canadian.’”","why":"The telling belongs to the narrator. The son narrates. King wrote him. Say “the narrator notices…”.","_n":"2b80b","_k":"fedb4d5b"}],"hints":["Who is the “I” in the story?","The son, not King.","Attribute the telling to the narrator."]},{"id":"e2","goal":1,"task":"Explain how the television crews change the situation.","steps":["After days in the parking lot, reporters and cameras arrive at the border.","They film the car, they talk to the mother, they talk to the guards, and then more crews come, and then the story is on television.","Once the private standoff becomes a public story, the guards’ rules suddenly look different to everyone watching.","King shows that who hears a story can change what happens next."],"_a":"Ug==","stepFb":["Correct summary, briefly.","","This is the analysis that belongs earlier.","Good."],"fixes":[{"t":"“The cameras turn a private standoff into a public telling, and a story told to the whole continent puts pressure on the rules that a single guard could ignore.”","why":"It says what the cameras \u003cem>do\u003c/em> to the story.","_n":"2c81b","_k":"085b9543"},{"t":"Sentence 2 is correct.","why":"It retells; it doesn’t analyse. That tells what happens. Analysis says how \u003cem>who tells it\u003c/em> shapes what it means.","_n":"2d7eb","_k":"ae422c26"},{"t":"Delete sentence 3.","why":"Sentence 3 is the strongest.","_n":"2e7fb","_k":"5697f794"},{"t":"Add what the reporters wore.","why":"More summary isn’t analysis.","_n":"2f8cb","_k":"2f27df9b"}],"hints":["Is sentence 2 explaining or retelling?","Retelling.","Say what the cameras \u003cem>do\u003c/em> to the story."]},{"id":"e3","goal":6,"task":"Use a quotation from the first crossing.","steps":["The guard’s question assumes there are only two possible answers.","The mother refuses that assumption.","“Blackfoot.”","Her one word names a nation the guard’s two choices cannot hold."],"_a":"UQ==","stepFb":["A clear claim.","Good observation.","","Sharp analysis, but the quotation needs integrating."],"fixes":[{"t":"Sentence 3 is correct.","why":"A dropped quotation has no signal phrase and no citation.","_n":"2g8db","_k":"12d41e05"},{"t":"“When asked her citizenship, she answers with one word, ‘Blackfoot’ (King [p.]).”","why":"A signal phrase introduces the word, and the citation follows it.","_n":"2h0ab","_k":"2c2c62ac"},{"t":"Put the citation at the end of the paragraph.","why":"Cite each quotation where it appears.","_n":"2i09b","_k":"d06772d2"},{"t":"Remove the quotation marks.","why":"Exact words need them.","_n":"2j0cb","_k":"9692a90f"}],"hints":["How is the quotation introduced?","It isn’t.","A signal phrase plus (King [p.])."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which telling in Explore surprised you most once you’d heard the others: the son’s, the form’s or the news item’s? What did it make you notice?"},{"id":"j2","q":"In your own words, explain King’s idea that “the truth about stories is that that’s all we are”, using one moment from “Borders”."},{"id":"j3","q":"Explain to a friend how to write about “Borders” specifically and respectfully, in two or three practical steps."},{"id":"j4","q":"Where do you stand as a reader of this story? What do you bring, what might you be missing, and what will you do to read more fully?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from today that you want to keep, from “Borders”, \u003ci>The Truth About Stories\u003c/i> or Johnson. Write one line on why.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one craft principle you’ve earned, in your own words. Add a master’s example: a short quotation from “Borders” (with its page) or a line from Johnson. Then write your own sentence using the principle, in your own voice.","placeholder":"e.g. Ask what the official form had no box for.","examples":["“Blackfoot.” (King [p.])","“The truth about stories is that that’s all we are.” (King, \u003ci>Truth\u003c/i> [p.])","“Age in her fingers, hunger in her face” (Johnson, line 5)","“Like the dead husks that rustle through her hands.” (Johnson, line 12)","“You can see them as you look towards the north and the west, where the dream-hills swim into the sky amid their ever-drifting clouds of pearl and grey.” (Johnson, “The Two Sisters”)"]},"artSamples":[{"p":"Let one repeated word do the arguing.","tag":"Rhetoric"},{"p":"Ask what the official form had no box for.","tag":"Logic"}],"principleMax":140},"final":{"intro":"Citations to “Borders” use the class-edition page, shown as [p.].","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which set of questions best analyses the perspective of a telling?","options":[{"t":"Whether it is true or false","why":"Accurate tellings still differ in perspective.","_n":"2k0bb","_k":"cf80ed67"},{"t":"What genre it is and how many characters it has","why":"Genre and cast don’t decide perspective.","_n":"2l0eb","_k":"aced66ff"},{"t":"Who tells it, to whom, with what authority, and what it leaves out","why":"The module’s four questions.","_n":"2m0db","_k":"7cfd2964"},{"t":"When it was printed, how long it is, and what font it uses","why":"Those are features, not perspective.","_n":"2n10b","_k":"df5982c7"}]},"b":{"prompt":"A telling’s “authority” refers to…","options":[{"t":"whether the telling uses formal language","why":"Formality can signal authority but isn’t the same thing.","_n":"2o0fb","_k":"7acd0487"},{"t":"the kind of standing the teller claims, such as official, media, witness or self-identification","why":"Authority is why a teller expects to be believed.","_n":"2p02b","_k":"766b28f3"},{"t":"the author’s legal rights","why":"That’s copyright, not narrative authority.","_n":"2q01b","_k":"219aa4f2"},{"t":"the number of readers","why":"Popularity isn’t authority.","_n":"2rfda","_k":"a856bcd3"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Who narrates “Borders”?","options":[{"t":"The mother","why":"She speaks in the story but doesn’t narrate it.","_n":"2sfca","_k":"9c17d0c5"},{"t":"Thomas King, describing his own childhood","why":"The son narrates. King wrote him. Say “the narrator notices…”.","_n":"2tfba","_k":"1a2e16db"},{"t":"The son, who travels with his mother","why":"He tells what he sees.","_n":"2ufaa","_k":"cbf35f46"},{"t":"Laetitia","why":"She’s the sister they travel to visit.","_n":"2v01a","_k":"0d075d70"}]},"b":{"prompt":"In “Borders”, where do the mother and son wait while neither border will let them through?","options":[{"t":"In a hotel in Montana","why":"They can’t enter the United States.","_n":"2w00a","_k":"0a740968"},{"t":"At home in Standoff","why":"They can’t go back either.","_n":"2xffa","_k":"cf55fe1b"},{"t":"In their car, in the duty-free store’s parking lot between the two borders","why":"They wait between the two crossings.","_n":"2yfea","_k":"6ec76dae"},{"t":"In Laetitia’s apartment in Salt Lake City","why":"That’s their destination.","_n":"2z05a","_k":"c90e4308"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which storytelling device does King use when the mother answers “Blackfoot” at both crossings?","options":[{"t":"Flashback","why":"The scene happens in order.","_n":"3004a","_k":"f2001358"},{"t":"Rhyme","why":"There’s no rhyme.","_n":"31779","_k":"e2466b1b"},{"t":"Foreshadowing","why":"It’s the conflict itself, not a hint of it.","_n":"32789","_k":"a338d2fb"},{"t":"Repetition, which builds both comedy and conviction","why":"The same answer, again and again.","_n":"33799","_k":"98018b20"}]},"b":{"prompt":"What is the mother’s story about the stars, told in the car at night, an example of?","options":[{"t":"A flashback to Laetitia’s childhood","why":"It isn’t a memory of Laetitia.","_n":"347a9","_k":"db9b6878"},{"t":"An epilogue","why":"It happens in the middle of the story.","_n":"357b9","_k":"0b473116"},{"t":"A news report","why":"It’s told privately, to her son.","_n":"367c9","_k":"fbb8eaf4"},{"t":"A story within the story","why":"A tale told inside the main story.","_n":"377d9","_k":"78c74751"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"A park sign reads: “Heritage Trail, est. 1998.” An Elder tells a class: “My uncles carried canoes on this trail long before I was born.” What best explains the difference?","options":[{"t":"The sign is lying","why":"It’s accurate about 1998; it simply leaves out the earlier history.","_n":"387e9","_k":"539a92d8"},{"t":"They are about different trails","why":"Nothing suggests that.","_n":"397f9","_k":"c53bb806"},{"t":"The Elder is mistaken, because the sign is official","why":"Official doesn’t mean complete.","_n":"3a809","_k":"a4526191"},{"t":"The sign dates the trail from when it was officially named; the Elder’s telling carries a much longer history the sign leaves out","why":"Each telling has a teller and a purpose.","_n":"3b09a","_k":"1be53164"}]},"b":{"prompt":"A town brochure says: “Our harbour was discovered in 1785.” A fisher whose family has lived there for generations says, “My great-great-grandmother fished here before any ship came.” What best explains the difference?","options":[{"t":"Both mean the same thing","why":"“Discovered” erases those already there.","_n":"3c08a","_k":"0703bacf"},{"t":"The fisher is exaggerating, since brochures are researched","why":"Every telling has a teller and a purpose, including official ones. Ask what each one leaves out.","_n":"3d0ba","_k":"bb8f697e"},{"t":"The brochure is false about the ships","why":"The issue is what “discovered” leaves out.","_n":"3e0aa","_k":"cc910f80"},{"t":"“Discovered” records the newcomers’ arrival; the family’s telling carries an older presence the brochure omits","why":"One word decides whose history counts.","_n":"3f0da","_k":"822b25c5"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Passage (written for this module): “My uncle says the government gave us a map of our own land, ‘in case we got lost.’ Everyone laughed. Then nobody said anything for a while.” What does the humour most likely do?","options":[{"t":"It exposes the absurdity of outsiders mapping land the family already knows, and the silence that follows shows the pain under the joke","why":"The joke and the silence work together.","_n":"3g0ca","_k":"7cc2e2a3"},{"t":"It shows the family doesn’t take the issue seriously","why":"The comedy at the border is the critique. A joke can be the most serious line in a story.","_n":"3h0fa","_k":"a716ffd6"},{"t":"It proves the uncle got lost","why":"He’s being ironic.","_n":"3i0ea","_k":"86935958"},{"t":"It is unrelated to land","why":"The joke is entirely about land.","_n":"3j01a","_k":"7d1062c7"}]},"b":{"prompt":"In “Borders”, the guards stay polite and keep asking the same question. Why might King make the scene funny rather than angry?","options":[{"t":"Because the guards are joking with her","why":"They’re serious; the situation is absurd.","_n":"3k00a","_k":"02a4972f"},{"t":"To show the issue isn’t serious","why":"The comedy at the border is the critique. A joke can be the most serious line in a story.","_n":"3l03a","_k":"58b2ffb3"},{"t":"To make the guards the heroes","why":"Nobody is a hero or villain; the categories are the problem.","_n":"3m04a","_k":"b4bda959"},{"t":"The calm comedy shows that the problem is the system’s categories, not a villain, and that is harder to dismiss","why":"Nobody is wrong, yet nothing fits.","_n":"3n01a","_k":"a909aaf0"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"What is the most significant silence in the guard’s question “Canadian or American?”","options":[{"t":"It doesn’t mention Salt Lake City","why":"The destination isn’t the issue.","_n":"3o02a","_k":"31af7d45"},{"t":"It doesn’t say which border crossing they’re at","why":"That’s beside the point.","_n":"3pffa","_k":"8d54b20c"},{"t":"It doesn’t ask about the car","why":"Irrelevant to identity.","_n":"3q00a","_k":"2ccc9eb1"},{"t":"It has no room for a nation, like the Blackfoot Confederacy, that existed before the border and spans it","why":"The two choices leave out her nation.","_n":"3rfda","_k":"7f2a4abf"}]},"b":{"prompt":"The imagined news item says the woman “isn’t Canadian or American”. What does that phrasing leave out?","options":[{"t":"That supporters gathered","why":"It reports that, too.","_n":"3sfea","_k":"a4cfd700"},{"t":"That officials commented","why":"It reports that.","_n":"3t0ba","_k":"1a99bbee"},{"t":"Where the parking lot is","why":"The location isn’t the silence that matters.","_n":"3u0ca","_k":"b67a8e76"},{"t":"What she \u003cem>is\u003c/em>: a member of the Blackfoot nation, which she named herself","why":"It frames her by what she isn’t.","_n":"3v95a","_k":"d49525c3"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which thesis best analyses “Borders” specifically?","options":[{"t":"“Thomas King is a well-known writer.”","why":"A fact about the author, not an argument about the story.","_n":"3w94a","_k":"636f913c"},{"t":"“Indigenous stories are always about land.”","why":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","_n":"3x93a","_k":"6c918cec"},{"t":"“The story is about a car trip.”","why":"That’s a topic, not a thesis.","_n":"3y92a","_k":"4ffa1240"},{"t":"“In ‘Borders’, King’s son narrates the standoff without commentary, so that the mother’s one-word answer, repeated at both crossings, exposes a border that has no category for her nation.”","why":"Specific text, specific technique, specific meaning.","_n":"3z91a","_k":"3bbc3703"}]},"b":{"prompt":"Which sentence writes about Johnson responsibly and specifically?","options":[{"t":"“Like all Native writers, Johnson…”","why":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","_n":"4090a","_k":"5d80cb9e"},{"t":"“Johnson’s poem is a typical Indian legend.”","why":"It isn’t a legend, and “typical” generalizes.","_n":"418fa","_k":"aa1b6446"},{"t":"“Johnson speaks for every Indigenous woman.”","why":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","_n":"428ea","_k":"0dac83ce"},{"t":"“Johnson, a Kanienʼkehá꞉ka poet from Six Nations, gives the woman dignity through the turn ‘But rich in…’.”","why":"It names her Nation and points to one line.","_n":"438da","_k":"8e0ee979"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which sentence best integrates and cites the mother’s answer?","options":[{"t":"(King [p.]) “Blackfoot” is her answer.","why":"The citation goes after the quotation.","_n":"448ca","_k":"4493c31e"},{"t":"At both crossings, the mother answers the question of citizenship with a single word, “Blackfoot” (King [p.]).","why":"A signal phrase, the exact word, then the citation.","_n":"450fa","_k":"42247a05"},{"t":"“Blackfoot.” This shows her identity.","why":"A dropped quotation.","_n":"4610a","_k":"82195620"},{"t":"The mother says Blackfoot (King [p.]) which is her identity.","why":"The quotation isn’t marked, and the sentence is unclear.","_n":"4711a","_k":"9793cd5c"}]},"b":{"prompt":"Which sentence best integrates and cites King’s line from \u003ci>The Truth About Stories\u003c/i>?","options":[{"t":"“The truth about stories is that that’s all we are.” Stories matter.","why":"A dropped quotation.","_n":"4812a","_k":"61142748"},{"t":"King says the truth about stories (\u003ci>Truth\u003c/i> [p.]) is that that’s all we are.","why":"Partly quoted, unmarked, and the citation interrupts.","_n":"490ba","_k":"cf800bea"},{"t":"(\u003ci>Truth\u003c/i> [p.]) King says stories are all we are.","why":"A misplaced citation on a paraphrase.","_n":"4a0ca","_k":"4f1f4b0f"},{"t":"King argues that stories make us who we are: “The truth about stories is that that’s all we are.” (\u003ci>Truth\u003c/i> [p.]).","why":"A signal phrase, the exact words, then the citation.","_n":"4b0da","_k":"d0a61b50"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"For a culminating project, a student wants to share an Anishinaabe story they read online. Which approach is most responsible?","options":[{"t":"Change details so no one can tell where it came from","why":"That erases the source.","_n":"4c0ea","_k":"35c54a5b"},{"t":"Retell it as if they were an Anishinaabe narrator, to show respect","why":"Respond in your own voice. Telling a community’s story as if you belonged to it can take what isn’t yours to take.","_n":"4d07a","_k":"1a1a5bba"},{"t":"Credit the published source and teller, check whether the story is meant to be shared, and write about it in their own voice","why":"Credit, permission and your own voice.","_n":"4e08a","_k":"6a99e483"},{"t":"Combine it with stories from other Nations into one “Native legend”","why":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","_n":"4f81b","_k":"7b6a1f7b"}]},"b":{"prompt":"A club wants a mural honouring a local First Nation. What should come first?","options":[{"t":"Paint a general “Native” design","why":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","_n":"4g80b","_k":"ef226db3"},{"t":"Ask an art class to invent traditional symbols","why":"Respond in your own voice. Telling a community’s story as if you belonged to it can take what isn’t yours to take.","_n":"4h83b","_k":"f6867767"},{"t":"Talk with the Nation’s representatives and follow their guidance and protocols","why":"The Nation decides how it is represented.","_n":"4i82b","_k":"4208dc1c"},{"t":"Copy symbols found online","why":"Respond in your own voice. Telling a community’s story as if you belonged to it can take what isn’t yours to take.","_n":"4j7db","_k":"5e8e470f"}]}},{"id":"a2","cat":"A","goal":[5,4],"a":{"prompt":"Why did Canada’s Truth and Reconciliation Commission call for changes to what schools teach?","options":[{"t":"To replace English classes with history classes","why":"The calls concern content, not replacing subjects.","_n":"4k7cb","_k":"01ac4081"},{"t":"To teach one shared “Indigenous perspective”","why":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","_n":"4l7fb","_k":"efbe0a47"},{"t":"So students learn about residential schools, Treaties, and Indigenous peoples’ contributions, from accurate sources and Indigenous voices","why":"Several calls concern what schools teach.","_n":"4m7eb","_k":"5a85f38a"},{"t":"To stop teaching literature","why":"Literature by Indigenous authors is part of the answer.","_n":"4n89b","_k":"81a5d3bb"}]},"b":{"prompt":"Which reading habit best reflects the module’s guidance?","options":[{"t":"Assuming the official record is the true version","why":"Every telling has a teller and a purpose, including official ones. Ask what each one leaves out.","_n":"4o88b","_k":"2ff6b7c3"},{"t":"Writing in the voice of the author’s community","why":"Respond in your own voice. Telling a community’s story as if you belonged to it can take what isn’t yours to take.","_n":"4p7ba","_k":"dbdc343a"},{"t":"Treating all Indigenous authors as one tradition","why":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","_n":"4q7ca","_k":"86b4cad2"},{"t":"Attending to the specific text and the specific Nation named, rather than generalizing","why":"Specific, not sweeping.","_n":"4r79a","_k":"70218f08"}]}}]},"task":{"title":"Performance task: A reader’s response, in my own voice","summary":"A reader’s response","statement":"\u003cp>Write one analytical paragraph explaining how perspective shapes meaning in “Borders”. Pick your angle: the son’s narration, the guards’ question, the cameras, or the stars story. Write as yourself, a reader.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>","checks":["Your claim names the text and its author","You use the language of perspective","Your evidence is quoted and cited","Your analysis follows the evidence","You wrote about this text, not a whole people","You wrote in your own voice","Your paragraph is 150–220 words"],"tips":["Name the title in quotation marks and the author’s surname in your first sentence.","Use a perspective word: who is the narrator? Who is listening? What authority does the guard’s question claim?","Quote exact words, then put the author and page number from your edition in brackets, like this: (King [p.]), with your page in place of [p.].","After the citation, explain how the perspective shapes the meaning: two or three sentences.","That phrase speaks for a whole people. Rewrite it about this author and this text.","Confirm you’ve written as yourself, responding to the text.","Trim or grow to 150–220 words."],"explainPrompt":"Craft statement: Which perspective did you focus on, and why? Name one choice in your wording that helped you write specifically and respectfully.","explainLabel":"Craft statement","vocab":"Use the words \u003cem>perspective\u003c/em>, \u003cem>narrator\u003c/em>, \u003cem>authority\u003c/em> and \u003cem>silence\u003c/em>.","success":"Every part is there.","more":"There’s more than one strong reading. Your teacher will read for insight and care; the checklist checked the parts.","min":150,"max":220,"persp":["narrator","speaker","teller","perspective","point of view","listener","voice","audience","authority"],"sweep":["all Indigenous","every Indigenous","Indigenous people always","Indigenous people believe","Native people believe","all Native","the Indigenous perspective"],"focus":[{"id":"son","t":"The son’s narration"},{"id":"guard","t":"The guards’ question"},{"id":"cams","t":"The cameras"},{"id":"stars","t":"The stars story"}],"labels":{"setup":"Setup","title":"Title","author":"Author’s surname","focus":"Your angle","write":"Write with","build":"Paragraph builder","free":"Free-form","claim":"Claim","claimHow":"Name the story and its author, and say how perspective shapes its meaning.","ev":"Evidence","evHow":"Introduce the words, quote them exactly, then cite: (King [p.]) with your page.","an":"Analysis","anHow":"How does the perspective shape the meaning? Two or three sentences after the citation.","link":"Link","linkHow":"Tie it back to the claim.","opt":"optional","freeL":"Your paragraph (free-form)","freeHow":"Free-form keeps its own text; the builder’s slots stay as they were. Your first sentence counts as your claim.","pull":"Use a quotation from Explore, Your reading:","pullBtn":"Add to evidence","pullNone":"No quotations saved in Explore’s “Your reading” yet (optional).","self":"I wrote as myself, a reader responding to the text, not in a character’s or a community’s voice.","pv":"Your paragraph","words":"words"},"defaults":{"title":"Borders","author":"King"},"modelsLabel":"Three model responses, three angles","modelsNote":"Each model has [p.] where your page number goes.","models":[{"title":"Model A: the son’s narration","text":"In “Borders”, King gives the telling to a son who reports rather than explains, and that choice of narrator is what lets the story’s argument land. When the guard asks for her citizenship, the mother answers “Blackfoot” (King [p.]), and the son simply records it, along with the guard’s polite confusion. He never tells us what his mother means. Because the narrator withholds commentary, the reader has to supply it: we realize that she has understood the question perfectly and refused its two choices. The son’s flat perspective works like a clear window. Nothing in his voice pushes us, so the absurdity of a border with no word for her nation becomes something we see for ourselves, and believe more firmly for having seen it."},{"title":"Model B: the guard’s question","text":"King’s “Borders” turns a routine question into the centre of the story, and the guard’s perspective is the one the story most carefully exposes. The guard can only offer two answers, Canadian or American, and when the mother replies “Blackfoot” (King [p.]), the exchange stalls. The humour comes from repetition: the question returns, politely, and so does the answer. Neither speaker is a villain; the guard is doing the job, and the mother is telling the truth. The authority of the question, though, rests on categories drawn long after her nation existed. By keeping the tone calm, King shows that the problem is not a rude official but a system whose boxes cannot hold the people it claims to sort."},{"title":"Model C: the cameras","text":"In “Borders”, the arrival of the reporters changes the audience for the mother’s story, and with it, the story’s power. For days, her answer, “Blackfoot” (King [p.]), has an audience of two guards and a son in a parked car. When the television crews appear, the same answer reaches viewers far beyond the border, and the private standoff becomes a public telling. The narrator doesn’t comment on this shift; he notices the cameras and the people gathering, and lets us draw the conclusion. King’s choice suggests that who listens to a story can matter as much as who tells it. The rules have not changed, but once the story is told widely, the guards’ certainty looks different. As King writes elsewhere, the truth about stories is that that’s all we are."}],"rubric":[["Knowledge/Understanding (accuracy about the text and perspective)","Misidentifies the narrator or events","Partly accurate","Accurate, with apt terms","Precise and nuanced"],["Thinking (insight about perspective)","Retells","A simple claim","An arguable claim explained with evidence","An insightful claim that reveals silences and stakes"],["Communication (integration, style, respectful language)","Dropped quotations; generalizing","Some integration; minor generalizing","Smooth integration; specific, respectful terms","Graceful prose; precise, respectful language throughout"],["Application (use of the text)","Little use","Some use","Apt evidence","Discerning evidence and connections (e.g. to \u003ci>The Truth About Stories\u003c/i> or Johnson)"]]},"cards":[["Perspective","The position a telling comes from: who sees, who speaks, what matters to them."],["The four questions","Who tells it? To whom? With what authority? What’s left out?"],["Authority","The standing a teller claims: official, media, personal witness, self-identification."],["Silence","What a telling leaves out. A form with two boxes leaves out a nation older than the border."],["Narrator ≠ author","“The son reports…”, not “King says…”."],["Understatement","Saying less than the moment holds, so the reader feels more. The son reports the standoff without comment."],["Repetition","Saying it again: “Blackfoot,” at both crossings, builds comedy and conviction."],["Story within a story","A tale told inside the main story: the mother’s story about the stars, told between the borders."],["“The truth about stories…”","“…is that that’s all we are” (King, \u003ci>The Truth About Stories\u003c/i>)."],["Specific, not sweeping","Write about \u003cem>this\u003c/em> author and \u003cem>this\u003c/em> text, never “Indigenous people always…”."],["Appreciation vs appropriation","Respond in your own voice; don’t take a community’s voice, stories or regalia as your own."],["TRC Calls to Action (2015)","94 calls; several ask schools to teach about residential schools, Treaties and Indigenous contributions."]],"misc":{"M1":"One writer speaks from a specific place and life. Write about \u003cem>this\u003c/em> text and \u003cem>this\u003c/em> author.","M2":"Every telling has a teller and a purpose, including official ones. Ask what each one leaves out.","M3":"The son narrates. King wrote him. Say “the narrator notices…”.","M4":"The comedy at the border is the critique. A joke can be the most serious line in a story.","M5":"Respond in your own voice. Telling a community’s story as if you belonged to it can take what isn’t yours to take.","M6":"That tells what happens. Analysis says how \u003cem>who tells it\u003c/em> shapes what it means.","M7":"She understands the question perfectly. Her answer refuses its choices."}}};</script>
