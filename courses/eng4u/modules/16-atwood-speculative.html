.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}

.bars{display:grid;gap:10px;margin:14px 0}

.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}

.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}

ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}

.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

}

.hd-btns{gap:6px}

*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}

@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}

:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;

--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}

--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}

.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}
.an-tag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);font-style:normal;letter-spacing:.01em;color:var(--an-c,var(--ink-2));background:var(--sheet);
border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}

padding:.25em .8em;font-size:.92rem;min-height:34px}

@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}

ol.eng-poem li.eng-gap{height:.6em}

/* ENG4U 16 Atwood and Speculative Canada. Prefix: at-. Colours from tokens only (base + eng4u.css). */
.at-h{margin:14px 0 6px;font-size:1.05rem}
.at-lab{font-weight:700;margin:12px 0 6px}
.at-note{margin:8px 0}
.at-cnote{margin:0}

/* hero */
.at-hero{width:100%}
.at-hsvg{width:100%;height:auto;display:block}
.at-hline{font:400 17px var(--font-text, Georgia, serif);fill:var(--ink-2)}
.at-hw{opacity:.28;transition:opacity .25s}
.at-hw.on{opacity:1;fill:var(--ink)}
.at-hw.speaking{fill:var(--pen);font-weight:700}
.at-hpaper{fill:var(--sheet);stroke:var(--rule);stroke-width:1.2}
.at-hmast{fill:var(--ink-2)}
.at-hln{fill:var(--ink-2);opacity:.55}
.at-hcol{opacity:0;transition:opacity .9s}
.at-hsvg.col .at-hcol{opacity:1}
.at-hmar{fill:var(--hi-soft);stroke:var(--hi);stroke-width:1;opacity:0;transition:opacity 1.1s}
.at-hsvg.mar .at-hmar{opacity:1}
.at-hfig circle,.at-hfig path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.at-hfig{opacity:0;transition:opacity .9s}
.at-hsvg.figs .at-hfig{opacity:1}
.at-hfig[data-hf="1"],.at-hfig[data-hf="4"]{transition-delay:.25s}
.at-hfig[data-hf="2"],.at-hfig[data-hf="5"]{transition-delay:.5s}
.at-hcap{font:italic 600 15px var(--font-text, Georgia, serif);fill:var(--ink);opacity:0;transition:opacity .8s}
.at-hsvg.cap .at-hcap{opacity:1}
.at-hcite{margin:6px 0 0}
.at-hctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.at-hself{margin:6px 0 0}

/* lab */
.at-main{margin-top:10px}
.at-cards{display:flex;flex-wrap:wrap;gap:8px}
.at-card{display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--rule);border-radius:8px;padding:6px;background:var(--sheet);flex:1 1 220px;min-width:0}
.at-card.on{border-color:var(--pen);box-shadow:0 0 0 2px var(--hi-soft)}
.at-card.imp{border-style:dashed}
.at-cbtn{text-align:left;background:none;border:0;padding:4px;font:inherit;color:var(--ink);min-height:32px;cursor:pointer;border-radius:5px}
.at-cbtn[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink)}
.at-cbtn:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.at-rid{font-weight:700;color:var(--pen)}
.at-cbtn[aria-pressed="true"] .at-rid{color:inherit}
.at-lk{display:block;padding:0 4px}
.at-linkb{align-self:flex-start}
.at-drawer{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border-top:1px solid var(--rule)}
.at-drawer .chip{text-align:left}
.at-deck{margin-top:8px}

.at-rmap{max-width:560px;margin:0 auto}
.at-rsvg{width:100%;height:auto;display:block}
.at-rzone{fill:var(--paper);stroke:var(--rule)}
.at-rn rect{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.at-rn.lk rect{stroke:var(--pen);stroke-width:2}
.at-rn.sel rect{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2.4}
.at-rn text{font:400 11.5px var(--font-ui);fill:var(--ink)}
.at-rn .at-rid{fill:var(--pen);font-weight:700}
.at-thread{fill:none;stroke:var(--an-theme);stroke-width:2.4;stroke-linecap:round}
.at-gauge{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.at-gbar{flex:1 1 160px;height:12px;border:1.5px solid var(--ink-2);border-radius:7px;overflow:hidden;background:var(--paper)}
.at-gbar i{display:block;height:100%;background:var(--pen);transition:width .5s}
.at-aha{margin-top:10px}

.at-stages{margin-top:16px;border-top:1px solid var(--rule);padding-top:6px}
.at-ord{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.at-ord li{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet)}
.at-oid{font-weight:700;color:var(--pen);min-width:1.2em}
.at-ot{flex:1;min-width:0}
.at-omv{display:flex;gap:4px;flex:0 0 auto}

.at-own .at-ofr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.at-pg{width:5em}
.at-olist{margin:8px 0;padding-left:1.4em}

.at-copy p{margin:6px 0}
.at-tagbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.at-chart{margin:12px 0}
.at-bar{display:grid;grid-template-columns:minmax(0,11em) 1fr 2em;gap:8px;align-items:center;margin:3px 0;font-size:.9rem}
.at-bt{height:10px;background:var(--paper);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.at-bt i{display:block;height:100%;background:var(--an-c, var(--pen))}
.at-bn{text-align:right;font-variant-numeric:tabular-nums}

.at-cot{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}

.at-bmap{max-width:560px;margin:0 auto}
.at-wsvg{width:100%;height:auto;display:block}
.at-wground{fill:var(--paper);stroke:var(--rule);stroke-width:1.2}
.at-wnote{font:400 12px var(--font-ui);fill:var(--ink-2)}
.at-dt{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.2}
.at-dl{fill:var(--sheet);stroke:var(--ink);stroke-width:1.2}
.at-dr{fill:var(--rule);stroke:var(--ink);stroke-width:1.2}
.at-dlab{font:600 10px var(--font-ui);fill:var(--ink)}
.at-ico circle{fill:var(--sheet);stroke:var(--pen);stroke-width:2}
.at-ico.imp circle{stroke:var(--an-theme);stroke-dasharray:3 2}
.at-icl{font:700 11px var(--font-ui);fill:var(--ink)}
.at-icn{font:400 9.5px var(--font-ui);fill:var(--ink)}
.at-prem{margin:6px 0 10px}
.at-readw{margin-top:12px}
.at-morebtn{display:none}

/* Part 3 */
.at-st{margin:0 0 22px}
.at-q{margin:8px 0;padding:6px 12px;border-left:4px solid var(--an-theme);background:var(--paper)}
.at-q p{margin:4px 0}
.at-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.at-lad{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.at-rung{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet)}
.at-rung.done{border-color:var(--green)}
.at-rung.locked{opacity:.65}
.at-rn{margin:0 0 6px;font-weight:700}
.at-rnum{display:inline-block;min-width:1.6em;text-align:center;border-radius:50%;background:var(--pen);color:var(--sheet)}
.at-qs{margin:6px 0;padding-left:1.2em}
.at-pv{margin-top:10px}
.at-venn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.at-vr{border-radius:999px 24px 24px 999px}
.at-vr-both{border-radius:24px}
.at-vr-A{border-radius:24px 999px 999px 24px}

/* practice + task */
.at-arch p{line-height:1.6}
.at-task .at-big{min-height:220px}
.at-ttag{margin-top:12px}
.at-tworld{margin:10px 0}
.at-model p{margin:6px 0}

@media (max-width:640px){
  .at-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .at-row .at-card{flex:0 0 78%;scroll-snap-align:start}
  .at-readw:not(.all) .at-x{display:none}
  .at-morebtn{display:inline-flex}
  .at-two,.at-venn{grid-template-columns:1fr}
  .at-vr,.at-vr-both,.at-vr-A{border-radius:12px}
  .at-bar{grid-template-columns:minmax(0,8.5em) 1fr 1.6em}
}
@media (prefers-reduced-motion:reduce){
  .at-hw,.at-hcol,.at-hmar,.at-hfig,.at-hcap,.at-fx,.at-frame,.at-frl,.at-gbar i{transition:none!important}
}

<script>window.MV_PAYLOAD={"meta":{"id":"16-atwood-speculative","nn":"16","slug":"atwood-speculative","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 3","groupName":"Canadian Literature","trivium":"Logic","size":"M","storageKey":"eng4u-16-atwood-speculative-v1","progressKey":"eng4u-progress-v1:16-atwood-speculative","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"9e68425b","content":{"id":"16-atwood-speculative","kind":"topic","title":"Atwood and speculative Canada","topic":"Atwood and Speculative Canada","readyTopic":"Atwood’s speculative fiction","hero":{"headline":"Every imagined future is a mirror held up to now.","text":"\u003cstrong>Speculative fiction\u003c/strong> asks \u003cem>What if?\u003c/em> about the world we already live in. It takes something that has really happened, somewhere, sometime, and lets it happen \u003cem>here\u003c/em>. Margaret Atwood built the Republic of Gilead by that rule. In this module you’ll test her rule, learn the \u003cstrong>conventions\u003c/strong> of dystopia, read the most powerful tool any regime has, its control of \u003cstrong>language\u003c/strong>, and watch a narrator fight back with words.","fig":{"html":"\u003cdiv class='at-hero' id='at-hero'>\u003c/div>","caption":""},"line":"We were the people who were not in the papers. We lived in the blank white spaces at the edges of print.","credit":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), ch. 10, p. __. Quoted for study under fair dealing.","caption":"The story is in the margins.","aria":"The two sentences light up word by word. On “the papers”, a newspaper column sets itself in grey type. On “the blank white spaces at the edges of print”, the margins beside the column glow softly and small human figures appear in them. Caption: “The story is in the margins.”","listen":"Listen again","watch":"Watch again","yourself":"Read it aloud. Which word do you lean on? \u003cem>Blank\u003c/em>? \u003cem>Edges\u003c/em>?"},"goals":["I can explain how speculative fiction differs from science fiction and from prediction.","I can identify Gilead’s dystopian conventions and explain how each creates meaning.","I can analyse how Gilead controls language (scripted speech, renaming, euphemism, forbidden reading), and how Offred resists through words.","I can trace how Gilead extrapolates from real precedents, using Atwood’s rule.","I can analyse Offred’s narration and the Historical Notes frame as choices that shape meaning.","I can compare \u003ci>The Handmaid’s Tale\u003c/i> with “The Machine Stops” and connect speculative texts to my own world, responsibly."],"start":{"blocks":[{"title":"Word story: dystopia","html":"\u003cp>\u003cstrong>\u003cem>Utopia\u003c/em>\u003c/strong> was Thomas More’s coinage (1516), a pun in Greek: \u003cem>ou-topos\u003c/em>, “no place”, and \u003cem>eu-topos\u003c/em>, “good place”. \u003cstrong>\u003cem>Dystopia\u003c/em>\u003c/strong> swaps in \u003cem>dys-\u003c/em>, “bad”: a bad place, and one that is very much somewhere. The word was in use by the 1800s; John Stuart Mill used a form of it in a speech in 1868.\u003c/p>\u003cp>Every dystopia carries the ghost of a utopia: Gilead’s founders thought they were building a better world.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"},{"title":"Before you read","html":"\u003cp class='at-cnote'>\u003cstrong>Content note.\u003c/strong> \u003ci>The Handmaid’s Tale\u003c/i> depicts violence, coercion and religious extremism. This module refers to them only in general terms, and it quotes only short lines from the novel. Read the longer passages in your class copy. If your class follows the Forster path, your teacher will tell you.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Genre and form","goal":1,"prompt":"Which feature most clearly marks a story as a \u003cstrong>dystopia\u003c/strong>?","options":[{"t":"A story set in the future","why":"Plenty of future stories are hopeful, and some dystopias feel almost present-day.","_n":"0521","_k":"2b22bac2"},{"t":"A story with a sad ending","why":"Tragedies end sadly too; what matters is the society.","_n":"1531","_k":"8044d91e"},{"t":"A society presented as orderly or ideal that is, underneath, controlling or harmful","why":"The gap between the promise and the reality is the dystopian engine.","_n":"2541","_k":"a988762d"},{"t":"A story with robots or aliens","why":"That’s a science-fiction prop, not the defining feature.","_n":"3551","_k":"407c94e6"}],"hints":["Think about the \u003cem>society\u003c/em>, not the setting.","What does the society claim to be, and what is it really?","Ideal on the surface, controlling underneath."]},{"id":"w2","skill":"Genre and form","goal":5,"prompt":"A \u003cstrong>framing device\u003c/strong> in a novel is…","options":[{"t":"The first chapter","why":"A first chapter isn’t necessarily a frame.","_n":"4561","_k":"71011e32"},{"t":"A story or document that surrounds the main story and changes how we read it","why":"Like a picture frame, it sets the main story in a context.","_n":"5571","_k":"6c52a439"},{"t":"A flashback","why":"A flashback moves within the story; a frame sits around it.","_n":"6581","_k":"a6f2453a"},{"t":"The cover design","why":"That’s packaging, not a narrative device.","_n":"7591","_k":"720de22e"}],"hints":["Think of a picture frame.","It sits \u003cem>around\u003c/em> the main story.","A surrounding story or document."]},{"id":"w3","skill":"Point of view and irony","goal":5,"prompt":"A narrator praises her city’s “gentle” rules while describing a neighbour taken away at night. The reader feels uneasy, but she doesn’t. This gap is…","options":[{"t":"Foreshadowing","why":"Foreshadowing hints at later events; this is a gap in understanding.","_n":"85a1","_k":"f7a282b1"},{"t":"A flashback","why":"There’s no shift in time.","_n":"9e4d","_k":"5a77000a"},{"t":"Dramatic irony: the reader understands more than the narrator","why":"We see what she can’t, or won’t.","_n":"ae3d","_k":"bcd6f68a"},{"t":"Hyperbole","why":"Nothing is exaggerated; the horror is understated.","_n":"be2d","_k":"5f00af57"}],"hints":["Who knows more, the reader or the narrator?","The reader does.","Dramatic irony."]},{"id":"w4","skill":"Point of view and irony","goal":5,"prompt":"Why might an author give a powerful speech in favour of the regime to a character like a teacher or official?","options":[{"t":"Because the author agrees with the speech","why":"A character’s view isn’t the author’s.","_n":"ce1d","_k":"a05f7a31"},{"t":"Because the author ran out of narrators","why":"This is a deliberate choice about perspective, not a shortcut.","_n":"de8d","_k":"1e075217"},{"t":"To make the story cheerful","why":"The speech is unsettling; that’s the point.","_n":"ee7d","_k":"61e80425"},{"t":"To let readers judge the regime’s reasoning for themselves through the gap between the speech and what the story shows","why":"The reader does the critique.","_n":"fe6d","_k":"57addbdc"}],"hints":["Does the author agree with every character?","Not necessarily.","The gap invites judgement."]},{"id":"w5","skill":"Diction and connotation","goal":3,"prompt":"Which word has the most \u003cstrong>comforting\u003c/strong> connotation for a place where people are held against their will?","options":[{"t":"“Compound”","why":"Suggests fences and guards.","_n":"ge5d","_k":"f1f0d5c1"},{"t":"“Cell”","why":"Cold and confining.","_n":"hecd","_k":"c1e05930"},{"t":"“Prison”","why":"Accurate, not comforting.","_n":"iebd","_k":"ee850e24"},{"t":"“Retreat”","why":"It suggests rest and choice, the opposite of the truth.","_n":"jead","_k":"b40661af"}],"hints":["Which word sounds like a holiday?","Which suggests choice?","Retreat."]},{"id":"w6","skill":"Diction and connotation","goal":3,"prompt":"A \u003cstrong>euphemism\u003c/strong> is…","options":[{"t":"A mild word substituted for a harsh or blunt one","why":"“Passed away” for “died”.","_n":"kebd","_k":"56e66025"},{"t":"A contradiction in two words","why":"That’s an oxymoron.","_n":"le8d","_k":"794fe3df"},{"t":"A word that sounds like its meaning","why":"That’s onomatopoeia.","_n":"me9d","_k":"b9d99193"},{"t":"An exaggeration for effect","why":"That’s hyperbole.","_n":"ne6d","_k":"6c6c3747"}],"hints":["Think “passed away”.","It softens.","A mild substitute for a harsh word."]}],"refreshers":{"Genre and form":"A dystopia shows a society that claims to be ideal but controls or harms its people. A frame is a surrounding story or document, such as a later historian’s notes, that changes how we read the main story.","Point of view and irony":"When the reader understands more than a speaker, that’s dramatic irony. Example: an official calls a curfew “peaceful” while the street is empty and frightened.","Diction and connotation":"Words carry feelings beyond their dictionary meanings. A euphemism swaps a harsh word for a soft one: “let go” for “fired”. Regimes use euphemism so harm sounds harmless."}}},"explore":{"heading":"World-building lab","intro":"Atwood’s rule: nothing in Gilead without a precedent. Test her rule, then use it to build a world of your own.","modes":[{"id":"roots","t":"Gilead’s roots"},{"id":"track","t":"Track conventions"},{"id":"build","t":"Build"}],"how":{"roots":"Tap one of Gilead’s features, then tap the precedent it grows from. Each link draws a thread on the map. To change a link, tap the feature again and choose another precedent.","track":"Choose a passage. Tap words (Shift + tap or Shift + arrows for a run), then tap a convention to tag them. Your tags are yours and are never scored.","build":"Choose 1 to 3 trends and set how far to push each one. Then choose 2 to 4 elements, and link each precedent-deck element to a real precedent."},"features":[{"id":"F1","t":"Colour-coded dress for every role: red for Handmaids, blue for Wives, green for Marthas","short":"Colour-coded dress","ch":"ch. 2"},{"id":"F2","t":"Women forbidden to read; shop signs show pictures instead of words","short":"Pictures, not words","ch":"ch. 5"},{"id":"F3","t":"The Eyes: secret police and informers","short":"The Eyes","ch":"ch. 4"},{"id":"F4","t":"The Wall, where the bodies of the executed are hung as warnings","short":"The Wall","ch":"ch. 6"},{"id":"F5","t":"Overnight, women’s jobs end and their bank accounts pass to husbands or male relatives","short":"Jobs and accounts","ch":"ch. 28"},{"id":"F6","t":"Handmaids renamed after the man they serve: Of-fred","short":"Of-fred","ch":"ch. 14 and the Historical Notes"}],"precedents":[{"id":"Pa","short":"Clothing laws","t":"Laws that dictated clothing by rank or group"},{"id":"Pb","short":"Bans on literacy","t":"Laws in some places and eras that made it a crime to teach enslaved people to read"},{"id":"Pc","short":"Secret police","t":"Twentieth-century secret police and networks of informers"},{"id":"Pd","short":"Bodies displayed","t":"Public display of the executed as a warning to others"},{"id":"Pe","short":"Wives’ property laws","t":"Laws under which a married woman’s property and earnings belonged to her husband"},{"id":"Pf","short":"Names as ownership","t":"Enslaved people given their enslavers’ names; wives known by their husbands’ names"}],"_a":"QkdwCRYIFzJYRxoacgAXWBs1VBoYEHNRG18UaFcQGUB/URQCFmJRQBVHcA0WCBcyXEcaGnIEF1gbNVAaSQ==","map":{"title":"Gilead, a schematic map","gauge":"Rooted in the real","drawer":"Precedents","features":"Gilead’s features","pick":"Tap a feature first, then a precedent.","unlink":"Unlink","linkedTo":"linked to"},"conv":[{"id":"info","t":"Control of information","role":"theme"},{"id":"surv","t":"Surveillance","role":"theme"},{"id":"script","t":"Scripted speech","role":"syntax"},{"id":"rename","t":"Renaming or euphemism","role":"diction"},{"id":"read","t":"Forbidden reading or writing","role":"theme"},{"id":"terror","t":"Public terror","role":"theme"},{"id":"comfort","t":"Comfort and consent","role":"image"},{"id":"resist","t":"Resistance","role":"figure"},{"id":"frame","t":"Frame","role":"syntax"}],"sources":[{"id":"A","slot":"A","t":"Slot A: the opening","lines":["We slept in what had once been the gymnasium."],"cite":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), ch. 1, p. __. Quoted for study under fair dealing.","paras":[],"copy":"Read the opening of chapter 1 in your copy, from “We slept in what had once been the gymnasium” to the end of the first paragraph.","fo":{"t":"Slot A: Forster’s opening","lines":["Imagine, if you can, a small room, hexagonal in shape, like the cell of a bee."],"cite":"E. M. Forster, “The Machine Stops” (1909), part I","copy":"Read the first two sentences of “The Machine Stops” in your copy."}},{"id":"B","slot":"B","t":"Slot B: the first walk with Ofglen","lines":["Blessed be the fruit.","May the Lord open.","Under His Eye."],"cite":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), ch. 4–5, p. __. Quoted for study under fair dealing.","paras":[],"copy":"Read Offred’s first walk with Ofglen in your copy, with its greetings and its parting words.","fo":{"t":"Slot B: the lecturer’s speech","lines":["Beware of first-hand ideas!"],"cite":"E. M. Forster, “The Machine Stops” (1909), part III","copy":"Read the lecturer’s speech in part III of “The Machine Stops” in your copy."}},{"id":"C","slot":"C","t":"Slot C: Aunt Lydia on freedom","lines":["There is more than one kind of freedom [. . .]. Freedom to and freedom from."],"cite":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), ch. 5, p. __. Quoted for study under fair dealing.","paras":[],"copy":"Read Aunt Lydia’s words on “freedom to” and “freedom from” in chapter 5 of your copy.","fo":{"t":"Slot C: Vashti refuses the surface","lines":[],"cite":"E. M. Forster, “The Machine Stops” (1909), part I","copy":"Read the passage where Vashti refuses to visit the surface of the earth."}},{"id":"D","slot":"D","t":"Slot D: how it began","lines":["They said it would be temporary.","We lived, as usual, by ignoring."],"cite":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), ch. 28 and 10, p. __. Quoted for study under fair dealing.","paras":[],"copy":"Read the passage where Offred remembers losing her job and her bank account, and the earlier memories of how people adjusted.","fo":{"t":"Slot D: Kuno and the surface","lines":[],"cite":"E. M. Forster, “The Machine Stops” (1909), part II","copy":"Read Kuno’s description of the surface of the earth."}},{"id":"E","slot":"E","t":"Slot E: “This is a reconstruction”","lines":["This is a reconstruction."],"cite":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), ch. 23, p. __. Quoted for study under fair dealing.","paras":[],"copy":"Read the passage in chapter 23 where Offred says her telling is a reconstruction.","fo":{"t":"Slot E: the ending","lines":[],"cite":"E. M. Forster, “The Machine Stops” (1909), part III","copy":"Read the ending of “The Machine Stops”, with Kuno and Vashti."}},{"id":"F","slot":"F","t":"Slot F: the Historical Notes","lines":["Are there any questions?"],"cite":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), “Historical Notes”, p. __. Quoted for study under fair dealing.","paras":[],"copy":"Read the opening paragraph and the final lines of the “Historical Notes”.","fo":{"t":"Slot F: Forster’s final paragraph","lines":[],"cite":"E. M. Forster, “The Machine Stops” (1909), part III","copy":"Read the final paragraph of “The Machine Stops”."}},{"id":"H","t":"The hero passage","lines":["We were the people who were not in the papers. We lived in the blank white spaces at the edges of print."],"cite":"Margaret Atwood, \u003ci>The Handmaid’s Tale\u003c/i> (McClelland and Stewart, 1985), ch. 10, p. __. Quoted for study under fair dealing."},{"id":"FO","t":"Forster’s hero passage","lines":["Imagine, if you can, a small room, hexagonal in shape, like the cell of a bee."],"cite":"E. M. Forster, “The Machine Stops” (1909), part I"},{"id":"own","t":"Your lines"}],"own":{"max":6,"maxChars":240,"how":"Paste or type up to 6 lines from your own copy, with page numbers, then tag them. Nothing leaves this device.","lineL":"A line from your copy","pageL":"Page","add":"Add the line","remove":"Remove","full":"You’ve added 6 lines, the most this list holds.","need":"Type the line and its page number."},"trackL":{"choose":"Passage","tagWith":"Tag the selected words with","clear":"Remove tags on the selected words","chart":"Conventions you’ve tagged","none":"No tags yet.","copyTitle":"Read in your copy","credit":"Credit"},"words":{"title":"Gilead’s words (challenge 2)","how":"Tap an item, then tap the bin for how it controls (or resists) language.","bins":[{"id":"script","t":"Scripted speech"},{"id":"rename","t":"Renaming as ownership or exclusion"},{"id":"euph","t":"Euphemism"},{"id":"read","t":"Forbidden reading"},{"id":"resist","t":"Resistance"}],"items":[{"id":"g1","t":"the greeting “Blessed be the fruit”","_a":"GxZVSl1CQUA="},{"id":"g2","t":"its required answer, “May the Lord open”","_a":"GxZVSl1CQUA="},{"id":"g3","t":"the parting “Under His Eye”","_a":"GxZVSl1CQUA="},{"id":"g4","t":"the name “Offred”","_a":"GxdTVlVfUEA="},{"id":"g5","t":"“Unwomen”, Gilead’s label for women who don’t fit its roles","_a":"GxdTVlVfUEA="},{"id":"g6","t":"“Salvaging”, Gilead’s name for a public execution","_a":"GwBDSFwQ"},{"id":"g7","t":"the shop sign for the butcher’s, a picture where words used to be (the shop’s name, All Flesh, survives only in speech)","_a":"GxdTWVAQ"},{"id":"g8","t":"the scratched phrase “Nolite te bastardes carborundorum”, found in Offred’s cupboard","_a":"GxdTS11BQUA="}]},"stages":{"title":"How Gilead arrived (challenge 3)","how":"Put the five stages in order, first at the top. Use Move up and Move down.","up":"Move up","down":"Move down","start":["C","E","A","D","B"],"cards":[{"id":"A","t":"An attack kills the President and Congress; the army declares an emergency and the Constitution is suspended. “They said it would be temporary.” (Atwood, ch. 28, p. __)"},{"id":"B","t":"Newspapers are censored, and checkpoints and identity passes appear, “for safety”."},{"id":"C","t":"Overnight, women lose their jobs and their bank accounts pass to husbands or male relatives."},{"id":"D","t":"People adjust and keep going: “We lived, as usual, by ignoring.” (Atwood, ch. 10, p. __)"},{"id":"E","t":"The new order is taught as normal: “It will become ordinary.” (Atwood, ch. 6, p. __), as Aunt Lydia tells the Handmaids."}]},"trends":[{"id":"T1","t":"We stream everything, alone","p":"we streamed everything, alone","comfort":true},{"id":"T2","t":"Cameras on every corner","p":"cameras watched every corner"},{"id":"T3","t":"Fresh water is getting scarcer","p":"fresh water grew scarcer"},{"id":"T4","t":"Lessons happen on screens","p":"lessons happened only on screens","comfort":true},{"id":"T5","t":"Apps score our behaviour","p":"apps scored our behaviour","comfort":true},{"id":"T6","t":"Memories live in the cloud","p":"our memories lived in the cloud","comfort":true}],"push":[{"id":"1","t":"a little"},{"id":"2","t":"a lot"},{"id":"3","t":"all the way"}],"elements":[{"id":"Ea","deck":"P","t":"Permits to leave home","np":"permits to leave home","conv":"control of movement and information"},{"id":"Eb","deck":"P","t":"A list of approved words","np":"a list of approved words","conv":"limited language"},{"id":"Ec","deck":"P","t":"Rationed water by household score","np":"water rationed by household score","conv":"control presented as fairness"},{"id":"Ed","deck":"P","t":"Public praise for informers","np":"public praise for informers","conv":"surveillance by neighbours"},{"id":"Ee","deck":"P","t":"Erasing names from records","np":"erasing names from records","conv":"erased language and history"},{"id":"Ef","deck":"P","t":"Ritual greetings","np":"ritual greetings","conv":"scripted speech"},{"id":"Ex","deck":"X","t":"Mind-reading helmets","np":"mind-reading helmets"},{"id":"Ey","deck":"X","t":"Time-travel courts","np":"time-travel courts"},{"id":"Ez","deck":"X","t":"Teleport checkpoints","np":"teleport checkpoints"}],"decks":{"P":"Precedent deck","X":"Impossible deck"},"bprec":[{"id":"B1","t":"Travel passes and internal permits needed to move between regions"},{"id":"B2","t":"Official lists of approved and banned words"},{"id":"B3","t":"Wartime rationing of food and fuel, household by household"},{"id":"B4","t":"Campaigns that rewarded citizens for informing on neighbours"},{"id":"B5","t":"Names erased from official records and photographs"},{"id":"B6","t":"Ritual pledges and recitations said together each day"}],"buildL":{"trends":"Trend cards (choose 1–3)","push":"Push","elements":"Element cards (choose 2–4)","link":"Link","linked":"Linked:","choosePrec":"Link to a precedent","close":"Close","maxT":"You can choose up to 3 trends.","maxE":"You can choose up to 4 elements.","world":"Your world","empty":"Choose a trend to start your world.","premise":"Premise"},"readout":{"rule":"Atwood’s rule","premise":"Premise","genre":"Genre tag","rooted":"Rooted in the real","conv":"Conventions present","comfort":"Comfort and consent","spec":"Speculative (could happen)","sf":"Science fiction (needs the impossible)","present":"Present","missing":"Missing","none":"None yet","more":"More","fewer":"Fewer"},"aha":"Gilead frightens because nothing in it is invented. Each feature has a real history somewhere; Atwood only gathered them in one place and set them in Cambridge, Massachusetts. The more rooted a speculative world is, the harder it is to dismiss.","p1":{"caption":"Not another planet: our gymnasium, repurposed."},"p4":{"label":"how it’s remembered"},"predIntro":"Make a prediction first. Then the lab shows you what happens.","predictions":[{"id":"p1","prompt":"The novel begins: “We slept in what had once been the gymnasium.” (Atwood, ch. 1, p. __) What does “what had once been” do?","options":[{"t":"It hides the setting from the reader.","_n":"oe7d","_k":"0551fc7b"},{"t":"It shows the story takes place in the distant past.","_n":"pe4d","_k":"e8ac31cf"},{"t":"It shows Gilead built inside a familiar, ordinary place, so the reader’s own world is the ruin it was made from","_n":"qe5d","_k":"b6770ce8"},{"t":"It tells us the narrator is an athlete.","_n":"rf2d","_k":"2647df06"}],"explain":"Three words do the speculative work: this isn’t another planet, it’s our gymnasium, repurposed. The past tense of “had once been” makes our present into Gilead’s ruins."},{"id":"p2","prompt":"The lab is in Build mode with “Cameras on every corner” (a lot) and “Public praise for informers” (linked). Now add “Mind-reading helmets”. What happens to the genre tag?","options":[{"t":"It stays speculative, because cameras are real.","_n":"sf3d","_k":"9d4c18a2"},{"t":"Nothing changes.","_n":"tf0d","_k":"23b825ca"},{"t":"It flips to science fiction, because the element needs technology that doesn’t exist","_n":"uefd","_k":"009a1ab7"},{"t":"It becomes fantasy.","_n":"vf2d","_k":"10d1699a"}],"explain":"One impossible element breaks Atwood’s rule: the world stops saying “this could be us”. Gilead’s Eyes use informers, not helmets."},{"id":"p3","prompt":"Aunt Lydia says: “There is more than one kind of freedom [. . .]. Freedom to and freedom from.” (Atwood, ch. 5, p. __) Does the novel want us to agree with Aunt Lydia?","options":[{"t":"It’s impossible to tell from a character’s words.","_n":"wf1d","_k":"c576bcec"},{"t":"Yes: Aunt Lydia is a teacher, so she speaks for Atwood.","_n":"xf4d","_k":"beddb77a"},{"t":"Yes: safety is always better than freedom.","_n":"yf3d","_k":"1653bde0"},{"t":"No: the neat balance of “freedom to” and “freedom from” dresses up confinement as protection, and the novel lets us see the trick","_n":"zf6d","_k":"4f08eb6d"}],"explain":"A character’s view isn’t the author’s. The symmetry of the phrase makes a loss sound like a gift, and that is the warning."},{"id":"p4","prompt":"The novel ends with a scholarly conference held two centuries later, which closes: “Are there any questions?” (Atwood, “Historical Notes”, p. __) How does that frame change Offred’s story?","options":[{"t":"It means Atwood predicted the future.","_n":"10f5d","_k":"364ac494"},{"t":"It’s a summary for readers who skipped ahead.","_n":"11e8d","_k":"62045785"},{"t":"It shows Gilead fell, but also that later scholars treat Offred’s suffering as an academic puzzle: hope and irony at once","_n":"12e7d","_k":"ec1ced7e"},{"t":"It proves the story is true.","_n":"1376e","_k":"8178df64"}],"explain":"A frame is never decoration. It tells you who survived to tell the story, and how coolly they tell it. The closing question is aimed at us."}],"chalIntro":"Use the lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"Test Atwood’s rule: link each of Gilead’s six features to its precedent. \u003cbutton type='button' class='btn ghost sm at-setup' data-setup='roots'>Set it up\u003c/button>","msgs":{"unlinked":"Link all six features first. The gauge reads {n} of 6.","F2Pc":"Secret police watch; this feature is about who may \u003cem>read\u003c/em>. Look for a precedent about literacy.","F6Pa":"Clothing marks rank; Of-fred is a \u003cem>name\u003c/em>. Look for a precedent about names as ownership.","F5Pd":"This is about property and money, not public terror."},"general":"Not yet. Match the \u003cem>kind\u003c/em> of control: clothing, reading, watching, terror, money, names.","why":"Six of six. Nothing in Gilead is invented, only gathered.","hints":["Match the \u003cem>kind\u003c/em> of control: clothing, reading, watching, terror, money, names.","F2 is literacy; F6 is naming; F5 is property.","F1–Pa, F2–Pb, F3–Pc, F4–Pd, F5–Pe, F6–Pf."]},{"id":"tc2","goal":3,"prompt":"Gilead’s words: sort these eight items from the novel by how they control (or resist) language. \u003cbutton type='button' class='btn ghost sm at-setup' data-setup='track'>Set it up\u003c/button>","msgs":{"unplaced":"Place all eight items first.","g6rename":"It’s more than a new name: “Salvaging” borrows a word for \u003cem>rescue\u003c/em>, so killing sounds like saving. That’s euphemism.","g3euph":"Nothing harsh is softened here; it’s a required phrase that also reminds everyone they’re watched. Scripted speech.","g8read":"Someone \u003cem>wrote\u003c/em> it, secretly, in mock Latin, and Offred treasures it. That’s resistance."},"general":"Not yet. Ask: is the phrase \u003cem>required\u003c/em>, a \u003cem>new name\u003c/em>, a \u003cem>softened\u003c/em> name, about \u003cem>who may read\u003c/em>, or an act \u003cem>against\u003c/em> the rules?","why":"Scripted speech 1–3, renaming 4–5, euphemism 6, forbidden reading 7, resistance 8. Gilead’s first tool is language; Offred’s last freedom is language too.","hints":["Ask: is the phrase \u003cem>required\u003c/em>, a \u003cem>new name\u003c/em>, a \u003cem>softened\u003c/em> name, about \u003cem>who may read\u003c/em>, or an act \u003cem>against\u003c/em> the rules?","Three items are greetings and replies.","Scripted 1–3; renaming 4–5; euphemism 6; forbidden reading 7; resistance 8."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"How Gilead arrived: put these five stages from Offred’s memories in order. \u003cbutton type='button' class='btn ghost sm at-setup' data-setup='roots'>Set it up\u003c/button>","msgs":{"CA":"The emergency comes first. Every later step is justified by it.","Dlast":"Ignoring is how people \u003cem>live through\u003c/em> the changes; making it “ordinary” is the final, deliberate step.","BA":"Censorship is presented as a response to the attack, so the attack comes first."},"general":"Not yet. Start with the crisis that excuses everything.","why":"Nothing changes all at once. Forster’s citizens, too, built the Machine to serve them, then forgot how to live without it.","hints":["Start with the crisis that excuses everything.","Crisis → controls “for safety” → rights removed → adjustment → the new normal.","A → B → C → D → E."]}]},"part3":{"slug":"language","name":"Language","heading":"Language as control","intro":"The lab tested Gilead’s roots and built worlds. Now read the novel word by word: who controls the words, and how does a narrator take them back?","s1":{"title":"Station 1: “Freedom to and freedom from”","quote":"There is more than one kind of freedom [. . .]. Freedom to and freedom from.","cite":"(Atwood, ch. 5, p. __)","how":"Climb the ladder of reading. At each rung, choose the strongest wording.","rungs":[{"id":"r1","name":"Paraphrase","opts":[{"t":"Aunt Lydia says there are two kinds of freedom.","fb":"✓ A plain, accurate restatement: that’s a paraphrase.","_n":"1477e","_k":"0836c5d5"},{"t":"Aunt Lydia is talking about freedom.","fb":"Too vague: say \u003cem>what\u003c/em> she says about it.","_n":"1578e","_k":"b86b2e98"},{"t":"Aunt Lydia shows that Gilead is cruel.","fb":"That’s already a judgement; a paraphrase only restates.","_n":"1679e","_k":"a639593a"}]},{"id":"r2","name":"Observation","opts":[{"t":"The phrase is balanced, with the same word repeated and only the small preposition changing.","fb":"✓ You’ve noticed a craft choice: the balance and the one word that changes.","_n":"1772e","_k":"91cd8e67"},{"t":"Aunt Lydia says there is freedom to and freedom from.","fb":"Still a paraphrase: what do you notice about \u003cem>how\u003c/em> it’s said?","_n":"1873e","_k":"05a094e2"},{"t":"The phrase is interesting.","fb":"Name the feature: what exactly repeats, and what changes?","_n":"1974e","_k":"dbbc4a40"}]},{"id":"r3","name":"Interpretation","opts":[{"t":"Gilead calls protection from danger a kind of freedom, to excuse taking away women’s choices.","fb":"✓ You’ve said what the phrase means in Gilead.","_n":"1a75e","_k":"69998efa"},{"t":"The word “freedom” appears twice.","fb":"Still an observation: what does the balance \u003cem>mean\u003c/em>?","_n":"1b6ee","_k":"fbcf5c51"},{"t":"Freedom is important to everyone.","fb":"Too general: no link to Gilead or to the phrase.","_n":"1c6fe","_k":"c14d4c3b"}]},{"id":"r4","name":"Analysis","opts":[{"t":"By balancing “freedom to” against “freedom from”, Aunt Lydia makes confinement sound like a fair trade, and Atwood lets the tidy symmetry expose how persuasive control can be.","fb":"✓ Craft (the balance), meaning (confinement as a fair trade) and the “so what” (how persuasive control can be).","_n":"1d7ce","_k":"05d17801"},{"t":"Gilead takes away women’s choices and calls it freedom.","fb":"No “so what”: how does the craft make it persuasive, and why does Atwood show us?","_n":"1e7be","_k":"7411aa96"},{"t":"Atwood agrees that freedom from danger matters most.","fb":"That treats a character’s view as the author’s. Atwood lets us see the trick.","_n":"1f7ae","_k":"55d179c2"}]}],"done":"You’ve climbed from what she says to what the words do. That’s analysis."},"s2":{"title":"Station 2: Offred fights back with words","quotes":[{"id":"q1","t":"This is a reconstruction.","cite":"(Atwood, ch. 23, p. __)"},{"id":"q2","t":"Context is all.","cite":"(Atwood, ch. 29, p. __)"},{"id":"q3","t":"I would like to believe this is a story I’m telling.","cite":"(Atwood, ch. 7, p. __)"},{"id":"q4","t":"Nolite te bastardes carborundorum","cite":"(Atwood, ch. 9, p. __)","note":"the scratched phrase in her cupboard"}],"scrabble":"Also: the Commander’s forbidden Scrabble games, where Offred handles letters again (ch. 23–24).","how":"Build one analytical sentence: a claim, a quotation, and analysis. Tap a verb to add it to your analysis. Then press \u003cstrong>Check it with craft\u003c/strong>.","claimL":"Claim","claimPh":"e.g. Offred refuses to let Gilead own her story.","quoteL":"Quotation","anL":"Analysis","anPh":"e.g. By calling her telling a reconstruction, she reclaims…","verbs":["reclaims","reconstructs","unsettles","resists","reframes"],"check":"Check it with craft","ask":"What does this verb claim Offred’s words \u003cem>do\u003c/em>?","noVerb":"Your analysis doesn’t use a verb from the bank yet. Which verb says what her words \u003cem>do\u003c/em>?","need":"Write a claim, choose a quotation and write your analysis first.","pv":"Your sentence"},"s3":{"title":"Station 3: Two regimes, one trick","forster":{"t":"Beware of first-hand ideas!","cite":"(Forster, part III)","who":"Forster’s lecturer"},"atwood":{"t":"Freedom to and freedom from.","cite":"(Atwood, ch. 5, p. __)","who":"Aunt Lydia"},"how":"Tap a statement, then tap where it belongs.","regions":[{"id":"F","t":"Forster only"},{"id":"both","t":"Both"},{"id":"A","t":"Atwood only"}],"chips":[{"id":"v1","t":"Dependence is recast as protection.","_a":"GwdZTFwQ","fb":"Both: the Machine’s comfort and Gilead’s “freedom from” each make dependence sound like safety."},{"id":"v2","t":"Control arrives through comfort and technology.","_a":"GyMU","fb":"Forster: the Machine serves every need until people can’t live without it."},{"id":"v3","t":"Control arrives through crisis and religion.","_a":"GyQU","fb":"Atwood: an emergency and a theocracy bring Gilead."},{"id":"v4","t":"Direct experience is treated as dangerous.","_a":"GwdZTFwQ","fb":"Both: Gilead forbids reading, the Machine forbids first-hand ideas."}],"wrong":"Not there. Ask which text shows it, or whether both do.","done":"All four placed. One trick, two regimes: dependence sold as protection."},"quickCheck":{"title":"Language as control quick check","summary":"Language as control quick check","items":[{"id":"q1","goal":3,"prompt":"Gilead calls a public execution a “Salvaging”. This is an example of…","choices":[{"t":"euphemism","fb":"Right. It borrows a word for rescue to soften killing.","_n":"1g79e","_k":"a32ed1cc"},{"t":"onomatopoeia","fb":"It borrows a word for rescue to soften killing.","_n":"1h78e","_k":"949a4a79"},{"t":"alliteration","fb":"It borrows a word for rescue to soften killing.","_n":"1i77e","_k":"51957c03"},{"t":"a flashback","fb":"It borrows a word for rescue to soften killing.","_n":"1j76e","_k":"0c0fc4f9"}]},{"id":"q2","goal":5,"prompt":"Why might Offred insist “This is a reconstruction.”?","choices":[{"t":"It’s a random aside","fb":"She owns her story by admitting it’s a version, which Gilead would never allow.","_n":"1k75e","_k":"737ea16f"},{"t":"It proves she is a historian","fb":"She owns her story by admitting it’s a version, which Gilead would never allow.","_n":"1l74e","_k":"48b976a9"},{"t":"It admits her telling is shaped and partial, and claims the right to tell it","fb":"Right. She owns her story by admitting it’s a version, which Gilead would never allow.","_n":"1m73e","_k":"f934ada8"},{"t":"It shows the story is false","fb":"She owns her story by admitting it’s a version, which Gilead would never allow.","_n":"1n62e","_k":"396a508a"}]},{"id":"q3","goal":5,"prompt":"“Freedom to and freedom from” is spoken by…","choices":[{"t":"Aunt Lydia, training the Handmaids","fb":"Right. A character speaks it; don’t treat it as Atwood’s own view.","_n":"1o63e","_k":"cccd6341"},{"t":"Atwood, in a preface","fb":"A character speaks it; don’t treat it as Atwood’s own view.","_n":"1p60e","_k":"85ed25ce"},{"t":"Professor Pieixoto","fb":"A character speaks it; don’t treat it as Atwood’s own view.","_n":"1q61e","_k":"03153fe2"},{"t":"Offred, defending Gilead","fb":"A character speaks it; don’t treat it as Atwood’s own view.","_n":"1r66e","_k":"65d64ec2"}]},{"id":"q4","goal":3,"prompt":"Which question best opens a language-as-control analysis?","choices":[{"t":"Who controls the words, and what does that let them hide?","fb":"Right. Analysis asks \u003cem>how\u003c/em> and \u003cem>why\u003c/em>; plot questions ask \u003cem>what\u003c/em>.","_n":"1s67e","_k":"1b604fc1"},{"t":"What happens next?","fb":"Analysis asks \u003cem>how\u003c/em> and \u003cem>why\u003c/em>; plot questions ask \u003cem>what\u003c/em>.","_n":"1t64e","_k":"c67b0e9e"},{"t":"How many chapters are there?","fb":"Analysis asks \u003cem>how\u003c/em> and \u003cem>why\u003c/em>; plot questions ask \u003cem>what\u003c/em>.","_n":"1u65e","_k":"79a0b6fa"},{"t":"Is Gilead bad?","fb":"Analysis asks \u003cem>how\u003c/em> and \u003cem>why\u003c/em>; plot questions ask \u003cem>what\u003c/em>.","_n":"1v6ae","_k":"be916491"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cdiv class='at-steal' data-path='atwood'>\u003cp class='steal-line'>“We were the people who were not in the papers. We lived in the blank white spaces at the edges of print.”\u003c/p>\u003cp class='eng-cite'>(Atwood, ch. 10, p. __)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> “We were the people who were not in [X]. We lived in the [unnoticed space] at the edges of [Y].” The second sentence turns absence into a place to live.\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “We were the students who were not in the yearbook. We lived in the hallways between the photographs.”\u003c/p>\u003c/div>\u003cdiv class='at-steal' data-path='forster' hidden>\u003cp class='steal-line'>“Imagine, if you can, a small room, hexagonal in shape, like the cell of a bee.”\u003c/p>\u003cp class='eng-cite'>(Forster, part I)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> “Imagine, if you can, [a small place], [its shape], like [something from nature].” The invitation makes the reader build the strange room themselves.\u003c/p>\u003c/div>\u003cp>Write your own in the same shape.\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"We were the people who were not in the papers. We lived in the blank white spaces at the edges of print.","source":"Atwood, \u003ci>The Handmaid’s Tale\u003c/i>, ch. 10","masterF":"Imagine, if you can, a small room, hexagonal in shape, like the cell of a bee.","sourceF":"Forster, “The Machine Stops”","save":"Save it to My Art of Language (imitations)"}},"practice":{"activities":[{"id":"sort","type":"custom","title":"Convention sort","summary":"Convention sort","goal":[2,3,6],"instruction":"Sort each item by what it controls.","how":"Tap an item, then tap the bin it belongs in.","boxes":[{"id":"info","label":"Control of information"},{"id":"surv","label":"Surveillance"},{"id":"lang","label":"Language control"},{"id":"comfort","label":"Comfort and consent"},{"id":"frame","label":"Frame"}],"wrongDefault":"Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","items":[{"id":"s1","t":"Gilead’s Eyes (secret police) and the fear that anyone might be one of them","_a":"GxZDSkIQ","why":"Surveillance: secret police, and the fear that anyone is watching.","hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key word: “Eyes”.","Surveillance: secret police, and the fear that anyone is watching."]},{"id":"s2","t":"Women may not read; even the Bible is kept locked away","_a":"GwxYXlsQ","why":"Control of information: who may read decides who may know.","hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “may not read”.","Control of information: who may read decides who may know."]},{"id":"s3","t":"Handmaids must greet each other with “Blessed be the fruit”","_a":"GwlXVlMQ","why":"Language control: a required phrase limits what can be said.","hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “must greet”.","Language control: a required phrase limits what can be said."]},{"id":"s4","t":"Aunt Lydia promises “freedom from” danger in exchange for obedience","_a":"GwZZVVJdRxYb","why":"Comfort and consent: safety offered in exchange for obedience.","wrong":{"lang":"The words matter, but the item’s focus is the \u003cem>bargain\u003c/em>: safety in exchange for freedom."},"hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “in exchange for”.","Comfort and consent: safety offered in exchange for obedience."]},{"id":"s5","t":"The novel closes with a conference paper given two hundred years later","_a":"GwNEWVlXFw==","why":"Frame: a record from a later time surrounds the story.","wrong":{"info":"A record from a later time surrounds the story: a frame.","surv":"A record from a later time surrounds the story: a frame.","lang":"A record from a later time surrounds the story: a frame.","comfort":"A record from a later time surrounds the story: a frame."},"hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “two hundred years later”.","Frame: a later record surrounds the story and shapes how it’s remembered."]},{"id":"s6","t":"The Handmaids’ wings, white headdresses that keep them from seeing or being seen","_a":"GxZDSkIQ","why":"Surveillance: the wings keep Handmaids from being seen.","also":{"info":"Close: the wings limit what Handmaids see, but their stated purpose is to keep them from being seen, which is surveillance in reverse. Both work; this item’s focus is seeing."},"hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “seeing or being seen”.","Surveillance (Control of information also works): the wings are about seeing."]},{"id":"s7","t":"Handmaids lose their own names and take the Commander’s, as “Of-fred”","_a":"GwlXVlMQ","why":"Language control: renaming turns a woman into a possession.","hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “lose their own names”.","Language control: renaming turns a woman into a possession."]},{"id":"s8","t":"The television news shows only Gilead’s victories","_a":"GwxYXlsQ","why":"Control of information: the news is filtered.","hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “only Gilead’s victories”.","Control of information: the news is filtered."]},{"id":"s9","t":"Forster’s citizens thank the Machine and rarely leave their rooms","_a":"GwZZVVJdRxYb","why":"Comfort and consent: comfort keeps them inside, and they are grateful for it.","hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key words: “thank the Machine”.","Comfort and consent: comfort keeps them inside."]},{"id":"s10","t":"Forster’s citizens worship the “Book of the Machine”","_a":"GwxYXlsQ","why":"Control of information: one approved book holds what can be known.","hints":["Ask: what is being controlled: knowledge, behaviour, words, or memory of the story?","The key word: “worship”.","Control of information: one approved book holds what can be known."]}]},{"id":"archivist","type":"custom","title":"Unseen passage: “The Archivist”","summary":"The Archivist","star":true,"goal":[2,3,4,5,6],"instruction":"Read this sight passage, written for this course. Then answer six questions. R4 to R6 sit above Final Check level.","why":"You’ve never seen this text, so you’ll find out whether what you learned from Gilead transfers.","passage":"Every citizen of New Halifax is allowed one memory per year in the Archive. You choose it on your birthday, in a white booth that smells faintly of oranges, and a clerk with kind eyes seals it in glass. The rest of the year’s memories fade on schedule, gently, like ink in sunlight. People say it is a mercy. “Imagine,” the clerk told me when I was eight, “carrying every bad day forever.” This year I am seventeen, and I have chosen my memory already: the afternoon my brother taught me to skip stones at the harbour, the stone leaping five times, his laugh leaping with it. But the clerk is not smiling. She tells me that particular afternoon has been “retired.” My brother, it seems, was never here. I look at my hands, which remember the weight of the stone, and I wonder what else the Archive keeps that I have not chosen.","passageTitle":"“The Archivist” (written for this course)","items":[{"id":"r1","goal":3,"prompt":"\u003cstrong>R1.\u003c/strong> What does “retired” most likely imply about the brother?","options":[{"t":"He retired from work","why":"Look at the next sentence: “was never here.” “Retired” is a euphemism.","_n":"1w6be","_k":"43960d93"},{"t":"The narrator has forgotten him by choice","why":"She remembers him clearly; it’s the Archive that has “retired” the memory.","_n":"1xe8e","_k":"eff33de3"},{"t":"He moved away from New Halifax","why":"Moving away wouldn’t make him “never here”. The record itself has changed.","_n":"1ye7e","_k":"8512bbcd"},{"t":"The state has erased him from the record, and perhaps from existence","why":"“Retired” is a euphemism; the next sentence, “was never here”, shows he has been erased.","_n":"1zeae","_k":"b0916c47"}],"hints":["Read the sentence after “retired”.","“My brother, it seems, was never here.”","A euphemism: the state has erased him from the record."]},{"id":"r2","goal":3,"prompt":"\u003cstrong>R2.\u003c/strong> What does the simile “like ink in sunlight” do?","options":[{"t":"Shows the narrator likes summer","why":"The sunlight isn’t about weather; it’s about fading.","_n":"20e9e","_k":"342a329b"},{"t":"Shows that memories can be restored","why":"Faded ink doesn’t come back; the simile hides a loss.","_n":"21e4e","_k":"bc96c03b"},{"t":"Shows memories are written down","why":"The gentleness is the trick: it disguises erasure.","_n":"22e3e","_k":"d0226ce7"},{"t":"Makes forced forgetting sound natural and gentle, hiding its violence","why":"Ink fades quietly, as if by nature; the simile disguises an erasure someone schedules.","_n":"23e6e","_k":"ab8d238c"}],"hints":["What happens to ink in sunlight?","It fades slowly and quietly, as if by nature.","The simile makes a forced erasure sound natural and gentle."]},{"id":"r3","goal":5,"star":true,"prompt":"\u003cstrong>R3 ★.\u003c/strong> Is the narrator’s early view (“People say it is a mercy”) the story’s view?","options":[{"t":"It’s impossible to tell","why":"The ending answers it: she wonders what else the Archive keeps.","_n":"24e5e","_k":"453f3d9b"},{"t":"Yes, she agrees","why":"Notice “People say”, not “I believe”.","_n":"25f0e","_k":"6ca2d706"},{"t":"No: the story builds toward doubting it, and “People say” distances her from it","why":"“People say”, not “I believe”; by the end she wonders what else the Archive keeps.","_n":"26efe","_k":"07347ded"},{"t":"Yes, because the clerk has kind eyes","why":"Kind eyes are the regime’s soft face, not proof.","_n":"27eee","_k":"2bdbc4e0"}],"hints":["Whose words are “it is a mercy”?","“People say”, not “I believe”.","No: the story builds toward doubt."]},{"id":"r4","goal":2,"star":true,"prompt":"\u003cstrong>R4 ★.\u003c/strong> Which detail does the most to make the ending believable rather than melodramatic?","options":[{"t":"Her hands remembering the stone’s weight: the body keeps what the Archive erased","why":"A quiet physical detail is the proof; no speech is needed.","_n":"28efe","_k":"a1add02f"},{"t":"Her age, seventeen","why":"Her age sets the scene; it doesn’t prove the brother existed.","_n":"29f0e","_k":"a7da1b82"},{"t":"The booth that smells faintly of oranges","why":"A pleasant detail of the system, not the proof against it.","_n":"2af1e","_k":"a89eb7e7"},{"t":"The clerk’s kind eyes","why":"That’s the regime’s soft face; the bodily memory is the proof.","_n":"2bf2e","_k":"ce65a54b"}],"hints":["What proves the brother was real?","Look at the last sentence.","Her hands remember the weight of the stone."]},{"id":"r5","goal":4,"star":true,"prompt":"\u003cstrong>R5 ★.\u003c/strong> Which of Gilead’s methods does the Archive most resemble?","options":[{"t":"The Eyes","why":"No one is watched here; memory itself is managed.","_n":"2cf3e","_k":"99744f07"},{"t":"The Wall","why":"There’s no public terror here; the control is quiet and gentle.","_n":"2df4e","_k":"551c6403"},{"t":"Colour-coded dress","why":"Nothing here marks roles by clothing; the Archive manages memory.","_n":"2ef5e","_k":"6ddfa857"},{"t":"Erasing the past so that only the regime’s version remains, as Gilead’s banned reading and “time before” do","why":"Both control the past, not just actions.","_n":"2fe6e","_k":"f080132d"}],"hints":["What does the Archive control: actions, or the past?","The past.","Like Gilead’s control of reading and of “the time before”."]},{"id":"r6","goal":6,"star":true,"prompt":"\u003cstrong>R6 ★.\u003c/strong> How is the narrator like Offred?","options":[{"t":"Both are rebels with weapons","why":"Their resistance is memory and words, not force.","_n":"2ge7e","_k":"0bf4a766"},{"t":"Both have forgotten the past","why":"The opposite: each holds on to the past.","_n":"2hf4e","_k":"cffe5de7"},{"t":"Both work for the regime","why":"Neither serves the system; each keeps what it erases.","_n":"2if3e","_k":"22d762e1"},{"t":"Both resist by remembering and telling what the system wants forgotten","why":"Memory and words are their resistance.","_n":"2jf2e","_k":"fc9449d0"}],"hints":["What does Offred do with her memories of the time before?","She keeps them and tells them.","Both resist by remembering and telling."]}]},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Ulrich","goal":[1,3,5],"instruction":"Ulrich made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Analyse what Offred’s name shows about Gilead.","steps":["In \u003ci>The Handmaid’s Tale\u003c/i>, the narrator is known only as Offred.","She is a Handmaid who lives in the Commander’s house, goes shopping with Ofglen and remembers her husband, Luke.","Later she plays Scrabble with the Commander.","This shows Gilead is strict."],"_a":"CA==","stepFb":["Accurate context. Keep checking.","","Sentence 3 continues the problem in sentence 2.","Too broad, but the first slip came earlier."],"fixes":[{"t":"Add more plot details to sentence 2.","why":"More summary won’t create analysis.","_n":"2kf1e","_k":"ec646d81"},{"t":"Sentence 2 is correct.","why":"It retells events without saying what the name \u003cem>means\u003c/em> or how it works.","_n":"2lf8e","_k":"e11368e7"},{"t":"Replace sentence 2 with analysis: “Because ‘Offred’ joins ‘of’ to the Commander’s first name, the name turns a woman into a possession, and when she is reassigned the name will pass to the next woman.”","why":"It says what the name \u003cem>does\u003c/em>, not what happens.","_n":"2mf7e","_k":"f9ffadfe"},{"t":"Delete sentence 1.","why":"Sentence 1 is fine; the problem is summary in place of analysis.","_n":"2nf6e","_k":"3dc1f33b"}],"hints":["Which sentence only retells what happens?","Sentence 2 is a list of events.","Turn it into a claim about what the name does."]},{"id":"e2","goal":1,"task":"Explain why \u003ci>The Handmaid’s Tale\u003c/i> still matters.","steps":["Margaret Atwood’s \u003ci>The Handmaid’s Tale\u003c/i> (1985) imagines a theocratic regime in the former United States.","The novel matters because Atwood predicted the future.","Readers today can check which predictions came true.","So it is a forecast more than a story."],"_a":"CA==","stepFb":["Accurate and well framed.","","This follows from the flawed premise in sentence 2.","Same flaw, extended."],"fixes":[{"t":"“The novel matters because, by Atwood’s own rule, every practice in Gilead has a historical precedent, so readers learn to recognize warning signs in their own time.”","why":"Precedent, not prediction: that’s why it still matters.","_n":"2of5e","_k":"e7a8189e"},{"t":"“The novel matters because it is set in the future.”","why":"Setting isn’t significance.","_n":"2pece","_k":"60583bb5"},{"t":"“The novel matters because it is famous.”","why":"Fame isn’t an argument.","_n":"2qebe","_k":"6063b901"},{"t":"Sentence 2 is correct.","why":"Speculative fiction magnifies the present; it doesn’t forecast.","_n":"2red5","_k":"ab3102a0"}],"hints":["Is speculative fiction a prediction?","Think “magnify”, not “forecast”.","Precedents, recognized in our own time."]},{"id":"e3","goal":5,"task":"Analyse the Historical Notes.","steps":["The novel ends with the “Historical Notes”, a transcript of an academic conference held long after Gilead’s fall.","There, Professor Pieixoto discusses how Offred’s recorded tapes were found and pieced together.","Through Pieixoto, Atwood tells readers that we should not judge Gilead.","So the ending asks us to stay neutral."],"_a":"Cw==","stepFb":["A clear, accurate frame.","Accurate. Keep checking.","","This follows from the misreading in sentence 3."],"fixes":[{"t":"“Pieixoto proves the story really happened.”","why":"He studies a fictional document; the frame comments on how stories are received.","_n":"2sec5","_k":"b368aa3e"},{"t":"Sentence 3 is correct.","why":"A character’s view isn’t the author’s; Atwood makes Pieixoto’s coolness something to question.","_n":"2tef5","_k":"2f619788"},{"t":"“The Historical Notes are an appendix and can be skipped.”","why":"The frame is part of the meaning.","_n":"2uee5","_k":"f4cdad32"},{"t":"“Pieixoto’s cautious refusal to judge Gilead, and his jokes at the start of his talk, make his detachment part of what the novel criticizes: even after Gilead falls, Offred’s voice can be treated as a curiosity.”","why":"It separates the character’s view from the author’s, and says what the frame does.","_n":"2vf15","_k":"8da0b4b7"}],"hints":["Whose view is it: Pieixoto’s or Atwood’s?","A character can say what the author questions.","His detachment is part of what the ending examines."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which of Gilead’s six features felt closest to something you’ve read about in history, and how did linking it change the way you see the novel?"},{"id":"j2","q":"In your own words: why are renaming and scripted greetings tools of power rather than just strange customs?"},{"id":"j3","q":"Explain to a friend why “Atwood predicted the future” is the wrong way to praise her, using her rule."},{"id":"j4","q":"What still puzzles you about the novel, perhaps the ending or the Historical Notes, and what will you reread to think it through?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from this module, from \u003ci>The Handmaid’s Tale\u003c/i>, Forster or “The Archivist”, that you want to remember. Add one sentence on why it stays with you.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one craft principle you’ve earned in this module: a rule a writer or reader could live by. Then give the master’s example (a line from \u003ci>The Handmaid’s Tale\u003c/i>, with its page number, or from Forster), and your own imitation.","placeholder":"e.g. To make the strange believable, build it inside the familiar.","examples":["“We slept in what had once been the gymnasium.” (Atwood, ch. 1, p. __)","“We were the people who were not in the papers. We lived in the blank white spaces at the edges of print.” (Atwood, ch. 10, p. __)","“Freedom to and freedom from.” (Atwood, ch. 5, p. __)","“This is a reconstruction.” (Atwood, ch. 23, p. __)","“Imagine, if you can, a small room, hexagonal in shape, like the cell of a bee.” (Forster, part I)","“Beware of first-hand ideas!” (Forster, part III)","“The rest of the year’s memories fade on schedule, gently, like ink in sunlight.” (“The Archivist”)"]},"artSamples":[{"p":"To make the strange believable, build it inside the familiar.","master":"“We slept in what had once been the gymnasium.” (Atwood, ch. 1, p. __)","imit":"“We ate in what had once been the library.”"},{"p":"Give the oppressor the most beautiful sentence; let the reader distrust it.","master":"“Freedom to and freedom from” (Atwood, ch. 5, p. __)","imit":"“Not the right to choose, the official said, but the right to be spared from choosing.”"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"How does speculative fiction differ from science fiction, as Atwood distinguishes them?","options":[{"t":"Speculative fiction is any story set in the future","why":"Setting isn’t the test; possibility is.","_n":"2wf05","_k":"2dce9350"},{"t":"Speculative fiction imagines things that could really happen with means we already have","why":"Possibility with present means is the test.","_n":"2xf35","_k":"f5628433"},{"t":"Speculative fiction accurately predicts the future","why":"It magnifies the present; it doesn’t forecast.","_n":"2yf25","_k":"98d20c0c"},{"t":"Speculative fiction is about impossible technologies","why":"That’s closer to her description of science fiction.","_n":"2ze55","_k":"5948150d"}]},"b":{"prompt":"A novel imagines that every home camera reports “unhappy faces” to a government agency. By the module’s definition, it is…","options":[{"t":"Fantasy, because no government would do this","why":"History suggests otherwise; plausibility is the point.","_n":"30e45","_k":"226d2335"},{"t":"Speculative fiction, because the technology and the practice could really exist","why":"Cameras and agencies exist; the premise could happen.","_n":"31e75","_k":"4d0ed324"},{"t":"Realist fiction, because it’s about families","why":"Its premise is a “what if”, not a record.","_n":"32e85","_k":"6d808683"},{"t":"Science fiction, because cameras are technology","why":"Science fiction needs what \u003cem>can’t\u003c/em> happen; cameras exist.","_n":"33e55","_k":"3db0331b"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"The “Historical Notes” at the end of \u003ci>The Handmaid’s Tale\u003c/i> are best described as…","options":[{"t":"an optional appendix","why":"It changes the meaning of the whole novel.","_n":"34e65","_k":"ffdace7f"},{"t":"a flashback to the time before","why":"A flashback moves within the story; this sits outside it.","_n":"35e35","_k":"51725aa7"},{"t":"the author’s preface","why":"It’s a fictional conference, not Atwood speaking.","_n":"36e45","_k":"726f013b"},{"t":"a framing device: a later document that surrounds Offred’s story and shapes how we read it","why":"It sits outside her story and changes how we read it.","_n":"37e15","_k":"cf507dc0"}]},"b":{"prompt":"Which is a common \u003cstrong>dystopian convention\u003c/strong> that Gilead uses?","options":[{"t":"A happy ending in which the system is perfected","why":"That’s a utopian resolution.","_n":"38e25","_k":"9dd3968f"},{"t":"A narrator who is a talking animal","why":"That’s a fable device, not a dystopian one.","_n":"39ef5","_k":"2de35692"},{"t":"A setting with no government at all","why":"That’s closer to post-apocalyptic anarchy.","_n":"3af05","_k":"2660dcb9"},{"t":"Control of information presented as protection","why":"Gilead calls its control of reading and news protection.","_n":"3b615","_k":"ca3cae40"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Gilead calls a public execution a “Salvaging”. This is an example of…","options":[{"t":"hyperbole","why":"It understates; it doesn’t exaggerate.","_n":"3c605","_k":"4af05d67"},{"t":"onomatopoeia","why":"No sound-word here.","_n":"3d5f5","_k":"e680c20f"},{"t":"oxymoron","why":"An oxymoron joins opposites (“deafening silence”); this softens a harsh truth.","_n":"3e5e5","_k":"1fd0aeb5"},{"t":"euphemism","why":"It borrows a word for rescue to soften a killing.","_n":"3f655","_k":"748c5b10"}]},"b":{"prompt":"Handmaids must greet each other with “Blessed be the fruit” and answer “May the Lord open.” (Atwood, ch. 4–5, p. __) This is an example of…","options":[{"t":"euphemism","why":"Nothing harsh is being softened; the phrases are required.","_n":"3g645","_k":"61e3399f"},{"t":"a simile","why":"There’s no comparison with \u003cem>like\u003c/em> or \u003cem>as\u003c/em>.","_n":"3h635","_k":"ff05406b"},{"t":"scripted speech that limits what people can say","why":"The phrases are required, so nothing else can be said.","_n":"3i625","_k":"fb2e226c"},{"t":"a flashback","why":"There’s no shift in time.","_n":"3j695","_k":"70b71c43"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"The novel opens: “We slept in what had once been the gymnasium.” (Atwood, ch. 1, p. __) What does the opening most strongly suggest?","options":[{"t":"Gilead has been built inside the reader’s familiar world, which now exists only as the past","why":"“Had once been” turns our familiar world into Gilead’s ruins.","_n":"3k685","_k":"994c7dc4"},{"t":"The story is set in ancient times","why":"A gymnasium with a remembered past points to a near future.","_n":"3l5b5","_k":"7549b093"},{"t":"The narrator approves of her new home","why":"Nothing in the line shows approval; the reader senses loss.","_n":"3m5c5","_k":"c94bde0f"},{"t":"The narrator is a student on a sports team","why":"Over-literal: “had once been” signals a changed purpose.","_n":"3n5d5","_k":"86904823"}]},"b":{"prompt":"Aunt Lydia tells the Handmaids there is “freedom to and freedom from.” (Atwood, ch. 5, p. __) What does the line most strongly reveal?","options":[{"t":"Aunt Lydia is joking","why":"Nothing signals a joke; the danger is that she means it.","_n":"3o5e5","_k":"c3f5198f"},{"t":"Gilead recasts confinement as protection, using neat language to make a loss sound like a gift","why":"The tidy balance makes a loss sound like a gift.","_n":"3p5f5","_k":"2bb14290"},{"t":"The Handmaids are free to leave","why":"The novel shows they are not.","_n":"3q605","_k":"4f943ad9"},{"t":"Atwood believes safety matters more than freedom","why":"A character speaks it, and the novel invites us to distrust it.","_n":"3r615","_k":"580aa063"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A student argues: “\u003ci>The Handmaid’s Tale\u003c/i> is far-fetched because nothing like Gilead could happen.” Which response best evaluates this claim?","options":[{"t":"It’s right: old novels can’t be relevant","why":"Age isn’t the test; the magnified practices are.","_n":"3s625","_k":"847aded9"},{"t":"It ignores Atwood’s rule: each of Gilead’s practices has a real precedent somewhere in history","why":"Precedent is the answer to “far-fetched”.","_n":"3t635","_k":"7a0a0b14"},{"t":"It’s right, because Gilead hasn’t literally happened","why":"Speculative fiction isn’t judged on accurate prediction.","_n":"3u645","_k":"b0873d61"},{"t":"It’s wrong because Atwood predicted events correctly","why":"Praise by prediction repeats the same mistake.","_n":"3v656","_k":"899447f6"}]},"b":{"prompt":"A reviewer calls a dystopia weak because “nothing in it could ever happen.” Which evidence would best defend it as speculative fiction?","options":[{"t":"Showing that each of its controls has a real historical or present-day precedent","why":"Plausibility is shown by precedent.","_n":"3w646","_k":"e7ca6305"},{"t":"Showing that it’s set far in the future","why":"Distance in time doesn’t answer the charge.","_n":"3x676","_k":"09d30f92"},{"t":"Showing that it won prizes","why":"Awards aren’t evidence of plausibility.","_n":"3y666","_k":"147b597e"},{"t":"Showing that its author predicted events correctly","why":"Plausibility, not prediction, is the defence.","_n":"3z616","_k":"dd424e1e"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"In a story, citizens happily trade their privacy for free transit passes. Years later, those without passes cannot travel at all. Which dystopian pattern does this show?","options":[{"t":"A utopia is achieved","why":"Losing the freedom to travel isn’t ideal.","_n":"40606","_k":"20e35d4c"},{"t":"A violent revolution overthrows a tyrant","why":"No revolution occurs; the control is welcomed.","_n":"41636","_k":"54a5552a"},{"t":"A natural disaster reshapes society","why":"The change is chosen, not natural.","_n":"42626","_k":"6b8f8b7c"},{"t":"Comfort or safety chosen freely hardens into control","why":"The trade is welcomed, then it becomes the only way to travel.","_n":"436d6","_k":"23f975e0"}]},"b":{"prompt":"A school app rewards “positive posts” with points. Soon, students with low points can’t enrol in electives. Which dystopian pattern does this show?","options":[{"t":"A frame narrative","why":"There’s no surrounding story here.","_n":"446c6","_k":"4ca2aed7"},{"t":"Comfort or safety chosen freely hardens into control","why":"A reward everyone accepted becomes a gate.","_n":"455f6","_k":"712c3c39"},{"t":"A utopia is achieved","why":"Barring students from courses isn’t ideal.","_n":"46606","_k":"db3a827a"},{"t":"Surveillance by a foreign enemy","why":"The app is internal and chosen.","_n":"475d6","_k":"0bc74f42"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best \u003cstrong>analytical thesis\u003c/strong> about language in \u003ci>The Handmaid’s Tale\u003c/i>?","options":[{"t":"“By scripting greetings and renaming women after the men they serve, Gilead makes control sound holy and natural, which is why Offred’s private wordplay and her insistence on telling her own story become acts of resistance.”","why":"It names the techniques, says what they do, and why Offred’s words matter.","_n":"485e6","_k":"4a51eddf"},{"t":"“\u003ci>The Handmaid’s Tale\u003c/i> is about a woman who says ‘Blessed be the fruit.’”","why":"That’s plot, not a claim.","_n":"49636","_k":"8919eda2"},{"t":"“Atwood uses a lot of interesting words.”","why":"Too vague to argue.","_n":"4a646","_k":"896cd961"},{"t":"“In Gilead, women are not allowed to read.”","why":"A fact, not a thesis.","_n":"4b616","_k":"b06ab09b"}]},"b":{"prompt
