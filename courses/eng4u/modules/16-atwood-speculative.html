":"Which is the best \u003cstrong>analytical thesis\u003c/strong> about the “Historical Notes”?","options":[{"t":"“Atwood thinks we shouldn’t judge Gilead.”","why":"That confuses a character’s view with the author’s.","_n":"4c626","_k":"1e7de995"},{"t":"“By ending with a scholar who jokes about Offred’s story and declines to judge Gilead, Atwood turns the frame into a final warning: even after a regime falls, the voices it silenced can be treated as curiosities.”","why":"An arguable claim about what the frame does.","_n":"4d676","_k":"1a08ddd0"},{"t":"“The Historical Notes tell us what happened after the story.”","why":"That’s plot.","_n":"4e686","_k":"a8a622f9"},{"t":"“The Historical Notes are at the end of the book.”","why":"A fact, not a claim about meaning.","_n":"4ff96","_k":"b6fbe84f"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which sentence best avoids treating speculative fiction as prediction?","options":[{"t":"“Atwood’s novel is science fiction about the future.”","why":"Could it really happen with the means we have? Gilead uses no impossible technology, so it’s speculative.","_n":"4gf86","_k":"fdf80a9b"},{"t":"“Atwood predicted exactly what would happen in the twenty-first century.”","why":"Speculative fiction magnifies the present; it doesn’t forecast it. Ask what real precedent Gilead enlarges.","_n":"4hf76","_k":"fedc6fa7"},{"t":"“Atwood’s novel is accurate because some events came true.”","why":"Speculative fiction magnifies the present; it doesn’t forecast it. Ask what real precedent Gilead enlarges.","_n":"4if66","_k":"c1115a7b"},{"t":"“Atwood’s Gilead gathers practices that have existed in history, inviting readers to recognize them in their own time.”","why":"It treats Gilead as gathered from history, not as a forecast.","_n":"4jf56","_k":"5ea824c4"}]},"b":{"prompt":"Which sentence best avoids treating speculative fiction as prediction?","options":[{"t":"“Forster predicted the internet in 1909.”","why":"Speculative fiction magnifies the present; it doesn’t forecast it.","_n":"4kf46","_k":"0f0d159b"},{"t":"“Forster’s story is science fiction because of the Machine.”","why":"Ask whether it could happen with the means we have; the Machine magnifies real technology.","_n":"4lf36","_k":"bdcc46bf"},{"t":"“Forster’s Machine exaggerates his era’s growing faith in technology, which is why the story still unsettles readers in the internet age.”","why":"It names a present trend the story magnifies.","_n":"4mf26","_k":"fdf98e38"},{"t":"“Forster was wrong because we don’t live underground.”","why":"Speculative fiction isn’t judged on accurate prediction.","_n":"4nf16","_k":"599d0a1f"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A Canadian speculative novel (fictional: \u003ci>Thaw\u003c/i>) imagines the North after the permafrost melts, with southern companies racing to claim land. Which reading connects it most responsibly to present Canadian contexts?","options":[{"t":"It has no connection to Canada because it’s set in the future","why":"The future here is built from Canadian present-day issues.","_n":"4of06","_k":"9cd1ca2b"},{"t":"It’s science fiction because permafrost can’t melt","why":"It’s already melting; that’s the point.","_n":"4pf36","_k":"b1d4d10b"},{"t":"It predicts that the North will be sold by 2050","why":"Speculative fiction magnifies the present; it doesn’t forecast it. Ask what real precedent Gilead enlarges.","_n":"4qf46","_k":"afc6ece1"},{"t":"It magnifies current debates about climate change, resource extraction and Indigenous land rights, asking who decides the North’s future","why":"It reads the novel as a magnifying glass on present debates.","_n":"4rf56","_k":"8d5a727c"}]},"b":{"prompt":"A Canadian speculative novel (fictional: \u003ci>Static\u003c/i>) imagines a national app that rates citizens’ online “civility”. Which reading connects it most responsibly to present contexts?","options":[{"t":"It magnifies current debates about online speech, privacy and the power of platforms to shape behaviour","why":"It connects the premise to real, present debates.","_n":"4sf66","_k":"4a97aeae"},{"t":"It’s fantasy because apps can’t rate behaviour","why":"Many already score behaviour.","_n":"4tef6","_k":"36794317"},{"t":"It’s only about phones, not society","why":"The app is a lens on social control.","_n":"4uf06","_k":"3d8ba171"},{"t":"It predicts a law that will pass next year","why":"Speculative fiction magnifies the present; it doesn’t forecast it. Ask what real precedent Gilead enlarges.","_n":"4vf16","_k":"195ba737"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"You’re writing the opening of a dystopia set in your own town. Which choice best uses the technique of Atwood’s first sentence?","options":[{"t":"List every rule in the first paragraph","why":"That’s exposition, not invitation.","_n":"4wf26","_k":"30c7a891"},{"t":"Explain the regime’s whole history first","why":"Atwood lets the world arrive in fragments.","_n":"4xeb6","_k":"4413465f"},{"t":"Begin with a battle to grab attention","why":"Atwood begins quietly, in a gym.","_n":"4yec6","_k":"b7e07383"},{"t":"Place the characters in an ordinary local building that has been repurposed, so the reader recognizes their own world in ruins","why":"Like Atwood’s gymnasium, a repurposed familiar place makes the reader’s world the ruin.","_n":"4zdd7","_k":"94a7db0c"}]},"b":{"prompt":"You want readers to see how your dystopia will be remembered. Which choice best uses a \u003cstrong>framing device\u003c/strong>, as Atwood does?","options":[{"t":"Add a map at the front","why":"A map is a paratext, not a narrative frame.","_n":"50dc7","_k":"728c1e85"},{"t":"End with a document from a later era that discusses your story as an artifact","why":"A later document that treats your story as an artifact is a frame, like the Historical Notes.","_n":"51df7","_k":"0216135e"},{"t":"Write the whole story in the present tense","why":"Tense isn’t a frame.","_n":"52de7","_k":"e65d6e41"},{"t":"Make the narrator a rebel","why":"A choice of protagonist, not a frame.","_n":"53e17","_k":"4f650f73"}]}}]},"task":{"title":"Performance task: Pitch a speculative world","summary":"Pitch a speculative world","statement":"\u003cp>Use Atwood’s rule to pitch a speculative world rooted in the real, then write its opening paragraph. Make the familiar strange, the way Atwood’s gymnasium or Forster’s honeycomb room does. There are endless good answers.\u003c/p>\u003cp>You make: (1) a “What if…?” premise of 8–30 words; (2) a world of 2–4 precedent-deck elements, each linked to a precedent; (3) an opening paragraph of 120–220 words with at least two convention tags on its words; (4) a craft statement of at least 50 words.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg at-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Criterion\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Thinking: extrapolation\u003c/td>\u003ctd>The premise isn’t rooted in a real trend\u003c/td>\u003ctd>Loosely rooted; the logic is unclear\u003c/td>\u003ctd>Rooted and logical\u003c/td>\u003ctd>Rooted, logical and illuminating: it makes the present visible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Knowledge: conventions\u003c/td>\u003ctd>Conventions absent or misused\u003c/td>\u003ctd>One convention, used thinly\u003c/td>\u003ctd>Conventions used purposefully\u003c/td>\u003ctd>Conventions integrated so they create meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication: voice and craft\u003c/td>\u003ctd>Flat or unclear prose\u003c/td>\u003ctd>Some vivid detail\u003c/td>\u003ctd>Controlled voice; precise diction\u003c/td>\u003ctd>A distinctive voice; every detail earns its place\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application: craft statement\u003c/td>\u003ctd>Restates the plot\u003c/td>\u003ctd>Names choices\u003c/td>\u003ctd>Explains choices and their effects\u003c/td>\u003ctd>Explains choices with insight, linking them to Atwood’s or Forster’s methods\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["A “What if…?” premise","Atwood’s rule: rooted in the real","Speculative, not science fiction","Make the familiar strange","Conventions at work","Opening length","Craft statement"],"tips":["Begin with “What if” and end with a question mark.","Link every element to a precedent: where has something like this happened?","Swap the impossible element for one with a real precedent: Atwood’s rule.","Open with an invitation (“Imagine…”) or a repurposed place (“what had once been…”).","Tag at least two places where your paragraph shows a convention.","Aim for 120–220 words: one rich paragraph.","Explain your choices in at least 50 words."],"explainPrompt":"Craft statement: What present-day habit did you magnify, and what precedent keeps it within Atwood’s rule? Which convention did you use to make it frightening or moving, and how does your opening make the familiar strange?","explainLabel":"Craft statement","vocab":"Use the words extrapolate, precedent, convention and euphemism (or frame).","checkLabel":"Check my pitch","success":"Every part is there.","more":"There are endless good answers. Your teacher reads your pitch for insight and voice; the checklist only checked the parts. Want to try a second world?","min":120,"max":220,"pmin":8,"pmax":30,"craftMin":50,"invite":["imagine","picture","consider","suppose","look"],"repurpose":["had once been","used to be","once was","what was once"],"labels":{"premise":"1. Premise","premiseHow":"One “What if…?” question, 8–30 words.","draft":"Use the lab’s draft","world":"2. Your world (the same cards as the lab’s Build mode)","opening":"3. Opening paragraph","openingHow":"120–220 words. Make the familiar strange.","drafts":"Saved drafts","saveDraft":"Save a draft","restore":"Restore","maxDrafts":"Up to 3 drafts; saving a fourth replaces the oldest.","tag":"Tag your opening","tagHow":"Tap words in your opening, then tap a convention. Tags on words you later change are removed.","noText":"Write your opening first; its words appear here to tag.","pv":"Your pitch","words":"words","tags":"Tags"},"modelsLabel":"Three model responses, three approaches","models":[{"title":"Model 1: Forster’s invitation (water rationing)","premise":"What if fresh water grew so scarce that every household’s ration depended on its neighbours’ reports?","elements":"“Rationed water by household score”, linked to wartime rationing; “Public praise for informers”, linked to informer campaigns.","text":"Imagine, if you dare, a kitchen in Hamilton where the tap answers only to a thumbprint. Each morning it pours exactly what the Board allows: two litres for drinking, one for washing, and a half-litre more if your neighbours have rated you Considerate. Mrs. Osei rinses her cup with care. She has learned to smile at the Ferreiras on the stairs, to compliment their tomatoes, to never, ever run a bath. Last month the Ferreiras’ little boy left a hose running in the courtyard, and by Friday the family’s tap gave nothing but a polite chime and the word \u003cem>Pending\u003c/em>. No one shouted. No one was taken anywhere. The water simply learned who deserved it, and the neighbours learned to be deserving. Mrs. Osei saves the cloudy rinse water in a jar for her plants, and wonders, sometimes, who is rating her.","tags":"“rated you Considerate” (surveillance); “the word \u003cem>Pending\u003c/em>” (euphemism)."},{"title":"Model 2: Atwood’s repurposed place (a school)","premise":"What if schools ranked students each day by an attention score that decided who could speak in class?","elements":"“A list of approved words”, linked to approved word lists; “Ritual greetings”, linked to ritual school recitations.","text":"We learned in what had once been the music room, though no one remembers the music. The green glow on my desk means I am Present. Mr. Halvorsen says attention is a gift we give each other, and I believe him, because my score is ninety-four. At nine we recite the Focus Pledge together, eyes on the light, and then the speakers are chosen. Only Greens may ask questions. Ambers may answer if called. Reds may listen, which Mr. Halvorsen says is the most important skill of all. Priya was Red all last week. She sits very straight now and says only words from the Clear List, like \u003cem>agree\u003c/em> and \u003cem>understand\u003c/em> and \u003cem>thank you\u003c/em>. I think she is improving. Yesterday she smiled at me with her mouth and not her eyes, and I gave her a gold star in my mind.","tags":"“the Focus Pledge” (scripted speech); “words from the Clear List” (limited language)."},{"title":"Model 3: A frame (an artifact from the future)","premise":"What if memories were stored in a national archive and citizens could keep only the ones the archive approved?","elements":"“Erasing names from records”, linked to erased names in official records; “Permits to leave home”, linked to travel passes.","text":"Consider this card, recovered in 2163 from a collapsed archive beneath what was once Saskatoon. It is the size of a hand and printed in calm blue type: \u003cem>Memory Permit, Category C, Holder may retain one (1) personal recollection per calendar year.\u003c/em> On the back, in pencil, someone has written a list: \u003cem>the lake, the dog, Grandpa’s laugh, the lake again.\u003c/em> Scholars disagree about the list. Some call it a request; others, an act of defiance, since unapproved recollections were officially classified as Clutter and collected each December for Processing. What we know is this: the holder never filed the card. It was found folded into a child’s shoe, as if someone hoped the memories might walk away on their own.","tags":"“classified as Clutter” (euphemism); “Memory Permit” (control of information)."}],"rubric":[["Thinking: extrapolation","The premise isn’t rooted in a real trend","Loosely rooted; the logic is unclear","Rooted and logical","Rooted, logical and illuminating: it makes the present visible"],["Knowledge: conventions","Conventions absent or misused","One convention, used thinly","Conventions used purposefully","Conventions integrated so they create meaning"],["Communication: voice and craft","Flat or unclear prose","Some vivid detail","Controlled voice; precise diction","A distinctive voice; every detail earns its place"],["Application: craft statement","Restates the plot","Names choices","Explains choices and their effects","Explains choices with insight, linking them to Atwood’s or Forster’s methods"]]},"cards":[["Speculative fiction","Fiction about what \u003cem>could\u003c/em> really happen with means we already have (Atwood’s distinction)."],["Atwood’s rule","Nothing in \u003ci>The Handmaid’s Tale\u003c/i> without a precedent in history: Gilead is gathered, not invented."],["Dystopia","A society presented as ideal that is controlling or harmful underneath. From \u003cem>dys-\u003c/em>, “bad”, plus \u003cem>topos\u003c/em>, “place”."],["Extrapolation","Pushing a present trend or past practice forward to see where it leads."],["Precedent","A real past or present example of something a speculative world imagines (e.g. laws against teaching enslaved people to read, behind Gilead’s ban on women reading)."],["Framing device","A story or document around the main story: the “Historical Notes”, which end “Are there any questions?”"],["Euphemism","A soft word for a harsh truth: Gilead’s “Salvaging” for a public execution."],["Scripted speech","Required phrases that limit what people can say: “Blessed be the fruit” / “May the Lord open”."],["Renaming as ownership","“Of-fred”: a woman named for the man she serves."],["Freedom to / freedom from","Aunt Lydia’s trade: safety offered in exchange for choice (ch. 5)."],["“This is a reconstruction.”","Offred admits her telling is shaped, and so claims her story as her own (ch. 23)."],["Comfort to control","Crisis → controls “for safety” → rights removed → “We lived, as usual, by ignoring.” → “It will become ordinary.”"]],"misc":{"M1":"Speculative fiction magnifies the present; it doesn’t forecast it. Ask what real precedent Gilead enlarges.","M2":"Could it really happen with the means we have? Gilead uses no impossible technology, so it’s speculative.","M3":"That tells me \u003cem>what\u003c/em> happens. Now tell me what the choice \u003cem>does\u003c/em>: what it makes the reader notice, fear or question.","M4":"Aunt Lydia believes “freedom from” is a gift; Atwood doesn’t. The gap between them is where the meaning lives.","M5":"Notice what people got used to. “We lived, as usual, by ignoring.”","M6":"Calling a public execution a “Salvaging” changes what people can \u003cem>say\u003c/em> about it, and so what they can easily \u003cem>think\u003c/em>.","M7":"The frame tells you who survived to tell Offred’s story, and how coolly they tell it. That’s part of the meaning."}}};</script>
