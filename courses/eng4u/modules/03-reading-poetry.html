,"options":[{"t":"The speaker sees himself in “those boughs which shake against the cold, / Bare ruined choirs, where late the sweet birds sang” (Shakespeare, lines 3–4).","why":"Quotation marks, a spaced slash at the line break, and line numbers in the citation.","_n":"49244","_k":"f42a6c8b"},{"t":"The speaker sees himself in “those boughs which shake against the cold, / Bare ruined choirs, where late the sweet birds sang” (Shakespeare 73).","why":"Cite line numbers, not the sonnet’s number as a page.","_n":"4a234","_k":"9192d8f7"},{"t":"The speaker sees himself in those boughs which shake against the cold, / Bare ruined choirs (Shakespeare, lines 3–4).","why":"Quoted words need quotation marks.","_n":"4b264","_k":"77c9741d"},{"t":"The speaker sees himself in “those boughs which shake against the cold, Bare ruined choirs, where late the sweet birds sang” (Shakespeare, lines 3–4).","why":"The line break isn’t marked.","_n":"4c254","_k":"28cee5cb"}]},"b":{"prompt":"Which sentence quotes lines 1–2 of “Remember” correctly in MLA style?","options":[{"t":"The speaker pleads, Remember me when I am gone away, / Gone far away into the silent land (Rossetti, lines 1–2).","why":"Quotation marks are missing.","_n":"4d184","_k":"cab9018c"},{"t":"The speaker pleads, “Remember me when I am gone away, / Gone far away into the silent land” (Rossetti, lines 1–2).","why":"Quotation marks, a spaced slash at the line break, and line numbers in the citation.","_n":"4e174","_k":"8ab0af91"},{"t":"The speaker pleads, “Remember me when I am gone away, / Gone far away into the silent land” (Rossetti 1).","why":"That reads as a page number; write “lines 1–2”.","_n":"4f8e3","_k":"8f4f2d95"},{"t":"The speaker pleads, “Remember me when I am gone away… Gone far away into the silent land” (Rossetti, lines 1–2).","why":"An ellipsis means words were cut; mark the line break with a slash.","_n":"4g8f3","_k":"10a7efcb"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A student wants to write a sonnet about leaving home in which the last two lines suddenly reverse everything before them. Which form fits best?","options":[{"t":"A Petrarchan sonnet, which turns in its final couplet","why":"Petrarchan sonnets turn at line 9, not in a couplet.","_n":"4h903","_k":"e7c8009d"},{"t":"A ballad, because ballads end with a couplet","why":"Ballads are quatrain stories, not 14-line turns.","_n":"4i913","_k":"9ea81b51"},{"t":"A Shakespearean sonnet: three quatrains build the feeling, and the couplet delivers the reversal","why":"Shakespearean sonnets usually turn in the couplet, so the reversal lands in the last two lines.","_n":"4j923","_k":"caaa240e"},{"t":"Free verse, because sonnets can’t reverse","why":"Sonnets are built to turn.","_n":"4k933","_k":"47b0b645"}]},"b":{"prompt":"A student wants eight lines building a question about a friendship, then six lines answering it. Which form fits best?","options":[{"t":"Free verse, because sonnets can’t ask questions","why":"Sonnets often pose and answer.","_n":"4l943","_k":"2e2c8c0d"},{"t":"A couplet poem","why":"Couplets don’t build an 8-and-6 structure.","_n":"4m953","_k":"942c46a9"},{"t":"A Shakespearean sonnet, because it splits 8 and 6","why":"Shakespearean sonnets split 12 and 2.","_n":"4n963","_k":"f9b8f4a9"},{"t":"A Petrarchan sonnet: octave for the question, sestet for the answer","why":"A Petrarchan sonnet poses something in eight lines and answers it in six.","_n":"4o973","_k":"4f90e722"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"You’re reading “In Flanders Fields” aloud at a Remembrance Day assembly. Line 3 ends “…and in the sky” and the sentence continues into line 4. How should you read the end of line 3?","options":[{"t":"Stop fully, because every line end is a full stop","why":"Line ends aren’t sentence ends; the sky leads straight to the larks.","_n":"4p944","_k":"d76ee8ec"},{"t":"Carry your voice on with only a slight hold, because the sentence runs into the next line (enjambment)","why":"A line can end before the sentence does: the sky leads straight to the larks.","_n":"4q934","_k":"fc4e22a1"},{"t":"Drop your voice to a whisper to signal the end","why":"That signals finality where the sentence keeps going.","_n":"4r924","_k":"c8f50cf4"},{"t":"Speed up and skip the pause at “place;”","why":"The semicolon in line 3 \u003cem>is\u003c/em> a pause; it’s the line end that runs on.","_n":"4s914","_k":"e3b79dda"}]},"b":{"prompt":"You’re reading Sonnet 73, line 2, aloud: “When yellow leaves, or none, or few, do hang.” How should you treat the commas?","options":[{"t":"Read straight through; commas don’t matter aloud","why":"They create caesurae; the pauses are the meaning.","_n":"4t984","_k":"e567c444"},{"t":"Stop fully at each comma, as if each were the end of a sentence","why":"Full stops would break the line apart; brief pauses keep it whole.","_n":"4u974","_k":"ee2acdc6"},{"t":"Raise the volume at each comma","why":"Volume isn’t the point; timing is.","_n":"4v964","_k":"c3429efc"},{"t":"Pause briefly at each one, so the hesitations sound like the speaker counting the last leaves","why":"The commas are caesurae: brief pauses keep the line whole while it hesitates.","_n":"4w954","_k":"6d97085d"}]}}]},"task":{"title":"Performance task: The Turn","summary":"The Turn","statement":"\u003cp>Write a short poem (8–14 lines) about a moment of change. Give it a turn: a line where the poem changes direction. Use line breaks and sound on purpose. There are countless good answers; make yours.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg pt-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Criterion\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge: devices used accurately\u003c/td>\u003ctd>Tags often mislabel devices\u003c/td>\u003ctd>Some accurate devices\u003c/td>\u003ctd>Devices accurate and deliberate\u003c/td>\u003ctd>Devices accurate, varied and subtle\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking: the turn\u003c/td>\u003ctd>No real change of direction\u003c/td>\u003ctd>A change, but weakly prepared\u003c/td>\u003ctd>A clear, prepared turn\u003c/td>\u003ctd>A turn that reframes the whole poem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication: sound and line breaks\u003c/td>\u003ctd>Breaks and sounds seem random\u003c/td>\u003ctd>Some purposeful choices\u003c/td>\u003ctd>Breaks and sounds shape the reading\u003c/td>\u003ctd>Breaks and sounds are inseparable from the meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application: craft statement\u003c/td>\u003ctd>Lists features\u003c/td>\u003ctd>Describes choices\u003c/td>\u003ctd>Explains choices and their effects\u003c/td>\u003ctd>Explains choices with insight, citing their own lines\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["8 to 14 lines","One turn, after the opening and before the end","At least one enjambed line","At least two sound devices, tagged","Rhyme declared","Craft statement"],"tips":["Aim for 8–14 lines: enough room to build, then turn.","Tag the line where your poem changes its mind. It can’t be one of the first four lines or the very last.","An enjambed line ends without punctuation, so the sentence spills onto the next line.","Tag two sound devices. For alliteration, the tagged words should start with the same consonant.","Say whether you rhymed. If you did, give one letter per line.","Tell your reader what you chose and why, in at least 40 words."],"explainPrompt":"Craft statement: What did you choose (your turn, a line break, a sound) and what did you want the reader to feel because of it? Quote your own lines.","explainLabel":"Craft statement","vocab":"Use turn, enjambment, stress, and the names of your sound devices.","checkLabel":"Check my poem","success":"Your poem has all its parts. There are countless good answers. Here are three very different ones.","lineTags":["Turn","Enjambment"],"soundTags":["Alliteration","Assonance","Internal rhyme","Onomatopoeia","Caesura"],"models":[{"title":"Model 1: rhymed, with the turn late (8 lines, abab cdcd)","text":["The kitchen light stays on past ten,","my father’s coffee going cold,","the bills fanned out like cards again,","a hand he never asked to hold.","He hums a hymn he half forgot,","then folds the paper, flat and neat,","but in the morning there’s a pot","of porridge waiting, warm and sweet."],"tags":"Turn: line 7. Enjambment: line 7 (“there’s a pot”). Alliteration: “hums a hymn he half” (line 5); “pot / of porridge” (lines 7–8). Rhyme declared: abab cdcd.","craft":"I kept the first six lines tired and heavy, with the h-sounds like sighs, then turned on “but” so the porridge would feel like an answer. Breaking after “pot” makes the reader wait for the warmth…"},{"title":"Model 2: free verse, with the turn mid-poem (9 lines)","text":["The river was a road all winter.","We walked it, my brother and I,","counting the black hearts of air","under the ice,","daring each other farther out.","Then April spoke","in a voice like splitting wood,","and the road remembered","it was water."],"tags":"Turn: line 6. Enjambment: lines 6 and 8. Alliteration: “road remembered” (line 8). Assonance: “spoke … road”. Rhyme declared: free verse.","craft":"The poem stays on the ice until “Then April spoke”. I ended line 8 on “remembered” so the reader hangs in the moment before the surprise…"},{"title":"Model 3: sound-driven, with a slant-rhymed close (10 lines)","text":["At six the city coughs awake:","the buses hiss, a shutter clangs,","a gull complains above the lake,","the old pipes knock in sudden bangs.","I used to pull the pillow tight","and curse the clatter, curse the light.","But now, a hundred miles from home,","the silence hums inside my room,","and I would trade a week of quiet","for one loud minute of that riot."],"tags":"Turn: line 7. Enjambment: line 9. Onomatopoeia: “hiss”, “clangs”, “knock”, “bangs”. Alliteration: “curse the clatter, curse” (line 6). Rhyme declared: abab cc dd ee.","craft":"I filled the first half with noise words so the silence after “But now” would feel loud by contrast…"}]},"cards":[["Stress","The extra push a syllable gets when spoken: be-HOLD. “That TIME of YEAR…”"],["Iamb","da-DUM, an unstressed then a stressed syllable: “be-HOLD”."],["Iambic pentameter","Five iambs per line: “That TIME of YEAR thou MAYST in ME be-HOLD” (Shakespeare)."],["Trochee","DUM-da: “TY-ger TY-ger, BURN-ing BRIGHT” (Blake)."],["Spondee","Two stresses side by side, which slows a line: “SWEET BIRDS SANG” (Shakespeare)."],["Caesura","A strong pause inside a line: “To err is human; to forgive, divine” (Pope)."],["Enjambment","A sentence running past the end of a line: “and in the sky / The larks…” (McCrae)."],["Volta (turn)","Where a poem changes direction: “Yet if you should forget me for a while” (Rossetti, line 9)."],["Shakespearean sonnet","Three quatrains and a couplet, abab cdcd efef gg; usually turns at line 13 (Sonnet 73)."],["Petrarchan sonnet","Octave (abbaabba) and sestet; turns at line 9 (Rossetti, “Remember”)."],["Assonance","Repeated vowel sounds: “Hear the mellow wedding bells” (Poe)."],["Speaker","The voice of the poem, never assumed to be the poet: “In me thou see’st the twilight…” is the speaker’s claim."]]}};</script>
