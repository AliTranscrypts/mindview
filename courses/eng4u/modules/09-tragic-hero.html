.th-curve{fill:none;stroke:var(--pen);stroke-width:2.6;stroke-linejoin:round}
.th-curve.faded{stroke:var(--ink-2);stroke-dasharray:4 4;opacity:.45}
.th-spark{fill:none;stroke:var(--pen);stroke-width:2;stroke-dasharray:3 4;opacity:.8}
.th-dot{fill:var(--pen);stroke:var(--sheet);stroke-width:1.5}
.th-dot.turn{fill:var(--sheet);stroke:var(--pen);stroke-width:3}
.th-dot.faded,.th-xl.faded{opacity:.3}
.th-read dd .th-say{display:block;margin:0 0 3px}
.th-aha{margin:6px 0 0;padding:8px 10px;border-left:4px solid var(--an-theme);background:var(--an-theme-soft);border-radius:0 8px 8px 0}

/* terms mode */
.th-terms{display:flex;flex-wrap:wrap;gap:6px}
.th-term{border:1.5px solid var(--an-figure);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .9em;font-weight:700;font-style:italic;min-height:36px}
.th-term.sel{background:var(--an-figure);color:var(--sheet)}
ol.th-events{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.th-events li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px}
.th-elab{font:700 .95rem var(--font-ui);width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:1px solid var(--rule)}
.th-etext{font-size:.94rem}
.th-slot{border:1.5px dashed var(--ink-2);background:var(--paper);color:var(--ink-2);border-radius:8px;padding:.3em .7em;min-height:38px;min-width:9em;font-weight:700}
.th-slot.full{border-style:solid;border-color:var(--an-figure);color:var(--ink);background:var(--an-figure-soft);font-style:italic}
.th-q2{margin:0;padding:8px 12px;border-left:4px solid var(--ink-2);font:400 1.02rem/1.45 var(--font-math)}
.th-q2 mark{background:var(--hi-soft);color:var(--ink)}
.th-q2 del{text-decoration-thickness:2px;color:var(--ink-2)}
.th-q2 ins{text-decoration:none;font-weight:700;background:var(--hi-soft)}
.th-pity{display:flex;align-items:center;gap:10px;font-weight:700}
.th-meter{flex:1;max-width:320px;height:16px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.th-meter i{display:block;height:100%;background:var(--pen)}
.th-strip{display:flex;flex-wrap:wrap;gap:4px}
.th-mini{border:1.5px solid var(--ink-2);border-radius:6px;padding:.15em .45em;font:700 .8rem var(--font-ui);display:grid;justify-items:center;transition:opacity .5s}
.th-mini small{font-weight:400;font-size:.68rem}
.th-mini.dim{opacity:.35}

/* evidence board */
ul.th-bank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.th-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px}
.th-line p{margin:0;font-size:.94rem;max-width:none}
.th-line.m-s{border-color:var(--pp-evidence)}
.th-line.m-c{border-color:var(--an-theme)}
.th-tags{grid-column:1;color:var(--ink-2)}
.th-mk{display:flex;gap:6px;grid-row:1 / span 2;grid-column:2}
.th-mkb{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.2em .7em;font-size:.84rem;font-weight:700;min-height:32px}
.th-mkb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.th-mkb[aria-pressed="true"]::before{content:"✓ "}
.th-rd .rg-wrap{align-items:flex-start}

/* Part 3: critics' table + thesis forge */
.th-critics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.th-critic{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--sheet)}
.th-critic h4{margin:0 0 4px;font-size:1rem}
.th-critic h4 small{font-weight:400;color:var(--ink-2);font-size:.82rem}
.th-critic p{font-size:.94rem;margin:0 0 6px;max-width:none}
ul.th-cl{margin:4px 0 0;padding-left:1.1em;font-size:.92rem}
.th-forge{margin-top:12px;border:1.5px solid var(--ink-2);border-radius:10px;padding:8px 12px}
.th-lpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 8px}
.th-lp{text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.3em .6em;font-size:.88rem;min-height:36px}
.th-lp[aria-pressed="true"]{border-color:var(--pp-evidence);background:var(--an-image-soft)}
.th-lp[aria-pressed="true"]::before{content:"✓ ";font-weight:700}
.th-thesis{padding:8px 10px;border-left:4px solid var(--pp-claim);background:var(--an-syntax-soft);border-radius:0 8px 8px 0;margin:8px 0}
ul.th-checks{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.92rem}
.th-checks li.ok{font-weight:700}
.th-checks li.flag{color:var(--ink)}

/* task */
.th-ct{display:grid;gap:10px}
.th-pp label{border-left:4px solid var(--rule);padding-left:6px}
.th-pp-claim label{border-color:var(--pp-claim)}.th-pp-ev1 label,.th-pp-ev2 label{border-color:var(--pp-evidence)}.th-pp-counter label{border-color:var(--an-theme)}.th-pp-answer label{border-color:var(--pp-analysis)}
.th-ins{border:1.5px dashed var(--rule);border-radius:10px;padding:8px 10px}
.th-inslist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.th-insb{text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.3em .6em;font-size:.88rem;min-height:36px}
.th-insb:hover{border-color:var(--pen)}
.th-dw{margin:4px 0}
.th-dw-ta{width:100%;min-height:260px}
.th-dw-n{font-size:.88rem}
.th-dw-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:.9rem}
.th-dw-cmp p{max-width:none;margin:0 0 4px}
.th-dw-cmp del{text-decoration-thickness:2px;color:var(--ink-2)}
.th-dw-cmp ins{text-decoration-thickness:2px;background:var(--hi-soft)}
ol.th-tagl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.th-tagl li{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px}
.th-tagl li.c,.th-tagl li.a{border-color:var(--ink)}
.th-tagtext{flex:1 1 260px;min-width:0;font-size:.94rem}
.th-tagbtns{display:flex;gap:6px}
.th-tagb{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.2em .8em;font-size:.86rem;font-weight:700;min-height:32px}
.th-tagb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.th-tagb[aria-pressed="true"]::before{content:"✓ "}
ul.th-glance{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:.92rem}
.th-model{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.th-model h5{margin:0 0 4px;font-size:.95rem}
.th-model p{font-size:.94rem;max-width:none}
.th-mtag{display:inline-block;font:700 .68rem/1.35 var(--font-ui);border:1.5px solid var(--ink-2);border-radius:999px;padding:0 .4em;color:var(--ink-2);vertical-align:.15em}
.th-rubric{margin-top:8px}

@media (max-width:760px){
  .th-pyr{grid-template-columns:minmax(0,1fr)}
  .th-stage.h0,.th-stage.h1,.th-stage.h2,.th-stage.h3{margin-top:0}
  .th-stage{grid-template-columns:8.5em minmax(0,1fr);align-items:start}
  .th-critics,.th-lpick,.th-inslist,.th-dw-cmp{grid-template-columns:minmax(0,1fr)}
  .th-events li{grid-template-columns:auto minmax(0,1fr)}
  .th-events .th-slot{grid-column:1 / -1}
  .th-line{grid-template-columns:minmax(0,1fr)}
  .th-mk{grid-row:auto;grid-column:1}
  .th-hp{font-size:1.08rem}
}
@media (prefers-reduced-motion:reduce){
  .th-ph,.th-arcp,.th-peak,.th-pc,.th-hcap,.th-card,.th-mini{transition:none}
  .th-fan .th-tray .th-card,.th-card.drop{animation:none}
}

<script>window.MV_PAYLOAD={"meta":{"id":"09-tragic-hero","nn":"09","slug":"tragic-hero","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 2","groupName":"Shakespearean Tragedy, Hamlet","trivium":"Logic","size":"M","storageKey":"eng4u-09-tragic-hero-v1","progressKey":"eng4u-progress-v1:09-tragic-hero","toolkit":"1.0.8"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"debce43a","content":{"id":"09-tragic-hero","kind":"topic","title":"The tragic hero and Aristotelian form","topic":"The Tragic Hero & Aristotelian Form","readyTopic":"the tragic hero","hero":{"headline":"Aristotle saw a shape in suffering.","text":"Twenty-three centuries ago, Aristotle watched tragedies and asked what made them work. His answer gave us words we still use: \u003cstrong>hamartia\u003c/strong> (the hero’s error), \u003cstrong>peripeteia\u003c/strong> (the reversal), \u003cstrong>anagnorisis\u003c/strong> (the recognition) and \u003cstrong>catharsis\u003c/strong> (what pity and fear do to us). Hold \u003cem>Hamlet\u003c/em> up to his lens and you’ll see the play’s shape, and the places where Shakespeare breaks the mould.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later.\u003c/p>\u003cp class='muted th-support' role='note'>This play deals with death and despair. If any of it weighs on you, talk to someone you trust, or contact Kids Help Phone: \u003cspan class='th-nw'>1-800-668-6868\u003c/span>, or text CONNECT to \u003cspan class='th-nw'>686868\u003c/span>.","fig":{"html":"\u003cdiv class='th-hero' id='th-hero' role='group' aria-label='Aristotle’s definition of tragedy. As it is read, it breaks into five labelled pieces in a column: imitation of an action; serious, complete, of a certain magnitude; action, not narrative; pity and fear; purgation. A rising-and-falling arc draws behind them, with a marker at the peak: the turn.'>\u003c/div>","caption":""},"phrases":["Tragedy, then, is an imitation of an action that is serious, complete, and of a certain magnitude;","in language embellished with each kind of artistic ornament, the several kinds being found in separate parts of the play;","in the form of action, not of narrative;","through pity and fear effecting the proper purgation of these emotions."],"cite":"(Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 6)","pieces":[{"t":"imitation of an action","p":0},{"t":"serious, complete, of a certain magnitude","p":0},{"t":"action, not narrative","p":2},{"t":"pity and fear","p":3},{"t":"purgation","p":3}],"turn":"the turn","caption":"A definition is a shape you can test.","listen":"Listen","watch":"Watch again","noVoice":"Read it yourself: say the definition aloud, pausing at each semicolon."},"goals":["I can explain Aristotle’s definition of tragedy and his key terms in my own words.","I can map \u003cem>Hamlet\u003c/em> onto a tragic arc and defend where its turning point falls.","I can tell hamartia (an error or frailty) from vice, and from later ideas like hubris.","I can evaluate competing readings of Hamlet’s flaw, using evidence that supports and evidence that complicates.","I can write an arguable claim about the tragic hero, with evidence and an answer to a counterargument.","I can apply Aristotle’s lens to a new story and judge where it fits and where it doesn’t."],"start":{"blocks":[{"title":"Word story: tragedy","html":"\u003cp>\u003cstrong>\u003cem>Tragedy\u003c/em>\u003c/strong> comes from the Greek \u003cem>tragōidia\u003c/em>, probably “goat song” (\u003cem>tragos\u003c/em>, goat + \u003cem>ōidē\u003c/em>, song). No one is sure why: perhaps a goat was the prize, perhaps a sacrifice, perhaps the singers wore goatskins. A word we use for the deepest human suffering began, it seems, with a farm animal and a song.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Plot structure","goal":2,"prompt":"On Freytag’s pyramid, the \u003cstrong>climax\u003c/strong> is…","options":[{"t":"the last scene","why":"That’s the catastrophe or resolution.","_n":"036e","_k":"235b2c48"},{"t":"the moral of the story","why":"The climax is an event, not a lesson.","_n":"137e","_k":"9af999d0"},{"t":"the turning point, where the hero’s fortunes change direction","why":"It’s the peak and the turn, usually mid-play.","_n":"238e","_k":"3fc94f1b"},{"t":"the first scene","why":"That’s the exposition.","_n":"339e","_k":"25c37d98"}],"hints":["A pyramid has a peak.","What happens at the peak?","The turn."]},{"id":"w2","skill":"Plot structure","goal":2,"prompt":"Which event in \u003cem>Hamlet\u003c/em> is the \u003cstrong>inciting incident\u003c/strong>?","options":[{"t":"Hamlet kills Polonius (3.4)","why":"That’s a turn, not the start.","_n":"43ae","_k":"0ceea10b"},{"t":"The final duel (5.2)","why":"That’s the catastrophe.","_n":"53be","_k":"10459705"},{"t":"Ophelia’s funeral (5.1)","why":"That’s falling action.","_n":"63ce","_k":"4462289f"},{"t":"The Ghost commands Hamlet to revenge his murder (1.5)","why":"It launches the central conflict.","_n":"72de","_k":"2d3b5f7d"}],"hints":["What starts the revenge plot?","Who gives the order?","The Ghost, in 1.5."]},{"id":"w3","skill":"Character analysis","goal":4,"prompt":"What best distinguishes a \u003cstrong>round\u003c/strong> character from a \u003cstrong>flat\u003c/strong> one?","options":[{"t":"A round character is complex and can surprise us convincingly","why":"Hamlet surprises even himself.","_n":"82ee","_k":"6899c237"},{"t":"A round character appears more often","why":"Frequency isn’t complexity.","_n":"9c76","_k":"3aad7a29"},{"t":"A round character speaks in verse","why":"Verse isn’t depth.","_n":"ac66","_k":"6735c0f4"},{"t":"A round character is good, a flat one evil","why":"Villains can be round too.","_n":"bc56","_k":"ff0c6468"}],"hints":["Think of Hamlet vs a messenger.","Who can surprise you?","Complexity."]},{"id":"w4","skill":"Character analysis","goal":4,"prompt":"Hamlet tells his friends he may “put an antic disposition on” (\u003ci>Hamlet\u003c/i> 1.5.172). What does this tell us?","options":[{"t":"He will leave Denmark","why":"Nothing about travel.","_n":"cc46","_k":"89890578"},{"t":"He plans to \u003cem>act\u003c/em> mad","why":"“Antic” means grotesque or clownish; he’ll put it on like a costume.","_n":"dcb6","_k":"67e2b8c6"},{"t":"He will wear a jester’s costume","why":"It’s a manner, not clothing.","_n":"eca6","_k":"0374ad13"},{"t":"He is already mad","why":"“Put on” means a choice.","_n":"fc96","_k":"52735408"}],"hints":["What do you “put on”?","Something you choose.","Feigned madness."]},{"id":"w5","skill":"Arguable claims","goal":5,"prompt":"Which is an \u003cstrong>arguable\u003c/strong> claim?","options":[{"t":"“I like \u003cem>Hamlet\u003c/em>.”","why":"A preference, not an argument.","_n":"gc86","_k":"be872a58"},{"t":"“\u003cem>Hamlet\u003c/em> has five acts.”","why":"A fact.","_n":"hbf6","_k":"72f2c80a"},{"t":"“\u003cem>Hamlet\u003c/em> is a play by Shakespeare.”","why":"A fact.","_n":"ibe6","_k":"b46fbd7c"},{"t":"“Hamlet’s delay comes less from cowardice than from his fear that the Ghost is a devil.”","why":"A reasonable reader could disagree, so it needs evidence.","_n":"jcd6","_k":"ca56abba"}],"hints":["Could someone reasonably disagree?","Only with one option.","The claim about Hamlet’s delay and the devil."]},{"id":"w6","skill":"Arguable claims","goal":4,"prompt":"A critic says Hamlet thinks too much to act. Which evidence would best \u003cstrong>challenge\u003c/strong> this?","options":[{"t":"Hamlet stabs Polonius through the arras without a moment’s thought (3.4)","why":"Here he acts instantly, and rashly.","_n":"kce6","_k":"2cc507ea"},{"t":"Hamlet studied at Wittenberg","why":"Background, not evidence against.","_n":"lcb6","_k":"5782de61"},{"t":"Hamlet is a prince","why":"Irrelevant to thinking vs acting.","_n":"mcc6","_k":"6293d5e9"},{"t":"Hamlet’s long soliloquies","why":"Those \u003cem>support\u003c/em> the critic.","_n":"nc96","_k":"61568160"}],"hints":["Look for a moment of action without thought.","Act 3, behind a curtain.","The stabbing through the arras (3.4)."]}],"refreshers":{"Plot structure":"Exposition → inciting incident → rising action → climax (the turn) → falling action → catastrophe. The climax is in the middle; the catastrophe is at the end.","Character analysis":"Round characters are complex; judge them by words \u003cem>and\u003c/em> actions, especially where the two disagree.","Arguable claims":"A claim is arguable if a thoughtful reader could disagree. Test it: could the opposite be defended with evidence?"}}},"explore":{"heading":"Tragic arc builder","intro":"Build \u003cem>Hamlet\u003c/em>’s shape, then name its parts in Aristotle’s language. Where does it turn? You decide, but you’ll have to be consistent.","modes":[{"id":"arc","t":"Arc"},{"id":"terms","t":"Aristotle’s terms"},{"id":"board","t":"Evidence board"}],"how":{"arc":"Tap a scene card, then tap the stage where it belongs. Tap a placed card to pick it up again.","terms":"Tap a term, then tap the event it names. A term can be used more than once.","board":"Choose the reading you’d defend. Then mark two lines that \u003cstrong>support\u003c/strong> it and one line that \u003cstrong>complicates\u003c/strong> it."},"stages":[{"id":"exp","t":"Exposition","h":0},{"id":"inc","t":"Inciting incident","h":1},{"id":"rise","t":"Rising action","h":2},{"id":"climax","t":"Climax","h":3},{"id":"fall","t":"Falling action","h":2},{"id":"cat","t":"Catastrophe","h":0}],"cards":[{"id":"S1","sc":"1.1–1.2","t":"The watch; the court; Hamlet’s grief","ten":1.5},{"id":"S2","sc":"1.5","t":"The Ghost’s command","ten":3},{"id":"S3","sc":"2.2","t":"The players arrive; “the play’s the thing”","ten":4,"sol":true},{"id":"S4","sc":"3.1","t":"“To be, or not to be”; the nunnery scene","ten":5,"sol":true},{"id":"S5","sc":"3.2","t":"\u003ci>The Mousetrap\u003c/i>","ten":7,"read":"the trap springs"},{"id":"S6","sc":"3.3","t":"Hamlet spares Claudius at prayer","ten":8,"read":"the moment not taken"},{"id":"S7","sc":"3.4","t":"Polonius killed through the arras","ten":9,"read":"the reversal"},{"id":"S8","sc":"Act 4","t":"Exile; Ophelia’s madness; Laertes returns","ten":6,"sol":true},{"id":"S9","sc":"5.2","t":"The duel and the deaths","ten":4}],"full":{"S1":"exp","S2":"inc","S3":"rise","S4":"rise","S5":"rise","S6":"rise","S7":"climax","S8":"fall","S9":"cat"},"terms":[{"id":"peri","t":"peripeteia"},{"id":"anag","t":"anagnorisis"},{"id":"cath","t":"catharsis"},{"id":"ham","t":"hamartia"},{"id":"mim","t":"mimesis"}],"events":[{"id":"a","t":"Hamlet stabs the hidden Polonius, believing he’s the King (\u003ci>Hamlet\u003c/i> 3.4)."},{"id":"b","t":"The dying Laertes reveals “the king, the king’s to blame” (\u003ci>Hamlet\u003c/i> 5.2.331)."},{"id":"c","t":"The audience’s pity and fear at the deaths, ending with Horatio’s “Good night, sweet prince” (\u003ci>Hamlet\u003c/i> 5.2.370)."},{"id":"d","t":"\u003ci>The Mousetrap\u003c/i> re-enacts the murder, “to hold, as ’twere, the mirror up to nature” (\u003ci>Hamlet\u003c/i> 3.2.24–25)."},{"id":"e","t":"Hamlet spares the praying Claudius so as not to send him “to heaven” (\u003ci>Hamlet\u003c/i> 3.3.74–78)."}],"termKey":{"a":"peri","b":"anag","c":"cath","d":"mim","e":"ham"},"says":{"peri":"Peripeteia: the action veers round to its opposite. Hamlet the hunter becomes the hunted.","anag":"Anagnorisis: a change from ignorance to knowledge. Hamlet learns the whole plot as he dies.","cath":"Catharsis: pity and fear are aroused, then purged or clarified, in us.","mim":"Mimesis: the play imitates an action, and \u003ci>The Mousetrap\u003c/i> imitates the murder inside it.","ham":"Hamartia: an error, not vice. Sparing Claudius is a misjudgment the play makes Hamlet pay for."},"bothErrors":"Both are errors. Aristotle would add that the 3.4 killing is also the reversal. Can one event be both?","readings":[{"id":"R1","t":"Thinking too much","sub":"after Coleridge","name":"thinking too much"},{"id":"R2","t":"Melancholy","sub":"after Bradley","name":"melancholy"},{"id":"R3","t":"A great duty laid on a soul unfit for it","sub":"after Goethe","name":"a great duty laid on a soul unfit for it"},{"id":"R4","t":"Rash action","sub":"","name":"rash action"}],"bank":[{"id":"LB1","t":"Thus conscience does make cowards of us all; / And thus the native hue of resolution / Is sicklied o’er with the pale cast of thought","ref":"3.1.83–85","s":["R1"],"c":["R4"]},{"id":"LB2","t":"O, what a rash and bloody deed is this!","who":"Gertrude","ref":"3.4.27","s":["R4"],"c":["R1","R2"]},{"id":"LB3","t":"I have of late—but wherefore I know not—lost all my mirth","ref":"2.2.306–307","s":["R2"],"c":[]},{"id":"LB4","t":"The time is out of joint: O cursed spite, / That ever I was born to set it right!","ref":"1.5.189–190","s":["R3"],"c":[]},{"id":"LB5","t":"How all occasions do inform against me, / And spur my dull revenge!","ref":"4.4.32–33","s":["R1","R3"],"c":["R4"]},{"id":"LB6","t":"Now might I do it pat, now he is praying","ref":"3.3.73","s":["R1"],"c":["R3","R4"]},{"id":"LB7","t":"How now! a rat? Dead, for a ducat, dead!","ref":"3.4.23","s":["R4"],"c":["R1","R2","R3"]},{"id":"LB8","t":"O, what a rogue and peasant slave am I!","ref":"2.2.576","s":["R1","R2"],"c":[]}],"readout":{"stage":"Stage filled","cons":"Consistency","ten":"Tension at the turn","says":"Aristotle would say…","fit":"Fit with Aristotle","reading":"Your reading","cas":"Your case"},"aha":"A definition is a tool for seeing. \u003cem>Hamlet\u003c/em> turns sharply where Aristotle says tragedies turn, but its middle is full of thought, and that’s where the debate about its hero lives.","opening":{"banner":"Where does it turn? Your call, but be consistent."},"quotes":{"p2":"“a man who is not eminently good and just,—yet whose misfortune is brought about not by vice or depravity, but by some error or frailty” (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 13)","p2swap":"vice","p4":"“The Plot, then, is the first principle, and, as it were, the soul of a tragedy: Character holds the second place.” (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 6)"},"dir":{"before":"Hamlet hunts Claudius","after":"Claudius hunts Hamlet","notes":"Claudius sends Hamlet to England · Laertes comes home for revenge"},"predictions":[{"id":"p1","start":{"mode":"arc","full":true},"prompt":"Imagine Hamlet kills Claudius at prayer in 3.3. Which part of the arc disappears?","options":[{"t":"The falling action and the catastrophe as we know them: the play would end in Act 3","_n":"oca6","_k":"f8ea5712"},{"t":"The exposition","_n":"pc76","_k":"166ddb7c"},{"t":"Nothing changes","_n":"qc86","_k":"6b8187e2"},{"t":"The inciting incident","_n":"rc56","_k":"73cac538"}],"explain":"Act 4’s consequences grow from the moment he \u003cem>doesn’t\u003c/em> strike. The delay builds the whole second half."},{"id":"p2","start":{"mode":"terms","quote":"p2"},"prompt":"Swap “error or frailty” for “vice”. What happens to our response?","options":[{"t":"We stop pitying him: his fall becomes deserved","_n":"sc66","_k":"2339d64d"},{"t":"Nothing changes","_n":"t336","_k":"cebc56cc"},{"t":"He becomes a comic character","_n":"u326","_k":"103cac34"},{"t":"We pity him more","_n":"v356","_k":"7456698c"}],"explain":"Aristotle: pity is aroused by \u003cem>unmerited\u003c/em> misfortune. A vicious hero earns his fall."},{"id":"p3","start":{"mode":"arc","full":true,"hi":"S7"},"prompt":"Hamlet stabs through the arras and kills Polonius. What happens to the direction of the story?","options":[{"t":"It becomes a comedy","_n":"w346","_k":"d63f17dc"},{"t":"It reverses: Hamlet the hunter becomes the hunted","_n":"x376","_k":"618e0ce7"},{"t":"It ends","_n":"y366","_k":"70b9729c"},{"t":"It stays the same","_n":"z396","_k":"f7ee1644"}],"explain":"That’s peripeteia: the action “veers round to its opposite” (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 11)."},{"id":"p4","start":{"mode":"terms","quote":"p4"},"prompt":"If we cut every soliloquy but kept every event, what would Aristotle say is lost?","options":[{"t":"The tragedy dies: the soliloquies are its soul","_n":"10386","_k":"2728f834"},{"t":"Aristotle would ban soliloquies","_n":"113b6","_k":"a5b5bf6b"},{"t":"The “soul” (the plot) survives, but character, which he ranks second, grows thinner","_n":"123a6","_k":"7e5cb73c"},{"t":"Nothing at all","_n":"13396","_k":"eac05ef2"}],"explain":"Aristotle ranks plot first. Many modern readers disagree: for them Hamlet’s mind \u003cem>is\u003c/em> the play. Hold both views."}],"chalIntro":"Use the arc, the terms and the evidence board to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"\u003cstrong>Build the arc.\u003c/strong> Place all nine scene cards on the stages of the pyramid. \u003cbutton type='button' class='btn ghost sm th-setup' data-setup='arc'>Set it up\u003c/button>","msgs":{"unplaced":"Place all nine cards first.","s9":"That’s the catastrophe. The climax is the turn, mid-play.","two":"Choose one turn. Defend it in Part 3.","s8":"Act 4 follows the turn, whichever turn you chose."},"general":"Not yet. Read the consistency row: everything before your climax should rise, and everything after it should fall.","why":"Three arcs are defensible. A climax at 3.2 says “the trap springs”; at 3.3, “the moment not taken”; at 3.4, “the reversal”. Whichever you chose, you’ll defend it in Part 3.","hints":["Start and end are fixed: 1.1–1.2, 1.5, 5.2.","Choose your turn among the three Act 3 scenes.","Everything before it rises; everything after it falls."]},{"id":"tc2","goal":1,"prompt":"\u003cstrong>Name the parts.\u003c/strong> Match the five term chips to the five events. \u003cbutton type='button' class='btn ghost sm th-setup' data-setup='terms'>Set it up\u003c/button>","msgs":{"unplaced":"Give each of the five events a term.","b":"Laertes’s words change what Hamlet \u003cem>knows\u003c/em>. That’s recognition.","c":"Catharsis happens in the audience, not in the hero."},"general":"Not yet. Ask of each event: does it change knowledge or direction, happen in the audience, show an error, or imitate an action?","why":"Killing Polonius reverses the action (peripeteia); Laertes’s words bring recognition (anagnorisis); our pity and fear are the catharsis; \u003ci>The Mousetrap\u003c/i> is imitation (mimesis); sparing Claudius is the error (hamartia).","hints":["Which event changes \u003cem>knowledge\u003c/em>? Which changes \u003cem>direction\u003c/em>?","Which one happens in the audience?","a peripeteia, b anagnorisis, c catharsis, d mimesis, e hamartia."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>Make the strongest case.\u003c/strong> On the evidence board, choose \u003cstrong>one\u003c/strong> reading of Hamlet’s hamartia, \u003cstrong>two\u003c/strong> lines that support it and \u003cstrong>one\u003c/strong> line that complicates it (the counterevidence you’ll have to answer). \u003cbutton type='button' class='btn ghost sm th-setup' data-setup='board'>Set it up\u003c/button>","msgs":{"count":"Choose a reading, exactly two supporting lines and one counter.","other":"That line supports {r}, not your reading.","helps":"That line helps your case. A counter should push back.","flat":"That line doesn’t push back on your reading. Find the line your opponent would quote against you."},"general":"Not yet. Check each supporting line against your reading, and make sure your counter pushes back.","why":"That’s the shape of an argument: claim, evidence, and the evidence you’ll have to answer. Take it to Part 3.","hints":["Pick the reading you’d defend.","Filter the bank: which lines show \u003cem>that\u003c/em> trait in action?","Now find the line your opponent would quote against you."]}],"blocks":[{"title":"Reading the arc","html":"\u003cp>The graph plots Freytag’s shape: each scene card carries a fixed tension value, and the curve follows the order of your stages, so tension rises to the turn and falls toward the catastrophe. Aristotle himself names a beginning, a middle and an end; the pyramid is Gustav Freytag’s (1863).\u003c/p>"}]},"part3":{"slug":"flaw","name":"The flaw","heading":"Debating the flaw","intro":"For two centuries critics have argued about Hamlet’s hamartia. Sit at the table with four of them, check each one against the text, then join the conversation with a thesis of your own. The positions below are summaries in our words, not quotations.","critics":[{"id":"goethe","n":"Goethe","src":"in \u003ci>Wilhelm Meister’s Apprenticeship\u003c/i>, 1795–96","pos":"A great action laid on a soul unfit to perform it, pictured as an oak planted in a delicate vase that shatters as its roots grow.","lines":["LB4","LB5"],"short":"a soul unfit for a great deed"},{"id":"coleridge","n":"Coleridge","src":"lectures, early 1800s","pos":"Hamlet’s habit of thought outweighs his impulse to act; reflection crowds out deed.","lines":["LB1","LB6"],"short":"too much thought"},{"id":"bradley","n":"A. C. Bradley","src":"\u003ci>Shakespearean Tragedy\u003c/i>, 1904","pos":"Not too much thought by nature, but a deep \u003cstrong>melancholy\u003c/strong>, triggered by moral shock at his mother’s remarriage, paralyses him.","lines":["LB3","LB8"],"short":"melancholy"},{"id":"eliot","n":"T. S. Eliot","src":"“Hamlet and His Problems”, 1919","pos":"The play fails to find an “objective correlative” for Hamlet’s emotion: his feelings exceed their causes on stage.","lines":["X8","LB3"],"short":"emotion in excess of its causes"}],"checkLabel":"Check it with the text","checkHow":"Do these lines bear the critic out? Read them, then decide for yourself.","forge":{"stances":[{"id":"agree","t":"agree with","lead":"Agreeing with"},{"id":"extend","t":"extend","lead":"Extending"},{"id":"push","t":"push back against","lead":"Pushing back against"}],"own":{"id":"own","t":"My own"},"ownLabel":"My reading, in 2–6 words","whyLabel":"Why it matters (8–25 words)","whyPh":"e.g. because the play’s reversal grows from the moments he chooses not to act","vagueWords":["indecisive","sad","mad","crazy","weak","depressed","emotional","lazy","angry","confused","cowardly","slow","hesitant","insane"],"flags":{"fact":"Fact, not claim: choose a stance toward a critic, so a reader could disagree.","vague":"Vague: a single trait word (“indecisive”) isn’t a reading. Say how the trait works, in 2–6 words.","how":"No \u003cem>how\u003c/em> yet: choose two lines from the bank.","why":"No \u003cem>why\u003c/em> yet: say in 8–25 words why it matters.","ok":"No flags: it names the text and author, takes a stance, and gives a \u003cem>how\u003c/em> and a \u003cem>why\u003c/em>."},"checks":["Names \u003cem>Hamlet\u003c/em> and Shakespeare","Takes a stance","Gives a \u003cem>how\u003c/em> (two lines)","Gives a \u003cem>why\u003c/em>"]},"blocks":[],"quickCheck":{"title":"The flaw: quick check","summary":"The flaw quick check","items":[{"id":"q1","goal":4,"prompt":"Which critic links Hamlet’s paralysis to melancholy after moral shock?","choices":[{"t":"Coleridge","fb":"Bradley’s Hamlet isn’t a born over-thinker; he’s wounded.","_n":"143a6","_k":"d529c165"},{"t":"Bradley","fb":"Right. Bradley’s Hamlet isn’t a born over-thinker; he’s wounded.","_n":"153b6","_k":"eac13a34"},{"t":"Eliot","fb":"Bradley’s Hamlet isn’t a born over-thinker; he’s wounded.","_n":"163c6","_k":"91772029"},{"t":"Goethe","fb":"Bradley’s Hamlet isn’t a born over-thinker; he’s wounded.","_n":"17356","_k":"e7022bca"}]},{"id":"q2","goal":4,"prompt":"To “push back” against Coleridge, the best evidence is…","choices":[{"t":"“pale cast of thought” (3.1.85)","fb":"The other three show thought or self-reproach, which \u003cem>supports\u003c/em> Coleridge.","_n":"18366","_k":"f84d1fea"},{"t":"“O, what a rogue and peasant slave am I!” (2.2.576)","fb":"The other three show thought or self-reproach, which \u003cem>supports\u003c/em> Coleridge.","_n":"19376","_k":"481443ba"},{"t":"“Now might I do it pat” (3.3.73)","fb":"The other three show thought or self-reproach, which \u003cem>supports\u003c/em> Coleridge.","_n":"1a386","_k":"7c07b8b1"},{"t":"“Dead, for a ducat, dead!” (3.4.23)","fb":"Right. He acts in an instant. The other three show thought or self-reproach, which \u003cem>supports\u003c/em> Coleridge.","_n":"1b416","_k":"4fa88c11"}]},{"id":"q3","goal":4,"prompt":"Why check critics against the text?","choices":[{"t":"Texts are always ambiguous, so nothing can be checked","fb":"Authority isn’t evidence; the lines are.","_n":"1c426","_k":"83fceee4"},{"t":"Critics are always right","fb":"Authority isn’t evidence; the lines are.","_n":"1d3f7","_k":"2d537229"},{"t":"Critics can be wrong; the text is the shared evidence","fb":"Right. Authority isn’t evidence; the lines are.","_n":"1e3e7","_k":"6663098c"},{"t":"Older critics are better","fb":"Authority isn’t evidence; the lines are.","_n":"1f3d7","_k":"54d9a4d5"}]},{"id":"q4","goal":4,"prompt":"Eliot’s “objective correlative” claim is that…","choices":[{"t":"Hamlet has no emotions","fb":"Eliot judges the \u003cem>play\u003c/em>, not just the character.","_n":"1g3c7","_k":"d56e17df"},{"t":"Hamlet’s emotion exceeds its causes on stage","fb":"Right. Eliot judges the \u003cem>play\u003c/em>, not just the character.","_n":"1h3b7","_k":"c2b775e6"},{"t":"the Ghost isn’t real","fb":"Eliot judges the \u003cem>play\u003c/em>, not just the character.","_n":"1i3a7","_k":"29ad892f"},{"t":"the play is too short","fb":"Eliot judges the \u003cem>play\u003c/em>, not just the character.","_n":"1j397","_k":"61d10324"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“A whole is that which has a beginning, a middle, and an end.”\u003c/p>\u003cp class='eng-cite'>(Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 7)\u003c/p>\u003cp>\u003cstrong>The pattern:\u003c/strong> “A [noun] is that which [has or does a, b, and c].” It’s a definition that sounds like a law.\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> imitate it for something you know well.\u003c/p>\u003cp>\u003cstrong>Example:\u003c/strong> “A friendship is that which survives an argument, a silence, and a move.”\u003c/p>","prompt":"Your imitation"}]},"practice":{"activities":[{"id":"sorter","type":"sorter","title":"Term sorter","summary":"Term sorter","goal":[1,3],"txt":true,"noun":"description","instruction":"Sort each description into the Aristotelian term it names. Trivium: Grammar.","boxes":[{"id":"ham","label":"Hamartia"},{"id":"peri","label":"Peripeteia"},{"id":"anag","label":"Anagnorisis"},{"id":"cath","label":"Catharsis"},{"id":"mim","label":"Mimesis"}],"wrongDefault":"Ask: hero, story or audience? Then: knowledge, direction, error, emotion or imitation?","items":[{"id":"i1","t":"“A change from ignorance to knowledge”","_a":"RgQMAgIW","why":"Butcher’s own words for recognition.","hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Anagnorisis: it’s a change in what a character knows."]},{"id":"i2","t":"“The action veers round to its opposite”","_a":"RhUHEQwW","why":"Butcher’s words for the reversal.","hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Peripeteia: the story changes direction."]},{"id":"i3","t":"“An error or frailty, not vice”","_a":"Rg0DDkc=","why":"The hero’s error, which lets us pity him.","wrong":{"cath":"Catharsis is the audience’s experience, not the hero’s error."},"hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Hamartia: it’s the hero’s error."]},{"id":"i4","t":"“Pity and fear, aroused and purged”","_a":"RgYDFw0W","why":"What tragedy does to its audience.","hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Catharsis: it’s the audience’s emotion."]},{"id":"i5","t":"“Art as an imitation of an action”","_a":"RggLDkc=","why":"Aristotle’s starting point: tragedy imitates.","hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Mimesis: it’s imitation."]},{"id":"i6","t":"Laertes: “the king, the king’s to blame” (5.2.331)","_a":"RgQMAgIW","why":"Hamlet learns the truth: a change in knowledge.","wrong":{"peri":"It changes knowledge. That’s recognition."},"hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Anagnorisis: Hamlet learns who is to blame."]},{"id":"i7","t":"Hamlet the hunter becomes the hunted after 3.4","_a":"RhUHEQwW","why":"The action turns into its opposite.","hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Peripeteia: the direction of the story flips."]},{"id":"i8","t":"Hamlet’s advice to “hold, as ’twere, the mirror up to nature” (3.2.24–25)","_a":"RggLDkc=","why":"Acting as imitation of life.","hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Mimesis: a mirror imitates."]},{"id":"i9","t":"A misjudgment: sparing Claudius at prayer (3.3)","_a":"Rg0DDkc=","why":"An error of judgment, not wickedness.","wrong":{"peri":"Sparing him is the \u003cem>cause\u003c/em>; the reversal comes in 3.4."},"hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Hamartia: it’s an error of judgment."]},{"id":"i10","t":"Leaving the theatre shaken but clearer","_a":"RgYDFw0W","why":"Pity and fear purged or clarified, in us.","hints":["Hero, story or audience?","Knowledge, direction, error, emotion or imitation?","Catharsis: it happens in the audience."]}]},{"id":"arist","type":"mc","title":"Is it Aristotelian?","summary":"Is it Aristotelian?","goal":[6,2],"star":true,"instruction":"Five stories you haven’t seen. Hold each one up to Aristotle’s lens. Trivium: Logic.","items":[{"id":"r1","goal":6,"prompt":"\u003cstrong>Oedipus:\u003c/strong> a king hunts his city’s polluter and learns that he himself killed his father and married his mother. What is special about the recognition here?","options":[{"t":"It coincides with the reversal: learning the truth \u003cem>is\u003c/em> his fall. Aristotle calls this the finest kind.","why":"Butcher: “The best form of recognition is coincident with a Reversal of the Situation, as in the Oedipus” (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 11).","_n":"1k387","_k":"5ec0e9bf"},{"t":"The recognition and the reversal are unrelated.","why":"The moment he knows, he falls.","_n":"1l477","_k":"1f013b39"},{"t":"It shows that Oedipus is wicked.","why":"He acted in ignorance: error, not vice.","_n":"1m467","_k":"e6320079"},{"t":"It happens to the audience, not to Oedipus.","why":"Recognition is a character’s change from ignorance to knowledge; the audience’s response is catharsis.","_n":"1nc57","_k":"8b8da78c"}],"hints":["When does Oedipus learn the truth?","When does his fortune turn?","At the same moment."]},{"id":"r2","goal":6,"prompt":"A ruthless smuggler betrays everyone and is finally caught. Would Aristotle call this an ideal tragedy?","options":[{"t":"Yes: he falls from success to ruin.","why":"Falling isn’t enough; it must be unmerited, from error, not vice.","_n":"1oc67","_k":"80e3099a"},{"t":"No: a tragedy can’t have a criminal in it.","why":"Aristotle objects to a deserved fall, not to crime in the story.","_n":"1pc37","_k":"068cf050"},{"t":"Yes: he is caught, so justice is done.","why":"Justice satisfies us, but tragedy needs pity and fear.","_n":"1qc47","_k":"bb6712ca"},{"t":"No: a wicked man’s fall satisfies but doesn’t arouse pity.","why":"Butcher: such a plot “would, doubtless, satisfy the moral sense, but it would inspire neither pity nor fear” (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 13).","_n":"1rc97","_k":"6541094f"}],"hints":["Do we pity someone who gets what he deserves?","Pity is aroused by \u003cem>unmerited\u003c/em> misfortune.","No: his fall is deserved, so it satisfies without arousing pity."]},{"id":"r3","goal":6,"prompt":"A gifted surgeon refuses help during a long operation out of confidence; the patient survives, but she realizes she nearly killed him and changes how she works. Which element is missing for a full tragedy?","options":[{"t":"Hamartia: she makes no error.","why":"Her confidence \u003cem>is\u003c/em> the error.","_n":"1sca7","_k":"b9ca4aad"},{"t":"The catastrophe. Recognition comes in time, so there’s no tragic fall.","why":"Error and recognition are both there; the fall never comes.","_n":"1tc77","_k":"74ef648b"},{"t":"Nothing: it’s a complete tragedy.","why":"No one falls. The recognition arrives in time to prevent it.","_n":"1uc87","_k":"319cd45a"},{"t":"Anagnorisis: she never realizes anything.","why":"She realizes she nearly killed him: that’s recognition.","_n":"1vbd7","_k":"a41c089a"}],"hints":["Find the error, then the recognition.","Does anyone suffer the fall?","The catastrophe: she learns in time."]},{"id":"r4","goal":2,"prompt":"A detective story told in flashbacks over twenty years, in four cities. Does it break Aristotle’s rules?","options":[{"t":"No: Aristotle had no views on plot.","why":"He calls the plot “the soul of a tragedy”.","_n":"1wbe7","_k":"780f4d66"},{"t":"Not necessarily: Aristotle insists on unity of \u003cem>action\u003c/em>; unity of time and place came from later critics.","why":"If the action is one connected whole, the years and the cities don’t trouble Aristotle.","_n":"1xcb7","_k":"9c5d6266"},{"t":"Yes: Aristotle forbids flashbacks.","why":"There’s no such rule. He asks for one complete, connected action.","_n":"1yca7","_k":"3dfe840f"},{"t":"Yes: it breaks the three unities of time, place and action.","why":"Aristotle insists on unity of \u003cem>action\u003c/em>. The unities of time and place came mostly from later critics.","_n":"1zcd7","_k":"018ca099"}],"hints":["Which unity does Aristotle actually insist on?","Action, not time or place.","Not necessarily: only unity of action is his."]},{"id":"r5","goal":6,"prompt":"A hero’s town is destroyed by a flood unconnected to anything she did. Where is the hamartia?","options":[{"t":"The flood is the hamartia.","why":"A flood isn’t an error \u003cem>of the hero\u003c/em>.","_n":"20cc7","_k":"9ec0f695"},{"t":"There isn’t one: misfortune without the hero’s error is pitiable, but it isn’t Aristotle’s tragic pattern.","why":"Her suffering moves us, but it doesn’t grow from her own error.","_n":"21c77","_k":"c222ac73"},{"t":"Her grief after the flood.","why":"Grief is a response, not the error that causes a fall.","_n":"22c67","_k":"62bbaa5a"},{"t":"Her choice to live in the town.","why":"Nothing in the story makes that an error that causes the fall.","_n":"23c97","_k":"a5511e00"}],"hints":["Hamartia belongs to the hero.","Did she misjudge anything?","There isn’t one: the disaster isn’t caused by her error."]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Josefina","goal":[3,2,1],"instruction":"Josefina made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":3,"task":"Explain Aristotle’s tragic hero, using Hamlet.","steps":["Aristotle describes a hero who is “not eminently good and just”.","His misfortune comes from “some error or frailty”.","Aristotle calls this fault hubris, meaning excessive pride.","Hamlet’s hubris is pride in his own intelligence."],"_a":"Vg==","stepFb":["Accurate. Keep checking.","Accurate.","","Sentence 4 builds on sentence 3. The problem is earlier."],"fixes":[{"t":"Aristotle’s word is \u003cem>hamartia\u003c/em>, an error or frailty; “hubris” is a later critics’ idea.","why":"Right: the \u003cem>Poetics\u003c/em> names an error, not pride.","_n":"24c87","_k":"10413939"},{"t":"Aristotle calls it vice.","why":"He says explicitly \u003cem>not\u003c/em> vice.","_n":"25c37","_k":"786e0258"},{"t":"Sentence 3 is correct.","why":"Aristotle’s word is \u003cem>hamartia\u003c/em>. “Hubris” (violent arrogance) was attached to tragic heroes by later critics.","_n":"26c27","_k":"39161d3a"},{"t":"Delete sentence 2.","why":"Sentence 2 is the key quotation.","_n":"27b15","_k":"1affffb9"}],"hints":["Which Greek word is Aristotle’s?","Not hubris.","The fix that names hamartia."]},{"id":"e2","goal":2,"task":"Describe \u003cem>Hamlet\u003c/em>’s structure.","steps":["The inciting incident is the Ghost’s command in 1.5.","The rising action builds through \u003cem>The Mousetrap\u003c/em> in 3.2.","The climax is the final duel in 5.2, where the most characters die.","So the falling action is only a few lines long."],"_a":"Vg==","stepFb":["Correct.","Correct.","","This follows from sentence 3."],"fixes":[{"t":"The climax is the turn in Act 3 (for example 3.4, where killing Polonius reverses Hamlet’s position); 5.2 is the catastrophe.","why":"Right: the climax is the turn, not the most deaths.","_n":"28b25","_k":"df2f3226"},{"t":"The climax is 1.1.","why":"That’s the exposition.","_n":"29b35","_k":"9981175d"},{"t":"There is no climax.","why":"Every arc has a turn.","_n":"2ab45","_k":"c44a8d7a"},{"t":"Sentence 3 is correct.","why":"The climax is the \u003cem>turn\u003c/em>, usually mid-play. The end is the catastrophe.","_n":"2bb55","_k":"23ae9640"}],"hints":["Climax = turn.","Where does the direction change?","The fix that puts the climax in Act 3."]},{"id":"e3","goal":1,"task":"Explain catharsis at the end of \u003cem>Hamlet\u003c/em>.","steps":["Horatio’s “Good night, sweet prince” (\u003ci>Hamlet\u003c/i> 5.2.370) gives the ending a moment of grace.","Aristotle says tragedy works “through pity and fear”.","Catharsis means the audience leaves happy because the villain is punished.","So \u003cem>Hamlet\u003c/em>’s catharsis comes from Claudius’s death."],"_a":"Vg==","stepFb":["Good observation and citation.","Accurate.","","Sentence 4 rests on sentence 3."],"fixes":[{"t":"Catharsis means the hero is punished.","why":"Catharsis is what happens to \u003cem>us\u003c/em>: pity and fear are aroused and purged or clarified, not soothed by justice.","_n":"2cb65","_k":"e9a877da"},{"t":"Sentence 3 is correct.","why":"Catharsis is what happens to \u003cem>us\u003c/em>: pity and fear are aroused and purged or clarified, not soothed by justice.","_n":"2db75","_k":"d9de32e4"},{"t":"Catharsis means a surprise ending.","why":"A surprise ending isn’t catharsis, and not every surprise is even a reversal.","_n":"2eb85","_k":"31cc2aa2"},{"t":"Catharsis is the purging or clarifying of the pity and fear the tragedy arouses: we feel them fully and are changed, not simply pleased.","why":"Right: catharsis happens to the audience’s pity and fear.","_n":"2fb95","_k":"45e62183"}],"hints":["Whose emotions?","Pity and fear, ours.","The fix about purging pity and fear."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Where did you put \u003cem>Hamlet\u003c/em>’s climax, and what does your choice say about what you think the play is \u003cem>about\u003c/em>?"},{"id":"j2","q":"In your own words, why does Aristotle insist the hero’s fall come from error, not wickedness?"},{"id":"j3","q":"Explain to a friend the difference between a reversal and a recognition, with one example from \u003cem>Hamlet\u003c/em> and one from a film or book you know."},{"id":"j4","q":"Which critic’s view of Hamlet do you find most persuasive, and what line would you use to challenge it?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from the play or from Aristotle that you’d like to remember, and why.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write a principle about arguing for an interpretation. Add the line or passage that taught it, and one sentence of your own that follows it.","placeholder":"e.g. Name the evidence that hurts your case before your reader does.","examples":["the native hue of resolution / Is sicklied o’er with the pale cast of thought (\u003ci>Hamlet\u003c/i> 3.1.84–85)","How now! a rat? Dead, for a ducat, dead! (\u003ci>Hamlet\u003c/i> 3.4.23)","The Plot, then, is the first principle, and, as it were, the soul of a tragedy (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 6)","A whole is that which has a beginning, a middle, and an end. (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 7)","Good night, sweet prince (\u003ci>Hamlet\u003c/i> 5.2.370)"]},"artSamples":[{"p":"A tragic flaw is a strength turned against itself.","m":"“the native hue of resolution / Is sicklied o’er with the pale cast of thought” (3.1.84–85)"},{"p":"Name the evidence that hurts your case before your reader does.","m":"TC3’s counter line"}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In Butcher’s translation, Aristotle says tragedy effects “the proper purgation” of which emotions?","options":[{"t":"Love and hate","why":"Those appear in his account of recognition, not purgation.","_n":"2gba5","_k":"bd0dcbb9"},{"t":"Joy and sorrow","why":"Aristotle names pity and fear.","_n":"2hb75","_k":"be28f100"},{"t":"Anger and pride","why":"Pride belongs to the later idea of hubris. Aristotle names pity and fear.","_n":"2ib65","_k":"f3e9325c"},{"t":"Pity and fear","why":"Through pity and fear, these emotions are purged.","_n":"2jb55","_k":"f24c33bb"}]},"b":{"prompt":"What does Aristotle call “the soul of a tragedy”?","options":[{"t":"The plot","why":"Character holds the second place.","_n":"2kb45","_k":"7bdd8a0f"},{"t":"Character","why":"He ranks character second.","_n":"2lbb5","_k":"92be35ed"},{"t":"The chorus","why":"Not his phrase.","_n":"2mba5","_k":"ea54683f"},{"t":"Spectacle","why":"He ranks it least.","_n":"2nb95","_k":"526ccc48"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Aristotle’s ideal tragic hero falls because of…","options":[{"t":"some error or frailty, not vice","why":"So we can pity him.","_n":"2ob85","_k":"0be1e807"},{"t":"bad luck alone","why":"Misfortune with no error doesn’t fit his pattern.","_n":"2pbf5","_k":"bb2ab95d"},{"t":"wickedness","why":"Aristotle’s hero falls “not by vice or depravity, but by some error or frailty”. If he were wicked, we couldn’t pity him.","_n":"2qbe5","_k":"1b8ca327"},{"t":"the gods’ anger","why":"Not his explanation.","_n":"2r590","_k":"df3cacf2"}]},"b":{"prompt":"Which Greek term does the \u003cem>Poetics\u003c/em> use for the hero’s error?","options":[{"t":"\u003cem>Hubris\u003c/em>","why":"A later critics’ idea.","_n":"2s580","_k":"f6f023de"},{"t":"\u003cem>Catharsis\u003c/em>","why":"That’s purgation.","_n":"2t5b0","_k":"eee69b33"},{"t":"\u003cem>Peripeteia\u003c/em>","why":"That’s reversal.","_n":"2u5a0","_k":"9e317325"},{"t":"\u003cem>Hamartia\u003c/em>","why":"Aristotle’s word: an error or frailty.","_n":"2v5d0","_k":"bfa63e08"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"Peripeteia is…","options":[{"t":"any surprising event","why":"A reversal is the action turning into its opposite: the hunter becomes the hunted.","_n":"2w5c0","_k":"e0004bb9"},{"t":"the final scene","why":"The climax is the \u003cem>turn\u003c/em>, usually mid-play. The end is the catastrophe.","_n":"2x5f0","_k":"bb455673"},{"t":"a reversal, when the action veers round to its opposite","why":"Butcher’s words for the reversal.","_n":"2y5e0","_k":"86bec3aa"},{"t":"a change from ignorance to knowledge","why":"That’s recognition.","_n":"2z610","_k":"12b37acf"}]},"b":{"prompt":"Anagnorisis is…","options":[{"t":"a change from ignorance to knowledge","why":"Butcher’s words for recognition.","_n":"30600","_k":"903e4a5c"},{"t":"the hero’s error","why":"That’s hamartia.","_n":"31f30","_k":"b89fd6d9"},{"t":"the audience’s tears","why":"Feelings in the audience belong to catharsis.","_n":"32f40","_k":"90e5a719"},{"t":"a reversal of fortune","why":"That’s peripeteia.","_n":"33f10","_k":"54709a39"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Which event is best described as \u003cem>Hamlet\u003c/em>’s peripeteia?","options":[{"t":"The final duel (5.2)","why":"That’s the catastrophe.","_n":"34f20","_k":"35246de9"},{"t":"Killing Polonius (3.4), which turns Hamlet from hunter into hunted","why":"Exile, Ophelia’s madness and Laertes’s revenge follow.","_n":"35ef0","_k":"c411f4da"},{"t":"The gravediggers’ scene (5.1)","why":"It comes after the turn.","_n":"36f00","_k":"0320f289"},{"t":"The Ghost’s appearance (1.1)","why":"That begins the action.","_n":"37ed0","_k":"0fb95be9"}]},"b":{"prompt":"Where does anagnorisis most clearly occur?","options":[{"t":"In 1.5, when the Ghost speaks","why":"Hamlet learns a claim, but must still test it.","_n":"38ee0","_k":"49f0c427"},{"t":"In 4.5, when Ophelia goes mad","why":"Ophelia’s madness isn’t Hamlet’s recognition.","_n":"39eb0","_k":"58ff3be5"},{"t":"In 3.4, when Polonius dies","why":"That’s the reversal.","_n":"3aec0","_k":"b65ee2ec"},{"t":"In 5.2, when the dying Laertes reveals the plot: “the king, the king’s to blame”","why":"Hamlet learns the whole truth at last (\u003ci>Hamlet\u003c/i> 5.2.331).","_n":"3bed0","_k":"1f2d7de3"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Which line most \u003cstrong>complicates\u003c/strong> the reading that Hamlet’s flaw is thinking too much?","options":[{"t":"“Now might I do it pat, now he is praying” (3.3.73)","why":"He reasons himself out of acting.","_n":"3cec0","_k":"ebe71aa2"},{"t":"“How all occasions do inform against me” (4.4.32)","why":"He accuses himself of delay.","_n":"3deb0","_k":"7c36ae94"},{"t":"“the pale cast of thought” (3.1.85)","why":"It \u003cem>supports\u003c/em> the reading.","_n":"3eea0","_k":"f13dcdda"},{"t":"“How now! a rat? Dead, for a ducat, dead!” (3.4.23)","why":"He acts instantly, without thought.","_n":"3ff10","_k":"e6a5d7ab"}]},"b":{"prompt":"Which line most \u003cstrong>complicates\u003c/strong> the reading that Hamlet is simply rash?","options":[{"t":"“Rashly, / And praised be rashness for it” (5.2.6–7)","why":"That supports it: he praises his own rashness.","_n":"3gf00","_k":"67fd3d04"},{"t":"“O, what a rash and bloody deed is this!” (3.4.27)","why":"That supports the reading: Gertrude calls the deed rash.","_n":"3hef0","_k":"6b21a394"},{"t":"“Dead, for a ducat, dead!” (3.4.23)","why":"That supports it: he strikes without looking.","_n":"3iee0","_k":"f03b7692"},{"t":"“Now might I do it pat, now he is praying” (3.3.73)","why":"He stops to reason at the decisive moment.","_n":"3je50","_k":"1279cf36"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A celebrated bridge engineer ignores a junior colleague’s warning because she trusts her own calculations. The bridge fails. At the inquiry, she realizes the colleague was right. Which reading is most Aristotelian?","options":[{"t":"Hamartia: an error born of confidence; peripeteia: the bridge’s failure; anagnorisis: her realization at the inquiry","why":"Error, then the fall, then the knowing.","_n":"3ke40","_k":"b7acd8ca"},{"t":"Catharsis: the bridge failing","why":"Catharsis happens in the audience.","_n":"3le70","_k":"4f1bb369"},{"t":"Hamartia: the bridge; peripeteia: the inquiry; anagnorisis: the warning","why":"The terms sit on the wrong events: the error is hers, the failure is the reversal, and the realization is the recognition.","_n":"3me80","_k":"97e15bdb"},{"t":"There is no hamartia because she meant well","why":"Hamartia isn’t malice; it’s error.","_n":"3ne90","_k":"55d6f2f1"}]},"b":{"prompt":"In the Oedipus story, the king learns he killed his father at the very moment his fortunes collapse. Why does Aristotle prize this?","options":[{"t":"Recognition coincides with reversal, making the moment of knowing the moment of falling","why":"“The best form of recognition is coincident with a Reversal of the Situation” (Aristotle, \u003ci>Poetics\u003c/i>, trans. S. H. Butcher, ch. 11).","_n":"3oea0","_k":"ea417137"},{"t":"Because it happens offstage","why":"Irrelevant.","_n":"3peb0","_k":"59d9e7b8"},{"t":"Because the hero is wicked","why":"Aristotle’s hero falls “not by vice or depravity, but by some error or frailty”. If he were wicked, we couldn’t pity him.","_n":"3qec0","_k":"152ad0dc"},{"t":"Because it ends happily","why":"It doesn’t, and catharsis isn’t a happy ending.","_n":"3red0","_k":"cd0e39c0"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best thesis?","options":[{"t":"“Read through Aristotle, Hamlet’s hamartia is an error of timing: by sparing Claudius at prayer (3.3) and stabbing blindly in 3.4, he acts at the wrong moments, and the play’s reversal follows.”","why":"Arguable, specific, and it uses the lens.","_n":"3see0","_k":"e46a96e7"},{"t":"“Hamlet has a tragic flaw.”","why":"Vague. Which, and why does it matter?","_n":"3tdf0","_k":"a2b15ad7"},{"t":"“Aristotle’s rules prove \u003cem>Hamlet\u003c/em> is a bad play.”","why":"An overclaim: Aristotle’s terms are a lens, not a rulebook.","_n":"3ue00","_k":"7fb0a2bb"},{"t":"“\u003cem>Hamlet\u003c/em> is a tragedy by Aristotle.”","why":"A factual error: Shakespeare wrote \u003cem>Hamlet\u003c/em>; Aristotle wrote about tragedy.","_n":"3vf11","_k":"1a936973"}]},"b":{"prompt":"Which is the best thesis about catharsis in \u003cem>Hamlet\u003c/em>?","options":[{"t":"“\u003cem>Hamlet\u003c/em> earns its catharsis not through Claudius’s punishment but through the waste of a mind we have come to know, so that Horatio’s ‘Good night, sweet prince’ (5.2.370) purges pity rather than satisfying revenge.”","why":"Arguable, specific, and the citation is evidence.","_n":"3wf01","_k":"74a2424c"},{"t":"“Catharsis is in \u003cem>Hamlet\u003c/em>.”","why":"Vague: what does it come from, and why does it matter?","_n":"3xf31","_k":"58d0808f"},{"t":"“Everyone cries at the end.”","why":"An unsupported generalization.","_n":"3yf21","_k":"c9a4e52b"},{"t":"“\u003cem>Hamlet\u003c/em> has catharsis because the villain dies.”","why":"Catharsis is what happens to \u003cem>us\u003c/em>: pity and fear are aroused and purged or clarified, not soothed by justice.","_n":"3zed1","_k":"f9430973"}]}},{"id":"c2","cat":"C","goal":[1,3],"a":{"prompt":"Which sentence explains catharsis most accurately?","options":[{"t":"“Catharsis is the hero’s revenge being satisfied.”","why":"Catharsis is what happens to \u003cem>us\u003c/em>: pity and fear are aroused and purged or clarified, not soothed by justice.","_n":"40ec1","_k":"dfd17213"},{"t":"“Catharsis means the audience must cry.”","why":"Too literal: catharsis is a change in the audience, not a required reaction.","_n":"41ef1","_k":"f0ffad4b"},{"t":"“Catharsis is a happy ending.”","why":"Catharsis is what happens to \u003cem>us\u003c/em>: pity and fear are aroused and purged or clarified, not soothed by justice.","_n":"42ee1","_k":"da7aad93"},{"t":"“Catharsis is the purging or clarifying of the pity and fear a tragedy arouses: the audience feels them fully and is changed.”","why":"Pity and fear, felt fully, then purged or clarified.","_n":"43e91","_k":"11071f99"}]},"b":{"prompt":"Which sentence explains hamartia most accurately?","options":[{"t":"“Hamartia is the same as hubris.”","why":"Aristotle’s word is \u003cem>hamartia\u003c/em>. “Hubris” (violent arrogance) was attached to tragic heroes by later critics.","_n":"44e81","_k":"9730f25c"},{"t":"“Hamartia is the hero’s evil nature.”","why":"Aristotle’s hero falls “not by vice or depravity, but by some error or frailty”. If he were wicked, we couldn’t pity him.","_n":"456b1","_k":"54bfeeba"},{"t":"“Hamartia is the moment of reversal.”","why":"That’s peripeteia, the reversal.","_n":"466c1","_k":"2ddf8630"},{"t":"“Hamartia is an error or frailty, not wickedness, which is why we can pity the hero who falls by it.”","why":"Error, not wickedness: that’s why we pity him.","_n":"47691","_k":"32fb741c"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"In a film, a team captain refuses to rest an injured knee before the final, sure that she can carry the team. She collapses in the second half, and the team loses. Which term best names her refusal?","options":[{"t":"Mimesis","why":"That’s the film imitating life, not her choice.","_n":"486a1","_k":"30e9e304"},{"t":"Hamartia","why":"An error born of strength (her determination).","_n":"496f1","_k":"9a55f725"},{"t":"Anagnorisis","why":"That would be her realization.","_n":"4a701","_k":"a44684e3"},{"t":"Catharsis","why":"Catharsis happens in the audience, not in her choice.","_n":"4b6d1","_k":"8db9160b"}]},"b":{"prompt":"In the same film, which term names the moment in the locker room when she sees what her pride cost the team?","options":[{"t":"Catharsis","why":"Catharsis is the audience’s response, not her realization.","_n":"4c6e1","_k":"2d89fb47"},{"t":"Hamartia","why":"That’s the refusal.","_n":"4d631","_k":"6b0d4d76"},{"t":"Peripeteia","why":"That’s the collapse.","_n":"4e641","_k":"7351e390"},{"t":"Anagnorisis","why":"She moves from ignorance to knowledge.","_n":"4f650","_k":"52c6768a"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A director wants to cut 3.3 (Hamlet sparing Claudius at prayer) to save time. Using Aristotle’s idea that events should follow by “probability or necessity”, what is the strongest objection?","options":[{"t":"3.3 contains the climax by law","why":"There’s no such law; the objection is about cause and effect.","_n":"4g640","_k":"22573dd9"},{"t":"Audiences like long plays","why":"Irrelevant to the chain of cause and effect.","_n":"4h630","_k":"157b0cad"},{"t":"Aristotle forbids cutting any scene","why":"There’s no such rule; he asks whether events follow by probability or necessity.","_n":"4i620","_k":"356274d1"},{"t":"The cut breaks the causal chain: without the choice to spare Claudius, the killing in 3.4 loses its cause and its irony","why":"Hamlet strikes at the arras believing the King is there, the King he has just left.","_n":"4j610","_k":"e1a0d8ca"}]},"b":{"prompt":"Aristotle criticizes “episodic” plots (Butcher spells it “epeisodic”), where scenes follow without probable or necessary sequence. Which is the best defence of keeping the gravediggers’ scene (5.1)?","options":[{"t":"It isn’t merely episodic: Ophelia’s burial brings Hamlet and Laertes face to face and sets up the duel","why":"Probable sequence: the burial leads to the quarrel, and the quarrel to the duel.","_n":"4k600","_k":"c38da59e"},{"t":"It’s funny, and audiences need jokes","why":"Partly true, but not an Aristotelian defence.","_n":"4l5f0","_k":"93940041"},{"t":"Aristotle loved gravediggers","why":"Invented.","_n":"4m5e0","_k":"18e6b3e7"},{"t":"It’s short","why":"Irrelevant.","_n":"4n6d0","_k":"22a39dd4"}]}}]},"task":{"title":"Performance task: A claim about the flaw","summary":"A claim about the flaw","statement":"\u003cp>Write a 180–300-word argument about Hamlet’s hamartia, using Aristotle’s lens. Take a position, use two pieces of evidence, and answer the strongest counterargument.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the argument.\u003c/p>\u003cdetails class='alg th-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge (Aristotle’s terms)\u003c/td>\u003ctd>Misused\u003c/td>\u003ctd>Named, loosely used\u003c/td>\u003ctd>Used accurately\u003c/td>\u003ctd>Used precisely, with nuance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking (argument and counter)\u003c/td>\u003ctd>Assertion only\u003c/td>\u003ctd>Evidence, no counter\u003c/td>\u003ctd>Evidence with a counter answered\u003c/td>\u003ctd>The counter sharpens the claim\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication (integration and clarity)\u003c/td>\u003ctd>Quotations dropped in\u003c/td>\u003ctd>Quotations introduced\u003c/td>\u003ctd>Quotations embedded and analysed\u003c/td>\u003ctd>Elegant, economical analysis\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application (lens on text)\u003c/td>\u003ctd>Lens absent\u003c/td>\u003ctd>Lens applied mechanically\u003c/td>\u003ctd>Lens illuminates the play\u003c/td>\u003ctd>Lens and play test each other\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Names the text and author","Takes a position","Speaks Aristotle’s language","Two pieces of evidence","Faces the counterargument","Answers it","Length"],"tips":["Your first sentence should name \u003cem>Hamlet\u003c/em> and Shakespeare.","Choose a reading, or name your own in a few words.","Use at least one of Aristotle’s terms, precisely.","Two quotations, cited, from two different scenes.","Begin your counter with “It could be argued…” or “Some readers…”.","Then answer it: “Yet…”.","Aim for 180–300 words."],"explainPrompt":"Craft statement: Which piece of counterevidence worried you most, and how did you answer it? What did answering it teach you about your own claim?","explainLabel":"Craft statement","vocab":"Name the counter line, then say what answering it changed in your claim.","checkLabel":"Check my argument","success":"Your argument has every part.","more":"Try another reading: each complete argument joins your list.","min":180,"max":300,"terms":["hamartia","peripeteia","reversal","anagnorisis","recognition","catharsis","error or frailty"],"counterStarts":["Some readers","It could be argued","Although","Admittedly","Others","Critics such as"],"answerStarts":["Yet","But","However","Still","Even so"],"readings":[{"id":"R1","t":"Thinking too much","sub":"after Coleridge","name":"thinking too much"},{"id":"R2","t":"Melancholy","sub":"after Bradley","name":"melancholy"},{"id":"R3","t":"A great duty laid on a soul unfit for it","sub":"after Goethe","name":"a great duty laid on a soul unfit for it"},{"id":"R4","t":"Rash action","sub":"","name":"rash action"}],"bank":[{"id":"LB1","t":"Thus conscience does make cowards of us all; / And thus the native hue of resolution / Is sicklied o’er with the pale cast of thought","ref":"3.1.83–85","s":["R1"],"c":["R4"]},{"id":"LB2","t":"O, what a rash and bloody deed is this!","who":"Gertrude","ref":"3.4.27","s":["R4"],"c":["R1","R2"]},{"id":"LB3","t":"I have of late—but wherefore I know not—lost all my mirth","ref":"2.2.306–307","s":["R2"],"c":[]},{"id":"LB4","t":"The time is out of joint: O cursed spite, / That ever I was born to set it right!","ref":"1.5.189–190","s":["R3"],"c":[]},{"id":"LB5","t":"How all occasions do inform against me, / And spur my dull revenge!","ref":"4.4.32–33","s":["R1","R3"],"c":["R4"]},{"id":"LB6","t":"Now might I do it pat, now he is praying","ref":"3.3.73","s":["R1"],"c":["R3","R4"]},{"id":"LB7","t":"How now! a rat? Dead, for a ducat, dead!","ref":"3.4.23","s":["R4"],"c":["R1","R2","R3"]},{"id":"LB8","t":"O, what a rogue and peasant slave am I!","ref":"2.2.576","s":["R1","R2"],"c":[]},{"id":"X1","t":"Rashly, / And praised be rashness for it","ref":"5.2.6–7"},{"id":"X2","t":"And so he goes to heaven","ref":"3.3.74"},{"id":"X3","t":"My words fly up, my thoughts remain below","who":"Claudius","ref":"3.3.97"},{"id":"X4","t":"Is it the king?","ref":"3.4.26"},{"id":"X5","t":"the king, the king’s to blame","who":"Laertes","ref":"5.2.331"},{"id":"X6","t":"Good night, sweet prince","who":"Horatio","ref":"5.2.370"},{"id":"X7","t":"to hold, as ’twere, the mirror up to nature","ref":"3.2.24–25"},{"id":"X8","t":"O, that this too too solid flesh would melt","ref":"1.2.129"}],"labels":{"reading":"Reading","own":"My own","ownLabel":"My reading, in 2–6 words","ins":"Quotation inserter","insHow":"Tap a line to insert it, with its citation, where your cursor is. Or type your own quotation with a citation such as (Hamlet 3.1.56).","plan":"Plan it first (optional)","planHow":"Fill the parts, then add them to your draft as a starting paragraph.","planAdd":"Add my plan to the draft","thesis":"Insert my thesis from Part 3","noThesis":"Build a thesis in Part 3’s thesis forge first.","draft":"Your argument","tag":"Tag your sentences","tagHow":"Tag the sentence that states the counterargument as \u003cstrong>Counter\u003c/strong> and a later sentence that answers it as \u003cstrong>Answer\u003c/strong>.","counter":"Counter","reply":"Answer","noSent":"Write a few sentences first; they’ll appear here to tag."},"plan":[{"id":"claim","t":"Claim","ph":"Hamlet’s hamartia is…"},{"id":"ev1","t":"Evidence 1","ph":"a quotation and citation"},{"id":"ev2","t":"Evidence 2","ph":"from a different scene"},{"id":"counter","t":"Counter","ph":"It could be argued that…"},{"id":"answer","t":"Answer","ph":"Yet…"}],"modelsLabel":"Three model arguments (three different approaches)","modelsNote":"The Counter and Answer tags show where a writer’s tags would sit; they aren’t part of the text.","models":[{"title":"Model 1 (thinking too much)","s":[["Read through Aristotle’s lens, Hamlet’s hamartia in Shakespeare’s \u003ci>Hamlet\u003c/i> is an excess of thought that turns every chance to act into another question."],["In his most famous soliloquy, Hamlet diagnoses his own condition: “the native hue of resolution / Is sicklied o’er with the pale cast of thought” (\u003ci>Hamlet\u003c/i> 3.1.84–85)."],["The image is medical; thinking is a disease that drains the colour from decision."],["When the perfect chance arrives, he proves it."],["“Now might I do it pat, now he is praying” (3.3.73), he says, and then he reasons himself out of it, wanting Claudius damned rather than saved."],["This is not vice, as Aristotle would insist, but the frailty of a brilliant mind."],["Even alone on stage, he accuses himself of it: “How all occasions do inform against me, / And spur my dull revenge!” (4.4.32–33)."],["It could be argued that Hamlet is no over-thinker at all, since he stabs Polonius without a moment’s reflection: “Dead, for a ducat, dead!” (3.4.23).","counter"],["Yet that rash blow is the other face of the same flaw: having thought too long, he finally acts at the worst possible moment, and the reversal of his fortunes begins.","answer"]]},{"title":"Model 2 (rashness)","s":[["Aristotle’s tragic hero falls through “some error or frailty,” and in Shakespeare’s \u003ci>Hamlet\u003c/i> that frailty is not hesitation but rashness: Hamlet’s sudden, unweighed actions drive the play’s reversal."],["Gertrude names it the instant it happens: “O, what a rash and bloody deed is this!” (\u003ci>Hamlet\u003c/i> 3.4.27)."],["Hamlet has stabbed through the arras without looking, hoping to find the King, and his response is careless: “Dead, for a ducat, dead!” (3.4.23)."],["Even his escape at sea, he later tells Horatio, began with an impulse: “Rashly, / And praised be rashness for it” (5.2.6–7)."],["In each case, the impulse comes first and the thinking only afterward."],["Some readers argue that Hamlet’s real problem is thinking too much, pointing to the “pale cast of thought” that sickens his resolution (3.1.85).","counter"],["But those soliloquies show how Hamlet sees himself, not how he acts.","answer"],["On stage, the killing of Polonius turns Hamlet from hunter into hunted, sending him to England and bringing Laertes home for revenge."],["That is the peripeteia Aristotle describes, and rashness causes it."],["Hamlet’s error is not that he cannot act, but that he acts before he looks."]]},{"title":"Model 3 (my own: an error of timing)","s":[["It is tempting to search Shakespeare’s \u003ci>Hamlet\u003c/i> for one fatal trait, but the play suggests that Hamlet’s hamartia is an error of judgment about timing rather than a fixed flaw of character."],["Twice, Hamlet misreads his moment."],["Finding Claudius alone, he holds back, convinced that killing a praying man means “And so he goes to heaven” (\u003ci>Hamlet\u003c/i> 3.3.74); yet once Hamlet leaves, Claudius admits, “My words fly up, my thoughts remain below” (3.3.97)."],["Minutes later, Hamlet strikes blindly at the arras, sure the King is there, and kills Polonius instead, asking, “Is it the king?” (3.4.26)."],["It could be argued, with Bradley, that a deep melancholy explains everything Hamlet does.","counter"],["Melancholy may colour his mood, but it does not explain why he is decisive in one scene and frozen in the one before.","answer"],["Aristotle wants a hero whose misfortune comes “not by vice or depravity, but by some error or frailty,” and these two misjudged moments, one too cautious and one too quick, are exactly that error."],["Together they form the hinge on which the whole tragedy reverses, from the prayer scene to the final duel."]]}]},"cards":[["Aristotle’s definition of tragedy","“An imitation of an action that is serious, complete, and of a certain magnitude… through pity and fear effecting the proper purgation of these emotions.” (Butcher)"],["Plot, “the soul of a tragedy”","Aristotle ranks plot first and character second. Many modern readers reverse this for \u003cem>Hamlet\u003c/em>."],["Mimesis","Imitation of life. “to hold, as ’twere, the mirror up to nature” (3.2.24–25)."],["Hamartia","The hero’s “error or frailty”, not vice. Example: sparing Claudius at prayer (3.3)."],["Hubris","Violent arrogance; \u003cem>not\u003c/em> Aristotle’s term for the hero’s fault in the \u003cem>Poetics\u003c/em>."],["Peripeteia","Reversal: the action “veers round to its opposite”. Killing Polonius (3.4)."],["Anagnorisis","Recogni
