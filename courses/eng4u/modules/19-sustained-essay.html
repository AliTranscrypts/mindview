KRFFSEQ==","why":"A subject with no claim at all.","hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Topic only: two nouns, no claim."]}]},{"id":"coherence","type":"mc","title":"Counterargument, coherence and conclusions","summary":"Counterargument, coherence and conclusions","star":true,"goal":[4,5,6],"instruction":"Choose the best answer. Items 4–6 are non-routine.","items":[{"id":"s1","goal":4,"prompt":"Thesis: “Jane’s passion is the source of her independence.” Which is the strongest counterargument to answer?","options":[{"t":"“Jane’s decision to leave Rochester looks like passion overruled by principle, which seems to contradict the thesis.”","why":"It’s the objection a careful reader would raise from the text itself.","_n":"24c9d","_k":"9aeab179"},{"t":"“Brontë first published the novel under a pseudonym.”","why":"That’s a biographical fact, not an objection to the reading.","_n":"25bcd","_k":"f9f61572"},{"t":"“The novel is very long.”","why":"Length has nothing to do with whether the thesis holds.","_n":"26bbd","_k":"fa494aac"},{"t":"“Some readers dislike Jane.”","why":"Taste isn’t a counterargument; find an objection based on the text.","_n":"273ae","_k":"3e9aabd6"}],"hints":["A counterargument comes from the text, not from taste.","Which objection uses an event in the novel?","Jane’s leaving Rochester looks like principle overruling passion: that’s the objection to answer."]},{"id":"s2","goal":4,"prompt":"Which is the best rebuttal to that objection (Jane’s leaving looks like passion overruled by principle)?","options":[{"t":"“Yet her leaving is itself passionate: she chooses herself as fiercely as she once chose him, so principle and passion are allies, not enemies.”","why":"It grants the appearance, then reframes the evidence.","_n":"283be","_k":"38a58ae1"},{"t":"“Jane is the narrator, so she is always right.”","why":"A narrator’s word isn’t proof; answer with the text’s evidence.","_n":"293ce","_k":"db9d9afe"},{"t":"“The objection is wrong.”","why":"Dismissing it without evidence loses the reader’s trust.","_n":"2a3de","_k":"7867df09"},{"t":"“Many critics agree with this essay’s thesis.”","why":"Counting allies isn’t a rebuttal; show why the objection fails.","_n":"2b36e","_k":"8770a6a8"}],"hints":["A rebuttal grants the point, then reframes it.","Look for “yet” followed by evidence.","The rebuttal that makes her leaving itself passionate."]},{"id":"s3","goal":5,"prompt":"After a paragraph on Gatsby’s parties, which is the best transition into a paragraph on the green light?","options":[{"t":"“Another symbol is the green light.”","why":"“Another” adds a point; it doesn’t build the argument.","_n":"2c37e","_k":"2b6a6930"},{"t":"“Next, I will talk about the green light.”","why":"Announcing the topic isn’t a link; say how it follows.","_n":"2d38e","_k":"930d2df4"},{"t":"“If the parties show Gatsby performing his dream for others, the green light shows him performing it for himself.”","why":"It carries the argument forward from one step to the next.","_n":"2e39e","_k":"71398637"},{"t":"“The green light is at the end of Daisy’s dock.”","why":"That’s a fact, not a transition.","_n":"2f42e","_k":"f6f63041"}],"hints":["A transition shows how the next step follows.","Which option connects the parties to the green light?","Parties perform the dream for others; the green light, for himself."]},{"id":"s4","goal":5,"prompt":"An essay argues that Fitzgerald’s light imagery shows a dream that lives on distance. Its five topic sentences: (1) The green light shines across the bay, close enough to see and too far to touch. (2) Gatsby’s parties blaze with light meant to be seen from Daisy’s side of the water. (3) Fitzgerald moved to the French Riviera while he was writing the novel. (4) When Daisy finally visits, the green light loses its enchantment. (5) The closing image turns the light into a current that pulls backward. Which one drifts?","options":[{"t":"Sentence 2, on the parties","why":"Parties connect to light (the lit-up mansion); the biography doesn’t.","_n":"2g43e","_k":"bb15f4d9"},{"t":"Sentence 5, on the closing image","why":"The closing image extends the light into the final current; it belongs.","_n":"2h40e","_k":"8bbbcb8d"},{"t":"Sentence 4, on Daisy’s visit","why":"Daisy’s visit shows the light losing its magic; it builds the thesis.","_n":"2i3fe","_k":"f7bb9ccf"},{"t":"Sentence 3, on Fitzgerald’s move to the Riviera","why":"Biography isn’t evidence about light imagery.","_n":"2j3ee","_k":"a4242d60"}],"hints":["Read each topic sentence against the thesis: light imagery.","Which one isn’t about light at all?","Sentence 3: the biography."]},{"id":"s5","goal":6,"prompt":"Choose the conclusion move that extends the argument of the \u003cem>Frankenstein\u003c/em> model essay.","options":[{"t":"“Shelley’s warning reaches past science: whenever we create systems, institutions or people, the duty of care begins at the moment of making.”","why":"It carries the claim beyond the book.","_n":"2k3de","_k":"bbef1968"},{"t":"“Mary Shelley began writing \u003cem>Frankenstein\u003c/em> when she was only eighteen.”","why":"A biographical fact at the exit opens a new topic.","_n":"2l3ce","_k":"a2932147"},{"t":"“There are many other monsters in literature worth studying.”","why":"That opens new doors at the exit instead of finishing the argument.","_n":"2m3be","_k":"643c5b37"},{"t":"“In conclusion, monstrousness is a verdict, as this essay has shown.”","why":"That restates; it doesn’t extend.","_n":"2n3ae","_k":"f9d817d3"}],"hints":["A conclusion answers “so what?”.","Where else does the novel’s insight apply?","Choose the option that carries the claim beyond the book."]},{"id":"s6","goal":4,"prompt":"An evidence bank has 7 quotations for claim 1, 1 for claim 2 and 0 for claim 3. What’s the best plan with 3 days left?","options":[{"t":"Drop claim 3 and leave claim 2 as it is.","why":"Claim 2 still rests on one quotation; rebalance the whole plan.","_n":"2o39e","_k":"292ca156"},{"t":"Return to the novel for claim 3 or merge it into claim 2; trim claim 1 to its 2–3 strongest quotations.","why":"Every beam gets a foundation, and the strongest evidence does the work.","_n":"2p48e","_k":"690e0a8a"},{"t":"Write claim 3 from memory.","why":"An unsupported beam is the first thing a reader will test.","_n":"2q47e","_k":"46c79527"},{"t":"Use all 7 quotations in paragraph 1 to show how much you found.","why":"More quotations isn’t better than better quotations.","_n":"2r351","_k":"968ffc47"}],"hints":["Every beam needs a foundation.","More quotations isn’t better than better quotations.","Rebalance: find or merge; trim the excess."]}]},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Ottilie","goal":[3,5],"instruction":"Ottilie drafted three body paragraphs for her ISU on \u003cem>Jane Eyre\u003c/em> and \u003cem>Frankenstein\u003c/em>. Each has one flaw. Tap the sentence where the \u003cstrong>first\u003c/strong> flaw appears, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"a paragraph on \u003cem>Jane Eyre\u003c/em> (thesis: passion as the source of Jane’s independence).","steps":["Jane’s independence begins not in obedience but in protest.","At Gateshead, she is locked in the red-room, and later she is sent to Lowood, where she meets Helen Burns, and after that she becomes a teacher and then goes to Thornfield.","Each stage tests her passion.","When she tells Rochester, “I am no bird; and no net ensnares me” (Brontë, ch. 23), the bird image turns captivity into a choice she refuses.","Her passion, in other words, is the very thing that makes her free."],"_a":"Uw==","stepFb":["A clear topic sentence that carries the thesis. Keep checking.","","This sentence is fine, but the problem starts earlier.","Good: integrated, cited and analysed.","A link back to the thesis."],"fixes":[{"t":"Sentence 2 is fine.","why":"It retells events without analysing any of them.","_n":"2s341","_k":"dd4fa1cf"},{"t":"Delete sentence 4.","why":"Sentence 4 is the paragraph’s best analysis.","_n":"2t371","_k":"0e0576c7"},{"t":"Replace sentence 2 with one telling moment: “Locked in the red-room, the child Jane already names injustice aloud, the first sign that her passion will be her compass.”","why":"One moment, analysed, instead of a list of events.","_n":"2u361","_k":"e5571e84"},{"t":"Add more plot events to sentence 2 so nothing is missed.","why":"More summary makes it worse.","_n":"2v311","_k":"bc0f4587"}],"hints":["Which sentence only reports what happens?","Summary has no “how”.","Sentence 2."]},{"id":"e2","goal":3,"task":"a paragraph on \u003cem>Frankenstein\u003c/em>.","steps":["Shelley shows that the Creature’s violence is learned from rejection.","The novel makes this explicit.","“Beware; for I am fearless, and therefore powerful.”","This shows the Creature has changed.","Rejection has armed him."],"_a":"UA==","stepFb":["A clear claim.","A bridge sentence; fine.","","Vague, but the first problem is earlier.","A link."],"fixes":[{"t":"Sentence 3 is fine.","why":"A quotation can’t stand alone as a sentence of your argument.","_n":"2w301","_k":"02ceeb0f"},{"t":"Integrate and cite it: “After Victor destroys the half-made companion, the Creature warns him, ‘Beware; for I am fearless, and therefore powerful’ (Shelley, ch. 20).”","why":"Speaker, moment, fitted quotation and citation.","_n":"2x331","_k":"ee5fb894"},{"t":"Put the quotation in italics instead of quotation marks.","why":"MLA uses quotation marks for quoted words.","_n":"2y321","_k":"095c0057"},{"t":"Add only the citation (Shelley, ch. 20) after the quotation.","why":"Better, but it still arrives with no speaker or moment.","_n":"2z2d1","_k":"ef73f505"}],"hints":["Who is speaking, when, and where’s the citation?","A “dropped” quotation has no frame.","Sentence 3."]},{"id":"e3","goal":5,"task":"a paragraph on \u003cem>Frankenstein\u003c/em>.","steps":["Each rejection is staged as a judgment of appearance.","The cottagers flee before the Creature finishes speaking.","Their terror responds to his face, not his words, so Shelley makes his eloquence irrelevant to his fate.","Shelley’s mother, Mary Wollstonecraft, was a famous writer on women’s rights.","This is why the novel is still read today."],"_a":"UQ==","stepFb":["A topic sentence that carries key terms.","Evidence: the moment matters.","Analysis linked to the claim.","","Vague, but the drift started earlier."],"fixes":[{"t":"Replace sentence 4 with a link: “The verdict comes before any act, which is exactly the injustice the essay’s thesis names.”","why":"It returns to the thesis with something gained.","_n":"302c1","_k":"9d566b44"},{"t":"Sentence 4 is fine.","why":"It opens a new topic, Shelley’s mother, that the thesis doesn’t need.","_n":"312f1","_k":"b85e8c17"},{"t":"Keep sentence 4 and add a source.","why":"A citation doesn’t make a drifting fact relevant.","_n":"32301","_k":"91b26595"},{"t":"Move sentence 4 to the start.","why":"Then the whole paragraph drifts.","_n":"332d1","_k":"ecdb66cf"}],"hints":["Which sentence leaves the thesis?","Biography isn’t automatically evidence.","Sentence 4."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which readout in the essay architect surprised you most (beams without foundations, the analysis ratio, or the missing transitions), and what does it tell you about how you usually write?"},{"id":"j2","q":"In your own words: what’s the difference between a topic, a claim and a thesis?"},{"id":"j3","q":"Explain to a friend how you’d turn a dropped quotation into an integrated one, using an example from your ISU novel."},{"id":"j4","q":"Which part of your ISU essay is weakest right now, and what is your next concrete step?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one sentence from your ISU novel that you’d like to build an essay around, and write a line about why it holds you.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one principle about argument or structure that you now believe. Keep it short enough to remember. Then pick a sentence from this module (Bacon, Austen, a novel quotation, or the model essay) that shows it, and write your own sentence that uses it.","placeholder":"Your principle, in one sentence of at least six words","examples":["Reading maketh a full man; conference a ready man; and writing an exact man. (Bacon, “Of Studies”)","It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife. (Austen, Pride and Prejudice)","I was benevolent and good; misery made me a fiend. (Shelley, Frankenstein)","I am no bird; and no net ensnares me. (Brontë, Jane Eyre)","So we beat on, boats against the current, borne back ceaselessly into the past. (Fitzgerald, The Great Gatsby)","Victor’s science made a body; his refusal to care made a monster. (model essay, “Made, Not Born”)"]},"artSamples":[{"p":"One argument, followed all the way: every paragraph must earn its place in the line.","m":"Victor’s science made a body; his refusal to care made a monster. (model essay)","i":"My first draft made a list; my outline made an argument."},{"p":"Quote a little, analyse a lot: three sentences of thinking for every sentence of quotation.","m":"I was benevolent and good; misery made me a fiend. (Shelley)","i":"Two words of the novel, then three sentences of mine: that’s the ratio I aim for."}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which best defines a thesis in a literary-analysis essay?","options":[{"t":"A statement of the essay’s topic","why":"A topic can’t be argued.","_n":"342e1","_k":"75beb8b1"},{"t":"A summary of the novel’s plot","why":"Plot is evidence at most.","_n":"35331","_k":"d80a00c5"},{"t":"An arguable claim about the text that indicates how the text supports it and why it matters","why":"What, how and why.","_n":"36341","_k":"08c1595a"},{"t":"A list of the devices the essay will discuss","why":"Devices serve a claim.","_n":"37311","_k":"ee64cfc1"}]},"b":{"prompt":"Which of these is a thesis?","options":[{"t":"“\u003cem>Dracula\u003c/em> uses many interesting techniques.”","why":"That’s vague.","_n":"38321","_k":"01d400a9"},{"t":"“In \u003cem>Dracula\u003c/em>, Stoker makes modern technology both the hunters’ weapon and the sign of their fear of the ancient.”","why":"It’s a claim someone could dispute.","_n":"39271","_k":"d3de1de5"},{"t":"“\u003cem>Dracula\u003c/em> is a novel about vampires.”","why":"That’s a topic.","_n":"3a281","_k":"810708c5"},{"t":"“Jonathan Harker travels to Transylvania.”","why":"That’s a fact.","_n":"3ba91","_k":"e774a71a"}]}},{"id":"k2","cat":"K","goal":5,"a":{"prompt":"Which MLA 9 in-text citation is formatted correctly for a quotation from chapter 9 of an e-text of \u003cem>The Great Gatsby\u003c/em>?","options":[{"t":"(Fitzgerald, ch. 9).","why":"Author, then the division, when there are no fixed pages.","_n":"3ca81","_k":"64083921"},{"t":"(ch. 9 Fitzgerald).","why":"The author comes first.","_n":"3da71","_k":"544d991e"},{"t":"(\u003cem>The Great Gatsby\u003c/em>, chapter nine).","why":"Use the author’s surname and the abbreviation ch.","_n":"3ea61","_k":"14b72b2a"},{"t":"[Fitzgerald 9].","why":"Use parentheses; without “ch.”, 9 reads as a page number.","_n":"3fa51","_k":"ed9791b2"}]},"b":{"prompt":"Which MLA 9 in-text citation is formatted correctly for page 97 of a print edition of \u003cem>Frankenstein\u003c/em>?","options":[{"t":"(Shelley, p. 97).","why":"MLA omits “p.” and the comma.","_n":"3ga41","_k":"c2dbd86e"},{"t":"(Mary Shelley, page 97).","why":"Surname only; no “page”.","_n":"3ha31","_k":"2bf5053e"},{"t":"(Shelley 97).","why":"Author, a space, then the page; no comma, no “p.”","_n":"3ia21","_k":"daac3315"},{"t":"(97 Shelley).","why":"The author comes first.","_n":"3jb11","_k":"01cdf43f"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"In a counterargument, the \u003cstrong>concession\u003c/strong> is…","options":[{"t":"the part where you acknowledge what is true or strong in an opposing view","why":"You grant what’s true before you answer it.","_n":"3kb01","_k":"257207c0"},{"t":"a quotation from a critic","why":"A critic may supply the objection, but conceding is your move.","_n":"3la31","_k":"e0f9e23a"},{"t":"the essay’s final paragraph","why":"Concessions can appear anywhere they’re needed.","_n":"3ma41","_k":"7d627efc"},{"t":"the part where you prove the opposing view wrong","why":"That’s the rebuttal.","_n":"3na51","_k":"40273dca"}]},"b":{"prompt":"In a counterargument, the \u003cstrong>rebuttal\u003c/strong> is…","options":[{"t":"a summary of the plot","why":"Plot summary isn’t part of a counterargument.","_n":"3oa61","_k":"d6c36720"},{"t":"a list of all possible objections","why":"Choose the strongest and answer it.","_n":"3p9f1","_k":"e82d21af"},{"t":"the part where you show why your reading still holds despite the objection","why":"You answer the objection with evidence.","_n":"3qa01","_k":"dcd3a307"},{"t":"the part where you admit the objection’s strength","why":"That’s the concession.","_n":"3ra11","_k":"33a6f882"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"A student writes about \u003cem>Heart of Darkness\u003c/em>. Which thesis is strongest?","options":[{"t":"“In \u003cem>Heart of Darkness\u003c/em>, Conrad’s layered narration, with Marlow’s tale framed by an unnamed listener, keeps the reader at a distance from Kurtz, suggesting that the ‘darkness’ is less a place than a truth the storytellers cannot face directly.”","why":"Claim, how (the frame narration), why (what the distance suggests).","_n":"3sa21","_k":"fdab4d33"},{"t":"“\u003cem>Heart of Darkness\u003c/em> is a famous novella about a journey up a river.”","why":"That’s a topic.","_n":"3tab1","_k":"a59e4b2f"},{"t":"“Kurtz’s last words are ‘The horror! The horror!’”","why":"That’s a fact; it could be evidence.","_n":"3uac1","_k":"49db7ff3"},{"t":"“In \u003cem>Heart of Darkness\u003c/em>, Conrad uses narration, imagery and symbolism.”","why":"That’s a device list.","_n":"3v9d1","_k":"b5d33717"}]},"b":{"prompt":"A student writes about \u003cem>Dracula\u003c/em>. Which thesis is strongest?","options":[{"t":"“In \u003cem>Dracula\u003c/em>, Stoker tells the story through diaries, letters and recordings, a patchwork that turns the hunters into editors of the truth and suggests that modern knowledge defeats the ancient only by being shared.”","why":"Claim, how (the patchwork of documents), why (what shared knowledge suggests).","_n":"3w9c1","_k":"2f8081de"},{"t":"“In \u003cem>Dracula\u003c/em>, Stoker uses letters, diaries and imagery.”","why":"That’s a device list.","_n":"3x9f1","_k":"b3463377"},{"t":"“Dracula sleeps in a coffin of earth.”","why":"That’s a fact; it could be evidence.","_n":"3y9e1","_k":"ceec7b4d"},{"t":"“\u003cem>Dracula\u003c/em> is a famous horror novel.”","why":"That’s a topic.","_n":"3za11","_k":"88b10d9a"}]}},{"id":"t2","cat":"T","goal":[2,5],"a":{"prompt":"An essay’s thesis argues that Gatsby’s dream survives by refusing evidence. Its topic sentences, in order: (1) the parties as performance; (2) the green light as private faith; (3) Fitzgerald’s career in Hollywood; (4) the final image of boats against the current. Which revision helps the argument most?","options":[{"t":"Keep the order; every paragraph is about Fitzgerald","why":"Being \u003cem>about\u003c/em> the author isn’t serving the thesis.","_n":"40a01","_k":"49060fe0"},{"t":"Replace (3) with a beam on how the dream reacts to evidence (e.g. Gatsby’s response when Daisy falls short)","why":"(3) drifts; the replacement builds the thesis.","_n":"41a31","_k":"7fb4c515"},{"t":"Add a fifth beam listing more symbols","why":"A device tour weakens the line.","_n":"42a21","_k":"f9702fac"},{"t":"Move (4) to the beginning","why":"That spends the clincher first.","_n":"43a51","_k":"6a887992"}]},"b":{"prompt":"An essay’s thesis argues that Jane’s passion is the source of her independence. Its topic sentences, in order: (1) the red-room protest; (2) Lowood’s lessons in restraint; (3) the history of governess work in Victorian England; (4) her leaving Thornfield as a passionate choice. Which revision helps the argument most?","options":[{"t":"Keep it; context always helps","why":"Context that doesn’t serve the thesis is drift.","_n":"44a41","_k":"f15dda40"},{"t":"Replace (3) with a beam on her refusal of St. John as passion choosing itself","why":"(3) drifts; the replacement builds the thesis.","_n":"45370","_k":"6a378428"},{"t":"Add a beam listing symbols in the novel","why":"A device tour weakens the line.","_n":"46380","_k":"5b59725b"},{"t":"Move (4) to the beginning","why":"That spends the clincher first.","_n":"47350","_k":"76b5fd87"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Claim: “Fitzgerald makes hope itself a kind of undertow.” Evidence: “So we beat on, boats against the current, borne back ceaselessly into the past” (Fitzgerald, ch. 9). Which analysis sentence serves the claim best?","options":[{"t":"“This is the last sentence of the novel.”","why":"That’s a fact, not analysis.","_n":"48360","_k":"6d5cb6cf"},{"t":"“‘Beat on’ insists on effort, but ‘borne back ceaselessly’ makes that effort the very motion that returns us to the past, so hope and loss move together.”","why":"It zooms in on words and links them to the claim.","_n":"49330","_k":"655a9e40"},{"t":"“This sentence is beautiful and sad.”","why":"That’s a response without analysis.","_n":"4a340","_k":"37d92eec"},{"t":"“Fitzgerald uses a metaphor about boats.”","why":"It names the device without its effect.","_n":"4b310","_k":"601da45e"}]},"b":{"prompt":"Claim: “Brontë makes Jane’s equality a matter of the soul, not of station.” Evidence: “Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?” (Brontë, ch. 23). Which analysis sentence serves the claim best?","options":[{"t":"“The four adjectives pile up everything the world uses to rank her, and the question turns the pile against itself: none of them touches ‘soul’ or ‘heart’.”","why":"It zooms in on words and links them to the claim.","_n":"4c320","_k":"c163b5ff"},{"t":"“Brontë uses a list.”","why":"It names the device without its effect.","_n":"4d2f0","_k":"4e0e214c"},{"t":"“This is a powerful rhetorical question.”","why":"Name its effect.","_n":"4e300","_k":"0313e9cc"},{"t":"“Jane says this to Rochester in the garden.”","why":"That’s summary, not analysis.","_n":"4f310","_k":"3a986c82"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which sentence integrates the quotation most effectively?","options":[{"t":"“The Creature says that, I was benevolent and good misery made me a fiend.”","why":"No quotation marks, and the grammar breaks.","_n":"4g300","_k":"6d4ae832"},{"t":"“‘I was benevolent and good; misery made me a fiend.’ (Shelley, ch. 10) This is important.”","why":"Dropped quotation; the period comes before the citation.","_n":"4h2f0","_k":"740a02f8"},{"t":"“The Creature’s claim that ‘misery made me a fiend’ (Shelley, ch. 10) makes his violence a product rather than a nature.”","why":"It’s embedded, fits the grammar, is cited and leads into analysis.","_n":"4i2e0","_k":"961f2e59"},{"t":"“In chapter 10 the Creature says something about misery making him a fiend (Shelley).”","why":"That’s a vague paraphrase with an incomplete citation.","_n":"4j350","_k":"26eda6b2"}]},"b":{"prompt":"Which sentence integrates the quotation most effectively?","options":[{"t":"“‘I am no bird.’ (Brontë, ch. 23) Jane is independent.”","why":"Dropped quotation; the period comes before the citation.","_n":"4k340","_k":"79ec65e2"},{"t":"“Jane says something about birds and nets (Brontë).”","why":"That’s a vague paraphrase with an incomplete citation.","_n":"4l330","_k":"36f857be"},{"t":"“Jane says I am a free human being (Brontë ch 23).”","why":"No quotation marks, and the citation needs a comma and “ch.”","_n":"4m320","_k":"71126c46"},{"t":"“Refusing Rochester’s terms, Jane declares herself ‘a free human being with an independent will’ (Brontë, ch. 23), giving the word ‘free’ the weight of a legal claim.”","why":"It’s embedded, fits the grammar, is cited and leads into analysis.","_n":"4n290","_k":"db520fae"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which is the best final sentence for an essay arguing that Gatsby’s dream survives by refusing evidence?","options":[{"t":"“Fitzgerald was one of the greatest writers of the 1920s.”","why":"That’s off-thesis praise.","_n":"4o280","_k":"61878c3d"},{"t":"“In conclusion, Gatsby’s dream survives by refusing evidence.”","why":"That’s a restatement.","_n":"4p2b0","_k":"e7741f54"},{"t":"“Fitzgerald leaves us beating on with Gatsby, asking whether every dream we cherish is kept alive by what we refuse to see.”","why":"It extends the claim to the reader’s world.","_n":"4q2c0","_k":"cf8625ab"},{"t":"“There are many other symbols in the novel that could be explored.”","why":"That opens new doors at the exit.","_n":"4r2d0","_k":"0a0b0128"}]},"b":{"prompt":"Which is the best final sentence for an essay arguing that Jane’s passion is the source of her independence?","options":[{"t":"“Many other themes appear in \u003cem>Jane Eyre\u003c/em>.”","why":"That opens new doors at the exit.","_n":"4s2e0","_k":"90f402bc"},{"t":"“Charlotte Brontë had two sisters who were also writers.”","why":"That’s off-thesis biography.","_n":"4t2f0","_k":"cae73ddc"},{"t":"“To sum up, Jane’s passion makes her independent.”","why":"That’s a restatement.","_n":"4u300","_k":"5d8fc3bc"},{"t":"“Brontë’s heroine suggests that a free self is not one without passion but one that can steer by it.”","why":"It extends the claim to what freedom means.","_n":"4v310","_k":"026e5f05"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A critic argues that Victor is simply a victim of fate. Your thesis blames his refusal to care. What’s the best way to use the critic?","options":[{"t":"Leave the critic out because they disagree","why":"Facing the strongest objection builds trust.","_n":"4w320","_k":"0e108c00"},{"t":"Name and cite the critic’s view as a concession, then rebut it with evidence of Victor’s choices","why":"That’s the critic as counterargument.","_n":"4x230","_k":"5372bbaa"},{"t":"Replace your thesis with the critic’s","why":"Use critics; don’t hide behind them.","_n":"4y240","_k":"d43187a7"},{"t":"Quote the critic as support for your thesis","why":"That misrepresents the source.","_n":"4z250","_k":"13c90af1"}]},"b":{"prompt":"A critic argues that Jane’s passion is a weakness the novel punishes. Your thesis says it’s her strength. What’s the best way to use the critic?","options":[{"t":"Ignore the critic","why":"Facing the strongest objection builds trust.","_n":"50240","_k":"ea3f983d"},{"t":"Adopt the critic’s view instead","why":"Use critics; don’t hide behind them.","_n":"51270","_k":"1598caab"},{"t":"Cite the critic as agreeing with you","why":"That’s misrepresentation.","_n":"52260","_k":"61b512bd"},{"t":"Present the critic’s view fairly as a concession, then rebut it using the ending, where passion and principle unite","why":"That’s the critic as counterargument.","_n":"53210","_k":"25e0c624"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Your reverse outline shows: paragraph 2 says “Gatsby’s parties are extravagant” and does “describes”. What’s the best revision?","options":[{"t":"Move paragraph 2 to the conclusion","why":"A conclusion should extend the argument, not hold a description.","_n":"54200","_k":"bc1afffd"},{"t":"Rewrite the topic sentence so the paragraph argues something the thesis needs (e.g. the parties as a performance meant for one viewer)","why":"“Describes” isn’t a job in an argument.","_n":"55230","_k":"88e4b440"},{"t":"Delete the thesis","why":"The thesis is the anchor.","_n":"56220","_k":"a049731d"},{"t":"Add more description of the parties","why":"More description is still not argument.","_n":"572d0","_k":"811ca2ae"}]},"b":{"prompt":"Your reverse outline shows: paragraph 3 says “Lowood is a harsh school” and does “describes”. What’s the best revision?","options":[{"t":"Add more details about Lowood","why":"More description is still not argument.","_n":"582c0","_k":"26b13262"},{"t":"Rewrite the topic sentence to argue how Lowood shapes Jane’s passion (e.g. Helen Burns models restraint that Jane both admires and resists)","why":"“Describes” isn’t a job in an argument.","_n":"599f0","_k":"9e7783e0"},{"t":"Move paragraph 3 to the conclusion","why":"A conclusion should extend the argument, not hold a description.","_n":"5aa00","_k":"98d20ed5"},{"t":"Delete the thesis","why":"The thesis is the anchor.","_n":"5b9d0","_k":"8705f5da"}]}}]},"task":{"title":"Performance task: Blueprint and one true paragraph","summary":"Blueprint and one true paragraph","statement":"\u003cp>Build the blueprint of your ISU essay, and write one body paragraph you’d be proud to hand in. The checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cp class='tiny muted'>Everything you type stays on this device. Structure checks can pass weak prose: they only make sure the parts are there.\u003c/p>\u003cdetails class='alg se-rubric'>\u003csummary>How your teacher reads the writing (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge and Understanding\u003c/td>\u003ctd>Retells the novel; terms misused\u003c/td>\u003ctd>Some understanding; analysis is thin\u003c/td>\u003ctd>Clear understanding of the novel and of essay form\u003c/td>\u003ctd>Thorough, nuanced understanding of the novel and of form\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking\u003c/td>\u003ctd>Claim absent or factual; evidence random\u003c/td>\u003ctd>Claim present but loosely supported\u003c/td>\u003ctd>Arguable claim; relevant evidence, analysed\u003c/td>\u003ctd>Insightful claim; evidence analysed closely, with counterargument handled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication\u003c/td>\u003ctd>Unclear organization; quotations dropped; citations missing\u003c/td>\u003ctd>Some organization; frequent integration or citation errors\u003c/td>\u003ctd>Logical organization; integrated quotations; mostly correct MLA\u003c/td>\u003ctd>Coherent, purposeful line; elegant integration; precise MLA and style\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application\u003c/td>\u003ctd>No connection beyond the passage\u003c/td>\u003ctd>A simple connection\u003c/td>\u003ctd>Connects the evidence to the thesis and the novel’s larger concerns\u003c/td>\u003ctd>Extends the argument to wider significance with originality\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Thesis names your novel and its author","Thesis is focused","Thesis shows what, how and why","Outline has 3–4 beams on the thesis","You’ve faced an objection","Paragraph is sustained","Evidence is quoted and cited","You analyse, not just quote","Paragraph matches a beam","Craft statement written"],"tips":["Name the novel and author in the thesis; readers need the anchor.","Tighten to one or two sentences. A thesis is a promise, not the whole essay.","Highlight your claim, then your “by…” (how), then your stake (why). If you can’t find one, add it.","Each beam should carry a word from your thesis. That’s how readers feel the line.","Start with “Some readers argue…” or “Admittedly…”, then answer it.","Aim for 180–260 words: enough to quote, analyse and link back.","Put the exact words in quotation marks, then cite them: (Surname page) or (Surname, ch. #).","After each quotation, explain how specific words prove your claim. Use a precise verb: suggests, undercuts, reframes…","Open the paragraph with the topic sentence from your outline, or update the outline to match.","Tell your teacher which choices you made and why."],"explainPrompt":"Craft statement: Which choice in your blueprint or paragraph are you proudest of: a word, a quotation, an order? Why? What would you revise next?","explainLabel":"Craft statement","vocab":"Use thesis, beam (topic sentence), evidence, analysis and counterargument.","checkLabel":"Check my blueprint","success":"All ten parts are there. Now let your teacher read the writing.","thesisWords":[25,70],"paraWords":[180,260],"ratio":1.5,"beamMin":8,"counterMin":10,"craftMin":40,"shared":3,"concede":["although","while","some readers","it could be argued","admittedly","granted","critics","one might"],"verbStems":["suggest","impl","undercut","juxtapos","foreshadow","refram","intensif","complicat"],"tagRoles":[{"id":"claim","t":"Claim","role":"syntax"},{"id":"how","t":"How","role":"figure"},{"id":"why","t":"Why","role":"theme"}],"guide":"\u003cp class='tiny'>\u003cstrong>E6 slot guidance:\u003c/strong> \u003cspan class='se-pp se-pp-claim'>Claim\u003c/span> your topic sentence, the beam from your outline · \u003cspan class='se-pp se-pp-evidence'>Evidence\u003c/span> a signal phrase, the quotation fitted to your grammar, the citation · \u003cspan class='se-pp se-pp-analysis'>Analysis\u003c/span> zoom in on words and say what they do · \u003cspan class='se-pp se-pp-link'>Link\u003c/span> return to the thesis with something gained.\u003c/p>","modelsLabel":"Other ways to build it (three models; each passes every line)","models":[{"title":"Model 1: claim-led (\u003cem>Frankenstein\u003c/em>)","novel":"Frankenstein","author":"Mary Shelley","thesis":"In Frankenstein, Mary Shelley shows that monstrousness is a verdict others pass on the Creature, not a fact of his body, by staging each rejection as a judgment of appearance and making his eloquence the proof of his humanity; the novel asks what we owe to whatever we make.","tags":{"claim":"monstrousness is a verdict others pass on the Creature, not a fact of his body","how":"by staging each rejection as a judgment of appearance and making his eloquence the proof of his humanity","why":"the novel asks what we owe to whatever we make"},"beams":["The Creature first speaks as a reader, and his eloquence becomes the proof of his humanity.","Each rejection the Creature suffers is staged as a judgment of his appearance, never of his actions.","When the Creature declares that misery made him a fiend, he names the cause behind his monstrousness.","Victor’s final pursuit shows that refusing care turns a maker into a hunter, completing the verdict."],"counter":"Some readers argue the murders cancel his claim to sympathy, but each one follows an act of abandonment.","concl":"Shelley’s warning reaches past science: the duty of care begins at the moment of making.","para":"When the Creature declares that misery made him a fiend, he names the cause behind his monstrousness. Facing Victor on the glacier, he insists, “I was benevolent and good; misery made me a fiend” (Shelley, ch. 10). The sentence turns on its semicolon: before it stands a past of goodness, after it a present shaped by suffering, so the punctuation itself enacts the verdict the novel examines. The verb made reframes the Creature as a second creation. Misery finishes the work that Victor abandoned, which implies that a maker’s neglect is its own kind of authorship. Later, after Victor tears apart the half-made companion, the Creature warns him, “Beware; for I am fearless, and therefore powerful” (Shelley, ch. 20). Here the arc completes itself. Goodness has hardened into fearlessness, and fearlessness into power, while the connective therefore suggests that the Creature has learned to reason like the people who rejected him: whatever cannot be loved must be feared. Shelley never excuses the violence that follows, but she complicates any reading that treats it as a fact of his body. His monstrousness is a verdict that rejection writes and the Creature finally signs, which is why the novel’s hardest question falls not on the Creature but on the man who refused to care for him.","craft":"I’m proudest of reading the semicolon as a hinge, because one punctuation mark carries the whole argument about cause and effect. I put the “fearless” quotation second so the paragraph moves from goodness to power, the same arc as the essay. Next I would trim my last sentence, which tries to do too much at once."},{"title":"Model 2: image-led (\u003cem>The Great Gatsby\u003c/em>)","novel":"The Great Gatsby","author":"F. Scott Fitzgerald","thesis":"In The Great Gatsby, Fitzgerald presents Gatsby’s dream as a faith that survives by refusing evidence, using recurring images of light and distance to suggest that longing, not possession, keeps a dream alive.","tags":{"claim":"presents Gatsby’s dream as a faith that survives by refusing evidence","how":"using recurring images of light and distance","why":"to suggest that longing, not possession, keeps a dream alive"},"beams":["Gatsby’s parties are a public light, a performance staged for one absent viewer across the bay.","The green light turns that public performance into a private faith that needs only distance to survive.","When Daisy falls short of the dream, Gatsby refuses the evidence rather than the dream itself.","The final image of boats against the current makes longing the engine that keeps the dream alive."],"counter":"Some readers argue that Gatsby’s death proves the dream simply fails, yet Nick’s narration keeps that longing alive.","concl":"Fitzgerald leaves us beating on with Gatsby, asking whether every dream we cherish is kept alive by what we refuse to see.","para":"When Daisy falls short of the dream, Gatsby refuses the evidence rather than the dream itself. Told by Nick that the past cannot be repeated, he cries out, “Why of course you can!” (Fitzgerald, ch. 6). The exclamation undercuts the very warning it answers: Nick offers a fact, and Gatsby treats it as a challenge to his faith. The phrase of course is the key, because it turns an impossible wish into common sense, as if only a fool would doubt it. His certainty is strongest at the moment the evidence is weakest, which suggests that the dream feeds on contradiction rather than collapsing under it. Fitzgerald returns to that motion in the novel’s last line: “So we beat on, boats against the current, borne back ceaselessly into the past” (Fitzgerald, ch. 9). The verb beat on insists on effort, yet borne back reframes that effort as the very current that returns us to where we started. Hope and loss move together. The image also widens the claim from Gatsby to us, since Nick’s we includes every reader who has kept a wish alive by refusing to look at it squarely. Gatsby endures because he will not let the evidence in, and that refusal is the faith the novel both admires and mourns.","craft":"I chose to pair Gatsby’s exclamation with the last line because together they show the dream refusing evidence and then outliving him. I’m proudest of noticing “of course”, which makes a wish sound like common sense. Next I would cut one sentence of explanation so the analysis stays tight."},{"title":"Model 3: tension-led (\u003cem>Jane Eyre\u003c/em>)","novel":"Jane Eyre","author":"Charlotte Brontë","thesis":"In Jane Eyre, Brontë sets passion against principle only to reconcile them, using Jane’s direct addresses to Rochester and to the reader to suggest that a free self steers by feeling rather than suppressing it.","tags":{"claim":"sets passion against principle only to reconcile them","how":"using Jane’s direct addresses to Rochester and to the reader","why":"to suggest that a free self steers by feeling rather than suppressing it"},"beams":["The red-room protest shows a child whose passion is already a protest against injustice.","At Lowood, Helen Burns models a principle of restraint that Jane admires but cannot share.","In the garden, Jane’s direct address to Rochester turns passion into a claim of equal selfhood.","Leaving Thornfield is itself a passionate choice, in which principle and feeling finally steer together."],"counter":"Admittedly, her departure looks like passion defeated by principle, yet she leaves as fiercely as she loved.","concl":"Brontë’s heroine suggests that a free self is not one without passion but one that can steer by it.","para":"In the garden, Jane’s direct address to Rochester turns passion into a claim of equal selfhood. Believing that he means to marry another woman, she demands, “Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?” (Brontë, ch. 23). The four adjectives pile up everything the world uses to rank her, and the question turns that pile against itself, since none of them touches soul or heart. Her anger does not break her dignity; it intensifies it, because the passion is aimed at a principle of equal worth. Moments later she refuses to be held: “I am no bird; and no net ensnares me” (Brontë, ch. 23). The bird image reframes captivity as something offered rather than imposed, and her repeated negatives suggest that freedom begins with the power to refuse. Brontë lets passion speak in the language of principle, so the two forces the novel seems to set against each other arrive here as allies. This is the hinge of the argument. A heroine who could only suppress her feeling would have no grounds for this claim, and a heroine who could only feel would have no claim to make. Jane’s passion steers precisely because it has learned what it is for.","craft":"I organized the paragraph around one scene so the two quotations could build on each other: first the question, then the refusal. I’m proudest of the sentence about the four adjectives, because it zooms in on Brontë’s exact words. Next I would sharpen my link sentence so it names the thesis more directly."}]},"cards":[["Thesis","An arguable claim + how + why. “In \u003cem>Frankenstein\u003c/em>, Shelley shows monstrousness is a verdict, not a fact…”"],["Topic vs thesis","Topic: “\u003cem>Gatsby\u003c/em> and the American Dream.” Thesis: what you claim about it, and how and why."],["Beam (topic sentence)","The first sentence of a body paragraph; it advances the thesis and carries its key terms."],["Integrated quotation","Signal phrase + fitted quotation + citation: Jane declares herself “a free human being with an independent will” (Brontë, ch. 23)."],["Dropped quotation","A quotation standing alone with no speaker, moment or link. Avoid."],["Analysis","How specific words make meaning, and why that proves your claim: “‘borne back ceaselessly’ makes effort an undertow.”"],["Link","The paragraph’s last move back to the thesis, with something gained."],["Counterargument","Concede the strongest objection, then rebut it with evidence."],["Coherence","Key terms and transitions that make paragraphs one line of thought."],["Reverse outline","For each paragraph: what it says (claim) and what it does (job). Finds drift."],["“So what?” conclusion","Extends the argument’s significance: “every dream we cherish…” (not a restatement)."],["MLA for e-texts","(Surname, ch. #) when there are no fixed pages; (Surname page) for print."]]}};</script>
