.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--an-sound:#A84C05;--an-image:#0E7C7B;--an-figure:#7A3DB8;--an-syntax:#2343C4;--an-diction:#6B5A1E;--an-theme:#B0286F;
--an-sound-soft:rgba(168,76,5,.13);--an-image-soft:rgba(14,124,123,.13);--an-figure-soft:rgba(122,61,184,.12);--an-syntax-soft:rgba(35,67,196,.11);
--an-diction-soft:rgba(107,90,30,.14);--an-theme-soft:rgba(176,40,111,.11);
--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}
:root[data-theme="dark"]{--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
.an-sound{--an-c:var(--an-sound);--an-c-soft:var(--an-sound-soft)}.an-image{--an-c:var(--an-image);--an-c-soft:var(--an-image-soft)}
.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}
.an-tag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);font-style:normal;letter-spacing:.01em;color:var(--an-c,var(--ink-2));background:var(--sheet);
border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}
.an-chip{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--an-c,var(--rule));background:var(--sheet);color:var(--ink);border-radius:999px;
padding:.25em .8em;font-size:.92rem;min-height:34px}
.an-chip[aria-pressed="true"]{background:var(--an-c-soft);font-weight:700}
.an-chip[aria-pressed="true"]::after{content:"on";font-size:.72rem;font-weight:700;color:var(--an-c)}
.an-dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--an-c,var(--ink-2));flex:0 0 auto}
.an-note{border-left:4px solid var(--an-c,var(--rule));background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;margin:0 0 6px;font-size:.92rem;max-width:none}
.eng-margin{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.eng-margin > *{min-width:0}
@media (max-width:820px){ .eng-margin{grid-template-columns:minmax(0,1fr)} }
@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}
ol.eng-poem li{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline}
ol.eng-poem li.eng-gap{height:.6em}
.eng-ln{font:400 .75rem var(--font-ui);color:var(--ink-2);text-align:right;padding-right:.9em;user-select:none}
.eng-prose p{font:400 1.08rem/1.65 var(--font-math);max-width:70ch}
.eng-prose .eng-ln{display:inline-block;min-width:3.2em;padding-right:.6em;text-align:left}
.eng-cite{font-size:.85rem;color:var(--ink-2);margin:4px 0 0}
.eng-toks{display:grid;gap:6px}
.eng-tl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.eng-tok{border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:.08em .28em;min-height:34px;min-width:24px;
font:400 1.22rem/1.3 var(--font-math)}
.eng-tok:not(:disabled):hover{border-color:var(--rule)}
.eng-tok.an{background:var(--an-c-soft)}
.eng-tok[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.eng-tok.eng-br{font:700 .9rem var(--font-ui);color:var(--ink-2);border:1.5px dashed var(--rule)}
.eng-tok.speaking,.eng-w.speaking{outline:2px solid var(--ink);outline-offset:1px;border-radius:4px}
.eng-w{transition:opacity .25s,color .25s}
.sc-syl{position:relative;display:inline-block;padding-top:.7em}
.sc-syl::before{position:absolute;left:0;right:0;top:0;text-align:center;font:700 .85em/1 var(--font-ui)}
.sc-stress{color:var(--sc-stress);font-weight:600}.sc-stress::before{content:"´"}
.sc-slack{color:var(--sc-slack)}.sc-slack::before{content:"˘"}
/* ENG4U 19: hero ladder → blueprint, Essay architect (six modes, blueprint, readouts, reader energy, skeptic gauge), the argument
   line (Part 3 stations), Blueprint and one true paragraph task. Colour tokens only; prefix se-. */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* hero */
.se-hero{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:14px 16px 12px}
.se-hs{font:400 clamp(1.1rem,2vw,1.4rem)/1.55 var(--font-math);margin:0 0 6px;max-width:none}
.se-cl{transition:margin .8s}
.se-hero.se-ladder .se-cl{display:block}
.se-hero.se-ladder .se-cl[data-cl="1"]{margin-left:1.4em}
.se-hero.se-ladder .se-cl[data-cl="2"]{margin-left:2.8em}
.se-hw{opacity:0;transition:opacity .3s,background-color .35s,box-shadow .35s;border-radius:3px}
.se-hw.in,.se-hero.se-done .se-hw{opacity:1}
.se-gl.lit{background:var(--an-syntax-soft);box-shadow:inset 0 -2.5px 0 var(--an-syntax);font-weight:700}
.se-hw.speaking{background:var(--hi-soft)}
.se-hbp{display:block;width:100%;max-width:340px;margin:6px auto 0;opacity:0;transform:translateY(14px);transition:opacity .8s,transform .8s}
.se-hero.se-bp .se-hbp{opacity:1;transform:none}
.se-hroof{fill:var(--an-syntax-soft);stroke:var(--ink);stroke-width:2}
.se-hbeam{fill:var(--sheet);stroke:var(--ink);stroke-width:2;transform-box:fill-box;transform-origin:bottom;transform:scaleY(.1);transition:transform .7s calc(var(--i) * .18s + .5s)}
.se-hero.se-bp .se-hbeam,.se-hero.se-done .se-hbeam{transform:none}
.se-hbase{fill:var(--an-image-soft);stroke:var(--an-image);stroke-width:1.5}
.se-hx{font:700 15px var(--font-math);fill:var(--an-syntax);transform:translateY(-60px);opacity:0;transition:transform .9s,opacity .5s}
.se-hero.se-bp .se-hx{transform:none;opacity:1;animation:se-xfade 2.2s .9s forwards}
.se-hrl{font:700 13px var(--font-ui);fill:var(--ink);opacity:0;transition:opacity .6s 1.6s}
.se-hero.se-bp .se-hrl{opacity:1}
.se-hero.se-done .se-hx{opacity:0;animation:none}
@keyframes se-xfade{to{opacity:0}}
.se-hlab{font:600 10.5px var(--font-ui);fill:var(--ink-2)}
.se-hbl{fill:var(--ink)}
.se-hcap{font-style:italic;margin:8px 0 0;opacity:0;transition:opacity .9s;max-width:none}
.se-hero.se-done .se-hcap{opacity:1}
.se-hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}

/* Explore layout */
.se-top{margin:0 0 6px}
.se-modes .rg-wrap{flex-wrap:nowrap;max-width:100%}
.se-modes .rg.seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.se-modes .rg.seg button{white-space:nowrap;flex:0 0 auto}
.se-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"main bp" "main read";gap:12px 26px;align-items:start;margin-top:8px}
.se-main{grid-area:main;min-width:0}
.se-bpbox{grid-area:bp;min-width:0}
.se-readbox{grid-area:read;min-width:0;border-left:1.5px solid var(--rule);padding-left:16px}
.se-bpbox{border-left:1.5px solid var(--rule);padding-left:16px}
.se-read-h{font-weight:700;margin:0 0 6px}
.se-aha{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px;font-size:.92rem;max-width:none}
.se-termadd{margin:8px 0 0}
.se-taddrow{display:flex;gap:6px;align-items:center}
.se-taddrow .txtin{flex:1 1 auto;min-width:0}
.se-len{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.se-num{width:5.2em}
.se-short{width:9em}
.se-terms{display:flex;flex-wrap:wrap;gap:4px}
.se-term{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--an-syntax);background:var(--an-syntax-soft);border-radius:999px;padding:0 .2em 0 .55em;font-size:.84rem}
.se-trm{border:0;background:none;color:var(--ink);font-size:1rem;line-height:1;min-width:26px;min-height:26px;padding:0}
.se-st{font-weight:700;border-radius:4px;padding:0 .3em}
.se-st.good{background:var(--good-bg)}
.se-st.bad{background:var(--bad-bg)}
.se-st.mid{background:var(--info-bg)}
.se-flag{color:var(--red);font-weight:600}
.se-okline{color:var(--green);font-weight:600}
.se-fit{margin:4px 0 0}
.se-h4{margin:14px 0 6px;font-size:1rem}
.se-h3{margin:22px 0 6px}
.se-check{display:inline-flex;align-items:center;gap:6px;font-size:.92rem;min-height:34px}
.se-lab{font-weight:700;display:block;margin:0 0 4px}

/* blueprint */
.se-bpsvg{display:block;width:100%;max-width:380px;margin:0 auto}
.se-bproof{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.se-bproof.good{fill:var(--an-syntax-soft)}
.se-bprt{font:700 12px var(--font-ui);fill:var(--ink)}
.se-bpb{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.se-bpb.empty{stroke:var(--ink-2);stroke-dasharray:4 3;fill:var(--paper)}
.se-bpb.counter{fill:var(--an-theme-soft)}
.se-bpf{fill:var(--an-image-soft);stroke:var(--an-image);stroke-width:1.2}
.se-bpm{font:600 9px var(--font-ui);fill:var(--ink-2)}
.se-bpl{font:700 11px var(--font-ui);fill:var(--ink)}
.se-bpg{stroke:var(--ink-2);stroke-width:1.5}
.se-bpcol{transform-box:view-box}
.se-bpcol.se-rise{animation:se-rise .7s both;animation-delay:calc(var(--i,0) * 110ms)}
@keyframes se-rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.se-weak .se-bpcol{transform:translateX(var(--dx,0));animation:se-wob 1.2s ease-in-out infinite alternate;animation-delay:calc(var(--i,0) * 150ms)}
.se-weak .se-bpcol.se-rise{animation:se-rise .7s both,se-wob 1.2s ease-in-out .8s infinite alternate}
@keyframes se-wob{from{transform:translateX(var(--dx,0)) rotate(-2.5deg)}to{transform:translateX(calc(var(--dx,0) * 1.8)) rotate(2.5deg)}}
.se-bpkey{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:center;margin:4px 0 0}
.se-bpkey span{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:2px}
.se-k1{border:2px solid var(--ink);background:var(--sheet)}
.se-k2{border:2px dashed var(--ink-2);background:var(--paper)}
.se-k3{border:1.5px solid var(--an-image);background:var(--an-image-soft)}
.se-bpcap{min-height:1.2em;margin:4px 0 0;font-size:.88rem}

/* forge */
.se-row{margin:0 0 10px}
.se-rl{display:block;font-weight:700;font-size:.9rem;color:var(--ink-2);margin:0 0 4px}
.se-chips{display:flex;flex-wrap:wrap;gap:6px}
.se-chip{text-align:left;line-height:1.3;color:var(--ink)}
.se-out{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px 12px;margin:10px 0}
.se-thesis{font:400 1.02rem/1.55 var(--font-math);margin:0 0 4px;max-width:none}

/* outline */
.se-cards{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.se-card{border:1.5px solid var(--rule);border-left:5px solid var(--ink);border-radius:8px;background:var(--sheet);padding:8px 10px}
.se-card.counter{border-left-color:var(--an-theme)}
.se-card.off{opacity:.6;border-style:dashed}
.se-slide .se-card{animation:se-slide .6s both;animation-delay:calc(var(--n,0) * 0ms)}
.se-slide .se-card:first-child{animation:se-up .7s both}
@keyframes se-up{from{transform:translateY(120px);opacity:.3}to{transform:none;opacity:1}}
@keyframes se-slide{from{transform:translateY(-12px)}to{transform:none}}
.se-ct{margin:0 0 6px;max-width:none;line-height:1.45}
.se-cn{display:inline-flex;align-items:center;justify-content:center;min-width:1.6em;height:1.6em;border-radius:50%;background:var(--ink);color:var(--sheet);font:700 .8rem var(--font-ui);margin-right:6px}
.se-evb{font-size:.78rem;border:1.5px solid var(--an-image);border-radius:999px;padding:0 .45em;white-space:nowrap}
.se-evb.none{border-style:dashed;border-color:var(--ink-2);color:var(--ink-2)}
.se-cbtns{display:flex;flex-wrap:wrap;gap:6px}
.se-edta{width:100%;font:inherit;border:1.5px solid var(--rule);border-radius:6px;padding:6px;background:var(--paper);color:var(--ink)}
.se-oacts{flex-wrap:wrap;align-items:center}
.se-cline{margin:8px 0;font-size:.92rem;max-width:none}
.se-energy{margin:10px 0 0}
.se-eh{margin:0 0 2px;max-width:none}
.se-esvg{display:block;width:100%;max-width:420px}
.se-eax{stroke:var(--rule);stroke-width:1.5}
.se-eline{fill:none;stroke:var(--an-syntax);stroke-width:2.5;stroke-linejoin:round}
.se-eline.se-draw{stroke-dasharray:700;stroke-dashoffset:700;animation:se-draw 1.2s forwards}
@keyframes se-draw{to{stroke-dashoffset:0}}
.se-edot{fill:var(--an-syntax)}
.se-elab{font:600 9px var(--font-ui);fill:var(--ink-2)}
.se-skep{margin:10px 0 0}
.se-gauge{display:flex;align-items:center;gap:8px;max-width:420px}
.se-gtrack{position:relative;flex:1 1 auto;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--bad-bg),var(--good-bg));border:1.5px solid var(--rule)}
.se-gneedle{position:absolute;top:-6px;width:4px;height:22px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .9s ease}

/* evidence bank */
.se-ev{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.se-ev li{border:1.5px solid var(--rule);border-left:5px solid var(--an-image);border-radius:8px;padding:6px 10px;background:var(--sheet)}
.se-evq{font:400 1rem/1.45 var(--font-math);margin:0 0 4px;max-width:none}
.se-cite{font-family:var(--font-ui);font-size:.88rem;color:var(--ink-2);white-space:nowrap}
.se-evrow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.9rem}
.se-evrow select{max-width:100%}
.se-evadd{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px}
.se-evadd textarea{width:100%}

/* paragraph */
.se-slot{border-left:5px solid var(--ink);padding:2px 0 2px 10px;margin:0 0 10px}
.se-slot textarea{width:100%;font:inherit}
.se-slot.se-pp-claim{border-left-color:var(--pp-claim)}
.se-slot.se-pp-evidence{border-left-color:var(--pp-evidence)}
.se-slot.se-pp-analysis{border-left-color:var(--pp-analysis)}
.se-slot.se-pp-link{border-left-color:var(--pp-link)}
.se-pp{display:inline-block;font:700 .8rem var(--font-ui);border-radius:4px;padding:0 .4em;border:1.5px solid currentColor}
span.se-pp-claim{color:var(--pp-claim);background:var(--an-syntax-soft)}
span.se-pp-evidence{color:var(--pp-evidence);background:var(--an-image-soft)}
span.se-pp-analysis{color:var(--pp-analysis);background:var(--an-figure-soft)}
span.se-pp-link{color:var(--ink);background:var(--paper)}
.se-pp-claim,.se-pp-evidence,.se-pp-analysis,.se-pp-link{color:inherit}
.se-vb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;max-width:none}
.se-tc3{border:1.5px dashed var(--rule);border-radius:8px;padding:6px 12px 10px;margin-top:12px}
.se-tcl{margin:0 0 6px;max-width:none}
.se-tchips{display:flex;flex-direction:column;gap:6px}
.se-ach{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;line-height:1.4;min-height:44px}
.se-ach[aria-pressed="true"]{border-color:var(--hi);background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi)}

/* coherence */
.se-chain{list-style:none;margin:8px 0 0;padding:0}
.se-link{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px 10px}
.se-lt{margin:0 0 6px;max-width:none;line-height:1.5}
.se-kt{background:var(--an-syntax-soft);box-shadow:inset 0 -2px 0 var(--an-syntax);color:inherit;border-radius:2px;padding:0 .05em}
.se-tr{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--an-theme)}
.se-arrow{text-align:center;font:700 1.1rem var(--font-ui);color:var(--ink);line-height:1.6}
.se-arrow.broken{color:var(--red)}
.se-arrow.broken span{display:inline-block;transform:rotate(14deg)}
.se-sd{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.9rem}
.se-sd label{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.se-sd .txtin{min-width:12em}

/* Part 3 */
.se-pane{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 14px;margin:6px 0}
.se-pane p{font:400 1.02rem/1.65 var(--font-math);max-width:none}
.se-pane .se-plabel{font:700 .9rem var(--font-ui);color:var(--ink-2);margin:0 0 4px}
.se-whole p,.se-p3 details p{font-family:var(--font-math);line-height:1.6}
.se-ts{font:400 1rem/1.5 var(--font-math);margin:0 0 6px;max-width:none}
.se-dlab{font:700 .86rem var(--font-ui);color:var(--ink-2);margin:8px 0 4px}
.se-dlist{list-style:none;margin:0;padding:0}
.se-model{display:block;margin-top:4px;font-family:var(--font-math)}
.se-beams{margin:6px 0 8px;padding-left:1.4em}
.se-beams li{font:400 1rem/1.5 var(--font-math);margin:0 0 6px;border-radius:4px;padding:0 .2em}
.se-beams li.speaking{background:var(--hi-soft)}
.se-otbl td{vertical-align:top}
.se-craft{font-size:1rem;max-width:none}
.se-stchk{margin-top:8px}

/* task */
.se-tk2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.se-tagbox{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 12px}
.se-tagbox .q-actions{flex-wrap:wrap}
.se-tkout{border:1.5px solid var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 12px}
.se-dw-ta{width:100%;font:inherit}
.se-dw-cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:1.5px solid var(--rule);border-radius:8px;padding:8px;margin-top:6px}
.se-dw-cmp del{color:var(--red)}
.se-dw-cmp ins{color:var(--green)}
.se-pvb{padding-left:1.4em;font-size:.9rem}
.se-pvb li.no{color:var(--ink-2)}
.se-model-r{border-top:1.5px solid var(--rule);padding-top:8px;margin-top:8px}
.se-model-r p,.se-model-r li{font-size:.92rem;max-width:none}
.se-rubric{margin-top:8px}

@media (max-width:820px){
  .se-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"bp" "main" "read"}
  .se-bpbox,.se-readbox{border-left:0;padding-left:0}
  .se-bpsvg{max-width:250px}
  .se-readbox{border-top:1.5px solid var(--rule);padding-top:10px}
}
@media (max-width:520px){
  .se-tk2,.se-dw-cmp{grid-template-columns:1fr}
  .se-bpsvg{max-width:200px}
  .se-bpkey{font-size:.75rem}
}
@media (prefers-reduced-motion:reduce){
  .se-bpcol,.se-weak .se-bpcol,.se-eline.se-draw,.se-slide .se-card,.se-hx{animation:none!important}
  .se-eline.se-draw{stroke-dashoffset:0}
  .se-gneedle,.se-hbeam,.se-hbp,.se-hw,.se-cl,.se-hcap{transition:none}
}

group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"b2e48130","content":{"id":"19-sustained-essay","kind":"topic","title":"The sustained literary-analysis essay","topic":"The Sustained Literary-Analysis Essay","readyTopic":"the sustained essay","hero":{"headline":"Writing makes you exact","text":"Reading fills you with ideas, and talking makes you quick. But writing, Bacon says, makes you \u003cstrong>exact\u003c/strong>: it forces you to decide what you actually think and to prove it. A \u003cstrong>sustained essay\u003c/strong> is one \u003cstrong>argument\u003c/strong> followed all the way: a \u003cstrong>thesis\u003c/strong> you can defend, \u003cstrong>evidence\u003c/strong> you choose, and \u003cstrong>analysis\u003c/strong> that shows how the words do their work.","fig":{"html":"\u003cdiv class='se-hero' id='se-hero' role='group' aria-label='Bacon’s sentence, Reading maketh a full man; conference a ready man; and writing an exact man, forms a ladder; the word exact becomes a blueprint with a thesis roof, three beams and an evidence foundation'>\u003c/div>","caption":""},"clauses":["Reading maketh a full man;","conference a ready man;","and writing an exact man."],"glow":["full","ready","exact"],"bp":{"roof":"thesis","beams":"topic sentences","base":"evidence"},"caption":"This module: from thesis to blueprint to one true paragraph.","cite":"Francis Bacon, “Of Studies” (1625)","listen":"Listen","watch":"Watch again","noVoice":"Read the sentence aloud yourself."},"goals":["I can write a thesis that makes an arguable claim about a novel and says how and why.","I can plan an essay whose topic sentences, read in order, form one argument.","I can build a body paragraph that integrates evidence and analyses it closely, word by word.","I can strengthen an argument with a counterargument (concede, then rebut).","I can test and improve coherence with key terms, transitions and a reverse outline.","I can write a conclusion that answers “so what?” and extends the argument rather than repeating it."],"start":{"blocks":[{"title":"Word story: essay, thesis","html":"\u003cp>\u003cstrong>\u003cem>Essay\u003c/em>\u003c/strong> comes from the French \u003cem>essai\u003c/em>, “an attempt, a trial”. In 1580, Michel de Montaigne called his book of explorations \u003cem>Essais\u003c/em>: tries at thinking something through.\u003c/p>\u003cp>The word goes back to the Latin \u003cem>exagium\u003c/em>, “a weighing”. An essay \u003cem>weighs\u003c/em> an idea.\u003c/p>\u003cp>\u003cstrong>\u003cem>Thesis\u003c/em>\u003c/strong> is Greek for “a placing”: the position you set down and agree to defend.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Thesis vs topic","goal":1,"prompt":"Which of these is a thesis, not a topic or a fact?","options":[{"t":"“\u003cem>Jane Eyre\u003c/em> is about a young woman’s life.”","why":"That names a subject; nobody could disagree.","_n":"0023","_k":"691d39b3"},{"t":"“Jane works as a governess at Thornfield.”","why":"That’s plot. It can’t be argued.","_n":"1033","_k":"72a9c8cb"},{"t":"“\u003cem>Jane Eyre\u003c/em> explores many interesting themes.”","why":"Which themes? Interesting how? A claim needs content.","_n":"2043","_k":"336e443f"},{"t":"“In \u003cem>Jane Eyre\u003c/em>, Brontë presents Jane’s passion not as a flaw to be tamed but as the source of her moral independence.”","why":"It makes a claim a reader could dispute.","_n":"3fd3","_k":"ad658d8f"}],"hints":["Could a thoughtful reader disagree?","Cross out the ones that are only topics or facts.","Only the sentence about Jane’s passion as the source of her moral independence takes a position someone could argue against."]},{"id":"w2","skill":"Thesis vs topic","goal":1,"prompt":"A thesis says what, how and why. Which part is missing from “In \u003cem>Frankenstein\u003c/em>, Shelley shows that Victor is responsible for the Creature’s crimes”?","options":[{"t":"The author’s name","why":"Shelley is named.","_n":"4fe3","_k":"9d54b9e2"},{"t":"Nothing; it’s complete","why":"Add how: for example, “by framing each crime as an answer to abandonment”.","_n":"5ff3","_k":"95f6a628"},{"t":"What: the claim","why":"The claim is there: Victor is responsible.","_n":"6003","_k":"640d457f"},{"t":"How: the techniques or patterns that show it","why":"It has a claim (what) and a stake (responsibility), but not the evidence path.","_n":"7093","_k":"f90231fc"}],"hints":["Find the claim.","Is there any “by” or “through”?","The how is missing."]},{"id":"w3","skill":"Quotation integration","goal":3,"prompt":"Which integrates the quotation best?","options":[{"t":"Gatsby says that why of course you can (Fitzgerald, ch. 6).","why":"The quotation marks are missing, and the grammar breaks.","_n":"80a3","_k":"7e47fc7c"},{"t":"Gatsby insists, “Why of course you can!” when Nick warns that the past can’t be repeated (Fitzgerald, ch. 6).","why":"There’s a signal phrase, the speaker, the moment and a citation.","_n":"9d0d","_k":"44203b82"},{"t":"Gatsby insists “Why of course you can!” (ch. 6, Fitzgerald).","why":"MLA order is (Author, ch. #), and a comma is needed after “insists”.","_n":"acfd","_k":"e9ae1556"},{"t":"“Why of course you can!” (Fitzgerald, ch. 6). Gatsby believes in the past.","why":"It arrives without context, so the reader doesn’t know who is speaking or why.","_n":"bced","_k":"9b465bca"}],"hints":["Who is speaking, and when?","Signal phrase, then the quotation, then the citation.","The sentence that begins “Gatsby insists,” names the moment Nick warns him and ends (Fitzgerald, ch. 6)."]},{"id":"w4","skill":"Quotation integration","goal":3,"prompt":"Where does the parenthetical citation go when a quotation ends a sentence?","options":[{"t":"After the period","why":"Then the citation belongs to no sentence.","_n":"ccdd","_k":"90a7a85a"},{"t":"Before the closing quotation mark","why":"The quotation must close first.","_n":"dccd","_k":"d3605b6e"},{"t":"At the end of the paragraph only","why":"Each quotation needs its own citation.","_n":"ecbd","_k":"c9827fb6"},{"t":"After the closing quotation mark, before the period: …you can!” (Fitzgerald, ch. 6).","why":"MLA 9: the citation sits inside the sentence.","_n":"fcad","_k":"35b66395"}],"hints":["The citation belongs to the sentence.","Quotation, citation, then the period.","After the closing quotation mark, before the period."]},{"id":"w5","skill":"Analysis vs summary","goal":3,"prompt":"Which sentence is analysis rather than summary?","options":[{"t":"“The last line is very powerful and moving.”","why":"Powerful how? Name the words and their work.","_n":"gc9d","_k":"1e72bcf3"},{"t":"“Fitzgerald uses a metaphor.”","why":"Naming the device is step one; explain what it does.","_n":"hc8d","_k":"41c2bc71"},{"t":"“The phrase ‘borne back ceaselessly’ makes the past an undertow: effort is not just useless but turned backward.”","why":"It zooms in on words and explains their effect.","_n":"ic7d","_k":"7dc29394"},{"t":"“At the end, Nick reflects on Gatsby’s dream.”","why":"That reports what happens.","_n":"j36d","_k":"b7e550b9"}],"hints":["Which sentence points to specific words?","Which explains an effect?","The sentence about “borne back ceaselessly” making the past an undertow."]},{"id":"w6","skill":"Analysis vs summary","goal":6,"prompt":"Which closing sentence of a body paragraph links back to the thesis best? (Thesis: Jane’s passion is the source of her moral independence.)","options":[{"t":"“Her outburst is not a loss of control but a declaration of selfhood: the passion that frightens others is exactly what lets her refuse to be owned.”","why":"It ties the evidence back to the thesis’s key terms.","_n":"k37d","_k":"1ab31c36"},{"t":"“Another theme in the novel is religion.”","why":"That opens a new topic.","_n":"l34d","_k":"44961a19"},{"t":"“Next, Jane goes to Thornfield.”","why":"That’s a plot step, not a link.","_n":"m35d","_k":"5edb6f21"},{"t":"“This shows that Brontë was a great writer.”","why":"That’s too general; it’s not about the thesis.","_n":"n3ad","_k":"1d0098da"}],"hints":["Find the thesis’s key words.","Which sentence uses them?","The sentence that calls her outburst “a declaration of selfhood”."]}],"refreshers":{"Thesis vs topic":"Topic: what you’re writing about. Thesis: what you claim about it, how the text shows it, and why it matters. Test: could a smart reader disagree?","Quotation integration":"Signal phrase (who, when) → the quotation fitted to your grammar → (Author page) or (Author, ch. #) → then your analysis.","Analysis vs summary":"Summary says what happens. Analysis says how the words make meaning and why that matters to your claim. Quote a little; analyse a lot."}}},"explore":{"heading":"Essay architect","intro":"Build an essay the way an architect builds a house: a thesis that bears weight, beams that rest on it, and evidence for a foundation. Watch the readouts tell you where it will stand and where it will sag.","texts":[{"id":"fr","t":"\u003cem>Frankenstein\u003c/em> (model essay)"},{"id":"je","t":"\u003cem>Jane Eyre\u003c/em>"},{"id":"gg","t":"\u003cem>The Great Gatsby\u003c/em>"},{"id":"my","t":"My novel"}],"modes":[{"id":"forge","t":"Thesis forge"},{"id":"outline","t":"Outline"},{"id":"bank","t":"Evidence bank"},{"id":"para","t":"Paragraph"},{"id":"coh","t":"Coherence map"},{"id":"concl","t":"Conclusion"}],"privacy":"Everything you type for “My novel” stays on this device. It leaves only if you copy your results summary.","lib":{"fr":{"title":"Frankenstein","author":"Mary Shelley","sur":"Shelley","claims":[{"id":"c1","t":"Victor Frankenstein creates a living being.","kind":"fact","full":true},{"id":"c2","t":"the Creature kills William.","kind":"fact","full":true},{"id":"c3","t":"shows that monstrousness is a verdict passed by others, not a fact of the Creature’s body","kind":"arg"},{"id":"c4","t":"presents Victor’s real failure as a failure of care, not of science","kind":"arg"},{"id":"c5","t":"makes the Creature’s eloquence the strongest evidence of his humanity","kind":"arg"},{"id":"c6","t":"explores many deep themes about life.","kind":"vague"}],"how":[{"id":"h1","t":"by staging each rejection as a judgment of appearance","fits":["c3"]},{"id":"h2","t":"by giving the Creature the novel’s most eloquent voice","fits":["c5","c3"]},{"id":"h3","t":"by framing each crime as an answer to abandonment","fits":["c4","c3"]},{"id":"h4","t":"by having Victor flee his creation in its first hour","fits":["c4"]},{"id":"h5","t":"through nested narrators who each judge what they hear","fits":["c3","c5"]},{"id":"h6","t":"by letting the Creature learn language from books before he meets a single kind face","fits":["c5"]}],"why":[{"id":"y1","t":"asking what a community owes the strange"},{"id":"y2","t":"which suggests that the duty of care begins at the moment of making"},{"id":"y3","t":"which warns that cruelty, not science, makes monsters"},{"id":"y4","t":"suggesting that we judge faces before we hear voices"},{"id":"y5","t":"which asks whether Victor’s true failure was his science or his refusal to care"}],"cards":[{"id":"a","kind":"beam","w":1.5,"t":"(a) The Creature first speaks as a reader; his eloquence proves his humanity.","ts":"The Creature first speaks not as a fiend but as a reader, and Shelley makes his eloquence the clearest evidence of his humanity."},{"id":"b","kind":"beam","w":2.5,"t":"(b) Each rejection is staged as a judgment of appearance, never of action.","ts":"Yet each rejection the Creature suffers is staged as a judgment of his appearance, never of his actions."},{"id":"c","kind":"beam","w":5,"t":"(c) “Misery made me a fiend” names the cause-and-effect the novel has built.","ts":"When the Creature declares, “I was benevolent and good; misery made me a fiend” (Shelley, ch. 10), he names the cause-and-effect the novel has been building."},{"id":"d","kind":"counter","w":4,"t":"(d) Counterargument: the murders seem to cancel sympathy, yet each follows an abandonment.","ts":"Some readers argue that the Creature’s murders cancel his claim to sympathy, and his violence is real; yet Shelley places each crime after an act of abandonment, so the reader must weigh the deeds against their causes."},{"id":"e","kind":"beam","w":4.5,"t":"(e) Victor’s final pursuit shows that refusing care turns maker into hunter.","ts":"Building on this, Victor’s final pursuit shows that his refusal of care turns maker into hunter."}],"start":["b","e","a","d","c"],"model":["a","b","c","d","e"],"ev":[{"id":"q1","q":"I ought to be thy Adam","sur":"Shelley","kind":"ch","n":"10","card":"a"},{"id":"q2","q":"Unable to endure the aspect of the being I had created, I rushed out of the room","sur":"Shelley","kind":"ch","n":"5","card":"b"},{"id":"q3","q":"the monster that I am","sur":"Shelley","kind":"ch","n":"12","card":"b"},{"id":"q4","q":"I was benevolent and good; misery made me a fiend","sur":"Shelley","kind":"ch","n":"10","card":"c"},{"id":"q5","q":"Every where I see bliss, from which I alone am irrevocably excluded","sur":"Shelley","kind":"ch","n":"10","card":"c"},{"id":"q6","q":"Beware; for I am fearless, and therefore powerful","sur":"Shelley","kind":"ch","n":"20","card":"d"},{"id":"q7","q":"lost in darkness and distance","sur":"Shelley","kind":"ch","n":"24","card":"e"}],"para":{"claim":"Yet each rejection the Creature suffers is staged as a judgment of his appearance, never of his actions.","ev":"Describing the night of the Creature’s birth, Victor confesses, “Unable to endure the aspect of the being I had created, I rushed out of the room” (Shelley, ch. 5).","an":"The word aspect means the Creature’s look, not his deeds: Victor flees a face, not a crime. Nothing has happened yet, so the judgment comes before any evidence, which is what turns it into a verdict. The pattern begins with the maker, and every later rejection repeats it.","link":"Monstrousness is passed on the Creature by others, beginning with the one who should have cared."},"concl":{"moves":["see","beyond","image"],"t":"Shelley’s warning reaches past science: the duty of care begins at the moment of making. The novel ends with the Creature “lost in darkness and distance” (Shelley, ch. 24), a verdict no one stayed to revise."}},"je":{"title":"Jane Eyre","author":"Charlotte Brontë","sur":"Brontë","claims":[{"id":"c1","t":"Jane works as a governess at Thornfield.","kind":"fact","full":true},{"id":"c2","t":"Jane leaves Thornfield after the wedding is stopped.","kind":"fact","full":true},{"id":"c3","t":"presents Jane’s passion not as a flaw to be tamed but as the source of her moral independence","kind":"arg"},{"id":"c4","t":"sets passion against principle only to reconcile them","kind":"arg"},{"id":"c5","t":"makes Jane’s equality a matter of the soul, not of station","kind":"arg"},{"id":"c6","t":"explores many interesting themes.","kind":"vague"}],"how":[{"id":"h1","t":"through Jane’s direct addresses to Rochester and to the reader","fits":["c3","c4","c5"]},{"id":"h2","t":"through recurring images of fire and ice","fits":["c4","c3"]},{"id":"h3","t":"by turning the bird and the net into images of a captivity she refuses","fits":["c3"]},{"id":"h4","t":"through the red-room scene, where the child first names injustice","fits":["c3"]},{"id":"h5","t":"by contrasting Helen Burns’s restraint with Jane’s protest","fits":["c4"]},{"id":"h6","t":"by making Jane’s refusals as dramatic as her declarations","fits":["c3","c5"]}],"why":[{"id":"y1","t":"suggesting that a free self steers by feeling rather than suppressing it"},{"id":"y2","t":"which offers balance as the novel’s definition of a free self"},{"id":"y3","t":"which challenges the Victorian idea that a good woman is a quiet one"},{"id":"y4","t":"asking what independence costs a woman with no money"},{"id":"y5","t":"which suggests that dignity cannot be granted, only claimed"}],"cards":[{"id":"a","kind":"beam","w":1.5,"t":"The red-room protest shows that Jane’s passion begins as a protest against injustice."},{"id":"b","kind":"beam","w":2.5,"t":"Yet at Lowood, Helen Burns models a restraint that Jane admires but cannot share."},{"id":"c","kind":"beam","w":5,"t":"Building on this, Jane’s declaration in the garden makes passion a claim to equal selfhood."},{"id":"d","kind":"counter","w":4,"t":"Admittedly, her departure from Thornfield looks like passion defeated by principle; yet she leaves as fiercely as she loved."},{"id":"e","kind":"beam","w":4.5,"t":"Leaving Thornfield is itself a passionate choice: Jane chooses herself."}],"start":["a","b","c","d","e"],"model":["a","b","c","d","e"],"ev":[{"id":"q1","q":"Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?","sur":"Brontë","kind":"ch","n":"23","card":"c"},{"id":"q2","q":"I am no bird; and no net ensnares me","sur":"Brontë","kind":"ch","n":"23","card":"c"},{"id":"q3","q":"a free human being with an independent will","sur":"Brontë","kind":"ch","n":"23","card":"e"},{"id":"q4","q":"I care for myself. The more solitary, the more friendless, the more unsustained I am, the more I will respect myself.","sur":"Brontë","kind":"ch","n":"27","card":"e"}],"para":{"claim":"","ev":"","an":"","link":""},"concl":{"moves":[],"t":""}},"gg":{"title":"The Great Gatsby","author":"F. Scott Fitzgerald","sur":"Fitzgerald","claims":[{"id":"c1","t":"Gatsby throws lavish parties at his mansion.","kind":"fact","full":true},{"id":"c2","t":"Nick Carraway moves to West Egg.","kind":"fact","full":true},{"id":"c3","t":"presents Gatsby’s dream as a faith that survives by refusing evidence","kind":"arg"},{"id":"c4","t":"makes hope itself a kind of undertow","kind":"arg"},{"id":"c5","t":"turns Gatsby’s parties into a performance meant for one viewer","kind":"arg"},{"id":"c6","t":"shows the American Dream is bad.","kind":"vague"}],"how":[{"id":"h1","t":"using recurring images of light and distance","fits":["c3","c5"]},{"id":"h2","t":"through Nick’s narration, which admires what it judges","fits":["c3","c4"]},{"id":"h3","t":"by placing the green light across the water","fits":["c3","c5"]},{"id":"h4","t":"through the final image of boats against the current","fits":["c4","c3"]},{"id":"h5","t":"by making Gatsby’s insistence that the past can be repeated his defining line","fits":["c3","c4"]},{"id":"h6","t":"through the contrast between crowded parties and an empty house","fits":["c5"]}],"why":[{"id":"y1","t":"suggesting that longing, not possession, keeps a dream alive"},{"id":"y2","t":"asking whether every dream we cherish survives on what we refuse to see"},{"id":"y3","t":"which exposes the cost of a national faith in reinvention"},{"id":"y4","t":"suggesting that hope and loss move together"},{"id":"y5","t":"which suggests that the past is the only place the dream can live"}],"cards":[{"id":"a","kind":"beam","w":1.5,"t":"Gatsby’s parties are a public light, performed for one absent viewer across the bay."},{"id":"b","kind":"beam","w":2.5,"t":"By contrast, the green light turns that performance into a private faith."},{"id":"c","kind":"beam","w":5,"t":"When Daisy falls short of the dream, Gatsby refuses the evidence rather than the dream."},{"id":"d","kind":"counter","w":4,"t":"Some readers argue that Gatsby’s death proves the dream simply fails; yet Nick’s narration keeps it alive."},{"id":"e","kind":"beam","w":4.5,"t":"Finally, the image of boats against the current makes longing the dream’s true engine."}],"start":["a","b","c","d","e"],"model":["a","b","c","d","e"],"ev":[{"id":"q1","q":"he stretched out his arms toward the dark water","sur":"Fitzgerald","kind":"ch","n":"1","card":"b"},{"id":"q2","q":"Gatsby believed in the green light","sur":"Fitzgerald","kind":"ch","n":"9","card":"b"},{"id":"q3","q":"Can’t repeat the past?” he cried incredulously. “Why of course you can!","sur":"Fitzgerald","kind":"ch","n":"6","card":"c"},{"id":"q4","q":"So we beat on, boats against the current, borne back ceaselessly into the past","sur":"Fitzgerald","kind":"ch","n":"9","card":"e"}],"para":{"claim":"","ev":"","an":"","link":""},"concl":{"moves":[],"t":""}}},"status":{"none":"Not started","topic":"Topic only","fact":"Fact","vague":"Vague","devices":"Topic only (a list of devices)","noHow":"Missing how","noWhy":"Missing why","good":"Arguable · has how · has why"},"weak":{"topic":"A topic names a subject; there’s no claim for the beams to carry.","fact":"A fact can’t be argued, so the beams have nothing to prove.","vague":"A vague claim gives the beams nothing definite to hold.","devices":"A list of techniques is a table of contents, not a thesis. Add a claim and a “why”, and the devices become evidence.","noHow":"Add how: “by …” or “through …”.","noWhy":"Add why: “…, which suggests …”."},"roof":{"weak":"No claim to carry","noHow":"Thesis: missing how","noWhy":"Thesis: missing why","good":"Thesis: claim · how · why","none":"Thesis"},"fitGood":"Good match: that “how” is exactly the kind of evidence path this claim needs.","fitOk":"That “how” works. Check that it’s the path that proves this particular claim.","jobs":[{"id":"establish","t":"establishes"},{"id":"build","t":"builds the pattern"},{"id":"cause","t":"names the cause"},{"id":"test","t":"tests the claim"},{"id":"extend","t":"extends the stakes"},{"id":"describe","t":"only describes"}],"describeFlag":"“Describes” isn’t a job in an argument. Rewrite the topic sentence so it argues something the thesis needs.","moves":[{"id":"see","t":"What we now see"},{"id":"beyond","t":"Why it matters beyond the book"},{"id":"image","t":"A resonant final image or phrase"}],"restate":"Restating proves nothing new. Tell the reader what your argument reveals: about the novel, its time, or ours.","verbs":["suggests","implies","undercuts","juxtaposes","foreshadows","reframes","intensifies","complicates"],"transitions":["however","yet","because of this","by contrast","building on this","still","more than that","moreover","furthermore","therefore","similarly","likewise","in contrast","nevertheless","consequently","as a result","even so","finally","ultimately","admittedly","for this reason","in the same way","this pattern","at the same time"],"devices":["imagery","symbolism","symbols","symbol","dialogue","metaphor","metaphors","simile","similes","foreshadowing","irony","setting","characterization","diction","tone","motif","motifs","personification","allusion","allusions","structure"],"vague":["many","interesting","various","deep themes","is bad","is good","a lot","things","very important","important themes"],"stop":["about","above","after","again","against","almost","along","already","although","always","among","another","anyone","anything","around","author","because","become","becomes","before","begin","begins","being","below","beside","between","beyond","both","cannot","could","doing","during","each","either","enough","especially","essay","every","everything","first","following","former","further","given","great","having","himself","herself","however","indeed","instead","itself","later","least","makes","making","might","never","novel","novels","often","other","others","rather","really","reader","readers","seems","should","shows","since","something","still","story","suggest","suggests","suggesting","their","theirs","themselves","there","these","thing","things","those","though","through","throughout","today","together","toward","towards","under","until","using","various","where","whether","which","while","whole","whose","within","without","would","writer","writes","years","presents","present","reveals","reveal","argues","argue","explores","explore","uses","shown","showing","chapter","passage","quotation","techniques","technique","words","asking","asks","staging","giving","letting","having","turns","turning","keeps","point","points","different","certain","perhaps","simply","merely","becoming","itself","upon","there","where","these","thought","first","second","third","final","finally","early","later","throughout","everyone","nothing","almost","across","makes","warns","offers","places","passed","tracing","challenges","exposes","begins","himself","whatever","whenever"],"tc3":{"claim":"Shelley makes the Creature’s self-diagnosis the hinge of the novel’s argument about cause and effect.","ev":"“I was benevolent and good; misery made me a fiend” (Shelley, ch. 10).","chips":[{"id":"a1","t":"The sentence turns on a semicolon: before it, a past of goodness; after it, a present made by suffering."},{"id":"a2","t":"This quotation is very important to the novel."},{"id":"a3","t":"The Creature then asks Victor for a companion."},{"id":"a4","t":"The verb “made” echoes Victor’s own act of making: misery finishes the work Victor abandoned."},{"id":"a5","t":"Many readers find the Creature sympathetic."},{"id":"a6","t":"Shelley uses a semicolon and the word “fiend”."}]},"aha":"The thesis is a promise, and the outline is the plan for keeping it. You can see an essay succeed or fail \u003cem>before\u003c/em> it’s written, by reading its topic sentences in a row.","predIntro":"Make a prediction first. Then the essay architect shows you what happens.","predictions":[{"id":"p1","prompt":"Thesis forge on \u003cem>Jane Eyre\u003c/em>, with the thesis “In \u003cem>Jane Eyre\u003c/em>, Brontë uses imagery, symbolism and dialogue.” Predict what the body paragraphs will become.","options":[{"t":"A tour of three devices with no single argument","_n":"o3bd","_k":"15309463"},{"t":"A strong argument about Jane’s independence","_n":"p38d","_k":"cbaea3f9"},{"t":"A personal response","_n":"q39d","_k":"578a6c11"},{"t":"A plot summary","_n":"r3ed","_k":"154450ca"}],"explain":"A list of techniques is a table of contents, not a thesis. Add a claim and a “why”, and the devices become evidence."},{"id":"p2","prompt":"Outline, model essay. The strongest paragraph (the “misery made me a fiend” paragraph) is moved from fourth to first. What happens to the essay’s momentum?","options":[{"t":"It peaks early, and later paragraphs feel like an anticlimax","_n":"s3fd","_k":"61b08873"},{"t":"It becomes more coherent","_n":"t3cd","_k":"1f76aa0e"},{"t":"The thesis changes","_n":"u3bd","_k":"efdc9336"},{"t":"Nothing changes; order doesn’t matter","_n":"v3ed","_k":"2a4d8f26"}],"explain":"Arguments usually build. Put the clinching evidence where the argument has earned it, near the end."},{"id":"p3","prompt":"Coherence map, model essay. “Remove transitions” is switched on. Predict the effect on a reader.","options":[{"t":"The essay becomes shorter but stronger","_n":"w3dd","_k":"266bcc96"},{"t":"The thesis becomes clearer","_n":"x38d","_k":"7a161491"},{"t":"The paragraphs read as separate points; the reader must guess how they connect","_n":"y37d","_k":"f7c08894"},{"t":"No effect; content is all that matters","_n":"z3ad","_k":"89ddb636"}],"explain":"Transitions are the argument’s joints. They tell the reader \u003cem>how\u003c/em> each step follows from the last."},{"id":"p4","prompt":"Outline, model essay. A counterargument card (“Some readers argue the Creature’s murders cancel his claim to sympathy…”) is switched in. Predict how a skeptical reader will respond to the essay now.","options":[{"t":"They stop reading","_n":"1039d","_k":"783f19af"},{"t":"No change","_n":"1144d","_k":"ac76dea2"},{"t":"They trust the argument more, because it has faced the strongest objection","_n":"1243d","_k":"74855fe9"},{"t":"They trust it less, because the writer admitted a weakness","_n":"1332c","_k":"67bad0a2"}],"explain":"Conceding a real point and then rebutting it builds ethos. Ignoring it makes a reader suspicious."}],"chalIntro":"Use the essay architect to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Forge an arguable thesis for \u003cem>Frankenstein\u003c/em> that names how and why. \u003cbutton type='button' class='btn ghost sm se-setup' data-setup='tc1'>Set it up\u003c/button>","why":"Claim, how and why: the thesis makes a promise the essay can keep. Any arguable claim with a matching “how” and one stake works; the readout praises a “how” that fits the claim.","msgs":{"text":"Switch the practice text to \u003cem>Frankenstein\u003c/em> first.","subj":"Choose the subject chip, “In \u003cem>Frankenstein\u003c/em>, Mary Shelley…”.","claim":"Choose a claim.","fact":"That’s plot. A reader can’t disagree with it.","vague":"Which themes? A claim needs content.","noHow":"Say \u003cem>how\u003c/em> Shelley shows it, e.g. “by staging each rejection as a judgment of appearance”.","noWhy":"Why does it matter? Add a stake.","twoWhy":"Choose exactly one why."},"hints":["Start with a claim someone could argue with.","Add “by …” (how) and “…, which suggests …” (why).","For example: “shows that monstrousness is a verdict passed by others, not a fact of the Creature’s body” + “by staging each rejection as a judgment of appearance” + “asking what a community owes the strange”."]},{"id":"tc2","goal":2,"prompt":"Order the model essay’s five beams so the argument builds. \u003cbutton type='button' class='btn ghost sm se-setup' data-setup='tc2'>Set it up\u003c/button>","_a":"OWlHVRodEVJAHkdXGh0RVEAeR1EabB9rQFNHGBpTERxAVkcYGlIRHEBXR2ll","why":"Both orders build: a reader meets the Creature’s humanity, then the pattern of rejection, then the named cause, with the objection faced before the final stakes.","note":"Placing the concession before your clincher lets your best evidence answer it.","msgs":{"text":"Switch the practice text to \u003cem>Frankenstein\u003c/em> first.","cards":"Keep all five model cards (a–e) in the outline. \u003cem>Reset to the model cards\u003c/em> brings them back.","dfirst":"Opening with the objection makes the essay defensive before it has argued anything.","cfirst":"That’s your clincher. Earn it first.","ebeforeb":"The pursuit depends on the pattern of rejection; establish the pattern first."},"general":"Not building yet. Which beam sets up the Creature before he is rejected?","hints":["Which beam sets up the Creature before he is rejected?","Pattern (b) leads to the verdict (c).","a, b, c, d, e."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Choose the two analysis sentences that make this paragraph work. \u003cbutton type='button' class='btn ghost sm se-setup' data-setup='tc3'>Set it up\u003c/button>","_a":"ORAEBRodEVFWEDg=","why":"Notice that the verb sentence links the quotation back to Victor, the novel’s maker, so the analysis serves the larger argument.","msgs":{"none":"Choose two analysis sentences in Paragraph mode.","a2":"Importance must be shown, not asserted.","a3":"That’s plot, not analysis.","a5":"That’s about readers in general. Tie it to the words.","a6":"That names features without explaining their effect.","two":"Choose exactly two."},"general":"Not quite. Choose the two that name specific language \u003cstrong>and\u003c/strong> say what it does.","hints":["Good analysis zooms in on a word or a mark and explains its work.","Which two sentences mention specific language \u003cstrong>and\u003c/strong> what it does?","The semicolon sentence (the semicolon as hinge) and the verb sentence (“made” echoing Victor’s making)."]}],"blocks":[{"title":"Where the texts come from","html":"\u003cp class='tiny muted'>The model essay and all practice theses, beams and paragraphs are written for this course. Quotations are short extracts from public-domain texts: \u003cem>Frankenstein\u003c/em> (1831 text), \u003cem>Jane Eyre\u003c/em> (1847) and \u003cem>The Great Gatsby\u003c/em> (1925). Public-domain e-texts have no fixed page numbers, so they are cited by chapter, as MLA 9 allows: (Shelley, ch. 10). Print editions use page numbers: (Shelley 97).\u003c/p>"}]},"part3":{"slug":"line","name":"Argument line","heading":"The argument line","intro":"A \u003cstrong>reverse outline\u003c/strong> is the writer’s X-ray: for each paragraph you write what it \u003cem>says\u003c/em> (its claim) and what it \u003cem>does\u003c/em> (its job in the argument). Read the model essay, then test whether its line holds, and then test your own.","essay":{"title":"Made, Not Born: Monstrousness as a Verdict in \u003cem>Frankenstein\u003c/em>","paras":[{"id":"p1","label":"Introduction","ts":"","t":"Early in his own story, the Creature sees his face in a pool for the first time and recoils. He has done nothing yet; he has only looked. He has learned what beauty is from the family he watches through a chink in the wall, and he has learned it well enough to condemn himself: in that instant he becomes, in his own words, “the monster that I am” (Shelley, ch. 12). The reflection is a small model of the whole novel, because the judgment arrives before any deed. In \u003cem>Frankenstein\u003c/em>, Mary Shelley shows that monstrousness is not a fact of the Creature’s body but a verdict passed on him by others, and by tracing how rejection turns his eloquence into rage, the novel asks whether Victor’s true failure was his science or his refusal to care."},{"id":"p2","label":"Paragraph 2","ts":"The Creature first speaks not as a fiend but as a reader, and Shelley makes his eloquence the clearest evidence of his humanity.","t":"The Creature first speaks not as a fiend but as a reader, and Shelley makes his eloquence the clearest evidence of his humanity. Hidden beside the cottage, he learns language by listening, and then he learns the world through books: \u003cem>Paradise Lost\u003c/em>, Plutarch’s \u003cem>Lives\u003c/em> and \u003cem>The Sorrows of Werter\u003c/em>. When he finally tells his story to Victor, he speaks in long, balanced sentences that rival his maker’s own, and he even reaches for Milton to describe himself, insisting that he ought to be Victor’s Adam. Shelley gives the supposed monster the novel’s most moving voice, so the reader hears a mind long before anyone describes a face. That order matters. A reader who has spent chapters inside the Creature’s reasoning cannot easily call him a beast, and the novel quietly makes us into the patient listener that no character in the story will agree to be."},{"id":"p3","label":"Paragraph 3","ts":"Yet each rejection the Creature suffers is staged as a judgment of his appearance, never of his actions.","t":"Yet each rejection the Creature suffers is staged as a judgment of his appearance, never of his actions. Victor flees from him in the first hour of his life, before the Creature has done anything at all. Villagers drive him off with stones for stepping into a hut. The cottagers he has secretly helped for months, gathering their firewood at night, scatter in terror the moment they see him, and Felix strikes him before he can finish his plea. When he saves a girl from drowning, the man with her answers with a gunshot. In every scene the sequence is the same: the Creature acts kindly or speaks well, and the onlookers respond only to his face. The verdict comes before the evidence, which is exactly what makes it a verdict and not a discovery."},{"id":"p4","label":"Paragraph 4","ts":"When the Creature declares, “I was benevolent and good; misery made me a fiend” (Shelley, ch. 10), he names the cause-and-effect the novel has been building.","t":"When the Creature declares, “I was benevolent and good; misery made me a fiend” (Shelley, ch. 10), he names the cause-and-effect the novel has been building. The sentence turns on its semicolon: before it, a past of goodness; after it, a present made by suffering. The verb \u003cem>made\u003c/em> is the key. It echoes Victor’s own act of making, as if misery has finished the work that Victor abandoned. The Creature does not deny that he has become a fiend; he denies that he was born one. Shelley lets him argue his own case, and the argument persuades precisely because it is so orderly: a premise, a turning point and a conclusion, the shape of a defence in a courtroom."},{"id":"p5","label":"Paragraph 5 (counterargument)","ts":"Some readers argue that the Creature’s murders cancel his claim to sympathy, and his violence is real; yet Shelley places each crime after an act of abandonment, so the reader must weigh the deeds against their causes.","t":"Some readers argue that the Creature’s murders cancel his claim to sympathy, and his violence is real; yet Shelley places each crime after an act of abandonment, so the reader must weigh the deeds against their causes. William dies soon after the Creature has been shot for saving a life. Clerval and Elizabeth die after Victor tears apart the half-made companion the Creature was promised. None of this excuses the killings, and Shelley never asks us to forgive them. She asks for something harder: to see that every blow is struck by a being who has been refused, at each step, the one thing he asked for. The murders do not disprove the thesis; they are its darkest evidence."},{"id":"p6","label":"Conclusion","ts":"","t":"\u003cem>Frankenstein\u003c/em> is often read as a warning about forbidden knowledge, but Shelley’s warning reaches further. Victor’s science made a body; his refusal to care made a monster. By the end, maker and made have become hunter and hunted, each pursuing the other across the ice, and the duty Victor refused at the beginning is the only thing that could have stopped the chase. The novel asks what we owe to whatever we make: a child, an invention, a stranger at the door. It closes as the Creature leaves Walton’s ship, carried off by the waves and “lost in darkness and distance” (Shelley, ch. 24), a verdict no one stayed to revise."}],"drift":"The Alps scenes show Shelley’s love of the sublime. Mont Blanc’s glaciers are described in vivid detail, and Victor feels calm among the mountains. Romantic writers often found peace in nature.","note":"An original model essay written for this course. Quotations: Mary Shelley, \u003cem>Frankenstein\u003c/em> (1831 text), cited by chapter."},"s1":{"title":"Station 1: Says / does","intro":"For paragraphs 2–5, choose what the paragraph \u003cstrong>says\u003c/strong> (its claim) and what it \u003cstrong>does\u003c/strong> (its job), then press Check.","jobs":[{"id":"establish","t":"establishes humanity"},{"id":"build","t":"builds the pattern"},{"id":"cause","t":"names the cause"},{"id":"test","t":"tests the claim"},{"id":"extend","t":"extends the stakes"}],"items":[{"id":"p2","says":[{"t":"The Creature’s eloquence proves his humanity.","_n":"1433c","_k":"062ca187"},{"t":"The Creature reads three books near the cottage.","_n":"1534c","_k":"040c3e16"},{"t":"Shelley uses long sentences.","_n":"1635c","_k":"225d8c14"},{"t":"Victor is to blame for the murders.","_n":"1736c","_k":"d15c4ae2"}],"_a":"QFcWQFlTX1kRWkc=","fb":"It establishes humanity: before the reader sees how the Creature is judged, Shelley proves there is a person to judge.","sayFb":"Look for the paragraph’s claim, not its details or its devices."},{"id":"p3","says":[{"t":"Every rejection judges his face, not his deeds.","_n":"1837c","_k":"a12bb437"},{"t":"The cottagers live in a small cottage.","_n":"1938c","_k":"32b2abee"},{"t":"The Creature is ugly.","_n":"1a39c","_k":"d24b7bff"},{"t":"Rejection proves Victor was a bad scientist.","_n":"1b3ac","_k":"13e8ed74"}],"_a":"QFAQXVRVEQ==","fb":"It builds the pattern: rejection after rejection, always for his face, never for what he does.","sayFb":"What does every scene in the paragraph have in common?"},{"id":"p4","says":[{"t":"Misery, not nature, made the Creature a fiend.","_n":"1c3bc","_k":"c1402f35"},{"t":"The Creature tells Victor his story on a glacier.","_n":"1d38d","_k":"ae97e28a"},{"t":"Shelley uses a semicolon.","_n":"1e37d","_k":"0b1b1fcc"},{"t":"The Creature is simply evil.","_n":"1f36d","_k":"ebf13b42"}],"_a":"QFEEQUtUEQ==","fb":"It names the cause: the Creature’s own sentence states what the pattern has shown.","sayFb":"Which choice states the cause the paragraph argues for?"},{"id":"p5","says":[{"t":"The murders are real, but each follows an abandonment.","_n":"1g35d","_k":"43393e53"},{"t":"The Creature kills William, Clerval and Elizabeth.","_n":"1h3cd","_k":"4e632c7d"},{"t":"Violence is always wrong.","_n":"1i3bd","_k":"a27f4fcd"},{"t":"Victor feels guilty.","_n":"1j3ad","_k":"62d681e1"}],"_a":"QEYAR0wT","fb":"It tests the claim: it raises the strongest objection and answers it.","sayFb":"The paragraph concedes something and then answers it. Which choice holds both?"}],"wrongDo":"Not that job. Ask what this paragraph does for the argument at this point in the line."},"s2":{"title":"Station 2: Find the drift","intro":"A seventh paragraph has crept into the draft between paragraphs 3 and 4. Tap the paragraph that doesn’t serve the thesis, then choose a repair.","okFb":"Found it. Interesting, but idle: nothing in it serves the verdict the thesis names.","wrongFb":"That paragraph serves the thesis. Look for the one that could be cut without losing any step in the argument.","repairs":[{"id":"cut","t":"Cut it","fb":"Cut it: the essay loses nothing its argument needs.","_n":"1k39d","_k":"c7fc8483"},{"id":"connect","t":"Connect it to the thesis","fb":"Accepted, if the connection is earned. A model revision:","model":"Even the sublime landscape becomes a stage for rejection: it is on the glacier that Victor first refuses to hear his creation.","_n":"1l40d","_k":"ca1e3220"},{"id":"expand","t":"Expand it","fb":"Expanding it makes the drift longer, not more relevant.","_n":"1m3fd","_k":"7b148a25"},{"id":"move","t":"Move it to the conclusion","fb":"Then the essay ends on a new topic. The last paragraph should extend the argument, not open a door.","_n":"1nbed","_k":"f29b491a"}]},"s3":{"title":"Station 3: Read the beams aloud","intro":"Hear the topic sentences of paragraphs 2–5 in a row. Does this sound like one argument?","listen":"Listen","stop":"Stop","next":"Show the next beam","again":"Start again","noVoice":"No local voice is available, so the beams appear one at a time. Read each one aloud yourself.","rate":[{"id":"yes","t":"Yes: one argument"},{"id":"part","t":"Partly"},{"id":"no","t":"No: separate points"}],"fb":{"yes":"Agreed. Each beam carries a key term from the thesis (eloquence, rejection, the named cause, abandonment) and follows from the one before.","part":"Listen again for the key terms: eloquence, rejection, misery, abandonment. Each one carries the thesis forward.","no":"Listen again: each beam carries a key term from the thesis and follows from the one before. They make one line."},"ownTitle":"Now test your own outline","ownIntro":"Here is your outline from the essay architect, with the reverse-outline column you filled in on the coherence map. Read the beams aloud in order.","ownRate":"Does your outline sound like one argument?","ownFb":{"yes":"Good. Keep the outline beside you while you draft, and check each paragraph against its beam.","part":"Find the beam that breaks the line. Rewrite it so it carries a key term and says how it follows from the last.","no":"Go back to the outline: each beam should advance the thesis and carry one of its key terms."},"open":"Open it in the essay architect","empty":"Your outline is empty. Build one in the essay architect (choose “My novel” for your ISU), then come back."},"blocks":[{"title":"Craft → meaning","html":"\u003cp class='se-craft'>A paragraph earns its place by what it \u003cstrong>does\u003c/strong> for the argument, not by how interesting it is. Interesting-but-idle paragraphs are the commonest way strong essays go soft.\u003c/p>"}],"quickCheck":{"title":"Argument line: quick check","summary":"Argument line quick check","items":[{"id":"q1","goal":5,"prompt":"In a reverse outline, “does” means…","choices":[{"t":"the number of quotations","fb":"“Says” is the claim; “does” is the role: establish, build, test, extend.","_n":"1obfd","_k":"374f464c"},{"t":"the devices named","fb":"“Says” is the claim; “does” is the role: establish, build, test, extend.","_n":"1pbcd","_k":"bab29742"},{"t":"the paragraph’s job in the argument","fb":"Right. “Says” is the claim; “does” is the role: establish, build, test, extend.","_n":"1qbdd","_k":"545ed713"},{"t":"the plot events covered","fb":"“Says” is the claim; “does” is the role: establish, build, test, extend.","_n":"1rbad","_k":"b64d8c22"}]},{"id":"q2","goal":5,"prompt":"A paragraph is interesting but doesn’t support the thesis. The best move?","choices":[{"t":"Cut it or connect it explicitly","fb":"Right. Earn the connection, or cut.","_n":"1sbbd","_k":"20b3b3cf"},{"t":"Move it to the introduction","fb":"Length isn’t a reason. Earn the connection, or cut.","_n":"1tb8d","_k":"8759da75"},{"t":"Keep it for length","fb":"Length isn’t a reason. Earn the connection, or cut.","_n":"1ub9d","_k":"e7d2c151"},{"t":"Add more quotations to it","fb":"Length isn’t a reason. Earn the connection, or cut.","_n":"1vc6d","_k":"c59727c2"}]},{"id":"q3","goal":2,"prompt":"Why read topic sentences in a row?","choices":[{"t":"To find quotations","fb":"If the beams don’t make a line, the essay won’t either.","_n":"1wc7d","_k":"e5c1a19a"},{"t":"To check spelling","fb":"If the beams don’t make a line, the essay won’t either.","_n":"1xc4d","_k":"d9a1e452"},{"t":"To hear whether they form one argument","fb":"Right. If the beams don’t make a line, the essay won’t either.","_n":"1yc3d","_k":"076196ef"},{"t":"To count words","fb":"If the beams don’t make a line, the essay won’t either.","_n":"1zc6d","_k":"09f83e4e"}]},{"id":"q4","goal":4,"prompt":"Which “does” fits a counterargument paragraph?","choices":[{"t":"tests the claim","fb":"Right. It raises the strongest objection and answers it.","_n":"20c5d","_k":"7abf1bd9"},{"t":"builds the pattern","fb":"It raises the strongest objection and answers it.","_n":"21c8d","_k":"a522c25a"},{"t":"summarizes the plot","fb":"It raises the strongest objection and answers it.","_n":"22c7d","_k":"7050806a"},{"t":"establishes the topic","fb":"It raises the strongest objection and answers it.","_n":"23cad","_k":"53329bfd"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.”\u003c/p>\u003cp class='eng-cite'>Jane Austen, \u003cem>Pride and Prejudice\u003c/em> (1813), ch. 1\u003c/p>\u003cp>\u003cstrong>What makes it work:\u003c/strong> a sweeping claim delivered with mock certainty; the irony means the novel will spend 300 pages complicating it.\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> write an opening sentence for your ISU essay that states a common view of your novel with Austen’s confident shape (“It is generally believed that…”, “Every reader knows that…”), so your thesis can overturn it. It’s saved to your commonplace book.\u003c/p>","prompt":"Your opening sentence"}],"steal":{"master":"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.","source":"Austen, Pride and Prejudice, ch. 1","checks":["One sentence","It opens with a confident, sweeping frame (“It is…”, “Every reader…”, “Everyone knows…”)","It states a view your thesis can overturn (at least 12 words)"],"save":"Save to my commonplace book"}},"practice":{"activities":[{"id":"clinic","type":"sorter","title":"Thesis clinic","summary":"Thesis clinic","goal":1,"txt":true,"noun":"statement","instruction":"Tap a statement, then tap the box it belongs in.","boxes":[{"id":"topic","label":"Topic only"},{"id":"fact","label":"Fact"},{"id":"vague","label":"Vague claim"},{"id":"part","label":"Arguable but missing how or why"},{"id":"strong","label":"Strong thesis"}],"items":[{"id":"i1","t":"“\u003cem>The Great Gatsby\u003c/em> is about the American Dream.”","_a":"QEYKRFFSEQ==","why":"It names a subject; there’s nothing to dispute.","hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Topic only: it names a subject and claims nothing about it."]},{"id":"i2","t":"“Gatsby throws lavish parties at his mansion.”","_a":"QFQEV0wT","why":"It’s plot; it could be evidence, but it can’t be argued.","hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Fact: it reports what happens."]},{"id":"i3","t":"“In \u003cem>The Great Gatsby\u003c/em>, Fitzgerald shows the American Dream is bad.”","_a":"QEQEU01UEQ==","why":"“Bad” is too vague to defend.","wrong":{"part":"“Bad” is too vague to defend. Bad how, and for whom?"},"hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Vague claim: “bad” could mean anything."]},{"id":"i4","t":"“In \u003cem>The Great Gatsby\u003c/em>, Fitzgerald presents Gatsby’s dream as a faith that survives by refusing evidence.”","_a":"QEIERkwT","why":"A real claim, but no techniques (how) and no significance (why).","wrong":{"strong":"It’s a real claim. Now add how (which techniques) and why (what it suggests)."},"hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Arguable but missing how or why: the claim is real, but there are no techniques and no stake."]},{"id":"i5","t":"“In \u003cem>The Great Gatsby\u003c/em>, Fitzgerald presents Gatsby’s dream as a faith that survives by refusing evidence, using recurring images of light and distance to suggest that longing, not possession, is what keeps the dream alive.”","_a":"QEERRldfVBI=","why":"Claim, how (images of light and distance) and why (longing keeps the dream alive).","hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Strong thesis: a claim, “using recurring images of light and distance” (how) and “to suggest that longing…” (why)."]},{"id":"i6","t":"“\u003cem>Jane Eyre\u003c/em> has many important symbols.”","_a":"QEQEU01UEQ==","why":"Which symbols, doing what? A claim needs content.","hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Vague claim: “many important symbols” says nothing definite."]},{"id":"i7","t":"“Jane leaves Thornfield after the wedding is stopped.”","_a":"QFQEV0wT","why":"It’s plot.","hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Fact: it reports an event."]},{"id":"i8","t":"“In \u003cem>Jane Eyre\u003c/em>, Brontë uses fire and ice imagery to show that Jane must balance passion and principle, a balance the novel offers as its definition of a free self.”","_a":"QEERRldfVBI=","why":"Claim, how (fire and ice imagery) and why (the definition of a free self).","hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Strong thesis: how (fire and ice imagery), what (balance passion and principle) and why (a free self)."]},{"id":"i9","t":"“In \u003cem>Frankenstein\u003c/em>, Shelley blames Victor for everything.”","_a":"QEIERkwT","why":"A position, but it overreaches and has no how.","wrong":{"strong":"“Everything” overreaches, and there’s no how."},"hints":["Could someone disagree?","Is there a “how” (by/through/using)?","Arguable but missing how or why: someone could disagree, but there’s no how."]},{"id":"i10","t":"“\u003cem>Frankenstein\u003c/em> and science.”","_a":"QEY
