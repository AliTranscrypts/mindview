/* ENG4U 17 Choosing a Novel of Literary Merit: hero shelf, Merit lens (cards, radar, sliders, compare, reading plan), proposal builder, task. Tokens only. */

/* radioGroup (from ENG4U 13) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg-lab:empty{display:none}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cn-lab{display:block;font-weight:700;font-size:.95rem;margin:0 0 4px}

/* hero: the shelf */
.cn-hero{display:grid;gap:10px}
.cn-hlines{display:grid;gap:6px;min-height:6em}
.cn-hl{margin:0;font:400 1.08rem/1.45 var(--font-math);color:var(--ink);border-radius:4px;padding:1px 4px;transition:background-color .35s}
.cn-hero.anim .cn-hl{display:none}
.cn-hero.anim .cn-hl.lit{display:block}
.cn-hl.speaking{background:var(--hi-soft)}
.cn-w{transition:opacity .25s}
.cn-hero.anim .cn-w{opacity:0}
.cn-hero.anim .cn-w.on{opacity:1}
.cn-hc{font:400 .8rem var(--font-ui);color:var(--ink-2)}
.cn-hero.anim .cn-hl.speaking .cn-hc{opacity:0}
.cn-shelf{display:flex;align-items:flex-end;gap:8px;justify-content:center;border-bottom:5px solid var(--ink-2);padding:0 8px;min-height:132px}
.cn-spine{display:flex;align-items:center;justify-content:center;width:40px;height:124px;border:2px solid var(--ink-2);border-radius:4px 4px 1px 1px;background:var(--paper);
  transform-origin:50% 100%;transition:transform .45s ease,background-color .4s,border-color .4s}
.cn-spine span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 .78rem var(--font-ui);color:var(--ink);white-space:nowrap}
.cn-spine:nth-child(2){height:116px}.cn-spine:nth-child(3){height:110px;width:36px}.cn-spine:nth-child(4){height:128px}
.cn-sp-sound.read{background:var(--an-sound-soft);border-color:var(--an-sound)}
.cn-sp-figure.read{background:var(--an-figure-soft);border-color:var(--an-figure)}
.cn-sp-image.read{background:var(--an-image-soft);border-color:var(--an-image)}
.cn-sp-theme.read{background:var(--an-theme-soft);border-color:var(--an-theme)}
.cn-spine.tilt{transform:rotate(-10deg) translateY(-4px)}
.cn-yours{border-style:dashed;background:transparent;opacity:.35;transition:opacity .6s,box-shadow .6s}
.cn-hero.done .cn-yours{opacity:1;box-shadow:0 0 0 3px var(--hi-soft)}
.cn-yours span{color:var(--ink-2)}
.cn-hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cn-hself{margin:0}

/* Explore: Merit lens */
.cn-ex{display:grid;gap:8px;min-width:0}
.cn-main{display:grid;gap:10px;min-width:0}
.cn-cards{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}

  background:var(--sheet);color:var(--ink);padding:.4em .55em;font-size:.84rem;line-height:1.25;min-height:44px;scroll-snap-align:start}

.cn-btot{font:700 .78rem var(--font-ui);color:var(--ink)}
.cn-sl-tag{display:inline-block;min-width:1.4em;text-align:center;border-radius:4px;background:var(--ink);color:var(--sheet);font:700 .72rem var(--font-ui);padding:0 .3em}

.cn-book p{margin:0 0 6px}
.cn-sample{margin:6px 0;padding:6px 10px;border-left:4px solid var(--an-figure);background:var(--sheet);font:400 1.05rem/1.45 var(--font-math);color:var(--ink)}
.cn-salesn{border:1px dashed var(--ink-2);border-radius:6px;padding:4px 8px;font-size:.9rem}

.cn-rd.cb{fill:var(--f3)}

.cn-kkey{border-top:3px dashed var(--ink-2)}
.cn-kb{border-top:3px dashed var(--f3)}
.cn-krd,.cn-kbf{display:inline-block;width:14px;height:14px;border:1px solid var(--ink-2);border-radius:3px;background:var(--hi-soft)}
.cn-kbf{background:repeating-linear-gradient(45deg,var(--ink-2) 0 2px,transparent 2px 6px)}
.cn-just{display:grid;gap:4px}
.cn-just textarea{width:100%;box-sizing:border-box}
.cn-flash{background:var(--hi-soft);border-radius:6px;padding-left:6px !important;padding-right:6px !important}
.cn-aha{margin:10px 0 0;padding:8px 10px;border-left:4px solid var(--hi);background:var(--paper)}
.cn-cmp{display:grid;gap:8px}
.cn-pair{display:none}
.cn-pone svg{width:100%;max-width:320px;height:auto;display:block;margin:0 auto}
.cn-ptl{margin:0 0 4px;font-size:.92rem}
.cn-samples{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cn-samp{min-width:0}
.cn-plan{display:grid;gap:8px}
.cn-pf{min-width:0}
.cn-num{max-width:9em}
.cn-pf select{max-width:100%;min-height:38px;font-size:.95rem}
.cn-pin{display:flex;flex-wrap:wrap;gap:10px 20px}
.cn-rng output{color:var(--pen)}
.cn-cal{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.cn-day{width:16px;height:22px;border:1px solid var(--ink-2);border-radius:3px;background:var(--hi-soft)}
.cn-day.bf{background:repeating-linear-gradient(45deg,var(--ink-2) 0 2px,transparent 2px 6px)}
.cn-calt{margin:4px 0 0;font-weight:700}

/* Part 3: proposal builder */
.cn-p3{display:grid;gap:12px}
.cn-stn{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet);min-width:0}
.cn-stn h3{margin:0 0 6px;font-size:1.02rem}
.cn-stn textarea{width:100%;box-sizing:border-box}
.cn-row3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,.8fr);gap:8px}
.cn-row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cn-row3 .txtin,.cn-row4 .txtin{width:100%;box-sizing:border-box;max-width:none}
.cn-prev{margin:6px 0 0}
.cn-chk{display:flex;gap:6px;align-items:flex-start;font-size:.92rem;margin:4px 0}
.cn-st{margin:4px 0 0;font-size:.9rem;color:var(--ink-2)}
.cn-st:empty{display:none}
.cn-craft{margin-top:8px}
.cn-iqshow{font:400 1.02rem/1.6 var(--font-math);margin:4px 0}
mark.cn-hop{background:var(--an-theme-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--an-theme);border-radius:2px}
mark.cn-hcw{background:var(--an-figure-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--an-figure);border-radius:2px;font-weight:700}
mark.cn-hvb{background:var(--an-syntax-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--an-syntax);border-radius:2px}
.cn-tnote{margin:0;font-weight:700}
.cn-steal{font:400 1.08rem/1.5 var(--font-math);margin:0 0 4px}

/* task */
.cn-tk{display:grid;gap:6px;margin-bottom:10px}
.cn-glance{margin:0;padding-left:1.1em;display:grid;gap:4px}
.cn-glance li{overflow-wrap:anywhere}
.cn-model{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.cn-model h5{margin:0 0 4px;font-size:.98rem}
.cn-model p{margin:0 0 6px}

@media (min-width:620px){ .cn-pair{display:none} }
@media (max-width:760px){
  .cn-lens{grid-template-columns:minmax(0,1fr)}
  .cn-row4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .cn-ov{display:none}
  .cn-pair{display:grid;gap:10px}
  .cn-samples{grid-template-columns:minmax(0,1fr)}
  .cn-row3{grid-template-columns:minmax(0,1fr)}
  .cn-spine{width:34px}
  .cn-spine:nth-child(3){width:30px}
}
@media (prefers-reduced-motion:reduce){
  .cn-spine,.cn-w,.cn-hl,.cn-yours{transition:none}
}

<script>window.MV_PAYLOAD={"meta":{"id":"17-choosing-a-novel","nn":"17","slug":"choosing-a-novel","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 4","groupName":"Independent Study Unit (ISU)","trivium":"Logic","size":"S","storageKey":"eng4u-17-choosing-a-novel-v1","progressKey":"eng4u-progress-v1:17-choosing-a-novel","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"d8b95027","content":{"id":"17-choosing-a-novel","kind":"topic","title":"Choosing a novel of literary merit","topic":"Choosing a Novel of Literary Merit","readyTopic":"choosing your ISU novel","hero":{"headline":"Choose a book that will keep talking back.","text":"Your ISU novel will be your companion for weeks. Choose one with \u003cstrong>literary merit\u003c/strong>: complex characters, language worth studying, \u003cstrong>ambiguity\u003c/strong> that rewards argument, and \u003cstrong>enduring questions\u003c/strong> about how to live. In this module you’ll test candidates with the Merit lens, write a real \u003cstrong>inquiry question\u003c/strong>, and build a plan you can keep.","fig":{"html":"\u003cdiv class='cn-hero' id='cn-hero' role='group' aria-label='Four book spines stand on a shelf: Moby-Dick, Frankenstein, Mrs Dalloway and The Great Gatsby. One at a time, each book tilts forward and its famous line appears above the shelf, word by word. After the fourth line, the shelf shows one empty slot, labelled Yours.'>\u003c/div>","caption":""},"lines":[{"t":"Call me Ishmael.","spine":"Moby-Dick","cite":"Melville, \u003ci>Moby-Dick\u003c/i>, 1851","role":"sound"},{"t":"It was on a dreary night of November, that I beheld the accomplishment of my toils.","spine":"Frankenstein","cite":"Shelley, \u003ci>Frankenstein\u003c/i>, 1818","role":"figure"},{"t":"Mrs. Dalloway said she would buy the flowers herself.","spine":"Mrs Dalloway","cite":"Woolf, \u003ci>Mrs Dalloway\u003c/i>, 1925","role":"image"},{"t":"So we beat on, boats against the current, borne back ceaselessly into the past.","spine":"The Great Gatsby","cite":"Fitzgerald, \u003ci>The Great Gatsby\u003c/i>, 1925","role":"theme"}],"yours":"Yours","listen":"Listen","watch":"Watch again","readSelf":"\u003cstrong>Read it yourself:\u003c/strong> Read the four lines aloud. Which one makes you want to know what happens next? Why?"},"goals":["I can explain the criteria of literary merit, and why popularity alone isn’t one.","I can find evidence of complexity, craft and ambiguity in a novel’s sample pages.","I can use the merit lens to compare candidate novels and justify a choice.","I can write a focused inquiry question that can drive an ISU essay.","I can make a realistic reading plan with time for notes and rereading.","I can reflect on my reading habits and choose a book that will stretch me."],"start":{"blocks":[{"title":"Word story: novel and merit","html":"\u003cp>\u003cstrong>\u003cem>Novel\u003c/em>\u003c/strong> comes from Italian \u003cem>novella\u003c/em>, “a little new thing, a piece of news”, ultimately from Latin \u003cem>novus\u003c/em>, “new”. The novel was once the upstart form: the newest way to tell a story.\u003c/p>\u003cp>\u003cstrong>\u003cem>Merit\u003c/em>\u003c/strong> comes from Latin \u003cem>meritum\u003c/em>, “what is earned”. So literary merit isn’t a badge a book is given; it’s what the book \u003cem>earns\u003c/em> by repaying your attention.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Character and theme","goal":2,"prompt":"A \u003cstrong>round\u003c/strong> character is one who…","options":[{"t":"Is likeable","why":"Round characters can be deeply unlikeable.","_n":"06b6","_k":"92f729e8"},{"t":"Is complex, has contradictions, and can change or surprise us","why":"E. M. Forster’s test: a round character can surprise in a convincing way.","_n":"1686","_k":"bfcae1d8"},{"t":"Appears in many chapters","why":"Frequency isn’t complexity.","_n":"2696","_k":"8e32c3cd"},{"t":"Is the narrator","why":"Narrators can be flat; minor characters can be round.","_n":"3666","_k":"acb1a6b7"}],"hints":["Think “depth”, not “page time”.","Can they surprise you convincingly?","Complex and able to change."]},{"id":"w2","skill":"Character and theme","goal":2,"prompt":"Which is a \u003cstrong>theme\u003c/strong> rather than a topic?","options":[{"t":"“A scientist builds a creature.”","why":"That’s plot.","_n":"4676","_k":"d53e097d"},{"t":"“Ambition can isolate a person from the people who love them.”","why":"A theme is a claim about life.","_n":"5646","_k":"0f1cdf20"},{"t":"“Ambition.”","why":"That’s a topic, a single word.","_n":"6656","_k":"942816cd"},{"t":"“The novel is set in Switzerland.”","why":"That’s setting.","_n":"7626","_k":"7290d3a7"}],"hints":["A theme says something \u003cem>about\u003c/em> a topic.","Look for a full statement.","The sentence about ambition and isolation."]},{"id":"w3","skill":"Ambiguity and interpretation","goal":2,"prompt":"A novel is \u003cstrong>ambiguous\u003c/strong> when…","options":[{"t":"It has many characters","why":"Size isn’t ambiguity.","_n":"8636","_k":"f2bfc5bd"},{"t":"Its evidence supports more than one defensible reading","why":"Ambiguity invites argument.","_n":"9f68","_k":"86aeee30"},{"t":"It’s badly written","why":"Confusion isn’t ambiguity; ambiguity is controlled.","_n":"af58","_k":"eebb00b8"},{"t":"Its ending is happy","why":"Any ending can be ambiguous or not.","_n":"bf88","_k":"3f170142"}],"hints":["Can readers disagree \u003cem>with evidence\u003c/em>?","More than one reading holds up.","Supports more than one defensible reading."]},{"id":"w4","skill":"Ambiguity and interpretation","goal":4,"prompt":"Which question opens the richest discussion of a novel?","options":[{"t":"“What year is the novel set in?”","why":"One fact answers it.","_n":"cf78","_k":"0a9ef398"},{"t":"“Did you like the ending?”","why":"A preference, not an inquiry.","_n":"df28","_k":"8c50c676"},{"t":"“Why does the narrator withhold the key fact until the last chapter?”","why":"A \u003cem>why\u003c/em> about a craft choice invites argument.","_n":"ef18","_k":"9731647b"},{"t":"“How many chapters are there?”","why":"Countable, not arguable.","_n":"ff48","_k":"f16872c2"}],"hints":["Which can’t be answered with one word?","Look for \u003cem>why\u003c/em> about a choice.","The withheld fact."]},{"id":"w5","skill":"Planning","goal":5,"prompt":"You have 20 days to read 300 pages. How many pages per day?","options":[{"t":"6","why":"That’s 300 ÷ 50.","_n":"gf38","_k":"7cda3f08"},{"t":"15","why":"300 ÷ 20 = 15.","_n":"hee8","_k":"10f4672f"},{"t":"20","why":"300 ÷ 15 = 20; check which number divides.","_n":"ied8","_k":"d7567c18"},{"t":"30","why":"That’s 300 ÷ 10.","_n":"j647","_k":"f3169ec7"}],"hints":["Total pages ÷ days.","300 ÷ 20.","15."]},{"id":"w6","skill":"Planning","goal":5,"prompt":"You’ll read for 24 days at 15 pages a day. How many pages will you have read?","options":[{"t":"39","why":"That adds the numbers.","_n":"k657","_k":"9af00bab"},{"t":"240","why":"That’s 24 × 10.","_n":"l667","_k":"3b5136e3"},{"t":"300","why":"That’s 20 × 15.","_n":"m677","_k":"8e625157"},{"t":"360","why":"24 × 15 = 360.","_n":"n607","_k":"adc2b17c"}],"hints":["Pages per day × days.","24 × 15.","360."]}],"refreshers":{"Character and theme":"Round characters are complex and can change; flat ones serve one function. A theme is a statement about life (not a single word), such as “Ambition can isolate us from love.”","Ambiguity and interpretation":"Ambiguity means the evidence supports more than one reading. It’s a strength, because it makes room for argument. Good questions ask \u003cem>how\u003c/em> or \u003cem>why\u003c/em> about a choice.","Planning":"Pages per day = pages ÷ reading days. Always subtract buffer days (for notes and rereading) from your window first."}}},"explore":{"heading":"Merit lens","intro":"Hold each book up to six questions. Score it from the evidence on its card, then compare your profile with the evidence-based one.","modes":[{"id":"lens","t":"Lens"},{"id":"compare","t":"Compare"},{"id":"plan","t":"Reading plan"}],"how":{"lens":"Tap a book card. Score each criterion 0, 1 or 2 from the evidence on the card, then press \u003cstrong>Show evidence-based profile\u003c/strong>. Star the cards you’d shortlist.","compare":"Tap two cards to compare their evidence-based profiles. Read the two sample sentences aloud.","plan":"Choose a book (or type your own book’s pages), set your window, buffer and reading speed, then enter the pages per day and minutes per day you’ll need."},"crit":[{"id":"c","t":"Complexity","s":"C"},{"id":"cr","t":"Craft","s":"Cr"},{"id":"a","t":"Ambiguity","s":"A"},{"id":"e","t":"Enduring questions","s":"E"},{"id":"cc","t":"Critical conversation","s":"CC"},{"id":"r","t":"Rereadability","s":"R"}],"books":[{"id":"b1","n":"B1","t":"The Lantern Keeper’s Daughter","type":"Literary novel","pages":352,"novel":true,"blurb":"On a Cape Breton island, a girl inherits her father’s lighthouse logbooks and finds entries he never meant her to read; two timelines.","sample":"My father wrote the weather every night, and only once did he write the truth.","crit":"Reviewed in literary journals; taught in university courses.","sales":"Steady sales; a regular on book-club lists.","_a":"PwpOCxkCHgVICk4LaA=="},{"id":"b2","n":"B2","t":"Galaxy Strike 7","type":"Series action novel","pages":280,"novel":true,"blurb":"Commander Vance faces the Zorn fleet again.","sample":"The blasters fired. The ship exploded. Commander Vance smiled.","crit":"Bestseller list; no reviews.","sales":"Sold a million copies; 4.8 stars from readers online.","_a":"PwhOCRkAHgZICE4JaA=="},{"id":"b3","n":"B3","t":"The Salt Year","type":"Literary novel","pages":296,"novel":true,"blurb":"A family’s year after the mine closes in a northern Ontario town; the ending is left deliberately open.","sample":"We counted the winter in what we no longer bought.","crit":"Prize shortlist; essays in two journals.","sales":"Modest sales.","_a":"PwpOCxkCHgVICk4IaA=="},{"id":"b4","n":"B4","t":"Ten Habits of Highly Focused Teens","type":"Self-help nonfiction","pages":190,"novel":false,"blurb":"Practical tips for studying.","sample":"Habit 1: Put your phone in another room.","crit":"Popular with parents.","sales":"A bestseller in its category.","_a":"P2U="},{"id":"b5","n":"B5","t":"Murder at Maple Inn","type":"Cozy mystery","pages":240,"novel":true,"blurb":"A retired teacher solves a death at a lakeside inn.","sample":"The body was in the library, which surprised no one.","crit":"One newspaper review; strong sales.","sales":"Strong sales; the first of a series.","_a":"PwlOCBkAHgdICE4JaA=="},{"id":"b6","n":"B6","t":"The Weight of Rivers","type":"Literary novel","pages":416,"novel":true,"blurb":"Two timelines: a Japanese Canadian family uprooted in 1942, and their granddaughter in present-day Vancouver.","sample":"Grandmother kept her silence folded, like a letter no one had asked to read.","crit":"Reviewed widely; studied in courses.","sales":"Good sales.","_a":"PwpOCxkBHgVICk4IaA=="},{"id":"b7","n":"B7","t":"Signal","type":"Speculative literary novel","pages":360,"novel":true,"blurb":"A Deaf teenager in a city where all speech is monitored.","sample":"In a city that listened to everything, I was the only one it couldn’t hear.","crit":"A few reviews; a book-club favourite.","sales":"Good sales through book clubs.","_a":"PwpOCBkCHgVICU4IaA=="},{"id":"b8","n":"B8","t":"Bestseller Summer","type":"Popular romance","pages":300,"novel":true,"blurb":"Two rivals fall in love at a cottage.","sample":"Her heart raced. His eyes sparkled. Summer had begun.","crit":"Huge sales; no reviews.","sales":"Huge sales; number one all summer.","_a":"PwlOCRkAHgZICE4JaA=="}],"bands":{"strong":"Strong candidate","possible":"Possible: discuss with your teacher","no":"Not recommended for the ISU","notNovel":"Not a novel: outside the ISU brief."},"guard":"Sales aren’t one of the six questions. What does the \u003cem>writing\u003c/em> show?","scoreNote":"These scores model one careful reading. Your teacher may weigh things differently.","aha":"Merit lives in the sentence and the question, not on the bestseller list. Compare B1’s sample with B2’s: both are one line, but only one makes you ask \u003cem>what truth?\u003c/em>","own":"My own book","predictions":[{"id":"p1","start":{"mode":"lens","card":"b3"},"prompt":"Suppose the novel ended with every question answered and every character’s fate explained. Which criterion would drop?","options":[{"t":"Critical conversation","_n":"o617","_k":"319a98fb"},{"t":"Complexity","_n":"p627","_k":"c80654c3"},{"t":"Craft","_n":"q637","_k":"25014b5f"},{"t":"Ambiguity","_n":"r6c7","_k":"bd5c2acf"}],"explain":"An open ending is part of what lets readers argue. Close every door and there’s less to discuss."},{"id":"p2","start":{"mode":"lens","card":"b2"},"prompt":"B2 sold a million copies. If we add “sales” as a reason, what happens to its evidence-based profile?","options":[{"t":"It rises to “strong candidate”.","_n":"s6d7","_k":"dec4adb2"},{"t":"It rises by 2 points.","_n":"t6a7","_k":"c27ad9c0"},{"t":"It becomes “possible”.","_n":"u697","_k":"8306ff85"},{"t":"Nothing: sales aren’t one of the six criteria","_n":"v687","_k":"a554ae0c"}],"explain":"Popularity and merit are separate questions."},{"id":"p3","start":{"mode":"plan","card":"b7","win":30,"buf":0},"prompt":"Now set a 6-day buffer for notes. What happens to the pages per day you need?","options":[{"t":"They fall from 12 to 10.","_n":"w677","_k":"12f90949"},{"t":"They rise from 12 to 18.","_n":"x667","_k":"d5be1c97"},{"t":"They rise from 12 to 15","_n":"y657","_k":"875e7892"},{"t":"They stay at 12.","_n":"z647","_k":"5cb272b7"}],"explain":"Fewer reading days means more pages each day, but you gain time to reread and gather quotations."},{"id":"p4","start":{"mode":"compare","cmp":["b1","b8"]},"prompt":"Read the two sample sentences aloud. Which criterion shows the biggest gap?","options":[{"t":"Craft: B1’s sentence plants a mystery (“only once… the truth”); B8’s uses stock phrases","_n":"10637","_k":"4592a796"},{"t":"Length.","_n":"11727","_k":"5652a5e6"},{"t":"Rereadability.","_n":"12717","_k":"5c1a1d4a"},{"t":"Critical conversation.","_n":"13f87","_k":"be557bb5"}],"explain":"A single sentence can show craft: B1’s withholds and promises; B8’s could appear in any book."}],"chalIntro":"Use the lens, Compare and the reading plan to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"Find the \u003cstrong>two strongest candidates\u003c/strong> for a novel ISU: star exactly two cards for your shortlist. \u003cbutton type='button' class='btn ghost sm cn-setup' data-setup='lens'>Set it up\u003c/button>","_a":"PxoACBccEFVXGj8=","msgs":{"none":"Star the cards you’d shortlist (the ☆ button on each card).","b4":"B4 isn’t a novel: outside the brief.","pop":"Strong sales, weak evidence. Check the sample sentence.","b6":"B6 is strong (10), but two cards score higher.","count":"Star exactly two cards. You have {n}."},"general":"Not yet. Reveal the evidence-based profiles and rank the novels by total.","why":"B1 (12) and B3 (11) score highest on the evidence. Notice that neither is the bestseller.","hints":["Reveal the evidence-based profiles.","Rank the novels by total.","B1 (12) and B3 (11)."]},{"id":"tc2","goal":5,"prompt":"Plan \u003ci>Signal\u003c/i> (360 pages) for a 30-day window with a 6-day buffer, reading the same number of pages each day at 30 pages an hour. Enter your pages per day and minutes per day. \u003cbutton type='button' class='btn ghost sm cn-setup' data-setup='plan'>Set it up\u003c/button>","_a":"HxoSSVESCAZRFEBURVQQDVcIHw==","msgs":{"none":"Enter your pages per day and minutes per day in Reading plan mode.","p12":"That uses all 30 days; you forgot the buffer.","m15":"15 pages at 30 pages an hour is half an hour: 30 minutes.","p60":"That’s 360 ÷ 6: you divided by the buffer, not the reading days."},"general":"Not yet. Reading days = window − buffer; then pages ÷ reading days, and (pages per day ÷ pages per hour) × 60 minutes.","why":"30 − 6 = 24 reading days; 360 ÷ 24 = 15 pages a day, and 15 pages at 30 pages an hour is 30 minutes.","hints":["Reading days = window − buffer.","30 − 6 = 24 days; 360 ÷ 24.","15 pages a day; 15 ÷ 30 × 60 = 30 minutes."]},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Choose a strong candidate in Lens mode and write a \u003cstrong>one-sentence justification\u003c/strong> that names \u003cstrong>two\u003c/strong> criteria and quotes the card as evidence (45 words or fewer). \u003cbutton type='button' class='btn ghost sm cn-setup' data-setup='lens'>Set it up\u003c/button>","critRe":[["c","\\bcomplex"],["cr","\\bcraft"],["a","\\bambigu"],["e","\\benduring\\b"],["cc","\\bcritical conversation"],["r","\\breread"]],"popRe":"\\b(bestsell\\w*|best-sell\\w*|popular\\w*|sales|million\\w*|viral)\\b","maxWords":45,"minScore":9,"msgs":{"none":"Write your sentence in the box under the lens.","weak":"Pick a card scoring 9 or more.","notNovel":"B4 isn’t a novel: outside the brief.","pop":"Popularity isn’t a merit criterion; swap in evidence from the writing.","one":"Name a second criterion and connect it to the evidence.","quote":"Quote the card’s own words exactly.","long":"Keep it to one sentence of 45 words or fewer."},"model":"\u003ci>The Lantern Keeper’s Daughter\u003c/i> shows craft and ambiguity from its first line, “only once did he write the truth,” which plants a mystery that could support more than one reading.","why":"Two criteria, the card’s own words as evidence, and no appeal to sales: that’s the shape of a proposal’s case.","hints":["Pick a card scoring 9 or more.","Choose two criteria that its sample sentence shows.","Template: “\u003ci>Title\u003c/i> shows [criterion] and [criterion] in ‘[quotation],’ which…”"]}]},"part3":{"slug":"proposal","name":"Proposal","heading":"Write your proposal","intro":"The lens trained your judgement; the proposal turns judgement into a commitment. Fill in each part. Everything saves on this device and feeds the performance task at the end.","b":{"details":"1. Title, author and first publication year","title":"Title","author":"Author","year":"First published (year)","type":"2. Type","types":[{"id":"novel","t":"Novel"},{"id":"other","t":"Other"}],"allow":"My teacher has approved another type for my ISU (for example, a short-story collection or memoir)","otherNo":"The ISU asks for a novel; check with your teacher if you’re unsure.","why":"3. Why this novel? Choose two criteria","whyHow":"For each criterion, write a sentence of evidence that quotes the novel, with a page number from your edition (MLA style, e.g. (Shelley 58; ch. 5), giving page then chapter).","evPh":"e.g. Shelley’s diction is grand at the moment of horror: “…” (Shelley 58; ch. 5).","iq":"4. Inquiry question","iqHow":"Begin with \u003cem>How\u003c/em>, \u003cem>Why\u003c/em>, \u003cem>To what extent\u003c/em> or \u003cem>In what ways\u003c/em>, and end with a question mark.","iqPh":"How does…?","lens":"5. Possible lens","lenses":[{"id":"character","t":"Character"},{"id":"narration","t":"Narration"},{"id":"form","t":"Form and structure"},{"id":"language","t":"Language and imagery"},{"id":"context","t":"Context"},{"id":"theme","t":"Theme"}],"plan":"6. Reading plan","planHow":"Copy your plan from Reading plan mode, or type it here.","copy":"Copy my plan from Explore","copied":"Copied your plan from Explore.","noPlan":"Set up a plan in Explore’s Reading plan mode first.","pages":"Total pages","win":"Window (days)","buf":"Buffer days","ppd":"Pages per day","teacher":"7. A note to your teacher","teacherNote":"This proposal needs your teacher’s approval before you begin."},"craft":{"title":"Check it with craft","prompt":"Which word in your question names a \u003cem>craft choice\u003c/em> (narrator, structure, image, voice)? If none, your question may be about plot, not art.","empty":"Write your inquiry question above to see it here.","words":["narrator","narrators","narration","narrative","structure","structures","image","images","imagery","voice","voices","symbol","symbols","symbolism","frame","form","diction","metaphor","metaphors","point of view","ending","opening","motif","motifs","setting","dialogue","irony","tone","style","syntax","timeline","timelines","perspective","language","repetition","chapter","chapters"],"verbs":["use","uses","shape","shapes","complicate","complicates","create","creates","reveal","reveals","suggest","suggests","turn","turns","connect","connects","track","tracks","mirror","mirrors","make","makes","develop","develops","challenge","challenges","undercut","undercuts","contrast","contrasts","transform","transforms"],"found":"Craft word found: {w}. Your question is about how the novel works.","none":"No craft word found yet. Your question may be about plot, not art."},"quickCheck":{"title":"Proposal quick check","summary":"Proposal quick check","items":[{"id":"q1","goal":4,"prompt":"Which is the strongest inquiry question?","choices":[{"t":"What happens at the end of \u003ci>The Great Gatsby\u003c/i>?","fb":"That’s plot. The strongest names a craft choice (the narrator) and an effect that can be argued.","_n":"14f97","_k":"f707cd3b"},{"t":"Is Gatsby a good person?","fb":"It names no craft choice and ends in one word. The strongest names a craft choice (the narrator) and an effect that can be argued.","_n":"15f67","_k":"215e38d5"},{"t":"Why do people like \u003ci>The Great Gatsby\u003c/i>?","fb":"That’s popularity. The strongest names a craft choice (the narrator) and an effect that can be argued.","_n":"16f77","_k":"fcf819ef"},{"t":"How does Fitzgerald’s retrospective narrator complicate our judgement of Gatsby?","fb":"Right. It names a craft choice (the narrator) and an effect that can be argued.","_n":"17f47","_k":"01292472"}]},{"id":"q2","goal":2,"prompt":"Which evidence best supports “craft” for \u003ci>Frankenstein\u003c/i>?","choices":[{"t":"The quoted line “I beheld the accomplishment of my toils,” whose grand diction clashes with the horror that follows","fb":"Right. Craft lives in the language, and this evidence quotes it.","_n":"18f57","_k":"5d8fe7c8"},{"t":"It has been made into many films","fb":"Craft lives in the language; films and fame don’t show it.","_n":"19f27","_k":"bf5700e5"},{"t":"It is famous","fb":"Craft lives in the language; films and fame don’t show it.","_n":"1af37","_k":"1e24487c"},{"t":"It is about 200 pages","fb":"Craft lives in the language; length doesn’t show it.","_n":"1bf07","_k":"f3577148"}]},{"id":"q3","goal":5,"prompt":"Your window is 21 days for a 180-page novel, with a 5-day buffer. Pages per day?","choices":[{"t":"9","fb":"21 − 5 = 16 reading days; 180 ÷ 16 = 11.25, so plan 12.","_n":"1cf17","_k":"0240559c"},{"t":"12 (rounded up from 11.25)","fb":"Right. 21 − 5 = 16 reading days; 180 ÷ 16 = 11.25, so plan 12.","_n":"1d5e7","_k":"5528e8fd"},{"t":"36","fb":"That’s 180 ÷ 5: you divided by the buffer. 21 − 5 = 16 reading days; 180 ÷ 16 = 11.25, so plan 12.","_n":"1e5d7","_k":"bd0f4e7e"},{"t":"8","fb":"21 − 5 = 16 reading days; 180 ÷ 16 = 11.25, so plan 12.","_n":"1f607","_k":"ebf5ba9c"}]},{"id":"q4","goal":6,"prompt":"Why must your teacher approve the proposal?","choices":[{"t":"Because longer books are required","fb":"Approval checks fit, not taste, and length isn’t a requirement.","_n":"1g5f7","_k":"049cb852"},{"t":"To check that you liked it","fb":"Approval checks fit, not taste.","_n":"1h627","_k":"03d04290"},{"t":"Because teachers pick all books","fb":"Approval checks fit, not taste: you choose; your teacher confirms it fits the brief.","_n":"1i617","_k":"69d6495a"},{"t":"To confirm the novel fits the ISU brief and is new to you","fb":"Right. Approval checks fit, not taste.","_n":"1j647","_k":"eabebbb7"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='cn-steal'>“It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.”\u003c/p>\u003cp class='eng-cite'>Jane Austen, \u003ci>Pride and Prejudice\u003c/i> (1813), chapter 1\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> a grand universal claim → a specific case → a comic “must”. The irony is that the “truth” belongs to the neighbourhood, not the universe.\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “It is a truth universally acknowledged, that a student in possession of a long weekend must be in want of a novel.”\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.","source":"Austen, Pride and Prejudice","save":"Save it to my commonplace book"}},"practice":{"activities":[{"id":"merit","type":"sorter","title":"Merit reason or not?","summary":"Merit reason or not?","goal":[1,2],"txt":true,"noun":"statement","instruction":"Sort each reason a student gives for choosing a book. Trivium: Logic.","boxes":[{"id":"m","label":"A merit reason"},{"id":"n","label":"Not a merit reason","sub":"(it may still be a practical one)"}],"items":[{"id":"i1","t":"“Its ending supports two different readings.”","_a":"RlVA","why":"Two defensible readings: that’s ambiguity.","wrong":{"n":"Two defensible readings is ambiguity, one of the six criteria."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","A merit reason: ambiguity."]},{"id":"i2","t":"“It’s only 150 pages.”","_a":"RlZA","why":"Length is practical, not merit.","wrong":{"m":"Length is practical, not merit. A long book isn’t automatically rich, and a short one isn’t automatically thin. Look at the sentences and the questions."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","Not a merit reason: length is practical."]},{"id":"i3","t":"“Critics have argued about its narrator for decades.”","_a":"RlVA","why":"A critical conversation, and a sign of ambiguity.","wrong":{"n":"Decades of critical argument is the critical conversation, one of the six criteria."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","A merit reason: critical conversation."]},{"id":"i4","t":"“There’s a movie with my favourite actor.”","_a":"RlZA","why":"A film shows adaptability, not literary craft.","wrong":{"m":"A film shows adaptability, not literary craft."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","Not a merit reason: a film shows adaptability, not craft."]},{"id":"i5","t":"“The narrator’s voice changes as she grows older.”","_a":"RlVA","why":"A voice that changes shows complexity and craft.","wrong":{"n":"A changing narrative voice is complexity and craft: that’s the writing."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","A merit reason: complexity and craft."]},{"id":"i6","t":"“It was number one on a bestseller list.”","_a":"RlZA","why":"Sales measure popularity.","wrong":{"m":"Sales measure popularity. Popularity tells you how many people bought it, not how much it rewards close reading."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","Not a merit reason: sales measure popularity."]},{"id":"i7","t":"“Its central question is how we live with loss.”","_a":"RlVA","why":"An enduring question about how to live.","wrong":{"n":"How we live with loss is an enduring question, one of the six criteria."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","A merit reason: an enduring question."]},{"id":"i8","t":"“It has a beautiful cover.”","_a":"RlZA","why":"The cover is the designer’s work, not the writer’s.","wrong":{"m":"A cover is the designer’s work, not the writing."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","Not a merit reason: the cover isn’t the writing."]},{"id":"i9","t":"“Its sentences reward reading aloud: rhythm and image work together.”","_a":"RlVA","why":"Language worth studying sentence by sentence: craft.","wrong":{"n":"Rhythm and image working together is craft, in the sentences themselves."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","A merit reason: craft in the sentences."]},{"id":"i10","t":"“It’s a mystery, so it can’t be serious literature.”","_a":"RlZA","why":"Genre doesn’t decide merit; the writing does. (And the claim isn’t true.)","wrong":{"m":"Genre doesn’t decide merit; the writing does. Genre is a container. A mystery can have merit if its craft, characters and questions reward close reading."},"hints":["Does it describe the \u003cem>writing\u003c/em>, the \u003cem>ideas\u003c/em>, or the \u003cem>conversation about\u003c/em> the book?","Covers, sales, films and length don’t.","Not a merit reason, and not true: genre doesn’t decide merit."]}]},{"id":"workshop","type":"mc","title":"Inquiry-question workshop","summary":"Inquiry-question workshop","goal":4,"star":true,"instruction":"Each weak question needs a revision that is arguable, names a craft choice, fits a 2000-word essay and can be answered from the novel. Choose the best revision. ★ I4–I6 go beyond the Final Check.","items":[{"id":"i1","goal":4,"prompt":"Weak question: “Is Victor Frankenstein a bad person?” Choose the best revision.","options":[{"t":"“How does Shelley’s use of nested narrators shape our sympathy for both Victor and the creature?”","why":"It names a craft choice (nested narrators) and an effect you can argue.","_n":"1k637","_k":"f08785cd"},{"t":"“Is \u003ci>Frankenstein\u003c/i> a good novel?”","why":"Still yes/no, and it judges instead of asking how.","_n":"1l667","_k":"1a7a0660"},{"t":"“What does Victor Frankenstein build in his laboratory?”","why":"Plot: one fact answers it.","_n":"1m657","_k":"2307f4a2"},{"t":"“Was Victor responsible?”","why":"Still yes/no.","_n":"1nec6","_k":"fb07d8c5"}],"hints":["Can it be answered yes or no?","Look for \u003cem>how\u003c/em> plus a craft choice.","The nested narrators and our sympathy."]},{"id":"i2","goal":4,"prompt":"Weak question: “What happens in \u003ci>Mrs Dalloway\u003c/i>?” Choose the best revision.","options":[{"t":"“Is \u003ci>Mrs Dalloway\u003c/i> hard to read?”","why":"Yes/no, and about you, not the novel’s craft.","_n":"1oed6","_k":"c3da15cf"},{"t":"“Who are the main characters?”","why":"A list, not an inquiry.","_n":"1pee6","_k":"e2775251"},{"t":"“How does Woolf’s movement between characters’ minds connect strangers across a single London day?”","why":"A craft choice (moving between minds) and an effect (connection) you can argue.","_n":"1qef6","_k":"e46d8b84"},{"t":"“When was \u003ci>Mrs Dalloway\u003c/i> published?”","why":"One fact answers it.","_n":"1rf06","_k":"fa4c15c3"}],"hints":["A list of events or characters isn’t an inquiry.","Look for a craft choice and what it does.","Woolf’s movement between minds."]},{"id":"i3","goal":4,"prompt":"Weak question: “Why is \u003ci>The Great Gatsby\u003c/i> good?” Choose the best revision.","options":[{"t":"“Why do people like Gatsby?”","why":"Popularity, not craft.","_n":"1sf16","_k":"c84ff137"},{"t":"“Is Gatsby a good person?”","why":"“Is Gatsby good?” ends in one word. Ask \u003cem>how\u003c/em> or \u003cem>why\u003c/em> the novel makes him so hard to judge.","_n":"1tf26","_k":"04366ae7"},{"t":"“What happens at the end of \u003ci>The Great Gatsby\u003c/i>?”","why":"Plot, not inquiry.","_n":"1uf36","_k":"60c91b0b"},{"t":"“To what extent does Nick’s retrospective narration turn Gatsby into a legend the novel itself doubts?”","why":"\u003cem>To what extent\u003c/em> invites a measured argument about a craft choice (retrospective narration).","_n":"1ve46","_k":"50db7dd1"}],"hints":["Why it’s “good” asks for praise, not analysis.","Look for the narrator.","Nick’s retrospective narration."]},{"id":"i4","goal":4,"star":true,"prompt":"Weak question: “How does Melville use every symbol in \u003ci>Moby-Dick\u003c/i>?” Choose the best revision.","options":[{"t":"“How does Melville make the white whale mean different things to different crew members, and what does that suggest about meaning itself?”","why":"One symbol, one effect: a question that fits 2000 words and stays open.","_n":"1we56","_k":"ad03453d"},{"t":"“What is the whale a symbol of?”","why":"Assumes one answer; Melville multiplies them.","_n":"1xf27","_k":"7dce3790"},{"t":"“What symbols are in \u003ci>Moby-Dick\u003c/i>?”","why":"A list, not an argument; and still too big.","_n":"1yf17","_k":"898faffa"},{"t":"“How long is \u003ci>Moby-Dick\u003c/i>?”","why":"Countable, not arguable.","_n":"1zf07","_k":"76d917f0"}],"hints":["“Every symbol” is too big for 2000 words.","Choose one symbol and one effect.","The whale’s many meanings."]},{"id":"i5","goal":4,"star":true,"prompt":"Weak question: “What does the green light symbolize?” Choose the best revision.","options":[{"t":"“Why do people like the green light?”","why":"Popularity, not craft.","_n":"20ef7","_k":"4a7ca344"},{"t":"“How does the shifting meaning of the green light track Gatsby’s hope from desire to illusion?”","why":"It follows a symbol as it changes across the novel: arguable, focused and answerable from the text.","_n":"21f67","_k":"81b07ad7"},{"t":"“What colour is the light at the end of Daisy’s dock?”","why":"One fact answers it.","_n":"22f57","_k":"1dc59550"},{"t":"“Is the green light important?”","why":"Yes/no; and too easy.","_n":"23f47","_k":"7740f0a4"}],"hints":["Can it be answered in one word?","Look for change across the novel.","The light’s shifting meaning."]},{"id":"i6","goal":4,"star":true,"prompt":"Weak question: “How is \u003ci>Frankenstein\u003c/i> relevant today?” Choose the best revision.","options":[{"t":"“Is \u003ci>Frankenstein\u003c/i> still worth reading today?”","why":"Yes/no, and opinion, not analysis.","_n":"24f37","_k":"e1c692f8"},{"t":"“When was \u003ci>Frankenstein\u003c/i> written?”","why":"One fact answers it.","_n":"25ea7","_k":"c4e9c18e"},{"t":"“How does the creature’s education through books complicate the question of who is the true ‘monster’?”","why":"A craft choice inside the novel (the creature’s reading) raises the question, so the essay can stay with the novel’s own evidence.","_n":"26e97","_k":"bb2a54d6"},{"t":"“Is AI like Frankenstein?”","why":"A connection worth a journal entry, but the essay needs the novel’s own evidence.","_n":"27606","_k":"9867c46f"}],"hints":["“Relevant today” invites opinion, not analysis.","Find a craft choice that raises the question.","The creature’s reading."]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Philippa","goal":[1,4,5],"instruction":"Philippa made one mistake in each proposal draft. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":1,"task":"Why this novel?","steps":["I propose \u003ci>The Great Gatsby\u003c/i> (1925) by F. Scott Fitzgerald.","It has literary merit because it was made into several famous films.","It is also short, so I can finish it quickly.","My inquiry question is how Nick’s narration shapes our view of Gatsby."],"_a":"VQ==","stepFb":["Title, author and year: correct.","","Also not a merit reason, but the first slip came earlier.","A good inquiry focus."],"fixes":[{"t":"“It has literary merit because its retrospective narrator creates ambiguity: Nick admires and judges Gatsby at once.”","why":"Right: a criterion (ambiguity) and evidence from the writing (the narrator).","_n":"28616","_k":"8efc4102"},{"t":"“It has literary merit because it is about rich people.”","why":"That’s a topic, not merit.","_n":"295e6","_k":"f27ef141"},{"t":"Sentence 2 is correct.","why":"Films show adaptability, not craft.","_n":"2a5f6","_k":"35ce96ae"},{"t":"“It has literary merit because it is very famous.”","why":"Fame isn’t merit. A film shows the story was adaptable, not that the writing rewards study.","_n":"2b646","_k":"f5dd280e"}],"hints":["Which sentence gives a reason that isn’t about the writing?","Sentence 2: films.","Replace it with a criterion and evidence."]},{"id":"e2","goal":4,"task":"My inquiry question","steps":["I propose \u003ci>Frankenstein\u003c/i> (1818) by Mary Shelley.","It shows craft in lines like “It was on a dreary night of November, that I beheld the accomplishment of my toils” (Shelley 58; ch. 5).","My inquiry question is: Is the creature evil?","I will read 10 pages a day for 24 days."],"_a":"Vg==","stepFb":["Correct.","A quotation with an MLA citation giving page and chapter: good.","","A clear plan."],"fixes":[{"t":"“My inquiry question is: What does the creature do?”","why":"Plot, not inquiry.","_n":"2c656","_k":"bed7f622"},{"t":"Sentence 3 is correct.","why":"A yes/no question ends the conversation.","_n":"2d626","_k":"2bd80176"},{"t":"“My inquiry question is: How does Shelley’s frame of nested narrators complicate the question of whether the creature is evil?”","why":"Right: \u003cem>How\u003c/em>, a craft choice (the frame of nested narrators) and an arguable effect.","_n":"2e636","_k":"fd2c9f25"},{"t":"“My inquiry question is: Is Victor evil?”","why":"Still yes/no.","_n":"2f686","_k":"67a09e2e"}],"hints":["Can the question be answered with yes or no?","Sentence 3 can.","Begin with \u003cem>How\u003c/em> and name a craft choice."]},{"id":"e3","goal":5,"task":"My reading plan","steps":["My novel, \u003ci>Mrs Dalloway\u003c/i>, has 194 pages in my edition.","I have a 28-day window and want 4 days at the end to reread and gather quotations.","So I will read 194 ÷ 28 ≈ 7 pages a day.","That will take about 15 minutes a day."],"_a":"Vg==","stepFb":["Good: you checked your own edition.","A sensible buffer.","","Follows from the slip in sentence 3."],"fixes":[{"t":"“So I will read 194 ÷ 24 ≈ 8.1, or 9 pages a day to be safe, finishing before my buffer.”","why":"Right: 28 − 4 = 24 reading days, and rounding up keeps the buffer safe.","_n":"2g696","_k":"209de49d"},{"t":"“So I will read 194 ÷ 4 ≈ 49 pages a day.”","why":"That divides by the buffer.","_n":"2he66","_k":"060ffdd7"},{"t":"Sentence 3 is correct.","why":"It divides by the whole window, so you’d finish on the last day with no buffer.","_n":"2ie56","_k":"ebad4151"},{"t":"“So I will read 7 pages a day and skip the buffer.”","why":"The buffer protects your notes. Finish reading early: leave days at the end to reread passages and gather quotations.","_n":"2je86","_k":"2b5152c7"}],"hints":["Reading days = window − buffer.","28 − 4 = 24.","194 ÷ 24, rounded up."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which book has changed how you read? What did it do that others hadn’t?"},{"id":"j2","q":"In your own words: what’s the difference between a book that’s popular and a book that has merit? Can one book be both?"},{"id":"j3","q":"Explain to a friend how you’d test whether a novel will “keep talking back” for a month."},{"id":"j4","q":"What worries you about the ISU, and what’s one thing in your plan that will help?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one opening line, from this module or from a book you love, that makes you want to keep reading. Add one sentence on what it promises.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one principle about \u003cem>choosing\u003c/em> or \u003cem>reading\u003c/em> books that you’ll carry beyond this course. Add a master’s example (a line from one of the public-domain novels here, or your chosen novel with a page number) and your own imitation or example.","placeholder":"e.g. Judge a book by its sentences, not its sales.","examples":["Call me Ishmael. (Melville, \u003ci>Moby-Dick\u003c/i>, ch. 1)","It was on a dreary night of November, that I beheld the accomplishment of my toils. (Shelley, \u003ci>Frankenstein\u003c/i>, 1818, vol. 1, ch. 4)","Mrs. Dalloway said she would buy the flowers herself. (Woolf, \u003ci>Mrs Dalloway\u003c/i>)","So we beat on, boats against the current, borne back ceaselessly into the past. (Fitzgerald, \u003ci>The Great Gatsby\u003c/i>, ch. 9)","It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife. (Austen, \u003ci>Pride and Prejudice\u003c/i>, ch. 1)"]},"artSamples":[{"p":"Judge a book by its sentences, not its sales.","m":"“My father wrote the weather every night, and only once did he write the truth” (B1). My example: “One sentence with a secret is worth a chapter of action.”"},{"p":"A great opening asks a question it doesn’t answer.","m":"“Mrs. Dalloway said she would buy the flowers herself.” My imitation: “The night my brother left, he made his bed.”"}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a criterion of literary merit, as used in this module?","options":[{"t":"Having a film adaptation","why":"A film shows the story was adaptable, not that the writing rewards study.","_n":"2ke76","_k":"e1a9284d"},{"t":"Ambiguity that supports more than one defensible reading","why":"Ambiguity is one of the six criteria: it makes room for argument.","_n":"2le26","_k":"1e930ab4"},{"t":"Being on a bestseller list","why":"Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"2me16","_k":"76719859"},{"t":"Being under 200 pages","why":"Length is practical, not merit.","_n":"2ne46","_k":"1a3c47c7"}]},"b":{"prompt":"Which best describes the criterion “critical conversation”?","options":[{"t":"It’s a long and difficult book","why":"A long book isn’t automatically rich, and a short one isn’t automatically thin. Look at the sentences and the questions.","_n":"2oe36","_k":"de10653d"},{"t":"Many readers have given it five stars online","why":"Ratings measure enjoyment, not scholarly attention.","_n":"2pee6","_k":"270c58b0"},{"t":"Critics and scholars have written about and debated the novel","why":"The critical conversation is what others have written and argued about a work.","_n":"2qed6","_k":"f2903edf"},{"t":"Characters in it have arguments","why":"That’s plot, not critical attention.","_n":"2r334","_k":"3162fe48"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A round character is one who…","options":[{"t":"is complex and can change or surprise us convincingly","why":"Forster’s test: a round character surprises in a convincing way.","_n":"2s324","_k":"f8bb648b"},{"t":"tells the story","why":"Narrators can be flat.","_n":"2t314","_k":"e9cb48f0"},{"t":"appears in every chapter","why":"Frequency isn’t depth.","_n":"2u304","_k":"508b20d8"},{"t":"is the hero","why":"Heroes can be flat; villains can be round.","_n":"2v2f4","_k":"4e2e3aea"}]},"b":{"prompt":"A novel is ambiguous when…","options":[{"t":"it has a sad ending","why":"Endings of any mood can be clear or ambiguous.","_n":"2w2e4","_k":"7e6c948c"},{"t":"it’s confusing because it’s badly written","why":"Ambiguity is controlled; confusion isn’t.","_n":"2x2d4","_k":"ad4462d6"},{"t":"its evidence supports more than one defensible reading","why":"Ambiguity is controlled: the evidence holds up more than one reading.","_n":"2y2c4","_k":"28799147"},{"t":"it has a large cast","why":"Cast size isn’t ambiguity.","_n":"2z3b4","_k":"06616941"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which is the best \u003cstrong>form\u003c/strong> for an ISU inquiry question?","options":[{"t":"“What happens when [event]?”","why":"Plot, not inquiry.","_n":"303a4","_k":"5216145b"},{"t":"“How does [author] use [craft choice] to [effect or meaning]?”","why":"It names a craft choice and an effect, so it needs an argument to answer.","_n":"312d4","_k":"0d0ae7bf"},{"t":"“Is [character] good or bad?”","why":"“Is Gatsby good?” ends in one word. Ask \u003cem>how\u003c/em> or \u003cem>why\u003c/em> the novel makes him so hard to judge.","_n":"322e4","_k":"ea151762"},{"t":"“Why is [novel] popular?”","why":"Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"332f4","_k":"81a904d4"}]},"b":{"prompt":"Which is \u003cstrong>not\u003c/strong> a good ISU inquiry question?","options":[{"t":"“How does the narrator’s unreliability shape our sense of the truth?”","why":"A good question: \u003cem>how\u003c/em>, a craft choice and an effect.","_n":"34304","_k":"818261ee"},{"t":"“Why does the author withhold the key fact until the end?”","why":"A good question: \u003cem>why\u003c/em> about a craft choice.","_n":"35294","_k":"aea146bd"},{"t":"“Did the narrator tell the truth?”","why":"It invites a yes/no answer.","_n":"362a4","_k":"d095a035"},{"t":"“To what extent does the novel’s structure mirror its theme of return?”","why":"A good question: it names structure and asks for a measured argument.","_n":"372b4","_k":"c98bd9bc"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A fictional card reads: \u003ci>The Still Point\u003c/i> (literary novel). Sample: “The river remembered what the town forgot.” Note: the ending leaves the narrator’s fate open. Which \u003cstrong>two\u003c/strong> criteria does this evidence most directly support?","options":[{"t":"Popularity and length","why":"Neither is a criterion. Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"382c4","_k":"ee40618e"},{"t":"Complexity and critical conversation","why":"One sentence and an ending can’t show critics’ views.","_n":"39354","_k":"de2edd7e"},{"t":"Craft and ambiguity","why":"Personification of the river with a striking antithesis (remembered/forgot); an open ending.","_n":"3a364","_k":"614f424a"},{"t":"Critical conversation and rereadability","why":"Nothing here shows what critics say.","_n":"3b3f5","_k":"95089565"}]},"b":{"prompt":"A fictional card reads: \u003ci>Hollow Bay\u003c/i> (literary novel). Sample: “Mother laughed at funerals and wept at weddings, and none of us ever asked why.” Note: the narrator’s view of her mother shifts across forty years. Which \u003cstrong>two\u003c/strong> criteria does this evidence most directly support?","options":[{"t":"Critical conversation and popularity","why":"Nothing here shows critics, and popularity isn’t a criterion. Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"3c3e5","_k":"8edd0b2b"},{"t":"Rereadability and sales","why":"Sales aren’t a criterion. Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"3d415","_k":"12a59da9"},{"t":"Length and ambiguity","why":"Length isn’t a criterion. A long book isn’t automatically rich, and a short one isn’t automatically thin. Look at the sentences and the questions.","_n":"3e405","_k":"d9d662e9"},{"t":"Complexity and craft","why":"A contradictory, changing character; a sentence built on reversal.","_n":"3f3b5","_k":"a0edeb92"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Your novel has 420 pages. Your window is 35 days, and you want 7 days at the end for notes. How many pages a day?","options":[{"t":"12","why":"That divides by all 35 days, leaving no buffer.","_n":"3g3a5","_k":"4a98ea6b"},{"t":"14","why":"That’s 420 ÷ 30, which doesn’t match either number.","_n":"3h3d5","_k":"19331611"},{"t":"15","why":"35 − 7 = 28 reading days; 420 ÷ 28 = 15.","_n":"3i3c5","_k":"3a6e7ff8"},{"t":"60","why":"That’s 420 ÷ 7: you divided by the buffer.","_n":"3j375","_k":"35548158"}]},"b":{"prompt":"Your novel has 300 pages. Your window is 28 days, and you want 8 days at the end for notes. How many pages a day?","options":[{"t":"15","why":"28 − 8 = 20 reading days; 300 ÷ 20 = 15.","_n":"3k365","_k":"f22e41e3"},{"t":"12","why":"That’s 300 ÷ 25.","_n":"3l394","_k":"7daa74a7"},{"t":"About 11","why":"300 ÷ 28 leaves no buffer.","_n":"3m3a4","_k":"5d27fcc6"},{"t":"About 38","why":"300 ÷ 8: you divided by the buffer.","_n":"3n374","_k":"e46b7e57"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Woolf’s \u003ci>Mrs Dalloway\u003c/i> (1925) opens: “Mrs. Dalloway said she would buy the flowers herself.” What does this opening most suggest about the novel’s potential for close study?","options":[{"t":"An opening line can’t tell you anything about a novel","why":"Overgeneralized: openings often signal a writer’s methods.","_n":"3o384","_k":"ed16e8a1"},{"t":"It proves the novel is mainly about flowers","why":"Over-literal: the flowers are a doorway, not the subject.","_n":"3p3d4","_k":"9c28dd76"},{"t":"It shows the novel is popular","why":"Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"3q3e4","_k":"dcfb89e6"},{"t":"Its ordinary act hides a question (why “herself”?), hinting at a social world and an inner life, which is evidence of craft","why":"Openings often signal a writer’s methods; this one plants a question.","_n":"3r3b4","_k":"ad966329"}]},"b":{"prompt":"\u003ci>The Great Gatsby\u003c/i> (1925) ends: “So we beat on, boats against the current, borne back ceaselessly into the past.” What does this ending most suggest about the novel’s potential for close study?","options":[{"t":"Its image of rowing forward while being pulled back compresses the novel’s tension about the past: craft and an enduring question","why":"One image holds the novel’s central tension.","_n":"3s3c4","_k":"a97eb0c1"},{"t":"It proves the novel is about boating","why":"Over-literal: the boats are a metaphor.","_n":"3t314","_k":"d232b427"},{"t":"Endings don’t matter to merit","why":"Overgeneralized: endings often hold a novel’s meaning.","_n":"3u324","_k":"4763a715"},{"t":"It shows the novel is famous","why":"A film shows the story was adaptable, not that the writing rewards study.","_n":"3vbb4","_k":"a38b5bb9"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best one-sentence justification for a proposal?","options":[{"t":"“\u003ci>Frankenstein\u003c/i> is a classic, so it has merit.”","why":"Labels aren’t evidence.","_n":"3wba4","_k":"6c2a762f"},{"t":"“\u003ci>Frankenstein\u003c/i> is about a scientist and a monster.”","why":"Plot, not merit.","_n":"3xb94","_k":"d775049c"},{"t":"“\u003ci>Frankenstein\u003c/i> is good because many people have read it.”","why":"Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"3yb84","_k":"31a944f8"},{"t":"“\u003ci>Frankenstein\u003c/i> repays study because its nested narrators create ambiguity about who deserves sympathy, a question critics have debated for two centuries.”","why":"Two criteria (ambiguity, critical conversation), each tied to the novel.","_n":"3zbf4","_k":"25e19d8e"}]},"b":{"prompt":"Which is the best one-sentence justification for a proposal?","options":[{"t":"“\u003ci>Mrs Dalloway\u003c/i> is famous and on many lists.”","why":"Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"40be4","_k":"13ec9b95"},{"t":"“\u003ci>Mrs Dalloway\u003c/i> is set in London in 1923.”","why":"A setting, not merit.","_n":"41bd4","_k":"39ca50d1"},{"t":"“\u003ci>Mrs Dalloway\u003c/i> repays study because Woolf’s shifts between characters’ minds make a single day feel like a whole life, raising enduring questions about time and connection.”","why":"A craft choice and an enduring question, each named.","_n":"42bc4","_k":"0c865df6"},{"t":"“\u003ci>Mrs Dalloway\u003c/i> is short, so I can read it twice.”","why":"A long book isn’t automatically rich, and a short one isn’t automatically thin. Look at the sentences and the questions.","_n":"43b34","_k":"5e350814"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which revision best improves this proposal sentence: “I picked this book because it looks interesting.”?","options":[{"t":"“I picked this book because my friend said so.”","why":"Hearsay, not evidence.","_n":"44b24","_k":"9ca4ccf6"},{"t":"“I chose \u003ci>The Salt Year\u003c/i> because its open ending and its family’s silences raise a question I want to argue: what a community owes the people a closing mine leaves behind.”","why":"Evidence from the book and a question worth arguing.","_n":"45354","_k":"0f956338"},{"t":"“I picked this book because it looks really, really interesting.”","why":"Intensifiers don’t add reasons.","_n":"46364","_k":"0ec276af"},{"t":"“I picked this book because it has a nice cover.”","why":"A cover isn’t the writing.","_n":"47374","_k":"4b93a157"}]},"b":{"prompt":"Which statement describes literary merit most fairly?","options":[{"t":"“Only old novels have literary merit.”","why":"Age isn’t a criterion.","_n":"48384","_k":"cf065dd3"},{"t":"“A novel has merit if it is long.”","why":"A long book isn’t automatically rich, and a short one isn’t automatically thin. Look at the sentences and the questions.","_n":"49394","_k":"955ec283"},{"t":"“Genre fiction never has literary merit.”","why":"Genre is a container. A mystery can have merit if its craft, characters and questions reward close reading.","_n":"4a3a4","_k":"7ff0b803"},{"t":"“A mystery or fantasy novel can have literary merit if its craft, characters and questions reward close reading.”","why":"Genre is a container. A mystery can have merit if its craft, characters and questions reward close reading.","_n":"4b3b4","_k":"4b7fa59c"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"You want to study how a narrator’s memory shapes the truth. Which fictional card is the best fit?","options":[{"t":"B8 \u003ci>Bestseller Summer\u003c/i>","why":"Romance plot; no memory-and-truth structure.","_n":"4c3c4","_k":"73314957"},{"t":"B1 \u003ci>The Lantern Keeper’s Daughter\u003c/i>: logbooks, two timelines, and a father who “only once” wrote the truth","why":"Memory, record and truth are built into its structure.","_n":"4d2d4","_k":"aeb9a13b"},{"t":"B2 \u003ci>Galaxy Strike 7\u003c/i>","why":"Strong plot drive; little about memory or truth.","_n":"4e2e4","_k":"8ee654e4"},{"t":"B4 \u003ci>Ten Habits of Highly Focused Teens\u003c/i>","why":"Not a novel. The ISU asks for a novel you’ll study independently. Check the brief.","_n":"4fa74","_k":"33c28bd4"}]},"b":{"prompt":"You want to study how language and power interact. Which fictional card is the best fit?","options":[{"t":"B4 \u003ci>Ten Habits of Highly Focused Teens\u003c/i>","why":"Not a novel. The ISU asks for a novel you’ll study independently. Check the brief.","_n":"4ga64","_k":"6f3390a0"},{"t":"B2 \u003ci>Galaxy Strike 7\u003c/i>","why":"Action, not language.","_n":"4ha94","_k":"3eadd7b8"},{"t":"B7 \u003ci>Signal\u003c/i>: a city where all speech is monitored, narrated by a Deaf teenager it “couldn’t hear”","why":"Speech, surveillance and who can be heard: language and power.","_n":"4ia84","_k":"7029783f"},{"t":"B5 \u003ci>Murder at Maple Inn\u003c/i>","why":"A puzzle plot; language and power aren’t its focus.","_n":"4jab4","_k":"c6d7d3dd"}]}},{"id":"a2","cat":"A","goal":1,"a":{"prompt":"A friend says, “That novel can’t have literary merit; it’s too popular.” What’s the best response?","options":[{"t":"“You’re right: popular books never have merit.”","why":"Genre is a container. A mystery can have merit if its craft, characters and questions reward close reading.","_n":"4kaa4","_k":"08492243"},{"t":"“Popularity and merit are separate questions: a popular book can have merit if it meets the criteria, and an obscure one may not.”","why":"Popularity neither proves nor disproves merit.","_n":"4lad4","_k":"3bf999c6"},{"t":"“Merit is just opinion, so it doesn’t matter.”","why":"The criteria let us argue with evidence.","_n":"4mac4","_k":"f559f553"},{"t":"“You’re wrong: popular books always have merit.”","why":"Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"4naf4","_k":"4d1d483d"}]},"b":{"prompt":"Your teacher’s list doesn’t include a novel you love. What’s the best next step?","options":[{"t":"“Choose it anyway without asking.”","why":"Approval checks fit with the brief.","_n":"4oae4","_k":"8372676b"},{"t":"“Write a short case naming two merit criteria with quoted evidence, and ask your teacher to consider it.”","why":"Make the case with evidence; approval checks fit.","_n":"4pc14","_k":"c0ef11ed"},{"t":"“Say it’s popular, so it should count.”","why":"Popularity tells you how many people bought it, not how much it rewards close reading.","_n":"4qc24","_k":"bedf65b0"},{"t":"“Pick the shortest novel on the list.”","why":"A long book isn’t automatically rich, and a short one isn’t automatically thin. Look at the sentences and the questions.","_n":"4rbf4","_k":"7f66a41c"}]}}]},"task":{"title":"Performance task: My ISU proposal","summary":"My ISU proposal","statement":"\u003cp>Write a proposal for a novel you’ll live with for a month. Make the case with evidence, ask a question worth an essay, and plan time to think. Your teacher will approve it.\u003c/p>\u003cp class='tiny muted'>Your proposal comes from the builder in Part 3. This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg cn-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Level\u003c/th>\u003cth scope='col'>Knowledge: merit criteria\u003c/th>\u003cth scope='col'>Thinking: inquiry question\u003c/th>\u003cth scope='col'>Communication: clarity and conventions\u003c/th>\u003cth scope='col'>Application: plan and reflection\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope='row'>1\u003c/th>\u003ctd>Criteria absent or confused with popularity\u003c/td>\u003ctd>Yes/no or plot question\u003c/td>\u003ctd>Unclear; citation errors\u003c/td>\u003ctd>Unrealistic plan\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>2\u003c/th>\u003ctd>Criteria named, thinly supported\u003c/td>\u003ctd>Arguable but vague\u003c/td>\u003ctd>Mostly clear; some errors\u003c/td>\u003ctd>Plan lacks a buffer or a check-in\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>3\u003c/th>\u003ctd>Criteria supported with apt quotations\u003c/td>\u003ctd>Arguable, specific and craft-focused\u003c/td>\u003ctd>Clear; MLA citations correct\u003c/td>\u003ctd>Realistic plan with a buffer\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>4\u003c/th>\u003ctd>Criteria supported with insightful, precisely chosen evidence\u003c/td>\u003ctd>Arguable, specific, craft-focused and genuinely open\u003c/td>\u003ctd>Precise, persuasive, correctly cited\u003c/td>\u003ctd>Realistic plan, plus reflective insight into reading habits\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Book details","It’s a novel","Two merit reasons","Evidence from the novel","A real inquiry question","A plan you can keep","Craft statement"],"tips":["Add the title, the author and the first publication year.","The ISU asks for a novel; check with your teacher if you’re unsure.","Choose two different criteria.","Quote the novel and add the page number in parentheses.","Start with \u003cem>How\u003c/em>, \u003cem>Why\u003c/em>, \u003cem>To what extent\u003c/em> or \u003cem>In what ways\u003c/em>, and end with a question mark.","Leave at least 3 buffer days, and check that your pages per day cover the whole book.","Explain your choice in at least 50 words."],"explainPrompt":"Craft statement: Why this novel, for you, now? What do you hope it will teach you about how writing works, and what will you do on the days the reading gets hard?","vocab":"Use the words merit, ambiguity (or complexity), inquiry and evidence.","checkLabel":"Check my proposal","success":"Your proposal has every part. Show it to your teacher for approval.","more":"Change your mind? Each complete proposal you check joins your list.","evMin":20,"iqMin":10,"iqMax":35,"craftMin":50,"bufMin":3,"labels":{"from":"Your proposal (from Part 3)","edit":"Edit my proposal in Part 3","models":"One way it can be done: three model responses","modelsNote":"Three novels, three approaches, all passing. Page numbers are illustrative: use your own edition’s."},"rubric":[["Level","Knowledge: merit criteria","Thinking: inquiry question","Communication: clarity and conventions","Application: plan and reflection"],["1","Criteria absent or confused with popularity","Yes/no or plot question","Unclear; citation errors","Unrealistic plan"],["2","Criteria named, thinly supported","Arguable but vague","Mostly clear; some errors","Plan lacks a buffer or a check-in"],["3","Criteria supported with apt quotations","Arguable, specific and craft-focused","Clear; MLA citations correct","Realistic plan with a buffer"],["4","Criteria supported with insightful, precisely chosen evidence","Arguable, specific, craft-focused and genuinely open","Precise, persuasive, correctly cited","Realistic plan, plus reflective insight into reading habits"]],"models":[{"title":"Model 1: \u003ci>Frankenstein\u003c/i> (narration and sympathy)","head":"Mary Shelley, 1818. Novel.","ev":[["Craft","Shelley’s diction is grand at the very moment of horror: “It was on a dreary night of November, that I beheld the accomplishment of my toils.” (Shelley 58; ch. 5). The formal phrasing makes Victor sound proud just before he flees from what he made."],["Ambiguity","Victor calls the creature “the miserable monster whom I had created” (Shelley 59; ch. 5), yet the creature’s own story later earns our pity, so the novel lets us argue about who the real monster is."]],"iq":"How does Shelley’s frame of nested narrators complicate our sympathy for both Victor and the creature?","lens":"Narration","plan":"220 pages; window 30; buffer 6; 24 reading days × 10 pages = 240 ≥ 220."},{"title":"Model 2: \u003ci>The Great Gatsby\u003c/i> (retrospective narration)","head":"F. Scott Fitzgerald, 1925. Novel.","ev":[["Complexity","Nick begins by recalling advice his father gave him “in my younger and more vulnerable years” (Fitzgerald 1; ch. 1), which tells us he’s looking back and has changed, so his judgements of Gatsby keep shifting."],["Enduring questions","The last line, “So we beat on, boats against the current, borne back ceaselessly into the past.” (Fitzgerald 180; ch. 9), asks whether anyone can escape the past, which is a question every reader faces."]],"iq":"To what extent does Nick’s retrospective narration turn Gatsby into a legend that the novel itself doubts?","lens":"Narration","plan":"180 pages; window 21; buffer 5; 16 reading days × 12 pages = 192 ≥ 180."},{"title":"Model 3: \u003ci>Mrs Dalloway\u003c/i> (time and consciousness)","head":"Virginia Woolf, 1925. Novel.","ev":[["Craft","Woolf leaps from an errand to a memory in a breath: “What a lark! What a plunge!” (Woolf 3), and the exclamations carry Clarissa from a London morning back to her youth in a single paragraph."],["Rereadability","The opening, “Mrs. Dalloway said she would buy the flowers herself.” (Woolf 3), looks simple on a first read, but after the novel’s ending it carries the weight of everything she has chosen and refused."]],"iq":"How does Woolf’s movement between characters’ minds connect strangers across a single London day?","lens":"Form and structure","plan":"194 pages; window 28; buffer 4; 24 reading days × 9 pages = 216 ≥ 194."}]},"cards":[["Literary merit","What a book \u003cem>earns\u003c/em> (Latin \u003cem>meritum\u003c/em>) by rewarding close attention: craft, complexity, ambiguity, enduring questions."],["Round character","Complex; can change or surprise convincingly."],["Flat character","Built around a single trait or function."],["Ambiguity","The evidence supports more than one defensible reading."],["Enduring question","A question about how to live that every generation asks again."],["Critical conversation","What critics and scholars have written and debated about a work."],["Rereadability","The book becomes richer the second time."],["Inquiry question","\u003cem>How\u003c/em>, \u003cem>why\u003c/em> or \u003cem>to what extent\u003c/em>, about a craft choice and its effect."],["Critical lens","The angle you’ll read from: character, narration, form, language, context or theme."],["Canon","The works a culture treats as central. Always ask who decided, and who’s missing."],["Reading buffer","Days at the end for rereading and gathering quotations. Reading days = window − buffer."],["“Call me Ishmael.”","\u003ci>Moby-Dick\u003c/i>’s three-word opening (1851): a voice, an invitation and a mystery."]]}};</script>
