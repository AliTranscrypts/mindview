 something that will keep you honest when you meet a big idea. Add a master’s example from today and your own imitation.","placeholder":"e.g. Ask who is missing before you decide what is central.","examples":["In the full furnace of this hour / My thoughts grow keen and clear. (Lampman, “Heat”, lines 47–48)","West wind, blow from your prairie nest, (Johnson, “The Song My Paddle Sings”, line 1)","If not, it is of no consequence, for if you know Canada at all, you are probably well acquainted with a dozen towns just like it. (Leacock, \u003ci>Sunshine Sketches\u003c/i>, chapter 1)","Take up our quarrel with the foe: (McCrae, “In Flanders Fields”, line 10)","surrounded on all sides by the dark forest (Moodie, \u003ci>Roughing It in the Bush\u003c/i>, chapter 5)"]},"artSamples":[{"p":"Ask who is missing before you decide what is central.","m":"a canon of five settler texts with no Indigenous or French voice"},{"p":"Test a big idea on the text that fits it least.","m":"Lampman’s “In the full furnace of this hour / My thoughts grow keen and clear” against the garrison thesis"}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"Which best summarizes the “garrison mentality” thesis?","options":[{"t":"Canadian writers prefer military subjects","why":"A literal misreading of “garrison”.","_n":"2k4b8","_k":"2b1e37be"},{"t":"Canadian writers picture the wilderness as a paradise","why":"The opposite of the thesis.","_n":"2l4c8","_k":"d9f08c50"},{"t":"Canadian literature is mostly about cities","why":"The thesis is about land and settlement.","_n":"2m4d8","_k":"76c85226"},{"t":"Early settler writing pictures small communities huddled against a vast, menacing land","why":"That’s Frye’s picture: a settlement turned inward against the land.","_n":"2n4e8","_k":"f931b667"}]},"b":{"prompt":"Which best summarizes the thesis of Margaret Atwood’s \u003ci>Survival\u003c/i> (1972)?","options":[{"t":"Canadian literature is mostly science fiction","why":"Unrelated.","_n":"2o4f8","_k":"f12a7a4e"},{"t":"Canadian literature is about winning wars","why":"Not her subject.","_n":"2p408","_k":"e9f885af"},{"t":"Survival, and the ways characters respond to being victims, is a central pattern in Canadian writing","why":"Survival as the central symbol, and the “Basic Victim Positions” characters take.","_n":"2q418","_k":"844436ac"},{"t":"All Canadians are victims","why":"An overstatement; she describes positions characters take.","_n":"2rc8e","_k":"36eebd5f"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which work in the collection was written in French and is often read in English translation?","options":[{"t":"\u003ci>Indian Horse\u003c/i>","why":"Written in English.","_n":"2sc9e","_k":"09695447"},{"t":"\u003ci>Obasan\u003c/i>","why":"Written in English.","_n":"2tcae","_k":"e103759c"},{"t":"Gabrielle Roy’s \u003ci>The Tin Flute\u003c/i>","why":"First published in French as \u003ci>Bonheur d’occasion\u003c/i> (1945).","_n":"2ucbe","_k":"8a3a3a25"},{"t":"\u003ci>Anne of Green Gables\u003c/i>","why":"Written in English.","_n":"2vcce","_k":"537f4d80"}]},"b":{"prompt":"Which work in the collection was written in French?","options":[{"t":"\u003ci>The Rez Sisters\u003c/i>","why":"English, with Cree and Ojibwe words.","_n":"2wcde","_k":"947e2452"},{"t":"Kim Thúy’s \u003ci>Ru\u003c/i>","why":"Written in French in Quebec, and widely read in translation.","_n":"2xcee","_k":"a3a7f68f"},{"t":"“In Flanders Fields”","why":"English.","_n":"2ycfe","_k":"0552f1f2"},{"t":"\u003ci>Sunshine Sketches of a Little Town\u003c/i>","why":"English.","_n":"2zd0e","_k":"118a170e"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"Which statement about Indigenous storytelling is accurate?","options":[{"t":"It is one single tradition shared by all Indigenous nations","why":"Many nations, many traditions.","_n":"30d1e","_k":"46c3569e"},{"t":"It ended when written literature arrived","why":"Indigenous storytelling is older than Canada and still alive, in oral and written forms, today.","_n":"31cee","_k":"44655236"},{"t":"It is a living tradition, far older than Canada, continuing in oral and written forms today","why":"Older than Canada, and still alive.","_n":"32cde","_k":"0e6f4047"},{"t":"It is a genre invented in the twentieth century","why":"Far older.","_n":"33cce","_k":"538fbb16"}]},"b":{"prompt":"E. Pauline Johnson (Tekahionwake) was…","options":[{"t":"a fictional character from \u003ci>Anne of Green Gables\u003c/i>","why":"A real poet.","_n":"34cbe","_k":"b1db3608"},{"t":"a poet and performer of Mohawk and English heritage from Six Nations who toured widely around 1900","why":"Her collected poems are \u003ci>Flint and Feather\u003c/i> (1912).","_n":"35d2e","_k":"4b09e227"},{"t":"a French-language playwright from Quebec","why":"An English-language poet from Ontario.","_n":"36d1e","_k":"7e956284"},{"t":"a twenty-first-century novelist","why":"She died in 1913.","_n":"37d0e","_k":"2abe42c4"}]}},{"id":"t1","cat":"T","goal":[2,5],"a":{"prompt":"Which passage most challenges the garrison thesis?","options":[{"t":"Lampman: “In the full furnace of this hour / My thoughts grow keen and clear.”","why":"The land sharpens the speaker; it doesn’t besiege him.","_n":"38cfe","_k":"ab79b2c3"},{"t":"Moodie’s warning against the backwoods","why":"Supports the thesis.","_n":"39d6e","_k":"0b73bc8c"},{"t":"A settler’s account of barricading a cabin against wolves in winter","why":"Supports the thesis.","_n":"3ad5e","_k":"7b2ee5a7"},{"t":"McCrae: “Take up our quarrel with the foe”","why":"About war overseas; it doesn’t test the thesis.","_n":"3bd4e","_k":"345f5c49"}]},"b":{"prompt":"Which passage best \u003cem>supports\u003c/em> the garrison thesis?","options":[{"t":"Lampman’s resting speaker in “Heat”","why":"A counterexample.","_n":"3cd5e","_k":"4c68d839"},{"t":"A settler’s account of barricading a cabin against wolves in winter","why":"A household walled in against a threatening land: the garrison picture.","_n":"3dd2e","_k":"360e8f4e"},{"t":"Johnson’s paddler calling the west wind","why":"A counterexample.","_n":"3ed3e","_k":"ba367c19"},{"t":"Leacock’s comic Mariposa","why":"Sidesteps the thesis.","_n":"3fd0e","_k":"234a5149"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"An anthology from the 1950s called “Canadian Poetry” includes thirty poets: all English-speaking, all of European descent, two of them women. What is the most defensible conclusion?","options":[{"t":"The anthology is worthless","why":"Overcorrection; it records one tradition well.","_n":"3gd1e","_k":"ccf8c889"},{"t":"There were no other poets in Canada then","why":"Johnson, for one, was famous decades earlier.","_n":"3hcee","_k":"ba643eb3"},{"t":"Anthologies are neutral records","why":"Someone chose those books for reasons. Ask what the choosers valued, and whom they left out.","_n":"3icfe","_k":"b859572d"},{"t":"It presents one perspective as if it were all of Canadian poetry, leaving out Indigenous, French-language and many women’s voices","why":"The title claims the whole; the contents show one perspective.","_n":"3jdce","_k":"56914791"}]},"b":{"prompt":"A school course on Canadian literature includes only novels published after 2000. What is the most defensible conclusion?","options":[{"t":"The course covers all of Canadian literature","why":"It covers one period. Someone chose those books for reasons. Ask what the choosers valued, and whom they left out.","_n":"3kdde","_k":"589bd81c"},{"t":"Recent novels are always better","why":"Unsupported.","_n":"3l5ae","_k":"ff228bf9"},{"t":"It hears contemporary voices but loses the conversation with earlier writers, so “Canadian literature” looks newer than it is","why":"A gain and a loss: name both.","_n":"3m59e","_k":"0034cdc3"},{"t":"Older Canadian books aren’t literature","why":"A value judgment with no basis.","_n":"3n5ce","_k":"4bc89eb5"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Read this original passage: “Every January my grandmother drilled a hole in the lake ice and handed me the line. ‘The lake feeds us,’ she said, ‘if we listen to it.’” How does it relate to the survival thesis?","options":[{"t":"It complicates it: the frozen land is home and provider, not an enemy to endure","why":"Cold, but not hostile: the lake feeds them.","_n":"3o5be","_k":"a518a8ce"},{"t":"It has nothing to do with Canada","why":"Ice fishing on a lake in January is a strongly Canadian scene.","_n":"3p5ee","_k":"f5435c71"},{"t":"It proves the thesis, because it’s cold","why":"Cold isn’t victimhood. A thesis that explains everything explains nothing. Look for the text that doesn’t fit.","_n":"3q5de","_k":"c9f5a20d"},{"t":"It supports the garrison thesis, because the town is small","why":"No town and no siege in the passage.","_n":"3r60e","_k":"39d9bfaf"}]},"b":{"prompt":"Read this original passage: “In our first winter in Winnipeg, my father learned English from the bus schedule and my mother learned it from the doctor.” How does it relate to the survival thesis?","options":[{"t":"It’s about the weather","why":"Winter is the setting, not the struggle.","_n":"3s5fe","_k":"fc387ef9"},{"t":"It moves “survival” from the wilderness to a new country’s systems: surviving language, work and belonging","why":"Survival is still there, transformed.","_n":"3t52e","_k":"7737ee55"},{"t":"It disproves survival entirely","why":"Survival is present, but transformed.","_n":"3u51e","_k":"5d1c6620"},{"t":"It isn’t Canadian literature, because the family is new to Canada","why":"Each definition is a choice. Mistry writes about India from Toronto; McCrae’s poem is set in Belgium. Are they Canadian literature?","_n":"3v60e","_k":"23cb1213"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which sentence best justifies a choice in a canon?","options":[{"t":"“I included \u003ci>Ru\u003c/i> and \u003ci>The Tin Flute\u003c/i> because a canon that hears only English misses how Quebec writers, including a refugee from Vietnam, have shaped the country’s story.”","why":"A criterion (language) and a reason it matters.","_n":"3w61e","_k":"49b5cc6c"},{"t":"“I included them because they’re good books.”","why":"No criteria.","_n":"3x62e","_k":"dcead057"},{"t":"“I included every book I’ve heard of.”","why":"No selection, so no canon.","_n":"3y63e","_k":"faac8b23"},{"t":"“I included them because they’re French.”","why":"A label, not a reason.","_n":"3z5ce","_k":"7d538731"}]},"b":{"prompt":"Which sentence best justifies a choice in a canon?","options":[{"t":"“I chose them randomly.”","why":"No criteria.","_n":"405de","_k":"726565a9"},{"t":"“I paired Johnson’s \u003ci>Flint and Feather\u003c/i> with Wagamese’s \u003ci>Indian Horse\u003c/i> to show that Indigenous writing in Canada spans more than a century, not just recent decades.”","why":"The pairing itself makes an argument about time and voice.","_n":"415ee","_k":"aa91329a"},{"t":"“I chose them because they were on a list.”","why":"Whose list, and why?","_n":"425fe","_k":"dabcfad5"},{"t":"“I chose them because they’re Indigenous.”","why":"A label, not a reason.","_n":"4358e","_k":"3147ef96"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which sentence best uses a critic’s thesis in an essay?","options":[{"t":"“\u003ci>Survival\u003c/i> is true, so ‘Heat’ must be about survival.”","why":"Report the thesis, then test it. Your conclusion comes after the evidence.","_n":"4459e","_k":"f7844834"},{"t":"“\u003ci>Survival\u003c/i> says lots of things about Canadian books.”","why":"Vague.","_n":"4566e","_k":"5774eccb"},{"t":"“Atwood is famous, so her thesis is right.”","why":"Authority isn’t evidence.","_n":"4665e","_k":"997b64bf"},{"t":"“Atwood argues in \u003ci>Survival\u003c/i> (1972) that victimhood shapes Canadian writing; Lampman’s ‘Heat’ tests that claim, since its speaker is no victim at all.”","why":"It reports the thesis, then tests it with evidence.","_n":"4764e","_k":"a0a94418"}]},"b":{"prompt":"Which sentence best uses a critic’s thesis in an essay?","options":[{"t":"“Frye is an old critic, so he’s wrong.”","why":"Age isn’t evidence.","_n":"4863e","_k":"ac869bb7"},{"t":"“Frye proves that all Canadians fear nature.”","why":"A thesis that explains everything explains nothing. Look for the text that doesn’t fit. Report the thesis, then test it. Your conclusion comes after the evidence.","_n":"4962e","_k":"0d78d39b"},{"t":"“Frye wrote about garrisons.”","why":"A fragment, not a use.","_n":"4a61e","_k":"d33dce10"},{"t":"“Frye describes settler communities that turn inward against the land; Johnson’s paddler, who calls the wind like a companion, shows a relationship his idea doesn’t cover.”","why":"It reports the thesis, then finds the case it doesn’t cover.","_n":"4b60e","_k":"96c3d2e5"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A school library display has five English-language novels from Ontario, all by authors of European descent. Which addition best broadens it, and why?","options":[{"t":"“In Flanders Fields”, because it’s famous","why":"Fame alone doesn’t broaden this display much.","_n":"4c5fe","_k":"a9f813cc"},{"t":"Tomson Highway’s \u003ci>The Rez Sisters\u003c/i>: an Indigenous playwright and a play, adding both a voice and a form","why":"One choice widens two things at once.","_n":"4d5ee","_k":"e0aecddb"},{"t":"A book chosen at random","why":"No criteria.","_n":"4e5de","_k":"1d5375bc"},{"t":"Another Ontario novel","why":"More of the same.","_n":"4fcce","_k":"74b40cb6"}]},"b":{"prompt":"A display has only books published after 2000. Which addition best broadens it, and why?","options":[{"t":"E. Pauline Johnson’s \u003ci>Flint and Feather\u003c/i> (1912): an early Indigenous voice that adds both history and perspective","why":"It reaches back a century, and adds a voice.","_n":"4gcde","_k":"de4c4267"},{"t":"A cookbook","why":"A different kind of book, but not literature in this sense.","_n":"4hcae","_k":"2790231e"},{"t":"Another recent novel","why":"More of the same.","_n":"4icbe","_k":"73f5cd30"},{"t":"A bestseller from last month","why":"Still recent.","_n":"4jd0e","_k":"31eed2ac"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A tourism ad shows an empty northern lake with the tagline “Untouched wilderness.” Which response best reflects this module’s questions?","options":[{"t":"Ads aren’t literature, so the question doesn’t apply","why":"Perspective matters in every text.","_n":"4kd1e","_k":"6ef3a66c"},{"t":"It’s accurate, since there are no buildings","why":"Absence of buildings isn’t absence of people.","_n":"4lcee","_k":"d2be633e"},{"t":"It’s a beautiful photo, so the words don’t matter","why":"Words frame how we see.","_n":"4mcfe","_k":"cb9e02d0"},{"t":"Ask whose land it is: “untouched” erases the Indigenous peoples who have lived with and cared for that land for millennia","why":"Who’s missing from the frame is the question to ask.","_n":"4nd4e","_k":"e7a21f2f"}]},"b":{"prompt":"A short historical video tells “the story of Canada” beginning in 1867. Which response best reflects this module’s questions?","options":[{"t":"Videos can’t have a perspective","why":"Every text chooses what to show.","_n":"4od5e","_k":"8008b16c"},{"t":"It starts the story at Confederation, leaving out the Indigenous nations and the long histories before it","why":"Where a story starts decides who is in it.","_n":"4pd2f","_k":"6b9efe82"},{"t":"It’s correct, because Canada began in 1867","why":"The country did; the land’s stories didn’t.","_n":"4qd1f","_k":"69befc2f"},{"t":"It’s too short to matter","why":"Short texts shape views too.","_n":"4rd4f","_k":"41bdca71"}]}}]},"task":{"title":"Performance task: Curate a canon","summary":"Curate a canon","statement":"\u003cp>Choose six works from the collection to make a small Canadian canon, then write a curator’s statement that explains your criteria, and names what your choice leaves out.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg cl-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Level\u003c/th>\u003cth scope='col'>Knowledge (the works and contexts)\u003c/th>\u003cth scope='col'>Thinking (criteria and perspective)\u003c/th>\u003cth scope='col'>Communication (statement)\u003c/th>\u003cth scope='col'>Application (connections)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope='row'>1\u003c/th>\u003ctd>Descriptions inaccurate\u003c/td>\u003ctd>No clear criteria\u003c/td>\u003ctd>Unclear; a list\u003c/td>\u003ctd>Choices unconnected\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>2\u003c/th>\u003ctd>Mostly accurate\u003c/td>\u003ctd>Criteria named, inconsistently applied\u003c/td>\u003ctd>Some justification\u003c/td>\u003ctd>Some connections\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>3\u003c/th>\u003ctd>Accurate\u003c/td>\u003ctd>Criteria applied to each choice; exclusions named\u003c/td>\u003ctd>Clear, organized justification\u003c/td>\u003ctd>Works placed in conversation with each other\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>4\u003c/th>\u003ctd>Precise and nuanced\u003c/td>\u003ctd>Criteria examined critically, including their own perspective\u003c/td>\u003ctd>Persuasive, elegant statement\u003c/td>\u003ctd>Insightful links among works, history and readers\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Exactly six works","Range across time","More than one kind of voice","More than one form","Your statement names your criteria","Your statement names what’s missing","Length"],"tips":["A canon here is exactly six. Choose carefully.","Reach back in time: add something from before 1940.","Add an Indigenous author (Johnson, Highway, Wagamese) and a work translated from French (Roy, Hébert, Thúy).","Mix your forms: a poem, a play or a memoir.","Use the word for each criterion you chose, so your reader can see your ruler.","Every canon leaves voices out. Say which.","Too short: justify each choice. Too long: cut the summaries."],"chipTip":"Choose 2 or 3 criteria chips.","explainPrompt":"Craft statement: Which of your six was hardest to include, and which was hardest to leave out? What does that tell you about your ruler?","explainLabel":"Craft statement","vocab":"Use the words canon, criteria, perspective and missing.","checkLabel":"Check my canon","success":"Your canon has every part.","more":"Try another canon with different criteria: each complete one joins your list.","min":140,"max":240,"chips":[{"id":"rep","t":"Representation","kw":"represent"},{"id":"craft","t":"Craft","kw":"craft"},{"id":"inf","t":"Influence","kw":"influen"},{"id":"hist","t":"Historical importance","kw":"histor"},{"id":"conn","t":"Connection to readers","kw":"connect"},{"id":"forms","t":"Range of forms","kw":"form"}],"missWords":["missing","left out","leaves out","absent","omit"],"labels":{"pick":"Your six works","pickHow":"Tap a card to add it to your canon; tap it again to take it off. Six slots.","copy":"Copy my Explore shelf","copied":"Copied your shelf from Explore.","noShelf":"Your Explore shelf is empty.","chips":"Criteria (choose 2 or 3)","draft":"Curator’s statement","glance":"Your canon at a glance","models":"One way it can be done: three model responses","modelsNote":"Three different rulers, three different canons. Each one names what it leaves out."},"rubric":[["Level","Knowledge (the works and contexts)","Thinking (criteria and perspective)","Communication (statement)","Application (connections)"],["1","Descriptions inaccurate","No clear criteria","Unclear; a list","Choices unconnected"],["2","Mostly accurate","Criteria named, inconsistently applied","Some justification","Some connections"],["3","Accurate","Criteria applied to each choice; exclusions named","Clear, organized justification","Works placed in conversation with each other"],["4","Precise and nuanced","Criteria examined critically, including their own perspective","Persuasive, elegant statement","Insightful links among works, history and readers"]],"models":[{"title":"Model 1: “Many places, many voices”","works":[1,4,3,8,10,12],"chips":["rep","forms"],"text":"My canon is built to represent as many ways of living in this country as six works allow. Moodie’s \u003ci>Roughing It in the Bush\u003c/i> shows a settler’s fear of the backwoods, and Johnson’s poems answer it with a Mohawk poet’s ease on the water, so the collection opens as a conversation rather than a single story. Montgomery adds Prince Edward Island and a girl’s delight in her landscape; Roy’s \u003ci>The Tin Flute\u003c/i> brings Montreal’s poverty, read in translation from French; Kogawa’s \u003ci>Obasan\u003c/i> shows a Japanese Canadian family uprooted by its own government; and Highway’s \u003ci>The Rez Sisters\u003c/i> puts Indigenous women’s humour on stage. I chose a range of forms (memoir, poetry, fiction and drama) because each form lets different voices speak. What is missing is large: there is no Black Canadian writer here, nothing from the North, and nothing written in an Indigenous language, so any reader should treat this list as a beginning."},{"title":"Model 2: “The land as a character”","works":[2,6,7,9,15,18],"chips":["craft","hist"],"text":"This canon follows one question across a century and a half of history: what does this land do to the people who live on it? Lampman’s “Heat” finds clarity in the noon glare, and McCrae’s poppies grow over soldiers far from home, so even the earliest pieces disagree. Ross’s prairie town is pressed by dust and wind; Hébert’s \u003ci>Kamouraska\u003c/i>, read in translation from French, turns snowbound Quebec into a stage for passion and crime; MacLeod’s Cape Breton families carry the sea in their blood; and Wagamese’s \u003ci>Indian Horse\u003c/i> finds healing in land and memory after a residential school. I chose each work for its craft: every writer makes landscape do the work of feeling. Left out are the cities, the North and most writing by newcomers to Canada. That is the price of choosing one theme, and a reason to read beyond this list."},{"title":"Model 3: “New Canadians, old questions”","works":[5,8,12,14,16,17],"chips":["conn","inf"],"text":"I built this canon for readers like the students in my school, many of whose families arrived recently, so connection was my first test. Leacock’s gentle mockery of a small Ontario town shows the older Canada that newcomers often hear about. Roy’s Montreal family and Thúy’s \u003ci>Ru\u003c/i>, both read in translation from French, show poverty in one century and a refugee’s arrival in another; Mistry writes about India from Toronto, reminding us that Canadian writers carry other countries with them; Brand’s Toronto children of immigrants ask what belonging means; and Highway’s \u003ci>The Rez Sisters\u003c/i> reminds every newcomer story that it takes place on Indigenous land. My second test was influence: each book changed what people expected Canadian literature to be. Missing are the poets, the Atlantic provinces and anything before 1900, so this canon speaks loudly about the present and quietly about the past."}]},"cards":[["Canon","A list of works treated as essential, from Greek \u003cem>kanōn\u003c/em>, “measuring rod”. Always ask: whose ruler?"],["Garrison mentality (Frye, 1965)","Early settler writing pictures small communities huddled against a vast, menacing land. Frye: less “Who am I?” than “Where is here?”"],["\u003ci>Survival\u003c/i> (Atwood, 1972)","“The central symbol for Canada [. . .] is undoubtedly Survival”: the “Basic Victim Positions” run up to the “creative non-victim”."],["Testing a thesis","Find support and counterexamples; narrow the claim to what the evidence shows."],["Counterexample","A case that doesn’t fit: Lampman’s “My thoughts grow keen and clear” against the garrison thesis."],["Perspective","Who is speaking, from where, and for whom. One text is one view."],["Who’s missing?","The question that reveals a canon’s or a thesis’s limits."],["Indigenous storytelling","A living tradition, older than Canada and continuing now, in many nations and forms."],["E. Pauline Johnson (Tekahionwake)","Poet and performer of Mohawk and English heritage (1861–1913): \u003ci>Flint and Feather\u003c/i>."],["“In Flanders Fields”","John McCrae, 1915: a rondeau in the voice of the dead; written in Belgium, recited every November 11."],["Literature in translation","Works like Roy’s \u003ci>The Tin Flute\u003c/i> and Thúy’s \u003ci>Ru\u003c/i>, written in French and widely read in English."],["Confederation Poets","Late-nineteenth-century poets, such as Lampman, who wrote closely about Canadian landscape."]]}};</script>
