.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}

.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}

ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}

.bins.three{grid-template-columns:minmax(0,1fr)}
}

.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}

.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}

@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--an-sound:#A84C05;--an-image:#0E7C7B;--an-figure:#7A3DB8;--an-syntax:#2343C4;--an-diction:#6B5A1E;--an-theme:#B0286F;

--an-diction-soft:rgba(107,90,30,.14);--an-theme-soft:rgba(176,40,111,.11);
--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}
:root[data-theme="dark"]{--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
.an-sound{--an-c:var(--an-sound);--an-c-soft:var(--an-sound-soft)}.an-image{--an-c:var(--an-image);--an-c-soft:var(--an-image-soft)}
.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}
.an-tag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);font-style:normal;letter-spacing:.01em;color:var(--an-c,var(--ink-2));background:var(--sheet);
border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}
.an-chip{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--an-c,var(--rule));background:var(--sheet);color:var(--ink);border-radius:999px;
padding:.25em .8em;font-size:.92rem;min-height:34px}
.an-chip[aria-pressed="true"]{background:var(--an-c-soft);font-weight:700}
.an-chip[aria-pressed="true"]::after{content:"on";font-size:.72rem;font-weight:700;color:var(--an-c)}
.an-dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--an-c,var(--ink-2));flex:0 0 auto}
.an-note{border-left:4px solid var(--an-c,var(--rule));background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;margin:0 0 6px;font-size:.92rem;max-width:none}
.eng-margin{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.eng-margin > *{min-width:0}
@media (max-width:820px){ .eng-margin{grid-template-columns:minmax(0,1fr)} }
@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}
ol.eng-poem li{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline}
ol.eng-poem li.eng-gap{height:.6em}
.eng-ln{font:400 .75rem var(--font-ui);color:var(--ink-2);text-align:right;padding-right:.9em;user-select:none}
.eng-prose p{font:400 1.08rem/1.65 var(--font-math);max-width:70ch}
.eng-prose .eng-ln{display:inline-block;min-width:3.2em;padding-right:.6em;text-align:left}
.eng-cite{font-size:.85rem;color:var(--ink-2);margin:4px 0 0}
.eng-toks{display:grid;gap:6px}
.eng-tl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.eng-tok{border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:.08em .28em;min-height:34px;min-width:24px;
font:400 1.22rem/1.3 var(--font-math)}
.eng-tok:not(:disabled):hover{border-color:var(--rule)}
.eng-tok.an{background:var(--an-c-soft)}
.eng-tok[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.eng-tok.eng-br{font:700 .9rem var(--font-ui);color:var(--ink-2);border:1.5px dashed var(--rule)}
.eng-tok.speaking,.eng-w.speaking{outline:2px solid var(--ink);outline-offset:1px;border-radius:4px}
.eng-w{transition:opacity .25s,color .25s}
.sc-syl{position:relative;display:inline-block;padding-top:.7em}

/* ENG4U 13 What is "Canadian Literature"?: hero, CanLit atlas (timeline, map, lens, canon builder), Test a thesis, task. Tokens only. */
/* poppy colour for the hero (a muted red, never pure red; lighter in dark mode) */
:root{--cl-poppy:#B23A2B}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--cl-poppy:#E58A78} }
:root[data-theme="dark"]{--cl-poppy:#E58A78}

/* radioGroup (from ENG4U 09) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips.cl-concl button{border-radius:10px;max-width:100%}
.cl-h{font-size:1rem;margin:12px 0 6px}
.cl-lab{display:block;font-weight:700;font-size:.95rem;margin:0 0 4px}

/* hero */
.cl-hero{display:grid;gap:8px}
.cl-hpoem{margin:0;font:400 1.2rem/1.55 var(--font-math);color:var(--ink)}
.cl-hl{display:block;transition:color .35s,background-color .35s;border-radius:3px}
.cl-hero.anim .cl-hl{color:var(--ink-2)}
.cl-hero.anim .cl-hl.lit{color:var(--ink)}
.cl-hl.speaking{background:var(--hi-soft)}
.cl-rw{border-radius:3px;transition:background-color .5s,box-shadow .5s}
.cl-rl{font:700 .6rem var(--font-ui);vertical-align:super;margin-left:1px;color:var(--an-sound);opacity:0;transition:opacity .5s}
.cl-hero.rA .cl-rw[data-r="A"],.cl-hero.rB .cl-rw[data-r="B"]{background:var(--an-sound-soft);box-shadow:inset 0 -2.5px 0 var(--an-sound)}
.cl-hero.rA .cl-rw[data-r="A"] .cl-rl,.cl-hero.rB .cl-rw[data-r="B"] .cl-rl{opacity:1}
.cl-poppies{display:flex;gap:10px;justify-content:center;min-height:50px;border-bottom:2px solid var(--rule);padding-bottom:2px}
.cl-pop{display:inline-block;transform:scale(.1) translateY(14px);transform-origin:50% 100%;opacity:0;transition:transform .6s cubic-bezier(.3,1.5,.5,1),opacity .4s}
.cl-pop.on{transform:none;opacity:1}
.cl-pop svg{width:32px;height:44px;display:block}
.cl-petals circle{fill:var(--cl-poppy)}
.cl-pcore{fill:var(--ink)}
.cl-stem{stroke:var(--ink-2);stroke-width:2.5;fill:none;stroke-linecap:round}
.cl-hmap{opacity:0;transition:opacity .7s}
.cl-hero.map .cl-hmap{opacity:1}
.cl-hmapsvg{width:100%;height:auto;display:block}
.cl-land{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5}
.cl-mapl{font:700 11px var(--font-ui);fill:var(--ink-2);text-anchor:middle}
.cl-ocean{font:italic 400 11px var(--font-ui);fill:var(--ink-2);text-anchor:middle}
.cl-route{fill:none;stroke:var(--pen);stroke-width:2.2;stroke-dasharray:1 6;stroke-linecap:round}
.cl-pin circle{fill:var(--pen);stroke:var(--sheet);stroke-width:2}
.cl-pin text{font:700 11px var(--font-ui);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.cl-hcap{font-weight:700;margin:0;opacity:0;transition:opacity .5s}
.cl-hero.cap .cl-hcap{opacity:1}
.cl-hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cl-whole{margin-top:2px}

/* Explore: atlas */

.cl-how{margin:0}
.cl-main{display:grid;gap:10px;min-width:0}

  padding:.35em .5em;font-size:.84rem;line-height:1.25;min-height:44px;width:100%;transition:opacity .7s,transform .4s}

/* shelf */
.cl-shelfw{min-width:0}
.cl-shelfw .cl-h{margin-top:4px}
ol.cl-slots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.cl-slot{border:1.5px solid var(--ink-2);border-left-width:6px;border-left-color:var(--pen);border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:74px;font-size:.8rem;line-height:1.25;background:var(--sheet);transition:opacity .8s;min-width:0}
.cl-slot .cl-ct{overflow-wrap:anywhere}
.cl-slot.empty{border-style:dashed;border-color:var(--rule);border-left-width:1.5px;align-items:center;justify-content:center;background:transparent}
.cl-slot.fade{opacity:.2}
.cl-slot.lift{animation:cl-lift .5s ease both}
@keyframes cl-lift{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.cl-slot .btn{margin-top:auto}
@media (max-width:900px){ ol.cl-slots{grid-template-columns:repeat(3,minmax(0,1fr))} }

/* readouts */
.cl-readw{min-width:0}
.cl-miss{margin:2px 0 0;padding-left:1.1em}
.cl-miss li{margin:2px 0}
.cl-miss del{color:var(--ink-2);text-decoration-thickness:2px}
.read > div.cl-flash{background:var(--hi-soft);border-radius:6px;padding-left:8px;padding-right:8px}
.cl-aha{border-left:4px solid var(--pen);padding:6px 10px;margin:10px 0 0;background:var(--paper);border-radius:0 6px 6px 0;font-weight:600;max-width:none}

/* map */
.cl-map{display:grid;gap:10px}
.cl-mapsvg svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.cl-mapsvg p{text-align:center;margin:2px 0 0}
.cl-rg{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5;stroke-linejoin:round;transition:fill .5s}
.cl-rg.n1{fill:var(--hi);fill-opacity:.35}
.cl-rg.n2{fill:var(--hi);fill-opacity:.6}
.cl-rg.n3{fill:var(--hi);fill-opacity:.85}
.cl-rg.sel{stroke:var(--pen);stroke-width:3}
.cl-rgl{font:700 12px var(--font-ui);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.cl-rgn{font:600 11px var(--font-ui);fill:var(--ink);text-anchor:middle;paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.cl-regs{display:flex;flex-wrap:wrap;gap:6px}
.cl-reg{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.25em .8em;min-height:36px;font-size:.9rem}
.cl-reg.has{border-color:var(--ink-2)}
.cl-reg[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cl-regn{display:inline-block;min-width:1.5em;text-align:center;font-weight:700;border-left:1px solid var(--rule);margin-left:4px;padding-left:4px}
.cl-regw .cl-h{margin-top:0}
.cl-away{border:1.5px dashed var(--ink-2);border-radius:10px;padding:8px 10px}
.cl-away-h{margin:0 0 6px;font-weight:700}
@media (max-width:560px){ .cl-mapsvg{display:none} }

/* lens */
.cl-pcards{display:flex;flex-wrap:wrap;gap:6px}
.cl-pcard{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .7em;min-height:44px;text-align:left;font-size:.9rem}
.cl-pcard.on{border-color:var(--pen);box-shadow:0 0 0 3px var(--hi-soft);font-weight:700}
.cl-fitb{font:700 .74rem var(--font-ui);background:var(--an-theme-soft);border:1.5px solid var(--an-theme);color:var(--ink);border-radius:999px;padding:0 .5em}
.cl-pempty{color:var(--ink-2);margin:4px 0}
.cl-pview{display:grid;gap:2px;min-width:0}
.cl-lenswrap{position:relative;overflow:hidden;border-radius:8px;padding:6px 6px 0}
.cl-lenswrap .eng-passage{margin-bottom:6px;position:relative}
.cl-ov{position:absolute;inset:0;background:var(--an-theme-soft);border:2px solid var(--an-theme);border-radius:8px;pointer-events:none;transform:translateX(-102%);transition:transform .7s ease}
.cl-ov.on{transform:none}
.cl-ov.hide{visibility:hidden}
.cl-ov span{position:absolute;right:8px;top:6px;font:700 .72rem var(--font-ui);color:var(--ink);background:var(--sheet);border-radius:999px;padding:0 .5em;border:1.5px solid var(--an-theme)}
.cl-mark{background:var(--hi-soft);box-shadow:inset 0 -2.5px 0 var(--pen);color:inherit;border-radius:3px;padding:0 .05em}
.cl-fit{margin:4px 0;max-width:none}
ol.eng-poem li.cl-skip{color:var(--ink-2)}
ol.eng-poem li.cl-speaking{background:var(--hi-soft);border-radius:4px}
.cl-t3{border-top:1.5px solid var(--rule);padding-top:4px}
ul.cl-t3l{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:2px}
.cl-t3l li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;border-bottom:1px solid var(--rule);padding:4px 0}
.cl-t3n{font-size:.92rem}
.cl-t3b{display:inline-flex;gap:4px}
.cl-t3b button,.cl-bc{border:1.5px solid var(--rule);border-radius:999px;background:var(--sheet);color:var(--ink);padding:.2em .75em;min-height:34px;font-size:.86rem}
.cl-t3b button[aria-pressed="true"],.cl-bc[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet);font-weight:700}
.cl-t3b button[aria-pressed="true"]::before,.cl-bc[aria-pressed="true"]::before{content:"✓ "}

/* canon builder */
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px 14px}
.cl-gera h4 small{font-weight:400;color:var(--ink-2)}
.cl-grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;margin-bottom:6px}
.cl-add{white-space:nowrap}

/* Part 3: Test a thesis */
.cl-p3{display:grid;gap:22px}
.cl-stn h3{margin:0 0 4px;font-size:1.08rem}
.cl-tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cl-tcard{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet);min-width:0}
.cl-tcard h4{margin:0 0 6px;font-size:1rem}
.cl-tcard h4 small{font-weight:400;color:var(--ink-2)}
.cl-tq{margin:0;font:400 1.06rem/1.5 var(--font-math);border-left:3px solid var(--an-theme);padding-left:10px}
.cl-tcite{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.cl-credit{margin:4px 0 6px}
.cl-gloss{max-width:none}
.cl-sums{display:grid;gap:6px}
.cl-sum{text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .7em;min-height:40px;font-size:.92rem}
.cl-sum[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft);font-weight:700}
.cl-sum[aria-pressed="true"]::before{content:"● ";font-size:.8em}
.cl-btray{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:48px;padding:8px;border:1.5px dashed var(--rule);border-radius:10px}
.cl-tile{border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.3em .6em;min-height:38px;font-size:.88rem;text-align:left}
.cl-tile.sel{border-color:var(--pen);box-shadow:0 0 0 3px var(--hi-soft)}
.cl-tile.sel::after{content:" · selected";font:700 .7rem var(--font-ui);color:var(--pen)}
.cl-bcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.cl-bcol{border:1.5px solid var(--rule);border-radius:10px;padding:6px;background:var(--paper);min-width:0}
.cl-bcolb{width:100%;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 .92rem var(--font-ui);min-height:40px}
.cl-bcolb.ready{border-color:var(--pen);border-style:dashed}
ul.cl-bin{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.cl-bpl{background:var(--sheet);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:8px;padding:6px}
.cl-bpl.st-key,.cl-bpl.st-alt{border-left-color:var(--green)}
.cl-bpl.st-bad{border-left-color:var(--red)}
.cl-bpl.st-need{border-left-color:var(--hi)}
.cl-bpl .cl-tile{width:100%}
.cl-bst{margin:4px 0;font-size:.82rem;max-width:none}
.cl-bcs{display:flex;flex-wrap:wrap;gap:4px}
.cl-bc{font-size:.76rem;min-height:28px;text-align:left;border-radius:10px}
.cl-bar{margin:8px 0 0;max-width:none}
.cl-card3{border-left:4px solid var(--an-theme);background:var(--paper);padding:8px 12px;border-radius:0 8px 8px 0;max-width:none}
.cl-s3chips{display:flex;flex-wrap:wrap;gap:6px}
.cl-frame{font:400 1.1rem/1.5 var(--font-math);margin:8px 0 4px}
.cl-s3o{margin:4px 0 0}
.cl-steal{font:400 1.25rem/1.4 var(--font-math);margin:0 0 2px}
@media (max-width:700px){ .cl-bcols{grid-template-columns:minmax(0,1fr)} }

/* practice: X6 */
.cl-x6{border-bottom:0}
.cl-x6 textarea{width:100%;min-height:90px}
.cl-model{margin-top:8px;max-width:none}

/* task */
.cl-tk{display:grid;gap:8px;min-width:0}
ol.cl-tkslots{grid-template-columns:repeat(3,minmax(0,1fr))}
.cl-tkcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:430px;overflow:auto;padding:2px;margin-top:8px;border:1px solid var(--rule);border-radius:8px}
.cl-tkc{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.3em .5em;font-size:.82rem;line-height:1.25;min-height:44px}
.cl-tkc .cl-cy{font-size:.7rem}
.cl-tkc[aria-pressed="true"]{border-color:var(--pen);border-width:2.5px;background:var(--hi-soft)}
.cl-tkc[aria-pressed="true"]::after{content:"✓ chosen";font:700 .7rem var(--font-ui);color:var(--ink)}
.cl-dw{margin:4px 0}
.cl-dw-ta{width:100%;min-height:240px}
.cl-dw-n{font-size:.88rem}
.cl-dw-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:.9rem}
.cl-dw-cmp p{max-width:none;margin:0 0 4px}
.cl-dw-cmp del{text-decoration-thickness:2px;color:var(--ink-2)}
.cl-dw-cmp ins{text-decoration-thickness:2px;background:var(--hi-soft)}
ul.cl-glance{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:.92rem}
.cl-models .cl-model{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.cl-model h5{margin:0 0 4px;font-size:.95rem}
.cl-model p{font-size:.94rem;max-width:none}
.cl-rubric{margin-top:8px}
.art-samples{margin:0 0 14px}.art-samples .an-note{margin-bottom:6px}
@media (max-width:560px){ .cl-dw-cmp{grid-template-columns:minmax(0,1fr)} .cl-grid{grid-template-columns:minmax(0,1fr)} }
.cl-slotc{border:1.5px dashed var(--ink-2);border-radius:8px;padding:6px 10px;font-size:.88rem;max-width:none;margin:4px 0 8px}

"slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"e0eab6b3","content":{"id":"13-what-is-canlit","kind":"topic","title":"What is “Canadian literature”?","topic":"What is “Canadian Literature”?","readyTopic":"testing what counts as Canadian literature","hero":{"headline":"Is this a Canadian poem?","text":"It was written in 1915 by John McCrae, a doctor from Guelph, Ontario, serving near Ypres in Belgium. It’s set in Belgium, it has been recited on November 11 for over a century, and it’s on the back of a Canadian bill. So: is it Canadian literature because of its author, its readers, or its story? In this module you’ll test the big theories of what makes writing Canadian, and then build a \u003cstrong>canon\u003c/strong> of your own: a short list you can defend.","fig":{"html":"\u003cdiv class='cl-hero' id='cl-hero' role='group' aria-label='The first stanza of In Flanders Fields. As each line is read, a poppy blooms in a row along the bottom. The rhyme words blow, row and below glow together, then sky and fly. Beneath the poem, a simple map shows two pins, one at Guelph in Ontario and one near Ypres in Belgium, joined by a dotted line across the Atlantic.'>\u003c/div>","caption":""},"stanza":["In Flanders fields the poppies blow","Between the crosses, row on row,","That mark our place; and in the sky","The larks, still bravely singing, fly","Scarce heard amid the guns below."],"rhymes":[[0,"blow","A"],[1,"row,","A"],[4,"below.","A"],[2,"sky","B"],[3,"fly","B"]],"cite":"John McCrae, “In Flanders Fields,” lines 1–5","full":["In Flanders fields the poppies blow","Between the crosses, row on row,","That mark our place; and in the sky","The larks, still bravely singing, fly","Scarce heard amid the guns below.","","We are the Dead. Short days ago","We lived, felt dawn, saw sunset glow,","Loved and were loved, and now we lie,","In Flanders fields.","","Take up our quarrel with the foe:","To you from failing hands we throw","The torch; be yours to hold it high.","If ye break faith with us who die","We shall not sleep, though poppies grow","In Flanders fields."],"fullCite":"John McCrae, “In Flanders Fields” (1915), text of \u003ci>In Flanders Fields and Other Poems\u003c/i> (1919)","pins":{"home":"Guelph, Ontario","away":"near Ypres, Belgium","ocean":"Atlantic Ocean"},"caption":"Written where? About where? For whom?","listen":"Listen","watch":"Watch again","wholeLabel":"Read the whole poem","poppyLabel":"poppy","noVoice":"Read it yourself: say each line slowly, and let the rhymes ring."},"goals":["I can explain competing definitions of “Canadian literature” and what each includes and excludes.","I can summarize a critical thesis (the garrison mentality, survival) in my own words and test it against texts.","I can identify the perspective a text or collection represents, and who is missing from it.","I can build and justify a small canon using clear criteria.","I can read public-domain Canadian texts closely for how they picture land and community.","I can describe Indigenous storytelling as a living tradition, not a “before” to Canadian literature."],"start":{"blocks":[{"title":"Word story: canon","html":"\u003cp>\u003cstrong>\u003cem>Canon\u003c/em>\u003c/strong> comes from Greek \u003cem>kanōn\u003c/em>, a straight rod or reed used for measuring: a rule. It came to mean the list of books a community accepted as sacred, then the list of works treated as essential. Every canon is a measuring rod, and the useful question is always: whose ruler?\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Imagery and setting","goal":5,"prompt":"In “The larks, still bravely singing, fly / Scarce heard amid the guns below,” what contrast does McCrae draw?","options":[{"t":"Fragile, persistent life (the larks’ song) against the overwhelming noise of war","why":"“Still” and “bravely” make the birds persist; “scarce heard” shows what drowns them out.","_n":"0587","_k":"54d69126"},{"t":"Day against night","why":"No time-of-day contrast here.","_n":"15b7","_k":"d0d6f96a"},{"t":"Canada against Belgium","why":"The lines contrast sounds, not countries.","_n":"25a7","_k":"4c642652"},{"t":"Hope against faith","why":"Abstract labels with no anchor in the text: which words show hope, or faith?","_n":"35d7","_k":"90c882f2"}],"hints":["Which two sounds are in these lines?","Birdsong and guns.","Life persisting under war."]},{"id":"w2","skill":"Imagery and setting","goal":5,"prompt":"Which phrase makes the setting feel most like a graveyard?","options":[{"t":"“the poppies blow”","why":"Poppies later became a remembrance symbol, but here they are flowers in wind.","_n":"45c7","_k":"8cb0d08a"},{"t":"“still bravely singing”","why":"That describes the larks.","_n":"55f7","_k":"517e0102"},{"t":"“in the sky”","why":"The sky isn’t the graveyard image.","_n":"65e7","_k":"ad5728da"},{"t":"“Between the crosses, row on row”","why":"Rows of crosses: grave markers.","_n":"7617","_k":"d6c91819"}],"hints":["What marks a grave?","Crosses.","Rows of crosses."]},{"id":"w3","skill":"Perspective and point of view","goal":3,"prompt":"Who speaks in “In Flanders Fields”?","options":[{"t":"A living general","why":"Look at who says “we”: the speakers are the dead, not a commander.","_n":"8607","_k":"29d99200"},{"t":"The dead soldiers, speaking together as “we”","why":"“We are the Dead. Short days ago / We lived…”","_n":"9387","_k":"1b52e249"},{"t":"The poppies","why":"That confuses the image with the speaker. The poppies are part of what the speakers see.","_n":"a397","_k":"e2b1922f"},{"t":"McCrae himself, describing his own death","why":"That confuses poet and speaker. McCrae wrote the poem; the speaker is the dead “we”.","_n":"b3a7","_k":"eb7356e4"}],"hints":["Find the pronoun.","“We are the Dead.”","The fallen soldiers."]},{"id":"w4","skill":"Perspective and point of view","goal":3,"prompt":"A diary of a nineteenth-century English settler describes the forest as dark, dangerous and empty. What is the most careful way to read it?","options":[{"t":"As proof that everyone feared the forest","why":"That overgeneralizes from one writer to everyone.","_n":"c3b7","_k":"c4277f12"},{"t":"As fiction that can be ignored","why":"That dismisses the document. A diary is real evidence, of one person’s view.","_n":"d3c7","_k":"239ca44c"},{"t":"As one settler’s perspective: the forest was not empty to the Indigenous peoples who lived there","why":"A diary records its writer’s view. Ask who else was there, and whose view is missing.","_n":"e3d7","_k":"3290d971"},{"t":"As a fact about the forest","why":"That treats one perspective as true for everyone.","_n":"f3e7","_k":"4cce63c4"}],"hints":["Who wrote it?","Was the forest empty to everyone?","One perspective among many."]},{"id":"w5","skill":"Evaluating a claim with evidence","goal":2,"prompt":"A classmate claims, “All Canadian poems are about winter.” What’s the best response?","options":[{"t":"Count the winter poems you know","why":"Confirming instances can’t prove “all”. A thesis that explains everything explains nothing.","_n":"g3f7","_k":"18db67f2"},{"t":"Look for a counterexample, such as a Canadian poem about summer heat, and test the claim against it","why":"One counterexample defeats an “all” claim.","_n":"h407","_k":"8e7b4441"},{"t":"Ignore it; claims about literature can’t be tested","why":"They can: look for the poem that doesn’t fit.","_n":"i417","_k":"eb429c3e"},{"t":"Agree, because Canada is cold","why":"A stereotype isn’t evidence.","_n":"j4a8","_k":"c07f1a2c"}],"hints":["How do you disprove an “all” claim?","Find one that doesn’t fit.","A counterexample."]},{"id":"w6","skill":"Evaluating a claim with evidence","goal":2,"prompt":"Which evidence best supports the claim “Many early settler writers feared the wilderness”?","options":[{"t":"Several settler memoirs that describe the bush as threatening, from different writers","why":"Several sources, directly on point.","_n":"k498","_k":"e904bb4a"},{"t":"A poem that celebrates a lake","why":"That’s a counterexample, not support.","_n":"l4c8","_k":"6856bb58"},{"t":"A single modern film set in a forest","why":"Wrong period, wrong kind of source.","_n":"m4b8","_k":"f47d9098"},{"t":"The fact that Canada is large","why":"A fact, but not evidence about writers’ attitudes.","_n":"n4e8","_k":"6d1c1a5c"}],"hints":["Evidence must match the claim’s time and subject.","Settler writing, more than one.","Several settler memoirs, from different writers."]}],"refreshers":{"Imagery and setting":"Notice what senses an image calls on, and what it sets against what: song against guns, crosses in rows.","Perspective and point of view":"The speaker isn’t always the author, and an author’s view is one view. Ask: who is speaking, from where, and who isn’t heard?","Evaluating a claim with evidence":"“All” and “every” claims fall to one counterexample. Support should match the claim’s time, place and subject, and come from more than one source."}}},"explore":{"heading":"CanLit map and timeline","intro":"Here is a collection of eighteen works, from 1852 to 2012. Explore them by time and by place, try on the big theories as lenses, and then build a canon that you could defend.","modes":[{"id":"timeline","t":"Timeline"},{"id":"map","t":"Map"},{"id":"lens","t":"Lens"},{"id":"canon","t":"Canon builder"}],"how":{"timeline":"Tap a card to read about it, then add it to your canon. Filter by form, language or Indigenous author.","map":"Regions light up as works arrive on your shelf. Tap a region to see what’s set there.","lens":"Choose a lens, then tap a passage card to see its lens fit. Mark a line, or test the garrison thesis below.","canon":"Choose up to six works. The readouts and “Who’s missing?” update as you go."},"works":[{"n":1,"t":"\u003ci>Roughing It in the Bush\u003c/i>","au":"Susanna Moodie","yr":1852,"form":"Memoir","era":"settler","set":"Upper Canada (Ontario)","reg":["on"],"lang":"en","langT":"English","ind":"","pas":"moodie","d":"An English gentlewoman’s sketches of settling in the backwoods of Upper Canada in the 1830s, written partly as a warning to genteel emigrants."},{"n":2,"t":"“Heat”","au":"Archibald Lampman","yr":1888,"form":"Poetry","era":"conf","set":"Ontario","reg":["on"],"lang":"en","langT":"English","ind":"","pas":"lampman","d":"A speaker rests by a dusty country road at noon in midsummer, and finds that the heat sharpens his mind."},{"n":3,"t":"\u003ci>Anne of Green Gables\u003c/i>","au":"L. M. Montgomery","yr":1908,"form":"Fiction","era":"early","set":"Prince Edward Island","reg":["atl"],"lang":"en","langT":"English","ind":"","d":"An orphan girl sent by mistake to a Prince Edward Island farm delights in its landscape and wins over the people around her."},{"n":4,"t":"\u003ci>Flint and Feather\u003c/i>","au":"E. Pauline Johnson (Tekahionwake)","yr":1912,"form":"Poetry","era":"early","set":"Ontario and across Canada","reg":["on"],"lang":"en","langT":"English","ind":"Mohawk","pas":"johnson","d":"The collected poems of a Mohawk and English poet-performer: canoe songs, landscapes, and poems on Indigenous history and identity."},{"n":5,"t":"\u003ci>Sunshine Sketches of a Little Town\u003c/i>","au":"Stephen Leacock","yr":1912,"form":"Fiction","era":"early","set":"Ontario","reg":["on"],"lang":"en","langT":"English","ind":"","pas":"leacock","d":"Affectionate comic sketches of Mariposa, a small Ontario town, told by a wry narrator who talks straight to “you”."},{"n":6,"t":"“In Flanders Fields”","au":"John McCrae","yr":1915,"form":"Poetry","era":"early","set":"Belgium (written in wartime)","reg":[],"away":"Belgium","lang":"en","langT":"English","ind":"","pas":"mccrae","d":"A rondeau in the voice of dead soldiers, written by a Canadian army doctor near Ypres during the First World War."},{"n":7,"t":"\u003ci>As For Me and My House\u003c/i>","au":"Sinclair Ross","yr":1941,"form":"Fiction","era":"mid","set":"Prairies","reg":["prairies"],"lang":"en","langT":"English","ind":"","d":"The diary of a minister’s wife in a drought-stricken prairie town during the Depression, isolated as the wind and dust press in."},{"n":8,"t":"\u003ci>The Tin Flute\u003c/i> (\u003ci>Bonheur d’occasion\u003c/i>)","au":"Gabrielle Roy","yr":1945,"form":"Fiction","era":"mid","set":"Quebec (Montreal)","reg":["qc"],"lang":"fr","langT":"French (in translation)","ind":"","d":"A working-class family struggles with poverty in wartime Montreal. Written in French; widely read in English translation."},{"n":9,"t":"\u003ci>Kamouraska\u003c/i>","au":"Anne Hébert","yr":1970,"form":"Fiction","era":"boom","set":"Quebec","reg":["qc"],"lang":"fr","langT":"French (in translation)","ind":"","d":"In snowbound nineteenth-century Quebec, a woman relives a love affair and a murder. Written in French; read here in translation."},{"n":10,"t":"\u003ci>Obasan\u003c/i>","au":"Joy Kogawa","yr":1981,"form":"Fiction","era":"plural","set":"British Columbia and Alberta","reg":["bc","prairies"],"lang":"en","langT":"English","ind":"","d":"A Japanese Canadian woman remembers how her family was forcibly removed from the coast by its own government during the Second World War."},{"n":11,"t":"\u003ci>The Handmaid’s Tale\u003c/i>","au":"Margaret Atwood","yr":1985,"form":"Fiction","era":"plural","set":"A future United States","reg":[],"away":"A future United States","lang":"en","langT":"English","ind":"","d":"A dystopian novel set in a future theocracy that has replaced the United States, told by a woman whose freedoms have been taken away."},{"n":12,"t":"\u003ci>The Rez Sisters\u003c/i>","au":"Tomson Highway","yr":1986,"form":"Drama","era":"plural","set":"Ontario (Manitoulin Island)","reg":["on"],"lang":"en","langT":"English, with Cree and Ojibwe words","ind":"Cree","d":"A comic, moving play about seven women from a reserve on Manitoulin Island who set out together to win the biggest bingo in the world."},{"n":13,"t":"\u003ci>In the Skin of a Lion\u003c/i>","au":"Michael Ondaatje","yr":1987,"form":"Fiction","era":"plural","set":"Ontario (Toronto)","reg":["on"],"lang":"en","langT":"English","ind":"","d":"Immigrant workers build early twentieth-century Toronto’s bridges and waterworks, in a novel about whose labour history remembers."},{"n":14,"t":"\u003ci>A Fine Balance\u003c/i>","au":"Rohinton Mistry","yr":1995,"form":"Fiction","era":"plural","set":"India","reg":[],"away":"India","lang":"en","langT":"English","ind":"","d":"Four strangers share a small apartment in an Indian city during the political Emergency of the 1970s. Mistry wrote it in Toronto."},{"n":15,"t":"\u003ci>No Great Mischief\u003c/i>","au":"Alistair MacLeod","yr":1999,"form":"Fiction","era":"plural","set":"Nova Scotia (Cape Breton)","reg":["atl"],"lang":"en","langT":"English","ind":"","d":"Generations of a Scottish-descended family on Cape Breton Island, held together by memory, the sea and the mines."},{"n":16,"t":"\u003ci>What We All Long For\u003c/i>","au":"Dionne Brand","yr":2005,"form":"Fiction","era":"plural","set":"Ontario (Toronto)","reg":["on"],"lang":"en","langT":"English","ind":"","black":true,"d":"Four young friends, children of immigrants, look for belonging in present-day Toronto."},{"n":17,"t":"\u003ci>Ru\u003c/i>","au":"Kim Thúy","yr":2009,"form":"Fiction","era":"plural","set":"Quebec and Vietnam","reg":["qc"],"lang":"fr","langT":"French (in translation)","ind":"","d":"Short fragments of memory from a girl who fled Vietnam by boat and grew up in Quebec. Written in French; read in translation."},{"n":18,"t":"\u003ci>Indian Horse\u003c/i>","au":"Richard Wagamese","yr":2012,"form":"Fiction","era":"plural","set":"Ontario","reg":["on"],"lang":"en","langT":"English","ind":"Ojibwe","d":"An Ojibwe man looks back on residential school, the hockey that kept him going, and the healing he finds in land and memory."}],"eras":[{"id":"settler","t":"Settler","d":"before 1867"},{"id":"conf","t":"Confederation","d":"1867–1899"},{"id":"early","t":"Early 20th century","d":"1900–1939"},{"id":"mid","t":"Mid-century","d":"1940–1966"},{"id":"boom","t":"Boom","d":"1967–1980"},{"id":"plural","t":"Plural voices","d":"1981–present"}],"regions":[{"id":"bc","t":"British Columbia","miss":"No British Columbia"},{"id":"prairies","t":"Prairies","miss":"No Prairies"},{"id":"on","t":"Ontario","miss":"No Ontario"},{"id":"qc","t":"Quebec","miss":"No Quebec"},{"id":"atl","t":"Atlantic Canada","miss":"No Atlantic Canada"},{"id":"north","t":"The North","miss":"Nothing set in the North"}],"passages":[{"id":"moodie","short":"Moodie","label":"Moodie, \u003ci>Roughing It in the Bush\u003c/i> (excerpt)","card":"Moodie’s account of the backwoods","kind":"prose","text":["The scenery through which we were passing was so new to me, so unlike anything that I had ever beheld before, that in spite of its monotonous character, it won me from my melancholy, and I began to look about me with considerable interest. Not so my English servant, who declared that the woods were frightful to look upon; that it was a country only fit for wild beasts; that she hated it with all her heart and soul, and would go back as soon as she was able.","[. . .] Just then, the carriage turned into a narrow, steep path, overhung with lofty woods, and after labouring up it with considerable difficulty, and at the risk of breaking our necks, it brought us at length to a rocky upland clearing, partially covered with a second growth of timber, and surrounded on all sides by the dark forest.","[. . .] I begged the man to stay until he [Moodie] arrived, as I felt terrified at being left alone in this wild, strange-looking place."],"cite":"Susanna Moodie, \u003ci>Roughing It in the Bush\u003c/i> (1852), chapter 5, “Our First Settlement, and the Borrowing System”","lines":["the woods were frightful to look upon","surrounded on all sides by the dark forest","I felt terrified at being left alone in this wild, strange-looking place"],"fit":{"garrison":["Strong fit","the bush as threat; the settler household as refuge"],"survival":["Strong fit","hardship endured"],"speaking":["An English gentlewoman newly arrived as a settler",""]}},{"id":"lampman","short":"Lampman","label":"Lampman, “Heat”","card":"Lampman’s “Heat”","kind":"verse","listen":true,"text":[{"n":1,"t":"From plains that reel to southward, dim,"},{"gap":true},{"n":47,"t":"In the full furnace of this hour"},{"n":48,"t":"My thoughts grow keen and clear."}],"cite":"Archibald Lampman, “Heat,” \u003ci>Among the Millet\u003c/i> (1888), lines 1 and 47–48","lines":["From plains that reel to southward, dim,","In the full furnace of this hour / My thoughts grow keen and clear."],"fit":{"garrison":["Counterexample","the land clarifies; it doesn’t threaten"],"survival":["Weak","no victim here"],"speaking":["A Canadian-born poet in an Ontario summer",""]}},{"id":"johnson","short":"Johnson","label":"Johnson, “The Song My Paddle Sings”","card":"Johnson’s paddle song","kind":"verse","text":[{"n":1,"t":"West wind, blow from your prairie nest,"}],"cite":"E. Pauline Johnson (Tekahionwake), “The Song My Paddle Sings” (1895), line 1, as printed in \u003ci>Flint and Feather\u003c/i> (1912)","lines":["West wind, blow from your prairie nest,"],"fit":{"garrison":["Counterexample","the wind is addressed like a partner"],"survival":["Weak",""],"speaking":["A Mohawk and English poet-performer, at ease on the water",""]}},{"id":"leacock","short":"Leacock","label":"Leacock, the Mariposa opening","card":"Leacock’s Mariposa","kind":"prose","text":["I don’t know whether you know Mariposa. If not, it is of no consequence, for if you know Canada at all, you are probably well acquainted with a dozen towns just like it."],"cite":"Stephen Leacock, \u003ci>Sunshine Sketches of a Little Town\u003c/i> (1912), chapter 1, “The Hostelry of Mr. Smith”","lines":["I don’t know whether you know Mariposa.","If not, it is of no consequence, for if you know Canada at all, you are probably well acquainted with a dozen towns just like it."],"fit":{"garrison":["Sidesteps","a comic, comfortable small town; no wilderness"],"survival":["Weak",""],"speaking":["A wry, affectionate narrator talking to “you”",""]}},{"id":"mccrae","short":"McCrae","label":"McCrae, “In Flanders Fields”","card":"McCrae’s poppies","kind":"verse","listen":true,"text":[{"n":1,"t":"In Flanders fields the poppies blow"},{"n":2,"t":"Between the crosses, row on row,"},{"n":3,"t":"That mark our place; and in the sky"},{"n":4,"t":"The larks, still bravely singing, fly"},{"n":5,"t":"Scarce heard amid the guns below."},{"gap":true},{"n":6,"t":"We are the Dead. Short days ago"},{"n":7,"t":"We lived, felt dawn, saw sunset glow,"},{"n":8,"t":"Loved and were loved, and now we lie,"},{"n":9,"t":"In Flanders fields."},{"gap":true},{"n":10,"t":"Take up our quarrel with the foe:"},{"n":11,"t":"To you from failing hands we throw"},{"n":12,"t":"The torch; be yours to hold it high."},{"n":13,"t":"If ye break faith with us who die"},{"n":14,"t":"We shall not sleep, though poppies grow"},{"n":15,"t":"In Flanders fields."}],"cite":"John McCrae, “In Flanders Fields” (1915), lines 1–15, text of \u003ci>In Flanders Fields and Other Poems\u003c/i> (1919)","lines":["In Flanders fields the poppies blow / Between the crosses, row on row,","Take up our quarrel with the foe:","If ye break faith with us who die / We shall not sleep, though poppies grow / In Flanders fields."],"fit":{"garrison":["Doesn’t apply","war overseas, not the Canadian land"],"survival":["Partial","the dead refuse to let death end their cause (“Take up our quarrel with the foe”)"],"speaking":["The dead, speaking as “we”",""]}}],"lenses":[{"id":"garrison","t":"Garrison (Frye)","name":"Garrison lens"},{"id":"survival","t":"Survival (Atwood)","name":"Survival lens"},{"id":"speaking","t":"Who’s speaking?","name":"Who’s speaking?"}],"band":"Indigenous oral and written storytelling: thousands of years, continuing now","elsewhere":"Set elsewhere: still Canadian literature?","filters":{"form":"Form","lang":"Language","ind":"Indigenous author","all":"All","yes":"Yes","en":"English","fr":"French (in translation)"},"readout":{"chosen":"Works chosen","eras":"Eras represented","langs":"Languages","ind":"Indigenous authors","forms":"Forms","span":"Span","missing":"Who’s missing?","lens":"Lens","passage":"Passage","fit":"Lens fit","line":"Line marked","test":"Your test of the garrison thesis","open":"Card","shelf":"On your shelf"},"fixedMissing":{"indLang":"No work written in an Indigenous language","black":"No Black Canadian writer in this selection"},"langMissing":{"en":"No English-language work","fr":"No French-language work"},"aha":"Every theory lights up some texts and leaves others dark, and every selection of six leaves most voices out. The question isn’t “Which is the real Canadian literature?” but “What does each way of choosing let us see, and what does it hide?”","lensNote":"A lens is a way of seeing, not a rule for reading. Fit labels are always words.","predictions":[{"id":"p1","start":{"mode":"lens","lens":"garrison"},"prompt":"Which public-domain passage do you predict fits the garrison thesis best?","options":[{"t":"Lampman’s “Heat”","_n":"o4d8","_k":"4c5e1294"},{"t":"Leacock’s Mariposa","_n":"p508","_k":"0b173dc4"},{"t":"Moodie’s account of the backwoods","_n":"q4f8","_k":"b371ad73"},{"t":"McCrae’s poppies","_n":"r428","_k":"accb7937"}],"explain":"Moodie’s settler household braced against the bush is exactly the picture the thesis describes. Other texts don’t share it."},{"id":"p2","start":{"mode":"canon","canon":[1,2,4,8,12,18]},"cut":1930,"prompt":"Remove every work written before 1930. What happens to the “Indigenous authors” readout?","options":[{"t":"It drops to 0","_n":"s418","_k":"957c7d5d"},{"t":"It stays at 3","_n":"t447","_k":"505db4b6"},{"t":"It drops from 3 to 2","_n":"u457","_k":"4a3d8429"},{"t":"It rises","_n":"v427","_k":"60544bfa"}],"explain":"Cutting early works quietly erases an early Indigenous voice. How you set the dates is a choice about who counts."},{"id":"p3","start":{"mode":"lens","lens":"survival","pas":"lampman"},"prompt":"Predict the fit of the survival lens on “Heat”.","options":[{"t":"Strong, because all Canadian poems are about survival","_n":"w437","_k":"6f61ae62"},{"t":"Strong: the heat is killing him","_n":"x407","_k":"46a4883e"},{"t":"Weak: the speaker rests in the heat, and his “thoughts grow keen and clear”, so there is no struggle to survive","_n":"y417","_k":"62f105e1"},{"t":"The lens can’t read poems","_n":"z3e7","_k":"118183b8"}],"explain":"A lens that fits everything is no longer telling you anything. “Heat” is a useful test."},{"id":"p4","start":{"mode":"canon","canon":[1,3,4,10,15]},"add":17,"prompt":"Add Kim Thúy’s \u003ci>Ru\u003c/i>. Which readout changes?","options":[{"t":"Only the regions row","_n":"103f7","_k":"26478cb8"},{"t":"Languages: French (in translation) goes from 0 to 1","_n":"114c7","_k":"19b02cd2"},{"t":"Nothing","_n":"124d7","_k":"422f24e9"},{"t":"The forms row","_n":"13d68","_k":"c463c417"}],"explain":"One book adds a language, Quebec, and a refugee’s arrival story. Choices widen or narrow the conversation."}],"chalIntro":"Use the timeline, the map, the lenses and the canon builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,4],"prompt":"Build a six-work collection that spans at least four eras and includes at least one Indigenous author and at least one work translated from French. \u003cbutton type='button' class='btn ghost sm cl-setup' data-setup='canon'>Set it up\u003c/button>","msgs":{"count":"A canon here is exactly six. You have {n}.","eras":"Your shelf covers {n} eras. Reach further back: before 1940 there are works from the Settler, Confederation and Early 20th century eras.","ind":"Who’s speaking? Add Johnson, Highway or Wagamese.","fr":"Quebec is missing. Add Roy, Hébert or Thúy."},"why":"Four eras, an Indigenous voice and a work from Quebec: a small shelf that already talks across time, language and nation. Now read “Who’s missing?”: even this shelf leaves most voices out.","hints":["Check the eras row first.","One pre-1900 work, one early 20th-century work, one mid-century and one recent gives four.","For example: Moodie, Johnson, Roy, Kogawa, Highway, Thúy."]},{"id":"tc2","goal":2,"prompt":"Find a counterexample to the garrison thesis: choose the passage and the line that challenge it most clearly. \u003cbutton type='button' class='btn ghost sm cl-setup' data-setup='lens'>Set it up\u003c/button>","_a":"PmtHDQNbEl4EXkdNU2tOaEdaCgkMRQ1dRxxVPD8=","msgs":{"none":"Tap a passage card, then mark the line that challenges the thesis.","moodie":"Moodie \u003cem>supports\u003c/em> the thesis; her fear of the bush is the garrison feeling.","mccrae":"This poem is about war overseas, not the Canadian land. It doesn’t really test this thesis.","leacock":"Mariposa sidesteps the thesis (no wilderness at all) rather than contradicting it. Find a text where the land itself is friendly.","line":"Right passage, but that line only sets the scene. Mark the line where the speaker is most at ease in the land."},"general":"Not yet. The thesis says the land is hostile. Mark a line where a speaker is at ease in it.","why":"A speaker at home in the land is exactly what the garrison thesis can’t explain: “In the full furnace of this hour / My thoughts grow keen and clear” (Lampman, lines 47–48), or Johnson’s call to the west wind.","hints":["The thesis says the land is hostile. Find a speaker at ease in it.","Look at Lampman’s last lines, or Johnson’s first.","In the full furnace of this hour / My thoughts grow keen and clear."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"\u003cstrong>Test the garrison thesis fairly:\u003c/strong> choose \u003cstrong>one\u003c/strong> passage that supports it, \u003cstrong>two\u003c/strong> that challenge it, and the \u003cstrong>most defensible conclusion\u003c/strong>. \u003cbutton type='button' class='btn ghost sm cl-setup' data-setup='lens'>Set it up\u003c/button>","_a":"HhIWFBIUWBEIXwoFC1NAH0dTDUNYbUBfBF0VDANYQB9HWgoJDEUNXUccRw0HVwFcBltHPB8=","options":[{"t":"The garrison thesis fits some early settler writing, but not all; it reflects a settler perspective rather than Canadian literature as a whole.","fb":"","_n":"14d58","_k":"e2b6f9a0"},{"t":"The thesis is useless and should be ignored.","fb":"It does illuminate Moodie, so “useless” overcorrects.","_n":"15d48","_k":"0b428bc3"},{"t":"The thesis is proved: Canadian literature fears nature.","fb":"A thesis that explains everything explains nothing. Look for the text that doesn’t fit.","_n":"16d38","_k":"858678ff"},{"t":"Only poems count as evidence, so the thesis can’t be tested.","fb":"Any text can be evidence.","_n":"17d28","_k":"aae0b5a7"}],"msgs":{"count":"Choose exactly one passage that supports the thesis, two that challenge it, and a conclusion.","mccrae":"McCrae doesn’t challenge the thesis; it’s outside its subject.","lampSup":"Re-read “Heat”: the speaker isn’t threatened.","sup":"That passage doesn’t picture the land as a threat. Which one does?","ch":"Moodie can’t challenge the thesis; she’s its best evidence."},"general":"Not yet. Check your supporting passage, your two challenges and your conclusion.","why":"You did what critics should do: reported a big idea, then tested it on both kinds of evidence. Your conclusion is narrower than the thesis, and stronger for it.","hints":["Which passage pictures the land as a threat?","Which passages picture it as calm, friendly or beside the point?","Moodie supports; Lampman and Johnson challenge; the thesis fits \u003cem>some\u003c/em> settler writing."]}]},"part3":{"slug":"thesis","name":"Thesis","heading":"Test a thesis","intro":"Explore tried the lenses one passage at a time. Here you build a whole evidence board for two famous theses, then ask whose perspective each thesis carries.","s1":{"title":"Station 1: Two theses, in their own words and in plain words","how":"Read each card, then choose the summary that matches it.","cards":[{"id":"frye","name":"The garrison mentality","who":"Northrop Frye, 1965","lead":"Canadian sensibility ","quote":"“is less perplexed by the question ‘Who am I?’ than by some such riddle as ‘Where is here?’”","cite":"(Frye, “Conclusion”)","credit":"Northrop Frye, “Conclusion,” \u003ci>Literary History of Canada\u003c/i>, edited by Carl F. Klinck, U of Toronto P, 1965 (also in \u003ci>The Bush Garden\u003c/i>, 1971)","_a":"R1YXGAcU","slot":"\u003cstrong>Read in your copy:\u003c/strong> the passage in Frye’s “Conclusion” to the \u003ci>Literary History of Canada\u003c/i> (1965) where he describes the “garrison mentality”. Your teacher will give you the pages.","gloss":"Early settler writing pictures small, close-knit communities that feel surrounded by a huge, indifferent or menacing land, and turn inward to protect themselves: a “garrison mentality”."},{"id":"atwood","name":"\u003ci>Survival\u003c/i>","who":"Margaret Atwood, 1972","lead":"","quote":"“The central symbol for Canada [. . .] is undoubtedly Survival, la Survivance”","cite":"(Atwood, \u003ci>Survival\u003c/i>)","credit":"Margaret Atwood, \u003ci>Survival: A Thematic Guide to Canadian Literature\u003c/i>, House of Anansi, 1972","_a":"R1ERFg1ZBhE=","slot":"\u003cstrong>Read in your copy:\u003c/strong> the passages in Atwood’s \u003ci>Survival\u003c/i> (1972) where she names survival as the central symbol and sets out the “Basic Victim Positions”. Your teacher will give you the pages.","gloss":"Atwood lays out “Basic Victim Positions”: denying you are a victim, blaming fate, refusing that victimhood is inevitable, and finally becoming a “creative non-victim”."}],"summaries":[{"id":"frye","t":"Early settler writing pictures small communities that feel besieged by a vast, menacing land, and turn inward."},{"id":"atwood","t":"Survival, and the ways characters respond to being victims, is a central pattern in Canadian writing."},{"id":"mil","t":"Frye said Canada was a military country."},{"id":"vict","t":"Atwood said all Canadians are victims."}],"fb":{"right":"Right. That’s the thesis in plain words.","other":"That’s an accurate summary, but of the other thesis.","mil":"A distortion: “garrison” is a metaphor for a fortified settlement, not the army.","vict":"A distortion: Atwood describes positions characters take, not a verdict on every Canadian."}},"s2":{"title":"Station 2: The evidence board","how":"Choose a thesis. Tap a passage, then tap the column it belongs in. A placement that differs from the lens table needs a “because” reason from the menu.","cols":[{"id":"s","t":"Supports"},{"id":"c","t":"Complicates"},{"id":"d","t":"Doesn’t apply"}],"theses":[{"id":"garrison","t":"Garrison"},{"id":"survival","t":"Survival"}],"because":[{"id":"dead","t":"because the dead refuse to let their cause die"},{"id":"nowild","t":"because there is no wilderness in it at all"},{"id":"persp","t":"because it shows one settler’s fear, not everyone’s"},{"id":"nostrug","t":"because no one in it is struggling to survive"},{"id":"endure","t":"because the speaker endures the noon heat"},{"id":"all","t":"because every Canadian text is about the land"},{"id":"old","t":"because it was written long ago"}],"cells":[{"th":"garrison","p":"moodie","_a":"HhIOQ1gUERFJEgQNFhRYSEdTR1s5FBJWF0MVQz9LHw=="},{"th":"garrison","p":"lampman","_a":"HhIOQ1gUARFJEgQNFhRYSBhN"},{"th":"garrison","p":"johnson","_a":"HhIOQ1gUARFJEgQNFhRYSBhN"},{"th":"garrison","p":"leacock","_a":"HhIOQ1gUARFJEgQNFhRYSEdUR1s5FAxcElkJBUBrH04="},{"th":"garrison","p":"mccrae","_a":"HhIOQ1gUBhFJEgQNFhRYSBhN"},{"th":"survival","p":"moodie","_a":"HhIOQ1gUERFJEgQNFhRYSBhN"},{"th":"survival","p":"lampman","_a":"HhIOQ1gUARFJEgQNFhRYSEdUR1s5FAxcFkQXFAUUP04Y"},{"th":"survival","p":"johnson","_a":"HhIOQ1gUARFJEgQNFhRYSEdUR1s5FAxcFkQXFAUUP04Y"},{"th":"survival","p":"leacock","_a":"HhIOQ1gUARFJEgQNFhRYSEdUR1s5FAxcFkQXFAUUThELXxIIDlJAbhhN"},{"th":"survival","p":"mccrae","_a":"HhIOQ1gUARFJEgQNFhRYSEdDR1s5FAZWBFRHPB9L"}],"st":{"key":"✓ Matches the lens table.","alt":"✓ Accepted, with your reason.","need":"Defend this placement: choose a “because” reason.","bad":"✗ That reason doesn’t hold for this placement. Try another, or move the card."},"bar":"{t}: supported by {s}, complicated by {c}, doesn’t apply to {d}"},"s3":{"title":"Station 3: Whose thesis?","card":"Both theses grew out of reading mostly settler, English-language writing. Many Indigenous writers picture the land as home and kin, a relation rather than a wilderness to survive (Johnson’s paddle-song is one early example; module 15 goes further). French-language and newcomer writers often place the struggle elsewhere: in cities, in history, in language itself.","prompt":"Rewrite one thesis so that it’s honest about its perspective.","chips":["settler","English-language","nineteenth-century"],"frame":"In much early {who} writing, ","ph":"complete the thesis, e.g. communities feel…","ok":"✓ Your thesis names whose writing it describes. That’s narrower, and truer.","need":"Choose at least one chip to say whose writing, then complete the sentence (at least five words)."},"blocks":[{"title":"Craft → meaning","html":"\u003cp>A thesis is a way of seeing. Use it like a lens: look through it, notice what comes into focus, then take it off and notice what it blurred.\u003c/p>"}],"quickCheck":{"title":"Thesis quick check","summary":"Thesis quick check","items":[{"id":"q1","goal":2,"prompt":"Which best summarizes the garrison mentality?","choices":[{"t":"Cities more important than nature","fb":"“Garrison” is a metaphor for a fortified settlement, not the army.","_n":"18d18","_k":"9c44325b"},{"t":"Canada’s love of the military","fb":"“Garrison” is a metaphor for a fortified settlement, not the army.","_n":"19d08","_k":"d299041b"},{"t":"Nature as paradise","fb":"“Garrison” is a metaphor for a fortified settlement, not the army.","_n":"1acf8","_k":"4250d79c"},{"t":"Communities huddled against a vast, menacing land","fb":"Right. A small settlement, turned inward against the land around it.","_n":"1bce8","_k":"fe31ce6b"}]},{"id":"q2","goal":[2,5],"prompt":"Lampman’s “Heat”, for the garrison thesis, is…","choices":[{"t":"irrelevant","fb":"The land clarifies the speaker; it doesn’t besiege him.","_n":"1ccd8","_k":"4077d9f0"},{"t":"strong support","fb":"The land clarifies the speaker; it doesn’t besiege him.","_n":"1dd08","_k":"94f18ce6"},{"t":"proof","fb":"The land clarifies the speaker; it doesn’t besiege him.","_n":"1ed18","_k":"e090c336"},{"t":"a counterexample","fb":"Right. The land clarifies the speaker; it doesn’t besiege him.","_n":"1fd28","_k":"18f6f731"}]},{"id":"q3","goal":2,"prompt":"A fair test of a thesis needs…","choices":[{"t":"only supporting examples","fb":"Testing means looking for the case that doesn’t fit.","_n":"1gd38","_k":"5e9cbb26"},{"t":"one strong quotation","fb":"Testing means looking for the case that doesn’t fit.","_n":"1hcc8","_k":"1b90ba60"},{"t":"evidence that supports it and evidence that might not","fb":"Right. Testing means looking for the case that doesn’t fit.","_n":"1icd8","_k":"abf9ced9"},{"t":"the critic’s fame","fb":"Testing means looking for the case that doesn’t fit.","_n":"1jce8","_k":"b37b00a0"}]},{"id":"q4","goal":3,"prompt":"The best way to make a thesis honest about its perspective is to…","choices":[{"t":"name whose writing it describes","fb":"Right. “In much early settler writing…” is narrower and truer.","_n":"1kcf8","_k":"6f269f5d"},{"t":"make it broader","fb":"“In much early settler writing…” is narrower and truer.","_n":"1lc88","_k":"2fdb2617"},{"t":"remove the critic’s name","fb":"“In much early settler writing…” is narrower and truer.","_n":"1mc98","_k":"45b12867"},{"t":"add more adjectives","fb":"“In much early settler writing…” is narrower and truer.","_n":"1n428","_k":"972e0196"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='cl-steal'>“I don’t know whether you know Mariposa. If not, it is of no consequence, for if you know Canada at all, you are probably well acquainted with a dozen towns just like it.”\u003c/p>\u003cp class='eng-cite'>Stephen Leacock, \u003ci>Sunshine Sketches of a Little Town\u003c/i> (1912), chapter 1\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> a casual aside to “you”, a shrug (“it is of no consequence”), then a sweeping, slyly comic generalization.\u003c/p>\u003cp>\u003cstrong>Frame:\u003c/strong> “I don’t know whether you know ______. If not, it is of no consequence, for if you know ______ at all, you are probably well acquainted with ______ just like it.”\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “I don’t know whether you know our cafeteria. If not, it is of no consequence, for if you know high school at all, you are probably well acquainted with a dozen lunch lines just like it.”\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"I don’t know whether you know Mariposa. If not, it is of no consequence, for if you know Canada at all, you are probably well acquainted with a dozen towns just like it.","source":"Leacock, Sunshine Sketches of a Little Town","save":"Save it to my commonplace book"}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Supports, complicates or doesn’t apply?","summary":"Supports, complicates or doesn’t apply?","goal":[2,5],"txt":true,"noun":"description","instruction":"Thesis tested: the garrison mentality. Sort each described text by what it does to the thesis. Trivium: Logic.","boxes":[{"id":"s","label":"Supports"},{"id":"c","label":"Complicates"},{"id":"d","label":"Doesn’t apply"}],"items":[{"id":"i1","t":"Moodie warns genteel emigrants against settling in the backwoods","_a":"R0NH","why":"The bush as threat: the garrison feeling exactly.","wrong":{"c":"This is the garrison feeling exactly: the bush as threat.","d":"This is the garrison feeling exactly: the bush as threat."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Supports: the bush is a threat to the settler household."]},{"id":"i2","t":"Lampman’s speaker rests in the noon heat, and his “thoughts grow keen and clear”","_a":"R1NH","why":"Calm, not siege: the land sharpens his mind.","wrong":{"s":"Calm, not siege.","d":"Calm, not siege. The land is right there, and it’s friendly: that complicates the thesis."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Complicates: the land is calm, not a siege."]},{"id":"i3","t":"Leacock’s affectionate comedy about a small Ontario town","_a":"R1NH","why":"The town isn’t besieged; it’s comfortable, even absurd.","wrong":{"s":"The town isn’t besieged; it’s comfortable, even absurd.","d":"The town isn’t besieged; it’s comfortable, even absurd. A small community at ease complicates the picture."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Complicates: a small town at ease, not under siege."]},{"id":"i4","t":"McCrae’s dead soldiers speak from a battlefield in Belgium","_a":"R1RH","why":"War overseas isn’t the thesis’s subject.","wrong":{"s":"War overseas isn’t the thesis’s subject.","c":"War overseas isn’t the thesis’s subject."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Doesn’t apply: the thesis is about the Canadian land, not a war overseas."]},{"id":"i5","t":"Johnson’s paddler calls to the west wind as if to a companion","_a":"R1NH","why":"The land is a partner here.","wrong":{"s":"The land is a partner here.","d":"The land is a partner here, and that pushes against the thesis."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Complicates: the land is a partner."]},{"id":"i6","t":"Montgomery’s Anne delights in the landscape of Prince Edward Island","_a":"R1NH","why":"Wonder, not fear.","wrong":{"s":"Wonder, not fear.","d":"Wonder, not fear: a friendly land complicates the thesis."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Complicates: wonder, not fear."]},{"id":"i7","t":"Ross’s minister’s wife feels isolated in a drought-stricken prairie town, the wind and dust pressing in","_a":"R0NH","why":"A small community hemmed in by a harsh land.","wrong":{"c":"A small community hemmed in by a harsh land.","d":"A small community hemmed in by a harsh land."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Supports: a small community hemmed in by a harsh land."]},{"id":"i8","t":"Roy’s family struggles with poverty in wartime Montreal","_a":"R1RH","why":"An urban story; there’s no wilderness in it.","wrong":{"s":"An urban story; there’s no wilderness in it.","c":"An urban story; there’s no wilderness in it."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Doesn’t apply: a city story with no wilderness."]},{"id":"i9","t":"Kogawa’s Japanese Canadian family is forcibly removed from the coast by its own government during the Second World War","_a":"R1NH","why":"The threat comes from inside the “garrison”, from the nation itself: the thesis turned inside out.","wrong":{"d":"It does apply, in reverse: here the threat comes from inside the “garrison”, from the nation itself.","s":"The threat here isn’t the land. Look at who removes the family."},"hints":["Is the land a threat, a friend, or absent?","Threat → supports. Friend or absent → complicates or doesn’t apply.","Complicates: the threat comes from inside the “garrison”, from the nation itself."]}]},{"id":"across","type":"custom","title":"Reading across texts","summary":"Reading across texts","goal":[2,3,5],"star":true,"instruction":"Six questions that read the passages against each other. The last two go beyond the Final Check. Trivium: Logic.","how":"","items":[{"id":"x1","goal":5,"prompt":"Which two passages show the most opposite relationships to the land?","options":[{"t":"Leacock and Johnson","why":"Leacock’s Mariposa has no wilderness, so there’s little to set against Johnson’s ease.","_n":"1o418","_k":"1bbb9c9c"},{"t":"Moodie and Lampman","why":"Moodie dreads the dark forest; Lampman’s speaker rests easy in the heat.","_n":"1p448","_k":"042e2c19"},{"t":"Johnson and Lampman","why":"Johnson and Lampman agree: both are at ease.","_n":"1q438","_k":"6672a8b0"},{"t":"McCrae and Leacock","why":"McCrae is about war overseas, and Leacock has no wilderness at all: neither pictures a relationship to the Canadian land.","_n":"1r3e8","_k":"902894f8"}],"hints":["Which passage fears the land most?","Which speaker is most at ease in it?","Moodie and Lampman: dread against ease."]},{"id":"x2","goal":5,"star":true,"prompt":"Each stanza of “In Flanders Fields” returns to the words “In Flanders fields”. What does the refrain do?","options":[{"t":"It shows McCrae forgot the rhyme","why":"The refrain is a rule of the rondeau form, and a choice.","_n":"1s3d8","_k":"66d1ed70"},{"t":"It names a Canadian place","why":"Flanders is in Belgium, where the dead lie.","_n":"1t408","_k":"0eef81e6"},{"t":"It brings us back to the graves, so the dead’s voice keeps insisting on the place where they lie","why":"Repetition is insistence. The dead won’t let us forget where they are.","_n":"1u3f8","_k":"9ba88ba3"},{"t":"It fills space","why":"Repetition is insistence. The dead won’t let us forget where they are.","_n":"1v4a8","_k":"f0e6156d"}],"hints":["Where are the speakers?","What do they keep returning to?","Their graves: the refrain insists on the place."]},{"id":"x3","goal":3,"star":true,"prompt":"Leacock’s narrator speaks to “you” (“if you know Canada at all”). What is the effect?","options":[{"t":"An accusation against the reader","why":"There’s no blame here, only a wink.","_n":"1w498","_k":"0749832c"},{"t":"Confusion about who’s speaking","why":"The narrator is clear; he’s chatting with you.","_n":"1xbc8","_k":"b12c80d3"},{"t":"Intimacy and gentle irony: a “typical” town becomes a sly portrait of a whole country","why":"The direct address pulls you in. The generalization is part of the joke.","_n":"1ybd8","_k":"72be9706"},{"t":"A formal, distant tone","why":"The direct address pulls you in. The generalization is part of the joke.","_n":"1zba8","_k":"fe3850cb"}],"hints":["How does being called “you” feel?","Is “a dozen towns just like it” meant literally?","Intimacy and gentle irony."]},{"id":"x4","goal":2,"star":true,"prompt":"Which passage best fits Atwood’s idea of \u003cem>refusing\u003c/em> to accept that victimhood is inevitable?","options":[{"t":"McCrae: “Take up our quarrel with the foe” (line 10)","why":"The dead don’t accept death as the end; they hand on the “torch”.","_n":"20bb8","_k":"853970b8"},{"t":"Lampman’s resting speaker","why":"He isn’t a victim at all, so there’s nothing to refuse.","_n":"21c08","_k":"6cbcf22f"},{"t":"Moodie’s warnings","why":"Moodie endures and warns; she doesn’t refuse her lot here.","_n":"22c18","_k":"b476d919"},{"t":"Leacock’s Mariposa","why":"No one in Mariposa is a victim.","_n":"23be8","_k":"f2904d13"}],"hints":["Which speakers act, and which only describe?","Who hands something on?","McCrae’s dead: “To you from failing hands we throw / The torch”."]},{"id":"x5","goal":3,"star":true,"prompt":"Which question best exposes the limit of using only these five public-domain texts as “Canadian literature”?","options":[{"t":"Whose voices are missing (French-language, Black, Asian Canadian and most Indigenous writers)?","why":"Five English-language texts, four by settlers, can’t speak for a country.","_n":"24bf8","_k":"2b16d218"},{"t":"Were they popular?","why":"Popularity doesn’t tell you who is missing. Five English-language texts, four by settlers, can’t speak for a country.","_n":"25c48","_k":"75456b87"},{"t":"Are they long enough?","why":"Length isn’t the limit; whose voices are heard is.","_n":"26c58","_k":"d3557579"},{"t":"Are they all poems?","why":"They aren’t (two are prose), and form isn’t the main limit.","_n":"274e9","_k":"6eb28982"}],"hints":["Who wrote these five?","In what language, and from what perspective?","Ask whose voices are missing."]}],"x6":{"id":"x6","goal":[2,5],"prompt":"Write one sentence that tests the garrison thesis with a quotation from “Heat” and a citation.","lines":["From plains that reel to southward, dim,","In the full furnace of this hour","My thoughts grow keen and clear."],"verbs":["suggest","impl","undercut","juxtapos","foreshadow","refram","intensif","complicat"],"bank":"suggests, implies, undercuts, juxtaposes, foreshadows, reframes, intensifies, complicates","checks":["A quotation from “Heat”, in quotation marks","A line citation: (Lampman, lines 47–48) or (lines 47–48)","The word “garrison”","A verb from the analysis bank"],"tips":["Quote a few words from “Heat” inside quotation marks.","Add a line citation such as (lines 47–48).","Name the thesis: use the word “garrison”.","Say what the quotation does to the thesis, with a verb such as “complicates” or “undercuts”."],"model":"Lampman’s speaker finds that “In the full furnace of this hour / My thoughts grow keen and clear” (lines 47–48), which complicates the garrison thesis: the land sharpens his mind instead of besieging his household.","hints":["Quote a few words from the last two lines.","Poems cite line numbers: (lines 47–48).","Say what the quotation does to the thesis: “complicates”, “undercuts”."]}},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Seraphina","goal":[2,1,6],"instruction":"Seraphina made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":2,"task":"Testing a thesis","steps":["Frye’s idea of a “garrison mentality” describes settler communities that turn inward against a vast, menacing land.","Moodie’s warnings against the backwoods support this idea.","Therefore all Canadian literature is about surviving a hostile wilderness.","Even Lampman’s “Heat” shows the danger of summer.","The garrison is everywhere in our books."],"_a":"Vw==","stepFb":["An accurate summary.","Good evidence.","","This follows from sentence 3. The problem is earlier.","This follows from sentence 3. The problem is earlier."],"fixes":[{"t":"“Therefore Frye must be right, because he is a famous critic.”","why":"Fame isn’t evidence. Report the thesis, then test it. Your conclusion comes after the evidence.","_n":"284d9","_k":"72dea418"},{"t":"“Therefore most Canadian literature is about winter.”","why":"A new overgeneralization.","_n":"294c9","_k":"0f581852"},{"t":"Sentence 3 is fine.","why":"One example can’t prove “all”. A thesis that explains everything explains nothing. Look for the text that doesn’t fit.","_n":"2a4b9","_k":"adce1a97"},{"t":"“Moodie supports the thesis, but Lampman’s ‘Heat’, where the speaker’s ‘thoughts grow keen and clear’, complicates it.”","why":"Right: one supporting text can’t prove “all”, and the counterexample narrows the claim.","_n":"2b529","_k":"e758b408"}],"hints":["How many texts support the “all” in sentence 3?","Is there a counterexample in this module?","The fix that sets Moodie against Lampman’s “Heat”."]},{"id":"e2","goal":1,"task":"Defining the field","steps":["Canadian literature is simply any book set in Canada.","So \u003ci>A Fine Balance\u003c/i>, set in India, is not Canadian literature.","And neither is “In Flanders Fields”.","Our canon should include only books set here."],"_a":"VQ==","stepFb":["","This follows from sentence 1. The problem is earlier.","This follows from sentence 1. The problem is earlier.","This follows from sentence 1. The problem is earlier."],"fixes":[{"t":"“Definitions differ: some focus on where authors live, others on setting, language or readers, and each includes and excludes different writers.”","why":"Right: each definition is a choice, with its own gains and losses.","_n":"2c519","_k":"847b33b6"},{"t":"“Canadian literature is any book written by someone born in Canada.”","why":"Another single rule, which leaves out Mistry, Brand and Thúy.","_n":"2d509","_k":"f19132e3"},{"t":"Sentence 1 is fine.","why":"It would exclude a poem recited every November 11. Each definition is a choice. Mistry writes about India from Toronto; McCrae’s poem is set in Belgium. Are they Canadian literature?","_n":"2e4f9","_k":"961862b7"},{"t":"“Canadian literature is whatever sells well here.”","why":"Popularity is one measure, not a definition.","_n":"2f469","_k":"c9b4e914"}],"hints":["Test sentence 1 against McCrae and Mistry.","Is there one rule everyone agrees on?","The fix that says definitions differ, and each includes and excludes."]},{"id":"e3","goal":6,"task":"Indigenous storytelling","steps":["Any history of literature in Canada should include Indigenous storytelling.","Indigenous stories belong to the time before Canadian literature began.","They were replaced by written books.","Johnson was one of the last to remember them."],"_a":"VA==","stepFb":["Agreed.","","This follows from sentence 2. The problem is earlier.","This follows from sentence 2. The problem is earlier."],"fixes":[{"t":"“Indigenous storytelling is a living tradition, much older than Canada, continuing today in oral and written forms; Johnson, Highway and Wagamese are part of it.”","why":"Right. Indigenous storytelling is older than Canada and still alive, in oral and written forms, today.","_n":"2g459","_k":"a3a672f5"},{"t":"“Indigenous stories are interesting folklore.”","why":"“Folklore” can belittle living literature.","_n":"2h488","_k":"352e63bf"},{"t":"Sentence 2 is fine.","why":"It erases a living tradition.","_n":"2i498","_k":"e6999ecf"},{"t":"“Indigenous stories are one single tradition shared by all nations.”","why":"There are many nations, languages and traditions.","_n":"2j4a8","_k":"d2185404"}],"hints":["Are these traditions over?","Look at the band under the timeline.","The fix that calls it a living tradition, continuing today."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result surprised you most in Explore: a thesis that didn’t fit, a card in “Elsewhere”, or what disappeared when you changed the dates?"},{"id":"j2","q":"In your own words, why is choosing a canon an argument rather than a fact?"},{"id":"j3","q":"Explain to a friend how to test a critic’s big idea fairly, step by step."},{"id":"j4","q":"Where do your own family’s stories fit in the map of Canadian literature? What would you add to the collection, and why?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save the line from today’s texts that felt most like \u003cem>your\u003c/em> Canada, and say why. (Optional.)\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write a principle about reading claims and collections,
