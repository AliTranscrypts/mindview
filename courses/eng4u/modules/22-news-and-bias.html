/* ENG4U 22 News, Bias & Source Evaluation: hero, newsroom simulator, simulated browser, Check before you share, task. Tokens only.
   Flag colours (plan §5): word choice brown (--an-diction), structure/placement blue (--an-syntax), images teal (--an-image),
   sources and statistics orange (--an-sound), big-idea notes magenta (--an-theme). Every flag also carries a text tag. */

/* radioGroup (from ENG4U 13) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips.nb-wide button{border-radius:10px;max-width:100%}
.nb-h{font-size:1rem;margin:14px 0 6px}
.nb-lab{display:block;font-weight:700;font-size:.95rem;margin:0 0 4px}

/* original illustrations */
.nb-ill{display:block;width:100%;height:auto}
.nb-s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb-thick{stroke-width:3}
.nb-f1{fill:var(--sheet)}
.nb-f2{fill:var(--paper)}
.nb-t{fill:var(--ink);font:700 12px var(--font-ui);text-anchor:middle}
.nb-tsm{font-size:9px;letter-spacing:.06em}
.nb-snow circle{fill:var(--ink-2)}
.nb-photo{border:1px solid var(--ink-2);border-radius:4px;background:var(--paper);overflow:hidden}

/* hero */
.nb-hero{display:grid;gap:10px}
.nb-stage{display:grid;overflow:hidden;border-radius:10px}
.nb-paper,.nb-phone{grid-area:1/1;transition:transform .9s ease,opacity .9s ease}
.nb-paper{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px 18px;box-shadow:inset 0 0 0 4px var(--sheet)}

.nb-w{border-radius:3px;transition:color .3s,background-color .3s}
.nb-hero.anim .nb-w{color:var(--ink-2)}
.nb-hero.anim .nb-w.lit{color:var(--ink)}
.nb-w.speaking{background:var(--hi-soft)}
.nb-phone{justify-self:center;width:min(270px,100%);border:3px solid var(--ink);border-radius:24px;padding:16px 10px;background:var(--sheet);transform:translateX(110%);opacity:0;max-height:240px;overflow:hidden}
.nb-feed{display:grid;gap:8px;font-family:var(--font-ui)}
.nb-fh{margin:0;font-size:.82rem;font-weight:700;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;color:var(--ink-2)}
.nb-fq{margin:0;font-size:.95rem;line-height:1.4;padding:8px;border:1.5px solid var(--ink);border-radius:8px}
.nb-fq span{display:block;font-size:.72rem;color:var(--ink-2);margin-top:4px}
.nb-hero.phone .nb-paper{transform:translateX(-110%);opacity:0}
.nb-hero.phone .nb-phone{transform:none;opacity:1}

@keyframes nb-scroll{from{transform:translateY(40px)}to{transform:none}}
.nb-steps{list-style:none;margin:0;padding:0;display:flex;align-items:flex-end;gap:6px;min-height:96px}

.nb-hero.cap .nb-hcap{opacity:1}

.nb-mends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-2)}
.nb-about{margin-top:10px}
.nb-page{background:var(--sheet);color:var(--ink);border:1px solid var(--ink-2);border-radius:4px;padding:10px 12px;font-family:var(--font-math);box-shadow:0 1px 0 var(--rule)}
.nb-mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--ink);padding-bottom:4px;margin-bottom:8px;font:700 1.05rem var(--font-math);letter-spacing:.06em}
.nb-mast-sm{font-size:.85rem;border-bottom-width:2px;border-bottom-style:solid}
.nb-hl{font:700 1.35rem/1.2 var(--font-math);margin:0 0 8px}
.nb-hl-sm,.nb-small .nb-hl{font-size:.98rem}
.nb-fig{margin:0 0 8px}
.nb-fig figcaption{margin-top:2px}
.nb-lead p{margin:0 0 6px;font-size:.93rem;line-height:1.45}
.nb-small .nb-lead p{font-size:.8rem}
.nb-p14g{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.nb-filler{display:grid;gap:5px;align-content:start;font-size:.72rem;color:var(--ink-2)}
.nb-filler i{display:block;height:6px;background:var(--rule);border-radius:2px}
.nb-p14s .nb-fig{max-width:130px}
.nb-readw{margin-top:12px}
.nb-flag{display:inline-block;margin:0 8px 4px 0;border-radius:6px;padding:0 2px}
.nb-flash{background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi)}
.nb-aha{margin-top:10px}

/* Reader mode */
.nb-slot{border:1.5px dashed var(--ink-2);border-radius:8px;padding:10px 12px;background:var(--paper)}
.nb-realv{display:grid;gap:10px;margin:0 0 10px}
.nb-rvf{border:1px solid var(--rule);border-radius:8px;margin:0 0 10px;padding:8px 10px}
.nb-rvf legend{font-weight:700;padding:0 4px}
.nb-rq{margin:0 0 6px}
.nb-outs{display:grid;gap:12px;margin:8px 0 12px}
@media (min-width:900px){ .nb-outs{grid-template-columns:repeat(3,minmax(0,1fr))} }
.nb-out{background:var(--sheet);border:1px solid var(--ink-2);border-radius:4px;padding:10px;font-family:var(--font-math)}
.nb-out .nb-lead p{font-size:.85rem}
.nb-out-online .nb-mast{font-family:var(--font-ui);letter-spacing:0;border-bottom-style:solid}
.nb-big{margin-bottom:6px}
.nb-omatch{margin-top:8px;font-family:var(--font-ui)}

/* simulated browser (E13) */
.nb-br{border:1.5px solid var(--ink-2);border-radius:10px;overflow:hidden;background:var(--sheet);margin:8px 0}
.nb-br-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:6px 6px 0;background:var(--paper);border-bottom:1px solid var(--rule)}
.nb-br-tab{border:1px solid var(--rule);border-bottom:0;border-radius:8px 8px 0 0;background:var(--paper);color:var(--ink-2);padding:.35em .8em;font-size:.85rem;min-height:32px}
.nb-br-tab[aria-pressed="true"]{background:var(--sheet);color:var(--ink);font-weight:700;border-color:var(--ink-2)}
.nb-br-url{display:flex;gap:6px;align-items:center;font:500 .8rem var(--font-ui);color:var(--ink-2);padding:5px 10px;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
.nb-lock{display:inline-block;width:10px;height:8px;border:1.5px solid var(--ink-2);border-radius:2px;position:relative;top:1px}
.nb-br-page{position:relative;padding:12px 12px 10px;min-height:90px}
.nb-br-page h5{margin:0 0 6px;font-size:.95rem}
.nb-sim{float:right;margin:0 0 6px 8px;font:700 .68rem var(--font-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1.5px solid var(--ink-2);border-radius:4px;padding:1px 6px}
.nb-res{margin:0;padding-left:1.2em;font-size:.9rem}
.nb-bud{border-collapse:collapse;font-size:.9rem}
.nb-bud th,.nb-bud td{border-bottom:1px solid var(--rule);padding:4px 8px;text-align:left}
.nb-post{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet);margin:6px 0;max-width:460px}
.nb-post-h{display:flex;gap:8px;align-items:center;font-size:.9rem;margin-bottom:6px}
.nb-av{width:30px;height:30px;border-radius:50%;background:var(--rule);flex:0 0 auto}
.nb-badge{font-size:.75rem;border:1px solid var(--ink-2);border-radius:50%;padding:0 3px}
.nb-post-t{margin:0 0 6px;font-size:1rem}
.nb-pimg{max-width:280px;margin:0 0 4px}
.nb-sift{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;padding:0}
.nb-sift li{border:1.5px solid var(--rule);border-radius:999px;padding:.2em .8em;font-size:.85rem;color:var(--ink-2)}
.nb-sift li b{font-size:.95rem}
.nb-sift li.on{border-color:var(--an-syntax);background:var(--an-syntax-soft);color:var(--ink);font-weight:700}
.nb-sift li.on::after{content:" ✔"}

/* Part 3 stations */
.nb-stn{border-top:1px solid var(--rule);padding-top:10px;margin-top:14px}
.nb-stn h3{margin:0 0 6px;font-size:1.05rem}
.nb-picks{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.nb-pick{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:.35em .8em;font-size:.9rem;min-height:34px;text-align:left;max-width:100%}
.nb-pick[aria-pressed="true"]{font-weight:700;border-color:var(--ink)}
.nb-pick.right{background:var(--good-bg)}
.nb-pick.wrong{background:var(--bad-bg)}
.nb-pick.right::before{content:"✓ "}
.nb-pick.wrong::before{content:"✗ "}
.nb-case{border-left:4px solid var(--an-theme);background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;font-size:.92rem}
.nb-s4l{padding-left:1.2em;margin:0}
.nb-s4l li{margin:0 0 10px}
.nb-s4l li p{margin:0 0 4px}
.nb-s5o{font-weight:700}
.nb-steal{font:400 1.08rem/1.55 var(--font-math);border-left:4px solid var(--an-figure);padding-left:12px;margin:0 0 4px}

/* Practice */
.nb-ext{margin-top:16px;border-top:1px dashed var(--rule);padding-top:6px}
.nb-extg{display:grid;gap:8px}
@media (min-width:720px){ .nb-extg{grid-template-columns:1fr 1fr} }
.nb-extb textarea{width:100%;border:1.5px solid var(--an-c,var(--rule));border-radius:8px;background:var(--sheet);padding:.4em .6em;min-height:54px}
.nb-star{vertical-align:middle;margin-right:2px}
.nb-bchip{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.nb-bchip.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.nb-built{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font-family:var(--font-math);font-size:1.02rem}

/* Task */
.nb-tk .jq{margin:0 0 10px}
.nb-tkfs{margin:0 0 10px}
.nb-qp{margin:0 0 10px}
.nb-qpb{display:grid;gap:6px}
.nb-qbtn{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:.4em .7em;font-size:.88rem;text-align:left;min-height:34px}
.nb-qtag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);border:1.5px solid currentColor;border-radius:999px;padding:0 .45em;margin-right:4px;background:var(--sheet)}
.nb-q-supports{color:var(--an-image)}
.nb-q-opposes{color:var(--an-sound)}
.nb-q-neutral{color:var(--ink-2)}
.nb-dw-ta{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-size:1rem;line-height:1.5}
.nb-dw-n{font-size:.88rem}
.nb-dw-cmp{display:grid;gap:10px;font-size:.88rem}
@media (min-width:720px){ .nb-dw-cmp{grid-template-columns:1fr 1fr} }
.nb-dw-cmp del{color:var(--ink-2)}
.nb-dw-cmp ins{text-decoration:underline;text-decoration-thickness:2px}
.nb-tk textarea#tk-note{width:100%}
.nb-tkpage{margin:0 0 8px}
.nb-glance{margin:0 0 8px;padding-left:1.2em;font-size:.88rem}
.nb-model{border-top:1px solid var(--rule);padding-top:6px;margin-top:8px;font-size:.9rem}
.nb-model h5{margin:0 0 4px;font-size:.95rem}
.nb-mh{font-family:var(--font-math);margin:0 0 4px}
.nb-rubric{margin-top:8px}

<script>window.MV_PAYLOAD={"meta":{"id":"22-news-and-bias","nn":"22","slug":"news-and-bias","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 5","groupName":"Media Studies","trivium":"Logic","size":"M","storageKey":"eng4u-22-news-and-bias-v1","progressKey":"eng4u-progress-v1:22-news-and-bias","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"be4d49c5","content":{"id":"22-news-and-bias","kind":"topic","title":"News, bias and source evaluation","topic":"News, Bias & Source Evaluation","readyTopic":"reading the news for bias","hero":{"headline":"Free to know. Free to check.","text":"News arrives already shaped. Someone chose the headline verb, the photo, the page, the people quoted and the numbers compared. \u003cstrong>Bias\u003c/strong> usually hides in those choices, not in outright lies. This module puts you in the editor’s chair, then teaches you the fact-checker’s trick: \u003cstrong>leave the page\u003c/strong> to find out what’s true.","fig":{"html":"\u003cdiv class='nb-hero' id='nb-hero' role='group' aria-label='Milton’s sentence appears in an old printed typeface, as if pressed onto paper. As it is read, the phrases to know, to utter, and to argue lift into three rising steps. The paper slides away to show a phone feed scrolling the same sentence in a modern typeface, among headlines. Caption: three hundred and eighty years later, the liberty is the same; the tools have changed.'>\u003c/div>","caption":""},"quote":"Give me the liberty to know, to utter, and to argue freely according to conscience, above all liberties.","steps":[[5,"to know,"],[7,"to utter,"],[10,"and to argue"]],"cite":"John Milton, \u003ci>Areopagitica\u003c/i> (1644)","feed":["Council vote tonight: what you need to know","Is this photo real? Three ways to check","Snow likely by Friday, forecasters say"],"caption":"Three hundred and eighty years later, the liberty is the same. The tools have changed.","listen":"Listen","watch":"Watch again","noVoice":"Read it aloud yourself, and lean on the three steps: to know, to utter, and to argue."},"goals":["I can identify the main types of bias in news: word choice, selection and omission, images and placement, and sources and statistics.","I can explain how the same facts can be framed to create different impressions, including misleading statistics.","I can evaluate a source’s credibility by reading laterally and using the SIFT moves.","I can distinguish accurate reporting, misinformation, disinformation, satire and sponsored content, including AI-generated images.","I can analyse the perspective a text writes from, and acknowledge my own.","I can write a fair news story and explain my editorial choices."],"start":{"blocks":[{"title":"Word story: bias (and news)","html":"\u003cp>\u003cstrong>Bias\u003c/strong> comes from the French \u003cem>biais\u003c/em>, “slant”. In the old game of lawn bowling, a \u003cem>bias\u003c/em> is the weight built into one side of the ball so that it curves as it rolls. Every bowl runs on a bias; the skill is knowing which way it will bend.\u003c/p>\u003cp>And \u003cstrong>news\u003c/strong>? It’s a popular myth that the word comes from \u003cstrong>N\u003c/strong>orth, \u003cstrong>E\u003c/strong>ast, \u003cstrong>W\u003c/strong>est and \u003cstrong>S\u003c/strong>outh. It simply means “new things”, the plural of \u003cem>new\u003c/em>. Even the story of the word \u003cem>news\u003c/em> needs checking.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Fact vs opinion","goal":2,"prompt":"Which statement is a fact that could be checked?","options":[{"t":"“The lane is the best thing to happen to downtown.”","why":"An opinion. “Best” is evaluative.","_n":"0384","_k":"f52f796c"},{"t":"“Council voted 7–4 on Tuesday to build the lane.”","why":"A vote count and a day can be verified.","_n":"1374","_k":"9bd32905"},{"t":"“Everyone hates the new lane.”","why":"An overgeneralization. “Everyone” can’t be true or checked.","_n":"2364","_k":"82d2a7d4"},{"t":"“The lane is a waste of money.”","why":"Opinion presented as fact. “Waste” is a judgment.","_n":"33d4","_k":"b5a5a9b7"}],"hints":["Could you check it with a record?","Votes are recorded.","“Council voted 7–4 on Tuesday to build the lane.”"]},{"id":"w2","skill":"Fact vs opinion","goal":5,"prompt":"A news article quotes a merchant: “The lane will ruin my business.” What is the quotation?","options":[{"t":"Bias by the reporter","why":"Quoting someone isn’t itself biased; \u003cem>who\u003c/em> is quoted, and how many on each side, matters.","_n":"43c4","_k":"b669e813"},{"t":"A proven fact, because it’s in the news","why":"Source authority: being reported ≠ being true.","_n":"53b4","_k":"12430feb"},{"t":"An accurate report of an opinion: it’s a fact that she said it, but her claim is a prediction","why":"Reporting an opinion doesn’t make it a fact.","_n":"63a4","_k":"0569807c"},{"t":"A statistic","why":"No numbers.","_n":"7314","_k":"b76b8bb6"}],"hints":["Separate \u003cem>that she said it\u003c/em> from \u003cem>what she said\u003c/em>.","Her claim predicts the future.","An accurate report of an opinion."]},{"id":"w3","skill":"Connotation","goal":1,"prompt":"Which verb gives a \u003cem>negative\u003c/em> connotation to a council decision?","options":[{"t":"“Rams through”","why":"Suggests force and disregard.","_n":"8304","_k":"014f32ff"},{"t":"“Passes”","why":"Neutral.","_n":"9d2e","_k":"05c2774d"},{"t":"“Votes for”","why":"Neutral.","_n":"ad3e","_k":"d71c4440"},{"t":"“Approves”","why":"Neutral.","_n":"bd0e","_k":"8d33c3e8"}],"hints":["Which verb makes you picture something forceful?","Ramming is violent.","“Rams through”."]},{"id":"w4","skill":"Connotation","goal":1,"prompt":"“Long-suffering cyclists finally get their due.” Which words carry the writer’s attitude?","options":[{"t":"“Cyclists”","why":"That’s the subject, a neutral noun.","_n":"cd1e","_k":"f5297e78"},{"t":"“Get”","why":"A plain verb.","_n":"dcee","_k":"6ce0aa92"},{"t":"None; the sentence is neutral","why":"Read the adjectives again.","_n":"ecfe","_k":"ad077604"},{"t":"“Long-suffering” and “finally … their due”","why":"They cast cyclists as victims now rewarded.","_n":"fcce","_k":"b54375ed"}],"hints":["Find the adjectives and adverbs.","“Long-suffering”, “finally”.","“Long-suffering” and “finally … their due”."]},{"id":"w5","skill":"Judging a source","goal":3,"prompt":"You find a statistic on a website with no author, no “About” page and no sources. What’s the best first move?","options":[{"t":"Ignore all statistics online","why":"Cynicism isn’t evaluation; check it.","_n":"gcde","_k":"7bdd7a10"},{"t":"Open a new tab and search for who runs the site, and whether better coverage of the statistic exists","why":"Leave the page: lateral reading.","_n":"hcae","_k":"350749bd"},{"t":"Read the site’s other pages carefully to judge its tone","why":"That’s vertical reading. A site can’t vouch for itself.","_n":"icbe","_k":"51b3783c"},{"t":"Trust it if the design looks professional","why":"Design isn’t evidence.","_n":"j4ce","_k":"9aacc133"}],"hints":["Who could tell you about this site besides the site?","Other sources.","Open a new tab and search for who runs the site."]},{"id":"w6","skill":"Judging a source","goal":3,"prompt":"Which feature most strengthens a news story’s credibility?","options":[{"t":"Many exclamation marks for urgency","why":"Urgency is a warning sign, not a credential.","_n":"k4bd","_k":"685c99f8"},{"t":"A large number of shares","why":"Popularity: popular ≠ accurate.","_n":"l4ad","_k":"7667b47c"},{"t":"A dramatic photo","why":"Photos can be chosen to persuade.","_n":"m49d","_k":"86cdb7cd"},{"t":"Named sources, a named reporter and a published corrections policy","why":"Accountability signals.","_n":"n50e","_k":"5b5f2da4"}],"hints":["What lets you hold a story accountable?","Names and corrections.","Named sources, a named reporter and a corrections policy."]}],"refreshers":{"Fact vs opinion":"A fact can be checked against a record. An opinion judges. A quoted opinion is a fact \u003cem>about what someone said\u003c/em>, not proof of what they claim.","Connotation":"Words carry feelings beyond their dictionary meaning: “approves” vs “rams through”. Writers’ attitudes hide in verbs, adjectives and adverbs.","Judging a source":"Ask: who made this, how do they know, and what do \u003cem>other\u003c/em> sources say? Leave the page to find out."}}},"explore":{"heading":"Newsroom simulator","intro":"You’re the editor at a city paper. One true event, many ways to tell it. Every fact on the fact sheet is accurate. Watch what your choices do to a reader. Then read real coverage of a real event with the same eyes.","modes":[{"id":"editor","t":"Editor"},{"id":"reader","t":"Reader"},{"id":"lateral","t":"Lateral reading"}],"how":{"editor":"Build the story: choose a headline, a photo, a page, up to three sources and the facts. The m&#101;ter shows how a reader is likely to see the decision.","reader":"Read versions of one event side by side. Ask what each version \u003cem>chooses\u003c/em>, never whether an outlet is “biased” overall.","lateral":"A post about the lane is going around. Don’t stare harder at it: open new tabs to check the source and the claim."},"types":[{"id":"word","t":"Word choice","role":"diction"},{"id":"omission","t":"Selection and omission","role":"syntax"},{"id":"images","t":"Images and placement","role":"image"},{"id":"sources","t":"Sources and statistics","role":"sound"}],"verbs":[{"id":"approves","t":"approves","pts":0},{"id":"votesfor","t":"votes for","pts":0},{"id":"rams","t":"rams through","pts":-2},{"id":"finally","t":"finally delivers","pts":2}],"objects":[{"id":"lane","t":"Harbour Street bike lane"},{"id":"parking","t":"parking cut"},{"id":"safety","t":"safety plan"}],"details":[{"id":"none","t":"(no detail)","pts":0},{"id":"vote","t":"7–4","pts":0},{"id":"outcry","t":"despite merchant outcry","pts":-1},{"id":"injuries","t":"after nine injuries","pts":1}],"photos":[{"id":"a","t":"“No Parking” signs over empty spaces","pts":-1},{"id":"b","t":"A child cycling beside a delivery truck","pts":1},{"id":"c","t":"A wide shot of the council chamber during the vote","pts":0},{"id":"d","t":"The bakery owner looking worried in her doorway","pts":-1}],"places":[{"id":"front","t":"Front page, top"},{"id":"p14","t":"Page 14"}],"sources":[{"id":"q1","n":"Q1","who":"Marta Kowalczyk","role":"bakery owner","q":"Half my customers park right out front. Where will they go?","lead":"Bakery owner Marta Kowalczyk said","pts":-1},{"id":"q2","n":"Q2","who":"Councillor Ray Dunphy","role":"voted no","q":"We should have consulted merchants first.","lead":"Councillor Ray Dunphy, who voted no, said","pts":-1},{"id":"q3","n":"Q3","who":"Amira Haddad","role":"Harbour Street parents’ group","q":"My kids should be able to bike to school without dodging trucks.","lead":"Amira Haddad of the Harbour Street parents’ group said","pts":1},{"id":"q4","n":"Q4","who":"Councillor Hélène Tremblay","role":"voted yes","q":"This street has had nine cyclist injuries in three years. We can’t wait.","lead":"Councillor Hélène Tremblay, who voted yes, said","pts":1},{"id":"q5","n":"Q5","who":"Sunil Rao","role":"city traffic engineer","q":"Similar streets elsewhere kept most of their customers after lanes went in, but results vary.","lead":"City traffic engineer Sunil Rao said","pts":0},{"id":"q6","n":"Q6","who":"Ben Okafor","role":"commuter","q":"It already takes me twenty minutes to cross downtown.","lead":"Commuter Ben Okafor said","pts":-1}],"facts":[{"id":"vote","t":"Vote count","pts":0,"s":"Port Calder city council voted 7–4 on Tuesday to build a 1.2 km protected bike lane on Harbour Street."},{"id":"injuries","t":"Injuries","pts":1,"s":"City data show 9 cyclist injuries on Harbour Street in the past 3 years."},{"id":"grant","t":"Grant share","pts":1,"s":"A provincial grant covers 60% of the cost."},{"id":"cyclists","t":"Cyclist count","pts":1,"s":"A city count found 410 cyclists per weekday on the street."},{"id":"parking","t":"Parking removed","pts":-1,"s":"The lane removes 38 of the 120 street parking spots on that stretch."},{"id":"cost","t":"Cost","pts":-1,"s":"The lane costs $2.4 million."},{"id":"months","t":"Construction months","pts":-1,"s":"Construction runs from May to August."}],"factSheet":"\u003ch4 class='nb-fs-h'>Port Calder city council votes on a Harbour Street bike lane\u003c/h4>\u003cul class='nb-fs'>\u003cli>\u003cstrong>Vote:\u003c/strong> council voted \u003cstrong>7–4\u003c/strong> on Tuesday to build a \u003cstrong>1.2 km\u003c/strong> protected bike lane on Harbour Street.\u003c/li>\u003cli>\u003cstrong>Parking:\u003c/strong> removes \u003cstrong>38 of 120\u003c/strong> street parking spots on that stretch.\u003c/li>\u003cli>\u003cstrong>Cost and funding:\u003c/strong> costs \u003cstrong>$2.4 million\u003c/strong>; \u003cstrong>60%\u003c/strong> is covered by a provincial grant.\u003c/li>\u003cli>\u003cstrong>Use:\u003c/strong> a city count found \u003cstrong>410\u003c/strong> cyclists per weekday on the street.\u003c/li>\u003cli>\u003cstrong>Safety:\u003c/strong> \u003cstrong>9\u003c/strong> cyclist injuries on Harbour Street in the past \u003cstrong>3\u003c/strong> years (city data).\u003c/li>\u003cli>\u003cstrong>Timing:\u003c/strong> construction runs from May to August.\u003c/li>\u003c/ul>\u003cp class='nb-fs-q'>\u003cstrong>Quotations:\u003c/strong>\u003c/p>\u003cul class='nb-fs'>\u003cli>\u003cstrong>Q1\u003c/strong> · Marta Kowalczyk, bakery owner: “Half my customers park right out front. Where will they go?”\u003c/li>\u003cli>\u003cstrong>Q2\u003c/strong> · Councillor Ray Dunphy, voted no: “We should have consulted merchants first.”\u003c/li>\u003cli>\u003cstrong>Q3\u003c/strong> · Amira Haddad, Harbour Street parents’ group: “My kids should be able to bike to school without dodging trucks.”\u003c/li>\u003cli>\u003cstrong>Q4\u003c/strong> · Councillor Hélène Tremblay, voted yes: “This street has had nine cyclist injuries in three years. We can’t wait.”\u003c/li>\u003cli>\u003cstrong>Q5\u003c/strong> · Sunil Rao, city traffic engineer: “Similar streets elsewhere kept most of their customers after lanes went in, but results vary.”\u003c/li>\u003cli>\u003cstrong>Q6\u003c/strong> · Ben Okafor, commuter: “It already takes me twenty minutes to cross downtown.”\u003c/li>\u003c/ul>","outlets":[{"id":"courier","name":"The Calder Courier","where":"Page 1","place":"front","photo":"c","head":"Council Approves Harbour Street Bike Lane, 7–4","lead":["The Harbour Street bike lane will cost $2.4 million and remove 38 of the 120 parking spots on that stretch, with construction running from May to August.","“Half my customers park right out front. Where will they go?” asked bakery owner Marta Kowalczyk.","Councillor Ray Dunphy, who voted no, said, “We should have consulted merchants first.”"]},{"id":"portnow","name":"PortNow","where":"Online","place":"online","photo":"","head":"Council Rams Through Bike Lane Despite Merchant Outcry","lead":["Council voted 7–4 on Tuesday for the Harbour Street lane, a street where city data show 9 cyclist injuries in the past 3 years.","Councillor Hélène Tremblay, who voted yes, said, “This street has had nine cyclist injuries in three years. We can’t wait.”"]},{"id":"weekly","name":"Harbour Weekly","where":"Page 14","place":"p14","photo":"d","big":true,"head":"Council votes 7–4 for Harbour Street bike lane","lead":["Council voted 7–4 on Tuesday for a 1.2 km protected lane. City data show 9 cyclist injuries on the street in 3 years, and a provincial grant covers 60% of the $2.4 million cost. The lane removes 38 of 120 parking spots.","“Half my customers park right out front. Where will they go?” asked bakery owner Marta Kowalczyk. Councillor Hélène Tremblay said, “This street has had nine cyclist injuries in three years. We can’t wait.” City traffic engineer Sunil Rao said, “Similar streets elsewhere kept most of their customers after lanes went in, but results vary.”"]}],"realSlot":{"event":"","versions":[],"worked":""},"meterWords":["Strongly: bad decision","Leans: bad decision","Slightly: bad decision","Balanced","Slightly: good decision","Leans: good decision","Strongly: good decision"],"about":"\u003cstrong>About this model:\u003c/strong> a teaching model of how framing tilts readers; real readers vary. Each choice carries points: verbs (“rams through” −2, “finally delivers” +2), details (±1), photos (±1), sources (±1) and facts (±1). The reader impression is the sum, kept between −3 and +3. Placement doesn’t move the impression; it sets importance.","aha":"With identical facts, the verb and the photo alone can swing a reader from “good” to “bad”. Bias is in the building.","readout":{"imp":"Reader impression","importance":"Importance","balance":"Balance","flags":"Bias flags","facts":"Facts included"},"lateral":{"post":{"handle":"@CalderTruthNow","name":"Calder Truth Now","followers":"12.4k followers","text":"BREAKING: Port Calder blows \u003cstrong>$24 MILLION\u003c/strong> on a bike lane!!","reposts":"1.3k reposts"},"tabs":[{"id":"post","t":"The post","url":"social.example/CalderTruthNow"},{"id":"who","t":"Who’s behind it?","url":"search.example/?q=CalderTruthNow","sift":"I","html":"\u003ch5>Search results for “CalderTruthNow”\u003c/h5>\u003cul class='nb-res'>\u003cli>The account was created three weeks ago and posts only about the bike lane.\u003c/li>\u003cli>No names, address or contact details are listed anywhere.\u003c/li>\u003cli>No news outlet or official source cites it.\u003c/li>\u003c/ul>\u003cp class='tiny muted'>Followers and a confident tone aren’t credentials.\u003c/p>"},{"id":"budget","t":"City budget page","url":"portcalder.example/budget","sift":"T","html":"\u003ch5>City of Port Calder · Capital budget\u003c/h5>\u003ctable class='nb-bud'>\u003ctbody>\u003ctr>\u003cth scope='row'>Harbour Street protected bike lane (1.2 km)\u003c/th>\u003ctd>$2.4 million\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>Provincial grant\u003c/th>\u003ctd>60%\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>City share\u003c/th>\u003ctd>40%\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>"},{"id":"paper","t":"Local paper","url":"caldercourier.example","sift":"F","html":"\u003ch5>The Calder Courier\u003c/h5>\u003cp>The Harbour Street bike lane will cost \u003cstrong>$2.4 million\u003c/strong>; a provincial grant covers 60% of it, city budget documents show.\u003c/p>"}],"sift":[{"id":"S","t":"Stop"},{"id":"I","t":"Investigate the source"},{"id":"F","t":"Find better coverage"},{"id":"T","t":"Trace claims"}],"note":"Every page here is a simulation; no real web requests are made."},"reader":{"sets":[{"id":"real","t":"Real coverage"},{"id":"model","t":"Practice model"}],"slotEmpty":"\u003cstrong>Real coverage slot.\u003c/strong> Your teacher will add three Canadian outlets’ coverage of one recent event here (credited screenshots or excerpts). Until then, use the coverage your teacher shares in class, and record your analysis below.","ask":"For each version, ask “What does this headline choose?”, not “Is this outlet biased?”","fields":[{"id":"credit","t":"Outlet, headline, date and page or section (credit)"},{"id":"verb","t":"Headline verb"},{"id":"lead","t":"Facts in the lead"},{"id":"photo","t":"Photo"},{"id":"place","t":"Placement"},{"id":"src","t":"Sources quoted"},{"id":"miss","t":"The fact or voice most missing"}],"frameLabel":"Dominant framing choice","accept":"A diagnosis counts when it names one of the four bias types and points to a specific element of that version as evidence."},"predictions":[{"id":"p1","start":"base","change":{"verb":"rams"},"prompt":"Change only the verb to \u003cstrong>“rams through”\u003c/strong>. What happens to the reader impression?","options":[{"t":"The story becomes false","_n":"o4fe","_k":"31b94863"},{"t":"It stays at 0, because facts haven’t changed","_n":"p4ee","_k":"2bcf50ef"},{"t":"It rises, because strong verbs are exciting","_n":"q4de","_k":"95f33917"},{"t":"It drops to −2, even though every fact is the same","_n":"r44d","_k":"afb872f4"}],"explain":"No new fact was added, yet one verb tilted the reader. Bias can live entirely in word choice."},{"id":"p2","start":"base","change":{"photo":"b"},"prompt":"From the same start, swap the photo from the council chamber to \u003cstrong>the child cycling beside a truck\u003c/strong>. How will readers now tend to see the decision?","options":[{"t":"As a business decision","_n":"s43d","_k":"a7624901"},{"t":"As a traffic jam","_n":"t46d","_k":"6c2fb893"},{"t":"No change, because readers ignore photos","_n":"u47d","_k":"f8776a5b"},{"t":"More as a safety decision; the impression rises to +1","_n":"v48d","_k":"68ea1e3c"}],"explain":"Photos frame the story before readers reach a word."},{"id":"p3","start":"base","change":{"place":"p14"},"prompt":"Move the same story from the front page to \u003cstrong>page 14\u003c/strong>. What changes?","options":[{"t":"The impression flips to negative","_n":"w49d","_k":"ccab2eaf"},{"t":"The facts become less accurate","_n":"x4ad","_k":"f34b9468"},{"t":"The impression is unchanged, but readers judge the story less important","_n":"y4bd","_k":"667cd3fd"},{"t":"Nothing at all","_n":"z4cd","_k":"701aa478"}],"explain":"Placement is a choice about importance. Burying a story is a quiet kind of bias."},{"id":"p4","start":"lateral","prompt":"A post from @CalderTruthNow: “BREAKING: Port Calder blows \u003cstrong>$24 MILLION\u003c/strong> on a bike lane!!” Opening the city’s budget page in a new tab shows \u003cstrong>$2.4 million\u003c/strong>, 60% grant-funded, and the local paper agrees. What is the best next step?","options":[{"t":"Share it with a question mark, to be safe","_n":"104dd","_k":"a4759cb4"},{"t":"Don’t share it; trace the claim to the city’s own figure, and if you reply, link the source","_n":"113ed","_k":"690271b6"},{"t":"Read the post’s other replies to see what people think","_n":"123fd","_k":"b845d1ed"},{"t":"Trust it, because the account has many followers","_n":"1350e","_k":"f040ec53"}],"explain":"Off by a factor of ten. The post’s confidence is no evidence; the original record is."}],"base":{"verb":"approves","obj":"lane","detail":"none","photo":"c","place":"front","sources":["q2","q4","q5"],"facts":["vote","injuries","parking"]},"predIntro":"Every prediction starts from the same story: verb “approves”, the council-chamber photo, sources Q2, Q4 and Q5, and the vote count, injuries and parking facts (impression 0).","chalIntro":"Build in the newsroom, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Build the \u003cstrong>fairest\u003c/strong> front-page version you can. \u003cbutton type='button' class='btn ghost sm nb-setup' data-setup='tc1'>Set it up\u003c/button>","msgs":{"verb":"Start with a neutral verb: “approves” or “votes for”.","detail":"That detail carries a charge. Leave it off, or use “7–4”.","photo":"That photo tilts the reader before the text does. Which photo shows the event itself?","sides":"Readers hear only one side. Add a voice from the other.","facts":"Include at least one fact that favours the lane and one that counts against it.","vote":"Include the vote count: it’s the event itself.","lean":"Your facts lean one way. Balance the facts as well as the quotes.","place":"Put the story where a fair editor would put a city-wide decision: the front page."},"why":"A neutral verb, the event’s own photo, both sides heard and both kinds of fact: your balance checks all read ✔. Many versions meet this test; yours is one.","hints":["Start with a neutral verb and the council photo.","Pick one supporter and one opponent; Q5 (the engineer) adds evidence without tilting.","For example: “Council approves Harbour Street bike lane, 7–4”; photo (c); Q2, Q4, Q5; vote count, injuries, parking removed."]},{"id":"tc2","goal":[1,2],"prompt":"The sources and facts are now \u003cstrong>locked\u003c/strong> to a balanced set (Q2, Q4, Q5; vote count, injuries, parking removed). Using only the \u003cstrong>headline verb\u003c/strong> and \u003cstrong>photo\u003c/strong>, make readers see the decision as a bad one: impression ≤ −2. \u003cbutton type='button' class='btn ghost sm nb-setup' data-setup='tc2'>Set it up\u003c/button>","msgs":{"lock":"Press Set it up to lock the sources and facts first.","detail":"Use only the verb and the photo: set the detail back to none (or “7–4”).","small":"The photo alone tilts it only a little. Which element carries the biggest charge?","truck":"The child-and-truck photo pulls readers back toward safety."},"general":"Not yet. The impression needs to reach −2 or lower.","why":"Same facts, same quotes, opposite impression. Remember how easy that was.","hints":["Which lever has the biggest number in the model?","The verb: “rams through” is −2.","“Rams through” with a parking, council or worried-owner photo."]},{"id":"tc3","goal":[1,2],"stretch":true,"prompt":"\u003cstrong>Reader mode, practice model.\u003c/strong> Match each outlet to its main bias type, then choose the \u003cstrong>one fact\u003c/strong> that would most improve \u003ci>The Calder Courier\u003c/i>’s balance. \u003cbutton type='button' class='btn ghost sm nb-setup' data-setup='tc3'>Set it up\u003c/button>","_a":"GUdXC0FLClAQRw5GW1QKRhEMWwoWFUFFDRdACltOQQ9AElsWUBtPFxUAUQ9YQEEPQAxZBVNcEBdOR1IFV01BD0AMWg5BSwpQEUdJ","msgs":{"count":"Match all three outlets and choose one fact.","courier":"Its headline is neutral. Look at what’s \u003cem>missing\u003c/em> from the lead.","grant":"That helps too, but the council’s stated \u003cem>reason\u003c/em> for the vote was safety. Without the injury data, the “why” disappears.","weekly":"Its text is balanced. The tilt comes from the page and the picture."},"general":"Not yet. For each outlet, ask: is the slant in the words, the missing facts, or the layout?","why":"The \u003ci>Courier\u003c/i> tilts by omission, \u003ci>PortNow\u003c/i> by word choice and \u003ci>Harbour Weekly\u003c/i> by images and placement. Adding the injury figure restores the reason council gave.","hints":["For each outlet, ask: is the slant in the words, the missing facts, or the layout?","The \u003ci>Courier\u003c/i> never says \u003cem>why\u003c/em> council voted yes.","The \u003ci>Courier\u003c/i>: omission; \u003ci>PortNow\u003c/i>: word choice; \u003ci>Harbour Weekly\u003c/i>: images and placement. Add the injury figure."]}]},"part3":{"slug":"check","name":"Check","heading":"Check before you share","intro":"Explore was about framing true facts. This part is about checking claims: is it true at all? Work through the stations in a simulated browser. Each one practises a \u003cstrong>SIFT\u003c/strong> move: \u003cstrong>S\u003c/strong>top, \u003cstrong>I\u003c/strong>nvestigate the source, \u003cstrong>F\u003c/strong>ind better coverage, \u003cstrong>T\u003c/strong>race claims to their original context.","credit":"The SIFT method was developed by digital-literacy educator Mike Caulfield.","sift":[{"id":"S","t":"Stop"},{"id":"I","t":"Investigate the source"},{"id":"F","t":"Find better coverage"},{"id":"T","t":"Trace"}],"s1":{"title":"Station 1: Stop","post":{"handle":"@harbourwatcher","text":"Port Calder’s new lane, already underwater!"},"prompt":"Before anything else: what do you notice about your own reaction?","chips":["Angry","Amused","Wanting to share","Curious"],"note":"Strong feelings are the moment to slow down."},"s2":{"title":"Station 2: Investigate the source and trace the image","how":"Open the image-search tabs, then say what each trace shows.","posts":[{"id":"flood","label":"Post 1: the flooded lane","search":"\u003ch5>Image search: the flooded-lane photo\u003c/h5>\u003cp>\u003cstrong>Earliest match:\u003c/strong> a news story about spring flooding in a different city, dated 2019. The same photo appears on dozens of later pages.\u003c/p>","prompt":"What does the trace show about the flooded-lane photo?","choices":[{"t":"It’s a real photo from a 2019 flood in another city, used with a false caption","fb":"Right. The image is real; the caption’s claim isn’t.","_n":"144fe","_k":"a5c20fba"},{"t":"It’s AI-generated","fb":"It traces to a real 2019 news photo. Real photos can carry false captions.","_n":"1552e","_k":"519f0a13"},{"t":"It was taken this week on Harbour Street","fb":"The earliest copy is from 2019, in another city.","_n":"1651e","_k":"2be59d1b"},{"t":"Nothing: image search can’t help","fb":"The search found the original story. That’s the trace.","_n":"174ce","_k":"8849e077"}]},{"id":"mayor","label":"Post 2: the mayor in a blizzard","search":"\u003ch5>Image search: the mayor-in-a-blizzard image\u003c/h5>\u003cp>\u003cstrong>Earliest match:\u003c/strong> an account that posts AI-generated art, two days ago. No news outlet has published it.\u003c/p>","prompt":"What does the trace show about the mayor-in-a-blizzard image?","choices":[{"t":"It first appeared on an AI-art account and no reliable outlet carries it, so treat it as AI-generated","fb":"Right. The origin is the evidence.","_n":"184be","_k":"c1f627f2"},{"t":"It’s fake: you can tell from the hands","fb":"Visual tells come and go as tools improve. Trace the image’s origin instead.","_n":"194ee","_k":"a3ea2aff"},{"t":"It’s real, because it looks real","fb":"Convincing isn’t the same as authentic. Trace it.","_n":"1a4de","_k":"1644153a"},{"t":"It’s real, because so many people shared it","fb":"Popularity isn’t evidence.","_n":"1b48e","_k":"a96dcf5d"}]}],"tells":"Visual tells (garbled sign text, odd hands) can help, but improving tools make them unreliable. \u003cstrong>Tracing the origin is the dependable move.\u003c/strong>","example":"\u003cstrong>A real case.\u003c/strong> In March 2023, an AI-generated image of Pope Francis in a long white puffer coat spread widely as if it were a real photo. It was made with the image generator Midjourney, and reporting traced it to its creator."},"s3":{"title":"Station 3: Find better coverage","post":{"handle":"@calderchat","text":"City says lane will be built by June!"},"tabs":[{"id":"city","t":"City website","url":"portcalder.example/harbour-street","html":"\u003ch5>City of Port Calder · Harbour Street bike lane\u003c/h5>\u003cp>\u003cstrong>Construction:\u003c/strong> May to August.\u003c/p>"},{"id":"paper","t":"Local paper","url":"caldercourier.example","html":"\u003ch5>The Calder Courier\u003c/h5>\u003cp>Construction on Harbour Street runs from May to August, the city says.\u003c/p>"}],"prompt":"Is the post accurate, misleading or false?","choices":[{"t":"Accurate","fb":"The city says May to August, not done by June.","_n":"1c47e","_k":"6cdaa367"},{"t":"Misleading","fb":"Right. Partly true (the city is building it), but wrong on timing.","_n":"1d4ae","_k":"e1c8cc25"},{"t":"False","fb":"Not entirely: the lane is being built. The timing is what’s wrong.","_n":"1e4be","_k":"7dab50c4"}]},"s4":{"title":"Station 4: Trace, and name what it is","how":"Tap a label for each item.","labels":[{"id":"fc","t":"False context"},{"id":"fcl","t":"False claim, intent unknown"},{"id":"sat","t":"Satire"},{"id":"acc","t":"Accurate"},{"id":"spon","t":"Sponsored content"}],"items":[{"id":"i1","t":"The flooded-lane photo","_a":"QANXRg==","why":"A real photo used with a false caption, shared in good faith by many, so mostly misinformation."},{"id":"i2","t":"The $24 million post","_a":"QANXCBY=","why":"Without evidence of intent, treat it as misinformation and don’t share."},{"id":"i3","t":"“City replaces all cars with very tall bicycles,” from \u003ci>The Daily Puddle\u003c/i> (a fictional satire site)","_a":"QBZVEBY=","why":"Satire, which becomes misinformation when shared as real."},{"id":"i4","t":"A post from @PortCalderCity with the construction schedule","_a":"QARXBxY=","why":"Official and corroborated."},{"id":"i5","t":"“5 Reasons Bike Lanes Hurt Business,” labelled in small grey type “Paid content from Drivers for Calder”","_a":"QBZEC1ob","why":"Advocacy dressed as news."}],"wrong":"Not that label. Trace it: where did it come from, and what is it trying to do?"},"s5":{"title":"Station 5: Live trace","slotEmpty":"Your teacher will choose a current real claim, post or image that a fact-checking organization has already examined. Type it below, then run SIFT in your own browser. This module records your work; it makes no web requests.","claimLabel":"The claim you’re tracing","fields":[{"id":"first","t":"Where the claim first appeared"},{"id":"who","t":"Who is behind that source"},{"id":"better","t":"Better coverage found (outlet and date)"},{"id":"context","t":"The original context"}],"classes":["Accurate","Misleading","False context","Satire","Sponsored","False"],"ok":"✓ Every part is there. Your teacher compares your classification with the fact-checkers’ finding.","need":{"fields":"Fill in all four fields.","date":"In “better coverage”, name the outlet and a date with a 4-digit year.","cls":"Choose a classification."},"example":"\u003cstrong>A real case.\u003c/strong> In April 2013, a hacked news-agency account (the Associated Press’s Twitter account) posted a false report of explosions at the White House. Stock prices dipped sharply within minutes before recovering once the claim was traced and corrected. A trusted account is not the same as a verified claim.","slot":{"claim":""}},"blocks":[{"title":"Craft → meaning","html":"\u003cp class='an-note an-theme'>A fact-checker’s skill is mostly \u003cem>where to look\u003c/em>, not \u003cem>how hard to stare\u003c/em>. The four moves are a habit, and habits are what protect us when we’re tired, angry or rushed.\u003c/p>"}],"quickCheck":{"title":"Check quick check","summary":"Check quick check","items":[{"id":"q1","goal":4,"prompt":"A real photo with a false caption is…","choices":[{"t":"False context","fb":"Right. The image is real; the claim attached to it isn’t.","_n":"1f48e","_k":"772ba66e"},{"t":"Satire","fb":"The image is real; the claim attached to it isn’t.","_n":"1g49e","_k":"91451ec1"},{"t":"Accurate","fb":"The image is real; the claim attached to it isn’t.","_n":"1h4ee","_k":"59ceaaaa"},{"t":"Sponsored content","fb":"The image is real; the claim attached to it isn’t.","_n":"1i4fe","_k":"ed834a7c"}]},{"id":"q2","goal":3,"prompt":"Which SIFT move fits “open new tabs to see what reliable outlets say”?","choices":[{"t":"Stop","fb":"Look for the best coverage of the \u003cem>claim\u003c/em>.","_n":"1j4ce","_k":"5e3020ae"},{"t":"Trace","fb":"Look for the best coverage of the \u003cem>claim\u003c/em>.","_n":"1k4de","_k":"11f623ec"},{"t":"Find better coverage","fb":"Right. Look for the best coverage of the \u003cem>claim\u003c/em>.","_n":"1l42e","_k":"0ae9a926"},{"t":"Investigate the source","fb":"Look for the best coverage of the \u003cem>claim\u003c/em>.","_n":"1m43e","_k":"7035edd1"}]},{"id":"q3","goal":4,"prompt":"Your best defence against convincing AI-generated images is…","choices":[{"t":"Trusting your gut","fb":"Visual tells fade as tools improve; origins don’t.","_n":"1n44e","_k":"a9276e1d"},{"t":"Tracing where the image first appeared","fb":"Right. Visual tells fade as tools improve; origins don’t.","_n":"1o43e","_k":"d81e65ec"},{"t":"Zooming in on the hands","fb":"Visual tells fade as tools improve; origins don’t.","_n":"1p42e","_k":"6743080d"},{"t":"Counting the likes","fb":"Visual tells fade as tools improve; origins don’t.","_n":"1q41e","_k":"e5253893"}]},{"id":"q4","goal":4,"prompt":"A satirical headline shared as if real becomes…","choices":[{"t":"Sponsored content","fb":"Shared in good faith, it misinforms.","_n":"1r40e","_k":"c8a1bdc5"},{"t":"Accurate news","fb":"Shared in good faith, it misinforms.","_n":"1s3fe","_k":"c0df9467"},{"t":"Disinformation always","fb":"Shared in good faith, it misinforms.","_n":"1t3ee","_k":"9cfd077f"},{"t":"Misinformation","fb":"Right. Shared in good faith, it misinforms.","_n":"1u3de","_k":"dd5045b4"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='nb-steal'>“Falsehood flies, and the Truth comes limping after it; so that when Men come to be undeceiv’d, it is too late; the Jest is over, and the Tale has had its Effect.”\u003c/p>\u003cp class='eng-cite'>Jonathan Swift, \u003ci>The Examiner\u003c/i>, no. 14 (1710)\u003c/p>\u003cp>\u003cstrong>The pattern:\u003c/strong> personify two abstractions with contrasting verbs (\u003cem>flies\u003c/em> / \u003cem>comes limping\u003c/em>), then show the consequence.\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> write your own about any pair, such as Rumour and Correction, or Outrage and Evidence. For example: “Outrage sprints; Evidence ties its shoes.” The best go to the commonplace book.\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"Falsehood flies, and the Truth comes limping after it","source":"Swift, The Examiner, no. 14","save":"Save it to my commonplace book"}},"practice":{"activities":[{"id":"sort","type":"custom","title":"Name the bias","summary":"Name the bias","goal":[1,2],"txt":true,"noun":"item","instruction":"Ten moments from coverage of the lane. Sort each by its main type of bias. Trivium: Logic.","how":"","boxes":[{"id":"word","label":"Word choice"},{"id":"omission","label":"Selection and omission"},{"id":"images","label":"Images and placement"},{"id":"sources","label":"Sources and statistics"}],"items":[{"id":"n1","t":"Headline: “Merchants Fume as Lane Plan Bulldozes Parking”","_a":"QBJbFlAb","why":"“Fume” and “bulldozes” carry the attitude.","wrong":{"sources":"The tilt is in “fume” and “bulldozes”."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","Which words would you swap for neutral ones?","Word choice: “fume” and “bulldozes”."]},{"id":"n2","t":"The article quotes three business owners and no cyclists","_a":"QBZbEUZaBkZA","why":"Whose voices appear: a source imbalance.","wrong":{"omission":"It’s specifically about \u003cem>whose voices\u003c/em> appear: sources."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","Count the voices on each side.","Sources and statistics: only one side is quoted."]},{"id":"n3","t":"The story never mentions that 60% of the cost is grant-funded","_a":"QApZDUdKCloMRw==","why":"A missing fact that would change the reader’s view.","wrong":{"word":"No loaded word; a missing fact."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","Is anything in the story loaded, or is something left out?","Selection and omission: the grant is missing."]},{"id":"n4","t":"A crash photo from a different street runs beside the lane story","_a":"QAxZBVNcEBc=","why":"The picture frames the story, and it isn’t even this street.","wrong":{"sources":"The photo itself frames the story."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","What does the reader see before reading?","Images and placement: the photo does the framing."]},{"id":"n5","t":"“Collisions up 50%!” (6 in 2 years before; 9 in 3 years after)","_a":"QBZbEUZaBkZA","why":"A misleading statistic: 3 per year both times.","wrong":{"word":"The problem is the comparison: 3 per year both times."},"hints":["How many years in each count?","6 ÷ 2 and 9 ÷ 3.","3 per year both times: no increase. Sources and statistics."]},{"id":"n6","t":"The council vote runs on page 22; a celebrity visit gets the front page","_a":"QAxZBVNcEBc=","why":"Included, but buried: placement.","wrong":{"omission":"It’s included, but buried: placement."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","Is the vote missing, or just hard to find?","Images and placement: page 22."]},{"id":"n7","t":"“Long-suffering cyclists finally get their due”","_a":"QBJbFlAb","why":"“Long-suffering” and “finally” carry the attitude.","wrong":{"omission":"Look at “long-suffering” and “finally”."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","Find the adjectives and adverbs.","Word choice: “long-suffering” and “finally”."]},{"id":"n8","t":"An online poll of a cycling club’s followers reported as “Residents overwhelmingly support the lane”","_a":"QBZbEUZaBkZA","why":"A self-selected sample treated as residents.","wrong":{"omission":"The issue is a self-selected sample treated as residents."},"hints":["Who answered the poll?","People who follow a cycling club.","Sources and statistics: an unrepresentative sample."]},{"id":"n9","t":"The report gives the vote count but leaves out the reason councillors gave","_a":"QApZDUdKCloMRw==","why":"The “why” is missing.","wrong":{"sources":"The \u003cem>reason\u003c/em> is missing, not a voice."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","Is a voice missing, or a reason?","Selection and omission: the reason is left out."]},{"id":"n10","t":"Caption: “A lone shopper wanders a deserted Harbour Street,” under a photo taken at 7 a.m.","_a":"QAxZBVNcEBc=","why":"The frame (a deserted 7 a.m. street) does the main work.","wrong":{"word":"The caption’s words help, but the frame (a deserted 7 a.m. street) does the main work."},"hints":["Is the tilt in the words, in what’s missing, in the picture or the page, or in whose voices and which numbers?","When was the photo taken, and what would the street look like then?","Images and placement: the 7 a.m. frame."]}],"ext":{"title":"Real-world extension (not scored)","how":"Find one example of each bias type in the real coverage from Explore. Describe it in a sentence and credit it (outlet, headline, date). Your teacher sees these in your summary.","ph":"Example and credit"}},{"id":"lab","type":"custom","title":"Lateral reading lab","summary":"Lateral reading lab","goal":[3,4,5],"star":true,"instruction":"Six source puzzles from Port Calder. Items 3 to 6 are ★ non-routine; items 4 and 6 go beyond the Final Check. Trivium: Logic.","how":"","items":[{"id":"l1","goal":3,"prompt":"CalderFacts.info has no author, no “About” page, and cites “studies show”. Best next step?","options":[{"t":"Read its other articles","why":"A site can’t vouch for itself. Anyone can make a site look professional. Leave the page and find out who’s behind it.","_n":"1v4ce","_k":"f3a02c6a"},{"t":"Search for who runs the site (Investigate the source)","why":"Leave the page: find out who’s behind it.","_n":"1w4be","_k":"0a8c783d"},{"t":"Share it and ask your followers","why":"Sharing spreads a claim no one has checked.","_n":"1xbee","_k":"fae991b4"},{"t":"Trust it, because it cites studies","why":"“Studies show” isn’t a source. Which studies?","_n":"1ybfe","_k":"de40d08e"}],"hints":["Who could tell you about this site besides the site?","Open a new tab.","Search for who runs the site."]},{"id":"l2","goal":3,"prompt":"A local-paper article has a named reporter, three named sources and a corrections policy. Your stance?","options":[{"t":"Credible only if it has many shares","why":"Popularity isn’t accuracy.","_n":"1zc0e","_k":"ca5a3a38"},{"t":"Fully proven","why":"Credible isn’t infallible; check the numbers that matter.","_n":"20c1e","_k":"7bd02aa2"},{"t":"Reasonably credible, but corroborate key figures","why":"Strong accountability signals, and you still check the numbers that matter.","_n":"21bae","_k":"c3de9a13"},{"t":"Unreliable, because all news is biased","why":"Cynicism skips the evaluation. These are strong accountability signals.","_n":"22bbe","_k":"9775e77c"}],"hints":["What do names and a corrections policy tell you?","Accountable, but not perfect.","Reasonably credible; corroborate key figures."]},{"id":"l3","goal":5,"star":true,"prompt":"A screenshot shows Councillor Tremblay saying “…We can’t wait.” The full quotation (Q4) begins with the injury figure. What does the crop change?","options":[{"t":"Nothing; the words are hers","why":"Accurate words in a misleading frame still mislead. Trace to the original context.","_n":"23bce","_k":"7b506b78"},{"t":"It shows that she voted no","why":"Tremblay voted yes. The original context (Q4) shows why.","_n":"24bde","_k":"30a348fc"},{"t":"It makes the quotation false","why":"The words are accurate; the frame is what misleads.","_n":"25c6e","_k":"3d07c6f4"},{"t":"It removes her reason, making her sound impatient rather than safety-driven","why":"The crop keeps her words and loses her reason.","_n":"26c7e","_k":"8d0d7409"}],"hints":["Read the whole of Q4.","What did the crop cut off?","Her reason: the injury figure."]},{"id":"l4","goal":[1,6],"star":true,"type":"build","prompt":"Rewrite “Council Rams Through Bike Lane Despite Merchant Outcry” as a neutral headline using the chip builder.","verbs":["approves","votes for","passes","rams through","caves on"],"objects":["Harbour Street bike lane","bike lane chaos"],"details":["(no detail)","7–4","despite merchant outcry","amid fury"],"neutral":["approves","votes for","passes"],"loaded":["rams","outcry","slams","caves","finally","chaos","fury"],"msgs":{"loaded":"“{w}” is a judgment. Report the vote.","vote":"Add the vote count: 7–4.","verb":"Choose a verb that reports, such as “approves”."},"why":"A neutral verb and the vote count: the facts carry the story.","hints":["Which verbs report without judging?","“Approves”, “votes for” or “passes”, plus the vote count.","For example: “Council approves Harbour Street bike lane, 7–4”."]},{"id":"l5","goal":[3,2],"star":true,"prompt":"“Bike lane kills downtown: 38 parking spots gone!” What do you most need to judge this?","options":[{"t":"Whether you agree with the lane","why":"Disagreeing isn’t evidence of bias. Point to the choices: word choice, omission, photos, sources.","_n":"27c8d","_k":"9c7000e7"},{"t":"The number of likes","why":"Popularity says nothing about accuracy. Compare like with like: per year, per person, out of how many?","_n":"28c7d","_k":"ec4dca4b"},{"t":"The emotional tone of the headline","why":"The tone tells you about framing, not about the facts you need.","_n":"29cad","_k":"3aff6a24"},{"t":"The total (38 of 120) and evidence about how customers actually arrive","why":"A number needs its base, and a claim about business needs evidence about customers.","_n":"2ac9d","_k":"851b3a87"}],"hints":["38 out of how many?","And do most customers arrive by car?","The total (38 of 120) and evidence about how customers arrive."]},{"id":"l6","goal":[4,5],"star":true,"prompt":"A news-style article, “5 Reasons Bike Lanes Hurt Business”, carries a small grey label: “Paid content from Drivers for Calder”. Also, a reader complains that a story on the injury data “didn’t give equal space to people who say bike lanes cause injuries”. Which response is best?","options":[{"t":"Give every claim equal space","why":"That’s false balance. Fairness means representing the real perspectives accurately, not treating a disproven claim as equal to the evidence.","_n":"2bccd","_k":"b4e82a91"},{"t":"Treat the paid piece as advocacy and check its claims elsewhere; fairness means representing perspectives accurately, not giving equal weight to claims the evidence doesn’t support","why":"Purpose first, then evidence. Fairness means representing the real perspectives accurately, not treating a disproven claim as equal to the evidence.","_n":"2ccbd","_k":"a59452ae"},{"t":"Trust the paid piece, because it looks like news","why":"“Paid content” tells you its purpose. Anyone can make a site look professional. Leave the page and find out who’s behind it.","_n":"2dced","_k":"328349a5"},{"t":"Ignore both: the paid piece and the complaint are equally worthless","why":"Sponsored content may contain true points; check them. And the complaint deserves an answer: accuracy, not equal airtime.","_n":"2ecdd","_k":"1acb2e1d"}],"hints":["What does “paid content” tell you about purpose?","Fair isn’t the same as equal airtime.","Advocacy, to be checked; avoid false balance."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Anouk","goal":[5,3,2],"instruction":"Anouk made one mistake in each analysis. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":5,"task":"Is \u003ci>The Calder Courier\u003c/i>’s lane story biased?","steps":["“The \u003ci>Courier\u003c/i>’s story says the lane will cost $2.4 million and remove 38 spots.”","“I think the lane is a good idea.”","“Because the story makes the lane sound bad and I disagree with that, it’s biased.”","“So the \u003ci>Courier\u003c/i> can’t be trusted.”"],"_a":"UA==","stepFb":["Accurate summary.","It’s fine to state your view, as long as you don’t treat it as evidence.","","Step 4 builds on step 3’s faulty reasoning."],"fixes":[{"t":"“The story omits the injury data and the grant, the facts behind the council’s reasoning, so its selection tilts readers against the lane.”","why":"Evidence from the text: what’s missing.","_n":"2fc0d","_k":"58a9b979"},{"t":"“Because I disagree strongly, it’s very biased.”","why":"Same mistake, louder. Disagreeing isn’t evidence of bias. Point to the choices: word choice, omission, photos, sources.","_n":"2gbfd","_k":"5a58a8f2"},{"t":"Step 3 is fine.","why":"Disagreement isn’t evidence of bias.","_n":"2h42c","_k":"8557bc0a"},{"t":"“All newspapers are biased, so it doesn’t matter.”","why":"Cynicism skips the analysis.","_n":"2i43c","_k":"21388e92"}],"hints":["What evidence \u003cem>in the text\u003c/em> shows a tilt?","Look at what’s missing.","Omission of the injury data and the grant."]},{"id":"e2","goal":3,"task":"Evaluate CalderFacts.info as a source.","steps":["“CalderFacts.info has a clean design and lots of graphs.”","“So it must be a reliable source.”","“Its claim that lanes hurt business is probably true.”","“I’ll cite it in my essay.”"],"_a":"Uw==","stepFb":["Accurate observation.","","This follows from step 2. The problem is earlier.","This follows from step 2. The problem is earlier."],"fixes":[{"t":"“The graphs prove it.”","why":"Graphs can be made to show anything; check the data’s source.","_n":"2j40c","_k":"4c9b00ba"},{"t":"“Design tells me nothing about reliability. I’ll search for who runs the site and whether reliable sources support its claims.”","why":"Leave the page: investigate the source laterally.","_n":"2k41c","_k":"f9b5c2bd"},{"t":"“So it’s unreliable because it looks too good.”","why":"Appearance isn’t evidence either way.","_n":"2l3ec","_k":"745b7df0"},{"t":"Step 2 is fine.","why":"Anyone can make a site look professional. Leave the page and find out who’s behind it.","_n":"2m3fc","_k":"432d597e"}],"hints":["Does a clean design prove anything?","Leave the page.","Investigate the source laterally."]},{"id":"e3","goal":2,"task":"Judge the claim “Harbour Street got 50% more dangerous.”","steps":["“Before the speed change there were 6 collisions in 2 years.”","“After it there were 9 collisions in 3 years.”","“9 is 50% more than 6.”","“So the street became 50% more dangerous.”"],"_a":"UQ==","stepFb":["An accurate figure. Keep going.","An accurate figure. Keep going.","The arithmetic is right; the comparison is the issue. Keep going.",""],"fixes":[{"t":"“So the street became 150% more dangerous.”","why":"Same mistake, worse arithmetic.","_n":"2n3cc","_k":"755851d8"},{"t":"“So collisions dropped.”","why":"The rate stayed the same.","_n":"2o3dc","_k":"0f05a5e2"},{"t":"Step 4 is fine.","why":"Compare like with like: per year, per person, out of how many?","_n":"2p4ac","_k":"bc4a021d"},{"t":"“Per year, it’s 3 before and 3 after, so the rate didn’t change; the totals cover different lengths of time.”","why":"Compare rates, not totals over different periods.","_n":"2q4bc","_k":"fced0180"}],"hints":["Are the time periods equal?","Divide each by its years.","3 per year both times."]}]}]},"reflect":{"journal":[{"id":"j1","q":"In the newsroom, which single choice (verb, photo, placement or sources) moved the m&#101;ter more than you expected? Why do you think it’s so powerful?"},{"id":"j2","q":"In your own words, explain how a story made entirely of true facts can still be biased."},{"id":"j3","q":"Explain the four SIFT moves to a friend, using a post you’ve actually seen (no names needed)."},{"id":"j4","q":"What perspective do \u003cem>you\u003c/em> bring to news about your city or school? How might it bend your reading, the way a bowl’s bias bends its roll?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one headline, line or idea from today that changed how you’ll read, with one sentence on why.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one principle for reading, or writing, the news fairly, in your own words. Add a master’s example (Milton, Swift, or a line from the newsroom), and an imitation: one sentence of your own that follows the principle.","placeholder":"e.g. Leave the page: a claim can’t vouch for itself.","examples":["Give me the liberty to know, to utter, and to argue freely according to conscience, above all liberties. (Milton, \u003ci>Areopagitica\u003c/i>)","Falsehood flies, and the Truth comes limping after it (Swift, \u003ci>The Examiner\u003c/i>, no. 14)","Council approves Harbour Street bike lane, 7–4 (the newsroom)","Council rams through Harbour Street bike lane (the newsroom)"]},"artSamples":[{"p":"Ask what was left out of the frame before you judge what’s in it.","m":"The \u003ci>Courier\u003c/i>’s neutral headline over a lead with no injury figures and no grant"},{"p":"Leave the page: a claim can’t vouch for itself.","m":"@CalderTruthNow’s “$24 MILLION” against the city’s own budget page ($2.4 million)"}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Leaving out important facts that would change a reader’s view is called…","options":[{"t":"bias by omission","why":"What’s missing tilts the story.","_n":"2ra57","_k":"b5ffd42b"},{"t":"loaded language","why":"That’s about word choice.","_n":"2sa67","_k":"f75dfa02"},{"t":"placement bias","why":"That’s about where a story runs.","_n":"2ta37","_k":"ab207ac4"},{"t":"false balance","why":"That’s giving unequal claims equal weight.","_n":"2ua47","_k":"9f4d7a9a"}]},"b":{"prompt":"Using emotionally charged words such as “rams through” or “outcry” is called…","options":[{"t":"loaded language (word-choice bias)","why":"The words carry the attitude.","_n":"2va97","_k":"feb47cb3"},{"t":"satire","why":"Satire is intentionally false humour.","_n":"2waa7","_k":"7288cd05"},{"t":"bias by omission","why":"Nothing is left out; the words carry the tilt.","_n":"2xa77","_k":"14fc1574"},{"t":"lateral reading","why":"That’s a checking method.","_n":"2ya87","_k":"d5b8803a"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"False information shared by someone who believes it’s true is…","options":[{"t":"disinformation","why":"Disinformation is false \u003cem>and meant to deceive\u003c/em>.","_n":"2z9d7","_k":"8f3117a9"},{"t":"satire","why":"Satire is meant to be recognized as false.","_n":"309e7","_k":"60d00819"},{"t":"sponsored content","why":"That’s paid persuasion.","_n":"31ab7","_k":"d19188df"},{"t":"misinformation","why":"False, but shared in good faith.","_n":"32aa7","_k":"38cfc664"}]},"b":{"prompt":"False information created deliberately to deceive is…","options":[{"t":"misinformation","why":"That’s shared in good faith.","_n":"33ad7","_k":"cd34c737"},{"t":"parody","why":"Parody wants to be recognized.","_n":"34ac7","_k":"dcb538bf"},{"t":"a correction","why":"A correction fixes errors.","_n":"35a77","_k":"30fb9e3e"},{"t":"disinformation","why":"False and meant to deceive.","_n":"36a67","_k":"262fa693"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"In the SIFT method, what does the \u003cstrong>T\u003c/strong> stand for?","options":[{"t":"Trace claims, quotes and media to their original context","why":"Follow it back to where it started.","_n":"37a97","_k":"98e90389"},{"t":"Type the claim into the post’s comments","why":"Comments aren’t a source.","_n":"38a87","_k":"3526a064"},{"t":"Trust sources with many followers","why":"Anyone can make a site look professional. Leave the page and find out who’s behind it.","_n":"39a37","_k":"a3a74876"},{"t":"Test the website’s design","why":"Design isn’t evidence.","_n":"3aa27","_k":"739f54df"}]},"b":{"prompt":"What is \u003cstrong>lateral reading\u003c/strong>?","options":[{"t":"Leaving a site to see what other sources say about it and its claims","why":"Open new tabs; a site can’t vouch for itself.","_n":"3b197","_k":"db26aacc"},{"t":"Reading only headlines across many sites","why":"Headlines alone don’t verify.","_n":"3c1a7","_k":"e16a059a"},{"t":"Reading the comments under a post","why":"Comments aren’t verification.","_n":"3d1b7","_k":"81d61bce"},{"t":"Reading a site’s pages from top to bottom carefully","why":"That’s vertical reading.","_n":"3e1c7","_k":"2a0ae802"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"Lead paragraph (\u003ci>PortNow\u003c/i>, from the newsroom’s practice model): “Despite fierce opposition from the small businesses who built this street, council voted 7–4 Tuesday to hand Harbour Street over to cyclists.” Which bias technique dominates?","options":[{"t":"Loaded word choice and framing: “fierce opposition”, “who built this street”, “hand over”","why":"The facts are few; the framing words do the work.","_n":"3f157","_k":"6d640874"},{"t":"Placement bias","why":"No information about the page.","_n":"3g167","_k":"0f318ead"},{"t":"None; it reports the vote count","why":"Every fact here is true, yet the m&#101;ter swung. Bias can live in what’s chosen and how it’s framed.","_n":"3h177","_k":"2d5ea8cf"},{"t":"Bias by omission only","why":"Something may be missing, but the words carry the tilt here.","_n":"3i187","_k":"9f24be59"}]},"b":{"prompt":"Lead (\u003ci>The Calder Courier\u003c/i>, practice model): “Council voted 7–4 Tuesday for a bike lane on Harbour Street. Bakery owner Marta Kowalczyk, Councillor Ray Dunphy and commuter Ben Okafor all criticized the plan.” Which bias technique dominates?","options":[{"t":"Source imbalance: only critics are quoted","why":"Three voices, all on one side.","_n":"3j217","_k":"baee8e85"},{"t":"Placement bias","why":"No placement information.","_n":"3k227","_k":"76632188"},{"t":"Loaded language","why":"The verbs are neutral.","_n":"3l9f7","_k":"a824ce52"},{"t":"No bias, because all the quotes are accurate","why":"Every fact here is true, yet the m&#101;ter swung. Bias can live in what’s chosen and how it’s framed.","_n":"3m9e7","_k":"e8bcff08"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Headline: “Collisions Up 50%!” The data: 6 collisions in the 2 years before; 9 in the 3 years after. Is the headline justified?","options":[{"t":"No, because collisions actually fell by 50%","why":"The rate held steady.","_n":"3n9d7","_k":"6a4aeaa6"},{"t":"Yes, because any increase is news","why":"The “increase” is an artifact of the different time periods.","_n":"3o9c7","_k":"cb943ea8"},{"t":"Yes, because 9 is 50% more than 6","why":"Compare like with like: per year, per person, out of how many?","_n":"3p9b7","_k":"be431782"},{"t":"No. Per year it’s 3 before and 3 after, so the rate didn’t change","why":"Compare rates over equal periods.","_n":"3q9a7","_k":"652962d3"}]},"b":{"prompt":"“Two out of three residents support the lane,” based on an online poll posted on a cycling club’s page. Is the claim justified?","options":[{"t":"Yes, because two out of three is a clear majority","why":"The sample matters more than the fraction.","_n":"3r997","_k":"d74cf407"},{"t":"No, because polls are always fake","why":"Some polls are well designed; this one isn’t.","_n":"3s987","_k":"2610a98b"},{"t":"No. The sample is self-selected and not representative of residents","why":"Who answered matters more than the fraction.","_n":"3ta77","_k":"d32f70c0"},{"t":"Yes, if more than 100 people answered","why":"A large biased sample is still biased.","_n":"3ua67","_k":"fd1e292f"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"A video captioned “Tonight’s protest at City Hall!” is spreading fast. What is the best first step before believing or sharing it?","options":[{"t":"Check how many shares it has","why":"Popularity isn’t evidence. Anyone can make a site look professional. Leave the page and find out who’s behind it.","_n":"3v2d6","_k":"e0ccda28"},{"t":"Share it with “Is this real?”","why":"Sharing spreads it either way.","_n":"3w2e6","_k":"d879d3ec"},{"t":"Trace it: find where and when the video was first posted, and whether reliable outlets report the event","why":"Origins and better coverage are the evidence.","_n":"3x2b6","_k":"d2fba313"},{"t":"Watch it several times to look for editing","why":"Staring is less reliable than tracing.","_n":"3y2c6","_k":"16a71b84"}]},"b":{"prompt":"A post quotes “an expert” saying bike lanes raise asthma rates. The expert is a dentist with a large following. What’s the best evaluation?","options":[{"t":"Trust it, because experts are experts","why":"Expertise is field-specific.","_n":"3z296","_k":"28f427cd"},{"t":"Dismiss it, because dentists can’t have opinions","why":"Anyone can have an opinion; the question is authority on \u003cem>this\u003c/em> claim.","_n":"402a6","_k":"ed6a056e"},{"t":"Check whether the person’s expertise matches the claim, and find better coverage from public-health sources","why":"Authority is field-specific; find the right experts.","_n":"41276","_k":"c1197d9e"},{"t":"Trust it if the post has a checkmark","why":"A checkmark isn’t expertise. Anyone can make a site look professional. Leave the page and find out who’s behind it.","_n":"42286","_k":"6c3ab731"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best neutral rewrite of “Cyclists Win Again as Council Caves”?","options":[{"t":"“Council finally does the right thing on bike lane.”","why":"“Finally” and “right thing” are loaded.","_n":"43256","_k":"52c15b79"},{"t":"“Bike lane chaos: council votes.”","why":"“Chaos” is loaded.","_n":"44266","_k":"0ea2f859"},{"t":"“Council approves Harbour Street bike lane in 7–4 vote”","why":"A neutral verb and the vote count.","_n":"45136","_k":"1794cae7"},{"t":"“Council surrenders to cycling lobby.”","why":"“Surrenders” and “lobby” are loaded.","_n":"46126","_k":"f5192d86"}]},"b":{"prompt":"Which sentence best explains how a photo choice creates bias?","options":[{"t":"“Photos can’t be biased because cameras record reality.”","why":"Choosing \u003cem>which\u003c/em> photo is a framing decision.","_n":"47156","_k":"cca8afcc"},{"t":"“The photo is biased because I don’t like it.”","why":"Disagreeing isn’t evidence of bias. Point to the choices: word choice, omission, photos, sources.","_n":"48146","_k":"61bb0162"},{"t":"“By pairing the vote story with a photo of a worried shop owner, the outlet frames the lane as a threat to business before readers reach a single fact.”","why":"It names the choice and its effect on readers.","_n":"49176","_k":"4c5a1007"},{"t":"“The photo is of a shop owner.”","why":"That’s description, not analysis.","_n":"4a166","_k":"f3d5cb29"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which sentence best analyses the \u003ci>Courier\u003c/i>’s perspective?","options":[{"t":"“The \u003ci>Courier\u003c/i> writes from a downtown-business perspective: it quotes only merchants and leads with parking, so the safety rationale disappears.”","why":"A perspective, with evidence from the text.","_n":"4b196","_k":"be2a08b2"},{"t":"“The \u003ci>Courier\u003c/i> is wrong about the lane.”","why":"That judges the policy, not the perspective. Disagreeing isn’t evidence of bias. Point to the choices: word choice, omission, photos, sources.","_n":"4c186","_k":"dbeb4e11"},{"t":"“I don’t like the \u003ci>Courier\u003c/i>.”","why":"Disagreeing isn’t evidence of bias. Point to the choices: word choice, omission, photos, sources.","_n":"4d1b6","_k":"6b505358"},{"t":"“The \u003ci>Courier\u003c/i> is biased.”","why":"A label without evidence.","_n":"4e1a6","_k":"ddabaa56"}]},"b":{"prompt":"Which sentence best acknowledges the writer’s own perspective while evaluating a story?","options":[{"t":"“As a cyclist, I ignored the merchants’ quotes.”","why":"Acknowledging bias means checking it, not indulging it.","_n":"4fa16","_k":"f9d9dea1"},{"t":"“My perspective doesn’t matter; I’m objective.”","why":"Everyone reads from somewhere.","_n":"4ga26","_k":"f95511af"},{"t":"“As a cyclist, I’m inclined to favour the lane, so I checked that the injury figures came from the city before relying on them.”","why":"It names the perspective and checks it.","_n":"4ha36","_k":"e9b09a16"},{"t":"“I’m a cyclist, so I know the lane is good.”","why":"Disagreeing isn’t evidence of bias. Point to the choices: word choice, omission, photos, sources.","_n":"4ia46","_k":"70bf35c3"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Before a municipal election, a shocking, unsourced post about a candidate goes viral in your class group chat. What’s the best action?","options":[{"t":"Share it, because people deserve to know","why":"Spreading an unverified claim can do real harm.","_n":"4ja56","_k":"e7a0d341"},{"t":"Don’t share; look for coverage by reliable outlet
