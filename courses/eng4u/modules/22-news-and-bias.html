s; if it’s false, tell the group kindly and link what you found","why":"Check first, then correct with evidence and kindness.","_n":"4ka66","_k":"ffb694f4"},{"t":"Ignore it completely","why":"Silence is allowed, but checking and gently correcting helps more.","_n":"4la76","_k":"cbd1ff49"},{"t":"Assume it’s disinformation and report everyone who shared it","why":"Many sharers act in good faith. Misinformation is shared in good faith; disinformation is meant to deceive; satire wants to be recognized. You often can’t know intent, but you can always check before sharing.","_n":"4ma86","_k":"c5e4dcf3"}]},"b":{"prompt":"A friend shares an image of the mayor riding a bike through a blizzard in a suit, calling it real. What’s the best response?","options":[{"t":"Point out kindly that it traces back to an AI-art account and no reliable outlet carries it, and share what you found","why":"The origin is the evidence; share it kindly.","_n":"4n996","_k":"49ff2126"},{"t":"Share it yourself as a joke","why":"It may spread as real.","_n":"4o9a6","_k":"4e598af0"},{"t":"Say nothing and unfollow","why":"Allowed, but a kind correction with evidence helps more.","_n":"4pa76","_k":"bd967055"},{"t":"Tell them it’s obviously fake from the hands","why":"Visual tells are unreliable; the origin is the evidence.","_n":"4qa66","_k":"1d092949"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"You want to understand the Harbour Street debate fully. Which set of three sources is best?","options":[{"t":"A satire site, a meme and a comment thread","why":"None of these is built to inform. Misinformation is shared in good faith; disinformation is meant to deceive; satire wants to be recognized. You often can’t know intent, but you can always check before sharing.","_n":"4ra56","_k":"a500f279"},{"t":"The city’s report (data), a local news story quoting both sides, and the merchants’ association statement (read as advocacy)","why":"Data, balanced reporting and a named perspective, each read for what it is.","_n":"4sa46","_k":"15e0367a"},{"t":"Three outlets that all oppose the lane","why":"Range matters.","_n":"4tab6","_k":"d2080a78"},{"t":"Three posts from the same passionate account","why":"One voice, three times.","_n":"4uaa6","_k":"0405bdd6"}]},"b":{"prompt":"A news-style article is labelled “Sponsored by Drivers for Calder”. How should you evaluate it?","options":[{"t":"As neutral reporting, because it looks like news","why":"Anyone can make a site look professional. Leave the page and find out who’s behind it.","_n":"4va96","_k":"86225619"},{"t":"As advocacy: note its purpose and check its claims against independent sources","why":"Purpose first, then evidence.","_n":"4wa86","_k":"28aa4512"},{"t":"Trust it, because sponsors must tell the truth","why":"Sponsorship doesn’t guarantee accuracy.","_n":"4x9f6","_k":"862db828"},{"t":"Ignore it entirely, because sponsored content is always false","why":"It may contain true points; check them.","_n":"4y9e6","_k":"448d63fe"}]}}]},"task":{"title":"Performance task: Fair front page","summary":"Fair front page","statement":"\u003cp>A new event just happened in Port Calder. Write a fair front-page story (headline plus 120–180 words), then a short editor’s note explaining your choices. There are many good stories. Make yours fair, clear and alive.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg nb-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Level\u003c/th>\u003cth scope='col'>Knowledge: news conventions (lead, attribution)\u003c/th>\u003cth scope='col'>Thinking: fairness and selection\u003c/th>\u003cth scope='col'>Communication: clarity and style\u003c/th>\u003cth scope='col'>Application: editor’s note (naming bias)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope='row'>1\u003c/th>\u003ctd>Few present\u003c/td>\u003ctd>One-sided\u003c/td>\u003ctd>Unclear\u003c/td>\u003ctd>Missing\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>2\u003c/th>\u003ctd>Some present\u003c/td>\u003ctd>Some balance\u003c/td>\u003ctd>Somewhat clear\u003c/td>\u003ctd>Names a bias vaguely\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>3\u003c/th>\u003ctd>Clear and correct\u003c/td>\u003ctd>Balanced, with justified selection\u003c/td>\u003ctd>Clear and concise\u003c/td>\u003ctd>Explains a choice\u003c/td>\u003c/tr>\u003ctr>\u003cth scope='row'>4\u003c/th>\u003ctd>Polished and economical\u003c/td>\u003ctd>Balanced, nuanced and anticipates misreadings\u003c/td>\u003ctd>Vivid, precise and fair in tone\u003c/td>\u003ctd>Insightful reflection on framing\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Headline: clear and unloaded","Lead covers who, what, when","Both sides heard","Facts with numbers","Story length","Editor’s note names a bias you avoided"],"tips":["Keep the headline to 6–14 words and let the facts do the work. Swap any loaded word for a neutral verb.","Put who, what and when in your first sentence or two.","Insert one supporting and one opposing quotation from the fact sheet.","Use at least two numbers. They anchor fairness.","Aim for 120–180 words.","In 60–100 words, name a bias you steered around and how."],"explainPrompt":"Craft statement: Which sentence in your story was hardest to make fair, and what did you change?","explainLabel":"Craft statement","vocab":"Use framing, selection, word choice and perspective.","checkLabel":"Check my front page","success":"Your front page has every part.","more":"Try another angle (hard news, human interest or data-led): each complete one joins your list.","facts":{"title":"Port Calder District School Board votes on a later start","items":["\u003cstrong>Vote:\u003c/strong> the Port Calder District School Board voted \u003cstrong>8–3\u003c/strong> to move the high-school start time from 8:30 to \u003cstrong>9:15\u003c/strong> beginning in \u003cstrong>September\u003c/strong>.","\u003cstrong>Cost:\u003c/strong> the change requires \u003cstrong>four\u003c/strong> additional bus routes, costing \u003cstrong>$310 000\u003c/strong> a year.","\u003cstrong>Surveys:\u003c/strong> a board survey of \u003cstrong>1 240\u003c/strong> students found \u003cstrong>71%\u003c/strong> in favour. A separate parent survey found \u003cstrong>46%\u003c/strong> worried about conflicts with after-school jobs and sports."],"quotes":[{"id":"mensah","tag":"supports","who":"Board chair Dr. Ama Mensah","q":"Our students told us they’re exhausted. We listened."},{"id":"ross","tag":"supports","who":"Student trustee Talwyn Ross","q":"First period at 8:30 is a room full of zombies."},{"id":"ferreira","tag":"opposes","who":"Parent Dana Ferreira","q":"Practices will now end after dark in November."},{"id":"baptiste","tag":"opposes","who":"Coach Luis Baptiste","q":"We’ll lose gym time we share with the community."},{"id":"walsh","tag":"neutral","who":"Transportation manager Erin Walsh","q":"The new bell times require four additional bus routes."}],"lead":{"who":["school board","port calder district school board"],"what":"9:15","when":"September"},"numbers":[{"t":"8–3","alt":["8-3"]},{"t":"$310 000","alt":["310 000","310,000","310 000"]},{"t":"1 240","alt":["1,240","1 240"]},{"t":"71%","alt":[]},{"t":"46%","alt":[]},{"t":"four additional bus routes","alt":[]}]},"headMin":6,"headMax":14,"min":120,"max":180,"noteMin":60,"noteMax":100,"leadWords":40,"loaded":["slams","rams","caves","chaos","finally","disaster","outrage","shocking","destroys","war","fury","blasts","bombshell","zombies"],"noteWords":["word choice","loaded language","omission","selection","placement","photo","sources","statistics"],"labels":{"head":"Headline","story":"Story","note":"Editor’s note","quotes":"Quotation picker","quotesHow":"Tap a quotation to insert it, exactly, at the cursor in your story. Each is tagged by the side it takes.","facts":"Fact sheet (practice model)","pv":"Your front page","models":"One way it can be done: three model responses","modelsNote":"Three different approaches. All three pass the checklist; your teacher reads for fairness and style."},"rubric":[["Level","Knowledge: news conventions (lead, attribution)","Thinking: fairness and selection","Communication: clarity and style","Application: editor’s note (naming bias)"],["1","Few present","One-sided","Unclear","Missing"],["2","Some present","Some balance","Somewhat clear","Names a bias vaguely"],["3","Clear and correct","Balanced, with justified selection","Clear and concise","Explains a choice"],["4","Polished and economical","Balanced, nuanced and anticipates misreadings","Vivid, precise and fair in tone","Insightful reflection on framing"]],"models":[{"title":"Model 1: Hard news, inverted pyramid","head":"School board votes 8–3 to start high school at 9:15","text":"The Port Calder District School Board voted 8–3 on Tuesday to move the high-school start time from 8:30 to 9:15 beginning in September. The change will require four additional bus routes at a cost of $310 000 a year, according to transportation manager Erin Walsh. In a board survey of 1 240 students, 71% supported a later start. “Our students told us they’re exhausted. We listened,” said board chair Dr. Ama Mensah. A separate survey found 46% of parents worried about conflicts with jobs and sports. “Practices will now end after dark in November,” said parent Dana Ferreira. Coach Luis Baptiste said schools could lose gym time shared with community groups. The board said it will publish a revised athletics schedule before the change takes effect.","note":"I used the neutral verb “votes” in the headline, not “caves” or “slams”, so the word choice doesn’t tilt readers before they reach a fact. I put the vote, the new time and the date first, because every reader needs them, and the cost next. I paired the 71% student figure with the 46% parent figure to avoid selection bias: reporting only one survey would have made the decision look either obvious or reckless."},{"title":"Model 2: Human angle, still balanced","head":"Later bell coming for Port Calder high schools in September","text":"In a dark bedroom, a high-school student’s alarm rings at 7 a.m. On Tuesday, the Port Calder District School Board voted 8–3 to let it ring later: the high-school start time moves from 8:30 to 9:15 in September. The decision follows a board survey of 1 240 students, in which 71% favoured a later start. “Our students told us they’re exhausted. We listened,” said board chair Dr. Ama Mensah. Not every family agrees. A separate survey found 46% of parents worried about conflicts with after-school jobs and sports. “Practices will now end after dark in November,” said parent Dana Ferreira. Coach Luis Baptiste added, “We’ll lose gym time we share with the community.” The change has a cost as well. Transportation manager Erin Walsh said, “The new bell times require four additional bus routes,” which will cost $310 000 a year. For students, the difference is 45 minutes of sleep or study. For families and coaches, it means new schedules to work out before the first bell rings.","note":"I opened on a student’s alarm to give readers a person to picture, but I avoided loaded language: the board “voted”, parents “worried”, and nobody “slammed” anything. I left out the student trustee’s “zombies” quotation. It is vivid, but it mocks tired students and could tilt the tone toward the later start, so the board chair speaks for that side instead. I gave each side a quotation and paired the student survey with the parent survey."},{"title":"Model 3: Data-led","head":"Students and parents split on 9:15 start for Port Calder high schools","text":"Surveys found 71% of 1 240 students favoured a later start and 46% of parents worried about jobs and sports. On Tuesday, the Port Calder District School Board voted 8–3 for a 9:15 high-school start in September, replacing the current 8:30 bell. “Our students told us they’re exhausted. We listened,” said board chair Dr. Ama Mensah. Parent Dana Ferreira saw a different problem: “Practices will now end after dark in November.” Coach Luis Baptiste said community groups could lose shared gym time. The plan also has a price. Transportation manager Erin Walsh said, “The new bell times require four additional bus routes,” at a cost of $310 000 a year. The board has not yet said how the routes will be funded.","note":"I led with the two survey numbers because the tension between them is the story. I was careful with the statistics: the 71% comes from 1 240 students and the 46% from a separate parent survey that asked a different question, so I reported them side by side instead of setting one against the other as if they measured the same thing. I quoted one supporter and one opponent and gave the cost, so readers see both the reasons and the price."}]},"cards":[["Bias","From French \u003cem>biais\u003c/em>, “slant”: a tilt in how a story is built. Like a lawn bowl, every story rolls on one; know which way it bends."],["Word-choice bias (loaded language)","Charged words that carry attitude: “rams through” vs “approves”."],["Bias by omission","Leaving out facts that would change a reader’s view."],["Placement bias","Choosing a story’s page or position to raise or lower its importance."],["Source imbalance","Quoting mostly one side."],["Misleading statistics","Comparing totals over different periods or bases; always ask “per what?”"],["Lateral reading","Leaving a site to see what other sources say about it."],["SIFT","Stop · Investigate the source · Find better coverage · Trace to the original context."],["Misinformation vs disinformation","False and shared in good faith, vs false and meant to deceive."],["Satire and sponsored content","Satire is false on purpose and meant to be recognized; sponsored content is paid persuasion styled as news."],["False balance","Giving a claim the evidence doesn’t support equal weight with well-supported evidence."],["Swift on falsehood","“Falsehood flies, and the Truth comes limping after it.” So check before you share."]]}};</script>
