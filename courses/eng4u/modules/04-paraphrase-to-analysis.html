.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}

ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}

.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}

pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}

.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

.hd-btns{gap:6px}

*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}

@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--an-sound:#A84C05;--an-image:#0E7C7B;--an-figure:#7A3DB8;--an-syntax:#2343C4;--an-diction:#6B5A1E;--an-theme:#B0286F;
--an-sound-soft:rgba(168,76,5,.13);--an-image-soft:rgba(14,124,123,.13);--an-figure-soft:rgba(122,61,184,.12);--an-syntax-soft:rgba(35,67,196,.11);
--an-diction-soft:rgba(107,90,30,.14);--an-theme-soft:rgba(176,40,111,.11);
--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}
:root[data-theme="dark"]{--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
.an-sound{--an-c:var(--an-sound);--an-c-soft:var(--an-sound-soft)}.an-image{--an-c:var(--an-image);--an-c-soft:var(--an-image-soft)}
.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}
.an-tag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);font-style:normal;letter-spacing:.01em;color:var(--an-c,var(--ink-2));background:var(--sheet);
border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}
.an-chip{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--an-c,var(--rule));background:var(--sheet);color:var(--ink);border-radius:999px;
padding:.25em .8em;font-size:.92rem;min-height:34px}
.an-chip[aria-pressed="true"]{background:var(--an-c-soft);font-weight:700}
.an-chip[aria-pressed="true"]::after{content:"on";font-size:.72rem;font-weight:700;color:var(--an-c)}
.an-dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--an-c,var(--ink-2));flex:0 0 auto}
.an-note{border-left:4px solid var(--an-c,var(--rule));background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;margin:0 0 6px;font-size:.92rem;max-width:none}
.eng-margin{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.eng-margin > *{min-width:0}
@media (max-width:820px){ .eng-margin{grid-template-columns:minmax(0,1fr)} }
@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}
ol.eng-poem li{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline}
ol.eng-poem li.eng-gap{height:.6em}
.eng-ln{font:400 .75rem var(--font-ui);color:var(--ink-2);text-align:right;padding-right:.9em;user-select:none}
.eng-prose p{font:400 1.08rem/1.65 var(--font-math);max-width:70ch}
.eng-prose .eng-ln{display:inline-block;min-width:3.2em;padding-right:.6em;text-align:left}
.eng-cite{font-size:.85rem;color:var(--ink-2);margin:4px 0 0}
.eng-toks{display:grid;gap:6px}
.eng-tl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.eng-tok{border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:.08em .28em;min-height:34px;min-width:24px;
font:400 1.22rem/1.3 var(--font-math)}
.eng-tok:not(:disabled):hover{border-color:var(--rule)}
.eng-tok.an{background:var(--an-c-soft)}
.eng-tok[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.eng-tok.eng-br{font:700 .9rem var(--font-ui);color:var(--ink-2);border:1.5px dashed var(--rule)}
.eng-tok.speaking,.eng-w.speaking{outline:2px solid var(--ink);outline-offset:1px;border-radius:4px}
.eng-w{transition:opacity .25s,color .25s}
.sc-syl{position:relative;display:inline-block;padding-top:.7em}
.sc-syl::before{position:absolute;left:0;right:0;top:0;text-align:center;font:700 .85em/1 var(--font-ui)}
.sc-stress{color:var(--sc-stress);font-weight:600}.sc-stress::before{content:"´"}
.sc-slack{color:var(--sc-slack)}.sc-slack::before{content:"˘"}
/* ENG4U 04 From Paraphrase to Analysis. Colour tokens only. Rung colours follow the paragraph roles (course plan §5):
   paraphrase ink, observation teal (evidence), interpretation blue (claim), analysis violet; "so what" magenta; response brown. */
:root{--oz-sand:#EFE4C6;--oz-grain:rgba(140,110,50,.18);
  --rg-para:var(--pp-link);--rg-obs:var(--pp-evidence);--rg-int:var(--pp-claim);--rg-ana:var(--pp-analysis);--rg-sw:var(--an-theme);--rg-resp:var(--an-diction);
  --vo-i:var(--an-syntax);--vo-trav:var(--an-sound);--vo-insc:var(--an-theme)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--oz-sand:var(--sheet);--oz-grain:rgba(216,208,143,.10)} }
:root[data-theme="dark"]{--oz-sand:var(--sheet);--oz-grain:rgba(216,208,143,.10)}
.rg-para{--rc:var(--rg-para)}.rg-obs{--rc:var(--rg-obs)}.rg-int{--rc:var(--rg-int)}.rg-ana{--rc:var(--rg-ana)}.rg-sw{--rc:var(--rg-sw)}.rg-resp{--rc:var(--rg-resp)}

/* radio group (copied from ENG4U 02) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
.lr-sel{border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:.25em .4em;min-height:34px}

/* ---------- hero ---------- */
.lh-wrap{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:10px;align-items:stretch}
.lh-sand{position:relative;background-color:var(--oz-sand);background-image:radial-gradient(var(--oz-grain) 1px,transparent 1.3px);background-size:7px 7px;
  border:1.5px solid var(--rule);border-radius:10px;padding:16px 12px 10px;margin:0 6px;transition:margin .9s ease,padding .9s ease}
.lh-sand.wide{margin:0 -4px;padding-left:20px;padding-right:20px}
.lh-line{font:400 clamp(1.05rem,1.55vw,1.28rem)/1.5 var(--font-math);margin:0 0 4px;max-width:none;display:grid;grid-template-columns:1.8em minmax(0,1fr);align-items:baseline}
.lh-n{font:400 .72rem var(--font-ui);color:var(--ink-2)}
.lh-w{transition:opacity .35s}
.lh-w.lh-dim{opacity:.22}
.lh-al{font-weight:400;border-radius:3px;transition:background .5s,box-shadow .5s}
.lh-g.on .lh-al{background:var(--an-sound-soft);box-shadow:inset 0 -2.5px 0 var(--an-sound);font-weight:700}
.lh-stop{display:inline-block;transition:transform .4s,color .4s}
.lh-stop.on{color:var(--an-theme);transform:scale(1.9);font-weight:700}
.lh-cite{font-size:.8rem;color:var(--ink-2);margin:8px 0 0;text-align:right;max-width:none}
.lh-altag{opacity:0;transition:opacity .6s}.lh-altag.on{opacity:1}
.lh-lad{list-style:none;margin:0;padding:8px 10px;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:8px;min-width:0;
  border-left:5px solid var(--ink-2);border-right:5px solid var(--ink-2);border-radius:3px}
.lh-r{display:flex;align-items:center;gap:5px;font-size:.74rem;line-height:1.2;color:var(--ink-2);background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:4px 6px;
  opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s,background .5s,border-color .5s}
.lh-r.up{opacity:1;transform:none}
.lh-r.lit{background:var(--hi-soft);border-color:var(--ink);color:var(--ink);font-weight:700}
.lh-rn{font:700 .7rem var(--font-ui);border:1.5px solid currentColor;border-radius:50%;width:1.6em;height:1.6em;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.lh-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

/* ---------- Explore: ladder of reading ---------- */
.lr-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;margin:0 0 6px}
.lr-top .rg-wrap{margin:0}
.lr-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lr-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px 26px;align-items:start}
.lr-text{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px 10px;background:var(--sheet);min-width:0}
.lr-text > summary{font:400 1.15rem var(--font-math);cursor:pointer;min-height:30px;padding:2px 0}

.lr-l{display:grid;grid-template-columns:22px 2em minmax(0,1fr);align-items:baseline;border-radius:4px;transition:background .4s,transform .6s,margin .6s,box-shadow .4s}
.lr-l .eng-ln{font:400 .72rem var(--font-ui);color:var(--ink-2);text-align:right;padding-right:.7em}
.lr-bands{display:flex;gap:2px;align-self:stretch;padding:1px 0}

.lr-poem.vo-1 .vb-i.on,.lr-poem.vo-2 .vb-trav.on,.lr-poem.vo-3 .vb-insc.on{opacity:1}
.lr-poem.vo-1 .lr-l.vo-i{background:var(--an-syntax-soft)}
.lr-poem.vo-2 .lr-l.vo-trav{background:var(--an-sound-soft)}
.lr-poem.vo-3 .lr-l.vo-insc{background:var(--an-theme-soft)}

.lr-poem.vo-1 .vt-i,.lr-poem.vo-2 .vt-trav,.lr-poem.vo-3 .vt-insc{display:inline-block}
.vt-i{--an-c:var(--vo-i)}.vt-trav{--an-c:var(--vo-trav)}.vt-insc{--an-c:var(--vo-insc)}
.lr-legend{display:grid;gap:3px;margin:8px 0 2px;font-size:.8rem}
.lr-lg{display:flex;align-items:center;gap:6px}.lr-lg .vb{height:14px;opacity:1}
.lr-l.hl{box-shadow:inset 3px 0 0 var(--ink);background:var(--hi-soft)}
.lr-poem.vo-on .lr-l.hl{box-shadow:inset 0 0 0 2px var(--ink)}
.lr-l.p1-apart{margin-top:14px}
.lr-l.p1-join{box-shadow:inset 0 0 0 2px var(--an-theme)}
.lr-l.p1-join[data-l="11"]{transform:translateY(3px)}.lr-l.p1-join[data-l="12"]{transform:translateY(-3px)}
.lr-despair{border-radius:3px;transition:color .6s,background .6s}
.dsp-proud .lr-despair{color:var(--an-sound);font-weight:700;background:var(--an-sound-soft)}
.dsp-hollow .lr-despair{color:var(--ink-2);background:transparent;outline:1.5px dashed var(--ink-2);outline-offset:1px}
.dsp-proud .lr-despair::after,.dsp-hollow .lr-despair::after{font:700 .62rem var(--font-ui);margin-left:4px;vertical-align:.3em;border:1.5px solid currentColor;border-radius:999px;padding:0 .4em}
.dsp-proud .lr-despair::after{content:"proud"}.dsp-hollow .lr-despair::after{content:"hollow"}
.lr-poem .eng-w.speaking{outline:2px solid var(--ink);outline-offset:1px;border-radius:3px}
.lr-work{min-width:0}
.lr-ladder{display:grid;gap:8px;border-left:6px solid var(--ink-2);border-right:6px solid var(--ink-2);border-radius:4px;padding:8px}
.lr-rung{border:2px solid var(--rc);border-radius:8px;background:var(--sheet);padding:6px 8px;display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr);gap:6px 10px;align-items:start}
.lr-rung.lit{background:color-mix(in srgb, var(--rc) 9%, var(--sheet))}
.lr-rb{border:1.5px dashed var(--rc);background:var(--sheet);color:var(--ink);border-radius:6px;padding:4px 8px;text-align:left;min-height:40px;display:flex;flex-direction:column;justify-content:center}
.lr-rb[aria-pressed="true"]{border-style:solid;background:var(--hi-soft)}
.lr-rl{font-weight:700;color:var(--rc)}
.lr-rb small{font-size:.74rem;color:var(--ink-2)}
.lr-in{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px}
.lr-trayw{margin-top:10px}
.lr-trayw .lr-rung{border-style:dashed}
.lr-card,.lr-cs,.lr-opt{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:6px 10px;text-align:left;font:400 .98rem/1.4 var(--font-math);min-height:36px;max-width:100%}
.lr-card.on,.lr-cs[aria-pressed="true"],.lr-opt.on{border-color:var(--hi);background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi)}
.lr-cards{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.lr-ch{margin:14px 0 6px;font-size:.98rem}
.lr-msg{margin:6px 0 0}
.lr-armed{color:var(--ink)}
.lr-cs.demo{border-color:var(--rc)}
.lr-oid{font:700 .74rem var(--font-ui);color:var(--ink-2);border:1.5px solid var(--rule);border-radius:4px;padding:0 .35em;margin-right:4px}
.lr-choices [role="radiogroup"]{display:grid;gap:8px}
.lr-opt{display:flex;gap:6px;align-items:baseline;width:100%}
.lr-focus{margin:14px 0 0;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.lr-fl{font-size:.82rem;font-weight:700;color:var(--ink-2);margin:0 0 4px}
.lr-fs{font:400 1.05rem/1.5 var(--font-math);margin:0 0 6px;max-width:none}
.lr-sw{border-color:var(--rg-sw)}
.lr-readbox{margin-top:12px}
.lr-rh{margin:0 0 6px}
.lr-aha{margin:16px 0 0;padding:10px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px;max-width:none}
.lr-lnav{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 10px}
.lr-lsel{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:6px}
.lr-ol{display:block;font:700 .78rem var(--font-ui);color:var(--ink-2);margin:0 0 2px}
.lr-orig{font:400 1.25rem/1.5 var(--font-math);margin:0 0 10px;padding:8px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);max-width:none}
.lr-para{font:400 1.12rem/1.6 var(--font-math);margin:0 0 10px;padding:8px 12px;border:2px solid var(--rg-para);border-radius:8px;max-width:none}
.lr-sv{border-radius:4px;padding:0 .15em;border-bottom:2.5px solid var(--ink)}
.lr-sv.orig{border:1.5px dashed var(--ink-2);color:var(--ink-2)}
.lr-sv.f-loses{border-bottom-style:dotted}
.lr-sv.f-adds{border-bottom-style:double;border-bottom-width:4px}
.lr-sv.flash{animation:lr-flash 1.2s ease 2}
@keyframes lr-flash{0%,100%{background:transparent}50%{background:var(--hi-soft)}}
.lr-slots{display:grid;gap:8px;margin:0 0 10px}
.lr-slot{display:grid;gap:4px}
.lr-sl{font-size:.88rem;font-weight:700}
.lr-fid{padding:8px 12px;border-radius:8px;background:var(--paper);margin:0 0 8px}
.lr-ftag{display:inline-block;font:700 .82rem var(--font-ui);border:1.5px solid var(--ink);border-radius:999px;padding:0 .6em;margin-right:4px}
.lr-ftag.f-loses{border-style:dotted}.lr-ftag.f-adds{border-style:double;border-width:3px}
.lr-ffb{font-size:.9rem}
.lr-wp{margin:8px 0 0;padding-left:1.8em;font:400 1rem/1.55 var(--font-math)}
.lr-bt{min-height:96px;font:400 1.05rem/1.55 var(--font-math)}
.lr-qp{margin:0 0 10px}
.lr-qp .eng-toks{padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);margin-top:6px}
.lr-qp .eng-tok{font-size:1rem;min-height:30px}
.lr-qsel{margin:6px 0;max-width:none}
.lr-meter{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 0}
.lr-ml{font-weight:700;font-size:.88rem}
.lr-mr{list-style:none;display:flex;gap:4px;margin:0;padding:0}
.lr-mr li{font-size:.74rem;padding:2px 6px;border:1.5px solid var(--rc);border-radius:4px;color:var(--ink-2);background:var(--sheet)}
.lr-mr li.on{background:var(--rc);color:var(--sheet);font-weight:700}
.lr-mv{font-size:.9rem;font-weight:700}
.lr-tests{margin:4px 0 8px}
.lr-ex{font:400 1rem/1.55 var(--font-math);margin:8px 0 0;max-width:none}
.lr-mark,.up-z mark{background:transparent;color:inherit;border-bottom:2.5px solid var(--rg-sw);border-radius:0;padding:0}

/* ---------- Part 3: upgrade the sentence ---------- */
.up-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;margin:0 0 10px}
.up-top .rg-wrap{margin:0}
.up-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.up-weak{font:400 1.1rem/1.5 var(--font-math);margin:0 0 12px;max-width:none}
.up-wl{display:block;font:700 .78rem var(--font-ui);color:var(--ink-2)}
.up-weak .tag{font-family:var(--font-ui);white-space:normal;display:inline-block}
.up-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.up-tool{border-left:4px solid var(--rc,var(--rule));padding:2px 0 2px 10px;min-width:0}
.up-t-d{--rc:var(--rg-int)}.up-t-h{--rc:var(--rg-ana)}.up-t-w{--rc:var(--rg-sw)}
.up-tl{display:block;font-weight:700;font-size:.9rem;margin:0 0 6px}
.up-dw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.up-dw input{width:100%;accent-color:var(--rg-int)}
.up-dv{font:400 .98rem/1.45 var(--font-math);margin:6px 0 0;max-width:none}
.up-vt{display:inline-block;font:700 .72rem var(--font-ui);border:1.5px dashed var(--ink-2);color:var(--ink-2);border-radius:999px;padding:0 .5em;margin-right:4px}
.up-vt.on{border-style:solid;border-color:var(--rg-int);color:var(--rg-int)}
.up-tool .chips{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.up-chip{text-align:left;font:400 .95rem/1.35 var(--font-math);border-radius:8px}
.up-sent{font:400 1.2rem/1.6 var(--font-math);margin:14px 0 8px;padding:10px 12px;border:2px solid var(--rg-ana);border-radius:8px;background:var(--paper);max-width:none}
.up-sl{display:block;font:700 .78rem var(--font-ui);color:var(--ink-2)}
.up-p{border-bottom:2.5px solid var(--rc);padding-bottom:1px}
.up-pd{--rc:var(--rg-int)}.up-ph{--rc:var(--rg-ana)}.up-pw{--rc:var(--rg-sw)}
.up-meter{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 8px}
.up-ml{font-weight:700;font-size:.88rem}
.up-mr{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.up-mr li{font-size:.76rem;padding:2px 7px;border:1.5px solid var(--rule);border-radius:4px;color:var(--ink-2);background:var(--sheet)}
.up-mr li.on{border-color:var(--rg-ana);background:var(--an-figure-soft);color:var(--ink);font-weight:700}
.up-mr li:last-child.on{background:var(--rg-ana);color:var(--sheet)}
.up-mt{margin:0;font-size:.86rem;max-width:none}
.up-zoom{margin-top:12px}
.up-z{font:400 1.02rem/1.5 var(--font-math);margin:6px 0 0;max-width:none}
.up-zl{display:inline-block;font:400 .72rem var(--font-ui);color:var(--ink-2);min-width:4em}
.steal-line{font:400 1.4rem/1.35 var(--font-math);margin:0 0 2px}

/* ---------- Practice ---------- */
.rs-pass,.un-pass{margin:0 0 8px}
.un-q .qn,.un-s .qn{display:none}
.art-samples{margin:0 0 14px}
.art-samples .an-note{margin:8px 0 0}
.wst-line{font:400 1.15rem/1.4 var(--font-math)}

/* ---------- task ---------- */
.ct-pw{margin:8px 0 10px}
.ct-pw .eng-passage{margin:0 0 6px}
.ct-integ{margin:0 0 12px}
.ct-integ .eng-toks{padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);margin-top:6px}
.ct-integ .eng-tok{font-size:1rem;min-height:30px}
.ct-cite{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:6px 0;font-size:.9rem}
.ct-cite label{display:flex;align-items:center;gap:4px}
.pb-chk input{width:18px;height:18px}
.pb-slot{border-left:4px solid var(--rc,var(--rule));padding:4px 0 4px 10px;margin:0 0 10px}
.pb-slot label{display:block;font-weight:700;font-size:.92rem;margin-bottom:4px}
.pb-slot textarea{min-height:60px;font:400 1.02rem/1.5 var(--font-math)}
.pb-tag,.ct-ptag{display:inline-block;font:700 .7rem/1.4 var(--font-ui);color:var(--rc);border:1.5px solid var(--rc);border-radius:999px;padding:0 .5em;margin-right:4px;background:var(--sheet);vertical-align:.1em}
.pb-pv{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet)}
.pb-pv p{font:400 1.02rem/1.75 var(--font-math);margin:0;max-width:none}
.ct-p{border-bottom:2.5px solid var(--rc);padding-bottom:1px}
.ct-model{margin-top:10px}
.ct-mp{font:400 1.02rem/1.55 var(--font-math);margin:8px 0 0;max-width:none}
#ct-models .fb{margin-top:16px}
@media (min-width:821px){ #task-pv{position:sticky;top:calc(var(--mv-top,0px) + 150px);align-self:start;max-height:calc(100vh - var(--mv-top,0px) - 170px);overflow:auto} }

@media (max-width:820px){
  .lr-body{grid-template-columns:minmax(0,1fr)}
  .up-tools{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .rg-lab{min-width:0}
  .lh-wrap{grid-template-columns:minmax(0,1fr)}
  .lh-lad{max-width:none;flex-direction:column-reverse}
  .lh-sand{padding:12px 12px 8px}
  .lh-sand.wide{padding-left:18px;padding-right:18px}
  .lr-rung{grid-template-columns:minmax(0,1fr)}
  .lr-ladder{padding:6px;border-width:4px}
  .lr-in:empty{display:none}
}
@media (prefers-reduced-motion:reduce){
  .lh-sand,.lh-w,.lh-r,.lh-stop,.lh-al,.lr-l,.vb,.lr-despair,.lh-altag{transition:none}
  .lr-l.p1-join[data-l="11"],.lr-l.p1-join[data-l="12"]{transform:none}
  .lr-sv.flash{animation:none;background:var(--hi-soft)}
}

<script>window.MV_PAYLOAD={"meta":{"id":"04-paraphrase-to-analysis","nn":"04","slug":"paraphrase-to-analysis","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 1","groupName":"The Reader's and Writer's Craft","trivium":"Logic","size":"M","storageKey":"eng4u-04-paraphrase-to-analysis-v1","progressKey":"eng4u-progress-v1:04-paraphrase-to-analysis","toolkit":"1.0.6"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"697b6ae2","content":{"id":"04-paraphrase-to-analysis","kind":"topic","title":"From paraphrase to analysis","topic":"From Paraphrase to Analysis","readyTopic":"the ladder of reading","hero":{"headline":"Every observation owes the reader a “so what”.","text":"Anyone can say what a poem is \u003cem>about\u003c/em>. The craft is saying how it works and why it matters. In this module you’ll climb a \u003cstrong>ladder of reading\u003c/strong>: from \u003cstrong>paraphrase\u003c/strong> to \u003cstrong>observation\u003c/strong> to \u003cstrong>interpretation\u003c/strong> to \u003cstrong>analysis\u003c/strong>. You’ll learn to ask the question that turns notes into insight: \u003cem>So what?\u003c/em>","fig":{"html":"\u003cdiv class=\"lh\" id=\"hero-lh\" role=\"group\" aria-label=\"The last three lines of Ozymandias on a field of sand, beside a four-rung ladder of reading\">\u003c/div>","caption":""},"lines":[12,13,14],"lastLine":"The lone and level sands stretch far away.","stop":"Nothing beside remains","glow":[{"w":"boundless","c":"b"},{"w":"bare","c":"b"},{"w":"lone","c":"l"},{"w":"level","c":"l"}],"rungs":["What it says","What I notice","What it suggests","How and why it matters"],"cite":"(Shelley, lines 12–14)"},"goals":["I can paraphrase a passage accurately in plain modern words, keeping who is speaking.","I can make specific observations about language and structure, using short quotations.","I can interpret what an observation suggests, staying within the evidence.","I can write analysis that explains how a craft choice creates meaning and why it matters (“so what?”).","I can integrate and cite short quotations correctly (MLA 9).","I can tell paraphrase, observation, interpretation, analysis and personal response apart, in my writing and in others’."],"start":{"poem":{"title":"Ozymandias","lines":["I met a traveller from an antique land,","Who said—“Two vast and trunkless legs of stone","Stand in the desert. . . . Near them, on the sand,","Half sunk a shattered visage lies, whose frown,","And wrinkled lip, and sneer of cold command,","Tell that its sculptor well those passions read","Which yet survive, stamped on these lifeless things,","The hand that mocked them, and the heart that fed;","And on the pedestal, these words appear:","My name is Ozymandias, King of Kings;","Look on my Works, ye Mighty, and despair!","Nothing beside remains. Round the decay","Of that colossal Wreck, boundless and bare","The lone and level sands stretch far away.”"],"cite":"Percy Bysshe Shelley, “Ozymandias” (1818), in the standard modern text (spelling and punctuation modernized, as in most anthologies). Public domain. Cite by line: (Shelley, lines 13–14)."},"blocks":[{"title":"Word story: \u003cem>analysis\u003c/em>","html":"\u003cp>\u003cstrong>\u003cem>Analysis\u003c/em>\u003c/strong> comes from Greek \u003cem>analusis\u003c/em>, “a loosening, an untying” (\u003cem>ana-\u003c/em>, “up, back”, and \u003cem>lyein\u003c/em>, “to loosen”). To analyse is to untie a knot carefully enough to see how it was tied.\u003c/p>\u003cp>\u003cstrong>\u003cem>Paraphrase\u003c/em>\u003c/strong> comes from Greek \u003cem>para\u003c/em>, “beside”, and \u003cem>phrazein\u003c/em>, “to tell”: it tells the text again, beside the original.\u003c/p>\u003cp class=\"wst-line\">Paraphrase walks beside the text; analysis unties it.\u003c/p>\u003cp class=\"tiny muted\">Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Paraphrase","goal":1,"prompt":"Which is the most accurate paraphrase of “I met a traveller from an antique land, / Who said…”?","options":[{"t":"“I met an old traveller who collects antiques.”","why":"\u003cem>Antique land\u003c/em> means an ancient country, not antiques.","_n":"08d1","_k":"961f95be"},{"t":"“Ozymandias told me…”","why":"The king doesn’t speak to the “I” directly; the traveller reports his words.","_n":"18c1","_k":"7efdaf84"},{"t":"“I met someone who had come from an ancient country, and he told me…”","why":"\u003cem>Antique\u003c/em> here means ancient, and the traveller is the one about to speak.","_n":"28b1","_k":"ebce47b5"},{"t":"“I travelled to an ancient land myself.”","why":"The speaker \u003cem>met\u003c/em> a traveller; the speaker didn’t travel.","_n":"38a1","_k":"31fc0234"}],"hints":["Who travelled, and who is speaking?","\u003cem>Antique\u003c/em> can mean ancient.","Someone from an ancient country told me…"]},{"id":"w2","skill":"Paraphrase","goal":1,"prompt":"Paraphrase “Half sunk a shattered visage lies.”","options":[{"t":"“The king lies dead in the sand.”","why":"It’s the statue’s face, not the king’s body.","_n":"4891","_k":"47ed49f3"},{"t":"“Half the statue’s face is missing.”","why":"\u003cem>Half sunk\u003c/em> means half buried, not half missing.","_n":"5881","_k":"3951606b"},{"t":"“A sad face is sinking.”","why":"\u003cem>Shattered\u003c/em> means broken, not sad.","_n":"6871","_k":"e3ded8cf"},{"t":"“A broken stone face lies half buried.”","why":"\u003cem>Visage\u003c/em> means face; \u003cem>sunk\u003c/em> means partly buried in the sand.","_n":"7861","_k":"e7fdbec4"}],"hints":["What does \u003cem>visage\u003c/em> mean?","Face. And \u003cem>half sunk\u003c/em>?","A broken stone face lies half buried."]},{"id":"w3","skill":"Inference","goal":3,"prompt":"A character slams a door, then quietly opens it again and sets a cup of tea outside. What can you infer?","options":[{"t":"Nothing; inferences are guesses.","why":"Inferences are reasoned conclusions from evidence.","_n":"8851","_k":"91817ad3"},{"t":"She’s thirsty.","why":"She leaves the tea for someone else.","_n":"9c19","_k":"177f9fa7"},{"t":"She hates the person outside.","why":"The tea suggests care; \u003cem>hate\u003c/em> ignores half the evidence.","_n":"ac29","_k":"4dce62dc"},{"t":"She was angry, but she still cares about the person outside.","why":"Both actions count: the slam and the tea.","_n":"bbf9","_k":"43f0de53"}],"hints":["What do both actions tell you?","Anger, and…","…care: she’s angry but still cares."]},{"id":"w4","skill":"Inference","goal":3,"prompt":"In “Ozymandias”, the sculptor “well those passions read” on the king’s face. What does this suggest about the sculptor?","options":[{"t":"The sculptor couldn’t read.","why":"\u003cem>Read\u003c/em> here means interpret a face.","_n":"cc09","_k":"424570c8"},{"t":"The sculptor was the traveller.","why":"They’re different people; the traveller only describes the statue.","_n":"dc59","_k":"964a5aca"},{"t":"The sculptor understood the king’s cruelty and recorded it accurately.","why":"\u003cem>Read … well\u003c/em> means understood clearly.","_n":"ec69","_k":"22ae6e4f"},{"t":"The sculptor admired the king.","why":"Carving a “sneer of cold command” isn’t admiring.","_n":"fc39","_k":"9bfc5f2a"}],"hints":["What can it mean to \u003cem>read\u003c/em> a face?","To understand it.","The sculptor understood the king’s passions."]},{"id":"w5","skill":"Devices and their effects","goal":4,"prompt":"“The lone and level sands stretch far away.” What is the most likely effect of the repeated \u003cem>l\u003c/em> sounds?","options":[{"t":"They slow and smooth the line, so the emptiness feels long and endless.","why":"Liquid \u003cem>l\u003c/em> sounds stretch the line out, like the sands.","_n":"gc49","_k":"e204bc03"},{"t":"They show the poem is a sonnet.","why":"Sound devices don’t decide the form.","_n":"hb99","_k":"e389ce61"},{"t":"They make the line sound harsh and violent.","why":"\u003cem>L\u003c/em> is a soft, flowing consonant.","_n":"iba9","_k":"d7e302f8"},{"t":"They have no effect; alliteration is decoration.","why":"Sound shapes how a line feels.","_n":"jbb8","_k":"9f26b8f7"}],"hints":["Read it aloud slowly.","Are \u003cem>l\u003c/em> sounds hard or soft?","Soft and long, like the sands."]},{"id":"w6","skill":"Quoting poetry","goal":5,"prompt":"Which correctly cites lines 13–14 of “Ozymandias” in MLA style after a quotation?","options":[{"t":"(Shelley, lines 13–14)","why":"Author, then “lines” and the numbers.","_n":"kba8","_k":"ab56a4a6"},{"t":"(Shelley 13–14)","why":"Without “lines”, the numbers read as page numbers on first use.","_n":"lb98","_k":"a1b19bba"},{"t":"(lines 13 and 14, Shelley)","why":"Author first, then a range with an en dash.","_n":"mb88","_k":"97673576"},{"t":"(Ozymandias, p. 14)","why":"Poems are cited by line, not page.","_n":"nb78","_k":"6fad05b6"}],"hints":["Poems use line numbers.","Author first.","(Shelley, lines 13–14)."]}],"refreshers":{"Paraphrase":"Say it in plain modern words, line by line. Keep who is speaking. Don’t add meanings that aren’t there.","Inference":"Combine clues the text gives you into a conclusion it doesn’t state, and be ready to point to the clues.","Devices and their effects":"Name the device, then say what it does: slows, binds, contrasts, echoes, makes you hear or see.","Quoting poetry":"In running text: “boundless and bare / The lone and level sands” (Shelley, lines 13–14)."}}},"explore":{"heading":"Ladder of reading","intro":"Every sentence about a text sits on a rung. Sort sentences onto the ladder, then climb: start with what the poem says and finish with how and why it matters.","rungs":[{"id":"para","label":"Paraphrase","q":"What it says"},{"id":"obs","label":"Observation","q":"What I notice"},{"id":"int","label":"Interpretation","q":"What it suggests"},{"id":"ana","label":"Analysis","q":"How and why it matters"}],"tray":{"id":"resp","label":"Personal response","q":"Valued, but kept off the ladder"},"voices":[{"id":"i","label":"the “I”","lines":[1,1],"note":"line 1"},{"id":"trav","label":"the traveller","lines":[2,14],"note":"lines 2–14, inside quotation marks"},{"id":"insc","label":"the inscription","lines":[10,11],"note":"lines 10–11, inside the traveller’s report"}],"cards":[{"id":"c1","t":"A traveller tells the speaker about a broken statue of a king in the desert.","_a":"FElWEFdD"},{"id":"c2","t":"The inscription commands the “Mighty” to “despair”, but the next sentence is “Nothing beside remains.”","_a":"FFZVERQ=","craft":"placement (pointed to, not yet named)"},{"id":"c3","t":"The poem suggests that even the greatest rulers are forgotten.","_a":"FFBZFhQ=","meaning":"Even the greatest rulers are forgotten"},{"id":"c4","t":"By placing the king’s boast directly before “Nothing beside remains,” Shelley turns “despair” against its speaker, so the inscription now warns the powerful instead of threatening them.","_a":"FFhZAxQ=","craft":"Irony; juxtaposition (placement)","meaning":"Power is temporary; the boast becomes a warning","sw":"so the inscription now warns the powerful instead of threatening them"},{"id":"c5","t":"Lines 13–14 repeat \u003cem>b\u003c/em> and \u003cem>l\u003c/em> sounds: “boundless and bare / The lone and level sands.”","_a":"FFZVERQ=","craft":"sound repetition (described, not yet named)"},{"id":"c6","t":"The sculptor’s skill outlives the king’s power.","_a":"FFBZFhQ=","meaning":"Art outlasts power"},{"id":"c7","t":"Shelley nests the king’s words inside a traveller’s report inside the speaker’s memory, which distances the reader from Ozymandias and shrinks his voice to a rumour.","_a":"FFhZAxQ=","craft":"frame (nested voices)","meaning":"The tyrant survives only as a rumour","sw":"which distances the reader from Ozymandias and shrinks his voice to a rumour"},{"id":"c8","t":"I think the ending is creepy.","_a":"FEtSEUZD"}],"tc1":{"paraOnAna":"It retells the situation; it doesn’t explain how anything works.","respOnInt":"That’s your response. An interpretation says what the \u003cem>text\u003c/em> suggests.","obsOnInt":"It points to the words but doesn’t yet say what they suggest.","general":"Ask of each card: does it retell, point, suggest, or explain how \u003cem>and\u003c/em> why?"},"nudge":{"para":"This retells \u003cem>what\u003c/em> happens. Analysis explains \u003cem>how\u003c/em> the words make it mean something, and \u003cem>why\u003c/em> that matters.","obs":"Good catch, now finish the thought: what do the words \u003cem>do\u003c/em> to the line’s meaning?","int":"That says what it suggests. Now explain how the words create that meaning, and why it matters.","resp":"Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","line":"A paraphrase retells; that’s its job. It’s the floor of the ladder. To answer “so what”, climb.","built":"Add the “so what”: which suggests… / so that…"},"climb":{"start":"A traveller describes a broken statue of a king in the desert.","rungs":[{"id":"obs","_a":"FFYFQA==","opts":[{"id":"o1","t":"The statue is very big."},{"id":"o2","t":"The face has a “sneer of cold command,” and the sculptor “well those passions read.”","craft":"diction (“sneer”, “cold”)"},{"id":"o3","t":"The poem is a sonnet.","craft":"form (sonnet)"}],"wrong":{"o3":"True, but which detail matters for meaning?","o1":"That’s a size, not a detail of the language. Which observation points to exact words?"}},{"id":"int","_a":"FFAEQA==","accept":{"i2":"I2 is true but thin; I3 sets up the analysis better."},"opts":[{"id":"i1","t":"Ozymandias was a real pharaoh.","meaning":"none: a historical fact, not a reading of the words"},{"id":"i2","t":"The king was cruel.","meaning":"The king was cruel"},{"id":"i3","t":"The sculptor saw through the king, and his art preserved the king’s cruelty after the king’s power was gone.","meaning":"The sculptor judged the king; art outlived power"}],"wrong":{"i1":"Historical fact, not interpretation of the poem’s words."}},{"id":"ana","_a":"FFgGQA==","opts":[{"id":"a1","t":"By making the sculptor the one who “read” and “mocked” the king’s passions, Shelley reframes the statue as the artist’s judgment rather than the king’s monument, implying that art outlasts power.","craft":"the sculptor’s role (who “read” and “mocked”)","meaning":"Art outlasts power"},{"id":"a2","t":"The poem has many images of stone and sand.","craft":"imagery (named loosely)"},{"id":"a3","t":"Shelley shows that the king was bad.","meaning":"The king was bad"}],"wrong":{"a3":"“Shows” plus a judgment: no craft, no “so what”.","a2":"That points to images, but says nothing about what they mean or why it matters."}}],"general":"Check each rung: an observation that quotes, an interpretation built on the sculptor, and an analysis that names a craft choice and says why it matters."},"lines":[{"n":1,"p":["I met a traveller from",{"o":"an antique land","opts":[{"t":"an ancient country","f":"faithful"},{"t":"a foreign place","f":"loses","fb":"“Foreign” drops how \u003cem>old\u003c/em> the land is."},{"t":"a land full of antiques","f":"adds","fb":"\u003cem>Antique\u003c/em> means ancient here, not antiques."}]},","]},{"n":2,"p":["who told me, “Two",{"o":"vast and trunkless","opts":[{"t":"huge stone legs with no body above them","f":"faithful"},{"t":"large stone legs","f":"loses","fb":"It drops \u003cem>trunkless\u003c/em>: the body is gone."},{"t":"giant legs of a fallen god","f":"adds","fb":"Nothing says he was a god."}]}]},{"n":3,"p":[{"o":"Stand in the desert","opts":[{"t":"are standing in the desert","f":"faithful"},{"t":"are somewhere","f":"loses","fb":"Where? The desert matters to the ending."},{"t":"stand guard over the desert","f":"adds","fb":"“Guard” adds a purpose the line doesn’t give."}]},". Near them, on the sand,"]},{"n":4,"p":["half buried, a",{"o":"shattered","opts":[{"t":"broken","f":"faithful"},{"t":"old","f":"loses","fb":"Old, but is it broken? \u003cem>Shattered\u003c/em> says so."},{"t":"sad","f":"adds","fb":"\u003cem>Shattered\u003c/em> means broken, not sad."}]},"stone",{"o":"visage","opts":[{"t":"face","f":"faithful"},{"t":"mask","f":"adds","fb":"A mask hides a face; the poem shows the face itself."},{"t":"vision","f":"adds","fb":"\u003cem>Visage\u003c/em> means face, not a vision or a dream."}]},"lies there; its frown,"]},{"n":5,"m":"cruel, contemptuous ruler","p":["its wrinkled lip, and",{"o":"sneer of cold command","opts":[{"t":"a cold, scornful look of command","f":"faithful","m":"cruel, contemptuous ruler"},{"t":"an expression of authority","f":"loses","m":"a ruler","fb":"The cruelty and contempt are gone, and with them the sculptor’s judgment."},{"t":"the grin of a mass murderer","f":"adds","m":"a mass murderer (more than the words say)","fb":"The words show contempt, not murder."}]},","]},{"n":6,"p":["show that the sculptor",{"o":"well those passions read","opts":[{"t":"understood those feelings well","f":"faithful"},{"t":"saw the face","f":"loses","fb":"He didn’t only see it; he \u003cem>read\u003c/em> it: he understood."},{"t":"could read books about the king","f":"adds","fb":"\u003cem>Read\u003c/em> here means interpret a face."}]}]},{"n":7,"p":["(feelings that still survive,",{"o":"stamped on these lifeless things","opts":[{"t":"carved into the lifeless stone","f":"faithful"},{"t":"on the statue","f":"loses","fb":"\u003cem>Stamped\u003c/em> and \u003cem>lifeless\u003c/em> matter: the feelings outlive the man in dead stone."},{"t":"that still haunt the desert","f":"adds","fb":"Nothing in the line is haunted."}]},")"]},{"n":8,"p":["longer than the hand that",{"o":"mocked","opts":[{"t":"copied and made fun of","f":"faithful"},{"t":"made","f":"loses","fb":"\u003cem>Mocked\u003c/em> means imitated and ridiculed, not just made."},{"t":"hated","f":"adds","fb":"Mocking isn’t the same as hating."}]},"them and the heart that fed them."]},{"n":9,"p":["And on the",{"o":"pedestal","opts":[{"t":"base of the statue","f":"faithful"},{"t":"stone","f":"loses","fb":"Which stone? The base, where words are carved."},{"t":"altar","f":"adds","fb":"An altar is for worship; this is a statue’s base."}]},"these words are written:"]},{"n":10,"p":["“My name is Ozymandias,",{"o":"King of Kings","opts":[{"t":"the greatest king of all","f":"faithful"},{"t":"a king","f":"loses","fb":"“King of Kings” is a boast; “a king” loses it."},{"t":"a god","f":"adds","fb":"He boasts of being king of kings, not a god."}]},";"]},{"n":11,"p":["look at what I built,",{"o":"ye Mighty","opts":[{"t":"you powerful people","f":"faithful"},{"t":"everyone","f":"loses","fb":"He speaks to the \u003cem>mighty\u003c/em>, not to everyone."},{"t":"you weaklings","f":"adds","fb":"He addresses the mighty as rivals, not as weaklings."}]},", and despair!”"]},{"n":12,"p":[{"o":"Nothing beside remains","opts":[{"t":"Nothing else is left","f":"faithful"},{"t":"Not much is left","f":"loses","fb":"“Not much” softens \u003cem>nothing\u003c/em>."},{"t":"Thieves took everything else","f":"adds","fb":"The line doesn’t say why nothing remains."}]},". Around the ruin"]},{"n":13,"p":["of that",{"o":"colossal Wreck","opts":[{"t":"huge wreck","f":"faithful"},{"t":"wreck","f":"loses","fb":"\u003cem>Colossal\u003c/em> matters: the bigger the ruin, the sharper the irony."},{"t":"shipwreck","f":"adds","fb":"A wrecked statue, not a ship."}]},", endless and empty,"]},{"n":14,"p":["the",{"o":"lone and level","opts":[{"t":"empty, flat","f":"faithful"},{"t":"sandy","f":"loses","fb":"It drops how empty and flat the desert is."},{"t":"lonely, grieving","f":"adds","fb":"“Grieving” gives the sand feelings the line doesn’t give it."}]},"sands stretch far into the distance.”"]}],"fid":{"faithful":"faithful","loses":"loses detail","adds":"adds meaning"},"lists":{"craft":["irony","juxtaposition","alliteration","imagery","diction","frame","enjambment","caesura","metaphor","personification","tone","structure","simile"],"strong":["undercuts","juxtaposes","reframes","intensifies","implies","exposes","complicates","foreshadows"],"vague":["shows","says","is about","talks about"]},"build":{"qmin":2,"qmax":8,"wmin":25,"wmax":60,"sig":["which suggests","which implies","so that","revealing","suggesting","implying"],"tests":["A quotation of 2–8 words, in quotation marks, exactly as in the poem","A craft term (irony, juxtaposition, alliteration, frame…)","A strong verb from the bank (undercuts, reframes, intensifies…)","A “so what” clause: which suggests… / which implies… / so that… / revealing… / suggesting… / implying…","25–60 words"],"examples":["Shelley’s juxtaposition of the boast “Look on my Works” with “Nothing beside remains” undercuts the king’s command, suggesting that power which depends on monuments is as fragile as stone.","The alliteration in “lone and level sands” stretches the final line, so that the emptiness feels endless and the reader experiences how completely time has erased the king.","The frame of a traveller’s report distances the reader from the “King of Kings,” which implies that tyrants survive only as rumours told by strangers."],"wrongQuote":"That wording isn’t in the poem. Check it letter by letter.","wrongVerb":"Swap “shows” for a verb that says how.","wrongSig":"Add the “so what”: which suggests… / so that…","save":"That’s a full climb in one sentence. Save it to your commonplace book if you’re proud of it."},"p4":{"before":"Lines 13–14 have alliteration.","after":"Lines 13–14 have alliteration: the long, soft \u003cem>l\u003c/em> and \u003cem>b\u003c/em> sounds stretch the line out, so that the emptiness feels endless."},"aha":"Analysis isn’t a different subject from paraphrase; it’s the top of the same ladder. Each rung earns the next. And “so what?” is the question that lifts you.","predIntro":"Make a prediction first. Then the ladder and the poem will show you what happens.","predictions":[{"id":"p1","prompt":"As the king meant it, “Look on my Works, ye Mighty, and despair!” means “despair, because you’ll never match me.” Now read it next to “Nothing beside remains.” What happens to its meaning?","options":[{"t":"It becomes a joke the king intended","_n":"ob68","_k":"99191bc2"},{"t":"It becomes a question","_n":"pb58","_k":"d928956a"},{"t":"It flips: now “despair” means despair, because even mighty works vanish","_n":"qb48","_k":"aec94261"},{"t":"Nothing changes; the boast stays a boast","_n":"rc38","_k":"8ce264e1"}],"explain":"This is irony: the words are the same, but their meaning has reversed. Shelley gets the reversal from \u003cstrong>placement\u003c/strong>, putting the boast right before the emptiness."},{"id":"p2","prompt":"How many voices speak in the poem?","options":[{"t":"Four: the speaker, the traveller, the sculptor and the king","_n":"sc28","_k":"2d741f91"},{"t":"Two: the speaker and the king","_n":"t358","_k":"8ad02b0d"},{"t":"One: Shelley","_n":"u368","_k":"2ce88ac7"},{"t":"Three: the “I”, the traveller and the king’s carved words","_n":"v378","_k":"1202d826"}],"explain":"The king never speaks to us directly. His words come third-hand: carved, then reported, then remembered. The frame itself shrinks him."},{"id":"p3","prompt":"Swap “sneer of cold command” for “expression of authority”. What’s lost?","options":[{"t":"Only the rhyme","_n":"w388","_k":"d4fd0687"},{"t":"Nothing important; they mean the same thing","_n":"x318","_k":"53662ac5"},{"t":"The cruelty and contempt, and with them the sculptor’s judgment of the king","_n":"y328","_k":"d49baf4c"},{"t":"The fact that he was a king","_n":"z338","_k":"edab2689"}],"explain":"\u003cem>Sneer\u003c/em> and \u003cem>cold\u003c/em> carry judgment. Paraphrase can flatten diction; analysis notices exactly what the original words add."},{"id":"p4","prompt":"A student writes: “Lines 13–14 have alliteration.” Press “So what?”. What’s missing?","options":[{"t":"A second device","_n":"10348","_k":"52179921"},{"t":"The author’s name","_n":"113d8","_k":"6bc87108"},{"t":"What the sounds do: the long, soft \u003cem>l\u003c/em> and \u003cem>b\u003c/em> sounds stretch the line out, so the emptiness feels endless","_n":"123e8","_k":"cbfdeb39"},{"t":"Nothing; naming the device is analysis","_n":"132f8","_k":"875bb14b"}],"explain":"Naming the device is an observation. Explaining its effect, and why that effect matters, is analysis."}],"chalIntro":"Use the ladder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,6],"prompt":"\u003cstrong>Sort the cards.\u003c/strong> Sort all 8 cards onto the right rungs (or the response tray). \u003cbutton type=\"button\" class=\"btn ghost sm lr-setup\" data-setup=\"tc1\">Set it up\u003c/button>","why":"Each card sits where its thinking stops: retell, point, suggest, or explain how and why.","hints":["Ask of each card: does it retell, point, suggest, or explain how \u003cem>and\u003c/em> why?","Cards with quotations and no claim are observations.","Cards naming a craft choice \u003cem>and\u003c/em> a meaning \u003cem>and\u003c/em> a significance are analysis."]},{"id":"tc2","goal":[2,4,6],"prompt":"\u003cstrong>Climb.\u003c/strong> Climb from the paraphrase “A traveller describes a broken statue of a king in the desert” to analysis, choosing one sentence on each rung. \u003cbutton type=\"button\" class=\"btn ghost sm lr-setup\" data-setup=\"tc2\">Set it up\u003c/button>","why":"Quotation, then what it suggests, then how the craft makes the meaning and why it matters.","hints":["Choose the observation with a quotation.","Choose the interpretation that uses the sculptor.","O2 → I3 → A1."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"\u003cstrong>Build your own.\u003c/strong> Build your own analysis sentence about “Ozymandias” in the builder. It must pass all five tests. \u003cbutton type=\"button\" class=\"btn ghost sm lr-setup\" data-setup=\"tc3\">Set it up\u003c/button>","why":"That’s a full climb in one sentence. Save it to your commonplace book if you’re proud of it.","hints":["Start with the craft: “Shelley’s juxtaposition of…”","Quote 2–8 exact words; then use a strong verb.","Finish with “suggesting that…” and say why it matters."]}],"blocks":[{"title":"A note on the ladder","html":"\u003cp>Real analysis often blends the rungs. The ladder is a training scaffold, not a rule that every paragraph must follow step by step. Use it to check where a sentence stops, then climb.\u003c/p>\u003cp class=\"tiny muted\">For teachers: the module treats the four rungs as a scaffold for drafting and revision, not as a required paragraph template.\u003c/p>"}]},"part3":{"slug":"upgrade","name":"Upgrade","heading":"Upgrade the sentence","intro":"In Explore you learned to recognize the rungs. Here you revise: turn six weak sentences into analysis with three tools. The verb dial swaps a vague verb for a stronger one, the “how” slot adds the craft, and the “so what” slot adds significance. The rung m&#101;ter climbs as you use each tool well.","upgrade":{"tools":{"dial":"Verb dial","how":"“How” slot","sw":"“So what” slot"},"sentences":[{"id":"s1","weak":"The poem is about a statue.","start":"A topic, not a claim","dial":[{"t":"The poem is about a statue","fb":"“Is about” names a topic and hides how the poem works.","_n":"142e8","_k":"259e8693"},{"t":"The poem describes a broken statue","fb":"Still retelling: what does the poem \u003cem>do\u003c/em> with the statue?","_n":"15318","_k":"8fbaed39"},{"t":"Shelley turns a ruined statue into an argument about how power fades","fb":"“Turns … into” says what Shelley does with the statue.","_n":"16308","_k":"9ecb2a1c"},{"t":"Shelley reframes a ruined statue as an argument about how power fades","fb":"\u003cem>Reframes\u003c/em> says how: the statue becomes an argument.","_n":"17338","_k":"6f088bba"}],"how":[{"t":"using the gap between the king’s boast and the empty desert","fb":"That names the craft: the gap, a juxtaposition, between boast and desert.","_n":"18328","_k":"ca5f6cac"},{"t":"using many literary devices","fb":"Which devices? Name one craft choice.","_n":"19358","_k":"e2148951"},{"t":"in fourteen lines","fb":"A fact about the form, not how the meaning is made.","_n":"1a348","_k":"ef76e028"}],"sw":[{"t":"suggesting that no monument can make power last","fb":"That answers “so what?”: why the gap matters.","_n":"1b378","_k":"2922e677"},{"t":"which is interesting","fb":"Interesting how? Say why it matters.","_n":"1c368","_k":"7dfaeeb4"},{"t":"which proves that Shelley hated all kings","fb":"Can you point to the words that prove this? If not, narrow the claim to what the text supports.","_n":"1d498","_k":"db31422d"}],"zoom":[[11,"Look on my Works, ye Mighty, and despair!"],[12,"Nothing beside remains."],[14,"The lone and level sands stretch far away."]]},{"id":"s2","weak":"Shelley uses alliteration in the last line.","start":"An observation: a device named, no effect","dial":[{"t":"Shelley uses alliteration in the last line","fb":"“Uses” names the device but not what it does.","_n":"1e4a8","_k":"ca187b5c"},{"t":"The last line shows alliteration","fb":"“Shows” is vague: it hides \u003cem>how\u003c/em>.","_n":"1f478","_k":"97cdf619"},{"t":"The alliteration in “The lone and level sands” (line 14) is about sand","fb":"“Is about” turns a sound into a topic.","_n":"1g488","_k":"7dd54687"},{"t":"The alliteration in “The lone and level sands” (line 14) intensifies the emptiness","fb":"\u003cem>Intensifies\u003c/em> says what the sound does.","_n":"1h458","_k":"287da77a"}],"how":[{"t":"stretching the line out with long, soft \u003cem>l\u003c/em> sounds","fb":"That’s the effect: what the sound does.","_n":"1i468","_k":"42470c54"},{"t":"which is a sound device","fb":"That repeats the label. What does the sound do?","_n":"1j438","_k":"5e438191"},{"t":"and the line also rhymes","fb":"A second device isn’t an effect.","_n":"1k448","_k":"2f1ac3f7"}],"sw":[{"t":"so that the desert feels endless and the king’s boast sounds hollow","fb":"That says why the effect matters.","_n":"1l418","_k":"629e7a8a"},{"t":"in line 14","fb":"That’s a location, not significance.","_n":"1m428","_k":"7d67e0f7"},{"t":"which is good writing","fb":"Praise isn’t significance: why does the effect matter?","_n":"1nc38","_k":"5df7c0b4"}],"zoom":[[13,"boundless and bare"],[14,"The lone and level sands stretch far away."]]},{"id":"s3","weak":"The king says “Look on my Works, ye Mighty, and despair!”","start":"A plop quote","dial":[{"t":"The king says “Look on my Works, ye Mighty, and despair!”","fb":"Every quotation needs a doorway in (a signal phrase) and a room after it (your explanation).","_n":"1oc28","_k":"cc860004"},{"t":"The king talks about his works","fb":"“Talks about” is vague, and the quotation is gone.","_n":"1pc18","_k":"ad583724"},{"t":"The king boasts, “Look on my Works, ye Mighty, and despair!” (Shelley, line 11)","fb":"Better: the quotation has a doorway in and a citation. Now pick a verb that shows the irony.","_n":"1qc08","_k":"eac02c5c"},{"t":"The king’s command to “Look on my Works, ye Mighty, and despair!” (Shelley, line 11) undercuts itself","fb":"Integrated and cited, and \u003cem>undercuts\u003c/em> names the irony.","_n":"1rc78","_k":"02c8d2f7"}],"how":[{"t":"because Shelley places it directly before “Nothing beside remains” (line 12)","fb":"That names the craft: placement, a juxtaposition.","_n":"1sc68","_k":"04fcfb47"},{"t":"because the king is shouting","fb":"Nothing says he shouts. What does the placement do?","_n":"1tc58","_k":"1d9a5e44"},{"t":"(line 11)","fb":"A citation alone doesn’t show the irony.","_n":"1uc48","_k":"2d77fbbc"}],"sw":[{"t":"so the threat turns into a warning that even the mightiest works vanish","fb":"That’s the irony, and why it matters.","_n":"1vbb8","_k":"a22005c1"},{"t":"which shows he was a king","fb":"Vague, and it tells us what we already know.","_n":"1wba8","_k":"4ff7d788"},{"t":"which proves that every ruler is evil","fb":"Can you point to the words that prove this? If not, narrow the claim to what the text supports.","_n":"1xbd8","_k":"e423baf6"}],"zoom":[[10,"My name is Ozymandias, King of Kings;"],[11,"Look on my Works, ye Mighty, and despair!"],[12,"Nothing beside remains."]]},{"id":"s4","weak":"The poem shows that time destroys things.","start":"A vague interpretation","dial":[{"t":"The poem shows that time destroys things","fb":"“Shows” is vague: it hides \u003cem>how\u003c/em>.","_n":"1ybe8","_k":"0bbbad52"},{"t":"The poem is about time destroying things","fb":"“Is about” names a topic, not a claim.","_n":"1zbf8","_k":"5e5fe05e"},{"t":"The poem dramatizes how time erases even a king’s power","fb":"\u003cem>Dramatizes\u003c/em> says how: the poem acts it out.","_n":"20c08","_k":"2eac3be7"},{"t":"The poem implies that time erases even a king’s power","fb":"\u003cem>Implies\u003c/em> is a precise analysis verb.","_n":"21c18","_k":"d4dff3ef"}],"how":[{"t":"through the closing image of “lone and level sands” that “stretch far away” (lines 13–14)","fb":"That names the craft: the closing image, quoted and cited.","_n":"22c28","_k":"df2d042b"},{"t":"through many images","fb":"Which image? Name it and quote it.","_n":"23c38","_k":"6f9ec348"},{"t":"in its last six lines","fb":"Naming a section isn’t naming the craft.","_n":"24c48","_k":"0ecd9df4"}],"sw":[{"t":"suggesting that the desert, not the king, has the last word","fb":"That says why the image matters.","_n":"25b58","_k":"5dc7b998"},{"t":"which is sad","fb":"Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"26b68","_k":"275a7df7"},{"t":"which proves that time destroys everything","fb":"Can you point to the words that prove this? If not, narrow the claim to what the text supports.","_n":"27b77","_k":"d6f7a91a"}],"zoom":[[13,"Of that colossal Wreck, boundless and bare"],[14,"The lone and level sands stretch far away."]]},{"id":"s5","weak":"The sculptor is important.","start":"A vague claim","dial":[{"t":"The sculptor is important","fb":"Important how? “Is” hides the thinking.","_n":"28b67","_k":"42c61dcc"},{"t":"The sculptor is mentioned in line 6","fb":"A location, not a claim.","_n":"29b97","_k":"c16017ea"},{"t":"The sculptor exposes the king’s cruelty","fb":"\u003cem>Exposes\u003c/em> says what the sculptor’s work does.","_n":"2ab87","_k":"d26dd9c0"},{"t":"The sculptor reframes the statue as a judgment of the king","fb":"\u003cem>Reframes\u003c/em> says how the statue changes meaning.","_n":"2bb37","_k":"6a5c4924"}],"how":[{"t":"since the hand that “mocked” the king’s passions also “well those passions read” (lines 6–8)","fb":"That quotes how: he read the passions, then mocked them in stone.","_n":"2cb27","_k":"24640b00"},{"t":"since he made the statue","fb":"True, but how does the poem show his judgment?","_n":"2db57","_k":"bfcce4f7"},{"t":"since he is an artist","fb":"Which words show what he did?","_n":"2eb47","_k":"2b1610f3"}],"sw":[{"t":"suggesting that art judges power, and outlasts it","fb":"That’s the “so what”: art judges power.","_n":"2fbf7","_k":"4968ad49"},{"t":"which shows he was talented","fb":"That praises the sculptor; it doesn’t say why it matters for the poem.","_n":"2gbe7","_k":"28491f24"},{"t":"which proves that the sculptor hated the king","fb":"Can you point to the words that prove this? If not, narrow the claim to what the text supports.","_n":"2hb17","_k":"2c09ae4f"}],"zoom":[[6,"Tell that its sculptor well those passions read"],[7,"Which yet survive, stamped on these lifeless things,"],[8,"The hand that mocked them, and the heart that fed;"]]},{"id":"s6","weak":"I like how it ends.","start":"A personal response","dial":[{"t":"I like how it ends","fb":"Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"2ib27","_k":"6d2c473d"},{"t":"The ending is good","fb":"Good how? A judgment with no evidence.","_n":"2jaf7","_k":"c7d8c75b"},{"t":"The ending leaves the reader with emptiness instead of the king’s glory","fb":"Now it says what the \u003cem>text\u003c/em> does.","_n":"2kb07","_k":"d925eb82"},{"t":"The ending exposes how little of the king’s glory survives","fb":"\u003cem>Exposes\u003c/em> says what the ending does.","_n":"2lb57","_k":"0c2b105c"}],"how":[{"t":"through the “boundless and bare” sands of lines 13–14","fb":"That’s the evidence: quoted and located.","_n":"2mb67","_k":"2721a6a2"},{"t":"because I found it eerie","fb":"Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"2nb37","_k":"65e6dcf3"},{"t":"because it is the end","fb":"That’s circular. Which words make the ending work?","_n":"2ob47","_k":"cb67e96d"}],"sw":[{"t":"implying that the king’s command to “despair” has come true for the king himself","fb":"That says why it matters: the irony lands on him.","_n":"2pb97","_k":"229ba94c"},{"t":"which I enjoyed","fb":"Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"2qba7","_k":"6bbbffda"},{"t":"which proves that Shelley visited Egypt","fb":"Unsupported biography. Can you point to the words that prove this? If not, narrow the claim to what the text supports.","_n":"2r648","_k":"1ee177fd"}],"zoom":[[11,"Look on my Works, ye Mighty, and despair!"],[13,"boundless and bare"],[14,"The lone and level sands stretch far away."]]}]},"quickCheck":{"title":"Upgrade the sentence quick check","summary":"Upgrade the sentence quick check","items":[{"id":"q1","goal":4,"prompt":"Which verb best replaces “shows” in: “The empty desert shows the king’s boast is wrong”?","right":"Right. \u003cem>Undercuts\u003c/em> says \u003cem>how\u003c/em>: the desert works against the boast.","wrong":"\u003cem>Undercuts\u003c/em> says \u003cem>how\u003c/em>: the desert works against the boast.","choices":[{"t":"says","_n":"2s658","_k":"d5516aa1"},{"t":"is","_n":"2t628","_k":"bd3187ad"},{"t":"talks about","_n":"2u638","_k":"eff6e739"},{"t":"undercuts","_n":"2v608","_k":"f1182a1a"}]},{"id":"q2","goal":4,"prompt":"Which addition supplies the “so what”?","right":"Right. Significance answers “why does this matter?”","wrong":"Significance answers “why does this matter?”","choices":[{"t":"“…in line 11.”","_n":"2w618","_k":"78816cb9"},{"t":"“…suggesting that power built on monuments cannot last.”","_n":"2x5e8","_k":"1ffe1418"},{"t":"“…and it rhymes.”","_n":"2y5f8","_k":"90bf3ae5"},{"t":"“…which is a quotation.”","_n":"2z5c8","_k":"0880053b"}]},{"id":"q3","goal":3,"prompt":"Which turns “I like how it ends” into interpretation?","right":"Right. Interpretation points to the text and says what it suggests.","wrong":"Interpretation points to the text and says what it suggests.","choices":[{"t":"“The ending is good.”","_n":"305d8","_k":"a2a4ef5d"},{"t":"“Shelley wrote the ending last.”","_n":"314a8","_k":"8712ac5e"},{"t":"“I really, really like it.”","_n":"32498","_k":"9efda57d"},{"t":"“The ending’s ‘boundless and bare’ sands leave the reader with emptiness instead of the king’s glory.”","_n":"334c8","_k":"1c6b4401"}]},{"id":"q4","goal":3,"prompt":"Which upgrade overreaches?","right":"Right. The poem’s words can’t prove the poet’s private feelings about every king.","wrong":"The poem’s words can’t prove the poet’s private feelings about every king.","choices":[{"t":"“The sneer reveals cruelty.”","_n":"344b8","_k":"5a5477b8"},{"t":"“The boast becomes a warning.”","_n":"354e8","_k":"cd1e256e"},{"t":"“This proves Shelley hated all kings.”","_n":"364d8","_k":"5f9119c7"},{"t":"“The frame distances the reader from the king.”","_n":"37508","_k":"fe99465e"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class=\"steal-line\">“Poets are the unacknowledged legislators of the world.”\u003c/p>\u003cp class=\"eng-cite\">Percy Bysshe Shelley, \u003cem>A Defence of Poetry\u003c/em> (written 1821, published 1840)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> “[Group] are the unacknowledged [powerful role] of [domain]”: a surprising claim about hidden influence.\u003c/p>\u003cp>\u003cstrong>Example:\u003c/strong> “Librarians are the unacknowledged architects of a town’s imagination.”\u003c/p>\u003cp>Keep the shape. Change the content. Your imitation saves here, and you can add it to your commonplace book.\u003c/p>","prompt":"Your imitation:"}]},"practice":{"activities":[{"id":"rungs","type":"custom","title":"Rung sort: Wordsworth","summary":"Rung sort","noun":"sentence","txt":true,"goal":6,"instruction":"Read the stanza, then sort ten sentences about it: paraphrase, observation, interpretation, analysis, or personal response.","how":"Tap a sentence, then tap the box it belongs in.","passage":["I wandered lonely as a cloud","That floats on high o’er vales and hills,","When all at once I saw a crowd,","A host, of golden daffodils;","Beside the lake, beneath the trees,","Fluttering and dancing in the breeze."],"cite":"William Wordsworth, “I wandered lonely as a cloud” (1815 text), stanza 1","boxes":[{"id":"para","label":"Paraphrase"},{"id":"obs","label":"Observation"},{"id":"int","label":"Interpretation"},{"id":"ana","label":"Analysis"},{"id":"resp","label":"Personal response"}],"wrongDefault":"Ask: does it retell, point, suggest, or explain how and why? Try another box.","items":[{"id":"i1","t":"The speaker was walking alone when he suddenly saw lots of daffodils by a lake.","_a":"FElWEFdD","why":"It retells what happens, in plain words.","wrong":{"ana":"It retells; there’s no how or why."},"hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Paraphrase: it retells what happens, in plain words."]},{"id":"i2","t":"The speaker compares himself to “a cloud” in line 1.","_a":"FFZVERQ=","why":"It points to exact words, but makes no claim yet.","hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Observation: it points to exact words (“a cloud”) but makes no claim yet."]},{"id":"i3","t":"The flowers are described as “a crowd” and “a host,” words usually used for people.","_a":"FFZVERQ=","why":"It points to specific words and their usual use, but doesn’t say what they suggest.","wrong":{"int":"It points to the words but doesn’t yet say what they suggest."},"hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Observation: it points to the words and their usual use, but doesn’t say what they suggest."]},{"id":"i4","t":"The speaker’s loneliness is eased by the sight of the flowers.","_a":"FFBZFhQ=","why":"It says what the scene suggests about the speaker, without naming the craft.","hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Interpretation: it says what the scene suggests, without naming the craft."]},{"id":"i5","t":"The shift from the single “cloud” to “a crowd” reframes the speaker’s isolation as sudden company, implying that nature can answer loneliness.","_a":"FFhZAxQ=","why":"It names the craft (the shift from “cloud” to “crowd”), says what it does and why it matters.","wrong":{"int":"It names the craft, says what it does \u003cem>and\u003c/em> why it matters: that’s analysis."},"hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Analysis: it names the craft, says what it does and why it matters."]},{"id":"i6","t":"I love daffodils.","_a":"FEtSEUZD","why":"It’s about the reader’s feelings, not the poem.","wrong":{"int":"That’s about you, not the poem."},"hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Personal response: it’s about the reader, not the poem."]},{"id":"i7","t":"The flowers seem almost alive and sociable.","_a":"FFBZFhQ=","why":"It says what the description suggests, without quoting or naming the craft.","hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Interpretation: it says what the description suggests."]},{"id":"i8","t":"“Fluttering and dancing” personifies the flowers, so the scene feels like a celebration the speaker has stumbled into, which suggests joy arrives unplanned.","_a":"FFhZAxQ=","why":"It names the craft (personification), says what it does and why it matters.","hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Analysis: personification, its effect, and why it matters."]},{"id":"i9","t":"The daffodils are next to a lake and under some trees.","_a":"FElWEFdD","why":"It retells where the flowers are, in plain words.","hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Paraphrase: it retells where the flowers are."]},{"id":"i10","t":"Lines 5 and 6 both begin with a preposition or a participle, and line 6 is the only line with extra syllables.","_a":"FFZVERQ=","why":"It points to a feature of the lines’ structure, but makes no claim.","hints":["Is there a quotation? Is there a claim?","Is there a craft term \u003cem>and\u003c/em> a significance?","Observation: it points to a feature of the structure, with no claim."]}]},{"id":"unseen","type":"custom","title":"Unseen prose: the climb","summary":"Unseen prose","star":true,"goal":[1,2,3,4,5],"instruction":"Read the passage from \u003cem>Frankenstein\u003c/em>, then climb: paraphrase, observe, interpret, analyse. Questions 4–6 go beyond the Final Check.","how":"Pick an answer, then press Check answer. Wrong answers show why; try again.","passage":["It was on a dreary night of November that I beheld the accomplishment of my toils. With an anxiety that almost amounted to agony, I collected the instruments of life around me, that I might infuse a spark of being into the lifeless thing that lay at my feet."],"cite":"Mary Shelley, \u003cem>Frankenstein\u003c/em> (1818), the opening of Chapter 5 (1831 text). Public domain.","items":[{"id":"u1","goal":1,"prompt":"\u003cstrong>U1.\u003c/strong> Best paraphrase?","options":[{"t":"On a rainy night, I watched a monster come alive and run away.","why":"That adds events the passage doesn’t contain: the creature isn’t alive yet.","_n":"384f8","_k":"f56b2210"},{"t":"One November night, he calmly put his tools away.","why":"“An anxiety that almost amounted to agony” isn’t calm, he gathers his tools, and the speaker is “I”.","_n":"39528","_k":"209c1b16"},{"t":"I finished my homework in November.","why":"\u003cem>Toils\u003c/em> are his life’s labour here.","_n":"3a518","_k":"a301de4d"},{"t":"On a gloomy November night, I saw my long work completed. Nervous almost to the point of pain, I gathered my tools to bring the body at my feet to life.","why":"Accurate and plain: it keeps the speaker, the night, the anxiety and the purpose.","_n":"3bd88","_k":"6ba2516f"}],"hints":["Who is speaking, and what is he about to do?","\u003cem>Toils\u003c/em> means long, hard work; the \u003cem>instruments\u003c/em> are his tools.","On a gloomy November night, I saw my long work completed…"]},{"id":"u2","goal":2,"prompt":"\u003cstrong>U2.\u003c/strong> Which observation is most specific?","options":[{"t":"The passage is gloomy.","why":"True, but which words make it gloomy?","_n":"3cd98","_k":"4fe66674"},{"t":"The narrator calls his creation “the lifeless thing” in the same sentence as “the instruments of life.”","why":"Specific and quotable: it points to exact words placed side by side.","_n":"3dda8","_k":"5ec400f8"},{"t":"The narrator is a scientist.","why":"A fact about the story, not a feature of the language.","_n":"3edb8","_k":"0994a3d9"},{"t":"The passage uses some long words.","why":"Which words? An observation points to something specific.","_n":"3fdc8","_k":"08b17a53"}],"hints":["Which option points to exact words?","Look for quotation marks.","“the lifeless thing” in the same sentence as “the instruments of life”."]},{"id":"u3","goal":3,"prompt":"\u003cstrong>U3.\u003c/strong> Which interpretation does the text support?","options":[{"t":"The narrator hates November.","why":"The month sets the mood; nothing says what he thinks of it.","_n":"3gdd8","_k":"a7b8bedd"},{"t":"The narrator is calm and confident.","why":"“An anxiety that almost amounted to agony” says otherwise.","_n":"3hde8","_k":"1d0ad9e3"},{"t":"He’s a murderer.","why":"Nothing here supports that.","_n":"3idf8","_k":"5b14ff41"},{"t":"The narrator’s triumph is mixed with dread.","why":"“The accomplishment of my toils” sits beside “dreary” and “an anxiety that almost amounted to agony”.","_n":"3jd08","_k":"80b5e5df"}],"hints":["Which words show how he feels?","“Accomplishment” beside “anxiety” and “agony”.","Triumph mixed with dread."]},{"id":"u4","goal":3,"prompt":"\u003cstrong>U4.\u003c/strong> \u003cspan class=\"tag\">★\u003c/span> Which detail most undercuts the sense of triumph in “the accomplishment of my toils”?","options":[{"t":"“a dreary night of November”","why":"The dreary setting darkens the moment of success.","_n":"3kd18","_k":"996a9187"},{"t":"“instruments of life”","why":"That supports the scientific triumph.","_n":"3l5e8","_k":"744bbd38"},{"t":"“I collected”","why":"A plain action; it neither supports nor undercuts the triumph.","_n":"3m5d8","_k":"699bf344"},{"t":"“around me”","why":"It only places the instruments; it doesn’t colour the triumph.","_n":"3n5c8","_k":"25fea038"}],"hints":["Which detail makes the moment feel dark?","Look at when it happens.","“a dreary night of November”."]},{"id":"u5","goal":4,"prompt":"\u003cstrong>U5.\u003c/strong> \u003cspan class=\"tag\">★\u003c/span> Which analysis sentence is strongest?","options":[{"t":"Victor is excited.","why":"That’s paraphrase. This retells \u003cem>what\u003c/em> happens. Analysis explains \u003cem>how\u003c/em> the words make it mean something, and \u003cem>why\u003c/em> that matters.","_n":"3o5b8","_k":"b4233794"},{"t":"Mary Shelley was 18 when she wrote it.","why":"Biography, not analysis of the words. Can you point to the words that prove this? If not, narrow the claim to what the text supports.","_n":"3p628","_k":"f87b9d32"},{"t":"The setting shows it’s November.","why":"A vague verb and no “so what”. Pick a verb that says \u003cem>how\u003c/em>: undercuts, juxtaposes, reframes, intensifies, implies.","_n":"3q618","_k":"85d9a5b4"},{"t":"By setting “the accomplishment of my toils” on “a dreary night,” Mary Shelley juxtaposes success with gloom, implying that the creation is already shadowed by disaster.","why":"It names the craft (juxtaposition), says what it does and why it matters.","_n":"3r608","_k":"96ad5465"}],"hints":["Which option names a craft choice?","Which also says why it matters?","The juxtaposition sentence."]}],"select":{"id":"u6","goal":[2,4],"prompt":"\u003cstrong>U6.\u003c/strong> \u003cspan class=\"tag\">★\u003c/span> Which phrase carries the irony of the passage? (Select 2.)","options":[{"t":"“infuse a spark of being”","why":"","_n":"3s5f8","_k":"575a0727"},{"t":"“the lifeless thing”","why":"","_n":"3t568","_k":"76e338a0"},{"t":"“a dreary night”","why":"That’s mood, not irony; the irony is giving life to a “thing”.","_n":"3u558","_k":"39e3b72d"},{"t":"“my toils”","why":"That’s his labour, not an irony.","_n":"3vdc9","_k":"73f697b8"}],"why":"He means to “infuse a spark of being” into something he calls “the lifeless thing”: life f
