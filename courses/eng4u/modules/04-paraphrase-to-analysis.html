or a thing defined by having none.","hints":["Irony: words whose meaning works against itself.","What is he trying to give, and to what?","“infuse a spark of being” and “the lifeless thing”."]}},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Esperanza","goal":[3,4,5],"instruction":"Esperanza made one mistake in each paragraph about “Ozymandias”. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Write an analytical paragraph about the poem’s ending.","steps":["Shelley’s “Ozymandias” ends with an image of empty desert.","In the last lines, the traveller says that around the broken statue there is only sand, and the sand goes on for a long way.","This suggests that nothing of the king’s power survives.","The ending is very effective."],"_a":"Bw==","stepFb":["Sentence 1 is a fair opening.","","Sentence 3 interprets, but the paragraph stalled earlier.","Sentence 4 is vague, but the first problem is earlier."],"fixes":[{"t":"The final image, “boundless and bare / The lone and level sands stretch far away” (lines 13–14), uses long, alliterative sounds to make the emptiness feel endless.","why":"A quoted, cited observation with its effect: the paragraph climbs.","_n":"3wdd9","_k":"1b7dce1d"},{"t":"The traveller is lying about the sand.","why":"Nothing suggests that.","_n":"3xda9","_k":"721b49dc"},{"t":"In the last lines, there is sand.","why":"Still paraphrase, and thinner.","_n":"3ydb9","_k":"a8dc4b42"},{"t":"Sentence 2 is correct.","why":"It’s accurate paraphrase, but a paragraph that’s meant to analyse needs observation and analysis here.","_n":"3ze09","_k":"fef753f4"}],"hints":["Which sentence only retells?","Sentence 2 paraphrases.","Replace it with a quoted observation and an effect."]},{"id":"e2","goal":5,"task":"Use a quotation to support a claim about the sculptor.","steps":["The sculptor understood the king better than the king understood himself.","“Tell that its sculptor well those passions read.”","This proves the sculptor was a good artist."],"_a":"Bw==","stepFb":["Sentence 1 makes a claim: fine.","","Sentence 3 is weak, but the first problem is the dropped quotation."],"fixes":[{"t":"The frown and sneer “Tell that its sculptor well those passions read” (Shelley, line 6), meaning the sculptor saw and recorded the king’s arrogance.","why":"A lead-in, the quotation, a citation and an explanation.","_n":"40e19","_k":"85a164f5"},{"t":"The sculptor “read” things.","why":"Too short to support the claim.","_n":"41de9","_k":"ad740388"},{"t":"Sentence 2 is correct.","why":"A quotation standing alone, without a lead-in or explanation, is a “plop quote”.","_n":"42df9","_k":"b73d7d48"},{"t":"“Tell that its sculptor well those passions read” (line 6).","why":"A citation alone doesn’t integrate the quotation.","_n":"43d49","_k":"64a2d013"}],"hints":["Does the quotation have a doorway in?","Who “tells”, and what?","Lead in, quote, cite, explain."]},{"id":"e3","goal":3,"task":"Interpret the poem’s message.","steps":["The poem places the king’s boast just before “Nothing beside remains.”","This irony suggests that the king’s power did not last.","Therefore the poem proves that every leader in history was evil and that Shelley hated all governments.","The ending’s empty sands drive the point home."],"_a":"BA==","stepFb":["Sentence 1 is a precise observation.","Sentence 2 is a supported interpretation.","","Sentence 4 is fine; check sentence 3."],"fixes":[{"t":"Therefore the poem has no message.","why":"The irony clearly carries one.","_n":"44d59","_k":"ede0cd89"},{"t":"Therefore the poem warns that power resting on fear and monuments cannot outlast time.","why":"The claim stays within what the words support.","_n":"45e29","_k":"2cfab2f7"},{"t":"Sentence 3 is correct.","why":"“Every leader” and “hated all governments” go far beyond what the words support.","_n":"46e19","_k":"ddb416cc"},{"t":"Therefore Shelley was a pharaoh.","why":"That’s nonsense, and unsupported.","_n":"47e49","_k":"315175e4"}],"hints":["Can the poem’s words prove “every leader in history”?","Narrow the claim to this king and this kind of power.","Power resting on fear can’t last."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which rung of the ladder do you usually stop on when you write about literature? Why?"},{"id":"j2","q":"In your own words, what’s the difference between interpreting a poem and responding to it? Why do both matter?"},{"id":"j3","q":"Explain to a friend how to turn “The poem is about time” into an analytical sentence."},{"id":"j4","q":"Which upgrade tool (the stronger verb, the “how” clause, the “so what” clause) do you most need to practise? How will you practise it?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from this module that you’d like to remember, and add a sentence explaining what it unties for you.\u003c/p>\u003cdiv id=\"cp-app\">\u003c/div>"}],"art":{"intro":"Write one principle about turning reading into analysis, in your own words. Give a master’s example: a line from “Ozymandias” or one of the module’s sentences that shows the principle at work. Then write your own sentence that uses it.","placeholder":"Your principle about turning reading into analysis","examples":["Look on my Works, ye Mighty, and despair! / Nothing beside remains. (Shelley, lines 11–12)","Half sunk a shattered visage lies, whose frown, / And wrinkled lip, and sneer of cold command (Shelley, lines 4–5)","The lone and level sands stretch far away. (Shelley, line 14)","I met a traveller from an antique land, / Who said— (Shelley, lines 1–2)","By placing the king’s boast directly before “Nothing beside remains,” Shelley turns “despair” against its speaker, so the inscription now warns the powerful instead of threatening them."]},"artSamples":"\u003cdetails class=\"alg art-samples\">\u003csummary>Two sample principles (examples only; write your own)\u003c/summary>\u003cp class=\"an-note an-syntax\">“Placement can reverse a meaning: put a boast beside its ruin.” \u003cspan class=\"muted\">Master: “Look on my Works, ye Mighty, and despair! / Nothing beside remains.” Imitation: “The poster promised ‘Grand Opening.’ The windows were boarded.”\u003c/span>\u003c/p>\u003cp class=\"an-note an-figure\">“A strong verb does the thinking for the sentence.” \u003cspan class=\"muted\">Master: “Shelley … undercuts the king’s command.” Imitation: “The silence after the question undercut every answer she gave.”\u003c/span>\u003c/p>\u003c/details>","commonplaceLines":["Nothing beside remains. (Shelley, line 12)","The lone and level sands stretch far away. (Shelley, line 14)","Look on my Works, ye Mighty, and despair! (Shelley, line 11)","Tell that its sculptor well those passions read (Shelley, line 6)","Poets are the unacknowledged legislators of the world. (Shelley, A Defence of Poetry)","Fluttering and dancing in the breeze. (Wordsworth, line 6)","Nothing gold can stay. (Frost, line 8)"],"cpNote":"What it unties for you"},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is the most accurate paraphrase of Frost’s “Nature’s first green is gold, / Her hardest hue to hold”?","options":[{"t":"Nature loves gold more than green.","why":"The lines describe a colour, not a preference.","_n":"48e39","_k":"0d4ce994"},{"t":"Gold is the hardest metal to find in nature.","why":"\u003cem>Gold\u003c/em> is the colour of new leaves, not the metal.","_n":"49de9","_k":"4c703f10"},{"t":"Youth never lasts.","why":"That’s an interpretation, not a paraphrase.","_n":"4add9","_k":"e2fca645"},{"t":"In spring, the earliest leaves look golden, and that colour is the hardest one for nature to keep.","why":"Accurate and plain: the first buds have a golden tint that fades fast.","_n":"4be09","_k":"6623002a"}]},"b":{"prompt":"Which is the most accurate paraphrase of Keats’s “Season of mists and mellow fruitfulness”?","options":[{"t":"Autumn is a time of mist, and of ripe, soft, plentiful fruit.","why":"Accurate and plain: the line names two features of the season.","_n":"4cdf9","_k":"9f246a0a"},{"t":"Autumn is sad because things die.","why":"That’s an interpretation.","_n":"4dda9","_k":"20d65e85"},{"t":"Mist makes fruit grow.","why":"The line lists two features of the season; it doesn’t claim a cause.","_n":"4ed99","_k":"8e2db010"},{"t":"Keats liked autumn best.","why":"The line doesn’t state a preference.","_n":"4fd08","_k":"aaf1e6f1"}]}},{"id":"k2","cat":"K","goal":6,"a":{"prompt":"Which rung is this sentence on? “In line 4, the speaker calls the flowers ‘A host, of golden daffodils.’”","options":[{"t":"Interpretation","why":"It doesn’t say what the words suggest.","_n":"4gd18","_k":"9bb732c9"},{"t":"Paraphrase","why":"It quotes and points; it doesn’t retell.","_n":"4hd28","_k":"ba837c8d"},{"t":"Analysis","why":"There’s no craft-plus-meaning-plus-significance.","_n":"4id38","_k":"91aaf2bd"},{"t":"Observation","why":"It points to specific words, but makes no claim yet.","_n":"4jcc8","_k":"a64172e8"}]},"b":{"prompt":"Which rung is this sentence on? “Tennyson’s simile ‘like a thunderbolt’ turns the eagle’s dive into a strike from the heavens, implying that its power is godlike.”","options":[{"t":"Observation","why":"It goes beyond pointing.","_n":"4kcd8","_k":"d12046c5"},{"t":"Analysis","why":"It names the craft, says what it does and why it matters.","_n":"4lce8","_k":"9cdd7f34"},{"t":"Personal response","why":"It’s about the text, not the reader’s feelings.","_n":"4mcf8","_k":"dbdcc8a5"},{"t":"Paraphrase","why":"It doesn’t retell.","_n":"4nd88","_k":"626dbd71"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"Choose the most precise verb: “The final image of endless sand ___ the king’s boast.”","options":[{"t":"says","why":"Images don’t “say”; this hides the mechanism.","_n":"4od98","_k":"3bddeb99"},{"t":"undercuts","why":"It says how: the image works against the boast.","_n":"4pd68","_k":"de8c838e"},{"t":"shows","why":"Vague: it hides \u003cem>how\u003c/em>.","_n":"4qd58","_k":"82ec7f63"},{"t":"is about","why":"Vague, and it doesn’t fit the claim.","_n":"4rd48","_k":"005e6011"}]},"b":{"prompt":"Choose the most precise verb: “The cheerful wedding music ___ the bride’s private grief.”","options":[{"t":"heightens, by contrast,","why":"It says how: the contrast makes the grief sharper.","_n":"4sd38","_k":"c9d64edc"},{"t":"is","why":"This makes the music and the grief the same thing.","_n":"4td28","_k":"05b52491"},{"t":"talks about","why":"Vague: music doesn’t “talk about”. Pick a verb that says \u003cem>how\u003c/em>: undercuts, juxtaposes, reframes, intensifies, implies.","_n":"4ud18","_k":"71d77463"},{"t":"shows","why":"Vague: it hides \u003cem>how\u003c/em>. Pick a verb that says \u003cem>how\u003c/em>: undercuts, juxtaposes, reframes, intensifies, implies.","_n":"4vd08","_k":"701f4281"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"An original passage: “When the moving truck finally pulled away, Nadia stood in the empty living room and noticed, for the first time, the pale rectangle on the wall where the family photo had hung for eleven years. She pressed her palm flat against it, as if checking for a pulse.” Which interpretation is best supported?","options":[{"t":"The pale patch shows that absence leaves a mark; Nadia treats the house almost as something alive that she is leaving.","why":"“Pale rectangle” (absence) and “checking for a pulse” (alive) both support it.","_n":"4wcf8","_k":"0e07a838"},{"t":"Nadia hated her family and is glad to leave.","why":"Nothing in the passage suggests that.","_n":"4xde8","_k":"8f06008a"},{"t":"The photo was stolen by the movers.","why":"There’s no evidence of theft.","_n":"4ydd8","_k":"91104fda"},{"t":"Nadia is checking whether the wall needs paint.","why":"Too literal: “as if checking for a pulse” is a simile about feeling.","_n":"4z547","_k":"64082067"}]},"b":{"prompt":"An original passage: “Grandpa kept fixing the old radio long after we’d bought him a new one. Every Sunday he’d take off the back, peer at the tubes, and tighten one screw a quarter turn. ‘Nearly there,’ he’d say.” Which interpretation is best supported?","options":[{"t":"He wants to sell the radio.","why":"There’s no evidence.","_n":"50557","_k":"cf46dac3"},{"t":"He dislikes the new radio because it’s broken.","why":"Nothing says it’s broken.","_n":"51527","_k":"b7e9334d"},{"t":"He’s an expert electrician.","why":"Nothing shows expertise; “nearly there” every week suggests otherwise.","_n":"52537","_k":"0cadd29b"},{"t":"The repair is a ritual that keeps something of the past alive for him; finishing it may matter less than continuing it.","why":"“Every Sunday”, one screw at a time, and “Nearly there” every week: the repair itself is the point.","_n":"53507","_k":"51854bae"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Choose the strongest “so what” to complete: “By placing the king’s boast just before ‘Nothing beside remains,’ Shelley turns the inscription into a warning, ___”","options":[{"t":"“…which proves Shelley visited Egypt.”","why":"Unsupported biography.","_n":"54517","_k":"1f51f933"},{"t":"“…suggesting that art outlasts power, since the sculptor’s mocking record is all that survives of the king.”","why":"It answers “why does this matter?”, with evidence from the poem.","_n":"554e7","_k":"f96f5c4e"},{"t":"“…which is in line 11.”","why":"That’s a location, not significance.","_n":"564f7","_k":"eb9cf031"},{"t":"“…and the poem is a sonnet.”","why":"A form label, not significance.","_n":"575c7","_k":"2e61db8a"}]},"b":{"prompt":"Choose the strongest “so what” to complete: “Wordsworth calls the daffodils ‘a crowd’ and ‘a host,’…”","options":[{"t":"“…and daffodils are yellow.”","why":"An irrelevant detail.","_n":"585d7","_k":"87b0b8aa"},{"t":"“…in lines 3 and 4.”","why":"That’s a location, not significance.","_n":"595a7","_k":"342acf0a"},{"t":"“…which reframes the speaker’s loneliness as sudden company, suggesting nature can answer isolation.”","why":"It says what the words do and why it matters.","_n":"5a597","_k":"c69188ed"},{"t":"“…which proves Wordsworth had no friends.”","why":"Unsupported biography. Can you point to the words that prove this? If not, narrow the claim to what the text supports.","_n":"5b5c7","_k":"95a6877b"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"An original public-service poster reads: “Every year, Lake Huron returns what we throw in. Last summer it returned 4000 bottles.” Which sentence is analysis rather than paraphrase?","options":[{"t":"“The poster says 4000 bottles washed up last summer.”","why":"That’s paraphrase.","_n":"5c5b7","_k":"27dad4c7"},{"t":"“I think littering is bad.”","why":"A personal response.","_n":"5d5e7","_k":"9c3da4ef"},{"t":"“By making the lake the one who ‘returns’ our garbage, the poster personifies it as a patient neighbour handing back what we dropped, shaming readers into responsibility.”","why":"It names the craft (personification), says what it does and why it matters.","_n":"5e5d7","_k":"e4d8f318"},{"t":"“The poster is about pollution.”","why":"Vague, and a topic, not analysis.","_n":"5f607","_k":"37b82011"}]},"b":{"prompt":"An original song lyric: “We built this town on Friday nights, / now Fridays build the town in me.” Which sentence is analysis?","options":[{"t":"“The singer used to go out on Fridays.”","why":"That’s paraphrase. This retells \u003cem>what\u003c/em> happens. Analysis explains \u003cem>how\u003c/em> the words make it mean something, and \u003cem>why\u003c/em> that matters.","_n":"5g5f7","_k":"b4de54f7"},{"t":"“The reversal in the second line (the town once built by Fridays now ‘build[s]’ the singer) uses chiasmus to show how a place we shape ends up shaping us.”","why":"It names the craft (chiasmus, the reversed order), says what it does and why it matters.","_n":"5h527","_k":"a06a7213"},{"t":"“This song makes me nostalgic.”","why":"A personal response. Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"5i517","_k":"bd2383ea"},{"t":"“The song is about a town.”","why":"Vague, and a topic, not analysis.","_n":"5je5e","_k":"22f3f873"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best analytical thesis about “Ozymandias”?","options":[{"t":"“‘Ozymandias’ is a poem by Shelley about a statue.”","why":"A topic, not a thesis.","_n":"5ke4e","_k":"ec24fd37"},{"t":"“Shelley uses many literary devices in ‘Ozymandias.’”","why":"Which, and to what end?","_n":"5le7e","_k":"09b4cb4b"},{"t":"“In ‘Ozymandias,’ Shelley uses a nested frame and a final image of empty desert to undercut a tyrant’s boast, arguing that art and time judge power more lastingly than power judges itself.”","why":"It names the text, the author, the craft and an arguable claim.","_n":"5me6e","_k":"a6c7a7c4"},{"t":"“‘Ozymandias’ proves that every king in history was cruel.”","why":"Overreach.","_n":"5ne1e","_k":"045e06cb"}]},"b":{"prompt":"Which is the best analytical thesis about “I wandered lonely as a cloud” (stanza 1)?","options":[{"t":"“Wordsworth’s poem is about daffodils.”","why":"A topic, not a thesis.","_n":"5oe0e","_k":"2fc3ce87"},{"t":"“Wordsworth uses personification and similes.”","why":"Which, and to what end?","_n":"5pe3e","_k":"43851873"},{"t":"“Wordsworth was lonely because he lived in the country.”","why":"Overreach: unsupported biography.","_n":"5qe2e","_k":"5c84ade7"},{"t":"“In the opening stanza, Wordsworth shifts from the image of a solitary cloud to a ‘crowd’ of dancing daffodils, transforming loneliness into communion and suggesting that attention to nature can renew the self.”","why":"It names the text, the craft and an arguable claim about why it matters.","_n":"5rede","_k":"423ace81"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which sentence integrates and cites a quotation from “Ozymandias” best?","options":[{"t":"The sculptor captured the king’s “sneer of cold command” (Shelley, line 5), so the statue preserves cruelty rather than glory.","why":"A smooth lead-in, an exact quotation, a correct citation and an explanation.","_n":"5sece","_k":"2d9906ab"},{"t":"The sculptor captured the king’s sneer of cold command (Shelley, line 5).","why":"Quoted words need quotation marks.","_n":"5tdfe","_k":"643bf415"},{"t":"The sculptor captured the king’s “sneer of cold command” (Shelley, page 5).","why":"Poems are cited by line, not page.","_n":"5ue0e","_k":"7f06b5ad"},{"t":"“Sneer of cold command.” This shows the king was cruel.","why":"A plop quote with no lead-in.","_n":"5vdde","_k":"1c6d76bd"}]},"b":{"prompt":"Which sentence integrates and cites a quotation from Wordsworth best?","options":[{"t":"The flowers seem to celebrate, “Fluttering and dancing in the breeze” (Wordsworth 1807).","why":"Cite the line, not the year.","_n":"5wdee","_k":"fdd16dbd"},{"t":"The flowers seem to celebrate, Fluttering and dancing in the breeze (Wordsworth, line 6).","why":"Missing quotation marks.","_n":"5xe3e","_k":"22bb1f0b"},{"t":"“Fluttering and dancing in the breeze.” The flowers are happy.","why":"A plop quote with no lead-in. Every quotation needs a doorway in (a signal phrase) and a room after it (your explanation).","_n":"5ye4e","_k":"f55e23dd"},{"t":"The flowers seem to celebrate, “Fluttering and dancing in the breeze” (Wordsworth, line 6), as if the speaker has stumbled into a party.","why":"A smooth lead-in, an exact quotation, a correct citation and an explanation.","_n":"5ze1e","_k":"3ca286e4"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"A described film scene (original): “The camera holds on a birthday cake for ten full seconds while, out of focus behind it, two parents argue silently.” Which is the most useful observation?","options":[{"t":"“Birthdays are stressful.”","why":"A generalization, not an observation.","_n":"60e2e","_k":"1bb7030f"},{"t":"“I didn’t like this scene.”","why":"A personal response. Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"61e7e","_k":"4706488f"},{"t":"“The cake stays in sharp focus while the arguing parents are blurred in the background.”","why":"It’s specific and points to a craft choice (focus), ready to interpret.","_n":"62e8e","_k":"efd5cbd8"},{"t":"“The scene is sad.”","why":"That’s an interpretation, and vague.","_n":"6379e","_k":"b0a07999"}]},"b":{"prompt":"A described school mural (original): “A huge sun fills the left side; on the right, tiny students carry lanterns into a dark forest.” Which is the most useful observation?","options":[{"t":"“Art is important in schools.”","why":"A generalization, not an observation.","_n":"6478e","_k":"4080aa27"},{"t":"“I would have used more colours.”","why":"A personal response. Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"6577e","_k":"18509e65"},{"t":"“The mural is hopeful.”","why":"That’s interpretation.","_n":"6676e","_k":"a17e152f"},{"t":"“The sun is enormous and alone on the left, while the students are small and carry their own small lights on the right.”","why":"It’s specific and points to craft choices (size and placement), ready to interpret.","_n":"6775e","_k":"b084b1a6"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"An original ad slogan: “Fresh. Local. Yours.” Which sentence analyses it rather than paraphrasing it?","options":[{"t":"“I would buy this.”","why":"A personal response. Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"6874e","_k":"8f7f06c7"},{"t":"“The slogan is short.”","why":"That’s an observation without a claim.","_n":"6973e","_k":"d184089d"},{"t":"“The slogan says the food is fresh, local and for you.”","why":"That’s paraphrase. This retells \u003cem>what\u003c/em> happens. Analysis explains \u003cem>how\u003c/em> the words make it mean something, and \u003cem>why\u003c/em> that matters.","_n":"6a72e","_k":"3ac83ec0"},{"t":"“The three one-word sentences slow the reader down and end on ‘Yours,’ so the product feels already owned, nudging the reader toward buying it.”","why":"It names the craft (three one-word sentences ending on “Yours”), says what it does and why it matters.","_n":"6b71e","_k":"e0ea3ed7"}]},"b":{"prompt":"A fictional headline: “City Hall Finally Admits Pothole Problem.” Which sentence analyses it?","options":[{"t":"“The headline says City Hall talked about potholes.”","why":"That’s paraphrase. This retells \u003cem>what\u003c/em> happens. Analysis explains \u003cem>how\u003c/em> the words make it mean something, and \u003cem>why\u003c/em> that matters.","_n":"6c70e","_k":"1bf0485c"},{"t":"“The headline is about roads.”","why":"Vague, and a topic, not analysis. Pick a verb that says \u003cem>how\u003c/em>: undercuts, juxtaposes, reframes, intensifies, implies.","_n":"6d73e","_k":"fadd1f8c"},{"t":"“The word ‘finally’ implies the city delayed and ‘admits’ frames the problem as a confession, so the headline nudges readers to see officials as evasive.”","why":"It points to exact words, says what they imply and why it matters.","_n":"6e74e","_k":"3724dd49"},{"t":"“I hate potholes.”","why":"A personal response. Your response matters, but interpretation says what the \u003cem>text\u003c/em> suggests, with evidence.","_n":"6f75e","_k":"8367a50c"}]}}]},"task":{"title":"Climb the ladder","summary":"Climb the ladder","statement":"\u003cp>Choose one unseen poem and write a four-rung mini-analysis (one sentence per rung) plus a “so what” sentence. Many good answers are possible; make yours precise.\u003c/p>\u003cp class=\"tiny muted\">This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class=\"alg pt-rubric\">\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"topic-tbl\">\u003cthead>\u003ctr>\u003cth scope=\"col\">Criterion\u003c/th>\u003cth scope=\"col\">Level 1\u003c/th>\u003cth scope=\"col\">Level 2\u003c/th>\u003cth scope=\"col\">Level 3\u003c/th>\u003cth scope=\"col\">Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge: accurate paraphrase and terms\u003c/td>\u003ctd>The paraphrase misreads; terms are misused\u003c/td>\u003ctd>Mostly accurate; some term errors\u003c/td>\u003ctd>Accurate paraphrase; terms used correctly\u003c/td>\u003ctd>Precise paraphrase; terms used with nuance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking: interpretation and analysis\u003c/td>\u003ctd>Unsupported or summary\u003c/td>\u003ctd>Supported but thin\u003c/td>\u003ctd>Clear craft → meaning link\u003c/td>\u003ctd>Insightful craft → meaning → significance\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication: integration and clarity\u003c/td>\u003ctd>Plop quotes; unclear\u003c/td>\u003ctd>Some integration\u003c/td>\u003ctd>Smooth integration, correct citation\u003c/td>\u003ctd>Elegant, economical, precisely cited\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application: the “so what”\u003c/td>\u003ctd>Missing or generic\u003c/td>\u003ctd>Stated, but obvious\u003c/td>\u003ctd>Explains significance\u003c/td>\u003ctd>Opens a larger idea the poem earns\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["All five rungs written","Your observation quotes the poem exactly","Your analysis names a craft choice","Your analysis uses a strong verb","Your analysis is cited","Your “so what” explains significance","Length"],"tips":["Fill every rung; each one earns the next.","Copy 1–8 words exactly from the poem and put them in quotation marks.","Name the craft: alliteration, juxtaposition, personification, simile, imagery, diction, structure…","Swap “shows” for a verb that says how: undercuts, reframes, intensifies…","Add a line citation, like (Frost, line 6).","Say why it matters: “This suggests…” / “This matters because…”","Aim for 80–180 words in total: concise, but complete."],"explainPrompt":"Craft statement: Which rung was hardest to write, and what did you change to climb it? Quote one of your own sentences before and after.","explainLabel":"Craft statement","vocab":"Use paraphrase, observation, interpretation, analysis and significance.","checkLabel":"Check my climb","success":"Your climb has all its parts. Here are three model climbs, on different poems, taking different approaches.","slots":[{"id":"para","label":"Paraphrase","help":"What the poem says, in plain words."},{"id":"obs","label":"Observation","help":"A specific detail, with 1–8 words quoted exactly."},{"id":"int","label":"Interpretation","help":"What that detail suggests."},{"id":"ana","label":"Analysis","help":"How a named craft choice creates the meaning (a strong verb), with a line citation."},{"id":"sw","label":"So what?","help":"Why it matters: “This suggests…” / “This matters because…”"}],"significance":["suggests","implies","reveals","matters because","which means","so that","warns","argues"],"poems":[{"id":"frost","author":"Frost","title":"Nothing Gold Can Stay","full":"Robert Frost, “Nothing Gold Can Stay”","lines":["Nature’s first green is gold,","Her hardest hue to hold.","Her early leaf’s a flower;","But only so an hour.","Then leaf subsides to leaf.","So Eden sank to grief,","So dawn goes down to day.","Nothing gold can stay."],"cite":"Robert Frost, “Nothing Gold Can Stay” (1923). Public domain in Canada."},{"id":"eagle","author":"Tennyson","title":"The Eagle","full":"Alfred, Lord Tennyson, “The Eagle”","lines":["He clasps the crag with crooked hands;","Close to the sun in lonely lands,","Ring’d with the azure world, he stands.","","The wrinkled sea beneath him crawls;","He watches from his mountain walls,","And like a thunderbolt he falls."],"cite":"Alfred, Lord Tennyson, “The Eagle” (1851). Public domain."},{"id":"words","author":"Wordsworth","title":"I wandered lonely as a cloud","full":"William Wordsworth, “I wandered lonely as a cloud” (stanza 1)","lines":["I wandered lonely as a cloud","That floats on high o’er vales and hills,","When all at once I saw a crowd,","A host, of golden daffodils;","Beside the lake, beneath the trees,","Fluttering and dancing in the breeze."],"cite":"William Wordsworth, “I wandered lonely as a cloud” (1815 text), stanza 1. Public domain."}],"models":[{"title":"Model 1: Frost (focus: pattern and alliteration)","poem":"frost","parts":["In spring the first buds look golden, but that colour fades quickly into green, just as the first light of dawn becomes ordinary day.","Frost begins two lines in a row with “So”: “So Eden sank to grief, / So dawn goes down to day” (lines 6–7).","The poem suggests that every perfect beginning, in nature or in human life, is brief.","By setting the fall of Eden in the same short, alliterative pattern as a sunrise, Frost juxtaposes the cosmic and the everyday, implying that loss is built into the world rather than an accident (Frost, line 6).","This matters because it turns a small nature poem into a quiet argument for treasuring beauty while it lasts."]},{"title":"Model 2: Tennyson (focus: personification and structure)","poem":"eagle","parts":["An eagle grips a cliff high above the sea, watches from its height, and then suddenly dives.","Five lines show the bird almost still, and only the last word, “falls”, moves it.","The poem presents the eagle as a lonely king whose power is both majestic and dangerous.","Tennyson’s personification of the “crooked hands” and the “wrinkled sea” that crawls makes the bird godlike and the world small, so the final simile intensifies the dive into a strike from the heavens (lines 1–6).","This suggests that true power is felt most in the instant it is released."]},{"title":"Model 3: Wordsworth (focus: diction and reframing)","poem":"words","parts":["Walking alone, the speaker suddenly sees a huge group of golden daffodils moving in the wind beside a lake.","Wordsworth calls the flowers “A host, of golden daffodils” (line 4).","The poem implies that nature can ease loneliness by offering company the speaker did not expect.","The shift from the single “cloud” to “a crowd” and “a host” reframes isolation as belonging, and the personification in “dancing” gives the flowers a sociable energy (lines 1–6).","This suggests the poem is less about flowers than about how attention can turn solitude into joy."]}]},"cards":[["Paraphrase","What the text says, in plain words: “A broken stone face lies half buried” for “Half sunk a shattered visage lies” (Shelley)."],["Observation","A specific, quotable feature: the boast “Look on my Works” sits just before “Nothing beside remains.”"],["Interpretation","What a detail suggests: “The king’s power did not last.”"],["Analysis","How craft creates meaning, and why it matters: the placement of the boast turns it into a warning about power."],["“So what?”","The significance test every observation must pass."],["Personal response","Your reaction (“I found it eerie”): valuable, but not interpretation."],["Irony","Words whose meaning reverses in context: “Look on my Works, ye Mighty, and despair!”"],["Juxtaposition","Placing two things side by side for contrast: the boast beside “Nothing beside remains.”"],["Frame narrative","A story told inside another telling: “I met a traveller … Who said…” (Shelley)."],["Strong analysis verb","A verb that says how: undercuts, reframes, intensifies, juxtaposes, implies."],["Plop quote","A quotation dropped in without a lead-in or explanation. Fix it: lead in, quote, cite, explain."],["Overreach","A claim bigger than the evidence: “This proves Shelley hated all kings.”"]]}};</script>
