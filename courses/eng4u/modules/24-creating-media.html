.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--an-sound:#A84C05;--an-image:#0E7C7B;--an-figure:#7A3DB8;--an-syntax:#2343C4;--an-diction:#6B5A1E;--an-theme:#B0286F;
--an-sound-soft:rgba(168,76,5,.13);--an-image-soft:rgba(14,124,123,.13);--an-figure-soft:rgba(122,61,184,.12);--an-syntax-soft:rgba(35,67,196,.11);
--an-diction-soft:rgba(107,90,30,.14);--an-theme-soft:rgba(176,40,111,.11);
--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}
:root[data-theme="dark"]{--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
.an-sound{--an-c:var(--an-sound);--an-c-soft:var(--an-sound-soft)}.an-image{--an-c:var(--an-image);--an-c-soft:var(--an-image-soft)}
.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}
.an-tag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);font-style:normal;letter-spacing:.01em;color:var(--an-c,var(--ink-2));background:var(--sheet);
border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}
.an-chip{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--an-c,var(--rule));background:var(--sheet);color:var(--ink);border-radius:999px;
padding:.25em .8em;font-size:.92rem;min-height:34px}
.an-chip[aria-pressed="true"]{background:var(--an-c-soft);font-weight:700}
.an-chip[aria-pressed="true"]::after{content:"on";font-size:.72rem;font-weight:700;color:var(--an-c)}
.an-dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--an-c,var(--ink-2));flex:0 0 auto}
.an-note{border-left:4px solid var(--an-c,var(--rule));background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;margin:0 0 6px;font-size:.92rem;max-width:none}
.eng-margin{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.eng-margin > *{min-width:0}
@media (max-width:820px){ .eng-margin{grid-template-columns:minmax(0,1fr)} }
@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}
ol.eng-poem li{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline}
ol.eng-poem li.eng-gap{height:.6em}
.eng-ln{font:400 .75rem var(--font-ui);color:var(--ink-2);text-align:right;padding-right:.9em;user-select:none}
.eng-prose p{font:400 1.08rem/1.65 var(--font-math);max-width:70ch}
.eng-prose .eng-ln{display:inline-block;min-width:3.2em;padding-right:.6em;text-align:left}
.eng-cite{font-size:.85rem;color:var(--ink-2);margin:4px 0 0}
.eng-toks{display:grid;gap:6px}
.eng-tl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.eng-tok{border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:.08em .28em;min-height:34px;min-width:24px;
font:400 1.22rem/1.3 var(--font-math)}
.eng-tok:not(:disabled):hover{border-color:var(--rule)}
.eng-tok.an{background:var(--an-c-soft)}
.eng-tok[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.eng-tok.eng-br{font:700 .9rem var(--font-ui);color:var(--ink-2);border:1.5px dashed var(--rule)}
.eng-tok.speaking,.eng-w.speaking{outline:2px solid var(--ink);outline-offset:1px;border-radius:4px}
.eng-w{transition:opacity .25s,color .25s}
.sc-syl{position:relative;display:inline-block;padding-top:.7em}
.sc-syl::before{position:absolute;left:0;right:0;top:0;text-align:center;font:700 .85em/1 var(--font-ui)}
.sc-stress{color:var(--sc-stress);font-weight:600}.sc-stress::before{content:"´"}
.sc-slack{color:var(--sc-slack)}.sc-slack::before{content:"˘"}
/* ENG4U 24 Creating an Original Media Text: hero, E14 media studio (brief, forms, poster grid, podcast blocks, storyboard
   panels, social posts, readouts), Part 3 test, task extras, E16 book and preface. Tokens only. */
/* radioGroup (from ENG4U 09) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.steal-line{font:400 1.25rem/1.45 var(--font-math);margin:0 0 2px}
.art-samples{margin:0 0 14px}.art-samples .an-note{margin-bottom:6px}
.cm-h{font-size:1.02rem;margin:14px 0 6px}
.cm-note{font-size:.92rem;border-left:3px solid var(--pen);padding-left:10px;color:var(--ink-2);margin:4px 0 10px}
.cm-ws-q{font-style:italic}

/* hero */
.cm-hero{display:grid;gap:8px}
.cm-hq{margin:0;font:400 1.12rem/1.55 var(--font-math);color:var(--ink)}
.cm-w{transition:color .3s,background-color .3s;border-radius:3px}
.cm-hero.p-words .cm-w{color:var(--ink-2)}
.cm-hero.p-words .cm-w.lit{color:var(--ink)}
.cm-w.speaking{background:var(--hi-soft)}
.cm-hero.p-lift .cm-lw,.cm-hero.p-tiles .cm-lw{background:var(--hi-soft);color:var(--ink)}
.cm-stage{position:relative;min-height:150px;display:grid;align-items:center}
.cm-tiles,.cm-media{grid-area:1/1}
.cm-tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;opacity:0;transition:opacity .4s}
.cm-tile{background:var(--sheet);border:1.5px solid var(--ink);border-radius:8px;padding:.35em .8em;font:700 1rem var(--font-ui);color:var(--ink);transition:transform .7s ease}
.cm-hero.p-tiles .cm-tiles{opacity:1}
.cm-media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:center}
.cm-m{opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.cm-hero.p-poster .cm-mp,.cm-hero.p-strip .cm-ms,.cm-hero.p-wave .cm-mw{opacity:1;transform:none}
.cm-hero.p-strip .cm-mp,.cm-hero.p-wave .cm-mp,.cm-hero.p-wave .cm-ms{opacity:.45;transform:none}
.cm-hero.p-final .cm-m{opacity:1;transform:none}
.cm-mp{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:4px;aspect-ratio:3/4;border:1.5px solid var(--ink);border-radius:6px;padding:6px;background:var(--sheet)}
.cm-mp-h{font:700 .78rem var(--font-ui);background:var(--ink);color:var(--sheet);border-radius:3px;padding:.1em .4em;width:100%;text-align:center}
.cm-mp-i{width:44%;height:auto;align-self:center}
.cm-mp-c{font:700 .66rem var(--font-ui);border:1.5px solid var(--pen);color:var(--ink);border-radius:3px;padding:.1em .3em;text-align:center}
.cm-ms{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.cm-sf .cm-sk{display:block;width:100%;height:auto}
.cm-mw svg{width:100%;height:auto;display:block}
.cm-wb rect{fill:var(--ink-2)}
.cm-wo{stroke:var(--pen);stroke-width:3;fill:none}
.cm-wt{font:700 11px var(--font-ui);fill:var(--pen)}
.cm-hcap{font-weight:700;margin:4px 0 0;opacity:0;transition:opacity .5s}
.cm-hero.p-final .cm-hcap{opacity:1}
.cm-hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* icons and storyboard sketches */
.cm-ico{width:1.6em;height:1.6em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cm-sk{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;background:var(--paper)}
.cm-sk-fr{stroke:var(--rule)}
.cm-sk-l{stroke:var(--ink-2)}
.cm-sk-f{fill:var(--ink)}
.cm-sk-btn{stroke:var(--pen)}
.cm-sk-t{fill:var(--ink);stroke:none;font:700 12px var(--font-ui);text-anchor:middle}
.cm-sk-tag{fill:var(--pen);stroke:none;font:700 8px var(--font-ui)}

/* studio layout */
.cm-studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:4px 26px;align-items:start}
.cm-demo,.cm-studio > .banner{grid-column:1/-1}
.cm-main{min-width:0}
.cm-side{position:sticky;top:calc(var(--mv-top,0px) + 120px);min-width:0;border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;background:var(--sheet)}
.cm-side .cm-h{margin-top:2px}
.cm-sec{border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:6px;min-width:0}
.cm-demo{background:var(--info-bg);border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.cm-demo p{margin:0;flex:1 1 280px}
.cm-row{margin:4px 0}
.cm-persona{border:1.5px solid var(--rule);border-radius:10px;padding:6px 12px 2px;margin:8px 0}
.cm-persona legend{font-weight:700;padding:0 4px}
.cm-forms{display:grid;gap:6px}
.cm-form{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.45em .8em;min-height:42px}
.cm-form.on{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--pen);font-weight:700}
.cm-top{font:700 .72rem var(--font-ui);background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:.05em .5em;margin-left:4px;white-space:nowrap}
.cm-meter{height:10px;border-radius:5px;background:var(--paper);border:1px solid var(--rule);overflow:hidden}
.cm-meter i{display:block;height:100%;background:var(--pen);transition:width .3s}
.cm-fs{font-size:.85rem;color:var(--ink-2);white-space:nowrap}
.cm-whyw{margin-top:8px}
.cm-km{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:700;margin:4px 10px 4px 0}
.cm-km input{width:18px;height:18px}
.cm-ta{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.45em .65em;min-height:44px;font:inherit}
.cm-read dd ol.cm-hl{list-style:none;margin:0;padding:0}
.cm-aha{font-weight:700;border-left:3px solid var(--pen);padding-left:10px;margin:10px 0 0}
.cm-read.cm-flash{animation:cmFlash .9s ease}
@keyframes cmFlash{0%{background:var(--hi-soft)}100%{background:transparent}}
.cm-conv{border-top:1px solid var(--rule);margin-top:8px;padding-top:8px}
.cm-conv-h{margin:0 0 4px}

/* poster */
.cm-pb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.cm-pgw{min-width:0}
.cm-poster{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);aspect-ratio:3/4;border:2px solid var(--ink);border-radius:6px;background:var(--sheet);max-width:360px}
.cm-cell{border:1px dashed var(--rule);background:transparent;color:var(--ink-2);padding:0;min-height:44px;position:relative;z-index:1}
.cm-cell:focus-visible{outline:3px solid var(--pen);outline-offset:-3px;z-index:4}
.cm-cn{position:absolute;left:4px;top:2px;font:700 .7rem var(--font-ui);color:var(--ink-2)}
.cm-el{z-index:2;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin:4px;padding:2px 4px;border-radius:4px;overflow:hidden;overflow-wrap:anywhere;line-height:1.15;color:var(--ink)}
.cm-el.sel{box-shadow:0 0 0 2px var(--pen)}
.cm-el.sS{font-size:.72rem}.cm-el.sM{font-size:.92rem}.cm-el.sL{font-size:1.25rem}
.cm-el.chigh{font-weight:800}
.cm-el.clow{color:var(--ink-2);font-weight:400}
.cm-e-headline.chigh{background:var(--ink);color:var(--sheet)}
.cm-e-cta{border:2px solid var(--pen)}
.cm-e-body{align-self:end;justify-content:flex-end}
.cm-e-logo{font-style:italic}
.cm-e-visual .cm-ico{width:2.4em;height:2.4em}
.cm-e-visual.sL .cm-ico{width:3em;height:3em}
.cm-vt{font-size:.7rem;font-weight:400}
.cm-ph{opacity:.75;font-weight:700}
.cm-photo{max-width:100%;max-height:100%;object-fit:cover;border-radius:3px}
.cm-eye{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.cm-eye polyline{fill:none;stroke:var(--pen);stroke-width:3;stroke-dasharray:4 3;vector-effect:non-scaling-stroke;opacity:.75}
.cm-eye.z polyline{stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset 1.3s ease;opacity:.9}
.cm-drawn .cm-eye polyline{stroke-dasharray:100;stroke-dashoffset:100;transition:none}
.cm-pe{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;margin-top:6px}
.cm-pe-h{margin:0 0 6px}
.cm-icons{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.cm-icb{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);min-width:44px;min-height:44px;display:grid;place-items:center}
.cm-icb[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.cm-photo-in input[type=file]{max-width:100%}

/* podcast */
.cm-pod{display:grid;gap:6px}
.cm-blk{border:1.5px solid var(--rule);border-radius:8px;padding:4px 10px 6px;background:var(--sheet)}
.cm-blk summary{font-weight:700;cursor:pointer;padding:4px 0}

/* storyboard */
.cm-panels{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cm-panel{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--sheet)}
.cm-panel.hl{border-color:var(--pen);box-shadow:inset 4px 0 0 var(--pen)}
.cm-ph-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.cm-pbtns{display:flex;flex-wrap:wrap;gap:6px}
.cm-pbody{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px;align-items:start}
.cm-skw .cm-sk{width:100%;height:auto;display:block;border-radius:4px}
.cm-pf{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:flex-end}
.cm-pf label{display:flex;flex-direction:column;gap:2px;font-size:.85rem;font-weight:700}
.cm-pf label.cm-wide{flex:1 1 100%}
.cm-pf label.cm-km{flex-direction:row}
.cm-pf select,.cm-num{border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:.3em .4em;min-height:38px;font:inherit;font-weight:400}
.cm-num{width:5em}
.cm-margin{margin:8px 0 0;font-weight:700;color:var(--ink);border-left:3px solid var(--pen);padding-left:10px}

/* social */
.cm-posts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cm-post{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--sheet);min-width:0}
.cm-post h5{margin:2px 0 6px;font-size:1rem}
.cm-post .jq{margin-bottom:8px}

/* Part 3 */
.cm-st{border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:12px}
.cm-qk{margin:6px 0 10px}
.cm-flag{margin:4px 0 0;color:var(--ink);background:var(--bad-bg);border-radius:6px;padding:6px 10px;font-size:.92rem}
.cm-self{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;margin:6px 0 10px}
.cm-self input{margin-top:3px;width:18px;height:18px;flex:none}
.cm-testers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cm-tester{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--sheet);min-width:0}
.cm-th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}
.cm-tn{display:flex;flex-direction:column;font-size:.82rem;font-weight:700;flex:1 1 140px}
.cm-match{margin:4px 0 0;font-weight:700}
.cm-yes{color:var(--green)}.cm-no{color:var(--red)}
.cm-tally{margin-top:10px;background:var(--paper);border-radius:8px;padding:8px 12px}
.cm-tally p{margin:0 0 4px}
.cm-rev{border:1.5px solid var(--rule);border-radius:10px;padding:6px 12px;margin:8px 0}
.cm-rev h5{margin:4px 0 6px}
.cm-rev select,#cm-s3 select{max-width:100%;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:.35em .5em;min-height:40px;font:inherit}
.cm-craft h5{margin:12px 0 6px}
.cm-cm{border-left:3px solid var(--pen);padding-left:10px;margin:8px 0}
.cm-cm-q{margin:0 0 6px}
.cm-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cm-cmp > div{background:var(--paper);border-radius:6px;padding:6px 10px;min-width:0;overflow-wrap:anywhere}
.cm-cmp p{margin:0 0 4px}
.cm-cmp del{color:var(--red)}.cm-cmp ins{color:var(--green);text-decoration:underline}
.cm-retest{margin-top:10px}

/* task */
#task-sheet .design{grid-template-columns:minmax(0,1fr)}
.cm-asset{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;margin:0 0 8px}
.cm-glance{margin:0;padding-left:1.1em}
.cm-glance li{margin:0 0 4px}
.cm-model{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.cm-model h5{font-size:1rem;margin:4px 0 6px}
.cm-model-pod{margin:0 0 8px;border-left:3px solid var(--pen);padding-left:12px}
.cm-model-pod p{margin:0 0 4px}

/* Reflect: book and preface */
.cm-few{background:var(--info-bg);border-radius:8px;padding:8px 12px}
.cm-book{border:1.5px solid var(--rule);border-radius:4px 12px 12px 4px;box-shadow:inset 6px 0 0 var(--rule);background:var(--paper);padding:14px 18px 10px 22px;margin:10px 0 14px;max-height:520px;overflow:auto}
.cm-book.cm-open{animation:cmOpen .6s ease}
@keyframes cmOpen{from{opacity:0;transform:perspective(900px) rotateY(-8deg)}to{opacity:1;transform:none}}
.cm-bk-h{border-bottom:1px solid var(--rule);margin-bottom:8px}
.cm-bk-t{font:700 1.25rem var(--font-math);margin:0}
.cm-bk-s h5{font-size:1rem;margin:12px 0 6px;color:var(--ink)}
.cm-bk-pref p{font-style:italic}
.cm-bk-e{border-left:3px solid var(--rule);padding-left:10px;margin:0 0 10px}
.cm-bk-e p{margin:0 0 3px}
.cm-bk-cp{margin:0;padding-left:1.1em}
.cm-pref ul{margin:0 0 8px}
.cm-checks{list-style:none;margin:6px 0 0;padding:0}
.cm-checks li{margin:2px 0;color:var(--ink-2)}
.cm-checks li.ok{color:var(--ink);font-weight:700}
.cm-closing{font:700 1.08rem var(--font-math);margin:12px 0 0}

@media (prefers-reduced-motion: reduce){
  .cm-tile,.cm-m,.cm-tiles,.cm-hcap,.cm-w,.cm-meter i,.cm-eye.z polyline{transition:none}
  .cm-book.cm-open,.cm-read.cm-flash{animation:none}
}
@media (max-width:900px){
  .cm-studio{grid-template-columns:minmax(0,1fr)}
  .cm-side{position:static}
  .cm-posts{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .cm-pb{grid-template-columns:minmax(0,1fr)}
  .cm-poster{max-width:none}
  .cm-pbody{grid-template-columns:minmax(0,1fr)}
  .cm-skw{max-width:220px}
  .cm-form{grid-template-columns:minmax(0,1fr) 60px auto}
  .cm-cmp{grid-template-columns:minmax(0,1fr)}
  .cm-media{gap:6px}
}
