2.33). An actor who stresses “Romeo” makes the line mean…","options":[{"t":"“Romeo is late.”","why":"Unsupported.","_n":"3oca9","_k":"c8b4a52a"},{"t":"“She’s calling loudly so he’ll hear.”","why":"Volume, not meaning; and she doesn’t know he’s there.","_n":"3pd19","_k":"d900423c"},{"t":"“Where are you, Romeo?”","why":"A common misreading of “wherefore”.","_n":"3qd09","_k":"8d322d4c"},{"t":"“Why must you be a Romeo, a Montague?” The name, not the person, is the problem","why":"“Wherefore” means “why”.","_n":"3rcf9","_k":"2fa33a77"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"A production cuts Fortinbras entirely. Which conclusion is best supported?","options":[{"t":"It is no longer \u003cem>Hamlet\u003c/em>","why":"Overstated; most of the play remains. Changing the setting isn’t failure. Ask what the change makes us see.","_n":"3sce9","_k":"836c0a32"},{"t":"It changes nothing important","why":"It changes the ending’s meaning.","_n":"3td59","_k":"c69e3dfc"},{"t":"It makes Hamlet the villain","why":"Unsupported.","_n":"3ud49","_k":"a80234fc"},{"t":"It narrows the play to a family tragedy, losing the political frame in which a foreign prince inherits a collapsed Denmark","why":"Cuts are arguments too.","_n":"3v4ba","_k":"b4fb0fe2"}]},"b":{"prompt":"A production sets \u003cem>Hamlet\u003c/em> in a surveillance state full of security cameras. What does this choice emphasize?","options":[{"t":"The play’s many scenes of spying (Polonius, Claudius, Rosencrantz and Guildenstern) as a whole system of watching","why":"The setting turns many scenes into one argument.","_n":"3w4ca","_k":"32c11d9a"},{"t":"That the play is a comedy","why":"Cameras don’t make it comic.","_n":"3x49a","_k":"ba39c8a4"},{"t":"That Hamlet is a technology expert","why":"Unsupported.","_n":"3y4aa","_k":"d6e77349"},{"t":"Nothing; settings are decoration","why":"A corporation, a surveillance state, a savannah: each setting makes an argument about power.","_n":"3z4fa","_k":"2536f1bd"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best director’s justification?","options":[{"t":"“Hamlet should notice the spies at ‘Where’s your father?’ (\u003ci>Hamlet\u003c/i> 3.1.132–133): the question’s abruptness suggests a discovery, and Ophelia’s lie then explains his fury.”","why":"A choice, a quotation, a citation and a reason from the text.","_n":"4050a","_k":"01ffd2ac"},{"t":"“Hamlet notices the spies because that’s how it’s usually done.”","why":"Tradition isn’t evidence.","_n":"414da","_k":"3f45c7e5"},{"t":"“I think it’s more exciting.”","why":"A preference, not a reason from the text.","_n":"424ea","_k":"6c70aa8b"},{"t":"“Shakespeare’s stage direction says so.”","why":"Most of those directions were added by editors. The early texts give almost none.","_n":"4353a","_k":"7c36fdd7"}]},"b":{"prompt":"Which is the best director’s justification for an instant thrust in 3.4?","options":[{"t":"“An instant thrust is more dramatic.”","why":"No textual reason.","_n":"4454a","_k":"72f9fa8f"},{"t":"“Every production does it fast.”","why":"Tradition, not evidence.","_n":"4551a","_k":"411eee07"},{"t":"“Hamlet should strike without pausing: ‘How now! a rat? Dead, for a ducat, dead!’ (\u003ci>Hamlet\u003c/i> 3.4.23) is quick and broken, which suggests impulse.”","why":"The rhythm of the line is the evidence.","_n":"4650a","_k":"1c207fa6"},{"t":"“The stage direction says ‘stabs quickly’.”","why":"Most of those directions were added by editors. The early texts give almost none.","_n":"4753a","_k":"09cd8203"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which sentence best \u003cstrong>evaluates\u003c/strong> an adaptation?","options":[{"t":"“The film is good because I liked it.”","why":"Taste, not evaluation.","_n":"4852a","_k":"62765481"},{"t":"“By moving \u003cem>Hamlet\u003c/em> into a corporate tower, the film turns ‘Denmark’s a prison.’ into a critique of corporate power, though it loses the play’s sense of a sacred order.”","why":"It names the change, what it reveals and what it costs.","_n":"494da","_k":"24f8795a"},{"t":"“The film is bad because it’s modern.”","why":"Changing the setting isn’t failure. Ask what the change makes us see.","_n":"4a4ca","_k":"98ca3e52"},{"t":"“The film changes the setting to New York.”","why":"A description, not an evaluation.","_n":"4b4fa","_k":"9f377e08"}]},"b":{"prompt":"Which sentence best \u003cstrong>evaluates\u003c/strong> an animated retelling?","options":[{"t":"“\u003cem>The Lion King\u003c/em> keeps the plot of a murdered king and a returning son but drops Hamlet’s doubt, so it becomes a story of destiny rather than conscience.”","why":"It names what’s kept, what’s changed and what that reveals.","_n":"4c4ea","_k":"0354f969"},{"t":"“It is better than \u003cem>Hamlet\u003c/em> because it’s shorter.”","why":"Length isn’t quality.","_n":"4d59a","_k":"73b30096"},{"t":"“It isn’t \u003cem>Hamlet\u003c/em> because it has lions.”","why":"Changing the setting isn’t failure. Ask what the change makes us see.","_n":"4e58a","_k":"acbda782"},{"t":"“It is a cartoon about a lion.”","why":"A description.","_n":"4fdfa","_k":"8293cd0c"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Your school stage has no balcony and no curtain. How can you stage 3.1 so the audience sees the spies but Hamlet doesn’t?","options":[{"t":"Have the spies stand beside Hamlet","why":"He would obviously see them.","_n":"4ge0a","_k":"99232b30"},{"t":"Explain the spies in a program note only","why":"Not staged; the audience must \u003cem>see\u003c/em> it.","_n":"4he1a","_k":"7e9b045a"},{"t":"Place Claudius and Polonius, frozen and dimly lit, at one side of the stage, and block Hamlet so he never faces them until the moment he notices","why":"Light and blocking do the hiding.","_n":"4ie2a","_k":"8760e053"},{"t":"Cut the spies","why":"That loses the scene’s dramatic irony.","_n":"4jdba","_k":"fb97d204"}]},"b":{"prompt":"Your production is an audio drama (sound only). How can you show Ophelia’s glance toward the hidden spies before “At home, my lord”?","options":[{"t":"A small pause and a held breath before she answers, so listeners hear her hesitate","why":"Sound carries the glance.","_n":"4kdca","_k":"e9a3f9bf"},{"t":"Cut the line","why":"It’s essential to the scene.","_n":"4ldda","_k":"59a6d384"},{"t":"Play it exactly like her other lines, since audio can’t show glances","why":"Say it again with the stress on another word. The meaning moves with the stress.","_n":"4mdea","_k":"7842dc84"},{"t":"Describe the glance in a program","why":"Listeners won’t have it.","_n":"4nd7a","_k":"b3bb6eb1"}]}},{"id":"a2","cat":"A","goal":[4,6],"a":{"prompt":"A streaming service advertises a new \u003cem>Hamlet\u003c/em> film with the tagline “Revenge is a family business.” What does the tagline signal about the adaptation’s focus?","options":[{"t":"Nothing; taglines don’t shape expectations","why":"Marketing frames how audiences read a film.","_n":"4od8a","_k":"13fa1363"},{"t":"A crime-family thriller focus on revenge and family power, more than Hamlet’s philosophical doubt","why":"Marketing frames how audiences read a film.","_n":"4p65a","_k":"f1c0fe10"},{"t":"A comedy","why":"Nothing comic signalled.","_n":"4q64a","_k":"d306c167"},{"t":"A faithful, full-text version","why":"No evidence either way.","_n":"4r63a","_k":"496cefc7"}]},"b":{"prompt":"Another poster’s tagline is “Who is watching you?” What does it signal?","options":[{"t":"Nothing","why":"Taglines frame expectations.","_n":"4s62a","_k":"9d53b083"},{"t":"A focus on spying and surveillance in the court","why":"The tagline points at the play’s watchers.","_n":"4t61a","_k":"a6d11d20"},{"t":"A documentary about cameras","why":"Unsupported.","_n":"4u60a","_k":"58fe439f"},{"t":"A horror film about ghosts only","why":"The Ghost isn’t “watching you”.","_n":"4v5fa","_k":"03e6788b"}]}}]},"task":{"title":"Performance task: Director’s promptbook","summary":"Director’s promptbook","statement":"\u003cp>\u003cstrong>Stage one scene, 3.1 or 3.4, as your interpretation, and defend it in a director’s note.\u003c/strong>\u003c/p>\u003cp>Choose the scene, then give each of its three key moments a blocking choice and a delivery choice. The support m&#101;ter rates your choices against the words. Choose the effect you want on the audience, then write your note (110–220 words), quoting the scene with (act.scene.line) citations.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg pa-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge (scene and conventions)\u003c/td>\u003ctd>Misreads the scene\u003c/td>\u003ctd>Mostly accurate\u003c/td>\u003ctd>Accurate, with conventions used well\u003c/td>\u003ctd>Precise; notes textual gaps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking (interpretation and support)\u003c/td>\u003ctd>Choices unconnected to the text\u003c/td>\u003ctd>Some choices justified\u003c/td>\u003ctd>Choices consistently justified with text\u003c/td>\u003ctd>A coherent, original interpretation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication (note: clarity, quotation, citation)\u003c/td>\u003ctd>Unclear; quotations missing\u003c/td>\u003ctd>Some integration; citation errors\u003c/td>\u003ctd>Clear note; correct citations\u003c/td>\u003ctd>Polished, persuasive note\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application (audience effect, A2.5/A2.6 choices)\u003c/td>\u003ctd>Effect unstated or unrelated to choices\u003c/td>\u003ctd>Effect named; weak link to choices\u003c/td>\u003ctd>Effect follows from voice and body choices\u003c/td>\u003ctd>Choices build the effect moment by moment\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Three moments staged","No choice the text contradicts","Your note quotes the scene","Your note names the effect you want","Length"],"tips":["Set blocking and delivery for all three moments.","One choice is rated Weak. Check the support m&#101;ter and the reason it gives.","Quote the scene at least twice, with (act.scene.line).","Tell your actors what the audience should feel, and use that word.","Too short: justify each moment. Too long: cut the plot summary."],"explainPrompt":"Craft statement: Which single choice in your staging matters most, and what would the scene lose without it?","explainLabel":"Craft statement","vocab":"Use the words blocking, delivery, text support and audience.","checkLabel":"Check my promptbook","success":"Your promptbook has every part.","more":"Try the other scene, or another effect.","min":110,"max":220,"quoteWin":40,"scenes":[{"id":"3.1","t":"3.1 (nunnery)"},{"id":"3.4","t":"3.4 (closet)"}],"hides":{"3.1":{"label":"Where the spies hide","options":[{"id":"screen","t":"behind a screen upstage"},{"id":"balcony","t":"on the balcony above"},{"id":"arras","t":"behind the arras at the side"}]}},"moments":{"3.1":[{"id":"m1","t":"The greeting “Nymph, in thy orisons”","line":"Nymph, in thy orisons / Be all my sins remember’d.","ref":"3.1.89–90","blocking":[{"id":"kneel","t":"Hamlet enters unaware and kneels by Ophelia","r":"possible","why":"Nothing in his words proves he sees them."},{"id":"apart","t":"Hamlet keeps his distance, lost in thought","r":"possible","why":"A defensible acting choice."},{"id":"eye","t":"Hamlet enters already eyeing the hiding place (he knows he’s watched)","r":"weak","why":"He greets her gently, “Nymph, in thy orisons / Be all my sins remember’d.”, which is hard to square with knowing he’s watched."}]},{"id":"m2","t":"“Where’s your father?”","line":"Where’s your father?","ref":"3.1.132–133","blocking":[{"id":"turn","t":"Hamlet turns toward the hiding place (he notices)","r":"possible","why":"The abrupt question can mark a discovery."},{"id":"stay","t":"Hamlet keeps his eyes on Ophelia (he never notices)","r":"possible","why":"Nothing in his words proves he sees them."},{"id":"circle","t":"Hamlet circles Ophelia slowly","r":"possible","why":"A defensible acting choice."}]},{"id":"m3","t":"“Get thee to a nunnery”","line":"Get thee to a nunnery: why wouldst thou be a breeder of sinners?","ref":"3.1.122–123","blocking":[{"id":"none","t":"No contact","r":"possible","why":"A defensible acting choice."},{"id":"grip","t":"Hamlet grips Ophelia’s wrist","r":"possible","why":"A defensible acting choice."},{"id":"embrace","t":"Hamlet embraces her, then pushes her away","r":"possible","why":"A defensible acting choice."}]}],"3.4":[{"id":"m1","t":"Polonius hides","note":"Polonius hides before Hamlet enters.","noStress":true,"deliveryLabel":"Delivery (Polonius’s words as he hides)","blocking":[{"id":"arras","t":"Behind the arras, centre; Hamlet doesn’t see him go","r":"strong","why":"Polonius plans it: “Behind the arras I’ll convey myself” (\u003ci>Hamlet\u003c/i> 3.3.28)."},{"id":"screen","t":"Behind a folding screen, side; Hamlet doesn’t see him go","r":"possible","why":"The play names an arras, but a screen can do the same work."},{"id":"seen","t":"Hamlet watches Polonius hide (he knows who it is)","r":"weak","why":"“Nay, I know not: / Is it the king?” says otherwise."}]},{"id":"m2","t":"“How now! a rat?”","line":"How now! a rat? Dead, for a ducat, dead!","ref":"3.4.23","blocking":[{"id":"instant","t":"Hamlet thrusts through the hiding place instantly","r":"strong","why":"“How now! a rat? Dead, for a ducat, dead!” (\u003ci>Hamlet\u003c/i> 3.4.23) is quick and broken."},{"id":"pause","t":"Hamlet pauses, then thrusts","r":"possible","why":"A pause adds thought the text doesn’t show."}]},{"id":"m3","t":"The Ghost’s entrance","line":"Alas, he’s mad!","ref":"3.4.105","blocking":[{"id":"aud","t":"The Ghost is visible to Hamlet and the audience only","r":"strong","why":"Gertrude sees nothing: “Alas, he’s mad!” (\u003ci>Hamlet\u003c/i> 3.4.105)."},{"id":"all","t":"The Ghost is visible to everyone","r":"weak","why":"Then why can’t Gertrude see it?"},{"id":"none","t":"The Ghost is invisible: a light and a sound only","r":"possible","why":"It leaves open whether Hamlet imagines it."}]}]},"delivery":[{"id":"whisper","t":"Whisper"},{"id":"shout","t":"Shout"},{"id":"slow","t":"Slow"},{"id":"urgent","t":"Urgent"},{"id":"pauseB","t":"Pause before"},{"id":"pauseA","t":"Pause after"},{"id":"stress","t":"Stress a word"}],"effects":[{"id":"symH","t":"sympathy for Hamlet","key":"sympathy"},{"id":"symO","t":"sympathy for Ophelia","key":"sympathy"},{"id":"susp","t":"suspicion of Hamlet","key":"suspicion"},{"id":"dread","t":"dread","key":"dread"},{"id":"irony","t":"dramatic irony","key":"irony"}],"labels":{"scene":"Scene","effect":"Intended audience effect","blocking":"Blocking","delivery":"Delivery","stressWord":"Stressed word","note":"Director’s note","meter":"Support m&#101;ter","glance":"Your promptbook at a glance"},"modelsLabel":"One way it can be done","modelsNote":"Three directors, three different stagings. Many answers are valid; yours should be your own.","models":[{"title":"3.1, Hamlet discovers the spies (effect: sympathy for Ophelia)","text":"In my staging, Hamlet greets Ophelia gently, kneeling on “Nymph, in thy orisons / Be all my sins remember’d.” (\u003ci>Hamlet\u003c/i> 3.1.89–90), so the audience first sees real tenderness. The spies wait, dimly lit, behind a screen upstage. On “Where’s your father?” (\u003ci>Hamlet\u003c/i> 3.1.132–133) Hamlet pauses, then turns slowly toward the screen: this is his discovery. Ophelia glances there too before she answers, “At home, my lord.” (\u003ci>Hamlet\u003c/i> 3.1.134), and her small lie lands like a door closing. From here Hamlet shouts and grips her wrist, so his “Get thee to a nunnery” becomes cruelty aimed at the watchers through her. I want the audience to feel sympathy for Ophelia, trapped between two men she loves and used by both, while Hamlet’s rage reaches the wrong target."},{"title":"3.1, Hamlet never knows (effect: sympathy for Hamlet)","text":"My Hamlet never discovers the spies on the balcony, so the audience holds all the dramatic irony and Hamlet holds none. He speaks quietly throughout. “I did love you once.” (\u003ci>Hamlet\u003c/i> 3.1.115–116) is spoken with the stress on “did”, defending a love he believes she doubts. When he whispers “Get thee to a nunnery: why wouldst thou be a breeder of sinners?” (\u003ci>Hamlet\u003c/i> 3.1.122–123), he isn’t cursing her; he is grieving a world he thinks is too corrupt for anyone to live in. He never touches her. I want sympathy for Hamlet: a man so wounded by his mother’s remarriage that he can no longer trust any love, even one sitting in front of him. The cruelty is real, but it is aimed at himself as much as at Ophelia."},{"title":"3.4, rash action and an unseen Ghost (effect: dread)","text":"My closet scene is built on speed and darkness. Polonius hides behind the arras at centre, and the audience sees him slip in. When he cries out, Hamlet strikes instantly, with no pause: “How now! a rat? Dead, for a ducat, dead!” (\u003ci>Hamlet\u003c/i> 3.4.23). The broken rhythm is the stage direction. Then he asks, hopefully, “Is it the king?” (\u003ci>Hamlet\u003c/i> 3.4.26), and the hope makes the mistake more terrible. Later the Ghost appears only to Hamlet and the audience, in cold light, while Gertrude stares at empty air and says “Alas, he’s mad!” (\u003ci>Hamlet\u003c/i> 3.4.105). I want dread: the sense that Hamlet’s long delay has broken into reckless action, and that the dead still have a claim on the living that the living can’t see."}],"rubric":[["Knowledge (scene and conventions)","Misreads the scene","Mostly accurate","Accurate, with conventions used well","Precise; notes textual gaps"],["Thinking (interpretation and support)","Choices unconnected to the text","Some choices justified","Choices consistently justified with text","A coherent, original interpretation"],["Communication (note: clarity, quotation, citation)","Unclear; quotations missing","Some integration; citation errors","Clear note; correct citations","Polished, persuasive note"],["Application (audience effect, A2.5/A2.6 choices)","Effect unstated or unrelated to choices","Effect named; weak link to choices","Effect follows from voice and body choices","Choices build the effect moment by moment"]]},"cards":[["Blocking","Planning where and how actors move on stage."],["Arras","A wall tapestry; Polonius hides behind one in 3.4."],["Early stage directions","Few and brief (“Enter Ghost”, “Knock within”); most modern directions were added by editors."],["Vocal strategies","Stress, pace, pause, pitch and volume: “I \u003cem>did\u003c/em> love you once” vs “I did love you \u003cem>once\u003c/em>”."],["Non-verbal cues","Gesture, facial expression, eye contact, distance: turning away on “I loved you not”."],["Dramatic irony","The audience knows more than a character: we see the spies in 3.1."],["Text support","A staging choice the words permit (Possible), require (Strong) or contradict (Weak)."],["Interpretation","Every staging answers the question “What is this scene about?”"],["Adaptation","A new version in another form or setting; judged by what its changes reveal."],["Transposition","Moving a play to a new time or place: a corporate tower, a surveillance state."],["Fortinbras","The Norwegian prince who inherits Denmark at the end; cutting him removes the political frame."],["“suit the action to the word, the word to the action”","Hamlet’s advice to the players (\u003ci>Hamlet\u003c/i> 3.2.19–20), a chiasmus."]]}};</script>
