.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}

pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}

.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}

.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}

*{transition:none!important;animation:none!important}
}

@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}

--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}

--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}

.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}

border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}

padding:.25em .8em;font-size:.92rem;min-height:34px}

@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}
ol.eng-poem li{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline}
ol.eng-poem li.eng-gap{height:.6em}

font:400 1.22rem/1.3 var(--font-math)}

/* ENG4U 12 Performance & Adaptation: hero strips, stage simulator, adaptation stations, read-aloud matching, promptbook. */
/* radio groups (as ENG4U 08) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
.pa-h{margin:14px 0 6px;font-size:1rem}
.pa-th{margin:14px 0 6px;font-size:.98rem}
.pa-lab{display:block;font-weight:700;font-size:.95rem;margin:0 0 4px}
.pa-cnote{font-size:.95rem}
.steal-line{font:400 1.4rem/1.35 var(--font-math);margin:0 0 2px}
.art-samples{margin:0 0 14px}
.art-samples .an-note{margin-bottom:6px}

/* ---------- hero ---------- */
.pa-hero{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);padding:14px 14px 10px}
.pa-hl{font:400 clamp(1.08rem,1.9vw,1.3rem)/1.5 var(--font-math);margin:0;max-width:none;opacity:0;transition:opacity .6s}
.pa-hero.lineon .pa-hl,.pa-hero.rm .pa-hl{opacity:1}
.pa-hero .eng-cite{margin:2px 0 8px}
.pa-strips{display:grid;gap:8px}
.pa-hero.rm .pa-strips{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pa-strip{border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px 4px;background:var(--paper);opacity:.35;transition:opacity .4s,border-color .4s}
.pa-strip.seen{opacity:1}
.pa-strip.on{border-color:var(--ink)}
.pa-shead{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:30px}
.pa-sname{font-weight:700;font-size:.88rem}
.pa-splay{min-height:30px;padding:.15em .6em}
.pa-wave{display:block;width:100%;height:30px}
.pa-wave rect{fill:var(--ink-2)}
.pa-w-light .pa-wave rect{fill:var(--pen)}
.pa-w-heavy .pa-wave rect{fill:var(--ink)}
.pa-strip.on .pa-wave rect{transform-box:fill-box;transform-origin:center;animation:pa-grow .5s ease-out both;animation-delay:calc(var(--d) * 1.3s)}
.pa-w-heavy.on .pa-wave rect{animation-duration:.9s}
@keyframes pa-grow{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
.pa-sw{margin:2px 0 0;font:italic 400 1.02rem/1.5 var(--font-math);max-width:none}
.pa-bw{display:inline-block}
.pa-w-light.on .pa-bw{animation:pa-bounce .32s steps(2) 4 both;animation-delay:calc(var(--i) * .12s + .2s)}
.pa-w-heavy.on .pa-bw{animation:pa-drag 1.6s ease-in-out both;animation-delay:calc(var(--i) * .3s + .2s)}
@keyframes pa-bounce{0%{transform:translateY(0)}50%{transform:translateY(-4px)}100%{transform:translateY(0)}}
@keyframes pa-drag{0%{letter-spacing:0;transform:translateY(0)}50%{letter-spacing:.14em;transform:translateY(2px)}100%{letter-spacing:.06em;transform:translateY(1px)}}
.pa-hcap{font:italic 400 1.06rem/1.4 var(--font-math);text-align:center;margin:10px 0 2px;opacity:0;transition:opacity .6s;max-width:none}
.pa-hero.cap-on .pa-hcap{opacity:1}
.pa-hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:6px}

/* ---------- explore ---------- */
.pa-toprow{display:flex;flex-wrap:wrap;gap:4px 24px;align-items:center}
.pa-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:6px}
.pa-main,.pa-side{min-width:0}
.pa-side{position:sticky;top:calc(var(--mv-top, 0px) + 96px)}
.pa-snote{font-size:.92rem;color:var(--ink-2);margin:0 0 6px;max-width:none}
.pa-stagewrap{border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);padding:4px}
.pa-stage{display:block;width:100%;height:auto}
.pa-floor{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.pa-aud{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:7 5}
.pa-lbl{font:700 10px var(--font-ui);fill:var(--ink-2)}
.pa-audl{font:700 11px var(--font-ui);letter-spacing:.12em;fill:var(--ink-2)}
.pa-dir{font-weight:400;font-style:italic;letter-spacing:.06em}
.pa-plbl{fill:var(--ink-2);font-weight:400;font-style:italic}
.pa-nlbl{fill:var(--ink);font-weight:700;font-size:10.5px;paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round}
.pa-prop{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pa-balc{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:4 3}
.pa-arras{fill:none;stroke:var(--an-diction);stroke-width:3.5;stroke-linecap:round}
.pa-sight{stroke:var(--ink);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}
.pa-glance,.pa-push{stroke:var(--pen);stroke-width:2;stroke-dasharray:3 3}
.pa-thr{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 4}
.pa-rapier{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.pa-arrh{fill:var(--pen)}
.pa-flash{animation:pa-flash 1.2s ease-out both}
@keyframes pa-flash{0%{opacity:0}25%{opacity:1;stroke-width:4}55%{opacity:.35}100%{opacity:1;stroke-width:2}}
.pa-tok{transition:transform .7s ease;}
.pa-snap .pa-tok{transition:none}
.pa-tok circle{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.pa-tok text{font:700 13px var(--font-ui);fill:var(--ink)}
.pa-tok.pa-lead circle{stroke:var(--pen);stroke-width:3}
.pa-tok.pa-lead text{fill:var(--pen)}
.pa-tok.pa-spy{opacity:.6}
.pa-tok.pa-spy circle{stroke:var(--ink-2)}
.pa-tok.pa-spy text{fill:var(--ink-2)}
.pa-tok.pa-fallen{opacity:.4}
.pa-tok.pa-fallen circle{stroke-dasharray:3 3}
.pa-tok.pa-ghost circle{stroke:var(--ink);stroke-width:2.5;fill:var(--paper)}
.pa-tok.pa-ghost-aud circle{stroke-dasharray:4 3}
.pa-glow{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2}
.pa-note{font:700 16px var(--font-ui);fill:var(--ink)}
.pa-pillar{fill:var(--ink-2)}
.pa-door{fill:var(--paper);stroke:var(--ink-2)}
.pa-sun{fill:var(--hi);stroke:var(--ink-2)}
.pa-shade{fill:var(--ink);opacity:.1}
.pa-stair{stroke:var(--ink-2);stroke-width:2}
.pa-mirror{fill:var(--info-bg);stroke:var(--ink-2)}
.pa-glint{stroke:var(--ink-2);stroke-width:1}
.pa-glass{stroke:var(--rule);stroke-width:1}
.pa-screen{fill:var(--info-bg);stroke:var(--pen);stroke-width:1.5}
.pa-cone{fill:var(--hi-soft);stroke:var(--ink-2);stroke-dasharray:4 4;opacity:.6}
.pa-cam{fill:var(--ink-2)}
@media (prefers-reduced-motion:reduce){ .pa-tok{transition:none} .pa-flash,.pa-strip.on .pa-wave rect,.pa-bw{animation:none!important} }
.pa-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--ink-2);margin:6px 0 4px;max-width:none}
.pa-key{display:inline-flex;align-items:center;gap:5px}
.pa-kt{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-2);font-weight:700;font-size:.75rem;color:var(--ink)}
.pa-kline{display:inline-block;width:24px;border-top:2.5px dotted var(--ink)}
.pa-now{min-height:2.4em;margin:4px 0 8px}
.pa-now p{margin:0;font:400 1.08rem/1.5 var(--font-math);max-width:none}
.pa-who{font:700 .72rem var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-right:4px}
.pa-stress{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.pa-pause{font-weight:700;color:var(--pen);font-family:var(--font-ui)}
.pa-presets{border:1.5px dashed var(--rule);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.pa-pcard p{margin:4px 0 0;font-size:.94rem;max-width:none}
.pa-ctrls{display:grid;gap:6px}
.pa-grp{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:4px 10px}
.pa-grp > summary{font-weight:700;cursor:pointer;min-height:32px;display:flex;align-items:center}
.pa-grp[open] > summary{margin-bottom:4px}
.pa-ctl .rg-wrap{align-items:flex-start}
.pa-ctl .rg-lab{flex:0 0 100%}
.pa-readbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);padding:10px 12px}
.pa-read-h{font-weight:700;margin:0 0 6px}
.pa-readbox .read{margin:0}
.pa-believe{font-size:.94rem;margin:8px 0 0;max-width:none}
.pa-believe:empty{display:none}
.pa-modelnote{margin:4px 0 8px}
.pa-playrow{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.pa-vnote{margin:4px 0 0}
.pa-aha{font-size:.92rem;border-top:1px solid var(--rule);padding-top:8px;margin:10px 0 0}
.pa-flashv{background:var(--hi-soft);border-radius:4px;padding:0 3px;animation:pa-fade 2.4s ease-out both}
@keyframes pa-fade{0%{box-shadow:0 0 0 3px var(--hi)}100%{box-shadow:0 0 0 0 transparent}}
/* support meter: Weak --ink-2, Possible --pen, Strong --ink, each with its word */
.pa-meter{margin:10px 0 0}
.pa-mh{margin:0 0 4px;font-size:.95rem}
.pa-mbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.pa-seg{text-align:center;font:700 .78rem/1 var(--font-ui);padding:6px 2px;border:1.5px solid var(--rule);border-radius:4px;color:var(--ink-2);background:var(--sheet)}
.pa-seg.on{color:var(--sheet)}
.pa-seg.pa-weak.on{background:var(--ink-2);border-color:var(--ink-2)}
.pa-seg.pa-possible.on{background:var(--pen);border-color:var(--pen)}
.pa-seg.pa-strong.on{background:var(--ink);border-color:var(--ink)}
.pa-drop .pa-mbar{animation:pa-fade 2.4s ease-out both;border-radius:4px}
.pa-mlow{font-size:.88rem;margin:6px 0 0;max-width:none}
.pa-rlist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:.86rem}
.pa-rt{display:inline-block;min-width:4.6em;text-align:center;font:700 .7rem/1.4 var(--font-ui);border-radius:999px;padding:0 .4em;border:1.5px solid currentColor}
.pa-rt.pa-weak{color:var(--ink-2)}.pa-rt.pa-possible{color:var(--pen)}.pa-rt.pa-strong{color:var(--ink)}
/* two stagings board */
.pa-board{border:1.5px dashed var(--rule);border-radius:10px;padding:8px 12px 10px;margin-top:14px}
.pa-board .pa-h{margin-top:4px}
.pa-slotgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pa-slot{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:8px 10px;min-width:0}
.pa-slh{font-weight:700;margin:0 0 4px}
.pa-slsum{margin:0 0 2px;font-size:.94rem;max-width:none}
.pa-slot .q-actions{margin:6px 0}
.pa-ev .rg-wrap{align-items:flex-start}
.pa-ev .rg-lab{flex:0 0 100%}
.rg.chips.pa-evl{display:grid;gap:5px}
.rg.chips.pa-evl button{border-radius:8px}

/* ---------- part 3 ---------- */
.pa-st{border-top:1px solid var(--rule);padding-top:10px;margin-top:14px}
.pa-st:first-child{border-top:0;margin-top:0;padding-top:0}
.pa-st h3{margin:0 0 4px}
.pa-tray{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:6px 0 10px}
.pa-card{display:grid;gap:3px;text-align:left;border:2px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:.5em .7em;min-height:44px}
.pa-card small{font-size:.84rem;color:var(--ink-2);line-height:1.35}
.pa-card[aria-pressed="true"]{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.pa-card[aria-pressed="true"] small{color:var(--hi-ink)}
.pa-spec{display:grid;gap:4px}
.pa-end{font-weight:700;font-size:.88rem;color:var(--ink-2);margin:0}
.pa-end1{text-align:right}
ol.pa-line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;position:relative}
.pa-pos{width:100%;min-height:64px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:2px dashed var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);padding:6px 8px;font-size:.9rem}
.pa-pos.full{border-style:solid;border-color:var(--ink-2);background:var(--sheet)}
.pa-pos.ready{border-color:var(--pen)}
.pa-pn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--sheet);font:700 .75rem var(--font-ui);flex:0 0 auto;margin-right:6px}
.pa-pos .pa-pn{margin:0}
.pa-loose{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;margin-top:10px;background:var(--paper)}
.pa-loose p{max-width:none}
.pa-ls{width:100%;min-height:70px}
.pa-s3p{max-width:none}
.pa-then{font-weight:700;margin:10px 0 0;max-width:none}

/* ---------- practice ---------- */
.pa-lrow{display:flex;gap:6px;align-items:stretch}
.pa-lrow .mitem{flex:1 1 auto}
.pa-lplay{flex:0 0 auto;min-width:40px;padding:0 .5em}
.pa-lplay[aria-pressed="true"]{border-color:var(--pen);color:var(--pen)}
.pa-cn{flex:0 0 auto;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.pa-dnote{font-size:.85rem;color:var(--ink-2)}
.pa-ctx{display:block;border-left:4px solid var(--rule);padding:4px 10px;margin:0 0 6px;background:var(--paper);border-radius:0 6px 6px 0}

/* ---------- performance task ---------- */
.pa-pb{display:grid;gap:10px;margin:8px 0}
.pa-moms{display:grid;gap:8px}
.pa-mom{border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--sheet)}
.pa-momh{font-weight:700;margin:0 0 2px;display:flex;align-items:center;max-width:none}
.pa-momline{font:400 1rem/1.4 var(--font-math);margin:0 0 6px;max-width:none}
.pa-mom .rg-wrap{align-items:flex-start}
.pa-mom .rg-lab{flex:0 0 100%}
#pb-scene .rg-wrap,#pb-effect .rg-wrap,#pb-hide .rg-wrap{align-items:flex-start}
.pa-ins{border:1.5px dashed var(--rule);border-radius:10px;padding:8px 10px}
.pa-ins:empty{display:none}
.pa-inslist{display:grid;gap:6px}
.pa-insb{text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .65em;font-size:.94rem;min-height:36px}
.pa-insb:hover{border-color:var(--pen)}
.pa-ref{color:var(--ink-2);font-size:.88rem}
.pa-dw{margin:4px 0}
.pa-dw-ta{width:100%;min-height:240px}
.pa-dw-n{font-size:.88rem}
.pa-dw-l{margin:4px 0}
.pa-dw-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:.9rem}
.pa-dw-cmp p{max-width:none;margin:0 0 4px}
.pa-dw-cmp del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.pa-dw-cmp ins{text-decoration:underline;text-decoration-thickness:2px;background:var(--hi-soft)}
.pa-pvstage{border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);padding:4px;margin:0 0 6px}
ul.pa-glance{list-style:none;margin:10px 0;padding:0;display:grid;gap:4px;font-size:.92rem}
.pa-model{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.pa-model h5{margin:0 0 4px;font-size:.95rem}
.pa-model p{font-size:.94rem;max-width:none}
.pa-rubric{margin-top:8px}

@media (max-width:820px){
  .pa-body{grid-template-columns:minmax(0,1fr)}
  .pa-side{position:static}
}
@media (max-width:560px){
  .pa-slotgrid,.pa-dw-cmp{grid-template-columns:minmax(0,1fr)}
  ol.pa-line{grid-template-columns:minmax(0,1fr)}
  .pa-pos{min-height:44px;flex-direction:row;align-items:center}
  .pa-end1{text-align:left}
}

Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"476bb6d5","content":{"id":"12-performance-and-adaptation","kind":"topic","title":"Performance and adaptation","topic":"Performance & Adaptation","readyTopic":"staging \u003cem>Hamlet\u003c/em>","hero":{"headline":"The words are only half the play","text":"Hamlet coaches a troupe of actors: speak lightly, don’t overact, “suit the action to the word.” He knows a line can be ruined or made by its delivery. In this module you’ll \u003cstrong>block\u003c/strong> scenes (decide where everyone stands and moves), choose \u003cstrong>how lines are spoken\u003c/strong>, and test every choice against the words. Then you’ll see how films and retellings \u003cstrong>adapt\u003c/strong> \u003cem>Hamlet\u003c/em>, and what each change argues.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later.\u003c/p>\u003cp class='muted pa-cnote' role='note'>\u003cstrong>Content note:\u003c/strong> the closet scene (3.4) contains a killing, and the nunnery scene (3.1) shows Hamlet’s cruelty toward Ophelia. This module treats both as choices to examine, never as behaviour to admire.","fig":{"html":"\u003cdiv class='pa-hero' id='pa-hero' role='group' aria-label='Hamlet’s line “Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue”, performed three ways. Under it, three waveform strips: quick and light, with the words “trippingly on the tongue” bouncing in small steps; slow and heavy, with the words dragging; and flat, with the words sitting still.'>\u003c/div>","caption":""},"line":"Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue","cite":"(\u003ci>Hamlet\u003c/i> 3.2.1–2)","bounce":"trippingly on the tongue","ways":[{"id":"light","t":"Quickly and lightly","rate":1.3,"volume":0.9,"pitch":1.15},{"id":"heavy","t":"Slowly and heavily","rate":0.62,"volume":1,"pitch":0.85},{"id":"flat","t":"Flatly","rate":1,"volume":0.75,"pitch":1}],"caption":"Same words. Three performances. Which one sounds like the advice it gives?","listen":"Listen to all three","watch":"Watch again","play":"Play","noVoice":"No reading voice on this device. Read the line aloud yourself, three ways."},"goals":["I can explain how blocking, delivery and design turn a script into an interpretation.","I can justify a staging choice with evidence from the text, and judge how well a choice is supported.","I can use and analyse vocal strategies (stress, pace, pause, volume) and non-verbal cues to change a line’s meaning.","I can compare productions and adaptations and evaluate what their changes reveal.","I can tell Shakespeare’s few original stage directions from editors’ later additions.","I can design and defend my own staging of a scene for a real audience."],"start":{"blocks":[{"title":"Word story: hypocrite","html":"\u003cp>\u003cstrong>\u003cem>Hypocrite\u003c/em>\u003c/strong> comes from Greek \u003cem>hypokritēs\u003c/em>, “stage actor”, one who answers or interprets on stage. An actor’s skill at seeming became a word for pretending to be what you’re not.\u003c/p>\u003cp>\u003cem>Hamlet\u003c/em> lives inside that double meaning: a play about a court of pretenders, whose hero hires actors to catch a liar.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Dramatic conventions","goal":1,"prompt":"What is an \u003cstrong>aside\u003c/strong>?","options":[{"t":"A short remark a character makes to the audience (or one other character) that others on stage don’t hear","why":"Asides let the audience in on a secret.","_n":"0379","_k":"3b14f7cb"},{"t":"A long speech spoken alone on stage","why":"That’s a soliloquy.","_n":"1369","_k":"d011c5e0"},{"t":"A stage direction telling actors where to stand","why":"That describes blocking notes, not an aside.","_n":"2359","_k":"3bfd3284"},{"t":"A scene cut from performances","why":"“Aside” here doesn’t mean “set aside”.","_n":"3349","_k":"2200ec54"}],"hints":["Who hears it?","The other characters don’t.","A brief remark the others can’t hear."]},{"id":"w2","skill":"Dramatic conventions","goal":1,"prompt":"\u003cstrong>Dramatic irony\u003c/strong> is when…","options":[{"t":"the audience knows something a character doesn’t","why":"As when we know Polonius and Claudius are listening, but Hamlet may not.","_n":"4339","_k":"7c7fcdeb"},{"t":"the ending is sad","why":"That confuses irony with tragedy.","_n":"5329","_k":"6eb6b900"},{"t":"a character says the opposite of what they mean","why":"That’s verbal irony.","_n":"6319","_k":"6189752c"},{"t":"the play is set in the past","why":"That’s unrelated to irony.","_n":"7409","_k":"660d26f9"}],"hints":["Who knows more, the audience or the character?","The audience.","Dramatic irony."]},{"id":"w3","skill":"Iambic stress","goal":3,"prompt":"In “I did love you once.” (\u003ci>Hamlet\u003c/i> 3.1.115–116), the natural iambic rhythm stresses which words?","options":[{"t":"“love” only","why":"There’s more than one stress in the line.","_n":"83f9","_k":"bd899a5d"},{"t":"“I” and “love”","why":"That stresses every pronoun; say it aloud.","_n":"913a","_k":"78817ccf"},{"t":"No words; prose has no stress","why":"This line sits inside prose, but spoken English always has stress.","_n":"a14a","_k":"72144db0"},{"t":"“did” and “you”","why":"i-AMB: I DID love YOU once. (Actors often add weight to “once” too.)","_n":"b11a","_k":"00ef29f5"}],"hints":["Say it aloud: da-DUM da-DUM.","I did / love you.","DID and YOU."]},{"id":"w4","skill":"\u003cem>Hamlet\u003c/em>’s plot","goal":2,"prompt":"Who is hiding to spy on Hamlet in the “nunnery” scene (3.1)?","options":[{"t":"Rosencrantz and Guildenstern","why":"They spy on him elsewhere.","_n":"c12a","_k":"20bda0e0"},{"t":"Gertrude and Horatio","why":"Wrong characters.","_n":"d17a","_k":"3d99d86e"},{"t":"The Ghost","why":"The Ghost appears in 1.5 and 3.4.","_n":"e18a","_k":"44ed7f48"},{"t":"Claudius and Polonius","why":"They set Ophelia in Hamlet’s path and watch.","_n":"f15a","_k":"4ec98635"}],"hints":["Ophelia’s father is one of them.","The other is the king.","Claudius and Polonius."]},{"id":"w5","skill":"\u003cem>Hamlet\u003c/em>’s plot","goal":2,"prompt":"In the closet scene (3.4), whom does Hamlet kill behind the arras?","options":[{"t":"Rosencrantz","why":"Unrelated.","_n":"g16a","_k":"510f1ed8"},{"t":"Laertes","why":"Laertes returns later.","_n":"h1ba","_k":"e8952b6b"},{"t":"Polonius","why":"He stabs through the tapestry.","_n":"i1ca","_k":"a0c7b05c"},{"t":"Claudius","why":"Hamlet \u003cem>hopes\u003c/em> it is Claudius (“Is it the king?”).","_n":"j2da","_k":"da19eb4e"}],"hints":["He calls the hidden man a “rat”.","It’s Ophelia’s father.","Polonius."]},{"id":"w6","skill":"MLA citation for drama","goal":2,"prompt":"Cite line 23 of Act 3, scene 4 of \u003cem>Hamlet\u003c/em>.","options":[{"t":"(\u003ci>Hamlet\u003c/i>, Act 3, line 23)","why":"It leaves out the scene, and writes it out.","_n":"k2ca","_k":"a26efce0"},{"t":"(Shakespeare 23)","why":"That’s the format for prose.","_n":"l2ba","_k":"df68840e"},{"t":"(\u003ci>Hamlet\u003c/i> 3.4.23)","why":"Title, then act.scene.line, with periods between the numbers.","_n":"m2aa","_k":"87c3d437"},{"t":"(3, 4, 23)","why":"Commas instead of periods, and no title on first use.","_n":"n29a","_k":"e4280733"}],"hints":["Title, then act.scene.line.","Periods between the numbers.","(\u003ci>Hamlet\u003c/i> 3.4.23)."]}],"refreshers":{"Dramatic conventions":"Soliloquy: alone, thinking aloud. Aside: a brief remark others don’t hear. Dramatic irony: the audience knows more than a character.","Iambic stress":"Iambic pentameter alternates unstressed and stressed: da-DUM ×5. Actors keep or break the pattern to shape meaning.","\u003cem>Hamlet\u003c/em>’s plot":"Act 3. 3.1: the nunnery scene, with Claudius and Polonius spying. 3.2: the Mousetrap play. 3.3: Claudius prays. 3.4: Hamlet kills Polonius and confronts Gertrude; the Ghost appears.","MLA citation for drama":"(\u003ci>Hamlet\u003c/i> 3.4.23): act.scene.line."}}},"explore":{"heading":"Stage simulator","intro":"You’re the director. Choose where the spies hide, what Hamlet knows, and how the lines sound. The audience panel tells you what your choices make people believe, and the support m&#101;ter tells you whether the words back you up.","modes":[{"id":"block","t":"Block"},{"id":"audience","t":"Audience"},{"id":"settings","t":"Settings"}],"modeHow":{"block":"Set the choices, then press \u003cstrong>Play the key lines\u003c/strong>: the lines play at your pace and stress, and the tokens move on the stage.","audience":"The readout and the support m&#101;ter are open, with one sentence on what the audience now believes.","settings":"Choose a setting drawn from a well-known production, described in words only. It changes the backdrop and adds a line to the readout. Settings never claim how a production staged a particular moment."},"scenes":[{"id":"A","t":"Scene A (3.1, nunnery)"},{"id":"B","t":"Scene B (3.4, closet)"}],"sceneNote":{"A":"Ophelia returns Hamlet’s gifts while Claudius and Polonius secretly watch (\u003ci>Hamlet\u003c/i> 3.1).","B":"Polonius hides behind the arras; Hamlet kills him; the Ghost appears to Hamlet alone (\u003ci>Hamlet\u003c/i> 3.4)."},"sim":{"A":[{"id":"spy","group":"Spies","label":"Spies’ position","r":"possible","why":"The text says they hide, not where.","options":[{"id":"screen","t":"behind a screen upstage"},{"id":"balcony","t":"on the balcony above"},{"id":"arras","t":"behind the arras at the side"}]},{"id":"aware","group":"Hamlet","label":"Hamlet’s awareness","options":[{"id":"never","t":"never knows","r":"possible","why":"Nothing in his words proves he sees them."},{"id":"notices","t":"notices at “Where’s your father?”","r":"possible","why":"The abrupt question can mark a discovery."},{"id":"knows","t":"knows from his entrance","r":"weak","why":"He greets her gently, “Nymph, in thy orisons / Be all my sins remember’d.”, which is hard to square with knowing he’s watched."}]},{"id":"oph","group":"Ophelia","label":"Ophelia at “At home, my lord.”","r":"possible","why":"A defensible acting choice.","options":[{"id":"glance","t":"glances toward the hiding place"},{"id":"straight","t":"looks straight at Hamlet"},{"id":"down","t":"looks down"}]},{"id":"vol","group":"Voice","label":"“Get thee to a nunnery”: volume","r":"possible","why":"A defensible acting choice.","options":[{"id":"whisper","t":"whisper"},{"id":"shout","t":"shout"}]},{"id":"pace","group":"Voice","label":"Pace","r":"possible","why":"A defensible acting choice.","options":[{"id":"slow","t":"slow"},{"id":"urgent","t":"urgent"}]},{"id":"stress","group":"Voice","label":"Stressed word","r":"possible","why":"A defensible acting choice.","options":[{"id":"get","t":"Get"},{"id":"thee","t":"thee"},{"id":"nunnery","t":"nunnery"}]},{"id":"contact","group":"Contact","label":"Physical contact","r":"possible","why":"A defensible acting choice.","options":[{"id":"none","t":"none"},{"id":"grip","t":"Hamlet grips Ophelia’s wrist"},{"id":"embrace","t":"Hamlet embraces her, then pushes her away"}]}],"B":[{"id":"hide","group":"Polonius","label":"Polonius’s hiding place","options":[{"id":"arras","t":"behind the arras, centre","r":"strong","why":"Polonius plans it: “Behind the arras I’ll convey myself” (\u003ci>Hamlet\u003c/i> 3.3.28)."},{"id":"screen","t":"behind a folding screen, side","r":"possible","why":"The play names an arras, but a screen can do the same work."}]},{"id":"belief","group":"Hamlet","label":"Hamlet’s belief about who is hidden","options":[{"id":"hopes","t":"hopes it’s Claudius","r":"strong","why":"He asks, “Is it the king?” (\u003ci>Hamlet\u003c/i> 3.4.26)."},{"id":"care","t":"doesn’t care who","r":"possible","why":"Rash, but his question suggests hope."},{"id":"knows","t":"knows it’s Polonius","r":"weak","why":"“Nay, I know not: / Is it the king?” says otherwise."}]},{"id":"thrust","group":"Hamlet","label":"The thrust","options":[{"id":"instant","t":"instant","r":"strong","why":"“How now! a rat? Dead, for a ducat, dead!” (\u003ci>Hamlet\u003c/i> 3.4.23) is quick and broken."},{"id":"pause","t":"after a pause","r":"possible","why":"A pause adds thought the text doesn’t show."}]},{"id":"ghost","group":"The Ghost","label":"The Ghost (at 3.4.102)","options":[{"id":"aud","t":"visible to the audience only","r":"strong","why":"Gertrude sees nothing: “Alas, he’s mad!” (\u003ci>Hamlet\u003c/i> 3.4.105)."},{"id":"all","t":"visible to everyone","r":"weak","why":"Then why can’t Gertrude see it?"},{"id":"none","t":"invisible (a light and a sound only)","r":"possible","why":"It leaves open whether Hamlet imagines it."}]}]},"defaults":{"A":{"spy":"screen","aware":"never","oph":"glance","vol":"whisper","pace":"slow","stress":"nunnery","contact":"none"},"B":{"hide":"arras","belief":"hopes","thrust":"instant","ghost":"aud"}},"play":{"A":[{"who":"H","t":"Nymph, in thy orisons / Be all my sins remember’d.","ref":"3.1.89–90","cue":"enter"},{"who":"H","t":"I did love you once.","ref":"3.1.115–116"},{"who":"H","t":"I loved you not.","ref":"3.1.120"},{"who":"H","t":"Get thee to a nunnery: why wouldst thou be a breeder of sinners?","ref":"3.1.122–123","cue":"nunnery"},{"who":"H","t":"We are arrant knaves, all; believe none of us.","ref":"3.1.131–132"},{"who":"H","t":"Where’s your father?","ref":"3.1.132–133","cue":"father"},{"who":"O","t":"At home, my lord.","ref":"3.1.134","cue":"home"}],"B":[{"who":"P","t":"(Polonius hides.)","cue":"hide","silent":true},{"who":"H","t":"How now! a rat? Dead, for a ducat, dead!","ref":"3.4.23","cue":"thrust"},{"who":"H","t":"Nay, I know not: / Is it the king?","ref":"3.4.25–26","cue":"king"},{"who":"G","t":"(The Ghost enters, 3.4.102.)","cue":"ghost","silent":true},{"who":"Q","t":"Alas, he’s mad!","ref":"3.4.105","cue":"mad"}]},"names":{"H":"Hamlet","O":"Ophelia","C":"Claudius","P":"Polonius","G":"Ghost","Q":"Gertrude (the Queen)"},"attitudes":{"protective":"Protective: urging her away from a corrupt court","anguished":"Anguished","testing":"Testing: performing madness for the hidden audience","cruel":"Cruel","cold":"Cold performance"},"attShort":{"protective":"Protective","anguished":"Anguished","testing":"Testing","cruel":"Cruel","cold":"Cold performance"},"ophelia":{"glance":"Torn between father and Hamlet","straight":"Loyal to Hamlet, or lying boldly","down":"Ashamed, obedient"},"focus":{"get":"Command","thee":"Personal","nunnery":"Escape from the world"},"killing":{"hopes":"aimed at the King he hopes is there","care":"aimed at whoever is there","knows":"aimed at Polonius","instant":"Rash","pause":"Considered"},"ghostReads":{"aud":"Real, but seen by Hamlet alone","all":"Plainly real to everyone","none":"Perhaps in Hamlet’s mind"},"gertrudeSees":{"aud":"Nothing: “Alas, he’s mad!”","all":"The Ghost (so why “Alas, he’s mad!”?)","none":"Nothing: “Alas, he’s mad!”"},"believes":{"A":{"knows":"Hamlet has known all along that he is watched, so everything he says to Ophelia is a performance for the hidden listeners.","notices":"Hamlet discovers the spies at “Where’s your father?”, so his anger after it answers a betrayal.","never":"Hamlet never knows he is watched; only we see the spies, so his words are meant for Ophelia alone."},"B":{"hopes":"Hamlet strikes at the hiding place hoping to kill the King, and kills the wrong man.","care":"Hamlet strikes at whoever is hidden, without stopping to ask who.","knows":"Hamlet kills Polonius knowing who he is."},"ghost":{"aud":"The Ghost is real, but only Hamlet (and we) can see it.","all":"The Ghost is plain to everyone, which makes Gertrude’s “Alas, he’s mad!” hard to explain.","none":"We can’t be sure the Ghost is there at all."},"treat":"His treatment of Ophelia reads as ","she":"; Ophelia seems "},"readout":{"spies":"Audience knows about the spies","hidden":"Audience knows about the hiding","att":"Hamlet’s attitude reads as","oph":"Ophelia reads as","focus":"Focus of “Get thee to a nunnery”","kill":"The killing reads as","ghost":"The Ghost reads as","gert":"What Gertrude sees","support":"Text support","tension":"Tension","setting":"This setting emphasizes","believes":"What the audience now believes"},"yes":"Yes: they watch the spies hide","yesB":"Yes: they see Polonius hide","meter":{"title":"Support m&#101;ter","weak":"Weak","possible":"Possible","strong":"Strong","lowest":"Lowest choice","allStrong":"Every choice is rated Strong."},"model":"A model of how audiences often read these choices, not a rule.","presets":[{"id":"globe","t":"Elizabethan Globe","d":"A bare thrust stage in daylight, the audience on three sides","e":"Words and the actor’s body; the audience as witnesses"},{"id":"olivier","t":"Postwar film, black and white","d":"Laurence Olivier’s 1948 film: shadowy castle stairways, some soliloquies heard as voice-over","e":"Hamlet’s inner mind and isolation"},{"id":"palace","t":"Nineteenth-century palace","d":"Kenneth Branagh’s 1996 film: a full-text version in a glittering, mirrored palace","e":"Political spectacle and self-regard"},{"id":"corporate","t":"Corporate tower","d":"Michael Almereyda’s 2000 film: contemporary New York; “Denmark” as a corporation","e":"Corporate power, screens and surveillance"},{"id":"surveillance","t":"Surveillance state","d":"The Royal Shakespeare Company’s 2008 staging (televised 2009) with security cameras","e":"A court where everyone is watched"}],"presetNone":"No setting chosen: a bare rehearsal floor.","slots":{"title":"Two stagings (for challenge 3)","how":"Set up Scene A, then save it into a slot. For each saved staging, choose the line that best supports it.","s1":"Staging 1: Cruel","s2":"Staging 2: Protective","save":"Save the current Scene A staging here","load":"Load it onto the stage","empty":"Nothing saved yet.","evidence":"Line that best supports it"},"evidence":[{"id":"e1","t":"I loved you not.","ref":"3.1.120"},{"id":"e2","t":"If thou dost marry, I’ll give thee this plague for thy dowry","ref":"3.1.139–140"},{"id":"e3","t":"Get thee to a nunnery: why wouldst thou be a breeder of sinners?","ref":"3.1.122–123"},{"id":"e4","t":"We are arrant knaves, all; believe none of us.","ref":"3.1.131–132"},{"id":"e5","t":"I did love you once.","ref":"3.1.115–116"},{"id":"e6","t":"Where’s your father?","ref":"3.1.132–133"}],"aha":"The words limit some choices and leave others open. The art is finding the choices the words \u003cem>permit\u003c/em> and the audience will \u003cem>feel\u003c/em>.","noVoice":"No reading voice on this device: the delivery is shown in type (bold = stress, ‖ = pause). Read it aloud yourself.","predIntro":"Make a prediction first. Then the stage plays it out.","predictions":[{"id":"p1","start":{"mode":"block","scene":"A","stress":"nunnery"},"prompt":"Move the stress from “nunnery” to “thee” in “Get thee to a nunnery”. What changes?","options":[{"t":"It becomes personal: Hamlet singles Ophelia out, as if she in particular must be sent away","_n":"o28a","_k":"343bd334"},{"t":"The line now rhymes","_n":"p27a","_k":"0c565683"},{"t":"It becomes a question","_n":"q26a","_k":"bdc65a47"},{"t":"Nothing; stress doesn’t change meaning","_n":"r25a","_k":"f25296e3"}],"explain":"Stress tells the listener which word carries the weight. The Focus row moved from “escape from the world” to “personal”. Say it again with the stress on another word. The meaning moves with the stress."},{"id":"p2","start":{"mode":"block","scene":"A","aware":"never"},"prompt":"Switch Hamlet to notice the spies at “Where’s your father?”. What happens to Ophelia’s reply, “At home, my lord”?","options":[{"t":"It becomes true","_n":"s24a","_k":"a66a371f"},{"t":"It becomes a lie that Hamlet recognizes, so his anger afterward reads as a response to betrayal","_n":"ta7a","_k":"c49be501"},{"t":"Ophelia becomes the play’s villain","_n":"ua8a","_k":"253418a8"},{"t":"It is cut from the scene","_n":"va9a","_k":"d6cad266"}],"explain":"One choice rewrites the meaning of the lines around it. Neither version is “correct”; both are possible. The text leaves gaps. Productions fill them differently. The question is which choices the words can support."},{"id":"p3","start":{"mode":"block","scene":"B","thrust":"instant"},"prompt":"Add a pause before “How now! a rat?”. What does the pause suggest?","options":[{"t":"Nothing","_n":"waaa","_k":"7e9dc4df"},{"t":"That he’s afraid of rats","_n":"xa3a","_k":"c28bdc0e"},{"t":"That Hamlet thinks before he strikes, which softens the rashness the broken line suggests","_n":"ya4a","_k":"6fe8329b"},{"t":"That he knows it’s Polonius","_n":"za5a","_k":"c119c476"}],"explain":"The text’s rhythm is fast and broken. A pause is allowed, but it pulls against the words: the m&#101;ter dropped from Strong to Possible."},{"id":"p4","start":{"mode":"settings","preset":"corporate"},"line":"Denmark’s a prison.","ref":"2.2.249","prompt":"In a glass office tower, how might Hamlet’s “Denmark’s a prison.” (\u003ci>Hamlet\u003c/i> 2.2.249) land?","options":[{"t":"It must be cut; it no longer makes sense","_n":"10a6a","_k":"40e69ea6"},{"t":"It means Hamlet is literally in jail","_n":"119fa","_k":"7cc8c73f"},{"t":"Exactly as in a castle","_n":"12a0a","_k":"829f5b56"},{"t":"As a comment on corporate power and constant screens: the prison is the company","_n":"13a19","_k":"0791da6d"}],"explain":"A setting is an argument. The same line now points at a different kind of power. A corporation, a surveillance state, a savannah: each setting makes an argument about power."}],"chalIntro":"Use the stage to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right scene. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,6],"prompt":"Stage Scene A so the audience sees Hamlet \u003cstrong>discover\u003c/strong> that he is being watched, with no choice rated Weak. \u003cbutton type='button' class='btn ghost sm pa-setup' data-setup='tc1'>Set it up\u003c/button>","msgs":{"knows":"Then why does he greet her so gently: “Nymph, in thy orisons / Be all my sins remember’d.”? The text doesn’t support it (Weak).","never":"Then there’s no discovery for the audience to see. Try the moment of his sudden question."},"general":"Not yet. Set Hamlet’s awareness so the audience sees a discovery, and keep every choice Possible or better.","why":"The abrupt “Where’s your father?” (\u003ci>Hamlet\u003c/i> 3.1.132–133) can mark a discovery, and nothing else in your staging pulls against the words.","hints":["Find the line where his tone changes suddenly.","“Where’s your father?” comes out of nowhere.","Set awareness to “notices at Where’s your father?”."]},{"id":"tc2","goal":[2,3],"prompt":"Stage Scene B so the killing reads as \u003cstrong>rash action\u003c/strong> against the man Hamlet hopes is the King, with every choice rated Possible or Strong. \u003cbutton type='button' class='btn ghost sm pa-setup' data-setup='tc2'>Set it up\u003c/button>","msgs":{"knows":"He asks “Is it the king?” (\u003ci>Hamlet\u003c/i> 3.4.26). He didn’t know.","pause":"A pause suggests deliberation. The task asks for rashness.","all":"Gertrude says “Alas, he’s mad!” (\u003ci>Hamlet\u003c/i> 3.4.105), so she can’t see it."},"general":"Not yet. The killing should be rash, and aimed at the man Hamlet hopes is the King.","why":"Hope (“Is it the king?”), speed (“How now! a rat? Dead, for a ducat, dead!”) and a Ghost Gertrude can’t see: every choice has the words behind it.","hints":["What does Hamlet ask right after the thrust?","“Is it the king?” shows his hope.","Hopes it’s Claudius, instant thrust, and a Ghost Gertrude can’t see."]},{"id":"tc3","goal":[2,6],"stretch":true,"prompt":"Make \u003cstrong>two\u003c/strong> stagings of Scene A with opposite readings of how Hamlet treats Ophelia: one that reads as \u003cstrong>Cruel\u003c/strong> and one that reads as \u003cstrong>Protective\u003c/strong>, with no choice rated Weak. For each, choose the line that best supports it. Use the \u003cem>Two stagings\u003c/em> board under the stage. \u003cbutton type='button' class='btn ghost sm pa-setup' data-setup='tc3'>Set it up\u003c/button>","_a":"TxVFU0AMPxdRBhROQFNWF2kbFBFQFF5uFlIFQE4UAQEWaks=","msgs":{"empty":"Save two stagings first: a Cruel one in slot 1 and a Protective one in slot 2.","shout":"Shouting reads as Cruel or Testing in this simulator. Protective needs a whisper.","unaware":"If he doesn’t know they’re watched, the whisper reads as Anguished. Protective means he’s warning her away from the watchers.","knavesCruel":"That line condemns everyone, himself included. It supports protection more than cruelty.","once":"It’s tender and painful, which makes it ambiguous evidence. Choose a line that clearly leans one way.","weak":"One choice in that staging is rated Weak. Check the support m&#101;ter and the reason it gives.","noLine":"Choose a supporting line for each saved staging.","notCruel":"Staging 1 doesn’t read as Cruel yet. Check the attitude table under the stage.","notProt":"Staging 2 doesn’t read as Protective yet. Check the attitude table under the stage.","lineCruel":"That line doesn’t lean toward cruelty. Look for one where he takes back his love or curses her future.","lineProt":"That line doesn’t lean toward protection. Look for one where he warns her away from a corrupt world."},"general":"Not yet. Check each slot’s reading, its m&#101;ter and its line.","banner":"Same words, opposite Hamlets, and both defensible. That’s why directors argue, and why the play survives them.","why":"Same words, opposite Hamlets, and both defensible. That’s why directors argue, and why the play survives them.","hints":["Check the attitude table: which combination gives Protective?","Protective: notices + whisper + no wrist grip. Cruel: shout + a grip or a push.","Cruel ↔ “I loved you not.” Protective ↔ “We are arrant knaves, all; believe none of us.”"]}],"blocks":[{"title":"How the simulator reads your choices","html":"\u003cp class='muted'>A model of how audiences often read these choices, not a rule. Where does it oversimplify? That’s a good argument to have.\u003c/p>\u003ch4 class='pa-th'>Hamlet’s attitude (Scene A)\u003c/h4>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Awareness\u003c/th>\u003cth scope='col'>Volume\u003c/th>\u003cth scope='col'>Contact\u003c/th>\u003cth scope='col'>Attitude reads as\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Notices\u003c/td>\u003ctd>Whisper\u003c/td>\u003ctd>None, or embrace then push\u003c/td>\u003ctd>\u003cstrong>Protective\u003c/strong>: urging her away from a corrupt court\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Notices\u003c/td>\u003ctd>Whisper\u003c/td>\u003ctd>Grips wrist\u003c/td>\u003ctd>\u003cstrong>Anguished\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Notices\u003c/td>\u003ctd>Shout\u003c/td>\u003ctd>None\u003c/td>\u003ctd>\u003cstrong>Testing\u003c/strong>: performing madness for the hidden audience\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Notices or never\u003c/td>\u003ctd>Shout\u003c/td>\u003ctd>Grips wrist, or embrace then push\u003c/td>\u003ctd>\u003cstrong>Cruel\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Never\u003c/td>\u003ctd>Whisper\u003c/td>\u003ctd>Any\u003c/td>\u003ctd>\u003cstrong>Anguished\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Never\u003c/td>\u003ctd>Shout\u003c/td>\u003ctd>None\u003c/td>\u003ctd>\u003cstrong>Anguished\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Knows from entrance\u003c/td>\u003ctd>Any\u003c/td>\u003ctd>Any\u003c/td>\u003ctd>\u003cstrong>Cold performance\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4 class='pa-th'>Text support ratings (the m&#101;ter shows the lowest)\u003c/h4>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Choice\u003c/th>\u003cth scope='col'>Rating\u003c/th>\u003cth scope='col'>Reason shown\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Spies’ position (any)\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>The text says they hide, not where.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hamlet’s awareness: never knows\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Nothing in his words proves he sees them.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hamlet’s awareness: notices at “Where’s your father?”\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>The abrupt question can mark a discovery.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hamlet’s awareness: knows from his entrance\u003c/td>\u003ctd>\u003cstrong>Weak\u003c/strong>\u003c/td>\u003ctd>He greets her gently, “Nymph, in thy orisons / Be all my sins remember’d.”, which is hard to square with knowing he’s watched.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ophelia at “At home, my lord.” (any)\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>A defensible acting choice.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>“Get thee to a nunnery”: volume (any)\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>A defensible acting choice.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pace (any)\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>A defensible acting choice.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stressed word (any)\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>A defensible acting choice.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Physical contact (any)\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>A defensible acting choice.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: Polonius’s hiding place: behind the arras, centre\u003c/td>\u003ctd>\u003cstrong>Strong\u003c/strong>\u003c/td>\u003ctd>Polonius plans it: “Behind the arras I’ll convey myself” (\u003ci>Hamlet\u003c/i> 3.3.28).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: Polonius’s hiding place: behind a folding screen, side\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>The play names an arras, but a screen can do the same work.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: Hamlet’s belief about who is hidden: hopes it’s Claudius\u003c/td>\u003ctd>\u003cstrong>Strong\u003c/strong>\u003c/td>\u003ctd>He asks, “Is it the king?” (\u003ci>Hamlet\u003c/i> 3.4.26).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: Hamlet’s belief about who is hidden: doesn’t care who\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>Rash, but his question suggests hope.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: Hamlet’s belief about who is hidden: knows it’s Polonius\u003c/td>\u003ctd>\u003cstrong>Weak\u003c/strong>\u003c/td>\u003ctd>“Nay, I know not: / Is it the king?” says otherwise.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: The thrust: instant\u003c/td>\u003ctd>\u003cstrong>Strong\u003c/strong>\u003c/td>\u003ctd>“How now! a rat? Dead, for a ducat, dead!” (\u003ci>Hamlet\u003c/i> 3.4.23) is quick and broken.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: The thrust: after a pause\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>A pause adds thought the text doesn’t show.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: The Ghost (at 3.4.102): visible to the audience only\u003c/td>\u003ctd>\u003cstrong>Strong\u003c/strong>\u003c/td>\u003ctd>Gertrude sees nothing: “Alas, he’s mad!” (\u003ci>Hamlet\u003c/i> 3.4.105).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: The Ghost (at 3.4.102): visible to everyone\u003c/td>\u003ctd>\u003cstrong>Weak\u003c/strong>\u003c/td>\u003ctd>Then why can’t Gertrude see it?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scene B: The Ghost (at 3.4.102): invisible (a light and a sound only)\u003c/td>\u003ctd>Possible\u003c/td>\u003ctd>It leaves open whether Hamlet imagines it.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"}]},"part3":{"slug":"adaptation","name":"Adaptation","heading":"Adaptation as interpretation","intro":"Explore worked inside one production. Now step back and compare whole adaptations: where each sits between the text and a loose retelling, what its setting argues, and what a single cut changes.","stations":{"s1":{"title":"Station 1: the fidelity spectrum","how":"Tap a card, then tap a place on the line from “close to the text” to “loose retelling”. Tap a placed card to move it. Press \u003cstrong>Check the order\u003c/strong> when all five are placed.","ends":["Close to the text","Loose retelling"],"cards":[{"id":"full","t":"A full-text film","d":"Almost every line kept; nineteenth-century palace setting (Branagh, 1996)"},{"id":"modern","t":"A modern-dress film","d":"Contemporary New York and a corporation called Denmark; the text heavily cut (Almereyda, 2000)"},{"id":"relocated","t":"A relocated film","d":"A story drawn from \u003cem>Hamlet\u003c/em> set during conflict in Kashmir, in a different language (Vishal Bhardwaj’s \u003cem>Haider\u003c/em>, 2014)"},{"id":"side","t":"A play from the side","d":"The story told by Rosencrantz and Guildenstern, two minor characters who don’t understand the play they’re in (Tom Stoppard’s \u003cem>Rosencrantz and Guildenstern Are Dead\u003c/em>, 1966)"},{"id":"animated","t":"An animated retelling","d":"A lion prince, a murdered king-father and a usurping uncle; no Shakespeare lines (Disney’s \u003cem>The Lion King\u003c/em>, 1994; widely described as drawing on \u003cem>Hamlet\u003c/em>)"}],"_a":"b2wUBBdaCBdpG21AD1kAUEZZFD9ObUZHUVtZAQNCAVEWaho5QEUNUVEVGkADWA1YVUNTBkBrSG4WRF8GBxRIF1VZXw8DQgFRFmpr","fb":{"full":"The full-text film keeps almost every line, so it sits closest to the text, whatever its setting.","modern":"The modern-dress film still speaks Shakespeare’s words, though heavily cut, so it sits next to the full-text film.","relocated":"The relocated film keeps a story drawn from \u003cem>Hamlet\u003c/em> but tells it in another language: Shakespeare’s plot, not his words. It sits in the middle.","loose":"The play from the side and the animated retelling leave Shakespeare’s scenes behind, so they sit at the loose end.","place":"Place all five cards first."},"done":"That order works. The play from the side and the animated retelling can sit in either order: both are loose retellings.","prompt":"Closer isn’t automatically better. Choose one loose card and write one sentence on what it reveals that a faithful version might hide.","loose":["relocated","side","animated"],"sentence":"Your sentence","check":"Check the order","reset":"Start over"},"s2":{"title":"Station 2: what does the setting argue?","how":"Tap a setting, then tap the argument it makes.","settings":[{"id":"corporate","t":"Corporate tower"},{"id":"surveillance","t":"Surveillance state"},{"id":"kashmir","t":"Kashmir in conflict"},{"id":"savannah","t":"Savannah kingdom"},{"id":"palace","t":"Glittering palace"}],"args":[{"id":"a1","t":"Power is money and screens"},{"id":"a2","t":"Everyone is watched; privacy is gone"},{"id":"a3","t":"Political violence and loss as the ground of grief"},{"id":"a4","t":"Growing up and claiming your place"},{"id":"a5","t":"Power as public spectacle"}],"_a":"TxVVDRBGC0dVQ1NAWBQFBBYbFBEXRBJQXVtaAwxVARcOFVdQQBpGXlVEXg8LREYPFlYFQE4UF1RCVlgMA15GDxZWAkBOFBRUWFZVB0AMRlQBFUs=","why":{"corporate":"A glass tower turns the throne into a company: power is ownership, and screens are everywhere.","surveillance":"Cameras turn the court’s spying (Polonius, Claudius, Rosencrantz and Guildenstern) into a system: no one is unwatched.","kashmir":"In a real conflict, a son’s grief grows from political violence and loss, not one family’s crime alone.","savannah":"A cub who must grow up and take back his father’s place: the story becomes a coming of age.","palace":"Gilt and mirrors make the court a show: power is something rulers perform in public."},"wrong":"That setting points somewhere else. A corporation, a surveillance state, a savannah: each setting makes an argument about power. Ask what this one makes us see first."},"s3":{"title":"Station 3: cut or keep?","prompt":"Many productions cut Fortinbras, the Norwegian prince who arrives at the end and takes the throne. Predict what is lost.","options":[{"t":"Nothing; he’s a minor character","why":"Minor in lines, not in meaning: he decides who rules Denmark at the end.","_n":"14a09","_k":"fc410738"},{"t":"The poisoning plot","why":"The poisonings belong to Claudius and Laertes, not Fortinbras.","_n":"15a39","_k":"f2658eea"},{"t":"The political frame: a foreign power inherits a Denmark that destroyed itself","why":"He’s the outside power that inherits the wreck.","_n":"16a29","_k":"fb8030d7"},{"t":"Ophelia’s story","why":"Fortinbras never meets Ophelia.","_n":"17a59","_k":"f30bd43a"}],"then":"A production that cuts him tells a family tragedy; one that keeps him tells a national one."}},"blocks":[{"title":"Craft → meaning","html":"\u003cp>Every adaptation answers the question “What is \u003cem>Hamlet\u003c/em> about?” Its cuts and changes are its answer. Reading an adaptation well means reading those choices as arguments.\u003c/p>"}],"quickCheck":{"title":"Adaptation quick check","summary":"Adaptation quick check","items":[{"id":"q1","goal":4,"prompt":"A film keeps every line but moves the play to the 1800s. Where does it sit on the spectrum?","choices":[{"t":"A parody","fb":"The words stay, so it’s close, even with a new setting.","_n":"18a49","_k":"e8d55920"},{"t":"Loose retelling","fb":"The words stay, so it’s close, even with a new setting.","_n":"19a79","_k":"52392fca"},{"t":"Not an adaptation","fb":"The words stay, so it’s close, even with a new setting.","_n":"1aa69","_k":"d83c655f"},{"t":"Close to the text","fb":"Right. The words stay, so it’s close, even with a new setting.","_n":"1b999","_k":"370ba8a8"}]},{"id":"q2","goal":4,"prompt":"Which question best evaluates an adaptation?","choices":[{"t":"Is it older or newer?","fb":"Fidelity is one measure; insight is the better one. Changing the setting isn’t failure. Ask what the change makes us see.","_n":"1c989","_k":"a15edbf7"},{"t":"Is it in colour?","fb":"Fidelity is one measure; insight is the better one. Changing the setting isn’t failure. Ask what the change makes us see.","_n":"1d9b9","_k":"8db253a6"},{"t":"How many lines did it keep?","fb":"Fidelity is one measure; insight is the better one. Changing the setting isn’t failure. Ask what the change makes us see.","_n":"1e9c9","_k":"055eca42"},{"t":"What do its changes reveal?","fb":"Right. Fidelity is one measure; insight is the better one.","_n":"1f999","_k":"6da432f4"}]},{"id":"q3","goal":4,"prompt":"Cutting Fortinbras most changes…","choices":[{"t":"the political frame","fb":"Right. He’s the outside power that inherits the wreck.","_n":"1g9a9","_k":"50181661"},{"t":"nothing","fb":"He’s the outside power that inherits the wreck.","_n":"1h979","_k":"efae39eb"},{"t":"the poison plot","fb":"He’s the outside power that inherits the wreck.","_n":"1i989","_k":"665a047d"},{"t":"Ophelia’s songs","fb":"He’s the outside power that inherits the wreck.","_n":"1j959","_k":"8ca4f4cf"}]},{"id":"q4","goal":4,"prompt":"A surveillance-state setting emphasizes which thread in \u003cem>Hamlet\u003c/em>?","choices":[{"t":"Sea voyages","fb":"Polonius, Claudius, Rosencrantz and Guildenstern all watch Hamlet.","_n":"1k969","_k":"0365b75d"},{"t":"Graveyards","fb":"Polonius, Claudius, Rosencrantz and Guildenstern all watch Hamlet.","_n":"1la39","_k":"962f5bf3"},{"t":"Spying and being watched","fb":"Right. Polonius, Claudius, Rosencrantz and Guildenstern all watch Hamlet.","_n":"1ma49","_k":"d5dd7932"},{"t":"Wedding feasts","fb":"Polonius, Claudius, Rosencrantz and Guildenstern all watch Hamlet.","_n":"1n959","_k":"d485c803"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“suit the action to the word, the word to the action”\u003c/p>\u003cp class='eng-cite'>(\u003ci>Hamlet\u003c/i> 3.2.19–20)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> a chiasmus, A-to-B then B-to-A, so the two halves mirror each other.\u003c/p>\u003cp>\u003cstrong>Frame:\u003c/strong> “______ the ______ to the ______, the ______ to the ______.”\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “Fit the story to the stage, the stage to the story.”\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"suit the action to the word, the word to the action","source":"Hamlet 3.2.19–20","save":"Save it to my Art of Language notebook"}},"practice":{"activities":[{"id":"three","type":"custom","title":"Read it three ways","summary":"Read it three ways","goal":3,"instruction":"Each card plays a line with one delivery: stress is shown in bold, and a pause is marked ‖. Match it to the meaning it produces.","leftTitle":"Delivery","rightTitle":"Meaning","left":[{"id":"l1","t":"“\u003cstrong>Seems\u003c/strong>, madam! nay, it is”","say":[["Seems",1],[", madam! nay, it is."]],"ref":"1.2.76"},{"id":"l2","t":"“Seems, madam! nay, it \u003cstrong>is\u003c/strong>”","say":[["Seems, madam! nay, it"],["is.",1]],"ref":"1.2.76"},{"id":"l3","t":"“I \u003cstrong>did\u003c/strong> love you once.”","say":[["I"],["did",1],["love you once."]],"ref":"3.1.115–116"},{"id":"l4","t":"“I did love you \u003cstrong>once\u003c/strong>.”","say":[["I did love you"],["once.",1]],"ref":"3.1.115–116"},{"id":"l5","t":"“Where’s your father? ‖” \u003cspan class='pa-dnote'>(pause after)\u003c/span>","say":[["Where’s your father?"],["‖"]],"ref":"3.1.132–133"},{"id":"l6","t":"“‖ Where’s your father?” \u003cspan class='pa-dnote'>(pause before)\u003c/span>","say":[["‖"],["Where’s your father?"]],"ref":"3.1.132–133"},{"id":"l7","t":"“I must be \u003cstrong>cruel\u003c/strong>, only to be kind.” (\u003ci>Hamlet\u003c/i> 3.4.178)","say":[["I must be"],["cruel,",1],["only to be kind."]],"ref":"3.4.178"},{"id":"l8","t":"“I must be cruel, only to be \u003cstrong>kind\u003c/strong>.”","say":[["I must be cruel, only to be"],["kind.",1]],"ref":"3.4.178"}],"right":[{"id":"r1","t":"Scornful of the very word: he refuses appearances"},{"id":"r2","t":"Insisting on reality: his grief is real"},{"id":"r3","t":"Defending a past love she doubts"},{"id":"r4","t":"Pointing to an ending: the love is over"},{"id":"r5","t":"A trap: waiting to see whether she’ll lie"},{"id":"r6","t":"A sudden realization breaking through"},{"id":"r7","t":"Owning the harshness"},{"id":"r8","t":"Insisting on the good intention"}],"_a":"TxVaU0AMRkcFFRpADgRGDxZFBEBOFAgGFg0UEFEUSBdYAxRYQERQFxgVWldADEZHARUaQA4ARg8WRQBAThQIAhYNFBBVFEgXWA8UWEBEXBdJ","why":{"l1":"Stress on “Seems” throws the word back at Gertrude: he refuses appearances.","l2":"Stress on “is” insists on what is real: his grief is not a show.","l3":"Stress on “did” defends a love she doubts.","l4":"Stress on “once” closes the door: the love is over.","l5":"The pause after the question waits for her answer: a trap.","l6":"The pause before it lets a thought break through: a sudden realization.","l7":"Weight on “cruel” owns the harshness.","l8":"Weight on “kind” insists on the good intention."},"wrong":{"l3|r4":"Stress “did” to defend; stress “once” to close the door.","l4|r3":"Stress “did” to defend; stress “once” to close the door.","l5|r6":"Where the pause falls changes who’s in control.","l6|r5":"Where the pause falls changes who’s in control."},"wrongDefault":"Say it aloud with the stress where it’s shown. Which word carries the weight?","hints":["Listen for the loudest word.","What does that word make the line about?"],"play":"Play","noVoice":"No reading voice on this device. Read each card aloud yourself, with the stress and pause shown."},{"id":"macbeth","type":"mc","title":"Direct an unseen scene: \u003cem>Macbeth\u003c/em> 2.2","summary":"Direct an unseen scene","star":true,"goal":[2,5],"instruction":"\u003cspan class='pa-ctx'>\u003cstrong>Context card:\u003c/strong> Macbeth has just killed King Duncan offstage. He returns to Lady Macbeth.\u003c/span> You’re the director. Choose the staging the words support best. The last two decisions sit above Final Check level.","items":[{"id":"d1","goal":2,"prompt":"What is Macbeth carrying when he enters?","options":[{"t":"The crown","why":"Duncan’s crown isn’t mentioned. Find her question about what he brought.","_n":"1o949","_k":"77806f17"},{"t":"Nothing","why":"Someone asks him why he brought something. Find her question.","_n":"1p939","_k":"c1caa537"},{"t":"A torch","why":"Nothing in the lines calls for light. Find her question about what he brought.","_n":"1q929","_k":"dd21d963"},{"t":"The bloody daggers","why":"Lady Macbeth asks, “Why did you bring these daggers from the place?” (\u003ci>Macbeth\u003c/i> 2.2.48), so he still has them.","_n":"1r999","_k":"2db94738"}],"hints":["Lady Macbeth asks him a question about something he brought.","“Why did you bring these … from the place?”","The bloody daggers: “Why did you bring these daggers from the place?” (\u003ci>Macbeth\u003c/i> 2.2.48)."]},{"id":"d2","goal":2,"prompt":"How should Macbeth deliver “Will all great Neptune’s ocean wash this blood / Clean from my hand?” (\u003ci>Macbeth\u003c/i> 2.2.60–61)?","options":[{"t":"Staring at his hands, slowly","why":"The question is addressed to his own hands; horror, not argument.","_n":"1s989","_k":"36c30674"},{"t":"Shouting at Lady Macbeth","why":"He isn’t arguing with her here. Look at what the line is about.","_n":"1t979","_k":"caaad7a7"},{"t":"Laughing","why":"Nothing in the line is light. Who, or what, is he talking to?","_n":"1u969","_k":"ce92979b"},{"t":"Running offstage","why":"He stays to ask the question. What is he looking at?","_n":"1v9d9","_k":"b8d44b5e"}],"hints":["What is the line about?","His own bloody hand.","Staring at his hands, slowly: horror, not argument."]},{"id":"d3","goal":2,"prompt":"When Lady Macbeth returns, what should the audience see?","options":[{"t":"Nothing in her hands","why":"She says her hands match his. Find the line.","_n":"1w9c9","_k":"ce19d1c8"},{"t":"Clean hands","why":"She says her hands match his. Find the line.","_n":"1x0f9","_k":"77b4abdd"},{"t":"Blood on her hands too","why":"“My hands are of your colour” (\u003ci>Macbeth\u003c/i> 2.2.64).","_n":"1y109","_k":"d6ab4a0a"},{"t":"Gloves","why":"She says her hands match his. Find the line.","_n":"1z119","_k":"0e3a1263"}],"hints":["She says something about her hands.","“My hands are of your …”","Blood on her hands too: “My hands are of your colour” (\u003ci>Macbeth\u003c/i> 2.2.64)."]},{"id":"d4","goal":5,"prompt":"The Folio prints “Knock within” during the scene. Is that Shakespeare’s direction or an editor’s?","options":[{"t":"There is no knocking","why":"The knocking is in the early text, and the characters hear it.","_n":"20129","_k":"e7918323"},{"t":"Added by a film director","why":"The Folio was printed in 1623, long before film.","_n":"21139","_k":"ceb4b7f7"},{"t":"One of the few directions in the early text","why":"Early texts include sound cues like this. Most directions about feelings and movement were added later.","_n":"22149","_k":"c0497708"},{"t":"Added by a modern editor","why":"Most of those directions were added by editors. The early texts give almost none. The ones they do give are entrances, exits and sounds.","_n":"23159","_k":"0186be87"}],"hints":["Which kind of direction appears in the early printed texts?","Entrances, exits and sounds.","Knocking is a sound cue: original."]},{"id":"d5","goal":2,"prompt":"A director wants Lady Macbeth calm and Macbeth falling apart. Which line best supports her calm?","options":[{"t":"“A little water clears us of this deed” (\u003ci>Macbeth\u003c/i> 2.2.67)","why":"Her confidence here sets up her collapse in Act 5.","_n":"24169","_k":"15e09718"},{"t":"“Will all great Neptune’s ocean wash this blood…”","why":"That’s Macbeth, and it’s horror, not calm.","_n":"25179","_k":"a9356eb7"},{"t":"“Macbeth does murder sleep”","why":"That’s Macbeth falling apart, not her calm.","_n":"26189","_k":"cd938e83"},{"t":"None of these","why":"One of them is hers, and it sounds sure of itself.","_n":"27a9b","_k":"b2672142"}],"hints":["Which line is Lady Macbeth’s?","Which line makes the deed sound small?","“A little water clears us of this deed” (\u003ci>Macbeth\u003c/i> 2.2.67)."]},{"id":"d6","goal":2,"prompt":"Which staging is \u003cem>least\u003c/em> supported by the text?","options":[{"t":"Macbeth calmly cleans the daggers and smiles","why":"His words are full of horror. Calm smiling contradicts them. Check the words first.","_n":"28a8b","_k":"15f36397"},{"t":"Macbeth trembles holding the daggers","why":"Trembling fits his horror. Look for the choice his words contradict.","_n":"29abb","_k":"4cbf7547"},{"t":"Both freeze at the knocking","why":"The knocking does startle them. Look for the choice his words contradict.","_n":"2aaab","_k":"58dee588"},{"t":"Lady Macbeth takes the daggers from him","why":"She does take charge of them. Look for the choice his words contradict.","_n":"2ba5b","_k":"c1bab7c3"}],"hints":["Read his lines in this scene: what mood are they in?","Horror and guilt.","Calm smiling contradicts his words: “Macbeth calmly cleans the daggers and smiles” is least supported."]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","goal":[3,4,5],"student":"Quincy","instruction":"Quincy made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":5,"task":"A director’s note on 3.1","steps":["In my staging, Hamlet discovers the spies at “Where’s your father?” (\u003ci>Hamlet\u003c/i> 3.1.132–133).","Ophelia’s reply, “At home, my lord” (\u003ci>Hamlet\u003c/i> 3.1.134), then becomes a lie he recognizes.","Shakespeare’s stage directions say Hamlet sees Polonius behind the curtain here, so this is the only correct staging.","His fury afterward is a response to betrayal."],"_a":"Bg==","stepFb":["A clear, cited choice. Keep checking.","Follows from the choice. Keep checking.","","This sentence follows from an earlier mistake. Find where the reasoning first goes wrong."],"fixes":[{"t":"“Most directors do it this way, so it’s correct.”","why":"Tradition isn’t evidence.","_n":"2ca4b","_k":"ff7d94af"},{"t":"“The text gives no direction here, so this is one defensible choice; the abrupt question makes it possible.”","why":"Most of those directions were added by editors. The early texts give almost none. The text leaves gaps. Productions fill them differently. The question is which choices the words can support.","_n":"2da7b","_k":"bfdabe60"},{"t":"“Shakespeare’s directions are unclear, so any staging is fine.”","why":"Not any staging: the words still limit choices.","_n":"2ea6b","_k":"4c8ee91f"},{"t":"“Sentence 3 is fine.”","why":"There’s no such direction in the early texts.","_n":"2fa1b","_k":"d6ca38e3"}],"hints":["Did Shakespeare write that direction?","The early texts have very few.","Fix: “The text gives no direction here, so this is one defensible choice; the abrupt question makes it possible.”"]},{"id":"e2","goal":4,"task":"A review of a modern-dress film","steps":["This film moves Denmark into a modern corporation.","Because it changes the setting, it is unfaithful, and therefore a weaker \u003cem>Hamlet\u003c/em>.","Hamlet’s “Denmark’s a prison.” becomes a line about office life.","Viewers should watch a traditional version instead."],"_a":"BQ==","stepFb":["An accurate description of the setting choice. Keep checking.","","This sentence follows from an earlier mistake. Find where the reasoning first goes wrong.","This sentence follows from an earlier mistake. Find where the reasoning first goes wrong."],"fixes":[{"t":"“Because it changes the setting, it is better than older versions.”","why":"Novelty isn’t value either.","_n":"2ga0b","_k":"870b65a7"},{"t":"“It is unfaithful, but entertaining.”","why":"Still judging by fidelity alone.","_n":"2h23b","_k":"2a1260ba"},{"t":"“The new setting argues that corporate power and screens are today’s prison; its value depends on what that change reveals.”","why":"Changing the setting isn’t failure. Ask what the change makes us see.","_n":"2i24b","_k":"0c006f53"},{"t":"“Sentence 2 is fine.”","why":"Unfaithful doesn’t automatically mean weaker.","_n":"2j21b","_k":"f6c1ec1a"}],"hints":["Is fidelity the only measure?","Ask what the change makes us see.","Fix: “The new setting argues that corporate power and screens are today’s prison; its value depends on what that change reveals.”"]},{"id":"e3","goal":3,"task":"Delivery analysis","steps":["Hamlet’s “I did love you once.” (\u003ci>Hamlet\u003c/i> 3.1.115–116) is the hinge of the scene.","Whether the actor stresses “did” or “once” makes no difference, because the words are the same.","Either way, Hamlet sounds sincere.","So delivery is just a matter of style."],"_a":"BQ==","stepFb":["A reasonable claim. Keep checking.","","This sentence follows from an earlier mistake. Find where the reasoning first goes wrong.","This sentence follows from an earlier mistake. Find where the reasoning first goes wrong."],"fixes":[{"t":"“Stress only matters in poetry, not in this prose scene.”","why":"Stress shapes meaning in all speech.","_n":"2k22b","_k":"caa129d4"},{"t":"“Sentence 2 is fine.”","why":"Try saying it both ways.","_n":"2l27b","_k":"bc11c2da"},{"t":"“Stressing ‘did’ makes the line louder.”","why":"Louder, yes, but what does it \u003cem>mean\u003c/em>?","_n":"2m28b","_k":"b64c84e0"},{"t":"“Stressing ‘did’ defends a love Ophelia doubts; stressing ‘once’ declares it over, so the delivery decides the line’s meaning.”","why":"Say it again with the stress on another word. The meaning moves with the stress.","_n":"2n25b","_k":"459c49ed"}],"hints":["Say the line twice, moving the stress.","Do the two versions mean the same thing?","Fix: “Stressing ‘did’ defends a love Ophelia doubts; stressing ‘once’ declares it over, so the delivery decides the line’s meaning.”"]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which choice in the stage simulator changed the scene most for you, and why did it surprise you?"},{"id":"j2","q":"In your own words, why can two opposite stagings both be “right”? What makes a staging wrong?"},{"id":"j3","q":"Explain to a friend how to test a staging choice against the text, using one example from 3.1 or 3.4."},{"id":"j4","q":"Which adaptation would you most like to see, or make? What would your setting argue about \u003cem>Hamlet\u003c/em>?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line you’d love to perform, and note how you’d say it. (Optional.)\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write a principle about performance and meaning: something you’d tell an actor, a director or yourself before speaking in public. Add a master’s example from today and your own imitation.","placeholder":"e.g. Stress is meaning: move the weight of a sentence and you move its sense.","examples":["suit the action to the word, the word to the action (\u003ci>Hamlet\u003c/i> 3.2.19–20)","I did love you once. (\u003ci>Hamlet\u003c/i> 3.1.115–116)","How now! a rat? Dead, for a ducat, dead! (\u003ci>Hamlet\u003c/i> 3.4.23)","Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue (\u003ci>Hamlet\u003c/i> 3.2.1–2)","I must be cruel, only to be kind (\u003ci>Hamlet\u003c/i> 3.4.178)"]},"artSamples":[{"p":"Stress is meaning: move the weight of a sentence and you move its sense.","m":"“I \u003cem>did\u003c/em> love you once” vs “I did love you \u003cem>once\u003c/em>” (\u003ci>Hamlet\u003c/i> 3.1.115–116)"},{"p":"A good choice is one the words permit and the audience can feel.","m":"the stage simulator’s support m&#101;ter"}],"principleMin":6,"cpLines":["Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue","suit the action to the word, the word to the action","I did love you once.","Get thee to a nunnery: why wouldst thou be a breeder of sinners?","We are arrant knaves, all; believe none of us.","How now! a rat? Dead, for a ducat, dead!","I must be cruel, only to be kind"]},"final":{"questions":[{"id":"k1","cat":"K","goal":5,"a":{"prompt":"Most stage directions in modern editions of \u003cem>Hamlet\u003c/em> were…","options":[{"t":"invented by film directors","why":"Editions predate film.","_n":"2o26b","_k":"22afeccc"},{"t":"written in detail by Shakespeare","why":"Most of those directions were added by editors. The early texts give almost none.","_n":"2p1bb","_k":"5215731e"},{"t":"added by later editors; the early printed texts have very few","why":"The early texts give entrances, exits and a few actions.","_n":"2q1cb","_k":"6d073af5"},{"t":"translated from Danish","why":"The play was written in English.","_n":"2rd39","_k":"2074d283"}]},"b":{"prompt":"Which kind of stage direction appears in the early printed texts?","options":[{"t":"Detailed descriptions of characters’ feelings","why":"Most of those directions were added by editors. The early texts give almost none.","_n":"2sd49","_k":"1de77cb1"},{"t":"Camera angles","why":"Film terms; no cameras existed.","_n":"2td19","_k":"a542f4b7"},{"t":"Brief entrances, exits and some actions or sounds, such as “Enter Ghost”","why":"Few and brief.","_n":"2ud29","_k":"53c6bd16"},{"t":"Notes telling the audience what to think","why":"Not in the early texts.","_n":"2vcf9","_k":"8a211ec3"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which is a \u003cstrong>vocal\u003c/strong> strategy?","options":[{"t":"Lighting the Ghost","why":"A design choice.","_n":"2wd09","_k":"304980f1"},{"t":"Choosing a modern setting","why":"An adaptation choice.","_n":"2xcd9","_k":"79ac707b"},{"t":"Moving downstage","why":"Blocking, not voice.","_n":"2yce9","_k":"31079983"},{"t":"Pausing before a key word","why":"Pause is part of the voice.","_n":"2zdba","_k":"f3155549"}]},"b":{"prompt":"Which is a \u003cstrong>non-verbal\u003c/strong> cue?","options":[{"t":"Stressing the word “not”","why":"Vocal.","_n":"30dca","_k":"c005f40a"},{"t":"Cutting Fortinbras","why":"An adaptation choice.","_n":"31d9a","_k":"b88aea69"},{"t":"Speeding up the line","why":"Vocal (pace).","_n":"32d8a","_k":"0226a397"},{"t":"Turning away from Ophelia at “I loved you not.”","why":"The body speaks without words.","_n":"33dba","_k":"63bff697"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"In theatre, “blocking” means…","options":[{"t":"cutting lines from the script","why":"That’s editing or cutting.","_n":"34daa","_k":"ea5330c0"},{"t":"planning where and how actors move on stage","why":"Where people stand and move.","_n":"35dda","_k":"c1cef817"},{"t":"stopping a scene early","why":"A literal guess.","_n":"36dca","_k":"4fa77778"},{"t":"the background music","why":"Sound design.","_n":"37dfa","_k":"2ab33174"}]},"b":{"prompt":"In 3.4, Polonius hides behind “the arras”, which is…","options":[{"t":"a wall tapestry","why":"A hanging tapestry, and a good place to hide.","_n":"38dea","_k":"1c2ad84b"},{"t":"a hired spy","why":"A person, not an object.","_n":"39d1a","_k":"8e6f8ba9"},{"t":"a trapdoor","why":"A Globe feature, but not this.","_n":"3ad0a","_k":"5ca60634"},{"t":"a sword","why":"Hamlet’s weapon, not the hiding place.","_n":"3b479","_k":"8a449b60"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Which staging of 3.4 is \u003cstrong>best\u003c/strong> supported by the text?","options":[{"t":"Hamlet knows it’s Polonius and kills him deliberately","why":"His question contradicts this. Check the words first. If Hamlet asks “Is it the king?”, he can’t have known it was Polonius.","_n":"3c489","_k":"8b0bb99a"},{"t":"Polonius escapes unharmed","why":"Contradicted: he dies.","_n":"3d499","_k":"9e70e550"},{"t":"Hamlet thrusts instantly, hoping it’s the King: he asks “Is it the king?” (\u003ci>Hamlet\u003c/i> 3.4.26)","why":"His question shows his hope.","_n":"3e4a9","_k":"3fb644d2"},{"t":"Gertrude stabs Polonius","why":"Unsupported.","_n":"3f4b9","_k":"60545aed"}]},"b":{"prompt":"Which staging of 3.1 is \u003cem>least\u003c/em> supported by the text?","options":[{"t":"Ophelia glances toward the hiding place before “At home, my lord.”","why":"Possible.","_n":"3g4c9","_k":"523b11b5"},{"t":"Hamlet never notices the spies","why":"Possible.","_n":"3h4d9","_k":"e242bcad"},{"t":"Hamlet knows about the spies from his first line, even though he greets Ophelia gently (“Nymph, in thy orisons / Be all my sins remember’d.”)","why":"The gentle greeting pulls against it.","_n":"3i4e9","_k":"f9d51dea"},{"t":"Hamlet notices the spies at “Where’s your father?”","why":"Possible.","_n":"3j4f9","_k":"f0a071e5"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Lady Macbeth says “A little water clears us of this deed” (\u003ci>Macbeth\u003c/i> 2.2.67). Stressing “little” suggests…","options":[{"t":"that she is terrified","why":"The line sounds confident, not afraid.","_n":"3k509","_k":"fcc61a85"},{"t":"nothing; stress is decoration","why":"Say it again with the stress on another word. The meaning moves with the stress.","_n":"3lcd9","_k":"8fc24a3c"},{"t":"how easy she believes guilt is to remove: a confidence the play later reverses when she cannot wash away the “spot”","why":"The stress makes the deed sound small.","_n":"3mcc9","_k":"769b2261"},{"t":"that water is scarce in the castle","why":"Literal.","_n":"3ncb9","_k":"53eba17c"}]},"b":{"prompt":"Juliet asks, “wherefore art thou Romeo?” (\u003ci>Romeo and Juliet\u003c/i> 2.
