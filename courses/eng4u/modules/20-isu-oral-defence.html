<script>window.MV_PAYLOAD={"meta":{"id":"20-isu-oral-defence","nn":"20","slug":"isu-oral-defence","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 4","groupName":"Independent Study Unit (ISU)","trivium":"Rhetoric","size":"M","storageKey":"eng4u-20-isu-oral-defence-v1","progressKey":"eng4u-progress-v1:20-isu-oral-defence","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"b17a5e55","content":{"id":"20-isu-oral-defence","kind":"topic","title":"ISU oral defence","topic":"ISU Oral Defence","readyTopic":"planning and defending your ISU","hero":{"headline":"Your voice is part of your argument","text":"Hamlet coaches the actors to speak lightly and clearly, and to let every gesture fit its word. Your ISU \u003cstrong>defence\u003c/strong> asks the same: a clear \u003cstrong>thesis\u003c/strong>, a \u003cstrong>roadmap\u003c/strong> your listeners can follow, a voice that uses \u003cstrong>pace\u003c/strong>, \u003cstrong>pause\u003c/strong> and \u003cstrong>emphasis\u003c/strong> to show what matters, and answers that meet hard \u003cstrong>questions\u003c/strong> with honesty and evidence.","fig":{"html":"\u003cdiv class='dfh' id='dfh' role='group' aria-label='Hamlet’s advice to the players appears line by line: “trippingly” bounces lightly across the first line; on “action” a small figure raises a hand and on “word” a speech mark pulses. Then a lectern appears with a thesis card, three cue cards and a question mark waiting.'>\u003c/div>","caption":""},"lines":[{"t":"Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue …","bounce":"trippingly","cite":"3.2.1–2"},{"t":"suit the action to the word, the word to the action","action":"action","word":"word","cite":"3.2.19–20"}],"cite":"\u003ci>Hamlet\u003c/i> 3.2.1–2, 3.2.19–20","caption":"This module: plan it, voice it, defend it.","listen":"Listen","watch":"Watch again","noVoice":"No local voice on this device: read the lines aloud yourself."},"goals":["I can plan a defence that states my thesis, previews my argument, and fits the time limit.","I can use vocal strategies (pace, pause, emphasis, pitch, volume) and non-verbal cues to make meaning clear.","I can listen actively to a question, paraphrase it, and recognize what kind of question it is.","I can answer hard questions using acknowledge–answer–evidence–return, and concede gracefully when I should.","I can choose rhetorical appeals and audio-visual aids that suit my audience and purpose.","I can reflect on my strengths and next steps as a speaker and listener."],"start":{"blocks":[{"title":"Word story: defence","html":"\u003cp>\u003cstrong>\u003cem>Defence\u003c/em>\u003c/strong> comes from the Latin \u003cem>defendere\u003c/em>, “to ward off”. Medieval universities trained scholars through the \u003cem>disputatio\u003c/em>: a student publicly defended a thesis while opponents raised objections, and the student had to answer each one. Your ISU defence descends from it. \u003cstrong>\u003cem>Rhetoric\u003c/em>\u003c/strong> is from the Greek \u003cem>rhētorikē technē\u003c/em>, “the art of the speaker”: one of the three arts of the trivium.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Rhetorical appeals","goal":5,"prompt":"“I’ve read \u003ci>Frankenstein\u003c/i> three times and logged every scene where someone looks at the Creature.” Which appeal is this?","options":[{"t":"Kairos (timing)","why":"Kairos is fitting the moment, not stating credentials.","_n":"05c3","_k":"47328d91"},{"t":"Logos (logic)","why":"It’s not an argument from evidence yet; it’s about you.","_n":"15d3","_k":"5225ba57"},{"t":"Ethos (credibility)","why":"It shows why you’re worth listening to.","_n":"25e3","_k":"947fa8fe"},{"t":"Pathos (emotion)","why":"No feeling is being stirred; it builds trust.","_n":"3573","_k":"91bcb6c2"}],"hints":["Is it about the speaker, the feelings, or the reasoning?","It establishes the speaker’s knowledge.","Ethos."]},{"id":"w2","skill":"Rhetorical appeals","goal":5,"prompt":"“In all four rejection scenes, the pattern is the same: the Creature speaks, is seen, and is struck.” Which appeal is this?","options":[{"t":"Ethos","why":"It isn’t about the speaker’s credibility.","_n":"4583","_k":"1d5a8352"},{"t":"None; it’s just summary","why":"It draws a pattern, which is an argument.","_n":"5593","_k":"727ca1ae"},{"t":"Logos","why":"A pattern across evidence is reasoning.","_n":"65a3","_k":"62945d66"},{"t":"Pathos","why":"The subject is sad, but the move is logical.","_n":"7533","_k":"fb122972"}],"hints":["Does it appeal to reasoning?","“In all four… the pattern is…”","Logos."]},{"id":"w3","skill":"Vocal strategies","goal":2,"prompt":"What does a short pause just before a key word do?","options":[{"t":"Wastes time","why":"A one-beat pause costs almost nothing and buys attention.","_n":"8543","_k":"08b35332"},{"t":"Makes the speaker seem unprepared","why":"Planned pauses sound confident.","_n":"95d7","_k":"094581c3"},{"t":"Draws the listener’s attention to that word","why":"Silence sets up emphasis.","_n":"a5c7","_k":"2d1e37a3"},{"t":"Signals the end of the presentation","why":"Only a long, final pause does.","_n":"b5b7","_k":"3b9c9a6e"}],"hints":["What happens to the word right after silence?","Listeners lean in.","Emphasis."]},{"id":"w4","skill":"Vocal strategies","goal":1,"prompt":"Your defence is 6 minutes. At a comfortable 150 words per minute, about how long should your spoken script be?","options":[{"t":"About 1500 words","why":"That would need 250 words a minute.","_n":"c5a7","_k":"2732c5f4"},{"t":"As long as your essay","why":"A defence isn’t the essay read aloud.","_n":"d597","_k":"e2f57b67"},{"t":"About 900 words","why":"6 × 150 = 900.","_n":"e587","_k":"ba325d58"},{"t":"About 600 words","why":"That’s 4 minutes at 150.","_n":"f577","_k":"c55ec3b7"}],"hints":["Minutes × words per minute.","6 × 150.","900."]},{"id":"w5","skill":"Question types and active listening","goal":3,"prompt":"“Can you show me where in the novel that happens?” What kind of question is this?","options":[{"t":"Clarification","why":"Clarification asks what you meant, not where it is.","_n":"g567","_k":"e9f585ab"},{"t":"Extension","why":"It doesn’t ask you to go beyond your essay.","_n":"h657","_k":"693a9672"},{"t":"Counterargument","why":"It doesn’t challenge your claim.","_n":"i647","_k":"d12af2e6"},{"t":"Evidence","why":"It asks you to point to the text.","_n":"j637","_k":"de6d25e1"}],"hints":["What is the questioner asking for?","A place in the text.","Evidence."]},{"id":"w6","skill":"Question types and active listening","goal":3,"prompt":"A teacher asks a long, two-part question. What’s the best first move?","options":[{"t":"Say “Great question” and move on","why":"That’s filler, not listening.","_n":"k647","_k":"e9372db0"},{"t":"Briefly paraphrase it back to check you’ve understood both parts","why":"Paraphrasing shows listening and buys a breath.","_n":"l617","_k":"3daf473d"},{"t":"Start answering the first part immediately","why":"You may forget the second part, or answer the wrong question.","_n":"m627","_k":"d6a93ee0"},{"t":"Ask them to repeat the whole question","why":"Try a paraphrase first; ask only if you truly missed it.","_n":"n677","_k":"17bfabb6"}],"hints":["How do you prove you heard it?","Say it back in fewer words.","Paraphrase."]}],"refreshers":{"Rhetorical appeals":"\u003cstrong>Ethos:\u003c/strong> why you’re credible. \u003cstrong>Pathos:\u003c/strong> why listeners should care. \u003cstrong>Logos:\u003c/strong> why your claim follows from the evidence. \u003cstrong>Kairos:\u003c/strong> fitting the moment and audience.","Vocal strategies":"\u003cstrong>Pace:\u003c/strong> about 130–160 words per minute. \u003cstrong>Pause:\u003c/strong> before key words and after big claims. \u003cstrong>Emphasis:\u003c/strong> stress the words that carry meaning. \u003cstrong>Pitch:\u003c/strong> vary it to avoid a monotone. \u003cstrong>Volume:\u003c/strong> reach the back row.","Question types and active listening":"\u003cstrong>Clarification:\u003c/strong> what do you mean? \u003cstrong>Evidence:\u003c/strong> where does it show? \u003cstrong>Counterargument:\u003c/strong> isn’t it really…? \u003cstrong>Extension:\u003c/strong> what about…? Paraphrase before answering."}}},"explore":{"heading":"Rehearsal coach","intro":"Plan your defence, mark it for your voice, and drill the questions you’re most afraid of. Everything stays on this device.","modes":[{"id":"plan","t":"Plan"},{"id":"rehearse","t":"Rehearse"},{"id":"drill","t":"Question drill"}],"novels":[{"id":"fr","t":"\u003ci>Frankenstein\u003c/i>","title":"Frankenstein","author":"Mary Shelley"},{"id":"je","t":"\u003ci>Jane Eyre\u003c/i>","title":"Jane Eyre","author":"Charlotte Brontë"},{"id":"gg","t":"\u003ci>The Great Gatsby\u003c/i>","title":"The Great Gatsby","author":"F. Scott Fitzgerald"},{"id":"my","t":"My novel"}],"segs":[{"id":"open","t":"Opening (hook)","def":30},{"id":"thesis","t":"Thesis and roadmap","def":20},{"id":"c1","t":"Claim 1","def":60,"claim":true},{"id":"c2","t":"Claim 2","def":60,"claim":true},{"id":"c3","t":"Claim 3","def":60,"claim":true,"opt":true},{"id":"close","t":"Why it matters / closing","def":30},{"id":"invite","t":"Invitation to questions","def":10}],"layouts":[{"id":"quote","t":"Quotation"},{"id":"image","t":"Image placeholder"},{"id":"title","t":"Title"}],"review":["Eye contact","Pace","Pauses at key moments","Varied pitch","Gestures that fit the words","Cue notes, not reading"],"levels":["Not yet","Getting there","Got it"],"tools":[{"id":"pause","t":"Pause /"},{"id":"stress","t":"Stress (underline)"},{"id":"slow","t":"Slow down ~"}],"para":"Shelley never lets us see the Creature the way the villagers do. We hear him first. And by the time anyone screams, we already know what they refuse to know: that the monster has been listening, learning, and hoping.","recLabel":"Not saved. Gone when you leave.","noVoice":"No local voice on this device, so Listen is hidden: read it aloud yourself and use the timing marks.","types":[{"id":"clar","t":"Clarification"},{"id":"ev","t":"Evidence"},{"id":"counter","t":"Counterargument"},{"id":"ext","t":"Extension"}],"moves":[{"id":"ack","t":"Acknowledge","role":"syntax"},{"id":"ans","t":"Answer","role":"figure"},{"id":"ev","t":"Evidence","role":"image"},{"id":"ret","t":"Return","role":"ret"}],"bank":[{"id":"q1","type":"clar","t":"What exactly do you mean by the key word in your thesis?"},{"id":"q2","type":"clar","t":"When you say [claim], what do you mean?"},{"id":"q3","type":"clar","t":"Can you put your thesis about [title] into one simpler sentence?"},{"id":"q4","type":"clar","t":"Is your argument about what [author] intended, or about what the text does?"},{"id":"q5","type":"clar","t":"Could you explain your roadmap again? I lost the second step."},{"id":"q6","type":"clar","t":"Which character’s point of view do you mean in your second claim?"},{"id":"q7","type":"ev","t":"Where in [title] do you see your claim most clearly?"},{"id":"q8","type":"ev","t":"Can you read us the line that best supports [claim]?"},{"id":"q9","type":"ev","t":"Which scene in [title] would you point to first?"},{"id":"q10","type":"ev","t":"Is there a pattern across the novel, or just one moment?"},{"id":"q11","type":"ev","t":"What does [author] actually write at that moment?"},{"id":"q12","type":"ev","t":"Which detail in the text convinced you of this?"},{"id":"q13","type":"counter","t":"Isn’t your thesis just your opinion?"},{"id":"q14","type":"counter","t":"Couldn’t a reader argue the opposite about [title]?"},{"id":"q15","type":"counter","t":"Doesn’t the ending of [title] work against your reading?"},{"id":"q16","type":"counter","t":"Aren’t you reading too much into one scene?"},{"id":"q17","type":"counter","t":"Wouldn’t [author]’s first readers have seen it differently?"},{"id":"q18","type":"counter","t":"Isn’t the narrator unreliable, which weakens your evidence?"},{"id":"q19","type":"ext","t":"How might your reading apply to the world today?"},{"id":"q20","type":"ext","t":"Would your argument hold for another book by [author]?"},{"id":"q21","type":"ext","t":"How might a film adaptation of [title] change your argument?"},{"id":"q22","type":"ext","t":"What would a critic you read say about your thesis?"},{"id":"q23","type":"ext","t":"If you had another month, where would you take this argument?"},{"id":"q24","type":"ext","t":"How does [title] compare with another text from this course?"}],"typeFb":{"clar":"It asks what you \u003cem>mean\u003c/em>.","ev":"It asks \u003cem>where\u003c/em> in the text.","counter":"It offers a competing reading: “isn’t it…?”","ext":"It asks you to go \u003cem>further\u003c/em>: “what about…?”"},"tc3q":"Isn’t the Creature just a murderer? Why should we sympathize with him at all?","tc3chips":[{"id":"c1","t":"That’s a fair challenge: he does kill, and the novel never hides it."},{"id":"c2","t":"No, you’re wrong; he’s innocent."},{"id":"c3","t":"My argument isn’t that he’s innocent, but that Shelley shows us how he became violent."},{"id":"c4","t":"Each killing follows an abandonment: William dies after the cottagers drive the Creature away and a man shoots him for saving a girl from the river."},{"id":"c5","t":"So the question the novel leaves is not whether he’s guilty but who made him so, which is exactly my thesis about rejection as a verdict."},{"id":"c6","t":"Maybe you’re right and my thesis doesn’t work."}],"tc3key":{"_a":"ORNUUBdJF1ZRExtDVlEXGUBSAkNo"},"tc1key":{"_a":"GRNDDkEEWRdYagRSBUkGDFJsG0NaFVBbQAtsUABJAQA/HRUVXQBGXBETDToGVRkDUmwbQ1YJVFwPEw06A1UZBFABak0XBllaEVQVW25XBRlUAWpNFwxbQwtFUkMPPgAZUAFqHA=="},"p1":{"sentence":"We hear the Creature before anyone sees him.","pauseBefore":1},"p2":{"para":"In Frankenstein, the Creature’s first words are not a threat but a plea. He watches the cottagers for months, learns their language, and rehearses what he will say before he dares to knock. When the old man listens, there is hope. When the young people see him, there is only fear, and the door closes on everything he has learned."},"p4":{"q":"Isn’t your thesis just your opinion?","a1":"No, it’s not, it’s in the book.","a2":"Every reading is an interpretation, so here’s why mine is the strongest the text supports: in all four rejection scenes…"},"aha":"A defence is designed \u003cstrong>time first\u003c/strong>: the clock decides how much you can say, so you choose the \u003cem>best\u003c/em> evidence, not all of it. Then the voice and the answers carry the argument.","predIntro":"Make a prediction first. Then the coach plays it out: listen and compare, and watch the audience.","predictions":[{"id":"p1","prompt":"Rehearse mode: “We hear the Creature before anyone sees him.” Version 1 is read straight through; version 2 pauses for one beat before “hear”. What changes?","options":[{"t":"“Hear” stands out; listeners notice the contrast with “sees”","_n":"o687","_k":"e95a852b"},{"t":"It makes the sentence harder to follow","_n":"p657","_k":"bbca428a"},{"t":"It sounds unprepared","_n":"q667","_k":"30cee308"},{"t":"Nothing; pauses don’t change meaning","_n":"r5b7","_k":"2291b93e"}],"explain":"A planned pause is a spotlight."},{"id":"p2","prompt":"The same 60-word paragraph is read at 150 words per minute, then at 200. Predict how much listeners remember.","options":[{"t":"More at 200 wpm, because it’s shorter","_n":"s5c7","_k":"d980081a"},{"t":"The same","_n":"t697","_k":"b5d4ef8a"},{"t":"More at 200 wpm, because more energy","_n":"u687","_k":"98e6b076"},{"t":"Less at 200 wpm; they can’t keep up with the ideas","_n":"v6b7","_k":"892eb620"}],"explain":"Speed feels efficient to the speaker and exhausting to the listener. Cut words, not breaths."},{"id":"p3","prompt":"Two stills. In one, the speaker’s eyes are on a full script; in the other, on the audience, with a cue card in hand. Which speaker will the audience trust more on a hard question?","options":[{"t":"The script reader, because nothing will be forgotten","_n":"w6a7","_k":"d01c7a49"},{"t":"The one using cue cards and meeting their eyes","_n":"x657","_k":"53d73575"},{"t":"The one reading the full script, who looks more prepared","_n":"y647","_k":"2e2135d6"},{"t":"No difference","_n":"z677","_k":"b3a2ea92"}],"explain":"Reading a script word for word turns a conversation into a recital."},{"id":"p4","prompt":"Question drill, a counterargument: “Isn’t your thesis just your opinion?” Answer 1: “No, it’s not, it’s in the book.” Answer 2: “Every reading is an interpretation, so here’s why mine is the strongest the text supports: in all four rejection scenes…” Which builds more ethos?","options":[{"t":"Answer 1","_n":"10667","_k":"5b4f199e"},{"t":"Neither","_n":"11617","_k":"258a8e10"},{"t":"Answer 2","_n":"12607","_k":"88dfdca5"},{"t":"Both equally","_n":"135f6","_k":"4869c013"}],"explain":"Acknowledging the fair point and then answering with evidence turns a challenge into your stage."}],"chalIntro":"Use the coach to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"\u003cstrong>Budget a 6-minute defence.\u003c/strong> In Plan mode, with the time limit at 6 minutes, set the seconds for each segment (2 or 3 claims). \u003cbutton type='button' class='btn ghost sm df-setup' data-setup='tc1'>Set it up\u003c/button>","why":"Every segment has room to work, and the whole thing fits the clock. That’s a defence designed time first.","msgs":{"over":"Over time. Trim a claim, not the thesis.","under":"Under time. Give your claims room to show their evidence.","thesis":"Your listeners need the map before the journey.","thesisHi":"The thesis and roadmap need 30–60 s; past a minute, the map becomes the journey.","claim":"Under a minute, a claim can’t show its evidence.","claimHi":"Over two minutes, a claim stops being the best evidence and becomes all of it.","open":"The hook is eating your argument.","openLo":"Give the hook at least 15 s to land.","close":"Closing needs 20–60 s: long enough to land, short enough to leave time for questions.","invite":"Invite questions in 5–20 s.","limit":"Set the time limit to 6 minutes first."},"hints":["Start with the claims: about a minute and a half each.","Thesis and roadmap need 30–60 s, closing 20–60 s.","Try 30 / 45 / 85 / 85 / 85 / 30 / 10."]},{"id":"tc2","goal":2,"prompt":"\u003cstrong>Mark this paragraph for your voice.\u003c/strong> In Rehearse mode, with the practice paragraph, mark the stresses and pauses that make its meaning audible (no more than 6 stresses). \u003cbutton type='button' class='btn ghost sm df-setup' data-setup='tc2'>Set it up\u003c/button>","why":"See and hear now contrast out loud, “refuse” lands, and the colon’s drumroll sets up the reveal.","msgs":{"many":"When everything is stressed, nothing is.","colon":"The colon is a drumroll. Let it sound.","hear":"The paragraph turns on see vs hear. Make the contrast audible.","see":"The paragraph turns on see vs hear. Make the contrast audible: stress both.","refuse":"“refuse” is the verdict in the sentence. Lean on it.","hoping":"Hold one beat before “and hoping”: the last word is the one that hurts."},"hints":["Which two verbs contrast?","Where does the sentence hold its breath before the reveal?","Stress see, hear and refuse; pause after “know:” and before “and hoping”."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>Build an answer to a counterargument question.\u003c/strong> In Question drill, use the answer builder: “Isn’t the Creature just a murderer? Why should we sympathize with him at all?” Put the right chips in order. \u003cbutton type='button' class='btn ghost sm df-setup' data-setup='tc3'>Set it up\u003c/button>","why":"Acknowledge, answer, evidence, return: a fair concession, the question actually answered, the text, and the thesis last, where listeners remember it.","msgs":{"c2":"That’s a wall, not an answer.","c6":"Conceding a point isn’t surrendering your thesis.","c4":"Where’s the text? An answer without evidence is an opinion.","c5":"Return to your thesis at the end; that’s where listeners remember it.","empty":"Tap chips to build your answer.","order":"Four moves, in order: acknowledge, answer, evidence, return."},"hints":["Four moves: acknowledge, answer, evidence, return.","Which chip admits what’s true without giving up?","c1, c3, c4, c5."]}]},"part3":{"slug":"hard-question","name":"Hard questions","heading":"Handling the hard question","intro":"Hard questions test whether you can listen and respond in the moment. These four stations work on that: listen first, use the four moves, say “I don’t know” well, and let your body show calm. How you answer is part of what your answer means.","stations":{"s1":{"q":"So you’re saying the Creature is the victim, but then wouldn’t that mean Victor is the villain, and if so why does Shelley give him the whole frame narrative, and doesn’t that make us side with him?","options":[{"t":"“You think Victor is the villain.”","why":"Too narrow. A good paraphrase names the real challenge in one sentence.","_n":"14606","_k":"dcd93843"},{"t":"“You disagree with me.”","why":"That’s not a paraphrase. A good paraphrase names the real challenge in one sentence.","_n":"15616","_k":"5a127cd7"},{"t":"“You’re asking whether giving Victor the frame makes us side with him, which would undercut my reading of the Creature as wronged.”","why":"Right. A good paraphrase names the real challenge in one sentence.","_n":"16626","_k":"534eb130"},{"t":"“You’re asking about the narrative frame.”","why":"Too vague. A good paraphrase names the real challenge in one sentence.","_n":"17636","_k":"d187f757"}]},"s2":{"answers":[{"id":"a","t":"Concede and narrow","parts":[{"m":"ack","t":"Yes, the frame is Victor’s, and Shelley lets him plead his case at length."},{"m":"ans","t":"But notice it’s told to Walton, who is about to repeat Victor’s mistake, so the frame puts Victor on trial, not on a throne."},{"m":"ev","t":"And inside it, the Creature’s own story takes over: “I was benevolent and good; misery made me a fiend” (Shelley, ch. 10)."},{"m":"ret","t":"So the frame doesn’t make us side with Victor; it makes us judge him, which is exactly my reading of the Creature as wronged."}]},{"id":"b","t":"Reframe respectfully","parts":[{"m":"ack","t":"That’s a real question, because Victor does narrate most of the novel."},{"m":"ans","t":"I’d put it slightly differently: the frame lets us watch Victor fail to listen."},{"m":"ev","t":"Even as he tells it, he repeats the Creature’s plea word for word, “Make me happy, and I shall again be virtuous” (Shelley, ch. 10), and still, in the end, breaks his promise to him."},{"m":"ret","t":"So the frame works against Victor, and that supports my reading of the Creature as wronged."}]},{"id":"c","t":"Turn into extension","parts":[{"m":"ack","t":"That’s exactly where my argument goes next."},{"m":"ans","t":"If Victor holds the frame, the real question becomes whose story we trust, and I think Shelley makes us trust the voice he tried to silence."},{"m":"ev","t":"The novel ends not with Victor but with the Creature speaking to Walton over Victor’s body."},{"m":"ret","t":"So the frame hands the story back to the Creature, which strengthens my thesis instead of undercutting it."}]}],"tagIdx":0,"ok":"✓ All four moves found. Now open the other two answers: same moves, different strategies.","bad":"Not yet. Ask of each sentence: does it admit, reply, point to the text, or come back to the thesis?"},"s3":{"q":"How would your reading change if you compared \u003ci>Frankenstein\u003c/i> with Mary Shelley’s later novel \u003ci>The Last Man\u003c/i>?","r1":"Well, that’s a really interesting question about \u003ci>The Last Man\u003c/i>. I think it would probably be quite similar, because Shelley’s novels are all about similar things, so my reading would basically apply there too, in a lot of ways.","r2":"I haven’t explored that directly; here’s how I’d begin: I’d look at the scenes where a survivor is left with no one to listen, because my thesis predicts that Shelley treats isolation as a verdict passed by others.","why":[{"t":"It’s honest about what you know, and it still shows how you’d think the question through.","why":"Right. An honest bridge keeps ethos: it trades a bluff for a method.","_n":"18646","_k":"42983d98"},{"t":"It sounds more confident.","why":"Not quite. The bluff sounds confident too; listeners trust the one that’s honest and specific.","_n":"19656","_k":"96adb8e7"},{"t":"It’s longer.","why":"Not quite. Length isn’t the point; the honest bridge names what you’d examine and why.","_n":"1a666","_k":"fd025640"},{"t":"It avoids the question.","why":"Not quite. It answers the question by naming where you’d start.","_n":"1b576","_k":"fbbbb17f"}],"pickOk":"Right: the honest bridge (response 2). Now say why.","pickBad":"Not quite. Response 1 repeats the question, stays vague and cites nothing. Bluffing costs ethos."},"s4":{"stances":[{"id":"cross","t":"Arms crossed"},{"id":"open","t":"Hands loose and open"},{"id":"notes","t":"Eyes on notes"},{"id":"eyes","t":"Eyes on the questioner"}],"reads":[{"id":"defensive","t":"Defensive"},{"id":"open","t":"Open"},{"id":"hiding","t":"Hiding"},{"id":"engaged","t":"Engaged"}],"key":{"_a":"GRNUE1oWRhdYE1MEUwBbRgtHUkMZR1pFB18VWxcKRVAMExtDWwpBUBETDUNdDFFcDFYVTRcATFAREw1DUAtSVAVUU0NI"},"tip":"Breathe before you answer. A two-second pause after a hard question reads as thoughtfulness, not panic."}},"blocks":[{"title":"Craft → meaning","html":"\u003cp>How you answer \u003cem>is\u003c/em> part of your argument. A calm, fair, evidence-based answer says your reading can survive pressure; that’s the strongest proof a thesis can have.\u003c/p>"}],"quickCheck":{"title":"Hard questions: quick check","summary":"Hard questions quick check","items":[{"id":"q1","goal":3,"prompt":"The best first move when you’re unsure what was asked?","choices":[{"t":"Answer what you prepared","fb":"Check the target before you aim.","_n":"1c586","_k":"fb994d5d"},{"t":"Say “Great question”","fb":"Check the target before you aim.","_n":"1de56","_k":"b758b74f"},{"t":"Change the subject","fb":"Check the target before you aim.","_n":"1ee46","_k":"5a92f40b"},{"t":"Paraphrase it back","fb":"Right. Say it back in one sentence, then answer.","_n":"1fe36","_k":"9fa3cdd4"}]},{"id":"q2","goal":4,"prompt":"Which move admits what’s fair in a challenge?","choices":[{"t":"Evidence","fb":"Acknowledge first; it lowers the temperature.","_n":"1ge26","_k":"a518d8d3"},{"t":"Return","fb":"Acknowledge first; it lowers the temperature.","_n":"1he96","_k":"75ff75ff"},{"t":"Answer","fb":"Acknowledge first; it lowers the temperature.","_n":"1ie86","_k":"596bdb93"},{"t":"Acknowledge","fb":"Right. Acknowledge first; it lowers the temperature.","_n":"1je76","_k":"b0b8d8d4"}]},{"id":"q3","goal":4,"prompt":"You don’t know the answer to an extension question. The best response?","choices":[{"t":"Repeat your thesis louder","fb":"An honest bridge keeps ethos.","_n":"1ke66","_k":"b9c04f9b"},{"t":"Invent a confident answer","fb":"An honest bridge keeps ethos.","_n":"1ldd6","_k":"f4e17895"},{"t":"Refuse to answer","fb":"An honest bridge keeps ethos.","_n":"1mdc6","_k":"cd399743"},{"t":"Name what you’d examine and why","fb":"Right. An honest bridge keeps ethos.","_n":"1neb6","_k":"70273cb5"}]},{"id":"q4","goal":2,"prompt":"What does a two-second pause before a hard answer signal?","choices":[{"t":"Panic","fb":"A breath is composure, not weakness.","_n":"1oec6","_k":"8ec1c98e"},{"t":"Thoughtfulness","fb":"Right. A breath is composure, not weakness.","_n":"1pe96","_k":"44e045f4"},{"t":"Disrespect","fb":"A breath is composure, not weakness.","_n":"1qea6","_k":"de1f9cd6"},{"t":"That you didn’t hear","fb":"A breath is composure, not weakness.","_n":"1re76","_k":"81bdbc7f"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“The world will little note, nor long remember what we say here, but it can never forget what they did here.”\u003c/p>\u003cp class='eng-cite'>Abraham Lincoln, Gettysburg Address, 1863\u003c/p>\u003cp>\u003cstrong>What makes it work:\u003c/strong> antithesis. “What we say” is balanced against “what they did”, and “little note, nor long remember” against “never forget”. The contrast does the persuading.\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> write the closing line of your defence as a balanced contrast. For example: “Shelley’s question isn’t what the Creature is, but what we make of him.” Save it to your commonplace book.\u003c/p>","prompt":"My closing line, as a balanced contrast"}]},"practice":{"activities":[{"id":"name","type":"sorter","title":"Name the question","summary":"Name the question","goal":3,"noun":"question","txt":true,"instruction":"Sort each question into the kind of question it is.","boxes":[{"id":"clar","label":"Clarification","sub":"what do you mean?"},{"id":"ev","label":"Evidence","sub":"where?"},{"id":"counter","label":"Counterargument","sub":"isn’t it…?"},{"id":"ext","label":"Extension","sub":"what about…?"}],"items":[{"id":"n1","t":"“What do you mean by ‘verdict’ in your thesis?”","_a":"QFJbAEdH","why":"It asks what a word in your thesis means.","hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “What do you mean”.","Clarification: it asks what you meant by a term."]},{"id":"n2","t":"“Where does the novel show the cottagers judging his face, not his words?”","_a":"QFRBQw==","why":"It asks where in the text.","hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “Where does the novel show”.","Evidence: it asks for a place in the text."]},{"id":"n3","t":"“Couldn’t the Creature’s crimes mean he was always dangerous?”","_a":"QFJYFFsRUEdA","why":"It offers a competing reading.","hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “Couldn’t… mean”.","Counterargument: it proposes a different reading."]},{"id":"n4","t":"“How might your reading apply to the way we treat newcomers today?”","_a":"QFRPFRc=","why":"It takes the argument beyond the novel.","hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “apply to… today”.","Extension: it asks you to take the argument further."]},{"id":"n5","t":"“When you say ‘care’, do you mean love or responsibility?”","_a":"QFJbAEdH","why":"It asks what a term means.","wrong":{"ev":"It asks about the meaning of your term, not about the text."},"hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “do you mean”.","Clarification: it asks which meaning of “care” you intend."]},{"id":"n6","t":"“Which line best supports your second claim?”","_a":"QFRBQw==","why":"It asks you to point to the text.","hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “Which line”.","Evidence: it asks for a line from the text."]},{"id":"n7","t":"“Doesn’t Victor’s suffering make him sympathetic too?”","_a":"QFJYFFsRUEdA","why":"It offers a competing reading.","hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “Doesn’t… make”.","Counterargument: it pushes back on your reading."]},{"id":"n8","t":"“Would your thesis hold for the 1818 edition as well as the 1831?”","_a":"QFRPFRc=","why":"It asks you to take the argument further.","wrong":{"counter":"It doesn’t dispute you. It asks you to take the argument further."},"hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “Would your thesis hold for”.","Extension: it asks whether the argument reaches another edition."]},{"id":"n9","t":"“Isn’t the frame narrative designed to make us side with Victor?”","_a":"QFJYFFsRUEdA","why":"It offers a competing reading.","wrong":{"clar":"It isn’t asking what you meant; it’s offering a competing reading."},"hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “Isn’t… designed to”.","Counterargument: it offers a competing reading of the frame."]},{"id":"n10","t":"“Can you read us the moment you’re describing?”","_a":"QFRBQw==","why":"It asks for the text itself.","hints":["Is it asking what, where, isn’t-it, or what-about?","Underline the key verb or phrase: “read us the moment”.","Evidence: it asks you to show the text."]}]},{"id":"pressure","type":"mc","title":"Defence under pressure","summary":"Defence under pressure","star":true,"goal":[1,2,4,5],"instruction":"Choose the best move in each situation. Items marked ★ are non-routine; the last two go beyond the Final Check.","items":[{"id":"s1","goal":4,"prompt":"A questioner asks: “Isn’t your reading just your opinion?”","options":[{"t":"“No. It’s simply what the book says.”","why":"A wall, not an answer: concede what’s true, then show the evidence.","_n":"1se86","_k":"4fec4fbd"},{"t":"“Good question. Anyway, my third claim…”","why":"That dodges the question asked.","_n":"1te56","_k":"1175af9f"},{"t":"“Yes, it’s my opinion, so it can’t be wrong.”","why":"That ends the conversation and gives up logos.","_n":"1ue66","_k":"dfdf7f69"},{"t":"“Every reading is an interpretation. Here’s why mine is the one the text best supports: in all four rejection scenes, the verdict comes before any act.”","why":"It concedes the fair point and answers with evidence.","_n":"1ve36","_k":"f5f963e4"}],"hints":["Is there anything fair in the challenge?","Concede it, then reach for the text.","Every reading is an interpretation; here’s the evidence for mine."]},{"id":"s2","goal":1,"prompt":"Your script is 1050 words; the limit is 6 minutes at 150 wpm. What do you do?","options":[{"t":"Cut about 500 words to be safe.","why":"That leaves 550 words, under 4 minutes: too short.","_n":"1we46","_k":"f60cfa45"},{"t":"Speak faster to fit it in.","why":"That’s 175 wpm, and listeners fall behind.","_n":"1xd16","_k":"0aa97b58"},{"t":"Leave it; the limit is only a guide.","why":"Running over cuts into the questions, which carry the defence.","_n":"1yd06","_k":"d454a998"},{"t":"Cut about 150 words: 6 × 150 = 900.","why":"1050 − 900 = 150.","_n":"1zd36","_k":"239d291b"}],"hints":["How many words fit in 6 minutes?","6 × 150 = 900.","1050 − 900 = 150: cut about 150 words."]},{"id":"s3","goal":4,"prompt":"A questioner says, “I didn’t follow your second claim.”","options":[{"t":"Repeat the whole section word for word.","why":"The same words won’t land better the second time.","_n":"20d26","_k":"f02109ae"},{"t":"Say it was in the essay.","why":"The defence is the conversation; the questioner is asking you now.","_n":"21d56","_k":"2c9a6580"},{"t":"Restate the claim in one sentence, then give the single clearest example.","why":"New, simpler words plus one example.","_n":"22d46","_k":"5eb9c9dd"},{"t":"Move on to the third claim.","why":"An unanswered question looks like a dodge.","_n":"23d76","_k":"ebd5d4b0"}],"hints":["Why didn’t it land the first time?","Use fewer, plainer words.","One-sentence restatement, one clear example."]},{"id":"s4","goal":5,"prompt":"★ Choose the best slide for claim 2.","options":[{"t":"A blank slide with only the word “Claim 2”.","why":"It shows nothing to point at; one quotation would.","_n":"24d66","_k":"ddbf056e"},{"t":"Five quotations in small type, so nothing is missed.","why":"Clutter: the audience can’t tell which one matters.","_n":"25d96","_k":"b62f1c08"},{"t":"One quotation, large, with its key word highlighted; you speak the analysis.","why":"One idea on the slide; the analysis is yours to say.","_n":"26d86","_k":"360e5555"},{"t":"The full paragraph of your essay on the slide.","why":"The audience reads instead of listening.","_n":"27e75","_k":"d0c7c672"}],"hints":["What should the audience look at while you talk?","One thing to point at.","One large quotation with its key word highlighted."]},{"id":"s5","goal":3,"prompt":"★ A two-part question: “Is Victor the villain, and if not, who is?”","options":[{"t":"Answer only the more interesting part.","why":"Unanswered halves look like dodges.","_n":"28e85","_k":"0be15d62"},{"t":"Answer the second part first, without saying so.","why":"Listeners lose track; signpost the parts out loud.","_n":"29e95","_k":"9ebc0cbe"},{"t":"Signpost: “Two parts: first, Victor isn’t a simple villain because…; second, the novel locates blame in…”, then answer both in order.","why":"Naming the parts shows you heard both, and keeps you on track.","_n":"2aea5","_k":"cb6988d1"},{"t":"Ask the questioner to choose one part.","why":"You can answer both; name the parts and take them in order.","_n":"2be35","_k":"48e218d3"}],"hints":["How many questions are inside that one?","Name the parts before answering.","Signpost, then answer both."]},{"id":"s6","goal":2,"prompt":"★ Your defence will be on video, not in a room. The best adjustment?","options":[{"t":"Read your script; no one can see your notes.","why":"Eyes dropping to a script read clearly on camera.","_n":"2ce45","_k":"7d1d1c65"},{"t":"Change nothing; a defence is a defence.","why":"Kairos: fit the moment. Video loses the room, so make up for it.","_n":"2de55","_k":"3191b697"},{"t":"Look at the camera when making key points, slow down slightly, and signpost more explicitly, since you can’t read the room.","why":"Camera contact, pace and signposts replace what the room would give you.","_n":"2ee65","_k":"32a73d6a"},{"t":"Speak faster, because video feels slow.","why":"Speed fights understanding on video too.","_n":"2fdf5","_k":"bacf0575"}],"hints":["What’s lost on video?","Eye contact means camera contact.","Camera, pace, signposts."]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Yannick","goal":[1,3,4],"instruction":"Yannick recorded three parts of a practice defence on \u003ci>The Great Gatsby\u003c/i>. Each has one flaw. Tap the sentence where the \u003cstrong>first\u003c/strong> flaw appears, then choose the fix.","how":"","problems":[{"id":"e1","goal":1,"task":"Opening","steps":["“Picture a man alone on his lawn at night, reaching toward a light across the water.”","“My thesis is that Fitzgerald presents Gatsby’s dream as a faith that survives by refusing evidence.”","“I’ll show this through the parties, the green light, and the final image of the current.”","“So now I’m going to read my essay, starting from the introduction.”","“Paragraph one begins…”"],"_a":"UQ==","stepFb":["A vivid hook. Keep checking.","A clear thesis.","A roadmap with three stops.","","This follows from the mistake in sentence 4."],"fixes":[{"t":"“Speak each claim from a cue card: one claim, the best quotation, and why it matters, with eyes on the audience.”","why":"The essay is the evidence; the defence is the conversation.","_n":"2ge05","_k":"896c3bda"},{"t":"“Sentence 4 is fine.”","why":"A defence discusses the argument; it doesn’t recite the essay.","_n":"2hed5","_k":"b6e82966"},{"t":"“Put the essay on slides and read those.”","why":"That’s still a recital.","_n":"2iec5","_k":"b315a490"},{"t":"“Read faster so the whole essay fits.”","why":"That doubles the problem.","_n":"2jeb5","_k":"c18e02ce"}],"hints":["Which sentence turns a conversation into a recital?","A defence isn’t a reading.","Sentence 4."]},{"id":"e2","goal":3,"task":"Answer to “Where does the novel show Gatsby refusing evidence?”","steps":["“You’re asking for the moment the dream meets the facts and won’t bend.”","“That’s a really good question.”","“Fitzgerald himself had a complicated relationship with wealth and with Zelda.”","“So that’s why the dream matters to him.”"],"_a":"UA==","stepFb":["An accurate paraphrase.","Brief courtesy; fine.","","This follows from the drift in sentence 3."],"fixes":[{"t":"“Sentence 3 is fine.”","why":"The question asked \u003cem>where in the novel\u003c/em>; biography isn’t the novel.","_n":"2kea5","_k":"1e25d67c"},{"t":"“Point to the text: when Nick warns that the past can’t be repeated, Gatsby insists, ‘Why of course you can!’ (Fitzgerald, ch. 6).”","why":"It answers the question asked: where in the novel.","_n":"2le95","_k":"53a05dc0"},{"t":"“Say ‘I’m not sure’ and stop.”","why":"You do have evidence; use it.","_n":"2me85","_k":"84d9193f"},{"t":"“Add more biography about Fitzgerald.”","why":"That answers a question no one asked.","_n":"2ne75","_k":"0dad105b"}],"hints":["What did the question ask for?","A place in the text.","Sentence 3."]},{"id":"e3","goal":4,"task":"Answer to “Doesn’t Daisy’s choice prove the dream was simply foolish?”","steps":["“That’s fair; Daisy doesn’t choose Gatsby, and the novel lets that sting.”","“So you’re right, and my whole thesis falls apart.”","“I guess the dream was just foolish.”","“Thanks for the question.”"],"_a":"Uw==","stepFb":["A clean acknowledgement.","","This follows from the surrender in sentence 2.","Courteous, but the answer is already lost."],"fixes":[{"t":"“Insist Daisy secretly loved him more.”","why":"Arguing against the text loses logos.","_n":"2oe65","_k":"ae3a5767"},{"t":"Concede the point, then answer: “But my thesis is that the dream survives \u003cem>by refusing\u003c/em> evidence; Daisy’s choice is the evidence it refuses, which is why the final image is of boats still beating on.”","why":"Concede the point, not the argument.","_n":"2pe55","_k":"fe71e028"},{"t":"“Sentence 2 is fine.”","why":"Acknowledging a point isn’t the same as abandoning your thesis.","_n":"2qe45","_k":"5c37a4ff"},{"t":"“Change the subject to the parties.”","why":"That dodges the question.","_n":"2r71c","_k":"3e815b0d"}],"hints":["Where does fair acknowledgement turn into surrender?","Concede the point, not the argument.","Sentence 2."]}]}]},"reflect":{"journal":[{"id":"j1","q":"When you heard your own voice (or read your timing data), what surprised you most about how you speak?"},{"id":"j2","q":"In your own words, why is acknowledging a fair objection stronger than ignoring it?"},{"id":"j3","q":"Explain to a friend how you’d handle a question you can’t answer, without bluffing."},{"id":"j4","q":"What’s your biggest delivery habit to work on (pace, eye contact, filler words, reading), and what exactly will you practise before the real defence?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save the line from your novel you most want to say aloud in your defence, and mark where you’ll pause (type a / at each pause).\u003c/p>\u003cdiv id='df-cp'>\u003c/div>"}],"art":{"intro":"Write one principle about speaking or answering that you now believe. Choose a line from this module (Hamlet’s advice, Lincoln’s antithesis, or a model answer) that shows it, and write your own spoken-style sentence that uses it.","placeholder":"e.g. Answer the question asked, then return to your thesis.","examples":["Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue","suit the action to the word, the word to the action","The world will little note, nor long remember what we say here, but it can never forget what they did here.","I haven’t explored that directly; here’s how I’d begin"]},"artSamples":[{"p":"Answer the question asked, then return to your thesis.","m":"“So the frame doesn’t make us side with Victor; it makes us judge him, which is exactly my reading of the Creature as wronged.” (model answer)"},{"p":"Pause before the word you want remembered.","m":"“suit the action to the word, the word to the action” (\u003ci>Hamlet\u003c/i> 3.2.19–20)"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":5,"a":{"prompt":"“In every one of the six scenes where Gatsby mentions Daisy, he speaks of the past.” Which appeal does this rely on most?","options":[{"t":"Pathos","why":"The topic is emotional, but the move is logical.","_n":"2s70c","_k":"627be715"},{"t":"Kairos","why":"It’s not about timing or occasion.","_n":"2t73c","_k":"2f56f22d"},{"t":"Logos","why":"A pattern across the evidence is reasoning.","_n":"2u72c","_k":"633ac672"},{"t":"Ethos","why":"It’s not about the speaker’s credibility.","_n":"2v6dc","_k":"e94c9c67"}]},"b":{"prompt":"“Having taught myself to read the novel’s drafts, I noticed details most readers miss.” Which appeal does this rely on most?","options":[{"t":"Ethos","why":"It establishes the speaker’s credibility.","_n":"2w6cc","_k":"d0166aae"},{"t":"Logos","why":"No reasoning from evidence yet.","_n":"2x6fc","_k":"01d49c3b"},{"t":"Kairos","why":"It’s not about the moment.","_n":"2y6ec","_k":"be0b3549"},{"t":"Pathos","why":"No emotion is being stirred.","_n":"2z79c","_k":"49a1130d"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Deliberately slowing down for an important sentence is a change in…","options":[{"t":"pace","why":"Pace is speed.","_n":"3078c","_k":"34c1b62e"},{"t":"posture","why":"Posture is non-verbal.","_n":"316bc","_k":"84173865"},{"t":"pitch","why":"Pitch is how high or low the voice is.","_n":"326cc","_k":"4899f757"},{"t":"volume","why":"Volume is loudness.","_n":"3369c","_k":"05b9d48c"}]},"b":{"prompt":"Letting your voice rise and fall to avoid a monotone is a change in…","options":[{"t":"pitch","why":"Pitch is how high or low the voice is.","_n":"346ac","_k":"33425818"},{"t":"gesture","why":"Gesture is non-verbal.","_n":"356fc","_k":"5eb6f8bd"},{"t":"volume","why":"Volume is loudness.","_n":"3670c","_k":"98ca706f"},{"t":"pace","why":"Pace is speed.","_n":"376dc","_k":"41a2509d"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"“How might your reading change if the novel were told by Daisy?” What type of question is this?","options":[{"t":"Extension","why":"It asks you to take the argument further.","_n":"386ec","_k":"5d53f650"},{"t":"Clarification","why":"It doesn’t ask what you meant.","_n":"3973c","_k":"a51fb517"},{"t":"Evidence","why":"It doesn’t ask where in the text.","_n":"3a74c","_k":"a80a5614"},{"t":"Counterargument","why":"It doesn’t dispute your claim.","_n":"3b05c","_k":"7f308fe7"}]},"b":{"prompt":"“By ‘verdict’, do you mean a legal judgment or just a social one?” What type of question is this?","options":[{"t":"Counterargument","why":"It doesn’t propose a competing reading.","_n":"3c04c","_k":"1f0a90af"},{"t":"Clarification","why":"It asks what you meant by a term.","_n":"3d03c","_k":"d608d384"},{"t":"Extension","why":"It doesn’t go beyond your essay.","_n":"3e02c","_k":"5c9d097f"},{"t":"Evidence","why":"It doesn’t ask where.","_n":"3f01c","_k":"409c2f87"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A teacher asks: “Doesn’t Jane’s leaving Thornfield show principle defeating passion, the opposite of your thesis?” Which answer is strongest?","options":[{"t":"“You’re right; my thesis doesn’t hold.”","why":"Conceding the point isn’t conceding the argument.","_n":"3g00c","_k":"c088ce6f"},{"t":"“That’s a fair reading of the moment. But I’d argue her leaving is itself passionate: she says she is ‘a free human being with an independent will’ (Brontë, ch. 23), and she chooses herself as fiercely as she once chose him. So passion isn’t defeated; it’s redirected.”","why":"Acknowledge, answer, evidence, return.","_n":"3hffc","_k":"796a6327"},{"t":"“I’m not sure, but I think the novel is really about love.”","why":"That’s a vague bluff with no evidence.","_n":"3ifec","_k":"0966c89e"},{"t":"“No, it doesn’t. My thesis is right.”","why":"A wall, not an answer.","_n":"3jfdc","_k":"079593f4"}]},"b":{"prompt":"A teacher asks: “Doesn’t Victor’s suffering make him as sympathetic as the Creature?” Which answer is strongest?","options":[{"t":"“I haven’t thought about Victor much.”","why":"That’s honest, but it offers no path forward.","_n":"3kfcc","_k":"3a9af0f2"},{"t":"“He does suffer, and Shelley lets us feel it. But my claim is about responsibility, not sympathy: each of the Creature’s crimes follows an abandonment Victor chose. So the novel can grieve for Victor and still judge him.”","why":"Acknowledge, answer, evidence, return.","_n":"3lffc","_k":"bc06bfb3"},{"t":"“You’re right; I should change my thesis.”","why":"Conceding the point isn’t conceding the argument. A fair challenge deserves a fair answer: concede what’s true, answer what was asked, and show why your reading still stands.","_n":"3m00c","_k":"81597459"},{"t":"“No. Victor is just a villain.”","why":"A wall, not an answer. A fair challenge deserves a fair answer: concede what’s true, answer what was asked, and show why your reading still stands.","_n":"3n01c","_k":"07219a8f"}]}},{"id":"t2","cat":"T","goal":1,"a":{"prompt":"Your limit is 6 minutes and you speak at about 150 words per minute. Your script is 1200 words. How many words should you cut?","options":[{"t":"None; speak faster","why":"1200 words in 6 minutes is 200 wpm.","_n":"3o02c","_k":"5323e769"},{"t":"About 150 words","why":"That leaves 1050 words, 7 minutes at 150 wpm.","_n":"3pfbc","_k":"cff1e3d8"},{"t":"About 600 words","why":"That cuts to 600 words, 4 minutes: too short.","_n":"3qfcc","_k":"c744fc54"},{"t":"About 300 words","why":"6 × 150 = 900; 1200 − 900 = 300.","_n":"3rfdc","_k":"2ef00daf"}]},"b":{"prompt":"Your limit is 5 minutes and you speak at about 140 words per minute. Your script is 840 words. How many words should you cut?","options":[{"t":"About 70 words","why":"That leaves 770 words, 5.5 minutes.","_n":"3sfec","_k":"b7a74580"},{"t":"About 140 words","why":"5 × 140 = 700; 840 − 700 = 140.","_n":"3tf7c","_k":"9faacf66"},{"t":"None; speak faster","why":"840 words in 5 minutes is 168 wpm.","_n":"3uf8c","_k":"7d5f68bf"},{"t":"About 280 words","why":"That leaves 560 words, 4 minutes.","_n":"3vf9c","_k":"bda2f4b5"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Hamlet tells the players to “suit the action to the word, the word to the action” (\u003ci>Hamlet\u003c/i> 3.2.19–20). Which delivery choice for your line “and the light goes out” best follows it?","options":[{"t":"Speeding up to finish the sentence quickly","why":"Speed fights the meaning.","_n":"3wf8c","_k":"299cabf1"},{"t":"No change at all, eyes on your notes","why":"That suits neither action nor word.","_n":"3xfbc","_k":"83979fa0"},{"t":"A small, slow lowering of the hand as your voice drops on “out”","why":"The gesture matches the word, without overacting.","_n":"3yfac","_k":"b27294a5"},{"t":"A big sweep of both arms on every word","why":"That oversteps “the modesty of nature”, which is Hamlet’s warning against overdoing it.","_n":"3zfdc","_k":"87d9d744"}]},"b":{"prompt":"Hamlet asks the players to speak “trippingly on the tongue” (\u003ci>Hamlet\u003c/i> 3.2.1–2). Which advice is closest for your defence?","options":[{"t":"Speak as fast as possible","why":"Tripping lightly isn’t racing.","_n":"40fcc","_k":"217f2738"},{"t":"Speak lightly and clearly, letting the words flow without forcing them","why":"That’s speaking “trippingly”.","_n":"41ffc","_k":"6f6128eb"},{"t":"Shout each word for emphasis","why":"That’s the “mouthing” Hamlet warns against.","_n":"42fec","_k":"f21ee83c"},{"t":"Read slowly, word by word, from the page","why":"That’s stilted, not tripping.","_n":"43f1c","_k":"7ba21b6d"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"A questioner asks a long question about whether the frame narrative makes us side with Victor. Which paraphrase is best?","options":[{"t":"“You think I’m wrong.”","why":"That names a feeling, not the question.","_n":"44f0c","_k":"dba11bc3"},{"t":"“You’re asking about the whole novel’s structure and also its themes.”","why":"Too broad.","_n":"45f3b","_k":"22b7fa56"},{"t":"“You’re asking whether giving Victor the frame makes us take his side, which would challenge my reading.”","why":"It names the real challenge in one sentence.","_n":"46f4b","_k":"b458eb91"},{"t":"“You’re asking about Victor.”","why":"Too vague.","_n":"47f1b","_k":"b1e32cb6"}]},"b":{"prompt":"A questioner asks whether Gatsby’s parties are really for Daisy or for himself, given that he barely attends them. Which paraphrase is best?","options":[{"t":"“You’re asking about the parties.”","why":"Too vague. Paraphrase the question first. If you can’t, you haven’t heard it yet.","_n":"48f2b","_k":"ec4e09ae"},{"t":"“You don’t like my second claim.”","why":"Not a paraphrase.","_n":"49efb","_k":"e179f392"},{"t":"“You’re asking whether the parties are a message to Daisy or a performance for Gatsby himself.”","why":"It names the real challenge in one sentence.","_n":"4af0b","_k":"356238e2"},{"t":"“You’re asking about Daisy, Gatsby, Nick and Jordan.”","why":"Too broad. Paraphrase the question first. If you can’t, you haven’t heard it yet.","_n":"4bedb","_k":"368a9cbf"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which is the best opening 30 seconds for a defence?","options":[{"t":"Reading the essay’s first paragraph aloud","why":"Your essay is the evidence; the defence is the conversation. Speak from cue notes so your eyes can meet your audience.","_n":"4ceeb","_k":"2d01fc8b"},{"t":"A vivid image from the novel, the thesis in one sentence, and a three-part roadmap","why":"Hook, claim, map.","_n":"4dfbb","_k":"55391a85"},{"t":"A long biography of the author","why":"That delays the argument.","_n":"4efcb","_k":"24772bb6"},{"t":"An apology for being nervous","why":"It costs ethos before you begin.","_n":"4f6db","_k":"d9c45bae"}]},"b":{"prompt":"Which is the best closing for a defence?","options":[{"t":"Reading your conclusion paragraph word for word","why":"Your essay is the evidence; the defence is the conversation. Speak from cue notes so your eyes can meet your audience.","_n":"4g6cb","_k":"b7ebd66c"},{"t":"A list of everything you didn’t have time to say","why":"That ends on what’s missing.","_n":"4h6bb","_k":"4107b05e"},{"t":"“That’s all; any questions?”","why":"There’s no return to the thesis.","_n":"4i6ab","_k":"94511968"},{"t":"A one-sentence return to the thesis framed as a resonant contrast, then an invitation to questions","why":"Return, resonate, invite.","_n":"4j71b","_k":"a76fbe77"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Which slide best supports your claim about the green light?","options":[{"t":"A chart of how many times “green” appears, with no labels","why":"It’s unreadable without labels.","_n":"4k70b","_k":"9226f6cc"},{"t":"Ten images of green lights from the internet","why":"Clutter, and possibly copyrighted images.","_n":"4l6fb","_k":"9cf4b666"},{"t":"The quotation “Gatsby believed in the green light” in large type, with “believed” highlighted, and nothing else","why":"One idea; you speak the analysis.","_n":"4m6eb","_k":"6c2ad86b"},{"t":"Your full paragraph of analysis in small type","why":"Slides should show what you’re pointing at (one quotation, one image), not what you’re saying.","_n":"4n75b","_k":"fd28173c"}]},"b":{"prompt":"Which slide best supports your claim about Jane’s declaration?","options":[{"t":"A bulleted list of every chapter","why":"Slides should show what you’re pointing at (one quotation, one image), not what you’re saying.","_n":"4o74b","_k":"d20ce8f4"},{"t":"“I am no bird” in large type, with “no” highlighted, and nothing else","why":"One idea; you speak the analysis.","_n":"4p67b","_k":"dd0a0c54"},{"t":"A collage of bird photos","why":"It distracts from the words.","_n":"4q68b","_k":"57ee136d"},{"t":"Your full paragraph of analysis","why":"Slides should show what you’re pointing at (one quotation, one image), not what you’re saying.","_n":"4r69b","_k":"2eec01bb"}]}},{"id":"a2","cat":"A","goal":[6,2],"a":{"prompt":"Your rehearsal data shows: 5:10 for a 6-minute plan, 2 pauses, eyes on notes for most of claim 2. What’s the best next practice step?","options":[{"t":"Speak faster to finish early","why":"Listeners keep up at a comfortable pace, about 130–160 words a minute. Cut words, not breaths.","_n":"4s6ab","_k":"0082322a"},{"t":"Memorize claim 2 word for word","why":"Memorizing usually locks the eyes inward.","_n":"4t6bb","_k":"7a932c72"},{"t":"Rehearse claim 2 from a cue card only, adding planned pauses at its key words","why":"It targets the two weakest signals.","_n":"4u6cb","_k":"f18cb269"},{"t":"Add 150 words of new content","why":"The timing is fine; delivery is the issue.","_n":"4v6db","_k":"a6bcc5fe"}]},"b":{"prompt":"Your rehearsal data shows: 7:05 for a 6-minute plan, 14 stresses in a 60-word passage, good eye contact. What’s the best next practice step?","options":[{"t":"Cut about a minute of content and reduce the stresses to the 3–5 words that carry meaning","why":"It fixes the timing and the over-stressing together.","_n":"4w6eb","_k":"9d72b36d"},{"t":"Read from the script to save time","why":"Your essay is the evidence; the defence is the conversation. Speak from cue notes so your eyes can meet your audience.","_n":"4x6fb","_k":"e2de3e12"},{"t":"Add more stresses so nothing is missed","why":"When everything is stressed, nothing is.","_n":"4y70b","_k":"81976872"},{"t":"Speak faster","why":"Listeners keep up at a comfortable pace, about 130–160 words a minute. Cut words, not breaths.","_n":"4z81d","_k":"912cd7ef"}]}}]},"task":{"title":"Performance task: Defence plan","summary":"Defence plan","statement":"\u003cp>Plan the defence you’ll give in class: timed, voiced and ready for questions. The checklist makes sure the parts are there. Your teacher will hear the rest.\u003c/p>\u003cp class='tiny muted'>Your title, thesis, segments and cue notes come from Plan mode in the rehearsal coach; your rehearsals and self-review come from Rehearse mode. Everything stays on this device. Structure checks aren’t delivery checks: the in-class defence and the rubric carry the assessment.\u003c/p>\u003cdetails class='alg'>\u003csummary>How your teacher assesses the in-class defence (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge and Understanding\u003c/td>\u003ctd>Little command of the novel or thesis\u003c/td>\u003ctd>Some command; evidence general\u003c/td>\u003ctd>Clear command of the novel, thesis and evidence\u003c/td>\u003ctd>Thorough, nuanced command; evidence precise and well chosen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking\u003c/td>\u003ctd>Questions dodged or answered off-topic\u003c/td>\u003ctd>Questions answered partly; little evidence\u003c/td>\u003ctd>Questions answered directly with evidence; fair concessions\u003c/td>\u003ctd>Questions used to deepen the argument; graceful concessions; insightful extensions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication\u003c/td>\u003ctd>Reads a script; pace and eye contact impede understanding\u003c/td>\u003ctd>Some structure; uneven pace; frequent reading\u003c/td>\u003ctd>Clear structure (hook, thesis, roadmap); effective pace, pauses and eye contact\u003c/td>\u003ctd>Compelling structure and delivery; voice and gesture purposefully support meaning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application\u003c/td>\u003ctd>No connection beyond the essay\u003c/td>\u003ctd>A simple connection\u003c/td>\u003ctd>Connects the argument to wider contexts or other texts\u003c/td>\u003ctd>Original, persuasive extension of the argument to new contexts\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["It fits the time","Thesis stated","Roadmap given","Claims carry evidence","Every kind of question anticipated","Answers use the four moves","A closing line that lands","Rehearsed out loud","Reviewed honestly","Craft statement written"],"tips":["Fit 5–7 minutes: about 90 s per claim works for most plans.","State your thesis in one sentence, naming your novel and author.","Give the map: “I’ll show this in three ways: first…, second…, finally…”","Each claim needs its one best quotation, cited.","Write one question of each kind, especially the counterargument you fear most.","Tag your moves. If one is missing, add a sentence for it.","End on a line people will remember. Try a balanced contrast, like Lincoln’s.","Run it aloud with the timer at least once; it’s the only way to know your real time.","Rate each item honestly; then name one thing to practise.","Tell your teacher what you chose and why."],"explainPrompt":"Craft statement: Which choice in your plan best fits \u003cem>your\u003c/em> voice: a hook, a pause, an answer? Why? What will you practise between now and the real defence?","explainLabel":"Craft statement","vocab":"Use thesis, roadmap, pace, pause, acknowledge and evidence.","checkLabel":"Check my plan","success":"Your defence plan has all its parts. Your teacher will hear the rest at the in-class defence.","models":[{"title":"Claim-led (\u003ci>Frankenstein\u003c/i>, 6:00)","plan":"Opening (25 s): “The first thing the Creature does is reach toward his maker, and the first thing his maker does is run.” Thesis and roadmap (45 s): “first, his eloquence; second, the pattern of rejection; finally, the verdict he names.” Three claims of 90 s each, quoting “I was benevolent and good; misery made me a fiend” (Shelley, ch. 10) and “Beware; for I am fearless, and therefore powerful” (Shelley, ch. 20). Closing (25 s): “Shelley’s question isn’t what the Creature is, but what we make of him.” Invitation (15 s).","qs":"Clarification on “verdict”; evidence (“show a rejection scene”); counterargument (“just a murderer?”, answered with the four moves); extension (newcomers today)."},{"title":"Question-led (\u003ci>Jane Eyre\u003c/i>, 5:45)","plan":"Opening (20 s): the question “What does it cost to say no to the person you love?” Thesis and roadmap: passion as the source of Jane’s independence, “in three steps: first…”. Claims quoting “Do you think, because I am poor, obscure, plain, and little, I am soulless and heartless?” (Brontë, ch. 23) and “I am no bird; and no net ensnares me” (Brontë, ch. 23). Closing: “Jane doesn’t escape her passion; she steers by it.”","qs":"Counterargument answered: leaving Thornfield as passionate principle."},{"title":"Story-led (\u003ci>The Great Gatsby\u003c/i>, 6:20)","plan":"Opening (30 s): “Picture a man alone on his lawn at night, reaching toward a light across the water.” Thesis and roadmap: the dream survives by refusing evidence, “through the parties, the green light, then the final current”. Claims quoting “‘Can’t repeat the past?’ he cried incredulously. ‘Why of course you can!’” (Fitzgerald, ch. 6) and “So we beat on, boats against the current, borne back ceaselessly into the past” (Fitzgerald, ch. 9). Closing: “Fitzgerald doesn’t ask whether we should dream, but what our dreams refuse to see.”","qs":"Counterargument answered: Daisy’s choice (as in Spot the Error, done right)."}]},"cards":[["Ethos","Credibility: why listeners should trust you. “I’ve traced every scene where someone looks at the Creature.”"],["Pathos","Emotion: why listeners should care. Strong, but never a substitute for evidence."],["Logos","Reasoning from evidence: “In all four rejection scenes, the verdict comes first.”"],["Kairos","Fitting the moment and audience: a video defence needs more signposting than a room."],["Roadmap","A preview of your path: “first…, second…, finally…”"],["Pace","Speed of speech; about 130–160 words per minute keeps listeners with you."],["Pause","Planned silence before a key word or after a big claim: “We hear (pause) him first.”"],["Emphasis","Stressing the words that carry meaning; when everything is stressed, nothing is."],["Paraphrase-back","Restating a question in one sentence to check you’ve understood it."],["Four question types","Clarification (what do you mean?) · Evidence (where?) · Counterargument (isn’t it…?) · Extension (what about…?)"],["Acknowledge–answer–evidence–return","The four moves for hard questions; concede the point, never the argument."],["“Suit the action to the word”","Hamlet’s advice (\u003ci>Hamlet\u003c/i> 3.2.19–20): gestures that fit meaning, without overacting."]]}};</script>
