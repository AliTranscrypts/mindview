:"438f7","_k":"db7af6ad"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which is the strongest thesis for an essay on the story?","options":[{"t":"“The story has many literary devices.”","why":"Too vague to argue.","_n":"44907","_k":"3ff7e077"},{"t":"“Chopin proves that every marriage is a prison.”","why":"Overreaches beyond the evidence; Brently is described as kind.","_n":"450d7","_k":"b556cae1"},{"t":"“Kate Chopin published ‘The Story of an Hour’ in 1894.”","why":"A fact, not an argument.","_n":"460c7","_k":"9109b73d"},{"t":"“In ‘The Story of an Hour,’ Chopin uses images of spring, an open window and a final dramatic irony to reveal how marriage, even a kind one, could confine a woman’s selfhood in the 1890s.”","why":"Arguable, specific, and it names the \u003cem>how\u003c/em> and the \u003cem>why\u003c/em>.","_n":"470b7","_k":"929d09b2"}]},"b":{"prompt":"Which is the strongest thesis about point of view in the story?","options":[{"t":"“Point of view is important in this story.”","why":"Too vague.","_n":"480a7","_k":"f2447691"},{"t":"“The story is told in third person.”","why":"A fact, not an argument.","_n":"49097","_k":"1308c470"},{"t":"“The narrator is Kate Chopin herself.”","why":"Narrator and author are different.","_n":"4a087","_k":"fcb91139"},{"t":"“By slipping from third-person narration into Louise’s own voice, Chopin lets readers share a joy no other character can see, so that the doctors’ final diagnosis lands as bitter irony.”","why":"Arguable and specific: it names the technique, its effect and why it matters.","_n":"4b077","_k":"2c904a0a"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A filmmaker adapting the story wants viewers to grasp the ending’s irony \u003cstrong>without narration\u003c/strong>. Which choice best does this?","options":[{"t":"Cut from Louise’s triumphant face on the stairs to the latchkey turning, then to her collapse, then to the doctors calmly writing “joy”","why":"The sequence lets viewers hold both truths at once.","_n":"4c067","_k":"3bcac212"},{"t":"Show Brently weeping at the funeral","why":"That shifts the focus away from the gap between the doctors and the reader.","_n":"4d157","_k":"b95c5d72"},{"t":"Skip the ending and fade to black after Louise whispers “free”","why":"Without the reversal, there’s no irony.","_n":"4e147","_k":"ffb9ff46"},{"t":"Add a voice-over explaining the irony","why":"That uses narration, which the task rules out.","_n":"4f137","_k":"34afb8a2"}]},"b":{"prompt":"A stage director wants the audience to feel the gap between what Josephine believes and what Louise feels. Which staging best does this?","options":[{"t":"Split the stage: Josephine kneels pleading at the closed door while, on the other side, Louise stands in the window light, smiling","why":"The audience sees both rooms; neither character sees the other.","_n":"4g147","_k":"4298451f"},{"t":"Cut Josephine from the play","why":"Without her, there’s no contrast.","_n":"4h117","_k":"96577d32"},{"t":"Put both characters in one room, talking about the weather","why":"That loses the door between them.","_n":"4i127","_k":"bb6548a8"},{"t":"Have Louise tell the audience she is happy","why":"That removes the subtlety the story builds.","_n":"4j177","_k":"acbeadfa"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A student writing a story wants readers to sense a character’s secret relief \u003cstrong>without stating it\u003c/strong>. Which sentence uses free indirect discourse to do this?","options":[{"t":"“She thought, ‘I am relieved.’”","why":"Direct thought, stated outright.","_n":"4k187","_k":"7b763194"},{"t":"“I was relieved, I told myself.”","why":"First person.","_n":"4l157","_k":"0bec098a"},{"t":"“She was relieved.”","why":"Telling, not showing.","_n":"4m167","_k":"95e5ff68"},{"t":"“The service ran long. The hymns ran long. The house would be quiet now—so wonderfully quiet.”","why":"The narration slips into her feeling without saying “she felt relieved”.","_n":"4n0b7","_k":"7951cc97"}]},"b":{"prompt":"A student wants readers to sense a character’s private doubt about a decision. Which sentence uses free indirect discourse to do this?","options":[{"t":"“He signed the form and slid it across the desk. Three years in a city he had never seen. Well. People did it all the time, didn’t they?”","why":"The narration slips into his doubt (“Well. People did it all the time, didn’t they?”) without saying “he doubted”.","_n":"4o0c7","_k":"5e7081bf"},{"t":"“‘I’m not sure about this,’ he said.”","why":"Dialogue.","_n":"4p197","_k":"618e24c2"},{"t":"“He thought, ‘I have doubts.’”","why":"Direct thought.","_n":"4q187","_k":"7bd4ff8e"},{"t":"“He doubted his decision.”","why":"Telling.","_n":"4r1b7","_k":"d48be2ff"}]}}]},"task":{"title":"A paragraph that reads closely","summary":"A paragraph that reads closely","statement":"\u003cp>Write one analytical paragraph (150–250 words) arguing how \u003cstrong>one\u003c/strong> pattern, technique or detail in “The Story of an Hour” builds meaning. Read closely: quote precisely, cite, and tell your reader what the words \u003cem>do\u003c/em>.\u003c/p>\u003cp class=\"tiny muted\">This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class=\"alg pt-rubric\">\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"topic-tbl\">\u003cthead>\u003ctr>\u003cth scope=\"col\">Level\u003c/th>\u003cth scope=\"col\">The paragraph and the craft statement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>An insightful, arguable claim; precisely chosen and smoothly integrated quotations; analysis explains \u003cem>how\u003c/em> the words work and \u003cem>why\u003c/em> it matters; an elegant “so what”; the craft statement shows clear awareness of choices\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>A clear claim; well-integrated evidence; analysis mostly explains how; a reasonable “so what”\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>The claim is general; the evidence is partly dropped in or loosely linked; analysis slides into summary\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>No clear claim; quotations missing or uncited; mostly plot summary\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["The story and author are named","Two or more quotations, each cited","Quotations are introduced, not dropped","Analysis verbs at work","Length 150–250 words","A “so what” at the end","Craft statement"],"tips":["Name the story in quotation marks, and name Chopin, in your first sentence.","Add a second quotation, and cite each one with its paragraph number, like (Chopin, par. 5).","Introduce each quotation with your own words: who says it, when, or why it matters.","Use precise analysis verbs. “Suggests”, “foreshadows” and “reframes” tell the reader what the words do.","Stay between 150 and 250 words. One paragraph, one idea, followed all the way.","End by answering “so what?”: what does this pattern reveal about Louise, or about her world?","In 40 words or more: which detail did you choose, and why that one?"],"explainPrompt":"Craft statement: what choices did you make, and why?","explainLabel":"Craft statement","vocab":"In 40 words or more: which detail did you choose, and why that one?","checkLabel":"Check my paragraph","success":"Your paragraph has all its parts. Close readings can start almost anywhere. Here are three that start in very different places.","verbs":["suggests","implies","undercuts","juxtaposes","foreshadows","reframes","intensifies","complicates","reveals","mirrors","contrasts","echoes"],"focus":[{"id":"windows","t":"windows and doors","look":"Look at pars. 4–6, 17, 18 and 21."},{"id":"spring","t":"spring imagery","look":"Look at pars. 5–6 and 19."},{"id":"fid","t":"free indirect discourse","look":"Look at pars. 9, 11, 14–16 and 18–19."},{"id":"irony","t":"the irony of the ending","look":"Look at pars. 1–3, 12, 19 and 23."},{"id":"hour","t":"the title’s “hour”","look":"Look at the title, the pace of pars. 9–20, and the sudden end in pars. 21–23."},{"id":"own","t":"\u003cem>your own\u003c/em>","look":"Choose one pattern, technique or detail, and follow it through the story."}],"models":[{"title":"Model response 1: windows and doors (pattern)","text":"In “The Story of an Hour,” Chopin builds a quiet architecture of freedom out of a window and a door. Upstairs, Louise sits “facing the open window” (Chopin, par. 4), and the spring she sees there, trees “all aquiver with the new spring life” (par. 5), mirrors the life stirring in her before she can name it. Later she is “drinking in a very elixir of life through that open window” (par. 18), while her sister kneels “before the closed door” (par. 17), begging her to come out. The contrast suggests two worlds: the window opens onto possibility, the door onto the household’s claims. When Brently’s latchkey turns in “the front door” (par. 21), the old world simply walks back in. Even the “comfortable, roomy armchair” (par. 4) faces outward, toward the only opening she has. Chopin’s floor plan reveals how narrow the space for a married woman’s self could be: one window wide, and closed from the other side."},{"title":"Model response 2: free indirect discourse (technique)","text":"Chopin’s narrator speaks in the third person, but at the story’s turning point the narration starts to speak in Louise’s own voice, and that shift lets readers share a joy no one in the house can see. After she whispers “free, free, free!” (Chopin, par. 11), the sentences grow short and exclamatory: “Often she had not. What did it matter!” (par. 15). No neutral narrator would exclaim like this; the voice is hers, slipped inside the narration without quotation marks. The clipped sentences intensify the feeling, as if her thoughts were racing ahead of the narration. This free indirect discourse places us, alone, in the room with her, while Josephine is shut outside “imploring for admission” (par. 17). As a result, when the doctors announce that she died “of the joy that kills” (par. 23), the reader alone knows what that joy was. The technique turns us into witnesses, which makes the ending’s irony personal."},{"title":"Model response 3: the irony of the ending (structure)","text":"The last sentence of “The Story of an Hour” reaches back and rewrites the first. Chopin opens by explaining that Louise was “afflicted with a heart trouble” and that “great care was taken” to protect her from grief (Chopin, par. 1). By the end, that care looks badly misplaced. Even Richards’s “second telegram” (par. 2), sent to confirm the news, turns out to be wrong, so every safeguard in the opening fails. When the doctors decide she “died of heart disease—of the joy that kills” (par. 23), they assume her joy was at her husband’s return. The reader knows her “monstrous joy” (par. 12) was the prospect of living “for herself” (par. 14). The irony reframes her heart trouble as something more than medical: a heart with no room of its own. Chopin’s structure suggests that the danger to Louise was never grief; it was the return of a life she had, for one hour, escaped."}]},"cards":[["Close reading","Slow attention to how a text makes meaning, at the levels of whole, paragraph, sentence and word."],["Third person limited","The narrator stays close to one character’s mind. Chopin’s narrator stays close to Louise."],["Free indirect discourse","Third-person narration that carries a character’s own voice without quotation marks. “What did it matter!” (Chopin, par. 15)"],["Reported thought","The narrator tells us what a character thinks. “She knew that she would weep again…” (par. 13)"],["Dramatic irony","The reader knows what characters don’t. “of the joy that kills” (par. 23)"],["Situational irony","The opposite of what’s expected happens. “She breathed a quick prayer that life might be long.” (par. 19)"],["Verbal irony","Saying the opposite of what you mean, e.g. “Lovely weather,” in a storm."],["Foreshadowing","Hints of what’s to come. “afflicted with a heart trouble” (par. 1)"],["Image pattern","Repeated images that build meaning, e.g. the open window (pars. 4, 18) and the closed door (par. 17)."],["Setting as mirror","Setting that reflects or contradicts a character’s inner life. “all aquiver with the new spring life” (par. 5)"],["Inference","A conclusion the text implies but doesn’t state. “lines bespoke repression and even a certain strength” (par. 8)"],["MLA citation by paragraph","When a source numbers paragraphs: (Chopin, par. 5); for several, (Chopin, pars. 5–6)."]]}};</script>
