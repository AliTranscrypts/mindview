*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

img,svg{max-width:100%}

.btn.primary{background:var(--ink);color:var(--sheet)}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}

.plot-wrap{position:relative}

.result{margin-top:14px}

.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--an-sound:#A84C05;--an-image:#0E7C7B;--an-figure:#7A3DB8;--an-syntax:#2343C4;--an-diction:#6B5A1E;--an-theme:#B0286F;
--an-sound-soft:rgba(168,76,5,.13);--an-image-soft:rgba(14,124,123,.13);--an-figure-soft:rgba(122,61,184,.12);--an-syntax-soft:rgba(35,67,196,.11);
--an-diction-soft:rgba(107,90,30,.14);--an-theme-soft:rgba(176,40,111,.11);
--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}
:root[data-theme="dark"]{--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
.an-sound{--an-c:var(--an-sound);--an-c-soft:var(--an-sound-soft)}.an-image{--an-c:var(--an-image);--an-c-soft:var(--an-image-soft)}
.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}
.an-tag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);font-style:normal;letter-spacing:.01em;color:var(--an-c,var(--ink-2));background:var(--sheet);
border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}
.an-chip{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--an-c,var(--rule));background:var(--sheet);color:var(--ink);border-radius:999px;
padding:.25em .8em;font-size:.92rem;min-height:34px}
.an-chip[aria-pressed="true"]{background:var(--an-c-soft);font-weight:700}
.an-chip[aria-pressed="true"]::after{content:"on";font-size:.72rem;font-weight:700;color:var(--an-c)}
.an-dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--an-c,var(--ink-2));flex:0 0 auto}
.an-note{border-left:4px solid var(--an-c,var(--rule));background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;margin:0 0 6px;font-size:.92rem;max-width:none}
.eng-margin{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.eng-margin > *{min-width:0}
@media (max-width:820px){ .eng-margin{grid-template-columns:minmax(0,1fr)} }
@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}
ol.eng-poem li{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline}
ol.eng-poem li.eng-gap{height:.6em}
.eng-ln{font:400 .75rem var(--font-ui);color:var(--ink-2);text-align:right;padding-right:.9em;user-select:none}
.eng-prose p{font:400 1.08rem/1.65 var(--font-math);max-width:70ch}
.eng-prose .eng-ln{display:inline-block;min-width:3.2em;padding-right:.6em;text-align:left}
.eng-cite{font-size:.85rem;color:var(--ink-2);margin:4px 0 0}
.eng-toks{display:grid;gap:6px}
.eng-tl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.eng-tok{border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:.08em .28em;min-height:34px;min-width:24px;
font:400 1.22rem/1.3 var(--font-math)}
.eng-tok:not(:disabled):hover{border-color:var(--rule)}
.eng-tok.an{background:var(--an-c-soft)}
.eng-tok[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.eng-tok.eng-br{font:700 .9rem var(--font-ui);color:var(--ink-2);border:1.5px dashed var(--rule)}
.eng-tok.speaking,.eng-w.speaking{outline:2px solid var(--ink);outline-offset:1px;border-radius:4px}
.eng-w{transition:opacity .25s,color .25s}
.sc-syl{position:relative;display:inline-block;padding-top:.7em}
.sc-syl::before{position:absolute;left:0;right:0;top:0;text-align:center;font:700 .85em/1 var(--font-ui)}
.sc-stress{color:var(--sc-stress);font-weight:600}.sc-stress::before{content:"´"}
.sc-slack{color:var(--sc-slack)}.sc-slack::before{content:"˘"}
/* ENG4U 06: hero doorways, Form blueprints (sort, x-ray, shape-shifter, build), Same topic four forms (grid, decision cards),
   E7 thesis forge, E17 draft workspace, Choose your form task. Colour tokens only; prefix ef-. */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}

/* hero */
.ef-hero{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:14px 16px 12px}
.ef-hs{font:400 clamp(1.15rem,2.1vw,1.45rem)/1.5 var(--font-math);margin:0 0 4px;max-width:none}
.ef-ph{position:relative;border-radius:4px;padding:0 .08em;transition:background-color .35s,box-shadow .35s}
.ef-ph.lit{background:var(--an-syntax-soft);box-shadow:inset 0 -2.5px 0 var(--an-syntax)}
.ef-ph::after{content:"";position:absolute;left:4%;right:4%;bottom:-.42em;height:.32em;border:2px solid var(--an-syntax);border-top:0;border-radius:0 0 4px 4px;opacity:0;transition:opacity .35s,transform .9s}
.ef-ph.lit::after{opacity:1}
.ef-hero.slide .ef-ph::after{transform:translateY(1.2em);opacity:0}
.ef-hero.ef-done .ef-ph::after{opacity:1;transform:none}
.ef-tri{margin:8px 0 0;opacity:0;transition:opacity .4s;max-width:none}
.ef-hero.tri-on .ef-tri{opacity:1}
.ef-doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.ef-door{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:translateY(-18px);transition:opacity .6s,transform .8s}
.ef-door.on{opacity:1;transform:none}
.ef-arch{display:block;width:72%;max-width:58px;height:46px;border:2.5px solid var(--ink-2);border-bottom:0;border-radius:30px 30px 0 0;background:var(--paper)}
.ef-d3 .ef-arch{border-color:var(--an-syntax);background:var(--an-syntax-soft)}
.ef-dl{font:700 .74rem/1.2 var(--font-ui);text-align:center;color:var(--ink)}
.ef-hcap{font-style:italic;margin:8px 0 0;opacity:0;transition:opacity .9s;max-width:none}
.ef-hero.cap-on .ef-hcap{opacity:1}
.ef-hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}

/* Explore layout */
.ef-modes{margin:0 0 6px}
.ef-body{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px 28px;align-items:start;margin-top:8px}
.ef-stage,.ef-readbox{min-width:0}
.ef-readbox{border-left:1.5px solid var(--rule);padding-left:18px}
.ef-read-h{font-weight:700;margin:0 0 8px}
.ef-aha{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px;font-size:.92rem;max-width:none}
.ef-chg{display:inline-block;font:700 .68rem/1.4 var(--font-ui);border:1.5px solid var(--ink-2);border-radius:999px;padding:0 .45em;margin-left:.3em;color:var(--ink-2);vertical-align:.1em}
.ef-h{margin:14px 0 6px;font-size:1rem}
.ef-h3{margin:22px 0 6px}

/* sort */
.ef-tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:0 0 10px}
.ef-card{display:block;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:.88rem;line-height:1.35;min-height:44px;width:100%}
.ef-card b{display:inline-block;min-width:1.4em;font-size:1rem}
.ef-card .ef-c1{display:block;color:var(--ink-2);font:italic .84rem/1.35 var(--font-math);margin-top:3px}
.ef-card[aria-pressed="true"]{border-color:var(--hi);background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi)}
.ef-card.sm{padding:4px 8px;min-height:34px;font-size:.82rem;width:auto}
.ef-fan .ef-card{animation:ef-fan .7s both;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes ef-fan{from{opacity:0;transform:translateY(14px) rotate(-3deg) scale(.96)}to{opacity:1;transform:none}}
.ef-pane{border:1.5px dashed var(--rule);border-radius:8px;padding:8px 12px;margin:0 0 6px;min-height:3em}
.ef-pane p{font:400 1rem/1.55 var(--font-math);margin:0 0 6px;max-width:none}
.ef-pane .ef-pt,.ef-pt{font:400 .86rem/1.4 var(--font-ui);color:var(--ink-2);margin:0 0 6px}
.ef-smsg{min-height:1.2em;margin:0 0 6px}
.ef-bins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ef-bin{border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);padding:6px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.ef-binbtn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:6px;font-weight:700;font-size:.86rem;padding:.35em .4em;min-height:38px}
.ef-binlist{display:flex;flex-wrap:wrap;gap:4px}
.ef-binback{min-height:0;justify-content:center}
.ef-glow .ef-bin{animation:ef-glow 1.1s 2 alternate}
@keyframes ef-glow{to{box-shadow:0 0 0 3px var(--hi)}}
.ef-tourrow{margin-top:8px}

/* x-ray */
.ef-xsel{margin:0 0 4px}
.ef-layers{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.ef-xopt{min-height:0}
.ef-purp{margin:0 0 6px;font-weight:700;max-width:none}
.ef-xtext{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 14px}
.ef-xp p{font:400 1.05rem/1.85 var(--font-math);margin:0 0 .6em;max-width:none}
.ef-s{border-radius:3px;padding:0 .04em;transition:background-color .3s}
.ef-r-claim{background:var(--an-syntax-soft);box-shadow:inset 0 -2px 0 var(--pp-claim)}
.ef-r-evidence{background:var(--an-image-soft);box-shadow:inset 0 -2px 0 var(--pp-evidence)}
.ef-r-analysis{background:var(--an-figure-soft);box-shadow:inset 0 -2px 0 var(--pp-analysis)}
.ef-r-counter{background:var(--an-sound-soft);box-shadow:inset 0 -2px 0 var(--an-sound)}
.ef-r-link{box-shadow:inset 0 -2px 0 var(--pp-link)}
.ef-tg{font-size:.66rem}
.ef-tg-claim{--an-c:var(--pp-claim)}.ef-tg-evidence{--an-c:var(--pp-evidence)}.ef-tg-analysis{--an-c:var(--pp-analysis)}.ef-tg-counter{--an-c:var(--an-sound)}.ef-tg-link{--an-c:var(--pp-link)}
.ef-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--ink-2);margin:8px 0 0;max-width:none}
.ef-lg{display:inline-flex;align-items:center;gap:5px}
.ef-sw{display:inline-block;width:1.1em;height:.8em;border-radius:2px}
.ef-sw.ef-r-link{border-bottom:2px solid var(--pp-link)}
.ef-pro{border:1.5px solid var(--an-diction);border-radius:999px;padding:0 .18em}
.ef-hedge{text-decoration:underline dashed var(--an-diction);text-decoration-thickness:1.5px;text-underline-offset:3px}
.ef-boost{text-decoration:underline solid var(--an-diction);text-decoration-thickness:2.5px;text-underline-offset:3px}
.ef-cr-circle{border:2px solid var(--an-c);border-radius:999px;padding:0 .2em}
.ef-cr-tint{background:var(--an-c-soft);box-shadow:inset 0 -3px 0 var(--an-c);border-radius:3px}
.ef-cr-under{text-decoration:underline solid var(--an-c);text-decoration-thickness:2.5px;text-underline-offset:3px}
.ef-marks{margin:8px 0 0;max-width:none}
.ef-strike{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.ef-new{animation:ef-in .9s both}
@keyframes ef-in{from{opacity:0;background:var(--hi-soft)}to{opacity:1}}
.ef-pair{display:inline;border-left:3px solid var(--an-image);border-right:3px solid var(--an-image);border-radius:6px;padding:2px 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ef-pairtag{font-size:.64rem}
.ef-shuffle p{animation:ef-in .8s both}
.ef-shuffle p:nth-child(2){animation-delay:.15s}.ef-shuffle p:nth-child(3){animation-delay:.3s}
.ef-fadebox{transition:opacity .2s}
.ef-fadebox.ef-out{opacity:0}

/* build */
.ef-sk{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:6px}
.ef-sk li{display:grid;grid-template-columns:1.8em minmax(0,1fr);align-items:center}
.ef-skn{font:700 .85rem var(--font-ui);color:var(--ink-2)}
.ef-skc{text-align:left;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.45em .7em;min-height:40px;font-size:.95rem}
.ef-skc[aria-pressed="true"]{border-color:var(--hi);background:var(--hi-soft);box-shadow:0 0 0 2px var(--hi)}
.ef-skact{align-items:center}
.ef-skoutp{margin:4px 0 0}
.ef-dials{display:grid;gap:4px}
.ef-check{display:flex;gap:8px;align-items:flex-start;margin:6px 0 0;font-size:.95rem}
.ef-check input{width:20px;height:20px;margin-top:2px;accent-color:var(--pen)}

/* reader pane */
.ef-rd{margin:0 0 10px}
.ef-rdctl{margin:6px 0}

/* Part 3 */
.ef-paras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ef-para{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 14px}
.ef-para h4{margin:0 0 6px;font-size:1rem}
.ef-para p{font:400 1rem/1.6 var(--font-math);margin:0;max-width:none}
.ef-ftag{display:inline-block;font:700 .72rem/1.4 var(--font-ui);border:1.5px solid var(--ink-2);border-radius:999px;padding:0 .5em;margin-right:.3em;vertical-align:.1em}
.ef-ps.ef-hl{background:var(--an-theme-soft);box-shadow:inset 0 -2px 0 var(--an-theme);border-radius:3px}
.ef-gridwrap{max-width:100%}
.ef-grid{border-collapse:separate;border-spacing:0;min-width:640px;width:100%;font-size:.9rem}
.ef-grid th,.ef-grid td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.ef-grid thead th{font-weight:700;background:var(--paper)}
.ef-grid tbody th{position:sticky;left:0;background:var(--sheet);z-index:1;font-weight:700;min-width:8.5em;border-right:1px solid var(--rule)}
.ef-grid thead th:first-child{position:sticky;left:0;z-index:2}
.ef-cell{display:block;width:100%;min-height:36px;border:1.5px dashed var(--rule);border-radius:6px;background:var(--paper);color:var(--ink-2);font-size:.86rem;padding:.3em .4em}
.ef-cell.armed{border-style:solid;border-color:var(--hi);background:var(--hi-soft);color:var(--ink);font-weight:700}
.ef-cell.done{border:0;background:none;color:var(--ink);padding:.3em 0;font-size:.9rem}
.ef-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ef-dcard{border:1.5px solid var(--rule)!important;border-radius:8px;padding:10px 12px!important;margin:0!important}
.ef-sit{font-weight:700;margin:0 0 8px;max-width:none}
.ef-sit .qn{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:.8rem;margin-right:.3em}
.ef-dlab{font:700 .8rem var(--font-ui);color:var(--ink-2);margin:6px 0 4px}
.ef-dcard .chips{margin:0 0 4px;gap:6px}
.ef-just{display:grid;gap:6px}
.ef-jopt{min-height:36px;padding:.35em .6em!important;font-size:.88rem}
.ef-jopt[aria-checked="true"]{border-color:var(--hi);background:var(--hi-soft)}
.ef-stchk{margin:10px 0 4px}

/* task */
.ef-ct{display:grid;gap:6px;margin:8px 0}
.ef-ctrow{margin:2px 0}
.ef-own{margin-top:-2px}
.ef-own input,.ef-boxes input,.ef-forge input{width:100%}
textarea.ef-slot{min-height:58px}
.ef-skel{border-left:3px solid var(--rule);padding-left:12px;margin:6px 0}
.ef-boxes{border:0;padding:0;margin:0 0 10px;display:grid;gap:6px}
.ef-boxes legend{font-weight:700;margin-bottom:4px;padding:0}
.ef-lab{display:block;font-weight:700;font-size:.95rem;margin:0 0 4px}
.ef-forge{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--paper)}
.ef-forge .jq{margin:0 0 6px}
.ef-forge-out{margin:6px 0 4px;font:400 1rem/1.5 var(--font-math);max-width:none}
.ef-forge-flags{list-style:none;margin:0;padding:0;font-size:.88rem}
.ef-forge-flags li{margin:2px 0;padding:3px 8px;border-left:3px solid var(--p-k);background:var(--info-bg);border-radius:0 4px 4px 0}
.ef-forge-flags li.ok{border-left-color:var(--ink-2)}
.ef-forgewrap{margin:0 0 10px}
.ef-dw{margin:8px 0}
.ef-dw-ta{width:100%;min-height:200px}
.ef-dw-n{font-size:.88rem}
.ef-dw-l{margin:4px 0}
.ef-dw-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:.9rem}
.ef-dw-cmp p{max-width:none;margin:0 0 4px}
.ef-dw-cmp del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.ef-dw-cmp ins{text-decoration:underline;text-decoration-thickness:2px;background:var(--hi-soft)}
.ef-bones{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:4px;font-size:.9rem}
.ef-bones li{display:grid;grid-template-columns:1.4em minmax(0,1fr);overflow-wrap:anywhere}
.ef-bones li.yes .mk{color:var(--green)}
.ef-tried{margin:6px 0 10px}
.ef-model{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.ef-model h5{margin:0 0 4px;font-size:.95rem}
.ef-model p,.ef-mbones{font-size:.9rem;max-width:none}
.ef-mbones{margin:0 0 6px;padding-left:1.2em}
.ef-qpass{margin:6px 0 8px;padding:6px 12px;border-left:3px solid var(--rule);font:italic 400 1rem/1.5 var(--font-math)}

@media (max-width:820px){
  .ef-body{grid-template-columns:minmax(0,1fr)}
  .ef-readbox{border-left:0;padding-left:0;border-top:1.5px solid var(--rule);padding-top:12px}
  .ef-bins{grid-template-columns:minmax(0,1fr)}
  .ef-bin{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .ef-binbtn{min-width:9.5em}
  .ef-layers{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .ef-layers .an-chip{flex:0 0 auto}
  .ef-paras,.ef-cards,.ef-dw-cmp{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .ef-doors{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .ef-dl{font-size:.64rem}
  .ef-tray{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .ef-fan .ef-card,.ef-glow .ef-bin,.ef-new,.ef-shuffle p{animation:none}
  .ef-door,.ef-hcap,.ef-tri,.ef-ph,.ef-ph::after,.ef-fadebox{transition:none}
}

<script>window.MV_PAYLOAD={"meta":{"id":"06-essay-forms","nn":"06","slug":"essay-forms","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 1","groupName":"The Reader's and Writer's Craft","trivium":"Logic, Rhetoric","size":"M","storageKey":"eng4u-06-essay-forms-v1","progressKey":"eng4u-progress-v1:06-essay-forms","toolkit":"1.0.6"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"e52658a1","content":{"id":"06-essay-forms","kind":"topic","title":"Essay forms","topic":"Essay Forms","readyTopic":"essay forms","hero":{"headline":"Every essay is for something","text":"Bacon names three purposes in eight words. Essays have purposes too: to \u003cstrong>explain\u003c/strong>, to \u003cstrong>convince\u003c/strong>, to \u003cstrong>compare\u003c/strong>, to \u003cstrong>analyse\u003c/strong>, to \u003cstrong>explore\u003c/strong> a life. Each purpose has its own shape, its own voice and its own kind of evidence. Learn the shapes and you can read any essay’s blueprint, and build your own.","fig":{"html":"\u003cdiv class='ef-hero' id='ef-hero' role='group' aria-label='Bacon’s sentence, Studies serve for delight, for ornament and for ability, with its three purposes turning into doorways labelled with essay forms'>\u003c/div>","caption":""},"sentence":["Studies serve ","for delight",", ","for ornament"," and ","for ability","."],"phraseWords":[2,4,7],"tri":"tricolon","doors":["personal","style","expository and argumentative","comparative","literary analysis"],"caption":"Five forms. One question: what is this essay \u003cem>for\u003c/em>?","cite":"Francis Bacon, “Of Studies” (1625)","listen":"Listen","watch":"Watch again","noVoice":"Read the sentence aloud yourself."},"goals":["I can identify the purpose, structure and voice of five essay forms: expository, argumentative, comparative, literary analysis and personal.","I can recognize and use patterns of organization: claim–reasons–rebuttal, block and point-by-point comparison, aspects of a topic, and scene → reflection.","I can adjust voice and stance (first or third person, formal or conversational) to suit a form and an audience.","I can choose the form that best fits a purpose and audience, and justify my choice.","I can explain how a published essay’s form and style serve its purpose (Bacon, Leacock).","I can plan and open an essay in a chosen form with a clear purpose, skeleton and voice."],"start":{"blocks":[{"title":"Word story: essay","html":"\u003cp>\u003cstrong>\u003cem>Essay\u003c/em>\u003c/strong> comes from French \u003cem>essai\u003c/em>, “a trial, an attempt”, from \u003cem>essayer\u003c/em>, “to try” (ultimately Latin \u003cem>exagium\u003c/em>, “a weighing”).\u003c/p>\u003cp>In 1580 Michel de Montaigne called his short prose pieces \u003cem>Essais\u003c/em>: attempts at thinking a question through, in public.\u003c/p>\u003cp>So an essay isn’t a container to fill; it’s a mind trying something out. Francis Bacon borrowed the word for his own \u003cem>Essays\u003c/em> in 1597.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Purpose and audience","goal":1,"prompt":"A pamphlet explains how maple syrup is made, from tapping trees to boiling sap. What is its main purpose?","options":[{"t":"To persuade","why":"It isn’t trying to change your mind or your behaviour.","_n":"032a","_k":"0de7b414"},{"t":"To compare","why":"Nothing is being set against anything.","_n":"133a","_k":"31e2401c"},{"t":"To entertain","why":"It may be enjoyable, but its job is to explain.","_n":"234a","_k":"eefea8d4"},{"t":"To inform or explain","why":"It shows how a process works.","_n":"32da","_k":"6b1a6431"}],"hints":["What does the reader gain?","Knowledge of a process.","To explain."]},{"id":"w2","skill":"Purpose and audience","goal":4,"prompt":"A letter urges the city council to plough sidewalks before roads after a snowfall. Who is the audience, and what is the purpose?","options":[{"t":"Snowplough drivers; to explain how to plough","why":"It argues for a policy; it doesn’t instruct drivers.","_n":"42ea","_k":"fdcf0270"},{"t":"Council members; to persuade them to change a policy","why":"Council can change the policy, and the letter urges it to.","_n":"52fa","_k":"36f2b095"},{"t":"Children; to entertain them","why":"The audience and purpose are both wrong.","_n":"630a","_k":"c466b6ac"},{"t":"Anyone; to describe snow","why":"It has a specific audience and an argumentative aim.","_n":"739a","_k":"7449ea24"}],"hints":["Who can change the policy?","Council.","Council members; to persuade them to change a policy."]},{"id":"w3","skill":"Thesis types","goal":1,"prompt":"Which thesis belongs to an \u003cstrong>argumentative\u003c/strong> essay?","options":[{"t":"“Ontario high schools should start classes at 9:30 a.m., because teenagers learn better when rested.”","why":"A debatable position with a reason.","_n":"83aa","_k":"52d1deec"},{"t":"“Both morning and afternoon classes have advantages and disadvantages.”","why":"It takes no position.","_n":"99a2","_k":"b3c2e7f9"},{"t":"“This essay explains how the school day is scheduled.”","why":"That’s expository: it explains.","_n":"a992","_k":"3239bd39"},{"t":"“I remember my first day of high school.”","why":"That opens a personal essay.","_n":"b982","_k":"95ad0f1b"}],"hints":["Which one could someone argue against?","Look for “should”.","“Ontario high schools should start classes at 9:30 a.m., because teenagers learn better when rested.”"]},{"id":"w4","skill":"Thesis types","goal":2,"prompt":"Which is the strongest thesis for a \u003cstrong>comparative\u003c/strong> essay?","options":[{"t":"“‘My Financial Career’ is funnier than ‘Of Studies’.”","why":"A preference, not an analytical comparison.","_n":"c972","_k":"36ac4819"},{"t":"“Both ‘Of Studies’ and ‘My Financial Career’ are about how a person faces an institution, but Bacon advises mastery while Leacock confesses being mastered.”","why":"It states what the comparison reveals.","_n":"d962","_k":"30b44df4"},{"t":"“Bacon was born in 1561 and Leacock in 1869.”","why":"Facts, not a claim.","_n":"e952","_k":"3b19efa9"},{"t":"“‘Of Studies’ and ‘My Financial Career’ are similar and different in many ways.”","why":"True of any two texts. What’s the insight?","_n":"f942","_k":"c64c105b"}],"hints":["A comparative thesis says what we learn by comparing.","Look for a shared subject plus a contrast.","“Both ‘Of Studies’ and ‘My Financial Career’ are about how a person faces an institution, but Bacon advises mastery while Leacock confesses being mastered.”"]},{"id":"w5","skill":"Voice","goal":3,"prompt":"Which sentence suits a \u003cstrong>literary analysis\u003c/strong> essay?","options":[{"t":"“The speaker’s repeated questions reveal a mind circling a decision it cannot make.”","why":"Third person, literary present, focused on the text.","_n":"g932","_k":"3e8c78f6"},{"t":"“I think the speaker is confused and I feel bad for him.”","why":"Personal response, not analysis.","_n":"h922","_k":"a7e4f54f"},{"t":"“You will love this poem because it is so deep.”","why":"An advertisement voice.","_n":"i912","_k":"0c4844f9"},{"t":"“In my life, I have also been confused.”","why":"That’s a personal essay’s move.","_n":"j002","_k":"ed30e580"}],"hints":["Where is the focus: the reader or the text?","Analysis talks about the text’s choices.","“The speaker’s repeated questions reveal a mind circling a decision it cannot make.”"]},{"id":"w6","skill":"Voice","goal":3,"prompt":"Which sentence suits a \u003cstrong>personal\u003c/strong> essay?","options":[{"t":"“Cities must clear snow faster.”","why":"Argumentative voice.","_n":"k012","_k":"08123058"},{"t":"“The poem depicts snow as a blanket of silence.”","why":"Literary analysis voice.","_n":"lfe2","_k":"bfc9722d"},{"t":"“Snow forms when water vapour freezes around dust particles.”","why":"Expository voice.","_n":"mff2","_k":"7c3fbbfb"},{"t":"“The first time I saw snow, I stood in the parking lot with my mouth open, tasting a sky I had only read about.”","why":"First person, a vivid lived detail.","_n":"n042","_k":"cb2c06d3"}],"hints":["Which one comes from a lived moment?","Look for “I” and a sensory detail.","“The first time I saw snow, I stood in the parking lot with my mouth open, tasting a sky I had only read about.”"]}],"refreshers":{"Purpose and audience":"Ask who will read it and what it should do to them: inform, convince, move, or show how something works.","Thesis types":"Expository: “X works like this.” Argumentative: “We should X, because…” Comparative: “Seeing X beside Y reveals…” Literary analysis: “Author uses technique to show idea.” Personal: often an insight that emerges late.","Voice":"Third person and the present tense for analysis; first person and lived detail for personal essays; confident and reasoned for argument; clear and neutral for exposition."}}},"explore":{"heading":"Form blueprints","intro":"Every essay has a skeleton under its skin. Sort the excerpts by form, then x-ray them to see the bones.","modes":[{"id":"sort","t":"Sort"},{"id":"xray","t":"X-ray"},{"id":"shape","t":"Shape-shifter"},{"id":"build","t":"Build"}],"bins":[{"id":"exp","t":"Expository"},{"id":"arg","t":"Argumentative"},{"id":"cmp","t":"Comparative"},{"id":"lit","t":"Literary analysis"},{"id":"per","t":"Personal"}],"roles":{"claim":"Claim or focus","evidence":"Evidence or detail","analysis":"Analysis or reflection","counter":"Counterargument","link":"Link or transition"},"layers":[{"id":"purpose","t":"Purpose"},{"id":"skeleton","t":"Skeleton"},{"id":"voice","t":"Voice markers"}],"markers":{"first":["I","me","my","mine","myself","we","us","our"],"second":["you","your","yours"],"third":["he","she","him","her","his","they","them","their","men","man"],"hedges":["perhaps","seems","seem","seemed","may","might","possibly","probably","likely"],"boosters":["clearly","must","certainly","obviously","surely","undeniably"]},"excerpts":[{"id":"ea","label":"A","title":"Francis Bacon, “Of Studies” (1625)","_a":"R1BKRhc=","s":[["Studies serve for delight, for ornament and for ability.","claim","Focus"],["Their chief use for delight, is in privateness and retiring; for ornament, is in discourse; and for ability, is in the judgment and disposition of business;","evidence","Definitions"],["for expert men can execute, and perhaps judge of particulars, one by one: but the general counsels, and the plots and marshalling of affairs come best from those that are learned.","analysis","Reasoning"]],"craft":{"layer":"skeleton","phrases":["for delight,","for ornament","for ability."],"tag":"parallelism","role":"syntax","style":"tint"},"purpose":"To explain what studies are for, and how each use serves a reader","pattern":["Aphoristic","short, balanced clauses, one use of study at a time"],"person":"Third person (with “men”)","reg":"authoritative · compressed","evidence":["Facts and definitions","distinctions between three uses"],"tense":"Present (timeless statements)"},{"id":"eb","label":"B","title":"Stephen Leacock, “My Financial Career” (1910), pars. 1–3","_a":"R0VXRBc=","s":[["When I go into a bank I get rattled.","claim","Focus"],["The clerks rattle me; the wickets rattle me; the sight of the money rattles me; everything rattles me.","evidence","Detail"],["The moment I cross the threshold of a bank and attempt to transact business there, I become an irresponsible idiot.","analysis","Reflection",1],["I knew this beforehand, but my salary had been raised to fifty dollars a month and I felt that the bank was the only place for it.","link","Into the story",1]],"craft":{"layer":"voice","match":"^rattle","tag":"escalation","role":"diction","style":"circle"},"purpose":"To confess, for comic effect, his own dread of banks","pattern":["Scene → reflection","a confession, then the story that proves it"],"reg":"comic · confessional","evidence":["Lived detail","his own nerves, item by item"],"tense":"Present (habit), then past (the story)"},{"id":"ec","label":"C","title":"Model excerpt: the Canadian Shield","_a":"R1BKRhc=","s":[["Much of the Canadian Shield looks scraped, and it was.","claim","Focus"],["During the last ice age, sheets of ice more than two kilometres thick crept across the region, dragging boulders that ground the granite like sandpaper.","evidence","Cause"],["The ice stripped away soil, polished the rock into smooth humps and gouged long scratches, called striations, that still point the way the glaciers moved.","evidence","Effect"],["When the ice melted, water filled the hollows it had carved.","evidence","Effect"],["That is why the Shield is a country of bare rock and countless lakes.","analysis","Synthesis"]],"purpose":"To explain how glaciers shaped the Shield’s granite","pattern":["Aspects of a topic","cause → effects → synthesis"],"reg":"clear · neutral","evidence":["Facts and definitions","causes, effects and a defined term (“striations”)"],"tense":"Past (the ice age), then present"},{"id":"ed","label":"D","title":"Model excerpt: library hours","_a":"R1RAURc=","s":[["The school library must stay open until 9 p.m. during exam weeks.","claim","Claim"],["Many students have no quiet place to study at home: they share bedrooms, care for younger siblings or work evening shifts.","claim","Reason"],["Last June, the library’s sign-in sheet showed forty-two students waiting at the door before 8 a.m. on exam days, which clearly shows the need.","evidence","Statistic"],["One Grade 12 student told the council she had been studying in a parked car, the only quiet room she could find.","evidence","Example"],["Longer hours would give every student the same chance to prepare.","analysis","Analysis"]],"purpose":"To convince trustees to extend library hours","pattern":["Claim–reasons–rebuttal","claim → reason → evidence → (counterargument next)"],"reg":"formal · confident (“must”, “clearly”)","evidence":["Reasons and data","statistics and an example"],"tense":"Present, with past evidence"},{"id":"ee","label":"E","title":"Model excerpt: Iqaluit and Windsor","_a":"R1ZfRhc=","units":{"th":["Iqaluit and Windsor share a country but not a winter.","claim","Comparison"],"il":["In Iqaluit, December daylight lasts about four hours.","evidence","Iqaluit: light"],"ic":["The cold there often falls below −30 °C.","evidence","Iqaluit: cold"],"ig":["Winter is a season for feasts, games and travel on the sea ice.","evidence","Iqaluit: community"],"wl":["In Windsor, December daylight lasts about nine hours.","evidence","Windsor: light"],"wc":["The cold there rarely falls below −15 °C.","evidence","Windsor: cold"],"wg":["Most people simply wait indoors for spring.","evidence","Windsor: community"],"sy":["Side by side, the two cities show that the harder the winter, the more fully a community builds its life around it.","analysis","Insight"]},"orders":{"block":[["th","il","ic","ig"],["wl","wc","wg","sy"]],"point":[["th","il","wl"],["ic","wc"],["ig","wg","sy"]]},"pairs":[["il","wl"],["ic","wc"],["ig","wg"]],"orderLabels":{"block":"Block","point":"Point-by-point"},"purpose":"To show what setting two winters side by side reveals","pattern":{"block":["Block","all of Iqaluit, then all of Windsor, then the insight"],"point":["Point-by-point","light, then cold, then community life, each for both cities"]},"reg":"clear · balanced","evidence":["Paired details","light, cold and community life for each city"],"tense":"Present"},{"id":"ef","label":"F","title":"Model excerpt: Rossetti’s “Remember”","_a":"R1lbQhc=","s":[["The poem’s quiet imperatives turn grief into instruction.","claim","Claim",0,"after"],["I think the poem is sad.","claim","Claim",0,"before"],["Christina Rossetti’s speaker opens with a command, “Remember me,” and repeats it, as if memory were a duty the listener could be assigned.","evidence","Quotation"],["Yet at line nine the sonnet turns: if remembering would make the listener sad, the speaker would rather be forgotten.","evidence","Detail"],["The commands that seemed to cling to the living become a final act of release.","analysis","Analysis"],["A sonnet that changes its mind halfway through enacts the generosity it describes.","analysis","Analysis"]],"craft":{"layer":"voice","match":"^turn$","tag":"analysis verb","role":"figure","style":"under","first":true},"purpose":"To show how Rossetti’s sonnet turns a plea into a release","pattern":["Aspects of a topic","claim → quotation → analysis"],"reg":"formal · analytical","evidence":["Quotations","the poem’s own words and its turn"],"tense":"Literary present"},{"id":"eg","label":"G","title":"Model excerpt: the recipe card","_a":"R0VXRBc=","s":[["My grandmother’s recipe for chicken soup lives on an index card, soft as cloth from forty years of handling.","evidence","Scene"],["Her handwriting slants hard to the right, and half the measurements say only “some” or “enough.”","evidence","Detail"],["The first winter after she died, I tried to follow it exactly and failed three times.","evidence","Detail"],["On the fourth try, my mother stood beside me and said, “Stop reading. Taste.”","link","Turn"],["I learned that family is the most important thing.","analysis","Moral (announced)",0,"moral"],["I still can’t read her handwriting, so I make the soup by feel.","analysis","Reflection through image",0,"image"]],"purpose":"To explore what a grandmother’s recipe still teaches","pattern":["Scene → reflection","scene → turn → reflection"],"reg":"conversational · tender","evidence":["Lived detail","the card, the handwriting, the failed tries"],"tense":"Past (the memory), present (the reflection)"},{"id":"eh","label":"H","title":"Model excerpt: phones in class","_a":"R1RAURc=","s":[["Phones should be stored in a caddy at the classroom door during lessons.","claim","Claim"],["A single notification can pull a student’s attention away for minutes, and the mere sight of a phone on a desk makes focus harder.","evidence","Reason"],["Some students argue that phones are useful tools for research and emergencies.","counter","Counterargument"],["That is true, but class laptops can handle research, and the office phone already reaches families in an emergency.","counter","Rebuttal"],["Weighing both sides, the benefits of phone-free lessons clearly outweigh the convenience of keeping phones within reach.","analysis","Conclusion"]],"purpose":"To convince readers that phones belong at the door during lessons","pattern":["Claim–reasons–rebuttal","claim → reason → counterargument → rebuttal → conclusion"],"reg":"formal · confident (“clearly”)","evidence":["Reasons and data","reasons and a fair answer to the objection"],"tense":"Present"}],"shape":{"intro":"One paragraph about urban trees. Turn the Purpose dial and watch the paragraph change form.","dialLabel":"Purpose dial","versions":[{"id":"explain","t":"Explain","form":"Expository","purpose":"To explain how street trees cool a city","pattern":["Aspects of a topic","shade → evaporation → rainwater → synthesis"],"reg":"clear · neutral","evidence":["Facts and definitions","causes and effects"],"first":"Names the phenomenon","counter":"None","s":[["A street tree works like a small machine for cooling a city.","claim","Focus"],["Its leaves shade asphalt that would otherwise soak up the sun all afternoon.","evidence","Shade"],["Water evaporating from those leaves draws heat out of the surrounding air, the way sweat cools skin.","evidence","Evaporation"],["Its roots and soil hold rainwater that would otherwise rush into storm drains.","evidence","Rainwater"],["Together, shade, evaporation and absorption explain why a block lined with mature maples feels different from a bare one.","analysis","Synthesis"]]},{"id":"convince","t":"Convince","form":"Argumentative","purpose":"To convince council to plant and protect street trees","pattern":["Claim–reasons–rebuttal","claim → reasons → counterargument → call to action"],"reg":"formal · confident (“must”)","evidence":["Reasons and data","reasons, with the cooling and drainage facts as evidence"],"first":"States the claim","counter":"Yes: “Some argue trees damage sidewalks, but…”","s":[["Our city must plant a street tree on every block that lacks one.","claim","Claim"],["Trees shade asphalt and cool the air through their leaves, which matters more each summer as heat waves lengthen.","claim","Reason"],["They also soak up rainwater that would otherwise flood storm drains.","claim","Reason"],["Some argue trees damage sidewalks, but choosing the right species and giving roots wider planting beds prevents most of the cracking.","counter","Counterargument",1],["Council should fund the planting in this year’s budget.","link","Call to action"]]},{"id":"compare","t":"Compare","form":"Comparative","purpose":"To reveal what a tree-lined street and a bare street show side by side","pattern":["Point-by-point","heat, then use, then rain, each for both streets"],"reg":"clear · balanced","evidence":["Paired details","the same afternoon on two streets"],"first":"States the comparison’s insight","counter":"None","s":[["Set a tree-lined street beside a bare one on a July afternoon, and the difference is not just shade but how each street is used.","claim","Insight"],["On the tree-lined block, the sidewalk stays cool enough for children to play and neighbours to talk; on the bare block, people hurry from car to door.","evidence","Pair: heat and use"],["After a storm, the treed street drains into its soil, while the bare one sends water racing to the drains.","evidence","Pair: rain"],["Seen together, the two streets reveal that a tree is less a decoration than a piece of equipment for public life.","analysis","What the contrast reveals"]]},{"id":"explore","t":"Explore personally","form":"Personal","purpose":"To explore what losing one tree meant to a street","pattern":["Scene → reflection","scene → turn → reflection through image"],"reg":"conversational · reflective","evidence":["Lived detail","a sound, a hot step, a neighbour’s chair"],"first":"Drops you into a scene","counter":"None","s":[["The summer I was nine, the city cut down the elm in front of our building.","evidence","Scene"],["I remember the sound more than the sight: a chainsaw, then a long creak, then a silence that seemed to belong to the whole street.","evidence","Detail"],["Afterward, our front steps were too hot to sit on, and Mrs. Okafor from upstairs stopped bringing her chair outside.","evidence","Detail"],["I didn’t have words for it then.","link","Turn",1],["Now, when I walk under a canopy of maples, I notice the people sitting beneath them, and I think of that empty patch of sun.","analysis","Reflection through image"]]}]},"build":{"tc2Intro":"Tap a card, then move it up or down. Tap \u003cstrong>Leave out\u003c/strong> to take a card out of the skeleton.","cards":[{"id":"a","t":"(a) Claim"},{"id":"b","t":"(b) Strongest reason, with evidence"},{"id":"c","t":"(c) Second reason, with evidence"},{"id":"d","t":"(d) Counterargument and rebuttal"},{"id":"e","t":"(e) Conclusion: implication or call to action"}],"start":["e","b","d","a","c"],"tc3Intro":"The school board will vote on whether to keep the library open until 9 p.m. during exam weeks. You get one page to influence the trustees.","dials":[{"id":"form","t":"Form","options":[{"id":"exp","t":"expository"},{"id":"arg","t":"argumentative"},{"id":"cmp","t":"comparative"},{"id":"lit","t":"literary analysis"},{"id":"per","t":"personal"}]},{"id":"pattern","t":"Pattern","options":[{"id":"asp","t":"aspects"},{"id":"crr","t":"claim–reasons–rebuttal"},{"id":"blk","t":"block"},{"id":"pbp","t":"point-by-point"},{"id":"scn","t":"scene → reflection"}]},{"id":"voice","t":"Voice","options":[{"id":"first","t":"first person conversational"},{"id":"third","t":"third person formal and confident"},{"id":"second","t":"second person casual"}]},{"id":"evidence","t":"Evidence","options":[{"id":"lived","t":"lived detail only"},{"id":"data","t":"reasons with data and examples"},{"id":"quotes","t":"quotations from literature"},{"id":"defs","t":"definitions"}]}],"anecdote":"Include a brief personal anecdote as one reason"},"tour":{"eb":"Leacock x-rayed: “rattle” five times, each one wider. First person · comic · confessional.","ea":"Bacon x-rayed: short, balanced clauses. Third person (with “men”) · authoritative · compressed.","caption":"Same century of English prose? No: three centuries apart. Same craft: purpose shapes form.","replay":"Replay the x-ray tour"},"aha":"The purpose drives everything else. Change what the essay is \u003cem>for\u003c/em>, and its opening move, pronouns, evidence and order all change with it.","voiceNote":"Read it aloud yourself.","predIntro":"Make a prediction first. Then the blueprint table shows you what happens.","predictions":[{"id":"p1","prompt":"Shape-shifter, starting at “Explain”. The writer adds a paragraph that answers critics (“Some argue trees damage sidewalks, but…”). What form is the piece becoming?","options":[{"t":"Argumentative","_n":"o052","_k":"39b1332b"},{"t":"Expository","_n":"p022","_k":"2b9c6298"},{"t":"Personal","_n":"q032","_k":"7c8f9750"},{"t":"Comparative","_n":"r082","_k":"d26e5f50"}],"explain":"Answering objections means you’re defending a position. That’s argument."},{"id":"p2","prompt":"Excerpt E (Iqaluit vs Windsor) is in block form: all of Iqaluit, then all of Windsor. The writer switches to point-by-point (light, then cold, then community life, each comparing both cities). What happens?","options":[{"t":"It gets less organized","_n":"s092","_k":"b03e5158"},{"t":"The comparisons get sharper, because the reader sees each contrast side by side","_n":"t062","_k":"071d1aeb"},{"t":"The essay becomes argumentative","_n":"u052","_k":"6d63b3ca"},{"t":"Nothing changes","_n":"v082","_k":"81f2730c"}],"explain":"Point-by-point puts the differences next to each other, so the reader doesn’t have to remember paragraph two while reading paragraph five."},{"id":"p3","prompt":"Excerpt G (the grandmother’s recipe) ends: “I learned that family is the most important thing.” The writer replaces that last line with an image: “I still can’t read her handwriting, so I make the soup by feel.” What’s the effect?","options":[{"t":"It turns into an expository essay","_n":"w072","_k":"42fb9d5a"},{"t":"The ending trusts the reader to feel the insight instead of being told it","_n":"x022","_k":"9855ecf3"},{"t":"It weakens the voice","_n":"y012","_k":"79b4ab92"},{"t":"It becomes confusing and pointless","_n":"z042","_k":"9f2b4eec"}],"explain":"A personal essay earns its meaning. An image the reader completes is stronger than a moral announced."},{"id":"p4","prompt":"Excerpt F (literary analysis). The writer changes “I think the poem is sad” to “The poem’s quiet imperatives turn grief into instruction.” What happens to the voice?","options":[{"t":"It becomes more precise and authoritative, focused on the text","_n":"10032","_k":"e737833d"},{"t":"It becomes less honest","_n":"110e2","_k":"fc8ccf99"},{"t":"Nothing; they mean the same thing","_n":"120d2","_k":"2b5bd453"},{"t":"It becomes argumentative","_n":"13fc1","_k":"dcdb1e42"}],"explain":"Your name is on the essay; the reader knows it’s your view. Spend the words on the text."}],"chalIntro":"Use the blueprint table to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Sort all eight excerpts correctly. \u003cbutton type='button' class='btn ghost sm ef-setup' data-setup='tc1'>Set it up\u003c/button>","why":"Each excerpt’s purpose decided its bin: explaining, convincing, comparing, interpreting a text or exploring a life. (Some readers call Bacon “persuasive exposition”; he advises with authority, but his essay explains the uses of study, so its bin is Expository.)","msgs":{"place":"Place all eight excerpts in a bin first.","leacock":"He’s not explaining banking; he’s confessing his own comic dread. That’s personal.","bacon":"Bacon advises with authority, but he isn’t answering an opponent or urging one policy. His essay explains the uses of study.","eh":"It weighs two sides of one debate to take a position. That’s argument, not a comparison of two subjects."},"general":"Some excerpts are in the wrong bin. Ask of each: what is it \u003cem>for\u003c/em>?","hints":["Ask of each: what is it \u003cem>for\u003c/em>?","Explaining, convincing, comparing, interpreting a text, or exploring a life?","Expository: Bacon (explains the uses of study) and the Shield (explains how glaciers shaped it). Argumentative: library hours and phones in class (each defends a position). Comparative: Iqaluit and Windsor (two subjects side by side). Literary analysis: Rossetti’s “Remember” (interprets a text). Personal: Leacock (his own comic dread) and the recipe card (a lived memory)."]},{"id":"tc2","goal":2,"prompt":"Build an argumentative skeleton: put the five parts in an effective order. \u003cbutton type='button' class='btn ghost sm ef-setup' data-setup='tc2'>Set it up\u003c/button>","_a":"Pm4QVxcUQ1JHGRBUFxRDVUcZEFMXZU1qR1QQGhdcQx1HVhAaF1pDHUdQEGto","why":"Both orders work. \u003cstrong>Rebuttal late\u003c/strong> (a, c, b, d, e): the strongest reason comes just before the counterargument. \u003cstrong>Rebuttal early\u003c/strong> (a, d, c, b, e): the objection is dealt with first, and the essay builds to its strongest reason.","msgs":{"dlast":"Don’t introduce an objection in your final words. Answer it before you conclude.","nod":"Leaving out the counterargument makes the argument look as if it’s hiding from the obvious objection.","ebeforeb":"A conclusion can’t come before the evidence."},"general":"Not an effective order yet. Claim first; conclusion last; every part has a job.","hints":["Claim first; conclusion last.","Where does the opponent’s best point get answered: right after your claim, or just before you conclude?","a, c, b, d, e (or a, d, c, b, e)."]},{"id":"tc3","goal":[1,4],"stretch":true,"prompt":"The school board will vote on whether to keep the library open until 9 p.m. during exam weeks. You get one page to influence the trustees. Set the four dials so that every choice fits. \u003cbutton type='button' class='btn ghost sm ef-setup' data-setup='tc3'>Set it up\u003c/button>","_a":"HhdUWUdVQwtHVEBRFxRDQQRBRlNHVkMLR1ZARBcUQ0cKXFFTFwJDRQ1cQFIXFENUE1xWU1tbBBNfF1ZXQVlDHUdUXkIXAhoTE1pbVVAaWxMDXEBFQRpNEwRbV1VRVxVURw9GREBdHEw=","why":"Argumentative, claim–reasons–rebuttal, third person formal and confident, reasons with data: every dial serves people who must cast a vote. (A first-person voice can work too, if your own story is just one reason among several.)","msgs":{"personal":"A moving story might help as one example, but trustees vote on reasons and evidence.","expository":"Explaining library hours won’t change a vote. You need to argue.","second":"Too informal for trustees making a policy decision.","quotes":"Wrong kind of evidence for a policy decision."},"general":"Not every dial fits the trustees yet. Ask what you want them to \u003cem>do\u003c/em>.","hints":["What do you want the trustees to \u003cem>do\u003c/em>?","Change a vote, so argue, with reasons they can check.","Argumentative; claim–reasons–rebuttal; third person formal; reasons with data."]}],"blocks":[{"title":"Reader: the two essays","html":"\u003cp class='tiny muted'>Both essays are in the public domain and are shown in full. Bacon’s essay is printed as in \u003cem>The Works of Francis Bacon\u003c/em>, vol. 1 (1884), which modernizes the 1625 spelling; the wording is his. Bacon uses “men” in the historical sense of “people”; the quotations keep his word.\u003c/p>\u003cdiv id='ef-reader'>\u003c/div>"}]},"part3":{"slug":"four-forms","name":"Four forms","heading":"Same topic, four forms","intro":"Hold the topic still and only the form changes. Read four paragraphs on \u003cstrong>winter in Canada\u003c/strong>, compare their skeletons in the grid, then choose a form for new purposes.","paras":[{"id":"exp","form":"Expository","title":"How snow quiets a city","s":["A fresh snowfall makes a city sound different, and the reason lies in the snow itself.","New snow is mostly air: the spaces between its branching crystals trap tiny pockets of it, and those pockets absorb sound waves instead of bouncing them back.","A layer of fluffy snow on roofs, cars and lawns works like the foam panels in a recording studio, soaking up the noise of traffic and voices.","That is why streets seem hushed the morning after a storm.","The effect fades as the snow settles: packed by tires and boots, or glazed by a freeze, it loses its air pockets and starts to reflect sound.","A city’s winter silence, in other words, lasts only as long as its snow stays new."]},{"id":"arg","form":"Argumentative","title":"Clear the sidewalks first","s":["Cities should plough sidewalks before secondary roads after every snowfall.","Pedestrians include the people least able to climb over a snowbank: children walking to school, seniors with canes, and anyone pushing a stroller or using a wheelchair.","Falls on icy sidewalks send thousands of Canadians to emergency rooms every winter, and each injury costs far more than an early pass of a sidewalk plough.","Some drivers object that side streets must be cleared first for safety.","That concern is fair, but a priority-route plan can do both: main roads and sidewalks first, side streets within hours.","If we want winter cities that everyone can move through, the sidewalk has to come first."]},{"id":"cmp","form":"Comparative","title":"Two winters","s":["Two places can share a season without sharing a winter: a northern community builds much of its social life around the cold, while a southern Ontario city mostly endures it.","In Inuvik, the sun does not rise for about a month in December and January; in London, Ontario, even the shortest day has nine hours of light.","Inuvik’s cold regularly reaches −30 °C, so people plan their gatherings around it, while London treats its milder cold as an inconvenience to wait out.","And when the light comes back, Inuvik holds a festival to welcome the sun, while London simply notices that the evenings are getting longer.","Side by side, the two show that a hard season can become something a community celebrates rather than merely survives."]},{"id":"per","form":"Personal","title":"My first snow","s":["The first snow I ever saw fell during lunch, in the school parking lot, three months after my family moved to Canada.","I stood between two pickup trucks with my mouth open, tasting a sky I had only read about.","Then I noticed the others.","My classmates were hunching their shoulders, kicking at the slush and complaining that winter had come too early; I was the only person in the lot who was amazed.","I didn’t know yet whether that made me a stranger or a lucky one.","Every November since, I have caught the first flakes on a dark mitten and waited to see their six-sided shapes before they melt."]}],"grid":{"intro":"Predict each cell first (say it aloud or in your head), then tap it to reveal. Tap once to get ready, again to reveal.","rows":[{"id":"purpose","t":"Purpose","cells":["explain","convince","illuminate by contrast","explore and discover"]},{"id":"first","t":"First sentence’s job","cells":["names the phenomenon","states the claim","states the comparison’s insight","drops you into a scene"],"hl":"first"},{"id":"pron","t":"Pronouns","cells":["third person","third person (“cities”, “we” once)","third person","first person"]},{"id":"evid","t":"Evidence","cells":["causes, facts","reasons, data, a counterargument","paired details","sensory, lived detail"]},{"id":"end","t":"Ending","cells":["synthesis","implication or call to action","what the contrast reveals","an image that holds the insight"],"hl":"last"}]},"choose":{"intro":"Choose a form for each purpose (two forms can combine), then the one-line justification that fits, and press Check.","forms":[{"id":"exp","t":"Expository"},{"id":"arg","t":"Argumentative"},{"id":"cmp","t":"Comparative"},{"id":"lit","t":"Literary analysis"},{"id":"per","t":"Personal"}],"just":[{"id":"j1","t":"It explains how or why something happens."},{"id":"j2","t":"It takes a position and tries to change minds."},{"id":"j3","t":"It explores a lived moment until it yields an insight."},{"id":"j4","t":"It interprets texts by setting them side by side."}],"cards":[{"id":"ca","t":"A science-fair panel asks why lake ice cracks loudly at night.","_a":"HhdUWUdVEhNfbhBTTUhDbEkXWBQPGgsAR0g=","good":"Expository: the panel explains a natural phenomenon."},{"id":"cb","t":"A newspaper’s student column invites opinions on winter school closures.","_a":"HhdUWUdVEhNfbhBXR19DbEkXWBQPGgsDR0g=","good":"Argumentative: an opinion column asks you to take a side and defend it."},{"id":"cc","t":"A university application asks about a moment that changed your perspective.","_a":"HhdUWUdVEhNfbhBGUEpDbEkXWBQPGgsCR0g=","good":"Personal: the readers want a person, seen through a moment."},{"id":"cd","t":"An English assignment asks how two poems treat winter differently.","_a":"HhdUWUdVEhNfbhBVWEhDHUdZW0IXZU0TDxcIFF8MQ0w=","good":"Comparative literary analysis: this is literary analysis organized comparatively. Forms can combine."}],"bad":"Not quite. Ask what this reader needs the piece to do.","half":"Half right. This task interprets poems \u003cem>and\u003c/em> compares them: choose both forms.","noJust":"Choose a justification too."},"blocks":[{"title":"What the grid shows","html":"\u003cp>The four paragraphs share their facts about snow, cold and light, yet each makes those facts mean something different. In exposition, cold is a cause. In argument, it’s a reason to act. In comparison, it’s one side of a contrast. In a personal essay, it’s the doorway to a feeling. \u003cstrong>Form decides what the facts are for.\u003c/strong>\u003c/p>"}],"quickCheck":{"title":"Four forms: quick check","summary":"Four forms quick check","items":[{"id":"q1","goal":1,"prompt":"Which paragraph’s first sentence drops you into a scene?","choices":[{"t":"Expository","fb":"Personal essays often begin in a moment, not with a thesis.","_n":"14fd1","_k":"5f60c0b6"},{"t":"Argumentative","fb":"Personal essays often begin in a moment, not with a thesis.","_n":"15fe1","_k":"1640bc1a"},{"t":"Comparative","fb":"Personal essays often begin in a moment, not with a thesis.","_n":"16ff1","_k":"438f33d6"},{"t":"Personal","fb":"Right. Personal essays often begin in a moment, not with a thesis.","_n":"17001","_k":"8b1c17c8"}]},{"id":"q2","goal":2,"prompt":"Which paragraph includes a counterargument?","choices":[{"t":"Expository","fb":"Answering an objection is argument’s signature move.","_n":"18011","_k":"cc4c3c89"},{"t":"Argumentative","fb":"Right. Answering an objection is argument’s signature move.","_n":"19021","_k":"26c88d44"},{"t":"Comparative","fb":"Answering an objection is argument’s signature move.","_n":"1a031","_k":"ffb534f2"},{"t":"Personal","fb":"Answering an objection is argument’s signature move.","_n":"1b041","_k":"104ff1f6"}]},{"id":"q3","goal":2,"prompt":"Why does the comparative paragraph use point-by-point order?","choices":[{"t":"So each contrast sits side by side","fb":"Right. Point-by-point keeps the comparison in view.","_n":"1c051","_k":"1641c571"},{"t":"Because it argues","fb":"Point-by-point keeps the comparison in view.","_n":"1d021","_k":"9da1e5c6"},{"t":"Because it’s personal","fb":"Point-by-point keeps the comparison in view.","_n":"1e011","_k":"658301e8"},{"t":"Because it’s shorter","fb":"Point-by-point keeps the comparison in view.","_n":"1f001","_k":"3e748a36"}]},{"id":"q4","goal":4,"prompt":"An assignment asks how two poems treat winter differently. Which form?","choices":[{"t":"Personal","fb":"It interprets texts (literary analysis) by comparing them.","_n":"1gff1","_k":"af16bc17"},{"t":"Expository","fb":"It interprets texts (literary analysis) by comparing them.","_n":"1h061","_k":"18d8880e"},{"t":"Argumentative","fb":"It interprets texts (literary analysis) by comparing them.","_n":"1i051","_k":"d3f52770"},{"t":"Comparative literary analysis","fb":"Right. It interprets texts (literary analysis) by comparing them.","_n":"1j041","_k":"5a602891"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“When I go into a bank I get rattled. The clerks rattle me; the wickets rattle me; the sight of the money rattles me; everything rattles me.”\u003c/p>\u003cp class='eng-cite'>Stephen Leacock, “My Financial Career” (1910), par. 1\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> a plain confession (“When I go into X I get Y.”), then a list of parallel clauses joined by semicolons, each repeating the verb, escalating from specific things to “everything”. The repetition \u003cem>is\u003c/em> the joke: the reader hears his nerves multiplying.\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “When I walk into a dentist’s office I get nervous. The magazines make me nervous; the humming makes me nervous; the poster of a grinning tooth makes me nervous; everything makes me nervous.”\u003c/p>\u003cp>Write your own confession in the same shape about a place that unsettles you.\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"When I go into a bank I get rattled. The clerks rattle me; the wickets rattle me; the sight of the money rattles me; everything rattles me.","source":"Leacock, “My Financial Career”, par. 1","checks":["Your first sentence starts with “When I”","Your second sentence has at least 3 semicolons","Its final clause begins with “everything”"],"save":"Save to my commonplace book"}},"practice":{"activities":[{"id":"match","type":"match","title":"Form ↔ features","summary":"Form ↔ features","goal":[1,2,3],"instruction":"Match each form or pattern with what it does.","leftTitle":"Form or pattern","rightTitle":"What it does","left":[{"id":"l1","t":"Expository essay","goal":1,"why":"Its job is to explain, in a clear, neutral voice.","hints":["Find the purpose word.","It’s one of “explains how or why…” or “takes a debatable position…”.","“Explains how or why something works, in a clear, neutral voice”: exposition explains."]},{"id":"l2","t":"Argumentative essay","goal":1,"why":"Its job is to convince, so it meets the best objection.","hints":["Find the purpose word.","It’s one of “takes a debatable position…” or “states what setting two subjects side by side reveals”.","“Takes a debatable position and answers the strongest objection”: argument convinces."]},{"id":"l3","t":"Comparative essay","goal":1,"why":"Its job is to illuminate two things by setting them side by side.","hints":["Find the purpose word.","It’s one of “states what setting two subjects side by side reveals” or “each paragraph compares both subjects on one aspect”.","“States what setting two subjects side by side reveals”: that’s the comparative essay’s whole job; point-by-point is one way to organize it."]},{"id":"l4","t":"Literary analysis","goal":1,"why":"Its job is to show how a text makes meaning, in the literary present.","hints":["Find the purpose word.","It’s one of “shows how a text’s techniques create meaning…” or “moves from a lived scene…”.","“Shows how a text’s techniques create meaning, in the literary present”: analysis interprets a text."]},{"id":"l5","t":"Personal essay","goal":1,"why":"Its job is to explore a lived experience until it yields an insight.","hints":["Find the purpose word.","It’s one of “moves from a lived scene to a reflection…” or “shows how a text’s techniques create meaning…”.","“Moves from a lived scene to a reflection that earns its insight”: a personal essay explores a life."]},{"id":"l6","t":"Point-by-point","goal":2,"why":"It alternates the two subjects within each paragraph.","hints":["Find the word that says how the paragraphs are organized.","It’s one of “each paragraph compares both subjects on one aspect” or “all of subject A, then all of subject B…”.","“Each paragraph compares both subjects on one aspect”: the subjects meet in every paragraph."]},{"id":"l7","t":"Block structure","goal":2,"why":"It keeps each subject together, then brings them together at the end.","hints":["Find the word that says how the paragraphs are organized.","It’s one of “all of subject A, then all of subject B…” or “each paragraph compares both subjects…”.","“All of subject A, then all of subject B, then the synthesis”: each subject gets its own block."]},{"id":"l8","t":"Aphoristic style","goal":3,"why":"Bacon’s sentences are built to be carried away and remembered.","hints":["Find the word that describes the sentences.","It’s one of “compressed, balanced sentences…” or “in a clear, neutral voice”.","“Compressed, balanced sentences meant to be remembered (Bacon)”: an aphorism is a portable truth."]}],"right":[{"id":"r1","t":"Explains how or why something works, in a clear, neutral voice"},{"id":"r2","t":"Takes a debatable position and answers the strongest objection"},{"id":"r3","t":"States what setting two subjects side by side reveals"},{"id":"r4","t":"Shows how a text’s techniques create meaning, in the literary present"},{"id":"r5","t":"Moves from a lived scene to a reflection that earns its insight"},{"id":"r6","t":"Each paragraph compares both subjects on one aspect"},{"id":"r7","t":"All of subject A, then all of subject B, then the synthesis"},{"id":"r8","t":"Compressed, balanced sentences meant to be remembered (Bacon)"}],"_a":"HhdeBxcCQ0NUFx4UWQpDC0dHABQZGg0CRw8QRAYaTRMJARAMF0pVE0kXXgMXAkNDUBceFFkOQwtHRwQUGRoNBkcPEEQCGk0TCQ0QDBdKWRMY","wrong":{"l1|r2":"That’s argument; exposition explains.","l6|r7":"Point-by-point alternates within paragraphs; block keeps each subject together.","l7|r6":"Point-by-point alternates within paragraphs; block keeps each subject together.","l5|r4":"Personal essays use the writer’s own time; the literary present is for analysis."},"wrongDefault":"Read the description again: what is the form’s \u003cem>job\u003c/em>?"},{"id":"choose","type":"mc","title":"Choose the form","summary":"Choose the form","star":true,"goal":[4,5,6],"instruction":"Read the situation. Choose the form \u003cstrong>and\u003c/strong> the opening move that best fits it.","items":[{"id":"c1","goal":4,"prompt":"A museum asks for a 300-word panel on how birchbark canoes were built.","options":[{"t":"Argumentative: open by claiming canoes are better than kayaks","why":"Visitors came to learn how the canoes were built, not to be won over.","_n":"1k031","_k":"423e40c4"},{"t":"Literary analysis: open with a thesis about a poem on canoes","why":"There’s no text to interpret; the panel explains a craft.","_n":"1l0a1","_k":"19a57925"},{"t":"Expository: name the craft and its key steps","why":"It informs visitors.","_n":"1m091","_k":"ca96ad1b"},{"t":"Personal: open with your own memory of paddling a canoe","why":"The panel isn’t about you.","_n":"1n081","_k":"733de2a6"}],"hints":["Who’s reading, and what should happen in their mind?","Visitors want to learn how something was made: which form explains?","Expository: name the craft and its key steps. It informs visitors."]},{"id":"c2","goal":4,"prompt":"A classmate argues that homework should be banned; you’re asked to respond.","options":[{"t":"Comparative: open by setting homework beside class time","why":"You’re answering, not comparing.","_n":"1o091","_k":"3846a41e"},{"t":"Personal: open with a scene of yourself doing homework late at night","why":"A scene might help later, but the task is to answer a claim.","_n":"1p061","_k":"a206afb6"},{"t":"Argumentative: open with a clear counter-claim","why":"You’re taking a position in a debate.","_n":"1q071","_k":"f8c31a11"},{"t":"Expository: open by explaining what homework is","why":"Explaining homework doesn’t answer your classmate’s claim.","_n":"1r041","_k":"7a573606"}],"hints":["Who’s reading, and what should happen in their mind?","You’re answering a claim, so you need a claim of your own.","Argumentative: open with a clear counter-claim. You’re taking a position in a debate."]},{"id":"c3","goal":4,"prompt":"Compare how two short stories end.","options":[{"t":"Comparative literary analysis: open with an insight thesis","why":"It interprets two texts by comparing them.","_n":"1s051","_k":"b94b8281"},{"t":"Personal: open with how each ending made you feel","why":"The task is about the texts.","_n":"1t021","_k":"40aba2d6"},{"t":"Expository: open by summarizing both plots","why":"Summary isn’t interpretation; say what the comparison reveals.","_n":"1u031","_k":"d243cf3e"},{"t":"Argumentative: open by claiming one ending is better","why":"A preference, not an analysis of how the endings work.","_n":"1v101","_k":"e199f361"}],"hints":["Who’s reading, and what should happen in their mind?","Two texts, interpreted side by side.","Comparative literary analysis: open with an insight thesis. It interprets two texts by comparing them."]},{"id":"c4","goal":6,"prompt":"A personal statement for a nursing program asks why you want to care for others.","options":[{"t":"Argumentative: open by arguing that Canada needs more nurses","why":"A policy argument doesn’t show who you are.","_n":"1w111","_k":"6c94fb65"},{"t":"Personal: open in a specific scene (e.g. sitting with a grandparent in hospital)","why":"Admissions readers want a person, shown through a moment.","_n":"1x8e2","_k":"0507e4cf"},{"t":"Personal: op
