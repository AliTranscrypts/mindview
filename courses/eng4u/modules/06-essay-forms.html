en with “I have always wanted to help people.”","why":"A generic opener. Show a moment instead.","_n":"1y8d2","_k":"48db0234"},{"t":"Expository: open by explaining what nurses do","why":"The readers know what nurses do; they want to know you.","_n":"1z902","_k":"82103fe4"}],"hints":["Who’s reading, and what should happen in their mind?","The form is personal. Which opening \u003cem>shows\u003c/em> a person?","Personal: open in a specific scene. Admissions readers want a person, shown through a moment."]},{"id":"c5","goal":5,"prompt":"Write about Leacock’s “My Financial Career” for a reader who thinks humour is “just for fun”.","options":[{"t":"Personal: open with “Banks make me nervous too.”","why":"A personal response doesn’t answer the doubter.","_n":"208f2","_k":"64a3748a"},{"t":"Expository: open by explaining how banks worked in 1910","why":"Context, not interpretation; the doubter is still unanswered.","_n":"21922","_k":"b47b22c4"},{"t":"Literary analysis: open with a thesis that the essay’s comedy is engineered","why":"You’re interpreting the text \u003cem>and\u003c/em> answering a doubter: analysis with an argumentative edge. Forms combine.","_n":"22912","_k":"adf0d3bf"},{"t":"Comparative: open by setting Leacock beside a modern comedian","why":"A comparison could come later; first you have to show how the essay works.","_n":"23942","_k":"0ac84be4"}],"hints":["Who’s reading, and what should happen in their mind?","Interpret the text, and answer the doubter.","Literary analysis: open with a thesis that the comedy is engineered. You’re interpreting the text and answering a doubter: forms combine."]},{"id":"c6","goal":6,"prompt":"A one-page op-ed for a city paper, for readers who disagree with you, on whether to rename a local street.","options":[{"t":"Personal: open with a memory of the street and never state a position","why":"A memory may help, but an op-ed needs a clear claim.","_n":"24932","_k":"925ebecc"},{"t":"Argumentative: open by granting the opponents’ value, then state your claim","why":"With a hostile audience, beginning with common ground (a concession) earns a hearing.","_n":"25862","_k":"9af5b738"},{"t":"Argumentative: open with “Anyone who disagrees is ignorant.”","why":"Attacking readers loses them.","_n":"26852","_k":"179ce273"},{"t":"Expository: open by explaining the history of street names","why":"Background alone won’t change minds; an op-ed needs a claim.","_n":"27843","_k":"89cb0440"}],"hints":["Who’s reading, and what should happen in their mind?","The form is argument, and the readers disagree. Which opening earns a hearing?","Argumentative: grant the opponents’ value, then state your claim. With a hostile audience, common ground earns a hearing."]}]},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Golnaz","goal":[2,3],"instruction":"Golnaz made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"an argumentative paragraph on extended library hours.","steps":["The school library should stay open until 9 p.m. during exam weeks.","Many students lack a quiet place to study at home.","Last June, the library’s sign-in sheet showed students waiting at the door every morning.","People who oppose late hours obviously don’t care about students.","Therefore the board should approve the change."],"_a":"Vg==","stepFb":["Sentence 1 is a clear claim.","Sentence 2 is a reason.","Sentence 3 is evidence.","","Sentence 5 follows the mistake. Look earlier."],"fixes":[{"t":"“Some trustees worry about staffing costs; a rotation of volunteer teachers and parents would keep costs low.”","why":"It states the real objection fairly and answers it.","_n":"28853","_k":"6ba3619d"},{"t":"Sentence 4 is correct.","why":"Attacking opponents’ motives isn’t a counterargument, and it alienates the very readers you need.","_n":"29863","_k":"f533436c"},{"t":"“Opponents are probably lazy.”","why":"Still an attack on people.","_n":"2a873","_k":"8f0e04c5"},{"t":"Delete sentence 4.","why":"Better than an insult, but the argument still ignores the obvious objection.","_n":"2b803","_k":"5fb954e9"}],"hints":["Does each sentence argue about the \u003cem>idea\u003c/em>?","One sentence attacks people.","Sentence 4. Replace it with a fair counterargument and a rebuttal."]},{"id":"e2","goal":2,"task":"a comparative paragraph on Bacon and Leacock.","steps":["Bacon and Leacock both write about a person facing an institution.","Bacon’s “Of Studies” advises readers to master books with judgment.","His sentences are short and balanced, like proverbs.","He uses the word “some” to divide books into kinds.","Bacon wrote during the reign of James I."],"_a":"Vg==","stepFb":["Sentence 1 sets up the comparison.","Sentence 2 states Bacon’s side.","Sentence 3 is detail about Bacon.","","Sentence 5 follows the mistake. Look earlier."],"fixes":[{"t":"“Leacock, by contrast, shows a man mastered by a bank, his panicky repetitions the opposite of Bacon’s poise.”","why":"It finally sets the two side by side.","_n":"2c813","_k":"cf7fa4ce"},{"t":"Sentence 4 is correct.","why":"It’s accurate, but it keeps the paragraph on one subject. A comparative paragraph must bring in the second subject.","_n":"2d823","_k":"6608540d"},{"t":"Add another detail about Bacon’s life.","why":"More Bacon deepens the problem.","_n":"2e833","_k":"1ec88d55"},{"t":"Move sentence 1 to the end.","why":"The setup is fine; the comparison is missing.","_n":"2f8c3","_k":"308ce822"}],"hints":["Count how many sentences mention Leacock.","None, after sentence 1.","Sentence 4. Bring Leacock in by contrast."]},{"id":"e3","goal":3,"task":"a literary-analysis paragraph on Leacock’s opening.","steps":["Leacock’s opening turns nervousness into comedy through repetition.","The verb “rattle” recurs five times in two sentences.","I personally think this is really funny and I laughed a lot.","The escalation to “everything rattles me” makes his anxiety absurdly total."],"_a":"Vw==","stepFb":["Sentence 1 is a strong claim.","Sentence 2 is evidence.","","Sentence 4 follows the mistake. Look earlier."],"fixes":[{"t":"“Each repetition widens the circle of things that unnerve him, so the reader hears his panic multiplying.”","why":"It explains \u003cem>how\u003c/em> the repetition creates comedy.","_n":"2g8d3","_k":"0e7974f3"},{"t":"Sentence 3 is correct.","why":"Your enjoyment isn’t evidence. Analyse what the writing does.","_n":"2h0a3","_k":"aa9d971e"},{"t":"“I found it hilarious.”","why":"Still a personal reaction.","_n":"2i093","_k":"a42dc2a7"},{"t":"Delete sentence 2.","why":"That’s the evidence; keep it.","_n":"2j083","_k":"886a6fc1"}],"hints":["Which sentence is about the reader instead of the text?","Look for “I”.","Sentence 3. Replace it with analysis of the repetition."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which form surprised you most in the shape-shifter? What changed most when the purpose changed?"},{"id":"j2","q":"In your own words, explain why the five-paragraph essay is a starting point, not the only shape."},{"id":"j3","q":"Explain to a friend how to tell an expository essay from an argumentative one, with an example of each on the same topic."},{"id":"j4","q":"Which form do you find hardest to write? What will you practise, and when?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Bacon wrote that “Some books are to be tasted, others to be swallowed, and some few to be chewed and digested.” Save it (or another line from today) and name one book you would put in each category.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one principle about form, purpose or voice in your own words. Choose a master’s example (a line from Bacon, Leacock or a model paragraph) and write your own imitation.","placeholder":"Your principle, in one sentence of at least six words","examples":["Studies serve for delight, for ornament and for ability. (Bacon, “Of Studies”)","Reading maketh a full man; conference a ready man; and writing an exact man. (Bacon, “Of Studies”)","Some books are to be tasted, others to be swallowed, and some few to be chewed and digested. (Bacon, “Of Studies”)","The clerks rattle me; the wickets rattle me; the sight of the money rattles me; everything rattles me. (Leacock, “My Financial Career”)","Since then I bank no more. (Leacock, “My Financial Career”)","I still can’t read her handwriting, so I make the soup by feel. (model paragraph, “the recipe card”)"]},"artSamples":[{"p":"Decide what the essay is \u003cem>for\u003c/em> before you decide how it begins.","m":"Studies serve for delight, for ornament and for ability. (Bacon)","i":"Maps serve for travel, for memory, and for argument."},{"p":"Repetition can turn a feeling into a rhythm the reader feels too.","m":"The clerks rattle me; the wickets rattle me; the sight of the money rattles me; everything rattles me. (Leacock)","i":"The alarms wake me; the buses wake me; the gulls wake me; everything wakes me."}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which form’s main purpose is to persuade a reader to accept a position?","options":[{"t":"Argumentative","why":"It defends a position.","_n":"2k073","_k":"847fb3e0"},{"t":"Expository","why":"Exposition explains; it doesn’t push a position.","_n":"2l063","_k":"2e0b4eb9"},{"t":"Personal","why":"Personal essays explore experience.","_n":"2m053","_k":"189111df"},{"t":"Comparative","why":"Comparison illuminates; it may not take a side.","_n":"2n043","_k":"423798a9"}]},"b":{"prompt":"Which form’s main purpose is to explore a lived experience until it yields an insight?","options":[{"t":"Expository","why":"Exposition explains a subject.","_n":"2o033","_k":"da339e53"},{"t":"Literary analysis","why":"Analysis interprets a text.","_n":"2p123","_k":"da98a2c2"},{"t":"Argumentative","why":"Argument defends a position.","_n":"2q113","_k":"50bd7e48"},{"t":"Personal","why":"It explores a lived experience until it yields an insight.","_n":"2re8d","_k":"8f356218"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In a \u003cstrong>point-by-point\u003c/strong> comparative essay, how are body paragraphs organized?","options":[{"t":"All of subject A, then all of subject B","why":"That’s block structure.","_n":"2se7d","_k":"30495a71"},{"t":"Claim, reasons, rebuttal","why":"That’s argument.","_n":"2tead","_k":"b06deb70"},{"t":"Each paragraph compares both subjects on one aspect","why":"Each contrast sits side by side.","_n":"2ue9d","_k":"21394632"},{"t":"One paragraph per personal memory","why":"That’s a personal essay’s pattern.","_n":"2ve4d","_k":"2c465103"}]},"b":{"prompt":"In a \u003cstrong>block\u003c/strong> comparative essay, how are body paragraphs organized?","options":[{"t":"Scene, turn, reflection","why":"That’s personal.","_n":"2we3d","_k":"97637599"},{"t":"Each paragraph compares both subjects on one aspect","why":"That’s point-by-point.","_n":"2xe6d","_k":"885bca13"},{"t":"Aspect by aspect of one subject","why":"That’s exposition.","_n":"2ye5d","_k":"7b5625b5"},{"t":"All of subject A, then all of subject B, followed by a synthesis","why":"Each subject gets its own block before the two are brought together.","_n":"2ze0d","_k":"c1bf2868"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"Which statement about essay structure is accurate?","options":[{"t":"Different forms have different typical structures; the five-paragraph essay is one simple model","why":"Form follows purpose.","_n":"30dfd","_k":"419224b0"},{"t":"Personal essays have no structure","why":"They move from scene to reflection.","_n":"3162d","_k":"b3d4f260"},{"t":"The thesis must always be the last sentence of the first paragraph","why":"Personal essays often reveal their insight late.","_n":"3263d","_k":"8b3bda66"},{"t":"Every essay must have exactly five paragraphs","why":"Five paragraphs is training wheels. Real essays take the shape their purpose needs.","_n":"3360d","_k":"321547f0"}]},"b":{"prompt":"What tense does literary analysis normally use to discuss events in a text?","options":[{"t":"Whatever the text uses","why":"Convention calls for the present.","_n":"3461d","_k":"4f658772"},{"t":"The future","why":"Not used.","_n":"3566d","_k":"9056c118"},{"t":"The past (“Hamlet hesitated”)","why":"Analysis treats the text as always happening.","_n":"3667d","_k":"5997e0b6"},{"t":"The literary present (“Hamlet hesitates”)","why":"Analysis treats the text as always happening.","_n":"3764d","_k":"19e1482b"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"\u003cblockquote class='ef-qpass'>Critics argue that a later school start would merely push activities into the evening. Yet the evidence from schools that shifted their bell times suggests that students slept more, not less, and attendance at first period rose.\u003c/blockquote>What form is this excerpt from?","options":[{"t":"Personal","why":"No lived scene or first person.","_n":"3865d","_k":"0e83fdfa"},{"t":"Argumentative","why":"It answers a criticism with evidence to defend a position.","_n":"395ad","_k":"899eca91"},{"t":"Expository","why":"It’s defending a claim, not just explaining.","_n":"3a5bd","_k":"87a63a8d"},{"t":"Comparative","why":"It weighs one side’s objection; it isn’t comparing two subjects.","_n":"3b5cd","_k":"1c884f77"}]},"b":{"prompt":"\u003cblockquote class='ef-qpass'>Whereas the Prairie sky seems to press the land flat with its weight, the Shield’s broken granite throws the sky into fragments between pines and lakes. One landscape teaches distance; the other, enclosure.\u003c/blockquote>What form is this excerpt from?","options":[{"t":"Argumentative","why":"It takes no position to defend.","_n":"3c5bd","_k":"f669d7fb"},{"t":"Expository","why":"It does more than explain one subject.","_n":"3d5ad","_k":"6cd0a5bf"},{"t":"Personal","why":"No lived “I”.","_n":"3e59d","_k":"8c2b629a"},{"t":"Comparative","why":"It sets two landscapes side by side to reveal a contrast.","_n":"3f58d","_k":"d1c9748b"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"A student wants to argue that Leacock’s essay is carefully crafted, for readers who think it is only silly. Which plan is strongest?","options":[{"t":"Describe Leacock’s life, then the essay","why":"Biography doesn’t prove craft.","_n":"3g57d","_k":"c98da2ca"},{"t":"Claim → conclusion, with no evidence","why":"Unsupported.","_n":"3h56d","_k":"cbb561ac"},{"t":"Claim → evidence of craft (repetition, escalation, timing) → counterargument (“it’s just silly”) answered → conclusion","why":"It makes a claim, proves the craft with evidence and answers the doubter.","_n":"3i55d","_k":"0c46610d"},{"t":"Retell the plot, then say it’s well written","why":"Summary, with no argument.","_n":"3j64d","_k":"ff8776d1"}]},"b":{"prompt":"A student wants to explain how Bacon’s essay is organized. Which plan is strongest?","options":[{"t":"Argue that Bacon is boring","why":"That’s an opinion, not the task.","_n":"3k63d","_k":"77ee1e5b"},{"t":"Write about their own reading habits","why":"Personal, not expository.","_n":"3l56d","_k":"3e592ff0"},{"t":"List quotations without comment","why":"A quote dump: quotations need explanation.","_n":"3m57d","_k":"9e7874c4"},{"t":"Focus statement → the three purposes of study → his advice on how to read → the closing claims about minds, each with a quotation and explanation","why":"A clear focus that follows the essay’s own order, with evidence explained.","_n":"3n58d","_k":"838c5733"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Bacon writes: “Some books are to be tasted, others to be swallowed, and some few to be chewed and digested.” What does the metaphor suggest?","options":[{"t":"Books should be eaten","why":"Too literal; it’s a metaphor.","_n":"3o59d","_k":"91962de4"},{"t":"Reading is unhealthy","why":"Nothing suggests that.","_n":"3p52d","_k":"3fef5f50"},{"t":"All books should be read the same way","why":"The opposite of his point.","_n":"3q53d","_k":"56b6584c"},{"t":"Different books deserve different depths of attention, from a sample to a full, slow absorption","why":"Tasted, swallowed, digested: three depths of reading.","_n":"3r54d","_k":"564b3593"}]},"b":{"prompt":"Leacock writes: “The clerks rattle me; the wickets rattle me; the sight of the money rattles me; everything rattles me.” What creates the comedy?","options":[{"t":"Its use of statistics","why":"There are none.","_n":"3s55d","_k":"515f93cc"},{"t":"Escalating repetition that swells his nervousness until it absurdly covers everything","why":"Each clause widens the circle until it takes in everything.","_n":"3t5ed","_k":"ed284ec8"},{"t":"Its formal vocabulary","why":"The diction is plain; the rhythm makes it funny.","_n":"3u5fd","_k":"1ebd508d"},{"t":"Its sad tone","why":"The tone is comic.","_n":"3v50d","_k":"f5638d90"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which revision best suits a literary-analysis essay? Original: “I think the poem is kind of sad because of the words.”","options":[{"t":"“The poem is sad. It is sad because of words.”","why":"Repetitive and vague.","_n":"3w4fd","_k":"7845cc54"},{"t":"“You will cry when you read this poem.”","why":"Second-person hype, not analysis.","_n":"3x52d","_k":"793cdea8"},{"t":"“I really feel the poem is very sad.”","why":"Literary analysis keeps the focus on the text: “The poem’s falling rhythm creates…”, not “I feel the poem is sad.”","_n":"3y51d","_k":"93ff6f8e"},{"t":"“The poem’s falling rhythm and images of fading light create a mood of mourning.”","why":"It names the text’s techniques and their effect.","_n":"3z54d","_k":"703ef74b"}]},"b":{"prompt":"Which revision best suits an argumentative essay? Original: “Anyone who wants longer lunches is just lazy.”","options":[{"t":"“A longer lunch would let students eat properly and still attend clubs, and the schedule can absorb ten minutes by shortening passing times.”","why":"Reasons and a practical answer, not an insult.","_n":"4053d","_k":"1adfb5ab"},{"t":"“I like long lunches.”","why":"A preference, not an argument.","_n":"4156d","_k":"303b0b78"},{"t":"“Lazy people want longer lunches.”","why":"A strong argument meets the best objection fairly, then answers it. Attacking opponents loses readers.","_n":"4255d","_k":"f4cb9c10"},{"t":"“Lunch is a meal eaten at midday.”","why":"Exposition, not argument.","_n":"4358d","_k":"d4d240b8"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which is the best thesis for a comparative essay on “Of Studies” and “My Financial Career”?","options":[{"t":"“Bacon and Leacock both stage a person’s encounter with an institution, but where Bacon’s poised aphorisms model mastery, Leacock’s spiralling repetitions perform defeat.”","why":"A shared subject, a contrast, and what the contrast reveals.","_n":"4457d","_k":"36a3e93b"},{"t":"“Bacon wrote in the 1600s and Leacock in the 1900s.”","why":"Facts, not insight.","_n":"45eac","_k":"0fab50d2"},{"t":"“Leacock is funnier than Bacon.”","why":"A preference.","_n":"46ebc","_k":"6a8974fa"},{"t":"“Bacon and Leacock are similar and different.”","why":"A comparison has to compare. Show what seeing them together reveals that neither shows alone.","_n":"47e8c","_k":"b55cead1"}]},"b":{"prompt":"Which is the best thesis for a comparative essay on two winter paragraphs from Part 3?","options":[{"t":"“Both paragraphs are about snow.”","why":"A comparison has to compare. Show what seeing them together reveals that neither shows alone.","_n":"48e9c","_k":"d3b5c623"},{"t":"“Snow is cold.”","why":"Not a thesis.","_n":"49e6c","_k":"a3e40c5d"},{"t":"“The personal one is better.”","why":"A preference.","_n":"4ae7c","_k":"22d3d794"},{"t":"“Both paragraphs describe snow, but the expository one makes it a physical process while the personal one makes it a doorway into belonging.”","why":"It states what the comparison reveals.","_n":"4be4c","_k":"3c084b3f"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"You’re writing to city council asking for protected bike lanes on your street. Which features should your letter have?","options":[{"t":"An explanation of how bicycles work","why":"Expository essays explain how or why something is. Argumentative essays try to change what the reader believes or does.","_n":"4ce5c","_k":"e3b70498"},{"t":"A personal story only, with no request","why":"Moving, but council needs a position and reasons.","_n":"4de2c","_k":"9caa1fa0"},{"t":"A clear request, reasons with local evidence, a fair answer to the parking objection, and a respectful, formal voice","why":"Council needs a position, reasons and a fair answer to the objection.","_n":"4ee3c","_k":"55dff32f"},{"t":"Insults toward drivers","why":"A strong argument meets the best objection fairly, then answers it. Attacking opponents loses readers.","_n":"4fe4c","_k":"97535b20"}]},"b":{"prompt":"You’re writing a 500-word personal statement for a program in environmental science. Which approach fits best?","options":[{"t":"“I have always loved the environment.” followed by a list of achievements","why":"Generic and listy.","_n":"4ge3c","_k":"1ed00a5e"},{"t":"An expository essay on how ponds form","why":"It’s about you, not ponds.","_n":"4he2c","_k":"25f2e2cc"},{"t":"Open in a specific scene (e.g. counting frogs at a pond each spring), reflect on what it taught you, and end with an image or insight that points forward","why":"A scene, a reflection and an earned insight.","_n":"4ie1c","_k":"793ce0f1"},{"t":"An argumentative essay on climate policy","why":"Wrong form for the purpose.","_n":"4je8c","_k":"0d91a1c8"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A tourism website asks for a short piece explaining how the Northern Lights form. Which form?","options":[{"t":"Literary analysis","why":"No text to analyse.","_n":"4ke7c","_k":"79f22266"},{"t":"Personal","why":"Possible as a hook, but the task is explanation.","_n":"4le6c","_k":"37ab0d9c"},{"t":"Argumentative","why":"Expository essays explain how or why something is. Argumentative essays try to change what the reader believes or does.","_n":"4me5c","_k":"21efaf06"},{"t":"Expository","why":"It explains a phenomenon.","_n":"4ndcc","_k":"92bc6e53"}]},"b":{"prompt":"A film club asks you to write about how two film versions of the same novel handle its ending differently. Which form and structure?","options":[{"t":"Comparative, point by point (setting, performances, the final image)","why":"It compares two subjects aspect by aspect.","_n":"4odbc","_k":"264b5d13"},{"t":"Personal, about watching movies","why":"Off-task.","_n":"4pdec","_k":"c9317100"},{"t":"Argumentative, banning remakes","why":"A different purpose.","_n":"4qdfc","_k":"1434c0ce"},{"t":"Expository, about how films are made","why":"Doesn’t compare.","_n":"4re0c","_k":"7225aed8"}]}}]},"task":{"title":"Performance task: Choose your form","summary":"Choose your form","statement":"\u003cp>Pick a purpose and audience, choose the form that fits, plan its skeleton and write its opening paragraph. The checklist makes sure the parts are there; your teacher reads the writing.\u003c/p>\u003cdetails class='alg ef-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge (forms and conventions)\u003c/td>\u003ctd>Form unclear; features missing\u003c/td>\u003ctd>Form identifiable; some features\u003c/td>\u003ctd>Form’s key features present\u003c/td>\u003ctd>Form handled with assurance; features used purposefully\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking (planning and insight)\u003c/td>\u003ctd>Skeleton incomplete or illogical\u003c/td>\u003ctd>A basic skeleton\u003c/td>\u003ctd>A logical skeleton that fits the purpose\u003c/td>\u003ctd>A skeleton that anticipates the reader; insightful focus\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication (voice and organization)\u003c/td>\u003ctd>Voice inconsistent with the form\u003c/td>\u003ctd>Voice mostly suits the form\u003c/td>\u003ctd>A consistent voice that suits form and audience\u003c/td>\u003ctd>A distinctive, assured voice; elegant organization\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application (fit to purpose and audience)\u003c/td>\u003ctd>Form mismatched to the task\u003c/td>\u003ctd>Partly suited\u003c/td>\u003ctd>Well suited; choices justified\u003c/td>\u003ctd>Choices sharply tailored and convincingly justified\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["You chose a form and an audience","Your purpose fits your form","Your skeleton is complete","Argument meets objection","Your opening is the right length","Your voice matches your choice","You explained your choices"],"tips":["Choose the form that does the job your audience needs.","Say what the essay is \u003cem>for\u003c/em> using a purpose word: explain, convince, compare, analyse, explore.","Fill each bone of the skeleton with a full idea of at least five words.","Name the best objection fairly (“Some trustees worry that…”), then answer it.","An opening paragraph of 120–180 words: hook, context, thesis or focus (or, for a personal essay, the scene).","Third person: let the subject speak without “I”. First person: put yourself in the scene.","What did you choose, and why does it suit your reader?"],"explainPrompt":"Craft statement: Why did you choose this form for this audience? What did that choice decide about your first sentence, your voice and your evidence?","explainLabel":"Craft statement","vocab":"Use the words purpose, audience, form, voice and structure.","checkLabel":"Check my plan","success":"Your skeleton is solid. Try the same topic in a different form and see what changes.","more":"Each form you complete joins your list.","topics":["winter in Canada","a place that matters to me","Bacon and Leacock","phones in school"],"forms":[{"id":"exp","t":"Expository"},{"id":"arg","t":"Argumentative"},{"id":"cmp","t":"Comparative"},{"id":"lit","t":"Literary analysis"},{"id":"per","t":"Personal"}],"audiences":["teacher","classmates","trustees","admissions readers","newspaper readers"],"voices":[{"id":"first","t":"First person"},{"id":"third","t":"Third person"}],"structures":[{"id":"block","t":"Block"},{"id":"point","t":"Point-by-point"}],"slots":{"exp":[{"id":"focus","t":"Focus","ph":"What the essay explains, in one sentence"},{"id":"aspects","t":"Three aspects","boxes":3,"ph":"Aspect"}],"arg":[{"id":"claim","t":"Claim"},{"id":"reason1","t":"Reason 1"},{"id":"reason2","t":"Reason 2"},{"id":"counter","t":"Counterargument and rebuttal"},{"id":"concl","t":"Conclusion"}],"cmp":[{"id":"thesis","t":"Insight thesis","ph":"What seeing the two side by side reveals"},{"id":"structure","t":"Structure","chips":true},{"id":"points","t":"Three points of comparison","boxes":3,"ph":"Point"}],"lit":[{"id":"thesis","t":"Thesis","forge":true},{"id":"ts1","t":"Topic sentence 1"},{"id":"ts2","t":"Topic sentence 2"},{"id":"ts3","t":"Topic sentence 3"}],"per":[{"id":"scene","t":"Scene"},{"id":"turn","t":"Turn"},{"id":"reflection","t":"Reflection"}]},"forge":{"fields":[{"id":"text","t":"Text (title)","ph":"e.g. “My Financial Career”"},{"id":"author","t":"Author","ph":"e.g. Stephen Leacock"},{"id":"claim","t":"Claim (what the text does or means)","ph":"e.g. turns a bank visit into a portrait of panic"},{"id":"how","t":"How (the techniques)","ph":"e.g. escalating repetition and comic timing"}],"flags":{"factual":"This sounds like a fact, not an arguable claim.","vague":"This is vague. Name what the text actually does.","pref":"This is a preference, not an analysis.","noHow":"Add \u003cem>how\u003c/em>: name the techniques."},"vague":["similar and different","many ways","interesting","is good","is bad","very good","deep meaning","a lot of"],"pref":["better than","funnier","boring","i like","i love","my favourite","the best"],"factual":["was born","wrote in","was written in","was published","lived in","died in"]},"purposeWords":{"exp":["\\bexplain","\\binform","\\bshows? how\\b","\\bdescribes? how\\b"],"arg":["\\bconvinc","\\bpersuad","\\bargu","\\burg(e|es|ed|ing)\\b"],"cmp":["\\bcompar","\\bcontrast"],"lit":["\\banaly","\\binterpret","\\bshows? how\\b"],"per":["\\bexplor","\\breflect","\\bremember","\\bdiscover"]},"purposeShow":{"exp":"explain, inform, show how, describe how","arg":"convince, persuade, argue, urge","cmp":"compare, contrast","lit":"analyse, interpret, show how (the text or author)","per":"explore, reflect, remember, discover"},"counterWords":["although","while","some","critics","opponents","others","may argue","might object","granted"],"opening":{"min":120,"max":180,"label":"Opening paragraph"},"models":[{"title":"Model 1: Argumentative (topic: phones in school; audience: the school council; third person)","topic":"phones in school","form":"arg","audience":"the school council","voice":"third","purpose":"To persuade the school council to adopt phone-free classrooms with a supervised exception for accessibility needs.","slots":{"claim":"Phones should be stored during class time.","reason1":"Attention and learning improve without constant alerts.","reason2":"Phone-free rooms reduce in-class social pressure.","counter":"Some parents worry about emergencies; the office phone and teachers’ devices already provide a reliable channel, and students with medical or accessibility needs keep theirs.","concl":"A one-term trial, with student feedback."},"opening":"Every class period at our school now competes with a device that was designed to win. A phone does not need to ring to interrupt a lesson; the mere possibility of a message pulls attention away from a proof, a poem or a lab. The school council should adopt phone-free classrooms, with phones stored in a labelled caddy at the door and returned at the bell. This is not a ban on technology: laptops for coursework would stay, and students with medical or accessibility needs would keep their devices. Nor is it a judgment of students, who did not design the apps competing for their focus. It is a decision about the conditions for learning. A one-term trial, followed by a student survey, would let the council test the policy against evidence rather than assumptions, and give students a voice in the result.","craft":"I chose argument because the council votes on policies. I put the main objection (emergencies) into the opening’s “not a ban” sentences so that resistant readers would keep reading. I kept a formal third-person voice for a decision-making audience, and ended with a trial so the request feels reasonable."},{"title":"Model 2: Personal (topic: a place that matters to me; audience: admissions readers; first person)","topic":"a place that matters to me","form":"per","audience":"admissions readers","voice":"first","purpose":"To explore how my grandfather’s workshop taught me patience, for admissions readers who want to know who I am.","slots":{"scene":"The workshop at 6 a.m., sawdust in the radio light.","turn":"I ruin a chair leg and wait for anger that never comes.","reflection":"Patience as a form of respect for materials and people."},"opening":"My grandfather’s workshop smelled of cedar and burnt coffee, and at six in the morning the only light came from a radio dial and the bulb above his bench. I was twelve the summer he let me turn a chair leg on the lathe. I pressed too hard; the chisel caught; the leg split down its length with a sound like a snapped bone. I braced for the speech. Instead he picked up the two halves, turned them in the light, and said, “Now you know where the grain wanted to go.” Then he handed me another blank. I have thought about that sentence for five years. It was the first time I understood that patience is not waiting. It is paying attention to what something, or someone, is trying to become, and giving it the time it needs to get there.","craft":"I opened in the workshop rather than with a statement about patience, because admissions readers should \u003cem>see\u003c/em> me before I tell them anything. The turn is the split chair leg. I let the insight arrive late, through his sentence about the grain, instead of announcing a moral."},{"title":"Model 3: Comparative literary analysis (topic: Bacon and Leacock; audience: teacher; third person)","topic":"Bacon and Leacock","form":"cmp","audience":"teacher","voice":"third","structure":"point","purpose":"To compare how Bacon and Leacock use sentence rhythm to present a person’s relationship to an institution.","slots":{"thesis":"Bacon’s balanced aphorisms model mastery; Leacock’s spiralling repetitions perform defeat.","points":["sentence shape","the speaker’s stance","how each essay ends"]},"opening":"Francis Bacon and Stephen Leacock wrote three centuries apart, yet both essays stage the same encounter: a person facing an institution that could overwhelm him. For Bacon, the institution is learning itself, the vast library of books one could read; for Leacock, it is a bank, with its clerks and wickets and money. What separates them is not subject but rhythm. Bacon’s sentences arrive in balanced, compressed clauses, as in “Studies serve for delight, for ornament and for ability,” and their poise models the mastery he recommends. Leacock’s sentences multiply and stumble, piling “rattle” upon “rattle” until “everything rattles me.” Read side by side, the two essays reveal that a writer’s syntax can enact his argument: Bacon teaches control by exercising it, while Leacock makes us laugh at helplessness by performing it.","craft":"I chose point-by-point so that each paragraph puts Bacon and Leacock next to each other. My thesis states what the comparison reveals (syntax enacts stance) instead of just “they’re similar and different.” I quoted one short line from each to anchor the contrast."}],"modelsLabel":"See three model responses (different forms; all meet the checklist)"},"cards":[["Essay (word story)","French \u003cem>essai\u003c/em>, “an attempt”. A mind trying a question out in public (Montaigne, 1580)."],["Expository essay","Explains how or why something is. Clear, neutral, third person. Example: how snow quiets a city."],["Argumentative essay","Defends a debatable position with reasons and evidence, and answers the strongest objection."],["Comparative essay","Sets two subjects side by side to reveal an insight neither shows alone."],["Literary analysis","Shows how a text’s techniques create meaning, in the literary present (“Hamlet hesitates”)."],["Personal essay","Moves from a lived scene through a turn to an earned reflection. First person."],["Point-by-point","Each body paragraph compares both subjects on one aspect."],["Block structure","All of A, then all of B, then the synthesis."],["Counterargument and rebuttal","State the best objection fairly, then answer it."],["Aphorism","A compressed, memorable statement: “Reading maketh a full man; conference a ready man; and writing an exact man.” (Bacon)"],["Voice","The personality of the prose, including person, formality and confidence, matched to form and audience."],["Escalating repetition","Repeating a word while widening its reach: “…everything rattles me.” (Leacock)"]],"texts":{"bacon":{"title":"Francis Bacon, “Of Studies”","cite":"Francis Bacon, “Of Studies” (1625), text from \u003cem>The Works of Francis Bacon\u003c/em>, vol. 1 (1884).","paras":["Studies serve for delight, for ornament and for ability. Their chief use for delight, is in privateness and retiring; for ornament, is in discourse; and for ability, is in the judgment and disposition of business; for expert men can execute, and perhaps judge of particulars, one by one: but the general counsels, and the plots and marshalling of affairs come best from those that are learned. To spend too much time in studies, is sloth; to use them too much for ornament, is affectation; to make judgment wholly by their rules, is the humour of a scholar: they perfect nature, and are perfected by experience: for natural abilities are like natural plants, that need pruning by study; and studies themselves do give forth directions too much at large, except they be bounded in by experience. Crafty men contemn studies, simple men admire them, and wise men use them; for they teach not their own use; but that is a wisdom without them, and above them, won by observation. Read not to contradict and confute, nor to believe and take for granted, nor to find talk and discourse, but to weigh and consider. Some books are to be tasted, others to be swallowed, and some few to be chewed and digested; that is, some books are to be read only in parts; others to be read, but not curiously; and some few to be read wholly, and with diligence and attention. Some books also may be read by deputy, and extracts made of them by others; but that would be only in the less important arguments, and the meaner sort of books; else distilled books are, like common distilled waters, flashy things. Reading maketh a full man; conference a ready man; and writing an exact man; and, therefore, if a man write little, he had need have a great memory; if he confer little, he had need have a present wit: and if he read little, he had need have much cunning, to seem to know that he doth not. Histories make men wise; poets witty; the mathematics subtile; natural philosophy deep; moral, grave; logic and rhetoric, able to contend; “Abeunt studia in mores;” nay, there is no stond or impediment in the wit, but may be wrought out by fit studies: like as diseases of the body may have appropriate exercises; bowling is good for the stone and reins, shooting for the lungs and breast, gentle walking for the stomach, riding for the head, and the like; so, if a man’s wit be wandering, let him study the mathematics; for in demonstrations, if his wit be called away never so little, he must begin again; if his wit be not apt to distinguish or find differences, let him study the schoolmen, for they are “Cymini sectores;” if he be not apt to beat over matters, and to call upon one thing to prove and illustrate another, let him study the lawyer’s cases: so every defect of the mind may have a special receipt."],"gloss":"\u003cstrong>Glosses:\u003c/strong> \u003cem>privateness and retiring\u003c/em>: private time; \u003cem>contemn\u003c/em>: scorn; \u003cem>curiously\u003c/em>: with great care; \u003cem>conference\u003c/em>: conversation; \u003cem>Abeunt studia in mores\u003c/em>: “studies pass into character”; \u003cem>stond\u003c/em>: obstacle; \u003cem>reins\u003c/em>: kidneys; \u003cem>Cymini sectores\u003c/em>: “splitters of cumin seeds” (hair-splitters); \u003cem>receipt\u003c/em>: remedy."},"leacock":{"title":"Stephen Leacock, “My Financial Career”","cite":"Stephen Leacock, “My Financial Career”, \u003cem>Literary Lapses\u003c/em> (1910). Paragraph numbers added for citation (Leacock, par. 1).","paras":["When I go into a bank I get rattled. The clerks rattle me; the wickets rattle me; the sight of the money rattles me; everything rattles me.","The moment I cross the threshold of a bank and attempt to transact business there, I become an irresponsible idiot.","I knew this beforehand, but my salary had been raised to fifty dollars a month and I felt that the bank was the only place for it.","So I shambled in and looked timidly round at the clerks. I had an idea that a person about to open an account must needs consult the manager.","I went up to a wicket marked “Accountant.” The accountant was a tall, cool devil. The very sight of him rattled me. My voice was sepulchral.","“Can I see the manager?” I said, and added solemnly, “alone.” I don’t know why I said “alone.”","“Certainly,” said the accountant, and fetched him.","The manager was a grave, calm man. I held my fifty-six dollars clutched in a crumpled ball in my pocket.","“Are you the manager?” I said. God knows I didn’t doubt it.","“Yes,” he said.","“Can I see you,” I asked, “alone?” I didn’t want to say “alone” again, but without it the thing seemed self-evident.","The manager looked at me in some alarm. He felt that I had an awful secret to reveal.","“Come in here,” he said, and led the way to a private room. He turned the key in the lock.","“We are safe from interruption here,” he said; “sit down.”","We both sat down and looked at each other. I found no voice to speak.","“You are one of Pinkerton’s men, I presume,” he said.","He had gathered from my mysterious manner that I was a detective. I knew what he was thinking, and it made me worse.","“No, not from Pinkerton’s,” I said, seeming to imply that I came from a rival agency.","“To tell the truth,” I went on, as if I had been prompted to lie about it, “I am not a detective at all. I have come to open an account. I intend to keep all my money in this bank.”","The manager looked relieved but still serious; he concluded now that I was a son of Baron Rothschild or a young Gould.","“A large account, I suppose,” he said.","“Fairly large,” I whispered. “I propose to deposit fifty-six dollars now and fifty dollars a month regularly.”","The manager got up and opened the door. He called to the accountant.","“Mr. Montgomery,” he said unkindly loud, “this gentleman is opening an account, he will deposit fifty-six dollars. Good morning.”","I rose.","A big iron door stood open at the side of the room.","“Good morning,” I said, and stepped into the safe.","“Come out,” said the manager coldly, and showed me the other way.","I went up to the accountant’s wicket and poked the ball of money at him with a quick convulsive movement as if I were doing a conjuring trick.","My face was ghastly pale.","“Here,” I said, “deposit it.” The tone of the words seemed to mean, “Let us do this painful thing while the fit is on us.”","He took the money and gave it to another clerk.","He made me write the sum on a slip and sign my name in a book. I no longer knew what I was doing. The bank swam before my eyes.","“Is it deposited?” I asked in a hollow, vibrating voice.","“It is,” said the accountant.","“Then I want to draw a cheque.”","My idea was to draw out six dollars of it for present use. Someone gave me a chequebook through a wicket and someone else began telling me how to write it out. The people in the bank had the impression that I was an invalid millionaire. I wrote something on the cheque and thrust it in at the clerk. He looked at it.","“What! are you drawing it all out again?” he asked in surprise. Then I realized that I had written fifty-six instead of six. I was too far gone to reason now. I had a feeling that it was impossible to explain the thing. All the clerks had stopped writing to look at me.","Reckless with misery, I made a plunge.","“Yes, the whole thing.”","“You withdraw your money from the bank?”","“Every cent of it.”","“Are you not going to deposit any more?” said the clerk, astonished.","“Never.”","An idiot hope struck me that they might think something had insulted me while I was writing the cheque and that I had changed my mind. I made a wretched attempt to look like a man with a fearfully quick temper.","The clerk prepared to pay the money.","“How will you have it?” he said.","“What?”","“How will you have it?”","“Oh”—I caught his meaning and answered without even trying to think—“in fifties.”","He gave me a fifty-dollar bill.","“And the six?” he asked dryly.","“In sixes,” I said.","He gave it me and I rushed out.","As the big door swung behind me I caught the echo of a roar of laughter that went up to the ceiling of the bank. Since then I bank no more. I keep my money in cash in my trousers pocket and my savings in silver dollars in a sock."]}}}};</script>
