ght the book.”\u003c/p>","prompt":"Your imitation:"}],"stealChecks":["Starts with “Although”","Has two dashes (or em dashes)","At least 25 words"]},"practice":{"activities":[{"id":"moves","type":"sorter","title":"Where does this move belong?","summary":"Where does this move belong?","noun":"move","txt":true,"goal":[1,2,4],"instruction":"Tap a writer’s move, then tap the stage it belongs to. Some writers loop, but each move has a home stage.","how":"Tap a move, then tap its stage.","boxes":[{"id":"gen","label":"Generate","sub":"making ideas"},{"id":"plan","label":"Plan","sub":"shaping them"},{"id":"draft","label":"Draft","sub":"getting them down"},{"id":"rev","label":"Revise","sub":"re-seeing them"},{"id":"edit","label":"Edit","sub":"polishing them"}],"wrongDefault":"Ask: is this move making ideas, shaping them, getting them down, re-seeing them, or polishing them?","items":[{"id":"i1","goal":2,"t":"“Freewrite for five minutes about the fur without stopping.”","_a":"FlJQXxQ=","why":"Freewriting makes ideas; nothing is judged yet.","hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Generate or Draft?","Generate: nonstop writing is for finding ideas, not for writing the essay itself."]},{"id":"i2","goal":2,"t":"“List three questions the ending raises.”","_a":"FlJQXxQ=","why":"Questions open up ideas you might focus on.","hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Generate or Plan?","Generate: questions are a way of making ideas before you choose one."]},{"id":"i3","goal":1,"t":"“Write a working thesis and three topic sentences.”","_a":"FkVZUFgV","why":"A thesis and topic sentences give the essay its shape before you draft.","hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Plan or Draft?","Plan: a working thesis and topic sentences are an outline."]},{"id":"i4","goal":1,"t":"“Decide whether to order paragraphs by time or by importance.”","_a":"FkVZUFgV","why":"Choosing an order before drafting is planning the essay’s shape.","hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Plan or Revise?","Plan: before drafting, choosing the order is part of the outline."]},{"id":"i5","goal":1,"t":"“Write the body paragraphs quickly, leaving [quote here] gaps.”","_a":"FlFHUFBDGw==","why":"Getting words down fast, gaps and all, is drafting.","hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Draft or Edit?","Draft: get it down first and fill the gaps later."]},{"id":"i6","goal":4,"t":"“Cut a paragraph that only retells the plot.”","_a":"FkdQRxQ=","why":"Cutting summary changes what the essay argues: that’s re-seeing.","wrong":{"edit":"Cutting a whole paragraph changes the argument. That’s revising."},"hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Revise or Edit?","Revise: cutting a whole paragraph changes the argument."]},{"id":"i7","goal":4,"t":"“Add a sentence explaining how a quotation proves the claim.”","_a":"FkdQRxQ=","why":"Adding analysis changes what the paragraph proves.","hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Revise or Draft?","Revise: new analysis re-sees how the evidence proves the claim."]},{"id":"i8","goal":1,"t":"“Sharpen the thesis after realizing the real point.”","_a":"FkdQRxQ=","why":"After drafting, a sharper thesis is revision: you’ve re-seen your claim.","wrong":{"plan":"If it happens after drafting, sharpening the thesis is revision: you’ve re-seen your claim."},"hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Plan or Revise?","Revise: it happens after drafting, when you re-see your claim."]},{"id":"i9","goal":4,"t":"“Fix comma splices and check MLA citations.”","_a":"FlBRWEIV","why":"Punctuation and citation format are conventions, polished last.","hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Edit or Revise?","Edit: comma splices and citation format are surface conventions."]},{"id":"i10","goal":4,"t":"“Read aloud to catch repeated words and typos.”","_a":"FlBRWEIV","why":"Reading aloud for repeats and typos is surface polish.","wrong":{"rev":"Reading aloud for typos is editing; reading aloud for whether the argument holds would be revising."},"hints":["Is this move about ideas, order, getting words down, the argument, or the surface?","Edit or Revise?","Edit: you’re listening for repeated words and typos, not for the argument."]}]},{"id":"revise","type":"custom","title":"Revise it","summary":"Revise it","star":true,"goal":[3,4,5],"instruction":"Each item shows part of a paragraph about “Miss Brill” (original student writing) and four revisions. Choose the one that best improves it, and say what kind of revision it is. Items 5 and 6 go beyond the Final Check.","how":"Choose a revision. When you find the best one, say what kind of revision it is.","kinds":[{"id":"hi","t":"Revising (higher-order)"},{"id":"lo","t":"Editing (lower-order)"}],"kindFb":{"hi":"Right: it changes what the paragraph claims or proves, so it’s higher-order.","lo":"Look again: the best revision changes what the paragraph claims or proves. That makes it higher-order."},"items":[{"id":"r1","goal":3,"label":"Topic sentence","orig":"“This paragraph is about the band.”","_a":"Fl1cEw==","options":[{"t":"“The band’s music rises and falls with Miss Brill’s mood, as if the park were tuned to her feelings.”","why":"It turns a topic into a claim.","_n":"1u1bc","_k":"5bcba357"},{"t":"“The band plays in the green rotunda every Sunday.”","why":"A plot fact: no one could disagree, so there’s nothing to prove.","_n":"1v1cc","_k":"3f8babe2"},{"t":"“This paragraph is about the band and its music.”","why":"Still a topic.","_n":"1w1dc","_k":"70548c14"},{"t":"“This paragraph will discuss the band.”","why":"It still announces a topic instead of making a claim.","_n":"1x9ac","_k":"d39e44d2"}],"hints":["Name the problem first: focus, evidence, analysis, order or sentence?","The problem is focus, a higher-order kind: the sentence names a subject but claims nothing.","The sentence about the music rising and falling with her mood: it turns a topic into a claim."]},{"id":"r2","goal":5,"label":"Evidence","orig":"“‘It was exactly like a play.’ She likes the park.”","_a":"Fl1cEw==","options":[{"t":"“‘It was exactly like a play’ (Mansfield, par. 9). She likes the park.”","why":"The citation helps, but the quotation still arrives with no introduction or explanation.","_n":"1y99c","_k":"931dac67"},{"t":"“‘It was exactly like a play.’ ‘They were all on the stage.’ She likes the park.”","why":"Two dropped quotations are worse than one.","_n":"1z98c","_k":"52293581"},{"t":"“Miss Brill decides that the Sunday crowd is ‘exactly like a play’ (Mansfield, par. 9), casting herself as one of the actors.”","why":"It introduces, integrates, cites and begins to explain the quotation.","_n":"2097c","_k":"96352952"},{"t":"“‘It was exactly like a play.’ She really likes the park.”","why":"An intensifier doesn’t explain the quotation.","_n":"219ec","_k":"5b28c93e"}],"hints":["Name the problem first: focus, evidence, analysis, order or sentence?","The problem is evidence and analysis, a higher-order kind: the quotation is dropped in.","The sentence where Miss Brill decides the crowd is “exactly like a play” (Mansfield, par. 9): it introduces, integrates, cites and begins to explain."]},{"id":"r3","goal":5,"label":"Analysis","orig":"“The couple are mean. This is mean of them.”","_a":"Fl1cEw==","options":[{"t":"“The couple are cruel. This is cruel of them.”","why":"Swapping a word keeps the repetition; it still doesn’t explain anything.","_n":"229dc","_k":"d8c1b208"},{"t":"“The couple are very, very mean.”","why":"Intensifiers aren’t analysis.","_n":"239cc","_k":"7835459e"},{"t":"“The couple sit down where the old couple had been.”","why":"That’s plot. It drops the judgment without adding analysis.","_n":"249bc","_k":"1ba36e84"},{"t":"“The couple’s casual cruelty works like a reviewer’s verdict on the ‘play’ she imagined.”","why":"It replaces a repeated judgment with analysis that links back to the play metaphor.","_n":"25a2c","_k":"7c985826"}],"hints":["Name the problem first: focus, evidence, analysis, order or sentence?","The problem is analysis, a higher-order kind: the sentences judge but don’t explain.","The sentence comparing their cruelty to a reviewer’s verdict on her “play”: it links back to the play metaphor."]},{"id":"r4","goal":4,"star":true,"label":"A paragraph","orig":"“Miss Brill takes her fur out of its box. She walks to the Jardins Publiques and sits on her special seat. She listens to the band and watches the crowd. A young couple sits beside her and laughs at her fur. She goes home and puts the fur back in its box.”","note":"Grammatically perfect: five accurate plot sentences and no claim.","_a":"Fl1cEw==","options":[{"t":"Replace “walks” with “strolls” and “laughs” with “giggles”","why":"Sharper words polish sentences; the paragraph still has no claim.","_n":"26a1c","_k":"2e695b69"},{"t":"Add two more plot sentences about the band","why":"More plot won’t give the paragraph something to prove.","_n":"2728e","_k":"0c946136"},{"t":"Fix two commas","why":"That’s editing a paragraph that needs rebuilding.","_n":"2829e","_k":"d27025a0"},{"t":"Add a claim sentence and cut three plot sentences","why":"Correct grammar can’t rescue a paragraph with nothing to prove. The problem is higher-order.","_n":"2926e","_k":"f9cb0f89"}],"hints":["Name the problem first: focus, evidence, analysis, order or sentence?","The grammar is fine, so the problem is higher-order: there is nothing to prove.","Add a claim sentence and cut three plot sentences: correct grammar can’t rescue a paragraph with nothing to prove."]},{"id":"r5","goal":3,"star":true,"label":"A conclusion","orig":"Thesis: “In ‘Miss Brill,’ Mansfield uses the fur to show how loneliness can disguise itself as delight.”\u003cbr>Conclusion: “In conclusion, in ‘Miss Brill,’ Mansfield uses the fur to show how loneliness can disguise itself as delight.”","note":"The conclusion repeats the thesis word for word.","_a":"Fl1cEw==","options":[{"t":"Summarize the plot one more time so the reader remembers it","why":"Your reader has read the story. A conclusion widens the meaning; it doesn’t retell.","_n":"2a27e","_k":"91417afb"},{"t":"Delete “In conclusion” and keep the rest","why":"Removing the label still leaves a word-for-word repeat.","_n":"2b2ce","_k":"3f0cf1c8"},{"t":"Restate the claim in new words, then say what the story suggests about how loneliness hides from itself","why":"A conclusion should widen the meaning (the “so what”), not repeat.","_n":"2c2de","_k":"ad4256f1"},{"t":"Add a new quotation in the conclusion","why":"New evidence belongs in the body.","_n":"2d2ae","_k":"5ad332cc"}],"hints":["Name the problem first: focus, evidence, analysis, order or sentence?","The problem is focus, a higher-order kind: the conclusion adds no meaning.","Restate the claim in new words, then widen it: what does the story suggest about how loneliness hides from itself?"]},{"id":"r6","goal":3,"star":true,"label":"A thesis and its body","orig":"Thesis: “Mansfield uses the fur to show that Miss Brill is lonely.”\u003cbr>Topic sentences: “In the park, Miss Brill imagines that everyone is acting in a play.” · “She believes she has a part and that she would be missed.” · “The young couple’s mockery is like a bad review that ends her performance.”","note":"The essay drifted toward the theatre metaphor; the thesis no longer fits the body.","_a":"Fl1cEw==","options":[{"t":"Revise the thesis to match the stronger argument the draft discovered","why":"When the draft finds a better claim, change the thesis. Don’t force the paragraphs back.","_n":"2e2be","_k":"76f15151"},{"t":"Keep the thesis and add “and the theatre” to the end","why":"Tacking on words doesn’t make one argument. Rewrite the thesis around the claim the draft found.","_n":"2f20e","_k":"e947eda7"},{"t":"Delete the theatre paragraphs","why":"You’d be throwing away the draft’s best thinking.","_n":"2g21e","_k":"cbf1a43b"},{"t":"Check the spelling and commas in every paragraph","why":"That’s editing. The mismatch between the thesis and the body is higher-order.","_n":"2haee","_k":"bbd40375"}],"hints":["Name the problem first: focus, evidence, analysis, order or sentence?","The problem is focus, a higher-order kind: the thesis and the body argue different things.","Revise the thesis to match the stronger argument the draft discovered."]}]},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Finn","goal":[4,5],"instruction":"Finn made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":5,"task":"An analytical paragraph on the fur.","steps":["Mansfield uses Miss Brill’s fur to reveal how much she depends on small comforts.","Miss Brill takes the fur out of its box and brushes it.","Then she goes to the park and sits on her special seat.","She listens to the band and watches the people walk by.","This shows that she depends on small comforts."],"_a":"BQ==","stepFb":["Sentence 1 is a clear claim. Keep reading.","","Sentence 3 is more summary, but the first mistake comes earlier.","Sentence 4 is summary too. Look earlier.","Sentence 5 is an unsupported link, but the first mistake comes earlier."],"fixes":[{"t":"Replace sentence 2 with evidence and analysis: she addresses the fur as “Dear little thing!” (Mansfield, par. 1), treating an object as a companion who returns her affection.","why":"It turns summary into evidence that proves the claim, then explains it.","_n":"2iade","_k":"38b9aa9e"},{"t":"Move sentence 1 to the end.","why":"The claim belongs first; the problem is the summary that follows it.","_n":"2jb0e","_k":"bd335f93"},{"t":"Add more detail about the park.","why":"More plot won’t prove the claim.","_n":"2kafe","_k":"f9f7aabd"},{"t":"Sentence 2 is correct.","why":"It retells. Your reader needs to know what the brushing \u003cem>means\u003c/em>.","_n":"2laae","_k":"56318955"}],"hints":["After the claim, what should come next?","Evidence that proves the claim, not plot.","Sentence 2. Replace it with a quotation and analysis."]},{"id":"e2","goal":5,"task":"An analytical paragraph on the play metaphor.","steps":["In the park, Miss Brill imagines herself part of a performance.","Mansfield gives her a sense of belonging through this illusion.","“It was exactly like a play.”","This makes the later mockery more painful."],"_a":"Bg==","stepFb":["Sentence 1 is the claim.","Sentence 2 sharpens the claim.","","Sentence 4 follows the mistake. Look earlier."],"fixes":[{"t":"Add another quotation right after it.","why":"Two dropped quotations are worse than one.","_n":"2ma9e","_k":"dd27f17c"},{"t":"Introduce and cite it: She decides that the scene is “exactly like a play” (Mansfield, par. 9), and that even she has a part.","why":"A signal phrase, an embedded quotation and a citation.","_n":"2nace","_k":"11684f56"},{"t":"Sentence 3 is correct.","why":"A quotation standing alone with no signal phrase or citation is a dropped quotation.","_n":"2oabe","_k":"a24f751d"},{"t":"Delete the quotation.","why":"The evidence is good. It just needs an introduction and a citation.","_n":"2pa6e","_k":"13de0d5e"}],"hints":["Does every quotation have a signal phrase and a citation?","One sentence is only a quotation.","Sentence 3. Introduce and cite it."]},{"id":"e3","goal":4,"task":"Finn’s revision plan, written as a paragraph.","steps":["My draft’s thesis says the fur represents her loneliness.","My teacher noted that my second and third paragraphs mostly retell the plot.","So first I will fix all my commas and check my spelling.","Then I’ll see whether there’s time to change the paragraphs.","I’ll hand it in after that."],"_a":"Bg==","stepFb":["Sentence 1 states the current thesis.","Sentence 2 is useful feedback.","","Sentence 4 follows from the mistake in the plan. Look earlier.","Sentence 5 follows too. Look earlier."],"fixes":[{"t":"Sentence 3 is correct.","why":"Editing paragraphs you’ll rebuild wastes effort. Revise first.","_n":"2qa5e","_k":"4eec5ca4"},{"t":"First I’ll change the title.","why":"Cosmetic. The feedback was about summary.","_n":"2r7b1","_k":"0280d7be"},{"t":"First I’ll add more summary so it’s longer.","why":"That deepens the problem.","_n":"2s7a1","_k":"b54f45c0"},{"t":"First I’ll rebuild paragraphs two and three around claims and analysis; then I’ll edit commas and spelling.","why":"Revise the higher-order problem first, then edit.","_n":"2t791","_k":"ef1ccd68"}],"hints":["Which concern did the teacher raise: higher- or lower-order?","Summary is a higher-order problem.","Sentence 3. Revise the paragraphs before editing."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Look at the model writer’s freewrite and your own. What surprised you about how messy good writing starts?"},{"id":"j2","q":"In your own words, explain the difference between revising and editing, and why the order matters."},{"id":"j3","q":"Explain to a friend how to turn a summary sentence into an analysis sentence, using one example from “Miss Brill”."},{"id":"j4","q":"Which stage of the loop is hardest for you? Name one strategy from this module you’ll try next time, and when."}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from “Miss Brill” that you’d like to remember, and in one sentence say why it stays with you.\u003c/p>\u003cdiv id=\"cp-app\">\u003c/div>"}],"art":{"intro":"Write one principle about revision or process that you believe, in your own words, in one sentence. Then choose a master’s example (a line from “Miss Brill” or the Pope couplet that shows the principle) and write your own imitation, a sentence of yours that obeys it.","placeholder":"Your principle about revision or process, in one sentence (at least 6 words)","examples":["True ease in writing comes from art, not chance, / As those move easiest who have learned to dance. (Pope, lines 362–363)","Although it was so brilliantly fine—the blue sky powdered with gold and great spots of light like white wine splashed over the Jardins Publiques—Miss Brill was glad that she had decided on her fur. (Mansfield, par. 1)","It was like a play. It was exactly like a play. (Mansfield, par. 9)","Sometimes there was an almond in her slice, sometimes not. It made a great difference. (Mansfield, par. 17)","But when she put the lid on she thought she heard something crying. (Mansfield, par. 18)"]},"artSamples":"\u003cp class=\"tiny muted\" style=\"margin:0 0 6px\">Two sample principles (for inspiration only; write your own):\u003c/p>\u003cp class=\"an-note an-syntax\">“Write it badly first, then make it true.” \u003cspan class=\"muted\">Example: the Pope couplet, “True ease in writing comes from art, not chance.”\u003c/span>\u003c/p>\u003cp class=\"an-note an-theme\">“Every sentence in a paragraph should earn its place by proving the claim.”\u003c/p>","artMin":6,"artMinMsg":"Your principle needs at least 6 words.","commonplaceLines":["Dear little thing! (Mansfield, par. 1)","She had become really quite expert, she thought, at listening as though she didn’t listen, at sitting in other people’s lives just for a minute while they talked round her. (Mansfield, par. 3)","It was exactly like a play. (Mansfield, par. 9)","Even she had a part and came every Sunday. (Mansfield, par. 9)","Yes, we understand, we understand, she thought—though what they understood she didn’t know. (Mansfield, par. 10)","If there was an almond it was like carrying home a tiny present—a surprise—something that might very well not have been there. (Mansfield, par. 17)","But when she put the lid on she thought she heard something crying. (Mansfield, par. 18)"]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which activity belongs to \u003cstrong>revising\u003c/strong> rather than editing?","options":[{"t":"Formatting the title in italics or quotation marks","why":"A convention, fixed in editing.","_n":"2u781","_k":"ea4c4013"},{"t":"Correcting the spelling of a character’s name","why":"Editing.","_n":"2v771","_k":"89a4ddb3"},{"t":"Fixing a comma splice","why":"That’s editing.","_n":"2w761","_k":"de88e5eb"},{"t":"Moving a paragraph so the argument builds to its strongest point","why":"Reordering changes the argument.","_n":"2x751","_k":"4a7ce0f8"}]},"b":{"prompt":"Which activity belongs to \u003cstrong>generating\u003c/strong> ideas?","options":[{"t":"Rewriting the thesis to match the draft","why":"That’s revising.","_n":"2y741","_k":"efa3bab3"},{"t":"Reading aloud to catch typos","why":"That’s editing.","_n":"2z731","_k":"a9a102f3"},{"t":"Checking MLA citations","why":"That’s editing.","_n":"30721","_k":"35b54af3"},{"t":"Freewriting for five minutes without stopping to judge","why":"Freewriting makes ideas; judging comes later.","_n":"31751","_k":"e52cdff6"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"Which is a \u003cstrong>higher-order\u003c/strong> concern?","options":[{"t":"Whether the evidence actually proves the thesis","why":"Evidence and argument are higher-order.","_n":"32761","_k":"d0fe5512"},{"t":"Whether the font is consistent","why":"Presentation, lower-order.","_n":"33771","_k":"cdb98e9d"},{"t":"Whether a word is spelled correctly","why":"Lower-order.","_n":"34781","_k":"23884781"},{"t":"Whether commas are placed correctly","why":"Lower-order.","_n":"35711","_k":"6c056841"}]},"b":{"prompt":"Which is a \u003cstrong>lower-order\u003c/strong> concern?","options":[{"t":"Whether each quotation is explained","why":"Analysis is higher-order.","_n":"36721","_k":"97dd8395"},{"t":"Whether the thesis is arguable","why":"Higher-order.","_n":"37731","_k":"9398bb8d"},{"t":"Replacing a vague word with a precise one","why":"Word choice is sentence-level polish.","_n":"38741","_k":"164518f6"},{"t":"Whether the paragraphs are in the best order","why":"Organization is higher-order.","_n":"396d1","_k":"760dd507"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"What is the main purpose of freewriting?","options":[{"t":"To produce a polished first paragraph","why":"Polish comes much later.","_n":"3a6e1","_k":"50108572"},{"t":"To check grammar","why":"Freewriting deliberately ignores grammar.","_n":"3be71","_k":"da876f62"},{"t":"To find quotations","why":"That’s gathering evidence.","_n":"3ce61","_k":"23255b9e"},{"t":"To generate ideas quickly without stopping to judge or correct them","why":"Freewriting makes ideas; judging and correcting come later.","_n":"3de91","_k":"420a6481"}]},"b":{"prompt":"What does a cluster (bubble map) help a writer do?","options":[{"t":"Count words","why":"A word count does that.","_n":"3ee81","_k":"0f04a69a"},{"t":"See connections between ideas that might become a focus","why":"Links between bubbles can become a focus.","_n":"3fe31","_k":"e8d691fd"},{"t":"Format a Works Cited list","why":"That’s a convention.","_n":"3ge21","_k":"0be7790e"},{"t":"Fix sentence fragments","why":"That’s editing.","_n":"3he51","_k":"864aedfe"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Which working thesis about “Miss Brill” is both focused and arguable?","options":[{"t":"“Loneliness affects many people in our society.”","why":"Too broad; it leaves the story behind.","_n":"3ie41","_k":"252c94d2"},{"t":"“Mansfield uses Miss Brill’s fur, which she treats as a companion, to show how loneliness can disguise itself as delight.”","why":"Focused on the fur, arguable, and it says how the story shows its claim.","_n":"3jef1","_k":"b23ab684"},{"t":"“This essay will discuss loneliness in ‘Miss Brill’.”","why":"A topic, not a claim.","_n":"3kee1","_k":"9c01420d"},{"t":"“Miss Brill visits the Jardins Publiques on Sundays.”","why":"A plot fact; no one could disagree.","_n":"3l611","_k":"ebce2ab3"}]},"b":{"prompt":"Which working thesis about “Miss Brill” is both focused and arguable?","options":[{"t":"“A young couple sit on Miss Brill’s bench.”","why":"A plot fact.","_n":"3m621","_k":"469de4d9"},{"t":"“This essay is about the park scene in ‘Miss Brill’.”","why":"A topic names a subject. A thesis makes a claim someone could disagree with, and says how the text shows it.","_n":"3n5f1","_k":"47b66eeb"},{"t":"“Everyone wants to belong somewhere.”","why":"Too broad; off the text.","_n":"3o601","_k":"e5d22e29"},{"t":"“By imagining the park as a play in which she has a part, Miss Brill builds a belonging that the young couple’s mockery exposes as an illusion.”","why":"Focused on the play, arguable, and it says how the story shows its claim.","_n":"3p651","_k":"f9ccc528"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"\u003cp>(1) The band’s music mirrors Miss Brill’s changing mood. (2) When she feels part of the scene, the band plays “louder and gayer.” (3) Mansfield was a modernist writer interested in inner life. (4) The music becomes a measure of how connected she feels.\u003c/p>Which sentence should be cut?","options":[{"t":"Sentence 4","why":"That’s the link back.","_n":"3q661","_k":"5ff95d39"},{"t":"Sentence 2","why":"That’s the evidence (cite it, but keep it).","_n":"3r631","_k":"70e1fc3f"},{"t":"Sentence 3","why":"It’s about the author, not evidence for the claim.","_n":"3s641","_k":"d66ed626"},{"t":"Sentence 1","why":"That’s the claim.","_n":"3t691","_k":"7d8dc613"}]},"b":{"prompt":"\u003cp>(1) The fur is Miss Brill’s closest companion. (2) She calls it a “little rogue,” as if it had a personality. (3) Furs were fashionable in the 1920s. (4) An object stands in for the friendship she lacks.\u003c/p>Which sentence should be cut?","options":[{"t":"Sentence 4","why":"Analysis and link.","_n":"3u6a1","_k":"b2e0189a"},{"t":"Sentence 2","why":"Evidence.","_n":"3ve30","_k":"acafebbd"},{"t":"Sentence 3","why":"Fashion history doesn’t prove the claim.","_n":"3we20","_k":"5d01630e"},{"t":"Sentence 1","why":"The claim.","_n":"3xe10","_k":"789b5555"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"\u003cp>A paragraph on Shelley’s “Ozymandias” (studied in module 04):\u003c/p>\u003cp>(1) Shelley shows that power does not last. (2) “Look on my works, ye Mighty, and despair!” (3) The statue is broken in the desert. (4) Power does not last forever.\u003c/p>What is the most important revision?","options":[{"t":"Make sentence 4 longer","why":"Sentence 4 only repeats sentence 1. It needs analysis, not length.","_n":"3ye00","_k":"c9d03de1"},{"t":"Introduce and explain the quotation, showing how the boast becomes ironic beside the ruin","why":"A quotation can’t speak for itself. Introduce it, then explain what its words are doing.","_n":"3ze70","_k":"bf7cc0ba"},{"t":"Add a sentence about Shelley’s life","why":"Biography doesn’t help this claim.","_n":"40e60","_k":"8755cba7"},{"t":"Fix the punctuation in sentence 2","why":"The quotation’s punctuation is correct; the problem is that it’s dropped.","_n":"41e50","_k":"b24c6c51"}]},"b":{"prompt":"\u003cp>A paragraph on the Pope couplet:\u003c/p>\u003cp>(1) Pope argues that good writing takes practice. (2) “As those move easiest who have learned to dance.” (3) Dancing is an art. (4) So writing takes practice.\u003c/p>What is the most important revision?","options":[{"t":"Delete sentence 1","why":"That’s the claim.","_n":"42e40","_k":"cbda468b"},{"t":"Fix the spelling","why":"Nothing is misspelled.","_n":"43eb0","_k":"2e5e5f78"},{"t":"Add a second quotation","why":"Two dropped quotations compound the problem.","_n":"44ea0","_k":"8a54d76c"},{"t":"Introduce the line and explain how the dance comparison makes ease the product of training","why":"A quotation can’t speak for itself. Introduce it, then explain what its words are doing.","_n":"45dd0","_k":"ca70b934"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"A classmate’s paragraph claims the fur shows loneliness, but its sentences mostly retell the plot. Which feedback is most helpful?","options":[{"t":"“Your claim is strong, but sentences 2–4 retell the plot. Replace one with a quotation about the fur, and explain what it reveals.”","why":"It names the higher-order problem and gives a direction.","_n":"46de0","_k":"ae91886a"},{"t":"“Fix your grammar.”","why":"Grammar isn’t the problem described.","_n":"47df0","_k":"f4b8ed97"},{"t":"“Make it longer.”","why":"Length won’t fix summary.","_n":"48e00","_k":"b60044a9"},{"t":"“Good job! I liked it.”","why":"Kind, but gives no direction.","_n":"49e10","_k":"5bfcc4dd"}]},"b":{"prompt":"A classmate’s essay has perfect grammar, but the thesis doesn’t match what the body paragraphs argue. Which feedback is most helpful?","options":[{"t":"“Your paragraphs argue that Miss Brill performs a role. Revise the thesis to match that stronger idea.”","why":"It names the mismatch and points to the draft’s best thinking.","_n":"4ae20","_k":"5a83f839"},{"t":"“Check your commas once more.”","why":"Polishing a sentence in a paragraph you later cut is wasted effort. Fix the big things first.","_n":"4be30","_k":"e7f0173c"},{"t":"“Add more quotations.”","why":"More evidence for a mismatched thesis won’t help.","_n":"4ce40","_k":"21662d1e"},{"t":"“Start over.”","why":"The draft’s best thinking is worth keeping.","_n":"4de50","_k":"1729e2c8"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which outline order best builds an essay on how Mansfield structures Miss Brill’s afternoon?","options":[{"t":"The box → the play → the fur → the couple","why":"Scrambled. The reader can’t follow the build.","_n":"4ee60","_k":"cbbf4216"},{"t":"The fur as companion → the park as a play → the couple’s mockery → the fur back in its box","why":"The illusion is built, broken, then sealed away.","_n":"4fef1","_k":"a5f6160d"},{"t":"The fur → the box → the couple → the play","why":"Ends on a minor point.","_n":"4gee1","_k":"1d4fdb28"},{"t":"The couple’s mockery → the fur → the play → the box","why":"Opening with the break gives away the climax.","_n":"4hf11","_k":"b9152e4e"}]},"b":{"prompt":"Which outline order best builds an essay arguing that Miss Brill’s imagination is both her comfort and her trap?","options":[{"t":"Exposed → comfort → retreat → belonging","why":"The trap is sprung before it’s set.","_n":"4if01","_k":"3b99a5b2"},{"t":"Retreat → exposed → belonging → comfort","why":"Backwards.","_n":"4jf31","_k":"b5dd92ee"},{"t":"Imagination as comfort (fur, band) → imagination as belonging (the play) → imagination exposed (the couple) → imagination as retreat (the box)","why":"Comfort, belonging, exposure, retreat: the trap is set, then sprung.","_n":"4kf21","_k":"2ebc37a5"},{"t":"Comfort → retreat → comfort → exposed","why":"Repeats a point; no build.","_n":"4lf51","_k":"555af4a6"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"You have two days to write a 500-word personal essay for a scholarship. Which plan best uses the writing process?","options":[{"t":"Day 1: freewrite, choose a focus, outline, draft. Day 2: revise for focus and examples, then edit and read aloud.","why":"Every stage gets time, and revising comes before editing.","_n":"4mf41","_k":"e4100975"},{"t":"Day 1: nothing. Day 2: write and submit.","why":"No time to revise.","_n":"4ne71","_k":"175b573f"},{"t":"Day 1: edit a draft you haven’t written. Day 2: draft.","why":"Polishing a sentence in a paragraph you later cut is wasted effort. Fix the big things first.","_n":"4oe61","_k":"984cbf13"},{"t":"Day 1: write the final version. Day 2: check spelling.","why":"Writers loop. A draft is a way of finding out what you think, not the last word on it.","_n":"4pe91","_k":"a0dcf3d3"}]},"b":{"prompt":"You have 75 minutes for an in-class literary essay. Which plan is best?","options":[{"t":"40 minutes planning, 35 drafting","why":"Too little time left to finish or revise.","_n":"4qea1","_k":"ba7d8002"},{"t":"About 10 minutes to plan (thesis and outline), 50 to draft, 15 to revise the key paragraphs and then edit","why":"A short plan, a full draft, and time to revise before editing.","_n":"4re71","_k":"36eb2aa0"},{"t":"75 minutes drafting with no plan","why":"No plan and no revision.","_n":"4se81","_k":"e045ff65"},{"t":"60 minutes drafting, 15 fixing commas","why":"No revision of the argument.","_n":"4te51","_k":"a4cfb323"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A writer notices that her paragraphs keep drifting into plot summary. Which strategy targets that habit?","options":[{"t":"Before each paragraph, write its claim in one sentence; after drafting, check every sentence against it","why":"It catches summary at the level where it happens: the paragraph’s claim.","_n":"4ue61","_k":"8f989bd6"},{"t":"Run a spell-check twice","why":"Spelling isn’t the problem.","_n":"4ve31","_k":"aa2677a3"},{"t":"Add more quotations","why":"Without analysis, more quotations make it worse.","_n":"4we41","_k":"fb160715"},{"t":"Use longer words","why":"Vocabulary won’t stop summary.","_n":"4xf11","_k":"9b5e5b5e"}]},"b":{"prompt":"Another writer’s drafts are full of wordy sentences (“In my opinion, I personally think that…”). Which strategy targets that habit?","options":[{"t":"Write a longer conclusion","why":"That adds words.","_n":"4yf21","_k":"21e4945c"},{"t":"Change the thesis","why":"The argument isn’t the issue.","_n":"4z6b2","_k":"68b7a52e"},{"t":"Add a second body paragraph","why":"That doesn’t touch sentence-level wordiness.","_n":"506a2","_k":"abfcf404"},{"t":"In a final pass, read aloud and cut any word that doesn’t change the meaning","why":"Wordiness is a sentence-level habit, so a sentence-level pass fixes it.","_n":"51692","_k":"8fea4faa"}]}}]},"task":{"title":"From freewrite to focused paragraph","summary":"From freewrite to focused paragraph","statement":"\u003cp>Take your own idea about “Miss Brill” through the whole loop: generate, focus, draft, revise. You’ll hand in a revised paragraph, your change log and a short craft statement. The checklist makes sure the parts are there; your teacher reads the writing.\u003c/p>\u003cp class=\"tiny muted\">This checklist makes sure the parts are there. Your teacher reads the writing. Everything you write here stays on this device.\u003c/p>\u003cdetails class=\"alg wp-rubric\">\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"topic-tbl\">\u003cthead>\u003ctr>\u003cth scope=\"col\">Category\u003c/th>\u003cth scope=\"col\">Level 1\u003c/th>\u003cth scope=\"col\">Level 2\u003c/th>\u003cth scope=\"col\">Level 3\u003c/th>\u003cth scope=\"col\">Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Knowledge (process and conventions)\u003c/th>\u003ctd>Few stages evident; citation errors throughout\u003c/td>\u003ctd>Some stages; citations inconsistent\u003c/td>\u003ctd>Clear progression through the stages; citations mostly correct\u003c/td>\u003ctd>A purposeful, looping process; citations precise\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Thinking (focus and analysis)\u003c/th>\u003ctd>Mostly summary; claim unclear\u003c/td>\u003ctd>A claim present; analysis thin\u003c/td>\u003ctd>A clear claim; evidence explained\u003c/td>\u003ctd>An insightful claim; analysis illuminates \u003cem>how\u003c/em> the writing works\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Communication (organization and style)\u003c/th>\u003ctd>Disorganized; wordy\u003c/td>\u003ctd>Some order; uneven sentences\u003c/td>\u003ctd>Logical order; clear, concise sentences\u003c/td>\u003ctd>Builds deliberately; precise, vivid style\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Application (revision)\u003c/th>\u003ctd>Changes are cosmetic only\u003c/td>\u003ctd>Some higher-order change\u003c/td>\u003ctd>Meaningful higher-order revision, explained\u003c/td>\u003ctd>Revision transforms the paragraph; the craft statement shows real insight into the writer’s own process\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["You freewrote","Your working thesis names the text and the author","Your thesis is a full claim","Your revised paragraph is the right length","Your revised paragraph quotes and cites the story","You revised, not just edited","You explained your choices"],"tips":["Set the timer and keep your pen moving. Ugly is fine.","Name the story and its author in your thesis: …in Mansfield’s “Miss Brill”…","Turn the topic into a claim: what does the story \u003cem>show\u003c/em>, and \u003cem>how\u003c/em>?","Aim for one full analytical paragraph, 120–200 words: claim, evidence, analysis, link.","Quote the story’s exact words in quotation marks, then cite the paragraph number in parentheses: (Mansfield, par. 9).","Revision means re-seeing. Change what a sentence argues, not only how it’s punctuated, and tag that change “Revising”.","Tell your reader what you changed and why. What did you notice on the second look?"],"citeClose":"Close! MLA writes (Mansfield, par. 9), with a comma and a period after “par”.","explainPrompt":"Craft statement: What did you change between Draft 1 and Draft 2, and why? What did you \u003cem>re-see\u003c/em>?","explainLabel":"Craft statement","vocab":"Use the words claim, evidence, analysis, revise and edit.","checkLabel":"Check my paragraph","success":"Every part is here. There’s more than one good paragraph to write about this story. Want to try a different focus?","more":"There’s more than one good paragraph to write about this story. Want to try a different focus?","models":[{"title":"Model response 1: the fur as companion","thesis":"In Mansfield’s “Miss Brill,” the fur that Miss Brill treats as a living friend reveals how loneliness can disguise itself as delight.","text":"From the opening paragraph, Miss Brill treats her fur less like clothing than like company. She brushes it, worries over its “dim little eyes,” and greets it with “Dear little thing!” (Mansfield, par. 1), the kind of tenderness people usually reserve for a pet or a child. Mansfield lets the narration slip so close to Miss Brill’s thoughts that we share her pleasure before we notice its cost: she lavishes affection on an object because there is no one else to receive it. The fur’s “eyes” even seem to answer her, which makes her later humiliation sharper. When the young couple mock the fur, they are not only insulting an old piece of clothing; they are laughing at the only companion she has. The fur, in other words, is where her loneliness hides in plain sight.","log":"cut two plot sentences (Revising); added an analysis of the narration (Revising); replaced “sad” with “humiliation” (Editing); fixed the citation format (Editing).","craft":"My first draft retold the opening scene. On the second look I asked what the brushing \u003cem>meant\u003c/em>, and realized that the fur’s “eyes” make it a companion. I cut the summary, kept one quotation, and added a sentence about how close the narration is to her thoughts. I fixed the citation last."},{"title":"Model response 2: the park as a play","thesis":"Mansfield’s “Miss Brill” builds its heroine’s sense of belonging through her fantasy that the park is a play, so that the couple’s mockery reads as a brutal review.","text":"Miss Brill’s Sunday afternoon is a performance she has quietly scripted for herself. Watching the crowd, she decides that the scene is “exactly like a play” (Mansfield, par. 9) and, more daringly, that she too has a part. The metaphor gives a solitary woman a role, an audience and a company of fellow actors; it turns watching into belonging. Mansfield makes the fantasy convincing by letting its excitement swell in short exclamations, so the reader is swept up with her. That is why the young couple’s remarks land so hard: they are the first voices in the story to speak from outside her script, and they review her performance with contempt. The fantasy that held her up is the same fantasy that leaves her exposed.","log":"changed the thesis from “Miss Brill likes the park” to the play claim (Revising); moved the couple to the end of the paragraph (Revising); added the exclamations point (Revising); tightened two sentences (Editing).","craft":"My draft changed when I stopped asking what happens and started asking what she \u003cem>imagines\u003c/em>. The play metaphor connected everything, so I rewrote my thesis around it. Moving the couple to the end let the paragraph build to the break."},{"title":"Model response 3: the ending’s sound","thesis":"Mansfield ends “Miss Brill” with a sound rather than a statement, letting the “something crying” in the box carry a grief Miss Brill cannot name.","text":"The last sentence of “Miss Brill” refuses to tell us how its heroine feels. Instead, as she puts the fur away, “she thought she heard something crying” (Mansfield, par. 18). The vague word “something” is a small masterpiece of restraint and tact. Miss Brill cannot admit that she is the one crying, so the grief is displaced onto the fur, the companion she has just shut in the dark. The verb “thought” keeps even the sound uncertain, as if she can no longer trust her own perceptions after the afternoon’s humiliation. By ending on what she hears rather than what she knows, Mansfield lets the reader complete the recognition that Miss Brill cannot bear. The silence that surrounds that single, uncertain sound is where the story’s deepest sorrow lives.","log":"replaced a summary of her walk home with an analysis of the last sentence (Revising); added a sentence on the verb “thought” (Revising); cut “very sad” (Editing).","craft":"I began by summarizing the ending. Reading it aloud, I noticed how odd “something” is: why not “she”? That question became my analysis. I cut the walk-home summary and spent my words on the last sentence."}]},"cards":[["Writing process","A loop: generate → focus → plan → draft → revise → edit, looping back when a draft reveals a better idea."],["Freewriting","Writing nonstop for a set time without judging, to discover ideas. Example: five minutes on “the fur”."],["Clustering","A bubble map linking ideas so that connections (fur ↔ box ↔ crying) become a focus."],["Working thesis","Your best current claim, which can change as the draft teaches you."],["Revise (word story)","Latin \u003cem>revisere\u003c/em>, “to look at again”. Re-seeing the argument, evidence and order."],["Edit","Polishing sentences and conventions: word choice, punctuation, spelling, citations. Done last."],["Higher-order concerns","Focus, thesis, evidence, analysis, organization. Fix these first."],["Lower-order concerns","Sentences, word choice, grammar, spelling, formatting. Fix these last."],["Analytical paragraph","Claim → evidence → analysis → link. “Say it, show it, explain it, connect it.”"],["Dropped quotation","A quotation with no signal phrase or explanation. Fix: introduce, cite, explain."],["Climactic order","Arranging points so the strongest comes last."],["“True ease in writing comes from art, not chance”","Pope, \u003ci>An Essay on Criticism\u003c/i> (1711): skill that looks effortless is practised, like dance."]]}};</script>
