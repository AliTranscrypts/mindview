.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}

.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}

.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}

table.vt tr:last-child td{border-bottom:0}

.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}

.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--an-sound:#A84C05;--an-image:#0E7C7B;--an-figure:#7A3DB8;--an-syntax:#2343C4;--an-diction:#6B5A1E;--an-theme:#B0286F;

--an-diction-soft:rgba(107,90,30,.14);--an-theme-soft:rgba(176,40,111,.11);
--pp-claim:var(--an-syntax);--pp-evidence:var(--an-image);--pp-analysis:var(--an-figure);--pp-link:var(--ink);--sc-stress:var(--ink);--sc-slack:var(--ink-2)}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}
:root[data-theme="dark"]{--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;
--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
.an-sound{--an-c:var(--an-sound);--an-c-soft:var(--an-sound-soft)}.an-image{--an-c:var(--an-image);--an-c-soft:var(--an-image-soft)}
.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}
.an-tag{display:inline-block;font:700 .7rem/1.35 var(--font-ui);font-style:normal;letter-spacing:.01em;color:var(--an-c,var(--ink-2));background:var(--sheet);
border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}
.an-chip{display:inline-flex;align-items:center;gap:.4em;border:2px solid var(--an-c,var(--rule));background:var(--sheet);color:var(--ink);border-radius:999px;
padding:.25em .8em;font-size:.92rem;min-height:34px}
.an-chip[aria-pressed="true"]{background:var(--an-c-soft);font-weight:700}
.an-chip[aria-pressed="true"]::after{content:"on";font-size:.72rem;font-weight:700;color:var(--an-c)}
.an-dot{display:inline-block;width:.75em;height:.75em;border-radius:50%;background:var(--an-c,var(--ink-2));flex:0 0 auto}
.an-note{border-left:4px solid var(--an-c,var(--rule));background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;margin:0 0 6px;font-size:.92rem;max-width:none}
.eng-margin{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px 24px;align-items:start}
.eng-margin > *{min-width:0}
@media (max-width:820px){ .eng-margin{grid-template-columns:minmax(0,1fr)} }
@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}
ol.eng-poem li{display:grid;grid-template-columns:2.2em minmax(0,1fr);align-items:baseline}
ol.eng-poem li.eng-gap{height:.6em}
.eng-ln{font:400 .75rem var(--font-ui);color:var(--ink-2);text-align:right;padding-right:.9em;user-select:none}
.eng-prose p{font:400 1.08rem/1.65 var(--font-math);max-width:70ch}
.eng-prose .eng-ln{display:inline-block;min-width:3.2em;padding-right:.6em;text-align:left}
.eng-cite{font-size:.85rem;color:var(--ink-2);margin:4px 0 0}
.eng-toks{display:grid;gap:6px}
.eng-tl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.eng-tok{border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:6px;padding:.08em .28em;min-height:34px;min-width:24px;
font:400 1.22rem/1.3 var(--font-math)}
.eng-tok:not(:disabled):hover{border-color:var(--rule)}
.eng-tok.an{background:var(--an-c-soft)}
.eng-tok[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.eng-tok.eng-br{font:700 .9rem var(--font-ui);color:var(--ink-2);border:1.5px dashed var(--rule)}
.eng-tok.speaking,.eng-w.speaking{outline:2px solid var(--ink);outline-offset:1px;border-radius:4px}
.eng-w{transition:opacity .25s,color .25s}
.sc-syl{position:relative;display:inline-block;padding-top:.7em}
.sc-syl::before{position:absolute;left:0;right:0;top:0;text-align:center;font:700 .85em/1 var(--font-ui)}
.sc-stress{color:var(--sc-stress);font-weight:600}.sc-stress::before{content:"´"}
.sc-slack{color:var(--sc-slack)}.sc-slack::before{content:"˘"}
/* ENG4U 05 The Writing Process. Colour tokens only (base + eng4u.css). Change marks: added teal (--f3) underline, cut struck in
   --ink-2, replaced words brown (--p-b), moved blue (--pen) arrow; every mark also has words (legend, hidden labels). */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:36px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips.wp-col1{display:grid;gap:6px}.rg.chips.wp-col1 button{border-radius:10px}
.rg button:disabled{opacity:.55}
.wp-sel{border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:.25em .4em;min-height:34px}
.wp-h{margin:16px 0 6px;font-size:1rem}
.wp-ta{min-height:150px}.wp-ta.sm{min-height:70px}.wp-ta.big{min-height:210px}
.art-samples{margin:0 0 14px}.art-samples .an-note{margin-bottom:6px}

/* hero: the couplet on a clean sheet, messy drafts behind it */
.wp-hero{position:relative;padding:54px 34px 8px;overflow:hidden}
.wp-ms{position:absolute;inset:6px 8px 58px;pointer-events:none}
.wp-ms-s{position:absolute;width:96%;height:90%;opacity:0;transition:opacity 1.2s}
.wp-ms-1{left:-3%;top:-4%;transform:rotate(-4deg)}.wp-ms-2{right:-3%;top:10%;transform:rotate(3deg)}
.wp-ms-bg{fill:var(--paper);stroke:var(--rule);stroke-width:1}
.wp-ms-ink{fill:none;stroke:var(--ink-2);stroke-width:1.5;opacity:.7}
.wp-ms-x{fill:none;stroke:var(--ink);stroke-width:2;opacity:.75}
.wp-hero.wp-h-ms .wp-ms-s,.wp-hero.wp-h-cap .wp-ms-s{opacity:1}
.wp-top{position:relative;background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:16px 18px 10px;box-shadow:0 2px 0 var(--rule)}
.wp-cp{font:400 clamp(1.12rem,2vw,1.3rem)/1.6 var(--font-math);margin:0 0 6px}
.wp-cl1{display:block}
.wp-hw{transition:color .25s,opacity .25s}
.wp-hero.wp-h-read .wp-hw{opacity:.3}
.wp-hero.wp-h-read .wp-hw.wp-lit{opacity:1;color:var(--pen)}
.wp-hg .wp-hgi{border-radius:3px;padding:0 .06em;transition:background .5s,box-shadow .5s}
.wp-hero.wp-h-glow .wp-hgi,.wp-hero:not(.wp-h-read) .wp-hgi{background:var(--an-diction-soft);box-shadow:inset 0 -2.5px 0 var(--an-diction)}
.wp-hero.wp-h-glow .wp-hgi{animation:wp-pulse .8s ease 2}
.wp-gt{margin:4px 0 0;opacity:0;transition:opacity .6s}
.wp-hero.wp-h-glow .wp-gt,.wp-hero:not(.wp-h-read) .wp-gt{opacity:1}
.wp-hcap{position:relative;font:italic 400 1.15rem var(--font-math);text-align:center;margin:12px 0 6px;opacity:0;transition:opacity .8s}
.wp-hero.wp-h-cap .wp-hcap{opacity:1}
.wp-hctrl{position:relative;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
@keyframes wp-pulse{50%{box-shadow:inset 0 -2.5px 0 var(--an-diction),0 0 0 4px var(--an-diction-soft)}}

/* story reader panel (non-modal; below the header) */
.wp-dlg{position:fixed;right:12px;bottom:12px;width:min(460px,calc(100vw - 24px));z-index:60;background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column}
.wp-dlg[hidden]{display:none}
.wp-dlg-top{display:flex;align-items:baseline;gap:10px;padding:10px 14px 6px;border-bottom:1.5px solid var(--rule)}
.wp-dlg-top h2{margin:0;font-size:1.15rem}.wp-dlg-top .btn{margin-left:auto}
.wp-dlg-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px}
.wp-dlg-body{overflow:auto;padding:0 14px 12px;flex:1 1 auto}
.wp-dlg-body .eng-prose p{font-size:1rem}
.wp-rcur{background:var(--hi-soft);border-radius:4px}
.wp-rhi{outline:2px solid var(--pen);outline-offset:4px;border-radius:4px}
@media (max-width:600px){ .wp-dlg{left:8px;right:8px;width:auto} }

.wp-ctl .rg-wrap{margin:0}.wp-cl2{font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.wp-sb .player{margin:0}
.wp-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:12px;align-items:start}
.wp-stage{min-width:0;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:10px 14px}
.wp-stage .banner{margin:0 0 6px}.wp-stage .banner:empty{display:none}
.wp-read{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper)}
.wp-read-h{margin:0 0 6px;font:700 .8rem var(--font-ui);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.wp-read dl.read{margin:0}
.wp-aha{border-left:4px solid var(--an-theme);background:var(--paper);padding:8px 12px;border-radius:0 8px 8px 0}
.wp-aha[hidden]{display:none}
@media (max-width:820px){ .wp-body{grid-template-columns:minmax(0,1fr)} }

/* drafts */
.wp-row{display:block}
.wp-row.wn{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,34%);gap:10px;align-items:start}
@media (max-width:640px){ .wp-row.wn{grid-template-columns:minmax(0,1fr)} }
.wp-note{margin:6px 0}
.wp-p,.wp-th,.wp-fwt{font:400 1.02rem/1.6 var(--font-math);margin:0 0 10px}
.wp-th{border-left:3px solid var(--pp-claim);padding-left:8px}
.wp-thl,.wp-pn{display:inline-block;font:700 .72rem var(--font-ui);color:var(--ink-2);margin-right:.5em;text-transform:uppercase;letter-spacing:.04em}
.wp-fwt{font-family:var(--font-ui);font-size:.98rem;line-height:1.7;background:var(--paper);border-radius:6px;padding:8px 10px;transform:rotate(-.4deg)}
.wp-fwt s{color:var(--ink-2);text-decoration-thickness:2px}
.wp-fw.wp-anim .wp-fwt{animation:wp-fade .9s both}
.wp-fw.wp-anim s{animation:wp-strike .6s 1.1s both}
.wp-thv{font:400 1.02rem/1.55 var(--font-math);margin:0 0 10px;padding:6px 10px;border-radius:6px;background:var(--paper)}
.wp-thv.old{opacity:.75}.wp-thv.loop{box-shadow:inset 3px 0 0 var(--pen)}
.wp-thn{margin-left:.4em}
.wp-ths.wp-anim .wp-thv:last-child{animation:wp-fade .7s both}
.wp-ths.wp-anim .wp-thn{animation:wp-slide .6s .7s both}
.wp-cf{background:transparent;color:inherit;border-radius:3px;transition:background .5s,opacity .6s}
.wp-cf.on{background:var(--hi-soft);box-shadow:inset 0 -2px 0 var(--hi)}
.wp-cfm{font:700 .8em var(--font-ui);color:var(--ink-2);margin-left:1px;opacity:0}.wp-cf.on .wp-cfm{opacity:1}
.wp-p.wp-cutting{text-decoration:line-through;text-decoration-color:var(--ink-2);color:var(--ink-2);transition:color .8s}
.wp-p.wp-cutting .wp-cf{opacity:.45}
.wp-t3{display:inline}
.wp-t3b{border:1.5px dashed var(--rule);background:var(--sheet);color:var(--ink);border-radius:6px;padding:.1em .35em;margin:2px 0;text-align:left;font:inherit;line-height:1.5}
.wp-t3b[aria-pressed="true"]{border-style:solid;border-color:var(--hi);background:var(--hi-soft)}
.wp-t3n{font:700 .72rem var(--font-ui);color:var(--ink-2)}
.wp-t3r{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-family:var(--font-ui)}

/* change marks */
.wp-cut,.wp-del{text-decoration:line-through;text-decoration-color:var(--ink-2);text-decoration-thickness:1.5px;color:var(--ink-2)}
.wp-add,.wp-ins{text-decoration:underline;text-decoration-color:var(--f3);text-decoration-thickness:2.5px;text-underline-offset:3px}
.wp-rep{color:var(--p-b);text-decoration:underline wavy;text-decoration-color:var(--p-b);text-underline-offset:3px;font-weight:600}
del.wp-del,ins.wp-ins,ins.wp-rep{background:none}
.wp-mvi{color:var(--pen);font-weight:700;margin-right:.2em;font-family:var(--font-ui)}
.wp-mv{box-shadow:inset 3px 0 0 var(--pen);padding-left:4px}
.wp-pbadge{display:inline-block;font:700 .72rem var(--font-ui);color:var(--pen);border:1.5px solid var(--pen);border-radius:999px;padding:0 .5em;margin-right:.4em}
.wp-pcut{opacity:.85}
.wp-legend{margin:8px 0 0;color:var(--ink-2)}
.wp-cmp.wp-anim .wp-cut,.wp-cmp.wp-anim .wp-del{animation:wp-strike 1s .4s both}
.wp-cmp.wp-anim .wp-add,.wp-cmp.wp-anim .wp-ins,.wp-cmp.wp-anim .wp-rep{animation:wp-fade .8s 1.3s both}
.wp-cmp.wp-anim .wp-pbadge,.wp-cmp.wp-anim .wp-mvi{animation:wp-bob .7s 2s 2}
@keyframes wp-fade{from{opacity:0}}
@keyframes wp-strike{from{text-decoration-color:transparent;color:var(--ink)}}
@keyframes wp-slide{from{opacity:0;transform:translateX(14px)}}
@keyframes wp-bob{50%{transform:translateY(4px)}}
@keyframes wp-pop{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}}
@keyframes wp-glowin{from{box-shadow:none}}

/* compare */
.wp-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.wp-col{min-width:0}.wp-col h4{margin:0 0 6px;font-size:.92rem}
.wp-col-u{display:none}
.wp-cseg{display:none}
.wp-col-u.wp-col-show{display:block}
@media (max-width:700px){
  .wp-cseg{display:block}
  .wp-cols{grid-template-columns:minmax(0,1fr)}
  .wp-cmp .wp-col{display:none}
  .wp-cmp.wp-cs-a .wp-col-a,.wp-cmp.wp-cs-b .wp-col-b,.wp-cmp.wp-cs-u .wp-col-u,.wp-cmp .wp-col-show{display:block}
}
.wp-logbox{margin-top:12px;border-top:1.5px solid var(--rule);padding-top:8px}
.wp-logbox h4{margin:0 0 4px}
ol.wp-log{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px}
ol.wp-log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--sheet)}
ol.wp-log li .wp-logt{min-width:0;font-size:.95rem}
.wp-logn{font:700 .8rem var(--font-ui);color:var(--ink-2);min-width:1.2em}
.wp-tagrow{display:flex;flex-wrap:wrap;gap:4px}
.wp-cht{font:700 .74rem var(--font-ui);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);margin-right:.3em}
#wp-mcmp ol.wp-log li,#tk-log ol.wp-log li{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){ ol.wp-log li{grid-template-columns:auto minmax(0,1fr)} ol.wp-log li .wp-tagrow,ol.wp-log li > .an-tag{grid-column:1 / -1;justify-self:start} }

/* outline (challenge 2, prediction 2, My draft plan) */
ol.wp-olist{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px}
.wp-olc{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px 8px;align-items:center;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:6px 8px}
.wp-olc.wp-slide{transition:transform 1.2s cubic-bezier(.45,0,.3,1)}
.wp-olh{color:var(--ink-2);font-weight:700;cursor:grab;touch-action:none;user-select:none;padding:4px 2px}
.wp-oln{font:700 .85rem var(--font-ui);color:var(--pen)}
.wp-olt{min-width:0;font:400 1rem var(--font-math)}
.wp-olb{display:flex;gap:4px;flex-wrap:wrap}
.wp-oin{min-width:0}
@media (max-width:640px){ .wp-olc{grid-template-columns:auto auto minmax(0,1fr)} .wp-olb{grid-column:1 / -1} }
.wp-ten{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:center;margin-top:6px}
.wp-ten svg{width:100%;height:70px;border-bottom:1.5px solid var(--rule)}
.wp-ten .tiny{grid-column:2}
.wp-tenl{font:700 .72rem var(--font-ui);color:var(--ink-2);writing-mode:vertical-rl;transform:rotate(180deg)}
.wp-tenp{fill:none;stroke:var(--pen);stroke-width:2.5;transition:opacity .6s}
.wp-tenp.wp-hide{opacity:0}
.wp-tend{fill:var(--pen)}

/* cluster */
.wp-cl{position:relative;height:250px;border:1.5px dashed var(--rule);border-radius:10px;background:var(--paper);margin:6px 0}
.wp-cl svg{position:absolute;inset:0;width:100%;height:100%}
.wp-cl line{stroke:var(--ink-2);stroke-width:1.6}
.wp-cl line.wp-cl-key{stroke:var(--an-theme);stroke-width:2.5;stroke-dasharray:6 4}
.wp-bub{position:absolute;transform:translate(-50%,-50%);border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.2em .7em;font:400 .95rem var(--font-ui);white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis;touch-action:none;min-height:30px;display:inline-flex;align-items:center}
.wp-bub.wp-glow{border-color:var(--an-theme);box-shadow:0 0 0 4px var(--an-theme-soft);font-weight:700}
.wp-bub.wp-sel,button.wp-bub[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.wp-cl-lab{position:absolute;transform:translate(-50%,-50%);font:700 .78rem var(--font-ui);color:var(--an-theme);background:var(--paper);padding:0 .3em;border-radius:4px}
.wp-cl.wp-anim .wp-bub{animation:wp-pop .45s both;animation-delay:var(--d,0s)}
.wp-cl.wp-anim .wp-bub.wp-glow{animation:wp-pop .45s both,wp-glowin .8s both;animation-delay:var(--d,0s),var(--gd,0s)}
.wp-cl.wp-anim line,.wp-cl.wp-anim .wp-cl-lab{animation:wp-fade .5s both;animation-delay:var(--d,0s)}
.wp-empty{position:absolute;inset:0;display:grid;place-items:center;margin:0}
.wp-addb{display:flex;gap:8px;align-items:center;max-width:420px}

/* predictions 1 and 4 */
.wp-p1 h4,.wp-p4 h4{margin:0 0 6px}
.wp-p1o{text-decoration:line-through;text-decoration-color:transparent;transition:text-decoration-color .5s,color .5s}
.wp-p1.on .wp-p1o{text-decoration-color:var(--ink-2);color:var(--ink-2)}
.wp-p1n{opacity:0;transition:opacity .6s;text-decoration:underline;text-decoration-color:var(--f3);text-decoration-thickness:2.5px;text-underline-offset:3px}
.wp-p1.on .wp-p1n{opacity:1}
.wp-p4new{animation:wp-fade .8s both}

/* My draft */
.wp-tabsw{overflow-x:auto}
.wp-tabs{display:grid;gap:4px;min-width:420px}
.wp-tab{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.35em .4em;font-size:.88rem;min-height:40px;display:flex;align-items:center;justify-content:center;gap:4px}
.wp-tab.on{border-color:var(--pen);background:var(--info-bg);font-weight:700;box-shadow:inset 0 -3px 0 var(--pen)}
.wp-tabn{font:700 .72rem var(--font-ui);color:var(--ink-2)}
.wp-lbrow{margin:0}
.wp-panel{min-width:0;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:8px 14px 12px}
.wp-panel .wp-h:first-child{margin-top:4px}
.wp-timer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 8px}
.wp-clock{font:700 1.3rem var(--font-ui);font-variant-numeric:tabular-nums;min-width:3.2em}
ul.wp-chk{list-style:none;padding:0;margin:4px 0;display:grid;gap:6px}
ul.wp-chk label{display:flex;gap:8px;align-items:baseline}
ul.wp-chk input{width:18px;height:18px;flex:0 0 auto}
.wp-vers,.wp-vcmp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.wp-forge{margin:4px 0 8px}.wp-forge .rg-wrap{align-items:flex-start}

/* Part 3 */
.wp-p3{display:grid;gap:10px}
.wp-passbar{display:flex;flex-wrap:wrap;gap:6px}
.wp-pass{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.4em .8em;font-size:.9rem;min-height:38px}
.wp-pass.on{border-color:var(--pen);background:var(--info-bg);font-weight:700;box-shadow:inset 0 -3px 0 var(--pen)}
.wp-pass:disabled{opacity:.5}
.wp-p3main{min-width:0;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:8px 14px 12px}
ol.wp-p1l{padding-left:1.4em;margin:6px 0;display:grid;gap:8px}
ol.wp-p1l li{padding-left:2px}
.wp-p1s{display:block;font:400 1rem/1.5 var(--font-math);margin-bottom:4px}
ol.wp-p1l .rg-wrap{margin:0}
.wp-mla{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.wp-chkl{display:inline-flex;gap:6px;align-items:center}
.wp-lab{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;margin:8px 0;background:var(--paper)}
.wp-labh{margin:0 0 4px;font-size:.88rem}
.wp-labt{margin:0 0 8px;font:400 1.05rem/1.5 var(--font-math)}
.wp-now{border:1.5px solid var(--rule);border-radius:10px;padding:8px 14px;background:var(--sheet)}
.wp-now h4{margin:0 0 6px}
.wp-nowp{margin:0;font:400 1.02rem/1.75 var(--font-math)}
.wp-pp{box-shadow:inset 0 -2.5px 0 var(--ppc,var(--rule));padding:0 .1em}
.wp-ppt{font:700 .66rem var(--font-ui);text-transform:uppercase;letter-spacing:.04em;color:var(--ppc,var(--ink-2));margin-right:.3em;vertical-align:.12em}
.pp-claim{--ppc:var(--pp-claim)}.pp-evidence{--ppc:var(--pp-evidence)}.pp-analysis{--ppc:var(--pp-analysis)}.pp-link{--ppc:var(--pp-link)}.pp-sum{--ppc:var(--ink-2)}
.wp-ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.wp-ba h4{margin:0 0 6px}.wp-bap{font:400 1rem/1.7 var(--font-math)}
@media (max-width:700px){ .wp-ba{grid-template-columns:minmax(0,1fr)} }
.wp-steal{font:italic 400 1.12rem/1.55 var(--font-math);margin:0}

/* Practice: Revise it */
.wp-rlab{margin:0 0 4px;font:700 .8rem var(--font-ui);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.wp-orig{border-left:3px solid var(--rule);background:var(--paper);padding:6px 10px;margin:0 0 6px;font:400 1rem/1.55 var(--font-math);border-radius:0 6px 6px 0}
.wp-kind{margin:-4px 0 14px;padding:0 0 10px}
.wp-kind .chips{display:flex;flex-wrap:wrap;gap:6px}

/* task */
.wp-lab5{display:block;font-weight:700;margin-bottom:4px}
.wp-tkp{font:400 1rem/1.65 var(--font-math);background:var(--paper);border-radius:8px;padding:8px 10px}
.wp-model p{max-width:none}
.wp-fab{display:none}
@media (max-width:560px){
  #wp-open-story{display:none}
  .wp-fab{display:inline-flex;position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:55;box-shadow:0 3px 10px rgba(0,0,0,.25)}
  .wp-pill{font-size:.66rem;padding:.15em .1em}
}

<script>window.MV_PAYLOAD={"meta":{"id":"05-writing-process","nn":"05","slug":"writing-process","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 1","groupName":"The Reader's and Writer's Craft","trivium":"Logic, Rhetoric","size":"M","storageKey":"eng4u-05-writing-process-v1","progressKey":"eng4u-progress-v1:05-writing-process","toolkit":"1.0.7"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"4551679d","content":{"id":"05-writing-process","kind":"topic","title":"The writing process","topic":"The Writing Process","readyTopic":"the writing process","hero":{"headline":"Ease is earned","text":"The sentences you admire didn’t fall onto the page finished. They were \u003cstrong>generated\u003c/strong>, \u003cstrong>focused\u003c/strong>, \u003cstrong>drafted\u003c/strong>, \u003cstrong>revised\u003c/strong> and \u003cstrong>edited\u003c/strong>, often more than once. This module walks you through that loop with one short story, Katherine Mansfield’s “Miss Brill”, and one paragraph of your own. By the end you’ll have a draft, a better draft, and a principle about revision that is yours.","fig":{"html":"\u003cdiv class=\"wp-hero\" id=\"wp-hero\" role=\"group\" aria-label=\"Alexander Pope’s couplet on writing, read aloud, with layered drafts behind it\">\u003c/div>","caption":""},"couplet":["True ease in writing comes from art, not chance,","As those move easiest who have learned to dance."],"cite":"Alexander Pope, \u003ci>An Essay on Criticism\u003c/i> (1711), lines 362–363","glow":["art,","chance,"],"glowTag":"the couplet’s argument in two words","caption":"Every clean page has messy ones underneath.","noVoice":"Read it aloud yourself; your ear is the best editor."},"goals":["I can describe the stages of the writing process and explain why writers loop back through them.","I can generate and focus ideas using freewriting, clustering and questioning.","I can turn a focused idea into a working thesis and an outline that builds.","I can tell revising (focus, evidence, organization) from editing (sentences, conventions), and do them in that order.","I can revise a paragraph so that every sentence serves its claim and every quotation is introduced and explained.","I can reflect on my own writing habits and choose strategies that help me."],"start":{"story":{"title":"Miss Brill","author":"Katherine Mansfield","cite":"Katherine Mansfield, “Miss Brill” (1920), from \u003ci>The Garden Party and Other Stories\u003c/i> (1922). Public domain. Paragraphs are numbered 1–18 for MLA citations: (Mansfield, par. 9).","pars":["Although it was so brilliantly fine—the blue sky powdered with gold and great spots of light like white wine splashed over the Jardins Publiques—Miss Brill was glad that she had decided on her fur. The air was motionless, but when you opened your mouth there was just a faint chill, like a chill from a glass of iced water before you sip, and now and again a leaf came drifting—from nowhere, from the sky. Miss Brill put up her hand and touched her fur. Dear little thing! It was nice to feel it again. She had taken it out of its box that afternoon, shaken out the moth-powder, given it a good brush, and rubbed the life back into the dim little eyes. “What has been happening to me?” said the sad little eyes. Oh, how sweet it was to see them snap at her again from the red eiderdown!... But the nose, which was of some black composition, wasn’t at all firm. It must have had a knock, somehow. Never mind—a little dab of black sealing-wax when the time came—when it was absolutely necessary.... Little rogue! Yes, she really felt like that about it. Little rogue biting its tail just by her left ear. She could have taken it off and laid it on her lap and stroked it. She felt a tingling in her hands and arms, but that came from walking, she supposed. And when she breathed, something light and sad—no, not sad, exactly—something gentle seemed to move in her bosom.","There were a number of people out this afternoon, far more than last Sunday. And the band sounded louder and gayer. That was because the Season had begun. For although the band played all the year round on Sundays, out of season it was never the same. It was like some one playing with only the family to listen; it didn’t care how it played if there weren’t any strangers present. Wasn’t the conductor wearing a new coat, too? She was sure it was new. He scraped with his foot and flapped his arms like a rooster about to crow, and the bandsmen sitting in the green rotunda blew out their cheeks and glared at the music. Now there came a little “flutey” bit—very pretty!—a little chain of bright drops. She was sure it would be repeated. It was; she lifted her head and smiled.","Only two people shared her “special” seat: a fine old man in a velvet coat, his hands clasped over a huge carved walking-stick, and a big old woman, sitting upright, with a roll of knitting on her embroidered apron. They did not speak. This was disappointing, for Miss Brill always looked forward to the conversation. She had become really quite expert, she thought, at listening as though she didn’t listen, at sitting in other people’s lives just for a minute while they talked round her.","She glanced, sideways, at the old couple. Perhaps they would go soon. Last Sunday, too, hadn’t been as interesting as usual. An Englishman and his wife, he wearing a dreadful Panama hat and she button boots. And she’d gone on the whole time about how she ought to wear spectacles; she knew she needed them; but that it was no good getting any; they’d be sure to break and they’d never keep on. And he’d been so patient. He’d suggested everything—gold rims, the kind that curved round your ears, little pads inside the bridge. No, nothing would please her. “They’ll always be sliding down my nose!” Miss Brill had wanted to shake her.","The old people sat on the bench, still as statues. Never mind, there was always the crowd to watch. To and fro, in front of the flower-beds and the band rotunda, the couples and groups paraded, stopped to talk, to greet, to buy a handful of flowers from the old beggar who had his tray fixed to the railings. Little children ran among them, swooping and laughing; little boys with big white silk bows under their chins, little girls, little French dolls, dressed up in velvet and lace. And sometimes a tiny staggerer came suddenly rocking into the open from under the trees, stopped, stared, as suddenly sat down “flop,” until its small high-stepping mother, like a young hen, rushed scolding to its rescue. Other people sat on the benches and green chairs, but they were nearly always the same, Sunday after Sunday, and—Miss Brill had often noticed—there was something funny about nearly all of them. They were odd, silent, nearly all old, and from the way they stared they looked as though they’d just come from dark little rooms or even—even cupboards!","Behind the rotunda the slender trees with yellow leaves down drooping, and through them just a line of sea, and beyond the blue sky with gold-veined clouds.","Tum-tum-tum tiddle-um! tiddle-um! tum tiddley-um tum ta! blew the band.","Two young girls in red came by and two young soldiers in blue met them, and they laughed and paired and went off arm-in-arm. Two peasant women with funny straw hats passed, gravely, leading beautiful smoke-coloured donkeys. A cold, pale nun hurried by. A beautiful woman came along and dropped her bunch of violets, and a little boy ran after to hand them to her, and she took them and threw them away as if they’d been poisoned. Dear me! Miss Brill didn’t know whether to admire that or not! And now an ermine toque and a gentleman in grey met just in front of her. He was tall, stiff, dignified, and she was wearing the ermine toque she’d bought when her hair was yellow. Now everything, her hair, her face, even her eyes, was the same colour as the shabby ermine, and her hand, in its cleaned glove, lifted to dab her lips, was a tiny yellowish paw. Oh, she was so pleased to see him—delighted! She rather thought they were going to meet that afternoon. She described where she’d been—everywhere, here, there, along by the sea. The day was so charming—didn’t he agree? And wouldn’t he, perhaps?... But he shook his head, lighted a cigarette, slowly breathed a great deep puff into her face, and even while she was still talking and laughing, flicked the match away and walked on. The ermine toque was alone; she smiled more brightly than ever. But even the band seemed to know what she was feeling and played more softly, played tenderly, and the drum beat, “The Brute! The Brute!” over and over. What would she do? What was going to happen now? But as Miss Brill wondered, the ermine toque turned, raised her hand as though she’d seen some one else, much nicer, just over there, and pattered away. And the band changed again and played more quickly, more gayly than ever, and the old couple on Miss Brill’s seat got up and marched away, and such a funny old man with long whiskers hobbled along in time to the music and was nearly knocked over by four girls walking abreast.","Oh, how fascinating it was! How she enjoyed it! How she loved sitting here, watching it all! It was like a play. It was exactly like a play. Who could believe the sky at the back wasn’t painted? But it wasn’t till a little brown dog trotted on solemn and then slowly trotted off, like a little “theatre” dog, a little dog that had been drugged, that Miss Brill discovered what it was that made it so exciting. They were all on the stage. They weren’t only the audience, not only looking on; they were acting. Even she had a part and came every Sunday. No doubt somebody would have noticed if she hadn’t been there; she was part of the performance after all. How strange she’d never thought of it like that before! And yet it explained why she made such a point of starting from home at just the same time each week—so as not to be late for the performance—and it also explained why she had quite a queer, shy feeling at telling her English pupils how she spent her Sunday afternoons. No wonder! Miss Brill nearly laughed out loud. She was on the stage. She thought of the old invalid gentleman to whom she read the newspaper four afternoons a week while he slept in the garden. She had got quite used to the frail head on the cotton pillow, the hollowed eyes, the open mouth and the high pinched nose. If he’d been dead she mightn’t have noticed for weeks; she wouldn’t have minded. But suddenly he knew he was having the paper read to him by an actress! “An actress!” The old head lifted; two points of light quivered in the old eyes. “An actress—are ye?” And Miss Brill smoothed the newspaper as though it were the manuscript of her part and said gently; “Yes, I have been an actress for a long time.”","The band had been having a rest. Now they started again. And what they played was warm, sunny, yet there was just a faint chill—a something, what was it?—not sadness—no, not sadness—a something that made you want to sing. The tune lifted, lifted, the light shone; and it seemed to Miss Brill that in another moment all of them, all the whole company, would begin singing. The young ones, the laughing ones who were moving together, they would begin, and the men’s voices, very resolute and brave, would join them. And then she too, she too, and the others on the benches—they would come in with a kind of accompaniment—something low, that scarcely rose or fell, something so beautiful—moving.... And Miss Brill’s eyes filled with tears and she looked smiling at all the other members of the company. Yes, we understand, we understand, she thought—though what they understood she didn’t know.","Just at that moment a boy and girl came and sat down where the old couple had been. They were beautifully dressed; they were in love. The hero and heroine, of course, just arrived from his father’s yacht. And still soundlessly singing, still with that trembling smile, Miss Brill prepared to listen.","“No, not now,” said the girl. “Not here, I can’t.”","“But why? Because of that stupid old thing at the end there?” asked the boy. “Why does she come here at all—who wants her? Why doesn’t she keep her silly old mug at home?”","“It’s her fu-fur which is so funny,” giggled the girl. “It’s exactly like a fried whiting.”","“Ah, be off with you!” said the boy in an angry whisper. Then: “Tell me, ma petite chère—”","“No, not here,” said the girl. “Not \u003cem>yet\u003c/em>.”","On her way home she usually bought a slice of honey-cake at the baker’s. It was her Sunday treat. Sometimes there was an almond in her slice, sometimes not. It made a great difference. If there was an almond it was like carrying home a tiny present—a surprise—something that might very well not have been there. She hurried on the almond Sundays and struck the match for the kettle in quite a dashing way.","But to-day she passed the baker’s by, climbed the stairs, went into the little dark room—her room like a cupboard—and sat down on the red eiderdown. She sat there for a long time. The box that the fur came out of was on the bed. She unclasped the necklet quickly; quickly, without looking, laid it inside. But when she put the lid on she thought she heard something crying."]},"blocks":[{"title":"Word story","html":"\u003cp>\u003cstrong>\u003cem>Revise\u003c/em>\u003c/strong> comes from Latin \u003cem>revisere\u003c/em>, “to look at again” (\u003cem>re-\u003c/em>, “again”, plus \u003cem>visere\u003c/em>, “to look at”, from \u003cem>videre\u003c/em>, “to see”).\u003c/p>\u003cp>To revise is literally to \u003cstrong>re-see\u003c/strong>. That is why fixing commas isn’t revising: you haven’t looked at the writing again with new eyes, only tidied its surface. The word for the whole process is in the word.\u003c/p>"},{"title":"The writing subject: “Miss Brill”","html":"\u003cp>Everything you write in this module is about one short story: Katherine Mansfield’s “Miss Brill” (1920). It is short and rich, and its single Sunday afternoon turns on a cruelty that rewards rereading. Read it once now, just for what happens. You’ll reread it for how it’s told.\u003c/p>\u003cp>The story opens from the \u003cstrong>Story\u003c/strong> button at the top of every part, with numbered paragraphs, so you can cite it like this: (Mansfield, par. 9).\u003c/p>\u003cdiv class=\"q-actions\">\u003cbutton type=\"button\" class=\"btn primary sm\" data-story=\"1\">Read “Miss Brill”\u003c/button>\u003c/div>"}],"warmup":{"questions":[{"id":"w1","skill":"Analytical paragraphs","goal":5,"prompt":"Which sentence is \u003cstrong>analysis\u003c/strong>, not summary?","options":[{"t":"“Miss Brill is a lonely woman who goes to the park.”","why":"This states a trait without showing how the writing reveals it.","_n":"0777","_k":"e0438361"},{"t":"“Miss Brill takes her fur out of its box and brushes it.”","why":"This retells what happens. Analysis explains what it means.","_n":"1747","_k":"1102446f"},{"t":"“‘Miss Brill’ was written by Katherine Mansfield in 1920.”","why":"True, but it says nothing about how the story works.","_n":"2757","_k":"fdd94f4d"},{"t":"“By calling her fur a ‘little rogue’, Miss Brill treats it as a friend, which hints at how few real friends she has.”","why":"It explains what a detail suggests and why it matters.","_n":"3727","_k":"cac16d94"}],"hints":["Which sentence explains \u003cem>how\u003c/em> or \u003cem>why\u003c/em>, not just \u003cem>what\u003c/em>?","Look for a sentence that connects a detail to a bigger idea.","The sentence about the nickname “little rogue”: it reveals her loneliness."]},{"id":"w2","skill":"Analytical paragraphs","goal":5,"prompt":"A good analytical paragraph usually moves in which order?","options":[{"t":"Evidence → evidence → evidence → claim","why":"Three quotations with no explanation leave the reader to do your thinking.","_n":"4737","_k":"83afa479"},{"t":"Summary → opinion → quotation","why":"Summary first buries the claim.","_n":"5707","_k":"811540f7"},{"t":"Claim → claim → claim","why":"Claims need proof from the text.","_n":"6717","_k":"1208aa1d"},{"t":"Claim → evidence → analysis → link back","why":"Say it, show it, explain it, connect it.","_n":"77e7","_k":"99e98873"}],"hints":["What does the reader need first: your point or your proof?","The point first, then the proof, then the explanation.","Claim → evidence → analysis → link."]},{"id":"w3","skill":"Thesis statements","goal":3,"prompt":"Which is a \u003cstrong>thesis\u003c/strong>, not a topic?","options":[{"t":"“Miss Brill goes to the park on Sundays.”","why":"No one could disagree; there’s nothing to argue.","_n":"87f7","_k":"22c2a8b8"},{"t":"“Mansfield uses Miss Brill’s fur to show how loneliness can disguise itself as delight.”","why":"It makes an arguable claim and says how the text shows it.","_n":"91ed","_k":"30c5cdc6"},{"t":"“Loneliness is a serious problem in society.”","why":"It doesn’t mention the story at all.","_n":"a1dd","_k":"5b9a5ca0"},{"t":"“This essay is about loneliness in ‘Miss Brill’.”","why":"This names a topic; it claims nothing.","_n":"b20d","_k":"c151a5ca"}],"hints":["Could someone reasonably disagree?","A thesis names the text, a claim and how it’s shown.","The sentence about Mansfield using the fur to show loneliness disguised as delight."]},{"id":"w4","skill":"Thesis statements","goal":3,"prompt":"A working thesis is…","options":[{"t":"a summary of the plot","why":"A thesis argues; a summary reports.","_n":"c1fd","_k":"3d3e0884"},{"t":"a best current claim that may change as you draft","why":"“Working” means it’s still being worked on.","_n":"d1ad","_k":"f18c7a0f"},{"t":"a question for the reader","why":"A question can start your thinking, but the thesis answers it.","_n":"e19d","_k":"c0f74f89"},{"t":"a final sentence you must never change","why":"Drafting often reveals a sharper claim; change it.","_n":"f1cd","_k":"291a2a18"}],"hints":["What does “working” suggest?","It’s still in progress.","A best current claim that may change as you draft."]},{"id":"w5","skill":"Quotation use","goal":5,"prompt":"Which sentence \u003cstrong>integrates\u003c/strong> a quotation best?","options":[{"t":"In paragraph 9 there is a quote about a play.","why":"Quote the words and explain them.","_n":"g1bd","_k":"89be948c"},{"t":"“It was exactly like a play.” This shows she is imaginative.","why":"This is a dropped quotation: it arrives with no introduction.","_n":"h26d","_k":"0f22dcee"},{"t":"Miss Brill thinks it was exactly like a play.","why":"That’s borrowing words without credit.","_n":"i25d","_k":"c3c97820"},{"t":"Miss Brill imagines that the park’s visitors are actors, deciding that “It was exactly like a play” (Mansfield, par. 9).","why":"A signal phrase introduces it, the quotation fits the sentence’s grammar, and it’s cited.","_n":"jacc","_k":"8d9471f6"}],"hints":["Is the quotation introduced?","Does it fit the sentence and carry a citation?","The sentence with a signal phrase and the citation (Mansfield, par. 9)."]},{"id":"w6","skill":"Reading for detail","goal":2,"prompt":"In “Miss Brill”, what overheard comment changes the afternoon?","options":[{"t":"The band leader thanks her for coming","why":"No one thanks her.","_n":"kadc","_k":"8cdbc5ef"},{"t":"An old man asks her to dance","why":"Nothing like this happens.","_n":"laec","_k":"8e31b43d"},{"t":"A young couple mocks her and her fur","why":"Their cruelty breaks her sense of belonging.","_n":"mafc","_k":"6a97f28c"},{"t":"A child asks her name","why":"The decisive voices are the couple’s.","_n":"na8c","_k":"64a64a0a"}],"hints":["Think about the end of her afternoon.","Two young people sit near her.","A young couple mocks her and her fur."]}],"refreshers":{"Analytical paragraphs":"Claim, evidence, analysis, link. Analysis answers \u003cem>how\u003c/em> and \u003cem>why\u003c/em>: “The word ‘rogue’ makes the fur a mischievous friend, which tells us how little company she has.”","Thesis statements":"Text + claim + how. Test: could a thoughtful reader disagree? If not, it’s a fact or a topic.","Quotation use":"Introduce (signal phrase), quote (exact words in quotation marks), cite (par. or page), explain (what the words do).","Reading for detail":"Before writing, reread the story once just for what happens and once for how it’s told."}}},"explore":{"heading":"The draft workspace","intro":"Watch a writer get from a mess to a paragraph that works, then take your own idea through the same loop.","modes":[{"id":"time","t":"Drafts timeline"},{"id":"mine","t":"My draft"}],"stages":[{"id":"generate","t":"Generate"},{"id":"focus","t":"Focus"},{"id":"plan","t":"Plan"},{"id":"draft","t":"Draft"},{"id":"revise","t":"Revise"},{"id":"edit","t":"Edit"}],"loopNote":"Looping back is what writers do.","aha":"The biggest improvements happen in revision, when the writer re-sees \u003cem>what\u003c/em> they are claiming. Editing makes good writing shine; it can’t make weak thinking strong.","writer":"an anonymous Grade 12 writer","snaps":[{"id":"fw","label":"Freewrite","meta":"5 min · 112 words","stage":"generate","kind":"freewrite","html":"ok Miss Brill. the fur. she talks to the fur like its a pet \u003cs>a dog\u003c/s> a friend, dear little thing, and it has eyes, why do the eyes matter \u003cs>because\u003c/s> maybe nobody else looks at her?? the park is like a play she says that, everybody is acting and she thinks she has a part but nobody knows \u003cs>shes there\u003c/s> she’s there until the couple. the couple!! they call her a stupid old thing and the fur a fried fish \u003cs>whiting\u003c/s> and she goes home, no honey cake and puts the fur in the box and hears crying is it her or the fur, its her but she can’t say it","note":"Ugly on purpose. Don’t stop, don’t fix."},{"id":"cl","label":"Cluster","meta":"7 bubbles","stage":"generate","kind":"cluster","nodes":[{"id":"fur","t":"fur","x":20,"y":44},{"id":"park","t":"park","x":46,"y":18},{"id":"band","t":"band","x":80,"y":14},{"id":"play","t":"“play”","x":76,"y":46},{"id":"couple","t":"couple","x":54,"y":72},{"id":"box","t":"box","x":30,"y":86},{"id":"crying","t":"crying","x":84,"y":84}],"links":[["fur","park"],["park","band"],["park","play"],["play","couple"],["couple","fur"],["fur","box"]],"key":{"a":"fur","b":"crying","label":"the box"},"note":"fur, box, crying: that’s where the story hurts. Focus here?"},{"id":"th","label":"Working thesis","meta":"three tries","stage":"plan","kind":"thesis","v":[{"t":"Miss Brill is about a lonely woman.","note":"Topic, not claim."},{"t":"Mansfield uses the fur, which Miss Brill treats as a companion, to show loneliness disguised as delight.","note":"A claim, and how the story shows it."},{"t":"In “Miss Brill,” Mansfield uses the fur, which Miss Brill treats as a companion, and her fantasy that the park is a play to show how loneliness can disguise itself as delight.","note":"Looped back while drafting: she’s performing, not just watching!","loop":true}]},{"id":"d1","label":"Draft 1","meta":"five paragraphs, two mostly summary","stage":"draft","kind":"draft","thesis":"In “Miss Brill,” Mansfield uses the fur, which Miss Brill treats as a companion, and her fantasy that the park is a play to show how loneliness can disguise itself as delight.","pars":[["Miss Brill is an old woman who goes to the park every Sunday afternoon to listen to the band.","Before she leaves she takes her fur out of its box brushes it and rubs the life back into its little eyes.","She sits on her special seat next to an old couple who do not speak to each other, this is disappointing because she likes listening to other people talk.","She watches the crowd walk past the band rotunda and she notices that most of the people sitting on the benches are odd silent and old."],["Lots of people walk past her seat while the band plays.","A beautiful woman throws away the violets a little boy hands her and a woman in an ermine toque is snubbed by a gentleman in grey who blows smoke in her face.","The band plays more softly when this happens and Miss Brill thinks it is all very interesting.","She enjoys watching the people more than anything else in her week."],["At home, the fur returns to its box, and she hears “something crying.”","On the way home from the Jardin Publiques, she passes the baker’s by, she does not buy her Sunday slice of honey-cake.","She sits sad and silent on the red eiderdown and puts the fur away without looking at it.","Closing the lid, she “thought she heard something crying.”"],["In the park, she imagines herself an actor in a play, needed and seen.","Watching the crowd she decides that the scene is “exactly like a play” (Mansfield, par. 9) and that even she has a part.","The fantasy turns a lonely woman on a bench into a member of a company so that watching becomes belonging."],["The young couple’s mockery breaks Miss Brill’s illusion in a single exchange.","When the boy asks why “she come[s] here at all,” the question erases the role she believed she played.","Mansfield herself was born in New Zealand and later lived in Europe.","The girl’s joke about the fur turns her companion into an object of ridicule.","In two lines of dialogue, the audience Miss Brill imagined becomes a crowd that doesn’t want her."]],"notes":{"0":"This is just retelling. What does it \u003cem>mean\u003c/em>?","1":"More plot. Do I need it?","2":"Quotation dropped in. Explain it, and cite it.","t":"New working thesis, written after looping back."},"commas":[[0,"leaves"],[0,"box"],[0,"brushes"],[0,"other,"],[0,"rotunda"],[0,"odd"],[0,"silent"],[1,"hands"],[1,"happens"],[2,"by,"]]},{"id":"d2","label":"Draft 2","meta":"revised","stage":"revise","kind":"draft","thesis":"In “Miss Brill,” Mansfield uses the fur, which Miss Brill treats as a companion, and her fantasy that the park is a play to show how loneliness can disguise itself as delight.","pars":[["From the first paragraph, Miss Brill treats her fur as a living companion.","Taking it out of its box, she greets it with “Dear little thing!” (Mansfield, par. 1), the kind of tenderness people usually keep for a pet or a child, and her affection for a mere object quietly suggests how few people she has left to give it to."],["In the park, she imagines herself an actor in a play, needed and seen.","Watching the crowd she decides that the scene is “exactly like a play” (Mansfield, par. 9) and that even she has a part.","The fantasy turns a lonely woman on a bench into a member of a company so that watching becomes belonging."],["The young couple’s mockery breaks Miss Brill’s illusion in a single exchange.","When the boy asks why “she come[s] here at all,” the question erases the role she believed she played.","Mansfield herself was born in New Zealand and later lived in Europe.","The girl’s joke about the fur turns her companion into an object of ridicule.","In two lines of dialogue, the audience Miss Brill imagined becomes a crowd that doesn’t want her."],["At home, the fur returns to its box, and she hears “something crying.”","On the way home from the Jardins Publiques, she passes the baker’s by and does not buy her Sunday slice of honey-cake.","She sits forlorn and silent on the red eiderdown and puts the fur away without looking at it.","Closing the lid, she “thought she heard something crying” (Mansfield, par. 18).","Mansfield never says that Miss Brill is the one crying: the vague word “something” lets the fur grieve for her, so the loneliness she has disguised all afternoon finally finds a voice."]],"notes":{"0":"Claim first, then one good quotation.","3":"Moved to the end, so the essay builds to its strongest moment."}},{"id":"fn","label":"Final","meta":"edited","stage":"edit","kind":"draft","thesis":"In “Miss Brill,” Mansfield uses the fur, which Miss Brill treats as a companion, and her fantasy that the park is a play to show how loneliness can disguise itself as delight.","pars":[["From the first paragraph, Miss Brill treats her fur as a living companion.","Taking it out of its box, she greets it with “Dear little thing!” (Mansfield, par. 1), the kind of tenderness people usually keep for a pet or a child, and her affection for a mere object quietly suggests how few people she has left to give it to."],["In the park, she imagines herself an actor in a play, needed and seen.","Watching the crowd, she decides that the scene is “exactly like a play” (Mansfield, par. 9) and that even she has a part.","The fantasy turns a solitary woman on a bench into a member of a company, so that watching becomes belonging."],["The young couple’s mockery breaks Miss Brill’s illusion in a single exchange.","When the boy asks why “she come[s] here at all,” the question erases the role she believed she played.","The girl’s joke about the fur turns her companion into an object of ridicule.","In two lines of dialogue, the audience Miss Brill imagined becomes a crowd that doesn’t want her."],["At home, the fur returns to its box, and she hears “something crying.”","On the way home from the Jardins Publiques, she passes the baker’s by and does not buy her Sunday slice of honey-cake.","She sits forlorn and silent on the red eiderdown and puts the fur away without looking at it.","Closing the lid, she “thought she heard something crying” (Mansfield, par. 18).","Mansfield never says that Miss Brill is the one crying: the vague word “something” lets the fur grieve for her, so the loneliness she has disguised all afternoon finally finds a voice."]],"notes":{"1":"Two commas and one sharper word (“lonely” → “solitary”). Polish last.","2":"One last loop on the final read: I cut the sentence about Mansfield’s life. It didn’t serve the claim."}}],"logs":{"d1|d2":[{"id":"c1","t":"Cut the plot-summary opening","_a":"FkdQRxQ="},{"id":"c2","t":"Replaced the topic sentence with a claim","_a":"FkdQRxQ="},{"id":"c3","t":"Added an explanation after the quotation","_a":"FkdQRxQ="},{"id":"c4","t":"Moved the ending paragraph to last","_a":"FkdQRxQ="},{"id":"c5","t":"Fixed a comma splice","_a":"FlBRWEIV"},{"id":"c6","t":"Changed “sad” to “forlorn”","_a":"FlBRWEIV"},{"id":"c7","t":"Corrected “Jardin” to “Jardins”","_a":"FlBRWEIV"},{"id":"c8","t":"Added a paragraph-number citation","_a":"FlBRWEIV"}],"d2|fn":[{"t":"Cut the sentence about Mansfield’s life","tag":"rev"},{"t":"Added a comma after “Watching the crowd”","tag":"edit"},{"t":"Added a comma before “so that”","tag":"edit"},{"t":"Changed “lonely” to “solitary”","tag":"edit"}]},"story":[{"snap":"fw","cap":"Ugly on purpose."},{"snap":"cl","cap":"The cluster grows bubble by bubble. “fur” and “crying” glow, linked by a new line: the box."},{"snap":"th","v":1,"cap":"Thesis 1 appears. A margin note slides in: “Topic, not claim.”"},{"snap":"th","v":2,"cap":"Thesis 2: a claim, and how the story shows it."},{"snap":"d2","cmp":"d1","cap":"Draft 1 → Draft 2: summary strikes through, analysis appears, and the ending paragraph moves down to build to the end."},{"snap":"fn","cmp":"d2","cap":"Editing comes last. It’s the polish, not the shape."}],"my":{"tabs":[{"id":"generate","t":"Generate"},{"id":"focus","t":"Focus"},{"id":"plan","t":"Plan"},{"id":"draft","t":"Draft"},{"id":"revise","t":"Revise and edit"}],"minutes":5,"focusQs":["What surprised you?","What object matters most?","Where does the tone change?"],"higher":["\u003cstrong>Claim:\u003c/strong> my first sentence says what the story shows, and how.","\u003cstrong>Evidence:\u003c/strong> every quotation is exact, introduced and cited (Mansfield, par. N).","\u003cstrong>Analysis:\u003c/strong> after each quotation, I explain what its words do.","\u003cstrong>Order:\u003c/strong> my points build; the strongest comes last."],"lower":["\u003cstrong>Word choice:\u003c/strong> I replaced vague words (very, really, things) with precise ones.","\u003cstrong>Sentences:\u003c/strong> I cut dead words and fixed comma splices.","\u003cstrong>Conventions:\u003c/strong> spelling, capitals, quotation marks and the MLA citation format.","\u003cstrong>Read aloud:\u003c/strong> I read it aloud and fixed what my ear caught."],"gateNote":"You can edit now if you like. Most writers find it pays to settle the argument first: polishing a sentence you later cut is wasted effort."},"forge":{"intro":"Optional help: tap one chip in each row, then build a sentence you can rewrite in your own words.","how":["Miss Brill’s fur","the park imagined as a play","the band’s changing music","the young couple’s overheard words","the ending’s “something crying”"],"claim":["how loneliness can disguise itself as delight","how imagination can be both a comfort and a trap","how one careless remark can break an illusion","how a person can perform belonging without having it"],"why":["so that the reader sees what Miss Brill cannot","so that the ending lands as grief rather than surprise","so that her cheerfulness reads as courage"]},"predIntro":"Make a prediction first. Then the timeline shows you what happened to the model writer’s drafts.","predictions":[{"id":"p1","prompt":"Draft 1, paragraph 1 is four sentences retelling the park scene. The writer deletes all four summary sentences and replaces them with one claim and one quotation. What happens to the paragraph?","options":[{"t":"It gets weaker because it has less detail","_n":"oa9c","_k":"b4651d46"},{"t":"Nothing changes; summary and analysis do the same job","_n":"paac","_k":"6849cfbd"},{"t":"It becomes off-topic","_n":"qabc","_k":"c3d4f347"},{"t":"It gets shorter but says more","_n":"ra4c","_k":"715465ad"}],"explain":"Your reader already knows the plot. One claim and one well-chosen quotation do more work than four sentences of retelling.","claims":[0,1]},{"id":"p2","prompt":"In the Draft 2 outline, the writer moves the paragraph about the ending (the fur back in its box, the sound of “something crying”) from second to last. What’s the likely effect?","options":[{"t":"The essay builds to its most powerful point","_n":"sa5c","_k":"31171fc1"},{"t":"The essay becomes confusing","_n":"t32d","_k":"bbe72445"},{"t":"The thesis no longer fits","_n":"u31d","_k":"a70136d7"},{"t":"No effect; order doesn’t matter in analysis","_n":"v30d","_k":"f0b16fb1"}],"explain":"Climactic order saves the strongest evidence for last, so the reader finishes on it.","from":["a","d","b","c"]},{"id":"p3","prompt":"Suppose the writer had spent 20 minutes fixing every comma in Draft 1 before revising. What would have happened to that work?","options":[{"t":"It would have improved the argument","_n":"w2fd","_k":"a3e3184d"},{"t":"It would have saved time later","_n":"x2ed","_k":"a74a00c5"},{"t":"Much of it would be lost, because two of those paragraphs were later cut","_n":"y2dd","_k":"dd2e602e"},{"t":"Nothing; commas never change","_n":"z2cd","_k":"6818e999"}],"explain":"Edit last. Polishing what you’ll cut is wasted art."},{"id":"p4","prompt":"While drafting paragraph 2, the writer realizes the real point is that Miss Brill is performing, not just watching. What should she do?","options":[{"t":"Add the new idea as a last sentence","_n":"102bd","_k":"9f5e3a6d"},{"t":"Start over from nothing","_n":"112ad","_k":"ebb2c133"},{"t":"Ignore it and finish the plan","_n":"1229d","_k":"c0b62664"},{"t":"Loop back: revise the working thesis, then adjust the outline","_n":"13a0c","_k":"2d2b437f"}],"explain":"Drafting is a way of thinking. When it shows you a better claim, take it."}],"chalIntro":"Use the timeline to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right draft. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"Sort the model writer’s 8 changes between Draft 1 and Draft 2 into \u003cstrong>Revising\u003c/strong> (higher-order) or \u003cstrong>Editing\u003c/strong> (lower-order). \u003cbutton type=\"button\" class=\"btn ghost sm wp-setup\" data-setup=\"tc1\">Set it up\u003c/button>","why":"Cutting summary, sharpening the claim, adding analysis and reordering change what the essay argues. The rest is polish.","hints":["Ask: does this change what the paragraph \u003cem>argues\u003c/em> or \u003cem>proves\u003c/em>?","Cutting summary, sharpening the claim, adding analysis and reordering all change the argument.","Revising: 1, 2, 3, 4. Editing: 5, 6, 7, 8."]},{"id":"tc2","goal":[3,5],"prompt":"Order the model writer’s four body-paragraph topic sentences so the essay builds to its strongest point. \u003cbutton type=\"button\" class=\"btn ghost sm wp-setup\" data-setup=\"tc2\">Set it up\u003c/button>","why":"The fur, the play, the couple, the box: the illusion is built, broken, then sealed away. Here chronological and climactic order coincide, so the story’s own order already builds.","hints":["What does the reader need to see before the cruelty can hurt?","The illusion has to be built (the fur, the play) before it breaks (the couple).","The fur, the play, the couple, the box."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Draft 2’s third paragraph has one sentence the claim doesn’t support. Find it, then choose a repair. \u003cbutton type=\"button\" class=\"btn ghost sm wp-setup\" data-setup=\"tc3\">Set it up\u003c/button>","why":"Biography isn’t evidence for a claim about the couple. Cut it, or replace it with something that serves the claim.","hints":["Read the claim (sentence 1). Which sentence doesn’t help prove it?","One sentence is about the author, not the story.","Sentence 3. Cut it, or replace it with something about the couple."]}],"tc1":{"wrong":{"c6|rev":"A sharper word is a sentence-level polish, valuable but lower-order. It doesn’t change the argument.","c3|edit":"Adding analysis changes what the paragraph proves. That’s revision.","c8|rev":"Citations matter, but they’re a convention, fixed at the editing stage."},"general":"Ask of each change: does it change what the paragraph argues or proves?"},"tc2":{"cards":[{"id":"a","t":"From the first paragraph, Miss Brill treats her fur as a living companion.","lift":1},{"id":"b","t":"In the park, she imagines herself an actor in a play, needed and seen.","lift":2},{"id":"c","t":"The young couple’s mockery breaks that illusion in a single exchange.","lift":3},{"id":"d","t":"At home, the fur returns to its box, and she hears “something crying.”","lift":4}],"_a":"bxdUExoVW0YYF1YTGhVdRmk=","setup":["d","c","a","b"],"dFirst":"Opening with the ending gives away your strongest evidence.","cBeforeB":"The couple can’t break an illusion the reader hasn’t seen built.","general":"Build the illusion before it breaks, and save the strongest moment for last."},"tc3":{"par":2,"_a":"Bg==","sentFb":["Sentence 1 is the claim the others must serve.","Sentence 2 is evidence: it quotes the boy.","","Sentence 4 is evidence too: the girl’s joke about the fur.","Sentence 5 is the link back to the claim, so it belongs."],"repairs":[{"id":"A","t":"Cut sentence 3.","_n":"14a1c","_k":"d3fc1ea9"},{"id":"B","t":"Replace it with “Their laughter comes from exactly the kind of young couple she had imagined as fellow actors.”","_n":"159ec","_k":"16d267b4"},{"id":"C","t":"Move sentence 3 to the start.","fb":"Moving an off-topic sentence doesn’t make it serve the claim.","_n":"169fc","_k":"d86df11f"},{"id":"D","t":"Add more biography.","fb":"Biography isn’t evidence for this claim.","_n":"179cc","_k":"c64ea6d7"}],"replaceWith":"Their laughter comes from exactly the kind of young couple she had imagined as fellow actors."}},"part3":{"slug":"revision","name":"Re-seeing","heading":"Revision is re-seeing","intro":"Explore showed revision happening to someone else. Now you do it: three deliberate passes on one paragraph, watching what each pass lets the paragraph \u003cem>do\u003c/em> for a reader.","re":{"intro":"The model paragraph below is original and deliberately flawed. Revise it in three passes: focus first, then evidence and analysis, then sentences.","sents":[{"t":"In “Miss Brill” by Katherine Mansfield there is a lady named Miss Brill.","_a":"FkZAXFtWSx0W"},{"t":"She goes to the park every Sunday.","_a":"FkZAXFtWSx0W"},{"t":"She likes to listen to the band and watch the people.","_a":"FkZAXFtWSx0W"},{"t":"She has a fur that she takes out of a box.","_a":"FkZAXFtWSx0W"},{"t":"“Dear little thing!”","_a":"FlBDWFJSVwdRFw=="},{"t":"Then there is a couple who say mean things about her and her fur.","_a":"FkZAXFtWSx0W"},{"t":"She goes home sad and puts the fur away.","_a":"FkZAXFtWSx0W"},{"t":"This shows that Miss Brill is lonely and that is very sad.","_a":"FkVaWFhDGw=="},{"t":"Loneliness is a big problem for old people today and many people feel this way.","_a":"FlpTVxQ="},{"t":"Mansfield shows loneliness in a really interesting way in this story that makes the reader think about loneliness.","_a":"FllcX10V"}],"claims":[{"id":"c1","t":"Mansfield uses the fur to show loneliness disguised as delight","fb":"A claim about how the story works, and how it shows it.","_n":"189dc","_k":"61cd0254"},{"id":"c2","t":"Miss Brill is a story about a woman","fb":"A topic names a subject. A thesis makes a claim someone could disagree with, and says how the text shows it.","_n":"199ac","_k":"a2c38acf"},{"id":"c3","t":"Old people are lonely","fb":"That claim is about society, not about how the story works.","_n":"1a9bc","_k":"94571dd8"}],"fb":{"summary":"Sentence {n} retells the plot. Your reader has read the story. Tell them what it \u003cem>means\u003c/em> and \u003cem>how\u003c/em> the writing makes that meaning.","off":"Sentence 9 generalizes beyond the text. The claim is about how the story works, not about society in general.","offRewrite":"Sentence 9 leaves the story behind; no rewrite will put it back. Cut it.","evidence":"Sentence 5 is the paragraph’s only evidence. Keep it: Pass 2 will introduce and explain it.","noClaim":"Choose a claim first (or write one): every sentence you keep has to serve it.","ownClaim":"Your claim needs at least 8 words, and it should make a claim rather than announce a topic.","done":"Pass 1 done. Every sentence left serves one claim."},"sig":["Miss Brill greets her fur as if it were a pet,","Mansfield writes,","the narrator, close to Miss Brill’s thoughts, exclaims"],"quote":"“Dear little thing!”","quotePar":1,"ana":[{"t":"The affectionate exclamation shows she lavishes on an object the tenderness she has no one else to give.","fb":"It explains what the words do and why it matters.","_n":"1ba8c","_k":"712a9b5e"},{"t":"This quote is about the fur.","fb":"That names what the quotation is about. Say what its words do.","_n":"1ca9c","_k":"3d566815"},{"t":"This is a nice quote.","fb":"Praise isn’t analysis. What do the words reveal?","_n":"1da6c","_k":"ad909f15"}],"fb2":{"sig":"Choose a signal phrase to introduce the quotation.","cite":"Add the citation with the builder: the quotation needs a paragraph number.","wrongPar":"Check the story: “Dear little thing!” is in paragraph 1.","ana":"Choose the sentence that explains what the quotation’s words do.","done":"Pass 2 done. The quotation is introduced, cited and explained."},"labs":[{"id":"L3","of":"claim","label":"Your claim","segs":[{"k":"open","opts":[{"t":""},{"t":"In “Miss Brill,” ","why":"names the story"}]},{"t":"Mansfield uses the fur to "},{"k":"verb","opts":[{"t":"show"},{"t":"reveal","why":"a stronger verb"}]},{"t":" loneliness disguised as delight."}]},{"id":"L1","of":7,"label":"Sentence 8","segs":[{"k":"verb","opts":[{"t":"This shows"},{"t":"This reveals","why":"a stronger verb"}]},{"t":" that Miss Brill is lonely"},{"k":"tail","opts":[{"t":" and that is very sad."},{"t":".","why":"cut the dead words “and that is very sad”"}]}]},{"id":"L2","of":9,"label":"Sentence 10","segs":[{"k":"verb","opts":[{"t":"Mansfield shows loneliness"},{"t":"Mansfield reveals loneliness","why":"a stronger verb"},{"t":"Mansfield disguises loneliness as delight","why":"a stronger verb that names the claim"}]},{"k":"mid","opts":[{"t":" in a really interesting way in this story"},{"t":"","why":"cut the dead words “really interesting” and “in this story”"}]},{"k":"end","opts":[{"t":" that makes the reader think about loneliness."},{"t":", so readers see what Miss Brill cannot admit: a fur is her only company.","why":"end on the key word"}]}]}],"strong":{"company":"strong","lonely":"strong","delight":"strong","give":"strong","loneliness":"weak: it repeats the subject","sad":"weak: vague","way":"weak: vague"},"deadWords":["really","very"],"thereIs":["there is","there are"]},"quickCheck":{"title":"Revision is re-seeing quick check","summary":"Revision is re-seeing quick check","items":[{"id":"q1","goal":4,"prompt":"Which pass should come first?","right":"Right. Settle what you’re claiming before you polish how you say it.","wrong":"Settle what you’re claiming before you polish how you say it.","choices":[{"t":"Formatting","_n":"1ea5c","_k":"d63ff6df"},{"t":"Sentences","_n":"1fa8c","_k":"d97a7b35"},{"t":"Focus","_n":"1ga7c","_k":"95d27a60"},{"t":"Spelling","_n":"1haac","_k":"3c0c895a"}]},{"id":"q2","goal":5,"prompt":"A paragraph has a perfect quotation with no explanation after it. Which pass fixes this?","right":"Right. A quotation needs your explanation of what its words do.","wrong":"A quotation needs your explanation of what its words do.","choices":[{"t":"None needed","_n":"1ia9c","_k":"e879023f"},{"t":"Evidence and analysis","_n":"1jacc","_k":"90b14639"},{"t":"Sentences","_n":"1kabc","_k":"de5c05aa"},{"t":"Focus","_n":"1l9ec","_k":"2af77e5a"}]},{"id":"q3","goal":5,"prompt":"“Loneliness is a big problem for old people today.” Why cut it from a paragraph on “Miss Brill”?","right":"Right. The claim is about how the story works, not about society in general.","wrong":"The claim is about how the story works, not about society in general.","choices":[{"t":"It uses a quotation","_n":"1m9dc","_k":"8760fd76"},{"t":"It’s too short","_n":"1n14c","_k":"35dcaa51"},{"t":"It has a spelling error","_n":"1o15c","_k":"3221fffd"},{"t":"It generalizes beyond the text","_n":"1p16c","_k":"e18ab0b6"}]},{"id":"q4","goal":4,"prompt":"Which change is lower-order?","right":"Right. A sharper word is sentence-level polish.","wrong":"A sharper word is sentence-level polish.","choices":[{"t":"Reordering paragraphs","_n":"1q17c","_k":"74df8855"},{"t":"Changing the claim","_n":"1r18c","_k":"4bd08971"},{"t":"Cutting summary","_n":"1s19c","_k":"db2090f5"},{"t":"Replacing “really sad” with “forlorn”","_n":"1t1ac","_k":"06276829"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class=\"wp-steal\">“Although it was so brilliantly fine—the blue sky powdered with gold and great spots of light like white wine splashed over the Jardins Publiques—Miss Brill was glad that she had decided on her fur.”\u003c/p>\u003cp class=\"eng-cite\">(Mansfield, par. 1)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> a subordinate clause (“Although it was…”) → a dash-framed image that pauses the sentence to paint the world → the main clause, with the character’s small, telling decision.\u003c/p>\u003cp>\u003cstrong>The challenge:\u003c/strong> Write one sentence about an ordinary moment in your own week with the same shape: \u003cem>Although\u003c/em> + condition, a dash, an image, a dash, then someone’s small decision.\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “Although the bus was already twenty minutes late—the shelter glass fogged with breath and a paper cup rolling in slow circles at the curb—Daniyar was glad he had brou
