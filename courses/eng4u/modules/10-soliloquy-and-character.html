*{transition:none!important;animation:none!important}

--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}

--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);

/* ENG4U 10 Soliloquy & Character. Tokens only; module classes prefixed sq- / sqh- / ds-. */
/* radio groups (copied from ENG4U 03) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}

.sq-hw[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.sq-hw.glow{box-shadow:inset 0 -3px 0 var(--an-syntax);background:var(--an-syntax-soft)}
.sq-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sq-cc{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;min-width:0}
.sq-cc.hl{border-color:var(--pen)}
.sq-cc h4{margin:0 0 6px;font-size:.98rem}
.sq-q{font:400 1rem/1.35 var(--font-math);margin:0 0 6px;max-width:none}
.sq-q .tiny{font-family:var(--font-ui);display:block}
.sq-vow{display:flex;gap:6px;margin:0 0 6px}
.sq-grey{opacity:.4;text-decoration:line-through}
.sq-st{margin-top:6px}

/* Part 3 */
.sq-h{font-size:1.02rem;margin:18px 0 4px}
.sq-meter{margin:6px 0 0;padding-left:1.4em;font:400 .98rem/1.5 var(--font-math)}
.sq-meter .tag{font-family:var(--font-ui)}
.sq-craft{margin-top:10px}
.sq-cmrow{border-left:4px solid var(--an-figure);background:var(--paper);border-radius:0 6px 6px 0;padding:6px 10px;margin:0 0 8px}
.sq-cmrow p{margin:0 0 4px;max-width:none}
.sq-cms{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sq-cms .txtin{flex:1 1 12em;min-width:0}
.steal-line{font:400 1.45rem/1.3 var(--font-math);margin:0 0 2px}

/* practice: scan and interpret */
.sq-stap{margin:4px 0 6px}

/* task: delivery score */
#task .design{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.ds-txt{border-left:3px solid var(--rule);padding-left:4px;margin:8px 0}
.ds-l{display:flex;flex-wrap:wrap;align-items:center}
.ds-l .sq-n{min-width:2.6em}
.ds-w{border:1.5px solid transparent;background:transparent;color:var(--ink);border-radius:5px;font:400 1.08rem/1.3 var(--font-math);padding:.05em .1em;min-height:34px;min-width:24px}
.ds-w:hover{border-color:var(--rule)}
.ds-w.em{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;font-weight:700}
.ds-w.q{background:var(--hi-soft)}
.ds-g{border:0;background:transparent;color:var(--pen);font:700 1rem var(--font-ui);min-width:9px;min-height:34px;padding:0 1px;border-radius:4px}
.ds-g:hover,.ds-g:focus-visible{background:var(--paper)}
.ds-g.on{min-width:20px;background:var(--info-bg)}
.ds-tl{padding-left:1.3em;margin:6px 0}
.ds-tl li{margin:0 0 6px}
.ds-tl .chip{margin-left:6px}
.sq-model{border-left:4px solid var(--an-theme);padding:4px 10px;margin:8px 0}
.sq-model h5{margin:0 0 4px;font-size:.95rem}
.sq-ctag{font:700 .75rem var(--font-ui);color:var(--an-theme)}

@media (max-width:820px){
  .sq-body{grid-template-columns:minmax(0,1fr)}
  .sq-read{border-left:0;padding-left:0;border-top:1.5px dashed var(--rule);padding-top:12px;position:static}
  .sq-cards{grid-template-columns:minmax(0,1fr)}
  #task .design{grid-template-columns:minmax(0,1fr)}
  .rg-lab{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  .sqh-wob.lit::before,.sqh-wave .sqh-wv,.sq-arc .sq-hang::after{animation:none}
  .sq-card{transition:none}
}

<script>window.MV_PAYLOAD={"meta":{"id":"10-soliloquy-and-character","nn":"10","slug":"soliloquy-and-character","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 2","groupName":"Shakespearean Tragedy, Hamlet","trivium":"Grammar, Rhetoric","size":"L","storageKey":"eng4u-10-soliloquy-and-character-v1","progressKey":"eng4u-progress-v1:10-soliloquy-and-character","toolkit":"1.0.8"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"0b46b3f2","content":{"id":"10-soliloquy-and-character","kind":"topic","title":"Soliloquy and character","topic":"Soliloquy & Character","readyTopic":"Hamlet’s soliloquies","hero":{"headline":"A soliloquy is a mind thinking out loud, in verse.","text":"Alone on stage, a character speaks only to us. In a \u003cstrong>soliloquy\u003c/strong> we hear thought in motion: questions that don’t get answered, images that take over, a rhythm that stumbles or drags. Learn to hear the \u003cstrong>metre\u003c/strong>, track the \u003cstrong>pronouns\u003c/strong> and follow the \u003cstrong>turns\u003c/strong>, and Hamlet will let you inside his head.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later.\u003c/p>\u003cp class='sq-support' role='note'>These speeches think about death and despair. If any of it weighs on you, talk to someone you trust, or contact Kids Help Phone: \u003cspan class='sq-nw'>1-800-668-6868\u003c/span>, or text CONNECT to \u003cspan class='sq-nw'>686868\u003c/span>.","fig":{"html":"\u003cdiv class='sq-hero' id='sq-hero' role='group' aria-label='Hamlet 3.1, lines 56 to 60, read aloud with stress marks settling over the syllables: an accent over each stressed syllable, a breve over each light one.'>\u003c/div>","caption":""},"lines":[{"t":"To be, or not to be: that is the ques·tion:","m":[2,4,6,7,10]},{"t":"Whe·ther ’tis no·bler in the mind to suf·fer","m":[1,4,6,8,10]},{"t":"The slings and ar·rows of out·ra·geous for·tune,","m":[2,4,8,10]},{"t":"Or to take arms a·gainst a sea of trou·bles,","m":[3,4,6,8,10],"wave":[8,11]},{"t":"And by op·pos·ing end them?","m":[4,6]}],"cite":"\u003ci>Hamlet\u003c/i> 3.1.56–60","caption":"Hear where the voice leans. That’s where the meaning is.","listen":"Listen","watch":"Watch again","noVoice":"Read it aloud yourself, tapping the beat."},"goals":["I can explain what a soliloquy does, and how it differs from an aside or a monologue.","I can scan a line of iambic pentameter and explain what a variation (feminine ending, inversion, spondee) does.","I can track pronouns, questions and imagery to infer a speaker’s state of mind.","I can compare Hamlet’s soliloquies to describe how his character changes.","I can use vocal choices (pause, stress, pace) to interpret a soliloquy aloud.","I can write a short soliloquy, or a respectful parody, that uses the form’s devices for a purpose."],"start":{"blocks":[{"title":"Word story: soliloquy","html":"\u003cp>\u003cstrong>\u003cem>Soliloquy\u003c/em>\u003c/strong> comes from Late Latin \u003cem>soliloquium\u003c/em>, from \u003cem>solus\u003c/em> (“alone”) and \u003cem>loqui\u003c/em> (“to speak”): speaking alone. The word seems to have been coined by St Augustine around 386 CE for a book of conversations with himself. Hamlet’s soliloquies may be the most famous conversations anyone has ever had alone.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Stress and metre","goal":2,"prompt":"Which word is stressed like an \u003cstrong>iamb\u003c/strong> (da-DUM)?","options":[{"t":"today","why":"to-DAY: light, then strong.","_n":"0ee6","_k":"cdf43055"},{"t":"garden","why":"GAR-den: strong, then light. That’s a trochee.","_n":"1eb6","_k":"0421f1b8"},{"t":"Hamlet","why":"HAM-let is also a trochee.","_n":"2ec6","_k":"d24af342"},{"t":"melody","why":"MEL-o-dy is strong, light, light.","_n":"3f16","_k":"2b2890b0"}],"hints":["Say each word and tap the beat.","Which one leans on its \u003cem>second\u003c/em> syllable?","to-DAY."]},{"id":"w2","skill":"Stress and metre","goal":2,"prompt":"A regular line of iambic pentameter (ending on a stressed syllable) has how many syllables?","options":[{"t":"5","why":"Five \u003cem>feet\u003c/em>, ten syllables.","_n":"4f26","_k":"47fa5400"},{"t":"10","why":"Five iambs × 2 syllables.","_n":"5ef6","_k":"9f60b63b"},{"t":"11","why":"An extra unstressed syllable makes 11, but that’s a variation.","_n":"6f06","_k":"3b4a5420"},{"t":"14","why":"That’s the number of lines in a sonnet.","_n":"7f56","_k":"66965d00"}],"hints":["Penta = 5 feet.","Each iamb has 2 syllables.","10."]},{"id":"w3","skill":"Drama devices","goal":1,"prompt":"In 3.1, while Polonius talks, Claudius says, “How smart a lash that speech doth give my conscience!” (\u003ci>Hamlet\u003c/i> 3.1.50), and the others don’t hear him. This is…","options":[{"t":"a dialogue","why":"No one answers him.","_n":"8f66","_k":"7e1c7940"},{"t":"a soliloquy","why":"A soliloquy needs the speaker alone.","_n":"939b","_k":"a2f90741"},{"t":"a monologue","why":"A monologue has listeners on stage.","_n":"a38b","_k":"6ba904e4"},{"t":"an aside","why":"Others are on stage; the line is for us.","_n":"b3bb","_k":"34e737d2"}],"hints":["Is he alone?","Do the others hear?","An aside."]},{"id":"w4","skill":"Drama devices","goal":3,"prompt":"A \u003cstrong>rhetorical question\u003c/strong> is…","options":[{"t":"a question with no question mark","why":"Punctuation isn’t the test.","_n":"c3ab","_k":"7728febf"},{"t":"a question asked for effect, not to get an answer","why":"It makes the listener think the answer.","_n":"d3db","_k":"22621dc6"},{"t":"any question in a play","why":"Some questions want answers.","_n":"e3cb","_k":"2afed1df"},{"t":"a question the audience must shout back","why":"No.","_n":"f3fb","_k":"86eec225"}],"hints":["Who’s expected to answer?","No one.","Asked for effect."]},{"id":"w5","skill":"Inference from language","goal":3,"prompt":"Macbeth says, “To-morrow, and to-morrow, and to-morrow, / Creeps in this petty pace from day to day” (\u003ci>Macbeth\u003c/i> 5.5.19–20). Which inference is best supported?","options":[{"t":"He’s planning a schedule","why":"It’s despair, not a calendar.","_n":"g3eb","_k":"f6ea017f"},{"t":"He’s excited about the future","why":"“Creeps” and “petty” aren’t excitement.","_n":"h31b","_k":"caf9fea4"},{"t":"He likes repetition","why":"The repetition is a device, not a preference.","_n":"i30b","_k":"6038a4f4"},{"t":"Time feels endless, slow and empty to him","why":"Repetition plus “creeps” and “petty” make time drag.","_n":"ja7b","_k":"81ce36e9"}],"hints":["Which verb describes time’s movement?","“Creeps”.","Endless and empty."]},{"id":"w6","skill":"Inference from language","goal":4,"prompt":"Which sentence is \u003cstrong>analysis\u003c/strong>, not summary?","options":[{"t":"“Hamlet talks about whether to live or die.”","why":"That’s what happens, not what it shows.","_n":"ka8b","_k":"a521a1b4"},{"t":"“Hamlet’s unanswered questions show a mind circling a decision it can’t make.”","why":"It explains what the language reveals.","_n":"la9b","_k":"a8e01ffd"},{"t":"“Then Ophelia enters.”","why":"Plot.","_n":"maab","_k":"ae0e5abb"},{"t":"“The speech is in Act 3.”","why":"A fact.","_n":"nabb","_k":"0b3e8033"}],"hints":["Look for “shows” or “reveals”.","Analysis links language to meaning.","“Hamlet’s unanswered questions show a mind circling a decision it can’t make.”"]}],"refreshers":{"Stress and metre":"An iamb is da-DUM. Five iambs make pentameter: 10 syllables. Variations (an extra light syllable at the end, a reversed first foot, two strong beats together) are choices with effects.","Drama devices":"Soliloquy: alone, to us. Aside: unheard by others on stage. Monologue: a long speech with listeners. A rhetorical question wants thought, not an answer.","Inference from language":"Ask what the words \u003cem>do\u003c/em>: repeat, question, picture, shift pronouns. Then say what that shows."}}},"explore":{"heading":"Soliloquy studio","intro":"Scan it, track it, map it, compare it. Four ways of listening to a mind.","modes":[{"id":"scan","t":"Scan"},{"id":"track","t":"Track"},{"id":"map","t":"Map"},{"id":"compare","t":"Compare"}],"sols":[{"id":"s12","lines":["O, that this too too so·lid flesh would melt,","Thaw and re·solve it·self in·to a dew!","Or that the Ev·er·last·ing had not fix’d","His ca·non ’gainst self-slaugh·ter! O God! God!","How wea·ry, stale, flat and un·prof·it·a·ble,","Seem to me all the u·ses of this world!","Fie on’t! ah fie! ’tis an un·weed·ed gar·den,","That grows to seed; things rank and gross in na·ture","Pos·sess it mere·ly. That it should come to this!","But two months dead: nay, not so much, not two:","So ex·cel·lent a king; that was, to this,","Hy·pe·ri·on to a sat·yr; so lov·ing to my moth·er","That he might not be·teem the winds of heav·en","Vis·it her face too rough·ly. Heav·en and earth!","Must I re·mem·ber? why, she would hang on him,","As if in·crease of ap·pe·tite had grown","By what it fed on: and yet, with·in a month—","Let me not think on’t—Frail·ty, thy name is wo·man!—","A lit·tle month, or ere those shoes were old","With which she fol·low’d my poor fa·ther’s bod·y,","Like Ni·o·be, all tears:—why she, e·ven she—","O God! a beast, that wants dis·course of rea·son,","Would have mourn’d lon·ger—mar·ried with my un·cle,","My fa·ther’s broth·er, but no more like my fa·ther","Than I to Her·cu·les: with·in a month:","Ere yet the salt of most un·right·eous tears","Had left the flush·ing in her gall·ed eyes,","She mar·ried. O, most wick·ed speed, to post","With such dex·ter·i·ty to in·ces·tu·ous sheets!","It is not nor it can·not come to good:","But break, my heart; for I must hold my tongue."],"act":"1.2","start":129,"label":"1.2 “O, that this too too solid flesh would melt”","close":"But break, my heart; for I must hold my tongue."},{"id":"s22","lines":["O, what a rogue and pea·sant slave am I!","Is it not mon·strous that this play·er here,","But in a fic·tion, in a dream of pas·sion,","Could force his soul so to his own con·ceit","That from her work·ing all his vi·sage wann’d,","Tears in his eyes, dis·trac·tion in’s as·pect,","A bro·ken voice, and his whole func·tion suit·ing","With forms to his con·ceit? and all for noth·ing!","For He·cu·ba!","What’s He·cu·ba to him, or he to He·cu·ba,","That he should weep for her? What would he do,","Had he the mo·tive and the cue for pas·sion","That I have? He would drown the stage with tears","And cleave the gen·er·al ear with hor·rid speech,","Make mad the guil·ty and ap·pal the free,","Con·found the ig·no·rant, and a·maze in·deed","The ver·y fac·ul·ties of eyes and ears.","Yet I,","A dull and mud·dy-met·tled ras·cal, peak,","Like John-a-dreams, un·preg·nant of my cause,","And can say noth·ing; no, not for a king,","U·pon whose prop·er·ty and most dear life","A damn’d de·feat was made. Am I a cow·ard?","Who calls me vil·lain? breaks my pate a·cross?","Plucks off my beard, and blows it in my face?","Tweaks me by the nose? gives me the lie i’ the throat,","As deep as to the lungs? who does me this?","Ha!","’Swounds, I should take it: for it can·not be","But I am pi·geon-li·ver’d and lack gall","To make op·pres·sion bit·ter, or ere this","I should have fat·ted all the re·gion kites","With this slave’s of·fal: blood·y, baw·dy vil·lain!","Re·morse·less, treach·er·ous, lech·er·ous, kind·less vil·lain!","O, ven·geance!","Why, what an ass am I! This is most brave,","That I, the son of a dear fa·ther mur·der’d,","Prompt·ed to my re·venge by heav·en and hell,","Must, like a whore, un·pack my heart with words,","And fall a-curs·ing, like a ver·y drab,","A scul·lion!","Fie u·pon’t! foh! A·bout, my brain! I have heard","That guil·ty crea·tures sit·ting at a play","Have by the ver·y cun·ning of the scene","Been struck so to the soul that pres·ent·ly","They have pro·claim’d their mal·e·fac·tions;","For mur·der, though it have no tongue, will speak","With most mi·rac·u·lous or·gan. I’ll have these play·ers","Play some·thing like the mur·der of my fa·ther","Be·fore mine un·cle: I’ll ob·serve his looks;","I’ll tent him to the quick: if he but blench,","I know my course. The spir·it that I have seen","May be the dev·il: and the dev·il hath pow·er","To as·sume a pleas·ing shape; yea, and per·haps","Out of my weak·ness and my mel·an·chol·y,","As he is ver·y po·tent with such spir·its,","A·bu·ses me to damn me: I’ll have grounds","More rel·a·tive than this: the play’s the thing","Where·in I’ll catch the con·science of the king."],"act":"2.2","start":576,"label":"2.2 “O, what a rogue and peasant slave am I!”","close":"the play’s the thing / Wherein I’ll catch the conscience of the king."},{"id":"s31","lines":["To be, or not to be: that is the ques·tion:","Whe·ther ’tis no·bler in the mind to suf·fer","The slings and ar·rows of out·ra·geous for·tune,","Or to take arms a·gainst a sea of trou·bles,","And by op·pos·ing end them? To die: to sleep;","No more; and by a sleep to say we end","The heart-ache and the thou·sand nat·u·ral shocks","That flesh is heir to, ’tis a con·sum·ma·tion","De·vout·ly to be wish’d. To die, to sleep;","To sleep: per·chance to dream: ay, there’s the rub;","For in that sleep of death what dreams may come","When we have shuf·fled off this mor·tal coil,","Must give us pause: there’s the re·spect","That makes ca·lam·i·ty of so long life;","For who would bear the whips and scorns of time,","The op·pres·sor’s wrong, the proud man’s con·tu·me·ly,","The pangs of de·spis·ed love, the law’s de·lay,","The in·so·lence of of·fice and the spurns","That pa·tient mer·it of the un·wor·thy takes,","When he him·self might his qui·e·tus make","With a bare bod·kin? who would far·dels bear,","To grunt and sweat un·der a wea·ry life,","But that the dread of some·thing af·ter death,","The un·dis·cov·er’d coun·try from whose bourn","No trav·el·ler re·turns, puz·zles the will","And makes us ra·ther bear those ills we have","Than fly to oth·ers that we know not of?","Thus con·science does make cow·ards of us all;","And thus the na·tive hue of res·o·lu·tion","Is sick·lied o’er with the pale cast of thought,","And en·ter·pris·es of great pitch and mo·ment","With this re·gard their cur·rents turn a·wry,","And lose the name of ac·tion.—Soft you now!","The fair O·phe·li·a! Nymph, in thy or·i·sons","Be all my sins re·mem·ber’d."],"act":"3.1","start":56,"label":"3.1 “To be, or not to be”","close":"And lose the name of action.","end":88},{"id":"s44","lines":["How all oc·ca·sions do in·form a·gainst me,","And spur my dull re·venge! What is a man,","If his chief good and mar·ket of his time","Be but to sleep and feed? a beast, no more.","Sure, he that made us with such large dis·course,","Look·ing be·fore and af·ter, gave us not","That ca·pa·bil·i·ty and god-like rea·son","To fust in us un·used. Now, whe·ther it be","Bes·tial ob·liv·i·on, or some cra·ven scru·ple","Of think·ing too pre·cise·ly on the e·vent,","A thought which, quar·ter’d, hath but one part wis·dom","And ev·er three parts cow·ard, I do not know","Why yet I live to say ‘This thing’s to do;’","Sith I have cause and will and strength and means","To do’t. Ex·am·ples gross as earth ex·hort me:","Wit·ness this ar·my of such mass and charge","Led by a del·i·cate and ten·der prince,","Whose spir·it with di·vine am·bi·tion puff’d","Makes mouths at the in·vis·i·ble e·vent,","Ex·pos·ing what is mor·tal and un·sure","To all that for·tune, death and dan·ger dare,","E·ven for an egg-shell. Right·ly to be great","Is not to stir with·out great ar·gu·ment,","But great·ly to find quar·rel in a straw","When ho·nour’s at the stake. How stand I then,","That have a fa·ther kill’d, a moth·er stain’d,","Ex·cite·ments of my rea·son and my blood,","And let all sleep? while, to my shame, I see","The im·mi·nent death of twen·ty thou·sand men,","That, for a fan·ta·sy and trick of fame,","Go to their graves like beds, fight for a plot","Where·on the num·bers can·not try the cause,","Which is not tomb e·nough and con·ti·nent","To hide the slain? O, from this time forth,","My thoughts be blood·y, or be noth·ing worth!"],"act":"4.4","start":32,"label":"4.4 “How all occasions do inform against me”","close":"O, from this time forth, / My thoughts be bloody, or be nothing worth!"}],"credit":"William Shakespeare, \u003ci>Hamlet\u003c/i>, Globe edition (1864), public domain. Line numbers are the Globe’s.","keys":[{"id":"s31:0","name":"K-a","_a":"S0BGUxMRXGkCTgAaVB9XAm1OFlkSR0QIa1UYDj8fRF1eBxYMOQRKCm1OFlgHRQNAElhvB04ASgccWxgHU24b"},{"id":"s31:1","name":"K-b","_a":"S0BGUxMRXGkBTgAaWh9XAm1OFlkSR0QIa1RpGkBdA0RVEBYMOQFKARxXGAFOCkoDAT9J"},{"id":"s31:2","name":"K-c","_a":"S0BGUxMRXGkCTgAaWh9XAm1OFlkSR0QIa1RpGkBdA0RVEBYMOQJKARxXGAFOCkoDAT9J"},{"id":"s31:9","name":"K-d","_a":"S0BGUxMRXGkCTgAaVB9XAm1OFlkSR0QIa1UYDj8fRF5VA0dCQAk9BRxaaRpAXQNEVRAWDDkCSgEcVxgPP04="},{"id":"s12:4","name":"K-e","_a":"S0BGUxMRXGkCTgAaVx9ebxxAW0YWEVxpAVJpGkBdA0RVEBYMOQJKARxUGAFOCkoDAT9J"},{"id":"s22:0","name":"K-f","_a":"S0BGUxMRXGkETgIaWh9XAm1OFlkSR0QIa1MYBD8fRFxVFFFEQAk9ARxXGAFOCjtP"}],"whether":"Some actors run \u003cem>whether\u003c/em> together as one syllable (“whe’r”). This key uses two.","scanHow":"Tap a line to open it as syllable chips. Tap a chip to mark it stressed (´) or unstressed (˘); arrow keys move, Space marks.","noKey":"This line isn’t in the module’s key. Use your ear; the pattern readout shows how your marks read.","pron":{"i":["i","i’ll","i’m","i’ve","me","my","mine","myself"],"we":["we","us","our","ours","ourselves"],"he":["he","who","they","him","them","himself"]},"lenses":[{"id":"pron","label":"Pronouns","role":"syntax"},{"id":"ques","label":"Questions","role":"syntax"},{"id":"img","label":"Imagery","role":"image"}],"clusters":{"sleep":"sleep and dreams","war":"war and sea","journey":"journey and country","disease":"disease and colour"},"imagery":{"s12":{"disease":["too too solid flesh would melt","an unweeded garden","things rank and gross in nature","the flushing in her galled eyes"],"war":["Like Niobe, all tears"]},"s22":{"sleep":["in a dream of passion","Like John-a-dreams"],"disease":["all his visage wann’d","pigeon-liver’d and lack gall"],"war":["drown the stage with tears"]},"s31":{"sleep":["To die: to sleep","by a sleep","To die, to sleep","To sleep: perchance to dream","in that sleep of death what dreams may come"],"war":["The slings and arrows of outrageous fortune","take arms against a sea of troubles","by opposing end them"],"journey":["The undiscover’d country from whose bourn No traveller returns","fly to others"],"disease":["the native hue of resolution","sicklied o’er with the pale cast of thought"]},"s44":{"sleep":["to sleep and feed","let all sleep"],"disease":["To fust in us unused","My thoughts be bloody"],"war":["this army of such mass and charge","Go to their graves like beds"],"journey":["Looking before and after"]}},"cards":[{"id":"m1","t":"The question: suffer life’s blows, or fight and end them","ref":"3.1.56–60"},{"id":"m2","t":"Death imagined as sleep: “a consummation / Devoutly to be wish’d”","ref":"3.1.63–64"},{"id":"m3","t":"The snag: in that sleep, “what dreams may come”","ref":"3.1.65–66"},{"id":"m4","t":"Why anyone bears life’s injuries (“the whips and scorns of time”, “the law’s delay”) when a “bare bodkin” could end them","ref":"3.1.70–76"},{"id":"m5","t":"The dread of “something after death, / The undiscover’d country”","ref":"3.1.78–80"},{"id":"m6","t":"The conclusion: “conscience does make cowards of us all”, and thought sickens resolution","ref":"3.1.83–88"}],"jumble":[3,0,5,2,4,1],"hinge":11,"states":[{"id":"grief","t":"grief and disgust"},{"id":"reproach","t":"self-reproach"},{"id":"inquiry","t":"philosophical inquiry"},{"id":"resolve","t":"cold resolve"},{"id":"triumph","t":"triumph"},{"id":"content","t":"calm contentment"}],"stateKey":{"_a":"S0BHB1ARXBBXEF1TBBFKEENQBhRYERRXQBBbVwFbRB4SEQcHQAlEW14TQV8QSkQeEhEAAkAJREBVEVtaFFZETw=="},"arcLine":"1.2 grief → 2.2 self-reproach → 3.1 inquiry → 4.4 cold resolve","introBanner":"A speech about whether to live, and he never says “I”. Why?","noVoice":"Read it aloud yourself, tapping the beat.","aha":"Sound carries meaning. The light final syllable of “question” leaves the line hanging; the missing “I” keeps Hamlet’s own choice at a distance; “rub” is where the comfort of sleep snags on fear.","predIntro":"Make a prediction first. Then the studio shows you what happens.","predictions":[{"id":"p1","prompt":"The line ends on the light syllable “-tion” of “question”: 11 syllables instead of 10. What does this \u003cstrong>feminine ending\u003c/strong> do?","options":[{"t":"It leaves the line off-balance and unresolved, like the question itself","_n":"oacb","_k":"101c433c"},{"t":"It speeds the line up","_n":"padb","_k":"b7217dcf"},{"t":"It’s a mistake in counting","_n":"qaeb","_k":"0786c483"},{"t":"It makes the line cheerful","_n":"rafb","_k":"8731855b"}],"explain":"A line that ends on a strong beat sounds settled. This one trails off, as the decision does. Variation is meaning. The extra unstressed syllable in “question” leaves the line, like Hamlet, unresolved."},{"id":"p2","prompt":"Before you switch on the pronoun lens: in this speech about whether to go on living, will Hamlet say “I/me/my” more, or “we/us” more?","options":[{"t":"About the same","_n":"sb0b","_k":"2e0c0f0d"},{"t":"“We/us” more: he never says “I” in the speech proper","_n":"tadb","_k":"897e3e10"},{"t":"Neither appears","_n":"uacb","_k":"a9a3d791"},{"t":"“I” more","_n":"vabb","_k":"86217dfb"}],"explain":"He generalizes his pain into what everyone endures, which keeps his own choice at a distance. (7 we/us, 0 I/me/my; “my” appears only after “Soft you now! / The fair Ophelia!”)"},{"id":"p3","prompt":"“To die, to sleep; / To sleep: perchance to dream: ay, there’s the rub” (\u003ci>Hamlet\u003c/i> 3.1.64–65). What happens to the argument at “rub”?","options":[{"t":"It changes topic to Ophelia","_n":"waab","_k":"e89faee5"},{"t":"It turns: the comfort of death-as-sleep snags on the fear of what dreams may come","_n":"xb1b","_k":"6a37e848"},{"t":"It becomes a joke","_n":"yb0b","_k":"df5a1267"},{"t":"It ends: he has decided","_n":"zafb","_k":"c1754963"}],"explain":"A \u003cem>rub\u003c/em>, in the game of bowls, is an obstacle that knocks the ball off course. The thought hits one."},{"id":"p4","prompt":"4.4 ends: “O, from this time forth, / My thoughts be bloody, or be nothing worth!” (\u003ci>Hamlet\u003c/i> 4.4.65–66). Predict: does Hamlet vow to act, or to think?","options":[{"t":"To leave Denmark forever","_n":"10aeb","_k":"9a604dd5"},{"t":"To kill Claudius at once","_n":"11b5b","_k":"801ad995"},{"t":"To forgive Claudius","_n":"12b4b","_k":"47f42a03"},{"t":"To think bloody thoughts: even his vow is about thinking","_n":"13abc","_k":"965c2d91"}],"explain":"The resolve is real but still interior. Act 5 will test what it means. Listen to the vow: “My \u003cem>thoughts\u003c/em> be bloody.” Even his resolution is about thinking."}],"chalIntro":"Use the studio to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right speech and mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,5],"prompt":"\u003cstrong>Scan the most famous line in English.\u003c/strong> Mark the stresses in “To be, or not to be: that is the question:” (\u003ci>Hamlet\u003c/i> 3.1.56). \u003cbutton type='button' class='btn ghost sm sq-setup' data-setup='tc1'>Set it up\u003c/button>","why":"Both readings get the same credit: “THAT is” inverts foot 4; “that IS” keeps it regular. Either way, the light “-tion” trails off: a feminine ending.","msgs":{"e11":"Say it aloud: QUES-tion. The last syllable is light; that’s the feminine ending.","e1":"“To” is a light word. Let your voice lean on “be”.","both":"Choose where \u003cem>you\u003c/em> lean: “THAT is” or “that IS”. Either works, but not both.","general":"Say it naturally. Little words (to, the, of, and) are usually light; stresses fall where your voice leans."},"hints":["Tap the beat: da-DUM, da-DUM.","“be”, “not”, “be” and “ques-” are strong.","to BE or NOT to BE: THAT is (or that IS) the QUES-tion."]},{"id":"tc2","goal":3,"prompt":"\u003cstrong>Find Hamlet.\u003c/strong> In 3.1, from “To be, or not to be” through “And lose the name of action”, mark \u003cstrong>every\u003c/strong> first-person singular pronoun (I, me, my, mine, myself). If there are none, press \u003cstrong>None found\u003c/strong>. \u003cbutton type='button' class='btn ghost sm sq-setup' data-setup='tc2'>Set it up\u003c/button>","why":"Not one “I”. The most personal speech in English hides its speaker. Why might Hamlet need that distance?","msgs":{"we":"Those are first-person \u003cem>plural\u003c/em>. Look for “I”, “me”, “my”.","my":"That comes after he sees Ophelia, when the soliloquy is over. Stop at “the name of action”.","none":"Mark every I, me or my you find, or press None found if there are none.","other":"That word isn’t a first-person singular pronoun (I, me, my, mine, myself)."},"hints":["Switch on the pronoun lens.","Count I/me/my in the speech proper.","There are none: press “None found”."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"\u003cstrong>Rebuild the argument, then find the hinge.\u003c/strong> In Map mode, put the six move cards for 3.1 in order, then tap the one word where the argument turns. \u003cbutton type='button' class='btn ghost sm sq-setup' data-setup='tc3'>Set it up\u003c/button>","why":"The speech moves from the question, to death as sleep, to the snag of dreams, to why we bear life, to the dread of what comes after, to the conclusion. It turns on “rub”.","msgs":{"c32":"The fear of dreams only arrives once he has imagined death as sleep.","c6":"The conclusion comes last. He \u003cem>reaches\u003c/em> it; he doesn’t start there.","order":"Follow the speech line by line; each card quotes its lines.","question":"That opens the speech. Where does a comforting thought hit an obstacle?","noturn":"Now tap the one word where the argument turns.","word":"Not that word. Where does the comfort of sleep snag on something?"},"hints":["Follow the speech line by line; each card quotes its lines.","Sleep, then dreams, then why we bear life, then what we fear.","1–6 in order; the hinge is “rub”."]}],"blocks":[{"title":"Notes on the text","html":"\u003cp>Every soliloquy line is quoted from the Globe edition of \u003cem>Hamlet\u003c/em> (1864), with its line numbers. Your class edition may number lines a little differently, and its punctuation (and so its count of questions) may differ too.\u003c/p>\u003cp class='tiny muted'>The 4.4 soliloquy appears in the Second Quarto (1604) but not in the First Folio (1623).\u003c/p>"}]},"part3":{"slug":"write","name":"Write","heading":"Write a soliloquy","intro":"Writing one, rather than only reading them, is the surest way to learn the form’s moves. Choose a speaker at a choice, shape the speech, use the devices on purpose, and then say what each one \u003cem>does\u003c/em>.","studio":{"speakers":[{"id":"horatio","t":"Horatio, the night before the duel"},{"id":"gertrude","t":"Gertrude, alone after the closet scene (3.4)"},{"id":"laertes","t":"Laertes, on hearing of his father’s death"},{"id":"own","t":"A character of your own, at a choice"},{"id":"parody","t":"Parody: an everyday dilemma in Hamlet’s form (“To text, or not to text”)"}],"parody":"Parody Hamlet’s \u003cem>form\u003c/em>, not his despair. Choose an everyday dilemma, and keep the questions, the weighing and the turn. Please don’t make jokes about self-harm.","slots":[{"id":"open","t":"An opening question or image","p":"Start with the question the speaker can’t stop asking, or an image that won’t leave them."},{"id":"weigh","t":"Two options weighed against each other (antithesis)","p":"Set the two choices side by side, in parallel form."},{"id":"rub","t":"The snag: the “ay, there’s the rub” moment","p":"What complicates the easy option? Let the thought hit an obstacle."},{"id":"end","t":"An ending that either decides or suspends","p":"Decide, or leave the question hanging. Either way, choose it."}],"devices":["rhetorical question","antithesis","metaphor","repetition","apostrophe (speaking to someone or something absent)","a pronoun shift"],"lines":[10,16],"minDev":3,"metreNote":"Pentameter range"},"quickCheck":{"title":"Write: quick check","summary":"Write quick check","items":[{"id":"q1","goal":6,"prompt":"“O Death, why do you wait?” Addressing someone or something absent is…","choices":[{"t":"alliteration","fb":"Speaking \u003cem>to\u003c/em> an absent person or idea is apostrophe.","_n":"14acc","_k":"c61432f4"},{"t":"apostrophe","fb":"Right. Speaking \u003cem>to\u003c/em> an absent person or idea.","_n":"15a9c","_k":"9988289c"},{"t":"aside","fb":"Speaking \u003cem>to\u003c/em> an absent person or idea is apostrophe.","_n":"16aac","_k":"e4445e80"},{"t":"antithesis","fb":"Speaking \u003cem>to\u003c/em> an absent person or idea is apostrophe.","_n":"17afc","_k":"fcbe47f6"}]},{"id":"q2","goal":6,"prompt":"“To speak, or to stay silent” is an example of…","choices":[{"t":"repetition","fb":"Opposites balanced in parallel form: antithesis.","_n":"18b0c","_k":"d3a2576a"},{"t":"aside","fb":"Opposites balanced in parallel form: antithesis.","_n":"19adc","_k":"798d5806"},{"t":"antithesis","fb":"Right. Opposites balanced in parallel form.","_n":"1aaec","_k":"d6620f44"},{"t":"metaphor","fb":"Opposites balanced in parallel form: antithesis.","_n":"1bb3c","_k":"6ce09e1b"}]},{"id":"q3","goal":[6,3],"prompt":"The “rub” moment in your soliloquy should…","choices":[{"t":"announce the ending","fb":"It’s the snag that turns the thought. Track the turns: “ay, there’s the rub” is the moment the argument changes direction.","_n":"1cb4c","_k":"e3f0b8c5"},{"t":"repeat the opening","fb":"It’s the snag that turns the thought. Track the turns: “ay, there’s the rub” is the moment the argument changes direction.","_n":"1db1c","_k":"78dff677"},{"t":"complicate the easy option","fb":"Right. It’s the snag that turns the thought.","_n":"1eb0c","_k":"ee55c440"},{"t":"introduce a new character","fb":"It’s the snag that turns the thought. Track the turns: “ay, there’s the rub” is the moment the argument changes direction.","_n":"1fb3c","_k":"d055a917"}]},{"id":"q4","goal":6,"prompt":"A good parody of “To be, or not to be” keeps…","choices":[{"t":"its length in lines","fb":"Parody borrows the form to make something new.","_n":"1gb2c","_k":"dc5fccab"},{"t":"its subject of death","fb":"Parody borrows the form to make something new.","_n":"1hadc","_k":"efc42b93"},{"t":"the exact words","fb":"Parody borrows the form to make something new.","_n":"1iacc","_k":"fa0c3c65"},{"t":"its questions, weighing and turn","fb":"Right. Parody borrows the form to make something new.","_n":"1jafc","_k":"3e0981a4"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“Thus conscience does make cowards of us all”\u003c/p>\u003cp class='eng-cite'>(\u003ci>Hamlet\u003c/i> 3.1.83)\u003c/p>\u003cp>\u003cstrong>The pattern:\u003c/strong> “Thus [abstract noun] does make [plural noun] of us all.” A conclusion that sounds like a law of nature.\u003c/p>\u003cp>\u003cstrong>Example:\u003c/strong> “Thus comfort does make strangers of us all.”\u003c/p>\u003cp>Write your own, then save it to your Ars notebook. Keep the shape; change the content.\u003c/p>","prompt":"Your imitation"}]},"practice":{"activities":[{"id":"which","type":"match","title":"Which soliloquy?","summary":"Which soliloquy?","goal":[4,3],"reuse":true,"instruction":"Match each line to the soliloquy it comes from.","how":"Tap a line on the left, then tap the soliloquy it comes from. Each soliloquy has two lines.","leftTitle":"Line","rightTitle":"Soliloquy","left":[{"id":"l1","t":"“How weary, stale, flat and unprofitable, / Seem to me all the uses of this world!”"},{"id":"l2","t":"“Frailty, thy name is woman!”"},{"id":"l3","t":"“What’s Hecuba to him, or he to Hecuba, / That he should weep for her?”"},{"id":"l4","t":"“the play’s the thing / Wherein I’ll catch the conscience of the king.”"},{"id":"l5","t":"“The undiscover’d country from whose bourn / No traveller returns”"},{"id":"l6","t":"“Thus conscience does make cowards of us all”"},{"id":"l7","t":"“What is a man, / If his chief good and market of his time / Be but to sleep and feed? a beast, no more.”","hints":["What is he comparing humans to?","Beasts that only sleep and feed: a soldier-army has just passed.","4.4."]},{"id":"l8","t":"“O, from this time forth, / My thoughts be bloody, or be nothing worth!”"}],"right":[{"id":"r12","t":"1.2: “O, that this too too solid flesh would melt”"},{"id":"r22","t":"2.2: “O, what a rogue and peasant slave am I!”"},{"id":"r31","t":"3.1: “To be, or not to be”"},{"id":"r44","t":"4.4: “How all occasions do inform against me”"}],"_a":"S0BYB0AJREABUBYaQF9UEApARgdQEUoQXFEWDEBBVAASThZaVhFcEEJQBhROEQoHElgWRFECRB4SDgIUWBEUAQFAGBQOBEQIEhAAAkAfRF4IQA4UEAdSEE0=","wrong":{"l4|r44":"This line \u003cem>plans\u003c/em> a test; that’s 2.2, just after the players.","l6|r44":"“Cowards of us all” is 3.1’s general “we”. 4.4 says “my dull revenge”.","l2|r22":"His disgust at his mother’s marriage belongs to the first soliloquy, 1.2."},"wrongDefault":"Think about the moment: grief (1.2), the players (2.2), the general question (3.1), or Fortinbras’s army (4.4)."},{"id":"scan","type":"custom","title":"Scan and interpret","summary":"Scan and interpret","star":true,"goal":[2,3],"instruction":"Scan each line, then choose what its variation does.","how":"Step (a): tap the stressed syllables and press Check. Step (b): choose the effect. Lines 2 and 4 are unseen, from other plays.","items":[{"id":"v1","line":"O, what a rogue and pea·sant slave am I!","cite":"(\u003ci>Hamlet\u003c/i> 2.2.576)","key":"s22:0","effects":[{"t":"The line lands its final stress on “I”: the insult turns on himself","why":"The last beat falls on “I”.","_n":"1kaec","_k":"1d230de2"},{"t":"It’s just regular","why":"Notice \u003cem>which\u003c/em> word gets the last beat.","_n":"1lb9c","_k":"305bccf7"},{"t":"The extra syllables make it rush","why":"Count again: ten syllables, ending on a strong beat.","_n":"1mb8c","_k":"11038543"},{"t":"The stress on “rogue” aims the insult at the players","why":"Every insult here is aimed inward; listen to where the line ends.","_n":"1n3fb","_k":"96cfc72e"}]},{"id":"v2","line":"To-·mor·row, and to-·mor·row, and to-·mor·row,","cite":"(\u003ci>Macbeth\u003c/i> 5.5.19)","unseen":true,"_a":"S0BGUxMRXGkCTgIaUwM7HhINREJACT0GHFppGkBdA0RVEBYMOQJKARxXGAFOCkoDAT9J","hints":["Say “to-MOR-row”.","Each “tomorrow” has one strong beat.","Stressed: 2, 6, 10 (optionally “and” at 4 and 8)."],"effects":[{"t":"Repetition plus a feminine ending: time trails on and on","why":"Each day echoes the last and the line never lands.","_n":"1o40b","_k":"9d1dc02b"},{"t":"It’s fast and excited","why":"Light syllables pile up; it drags.","_n":"1p41b","_k":"249ae4d6"},{"t":"It’s a settled line that ends on a strong beat","why":"Say the last word: “to-MOR-row”. The line ends light.","_n":"1q42b","_k":"53288b44"},{"t":"The repetition is a counting mistake","why":"Variation is meaning. Repeating the word makes each day echo the last.","_n":"1r3bb","_k":"50e7f66e"}]},{"id":"v3","line":"How wea·ry, stale, flat and un·prof·it·a·ble,","cite":"(\u003ci>Hamlet\u003c/i> 1.2.133)","key":"s12:4","effects":[{"t":"Two strong beats together (“stale, flat”) slow the line, which enacts weariness","why":"Strong beats side by side take time to say.","_n":"1s3cb","_k":"d5e6c811"},{"t":"It’s a counting error","why":"Variation is meaning. Two stresses side by side make the voice slow down, the way weariness does.","_n":"1t3db","_k":"fcbcfb8a"},{"t":"The stresses speed it into excitement","why":"Strong beats side by side take longer to say.","_n":"1u3eb","_k":"b896ba82"},{"t":"It makes Hamlet sound calm and content","why":"“Weary, stale, flat” isn’t contentment; the rhythm drags.","_n":"1v37b","_k":"175c62e3"}]},{"id":"v4","line":"But, soft! what light through yon·der win·dow breaks?","cite":"(\u003ci>Romeo and Juliet\u003c/i> 2.2.2)","unseen":true,"_a":"S0BGUxMRXGkCTgAaVB9eHgFSaRpAXBZGElhvBT8fRFxVFFFEQAk9AxxXGAFOCjtP","effects":[{"t":"Steady, regular rhythm: hushed wonder, a held breath","why":"Five even beats, softly kept.","_n":"1w38b","_k":"44951f0a"},{"t":"It’s broken and anxious","why":"Listen: it’s nearly perfectly regular.","_n":"1x45c","_k":"a3fe2ed5"},{"t":"It ends on a light syllable, so the thought trails off","why":"“Breaks” takes the last beat: ten syllables, ending strong.","_n":"1y44c","_k":"0ba7adfd"},{"t":"Two stresses side by side make it drag","why":"At most “soft! what” pair up; the line runs smoothly.","_n":"1z43c","_k":"d88dc901"}]},{"id":"v5","line":"The slings and ar·rows of out·ra·geous for·tune,","cite":"(\u003ci>Hamlet\u003c/i> 3.1.58)","key":"s31:2","effects":[{"t":"The feminine ending lets “fortune” fall away, like a blow that lands","why":"The light “-tune” drops off the end of the line.","_n":"2042c","_k":"7c5e71f4"},{"t":"The line is too long","why":"Variation is meaning. The extra unstressed syllable in “question” leaves the line, like Hamlet, unresolved.","_n":"2141c","_k":"5e9048f1"},{"t":"It ends on a strong beat, so it sounds settled","why":"Say “FOR-tune”: the last syllable is light.","_n":"2240c","_k":"a176f76f"},{"t":"The stresses fall on the little words","why":"Say it naturally. Little words (to, the, of, and) are usually light; stresses fall where your voice leans.","_n":"233fc","_k":"05b0688d"}]},{"id":"v6","line":"To sleep: per·chance to dream: ay, there’s the rub;","cite":"(\u003ci>Hamlet\u003c/i> 3.1.65)","key":"s31:9","effects":[{"t":"Colons break the line into short steps; the stresses bunch on “ay, there’s” as the thought hits the snag","why":"The line stops, starts and catches on the snag.","_n":"243ec","_k":"1a1b596a"},{"t":"Smooth and flowing","why":"Count the stops.","_n":"253dc","_k":"928cb2e5"},{"t":"It has a feminine ending","why":"“Rub” is strong: ten syllables, ending on a beat.","_n":"263cc","_k":"8ca65495"},{"t":"It has no pauses at all","why":"Two colons and a comma: the line stops and starts.","_n":"2743c","_k":"d249c795"}]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Lachlan","goal":[3,2,4],"instruction":"Lachlan made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":3,"task":"Analyse how pronouns shape “To be, or not to be”.","steps":["In “To be, or not to be,” Hamlet weighs whether it is “nobler in the mind to suffer” or to fight (\u003ci>Hamlet\u003c/i> 3.1.57).","He repeatedly says “I”, showing that he is absorbed in his own pain.","This self-focus makes the speech feel like a private diary.","So the audience sees him as selfish."],"_a":"AQ==","stepFb":["Accurate quotation. Keep checking.","","Sentence 3 builds on sentence 2. The problem is earlier.","This follows from the mistake."],"fixes":[{"t":"Delete sentence 1.","why":"Sentence 1 is accurate.","_n":"2844c","_k":"64513885"},{"t":"“He says ‘I’ only twice.”","why":"Count again: none until “my sins”.","_n":"2941c","_k":"2542c999"},{"t":"“He never says ‘I’ in the speech proper. ‘We’ and ‘us’ generalize his pain into everyone’s, keeping his own decision at a distance.”","why":"That’s what the pronoun lens shows.","_n":"2a42c","_k":"c01bfb29"},{"t":"Sentence 2 is correct.","why":"He never says “I” in the speech proper. “We” and “us” turn his despair into everyone’s, which keeps his own choice at arm’s length.","_n":"2b3fc","_k":"af62fa4c"}],"hints":["Switch on the pronoun lens.","How many “I”s?","Replace sentence 2: he never says “I” in the speech proper; “we” and “us” generalize his pain."]},{"id":"e2","goal":2,"task":"Explain the metre of the first line.","steps":["“To be, or not to be: that is the question” has eleven syllables.","This is an error, since iambic pentameter must have ten.","Shakespeare probably miscounted the line.","Actors should cut a syllable to fix it."],"_a":"AQ==","stepFb":["Correct count.","","This follows from sentence 2.","This follows from sentence 2."],"fixes":[{"t":"“It’s trochaic tetrameter.”","why":"Wrong metre.","_n":"2c40c","_k":"90e66ca6"},{"t":"“The extra light syllable is a feminine ending. It leaves the line, like the question, unresolved.”","why":"Variation is meaning.","_n":"2d3dc","_k":"38ed815f"},{"t":"“The line has ten syllables.”","why":"Count again: 11.","_n":"2e3ec","_k":"fc148a54"},{"t":"Sentence 2 is correct.","why":"Variation is meaning. The extra unstressed syllable in “question” leaves the line, like Hamlet, unresolved.","_n":"2f3bc","_k":"4995b944"}],"hints":["Is variation a mistake?","What is an extra unstressed syllable at the end called?","Replace sentence 2: the extra light syllable is a feminine ending."]},{"id":"e3","goal":4,"task":"Analyse how the 2.2 soliloquy reveals Hamlet’s state of mind.","steps":["In his second soliloquy, Hamlet compares himself to the actor who weeps for Hecuba.","The actor sheds real tears for a fictional queen, “all for nothing” (\u003ci>Hamlet\u003c/i> 2.2.583).","Then Hamlet calls Claudius names, then calls himself names, and then decides to put on a play.","This shows he is angry."],"_a":"Ag==","stepFb":["Good context.","Accurate and well integrated.","","Vague, and it follows from the summary in sentence 3."],"fixes":[{"t":"Delete sentence 2.","why":"Sentence 2 is good evidence.","_n":"2g3cc","_k":"88c553b4"},{"t":"“His torrent of insults at Claudius (‘bloody, bawdy villain!’) swerves into self-mockery (‘Why, what an ass am I!’), showing that his rage has nowhere to go but words.”","why":"It names the swerve, quotes it, and says what it shows.","_n":"2h29d","_k":"aad4557c"},{"t":"Sentence 3 is correct.","why":"Retelling isn’t analysis. Name the device, quote it, and say what it shows about the speaker.","_n":"2i28d","_k":"2eac3cfb"},{"t":"Sentence 3 should list more events.","why":"More plot isn’t more analysis.","_n":"2j2bd","_k":"6ddc0e86"}],"hints":["Does sentence 3 explain, or retell?","Quote the insults and say what the swerve shows.","Replace sentence 3 with the insults, quoted, and what the swerve into self-mockery shows."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: the missing “I”, the “rub”, or the vow about “thoughts”? What does it change about how you see Hamlet?"},{"id":"j2","q":"In your own words: why might Shakespeare make a line “wrong” on purpose (a feminine ending, two stresses together)?"},{"id":"j3","q":"Explain to a friend how you would perform one soliloquy line, and why your pause goes where it goes."},{"id":"j4","q":"Writing your own soliloquy: what was hardest about building the “rub”? What would you try next time?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save the one line from any soliloquy that you’d want to remember in twenty years, and write why.\u003c/p>\u003cdiv id='sq-cp'>\u003c/div>"},{"title":"Read-aloud self-review (optional)","html":"\u003cp>Record one excerpt, play it back, and tick what you hear. The recording stays in this page’s memory for this session only. It is never saved or sent.\u003c/p>\u003cdiv id='sq-rec'>\u003c/div>"}],"art":{"intro":"Write one principle about how sound, pronouns or questions carry meaning in a speech. Add the line that taught you, and a line of your own that uses the principle.","placeholder":"Your principle, in one sentence","examples":["Whether ’tis nobler in the mind to suffer","O, what a rogue and peasant slave am I!","To sleep: perchance to dream: ay, there’s the rub;","My thoughts be bloody, or be nothing worth!"]},"artSamples":[{"p":"Watch what a speaker asks, not just what they say.","m":"“Whether ’tis nobler in the mind to suffer…” (\u003ci>Hamlet\u003c/i> 3.1.57)"},{"p":"Let the last beat fall on the word that hurts.","m":"“O, what a rogue and peasant slave am I!” (\u003ci>Hamlet\u003c/i> 2.2.576)"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which best defines a soliloquy?","options":[{"t":"A remark other characters on stage don’t hear","why":"That’s an aside. A soliloquy is spoken alone.","_n":"2k2ad","_k":"c72cbad0"},{"t":"A conversation between two characters","why":"That’s dialogue.","_n":"2l2dd","_k":"4e4cfd66"},{"t":"A long speech delivered to other characters","why":"That’s a monologue: it has listeners on stage.","_n":"2m2cd","_k":"cafc9344"},{"t":"A speech by a character alone on stage, thinking aloud for the audience","why":"Alone, thinking aloud, for us.","_n":"2n2fd","_k":"50f7c911"}]},"b":{"prompt":"In 3.1, Claudius says, “How smart a lash that speech doth give my conscience!” while Polonius is on stage but doesn’t hear. This is…","options":[{"t":"a monologue","why":"No one is meant to listen.","_n":"2o2ed","_k":"44735490"},{"t":"an aside","why":"Others are on stage, and they don’t hear it.","_n":"2p31d","_k":"8b900b03"},{"t":"a soliloquy","why":"He isn’t alone. A soliloquy is spoken alone; only the audience hears it.","_n":"2q30d","_k":"4e89fe58"},{"t":"a prologue","why":"Wrong position and purpose.","_n":"2rdf3","_k":"20745955"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"How many syllables does a line of iambic pentameter with a \u003cstrong>feminine ending\u003c/strong> have?","options":[{"t":"5","why":"Five is the number of feet, not syllables.","_n":"2sde3","_k":"5c7c33c3"},{"t":"10","why":"That’s the regular masculine line.","_n":"2tdd3","_k":"f75a0ef9"},{"t":"11","why":"Ten plus one extra unstressed syllable.","_n":"2udc3","_k":"56256db0"},{"t":"12","why":"That would be a hexameter (six feet).","_n":"2ve33","_k":"54cb799f"}]},"b":{"prompt":"In “The slings and arrows of outrageous fortune,” the final light syllable “-tune” is…","options":[{"t":"a feminine ending","why":"An extra light syllable at the line’s end.","_n":"2we23","_k":"e24d9180"},{"t":"a spondee","why":"A spondee is two stresses together.","_n":"2xe13","_k":"e682375f"},{"t":"a mistake","why":"Variation is meaning. The extra unstressed syllable in “question” leaves the line, like Hamlet, unresolved.","_n":"2ye03","_k":"83bdd37b"},{"t":"a trochaic inversion","why":"Inversion reverses a foot; this adds a syllable.","_n":"2zd73","_k":"e287a54c"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which pronouns does Hamlet use in “To be, or not to be” before he notices Ophelia?","options":[{"t":"We and us (and “who” and “he” for anyone), but never “I”","why":"Seven we/us, no I/me/my.","_n":"30d63","_k":"9e29a327"},{"t":"Mostly “I” and “me”","why":"He never says “I” in the speech proper. “We” and “us” turn his despair into everyone’s, which keeps his own choice at arm’s length.","_n":"31593","_k":"3d4ed985"},{"t":"Only “thou”","why":"He addresses no one directly.","_n":"325a3","_k":"2a51aeea"},{"t":"Only “she”","why":"Ophelia enters only at the end.","_n":"335b3","_k":"7fab7bb8"}]},"b":{"prompt":"Which image cluster runs through the middle of “To be, or not to be”?","options":[{"t":"Sleep and dreams","why":"“To die, to sleep… perchance to dream.”","_n":"345c3","_k":"ecd6833d"},{"t":"Animals and hunting","why":"Not in this speech.","_n":"355d3","_k":"f84d6aa4"},{"t":"Money and trade","why":"Not in this speech.","_n":"365e3","_k":"58a1fd42"},{"t":"Spring and flowers","why":"Not in this speech.","_n":"375f3","_k":"292cc608"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Macbeth: “Life’s but a walking shadow, a poor player / That struts and frets his hour upon the stage / And then is heard no more” (\u003ci>Macbeth\u003c/i> 5.5.24–26). What state of mind does the theatre imagery suggest?","options":[{"t":"He’s planning a play to catch a king","why":"That’s Hamlet in 2.2, not Macbeth.","_n":"38603","_k":"5e017560"},{"t":"Life now seems brief, hollow and meaningless to him: a performance that ends in silence","why":"“Walking shadow”, “poor player” and “heard no more” all empty life out.","_n":"39513","_k":"80989f02"},{"t":"He feels triumphant","why":"“Poor player” and “heard no more” aren’t triumph.","_n":"3a523","_k":"75f32a12"},{"t":"He has decided to become an actor","why":"That reads the image literally. The player is a metaphor for life.","_n":"3bcb3","_k":"f8407513"}]},"b":{"prompt":"Macbeth: “Is this a dagger which I see before me, / The handle toward my hand? Come, let me clutch thee” (\u003ci>Macbeth\u003c/i> 2.1.33–34). What does the opening question reveal?","options":[{"t":"His mind is unsettled: on the edge of murder, he doubts his own senses","why":"He questions what he sees.","_n":"3cca3","_k":"7f159b4a"},{"t":"He’s talking to Banquo","why":"He’s alone. A soliloquy is spoken alone.","_n":"3dcd3","_k":"c66f604f"},{"t":"He’s calm and certain","why":"A question shows doubt.","_n":"3ecc3","_k":"ff774535"},{"t":"He’s checking whether a servant left a dagger","why":"That reads it literally; the dagger is a vision.","_n":"3fcf3","_k":"64bb39f3"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"2.2 ends “The play’s the thing / Wherein I’ll catch the conscience of the king”; 4.4 ends “My thoughts be bloody, or be nothing worth!” Which comparison is best supported?","options":[{"t":"Both are about Ophelia","why":"Neither speech mentions her.","_n":"3gce3","_k":"7f05957d"},{"t":"Both end in resolution, but each resolves to something short of the deed: first a test, then thoughts","why":"A plan to test, then a vow about thoughts.","_n":"3hd13","_k":"01bf5484"},{"t":"4.4 shows Hamlet killing Claudius","why":"Listen to the vow: “My \u003cem>thoughts\u003c/em> be bloody.” Even his resolution is about thinking.","_n":"3id03","_k":"22a85857"},{"t":"2.2 shows no plan at all","why":"It ends with one: the play.","_n":"3jd33","_k":"6fa3dd07"}]},"b":{"prompt":"Compare 1.2 (“Or that the Everlasting had not fix’d / His canon ’gainst self-slaughter!”) with 3.1 (“To be, or not to be”). Which comparison is best supported?","options":[{"t":"1.2’s death-wish is personal and religious; 3.1 turns the same question into a general, philosophical one about “we” and “us”","why":"From God’s canon to what “we” endure.","_n":"3kd23","_k":"cc016bbc"},{"t":"1.2 is about revenge","why":"The Ghost hasn’t appeared yet.","_n":"3le53","_k":"7d1f8768"},{"t":"3.1 is more personal, full of “I”","why":"He never says “I” in the speech proper. “We” and “us” turn his despair into everyone’s, which keeps his own choice at arm’s length.","_n":"3me63","_k":"64de1f12"},{"t":"They’re unrelated","why":"Both weigh life against death.","_n":"3ne33","_k":"42a30ae0"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"In “How weary, stale, flat and unprofitable” (\u003ci>Hamlet\u003c/i> 1.2.133), two stressed syllables sit side by side (“stale, flat”). What effect does this have?","options":[{"t":"It speeds the line up","why":"Stresses side by side slow a line; they don’t speed it.","_n":"3oe43","_k":"5444a996"},{"t":"It makes the line cheerful","why":"“Weary, stale, flat” isn’t cheerful.","_n":"3pe13","_k":"e93635e0"},{"t":"It slows the line so its rhythm enacts weariness","why":"Two strong beats together take time to say.","_n":"3qe23","_k":"9d4d3f25"},{"t":"It’s an error","why":"Variation is meaning. The extra unstressed syllable in “question” leaves the line, like Hamlet, unresolved.","_n":"3rdf3","_k":"5ac7864a"}]},"b":{"prompt":"“To-morrow, and to-morrow, and to-morrow,” (\u003ci>Macbeth\u003c/i> 5.5.19) repeats a word and ends on a light syllable. What is the combined effect?","options":[{"t":"It sounds hopeful about the future","why":"The tone is weary, not hopeful.","_n":"3se03","_k":"f6a8288e"},{"t":"It’s a list of appointments","why":"That reads it literally.","_n":"3tdd3","_k":"d09df566"},{"t":"It’s regular and brisk","why":"The light ending and repetition make it drag.","_n":"3ude3","_k":"07a70736"},{"t":"Time drags: the repetition and the trailing ending make the days feel endless","why":"Each day echoes the last, and the line never lands.","_n":"3v574","_k":"5a01892e"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the strongest analytic sentence about “To be, or not to be”?","options":[{"t":"“By never saying ‘I’ and speaking instead of what ‘we’ and ‘us’ endure, Hamlet turns his private despair into a general question, keeping his own decision at arm’s length.”","why":"It names the device, gives evidence and says what it shows.","_n":"3w564","_k":"97a632a2"},{"t":"“Hamlet says ‘I’ constantly, showing selfishness.”","why":"He never says “I” in the speech proper. “We” and “us” turn his despair into everyone’s, which keeps his own choice at arm’s length.","_n":"3x554","_k":"55389741"},{"t":"“This speech is very famous and important.”","why":"Vague: it says nothing about the language.","_n":"3y544","_k":"8929ba8d"},{"t":"“Hamlet talks about life and death in this speech.”","why":"Retelling isn’t analysis. Name the device, quote it, and say what it shows about the speaker.","_n":"3z534","_k":"ffa17731"}]},"b":{"prompt":"Which is the strongest analytic sentence about 2.2?","options":[{"t":"“The insults hurled at Claudius (‘bloody, bawdy villain!’) swerve into self-mockery (‘Why, what an ass am I!’), showing that Hamlet’s rage, with no outlet in action, collapses back onto himself.”","why":"Quotation, device and meaning, together.","_n":"40524","_k":"87668080"},{"t":"“The speech has many words.”","why":"Irrelevant.","_n":"41514","_k":"1c576b2d"},{"t":"“Then he decides to put on a play.”","why":"Retelling isn’t analysis. Name the device, quote it, and say what it shows about the speaker.","_n":"42504","_k":"0c02c667"},{"t":"“Hamlet is angry in this speech.”","why":"Vague: name the device and quote it.","_n":"435f4","_k":"ae18ea2c"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"An actor wants “To be, or not to be” to sound like thought being discovered, not a speech recited. Which delivery note fits best?","options":[{"t":"“Pause after ‘To die, to sleep;’ as if the idea is new, then let ‘perchance to dream’ arrive more slowly as the snag appears.”","why":"The pause and the slowing let us hear the thought arrive.","_n":"445e4","_k":"ca71b95b"},{"t":"“Say the whole speech quickly with no pauses.”","why":"That contradicts the goal: no room for thought to happen.","_n":"45513","_k":"72724604"},{"t":"“Lecture the audience as if teaching them.”","why":"That’s recital, not discovery.","_n":"46523","_k":"55226b3c"},{"t":"“Shout every line to show strong emotion.”","why":"Undifferentiated: nothing changes, so nothing is discovered.","_n":"47533","_k":"ddf687f8"}]},"b":{"prompt":"In 2.2, how should “Why, what an ass am I!” be delivered after the string of insults at Claudius?","options":[{"t":"“Cut the line; it’s a joke.”","why":"That loses the turn.","_n":"48543","_k":"ff855c90"},{"t":"“Break the momentum with a sharp stop before it, so the self-mockery lands after the rage.”","why":"The stop marks the swerve.","_n":"494d3","_k":"395916a5"},{"t":"“Run it straight on at the same volume.”","why":"That loses the swerve.","_n":"4a4e3","_k":"288e0133"},{"t":"“Whisper the insults and shout this line.”","why":"That reverses the shape.","_n":"4b4f3","_k":"54f25aeb"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"A vlogger records a late-night video alone, talking through whether to quit their team. What makes it most like a soliloquy?","options":[{"t":"It has millions of viewers","why":"Audience size isn’t the point.","_n":"4c503","_k":"7028aaa3"},{"t":"Thinking aloud alone, with the audience as confidant, as the mind changes while speaking","why":"That’s the form, in a new medium.","_n":"4d593","_k":"505e2656"},{"t":"It uses a camera","why":"That’s the medium, not the form.","_n":"4e5a3","_k":"eef0ec84"},{"t":"It’s scripted by a team","why":"That’s the opposite of thinking aloud.","_n":"4f634","_k":"b2c80495"}]},"b":{"prompt":"In a stage musical, a character alone on stage sings through two choices and decides by the last verse. Why is this a modern soliloquy?","options":[{"t":"Because music is used","why":"That’s the medium, not the form.","_n":"4g624","_k":"b59f2101"},{"t":"Because other characters join in","why":"Then it isn’t a soliloquy: a soliloquy is spoken alone.","_n":"4h654","_k":"8bd6bfb5"},{"t":"Because it’s in a theatre","why":"The setting isn’t the test.","_n":"4i644","_k":"ae9fdcb9"},{"t":"A solitary character works through a choice aloud for the audience, and the decision happens during the song","why":"Alone, aloud, and the mind moves.","_n":"4j5f4","_k":"eee17fa6"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A production cuts the 4.4 soliloquy, which isn’t in the 1623 Folio. What does the audience lose about Hamlet?","options":[{"t":"Ophelia’s madness","why":"That’s 4.5.","_n":"4k5e4","_k":"a5b650e7"},{"t":"His last self-accusation and vow before the long absence, so his calm in Act 5 may seem to come from nowhere","why":"4.4 is the bridge to the Hamlet of Act 5.","_n":"4l614","_k":"008a3c6a"},{"t":"The plot of the duel","why":"That’s 5.2.","_n":"4m604","_k":"81d69069"},{"t":"Nothing; it repeats 3.1","why":"It responds to Fortinbras with a new argument.","_n":"4n5b4","_k":"9d890f69"}]},"b":{"prompt":"A director stages 3.1 so that Hamlet knows Claudius and Polonius are hiding and listening. How does this change “To be, or not to be”?","options":[{"t":"It means Hamlet stops speaking in verse","why":"Irrelevant: the verse stays.","_n":"4o5a4","_k":"4248e55f"},{"t":"It’s no longer a pure soliloquy: it may be partly a performance for hidden listeners, making it ambiguous","why":"A soliloquy is spoken alone; listeners change it.","_n":"4p5d4","_k":"864ce102"},{"t":"It changes nothing","why":"It ignores the convention: a soliloquy assumes no one on stage hears.","_n":"4q5e4","_k":"c014b7e9"},{"t":"It turns it into a comedy","why":"That overstates it.","_n":"4r5b4","_k":"8ca3a715"}]}}]},"task":{"title":"Performance task: Score the soliloquy","summary":"Score the soliloquy","statement":"\u003cp>Directors and actors “score” a speech: they mark where to pause, which words to lean on, and where the pace shifts. Score an excerpt from one of Hamlet’s soliloquies, then write a director’s note (120–200 words) explaining how your choices reveal his state of mind.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher judges the interpretation.\u003c/p>\u003cdetails class='alg sq-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge (form and metre)\u003c/td>\u003ctd>Score ignores the verse\u003c/td>\u003ctd>Some marks fit the verse\u003c/td>\u003ctd>Marks respond to metre and syntax\u003c/td>\u003ctd>Marks exploit variations purposefully\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking (interpretation)\u003c/td>\u003ctd>No link to character\u003c/td>\u003ctd>A general link\u003c/td>\u003ctd>Specific link with evidence\u003c/td>\u003ctd>An insightful, coherent reading\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication (note)\u003c/td>\u003ctd>Unclear\u003c/td>\u003ctd>Clear in places\u003c/td>\u003ctd>Clear and well integrated\u003c/td>\u003ctd>Vivid, precise, persuasive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application (performance choices)\u003c/td>\u003ctd>Arbitrary\u003c/td>\u003ctd>Plausible\u003c/td>\u003ctd>Purposeful\u003c/td>\u003ctd>Inventive and justified\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Excerpt chosen","Pauses marked","Words leaned on","Pace shifts","Note length","Two quotations from your excerpt","Voice linked to character"],"tips":["Choose the soliloquy you’ll score.","Mark at least four places to breathe or stop.","Underline at least six words to lean on.","Show one place where the pace changes.","Aim for 120–200 words.","Use the inserter: two phrases from your excerpt, cited.","Tag the sentence that says what your choices show about Hamlet."],"explainPrompt":"Craft statement: Which single mark (one pause or one stressed word) changes the meaning most? Read the line both ways and explain the difference.","explainLabel":"Craft statement","vocab":"Use pause, stress, pace, and a variation’s name if one helps.","checkLabel":"Check my score","success":"Your score and note have all their parts. Your teacher judges the interpretation.","min":120,"max":200,"excerpts":[{"id":"X1","sol":"s12","from":0,"to":8,"cut":"merely.","ref":"1.2.129–137"},{"id":"X2","sol":"s22","from":0,"to":8,"ref":"2.2.576–584"},{"id":"X3","sol":"s31","from":0,"to":9,"ref":"3.1.56–65"},{"id":"X4","sol":"s44","from":0,"to":7,"cut":"unused.","ref":"4.4.32–39"}],"how":"Choose a tool, then tap. A pause or pace mark goes in the gap after the word you tap (or tap the gap itself). Lean on a word by tapping it. Quote: tap the first and last word, then insert the quotation into your note. Arrow keys move through words and gaps.","tools":[{"id":"pause","t":"Pause ‖"},{"id":"emph","t":"Lean on a word"},{"id":"fast","t":"Faster →"},{"id":"slow","t":"Slower ←"},{"id":"quote","t":"Quote"}],"models":[{"title":"Model 1 (X1, 1.2)","score":"Pauses after “melt,”, “dew!”, “self-slaughter!” and “God! God!”; emphasis on “solid”, “melt”, “canon”, “weary”, “flat” and “unweeded”; slower from “How weary”.","note":"This is the first moment Hamlet is alone, after a public scene of smiling politics, and the speech should sound as if it is being pulled out of him. The opening wish, “O, that this too too solid flesh would melt” (\u003ci>Hamlet\u003c/i> 1.2.129), should be slow, with weight on “solid”, because his body feels like something he cannot escape. The pause after “self-slaughter!” marks the edge of a thought he is forbidden to finish. \u003cspan class='sq-ctag'>[character]\u003c/span> Then “How weary, stale, flat and unprofitable” (1.2.133) should almost stop: “stale” and “flat” each get their own beat, so the rhythm drags the way his days do. By “an unweeded garden” (1.2.135), the voice can find energy again, but it is the energy of disgust, not hope."},{"title":"Model 2 (X2, 2.2)","score":"Emphasis on “rogue”, “slave”, “I”, “monstrous”, “fiction” and “nothing”; pauses after “I!”, “here,”, “conceit?” and before “For Hecuba!”; faster through “Tears in his eyes, distraction in’s aspect”.","note":"This soliloquy explodes out of the scene with the players, and its first line should land hard on its last word: “O, what a rogue and peasant slave am I!” (\u003ci>Hamlet\u003c/i> 2.2.576). The stress on “I” turns the insult on himself. \u003cspan class='sq-ctag'>[character]\u003c/span> As Hamlet describes the actor’s performance, the pace should quicken through “Tears in his eyes, distraction in’s aspect” (2.2.581), as if he is replaying the actor’s tears with envy. Then a full stop before “For Hecuba!” (2.2.584): the absurdity of weeping for a fictional queen should hang in the air. The audience may laugh a little, and then realize Hamlet is not laughing. He is measuring himself against a man who is only pretending, and he is losing."},{"title":"Model 3 (X4, 4.4)","score":"Emphasis on “occasions”, “dull”, “man”, “beast”, “god-like” and “fust”; pauses after “revenge!”, “What is a man,”, “no more.” and “unused.”; slower on “That capability and god-like reason / To fust in us unused”.","note":"Unlike the earlier soliloquies, this one is cool and argued. Hamlet has just watched Fortinbras’s army march to fight over a worthless patch of ground, and he reasons rather than rages. I want “How all occasions do inform against me” (\u003ci>Hamlet\u003c/i> 4.4.32) spoken almost quietly, like a verdict he has already reached. The question “What is a man” (4.4.33) should be asked of the audience, with a pause long enough for us to answer it ourselves. The answer, “a beast, no more” (4.4.35), drops flatly. Then the pace slows on “god-like reason / To fust in us unused” (4.4.38–39), so that “fust”, to grow mouldy, sounds like what it means. \u003cspan class='sq-ctag'>[character]\u003c/span> His calm is what makes this Hamlet frightening: he has argued himself into a vow."}]},"cards":[["Soliloquy","A character alone, thinking aloud for the audience. “To be, or not to be” (3.1.56)."],["Aside","A remark others on stage don’t hear. Claudius: “How smart a lash that speech doth give my conscience!” (3.1.50)."],["Monologue","A long speech with listeners on stage."],["Iamb","da-DUM: an unstressed then a stressed syllable. “to-DAY”."],["Iambic pentameter","Five iambs, 10 syllables. “But, soft! what light through yonder window breaks?” (\u003ci>Romeo and Juliet\u003c/i> 2.2.2)."],["Feminine ending","An extra unstressed syllable at the line’s end. “…that is the question” (3.1.56)."],["Trochaic inversion","A foot reversed to DUM-da, often at a line’s start or after a pause. “Whether ’tis nobler…” (3.1.57)."],["Spondee","Two stresses side by side. “stale, flat” (1.2.133)."],["Caesura","A pause inside a line. “To sleep: perchance to dream: ay, there’s the rub;” (3.1.65)."],["Rhetorical question","Asked for effect, not answer.
