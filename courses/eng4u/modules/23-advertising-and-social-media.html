<script>window.MV_PAYLOAD={"meta":{"id":"23-advertising-and-social-media","nn":"23","slug":"advertising-and-social-media","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 5","groupName":"Media Studies","trivium":"Rhetoric","size":"M","storageKey":"eng4u-23-advertising-and-social-media-v1","progressKey":"eng4u-progress-v1:23-advertising-and-social-media","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"9639f664","content":{"id":"23-advertising-and-social-media","kind":"topic","title":"Advertising and social media rhetoric","topic":"Advertising & Social Media Rhetoric","readyTopic":"advertising and social media rhetoric","hero":{"headline":"Twenty-four centuries old, and still selling you sneakers","text":"Every ad you scroll past is making an argument. It borrows your trust in a speaker (\u003cstrong>ethos\u003c/strong>), stirs a feeling (\u003cstrong>pathos\u003c/strong>), offers reasons (\u003cstrong>logos\u003c/strong>) and picks its moment (\u003cstrong>kairos\u003c/strong>). Learn to see the choices, and you can judge them. Then you can make them yourself, honestly.","muted":"Work through the six parts in order. Your answers save on this device as you go, so you can stop and come back later.","fig":{"html":"\u003cdiv class='rx-hero' id='rx-hero' role='group' aria-label='Aristotle’s three modes of persuasion are read aloud. Three phrases lift out as labelled chips (ethos, pathos, logos) and land on a practice boot ad: ethos on the park-staff quote, pathos on the sunrise ridge, logos on “tested on 400 km”. A fourth chip, kairos, arrives late and lands on a “Fall sale ends Sunday” banner.'>\u003c/div>","caption":""},"passage":["Of the modes of persuasion furnished by the spoken word there are three kinds.","The first kind depends on the personal character of the speaker;","the second on putting the audience into a certain frame of mind;","the third on the proof, or apparent proof, provided by the words of the speech itself."],"cite":"(Aristotle, \u003ci>Rhetoric\u003c/i>, trans. W. Rhys Roberts, 1924, Book I, ch. 2)","chips":[{"ap":"ethos","phrase":"the personal character of the speaker","p":1,"land":"On the park-staff quote"},{"ap":"pathos","phrase":"a certain frame of mind","p":2,"land":"On the sunrise ridge"},{"ap":"logos","phrase":"the proof, or apparent proof","p":3,"land":"On “tested on 400 km”"}],"late":{"ap":"kairos","note":"Aristotle’s students added timing","land":"On “Fall sale ends Sunday”"},"banner":"Fall sale ends Sunday","caption":"Same moves, new screens.","listen":"Listen","watch":"Watch again","noVoice":"Read it yourself: say the passage aloud, pausing at each semicolon."},"goals":["I can identify ethos, pathos, logos and kairos in an ad or post, and explain how each works on its audience.","I can name persuasive techniques (bandwagon, scarcity, testimonial, plain folks, glittering generalities) and point to the exact words, images or sounds that create them.","I can infer a text’s target audience and purpose from its choices, and explain why different audiences respond to it differently.","I can explain how platforms, algorithms and data shape which persuasive messages I see.","I can evaluate whether a persuasive text is honest and transparent, including whether sponsored content is disclosed.","I can use rhetorical appeals deliberately and ethically in my own persuasive writing."],"start":{"blocks":[{"title":"Word story: advertise, persuade","html":"\u003cp>\u003cstrong>\u003cem>Advertise\u003c/em>\u003c/strong> comes from the Latin \u003cem>advertere\u003c/em>, “to turn toward”: an ad is, literally, something that turns your attention.\u003c/p>\u003cp>\u003cstrong>\u003cem>Persuade\u003c/em>\u003c/strong> comes from \u003cem>persuadere\u003c/em>, built on \u003cem>suadere\u003c/em>, “to urge”. That root is related to \u003cem>suavis\u003c/em>, “sweet”. To persuade is, at root, to make something sweet to someone.\u003c/p>\u003cp>\u003cstrong>Keep both pictures in mind:\u003c/strong> what is this text turning me toward, and how is it sweetening the turn?\u003c/p>\u003cp>\u003cbutton type='button' class='btn ghost sm' id='rx-ws-listen' hidden>Listen\u003c/button>\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"The appeals","goal":1,"prompt":"A speaker says: “As an emergency-room nurse for twenty years, I’ve treated too many falls from ladders.” Which appeal does the first half of the sentence mainly use?","options":[{"t":"Ethos","why":"Her years of relevant experience make her credible on this subject.","_n":"0348","_k":"96ce983e"},{"t":"Kairos","why":"Nothing here is about timing.","_n":"1358","_k":"41ef87a9"},{"t":"Pathos","why":"The word “too many” adds feeling, but the first half establishes who she is.","_n":"2368","_k":"9d6238e5"},{"t":"Logos","why":"Twenty years is a credential, not a reason or a piece of evidence about ladders.","_n":"32f8","_k":"aa2082db"}],"hints":["Is the phrase about the speaker, the audience or the argument?","“As an emergency-room nurse…” tells you who is talking.","Credibility from experience is ethos."]},{"id":"w2","skill":"The appeals","goal":1,"prompt":"“Each refill pouch uses 70% less plastic than a new bottle, so a family that switches keeps about 30 bottles a year out of the bin.” Which appeal?","options":[{"t":"Kairos","why":"No moment or deadline is invoked.","_n":"4308","_k":"c86d9b11"},{"t":"Pathos","why":"There’s no emotional language; it’s a calculation.","_n":"5318","_k":"1c703e69"},{"t":"Ethos","why":"The speaker’s credibility isn’t mentioned.","_n":"6328","_k":"e2c1984d"},{"t":"Logos","why":"It gives a figure and reasons from it to a consequence.","_n":"73b8","_k":"4ff5165f"}],"hints":["Look for evidence plus a “so”.","“70% less… so… 30 bottles” is reasoning.","Logos."]},{"id":"w3","skill":"Connotation","goal":2,"prompt":"A furniture shop wants “old” to sound appealing. Which word does that best?","options":[{"t":"Worn","why":"It points straight at damage.","_n":"83c8","_k":"d54e00ce"},{"t":"Used","why":"It’s accurate, but it suggests second-hand wear.","_n":"9248","_k":"fad40623"},{"t":"Aged","why":"It’s neutral to negative here; it can suggest decline.","_n":"a238","_k":"124c6a1c"},{"t":"Vintage","why":"It suggests style, character and value.","_n":"b228","_k":"20c025b5"}],"hints":["Same meaning, different feeling.","Which word would appear on a price tag \u003cem>raising\u003c/em> the price?","Vintage."]},{"id":"w4","skill":"Connotation","goal":2,"prompt":"A rental listing calls an apartment “cozy”. What is the word most likely softening?","options":[{"t":"That the rent is high","why":"“Cozy” says nothing about price.","_n":"c218","_k":"9ad6ef9c"},{"t":"That the apartment is small","why":"“Cozy” turns small into warm. That’s a euphemism.","_n":"d208","_k":"031d0c39"},{"t":"That the apartment is cold","why":"In a listing, “cozy” is about size far more often than temperature.","_n":"e1f8","_k":"a3f59b50"},{"t":"Nothing; it’s a neutral description","why":"Connotations are never neutral in an ad.","_n":"f1e8","_k":"e0a7bc60"}],"hints":["Why would a seller choose a feeling-word instead of a measurement?","What would “cozy” replace if the listing had to be blunt?","Small."]},{"id":"w5","skill":"Audience and purpose","goal":3,"prompt":"A poster beside a hospital elevator reads: “Wash your hands: 20 seconds protects everyone on this floor.” What is its main purpose?","options":[{"t":"To report news","why":"It doesn’t describe an event.","_n":"g1d8","_k":"0d1b9174"},{"t":"To sell soap","why":"No product or brand is named.","_n":"h1c8","_k":"5c37e6d4"},{"t":"To entertain","why":"Nothing is designed for enjoyment.","_n":"i1b8","_k":"0b337100"},{"t":"To persuade people to act","why":"It asks for a specific behaviour, with a reason.","_n":"j0a8","_k":"b2fdc154"}],"hints":["What does it want you to \u003cem>do\u003c/em>?","It’s an instruction plus a reason.","To persuade."]},{"id":"w6","skill":"Media forms","goal":4,"prompt":"Which feature belongs to a social media post but not to a printed magazine ad?","options":[{"t":"A logo","why":"Both carry logos.","_n":"k0b8","_k":"d9abf59d"},{"t":"Comments, shares and a ranking feed that decides who sees it","why":"The audience interacts, and the platform chooses its readers.","_n":"l088","_k":"42779abb"},{"t":"An image","why":"Both use images.","_n":"m098","_k":"1fd09480"},{"t":"A headline","why":"Print ads have headlines too.","_n":"n0e8","_k":"f841e3a7"}],"hints":["What can a reader \u003cem>do\u003c/em> to a post?","And who decides which posts you see?","Interaction and the feed."]}],"refreshers":{"The appeals":"Ethos: why trust this speaker? Pathos: what feeling is being stirred? Logos: what reasons or evidence? Kairos: why now? One line can use more than one.","Connotation":"Words with the same dictionary meaning carry different feelings: vintage, used, aged, worn. Advertisers choose the feeling.","Audience and purpose":"Every media text is made by someone, for someone, to do something. Ask all three questions.","Media forms":"A form’s conventions shape its message. On social platforms, an algorithm also shapes who sees it."}}},"explore":{"heading":"Rhetoric x-ray","intro":"Start with real ads and posts: put them under the x-ray and tag what persuades. Then use the practice model to change one word and watch the effect, show a text to different people, and find out why a feed showed it to you.","modes":[{"id":"xray","t":"X-ray"},{"id":"dial","t":"Word dial"},{"id":"lens","t":"Audience lens"},{"id":"feed","t":"Feed simulator"}],"how":{"xray":"Choose a text. Tap an element (a line of copy, the image or a storyboard frame), then tag it with an appeal and, if you like, a technique. Add a one-line note: how does this work on its audience?","dial":"Choose a slot, then swap the highlighted word along its scale. The tone readout scores warmth, urgency and trust from 0 to 5.","lens":"Choose a text, then show it to a persona. The readout gives their likely response and the reason.","feed":"Choose the persona’s age band, then switch on data signals: up to 2 liked interests, 1 recent search and a time of day. The six cards rank by a score you can read in full."},"modelNote":"The practice model: six fictional texts written for this module. Their brands, creators and people are invented, so they can be rewritten and tested without putting words in anyone’s mouth.","texts":[{"id":"A","name":"Northwick Trail Boots","form":"Magazine ad","els":[{"id":"img","kind":"image","lab":"Image","t":"A hiker on a granite ridge at sunrise above a lake"},{"id":"head","kind":"copy","lab":"Headline","t":"Go where the map runs out."},{"id":"body1","kind":"copy","lab":"Body","t":"Tested on 400 km of Shield trail."},{"id":"body2","kind":"copy","lab":"Body","t":"9 out of 10 park staff we asked would wear them again."},{"id":"tag","kind":"copy","lab":"Tagline","t":"Northwick. Made for the north in you."},{"id":"small","kind":"small","lab":"Small print","t":"Survey of 10 staff at one private campground."}]},{"id":"B","name":"@juniper.ok for Zestlet Gummies","form":"Creator post","els":[{"id":"img","kind":"image","lab":"Photo","t":"A smoothie bowl beside a bottle of gummies on a desk with textbooks"},{"id":"c1","kind":"copy","lab":"Caption","t":"Honestly obsessed 😍 these little guys got me through exam season."},{"id":"c2","kind":"copy","lab":"Caption","t":"Everyone in my gym group is on them now!!"},{"id":"c3","kind":"copy","lab":"Caption","t":"Link in bio for 20% off with code JUNI20, ends Sunday ⏰"},{"id":"tags","kind":"small","lab":"Hashtags","t":"#studytok #examseason #wellness #gymlife #smoothiebowl #studygram #selfcare #glowup #gifted"}]},{"id":"C","name":"Emberlyn Energy: “Solar Mango”","form":"15-second video storyboard","els":[{"id":"f1","kind":"frame","lab":"F1","t":"Close-up of a sweating can; a low bass hum"},{"id":"f2","kind":"frame","lab":"F2","t":"Slow-motion skateboarder mid-air"},{"id":"f3","kind":"frame","lab":"F3","t":"On-screen text: “LIMITED SUMMER DROP.”"},{"id":"f4","kind":"frame","lab":"F4","t":"A cheering festival crowd"},{"id":"f5","kind":"frame","lab":"F5","t":"Voice-over: “Only till August. Don’t be the one who missed it.”"},{"id":"f6","kind":"frame","lab":"F6","t":"Logo and “Emberlyn. Feel the spark.”"},{"id":"small","kind":"small","lab":"Small print (2 seconds)","t":"Not recommended for children, pregnant or breastfeeding people, or people sensitive to caffeine"}]},{"id":"D","name":"Tamarack Hollow Credit Union","form":"Billboard","els":[{"id":"img","kind":"image","lab":"Image","t":"A grandparent and a child planting a sapling"},{"id":"head","kind":"copy","lab":"Headline","t":"We grow with you."},{"id":"body","kind":"copy","lab":"Body","t":"Local since 1952. No hidden fees. Just neighbours."}]},{"id":"E","name":"Lanternhill Animal Rescue","form":"Charity ad (PSA)","els":[{"id":"img","kind":"image","lab":"Image","t":"A black-and-white photo of a dog looking through a fence"},{"id":"copy","kind":"copy","lab":"Copy","t":"She has waited 214 days. $5 a week brings her home."},{"id":"btn","kind":"copy","lab":"Button","t":"Sponsor Juno"}]},{"id":"F","name":"Pixelpine P9 phone","form":"Brand launch post","els":[{"id":"img","kind":"image","lab":"Image","t":"A phone floating on a dark gradient"},{"id":"c1","kind":"copy","lab":"Copy","t":"Pure. Bold. Yours."},{"id":"c2","kind":"copy","lab":"Copy","t":"The camera the pros are switching to."},{"id":"cd","kind":"copy","lab":"Countdown","t":"Drops in 3 days"}]}],"appeals":[{"id":"ethos","t":"Ethos","role":"syntax","q":"trust in the speaker"},{"id":"pathos","t":"Pathos","role":"figure","q":"the audience’s feelings"},{"id":"logos","t":"Logos","role":"image","q":"reasons and evidence"},{"id":"kairos","t":"Kairos","role":"sound","q":"the fitting moment"}],"techniques":[{"id":"bandwagon","t":"Bandwagon"},{"id":"scarcity","t":"Scarcity"},{"id":"testimonial","t":"Testimonial"},{"id":"plain","t":"Plain folks"},{"id":"glitter","t":"Glittering generality"},{"id":"transfer","t":"Transfer (borrowed associations)"}],"notePh":"How does this work on its audience?","weakReasons":[{"id":"sample","t":"Ten staff at one private campground is too small and too narrow to support “park staff” in general.","_n":"o0f8","_k":"cbc69c4a"},{"id":"tiny","t":"It’s in small print, so it doesn’t count.","_n":"p0c8","_k":"51fe968f"},{"id":"stats","t":"Statistics are always misleading.","_n":"q0d8","_k":"905bdfb1"},{"id":"dull","t":"It’s dull next to the sunrise image.","_n":"r128","_k":"04aeef2b"}],"weakLabel":"Weak link (TC2)","weakMark":"Mark as the weak link","weakNone":"No element marked yet.","demoC":{"f1":{"ap":["pathos"],"tech":[]},"f2":{"ap":["pathos"],"tech":["transfer"]},"f3":{"ap":["kairos"],"tech":[]},"f4":{"ap":["pathos"],"tech":["bandwagon"]},"f5":{"ap":[],"tech":["scarcity"]}},"urgency":{"before":4,"after":1,"label":"Urgency (summary bar)"},"real":{"title":"Real examples from your teacher","intro":"Your teacher chooses current real ads and posts each term and shares them as credited screenshots or clips. X-ray each one here: name the appeal or technique and point to the exact word, image or sound that creates it. These notes are unscored; your teacher reads them in your summary.","slots":[{"id":"ra","t":"R-A Print or web ad","crit":"At least two of the four appeals, plus a headline and a tagline","task":"Tag every appeal and technique; write how each works on the target audience."},{"id":"rb","t":"R-B Creator post","crit":"A post from a creator with a brand relationship (paid, gifted or affiliate)","task":"Tag the appeals; locate the disclosure (its wording and position); judge whether it’s clear."},{"id":"rc","t":"R-C Video ad, 15–60 seconds","crit":"Scarcity or kairos (a deadline, a season, a limited drop)","task":"Tag the frames that create urgency; decide whether the urgency is true."},{"id":"rd","t":"R-D Charity or public-service ad","crit":"Pathos as the main appeal","task":"Tag the pathos; apply the honest and relevant tests from Part 3."}],"creditPh":"Credit: brand or creator, agency if known, platform, date","notesPh":"Appeal or technique → the exact word, image or sound → how it works on the audience","hunt":"Technique hunt (unscored): match each technique (bandwagon, scarcity, testimonial, plain folks, glittering generality, transfer) to a line or image from these real examples, with a credit."},"dial":{"slots":[{"id":"D","text":"D","lab":"Text D headline","before":"“","after":" grow with you.”","opts":[{"w":"We","v":[5,1,4]},{"w":"Banks","v":[1,1,2]},{"w":"Tamarack","v":[3,1,3]},{"w":"Somebody","v":[2,1,1]}]},{"id":"C","text":"C","lab":"Text C voice-over","before":"“Only till ","after":".”","opts":[{"w":"August","v":[2,3,2]},{"w":"tonight","v":[2,5,1]},{"w":"forever","v":[2,0,2]},{"w":"stocks last","v":[2,4,1]}]},{"id":"A","text":"A","lab":"Text A tagline","before":"“Made for the north ","after":".”","opts":[{"w":"in you","v":[5,1,3]},{"w":"in Canada","v":[3,1,3]},{"w":"in stores","v":[1,1,2]},{"w":"on the map","v":[2,1,2]}]}],"dims":["Warmth","Urgency","Trust"]},"lens":{"texts":["E","C","D"],"personas":[{"id":"ruth","n":"Ruth","d":"70, retired, adopted two dogs before"},{"id":"dax","n":"Dax","d":"16, part-time job, allergic to dogs"},{"id":"amira","n":"Amira","d":"29, nurse, works night shifts"}],"resp":{"ruth":{"E":{"dim":"Act","lv":"high","why":"The $5 ask fits her budget, and she knows what a rescue dog gives back."},"C":{"dim":"Attention","lv":"low","why":"Nothing in it is addressed to her."},"D":{"dim":"Trust","lv":"high","why":"“Local since 1952” matches her sense of a trustworthy institution."}},"dax":{"E":{"dim":"Act","lv":"low","why":"He’s moved, but he can’t have a dog and has little spare money; he might share it instead."},"C":{"dim":"Attention","lv":"high","why":"Skate and festival images are aimed squarely at his age group, which raises an ethics question (see Part 3)."},"D":{"dim":"Trust","lv":"medium","why":"Warm, but banks feel far from his life."}},"amira":{"E":{"dim":"Act","lv":"medium","why":"She cares, but her schedule makes adoption hard; sponsorship is the easier yes."},"C":{"dim":"Attention","lv":"medium","why":"The caffeine pitch reaches her, but she knows the risks and reads the small print."},"D":{"dim":"Trust","lv":"medium","why":"“No hidden fees” is the line that matters to her."}}}},"feed":{"ages":["13–17","18–24","25–44","45+"],"interests":["outdoors","fitness","gaming","finance","pets","tech"],"searches":["hiking boots","exam tips","adopt a dog","new phone"],"times":["morning","late night"],"pts":{"age":2,"interest":3,"search":4,"time":1},"cards":[{"id":"A","ages":["25–44"],"ints":["outdoors"],"search":"hiking boots","time":"morning"},{"id":"B","ages":["13–17","18–24"],"ints":["fitness"],"search":"exam tips","time":"late night"},{"id":"C","ages":["18–24"],"gate":"13–17","ints":["gaming"],"search":"","time":"late night"},{"id":"D","ages":["45+"],"ints":["finance"],"search":"","time":"morning"},{"id":"E","ages":"all","ints":["pets"],"search":"adopt a dog","time":""},{"id":"F","ages":["18–24"],"ints":["tech"],"search":"new phone","time":"late night"}],"rules":"\u003cul>\u003cli>A matched age band: \u003cstrong>+2\u003c/strong>. A matched liked interest: \u003cstrong>+3\u003c/strong>. A matched recent search: \u003cstrong>+4\u003c/strong>. A matched time of day: \u003cstrong>+1\u003c/strong>.\u003c/li>\u003cli>Card C is \u003cstrong>age-gated\u003c/strong>: it scores 0 for ages 13–17.\u003c/li>\u003cli>Card E uses \u003cstrong>broad targeting\u003c/strong>: +2 for every age band.\u003c/li>\u003cli>\u003cstrong>Ties:\u003c/strong> the card earlier in the list (A to F) ranks first.\u003c/li>\u003c/ul>","rulesTable":[["A","25–44","outdoors","“hiking boots”","morning"],["B","13–17, 18–24","fitness","“exam tips”","late night"],["C","18–24 only (age-gated: 0 for 13–17)","gaming","(none)","late night"],["D","45+","finance","(none)","morning"],["E","all ages (+2 for every persona: broad targeting)","pets","“adopt a dog”","(none)"],["F","18–24","tech","“new phone”","late night"]],"why":[{"id":"rival","t":"B matched one of my signals and E, its only rival, matched none.","_n":"s138","_k":"b70a1234"},{"id":"best","t":"B is the best product for teenagers.","_n":"t908","_k":"482be7d3"},{"id":"pop","t":"The feed shows the most popular post first.","_n":"u8f8","_k":"10bc8eef"},{"id":"paid","t":"Zestlet paid the most to be shown.","_n":"v928","_k":"4dfeb7af"}],"whyLabel":"Why did it work? (TC3)","followUp":"Optional, outside the module: open the “Why am I seeing this ad?” or ad-preferences page on a platform you use and compare its listed reasons with the simulator’s signals. Only your own notes are kept here.","followPh":"What reasons did the platform list? How do they compare with the simulator’s signals?"},"readout":{"ap":"Appeals tagged","tech":"Techniques tagged","tone":"Tone (word dial)","resp":"Likely response (audience lens)","rank":"Feed ranking","why":"Why am I seeing this?"},"aha":"Persuasion is a set of choices that can be pointed to. Change a word and the trust changes; change the viewer and the response changes; change your data and the persuasion that finds you changes.","predictions":[{"id":"p1","start":{"mode":"dial","slot":"D","w":"We"},"prompt":"Swap “We grow with you” to “Banks grow with you.” What happens?","options":[{"t":"Urgency rises","_n":"w918","_k":"333c26c9"},{"t":"Nothing changes; it’s the same claim","_n":"x8c8","_k":"d12e785f"},{"t":"Warmth and trust drop: “we” had cast the credit union as your neighbour","_n":"y8b8","_k":"10ecb0f4"},{"t":"It becomes more logical","_n":"z8e8","_k":"b2fb69fb"}],"explain":"“We” is plain folks and ethos in one syllable: it puts speaker and reader on the same side. “Banks” turns a neighbour into an institution."},{"id":"p2","start":{"mode":"xray","text":"C"},"prompt":"Delete frame F5 (the voice-over “Only till August. Don’t be the one who missed it.”). Which tag disappears from the x-ray?","options":[{"t":"Logos","_n":"108d8","_k":"ebf64bbb"},{"t":"Ethos","_n":"11988","_k":"28f563d9"},{"t":"All pathos","_n":"12978","_k":"14f2a6b5"},{"t":"Scarcity, and much of the urgency","_n":"13867","_k":"1e9b09f8"}],"explain":"The skate and festival frames still carry feeling. Only the deadline line was doing the scarcity work. (The moment, summer, is kairos; the deadline is scarcity.)"},{"id":"p3","start":{"mode":"lens","text":"E"},"prompt":"Show the rescue ad to Ruth and to Dax. Who is more likely to act?","options":[{"t":"Dax","_n":"14877","_k":"7e4acba9"},{"t":"Both equally, because the photo is so moving","_n":"15887","_k":"6a894153"},{"t":"Neither, because emotional ads don’t work","_n":"16897","_k":"09202d25"},{"t":"Ruth","_n":"178a7","_k":"23b1d407"}],"explain":"Same text, different lives. The $5-a-week ask fits Ruth’s means and history; Dax is moved but can’t adopt. Pathos isn’t a trick here: it’s honest and relevant. The question is whom it can move to act."},{"id":"p4","start":{"mode":"feed","age":"18–24"},"prompt":"Switch on the recent search “new phone”. Which card jumps to the top?","options":[{"t":"E, Lanternhill","_n":"188b7","_k":"a3c09b80"},{"t":"F, Pixelpine","_n":"198c7","_k":"95efda8b"},{"t":"B, Zestlet","_n":"1a8d7","_k":"2af1a59b"},{"t":"It depends on which ad is best","_n":"1b8e7","_k":"69ad3bcd"}],"explain":"One search outweighed everything else. The feed ranks what matches your data, not what’s “best”."}],"chalIntro":"Use the x-ray and the feed simulator to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"\u003cstrong>X-ray Text A:\u003c/strong> tag at least one element for each of ethos, pathos and logos. \u003cbutton type='button' class='btn ghost sm rx-setup' data-setup='tc1'>Set it up\u003c/button>","msgs":{"small":"Look again: the small print \u003cem>weakens\u003c/em> the logos.","tagK":"Nothing here is about timing. “The north in you” is about identity, which is pathos.","headL":"“Go where the map runs out” gives no reason or evidence; it offers a feeling of freedom.","missing":"Tag Text A until ethos, pathos and logos each sit on an element that creates them."},"general":"Not yet. Ask of each element: who vouches (ethos), what feeling (pathos), what evidence (logos)?","why":"Ethos sits with the park staff who vouch, logos with the 400 km test (and the staff figure), and pathos with the sunrise ridge and the identity lines. The park-staff sentence can carry ethos and logos at once.","hints":["Ethos is about who vouches; logos is about evidence; pathos is about feeling.","Who vouches for the boots? What numbers are offered? What feeling does the sunrise create?","Ethos: the park staff. Logos: 400 km tested. Pathos: the ridge at sunrise."]},{"id":"tc2","goal":2,"prompt":"\u003cstrong>Find the weak link:\u003c/strong> tap the element in Text A that most undermines its logos, mark it as the weak link, then choose why. \u003cbutton type='button' class='btn ghost sm rx-setup' data-setup='tc2'>Set it up\u003c/button>","msgs":{"none":"Tap an element of Text A, press \u003cstrong>Mark as the weak link\u003c/strong>, then choose a reason.","tiny":"Small print counts legally. The problem is what it reveals: the sample.","img":"The image is pathos; it doesn’t claim evidence.","stats":"Many statistics are sound. This one isn’t, because of its sample."},"general":"Not yet. Where does the ad tell you how its number was produced?","why":"Ten staff at one private campground is too few, and they aren’t “park staff” in general: the small print quietly takes back the body copy’s claim.","hints":["Where does the ad tell you how its number was produced?","Read the small print: how many people, from where?","Ten staff at one private campground: too few, and not “park staff” in general."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>Feed simulator:\u003c/strong> the persona is 15. Make the Zestlet post (B) rank \u003cstrong>strictly first\u003c/strong> using \u003cstrong>exactly one\u003c/strong> signal. Then choose the sentence that explains why it worked. \u003cbutton type='button' class='btn ghost sm rx-setup' data-setup='tc3'>Set it up\u003c/button>","msgs":{"age":"The persona is 15: set the age band to 13–17.","none":"B ties with E at 2, and the tie goes to default order. One matching signal breaks it.","many":"Ranked first, but the challenge asked for exactly one signal. Which single signal is enough?","gaming":"Gaming matches C, but C is age-gated for a 15-year-old, so B and E still tie.","pets":"That lifts E, the rescue ad, above B.","why":"B is first. Now choose the sentence that explains why it worked."},"general":"Not yet. Open “How the score works”: you need one signal that B matches and E doesn’t.","why":"One data point decided what a 15-year-old saw. That’s the attention economy in a single click.","hints":["Open “How the score works”. With no signals, what do B and E each score?","Both score 2. You need one signal that B matches and E doesn’t.","Fitness, “exam tips” or late night: any one of them puts B strictly first."]}],"blocks":[]},"part3":{"slug":"disclosure","name":"Disclosure","heading":"Disclosure and responsibility","intro":"Explore taught you to \u003cem>see\u003c/em> persuasion. Here you ask whether a piece of persuasion is \u003cem>fair\u003c/em>, and who must say what. Sort, rewrite, then climb the ethics ladder.","craft":"Where the disclosure sits changes how the whole caption reads.","s1":{"title":"Station 1: Is it an ad?","how":"Each card says what a creator received. Sort it: must they disclose?","boxes":[{"id":"must","t":"Must disclose"},{"id":"no","t":"No disclosure needed"}],"cards":[{"id":"c1","t":"Paid $300 by a brand to post","_a":"G1tGShIU","fb":"Payment is a material connection."},{"id":"c2","t":"Received a free product, no payment","_a":"G1tGShIU","fb":"A gift is a connection, even if they love the product."},{"id":"c3","t":"Uses an affiliate code that earns a commission","_a":"G1tGShIU","fb":"A commission is a material connection: they earn when you buy."},{"id":"c4","t":"Posts about a product they bought themselves, with no connection to the brand","_a":"G1hcGw==","fb":"No payment, gift, commission or job: it’s an ordinary opinion."},{"id":"c5","t":"Is employed by the company and posts about its product","_a":"G1tGShIU","fb":"Employment is a connection: their pay comes from the brand."},{"id":"c6","t":"Reviews a library book they borrowed","_a":"G1hcGw==","fb":"Borrowing from a library creates no connection to the publisher."},{"id":"c7","t":"Was flown to a product launch by the brand","_a":"G1tGShIU","fb":"Paid travel is a material benefit from the brand."},{"id":"c8","t":"Promotes their own handmade jewellery shop","_a":"G1tGShIU","fb":"It’s their own business, so they should make that clear, e.g. “my shop”."}],"wrongMust":"Look again: something of value passed from the brand to the creator. A gift is a connection, even if they love the product.","wrongNo":"Look again: is there any payment, gift, commission or job here? If not, it’s an ordinary opinion."},"audit":{"title":"Real disclosure audit","how":"Your teacher shares three current real creator posts that involve a brand relationship (credited). For each, record what you find. Unscored: your teacher reviews your judgments.","posts":["Post 1","Post 2","Post 3"],"fields":[{"id":"words","t":"Exact disclosure wording, or “none found”"},{"id":"pos","t":"Position (which word of the caption, or where on screen)"},{"id":"clear","t":"Clear, early and plain? Why?"}],"done":"✓ Every field is filled for all three posts. Your teacher reads your judgments.","notYet":"Fill every field for all three posts."},"s2":{"title":"Station 2: Fix the disclosure","how":"Juniper’s caption buries “#gifted” as the ninth hashtag, and never mentions the commission. Rebuild it: tap chips in the order you want them. Tap a placed chip to take it out.","original":"Honestly obsessed 😍 these little guys got me through exam season. Everyone in my gym group is on them now!! Link in bio for 20% off with code JUNI20, ends Sunday ⏰ #studytok #examseason #wellness #gymlife #smoothiebowl #studygram #selfcare #glowup #gifted","chips":[{"id":"ad","t":"Ad:","kind":"disc"},{"id":"pp","t":"Paid partnership with Zestlet.","kind":"disc"},{"id":"free","t":"Zestlet sent me these for free.","kind":"disc"},{"id":"sp","t":"#sp","kind":"short"},{"id":"p1","t":"Honestly obsessed 😍 these little guys got me through exam season.","kind":"pitch"},{"id":"p2","t":"Everyone in my gym group is on them now!!","kind":"pitch"},{"id":"p3","t":"Link in bio for 20% off with code JUNI20, ends Sunday ⏰","kind":"pitch"},{"id":"com","t":"I earn a commission when you use my code.","kind":"com"},{"id":"thx","t":"Thanks @Zestlet!!","kind":"thanks"},{"id":"gift","t":"#gifted","kind":"late"}],"checks":["A clear disclosure (“Ad”, “Sponsored”, “Paid partnership” or “Zestlet sent me these for free”) within the first 10 words","The affiliate code’s commission is mentioned","No unclear shorthand (“#sp”)"],"flagSp":"“#sp” is shorthand many readers won’t understand. Say it in plain words.","flagThx":"“Thanks @Zestlet!!” doesn’t say payment or a gift.","okMsg":"✓ Clear, early and plain. Now read the two versions side by side.","meaning":"The honest version opens with the relationship, so “Honestly obsessed” now reads as an opinion from a paid partner, which is fair, rather than as a friend’s tip.","before":"Before","after":"After"},"s3":{"title":"Station 3: The ethics ladder","how":"Place each practice-model campaign on a rung. Four tests decide the rung.","rungs":[{"id":"inform","t":"Inform"},{"id":"persuade","t":"Persuade"},{"id":"manip","t":"Manipulate"}],"tests":[["Honest","Are the claims true?"],["Relevant","Does the appeal fit the decision?"],["Transparent","Do you know who is speaking and why?"],["Respectful","Does it leave you free to say no?"]],"items":[{"id":"e","t":"Text E: Lanternhill Animal Rescue (“She has waited 214 days.”)","_a":"G0ZWSxVDV1BcFA==","fb":"Persuade. The emotion is honest and relevant, and the ask is clear.","wrong":"Feeling is a fair part of a decision. Ask whether the emotion is relevant and honest, not whether it’s there."},{"id":"c","t":"Text C: Emberlyn Energy, with festival and skate imagery reaching under-18s","_a":"G1tSVw9GFA==","fb":"Manipulate. The imagery is aimed at an age group the label itself warns away, and the scarcity is manufactured. The problem is the target and the false urgency, not emotion itself.","wrong":"Look at who the skate and festival images reach, and whether “Only till August” is a real limit."},{"id":"t","t":"A transit notice listing new bus times","_a":"G19dXwlEWxY=","fb":"Inform. It gives facts you need and asks for nothing.","wrong":"Does it try to change your mind, or just tell you the times?"},{"id":"b1","t":"Text B \u003cem>before\u003c/em> the disclosure fix","_a":"G1tSVw9GFA==","fb":"Manipulate: it isn’t transparent. A paid pitch passes as a friend’s tip.","wrong":"Apply the transparent test: do you know who is speaking, and why?"},{"id":"b2","t":"Text B \u003cem>after\u003c/em> the disclosure fix","_a":"G0ZWSxVDV1BcFA==","fb":"Persuade. The relationship is up front, so you can weigh the opinion fairly.","wrong":"Now the relationship comes first. Which tests does it pass?"}],"debate":"Class debate: these placements are defensible, not absolute. Is guilt ever fair? Where would you put Text E if its photo were staged?","realLabel":"One real campaign from your teacher’s examples (unscored): name it, choose a rung, and justify it in one sentence.","realPh":"Campaign (with credit), rung, and one sentence: which test decides it?"},"blocks":[],"quickCheck":{"title":"Disclosure quick check","summary":"Disclosure quick check","items":[{"id":"q1","goal":5,"prompt":"A creator got a free jacket and posts about it. Disclosure?","choices":[{"t":"Needed","fb":"Right. A free product is a material connection.","_n":"1c8f7","_k":"6aa65898"},{"t":"Only on video posts","fb":"A free product is a material connection.","_n":"1d8c8","_k":"97ddab68"},{"t":"Not needed: there was no payment","fb":"A free product is a material connection.","_n":"1e8b8","_k":"ccf37fc0"},{"t":"Only if over $100","fb":"A free product is a material connection.","_n":"1f8a8","_k":"44491f08"}]},{"id":"q2","goal":5,"prompt":"Which placement is clearest?","choices":[{"t":"“#sp” mid-caption","fb":"Disclosure must be seen before the pitch, not hidden after it.","_n":"1g898","_k":"3561b379"},{"t":"In the bio only","fb":"Disclosure must be seen before the pitch, not hidden after it.","_n":"1h908","_k":"5464ef94"},{"t":"“#ad” as the last of 12 hashtags","fb":"Disclosure must be seen before the pitch, not hidden after it.","_n":"1i8f8","_k":"418cb468"},{"t":"“Ad:” at the start of the caption","fb":"Right. Disclosure must be seen before the pitch, not hidden after it.","_n":"1j8e8","_k":"23fea8d3"}]},{"id":"q3","goal":5,"prompt":"Which ethics test does a deadline that is quietly extended every week fail?","choices":[{"t":"Respectful","fb":"A deadline that isn’t real is a false claim.","_n":"1k8d8","_k":"f59b0e78"},{"t":"Transparent","fb":"A deadline that isn’t real is a false claim.","_n":"1l948","_k":"5d452204"},{"t":"Relevant","fb":"A deadline that isn’t real is a false claim.","_n":"1m938","_k":"c805dce6"},{"t":"Honest","fb":"Right. A deadline that isn’t real is a false claim.","_n":"1n928","_k":"b4924cb7"}]},{"id":"q4","goal":5,"prompt":"Text E uses a sad photo. On the ladder it sits at…","choices":[{"t":"Inform","fb":"The emotion is honest and relevant to the decision, and you’re free to say no.","_n":"1o938","_k":"d4ada528"},{"t":"Off the ladder","fb":"The emotion is honest and relevant to the decision, and you’re free to say no.","_n":"1p908","_k":"6c40ec7c"},{"t":"Persuade","fb":"Right. The emotion is honest and relevant to the decision, and you’re free to say no.","_n":"1q918","_k":"97a7c3e3"},{"t":"Manipulate","fb":"The emotion is honest and relevant to the decision, and you’re free to say no.","_n":"1r8e8","_k":"44bb4e08"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“If you would win a man to your cause, first convince him that you are his sincere friend.”\u003c/p>\u003cp class='eng-cite'>(Abraham Lincoln, Temperance Address, 1842)\u003c/p>\u003cp>\u003cstrong>The pattern:\u003c/strong> “If you would ______, first ______.”\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> write your own version about persuasion or any craft.\u003c/p>\u003cp>\u003cstrong>Example:\u003c/strong> “If you would sell a reader a sentence, first earn the word at its end.”\u003c/p>\u003cp class='tiny muted'>Lincoln’s “a man” reflects 1842 usage; your imitation can change it.\u003c/p>","prompt":"Your imitation"}]},"practice":{"activities":[{"id":"match","type":"match","title":"Technique ↔ line","summary":"Technique ↔ line","goal":[1,2],"instruction":"Match each line with the technique or appeal it uses.","leftTitle":"Line","rightTitle":"Technique or appeal","left":[{"id":"l1","t":"“Join the 2 million Canadians who already switched.”","why":"The size of the crowd is the argument: bandwagon."},{"id":"l2","t":"“Only 40 tickets left at this price.”","why":"A limited supply hurries the decision: scarcity."},{"id":"l3","t":"“‘I wouldn’t train without it.’ (Olympic rower Maya Tremblay, an invented example; no real athlete is quoted)”","why":"One named person vouches: testimonial."},{"id":"l4","t":"“No fancy words. Just good bread, baked at 4 a.m. by people who live here.”","why":"The speaker poses as someone just like you: plain folks.","hints":["Who is the speaker pretending to be?","Someone just like you.","Plain folks."]},{"id":"l5","t":"“Pure. Bold. Yours.”","why":"Shining words with no claim inside: glittering generality."},{"id":"l6","t":"“First snow tonight. Are your tires ready?”","why":"The fitting moment does the work: kairos."},{"id":"l7","t":"“Our filter removes 99% of lead, as tested by an accredited lab.”","why":"A measurable claim with its evidence: logos."},{"id":"l8","t":"A tea ad set in a misty mountain monastery","why":"Calm, ancient and pure are borrowed from the setting: transfer.","hints":["What does the setting make you feel about the tea?","Calm, ancient and pure, none of which the ad claims in words.","Transfer: feelings borrowed from a setting."]}],"right":[{"id":"r1","t":"Bandwagon"},{"id":"r2","t":"Scarcity"},{"id":"r3","t":"Testimonial"},{"id":"r4","t":"Plain folks"},{"id":"r5","t":"Glittering generality"},{"id":"r6","t":"Kairos"},{"id":"r7","t":"Logos"},{"id":"r8","t":"Transfer (borrowed associations)"}],"_a":"QhRfCEQMFEYIFB8bCgQUDhtEARtKFFoHGwwRS1UUGhZVAhEDREQCFhUUXwxEDBRGDBQfGwoAFA4bRAUbShRaAxsMEUtRFBoWVQ4RA0REDhZE","wrong":{"l6|r2":"Nothing is in short supply. The appeal is the \u003cem>moment\u003c/em>: first snow.","l3|r1":"One named person vouching is testimonial; bandwagon is “everyone’s doing it”.","l5|r7":"Three adjectives, no reasons: glittering generality."},"wrongDefault":"Ask what the line is asking you to trust: a crowd, a deadline, a person, a moment or a fact."},{"id":"unseen","type":"custom","title":"Unseen campaign","summary":"Unseen campaign","star":true,"goal":[1,2,3,4,5],"instruction":"A script you haven’t seen: a fictional fast-fashion “haul” video. Tag lines, choose, then rewrite. Items 4 to 6 sit above Final Check level.","how":"","scriptTitle":"FreshThread haul video script (30 seconds; practice model)","stage":"[Creator, bright bedroom, racks of clothes]","lines":["“OK so FreshThread just dropped 200 new pieces and I grabbed nine for under $60.","Literally everyone at school asked where my top was from.","They restock never, so if you see it, get it.","Use RIA15 for 15% off.","I’m not sponsored, I just love them.”"],"screen":"[On screen, 1 second: “Gifted items. Affiliate code.”]","items":[{"id":"u1","kind":"tap","goal":2,"prompt":"\u003cstrong>U1.\u003c/strong> Tag the \u003cstrong>bandwagon\u003c/strong> line: tap it in the script.","_a":"CA==","why":"“Everyone at school” is the crowd: bandwagon.","wrong":{"2":"That’s not scarcity; it’s the crowd.","def":"Look for the line that points to what everyone else is doing."},"hints":["Bandwagon is “everyone’s doing it”.","Who is “everyone” in this script?","“Literally everyone at school asked…”."]},{"id":"u2","kind":"tap","goal":2,"prompt":"\u003cstrong>U2.\u003c/strong> Tag the \u003cstrong>scarcity\u003c/strong> line.","_a":"Cw==","why":"“They restock never” threatens the supply: scarcity.","wrong":{"1":"Urgency from supply, not from a moment. That line is the crowd.","def":"Urgency from supply, not from a moment."},"hints":["Scarcity claims a limited supply or deadline.","Which line says you may not get another chance?","“They restock never, so if you see it, get it.”"]},{"id":"u3","kind":"mc","goal":3,"prompt":"\u003cstrong>U3.\u003c/strong> Who is the most likely target audience?","options":[{"t":"Teens on a tight budget who care about fitting in at school","why":"“Everyone at school” and “under $60” narrow it.","_n":"1s8f8","_k":"71369565"},{"t":"Fashion professionals","why":"“Under $60” and “at school” point to students, not professionals.","_n":"1t8c8","_k":"e859dff8"},{"t":"Parents shopping for their children","why":"The creator speaks as a student to students.","_n":"1u8d8","_k":"c14b6846"},{"t":"Everyone who buys clothes","why":"Every choice of word, image and price narrows the audience. Ask who the text imagines.","_n":"1v9a8","_k":"74dbd34f"}],"hints":["Which words name a place and a price?","“At school” and “under $60”.","Teens on a budget who care about fitting in."]},{"id":"u4","kind":"mc","goal":5,"prompt":"\u003cstrong>U4 ★\u003c/strong> Which statement creates a transparency problem?","options":[{"t":"“Use RIA15 for 15% off”","why":"A code is an offer; the problem is the denial that contradicts it.","_n":"1w9b8","_k":"c6dad661"},{"t":"“FreshThread just dropped 200 new pieces”","why":"That’s a product detail, not a statement about the relationship.","_n":"1x988","_k":"88e0034c"},{"t":"“I’m not sponsored, I just love them,” which is contradicted by the 1-second on-screen note","why":"The spoken claim denies the connection the screen admits. That’s a false statement, not just poor placement.","_n":"1y978","_k":"accbfd41"},{"t":"“Literally everyone at school asked where my top was from”","why":"That’s bandwagon. Transparency is about who is speaking and why.","_n":"1z9a8","_k":"f4c8bf6b"}],"hints":["Compare what the creator \u003cem>says\u003c/em> with what the screen \u003cem>shows\u003c/em>.","Can both be true?","“Not sponsored” vs “Gifted items. Affiliate code.”"]},{"id":"u5","kind":"mc","goal":1,"prompt":"\u003cstrong>U5 ★\u003c/strong> Choose the strongest analytical sentence.","options":[{"t":"“The creator shows nine pieces she bought from FreshThread and gives a discount code.”","why":"This states what happens, not how it works on the viewer.","_n":"20998","_k":"a25fea94"},{"t":"“The script uses persuasion to sell clothes to people.”","why":"True of every ad: it names no technique and no effect.","_n":"219c8","_k":"fe8bbd4b"},{"t":"“By pairing a crowd claim (‘everyone at school asked’) with a supply threat (‘they restock never’), the script makes hesitation feel like social risk, while its 1-second disclosure contradicts the creator’s spoken denial of sponsorship.”","why":"It names two techniques, quotes them, and says what they do to the viewer.","_n":"229b8","_k":"e383703e"},{"t":"“Fast fashion is bad for the planet, so this video is wrong.”","why":"“Fast fashion is bad” is a view, not an analysis of this text.","_n":"239e8","_k":"a87cc7eb"}],"hints":["A strong analytical sentence names a technique, quotes it, and says what it does to the viewer.","Which option links two techniques and names the effect?","The option that connects the crowd claim, the supply threat and the contradiction."]},{"id":"u6","kind":"build","goal":5,"prompt":"\u003cstrong>U6 ★\u003c/strong> Rewrite the last two sentences honestly. Choose a chip for each slot.","slots":[{"id":"open","t":"Opening","opts":[{"id":"ad","t":"Ad: FreshThread gifted these and I earn from my code."},{"id":"none","t":"(no opening line)"},{"id":"tag","t":"#gifted (at the very end instead)"}]},{"id":"deny","t":"“I’m not sponsored, I just love them.”","opts":[{"id":"keep","t":"Keep it"},{"id":"del","t":"Delete it"}]},{"id":"stock","t":"“They restock never, so if you see it, get it.”","opts":[{"id":"keep","t":"Keep it"},{"id":"true","t":"Replace: “This drop has 200 pieces; check sizes before you buy.”"},{"id":"cut","t":"Remove it"}]}],"_a":"QhRcSQNYFA4bV1cbShRSUVdPEQNEUlNYGxoRShJZVV8bDGgbEkRDURsaEVoTQhRpRA==","okMsg":"✓ Honest, relevant, transparent and respectful: the relationship comes first, the false denial is gone, and the urgency is either true or gone.","fb":"Every rung must pass: honest, relevant, transparent, respectful.","hints":["Where should the relationship appear: before or after the pitch?","Can “I’m not sponsored” stay true next to a gift and a code?","Disclosure at the start; delete the denial; replace “restock never” with a true detail or remove it."]}]},{"id":"spot","type":"custom","title":"Spot the Error","summary":"Spot the error","student":"Barnaby","goal":[1,4,5],"instruction":"Barnaby wrote three short analyses. Each has one mistake. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":1,"task":"Analyse the appeals in Text D (credit union billboard).","steps":["“The billboard shows a grandparent and child planting a sapling.”","“This image uses pathos: it links saving money with family and growth.”","“‘Local since 1952’ is logos, because it contains a number.”","“So the ad relies mostly on reasoning.”"],"_a":"Cw==","stepFb":["Accurate description. Keep checking.","Sound: the feeling is named and connected.","","This follows from sentence 3. The mistake is earlier."],"fixes":[{"t":"“Sentence 3 is correct.”","why":"Numbers don’t make logos automatically.","_n":"249d8","_k":"984fbe45"},{"t":"“It’s pathos, because 1952 feels old.”","why":"The claim is about trustworthiness.","_n":"25908","_k":"9ff9d1cc"},{"t":"“‘Local since 1952’ is mainly ethos: it builds credibility through long history, not through a reason or evidence about the product.”","why":"Right: a founding date builds trust in the speaker.","_n":"268f8","_k":"2e95be55"},{"t":"“‘Local since 1952’ is kairos, because it mentions a date.”","why":"A date isn’t a timely moment.","_n":"270e9","_k":"0e115c1b"}],"hints":["What does a founding date make you think about the speaker?","Longevity suggests reliability.","That’s credibility: ethos."]},{"id":"e2","goal":4,"task":"Explain why Dax keeps seeing energy-drink ads.","steps":["“Dax watches skateboarding videos late at night.”","“The platform shows everyone the most popular ads, so he sees the energy drink because it’s popular.”","“Popular ads are usually the best products.”"],"_a":"CA==","stepFb":["A relevant fact.","","This builds on sentence 2. Look earlier."],"fixes":[{"t":"“The ads are random.”","why":"Ranking follows rules, as the feed simulator showed.","_n":"280f9","_k":"a2c98acf"},{"t":"“Sentence 2 is correct.”","why":"Feeds are personalized, not one ranking for everyone.","_n":"29109","_k":"fcb762e3"},{"t":"“His phone overheard him talking about energy drinks.”","why":"That claim is unsupported; the data he \u003cem>gives\u003c/em> (views, likes, searches, time) is enough to explain it.","_n":"2a119","_k":"0ffcf44e"},{"t":"“The platform ranks ads for each user from their data. His interests and late-night viewing match the ad’s targeting.”","why":"Right: the ranking is personal, built from his signals.","_n":"2b0a9","_k":"63cc5be9"}],"hints":["In the simulator, did everyone see the same top card?","No; the score depended on each persona’s signals.","His data matched the targeting."]},{"id":"e3","goal":5,"task":"Is Text B’s disclosure adequate?","steps":["“Juniper received the gummies for free and earns from her code.”","“These are material connections, so the post should disclose them.”","“She includes #gifted, so the disclosure is adequate.”","“Readers can easily see that the post is sponsored.”"],"_a":"Cw==","stepFb":["Accurate: two connections.","Correct reasoning.","","This depends on sentence 3. Look earlier."],"fixes":[{"t":"“Sentence 3 is correct.”","why":"Look at where #gifted sits, and what’s missing.","_n":"2c0b9","_k":"dff91c88"},{"t":"“Any hashtag counts, wherever it is.”","why":"Placement matters: it should be seen before the pitch.","_n":"2d0c9","_k":"bb9c4d3a"},{"t":"“#gifted is buried at the end, after the pitch, and the affiliate commission isn’t mentioned, so the disclosure isn’t clear or prominent.”","why":"Right: clear means early and complete.","_n":"2e0d9","_k":"21add2ab"},{"t":"“No disclosure is needed because she likes the product.”","why":"Payment, a free product or a commission makes it advertising, and it should say so up front.","_n":"2f169","_k":"cf5d4456"}],"hints":["Where in the caption does #gifted appear?","After nine other hashtags, and after the discount pitch.","Clear means early and complete."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which result in Explore surprised you most: the one-word swap, the two personas reacting differently, or the one signal that decided the feed? Why?"},{"id":"j2","q":"In your own words, what separates persuasion from manipulation? Use one example from this module."},{"id":"j3","q":"Explain to a friend how to x-ray an ad in under a minute: what do they look for first, second and third?"},{"id":"j4","q":"Think of an ad or post that worked on you recently. Which appeal did the work, and how would you notice it sooner next time?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line, from Aristotle, Lincoln or any text in this module, that you want to keep. Add a sentence on why it stays with you.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one rule of persuasion you now believe, in your own words. Then copy a line from this module that shows it (the master’s example), and write a sentence of your own that uses it (your imitation).","placeholder":"e.g. Earn trust before you ask for anything.","examples":["If you would win a man to your cause, first convince him that you are his sincere friend. (Lincoln, 1842)","The first kind depends on the personal character of the speaker (Aristotle, trans. Roberts)","the proof, or apparent proof, provided by the words of the speech itself (Aristotle, trans. Roberts)","She has waited 214 days. $5 a week brings her home. (Text E, practice model)","Ad: Zestlet pays me for this post and sent me these. (C2, practice model)"]},"artSamples":[{"p":"Earn trust before you ask for anything.","m":"Lincoln’s “first convince him that you are his sincere friend.”"},{"p":"Urgency must be true, or it poisons everything else.","m":"the ethics ladder, Text C"}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A sunscreen ad says: “Formulated with a panel of three dermatologists.” Which appeal does this mainly use?","options":[{"t":"Ethos","why":"Relevant experts lend credibility to the product.","_n":"2g179","_k":"7357ecfd"},{"t":"Kairos","why":"No timing is invoked.","_n":"2h149","_k":"e3898e46"},{"t":"Pathos","why":"No feeling is stirred; it’s about who vouches.","_n":"2i139","_k":"e529f530"},{"t":"Logos","why":"The panel is a credential, not evidence about how well the sunscreen works.","_n":"2j129","_k":"a9fe174e"}]},"b":{"prompt":"“Fourteen hours of battery life, the longest of any phone we’ve made.” Which appeal does this mainly use?","options":[{"t":"Logos","why":"A measurable claim offered as a reason to buy.","_n":"2k119","_k":"7281e2c7"},{"t":"Pathos","why":"No emotional language.","_n":"2l109","_k":"ea85b63e"},{"t":"Kairos","why":"No moment or deadline.","_n":"2m0f9","_k":"7595c9a6"},{"t":"Ethos","why":"Nothing about the speaker’s credibility.","_n":"2n0e9","_k":"8b614e6e"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"“Join the 2 million Canadians who already switched.” Which technique is this?","options":[{"t":"Testimonial","why":"No single person vouches.","_n":"2o0d9","_k":"364b47b6"},{"t":"Plain folks","why":"It doesn’t pose as “just like you”; it points to numbers of people.","_n":"2p1c9","_k":"07571849"},{"t":"Bandwagon","why":"It persuades by the size of the crowd.","_n":"2q1b9","_k":"947bae12"},{"t":"Glittering generality","why":"It’s specific, not vague praise words.","_n":"2r12a","_k":"373a440e"}]},"b":{"prompt":"“Only 40 left at this price.” Which technique is this?","options":[{"t":"Kairos","why":"It’s about supply, not a fitting moment.","_n":"2s11a","_k":"7ffc0124"},{"t":"Testimonial","why":"No one vouches.","_n":"2t14a","_k":"802f7762"},{"t":"Scarcity","why":"It claims a limited supply to hurry the decision.","_n":"2u13a","_k":"b0b626c7"},{"t":"Bandwagon","why":"No crowd is mentioned.","_n":"2v0ea","_k":"a93d03ee"}]}},{"id":"k3","cat":"K","goal":[4,5],"a":{"prompt":"What does an algorithmic social feed mainly rank posts by?","options":[{"t":"Accuracy and quality","why":"Engagement, not truth, drives ranking.","_n":"2w0da","_k":"1590c806"},{"t":"Newest posts first, for everyone","why":"Most feeds aren’t purely chronological.","_n":"2x10a","_k":"54e429c2"},{"t":"Predicted engagement for you, based on your data","why":"Your signals (views, likes, searches, timing) drive the ranking.","_n":"2y0fa","_k":"bf710695"},{"t":"The same popularity list for every user","why":"Feeds are personalized.","_n":"2z0aa","_k":"477aacb6"}]},"b":{"prompt":"Under Canadian disclosure guidance, when should a creator disclose a post?","options":[{"t":"Only on video platforms","why":"The rule follows the connection, not the platform.","_n":"3009a","_k":"ba2baeb7"},{"t":"Only when paid more than $100","why":"The amount isn’t the test; the connection is.","_n":"310c9","_k":"25ee9b9c"},{"t":"Whenever they have a material connection to the brand, such as payment, a free product or a commission","why":"Any of these connections should be disclosed.","_n":"320d9","_k":"562d83d3"},{"t":"Never, if they genuinely like the product","why":"Liking it doesn’t remove the connection.","_n":"330a9","_k":"946906cc"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"“Your first apartment deserves better than a mattress on the floor. Flat-pack sofa, delivered in 48 hours, assembled in 20 minutes. From $249.” Who is the most likely target audience?","options":[{"t":"Families with young children","why":"Nothing addresses children or space.","_n":"340b9","_k":"1478cdb0"},{"t":"Luxury buyers","why":"Flat-pack at $249 signals budget, not luxury.","_n":"35109","_k":"dd0c9bc8"},{"t":"Retirees downsizing","why":"“First apartment” rules this out.","_n":"36119","_k":"dfef1816"},{"t":"Young adults moving out for the first time, on a budget","why":"“First apartment”, “mattress on the floor” and “$249” all point there.","_n":"370e9","_k":"8609479f"}]},"b":{"prompt":"“Still running at 6 a.m. every Saturday? So are your knees. Cushion+ insoles: 30 days, risk free.” Who is the most likely target audience?","options":[{"t":"Professional sprinters","why":"“Saturday at 6 a.m.” suggests a hobby routine.","_n":"380f9","_k":"f0511758"},{"t":"Experienced recreational runners, probably older, who feel joint strain","why":"“Still running” and “your knees” imply years of habit and its wear.","_n":"39049","_k":"42465790"},{"t":"Beginners who’ve never run","why":"“Still running” implies a long habit.","_n":"3a059","_k":"2b44b03e"},{"t":"Children’s sports teams","why":"Nothing addresses children or teams.","_n":"3b069","_k":"8b7a4f96"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"“9 out of 10 students who tried StudySpark raised their marks!” Small print: “10 students, one summer tutoring class.” Which is the strongest critique?","options":[{"t":"Statistics in ads are always lies","why":"Over-general: some are sound. Judge this one’s sample.","_n":"3c059","_k":"46e15d58"},{"t":"“StudySpark” sounds made up","why":"The name is irrelevant to the reasoning.","_n":"3d049","_k":"48713cda"},{"t":"The sample is tiny and self-selected, so it can’t support a general claim about students","why":"Ten volunteers in a tutoring class may have improved for many reasons.","_n":"3e039","_k":"b3b5de7b"},{"t":"It uses pathos instead of logos","why":"It \u003cem>does\u003c/em> use logos, a weak logos.","_n":"3f029","_k":"65fb0656"}]},"b":{"prompt":"“4 out of 5 dentists we surveyed recommend Gleam.” Small print: “Survey of 5 dentists at Gleam’s sponsored conference.” Which is the strongest critique?","options":[{"t":"Five dentists at the brand’s own event is too small a sample and a biased one","why":"Size and setting both undermine the claim.","_n":"3g019","_k":"24dc7eab"},{"t":"Any survey is meaningless","why":"Too broad.","_n":"3h009","_k":"6dfd7f82"},{"t":"It should use pathos instead","why":"Swapping appeals wouldn’t fix the evidence.","_n":"3iff9","_k":"b311c323"},{"t":"Dentists can’t be trusted","why":"Expertise is relevant here; the sample is the problem.","_n":"3j0e9","_k":"6e46b5a5"}]}},{"id":"t3","cat":"T","goal":[1,3],"a":{"prompt":"A charity ad shows a famous hockey player saying, “I give, and so can you.” Why might two audiences respond differently?","options":[{"t":"Everyone will respond the same way because the message is clear","why":"Every choice of word, image and price narrows the audience. Ask who the text imagines.","_n":"3k0d9","_k":"3437427d"},{"t":"Fans may trust the player and feel invited, while others may see fame borrowed from a field unrelated to the cause","why":"The same ethos works for some viewers and not for others.","_n":"3l009","_k":"ee797d81"},{"t":"Celebrity endorsements are illegal in charity ads","why":"They aren’t.","_n":"3m019","_k":"2c8ef5a6"},{"t":"Only logos persuades adults, so adults will ignore it","why":"Adults respond to ethos and pathos too.","_n":"3n029","_k":"43109bfe"}]},"b":{"prompt":"A public-health ad features a well-known comedian joking about getting a flu shot. Why might two audiences respond differently?","options":[{"t":"Audiences don’t affect how a message is received","why":"Every choice of word, image and price narrows the audience. Ask who the text imagines.","_n":"3o039","_k":"98637536"},{"t":"Some viewers relax and listen because of the humour and familiarity; others may doubt a comedian’s authority on health","why":"Ethos and pathos land differently with different viewers.","_n":"3pfc9","_k":"c5debe50"},{"t":"Humour always weakens a health message","why":"Over-general: humour can widen reach.","_n":"3qfd9","_k":"cb2ba5f5"},{"t":"Everyone trusts famous people equally","why":"Ethos is credibility \u003cem>on this subject\u003c/em>. Fame in one field doesn’t transfer automatically to another.","_n":"3rfe9","_k":"602e0f77"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which sentence best \u003cem>analyses\u003c/em> Juniper’s caption (Text B)?","options":[{"t":"“Juniper posts about gummies and a discount code.”","why":"That’s a summary.","_n":"3sff9","_k":"96042045"},{"t":"“The caption uses logos because it has a percentage.”","why":"The 20% is an offer, not evidence.","_n":"3t089","_k":"98f13c6e"},{"t":"“Influencers shouldn’t advertise to students.”","why":"That’s an opinion, not an analysis of this text.","_n":"3u099","_k":"981da5b6"},{"t":"“By burying ‘#gifted’ after nine hashtags and a discount deadline, the caption lets ‘Honestly obsessed’ read as a friend’s tip rather than a paid partner’s pitch.”","why":"It names a choice, quotes it and explains its effect.","_n":"3v7a9","_k":"f74de23b"}]},"b":{"prompt":"Which sentence best \u003cem>analyses\u003c/em> the energy-drink storyboard (Text C)?","options":[{"t":"“The ad uses ethos because a skater appears.”","why":"The skater isn’t vouching; the image transfers a feeling.","_n":"3w799","_k":"44ab3a45"},{"t":"“Energy drinks are unhealthy.”","why":"An opinion about the product, not the text.","_n":"3x7c9","_k":"05784988"},{"t":"“The ad shows a can, a skater and a crowd.”","why":"Summary.","_n":"3y7b9","_k":"e28fadb0"},{"t":"“Cutting from a sweating can to a skateboarder mid-air, then warning ‘Don’t be the one who missed it,’ the ad fuses thrill with fear of exclusion, and gives its health warning only two seconds.”","why":"It links technique to effect, with evidence.","_n":"3z7e9","_k":"8f02d09b"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which caption discloses a sponsorship most clearly?","options":[{"t":"“Thanks @Zestlet!!”","why":"Thanks doesn’t say payment or a gift.","_n":"407d9","_k":"c1ef77de"},{"t":"“#sp Loving these.”","why":"The shorthand is unclear to many readers.","_n":"41809","_k":"04013aae"},{"t":"“Loving these!! … #wellness #studytok #gifted”","why":"The disclosure is buried after the pitch.","_n":"427f9","_k":"dd19e0ea"},{"t":"“Ad: Zestlet pays me for this post and sent me these. Here’s what I actually thought…”","why":"The relationship comes first, in plain words.","_n":"43829","_k":"aeb41321"}]},"b":{"prompt":"Which disclosure of an affiliate link is clearest?","options":[{"t":"“I earn a commission if you buy through my link.” (first line)","why":"Plain words, before the pitch.","_n":"44819","_k":"bb30423d"},{"t":"“Not sponsored!”","why":"A commission is a connection.","_n":"45949","_k":"eccf3941"},{"t":"“#aff” at the end","why":"Unclear and late.","_n":"46959","_k":"098508b7"},{"t":"“Link in bio 😉”","why":"That hides the relationship.","_n":"47929","_k":"526cd889"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Leila searched “best study music” and now sees ads for focus supplements. What is the most accurate explanation, and the best response?","options":[{"t":"Her phone recorded her conversations","why":"An unsupported claim; her search alone explains it.","_n":"48939","_k":"e15f4e5b"},{"t":"The ads are random, so there’s nothing to do","why":"A feed is ranked for \u003cem>you\u003c/em>, from your data, to keep you watching. It isn’t neutral.","_n":"49909","_k":"6cca5c71"},{"t":"So many ads must mean the supplements work","why":"Frequency reflects targeting and ad spending, not quality.","_n":"4a919","_k":"709b34cc"},{"t":"The platform used her search to infer an interest and target her; she can check her ad settings and treat the ads as targeted pitches, not recommendations","why":"That’s targeting based on her data.","_n":"4b8e9","_k":"4aee8817"}]},"b":{"prompt":"After liking three hiking videos, Owen’s feed fills with boot ads. What is the most accurate explanation, and the best response?","options":[{"t":"His likes signalled an interest that advertisers target; he can recognize it as targeting and adjust his ad preferences if he wants","why":"His own signals explain it, and he can act on them.","_n":"4c8f9","_k":"833a8195"},{"t":"It’s a coincidence","why":"Three likes, then boot ads: that’s the targeting rule at work.","_n":"4d8c9","_k":"9a02fbd4"},{"t":"Boot companies chose him personally","why":"Targeting works on categories of signals, not personal selection.","_n":"4e8d9","_k":"7ea261be"},{"t":"The feed shows the best boots first","why":"A feed is ranked for \u003cem>you\u003c/em>, from your data, to keep you watching. It isn’t neutral.","_n":"4f8e9","_k":"59555210"}]}},{"id":"a2","cat":"A","goal":[5,6],"a":{"prompt":"A school club needs a bake-sale ad. Which version is persuasive \u003cstrong>and\u003c/strong> ethical?","options":[{"t":"“Every $2 cupcake funds our food-bank drive; we raised $480 last year. Saturday, 11 to 2, main foyer.”","why":"Honest logos, relevant pathos, a real time: it passes every rung.","_n":"4g8d9","_k":"057a4fbb"},{"t":"“Last chance EVER to help hungry kids!!” (the sale happens monthly)","why":"False scarcity fails the honesty test.","_n":"4h8c9","_k":"bb547e68"},{"t":"“Scientifically proven best cupcakes in Canada.”","why":"An unsupported claim: false logos.","_n":"4i8b9","_k":"5c11bcb0"},{"t":"“Ms. Lee says only bad people skip this.”","why":"Guilt aimed at the reader fails the respect test.","_n":"4j929","_k":"aa779124"}]},"b":{"prompt":"A community garden needs volunteers. Which ad is persuasive \u003cstrong>and\u003c/strong> ethical?","options":[{"t":"“Real Canadians volunteer. Do you?”","why":"Shame plus a glittering generality: it fails the respect test.","_n":"4k919","_k":"ffc93846"},{"t":"“Volunteer or the garden closes forever!” (it isn’t closing)","why":"False urgency.","_n":"4l909","_k":"25a09a2c"},{"t":"“Two hours on a Saturday grows 50 kg of food for the Eastside pantry. Next work day: May 10, 9 a.m.”","why":"True detail, a relevant feeling, a real moment.","_n":"4m8f9","_k":"809db273"},{"t":"“Volunteering cures stress, guaranteed.”","why":"An unsupported guarantee.","_n":"4n869","_k":"d46735bb"}]}}]},"task":{"title":"Performance task: Persuade, honestly","summary":"Persuade, honestly","statement":"\u003cp>Write a short ad or creator caption for a cause or product. Use at least three appeals on purpose, and pass every honesty test. There are many good answers; find yours.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg rx-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Criterion\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge: appeals used accurately\u003c/td>\u003ctd>Appeals mislabelled or absent\u003c/td>\u003ctd>Some appeals accurate\u003c/td>\u003ctd>Three appeals used and labelled accurately\u003c/td>\u003ctd>Appeals interwoven precisely, each doing distinct work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking: fit to audience\u003c/td>\u003ctd>Audience vague\u003c/td>\u003ctd>Audience named but choices generic\u003c/td>\u003ctd>Choices clearly suit the audience\u003c/td>\u003ctd>Choices anticipate the audience’s beliefs and objections\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication: diction and rhythm\u003c/td>\u003ctd>Wordy or flat\u003c/td>\u003ctd>Clear but plain\u003c/td>\u003ctd>Vivid, concise, purposeful diction\u003c/td>\u003ctd>Memorable phrasing; rhythm and word order serve emphasis\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application: ethics and transparency\u003c/td>\u003ctd>Misleading claims\u003c/td>\u003ctd>Mostly honest; some vagueness\u003c/td>\u003ctd>Honest, transparent, respectful\u003c/td>\u003ctd>Honesty becomes part of the persuasion itself\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["60–90 words","Three different appeals, tagged","Logos with a real detail","A clear call to action","Urgency backed by a fact","Disclosure up front (creator captions)","Audience and craft statement"],"tips":["Trim or build. Every word should earn its place.","Mark where you build trust, stir a feeling, give a reason or pick a moment. Three different ones.","Give your reason a real number: a date, a price, an amount.","Tell the reader exactly what to do and when.","You used an urgency word. Back it up: what’s the real deadline or quantity?","Say the relationship first, in plain words.","Who is this for, and why did you make these choices?"],"explainPrompt":"Craft statement: Who is your audience? Which appeal did you lean on most, and why does it suit them? Name one word you chose carefully and the word you rejected.","explainLabel":"Craft statement","vocab":"Use ethos, pathos, logos or kairos, and audience.","success":"Your copy has every part.","more":"Try another subject or format: each complete version joins your list.","afterAt":4,"min":60,"max":90,"craftMin":40,"subjects":[{"id":"garden","t":"Eastside Community Garden volunteer drive"},{"id":"books","t":"Riverbend Secondary used-book sale"},{"id":"bottle","t":"“Loon Lake Bottles”, a refillable water bottle from a local maker"},{"id":"own","t":"A real school or community cause you’re genuinely part of"}],"ownNote":"For example, your club’s fundraiser. A real commercial brand isn’t offered, because writing its sponsored post would put words in its mouth.","ownPh":"Name the cause (e.g. our robotics club’s bottle drive)","formats":[{"id":"brand","t":"Brand ad"},{"id":"creator","t":"Creator caption (paid partnership)"},{"id":"school","t":"School announcement"}],"tags":[{"id":"ethos","t":"Ethos","role":"syntax"},{"id":"pathos","t":"Pathos","role":"figure"},{"id":"logos","t":"Logos","role":"image"},{"id":"kairos","t":"Kairos","role":"sound"},{"id":"cta","t":"Call to action","role":"theme"}],"urgency":["only","last","limited","ends","hurry","today"],"disclose":["ad","sponsored","paid partnership","sent me"],"labels":{"subject":"Subject","format":"Format","audience":"Audience: one sentence (who they are, and one thing they already care about)","audiencePh":"e.g. Grade 9 and 10 students who want cheap summer reading","copy":"Your copy","offer":"Offer details (deadline, quantity or date): required if you use urgency words","offerPh":"e.g. Sale ends Friday at 3 p.m.","tag":"Tag your own words","tagHow":"Tap words in your copy (Shift+tap or Shift+arrows for a range), then choose a tag. Tap a tag in the list to remove it.","noWords":"Write your copy first; its words appear here to tag.","clear":"Remove","notNeeded":"not needed"},"modelsLabel":"Three model responses (different approaches)","models":[{"title":"Garden, school announcement, built on pathos and kairos","text":"The first warm Saturday of spring is coming, and the Eastside garden is ready for hands. Last year, forty volunteers grew 600 kg of vegetables for the food pantry. You don’t need a green thumb, just two hours and old shoes. We’ll supply gloves, coffee and the satisfaction of pulling your first carrot. Join us May 10 at 9 a.m., behind the community centre. Bring a friend; the soil has room.","tags":"kairos (“first warm Saturday”), logos (“600 kg”), pathos (“pulling your first carrot”), call to action (“Join us May 10…”)","offer":"not needed"},{"title":"Book sale, brand ad, built on logos and plain folks","text":"Riverbend’s used-book sale: 3,000 books, every one under $3. Paperbacks a loonie, hardcovers a toonie, cookbooks you’ll actually use. Run by students, for students, with every dollar going to the library’s new graphic-novel shelf. Last year we raised $1,140. Doors open Thursday at lunch, room 114. Bring a tote bag and leave with a summer’s reading. Sale ends Friday at 3, or when the shelves are empty.","tags":"logos (“3,000 books… under $3”; “$1,140”), plain folks / ethos (“Run by students, for students”), kairos (“a summer’s reading”), call to action (“Doors open Thursday…”)","offer":"Thursday–Friday; ends Friday 3 p.m."},{"title":"Bottles, creator caption, built on ethos with honest disclosure","text":"Ad: Loon Lake Bottles sent me this one and pays me for this post. I’ve carried it for a month through two hikes and one dropped-on-the-bus disaster: not a dent. It keeps water cold for 12 hours, and the maker lives twenty minutes from me. If y
