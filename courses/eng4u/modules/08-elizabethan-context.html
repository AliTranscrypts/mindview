<script>window.MV_PAYLOAD={"meta":{"id":"08-elizabethan-context","nn":"08","slug":"elizabethan-context","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 2","groupName":"Shakespearean Tragedy, Hamlet","trivium":"Logic","size":"S","storageKey":"eng4u-08-elizabethan-context-v1","progressKey":"eng4u-progress-v1:08-elizabethan-context","toolkit":"1.0.7"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"827bb3f7","content":{"id":"08-elizabethan-context","kind":"topic","title":"Elizabethan context","topic":"Elizabethan Context","readyTopic":"the world of \u003cem>Hamlet\u003c/em>","hero":{"headline":"Every play is a conversation with its first audience.","text":"Shakespeare wrote \u003cem>Hamlet\u003c/em> for the \u003cstrong>Globe\u003c/strong>, an open-air theatre where plays ran in afternoon daylight on a nearly bare stage. His audience carried beliefs we don’t: a \u003cstrong>Great Chain of Being\u003c/strong> that ranked everything from God to stones, fierce arguments about \u003cstrong>ghosts and purgatory\u003c/strong>, and a taste for \u003cstrong>revenge tragedy\u003c/strong>. Learn their world, and the play’s words start to ring the way they first rang.","muted":"Work through the six parts in order. Your answers save on this device as you go.\u003c/p>\u003cp class='muted ez-support' role='note'>This play deals with death and despair. If any of it weighs on you, talk to someone you trust, or contact Kids Help Phone: \u003cspan class='ez-nw'>1-800-668-6868\u003c/span>, or text CONNECT to \u003cspan class='ez-nw'>686868\u003c/span>.","fig":{"html":"\u003cdiv class='ez-hero' id='ez-hero' role='group' aria-label='Hamlet’s “What a piece of work is a man” speech beside a ladder of creation: God and angels at the top, man in the middle, animals below, stones at the foot. Man’s rung rises at “like an angel… like a god”, then crumbles to dust.'>\u003c/div>","caption":""},"passage":"What a piece of work is a man! how noble in reason! how infinite in faculty! in form and moving how express and admirable! in action how like an angel! in apprehension how like a god! the beauty of the world! the paragon of animals! And yet, to me, what is this quintessence of dust?","cite":"\u003ci>Hamlet\u003c/i> 2.2.315–321","rungs":[{"id":"god","t":"God"},{"id":"angels","t":"Angels"},{"id":"man","t":"Man"},{"id":"animals","t":"Animals"},{"id":"stones","t":"Stones"}],"dust":"dust","caption":"Hamlet’s world had a ladder. He feels himself falling off it.","listen":"Listen","watch":"Watch again","noVoice":"Read it yourself: say the speech aloud, slowly."},"goals":["I can describe how the Globe’s stage and audience shaped the way \u003cem>Hamlet\u003c/em> is written.","I can explain how Elizabethan beliefs about ghosts and purgatory create Hamlet’s doubt about the Ghost.","I can identify the conventions of revenge tragedy in \u003cem>Hamlet\u003c/em> and say how Shakespeare bends them.","I can connect the Great Chain of Being and the body politic to the play’s imagery of disease and disorder.","I can compare how editions present the same passage and explain how a text feature changes meaning.","I can use context to support an interpretation without judging the past only by present values."],"start":{"blocks":[{"title":"Word story: theatre and audience","html":"\u003cp>\u003cstrong>\u003cem>Theatre\u003c/em>\u003c/strong> comes from the Greek \u003cem>theatron\u003c/em>, “a place for seeing”. But Elizabethans often spoke of going to \u003cem>hear\u003c/em> a play, and \u003cstrong>\u003cem>audience\u003c/em>\u003c/strong> comes from the Latin \u003cem>audire\u003c/em>, “to hear”.\u003c/p>\u003cp>The Globe was built for ears as much as eyes. That’s why its plays are so full of words that paint.\u003c/p>\u003cp class='tiny muted'>Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Early Modern English","goal":1,"prompt":"In “For this relief much thanks: ’tis bitter cold” (\u003ci>Hamlet\u003c/i> 1.1.8), what does \u003cem>’tis\u003c/em> mean?","options":[{"t":"this","why":"Try it: “this bitter cold” breaks the sentence.","_n":"0941","_k":"379b6652"},{"t":"it is","why":"\u003cem>’Tis\u003c/em> is the contraction of “it is”; the apostrophe marks the missing \u003cem>i\u003c/em>.","_n":"1911","_k":"d6bf73ad"},{"t":"it was","why":"The cold is happening now, on the watch.","_n":"2921","_k":"f823cec2"},{"t":"until","why":"“Until bitter cold” makes no sense here.","_n":"3971","_k":"84e82122"}],"hints":["The apostrophe marks something missing.","Which letter could go before \u003cem>t\u003c/em>?","\u003cem>i\u003c/em>: “it is”."]},{"id":"w2","skill":"Early Modern English","goal":2,"prompt":"In Shakespeare, \u003cem>thou\u003c/em>, \u003cem>thee\u003c/em> and \u003cem>thy\u003c/em> usually signal…","options":[{"t":"closeness, or speaking down to someone, while \u003cem>you\u003c/em> is more formal","why":"\u003cem>Thou\u003c/em> is for intimates, inferiors, God, and sometimes insult; \u003cem>you\u003c/em> is polite and public.","_n":"4981","_k":"6951cd35"},{"t":"prayer only","why":"Characters use it to friends and servants, and in anger.","_n":"5951","_k":"5c24720a"},{"t":"extra respect","why":"It’s the reverse: \u003cem>you\u003c/em> was the respectful form.","_n":"6961","_k":"810337b2"},{"t":"more than one person","why":"\u003cem>Thou\u003c/em> is always one person.","_n":"78b1","_k":"d10df2c0"}],"hints":["Think of French \u003cem>tu\u003c/em> and \u003cem>vous\u003c/em>.","\u003cem>Thou\u003c/em> is like \u003cem>tu\u003c/em>.","Closeness, or speaking down."]},{"id":"w3","skill":"Drama conventions","goal":1,"prompt":"Which is a \u003cstrong>soliloquy\u003c/strong>?","options":[{"t":"A character makes a quick remark that others on stage don’t hear","why":"That’s an \u003cstrong>aside\u003c/strong>. An aside happens with others present.","_n":"88c1","_k":"6efe845a"},{"t":"A character alone on stage speaks their thoughts aloud to the audience","why":"Alone, thinking aloud.","_n":"9de7","_k":"0631a3bc"},{"t":"A long speech to a crowd of characters","why":"That’s a \u003cstrong>monologue\u003c/strong>. A monologue has listeners on stage.","_n":"add7","_k":"c73c8cf6"},{"t":"Two characters argue in private","why":"That’s a dialogue.","_n":"be07","_k":"dc879082"}],"hints":["\u003cem>Solus\u003c/em>: alone.","Who’s on stage?","Only the speaker."]},{"id":"w4","skill":"Drama conventions","goal":3,"prompt":"In a tragedy’s structure, the \u003cstrong>inciting incident\u003c/strong> is…","options":[{"t":"the final catastrophe","why":"That’s where the conflict ends, not begins.","_n":"cdf7","_k":"d8c15846"},{"t":"the list of characters","why":"That’s closer to the exposition. Exposition introduces; the inciting incident ignites.","_n":"de27","_k":"c70a1f4a"},{"t":"the event that sets the main conflict in motion","why":"In \u003cem>Hamlet\u003c/em>, the Ghost’s command (1.5).","_n":"ee17","_k":"f0bab3c3"},{"t":"the moment of highest tension","why":"That’s the climax. That comes later.","_n":"fe48","_k":"407e8b3b"}],"hints":["“Incite” means to stir up.","What starts the trouble?","The event that launches the conflict."]},{"id":"w5","skill":"Using context","goal":6,"prompt":"A reader says: “The Ghost must be honest, because several characters see it.” Which question about context would test this claim best?","options":[{"t":"“Is the Ghost frightening on stage?”","why":"That mixes up effect and evidence. Fear doesn’t settle honesty.","_n":"ge38","_k":"44e4f109"},{"t":"“Did Shakespeare personally believe in ghosts?”","why":"That’s the biographical trap. We can’t know, and the play’s meaning doesn’t depend on it.","_n":"he68","_k":"7fc62a53"},{"t":"“What did the first audience believe a ghost could be: a soul, or a devil in disguise?”","why":"Seeing a spirit doesn’t prove it’s honest. The first audience’s beliefs decide what “real” could mean.","_n":"ie58","_k":"40c6a5ba"},{"t":"“Do people today believe in ghosts?”","why":"That’s presentism. That tells us about us, not the play’s world.","_n":"j6c7","_k":"b948c098"}],"hints":["The question is honesty, not existence.","What else could a spirit be, in 1600?","Ask what the first audience believed a ghost might be."]},{"id":"w6","skill":"Using context","goal":6,"prompt":"Which statement uses context responsibly?","options":[{"t":"“Context doesn’t matter; only the words count.”","why":"Words mean in a world: “incestuous” in 1.2 needs its context.","_n":"k6d7","_k":"f976acb6"},{"t":"“Because church and law condemned private revenge, Hamlet’s hesitation may reflect a real moral problem, not just weakness.”","why":"It uses context to open a possibility, and stays tentative.","_n":"l6e7","_k":"37c54bc3"},{"t":"“Elizabethans loved revenge, so Hamlet is wrong to wait.”","why":"Revenge was condemned in sermons and in law.","_n":"m6f7","_k":"37c0067a"},{"t":"“It was a different time, so we can’t judge anything in the play.”","why":"That’s the museum-piece trap. We can judge; we just judge better when we understand.","_n":"n707","_k":"024a8f08"}],"hints":["Look for a statement that’s careful and evidence-based.","Which one says “may”?","“Because church and law condemned private revenge, Hamlet’s hesitation may reflect a real moral problem, not just weakness.”"]}],"refreshers":{"Early Modern English":"Contractions (’tis, ’gainst, o’er) drop letters; \u003cem>thou\u003c/em> forms show closeness or rank. Read aloud: the rhythm often gives the meaning.","Drama conventions":"Soliloquy (alone), aside (unheard by others on stage), monologue (with listeners on stage). Structure: exposition → inciting incident → rising action → climax → falling action → catastrophe.","Using context":"Ask “What could this mean then?” before “What does it mean now?” Keep claims tentative (“may”, “suggests”) and back them with the text."}}},"explore":{"heading":"World of the play","intro":"Walk the Globe, then switch on the beliefs of its audience. Watch where each one surfaces in \u003cem>Hamlet\u003c/em>.","modes":[{"id":"globe","t":"The Globe"},{"id":"beliefs","t":"Beliefs"},{"id":"editions","t":"Two editions"}],"daylight":[{"id":"day","t":"Globe, 2 p.m."},{"id":"dark","t":"Modern theatre, lights down"}],"zones":[{"id":"yard","t":"Yard","what":"Where groundlings stood, for a penny","use":"3.2: “to split the ears of the groundlings”","used":"3.2: Hamlet mocks actors who play “to split the ears of the groundlings”","lines":["L11"]},{"id":"galleries","t":"Galleries","what":"Covered tiers of seats for richer patrons","use":"—","used":"—","lines":[]},{"id":"stage","t":"Stage","what":"The thrust platform","use":"The main playing space","used":"The main playing space: 1.1’s midnight is played here in daylight","lines":["L1"]},{"id":"trap","t":"Trapdoor and under-stage","short":"Trapdoor (under-stage)","what":"Under the stage, associated with hell","use":"The Ghost’s “Swear” from below; Hamlet: “you hear this fellow in the cellarage” (1.5.151); Ophelia’s grave (5.1)","used":"1.5: the Ghost cries “Swear” from beneath","lines":[]},{"id":"tiring","t":"Tiring house","what":"Behind the stage: doors and a curtained space","use":"Polonius behind the arras (3.4)","used":"3.4: Polonius hides behind the arras","lines":[]},{"id":"upper","t":"Upper gallery","what":"Above the stage","use":"Musicians and spectators","used":"Musicians and spectators","lines":[]},{"id":"heavens","t":"Heavens","what":"A painted canopy over the stage","use":"Hamlet’s “this majestical roof fretted with golden fire” (2.2.312–313)","used":"2.2: “this majestical roof fretted with golden fire”","lines":[]}],"ghosts":{"light":"Lighting rig","back":"Painted backdrop","not":"not at the Globe"},"opening":{"scene":"1.1 · Elsinore. A platform before the castle.","caption":"1.1. Midnight. Winter.","banner":"The sun is up. The words say it’s midnight.","replay":"Replay the opening","day":"The stage stays sunlit. The words make it midnight, and make it cold.","dark":"Lights and a painted sky can show the night. At the Globe, the words had to do it alone.","cold":"(cold)","speeches":[{"who":"Bernardo","l":["’Tis now struck twelve; get thee to bed, Francisco."]},{"who":"Francisco","l":["For this relief much thanks: ’tis bitter cold,","And I am sick at heart."]}],"cite":"(\u003ci>Hamlet\u003c/i> 1.1.7–9)"},"beliefs":[{"id":"chain","t":"Great Chain of Being and body politic","what":"Everything has its rank, from God and the angels down through humans and animals to stones. The king is the head of the state’s body, so a sick king makes a sick state.","hear":"A listener who saw the king as the head of the body politic might hear every image of rot as a sign that the crown itself is sick."},{"id":"ghosts","t":"Ghosts and purgatory","what":"Protestant England had officially rejected purgatory, yet the Ghost describes it. So a spirit might be a soul, or a devil.","hear":"A Protestant listener might fear this “father” is a devil in disguise."},{"id":"revenge","t":"Revenge","what":"Revenge tragedy thrilled audiences, while church and law condemned private revenge.","hear":"A listener taught that vengeance belongs to God might thrill at the Ghost’s command and fear it at the same time."},{"id":"melancholy","t":"Melancholy and the humours","what":"Four humours were thought to rule the body. Too much black bile made a person melancholy, and a melancholy mind was thought easy prey for the devil.","hear":"A listener who knew the humours might see in Hamlet’s black mood both a sickness and an open door for the devil."},{"id":"succession","t":"Succession","what":"In the last, heirless years of Elizabeth I, England worried about who would rule next.","hear":"A Londoner in the queen’s last years might hear Denmark’s disputed crown as a warning about who would rule England next."}],"bank":[{"id":"L1","scene":"1.1","ref":"1.1.7–9","text":"“’Tis now struck twelve; get thee to bed, Francisco.” / “For this relief much thanks: ’tis bitter cold, / And I am sick at heart.”","tags":"Stage (words make the night)","beliefs":[],"ins":[{"t":"’Tis now struck twelve; get thee to bed, Francisco.","ref":"1.1.7"},{"t":"For this relief much thanks: ’tis bitter cold, / And I am sick at heart.","ref":"1.1.8–9"}]},{"id":"L2","scene":"1.4","ref":"1.4.90","text":"“Something is rotten in the state of Denmark.”","tags":"Body politic","beliefs":["chain"]},{"id":"L3","scene":"1.5","ref":"1.5.9–13","text":"“I am thy father’s spirit, / Doom’d for a certain term to walk the night, / And for the day confined to fast in fires, / Till the foul crimes done in my days of nature / Are burnt and purged away.”","tags":"Purgatory","beliefs":["ghosts"]},{"id":"L4","scene":"1.5","ref":"1.5.189–190","text":"“The time is out of joint: O cursed spite, / That ever I was born to set it right!”","tags":"Chain of Being (order); revenge duty","beliefs":["chain","revenge"]},{"id":"L5","scene":"1.2","ref":"1.2.156–157","text":"“O, most wicked speed, to post / With such dexterity to incestuous sheets!”","tags":"Marriage to a brother’s widow seen as incest","beliefs":[]},{"id":"L6","scene":"2.2","ref":"2.2.627–632","text":"“The spirit that I have seen / May be the devil: and the devil hath power / To assume a pleasing shape; yea, and perhaps / Out of my weakness and my melancholy, / As he is very potent with such spirits, / Abuses me to damn me”","tags":"Ghosts as devils; melancholy","beliefs":["ghosts","melancholy"]},{"id":"L7","scene":"2.2","ref":"2.2.306–307","text":"“I have of late—but wherefore I know not—lost all my mirth”","tags":"Melancholy","beliefs":["melancholy"]},{"id":"L8","scene":"2.2","ref":"2.2.315","text":"“What a piece of work is a man!”","tags":"Chain of Being","beliefs":["chain"]},{"id":"L9","scene":"3.3","ref":"3.3.36","text":"“O, my offence is rank, it smells to heaven”","tags":"Chain of Being (crime against king and brother)","beliefs":["chain"]},{"id":"L10","scene":"5.2","ref":"5.2.64–65","text":"“He that hath kill’d my king and whored my mother, / Popp’d in between the election and my hopes”","tags":"Succession (elected king)","beliefs":["succession"]},{"id":"L11","scene":"3.2","ref":"3.2.10–11","text":"“to split the ears of the groundlings”","tags":"Stage and audience","beliefs":[]},{"id":"L12","scene":"1.4","ref":"1.4.69–70","text":"“What if it tempt you toward the flood, my lord, / Or to the dreadful summit of the cliff”","tags":"Ghosts as tempting spirits","beliefs":["ghosts"]}],"editions":{"intro":"The same words, punctuated (“pointed”) by two editors. Choose an edition to hear it read with a pause at each ! and comma.","a":{"t":"Edition A","segs":[["What a piece of work is a man! how noble in reason! how infinite in faculty! "],["in form and moving how express and admirable!","moving: express and admirable"],[" "],["in action how like an angel!","action: like an angel"],[" "],["in apprehension how like a god!","apprehension: like a god"],[" the beauty of the world! the paragon of animals!"]],"change":"“Like an angel” describes \u003cem>action\u003c/em>; “like a god” describes \u003cem>apprehension\u003c/em>."},"b":{"t":"Edition B","segs":[["What a piece of work is a man! how noble in reason! how infinite in faculty! in form and moving, "],["how express and admirable in action,","action: express and admirable"],[" "],["how like an angel in apprehension,","apprehension: like an angel"],[" "],["how like a god!","like a god"],[" the beauty of the world! the paragon of animals!"]],"change":"Now “like an angel” describes \u003cem>apprehension\u003c/em>, not \u003cem>action\u003c/em>."},"used":"2.2: Hamlet to Rosencrantz and Guildenstern","listen":"Listen","noVoice":"Read it yourself, pausing at each ! and comma.","choose":"Choose"},"readout":{"zone":"Zone","used":"Used in","belief":"Belief","lit":"Lines lit","hear":"What the first audience might hear","change":"Edition change"},"aha":"The play is written \u003cem>for\u003c/em> a place and a people. Bare boards make words do the lighting, and divided beliefs make the Ghost uncertain, so Hamlet’s doubt isn’t cowardice but caution.","moments":[{"id":"a","t":"(a) the Ghost’s “Swear” from below (1.5)"},{"id":"b","t":"(b) Polonius hidden behind the arras (3.4)"},{"id":"c","t":"(c) Ophelia’s grave and the gravediggers (5.1)"},{"id":"d","t":"(d) Hamlet mocking actors who play “to split the ears of the groundlings” (3.2)"},{"id":"e","t":"(e) Hamlet’s “majestical roof fretted with golden fire” (2.2)"}],"evidence":[{"id":"L3a","t":"L3a “Doom’d for a certain term to walk the night”","_n":"o717","_k":"a01c5263"},{"id":"L3b","t":"L3b “Till the foul crimes done in my days of nature / Are burnt and purged away”","_n":"p727","_k":"00f36653"},{"id":"L2","t":"L2 “Something is rotten in the state of Denmark”","_n":"q737","_k":"7c78c6d8"},{"id":"rem","t":"“Remember me” (1.5.91)","_n":"r647","_k":"0ae2250b"},{"id":"L6","t":"L6 “The spirit that I have seen / May be the devil”","_n":"s657","_k":"9641360f"},{"id":"frail","t":"“Frailty, thy name is woman!” (1.2.146)","_n":"t727","_k":"f8605ddc"}],"caseChips":{"beliefs":[{"id":"dev","t":"Spirits may be devils in disguise","_n":"u717","_k":"930ab54d"},{"id":"mel","t":"Melancholy makes a mind easy prey for the devil","_n":"v707","_k":"1cc4f333"},{"id":"chain","t":"The Chain of Being","_n":"w6f7","_k":"ec5ed5bc"},{"id":"succ","t":"Worry about the succession","_n":"x767","_k":"328130ec"}],"lines":[{"id":"L6","t":"L6 “The spirit that I have seen / May be the devil…”","_n":"y757","_k":"fe644ead"},{"id":"L4","t":"L4 “The time is out of joint…”","_n":"z747","_k":"73702cc8"},{"id":"L2","t":"L2 “Something is rotten in the state of Denmark”","_n":"10737","_k":"5f47d21a"}],"cons":[{"id":"trap","t":"He stages \u003cem>The Mousetrap\u003c/em> to watch Claudius","_n":"116a7","_k":"5489a5d1"},{"id":"pol","t":"He kills Polonius","_n":"12697","_k":"b3d9d34d"},{"id":"eng","t":"He leaves for England","_n":"13f08","_k":"6876838c"}],"labels":{"beliefs":"Belief(s)","lines":"One line","cons":"One consequence"}},"boards":{"stage":"Stage the play","stageHow":"Tap a moment, then tap the zone on the Globe where it happens. Tap a placed moment to move it.","evidence":"Purgatory evidence","evidenceHow":"Tap the lines that most directly \u003cem>describe\u003c/em> purgatory. Tap again to remove one.","hcase":"Hamlet’s case","hcaseHow":"Choose the belief(s), one line and one consequence."},"predIntro":"Make a prediction first. Then the Globe shows you what happens.","predictions":[{"id":"p1","start":{"mode":"globe","light":"day"},"prompt":"The Globe played this scene at about 2 p.m. How does the audience know it’s a freezing midnight?","options":[{"t":"From a printed program","_n":"14f18","_k":"0567efc6"},{"t":"From the characters’ words","_n":"15ee8","_k":"4df94a35"},{"t":"From lighting effects","_n":"16ef8","_k":"84d6703a"},{"t":"From painted backdrops","_n":"17f48","_k":"4d15e304"}],"explain":"“’Tis now struck twelve” and “’tis bitter cold” (1.1.7–8) build the night out of words."},{"id":"p2","start":{"mode":"globe","zone":"trap"},"prompt":"In 1.5 the Ghost cries “Swear” and Hamlet calls it “this fellow in the cellarage” (1.5.151). Where is the actor?","options":[{"t":"In the yard among the groundlings","_n":"18f58","_k":"eba2aace"},{"t":"Under the stage","_n":"19f28","_k":"79aa2727"},{"t":"In the upper gallery","_n":"1af38","_k":"bfc1e90d"},{"t":"Behind the tiring-house curtain","_n":"1be88","_k":"188df910"}],"explain":"The under-stage was linked with hell. A “father” speaking from there unsettles the audience about what he really is."},{"id":"p3","start":{"mode":"beliefs","belief":"ghosts"},"prompt":"The Ghost says he suffers in fires “Till the foul crimes done in my days of nature / Are burnt and purged away” (1.5.12–13). How might an official Protestant listener in 1600 react?","options":[{"t":"With laughter: ghosts were comic figures","_n":"1ce98","_k":"806e5dfc"},{"t":"With suspicion: purgatory had been officially rejected","_n":"1d768","_k":"82916c05"},{"t":"With comfort: everyone believed in purgatory","_n":"1e758","_k":"ab0a3c08"},{"t":"With indifference: religion didn’t matter on stage","_n":"1f788","_k":"9ad12a42"}],"explain":"The Church of England rejected purgatory (Article 22 of the Thirty-Nine Articles calls the doctrine “a fond thing vainly invented”). So who is this spirit? Hamlet asks the same question in 2.2."},{"id":"p4","start":{"mode":"editions"},"prompt":"Edition A: “in action how like an angel! in apprehension how like a god!” Edition B: “in action, how like an angel in apprehension, how like a god!” Read Edition B aloud. What changes?","options":[{"t":"Edition B removes the angel","_n":"1g778","_k":"20793374"},{"t":"Nothing: punctuation can’t change meaning","_n":"1h728","_k":"bb7006fa"},{"t":"“Like an angel” now describes understanding (apprehension), not action","_n":"1i718","_k":"4f8eeb63"},{"t":"Edition B ranks man below the animals","_n":"1j748","_k":"4a9b395a"}],"explain":"Same words, different pointing, different meaning. Early texts differ, and editors choose how to punctuate."}],"chalIntro":"Use the Globe, the belief cards and the line bank to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right board. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"\u003cstrong>Stage the play.\u003c/strong> Place five moments on the Globe’s zones: (a) the Ghost’s “Swear” from below (1.5); (b) Polonius hidden behind the arras (3.4); (c) Ophelia’s grave and the gravediggers (5.1); (d) Hamlet mocking actors who play “to split the ears of the groundlings” (3.2); (e) Hamlet’s “majestical roof fretted with golden fire” (2.2). \u003cbutton type='button' class='btn ghost sm ez-setup' data-setup='tc1'>Set it up\u003c/button>","_a":"QxBWQFhoRENKU0dAPx9EVRoIbEAWWhReVlUVP04RBRUCaRUWEFIWFWUeFQZACT0VS0ZWBQcRShVBU0UGQG5KFV0QDTlAWwNWTldZEUBuGw==","msgs":{"place":"Place all five moments on the Globe first.","c_tiring":"The grave is dug into the stage floor. Where’s the opening in the boards?","e_galleries":"The “roof” is the painted canopy over the stage: the heavens.","b_trap":"Polonius hides \u003cem>behind\u003c/em> something: the arras, in the tiring-house curtain."},"general":"Not every moment is in its zone yet. Which zones are above, below and behind the stage?","why":"The opening in the boards serves both the Ghost’s voice and Ophelia’s grave; Polonius hides in the tiring house; Hamlet’s jab at the groundlings is spoken from the front of the stage, over the yard; and the “majestical roof” is the painted heavens.","hints":["Which zones are above, below and behind the stage?","Two moments use the opening in the floor.","a, c → Trapdoor; b → Tiring house; d → front of the stage; e → Heavens."]},{"id":"tc2","goal":2,"prompt":"\u003cstrong>Find the purgatory evidence.\u003c/strong> Choose the \u003cstrong>two\u003c/strong> lines that most directly \u003cem>describe\u003c/em> purgatory. \u003cbutton type='button' class='btn ghost sm ez-setup' data-setup='tc2'>Set it up\u003c/button>","msgs":{"L6":"That’s Hamlet’s Protestant-style \u003cem>doubt\u003c/em> about the Ghost: the reaction, not the description.","rem":"A command, not a description of where he is."},"general":"Not yet. Purgatory is a time-limited suffering that cleanses sins: choose the two lines that describe it.","why":"“A certain term” makes the suffering time-limited, and “burnt and purged away” makes it cleansing: that is purgatory, described by the Ghost himself in 1.5.","hints":["Purgatory: a time-limited suffering that cleanses sins.","Look for “a certain term” and “purged”.","The two lines from the Ghost’s 1.5 self-description."]},{"id":"tc3","goal":[2,6],"stretch":true,"prompt":"\u003cstrong>Build Hamlet’s case for testing the Ghost.\u003c/strong> Link the belief(s), one line and one consequence. \u003cbutton type='button' class='btn ghost sm ez-setup' data-setup='tc3'>Set it up\u003c/button>","msgs":{"choose":"Choose at least one belief, one line and one consequence first.","oneBelief":"Hamlet gives two reasons in one breath: the devil’s power \u003cem>and\u003c/em> “my weakness and my melancholy”.","pol":"That’s later, and it’s no test: it’s rash.","L2":"That’s Marcellus, about the state, not Hamlet’s doubt."},"general":"Not yet. Read L6 to the end: which beliefs does Hamlet name, and what does he do about them?","banner":"Not cowardice: caution. In his world, acting on a devil’s word could damn him.","why":"Both beliefs, L6 and \u003cem>The Mousetrap\u003c/em>: “the play’s the thing / Wherein I’ll catch the conscience of the king” (\u003ci>Hamlet\u003c/i> 2.2.633–634).","hints":["Read L6 to the end: what two dangers does Hamlet name?","The devil’s power, and his own melancholy.","Both beliefs + L6 + \u003cem>The Mousetrap\u003c/em> (“the play’s the thing / Wherein I’ll catch the conscience of the king”)."]}],"blocks":[{"title":"The line bank, in full","html":"\u003cp class='tiny muted'>The twelve lines of the line bank, with act, scene and line. The wording follows the Globe edition of Shakespeare (Clark and Wright, 1864), which is in the public domain; line numbers in your class edition may differ by a few lines.\u003c/p>\u003cdiv id='ez-bankfull'>\u003c/div>"}]},"part3":{"slug":"then-now","name":"Then and now","heading":"Then and now","intro":"Read each moment through two lenses: a \u003cstrong>then\u003c/strong> card (the structures of the play’s world) and a \u003cstrong>now\u003c/strong> card (a modern response). Then join them in one balanced sentence.","lens":{"then":"Then","now":"Now","zoom":"Zoom to the words","unzoom":"Hide the words","thenSub":"In the play’s world","nowSub":"A modern response"},"moments":[{"id":"m1","t":"Gertrude’s remarriage","scene":"1.2","then":"Marrying a dead husband’s brother could be condemned as incest; Hamlet: “incestuous sheets” (1.2.157).","now":"Many readers see no incest, but they still see haste: “o’erhasty marriage” (Gertrude’s own words, 2.2.57).","thenQ":{"who":"Hamlet","q":"O, most wicked speed, to post / With such dexterity to incestuous sheets!","ref":"1.2.156–157"},"nowQ":{"who":"Gertrude","q":"His father’s death, and our o’erhasty marriage.","ref":"2.2.57"}},{"id":"m2","t":"Ophelia’s obedience","scene":"1.3","then":"A daughter’s duty to her father was expected and enforced.","now":"We see how few choices she has.","thenQ":{"who":"Polonius","q":"I would not, in plain terms, from this time forth, / Have you so slander any moment leisure, / As to give words or talk with the Lord Hamlet.","ref":"1.3.132–134"},"nowQ":{"who":"Ophelia","q":"I shall obey, my lord.","ref":"1.3.136"}},{"id":"m3","t":"The Ghost’s command to revenge","scene":"1.5","then":"Private revenge was condemned by church and law, yet thrilling on stage.","now":"We may ask whether the command itself is just.","thenQ":{"who":"Ghost","q":"Revenge his foul and most unnatural murder.","ref":"1.5.25"},"nowQ":{"who":"Hamlet","q":"The time is out of joint: O cursed spite, / That ever I was born to set it right!","ref":"1.5.189–190"}},{"id":"m4","t":"Hamlet’s melancholy","scene":"2.2","then":"The humours, and the belief that melancholy invites the devil.","now":"A vocabulary of grief and depression.","thenQ":{"who":"Hamlet","q":"Out of my weakness and my melancholy, / As he is very potent with such spirits, / Abuses me to damn me","ref":"2.2.630–632"},"nowQ":{"who":"Hamlet","q":"I have of late—but wherefore I know not—lost all my mirth","ref":"2.2.306–307"}}],"builder":{"title":"Join the lenses","how":"Tap a chip for each slot, then finish the sentence in your own words (8–25 words).","frame":["In the play’s world, "," — which helps explain ",". A modern reader may ",", but ",""],"slots":{"then":"then card","mom":"moment","now":"now card","end":"what both lenses together reveal"},"thenChips":["marrying a dead husband’s brother could be condemned as incest","a daughter’s obedience to her father was expected and enforced","private revenge was condemned by church and law, yet thrilled audiences on stage","melancholy was a humour thought to invite the devil"],"momChips":["Hamlet’s disgust at his mother’s remarriage","Ophelia’s “I shall obey”","the weight of the Ghost’s command","Hamlet’s fear that his melancholy makes him the devil’s prey"],"nowChips":["see no incest, yet still see haste","see how few choices she has","ask whether the command itself is just","hear grief and depression"],"endLabel":"Your ending: what both lenses together reveal","endPh":"e.g. both lenses show a son who cannot grieve at the pace the court demands","same":"✓ All three cards read the same moment.","mixed":"Your cards come from different moments. Choose a then card, a moment and a now card that read one scene.","done":"✓ Your sentence has both lenses and an ending of 8–25 words."},"blocks":[{"title":"Why two lenses?","html":"\u003cp>Context opens meaning; it doesn’t close it. Ask “What could this mean \u003cem>then\u003c/em>?” before “What does it mean to \u003cem>us\u003c/em>?” That avoids two traps: \u003cstrong>presentism\u003c/strong> (judging the past only by today’s values) and the \u003cstrong>museum piece\u003c/strong> (treating the play as if it has nothing to say now). A balanced reading needs both lenses, joined.\u003c/p>"}],"quickCheck":{"title":"Then and now: quick check","summary":"Then and now quick check","items":[{"id":"q1","goal":6,"prompt":"“Ophelia is weak because she obeys her father.” This is an example of…","choices":[{"t":"historical reading","fb":"It judges by today’s norms alone. First ask what her world allows.","_n":"1k738","_k":"acd92cb4"},{"t":"the museum-piece trap","fb":"It judges by today’s norms alone. First ask what her world allows.","_n":"1l6e8","_k":"dee2afea"},{"t":"close reading","fb":"It judges by today’s norms alone. First ask what her world allows.","_n":"1m6d8","_k":"77a797ae"},{"t":"presentism","fb":"Right. It judges by today’s norms alone. First ask what her world allows.","_n":"1ne48","_k":"9ffa5973"}]},{"id":"q2","goal":6,"prompt":"Why does Hamlet call the marriage “incestuous”?","choices":[{"t":"Gertrude is Claudius’s sister","fb":"In the play’s world, the brother-in-law marriage itself could be condemned.","_n":"1oe58","_k":"2c4c49a4"},{"t":"It’s a misprint","fb":"In the play’s world, the brother-in-law marriage itself could be condemned.","_n":"1pe68","_k":"ef3b7af8"},{"t":"It’s a metaphor for politics","fb":"In the play’s world, the brother-in-law marriage itself could be condemned.","_n":"1qe78","_k":"071050c4"},{"t":"Marrying a brother’s widow could be called incest then","fb":"Right. In the play’s world, the brother-in-law marriage itself could be condemned.","_n":"1re08","_k":"337a765b"}]},{"id":"q3","goal":6,"prompt":"Which claim uses context \u003cem>and\u003c/em> text?","choices":[{"t":"“Ghosts aren’t real.”","fb":"It ties a belief to a line. The others are generalizations or biographical guesses.","_n":"1se18","_k":"01b98c44"},{"t":"“Hamlet’s ‘May be the devil’ (2.2) reflects the Protestant fear that spirits deceive.”","fb":"Right. It ties a belief to a line. The others are generalizations or biographical guesses.","_n":"1te28","_k":"c5bf7233"},{"t":"“Shakespeare was Catholic, so…”","fb":"It ties a belief to a line. The others are generalizations or biographical guesses.","_n":"1ue38","_k":"ed8d4254"},{"t":"“Elizabethans were superstitious.”","fb":"It ties a belief to a line. The others are generalizations or biographical guesses.","_n":"1vec8","_k":"e6e19bef"}]},{"id":"q4","goal":6,"prompt":"Avoiding the museum-piece trap means…","choices":[{"t":"memorizing dates","fb":"Context should lead back to meaning now.","_n":"1wed8","_k":"85db6f8d"},{"t":"rewriting the play","fb":"Context should lead back to meaning now.","_n":"1xea8","_k":"ed688407"},{"t":"asking what the play still says to us","fb":"Right. Context should lead back to meaning now.","_n":"1ye98","_k":"d5758a85"},{"t":"ignoring history","fb":"Context should lead back to meaning now.","_n":"1ze88","_k":"7afe9e48"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“What a piece of work is a man! how noble in reason! how infinite in faculty!”\u003c/p>\u003cp class='eng-cite'>(\u003ci>Hamlet\u003c/i> 2.2.315–317)\u003c/p>\u003cp>\u003cstrong>The shape:\u003c/strong> an exclamation of wonder, then a rising series of “how [adjective] in [noun]!”\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> imitate it about anything you admire: a river, a city, a friend.\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “What a piece of work is a river! how patient in stone! how restless in spring!”\u003c/p>","prompt":"Your imitation"}],"steal":{"master":"What a piece of work is a man! how noble in reason! how infinite in faculty!","source":"Hamlet 2.2.315–317","save":"Save it to my Art of Language notebook"}},"practice":{"activities":[{"id":"match","type":"match","title":"Belief ↔ line","summary":"Belief ↔ line","goal":[2,4,6],"instruction":"Match each belief or piece of context with the line where it surfaces.","leftTitle":"Belief or context","rightTitle":"Line","left":[{"id":"l1","t":"A son’s duty to set disordered times right","goal":4,"why":"“Out of joint” is time dislocated, and Hamlet must set it right."},{"id":"l2","t":"A corrupt king makes the whole state diseased","goal":4,"why":"“Rotten” is the body politic: the state’s whole body sickens."},{"id":"l3","t":"Purgatory","goal":2,"why":"Suffering for “a certain term” until sins are “purged away”."},{"id":"l4","t":"Spirits may be devils","goal":2,"why":"Hamlet doubts the spirit: it “May be the devil”."},{"id":"l5","t":"Melancholy","goal":2,"why":"A mirthless mood with no known cause: melancholy."},{"id":"l6","t":"Marriage to a brother’s widow seen as incest","goal":6,"why":"“Incestuous” names the brother-in-law marriage as a sin."},{"id":"l7","t":"An elected king and a thwarted heir","goal":6,"why":"Denmark elects its king, and Claudius got in first.","hints":["Who chose Denmark’s king?","“Election”.","Succession."]},{"id":"l8","t":"The mixed Globe audience","goal":6,"why":"The groundlings stood in the yard, a penny a head."}],"right":[{"id":"r1","t":"“The time is out of joint: O cursed spite, / That ever I was born to set it right!” (1.5.189–190)"},{"id":"r2","t":"“Something is rotten in the state of Denmark.” (1.4.90)"},{"id":"r3","t":"“Till the foul crimes done in my days of nature / Are burnt and purged away.” (1.5.12–13)"},{"id":"r4","t":"“The spirit that I have seen / May be the devil” (2.2.627–628)"},{"id":"r5","t":"“I have of late—but wherefore I know not—lost all my mirth” (2.2.306–307)"},{"id":"r6","t":"“With such dexterity to incestuous sheets!” (1.2.157)"},{"id":"r7","t":"“Popp’d in between the election and my hopes” (5.2.65)"},{"id":"r8","t":"“to split the ears of the groundlings” (3.2.10–11)"}],"_a":"QxBbU0AJREUJEBtADgFEDRpABUBOEQoEGggVEFERShVUBhVYQEFSFRQQW1dACURFDRAbQA4FRA0aQAFAThEKABoIFRBVEUoVVAoVWEBBXhVF","wrong":{"l1|r2":"Both show disorder. “Rotten” is the diseased \u003cem>state\u003c/em>; “out of joint” is about \u003cem>time\u003c/em>, and Hamlet’s duty to mend it.","l2|r1":"Both show disorder. “Rotten” is the diseased \u003cem>state\u003c/em>; “out of joint” is about \u003cem>time\u003c/em>, and Hamlet’s duty to mend it.","l3|r4":"One \u003cem>describes\u003c/em> purgatory; the other \u003cem>doubts\u003c/em> the spirit.","l4|r3":"One \u003cem>describes\u003c/em> purgatory; the other \u003cem>doubts\u003c/em> the spirit."},"wrongDefault":"Read the line for its key word, then match the belief."},{"id":"edition","type":"mc","title":"Edition detective","summary":"Edition detective","star":true,"goal":[5,6],"instruction":"Early texts of \u003cem>Hamlet\u003c/em> differ, and editors choose. Read each pair of variants and decide what the choice changes. These sit above Final Check level: you’re reasoning about readings you haven’t seen.","items":[{"id":"d1","goal":5,"prompt":"\u003cspan class='ez-var'>“O, that this too too \u003cem>solid\u003c/em> flesh would melt” vs “too too \u003cem>sullied\u003c/em> flesh” (an editors’ reading of an early text’s “sallied”) (1.2.129)\u003c/span>What does each word stress?","options":[{"t":"\u003cem>Sullied\u003c/em> is just an old spelling of \u003cem>solid\u003c/em>","why":"Different words, different images: weight and dirt.","_n":"20e78","_k":"342c9b2c"},{"t":"\u003cem>Solid\u003c/em>: a body too heavy to dissolve; \u003cem>sullied\u003c/em>: a body stained by shame","why":"One is weight, the other is dirt: Hamlet longs to melt away, or feels defiled.","_n":"21e68","_k":"b61e0493"},{"t":"They mean the same","why":"Read them aloud: one is weight, the other is dirt.","_n":"22e58","_k":"d156b358"},{"t":"\u003cem>Solid\u003c/em>: a body stained by shame; \u003cem>sullied\u003c/em>: a body too heavy to dissolve","why":"That swaps them. \u003cem>Sullied\u003c/em> is the stain; \u003cem>solid\u003c/em> is the weight.","_n":"23e48","_k":"20eb77c4"}],"hints":["Say each word slowly.","\u003cem>Solid\u003c/em> = weight; \u003cem>sullied\u003c/em> = stain.","Weight vs shame."]},{"id":"d2","goal":5,"prompt":"\u003cspan class='ez-var'>“enterprises of great \u003cem>pith\u003c/em> and moment” vs “great \u003cem>pitch\u003c/em> and moment” (3.1)\u003c/span>What changes?","options":[{"t":"Spelling only","why":"Different words, different images.","_n":"24e38","_k":"d810d83c"},{"t":"\u003cem>Pith\u003c/em>: core strength; \u003cem>pitch\u003c/em>: height, like a falcon’s flight","why":"Different words, different images: inner strength, or a soaring height.","_n":"25f28","_k":"e06acfda"},{"t":"\u003cem>Pith\u003c/em> makes the enterprises smaller","why":"\u003cem>Pith\u003c/em> is the strong core of a thing, not a small one.","_n":"26f18","_k":"9a404d79"},{"t":"\u003cem>Pitch\u003c/em> makes the enterprises musical","why":"Here a \u003cem>pitch\u003c/em> is a height, the top of a falcon’s climb, not a musical note.","_n":"27686","_k":"aa725fbb"}]},{"id":"d3","goal":6,"prompt":"\u003cspan class='ez-var'>The soliloquy “How all occasions do inform against me” appears in the 1604–05 quarto but not in the 1623 Folio.\u003c/span>If a production cuts it, what is lost?","options":[{"t":"The only scene with Fortinbras’s army","why":"The army can still cross the stage; what goes is Hamlet’s reckoning with himself.","_n":"28696","_k":"07d080a9"},{"t":"Hamlet’s last self-accusation before he leaves for England: his resolve to make his thoughts “bloody”","why":"It’s his final self-reckoning before the long absence.","_n":"29666","_k":"a002d588"},{"t":"The play’s first mention of the Ghost","why":"The Ghost appears long before Act 4.","_n":"2a676","_k":"d3d86a46"},{"t":"Nothing important","why":"It’s his final self-reckoning before the long absence.","_n":"2b646","_k":"d9866b22"}]},{"id":"d4","goal":5,"prompt":"\u003cspan class='ez-var'>The “piece of work” passage, pointed two ways: “in action how like an angel! in apprehension how like a god!” and “how express and admirable in action, how like an angel in apprehension, how like a god!”\u003c/span>Which version makes man \u003cem>act\u003c/em> like an angel?","options":[{"t":"The version with “in action how like an angel!” as one exclamation","why":"The exclamation mark closes “in action how like an angel!”, so the angel describes action.","_n":"2c656","_k":"70a92f39"},{"t":"Both versions, equally","why":"Look at where the exclamation mark closes the phrase: the pointing regroups the words.","_n":"2d626","_k":"3a09096a"},{"t":"Neither: man is only compared to a god","why":"Both versions keep the angel; the pointing decides what it describes.","_n":"2e636","_k":"0df93d56"},{"t":"The version with “how like an angel in apprehension,”","why":"Look at where the exclamation mark closes the phrase.","_n":"2f706","_k":"2b730455"}]},{"id":"d5","goal":5,"prompt":"\u003cspan class='ez-var'>The 1603 quarto opens the famous soliloquy “To be, or not to be, ay, there’s the point”.\u003c/span>Why do most editions prefer “that is the question”?","options":[{"t":"Because it’s shorter","why":"Length isn’t the reason; the source and the meaning are.","_n":"2g716","_k":"5224a67d"},{"t":"Because the 1603 quarto was written by a different author","why":"All three early texts are \u003cem>Hamlet\u003c/em>; they differ in what was printed.","_n":"2h6e6","_k":"24f04255"},{"t":"It’s the reading of the later, fuller texts, and it frames the speech as an open inquiry","why":"The source and the meaning both favour it.","_n":"2i6d6","_k":"1559cb36"},{"t":"Because “point” was a rude word","why":"No: the choice rests on the source and the meaning.","_n":"2j706","_k":"6c538a91"}]}]},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Ishaan","goal":[1,2,6],"instruction":"Ishaan made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Explain how the Ghost’s description affects the audience.","steps":["In 1.5, the Ghost says he must suffer in fires until his crimes “Are burnt and purged away” (\u003ci>Hamlet\u003c/i> 1.5.13).","This is a description of purgatory.","Since every Elizabethan believed in purgatory, the audience would trust the Ghost completely.","So Hamlet’s delay makes him look foolish."],"_a":"Cg==","stepFb":["Sentence 1 quotes and cites correctly. Keep checking.","Sentence 2 names the doctrine correctly.","","Sentence 4 builds on sentence 3. The problem is earlier."],"fixes":[{"t":"“Purgatory had been officially rejected by the Church of England, so many listeners might suspect the Ghost, as Hamlet does in 2.2.”","why":"It states the doctrine accurately and opens the doubt Hamlet voices himself.","_n":"2k6f6","_k":"9de450b6"},{"t":"Sentence 3 is correct.","why":"Official doctrine had rejected purgatory.","_n":"2l726","_k":"f4de1011"},{"t":"“Elizabethans didn’t believe in ghosts at all.”","why":"Overcorrection: they believed spirits could appear; they argued about what spirits \u003cem>were\u003c/em>.","_n":"2m716","_k":"361fd56b"},{"t":"Delete sentence 2.","why":"Sentence 2 is accurate.","_n":"2n746","_k":"5087c779"}],"hints":["Was belief in purgatory universal?","What did the Church of England teach?","Sentence 3. Replace it with: “Purgatory had been officially rejected by the Church of England, so many listeners might suspect the Ghost, as Hamlet does in 2.2.”"]},{"id":"e2","goal":1,"task":"Explain how Shakespeare sets the opening scene.","steps":["\u003cem>Hamlet\u003c/em> opens on the castle battlements at midnight.","At the Globe, the stage was darkened with lamps to create the night.","Francisco’s “’tis bitter cold” (\u003ci>Hamlet\u003c/i> 1.1.8) adds atmosphere.","The cold also mirrors his mood: he is “sick at heart” (1.1.9)."],"_a":"CQ==","stepFb":["Correct. Keep checking.","","Sentence 3 is fine.","Sentence 4 is a good insight."],"fixes":[{"t":"Delete sentence 3.","why":"Sentence 3 is the key evidence.","_n":"2o736","_k":"f9a62a87"},{"t":"“The Globe played in daylight with no lighting, so the words themselves had to create the night.”","why":"Afternoon, open air, no lamps: the words build the night.","_n":"2p666","_k":"263e6a95"},{"t":"“The Globe used candles for night scenes.”","why":"The Globe was open-air and played in the afternoon.","_n":"2q656","_k":"2c49ecd4"},{"t":"Sentence 2 is correct.","why":"The Globe played in afternoon daylight on an almost bare stage. The words had to paint the night: “’tis bitter cold” tells you it’s a freezing midnight.","_n":"2rd67","_k":"a16129d1"}],"hints":["When did the Globe perform?","Afternoon, open-air.","Sentence 2. Replace it with: “The Globe played in daylight with no lighting, so the words themselves had to create the night.”"]},{"id":"e3","goal":6,"task":"Explain Ophelia’s choices in 1.3.","steps":["In 1.3, Polonius orders Ophelia to stop seeing Hamlet.","She answers, “I shall obey, my lord” (\u003ci>Hamlet\u003c/i> 1.3.136).","Ophelia is simply weak; a strong woman would refuse.","This shows Shakespeare didn’t value women."],"_a":"Cg==","stepFb":["Correct.","Accurate quotation and citation (align the line number to your edition).","","Sentence 4 rests on sentence 3."],"fixes":[{"t":"Sentence 3 is correct.","why":"Presentism: judging only by today’s norms.","_n":"2sd57","_k":"19205ad7"},{"t":"“In the play’s world a daughter’s obedience was expected and enforced; her ‘I shall obey’ shows how few choices she has, which a modern reader may find troubling.”","why":"Then first, now second, and both joined: a balanced reading.","_n":"2td47","_k":"a05cb49a"},{"t":"Delete the quotation.","why":"The quotation is the evidence.","_n":"2ud37","_k":"13c99657"},{"t":"“Ophelia is strong because she obeys.”","why":"That just reverses the judgment without context.","_n":"2vda7","_k":"5ff05036"}],"hints":["What choices did a daughter have then?","Then–now, not just now.","Sentence 3. Replace it with: “In the play’s world a daughter’s obedience was expected and enforced; her ‘I shall obey’ shows how few choices she has, which a modern reader may find troubling.”"]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most about the Globe: the daylight, the standing crowd, or the voice from under the stage? How does it change the way you’ll read 1.1?"},{"id":"j2","q":"In your own words: why might Hamlet’s caution about the Ghost be wisdom rather than cowardice?"},{"id":"j3","q":"Explain to a friend the difference between reading a play \u003cem>in its world\u003c/em> and judging it \u003cem>by ours\u003c/em>. Why do you need both?"},{"id":"j4","q":"Which belief from 1600 is still hardest for you to imagine holding? What would help you understand it?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from this module that you’d like to remember, and write a sentence about why it struck you.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one craft principle about reading in context: a rule you’d give a younger student. Then add the line from this module that taught it, and a sentence of your own that uses it.","placeholder":"e.g. When the stage is bare, the words must build the room.","examples":["For this relief much thanks: ’tis bitter cold, / And I am sick at heart. (\u003ci>Hamlet\u003c/i> 1.1.8–9)","O, most wicked speed, to post / With such dexterity to incestuous sheets! (\u003ci>Hamlet\u003c/i> 1.2.156–157)","Something is rotten in the state of Denmark. (\u003ci>Hamlet\u003c/i> 1.4.90)","The spirit that I have seen / May be the devil (\u003ci>Hamlet\u003c/i> 2.2.627–628)","What a piece of work is a man! how noble in reason! how infinite in faculty! (\u003ci>Hamlet\u003c/i> 2.2.315–317)"]},"artSamples":[{"p":"When the stage is bare, the words must build the room.","m":"“’tis bitter cold” (1.1.8)"},{"p":"Ask what a word meant before you decide what it means.","m":"“incestuous sheets” (1.2.157)"}],"principleMin":6},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"At the Globe, what was the “heavens”?","options":[{"t":"A painted canopy over the stage","why":"Hamlet’s “majestical roof fretted with golden fire” may point at it.","_n":"2wd97","_k":"a252a20c"},{"t":"The space under the stage","why":"That’s the trapdoor area, linked with hell.","_n":"2xd87","_k":"5d80e66d"},{"t":"The open yard","why":"The yard is where groundlings stood.","_n":"2yd77","_k":"89cacbbf"},{"t":"The top row of expensive seats","why":"The galleries held seats; the heavens hung over the stage.","_n":"2zde7","_k":"48859eae"}]},"b":{"prompt":"Who were the groundlings?","options":[{"t":"Audience members who paid a penny to stand in the yard","why":"Hamlet mocks actors who play to them (3.2).","_n":"30dd7","_k":"25158859"},{"t":"Gravediggers in 5.1","why":"“Ground” tempts you, but they’re the audience.","_n":"31d07","_k":"99fd6eab"},{"t":"Nobles seated on the stage","why":"Groundlings were the cheapest places.","_n":"32d17","_k":"1e1b3905"},{"t":"Actors who played the ghosts","why":"They were audience, not cast.","_n":"33d27","_k":"c4574d23"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In 1600, what was the Church of England’s official position on purgatory?","options":[{"t":"It had no position","why":"It stated one in its articles of faith.","_n":"34d37","_k":"1e742051"},{"t":"It taught that ghosts were always angels","why":"Spirits could be devils, which is Hamlet’s fear.","_n":"35d47","_k":"ab1279ab"},{"t":"It rejected purgatory as a doctrine","why":"So the Ghost’s description raises doubts (Article 22 of the Thirty-Nine Articles calls the doctrine “a fond thing vainly invented”).","_n":"36d57","_k":"8398f282"},{"t":"It required belief in purgatory","why":"That was Catholic teaching, which England had broken from.","_n":"37d67","_k":"aad43eb3"}]},"b":{"prompt":"Why does Hamlet fear the Ghost might be a devil?","options":[{"t":"He has been taught that the devil can “assume a pleasing shape” and prey on the melancholy","why":"His own reasoning in 2.2.","_n":"38d77","_k":"ec2d9126"},{"t":"Because the Ghost confesses it is a devil","why":"It claims to be his father’s spirit.","_n":"39d87","_k":"5179452b"},{"t":"Because ghosts were always comic","why":"Not in revenge tragedy.","_n":"3ad97","_k":"c1712b12"},{"t":"Because Horatio says ghosts don’t exist","why":"Horatio fears the Ghost; he doesn’t deny it exists.","_n":"3b627","_k":"fc9ae3ac"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which set of features is typical of Elizabethan revenge tragedy?","options":[{"t":"A ghost demanding revenge, real or feigned madness, a play-within-a-play, and a bloody final scene","why":"\u003cem>Hamlet\u003c/em> uses all four.","_n":"3c617","_k":"914a8579"},{"t":"A hero with no enemies who dies of old age","why":"Revenge tragedy needs a wrong to avenge.","_n":"3d647","_k":"bf463c3c"},{"t":"A chorus, masks, and a single location","why":"Those are features of ancient Greek drama.","_n":"3e637","_k":"a9812c32"},{"t":"Mistaken identity, disguise, and a wedding at the end","why":"That’s comedy.","_n":"3f667","_k":"36bbb6bc"}]},"b":{"prompt":"Which earlier play is the best-known model of the Elizabethan revenge tragedy?","options":[{"t":"Aristotle’s \u003cem>Poetics\u003c/em>","why":"A work of criticism, not a play.","_n":"3g657","_k":"a7b7235e"},{"t":"\u003cem>A Midsummer Night’s Dream\u003c/em>","why":"A comedy.","_n":"3h687","_k":"d6fbf41c"},{"t":"Thomas Kyd’s \u003cem>The Spanish Tragedy\u003c/em>","why":"It has a ghost, madness and a play-within-a-play (it was in print by 1592).","_n":"3i677","_k":"64a2ca55"},{"t":"\u003cem>Romeo and Juliet\u003c/em>","why":"A tragedy of love, not revenge.","_n":"3j5a7","_k":"62df57be"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Claudius says, “O, my offence is rank, it smells to heaven” (3.3.36). How does the line connect to the Chain of Being?","options":[{"t":"It proves the play is set in heaven","why":"Heaven is the top of the chain, not the setting.","_n":"3k597","_k":"ffccf503"},{"t":"Killing a king and brother breaks the order of creation; the crime’s stink rises all the way up the chain to heaven","why":"Disease and rot imagery shows a cosmic disorder.","_n":"3ldc7","_k":"57b82d96"},{"t":"It shows Claudius likes strong perfumes","why":"It’s a metaphor for sin.","_n":"3mdd7","_k":"cf6415a3"},{"t":"It means Claudius is proud of his crime","why":"“Rank” here means foul-smelling.","_n":"3nda7","_k":"ed10c539"}]},"b":{"prompt":"Marcellus says, “Something is rotten in the state of Denmark” (1.4.90). What belief does the image draw on?","options":[{"t":"Purgatory","why":"Purgatory is about the soul after death.","_n":"3odb7","_k":"30c0c167"},{"t":"The succession","why":"It’s about the state’s health, not who inherits.","_n":"3pd87","_k":"f92ab822"},{"t":"The body politic: a corrupt ruler makes the whole state sick","why":"Rot spreads from the head down.","_n":"3qd97","_k":"1c8e24f5"},{"t":"The four humours","why":"The humours are about one person’s temperament.","_n":"3rd67","_k":"4541d7c6"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Hamlet decides to test the Ghost with a play rather than kill Claudius at once. Which reasoning best uses context?","options":[{"t":"He’s simply lazy","why":"That ignores his stated reasons.","_n":"3sd77","_k":"a7a5648e"},{"t":"The Ghost told him to wait","why":"The Ghost demands revenge.","_n":"3te47","_k":"4756fed5"},{"t":"Revenge was legal, so he could wait","why":"Private revenge was condemned.","_n":"3ue57","_k":"bf814cd1"},{"t":"If spirits can be devils, acting on the Ghost’s word alone could damn Hamlet; the test is prudent","why":"Context explains the caution, and the text (2.2) states it.","_n":"3v6e7","_k":"9fd07a00"}]},"b":{"prompt":"Horatio warns the Ghost might “tempt you toward the flood” and “draw you into madness” (1.4.69–74). What belief explains his fear?","options":[{"t":"Horatio thinks Hamlet can’t swim","why":"It’s about the spirit’s power.","_n":"3w6d7","_k":"0f16972f"},{"t":"Ghosts were thought harmless","why":"Horatio fears harm.","_n":"3x6c7","_k":"28b4c2fb"},{"t":"Water was sacred","why":"The flood is a place of danger.","_n":"3y6b7","_k":"51ee3bdf"},{"t":"Evil spirits were thought to lure people to despair, self-destruction or madness","why":"So following the Ghost is dangerous.","_n":"3z6a7","_k":"9f2a3be8"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Which interpretation of Hamlet’s disgust at the marriage best balances then and now?","options":[{"t":"“It was a different time, so there’s nothing to say.”","why":"The museum-piece trap: understanding the past should lead back to meaning now.","_n":"40697","_k":"9e0bdcc8"},{"t":"“Context proves Gertrude is evil.”","why":"Context opens a possibility; it doesn’t prove a verdict.","_n":"41687","_k":"e9502904"},{"t":"“In the play’s world, marrying a brother’s widow could be called incestuous, which explains the force of ‘incestuous sheets’ (1.2.157); a modern reader may not share that view but can still see the haste.”","why":"Then first, then now, and the two joined.","_n":"42677","_k":"3eda4287"},{"t":"“Hamlet is overreacting; nobody would care today.”","why":"Presentism: it skips the play’s world.","_n":"43667","_k":"f9416948"}]},"b":{"prompt":"Which interpretation of Ophelia’s “I shall obey, my lord” (1.3.136) best balances then and now?","options":[{"t":"“We can’t judge anything about her.”","why":"The museum-piece trap: we can judge; we just judge better when we understand.","_n":"44657","_k":"6c317718"},{"t":"“She’s weak.”","why":"Presentism: first ask what choices the world of the play gives her.","_n":"45687","_k":"a3465d80"},{"t":"“Her obedience reflects a daughter’s expected duty then; for a modern reader, it shows how little room the play’s world gives her.”","why":"It reads her world first, then brings a modern view to bear.","_n":"46697","_k":"81c1e05d"},{"t":"“Context shows she secretly rebels.”","why":"No textual evidence here.","_n":"476a7","_k":"f304080f"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which sentence best explains why editions of \u003cem>Hamlet\u003c/em> differ?","options":[{"t":"“Three early printed texts survive (1603, 1604–05 and 1623) and they differ in words, lines and punctuation, so every modern editor makes choices.”","why":"There is no single fixed original: every modern edition makes choices.","_n":"486b7","_k":"ee9a57ec"},{"t":"“Shakespeare wrote three different plays called \u003cem>Hamlet\u003c/em>.”","why":"Overstatement: it’s one play, printed three times, differently.","_n":"49647","_k":"9b465160"},{"t":"“Editions differ only in modern spelling.”","why":"Words and whole passages differ.","_n":"4a657","_k":"87ea6d79"},{"t":"“The differences are printing errors with no meaning.”","why":"Some change meaning, like “solid” vs “sullied”.","_n":"4b667","_k":"1a752245"}]},"b":{"prompt":"Which explanation of the “piece of work” punctuation is clearest?","options":[{"t":"“Moving the punctuation regroups the comparisons, so ‘like an angel’ can describe either action or apprehension; the editor’s choice shapes the meaning.”","why":"It names the change and its effect.","_n":"4c677","_k":"eb19a886"},{"t":"“The second version is a mistake by Shakespeare.”","why":"Punctuation in early texts often came from printers and editors.","_n":"4d607","_k":"f0f4573d"},{"t":"“Punctuation is decoration.”","why":"Here the punctuation decides what “like an angel” describes.","_n":"4e617","_k":"c75ef429"},{"t":"“Both versions mean exactly the same.”","why":"Same words, different pointing, different meaning.","_n":"4fda8","_k":"34161b9d"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which is the best thesis for a short response on context in \u003cem>Hamlet\u003c/em>?","options":[{"t":"“Because of context, Hamlet’s delay is fully explained.”","why":"Overclaims; context alone doesn’t explain.","_n":"4gd98","_k":"bd851edc"},{"t":"“Elizabethan fears that spirits could be devils turn Hamlet’s delay into a test of conscience: his ‘May be the devil’ (2.2) makes caution, not cowardice, the heart of Act 2.”","why":"Arguable, specific, and tied to the text.","_n":"4hdc8","_k":"429aa826"},{"t":"“\u003cem>Hamlet\u003c/em> was written around 1600 at the Globe.”","why":"A fact, not a thesis.","_n":"4idb8","_k":"63cff2f9"},{"t":"“Elizabethans believed many things.”","why":"Vague: no claim about the play.","_n":"4jd68","_k":"584696a6"}]},"b":{"prompt":"Which is the best thesis about the body politic in \u003cem>Hamlet\u003c/em>?","options":[{"t":"“The play’s images of rot, from Marcellus’s ‘Something is rotten’ (1.4) to Claudius’s ‘offence is rank’ (3.3), show a crime at the top poisoning the whole of Denmark.”","why":"Arguable, specific, and tied to two lines.","_n":"4kd58","_k":"9c29965f"},{"t":"“Kings were important to Elizabethans.”","why":"Vague context: no claim about the play.","_n":"4ld88","_k":"23eeb716"},{"t":"“There is disease imagery in \u003cem>Hamlet\u003c/em>.”","why":"An observation only: no claim about what it does.","_n":"4md78","_k":"aa9d4b18"},{"t":"“Disease imagery proves Shakespeare was a doctor.”","why":"A biographical leap the text can’t support.","_n":"4ne28","_k":"ac95ae65"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"A modern production shows snow on stage and cuts “’tis bitter cold, / And I am sick at heart” (1.1.8–9). What is lost?","options":[{"t":"The words do double work, building the cold night and Francisco’s unease; the snow can’t show “sick at heart”","why":"The line carries the weather and the mood.","_n":"4oe18","_k":"17954dd0"},{"t":"The play becomes shorter, which is always worse","why":"An irrelevant judgment: the question is what the words did.","_n":"4pd48","_k":"0a6ba8a6"},{"t":"The audience can no longer see the stage","why":"Irrelevant: the stage is still visible.","_n":"4qd58","_k":"40c07a66"},{"t":"Nothing; the snow shows the cold","why":"The line also carries mood.","_n":"4rd28","_k":"cd2ad34a"}]},"b":{"prompt":"Why might a play full of philosophy also include a ghost, swordplay and bawdy jokes?","options":[{"t":"Because Shakespeare disliked philosophy","why":"A biographical guess the play contradicts.","_n":"4sd38","_k":"a9f0ead2"},{"t":"Because ghosts were comic figures","why":"The Ghost is terrifying.","_n":"4td88","_k":"908c174e"},{"t":"Because the Globe required jokes by law","why":"An invented fact: no such law existed.","_n":"4ud98","_k":"cf84299e"},{"t":"To hold a mixed audience, from penny groundlings to nobles in the galleries","why":"Shakespeare wrote for the whole house at once.","_n":"4vd68","_k":"4ac8186d"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A new streaming series: after his father’s sudden death, a son finds a voicemail in which his father accuses the uncle. The son pretends to be unwell to buy time, then exposes the uncle at a public event. Which revenge-tragedy convention does the voicemail replace?","options":[{"t":"The ghost demanding revenge","why":"A message from the dead that names the killer.","_n":"4wd78","_k":"38b5a0f5"},{"t":"The play-within-a-play","why":"That’s the public exposure.","_n":"4xdc8","_k":"727c30a9"},{"t":"Feigned madness","why":"That’s pretending to be unwell.","_n":"4ydd8","_k":"83b116af"},{"t":"The bloody final scene","why":"That’s the ending, not the message that starts the revenge.","_n":"4ze68","_k":"1dbb4c25"}]},"b":{"prompt":"A new streaming series: after his father’s sudden death, a son finds a voicemail in which his father accuses the uncle. The son pretends to be unwell to buy time, then exposes the uncle at a public event. Which convention does the public exposure mirror?","options":[{"t":"The ghost","why":"That’s the voicemail.","_n":"50e58","_k":"d7df508f"},{"t":"Feigned madness","why":"That’s pretending to be unwell.","_n":"51e48","_k":"7aa116fb"},{"t":"The play-within-a-play","why":"A staged event designed to catch the guilty.","_n":"52e38","_k":"82af9e14"},{"t":"The final duel","why":"The exposure tests guilt; it isn’t the bloody end.","_n":"53ea8","_k":"595b3820"}]}}]},"task":{"title":"Performance task: Program note","summary":"Program note","statement":"\u003cp>You’re writing the program note for a new production of \u003cem>Hamlet\u003c/em>. In 150–220 words, help a modern audience understand \u003cstrong>one\u003c/strong> Elizabethan belief that changes how a scene lands.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg ez-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Category\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge (accuracy of context)\u003c/td>\u003ctd>Belief misstated\u003c/td>\u003ctd>Belief stated, with gaps\u003c/td>\u003ctd>Belief accurate\u003c/td>\u003ctd>Belief accurate and nuanced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking (link from belief to scene)\u003c/td>\u003ctd>No link\u003c/td>\u003ctd>Link asserted\u003c/td>\u003ctd>Link explained with the quotation\u003c/td>\u003ctd>Link illuminates the scene in a fresh way\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication (voice for an audience)\u003c/td>\u003ctd>Unclear\u003c/td>\u003ctd>Some clarity\u003c/td>\u003ctd>Clear and engaging\u003c/td>\u003ctd>Vivid, precise, memorable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application (then–now)\u003c/td>\u003ctd>Only one lens\u003c/td>\u003ctd>Both lenses, unjoined\u003c/td>\u003ctd>Both lenses joined\u003c/td>\u003ctd>The joining yields an insight\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["A belief chosen","A scene chosen","A quotation from that scene","Cited correctly","Then and now","Length","Easy to hear"],"tips":["Pick the one belief you’ll explain.","Pick the scene your audience should watch for.","Use the inserter so the quotation comes from your scene.","Act.scene.line in brackets, after the closing quotation mark.","Tag a sentence about 1600 and a sentence about today.","Trim or add to land between 150 and 220 words.","Split any sentence over 35 words. Your reader is in a dim theatre."],"explainPrompt":"Craft statement: What choice did you make to help a modern audience care about a 1600 belief? Name one sentence you’re proud of and say why it works.","explainLabel":"Craft statement","vocab":"Name the sentence, then say what it does for a listener in the theatre.","checkLabel":"Check my program note","success":"Your program note has every part.","more":"Try another belief or scene: each complete note joins your list.","beliefs":["Ghosts and purgatory","Spirits as devils","The Chain of Being and the body politic","Revenge","Melancholy","Succession","Incest and marriage"],"scenes":["1.1","1.2","1.4","1.5","2.2","3.2","3.3","5.2"],"labels":{"belief":"Belief","scene":"Scene","ins":"Quotation inserter","insHow":"Lines from the line bank for your scene. Tap one to insert it, with its citation, where your cursor is.","insNone":"Choose a scene to see its lines.","draft":"Your program note","tag":"Tag your sentences","tagHow":"Tag one sentence about 1600 as \u003cstrong>Then\u003c/strong> and a different sentence about today as \u003cstrong>Now\u003c/strong>.","then":"Then","now":"Now","noSent":"Write a few sentences first; they’ll appear here to tag.","long":"over 35 words"},"min":150,"max":220,"maxSentence":35,"modelsLabel":"Three model program notes (three different approaches)","models":[{"title":"Model 1 (Ghosts and purgatory, 1.5)","s":[["When the Ghost appears to Hamlet, it describes a place where it must “fast in fires, / Till the foul crimes done in my days of nature / Are burnt and purged away” (\u003ci>Hamlet\u003c/i> 1.5.11–13)."],["To Shakespeare’s first audience, that sounded like purgatory, a belief England’s official church had rejected.","then"],["So who is this spirit?"],["A loving father, or a devil wearing his face?"],["In 1600, that question was not superstition; it was serious theology."],["Listen for how carefully Hamlet tests it."],["He even stages a play to catch the king before he will trust the Ghost’s word."],["His delay is not laziness; it is the caution of a man who fears damnation."],["Tonight, you may not believe in purgatory or devils.","now"],["But you know the feeling of being given a terrible instruction by someone you love, and not knowing whether to trust it."],["Watch Hamlet’s face in 1.5."],["He is deciding who his father really is."]]},{"title":"Model 2 (Incest and marriage, 1.2)","s":[["Barely two months after his father’s funeral, Hamlet’s mother has married his uncle."],["Alone on stage, Hamlet cries out at her “most wicked speed, to post / With such dexterity to incestuous sheets!” (\u003ci>Hamlet\u003c/i> 1.2.156–157)."],["In Shakespeare’s England, a woman who married her dead husband’s brother could be condemned by the church for incest.","then"],["So Hamlet’s word is not just an insult."],["It names a sin his whole world recognized."],["Henry VIII had once used the same argument to end his own first marriage."],["Today, most of us would not call that marriage incest.","now"],["But we still understand a son’s shock when grief is hurried past, and a funeral seems to blur into a wedding."],["Notice how often the play returns to speed and haste."],["Gertrude herself later admits to “our o’erhasty marriage” (2.2.57)."],["As you watch, ask yourself: is Hamlet sickened by the sin, the speed, or the loss of the father he loved?"]]},{"title":"Model 3 (The Globe and its audience, 3.2)","s":[["Before the play-within-the-play, Hamlet gives the actors a lesson in acting."],["He mocks performers who rant “to split the ears of the groundlings” (\u003ci>Hamlet\u003c/i> 3.2.10–11)."],["The groundlings paid a penny to stand in the open yard, close enough to touch the stage, while richer playgoers sat in the galleries above.","then"],["Shakespeare wrote for all of them at once."],["With no lighting and almost no scenery, the actors had only words and bodies to hold them."],["That is why this philosophical play also has a ghost, sword fights, insults and bawdy jokes."],["Hamlet’s jab is a little unfair: his own author needed the groundlings, and so does tonight’s company."],["You may be sitting in a cushioned seat, but you belong to the same mixed crowd.","now"],["Listen for moments meant to make the whole house gasp or laugh together, and moments meant for the quiet thinker in the corner."],["Both were Shakespeare’s audience."],["So are you."]]}],"modelsNote":"The Then and Now tags show where a writer’s tags would sit; they aren’t part of the text."},"cards":[["The Globe","Open-air playhouse (1599) on the south bank of the Thames; afternoon daylight, a nearly bare stage. Example: “’tis bitter cold” (1.1.8) makes the night."],["Groundlings","Audience who paid a penny to stand in the yard. “to split the ears of the groundlings” (3.2.10–11)."],["The heavens","The painted canopy over the stage; perhaps the “majestical roof fretted with golden fire” (2.2.312–313)."],["Trapdoor and under-stage","Linked with hell; the Ghost’s voice “in the cellarage” (1.5.151); Ophelia’s grave (5.1)."],["Tiring house","Backstage, with doors and a curtained space; Polonius behind the arras (3.4)."],["Great Chain of Being","A ranked order from God through angels, humans and animals down to stones. “What a piece of work is a man!” (2.2.315)."],["Body politic","The state as a body with the king as its head; a corrupt head sickens all. “Something is rotten in the state of Denmark.” (1.4.90)."],["Purgatory","Catholic belief in a temporary, cleansing suffering after death, officially rejected by the Church of England. “burnt and purged away” (1.5.13)."],["Revenge tragedy","A genre with a ghost, a wrong to avenge, madness, a play-within-a-play and a bloody ending; Kyd’s \u003cem>The Spanish Tragedy\u003c/em>."],["Melancholy","A temperament ruled by “black bile”, thought to make the mind vulnerable. “lost all my mirth” (2.2.306–307)."],["Q1, Q2, Folio","The three early texts of \u003cem>Hamlet\u003c/em> (1603, 1604–05, 1623); they differ, so editors choose."],["Presentism","Judging the past only by today’s values. Ask “then?” before “now?”"]]}};</script>
