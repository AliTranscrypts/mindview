--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;

}
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{
margin:0;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:24px 24px;
font:400 1.0625rem/1.55 var(--font-ui);-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
img,svg{max-width:100%}
header.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--mv-top));z-index:9;background:var(--paper);border-bottom:1.5px solid var(--rule)}
.top-inner{max-width:1060px;margin:0 auto;padding:10px 18px 0}
.top-row{display:flex;align-items:center;gap:12px 18px}
.brand{flex:1 1 auto;min-width:0;line-height:1.2}
.brand b{display:block;font:600 1.3rem var(--font-math);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{display:block;font-size:.85rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--ink-2);flex:0 0 auto}
.prog-bar{width:110px;height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.prog-bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.hd-btns{display:flex;gap:8px;flex:0 0 auto}
.home-link{flex:0 0 auto}
.theme-btn{min-width:2.6em;justify-content:center}

.step{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink-2);font-weight:700;font-size:.95rem;padding:8px 8px 10px}
.step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:.8rem}
.step.done .num{background:var(--green);border-color:var(--green);color:var(--sheet)}
.step[aria-current="step"]{color:var(--ink);border-bottom-color:var(--ink)}
.save-off{max-width:1060px;margin:10px auto 0;padding:0 18px}
.save-off p{margin:0;padding:10px 14px;border-left:4px solid var(--red);background:var(--bad-bg);border-radius:6px;max-width:none}
main{max-width:1060px;margin:0 auto;padding:6px 18px 40px}
h1,h2{font-family:var(--font-math);font-weight:600;line-height:1.15;margin:0 0 .45em}
h1{font-size:clamp(1.6rem,3.6vw,2.2rem)}
h2{font-size:clamp(1.55rem,3.3vw,2rem)}
h3{font-size:1.15rem;line-height:1.3;margin:0 0 .45em}
h4{font-size:1rem;margin:0 0 .3em}
p{margin:0 0 .8em;max-width:68ch}
.muted{color:var(--ink-2)}
.tiny{font-size:.875rem}
.sheet{background:var(--sheet);border:1.5px solid var(--rule);border-radius:10px;padding:clamp(16px,3vw,30px);margin:22px 0}

.part{margin-top:30px;padding-top:24px;border-top:1.5px dashed var(--rule)}

.steps .step{position:relative}
sup{font-size:.68em;line-height:0}

.va,.p-a{color:var(--acol)} .vn,.p-n{color:var(--pen)}
.p-k{color:var(--p-k)} .p-d{color:var(--p-d)} .p-c{color:var(--p-c)} .p-b{color:var(--p-b)} .p-t{color:var(--p-t)}

.vec{position:relative;display:inline-block}

.uses{margin:10px 0 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);font-size:.95rem;max-width:68ch}
.q-prompt canvas.plot,.task + canvas.plot,.fig-sm{max-width:380px;margin-top:8px;font-weight:400}
.uses strong{font-size:.85rem;color:var(--ink-2);margin-right:6px}
.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--rule)}
.btn.sm{font-size:.92rem;padding:.45em .9em}

.btn:not(:disabled):hover{border-color:var(--pen)}
.btn.primary:not(:disabled):hover{background:var(--pen);border-color:var(--pen)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}
.hero.solo{grid-template-columns:minmax(0,1fr)}
.hero p{font-size:1.12rem}

.hero .hero-eq.sm{font-size:clamp(1.6rem,5vw,2.8rem);font-style:normal}
.hero-eq sup{font-size:.55em}
.hero-fig{margin:0;min-width:0}
.hero-fig figcaption{font:400 1.35rem var(--font-math);text-align:center;margin-top:8px;min-height:1.6em}
canvas.plot{display:block;width:100%;aspect-ratio:4/3;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);touch-action:pan-y}

.plot-wrap{position:relative}
.drag-h{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;padding:0;z-index:2;touch-action:none}
.drag-h:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.goal{padding:14px 0;border-bottom:1px solid var(--rule)}
.goal:last-child{border-bottom:0}
.goal-t{margin:0 0 8px;font-weight:700}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.rbtn{border:1.5px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.32em .9em;font-size:.92rem}
.rbtn.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.was{margin:6px 0 0}
.q{padding:18px 0;border-bottom:1.5px dashed var(--rule)}
.q:last-child{border-bottom:0}
.q-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.qn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--sheet);display:grid;place-items:center;font-weight:700;font-size:.9rem;margin-top:1px}
.q-prompt{flex:1;font-weight:700;min-width:0}
.q-prompt .m{white-space:normal}
.opt .m,.fb .m,.hints .m,.refresh .m,.read .m{white-space:normal}
.tag{flex:0 0 auto;font-size:.8rem;font-weight:700;border:1.5px solid var(--ink-2);color:var(--ink-2);border-radius:999px;padding:.1em .7em;margin-top:2px}
.tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.6em .8em;min-width:0}
.opt > span:last-child{min-width:0;overflow-wrap:anywhere}
.opt-mark{flex:0 0 auto;font-weight:700;color:var(--ink-2);min-width:1em}
.opt.picked{border-color:var(--ink);background:var(--hi-soft)}
.opt.right{border-color:var(--green);background:var(--good-bg)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg)}

.opt:not(:disabled):hover{border-color:var(--pen)}
.opt canvas.plot{margin-top:6px;aspect-ratio:4/3;max-width:220px}
.conf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}

.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fb{margin-top:12px;padding:12px 14px;border-radius:6px;border-left:4px solid var(--ink-2);background:var(--info-bg)}
.fb.good{border-left-color:var(--green);background:var(--good-bg)}
.fb.bad{border-left-color:var(--red);background:var(--bad-bg)}
.fb:focus{outline:none}
.fb p{margin:0 0 .4em;max-width:none}.fb p:last-child{margin:0}
.hints{margin-top:12px;padding:10px 14px;border:1.5px dashed var(--ink-2);border-radius:6px}
.hints p{margin:0 0 .4em;max-width:none}.hints p:last-child{margin:0}
.result{margin-top:14px}
.big-score{font:600 2.2rem/1 var(--font-math);margin:0 0 .3em}
.refresh{margin-top:12px;padding:12px 14px;border-left:4px solid var(--hi);background:var(--hi-soft);border-radius:4px}
.refresh p{margin:0}
.pg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"graph read" "ctrl read";gap:16px 28px;align-items:start}
.pg-graph{grid-area:graph;min-width:0}.pg-ctrl{grid-area:ctrl;min-width:0}.pg-read{grid-area:read;min-width:0}
.eq-cap{font:400 clamp(1.6rem,4vw,2.3rem)/1.2 var(--font-math);margin:0 0 6px;min-height:1.25em;overflow-wrap:anywhere}
.eq-cap .m{font-size:1em;white-space:normal}
.banner{min-height:1.6em;margin:0 0 8px;font-weight:700}
.banner.good{color:var(--green)}.banner.bad{color:var(--red)}
.slider{display:block;margin:0 0 6px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.slider output{font:600 1.35rem var(--font-math)}
input[type=range]{width:100%;accent-color:var(--pen);height:34px;margin:0}
.seg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:.4em .85em;font-size:.92rem;font-weight:700;min-height:34px}

.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
dl.read{margin:0}

.legend{display:grid;gap:6px;margin:0 0 12px}

.pred-q{font-weight:700}
.chal{padding:16px 0;border-bottom:1.5px dashed var(--rule)}

.sym{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 30px;align-items:start}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}

.sq{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}

.how{font-size:.95rem;color:var(--ink-2)}

.sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}

.chip-in{border:1.5px solid var(--green);background:var(--good-bg);border-radius:5px;padding:.1em .55em;font:400 1rem var(--font-math);max-width:100%}

ol.steps-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}

.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}

*{transition:none!important;animation:none!important}
}

@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }

:root:not([data-theme="light"]){--an-sound:#FF9F5A;--an-image:#5FD0CD;--an-figure:#C9A8FF;--an-syntax:#93AEFF;--an-diction:#D8D08F;--an-theme:#F49AC8;

--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}
}

--an-sound-soft:rgba(255,159,90,.17);--an-image-soft:rgba(95,208,205,.16);--an-figure-soft:rgba(201,168,255,.17);--an-syntax-soft:rgba(147,174,255,.16);
--an-diction-soft:rgba(216,208,143,.15);--an-theme-soft:rgba(244,154,200,.15)}

.an-figure{--an-c:var(--an-figure);--an-c-soft:var(--an-figure-soft)}.an-syntax{--an-c:var(--an-syntax);--an-c-soft:var(--an-syntax-soft)}
.an-diction{--an-c:var(--an-diction);--an-c-soft:var(--an-diction-soft)}.an-theme{--an-c:var(--an-theme);--an-c-soft:var(--an-theme-soft)}
mark.an,.an{background:var(--an-c-soft,var(--hi-soft));color:inherit;box-shadow:inset 0 -2.5px 0 var(--an-c,var(--ink));border-radius:3px;padding:0 .06em}

border:1.5px solid var(--an-c,var(--ink-2));border-radius:999px;padding:0 .45em;margin:0 .3em 0 .2em;vertical-align:.2em;white-space:nowrap}

@media (min-width:561px){ .brand span{white-space:normal;text-overflow:clip} }
.eng-passage{border-left:3px solid var(--rule);padding:4px 0 4px 14px;margin:0 0 12px}
ol.eng-poem{list-style:none;margin:0;padding:0;font:400 1.15rem/1.6 var(--font-math)}

/* ENG4U 08: hero ladder, World of the play (E10 Globe cutaway, belief cards + E1 line bank, two editions), Then and now
   (lens cards, sentence builder), E17 draft workspace and the Program note task. Colour tokens only; prefix ez-. */
:root{--ez-night:var(--ink)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--ez-night:var(--paper)} }
:root[data-theme="dark"]{--ez-night:var(--paper)}

/* radio groups (copied from ENG4U 06) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 8px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:4.5em}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:38px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg button:disabled{opacity:.55}
.ez-h{margin:14px 0 6px;font-size:1rem}
.ez-lab{display:block;font-weight:700;font-size:.95rem;margin:0 0 4px}
.ez-nw{white-space:nowrap}
.ez-support{font-size:.95rem !important;border-left:3px solid var(--pen);padding-left:10px}

/* ---------- hero ---------- */
.ez-hero{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:14px 16px 12px}
.ez-hgrid{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center}
.ez-ladder{display:block;width:100%;height:auto;overflow:visible}
.ez-rail{stroke:var(--p-b);stroke-width:4;stroke-linecap:round}
.ez-rung line{stroke:var(--p-b);stroke-width:3.5;stroke-linecap:round;transition:stroke .4s,stroke-width .4s}
.ez-rung text{fill:var(--ink-2);font:700 15px var(--font-ui)}
.ez-r-man text{fill:var(--ink)}
.ez-r-man{transition:transform .9s ease,opacity .9s ease}
.ez-hero.rise .ez-r-man{transform:translateY(-16px)}
.ez-hero.rise .ez-r-man line{stroke:var(--hi);stroke-width:7}
.ez-hero.crumble .ez-r-man{transform:translateY(112px);opacity:0}
.ez-gap{stroke:var(--rule);stroke-width:2;stroke-dasharray:4 4;opacity:0;transition:opacity .6s .6s}
.ez-hero.crumble .ez-gap{opacity:1}
.ez-dust{opacity:0;transition:opacity .8s .5s}
.ez-dust circle{fill:var(--ink-2)}
.ez-dust text{fill:var(--ink-2);font:italic 15px var(--font-math)}
.ez-hero.crumble .ez-dust{opacity:1}
.ez-hp{font:400 clamp(1.05rem,1.9vw,1.32rem)/1.55 var(--font-math);margin:0;max-width:none}
.ez-hero.anim .eng-w{opacity:.4}
.ez-hero.anim .eng-w.lit{opacity:1}
.ez-hcap{font:italic 400 1.08rem/1.4 var(--font-math);text-align:center;margin:10px 0 2px;opacity:0;transition:opacity .6s;max-width:none}
.ez-hero.cap-on .ez-hcap{opacity:1}
.ez-hctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:6px}

/* ---------- Explore layout ---------- */
.ez-modes{margin:0 0 10px}
.ez-body{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:start}
.ez-main{min-width:0}
.ez-readbox{border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);padding:10px 12px;min-width:0}
.ez-read-h{font-weight:700;margin:0 0 6px}
.ez-readbox .read{margin:0}
.ez-aha{font-size:.92rem;border-top:1px solid var(--rule);padding-top:8px;margin:10px 0 0}
.ez-lightrow{margin:0 0 8px}

.ez-badge circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.ez-badge text{fill:var(--ink);font-size:11px;font-weight:700}
.ez-capt{position:absolute;left:3%;top:4%;margin:0;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;padding:3px 10px;font:italic 400 1.05rem var(--font-math);opacity:0;transform:translateX(-12px);transition:opacity .6s,transform .6s;pointer-events:none}
.ez-capt.on{opacity:1;transform:none}

/* zone buttons laid over the cutaway (a list on phones) */
.ez-zones{position:absolute;inset:0;pointer-events:none}
.ez-z{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:2px 9px 2px 3px;font-size:.8rem;min-height:28px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ez-z:hover{border-color:var(--pen)}
.ez-z[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);font-weight:700}
.ez-z.target{border-style:dashed;border-color:var(--pen)}
.ez-zn{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--sheet);font-size:.72rem;font-weight:700}
.ez-zm{font-weight:700;color:var(--pen);border-left:1px solid var(--rule);padding-left:5px}
.ez-z[aria-pressed="true"] .ez-zm{color:var(--hi-ink)}
.ez-z.pulse{animation:ez-pulse 1s ease-in-out infinite}
.ez-fig.pulse-trap .ez-under{stroke:var(--pen);stroke-width:3}
@keyframes ez-pulse{0%,100%{box-shadow:0 0 0 0 var(--hi)}50%{box-shadow:0 0 0 7px var(--hi)}}

/* text panel (1.1 with frost) */
.ez-text{border-left:4px solid var(--rule);padding:4px 0 4px 12px;margin:0 0 6px}
.ez-scene{font-size:.85rem;color:var(--ink-2);margin:0 0 4px;font-style:italic}
.ez-l1 p{font:400 1.12rem/1.6 var(--font-math);margin:0 0 4px;max-width:none}
.ez-who{font:700 .72rem var(--font-ui);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-right:4px}
.ez-frost{border-radius:4px;padding:0 .12em}
.ez-frost.on{background-image:linear-gradient(var(--info-bg),var(--info-bg));background-repeat:no-repeat;background-size:100% 100%;box-shadow:inset 0 -2px 0 var(--pen)}
.ez-frost.on.fresh{animation:ez-frost 1.3s ease-out}
@keyframes ez-frost{from{background-size:0% 100%}to{background-size:100% 100%}}
.ez-cold{--an-c:var(--pen)}
.ez-note{font-size:.92rem;margin:6px 0 0}
.ez-zcard{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;margin-top:8px;background:var(--sheet)}
.ez-zcard p{margin:0 0 4px;font-size:.94rem;max-width:none}
.ez-zh{font-weight:700}
.ez-orow{margin-top:8px}

/* boards (challenges) */
.ez-board{border:1.5px dashed var(--rule);border-radius:10px;padding:8px 12px 10px;margin-top:14px}
.ez-board .ez-h{margin-top:4px}
.ez-moms{display:grid;gap:6px}
.ez-mom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.4em .7em;width:100%;min-height:36px}
.ez-mom[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink);font-weight:700}
.ez-mz{font-size:.86rem;font-weight:700;color:var(--pen)}
.ez-mz.muted{color:var(--ink-2);font-weight:400}
.ez-msel{margin:2px 0 0;font-weight:700}
.ez-chiplist{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ez-tog{display:flex;gap:.5em;align-items:baseline;text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.38em .7em;min-height:36px}
.ez-tog[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink);font-weight:700}
.ez-box{flex:0 0 auto}
#ez-cb .rg-wrap,#ez-cl .rg-wrap,#ez-cc .rg-wrap{align-items:flex-start}
#ez-cb .ez-chiplist{flex:1 1 260px}
.ez-casesum{font-size:.92rem;margin:6px 0 0}

/* belief cards + line bank */
.rg.ez-bc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.rg.ez-bc button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:.55em .75em;text-align:left;min-height:52px;font-size:.92rem}
.rg.ez-bc button[aria-checked="true"]{background:var(--an-theme-soft);border-color:var(--an-theme);font-weight:700}
.rg.ez-bc button[aria-checked="true"]::before{content:"✓ "}
#ez-bcards .rg-wrap{display:block}
#ez-bcards .rg-lab{display:block;margin-bottom:6px}
.ez-bwhat{font-size:.95rem;margin:4px 0 6px}
ol.ez-bank{list-style:none;margin:0;padding:0;display:grid;gap:0}
.ez-bl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;padding:6px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.ez-bid{font:700 .72rem var(--font-ui);background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:0 .35em;white-space:nowrap}
.ez-btext{font:400 1rem/1.5 var(--font-math);min-width:0}
.ez-bref{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.ez-tags{grid-column:2;font-size:.85rem}
.ez-bl:not(.on) .ez-btext{color:var(--ink-2)}
.ez-bankfull .ez-bl:not(.on) .ez-btext{color:var(--ink)}

/* two editions */
.ez-eds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ez-ed{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.ez-ed.on{border-color:var(--ink);border-width:2px}
.ez-edh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.ez-edtext{font:400 1.08rem/2 var(--font-math);margin:0;max-width:none}
.ez-grp.on{background:var(--an-syntax-soft);box-shadow:inset 0 -2px 0 var(--an-syntax);border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ez-grp.on::before{content:"[";color:var(--an-syntax);font-weight:700}
.ez-grp.on::after{content:"]";color:var(--an-syntax);font-weight:700}
.ez-glab{display:inline-block;font:700 .68rem/1.35 var(--font-ui);color:var(--an-syntax);background:var(--sheet);border:1.5px solid var(--an-syntax);border-radius:999px;padding:0 .4em;margin:0 .2em;vertical-align:.2em;white-space:nowrap}
.ez-rs.speaking{background:var(--hi-soft);outline:2px solid var(--ink);outline-offset:1px;border-radius:3px}

/* ---------- Part 3: Then and now ---------- */
.ez-mt{margin:8px 0 6px}
.ez-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ez-card{border:2px solid var(--ink-2);border-radius:12px;padding:10px 12px;background:var(--sheet);min-width:0}
.ez-card.ez-now{border-color:var(--pen)}
.ez-card .ez-lab{font-size:.9rem;text-transform:none}
.ez-lensmark{font-size:1.1rem;margin-right:6px}
.ez-ctext{margin:4px 0 8px;max-width:none}
.ez-zq{margin:8px 0 0;padding:4px 0 4px 10px;border-left:3px solid var(--an-theme)}
.ez-zq p{font:400 1.02rem/1.5 var(--font-math);margin:0;max-width:none}
.ez-builder{margin-top:18px;border-top:1px solid var(--rule);padding-top:6px}
.ez-sbout{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--paper)}
.ez-sent{font:400 1.1rem/1.75 var(--font-math);margin:0 0 4px;max-width:none}
.ez-slot{border-bottom:2px dashed var(--ink-2);padding:0 .15em;color:var(--ink-2)}
.ez-slot.on{border-bottom:2px solid var(--pen);background:var(--hi-soft);color:var(--ink)}
.steal-line{font:400 1.4rem/1.35 var(--font-math);margin:0 0 2px}
.art-samples{margin:0 0 14px}
.art-samples .an-note{margin-bottom:6px}
.ez-var{display:block;font:400 1.02rem/1.5 var(--font-math);border-left:3px solid var(--an-syntax);padding:2px 0 2px 10px;margin:0 0 8px}

/* ---------- task: Program note (E17) ---------- */
.ez-pn{display:grid;gap:8px;margin:8px 0}
.ez-ctrow .rg-wrap{align-items:flex-start}
.ez-ins{border:1.5px dashed var(--rule);border-radius:10px;padding:8px 10px}
.ez-inslist{display:grid;gap:6px}
.ez-insb{text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .65em;font-size:.94rem;min-height:36px}
.ez-insb:hover{border-color:var(--pen)}
.ez-dw{margin:4px 0}
.ez-dw-ta{width:100%;min-height:240px}
.ez-dw-n{font-size:.88rem}
.ez-dw-l{margin:4px 0}
.ez-dw-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:.9rem}
.ez-dw-cmp p{max-width:none;margin:0 0 4px}
.ez-dw-cmp del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.ez-dw-cmp ins{text-decoration:underline;text-decoration-thickness:2px;background:var(--hi-soft)}
ol.ez-tagl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ez-tagl li{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:space-between;align-items:center;border:1.5px solid var(--rule);border-radius:8px;padding:6px 8px}
.ez-tagl li.t,.ez-tagl li.n{border-color:var(--ink)}
.ez-tagtext{flex:1 1 260px;min-width:0;font-size:.94rem}
.ez-tagbtns{display:flex;gap:6px}
.ez-tagb{border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.2em .8em;font-size:.86rem;font-weight:700;min-height:32px}
.ez-tagb[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.ez-tagb[aria-pressed="true"]::before{content:"✓ "}
.ez-long{font-weight:700;color:var(--p-k)}
ul.ez-glance{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px;font-size:.92rem}
.ez-model{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.ez-model h5{margin:0 0 4px;font-size:.95rem}
.ez-model p{font-size:.94rem;max-width:none}
.ez-mtag{display:inline-block;font:700 .68rem/1.35 var(--font-ui);border:1.5px solid var(--ink-2);border-radius:999px;padding:0 .4em;color:var(--ink-2);vertical-align:.15em}
.ez-mtag-now{border-color:var(--pen);color:var(--pen)}
.ez-rubric{margin-top:8px}

/* ---------- narrow screens ---------- */
@media (max-width:900px){
  .ez-body{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .ez-zones{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px;pointer-events:auto}
  .ez-z{position:static;transform:none;white-space:normal;text-align:left;border-radius:8px;padding:4px 8px 4px 4px;min-height:36px}
  .ez-badge{display:inline}
  .ez-eds,.ez-cards,.ez-dw-cmp{grid-template-columns:minmax(0,1fr)}
  .ez-hgrid{grid-template-columns:84px minmax(0,1fr);gap:10px}
  .ez-capt{font-size:.9rem}
}

/* reduced motion: final frames only (the text still names the change) */
@media (prefers-reduced-motion:reduce){
  .ez-r-man,.ez-gap,.ez-dust,.ez-hcap,.ez-capt,.ez-night,.ez-spot,.ez-fill,.ez-rung line,.eng-w{transition:none !important}
  .ez-fig.swear .ez-swear{animation:none;opacity:1;transform:translateY(-36px)}
  .ez-z.pulse{animation:none;box-shadow:0 0 0 4px var(--hi)}
  .ez-frost.on,.ez-frost.on.fresh{animation:none;background:none}
}
/* dark mode: the frost becomes its text label */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ez-frost.on{background:none} }
:root[data-theme="dark"] .ez-frost.on{background:none}
