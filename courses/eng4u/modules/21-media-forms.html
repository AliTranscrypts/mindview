*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

img,svg{max-width:100%}

.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}

/* ENG4U 21 Media Forms & Conventions: hero frames, media deconstructor, four-forms stations, storyboard, convention map. */
/* radio groups (as ENG4U 12) */

/* ---------- hero ---------- */

.mf-hand .mf-c-m1 .mf-pic,.mf-hand .mf-c-m3 .mf-pic{font-family:var(--font-ui);font-weight:800;font-style:italic}
.mf-neon{border-color:var(--p-c);box-shadow:inset 0 0 0 3px var(--an-theme-soft)}
.mf-neon .mf-el{border-color:var(--p-c)}
.mf-neonlab{position:absolute;top:-.7em;right:10px;background:var(--sheet);padding:0 4px;font:700 .72rem/1.2 var(--font-ui);color:var(--p-c)}
.mf-phone{border:2px solid var(--ink);border-radius:18px;padding:10px;max-width:300px;display:grid;gap:6px;background:var(--paper)}
.mf-handle{font-weight:700;font-size:.85rem;margin:0}
.mf-p-s1{min-height:150px;justify-content:flex-end}
.mf-tagbox{margin:10px 0 0;border-top:1px dashed var(--rule);padding-top:8px}
.mf-maker{margin:0 0 8px}
.mf-menu{display:grid;gap:6px}
.mf-mg{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mf-mgl{font-size:.8rem;font-weight:700;color:var(--ink-2);min-width:5.5em}
.mf-tagb{border:1.5px solid var(--an-c,var(--rule));background:var(--sheet);color:var(--ink);border-radius:999px;padding:.2em .7em;font-size:.85rem;min-height:32px}
.mf-tagb.on{background:var(--an-c-soft);font-weight:700}
.mf-tagb.on::before{content:"✓ "}
.mf-fl{display:flex;flex-direction:column;gap:3px;font-size:.88rem;font-weight:700;margin:0 0 8px;min-width:0}
.mf-fl input,.mf-fl textarea{font:400 .95rem/1.4 var(--font-ui);border:1.5px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--sheet);color:var(--ink);width:100%;box-sizing:border-box}
.mf-grow{flex:1 1 auto}
.mf-slot{border:1.5px dashed var(--ink-2);border-radius:8px;padding:8px 10px;margin:0 0 8px;background:var(--sheet)}
.mf-slot p{margin:0 0 6px}
.mf-cred{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 8px}
.mf-add{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.mf-add .btn{margin-bottom:8px}
.mf-reallist{display:grid;gap:6px}
.mf-desc{border-left:3px solid var(--ink-2);padding:4px 10px;margin:0 0 8px}
.mf-evs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mf-ev{border:1px solid var(--rule);border-radius:999px;padding:0 .5em;font-size:.78rem}
.mf-bar{height:12px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--sheet)}
.mf-bar span{display:block;height:100%;background:var(--pen)}
.mf-audbox{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px;margin-top:10px}
.mf-audst{margin:4px 0 0;font-size:.9rem}
.mf-worked{margin-top:14px}
.mf-wk{margin:0 0 10px}
@media (max-width:860px){.mf-body{grid-template-columns:1fr}.mf-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.mf-board{grid-template-columns:1fr}.mf-cover{grid-template-columns:1fr;grid-template-areas:"mast" "img" "line" "side" "flash"}.mf-across .mf-c-m3{grid-area:line}}

/* ---------- Part 3 ---------- */
.mf-st{border-top:1px solid var(--rule);padding-top:10px;margin-top:14px}
.mf-st:first-child{border-top:0;margin-top:0}
.mf-st h3{margin:0 0 6px;font-size:1.05rem}
.mf-slotgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 10px}
.mf-gridwrap{overflow-x:auto}
.mf-grid td{vertical-align:top;min-width:96px}
.mf-cell{min-width:64px;min-height:36px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font-weight:700}
.mf-cell.ok{border-color:var(--green)}
.mf-cell.no{border-color:var(--red)}
.mf-cwhy{display:block;font-size:.76rem;line-height:1.3;margin-top:4px;color:var(--ink-2)}
.mf-s2{display:grid;gap:8px}
.mf-s2c{display:grid;gap:6px}
.mf-s2i{text-align:left;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:8px 10px;min-height:44px}
.mf-s2i.sel{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi)}
.mf-s2i.done{border-color:var(--green)}
.mf-s2f{font-weight:700}
.mf-s2forms{display:flex;flex-wrap:wrap;gap:6px}
.mf-s2done{margin:8px 0 0;padding-left:1.2em}
.mf-reading{border-left:3px solid var(--an-theme);padding:2px 10px;margin:0 0 8px}
.mf-s3row{margin:0 0 10px}

/* ---------- practice and task ---------- */
.mf-sb th[scope="row"]{white-space:nowrap}
.mf-u6{margin-top:12px}
.mf-cm{display:grid;gap:6px}
.mf-mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.mf-mini{min-height:40px}
.mf-pb{border:1.5px solid var(--rule);border-radius:8px;padding:8px 10px}
.mf-slot-claim span{color:var(--pp-claim)}
.mf-slot-evidence span{color:var(--pp-evidence)}
.mf-slot-analysis span{color:var(--pp-analysis)}
.mf-slot-link2 span{color:var(--pp-link)}
.mf-glance{margin:0;padding-left:1.1em;font-size:.92rem}
.mf-model{border-top:1px solid var(--rule);padding-top:6px;margin-top:8px}
.mf-model h5{margin:0 0 4px;font-size:.95rem}

/* dark mode: storyboard frames get a 1 px --ink-2 border */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mf-frame{border-width:1px;border-color:var(--ink-2)}}
:root[data-theme="dark"] .mf-frame{border-width:1px;border-color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){.mf-el.flash{animation:none}.mf-panel,.mf-hl,.mf-hcap,.mf-fr,.mf-frl{transition:none}}

</style>

<script>window.MV_PAYLOAD={"meta":{"id":"21-media-forms","nn":"21","slug":"media-forms","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 5","groupName":"Media Studies","trivium":"Rhetoric","size":"M","storageKey":"eng4u-21-media-forms-v1","progressKey":"eng4u-progress-v1:21-media-forms","toolkit":"1.0.9"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"264eb9a9","content":{"id":"21-media-forms","kind":"topic","title":"Media forms and conventions","topic":"Media Forms & Conventions","readyTopic":"reading media forms","hero":{"headline":"Every frame is a choice.","text":"A trailer, a podcast, a magazine cover and a social post can all tell the same story, but none of them is a window. Each is \u003cstrong>constructed\u003c/strong> from \u003cstrong>conventions\u003c/strong>: shot sizes, camera angles, cuts, music, cover lines, hooks. Learn to read that grammar and you’ll see the makers’ hands everywhere. Learn to write it, and the hands are yours.","fig":{"html":"\u003cdiv class='mf-hero' id='mf-hero' role='group' aria-label='Two lines from As You Like It, “All the world’s a stage, and all the men and women merely players”, appear on a dark stage under a sweeping spotlight. The frame pulls back: the lines sit inside a phone screen, inside a magazine page, inside a cinema frame. Four small panels slide in: a trailer, a podcast waveform, a magazine cover and a phone post. Caption: Someone built every one of these.'>\u003c/div>","caption":""},"lines":["All the world’s a stage,","And all the men and women merely players."],"cite":"(\u003ci>As You Like It\u003c/i> 2.7.139–140)","frames":["Cinema","Magazine","Phone"],"panels":[{"id":"trailer","t":"Trailer"},{"id":"podcast","t":"Podcast"},{"id":"cover","t":"Magazine cover"},{"id":"post","t":"Social post"}],"caption":"Someone built every one of these.","listen":"▶ Read it aloud","watch":"Watch again"},"goals":["I can identify the characteristics of several media forms and explain how each form shapes what it can say.","I can name conventions and techniques (shot size, angle, editing, sound, design, hooks) and analyse the effects they create.","I can explain how a media text is built for a particular purpose and audience, using evidence from the text.","I can interpret a media text’s message, including how its form and content work together.","I can use the key concepts of media literacy to ask strong questions about any media text.","I can write an analytical paragraph that links a convention to its effect and to the text’s purpose."],"start":{"blocks":[{"title":"Word story: medium and broadcast","html":"\u003cp>\u003cstrong>\u003cem>Medium\u003c/em>\u003c/strong> comes from Latin \u003cem>medius\u003c/em>, “middle”. A medium is whatever stands in the middle, between a message and the people it reaches. Its plural, \u003cem>media\u003c/em>, became a word for whole industries.\u003c/p>\u003cp>\u003cstrong>\u003cem>Broadcast\u003c/em>\u003c/strong> began on farms: to \u003cem>broadcast\u003c/em> seed was to fling it widely by hand, rather than planting it in rows. When radio arrived in the 1920s, the word was waiting. Ask yourself, as you work: what is each form \u003cem>scattering\u003c/em>, and where?\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Device and effect","goal":2,"prompt":"In a poem, the line “The wind \u003cem>whispered\u003c/em> through the empty field” uses personification. What is its most likely effect?","options":[{"t":"It makes the field feel lonely and almost alive, as if something is speaking in the emptiness.","why":"Giving the wind a human action creates mood.","_n":"0a4d","_k":"4c3bfc93"},{"t":"It is a simile because it compares the wind to a person.","why":"No \u003cem>like\u003c/em> or \u003cem>as\u003c/em>: it’s personification.","_n":"1a7d","_k":"8451713e"},{"t":"It tells us the wind was quiet.","why":"True, but what does the human verb \u003cem>add\u003c/em>?","_n":"2a6d","_k":"08225504"},{"t":"It proves the poem is set in autumn.","why":"Nothing in the line fixes the season.","_n":"3a9d","_k":"b11fd21e"}],"hints":["Name the device, then ask what feeling it creates.","Wind can’t really whisper. Why give it a voice?","It animates an empty place, making it eerie and lonely."]},{"id":"w2","skill":"Device and effect","goal":2,"prompt":"A short story ends with a one-word paragraph: “Gone.” What does the \u003cem>form\u003c/em> of that paragraph do?","options":[{"t":"It shows the writer ran out of ideas.","why":"Assume the choice is deliberate and ask why.","_n":"4a8d","_k":"c810a298"},{"t":"It is a grammatical error.","why":"Fragments are a deliberate stylistic tool.","_n":"5abd","_k":"9bb5d00f"},{"t":"Isolating one word makes the loss land hard, giving it a pause and weight that a long sentence would soften.","why":"Form creates emphasis.","_n":"6aad","_k":"c65867ec"},{"t":"Nothing. Paragraph length doesn’t matter.","why":"Read it aloud. The white space is a silence.","_n":"79dd","_k":"a2fb4ae7"}],"hints":["Picture the page: one word, alone.","What does white space do to a reader’s pace?","It forces a pause and makes the word heavy."]},{"id":"w3","skill":"Analysis vs description","goal":6,"prompt":"Which sentence \u003cem>analyses\u003c/em> rather than describes?","options":[{"t":"“The photo shows a dock and some water.”","why":"That’s what we see, not what it does.","_n":"89cd","_k":"0887f8e7"},{"t":"“The photo was taken in January.”","why":"A date isn’t an interpretation.","_n":"97c9","_k":"ea6021b3"},{"t":"“By ending on the empty dock, the photographer makes absence itself the subject.”","why":"It names a choice and its effect.","_n":"a7d9","_k":"cfa0010f"},{"t":"“The photo is very good and I liked it.”","why":"Say \u003cem>why\u003c/em>, using the choices.","_n":"b7e9","_k":"bab3cdde"}],"hints":["Look for a verb that says what a choice \u003cem>does\u003c/em>.","“Makes absence the subject” is an effect.","“By ending on the empty dock, the photographer makes absence itself the subject.”"]},{"id":"w4","skill":"Analysis vs description","goal":6,"prompt":"Which verb best upgrades “The ending shows the town is sad”?","options":[{"t":"“The ending \u003cem>has\u003c/em> sadness.”","why":"Choose a verb of analysis: suggests, implies, reveals.","_n":"c7f9","_k":"2a5b4a10"},{"t":"“The ending \u003cem>says\u003c/em> the town is sad.”","why":"The ending doesn’t \u003cem>say\u003c/em> it; you infer it.","_n":"d809","_k":"9657d634"},{"t":"“The ending \u003cem>suggests\u003c/em> the town is grieving something it cannot name.”","why":"“Suggests” signals interpretation, and “grieving” is more precise than “sad”.","_n":"e819","_k":"315537cf"},{"t":"“The ending \u003cem>is\u003c/em> the town being sad.”","why":"Unclear. What does the ending \u003cem>do\u003c/em>?","_n":"f829","_k":"91e54b54"}],"hints":["Find the verb from the analysis bank.","Suggests, implies, reveals, undercuts…","“The ending \u003cem>suggests\u003c/em> the town is grieving something it cannot name.”"]},{"id":"w5","skill":"Purpose and audience","goal":3,"prompt":"A poster uses large print, a simple map and the phrase “Your bus, your stop: here’s what’s changing.” Who is its most likely audience?","options":[{"t":"Everyone equally.","why":"Every text chooses an audience; find the evidence.","_n":"g839","_k":"4481802c"},{"t":"Tourists looking for attractions.","why":"Nothing here sells attractions.","_n":"h749","_k":"0fa53e99"},{"t":"City engineers.","why":"Engineers would get technical detail, not “your stop”.","_n":"i759","_k":"3b764f21"},{"t":"Regular transit riders who need clear, quick information.","why":"Large print, a map and “your stop” all point there.","_n":"jee9","_k":"6f04fe17"}],"hints":["Look at the words “your bus, your stop”.","Who needs a map of changed stops?","Regular riders."]},{"id":"w6","skill":"Purpose and audience","goal":3,"prompt":"A text’s main purpose is to make you \u003cem>buy\u003c/em> something. Which is it?","options":[{"t":"A post that ends “Tap the link: 20% off until Sunday.”","why":"A call to action plus a deadline: selling.","_n":"ked9","_k":"9cd5b763"},{"t":"A short poem about winter.","why":"Its purpose is to express or entertain.","_n":"lf09","_k":"4743b756"},{"t":"A weather report.","why":"Its purpose is to inform.","_n":"mef9","_k":"302e4be0"},{"t":"A city bylaw notice.","why":"Its purpose is to inform or regulate.","_n":"nf29","_k":"3a93b776"}],"hints":["Look for a call to action.","Which one mentions a price?","The post that ends “Tap the link: 20% off until Sunday.”"]}],"refreshers":{"Device and effect":"Name the technique, then ask: what does it make the reader feel, notice or believe? “Personification → the empty field feels alive and lonely.”","Analysis vs description":"Description says \u003cem>what\u003c/em>. Analysis says \u003cem>how\u003c/em> and \u003cem>why\u003c/em>: “By choosing X, the maker makes us feel Y, which serves purpose Z.”","Purpose and audience":"Purpose: inform, persuade, entertain, express, sell. Audience: find it in the evidence (words, images, design), not in your own taste."}}},"explore":{"heading":"Media deconstructor","intro":"Start with real media: a trailer, a podcast opening, a magazine cover and a post. Peel back their layers and tag the conventions. Then use the practice model to test your eye against a key, and remix it to watch the meaning change.","modes":[{"id":"layers","t":"Layers"},{"id":"tag","t":"Tag and check"},{"id":"remix","t":"Remix"}],"modeHow":{"layers":"Explore and tag freely. Turn layers on to see coloured overlays, each with a text tag. On the practice model, tap an element to read its maker’s note; on a real example, write your own.","tag":"Practice model only. Tap an element, choose its technique tags, then press \u003cstrong>Check my tags\u003c/strong> to compare with the key.","remix":"Practice model only. Swap one convention and watch the reading change in the readout."},"textsLabel":"Text","realLabel":"Real examples","practiceLabel":"Practice model: the Larchmere set","layers":[{"id":"image","t":"Image","cls":"an-image","d":"framing, shot size, angle, focal image"},{"id":"words","t":"Words","cls":"an-diction","d":"voice-over, on-screen text, cover lines, captions"},{"id":"sound","t":"Sound","cls":"an-sound","d":"diegetic or non-diegetic, music, silence"},{"id":"edit","t":"Editing and sequence","cls":"an-syntax","d":"cuts, montage, pacing, order"},{"id":"design","t":"Design","cls":"mf-design","d":"typography, layout, colour, white space"}],"tagGroups":[{"id":"shot","t":"Shot size","tags":[{"id":"els","t":"extreme long shot","lay":"image"},{"id":"ls","t":"long shot","lay":"image"},{"id":"ms","t":"medium shot","lay":"image"},{"id":"cu","t":"close-up","lay":"image"},{"id":"ecu","t":"extreme close-up","lay":"image"}]},{"id":"angle","t":"Angle","tags":[{"id":"overhead","t":"overhead (bird’s-eye)","lay":"image"},{"id":"high","t":"high angle","lay":"image"},{"id":"eye","t":"eye level","lay":"image"},{"id":"low","t":"low angle","lay":"image"}]},{"id":"edit","t":"Editing","tags":[{"id":"cut","t":"cut","lay":"edit"},{"id":"montage","t":"montage","lay":"edit"},{"id":"titlecard","t":"title card","lay":"edit"},{"id":"pacing","t":"pacing (fast or slow)","lay":"edit"}]},{"id":"sound","t":"Sound","tags":[{"id":"dieg","t":"diegetic","lay":"sound"},{"id":"nondieg","t":"non-diegetic","lay":"sound"},{"id":"vo","t":"voice-over","lay":"words"},{"id":"silence","t":"silence","lay":"sound"},{"id":"sting","t":"sting","lay":"sound"},{"id":"bed","t":"music bed","lay":"sound"}]},{"id":"design","t":"Design","tags":[{"id":"masthead","t":"masthead","lay":"design"},{"id":"focal","t":"focal image","lay":"image"},{"id":"coverline","t":"cover line","lay":"words"},{"id":"flash","t":"flash","lay":"design"},{"id":"type","t":"typography","lay":"design"},{"id":"white","t":"white space","lay":"design"}]},{"id":"social","t":"Social","tags":[{"id":"hook","t":"hook","lay":"words"},{"id":"cta","t":"call to action","lay":"words"},{"id":"hashtag","t":"hashtag","lay":"words"},{"id":"comment","t":"comment preview","lay":"words"}]}],"excl":[["els","ls","ms","cu","ecu"],["overhead","high","eye","low"],["dieg","nondieg"]],"practice":[{"id":"T1","chip":"T1 Trailer","title":"No Ice This Year","kind":"trailer","head":"\u003cem>No Ice This Year\u003c/em>, a short documentary: trailer storyboard, 8 frames, 0:00–0:56","form":"Documentary trailer (time-based, moving image, sound)","purpose":"Persuade you to watch; build feeling","aud":"Local families; documentary viewers","ev":["on-screen text","library screening"],"els":[{"id":"F1","ref":"F1 · 0:00","pic":"Overhead extreme long shot: grey open water, one tiny empty dock","snd":"Wind (heard in the scene)","key":["els"],"also":["overhead","dieg"],"note":"Why overhead? It makes the dock tiny against the water.","sug":"The dock shrinks to a speck: the missing ice feels vast, bigger than any one person.","kc":"All media are constructions"},{"id":"F2","ref":"F2 · 0:06","pic":"Long shot: an empty festival field; stacked, unused lantern moulds","snd":"Wind fades; a single piano note (music only we hear)","key":["ls"],"also":["nondieg","cut"],"note":"Why a long shot? It shows the whole empty field, so the absence has a shape.","sug":"The single piano note tells us how to feel: this emptiness is a loss, not just a quiet field.","kc":"All media are constructions"},{"id":"F3","ref":"F3 · 0:12","pic":"Close-up: an elder’s hands turning an old festival photograph","snd":"Voice-over (Ruth Mercier, 79): “Forty winters, and I never missed one.”","key":["cu"],"also":["vo","cut"],"note":"Why a close-up? Hands and a photo make the memory personal.","sug":"The town’s loss gets a face, or at least a pair of hands: the grief becomes one person’s.","kc":"All media are constructions"},{"id":"F4","ref":"F4 · 0:20","pic":"Medium shot, eye level: Dev, 17, on the dock, phone in hand","snd":"Voice-over (Dev): “My grandmother says the lake used to sing.”","key":["ms"],"also":["eye","vo","cut"],"note":"Why eye level? We meet Dev as an equal, not a hero yet.","sug":"Dev is ordinary and close to us: the story passes from the elder to the young.","kc":"Audiences negotiate meaning"},{"id":"F5","ref":"F5 · 0:28","pic":"Extreme close-up: a thermometer taped to a shed: +3 °C","snd":"The music cuts out: silence","key":["ecu"],"also":["silence","cut"],"note":"Why silence here? The missing music makes the number land.","sug":"One detail fills the frame and the sound drops away: the fact feels like a held breath.","kc":"All media are constructions"},{"id":"F6","ref":"F6 · 0:34","pic":"Montage: six quick cuts of archive footage (skaters, glowing lanterns, children) in four seconds","snd":"Music swells","key":["montage"],"also":["pacing","cut","nondieg","bed"],"note":"Why a montage? Fast cuts flood the screen with what is gone.","sug":"Memory rushes back all at once: what the town has lost feels huge and bright.","kc":"All media are constructions"},{"id":"F7","ref":"F7 · 0:44","pic":"Low angle: Dev standing on the dock against the sky","snd":"On-screen text: “This winter, they’re building a festival without ice.”","key":["low"],"also":["cut"],"note":"Why a low angle? We look up at Dev, so he seems strong.","sug":"Looking up at Dev makes him seem strong, a turning point from loss to action.","kc":"All media are constructions"},{"id":"F8","ref":"F8 · 0:52","pic":"Title card: white serif letters on black, “NO ICE THIS YEAR”","snd":"One sharp crack of ice","key":["titlecard"],"also":["type","cut","dieg","nondieg"],"note":"Why end on a title card? It names the loss and closes the sequence.","sug":"Plain letters on black, then a crack of ice: the title lands like a verdict.","kc":"Form and content are closely related"}]},{"id":"T2","chip":"T2 Podcast","title":"Small Town, Big Sky","kind":"podcast","head":"\u003cem>Small Town, Big Sky\u003c/em>, episode 12, “The Lake That Forgot”: podcast intro, 0:00–0:45","form":"Podcast intro (time-based, sound only)","purpose":"Hook listeners; build trust in the host","aud":"Regular listeners; people who know small towns","ev":["a local host","a sponsor from the town"],"els":[{"id":"c1","ref":"0:00 · boots","pic":"Cold open, no music: boots on slush (recorded on the dock)","snd":"Field recording","key":["dieg"],"also":[],"note":"Why start with boots? We arrive on the dock before we know the show.","sug":"A real place, heard first: the episode feels like it begins in the world, not in a studio.","kc":"All media are constructions"},{"id":"c2","ref":"0:00 · Ruth","pic":"Ruth’s voice: “At night we’d hear it: a long groan, like a whale under the ice.”","snd":"Recorded on the dock","key":["dieg"],"also":[],"note":"Why her memory first? A human voice hooks us before any branding.","sug":"Her simile makes the lost sound vivid: we want to hear what the lake used to do.","kc":"All media are constructions"},{"id":"c3","ref":"0:09 · silence","pic":"One second of silence","snd":"Nothing","key":["silence"],"also":["pacing","cut"],"note":"Why a silence? It lets the whale image hang in the air.","sug":"The gap sounds like the missing groan of the ice itself.","kc":"Form and content are closely related"},{"id":"c4","ref":"0:10 · sting","pic":"Theme music sting (banjo and synth), 5 seconds","snd":"Added music","key":["nondieg","sting"],"also":[],"note":"Why a sting now? It announces that the show has begun.","sug":"Banjo for the small town, synth for the present day: the brand arrives after the hook.","kc":"Form and content are closely related"},{"id":"c5","ref":"0:15 · music bed","pic":"Music bed under the host","snd":"Added music, low","key":["nondieg","bed"],"also":[],"note":"Why a music bed? It tells us the show has begun and how to feel.","sug":"Warm and steady: the bed frames the host as a familiar guide.","kc":"All media are constructions"},{"id":"c6","ref":"0:15 · host","pic":"Host: “From Larchmere, Ontario, this is \u003cem>Small Town, Big Sky\u003c/em>. I’m Rowan Achebe.”","snd":"Studio voice","key":["vo"],"also":["nondieg"],"note":"Why name the town first? Place is the show’s promise.","sug":"The host speaks to us directly: a guide we can trust.","kc":"Audiences negotiate meaning"},{"id":"c7","ref":"0:24 · host","pic":"Host: “This winter, for the first time in forty years, the lake didn’t freeze. Today: what a town loses when its winter goes missing.”","snd":"Studio voice","key":["vo"],"also":["nondieg","hook"],"note":"Why state the stakes now? Specific numbers and a question keep us listening.","sug":"“Forty years” and “goes missing” turn weather into a mystery.","kc":"All media are constructions"},{"id":"c8","ref":"0:33 · sponsor","pic":"Host-read sponsor message: “This episode is supported by Larchmere Hardware, open late every Thursday.”","snd":"Studio voice","key":["vo"],"also":["nondieg","cta"],"note":"Why does the host read the ad? A trusted voice sells better.","sug":"The intimacy that makes the story feel close also makes the ad feel like a neighbour’s advice.","kc":"Media have commercial implications"}]},{"id":"T3","chip":"T3 Cover","title":"Northbound","kind":"cover","head":"\u003cem>Northbound\u003c/em>, February issue: magazine cover (a fictional regional magazine)","form":"Magazine cover (print, seen in a glance)","purpose":"Sell the issue; rank its stories","aud":"Adults who travel to cottage country","ev":["cabins under $150","snowshoe gear","classic serif type"],"els":[{"id":"m1","ref":"Masthead","pic":"NORTHBOUND","snd":"Heavy capitals across the top","key":["masthead"],"also":["type"],"note":"Why so big? The masthead is the brand you spot across a newsstand.","sug":"The name promises the north: travel, cold, open space.","kc":"Media have commercial implications"},{"id":"m2","ref":"Focal image","pic":"Ruth holding an unlit ice lantern on a bare dock","snd":"The largest picture on the cover","key":["focal"],"also":[],"note":"Why an unlit lantern? It’s the festival that didn’t happen, in one object.","sug":"An elder with a dark lantern: memory and loss, aimed at adult readers.","kc":"All media are constructions"},{"id":"m3","ref":"Main cover line","pic":"“The Winter That Didn’t Come”","snd":"Small type at the bottom","key":["coverline"],"also":["type","white"],"note":"Why does size matter? The biggest words win the first glance.","sug":"Placed small and low, the climate story reads as one story among several.","kc":"All media are constructions"},{"id":"m4","ref":"Secondary cover lines","pic":"“12 Cozy Cabins Under $150” · “Snowshoe Gear, Tested”","snd":"Smaller lines down the side","key":["coverline"],"also":["type"],"note":"Why cabins and gear? They tell us who buys this magazine.","sug":"Prices and tested gear point to adults with money and time for trips.","kc":"Media have commercial implications"},{"id":"m5","ref":"Corner flash","pic":"“Special Climate Issue”","snd":"A small burst in the corner","key":["flash"],"also":["type"],"note":"Why a flash? It signals something new about this issue.","sug":"“Special” sells the issue as one to keep.","kc":"Media have commercial implications"}]},{"id":"T4","chip":"T4 Post","title":"@larchmere.lantern.kid","kind":"post","head":"A post by the creator @larchmere.lantern.kid (Dev)","form":"Social post (image and caption, seen in a scrolling feed)","purpose":"Stop the scroll; get people to come","aud":"Local followers; friends and families in Larchmere","ev":["the library lawn","hashtags for the town"],"els":[{"id":"s1","ref":"Image","pic":"A vertical photo of a paper lantern glowing above open black water","snd":"Fills a phone screen","key":["focal"],"also":["white"],"note":"Why vertical? It fills the phone, so the light fills the feed.","sug":"One small light over black water: hope against the missing ice.","kc":"All media are constructions"},{"id":"s2","ref":"Caption, first line","pic":"“40 years of ice lanterns. Zero ice this year.”","snd":"The line a scroller sees first","key":["hook"],"also":[],"note":"Why numbers? Contrast and specifics stop a scrolling thumb.","sug":"Forty against zero: the contrast creates curiosity and stakes.","kc":"Form and content are closely related"},{"id":"s3","ref":"Caption, rest","pic":"“So we’re making them out of paper. Come Saturday, 6 pm, library lawn.”","snd":"A time and a place","key":["cta"],"also":[],"note":"Why the time and place? A post can ask you to do something now.","sug":"Loss turns into an invitation with a deadline.","kc":"Form and content are closely related"},{"id":"s4","ref":"Hashtags","pic":"#LarchmereLights #NoIceThisYear","snd":"Searchable tags","key":["hashtag"],"also":[],"note":"Why hashtags? They join the post to a shared conversation.","sug":"The town’s story becomes something others can find and add to.","kc":"Audiences negotiate meaning"},{"id":"s5","ref":"Comment preview","pic":"“my nan cried when she saw this 🧡”","snd":"Shown under the post","key":["comment"],"also":[],"note":"Why show a comment? Other people’s feelings tell us how to feel.","sug":"One reader’s tears become social proof: this post matters.","kc":"Audiences negotiate meaning"}]}],"real":[{"id":"R1","chip":"R-T1 Trailer","kind":"trailer","form":"Trailer (time-based, moving image, sound)","criteria":"An official trailer, 1–3 minutes, with at least three shot sizes, one moment of silence or sound shift, and a closing title card.","task":"Tag at least 6 elements across image, sound and editing; write a maker’s note for 2 of them.","credit":{"title":"","maker":"","outlet":"","date":""},"desc":""},{"id":"R2","chip":"R-T2 Podcast","kind":"podcast","form":"Podcast or radio opening (time-based, sound only)","criteria":"The first 30–60 seconds of an episode, with a cold open or theme music, and a host introduction.","task":"Tag every sound cue (diegetic or non-diegetic, music, silence); explain the order.","credit":{"title":"","maker":"","outlet":"","date":""},"desc":""},{"id":"R3","chip":"R-T3 Cover","kind":"cover","form":"Magazine cover (print, seen in a glance)","criteria":"A current cover with a masthead, a focal image, a main cover line and at least two secondary cover lines.","task":"Tag the design conventions; infer the audience from at least 3 pieces of evidence.","credit":{"title":"","maker":"","outlet":"","date":""},"desc":""},{"id":"R4","chip":"R-T4 Post","kind":"post","form":"Social post (image or video and caption, seen in a feed)","criteria":"A public post from an organization or creator, with an image or video, a caption with a hook, and a call to action or hashtags.","task":"Tag the hook, call to action and other social conventions; say what the first line does.","credit":{"title":"","maker":"","outlet":"","date":""},"desc":""}],"realNote":"\u003cstrong>Real-example slot.\u003c/strong> Your teacher chooses a current example that meets these criteria and credits it here. If the slot is empty, use any example that meets them (your teacher can suggest one), or practise on the Larchmere set first.","realAdd":"Add an element","realAddPh":"e.g. 0:12, the opening shot, the masthead, the first line","realNotePh":"Why this choice? What does it make us feel, notice or believe?","realCredit":{"title":"Title","maker":"Maker","outlet":"Outlet or platform","date":"Date"},"larchmere":"\u003cstrong>The Larchmere set\u003c/strong> is fictional, made for the course: the town, people, outlets and creator are invented. Four texts tell one story: the winter the lake in Larchmere, Ontario, didn’t freeze, and the town’s ice-lantern festival was cancelled. It’s fictional for two reasons: the challenges need a fixed answer key, and Remix changes a text, which a real maker’s work should never be shown doing.","readout":{"form":"Form","purpose":"Purpose","aud":"Likely audience","sel":"Selected element","sug":"What this choice suggests","tags":"Tags placed","credit":"Credit","kc":"Key concept in play"},"remix":{"F6":{"label":"Frame F6","options":[{"id":"montage","t":"Montage of archive footage (as made)","pic":"Montage: six quick cuts of archive footage (skaters, glowing lanterns, children) in four seconds","sug":"Memory rushes back all at once: what the town has lost feels huge and bright."},{"id":"lantern","t":"Extreme close-up: one cracked old lantern","pic":"Extreme close-up: one cracked old lantern","sug":"Intimate, personal grief: one broken object holds one family’s loss."},{"id":"lake","t":"Extreme long shot: the empty lake","pic":"Extreme long shot: the empty lake, grey to the horizon","sug":"Scale: a whole town’s absence."}]},"c5":{"label":"Music bed at 0:15","options":[{"id":"on","t":"Music bed on (as made)","sug":"Warm and steady: the bed tells us the show has begun and frames the host as a familiar guide."},{"id":"off","t":"Music bed off","sug":"Stark and documentary-like: with nothing under it, the host’s voice becomes more intimate and we lean in."}]},"m3":{"label":"Main cover line","options":[{"id":"bottom","t":"Small type at the bottom","sug":"Placed small and low, the climate story reads as one story among several."},{"id":"across","t":"Large type across the focal image","sug":"The climate story now dominates: the issue’s emphasis shifts to the missing winter."}]},"s2":{"label":"Caption hook","options":[{"id":"forty","t":"“40 years of ice lanterns. Zero ice this year.” (as made)","pic":"“40 years of ice lanterns. Zero ice this year.”","sug":"Forty against zero: the contrast creates curiosity and stakes.","stop":78},{"id":"cancel","t":"“Festival cancelled 😞”","pic":"“Festival cancelled 😞”","sug":"A generic sad feeling: easy to scroll past.","stop":31}]}},"stopLabel":"Thumb-stop m&#101;ter (model)","stopNote":"A model of how many scrollers might stop, not real data.","audience":{"label":"Audience remix (challenge 3)","how":"Change the cover for a new audience. The budget is three changes from the default.","rows":[{"id":"focal","t":"Focal image","options":[{"id":"def","t":"Ruth with an unlit lantern","p":""},{"id":"teen","t":"Dev and two friends launching paper lanterns","p":"teen"},{"id":"aerial","t":"Aerial photo of the lake (neutral)","p":""}]},{"id":"line","t":"Main cover line","options":[{"id":"def","t":"“The Winter That Didn’t Come”","p":""},{"id":"teen","t":"“No Ice. No Festival. Now What? Larchmere Teens Take Over”","p":"teen"},{"id":"biz","t":"“Climate Costs: Tourism Losses in Cottage Country”","p":"biz"}]},{"id":"type","t":"Typography","options":[{"id":"def","t":"Classic serif","p":""},{"id":"teen","t":"Bold hand-lettered sans","p":"teen"}]},{"id":"colour","t":"Colour","options":[{"id":"def","t":"Muted blues","p":""},{"id":"teen","t":"High-contrast neon accents","p":"teen"}]}],"changes":"Changes from the default","teen":"Teen signals","biz":"Business signals","reads":{"teen":"Teens aged 15–19","biz":"Adults in the tourism trade","mixed":"Mixed signals: the cover speaks to no one clearly","adult":"Adults who travel to cottage country"}},"aha":"The same facts can be re-felt through a single change of convention. Makers choose, and the choices mean.","workedTitle":"Two worked examples","worked":[{"t":"Design and white space: the “Light One” poster (a mock print ad written for this module)","d":"One small paper lantern glows near the top of a nearly empty midnight-blue page, above the two-word headline “Light one.” Only at the bottom, in small type, does the tagline give the facts: “Paper lanterns · Saturday, 6 pm · library lawn.” The emptiness \u003cem>is\u003c/em> the argument: one small light looks brave rather than lonely."},{"t":"Borrowed form: \u003cem>The
