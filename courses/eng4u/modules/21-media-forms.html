RZJQH9TGwgUWBZAFUN/ARQORwFMQxUQcABHWBsMShAaFiNXG1sbV1VBRx8=","msgs":{"F1":"The dock is tiny and the water fills the frame. That vastness is an \u003cem>extreme\u003c/em> long shot.","F3":"We see whole hands and a photo: close-up. Extreme close-up would fill the frame with one detail, like F5’s thermometer.","F4":"Dev is framed from the waist up: medium shot.","missing":"Tag a shot size on each of F1 to F5 first."},"general":"Not yet. Check each frame’s shot size: how much of the subject fills the frame?","why":"Far to near: extreme long, long, close-up, medium, extreme close-up. Shot size is the trailer’s first tool for distance and feeling.","hints":["Shot size is about how much of the subject fills the frame.","Order from far to near: extreme long, long, medium, close-up, extreme close-up.","F1 ELS · F2 LS · F3 CU · F4 MS · F5 ECU."]},{"id":"tc2","goal":2,"prompt":"In the podcast intro, tag every sound cue as \u003cstrong>diegetic\u003c/strong> or \u003cstrong>non-diegetic\u003c/strong>: the boots (0:00), Ruth’s voice (0:00), the theme sting (0:10) and the music bed (0:15). \u003cbutton type='button' class='btn ghost sm mf-setup' data-setup='tc2'>Set it up\u003c/button>","_a":"SRRXVEADQ11bU1NHThsCCxAMFgELXAYbHhRXUUADQ1ddWFAMB15DFRBVAUdYGw9WXFJdAAUbHA==","msgs":{"c2":"Her voice was recorded \u003cem>in\u003c/em> the world of the story, on the dock. It belongs there.","c4":"No one on the dock hears the banjo. It’s added for us.","missing":"Tag each of the four cues as diegetic or non-diegetic first."},"general":"Not yet. Ask: can the people \u003cem>in\u003c/em> the scene hear it? If yes, it’s diegetic. If only we can, it’s non-diegetic.","why":"Field recordings belong to the world of the story; added music is for us alone.","hints":["Ask: could someone standing on the dock hear it?","Field recordings are diegetic; added music is not.","Boots ✔ diegetic, Ruth ✔ diegetic, sting and bed: non-diegetic."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"Remix the \u003cem>Northbound\u003c/em> cover so it targets \u003cstrong>teens aged 15–19\u003c/strong> instead of its usual adult readers, using \u003cstrong>no more than three changes\u003c/strong>. \u003cbutton type='button' class='btn ghost sm mf-setup' data-setup='tc3'>Set it up\u003c/button>","msgs":{"two":"Two signals aren’t enough to shift the whole cover. Find one more convention.","biz":"That cover line speaks to adults in the tourism trade, not teens.","over":"Over budget. Which single change matters least?"},"general":"Not yet. Which conventions signal \u003cem>who\u003c/em> a cover is for?","banner":"You changed the audience without changing a single fact. That’s the power of convention.","why":"You changed the audience without changing a single fact. That’s the power of convention.","hints":["Which conventions signal \u003cem>who\u003c/em> a cover is for? Faces, words, type and colour.","Swap in images and words about teens acting; then choose a type or colour signal.","For example: the teen image, the “Teens Take Over” cover line and hand-lettered type."]}]},"part3":{"slug":"forms","name":"Four forms","heading":"Same story, four forms","intro":"Explore took texts apart layer by layer. Now put the forms side by side: what can each \u003cem>form\u003c/em> do, and what can’t it?","stations":{"slot":{"title":"Real example: one story, four forms","credit":"","desc":"","how":"Your teacher chooses one real event or release covered in at least three forms (for example a documentary’s trailer, a radio or podcast interview with its maker, a newspaper or magazine page, and the official social post). For each version, note one thing that form does that the others can’t.","empty":"No example has been added yet, so the stations below run on their built-in descriptions. You can still fill in the notes for an example your teacher suggests.","ph":"One thing this form does that the others can’t"},"forms":[{"id":"trailer","t":"Trailer"},{"id":"podcast","t":"Podcast"},{"id":"cover","t":"Magazine cover"},{"id":"post","t":"Social post"}],"s1":{"title":"Station 1: what can each form do?","how":"Tap each cell to change it, then press \u003cstrong>Check the grid\u003c/strong>. Every cell explains itself when it’s checked.","rows":[{"id":"r1","t":"Moving images","opts":["y","n"],"_a":"aRRNR04bDxseFFpHThsYG28=","why":["Moving pictures are what a trailer is made of.","A podcast is sound only.","A cover is a still page.","Yes, sometimes: a post can carry video."]},{"id":"r2","t":"Sound and voice","opts":["y","n"],"_a":"aRRNR04bGBseFFpHThsYG28=","why":["Music, voice and sound effects.","Voice is the whole form.","A cover is silent.","Yes, sometimes: video posts have sound, though many play muted."]},{"id":"r3","t":"Control of time (pace, pauses)","opts":["y","n","p"],"_a":"aRRNR04bGBseFFpHThsRG28=","why":["Editing sets the pace, second by second.","Pauses and music set the pace.","The eye wanders a cover in any order.","Partial: a video sets its pace, but the viewer can scroll away at any moment."]},{"id":"r4","t":"Room for nuance and detail","opts":["lo","hi"],"_a":"aRRYCkAVQ1FbFBhHDlZDFRBaW0c/","why":["Low: a minute or two of promises.","High: minutes of voices, pauses and context.","Low on the cover itself: a few words and one image.","Low: a caption and a few seconds of attention."]},{"id":"r5","t":"Talk back (comments, shares)","opts":["y","n"],"_a":"aRRaR04bDxseFFpHThsYG28=","why":["A trailer plays to us; it doesn’t take replies.","Listeners hear; the episode can’t answer.","A cover can’t take replies.","Comments and shares are built into the form."]},{"id":"r6","t":"Seen in a glance","opts":["y","n"],"_a":"aRRaR04bDxseFE1HThsYG28=","why":["It takes a minute or two to watch.","It takes time to listen.","Built for a two-second glance at a newsstand.","Built for a thumb that may not stop."]}],"labels":{"y":"✔","n":"✗","p":"Partial","lo":"Low","hi":"High","blank":"?"},"check":"Check the grid","reset":"Start over","done":"Every cell matches. Each form can do some things brilliantly and others badly."},"s2":{"title":"Station 2: what does each form say best?","how":"Tap a kind of content, then tap the form that carries it best. Read the maker’s reason.","items":[{"id":"c1","t":"A survivor’s grief, in her own voice"},{"id":"c2","t":"The scale of a flooded valley"},{"id":"c3","t":"The time and place of a vigil this Saturday"},{"id":"c4","t":"“This is a climate story” in two seconds"}],"_a":"SRRXVEADQ0ldUlcEEU1DFRBVBkdYGxVLU19YABAbTRtRBRZfQEkOSkYUGEcBDUMDEFVbEwdLQ0Q=","why":{"c1":"Voice carries emotion no caption can.","c2":"An extreme long shot shows vastness.","c3":"Timely and shareable, with a call to action.","c4":"The biggest words on the newsstand."},"partial":{"c2|cover":"Partly: a cover could also carry scale through its focal image. But a still photo can’t sweep across the valley the way a moving extreme long shot can. Try another form.","c1|trailer":"Partly: a trailer can carry her voice, but only in seconds, between images. Which form gives a voice room to pause? Try another form.","c3|cover":"Partly: a cover could print the date, but it’s on the stand for a month. Which form is timely and shareable? Try another form.","c4|post":"Partly: a post can say it fast too, but it competes with a feed. Which form ranks its stories with the biggest words? Try another form."},"wrong":"That form can carry it, but not best. Move the story into a new form and you change what it can say. A podcast can’t show the empty lake; a cover can’t let you hear it. Try another form."},"s3":{"title":"Station 3: form and content","reading":"\u003cp>\u003cstrong>The key concepts.\u003c/strong> A set of key concepts of media literacy was developed in Ontario in the late 1980s and has long been used in Ontario schools. Four of them, for example: \u003cem>all media are constructions\u003c/em>; \u003cem>audiences negotiate meaning\u003c/em>; \u003cem>media have commercial implications\u003c/em>; \u003cem>form and content are closely related\u003c/em>.\u003c/p>\u003cp>\u003cstrong>McLuhan.\u003c/strong> The Canadian thinker Marshall McLuhan argued in the 1960s that a medium shapes us as much as any message it carries (a paraphrase).\u003c/p>","how":"For each of your Station 2 matches, tap the key concept that best explains it.","concepts":[{"id":"construct","t":"All media are constructions"},{"id":"negotiate","t":"Audiences negotiate meaning"},{"id":"commercial","t":"Media have commercial implications"},{"id":"form","t":"Form and content are closely related"}],"_a":"SRRXVEADQ19dRFlHThsCCxAMFgMNSwwbHhRXVkADQ19dRFlHThsCDRAMFgMNSwwbTw==","why":{"c1":"Grief told in her own voice is different content from grief in a caption: the form decides what we feel.","c2":"Vastness needs a moving frame; change the form and the scale shrinks.","c3":"A post’s timeliness and shareability make it the right home for a call to action.","c4":"A cover’s glance-speed form decides which story wins."},"fb":{"construct":"True of every text, but it doesn’t explain why \u003cem>this\u003c/em> form fits \u003cem>this\u003c/em> content.","negotiate":"That concept is about how readers make meaning, not why the content suits this form.","commercial":"Money shapes media, but this match is about what the form can carry."}}},"blocks":[{"title":"Craft → meaning","html":"\u003cp>Choosing a form \u003cem>is\u003c/em> choosing a meaning. When you write in Module 24, you’ll pick the form first, because it decides what your story can be.\u003c/p>"}],"quickCheck":{"title":"Four forms quick check","summary":"Four forms quick check","items":[{"id":"q1","goal":1,"prompt":"Which form can’t control the \u003cem>pace\u003c/em> at which you take it in?","choices":[{"t":"Podcast","fb":"A reader’s eye wanders a cover in any order; time-based forms set the pace.","_n":"14799","_k":"1f91742d"},{"t":"Trailer","fb":"A reader’s eye wanders a cover in any order; time-based forms set the pace.","_n":"15789","_k":"b624a695"},{"t":"Magazine cover","fb":"Right. A reader’s eye wanders a cover in any order; time-based forms set the pace.","_n":"16779","_k":"b1966d3a"},{"t":"None of them","fb":"A reader’s eye wanders a cover in any order; time-based forms set the pace.","_n":"17769","_k":"f088c845"}]},{"id":"q2","goal":1,"prompt":"An elder’s spoken memory, with her pauses and the catch in her voice, is strongest in which form?","choices":[{"t":"Magazine cover","fb":"Voice carries tone, pause and texture.","_n":"18759","_k":"36e609c5"},{"t":"Title card","fb":"Voice carries tone, pause and texture.","_n":"19749","_k":"b992972d"},{"t":"Hashtag","fb":"Voice carries tone, pause and texture.","_n":"1a739","_k":"b0a5d2c2"},{"t":"Podcast","fb":"Right. Voice carries tone, pause and texture.","_n":"1b829","_k":"8961a4a6"}]},{"id":"q3","goal":5,"prompt":"Which key concept says that a teen and a cottage owner may read the cover differently?","choices":[{"t":"Form and content are closely related","fb":"Meaning is made by readers as well as makers. Audiences negotiate meaning. A teen and a cottage owner can read the same cover differently.","_n":"1c819","_k":"72a6c3a7"},{"t":"Media have commercial implications","fb":"Meaning is made by readers as well as makers. Audiences negotiate meaning. A teen and a cottage owner can read the same cover differently.","_n":"1d749","_k":"0562f0bc"},{"t":"All media are constructions","fb":"Meaning is made by readers as well as makers. Audiences negotiate meaning. A teen and a cottage owner can read the same cover differently.","_n":"1e759","_k":"7be02f74"},{"t":"Audiences negotiate meaning","fb":"Right. Meaning is made by readers as well as makers.","_n":"1f769","_k":"7ab82e63"}]},{"id":"q4","goal":5,"prompt":"Why do many free podcasts include host-read sponsor messages?","choices":[{"t":"It’s a sound effect","fb":"Shows need money; sponsorship shapes what we hear and how.","_n":"1g779","_k":"7061b7a8"},{"t":"Audiences negotiate meaning","fb":"Shows need money; sponsorship shapes what we hear and how.","_n":"1h709","_k":"e7e1347c"},{"t":"Media have commercial implications","fb":"Right. Shows need money; sponsorship shapes what we hear and how.","_n":"1i719","_k":"0b42bdf7"},{"t":"It’s a diegetic sound","fb":"Shows need money; sponsorship shapes what we hear and how.","_n":"1j729","_k":"c6d27ef8"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class='steal-line'>“Rhetoric may be defined as the faculty of observing in any given case the available means of persuasion.”\u003c/p>\u003cp class='eng-cite'>Aristotle, \u003ci>Rhetoric\u003c/i>, translated by W. Rhys Roberts, 1924 (public domain)\u003c/p>\u003cp>\u003cstrong>The pattern:\u003c/strong> \u003cem>[Thing] may be defined as the faculty/art of [verb-ing] [where] [what].\u003c/em>\u003c/p>\u003cp>\u003cstrong>Your turn:\u003c/strong> write your own definition of a media form in the same shape.\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “A trailer may be defined as the art of promising, in a minute, the feeling of an hour.”\u003c/p>","prompt":"Your definition of a media form"}],"steal":{"master":"Rhetoric may be defined as the faculty of observing in any given case the available means of persuasion.","source":"Aristotle, Rhetoric (trans. W. Rhys Roberts)","save":"Save it to my commonplace book"}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Convention sort","summary":"Convention sort","goal":[2,1],"noun":"convention","txt":true,"instruction":"Sort each convention into the layer it belongs to.","boxes":[{"id":"image","label":"Image"},{"id":"sound","label":"Sound"},{"id":"edit","label":"Editing and sequence"},{"id":"design","label":"Design"}],"items":[{"id":"i1","t":"A low-angle shot of a coach at a podium","_a":"EF9ZBAVcQw==","why":"Angle is where the camera sits: an image choice. Low angle: bigger, stronger.","wrong":{"edit":"Angle is about where the camera sits, not how shots join."},"hints":["Is it about what we see, what we hear, how shots join, or how a page is laid out?","Where does the camera sit?","Image."]},{"id":"i2","t":"Music the characters can’t hear","_a":"EEVbEAxdQw==","why":"Non-diegetic music: a sound choice.","wrong":{"edit":"It’s a sound choice: non-diegetic music."},"hints":["Is it about what we see, what we hear, how shots join, or how a page is laid out?","We hear it.","Sound."]},{"id":"i3","t":"Six quick cuts in four seconds","_a":"EFNQDBYb","why":"Cutting shots together fast is editing: a montage.","wrong":{"image":"The individual shots are images, but cutting them fast is editing."},"hints":["Is it one shot or how shots join?","Cuts join shots.","Editing and sequence."]},{"id":"i4","t":"A masthead in heavy capitals","_a":"EFJRFgteDxs=","why":"Typography and layout are design.","wrong":{"image":"Typography belongs to design."},"hints":["Is it a picture or lettering?","Lettering and layout belong together.","Design."]},{"id":"i5","t":"A one-second silence before the theme","_a":"EEVbEAxdQw==","why":"Silence is a sound choice: what you don’t hear.","wrong":{"edit":"Silence is a sound choice. It’s what you \u003cem>don’t\u003c/em> hear."},"hints":["Which sense notices it?","You notice it with your ears.","Sound."]},{"id":"i6","t":"An extreme close-up of a thermometer","_a":"EF9ZBAVcQw==","why":"Shot size is an image convention.","wrong":{"design":"Shot size is an image convention."},"hints":["Is it about how close the camera is?","Shot size is framing.","Image."]},{"id":"i7","t":"A title card at the end of a trailer","_a":"EFNQDBYb","why":"Its placement at the end closes the sequence.","wrong":{"design":"Its lettering is design, but its \u003cem>placement\u003c/em> at the end is sequence."},"hints":["Is it about how something looks, or \u003cem>where\u003c/em> it sits in time?","Title cards close a sequence.","Editing and sequence."]},{"id":"i8","t":"White space around a single cover line","_a":"EFJRFgteDxs=","why":"Empty space is a layout choice.","wrong":{"image":"Empty space is a layout choice."},"hints":["Is it a picture, or the space around words?","Layout includes what’s left empty.","Design."]},{"id":"i9","t":"A sound bridge (the next scene’s sound starts before its picture)","_a":"EEVbEAxdQw==","why":"A sound technique that smooths a cut.","wrong":{"edit":"It’s a sound technique that smooths a cut. Sound is the better box."},"hints":["What starts early, the sound or the picture?","The sound.","Sound."]},{"id":"i10","t":"A high-angle shot looking down on a lone skater","_a":"EF9ZBAVcQw==","why":"Angle is an image choice. High angle: smaller, vulnerable.","wrong":{"sound":"Angle is an image choice. (High angle: smaller, vulnerable.)"},"hints":["Where does the camera sit?","Above the skater, looking down.","Image."]}]},{"id":"story","type":"custom","title":"Unseen storyboard: “Read the Ice”","summary":"Unseen storyboard","star":true,"goal":[2,3,4],"instruction":"“Read the Ice” is a 6-frame public service announcement from the practice model: fictional, so the ★ items keep a fixed answer key. The last item moves to a real PSA.","frames":[["R1","Extreme long shot: a frozen bay at dawn, a few distant ice huts","Wind"],["R2","Close-up: a teen’s boot stepping onto grey, slushy ice","A creak (diegetic)"],["R3","Extreme close-up: a crack spreading","Silence"],["R4","Medium shot, eye level: a grandmother handing the teen an ice auger","Voice-over: “Before you step, test.”"],["R5","Montage: an auger drilling, a measuring stick, a thickness chart","Upbeat music"],["R6","Title card: “Read the Ice. 10 cm or don’t go.”","Non-diegetic chime"]],"items":[{"id":"u1","goal":2,"prompt":"What does the silence in R3 do?","options":[{"t":"It’s background quiet","why":"Silence after a creak is a held breath. It’s dramatic.","_n":"1k739","_k":"c0156e50"},{"t":"Builds dread at the moment of danger","why":"Silence after a creak is a held breath.","_n":"1l7c9","_k":"c9eb07c0"},{"t":"It tells us the ice is safe","why":"A crack is spreading; the quiet makes it worse, not better.","_n":"1m7d9","_k":"d55bddb9"},{"t":"It shows the sound equipment failed","why":"Assume the choice is deliberate and ask what it does.","_n":"1n86a","_k":"addc08a9"}],"hints":["What just happened in R2?","A creak, then nothing: what do you do when you hear a creak?","It builds dread at the moment of danger."]},{"id":"u2","goal":2,"prompt":"Why does the music turn upbeat at R5?","options":[{"t":"It shifts from danger to empowerment: testing is the solution","why":"The music tells us that action fixes the danger.","_n":"1o85a","_k":"8a4c6174"},{"t":"To make the ad shorter","why":"Music doesn’t change the length; it changes the feeling.","_n":"1p88a","_k":"5d8ba999"},{"t":"Because montages always need music","why":"Music is a choice; ask what this choice signals.","_n":"1q87a","_k":"171fd22b"},{"t":"To show it’s a happy ending","why":"It signals that \u003cem>action\u003c/em> fixes the danger, not that nothing was ever wrong.","_n":"1r82a","_k":"72123311"}],"hints":["What is happening on screen in R5?","The teen is testing the ice: drilling and measuring.","It shifts from danger to empowerment: testing is the solution."]},{"id":"u3","goal":3,"prompt":"Who is the primary audience, and what’s your best evidence?","options":[{"t":"Ice-hut owners, because huts appear in R1","why":"The huts are distant scenery; the close-ups belong to the teen.","_n":"1s81a","_k":"51a624af"},{"t":"Everyone equally","why":"Every text chooses an audience; find the evidence in the frames.","_n":"1t84a","_k":"3f9f7241"},{"t":"Teens new to the ice; the teen’s boot and the grandmother passing on a skill","why":"The boot that steps first is the viewer’s stand-in, and the skill is passed down to the young.","_n":"1u83a","_k":"491bc5e8"},{"t":"Grandparents, because one appears","why":"She’s the \u003cem>messenger\u003c/em>; the boot that steps first is the viewer’s stand-in. Point to the conventions: the typography, the cover lines, the image. Those are your evidence for the audience.","_n":"1v7ea","_k":"d2bd951b"}],"hints":["Whose point of view does the camera take in R2?","The boot is the viewer’s boot.","Teens new to the ice; evidence: R2’s point of view and the passing-on of a skill in R4."]},{"id":"u4","goal":3,"prompt":"Which single change would most effectively re-target the PSA to experienced adult anglers?","options":[{"t":"Change the title card’s colour to blue","why":"Colour alone won’t tell experienced anglers the message is for them.","_n":"1w7da","_k":"cd02b7c3"},{"t":"Replace R4 with an angler checking a thickness chart and add “Even after 30 winters, test.”","why":"Casting and words decide who a text addresses.","_n":"1x809","_k":"9719978e"},{"t":"Cut the silence in R3","why":"That changes the mood, not the audience.","_n":"1y819","_k":"5e4852d9"},{"t":"Make the music louder","why":"Volume doesn’t change \u003cem>who\u003c/em> the text addresses; casting and words do.","_n":"1z7e9","_k":"ab72b86f"}],"hints":["Who is on screen, and who is spoken to?","Change the casting and the words.","Replace R4 with an angler checking a thickness chart and add “Even after 30 winters, test.”"]},{"id":"u5","goal":5,"prompt":"Which key concept best explains why the PSA ends on a rule (“10 cm or don’t go”)?","options":[{"t":"Media have commercial implications","why":"Nothing is being sold here. Think about how it simplifies reality.","_n":"207f9","_k":"13db211f"},{"t":"Silence is non-diegetic","why":"That’s not a key concept, and the ending isn’t silent.","_n":"21849","_k":"0ce5df91"},{"t":"Media construct reality: it frames a complex judgment as a simple rule","why":"Safe ice depends on many things; the PSA builds a simple version of reality we can act on.","_n":"22859","_k":"40c4904c"},{"t":"Audiences negotiate meaning","why":"True of every text, but the rule is about how the PSA \u003cem>builds\u003c/em> its message.","_n":"23829","_k":"9f80f9ad"}],"hints":["Is ice safety really one number?","The PSA simplifies a complex judgment.","Media construct reality."]}],"write":{"id":"u6","goal":[2,4],"prompt":"Now watch a real PSA (your teacher selects a current example: 30–90 seconds, with a sound or music shift and a closing call to action; credited). In one sentence, name one convention it uses and analyse its effect.","credit":"","min":15,"max":40,"label":"Your sentence (15–40 words)","good":"Your sentence names a convention and says what it does. Your teacher reads the analysis.","bad":"That describes the frame; add what it \u003cem>does\u003c/em> to the viewer.","noConv":"Name the convention: a shot size, angle, sound, edit or design choice from the menu.","len":"Write one sentence of 15–40 words.","check":"Check my sentence","hints":["Name one convention from the menu (a shot size, an angle, a sound choice, an edit).","Then use a verb that says what it does: suggests, builds, makes, signals…","“The sudden silence before the final title builds dread, so the call to action lands like a warning.”"]}},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","goal":[2,3,6],"student":"Zelda","instruction":"Zelda made one mistake in each analysis. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":6,"task":"Analyse frame F7 of the \u003cem>No Ice This Year\u003c/em> trailer.","steps":["In frame F7, Dev stands on the dock against the sky.","The on-screen text says they’re building a festival without ice.","This makes the trailer interesting.","So the trailer works well."],"_a":"Ag==","stepFb":["","Step 2 repeats the problem; look earlier.","Step 3 is vague, but the first problem is earlier.","Step 4 follows from the earlier steps."],"fixes":[{"t":"“In frame F7, the trailer is really good.”","why":"Opinion without evidence.","_n":"24839","_k":"024cfa4f"},{"t":"“In frame F7, Dev is wearing a blue jacket.”","why":"More description.","_n":"25789","_k":"8a03b744"},{"t":"“In frame F7, a low-angle shot looks up at Dev against the sky, making him seem strong and determined, the trailer’s turn from loss to action.”","why":"It names the convention, its effect and the trailer’s purpose.","_n":"26799","_k":"780701b1"},{"t":"“Step 1 is fine.”","why":"It tells what we see, never what the choice does. That tells me what we see. Now tell me what the choice \u003cem>does\u003c/em>: why a close-up, why here?","_n":"27727","_k":"9df4096a"}],"hints":["Which convention is used in F7?","Low angle.","Name it, then say what it makes us feel."]},{"id":"e2","goal":3,"task":"Identify the audience of the \u003cem>Northbound\u003c/em> cover.","steps":["The cover’s main line, “The Winter That Didn’t Come”, is in a classic serif font.","The secondary lines advertise cabins under $150 and snowshoe gear.","I find the cover boring, so it must be aimed at older people.","Older readers like boring things."],"_a":"AA==","stepFb":["Step 1 is accurate evidence.","Step 2 is accurate evidence.","","Step 4 builds on the faulty step 3."],"fixes":[{"t":"“So it’s aimed at everyone.”","why":"Every text chooses an audience.","_n":"28717","_k":"a2ffe3e2"},{"t":"“Step 3 is fine.”","why":"It uses personal taste, not the conventions.","_n":"29707","_k":"725fc6da"},{"t":"“I like it, so it’s aimed at me.”","why":"Same mistake: taste isn’t evidence. Point to the conventions: the typography, the cover lines, the image. Those are your evidence for the audience.","_n":"2a6f7","_k":"0c12378f"},{"t":"“The cabins, gear and classic typography suggest adults who travel to the outdoors, people with money and time for cottage-country trips.”","why":"It infers the audience from the conventions.","_n":"2b767","_k":"b479bea0"}],"hints":["Is “I find it boring” evidence from the text?","Use the cover lines and typography.","Adults planning outdoor trips."]},{"id":"e3","goal":2,"task":"Explain the sound in the podcast’s first 15 seconds.","steps":["The episode opens without music, using a field recording of boots on slush.","Ruth’s voice is non-diegetic because it was added in a studio.","Then a theme sting announces the show.","Together, these make the opening feel real before it feels like a show."],"_a":"Aw==","stepFb":["Correct: a cold open.","","Step 3 is accurate: the sting announces the show.","Step 4 is a fair conclusion. The problem is earlier."],"fixes":[{"t":"“Step 2 is fine.”","why":"The script says she was recorded on the dock.","_n":"2c757","_k":"6ad27055"},{"t":"“Ruth’s voice is a sound effect.”","why":"It’s speech, recorded on location.","_n":"2d747","_k":"7463cd83"},{"t":"“Ruth’s voice is diegetic: it was recorded on the dock, in the world of the story.”","why":"Ask: can the people \u003cem>in\u003c/em> the scene hear it? If yes, it’s diegetic. If only we can, it’s non-diegetic.","_n":"2e737","_k":"d4c15e8e"},{"t":"“Ruth’s voice is the theme music.”","why":"The theme comes at 0:10.","_n":"2f7a7","_k":"6e0d559c"}],"hints":["Where was Ruth recorded?","On the dock.","Diegetic."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which remix in Explore surprised you most? What did it teach you about how small choices change meaning?"},{"id":"j2","q":"In your own words, explain why a media text is never a neutral window."},{"id":"j3","q":"Explain to a friend how to tell diegetic from non-diegetic sound, using an example from a show you love."},{"id":"j4","q":"Which convention do you still find hard to name or analyse? What will you watch for this week?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line, image or sound from today that you’d like to remember, and add a sentence on why it stuck.\u003c/p>\u003cdiv id='cp-app'>\u003c/div>"}],"art":{"intro":"Write one craft principle about media in your own words. Then add a master’s example from this module (a frame, cue, cover line or the Aristotle sentence), and an imitation: one choice you would make in your own media text that follows your principle.","placeholder":"e.g. Distance is feeling: move the camera closer to make it personal, farther to make it vast.","examples":["Frame F1: an overhead extreme long shot shrinks the dock to a speck (\u003cem>No Ice This Year\u003c/em>)","0:09: one second of silence after Ruth’s memory (\u003cem>Small Town, Big Sky\u003c/em>)","Cover line: “The Winter That Didn’t Come” (\u003cem>Northbound\u003c/em>)","Hook: “40 years of ice lanterns. Zero ice this year.”","“Rhetoric may be defined as the faculty of observing in any given case the available means of persuasion.” (Aristotle, \u003ci>Rhetoric\u003c/i>)"]},"artSamples":[{"p":"Distance is feeling: move the camera closer to make it personal, farther to make it vast.","m":"frames F1 and F3 of \u003cem>No Ice This Year\u003c/em>"},{"p":"The first line of a post is a door. Make it a door people want to open.","m":"“40 years of ice lanterns. Zero ice this year.”"}],"principleMin":6,"cpLines":["All the world’s a stage, And all the men and women merely players.","Rhetoric may be defined as the faculty of observing in any given case the available means of persuasion.","At night we’d hear it: a long groan, like a whale under the ice.","Forty winters, and I never missed one.","40 years of ice lanterns. Zero ice this year.","The Winter That Didn’t Come"]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"A shot shows a person from the waist up. What is it called?","options":[{"t":"Long shot","why":"A long shot shows the whole body in its setting.","_n":"2g797","_k":"55c44ebd"},{"t":"Low angle","why":"That’s an angle, not a shot size.","_n":"2h6c7","_k":"a167fa67"},{"t":"Close-up","why":"A close-up fills the frame with a face or object.","_n":"2i6d7","_k":"9611f321"},{"t":"Medium shot","why":"Waist up is the classic medium shot.","_n":"2j6e7","_k":"5a3aee98"}]},"b":{"prompt":"A shot fills the frame with a single eye. What is it called?","options":[{"t":"Close-up","why":"A close-up shows the whole face.","_n":"2k6f7","_k":"3325d1c1"},{"t":"Medium shot","why":"A medium shot frames a person from the waist up.","_n":"2l707","_k":"9414d9f7"},{"t":"Overhead shot","why":"That’s an angle.","_n":"2m717","_k":"2f84e07f"},{"t":"Extreme close-up","why":"One detail fills the frame.","_n":"2n727","_k":"a72c5c88"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"In a film, a car horn that the characters hear is…","options":[{"t":"a voice-over","why":"A voice-over is narration.","_n":"2o737","_k":"f8018df3"},{"t":"a sound bridge","why":"A sound bridge links two scenes.","_n":"2p747","_k":"12c34e27"},{"t":"diegetic sound","why":"It exists in the world of the story.","_n":"2q757","_k":"976dc8ec"},{"t":"non-diegetic sound","why":"Only music or narration added for the audience is non-diegetic. Ask: can the people \u003cem>in\u003c/em> the scene hear it? If yes, it’s diegetic. If only we can, it’s non-diegetic.","_n":"2rbee","_k":"6557b3dd"}]},"b":{"prompt":"Music that only the audience hears is…","options":[{"t":"a cold open","why":"A cold open is a way to begin.","_n":"2sbfe","_k":"3a201b77"},{"t":"non-diegetic sound","why":"It’s added for us, not heard in the scene.","_n":"2tc0e","_k":"c8134796"},{"t":"silence","why":"Music isn’t silence.","_n":"2uc1e","_k":"a1213fb9"},{"t":"diegetic sound","why":"Ask: can the people \u003cem>in\u003c/em> the scene hear it? If yes, it’s diegetic. If only we can, it’s non-diegetic.","_n":"2vc2e","_k":"a45e71dd"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"Which key concept of media literacy says that every media text is made by people making choices?","options":[{"t":"Media have commercial implications","why":"That one is about money.","_n":"2wc3e","_k":"be6340b5"},{"t":"All media are constructions","why":"Choices of framing, cutting and wording build every text.","_n":"2xc4e","_k":"aa990266"},{"t":"Audiences negotiate meaning","why":"That concept is about readers, not makers.","_n":"2yc5e","_k":"be91cb49"},{"t":"Each medium has a unique aesthetic form","why":"That one is about form, not construction.","_n":"2zb6e","_k":"f6f6a866"}]},"b":{"prompt":"Which key concept says that two viewers can make different meanings from the same ad?","options":[{"t":"Audiences negotiate meaning","why":"Meaning is made by readers as well as makers.","_n":"30b7e","_k":"a3cc78bd"},{"t":"Form and content are closely related","why":"That one is about how form shapes content.","_n":"31c4e","_k":"ed0fd81b"},{"t":"Media have commercial implications","why":"That one is about money and who pays.","_n":"32c3e","_k":"3e29788b"},{"t":"All media are constructions","why":"That’s about how texts are made.","_n":"33c2e","_k":"661b81fb"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"A news segment shows a mayor at a podium in a \u003cstrong>low-angle\u003c/strong> shot. What does the angle most likely suggest?","options":[{"t":"Confusion, because the angle is unusual","why":"The angle has a conventional meaning: power.","_n":"34c1e","_k":"57fe5253"},{"t":"Neutrality, like an eye-level shot","why":"Eye level is neutral; low angle isn’t.","_n":"35c8e","_k":"06d5cb93"},{"t":"Authority and power: we look up at her","why":"We look up at her, so she seems bigger.","_n":"36c7e","_k":"dce29f80"},{"t":"Weakness, because the camera is low","why":"A low \u003cem>camera\u003c/em> looks \u003cem>up\u003c/em>; the subject seems bigger.","_n":"37c6e","_k":"e9e648c3"}]},"b":{"prompt":"A trailer shows a lone skater on slush in a \u003cstrong>high-angle\u003c/strong> shot. What does the angle most likely suggest?","options":[{"t":"Speed, because angles show motion","why":"Angle shows status and vulnerability, not speed.","_n":"38c5e","_k":"4c43da0b"},{"t":"Strength, because we see her from above","why":"A low angle looks \u003cem>up\u003c/em> at the subject, so it usually makes them seem bigger and stronger. A high angle looks down and makes them seem smaller.","_n":"39bce","_k":"0ee51fa7"},{"t":"Nothing; angle is a technical detail","why":"Someone chose where to point the camera, what to cut and what music to add. All media are constructions.","_n":"3abbe","_k":"f2ce5212"},{"t":"Vulnerability: she seems small and exposed","why":"We look down on her, so she seems smaller.","_n":"3bcae","_k":"203cf08a"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A magazine cover has a teen-run skate park as its focal image, the cover line “Build It Yourself”, and neon hand-lettered type. Which conclusion about its audience is best supported?","options":[{"t":"Parents, because parents buy magazines","why":"That’s an assumption, not evidence from the cover.","_n":"3ccbe","_k":"21c39c1b"},{"t":"Engineers, because building is involved","why":"“Build it yourself” and neon type don’t point to professionals.","_n":"3dc8e","_k":"85f5e7be"},{"t":"Young readers interested in DIY and action, shown by the image, the imperative cover line and the type","why":"Three conventions point the same way.","_n":"3ec9e","_k":"347c1be9"},{"t":"Everyone equally","why":"Every cover targets someone; the conventions show who.","_n":"3fc6e","_k":"d54dd916"}]},"b":{"prompt":"A podcast opens with thirty seconds of a child’s voice recorded at a rink before any music. What is the cold open’s main purpose?","options":[{"t":"To hook listeners with a real moment before branding the show","why":"A real voice first, the brand second.","_n":"3gc7e","_k":"178c9919"},{"t":"To make the episode shorter","why":"It adds time; its purpose is engagement.","_n":"3hc4e","_k":"43af120e"},{"t":"To save money on music","why":"It’s a deliberate convention, not a budget choice.","_n":"3ic5e","_k":"451a8f76"},{"t":"To show the podcast is for children","why":"The child is a subject; the audience isn’t defined by who speaks.","_n":"3jc2e","_k":"8c0a5026"}]}},{"id":"t3","cat":"T","goal":1,"a":{"prompt":"A transit authority wants commuters at a bus shelter to grasp, in three seconds, that winter ice days on the lake have dropped by half since 1980 (model statistic). Which design best fits the form?","options":[{"t":"A QR code linking to a podcast, with nothing else on the poster","why":"The poster itself must carry the message in three seconds.","_n":"3kc3e","_k":"f9125256"},{"t":"A 300-word explanation in small type","why":"Commuters won’t read paragraphs at a glance.","_n":"3l30e","_k":"44fd409e"},{"t":"A collage of twelve photos","why":"Too many focal points for a glance.","_n":"3m2fe","_k":"a6f90d5a"},{"t":"One huge number (“½”), a five-word headline and a simple two-bar chart","why":"A glance form needs one dominant element.","_n":"3n32e","_k":"13ad5fc5"}]},"b":{"prompt":"In 1938, Orson Welles’s radio adaptation of \u003cem>The War of the Worlds\u003c/em> told a Martian invasion as a series of news bulletins interrupting a music program. Why did this choice of form make the drama feel real to some listeners?","options":[{"t":"It borrowed the conventions of live radio news (bulletins breaking into music, on-the-scene reports), so listeners heard fiction through a news frame","why":"Form carries expectations; a news form signals “this is real”. How widespread the panic actually was is debated by historians.","_n":"3o31e","_k":"04d359ef"},{"t":"Listeners couldn’t hear the actors clearly","why":"Clarity wasn’t the issue; the form was.","_n":"3p34e","_k":"c5719ed6"},{"t":"Radio can’t carry fiction, so listeners assumed it was true","why":"Radio drama was common; the \u003cem>news\u003c/em> conventions did the work.","_n":"3q33e","_k":"47af052c"},{"t":"The music made it frightening","why":"The music was the interruptible “normal”; the bulletins created the alarm.","_n":"3r36e","_k":"310edca2"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which sentence best analyses the trailer’s opening frame (an overhead extreme long shot of grey open water and a tiny empty dock)?","options":[{"t":"“The first frame is beautiful and sets the scene well.”","why":"Opinion with no named choice or effect.","_n":"3s35e","_k":"7c95a92c"},{"t":"“The overhead extreme long shot shrinks the dock to a speck, making the missing ice feel vast and the town’s loss bigger than any one person.”","why":"It names the convention and its effect.","_n":"3t38e","_k":"fd7918b1"},{"t":"“The first frame shows the lake from above, and there is a dock.”","why":"Description, not analysis.","_n":"3u37e","_k":"9c62ee0c"},{"t":"“The first frame is a close-up of the dock, which shows sadness.”","why":"Wrong term: it’s an extreme long shot.","_n":"3v36e","_k":"b8c19ef6"}]},"b":{"prompt":"Which sentence best analyses the podcast’s one-second silence at 0:09?","options":[{"t":"“The silence is diegetic music.”","why":"Silence isn’t music.","_n":"3w37e","_k":"9c8ea286"},{"t":"“The one-second silence after Ruth’s memory lets her image of ‘a whale under the ice’ hang in the air before the theme breaks in.”","why":"It names the choice and what it does.","_n":"3x38e","_k":"8fecfe4d"},{"t":"“There is a silence at 0:09.”","why":"Description, not analysis.","_n":"3y39e","_k":"83cbf332"},{"t":"“The silence is a mistake in the editing.”","why":"Assume deliberate choice.","_n":"3z32e","_k":"028d7f86"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which sentence correctly explains the relationship between form and content?","options":[{"t":"“The same story becomes a different story in each form, because each form can show, sound or say different things.”","why":"Form and content work together.","_n":"4033e","_k":"71dd9b5b"},{"t":"“Content always matters more than form.”","why":"They work together.","_n":"4134e","_k":"0634f0ba"},{"t":"“Form is just the packaging; the content stays the same.”","why":"Move the story into a new form and you change what it can say. A podcast can’t show the empty lake; a cover can’t let you hear it.","_n":"4235e","_k":"2ca54110"},{"t":"“Form is only about colours and fonts.”","why":"Form includes time, sound, image and structure.","_n":"433ee","_k":"335386d5"}]},"b":{"prompt":"Which sentence uses \u003cem>target audience\u003c/em> correctly?","options":[{"t":"“My target audience opinion is that it’s good.”","why":"Not a meaningful use.","_n":"443fe","_k":"4bbaf2fd"},{"t":"“The target audience is the magazine’s editor.”","why":"The editor makes it; the audience receives it.","_n":"453cf","_k":"860c9c28"},{"t":"“The hand-lettered type and teen faces suggest the target audience is readers aged 15–19.”","why":"It names the audience and the evidence.","_n":"463bf","_k":"e43ef641"},{"t":"“The target audience is whoever happens to see it.”","why":"That’s reach, not target.","_n":"473af","_k":"b6fd4ddc"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"A town council wants teens to vote on a skate-park design within one week. Which form and conventions fit best?","options":[{"t":"A short social video with a hook in the first two seconds, the designs on screen and a clear call to action with the deadline","why":"Right form for the audience, the purpose and the deadline.","_n":"4839f","_k":"17db3818"},{"t":"A 20-page printed report mailed to homes","why":"Wrong form for a teen audience and a one-week deadline.","_n":"4938f","_k":"6b423693"},{"t":"A radio ad at 6 a.m.","why":"Wrong time and form for teens.","_n":"4a37f","_k":"d7c5a2e8"},{"t":"A magazine cover with no date or instructions","why":"No call to action or deadline.","_n":"4b36f","_k":"678259b6"}]},"b":{"prompt":"A seniors’ centre needs to explain a bus-route change to its members. Which form and conventions fit best?","options":[{"t":"A fast-cut montage video","why":"Fast cuts work against clear, lasting information.","_n":"4c35f","_k":"1de80ee4"},{"t":"A hashtag campaign","why":"Not the best form for this audience or purpose. Move the story into a new form and you change what it can say. A podcast can’t show the empty lake; a cover can’t let you hear it.","_n":"4d44f","_k":"a362cfdf"},{"t":"A podcast episode with no visuals","why":"A route change needs a map.","_n":"4e43f","_k":"a5f66ba1"},{"t":"A printed poster and handout with large type, a simple map and the new stop times","why":"Clear, lasting information they can keep.","_n":"4fc2f","_k":"61a081f1"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"Midway through a free podcast, the host reads an ad for a winter-tire shop in her own voice. What is the most important implication for listeners?","options":[{"t":"None; it’s just part of the show","why":"Every text has commercial implications. Notice them.","_n":"4gc3f","_k":"0942396e"},{"t":"The ad is diegetic sound","why":"It’s a commercial message; diegesis isn’t the point.","_n":"4hc0f","_k":"ad7e08b6"},{"t":"The host must own the tire shop","why":"Unsupported claim.","_n":"4ic1f","_k":"af3fb7ce"},{"t":"The show is funded by sponsors, and an ad in a trusted host’s voice may persuade more than a separate commercial","why":"Media have commercial implications; notice them.","_n":"4jc6f","_k":"01926e51"}]},"b":{"prompt":"A creator posts a photo in a new jacket a brand sent her for free, praising it. What is the key media-literacy observation?","options":[{"t":"The comments prove the jacket is good","why":"Comments aren’t evidence of quality.","_n":"4kc7f","_k":"7709f78e"},{"t":"It’s purely personal, so there’s nothing to analyse","why":"Someone chose where to point the camera, what to cut and what music to add. All media are constructions.","_n":"4lc4f","_k":"f7322116"},{"t":"This is a commercial relationship; the post works like an ad and should be clearly identified as one","why":"Free goods plus praise is a commercial relationship.","_n":"4mc5f","_k":"7114d981"},{"t":"Jackets can’t be media texts","why":"The \u003cem>post\u003c/em> is the media text.","_n":"4nbaf","_k":"7ffb5eea"}]}}]},"task":{"title":"Performance task: Convention map","summary":"Convention map","statement":"\u003cp>\u003cstrong>Choose a real media text: one of your teacher’s real examples, or one you find yourself (a trailer, podcast opening, magazine cover, ad or post). Map its conventions, then write one analytical paragraph showing how the form shapes the message.\u003c/strong> There’s no single right paragraph. Make it yours.\u003c/p>\u003cp>The practice-model texts stay available if you want a rehearsal first.\u003c/p>\u003cp class='tiny muted'>This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class='alg mf-rubric'>\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class='tbl-wrap'>\u003ctable class='topic-tbl'>\u003cthead>\u003ctr>\u003cth scope='col'>Criterion\u003c/th>\u003cth scope='col'>Level 1\u003c/th>\u003cth scope='col'>Level 2\u003c/th>\u003cth scope='col'>Level 3\u003c/th>\u003cth scope='col'>Level 4\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Knowledge: terms for conventions\u003c/td>\u003ctd>Few or misused\u003c/td>\u003ctd>Some accurate\u003c/td>\u003ctd>Accurate and varied\u003c/td>\u003ctd>Precise and nuanced\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Thinking: analysis of effect\u003c/td>\u003ctd>Mostly description\u003c/td>\u003ctd>Some effects named\u003c/td>\u003ctd>Effects explained and linked to purpose\u003c/td>\u003ctd>Insightful, with layered effects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Communication: organization and style\u003c/td>\u003ctd>Unclear\u003c/td>\u003ctd>Somewhat clear\u003c/td>\u003ctd>Clear and coherent\u003c/td>\u003ctd>Fluent, with a distinctive voice\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Application: key concept and audience\u003c/td>\u003ctd>Missing\u003c/td>\u003ctd>Mentioned\u003c/td>\u003ctd>Applied\u003c/td>\u003ctd>Used to open a new insight\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["Text chosen and credited","Four conventions mapped, across two layers","Claim names the text and uses an analysis verb","Evidence points to two specific moments","Links to a key concept","Length"],"tips":["Choose a text, and fill in its title, maker and date so your teacher can find it.","Tag at least four elements, and use two layers (for example, Image and Sound).","Put the title in your claim, and use a verb such as \u003cem>suggests\u003c/em>, \u003cem>reframes\u003c/em> or \u003cem>intensifies\u003c/em>.","Point to two exact moments: “In frame F5…”, “At 0:09…”.","Which key concept does your analysis show? Name it.","Aim for 150–220 words: room for two pieces of evidence, each analysed."],"explainLabel":"Craft statement","explainPrompt":"Craft statement: Which convention mattered most to your reading, and why did you choose to end your paragraph where you did?","vocab":"Use \u003cem>convention\u003c/em>, \u003cem>effect\u003c/em>, \u003cem>purpose\u003c/em> and \u003cem>audience\u003c/em>.","checkLabel":"Check my convention map","success":"Your convention map has every part.","more":"Try another text or another approach.","min":150,"max":220,"afterAt":4,"labels":{"text":"Text","real":"A real text","credit":"Credit the real text","title":"Title","maker":"Maker or outlet","platform":"Platform","date":"Date (with the year)","link":"Screenshot note or link (stays on this device)","map":"Map the conventions","add":"Add an element","addPh":"e.g. 0:12, the opening shot, the masthead","slots":"Paragraph builder","claim":"Claim","evidence":"Evidence","analysis":"Analysis","link2":"Link","join":"Put the slots together in my paragraph","para":"Your paragraph (150–220 words)","glance":"Your map at a glance"},"slotPh":{"claim":"Name the text and say what it does: “\u003cTitle> reframes…”","evidence":"Point to an exact moment: frame F3, 0:09, the cover line…","analysis":"What does that choice make us feel, notice or believe?","link2":"Link to a key concept and the purpose."},"verbs":["suggest","imply","reveal","reframe","intensif","undercut","emphasi","evoke","signal","convey","build","heighten","invite","transform","shrink","amplif","underscore","highlight","establish","persuade","teach","turn","make","create"],"concepts":["all media are constructions","construction","constructed","construct","audiences negotiate meaning","negotiate meaning","negotiates meaning","commercial implications","commercial","form and content","each medium has a unique aesthetic form"],"refWords":["cover line","masthead","focal image","caption","hook","title card","headline","body copy","white space","logo","tagline"],"models":[{"title":"Model 1: trailer, shot-size approach","text":"\u003cem>No Ice This Year\u003c/em> reframes a cancelled festival as a loss too large for any one person to hold. Its opening frame F1, an overhead extreme long shot, shrinks the dock to a speck against open water, so absence itself becomes the subject. Then the camera moves in: frame F3’s close-up of Ruth’s hands turning an old photograph makes that vast absence intimate, and her voice-over (“Forty winters…”) gives it a face. The editing completes the argument. The silence at frame F5, as the thermometer reads +3 °C, holds our breath, and the montage that follows floods the screen with what is gone. By moving from far to near to remembered, the trailer teaches us how to feel before it asks us to watch. It shows that all media are constructions: the same empty lake could have been filmed as a postcard, but these choices make it an elegy."},{"title":"Model 2: podcast, sound approach","text":"\u003cem>Small Town, Big Sky\u003c/em> reframes a warm winter as a sound the town has lost. At 0:00 the episode opens cold, with no music: boots on slush, recorded on the dock, and Ruth remembering how the ice groaned “like a whale under the ice.” Because both sounds are diegetic, we arrive inside Larchmere before anyone tells us where we are. At 0:09 one second of silence follows her memory, and that gap suggests the missing sound itself: the lake that no longer sings. Only then does the theme sting announce the show, so the episode earns our trust before it brands itself. Yet at 0:33 the host reads a sponsor message for Larchmere Hardware in the same warm voice. That moment reveals the episode’s commercial implications: the intimacy that makes Ruth’s grief feel close also makes the ad sound like a neighbour’s advice. The form that builds our trust is the form that spends it."},{"title":"Model 3: print poster, design approach (the mock “Light One” poster)","text":"The “Light One” poster reframes a cancelled festival as an invitation small enough to accept. Its white space does most of the work: one paper lantern glows near the top of a nearly empty midnight-blue page, so the darkness reads as the missing winter and the single light as hope. The emptiness suggests that one small act still matters, rather than that the festival has shrunk. The two-word headline, “Light one.”, turns loss into an instruction; its imperative verb hands the reader a job instead of a sorrow. Only at the bottom, in small type, does the tagline give the facts: Saturday, 6 pm, library lawn. The order is the argument: feeling first, details last. The poster shows that all media are constructions: the same notice could have been a crowded list of times and rules, but these choices of space, scale and word make a cancellation feel like a beginning."}],"modelsLabel":"Three model responses","modelsNote":"Three different approaches; all pass the checklist. Yours should be your own.","rubric":[["Knowledge: terms for conventions","Few or misused","Some accurate","Accurate and varied","Precise and nuanced"],["Thinking: analysis of effect","Mostly description","Some effects named","Effects explained and linked to purpose","Insightful, with layered effects"],["Communication: organization and style","Unclear","Somewhat clear","Clear and coherent","Fluent, with a distinctive voice"],["Application: key concept and audience","Missing","Mentioned","Applied","Used to open a new insight"]]},"cards":[["Medium","From Latin \u003cem>medius\u003c/em>, “middle”: what stands between a message and its audience. Plural: media."],["Convention","An expected technique of a form (the cover line, the cold open, the title card) that audiences know how to read."],["Shot sizes","Extreme long → long → medium → close-up → extreme close-up. Distance shapes feeling."],["Low angle","The camera looks up; the subject seems powerful. (“This winter, they’re building a festival without ice.”)"],["High angle","The camera looks down; the subject seems small or vulnerable."],["Diegetic sound","Sound that exists in the story’s world (boots on slush)."],["Non-diegetic sound","Sound added for the audience only (theme music, a sting)."],["Montage","A rapid series of shots that compresses time or builds feeling."],["Cover line","A headline on a magazine cover; its size and placement rank the stories."],["Hook","The opening seconds or first line designed to stop a scrolling viewer."],["All media are constructions","Every text is built from choices, never a neutral window."],["Form and content","Change the form and you change what the content can say. “All the world’s a stage…”"]]}};</script>
