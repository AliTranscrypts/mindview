<script>window.MV_PAYLOAD={"meta":{"id":"01-literary-devices","nn":"01","slug":"literary-devices","course":"eng4u","site":"eng4u","code":"ENG4U","kind":"topic","groupLabel":"Unit 1","groupName":"The Reader's and Writer's Craft","trivium":"Grammar, Rhetoric","size":"M","storageKey":"eng4u-01-literary-devices-v1","progressKey":"eng4u-progress-v1:01-literary-devices","toolkit":"1.0.6"},"course":{"course":"eng4u","site":"eng4u","code":"ENG4U","title":"English","modules":[{"nn":"01","slug":"literary-devices","title":"Literary Devices & Figurative Language","kind":"topic","group":"1"},{"nn":"02","slug":"close-reading-short-fiction","title":"Close Reading of Short Fiction","kind":"topic","group":"1"},{"nn":"03","slug":"reading-poetry","title":"Reading Poetry","kind":"topic","group":"1"},{"nn":"04","slug":"paraphrase-to-analysis","title":"From Paraphrase to Analysis","kind":"topic","group":"1"},{"nn":"05","slug":"writing-process","title":"The Writing Process","kind":"topic","group":"1"},{"nn":"06","slug":"essay-forms","title":"Essay Forms","kind":"topic","group":"1"},{"nn":"07","slug":"conventions-and-citation","title":"Conventions & Citation","kind":"topic","group":"1"},{"nn":"08","slug":"elizabethan-context","title":"Elizabethan Context","kind":"topic","group":"2"},{"nn":"09","slug":"tragic-hero","title":"The Tragic Hero & Aristotelian Form","kind":"topic","group":"2"},{"nn":"10","slug":"soliloquy-and-character","title":"Soliloquy & Character","kind":"topic","group":"2"},{"nn":"11","slug":"themes-and-motifs","title":"Themes & Motifs","kind":"topic","group":"2"},{"nn":"12","slug":"performance-and-adaptation","title":"Performance & Adaptation","kind":"topic","group":"2"},{"nn":"13","slug":"what-is-canlit","title":"What is \"Canadian Literature\"?","kind":"topic","group":"3"},{"nn":"14","slug":"munro-short-story","title":"Alice Munro & the Canadian Short Story","kind":"topic","group":"3"},{"nn":"15","slug":"indigenous-voices","title":"Indigenous Voices & Thomas King","kind":"topic","group":"3"},{"nn":"16","slug":"atwood-speculative","title":"Atwood and Speculative Canada","kind":"topic","group":"3"},{"nn":"17","slug":"choosing-a-novel","title":"Choosing a Novel of Literary Merit","kind":"topic","group":"4"},{"nn":"18","slug":"research-and-sources","title":"Research & Secondary Sources","kind":"topic","group":"4"},{"nn":"19","slug":"sustained-essay","title":"The Sustained Literary-Analysis Essay","kind":"topic","group":"4"},{"nn":"20","slug":"isu-oral-defence","title":"ISU Oral Defence","kind":"topic","group":"4"},{"nn":"21","slug":"media-forms","title":"Media Forms & Conventions","kind":"topic","group":"5"},{"nn":"22","slug":"news-and-bias","title":"News, Bias & Source Evaluation","kind":"topic","group":"5"},{"nn":"23","slug":"advertising-and-social-media","title":"Advertising & Social Media Rhetoric","kind":"topic","group":"5"},{"nn":"24","slug":"creating-media","title":"Creating an Original Media Text","kind":"topic","group":"5"}]},"salt":"6f56caeb","content":{"id":"01-literary-devices","kind":"topic","title":"Literary devices and figurative language","topic":"Literary Devices & Figurative Language","readyTopic":"literary devices and figurative language","hero":{"headline":"Six lines, one eagle, and every word working.","text":"Writers choose \u003cstrong>devices\u003c/strong> the way a carpenter chooses tools: to make something happen. Tennyson’s eagle \u003cem>clasps\u003c/em> with \u003cem>hands\u003c/em>; the sea \u003cem>crawls\u003c/em>; the bird falls \u003cem>like a thunderbolt\u003c/em>. That’s \u003cstrong>figurative language\u003c/strong>: meaning carried across from one thing to another. Listen too: the hard /k/ sounds of “clasps the crag with crooked” grip like talons. That’s a \u003cstrong>sound device\u003c/strong>. In this module you’ll learn to hear these tools, name them precisely, and, most importantly, say what they \u003cem>do\u003c/em>.","fig":{"html":"\u003cdiv class=\"hp\" id=\"hero-poem\" aria-label=\"The poem The Eagle by Alfred, Lord Tennyson, with an animated reading\">\u003c/div>","caption":""},"poem":["He clasps the crag with crooked hands;","Close to the sun in lonely lands,","Ring’d with the azure world, he stands.","","The wrinkled sea beneath him crawls;","He watches from his mountain walls,","And like a thunderbolt he falls."],"cite":"Alfred, Lord Tennyson, “The Eagle” (1851)","sound":[1,3,5],"figure":[6,26],"fall":38},"goals":["I can identify sound, figurative and structural devices in a line of poetry or prose.","I can explain what a device \u003cem>does\u003c/em> (its effect on meaning and feeling), not just name it.","I can tell metaphor, simile, personification and symbol apart by how they work (tenor, vehicle, ground).","I can hear sound devices when a line is read aloud, and judge them by sound, not spelling.","I can create fresh figurative language that fits its purpose and avoids cliché.","I can write an analysis sentence that links device → effect → meaning, using the precise term."],"start":{"blocks":[{"title":"Word story","html":"\u003cp>\u003cstrong>\u003cem>Metaphor\u003c/em>\u003c/strong>, from Greek \u003cem>metapherein\u003c/em>, “to carry across” (\u003cem>meta\u003c/em>, across, and \u003cem>pherein\u003c/em>, to carry). In Greece today, removal vans can still carry the related word \u003cem>metaphorés\u003c/em>: transport. A metaphor is a moving van for meaning: it picks up a quality from one place and sets it down in another.\u003c/p>\u003cp class=\"tiny muted\">Word stories are short histories; see a dictionary’s etymology for more.\u003c/p>"}],"warmup":{"questions":[{"id":"w1","skill":"Figurative vs literal","goal":2,"prompt":"Which sentence uses language \u003cstrong>figuratively\u003c/strong>?","options":[{"t":"“The students walked quickly down the long hallway.”","why":"\u003cem>Quickly\u003c/em> and \u003cem>long\u003c/em> describe; they don’t carry meaning across.","_n":"00b3","_k":"396e75d8"},{"t":"“The hallway swallowed the last of the students.”","why":"A hallway can’t literally swallow; the figure makes the emptying feel sudden and complete.","_n":"10e3","_k":"4287b64d"},{"t":"“The hallway was empty after the bell.”","why":"Everything here is literally true.","_n":"20d3","_k":"0a24ce0c"},{"t":"“The hallway is forty metres long.”","why":"Measurements are literal.","_n":"3103","_k":"af3f7066"}],"hints":["Which sentence couldn’t be literally true?","Can a hallway swallow?","“The hallway swallowed the last of the students”: the hallway is pictured as a mouth."]},{"id":"w2","skill":"Figurative vs literal","goal":6,"prompt":"“My backpack weighs a ton.” What is this, and why might someone say it?","options":[{"t":"A literal measurement","why":"A tonne is 1000 kg.","_n":"40f3","_k":"0e232838"},{"t":"A simile, because it compares the bag to a ton","why":"There’s no “like” or “as”, and it isn’t a comparison; it’s an exaggeration.","_n":"5123","_k":"40933936"},{"t":"Hyperbole: a deliberate exaggeration that conveys how heavy the bag \u003cem>feels\u003c/em>","why":"No backpack weighs a ton; the overstatement expresses the feeling.","_n":"6113","_k":"ee947b99"},{"t":"Personification of the backpack","why":"The bag isn’t given human traits.","_n":"7043","_k":"4b6137c1"}],"hints":["Is it literally true?","It’s an exaggeration on purpose.","Hyperbole."]},{"id":"w3","skill":"Simile and metaphor","goal":3,"prompt":"Which line contains a \u003cstrong>simile\u003c/strong>?","options":[{"t":"“It is the east, and Juliet is the sun.”","why":"This asserts that Juliet \u003cem>is\u003c/em> the sun: a metaphor.","_n":"8033","_k":"b56c49b1"},{"t":"“I wandered lonely as a cloud” (Wordsworth, line 1)","why":"“As” signals the comparison between the speaker and a cloud.","_n":"9a4e","_k":"d7b6b94d"},{"t":"“Death, be not proud.”","why":"That’s apostrophe: speaking directly to Death.","_n":"aa5e","_k":"d63ef82f"},{"t":"“The fog comes / on little cat feet.”","why":"No “like” or “as”; the fog is pictured as a cat: an implied metaphor.","_n":"ba6e","_k":"7ee0b13f"}],"hints":["Look for the signal words.","“Like” or “as”.","“lonely as a cloud”."]},{"id":"w4","skill":"Simile and metaphor","goal":3,"prompt":"In “Juliet is the sun,” what is being described, and what is it compared to?","options":[{"t":"The sun is described; Juliet is what it’s compared to","why":"Romeo is talking about Juliet, not astronomy.","_n":"ca7e","_k":"15dbd453"},{"t":"Nothing is compared; it’s a symbol","why":"A symbol is a thing in the story that stands for more; here Romeo compares Juliet to the sun.","_n":"da8e","_k":"3ecefed3"},{"t":"Both are described literally","why":"Juliet isn’t literally a star.","_n":"ea9e","_k":"1792061f"},{"t":"Juliet is described; the sun is what she’s compared to","why":"Juliet is the subject (the tenor); the sun carries the qualities (the vehicle).","_n":"faae","_k":"1e78dad7"}],"hints":["Who is Romeo looking at?","The sun lends its qualities to her.","Juliet described; the sun the comparison."]},{"id":"w5","skill":"Sound devices","goal":4,"prompt":"Read aloud: “Hear the mellow wedding bells” (Poe). Which sound device is strongest?","options":[{"t":"Alliteration on “h”","why":"Only one word starts with /h/.","_n":"gabe","_k":"b810cb96"},{"t":"Assonance: the repeated short \u003cem>e\u003c/em> vowel sound in “mellow”, “wedding” and “bells”","why":"Repeated vowel sounds make the line ring, like the bells.","_n":"h9ce","_k":"56d68a3f"},{"t":"Onomatopoeia","why":"No word here imitates a sound the way “ding” or “clang” would.","_n":"i9de","_k":"2b8320d2"},{"t":"End rhyme","why":"Rhyme needs two line endings that sound alike; this is one line.","_n":"j16e","_k":"85d00717"}],"hints":["Say the vowels in the middle of the words.","mEllow, wEdding, bElls.","Repeated vowel sounds: assonance."]},{"id":"w6","skill":"Connotation","goal":2,"prompt":"Three words for a thin person: \u003cem>slender\u003c/em>, \u003cem>skinny\u003c/em>, \u003cem>scrawny\u003c/em>. Which statement is accurate?","options":[{"t":"They share a dictionary meaning (denotation) but carry different feelings (connotations), from admiring to unkind","why":"\u003cem>Slender\u003c/em> flatters, \u003cem>skinny\u003c/em> is neutral to negative, \u003cem>scrawny\u003c/em> is harsh.","_n":"k15e","_k":"cd9a176a"},{"t":"Only “scrawny” has a connotation","why":"Every word carries some feeling.","_n":"l18e","_k":"59d1f31b"},{"t":"Connotation only matters in poetry","why":"It matters in every sentence, including ads and news.","_n":"m17e","_k":"7394a74d"},{"t":"They mean exactly the same thing, so a writer can use any of them","why":"Readers feel the difference.","_n":"n1ae","_k":"7c3bc7fc"}],"hints":["Which would you use as a compliment?","Same meaning, different feeling.","Denotation vs connotation."]}],"refreshers":{"Figurative vs literal":"Literal language means exactly what it says. Figurative language means more than it says, by comparing, exaggerating or giving human traits. Test: could this be literally true?","Simile and metaphor":"A simile signals a comparison with “like” or “as” (“lonely as a cloud”). A metaphor says one thing \u003cem>is\u003c/em> another (“Juliet is the sun”). Both have a tenor (the subject) and a vehicle (the comparison).","Sound devices":"Alliteration repeats beginning consonant \u003cem>sounds\u003c/em>; assonance repeats vowel sounds; consonance repeats consonant sounds anywhere; onomatopoeia imitates a sound. Always test by saying the line aloud.","Connotation":"Denotation is the dictionary meaning; connotation is the feeling a word carries. Writers choose words for both."}}},"explore":{"heading":"Device lens","intro":"Eight lines from writers who knew their tools. Switch on a lens to see the devices, or switch them all off and hunt for them yourself.","lenses":[{"id":"sound","label":"Sound","role":"sound"},{"id":"imagery","label":"Imagery","role":"image"},{"id":"figure","label":"Figure","role":"figure"},{"id":"structure","label":"Structure","role":"syntax"},{"id":"diction","label":"Diction","role":"diction"}],"menu":{"sound":["alliteration","assonance","consonance","internal rhyme","repetition","onomatopoeia","sibilance"],"imagery":["visual imagery","contrast"],"figure":["metaphor","implied metaphor","simile","personification","apostrophe","symbol"],"structure":["enjambment","repetition","punctuation"],"diction":["place words","connotation"]},"cards":[{"id":"L1","lines":["He clasps the crag with crooked hands;"],"author":"Tennyson, “The Eagle”","cite":"Tennyson, “The Eagle”, line 1","parts":["the eagle","human hands","the crag","the sun"],"devices":[{"id":"L1s","lens":"sound","w":[1,3,5],"span":[[1,5]],"label":"clasps · crag · crooked","tag":"alliteration (/k/)","accept":["alliteration","consonance"],"note":"harsh, gripping sounds; a fierce hold"},{"id":"L1f","lens":"figure","w":[5,6],"span":[[5,6]],"label":"crooked hands","tag":"personification","accept":["personification"],"note":"the eagle given human hands: grasping, deliberate, almost kingly","tenor":"the eagle","vehicle":"human hands","ground":"grasping, deliberate, almost kingly"}]},{"id":"L2","lines":["The fog comes","on little cat feet."],"author":"Carl Sandburg, “Fog” (1916)","cite":"Sandburg, “Fog”, lines 1–2","parts":["the fog","a cat","the harbour","silence"],"swap":"The fog comes in slowly and quietly.","rate":[[5,4,4],[2,1,0]],"devices":[{"id":"L2f","lens":"figure","w":[1,5,6,7],"span":[[1,7],[5,7]],"label":"fog … little cat feet","tag":"implied metaphor","accept":["implied metaphor","metaphor"],"note":"the fog is pictured as a cat: silent, padding, a little mysterious","tenor":"the fog","vehicle":"a cat","ground":"silent, padding, a little mysterious"},{"id":"L2t","lens":"structure","w":[3],"span":[[3,3]],"label":"line break after “comes”","tag":"enjambment","accept":["enjambment"],"note":"a pause, as if the fog hesitates"}]},{"id":"L3","lines":["But, soft! what light through yonder window breaks?","It is the east, and Juliet is the sun."],"author":"Shakespeare, \u003ci>Romeo and Juliet\u003c/i>","cite":"\u003ci>Romeo and Juliet\u003c/i> 2.2.2–3","parts":["Juliet","the sun","the east","the window"],"swap":"Juliet is very beautiful.","rate":[[5,5,3],[1,2,0]],"devices":[{"id":"L3f","lens":"figure","w":[14,15,16,17],"span":[[14,17]],"label":"Juliet is the sun","tag":"metaphor","accept":["metaphor"],"note":"Juliet as the centre of Romeo’s world: light, warmth, life","tenor":"Juliet","vehicle":"the sun","ground":"light, warmth, the centre everything turns toward","readEffect":"Juliet becomes the centre of Romeo’s world."},{"id":"L3i","lens":"imagery","w":[3,6,7],"span":[[3,7]],"label":"light … window breaks","tag":"visual imagery","accept":["visual imagery"],"note":"dawn breaking; Juliet as a sunrise"}],"like":{"lines":["But, soft! what light through yonder window breaks?","It is the east, and Juliet is like the sun."],"fresh":[16],"devices":[{"id":"L3fl","lens":"figure","w":[14,15,16,17,18],"span":[[14,18]],"label":"Juliet is like the sun","tag":"simile","accept":["simile"],"note":"the claim hedges: Juliet only resembles the sun","tenor":"Juliet","vehicle":"the sun","ground":"light, warmth, the centre everything turns toward"},{"id":"L3il","lens":"imagery","w":[3,6,7],"span":[[3,7]],"label":"light … window breaks","tag":"visual imagery","accept":["visual imagery"],"note":"dawn breaking; Juliet as a sunrise"}]}},{"id":"L4","lines":["I wandered lonely as a cloud","That floats on high o’er vales and hills,"],"author":"Wordsworth, “I Wandered Lonely as a Cloud”","cite":"Wordsworth, “I Wandered Lonely as a Cloud”, lines 1–2","parts":["the speaker","a cloud","the hills","loneliness"],"swap":"I walked around alone.","rate":[[4,4,3],[1,2,0]],"devices":[{"id":"L4f","lens":"figure","w":[2,3,4,5],"span":[[2,5]],"label":"lonely as a cloud","tag":"simile","accept":["simile"],"note":"solitary, drifting, above the world","tenor":"the speaker","vehicle":"a cloud","ground":"solitary, drifting, above the world"},{"id":"L4s","lens":"sound","w":[12,13,14],"span":[[12,14]],"label":"vales and hills","tag":"assonance/consonance (l)","accept":["assonance","consonance"],"note":"soft, floating sounds"}]},{"id":"L5","lines":["“Hope” is the thing with feathers –","That perches in the soul –"],"author":"Emily Dickinson","cite":"Dickinson, “‘Hope’ is the thing with feathers”, lines 1–2","parts":["hope","a bird","the soul","feathers"],"swap":"Hope stays inside us.","rate":[[4,4,4],[1,2,0]],"devices":[{"id":"L5f","lens":"figure","w":[0,1,2,3,4,5],"span":[[0,5],[3,5]],"label":"“Hope” is the thing with feathers","tag":"metaphor","accept":["metaphor"],"note":"hope as a small bird: fragile, alive, singing","tenor":"hope","vehicle":"a bird","ground":"fragile, alive, singing"},{"id":"L5t","lens":"structure","w":[6,13],"span":[[6,6],[13,13],[6,13]],"label":"dashes","tag":"punctuation","accept":["punctuation"],"note":"breath-like pauses; thought in motion"}]},{"id":"L6","lines":["In Flanders fields the poppies blow","Between the crosses, row on row,"],"author":"John McCrae (1915)","cite":"McCrae, “In Flanders Fields”, lines 1–2","parts":null,"devices":[{"id":"L6s","lens":"sound","w":[1,2],"span":[[1,2]],"label":"Flanders fields","tag":"alliteration (/f/)","accept":["alliteration"],"note":"soft, mournful opening"},{"id":"L6t","lens":"structure","w":[10,11,12],"span":[[10,12]],"label":"row on row","tag":"repetition","accept":["repetition"],"note":"endless rows of graves made visible"},{"id":"L6i","lens":"imagery","w":[4,9],"span":[[4,9]],"label":"poppies … crosses","tag":"visual imagery / contrast","accept":["visual imagery","contrast"],"note":"living colour against grave markers"}]},{"id":"L7","lines":["Once upon a midnight dreary, while I pondered, weak and weary,"],"author":"Poe, “The Raven”","cite":"Poe, “The Raven”, line 1","parts":null,"devices":[{"id":"L7r","lens":"sound","w":[4,10],"span":[[4,10]],"label":"dreary · weary","tag":"internal rhyme","accept":["internal rhyme"],"note":"a chiming, hypnotic rhythm"},{"id":"L7w","lens":"sound","w":[0,5,8,10],"span":[[0,10]],"label":"Once · while · weak · weary","tag":"alliteration (/w/)","accept":["alliteration"],"note":"a drowsy, sighing sound; “Once” begins with /w/"}]},{"id":"L8","lines":["West wind, blow from your prairie nest,","Blow from the mountains, blow from the west."],"author":"E. Pauline Johnson (Tekahionwake), “The Song My Paddle Sings”","cite":"Johnson, “The Song My Paddle Sings”, lines 1–2","parts":["the west wind","a living being","the prairie","the mountains"],"devices":[{"id":"L8f","lens":"figure","w":[0,1,4,5,6],"span":[[0,6]],"label":"West wind … your prairie nest","tag":"apostrophe and personification","accept":["apostrophe","personification"],"note":"the speaker calls to the wind as if it could hear and answer","tenor":"the west wind","vehicle":"a living being","ground":"it can hear, answer and come when called"},{"id":"L8s","lens":"sound","w":[2,8,12],"span":[[2,12]],"label":"blow … blow … blow","tag":"repetition","accept":["repetition"],"note":"a chant, like a paddler’s rhythm"},{"id":"L8d","lens":"diction","w":[5,11,15],"span":[[5,15]],"label":"prairie, mountains, west","tag":"place words","accept":["place words"],"note":"a Canadian landscape claimed in song"}]}],"meterNote":"One careful reader’s ratings. Do you agree?","aha":"A device is a decision. When you remove it, meaning leaks out, and the loss tells you what the device was doing.","rebuild":{"literal":"The traffic moved slowly.","verbs":[{"t":"crawled","slow":true,"viv":0},{"t":"oozed","slow":true,"viv":1},{"t":"inched","slow":true,"viv":1},{"t":"raced","slow":false,"viv":0}],"vehicles":[{"id":"snail","t":"a snail","noun":"snail","viv":2,"fit":"cliche"},{"id":"glacier","t":"a glacier","noun":"glacier","viv":4,"fit":"slow"},{"id":"honey","t":"honey","noun":"honey","viv":4,"fit":"slow"},{"id":"lightning","t":"lightning","noun":"lightning","viv":4,"fit":"fast"},{"id":"river","t":"a river","noun":"river","viv":3,"fit":"either"}],"fitText":{"slow":"fits the scene","cliche":"fits, but it’s a cliché","fast":"fights the meaning","either":"unclear: a river can be slow or fast"}},"predIntro":"Make a prediction first. Then the lens will show you what really happens.","predictions":[{"id":"p1","prompt":"If “on little cat feet” became “slowly and quietly,” what would be lost?","options":[{"t":"The rhyme","_n":"o19e","_k":"634b51b5"},{"t":"The poem’s setting","_n":"p1ce","_k":"ed19480c"},{"t":"The picture of silent, padding movement and the fog’s sly, cat-like personality","_n":"q1be","_k":"8d74df2b"},{"t":"Nothing; the meaning is identical","_n":"r1ee","_k":"a8d6e3bc"}],"explain":"The figure gives the fog a body and a temperament. “Slowly and quietly” keeps the facts but loses the creature."},{"id":"p2","prompt":"Before you switch on Sound: which effect will it reveal in “He clasps the crag with crooked hands”?","options":[{"t":"A rhyme inside the line","_n":"s1de","_k":"91fa6890"},{"t":"Soft \u003cem>s\u003c/em> sounds that calm the line","_n":"t30e","_k":"4f7a66b1"},{"t":"Onomatopoeia imitating an eagle’s cry","_n":"u31e","_k":"adea1141"},{"t":"Repeated hard /k/ sounds that make the grip sound tight and fierce","_n":"v2ee","_k":"f23f1c36"}],"explain":"Hard consonants are hard to say. The effort in your mouth becomes the effort in the talons."},{"id":"p3","prompt":"What would change if Romeo said “Juliet is \u003cem>like\u003c/em> the sun”?","options":[{"t":"The claim would weaken from an identity to a resemblance","_n":"w2fe","_k":"37467560"},{"t":"Nothing would change","_n":"x2ce","_k":"bc0b50b1"},{"t":"It would get stronger","_n":"y2de","_k":"98b14b9f"},{"t":"It would become personification","_n":"z2ae","_k":"3380cb31"}],"explain":"A metaphor dares to say she \u003cem>is\u003c/em> the sun. A simile hedges: she resembles it. Romeo isn’t in a hedging mood."},{"id":"p4","prompt":"The Structure lens is about to mark “row on row”. Predict its effect.","options":[{"t":"It names the colour of the poppies","_n":"102be","_k":"e1f7d591"},{"t":"It signals that a new speaker begins","_n":"1128e","_k":"ef79a22e"},{"t":"It tells us the poppies are growing quickly","_n":"1229e","_k":"1a60267c"},{"t":"The repetition shows the rows of graves going on and on, making the scale of loss visible","_n":"13a2e","_k":"bbe151b4"}],"explain":"Repetition can enact what it describes: you read “row” and then another “row”, as the eye moves across a field of graves."}],"chalIntro":"Use the device lens to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. \u003cstrong>Set it up\u003c/strong> opens the right line and mode. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"\u003cstrong>Name the parts.\u003c/strong> In Hunt mode, on L5: tag the metaphor in Dickinson’s line, then name its tenor and vehicle. \u003cbutton type=\"button\" class=\"btn ghost sm dl-setup\" data-setup=\"tc1\">Set it up\u003c/button>","why":"Dickinson says hope \u003cem>is\u003c/em> the thing with feathers: a metaphor. Hope is the tenor (what’s described); a bird is the vehicle (it carries the qualities).","hints":["What is the poem talking about?","Hope is pictured as something with feathers.","Metaphor; tenor = hope; vehicle = a bird."]},{"id":"tc2","goal":5,"prompt":"\u003cstrong>Make it fresh.\u003c/strong> In Effect m&#101;ter mode, start from the literal sentence “The traffic moved slowly.” Rebuild it with a figure so it’s vivid \u003cem>and\u003c/em> fits. Use the chips: a verb (crawled · oozed · inched · raced) and a vehicle (a snail · a glacier · honey · lightning · a river). \u003cbutton type=\"button\" class=\"btn ghost sm dl-setup\" data-setup=\"tc2\">Set it up\u003c/button>","why":"A slow verb with a vehicle that’s slow by nature, and not worn out: Vividness reads 4 or more and Fit reads “fits the scene”.","hints":["Which vehicles are slow by nature?","Which of those haven’t you heard a hundred times?","“The traffic oozed like honey” or “inched like a glacier”."]},{"id":"tc3","goal":[1,4],"stretch":true,"prompt":"\u003cstrong>Hear it, don’t read it.\u003c/strong> In Hunt mode, on L7: tag every word in Poe’s line that \u003cstrong>begins with a /w/ sound\u003c/strong> as Sound → alliteration. Spelling will try to trick you. \u003cbutton type=\"button\" class=\"btn ghost sm dl-setup\" data-setup=\"tc3\">Set it up\u003c/button>","why":"Exactly. Alliteration lives in the mouth, not on the page. That drowsy run of /w/ sounds is part of why the line feels so weary.","hints":["Read the line aloud slowly. Press Slow.","Four words begin with the same sound. One of them is spelled with O.","Once (wunce), while, weak, weary."]}]},"part3":{"slug":"make","name":"Make","heading":"Make the figure","intro":"Explore taught you to read figures. Now build your own with the same tools: tenor, vehicle and ground. A “Why it works” panel holds each figure to three tests: \u003cstrong>fit\u003c/strong>, \u003cstrong>freshness\u003c/strong> and \u003cstrong>extension\u003c/strong>.","make":{"tenors":["grief","the city at night","a first job","memory","a winter morning in your town"],"vehicles":["a tide","a locked room","a sleeping animal","a heavy coat","a ghost"],"verbs":["whispers","waits","forgets","keeps watch","sighs"],"forms":[{"id":"metaphor","label":"Metaphor","note":"Identity: it says the tenor \u003cem>is\u003c/em> the vehicle."},{"id":"simile","label":"Simile","note":"Resemblance: it says the tenor is only \u003cem>like\u003c/em> the vehicle."},{"id":"personification","label":"Personification","note":"A lent human life: the tenor acts like a person."}],"text":[{"form":"Metaphor","card":"L3","line":"“It is the east, and Juliet is the sun.”","cite":"(\u003ci>Romeo and Juliet\u003c/i> 2.2.3)","note":"She \u003cem>is\u003c/em> the sun: an identity."},{"form":"Simile","card":"L4","line":"“I wandered lonely as a cloud”","cite":"(Wordsworth, line 1)","note":"“As” signals a resemblance."},{"form":"Personification","card":"L1","line":"“He clasps the crag with crooked hands;”","cite":"(Tennyson, line 1)","note":"The eagle is lent human hands."}],"cliches":["heart of gold","cold as ice","time flies","a sea of faces","busy as a bee","light as a feather","quiet as a mouse","snails pace","packed like sardines","white as snow","black as night","sharp as a tack","fit as a fiddle","pretty as a picture","brave as a lion","strong as an ox","slow as molasses","quick as a flash","clear as crystal","crystal clear","dead as a doornail","hard as nails","sly as a fox","busy as a beaver","cool as a cucumber","happy as a clam","blind as a bat","gentle as a lamb","old as the hills","plain as day","smooth as silk","sweet as honey","raining cats and dogs","calm before the storm","blanket of snow","heart of stone","tip of the iceberg","good as gold","like a moth to a flame","wise as an owl"],"kill":[{"id":"k1","cliche":"busy as a bee","scene":"a restaurant kitchen at the dinner rush","avoid":["bee","bees"]},{"id":"k2","cliche":"cold as ice","scene":"an outdoor rink in January","avoid":["ice","icy"]},{"id":"k3","cliche":"light as a feather","scene":"an empty backpack on the last day of school","avoid":["feather","feathers"]},{"id":"k4","cliche":"quiet as a mouse","scene":"a waiting room at 3 a.m.","avoid":["mouse","mice"]},{"id":"k5","cliche":"time flies","scene":"the last week of summer holidays","avoid":["fly","flies","flying","flew","flown"]}],"clicheMsg":"Readers have seen this one too often to see it. Find a vehicle only you would think of that still fits.","extendEx":"If grief is a tide, what is the moon?"},"quickCheck":{"title":"Make the figure quick check","summary":"Make the figure quick check","items":[{"id":"q1","goal":3,"prompt":"In “Grief is a tide,” what is the vehicle?","choices":[{"t":"the tide","fb":"Right. Grief is the tenor (what’s described); the tide is the vehicle that carries the meaning.","_n":"14a1e","_k":"5ec7d0e8"},{"t":"the shore","fb":"The tenor is grief (what’s described); the tide carries the meaning.","_n":"15a0e","_k":"3a5e6acf"},{"t":"grief","fb":"The tenor is grief (what’s described); the tide carries the meaning.","_n":"169fe","_k":"22b4c36e"},{"t":"the moon","fb":"The tenor is grief (what’s described); the tide carries the meaning.","_n":"179ee","_k":"0909d5d4"}]},{"id":"q2","goal":5,"prompt":"Which is the freshest figure for a crowded bus?","choices":[{"t":"“packed like sardines”","fb":"“Packed like sardines” is a cliché; “sardine can on wheels” leans on it; “very full” is literal.","_n":"189de","_k":"c4f46aa6"},{"t":"“a jar of elbows and wet coats”","fb":"Right. It’s fresh, and the elbows and wet coats make you feel the crush.","_n":"199ce","_k":"adc9fddb"},{"t":"“a sardine can on wheels”","fb":"“Packed like sardines” is a cliché; “sardine can on wheels” leans on it; “very full” is literal.","_n":"1a9be","_k":"d2204905"},{"t":"“very full”","fb":"“Packed like sardines” is a cliché; “sardine can on wheels” leans on it; “very full” is literal.","_n":"1baae","_k":"e1305bc5"}]},{"id":"q3","goal":3,"prompt":"A green light at the end of a dock appears again and again in a novel and comes to stand for a character’s longing. This is a…","choices":[{"t":"hyperbole","fb":"It’s a real object in the story that also stands for more.","_n":"1ca9e","_k":"4edfe0cc"},{"t":"symbol","fb":"Right. It’s a real object in the story that also stands for more.","_n":"1d9ce","_k":"bc075482"},{"t":"simile","fb":"It’s a real object in the story that also stands for more.","_n":"1e9de","_k":"a5bf0ae3"},{"t":"metaphor","fb":"It’s a real object in the story that also stands for more.","_n":"1f9ee","_k":"dfe07c5d"}]},{"id":"q4","goal":3,"prompt":"Turn “The city is a sleeping animal” into personification.","choices":[{"t":"“The city is like an animal.”","fb":"Personification gives the city a human action (snoring) and human things (a blanket).","_n":"1g9fe","_k":"30802cf7"},{"t":"“The city snores under its blanket of fog.”","fb":"Right. Personification gives the city a human action (snoring) and human things (a blanket).","_n":"1h98e","_k":"b3c3d6d5"},{"t":"“The city is very quiet.”","fb":"Personification gives the city a human action (snoring) and human things (a blanket).","_n":"1i99e","_k":"3ca73486"},{"t":"“The city has many animals.”","fb":"Personification gives the city a human action (snoring) and human things (a blanket).","_n":"1j9ae","_k":"6c216c05"}]}]},"blocksAfter":[{"type":"write","id":"steal","title":"Sentence to steal","html":"\u003cp class=\"steal-line\">“The fog comes / on little cat feet.”\u003c/p>\u003cp class=\"eng-cite\">Carl Sandburg, “Fog” (1916), lines 1–2\u003c/p>\u003cp>\u003cstrong>Its shape:\u003c/strong> “The [natural or abstract thing] comes / on [small adjective] [animal] [body part].”\u003c/p>\u003cp>\u003cstrong>Model imitation:\u003c/strong> “The rumour arrives / on narrow ferret paws.”\u003c/p>\u003cp>Keep the shape. Change the content. Notice what the shape does: a short line, a break, then a surprising body.\u003c/p>","prompt":"Your imitation:"}]},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Device sort","summary":"Device sort","noun":"line","txt":true,"goal":[1,3],"instruction":"Sort ten lines by their main device.","how":"Tap a line, then tap the box it belongs in. Each line has one main device.","boxes":[{"id":"b1","label":"Simile"},{"id":"b2","label":"Metaphor"},{"id":"b3","label":"Personification"},{"id":"b4","label":"Sound device"}],"wrongDefault":"Look for “like” or “as” first. Then ask: is something given human traits, does one thing \u003cem>become\u003c/em> another, or is the line working on the ear?","items":[{"id":"i1","t":"“I wandered lonely as a cloud” (Wordsworth)","_a":"FAQEFA==","why":"“As” signals the comparison between the speaker and a cloud.","wrong":{"b2":"“As” signals a simile."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Simile: “lonely as a cloud” uses “as”."]},{"id":"i2","t":"“It is the east, and Juliet is the sun.” (Shakespeare)","_a":"FAQHFA==","why":"No “like” or “as”: Juliet \u003cem>is\u003c/em> the sun.","wrong":{"b1":"No “like” or “as”; she \u003cem>is\u003c/em> the sun."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Metaphor: Juliet \u003cem>is\u003c/em> the sun, with no signal word."]},{"id":"i3","t":"“The fog comes / on little cat feet.” (Sandburg)","_a":"FAQHFA==","why":"The fog becomes a cat: an implied metaphor.","wrong":{"b3":"Personification lends \u003cem>human\u003c/em> traits; here the fog becomes a cat: an implied metaphor."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Metaphor: the fog becomes a cat (an implied metaphor), not a person."]},{"id":"i4","t":"“Because I could not stop for Death – / He kindly stopped for me –” (Dickinson)","_a":"FAQGFA==","why":"Death is given a human action and manners: he “kindly stopped”.","wrong":{"b2":"Death is given a human action and manners: he “kindly stopped”."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Personification: Death “kindly stopped”, like a polite person."]},{"id":"i5","t":"“Hear the mellow wedding bells” (Poe)","_a":"FAQBFA==","why":"Nothing is compared; the repeated vowel in mellow, wedding, bells (assonance) works on the ear.","wrong":{"b2":"Nothing is compared; listen to the repeated vowel in mellow, wedding, bells."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Sound device: the repeated short \u003cem>e\u003c/em> in mellow, wedding, bells."]},{"id":"i6","t":"“And like a thunderbolt he falls.” (Tennyson)","_a":"FAQEFA==","why":"“Like” marks a comparison between the eagle and lightning.","wrong":{"b3":"“Like” marks a comparison between the eagle and lightning."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Simile: “like a thunderbolt”."]},{"id":"i7","t":"“the tintinnabulation that so musically wells” (Poe)","_a":"FAQBFA==","why":"The long, ringing word imitates bells: a sound device.","wrong":{"b1":"The long, ringing word imitates bells: a sound device."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Sound device: “tintinnabulation” imitates ringing bells."]},{"id":"i8","t":"“The city’s windows were a thousand sleepless eyes.” (original)","_a":"FAQHFA==","why":"The sentence says the windows \u003cem>were\u003c/em> eyes: the main device is metaphor.","wrong":{"b3":"Accepted thinking. Eyes are human, but the sentence says the windows \u003cem>were\u003c/em> eyes: the main device is metaphor."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Metaphor: the windows \u003cem>were\u003c/em> eyes."]},{"id":"i9","t":"“The old fridge sighed and settled for the night.” (original)","_a":"FAQGFA==","why":"The fridge is given human actions: sighing, settling for the night.","wrong":{"b4":"The fridge is given human actions: sighing, settling for the night."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Personification: the fridge sighs and settles like a person."]},{"id":"i10","t":"“Her laugh was like a door flung open.” (original)","_a":"FAQEFA==","why":"“Like” signals a simile.","wrong":{"b2":"“Like” signals a simile."},"hints":["Look for “like” or “as” first.","Is something given human traits, or does one thing \u003cem>become\u003c/em> another?","Simile: “like a door flung open”."]}]},{"id":"unseen","type":"custom","title":"Unseen passage","summary":"Unseen passage","star":true,"goal":[1,2,6],"instruction":"Read the passage, then choose the best answer to each question. Questions 5 and 6 go beyond the Final Check.","how":"Pick an answer, then press Check answer. Wrong answers show why; try again.","passage":["By February the valley had given up arguing with the cold. The river, which all autumn had chattered over its stones, now lay under a lid of ice, holding its breath. Snow settled on the roofs like dust on forgotten books. At dusk the streetlights came on one by one, small and stubborn, each a match struck against the dark. Nobody walked the main street after six; the wind owned it then, rattling the signs, testing every door. In the bakery window a single lamp burned all night, and the smell of bread leaked out under the door like a rumour of spring."],"cite":"Original passage, written for this course.","items":[{"id":"u1","goal":[1,2],"prompt":"“lay under a lid of ice, holding its breath”: device and effect?","options":[{"t":"Onomatopoeia: the words imitate the sound of ice","why":"No word here imitates a sound; “holding its breath” gives the river a human action.","_n":"1k9be","_k":"e1734587"},{"t":"Simile: the river is compared to someone holding their breath","why":"No “like” or “as”.","_n":"1la4e","_k":"0df5095a"},{"t":"Hyperbole: the cold is exaggerated","why":"Nothing is exaggerated in size or amount; the river is given a human action.","_n":"1ma5e","_k":"0e7b3d66"},{"t":"Personification: the frozen river seems tense and waiting, alive but suspended","why":"Holding its breath is a human action, so the frozen river seems alive but suspended, waiting.","_n":"1naef","_k":"ed22f96f"}],"hints":["Is there “like” or “as”? Is the river given something only people do?","Holding your breath is a human action.","Personification: the river seems alive but suspended, waiting."]},{"id":"u2","goal":2,"prompt":"“like dust on forgotten books”: what does the simile suggest about the valley?","options":[{"t":"That the snow is falling heavily","why":"Dust settles lightly and slowly; the simile is about stillness and neglect, not amount.","_n":"1oadf","_k":"f04c7d98"},{"t":"That the people of the valley read a lot","why":"That takes the books literally. The books belong to the vehicle, not to the scene.","_n":"1pb0f","_k":"3937cbf2"},{"t":"That the houses are dirty","why":"Read for feeling, not facts. “Forgotten” is the key word.","_n":"1qaff","_k":"00e49270"},{"t":"Neglect and stillness, as if the town has been left on a shelf and time has stopped","why":"Dust gathers on what nobody touches; “forgotten” turns the snow into a sign of neglect and stopped time.","_n":"1raaf","_k":"7fe84a97"}],"hints":["What happens to books nobody opens?","“Forgotten” is the key word.","Neglect and stillness: the town left on a shelf, time stopped."]},{"id":"u3","goal":2,"prompt":"“each a match struck against the dark”: best reading?","options":[{"t":"The darkness is beautiful","why":"The lights are set \u003cem>against\u003c/em> the dark; “stubborn” shows resistance, not admiration.","_n":"1sa9f","_k":"9f96c92d"},{"t":"The streetlights are lit by hand with matches","why":"That reads the metaphor literally. The match is the vehicle; the streetlights are the tenor.","_n":"1tacf","_k":"3077e68c"},{"t":"The lights are dangerous","why":"Matches here are small and brave, not a fire hazard. Stay with the passage’s tone.","_n":"1uabf","_k":"588cc810"},{"t":"Small acts of resistance against an overwhelming darkness; “stubborn” supports it","why":"A struck match is small and brief, but it pushes back the dark; “small and stubborn” makes the lights brave.","_n":"1va6f","_k":"fcb2f8d0"}],"hints":["Which word just before the figure describes the lights?","“Small and stubborn”: what does a struck match do to the dark?","Small acts of resistance against an overwhelming dark."]},{"id":"u4","goal":1,"prompt":"“the wind owned it then”: which device, and what does it show?","options":[{"t":"Hyperbole: the wind is exaggerated to seem stronger than it is","why":"It isn’t an exaggeration of size or amount; the wind is given a human right to own.","_n":"1wa5f","_k":"956596bd"},{"t":"Simile: the wind is compared to an owner","why":"No “like” or “as”; the wind simply owns the street.","_n":"1xa8f","_k":"98c66fa7"},{"t":"Symbol: the wind stands for the town’s mayor","why":"Nothing in the passage supports that; the wind is given a human right to own.","_n":"1ya9f","_k":"674b2b5b"},{"t":"Personification (ownership): the town has surrendered the street to nature after dark","why":"Only people own things; giving the wind ownership shows the town handing the street over to nature.","_n":"1za6f","_k":"5a49daac"}],"hints":["Who can own a street?","The wind is given a human right.","Personification: the town has surrendered the street to nature after dark."]},{"id":"u5","goal":6,"prompt":"\u003cspan class=\"tag\">★\u003c/span> Which sentence best analyses the passage as a whole?","options":[{"t":"“The passage describes a cold valley in February.”","why":"That’s summary: it says what happens, not how the figures build meaning.","_n":"20a7f","_k":"7244bbb1"},{"t":"“The passage has lots of devices like personification and simile.”","why":"That lists tools without saying what they build.","_n":"21acf","_k":"852a4804"},{"t":"“The passage moves from images of surrender (the silent river, the abandoned street) to small images of resistance (stubborn lights, the bakery lamp), so that the final simile, ‘a rumour of spring’, turns the description toward hope.”","why":"It traces how the figures change across the passage and says what the ending does with them.","_n":"22adf","_k":"a06bdecb"},{"t":"“The passage proves that the writer dislikes winter.”","why":"That guesses at the writer and ignores the turn toward hope at the end.","_n":"23aaf","_k":"62745e40"}],"hints":["Sort the images: which give up, and which resist?","Where does the passage end up?","Surrender → resistance → hope."]},{"id":"u6","goal":2,"prompt":"\u003cspan class=\"tag\">★\u003c/span> Which single change would most weaken the ending?","options":[{"t":"Replacing “bakery” with “bread shop”","why":"A synonym for the place changes little; the closing simile carries the turn to hope.","_n":"24abf","_k":"60b9e324"},{"t":"Replacing “like a rumour of spring” with “and smelled nice”","why":"The closing simile carries the turn to hope; “smelled nice” is literal and flat, so the ending loses its meaning.","_n":"25a0f","_k":"32646c8c"},{"t":"Changing “after six” to “after seven”","why":"The hour doesn’t carry the passage’s meaning; the closing simile does.","_n":"26a1f","_k":"7ad9ce1d"},{"t":"Changing “single lamp” to “lamp”","why":"That’s a small loss; the closing simile carries the turn to hope.","_n":"279ad","_k":"7265d9e2"}],"hints":["Which words carry the turn toward hope?","Look at the last simile.","Replacing “like a rumour of spring” with “and smelled nice” removes the turn to hope."]}]},{"id":"spot","type":"custom","title":"Spot the error","summary":"Spot the error","student":"Bastien","goal":[2,3,6],"instruction":"Bastien made one mistake in each paragraph. Tap the sentence where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Analyse the opening of Wordsworth’s poem.","steps":["In the opening line of Wordsworth’s poem, the speaker compares himself to a cloud.","This comparison is a metaphor.","The cloud “floats on high o’er vales and hills” (Wordsworth, line 2), drifting above the world.","The figure makes the speaker’s loneliness feel light and wandering rather than painful."],"_a":"Bw==","stepFb":["Sentence 1 is accurate. Keep checking.","","Sentence 3 integrates the quotation well. The mistake is earlier.","Sentence 4 explains the effect. The mistake is earlier."],"fixes":[{"t":"This comparison is a simile, signalled by “as” in “lonely as a cloud”.","why":"“As” marks the comparison, so it’s a simile.","_n":"2899d","_k":"c475b0f2"},{"t":"Sentence 2 is correct.","why":"“As” marks a simile.","_n":"2998d","_k":"a6ba1451"},{"t":"This comparison is alliteration.","why":"Alliteration is a sound device; this is a comparison.","_n":"2a97d","_k":"917c54ee"},{"t":"This comparison is personification.","why":"The speaker isn’t giving the cloud human traits; he compares himself to it.","_n":"2b9ed","_k":"7d614137"}],"hints":["What word links “lonely” and “cloud”?","“As”.","Simile."]},{"id":"e2","goal":2,"task":"Analyse line 1 of “The Eagle”.","steps":["Tennyson opens “The Eagle” with the eagle’s grip on its perch.","He writes, “He clasps the crag with crooked hands” (Tennyson, line 1).","The alliteration in this line is used to make the poem more interesting.","Tennyson also uses personification by giving the eagle hands."],"_a":"BA==","stepFb":["A fair opening claim. Keep checking.","The quotation and citation are correct.","","Sentence 4 is accurate. The problem came before it."],"fixes":[{"t":"Sentence 3 is fine.","why":"“More interesting” could describe any device. Say what \u003cem>this\u003c/em> one does.","_n":"2c9dd","_k":"664871cb"},{"t":"The alliteration in this line is the letter c.","why":"That names the letter, not the effect.","_n":"2d9cd","_k":"2c8581b3"},{"t":"The alliteration shows that Tennyson loved eagles.","why":"That guesses at the poet, not the effect on the reader.","_n":"2e9bd","_k":"0979c93f"},{"t":"The repeated hard /k/ sounds in “clasps”, “crag” and “crooked” are harsh to say, so the grip sounds fierce and unyielding, establishing the eagle’s power before it moves.","why":"It says what \u003cem>this\u003c/em> alliteration does: device → effect → meaning.","_n":"2fa2d","_k":"9b951577"}],"hints":["Could “more interesting” describe any device at all?","What do hard /k/ sounds feel like to say?","Harsh → fierce grip → power."]},{"id":"e3","goal":6,"task":"Analyse McCrae’s opening.","steps":["McCrae’s “In Flanders Fields” opens on a battlefield cemetery.","The soft /f/ alliteration of “Flanders fields” gives the opening a hushed, mournful sound.","The repetition in “row on row” (McCrae, line 2) makes the rows of graves seem endless.","This proves that McCrae believed war is beautiful, because poppies are beautiful flowers.","Overall, the opening sets a tone of quiet grief."],"_a":"BQ==","stepFb":["Accurate. Keep checking.","Sound and effect are linked. Keep checking.","Good: the device enacts the meaning.","","Sentence 5 is reasonable. The problem is earlier."],"fixes":[{"t":"Sentence 4 is correct.","why":"“Proves” and “McCrae believed” leap past the evidence. In the poem it’s the dead who speak, not McCrae.","_n":"2ga1d","_k":"0f9c332a"},{"t":"This proves McCrae hated poppies.","why":"Unsupported in the other direction.","_n":"2h94c","_k":"dfdd5e55"},{"t":"Setting bright poppies among grave markers contrasts living colour with death, sharpening the sense of loss rather than celebrating war.","why":"It reads the image for its effect and stays with what the poem supports.","_n":"2i95c","_k":"872c95fe"},{"t":"This shows the poem is about gardening.","why":"A literal misreading.","_n":"2j96c","_k":"edb94591"}],"hints":["Does beauty in an image mean the speaker approves of war?","Look at what the poppies sit beside.","Contrast of life and death."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which lens surprised you most, and on which line? What did you hear or see that you’d missed before?"},{"id":"j2","q":"In your own words: why isn’t naming a device enough? Use one line from today as your example."},{"id":"j3","q":"Explain to a friend the difference between a simile and a metaphor, using a sentence you write yourself."},{"id":"j4","q":"Which device do you still find hard to hear or name? What will you do the next time you meet it?"}],"blocks":[{"title":"Commonplace book","html":"\u003cp>Save one line from today that you’d like to remember, and add a note on why it stayed with you.\u003c/p>\u003cdiv id=\"cp-app\">\u003c/div>"}],"art":{"intro":"Write one craft principle about figures or sound that you believe now. Make it a rule a writer could follow. Then pair it with a master’s example from today and an imitation of your own.","placeholder":"Your principle, in one sentence","examples":["He clasps the crag with crooked hands; (Tennyson, “The Eagle”)","The fog comes / on little cat feet. (Sandburg, “Fog”)","It is the east, and Juliet is the sun. (Shakespeare, Romeo and Juliet)","I wandered lonely as a cloud (Wordsworth)","“Hope” is the thing with feathers – / That perches in the soul – (Dickinson)","In Flanders fields the poppies blow / Between the crosses, row on row, (McCrae)","Once upon a midnight dreary, while I pondered, weak and weary, (Poe, “The Raven”)","West wind, blow from your prairie nest, / Blow from the mountains, blow from the west. (Johnson, “The Song My Paddle Sings”)","And like a thunderbolt he falls. (Tennyson, “The Eagle”)"]},"artSamples":"\u003cp class=\"tiny muted\" style=\"margin:0 0 6px\">Two sample principles (examples only; write your own):\u003c/p>\u003cp class=\"an-note an-figure\">“A metaphor should surprise first and feel inevitable second.” \u003cspan class=\"muted\">Master: “The fog comes / on little cat feet.” Imitation: “The deadline arrives / on soft accountant shoes.”\u003c/span>\u003c/p>\u003cp class=\"an-note an-sound\">“Let the sound of a line do what the line describes.” \u003cspan class=\"muted\">Master: “He clasps the crag with crooked hands.” Imitation: “The skates scraped, skidded, scratched across the pond.”\u003c/span>\u003c/p>","commonplaceLines":["He clasps the crag with crooked hands; (Tennyson, “The Eagle”)","The fog comes / on little cat feet. (Sandburg, “Fog”)","It is the east, and Juliet is the sun. (Shakespeare, Romeo and Juliet)","I wandered lonely as a cloud (Wordsworth)","“Hope” is the thing with feathers – / That perches in the soul – (Dickinson)","In Flanders fields the poppies blow / Between the crosses, row on row, (McCrae)","Once upon a midnight dreary, while I pondered, weak and weary, (Poe, “The Raven”)","West wind, blow from your prairie nest, / Blow from the mountains, blow from the west. (Johnson, “The Song My Paddle Sings”)","And like a thunderbolt he falls. (Tennyson, “The Eagle”)"]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In “I wandered lonely as a cloud,” the main device is:","options":[{"t":"an oxymoron","why":"No contradictory words are paired.","_n":"2k97c","_k":"ce377d3d"},{"t":"onomatopoeia","why":"No word imitates a sound.","_n":"2l98c","_k":"a55480ed"},{"t":"a metaphor","why":"There’s a signal word: “as”.","_n":"2m99c","_k":"1e8b1d51"},{"t":"a simile","why":"“As” signals the comparison.","_n":"2n9ac","_k":"ea897d61"}]},"b":{"prompt":"In “Death, be not proud, though some have called thee / Mighty and dreadful” (Donne), the speaker addresses Death directly. This device is:","options":[{"t":"apostrophe","why":"Speaking to someone absent, or to a thing, as if it could hear.","_n":"2o9bc","_k":"06e0d12f"},{"t":"alliteration","why":"The device here is the direct address, not a sound pattern.","_n":"2p9cc","_k":"d3cc963e"},{"t":"a simile","why":"Nothing is compared with “like” or “as”.","_n":"2q9dc","_k":"8cf4fba8"},{"t":"onomatopoeia","why":"No word imitates a sound.","_n":"2r37a","_k":"23f0c7b4"}]}},{"id":"k2","cat":"K","goal":[1,4],"a":{"prompt":"Read aloud: “He clasps the crag with crooked hands.” Which sound device is most prominent?","options":[{"t":"onomatopoeia","why":"No word imitates a sound.","_n":"2s38a","_k":"e878e156"},{"t":"end rhyme","why":"Rhyme needs two line endings; this is one line.","_n":"2t39a","_k":"4e036d80"},{"t":"an oxymoron","why":"That’s a pairing of opposites, not a sound.","_n":"2u3aa","_k":"e91dc665"},{"t":"alliteration of the /k/ sound","why":"Clasps, crag, crooked.","_n":"2v3ba","_k":"51b586be"}]},"b":{"prompt":"Which group of words alliterates on the same \u003cstrong>sound\u003c/strong>?","options":[{"t":"“gentle,” “garden,” “gate”","why":"“Gentle” begins with /j/.","_n":"2w3ca","_k":"c6fee589"},{"t":"“cat,” “city,” “cold”","why":"“City” begins with /s/, not /k/.","_n":"2x3da","_k":"833173c5"},{"t":"“Once,” “while,” “weary”","why":"All three begin with a /w/ sound, including “Once”.","_n":"2y3ea","_k":"088e6742"},{"t":"“phone,” “pony,” “pear”","why":"“Phone” begins with /f/.","_n":"2z2fa","_k":"d172eb12"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"In “The fog comes / on little cat feet,” what is the \u003cstrong>vehicle\u003c/strong>?","options":[{"t":"a cat","why":"The cat carries the qualities (silence, stealth) over to the fog.","_n":"3030a","_k":"54950471"},{"t":"the fog","why":"The fog is the tenor: what’s being described.","_n":"313da","_k":"8bb05727"},{"t":"silence","why":"Silence is part of the ground (what they share), not the vehicle.","_n":"323ca","_k":"59c91737"},{"t":"the harbour","why":"The harbour is part of the scene, not the comparison.","_n":"333ba","_k":"c096fb27"}]},"b":{"prompt":"In “It is the east, and Juliet is the sun,” what is the \u003cstrong>tenor\u003c/strong>?","options":[{"t":"the east","why":"The east sets up the image; Juliet is its subject.","_n":"343aa","_k":"1c5b0c7f"},{"t":"the window","why":"The window is part of the scene.","_n":"3541a","_k":"9a418b73"},{"t":"the sun","why":"The sun is the vehicle.","_n":"3640a","_k":"ab226e9d"},{"t":"Juliet","why":"She is what’s being described.","_n":"373fa","_k":"1848dc5c"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"“The classroom clock chewed through the afternoon, one slow bite at a time.” Which reading is best supported?","options":[{"t":"The clock is broken.","why":"That reads the figure literally.","_n":"383ea","_k":"8d9fb3d7"},{"t":"The afternoon passes quickly.","why":"“Slow” says the opposite.","_n":"3935a","_k":"2b498da2"},{"t":"The afternoon feels slow and draining, as if time were being eaten bit by bit","why":"“Chewed” and “slow bite” make time a meal that drags on.","_n":"3a34a","_k":"ca161334"},{"t":"The speaker is hungry and thinking about lunch.","why":"Nothing in the line supports it; “chewed” describes time, not the speaker.","_n":"3b43a","_k":"1de90b0a"}]},"b":{"prompt":"“The highway unrolled ahead of us like a grey ribbon pulled from a spool.” Which reading is best supported?","options":[{"t":"Someone in the car is sewing.","why":"That takes the simile literally.","_n":"3c44a","_k":"418e1dd0"},{"t":"The road seems smooth, endless and effortless, pulled out ahead of the travellers","why":"A ribbon unspooling suggests continuous, easy length.","_n":"3d41a","_k":"100a87b1"},{"t":"The road is damaged and dangerous.","why":"Nothing in the image suggests damage.","_n":"3e42a","_k":"a2ec3b90"},{"t":"The trip is very short.","why":"A spool of ribbon suggests length.","_n":"3f3fa","_k":"369714c2"}]}},{"id":"t2","cat":"T","goal":[2,4],"a":{"prompt":"Read aloud: “The surf slid and seethed against the sand.” What does the repeated /s/ sound do?","options":[{"t":"It imitates the hiss of moving water, so the reader hears the scene","why":"Sibilance mimics the sound of the surf.","_n":"3g40a","_k":"681e9953"},{"t":"It shows the speaker is angry.","why":"Nothing in the line points to the speaker’s mood.","_n":"3h3da","_k":"cc30089a"},{"t":"It creates an end rhyme.","why":"Rhyme needs line endings that sound alike.","_n":"3i3ea","_k":"9c95f1c2"},{"t":"It tells us the scene is at night.","why":"Sound devices don’t indicate time of day.","_n":"3j3ba","_k":"bdba38b2"}]},"b":{"prompt":"Read aloud: “The big bass drum boomed, bold and brash.” What does the repeated /b/ sound do?","options":[{"t":"It reveals the drummer’s name.","why":"No name is given.","_n":"3k3ca","_k":"d0aac222"},{"t":"Its heavy, explosive beats imitate the drum’s pounding","why":"Plosive /b/ sounds land like drumbeats.","_n":"3la9a","_k":"1147917e"},{"t":"It is assonance.","why":"These are repeated consonant sounds at the start of words: alliteration.","_n":"3ma8a","_k":"4a5118ed"},{"t":"It makes the line quiet and gentle.","why":"Plosives are loud and hard.","_n":"3naba","_k":"1feb7ed8"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"“My first job was a small country. It had its own language (prices, codes, ‘Have a nice day’), its own weather (the rush at noon), and its own border, the staff door, which I crossed each Saturday wearing a different face.” How does the figure work?","options":[{"t":"The speaker literally moved to another country.","why":"The “border” is the staff door.","_n":"3oaaa","_k":"82892bba"},{"t":"It is decoration and adds nothing to meaning.","why":"Remove it and the sense of crossing into another identity disappears.","_n":"3pada","_k":"186c4784"},{"t":"It is an extended metaphor: each detail (language, weather, border) maps a feature of the job onto a country, showing how separate the work world felt and how the speaker became someone else there","why":"Each part of the country matches a part of the job, so the figure keeps working across the whole passage.","_n":"3qaca","_k":"e6a98875"},{"t":"It is a simile comparing a job to a country.","why":"There’s no “like” or “as”; it says the job \u003cem>was\u003c/em> a country.","_n":"3rafa","_k":"3a177ac8"}]},"b":{"prompt":"“Grief is a house I keep finding new rooms in. Some days I open a door and there is only dust; some days, his coat still hangs on the hook.” How does the figure work?","options":[{"t":"It is a symbol of the speaker’s wealth.","why":"Nothing suggests wealth; the house carries the grief.","_n":"3saea","_k":"e21f3532"},{"t":"It is a simile comparing grief to a house.","why":"There’s no “like” or “as”; it says grief \u003cem>is\u003c/em> a house. A simile signals the comparison with “like” or “as”. A metaphor says one thing \u003cem>is\u003c/em> another.","_n":"3tb1a","_k":"1f6507e0"},{"t":"The speaker is literally moving house.","why":"The house is the vehicle, not a real move. Swap the figure for a literal phrase and see what disappears. That loss is the figure’s meaning.","_n":"3ub0a","_k":"2c23c004"},{"t":"It is an extended metaphor: grief as a house whose rooms reveal unexpected memories, showing grief as something lived in and still being discovered","why":"Rooms, doors, dust and a coat each extend the figure, so grief feels lived in and still unfolding.","_n":"3vafa","_k":"83508407"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best analysis sentence about “He clasps the crag with crooked hands”?","options":[{"t":"“Tennyson uses alliteration to make the poem more interesting.”","why":"“More interesting” could describe any device.","_n":"3wb0a","_k":"850602aa"},{"t":"“The harsh /k/ alliteration of ‘clasps the crag with crooked hands’ makes the eagle’s grip sound fierce and unyielding, establishing its power before it ever moves.”","why":"It names the device precisely, says what it does (a fierce grip) and why it matters (the eagle’s power).","_n":"3xb1a","_k":"e1304707"},{"t":"“This line has alliteration.”","why":"It names the device without its effect.","_n":"3yb2a","_k":"2fc6445e"},{"t":"“The eagle has hands, which is a simile.”","why":"Giving the eagle hands is personification.","_n":"3zaba","_k":"89cd0824"}]},"b":{"prompt":"Which is the best analysis sentence about “The fog comes / on little cat feet”?","options":[{"t":"“Sandburg uses a metaphor to make it better.”","why":"“Make it better” could describe any device. You’ve named the tool. Now say what it builds: what does the reader see, hear or feel because of it?","_n":"40aca","_k":"d9979336"},{"t":"“By picturing the fog as a cat, Sandburg gives it silent, padding movement and a hint of independence, so the weather feels alive and slightly mysterious.”","why":"It links the device (the fog as a cat) to its effect (silent movement, independence) and to meaning (the weather feels alive).","_n":"41ada","_k":"70d46143"},{"t":"“The fog is like a cat, which is a simile.”","why":"There’s no “like” in the line.","_n":"42aea","_k":"7df3bdbe"},{"t":"“This is a metaphor.”","why":"You’ve named the tool. Now say what it builds: what does the reader see, hear or feel because of it?","_n":"43b7a","_k":"4c8b9c6c"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"Which term most precisely names “O brawling love! O loving hate!” (\u003ci>Romeo and Juliet\u003c/i> 1.1)?","options":[{"t":"onomatopoeia","why":"No word imitates a sound.","_n":"44b8a","_k":"253d85c8"},{"t":"personification","why":"Love isn’t given human actions here; it’s paired with its opposite.","_n":"45b5a","_k":"d85b85a8"},{"t":"oxymoron","why":"Opposites (love and hate, brawling and loving) are fused.","_n":"46b4a","_k":"9d190ecd"},{"t":"simile","why":"Nothing is compared with “like” or “as”.","_n":"47b3a","_k":"c43e8b64"}]},"b":{"prompt":"“Water, water, every where, / Nor any drop to drink” (Coleridge). The sailors are surrounded by water they cannot drink. Which term best names this situation?","options":[{"t":"situational irony","why":"What happens is the opposite of what you’d expect: water everywhere, yet thirst.","_n":"48b2a","_k":"a4e09e65"},{"t":"onomatopoeia","why":"No word imitates a sound.","_n":"49b1a","_k":"574ab4c8"},{"t":"personification","why":"The water isn’t given human traits; the point is the gap between what you’d expect and what happens.","_n":"4ab0a","_k":"409faaed"},{"t":"simile","why":"Nothing is compared with “like” or “as”; the lines describe a situation.","_n":"4bafa","_k":"c64e8d95"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A student is writing a poem about the first snowfall of the year and wants a fresh figure for its silence. Which line best meets that goal?","options":[{"t":"“The snow was as white as snow.”","why":"Circular and flat.","_n":"4caea","_k":"506f2fe7"},{"t":"“The snow was a roaring lion.”","why":"Vivid, but it fights the silence.","_n":"4dbda","_k":"5c659e54"},{"t":"“The snow was a hush the sky had been saving all year.”","why":"Fresh, and it fits: silence as something stored up and finally released.","_n":"4ebca","_k":"65929f25"},{"t":"“The snow fell softly and quietly.”","why":"Literal; no figure.","_n":"4f3bb","_k":"3591718a"}]},"b":{"prompt":"A student wants a fresh figure for a crowded subway at rush hour. Which line best meets that goal?","options":[{"t":"“We were packed in like sardines.”","why":"A cliché.","_n":"4g3cb","_k":"6a8b751a"},{"t":"“The subway car was a quiet library.”","why":"It fights the scene.","_n":"4h39b","_k":"499d9127"},{"t":"“The subway car was a fist of strangers, clenched between stations.”","why":"Fresh, and the fist captures pressure and tension.","_n":"4i3ab","_k":"783b768d"},{"t":"“The subway was very crowded.”","why":"Literal.","_n":"4j3fb","_k":"b552744a"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"A (fictional) ad for Polaris Tea reads: “A sunrise in every cup.” What is the metaphor doing?","options":[{"t":"Nothing; slogans don’t use figurative language","why":"Ads are full of figures.","_n":"4k40b","_k":"e104cb24"},{"t":"Comparing tea to the sun with a simile","why":"There’s no “like” or “as”.","_n":"4l3db","_k":"3fb455a2"},{"t":"Linking the tea with warmth, energy and a fresh start, so the ad sells a feeling, not just a drink","why":"The sunrise lends its qualities (warmth, energy, a new day) to the tea.","_n":"4m3eb","_k":"cbbd684d"},{"t":"Literally promising that the cup contains the sun","why":"Nobody expects the sun in a cup. Swap the figure for a literal phrase and see what disappears. That loss is the figure’s meaning.","_n":"4n33b","_k":"6bb460df"}]},"b":{"prompt":"A (fictional) ad for Bolt Runners shoes reads: “Lightning in a box.” What is the metaphor doing?","options":[{"t":"Nothing; it’s just the brand’s name","why":"The brand is Bolt Runners; the slogan adds a figure. Swap the figure for a literal phrase and see what disappears. That loss is the figure’s meaning.","_n":"4o34b","_k":"e443fa79"},{"t":"Literally warning that the box contains electricity","why":"That reads the figure literally: lightning is the vehicle, carrying speed and power over to the shoes.","_n":"4p41b","_k":"9edd28c6"},{"t":"Linking the shoes with speed, power and excitement, so buyers imagine themselves transformed","why":"Lightning lends its speed and power to the shoes, and to whoever wears them.","_n":"4q40b","_k":"8a8789e1"},{"t":"Comparing shoes to lightning with a simile","why":"There’s no “like” or “as”; the slogan says the box holds lightning.","_n":"4r43b","_k":"5000e4f6"}]}}]},"task":{"title":"A figure that earns its place","summary":"A figure that earns its place","statement":"\u003cp>Write a short piece (a poem or a prose snapshot of 3–6 lines) about a subject from your own life, built around at least one figure and one sound device. Then write its plain, literal “before” version, so a reader can see what your figures do.\u003c/p>\u003cp class=\"tiny muted\">This checklist makes sure the parts are there. Your teacher reads the writing.\u003c/p>\u003cdetails class=\"alg pt-rubric\">\u003csummary>How your teacher reads it (levels 1–4)\u003c/summary>\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"topic-tbl\">\u003cthead>\u003ctr>\u003cth scope=\"col\">Level\u003c/th>\u003cth scope=\"col\">The piece and the craft statement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Figures are fresh and precisely fitted; sound reinforces meaning; the before/after contrast shows clear insight; the craft statement uses terms accurately and explains effect convincingly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Figures fit and are mostly fresh; sound is purposeful; the craft statement explains effect clearly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Figures are present but partly clichéd or loosely fitted; sound devices are incidental; effect is explained generally\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Figures are missing, mislabelled or clichéd; little sense of effect\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>","checks":["The right length","At least one figure, tagged","Your simile really is a simile","At least one sound device, tagged","A literal “before” version","Craft statement"],"tips":["Poems: 3–6 lines. Prose snapshots: 30–90 words. Short pieces make every word count.","Select your figure in the text and tag it: is it a metaphor, a simile, a personification or a symbol?","A simile needs “like” or “as”. If yours doesn’t have one, it’s probably a metaphor; retag it.","Tag a sound device. If it’s alliteration, select at least two words, and check by saying them aloud.","Write the plain version. No figures, just the facts. It shows what your figures add.","In 40 words or more, explain one choice. What’s your tenor, what’s your vehicle, and what effect did you want?"],"explainPrompt":"Craft statement: what choices did you make, and why?","explainLabel":"Craft statement","vocab":"Use at least two of these words: tenor, vehicle, effect, sound, image, literal.","checkLabel":"Check my piece","success":"Your piece has all its parts. There are many ways to do this well. Here are three very different ones.","forms":[{"id":"poem","t":"poem"},{"id":"prose","t":"prose snapshot"}],"subjects":["a place you know well","an object you own","a feeling","a season in your town"],"menu":{"figure":["metaphor","simile","personification","symbol"],"sound":["alliteration","assonance","consonance","onomatopoeia","sibilance","repetition/rhythm"]},"terms":["tenor","vehicle","effect","sound","image","literal"],"models":[{"title":"Model response 1: poem, a place (urban, metaphor-led)","text":["The subway at seven is a sleeping animal.","It breathes through iron lungs at every stop,","shrugs off a coat of commuters,","and dreams of the dark between stations."],"tags":"“a sleeping animal” (metaphor); “breathes through iron lungs” (personification); “shrugs off a coat of commuters” (personification, plus alliteration on /k/: coat, commuters).","before":"The subway is quiet at seven in the morning. Doors open at each stop and people get off.","craft":"My tenor is the subway and my vehicle is a sleeping animal, because early in the morning the train feels alive but not awake. I used “shrugs off a coat of commuters” for the effect of people leaving all at once, and the /k/ sound makes it feel heavy."},{"title":"Model response 2: prose snapshot, an object (domestic, sound-led)","text":["My grandmother’s kettle hisses, spits, then sings — a small brass choir of one. In winter it is the first voice in the house, louder than the radio, warmer than the furnace, and it never once forgot its part."],"tags":"“hisses, spits, then sings” (sibilance and onomatopoeia); “a small brass choir of one” (metaphor); “never once forgot its part” (personification).","before":"My grandmother’s kettle is made of brass and makes noise when it boils. She uses it every morning in winter.","craft":"I wanted the sound of the kettle to do the work, so the hissing s sounds come first. The vehicle, a choir, turns the noise into music. That changes the literal fact (it’s loud) into a feeling (it’s comforting and faithful), which is the effect I wanted."},{"title":"Model response 3: poem, a feeling (abstract, simile-led)","text":["Before the exam my worry is like a fly in a jar:","small, loud, sure there’s a way out,","hitting the same glass wall again, again."],"tags":"“like a fly in a jar” (simile); “small, loud” (diction); “again, again” (repetition, a structure device; tagged as Sound: repetition/rhythm).","before":"Before the exam I feel worried and I keep thinking the same thoughts.","craft":"The tenor is worry and the vehicle is a fly trapped in a jar. The ground is being small but frantic and stuck in a loop. The repetition “again, again” makes the reader feel the same loop. The literal version says I’m worried; the figure makes you hear it buzzing."}]},"cards":[["Figurative language","Words that mean more than they literally say. “The fog comes / on little cat feet.” (Sandburg)"],["Simile","A comparison signalled by “like” or “as”. “I wandered lonely as a cloud.” (Wordsworth)"],["Metaphor","Says one thing \u003cem>is\u003c/em> another. “Juliet is the sun.” (\u003ci>Romeo and Juliet\u003c/i> 2.2.3)"],["Tenor / vehicle / ground","Tenor = what’s described (hope); vehicle = what carries the meaning (a bird); ground = what they share. “‘Hope’ is the thing with feathers.” (Dickinson)"],["Personification","Human qualities given to a non-human thing. “He kindly stopped for me.” (Dickinson, of Death)"],["Apostrophe","Speaking to something absent or non-human as if it could hear. “Death, be not proud.” (Donne)"],["Alliteration","Repeated beginning consonant \u003cem>sounds\u003c/em>. “He clasps the crag with crooked hands.” (Tennyson)"],["Assonance","Repeated vowel sounds. “Hear the mellow wedding bells.” (Poe)"],["Onomatopoeia","A word that imitates a sound. “the tintinnabulation that so musically wells” (Poe)"],["Hyperbole","Deliberate exaggeration. “An hundred years should go to praise / Thine eyes” (Marvell)"],["Oxymoron","Contradictory terms fused. “O brawling love! O loving hate!” (\u003ci>Romeo and Juliet\u003c/i> 1.1)"],["Symbol","A concrete thing in a text that also stands for something larger. “The poppies blow / Between the crosses” (McCrae): poppies as remembrance"]]}};</script>
