.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}

.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}

table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 02: hero, Choice chain (D3 counting slots, D1 tree, list vs multiply, menus), Part 3 stations, count entry, task */
/* radioGroup (from MDM4U 01 / MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* @component D1 treeDiagram styles (copy with the component) */
.d1-scroll{overflow:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.d1.bare .d1-scroll{border:0;background:transparent;overflow:visible}
.d1-box{position:relative}
.d1-svg{position:absolute;left:0;top:0}
.d1-e{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.d1-hi{fill:none;stroke:var(--hi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.d1-in{position:absolute;left:0;top:0;right:0;bottom:0}
.d1-root{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
.d1-lab{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 6px;border:1.5px solid var(--ink-2);border-radius:13px;background:var(--sheet);color:var(--ink);font:400 1rem/23px var(--font-math);text-align:center;white-space:nowrap}
.d1-lab.on{border:2px solid var(--sel-bd);background:var(--hi-soft);color:var(--ink);font-weight:600}
.d1-p{position:absolute;transform:translate(-50%,-50%);font:400 .85rem var(--font-math);color:var(--ink-2);background:var(--sheet);padding:0 2px;white-space:nowrap}
.d1-leaf{position:absolute;transform:translate(-50%,-50%);min-height:30px;min-width:32px;padding:0 .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem/27px var(--font-math);white-space:nowrap}
.d1.right .d1-leaf{transform:translate(0,-50%)}
.d1-leaf.on{background:var(--hi-soft);border:2px solid var(--sel-bd);color:var(--ink);font-weight:700}
button.d1-leaf:hover{border-color:var(--pen)}
.d1-leaf small{font-size:.8em;color:var(--ink-2)}
.d1-stage{position:absolute;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* @component D3 countingSlots styles (copy with the component) */
.cc-slots{display:grid;grid-template-columns:repeat(var(--cc-c,3),minmax(0,150px));gap:8px;margin:4px 0 12px}
.cc-slot{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0;padding:5px 4px 7px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);text-align:center}
.cc-slot.hi{background:var(--hi-soft);border-color:var(--sel-bd)}
.cc-slot.warn{border:2px dashed var(--ink);box-shadow:0 0 0 3px var(--hi)}
.cc-ord{display:flex;justify-content:center;align-items:center;gap:3px;min-height:24px}
.cc-badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--sheet);font:700 .8rem var(--font-ui)}
.cc-mv{display:inline-grid;place-items:center;width:24px;height:24px;padding:0;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font-size:.66rem;line-height:1}
.cc-mv:hover:not(:disabled){border-color:var(--pen)}
.cc-mv:disabled{opacity:.3}
.cc-name{font-size:.78rem;font-weight:700;color:var(--ink-2);line-height:1.15;overflow-wrap:anywhere}
.cc-n{font:700 1.7rem/1.05 var(--font-math);color:var(--ink)}
.cc-wi{font-size:.9rem;margin-left:2px;vertical-align:.3em}
.cc-wt{font-size:.72rem;font-weight:700;color:var(--red);line-height:1.2}
.cc-ut{font-size:.72rem;color:var(--ink-2);line-height:1.2}
.cc-pool{display:grid;gap:1px;justify-content:center;margin:0 auto}
.cc-pool i{display:block;font-style:normal;border-radius:2px}
.cc-pool.tD{grid-template-columns:repeat(5,12px)}
.cc-pool.tD i{height:13px;font:700 .58rem/13px var(--font-ui)}
.cc-pool.tL{grid-template-columns:repeat(13,4px)}
.cc-pool.tL i{height:8px;border-radius:1px}
.cc-pool.tI{grid-template-columns:repeat(9,6px);gap:2px}
.cc-pool.tI i{height:6px;border-radius:50%}
.cc-pool i.a{background:var(--pen);color:var(--sheet)}
.cc-pool i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink-2)}
.cc-pool i.u{background:repeating-linear-gradient(135deg,var(--ink-2) 0 1.5px,transparent 1.5px 3.5px);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-2)}
.cc-sel{width:100%;min-height:30px;padding:0 2px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 .78rem var(--font-ui)}
.cc-sel:focus{border-color:var(--ink)}
.cc-step{display:flex;align-items:center;justify-content:space-between;gap:2px}
.cc-step button{width:26px;height:26px;padding:0;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:700 1rem/1 var(--font-ui)}
.cc-step button:disabled{opacity:.35}
.cc-pl{flex:1 1 auto;min-width:0;font:400 .9rem var(--font-math);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){ .cc-slots{grid-template-columns:repeat(var(--cc-cm,3),minmax(0,1fr));gap:6px} .cc-slot{padding:4px 3px 6px} .cc-step button{width:24px} .cc-pl{font-size:.78rem} .cc-sel{font-size:.72rem} }

/* Choice chain */
.cc-top{margin-bottom:6px}
.cc-scen .rg-wrap{margin-bottom:4px}
.cc-note{margin:0 0 10px}
.cc-cap.long{font-size:clamp(1.05rem,3vw,1.5rem)}
.cc-tnote{margin:0 0 6px}
.cc-sws{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:6px}
.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.cc-switch[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.cc-switch[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}
.cc-switch:disabled{opacity:.45;cursor:not-allowed}
.cc-bld{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.cc-how{margin:8px 0 0}
.cc-ok{color:var(--green);font-weight:700}
.cc-bad{color:var(--red);font-weight:700}
.cc-menus{margin:2px 0 8px}
.cc-mn{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:10px 14px;margin:6px 0 10px}
.cc-mcol{min-width:9.5em;padding:8px 12px;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);transition:transform .9s ease}
.cc-mcol h4{margin:0 0 4px;font-size:.92rem}
.cc-mcol ul,.cc-mcol ol{margin:0;padding-left:1.3em}
.cc-or{align-self:center;font:italic 700 1.15rem var(--font-ui);transition:opacity .6s}
.cc-mn.merging .cc-mcol.a{transform:translateX(35%)}
.cc-mn.merging .cc-mcol.b{transform:translateX(-35%)}
.cc-mn.merging .cc-or{opacity:0}
.cc-mn.merged .cc-mcol{border-width:2px;border-color:var(--sel-bd);background:var(--hi-soft)}
.cc-mn.merged li{animation:ccIn .4s both}
@keyframes ccIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.cc-mnote{text-align:center;margin:0 0 10px}
.cc-race{margin:0 0 12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.cc-race-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cc-sw-ic{width:22px;height:22px;color:var(--ink);flex:none}
.cc-lane{display:grid;grid-template-columns:6.4em minmax(0,1fr) 8em;align-items:center;gap:8px;margin:5px 0}
.cc-lab{font-weight:700;font-size:.88rem}
.cc-bar{height:12px;border-radius:6px;background:var(--sheet);border:1px solid var(--ink-2);overflow:hidden}
.cc-bar i{display:block;height:100%;width:0;background:var(--pen);transition:width .12s linear}
.cc-ct{font-size:.85rem}
.cc-race-sum{margin:6px 0 0;font-weight:700;min-height:1.3em}
.cc-lv h4{margin:10px 0 6px}
.cc-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:4px;margin:0;padding:0;list-style:none}
.cc-items li{padding:2px 6px;border:1.5px dashed var(--rule);border-radius:6px;font:400 .92rem var(--font-math);opacity:.3;overflow-wrap:anywhere}
.cc-items li.on{opacity:1;border-style:solid;border-color:var(--ink-2)}
.cc-msteps{margin:0 0 10px;padding-left:1.4em;font:400 1.02rem var(--font-math)}
.cc-msteps li{opacity:.3}
.cc-msteps li.on{opacity:1}
.cc-too{margin:0}
@media (max-width:560px){ .cc-lane{grid-template-columns:5.6em minmax(0,1fr) 6.6em;gap:6px} .cc-items{grid-template-columns:repeat(auto-fill,minmax(7.2em,1fr))} }

/* hero */
.fcp-h{display:grid;gap:6px;justify-items:center;width:100%}
.fcp-board{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;font-size:.9rem}
.fcp-bt{width:100%;text-align:center;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.fcp-b{padding:.15em .6em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);transition:background .3s,border-color .3s}
.fcp-b b{font-family:var(--font-math)}
.fcp-b.was{border-color:var(--ink-2)}
.fcp-b.on{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.fcp-stage{position:relative;width:100%;max-width:400px}
.fcp-svg{display:block;width:100%;height:auto;transform-origin:50% 0;transition:transform 1s ease,opacity 1s ease}
.fcp-stage.shrunk .fcp-svg{transform:scale(.52);opacity:.32}
.fcp-e{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.fcp-root{fill:var(--ink)}
.fcp-node{fill:var(--ink-2)}
.fcp-leaf{fill:var(--pen)}
.fcp-slots{position:absolute;left:0;right:0;bottom:2%;display:flex;justify-content:center;align-items:center;gap:8px;font:400 1.6rem var(--font-math);color:var(--ink);opacity:0;transform:translateY(12px);transition:opacity .8s .4s,transform .8s .4s}
.fcp-slots.on{opacity:1;transform:none}
.fcp-s{display:inline-grid;place-items:center;width:50px;height:50px;border:2px solid var(--ink);border-radius:8px;background:var(--sheet);font-weight:700}
.fcp-eq{font-weight:700}

/* Part 3 */
.wm-st{margin-bottom:12px}
.wm-station h3{margin-top:0}
.wm-codes{margin:4px 0 12px}
.wm-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
.wm-gl{min-width:7.6em;font-size:.85rem;color:var(--ink-2)}
.wm-code{display:inline-grid;place-items:center;min-width:2.8em;min-height:30px;border:1.5px dashed var(--rule);border-radius:6px;font:400 1.05rem var(--font-math);color:var(--ink-2)}
.wm-code.on{border:2px solid var(--sel-bd);background:var(--hi-soft);color:var(--ink);font-weight:700}

/* N4 countEntry */
.ce-qn{width:auto;min-width:28px;padding:0 6px;border-radius:14px}
.numin.ce-wide{width:22rem}

/* task */
.cs-conds{margin:.4em 0 .8em;padding-left:1.4em}
.cs-in{margin:4px 0 12px}
.cs-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.cs-lab{min-width:9.5em;font-weight:700}
.cs-b{min-width:42px}
.cs-out{min-width:1.6em;text-align:center;font:700 1.3rem var(--font-math)}
.cs-strip{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px;min-height:44px}
.cs-cell{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;padding:3px 4px;border:1.5px solid var(--ink-2);border-radius:6px;background:var(--sheet)}
.cs-cell.d{border-style:dashed}
.cs-cell small{font-size:.68rem;color:var(--ink-2)}
.cs-cell b{font:700 1.15rem var(--font-math)}
.cs-prod{font:400 1.15rem var(--font-math);margin:4px 0;overflow-wrap:anywhere}

</style>
</head>

opic","group":"5"},{"nn":"33","slug":"histograms","title":"Frequency Distributions & Histograms","kind":"topic","group":"5"},{"nn":"34","slug":"scatter-plots","title":"Scatter Plots & Correlation","kind":"topic","group":"6"},{"nn":"35","slug":"pearson-r","title":"The Pearson Correlation Coefficient r","kind":"topic","group":"6"},{"nn":"36","slug":"linear-regression","title":"Linear Regression & Line of Best Fit","kind":"topic","group":"6"},{"nn":"37","slug":"residuals","title":"Residuals & Goodness of Fit","kind":"topic","group":"6"},{"nn":"38","slug":"causation","title":"Two-Variable Analysis & Causation","kind":"topic","group":"6"},{"nn":"39","slug":"culminating-investigation","title":"Culminating Data-Management Investigation","kind":"topic","group":"7"}]},"salt":"152124fa","content":{"id":"02-fundamental-counting-principle","kind":"topic","title":"The fundamental counting principle","topic":"The Fundamental Counting Principle","readyTopic":"the fundamental counting principle","hero":{"eq":"`3 × 4 × 2 = 24`","eqLabel":"3 times 4 times 2 equals 24","eqSize":"md","headline":"Multiply the choices, don’t list them","text":"When a task happens in \u003cstrong>stages\u003c/strong>, the number of ways to do it is the \u003cstrong>product\u003c/strong> of the number of choices at each stage. That’s the \u003cstrong>fundamental counting principle\u003c/strong>. It counts a million licence plates as easily as a dozen lunches.","fig":{"html":"\u003cdiv class=\"fcp-h\" role=\"img\" aria-label=\"A café board lists 3 sandwiches, 4 drinks and 2 desserts. A tree sprouts 3 sandwich branches. Each splits into 4 drink branches: 12 leaves, 3 × 4. Each of those splits into 2 dessert branches: 24 leaves, 3 × 4 × 2. The tree then shrinks into a row of three slots labelled 3, 4 and 2, equal to 24.\">\u003cdiv class=\"fcp-board\" aria-hidden=\"true\">\u003cspan class=\"fcp-bt\">Café board\u003c/span>\u003cspan class=\"fcp-b\" data-b=\"0\">Sandwiches \u003cb>3\u003c/b>\u003c/span>\u003cspan class=\"fcp-b\" data-b=\"1\">Drinks \u003cb>4\u003c/b>\u003c/span>\u003cspan class=\"fcp-b\" data-b=\"2\">Desserts \u003cb>2\u003c/b>\u003c/span>\u003c/div>\u003cdiv class=\"fcp-stage\" aria-hidden=\"true\">\u003csvg class=\"fcp-svg\" id=\"fcp-svg\" viewBox=\"0 0 360 176\" preserveAspectRatio=\"xMidYMid meet\" focusable=\"false\">\u003c/svg>\u003cdiv class=\"fcp-slots\" id=\"fcp-slots\">\u003cspan class=\"fcp-s\">3\u003c/span>\u003cspan class=\"fcp-x\">×\u003c/span>\u003cspan class=\"fcp-s\">4\u003c/span>\u003cspan class=\"fcp-x\">×\u003c/span>\u003cspan class=\"fcp-s\">2\u003c/span>\u003cspan class=\"fcp-eq\">= 24\u003c/span>\u003c/div>\u003c/div>\u003c/div>"}},"goals":["I can explain why a tree diagram’s leaves are counted by multiplying.","I can apply the fundamental counting principle to tasks with several stages.","I can count with repetition allowed and with no repetition.","I can handle a restricted position by filling it first.","I can decide when to multiply (“and then”) and when to add (“or”)."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Sample spaces","goal":1,"prompt":"A coin is flipped and a die is rolled. How many outcomes?","options":[{"t":"6","why":"The coin doubles the list.","_n":"0462","_k":"1db5543b"},{"t":"8","why":"Each coin result pairs with all 6 die results.","_n":"1492","_k":"21dfa2a5"},{"t":"12","why":"6 outcomes for each of H and T.","_n":"2482","_k":"4380b6a4"},{"t":"36","why":"That’s two dice.","_n":"34b2","_k":"bdf35120"}],"hints":["Draw the tree.","H splits into 6, T splits into 6.","12."]},{"id":"w2","skill":"Sample spaces","goal":1,"prompt":"How many leaves does a tree have if the first stage has 3 branches and each of those splits into 5?","options":[{"t":"5","why":"There are 3 groups.","_n":"44a2","_k":"506ae1f4"},{"t":"8","why":"Count the leaves: 5 under each of 3 branches.","_n":"54d2","_k":"aef26138"},{"t":"15","why":"3 groups of 5.","_n":"64c2","_k":"93c82d77"},{"t":"125","why":"5³ would be three stages of 5.","_n":"73f2","_k":"fa9869f1"}],"hints":["How many leaves under one first branch?","5.","3 × 5 = 15."]},{"id":"w3","skill":"Multiplication and powers","goal":3,"prompt":"What is 10 × 9 × 8?","options":[{"t":"27","why":"That’s 10 + 9 + 8.","_n":"83e2","_k":"bde648e1"},{"t":"504","why":"That’s 9 × 8 × 7.","_n":"9dce","_k":"80bf4b7e"},{"t":"720","why":"10 × 9 = 90, and 90 × 8 = 720.","_n":"adde","_k":"1c898df6"},{"t":"1000","why":"That’s 10 × 10 × 10.","_n":"bdee","_k":"486ab727"}],"hints":["Multiply the first two.","90.","90 × 8 = 720."]},{"id":"w4","skill":"Multiplication and powers","goal":2,"prompt":"Which expression equals 2 × 2 × 2 × 2 × 2?","options":[{"t":"2 × 5","why":"That’s 2 + 2 + 2 + 2 + 2.","_n":"cdfe","_k":"f2923791"},{"t":"`5^2`","why":"`5^2 = 5 × 5 = 25`, but `2^5 = 32`.","_n":"de0e","_k":"d2c1bd67"},{"t":"10","why":"That’s 2 + 2 + 2 + 2 + 2.","_n":"ee1e","_k":"3609c72b"},{"t":"`2^5`","why":"Five factors of 2.","_n":"fe2e","_k":"893e7d30"}],"hints":["How many 2s are multiplied?","Five.","`2^5 = 32`."]},{"id":"w5","skill":"Reading conditions","goal":4,"prompt":"Which of these is a three-digit number?","options":[{"t":"30.7","why":"That isn’t a whole number.","_n":"ge3e","_k":"c3c19bff"},{"t":"037","why":"037 is the two-digit number 37.","_n":"hd4e","_k":"f3d8fdfc"},{"t":"307","why":"It starts with a non-zero digit.","_n":"id5e","_k":"a45f1bdf"},{"t":"3007","why":"That has four digits.","_n":"j4ef","_k":"5da289a2"}],"hints":["Can a number start with 0?","No: 037 is 37.","307."]},{"id":"w6","skill":"Reading conditions","goal":5,"prompt":"For lunch you may choose \u003cstrong>either\u003c/strong> a soup (3 kinds) \u003cstrong>or\u003c/strong> a salad (2 kinds), not both. How many choices?","options":[{"t":"1","why":"There are several options.","_n":"k4df","_k":"1929634a"},{"t":"3","why":"That ignores the salads.","_n":"l50f","_k":"12423342"},{"t":"5","why":"One item from 3 + 2 options.","_n":"m4ff","_k":"1c9c1341"},{"t":"6","why":"3 × 2 would be a soup \u003cstrong>and\u003c/strong> a salad.","_n":"n52f","_k":"f48484be"}],"hints":["Do you choose both, or one?","One: from all 5 items.","3 + 2 = 5."]}],"refreshers":{"Sample spaces":"A tree splits once per stage. If every branch splits the same way, the number of leaves is a product.","Multiplication and powers":"Multiply step by step. A repeated factor is a power: 2 × 2 × 2 = 2³.","Reading conditions":"Look for “no repeats”, “can’t start with 0”, “or”. Each one changes how you count."}}},"explore":{"heading":"Choice chain","intro":"Build a task stage by stage. Set the choices, switch repetition on or off, and watch the tree and the product grow.","predIntro":"Make a prediction first. Then the choice chain will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"scen","scen":"cafe"},"prompt":"Café meal. How many meals with one sandwich, one drink and one dessert?","options":[{"t":"6","_n":"o51f","_k":"d4e4a508"},{"t":"9","_n":"p54f","_k":"4b49515a"},{"t":"12","_n":"q53f","_k":"97522c38"},{"t":"24","_n":"r56f","_k":"76698971"}],"explain":"3 × 4 × 2 = 24."},{"id":"p2","start":{"mode":"scen","scen":"lock","repD":true},"prompt":"Bike lock, repeats allowed. How many combinations?","options":[{"t":"27","_n":"s55f","_k":"5b093ce0"},{"t":"30","_n":"te8e","_k":"d538397f"},{"t":"720","_n":"ue9e","_k":"b8a49f13"},{"t":"1000","_n":"ve6e","_k":"1e464134"}],"explain":"Each dial has 10 settings, whatever the others show."},{"id":"p3","start":{"mode":"scen","scen":"lock","repD":false},"prompt":"Bike lock, repeats off. Now how many?","options":[{"t":"30","_n":"we7e","_k":"0f26b87b"},{"t":"504","_n":"xe4e","_k":"0cbf202f"},{"t":"720","_n":"ye5e","_k":"1183f2f8"},{"t":"1000","_n":"ze2e","_k":"0e3137c7"}],"explain":"10 × 9 × 8 = 720."},{"id":"p4","start":{"mode":"build","menus":true},"prompt":"Lunch is a soup (3 kinds) \u003cstrong>or\u003c/strong> a sandwich (4 kinds). How many lunches?","options":[{"t":"3","_n":"10e3e","_k":"945371dd"},{"t":"4","_n":"11e0e","_k":"e02fba07"},{"t":"7","_n":"12e1e","_k":"d2c1a6ce"},{"t":"12","_n":"135af","_k":"6429a7e1"}],"explain":"You pick one item from 3 + 4. Multiply only for one thing \u003cstrong>and then\u003c/strong> another."}],"chalIntro":"Set up the choice chain, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Build a chain of exactly 3 stages, each with at least 2 choices, that gives exactly 60 outcomes.","why":"60 = 2 × 2 × 3 × 5, so {2, 5, 6}, {3, 4, 5}, {2, 3, 10} and {2, 2, 15} all work, in any order.","hints":["Factor 60.","60 = 2 × 2 × 3 × 5: group into three numbers.","3 × 4 × 5 works."]},{"id":"tc2","goal":3,"prompt":"Password scenario (2 letters, then 2 digits): set the repetition switches so there are exactly 65 000 passwords.","why":"26 × 25 × 10 × 10 = 65 000: the letters can’t repeat, the digits can.","hints":["65 000 = 650 × 100.","650 = 26 × 25.","Letters no repeats, digits repeats allowed."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Number builder: count the \u003cstrong>odd\u003c/strong> three-digit numbers with \u003cstrong>no repeated digits\u003c/strong>. Set the restrictions and the counting order so the counting check passes.","why":"Units first (5 odd digits), then hundreds (not 0 and not the units digit: 8), then tens (8): 5 × 8 × 8 = 320.","hints":["Which position has the strongest restriction?","Units: 5 odd digits. Then hundreds: not 0 and not the units digit.","5 × 8 × 8 = 320."]}]},"part3":{"slug":"multiply","name":"Multiply or add?","heading":"When to multiply","intro":"Multiplying counts one choice \u003cstrong>and then\u003c/strong> another. Visit each station: sort the scenarios, count a tree whose branches aren’t equal, then check a count by listing.","sort":{"id":"p3sort","type":"sorter","noun":"card","txt":true,"how":"Tap a card, then tap the box it belongs in.","boxes":[{"id":"mul","label":"Multiply","sub":"“and then”: one stage after another"},{"id":"add","label":"Add","sub":"“or”: choose one of them"}],"items":[{"id":"c1","t":"a shirt and then pants","_a":"E1hHXRA=","why":"“And then”: you choose a shirt, then pants. Multiply.","wrong":{"add":"The deciding words are “and then”: you choose both, one after the other."}},{"id":"c2","t":"a bus or a train to school","_a":"E1RWVRA=","why":"“Or”: you take one of them. Add the choices.","wrong":{"mul":"The deciding word is “or”: you take a bus or a train, not both."}},{"id":"c3","t":"a first-place and then a second-place finisher","_a":"E1hHXRA=","why":"“And then”: two places filled one after the other. Multiply.","wrong":{"add":"The deciding words are “and then”: both places get filled, one after the other."}},{"id":"c4","t":"one elective from arts or from technology","_a":"E1RWVRA=","why":"“Or”: one elective from either list. Add.","wrong":{"mul":"The deciding word is “or”: you take one elective, from one list or the other."}},{"id":"c5","t":"a PIN digit and then another digit","_a":"E1hHXRA=","why":"“And then”: one digit after another. Multiply.","wrong":{"add":"The deciding words are “and then”: you choose both digits, one after the other."}},{"id":"c6","t":"one movie: a comedy or a drama","_a":"E1RWVRA=","why":"“Or”: one movie of either kind. Add.","wrong":{"mul":"The deciding word is “or”: you watch one movie, a comedy or a drama."}}]},"quickCheck":{"title":"Quick check","summary":"When to multiply quick check","items":[{"id":"q1","goal":5,"prompt":"Movie night: one of 5 comedies or one of 3 dramas.","choices":[{"t":"3","fb":"One movie from 5 + 3.","_n":"1459f","_k":"3f2ca422"},{"t":"5","fb":"One movie from 5 + 3.","_n":"1558f","_k":"f7fcd27e"},{"t":"8","fb":"Right. One movie from 5 + 3 = 8.","_n":"1657f","_k":"4d0eec95"},{"t":"15","fb":"One movie from 5 + 3.","_n":"1756f","_k":"0e6a418e"}]},{"id":"q2","goal":5,"prompt":"One of 5 comedies, and then one of 3 snacks.","choices":[{"t":"3","fb":"A movie and then a snack: 5 × 3.","_n":"1855f","_k":"3c92715a"},{"t":"5","fb":"A movie and then a snack: 5 × 3.","_n":"1954f","_k":"08a14e0e"},{"t":"8","fb":"A movie and then a snack: 5 × 3.","_n":"1a53f","_k":"2b235805"},{"t":"15","fb":"Right. A movie and then a snack: 5 × 3 = 15.","_n":"1b62f","_k":"f05a4c69"}]},{"id":"q3","goal":5,"prompt":"Eggs (3 styles) or pancakes (2 toppings), then juice (2 kinds).","choices":[{"t":"6","fb":"(3 + 2) × 2 = 10.","_n":"1c61f","_k":"0799c3e0"},{"t":"7","fb":"(3 + 2) × 2 = 10.","_n":"1d54f","_k":"efb89303"},{"t":"10","fb":"Right. The breakfast is one of 3 + 2 = 5, then a juice: (3 + 2) × 2 = 10.","_n":"1e55f","_k":"2b7ad994"},{"t":"12","fb":"(3 + 2) × 2 = 10.","_n":"1f56f","_k":"8284a5df"}]},{"id":"q4","goal":2,"prompt":"A coin is flipped 5 times. How many outcomes?","choices":[{"t":"10","fb":"2⁵ = 32; 5² swaps base and exponent.","_n":"1g57f","_k":"2ec073eb"},{"t":"25","fb":"2⁵ = 32; 5² swaps base and exponent.","_n":"1h50f","_k":"0b394fc3"},{"t":"32","fb":"Right. Each of the 5 flips has 2 outcomes: 2⁵ = 32.","_n":"1i51f","_k":"9491712c"},{"t":"120","fb":"2⁵ = 32; 5² swaps base and exponent.","_n":"1j52f","_k":"623f6837"}]}]}},"practice":{"activities":[{"id":"count","type":"custom","title":"Count it","summary":"Count it","goal":[2,3],"instruction":"Count the ways for each task.","how":"Type a whole number, or a product such as 26 × 26 × 10 (powers like 26^4 or 26⁴ are fine), then press Check.","items":[{"id":"n1","goal":2,"prompt":"An outfit: 4 shirts, 3 pants, 2 pairs of shoes","_a":"AwE=","why":"4 × 3 × 2 = 24.","wrong":[{"match":9,"fb":"Each of the 4 shirts goes with each of the 3 pants, and each of those outfits with each of the 2 pairs of shoes: 4 × 3 × 2, not 4 + 3 + 2."}],"hints":["How many stages are there?","Shirts, then pants, then shoes: 4, 3 and 2 choices.","4 × 3 × 2 = 24."]},{"id":"n2","goal":3,"prompt":"A 4-digit PIN, digits 0–9, repeats allowed","_a":"AAUCAQI=","why":"10 × 10 × 10 × 10 = 10 000.","wrong":[{"match":5040,"fb":"Repeats are allowed here."}],"hints":["How many choices does each of the 4 digits have?","Repeats are allowed, so 10 each.","10 × 10 × 10 × 10 = 10 000."]},{"id":"n3","goal":3,"prompt":"A 4-digit PIN with no repeated digits","_a":"BAUGAQ==","why":"10 × 9 × 8 × 7 = 5040.","wrong":[{"match":10000,"fb":"No repeats means each later stage has one fewer choice: 10 × 9 × 8 × 7, not 10 × 10 × 10 × 10."}],"hints":["No repeats: each later digit has one fewer choice.","10, then 9, then 8, then 7.","10 × 9 × 8 × 7 = 5040."]},{"id":"n4","goal":2,"factors":true,"prompt":"An Ontario licence plate: 4 letters then 3 digits, repeats allowed (fill in the factors)","_a":"BQAECAUCVlEB","label":"Product of the factors:","placeholder":"e.g. 26 × 26 × …","display":"26 × 26 × 26 × 26 × 10 × 10 × 10 = 456 976 000","why":"Every position keeps all its choices: `26^4 × 10^3`.","wrong":[{"plus":true,"fb":"That adds the positions. Each letter choice goes with every choice for the other positions: multiply 26 for each letter and 10 for each digit."},{"match":134,"fb":"That adds the positions. Each letter choice goes with every choice for the other positions: multiply 26 for each letter and 10 for each digit."}],"hints":["There are 7 positions: 4 letters, then 3 digits.","Each letter has 26 choices and each digit has 10, repeats allowed.","26 × 26 × 26 × 26 × 10 × 10 × 10 = `26^4 × 10^3` = 456 976 000."]},{"id":"n5","goal":2,"prompt":"Answer a true/false quiz with 8 questions","_a":"AwAE","why":"`2^8 = 256`.","wrong":[{"match":16,"fb":"2 × 8 adds 2 eight times; you need `2^8`."}],"hints":["Each question has 2 answers.","8 stages of 2.","`2^8 = 256`."]},{"id":"n6","goal":3,"prompt":"3 friends line up for a photo","_a":"Bw==","why":"3 × 2 × 1 = 6.","wrong":[{"match":9,"fb":"Each friend can be used once: 3 × 2 × 1."}],"hints":["Who stands first? How many are left for the second spot?","3 choices, then 2, then 1.","3 × 2 × 1 = 6."]},{"id":"n7","goal":3,"prompt":"Choose a president, then a vice-president, from 10 students","_a":"CAU=","why":"10 × 9 = 90.","wrong":[{"match":100,"fb":"The president can’t also be vice-president."}],"hints":["How many choices for president?","10, then 9 left.","90."]},{"id":"n8","goal":2,"prompt":"Flip a coin, roll a die, then spin a 4-sector spinner","_a":"BQ0=","why":"2 × 6 × 4 = 48.","wrong":[{"match":12,"fb":"Each coin result goes with each of the 6 die results, and each of those with each of the 4 sectors: 2 × 6 × 4, not 2 + 6 + 4."}],"hints":["Three stages: coin, die, spinner.","2, 6 and 4 outcomes.","2 × 6 × 4 = 48."]}]},{"id":"cases","type":"custom","title":"Restrictions and cases","summary":"Restrictions and cases","star":true,"goal":[3,4,5],"prefix":"S","instruction":"Fill restricted positions first, and split into cases when a count depends on an earlier choice.","how":"Type a whole number, or a product such as 26 × 25 × 24 (powers are fine), then press Check.","items":[{"id":"s1","goal":4,"prompt":"4-digit PINs that start with 9 and end with an even digit (repeats allowed)","_a":"BAUC","why":"1 × 10 × 10 × 5 = 500.","wrong":[{"match":1000,"fb":"The last digit has only 5 even choices: 1 × 10 × 10 × 5."}],"hints":["Which positions are restricted?","First digit: 1 choice (9). Last digit: 5 even choices. The middle two: 10 each.","1 × 10 × 10 × 5 = 500."]},{"id":"s2","goal":3,"prompt":"3-letter codes from A, B, C, D, E with no repeats","_a":"BwU=","why":"5 × 4 × 3 = 60.","wrong":[{"match":125,"fb":"No repeats means each later stage has one fewer choice: 5 × 4 × 3, not 5 × 5 × 5."}],"hints":["No repeats: one fewer letter each time.","5, then 4, then 3.","5 × 4 × 3 = 60."]},{"id":"s3","goal":5,"star":true,"prompt":"Of the codes in S2, how many contain the letter A?","_a":"AgM=","why":"60 − 4 × 3 × 2 = 60 − 24 = 36.","wrong":[{"match":12,"fb":"Count all codes, then subtract those without A: 60 − 4 × 3 × 2."}],"hints":["It’s easier to count the codes \u003cstrong>without\u003c/strong> A.","Without A there are 4 letters: 4 × 3 × 2 = 24 codes.","60 − 24 = 36."]},{"id":"s4","goal":4,"star":true,"prompt":"Even three-digit numbers with no repeated digits","_a":"AgcK","why":"Units 0: 9 × 8 = 72. Units 2, 4, 6 or 8: 4 × 8 × 8 = 256. 72 + 256 = 328.","wrong":[{"match":360,"fb":"Split by the units digit: if it’s 0, the hundreds has 9 choices; if it’s 2, 4, 6 or 8, the hundreds has 8 (not 0, not the units digit). 72 + 256."}],"hints":["The units digit must be even, and 0 behaves differently.","Case 1: units 0: 9 × 8. Case 2: units 2, 4, 6 or 8: 4 choices, then hundreds 8, tens 8.","72 + 256 = 328."]},{"id":"s5","goal":5,"star":true,"prompt":"How many positive divisors does `360 = 2^3 × 3^2 × 5` have?","_a":"AwE=","why":"4 × 3 × 2 = 24.","wrong":[{"match":6,"fb":"Each prime can appear 0 times too: 4 × 3 × 2."}],"hints":["Every divisor is `2^a × 3^b × 5^c`.","`a` can be 0–3, `b` 0–2, `c` 0–1.","4 × 3 × 2 = 24."]},{"id":"s6","goal":[3,4],"star":true,"prompt":"Plates with 3 letters (no repeats) then 3 digits (repeats allowed, first digit not 0)","_a":"AAECBQIEVlE=","why":"26 × 25 × 24 × 9 × 10 × 10 = 14 040 000.","wrong":[{"match":15600000,"fb":"The first digit has 9 choices, not 10: 26 × 25 × 24 × 9 × 10 × 10."}],"hints":["Fill the restricted position first.","Letters: 26 × 25 × 24. Digits: the first can’t be 0 (9 choices), then 10 and 10.","26 × 25 × 24 × 9 × 10 × 10 = 14 040 000."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Beau","how":"","goal":[4,5],"instruction":"Beau made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"How many three-digit numbers have no repeated digits?","steps":["There are 3 positions to fill.","The first digit can be any of the 10 digits.","Then 9 choices for the second and 8 for the third.","10 × 9 × 8 = 720."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 follows step 2. Look earlier.","The arithmetic is right; the counts aren’t."],"fixes":[{"t":"Use 9 × 8 × 7 = 504.","why":"That bans 0 everywhere; 0 is fine in the tens and units.","_n":"1k53f","_k":"673f8d3b"},{"t":"The first digit can’t be 0: 9 choices. Then 9 (0 is now allowed) and 8: 9 × 9 × 8 = 648.","why":"A three-digit number can’t start with 0, but 0 is fine in the tens and units.","_n":"1l5cf","_k":"144cff43"},{"t":"Use 10 × 10 × 10.","why":"No repeats means each later stage has one fewer choice: 10 × 9 × 8, not 10 × 10 × 10.","_n":"1m5df","_k":"d657b972"},{"t":"Step 2 is correct.","why":"A number can’t start with 0.","_n":"1ne6f","_k":"af3036d7"}],"hints":["Can a three-digit number start with 0?","No: 9 choices first.","9 × 9 × 8 = 648."]},{"id":"e2","goal":5,"task":"Lunch is a soup (3 kinds) or a sandwich (5 kinds), plus a drink (4 kinds). How many lunches?","steps":["A lunch has two parts: a main, then a drink.","Mains: soup or sandwich, so 3 × 5 = 15.","With a drink: 15 × 4 = 60."],"_a":"AA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. Look earlier."],"fixes":[{"t":"Step 2 is correct.","why":"“Or” means you choose one, not both.","_n":"1oe5f","_k":"9894dc91"},{"t":"The main is one item from 3 + 5 = 8, so 8 × 4 = 32.","why":"Soup or sandwich means one of 3 + 5 = 8 mains; then each main goes with each of the 4 drinks.","_n":"1pe8f","_k":"0b9a02c0"},{"t":"3 + 5 + 4 = 12.","why":"Each of the 8 mains goes with each of the 4 drinks: 8 groups of 4, so 8 × 4.","_n":"1qe7f","_k":"ab3f8531"},{"t":"3 × 5 × 4 is right.","why":"“Or” means one of 3 + 5 = 8 choices. You only multiply stages you do one after another.","_n":"1re2f","_k":"1049be8f"}],"hints":["Does a lunch have both a soup and a sandwich?","No: one main from 8.","8 × 4 = 32."]},{"id":"e3","goal":4,"task":"How many odd three-digit numbers have no repeated digits?","steps":["Hundreds digit: 9 choices (1–9).","Tens digit: 9 choices (anything but the hundreds digit).","Units digit: 5 choices (1, 3, 5, 7, 9).","9 × 9 × 5 = 405."],"_a":"Aw==","stepFb":["True on its own. Keep checking.","True on its own.","","Step 4 follows. Look earlier."],"fixes":[{"t":"Divide 648 by 2.","why":"Odd and even numbers aren’t split evenly when 0 is involved.","_n":"1se1f","_k":"9ec1df41"},{"t":"Step 3 is correct.","why":"Some odd digits may already be used. If the hundreds digit used up an odd digit, the units has fewer odd digits left. Fill the units first.","_n":"1te4f","_k":"95a7ffe3"},{"t":"Fill the units first: 5 odd choices. Then hundreds: 8 (not 0, not the units digit). Then tens: 8. Total 5 × 8 × 8 = 320.","why":"The units digit has the strongest restriction, so it goes first; then every later count is the same whatever was chosen before.","_n":"1ue3f","_k":"621ffb0e"},{"t":"Units: 4 choices.","why":"Sometimes 5 odd digits are left, sometimes fewer; that’s why it must go first.","_n":"1vdef","_k":"8f98f1df"}],"hints":["Could the hundreds or tens digit already be odd?","Yes, so the units count isn’t fixed.","Units first: 5 × 8 × 8 = 320."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: how fast the totals grow, or how much the fill order mattered?"},{"id":"j2","q":"In your own words, why can you multiply to count the leaves of a tree?"},{"id":"j3","q":"Explain to a friend how you decide between multiplying and adding."},{"id":"j4","q":"Which kind of restriction still trips you up? What will you check first next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"A restaurant offers 4 appetizers, 6 mains and 3 desserts. How many three-course meals (one of each)?","options":[{"t":"13","why":"Adding counts choices, not meals.","_n":"1wddf","_k":"353b7877"},{"t":"24","why":"That leaves out the desserts.","_n":"1xe0f","_k":"3ca961a3"},{"t":"72","why":"4 × 6 × 3.","_n":"1ye1f","_k":"6e375dac"},{"t":"216","why":"6³ uses 6 for every course.","_n":"1zdef","_k":"b3e0f643"}]},"b":{"prompt":"A restaurant offers 5 appetizers, 4 mains and 3 desserts. How many three-course meals?","options":[{"t":"12","why":"Adding counts choices, not meals.","_n":"20dff","_k":"3d81f7df"},{"t":"20","why":"That leaves out the desserts.","_n":"21e4f","_k":"ada6ce3b"},{"t":"60","why":"5 × 4 × 3.","_n":"22e5f","_k":"ca68741e"},{"t":"125","why":"5³ uses 5 for every course.","_n":"23e2f","_k":"1053b283"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which expression counts 3-letter codes from the 26 letters if letters \u003cstrong>may\u003c/strong> repeat?","options":[{"t":"26 × 25 × 24","why":"That’s for no repeats.","_n":"24e3f","_k":"e512931d"},{"t":"26 × 26 × 26","why":"Every position has all 26 letters.","_n":"25d8f","_k":"14554d8b"},{"t":"26 + 26 + 26","why":"Each of the 26 first letters goes with each of the 26 second letters, and so on: multiply, don’t add.","_n":"26d9f","_k":"da4489ba"},{"t":"`3^{26}`","why":"The base is the number of choices, 26.","_n":"27d2d","_k":"40f9af86"}]},"b":{"prompt":"Which expression counts 3-letter codes if letters may \u003cstrong>not\u003c/strong> repeat?","options":[{"t":"26 × 25 × 24","why":"One fewer letter each time.","_n":"28d1d","_k":"3784a185"},{"t":"26 × 26 × 26","why":"No repeats means each later stage has one fewer choice: 26 × 25 × 24, not 26 × 26 × 26.","_n":"29d0d","_k":"660b85c2"},{"t":"3 × 26","why":"That’s 26 + 26 + 26.","_n":"2acfd","_k":"4ff48bc5"},{"t":"26 + 25 + 24","why":"Each choice for the first letter goes with every choice for the next: multiply, don’t add.","_n":"2bd6d","_k":"d25c9777"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"A student chooses one book: one of 6 novels or one of 4 biographies. How many choices?","options":[{"t":"2","why":"There are 2 kinds, but 10 books.","_n":"2cd5d","_k":"895e92fd"},{"t":"6","why":"That ignores the biographies.","_n":"2dd4d","_k":"6a3cea03"},{"t":"10","why":"One book from 6 + 4.","_n":"2ed3d","_k":"77d0f742"},{"t":"24","why":"That would be a novel \u003cstrong>and\u003c/strong> a biography.","_n":"2fdad","_k":"5f119bd4"}]},"b":{"prompt":"A student picks one elective: one of 3 arts courses or one of 5 technology courses. How many choices?","options":[{"t":"2","why":"2 kinds, 8 courses.","_n":"2gd9d","_k":"7e27bd55"},{"t":"5","why":"That ignores the arts courses.","_n":"2hccd","_k":"76c25199"},{"t":"8","why":"3 + 5.","_n":"2icdd","_k":"08e2f62c"},{"t":"15","why":"“Or” means one of 3 + 5 = 8 choices. You only multiply stages you do one after another.","_n":"2jced","_k":"ea118839"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"How many four-digit numbers have no repeated digits?","options":[{"t":"9 × 8 × 7 × 6 = 3024","why":"That bans 0 from every position.","_n":"2kcfd","_k":"97d222b3"},{"t":"9 × 9 × 8 × 7 = 4536","why":"First digit 1–9; then 9, 8, 7 (0 is allowed later).","_n":"2ld0d","_k":"ce2c80bc"},{"t":"10 × 9 × 8 × 7 = 5040","why":"That allows a leading 0.","_n":"2md1d","_k":"0c31560f"},{"t":"9 × 10 × 10 × 10 = 9000","why":"That allows repeats.","_n":"2nd2d","_k":"49aac61f"}]},"b":{"prompt":"How many three-digit numbers have no repeated digits?","options":[{"t":"9 × 8 × 7 = 504","why":"That bans 0 from every position.","_n":"2od3d","_k":"91fa87a7"},{"t":"9 × 9 × 8 = 648","why":"First digit 1–9; then 9 (0 is allowed now) and 8.","_n":"2pd4d","_k":"d66cf924"},{"t":"9 × 10 × 10 = 900","why":"That allows repeats.","_n":"2qd5d","_k":"f718fe87"},{"t":"10 × 9 × 8 = 720","why":"That allows a leading 0. A three-digit number can’t start with 0: 9 choices for the first digit.","_n":"2r4e6","_k":"e88697c2"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"How many \u003cstrong>even\u003c/strong> three-digit numbers can be made from the digits 1, 2, 3, 4, 5 with no repeats?","options":[{"t":"24","why":"Units first: 2 (2 or 4); then hundreds 4, tens 3: 2 × 4 × 3.","_n":"2s4f6","_k":"d189ca2b"},{"t":"32","why":"The tens digit can’t reuse the hundreds digit: 3 choices, not 4.","_n":"2t506","_k":"8e31ca02"},{"t":"50","why":"That allows repeats: 5 × 5 × 2.","_n":"2u516","_k":"d9bde426"},{"t":"60","why":"That ignores “even”: 5 × 4 × 3.","_n":"2v526","_k":"3f5a5d1e"}]},"b":{"prompt":"How many \u003cstrong>odd\u003c/strong> three-digit numbers can be made from 1, 2, 3, 4, 5 with no repeats?","options":[{"t":"36","why":"Units: 3 (1, 3, 5); hundreds 4; tens 3.","_n":"2w536","_k":"083bdf8d"},{"t":"48","why":"The tens digit has 3 choices left, not 4.","_n":"2x546","_k":"1ab5338a"},{"t":"60","why":"That ignores “odd”.","_n":"2y556","_k":"f73fa066"},{"t":"75","why":"That allows repeats: 5 × 5 × 3.","_n":"2z466","_k":"0e47c4e5"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"How many positive divisors does `72 = 2^3 × 3^2` have?","options":[{"t":"5","why":"Adding the exponents doesn’t count divisors.","_n":"30476","_k":"a359e785"},{"t":"6","why":"That forgets that each prime may appear 0 times: 3 × 2.","_n":"31d46","_k":"7aae535f"},{"t":"7","why":"4 + 3 adds the choices.","_n":"32d36","_k":"e185cdcb"},{"t":"12","why":"A divisor is `2^a × 3^b` with `a` = 0–3 and `b` = 0–2: 4 × 3.","_n":"33d26","_k":"06e3ed08"}]},"b":{"prompt":"How many positive divisors does `180 = 2^2 × 3^2 × 5` have?","options":[{"t":"4","why":"That forgets the 0 exponent: 2 × 2 × 1.","_n":"34d16","_k":"69ee9417"},{"t":"5","why":"Adding the exponents doesn’t count divisors.","_n":"35d86","_k":"af18eb47"},{"t":"8","why":"3 + 3 + 2 adds the choices.","_n":"36d76","_k":"d070c2cb"},{"t":"18","why":"3 × 3 × 2.","_n":"37d66","_k":"05c592f8"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why “a soup (3) or a sandwich (5), and a drink (4)” gives 32 lunches, not 60?","options":[{"t":"It is 60: 3 × 5 × 4.","why":"“Or” means one of 3 + 5 = 8 choices. You only multiply stages you do one after another.","_n":"38d56","_k":"207067bf"},{"t":"The main is one item chosen from 3 + 5 = 8, so there are 8 × 4 = 32 lunches. Multiplying 3 × 5 would mean having both a soup and a sandwich.","why":"It explains both parts: the main is one choice from 8, and only the drink stage multiplies.","_n":"39cc6","_k":"935082f2"},{"t":"Because 60 is too many for a café.","why":"Size isn’t the reason.","_n":"3acb6","_k":"be210830"},{"t":"Because you should always add when there are three menus.","why":"Each of the 8 mains goes with each of the 4 drinks: 8 groups of 4, so 8 × 4. Adding every menu never counts lunches.","_n":"3bda6","_k":"fd1cc899"}]},"b":{"prompt":"Which best explains why “pasta (2) or pizza (6), and a dessert (3)” gives 24 meals, not 36?","options":[{"t":"Because pizza has more toppings.","why":"That isn’t the reason.","_n":"3cdb6","_k":"b39bec3b"},{"t":"Always add every menu: 2 + 6 + 3 = 11.","why":"Each of the 8 mains goes with each of the 3 desserts: 8 groups of 3, so 8 × 3.","_n":"3dd86","_k":"4ef5b802"},{"t":"It is 36: 2 × 6 × 3.","why":"“Or” means one of 2 + 6 = 8 choices. You only multiply stages you do one after another.","_n":"3ed96","_k":"509cc66a"},{"t":"The main is one of 2 + 6 = 8 dishes, so 8 × 3 = 24. 2 × 6 would mean ordering both.","why":"The main is one choice from 8; then the dessert stage multiplies.","_n":"3fd66","_k":"515ea841"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which best explains why flipping a coin 4 times has 2⁴ outcomes, not 4²?","options":[{"t":"Because 4² and 2⁴ are both 16, it doesn’t matter.","why":"They happen to match here, but 5 flips give 2⁵ = 32, not 5² = 25.","_n":"3gd76","_k":"31c29dae"},{"t":"Each of the 4 flips has 2 outcomes, so the tree doubles 4 times: 2 × 2 × 2 × 2.","why":"The base is the 2 outcomes of one flip; the exponent is the 4 flips. The tree doubles once per flip.","_n":"3hd46","_k":"d54c6ab5"},{"t":"Because there are 4 coins and 2 sides, so 4 × 4.","why":"Each of the 4 flips has 2 outcomes: 2 × 2 × 2 × 2 = 2⁴.","_n":"3id56","_k":"abfcd9fa"},{"t":"Because 2 + 2 + 2 + 2 = 8 outcomes.","why":"Each flip doubles the number of outcomes, so multiply: 2 × 2 × 2 × 2 = 16, not 8.","_n":"3jd26","_k":"668694e6"}]},"b":{"prompt":"Which best explains why a tree for 3 shirts and 4 pants has 12 leaves?","options":[{"t":"Because 4³ = 12.","why":"4³ = 64.","_n":"3kd36","_k":"9c0642b6"},{"t":"Each of the 3 shirt branches splits into the same 4 pant branches: 3 groups of 4.","why":"Every branch splits the same way, so the leaves come in equal groups: 3 × 4 = 12.","_n":"3lc06","_k":"4a73d7e8"},{"t":"Because 3 + 4 = 7 outfits, plus 5 combinations.","why":"Each of the 3 shirts goes with each of the 4 pants: 3 groups of 4, so 3 × 4.","_n":"3mbf6","_k":"fa45fa57"},{"t":"Because 3 + 4 + 5 = 12.","why":"There’s no 5 in the problem.","_n":"3nc26","_k":"1923f70f"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"An Ontario licence plate has 4 letters followed by 3 digits, with repeats allowed. How many plates are possible?","options":[{"t":"26 × 4 + 10 × 3","why":"That adds. Each letter choice goes with every choice for the other positions: multiply 26 four times and 10 three times.","_n":"3oc16","_k":"5e02192d"},{"t":"`4^{26} × 3^{10}`","why":"The base is the number of choices (26 or 10) and the exponent is the number of positions: `26^4 × 10^3`.","_n":"3pc46","_k":"9a3ad513"},{"t":"26 × 25 × 24 × 23 × 10 × 9 × 8","why":"Repeats are allowed.","_n":"3qc36","_k":"514c72fd"},{"t":"`26^4 × 10^3`","why":"26 × 26 × 26 × 26 × 10 × 10 × 10.","_n":"3rc66","_k":"d96ad3ec"}]},"b":{"prompt":"A plate has 3 letters followed by 3 digits, repeats allowed. How many plates?","options":[{"t":"`3^{26} × 3^{10}`","why":"The base is the number of choices and the exponent is the number of positions: `26^3 × 10^3`.","_n":"3sc56","_k":"6076dbdd"},{"t":"`26^3 × 10^3`","why":"26 × 26 × 26 × 10 × 10 × 10: every position keeps all its choices.","_n":"3tc86","_k":"01efae68"},{"t":"26 × 25 × 24 × 10 × 9 × 8","why":"Repeats are allowed, so every position keeps all its choices.","_n":"3uc76","_k":"525c7a5d"},{"t":"26 × 3 + 10 × 3","why":"That adds. Multiply the choices for each position: 26 for each letter and 10 for each digit.","_n":"3v466","_k":"a72c120e"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"A club of 12 chooses a president, a vice-president and a treasurer (one role each). Ana must be president. How many ways?","options":[{"t":"21","why":"11 + 10 adds.","_n":"3w476","_k":"0b688a2e"},{"t":"110","why":"1 × 11 × 10.","_n":"3x486","_k":"0db12639"},{"t":"121","why":"The same person can’t be vice-president and treasurer.","_n":"3y496","_k":"11317dae"},{"t":"1320","why":"That ignores the condition on Ana: 12 × 11 × 10.","_n":"3z426","_k":"30ada5c6"}]},"b":{"prompt":"A team of 9 chooses a captain, an assistant and a manager (one role each). Ben must be captain. How many ways?","options":[{"t":"15","why":"8 + 7 adds.","_n":"40436","_k":"15cc7f90"},{"t":"56","why":"1 × 8 × 7.","_n":"41446","_k":"f3d046c9"},{"t":"64","why":"The same person can’t be assistant and manager: 8 × 7, not 8 × 8.","_n":"42456","_k":"d857d17c"},{"t":"504","why":"That ignores the condition on Ben: 9 × 8 × 7.","_n":"434e6","_k":"517dfdc9"}]}}]},"task":{"title":"Code system","summary":"Code system","statement":"\u003cp>Design a login-code system for a school library. Letters never repeat in a code. Choose how many letter and digit positions, and whether digits may repeat, so that every condition holds. Can you find all the answers?\u003c/p>\u003col class=\"cs-conds\">\u003cli>Each code has at least one letter and at least one digit.\u003c/li>\u003cli>A code is at most 5 characters long.\u003c/li>\u003cli>There are at least 100 000 possible codes.\u003c/li>\u003cli>There are fewer than 1 000 000 possible codes.\u003c/li>\u003c/ol>","checks":["Letters and digits","At most 5 characters","At least 100 000 codes","Fewer than 1 000 000 codes"],"tips":["Add at least one of each kind.","Count the characters.","Too few codes: add a position, or allow digit repeats.","Too many: drop a letter, or switch digit repeats off."],"explainPrompt":"Explain how you used the counting principle to land between 100 000 and 1 000 000 codes.","vocab":"Use the words stage, choices, repetition and product.","more":"There’s more than one answer. Can you find them all?","afterAll":"Each letter multiplies the count by about 25 and each digit by up to 10. That’s why 3 letters + 2 digits (1 560 000) already overshoots."},"cards":[["Fundamental counting principle","Stages with `m`, `n`, … choices: `m × n` × … ways in total."],["Why it works","A tree where every branch splits the same way: groups of equal size."],["Repeats allowed","Every stage keeps all its choices: 10 × 10 × 10."],["No repeats","One fewer each time: 10 × 9 × 8."],["Leading digit","A number can’t start with 0: 9 choices first."],["Restricted position","Fill it first so later counts don’t depend on luck."],["“And then”","Multiply."],["“Or” (one or the other)","Add the cases: 3 soups or 5 sandwiches = 8 choices."],["`k` stages of `n` choices","`n^k` (e.g. 4 coin flips: `2^4 = 16`)."],["Splitting into cases","When counts depend on a choice (units digit 0 or not), count each case and add."],["Why not list?","456 976 000 Ontario plates: the product takes seconds; a list never ends."]]}};</script>
