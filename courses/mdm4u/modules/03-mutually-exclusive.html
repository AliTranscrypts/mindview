.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 03: hero, Overlap detector (D2 Venn, deck grid, survey counts), Part 3 stations, task */
/* radioGroup (from MDM4U 02) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* @component D2 vennDiagram styles (copy with the component) */
.vd{margin:4px 0 0}
.vd-names{display:flex;flex-wrap:wrap;gap:2px 18px;margin:0 0 6px;font-size:.95rem;min-height:1.4em}
.vd-box{position:relative;width:100%;touch-action:manipulation;cursor:pointer}
.vd-svg{position:absolute;left:0;top:0;display:block}
.vd-u{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.vd-f.vd-a{fill:var(--ev-a-soft)}.vd-f.vd-b{fill:var(--ev-b-soft)}.vd-f.vd-c{fill:var(--ev-c-soft)}
.vd-o{fill:none;stroke-width:2.5}.vd-o.vd-a{stroke:var(--ev-a)}.vd-o.vd-b{stroke:var(--ev-b)}.vd-o.vd-c{stroke:var(--ev-c)}
.vd-reg{display:none}.vd-reg.on{display:inline}
.vd-sh{fill:var(--hi-soft)}
.vd-hl{stroke:var(--hi);stroke-width:2.5;opacity:.75}
.vd-glow{display:none;fill:none;stroke:var(--hi);stroke-width:5;stroke-linejoin:round}
.vd.glow .vd-glow{display:inline;animation:vdPulse 1.3s ease-in-out 3}
@keyframes vdPulse{50%{stroke-opacity:.15}}
.vd-l{font:italic 700 20px var(--font-math)}.vd-l.vd-a{fill:var(--ev-a)}.vd-l.vd-b{fill:var(--ev-b)}.vd-l.vd-c{fill:var(--ev-c)}
.vd-s{font:italic 400 18px var(--font-math);fill:var(--ink-2)}
.vd-vals,.vd-toks{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
.vd-v{position:absolute;transform:translate(-50%,-50%);font:400 1.5rem var(--font-math);color:var(--ink);white-space:nowrap}
.vd-t{position:absolute;left:0;top:0;pointer-events:auto;display:grid;place-items:center;padding:0;border:1.5px solid var(--ink-2);border-radius:5px;background:var(--sheet);color:var(--ink);font-family:var(--font-ui);font-weight:700;line-height:1;white-space:nowrap;overflow:hidden}
.vd-t:hover{border-color:var(--ink)}
.vd-t.lit{background:var(--hi);border-color:var(--sel-bd);color:var(--hi-ink)}
.vd-strip{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.vd-rb{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:.25em .7em;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font-size:.88rem}
.vd-rb:hover{border-color:var(--ink-2)}
.vd-rb[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd);font-weight:700}
.vd-sws{display:inline-flex;gap:2px}
.vd-rn{font-family:var(--font-math);font-size:1rem;color:var(--ink-2)}
.vd-rb[aria-pressed="true"] .vd-rn{color:var(--ink)}
.vd-sw0{background:var(--sheet)}
.vd-note{margin:6px 0 0;font-size:.95rem;min-height:1.4em}

/* Overlap detector */
.me-pg .pg-graph{min-width:0}
.me-evs{display:flex;flex-wrap:wrap;gap:10px 18px;margin:4px 0 10px}
.me-ev{display:grid;gap:4px;font-size:.88rem;font-weight:700;color:var(--ink-2);min-width:0}
.me-ev select{min-height:40px;max-width:100%;padding:.3em .5em;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:400 1rem var(--font-ui)}
.me-ev-a select{border-color:var(--ev-a)}.me-ev-b select{border-color:var(--ev-b)}
.me-sv{margin:4px 0 10px}
.me-svp{font-size:.95rem;margin:0 0 8px}
.me-nums{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.me-nums label{display:grid;gap:4px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.me-nums input{width:5.6rem;min-height:40px;padding:.35em .55em;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:400 1.15rem var(--font-math)}
.me-nums input:focus{border-color:var(--ink)}
.me-giv{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-end}
.me-giv .rg-wrap{margin:0}
.me-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:12px 0 6px}
.me-tok{min-height:1.4em;margin:6px 0 0;font-size:.95rem}
.me-y{color:var(--green);font-weight:700}.me-n{color:var(--red);font-weight:700}
#me-form,#me-svr{margin-bottom:8px}
#me-form .q-actions{margin-top:0}
.me-tc2{margin:10px 0 0}
.me-tc2 input[type="text"]{font:400 1.25rem var(--font-math)}

/* deck grid: suits as rows, ranks as columns; on phones ranks as rows, suits as columns */
.me-deck{margin-top:6px}
.dk{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:3px}
.dk-c{grid-row:var(--r1);grid-column:var(--c1);position:relative;min-width:0;padding:6px 1px 12px;border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);font:700 .78rem/1 var(--font-ui);text-align:center;white-space:nowrap}
.dk-a{background:var(--ev-a-soft);border-color:var(--ev-a)}
.dk-b{background:var(--ev-b-soft);border-color:var(--ev-b)}
.dk-ab{background:linear-gradient(135deg,var(--ev-a-soft) 50%,var(--ev-b-soft) 50%);border:2px solid var(--ink)}
.dk-c.lit{background:var(--hi);color:var(--hi-ink);border-color:var(--sel-bd)}
.dk-m{position:absolute;left:0;right:0;bottom:2px;font-size:.55rem;letter-spacing:.04em;color:var(--ink-2)}
.dk-c.lit .dk-m{color:var(--hi-ink)}
@media (max-width:560px){
  .dk{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dk-c{grid-row:var(--r2);grid-column:var(--c2);font-size:.92rem;padding:6px 2px 13px}
}

/* hero */
.me-h{width:100%;max-width:440px;margin:0 auto}
.me-hsvg{display:block;width:100%;height:auto;overflow:hidden}
.me-hcount{margin:2px 0 0;min-height:1.35em;text-align:center;font:400 1.7rem var(--font-math);color:var(--ink)}
.h-m3{background:var(--hi-soft);border-radius:4px;padding:0 .15em}
.h-fa{fill:var(--ev-a-soft)}.h-fb{fill:var(--ev-b-soft)}
.h-oa{fill:none;stroke:var(--ev-a);stroke-width:2.5}.h-ob{fill:none;stroke:var(--ev-b);stroke-width:2.5}
.h-la{fill:var(--ev-a);font:700 13px var(--font-ui)}.h-lb{fill:var(--ev-b);font:700 13px var(--font-ui)}
.h-lens{fill:none;stroke:none}
.me-hsvg.p2 .h-lens{fill:var(--hi-soft);stroke:var(--hi);stroke-width:4;animation:hGlow 1s ease-in-out 3}
@keyframes hGlow{50%{stroke-opacity:.2}}
.h-card rect{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.h-card text{fill:var(--ink);font:700 9.5px var(--font-ui)}
.h-strike{stroke:var(--ink);stroke-width:2;opacity:0}
.me-hsvg.p3 .h-dup{opacity:.45}
.me-hsvg.p3 .h-dup .h-strike{opacity:1}
.h-x2{opacity:0}
.me-hsvg.p2 .h-x2{opacity:1}
.h-x2 rect{fill:var(--hi);stroke:var(--sel-bd);stroke-width:1}
.h-x2 text{fill:var(--hi-ink);font:700 11px var(--font-ui)}
.h-twice{opacity:0;fill:var(--ink);font:700 12px var(--font-ui)}
.me-hsvg.p2 .h-twice{opacity:1;animation:hBlink .9s steps(2,start) 4}
@keyframes hBlink{50%{opacity:.15}}

/* Part 3 stations */
.or-st{margin:0 0 6px}
.or-station h3{margin-top:6px}
.or-grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 10px}
.or-gl{min-width:5.5em;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.or-stu{min-width:44px;min-height:44px;border:2px solid var(--ink);border-radius:50%;background:var(--sheet);color:var(--ink);font:700 1.05rem var(--font-ui)}
.or-stu[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--sel-bd)}
.or-s2n input{width:6.5rem}
.or-leg{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;font-weight:400}
.or-ka,.or-kb,.or-kab{display:inline-block;position:relative;width:16px;height:16px;border:1.5px solid var(--rule);border-radius:3px;vertical-align:-.2em;overflow:hidden}
.or-ka{background:var(--ev-a-soft)}.or-kb{background:var(--ev-b-soft)}
.or-kab{background:linear-gradient(135deg,var(--ev-a-soft) 50%,var(--ev-b-soft) 50%);border:2px solid var(--sel-bd)}
.or-ka::before,.or-kab::before{content:"";position:absolute;left:0;top:0;border-top:7px solid var(--ev-a);border-right:7px solid transparent}
.or-kb::after,.or-kab::after{content:"";position:absolute;right:0;bottom:0;border-bottom:7px solid var(--ev-b);border-left:7px solid transparent}
.hc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;max-width:440px}
.hc span{position:relative;display:grid;place-items:center;min-height:30px;border:1.5px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink);font:400 .92rem var(--font-math);overflow:hidden}
.hc span.hc-a{background:var(--ev-a-soft)}
.hc span.hc-b{background:var(--ev-b-soft)}
.hc span.hc-ab{background:linear-gradient(135deg,var(--ev-a-soft) 50%,var(--ev-b-soft) 50%);border:2.5px solid var(--sel-bd);font-weight:700}
.hc span.hc-a::before{content:"";position:absolute;left:0;top:0;border-top:8px solid var(--ev-a);border-right:8px solid transparent}
.hc span.hc-b::after{content:"";position:absolute;right:0;bottom:0;border-bottom:8px solid var(--ev-b);border-left:8px solid transparent}
#or-shA[aria-pressed="true"],#or-shB[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd)}

/* task */
.me-conds{margin:8px 0 12px;padding-left:1.4em}
.tk-in{margin:6px 0 12px}
.tk-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.tk-lab{flex:1 0 100%;font-weight:700}
.tk-out{display:inline-grid;place-items:center;min-width:2.6em;min-height:40px;border:2px solid var(--ink);border-radius:8px;font:700 1.25rem var(--font-math)}
.tk-b{min-width:44px;min-height:40px;font-size:1.25rem!important;font-weight:700}
.tk-board{max-width:420px;margin-bottom:10px}

</style>
</head>
<body>

ns, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"One card is drawn. Find `P`(heart or king).","steps":["`P`(heart) = 13/52.","`P`(king) = 4/52.","`P`(heart or king) = 13/52 + 4/52 = 17/52.","So the probability is about 0.33."],"_a":"Vg==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows step 3. Look earlier."],"fixes":[{"t":"Multiply: 13/52 × 4/52.","why":"Nothing is multiplied for “or”: add the two events, then subtract the card that is in both once.","_n":"1kdda","_k":"e3c6deae"},{"t":"The king of hearts is counted twice: 13/52 + 4/52 − 1/52 = 16/52 = 4/13.","why":"The king of hearts is in both events. Adding counts it twice, so subtract it once.","_n":"1lcea","_k":"587bd12e"},{"t":"Step 3 is correct.","why":"One card is both a heart and a king.","_n":"1mcfa","_k":"450d5b97"},{"t":"Use only 1/52, the king of hearts.","why":"“Or” includes everything in `A`, everything in `B`, and the overlap, not just the overlap.","_n":"1n48b","_k":"f9effbee"}],"hints":["Is any card both a heart and a king?","K♥.","16/52 = 4/13."]},{"id":"e2","goal":6,"task":"50 people: 30 like hockey, 25 like soccer, 10 like both. How many like neither?","steps":["People who like at least one: 30 + 25 = 55.","55 is more than 50, so the survey must be wrong."],"_a":"VA==","stepFb":["","Step 2 follows step 1. Look earlier."],"fixes":[{"t":"50 − 10 = 40 like neither.","why":"10 is the overlap, not the union.","_n":"1o47b","_k":"ae926378"},{"t":"30 + 25 − 10 = 45 like at least one, so 50 − 45 = 5 like neither.","why":"The 10 who like both were counted twice, so subtract them once: 45 in the union, 5 neither.","_n":"1p4ab","_k":"c2538472"},{"t":"Step 1 is correct.","why":"The 10 who like both were counted twice.","_n":"1q49b","_k":"4cfc9608"},{"t":"0 like neither.","why":"Some people are in neither group: the union is the total minus “neither”.","_n":"1r4cb","_k":"7c3a9cad"}],"hints":["Who did 30 + 25 count twice?","The 10 who like both.","45 in the union; 5 neither."]},{"id":"e3","goal":2,"task":"`A` and `B` are mutually exclusive, `P(A) = 0.3`, `P(B) = 0.5`. Find `P(A or B)`.","steps":["Mutually exclusive means `A` and `B` can’t happen together.","So `P(A or B)` = 0.3 + 0.5 − 0.3 × 0.5.","= 0.8 − 0.15 = 0.65."],"_a":"VQ==","stepFb":["Step 1 is correct.","","The arithmetic follows step 2."],"fixes":[{"t":"Use 0.3 × 0.5 = 0.15.","why":"Mutually exclusive means they can’t happen together: `P(A and B) = 0`. Nothing is multiplied.","_n":"1s4bb","_k":"c05997c5"},{"t":"Step 2 is correct.","why":"0.3 × 0.5 is the overlap only for independent events; here the overlap is 0.","_n":"1t4eb","_k":"2b9e97a5"},{"t":"Use 0.5 − 0.3 = 0.2.","why":"Subtracting events isn’t “or”.","_n":"1u4db","_k":"c5b05c45"},{"t":"The overlap is 0, so `P(A or B)` = 0.3 + 0.5 = 0.8.","why":"Mutually exclusive means they can’t happen together: `P(A and B) = 0`. Nothing is multiplied.","_n":"1v50b","_k":"b08838e6"}],"hints":["What is `P(A and B)` for mutually exclusive events?","0.","0.3 + 0.5 = 0.8."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which overlap surprised you most in Explore: the heart face cards, the multiples of 10, or the two large primes?"},{"id":"j2","q":"In your own words, why do we subtract the overlap only once?"},{"id":"j3","q":"Explain to a friend how to tell whether two events are mutually exclusive."},{"id":"j4","q":"Which kind of “or” problem still feels risky? What will you draw before you calculate?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"One card is drawn. Which pair of events is mutually exclusive?","options":[{"t":"Drawing a king and drawing a heart","why":"The king of hearts is both.","_n":"1w4fb","_k":"3080d3b5"},{"t":"Drawing an ace and drawing a spade","why":"The ace of spades.","_n":"1x62b","_k":"8148345c"},{"t":"Drawing a club and drawing a red card","why":"Clubs are black.","_n":"1y63b","_k":"8e607953"},{"t":"Drawing a face card and drawing a black card","why":"Black face cards exist.","_n":"1z60b","_k":"f21d01fc"}]},"b":{"prompt":"One die is rolled. Which pair of events is mutually exclusive?","options":[{"t":"Rolling a number less than 3 and rolling a 2","why":"2 is both.","_n":"2061b","_k":"49d070de"},{"t":"Rolling an even number and rolling a number greater than 4","why":"6 is both.","_n":"215eb","_k":"9bdad95e"},{"t":"Rolling a 1 and rolling an even number","why":"1 is odd, so no roll is both.","_n":"225fb","_k":"3fc07d29"},{"t":"Rolling an odd number and rolling a prime","why":"3 and 5 are both.","_n":"235cb","_k":"a1319dde"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A bag holds 4 blue, 3 yellow and 5 purple marbles. One is drawn. What is `P`(blue or yellow)?","options":[{"t":"0","why":"That’s `P`(blue \u003cstrong>and\u003c/strong> yellow).","_n":"245db","_k":"de152156"},{"t":"1/12","why":"4/12 × 3/12 multiplies, but “or” adds.","_n":"255ab","_k":"5d2c25c6"},{"t":"5/12","why":"That’s purple, the complement.","_n":"265bb","_k":"e0590c8e"},{"t":"7/12","why":"Mutually exclusive: 4/12 + 3/12.","_n":"2764a","_k":"2045c0b6"}]},"b":{"prompt":"A bag holds 4 blue, 2 yellow and 3 purple marbles. What is `P`(yellow or purple)?","options":[{"t":"0","why":"That’s `P`(yellow \u003cstrong>and\u003c/strong> purple). “Or” includes everything in `A`, everything in `B`, and the overlap, not just the overlap.","_n":"2863a","_k":"d77eeced"},{"t":"2/27","why":"2/9 × 3/9 multiplies.","_n":"2962a","_k":"b9d557f9"},{"t":"4/9","why":"That’s blue, the complement.","_n":"2a61a","_k":"0037932a"},{"t":"5/9","why":"2/9 + 3/9.","_n":"2b60a","_k":"29f7196b"}]}},{"id":"k3","cat":"K","goal":5,"a":{"prompt":"`P`(rain tomorrow) = 0.35. What is `P`(no rain tomorrow)?","options":[{"t":"−0.65","why":"That’s 0.35 − 1. Probabilities of `A` and `A′` add to 1, so `P(A′) = 1 - P(A)`.","_n":"2c5fa","_k":"49b37cc2"},{"t":"0.35","why":"That’s rain.","_n":"2d5ea","_k":"02e25556"},{"t":"0.65","why":"1 − 0.35.","_n":"2e5da","_k":"7a6e5e1d"},{"t":"2.86","why":"1 ÷ 0.35 isn’t a complement.","_n":"2f5ca","_k":"d8e72f8e"}]},"b":{"prompt":"`P`(the bus is late) = 0.12. What is `P`(the bus is not late)?","options":[{"t":"−0.88","why":"That’s 0.12 − 1. Probabilities of `A` and `A′` add to 1, so `P(A′) = 1 - P(A)`.","_n":"2g5ba","_k":"ab489412"},{"t":"0.12","why":"That’s late.","_n":"2h5ea","_k":"afb259c2"},{"t":"0.88","why":"1 − 0.12.","_n":"2i5fa","_k":"9fafc8e3"},{"t":"8.33","why":"1 ÷ 0.12 isn’t a complement. Probabilities of `A` and `A′` add to 1, so `P(A′) = 1 - P(A)`.","_n":"2j60a","_k":"96155bf0"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A tile is drawn from tiles numbered 1–30. What is `P`(multiple of 3 or multiple of 5)?","options":[{"t":"1/15","why":"2/30 is only the overlap.","_n":"2k61a","_k":"fde8cf4c"},{"t":"2/5","why":"12/30 subtracts the overlap twice.","_n":"2l5aa","_k":"11477112"},{"t":"7/15","why":"10 + 6 − 2 (15 and 30) = 14 of 30.","_n":"2m5ba","_k":"c923baab"},{"t":"8/15","why":"16/30 counts 15 and 30 twice.","_n":"2n5ca","_k":"531649a6"}]},"b":{"prompt":"Tiles 1–30. What is `P`(even or multiple of 3)?","options":[{"t":"1/6","why":"5/30 is only the overlap.","_n":"2o5da","_k":"88ad9d40"},{"t":"1/2","why":"15/30 subtracts the overlap twice.","_n":"2p56a","_k":"ccfcb891"},{"t":"2/3","why":"15 + 10 − 5 (6, 12, 18, 24, 30) = 20 of 30.","_n":"2q57a","_k":"83089f72"},{"t":"5/6","why":"25/30 counts 6, 12, 18, 24 and 30 twice.","_n":"2r283","_k":"2355ad2a"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"`P(A) = 0.45`, `P(B) = 0.30` and `P(A or B) = 0.60`. Find `P(A and B)`.","options":[{"t":"0","why":"If the overlap were 0, the union would be 0.75.","_n":"2s293","_k":"74c204e6"},{"t":"0.135","why":"0.45 × 0.30 assumes independence.","_n":"2t2a3","_k":"5f90e3c9"},{"t":"0.15","why":"0.45 + 0.30 − 0.60.","_n":"2u2b3","_k":"0eef9978"},{"t":"0.75","why":"That’s the sum, not the overlap.","_n":"2v243","_k":"2713e052"}]},"b":{"prompt":"`P(A) = 0.5`, `P(B) = 0.35` and `P(A or B) = 0.65`. Find `P(A and B)`.","options":[{"t":"0","why":"If the overlap were 0, the union would be 0.85.","_n":"2w253","_k":"95e22a86"},{"t":"0.175","why":"0.5 × 0.35 assumes independence.","_n":"2x263","_k":"f77f3906"},{"t":"0.2","why":"0.5 + 0.35 − 0.65.","_n":"2y273","_k":"ec2d6835"},{"t":"0.85","why":"That’s the sum, not the overlap.","_n":"2z203","_k":"9c7b570a"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"How many integers from 1 to 100 are divisible by 4 or by 6?","options":[{"t":"8","why":"That’s only the overlap.","_n":"30213","_k":"5d65b31e"},{"t":"33","why":"25 + 16 − 8: numbers divisible by both are multiples of 12.","_n":"312e4","_k":"5bca10d1"},{"t":"37","why":"Multiples of both 4 and 6 are multiples of 12, not 24.","_n":"322d4","_k":"5a4b6c78"},{"t":"41","why":"25 + 16 counts the multiples of 12 twice.","_n":"332c4","_k":"4ad8cefa"}]},"b":{"prompt":"How many integers from 1 to 120 are divisible by 6 or by 9?","options":[{"t":"6","why":"That’s only the overlap.","_n":"342b4","_k":"49c01158"},{"t":"27","why":"20 + 13 − 6: the overlap is multiples of 18.","_n":"352a4","_k":"7cea3671"},{"t":"31","why":"The overlap is multiples of 18, not 54.","_n":"36294","_k":"d6ee0039"},{"t":"33","why":"20 + 13 counts the multiples of 18 twice.","_n":"37284","_k":"0972eadd"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why `P`(king or heart) ≠ 4/52 + 13/52?","options":[{"t":"Because kings are more likely than hearts.","why":"4 kings vs 13 hearts; likelihood isn’t the issue.","_n":"38274","_k":"610cfc89"},{"t":"Because you should multiply for “or”.","why":"Nothing is multiplied for “or”. The king of hearts is in both events, so it’s counted twice.","_n":"39264","_k":"5b691c1d"},{"t":"It does equal 17/52; the events are different.","why":"A heart and a king sound different, but the king of hearts is both.","_n":"3a254","_k":"d748b5be"},{"t":"The king of hearts is in both events, so adding counts it twice. Subtract 1/52: the answer is 16/52.","why":"It names the outcome in both events and subtracts it once.","_n":"3b144","_k":"4a5eb54e"}]},"b":{"prompt":"Which best explains why `P`(two heads or at least one tail) for two coins equals `P`(two heads) + `P`(at least one tail)?","options":[{"t":"No outcome is in both events (HH has no tail), so nothing is double counted: 1/4 + 3/4 = 1.","why":"The events are mutually exclusive, so adding is enough.","_n":"3c154","_k":"1a209bfa"},{"t":"Because both events have probability 1/2.","why":"They’re 1/4 and 3/4.","_n":"3d124","_k":"b071f045"},{"t":"Because coins are independent.","why":"Independence is about “and”, not overlap.","_n":"3e134","_k":"5ecde7c9"},{"t":"Because you always add for “or”.","why":"Only when the events don’t overlap.","_n":"3f184","_k":"2859d6a1"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which description of a Venn diagram explains `n(A ∪ B) = n(A) + n(B) - n(A ∩ B)`?","options":[{"t":"Subtract the overlap twice, once for each circle.","why":"The overlap was counted twice, so subtract it \u003cstrong>once\u003c/strong>.","_n":"3g194","_k":"5d34fd55"},{"t":"Adding the two circles counts the overlapping region twice, so subtract it once.","why":"The overlap sits inside both circles, so it’s in both counts.","_n":"3h164","_k":"879ed3ea"},{"t":"Adding the circles misses the overlap, so subtract it.","why":"Adding includes the overlap twice, not zero times.","_n":"3i174","_k":"394e9e89"},{"t":"The overlap is subtracted because it’s outside both circles.","why":"The overlap is inside both.","_n":"3j1c4","_k":"343bae26"}]},"b":{"prompt":"Which statement correctly describes mutually exclusive events in a Venn diagram?","options":[{"t":"The circles overlap completely.","why":"That would make the events the same.","_n":"3k1d4","_k":"81fdf634"},{"t":"The circles overlap, but you ignore the overlap.","why":"Ignoring a shared region counts its outcomes twice.","_n":"3l9a4","_k":"1b55935e"},{"t":"One circle is inside the other.","why":"Then every `A` outcome would also be in `B`.","_n":"3m994","_k":"c8e46cb3"},{"t":"The circles don’t overlap: `A ∩ B` is empty, so `n(A ∪ B) = n(A) + n(B)`.","why":"No region is shared, so nothing is counted twice.","_n":"3n9c4","_k":"e929a4a5"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Model survey of 120 students: 70 play a team sport, 45 play an instrument, 20 do both. How many do neither?","options":[{"t":"0","why":"Not everyone is in a group.","_n":"3o9b4","_k":"1684d116"},{"t":"5","why":"120 − 115 counts the 20 twice.","_n":"3p964","_k":"148c9fbd"},{"t":"25","why":"120 − (70 + 45 − 20) = 120 − 95.","_n":"3q954","_k":"6f9df878"},{"t":"45","why":"120 − 75 leaves out the 20 who do both.","_n":"3r984","_k":"f16d2cd5"}]},"b":{"prompt":"Model survey of 150 students: 80 read fiction, 60 read non-fiction, 25 read both. How many read neither?","options":[{"t":"0","why":"Not everyone is in a group.","_n":"3s974","_k":"4e59edd7"},{"t":"10","why":"150 − 140 counts the 25 twice.","_n":"3ta24","_k":"68c611e5"},{"t":"35","why":"150 − (80 + 60 − 25).","_n":"3ua14","_k":"2d0f21f8"},{"t":"60","why":"150 − 90 leaves out the 25 who read both.","_n":"3v903","_k":"8a88a90c"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A forecast gives `P`(rain Saturday) = 0.4, `P`(rain Sunday) = 0.5 and `P`(rain both days) = 0.2. What is `P`(no rain all weekend)?","options":[{"t":"0.1","why":"1 − 0.9 counts “both days” twice.","_n":"3w913","_k":"6700a748"},{"t":"0.3","why":"1 − (0.4 + 0.5 − 0.2) = 1 − 0.7.","_n":"3x923","_k":"92759e7f"},{"t":"0.7","why":"That’s rain on at least one day.","_n":"3y933","_k":"bd0f9ca8"},{"t":"0.8","why":"1 − 0.2 treats “both” as “at least one”.","_n":"3z943","_k":"9368db7c"}]},"b":{"prompt":"A store gives `P`(shoes on sale) = 0.3, `P`(jackets on sale) = 0.25 and `P`(both) = 0.1. What is `P`(neither on sale)?","options":[{"t":"0.35","why":"1 − 0.65 counts “both” twice.","_n":"40953","_k":"c054537e"},{"t":"0.45","why":"That’s at least one on sale.","_n":"41963","_k":"ce4f56b4"},{"t":"0.55","why":"1 − (0.3 + 0.25 − 0.1) = 1 − 0.45.","_n":"42973","_k":"ffe37cf5"},{"t":"0.9","why":"1 − 0.1 treats “both” as “at least one”.","_n":"43983","_k":"57cd4e24"}]}}]},"task":{"title":"Two events, one overlap","summary":"Two events, one overlap","statement":"\u003cp>A tile is drawn from tiles numbered 1–30. Design event `A` = “a multiple of `k`” and event `B` = “greater than `m`” so that every condition holds. Can you find all the answers?\u003c/p>\u003col class=\"me-conds\">\u003cli>Exactly 2 tiles are in both `A` and `B`.\u003c/li>\u003cli>`P(A or B) = 1/2`.\u003c/li>\u003cli>`B` is at least twice as likely as `A`.\u003c/li>\u003c/ol>","checks":["Exactly 2 in both","`P(A or B) = 1/2`","`B` at least twice as likely"],"tips":["The overlap is the multiples of `k` above `m`. Move `m` until exactly two are left.","Use the additive principle: `n(A) + n(B) - 2` must be 15.","Large `k` makes `A` small, which helps condition 3."],"explainPrompt":"Explain how you used the additive principle to hit exactly half the tiles.","vocab":"Use the words union, intersection, overlap and mutually exclusive.","more":"There’s more than one answer. Can you find them all?","afterAll":"Conditions 1 and 2 force `n(A) + n(B) = 17`. Condition 3 then needs `n(A)` small, which is why `k` = 4 fails."},"cards":[["Mutually exclusive","Can’t happen together: `A ∩ B = ∅`."],["“Or” for mutually exclusive events","`P(A or B) = P(A) + P(B)`."],["“Or” for overlapping events","`P(A ∪ B) = P(A) + P(B) - P(A ∩ B)`."],["Why subtract?","Adding counts the overlap twice; subtract it once."],["Additive counting principle","`n(A ∪ B) = n(A) + n(B) - n(A ∩ B)`."],["Complement","`P(A′) = 1 - P(A)`."],["Neither","`P`(neither) = 1 − `P(A ∪ B)`."],["Working backwards","`P(A ∩ B) = P(A) + P(B) - P(A ∪ B)`."],["Heart and king","Not mutually exclusive: K♥ is both."],["Multiples of 4 or 6","Overlap = multiples of 12 (the lowest common multiple), not 24."],["Mutually exclusive ≠ independent","Mutually exclusive events with non-zero probabilities affect each other: if one happens, the other can’t."],["Probabilities over 1?","If `P(A) + P(B) > 1`, the events must overlap."]]}};</script>
