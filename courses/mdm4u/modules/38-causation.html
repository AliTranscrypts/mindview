.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 38: Causation detective (case files, D11 hidden-variable lab, study designer), Headlines on trial, Hidden variables,
   Honest headline. Groups: --ev-a/b/c with a shape each (circle, square, triangle); hidden variable --ink-2 dashed;
   study strips: app group --pen, control group --f3 (plan build notes). */
/* radioGroup (from MDM4U 19) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 19) */
.cz-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.cz-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.cz-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.cz-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.cz-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}
.cz-sw:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.cz-sw .cc-track,.cz-sw .cc-knob{transition:none}}

/* Causation detective */
.cz-top{margin-bottom:4px}
canvas.plot.cz-plot{aspect-ratio:16/11}
.cz-cap{font-size:clamp(1.05rem,2.4vw,1.35rem)}
.cz-sws{margin:0 0 10px}
.cz-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;font-size:.9rem}
.cz-lg-h{font-weight:700;color:var(--ink-2)}
.cz-lg{display:inline-flex;align-items:center;gap:5px}
.cz-sh{font-size:1rem;line-height:1}
.cz-g0{color:var(--ev-a)}.cz-g1{color:var(--ev-b)}.cz-g2{color:var(--ev-c)}
.cz-note{margin:10px 0 0;font-size:.95rem}
.cz-model{margin:0 0 10px;font-size:.95rem}
.cz-msg{min-height:1.2em;margin:6px 0 0}
.cz-nav{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px}
.cz-dots{display:inline-flex;flex-wrap:wrap;gap:4px}
.cz-dot{min-width:40px;min-height:40px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;font-weight:700;padding:0 .4em}
.cz-dot span{color:var(--ink-2);margin-left:2px}
.cz-dot[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.cz-dot[aria-pressed="true"] span{color:var(--sheet)}
.cz-rev{margin:10px 0 0;border:1.5px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--sheet)}
.cz-svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.cz-box{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.cz-bt{fill:var(--ink);font:700 13px var(--font-ui);text-anchor:middle}
.cz-st{fill:var(--ink-2);font:italic 13px var(--font-ui);text-anchor:middle}
.cz-q{fill:var(--ink);font:700 20px var(--font-ui);text-anchor:middle}
.cz-ar{stroke:var(--ink);stroke-width:2.2;fill:none}
.cz-ard{stroke-dasharray:6 5}
.cz-ahp{fill:var(--ink)}
.cz-hid{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2;stroke-dasharray:6 5}
.cz-verdict{margin:6px 0 0;font-weight:700}

/* Headlines on trial */
.hl-st{border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;margin:0 0 14px;background:var(--sheet)}
.hl-lab{margin:0 0 4px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.hl-head{margin:0 0 8px;font-size:clamp(1.1rem,2.6vw,1.35rem);font-weight:700}
.hl-data{margin:0 0 10px}
.hl-q{margin:10px 0 6px;font-weight:700}
.hl-chips{display:flex;flex-wrap:wrap;gap:6px}
.hl-c{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .9em;font-size:.92rem;min-height:38px;text-align:left}
.hl-o{border-radius:10px}
.hl-c[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.hl-c:disabled{cursor:default;opacity:.75}
.hl-after{margin:8px 0 0}

/* Hidden variables (N4 numEntry from MDM4U 20) */
.hv-tbl{margin:0 0 12px}
.ne-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:8px}
.ne-lab{display:inline-flex;align-items:center;gap:8px}
.ne-lab .numin{width:7rem}
.ne-ch{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ne-l{font-weight:700}
.ne-chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.ne-c{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:36px;text-align:left}
.ne-c[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ne-c:disabled{opacity:.7;cursor:default}
.hv-inv{margin:10px 0 0}
.hv-inv label{display:block;margin:0 0 4px}
.hv-inv textarea{width:100%;box-sizing:border-box;font:inherit;padding:6px 8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}

/* Honest headline */
.hh-in{display:grid;gap:4px}
.hh-pv{border:1.5px solid var(--rule);border-radius:10px;padding:10px 14px;background:var(--sheet)}
.hh-lab{margin:0 0 4px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.hh-line{margin:0;font-size:1.1rem;line-height:1.5}

lain how it could create or hide a correlation.","I can use grouped data to test whether a hidden variable explains a relationship.","I can explain why only a randomized controlled experiment can establish cause and effect.","I can judge whether a media claim is supported by its data and rewrite it honestly."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Reading correlation","goal":1,"prompt":"Hot-chocolate sales and hoodie sales at a school store have `r` = 0.997 over six weeks. Which is true?","options":[{"t":"They have a very strong positive linear relationship","why":"`r` = 0.997 is very close to 1: very strong and positive.","_n":"0ab5","_k":"0d337314"},{"t":"They have a strong negative relationship.","why":"`r` is positive.","_n":"1aa5","_k":"5c133ea5"},{"t":"Hoodie sales cause hot-chocolate sales.","why":"`r` doesn’t show cause. `r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"2a95","_k":"a58de6f6"},{"t":"They are unrelated.","why":"`r` near 1 means strongly related.","_n":"3a85","_k":"4ee4b0c2"}],"hints":["What does `r` measure?","How closely the points follow a line, and the direction.","Very strong and positive."]},{"id":"w2","skill":"Reading correlation","goal":3,"prompt":"Within one grade, shoe size and reading score have `r` = 0. What does that mean?","options":[{"t":"Shoe size lowers reading.","why":"That would be a negative `r`.","_n":"4a75","_k":"0ce692e2"},{"t":"The data were entered wrong.","why":"`r` = 0 is a real possible result.","_n":"5a65","_k":"7c9abc76"},{"t":"Every student has the same score.","why":"Scores can vary; they just don’t follow shoe size.","_n":"6a55","_k":"f2d46b1e"},{"t":"Within that grade, shoe size gives no linear information about reading","why":"`r` = 0 means no linear pattern.","_n":"7a45","_k":"98633585"}],"hints":["`r` = 0 means no linear pattern.","Bigger feet don’t go with higher or lower scores here.","No linear relationship."]},{"id":"w3","skill":"Percentages and rates","goal":3,"prompt":"180 of 200 patients recovered. What is the recovery rate?","options":[{"t":"111%","why":"200 ÷ 180: whole over part.","_n":"8a35","_k":"00451532"},{"t":"20%","why":"That subtracts the counts (200 − 180 = 20). Divide the part by the whole: 180 ÷ 200.","_n":"971b","_k":"868148e6"},{"t":"90%","why":"180 ÷ 200.","_n":"a72b","_k":"c20ad556"},{"t":"180%","why":"Divide by 200.","_n":"b6fb","_k":"664933f5"}],"hints":["Part ÷ whole.","180 ÷ 200.","0.9 = 90%."]},{"id":"w4","skill":"Percentages and rates","goal":3,"prompt":"Clinic A treats 250 patients; 190 recover. Clinic B treats 250; 96 recover. Which statement is correct?","options":[{"t":"B’s rate is 96%.","why":"96 is a count, not a percentage.","_n":"c70b","_k":"fd60823d"},{"t":"The rates can’t be compared.","why":"Same denominators: compare directly.","_n":"d75b","_k":"a64bba93"},{"t":"A’s rate is 190%.","why":"Divide by 250.","_n":"e76b","_k":"6509f539"},{"t":"A’s overall rate is 76%; B’s is 38.4%","why":"190 ÷ 250 = 0.76 and 96 ÷ 250 = 0.384.","_n":"f73b","_k":"2fea1a28"}],"hints":["Divide each count by 250.","190 ÷ 250 = 0.76.","96 ÷ 250 = 0.384."]},{"id":"w5","skill":"Sampling ideas","goal":4,"prompt":"Students choose for themselves whether to use a study app, and app users get higher marks. What’s the main problem with concluding the app works?","options":[{"t":"The sample is too large.","why":"Larger samples are better.","_n":"g74b","_k":"70b582a5"},{"t":"Students who choose the app may differ in other ways (e.g. motivation)","why":"Self-selection: motivation could explain both.","_n":"h69b","_k":"4bde30af"},{"t":"Marks can’t be measured.","why":"Marks are measurable.","_n":"i6ab","_k":"f2ad8cd5"},{"t":"Nothing; the comparison proves it.","why":"Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"j6bb","_k":"48a190d9"}],"hints":["Who decided who used the app?","The students did: self-selection.","Motivation could explain both."]},{"id":"w6","skill":"Sampling ideas","goal":4,"prompt":"What does \u003cstrong>random assignment\u003c/strong> to groups do?","options":[{"t":"It makes the groups alike, on average, in every other variable","why":"Nothing about the person decides their group, so hidden variables balance out.","_n":"k6ab","_k":"8f760a24"},{"t":"It makes the sample representative of Canada.","why":"That’s random \u003cstrong>sampling\u003c/strong>, a different idea.","_n":"l69b","_k":"327544b0"},{"t":"It lets people choose their group.","why":"That’s self-selection.","_n":"m68b","_k":"eb72308c"},{"t":"It guarantees a big effect.","why":"It removes bias; it doesn’t create effects.","_n":"n67b","_k":"5f326504"}],"hints":["Why flip a coin to decide groups?","So nothing about the person decides their group.","Hidden variables balance out."]}],"refreshers":{"Reading correlation":"`r` gives strength and direction of a linear pattern. It never tells you why.","Percentages and rates":"Rate = part ÷ whole. Compare rates, not raw counts, when group sizes differ.","Sampling ideas":"Random \u003cstrong>sampling\u003c/strong> gives a representative sample; random \u003cstrong>assignment\u003c/strong> gives comparable groups. Self-selected groups may differ in hidden ways."}}},"explore":{"heading":"Causation detective","intro":"Every case shows a real-looking correlation. Decide why the variables move together, then test your idea with the data.","predIntro":"Make a prediction first. Then the detective’s tools will show you what really happens.","cases":[{"id":"c1","title":"Space heater hours vs electricity used","xLab":"heater hours","yLab":"electricity (kWh)","pts":[[1,1.6],[2,3.1],[3,4.4],[4,6.2],[5,7.4],[6,9.1],[7,10.4],[8,12.1]],"note":"One space heater, eight days. A power monitor on the outlet measured the electricity it drew each day.","_a":"EldUQA==","z":"","verdict":"Cause and effect: running the heater uses the electricity."},{"id":"c2","title":"Hoodie sales vs hot-chocolate sales","xLab":"hoodies sold","yLab":"hot chocolates sold","pts":[[22,40],[31,62],[45,80],[57,106],[64,124],[77,146]],"note":"Weekly sales at a school store over six weeks, October to November. The weeks got colder as they went.","_a":"EldSQA==","z":"temperature","verdict":"Common cause: cold weeks drive both hoodie and hot-chocolate sales."},{"id":"c3","title":"Umbrellas sold vs that day’s rainfall","xLab":"umbrellas sold","yLab":"rainfall (mm)","pts":[[3,0],[5,1],[12,4],[20,9],[26,11],[34,18],[40,17],[55,25]],"note":"Daily umbrella sales at a downtown shop, with rainfall from the nearest weather station.","_a":"EkZUFBo=","z":"","verdict":"Reverse cause and effect: rain (`y`) drives umbrella sales (`x`)."},{"id":"c4","title":"A country’s name length vs its average rainfall","xLab":"letters in name","yLab":"rainfall (mm/year)","pts":[[4,1200],[5,640],[6,1500],[7,900],[8,1750],[9,1100],[10,2100],[11,1650]],"note":"Eight countries picked from an atlas. Nobody can suggest any way a name could affect the weather, or the weather a name.","_a":"ElVSARo=","z":"","verdict":"Accidental: there’s no logical link at all, so the pattern is coincidence."},{"id":"c5","title":"Fires: trucks sent vs damage","xLab":"fire trucks sent","yLab":"damage ($1000s)","pts":[[1,12],[2,30],[2,10],[3,45],[4,28],[5,70],[6,45],[8,95]],"note":"Eight fires in one city last year. Dispatchers send more trucks to bigger fires.","_a":"EldSQA==","z":"fire size","verdict":"Common cause: the size of the fire drives both the trucks sent and the damage."},{"id":"c6","title":"Screen time vs sleep","xLab":"screen time (h/day)","yLab":"sleep (h/night)","pts":[[1,8.5],[2,8.8],[2.5,7.8],[3,8.6],[4,7.7],[5,8.3],[6,7.3],[7,7.8]],"note":"A survey of eight teens. Follow-up: no common cause found; no experiment yet.","_a":"EkRDBxo=","z":"","verdict":"Presumed: screens keeping teens awake sounds logical, but no cause or common cause has been established."}],"predictions":[{"id":"p1","start":{"mode":"lab","set":"shoe","col":"none"},"prompt":"Why do shoe size and reading score move together?","options":[{"t":"Reading makes feet grow (reverse)","_n":"o66b","_k":"f0a23668"},{"t":"Both increase with age (common cause)","_n":"p65b","_k":"8132aab3"},{"t":"Pure coincidence (accidental)","_n":"q64b","_k":"992d1734"},{"t":"Bigger feet help reading (cause and effect)","_n":"r73b","_k":"fc59d257"}],"explain":"Older students have bigger feet and read better. Age (grade) is the common cause. `r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`."},{"id":"p2","start":{"mode":"lab","set":"shoe","col":"grade"},"prompt":"What is `r` within the grade 4 group?","options":[{"t":"About 0","_n":"s72b","_k":"6a6cef4c"},{"t":"Exactly 1","_n":"te5b","_k":"ef975b85"},{"t":"About 0.9","_n":"ue6b","_k":"14a6dc33"},{"t":"About −0.9","_n":"ve7b","_k":"706c87e9"}],"explain":"Once age is held fixed, shoe size tells you nothing about reading. Compare within groups of the hidden variable: the overall pattern can disappear, or even flip."},{"id":"p3","start":{"mode":"study","asg":"choose","ctl":"yes","n":"200"},"prompt":"The app’s true effect in this model is +2 marks. What difference will this study show?","options":[{"t":"Exactly +2","_n":"we8b","_k":"dad2c0d3"},{"t":"More than +2","_n":"xe1b","_k":"bd530942"},{"t":"Less than +2","_n":"ye2b","_k":"a0bdbd0b"},{"t":"0","_n":"ze3b","_k":"a0cb14e1"}],"explain":"Motivated students chose the app; motivation adds its own +6. The study can’t separate them. Size and strength don’t fix self-selection. Only random assignment balances hidden variables."},{"id":"p4","start":{"mode":"cases","card":5},"prompt":"Case file 5 (fires: trucks sent vs damage, `r` = 0.88). What best explains the correlation?","options":[{"t":"The size of the fire causes both (common cause)","_n":"10e4b","_k":"47103a22"},{"t":"Coincidence (accidental)","_n":"11edb","_k":"cbc7e064"},{"t":"Damage sends trucks back in time (reverse)","_n":"12eeb","_k":"0bfef086"},{"t":"Trucks cause damage (cause and effect)","_n":"13dfb","_k":"bb86802f"}],"explain":"Bigger fires get more trucks and do more damage. Sending fewer trucks would make damage worse, not better."}],"chalIntro":"Use the detective’s tools to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Case files: classify all six cards correctly.","why":"1 cause and effect; 2 common cause (temperature); 3 reverse (rain drives umbrella sales); 4 accidental; 5 common cause (fire size); 6 presumed.","hints":["For each card, ask: could `x` produce `y`? Could `y` produce `x`? Is there a third variable? Is it coincidence?","Read each card’s note: it tells you what has been checked.","Cause, common, reverse, accidental, common, presumed."]},{"id":"tc2","goal":[2,3],"prompt":"Hidden-variable lab, hoodies vs hot chocolate (`r` = 0.997): choose the colouring that explains the correlation.","why":"Coloured by weekly temperature, the cold weeks sit at the top right and the warm weeks at the bottom left: temperature drives both.","hints":["What could make both go up together?","Cold weeks.","Colour by temperature."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Study designer: set up the study so its result matches the app’s true effect (+2.0) \u003cstrong>and\u003c/strong> it can support a cause-and-effect claim.","why":"Random assignment stops motivation from deciding who gets the app, the control group gives a comparison, and 200 students make chance error small: +2.0.","hints":["Which choice stops motivation from deciding who gets the app?","Random assignment, with a control group to compare against.","Then use enough students: 200."]}]},"part3":{"slug":"headlines","name":"Headlines","heading":"Headlines on trial","intro":"Each news item below is made up (\u003cspan class=\"mdm-model\">model news\u003c/span>). Open \u003cstrong>Check it with data\u003c/strong> to see the study behind the headline, give your verdict, then finish the station’s follow-up.","verdicts":[{"id":"supported","t":"Supported"},{"id":"care","t":"Fair, but needs care"},{"id":"overstated","t":"Overstated"},{"id":"misleading","t":"Misleading"}],"stations":[{"id":"s1","goal":5,"headline":"“Breakfast boosts marks, study proves.”","study":[["Design","Online poll on one website (people chose to answer)"],["Sample","60 volunteers"],["Result","`r` = 0.31 between breakfasts per week and marks"],["Source","CrunchStart cereal’s own website"],["Verb","“boosts”, “proves”"]],"_a":"EllYEVRcWVJZWlZA","wrong":{"supported":"Check the sample, the source, the strength and the verb before you trust it.","care":"“Needs care” suits a fair claim. This one uses causal words for a weak, volunteer poll run by the cereal maker.","overstated":"It’s worse than overstated: a voluntary-response sample, a weak `r`, causal language, and the source is the cereal company’s own website."},"why":"Misleading: a voluntary-response sample, a weak `r`, causal language, and the source is the cereal company’s own website.","followPrompt":"Tap \u003cstrong>all\u003c/strong> the problems with this news item, then press Check.","multi":true,"options":[{"t":"Sample: 60 volunteers on one website (voluntary response)","_n":"14deb","_k":"53c24c20"},{"t":"Source: the cereal company’s own website","_n":"15e1b","_k":"fe89cfae"},{"t":"Strength: `r` = 0.31 is weak","_n":"16e0b","_k":"2852b818"},{"t":"Causal verb: “boosts … proves” from a poll","_n":"17e3b","_k":"2614f73a"},{"t":"It uses a correlation coefficient","why":"Using `r` is fine; the problem is what the headline claims from it.","_n":"18e2b","_k":"4a2a3aeb"},{"t":"The study is about marks","why":"Marks are a fair thing to study.","_n":"19e5b","_k":"902d8351"}],"followWhy":"All four: the sample, the source, the strength and the causal verb.","after":"An honest version: “In an online poll of 60 volunteers on a cereal maker’s website, breakfast was weakly linked to marks.”"},{"id":"s2","goal":5,"headline":"“Teens who play sports are happier.”","study":[["Design","National survey (observational)"],["Sample","400 teens"],["Result","`r` = 0.42 between weekly sports hours and happiness score"],["Source","A national youth survey"],["Verb","“are happier”"]],"_a":"EldQEF0b","wrong":{"supported":"The verb is fair, but a survey can’t rule out other explanations and `r` = 0.42 is only moderate: it needs care.","overstated":"“Are happier” is association language, not a causal verb.","misleading":"The sample is national and the verb is associational: the claim is fair, with care."},"why":"Fair, but needs care: the verb is associational, and the strength is moderate.","followPrompt":"Choose the most important caveat.","options":[{"t":"The survey should have asked only athletes","why":"Asking only athletes would remove the comparison.","_n":"1ae4b","_k":"dbe50c24"},{"t":"`r` = 0.42 is too weak to mean anything","why":"0.42 is moderate. Correlation is evidence worth following up, especially with an experiment.","_n":"1be7b","_k":"21e0d46c"},{"t":"Teens with more free time or friends may do both","why":"Right. A common cause could link sports and happiness.","_n":"1ce6b","_k":"9d7792cb"},{"t":"400 teens is too small a sample","why":"400 is a reasonable national sample. Think about what else could explain the link.","_n":"1df9b","_k":"95892bd9"}],"followWhy":"Teens with more free time or friends may do both: a possible common cause.","after":"Even a fair headline should say it’s a survey and name the other explanations."},{"id":"s3","goal":[4,5],"headline":"“Reading app raises marks by 2 points.”","study":[["Design","Randomized experiment with a control group"],["Sample","200 students"],["Result","App group − control group = +2.0 marks"],["Source","A school board’s research office (independent of the app maker)"],["When","This school year"]],"_a":"EkdEEkhWSkJVUBM=","wrong":{"care":"This is a randomized controlled experiment: a causal headline is supported.","overstated":"“Raises” is causal, and here that’s earned: random assignment, a control group, 200 students.","misleading":"Look at the design: random assignment with a control group, run by an independent source."},"why":"Supported: random assignment, a control group, an independent source and current data.","followPrompt":"Note why: tap \u003cstrong>all\u003c/strong> the reasons the headline is supported, then press Check.","multi":true,"options":[{"t":"Random assignment","_n":"1efab","_k":"7b3d9cd3"},{"t":"A control group","_n":"1ff7b","_k":"365376b2"},{"t":"An independent source","_n":"1gf8b","_k":"e2c8e65c"},{"t":"Current data","_n":"1hf5b","_k":"b6ebdfbe"},{"t":"The app is popular","why":"Popularity isn’t evidence that it works.","_n":"1if6b","_k":"cf47046f"},{"t":"`r` is above 0.9","why":"No `r` was reported; the design is what matters.","_n":"1jf3b","_k":"52d43505"}],"followWhy":"Random assignment, a control group, an independent source and current data.","after":"Only random assignment balances hidden variables such as motivation."}],"quickCheck":{"title":"Headlines on trial quick check","summary":"Headlines on trial quick check","items":[{"id":"q1","goal":4,"prompt":"Which study design supports a causal headline?","choices":[{"t":"Randomized controlled experiment","fb":"Right. Only random assignment balances hidden variables.","_n":"1kf4b","_k":"f6be20bc"},{"t":"Large online poll","fb":"Only random assignment balances hidden variables.","_n":"1lf1b","_k":"481228a9"},{"t":"Interviews of satisfied customers","fb":"Only random assignment balances hidden variables.","_n":"1mf2b","_k":"4eb7141f"},{"t":"Survey with `r` = 0.9","fb":"Only random assignment balances hidden variables.","_n":"1n73a","_k":"bbd3f6ab"}]},{"id":"q2","goal":5,"prompt":"A headline uses ‘is linked to’. That suits…","choices":[{"t":"No study","fb":"Association language for association evidence.","_n":"1o72a","_k":"b6191953"},{"t":"Only anecdotes","fb":"Association language for association evidence.","_n":"1p71a","_k":"8f94be5b"},{"t":"Only an experiment","fb":"Association language for association evidence.","_n":"1q70a","_k":"49db1f03"},{"t":"An observational study","fb":"Right. Association language for association evidence.","_n":"1r77a","_k":"51eb0b18"}]},{"id":"q3","goal":5,"prompt":"Which source is most trustworthy for national data?","choices":[{"t":"Statistics Canada","fb":"Right. Authoritative, independent, current.","_n":"1s76a","_k":"d165a2f0"},{"t":"A brand’s ad","fb":"Authoritative, independent, current.","_n":"1t75a","_k":"db75922b"},{"t":"A viral post","fb":"Authoritative, independent, current.","_n":"1u74a","_k":"8216d353"},{"t":"An anonymous blog","fb":"Authoritative, independent, current.","_n":"1v6ba","_k":"48d133ed"}]},{"id":"q4","goal":5,"prompt":"A poll of 60 volunteers on one website is…","choices":[{"t":"A voluntary-response sample","fb":"Right. People chose to respond: likely biased.","_n":"1w6aa","_k":"db25a884"},{"t":"A controlled experiment","fb":"People chose to respond: likely biased.","_n":"1x6da","_k":"e36a1c7d"},{"t":"A census","fb":"People chose to respond: likely biased.","_n":"1y6ea","_k":"c063a5a9"},{"t":"A random sample","fb":"People chose to respond: likely biased.","_n":"1z6fa","_k":"9f5be0ad"}]}]}},"practice":{"activities":[{"id":"name","type":"sorter","title":"Name the relationship","summary":"Name the relationship","goal":[1,2],"noun":"card","txt":true,"instruction":"Tap a card, then tap the type of relationship it shows. Each card’s note tells you what has been checked.","boxes":[{"id":"ce","label":"Cause and effect"},{"id":"cc","label":"Common cause"},{"id":"rev","label":"Reverse cause and effect"},{"id":"acc","label":"Accidental"},{"id":"pre","label":"Presumed"}],"wrongDefault":"Read the note: what has been checked, and in which direction could cause run?","items":[{"id":"r1","t":"Minutes a kettle runs vs water temperature (lab measurements)","_a":"EldUQA==","why":"the kettle’s heat raises the water temperature.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Cause and effect: the kettle’s heat raises the water temperature."],"wrong":{}},{"id":"r2","t":"Ice-cream sales vs sunburn cases (both peak in hot, sunny weeks)","_a":"EldSQA==","why":"hot, sunny weather drives both.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Common cause: hot, sunny weather drives both."],"wrong":{}},{"id":"r3","t":"Pain-medicine doses taken vs pain level reported (patients take more when pain is worse)","_a":"EkZUFBo=","why":"worse pain leads to more medicine, so `y` drives `x`.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Reverse cause and effect: worse pain leads to more medicine, so `y` drives `x`."],"wrong":{"ce":"Which direction? Worse pain leads to more medicine, so `y` drives `x`."}},{"id":"r4","t":"Number of letters in a hockey team’s name vs points scored in a season (no conceivable link)","_a":"ElVSARo=","why":"there’s no conceivable link, so it’s coincidence.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Accidental: there’s no conceivable link, so it’s coincidence."],"wrong":{}},{"id":"r5","t":"Students who play an instrument vs math marks (no common cause found in a follow-up; no experiment yet)","_a":"EkRDBxo=","why":"it seems logical, but no cause or common cause has been established.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Presumed: it seems logical, but no cause or common cause has been established."],"wrong":{"cc":"The note says none was found, so it’s presumed."}},{"id":"r6","t":"Number of police officers in a city vs number of crimes (larger cities have more of both)","_a":"EldSQA==","why":"city size drives both.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Common cause: city size drives both."],"wrong":{"ce":"City size drives both."}},{"id":"r7","t":"Umbrellas sold vs rainfall that day","_a":"EkZUFBo=","why":"rain drives umbrella sales; selling umbrellas can’t cause rain.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Reverse cause and effect: rain drives umbrella sales; selling umbrellas can’t cause rain."],"wrong":{"ce":"Ask which variable could plausibly drive the other. Rain causes umbrella sales, not the reverse."}},{"id":"r8","t":"Hours of practice vs free-throw %, from a randomized training experiment","_a":"EldUQA==","why":"a randomized experiment shows that practice raises free-throw %.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Cause and effect: a randomized experiment shows that practice raises free-throw %."],"wrong":{}},{"id":"r9","t":"Cheese eaten per person vs bedsheet-tangle accidents, by year (no plausible link)","_a":"ElVSARo=","why":"there’s no plausible link: coincidence.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Accidental: there’s no plausible link: coincidence."],"wrong":{}},{"id":"r10","t":"Screen time vs hours of sleep (checked for common causes; none found; no experiment)","_a":"EkRDBxo=","why":"it seems logical, but nothing has been established.","hints":["Could `x` produce `y`? Could `y` produce `x`?","Is a third variable named? Is the link even logical?","Presumed: it seems logical, but nothing has been established."],"wrong":{"cc":"The note says none was found, so it’s presumed."}}]},{"id":"hidden","type":"custom","title":"Hidden variables","summary":"Hidden variables","goal":[2,3],"star":true,"instruction":"Use the clinic table (model data) to compare recovery rates. Items marked ★ are non-routine (a version of Simpson’s paradox); the last two go beyond the Final Check.","how":"Type a percentage such as 76 or 76%, or tap a choice, then press Check.","table":{"head":["Clinic","Mild cases recovered","Severe cases recovered","All"],"rows":[["A","180 of 200","10 of 50","190 of 250"],["B","46 of 50","50 of 200","96 of 250"]]},"items":[{"id":"h1","goal":3,"prompt":"Overall recovery rate at A? at B?","parts":["A (%):","B (%):"],"_a":"awMHTgsBFgJt","display":"A 76%, B 38.4%","why":"190 ÷ 250 = 76%; 96 ÷ 250 = 38.4%.","fb":"Part ÷ whole for each clinic."},{"id":"h2","goal":3,"prompt":"Mild-case rate at A? at B?","parts":["A (%):","B (%):"],"_a":"aw0BTgELZQ==","display":"A 90%, B 92%","why":"180 ÷ 200 = 90%; 46 ÷ 50 = 92%.","fb":"180 ÷ 200; 46 ÷ 50."},{"id":"h3","goal":3,"prompt":"Severe-case rate at A? at B?","parts":["A (%):","B (%):"],"_a":"awYBTgoMZQ==","display":"A 20%, B 25%","why":"10 ÷ 50 = 20%; 50 ÷ 200 = 25%.","fb":"10 ÷ 50; 50 ÷ 200."},{"id":"h4","goal":3,"star":true,"prompt":"Which clinic does better \u003cstrong>within each\u003c/strong> severity group?","parts":[{"t":"Better in both groups:","choices":["A","B","Tie","Can’t tell"]}],"_a":"EnYT","display":"B","why":"92 > 90 and 25 > 20.","fb":"92 > 90 and 25 > 20. Compare within groups of the hidden variable: the overall pattern can disappear, or even flip."},{"id":"h5","goal":2,"star":true,"prompt":"Why is A better overall?","parts":[{"t":"Reason:","choices":["A treats mostly mild cases","A’s doctors are better","B lies","B is bigger"]}],"_a":"EnURFkpcWUJDFFwNS01UTxBZWA5cGVtXQ1FCQA==","display":"A treats mostly mild cases","why":"Severity is a hidden variable: B takes most of the severe cases.","fb":"Severity is a hidden variable: B takes most of the severe cases.","hints":["Look at the denominators.","A: 200 mild, 50 severe. B: 50 mild, 200 severe.","Severe cases recover less everywhere; B gets more of them."]},{"id":"h6","goal":[2,3],"star":true,"prompt":"Which clinic would you choose for a severe case, and why?","parts":[{"t":"Choice:","choices":["B: higher rate for severe cases (25% vs 20%)","A: higher overall rate (76% vs 38.4%)","A: higher rate for mild cases","Either: the rates are about the same"]}],"_a":"EnYLQlBQX15VRhEQWU1dFlZbQ0JLXE5TQlERAVlKXUUQHANXHRlORRAGAUcRGw==","display":"B: higher rate for severe cases (25% vs 20%)","why":"Compare like with like: within the severe group, B recovers 25% and A 20%.","fb":"Compare like with like: within the severe group.","investigate":"Name one more variable a fair comparison would need to check (e.g. age of patients)."}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Nell","how":"","goal":[2,4],"instruction":"Nell made one mistake in each argument. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Does owning a pet lower stress? A survey of 500 adults found `r` = −0.62 between pets owned and stress score.","steps":["`r` = −0.62 is a moderate negative correlation.","500 adults is a large sample.","So owning more pets causes lower stress.","Doctors should prescribe pets."],"_a":"Ag==","stepFb":["Correct: 0.33–0.67 is moderate.","True.","","Step 4 rests on step 3. The mistake is earlier."],"fixes":[{"t":"A larger sample would prove it.","why":"Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"2070a","_k":"e35295ab"},{"t":"Step 3 is correct.","why":"`r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"2171a","_k":"869ec683"},{"t":"It’s weak, so ignore it.","why":"−0.62 is moderate, not weak. Correlation is evidence worth following up, especially with an experiment.","_n":"2272a","_k":"3175dbef"},{"t":"A survey shows association only. Calmer people (or people with more time or space) may choose more pets; test it with an experiment.","why":"People weren’t assigned pets, so a survey shows association, not cause.","_n":"2373a","_k":"c3219cc4"}],"hints":["What kind of study was this?","A survey: people weren’t assigned pets.","Association, not cause."]},{"id":"e2","goal":2,"task":"Towns with more coffee shops have more car accidents (`r` = 0.81, 40 towns).","steps":["`r` = 0.81 is strong and positive.","The relationship is clearly accidental: coffee has nothing to do with driving.","So the data can be ignored."],"_a":"AQ==","stepFb":["Correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"It’s reverse: crashes cause coffee shops to open.","why":"Ask which variable could plausibly drive the other. Rain causes umbrella sales, not the reverse.","_n":"2474a","_k":"478f2b9b"},{"t":"Step 2 is correct.","why":"A logical third variable (population) explains it, so it’s not coincidence.","_n":"2565a","_k":"0b000f5c"},{"t":"It’s cause and effect: caffeine causes crashes.","why":"`r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"2666a","_k":"ffa05a78"},{"t":"It’s likely common cause: larger towns have more coffee shops and more cars. Compare towns of similar population.","why":"Town size grows with both, so compare towns of similar population.","_n":"2767a","_k":"948a966f"}],"hints":["Is there a third variable that grows with both?","Town size.","Common cause."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which case in the detective surprised you most, and why?"},{"id":"j2","q":"In your own words, explain why random assignment lets an experiment show cause when a survey can’t."},{"id":"j3","q":"Explain to a friend how colouring a scatter plot by a third variable can reveal a hidden cause."},{"id":"j4","q":"Think of a claim you once believed that confused correlation with cause. How would you test it now?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Hours a space heater runs vs electricity used (measured). Which type of relationship?","options":[{"t":"Reverse cause and effect","why":"Ask which variable could plausibly drive the other. Rain causes umbrella sales, not the reverse.","_n":"2866a","_k":"4140cb2a"},{"t":"Accidental","why":"There’s a direct physical link.","_n":"2969a","_k":"6c50c4a4"},{"t":"Cause and effect","why":"Running the heater uses the electricity.","_n":"2a68a","_k":"bff41f06"},{"t":"Common cause","why":"No third variable is needed.","_n":"2b63a","_k":"57aac525"}]},"b":{"prompt":"`x` = umbrellas sold, `y` = rainfall that day. Which type of relationship?","options":[{"t":"Cause and effect","why":"Selling umbrellas can’t cause rain. Ask which variable could plausibly drive the other. Rain causes umbrella sales, not the reverse.","_n":"2c62a","_k":"e9179dd1"},{"t":"Accidental","why":"There’s a clear link.","_n":"2d65a","_k":"298efc35"},{"t":"Presumed","why":"The cause is clear; it just runs from `y` to `x`.","_n":"2e64a","_k":"bafecd99"},{"t":"Reverse cause and effect","why":"Rain (`y`) drives umbrella sales (`x`).","_n":"2f6fa","_k":"2f704fab"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which describes a common-cause relationship?","options":[{"t":"It seems logical, but no cause has been established.","why":"That’s presumed. Common cause: a specific third variable is known to drive both. Presumed: it seems logical, but no cause has been established.","_n":"2g6ea","_k":"cc13a042"},{"t":"A third variable drives both `x` and `y`","why":"That’s common cause.","_n":"2h61a","_k":"e7ad712a"},{"t":"The link is pure coincidence.","why":"That’s accidental.","_n":"2i62a","_k":"864c0d3f"},{"t":"`y` drives `x`.","why":"That’s reverse.","_n":"2j5fa","_k":"9100c4a9"}]},"b":{"prompt":"Which describes an accidental relationship?","options":[{"t":"A third variable drives both.","why":"That’s common cause.","_n":"2k60a","_k":"1dd917cf"},{"t":"`x` drives `y`.","why":"That’s cause and effect.","_n":"2l65a","_k":"f1f2b6cd"},{"t":"The variables are correlated by coincidence, with no causal link","why":"That’s accidental.","_n":"2m66a","_k":"65664be4"},{"t":"It seems logical but is unproven.","why":"That’s presumed. Common cause: a specific third variable is known to drive both. Presumed: it seems logical, but no cause has been established.","_n":"2n63a","_k":"58cf0dd1"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which study design can establish cause and effect?","options":[{"t":"A collection of customer testimonials","why":"Anecdotes, self-selected.","_n":"2o64a","_k":"309b6fd7"},{"t":"A survey of 10 000 people","why":"Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"2p69a","_k":"f3cd2abd"},{"t":"An observational study with `r` = 0.95","why":"Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"2q6aa","_k":"17f4ba54"},{"t":"A randomized controlled experiment","why":"Random assignment balances hidden variables, and the control group gives a comparison.","_n":"2rb6f","_k":"28cc35aa"}]},"b":{"prompt":"In an experiment, what is random assignment for?","options":[{"t":"To let participants choose their group","why":"That’s self-selection. Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"2sb7f","_k":"20a221c1"},{"t":"To make the sample represent the whole country","why":"That’s random \u003cstrong>sampling\u003c/strong>.","_n":"2tb4f","_k":"44b47d09"},{"t":"To make the effect bigger","why":"It removes bias; it doesn’t create effects.","_n":"2ub5f","_k":"8646f475"},{"t":"To make the groups alike, on average, in every other variable","why":"Hidden variables balance out between the groups.","_n":"2vb2f","_k":"aa35cdca"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Across 40 towns, the number of coffee shops and the number of car accidents have `r` = 0.81. What is the most likely explanation?","options":[{"t":"Common cause: bigger towns have more of both","why":"Population drives both.","_n":"2wb3f","_k":"ede3d346"},{"t":"Cause and effect: coffee causes accidents","why":"`r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"2xb0f","_k":"c6643621"},{"t":"Accidental: there’s no link","why":"Population links them.","_n":"2yb1f","_k":"7f6813d5"},{"t":"Reverse: accidents create coffee shops","why":"Ask which variable could plausibly drive the other. Rain causes umbrella sales, not the reverse.","_n":"2zaef","_k":"c6a5dbef"}]},"b":{"prompt":"Students who own more books score higher on reading tests (`r` = 0.55). A follow-up found that family income relates strongly to both. What is the best classification?","options":[{"t":"Presumed","why":"A common cause has been found. Common cause: a specific third variable is known to drive both. Presumed: it seems logical, but no cause has been established.","_n":"30aff","_k":"71e1009d"},{"t":"Common cause: income relates to both book ownership and scores","why":"A third variable has been identified.","_n":"319cf","_k":"1a467d32"},{"t":"Cause and effect: books raise scores","why":"Income wasn’t ruled out. `r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"329bf","_k":"c74dbebf"},{"t":"Accidental","why":"There’s an identified third variable. Correlation is evidence worth following up, especially with an experiment.","_n":"339ef","_k":"d4591665"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Shoe size vs reading score: `r` = 0.90 for all 12 students; within each of grades 2, 4 and 6, `r` = 0.00. What should you conclude?","options":[{"t":"Reading makes feet grow","why":"Ask which variable could plausibly drive the other. Rain causes umbrella sales, not the reverse.","_n":"349df","_k":"3d8b0c0b"},{"t":"Bigger feet improve reading","why":"`r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"35a0f","_k":"b6ccfade"},{"t":"The overall `r` must be a calculation error","why":"It’s real; it comes from the grade groups.","_n":"369ff","_k":"94f4ac4f"},{"t":"Grade (age) is a common cause; shoe size doesn’t affect reading","why":"Within each grade the pattern disappears.","_n":"37a2f","_k":"17dd2edd"}]},"b":{"prompt":"Hoodie sales vs hot-chocolate sales: `r` = 0.997 over six weeks. Each is strongly correlated with weekly temperature (`r` ≈ −1). What should you conclude?","options":[{"t":"Hot chocolate causes hoodie sales","why":"Ask which variable could plausibly drive the other. Rain causes umbrella sales, not the reverse.","_n":"38a1f","_k":"bc24db26"},{"t":"Hoodies cause hot-chocolate sales","why":"`r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"39a4f","_k":"acc3f766"},{"t":"The relationship is accidental","why":"A clear third variable explains it.","_n":"3aa3f","_k":"12a85b7d"},{"t":"Temperature is a common cause of both","why":"Cold weeks drive both.","_n":"3b2ae","_k":"9fac24cb"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Clinic A: mild 180/200, severe 10/50 (overall 76%). Clinic B: mild 46/50, severe 50/200 (overall 38.4%). Which clinic has the better recovery rate for each type of case?","options":[{"t":"They can’t be compared","why":"Compare within groups.","_n":"3c2be","_k":"9e16fb7a"},{"t":"B in both groups (92% vs 90%; 25% vs 20%)","why":"Compare within groups: B is higher for mild and for severe cases.","_n":"3d2ce","_k":"6497dedf"},{"t":"A in both groups, because 76% > 38.4%","why":"Compare within groups of the hidden variable: the overall pattern can disappear, or even flip.","_n":"3e2de","_k":"9b42cbba"},{"t":"A for mild, B for severe","why":"Mild: 92% (B) vs 90% (A).","_n":"3f2ee","_k":"01c2a700"}]},"b":{"prompt":"Clinic P: minor 270/300, major 20/100 (overall 72.5%). Clinic Q: minor 92/100, major 75/300 (overall about 41.8%). Which clinic has the better rate for each type of case?","options":[{"t":"Q in both groups (92% vs 90%; 25% vs 20%)","why":"Compare within groups: Q is higher for minor and for major cases.","_n":"3g2fe","_k":"675c294d"},{"t":"P for minor, Q for major","why":"Minor: 92% (Q) vs 90% (P).","_n":"3h30e","_k":"3e8d81d8"},{"t":"P in both groups, because 72.5% > 41.8%","why":"Compare within groups of the hidden variable: the overall pattern can disappear, or even flip.","_n":"3i31e","_k":"e9ebb0a8"},{"t":"They can’t be compared","why":"Compare within groups.","_n":"3j22e","_k":"bc5fab83"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"A survey of 400 teens finds `r` = 0.42 between weekly sports hours and happiness. Which headline is most accurate?","options":[{"t":"“Teens who play more sports tend to be somewhat happier, survey finds”","why":"Association language, a moderate strength word and the source.","_n":"3k23e","_k":"70ba102c"},{"t":"“Survey proves sports cure unhappiness.”","why":"Use ‘is linked to’ or ‘is associated with’ for observational data. `r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"3lb0e","_k":"be49f487"},{"t":"“No link between sports and happiness.”","why":"`r` = 0.42 is moderate. Correlation is evidence worth following up, especially with an experiment.","_n":"3mafe","_k":"ce813fd9"},{"t":"“Sports make teens happy.”","why":"Use ‘is linked to’ or ‘is associated with’ for observational data.","_n":"3naee","_k":"45e2be71"}]},"b":{"prompt":"Which is the best explanation of why correlation doesn’t prove cause?","options":[{"t":"“Only negative correlations can show cause.”","why":"Sign is unrelated to cause.","_n":"3oade","_k":"2135b0ed"},{"t":"“Correlations are usually calculation errors.”","why":"Correlation is evidence worth following up, especially with an experiment.","_n":"3pb4e","_k":"98621007"},{"t":"“Variables can move together because of a third variable, a reverse direction or coincidence, not only because one causes the other.”","why":"Each of those can produce the same `r`.","_n":"3qb3e","_k":"993ece66"},{"t":"“Correlation proves cause when `r` > 0.9.”","why":"`r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"3rb2e","_k":"7bdc4b7b"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which best describes a hidden (lurking) variable?","options":[{"t":"A variable with `r` = 0","why":"That describes a relationship, not a variable.","_n":"3sb1e","_k":"8b146719"},{"t":"A variable not included in the analysis that affects the variables being studied","why":"It can create or hide a correlation.","_n":"3ta8e","_k":"e6b018c5"},{"t":"The `y`-variable","why":"That’s measured.","_n":"3ua7e","_k":"9cc4769c"},{"t":"An outlier","why":"That’s one data point.","_n":"3v2ef","_k":"671a52a1"}]},"b":{"prompt":"You suspect age explains a correlation. Which display best tests that?","options":[{"t":"A circle graph of ages","why":"It shows ages only.","_n":"3w2ff","_k":"92261de7"},{"t":"The same scatter plot, larger","why":"It won’t reveal the third variable.","_n":"3x2cf","_k":"726f2dd9"},{"t":"The scatter plot with points coloured by age group, and `r` within each group","why":"If the pattern vanishes within groups, age explains it.","_n":"3y2df","_k":"05c89248"},{"t":"A histogram of the `y`-variable","why":"It ignores `x` and age.","_n":"3z32f","_k":"d663edf5"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A school wants to know whether a new reading app improves marks. Which plan can answer that?","options":[{"t":"Survey students who chose the app","why":"Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"4033f","_k":"628e757b"},{"t":"Ask teachers whether they like the app","why":"Opinions, not outcomes.","_n":"4130f","_k":"61a5bb39"},{"t":"Randomly assign 200 students to use the app or not; compare mean marks","why":"Random assignment with a control group can show cause.","_n":"4231f","_k":"dee9cc3c"},{"t":"Compare this year’s marks with last year’s","why":"Too many other changes.","_n":"4326f","_k":"1c7bde0a"}]},"b":{"prompt":"A coach asks whether a sports drink speeds recovery compared with water. Which plan can answer that?","options":[{"t":"Randomly assign 60 athletes to the drink or water (without telling them which), and compare recovery times","why":"Random assignment with a control (water) group can show cause.","_n":"4427f","_k":"4a8571b3"},{"t":"Compare pros (who use it) with amateurs","why":"Too many differences between the groups.","_n":"4534f","_k":"b5f316c1"},{"t":"Give everyone the drink and time them","why":"There’s no control group.","_n":"4633f","_k":"7b7d6329"},{"t":"Ask athletes who already use the drink how they feel","why":"Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"4736f","_k":"5d3d3255"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Headline: ‘Coffee makes students smarter.’ Behind it: 30 volunteers, an online poll, `r` = 0.35. Best verdict?","options":[{"t":"Supported if the sample were 300","why":"Size and strength don’t fix self-selection. Only random assignment balances hidden variables.","_n":"4835f","_k":"d53aa7f5"},{"t":"Proven false","why":"It’s unsupported, not disproven. Correlation is evidence worth following up, especially with an experiment.","_n":"4930f","_k":"9af33a91"},{"t":"Supported: `r` is positive","why":"`r` measures how closely the points follow a line, not why. A third variable or coincidence can produce the same `r`.","_n":"4a2ff","_k":"4bf3ba10"},{"t":"Overstated: a small volunteer sample, a weak-to-moderate `r`, observational data and a causal verb","why":"The data show at most a weak association.","_n":"4b32f","_k":"c2cbd333"}]},"b":{"prompt":"Headline: ‘Phones ruin teen sleep.’ Behind it: a survey of 2000 teens, `r` = −0.48. Best verdict?","options":[{"t":"Supported: `r` is negative, so phones reduce sleep","
