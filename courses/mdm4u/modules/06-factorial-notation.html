.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 06: hero tiles, Line-up builder (D4 arrangement tiles, growth bars, pattern-down ladder), factor tiles, task */
/* radioGroup (from MDM4U 02 / 04) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button .m{font-size:1.08em}

/* ---------- hero ---------- */
.fac-heq{display:inline-block;font-size:clamp(1.2rem,2.9vw,1.75rem)}
.fac-heq .m{white-space:normal}
.fac-h{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.fac-h-pool,.fac-h-slots{display:flex;gap:12px;justify-content:center}
.fac-h-pool{min-height:58px}
.fac-ht{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border:2px solid var(--ink);border-radius:9px;background:var(--sheet);color:var(--ink);font:700 1.6rem var(--font-ui);transition:opacity .35s}
.fac-ht.gone{opacity:.14;border-style:dashed}
.fac-hsw{display:flex;flex-direction:column;align-items:center;gap:6px}
.fac-hsw small{font-size:.85rem;color:var(--ink-2);min-height:1.2em;transition:opacity .3s}
.fac-hsw small.off{opacity:0}
.fac-hs{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border:2px dashed var(--ink-2);border-radius:10px;transition:box-shadow .3s,border-color .3s}
.fac-hs.glow{border-color:var(--hi);border-style:solid;box-shadow:0 0 0 5px var(--hi-soft)}
.fac-hs.full{border-style:solid;border-color:var(--rule)}
.fac-ht.drop{animation:facDrop .45s cubic-bezier(.3,1.4,.5,1)}
.fac-ht.shuf{animation:facShuf .3s ease-out}
@keyframes facDrop{from{transform:translateY(-70px);opacity:.2}to{transform:none;opacity:1}}
@keyframes facShuf{from{transform:scale(.82);opacity:.35}to{transform:none;opacity:1}}
.fac-h-prod{font:400 1.5rem var(--font-math);margin:0;min-height:1.4em;text-align:center}
.fac-h-ctr{margin:0;font-weight:700;color:var(--ink-2);min-height:1.3em}

/* ---------- Explore ---------- */
.fac-top{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:flex-start}
.fac-top [hidden]{display:none}
.fac-cap{min-height:1.5em}
.fac-v[hidden]{display:none}
.fac-prod{font:400 1.45rem var(--font-math);margin:12px 0 4px;min-height:1.4em;overflow-wrap:anywhere}
.fac-prod .muted{font:400 .95rem var(--font-ui)}
.fac-prod .m,.fac-res .m,.fac-h-prod .m{white-space:normal}
.fac-msg{margin:4px 0 0;min-height:1.3em;font-size:.92rem;color:var(--ink-2)}
.fac-how{margin-top:8px}
.fac-btns{margin-top:6px}

/* @component D4 arrangementTiles styles (copy with the component) */
.d4-pool,.d4-slots{display:flex;flex-wrap:wrap;gap:10px}
.d4-pool{min-height:56px;margin:4px 0 16px;padding:8px;border-radius:10px;background:var(--paper)}
.d4-t{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;padding:0;border:2px solid var(--ink);border-radius:9px;background:var(--sheet);color:var(--ink);cursor:pointer}
.d4-t[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 4px var(--hi-soft)}
.d4-t.d4-gh{border:2px dashed var(--rule);background:transparent;cursor:default}
.d4-in{display:inline-flex;align-items:center;justify-content:center;gap:1px;line-height:1}
.d4-L{font:700 1.5rem var(--font-ui)}
.d4-ic{width:26px;height:26px;fill:currentColor;flex:none}
.d4-l{font:700 .85rem var(--font-ui);color:var(--ink);align-self:flex-end}
.d4-t[aria-pressed="true"] .d4-l{color:var(--hi-ink)}
.d4-sw{display:flex;flex-direction:column;align-items:center;gap:4px;width:60px}
.d4-s{display:flex;align-items:center;justify-content:center;width:58px;height:58px;padding:0;border:2px dashed var(--ink-2);border-radius:10px;background:transparent;color:var(--ink)}
.d4-s.next{border:2.5px solid var(--hi);box-shadow:0 0 0 5px var(--hi-soft);cursor:pointer}
.d4-s.full{border:2px solid var(--ink);background:var(--sheet);cursor:default}
.d4-s.full:not([aria-disabled]){cursor:pointer}
.d4-s[aria-disabled="true"]{cursor:not-allowed}
.d4-c{font-size:.78rem;color:var(--ink-2);text-align:center;white-space:nowrap}
.d4-drop{animation:d4Drop .42s cubic-bezier(.3,1.4,.5,1) both}
@keyframes d4Drop{from{transform:translateY(-48px);opacity:.2}to{transform:none;opacity:1}}
.d4-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;min-width:max-content}
.d4-lcol{border:1.5px solid var(--rule);border-radius:9px;padding:8px 10px;background:var(--sheet)}
.d4-lh{margin:0 0 6px;font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:6px}
.d4-lul{list-style:none;margin:0;padding:0 0 0 10px;border-left:2px solid var(--rule)}
.d4-lul li{position:relative;margin:3px 0;padding-left:8px;min-height:26px;display:flex;align-items:center}
.d4-lul li::before{content:"";position:absolute;left:-10px;top:50%;width:12px;border-top:2px solid var(--rule)}
.d4-lul li.d4-sub{margin-top:10px}
.d4-lul li.on{animation:d4In .3s ease-out}
@keyframes d4In{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.d4-mini{display:inline-flex;gap:3px}
.d4-m{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:24px;padding:0 2px;border:1.5px solid var(--ink);border-radius:5px;background:var(--sheet)}
.d4-m .d4-L{font-size:.9rem}
.d4-m .d4-ic{width:14px;height:14px}
.d4-m .d4-l{font-size:.62rem}
.d4-q{color:var(--ink-2);font-weight:700}
.fac-lbox{overflow-x:auto;max-height:470px;overflow-y:auto;padding:2px}
.fac-too{margin:6px 0;padding:12px 14px;border:1.5px dashed var(--rule);border-radius:9px}

/* growth bars (log scale) */
.fac-gbox{overflow-x:auto;padding:4px 0 2px}
.fac-gch{position:relative;min-width:500px;padding-left:40px}
.fac-gl{position:absolute;left:40px;right:0;border-top:1px solid var(--plot-grid)}
.fac-gy{position:absolute;left:0;width:36px;text-align:right;font-size:.72rem;color:var(--ink-2);line-height:1}
.fac-gcols{position:absolute;left:44px;right:2px;top:0;bottom:0;display:flex;gap:3px}
.fac-gc{position:relative;flex:1 1 0;min-width:24px;height:100%;padding:0;border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--ink);cursor:pointer}
.fac-gc.cmp{cursor:default}
.fac-gc:hover .fac-gf{filter:brightness(1.08)}
.fac-gc.mk{background:var(--hi-soft)}
.fac-gf{position:absolute;left:3px;right:3px;background:var(--pen);border-radius:3px 3px 0 0}
.fac-gf.cmp{background:var(--f3)}
.fac-gc.cur .fac-gf{outline:2.5px solid var(--ink);outline-offset:1px}
.fac-gv{position:absolute;left:50%;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;font-size:11px;line-height:1;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums}
.fac-gv.in{color:var(--sheet)}
.fac-gq{position:absolute;left:50%;transform:translateX(-50%);color:var(--ink-2);font-weight:700}
.fac-gx{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:400 .85rem var(--font-math);line-height:1.1}
.fac-gx sup{font-size:.7em}
.fac-gm{position:absolute;left:0;right:0;bottom:-15px;text-align:center;font-size:.8rem;font-weight:700;color:var(--ink)}
.fac-gc.mk .fac-gx{font-weight:700}
.fac-gtag{position:absolute;left:50%;transform:translateX(-50%);padding:1px 5px;border-radius:5px;background:var(--hi);color:var(--hi-ink);font-size:.78rem;font-weight:700;white-space:nowrap}
.fac-gch{margin-bottom:14px}

/* pattern-down ladder */
.fac-lad{list-style:none;margin:4px 0;padding:0;max-width:440px}
.fac-rung{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:8px 14px;border:2px solid var(--rule);border-radius:9px;background:var(--sheet);font:400 1.3rem var(--font-math);transition:background .35s,border-color .35s}
.fac-rung.fut{color:var(--ink-2);border-style:dashed}
.fac-rung.cur{border-color:var(--ink);background:var(--hi-soft)}
.fac-rung.arr{animation:facArr .55s ease-out}
@keyframes facArr{from{transform:translateY(-14px);opacity:.4}to{transform:none;opacity:1}}
.fac-rl{min-width:2.2em}
.fac-rv{font-weight:700}
.fac-rn{flex-basis:100%;font:400 .85rem var(--font-ui);color:var(--ink-2)}
.fac-step{margin:2px 0 2px 28px;padding:2px 0 2px 14px;border-left:2px solid var(--rule);font:400 .98rem var(--font-math);color:var(--ink-2);min-height:1.5em}
.fac-step.on{color:var(--ink);border-left-color:var(--ink)}

/* ---------- Part 3: factor tiles ---------- */
.fac-station[hidden]{display:none}
.fac-fb{margin:14px 0 22px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.fac-fb:last-of-type{border-bottom:0}
.fac-ft-h{margin:0 0 8px;font-weight:700}
.fac-ft-h .m{font-size:1.15em}
.fac-fwrap{overflow-x:auto;padding:4px 2px 6px}
.fac-frac{display:inline-flex;flex-direction:column;align-items:flex-end;min-width:max-content}
.fac-frow{display:flex;justify-content:flex-end;gap:4px;align-items:center}
.fac-fbar{align-self:stretch;border-top:2.5px solid var(--ink);margin:6px 0}
.fac-ft{position:relative;min-width:32px;height:36px;padding:0 6px;border:2px solid var(--ink);border-radius:7px;background:var(--sheet);color:var(--ink);font:400 1.1rem var(--font-math);white-space:nowrap}
button.fac-ft{cursor:pointer}
span.fac-ft{display:inline-flex;align-items:center;justify-content:center}
.fac-ft .m{font-size:1em}
.fac-ft.x{color:var(--ink-2);border-color:var(--rule)}
.fac-ft.x::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:9px;margin-top:-4.5px;background:var(--hi-soft);border-top:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);opacity:.85;pointer-events:none}
.fac-fsep{font:400 1.2rem var(--font-math);padding:0 2px}
.fac-fnote{margin:6px 0 0;font-size:.92rem;color:var(--ink-2)}
.fac-res{margin:8px 0 4px;font-size:1.05rem;min-height:1.4em}
.fac-res .m{font-size:1.12em}
.fac-lad3{margin-top:10px}
.fac-ladr{display:flex;flex-wrap:wrap;gap:8px}
.fac-lr{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;min-height:44px;border:1.5px solid var(--rule);border-radius:9px;background:var(--sheet);color:var(--ink)}
.fac-lr .m{font-size:1.05rem}
.fac-lr.good{border-color:var(--green);background:var(--good-bg);box-shadow:0 0 0 3px var(--hi-soft)}
.fac-lr.bad{border-color:var(--red);background:var(--bad-bg)}
.fac-lr.dots{justify-content:center;border-style:dashed;color:var(--ink-2)}
#fac-s4n,#fac-s4d{margin:4px 0}

/* ---------- task ---------- */
.fac-conds{margin:8px 0 12px;padding-left:1.4em}
.fac-conds li{margin:3px 0}
.fac-tin{display:grid;gap:8px;margin:6px 0 12px}
.fac-trow{display:flex;align-items:center;gap:8px}
.fac-tlab{min-width:1.6em;font-size:1.2rem}
.fac-tb{min-width:40px;min-height:40px;font-size:1.2rem}
.fac-tout{min-width:2.2em;text-align:center;font:400 1.35rem var(--font-math)}
.fac-tpv{padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.fac-tstrip{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.fac-tc{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:30px;padding:0 4px;border:1.5px solid var(--ink);border-radius:6px;font:400 1rem var(--font-math)}
.fac-tc.x{color:var(--ink-2);border-color:var(--rule)}
.fac-tc.x::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:7px;margin-top:-3.5px;background:var(--hi-soft);border-top:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);pointer-events:none}
.fac-tprod{margin:0;font-size:1.1rem}
.fac-tprod .m{font-size:1.15em}

@media (max-width:560px){
  .fac-ht{width:44px;height:44px;font-size:1.3rem}
  .fac-hs{width:50px;height:50px}
  .fac-h-pool,.fac-h-slots{gap:8px}
  .d4-t{width:46px;height:46px}
  .d4-sw{width:54px}
  .d4-s{width:52px;height:52px}
  .d4-slots{gap:8px}
  .fac-ft{min-width:28px;height:34px;padding:0 4px;font-size:1rem}
  .fac-prod{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){
  .fac-ht.drop,.fac-ht.shuf,.d4-drop,.d4-lul li.on,.fac-rung.arr{animation:none}
  .fac-ht,.fac-hs,.fac-rung,.fac-hsw small{transition:none}
}

<script>window.MV_PAYLOAD={"meta":{"id":"06-factorial-notation","nn":"06","slug":"factorial-notation","course":"mdm4u","site":"mdm4u","code":"MDM4U","kind":"topic","groupLabel":"Unit 2","groupName":"Permutations and Combinations","trivium":"","size":"S","storageKey":"mdm4u-06-factorial-notation-v1","progressKey":"mdm4u-progress-v1:06-factorial-notation","toolkit":"1.0.6"},"course":{"course":"mdm4u","site":"mdm4u","code":"MDM4U","title":"Mathematics of Data Management","modules":[{"nn":"01","slug":"sample-spaces","title":"Sample Spaces & Counting Outcomes","kind":"topic","group":"1"},{"nn":"02","slug":"fundamental-counting-principle","title":"The Fundamental Counting Principle","kind":"topic","group":"1"},{"nn":"03","slug":"mutually-exclusive","title":"Mutually Exclusive Events & the Additive Principle","kind":"topic","group":"1"},{"nn":"04","slug":"venn-diagrams","title":"Venn Diagrams & Set Operations","kind":"topic","group":"1"},{"nn":"05","slug":"independent-dependent","title":"Independent vs Dependent Events","kind":"topic","group":"1"},{"nn":"06","slug":"factorial-notation","title":"Factorial Notation","kind":"topic","group":"2"},{"nn":"07","slug":"permutations-distinct","title":"Permutations of Distinct Objects","kind":"topic","group":"2"},{"nn":"08","slug":"permutations-identical","title":"Permutations with Identical Objects","kind":"topic","group":"2"},{"nn":"09","slug":"permutations-restrictions","title":"Permutations with Restrictions","kind":"topic","group":"2"},{"nn":"10","slug":"circular-permutations","title":"Circular Permutations","kind":"topic","group":"2"},{"nn":"11","slug":"combinations","title":"Combinations: Counting Without Order","kind":"topic","group":"2"},{"nn":"12","slug":"combination-identities","title":"Combination Identities","kind":"topic","group":"2"},{"nn":"13","slug":"pascals-triangle","title":"Pascal's Triangle & Patterns","kind":"topic","group":"2"},{"nn":"14","slug":"binomial-theorem","title":"The Binomial Theorem","kind":"topic","group":"2"},{"nn":"15","slug":"combinations-probability","title":"Combinations & Probability","kind":"topic","group":"2"},{"nn":"16","slug":"theoretical-empirical","title":"Theoretical & Empirical Probability","kind":"topic","group":"3"},{"nn":"17","slug":"conditional-probability","title":"Conditional Probability","kind":"topic","group":"3"},{"nn":"18","slug":"discrete-random-variables","title":"Discrete Random Variables & Probability Distributions","kind":"topic","group":"3"},{"nn":"19","slug":"expected-value","title":"Expected Value","kind":"topic","group":"3"},{"nn":"20","slug":"variance-discrete","title":"Variance & Standard Deviation of Discrete Random Variables","kind":"topic","group":"3"},{"nn":"21","slug":"binomial-distribution","title":"The Binomial Distribution","kind":"topic","group":"3"},{"nn":"22","slug":"geometric-distribution","title":"The Geometric Distribution","kind":"topic","group":"3"},{"nn":"23","slug":"hypergeometric-distribution","title":"The Hypergeometric Distribution","kind":"topic","group":"3"},{"nn":"24","slug":"choosing-distribution","title":"Choosing the Right Distribution","kind":"topic","group":"3"},{"nn":"25","slug":"continuous-density","title":"Continuous Random Variables & Density","kind":"topic","group":"4"},{"nn":"26","slug":"normal-properties","title":"Properties of the Normal Distribution","kind":"topic","group":"4"},{"nn":"27","slug":"z-scores","title":"Standardizing & z-Scores","kind":"topic","group":"4"},{"nn":"28","slug":"normal-approximation","title":"Normal Approximation to the Binomial","kind":"topic","group":"4"},{"nn":"29","slug":"sampling-methods","title":"Population, Sample & Sampling Methods","kind":"topic","group":"5"},{"nn":"30","slug":"bias","title":"Sources of Bias in Surveys","kind":"topic","group":"5"},{"nn":"31","slug":"central-tendency","title":"Measures of Central Tendency","kind":"topic","group":"5"},{"nn":"32","slug":"spread","title":"Measures of Spread","kind":"topic","group":"5"},{"nn":"33","slug":"histograms","title":"Frequency Distributions & Histograms","kind":"topic","group":"5"},{"nn":"34","slug":"scatter-plots","title":"Scatter Plots & Correlation","kind":"topic","group":"6"},{"nn":"35","slug":"pearson-r","title":"The Pearson Correlation Coefficient r","kind":"topic","group":"6"},{"nn":"36","slug":"linear-regression","title":"Linear Regression & Line of Best Fit","kind":"topic","group":"6"},{"nn":"37","slug":"residuals","title":"Residuals & Goodness of Fit","kind":"topic","group":"6"},{"nn":"38","slug":"causation","title":"Two-Variable Analysis & Causation","kind":"topic","group":"6"},{"nn":"39","slug":"culminating-investigation","title":"Culminating Data-Management Investigation","kind":"topic","group":"7"}]},"salt":"1853e17c","content":{"id":"06-factorial-notation","kind":"topic","title":"Factorial notation","topic":"Factorial Notation","readyTopic":"factorial notation","hero":{"eq":"\u003cspan class=\"fac-heq\">`n! = n × (n - 1) × (n - 2) × ⋯ × 2 × 1`\u003c/span>","eqLabel":"n factorial equals n times n minus 1 times n minus 2, and so on, down to 2 times 1","eqSize":"sm","headline":"One symbol counts every line-up","text":"How many ways can 4 friends line up for a photo? 4 choices for the first spot, then 3, then 2, then 1. That product is written \u003cstrong>4!\u003c/strong> (“four factorial”). \u003cstrong>Factorial notation\u003c/strong> turns a long product into one symbol, and it \u003cstrong>cancels\u003c/strong> neatly when you divide one factorial by another.","fig":{"html":"\u003cdiv class=\"fac-h\" role=\"img\" aria-label=\"Four tiles, A, B, C and D, sit above four empty slots. The first slot glows with 4 choices and A drops in. The second slot glows with 3 choices and C drops in, then the third with 2 choices and the fourth with 1 choice. The product builds under the slots: 4 × 3 × 2 × 1 = 24 = 4!. Then the tiles shuffle through every different order while a counter ticks up to 24 line-ups.\">\u003cdiv class=\"fac-h-pool\" id=\"fac-h-pool\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"fac-h-slots\" id=\"fac-h-slots\" aria-hidden=\"true\">\u003c/div>\u003cp class=\"fac-h-prod\" id=\"fac-h-prod\" aria-hidden=\"true\">\u003c/p>\u003cp class=\"fac-h-ctr\" id=\"fac-h-ctr\" aria-hidden=\"true\">\u003c/p>\u003c/div>"}},"goals":["I can evaluate `n!` and explain it as the number of ways to arrange `n` different objects in a line.","I can explain why `0! = 1`.","I can simplify factorial expressions such as `12!/10!` or `(n + 2)!/n!` by cancelling.","I can write a product of consecutive whole numbers, like 9 × 8 × 7, as a ratio of factorials.","I can solve simple equations that involve factorials, such as `n!/(n - 2)! = 30`."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Fundamental counting principle","goal":1,"prompt":"A food truck offers 3 breads, 4 fillings and 2 sauces. How many different sandwiches use one of each?","options":[{"t":"6","why":"All three stages count.","_n":"06e8","_k":"3584fabb"},{"t":"9","why":"Each bread can go with each filling, so multiply.","_n":"16f8","_k":"63f72815"},{"t":"12","why":"Don’t forget the 2 sauces.","_n":"2708","_k":"53a6e99f"},{"t":"24","why":"3 × 4 × 2 = 24.","_n":"3698","_k":"7b7cc9cb"}],"hints":["Is it one stage \u003cem>and then\u003c/em> another?","Multiply the number of choices at each stage.","3 × 4 × 2 = 24."]},{"id":"w2","skill":"Fundamental counting principle","goal":1,"prompt":"In how many ways can 3 runners finish first, second and third (no ties)?","options":[{"t":"3","why":"Each runner could be first.","_n":"46a8","_k":"c01c7163"},{"t":"6","why":"3 × 2 × 1 = 6.","_n":"56b8","_k":"b8d48f52"},{"t":"9","why":"Once someone is first, only 2 are left for second.","_n":"66c8","_k":"a307c943"},{"t":"27","why":"A runner can’t finish twice.","_n":"7758","_k":"4a9e4f8f"}],"hints":["How many could finish first?","Then how many are left for second?","3 × 2 × 1 = 6."]},{"id":"w3","skill":"Products of consecutive numbers","goal":3,"prompt":"Evaluate 6 × 5 × 4.","options":[{"t":"15","why":"× means multiply.","_n":"8768","_k":"bf6c1347"},{"t":"30","why":"There are three factors.","_n":"9979","_k":"05b7443a"},{"t":"120","why":"6 × 5 = 30, and 30 × 4 = 120.","_n":"a969","_k":"a6d5717c"},{"t":"720","why":"The product stops at 4.","_n":"b959","_k":"6e2dd7bf"}],"hints":["Multiply left to right.","6 × 5 = 30.","30 × 4 = 120."]},{"id":"w4","skill":"Products of consecutive numbers","goal":4,"prompt":"Which product equals (8 × 7 × 6 × 5 × 4 × 3 × 2 × 1) ÷ (4 × 3 × 2 × 1)?","options":[{"t":"4 × 3 × 2 × 1","why":"That’s the part that cancels.","_n":"c949","_k":"a64e74e3"},{"t":"8 × 7 × 6 × 5 × 4","why":"4 is in the denominator, so it cancels too.","_n":"d939","_k":"a44202cb"},{"t":"8 × 7 × 6 × 5","why":"The 4 × 3 × 2 × 1 cancels.","_n":"e929","_k":"a4c03e14"},{"t":"2 × 1","why":"Cancel matching factors; don’t divide the numbers.","_n":"f919","_k":"93d77327"}],"hints":["Which factors appear on top and bottom?","4 × 3 × 2 × 1 is on both.","8 × 7 × 6 × 5."]},{"id":"w5","skill":"Cancelling and solving","goal":3,"prompt":"Simplify (9 × 8 × 7 × 6) ÷ (7 × 6).","options":[{"t":"1.5","why":"Cancel the matching factors 7 and 6.","_n":"g909","_k":"2f2dddd3"},{"t":"17","why":"9 × 8, not 9 + 8.","_n":"h8f9","_k":"5cc8840d"},{"t":"72","why":"7 × 6 cancels, leaving 9 × 8.","_n":"i8e9","_k":"2d07cf38"},{"t":"504","why":"7 is on the bottom too.","_n":"jfd9","_k":"914cb6fb"}],"hints":["Cross out factors that appear above and below.","7 and 6 cancel.","9 × 8 = 72."]},{"id":"w6","skill":"Cancelling and solving","goal":5,"prompt":"Find the positive whole number `n` with `n(n - 1) = 20`.","options":[{"t":"4","why":"4 × 3 = 12.","_n":"kfe9","_k":"88e17837"},{"t":"5","why":"5 × 4 = 20.","_n":"lfb9","_k":"bbee2060"},{"t":"10","why":"10 × 9 = 90.","_n":"mfc9","_k":"faa91d47"},{"t":"20","why":"20 × 19 is far bigger.","_n":"n019","_k":"d95dd668"}],"hints":["Look for two consecutive numbers that multiply to 20.","4 × 5.","`n = 5` (or solve `n^2 - n - 20 = 0`)."]}],"refreshers":{"Fundamental counting principle":"If one choice can be made in `a` ways and then another in `b` ways, together there are `a × b` ways. In a line-up the choices shrink by one each time: 4 × 3 × 2 × 1.","Products of consecutive numbers":"Multiply in order; a product like 8 × 7 × 6 × 5 has exactly four factors.","Cancelling and solving":"In a fraction, a factor that appears above and below cancels to 1. To solve `n(n - 1) = 20`, look for consecutive numbers whose product is 20, or factor `n^2 - n - 20 = 0` and keep the positive root."}}},"explore":{"heading":"Line-up builder","intro":"Arrange objects in a line and watch the count build. Then explore how fast factorials grow and why `0! = 1`.","predIntro":"Make a prediction first. Then the line-up builder will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"list","n":4},"prompt":"How many different line-ups of 4 friends for a photo?","options":[{"t":"10","_n":"o029","_k":"f199e0a6"},{"t":"12","_n":"pff9","_k":"b1c668e3"},{"t":"16","_n":"q009","_k":"02eebb42"},{"t":"24","_n":"r059","_k":"ad7dded3"}],"explain":"4 × 3 × 2 × 1 = 24. 16 would be 4 × 4, reusing people; 10 is 4 + 3 + 2 + 1."},{"id":"p2","start":{"mode":"growth","n":5},"prompt":"Adding a 6th person changes 120 line-ups into…","options":[{"t":"240 (×2)","_n":"s069","_k":"941c989e"},{"t":"720 (×6)","_n":"t039","_k":"9c2adf83"},{"t":"600 (×5)","_n":"u029","_k":"5c156438"},{"t":"126 (+6)","_n":"v059","_k":"047de9b4"}],"explain":"`6! = 6 × 5!`: the new person can go in any of 6 places in each old line-up."},{"id":"p3","start":{"mode":"down"},"prompt":"In Pattern down, “Divide by `n`” steps from `5! = 120` down to `1! = 1`. One more step. What is `0!`?","options":[{"t":"`-1`","_n":"w049","_k":"0f2ba79c"},{"t":"1","_n":"xff9","_k":"fa7d3388"},{"t":"undefined","_n":"yfe9","_k":"79822501"},{"t":"0","_n":"z019","_k":"3951bc6c"}],"explain":"`1! = 1 × 0!`, so `0! = 1`. There’s exactly one way to arrange nothing: the empty line-up."},{"id":"p4","start":{"mode":"growth","n":10,"cmp":true},"prompt":"Which is larger: `10!` or `10^{10}`?","options":[{"t":"They’re equal","_n":"10009","_k":"7468edec"},{"t":"`10^{10}`","_n":"110b9","_k":"40ce7184"},{"t":"You can’t tell without a calculator","_n":"120a9","_k":"f46aa7ef"},{"t":"`10!`","_n":"13f98","_k":"039f3837"}],"explain":"Every factor of `10!` except the 10 itself is less than 10, so `10! \u003c 10^{10}`: 3 628 800 vs 10 000 000 000. Factorials do overtake powers of 10, but only from `n = 25` on."}],"chalIntro":"Set up the line-up builder, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Make the \u003cstrong>Total line-ups\u003c/strong> readout show exactly 720.","why":"`6! = 6 × 5 × 4 × 3 × 2 × 1 = 720`: six objects.","hints":["Which factorial is 720?","`5! = 120`; multiply by the next number.","120 × 6 = 720, so `n = 6`."]},{"id":"tc2","goal":[1,3],"prompt":"With `n = 7` in Build mode, fill slots until “Ways to finish” reads 24.","why":"3 slots filled leaves 4 objects, and `4! = 24` ways to finish.","hints":["Ways to finish = (objects left)!.","Which factorial is 24?","`4! = 24`, so leave 4 slots empty: fill 3."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Growth mode: find every `n` from 0 to 15 for which `n!` ends in \u003cstrong>exactly two\u003c/strong> zeros. Mark each one.","why":"5 and 10 give two factors of 5 (and there are always more 2s), so `10!` to `14!` end in exactly two zeros. 15 adds a third 5.","hints":["A zero at the end comes from a factor 10 = 2 × 5.","There are always more 2s than 5s, so count the factors of 5: 5 and 10 give two.","From `10!` until 15 adds a third 5, there are exactly two: `n` = 10, 11, 12, 13, 14."]}]},"part3":{"slug":"algebra","name":"Algebra","heading":"Factorial algebra","intro":"Each factorial is a strip of factor tiles. Divide one factorial by another and the shared tail cancels. Tap a tile to cancel it with its partner, or press \u003cstrong>Cancel the shared tail\u003c/strong> to strike every matching pair. Visit each station, and open \u003cstrong>Check it with algebra\u003c/strong> to see the same step in symbols.","quickCheck":{"title":"Quick check","summary":"Factorial algebra quick check","items":[{"id":"q1","goal":3,"prompt":"Simplify `{12!}/{10!}`.","choices":[{"t":"1.2","fb":"Cancel `10!`: 12 × 11 = 132.","_n":"14fa8","_k":"05330b44"},{"t":"132","fb":"Right. Cancel `10!`: 12 × 11 = 132.","_n":"15fb8","_k":"b2365ef5"},{"t":"2","fb":"Cancel `10!`: 12 × 11 = 132.","_n":"16fc8","_k":"e9617e64"},{"t":"`2!`","fb":"Cancel `10!`: 12 × 11 = 132.","_n":"17fd8","_k":"c2dbdc86"}]},{"id":"q2","goal":3,"prompt":"Simplify `{(n + 1)!}/{n!}`.","choices":[{"t":"`n + 1`","fb":"Right. `(n + 1)! = (n + 1) × n!`, and `n!` cancels.","_n":"18fe8","_k":"55e6c37f"},{"t":"1","fb":"`(n + 1)! = (n + 1) × n!`, and `n!` cancels.","_n":"19ff8","_k":"2776ce22"},{"t":"`n`","fb":"`(n + 1)! = (n + 1) × n!`, and `n!` cancels.","_n":"1a008","_k":"85e52e6e"},{"t":"`(n + 1)n`","fb":"`(n + 1)! = (n + 1) × n!`, and `n!` cancels.","_n":"1b018","_k":"4b277e04"}]},{"id":"q3","goal":5,"prompt":"Solve `{n!}/{(n - 2)!} = 56`.","choices":[{"t":"−7","fb":"`n(n - 1) = 56 = 8 × 7`, so `n = 8`.","_n":"1c028","_k":"466d96de"},{"t":"7","fb":"`n(n - 1) = 56 = 8 × 7`, so `n = 8`.","_n":"1dff9","_k":"aa6d2588"},{"t":"8","fb":"Right. `n(n - 1) = 56 = 8 × 7`, so `n = 8`.","_n":"1efe9","_k":"f2599f05"},{"t":"56","fb":"`n(n - 1) = 56 = 8 × 7`, so `n = 8`.","_n":"1ffd9","_k":"9b42bca8"}]},{"id":"q4","goal":4,"prompt":"Write 11 × 10 × 9 × 8 as factorials.","choices":[{"t":"`{11!}/{4!}`","fb":"To keep the 8, divide by `7!`.","_n":"1gfc9","_k":"dd684e3e"},{"t":"`{11!}/{7!}`","fb":"Right. Dividing by `7!` leaves 11 down to 8.","_n":"1h039","_k":"813f2f04"},{"t":"`{11!}/{8!}`","fb":"To keep the 8, divide by `7!`.","_n":"1i029","_k":"e13783ef"},{"t":"`{8!}/{11!}`","fb":"To keep the 8, divide by `7!`.","_n":"1j019","_k":"42c79907"}]}]}},"practice":{"activities":[{"id":"evaluate","type":"numeric","title":"Evaluate or simplify","summary":"Evaluate or simplify","goal":[1,2,3],"instruction":"Work out each value without a calculator. Write out the factors and cancel before you multiply.","how":"Type a whole number, then press Check.","items":[{"id":"f1","goal":1,"prompt":"`5!`","_a":"AAoF","why":"5 × 4 × 3 × 2 × 1 = 120.","wrong":[{"match":15,"fb":"That’s 5 + 4 + 3 + 2 + 1."},{"match":20,"fb":"Keep multiplying down to 1."}],"hints":["`5!` multiplies every whole number from 5 down to 1.","5 × 4 = 20, and 20 × 3 = 60.","60 × 2 × 1 = 120."]},{"id":"f2","goal":2,"prompt":"`0! + 1!`","_a":"Aw==","why":"`0! = 1` and `1! = 1`, so 1 + 1 = 2.","wrong":[{"match":1,"fb":"`0!` is 1, not 0."}],"hints":["What is `0!`?","`0! = 1` and `1! = 1`.","1 + 1 = 2."]},{"id":"f3","goal":3,"prompt":"`{7!}/{5!}`","_a":"BQo=","why":"`7! = 7 × 6 × 5!`, so `{7!}/{5!} = 7 × 6 = 42`.","wrong":[{"match":2,"fb":"`{7!}/{5!}` isn’t `(7 - 5)!`. Cancel `5!`: 7 × 6."}],"hints":["Write `7!` as 7 × 6 × `5!`.","The `5!` cancels.","7 × 6 = 42."]},{"id":"f4","goal":3,"prompt":"`{10!}/{8! × 2!}`","_a":"BQ0=","why":"`{10!}/{8!} = 10 × 9 = 90`, and 90 ÷ `2!` = 90 ÷ 2 = 45.","wrong":[{"match":90,"fb":"Don’t forget to divide by `2! = 2`."}],"hints":["Cancel `8!` first.","`{10!}/{8!} = 10 × 9 = 90`, and `2!` is still below.","90 ÷ 2 = 45."]},{"id":"f5","goal":3,"prompt":"`{6! - 5!}/{4!}`","_a":"Aw0=","why":"720 − 120 = 600, and 600 ÷ 24 = 25.","general":"720 − 120 = 600, and 600 ÷ 24 = 25.","hints":["Work out each factorial first.","`6! = 720`, `5! = 120`, `4! = 24`.","600 ÷ 24 = 25."]},{"id":"f6","goal":1,"prompt":"`3! × 4!`","_a":"AAwB","why":"6 × 24 = 144.","wrong":[{"match":5040,"fb":"`3! × 4!` isn’t `7!`: 6 × 24 = 144."}],"hints":["Work out each factorial first.","`3! = 6` and `4! = 24`.","6 × 24 = 144."]},{"id":"f7","goal":3,"prompt":"`{8!}/{4! × 4!}`","_a":"Bgg=","why":"`{8!}/{4!} = 8 × 7 × 6 × 5 = 1680`, and 1680 ÷ 24 = 70.","wrong":[{"match":1,"fb":"`4! × 4! = 576`, not `8!`."}],"hints":["Cancel one `4!` with part of `8!`.","`{8!}/{4!} = 8 × 7 × 6 × 5 = 1680`.","1680 ÷ 24 = 70."]},{"id":"f8","goal":3,"prompt":"`{(n + 2)!}/{n!}` when `n = 5`","_a":"BQo=","why":"`{7!}/{5!} = 7 × 6 = 42`.","wrong":[{"match":7,"fb":"Two factors survive: 7 × 6."}],"hints":["With `n = 5` this is `{7!}/{5!}`.","`(n + 2)! = (n + 2)(n + 1)n!`, so two factors survive.","7 × 6 = 42."]}]},{"id":"puzzles","type":"custom","title":"Factorial puzzles","summary":"Factorial puzzles","star":true,"goal":[3,5],"instruction":"Cancel first, then look for consecutive numbers. The ★ puzzles go beyond the usual questions.","how":"Type a whole number and press Check, or tap a chip.","items":[{"id":"r1","goal":5,"kind":"num","prompt":"Solve `(n + 1)! = 20 × (n - 1)!`.","_a":"BQ==","label":"`n =`","display":"`n = 4`","why":"`(n + 1)n = 20 = 5 × 4`, so `n = 4`.","wrong":[{"match":20,"fb":"Divide both sides by `(n - 1)!`: `(n + 1)n = 20`."}],"hints":["`(n + 1)! = (n + 1)n(n - 1)!`.","So `(n + 1)n = 20`.","5 × 4 = 20: `n = 4`."]},{"id":"r2","goal":5,"kind":"num","prompt":"Solve `{n!}/{(n - 3)!} = 60`.","_a":"BA==","label":"`n =`","display":"`n = 5`","why":"`n(n - 1)(n - 2) = 60 = 5 × 4 × 3`, so `n = 5`.","wrong":[{"match":6,"fb":"`n(n - 1)(n - 2) = 60 = 5 × 4 × 3`."}],"hints":["Cancel `(n - 3)!`: three factors survive.","`n(n - 1)(n - 2) = 60`: look for three consecutive numbers.","5 × 4 × 3 = 60, so `n = 5`."]},{"id":"r3","goal":3,"star":true,"kind":"chips","prompt":"Which is larger: `2 × 5!` or `{6!}/{3}`?","why":"`2 × 5! = 2 × 120 = 240` and `{6!}/{3} = {720}/{3} = 240`.","choices":[{"t":"`2 × 5!`","fb":"Both are 240.","_n":"1k009","_k":"02095edf"},{"t":"`{6!}/{3}`","fb":"Both are 240.","_n":"1l079","_k":"5cbfe757"},{"t":"Equal","fb":"Both are 240.","_n":"1m069","_k":"10d6839c"}],"hints":["Work out each one.","`2 × 5! = 2 × 120`, and `6! = 720`.","Both are 240: they’re equal."]},{"id":"r4","goal":3,"star":true,"kind":"num","prompt":"How many zeros does `25!` end in?","_a":"Bw==","label":"Zeros at the end:","display":"6 zeros","why":"5, 10, 15 and 20 give one factor of 5 each and 25 gives two: 4 + 2 = 6. There are plenty of 2s to pair with them.","wrong":[{"match":5,"fb":"25 = 5 × 5 contributes \u003cstrong>two\u003c/strong> factors of 5."}],"hints":["Count factors of 5 in 1 × 2 × ⋯ × 25.","5, 10, 15, 20 give one each; 25 gives two.","4 + 2 = 6."]},{"id":"r5","goal":3,"star":true,"kind":"chips","prompt":"Simplify `{n! - (n - 1)!}/{(n - 1)!}`.","why":"`n! = n(n - 1)!`, so the top is `(n - 1)!(n - 1)`, and `(n - 1)!` cancels.","choices":[{"t":"1","fb":"Factor out `(n - 1)!`: `{(n - 1)!(n - 1)}/{(n - 1)!}`.","_n":"1n059","_k":"84326f27"},{"t":"`n! - 1`","fb":"Factor out `(n - 1)!`: `{(n - 1)!(n - 1)}/{(n - 1)!}`.","_n":"1o069","_k":"ef913339"},{"t":"`n`","fb":"Factor out `(n - 1)!`: `{(n - 1)!(n - 1)}/{(n - 1)!}`.","_n":"1p039","_k":"3defd88f"},{"t":"`n - 1`","fb":"Factor out `(n - 1)!`: `{(n - 1)!(n - 1)}/{(n - 1)!}`.","_n":"1q049","_k":"e8fc6caa"}],"hints":["Write `n!` as `n × (n - 1)!`.","The top is `n(n - 1)! - (n - 1)! = (n - 1)!(n - 1)`.","`(n - 1)!` cancels, leaving `n - 1`."]},{"id":"r6","goal":3,"star":true,"kind":"num","prompt":"What is the largest `n` with `n! \u003c 1 000 000`?","_a":"CA==","label":"`n =`","display":"`n = 9`","why":"`9! = 362 880` is under a million, but `10! = 3 628 800` is over.","wrong":[{"match":10,"fb":"`10! = 3 628 800` is over a million; `9! = 362 880`."}],"hints":["Build up: each factorial is the one before times the next number.","`8! = 40 320` and `9! = 362 880`.","`10! = 3 628 800` is too big, so `n = 9`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Florence","how":"","goal":[2,3,5],"instruction":"Florence made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Simplify `{10!}/{5!}`.","steps":["`{10!}/{5!} = ({10}/{5})!`","`= 2!`","`= 2`"],"_a":"AQ==","stepFb":["","Step 2 follows step 1. The mistake is earlier.","Step 3 follows step 2."],"fixes":[{"t":"Step 1 is correct.","why":"Check: `{10!}/{5!}` = 3 628 800 ÷ 120 = 30 240, not 2.","_n":"1r019","_k":"a06c505f"},{"t":"`{10!}/{5!} = 10 × 9 × 8 × 7 × 6 = 30 240`, since `5!` cancels.","why":"`10! = 10 × 9 × 8 × 7 × 6 × 5!`, and the `5!` cancels.","_n":"1s029","_k":"56fb179e"},{"t":"`{10!}/{5!} = 5!`.","why":"120 is far too small: `10!` is over 3 million.","_n":"1tff9","_k":"d443db98"},{"t":"`{10!}/{5!} = 2 × 5!`.","why":"Factorials don’t divide like ordinary numbers.","_n":"1u009","_k":"c6f78dfd"}],"hints":["Write `10!` as 10 × 9 × 8 × 7 × 6 × `5!`.","Cancel `5!`.","10 × 9 × 8 × 7 × 6 = 30 240."]},{"id":"e2","goal":5,"task":"Solve `{n!}/{(n - 2)!} = 42`.","steps":["`{n!}/{(n - 2)!} = n(n - 1)`","`n(n - 1) = 42`, so `n^2 - n - 42 = 0`","`(n - 7)(n + 6) = 0`","`n = 7` or `n = -6`, and both answers work."],"_a":"Ag==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"`n = -6` only.","why":"−6 objects can’t be arranged.","_n":"1v0d9","_k":"00bdcb02"},{"t":"`n = 42`.","why":"42 × 41 is far bigger than 42.","_n":"1w0e9","_k":"ec4cbbfa"},{"t":"`n` must be a whole number at least 2, so `n = 7` only.","why":"`n` counts objects, so reject −6. Check: 7 × 6 = 42.","_n":"1x8b9","_k":"b9c32845"},{"t":"Step 4 is correct.","why":"`(-6)!` isn’t defined: factorials need whole numbers.","_n":"1y8a9","_k":"c2a8de04"}],"hints":["Can `n` be negative?","`n` counts objects.","`n = 7`."]},{"id":"e3","goal":2,"task":"Find `0!` using the pattern of factorials.","steps":["`n! = n × (n - 1)!` for any whole number `n >= 1`.","Put `n = 1`: `1! = 1 × 0!`.","`1! = 1`, so `1 = 1 × 0!`.","So `0! = 0`, because there is nothing to multiply."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"`0! = -1`.","why":"1 × (−1) = −1, not 1.","_n":"1z8d9","_k":"ea77617e"},{"t":"Step 4 is correct.","why":"1 × 0 = 0, not 1.","_n":"208c9","_k":"258c51ee"},{"t":"`0!` is undefined.","why":"Step 3 gives a definite value.","_n":"218f9","_k":"2198b8ea"},{"t":"`1 = 1 × 0!` means `0! = 1`. It also fits the count: there’s exactly one way to arrange nothing.","why":"Only 1 × 1 gives 1, so `0! = 1`.","_n":"228e9","_k":"e6e1ecf5"}],"hints":["What number times 1 gives 1?","`1 × 0! = 1`.","`0! = 1`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: how fast factorials grow, `10!` vs `10^{10}`, or `0! = 1`?"},{"id":"j2","q":"In your own words, explain why the number of line-ups of `n` people is `n!`."},{"id":"j3","q":"Explain to a friend how to simplify `{15!}/{12!}` without a calculator."},{"id":"j4","q":"Which factorial step still trips you up (cancelling, `0!`, or solving)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Evaluate `6!`.","options":[{"t":"21","why":"That’s 6 + 5 + 4 + 3 + 2 + 1.","_n":"23919","_k":"16f8fc34"},{"t":"30","why":"Keep multiplying down to 1.","_n":"24909","_k":"a83cc46e"},{"t":"120","why":"That’s `5!`.","_n":"25839","_k":"9edc2317"},{"t":"720","why":"6 × 5 × 4 × 3 × 2 × 1 = 720.","_n":"26829","_k":"f5a860b6"}]},"b":{"prompt":"Evaluate `5!`.","options":[{"t":"15","why":"That’s a sum. `n!` multiplies \u003cstrong>every\u003c/strong> whole number from `n` down to 1.","_n":"2781a","_k":"83bbb74f"},{"t":"20","why":"Keep multiplying down to 1.","_n":"2882a","_k":"0c71be5b"},{"t":"24","why":"That’s `4!`.","_n":"2983a","_k":"6a0a8413"},{"t":"120","why":"5 × 4 × 3 × 2 × 1 = 120.","_n":"2a84a","_k":"7592356f"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"What is the value of `0!`?","options":[{"t":"10","why":"`0!` isn’t a digit pattern.","_n":"2b7da","_k":"c08fb1be"},{"t":"0","why":"1 × 0 would give `1! = 0`.","_n":"2c7ea","_k":"64b689e6"},{"t":"1","why":"`1! = 1 × 0!`, so `0! = 1`.","_n":"2d7fa","_k":"39052dd1"},{"t":"Undefined","why":"The pattern gives a definite val
