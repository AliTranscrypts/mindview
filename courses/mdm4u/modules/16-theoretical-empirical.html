.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}

.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 16: hero, Law of large numbers lab (D6 simulator, spinner editor, many-runs dot plot), Design a simulation stations,
   Odds and evidence ratio boxes, Spinner designer. Spinner colours: R --red, B --ev-a, G --green, Y --hi (letters always shown). */
/* radioGroup (from MDM4U 13) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.42;cursor:not-allowed}

/* colour swatches and letters */
.te-swR{background:var(--red)}.te-swB{background:var(--ev-a)}.te-swG{background:var(--green)}.te-swY{background:var(--hi)}
.rg .mdm-sw,.te-cc .mdm-sw,.sd-in .mdm-sw,.sd-tbl .mdm-sw{margin-right:.35em}

/* hero */
.hero-eq .te-arrow{display:inline-block;margin:0 .25em;font-family:var(--font-math)}
.hero-eq .te-as{font-family:var(--font-math);white-space:nowrap}
.te-hero{display:grid;gap:8px}
.te-hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.te-coin{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;border:2.5px solid var(--ink);background:var(--hi);color:var(--hi-ink);font:700 1.3rem var(--font-math)}
.te-coin.te-flip{animation:te-flip .22s linear infinite}
@keyframes te-flip{50%{transform:scaleX(.12)}}
.te-hcount{font:600 1.05rem var(--font-math);min-width:7.5em}
.te-hero-top .btn{margin-left:auto}

/* Explore layout */
.te-top{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:flex-start;margin-bottom:6px}
.te-cap.eq-cap{font-size:clamp(1.2rem,3vw,1.55rem)}
.te-plab{margin:6px 0 2px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.te-leg{margin:8px 0 6px}
.te-leg i.te-dash{background:repeating-linear-gradient(90deg,var(--ink) 0 7px,transparent 7px 12px)}
.te-run{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 2px}
.te-run .btn{min-width:56px}
.te-run .rg-wrap{margin:0 6px 0 0}
.te-note{margin:4px 0 8px}
.te-lastlab{margin:8px 0 4px}
.te-strip{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.te-o{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border:1.5px solid var(--rule);border-radius:5px;font:600 .9rem var(--font-math);background:var(--sheet);color:var(--ink-2)}
.te-o.hit{border-color:var(--sel-bd);background:var(--hi-soft);color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:2px}
.te-o.te-oR{background:var(--red);color:var(--sheet);border-color:var(--red)}
.te-o.te-oB{background:var(--ev-a);color:var(--sheet);border-color:var(--ev-a)}
.te-o.te-oG{background:var(--green);color:var(--sheet);border-color:var(--green)}
.te-o.te-oY{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.te-o.hit.te-oR,.te-o.hit.te-oB,.te-o.hit.te-oG,.te-o.hit.te-oY{outline:2.5px solid var(--sel-bd);outline-offset:1px}
.te-tally{margin:6px 0 0}
.te-tlab{margin:0 0 4px;font-size:.85rem;font-weight:700}
.te-tbars{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px;align-items:end;height:120px;border-bottom:1.5px solid var(--plot-axis)}
.te-tcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.te-tb{display:block;width:100%;max-width:26px;background:var(--ev-a-soft);border:1.5px solid var(--pen);border-bottom:0;border-radius:3px 3px 0 0}
.te-tcol.ev .te-tb{background:var(--pen)}
.te-tn{font:600 .68rem var(--font-ui);color:var(--ink-2);margin-bottom:2px}
.te-ts{font:700 .8rem var(--font-math);margin-top:3px;position:relative;top:18px;height:0}
.te-tally{padding-bottom:20px}
.te-tcol.ev .te-ts{text-decoration:underline}

/* controls */
.te-seedrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin:0 0 8px}
.te-seedrow .rg-wrap{margin:0}
.te-check{display:inline-flex;align-items:center;gap:8px;font-weight:700;min-height:34px}
.te-check input{width:20px;height:20px;accent-color:var(--pen)}
.te-secnote{margin:-6px 0 8px}
.te-counts{margin:8px 0 0;font-size:.92rem;line-height:1.7}
.te-cc{white-space:nowrap;margin-right:.6em}

/* spinner */
.te-svg{display:block;width:100%;height:auto}
.te-fR{fill:var(--red)}.te-fB{fill:var(--ev-a)}.te-fG{fill:var(--green)}.te-fY{fill:var(--hi)}
.te-svg path[class^="te-f"]{stroke:var(--sheet);stroke-width:1.6}
.te-svg text{font-family:var(--font-ui);font-weight:800;text-anchor:middle;dominant-baseline:central}
.te-tR,.te-tB,.te-tG{fill:var(--sheet)}.te-tY{fill:var(--hi-ink)}
.te-hid{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.5}
.te-qm{fill:var(--ink-2);font-size:72px}
.te-rim{fill:none;stroke:var(--ink);stroke-width:2}
.te-needle{transform-box:view-box;transform-origin:100px 100px;transition:transform .7s cubic-bezier(.2,.8,.25,1)}
.te-needle line{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.te-needle line.te-nh{stroke:var(--sheet);stroke-width:8}
.te-needle path{fill:var(--ink);stroke:var(--sheet);stroke-width:2;paint-order:stroke}
.te-hub{fill:var(--ink);stroke:var(--sheet);stroke-width:2}
@media (prefers-reduced-motion:reduce){.te-needle{transition:none}.te-coin.te-flip{animation:none}}
.te-ed{position:relative;width:min(100%,280px);margin:6px auto 0}
.te-sec{position:absolute;transform:translate(-50%,-50%);width:var(--bs,30px);height:var(--bs,30px);min-width:0;padding:0;border-radius:50%;border:2px solid var(--sheet);font:800 .82rem/1 var(--font-ui);box-shadow:0 0 0 1px var(--ink-2);cursor:pointer}
.te-n15 .te-sec{--bs:28px}.te-n18 .te-sec{--bs:25px;font-size:.74rem}
.te-sec.te-bR{background:var(--red);color:var(--sheet)}.te-sec.te-bB{background:var(--ev-a);color:var(--sheet)}
.te-sec.te-bG{background:var(--green);color:var(--sheet)}.te-sec.te-bY{background:var(--hi);color:var(--hi-ink)}
.te-sec:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.te-sec:hover{box-shadow:0 0 0 2px var(--ink)}
.te-myed{width:min(100%,200px);margin:6px auto 8px}
.te-estrow{display:grid;gap:4px;margin:6px 0}
.te-estrow label{font-weight:700}
.te-estrow .numin{max-width:9em}
.te-myinfo{margin:6px 0 0;font-size:.92rem}

/* readout: phones show 4 rows, "More" shows the rest */
.te-more{display:none;margin-top:6px}
@media (max-width:820px){
  .te-read:not(.te-open) .te-xr{display:none}
  .te-more{display:inline-flex}
}

/* steppers (from MDM4U 13's task) */
.te-stp{display:flex;align-items:center;gap:8px;margin:0 0 6px;flex-wrap:wrap}
.te-stl{min-width:8.2em;font-weight:700}
.te-stb{min-width:42px;min-height:38px}
.te-sto{min-width:1.6em;text-align:center;font:700 1.3rem var(--font-math)}

/* Part 3: Design a simulation */
.sm-tabs .rg-wrap{margin-bottom:12px}
.sm-tick{color:var(--green);font-weight:800}
.sm-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;border-bottom:1.5px solid var(--rule);padding-bottom:6px;margin-bottom:8px}
.sm-num{font:700 .78rem var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.sm-name{font-weight:800;font-size:1.1rem}
.sm-task{font-weight:600}
.sm-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0 10px}
.sm-dev{display:grid;gap:6px;text-align:left;border:2px solid var(--rule);border-radius:10px;background:var(--sheet);color:var(--ink);padding:12px 14px;min-height:64px;font-size:.98rem;cursor:pointer}
.sm-dev:hover:not(:disabled){border-color:var(--ink)}
.sm-dev[aria-pressed="true"]{border-color:var(--ink)}
.sm-dev.sm-yes{border-color:var(--green);background:var(--good-bg)}
.sm-dev.sm-no{border-style:dashed;background:var(--bad-bg)}
.sm-dev:disabled{cursor:default;opacity:1}
.sm-p{font-weight:700;font-size:.9rem}
.sm-runrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.sm-lab{margin:6px 0 4px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.sm-digs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;max-width:520px}
.sm-dg{display:flex;align-items:center;justify-content:center;gap:3px;border:1.5px solid var(--rule);border-radius:5px;padding:3px 0;font:600 .95rem var(--font-math);color:var(--ink-2)}
.sm-dg small{font:700 .72rem var(--font-ui)}
.sm-dg.sm-ok{border-color:var(--pen);background:var(--ev-a-soft);color:var(--ink)}
.sm-res{margin:6px 0 10px}
.sm-tbl{border-collapse:collapse;font-size:.92rem;min-width:300px}
.sm-tbl th,.sm-tbl td{border-bottom:1px solid var(--rule);padding:5px 10px;text-align:left}
.sm-tbl thead th{font-size:.8rem;color:var(--ink-2)}
.sm-s3in{margin:4px 0 8px}
.sm-dev3{margin:-2px 0 10px}
.sm-done{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--good-bg)}

/* Odds and evidence: ratio boxes */
.od-ratio{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.od-ratio .numin.od-rin{width:5.5em;min-width:0}
.od-colon{font:700 1.3rem var(--font-math)}
.od-rl{font-weight:700}

/* Spinner designer */
.sd-in .te-stl{min-width:6.6em}
.sd-tot{font-weight:700;margin:8px 0 0;color:var(--ink-2)}
.sd-tot.sd-ok{color:var(--green)}
.sd-spin{width:min(100%,240px);margin:0 auto 10px}
.sd-tbl{border-collapse:collapse;font-size:.9rem;min-width:360px}
.sd-tbl th,.sd-tbl td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:left}
.sd-tbl thead th{font-size:.78rem;color:var(--ink-2)}
.hero .hero-eq .te-heq{display:grid;gap:.18em;font:400 clamp(1.25rem,3.4vw,2rem)/1.25 var(--font-math)}
.te-hl{display:block}
@media (max-width:560px){
  .te-runs{flex-wrap:nowrap;gap:4px}
  .te-runs .btn{min-width:0;flex:1 1 auto;padding-left:.45em;padding-right:.45em}
}

</style>

-coin\">H\u003c/span>\u003cspan class=\"te-hcount\" id=\"te-hcount\">Trials: 0\u003c/span>\u003cbutton type=\"button\" class=\"btn ghost sm\" id=\"te-hreplay\">Replay\u003c/button>\u003c/div>\u003ccanvas class=\"plot\" id=\"te-hplot\" role=\"img\" aria-label=\"A coin is flipped 1000 times. The relative frequency of heads starts jagged and smooths as the trials climb from 10 to 100 to 1000, settling inside a thin band around the dashed line at 0.5.\">\u003c/canvas>\u003c/div>"}},"goals":["I can tell theoretical, empirical and subjective probabilities apart and explain where each comes from.","I can calculate theoretical probabilities, including complements, for outcomes that are or aren’t equally likely.","I can calculate empirical probabilities from data and use them to predict counts.","I can convert between probabilities and odds in favour or against.","I can design a simulation whose random device matches a real situation’s probabilities.","I can explain the law of large numbers and judge whether a gap between empirical and theoretical results is reasonable."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Theoretical probability","goal":2,"prompt":"A bag has 3 red, 5 blue and 2 green marbles. One is drawn at random. What is \u003ci>P\u003c/i>(blue)?","options":[{"t":"`1/3`","why":"There are 3 colours, but not equal numbers of each.","_n":"0af6","_k":"dce00707"},{"t":"`1/2`","why":"5 blue out of 10 marbles.","_n":"1b06","_k":"77f13f2e"},{"t":"1","why":"That’s odds of 5 : 5, so \u003ci>P\u003c/i> = `5/10`.","_n":"2b16","_k":"ce7ee53f"},{"t":"`5/3`","why":"A probability can’t be more than 1.","_n":"3aa6","_k":"63f4f95b"}],"hints":["How many marbles in total?","10 marbles, 5 blue.","`5/10 = 1/2`."]},{"id":"w2","skill":"Theoretical probability","goal":2,"prompt":"Two dice are rolled. What is \u003ci>P\u003c/i>(sum = 7)?","options":[{"t":"`1/12`","why":"(6, 1) is a different outcome from (1, 6).","_n":"4ab6","_k":"c95a0267"},{"t":"`1/11`","why":"Sums aren’t equally likely; count the 36 outcomes.","_n":"5ac6","_k":"7c34d60b"},{"t":"`1/6`","why":"6 of the 36 equally likely outcomes give 7.","_n":"6ad6","_k":"ccb6c27c"},{"t":"`7/36`","why":"Count the pairs that make 7.","_n":"7b66","_k":"dfc3df41"}],"hints":["List the outcome grid: 6 × 6.","(1, 6), (2, 5), (3, 4), (4, 3), (5, 2), (6, 1).","`6/36 = 1/6`."]},{"id":"w3","skill":"Complements","goal":2,"prompt":"\u003ci>P\u003c/i>(rain tomorrow) = 0.35. What is \u003ci>P\u003c/i>(no rain)?","options":[{"t":"0.35","why":"No rain is the complement.","_n":"8b76","_k":"395f825b"},{"t":"0.65","why":"1 − 0.35.","_n":"94b6","_k":"ea9fdd5a"},{"t":"1.35","why":"Subtract from 1.","_n":"a4a6","_k":"caa82ffa"},{"t":"2.86","why":"Probabilities can’t exceed 1.","_n":"b496","_k":"6731281d"}],"hints":["Rain and no rain together are certain.","\u003ci>P\u003c/i>(\u003ci>A\u003c/i>) + \u003ci>P\u003c/i>(\u003ci>A\u003c/i>′) = 1.","0.65."]},{"id":"w4","skill":"Counting outcomes","goal":2,"prompt":"A coin is flipped and a die is rolled. How many outcomes are in the sample space?","options":[{"t":"6","why":"Heads-3 and tails-3 are different outcomes.","_n":"c486","_k":"a00062dd"},{"t":"8","why":"Each coin result pairs with each die result: multiply.","_n":"d476","_k":"44cad65d"},{"t":"12","why":"2 × 6.","_n":"e466","_k":"12509842"},{"t":"36","why":"There’s one die and one coin.","_n":"f456","_k":"0dc9a7f5"}],"hints":["Fundamental counting principle.","2 choices, then 6.","12."]},{"id":"w5","skill":"Comparing values","goal":3,"prompt":"Which is largest: 0.4, `3/8`, 41%, `2/5`?","options":[{"t":"41%","why":"0.41 beats 0.400, 0.375 and 0.400.","_n":"g446","_k":"fe244e52"},{"t":"`2/5`","why":"`2/5` = 0.40.","_n":"h436","_k":"9f8065b5"},{"t":"`3/8`","why":"`3/8` = 0.375.","_n":"i426","_k":"92ed6c4d"},{"t":"0.4","why":"0.4 = 0.40 \u003c 0.41.","_n":"j316","_k":"041625d8"}],"hints":["Write each as a decimal.","0.40, 0.375, 0.41, 0.40.","41%."]},{"id":"w6","skill":"Combinations and probability","goal":2,"promp 3` of 12 is 4 red sectors and `1/4` of 12 is 3 blue sectors, so the other 5 are yellow. The 15- and 18-sector spinners are now unlocked.","hints":["Each sector is `1/12`.","`1/3 = 4/12` and `1/4 = 3/12`.","Red 4, blue 3, yellow 5."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Choose the number of sectors (12, 15 or 18) and colour the spinner so that the \u003cstrong>odds in favour of yellow are 1 : 5\u003c/strong> and red is \u003cstrong>twice as likely as blue\u003c/strong>. Use only red, blue and yellow.","why":"Yellow 3 of 18 = `1/6`, odds 1 : 5; blue `5/18`; red `10/18`. Only 18 sectors work: with 12 sectors, yellow is 2 and red + blue = 10 can’t split 2 : 1; with 15 sectors, `1/6` of 15 isn’t whole.","hints":["Odds 1 : 5 in favour means \u003ci>P\u003c/i>(yellow) = 1 ÷ (1 + 5).","`1/6` of 18 sectors is 3, which leaves 15 for red and blue.","Red = 2 × blue and red + blue = 15: blue 5, red 10."]}]},"part3":{"slug":"simulation","name":"Simulation","heading":"Design a simulation","intro":"A simulation models a real situation with a random device. Choose a device whose probabilities match the situation, run it, then check the estimate against the exact value.","stations":[{"id":"s1","name":"Match the device","task":"A goalie saves 75% of shots. Pick the random device that models one shot.","cards":[{"id":"c1","t":"Two random digits 00–99; 00–74 = save","p":"0.75","fb":"00–74 is 75 of the 100 two-digit numbers, so \u003ci>P\u003c/i>(save) = 0.75, just like the goalie.","_n":"14ae5","_k":"ff74f201"},{"id":"c2","t":"A coin","p":"0.5","fb":"A coin models 50%, not 75%: \u003ci>P\u003c/i>(save) would be 0.5.","_n":"15af5","_k":"2f31af9c"},{"id":"c3","t":"A die where 1–4 = save","p":"0.67","fb":"1–4 on a die is `4/6` ≈ 0.67, not 0.75.","_n":"16b05","_k":"b3a93af4"},{"id":"c4","t":"One digit 0–9 where 0–7 = save","p":"0.8","fb":"0–7 is 8 of 10 digits: 0.8, not 0.75.","_n":"17b15","_k":"940283d8"}]},{"id":"s2","name":"Run it","task":"One trial = 20 simulated shots, using wo dice) = `1/6`.","_a":"EUxREw==","why":"6 of the 36 equally likely outcomes.","hints":["Did it come from counting equal outcomes, from data, or from judgement?","Data → empirical.","Theoretical."]},{"id":"i6","t":"Our coach thinks we have a 60% chance in the final.","_a":"EUtMEw==","why":"It’s the coach’s judgement.","hints":["Did it come from counting equal outcomes, from data, or from judgement?","Data → empirical.","Subjective."]},{"id":"i7","t":"In 10 000 simulated spins, red came up 24.8% of the time.","_a":"EV1UEw==","why":"It counts what happened in 10 000 simulated trials.","wrong":{"th":"A simulation’s result is empirical, even though the device is designed."},"hints":["Did it come from counting equal outcomes, from data, or from judgement?","Data → empirical.","Empirical."]},{"id":"i8","t":"A fair four-sided die: \u003ci>P\u003c/i>(4) = `1/4`.","_a":"EUxREw==","why":"1 of 4 equally likely faces.","hints":["Did it come from counting equal outcomes, from data, or from judgement?","Data → empirical.","Theoretical."]},{"id":"i9","t":"A fisher’s hunch that the lake will freeze early this year.","_a":"EUtMEw==","why":"A hunch is a judgement, not data.","hints":["Did it come from counting equal outcomes, from data, or from judgement?","Data → empirical.","Subjective."]}]},{"id":"odds","type":"custom","title":"Odds and evidence","summary":"Odds and evidence","star":true,"goal":[3,4,6],"instruction":"Answer each question. Ratios go in the two boxes; they don’t need to be reduced.","how":"Type a number, a fraction such as 4/13, or a ratio in the two boxes, then press Check.","items":[{"id":"n1","goal":4,"kind":"ratio","prompt":"\u003ci>P\u003c/i>(event) = 0.15. Odds \u003cstrong>against\u003c/strong>? (reduced ratio)","_a":"aAkOHVdv","display":"17 : 3","why":"Unfavourable : favourable = 0.85 : 0.15 = 85 : 15 = 17 : 3.","wrong":[{"ratio":[3,17],"fb":"That’s odds in favour."},{"ratio":[17,20],"fb":"Compare unfavourable to favourable: 85 : 15."}],"hints":["Odds against = unfavourable : favourable.","0.85 unfavourable to 0.15 favourable is 85 : 15.","Divide both parts by 5: 17 : 3."]},{"id":"n2","goal":4,"kind":"num","prompt":"Odds in favour are 4 : 9. \u003ci>P\u003c/i>(event)?","_a":"AxYKAVMECwoACA4HXQABCAQP","tol":0.00005,"display":"`4/13`","why":"4 favourable out of 4 + 9 = 13.","wrong":[{"match":0.4444444444444444,"fb":"Add the parts: 4 + 9 = 13."}],"hints":["Odds 4 : 9 mean 4 favourable for every 9 unfavourable.","There are 4 + 9 = 13 parts in all.","`4/13`."]},{"id":"n3","goal":3,"kind":"num","prompt":"500 bulbs tested, 12 defective. Expected defective bulbs in a shipment of 2000?","_a":"BwA=","tol":1e-9,"display":"48","why":"`12/500` × 2000 = 12 × 4 = 48.","wrong":[{"match":12,"fb":"Scale by 2000 ÷ 500 = 4."}],"hints":["Empirical \u003ci>P\u003c/i>(defective) = `12/500`.","2000 is 4 times 500.","12 × 4 = 48."]},{"id":"n4","goal":6,"kind":"pair","star":true,"prompt":"A die rolled 300 times shows 62 sixes. Enter the count difference from expected, then the proportion difference (2 decimals).","labels":["Count difference","Proportion difference"],"_a":"aAkLHVQcAgxu","tol":[1e-9,0.0005],"display":"12; 0.04","why":"Expected 50 sixes; 62 − 50 = 12. `62/300` ≈ 0.207 vs `1/6` ≈ 0.167: a difference of 0.04.","general":"Expected 50 sixes; `62/300` ≈ 0.207 vs `1/6` ≈ 0.167.","hints":["Expected sixes = 300 × `1/6`.","Expected 50, so the count difference is 62 − 50; the proportion difference is `62/300` − `1/6`.","12; `12/300` = 0.04."]},{"id":"n5","goal":3,"kind":"num","star":true,"prompt":"A bag holds 4 marbles, each red or blue (mix unknown). 200 draws \u003cstrong>with replacement\u003c/strong> gave 148 red. Most likely number of red marbles?","_a":"AA==","tol":1e-9,"display":"3","why":"`148/200` = 0.74 ≈ `3/4`.","wrong":[{"match":4,"fb":"Then every draw would be red."},{"match":2,"fb":"That predicts about 100 reds."}],"general":"`148/200` = 0.74 ≈ `3/4`.","hints":["Empirical \u003ci>P\u003c/i>(red) ≈ ?","0.74.","Closest to 3 of 4 marbles."]},{"id":"n6","goal":4,"kind":"ratio","star":true,"prompt":"Events \u003ci>A\u003c/i> and \u003ci>B\u003c/i> are mutually exclusive. The odds in favour of \u003ci>A\u003c/i> are 2 : 3 and of \u003ci>B\u003c/i> are 1 : 4. Odds in favour of \u003ci>A\u003c/i> or \u003ci>B\u003c/i>?","_a":"aAsVAzk=","display":"3 : 2","why":"\u003ci>P\u003c/i>(\u003ci>A\u003c/i>) = `2/5`, \u003ci>P\u003c/i>(\u003ci>B\u003c/i>) = `1/5`, so \u003ci>P\u003c/i>(\u003ci>A\u003c/i> or \u003ci>B\u003c/i>) = `3/5`: 3 : 2 in favour.","wrong":[{"ratio":[3,7],"fb":"Convert first: \u003ci>P\u003c/i>(\u003ci>A\u003c/i>) = `2/5`, \u003ci>P\u003c/i>(\u003ci>B\u003c/i>) = `1/5`, so \u003ci>P\u003c/i>(\u003ci>A\u003c/i> or \u003ci>B\u003c/i>) = `3/5`."}],"hints":["Turn each set of odds into a probability.","`2/5 + 1/5 = 3/5` (mutually exclusive).","`3/5` in favour → 3 : 2."]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Percy","instruction":"Percy made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","how":"","problems":[{"id":"e1","goal":4,"task":"Find the odds against drawing a heart from a standard deck.","steps":["There are 13 hearts in 52 cards.","\u003ci>P\u003c/i>(heart) = `13/52 = 1/4`.","So the odds against a heart are 4 : 1.","A heart is unlikely."],"_a":"AQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Odds against = not heart : heart = 39 : 13 = 3 : 1.","why":"Odds against compare the 39 non-hearts to the 13 hearts.","_n":"1oba5","_k":"da5bb233"},{"t":"Step 3 is correct.","why":"4 : 1 uses the denominator of \u003ci>P\u003c/i>; odds compare 39 non-hearts to 13 hearts.","_n":"1pb75","_k":"b2fb6289"},{"t":"Odds against = 4 : 3.","why":"Odds against compare unfavourable to favourable: 39 non-hearts to 13 hearts.","_n":"1qb85","_k":"a9c7f937"},{"t":"Odds against = 1 : 4.","why":"That’s 1 heart for 4 cards, not a comparison of outcomes.","_n":"1rb55","_k":"3db71ae9"}],"hints":["Odds against compare unfavourable to favourable.","39 non-hearts, 13 hearts.","3 : 1."]},{"id":"e2","goal":6,"task":"A coin has landed tails 6 times in a row. What is \u003ci>P\u003c/i>(heads) on the next flip?","steps":["Each flip has \u003ci>P\u003c/i>(heads) = `1/2`.","6 tails in a row had probability `(1/2)^6 = 1/64`.","7 tails in a row is even rarer, so heads is now more likely than `1/2`.","So \u003ci>P\u003c/i>(heads) is about 0.98."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct, but it’s about the past.","","Step 4 follows step 3."],"fixes":[{"t":"Step 3 is correct.","why":"The coin has no memory; “rarer streaks” don’t change the next flip.","_n":"1sb65","_k":"dc0ed693"},{"t":"\u003ci>P\u003c/i>(heads) = `63/64`.","why":"`63/64` isn’t about the next flip; the next flip is a fresh `1/2`.","_n":"1tb35","_k":"a33cc029"},{"t":"\u003ci>P\u003c/i>(heads) = `1/64`.","why":"`1/64` was the chance of the streak, which has already happened.","_n":"1ub45","_k":"74c9d457"},{"t":"Flips are independent: \u003ci>P\u003c/i>(heads next) is still `1/2`.","why":"The coin has no memory.","_n":"1vc15","_k":"382ecffd"}],"hints":["Does the coin know what happened?","No: each flip is a fresh `1/2`.","`1/2`."]},{"id":"e3","goal":3,"task":"A spinner landed on red 20 times in 80 spins. Estimate \u003ci>P\u003c/i>(red) and the number of reds in 300 spins.","steps":["Reds: 20.","Non-reds: 60.","\u003ci>P\u003c/i>(red) ≈ `20/60 = 1/3`.","So expect 100 reds in 300 spins."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 uses step 3’s value."],"fixes":[{"t":"\u003ci>P\u003c/i>(red) ≈ `60/80`.","why":"60 is the number of non-reds.","_n":"1wc25","_k":"e0fbab1c"},{"t":"Step 3 is correct.","why":"Divide by all 80 spins, not the 60 non-reds.","_n":"1xbf5","_k":"688e73cc"},{"t":"\u003ci>P\u003c/i>(red) ≈ `20/80 = 1/4`, so expect 75 reds in 300 spins.","why":"Divide by all 80 spins: `1/4` of 300 is 75.","_n":"1ybe5","_k":"73b3b329"},{"t":"\u003ci>P\u003c/i>(red) ≈ `20/100`.","why":"There were 80 spins, not 100.","_n":"1zc15","_k":"ec9bf27e"}],"hints":["Empirical \u003ci>P\u003c/i> = successes ÷ total.","Total = 80.","`1/4`, so 75."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the lab: how jagged short runs were, or that the count difference grew?"},{"id":"j2","q":"In your own words, what does the law of large numbers promise, and what doesn’t it promise?"},{"id":"j3","q":"Explain to a friend how to turn odds of 2 : 7 in favour into a probability, and back."},{"id":"j4","q":"Which kind of probability (theoretical, empirical or subjective) do you find hardest to use well? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A forecaster says there’s a 70% chance of rain, because 70% of past days with similar conditions had rain. What kind of probability is this?","options":[{"t":"Theoretical","why":"It doesn’t come from equally likely outcomes.","_n":"20c05","_k":"96a631f0"},{"t":"Conditional odds","why":"It’s a probability from data, not odds.","_n":"21c35","_k":"a19c00a6"},{"t":"Empirical","why":"It comes from past data.","_n":"22c25","_k":"a6938f9f"},{"t":"Subjective","why":"It’s based on records, not a hunch.","_n":"23c55","_k":"1beac5c6"}]},"b":{"prompt":"A fair eight-sided die has faces 1–8. “\u003ci>P\u003c/i>(8) = `1/8`.” What kind of probability is this?","options":[{"t":"Empirical","why":"No trials were run.","_n":"24c45","_k":"6cac2af8"},{"t":"Simulated","why":"Nothing was simulated.","_n":"25b75","_k":"22a26ab9"},{"t":"Theoretical","why":"8 equally likely outcomes, 1 favourable.","_n":"26b65","_k":"3e104c30"},{"t":"Subjective","why":"It isn’t an opinion.","_n":"27357","_k":"4cc9a3fc"}]}},{"id":"k2","cat":"K","goal":4,"a":{"prompt":"The odds in favour of an event are 3 : 5. What is its probability?","options":[{"t":"`3/8`","why":"3 favourable out of 3 + 5 = 8.","_n":"28367","_k":"d7cfdd07"},{"t":"`3/5`","why":"Odds aren’t a fraction of the total.","_n":"29377","_k":"1d2776a4"},{"t":"`5/8`","why":"That’s the probability against.","_n":"2a387","_k":"296a57e7"},{"t":"`5/3`","why":"A probability can’t exceed 1.","_n":"2b317","_k":"a4e14f45"}]},"b":{"prompt":"\u003ci>P\u003c/i>(win) = `2/7`. What are the odds \u003cstrong>against\u003c/strong> winning?","options":[{"t":"2 : 7","why":"Odds compare the two parts, not part to total.","_n":"2c327","_k":"7203d1a3"},{"t":"7 : 2","why":"7 is the total, not the losing count.","_n":"2d337","_k":"6ffaab45"},{"t":"2 : 5","why":"That’s odds in favour.","_n":"2e347","_k":"fba4a147"},{"t":"5 : 2","why":"5 losing outcomes to 2 winning ones.","_n":"2f3d7","_k":"1b1b4367"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"One card is drawn from a standard deck. What is \u003ci>P\u003c/i>(not a face card)?","options":[{"t":"`3/13`","why":"That’s \u003ci>P\u003c/i>(face card); take the complement.","_n":"2g3e7","_k":"2074195c"},{"t":"`9/13`","why":"Aces aren’t face cards: only J, Q and K are.","_n":"2h3b7","_k":"6509ff40"},{"t":"`10/13`","why":"12 face cards, so 40 of 52 aren’t: `40/52`.","_n":"2i3a7","_k":"354e5599"},{"t":"`13/10`","why":"1 ÷ \u003ci>P\u003c/i> isn’t the complement.","_n":"2j397","_k":"972fca35"}]},"b":{"prompt":"A die is rolled. What is \u003ci>P\u003c/i>(not less than 3)?","options":[{"t":"`1/3`","why":"That’s \u003ci>P\u003c/i>(less than 3).","_n":"2k387","_k":"966537cd"},{"t":"`1/2`","why":"“Less than 3” is 1 and 2 only, not 3.","_n":"2l377","_k":"f6430bf9"},{"t":"`2/3`","why":"Less than 3 is {1, 2}; not less than 3 is {3, 4, 5, 6}: `4/6`.","_n":"2m367","_k":"11b9b996"},{"t":"`3/2`","why":"Probabilities can’t exceed 1.","_n":"2n357","_k":"9371970d"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A survey of 200 Grade 12 students found 46 walk, 84 take the bus, 50 are driven and 20 bike to school. Estimate \u003ci>P\u003c/i>(a randomly chosen student takes the bus or bikes).","options":[{"t":"0.42","why":"That’s the bus only; “or” adds the bikers.","_n":"2o347","_k":"37986f35"},{"t":"0.50","why":"Two of four categories isn’t half; the categories aren’t equal in size.","_n":"2p437","_k":"d5e55218"},{"t":"0.52","why":"(84 + 20)/200 = `104/200`.","_n":"2q427","_k":"3b99a11b"},{"t":"1.08","why":"104 ÷ 96 divides by the other students, not by all 200.","_n":"2r790","_k":"02b13aec"}]},"b":{"prompt":"A thumbtack tossed 250 times landed point up 155 times. Estimate \u003ci>P\u003c/i>(point down) and the expected number of point-down landings in 1000 tosses.","options":[{"t":"0.61 and 613","why":"95 ÷ 155 divides by point-up, not by all tosses.","_n":"2s780","_k":"06c155e4"},{"t":"0.62 and 620","why":"That’s point up.","_n":"2t7b0","_k":"f97a3a35"},{"t":"0.38 and 380","why":"`95/250` = 0.38; 0.38 × 1000.","_n":"2u7a0","_k":"af9662bc"},{"t":"0.38 and 95","why":"Scale to 1000 tosses.","_n":"2v750","_k":"883f3714"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"A spinner has theoretical \u003ci>P\u003c/i>(red) = 0.25. After 400 spins there were 92 reds. Which statement is correct?","options":[{"t":"The empirical probability is 0.23; being 8 short of the expected 100 is ordinary, and more spins should bring the proportion closer to 0.25","why":"`92/400` = 0.23. A gap of 8 in 400 spins is ordinary; the proportion settles toward 0.25 as the spins add up.","_n":"2w740","_k":"d96961ef"},{"t":"The spinner must be unfair, because 92 ≠ 100","why":"Short runs rarely match exactly.","_n":"2x770","_k":"ec6e73b4"},{"t":"The next spins are more likely to land on red to catch up","why":"The spinner has no memory. Each spin is still 0.25, whatever came before.","_n":"2y760","_k":"0bb9d4fc"},{"t":"The empirical probability is `92/308`","why":"Empirical probability is successes ÷ \u003cstrong>total trials\u003c/strong>, not ÷ failures.","_n":"2z710","_k":"f79182ec"}]},"b":{"prompt":"A die has theoretical \u003ci>P\u003c/i>(6) = `1/6`. In 600 rolls there were 92 sixes. Which statement is correct?","options":[{"t":"The empirical probability is `92/508`","why":"Empirical probability is successes ÷ \u003cstrong>total trials\u003c/strong>, not ÷ failures.","_n":"30700","_k":"b35eb740"},{"t":"The empirical probability is about 0.153; 8 short of the expected 100 is ordinary, and more rolls should bring the proportion closer to `1/6`","why":"`92/600` ≈ 0.153. A gap of 8 in 600 rolls is ordinary; the proportion settles toward `1/6` as the rolls add up.","_n":"3172f","_k":"85c6d86a"},{"t":"Sixes are now due, so the next roll is more likely to be a 6","why":"The die has no memory. Each roll is still `1/6`, whatever came before.","_n":"3273f","_k":"02dcff23"},{"t":"The die must be unfair, because 92 ≠ 100","why":"Short runs rarely match exactly.","_n":"3370f","_k":"df211f59"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"A spinner has sectors of 180° red, 120° blue and 60° green. It is spun twice. What is \u003ci>P\u003c/i>(both spins the same colour)?","options":[{"t":"`1/4`","why":"That’s red-red only.","_n":"3471f","_k":"06320f73"},{"t":"`1/3`","why":"Treats the 3 colours as equally likely: 3 matching pairs of 9.","_n":"3576f","_k":"d1b6baed"},{"t":"`7/18`","why":"`(1/2)^2 + (1/3)^2 + (1/6)^2 = 9/36 + 4/36 + 1/36 = 14/36`.","_n":"3677f","_k":"062ee1c8"},{"t":"1","why":"Adding `1/2 + 1/3 + 1/6` gives the chance of \u003cem>some\u003c/em> colour on one spin.","_n":"3774f","_k":"6fced381"}]},"b":{"prompt":"A spinner has sectors of 240° red and 120° blue. It is spun twice. What is \u003ci>P\u003c/i>(the two spins are different colours)?","options":[{"t":"`2/9`","why":"That counts only red then blue.","_n":"3875f","_k":"afa6cabb"},{"t":"`4/9`","why":"Red-blue or blue-red: 2 × `(2/3)(1/3)`.","_n":"396af","_k":"6af38e8e"},{"t":"`1/2`","why":"The colours aren’t equally likely.","_n":"3a6bf","_k":"360144fe"},{"t":"`5/9`","why":"That’s \u003ci>P\u003c/i>(same colour).","_n":"3b6cf","_k":"1875e068"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why “\u003ci>P\u003c/i>(rain) = `1/2`, because it either rains or it doesn’t” is wrong?","options":[{"t":"“Two possible outcomes aren’t necessarily equally likely; the probability must come from data (empirical) or a justified model.”","why":"Two outcomes aren’t automatically equally likely, so `1/2` needs data or a justified model.","_n":"3c6bf","_k":"b423e19f"},{"t":"“It should be `1/3`: rain, snow or neither.”","why":"Listing more outcomes doesn’t make them equally likely either.","_n":"3d6af","_k":"19f6d0d4"},{"t":"“Probabilities about weather are always subjective.”","why":"Forecasts use data, so they’re empirical.","_n":"3e69f","_k":"e829461d"},{"t":"“It’s correct for a theoretical probability.”","why":"Theoretical probability needs equally likely outcomes.","_n":"3f68f","_k":"44dd289b"}]},"b":{"prompt":"Which is the best explanation of why a coach’s “60% chance to win” is subjective?","options":[{"t":"“It’s subjective because it’s about the future.”","why":"Theoretical probabilities are about the future too.","_n":"3g67f","_k":"c6925ba1"},{"t":"“It’s subjective because games have two outcomes.”","why":"Two outcomes aren’t automatically equally likely, and counting them isn’t what makes a probability subjective.","_n":"3h66f","_k":"27ac3c7b"},{"t":"“It’s subjective because 60% isn’t a simple fraction.”","why":"Any value can be subjective or not.","_n":"3i65f","_k":"af474d55"},{"t":"“It’s a judgement based on the coach’s experience, not a count of equally likely outcomes or a record of trials.”","why":"It isn’t a count of outcomes or a record of trials; it’s the coach’s judgement.","_n":"3j74f","_k":"586a86d3"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"A player makes 60% of free throws. Which simulation best estimates \u003ci>P\u003c/i>(makes at least 4 of 5)?","options":[{"t":"“Use digits 0–5 as a make, 5 digits, and run one trial.”","why":"One trial can’t estimate a probability.","_n":"3k73f"
