.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 10: hero table, Round table (D4 circular mode: table drawing, line-up stack, list of small tables), Part 3 seat
   placement, Table planner task. Colour tokens only. */
/* radioGroup (from MDM4U 06) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2);margin:0}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* ---------- @component D4 circular mode: the table drawing (copy with the component) ---------- */
.cir-tw{position:relative;width:min(100%,330px);aspect-ratio:1;container-type:inline-size;margin:0 auto;--tok:max(34px,13cqw);flex:none}
.cir-tw.dense{--tok:max(32px,11.6cqw)}
.cir-disc{position:absolute;inset:22.5%;border-radius:50%;background:var(--paper);border:2px solid var(--rule);display:flex;align-items:center;justify-content:center}
.cir-dir{font-size:13cqw;line-height:1;color:var(--ink-2);opacity:.32}
.cir-tw.numd .cir-dir{opacity:.14}
.cir-topm{position:absolute;left:50%;top:-1px;transform:translateX(-50%);font-size:.62rem;line-height:1;color:var(--ink-2)}
.cir-num{position:absolute;transform:translate(-50%,-50%);font:700 clamp(11px,4.2cqw,15px)/1 var(--font-ui);color:var(--ink-2)}
.cir-tok,.cir-seat{position:absolute;width:var(--tok);height:var(--tok);transform:translate(-50%,-50%);border-radius:50%;box-sizing:border-box}
.cir-tok{display:flex;align-items:center;justify-content:center;background:var(--sheet);border:2px solid var(--ink);color:var(--ink);font:700 clamp(15px,6.2cqw,22px)/1 var(--font-ui)}
.cir-tok.lock{box-shadow:0 0 0 2px var(--sheet),0 0 0 5px var(--ink)}
.cir-tok.glow{border-color:var(--hi);box-shadow:0 0 0 5px var(--hi-soft)}
.cir-tok.tch{background:var(--ev-a-soft)}
.cir-tok.stu{background:var(--ev-b-soft)}
.cir-lk{position:absolute;right:-3px;top:-3px;width:11px;height:8px;background:var(--ink);border-radius:2px}
.cir-lk::before{content:"";position:absolute;left:2px;top:-5px;width:7px;height:6px;border:2px solid var(--ink);border-bottom:0;border-radius:4px 4px 0 0;box-sizing:border-box}
.cir-seat{border:2px dashed var(--ink-2);background:var(--sheet);color:var(--ink-2);font:600 .82rem var(--font-ui);padding:0;display:flex;align-items:center;justify-content:center}
button.cir-seat{cursor:pointer}
.cir-seat.glow{border:2.5px solid var(--hi);box-shadow:0 0 0 5px var(--hi-soft);color:var(--ink)}
.cir3-nm{font-size:clamp(12px,4.7cqw,15px);font-weight:700}
.cir-tok sub{font-size:.62em}
/* small tables (List all) */
.cir-lbox{max-height:360px;overflow:auto;border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--sheet)}
.cir-ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.cir-li{position:relative;display:flex;align-items:center;border:1.5px solid var(--rule);border-radius:8px;padding:1px}
.cir-li.pair{padding:1px 4px;gap:2px}
.cir-eq{font:700 .9rem var(--font-ui);color:var(--ink-2)}
.cir-li.fit{border:2px solid var(--green)}
.cir-li.fit::after{content:"✓";position:absolute;right:3px;top:0;color:var(--green);font:700 .8rem var(--font-ui)}
.cir-li.nofit{opacity:.42}
.cir-li.cur{background:var(--hi-soft);border-color:var(--ink)}
.cir-mini{width:62px;height:62px;display:block}
.cir-md{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.cir-mt{fill:var(--ink);font:700 11.5px var(--font-ui);text-anchor:middle;dominant-baseline:central}
.cir-mn{fill:var(--ink-2);font:700 7.5px var(--font-ui);text-anchor:middle;dominant-baseline:central}
.cir-lhead{margin:12px 0 6px;font-weight:700}

/* ---------- hero ---------- */
.cir-heq{display:inline-block}
.cir-heq-t{font:400 .42em var(--font-ui);font-style:normal;color:var(--ink-2);display:block;margin-bottom:.1em}
.cir-h{display:grid;grid-template-columns:minmax(0,240px) auto;justify-content:center;gap:10px 18px;align-items:center;padding:4px 0}
.cir-h-tbl.cir-tw{width:100%}
.cir-h-side{min-width:92px}
.cir-h-ups{list-style:none;margin:0;padding:0 0 0 8px;border-left:3px solid transparent;transition:border-color .5s}
.cir-h-ups li{font:700 1.1rem/1.2 var(--font-ui);letter-spacing:.14em;padding:3px 8px;margin:0 0 18px;border-radius:6px;background:var(--sheet);border:1px solid var(--rule);transition:margin .7s;animation:cirIn .45s ease-out both}
.cir-h-ups.stacked{border-left-color:var(--ink)}
.cir-h-ups.stacked li{margin-bottom:3px;animation:none}
.cir-h-lab{margin:6px 0 0 8px;font-weight:700;opacity:0;transition:opacity .5s}
.cir-h-lab.on{opacity:1}
.cir-h-ctr{grid-column:1/-1;text-align:center;font:400 1.6rem var(--font-math);margin:0;min-height:1.3em}
@keyframes cirIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Explore ---------- */
.cir-topbar{display:flex;flex-wrap:wrap;gap:4px 22px}
.cir-cap{min-height:1.5em;font-size:clamp(1.35rem,3.4vw,2rem)}
.cir-capn{font:400 .95rem var(--font-ui);color:var(--ink-2)}
.cir-stage{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-start;justify-content:center;margin-top:4px}
.cir-big{border-radius:12px}
.cir-big:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.cir-stack{flex:1 1 160px;min-width:150px;max-width:280px}
.cir-stack[hidden]{display:none}
.cir-slab{margin:0 0 6px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.cir-slab.done{color:var(--ink)}
.cir-scols{display:flex;gap:12px}
.cir-sh{margin:0 0 4px;font-size:.78rem;color:var(--ink-2)}
.cir-sl{list-style:none;margin:0;padding:0 0 0 8px;border-left:3px solid var(--ink)}
.cir-scols.diff .cir-sl{border-left:3px dashed var(--ink-2)}
.cir-sl li{font:700 1rem/1.25 var(--font-ui);letter-spacing:.12em;padding:1px 6px;border-radius:5px;white-space:nowrap;animation:cirIn .3s ease-out both}
.cir-sl li.cur{background:var(--hi-soft)}
.cir-line{text-align:center;margin:10px 0 0}
.cir-lu{font-weight:700;letter-spacing:.12em}
.cir-ok{color:var(--green);font-weight:700;white-space:nowrap}
.cir-no{color:var(--red);font-weight:700}
.cir-msg{margin:4px 0 0;min-height:1.3em;font-size:.92rem;color:var(--ink-2);text-align:center}
.cir-list[hidden]{display:none}
.cir-btns{margin-top:6px}
.cir-lockrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:14px 0 4px}
.cir-sel{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.35em .5em;font:400 .95rem var(--font-ui);min-height:36px;max-width:100%}
.cir-chipbox{margin-top:10px}
.cir-chips{margin:6px 0 4px}
.cir-chips .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.cir-chips .chip:disabled{opacity:.45;cursor:not-allowed}
.cir-guess{margin-top:6px}
.cir-guess .numrow{margin-top:4px}
.cir-how{margin-top:10px}

/* ---------- Part 3 ---------- */
.cir3-station[hidden]{display:none}
.cir3-station h3{margin-top:6px}
.cir3-wrap{display:flex;flex-wrap:wrap;gap:16px 26px;align-items:flex-start}
.cir3-tblw{flex:0 1 330px;min-width:0;width:100%;max-width:330px}
.cir3-side{flex:1 1 230px;min-width:0}
.cir3-tray{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px;min-height:46px}
.cir3-tk{min-width:46px;height:46px;border-radius:999px;border:2px solid var(--ink);background:var(--sheet);color:var(--ink);font:700 .95rem var(--font-ui);padding:0 10px;cursor:pointer}
.cir3-tk.tch{background:var(--ev-a-soft)}
.cir3-tk.stu{background:var(--ev-b-soft)}
.cir3-tk[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--ink);box-shadow:0 0 0 4px var(--hi-soft)}
.cir3-tk sub{font-size:.68em}
.cir3-menu{margin:4px 0}
.cir3-ml{font-size:.92rem}
.cir3-next{min-height:2.6em;margin:10px 0 0;font-size:.92rem;color:var(--ink-2)}
.cir3-prod{margin-top:12px}
.cir3-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}
.cir3-f{display:inline-flex;flex-direction:column;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:2px 9px;background:var(--sheet);animation:cirIn .3s ease-out both}
.cir3-fn{font-size:.78rem;color:var(--ink-2)}
.cir3-fn sub{font-size:.7em}
.cir3-fv{font:400 1.3rem/1.1 var(--font-math)}
.cir3-x{font:400 1.2rem var(--font-math);color:var(--ink-2)}
.cir3-tot{font:700 1.45rem var(--font-math)}

/* ---------- task ---------- */
.cir-rmenu{margin:.6em 0 .2em}
.cir-rules{margin:.2em 0 .7em;padding-left:1.3em}
.cir-conds{margin:.3em 0 .8em;padding-left:1.4em}
.cir-tin{margin:10px 0 6px}
.cir-trow{display:flex;align-items:center;gap:8px;margin:0 0 10px}

.cir-tpt.cir-tw{width:min(100%,290px)}
.cir-tcount{margin:8px 0 2px}
.cir-big-n{font:700 1.7rem var(--font-math)}

ue\">\u003col class=\"cir-h-ups\" id=\"cir-h-ups\">\u003c/ol>\u003cp class=\"cir-h-lab\" id=\"cir-h-lab\">\u003c/p>\u003c/div>\u003cp class=\"cir-h-ctr\" id=\"cir-h-ctr\" aria-hidden=\"true\">\u003c/p>\u003c/div>"}},"goals":["I can explain why rotations of a circular arrangement count as the same and use `(n - 1)!`.","I can decide whether a situation is a round table, a flippable ring, or a line with labelled seats.","I can count flippable rings (necklaces, key rings) using `(n - 1)!/2`.","I can count circular arrangements with “together”, “apart” or “between” restrictions.","I can solve circular-arrangement problems in context."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Factorials","goal":1,"prompt":"Evaluate `5!/5`.","options":[{"t":"1","why":"`5!` doesn’t cancel with 5: `5! = 120`, and 120 ÷ 5 = 24.","_n":"0700","_k":"141a1341"},{"t":"4","why":"`5!/5 = 4!`, not 4.","_n":"1710","_k":"ce6073e9"},{"t":"24","why":"120 ÷ 5 = 24 = `4!`.","_n":"2720","_k":"215c0ae2"},{"t":"120","why":"That ignores the ÷ 5.","_n":"36b0","_k":"bcb7d0eb"}],"hints":["`5! = 120`.","120 ÷ 5.","24."]},{"id":"w2","skill":"Factorials","goal":1,"prompt":"Evaluate `(6 - 1)!`.","options":[{"t":"5","why":"Don’t drop the “!”.","_n":"46c0","_k":"85579cb9"},{"t":"120","why":"`5! = 120`.","_n":"56d0","_k":"354a8d28"},{"t":"719","why":"That’s `6! - 1`. Work out the bracket first.","_n":"66e0","_k":"4209729d"},{"t":"720","why":"That’s `6!`.","_n":"7770","_k":"a5f9cce5"}],"hints":["Work out the bracket first.","`5!`.","120."]},{"id":"w3","skill":"Linear permutations","goal":2,"prompt":"In how many ways can 4 people line up?","options":[{"t":"4","why":"4 is the number of people, not the number of line-ups.","_n":"8780","_k":"b82fc461"},{"t":"6","why":"That’s `3!`.","_n":"9bb5","_k":"609268de"},{"t":"16","why":"That’s 4 × 4, which reuses people.","_n":"aba5","_k":"27277f25"},{"t":"24","why":"4 × 3 × 2 × 1 = 24.","_n":"bb95","_k":"46ebd3ad"}],"hints":["4 × 3 × 2 × 1.","24.","24."]},{"id":"w4","skill":"Linear permutations","goal":2,"prompt":"Evaluate `P(6, 6)` ÷ 6.","options":[{"t":"1","why":"`P(6, 6) = 6! = 720`, not 6.","_n":"cb85","_k":"ce3b48be"},{"t":"6","why":"`P(6, 6) = 6! = 720`, so 720 ÷ 6.","_n":"db75","_k":"f900cd42"},{"t":"120","why":"720 ÷ 6.","_n":"eb65","_k":"48aefe89"},{"t":"720","why":"That’s `P(6, 6)` before dividing by 6.","_n":"fb55","_k":"19cbdbfa"}],"hints":["`P(6, 6) = 6!`.","720 ÷ 6.","120."]},{"id":"w5","skill":"Together and apart","goal":4,"prompt":"5 people in a line, two particular people together. How many line-ups?","options":[{"t":"24","why":"You forgot the order inside the block: × 2.","_n":"gb45","_k":"e5873756"},{"t":"48","why":"`4! × 2!`.","_n":"hb35","_k":"34f28e25"},{"t":"72","why":"That’s “apart”.","_n":"ib25","_k":"7d6917de"},{"t":"120","why":"That ignores the rule.","_n":"j216","_k":"ae9d49f7"}],"hints":["Block the pair.","4 items: `4!`.","× `2!` = 48."]},{"id":"w6","skill":"Together and apart","goal":4,"prompt":"5 people in a line, two particular people apart. How many line-ups?","options":[{"t":"24","why":"Apart is total − together: 120 − 48.","_n":"k226","_k":"2786f6d9"},{"t":"48","why":"That’s “together”.","_n":"l1f6","_k":"9d99becb"},{"t":"72","why":"120 − 48.","_n":"m206","_k":"4a6687da"},{"t":"96","why":"That’s 120 − 24: together is 48, not 24.","_n":"n256","_k":"b7c694cf"}],"hints":["Total − together.","120 − 48.","72."]}],"refreshers":{"Factorials":"`n!/n = (n - 1)!`. For example, `5!/5 = 4! = 24`.","Linear permutations":"`n` different objects in a line: `n!`.","Together and apart":"Together: block × orders inside. Apart: total − together."}}},"explore":{"heading":"Round table","intro":"Seat people around a circle and rotate the table. Switch to a ring that can flip, or to numbered seats, and watch the count change.","predIntro":"Make a prediction first. Then the round table will show you what really happens.","predictions":[{"id":"p1","start":{"setting":"table","n":4},"prompt":"How many different seatings of 4 friends?","options":[{"t":"3","_n":"o266","_k":"55ab8f19"},{"t":"4","_n":"p236","_k":"c8e35787"},{"t":"6","_n":"q246","_k":"26dfd202"},{"t":"24","_n":"r296","_k":"5aefaed7"}],"explain":"24 line-ups in groups of 4 rotations: 6."},{"id":"p2","start":{"setting":"ring","n":4},"prompt":"How many different bracelets?","options":[{"t":"3","_n":"s2a6","_k":"2c987649"},{"t":"6","_n":"t276","_k":"c892aadf"},{"t":"12","_n":"u266","_k":"b056bb33"},{"t":"24","_n":"v296","_k":"a3c3c1cb"}],"explain":"Flipping makes mirror images the same: 6 ÷ 2 = 3."},{"id":"p3","start":{"setting":"numbered","n":4},"prompt":"Seats are numbered 1–4 around the table. How many seatings?","options":[{"t":"3","_n":"w286","_k":"5143796f"},{"t":"4","_n":"x236","_k":"3bf1f6af"},{"t":"6","_n":"y226","_k":"926cf49b"},{"t":"24","_n":"z256","_k":"8c4e0b80"}],"explain":"Seat 1 is a particular seat, so a rotation puts people in different numbered seats: `4!`."},{"id":"p4","start":{"setting":"table","n":6,"chips":["tog"]},"prompt":"How many seatings?","options":[{"t":"24","_n":"10246","_k":"45f5e737"},{"t":"48","_n":"112f6","_k":"f35040ef"},{"t":"72","_n":"122e6","_k":"d71f7d28"},{"t":"240","_n":"131d5","_k":"79cec0b4"}],"explain":"The block plus 4 others makes 5 units around the circle: `(5 - 1)! = 24`, × 2 orders inside the block = 48."}],"chalIntro":"Set up the round table, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Round table: set `n` so there are exactly 120 different seatings.","why":"`(6 - 1)! = 5! = 120`.","hints":["`(n - 1)! = 120`.","`120 = 5!`.","`n - 1 = 5`, so `n = 6`."]},{"id":"tc2","goal":3,"prompt":"Ring setting: set `n` so there are exactly 60 different necklaces.","why":"`(6 - 1)!/2 = 120/2 = 60`.","hints":["`(n - 1)!/2 = 60`.","`(n - 1)! = 120`.","`n = 6`."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Round table, `n = 8`: Kai and Lee must \u003cstrong>not\u003c/strong> sit side by side, and Mo must sit \u003cstrong>directly opposite\u003c/strong> Kai. Lock Kai, then count. \u003cspan class=\"tiny muted\">(In the tool, Kai is A, Lee is B and Mo is C. Type your count in \u003cstrong>Your count\u003c/strong>, then press Check challenge.)\u003c/span>","why":"Kai locked: Mo has 1 seat, Lee 4, and the other 5 people fill 5 seats in `5! = 120` ways: 4 × 120 = 480. The tool agrees: with `n = 8`, “A and B apart” and “C directly opposite A”, listing every seating gives 480.","hints":["Lock Kai. Mo now has exactly 1 seat, opposite.","Lee can’t sit in the 2 seats beside Kai or in Mo’s seat: 4 seats remain for Lee.","The other 5 people fill 5 seats: `5! = 120`. 4 × 120 = 480."]}],"blocks":[{"title":"About circles","html":"\u003cp>Every problem in this module names its setting, because the setting decides what counts as “the same”.\u003c/p>\u003cul>\u003cli>\u003cstrong>Round table (people):\u003c/strong> only who sits beside whom matters, so rotations are the same: `(n - 1)!`. People face inward and can’t be flipped: clockwise and counterclockwise orders give everyone different left and right neighbours.\u003c/li>\u003cli>\u003cstrong>Ring that can flip\u003c/strong> (bracelet, necklace, key ring): it can be turned over, so mirror images are the same too: `(n - 1)!/2` for `n ≥ 3`.\u003c/li>\u003cli>\u003cstrong>Carousel:\u003c/strong> it turns but is only ever seen from one side, so it isn’t flipped: `(n - 1)!`.\u003c/li>\u003cli>\u003cstrong>Numbered seats\u003c/strong> (or one special seat): rotations put people in different seats, so it’s a line again: `n!`.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"restrictions","name":"Restrictions","heading":"Circular with restrictions","intro":"Fix a reference person first, then use 09’s strategies: a block for “together”, total − together for “apart”, and filling each type’s seats for alternating. Place the tokens on the table one at a time and watch the choices multiply. Then check a small case by listing every circle.","quickCheck":{"title":"Quick check","summary":"Circular with restrictions quick check","items":[{"id":"q1","goal":4,"prompt":"5 people at a round table, 2 together?","choices":[{"t":"6","fb":"4 units around the circle: `3! × 2 = 12`.","_n":"141e5","_k":"50fc72ee"},{"t":"12","fb":"Right. 4 units around the circle: `3! × 2 = 12`.","_n":"151f5","_k":"2874a54f"},{"t":"24","fb":"4 units around the circle: `3! × 2 = 12`.","_n":"16205","_k":"0630bd74"},{"t":"48","fb":"4 units around the circle: `3! × 2 = 12`.","_n":"17215","_k":"3d073278"}]},{"id":"q2","goal":4,"prompt":"6 people at a round table, 2 apart?","choices":[{"t":"48","fb":"120 − 48 = 72.","_n":"18225","_k":"12795e68"},{"t":"72","fb":"Right. Total `5! = 120`, together 48: 120 − 48 = 72.","_n":"19235","_k":"86edf3e7"},{"t":"96","fb":"120 − 48 = 72.","_n":"1a245","_k":"2258cedb"},{"t":"120","fb":"120 − 48 = 72.","_n":"1b255","_k":"e6943379"}]},{"id":"q3","goal":3,"prompt":"A key ring with 5 different keys?","choices":[{"t":"12","fb":"Right. `4!/2 = 12`: a key ring can be turned over.","_n":"1c265","_k":"de307bf0"},{"t":"24","fb":"`4!/2 = 12`.","_n":"1d235","_k":"a3e3fe19"},{"t":"60","fb":"`4!/2 = 12`.","_n":"1e225","_k":"01661f25"},{"t":"120","fb":"`4!/2 = 12`.","_n":"1f215","_k":"173334b9"}]},{"id":"q4","goal":2,"prompt":"Which is \u003cstrong>not\u003c/strong> a circular arrangement in this module’s sense?","choices":[{"t":"Beads on a bracelet","fb":"Lanes are numbered: that’s a line, `n!`.","_n":"1g205","_k":"b6c9bbed"},{"t":"Runners in lanes 1–8","fb":"Right. Lanes are numbered: that’s a line, `n!`.","_n":"1h275","_k":"11a0906e"},{"t":"Keys on a ring","fb":"Lanes are numbered: that’s a line, `n!`.","_n":"1i265","_k":"0ae429f5"},{"t":"Friends around a campfire","fb":"Lanes are numbered: that’s a line, `n!`.","_n":"1j255","_k":"3bc5dea1"}]}]}},"practice":{"activities":[{"id":"formula","type":"sorter","title":"Which formula?","summary":"Which formula?","goal":2,"noun":"arrangement","txt":true,"instruction":"Decide which formula counts each arrangement.","how":"Tap an arrangement, then tap the formula that counts it.","boxes":[{"id":"r","label":"`(n - 1)!`"},{"id":"f","label":"`(n - 1)!/2`"},{"id":"l","label":"`n!`"}],"items":[{"id":"i1","t":"6 friends at a round café table","_a":"EkQT","why":"Rotations are the same, but people can’t be flipped.","wrong":{"f":"People at a table can’t be flipped: reversing the order swaps everyone’s left and right.","l":"No seat is special, so rotations are the same."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`(n - 1)!`: rotations are the same, and people facing inward can’t be flipped."]},{"id":"i2","t":"6 different beads on a bracelet","_a":"ElAT","why":"Rotate it or turn it over: it’s the same bracelet.","wrong":{"r":"Turn the bracelet over: it’s the same bracelet.","l":"A bracelet has no first bead: rotations are the same."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`(n - 1)!/2`: a bracelet can be rotated and turned over."]},{"id":"i3","t":"6 people on chairs numbered 1–6 around a table","_a":"EloT","why":"Numbered chairs make every rotation a different seating.","wrong":{"r":"Numbered chairs make rotations different.","f":"Numbered chairs make rotations different, and people can’t be flipped."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`n!`: numbered chairs make it a line."]},{"id":"i4","t":"5 different horses on a carousel (it only turns one way)","_a":"EkQT","why":"A carousel turns, so rotations are the same, but it’s never turned over.","wrong":{"f":"A carousel can’t be flipped over: riders always see it from one side.","l":"A carousel has no first horse: turning it doesn’t change the order."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`(n - 1)!`: it rotates but can’t be flipped."]},{"id":"i5","t":"7 different keys on a key ring","_a":"ElAT","why":"Rotate the ring or turn it over: same key ring.","wrong":{"r":"A key ring can be turned over: divide by 2 as well.","l":"A key ring has no first key: rotations are the same."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`(n - 1)!/2`: a key ring can be rotated and turned over."]},{"id":"i6","t":"8 runners in lanes 1–8","_a":"EloT","why":"Lanes are numbered: that’s a line.","wrong":{"r":"Lanes are numbered: that’s a line, `n!`.","f":"Lanes are numbered: that’s a line, `n!`."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`n!`: numbered lanes make it a line."]},{"id":"i7","t":"5 dancers holding hands in a circle, facing in","_a":"EkQT","why":"Rotations are the same; dancers facing in can’t be flipped.","wrong":{"f":"Dancers facing in can’t be flipped: reversing the order swaps everyone’s left and right.","l":"No place in the circle is special, so rotations are the same."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`(n - 1)!`: rotations are the same, and dancers facing in can’t be flipped."]},{"id":"i8","t":"6 different charms on a necklace","_a":"ElAT","why":"Rotate it or turn it over: same necklace.","wrong":{"r":"Turn the necklace over: it’s the same necklace.","l":"A necklace has no first charm: rotations are the same."},"hints":["Can you rotate it without changing it?","Can you flip it over without changing it?","`(n - 1)!/2`: a necklace can be rotated and turned over."]}]},{"id":"counts","type":"numeric","title":"Circular counts","summary":"Circular counts","star":true,"goal":[1,3,4,5],"instruction":"Fix one person first, then count. The ★ problems go beyond the usual questions; the last two are harder than the Final Check.","how":"Type a whole number, then press Check.","items":[{"id":"c1","goal":1,"prompt":"8 people at a round table","_a":"BQYFBQ==","display":"5040","why":"`(8 - 1)! = 7! = 5040`.","wrong":[{"match":40320,"fb":"Divide by the 8 rotations."}],"hints":["Rotations of a round table are the same seating.","`(n - 1)!` with `n = 8`.","`7! = 5040`."]},{"id":"c2","goal":4,"prompt":"8 people at a round table; the host and the guest of honour sit together","_a":"AQIFBQ==","display":"1440","why":"7 units around the circle: `(7 - 1)! = 720`, × 2 for their order = 1440.","wrong":[{"match":720,"fb":"× 2 for their order."}],"hints":["Glue the host and the guest of honour into one block.","7 units around the circle: `(7 - 1)! = 720`.","× 2 for their order: 1440."]},{"id":"c3","goal":4,"star":true,"prompt":"8 people at a round table; two particular people sit apart","_a":"AwABBQ==","display":"3600","why":"Total − together: 5040 − 1440 = 3600.","general":"5040 − 1440.","hints":["Total − together.","Total `7! = 5040`; together 1440.","5040 − 1440 = 3600."]},{"id":"c4","goal":[4,5],"star":true,"prompt":"4 couples at a round table, each couple together","_a":"CQA=","display":"96","why":"4 blocks around the circle: `(4 - 1)! = 6`; each couple sits 2 ways: 6 × `2^4` = 96.","wrong":[{"match":6,"fb":"Each couple can sit 2 ways: × `2^4` = 16."}],"hints":["Each couple is a block: 4 blocks around the circle.","`(4 - 1)! = 6` for the blocks.","Each block has 2 orders: 6 × 2 × 2 × 2 × 2 = 96."]},{"id":"c5","goal":[3,4],"star":true,"prompt":"A bracelet with 7 different beads where the red and blue beads touch","_a":"AQQB","display":"120","why":"6 units: `(6 - 1)! × 2 = 240` on a table; a bracelet can flip, so 240 ÷ 2 = 120.","wrong":[{"match":240,"fb":"A bracelet can flip: divide by 2."}],"hints":["Glue the red and blue beads into one block: 6 units.","On a table: `(6 - 1)! × 2 = 240`.","A bracelet can flip: 240 ÷ 2 = 120."]},{"id":"c6","goal":5,"star":true,"prompt":"5 teachers and 5 students around a table, alternating","_a":"Ag4JBQ==","display":"2880","why":"Fix one teacher: the other 4 teachers take every second seat in `4!` ways and the students fill the gaps in `5!`: able: everyone keeps the same neighbours. Divide by the 6 rotations.","_n":"1q285","_k":"fc4f7bb7"},{"t":"120 × 2 = 240.","why":"Flipping makes arrangements equal, so divide.","_n":"1r255","_k":"d09c4109"}],"hints":["Can a necklace be turned over?","Yes.","60."]},{"id":"e3","goal":4,"task":"7 people at a round table; Ana and Bo sit together.","steps":["Glue Ana and Bo into one unit: 6 units.","Arrange 6 units around the table: `6! = 720`.","× 2 for Ana–Bo order: 1440."],"_a":"AQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"6 units around a circle: `(6 - 1)! = 120`; × 2 = 240.","why":"Units around a circle: `(m - 1)!`, then × 2 for the order inside the block.","_n":"1s265","_k":"813a3900"},{"t":"`(7 - 1)! = 720`.","why":"That ignores the block.","_n":"1t235","_k":"49682429"},{"t":"Step 2 is correct.","why":"Circles divide out rotations: `(6 - 1)!`.","_n":"1u245","_k":"d94a9b77"},{"t":"`5! = 120` with no × 2.","why":"Ana and Bo can switch.","_n":"1v315","_k":"dd5a326a"}],"hints":["How do you arrange `m` units in a circle?","`(m - 1)!`.","120 × 2 = 240."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you: that a table of people can’t be flipped, or that numbered seats make it a line again?"},{"id":"j2","q":"In your own words, explain why a circle of `n` has `(n - 1)!` arrangements."},{"id":"j3","q":"Explain to a friend how you’d seat 4 couples together at a round table."},{"id":"j4","q":"Which setting (table, ring or numbered seats) do you still mix up? How will you decide next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In how many ways can 7 people sit at a round table?","options":[{"t":"6","why":"`(7 - 1)! = 6!`, not 6.","_n":"1w325","_k":"4302093c"},{"t":"360","why":"A table of people can’t be flipped.","_n":"1xaf5","_k":"1751be89"},{"t":"720","why":"`(7 - 1)! = 720`.","_n":"1yae5","_k":"df43b188"},{"t":"5040","why":"Rotations are the same seating.","_n":"1zb15","_k":"16a760fd"}]},"b":{"p
