.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}

.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 05: hero, Replacement switch (D1 tree, bag, deck, coin, two-way table, D6 simulator), Part 3 stations, Bag designer task */
/* radioGroup (from MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}


/* @component D1 treeDiagram styles (copied from MDM4U 01; marked nodes and leaves get an opaque fill so the path highlight doesn't show through) */
.d1-scroll{overflow:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.d1.bare .d1-scroll{border:0;background:transparent;overflow:visible}
.d1-box{position:relative}
.d1-svg{position:absolute;left:0;top:0}
.d1-e{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.d1-hi{fill:none;stroke:var(--hi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.d1-in{position:absolute;left:0;top:0;right:0;bottom:0}
.d1-root{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
.d1-lab{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 6px;border:1.5px solid var(--ink-2);border-radius:13px;background:var(--sheet);color:var(--ink);font:400 1rem/23px var(--font-math);text-align:center;white-space:nowrap}
.d1-lab.on{border:2px solid var(--sel-bd);background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);color:var(--ink);font-weight:600}
.d1-p{position:absolute;transform:translate(-50%,-50%);font:400 .85rem var(--font-math);color:var(--ink-2);background:var(--sheet);padding:0 2px;white-space:nowrap}
.d1-leaf{position:absolute;transform:translate(-50%,-50%);min-height:30px;min-width:32px;padding:0 .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem/27px var(--font-math);white-space:nowrap}
.d1.right .d1-leaf{transform:translate(0,-50%)}
.d1-leaf.on{background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);border:2px solid var(--sel-bd);color:var(--ink);font-weight:700}
button.d1-leaf:hover{border-color:var(--pen)}
.d1-leaf small{font-size:.8em;color:var(--ink-2)}
.d1-stage{position:absolute;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* colour letters and marbles (blue = --ev-a, yellow shown as teal --ev-b, purple shown as orange --ev-c; always with letters) */
.ix-l{font:700 1em var(--font-ui)}
.ix-l.ix-b{color:var(--ev-a)}.ix-l.ix-y{color:var(--ev-b)}.ix-l.ix-p{color:var(--ev-c)}
.d1-lab .ix-l{font-size:.92em}
.ix-mb{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--sheet);font:700 .85rem var(--font-ui);flex:0 0 auto}
.ix-mb-b{background:var(--ev-a)}.ix-mb-y{background:var(--ev-b)}.ix-mb-p{background:var(--ev-c)}
.ix-mb.ix-lift{animation:ixLift .5s both;outline:3px solid var(--hi);outline-offset:1px}
.ix-mb.ix-in{animation:ixIn .45s both}
@keyframes ixLift{from{transform:translateY(0)}to{transform:translateY(-10px) scale(1.12)}}
@keyframes ixIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.ix-mbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ix-cnts{display:none;flex-wrap:wrap;gap:4px 12px}
.ix-cnt{font:400 1rem var(--font-math)}
@media (max-width:560px){ #ix-bagv .ix-mbs{display:none} #ix-bagv .ix-cnts{display:flex} .ix-mb{width:24px;height:24px;font-size:.78rem} }

/* Explore layout */
.ix-modes{margin-bottom:12px}
.ix-cap{font:400 1.28rem/1.35 var(--font-math);margin:0 0 4px;min-height:1.4em;overflow-wrap:anywhere}
.ix-cap .m{white-space:normal;font-size:1em}
.ix-capw{font:400 .95rem var(--font-ui);color:var(--ink-2)}
.ix-q{font:700 1.05rem var(--font-math);color:var(--ink-2)}
.ix-warn{color:var(--red);font-weight:700}
.ix-pic{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin:2px 0 4px}
.ix-box{flex:1 1 200px;min-width:0;border:1.5px solid var(--rule);border-radius:10px;padding:6px 10px 8px;background:var(--sheet)}
.ix-shelfbox{flex:0 1 110px;border-style:dashed}
.ix-plab{display:block;font-size:.75rem;font-weight:700;color:var(--ink-2);margin:0 0 4px}
.ix-bag,.ix-shelf{min-height:30px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ix-pictxt{margin:2px 0 8px;min-height:1.3em}
.ix-treelab{margin:4px 0 6px}
#ix-tree .d1-leaf small,#tk-tree .d1-leaf small{font-family:var(--font-math)}
.ix-more{font-family:var(--font-ui)!important;font-style:italic}
.ix-fl{display:inline-block;animation:ixFl .9s both;border-radius:4px}
@keyframes ixFl{0%{background:var(--hi);color:var(--hi-ink);transform:scale(1.25)}100%{background:transparent;transform:none}}
.ix-reprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:10px 0 8px}
.ix-switch{display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:.95rem}
.ix-switch input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.ix-track{position:relative;display:inline-block;width:44px;height:26px;border-radius:13px;background:var(--rule);border:1.5px solid var(--ink-2);flex:0 0 auto;transition:background .2s}
.ix-track::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.ix-switch input:checked + .ix-track{background:var(--pen);border-color:var(--pen)}
.ix-switch input:checked + .ix-track::after{left:20px}
.ix-switch input:focus-visible + .ix-track{outline:3px solid var(--hi);outline-offset:2px}
.ix-swfl .ix-switch strong{background:var(--hi-soft);border-radius:4px}
.ix-simrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.ix-check{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;min-height:32px}
.ix-check input{width:18px;height:18px;accent-color:var(--ink)}
#ix-evbag,#ix-evcard{margin-top:4px}
.ix-sl{margin-bottom:8px}
.ix-numlab{display:block;font-weight:700;margin:4px 0 6px}
.ix-numrow{display:flex;align-items:center;gap:6px}
.ix-numrow .numin{width:6.5em;text-align:center}
.ix-numrow .btn{min-width:40px;min-height:40px;font-size:1.1rem}

/* deck grid */
.ix-deckwrap{overflow-x:auto;max-width:100%}
.ix-deck{display:grid;grid-template-columns:1.7em repeat(13,minmax(18px,1fr));gap:2px;font:400 .8rem var(--font-ui)}
.ix-dh{text-align:center;font-weight:700;color:var(--ink-2);font-size:.72rem}
.ix-ds{display:flex;align-items:center;gap:1px;font-size:.95rem;color:var(--ink);white-space:nowrap}
.ix-ds b{font:700 .8rem var(--font-ui)}
.ix-cd{display:grid;place-items:center;min-height:26px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink)}
.ix-red{color:var(--red)}
.ix-cd.on{background:var(--hi-soft);border:2px solid var(--sel-bd);font-weight:700}
.ix-cd.ix-ra{background:var(--ev-a-soft);border-color:var(--ev-a)}
.ix-cd.ix-rb{background:var(--ev-b-soft);border-color:var(--ev-b)}
.ix-cd.ix-pulse{animation:ixPulse .8s both}
@keyframes ixPulse{0%{box-shadow:0 0 0 0 var(--hi)}50%{box-shadow:0 0 0 3px var(--hi)}100%{box-shadow:0 0 0 0 transparent}}
.ix-cd.ix-gone{opacity:.35;text-decoration:line-through}

/* coin */
.ix-coins{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ix-coin{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);font:700 1rem var(--font-math)}
.ix-coin.ix-next{width:auto;min-width:46px;padding:0 10px;border-radius:19px;background:var(--sheet);color:var(--ink);border-style:dashed}
.ix-cbar{position:relative;height:22px;border:1.5px solid var(--ink);border-radius:6px;background:var(--ev-b-soft);overflow:hidden;margin-top:6px}
.ix-cbar i{display:block;height:100%;background:var(--pen)}
.ix-cmark{position:absolute;left:50%;top:-2px;bottom:-2px;border-left:2px dashed var(--ink)}
.ix-cleg{display:flex;justify-content:space-between;margin:2px 0 6px}

/* two-way tables (Explore and Part 3) */
.ix-twcap{font-weight:700;margin:4px 0 6px}
table.ix-tw{border-collapse:collapse;margin:0 0 8px;font-size:.95rem}
table.ix-tw th,table.ix-tw td{border:1px solid var(--rule);padding:6px 10px;text-align:center}
table.ix-tw thead th{font-size:.85rem;color:var(--ink-2)}
table.ix-tw tbody th{text-align:left;font-weight:700}
table.ix-tw td{font:400 1.05rem var(--font-math);min-width:3.2em}
table.ix-tw .ix-tot td,table.ix-tw .ix-tot th{border-top:2px solid var(--ink)}
table.ix-tw td.ix-now,table.ix-tw td.ix-used{background:var(--hi-soft)}
table.ix-tw td.ix-now{outline:2px solid var(--sel-bd);outline-offset:-2px;font-weight:700}
table.ix-tw tr.ix-dim{opacity:.4}
.ix-neg{color:var(--red);font-weight:700}

/* Part 3 */
.tw-st{margin-bottom:12px}
.tw-station h3{margin-top:4px}
.tw-leg i.sw{width:16px;height:12px;border-radius:2px;vertical-align:-1px}
.tw-leg i.sw.dash{width:18px;height:3px;border-radius:0;background:repeating-linear-gradient(90deg,var(--ink-2) 0 6px,transparent 6px 10px)}
.ix-more{font-size:.78em!important}
.legend.tiny{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.tw-steps{margin:10px 0 6px;padding-left:1.4em;display:grid;gap:6px}
.tw-steps li{padding-left:2px}
.tw-steps .tw-intro{list-style:none;margin-left:-1.4em;color:var(--ink-2)}
.tw-steps .m{white-space:normal}

/* task */
.ix-conds{margin:.4em 0 .8em;padding-left:1.4em}
.tk-in{margin:4px 0 12px}
.tk-read{margin-bottom:10px}
.tk-treelab{margin:0 0 6px}

/* hero */
.ixh{display:grid;gap:6px;justify-items:stretch;max-width:420px;margin:0 auto}
.ixh-top{display:flex;gap:8px}
.ixh-bagbox{flex:1 1 auto;border:1.5px solid var(--rule);border-radius:10px;padding:6px 10px;background:var(--sheet)}
.ixh-shelfbox{flex:0 0 96px;border:1.5px dashed var(--rule);border-radius:10px;padding:6px 10px}
.ixh-lab{display:block;font-size:.72rem;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.ixh-bag,.ixh-shelf{display:flex;flex-wrap:wrap;gap:4px;min-height:28px;align-items:center}
.ixh .ix-mbs{display:flex!important}.ixh .ix-cnts{display:none!important}
.ixh-sw{margin:0;font-size:.9rem;display:flex;align-items:center;gap:8px}
.ixh-swi{position:relative;display:inline-block;width:36px;height:20px;border-radius:10px;background:var(--rule);border:1.5px solid var(--ink-2)}
.ixh-swi::after{content:"";position:absolute;top:1px;left:1px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .3s}
.ixh-swi.on{background:var(--pen);border-color:var(--pen)}
.ixh-swi.on::after{left:17px}
.ixh-tree{width:100%}
.ixh-old{text-decoration:line-through;color:var(--ink-2);margin-right:.4em}

. The scene rewinds: this time the blue marble is set aside, the bag shrinks to 4, the branch updates to 2/4, and P(both blue) changes to 3/10.\">\u003cdiv class=\"ixh-top\" aria-hidden=\"true\">\u003cdiv class=\"ixh-bagbox\">\u003cspan class=\"ixh-lab\">Bag\u003c/span>\u003cdiv class=\"ixh-bag\" id=\"ixh-bag\">\u003c/div>\u003c/div>\u003cdiv class=\"ixh-shelfbox\">\u003cspan class=\"ixh-lab\">Set aside\u003c/span>\u003cdiv class=\"ixh-shelf\" id=\"ixh-shelf\">\u003c/div>\u003c/div>\u003c/div>\u003cp class=\"ixh-sw\" id=\"ixh-sw\" aria-hidden=\"true\">\u003c/p>\u003cdiv class=\"ixh-tree\" id=\"ixh-tree\" aria-hidden=\"true\">\u003c/div>\u003c/div>"}},"goals":["I can decide whether two events are independent or dependent.","I can find `P(A and B)` for independent events by multiplying.","I can find `P(A and B)` for dependent events by updating the second probability.","I can use tree diagrams for draws with and without replacement, including “one of each”.","I can test for independence with data by comparing `P(A and B)` with `P(A) × P(B)`.","I can explain why mutually exclusive events (with non-zero probabilities) aren’t independent."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Multiplying fractions","goal":2,"prompt":"What is `3/5 × 2/4`?","options":[{"t":"`3/10`","why":"`6/20 = 3/10`.","_n":"0d53","_k":"c9fbf03e"},{"t":"`5/9`","why":"Multiply top × top, bottom × bottom.","_n":"1d43","_k":"f34b80f9"},{"t":"`22/20`","why":"`3/5 + 2/4` is “or”-style adding.","_n":"2d33","_k":"e446b3e5"},{"t":"`6/5`","why":"That’s `3/5 × 2`.","_n":"3da3","_k":"c75f69ba"}],"hints":["Multiply the numerators, then the denominators.","`6/20`.","`3/10`."]},{"id":"w2","skill":"Multiplying fractions","goal":2,"prompt":"What is `1/2 × 1/6`?","options":[{"t":"`1/12`","why":"1 × 1 over 2 × 6.","_n":"4d93","_k":"fe8a98b6"},{"t":"`1/8`","why":"2 × 6 = 12.","_n":"5d83","_k":"2b7d7b21"},{"t":"`1/3`","why":"6 ÷ 2 isn’t the product.","_n":"6d73","_k":"5681ff55"},{"t":"`2/3`","why":"That’s `1/2 + 1/6`.","_n":"7de3","_k":"b64a5eba"}],"hints":["Multiply across.","1 × 1 over 2 × 6.","`1/12`."]},{"id":"w3","skill":"Counting what’s left","goal":3,"prompt":"A bag has 5 blue and 3 yellow marbles. One blue marble is removed. What is \u003ci>P\u003c/i>(blue) for the next draw?","options":[{"t":"`4/8`","why":"The total also dropped to 7.","_n":"8dd3","_k":"aa856fa8"},{"t":"`4/7`","why":"4 blue left among 7.","_n":"9c3e","_k":"c98505a6"},{"t":"`5/8`","why":"The bag changed.","_n":"ac4e","_k":"ffb0519e"},{"t":"`5/7`","why":"One blue is gone.","_n":"bc1e","_k":"13d15520"}],"hints":["How many blue are left?","4.","4 of 7."]},{"id":"w4","skill":"Counting what’s left","goal":4,"prompt":"From a standard deck, an ace is drawn and not replaced. What is \u003ci>P\u003c/i>(ace) for the next card?","options":[{"t":"`3/52`","why":"The deck has 51 cards now.","_n":"cc2e","_k":"0f9cbaf6"},{"t":"`3/51`","why":"3 aces left among 51.","_n":"dbfe","_k":"7e952dad"},{"t":"`4/52`","why":"After an ace is drawn, only 3 aces are left among 51 cards: `3/51`, not `4/52`.","_n":"ec0e","_k":"c154d0fe"},{"t":"`4/51`","why":"One ace is gone.","_n":"fbde","_k":"583741ba"}],"hints":["How many aces are left?","How many cards?","`3/51`."]},{"id":"w5","skill":"“And” vs “or”","goal":6,"prompt":"Events `A` and `B` are mutually exclusive. What is `P(A and B)`?","options":[{"t":"`P(A) × P(B)`","why":"That’s for independent events.","_n":"gbee","_k":"b619d8fe"},{"t":"`1`","why":"1 means certain.","_n":"hcbe","_k":"0b2ab841"},{"t":"`P(A) + P(B)`","why":"That’s `P(A or B)` for these events.","_n":"icce","_k":"9ecdd319"},{"t":"`0`","why":"They can’t happen together.","_n":"jbde","_k":"f337a3a1"}],"hints":["What does mutually exclusive mean?","No outcome is in both.","0."]},{"id":"w6","skill":"“And” vs “or”","goal":2,"prompt":"A coin is flipped and a die is rolled. Which is \u003ci>P\u003c/i>(heads and a 6)?","options":[{"t":"`1/12`","why":"`1/2 × 1/6`, or 1 of the 12 outcomes.","_n":"kbce","_k":"95ba94ab"},{"t":"`1/8`","why":"There are 12 outcomes, not 8.","_n":"lbbe","_k":"e41d408e"},{"t":"`1/6`","why":"That ignores the coin.","_n":"mbae","_k":"59381dbc"},{"t":"`2/3`","why":"`1/2 + 1/6` adds.","_n":"nc1e","_k":"54b74184"}],"hints":["List the 12 outcomes (module 01).","Only H6 works.","`1/12`."]}],"refreshers":{"Multiplying fractions":"Multiply numerators and denominators; simplify at the end.","Counting what’s left":"Without replacement, subtract one from the drawn colour \u003cstrong>and\u003c/strong> one from the total.","“And” vs “or”":"“Or” (at least one) uses the additive principle. “And” (both) uses multiplication, with an update if the events are dependent."}}},"explore":{"heading":"Replacement switch","intro":"Fill a bag, draw twice, and flip the replacement switch. Watch the tree’s second branches, and the answer, change.","predIntro":"Make a prediction first. Then the replacement switch will show you what really happens.","predictions":[{"id":"p1","prompt":"Bag: 3 blue, 2 yellow, with replacement. What is \u003ci>P\u003c/i>(both blue)?","options":[{"t":"`3/10`","_n":"oc0e","_k":"4b2e02d4"},{"t":"`9/25`","_n":"pbfe","_k":"ddbbbd49"},{"t":"`3/5`","_n":"qbee","_k":"da48ee9c"},{"t":"`6/5`","_n":"rc5e","_k":"5b962224"}],"explain":"Independent draws: `3/5 × 3/5`. `6/5` adds, which can’t be right because it’s more than 1."},{"id":"p2","prompt":"Same bag, without replacement. Now what is \u003ci>P\u003c/i>(both blue)?","options":[{"t":"`3/10`","_n":"sc4e","_k":"b4a4e3c7"},{"t":"`9/25`","_n":"tb7e","_k":"311d32e7"},{"t":"`2/5`","_n":"ub8e","_k":"a9187b11"},{"t":"`6/5`","_n":"vb9e","_k":"138766fb"}],"explain":"`3/5 × 2/4 = 3/10`."},{"id":"p3","prompt":"The cards are replaced by a coin, and the history shows H H H H H. What is \u003ci>P\u003c/i>(heads) on the next flip?","options":[{"t":"More than `1/2`: heads is hot","_n":"wbae","_k":"e2aa9e42"},{"t":"`1/2`","_n":"xbbe","_k":"a4981305"},{"t":"Less than `1/2`: tails is due","_n":"ybce","_k":"585d1b96"},{"t":"`1/64`","_n":"zbde","_k":"a4935a3e"}],"explain":"Flips are independent; the coin has no memory."},{"id":"p4","prompt":"Cards: `A` = first card is a heart, `B` = first card is a spade (same card). `A` and `B` are mutually exclusive. Are they independent?","options":[{"t":"You can’t tell","_n":"10bee","_k":"a1cecfd4"},{"t":"Yes: they don’t overlap","_n":"11bfe","_k":"566c94ae"},{"t":"Yes: always","_n":"12c0e","_k":"e9cdc158"},{"t":"No: if `A` happens, `P(B)` becomes 0","_n":"13c1f","_k":"aa0e71c6"}],"explain":"`P(A and B) = 0`, but `P(A) × P(B) = 1/16`. 0 ≠ `1/16`, so dependent."}],"chalIntro":"Set up the replacement switch, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"With replacement and no purple, set the bag so \u003ci>P\u003c/i>(both blue) = `1/4`.","why":"Equal blue and yellow makes \u003ci>P\u003c/i>(blue) = `1/2` on each draw, and `(1/2)^2 = 1/4`.","hints":["`1/4 = (1/2)^2`.","You need \u003ci>P\u003c/i>(blue) = `1/2` on each draw.","Equal blue and yellow, e.g. 3 and 3."]},{"id":"tc2","goal":[3,4],"prompt":"Without replacement and no purple, set the bag so \u003ci>P\u003c/i>(both blue) = `1/5`.","why":"`3/6 × 2/5 = 1/5`. Another works too: 7 blue and 8 yellow, since `7/15 × 6/14 = 1/5`.","hints":["\u003ci>P\u003c/i>(both blue) = `(b/n) × ((b - 1)/(n - 1))`.","Try equal counts first: 3 and 3.","`3/6 × 2/5 = 1/5`. Another works too: 7 blue and 8 yellow."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Two-way table mode: 200 students; 120 play a sport and 80 have a part-time job. Enter the number who do both so that “plays a sport” and “has a job” are independent.","why":"48 of 200 is 0.24, which equals \u003ci>P\u003c/i>(sport) × \u003ci>P\u003c/i>(job) = 0.6 × 0.4.","hints":["Independent means \u003ci>P\u003c/i>(both) = \u003ci>P\u003c/i>(sport) × \u003ci>P\u003c/i>(job).","0.6 × 0.4 = 0.24.","0.24 × 200 = 48."]}]},"part3":{"slug":"test","name":"Test it","heading":"Test for independence","intro":"Real situations come as data, not marbles. At each station, make your call, then step through the test: compare `P(A and B)` with `P(A) × P(B)`. The square shows the same test as areas.","stations":[{"id":"s1","chip":"1. Grade and phone brand","title":"Station 1: independent data","text":"100 students by grade (11 or 12) and phone brand (X or Y).","rowA":"Grade 12","rowNotA":"Grade 11","colB":"Brand X","colNotB":"Brand Y","a":"G12","b":"X","total":100,"nA":50,"nB":60,"nAB":30,"verdict":"\u003ci>P\u003c/i>(G12) × \u003ci>P\u003c/i>(X) = 0.5 × 0.6 = 0.30 = \u003ci>P\u003c/i>(both). \u003cstrong>Independent:\u003c/strong> knowing the grade tells you nothing about the brand."},{"id":"s2","chip":"2. Breakfast and on time","title":"Station 2: dependent data","text":"200 students: who ate breakfast, and who arrived on time.","rowA":"Ate breakfast","rowNotA":"No breakfast","colB":"On time","colNotB":"Late","a":"breakfast","b":"on time","total":200,"nA":120,"nB":150,"nAB":100,"verdict":"0.6 × 0.75 = 0.45, but \u003ci>P\u003c/i>(both) = 0.50, so the events are \u003cstrong>dependent\u003c/strong>.","note":"Dependent isn’t the same as “causes” (module 38)."},{"id":"s3","chip":"3. Check it with algebra","title":"Station 3: check it with algebra","data":"s2","text":"Station 2 again, by a second route: compare \u003ci>P\u003c/i>(on time \u003cstrong>after\u003c/strong> knowing breakfast) with \u003ci>P\u003c/i>(on time).","steps":["Look only at the 120 students who ate breakfast: 100 of them arrived on time. \u003ci>P\u003c/i>(on time after knowing breakfast) = `100/120 = 5/6`.","Now look at everyone: \u003ci>P\u003c/i>(on time) = `150/200 = 3/4`.","`5/6 ≠ 3/4`. Different, so \u003cstrong>dependent\u003c/strong>; the same verdict as station 2, by a second route."],"alg":["\u003ci>P\u003c/i>(on time after knowing breakfast) = `100/120 = 5/6`","\u003ci>P\u003c/i>(on time) = `150/200 = 3/4`","`5/6 ≠ 3/4` \u003csmall>Knowing about breakfast changes the probability, so the events are dependent.\u003c/small>"]}],"quickCheck":{"title":"Quick check","summary":"Test for independence quick check","items":[{"id":"q1","goal":5,"prompt":"`P(A) = 0.5`, `P(B) = 0.4`, `P(A and B) = 0.2`. Independent?","right":"Right. 0.5 × 0.4 = 0.2 matches.","wrong":"0.5 × 0.4 = 0.2 matches.","choices":[{"t":"Yes","_n":"14c0f","_k":"8ac94c10"},{"t":"No","_n":"15c3f","_k":"9cf411d9"},{"t":"Only if mutually exclusive","_n":"16c2f","_k":"be8f9657"},{"t":"You can’t tell","_n":"17bdf","_k":"a552737f"}]},{"id":"q2","goal":5,"prompt":"`P(A) = 0.3`, `P(B) = 0.5`, `P(A and B) = 0.1`. Independent?","right":"Right. 0.3 × 0.5 = 0.15 ≠ 0.1.","wrong":"0.3 × 0.5 = 0.15 ≠ 0.1.","choices":[{"t":"Yes","_n":"18bcf","_k":"6eeec51b"},{"t":"No","_n":"19bff","_k":"88242030"},{"t":"Only if mutually exclusive","_n":"1abef","_k":"be9a09cc"},{"t":"You can’t tell","_n":"1bc9f","_k":"2a79ed14"}]},{"id":"q3","goal":1,"prompt":"Two cards drawn without replacement: are “first is an ace” and “second is an ace” independent?","right":"Right. If the first is an ace, \u003ci>P\u003c/i>(second ace) is `3/51`, not `4/52`.","wrong":"If the first is an ace, \u003ci>P\u003c/i>(second ace) is `3/51`, not `4/52`.","choices":[{"t":"Yes","_n":"1cc8f","_k":"367d94c4"},{"t":"No","_n":"1d3bf","_k":"7ca7e60e"},{"t":"Only for hearts","_n":"1e3cf","_k":"4e0dd0c9"},{"t":"You can’t tell","_n":"1f39f","_k":"9faf22a0"}]},{"id":"q4","goal":5,"prompt":"In station 2, what is \u003ci>P\u003c/i>(on time) among those who ate breakfast?","right":"Right. 100 of the 120 breakfast-eaters: `100/120 = 5/6`.","wrong":"100 of the 120 breakfast-eaters. `2/3` is breakfast among the on-time students, the reverse.","choices":[{"t":"`1/2`","_n":"1g3af","_k":"47b296e5"},{"t":"`2/3`","_n":"1h3ff","_k":"4e92fad9"},{"t":"`3/4`","_n":"1i40f","_k":"bf1cdbd3"},{"t":"`5/6`","_n":"1j3df","_k":"acb17252"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Independent or dependent?","summary":"Independent or dependent?","goal":1,"noun":"pair of events","txt":true,"instruction":"Decide whether each pair of events is independent or dependent.","boxes":[{"id":"ind","label":"Independent","sub":"one doesn’t change the other"},{"id":"dep","label":"Dependent","sub":"one changes the other’s probability"}],"items":[{"id":"i1","t":"Flip a coin; then roll a die","_a":"El5WUBE=","why":"The coin can’t affect the die.","wrong":{"dep":"The coin can’t affect the die."}},{"id":"i2","t":"Draw a card, keep it, draw another: both aces","_a":"ElNdRBE=","why":"The second draw has 51 cards.","wrong":{"ind":"The second draw has 51 cards."}},{"id":"i3","t":"Draw a card, replace it, shuffle, draw again","_a":"El5WUBE=","why":"The deck is restored.","wrong":{"dep":"The deck is restored."}},{"id":"i4","t":"Roll a die twice: first is 6, second is 6","_a":"El5WUBE=","why":"Dice have no memory.","wrong":{"dep":"Dice have no memory."}},{"id":"i5","t":"Pick 2 marbles at once from a bag","_a":"ElNdRBE=","why":"At once is the same as without replacement.","wrong":{"ind":"At once is the same as without replacement."}},{"id":"i6","t":"Spin a spinner; flip a coin","_a":"El5WUBE=","why":"Separate devices.","wrong":{"dep":"Separate devices."}},{"id":"i7","goal":6,"t":"One card: “heart” and “spade”","_a":"ElNdRBE=","why":"Mutually exclusive, so dependent.","wrong":{"ind":"Mutually exclusive, so dependent."}},{"id":"i8","t":"One card: “heart” and “red”","_a":"ElNdRBE=","why":"\u003ci>P\u003c/i>(red given heart) = 1, not `1/2`.","wrong":{"ind":"\u003ci>P\u003c/i>(red given heart) = 1, not `1/2`."}},{"id":"i9","t":"Two different, randomly chosen students: both born in March","_a":"El5WUBE=","why":"One birthday doesn’t affect the other.","wrong":{"dep":"One birthday doesn’t affect the other."}},{"id":"i10","t":"One card: “heart” and “king”","_a":"El5WUBE=","why":"\u003ci>P\u003c/i>(K♥) = `1/52 = 1/4 × 1/13`. They seem related, but the numbers say independent.","wrong":{"dep":"\u003ci>P\u003c/i>(K♥) = `1/52 = 1/4 × 1/13`. They seem related, but the numbers say independent."},"hints":["Compute \u003ci>P\u003c/i>(heart and king).","`1/52`.","Compare with `1/4 × 1/13 = 1/52`: equal."]}]},{"id":"calc","type":"numeric","title":"Calculate it","summary":"Calculate it","star":true,"goal":[2,3,4],"instruction":"Find each probability. Give a fraction (an equivalent fraction is fine) or a decimal.","how":"Type a fraction such as 8/15 or a decimal such as 0.84, then press Check.","items":[{"id":"s1","goal":2,"prompt":"A die and a coin: \u003ci>P\u003c/i>(even and heads)","_a":"ABkKAQ==","tol":0.00005,"display":"`1/4`","why":"`3/6 × 1/2 = 1/4`.","wrong":[{"match":1,"fb":"“And” (both) is smaller than either event, so it can’t be found by adding."}]},{"id":"s2","goal":3,"prompt":"A bag of 4 blue and 6 yellow; two draws without replacement: \u003ci>P\u003c/i>(both yellow)","_a":"ABkLBwBQUQoDBAsHAFBRCgME","tol":0.00005,"display":"`1/3`","why":"`6/10 × 5/9 = 30/90 = 1/3`.","wrong":[{"match":0.36,"fb":"After a yellow, 5 of 9 are yellow."}]},{"id":"s3","goal":4,"star":true,"prompt":"Same bag, without replacement: \u003ci>P\u003c/i>(one of each colour)","_a":"ABkNBwBQUQoDBAsHAFBRCgME","tol":0.00005,"display":"`8/15`","why":"`4/10 × 6/9 + 6/10 × 4/9 = 48/90 = 8/15`.","wrong":[{"match":0.26666666666666666,"fb":"Add yellow-then-blue: `24/90 + 24/90`."}],"hints":["Two paths: BY and YB.","`4/10 × 6/9` and `6/10 × 4/9`.","`48/90 = 8/15`."]},{"id":"s4","goal":4,"star":true,"prompt":"Same bag, without replacement: \u003ci>P\u003c/i>(at least one blue)","_a":"ABkOAgVVVA8GAQ4CBVVUDwYB","tol":0.00005,"display":"`2/3`","why":"1 − \u003ci>P\u003c/i>(both yellow) = `1 - 1/3 = 2/3`.","general":"1 − \u003ci>P\u003c/i>(both yellow) = `1 - 1/3`."},{"id":"s5","goal":3,"star":true,"prompt":"Two cards without replacement: \u003ci>P\u003c/i>(both aces)","_a":"ABkIBAdWUA0IDw4MBFRaCwgHDQE=","tol":0.00005,"display":"`1/221`","why":"`4/52 × 3/51 = 12/2652 = 1/221`.","wrong":[{"match":0.005917159763313609,"fb":"`4/52 × 3/51 = 12/2652`."}]},{"id":"s6","goal":2,"star":true,"prompt":"A spinner lands on A with probability `q`; spins are independent. \u003ci>P\u003c/i>(A twice in a row) = 0.36. What is \u003ci>P\u003c/i>(at least one A in two spins)?","_a":"ABkAAA==","tol":0.00005,"display":"0.84","why":"`q = 0.6`, so \u003ci>P\u003c/i>(no A twice) = `0.4^2 = 0.16` and `1 - 0.16 = 0.84`.","wrong":[{"match":0.6,"fb":"`q = 0.6`, so \u003ci>P\u003c/i>(no A twice) = `0.4^2 = 0.16` and `1 - 0.16 = 0.84`."}],"hints":["`q^2 = 0.36`.","`q = 0.6`, so \u003ci>P\u003c/i>(not A) = 0.4.","`1 - 0.4 × 0.4 = 0.84`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Edwin","how":"","goal":[3,4,6],"instruction":"Edwin made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"A bag has 5 blue and 3 yellow marbles. Two are drawn without replacement. Find \u003ci>P\u003c/i>(both blue).","steps":["\u003ci>P\u003c/i>(first blue) = `5/8`.","\u003ci>P\u003c/i>(second blue) = `5/8`.","\u003ci>P\u003c/i>(both blue) = `5/8 × 5/8 = 25/64`."],"_a":"AQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. Look earlier."],"fixes":[{"t":"After a blue, 4 blue remain among 7: `5/8 × 4/7 = 20/56 = 5/14`.","why":"After a blue marble is drawn, only 4 blue are left among 7 marbles: `4/7`, not `5/8`.","_n":"1k3ef","_k":"a6cb1402"},{"t":"Use `5/8 + 4/7`.","why":"“And” (both) is smaller than either event, so it can’t be found by adding.","_n":"1l43f","_k":"8d93292d"},{"t":"Use `5/8 × 4/8`.","why":"The total dropped too.","_n":"1m44f","_k":"70c19f03"},{"t":"Step 2 is correct.","why":"Without replacement, the second draw depends on the first.","_n":"1n55f","_k":"f9382382"}],"hints":["What’s in the bag after a blue is drawn?","4 blue, 3 yellow.","`5/8 × 4/7 = 5/14`."]},{"id":"e2","goal":6,"task":"`A` and `B` are mutually exclusive, `P(A) = 0.3`, `P(B) = 0.4`. Find `P(A and B)`.","steps":["Mutually exclusive events don’t overlap.","So `A` and `B` are independent.","`P(A and B) = 0.3 × 0.4 = 0.12`."],"_a":"AQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. Look earlier."],"fixes":[{"t":"`P(A and B) = 0.4 - 0.3`.","why":"That has no meaning here.","_n":"1o54f","_k":"00f5ae36"},{"t":"`P(A and B) = 0.3 + 0.4 = 0.7`.","why":"That’s `P(A or B)`.","_n":"1p53f","_k":"320de736"},{"t":"Step 2 is correct.","why":"Mutually exclusive events can’t happen together, so if `A` happens, `P(B)` becomes 0. That’s dependence.","_n":"1q52f","_k":"f0c8ee4a"},{"t":"Not overlapping means they can’t happen together: `P(A and B) = 0`. Because 0 ≠ 0.12, they’re dependent.","why":"They can’t both happen, so `P(A and B) = 0`, and knowing `A` happened makes `B` impossible.","_n":"1r51f","_k":"b6598075"}],"hints":["Can `A` and `B` both happen?","No.","0."]},{"id":"e3","goal":4,"task":"A bag has 2 blue and 3 yellow. Two are drawn without replacement. Find \u003ci>P\u003c/i>(one of each colour).","steps":["\u003ci>P\u003c/i>(blue first) = `2/5`.","\u003ci>P\u003c/i>(yellow second, after a blue) = `3/4`.","So \u003ci>P\u003c/i>(one of each) = `2/5 × 3/4 = 3/10`."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"Step 3 is correct.","why":"One of each can happen in two orders.","_n":"1s50f","_k":"febeadbe"},{"t":"Add the yellow-first path: `3/5 × 2/4 = 3/10`. Total `3/10 + 3/10 = 3/5`.","why":"Blue then yellow, or yellow then blue: add both paths.","_n":"1t4ff","_k":"55fe5f57"},{"t":"Double `2/5`: `4/5`.","why":"Doubling the first branch isn’t a path.","_n":"1u4ef","_k":"1d027abe"},{"t":"Use `2/5 × 3/5 = 6/25`.","why":"That puts the marble back. Without replacement, the second branch is `3/4`.","_n":"1v4df","_k":"ed2fae0c"}],"hints":["Is blue-then-yellow the only way to get one of each?","Yellow-then-blue too.","`3/10 + 3/10 = 3/5`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: that the overall \u003ci>P\u003c/i>(second blue) never changed, or that heart and king are independent?"},{"id":"j2","q":"In your own words, what makes two events independent?"},{"id":"j3","q":"Explain to a friend how to build the tree for drawing two marbles without replacement."},{"id":"j4","q":"Which do you still mix up: mutually exclusive or independent? How will you tell them apart next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which pair of events is independent?","options":[{"t":"Choosing two different students, one after the other, for two roles from the same small group: “first is in Grade 12” and “second is in Grade 12”","why":"The first choice changes who’s left.","_n":"1w4cf","_k":"e72b8662"},{"t":"Rolling a 6 on a die, then flipping heads on a coin","why":"Separate devices.","_n":"1x4ff","_k":"8e0a2fc3"},{"t":"Drawing an ace, then another ace, without replacement","why":"After an ace is drawn, only 3 aces are left among 51 cards, so the second draw depends on the first.","_n":"1y50f","_k":"cd3bcb50"},{"t":"Drawing a heart and drawing a red card, on the same draw","why":"\u003ci>P\u003c/i>(red given heart) = 1.","_n":"1z51f","_k":"d88775ba"}]},"b":{"prompt":"Which pair of events is dependent?","options":[{"t":"Rolling two dice: first even, second even","why":"Separate dice.","_n":"2052f","_k":"60a3f752"},{"t":"Flipping two coins: first heads, second heads","why":"The coin doesn’t remember. \u003ci>P\u003c/i>(heads) is still `1/2`.","_n":"214bf","_k":"6dfedfdc"},{"t":"Drawing two marbles without replacement: first blue, second blue","why":"The first marble isn’t put back, so it changes what’s left for the second draw.","_n":"224cf","_k":"33b500f9"},{"t":"Spinning a spinner twice: first A, second A","why":"The spinner doesn’t remember: each spin has the same probabilities.","_n":"234df","_k":"2c848f78"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A die is rolled and a coin is flipped. What is \u003ci>P\u003c/i>(a number greater than 4 and tails)?","options":[{"t":"`1/12`","why":"“Greater than 4” is 5 or 6: `2/6`, not `1/6`.","_n":"244ef","_k":"806dfda6"},{"t":"`1/6`","why":"`2/6 × 1/2`.","_n":"2547f","_k":"e378b7c6"},{"t":"`1/2`","why":"That ignores the die.","_n":"2648f","_k":"9dd00a5d"},{"t":"`5/6`","why":"`1/3 + 1/2` adds.","_n":"273a0","_k":"9a5d3fea"}]},"b":{"prompt":"A die is rolled and a coin is flipped. What is \u003ci>P\u003c/i>(an even number and heads)?","options":[{"t":"`1/12`","why":"Even is 2, 4 or 6: `3/6`.","_n":"28390","_k":"debaf321"},{"t":"`1/4`","why":"`3/6 × 1/2`.","_n":"293c0","_k":"c4de0c85"},{"t":"`1/2`","why":"That ignores the die.","_n":"2a3b0","_k":"b36ce45b"},{"t":"`1`","why":"`1/2 + 1/2`.","_n":"2b3e0","_k":"d0dbbaa3"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"`A` and `B` are mutually exclusive with `P(A) = 0.2` and `P(B) = 0.5`. Which is true?","options":[{"t":"`P(A and B) = 0.7`","why":"“And” (both) is smaller than either event, so it can’t be found by adding.","_n":"2c3d0","_k":"9445dd93"},{"t":"`P(A and B) = 0`, so `A` and `B` are dependent","why":"0 ≠ 0.2 × 0.5.","_n":"2d400","_k":"8028e17e"},{"t":"They’re independent because they don’t overlap","why":"Mutually exclusive events can’t happen together, so if `A` happens, `P(B)` becomes 0. That’s dependence.","_n":"2e3f0","_k":"c0523c1b"},{"t":"`P(A and B) = 0.1`, so they’re independent","why":"Mutually exclusive events can’t happen together, so if `A` happens, `P(B)` becomes 0. That’s dependence.","_n":"2f420","_k":"6fd5e3c1"}]},"b":{"prompt":"`A` and `B` are mutually exclusive with `P(A) = 0.25` and `P(B) = 0.6`. Which is true?","options":[{"t":"They’re independent because they don’t overlap","why":"Mutually exclusive events can’t happen together, so if `A` happens, `P(B)` becomes 0. That’s dependence.","_n":"2g410","_k":"7f933443"},{"t":"`P(A and B) = 0`, so `A` and `B` are dependent","why":"0 ≠ 0.25 × 0.6.","_n":"2hd40","_k":"b381f4c6"},{"t":"`P(A and B) = 0.85`","why":"“And” (both) is smaller than either event, so it can’t be found by adding.","_n":"2id50","_k":"a05eb121"},{"t":"`P(A and B) = 0.15`, so they’re independent","why":"Mutually exclusive events can’t happen together, so if `A` happens, `P(B)` becomes 0. That’s dependence.","_n":"2jd20","_k":"66770aed"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A bag has 4 blue and 6 yellow marbles. Two are drawn without replacement. What is \u003ci>P\u003c/i>(both blue)?","options":[{"t":"`2/15`","why":"`4/10 × 3/9 = 12/90`.","_n":"2kd30","_k":"19d7d30a"},{"t":"`4/25`","why":"`4/10 × 4/10` replaces the marble.","_n":"2ld00","_k":"ce0504c9"},{"t":"`8/45`","why":"`4/10 × 4/9` forgets that a blue was removed.","_n":"2md10","_k":"09200511"},{"t":"`4/5`","why":"`4/10 + 4/10` adds.","_n":"2nce0","_k":"dacc3407"}]},"b":{"prompt":"A bag has 5 blue and 5 yellow marbles. Two are drawn without replacement. What is \u003ci>P\u003c/i>(both yellow)?","options":[{"t":"`2/9`","why":"`5/10 × 4/9 = 20/90`.","_n":"2ocf0","_k":"e548fa02"},{"t":"`1/4`","why":"`5/10 × 5/10` replaces the marble.","_n":"2pcc0","_k":"dddeaa43"},{"t":"`5/18`","why":"`5/10 × 5/9`: if the first marble was yellow, take one away from yellow \u003cstrong>and\u003c/strong> from the total.","_n":"2qcd0","_k":"646cea3d"},{"t":"`1`","why":"`5/10 + 5/10` adds. “And” (both) is smaller than either event, so it can’t be found by adding.","_n":"2r031","_k":"a0da34e3"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A bag has 3 blue and 2 yellow marbles. Two are drawn without replacement. What is \u003ci>P\u003c/i>(one of each colour)?","options":[{"t":"`6/25`","why":"One order, with replacement.","_n":"2s041","_k":"8710d009"},{"t":"`3/10`","why":"That’s only blue then yellow.","_n":"2t011","_k":"b4688a17"},{"t":"`12/25`","why":"`2 × 3/5 × 2/5` replaces the marble.","_n":"2u021","_k":"639e8a39"},{"t":"`3/5`","why":"`3/5 × 2/4 + 2/5 × 3/4 = 6/20 + 6/20`.","_n":"2v071","_k":"de6e93b0"}]},"b":{"prompt":"A bag has 4 blue and 2 yellow marbles. Two are drawn without replacement. What is \u003ci>P\u003c/i>(one of each colour)?","options":[{"t":"`2/9`","why":"One order, with replacement.","_n":"2w081","_k":"c08f7851"},{"t":"`4/15`","why":"That’s only one order. Blue then yellow, or yellow then blue: add both paths.","_n":"2x051","_k":"263a0c3f"},{"t":"`4/9`","why":"`2 × 4/6 × 2/6` replaces the marble.","_n":"2y061","_k":"e1a11a01"},{"t":"`8/15`","why":"`2 × (4/6 × 2/5) = 16/30`.","_n":"2z0b1","_k":"fae720e1"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Model data: 250 adults; 150 exercise regularly, 100 sleep 8+ hours, 60 do both. Are “exercises” and “sleeps 8+ hours” independent?","options":[{"t":"No: 60 isn’t half of 150","why":"Half has nothing to do with the test.","_n":"300c1","_k":"5f214c02"},{"t":"No: 60 isn’t equal to 100","why":"That compares the wrong things.","_n":"31092","_k":"78e8d558"},{"t":"Yes: 0.6 × 0.4 = 0.24 = `60/250`","why":"`P(A and B)` equals `P(A) × P(B)`.","_n":"32082","_k":"50c4860d"},{"t":"You can’t tell without knowing what causes what","why":"Independence is checked with numbers, not causes.","_n":"330b2","_k":"58a18115"}]},"b":{"prompt":"Model data: 300 students; 180 take the bus, 120 play an instrument, 60 do both. Are the events independent?","options":[{"t":"No: 180 is more than 120","why":"That compares the wrong things.","_n":"340a2","_k":"0c80a4c9"},{"t":"Yes: 60 is less than 120","why":"Size alone doesn’t test independence.","_n":"35052","_k":"77cc5b20"},{"t":"No: 0.6 × 0.4 = 0.24, but `60/300` = 0.20","why":"`P(A and B)` doesn’t equal `P(A) × P(B)`, so the events are dependent.","_n":"36042","_k":"461b9bc5"},{"t":"Yes: the activities seem unrelated","why":"Seeming related (or unrelated) isn’t a test. Check the numbers.","_n":"37072","_k":"1fbad210"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"Which is the best explanation of why, for one card, “heart” and “spade” are not independent?","options":[{"t":"They’re independent because they don’t overlap.","why":"Mutually exclusive events can’t happen together, so if `A` happens, `P(B)` b
