--red:#FF8B7B;--green:#6BD39B;--good-bg:#1C3326;--bad-bg:#3B2421;--info-bg:#1E2840;
--hi:#E6CF48;--hi-soft:rgba(230,207,72,.14);--hi-ink:#17201B;

color-scheme:dark;
}
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}
[hidden]{display:none!important}
body{

}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}

:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
img,svg{max-width:100%}

.muted{color:var(--ink-2)}

.uses{margin:10px 0 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);font-size:.95rem;max-width:68ch}

.btn{display:inline-block;vertical-align:middle;text-align:center;line-height:1.25;font-weight:700;padding:.65em 1.15em;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none}
.btn.primary{background:var(--ink);color:var(--sheet)}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(18px,4vw,52px);align-items:center;padding:clamp(22px,5vw,60px) 0 10px}

.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 25: hero, From bars to curves (D10 histogram builder + D8 model densities), Measurement stations, probEntry, task.
   Bars --pen; selected area --hi-soft; smooth curve --ink (course plan build notes). */
/* radioGroup (from MDM4U 18 / 15) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:36px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 18) */
.cd-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:40px;text-align:left}
.cd-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.cd-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.cd-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.cd-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}
@media (prefers-reduced-motion:reduce){.cd-sw .cc-track,.cd-sw .cc-knob{transition:none}}

/* From bars to curves */
.cd-top{margin-bottom:6px}
canvas.plot.cd-plot{aspect-ratio:16/10}
.cd-cap{font-size:clamp(1.05rem,2.4vw,1.35rem)}
.cd-tip{margin:6px 0 0}
.cd-sws{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0 0 8px}
.cd-ctrl .slider{margin:0 0 10px}
.cd-read dd{overflow-wrap:anywhere}
.cd-conds{margin:.4em 0 0 1.2em;padding:0}

/* Measurement stations */
.cm-tabs{margin-bottom:6px}
.cm-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.cm-clab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.cm-text{margin:0 0 10px}
.cm-tick{font-weight:700}
.cm-sub{margin:12px 0 6px;font-weight:700}
.cm-eq{margin:6px 0 0;text-align:center}
.cm-row{margin:0 0 10px;padding:8px 0 0;border-top:1px solid var(--rule)}
.cm-rq{font-weight:700;margin:0 0 6px}
.cm-ruler{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.cm-band{fill:var(--hi-soft)}
.cm-edge,.cm-tk{stroke:var(--ink);stroke-width:1.5}
.cm-mark{stroke:var(--pen);stroke-width:3}
.cm-num{fill:var(--ink);font:400 14px var(--font-math)}
.cm-rl{fill:var(--ink-2);font:700 11px var(--font-ui)}
.cm-pop{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.cm-pbar{background:var(--pen);color:var(--sheet);border-radius:6px;padding:10px 12px;font-weight:700}
.cm-sbar{display:flex;align-items:center;gap:8px;font-weight:700}
.cm-sbar i{display:block;height:28px;min-width:3px;background:var(--pen);border-radius:2px}
.cm-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cm-two figure{margin:0}
.cm-two figcaption{font-weight:700;text-align:center;margin-bottom:4px}
canvas.plot.cm-small{aspect-ratio:4/3}
@media (max-width:520px){.cm-two{grid-template-columns:1fr}}

/* probEntry (from MDM4U 21) */
.pe-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pe-lab{display:inline-flex;align-items:center;gap:8px}

/* task */
.wt-in{margin:10px 0}
.wt-step{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0}
.wt-stl{min-width:6.5em;font-weight:700}
.wt-sv{min-width:3.4em;text-align:center;font:700 1.1rem var(--font-math)}
.wt-step .btn{min-width:40px;min-height:40px}
canvas.plot.wt-plot{aspect-ratio:4/3}
.wt-read{margin-top:8px}

% of students. Caption: total area = 1.","shape":"wide"}},"goals":["I can tell whether a random variable is discrete or continuous.","I can organize continuous data into intervals and draw a frequency histogram and frequency polygon.","I can explain that probability for a continuous variable is the area under a density curve, and why `P(X = a) = 0`.","I can find probabilities from simple density curves (rectangles, triangles, pieces) using area.","I can describe the challenges of measuring continuous data: rounding, sampling and class boundaries.","I can connect relative-frequency histograms to density curves as the class width shrinks."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Discrete vs continuous","goal":1,"prompt":"Which variable is continuous?","options":[{"t":"The number of goals in a game","why":"Goals are counted: 0, 1, 2, …","_n":"0871","_k":"1c5e3911"},{"t":"The number of heads in 5 tosses","why":"That’s a count.","_n":"1861","_k":"12d1a9f9"},{"t":"The number of people on a bus","why":"That’s a count.","_n":"2851","_k":"20d0c3f1"},{"t":"The time a student takes to run 100 m","why":"Time can take any value in an interval.","_n":"38c1","_k":"494975f1"}],"hints":["Is it counted or measured?","Measured quantities are continuous.","Time."]},{"id":"w2","skill":"Discrete vs continuous","goal":1,"prompt":"Which variable is discrete?","options":[{"t":"The temperature at noon","why":"Measured: continuous.","_n":"48b1","_k":"96a74be4"},{"t":"The number of text messages sent today","why":"Counted.","_n":"58a1","_k":"7098d5c5"},{"t":"The length of a song","why":"Measured: continuous.","_n":"6891","_k":"bcf2e1f9"},{"t":"The mass of an apple","why":"Measured: continuous.","_n":"7801","_k":"52e30699"}],"hints":["Counted or measured?","Counts are discrete.","Text messages."]},{"id":"w3","skill":"Areas","goal":4,"prompt":"A rectangle has width 5 and height 0.04. What is its area?","options":[{"t":"0.04","why":"That’s the height.","_n":"87f1","_k":"8d5021fd"},{"t":"0.2","why":"5 × 0.04.","_n":"9eca","_k":"acb975d4"},{"t":"1.25","why":"That’s 5 ÷ 4.","_n":"aeda","_k":"c1f58f48"},{"t":"5.04","why":"Area multiplies.","_n":"beaa","_k":"cda15d3a"}],"hints":["Area = width × height.","5 × 0.04.","0.2."]},{"id":"w4","skill":"Areas","goal":4,"prompt":"A triangle has base 4 and height 0.08. What is its area?","options":[{"t":"0.08","why":"That’s the height.","_n":"ceba","_k":"6e729000"},{"t":"0.16","why":"½ × 4 × 0.08.","_n":"de8a","_k":"235f3ed6"},{"t":"0.32","why":"Include the ½ for a triangle.","_n":"ee9a","_k":"2224cd7d"},{"t":"4.08","why":"Area multiplies; don’t add.","_n":"fe6a","_k":"9bf19701"}],"hints":["½ × base × height.","½ × 4 × 0.08.","0.16."]},{"id":"w5","skill":"Relative frequency","goal":6,"prompt":"In a sample of 200 students, 70 are between 160 and 170 cm tall. What is the relative frequency?","options":[{"t":"0.35","why":"70 ÷ 200.","_n":"ge7a","_k":"5e45c042"},{"t":"0.70","why":"Divide by 200, not 100.","_n":"he4a","_k":"4e16a901"},{"t":"2.86","why":"That’s 200 ÷ 70.","_n":"ie5a","_k":"a44e521d"},{"t":"70","why":"That’s the frequency.","_n":"j66a","_k":"8fe41d70"}],"hints":["Relative frequency = frequency ÷ total.","70 ÷ 200.","0.35."]},{"id":"w6","skill":"Reading histograms","goal":2,"prompt":"A histogram has classes 150–160, 160–170 and 170–180 with frequencies 34, 70 and 62. How many values are at least 160?","options":[{"t":"70","why":"Include the 170–180 class.","_n":"k65a","_k":"0b0b317a"},{"t":"96","why":"That’s 34 + 62.","_n":"l64a","_k":"848fb144"},{"t":"132","why":"70 + 62.","_n":"m63a","_k":"64e8fcf5"},{"t":"166","why":"That’s everyone in these classes.","_n":"n6aa","_k":"b71fc8a3"}],"hints":["Which classes start at 160 or more?","160–170 and 170–180.","132."]}],"refreshers":{"Discrete vs continuous":"Counted values are discrete; measured values (time, mass, length) are continuous, even when they’re rounded.","Areas":"Rectangle: width × height. Triangle: ½ × base × height.","Relative frequency":"Frequency ÷ total. Relative frequencies add to 1.","Reading histograms":"Add the frequencies of the classes that fit the condition. Classes include their left endpoint."}}},"explore":{"heading":"From bars to curves","intro":"Group 200 measurements into classes, then make the classes narrower. Switch the vertical axis to density and watch a curve appear. Then explore model densities whose areas you can find exactly.","predIntro":"Make a prediction first. Then the histogram builder will show you what really happens.","predictions":[{"id":"p1","start":{"view":"data","ds":"h","axis":"rf","w":10},"prompt":"What happens to the bar heights when the classes get 5 times narrower?","options":[{"t":"They stay the same","_n":"o69a","_k":"75d0ac1a"},{"t":"They become equal","_n":"p68a","_k":"7be84594"},{"t":"They get shorter, because each class holds fewer students","_n":"q67a","_k":"172b9885"},{"t":"They get taller","_n":"r5ea","_k":"30b35cd6"}],"explain":"Relative-frequency heights depend on the class width. That’s why we switch to density. The bars dropped to about a fifth of their height."},{"id":"p2","start":{"view":"data","ds":"h","axis":"d","w":10},"prompt":"Now what happens to the outline?","options":[{"t":"It becomes flat","_n":"s5da","_k":"a73f640a"},{"t":"It shrinks to a fifth","_n":"t609","_k":"57a288e0"},{"t":"It doubles","_n":"u619","_k":"a19acebc"},{"t":"It keeps about the same shape and gets smoother","_n":"v629","_k":"a5514c53"}],"explain":"Density = relative frequency ÷ width, so the scale stays put. The outline held, and the smooth curve appeared."},{"id":"p3","start":{"view":"model","shape":"bus","pt":7},"prompt":"What is the probability of waiting \u003cstrong>exactly\u003c/strong> 7 minutes?","options":[{"t":"0","_n":"w639","_k":"5984d17f"},{"t":"`1/20`","_n":"x649","_k":"7b4877b8"},{"t":"`1/7`","_n":"y659","_k":"e955c2cc"},{"t":"`7/20`","_n":"z669","_k":"17193b18"}],"explain":"`1/20` is the height (the density), not the area. An interval of width 0 has area 0."},{"id":"p4","start":{"view":"model","shape":"unif","c":0.5},"prompt":"This density is 2 units tall. Is it a valid density?","options":[{"t":"No: heights can’t exceed 1","_n":"10679","_k":"64a73692"},{"t":"Only if `c = 1`","_n":"11589","_k":"a44be82d"},{"t":"Yes: the area is 2 × 0.5 = 1","_n":"12599","_k":"8c197f28"},{"t":"No: the area is 2","_n":"136aa","_k":"d497e657"}],"explain":"Only the total area must be 1. The total-area readout shows 1."}],"chalIntro":"Use \u003cstrong>Model densities\u003c/strong> to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[3,4],"prompt":"On the bus-wait model (uniform on [0, 20] minutes), select an interval whose probability is `1/4`.","why":"Area = width × `1/20`, so any interval 5 minutes long has probability `5/20 = 1/4`.","hints":["Area = width × `1/20`.","You need width × `1/20 = 1/4`.","Any interval 5 minutes long."]},{"id":"tc2","goal":[3,4],"prompt":"On the triangle model `f(x) = x ÷ 50` on [0, 10], select [0, `b`] with probability 0.36.","why":"The area from 0 to `b` is ½ × `b` × (`b` ÷ 50) = `b^2` ÷ 100, and `6^2` ÷ 100 = 0.36.","hints":["Area of the triangle from 0 to `b`: ½ × `b` × (`b` ÷ 50) = `b^2` ÷ 100.","`b^2` ÷ 100 = 0.36.","`b = 6`."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Set the uniform density on [0, `c`] so that `P(2 \u003c= X \u003c= 5) = 1/2`. There are \u003cstrong>two\u003c/strong> answers. Find both. (Check each one as you find it.)","why":"If `c ≥ 5`, the whole interval fits: 3 ÷ `c` = `1/2`, so `c = 6`. If `c \u003c 5`, only 2 to `c` counts: (`c` − 2) ÷ `c` = `1/2`, so `c = 4`.","hints":["If `c ≥ 5`, the whole interval fits: 3 ÷ `c` = `1/2`.","If `c \u003c 5`, only 2 to `c` counts: (`c` − 2) ÷ `c` = `1/2`.","`c = 6` and `c = 4`."]}]},"part3":{"slug":"measurement","name":"Measurement","heading":"Measurement challenges","intro":"Why is a continuous distribution hard to pin down? Visit four measuring stations. Each one ends with a \u003cstrong>Check it with data\u003c/strong> panel.","stations":[{"id":"s1","title":"Rounding hides an interval","text":"A height was recorded as 172 cm (to the nearest centimetre). Zoom in on the ruler: any true height in the shaded band rounds to 172.","match":"Match each recording to its true interval.","fb":"Rounding to the nearest unit covers half a unit each side."},{"id":"s2","title":"Boundaries","text":"Some heights land exactly on a class boundary. The rule \u003cstrong>“the left endpoint is included”\u003c/strong> decides where they go: [160, 170) holds 160 but not 170.","fb":"The left endpoint is included."},{"id":"s3","title":"You can’t measure everyone","text":"We want the heights of every Grade 12 student in Ontario, but we measured a sample of 200.","q":"Why sample?","right":"All of these. Measuring everyone takes time and money, and some measurements destroy the item (testing a light bulb’s life burns it out). You’ll meet sampling again in module 29.","wrong":"That’s one reason. Look for the choice that covers every reason."},{"id":"s4","title":"Measurement uncertainty","text":"Two students measure the same 10 objects with a ruler marked in centimetres. Their recordings differ slightly, so their histograms differ a little.","after":"Variability comes from measurement as well as from the things being measured."}],"quickCheck":{"title":"Quick check","summary":"Measurement challenges quick check","items":[{"id":"q1","goal":5,"prompt":"A height recorded to the nearest cm as 172 cm means…","choices":[{"t":"exactly 172","fb":"Rounding to the nearest cm covers half a cm each side.","_n":"1469a","_k":"e34200e4"},{"t":"171.5 ≤ `h` \u003c 172.5","fb":"Right. Rounding to the nearest cm covers half a cm each side.","_n":"156ca","_k":"fe3308f0"},{"t":"172 ≤ `h` \u003c 173","fb":"Rounding to the nearest cm covers half a cm each side.","_n":"166ba","_k":"6f60ba49"},{"t":"171 ≤ `h` \u003c 172","fb":"Rounding to the nearest cm covers half a cm each side.","_n":"1766a","_k":"db3d9524"}]},{"id":"q2","goal":5,"prompt":"With classes [150, 160) and [160, 170), where does 160.0 cm go?","choices":[{"t":"neither","fb":"The left endpoint is included.","_n":"1865a","_k":"662a2d9c"},{"t":"[160, 170)","fb":"Right. The left endpoint is included.","_n":"1968a","_k":"be788bd7"},{"t":"[150, 160)","fb":"The left endpoint is included.","_n":"1a67a","_k":"bb1d2df3"},{"t":"both","fb":"The left endpoint is included.","_n":"1b62a","_k":"ec299a2d"}]},{"id":"q3","goal":1,"prompt":"A bus wait recorded to the nearest minute is…","choices":[{"t":"neither","fb":"Rounding the record doesn’t change what’s measured.","_n":"1c61a","_k":"41f9b757"},{"t":"discrete","fb":"Rounding the record doesn’t change what’s measured.","_n":"1d64a","_k":"41da3795"},{"t":"continuous","fb":"Right. Rounding the record doesn’t change what’s measured.","_n":"1e65a","_k":"4565914e"},{"t":"both","fb":"Rounding the record doesn’t change what’s measured.","_n":"1f62a","_k":"dcc28b49"}]},{"id":"q4","goal":5,"prompt":"Why do statisticians usually sample?","choices":[{"t":"Time, cost, or destructive testing","fb":"Right. A census is often impossible or too expensive.","_n":"1g63a","_k":"12252f6a"},{"t":"Samples are always more accurate","fb":"A census is often impossible or too expensive.","_n":"1h68a","_k":"0046b85d"},{"t":"Samples need no grouping","fb":"A census is often impossible or too expensive.","_n":"1i69a","_k":"44cf6381"},{"t":"Populations have no variability","fb":"A census is often impossible or too expensive.","_n":"1j66a","_k":"7885f559"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Discrete or continuous?","summary":"Discrete or continuous?","goal":[1,5],"noun":"variable","txt":true,"instruction":"Tap a variable, then tap the box it belongs in.","boxes":[{"id":"disc","label":"Discrete"},{"id":"cont","label":"Continuous"}],"items":[{"id":"v1","t":"Number of siblings","_a":"FlQMRVYX","why":"siblings are counted.","hints":["Can it take any value in between?","Counted or measured?","Discrete: siblings are counted."]},{"id":"v2","t":"Time to run 100 m","_a":"FlMKWEEX","why":"time is measured.","hints":["Can it take any value in between?","Counted or measured?","Continuous: time is measured."],"wrong":{"disc":"Times are rounded when recorded, but time itself is continuous."}},{"id":"v3","t":"Number of goals in a hockey game","_a":"FlQMRVYX","why":"goals are counted.","hints":["Can it take any value in between?","Counted or measured?","Discrete: goals are counted."]},{"id":"v4","t":"Mass of a backpack","_a":"FlMKWEEX","why":"mass is measured.","hints":["Can it take any value in between?","Counted or measured?","Continuous: mass is measured."]},{"id":"v5","t":"Shoe size (in half sizes)","_a":"FlQMRVYX","why":"shoe sizes come in fixed half-size steps.","hints":["Can it take any value in between?","Counted or measured?","Discrete: shoe sizes come in fixed half-size steps."],"wrong":{"cont":"Foot length is continuous, but shoe sizes come in fixed half-size steps, so the recorded variable is discrete."}},{"id":"v6","t":"Temperature at noon","_a":"FlMKWEEX","why":"temperature is measured.","hints":["Can it take any value in between?","Counted or measured?","Continuous: temperature is measured."]},{"id":"v7","t":"Number of pets","_a":"FlQMRVYX","why":"pets are counted.","hints":["Can it take any value in between?","Counted or measured?","Discrete: pets are counted."]},{"id":"v8","t":"Height of a tree","_a":"FlMKWEEX","why":"height is measured.","hints":["Can it take any value in between?","Counted or measured?","Continuous: height is measured."]},{"id":"v9","t":"Volume of water in a bottle","_a":"FlMKWEEX","why":"volume is measured.","hints":["Can it take any value in between?","Counted or measured?","Continuous: volume is measured."]},{"id":"v10","t":"Number of correct answers on a quiz","_a":"FlQMRVYX","why":"correct answers are counted.","hints":["Can it take any value in between?","Counted or measured?","Discrete: correct answers are counted."]}],"wrongDefault":"Counted → discrete; measured → continuous."},{"id":"areas","type":"custom","title":"Areas and densities","summary":"Areas and densities","goal":[3,4,6],"star":true,"instruction":"Find each probability or density. Items marked ★ are non-routine; D5 and D6 go beyond the Final Check.","how":"Type a fraction such as 3/8, a decimal such as 0.375, or a root such as 5√2, then press Check.","items":[{"id":"d1","goal":4,"prompt":"`X` is uniform on [0, 8]. Find `P(2 \u003c= X \u003c= 5)`.","_a":"BB5WAQA=","display":"`3/8`","why":"Width 3 × height `1/8` = `3/8`.","wrong":[{"match":0.625,"fb":"Only the stretch from 2 to 5 counts."}]},{"id":"d2","goal":3,"prompt":"`X` is uniform on [0, 8]. What is the density’s height?","_a":"BB5UBAA=","display":"`1/8`","label":"Height:","why":"Height × 8 = 1, so the height is `1/8`.","wrong":[{"match":8,"fb":"Height × 8 must equal 1."}]},{"id":"d3","goal":6,"prompt":"A class 5 cm wide has relative frequency 0.15. What is its density?","_a":"BB5VBQ==","display":"0.03 per cm","label":"Density (per cm):","why":"0.15 ÷ 5 = 0.03 per cm.","wrong":[{"match":0.15,"fb":"Divide by the width."}]},{"id":"d4","goal":4,"prompt":"`f(x) = x ÷ 50` on [0, 10]. Find `P(X \u003c= 5)`.","_a":"BB5XAw==","display":"0.25","why":"½ × 5 × 0.1 = 0.25, or `5^2` ÷ 100.","wrong":[{"match":0.5,"fb":"Area grows like `b^2`: 25 ÷ 100."}]},{"id":"d5","goal":4,"star":true,"prompt":"A density is `c` on [0, 4) and `2c` on [4, 6]. Find `c`, then `P(X >= 4)`.","_a":"bwBLBwcAHAUaBTg=","display":"`c = 1/8`; `P(X >= 4) = 1/2`","parts":["`c` =","`P(X >= 4)` ="],"why":"4`c` + 2(2`c`) = 8`c` = 1, so `c = 1/8`; `P(X >= 4)` = 2 × `2/8` = `1/2`.","wrong":[{"part":0,"match":0.3333333333333333,"fb":"Add \u003cstrong>areas\u003c/strong>: 4`c` + 2(2`c`) = 1, not `c` + 2`c` = 1."}],"hints":["Total area = 1.","4`c` + 2 × 2`c` = 8`c`.","`c = 1/8`; `P(X >= 4)` = 2 × `2/8` = `1/2`."]},{"id":"d6","goal":4,"star":true,"prompt":"`f(x) = x ÷ 50` on [0, 10]. Find the median `m`. Use √2 ≈ 1.414.","_a":"Ax5VAQQFBgIM","tol":0.0002,"display":"`m = 5√2 ≈ 7.07`","label":"`m` =","why":"`m^2` ÷ 100 = `1/2`, so `m = √50 = 5√2 ≈ 7.07`.","wrong":[{"match":5,"fb":"The area to the left of 5 is only 0.25."}],"hints":["The median splits the area in half.","`m^2` ÷ 100 = `1/2`.","`m = √50 = 5√2 ≈ 7.07`."]},{"id":"d7","goal":4,"star":true,"prompt":"`X` is uniform on [0, `c`] with `P(X \u003c= 3) = 0.6`. Find `c`.","_a":"AQ==","display":"`c = 5`","label":"`c` =","why":"3 ÷ `c` = 0.6, so `c = 5`.","wrong":[{"match":1.8,"fb":"3 ÷ `c` = 0.6."}]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Akira","how":"","goal":[3,4],"instruction":"Akira made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"`X` is uniform on [0, 6]. Find `P(X = 3)`.","steps":["The density is `1/6` on [0, 6].","So `P(X = 3) = 1/6`."],"_a":"BQ==","stepFb":["Step 1 is correct.",""],"fixes":[{"t":"A single value has width 0, so `P(X = 3) = 0`.","why":"A single value has zero width, so the area above it is 0. Only intervals have probability.","_n":"1k67a","_k":"39ba03e2"},{"t":"`P(X = 3) = 1`.","why":"Probability 1 means certainty.","_n":"1l5ca","_k":"55347d4b"},{"t":"Step 2 is correct.","why":"`1/6` is the height, not an area.","_n":"1m5da","_k":"61ff06dd"},{"t":"`P(X = 3) = 3/6`.","why":"That’s `P(X \u003c= 3)`.","_n":"1n5ea","_k":"4fddb8cb"}],"hints":["What’s the width of the ‘interval’ at exactly 3?","0.","Area = 0."]},{"id":"e2","goal":4,"task":"Model heights have density 0.035 per cm on [160, 170). Find `P(160 \u003c= h \u003c 165)`.","steps":["The density is 0.035 per cm on this class.","So `P(160 \u003c= h \u003c 165) = 0.035`.","About 3.5% of students are in this range."],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"`P` = 0.035 × 5 = 0.175: about 17.5%.","why":"A density times a width gives probability.","_n":"1o5da","_k":"41b38444"},{"t":"`P` = 0.035 × 10 = 0.35.","why":"That’s the whole class, 160 to 170.","_n":"1p5ca","_k":"a06c20a7"},{"t":"`P` = 0.035 ÷ 5.","why":"Multiply height by width.","_n":"1q5ba","_k":"92b93903"},{"t":"Step 2 is correct.","why":"A density times a width gives probability.","_n":"1r5aa","_k":"6acb373b"}],"hints":["How wide is the interval?","5 cm.","0.035 × 5."]},{"id":"e3","goal":3,"task":"Is `f(x) = 1.5` on [0, `2/3`] a valid density?","steps":["A density can’t be negative, and 1.5 ≥ 0.","A density’s height can never be more than 1.","So `f` is not a valid density."],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"It’s valid because 1.5 + `2/3` > 1.","why":"Add areas, not numbers like this.","_n":"1s59a","_k":"e114d41a"},{"t":"Step 2 is correct.","why":"Tall, narrow densities are fine.","_n":"1t58a","_k":"b3f988a8"},{"t":"It’s invalid because `2/3` \u003c 1.","why":"The width can be anything.","_n":"1u57a","_k":"ad58a54e"},{"t":"Only the total area must be 1: 1.5 × `2/3` = 1, so `f` is valid.","why":"Only the total area must be 1. A narrow curve can be tall.","_n":"1v66a","_k":"0b41c0a2"}],"hints":["What must a density’s total area be?","1.","1.5 × `2/3` = 1: valid."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in ‘From bars to curves’: the shrinking relative-frequency bars, or `P(X = a) = 0`?"},{"id":"j2","q":"In your own words, explain the difference between a density and a probability."},{"id":"j3","q":"Explain to a friend why a time recorded to the nearest second is still a continuous variable."},{"id":"j4","q":"Which still feels strange: probability as area, or heights above 1? What will you try to make it click?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a continuous random variable?","options":[{"t":"The number of goals in a game","why":"Counted.","_n":"1w65a","_k":"e4ce5db7"},{"t":"The time a student takes to run 100 m","why":"Time can take any value in an interval.","_n":"1xd8a","_k":"3ed88c34"},{"t":"Shoe size, in half sizes","why":"Recorded in fixed steps: discrete.","_n":"1yd9a","_k":"13e5acef"},{"t":"The number of heads in 10 tosses","why":"Counted.","_n":"1zdaa","_k":"49562fd4"}]},"b":{"prompt":"Which is a discrete random variable?","options":[{"t":"The temperature at noon","why":"Measured.","_n":"20dba","_k":"07dc0394"},{"t":"The time to finish a test, recorded to the nearest minute","why":"Still time: continuous.","_n":"21d4a","_k":"34613fbb"},{"t":"The mass of an apple","why":"Measured.","_n":"22d5a","_k":"4f03c8dd"},{"t":"The number of cars passing in an hour","why":"Cars are counted: 0, 1, 2, …","_n":"23d6a","_k":"c991a0c0"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"`X` is continuous. What is `P(X = 4.5)`?","options":[{"t":"It can’t be found without data","why":"It’s always 0.","_n":"24d7a","_k":"3bab3521"},{"t":"0","why":"A single point has no width, so no area.","_n":"25e0a","_k":"00ab54bb"},{"t":"The density’s height at 4.5","why":"A single value has zero width, so the area above it is 0. Only intervals have probability.","_n":"26e1a","_k":"49b7a296"},{"t":"1 divided by the number of possible values","why":"There are infinitely many.","_n":"27e29","_k":"bd69e644"}]},"b":{"prompt":"`X` is uniform on [0, 10]. What is `P(X = 3)`?","options":[{"t":"0","why":"A single value has zero width, so the area above it is 0. Only intervals have probability.","_n":"28e19","_k":"a17cf7fb"},{"t":"`1/10`","why":"That’s the height. A single value has zero width, so the area above it is 0. Only intervals have probability.","_n":"29e49","_k":"cbcc3be8"},{"t":"`3/10`","why":"That’s `P(X \u003c= 3)`.","_n":"2ae39","_k":"c503ad27"},{"t":"`1/3`","why":"Not a probability for this model.","_n":"2be69","_k":"76822855"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"A wait `X` is uniform on [0, 20] minutes. Find `P(5 \u003c= X \u003c= 12)`.","options":[{"t":"`1/20`","why":"That’s the height. Height is a density (per cm, per minute). Probability = height × width for a rectangle; in general it’s the area.","_n":"2ce59","_k":"e067d8af"},{"t":"`7/20`","why":"Width 7 × height `1/20`.","_n":"2de89","_k":"46ff550e"},{"t":"`7/12`","why":"Divide by the full width, 20.","_n":"2ee79","_k":"c8673317"},{"t":"`12/20`","why":"Start the interval at 5, not 0.","_n":"2fda9","_k":"5b0a85e5"}]},"b":{"prompt":"`X` is uniform on [10, 30]. Find `P(15 \u003c= X \u003c= 25)`.","options":[{"t":"`1/20`","why":"That’s the height. Height is a density (per cm, per minute). Probability = height × width for a rectangle; in general it’s the area.","_n":"2gd99","_k":"d1da3bf0"},{"t":"`1/3`","why":"That’s `10/30`, but the width of the support is 20.","_n":"2h5c8","_k":"42360d31"},{"t":"`1/2`","why":"10 × `1/20`.","_n":"2i5d8","_k":"8ab92150"},{"t":"`25/30`","why":"Use the interval, not 25 ÷ 30.","_n":"2j5a8","_k":"d40a4c9d"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A density is `f(x) = x ÷ 50` on [0, 10]. Find `P(X \u003c= 4)`.","options":[{"t":"0.08","why":"That’s the height at 4. Height is a density (per cm, per minute). Probability = height × width for a rectangle; in general it’s the area.","_n":"2k5b8","_k":"24bf74ab"},{"t":"0.16","why":"½ × 4 × 0.08.","_n":"2l588","_k":"1448c539"},{"t":"0.32","why":"Include the ½ for a triangle.","_n":"2m598","_k":"37dc32ea"},{"t":"0.4","why":"Area isn’t proportional to `b`.","_n":"2n568","_k":"f97ac77e"}]},"b":{"prompt":"Same density, `f(x) = x ÷ 50` on [0, 10]. Find `P(X >= 6)`.","options":[{"t":"0.12","why":"That’s the height at 6. Height is a density (per cm, per minute). Probability = height × width for a rectangle; in general it’s the area.","_n":"2o578","_k":"3d7ad442"},{"t":"0.36","why":"That’s `P(X \u003c= 6)`.","_n":"2p648","_k":"95ab246b"},{"t":"0.4","why":"Use areas, not widths.","_n":"2q658","_k":"a36efcff"},{"t":"0.64","why":"1 − `36/100`.","_n":"2r2f4","_k":"4f470f40"}]}},{"id":"t2","cat":"T","goal":6,"a":{"prompt":"A relative-frequency histogram with 5-cm classes has a bar of height 0.20 for 160 ≤ `h` \u003c 165. What is the density for that class?","options":[{"t":"0.20 per cm","why":"Divide by the width.","_n":"2s304","_k":"aa16cdc3"},{"t":"0.25 per cm","why":"That’s 1 ÷ 4.","_n":"2t2d4","_k":"3fa12507"},{"t":"0.04 per cm","why":"0.20 ÷ 5.","_n":"2u2e4","_k":"13663be0"},{"t":"1.00 per cm","why":"That’s 0.20 × 5.","_n":"2v334","_k":"c455c7ad"}]},"b":{"prompt":"A class 2 kg wide has relative frequency 0.10. What is its density?","options":[{"t":"0.5 per kg","why":"That’s 1 ÷ 2.","_n":"2w344","_k":"9e7319eb"},{"t":"0.05 per kg","why":"0.10 ÷ 2.","_n":"2x314","_k":"62fc3e6a"},{"t":"0.20 per kg","why":"That multiplies by the width.","_n":"2y324","_k":"d9b7b7b7"},{"t":"0.10 per kg","why":"Divide the relative frequency by the class width to get the density.","_n":"2z274","_k":"986a1c12"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"A density is 0.25 on [0, 2) and 0.125 on [2, 6]. Is it valid, and what is `P(1 \u003c= X \u003c= 3)`?","options":[{"t":"Not valid, because 0.25 + 0.125 ≠ 1","why":"Add areas, not heights.","_n":"30284","_k":"33b60204"},{"t":"Valid; 0.375","why":"Areas 0.5 + 0.5 = 1; then 0.25 × 1 + 0.125 × 1.","_n":"31354","_k":"ea2f57b8"},{"t":"Valid; 0.5","why":"Use the heights on each piece.","_n":"32344","_k":"4fa6676d"},{"t":"Valid; 0.25","why":"Include the part from 2 to 3.","_n":"33374","_k":"262d95d7"}]},"b":{"prompt":"A density is 0.3 on [0, 2) and 0.1 on [2, 6]. Is it valid, and what is `P(1 \u003c= X \u003c= 4)`?","options":[{"t":"Valid; 0.3","why":"Include 2 to 4.","_n":"34364","_k":"6ac3dc05"},{"t":"Valid; 0.5","why":"0.6 + 0.4 = 1; then 0.3 × 1 + 0.1 × 2.","_n":"35314","_k":"dd391a10"},{"t":"Not valid, because 0.3 + 0.1 ≠ 1","why":"A density’s total area is exactly 1. Add areas (height × width), not heights.","_n":"36304","_k":"046ae30d"},{"t":"Valid; 0.4","why":"From 1 to 2 the height is 0.3.","_n":"37334","_k":"53f34c77"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why `P(X = a) = 0` for a continuous variable?","options":[{"t":"“Probability is area under the density curve. The region above a single point has zero width, so its area is 0. Only intervals have positive probability.”","why":"Area needs width; a single point has none.","_n":"38324","_k":"2b2f7a12"},{"t":"“The density is 0 at every point.”","why":"The density can be positive.","_n":"392d4","_k":"fcb6e52d"},{"t":"“There are too many values to list.”","why":"Countability isn’t the reason; width is.","_n":"3a2c4","_k":"3fde7daa"},{"t":"“Continuous values never actually happen.”","why":"Values happen; each exact one just has area 0.","_n":"3ba33","_k":"241ecebd"}]},"b":{"prompt":"Which is the best explanation of how a density curve can be taller than 1?","options":[{"t":"“It can’t; a density is always at most 1.”","why":"Only the total area must be 1. A narrow curve can be tall.","_n":"3ca43","_k":"e863096b"},{"t":"“Heights above 1 mean the probability is over 100%.”","why":"Height isn’t probability.","_n":"3da53","_k":"5d270ba1"},{"t":"“Only discrete distributions can exceed 1.”","why":"Discrete probabilities never exceed 1.","_n":"3ea63","_k":"01a23693"},{"t":"“Height is a density, not a probability. Only the total area must be 1, so a narrow curve can be tall.”","why":"Only the total area must be 1. A narrow curve can be tall.","_n":"3f9f3","_k":"301f9887"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"A survey records heights to the nearest centimetre. A recorded height of 172 cm stands for…","options":[{"t":"171 cm up to 172 cm","why":"Rounding goes both ways.","_n":"3ga03","_k":"6e86bd83"},{"t":"172 cm up to 173 cm","why":"Rounding goes half a centimetre each way.","_n":"3ha13","_k":"34ce77c1"},{"t":"any height from 171.5 cm up to (but not including) 172.5 cm","why":"Rounding to the nearest cm covers half a cm each side.","_n":"3ia23","_k":"60e90c78"},{"t":"exactly 172 cm","why":"A recorded value stands for an interval. Time recorded to the nearest second is still time: continuous. The number of goals is a count: discrete.","_n":"3jab3","_k":"43b14484"}]},"b":{"prompt":"Times are recorded to the nearest 0.1 s. A recorded 12.3 s stands for…","options":[{"t":"exactly 12.3 s","why":"A recorded value stands for an interval. Time recorded to the nearest second is still time: continuous. The number of goals is a count: discrete.","_n":"3kac3","_k":"0c1a37e0"},{"t":"12.3 ≤ `t` \u003c 12.4","why":"Rounding goes 0.05 s each way.","_n":"3l293","_k":"245602ec"},{"t":"12.2 ≤ `t` \u003c 12.3","why":"Rounding goes both ways.","_n":"3m283","_k":"9a303498"},{"t":"12.25 ≤ `t` \u003c 12.35","why":"Rounding to the nearest 0.1 s covers 0.05 s each side.","_n":"3n273","_k":"efba4e1b"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A bus comes every 15 minutes, so your wait is uniform on [0, 15]. You ride twice this week, and the waits are independent. Find \u003ci>P\u003c/i>(both waits are longer than 10 minutes).","options":[{"t":"`1/9`","why":"Each wait: `5/15 = 1/3`; both: `(1/3)^2`.","_n":"3o263","_k":"51e93047"},{"t":"`1/3`","why":"That’s one wait.","_n":"3p253","_k":"e709c624"},{"t":"`4/9`","why":"That’s `(2/3)^2`, the chance that both are 10 minutes or less.","_n":"3q243","_k":"44534508"},{"t":"`2/3`","why":"That adds the two.","_n":"3r233","_k":"f912b0e8"}]},"b":{"prompt":"A traffic light’s red phase makes your wait uniform on [0, 60] seconds. On two independent days, find \u003ci>P\u003c/i>(both waits are under 45 s).","options":[{"t":"`1/16`","why":"That’s both waits 45 s or more.","_n":"3s223","_k":"07a55d4c"},{"t":"`9/16`","why":"`(45/60)^2 = (3/4)^2`.","_n":"3t313","_k":"5451d428"},{"t":"`3/4`","why":"That’s one day.","_n":"3u303","_k":"9ba970eb"},{"t":"`3/2`","why":"Probabilities can’t exceed 1.","_n":"3vb73","_k":"27e89630"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"Use the heights table (200 students; 160–170: 70; 170–180: 62). Assuming heights are spread evenly within each class, estimate `P(165 \u003c= h \u003c 175)`.","options":[{"t":"0.31","why":"That’s the 170–180 class alone.","_n":"3wb83","_k":"db1db906"},{"t":"0.33","why":"Half of 70 plus half of 62 = 66; 66 ÷ 200.","_n":"3xb53","_k":"c258d9bf"},{"t":"0.35","why":"That’s the 160–170 class alone.","_n":"3yb63","_k":"3e28f546"},{"t":"0.66","why":"Only half of each class lies in the range.","_n":"3zb33","_k":"7f90cbd0"}]},"b":{"prompt":"Use the heights table (200 students; 150–160: 34; 160–170: 70). Estimate `P(155 \u003c= h \u003c 165)`.","options":[{"t":"0.17","why":"Include the 160–165 half too.","_n":"40b43","_k":"ab579fd8"},{"t":"0.26","why":"17 + 35 = 52; 52 ÷ 200.","_n":"41b13","_k":"1fa26043"},{"t":"0.35","why":"That’s one whole class.","_n":"42b23","_k":"9f88801c"},{"t":"0.52","why":"Half of each class: 17 + 35 = 52, then divide by 200.","_n":"43af3","_k":"d9530678"}]}}]},"task":{"title":"Design a waiting-time density","summary":"Design a waiting-time density","statement":"\u003cp>Design the waiting time `X` (in minutes, from 0 to 10) at a help desk as a three-piece density: height `h_1` on [0, 2), `h_2` on [2, 6) and `h_3` on [6, 10]. It must meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"cd-conds\">\u003cli>It’s a valid density: the total area is 1.\u003c/li>\u003cli>At least 20% of people wait less than 2 minutes.\u003c/li>\u003cli>The middle stretch, 2 to 6 minutes, is the most likely of the three.\u003c/li>\u003cli>At least 20% of people wait 6 minutes or more.\u003c/li>\u003c/ol>","checks":["Total area = 1","≥ 20% under 2 min","Middle is most likely","≥ 20% wait 6 min or more"],"tips":["Each piece’s area is height × width; the widths are 2, 4 and 4.","`h_1` must be at least 0.1.","Compare \u003cstrong>areas\u003c/strong>, not heights: the middle piece is twice as wide as the first.","`h_3` must be at least 0.05."],"explainPrompt":"Explain how you made the areas add to 1 and why the tallest bar isn’t always the most likely stretch.","vocab":"Use the words density, area, interval and probability.","more":"There’s more than one answer. Can you find them all?","afterAt":4,"after3":"In (0.15, 0.10, 0.075), the middle piece is the \u003cstrong>shortest\u003c/strong> bar but has the largest area. Area, not height, decides probability."},"cards":[["Continuous random variable","Can take any value in an interval: time, mass, height."],["Discrete random variable","Takes separate, countable values: goals, siblings."],["Density histogram","Bar height = relative frequency ÷ class width."],["Density curve","A smooth curve with total area 1, modelling a continuous variable."],["Probability for continuous `X`","The area under the density curve over an interval."],["`P(X = a)`","0: a single point has no width."],["Uniform density on [0, `c`]","Height `1/c`; `P(a \u003c= X \u003c= b)` = (`b` − `a`) ÷ `c`."],["Can a density exceed 1?","Yes. Only the total area must be 1."],["Frequency polygon","Joins the midpoints of the histogram bars’ tops; a model of the distribution’s shape."],["Rounded data","172 cm (nearest cm) means 171.5 ≤ `h` \u003c 172.5."],["Class boundaries","Left endpoint included: [160, 170)."],["Why sample?","Time, cost, or tests that destroy the item."]]}};</script>
