ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}

.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}

.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){

}

.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}

.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}

}

@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 21: hero (Galton board), Binomial board (D7 histogram, Galton view, simulate), Is it binomial? stations (D1 tree),
   probEntry, Design a binomial task. Bars --pen (course plan §3); simulated/collected bars outlined; selections --hi-soft;
   E(X) line --ink, ±σ bracket --ink-2; pegs --ink-2. */
/* radioGroup (from MDM4U 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}
.rg.chips button .m{font-size:1.05em}

/* switch (from MDM4U 18) */
.bn-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.bn-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.bn-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.bn-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.bn-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}

/* hero */
.bn-heq{font-size:.8em;display:inline-flex;flex-wrap:wrap;align-items:flex-start;gap:.15em .3em;line-height:1.15}
.bn-hp{display:inline-flex;flex-direction:column;align-items:center}
.bn-hb .bn-hm{padding:0 .12em .08em;border-bottom:2px solid var(--ink-2)}
.bn-hu{font:700 .72rem/1.2 var(--font-ui);color:var(--ink-2);margin-top:.25em;white-space:nowrap}
.bn-hfig{display:grid;justify-items:center}
.bn-hsvg{display:block;width:100%;max-width:380px;height:auto}
.bn-hlab{font:700 13px var(--font-ui);fill:var(--ink);text-anchor:middle}
.bn-hcnt{font:700 15px var(--font-ui);fill:var(--ink);text-anchor:end}
.bn-hword{font:700 15px var(--font-ui);letter-spacing:.08em;fill:var(--ink-2)}

/* galtonBoard (SVG) */
.bn-peg circle{fill:var(--ink-2)}
.bn-plate{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round}
.bn-gdiv{fill:none;stroke:var(--ink-2);stroke-width:1.4}
.bn-gbar{fill:var(--pen)}
.bn-gcnt{fill:none;stroke:var(--ink);stroke-width:2}
.bn-gsel{fill:var(--hi-soft)}
.bn-glab{font-family:var(--font-math);fill:var(--ink);text-anchor:middle}
.bn-gpath{fill:none;stroke:var(--hi);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.bn-gpath.cur{stroke:var(--ink);stroke-width:2;opacity:1;stroke-dasharray:5 3}
.bn-ball{fill:var(--pen);stroke:var(--sheet);stroke-width:1.5}
.bn-gmean{stroke:var(--ink);stroke-width:2}
.bn-gsd{fill:none;stroke:var(--ink-2);stroke-width:2}

/* Binomial board */
.bn-view{margin-bottom:4px}
.bn-pg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.bn-main,.bn-read{min-width:0}
.bn-cap{font-size:clamp(1.2rem,2.6vw,1.6rem)}
.bn-cap.long{font-size:clamp(1rem,2.2vw,1.3rem)}
.bn-sls{display:grid;gap:2px;margin:0 0 8px}
.bn-sls .slider{margin:0 0 4px}
.bn-sls .rg-wrap{margin:2px 0 4px}
.bn-n40{margin:0}
canvas.plot.bn-plot{aspect-ratio:16/10}
.bn-bars{position:absolute;left:0;top:0;width:0;height:0}
.bn-bar{position:absolute;padding:0;margin:0;border:0;background:transparent;pointer-events:none;border-radius:2px}
.bn-bar:focus-visible{outline:3px solid var(--pen);outline-offset:-1px}
.bn-hint{margin:4px 0 8px}
.bn-gal{margin:4px 0 6px}
.bn-gbox{position:relative;margin:0 auto}
.bn-gsvg{display:block;width:100%;height:auto}
.bn-bins{position:absolute;inset:0}
.bn-bin{position:absolute;padding:0;margin:0;border:0;background:transparent;border-radius:3px;cursor:pointer}
.bn-bin:hover{background:color-mix(in srgb,var(--pen) 10%,transparent)}
.bn-bin:focus-visible{outline:3px solid var(--pen);outline-offset:-2px}
.bn-ginfo{min-height:2.6em;margin:8px 0 4px}
.bn-gcap{margin:0 0 4px}
.bn-note{padding:10px 12px;border:1.5px dashed var(--rule);border-radius:8px;margin:6px 0}
.bn-simbox{margin:6px 0 4px}
.bn-simrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.bn-simrow .rg-wrap{margin:0}
.bn-rng{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 0 0}
.bn-quick{display:inline-flex;flex-wrap:wrap;gap:6px}
.bn-quick .chip{min-height:34px}
.bn-msg{min-height:1.2em;margin:6px 0 0}
.bn-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}
.bn-conds{margin:6px 0 0;padding-left:1.3em}
.bn-conds li{margin:2px 0}

/* Part 3 stations */
.bi-tabs{margin-bottom:6px}
.bi-wrap{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.bi-task{margin:0 0 8px}
.bi-card{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;margin:10px 0 0}
.bi-card.ok{border-color:var(--green)}
.bi-ct{margin:0 0 8px}
.bi-cn{display:inline-block;font:700 .78rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-right:.4em}
.bi-bins{display:flex;flex-wrap:wrap;gap:6px}
.bi-chip strong{text-decoration:underline;text-underline-offset:2px}
.bi-chip.on strong{text-decoration:none}
.bi-fopts{margin-top:4px}
.bi-two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px 20px;align-items:start}
.bi-alg .alg-lines{gap:6px}
.bi-gen{margin-top:6px}
.bi-form{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 6px}
.bi-fp{display:inline-flex;flex-direction:column;align-items:center;padding:4px 6px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--hi-soft)}
.bi-fm{font-size:1.1em}
.bi-fl{font:700 .72rem/1.2 var(--font-ui);color:var(--ink);text-align:center;max-width:9em}
.bi-fx{align-self:center}
.bi-done{margin:12px 0 0}
.bi-tick{font-weight:700}

/* D1 treeDiagram (from MDM4U 17) */
.d1-scroll{overflow:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.d1-box{position:relative}
.d1-svg{position:absolute;left:0;top:0}
.d1-e{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.d1-hi{fill:none;stroke:var(--hi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.d1-in{position:absolute;left:0;top:0;right:0;bottom:0}
.d1-root{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
.d1-lab{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 6px;border:1.5px solid var(--ink-2);border-radius:13px;background:var(--sheet);color:var(--ink);font:400 1rem/23px var(--font-math);text-align:center;white-space:nowrap}
.d1-lab.on{border:2px solid var(--sel-bd);background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);font-weight:600}
.d1-p{position:absolute;transform:translate(-50%,-50%);font:400 .9rem var(--font-math);color:var(--ink-2);background:var(--sheet);padding:0 2px;white-space:nowrap}
.d1-leaf{position:absolute;transform:translate(-50%,-50%);min-height:30px;min-width:32px;padding:0 .45em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem/27px var(--font-math);white-space:nowrap}
.d1.right .d1-leaf{transform:translate(0,-50%)}
.d1-leaf.on{background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);border:2px solid var(--sel-bd);font-weight:700}
.d1-leaf small{font-size:.8em;color:var(--ink-2)}
.d1-stage{position:absolute;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* probEntry */
.pe-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pe-lab{display:inline-flex;align-items:center;gap:8px}

/* task */
canvas.plot.bt-plot{aspect-ratio:4/3}
.bt-read{margin-top:8px}

d=\"bn-hfig\">\u003c/div>"}},"goals":["I can decide whether a situation is binomial by checking the four conditions.","I can calculate binomial probabilities with `P(X = x) = C(n, x) p^x q^{n - x}`.","I can calculate ‘at least’ and ‘at most’ probabilities, using the complement when it’s shorter.","I can find and interpret `E(X) = np` and `σ = √{npq}`.","I can describe how `n` and `p` change the shape, centre and spread of a binomial distribution.","I can solve real-world problems with the binomial model and judge what a result means."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Combinations","goal":2,"prompt":"Evaluate `C(5, 2)`.","options":[{"t":"5","why":"That’s `C(5, 1)`.","_n":"053c","_k":"b9687381"},{"t":"10","why":"5 × 4 ÷ 2 = 10.","_n":"154c","_k":"75323d14"},{"t":"20","why":"Choosing 2 from 5 ignores order: divide by 2!.","_n":"255c","_k":"07b59081"},{"t":"32","why":"That’s the sum of all of row 5.","_n":"34ec","_k":"b3abb0fb"}],"hints":["`C(n, r) = n! ÷ (r!(n - r)!)`.","5! ÷ (2! 3!) = 120 ÷ 12.","10."]},{"id":"w2","skill":"Combinations","goal":2,"prompt":"In how many different orders can 2 heads and 3 tails occur in 5 coin tosses?","options":[{"t":"1","why":"THHTT is a different order.","_n":"44fc","_k":"f51d591f"},{"t":"5","why":"That counts orders with exactly 1 head.","_n":"550c","_k":"de7de83f"},{"t":"10","why":"Choose which 2 of the 5 tosses are heads: `C(5, 2)`.","_n":"651c","_k":"7a0a8f56"},{"t":"32","why":"That’s every possible sequence of 5 tosses.","_n":"74ac","_k":"9852c26b"}],"hints":["Pick the positions of the heads.","2 positions out of 5.","`C(5, 2) = 10`."]},{"id":"w3","skill":"Independent events","goal":2,"prompt":"A fair coin is tossed and a fair die is rolled. What is \u003ci>P\u003c/i>(head and 6)?","options":[{"t":"`1/36`","why":"That treats the coin like a die.","_n":"84bc","_k":"85455f67"},{"t":"`1/12`","why":"Independent: `1/2 × 1/6`.","_n":"95c8","_k":"f0807faa"},{"t":"`1/6`","why":"The head must happen too.","_n":"a5b8","_k":"d4fb5064"},{"t":"`2/3`","why":"‘And’ for independent events multiplies.","_n":"b5a8","_k":"3578021c"}],"hints":["Are the events independent?","Multiply the probabilities.","`1/2 × 1/6 = 1/12`."]},{"id":"w4","skill":"Independent events","goal":2,"prompt":"A spinner lands on red with probability `1/4`. It’s spun 3 times. What is \u003ci>P\u003c/i>(red, red, not red), \u003cstrong>in that order\u003c/strong>?","options":[{"t":"`1/64`","why":"\u003ci>P\u003c/i>(not red) = `3/4`.","_n":"c598","_k":"eb63f7b9"},{"t":"`3/64`","why":"`1/4 × 1/4 × 3/4`.","_n":"d588","_k":"fe545434"},{"t":"`9/64`","why":"That’s all 3 orders with exactly two reds; this asks for one order.","_n":"e578","_k":"a375995d"},{"t":"`1/2`","why":"Multiply along the path.","_n":"f568","_k":"21bc6017"}],"hints":["Multiply along one path.","\u003ci>P\u003c/i>(not red) = 1 − `1/4`.","`(1/4)(1/4)(3/4) = 3/64`."]},{"id":"w5","skill":"Expected value","goal":4,"prompt":"`X` takes the values 0, 1, 2 with probabilities `1/4`, `1/2`, `1/4`. Find `E(X)`.","options":[{"t":"`1/3`","why":"`E(X)` is a weighted average of the values.","_n":"g558","_k":"ffafcc21"},{"t":"`1/2`","why":"That’s a probability, not a value of `X`.","_n":"h648","_k":"f8bc5a0a"},{"t":"1","why":"`0(1/4) + 1(1/2) + 2(1/4) = 1`.","_n":"i638","_k":"170add43"},{"t":"3","why":"Weight each value by its probability.","_n":"j629","_k":"55cc5481"}],"hints":["`E(X) = Σ x P(x)`.","`0 + 1/2 + 2/4`.","1."]},{"id":"w6","skill":"Complements","goal":3,"prompt":"A die is rolled twice. What is \u003ci>P\u003c/i>(at least one 6)?","options":[{"t":"`1/36`","why":"That’s both rolls being 6.","_n":"k639","_k":"85f83765"},{"t":"`11/36`","why":"`1 - (5/6)^2 = 1 - 25/36`.","_n":"l609","_k":"e9ac8342"},{"t":"`1/3`","why":"Adding `1/6 + 1/6` counts double sixes twice.","_n":"m619","_k":"e563a919"},{"t":"`25/36`","why":"`25/36` is the chance of \u003cstrong>no\u003c/strong> sixes.","_n":"n669","_k":"851d0339"}],"hints":["What’s the opposite of ‘at least one 6’?","No sixes: `(5/6)^2`.","`1 - 25/36 = 11/36`."]}],"refreshers":{"Combinations":"`C(n, r)` counts ways to choose `r` things from `n` when order doesn’t matter: `n! ÷ (r!(n - r)!)`. It also counts the orders of `r` successes among `n` trials.","Independent events":"If one event doesn’t change the other’s probability, \u003ci>P\u003c/i>(\u003ci>A\u003c/i> and \u003ci>B\u003c/i>) = `P(A) × P(B)`. A path in a tree multiplies its branch probabilities.","Expected value":"`E(X) = Σ x P(X = x)`: each value weighted by its probability. It’s a long-run average.","Complements":"\u003ci>P\u003c/i>(at least one) = 1 − \u003ci>P\u003c/i>(none). It’s often far shorter than adding many cases."}}},"explore":{"heading":"Binomial board","intro":"Set the number of trials and the chance of success. Watch the distribution form. Tap a bar or select a range to see its probability.","predIntro":"Make a prediction first. Then the binomial board will show you what really happens.","predictions":[{"id":"p1","start":{"view":"galton","n":4,"p":"1/2"},"prompt":"How many different paths lead to bin 2 (exactly 2 successes)?","options":[{"t":"2","_n":"o679","_k":"49923875"},{"t":"4","_n":"p649","_k":"9c199855"},{"t":"6","_n":"q659","_k":"f99bb69e"},{"t":"16","_n":"r5a9","_k":"59a2ccf7"}],"explain":"Choose which 2 of the 4 pegs send the ball right: `C(4, 2) = 6`. So `P(X = 2) = 6 × (1/2)^4 = 6/16`."},{"id":"p2","start":{"view":"hist","n":10,"p":"0.5","to":"0.2"},"prompt":"What happens to the shape?","options":[{"t":"It becomes skewed right, with the peak near 2","_n":"s5b9","_k":"3ff9a3f2"},{"t":"It becomes skewed left","_n":"t689","_k":"96244555"},{"t":"It stays symmetric but moves to 2","_n":"u679","_k":"00f50f53"},{"t":"It flattens out evenly","_n":"v6a9","_k":"9d64e0f6"}],"explain":"`E = 10 × 0.2 = 2`. Values below 0 are impossible, but values up to 10 aren’t, so the tail stretches right."},{"id":"p3","start":{"view":"hist","n":10,"p":"0.3","to":40},"prompt":"What happens to `σ`?","options":[{"t":"It quadruples","_n":"w699","_k":"1c1f785f"},{"t":"It doubles (to about 2.90)","_n":"x649","_k":"21e3cc4a"},{"t":"It halves","_n":"y639","_k":"a16f68eb"},{"t":"It stays the same","_n":"z669","_k":"c133dd8d"}],"explain":"`σ = √{npq}`. Multiplying `n` by 4 multiplies `σ` by `√4 = 2`."},{"id":"p4","start":{"view":"hist","n":5,"p":"1/2"},"prompt":"What is the most likely number of heads in 5 tosses?","options":[{"t":"All values are equally likely","_n":"10659","_k":"74258477"},{"t":"2 and 3, equally","_n":"11609","_k":"849a2fdc"},{"t":"2.5","_n":"125f9","_k":"3931db6b"},{"t":"5","_n":"135e8","_k":"5a76788e"}],"explain":"`E(X) = 2.5` is the long-run average, but no single experiment can give 2.5 heads."}],"chalIntro":"Use the binomial board to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"Set `n` and `p` so that `E(X) = 6` and `σ = 2`.","why":"`np = 6` and `npq = 4` give `q = 4 ÷ 6 = 2/3`, so `p = 1/3` and `n = 6 ÷ (1/3) = 18`.","hints":["You need `np = 6` and `npq = 4`.","Divide: `q = 4 ÷ 6 = 2/3`.","`p = 1/3`, so `n = 6 ÷ (1/3) = 18`."]},{"id":"tc2","goal":4,"prompt":"With `n = 6`, choose `p` so that the most likely value is 4.","why":"The peak sits close to `E = np`. With `p` from 0.6 to 0.7 (or `2/3`), the single tallest bar is at 4.","hints":["The peak sits close to `E = np`.","You want `np` near 4, so `p` near `4/6`.","`p = 2/3` gives `E = 4` and a peak at 4; 0.6 to 0.7 also work."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"A basketball player makes `3/4` of her free throws. Using the board, find the \u003cstrong>smallest\u003c/strong> number of shots `n` for which \u003ci>P\u003c/i>(at least one miss) is greater than 0.9.","why":"\u003ci>P\u003c/i>(at least one miss) = `1 - (3/4)^9 ≈ 0.9249`. With 8 shots it’s only about 0.8999.","hints":["\u003ci>P\u003c/i>(at least one miss) = 1 − \u003ci>P\u003c/i>(no misses).","\u003ci>P\u003c/i>(no misses) = `(3/4)^n`. You need it below 0.1.","`(3/4)^8 ≈ 0.1001` and `(3/4)^9 ≈ 0.0751`, so `n = 9`."]}]},"part3":{"slug":"is-it","name":"Is it binomial?","heading":"Is it binomial?","intro":"The formula only works when the situation is binomial. Run the BINS check on six scenarios, repair the ones that fail, then build the formula from a tree.","bins":[{"id":"B","t":"\u003cstrong>B\u003c/strong>inary outcomes"},{"id":"I","t":"\u003cstrong>I\u003c/strong>ndependent trials"},{"id":"N","t":"\u003cstrong>N\u003c/strong>umber of trials fixed"},{"id":"S","t":"\u003cstrong>S\u003c/strong>ame `p` each time"}],"cards":[{"id":"c1","t":"Roll a die 10 times; `X` = number of 6s.","_a":"P2o=","right":"Binomial: `n = 10`, `p = 1/6`. Each roll is a 6 or not, the rolls don’t affect each other, there are exactly 10, and `p = 1/6` every time.","extra":"Each roll is a 6 or not, the rolls are independent, there are exactly 10 and `p = 1/6` every time. Nothing fails."},{"id":"c2","t":"Draw 5 cards from a deck without replacement; `X` = number of hearts.","_a":"PxUtFU0XYEY5","right":"Not binomial: without replacement each draw depends on the ones before, so `p` changes after every card. Without replacement from a small group, each draw changes the next one’s probability. That’s not binomial.","none":"After a heart is drawn, fewer hearts remain, so `p` changes.","miss":{"I":"Does one draw affect the next? A heart that’s gone can’t be drawn again.","S":"After a heart is drawn, fewer hearts remain, so `p` changes."},"extra":"Each card is a heart or not (binary), and there are exactly 5 draws (fixed `n`)."},{"id":"c3","t":"Toss a coin until the first head; `X` = tails before it.","_a":"PxUqFTw=","right":"Not binomial: you toss until the first head, so the number of tosses isn’t fixed. That’s a waiting-time situation (module 22).","miss":{"N":"How many tosses will there be? You can’t tell in advance."},"extra":"Each toss is a head or a tail, the tosses are independent and `p = 1/2` every time. Only one condition fails."},{"id":"c4","t":"Survey 8 randomly chosen students at a school of 2000, where 30% bike to school; `X` = bikers.","_a":"P2o=","right":"Close enough: binomial with `n = 8`, `p = 0.3`. Removing 8 people from 2000 barely changes 30%.","extraBy":{"I":"Strictly, yes, but with 2000 students, removing 8 changes 30% only in the third decimal. We treat it as binomial. Module 23 shows when that’s not safe.","S":"Strictly, yes, but with 2000 students, removing 8 changes 30% only in the third decimal. We treat it as binomial. Module 23 shows when that’s not safe."},"extra":"Each student bikes or doesn’t, and exactly 8 are surveyed."},{"id":"c5","t":"Roll a die 6 times; `X` = sum of the rolls.","_a":"PxUmFTw=","right":"Not binomial: `X` is a sum of the numbers rolled, not a count of successes, even though `n = 6` is fixed.","miss":{"B":"What does `X` count? The sum of the numbers isn’t a number of successes."},"extra":"The rolls are independent, there are exactly 6, and each roll’s chances stay the same. Only the ‘count of successes’ part fails."},{"id":"c6","t":"A goalie faces 12 shots, but her save rate drops as she tires; `X` = saves.","_a":"PxU3FTw=","right":"Not binomial: her save rate drops as she tires, so `p` isn’t the same on every shot.","miss":{"S":"Her save rate drops as she tires. Is `p` the same on every shot?"},"extra":"Each shot is a save or not, she faces exactly 12, and one shot’s result doesn’t decide the next. The problem is that `p` drifts down."}],"fixes":[{"id":"c2","t":"Draw 5 cards from a deck without replacement; `X` = number of hearts.","options":[{"t":"Replace each card before the next draw","why":"Now every draw has `p = 13/52 = 1/4`, and the draws are independent: binomial with `n = 5`, `p = 1/4`.","_n":"145f8","_k":"ba817885"},{"t":"Draw 6 cards instead","why":"Still without replacement: each draw still changes the next one’s probability.","_n":"15608","_k":"02d42e68"}]},{"id":"c3","t":"Toss a coin until the first head; `X` = tails before it.","options":[{"t":"Toss exactly 10 times","why":"Now `n = 10` is fixed: the number of tails in 10 tosses is binomial with `p = 1/2`.","_n":"16618","_k":"64b3ee31"},{"t":"Toss until 2 heads","why":"Still no fixed number of tosses: you wait for the second head.","_n":"17628","_k":"cded8a68"}]},{"id":"c6","t":"A goalie faces 12 shots, but her save rate drops as she tires; `X` = saves.","options":[{"t":"Assume every save chance is 0.8","why":"With the same `p = 0.8` on all 12 shots, `X` is binomial with `n = 12`, `p = 0.8`.","_n":"18638","_k":"58f95765"},{"t":"Count only the first 6 shots","why":"Her save rate still drops during those 6 shots, so `p` still changes.","_n":"19648","_k":"b04ea6f8"}]}],"quickCheck":{"title":"Quick check","summary":"Is it binomial? quick check","items":[{"id":"q1","goal":1,"prompt":"Drawing 3 marbles without replacement from a bag of 5 (2 red): which condition fails?","choices":[{"t":"Fixed number of trials","fb":"Removing a red marble changes the next draw’s chances.","_n":"1a658","_k":"256782a1"},{"t":"Independent trials","fb":"Right. Removing a red marble changes the next draw’s chances.","_n":"1b568","_k":"38191d53"},{"t":"Two outcomes","fb":"Removing a red marble changes the next draw’s chances.","_n":"1c578","_k":"c96df1cc"},{"t":"None fails","fb":"Removing a red marble changes the next draw’s chances.","_n":"1d648","_k":"c4aeedf9"}]},{"id":"q2","goal":2,"prompt":"`X` is binomial with `n = 4` and `p = 1/2`. `P(X = 2)`?","choices":[{"t":"`1/16`","fb":"`p^x q^{n - x}` is the chance of one particular order, like SSFF. There are `C(n, x)` orders, so multiply by it. 6 orders × `1/16`.","_n":"1e638","_k":"b255d22b"},{"t":"`1/4`","fb":"6 orders × `1/16`.","_n":"1f628","_k":"0d479fad"},{"t":"`3/8`","fb":"Right. 6 orders × `1/16` = `6/16 = 3/8`.","_n":"1g618","_k":"28cb4b18"},{"t":"`1/2`","fb":"6 orders × `1/16`.","_n":"1h688","_k":"30088759"}]},{"id":"q3","goal":1,"prompt":"Which is binomial?","choices":[{"t":"Number of 3s in 12 rolls","fb":"Right. Fixed `n`, independent rolls, success = 3, `p = 1/6`.","_n":"1i678","_k":"84115ea8"},{"t":"Rolls until a 3","fb":"Fixed `n`, independent rolls, success = 3, `p = 1/6`.","_n":"1j668","_k":"3c984e65"},{"t":"Sum of 12 rolls","fb":"Fixed `n`, independent rolls, success = 3, `p = 1/6`.","_n":"1k658","_k":"21cb408b"},{"t":"Number of aces in 5 cards dealt","fb":"Fixed `n`, independent rolls, success = 3, `p = 1/6`.","_n":"1l5c8","_k":"e3bc053f"}]},{"id":"q4","goal":2,"prompt":"How many orders give exactly 3 successes in 5 trials?","choices":[{"t":"3","fb":"`C(5, 3) = 10`.","_n":"1m5b8","_k":"20e1c07b"},{"t":"5","fb":"`C(5, 3) = 10`.","_n":"1nea8","_k":"ce6a59c3"},{"t":"10","fb":"Right. `C(5, 3) = 10`.","_n":"1oeb8","_k":"09ff7372"},{"t":"15","fb":"`C(5, 3) = 10`.","_n":"1pe88","_k":"854fcff8"}]}]}},"practice":{"activities":[{"id":"binornot","type":"sorter","title":"Binomial or not?","summary":"Binomial or not?","goal":1,"noun":"scenario","txt":true,"instruction":"Sort each scenario: is `X` binomial? If not, which kind of failure is it?","boxes":[{"id":"b1","label":"Binomial"},{"id":"b2","label":"Not binomial: trials depend on each other or `p` changes"},{"id":"b3","label":"Not binomial: no fixed `n`, or `X` isn’t a count of successes"}],"items":[{"id":"i1","t":"15 multiple-choice questions, each with 4 options, all guessed; `X` = number correct","_a":"RlVVFQ==","why":"15 trials, each right or wrong, independent guesses, `p = 1/4` every time.","hints":["Is there a fixed number of trials?","Does each trial change the next?","Binomial: 15 independent guesses, each right with `p = 1/4`."]},{"id":"i2","t":"Choose 4 people from a club of 9 (5 girls) for a committee; `X` = girls","_a":"RlVWFQ==","why":"Choosing without replacement from a small club changes the chance of a girl after each pick.","hints":["Is there a fixed number of trials?","Does each trial change the next?","Depend: once a girl is chosen, fewer girls remain, so `p` changes."]},{"id":"i3","t":"Fire a ball at a target until it hits; `X` = misses","_a":"RlVXFQ==","why":"You keep firing until a hit, so the number of trials isn’t fixed.","hints":["Is there a fixed number of trials?","Does each trial change the next?","No fixed `n`: you fire until it hits."]},{"id":"i4","t":"20 seeds from a large bag, each sprouting with probability 0.85; `X` = sprouts","_a":"RlVVFQ==","why":"20 seeds, each sprouts or not, independently, with `p = 0.85` each.","hints":["Is there a fixed number of trials?","Does each trial change the next?","Binomial: `n = 20`, `p = 0.85`."]},{"id":"i5","t":"Roll two dice 10 times; `X` = number of doubles","_a":"RlVVFQ==","why":"10 rolls of the pair, each a double or not, with `p = 6/36 = 1/6`.","hints":["Is there a fixed number of trials?","Does each trial change the next?","Binomial: `n = 10`, `p = 1/6`."],"wrong":{"b3":"There are exactly 10 rolls of the pair; a double has probability `6/36`."}},{"id":"i6","t":"A student writes 5 tests and studies less after each pass; `X` = passes","_a":"RlVWFQ==","why":"Studying less after each pass changes the chance of passing the next test.","hints":["Is there a fixed number of trials?","Does each trial change the next?","Depend: `p` changes as she studies less."]},{"id":"i7","t":"Measure the heights of 10 students; `X` = mean height","_a":"RlVXFQ==","why":"A mean height isn’t a count of successes.","hints":["Is there a fixed number of trials?","Does each trial change the next?","Not a count: `X` is a mean, not a number of successes."]},{"id":"i8","t":"Deal 13 cards from a deck; `X` = spades","_a":"RlVWFQ==","why":"Dealing without replacement changes the deck after every card.","hints":["Is there a fixed number of trials?","Does each trial change the next?","Depend: each card dealt changes the deck."],"wrong":{"b1":"Each card dealt changes the deck."}}],"wrongDefault":"Run BINS: two outcomes? independent? fixed `n`? same `p`?"},{"id":"calc","type":"custom","title":"Calculate it","summary":"Calculate it","goal":[2,3,4,6]," 3/4`, so `p = 1/4` and `n = 12 ÷ 1/4 = 48`.","wrong":[{"all":[24,0.5],"fb":"Then `σ = √6`. Use `q = npq ÷ np = 9 ÷ 12`."}],"hints":["`np = 12` and `npq = 9`.","`q = 9/12 = 3/4`.","`p = 1/4`, `n = 12 ÷ 1/4 = 48`."]},{"id":"b7","goal":6,"star":true,"prompt":"A 4-question quiz has 4 options per question. A student guesses all 4. What’s \u003ci>P\u003c/i>(at least 3 correct)?","_a":"VBlUAlECC1VWAg==","display":"`13/256`","why":"`P(3) + P(4) = 12/256 + 1/256 = 13/256`.","wrong":[{"match":0.046875,"fb":"Add \u003ci>P\u003c/i>(4 correct) = `1/256`."}],"hints":["At least 3 means 3 or 4.","`P(3) = C(4, 3)(1/4)^3(3/4) = 12/256`.","`12/256 + 1/256 = 13/256`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Veda","how":"","goal":[2,3,4],"instruction":"Veda made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find \u003ci>P\u003c/i>(exactly 2 sixes in 4 rolls of a die).","steps":["Binomial: `n = 4`, `p = 1/6`, `x = 2`.","`P = (1/6)^2(5/6)^2`.","`= 25/1296`."],"_a":"VQ==","stepFb":["Step 1 sets it up correctly. Keep checking.","","Step 3 does the arithmetic of step 2 correctly. The mistake is earlier."],"fixes":[{"t":"Add instead: `2/6 + 10/6`.","why":"Probabilities along a path multiply.","_n":"1qe98","_k":"d3494a24"},{"t":"Multiply by `C(4, 2) = 6`: `P = 150/1296 = 25/216`.","why":"`p^x q^{n - x}` is the chance of one particular order, like SSFF. There are `C(n, x)` orders, so multiply by it.","_n":"1re68","_k":"b2171253"},{"t":"Use `(1/6)^2(5/6)^4`.","why":"The exponents must add to `n = 4`.","_n":"1se78","_k":"3025a8ec"},{"t":"Step 2 is correct.","why":"`(1/6)^2(5/6)^2` is one order, like 66XX. There are 6 orders.","_n":"1te48","_k":"021b88a0"}],"hints":["Is SSFF the only way to get 2 sixes?","Count the orders: `C(4, 2)`.","`6 × 25/1296 = 25/216`."]},{"id":"e2","goal":3,"task":"Find \u003ci>P\u003c/i>(at least one head in 5 tosses).","steps":["‘At least one’ means 1 or more heads.","`P(X ≥ 1) = 1 - P(X = 1)`.","`P(X = 1) = 5/32`.","Answer: `27/32`."],"_a":"VQ==","stepFb":["Step 1 is correct.","","Step 3 computes `P(X = 1)` correctly, but it’s the wrong thing to subtract.","Step 4 follows step 3."],"fixes":[{"t":"Step 2 is correct.","why":"The complement of ‘at least 1’ is ‘none’ (`X = 0`).","_n":"1ue58","_k":"e825b764"},{"t":"`P(X ≥ 1) = P(X = 1) = 5/32`.","why":"‘At least 1’ means 1, 2, 3, …. Its complement is `X = 0`, so use `1 - P(X = 0)`.","_n":"1ve28","_k":"cc893fe8"},{"t":"`P(X ≥ 1) = 5 × 1/2`.","why":"Probabilities can’t exceed 1.","_n":"1we38","_k":"2cc222fc"},{"t":"`P(X ≥ 1) = 1 - P(X = 0) = 1 - 1/32 = 31/32`.","why":"‘At least 1’ means 1, 2, 3, …. Its complement is `X = 0`, so use `1 - P(X = 0)`.","_n":"1xd08","_k":"cea74a08"}],"hints":["What’s the opposite of ‘at least one head’?","No heads at all.","`1 - (1/2)^5 = 31/32`."]},{"id":"e3","goal":4,"task":"Find the standard deviation of the number of heads in 100 tosses.","steps":["`n = 100`, `p = 0.5`, `q = 0.5`.","`E(X) = np = 50`.","Variance = `npq = 25`.","So `σ = 25`."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Step 4 is correct.","why":"`σ` is the square root of the variance.","_n":"1ycf8","_k":"efbfa805"},{"t":"`σ = √25 = 5`.","why":"`σ` is the square root of the variance: `√{npq} = √25 = 5`.","_n":"1zd28","_k":"6f79ee78"},{"t":"`σ = 50`.","why":"That’s the mean.","_n":"20d18","_k":"9375dcd7"},{"t":"`σ = 25 ÷ 100`.","why":"Don’t divide by `n`.","_n":"21d48","_k":"4b7634f3"}],"hints":["How are variance and standard deviation related?","`σ = √variance`.","`√25 = 5`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the binomial board: the Galton paths, the skewed shapes, or how slowly `σ` grows with `n`?"},{"id":"j2","q":"In your own words, explain what each part of `C(n, x) p^x q^{n - x}` counts."},{"id":"j3","q":"Explain to a friend how to decide whether a situation is binomial."},{"id":"j4","q":"Which kind of question still trips you up: ‘at least’, working backwards, or checking conditions? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which of these is required for `X` to have a binomial distribution?","options":[{"t":"The trials continue until a success","why":"That’s a waiting-time (geometric) situation.","_n":"22d38","_k":"3913c7af"},{"t":"The probability of success is the same on every trial","why":"One of the four conditions.","_n":"23d68","_k":"b75aba50"},{"t":"The number of successes is fixed in advance","why":"The number of \u003cstrong>trials\u003c/strong> is fixed; the number of successes is what `X` counts.","_n":"24d58","_k":"8260d1d7"},{"t":"Success and failure are equally likely","why":"`p` can be any value from 0 to 1.","_n":"25d88","_k":"b2bc1a8b"}]},"b":{"prompt":"Which experiment gives a binomial random variable?","options":[{"t":"Roll a die 8 times; `X` = sum of the rolls","why":"`X` isn’t a count of successes.","_n":"26d78","_k":"5f3c671f"},{"t":"Draw 4 cards without replacement; `X` = number of aces","why":"The draws depend on each other.","_n":"27e67","_k":"311ce6f5"},{"t":"Roll a die 8 times; `X` = number of 1s","why":"Fixed `n = 8`, independent rolls, `p = 1/6`.","_n":"28e77","_k":"55e8763c"},{"t":"Roll a die until a 1 appears; `X` = number of rolls","why":"No fixed number of trials.","_n":"29e87","_k":"ff112d41"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`X` is binomial with `n = 4` and `p = 1/2`. Find `P(X = 3)`.","options":[{"t":"`1/16`","why":"That’s one order; there are 4.","_n":"2ae97","_k":"6f091328"},{"t":"`1/4`","why":"`C(4, 3)(1/2)^4 = 4/16`.","_n":"2be27","_k":"3206691b"},{"t":"`3/8`","why":"That uses `C(4, 2) = 6`.","_n":"2ce37","_k":"0a16c2bc"},{"t":"`3/4`","why":"That’s `x ÷ n`, not a probability.","_n":"2de47","_k":"a0fd95ec"}]},"b":{"prompt":"`X` is binomial with `n = 5` and `p = 1/3`. Find `P(X ith `n = 80`, `p = 0.5`. How do their standard deviations compare?","options":[{"t":"Q’s `σ` is four times P’s","why":"`σ = √{npq}`. Multiplying `n` by 4 multiplies `σ` by `√4 = 2`, not 4.","_n":"3a1e9","_k":"2bf7f99d"},{"t":"They’re the same","why":"`n` changed, so `σ` changed.","_n":"3baf9","_k":"7b623c45"},{"t":"Q’s `σ` is half of P’s","why":"More trials spread the counts out.","_n":"3cae9","_k":"5f4e2087"},{"t":"Q’s `σ` is twice P’s","why":"`√{80/20} = 2`.","_n":"3dad9","_k":"e609a4a2"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why \u003ci>P\u003c/i>(exactly 2 heads in 4 tosses) = `6 × (1/2)^4`, not just `(1/2)^4`?","options":[{"t":"“The tosses are dependent, so we multiply by 6.”","why":"The tosses are independent.","_n":"3eac9","_k":"41293c03"},{"t":"“There are 6 outcomes in the sample space.”","why":"There are 16 outcomes.","_n":"3fab9","_k":"d584dae5"},{"t":"“`(1/2)^4` is the probability of one particular order, such as HHTT. There are `C(4, 2) = 6` different orders with exactly 2 heads.”","why":"Each order has probability `(1/2)^4`, and there are 6 of them.","_n":"3gaa9","_k":"f487d21c"},{"t":"“We multiply by 6 because 2 + 4 = 6.”","why":"The 6 counts orders, not a sum.","_n":"3ha99","_k":"c1e9aeb0"}]},"b":{"prompt":"Which is the best explanation of the `C(n, x)` factor in the binomial formula?","options":[{"t":"“It’s the number of successes expected.”","why":"That’s `np`.","_n":"3ia89","_k":"eab78064"},{"t":"“It corrects for dependent trials.”","why":"Binomial trials are independent.","_n":"3ja79","_k":"550527c0"},{"t":"“It makes the probabilities add to `n`.”","why":"They add to 1.","_n":"3ka69","_k":"6e26f6cc"},{"t":"“It counts the different orders in which `x` successes can occur among `n` trials; each order has the same probability `p^x q^{n - x}`.”","why":"Count the orders, then multiply by one order’s probability.","_n":"3la98","_k":"5d048674"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"A 20-question true/false test is answered entirely by guessing. `E(X) = 10`. Which statement is correct?","options":[{"t":"“Every student who guesses scores exactly 10.”","why":"`E(X)` is a long-run average, not a guaranteed score: guessers’ scores vary.","_n":"3maa9","_k":"9af33b45"},{"t":"“Scores above 10 are impossible.”","why":"Any score from 0 to 20 is possible.","_n":"3nab9","_k":"d2d062dd"},{"t":"“A score of 10 has probability `1/2`.”","why":"`P(X = 10)` is about 0.18.","_n":"3oac9","_k":"96a717a1"},{"t":"“Over many students guessing, the average score would be about 10.”","why":"`E(X)` is a long-run average.","_n":"3pa58","_k":"b213cb0c"}]},"b":{"prompt":"Boxes of 12 items each contain defective items with probability 0.2 per item, independently. `E(X) = 2.4`. Which statement is correct?","options":[{"t":"“Over many boxes, the average number of defective items per box is about 2.4.”","why":"`E(X)` is a long-run average.","_n":"3qa68","_k":"8705a5c6"},{"t":"“Every box contains 2 or 3 defective items.”","why":"`E(X)` is a long-run average: a box can hold anywhere from 0 to 12 defective items.","_n":"3ra78","_k":"7fce5a43"},{"t":"“2.4 is the most likely number of defective items.”","why":"The most likely value is 2.","_n":"3sa88","_k":"9ecef5a1"},{"t":"“A box can’t contain 2.4 items, so `E(X)` is wrong.”","why":"`E(X)` is a long-run average. It doesn’t have to be a possible value.","_n":"3ta18","_k":"a688b187"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Five independent smoke detectors in a building each work with probability 0.9. What is the probability that at least 4 of them work?","use":"`(0.9)^5 ≈ 0.590` and `(0.9)^4 ≈ 0.656`","options":[{"t":"About 0.59","why":"That’s only \u003ci>P\u003c/i>(all 5 work).","_n":"3ua28","_k":"5e601a39"},{"t":"About 0.66","why":"That uses `(0.9)^4(0.1)` without the factor `C(5, 4) = 5`.","_n":"3va38","_k":"94dddb63"},{"t":"About 0.33","why":"That’s only \u003ci>P\u003c/i>(exactly 4 work).","_n":"3wa28","_k":"129c87d7"},{"t":"About 0.92","why":"`P(5) + P(4) = 0.590 + 5(0.656)(0.1) = 0.590 + 0.328`.","_n":"3xa58","_k":"231323c4"}]},"b":{"prompt":"A drone has 4 independent rotors, each working with probability 0.9. It flies if at least 3 work. What is \u003ci>P\u003c/i>(it flies)?","use":"`(0.9)^4 ≈ 0.656` and `(0.9)^3 ≈ 0.729`","options":[{"t":"About 0.66","why":"That’s only \u003ci>P\u003c/i>(all 4 work).","_n":"3ya48","_k":"a94f2263"},{"t":"About 0.95","why":"`0.656 + 4(0.729)(0.1) = 0.656 + 0.292`.","_n":"3za78","_k":"7c46f648"},{"t":"About 0.29","why":"That’s only \u003ci>P\u003c/i>(exactly 3 work).","_n":"40a68","_k":"bc65b49d"},{"t":"About 0.73","why":"That leaves out `C(4, 3) = 4`.","_n":"41a98","_k":"1d65e2bf"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A seed company claims 80% of its seeds sprout. You plant 5 seeds and only 2 sprout. If the claim is true, `P(X \u003c= 2) ≈ 0.058`. What is the best conclusion?","options":[{"t":"“The claim is proven false.”","why":"A probability of 0.058 is small, not zero.","_n":"42a88","_k":"7e6fe2bd"},{"t":"“`E(X) = 4`, so getting 2 is impossible.”","why":"`E(X)` is a long-run average, not the only possible result: 2 sprouts can happen.","_n":"439b8","_k":"94a2a1da"},{"t":"“A result this low would be unusual if the claim were true, so it casts some doubt on the claim, though it could happen by chance.”","why":"0.058 is small, but not zero: unusual, not impossible.","_n":"449a8","_k":"6cb30f39"},{"t":"“2 of 5 is 40%, so the true rate is exactly 40%.”","why":"Five seeds can’t pin the rate down exactly.","_n":"451d8","_k":"00b11f1e"}]},"b":{"prompt":"A player claims to make 90% of her free throws. She makes 6 of 10. If the claim is true, `P(X \u003c= 6) ≈ 0.013`. What is the best conclusion?","options":[{"t":"“The claim is proven false.”","why":"Unusual isn’t impossible.","_n":"461e8","_k":"a6198b4c"},{"t":"“Her true rate is exactly 60%.”","why":"One set of 10 shots can’t fix the rate.","_n":"471b8","_k":"dd2f8eb6"},{"t":"“Making 6 or fewer would be very unusual for a true 90% shooter, so the result gives evidence against the claim, though it isn’t proof.”","why":"0.013 is very small: strong evidence, but not proof.","_n":"481c8","_k":"2bfd34f3"},{"t":"“`E(X) = 9`, so 6 is impossible.”","why":"`E(X)` is a long-run average, not the only possible result: 6 makes can happen.","_n":"49198","_k":"de44fcd7"}]}}]},"task":{"title":"Design a binomial distribution","summary":"Design a binomial distribution","statement":"\u003cp>Choose `n` and `p` for a binomial distribution that meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"bn-conds\">\u003cli>On average there are 3 to 6 successes, and `E(X)` is a whole number.\u003c/li>\u003cli>It isn’t too spread out: `σ \u003c 2`.\u003c/li>\u003cli>It’s skewed right.\u003c/li>\u003cli>Zero successes are rare: `P(X = 0) \u003c 0.03`.\u003c/li>\u003c/ol>","checks":["Mean 3 to 6, whole number","`σ \u003c 2`","Skewed right","`P(X = 0) \u003c 0.03`"],"tips":["`E(X) = np`: try `n = 3 ÷ p`, `4 ÷ p`, … for your `p`.","`σ^2 = npq` must be under 4.","Skewed right needs `p` below `1/2`.","`P(X = 0) = q^n` shrinks as `n` grows: you may need more trials."],"explainPrompt":"Explain how you chose `n` and `p`, and why conditions 2 and 4 pull in opposite directions.","vocab":"Use the words expected value, standard deviation, skewed and complement.","more":"There’s more than one answer. Can you find them all?","after3":"Each answer balances `q^n` (needs large `n`) against `npq` (needs small `n`).","afterAt":6},"cards":[["Binomial conditions (BINS)","\u003cstrong>B\u003c/strong>inary outcomes, \u003cstrong>I\u003c/strong>ndependent trials, \u003cstrong>N\u003c/strong>umber of trials fixed, \u003cstrong>S\u003c/strong>ame `p` each trial."],["`P(X = x)`","`C(n, x) p^x q^{n - x}`, where `q = 1 - p`."],["Why `C(n, x)`?","It counts the orders of `x` successes among `n` trials."],["`E(X)`","`np`: e.g., 20 rolls, `p = 1/6`: about 3.3 sixes on average."],["`σ`","`√{npq}`: e.g., `n = 100`, `p = 0.5`: `σ = 5`."],["At least one success","`1 - q^n`."],["Shape","`p = 1/2` symmetric; `p \u003c 1/2` skewed right; `p > 1/2` skewed left."],["Effect of `n`","Multiplying `n` by 4 doubles `σ` (`√4 = 2`)."],["`E(X)` isn’t a guarantee","`n = 5`, `p = 1/2`: `E = 2.5`, which can’t happen in one experiment."],["Galton board","Each peg is a trial; `C(n, x)` paths lead to bin `x`."],["Not binomial","Drawing without replacement from a small group (use the hypergeometric)."],["Working backwards","`q = npq ÷ np`, then `p = 1 - q` and `n = E ÷ p`."]]}};</script>
