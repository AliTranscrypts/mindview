.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 30: Bias switchboard (D12 switchboard form), Media watch items, Fair survey task.
   Truth mark --f3 (teal, dashed); estimate needle --ink; bias arrow --hi; poll dots and bars --pen (plan §5). */
/* radioGroup (from MDM4U 19 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* Bias switchboard */
.bs-top{margin-bottom:4px}
canvas.plot.bs-plot{aspect-ratio:16/10}
.bs-cap{font-size:clamp(1.05rem,2.4vw,1.35rem)}
.bs-sws{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.bs-sw{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);cursor:pointer;position:relative}
.bs-sw:has(.bs-cb:checked){border-color:var(--pen);background:var(--info-bg)}
.bs-sw.bs-locked{opacity:.6;cursor:not-allowed}
.bs-cb{position:absolute;opacity:0;width:40px;height:24px;margin:0;left:10px;top:9px;cursor:inherit}
.bs-track{position:relative;flex:none;width:40px;height:22px;margin-top:1px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.bs-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.bs-cb:checked + .bs-track{background:var(--pen);border-color:var(--pen)}
.bs-cb:checked + .bs-track .bs-knob{left:19px;border-color:var(--pen)}
.bs-cb:focus-visible + .bs-track{outline:3px solid var(--hi);outline-offset:2px}
.bs-cb:disabled + .bs-track{opacity:.5}
.bs-ic{flex:none;width:24px;height:24px;color:var(--ink-2)}
.bs-ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bs-swt{display:flex;flex-direction:column;gap:2px;min-width:0}
.bs-swt strong{font-size:.95rem}
.bs-swd{font-size:.84rem;color:var(--ink-2)}
.bs-lockmsg{min-height:1.2em;margin:2px 0 0}
.bs-n{margin-top:4px}
.bs-n input{width:100%}
.bs-tc3{margin-top:12px;padding:10px 12px;border:1.5px dashed var(--rule);border-radius:8px}
.bs-t3h{margin:0 0 8px;font-size:.92rem}
.bs-lab{margin-top:10px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px}
.bs-labq{margin:0 0 8px;font-size:.92rem}
.bs-verdict{font-weight:600}
.bs-all .tbl-wrap{max-height:320px;overflow:auto}
@media (prefers-reduced-motion:reduce){.bs-track,.bs-knob{transition:none}}
@media (max-width:760px){.bs-pg .pg-ctrl{order:-1}.bs-pg{display:flex;flex-direction:column}}

/* Media watch */
.bs-st{border:1.5px solid var(--rule);border-radius:10px;padding:14px 16px;margin:0 0 16px;background:var(--sheet)}
.bs-sthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px;margin-bottom:8px}
.bs-stlab{font-weight:700;color:var(--ink-2);font-size:.9rem}
.bs-news{margin:0;padding:10px 14px;border-left:4px solid var(--ink-2);background:var(--paper);font-size:1.08rem;font-weight:600}
.bs-src{margin:6px 0 10px}
.bs-step{margin-top:12px}
.bs-sq{margin:0 0 8px;font-weight:600}
.bs-chips{display:flex;flex-wrap:wrap;gap:6px}
.bs-chip{color:var(--ink);text-align:left}
.bs-chip[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd);font-weight:700}
.bs-chip:disabled{opacity:.8}
.bs-after{margin:12px 0 0;font-style:italic}
.bs-graph{margin:6px 0 10px}
canvas.plot.bs-gplot{aspect-ratio:16/9;max-width:560px}

/* Fair survey task */
.bs-conds{margin:6px 0 0;padding-left:1.3em}
.fs-in .rg-wrap{align-items:flex-start;flex-direction:column}
canvas.plot.bs-tplot{aspect-ratio:16/8}

</style>

 Histograms","kind":"topic","group":"5"},{"nn":"34","slug":"scatter-plots","title":"Scatter Plots & Correlation","kind":"topic","group":"6"},{"nn":"35","slug":"pearson-r","title":"The Pearson Correlation Coefficient r","kind":"topic","group":"6"},{"nn":"36","slug":"linear-regression","title":"Linear Regression & Line of Best Fit","kind":"topic","group":"6"},{"nn":"37","slug":"residuals","title":"Residuals & Goodness of Fit","kind":"topic","group":"6"},{"nn":"38","slug":"causation","title":"Two-Variable Analysis & Causation","kind":"topic","group":"6"},{"nn":"39","slug":"culminating-investigation","title":"Culminating Data-Management Investigation","kind":"topic","group":"7"}]},"salt":"a8cb4de2","content":{"id":"30-bias","kind":"topic","title":"Sources of bias in surveys","topic":"Sources of Bias in Surveys","readyTopic":"sources of bias in surveys","hero":{"headline":"Big samples can still be wrong","text":"A survey can go wrong before a single number is calculated. \u003cstrong>Sampling bias\u003c/strong> asks the wrong people, \u003cstrong>non-response bias\u003c/strong> hears from the wrong people, \u003cstrong>response bias\u003c/strong> gets untruthful answers, and \u003cstrong>measurement bias\u003c/strong> builds the push into the question or tool. Unlike random error, \u003cstrong>bias doesn’t shrink\u003c/strong> when you ask more people.","fig":{"aria":"A bar labelled true support 50% stands beside an empty estimate bar. A landline phone list slides in and the estimate bar rises only to 40%. A speech bubble with a leading question appears and the estimate rises to 55%. A times-10 sample badge pops on: the estimate bar doesn’t move, but its thin error whisker shrinks. Caption: size shrinks the whisker, not the push.","shape":"wide"}},"goals":["I can identify sampling, non-response, response and measurement bias in a survey.","I can predict which way a bias pushes a result, and estimate its size in a simple model.","I can explain why a bigger sample doesn’t remove bias, and why biases that happen to cancel don’t make a design trustworthy.","I can design fair questions and procedures: neutral, single-issue wording, consent, privacy, and no cultural bias.","I can evaluate statistics and graphs in the media by checking sources, samples, questions and scales."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Sampling methods","goal":1,"prompt":"Asking the first 30 people who walk past you in a mall is which kind of sample?","options":[{"t":"Systematic","why":"There’s no list and no interval.","_n":"0374","_k":"04038024"},{"t":"Convenience","why":"Whoever is handy.","_n":"1344","_k":"4d7c1e51"},{"t":"Stratified","why":"No groups were sampled from.","_n":"2354","_k":"ae85cad8"},{"t":"Simple random","why":"Passers-by aren’t chosen by chance from a list.","_n":"3324","_k":"c3f1973e"}],"hints":["Who decided who was asked?","Whoever walked by.","Convenience."]},{"id":"w2","skill":"Sampling methods","goal":4,"prompt":"Which of these samples is random?","options":[{"t":"Every 10th name on the full town list, after a random start","why":"Systematic with a random start.","_n":"4334","_k":"71fa567f"},{"t":"The surveyor’s neighbours","why":"Convenience.","_n":"5304","_k":"d46d2766"},{"t":"Shoppers at the mall on Saturday","why":"Convenience.","_n":"6314","_k":"6d1af4b8"},{"t":"Residents who volunteer at a town hall meeting","why":"Volunteers choose themselves.","_n":"72e4","_k":"e232535e"}],"hints":["Does chance choose the people?","Only one option uses a random start on a full list.","Every 10th name on the town list."]},{"id":"w3","skill":"Weighted averages","goal":2,"prompt":"100 people answer ‘yes’ at a rate of 80%, and 100 others at a rate of 30%. What percent of all 200 say yes?","options":[{"t":"55%","why":"(80 + 30) ÷ 200.","_n":"82f4","_k":"f45a6539"},{"t":"50%","why":"That guesses the middle of 0 and 100. Use the counts.","_n":"908f","_k":"7b885a75"},{"t":"110%","why":"Percents of different groups don’t add.","_n":"a07f","_k":"6ef42506"},{"t":"80%","why":"That uses one group. Combine both groups.","_n":"b0af","_k":"a4f45f8f"}],"hints":["How many yeses in each group?","80 and 30.","110 ÷ 200 = 55%."]},{"id":"w4","skill":"Weighted averages","goal":2,"prompt":"10 people at 80% yes and 90 people at 30% yes. What percent of all 100 say yes?","options":[{"t":"35%","why":"8 + 27 = 35 yeses out of 100.","_n":"c09f","_k":"defd86c5"},{"t":"50%","why":"Use the counts.","_n":"d04f","_k":"02240290"},{"t":"55%","why":"That averages the two rates. The groups are different sizes.","_n":"e03f","_k":"0552aac6"},{"t":"30%","why":"That ignores the small group. The 10 people still count.","_n":"f06f","_k":"eeaef2a0"}],"hints":["Count the yeses.","8 from the first group, 27 from the second.","35 out of 100."]},{"id":"w5","skill":"Percent change","goal":5,"prompt":"Sales rose from 960 to 990. What is the percent increase, to 1 decimal place?","options":[{"t":"97%","why":"That divides 960 by 990. That’s a ratio, not a change.","_n":"g05f","_k":"c1a5608a"},{"t":"3.1%","why":"30 ÷ 960 ≈ 0.031.","_n":"h00f","_k":"e06a2a3b"},{"t":"1.03%","why":"That misreads the ratio 1.03. The ratio 1.03 means a 3% increase.","_n":"ifff","_k":"0c9c3acd"},{"t":"30%","why":"That uses the change as a percent. Divide the change by the starting value.","_n":"j76f","_k":"7a642a75"}],"hints":["Change ÷ original.","30 ÷ 960.","≈ 3.1%."]},{"id":"w6","skill":"Percent change","goal":5,"prompt":"Incidents rose from 4 to 6. What is the percent increase?","options":[{"t":"2%","why":"That uses the change as a percent. Divide by the original.","_n":"k77f","_k":"ed6497bd"},{"t":"150%","why":"That uses the ratio 1.5. 1.5 times means a 50% increase.","_n":"l78f","_k":"b15679a9"},{"t":"33%","why":"That divides by the new value. Divide by 4, not 6.","_n":"m79f","_k":"d8117231"},{"t":"50%","why":"2 ÷ 4.","_n":"n72f","_k":"88b8d652"}],"hints":["Change ÷ original.","2 ÷ 4.","50%."]}],"refreshers":{"Sampling methods":"Random methods (simple random, systematic, stratified, cluster) let chance choose. Convenience and voluntary samples let the surveyor or the respondents choose.","Weighted averages":"To combine groups, count the yeses in each group, add them, and divide by the total number of people. Don’t average the percents.","Percent change":"Percent change = (new − original) ÷ original × 100."}}},"explore":{"heading":"Bias switchboard","intro":"Flip bias switches on a town survey and watch the estimate move away from the truth. Then try changing the sample size.","predIntro":"Make a prediction first. Then the switchboard will show you what really happens.","predictions":[{"id":"p1","start":{"sw":[],"n":100,"mode":"sw"},"flip":["s"],"prompt":"Start with all switches off. Turn on sampling bias (the landline list). The estimate will…","options":[{"t":"stay at 50%","_n":"o73f","_k":"4ddfe26d"},{"t":"rise above 50%","_n":"p74f","_k":"c1cd47a1"},{"t":"fall below 50%","_n":"q75f","_k":"7b13a6b6"},{"t":"fall to 0%","_n":"r7ef","_k":"ae084922"}],"explain":"The gauge drops to 40.0%. Young residents, the strongest supporters, are mostly missing from the landline list."},{"id":"p2","start":{"sw":["s"],"n":100,"mode":"polls"},"prompt":"Sampling bias on, \u003ci>n\u003c/i> = 100. The sample size goes from 100 to 400. The estimate will…","options":[{"t":"move back to 50%","_n":"s7ff","_k":"54bb04b8"},{"t":"drop further","_n":"t7cf","_k":"1b71a1ee"},{"t":"stay at about 40%, with a narrower margin","_n":"u7bf","_k":"b9321e99"},{"t":"become exactly right","_n":"v7af","_k":"9dd62352"}],"explain":"In Repeated polls mode the cloud tightens around 40%, not 50%. Size shrinks random error only. More people from the same biased frame gives the same wrong answer with more confidence."},{"id":"p3","start":{"sw":[],"n":100,"mode":"sw"},"flip":["m"],"prompt":"All switches off. Turn on measurement bias (the leading question). The estimate will…","options":[{"t":"fall","_n":"w79f","_k":"324d57df"},{"t":"rise to about 65%","_n":"x78f","_k":"ee6debf2"},{"t":"stay at 50%, because people are honest","_n":"y77f","_k":"1c5c59f3"},{"t":"rise to 100%","_n":"z76f","_k":"f6630d25"}],"explain":"65.0%. The wording pushes honest people toward yes."},{"id":"p4","start":{"sw":["s","nr","m"],"n":100,"mode":"sw"},"prompt":"Turn on sampling, non-response and measurement bias together; the estimate is 51.9%. What should you conclude?","options":[{"t":"The design is still biased; the errors happen to cancel here","_n":"1075f","_k":"579035e4"},{"t":"The survey is trustworthy because it’s close to 50%","_n":"1184f","_k":"83524076"},{"t":"The true support must be 51.9%","_n":"1283f","_k":"f4715542"},{"t":"Three biases always cancel","_n":"130af","_k":"a084148d"}],"explain":"Each switch was toggled off in turn: without the leading question the estimate falls to 36.9%, and it climbs back to 51.9% only because the push up offsets the push down. Close by luck. With a different town the same design could miss by a lot."}],"chalIntro":"Use the switchboard to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Get an estimate within 1 percentage point of the truth, using a design you could defend.","why":"With every switch off, the sample is random from a full frame, everyone is followed up and the question is neutral: 50.0%, right by design, not by luck.","general":"Which settings cause bias?","hints":["Which settings cause bias?","All four switches do.","Turn them all off."]},{"id":"tc2","goal":2,"prompt":"With exactly two switches on, make the estimate as low as possible.","why":"Sampling and non-response bias both lose young supporters, so together they pull the estimate down to 36.9%.","hints":["Which switches push the estimate down?","Sampling and non-response both lose young supporters.","Turn on those two: 36.9%."]},{"id":"tc3","goal":[2,3],"stretch":true,"prompt":"Before flipping any switches, predict the estimate with \u003cstrong>sampling bias and measurement bias\u003c/strong> both on. Enter your prediction, then check. (Press \u003cstrong>Start challenge 3\u003c/strong> under the switches.)","why":"The frame reaches 10 youth, 100 adults and 90 seniors; with the leading question their yes rates are 95%, 60% and 45%: (9.5 + 60 + 40.5) ÷ 200 = 110 ÷ 200 = 55%.","hints":["The frame reaches 10 youth, 100 adults and 90 seniors.","With the leading question their yes rates are 95%, 60% and 45%.","(9.5 + 60 + 40.5) ÷ 200 = 110 ÷ 200 = 55%."]}]},"part3":{"slug":"media","name":"Media watch","heading":"Media watch","intro":"Five made-up news items, each with a problem in how its numbers were collected or shown. Tag the problems, choose the fixes, and use \u003cstrong>Check it with data\u003c/strong> to recalculate or redraw the numbers.","stations":[{"id":"m1","title":"The big online poll","news":"“92% of readers want the highway speed limit raised: 18 000 votes!”","src":"An online poll on a driving-enthusiast website.","steps":[{"id":"m1a","goal":5,"kind":"multi","prompt":"Tag the problems. Choose every one that applies, then press Check.","options":[{"t":"Voluntary response: readers chose whether to vote","_n":"140bf","_k":"35bd3b6e"},{"t":"The frame is driving enthusiasts, not all Canadians","_n":"1508f","_k":"8a479509"},{"t":"18 000 votes is too small a sample","why":"18 000 is plenty of votes. Volunteers choose themselves; thousands of volunteers are still not a random sample.","_n":"1609f","_k":"7fe2722c"},{"t":"The 92% must be calculated wrong","why":"The arithmetic may be fine; who voted is the problem.","_n":"1706f","_k":"9cfc5de2"}],"why":"Both problems are about who was counted: people who chose to vote, on a site for driving enthusiasts."},{"id":"m1b","goal":5,"kind":"one","prompt":"Which conclusion is justified?","options":[{"t":"About 92% of Canadians agree, give or take 1%.","why":"A margin of error applies only to random samples. Volunteers choose themselves; thousands of volunteers are still not a random sample.","_n":"1807f","_k":"b9666f4c"},{"t":"About 92% of Canadian drivers agree.","why":"Only drivers who visit this site and chose to vote were counted.","_n":"1904f","_k":"a665e416"},{"t":"The poll tells us nothing about anyone.","why":"It describes the people who voted; it just can’t be generalized.","_n":"1a05f","_k":"dcb75b5b"},{"t":"The 92% describes people who chose to vote on a driving site, not Canadians.","why":"Volunteers choose themselves; thousands of volunteers are still not a random sample.","_n":"1b02f","_k":"32bbe4e4"}]}],"after":"Thousands of volunteers are still volunteers. A bigger pile of votes from the same site can’t fix who chose to vote."},{"id":"m2","title":"The cliff-edge graph","news":"“Sales soar!”","src":"A store’s bar graph of monthly sales: 960 in May, 990 in June.","graph":true,"steps":[{"id":"m2a","goal":5,"kind":"one","prompt":"Look at the graph. By what percent did sales really grow?","options":[{"t":"About 97%","why":"960 ÷ 990 is a ratio, not a change.","_n":"1c03f","_k":"62ac227f"},{"t":"About 3.1%","why":"30 ÷ 960 ≈ 0.031.","_n":"1d70f","_k":"d380891d"},{"t":"About 300%","why":"That’s how the bars look: 40 above 950 against 10 above 950. Check where the axis starts: a cut-off axis turns a 3% rise into a towering bar.","_n":"1e6ff","_k":"541b4c62"},{"t":"About 30%","why":"30 is the change in sales, not a percent. Divide it by 960.","_n":"1f72f","_k":"55125eb6"}]}],"after":"The vertical axis starts at 950, so June’s bar looks four times as tall as May’s. Drawn from 0, the two bars are almost the same height."},{"id":"m3","title":"The missing details","news":"“4 out of 5 experts recommend Brand Z.”","src":"A made-up ad for a made-up product.","steps":[{"id":"m3a","goal":5,"kind":"multi","prompt":"Which missing facts matter most before you believe it? Choose every one that matters, then press Check.","options":[{"t":"How many experts were asked","_n":"1g71f","_k":"3695540f"},{"t":"How the experts were chosen","_n":"1h74f","_k":"f6402fc5"},{"t":"Who paid for the survey","_n":"1i73f","_k":"e24dd067"},{"t":"The exact question they were asked","_n":"1j76f","_k":"456de4b9"},{"t":"The colour of the packaging","why":"The packaging tells you nothing about the survey.","_n":"1k75f","_k":"1a1495bc"}],"why":"4 of 5 could mean 4 of 5 people the company picked. Who was asked, how many, who paid and the exact question decide what the number means."}],"after":"Who was asked decides what the number means."},{"id":"m4","title":"The survey that asks too much","news":"A class survey to “study study habits” asks for each student’s name, home address, family income, health conditions and hours of homework each week.","src":"A made-up class survey.","steps":[{"id":"m4a","goal":4,"kind":"multi","prompt":"Flag every question that raises a privacy or ethics problem for this study, then press Check.","options":[{"t":"Name","_n":"1l78f","_k":"970338ad"},{"t":"Home address","_n":"1m77f","_k":"93f29397"},{"t":"Family income","_n":"1nfee","_k":"165e9e88"},{"t":"Health conditions","_n":"1offe","_k":"3fe5dd66"},{"t":"Hours of homework each week","why":"That’s the one question the study needs.","_n":"1p00e","_k":"81682a7a"}],"why":"None of the personal questions is needed to study study habits, and each one could identify students or expose private information."},{"id":"m4b","goal":4,"kind":"one","prompt":"Choose the fix.","options":[{"t":"Make it anonymous, ask for informed consent, and ask only the questions the study needs","why":"Anonymous, consent, only the necessary questions.","_n":"1q01e","_k":"b1586815"},{"t":"Promise to delete the answers after a year","why":"It still collects far more than the study needs, without consent.","_n":"1r02e","_k":"39e5e88a"},{"t":"Ask the same questions face to face","why":"Face to face is even less private, so answers may be less honest.","_n":"1s03e","_k":"d5c6bb12"},{"t":"Keep the names so answers can be checked for honesty","why":"Names can make people less honest on sensitive questions. Anonymity reduces response bias and protects privacy.","_n":"1t04e","_k":"561cdcda"}]}],"after":"An ethical survey asks for consent, keeps answers anonymous or confidential, and collects only what it needs."},{"id":"m5","title":"The culturally narrow question","news":"“What gifts does your family exchange at Christmas?”","src":"A question in a made-up survey about holiday spending.","steps":[{"id":"m5a","goal":4,"kind":"one","prompt":"Choose the best fix.","options":[{"t":"“What gifts does your family exchange at Christmas or Hanukkah?”","why":"Still assumes particular traditions; many families celebrate other occasions.","_n":"1u05e","_k":"1e590462"},{"t":"Keep the question: most families can answer it.","why":"It assumes one culture’s customs. That’s cultural bias, and it leaves families out.","_n":"1vf6e","_k":"efbb2f50"},{"t":"“Does your family exchange gifts at any celebration during the year? If so, about how much is spent?”","why":"It works for every family, whatever they celebrate.","_n":"1wf7e","_k":"26878e5f"},{"t":"Ask only families who celebrate Christmas.","why":"That builds sampling bias into the survey: the results would describe only some families.","_n":"1x04e","_k":"f5a2281e"}]}],"after":"A question with cultural bias assumes one culture’s customs. Ask about any celebration instead."}],"quickCheck":{"title":"Media watch quick check","summary":"Media watch quick check","items":[{"id":"q1","goal":5,"prompt":"Sales rose from 960 to 990. The true percent increase is about…","choices":[{"t":"30%","fb":"30 ÷ 960 ≈ 3.1%.","_n":"1y03e","_k":"194e28b4"},{"t":"300%","fb":"30 ÷ 960 ≈ 3.1%. Check where the axis starts: a cut-off axis turns a 3% rise into a towering bar.","_n":"1z02e","_k":"a7042ca2"},{"t":"3%","fb":"Right. 30 ÷ 960 ≈ 3.1%.","_n":"2001e","_k":"76295a0d"},{"t":"99%","fb":"30 ÷ 960 ≈ 3.1%.","_n":"2108e","_k":"353a096a"}]},{"id":"q2","goal":5,"prompt":"An online poll gets 18 000 votes. Is it representative?","choices":[{"t":"Yes: it’s huge","fb":"Size can’t fix self-selection.","_n":"2207e","_k":"6532c136"},{"t":"No: too small","fb":"Size can’t fix self-selection.","_n":"2306e","_k":"4c8f234e"},{"t":"Yes, if the margin is small","fb":"Size can’t fix self-selection.","_n":"2405e","_k":"274efc3a"},{"t":"No: voluntary response","fb":"Right. Volunteers choose themselves; thousands of volunteers are still not a random sample.","_n":"25fce","_k":"5b60150c"}]},{"id":"q3","goal":5,"prompt":"Which fact matters most when judging ‘4 out of 5 experts agree’?","choices":[{"t":"The day it aired","fb":"Who was asked decides what the number means.","_n":"26fbe","_k":"d628b845"},{"t":"The font of the ad","fb":"Who was asked decides what the number means.","_n":"2772e","_k":"9951285b"},{"t":"The product’s price","fb":"Who was asked decides what the number means.","_n":"2873e","_k":"4f3dc31d"},{"t":"How the experts were chosen and how many there were","fb":"Right. Who was asked decides what the number means.","_n":"2970e","_k":"7f9e9b00"}]},{"id":"q4","goal":4,"prompt":"Why make a sensitive survey anonymous?","choices":[{"t":"It makes the sample random","fb":"Anonymity reduces response bias; it doesn’t change who is sampled.","_n":"2a71e","_k":"dc80660e"},{"t":"People answer more honestly and their privacy is protected","fb":"Right. Anonymity reduces response bias; it doesn’t change who is sampled.","_n":"2b76e","_k":"754d82e1"},{"t":"It removes sampling bias","fb":"Anonymity reduces response bias; it doesn’t change who is sampled.","_n":"2c77e","_k":"184743d6"},{"t":"It makes it shorter","fb":"Anonymity reduces response bias; it doesn’t change who is sampled.","_n":"2d74e","_k":"b3de9636"}]}]}},"practice":{"activities":[{"id":"name","type":"sorter","title":"Name the bias","summary":"Name the bias","goal":1,"noun":"situation","txt":true,"instruction":"Sort each situation into the bias it shows.","boxes":[{"id":"samp","label":"Sampling bias","sub":"who is asked"},{"id":"nonr","label":"Non-response bias","sub":"who answers"},{"id":"resp","label":"Response bias","sub":"how honestly"},{"id":"meas","label":"Measurement bias","sub":"how it’s measured"}],"wrongDefault":"Ask where the error enters: who’s asked, who answers, how honestly, or how it’s measured.","items":[{"id":"i1","t":"A survey about public transit is mailed only to car owners.","_a":"Q0sCD0RG","why":"The frame leaves out people who rely on transit."},{"id":"i2","t":"Only 15% of a mailed survey comes back, mostly from retirees.","_a":"Q1YMDEZG","why":"The people who sent it back differ from those who didn’t.","wrong":{"samp":"These people were chosen; the problem is who sent it back. Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement)."}},{"id":"i3","t":"“Don’t you agree that the overpriced cafeteria food should be cheaper?”","_a":"Q1UGA0dG","why":"Leading, loaded wording builds the push into the question.","wrong":{"resp":"The \u003cstrong>question\u003c/strong> builds in the push, so it’s measurement bias. Response bias is about people choosing to answer untruthfully. Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement)."}},{"id":"i4","t":"A bathroom scale used in a fitness study reads 2 kg too heavy.","_a":"Q1UGA0dG","why":"A faulty instrument measures wrongly."},{"id":"i5","t":"Students are asked in front of their teacher whether they’ve ever cheated.","_a":"Q0oGEURG","why":"Pressure leads to untruthful answers."},{"id":"i6","t":"A survey about internet habits is done only by landline phone.","_a":"Q0sCD0RG","why":"The frame leaves out people without a landline."},{"id":"i7","t":"A rating scale offers only “Excellent, Very good, Good, Fair”.","_a":"Q1UGA0dG","why":"A lopsided scale pushes ratings up.","wrong":{"resp":"The scale itself leans positive."}},{"id":"i8","t":"People overstate how often they recycle, to look responsible.","_a":"Q0oGEURG","why":"Wanting to look good leads to untruthful answers."},{"id":"i9","t":"Busy parents rarely answer an evening phone survey about child care.","_a":"Q1YMDEZG","why":"The parents were in the sample, but many didn’t answer.","hints":["Were the parents included in the sample?","Yes, but many didn’t answer.","Non-response."]},{"id":"i10","t":"A city-wide opinion survey is done in one wealthy neighbourhood.","_a":"Q0sCD0RG","why":"The method over-represents one group."}]},{"id":"fix","type":"mc","title":"Fix the survey","summary":"Fix the survey","goal":[4,5],"star":true,"instruction":"Choose the best fix for each survey problem. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Choose an answer, then press Check.","items":[{"id":"f1","goal":4,"prompt":"“Wouldn’t a beautiful new park make our town better?”","options":[{"t":"Ask more people the same question","why":"More people doesn’t fix the wording. Leading wording changes honest answers: the question itself pushes people.","_n":"2e75e","_k":"0e245fbe"},{"t":"“Wouldn’t a new park make our town better?”","why":"‘Wouldn’t … better?’ still suggests yes. Leading wording changes honest answers: the question itself pushes people.","_n":"2f7ae","_k":"81d99515"},{"t":"“Should the town build a lovely new park?”","why":"‘Should the town build a lovely new park?’: still leading.","_n":"2g7be","_k":"06b2f95b"},{"t":"“Do you support or oppose building a new park?”","why":"Neutral wording that names both sides.","_n":"2h78e","_k":"042d9c59"}]},{"id":"f2","goal":4,"prompt":"“Should the town lower taxes and build a new arena?”","options":[{"t":"Ask only property owners","why":"That adds sampling bias and still asks two things at once.","_n":"2i77e","_k":"c3590d64"},{"t":"Keep it, with answers Yes / No","why":"Answering yes or no to both at once hides what people think of each.","_n":"2j7ae","_k":"70d41089"},{"t":"Add the answer ‘Unsure’","why":"Still two questions in one: an answer can’t show which part people mean.","_n":"2k79e","_k":"4be392e4"},{"t":"Split it into two questions","why":"Each question now asks about one thing.","_n":"2l74e","_k":"31b009d1"}]},{"id":"f3","goal":4,"prompt":"\u003cspan class=\"tag\">★\u003c/span> A survey about youth programs samples from the landline list.","options":[{"t":"Ask the questions face to face instead of by phone","why":"That changes how people are asked, not who is in the frame.","_n":"2m73e","_k":"df1d40f4"},{"t":"Call only in the evening, when people are home","why":"Still the landline frame: young residents are still missing.","_n":"2n76e","_k":"7c6766e2"},{"t":"Sample at random from the town’s full resident list","why":"A full frame and random selection reach young residents too.","_n":"2o75e","_k":"08946067"},{"t":"Take a bigger sample from the landline list","why":"A bigger landline sample: the same frame, the same bias. More people from the same biased frame gives the same wrong answer with more confidence.","_n":"2p80e","_k":"8fc026af"}]},{"id":"f4","goal":4,"prompt":"\u003cspan class=\"tag\">★\u003c/span> 20% of mailed surveys are returned.","options":[{"t":"Mail it to twice as many people","why":"Twice as many returns from the same kind of people. More people from the same biased frame gives the same wrong answer with more confidence.","_n":"2q7fe","_k":"1c2c4ed1"},{"t":"Add more questions so it covers everything","why":"Long surveys raise non-response.","_n":"2r9d7","_k":"f5921d7c"},{"t":"Count only the returns","why":"Count only the returns: that keeps the non-response bias.","_n":"2s9c7","_k":"e8a99292"},{"t":"Send reminders, follow up by phone, and keep it short and anonymous","why":"Follow-ups bring back the people who didn’t answer the first time.","_n":"2t9b7","_k":"a341b693"}]},{"id":"f5","goal":[4,5],"prompt":"\u003cspan class=\"tag\">★\u003c/span> “What does your family cook for Christmas dinner?” (a survey on holiday food spending)","options":[{"t":"“What does your family cook for Christmas or Thanksgiving dinner?”","why":"Still assumes particular holidays; many families celebrate others.","_n":"2u9a7","_k":"bffac86a"},{"t":"“Does your household share a special meal for any celebration? About how much is spent?”","why":"It works for every household, whatever they celebrate.","_n":"2v997","_k":"ea8403da"},{"t":"Ask only families who celebrate Christmas","why":"Ask only families who celebrate Christmas: that builds sampling bias into the survey.","_n":"2w987","_k":"2b95ddd1"},{"t":"Make the survey anonymous","why":"Anonymity protects privacy, but the question still assumes one culture’s customs.","_n":"2x977","_k":"1fd5a239"}]},{"id":"f6","goal":4,"prompt":"\u003cspan class=\"tag\">★\u003c/span> A wellness survey asks for names, addresses and health conditions.","options":[{"t":"Survey more people so the answers average out","why":"More people doesn’t fix a privacy or honesty problem.","_n":"2y967","_k":"b6c22585"},{"t":"Make it anonymous, get informed consent, and ask only what the study needs","why":"Anonymous, consent, only the necessary questions.","_n":"2za57","_k":"d96ef8da"},{"t":"Keep the names to check honesty","why":"Keep the names to check honesty: names make sensitive answers less honest, and they risk privacy. Names can make people less honest on sensitive questions. Anonymity reduces response bias and protects privacy.","_n":"30a47","_k":"38c240a1"},{"t":"Ask the questions aloud in a group","why":"Public answers are even less private and less honest.","_n":"31177","_k":"0b164f7b"}],"hints":["What could happen to this information?","It could identify people; would they answer honestly?","Anonymous, consent, only the necessary questions."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Tavish","goal":[1,3],"instruction":"Tavish made one mistake in each piece of reasoning. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"A gaming website’s poll got 25 000 votes: 70% say teens should get more screen time. Is the result reliable?","steps":["The population of interest is Canadian teens.","The respondents are visitors to a gaming site who chose to vote.","With 25 000 votes the margin of error is tiny, so the 70% is reliable.","So most Canadian teens want more screen time."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 describes the sample accurately.","","This follows the earlier slip."],"fixes":[{"t":"25 000 is too few.","why":"More people from the same biased frame gives the same wrong answer with more confidence.","_n":"32187","_k":"6a598c9f"},{"t":"The margin is large, so the result is unreliable.","why":"The margin isn’t the issue; the sample is.","_n":"33197","_k":"0b87c85b"},{"t":"Step 3 is correct.","why":"More people from the same biased frame gives the same wrong answer with more confidence. Volunteers choose themselves; thousands of volunteers are still not a random sample.","_n":"341a7","_k":"f9e18800"},{"t":"The margin of error only describes random samples. This is a voluntary sample of gamers, which is biased however many vote.","why":"Bias isn’t fixed by size.","_n":"35137","_k":"3e637710"}],"hints":["Was the sample random?","No: gamers chose to vote.","Bias isn’t fixed by size."]},{"id":"e2","goal":1,"task":"A survey asks ‘Don’t you think the unsafe old playground should be replaced?’ Classify the bias and fix it.","steps":["The wording suggests the answer ‘yes’.","That makes it sampling bias.","Fix: survey more people."],"_a":"UA==","stepFb":["Step 1 is correct.","","This follows the misclassification."],"fixes":[{"t":"Step 2 is correct.","why":"Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement).","_n":"36147","_k":"4d4846cf"},{"t":"It’s non-response bias; send reminders.","why":"Nobody failed to answer; the wording is the problem. Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement).","_n":"37157","_k":"d38ef913"},{"t":"It’s measurement bias: the question itself pushes answers. Fix the wording: ‘Should the playground be replaced, repaired or left as it is?’","why":"What was asked is the problem, so reword it.","_n":"38167","_k":"60748f2c"},{"t":"It’s response bias; make it anonymous.","why":"People aren’t lying; the wording pushes them.","_n":"391f7","_k":"cd856cb2"}],"hints":["Is the problem who was asked, or what was asked?","What was asked.","Measurement bias: reword it."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the switchboard: that a bigger sample didn’t help, or that three biases nearly cancelled?"},{"id":"j2","q":"In your own words, explain the difference between bias and random sampling error."},{"id":"j3","q":"Explain to a friend how to turn a leading question into a neutral one, with an example from your own life."},{"id":"j4","q":"Find (or imagine) a statistic from an ad or a headline. What would you ask before believing it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A survey about a new bike lane is given only to customers at a car dealership. What type of bias is this?","options":[{"t":"Measurement bias","why":"The question isn’t the problem; the people asked are.","_n":"3a207","_k":"079f67b9"},{"t":"Response bias","why":"Nothing suggests untruthful answers.","_n":"3ba97","_k":"c3ef9a2e"},{"t":"Non-response bias","why":"Nobody failed to respond.","_n":"3ca87","_k":"100c46fa"},{"t":"Sampling bias","why":"The sample leaves out cyclists and many others.","_n":"3dab7","_k":"a909ef94"}]},"b":{"prompt":"Only 10% of a mailed survey comes back, mostly from people angry about the issue. What type of bias is this?","options":[{"t":"Non-response bias","why":"The people who sent it back differ from those who didn’t.","_n":"3eaa7","_k":"9c0e872a"},{"t":"Measurement bias","why":"Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement).","_n":"3fa57","_k":"616c553e"},{"t":"Response bias","why":"The answers may be honest; the missing voices are the issue.","_n":"3ga47","_k":"dd672b52"},{"t":"Sampling bias","why":"The mailing list may be fine; who answered is the problem.","_n":"3ha77","_k":"b83153ae"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"‘Don’t you agree that the unfair new parking fees should be removed?’ This question introduces…","options":[{"t":"sampling bias","why":"Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement).","_n":"3ia67","_k":"342c29c2"},{"t":"non-response bias","why":"Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement).","_n":"3ja17","_k":"cc5d9d9e"},{"t":"measurement bias (leading, loaded wording)","why":"‘Don’t you agree’ leads, and ‘unfair’ loads the question.","_n":"3ka07","_k":"5990720d"},{"t":"no bias, if people answer honestly","why":"Leading wording changes honest answers: the question itself pushes people.","_n":"3la37","_k":"6d30420e"}]},"b":{"prompt":"Students asked in front of their coach whether they skipped practice mostly say no. This is…","options":[{"t":"measurement bias","why":"The question itself is neutral.","_n":"3ma47","_k":"0a9f4a60"},{"t":"response bias","why":"Pressure leads to untruthful answers.","_n":"3na17","_k":"5699c06d"},{"t":"non-response bias","why":"Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement).","_n":"3oa27","_k":"7783d150"},{"t":"sampling bias","why":"Ask \u003cstrong>where\u003c/strong> the error enters: who is asked (sampling), who answers (non-response), how honestly (response), or how the question or tool measures (measurement).","_n":"3pa77","_k":"65cebd36"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which feature makes a survey ethical?","options":[{"t":"Only people who agree with the sponsor are asked","why":"That’s sampling bias, and it isn’t ethical.","_n":"3qa87","_k":"ba924c18"},{"t":"Participants give informed consent and their answers are kept confidential","why":"Consent and privacy are the heart of an ethical survey.","_n":"3ra57","_k":"76c5560d"},{"t":"Participants must give their full names","why":"Names can make people less honest on sensitive questions. Anonymity reduces response bias and protects privacy.","_n":"3sa67","_k":"8c2e06f8"},{"t":"The survey is as long as possible","why":"Long surveys raise non-response.","_n":"3t9b7","_k":"3a08650f"}]},"b":{"prompt":"Which question shows cultural bias?","options":[{"t":"“Do you have a library card?”","why":"Everyone can answer this, whatever their culture.","_n":"3u9c7","_k":"73ba442b"},{"t":"“How many hours of sleep did you get last night?”","why":"Everyone can answer this, whatever their culture.","_n":"3va56","_k":"bae63fb1"},{"t":"“How do you usually travel to school?”","why":"Everyone can answer this, whatever their culture.","_n":"3wa46","_k":"5f750885"},{"t":"“What gifts did your family exchange at Christmas?”","why":"It assumes one tradition.","_n":"3xa36","_k":"47520b62"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Model town: youth 100 (80% support), adults 200 (45%), seniors 100 (30%). A landline frame reaches 10% of youth, 50% of adults and 90% of seniors. What is the expected estimate?","options":[{"t":"51.7%","why":"That averages the three rates without weighting.","_n":"3ya26","_k":"fa61cf21"},{"t":"50%","why":"That ignores the frame.","_n":"3za96","_k":"70ec0659"},{"t":"40%","why":"(8 + 45 + 27) ÷ 200.","_n":"40a86","_k":"4042b2f8"},{"t":"36.9%","why":"That adds non-response too.","_n":"41a76","_k":"bece6711"}]},"b":{"prompt":"Same town, full frame, but response rates of 20% (youth), 50% (adults) and 80% (seniors). What is the expected estimate?","options":[{"t":"36.9%","why":"That adds the landline frame.","_n":"42a66","_k":"593660bb"},{"t":"51.7%","why":"Weight by the number of responders.","_n":"439d6","_k":"097868a0"},{"t":"50%","why":"That ignores who responds.","_n":"449c6","_k":"61cf6a88"},{"t":"42.5%","why":"(16 + 45 + 24) ÷ 200.","_n":"459f6","_k":"1bfd3583"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"A poll’s sample grows from 500 to 5000 people, drawn from the same biased frame. What happens?","options":[{"t":"Both the bias and the margin shrink","why":"Only the margin shrinks. More people from the same biased frame gives the same wrong answer with more confidence.","_n":"46a06","_k":"4bd94c69"},{"t":"Both grow","why":"Bigger samples don’t add bias.","_n":"47a16","_k":"9c551dbd"},{"t":"The random margin of error shrinks, but the bias stays the same","why":"Size shrinks random error only.","_n":"48a26","_k":"b9228d16"},{"t":"The bias disappears","why":"More people from the same biased frame gives the same wrong answer with more confidence.","_n":"49a36","_k":"0a9e5ffd"}]},"b":{"prompt":"Two biases push a survey’s result in opposite directions, and it lands near the true value. What is the best conclusion?","options":[{"t":"The survey is unbiased","why":"Biases can cancel by luck. Judge the design, not one lucky result.","_n":"4aa46","_k":"e5f2c8a6"},{"t":"The design is still biased; the result was close by luck and could be far off elsewhere","why":"Biases can cancel by luck. Judge the design, not one lucky result.","_n":"4ba56","_k":"56f1e7cf"},{"t":"The true value must be different from what was thought","why":"The truth doesn’t change.","_n":"4ca66","_k":"6392032a"},{"t":"Biases always cancel","why":"Biases can cancel by luck. Judge the design, not one lucky result.","_n":"4d976","_k":"f73f6584"}]}},{"id":"t3","cat":"T","goal":[3,4],"a":{"prompt":"A council surveys residents about a youth skate park using the landline list and the question ‘Don’t you agree teens need a safe place to skate?’ Which two changes would most reduce bias?","options":[{"t":"Keep the landline list and add a second question","why":"The frame and the wording stay biased.","_n":"4e986","_k":"84fdfc46"},{"t":"Sample at random from the full resident list, and use neutral wording","why":"That fixes both the frame and the wording.","_n":"4f117","_k":"8bd7c624"},{"t":"Ask only youth and seniors","why":"That creates a new sampling bias.","_n":"4g107","_k":"d170553b"},{"t":"Double the sample size and keep the wording","why":"More people from the same biased frame gives the same wrong answer with more confidence.","_n":"4h137","_k":"fb2109f7"}]},"b":{"prompt":"A hockey website polls visitors: ‘Isn’t hockey Canada’s greatest sport?’ Which two changes would most reduce bias?","options":[{"t":"Get more votes on the website","why":"Volunteers choose themselves; thousands of volunteers are still not a random sample. More people from the same biased frame gives the same wrong answer with more confidence.","_n":"4i127","_k":"3d3f2e7b"},{"t":"Draw a random sample from a general population list, and ask a neutral question","why":"That fixes both who is asked and what is asked.","_n":"4j157","_k":"5a9f8b3c"},{"t":"Ask the same question to hockey coaches","why":"Another biased frame.","_n":"4k147","_k":"d16aaeeb"},{"t":"Keep the website poll but make it anonymous","why":"Anonymity doesn’t fix who chooses to vote or the wording.","_n":"4l177","_k":"6cf28c1f"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best rewrite of ‘Don’t you agree that the library’s hours are too short?’","options":[{"t":"“The library’s hours are too short, right?”","why":"Still leading. Leading wording changes honest answers: the question itself pushes people.","_n":"4m167","_k":"91f3175b"},{"t":"“Should the library stay open longer and buy more books?”","why":"Two questions in one.","_n":"4n197","_k":"8878a417"},{"t":"“Do you agree the library’s poor hours should be extended?”","why":"Loaded: ‘poor’.","_n":"4o187","_k":"b459691b"},{"t":"“Are the library’s current hours too short, about right, or too long?”","why":"Neutral, with answers on every side.","_n":"4p2b6","_k":"786e085f"}]},"b":{"prompt":"Which is the best rewrite of ‘How much do you love our new menu?’","options":[{"t":"“Rate the menu: excellent, very good or good.”","why":"No negative options.","_n":"4q2c6","_k":"1a18fb60"},{"t":"“Do you love or really like the new menu?”","why":"Both choices are positive. Leading wording changes honest answers: the question itself pushes people.","_n":"4r296","_k":"53da4be9"},{"t":"“How would you rate the new menu: very poor, poor, fair, good or very good?”","why":"A balanced scale with negative and positive answers.","_n":"4s2a6","_k":"928e7773"},{"t":"“How great is the new menu?”","why":"Still leading.","_n":"4t276","_k":"a2124a01"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"A headline says ‘9 in 10 readers support the ban!’ based on an online poll on the newspaper’s website. Which is the best critique?","options":[{"t":"“Online polls are accurate when they’re large.”","why":"More people from the same biased frame gives the same wrong answer with more confidence.","_n":"4u286","_k":"4018c193"},{"t":"“Readers chose whether to respond, and one site’s readers aren’t the whole population, so the 90% can’t be generalized.”","why":"Volunteers choose themselves; thousands of volunteers are still not a random sample.","_n":"4v256","_k":"278efcb6"},{"t":"“9 in 10 is too high to be true.”","why":"High results can be real; the method is the issue.","_n":"4w266","_k":"ca219b8f"},{"t":"“The poll needed a margin of error of ±1%.”","why":"No margin applies to a voluntary poll.","_n":"4x236","_k":"0e684db1"}]},"b":{"prompt":"A bar graph’s vertical axis starts at 950, so sales of 990 look four times as large as sales of 960. Which is the best critique?","options":[{"t":"“The numbers must be wrong.”","why":"The numbers are fine; the drawing distorts them.","_n":"4y246","_k":"b90037b3"},{"t":"“The axis doesn’t start at 0, so the bars exaggerate what is really about a 3% increase.”","why":"Check where the axis starts: a cut-off axis turns a 3% rise into a towering bar.","_n":"4z2d6","_k":"f542cd23"},{"t":"“The graph should be a pie chart.”","why":"The chart type isn’t the problem.","_n":"502c6","_k":"2e960406"},{"t":"“Sales really did quadruple.”","why":"990 is only 30 more than 960.","_n":"512b6","_k":"4486479a"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"A school wants to know how many students skip breakfast. Which plan reduces response bias the most?","options":[{"t":"An anonymous form completed by a random sample of students during class","why":"Anonymous answers are more honest, and the sample is random.","_n":"522a6","_k":"647ca999"},{"t":"Ask parents at a school event","why":"Parents may not know, and few attend.","_n":"53296","_k":"e6a4d947"},{"t":"Teachers ask students aloud in class","why":"Public answers invite untruthful ones. Names can make people less honest on sensitive questions. Anonymity reduces response bias and protects privacy.","_n":"54286","_k":"556d7b4d"},{"t":"Ask students in the cafeteria line at lunch","why":"A convenience sample: sampling bias.","_n":"55276","_k":"5447d54f"}]},"b":{"prompt":"A school wants to know how many students have tried vaping. Which plan reduces response bias the most?","options":[{"t":"An anonymous survey of a random sample, with results reported only as totals","why":"No one can be identified, so answers are more honest.","_n":"56266","_k":"1986a13e"},{"t":"Interviews in the principal’s office","why":"Fear leads to untruthful answers. Names can make people less honest on sensitive questions. Anonymity reduces response bias and protects privacy.","_n":"57256","_k":"c39ff907"},{"t":"Ask the student council","why":"A convenience sample, and not anonymous.","_n":"58246","_k":"a92e672d"},{"t":"Ask students to raise their hands","why":"No privacy.","_n":"59275","_k":"c990f40e"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A news story says ‘Crime up 50%!’ Incidents in a small town rose from 4 to 6. What is the most important missing context?","options":[{"t":"The counts are tiny: a change of 2 incidents looks like a big percent. The rate per resident and the long-term trend matter more","why":"A 50% rise of tiny counts can be chance.","_n":"5a285","_k":"7aa128ae"},{"t":"It’s really a 2% increase","why":"2 is the change in incidents, not a percent.","_n":"5b295","_k":"84178fcb"},{"t":"The 50% is calculated wrong","why":"(6 − 4) ÷ 4 = 50% is correct.","_n":"5c2a5","_k":"cb6f19f2"},{"t":"The story should have used a pie chart","why":"The chart isn’t the problem.","_n":"5d235","_k":"bdd8af57"}]},"b":{"prompt":"An ad says ‘Sales tripled!’ Sales went from 2 units to 6 units. What is the most important missing context?","options":[{"t":"Tripled is calculated wrong","why":"6 is 3 times 2.","_n":"5e245","_k":"98b27011"},{"t":"Sales went up 300%","why":"Tripling is a 200% increase, and either way the counts are tiny.","_n":"5f255","_k":"5ddf2563"},{"t":"With such small numbers, ‘tripled’ is only 4 more sales, so the claim sounds bigger than it is","why":"Tiny counts make big-sounding ratios.","_n":"5g265","_k":"d5a940b6"},{"t":"The ad should give the sales in dollars","why":"Possibly useful, but the tiny counts are the key issue.","_n":"5h1f5","_k":"d076fcab"}]}}]},"task":{"title":"Fair survey","summary":"Fair survey","statement":"\u003cp>Design the town’s skate park survey so that it avoids every source of bias you’ve studied. Can you find all the answers? \u003cspan class=\"mdm-model\">model data\u003c/span>\u003c/p>\u003col class=\"bs-conds\">\u003cli>The frame covers the whole population.\u003c/li>\u003cli>People are chosen at random.\u003c/li>\u003cli>Non-response is reduced.\u003c/li>\u003cli>The question is neutral and asks about one thing.\u003c/li>\u003cli>Respondents’ privacy is protected.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">The gauge shows your design’s expected estimate in the module’s model town (true support 50%).\u003c/p>","checks":["Covers everyone","Random selection","Non-response reduced","Neutral, single-issue question","Privacy protected"],"tips":["Landline, shop and online frames leave people out or let them choose themselves.","‘Whoever answers first’ is convenience.","Without follow-ups, busy residents drop out.","L leads, Lo is loaded, and D asks two things at once.","Publishing names discourages honest answers."],"explainPrompt":"For each choice you made, name the bias it prevents and explain how.","vocab":"Use the words sampling bias, non-response bias, response bias and measurement bias.","more":"There’s more than one answer. Can you find them all?","after3":"Every one of these gives an expected estimate of 50.0%, matching the truth by design, not by luck.","afterAt":4},"cards":[["Bias","A systematic error that pushes results one way."],["Sampling bias","The frame or method leaves out or over-represents groups."],["Non-response bias","People who don’t respond differ from those who do."],["Response bias","People answer untruthfully (pressure, embarrassment, wanting to please)."],["Measurement bias","The question or tool itself pushes the answers: leading or loaded wording, a faulty scale."],["Leading question","Wording that suggests the “right” answer: “Don’t you agree…?”"],["Double-barrelled question","Two questions in one: split it."],["Bias vs sample size","A bigger sample shrinks random error, not bias."],["Cancelling biases","Close by luck isn’t the same as a good design."],["E
