.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}

   Risk vs return stations, number entry with choices, prize-wheel task. Tokens only. */
/* radioGroup (from MDM4U 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 18) */
.vd-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.vd-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.vd-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.vd-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.vd-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}

/* Spread meter */
.vd-mode{margin-bottom:4px}
.vd-cap{font-size:clamp(1.15rem,2.6vw,1.5rem)}
canvas.plot.vd-plot{aspect-ratio:16/10}
canvas.plot.vd-plot.vd-two{aspect-ratio:4/3}
.vd-aha{margin:12px 0 0;font-size:.95rem}
.vd-msg{min-height:1.2em;margin:6px 0 0}
.vd-warn{font-weight:700;color:var(--ink)}
.vd-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}
.vd-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet);min-width:0}
.vd-sh{margin:0 0 6px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.vd-ab{gap:10px 14px}
.vd-sh .m{text-transform:none;font-size:1.15em;letter-spacing:0}
.vd-locknote{margin:0 0 8px}
.vd-tw{margin:4px 0 8px}
table.vt.vd-bt td,table.vt.vd-bt th{padding:5px 8px}
table.vt.vd-bt .numin{width:4.6rem;padding:.3em .45em;font-size:1rem}
table.vt.vd-bt .numin.vd-x{width:4rem}
table.vt.vd-bt .numin.vd-vin{width:5.2rem}
.vd-sum th,.vd-sum td{background:var(--paper)}
.vd-vcell label{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.vd-line{margin:6px 0}
.vd-line label{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.numin.vd-vin{width:6.5rem}
.vd-ed{display:grid;gap:6px}
.vd-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.vd-row label{display:inline-flex;align-items:center;gap:5px}
.vd-row .numin{width:4.8rem;padding:.3em .45em;font-size:1rem}
.vd-row .numin.vd-x{width:4.2rem}
.vd-stp{display:inline-flex;gap:4px}
.vd-stp .btn{min-width:34px;padding-left:.5em;padding-right:.5em}
.vd-ra{margin-top:6px}
.vd-sl{margin-bottom:10px}
.vd-sl input[type=range]{width:100%;accent-color:var(--ink)}
.vd-sl output{color:var(--ink)}
.vd-conds{margin:6px 0 0;padding-left:1.3em}
.vd-conds li{margin:2px 0}

/* Risk vs return */
.rv-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.rv-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.rv-text{margin:0 0 10px}
canvas.plot.rv-plot3{aspect-ratio:16/11;max-width:640px}
.rv-rank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.rv-off{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:.4em .8em;min-height:40px;text-align:left;font:inherit}
.rv-off.on{border-color:var(--ink);background:var(--hi-soft)}
.rv-off:disabled{cursor:default}
.rv-rn{display:inline-flex;align-items:center;justify-content:center;width:1.6em;height:1.6em;border-radius:50%;border:1.5px dashed var(--ink-2);font-weight:700}
.rv-off.on .rv-rn{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.rv-order{min-height:1.2em;margin:4px 0}
.rv-prof{border-top:1px solid var(--rule);padding:10px 0 4px}
.rv-who{margin:0 0 6px;font-weight:700}
.rv-after{margin:10px 0 0}
.rv-read{margin-top:8px}
.rv-tick{font-weight:700}

/* number entry with choices */
.ne-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:8px}
.ne-lab{display:inline-flex;align-items:center;gap:8px}
.ne-lab .numin{width:7rem}
.ne-ch{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ne-l{font-weight:700}
.ne-chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.ne-c{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:36px}
.ne-c[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ne-c:disabled{opacity:.7;cursor:default}

/* prize-wheel task */
.pw-in{margin:10px 0}
.pw-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:8px 0}
.pw-l{min-width:4.2em;font-weight:700}
.pw-st{display:inline-flex;align-items:center;gap:6px}
.pw-pl{margin-right:2px}
.pw-v{min-width:2.6em;text-align:center;font:700 1.1rem var(--font-math)}
canvas.plot.pw-plot{aspect-ratio:4/3}
.pw-read{margin-top:8px}

@media (max-width:560px){
  canvas.plot.vd-plot{aspect-ratio:4/3}
  canvas.plot.vd-plot.vd-two{aspect-ratio:1/1}
  canvas.plot.rv-plot3{aspect-ratio:4/5}
  .vd-ab{grid-template-columns:minmax(0,1fr)}
}
.vd-nw{white-space:nowrap;display:inline-block}

 2.83.","shape":"wide"}},"goals":["I can calculate `Var(X)` and `σ` for a discrete distribution.","I can interpret `σ` as a typical distance from the mean and compare spreads of distributions with the same mean.","I can use the shortcut `Var(X) = E(X^2) - μ^2`.","I can compare distributions using tables, histograms, `μ` and `σ`.","I can use `μ` and `σ` together to compare risk in decisions.","I can predict `μ` and `σ` after a change `Y = aX + b`."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Expected value","goal":1,"prompt":"`X` = 0, 2, 4 with `P` = 0.25, 0.5, 0.25. Find `μ = E(X)`.","options":[{"t":"0.5","why":"0.5 is a probability, not the mean. Find `Σ x P(x)`.","_n":"013a","_k":"1e2d1d3e"},{"t":"1","why":"Add all three products.","_n":"112a","_k":"88b36f82"},{"t":"2","why":"0 + 1 + 1.","_n":"211a","_k":"5664379d"},{"t":"6","why":"That adds the values. Multiply each value by its probability, then add.","_n":"310a","_k":"1d2f2d8e"}],"hints":["`Σ x P(x)`.","0(0.25) + 2(0.5) + 4(0.25).","2."]},{"id":"w2","skill":"Expected value","goal":3,"prompt":"`X` = 1, 3 with `P` = 0.5, 0.5. Find `E(X^2)`.","options":[{"t":"2","why":"That’s `E(X)`. Square each value first.","_n":"40fa","_k":"0d5bb0b4"},{"t":"4","why":"That’s `(E(X))^2 = 2^2`. `E(X^2)` squares each value first.","_n":"50ea","_k":"0602fd02"},{"t":"5","why":"`1^2(0.5) + 3^2(0.5) = 0.5 + 4.5`.","_n":"60da","_k":"8da52b57"},{"t":"10","why":"That adds the squares without their probabilities.","_n":"70ca","_k":"9a51a56e"}],"hints":["Square each value.","1 and 9, each with `P = 0.5`.","5."]},{"id":"w3","skill":"Squares and roots","goal":1,"prompt":"`√2.25` = ?","options":[{"t":"0.15","why":"`0.15^2 = 0.0225`.","_n":"80ba","_k":"2f62c71c"},{"t":"1.125","why":"That halves 2.25. Find the number whose square is 2.25.","_n":"9dce","_k":"d2e24194"},{"t":"1.5","why":"1.5 × 1.5 = 2.25.","_n":"adde","_k":"dfbf6e08"},{"t":"5.0625","why":"That squares 2.25 instead of taking its square root.","_n":"bdae","_k":"eba9ea39"}],"hints":["Which number squared is 2.25?","Think `15^2 = 225`.","1.5."]},{"id":"w4","skill":"Squares and roots","goal":1,"prompt":"`(-3)^2 × 0.25` = ?","options":[{"t":"−2.25","why":"A square is never negative.","_n":"cdbe","_k":"af4d1097"},{"t":"−0.75","why":"That skips the square. Square −3 first.","_n":"de0e","_k":"0b93f041"},{"t":"0.75","why":"That uses 3, not `(-3)^2 = 9`.","_n":"ee1e","_k":"45170d7d"},{"t":"2.25","why":"9 × 0.25.","_n":"fdee","_k":"5f4f32f6"}],"hints":["Square first.","`(-3)^2 = 9`.","9 × 0.25 = 2.25."]},{"id":"w5","skill":"Distance from the mean","goal":2,"prompt":"A distribution has mean 5. How far is the value 2 from the mean, and what is its squared deviation?","options":[{"t":"3; 9","why":"2 − 5 = −3, and `(-3)^2 = 9`.","_n":"gdfe","_k":"181a5704"},{"t":"7; 49","why":"That adds 2 and 5. The deviation is `x - μ`.","_n":"hd4e","_k":"07e8b39e"},{"t":"3; 6","why":"That doubles 3 instead of squaring it.","_n":"id5e","_k":"5f776aa6"},{"t":"−3; −9","why":"Squares aren’t negative.","_n":"jd6e","_k":"205570ce"}],"hints":["`x - μ`.","−3.","Squared: 9."]},{"id":"w6","skill":"Changing every value","goal":6,"prompt":"Every mark on a test is raised by 5. What happens to the class mean and to the range?","options":[{"t":"The mean rises by 5; the range stays the same","why":"Every mark moves together.","_n":"kd5e","_k":"df67559b"},{"t":"The mean stays; the range rises","why":"That’s reversed: the centre moves and the gap stays.","_n":"ld4e","_k":"0797d522"},{"t":"Both rise by 5","why":"The highest and lowest both rise by 5, so their gap doesn’t change.","_n":"md3e","_k":"796a1590"},{"t":"Neither changes","why":"The centre moves.","_n":"nd2e","_k":"7bb244fe"}],"hints":["Think of the highest and lowest marks.","Both rise by 5.","The gap is unchanged."]}],"refreshers":{"Expected value":"`μ = Σ x P(x)`.","Squares and roots":"Squares are never negative; √ undoes squaring. Use these values: `√2 ≈ 1.41`, `√0.5 ≈ 0.71`, `√8 ≈ 2.83`, `√{35/12} ≈ 1.71`.","Distance from the mean":"Deviation = `x - μ`; squared deviation is always ≥ 0.","Changing every value":"Adding a constant moves the centre but not the spread; multiplying stretches both."}}},"explore":{"heading":"Spread m&#101;ter","intro":"Build `σ` term by term, then compare two distributions with the same mean.","predIntro":"Make a prediction first. Then the spread m&#101;ter will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"compare","a":"tight","b":"wide"},"prompt":"Compare: Tight (4, 5, 6) vs Wide (1, 5, 9), both with probabilities 0.25, 0.5, 0.25. Which has the larger `σ`, and by how much?","options":[{"t":"They’re equal, because both means are 5","_n":"od1e","_k":"7d6fb2c8"},{"t":"Wide, 4 times as large","_n":"pd0e","_k":"4e9b3d6d"},{"t":"Wide, 3 times as large","_n":"qcfe","_k":"f19b5edc"},{"t":"Tight","_n":"rdee","_k":"eec8a405"}],"explain":"The brackets grow to ±0.71 and ±2.83. Every deviation is 4 times as far, so `σ` is 4 times as large."},{"id":"p2","start":{"mode":"transform","x":"die","a":1,"b":0,"to":{"b":10}},"prompt":"Transform, the die with `b = 10`: `Y = X + 10`. What happens to `σ`?","options":[{"t":"It becomes 17.1","_n":"sdde","_k":"3f729745"},{"t":"It becomes 11.71","_n":"t50e","_k":"e539dcc1"},{"t":"It stays 1.71","_n":"u51e","_k":"a45cdbca"},{"t":"It becomes 0","_n":"v52e","_k":"29ab4ac5"}],"explain":"The histogram slides right, and the brackets keep their width. Shifting every value by 10 moves the centre, not the spread."},{"id":"p3","start":{"mode":"transform","x":"die","a":1,"b":0,"to":{"a":3}},"prompt":"Transform, the die with `a = 3`: `Y = 3X`. `σ` becomes…","options":[{"t":"1.71","_n":"w53e","_k":"97a41319"},{"t":"1.71 + 3","_n":"x4ce","_k":"622f7b91"},{"t":"9 × 1.71","_n":"y4de","_k":"839245c3"},{"t":"3 × 1.71 ≈ 5.12","_n":"z4ee","_k":"5bc4a50a"}],"explain":"The bars spread to 3, 6, …, 18. Distances triple, so `σ` triples; the variance is multiplied by 9."},{"id":"p4","start":{"mode":"build","rows":[{"x":"3","p":"1"}]},"prompt":"Build mode: `P(X = 3) = 1`. `σ` = ?","options":[{"t":"3","_n":"104fe","_k":"bf7a920d"},{"t":"It’s undefined","_n":"1158e","_k":"41a15ecd"},{"t":"1","_n":"1259e","_k":"cb790bf3"},{"t":"0","_n":"134ae","_k":"bffc5206"}],"explain":"One bar, with no bracket. No spread at all."}],"chalIntro":"Use the spread m&#101;ter to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Build mode: complete the table for `X` = 0, 2, 4 with `P` = 0.25, 0.5, 0.25 and enter `Var(X)` and `σ`. \u003cspan class=\"tiny muted\">(Choose Custom, type the table, show every column with Next column, then fill in the Σ row.)\u003c/span>","why":"Deviations −2, 0, 2; weighted squares 4(0.25) + 0 + 4(0.25) = 2, so `Var(X) = 2` and `σ = √2 ≈ 1.41`.","hints":["Deviations: −2, 0, 2.","Weighted squares: 4(0.25) + 0 + 4(0.25).","`Var = 2`, `σ = √2 ≈ 1.41`."]},{"id":"tc2","goal":2,"prompt":"Compare mode: A is Tight (4, 5, 6; `σ = √0.5`). Edit B so that it has the \u003cstrong>same mean\u003c/strong> (5) and \u003cstrong>exactly twice\u003c/strong> A’s standard deviation.","why":"`σ_B = √2 = 2σ_A`: twice the spread needs four times the variance, 4 × 0.5 = 2.","hints":["Twice `σ` means four times the variance: 4 × 0.5 = 2.","Keep the same shape and spread the values out from 5.","3, 5, 7 with 0.25, 0.5, 0.25: `Var` = 4(0.25) × 2 = 2."]},{"id":"tc3","goal":6,"stretch":true,"prompt":"Transform mode: `X` has `μ = 4` and `σ = 3`. Set `a > 0` and `b` so that `Y = aX + b` has `μ_Y = 50` and `σ_Y = 6`. \u003cspan class=\"tiny muted\">(The preset 1 or 7 has `μ = 4` and `σ = 3`.)\u003c/span>","why":"`σ_Y = aσ`, so `a` = 6 ÷ 3 = 2; `μ_Y = 2(4) + b = 50`, so `b = 42`.","hints":["Only `a` changes `σ`.","6 = `a` × 3.","`a = 2`; 50 = 2(4) + `b`, so `b = 42`."]}]},"part3":{"slug":"risk","name":"Risk","heading":"Risk vs return","intro":"Three offers have the same expected value. Here `σ` turns into a decision about risk: rank the offers, match them to people, then check them with data.","stations":[{"id":"s1","title":"Three summer offers","text":"Three summer offers each pay once a week (model numbers). All three have `μ` = $100. Tap the offers in order, from the smallest `σ` to the largest, then check your ranking.","offers":[{"id":"A","t":"$100 guaranteed","vals":[100],"ps":[1]},{"id":"B","t":"$0 or $200, equally likely","vals":[0,200],"ps":[0.5,0.5]},{"id":"C","t":"$50 or $150, equally likely","vals":[50,150],"ps":[0.5,0.5]}],"right":"A ($0), C ($50), B ($100). All three average $100, but B’s outcomes land $100 from the mean, C’s land $50 away, and A never moves.","notFirst":"A never varies: every week pays $100, so `σ` = $0. It belongs first.","swap":"B’s outcomes land $100 from the mean; C’s land only $50 away. Which spreads out more?"},{"id":"s2","title":"Who should choose what?","text":"Match each person to an offer. Think about `σ` and about the smallest amount each offer can pay.","profiles":[{"id":"p1","t":"Needs at least $50 for a bill","ok":["A","C"],"fb":{"A":"A pays $100 every week (`σ` = $0), so the bill is always covered.","B":"B could pay $0: with `σ` = $100, a $0 week is half the outcomes.","C":"C never pays less than $50 (`σ` = $50), so the bill is covered."}},{"id":"p2","t":"Can absorb a loss and enjoys a chance at $200","ok":["B"],"fb":{"A":"A never pays more than $100. Only B offers a chance at $200.","B":"Only B can pay $200; its large `σ` ($100) is the risk this person can accept.","C":"C tops out at $150. Only B offers a chance at $200."}},{"id":"p3","t":"Wants the safest option","ok":["A"],"fb":{"A":"`σ` = $0: the pay never changes.","B":"B is the riskiest offer (`σ` = $100).","C":"C still varies (`σ` = $50). One offer never varies at all."}}],"done":"Equal expected values, different choices: each person weighs `σ` and the minimum outcome."},{"id":"s3","title":"Check it with data","text":"1000 simulated weeks of each offer (seeded, so the same weeks every time). Dots are weekly results; the dark line is the running average.","after":"The weekly averages all settle near $100, but the spread of the weekly results differs: A’s dots never move, C’s sit $50 away, and B’s sit $100 away."}],"quickCheck":{"title":"Quick check","summary":"Risk vs return quick check","items":[{"id":"q1","goal":2,"prompt":"Same mean, larger `σ` means…","choices":[{"t":"a lower minimum always","fb":"`σ` measures spread, not centre.","_n":"1449e","_k":"00bff406"},{"t":"more variability (risk)","fb":"Right. `σ` measures how far results land from the mean.","_n":"154ce","_k":"bb78ec42"},{"t":"fewer possible values","fb":"`σ` measures spread, not centre.","_n":"164be","_k":"640ed6e3"},{"t":"a higher expected payout","fb":"`σ` measures spread, not centre.","_n":"174ee","_k":"250bd3e9"}]},{"id":"q2","goal":1,"prompt":"`σ` of a guaranteed $100?","choices":[{"t":"$0","fb":"Right. Every outcome is the mean, so every deviation is 0.","_n":"184de","_k":"7e3ec110"},{"t":"$10","fb":"Every outcome is the mean.","_n":"1950e","_k":"c6014bed"},{"t":"$50","fb":"Every outcome is the mean.","_n":"1a4fe","_k":"4581c4d0"},{"t":"$100","fb":"Every outcome is the mean.","_n":"1b52e","_k":"4c960a78"}]},{"id":"q3","goal":1,"prompt":"Offer B: $0 or $200, equally likely. `σ`?","choices":[{"t":"$0","fb":"Both outcomes are $100 from the mean.","_n":"1c51e","_k":"359f62ba"},{"t":"$50","fb":"Both outcomes are $100 from the mean.","_n":"1d64e","_k":"8a44941d"},{"t":"$100","fb":"Right. Both outcomes are $100 from the mean.","_n":"1e65e","_k":"4e94314e"},{"t":"$200","fb":"Both outcomes are $100 from the mean.","_n":"1f62e","_k":"2a577d01"}]},{"id":"q4","goal":5,"prompt":"Someone who must have at least $50 would prefer…","choices":[{"t":"B","fb":"B can pay $0.","_n":"1g63e","_k":"dfb1e33d"},{"t":"none of them","fb":"B can pay $0.","_n":"1h60e","_k":"c2c3ad6d"},{"t":"any of them","fb":"B can pay $0.","_n":"1i61e","_k":"0f4ec2d9"},{"t":"A or C","fb":"Right. A always pays $100 and C never pays less than $50.","_n":"1j5ee","_k":"b97a1fe4"}]}]}},"practice":{"activities":[{"id":"find","type":"custom","title":"Find σ","summary":"Find σ","goal":[1,3,6],"instruction":"Find each standard deviation. Round to 2 decimals where an answer doesn’t end.","how":"Type a number such as 1.71 or a fraction such as 35/12, then press Check.","use":"`√2 ≈ 1.41`, `√0.5 ≈ 0.71`, `√{35/12} ≈ 1.71`","items":[{"id":"v1","goal":1,"prompt":"`X` = 2, 6, each with `P` = 0.5: `σ`?","label":"`σ` =","_a":"AQ==","display":"`σ = 2`","why":"`μ = 4`; `Var(X)` = 4(0.5) + 4(0.5) = 4, so `σ = √4 = 2`.","wrong":[{"match":4,"fb":"That’s the variance; `σ = √{Var(X)}`."}]},{"id":"v2","goal":1,"prompt":"`X` = 0 (`P` = 0.9) or 10 (`P` = 0.1): `σ`?","label":"`σ` =","_a":"AA==","display":"`σ = 3`","why":"`μ = 1`; `Var(X)` = 1(0.9) + 81(0.1) = 9, so `σ = 3`.","wrong":[{"match":9,"fb":"That’s the variance; `σ = √{Var(X)}`."},{"match":5,"fb":"Weight: 1(0.9) + 81(0.1) = 9."}],"hints":["`μ = 0(0.9) + 10(0.1) = 1`.","Squared deviations: 1 and 81.","1(0.9) + 81(0.1) = 9, so `σ = 3`."]},{"id":"v3","goal":1,"prompt":"A fair die: `Var(X)` and `σ` (2 decimals).","parts":["`Var(X)` =","`σ` ="],"_a":"aAAdCgQGAQ8FBAUFAwYBDwUEBh8EHgAJBAoBBgQCAA8GCwoABm0=","display":"`Var(X) = 35/12 ≈ 2.92`; `σ ≈ 1.71`","why":"`E(X^2) = 91/6`, `μ = 3.5`: `Var(X) = 91/6 - 3.5^2 = 35/12 ≈ 2.92`, and `σ = √{35/12} ≈ 1.71`.","wrong":[{"part":0,"match":15.166666666666666,"fb":"That’s `E(X^2) = 91/6`. Subtract the square of the mean: `91/6 - 3.5^2`."}]},{"id":"v4","goal":3,"prompt":"`X` = 0, 1, 2, 3 with `P` = 0.4, 0.3, 0.2, 0.1: `σ`?","label":"`σ` =","_a":"Ag==","display":"`σ = 1`","why":"`μ = 1`; `E(X^2) = 0.3 + 0.8 + 0.9 = 2`; `Var(X) = 2 - 1 = 1`, so `σ = 1`.","wrong":[{"match":1.4142135623730951,"fb":"`E(X^2) = 2`, `μ^2 = 1`, so `Var = 1`."}]},{"id":"v5","goal":3,"prompt":"`E(X) = 3` and `E(X^2) = 13`: `σ`?","label":"`σ` =","_a":"AQ==","display":"`σ = 2`","why":"`Var(X) = 13 - 3^2 = 4`, so `σ = 2`.","wrong":[{"match":3.605551275463989,"fb":"`√13` forgets to subtract 9."}]},{"id":"v6","goal":6,"prompt":"`X` has `μ = 4` and `σ = 1.5`. `Y = 2X - 3`: `μ_Y` and `σ_Y`?","parts":["`μ_Y` =","`σ_Y` ="],"_a":"aAcfAGg=","display":"`μ_Y = 5`; `σ_Y = 3`","why":"`μ_Y = 2(4) - 3 = 5`; `σ_Y = 2 × 1.5 = 3`: the −3 shifts but doesn’t spread.","wrong":[{"part":1,"match":0,"fb":"Subtracting 3 doesn’t cancel the spread."}]}]},{"id":"compare","type":"custom","title":"Compare and transform","summary":"Compare and transform","goal":[2,4,5,6],"star":true,"instruction":"Compare spreads and predict the effect of a change. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type each number (2 decimals where an answer doesn’t end) and tap a choice where there is one, then press Check.","items":[{"id":"b1","goal":4,"prompt":"A: 0 or 4 (equally likely). B: 1 or 3 (equally likely). Which has the larger `σ`, and how many times larger?","parts":[{"t":"Larger `σ`:","choices":["A","B","Neither: they’re equal"]},"How many times larger?"],"_a":"aBByERkCag==","display":"A, 2 times as large","why":"Both means are 2. A’s values are 2 from the mean (`σ = 2`); B’s are 1 away (`σ = 1`).","wrong":[{"part":0,"match":"Neither: they’re equal","fb":"Equal means don’t mean equal spreads. The mean says where the centre is; `σ` says how far values spread from it."}]},{"id":"b2","goal":2,"prompt":"`X` = 5 − `d` or 5 + `d`, equally likely. Find `d` so `σ = 3`.","label":"`d` =","_a":"AA==","display":"`d = 3`","why":"Both values are `d` from the mean 5, so `σ = d = 3`.","wrong":[{"match":9,"fb":"`σ = √{Var(X)}`. Variance 9 means `σ = 3`."}]},{"id":"b3","goal":4,"star":true,"prompt":"`X` = 0 (`P = p`) or 10 (`P = 1 - p`) with `μ = 2`. Find `p`, then `σ`.","parts":["`p` =","`σ` ="],"_a":"aAIdCxkEag==","display":"`p = 0.8`; `σ = 4`","why":"10(1 − `p`) = 2 gives `p = 0.8`; `Var(X)` = 4(0.8) + 64(0.2) = 16, so `σ = 4`.","wrong":[{"part":1,"match":16,"fb":"That’s the variance; `σ = √{Var(X)}`."}]},{"id":"b4","goal":2,"star":true,"prompt":"Number of heads in 2 coin tosses: `σ`? (2 decimals)","label":"`σ` =","_a":"AxwEAwIBBw8ECgICDQYCDQQE","display":"`σ = √0.5 ≈ 0.71`","why":"`P` = 0.25, 0.5, 0.25 for 0, 1, 2 heads; `μ = 1`; `Var` = 1(0.25) + 0 + 1(0.25) = 0.5; `σ = √0.5 ≈ 0.71`.","wrong":[{"match":0.5,"fb":"`Var = 0.5`; `σ = √0.5`."}]},{"id":"b5","goal":6,"star":true,"prompt":"A game pays $9 with `P = 0.1`, else $0. Find `μ` and `σ`. Then the prizes are doubled: new `μ` and `σ`?","parts":["`μ` =","`σ` =","new `μ` =","new `σ` ="],"_a":"aAIdChkCGQ4fAx0LGQUZDW4=","display":"`μ` = $0.90, `σ` = $2.70; doubled: `μ` = $1.80, `σ` = $5.40","why":"`E(X^2) = 8.1`, so `Var = 8.1 - 0.81 = 7.29` and `σ = 2.7`. Doubling doubles both `μ` and `σ`.","wrong":[{"part":3,"match":10.8,"fb":"`σ` doubles, the variance quadruples."}],"hints":["`μ = 0.9`; `E(X^2) = 81(0.1) = 8.1`.","`Var = 8.1 - 0.81 = 7.29`, so `σ = 2.7`.","Doubling: `μ = 1.8`, `σ = 5.4`."]},{"id":"b6","goal":5,"star":true,"prompt":"Game P pays $0 or $4, equally likely. Game Q pays $0 or $`x` with `P`(win) = 0.2 and has the same mean as P. Find `x`, Q’s `σ`, and which game is riskier.","parts":["`x` =","Q’s `σ` =",{"t":"Riskier:","choices":["Game P","Game Q","Equally risky"]}],"_a":"aAMDHwEcFX5SX1YTZBJq","display":"`x = 10`; Q’s `σ = 4`; Game Q is riskier","fb":"`μ_P = 2 = 0.2x`, so `x = 10`; `Var_Q = 0.2(64) + 0.8(4) = 16`.","why":"`μ_P = 2 = 0.2x`, so `x = 10`; `Var_Q = 0.2(64) + 0.8(4) = 16`, so `σ_Q = 4`, twice P’s `σ` of 2.","wrong":[{"part":2,"match":"Equally risky","fb":"The mean says where the centre is; `σ` says how far values spread from it."}]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Uriel","how":"","goal":[1,6],"instruction":"Uriel made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"`X` = 1, 3, 5 with `P` = 0.25, 0.5, 0.25. Find `σ`.","steps":["`μ` = 0.25 + 1.5 + 1.25 = 3.","Deviations: −2, 0, 2. Squares: 4, 0, 4.","`Var` = (4 + 0 + 4) ÷ 3 = `8/3`.","`σ = √{8/3} ≈ 1.63`."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 uses step 3’s value."],"fixes":[{"t":"Step 3 is correct.","why":"The values aren’t equally likely: weight by probability.","_n":"1k5fe","_k":"ca4c293d"},{"t":"`Var` = 4(0.25) + 0(0.5) + 4(0.25) = 2, so `σ = √2 ≈ 1.41`.","why":"Rare values should count less. Multiply each `(x - μ)^2` by `P(x)`.","_n":"1l5ce","_k":"fa7feb80"},{"t":"`Var` = 4 + 0 + 4 = 8.","why":"That adds the squares without their probabilities.","_n":"1m5de","_k":"09feb585"},{"t":"`Var` = (−2 + 0 + 2) ÷ 3 = 0.","why":"Unsquared deviations cancel. Square them, then weight each by its probability.","_n":"1nded","_k":"758146d7"}],"hints":["Which probability goes with each square?","0.25, 0.5, 0.25.","2, so `σ ≈ 1.41`."]},{"id":"e2","goal":1,"task":"`X` = 0 (`P` = 0.9) or 10 (`P` = 0.1). Find `σ`.","steps":["`μ = 1`.","Squared deviations: 1 and 81.","`Var` = 1(0.9) + 81(0.1) = 9.","So `σ = 9`."],"_a":"AA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"`σ = √9 = 3`.","why":"`σ = √{Var(X)}`. Variance 9 means `σ = 3`.","_n":"1oddd","_k":"50277494"},{"t":"Step 4 is correct.","why":"`σ` is the square root of the variance.","_n":"1pdcd","_k":"ba24fbf7"},{"t":"`σ = 81`.","why":"That squares the variance; `σ` is its square root.","_n":"1qdbd","_k":"aa45a22f"},{"t":"`σ = 4.5`.","why":"That halves the variance; `σ` is its square root.","_n":"1re2d","_k":"33a9b243"}],"hints":["`Var` or `σ`?","`σ = √{Var}`.","3."]},{"id":"e3","goal":6,"task":"`X` has `σ = 2`. A bonus adds 5 to every value: `Y = X + 5`. Find `σ_Y`.","steps":["Every value moves up by 5.","So the mean moves up by 5.","And `σ_Y = 2 + 5 = 7`."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"`σ_Y = 2 × 5`.","why":"Multiplying would stretch the distances, but this change only adds 5.","_n":"1se1d","_k":"7dc9147d"},{"t":"Step 3 is correct.","why":"Shifting doesn’t spread the values.","_n":"1te0d","_k":"1caa31f3"},{"t":"`σ_Y = 10`.","why":"Adding 5 doesn’t stretch anything: every distance from the mean stays the same.","_n":"1udfd","_k":"5bb45d7f"},{"t":"Distances from the mean don’t change, so `σ_Y = 2`.","why":"Shifting every value by 5 moves the centre, not the spread.","_n":"1vd6d","_k":"2e764c1f"}],"hints":["Does the gap between values change?","No.","`σ` stays 2."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you most: `σ` quadrupling from Tight to Wide, or `σ` staying put when every value shifted?"},{"id":"j2","q":"In your own words, why do we square the deviations and then take a square root?"},{"id":"j3","q":"Explain to a friend how to compare two games with the same expected value."},{"id":"j4","q":"Describe a choice in your life where the spread matters as much as the average. What would you choose, and why?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`X` = 1 or 3, each with `P` = 0.5. Find `Var(X)`.","options":[{"t":"0","why":"The unsquared deviations cancel.","_n":"1wd5d","_k":"7befd746"},{"t":"1","why":"`μ = 2`; `(-1)^2(0.5) + 1^2(0.5)`.","_n":"1xd8d","_k":"45467c47"},{"t":"2","why":"That adds the squares without the probabilities.","_n":"1yd9d","_k":"30ed8b5c"},{"t":"5","why":"That’s `E(X^2)`; subtract `μ^2 = 4`.","_n":"1zdad","_k":"e4b07f27"}]},"b":{"prompt":"`X` = 2 or 6, each with `P` = 0.5. Find `Var(X)`.","options":[{"t":"0","why":"`Σ(x - μ)P(x)` is always 0. Square first.","_n":"20dbd","_k":"fdcf5097"},{"t":"4","why":"`μ = 4`; 4(0.5) + 4(0.5).","_n":"21dcd","_k":"f0201bac"},{"t":"8","why":"That adds the squares without the probabilities.","_n":"22ddd","_k":"047defb3"},{"t":"20","why":"`E(X^2) = 20`; subtract 16.","_n":"23ded","_k":"57a24bf3"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"`Var(X) = 2.25`. Find `σ`.","options":[{"t":"1.125","why":"That halves it.","_n":"24dfd","_k":"b582b267"},{"t":"1.5","why":"`√2.25`.","_n":"25d0d","_k":"067da07b"},{"t":"2.25","why":"That’s the variance itself. `σ = √{Var(X)}`.","_n":"26d1d","_k":"1ba783aa"},{"t":"5.0625","why":"That squares the variance.","_n":"27d2d","_k":"42f5c480"}]},"b":{"prompt":"`Var(X) = 0.36`. Find `σ`.","options":[{"t":"0.1296","why":"That squares it.","_n":"28d1d","_k":"9d2fa09c"},{"t":"0.18","why":"That halves it.","_n":"29d4d","_k":"6f04c5f0"},{"t":"0.36","why":"That’s the variance itself. `σ = √{Var(X)}`.","_n":"2ad3d","_k":"1d0466ff"},{"t":"0.6","why":"`√0.36`.","_n":"2bced","_k":"c9a71b88"}]}},{"id":"k3","cat":"K","goal":6,"a":{"prompt":"`Y = X + 7`. How does `σ_Y` compare with `σ_X`?","options":[{"t":"`σ_Y = σ_X + 7`","why":"Shifting every value by 7 moves the centre, not the spread.","_n":"2ccdd","_k":"2288c78b"},{"t":"`σ_Y = σ_X + 49`","why":"Adding 7 doesn’t change the spread at all, and nothing gets squared.","_n":"2dd0d","_k":"de04c3f1"},{"t":"`σ_Y = 7σ_X`","why":"That’s for multiplying by 7.","_n":"2ecfd","_k":"d8faf36b"},{"t":"They’re equal","why":"Adding a constant doesn’t change spread.","_n":"2fdad","_k":"2fc4c7dd"}]},"b":{"prompt":"`Y = 4X`. How does `σ_Y` compare with `σ_X`?","options":[{"t":"`σ_Y = 16σ_X`","why":"That’s how the variance scales.","_n":"2gd9d","_k":"d8171ceb"},{"t":"`σ_Y = 4σ_X`","why":"Every distance from the mean becomes 4 times as far.","_n":"2hccd","_k":"36801a38"},{"t":"They’re equal","why":"Multiplying stretches the distances.","_n":"2icdd","_k":"b9b10e35"},{"t":"`σ_Y = σ_X + 4`","why":"Multiplying stretches the distances; it doesn’t add to them. `σ` scales by `|a|`; the variance scales by `a^2`.","_n":"2jcad","_k":"c00c2c67"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"`X` = 0, 2, 4 with `P` = 0.125, 0.75, 0.125. Find `σ`.","options":[{"t":"1","why":"`μ = 2`; `Var` = 4(0.125) + 0 + 4(0.125) = 1.","_n":"2kcbd","_k":"969ad4e2"},{"t":"About 2.24","why":"`√5`: `E(X^2) = 5` without subtracting `μ^2 = 4`.","_n":"2ld0d","_k":"d7f85349"},{"t":"0","why":"The unsquared deviations cancel. Square first.","_n":"2md1d","_k":"fdf73591"},{"t":"About 1.63","why":"Averaging 4, 0, 4 equally gives `8/3`.","_n":"2nced","_k":"4b805b1f"}]},"b":{"prompt":"`X` = 1, 3, 5 with `P` = 0.125, 0.75, 0.125. Find `σ`.","options":[{"t":"About 3.16","why":"`√10` forgets to subtract 9.","_n":"2ocfd","_k":"9efc5b4d"},{"t":"1","why":"`μ = 3`; `Var` = 4(0.125) + 0 + 4(0.125).","_n":"2pd4d","_k":"a595a3de"},{"t":"0","why":"The unsquared deviations cancel. Square first.","_n":"2qd5d","_k":"5f25dbb9"},{"t":"About 1.63","why":"Averaging 4, 0, 4 equally gives `8/3`. Rare values should count less. Multiply each `(x - μ)^2` by `P(x)`.","_n":"2r320","_k":"b1f39c80"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Game A always pays $2. Game B pays $0 or $4 (equally likely). Game C pays $1 or $3 (equally likely). Order the games from smallest to largest `σ`.","options":[{"t":"A, B, C","why":"C’s values are closer to the mean than B’s.","_n":"2s330","_k":"6b9c0150"},{"t":"A, C, B","why":"`σ` = 0, 1, 2.","_n":"2t300","_k":"939157cb"},{"t":"B, C, A","why":"Reversed.","_n":"2u310","_k":"7ac66a30"},{"t":"All equal, because each has a mean of $2","why":"The mean says where the centre is; `σ` says how far values spread from it.","_n":"2v2e0","_k":"34d7133c"}]},"b":{"prompt":"Three distributions each have mean 10: A is 9 or 11, B is 6 or 14 (each equally likely), and C is always 10. Order from smallest to largest `σ`.","options":[{"t":"All equal","why":"The mean says where the centre is; `σ` says how far values spread from it.","_n":"2w2f0","_k":"ca2edf6a"},{"t":"A, C, B","why":"C has no spread at all.","_n":"2x2c0","_k":"b80d9a54"},{"t":"B, A, C","why":"Reversed.","_n":"2y2d0","_k":"3d124356"},{"t":"C, A, B","why":"`σ` = 0, 1, 4.","_n":"2z2a0","_k":"41982167"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A tutor charges $20 per month plus $15 per session. The number of sessions `X` a student books in a month has `μ = 4` and `σ = 1.5`. Find the mean and standard deviation of the monthly bill `Y = 15X + 20`.","options":[{"t":"`μ` = $80, `σ` = $42.50","why":"The $20 fee doesn’t add spread.","_n":"302b0","_k":"4bb0d466"},{"t":"`μ` = $80, `σ` = $337.50","why":"`15^2 × 1.5` mixes variance and `σ`.","_n":"31181","_k":"5836945b"},{"t":"`μ` = $60, `σ` = $22.50","why":"The mean includes the $20 fee.","_n":"32171","_k":"e155c1df"},{"t":"`μ` = $80, `σ` = $22.50","why":"15(4) + 20; 15 × 1.5.","_n":"331a1","_k":"3c1bad87"}]},"b":{"prompt":"A delivery bill is `Y = 10X + 5`, where `X` (the number of parcels) has `μ = 3` and `σ = 2`. Find `μ_Y` and `σ_Y`.","options":[{"t":"`μ` = $35, `σ` = $25","why":"The $5 doesn’t add spread.","_n":"34191","_k":"714945b3"},{"t":"`μ` = $30, `σ` = $20","why":"Include the $5 in the mean.","_n":"351c1","_k":"5bde4844"},{"t":"`μ` = $35, `σ` = $200","why":"`10^2 × 2` mixes variance and `σ`: `σ` scales by 10.","_n":"361b1","_k":"00852262"},{"t":"`μ` = $35, `σ` = $20","why":"10(3) + 5; 10 × 2.","_n":"371e1","_k":"3ca799af"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"`X` = goals per game for a team, with `μ = 2.4` and `σ = 0.8`. Which best explains what `σ` means?","options":[{"t":"“The probability of scoring is 0.8.”","why":"`σ` isn’t a probability.","_n":"381d1","_k":"5d3b846e"},{"t":"“80% of games have 2 or 3 goals.”","why":"`σ` isn’t a percentage.","_n":"39201","_k":"28d48146"},{"t":"“In a typical game, the number of goals is about 0.8 away from the 2.4 average.”","why":"`σ` is a typical distance from the mean.","_n":"3a1f1","_k":"838191ae"},{"t":"“The team scores 0.8 goals per game.”","why":"That would be a mean.","_n":"3ba60","_k":"135fa715"}]},"b":{"prompt":"Two players both average 20 points per game. Player A has `σ = 2` and player B has `σ = 9`. Which best compares them?","options":[{"t":"“They’re the same, because their means are equal.”","why":"The mean says where the centre is; `σ` says how far values spread from it.","_n":"3ca70","_k":"94510ee9"},{"t":"“A scores 2 points per game.”","why":"`σ` isn’t a score.","_n":"3da80","_k":"d64f2cc9"},{"t":"“B is better, because 9 > 2.”","why":"A larger `σ` means more variation, not more points. The mean says where the centre is; `σ` says how far values spread from it.","_n":"3ea90","_k":"401a33d5"},{"t":"“A is more consistent: A’s games usually land near 20, while B’s vary much more.”","why":"Same mean; a smaller `σ` means results stay closer to it.","_n":"3faa0","_k":"9d696e19"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Why are the deviations squared when finding the variance?","options":[{"t":"“Squaring isn’t needed; it’s a convention.”","why":"`Σ(x - μ)P(x)` is always 0. Square first.","_n":"3gab0","_k":"09edae60"},{"t":"“Because probabilities are squared too.”","why":"Only the deviations are squared.","_n":"3hac0","_k":"30c20296"},{"t":"“Positive and negative deviations would cancel to 0; squaring makes every deviation count as a positive amount.”","why":"Unsquared deviations always sum to 0, so squaring is needed.","_n":"3iad0","_k":"6cbcbae7"},{"t":"“To make the numbers bigger and easier to compare.”","why":"Size isn’t the reason.","_n":"3j9e0","_k":"214637d6"}]},"b":{"prompt":"Why do we usually report `σ` rather than the variance?","options":[{"t":"“`σ` is always smaller than the variance.”","why":"Not when the variance is less than 1.","_n":"3k9f0","_k":"ae118ae8"},{"t":"“The variance can be negative.”","why":"A variance is never negative.","_n":"3l2c0","_k":"5e6fef23"},{"t":"“`σ` ignores the probabilities.”","why":"`σ` comes from the weighted variance.","_n":"3m2b0","_k":"8096cb8f"},{"t":"“`σ` is in the same units as `X`, so it’s easier to interpret as a typical distance.”","why":"Squaring changes the units (dollars become square dollars); the square root brings them back.","_n":"3n2a0","_k":"7cb33858"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Job A pays $600 a week, guaranteed. Job B (commission) pays $400 or $800 a week, equally likely. Which statement is correct?","options":[{"t":"Both have `σ` = $0, because their means are equal.","why":"The mean says where the centre is; `σ` says how far values spread from it.","_n":"3o290","_k":"82fe8656"},{"t":"Both have `μ` = $600; A has `σ` = $0 and B has `σ` = $200, so B is riskier","why":"B averages (400 + 800) ÷ 2 = $600, and each outcome is $200 from the mean.","_n":"3p300","_k":"e076d494"},{"t":"B has `σ` = $400.","why":"Each outcome is $200 from the mean.","_n":"3q2f0","_k":"87a71937"},{"t":"B has a higher expected pay.","why":"Both average $600.","_n":"3r2e0","_k":"7d87908b"}]},"b":{"prompt":"Investment A returns $50, guaranteed. Investment B returns $0 or $100, equally likely. Which statement is correct?","options":[{"t":"Both have `μ` = $50; B has `σ` = $50, so B is riskier","why":"B averages $50, and each outcome is $50 from the mean.","_n":"3s2d0","_k":"ead65444"},{"t":"B has `σ` = $100.","why":"Each outcome is $50 from the mean.","_n":"3t240","_k":"6675ee9c"},{"t":"Both have `σ` = $0.","why":"The mean says where the centre is; `σ` says how far values spread from it.","_n":"3u230","_k":"70c5bc26"},{"t":"B has a higher mean.","why":"Both average $50. The mean says where the centre is; `σ` says how far values spread from it.","_n":"3vaa1","_k":"3a2750f9"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"An app’s number of crashes per week, `X`, is 0, 1, 2 or 3 with `P` = 0.4, 0.3, 0.2, 0.1. Find `σ`.","options":[{"t":"About 1.41","why":"`√2` forgets to subtract `μ^2 = 1`.","_n":"3wab1","_k":"40093f7b"},{"t":"About 1.22","why":"Averaging the squared deviations equally gives 1.5.","_n":"3xa81","_k":"f95ecc7a"},{"t":"1.5","why":"That’s an unweighted variance, with no square root.","_n":"3ya91","_k":"491d9fb6"},{"t":"1","why":"`μ = 1`; `E(X^2) = 0.3 + 0.8 + 0.9 = 2`; `Var` = 2 − 1 = 1.","_n":"3zae1","_k":"516d2f8e"}]},"b":{"prompt":"`X` is 0, 1, 2 or 3 with `P` = 0.1, 0.2, 0.3, 0.4. Find `σ`.","options":[{"t":"About 2.24","why":"`√5` forgets to subtract 4.","_n":"40af1","_k":"a3291d89"},{"t":"1. `Y = aX`","`μ` and `σ` multiply by `a` (`σ` by `|a|`); the variance by `a^2`."],["Two equally likely values `m ± d`","`μ = m`, `σ = d`."],["Die","`μ = 3.5`, `Var = 35/12 ≈ 2.92`, `σ ≈ 1.71`."],["Risk","A large `σ` means results often land far from the expected value."]]}};</script>
