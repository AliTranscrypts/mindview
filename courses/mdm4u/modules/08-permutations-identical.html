.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 08: hero, Word scrambler (D4 identical tiles, Count / Group / Shuffle views, D5 grid paths), Paths on a grid, Design a word */
/* radioGroup (from MDM4U 05) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* @component D4 arrangementTiles (identical tiles) */
.pi-row{display:inline-flex;flex-wrap:wrap;gap:5px;vertical-align:middle}
.pi-t{display:inline-grid;grid-auto-flow:column;align-items:baseline;justify-content:center;min-width:38px;min-height:42px;padding:.15em .35em 0;border:2px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 1.3rem/1.6 var(--font-ui)}
.pi-t sub{font-size:.62em;font-weight:700;line-height:0;margin-left:1px}
.pi-t.rep{background:var(--hi-soft);border:2.5px solid var(--sel-bd)}
.pi-t.sm{min-width:24px;min-height:26px;padding:0 .2em;font-size:.86rem;line-height:1.75;border-width:1.5px;border-radius:5px}
.pi-t.sm.rep{border-width:2px}
.pi-t.pend{border:1.5px dashed var(--rule);background:transparent}
.pi-row.pi-big{margin:2px 0 6px}
.pi-row.pop .pi-t{animation:piPop .35s both}
.pi-row.pop .pi-t:nth-child(2){animation-delay:.04s}.pi-row.pop .pi-t:nth-child(3){animation-delay:.08s}.pi-row.pop .pi-t:nth-child(4){animation-delay:.12s}
.pi-row.pop .pi-t:nth-child(5){animation-delay:.16s}.pi-row.pop .pi-t:nth-child(6){animation-delay:.2s}.pi-row.pop .pi-t:nth-child(7){animation-delay:.24s}.pi-row.pop .pi-t:nth-child(8){animation-delay:.28s}
@keyframes piPop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

/* Explore */
.pi-top{margin-bottom:4px}
.pi-trow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.pi-trow .rg-wrap{margin-bottom:6px}
.pi-lt{margin:0 0 6px;min-height:38px;font-weight:700}
.pi-lt[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.pi-lt[aria-pressed="true"]::before{content:"✓ "}
.pi-cap .m{white-space:normal}
.pi-tiles{min-height:52px}
.pi-legend{margin:0 0 10px}
.pi-legend .pi-t{min-width:20px;min-height:20px;line-height:1.3;font-size:.72rem;vertical-align:-.2em}
.pi-empty{margin:8px 0 12px}
.pi-plab{margin:0 0 4px;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.pi-kbw{margin:0 0 12px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.pi-kbw .q-actions{margin:6px 0 0}
.pi-keys{display:flex;flex-wrap:wrap;gap:6px}
button.pi-key{min-width:42px;min-height:42px;margin:0;border:2px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 1.1rem var(--font-ui);cursor:pointer}
button.pi-key:hover:not(:disabled){border-color:var(--pen)}
button.pi-key[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
button.pi-key:disabled{opacity:.4;cursor:not-allowed}
.pi-msg{margin:6px 0 0;color:var(--red);font-weight:700}
.pi-panel{margin:4px 0 0}
.pi-cv{padding:8px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.pi-cl{margin:0 0 6px;line-height:1.7;transition:opacity .4s}
.pi-cl:last-child{margin-bottom:0}
.pi-cl.off{visibility:hidden;opacity:0}
.pi-cl.fresh{animation:piFade .6s both}
@keyframes piFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pi-rc{display:inline-block;margin:2px 4px 2px 0;padding:0 .5em;border:1.5px solid var(--sel-bd);border-radius:6px;background:var(--hi-soft);font-weight:700;white-space:nowrap}
.pi-gnote{margin:0 0 6px}
.pi-stks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:420px;overflow:auto;padding:4px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.pi-stks.wide{grid-template-columns:minmax(0,1fr)}
.pi-stk{min-width:0;padding:6px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);box-shadow:3px 3px 0 var(--rule),6px 6px 0 var(--paper)}
.pi-stk.fresh{animation:piFade .5s both}
.pi-sh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:0 0 4px}
.pi-sx{font:700 .82rem var(--font-ui);color:var(--ink-2)}
.pi-row.xs{flex-wrap:nowrap;gap:2px}
.pi-row.xs .pi-t{min-width:17px;min-height:22px;padding:0 1px;font-size:.78rem;line-height:1.6;border-radius:4px}
.pi-sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:2px 8px;margin:0;padding:0;list-style:none}
.pi-v{font:400 .9rem/1.5 var(--font-ui);letter-spacing:.04em;color:var(--ink)}
.pi-v sub{font-size:.7em;font-weight:700}
.pi-v.more{color:var(--ink-2);font-size:.8rem;letter-spacing:0}
.pi-shl{margin:4px 0 6px}
.pi-shc{margin:0 0 6px}
.pi-found{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow:auto}
.pi-fw{padding:0 .45em;border:1.5px solid var(--rule);border-radius:5px;background:var(--sheet);font:700 .82rem/1.6 var(--font-ui);letter-spacing:.05em}
.pi-fw.on{background:var(--hi-soft);border-color:var(--sel-bd)}
.pi-fw.more{border:0;background:none;font-weight:400;color:var(--ink-2)}
.pi-steps{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 8px}
.pi-stp{display:flex;align-items:center;gap:8px}
.pi-stl{min-width:7.5em;font-weight:700}
.pi-stb{min-width:42px}
.pi-sto{min-width:1.4em;text-align:center;font:700 1.3rem var(--font-math)}
.pi-gword{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:8px 0 2px}
.pi-gword .pi-plab{margin:0}
.pi-gmsg{margin:6px 0 4px;min-height:1.2em}
.pi-gm{margin-bottom:6px}
.pi-how{margin:6px 0 0}
.pi-pw{font-weight:700;letter-spacing:.06em}
.pi-gal{margin:6px 0 0}
.pi-galg{display:flex;flex-wrap:wrap;gap:6px;max-height:300px;overflow:auto}
.pi-gi{display:inline-flex;flex-direction:column;align-items:center;gap:1px;padding:3px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet)}
.pi-gi.cur{border-color:var(--sel-bd);background:var(--hi-soft)}
.pi-gi small{font:700 .68rem var(--font-ui);letter-spacing:.04em;color:var(--ink)}

/* @component D5 gridPaths */
.gp{position:relative;width:100%;margin:4px 0}
.gp-svg{display:block;width:100%;height:auto;overflow:visible}
.gp-pts{position:absolute;inset:0}
.gp-pt{position:absolute;width:30px;height:30px;margin:0;padding:0;transform:translate(-50%,-50%);border:2px solid transparent;border-radius:50%;background:transparent;cursor:pointer}
.gp-pt.nx{border:2.5px dashed var(--pen);background:var(--sheet)}
.gp-pt:hover{border-color:var(--pen)}
.gp-pt:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.gp-st{stroke:var(--rule);stroke-width:3;stroke-linecap:round}
.gp-leg{fill:var(--hi-soft);stroke:var(--sel-bd);stroke-width:1.5;stroke-dasharray:5 4}
.gp-gh{fill:none;stroke:var(--ink-2);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;opacity:.4}
.gp-hot{fill:none;stroke:var(--pen);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;opacity:.75}
.gp-path{fill:none;stroke:var(--pen);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
.gp-dot{fill:var(--ink-2)}
.gp-start{fill:var(--ink)}
.gp-end{fill:var(--sheet);stroke:var(--ink);stroke-width:3}
.gp-cur{fill:var(--pen);stroke:var(--sheet);stroke-width:2}
.gp-cp{fill:none;stroke:var(--ink);stroke-width:3}
.gp-bk{fill:none;stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.gp-lab{font:700 13px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.gp-num{font:700 16px var(--font-math);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:5px;stroke-linejoin:round}
.gp-num.zero{fill:var(--ink-2)}
.gp-num.fresh{animation:piNum .5s both}
@keyframes piNum{from{opacity:0}to{opacity:1}}
.gp-mini{display:block;width:62px;height:auto}
.gp-mini .gp-st{stroke-width:5}
.gp-mini .gp-path{stroke-width:11}
.gp-mini .gp-bk{stroke-width:8}

/* hero */
.pi-eqw{font-style:normal;font-size:.6em;letter-spacing:0}
.pi-h{display:grid;gap:4px;justify-items:center;width:100%}
.pi-hsvg{display:block;width:100%;max-width:420px;height:auto}
.pi-htile{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.pi-htile.rep{fill:var(--hi-soft);stroke:var(--sel-bd);stroke-width:2.5}
.pi-htop{opacity:0;transition:opacity .6s}
.pi-hsvg.on .pi-htop{opacity:1}
.pi-hbl{font:700 22px var(--font-ui);fill:var(--ink);text-anchor:middle}
.pi-hs{font:700 9px var(--font-ui);fill:var(--ink);transition:opacity .7s}
.pi-hs.big{font-size:12px}
.pi-hsvg.noA .hs-a,.pi-hsvg.noN .hs-n{opacity:0}
.pi-hc{opacity:0;transition:opacity .7s}
.pi-hsvg.cards .pi-hc{opacity:1}
.pi-hcr{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.pi-hcl{font:700 13px var(--font-ui);fill:var(--ink);text-anchor:middle}
.pi-hb{font:700 15px var(--font-math);fill:var(--ink);text-anchor:middle;opacity:0;transition:opacity .5s}
.pi-hb.on{opacity:1}
.pi-hcnt{min-height:1.6em;text-align:center}
.pi-hn{font:700 1.6rem var(--font-math);color:var(--ink)}
.pi-hl{font-size:.92rem;color:var(--ink-2)}

/* Part 3 */
.pq-tabs{margin-bottom:10px}
.pq-tick{color:var(--green);font-weight:700}
.pq-card{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 6px}
.pq-lab{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.pq-name{font-size:1.15rem;font-weight:700}
.pq-task{margin:0 0 10px}
.pq-two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px 24px;align-items:start}
@media (max-width:760px){ .pq-two{grid-template-columns:minmax(0,1fr)} }
.pq-gcol .gp{margin:0 auto 4px}
.pq-h{margin:0 0 4px}
.pq-icol .q-actions{margin:4px 0 8px}
.pq-routes{margin:0 0 6px;padding-left:1.6em}
.pq-rw{font-weight:700;letter-spacing:.06em}
.pq-ok{color:var(--green);font-weight:700}
.pq-read{margin:4px 0 8px}
.pq-minis{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 8px}
.pq-mi{display:inline-block;padding:2px;border:1.5px solid var(--rule);border-radius:5px;background:var(--sheet);transition:opacity .9s}
.pq-mi.bad .gp-path{stroke:var(--ink-2)}
.pq-minis.gone .pq-mi.bad{opacity:.4}
.pq-done{margin:10px 0 0}

/* task */
.pi-conds{margin:.4em 0 .8em;padding-left:1.4em}
.dw-in{margin:4px 0 12px}
.dw-in .pi-keys{margin:0 0 10px}
.dw-slots{display:grid;grid-template-columns:repeat(7,minmax(0,46px));gap:5px;margin:0 0 6px}
.dw-slot{min-height:46px;padding:0;border:2px dashed var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 1.25rem var(--font-ui);cursor:pointer}
.dw-slot.full{border-style:solid;border-color:var(--ink)}
.dw-slot:hover{border-color:var(--pen)}
.dw-n{font-size:.75rem;font-weight:400;color:var(--ink-2)}
.dw-msg{margin:4px 0 0}
.dw-pv .pi-row{margin:2px 0 8px}
@media (max-width:560px){ .pi-t{min-width:32px;min-height:38px;font-size:1.1rem} .pi-stl{min-width:0} .dw-slots{gap:3px} }

ounter drops from 720 to 120. Then the N labels fade, and the two stacks that differ only in their N labels merge, labelled divide by 2 factorial; the counter drops to 60 distinct words.\">\u003csvg class=\"pi-hsvg\" id=\"pi-hsvg\" viewBox=\"0 0 360 196\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003cdiv class=\"pi-hcnt\" id=\"pi-hcnt\" aria-hidden=\"true\">\u003c/div>\u003c/div>"}},"goals":["I can explain why identical objects reduce the number of distinct arrangements.","I can count arrangements with repeated objects using `n!/(a! b! ⋯)`.","I can count shortest grid paths as arrangements of R and U moves.","I can count arrangements with identical objects and a simple condition (begins with, ends with, kept together).","I can solve problems with identical objects in contexts."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Factorials","goal":2,"prompt":"Evaluate `{6!}/{3! × 2!}`.","options":[{"t":"60","why":"720 ÷ 12 = 60.","_n":"0536","_k":"4db2bd89"},{"t":"120","why":"That divides by `3!` only. Divide by `2!` as well.","_n":"1546","_k":"98750f54"},{"t":"360","why":"That divides by `2!` only. Divide by `3!` as well.","_n":"2556","_k":"c79e0cce"},{"t":"720","why":"That ignores the denominator. Divide by `3! × 2! = 12`.","_n":"3566","_k":"2df88060"}],"hints":["Work out `3! × 2!`.","6 × 2 = 12.","720 ÷ 12 = 60."]},{"id":"w2","skill":"Factorials","goal":2,"prompt":"Evaluate `{5!}/{2! × 3!}`.","options":[{"t":"10","why":"120 ÷ 12 = 10.","_n":"4576","_k":"9116b7f9"},{"t":"20","why":"That divides by `3!` only. Divide by `2!` as well.","_n":"5586","_k":"9e6a6254"},{"t":"60","why":"That divides by `2!` only. Divide by `3!` as well.","_n":"6596","_k":"3bdbebee"},{"t":"120","why":"That’s `5!` with no division. Divide by `2! × 3! = 12`.","_n":"75a6","_k":"3226fb1f"}],"hints":["`2! × 3! = 12`.","120 ÷ 12.","10."]},{"id":"w3","skill":"Arrangements of distinct objects","goal":1,"prompt":"How many ways can the letters of WORD be arranged?","options":[{"t":"4","why":"That counts the letters, not their arrangements.","_n":"85b6","_k":"0314c7eb"},{"t":"16","why":"4 × 4 isn’t a counting rule: each letter is used once, so the choices shrink, 4 × 3 × 2 × 1.","_n":"9066","_k":"8bfdd1a9"},{"t":"24","why":"`4! = 24`.","_n":"a056","_k":"98b624f9"},{"t":"256","why":"`4^4` lets a letter repeat. Each letter of WORD is used once.","_n":"b046","_k":"0aca163c"}],"hints":["4 different letters.","4 × 3 × 2 × 1.","24."]},{"id":"w4","skill":"Arrangements of distinct objects","goal":1,"prompt":"Evaluate `P(5, 5)`.","options":[{"t":"0","why":"`0! = 1`, not 0.","_n":"c036","_k":"ee891b6a"},{"t":"1","why":"`P(5, 5) = 5!/(5 - 5)! = 5!/0!`, not `5!/5!`.","_n":"d0a6","_k":"0e5e962b"},{"t":"25","why":"5 × 5 isn’t a counting rule: `P(5, 5) = 5!`.","_n":"e096","_k":"3def574e"},{"t":"120","why":"`5!/0! = 120`.","_n":"f086","_k":"a2a80267"}],"hints":["`P(n, n) = n!/0!`.","`0! = 1`.","120."]},{"id":"w5","skill":"Listing small cases","goal":1,"prompt":"List every different arrangement of the letters A, A, B. How many are there?","options":[{"t":"1","why":"The position of B changes the arrangement.","_n":"g076","_k":"140864aa"},{"t":"2","why":"B can be first, middle or last.","_n":"h0e6","_k":"8bfce2c3"},{"t":"3","why":"AAB, ABA, BAA.","_n":"i0d6","_k":"dc0d6ea8"},{"t":"6","why":"Swapping the two A’s gives the same arrangement.","_n":"j0c6","_k":"c7134507"}],"hints":["Where can the B go?","First, middle or last.","3 arrangements."]},{"id":"w6","skill":"Listing small cases","goal":3,"prompt":"On a grid, you walk 1 block right and 1 block up, in either order. How many shortest routes are there?","options":[{"t":"1","why":"Right first or up first.","_n":"k0d6","_k":"1f4c2ab9"},{"t":"2","why":"RU or UR.","_n":"l0a6","_k":"c42149f0"},{"t":"3","why":"List them: RU, UR.","_n":"m0b6","_k":"98ccafc9"},{"t":"4","why":"Only 2 moves to order.","_n":"n086","_k":"4209c45c"}],"hints":["Which move comes first?","R then U, or U then R.","2."]}],"refreshers":{"Factorials":"Work out each factorial, multiply the ones in the denominator, then divide. `3! × 2! = 12`.","Arrangements of distinct objects":"`n` different objects in a line: `n!` arrangements.","Listing small cases":"List systematically: fix the position of the odd one out, then move it along."}}},"explore":{"heading":"Word scrambler","intro":"Scramble a word and see how repeated letters collapse many line-ups into one. Then switch to grid paths, where the ‘letters’ are moves.","predIntro":"Make a prediction first. Then the word scrambler will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"words","word":"BANANA","labels":true,"view":"count"},"prompt":"With labelled letters there are 720 line-ups. How many distinct words once the labels are removed?","options":[{"t":"60","_n":"o096","_k":"cd35d677"},{"t":"120","_n":"p066","_k":"c8a0ca1c"},{"t":"360","_n":"q076","_k":"e38214f4"},{"t":"720","_n":"r146","_k":"41ae7317"}],"explain":"Each word appears `3! × 2! = 12` times: 720 ÷ 12 = 60. Swapping the identical letters gives the same word: divide by the shuffles that change nothing."},{"id":"p2","start":{"mode":"words","word":"OTTAWA","labels":false,"view":"count"},"prompt":"OTTAWA: which divisor gives the number of distinct arrangements?","options":[{"t":"`4!`","_n":"s156","_k":"68e50e23"},{"t":"`2! + 2!`","_n":"t127","_k":"127d48d0"},{"t":"`2!`","_n":"u117","_k":"9a160a3a"},{"t":"`2! × 2!`","_n":"v147","_k":"52f4e1f3"}],"explain":"T appears twice and A appears twice: one factorial for each repeated letter, multiplied. 720 ÷ 4 = 180."},{"id":"p3","start":{"mode":"grid","R":3,"U":2},"prompt":"Grid paths, `R = 3` and `U = 2`. How many shortest paths?","options":[{"t":"5","_n":"w137","_k":"78aa146e"},{"t":"6","_n":"x167","_k":"814476c8"},{"t":"10","_n":"y157","_k":"1b112efd"},{"t":"12","_n":"z187","_k":"434ea4e8"}],"explain":"A path is RRRUU in some order: `{5!}/{3! × 2!} = 10`. It isn’t 3 + 2 or 3 × 2."},{"id":"p4","start":{"mode":"words","word":"custom","custom":"AAAA","labels":false,"view":"count"},"prompt":"Make your own: AAAA. How many distinct arrangements of AAAA?","options":[{"t":"0","_n":"10177","_k":"735b9e06"},{"t":"1","_n":"110a7","_k":"c67205b5"},{"t":"4","_n":"12097","_k":"085cf37d"},{"t":"24","_n":"13187","_k":"40a3ae5a"}],"explain":"`4!/4! = 1`: every shuffle looks the same."}],"chalIntro":"Set up the word scrambler, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Choose a word from the list, or build one, with exactly 180 distinct arrangements.","why":"180 = 720 ÷ (`2! × 2!`): 6 letters, with two different letters each appearing twice.","hints":["180 = 720 ÷ 4.","`4 = 2! × 2!`.","Use 6 letters with two different letters each appearing twice."]},{"id":"tc2","goal":3,"prompt":"Grid mode: set `R` and `U` so there are exactly 35 shortest paths.","why":"`{7!}/{4! 3!} = 35`: every path is 4 R’s and 3 U’s in some order (or 3 R’s and 4 U’s).","hints":["`35 = 7!/(R! U!)`.","Try 7 moves in total.","4 R’s and 3 U’s: 5040 ÷ (24 × 6) = 35."]},{"id":"tc3","goal":2,"stretch":true,"prompt":"Make your own: build a 6-letter word that uses \u003cstrong>at least three different letters\u003c/strong> and has as \u003cstrong>few\u003c/strong> distinct arrangements as possible.","why":"Letter counts {4, 1, 1}, such as AAAABC: 720 ÷ `4!` = 30, the fewest possible with three different letters.","hints":["Count = 720 ÷ (product of the factorials).","Make that product as large as you can with three groups.","`4! × 1! × 1! = 24` beats `3! × 2! × 1! = 12`: AAAABC gives 30."]}]},"part3":{"slug":"paths","name":"Paths","heading":"Paths on a grid","intro":"A shortest route on a city grid is a word made of R’s (one block right, east) and U’s (one block up, north). Work through the four stations: trace routes, stop at a checkpoint, dodge road work, then label every corner with its route count.","stations":[{"id":"s1","name":"Count the routes","task":"A city grid, 4 blocks east and 3 blocks north. Trace \u003cstrong>three different\u003c/strong> shortest routes from Start to End: tap \u003cstrong>R\u003c/strong> or \u003cstrong>U\u003c/strong>, press → or ↑, or tap the next corner. Each route’s word appears.","alg":["Every shortest route is 4 R’s and 3 U’s in some order.","`{7!}/{4! 3!}` = 5040 ÷ (24 × 6) = 35 routes"]},{"id":"s2","name":"Through a checkpoint","task":"A coffee shop sits at (2, 1). Show the routes to the shop and the routes from the shop to the end. Then trace a route that stops for coffee.","alg":["Routes = (routes to the shop) × (routes from the shop to the end)","To the shop, 2 right and 1 up: `{3!}/{2! 1!}` = 3","From the shop to the end, 2 right and 2 up: `{4!}/{2! 2!}` = 6","3 × 6 = 18 routes through the shop"]},{"id":"s3","name":"Avoid a blocked corner","task":"Road work blocks (2, 1). Trace a route that avoids it. Then show every route: the survivors stay blue and the blocked ones fade.","alg":["Routes that avoid (2, 1) = all routes − routes through (2, 1)","35 − 18 = 17 routes"]},{"id":"s4","name":"Zoom to the counting","task":"Label every corner with the number of shortest routes from Start to it. Tap a corner to fill it in: corners along the bottom and left edges have 1 route, and each inside corner is the sum of the corner to its left and the corner below it.","alg":["Along the edges: 1, 1, 1, … (one straight route).","Inside: (corner to the left) + (corner below), because the last move into a corner is R or U.","End: 15 + 20 = 35, matching `{7!}/{4! 3!}`.","Read the diagonals: 1 3 3 1 and 1 4 6 4 1 are rows of Pascal’s triangle (module 13).","With road work at (2, 1), that corner counts 0 and the end drops to 17."]}],"quickCheck":{"title":"Quick check","summary":"Paths on a grid quick check","items":[{"id":"q1","goal":3,"prompt":"Shortest paths on a 2 × 2 grid?","choices":[{"t":"2","fb":"`{4!}/{2! 2!} = 6`. A path is a sequence of moves. Count arrangements of R’s and U’s.","_n":"14197","_k":"90a02808"},{"t":"4","fb":"`{4!}/{2! 2!} = 6`. A path is a sequence of moves. Count arrangements of R’s and U’s.","_n":"151a7","_k":"e0ec2dfd"},{"t":"6","fb":"Right. A path is RRUU in some order: `{4!}/{2! 2!} = 6`.","_n":"161b7","_k":"76fafa5a"},{"t":"24","fb":"`{4!}/{2! 2!} = 6`. The R’s are identical, and so are the U’s.","_n":"17147","_k":"08aadf12"}]},{"id":"q2","goal":3,"prompt":"Shortest paths on a 3 × 3 grid?","choices":[{"t":"6","fb":"`{6!}/{3! 3!} = 20`.","_n":"18157","_k":"738ee238"},{"t":"9","fb":"`{6!}/{3! 3!} = 20`.","_n":"19167","_k":"b313bf02"},{"t":"20","fb":"Right. RRRUUU in some order: `{6!}/{3! 3!} = 20`.","_n":"1a177","_k":"c34d8298"},{"t":"720","fb":"`{6!}/{3! 3!} = 20`.","_n":"1b107","_k":"52331bd7"}]},{"id":"q3","goal":3,"prompt":"On a 2 × 2 grid, how many paths pass through the centre (1, 1)?","choices":[{"t":"2","fb":"2 ways to reach it × 2 ways onward.","_n":"1c117","_k":"27467003"},{"t":"3","fb":"2 ways to reach it × 2 ways onward.","_n":"1d9e7","_k":"85102a0c"},{"t":"4","fb":"Right. 2 ways to reach the centre × 2 ways onward = 4.","_n":"1e9d7","_k":"a481e903"},{"t":"6","fb":"2 ways to reach it × 2 ways onward.","_n":"1f9c7","_k":"8cb5d694"}]},{"id":"q4","goal":3,"prompt":"On a 2 × 2 grid, how many paths avoid the centre (1, 1)?","choices":[{"t":"0","fb":"6 − 4 = 2: around the edges.","_n":"1g9b7","_k":"37da7d80"},{"t":"2","fb":"Right. 6 − 4 = 2: around the edges.","_n":"1h9a7","_k":"6403cac7"},{"t":"4","fb":"6 − 4 = 2: around the edges.","_n":"1i997","_k":"12910d29"},{"t":"6","fb":"6 − 4 = 2: around the edges.","_n":"1j987","_k":"0e78f52f"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Word ↔ count","summary":"Word ↔ count","goal":[2,3],"instruction":"Match each word or grid with its number of distinct arrangements. Some counts are decoys.","leftTitle":"Word or grid","rightTitle":"Distinct arrangements","left":[{"id":"l1","t":"CANADA","goal":2,"why":"A × 3: `{6!}/{3!}` = 120.","hints":["Count each letter: C, A, N, A, D, A.","A × 3; C, N and D are single.","720 ÷ 6 = 120."]},{"id":"l2","t":"BANANA","goal":2,"why":"A × 3 and N × 2: `{6!}/{3! 2!}` = 60.","hints":["Count each letter: B, A, N, A, N, A.","A × 3, N × 2.","720 ÷ (6 × 2) = 60."]},{"id":"l3","t":"OTTAWA","goal":2,"why":"T × 2 and A × 2: `{6!}/{2! 2!}` = 180.","hints":["Count each letter: O, T, T, A, W, A.","T × 2, A × 2.","720 ÷ (2 × 2) = 180."]},{"id":"l4","t":"KAYAK","goal":2,"why":"K × 2 and A × 2: `{5!}/{2! 2!}` = 30.","hints":["Count each letter: K, A, Y, A, K.","K × 2, A × 2.","120 ÷ (2 × 2) = 30."]},{"id":"l5","t":"GEESE","goal":2,"why":"E × 3: `{5!}/{3!}` = 20.","hints":["Count each letter: G, E, E, S, E.","E × 3; G and S are single.","120 ÷ 6 = 20."]},{"id":"l6","t":"QUEBEC","goal":2,"why":"Only E repeats: `{6!}/{2!}` = 360.","hints":["Count each letter: Q, U, E, B, E, C.","E × 2; every other letter is single.","720 ÷ 2 = 360."]},{"id":"l7","t":"TORONTO","goal":2,"why":"T × 2 and O × 3: `{7!}/{2! 3!}` = 420.","hints":["Count each letter: T, O, R, O, N, T, O.","T × 2, O × 3.","5040 ÷ (2 × 6) = 420."]},{"id":"l8","t":"Grid: 4 right, 2 up","goal":3,"why":"A path is RRRRUU in some order: `{6!}/{4! 2!}` = 15.","wrong":"Count arrangements of RRRRUU.","hints":["A path is a word of R’s and U’s.","RRRRUU: R × 4, U × 2.","720 ÷ (24 × 2) = 15."]}],"right":[{"id":"r1","t":"120"},{"id":"r2","t":"60"},{"id":"r3","t":"180"},{"id":"r4","t":"30"},{"id":"r5","t":"20"},{"id":"r6","t":"360"},{"id":"r7","t":"420"},{"id":"r8","t":"15"},{"id":"r9","t":"840"},{"id":"r10","t":"8"},{"id":"r11","t":"6"}],"_a":"TBBcUEYNEUEGEBxDCAURCRVAAkNIFV8AFQgSE1cVHxFbBhJbRkUHERsQXFRGDRFBAhAcQwgBEQkVQAZDSBVfBBUIEhNTFR8RWwoSW0ZFCxFK","wrong":{"l6|r3":"Only E repeats in QUEBEC: `6!/2! = 360`. Only repeated objects create duplicates. A single letter contributes `1! = 1`.","l7|r9":"There are 2 T’s \u003cstrong>and\u003c/strong> 3 O’s: divide by both.","l8|r10":"Count arrangements of RRRRUU. A path is a sequence of moves. Count arrangements of R’s and U’s.","l8|r11":"Count arrangements of RRRRUU. A path is a sequence of moves. Count arrangements of R’s and U’s."},"wrongDefault":"List the repeated letters, then divide `6!` (or `7!`, or `5!`) by each one’s factorial."},{"id":"cond","type":"numeric","title":"Arrangements with a condition","summary":"Arrangements with a condition","goal":[2,4,5],"star":true,"instruction":"Count the arrangements. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a whole number, then press Check.","items":[{"id":"n1","goal":4,"prompt":"Arrangements of TORONTO that begin with T","_a":"BgAA","display":"120","label":"Number of arrangements:","why":"Place one T first. The other 6 letters, O, R, O, N, T, O, have only O repeated (3 times): `{6!}/{3!}` = 120.","wrong":[{"match":60,"fb":"With one T placed, the rest has only one T: `6!/3!`. After you place a letter, recount the repeats among the \u003cstrong>remaining\u003c/strong> letters."}],"hints":["Put a T first. Which letters are left?","O, R, O, N, T, O: only O repeats, 3 times.","720 ÷ 6 = 120."]},{"id":"n2","goal":4,"prompt":"Arrangements of CANADA with the three A’s together","_a":"BQY=","display":"24","label":"Number of arrangements:","why":"Glue AAA into one block. The block, C, N and D are 4 different items: `4! = 24`.","wrong":[{"match":4,"fb":"Treat AAA as one block: block, C, N, D are 4 different items: `4!`."}],"hints":["Glue the three A’s into one block.","How many items are you arranging now, and are they all different?","Block, C, N, D: `4! = 24`."]},{"id":"n3","goal":4,"star":true,"prompt":"Arrangements of OTTAWA with the two T’s \u003cstrong>not\u003c/strong> together","_a":"BgAA","display":"120","label":"Number of arrangements:","why":"All arrangements: 180. With the T’s together, the TT block, O, A, W, A give `{5!}/{2!}` = 60. 180 − 60 = 120.","wrong":[{"match":60,"fb":"That’s the number \u003cstrong>with\u003c/strong> the T’s together. Subtract it from 180."}],"hints":["Count all the arrangements, then subtract the ones with the T’s together.","All: `{6!}/{2! 2!}` = 180. Together: TT block, O, A, W, A: `{5!}/{2!}` = 60.","180 − 60 = 120."]},{"id":"n4","goal":5,"star":true,"prompt":"How many 7-digit numbers use the digits 1, 1, 1, 2, 2, 3, 3?","_a":"BQMA","display":"210","label":"Number of numbers:","why":"`{7!}/{3! × 2! × 2!}` = 5040 ÷ 24 = 210.","wrong":[{"match":5040,"fb":"Identical digits: divide by `3! × 2! × 2!`."}],"hints":["Which digits repeat, and how many times?","1 × 3, 2 × 2, 3 × 2: divide `7!` by `3! × 2! × 2!`.","5040 ÷ 24 = 210."]},{"id":"n5","goal":[3,5],"star":true,"prompt":"Shortest paths on a 5 × 3 grid that avoid the point (2, 2)","_a":"BAA=","display":"32","label":"Number of paths:","why":"All paths: 56. Through (2, 2): 6 × 4 = 24. 56 − 24 = 32.","wrong":[{"match":24,"fb":"That’s the number \u003cstrong>through\u003c/strong> (2, 2). Subtract it from 56."}],"hints":["All paths: `{8!}/{5! 3!}` = 56.","Through (2, 2): (`{4!}/{2! 2!}`) × (`{4!}/{3! 1!}`) = 6 × 4 = 24.","56 − 24 = 32."]},{"id":"n6","goal":4,"star":true,"prompt":"Arrangements of BANANA with no two A’s next to each other","_a":"BgA=","display":"12","label":"Number of arrangements:","why":"Place B, N, N first (3 ways). Then each A goes in a separate gap: there are 4 gaps and 3 A’s, so leave one gap empty (4 ways). 3 × 4 = 12.","wrong":[{"match":60,"fb":"Place B, N, N first (3 ways). Then each A goes in a separate gap: there are 4 gaps and 3 A’s, so leave one gap empty (4 ways). 3 × 4 = 12."}],"hints":["Arrange the non-A letters: B, N, N.","`3!/2! = 3` ways, which make 4 gaps: _ B _ N _ N _.","Choose which gap stays empty: 4 ways. 3 × 4 = 12."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Hattie","how":"","goal":[2,3,4],"instruction":"Hattie made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"How many distinct arrangements of BANANA?","steps":["BANANA has 6 letters.","A appears 3 times and N appears 2 times.","Arrangements = `6! - 3! - 2! = 712`."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"`6! - 3! × 2! = 708`.","why":"Subtracting doesn’t remove duplicates.","_n":"1k977","_k":"b56e6ab9"},{"t":"Step 3 is correct.","why":"712 is more than the 60 you can list.","_n":"1l967","_k":"4c47e2cb"},{"t":"Divide instead: `{6!}/{3! × 2!}` = 720 ÷ 12 = 60.","why":"Each word was counted `3! × 2!` times, so divide by `3! × 2!`.","_n":"1m957","_k":"de603d46"},{"t":"`{6!}/{3! + 2!} = 90`.","why":"Multiply the factorials, don’t add.","_n":"1n847","_k":"63c033a4"}],"hints":["How many times is each word counted among the 720?","`3! × 2! = 12` times.","720 ÷ 12 = 60."]},{"id":"e2","goal":3,"task":"Count the shortest paths on a grid 4 blocks right and 2 blocks up.","steps":["Each path has 6 moves.","It’s an arrangement of RRRRUU.","Paths = `{6!}/{4!} = 30`."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"4 × 2 = 8.","why":"A path is a sequence of moves. Count arrangements of R’s and U’s.","_n":"1o857","_k":"01b515ac"},{"t":"Divide by both repeats: `{6!}/{4! × 2!}` = 15.","why":"R repeats 4 times and U repeats twice: 720 ÷ 48 = 15.","_n":"1p827","_k":"91a5ad5f"},{"t":"Step 3 is correct.","why":"The two U’s are identical too.","_n":"1q837","_k":"30bf92b4"},{"t":"`{6!}/{4 × 2}` = 90.","why":"Use factorials, not the counts.","_n":"1r887","_k":"822bcfd4"}],"hints":["Which letters repeat in RRRRUU?","R × 4 and U × 2.","720 ÷ 48 = 15."]},{"id":"e3","goal":4,"task":"How many arrangements of TORONTO begin with O?","steps":["Put an O first.","The other 6 letters are T, R, O, N, T, O.","Arrange them: `{6!}/{3! × 2!}` = 60."],"_a":"BQ==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"Only 2 O’s remain: `{6!}/{2! × 2!}` = 180.","why":"After you place a letter, recount the repeats among the \u003cstrong>remaining\u003c/strong> letters. T × 2 and O × 2: 720 ÷ 4 = 180.","_n":"1s897","_k":"2834607f"},{"t":"Step 3 is correct.","why":"One O is already used.","_n":"1t867","_k":"913f70dc"},{"t":"`6! = 720`.","why":"The T’s and the O’s still repeat.","_n":"1u877","_k":"029afa74"},{"t":"`{7!}/{3! × 2!}` = 420.","why":"That ignores the O in front.","_n":"1v8c7","_k":"6bdb475f"}],"hints":["How many O’s are left after placing one?","Two.","720 ÷ 4 = 180."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: how much repeats shrink the count, or that grid paths are ‘words’?"},{"id":"j2","q":"In your own words, explain why we divide (not subtract) when objects are identical."},{"id":"j3","q":"Explain to a friend how to count the paths through a checkpoint on a grid."},{"id":"j4","q":"Which step still slows you down: counting the repeats, the factorial arithmetic, or the conditions? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"How many distinct arrangements of the letters of KAYAK?","options":[{"t":"30","why":"`{5!}/{2! × 2!}` = 120 ÷ 4 = 30.","_n":"1w8d7","_k":"4638e5a2"},{"t":"60","why":"Divide by `2!` for K \u003cstrong>and\u003c/strong> `2!` for A.","_n":"1x8a7","_k":"9c8cceab"},{"t":"116","why":"120 − 2 − 2 subtracts instead of dividing.","_n":"1y897","_k":"028192ca"},{"t":"120","why":"The K’s and the A’s repeat.","_n":"1z8c7","_k":"01fb84cb"}]},"b":{"prompt":"How many distinct arrangements of the letters of GEESE?","options":[{"t":"20","why":"`5!/3! = 20`.","_n":"208b7","_k":"e2182856"},{"t":"40","why":"Divide by `3! = 6`, not by 3.","_n":"21867","_k":"7a99d8f4"},{"t":"114","why":"120 − 6 subtracts instead of dividing.","_n":"22857","_k":"d89f4e1c"},{"t":"120","why":"The three E’s are identical. Swapping the identical letters gives the same word: divide by the shuffles that change nothing.","_n":"23887","_k":"12c957b8"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"How many shortest paths are there on a grid 3 blocks right and 3 blocks up?","options":[{"t":"6","why":"3 + 3 counts moves, not paths.","_n":"24877","_k":"96ccb7f8"},{"t":"9","why":"3 × 3 counts squares.","_n":"25927","_k":"a9971b2b"},{"t":"20","why":"`{6!}/{3! × 3!}` = 20.","_n":"26917","_k":"cd75df40"},{"t":"720","why":"The R’s are identical, and so are the U’s.","_n":"27107","_k":"82e9c6af"}]},"b":{"prompt":"How many shortest paths are there on a grid 2 blocks right and 4 blocks up?","options":[{"t":"6","why":"2 + 4 counts moves, not paths. A path is a sequence of moves. Count arrangements of R’s and U’s.","_n":"28117","_k":"493180ed"},{"t":"8","why":"2 × 4 counts squares. A path is a sequence of moves. Count arrangements of R’s and U’s.","_n":"29127","_k":"f64b4db7"},{"t":"15","why":"`{6!}/{2! × 4!}` = 15.","_n":"2a137","_k":"942a63b1"},{"t":"720","why":"The R’s are identical, and so are the U’s.","_n":"2b147","_k":"f8fab48a"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which expression counts the distinct arrangements of OTTAWA?","options":[{"t":"`{6!}/{2!}`","why":"A repeats too.","_n":"2c157","_k":"38cb4116"},{"t":"`{6!}/{2! × 2!}`","why":"T and A each appear twice: one factorial for each, multiplied.","_n":"2d167","_k":"51900fe5"},{"t":"`{6!}/{4!}`","why":"Use separate factorials, `2! × 2!`, not `(2 + 2)!`.","_n":"2e177","_k":"702581de"},{"t":"`6! - 2! - 2!`","why":"Each word was counted `2! × 2!` times, so divide, don’t subtract.","_n":"2f087","_k":"ec2aab3d"}]},"b":{"prompt":"Which expression counts the distinct arrangements of CANADA?","options":[{"t":"`6! - 3!`","why":"Each word was counted `3!` times, so divide, don’t subtract.","_n":"2g097","_k":"9a7b8f45"},{"t":"`{6!}/{3! × 3!}`","why":"Only A repeats; C, N and D appear once.","_n":"2h168","_k":"b1943c6f"},{"t":"`{6!}/{3!}`","why":"Only A repeats, 3 times.","_n":"2i158","_k":"a698d9de"},{"t":"`6!`","why":"The three A’s are identical. Swapping the identical letters gives the same word: divide by the shuffles that change nothing.","_n":"2j148","_k":"a143dc0b"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"How many arrangements of CANADA begin \u003cstrong>and\u003c/strong> end with A?","options":[{"t":"4","why":"The four middle letters can be ordered in `4!` ways.","_n":"2k138","_k":"4de01c79"},{"t":"12","why":"Only one A is left in the middle: no division needed.","_n":"2l1a8","_k":"d0962f94"},{"t":"24","why":"The middle letters C, N, D, A are all different: `4! = 24`.","_n":"2m198","_k":"b2e2efc6"},{"t":"120","why":"That’s every arrangement.","_n":"2n188","_k":"86b9f8a3"}]},"b":{"prompt":"How many arrangements of BANANA begin with N?","options":[{"t":"10","why":"Only one N is left: divide by `3!` only.","_n":"2o178","_k":"fd2ffb81"},{"t":"20","why":"The rest, B, A, A, A, N, gives `5!/3! = 20`.","_n":"2p0e8","_k":"3e6286d0"},{"t":"60","why":"That’s every arrangement.","_n":"2q0d8","_k":"8a4bea8b"},{"t":"120","why":"The three A’s that remain are identical: divide by `3!`.","_n":"2r169","_k":"8c3f7ebe"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"On a grid 4 right and 3 up, how many shortest paths pass through the point (2, 1)?","options":[{"t":"9","why":"3 + 6: you go to the point \u003cstrong>and then\u003c/strong> onward, so multiply.","_n":"2s159","_k":"eb5f08fc"},{"t":"17","why":"That’s the number that \u003cstrong>avoid\u003c/strong> the point.","_n":"2t189","_k":"06315962"},{"t":"18","why":"`{3!}/{2! 1!}` = 3 to get there, `{4!}/{2! 2!}` = 6 onward; 3 × 6 = 18.","_n":"2u179","_k":"f136cb07"},{"t":"35","why":"That’s every path, not just those through the point.","_n":"2v1a9","_k":"1a009425"}]},"b":{"prompt":"On the same grid, how many shortest paths avoid the point (2, 1)?","options":[{"t":"17","why":"35 − 18 = 17.","_n":"2w199","_k":"21244faf"},{"t":"18","why":"That’s the number through it.","_n":"2x1c9","_k":"953210fd"},{"t":"26","why":"Subtract the paths through the point (18), not 9.","_n":"2y1b9","_k":"ffaffd09"},{"t":"35","why":"That’s every path. Subtract the 18 through the point.","_n":"2z0e9","_k":"7f8d4d86"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"A shelf holds 3 identical math books, 2 identical French books and 1 history book. How many distinct arrangements?","options":[{"t":"6","why":"That counts the books, not their arrangements.","_n":"300d9","_k":"7d795e6a"},{"t":"60","why":"`{6!}/{3! × 2!}` = 60.","_n":"31909","_k":"ec335973"},{"t":"120","why":"Divide by `2!` for the French books too.","_n":"32919","_k":"2ffb73de"},{"t":"720","why":"The math books are identical, and so are the French books. Swapping the identical letters gives the same word: divide by the shuffles that change nothing.","_n":"338e9","_k":"a612ce34"}]},"b":{"prompt":"A flagpole displays 4 identical red flags and 2 identical blue flags in a column. How many distinct displays?","options":[{"t":"8","why":"4 × 2 doesn’t count arrangements.","_n":"348f9","_k":"0a8fa078"},{"t":"15","why":"`{6!}/{4! × 2!}` = 15.","_n":"358c9","_k":"03743dd7"},{"t":"30","why":"Divide by `2!` as well.","_n":"368d9","_k":"e09dcc58"},{"t":"720","why":"The red flags are identical, and so are the blue flags. Divide by `4! × 2!`.","_n":"378a9","_k":"b5728ef4"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why QUEBEC has `{6!}/{2!}` arrangements?","options":[{"t":"If the two E’s were different, there would be `6!` arrangements. Each word appears twice (E₁…E₂ and E₂…E₁), so divide by `2!`.","why":"Each word is counted once for each way to order the two E’s.","_n":"388b9","_k":"721b7173"},{"t":"Because E is used twice, subtract 2.","why":"Subtracting doesn’t remove duplicates: each word is counted twice, so divide by `2!`.","_n":"39989","_k":"64c8b1a0"},{"t":"Because QUEBEC has 2 vowels.","why":"Q, U, E, B, E, C has three vowels, and that isn’t the reason.","_n":"3a999","_k":"b2828ed5"},{"t":"Because `{6!}/{2!}` works for every 6-letter word.","why":"Only when exactly one letter appears twice.","_n":"3b8a9","_k":"9bf72605"}]},"b":{"prompt":"Which is the best explanation of why a grid 4 right and 2 up has `{6!}/{4! × 2!}` shortest paths?","options":[{"t":"Because you take 4 + 2 = 6 steps.","why":"That gives the length, not the count.","_n":"3c899","_k":"95eee538"},{"t":"Because the grid has 4 × 2 squares.","why":"Squares don’t count paths. A path is a sequence of moves. Count arrangements of R’s and U’s.","_n":"3d889","_k":"dbf40e6a"},{"t":"Each path is an arrangement of RRRRUU. The R’s are identical and the U’s are identical, so divide by `4!` and `2!`.","why":"A path is a word of moves with two repeated letters.","_n":"3e879","_k":"a5a4e1c3"},{"t":"Because paths can cross each other.","why":"Crossing doesn’t affect the count.","_n":"3f8e9","_k":"bf46c5f5"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which work for TORONTO is correct?","options":[{"t":"`{7!}/{3! × 2!}` = 5040 ÷ 12 = 420","why":"O × 3 and T × 2: one factorial for each repeated letter.","_n":"3g8d9","_k":"bfc8552a"},{"t":"`7! - 3! - 2!` = 5032","why":"Subtracting doesn’t remove duplicates: divide.","_n":"3h8c9","_k":"c384c15d"},{"t":"`{7!}/{5!}` = 42","why":"Use separate factorials, `3! × 2!`, not `(3 + 2)!`.","_n":"3i8b9","_k":"7620f635"},{"t":"`{7!}/{3!}` = 840","why":"Divide by `2!` for the T’s too. Divide by a separate factorial for \u003cstrong>each\u003c/strong> repeated letter.","_n":"3j929","_k":"0d8c05fd"}]},"b":{"prompt":"Which work for OTTAWA is correct?","options":[{"t":"`{6!}/{4!}` = 30","why":"Use separate factorials, `2! × 2!`, not `(2 + 2)!`.","_n":"3k919","_k":"ebe461e7"},{"t":"`6! - 4` = 716","why":"Subtracting doesn’t remove duplicates: divide by `2! × 2!`.","_n":"3l848","_k":"b2d3d029"},{"t":"`{6!}/{2! × 2!}` = 720 ÷ 4 = 180","why":"T × 2 and A × 2: one factorial for each repeated letter.","_n":"3m858","_k":"847035ce"},{"t":"`{6!}/{2!}` = 360","why":"Both T and A repeat. Divide by a separate factorial for \u003cstrong>each\u003c/strong> repeated letter.","_n":"3n868","_k":"cd65e389"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A radio station’s playlist has 7 slots: 4 identical copies of one ad and 3 different songs. How many distinct orders?","options":[{"t":"28","why":"7 × 4 isn’t an arrangement count.","_n":"3o878","_k":"7143ed71"},{"t":"35","why":"The songs are different: don’t divide by `3!`.","_n":"3p888","_k":"32cef359"},{"t":"210","why":"`7!/4! = 210`.","_n":"3q898","_k":"7d56e26e"},{"t":"5040","why":"The 4 ads are identical: divide by `4!`.","_n":"3r8a8","_k":"14865692"}]},"b":{"prompt":"A gardener plants 5 identical tulips and 2 different shrubs in a row of 7 spots. How many distinct rows?","options":[{"t":"10","why":"5 × 2 isn’t an arrangement count.","_n":"3s8b8","_k":"7d63a6d8"},{"t":"21","why":"The shrubs are different.","_n":"3t8c8","_k":"8f7997e6"},{"t":"42","why":"`7!/5! = 42`.","_n":"3u8d8","_k":"848a87fb"},{"t":"5040","why":"The 5 tulips are identical: divide by `5!`.","_n":"3v8ea","_k":"4e12354d"}]}},{"id":"a2","cat":"A","goal":[3,5],"a":{"prompt":"A courier in a grid-shaped downtown drives 5 blocks east and 3 north to a first stop, then 2 east and 2 north to a second stop, always taking a shortest route. How many routes for the whole trip?","options":[{"t":"17","why":"That isn’t a route count.","_n":"3w8da","_k":"62161405"},{"t":"62","why":"56 + 6: the legs happen one after the other, so multiply.","_n":"3x90a","_k":"5a123ca9"},{"t":"336","why":"`{8!}/{5! 3!}` = 56, then `{4!}/{2! 2!}` = 6; 56 × 6 = 336.","_n":"3y8fa","_k":"93ee079e"},{"t":"792","why":"`{12!}/{7! 5!}` counts routes that might skip the first stop.","_n":"3z8aa","_k":"0c0aec85"}]},"b":{"prompt":"A cyclist rides 3 blocks east and 2 north to a café, then 3 east and 1 north to a park. How many shortest routes?","options":[{"t":"7","why":"That isn’t a route count.","_n":"4089a","_k":"ac2e6faa"},{"t":"14","why":"Multiply the legs.","_n":"418ca","_k":"9224cc51"},{"t":"40","why":"`{5!}/{3! 2!}` = 10, then `{4!}/{3! 1!}` = 4; 10 × 4 = 40.","_n":"428ba","_k":"70b8bc5c"},{"t":"84","why":"`{9!}/{6! 3!}` ignores the café.","_n":"4396a","_k":"05009a2d"}]}}]},"task":{"title":"Design a word","summary":"Design a word","statement":"\u003cp>Build a ‘word’ from letter tiles (A–G, repeats allowed) that meets every condition. Different letter patterns count as different answers. Can you find all the patterns?\u003c/p>\u003col class=\"pi-conds\">\u003cli>The word has exactly 7 letters.\u003c/li>\u003cli>It uses exactly 3 different letters.\u003c/li>\u003cli>It has between 100 and 250 distinct arrangements.\u003c/li>\u003c/ol>","checks":["7 letters","Exactly 3 different letters","100 to 250 arrangements"],"tips":["Fill all 7 slots.","Use exactly three different letters, e.g. some A’s, some B’s and some C’s.","With three letters, the counts add to 7. Try splits like 4 + 2 + 1 and compute 5040 ÷ (`4! × 2! × 1!`)."],"explainPrompt":"Explain how the way you split the 7 letters controls the number of arrangements.","vocab":"Use the words identical, factorial and divide.","more":"Different letter patterns count as different answers. Can you find all the patterns?","after3":"The split {5, 1, 1} gives only 42: one big group divides the count the most."},"cards":[["Identical objects","`n!/(a! b! ⋯)`: one factorial per repeated kind."],["Why divide?","Each distinct arrangement appears `a! b! ⋯` times among the labelled ones."],["BANANA","`6!/(3! 2!) = 60`."],["Single letters","Contribute `1! = 1`: no division."],["Divide, don’t subtract","`6! - 3! - 2!` is wrong; `6!/(3! 2!)` is right."],["Grid paths","`R` right, `U` up: `(R + U)!/(R! U!)`."],["3 × 3 grid","`6!/(3! 3!) = 20` paths."],["Through a checkpoint","(paths to it) × (paths from it)."],["Avoid a point","All paths − paths through it."],["A condition first","Place the letter, then recount the repeats that remain."],["Keep identical letters together","Glue them into one block, then arrange."]]}};</script>
