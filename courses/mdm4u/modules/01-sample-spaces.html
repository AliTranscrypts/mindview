.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 01: hero, Outcome mapper (D1 tree, outcome table, list, value counts, D6 simulator), Part 3 stations, task */
/* radioGroup (from MHF4U 25) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* @component D1 treeDiagram styles (copy with the component) */
.d1-scroll{overflow:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.d1.bare .d1-scroll{border:0;background:transparent;overflow:visible}
.d1-box{position:relative}
.d1-svg{position:absolute;left:0;top:0}
.d1-e{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.d1-hi{fill:none;stroke:var(--hi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.d1-in{position:absolute;left:0;top:0;right:0;bottom:0}
.d1-root{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
.d1-lab{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 6px;border:1.5px solid var(--ink-2);border-radius:13px;background:var(--sheet);color:var(--ink);font:400 1rem/23px var(--font-math);text-align:center;white-space:nowrap}
.d1-lab.on{border:2px solid var(--sel-bd);background:var(--hi-soft);color:var(--ink);font-weight:600}
.d1-p{position:absolute;transform:translate(-50%,-50%);font:400 .85rem var(--font-math);color:var(--ink-2);background:var(--sheet);padding:0 2px;white-space:nowrap}
.d1-leaf{position:absolute;transform:translate(-50%,-50%);min-height:30px;min-width:32px;padding:0 .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem/27px var(--font-math);white-space:nowrap}
.d1.right .d1-leaf{transform:translate(0,-50%)}
.d1-leaf.on{background:var(--hi-soft);border:2px solid var(--sel-bd);color:var(--ink);font-weight:700}
button.d1-leaf:hover{border-color:var(--pen)}
.d1-leaf small{font-size:.8em;color:var(--ink-2)}
.d1-stage{position:absolute;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* @component outcomeTable styles */
.ot-wrap{overflow-x:auto;max-width:100%;padding:2px}
table.ot{border-collapse:separate;border-spacing:3px;margin:0 auto}
table.ot th{font:400 1.05rem var(--font-math);color:var(--ink);padding:2px 4px;text-align:center;min-width:26px}
table.ot th.ot-corner{font:700 .7rem/1.25 var(--font-ui);color:var(--ink-2);text-align:left}
.ot-corner span{display:block;white-space:nowrap}
.ot-cn{text-align:right}
.ot-c{display:block;width:100%;min-width:40px;min-height:40px;padding:2px 5px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem var(--font-math);white-space:nowrap}
table.ot.wide .ot-c{font-size:.88rem;padding:2px 3px}
.ot-c.tint{background:color-mix(in srgb,var(--pen) var(--tint),var(--sheet))}
.ot-c.on{background:var(--hi-soft);border:2px solid var(--sel-bd);color:var(--ink);font-weight:700}
.ot-c:hover{border-color:var(--pen)}
.ot-fill tbody tr{animation:otIn .45s both}
@keyframes otIn{from{opacity:0}to{opacity:1}}

/* Outcome mapper */
.ss-modes{margin-bottom:14px}
.ss-what{margin:0 0 8px}
.ss-list{display:flex;align-items:flex-start;gap:6px;font:400 1.1rem var(--font-math)}
.ss-br{font-size:1.35rem;line-height:34px;white-space:nowrap}
.ss-items,.ss-grp{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 0;min-width:0}
.ss-items.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.ss-items.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.ss-li{min-height:34px;padding:0 .55em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem var(--font-math);white-space:nowrap}
.ss-items.six .ss-li{padding:2px 2px;font-size:.9rem;white-space:normal;line-height:1.15}
.ss-items.six .ss-lv,.ss-items.four .ss-lv{display:block;white-space:nowrap}
.ss-li.on{background:var(--hi-soft);border:2px solid var(--sel-bd);color:var(--ink);font-weight:700}
button.ss-li:hover{border-color:var(--pen)}
.ss-li.g{display:inline-flex;align-items:center;border-style:dashed;font-family:var(--font-ui);font-size:.95rem}
.ss-evrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 0}
.ss-evrow label{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.ss-sel{min-height:40px;max-width:100%;padding:.3em .6em;border:1.5px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit}
.ss-taphint{margin:4px 0 0}
.ss-simrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.ss-check{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;min-height:32px}
.ss-check input{width:18px;height:18px;accent-color:var(--ink)}
.ss-vals h4{margin:0}
.ss-vlist{display:grid;gap:2px;margin:6px 0 14px}
.ss-v{display:grid;grid-template-columns:2.4em minmax(0,1fr) 2em;align-items:center;gap:8px;min-height:28px;padding:1px 6px;border:1.5px solid transparent;border-radius:6px;background:transparent;color:var(--ink);text-align:left}
.ss-v:hover{border-color:var(--rule)}
.ss-v.on{border-color:var(--sel-bd);background:var(--hi-soft)}
.ss-vv{font:600 1rem var(--font-math);text-align:right}
.ss-vb{height:12px;border-radius:3px;background:var(--paper);overflow:hidden}
.ss-vb i{display:block;height:100%;background:var(--pen);transition:width .3s}
.ss-vn{font:400 .95rem var(--font-math)}
#ss-simbox{margin-bottom:12px}
.legend i.sw.dash{height:3px;border-radius:0;background:repeating-linear-gradient(90deg,var(--dc,var(--ink-2)) 0 6px,transparent 6px 10px)}
.legend.tiny{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.ss-dc-t{margin:0 0 8px;font-size:1.05rem}
.ss-dc-set{font:400 1.1rem var(--font-math);margin:8px 0 0;min-height:1.4em}
.ss-capt{font-family:var(--font-ui);font-size:.62em}

/* hero */
.ssh{display:grid;gap:4px;justify-items:center}
.ssh-top{display:flex;align-items:center;gap:10px;min-height:48px}
.ssh-coin{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);font:700 1.25rem var(--font-math)}
.ssh-tree{width:100%;max-width:400px}
.ssh-list{opacity:0;transition:opacity .6s;text-align:center;margin-top:4px}
.ssh-list.on{opacity:1}
.ssh-items{position:relative;display:inline-flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;margin:0;font-size:1rem}
.ssh-items span{padding:.1em .5em;border:1.5px dashed var(--ink-2);border-radius:6px}
.ssh-items::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2.5px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .7s}
.ssh-list.x .ssh-items::after{transform:scaleX(1)}
.ssh-note{margin:6px 0 0;font-size:.95rem;font-weight:700;color:var(--red);opacity:0;transition:opacity .5s .5s}
.ssh-list.x .ssh-note{opacity:1}

/* Part 3 stations */
.eq-st{margin-bottom:14px}
.eq-chart{position:relative}
.eq-bars{display:flex;gap:4px}
.eq-bar{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:stretch;border:0;background:transparent;padding:0;color:var(--ink)}
.eq-tr{height:var(--eq-h,180px);display:flex;align-items:flex-end;border-bottom:1.5px solid var(--ink)}
.eq-bh{display:flex;justify-content:center;align-items:flex-start;width:100%;padding-top:2px;background:var(--pen);color:var(--sheet);border-radius:3px 3px 0 0;font:700 .8rem var(--font-ui)}
.eq-bar:hover .eq-bh{outline:2px solid var(--rule)}
.eq-bar.on .eq-bh{background:var(--hi);color:var(--hi-ink);outline:2px solid var(--ink)}
.eq-bx{font:400 .95rem var(--font-math);text-align:center;padding-top:3px;min-height:24px}
.eq-bar.on .eq-bx{font-weight:700}
.eq-eqline{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);pointer-events:none}
.eq-cap3{margin-top:10px}

/* task */
.ss-conds{margin:.4em 0 .8em;padding-left:1.4em}
.tk-in{margin:4px 0 12px}
.tk-sl{display:block;margin-bottom:6px}
.tk-c{margin:6px 0 4px}
.tk-same{margin:0 0 8px}
.tk-probs{margin-top:10px}

iv class=\"ssh-tree\" id=\"ssh-tree\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"ssh-list\" id=\"ssh-list\" aria-hidden=\"true\">\u003cp class=\"ssh-items\">\u003cspan>two heads\u003c/span>\u003cspan>one of each\u003c/span>\u003cspan>no heads\u003c/span>\u003c/p>\u003cp class=\"ssh-note\">3 results, but not equally likely\u003c/p>\u003c/div>\u003c/div>"}},"goals":["I can list a sample space using a list, a table or a tree diagram.","I can tell a discrete sample space from a continuous one.","I can calculate a theoretical probability as `n(A) ÷ n(S)` when the outcomes are equally likely.","I can use the complement: `P(A′) = 1 - P(A)`.","I can decide whether outcomes are equally likely, and fix the sample space when they aren’t."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Fractions","goal":3,"prompt":"Write `9/36` in lowest terms.","options":[{"t":"`1/4`","why":"Divide top and bottom by 9.","_n":"0e9c","_k":"a8907a66"},{"t":"`3/12`","why":"Equivalent, but divide by 3 again.","_n":"1e6c","_k":"f6e89f2f"},{"t":"`1/3`","why":"9 × 3 = 27, not 36.","_n":"2e7c","_k":"b672c2d9"},{"t":"`9/4`","why":"The part goes on top.","_n":"3e4c","_k":"5ff3ea4b"}],"hints":["What’s the largest number that divides 9 and 36?","9.","`9/36 = 1/4`."]},{"id":"w2","skill":"Fractions","goal":4,"prompt":"What is `1 - 5/12`?","options":[{"t":"`-4/12`","why":"Write 1 as `12/12` first.","_n":"4e5c","_k":"a9f51ce9"},{"t":"`5/12`","why":"That’s what you took away, not what’s left.","_n":"5e2c","_k":"d030623f"},{"t":"`7/12`","why":"`1 = 12/12`, and `12/12 - 5/12 = 7/12`.","_n":"6e3c","_k":"07041cd6"},{"t":"`12/5`","why":"Subtracting from 1 isn’t flipping.","_n":"7f0c","_k":"3567414e"}],"hints":["Write 1 with denominator 12.","`12/12 - 5/12`.","`7/12`."]},{"id":"w3","skill":"Listing systematically","goal":1,"prompt":"List every two-letter arrangement of A, B and C with no letter used twice (AB and BA are different). How many are there?","options":[{"t":"3","why":"AB and BA are different arrangements here.","_n":"8f1c","_k":"1ff95230"},{"t":"5","why":"List by first letter: 2 each.","_n":"915c","_k":"dc36fa94"},{"t":"6","why":"AB, AC, BA, BC, CA, CB.","_n":"a14c","_k":"6c7187aa"},{"t":"9","why":"AA isn’t allowed.","_n":"b17c","_k":"01663b95"}],"hints":["Fix the first letter.","A first: AB, AC. Then B first, then C first.","3 × 2 = 6."]},{"id":"w4","skill":"Listing systematically","goal":1,"prompt":"A coin is flipped and a spinner with sectors 1, 2 and 3 is spun. How many outcomes are there?","options":[{"t":"3","why":"The coin doubles the list.","_n":"c16c","_k":"6f116589"},{"t":"5","why":"Each coin result pairs with each spinner result.","_n":"d11c","_k":"2c407f61"},{"t":"6","why":"H1, H2, H3, T1, T2, T3.","_n":"e10c","_k":"ab05e80a"},{"t":"9","why":"3 × 3 would be two spinners.","_n":"f13c","_k":"b38bdf55"}],"hints":["Make a tree: coin first.","Each of H and T has 3 branches.","2 × 3 = 6."]},{"id":"w5","skill":"Probability language","goal":3,"prompt":"Which number is the probability of an event that is certain to happen?","options":[{"t":"0","why":"0 means impossible.","_n":"g12c","_k":"74ced0d1"},{"t":"`1/2`","why":"`1/2` means as likely as not.","_n":"h1dc","_k":"c6ce67b0"},{"t":"1","why":"Probabilities run from 0 (impossible) to 1 (certain).","_n":"i1cc","_k":"3b02ebd9"},{"t":"100","why":"100% is the same as 1. As a fraction or decimal, probability never exceeds 1.","_n":"ja3b","_k":"5d56b146"}],"hints":["What’s the largest a probability can be?","100% as a decimal.","1."]},{"id":"w6","skill":"Probability language","goal":5,"prompt":"A bag holds 2 blue and 6 white marbles, all the same size. Which statement is true?","options":[{"t":"\u003ci>P\u003c/i>(white) = `6/2 = 3`","why":"A probability can’t be more than 1.","_n":"ka4b","_k":"e5baf264"},{"t":"\u003ci>P\u003c/i>(blue) = `2/6`","why":"That’s blue ÷ white. Divide by all 8.","_n":"la5b","_k":"c6a81d5a"},{"t":"Drawing white is 3 times as likely as drawing blue.","why":"\u003ci>P\u003c/i>(white) = `6/8` and \u003ci>P\u003c/i>(blue) = `2/8`.","_n":"ma6b","_k":"3aacbc07"},{"t":"Blue and white are equally likely, because there are two colours.","why":"There are 8 marbles, not 2 outcomes.","_n":"n9fb","_k":"90a4631b"}],"hints":["How many marbles in total?","8.","\u003ci>P\u003c/i>(white) = `6/8`, \u003ci>P\u003c/i>(blue) = `2/8`: white is 3 times as likely."]}],"refreshers":{"Fractions":"Simplify by dividing top and bottom by their greatest common factor. To find `1 - a/b`, write 1 as `b/b`.","Listing systematically":"Fix the first stage, list every choice for the next, then move on. Count by multiplying the number of choices at each stage.","Probability language":"Probability is a number from 0 to 1. With equally likely outcomes, `P` = favourable ÷ total."}}},"explore":{"heading":"Outcome mapper","intro":"Pick an experiment and a view. Mark an event and watch its probability, then test it with the simulator.","predIntro":"Make a prediction first. Then the outcome mapper will show you what really happens.","predictions":[{"id":"p1","start":{"exp":"c3","view":"tree","reveal":0},"prompt":"Three coins, tree view. How many outcomes are in the sample space?","options":[{"t":"3","_n":"oa0b","_k":"ee344f8c"},{"t":"4","_n":"pa1b","_k":"884c9cba"},{"t":"6","_n":"qa2b","_k":"486abe1c"},{"t":"8","_n":"r9bb","_k":"305c7350"}],"explain":"Each flip doubles the number of outcomes: 2 × 2 × 2 = 8."},{"id":"p2","start":{"exp":"d2","view":"table","comb":"sum"},"prompt":"Two dice, Sum view. Which sum is most likely?","options":[{"t":"7","_n":"s9cb","_k":"db7fdc4c"},{"t":"6","_n":"ta9c","_k":"c45963e9"},{"t":"12","_n":"ua8c","_k":"14d7b5f5"},{"t":"They’re all equally likely","_n":"va7c","_k":"55f7cef1"}],"explain":"Six ordered pairs give 7: (1, 6) through (6, 1). Only one gives 12."},{"id":"p3","start":{"exp":"c2","view":"list","grouped":true},"prompt":"Two coins, and the list shows “two heads / one of each / no heads”. What is the probability of getting one head and one tail?","options":[{"t":"`1/4`","_n":"wa6c","_k":"023a8ed5"},{"t":"`1/3`","_n":"xa5c","_k":"143f1241"},{"t":"`1/2`","_n":"ya4c","_k":"eb4b1452"},{"t":"`2/3`","_n":"za3c","_k":"195b3359"}],"explain":"HT and TH are different outcomes, so “one of each” is 2 of 4 equally likely outcomes."},{"id":"p4","start":{"exp":"d2","view":"table","comb":"pairs"},"prompt":"Two dice, ordered pairs. What is the probability of rolling doubles?","options":[{"t":"`1/36`","_n":"10a2c","_k":"40a8d0ad"},{"t":"`1/12`","_n":"11a1c","_k":"ccf7599f"},{"t":"`1/11`","_n":"12a0c","_k":"4833c5d9"},{"t":"`1/6`","_n":"1397b","_k":"cf517637"}],"explain":"6 doubles out of 36 ordered pairs: `6/36 = 1/6`."}],"chalIntro":"Set up the outcome mapper, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"Two dice, tap mode: mark an event whose probability is exactly `1/4`.","why":"`9/36 = 1/4`, so any 9 cells work.","hints":["How many cells are there altogether?","`1/4` of 36 = 9.","Mark every cell where both dice are odd: 3 × 3 = 9."]},{"id":"tc2","goal":[1,3],"prompt":"Three coins: choose an event from the menu whose probability is `3/8`.","why":"Exactly one head (HTT, THT, TTH) and exactly two heads (HHT, HTH, THH) each happen 3 ways out of 8.","hints":["`3/8` means 3 of the 8 leaves.","Which head count happens 3 ways?","Exactly two heads: HHT, HTH, THH."]},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"Two dice, Product view: find a product value whose probability is exactly `1/9`.","why":"6 and 12 each appear in exactly 4 of the 36 cells: `4/36 = 1/9`.","hints":["`1/9` of 36 is how many cells?","You need a product that appears in exactly 4 cells.","6 = 1 × 6 = 6 × 1 = 2 × 3 = 3 × 2, and 12 = 2 × 6 = 6 × 2 = 3 × 4 = 4 × 3."]}]},"part3":{"slug":"equally-likely","name":"Equally likely?","heading":"Is it equally likely?","intro":"Dividing by the number of outcomes only works when the outcomes are equally likely. Visit each station: spot the outcomes that aren’t, fix the sample space, then check it with data.","quickCheck":{"title":"Quick check","summary":"Is it equally likely? quick check","items":[{"id":"q1","goal":5,"prompt":"A spinner has A = 240° and B = 120°. `P(B)`?","choices":[{"t":"`1/120`","fb":"120/360 = 1/3. Two letters doesn’t mean 1/2.","_n":"1498b","_k":"49063354"},{"t":"`1/3`","fb":"Right. 120/360 = 1/3: B covers a third of the circle.","_n":"1595b","_k":"f383d18f"},{"t":"`1/2`","fb":"120/360 = 1/3. Two letters doesn’t mean 1/2.","_n":"1696b","_k":"4d78be34"},{"t":"`2/3`","fb":"120/360 = 1/3. Two letters doesn’t mean 1/2.","_n":"1793b","_k":"4a5c152c"}]},{"id":"q2","goal":3,"prompt":"Two coins. \u003ci>P\u003c/i>(no heads)?","choices":[{"t":"0","fb":"Only TT, out of HH, HT, TH, TT.","_n":"1894b","_k":"b7d79e9c"},{"t":"`1/4`","fb":"Right. Only TT has no heads: 1 of the 4 equally likely outcomes.","_n":"1991b","_k":"9b750e97"},{"t":"`1/3`","fb":"Only TT, out of HH, HT, TH, TT.","_n":"1a92b","_k":"48a014e3"},{"t":"`1/2`","fb":"Only TT, out of HH, HT, TH, TT.","_n":"1b9fb","_k":"96404c88"}]},{"id":"q3","goal":5,"prompt":"Which sample space is equally likely?","choices":[{"t":"“Win” and “lose” for a raffle ticket","fb":"The others are events with different numbers of underlying outcomes.","_n":"1ca0b","_k":"acc92c77"},{"t":"The head counts 0–3 in three flips","fb":"The others are events with different numbers of underlying outcomes.","_n":"1d9db","_k":"1ed7d600"},{"t":"The 6 faces of a fair die","fb":"Right. Each face of a fair die has probability 1/6.","_n":"1e9cb","_k":"0737876d"},{"t":"The sums 2–12 of two dice","fb":"The others are events with different numbers of underlying outcomes.","_n":"1f9fb","_k":"e016ed34"}]},{"id":"q4","goal":5,"prompt":"In 600 spins, A came up 296 times. Best statement?","choices":[{"t":"`296/600 ≈ 0.49` is close to the theoretical `1/2`","fb":"Right. Random results vary, and 0.49 is close to 0.5.","_n":"1g9eb","_k":"1cf9eabd"},{"t":"`P(A) = 296`","fb":"Random results vary. A small gap from 300 is expected. A probability is a number from 0 to 1.","_n":"1ha1b","_k":"f69fbb1d"},{"t":"The spinner is unfair because 296 ≠ 300","fb":"Random results vary. A small gap from 300 is expected.","_n":"1ia0b","_k":"4fbeda01"},{"t":"The next spin is more likely to be A","fb":"Random results vary. A small gap from 300 is expected, and a run of results never changes the next spin’s probability.","_n":"1ja3b","_k":"4fe7cd09"}]}]}},"practice":{"activities":[{"id":"count","type":"numeric","title":"How many outcomes?","summary":"How many outcomes?","goal":1,"instruction":"Find the number of outcomes in each sample space.","how":"Type a whole number, then press Check.","items":[{"id":"n1","prompt":"Three coins","label":"`n(S)` =","keypad":"decimal","_a":"Dw==","display":"8 outcomes","why":"2 × 2 × 2 = 8.","wrong":[{"match":6,"fb":"Each flip doubles: 2 × 2 × 2."}],"hints":["Make a tree: each coin splits every branch in two.","2 × 2 × 2.","8 outcomes: HHH, HHT, HTH, HTT, THH, THT, TTH, TTT."]},{"id":"n2","prompt":"A die and a coin","label":"`n(S)` =","_a":"BgI=","display":"12 outcomes","why":"6 × 2 = 12.","wrong":[{"match":8,"fb":"6 × 2, not 6 + 2."}],"hints":["Each die result pairs with each coin result.","6 die results × 2 coin results.","6 × 2 = 12."]},{"id":"n3","prompt":"Two dice","label":"`n(S)` =","_a":"BAY=","display":"36 ordered pairs","why":"6 × 6 = 36 ordered pairs.","wrong":[{"match":12,"fb":"Each of the 6 results on die 1 pairs with each of the 6 results on die 2: 6 × 6 = 36, not 6 + 6."},{"match":21,"fb":"21 counts unordered pairs; (2, 5) and (5, 2) differ."}],"hints":["Make a 6 by 6 table.","Each row has 6 cells.","36."]},{"id":"n4","prompt":"A 4-sector spinner spun twice","label":"`n(S)` =","_a":"BgY=","display":"16 outcomes","why":"4 × 4 = 16.","wrong":[{"match":8,"fb":"Each of the 4 results on the first spin pairs with each of the 4 results on the second: 4 × 4 = 16, not 4 + 4."}],"hints":["List spin 1 down the side and spin 2 across the top.","Each of the 4 rows has 4 cells.","4 × 4 = 16."]},{"id":"n5","prompt":"Two-digit codes from the digits 1, 2, 3, repeats allowed","label":"`n(S)` =","_a":"Dg==","display":"9 codes","why":"3 × 3 = 9.","wrong":[{"match":6,"fb":"11, 22 and 33 are allowed."}],"hints":["The first digit has 3 choices. How many does the second digit have?","Repeats are allowed, so the second digit also has 3 choices.","3 × 3 = 9: 11, 12, 13, 21, 22, 23, 31, 32, 33."]},{"id":"n6","prompt":"Two-digit codes from the digits 1, 2, 3, no repeats","label":"`n(S)` =","_a":"AQ==","display":"6 codes","why":"3 × 2 = 6.","wrong":[{"match":9,"fb":"No repeats removes 11, 22, 33."}],"hints":["Start from the 9 codes with repeats allowed.","Remove 11, 22 and 33.","9 − 3 = 6: 12, 13, 21, 23, 31, 32."]},{"id":"n7","prompt":"Two 4-sided dice (1–4): how many \u003cstrong>different sums\u003c/strong>?","label":"Different sums:","_a":"AA==","display":"7 different sums","why":"The sums run from 2 to 8: 7 different sums, made from 16 equally likely ordered pairs.","wrong":[{"match":16,"fb":"16 ordered pairs, but the sums are only 2 to 8."}],"hints":["What’s the smallest sum? The largest?","2 and 8.","2, 3, 4, 5, 6, 7, 8: 7 sums."]},{"id":"n8","prompt":"A coin flipped 4 times","label":"`n(S)` =","_a":"BgY=","display":"16 outcomes","why":"2 × 2 × 2 × 2 = 2⁴ = 16.","wrong":[{"match":8,"fb":"Four doublings: 2⁴."}],"hints":["Each flip doubles the number of outcomes.","2 × 2 × 2 × 2.","2⁴ = 16."]}]},{"id":"prob","type":"numeric","title":"Find the probability","summary":"Find the probability","star":true,"goal":[3,4,5],"instruction":"Find each probability. Give a fraction in lowest terms or a decimal to 4 places.","how":"Type a fraction such as 5/12 (an equivalent fraction is fine) or a decimal to 4 places, then press Check.","items":[{"id":"r1","goal":5,"prompt":"Two dice: \u003ci>P\u003c/i>(the sum is prime)","_a":"Bx4BUw8AVwEBBgNUDwBXAQEH","tol":0.00005,"display":"`5/12`","why":"The prime sums 2, 3, 5, 7 and 11 happen 1 + 2 + 4 + 6 + 2 = 15 ways: `15/36 = 5/12`.","wrong":[{"match":0.45454545454545453,"fb":"Five prime sums, but not equally likely: 1 + 2 + 4 + 6 + 2 = 15 of 36."}],"hints":["Which sums are prime?","2, 3, 5, 7 and 11. In the 6 × 6 table they fill 1, 2, 4, 6 and 2 cells.","1 + 2 + 4 + 6 + 2 = 15, so `15/36 = 5/12`."]},{"id":"r2","goal":4,"prompt":"Two dice: \u003ci>P\u003c/i>(the product is even)","_a":"Bx4CVw==","tol":0.00005,"display":"`3/4`","why":"The product is odd only when both dice are odd (9 cells), so \u003ci>P\u003c/i>(even) = `1 - 9/36 = 27/36 = 3/4`.","wrong":[{"match":0.5,"fb":"The product is odd only when both dice are odd: 9 of 36. So even is 27/36."}],"hints":["When is a product odd?","Only when both dice are odd: 3 × 3 = 9 cells. Use the complement.","`1 - 9/36 = 27/36 = 3/4`."]},{"id":"r3","goal":3,"star":true,"prompt":"Two dice: \u003ci>P\u003c/i>(the larger number is 4)","_a":"Bx4EWw0CVQMDBAFWDQJVAwMEAA==","tol":0.00005,"display":"`7/36`","why":"Seven pairs have a 4 and nothing bigger: (4, 1), (4, 2), (4, 3), (4, 4), (1, 4), (2, 4), (3, 4).","wrong":[{"match":0.16666666666666666,"fb":"Count pairs with a 4 and nothing bigger: (4, 1), (4, 2), (4, 3), (4, 4), (1, 4), (2, 4), (3, 4)."}],"hints":["The larger number is 4 when one die shows 4 and the other shows 4 or less.","In the 6 × 6 table, look along row 4 and down column 4, up to 4.","(4, 1), (4, 2), (4, 3), (4, 4), (1, 4), (2, 4), (3, 4): `7/36`."]},{"id":"r4","goal":3,"star":true,"prompt":"A die is rolled twice: \u003ci>P\u003c/i>(the second roll is greater than the first)","_a":"Bx4BUw8AVwEBBgNUDwBXAQEH","tol":0.00005,"display":"`5/12`","why":"Ties (doubles) take 6 of the 36 cells, and the other 30 split evenly above and below the diagonal: `15/36 = 5/12`.","wrong":[{"match":0.5,"fb":"Ties (doubles) take 6 of the 36 cells. The other 30 split evenly: 15/36."}],"hints":["Use the 6 × 6 table.","Cells above the diagonal vs below.","(36 − 6) ÷ 2 = 15, so `15/36 = 5/12`."]},{"id":"r5","goal":5,"star":true,"prompt":"The spinner A = 180°, B = 120°, C = 60° is spun twice: \u003ci>P\u003c/i>(the same letter both times)","_a":"Bx4GWgEOWQ8PCA1aAQ5ZDw8J","tol":0.00005,"display":"`7/18`","why":"With six equal parts A, A, A, B, B, C, two spins give 36 equally likely pairs, and 9 + 4 + 1 = 14 of them match: `14/36 = 7/18`.","wrong":[{"match":0.3333333333333333,"fb":"Split into 6 equal parts (A, A, A, B, B, C). Same letter: 3² + 2² + 1² = 14 of 36."}],"hints":["Make the spinner equally likely first.","Six equal parts: A, A, A, B, B, C; spinning twice gives 6 × 6 = 36 equally likely pairs.","AA: 9, BB: 4, CC: 1. `14/36 = 7/18`."]},{"id":"r6","goal":3,"star":true,"prompt":"Three coins: \u003ci>P\u003c/i>(more heads than tails)","_a":"Bx4A","tol":0.00005,"display":"`1/2`","why":"More heads means 2 or 3 heads: 3 + 1 = 4 of the 8 outcomes.","wrong":[{"match":0.375,"fb":"More heads means 2 or 3 heads: 3 + 1 = 4 of 8."}],"hints":["With 3 coins, more heads than tails means 2 or 3 heads.","Exactly two heads: 3 ways. Exactly three heads: 1 way.","3 + 1 = 4 of 8, so `4/8 = 1/2`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Aarav","how":"","goal":[3,5],"instruction":"Aarav made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":5,"task":"Two dice are rolled. Find \u003ci>P\u003c/i>(the sum is 9).","steps":["The possible sums are 2, 3, 4, …, 12.","That’s 11 possible sums.","Each sum is equally likely, so `P(9) = 1/11`.","So \u003ci>P\u003c/i>(sum is 9) ≈ 0.09."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct: there are 11 different sums.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Use `9 ÷ 12`, since 12 is the largest sum.","why":"The sum isn’t a fraction of the maximum.","_n":"1ka2b","_k":"02a362cd"},{"t":"Use the 36 equally likely ordered pairs: (3, 6), (4, 5), (5, 4), (6, 3) give `4/36 = 1/9`.","why":"The sums aren’t equally likely, so count ordered pairs instead: 4 of the 36.","_n":"1l95b","_k":"581bf1ea"},{"t":"Step 3 is correct.","why":"Sums aren’t equally likely: 7 happens 6 ways, 12 only once.","_n":"1m94b","_k":"19db6219"},{"t":"There are 2 ways to get 9, so `2/36`.","why":"That treats (3, 6) and (6, 3) as one. The two dice are different dice, so they’re two different outcomes.","_n":"1n0bb","_k":"75a174cf"}],"hints":["Are all 11 sums equally likely?","No: count ordered pairs.","`4/36 = 1/9`."]},{"id":"e2","goal":3,"task":"Two coins are flipped. Find \u003ci>P\u003c/i>(at least one head).","steps":["The outcomes are two heads, one head, no heads.","Two of the three outcomes have at least one head.","So \u003ci>P\u003c/i>(at least one head) = `2/3`."],"_a":"Bw==","stepFb":["","Step 2 counts step 1’s list correctly. The list is the problem.","Step 3 follows. Look earlier."],"fixes":[{"t":"List the equally likely outcomes HH, HT, TH, TT: 3 of 4 have a head, so `3/4`.","why":"“One head” happens two ways, HT and TH, so the equally likely list has 4 outcomes.","_n":"1o0cb","_k":"dec55b64"},{"t":"Use `1/4`, for HH.","why":"“At least one” includes HT and TH.","_n":"1p0db","_k":"20b399a7"},{"t":"Use `1/2 + 1/2 = 1`.","why":"Adding the two coins’ probabilities gives 1, which would mean certain: TT is possible.","_n":"1q0eb","_k":"2073ec6f"},{"t":"Step 1 is correct.","why":"“One head” happens two ways: HT and TH.","_n":"1r0fb","_k":"b5e32237"}],"hints":["Is “one head” one outcome or two?","HT and TH.","`3/4`, or `1 -` \u003ci>P\u003c/i>(TT) `= 1 - 1/4`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which prediction surprised you most: the most likely sum, or one head and one tail being `1/2`?"},{"id":"j2","q":"In your own words, why can’t you divide by 11 to find the probability of a sum of two dice?"},{"id":"j3","q":"Explain to a friend how to build the sample space for a coin and a die, and how big it is."},{"id":"j4","q":"When would you choose a tree over a table? Which one will you practise more?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"How many outcomes are in the sample space for rolling a die and flipping a coin?","options":[{"t":"6","why":"That ignores the coin.","_n":"1s10b","_k":"3336a797"},{"t":"8","why":"6 + 2 adds the stages; each die result pairs with each coin result.","_n":"1t11b","_k":"c9f3e1d9"},{"t":"12","why":"6 × 2.","_n":"1u12b","_k":"24cb127c"},{"t":"36","why":"That’s two dice.","_n":"1v13b","_k":"1a77afa5"}]},"b":{"prompt":"A spinner with 5 equal sectors is spun and a coin is flipped. How many outcomes?","options":[{"t":"5","why":"That ignores the coin.","_n":"1w14b","_k":"6783d0bf"},{"t":"7","why":"5 + 2 adds the stages; each spinner result pairs with each coin result.","_n":"1x11b","_k":"1cf9ce9d"},{"t":"10","why":"5 × 2.","_n":"1y10b","_k":"5ab6db8e"},{"t":"25","why":"That’s two spinners.","_n":"1z0fb","_k":"7c95a2df"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"A bag holds 3 blue, 5 white and 2 black marbles. One is drawn at random. What is \u003ci>P\u003c/i>(white)?","options":[{"t":"`1/10`","why":"That’s the chance of one particular marble.","_n":"200eb","_k":"336cae27"},{"t":"`1/3`","why":"Three colours aren’t three equally likely outcomes.","_n":"2115b","_k":"ea980389"},{"t":"`1/2`","why":"5 white out of 10 marbles.","_n":"2214b","_k":"c18f3018"},{"t":"1","why":"5 ÷ 5 is white ÷ not white.","_n":"2313b","_k":"3e4a04d9"}]},"b":{"prompt":"A bag holds 2 green, 5 yellow and 3 purple marbles. What is \u003ci>P\u003c/i>(purple)?","options":[{"t":"`1/10`","why":"That’s one particular marble.","_n":"2412b","_k":"c28ca6c7"},{"t":"`3/10`","why":"3 purple out of 10.","_n":"2519b","_k":"57989fd6"},{"t":"`1/3`","why":"Three colours aren’t three equally likely outcomes: there are 10 marbles.","_n":"2618b","_k":"2110f3eb"},{"t":"`3/7`","why":"3 ÷ 7 is purple ÷ not purple.","_n":"271fd","_k":"f4452856"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which experiment has a \u003cstrong>continuous\u003c/strong> sample space?","options":[{"t":"Counting the students absent today","why":"Students are counted: 0, 1, 2, … Times and lengths are the ones that take any value in a range.","_n":"2820d","_k":"ba17393a"},{"t":"Rolling a die","why":"Six countable faces.","_n":"291dd","_k":"263c3d5e"},{"t":"Timing how long a runner takes to finish 100 m","why":"Time can take any value in a range.","_n":"2a1ed","_k":"d13feefc"},{"t":"Counting the goals in a hockey game","why":"Goals are counted: 0, 1, 2, …","_n":"2b23d","_k":"d020a7b3"}]},"b":{"prompt":"Which experiment has a \u003cstrong>discrete\u003c/strong> sample space?","options":[{"t":"Counting the red cars that pass in an hour","why":"Cars are counted.","_n":"2c24d","_k":"35f5fd0e"},{"t":"Timing a phone call","why":"Time is continuous.","_n":"2d21d","_k":"0bba0577"},{"t":"Measuring the temperature at noon","why":"Temperature is continuous.","_n":"2e22d","_k":"00a4f901"},{"t":"Measuring the mass of an apple","why":"Mass can take any value.","_n":"2f17d","_k":"42e4f6da"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Two dice are rolled. What is \u003ci>P\u003c/i>(the sum is 10 or more)?","options":[{"t":"`1/12`","why":"That’s only a sum of 10.","_n":"2g18d","_k":"8568b8c0"},{"t":"`1/9`","why":"Unordered pairs {4, 6}, {5, 5}, {5, 6}, {6, 6} miss (6, 4) and (6, 5).","_n":"2h25d","_k":"292a9107"},{"t":"`1/6`","why":"Sums 10, 11, 12 happen 3 + 2 + 1 = 6 ways out of 36.","_n":"2i24d","_k":"ed27f348"},{"t":"`3/11`","why":"Three of the 11 sums, but sums aren’t equally likely.","_n":"2j27d","_k":"f6074fdf"}]},"b":{"prompt":"Two dice are rolled. What is \u003ci>P\u003c/i>(the sum is 4 or less)?","options":[{"t":"`1/12`","why":"That’s only a sum of 4.","_n":"2k26d","_k":"969fdc3b"},{"t":"`1/9`","why":"Unordered pairs miss (2, 1) and (3, 1).","_n":"2l21d","_k":"475831af"},{"t":"`1/6`","why":"Sums 2, 3, 4 happen 1 + 2 + 3 = 6 ways out of 36.","_n":"2m20d","_k":"9cd32e08"},{"t":"`3/11`","why":"Three of the 11 sums, but sums aren’t equally likely.","_n":"2n23d","_k":"a0a00b87"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Three coins are flipped. What is \u003ci>P\u003c/i>(at least one tail)?","options":[{"t":"`3/8`","why":"That’s exactly one tail.","_n":"2o22d","_k":"d2b9d39b"},{"t":"`1/2`","why":"Only one outcome, HHH, has no tail.","_n":"2p1dd","_k":"c1d1ced3"},{"t":"`3/4`","why":"Three of the four tail counts (1, 2, 3 of 0–3), but tail counts aren’t equally likely.","_n":"2q1cd","_k":"f775ad49"},{"t":"`7/8`","why":"1 − \u003ci>P\u003c/i>(HHH) = `1 - 1/8`.","_n":"2r84b","_k":"dd95279b"}]},"b":{"prompt":"Four coins are flipped. What is \u003ci>P\u003c/i>(at least one head)?","options":[{"t":"`1/4`","why":"`4/16` is exactly one head.","_n":"2s83b","_k":"2d2768f6"},{"t":"`1/2`","why":"Only TTTT has no head.","_n":"2t82b","_k":"e0c43a18"},{"t":"`4/5`","why":"Head counts 0–4 aren’t equally likely.","_n":"2u81b","_k":"cf09998a"},{"t":"`15/16`","why":"1 − \u003ci>P\u003c/i>(TTTT) = `1 - 1/16`.","_n":"2v80b","_k":"399c80db"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Two dice are rolled and the numbers are multiplied. What is \u003ci>P\u003c/i>(the product is 12)?","options":[{"t":"`1/36`","why":"There’s more than one way to make 12.","_n":"2w7fb","_k":"44dc877e"},{"t":"`1/18`","why":"Two unordered pairs, but each happens two ways.","_n":"2x7eb","_k":"2ec0651e"},{"t":"`1/12`","why":"That misses one of the four ordered pairs.","_n":"2y7db","_k":"52ca2fc6"},{"t":"`1/9`","why":"(2, 6), (6, 2), (3, 4), (4, 3): 4 of 36.","_n":"2z7cb","_k":"844e4b99"}]},"b":{"prompt":"Two dice are rolled and the numbers are multiplied. What is \u003ci>P\u003c/i>(the product is 4)?","options":[{"t":"`1/36`","why":"There’s more than one way to make 4.","_n":"307bb","_k":"3a5e8e86"},{"t":"`1/18`","why":"Unordered {1, 4} and {2, 2} miss (4, 1).","_n":"31feb","_k":"77eaa54f"},{"t":"`1/12`","why":"(1, 4), (4, 1), (2, 2): 3 of 36.","_n":"32ffb","_k":"1ef62698"},{"t":"`1/9`","why":"(2, 2) can only happen one way, not two.","_n":"3300b","_k":"e8997bf6"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why \u003ci>P\u003c/i>(sum = 7) for two dice isn’t `1/11`?","options":[{"t":"Because dice are random, so you can’t calculate it.","why":"You can, using the 36 ordered pairs.","_n":"3401b","_k":"98073908"},{"t":"The 11 sums aren’t equally likely. There are 36 equally likely ordered pairs, and 6 of them give 7, so `P = 1/6`.","why":"It names the problem and fixes it: count the 36 equally likely ordered pairs.","_n":"35fab","_k":"29158a34"},{"t":"It is `1/11`, since 7 is one of 11 sums.","why":"There are 11 sums, but they aren’t equally likely. Count the 36 equally likely ordered pairs instead.","_n":"36fbb","_k":"e3c1459b"},{"t":"Because 7 is odd.","why":"Oddness has nothing to do with it.","_n":"37fcb","_k":"c1c7a917"}]},"b":{"prompt":"Which is the best explanation of why \u003ci>P\u003c/i>(one head and one tail) for two coins isn’t `1/3`?","options":[{"t":"Because there are 2 coins, the answer is `1/2` for everything.","why":"\u003ci>P\u003c/i>(two heads) is `1/4`.","_n":"38fdb","_k":"d0b60ea3"},{"t":"Because coins can land on their edge.","why":"That isn’t the issue.","_n":"39f6b","_k":"77321b70"},{"t":"It is `1/3`: two heads, one of each, no heads.","why":"The first coin and the second coin are different coins. HT and TH are two different outcomes.","_n":"3af7b","_k":"4b4daf5d"},{"t":"HT and TH are different equally likely outcomes, so “one of each” is 2 of the 4 outcomes: `1/2`.","why":"It explains why the three-result list fails: “one of each” happens two ways.","_n":"3b70c","_k":"dcde5f52"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which representation shows every outcome of flipping a coin and then rolling a die most clearly?","options":[{"t":"A number line from 1 to 6","why":"It leaves out the coin.","_n":"3c6fc","_k":"28d89865"},{"t":"A tree with 2 first branches, each splitting into 6 (12 leaves)","why":"Every coin result branches into every die result: 2 × 6 = 12 outcomes, none missed and none counted twice.","_n":"3d72c","_k":"170da802"},{"t":"A Venn diagram with “heads” and “even” circles","why":"That shows events, not the full sample space.","_n":"3e71c","_k":"b788472b"},{"t":"A list of 8 results: H, T, 1, 2, 3, 4, 5, 6","why":"That lists stage results, not outcomes.","_n":"3f6cc","_k":"4978cf31"}]},"b":{"prompt":"Which representation best organizes the outcomes of spinning two 4-sector spinners?","options":[{"t":"A single list of 4 numbers","why":"That’s one spinner.","_n":"3g6bc","_k":"a74039cd"},{"t":"A list of 8 results: 1, 2, 3, 4, 1, 2, 3, 4","why":"That lists each spinner’s results, not outcomes. Each result on spinner 1 pairs with each result on spinner 2: 4 × 4 = 16, not 4 + 4.","_n":"3h6ec","_k":"cfb983b9"},{"t":"A 4 × 4 table with spinner 1 down the side and spinner 2 across the top (16 cells)","why":"Each cell is one ordered pair, so all 16 equally likely outcomes appear exactly once.","_n":"3i6dc","_k":"6a09fd6a"},{"t":"A table of the 7 possible sums","why":"Sums aren’t equally likely outcomes.","_n":"3j78c","_k":"533001d5"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"A video game’s reward wheel has three sectors: coins 160°, gem 80°, key 120°. What is \u003ci>P\u003c/i>(gem) on one spin?","options":[{"t":"`2/9`","why":"80/360 = 2/9.","_n":"3k77c","_k":"c16078ec"},{"t":"`2/7`","why":"80/280 compares the gem with the other sectors, not the whole wheel.","_n":"3l6ac","_k":"90cde3e9"},{"t":"`1/3`","why":"Three rewards, but the sectors aren’t equal.","_n":"3m6bc","_k":"763f8623"},{"t":"`7/9`","why":"That’s the probability of \u003cstrong>not\u003c/strong> getting the gem.","_n":"3n68c","_k":"4f574086"}]},"b":{"prompt":"A reward wheel has coins 200°, gem 100°, key 60°. What is \u003ci>P\u003c/i>(key)?","options":[{"t":"`1/6`","why":"60/360 = 1/6.","_n":"3o69c","_k":"5a3961e5"},{"t":"`1/5`","why":"60/300 compares with the other sectors only.","_n":"3p6ec","_k":"af2de4d1"},{"t":"`1/3`","why":"Three rewards, but the sectors aren’t equal.","_n":"3q6fc","_k":"df287023"},{"t":"`5/6`","why":"That’s not the key: it’s the probability of \u003cstrong>not\u003c/strong> getting the key.","_n":"3r6cc","_k":"fbbafbb5"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A school raffle sells 300 tickets, and one is drawn as the winner. You bought 6. What is \u003ci>P\u003c/i>(you win)?","options":[{"t":"`1/300`","why":"That’s for one ticket.","_n":"3s6dc","_k":"569deaa3"},{"t":"`1/50`","why":"6/300.","_n":"3t72c","_k":"8ffba232"},{"t":"`1/49`","why":"6/294 is your tickets ÷ everyone else’s.","_n":"3u73c","_k":"5e9236ed"},{"t":"`1/6`","why":"Having 6 tickets doesn’t mean a 1 in 6 chance.","_n":"3vecb","_k":"edfbc407"}]},"b":{"prompt":"A raffle sells 240 tickets, one winner. You bought 8. What is \u003ci>P\u003c/i>(you win)?","options":[{"t":"`1/240`","why":"That’s for one ticket.","_n":"3webb","_k":"e5496b2b"},{"t":"`1/30`","why":"8/240.","_n":"3xeab","_k":"8c51002c"},{"t":"`1/29`","why":"8/232 is yours ÷ everyone else’s.","_n":"3ye9b","_k":"9c0360b6"},{"t":"`1/8`","why":"8 tickets doesn’t mean 1 in 8.","_n":"3zf0b","_k":"18d41b25"}]}}]},"task":{"title":"Twenty-four sectors","summary":"Twenty-four sectors","statement":"\u003cp>A spinner has 24 equal sectors. Label each A, B or C so that every condition holds. Can you find all the answers?\u003c/p>\u003col class=\"ss-conds\">\u003cli>Every letter appears at least once.\u003c/li>\u003cli>A is exactly twice as likely as B.\u003c/li>\u003cli>`P(C)` is at least `1/4`.\u003c/li>\u003cli>If the spinner is spun twice, the two spins show the same letter at most half the time.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Set `a`, the number of A sectors, and `b`, the number of B sectors. The rest, `c = 24 - a - b`, are C.\u003c/p>","checks":["Every letter appears","A is twice as likely as B","`P(C) ≥ 1/4`","Same letter at most half the time"],"tips":["Each letter needs at least one sector.","`P(A) = a/24` and `P(B) = b/24`, so you need `a = 2b`.","`1/4` of 24 sectors is 6.","Spinning twice gives 24 × 24 = 576 equally likely pairs. Same-letter pairs number `a^2 + b^2 + c^2`; you need at most 288. A big `c` makes this too large."],"explainPrompt":"Explain how you used equally likely sectors to turn each condition into a statement about `a`, `b` and `c`.","vocab":"Use the words sample space, equally likely, outcome and probability.","more":"There’s more than one answer. Can you find them all?","afterAll":"With `a = 2b`, `c = 24 - 3b`. Condition 3 caps `b` at 6, and condition 4 rules out `b = 1` and `b = 2`, where C takes too many sectors and repeats too often."},"cards":[["Sample space `S`","The set of all possible outcomes. Two coins: {HH, HT, TH, TT}."],["Event","A set of outcomes, a subset of `S`. “At least one head” = {HH, HT, TH}."],["Theoretical probability","`P(A) = n(A) ÷ n(S)`, only when outcomes are equally likely."],["Range of a probability","0 (impossible) to 1 (certain)."],["Complement `A′`","Everything not in `A`. `P(A′) = 1 - P(A)`."],["Sum of all probabilities","The probabilities of all outcomes in `S` add to 1."],["Ordered outcomes","(2, 5) and (5, 2) are different outcomes for two dice."],["Two dice","36 equally likely ordered pairs. Sum 7 is most likely: `6/36`."],["Not equally likely","Sums, head counts, colours and unequal sectors: go back to equally likely outcomes."],["Discrete","Outcomes can be counted: goals, heads, cars."],["Continuous","Any value in a range: time, mass, length. Described with an interval."]]}};</script>
