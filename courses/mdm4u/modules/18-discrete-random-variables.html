.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 18: hero, Variable builder (D7 histogram, outcome grid, custom table, compare), Part 3 stations, probEntry, task.
   Histogram bars are --pen (course plan §3); simulated bars are outlined; the probe uses --hi-soft. */
/* radioGroup (from MDM4U 15) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 02) */
.dr-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.dr-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.dr-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.dr-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.dr-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}

/* @component outcomeTable styles (grid version) */
.ot-wrap{overflow-x:auto;max-width:100%;padding:2px}
table.ot{border-collapse:separate;border-spacing:3px;margin:0 auto}
table.ot th{font:400 1rem var(--font-math);color:var(--ink);padding:2px 4px;text-align:center;min-width:22px}
table.ot th.ot-corner{font:700 .68rem/1.25 var(--font-ui);color:var(--ink-2);text-align:left}
.ot-corner span{display:block;white-space:nowrap}
.ot-cn{text-align:right}
.dr-c{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:40px;min-height:40px;padding:2px 4px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);line-height:1.05}
.dr-c.tint{background:color-mix(in srgb,var(--pen) var(--tint),var(--sheet))}
.dr-c.dr-has{border-color:var(--pen)}
.dr-c:hover{border-color:var(--pen)}
.dr-cv{font:700 1.05rem var(--font-math)}
.dr-cp{font:400 .7rem var(--font-ui);color:var(--ink-2);white-space:nowrap}
.dr-c.dr-has .dr-cp{color:var(--ink)}
table.ot.coins .dr-c,table.ot.spin .dr-c,table.ot.bag .dr-c{min-width:64px}
table.ot.coins .dr-cp,table.ot.spin .dr-cp,table.ot.bag .dr-cp{font-size:.82rem}

/* hero */
.dr-heq{display:inline;line-height:1.45;font-size:.8em}
.dr-har{color:var(--ink-2);padding:0 .15em}

/* Variable builder */
.dr-top{display:flex;flex-direction:column;gap:0;margin-bottom:6px}
canvas.plot.dr-plot{aspect-ratio:16/10}
.dr-cap{font-size:clamp(1.15rem,2.6vw,1.5rem)}
.dr-cap.long{font-size:clamp(1rem,2.2vw,1.25rem)}
.dr-gridbox{margin-top:12px}
.dr-gl{margin:0 0 6px}
.dr-ed,.dr-simbox{margin-top:12px}
.dr-aha{margin:12px 0 0;font-size:.95rem}
.dr-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.dr-sh{margin:0 0 6px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.dr-panel .slider{margin:0 0 8px}
.dr-msg{min-height:1.2em;margin:6px 0 0}
.dr-warn{font-weight:700;color:var(--ink)}
.dr-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}
.dr-tbl{margin-top:12px}
.dr-tbl-m{display:none}
.dr-conds{margin:6px 0 0;padding-left:1.3em}
.dr-conds li{margin:2px 0}
.dr-step{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0}
.dr-stl{min-width:4.2em;font-weight:700}
.dr-sv{min-width:3em;text-align:center;font:700 1.1rem var(--font-math)}
.dr-ktab{margin:6px 0 4px}
.dr-edh{margin:4px 0 8px}
.dr-rows{display:grid;gap:6px}
.dr-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.dr-row label{display:inline-flex;align-items:center;gap:6px}
.dr-row .numin{width:5.2rem}
.dr-row .dr-xin{width:4.2rem}

/* Part 3 stations */
.cs-tabs{margin-bottom:6px}
.cs-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.cs-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.cs-text{margin:0 0 10px}
.cs-read{margin-top:8px}
.cs-after{margin:10px 0 0}
.cs-dice h4{margin:0}
canvas.plot.cs-dplot{aspect-ratio:4/3}
canvas.plot.cs-s3{aspect-ratio:16/10;max-width:560px}
.cs-tick{font-weight:700}

/* probEntry */
.pe-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pe-lab{display:inline-flex;align-items:center;gap:8px}

/* task */
.dt-in{margin:10px 0}
canvas.plot.dt-plot{aspect-ratio:4/3}
.dt-read{margin-top:8px}

@media (max-width:560px){
  .dr-tbl-m{display:block}
  .dr-tbl-d{display:none}
  canvas.plot.dr-plot,canvas.plot.cs-s3{aspect-ratio:4/3}
  .dr-c{min-width:38px;min-height:40px;padding:2px}
  .dr-cp{font-size:.62rem}
  table.ot{border-spacing:2px}
  table.ot.coins .dr-c,table.ot.spin .dr-c,table.ot.bag .dr-c{min-width:56px}
}

umber line from 2 to 12, forming a triangular histogram. Labels read 6/36 over 7 and 1/36 over 2 and 12. Caption: total area = 1.","shape":"square"}},"goals":["I can identify a discrete random variable and list its possible values, and tell it apart from a continuous one.","I can build a probability distribution table from a sample space.","I can check that a distribution is valid and find a missing probability.","I can draw and read a probability histogram, using area as probability.","I can recognize a uniform distribution and find probabilities like `P(X \u003c= k)`.","I can compare a simulated distribution with the theoretical one and judge the differences."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Outcomes vs numbers","goal":1,"prompt":"Three coins are tossed. Let `X` = the number of heads. Which is a value of `X`?","options":[{"t":"HTH","why":"HTH is an outcome; `X = 2` for it.","_n":"0e36","_k":"266ed875"},{"t":"Heads","why":"‘Heads’ describes an outcome, not a number. ‘Heads, tails, heads’ is an outcome; `X = 2` heads is the number we record.","_n":"1e66","_k":"4837ad6d"},{"t":"`1/8`","why":"`1/8` is `P(X = 0)`.","_n":"2e56","_k":"6fd63925"},{"t":"2","why":"`X` counts heads, so its values are 0, 1, 2, 3.","_n":"3e06","_k":"4c8e705a"}],"hints":["What does `X` count?","Heads in three tosses.","0, 1, 2 or 3."]},{"id":"w2","skill":"Sample spaces","goal":2,"prompt":"Three coins are tossed. How many outcomes give exactly 1 head?","options":[{"t":"1","why":"The head can be in any of 3 positions.","_n":"4df6","_k":"b1272217"},{"t":"3","why":"HTT, THT, TTH.","_n":"5e26","_k":"be85da82"},{"t":"4","why":"That counts the 4 values of `X`.","_n":"6e16","_k":"08bc1dfd"},{"t":"8","why":"8 counts every outcome. Only HTT, THT and TTH have exactly 1 head.","_n":"7ec6","_k":"38b2ad1e"}],"hints":["Where can the single head be?","First, second or third coin.","3."]},{"id":"w3","skill":"Sample spaces","goal":2,"prompt":"Two dice are rolled. How many outcomes have a sum of 4?","options":[{"t":"1","why":"Count the outcomes behind the value: (1, 3), (2, 2) and (3, 1) all give 4.","_n":"8eb6","_k":"19ee4ce0"},{"t":"2","why":"(1, 3) and (3, 1) are different.","_n":"9fd2","_k":"2b308796"},{"t":"3","why":"(1, 3), (2, 2), (3, 1).","_n":"afe2","_k":"e27e7ed8"},{"t":"4","why":"(2, 2) is one cell.","_n":"bff2","_k":"2cce1407"}],"hints":["List the pairs.","(1, 3), (2, 2), (3, 1).","3."]},{"id":"w4","skill":"Probability sums","goal":3,"prompt":"The probabilities of all outcomes of an experiment add to…","options":[{"t":"The number of outcomes","why":"That counts outcomes. Their probabilities add to 1.","_n":"c002","_k":"5985d802"},{"t":"It depends on the experiment","why":"Always 1.","_n":"df92","_k":"3bf76cb2"},{"t":"1","why":"Something must happen.","_n":"efa2","_k":"58acc9e0"},{"t":"100","why":"100% = 1.","_n":"ffb2","_k":"937751b7"}],"hints":["What’s the probability that \u003cem>some\u003c/em> outcome happens?","Certain.","1."]},{"id":"w5","skill":"Without replacement","goal":2,"prompt":"A bag has 2 red and 3 blue marbles. Two are drawn without replacement. What is \u003ci>P\u003c/i>(both blue)?","options":[{"t":"`3/10`","why":"`3/5 × 2/4`.","_n":"gfc2","_k":"95937a00"},{"t":"`9/25`","why":"The first blue isn’t put back.","_n":"hf52","_k":"40ccad12"},{"t":"`2/5`","why":"That’s not ‘both blue’.","_n":"if62","_k":"95230c9c"},{"t":"`6/5`","why":"Both draws must be blue: multiply, don’t add. A probability can’t be more than 1.","_n":"j6f3","_k":"a2389334"}],"hints":["Second draw: what’s left?","4 marbles, 2 blue.","`3/5 × 2/4 = 3/10`."]},{"id":"w6","skill":"Discrete vs continuous","goal":1,"prompt":"Which variable is continuous?","options":[{"t":"The number of goals in a game","why":"Goals in a game can be counted; the time of the first goal can’t.","_n":"k6e3","_k":"f2d7217e"},{"t":"The number on a die","why":"A die shows 1, 2, 3, 4, 5 or 6: values you can count.","_n":"l713","_k":"7e06bf5e"},{"t":"The number of siblings","why":"Siblings are counted.","_n":"m703","_k":"8ddd2d36"},{"t":"The time to run 100 m","why":"Any value in a range is possible.","_n":"n6b3","_k":"d359c277"}],"hints":["Can you count the possible values?","Time can be 12.3 s, 12.31 s, …","Time."]}],"refreshers":{"Outcomes vs numbers":"An outcome is what happens; the random variable is the number you record for it.","Sample spaces":"List or grid every outcome; ordered pairs like (1, 3) and (3, 1) are different.","Probability sums":"All the probabilities of a sample space add to 1.","Without replacement":"After each draw, the bag has one fewer marble.","Discrete vs continuous":"Discrete: countable values. Continuous: any value in an interval."}}},"explore":{"heading":"Variable builder","intro":"Pick an experiment and a rule. The outcomes gather into a distribution.","predIntro":"Make a prediction first. Then the variable builder will show you what really happens.","predictions":[{"id":"p1","start":{"exp":"dice","rule":"max"},"prompt":"Two dice, maximum. Which value of the larger number is most likely?","options":[{"t":"3 or 4","_n":"o6a3","_k":"11e4e876"},{"t":"1","_n":"p6d3","_k":"2132f4bc"},{"t":"6","_n":"q6c3","_k":"0c69478d"},{"t":"They’re all equally likely","_n":"r773","_k":"21c99f32"}],"explain":"For the maximum to be 6, either die can be 6: 11 cells. The stacks hold 1, 3, 5, 7, 9 and 11 cells."},{"id":"p2","start":{"exp":"dice","rule":"diff"},"prompt":"Two dice, difference. Which difference is most likely?","options":[{"t":"1","_n":"s763","_k":"6608d71d"},{"t":"All equally likely","_n":"te93","_k":"aa0f38ec"},{"t":"5","_n":"uea3","_k":"1a7b3ca1"},{"t":"0","_n":"ve73","_k":"be3b82dc"}],"explain":"A difference of 1 has 10 cells: (1, 2), (2, 1), …, (5, 6), (6, 5). The stacks hold 6, 10, 8, 6, 4 and 2 cells."},{"id":"p3","start":{"exp":"coins","rule":"heads"},"prompt":"Three coins. How many times as likely is `X = 1` as `X = 0`?","options":[{"t":"8 times","_n":"we83","_k":"f4efd30a"},{"t":"3 times","_n":"xed3","_k":"9e20f8fa"},{"t":"Equally likely","_n":"yee3","_k":"90bbad61"},{"t":"Twice","_n":"zeb3","_k":"3fc6895d"}],"explain":"HTT, THT, TTH vs TTT: 3 outcomes vs 1."},{"id":"p4","start":{"exp":"dice","rule":"sum","seed":2},"prompt":"Compare mode, two-dice sum, 36 simulated rolls. Will the simulated bars match the theoretical bars exactly?","options":[{"t":"Yes, exactly","_n":"10ec3","_k":"034651cf"},{"t":"Yes, after 36 rolls every sum appears its expected number of times","_n":"11f13","_k":"2392580d"},{"t":"No, and more rolls make it worse","_n":"12f23","_k":"c2933e49"},{"t":"No: they’ll wobble, and get closer with more rolls","_n":"136b2","_k":"db28e024"}],"explain":"Simulated bars wobble around the theoretical ones; more trials, smaller wobble. The total difference shrank from 36 to 360 to 3600 rolls."}],"chalIntro":"Use the variable builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,4],"prompt":"Build the distribution of `X` = the number of sixes when two dice are rolled. (Build mode, Auto off: tap the cells yourself.)","why":"25 cells have no 6, 10 have exactly one and only (6, 6) has two: `P(0) = 25/36`, `P(1) = 10/36`, `P(2) = 1/36`.","hints":["How many cells have no 6?","5 × 5 = 25 with no 6; (6, 6) is the only cell with two.","36 − 25 − 1 = 10 cells with exactly one 6."]},{"id":"tc2","goal":[3,5],"prompt":"Check mode: a table has `x` = 0, 1, 2, 3 with probabilities 0.1, 0.3, `k`, `2k`. Set `k` to make it valid, then set the probe to show `P(X ≥ 2)`.","why":"0.1 + 0.3 + `k` + `2k` = 1 gives `3k = 0.6`, so `k = 0.2`. Then `P(X ≥ 2) = 0.2 + 0.4 = 0.6`.","hints":["Everything adds to 1.","0.1 + 0.3 + `k` + `2k` = 1.","`3k = 0.6`, so `k = 0.2`; `P(X ≥ 2) = 0.2 + 0.4 = 0.6`."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Custom table: design a distribution for `X` with values 1, 2, 3, 4 and probabilities in steps of 0.05 (none zero), so that:\u003cul class=\"dr-conds\">\u003cli>`P(X = 4) = 2 × P(X = 1)`;\u003c/li>\u003cli>`P(X \u003c= 2) = 0.4`;\u003c/li>\u003cli>3 is the single most likely value.\u003c/li>\u003c/ul>","why":"`p_4 = 2p_1`, `p_1 + p_2 = 0.4`, the total is 1 and `p_3` beats every other value. Only two designs work in steps of 0.05: (0.05, 0.35, 0.50, 0.10) and (0.10, 0.30, 0.40, 0.20).","hints":["If `P(X \u003c= 2) = 0.4`, then `p_3 + p_4 = 0.6`.","`p_4 = 2p_1`, so `p_3 = 0.6 - 2p_1`. It must beat `p_2 = 0.4 - p_1` and `p_4 = 2p_1`.","`p_1` must be less than 0.15: try 0.05 or 0.10."]}]},"part3":{"slug":"compare","name":"Compare","heading":"Simulated vs theoretical","intro":"A probability histogram is a prediction. Here you test it: compare simulated bars with the exact ones, judge two dice from their data, and read a probability as an area.","stations":[{"id":"s1","title":"How close is close?","text":"The sum of two dice, simulated with 36, 360 and 3600 rolls (the same seeded rolls every time). The total difference adds up the gaps between the simulated and theoretical bars: Σ|simulated − theoretical|.","after":"The total difference shrinks as the rolls pile up: simulated bars wobble around the theoretical ones and settle with more trials."},{"id":"s2","title":"Is this die fair?","text":"Two dice were each rolled 600 times. A fair die should show each face about 600 × `1/6` = 100 times. Which die is likely loaded?","a":[98,104,95,101,99,103],"b":[86,87,85,86,84,172],"right":"Die B shows a six 172 times, about twice as often as each other face (about 86). That gap is far too big for chance. Die A’s counts all sit within 5 of 100: ordinary chance variation.","wrongA":"Die A’s counts all sit within 5 of 100. That’s ordinary chance variation. Look at Die B’s sixes.","wrongBoth":"Die A’s counts all sit within 5 of 100: ordinary chance variation. Only one die has a gap too big for chance.","wrongNone":"Die B shows 172 sixes, far above the expected 100, while its other faces sit near 86. That’s too big a gap for chance.","explain":"Explain your judgement in a sentence or two."},{"id":"s3","title":"Area = probability","text":"A spinner shows 1 with probability `1/4`, 2 with `1/2` and 3 with `1/4`. Drag the edges of the shaded region over the bars to find `P(X ≥ 2)` as an area.","counts":[10,20,10],"freqNote":"The heights are now counts out of 40 spins (model data), so the total area is 40, not 1. Bar heights are probabilities, so the total area is 1, not the number of trials."}],"quickCheck":{"title":"Quick check","summary":"Simulated vs theoretical quick check","items":[{"id":"q1","goal":4,"prompt":"The total area of a probability histogram is…","choices":[{"t":"1","fb":"Right. Heights are probabilities and widths are 1, so the areas add to 1.","_n":"146a2","_k":"0288d05c"},{"t":"100","fb":"Heights are probabilities and widths are 1.","_n":"15692","_k":"496e059e"},{"t":"the largest value","fb":"Heights are probabilities and widths are 1.","_n":"16682","_k":"36ebd9b0"},{"t":"the number of trials","fb":"Heights are probabilities and widths are 1.","_n":"176f2","_k":"88c5e1e7"}]},{"id":"q2","goal":6,"prompt":"In 36 simulated rolls, a sum of 7 came up 9 times. Empirical `P(7)`?","choices":[{"t":"`1/6`","fb":"`9/36`; the theoretical value is `1/6`.","_n":"186e2","_k":"29a232bf"},{"t":"`7/36`","fb":"`9/36`; the theoretical value is `1/6`.","_n":"196d2","_k":"90dd4afb"},{"t":"`1/4`","fb":"Right. `9/36 = 1/4`; the theoretical value is `1/6`.","_n":"1a6c2","_k":"64106e13"},{"t":"`9/7`","fb":"`9/36`; the theoretical value is `1/6`.","_n":"1b732","_k":"327e4818"}]},{"id":"q3","goal":6,"prompt":"With more simulated trials, the simulated histogram…","choices":[{"t":"matches it exactly","fb":"Law of large numbers.","_n":"1c722","_k":"cf5009e0"},{"t":"stays equally far","fb":"Law of large numbers.","_n":"1d652","_k":"45edffeb"},{"t":"gets closer to the theoretical one","fb":"Right. Law of large numbers: more trials, smaller wobble.","_n":"1e662","_k":"541e04c2"},{"t":"drifts away","fb":"Law of large numbers.","_n":"1f672","_k":"652312bb"}]},{"id":"q4","goal":6,"prompt":"Die B (600 rolls) shows 172 sixes and about 86 of each other face. Best conclusion?","choices":[{"t":"Fair: dice vary","fb":"172 is far above the expected 100, while the others are near 86: too big a gap for chance.","_n":"1g682","_k":"37793449"},{"t":"Likely loaded toward 6","fb":"Right. 172 is far above the expected 100, while the others are near 86: too big a gap for chance.","_n":"1h692","_k":"6fe66b50"},{"t":"Can’t judge with 600 rolls","fb":"172 is far above the expected 100, while the others are near 86: too big a gap for chance.","_n":"1i6a2","_k":"78fc87e2"},{"t":"Fair: 172 is close to 100","fb":"172 is far above the expected 100, while the others are near 86: too big a gap for chance.","_n":"1j6b2","_k":"a41e739e"}]}]}},"practice":{"activities":[{"id":"pairs","type":"match","title":"Experiment ↔ distribution","summary":"Experiment ↔ distribution","goal":[2,5],"instruction":"Match each experiment and variable with its distribution. One distribution is left over.","leftTitle":"Experiment and variable","rightTitle":"Distribution","left":[{"id":"l1","goal":2,"t":"Two coins: `X` = number of heads","why":"HH, HT, TH, TT: 1 head happens two ways, so `P(1) = 2/4 = 1/2`."},{"id":"l2","goal":5,"t":"One fair die: `X` = the number shown","why":"Six equally likely faces: a uniform distribution."},{"id":"l3","goal":2,"t":"Two dice: `X` = number of sixes","why":"25 cells with no 6, 10 with one, 1 with two."},{"id":"l4","goal":2,"t":"Two draws without replacement from 2 red and 3 blue: `X` = number of red","why":"`3/5 × 2/4 = 3/10` for no red, `2/5 × 1/4 = 1/10` for two red, and `6/10` for one."},{"id":"l5","goal":2,"t":"Two dice: `X` = the larger number","why":"The larger number is `x` in `2x - 1` cells.","hints":["When is the larger number 3?","(3, 1), (3, 2), (3, 3), (1, 3), (2, 3): 5 cells.","`(2 × 3 - 1)/36`."]},{"id":"l6","goal":2,"t":"Two dice: `X` = sum","why":"Sums near 7 have the most cells: 6 of 36 for a sum of 7."}],"right":[{"id":"r1","t":"0: `1/4` · 1: `1/2` · 2: `1/4`"},{"id":"r2","t":"`1/6` for each of 1–6 (uniform)"},{"id":"r3","t":"0: `25/36` · 1: `10/36` · 2: `1/36`"},{"id":"r4","t":"0: `3/10` · 1: `6/10` · 2: `1/10`"},{"id":"r5","t":"`(2x - 1)/36` for `x` = 1–6"},{"id":"r6","t":"`1/36`, `2/36`, …, `6/36`, …, `1/36` for 2–12"},{"id":"r7","t":"0: `9/25` · 1: `12/25` · 2: `4/25`"}],"_a":"GURZCEZcExFTRBkbCFQTWUAUBxtIRF1QQFwXS1dEHUEOUhcDRhQFQU5EWQxGXBMRV0QZGwhQE1lAFAMbGQ==","wrong":{"l4|r7":"That puts the first marble back.","l1|r2":"1 head can happen two ways."},"wrongDefault":"List the outcomes and group them by `X`."},{"id":"builder","type":"custom","title":"Distribution builder","summary":"Distribution builder","goal":[2,3,5],"star":true,"instruction":"Find each probability. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a fraction such as 3/8 or a decimal such as 0.375 (round to 4 places if it doesn’t end), then press Check.","items":[{"id":"n1","goal":2,"prompt":"Three coins: \u003ci>P\u003c/i>(\u003ci>X\u003c/i> = 2 heads)?","_a":"UkgGDlE=","display":"`3/8`","why":"HHT, HTH, THH: 3 of the 8 outcomes.","wrong":[{"match":0.25,"fb":"4 values aren’t equally likely."}]},{"id":"n2","goal":3,"prompt":"A table has probabilities 0.15, 0.25, 0.35 and `k`. Find `k`.","_a":"UkgHDA==","display":"`k = 0.25`","label":"`k` =","why":"1 − (0.15 + 0.25 + 0.35) = 1 − 0.75 = 0.25.","wrong":[{"match":0.35,"fb":"0.15 + 0.25 + 0.35 = 0.75."}]},{"id":"n3","goal":5,"prompt":"Two dice, sum: `P(X ≥ 10)`?","_a":"UkgED1JQB1VUUAMPUlAHVVRQAw==","display":"`1/6`","why":"Sums 10, 11 and 12: 3 + 2 + 1 = 6 of the 36 cells.","wrong":[{"match":0.08333333333333333,"fb":"Include 10: 3 + 2 + 1 = 6 cells."}]},{"id":"n4","goal":5,"star":true,"prompt":"Two dice, maximum: `P(X \u003c= 3)`?","_a":"UkgHDA==","display":"`1/4`","why":"Maximum 1, 2 or 3: 1 + 3 + 5 = 9 of the 36 cells.","wrong":[{"match":0.1388888888888889,"fb":"≤ 3 means 1, 2 or 3: 1 + 3 + 5 = 9 cells."}]},{"id":"n5","goal":3,"star":true,"prompt":"`P(X = x) = (x + 1)/c` for `x` = 0, 1, 2, 3. Find `c`, then `P(X = 3)`.","_a":"OVcFFVRIBT4=","display":"`c = 10`; `P(X = 3) = 0.4`","parts":["`c` =","`P(X = 3)` ="],"why":"(1 + 2 + 3 + 4)/`c` = 1, so `c = 10`; `P(X = 3) = 4/10 = 0.4`.","wrong":[{"part":0,"match":6,"fb":"Add (0 + 1) + (1 + 1) + (2 + 1) + (3 + 1) = 10."}],"hints":["The probabilities must add to 1.","(1 + 2 + 3 + 4)/`c` = 1.","`c = 10`; `P(3) = 4/10`."]},{"id":"n6","goal":2,"star":true,"prompt":"A bag has 3 red and 2 blue marbles. Draw without replacement \u003cstrong>until\u003c/strong> a blue appears; `X` = number of draws. Find `P(X = 3)`.","_a":"UkgH","display":"`1/5`","why":"Red, red, then blue: `3/5 × 2/4 × 2/3 = 12/60 = 1/5`.","wrong":[{"match":0.144,"fb":"That’s with replacement. Without replacement: `3/5 × 2/4 × 2/3`."}],"hints":["`X = 3` means red, red, then blue.","`3/5`, then `2/4`, then `2/3`.","`= 12/60 = 1/5`. Check: `P(1) = 2/5`, `P(2) = 3/10`, `P(3) = 1/5`, `P(4) = 1/10`, which add to 1."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Sebastian","how":"","goal":[2,3,5],"instruction":"Sebastian made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find `P(X = 7)`, where `X` is the sum of two dice.","steps":["The possible sums are 2, 3, …, 12.","That’s 11 values, so each has probability `1/11`.","`P(X = 7) = 1/11`."],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"Sums aren’t equally likely.","_n":"1k6c2","_k":"f0720262"},{"t":"`P = 1/12`.","why":"The sums still aren’t equally likely. 6 of the 36 cells give 7.","_n":"1l6d2","_k":"e65279b6"},{"t":"Count outcomes: 6 of the 36 give 7, so `P = 1/6`.","why":"Count the outcomes behind each value: a sum of 7 has 6 ways, a sum of 2 has 1.","_n":"1m6e2","_k":"a43c2e25"},{"t":"`P = 7/36`.","why":"7 is the sum, not the number of cells. 6 of the 36 cells give 7.","_n":"1n772","_k":"7bdf1bb0"}],"hints":["Is a sum of 2 as likely as a sum of 7?","1 way vs 6 ways.","`6/36`."]},{"id":"e2","goal":3,"task":"Build the distribution of `X` = number of heads in 3 coin tosses.","steps":["The values of `X` are 1, 2, 3.","`P(1) = 3/8`, `P(2) = 3/8`, `P(3) = 1/8`.","That’s the whole distribution."],"_a":"Ug==","stepFb":["","These probabilities are right for those values, but one value is missing.","The probabilities add to `7/8`, not 1."],"fixes":[{"t":"Make `P(3) = 2/8`.","why":"HHH is the only outcome with 3 heads. The missing `1/8` belongs to TTT, `X = 0`.","_n":"1o762","_k":"cc7f6b18"},{"t":"Divide each by `7/8`.","why":"That changes correct probabilities. The missing `1/8` belongs to TTT, `X = 0`.","_n":"1p792","_k":"db0928e4"},{"t":"Values 0, 1, 2, 3; add `P(0) = 1/8` (TTT), so the total is 1.","why":"Did you include `X = 0`? A valid distribution adds to 1.","_n":"1q782","_k":"8c68a7af"},{"t":"Step 1 is correct.","why":"TTT gives `X = 0`.","_n":"1r7b2","_k":"856751ed"}],"hints":["Can you get no heads?","TTT.","Include `X = 0`."]},{"id":"e3","goal":5,"task":"`X` = the larger of two dice. Find `P(X \u003c= 2)`.","steps":["`P(X = m) = (2m - 1)/36`.","`P(X \u003c= 2) = P(X = 2)`.","`= 3/36 = 1/12`."],"_a":"Uw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"‘≤ 2’ includes 1 as well as 2.","_n":"1s7a2","_k":"c6a91747"},{"t":"`P(X \u003c= 2) = P(1) + P(2) = 1/36 + 3/36 = 1/9`.","why":"‘≤ 2’ includes 2 and 1. List the values: 1 and 2.","_n":"1t7d2","_k":"4bdaf4d6"},{"t":"`P(X = 3) = 5/36`.","why":"3 isn’t ≤ 2. List the values: 1 and 2.","_n":"1u7c2","_k":"fc293537"},{"t":"`P(X = 1) = 1/36`.","why":"‘≤ 2’ includes 2 as well as 1.","_n":"1v6f2","_k":"2f6fa4ce"}],"hints":["Which values are ≤ 2?","1 and 2.","`4/36 = 1/9`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the variable builder: the maximum’s shape, the difference’s shape, or how fast the simulation settled?"},{"id":"j2","q":"In your own words, what makes a table a valid probability distribution?"},{"id":"j3","q":"Explain to a friend why each bar’s area in a probability histogram is a probability."},{"id":"j4","q":"Which step in building a distribution still trips you up (listing outcomes, grouping, or checking)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which is a discrete random variable?","options":[{"t":"The time until the first goal","why":"Time takes any value in a range.","_n":"1w6e2","_k":"8a01b160"},{"t":"“Goal or no goal” on a shot","why":"That’s an outcome; a random variable is a number.","_n":"1x712","_k":"1f52eff4"},{"t":"The number of goals scored in a hockey game","why":"Goals are counted: 0, 1, 2, …","_n":"1y722","_k":"c7742109"},{"t":"The height of a player","why":"Height takes any value in a range, so it’s continuous.","_n":"1z6f2","_k":"e4e5f372"}]},"b":{"prompt":"Which is \u003cstrong>not\u003c/strong> a discrete random variable?","options":[{"t":"The mass of an apple","why":"Mass is continuous.","_n":"20702","_k":"2efe4863"},{"t":"The number of bruised apples in a crate","why":"Bruised apples are counted. That’s discrete.","_n":"216d2","_k":"b2bd04ae"},{"t":"The number of apples in a bag","why":"Apples are counted. That’s discrete.","_n":"226e2","_k":"6268af30"},{"t":"The number of seeds in an apple","why":"Seeds are counted: 0, 1, 2, … That’s discrete.","_n":"236b2","_k":"bf95e422"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"Which table could be a probability distribution for `X` = 1, 2, 3?","options":[{"t":"0.3, 0.3, 0.3","why":"Adds to 0.9.","_n":"246c2","_k":"ddea34a0"},{"t":"0.5, 0.6, −0.1","why":"A probability can’t be negative.","_n":"25792","_k":"33f69e14"},{"t":"0.4, 0.4, 0.4","why":"Adds to 1.2.","_n":"267a2","_k":"2bb66f97"},{"t":"0.2, 0.3, 0.5","why":"Each is between 0 and 1, and they add to 1.","_n":"27f34","_k":"b7bff082"}]},"b":{"prompt":"Which table could be a probability distribution for `X` = 0, 1, 2?","options":[{"t":"`1/6`, `1/2`, `1/3`","why":"`1/6 + 3/6 + 2/6 = 1`.","_n":"28f24","_k":"60e1ca9c"},{"t":"`1/2`, `1/2`, `1/2`","why":"Adds to `3/2`.","_n":"29f14","_k":"6c330b61"},{"t":"`2/3`, `1/2`, `-1/6`","why":"Negative.","_n":"2af04","_k":"7784a6c8"},{"t":"`1/3`, `1/3`, `1/4`","why":"Adds to `11/12`.","_n":"2bef4","_k":"81439b6c"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"In a probability histogram, the bar for `X = 3` has height 0.25. What does this mean?","options":[{"t":"`P(X \u003c= 3) = 0.25`","why":"One bar is one value.","_n":"2cee4","_k":"3a34b5da"},{"t":"25% of the values are 3 or more","why":"One bar is one value: the bar at 3 gives `P(X = 3)` only.","_n":"2ded4","_k":"6866d24c"},{"t":"`P(X = 3) = 0.25`","why":"Width 1, so area = height = probability.","_n":"2eec4","_k":"89dc2bd9"},{"t":"3 came up 25 times","why":"Heights are probabilities, not counts.","_n":"2ffb4","_k":"ccc5dce1"}]},"b":{"prompt":"What is the total area of the bars in a probability histogram?","options":[{"t":"1","why":"Heights are probabilities and widths are 1, so the areas add to 1.","_n":"2gfa4","_k":"62393484"},{"t":"The sum of the `x`-values","why":"Area adds probabilities.","_n":"2hed4","_k":"a7534f90"},{"t":"The number of trials","why":"Bar heights are probabilities, so the total area is 1, not the number of trials.","_n":"2iee4","_k":"6ea7be3c"},{"t":"100","why":"Probabilities add to 1, or 100%.","_n":"2jef4","_k":"0db1c014"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"A bag has 2 red and 3 blue marbles. Two are drawn without replacement. `X` = the number of red. Find `P(X = 1)`.","options":[{"t":"`3/10`","why":"That’s one order only.","_n":"2kf04","_k":"78b0463a"},{"t":"`1/3`","why":"`X` = 0, 1, 2 aren’t equally likely.","_n":"2le94","_k":"8f71e2c9"},{"t":"`12/25`","why":"That assumes replacement.","_n":"2mea4","_k":"f82f17a4"},{"t":"`3/5`","why":"Red-blue or blue-red: `2/5 × 3/4 + 3/5 × 2/4 = 6/20 + 6/20`.","_n":"2neb4","_k":"5747a73f"}]},"b":{"prompt":"A bag has 3 red and 2 blue marbles. Two are drawn without replacement. `X` = the number of red. Find `P(X = 2)`.","options":[{"t":"`3/10`","why":"`3/5 × 2/4`.","_n":"2oec4","_k":"26cc084b"},{"t":"`1/3`","why":"`X` = 0, 1, 2 aren’t equally likely.","_n":"2pf54","_k":"2c5ee470"},{"t":"`9/25`","why":"That assumes replacement: after one red is drawn, only 2 of the 4 left are red.","_n":"2qf64","_k":"9c8f9576"},{"t":"`3/5`","why":"That’s `P(X = 1)`.","_n":"2r124","_k":"a7267d8c"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"`X` takes the values 1, 2, 3, 4 with `P(X = x) = kx`. Find `k` and `P(X ≥ 3)`.","options":[{"t":"`k = 1/10`; `P = 3/10`","why":"‘≥ 3’ includes 4.","_n":"2s134","_k":"bc1cddb8"},{"t":"`k = 1/4`; `P = 1/2`","why":"That treats the values as equally likely.","_n":"2t144","_k":"0f3edba0"},{"t":"`k = 1/10`; `P(X ≥ 3) = 7/10`","why":"`k(1 + 2 + 3 + 4) = 1`; `(3 + 4)/10`.","_n":"2u154","_k":"84034187"},{"t":"`k = 1/10`; `P = 4/10`","why":"Include 3.","_n":"2v0e4","_k":"5e02b7f0"}]},"b":{"prompt":"`X` takes the values 1, 2, 3, 4 with `P(X = x) = k(5 - x)`. Find `k` and `P(X \u003c= 2)`.","options":[{"t":"`k = 1/10`; `P = 3/10`","why":"That’s `P(X = 2)` only.","_n":"2w0f4","_k":"dc80eeb2"},{"t":"`k = 1/4`; `P = 1/2`","why":"That treats the values as equally likely.","_n":"2x104","_k":"18c95948"},{"t":"`k = 1/10`; `P(X \u003c= 2) = 7/10`","why":"`(4 + 3)/10`.","_n":"2y114","_k":"57abffd7"},{"t":"`k = 1/10`; `P = 4/10`","why":"That’s `P(X = 1)` only.","_n":"2z1a4","_k":"a961d9c7"}]}},{"id":"t3","cat":"T","goal":2,"a":{"prompt":"Two dice are rolled. `X` = the larger of the two numbers. Find `P(X = 4)`.","options":[{"t":"`1/9`","why":"`4/36` counts only the first die being 4.","_n":"301b4","_k":"5e4f02b9"},{"t":"`1/6`","why":"Six values aren’t equally likely.","_n":"31984","_k":"381553f6"},{"t":"`7/36`","why":"(4, 1), (4, 2), (4, 3), (4, 4), (1, 4), (2, 4), (3, 4).","_n":"32974","_k":"024bb49d"},{"t":"`2/9`","why":"`8/36` counts (4, 4) twice.","_n":"33964","_k":"d2a69dd6"}]},"b":{"prompt":"Two dice are rolled. `X` = the difference (larger − smaller). Find `P(X = 2)`.","options":[{"t":"`1/9`","why":"`4/36` is one order only.","_n":"34954","_k":"413b1fea"},{"t":"`1/6`","why":"The six differences aren’t equally likely.","_n":"35944","_k":"121e3566"},{"t":"`2/9`","why":"8 cells: (1, 3), (3, 1), (2, 4), (4, 2), (3, 5), (5, 3), (4, 6), (6, 4).","_n":"36934","_k":"0449ee55"},{"t":"`5/18`","why":"`10/36` is `P(X = 1)`.","_n":"37924","_k":"c56747c6"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which best describes how to draw a probability histogram for a discrete `X`?","options":[{"t":"“Draw bars with heights equal to how often each value came up in one experiment.”","why":"Bar heights are probabilities, so the total area is 1, not the number of trials.","_n":"38914","_k":"435f5cb2"},{"t":"“Join the probabilities with a line graph.”","why":"That’s a different graph; a histogram uses bars whose areas are probabilities.","_n":"39a04","_k":"78a5f0be"},{"t":"“Draw one bar for every outcome in the sample space.”","why":"Bars are for values of `X`, not outcomes.","_n":"3a9f4","_k":"455e5960"},{"t":"“Draw a bar of width 1 centred on each value, with height equal to its probability, so the total area is 1.”","why":"Each bar’s area is its probability, and the areas add to 1.","_n":"3b9e4","_k":"18d6a2c3"}]},"b":{"prompt":"Why do the bars of a probability histogram have width 1?","options":[{"t":"“So each bar’s area equals its probability, and the areas add to 1.”","why":"Width 1 makes area = height = probability.","_n":"3c9f4","_k":"41087069"},{"t":"“So the bars don’t overlap.”","why":"Overlap isn’t the reason; area is.","_n":"3d9c4","_k":"5ac92dc4"},{"t":"“So the histogram fits on the page.”","why":"Widths are chosen for area, not size.","_n":"3e9d4","_k":"f5812a86"},{"t":"“Because each value happens once.”","why":"Values aren’t equally likely, and the width has nothing to do with how often a value happens.","_n":"3fa24","_k":"3962da13"}]}},{"id":"c2","cat":"C","goal":6,"a":{"prompt":"A die was rolled 60 times: the counts for 1–6 were 8, 12, 9, 11, 7, 13. Which conclusion is best?","options":[{"t":"“The counts vary around the expected 10. Variation this size is normal for 60 rolls, so there’s no strong evidence the die is unfair.”","why":"Simulated or real counts wobble around the expected value; these gaps are ordinary for 60 rolls.","_n":"3ga34","_k":"33edcf14"},{"t":"“6 is favoured, because 13 is the largest count.”","why":"A gap of 3 in 60 rolls is ordinary.","_n":"3ha04","_k":"cd9400d3"},{"t":"“The die is fair, because the counts add to 60.”","why":"Any 60 rolls add to 60.","_n":"3ia14","_k":"c91ef767"},{"t":"“The die is unfair, because the counts aren’t all 10.”","why":"Counts wobble around the expected 10; they’re almost never all exactly 10.","_n":"3j964","_k":"9c6df2db"}]},"b":{"prompt":"A spinner with equal sectors 1–4 was spun 400 times: 104, 97, 95, 104. Which conclusion is best?","options":[{"t":"“You can’t conclude anything from data.”","why":"Data are exactly what we compare.","_n":"3k974","_k":"4077dc77"},{"t":"“It’s unfair: 104 ≠ 100.”","why":"Counts wobble around the expected 100; a gap of 4 is ordinary.","_n":"3la45","_k":"c6a502a8"},{"t":"“All counts are close to the expected 100; this looks like ordinary chance variation, consistent with a fair spinner.”","why":"Every count is within 5 of 100: ordinary chance variation.","_n":"3ma35","_k":"b3a3dbb9"},{"t":"“3 is the least likely value.”","why":"95 is a small, ordinary dip below 100, not evidence that 3 is less likely.","_n":"3na65","_k":"04071104"}]}},{"id":"a1","cat":"A","goal":2,"a":{"prompt":"A fundraiser game: draw one card from a standard deck. `X` = $10 for an ace, $2 for a face card (J, Q, K), and $0 otherwise. Find `P(X ≥ 2)`.","options":[{"t":"`1/13`","why":"That’s aces only.","_n":"3oa55","_k":"334ae8f6"},{"t":"`3/13`","why":"That’s face cards only.","_n":"3pa05","_k":"790289f0"},{"t":"`4/13`","why":"Aces 4 + face cards 12 = 16 of 52.","_n":"3q9f5","_k":"bfce1108"},{"t":"`2/3`","why":"Two of three values isn’t `2/3`: the values aren’t equally likely.","_n":"3ra25","_k":"255e8234"}]},"b":{"prompt":"Draw one card. `X` = 5 points for a heart, 1 point for a spade, 0 otherwise. Find `P(X ≥ 1)`.","options":[{"t":"`1/4`","why":"That’s hearts only.","_n":"3sa15","_k":"85d4eebe"},{"t":"`1/2`","why":"Hearts 13 + spades 13 = 26 of 52.","_n":"3t9c5","_k":"1f728c4c"},{"t":"`2/3`","why":"Two of three values isn’t `2/3`: the values aren’t equally likely.","_n":"3u9b5","_k":"cece8563"},{"t":"`3/4`","why":"Clubs and diamonds give 0.","_n":"3v9a3","_k":"9c26de55"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"A random digit generator gives 0–9, each equally likely. `X` = the remainder when the digit is divided by 3. Find `P(X = 0)`.","options":[{"t":"`1/10`","why":"Four digits give remainder 0.","_n":"3w9b3","_k":"17648cdf"},{"t":"`3/10`","why":"0 ÷ 3 has remainder 0 too.","_n":"3x9c3","_k":"dc6963e5"},{"t":"`1/3`","why":"The remainders 0, 1, 2 aren’t equally likely here.","_n":"3y9d3","_k":"851e1e73"},{"t":"`2/5`","why":"0, 3, 6 and 9: 4 of 10.","_n":"3z9e3","_k":"4710cc42"}]},"b":{"prompt":"`X` = the remainder when a random digit 0–9 is divided by 4. Find `P(X = 0)`.","options":[{"t":"`1/10`","why":"Three digits give remainder 0: 0, 4 and 8.","_n":"409f3","_k":"56c2f211"},{"t":"`1/5`","why":"Include 0.","_n":"41a03","_k":"39cbe4a6"},{"t":"`1/4`","why":"The remainders 0, 1, 2, 3 aren’t equally likely here.","_n":"42a13","_k":"6728a278"},{"t":"`3/10`","why":"0, 4, 8.","_n":"43923","_k":"b5ca82cd"}]}}]},"task":{"title":"Design a distribution","summary":"Design a distribution","statement":"\u003cp>`X` can be 0, 1, 2 or 3. Choose the four probabilities (steps of 0.1) so the distribution meets every condition. Can you find all the answers?\u003c/p>\u003col class=\"dr-conds\">\u003cli>It’s a valid probability distribution.\u003c/li>\u003cli>`P(X ≥ 2) = 0.6`.\u003c/li>\u003cli>`X = 1` is the least likely value (strictly less than each of the others).\u003c/li>\u003cli>Every value has a probability greater than 0.\u003c/li>\u003c/ol>","checks":["Valid distribution","`P(X ≥ 2) = 0.6`","`X = 1` least likely","No zero probabilities"],"tips":["The bars’ total area must be 1.","‘≥ 2’ means 2 and 3 together.","`X = 1` must be strictly below every other bar.","With `p_0 + p_1 = 0.4` and `p_1` the smallest (but not 0), what can `p_1` be?"],"explainPrompt":"Explain how the conditions forced `p_0` and `p_1`, and why the remaining 0.6 can be split in exactly three ways.","vocab":"Use the words probability distribution, valid, histogram and least likely.","more":"There’s more than one answer. Can you find them all?","after3":"`p_1 = 0.1` and `p_0 = 0.3` are forced; only the split of 0.6 between `X = 2` and `X = 3` can change, and neither part may drop to 0.1."},"cards":[["Random variable","A rule that assigns a number to each outcome. `X` = number of heads."],["Discrete","Countable values: 0, 1, 2, … (goals, heads, siblings)."],["Continuous","Any value in a range (time, mass, height)."],["Probability distribution","Every value `x` with `P(X = x)`."],["Valid distribution","Each `0 \u003c= P \u003c= 1`, and the probabilities add to 1."],["Probability histogram","Bars of width 1 centred on each `x`, with height `P(X = x)`; total area 1."],["Uniform distribution","Every value equally likely: a fair die gives `1/6` each."],["Two-dice sum","`P(7) = 6/36` is the largest; `P(2) = P(12) = 1/36`."],["Two-dice maximum","`P(X = m) = (2m - 1)/36`."],["`P(X \u003c= k)`","Add the probabilities of every value up to \u003cstrong>and including\u003c/strong> `k`."],["Missing `X = 0`","A common error: check that the probabilities add to 1."],["Simulated vs theoretical","Simulated bars wobble around the theoretical ones and settle with more trials."]]}};</script>
