.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 28: Overlay (D7 bars --pen + D8 normal curve --ink, shaded area --hi-soft, boundary --ink-2 dashed), When does it
   fail? stations, Catch a biased coin task, z-table panel. */
/* radioGroup (from MDM4U 21 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled,.rg.chips button:disabled{opacity:.45;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* hero */
.na-heq{display:inline-flex;flex-direction:column;align-items:center;gap:.2em}
.na-hsub{font-size:.55em;color:var(--ink-2)}

/* Overlay */
.na-mode{margin-bottom:4px}
.na-pg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.na-main,.na-read{min-width:0}
.na-cap{font-size:clamp(1.1rem,2.4vw,1.5rem)}
.na-sls{display:grid;gap:2px;margin:0 0 6px}
.na-sls .slider{margin:0 0 2px}
.na-sls .rg-wrap{margin:0 0 6px}
canvas.plot.na-plot{aspect-ratio:16/10}
.na-badges{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:4px 0 8px;font-size:.92rem}
.na-badge{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);border-radius:999px;padding:.12em .7em;font-weight:700}
.na-badge.ok{border-color:var(--green);color:var(--ink);background:var(--good-bg)}
.na-badge.no{border-color:var(--red);color:var(--ink);background:var(--bad-bg)}
.na-warn{color:var(--red);font-weight:700;font-size:.9rem}
.na-ev{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:10px 0 4px}
.na-ev[hidden]{display:none}
.na-sel{display:inline-flex;align-items:center;gap:8px}
.na-sel select{font:inherit;font-size:1rem;min-height:38px;padding:.2em .5em;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);color:var(--ink)}
.na-steps{display:inline-flex;flex-wrap:wrap;gap:8px 14px}
.na-step{display:inline-flex;align-items:center;gap:4px}
.na-step .btn{min-width:36px;min-height:36px;padding:0 .5em;font-size:1.1rem}
.na-step input.numin{width:5.2em;text-align:center}
.na-sw{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left;cursor:pointer}
.na-sw:disabled{opacity:.45;cursor:not-allowed}
.na-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.na-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.na-sw[aria-checked="true"] .na-track{background:var(--pen);border-color:var(--pen)}
.na-sw[aria-checked="true"] .na-knob{left:19px;border-color:var(--pen)}
.na-q{font-weight:700;color:var(--ink-2)}
.na-errbox:empty{display:none}
.na-errwrap{max-width:100%;overflow-x:auto}
.na-errt,.nf-t{border-collapse:collapse;font-size:.88rem;min-width:100%}
.na-errt th,.na-errt td,.nf-t th,.nf-t td{border:1px solid var(--rule);padding:.3em .55em;text-align:right;white-space:nowrap}
.na-errt th:nth-child(3),.na-errt td:nth-child(3),.nf-t td:first-child,.nf-t th:first-child{text-align:left}
.na-msg:empty{display:none}
@media (max-width:760px){ .na-pg{grid-template-columns:minmax(0,1fr)} }
@media (prefers-reduced-motion:reduce){ .na-track,.na-knob{transition:none} }

/* When does it fail? */
.nf-tabs{margin-bottom:6px}
.nf-title{margin:.2em 0 .1em}
.nf-set{margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
canvas.plot.nf-plot{max-height:320px}
.nf-body{margin-top:10px}
.nf-body .tbl-wrap{overflow-x:auto;margin:0 0 8px}
.nf-note{margin:6px 0 10px}
.nf-q{margin-top:8px}
.nf-done{margin:10px 0 0}
.nf-data{margin-top:14px}
.nf-data .tbl-wrap{overflow-x:auto}

/* task */
.na-conds{margin:.4em 0 0 1.2em}
.nt-k{margin:8px 0 2px}
canvas.plot.nt-plot{aspect-ratio:16/10}

/* z-table */
.na-ztbox{margin:0 0 14px}
.na-zt{border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet);padding:.5em .9em}
.na-zt > summary{cursor:pointer;font-weight:700;min-height:28px;display:flex;align-items:center}
.na-zt-in{margin-top:8px}
.na-zt-look{display:inline-flex;align-items:center;gap:8px;margin-right:10px}
.na-zt-look input{width:6em}
.na-zt-out{font-weight:700}
.na-zt-wrap{max-height:340px;overflow:auto;max-width:100%}
.na-zt-t{border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
.na-zt-t th,.na-zt-t td{border:1px solid var(--rule);padding:.15em .4em;text-align:right;white-space:nowrap}
.na-zt-t thead th{position:sticky;top:0;background:var(--paper)}
.na-zt-t tbody th{background:var(--paper)}

</style>

 marked, and the area under the curve over that bar is shaded to match it.","shape":"wide"}},"goals":["I can check whether the normal approximation is allowed (`np > 5` and `nq > 5`).","I can find the mean and standard deviation of the approximating normal distribution.","I can apply the continuity correction for ≥, >, ≤, \u003c, = and ‘between’.","I can approximate binomial probabilities using `z`-scores and the table.","I can judge how good the approximation is, and when it fails.","I can use the approximation in real contexts such as quality control and testing whether a coin is fair."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Binomial mean and SD","goal":2,"prompt":"A binomial distribution has `n = 100` and `p = 0.2`. What is its mean?","options":[{"t":"0.2","why":"Multiply by `n`.","_n":"0165","_k":"3b289aa1"},{"t":"20","why":"`np = 100 × 0.2`.","_n":"1195","_k":"09dbc11c"},{"t":"50","why":"`n ÷ 2` only works when `p = 0.5`.","_n":"2185","_k":"5d8eec61"},{"t":"80","why":"That’s the expected number of failures.","_n":"3135","_k":"77262ec3"}],"hints":["Mean of a binomial?","`μ = np`.","`100 × 0.2 = 20`."]},{"id":"w2","skill":"Binomial mean and SD","goal":2,"prompt":"For `n = 100` and `p = 0.2`, what is the standard deviation?","options":[{"t":"2","why":"`√{npq} = √16 = 4`.","_n":"4125","_k":"6673e841"},{"t":"4","why":"`√{100 × 0.2 × 0.8} = √16`.","_n":"5155","_k":"3d0c8f6c"},{"t":"16","why":"16 is the variance.","_n":"6145","_k":"7aa03231"},{"t":"20","why":"That’s `np`.","_n":"71f5","_k":"3546b2e6"}],"hints":["`σ = √{npq}`.","`npq = 100 × 0.2 × 0.8 = 16`.","`√16 = 4`."]},{"id":"w3","skill":"The z-table","goal":4,"prompt":"Use the table: `P(Z > 1.90) = ?`","options":[{"t":"0.0287","why":"`1 - 0.9713`.","_n":"81e5","_k":"4a4dd9fd"},{"t":"0.4713","why":"Subtract from 1.","_n":"96e0","_k":"5c74b369"},{"t":"0.9713","why":"‘Greater than’ needs 1 − left area.","_n":"a6f0","_k":"fa0840b2"},{"t":"1.90","why":"Look `z` up in the table.","_n":"b700","_k":"2d3b6fa8"}],"hints":["What does the table give?","The left area, 0.9713.","`1 - 0.9713 = 0.0287`."]},{"id":"w4","skill":"The z-table","goal":4,"prompt":"Use the table: `P(-1.10 \u003c Z \u003c 1.10) = ?`","options":[{"t":"0.1357","why":"That’s below −1.10.","_n":"c710","_k":"69146520"},{"t":"0.7286","why":"`0.8643 - 0.1357`.","_n":"d6a0","_k":"d19f884f"},{"t":"0.8643","why":"Remove the part below −1.10.","_n":"e6b0","_k":"f962029a"},{"t":"1.0000","why":"Subtract the left areas.","_n":"f6c0","_k":"37492c5c"}],"hints":["Find both left areas.","0.8643 and 0.1357.","Subtract: 0.7286."]},{"id":"w5","skill":"Inequality words","goal":3,"prompt":"`X` counts heads (whole numbers). Which values make ‘`X` is more than 60’ true?","options":[{"t":"60 only","why":"‘More than’ is a range of values.","_n":"g6d0","_k":"c18ec83e"},{"t":"60, 61, 62, …","why":"That’s ‘60 or more’.","_n":"h660","_k":"49758107"},{"t":"59, 60, 61, …","why":"59 isn’t more than 60.","_n":"i670","_k":"cc8c42ab"},{"t":"61, 62, 63, …","why":"‘More than 60’ excludes 60.","_n":"je00","_k":"3fa15b51"}],"hints":["Is 60 more than 60?","No.","61 and up."]},{"id":"w6","skill":"Inequality words","goal":3,"prompt":"‘At most 40 defects’ means…","options":[{"t":"`X \u003c= 40`","why":"40 is allowed, nothing above it.","_n":"kdf0","_k":"f004ecd9"},{"t":"`X \u003c 40`","why":"40 itself is allowed.","_n":"le20","_k":"c42e24de"},{"t":"`X > 40`","why":"‘At most’ means no more than.","_n":"me10","_k":"6be1af68"},{"t":"`X >= 40`","why":"‘At most’ caps the value.","_n":"ndc0","_k":"c231f28e"}],"hints":["Can there be exactly 40?","Yes.","`X \u003c= 40`."]}],"refreshers":{"Binomial mean and SD":"`μ = np`, `σ = √{npq}` with `q = 1 - p`. Choose numbers so that `npq` is a perfect square: `n = 400`, `p = 0.2` gives `npq = 64`, so `σ = 8`.","The z-table":"The table gives the left area. Right area = 1 − left; between = bigger left − smaller left.","Inequality words":"‘At least `k`’ and ‘`k` or more’ mean `>= k`. ‘More than `k`’ means `>= k + 1`. ‘At most’ and ‘no more than’ mean `\u003c= k`. ‘Fewer than `k`’ means `\u003c= k - 1`."}}},"explore":{"heading":"Overlay","intro":"Set `n` and `p`, watch how well the bell curve fits the bars, then pick an event and compare the exact answer with the approximation.","predIntro":"Make a prediction first. Then the overlay will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"over","n":10,"p":50},"prompt":"Which will the normal curve fit better: `n = 10` or `n = 100` (both `p = 0.5`)?","options":[{"t":"`n = 10`","_n":"odb0","_k":"7f711e76"},{"t":"Neither","_n":"pde0","_k":"c1373996"},{"t":"`n = 100`","_n":"qdd0","_k":"734877e9"},{"t":"Both the same","_n":"re80","_k":"470f5d2e"}],"explain":"More trials give more, narrower bars, which hug the curve."},{"id":"p2","start":{"mode":"over","n":100,"p":2},"prompt":"Will the normal curve fit this binomial well?","options":[{"t":"Yes, because `n` is large","_n":"se70","_k":"b8a86c8c"},{"t":"Yes, a normal curve always fits","_n":"tda0","_k":"cecfa206"},{"t":"Yes, because `p` is small","_n":"udb0","_k":"e9a77d94"},{"t":"No: `np = 2`, and the bars are bunched against 0 with a long right tail","_n":"vd80","_k":"ea3af29a"}],"explain":"Check `np` and `nq`, not just `n`."},{"id":"p3","start":{"mode":"corr","n":100,"p":50,"ev":"ge","k":60},"prompt":"Where should the normal area start?","options":[{"t":"59","_n":"wd90","_k":"537393c5"},{"t":"59.5","_n":"xde0","_k":"65b91431"},{"t":"60","_n":"ydf0","_k":"c99ee57c"},{"t":"60.5","_n":"zdc0","_k":"2ba94dea"}],"explain":"`X >= 60` includes the whole bar for 60."},{"id":"p4","start":{"mode":"corr","n":100,"p":50,"ev":"eq","k":50},"prompt":"Without a correction, what probability does the normal curve give for exactly 50?","options":[{"t":"0","_n":"10dd0","_k":"c1a9cba5"},{"t":"0.0796","_n":"11e20","_k":"43c71286"},{"t":"0.3989","_n":"12e30","_k":"635b6d9c"},{"t":"0.5000","_n":"135bf","_k":"a79d66a2"}],"explain":"A line has no area; the bar does. With the correction, 4 "}],"note":"The rule of thumb is cautious: for `p = 0.5` the bars are symmetric, so even small `n` fits. The rule protects you when `p` is far from 0.5.","q":"The rule says no (`np = 4`). How good is the approximation here?","opts":[{"t":"Very good: 0.1446 against an exact 0.1445","fb":"Right. Symmetric bars fit the curve well even for small `n`.","_n":"1c62f","_k":"a7c7f218"},{"t":"Poor, because `np \u003c 5`","fb":"Compare the numbers: 0.1446 against an exact 0.1445.","_n":"1dd5f","_k":"85c71541"}]}],"quickCheck":{"title":"Quick check","summary":"When it fails quick check","items":[{"id":"q1","goal":1,"prompt":"Which setting fails the conditions?","choices":[{"t":"`n = 60`, `p = 0.9`","fb":"`np = 3` for `p = 0.05`. (For `p = 0.9`, `nq = 6 > 5`.)","_n":"1ed6f","_k":"af0ab053"},{"t":"`n = 60`, `p = 0.2`","fb":"`np = 3` for `p = 0.05`. (For `p = 0.9`, `nq = 6 > 5`.)","_n":"1fd7f","_k":"d2435f79"},{"t":"`n = 60`, `p = 0.05`","fb":"Right. `np = 3`.","_n":"1gd8f","_k":"24677f4c"},{"t":"`n = 60`, `p = 0.5`","fb":"`np = 3` for `p = 0.05`. (For `p = 0.9`, `nq = 6 > 5`.)","_n":"1hd9f","_k":"381886c1"}]},{"id":"q2","goal":5,"prompt":"Why does the curve fit badly when `np` is small?","choices":[{"t":"`n` is too big","fb":"Bars pile up near 0 with a long right tail.","_n":"1idaf","_k":"3e6edbcc"},{"t":"The histogram is skewed","fb":"Right. Bars pile up near 0 with a long right tail.","_n":"1jdbf","_k":"cba86f57"},{"t":"The curve is too wide","fb":"Bars pile up near 0 with a long right tail.","_n":"1kdcf","_k":"7a0f69fc"},{"t":"The mean is 0","fb":"Bars pile up near 0 with a long right tail.","_n":"1lddf","_k":"fc894dbc"}]},{"id":"q3","goal":5,"prompt":"`n = 1000`, `p = 0.002`. Use the normal approximation?","choices":[{"t":"No","fb":"Right. `np = 2`.","_n":"1mdef","_k":"8066300f"},{"t":"Only for `X = 0`","fb":"`np = 2`. `n = 1000` with `p = 0.002` gives `np = 2`: still skewed. Check `np` and `nq`.","_n":"1n680","_k":"6518fe56"},{"t":"Only with the correction","fb":"`np = 2`. ` c 40.5`"},{"id":"r4","t":"`Y \u003c 39.5`"},{"id":"r5","t":"`49.5 \u003c Y \u003c 50.5`"},{"id":"r6","t":"`44.5 \u003c Y \u003c 55.5`"},{"id":"r7","t":"`45.5 \u003c Y \u003c 54.5`"},{"id":"r8","t":"`Y > 29.5`"}],"_a":"ThsKAEALFhAEG0oTDgMWWBdLVBNOE1hRFwNEQ1ETGEBZDUQLQEMAQBkbCgRACxYQABtKEw4HFlgXS1ATThNYVRcDRENVExhAWQFEC0BDDEBI","wrong":{"l1|r2":"≥ 60 includes the bar at 60, which starts at 59.5.","l2|r1":"> 60 starts at 61, whose bar starts at 60.5.","l4|r3":"\u003c 40 stops at 39.","l7|r6":"Strict inequalities leave out 45 and 55."},"wrongDefault":"Find the first and last whole numbers included, then go half a unit outward."},{"id":"approx","type":"numeric","title":"Approximate it","summary":"Approximate it","goal":[1,2,3,4,6],"instruction":"Use the normal approximation with the continuity correction and the `z`-table. Give probabilities to 4 decimal places. Items marked ★ are non-routine; items 5 and 6 go beyond the Final Check.","items":[{"id":"n1","goal":4,"prompt":"`n = 100`, `p = 0.5`. Approximate `P(X >= 60)`.","_a":"BRdWA1oG","tol":0.0002,"display":"0.0287","why":"`μ = 50`, `σ = 5`; `X >= 60` → `Y > 59.5`: `z = 1.90`, `1 - 0.9713 = 0.0287`.","wrong":[{"match":0.0228,"fb":"Each whole number is a bar of width 1. Use `k - 0.5` or `k + 0.5` as the boundary. Use 59.5."}],"hints":["`μ = 50`, `σ = √25 = 5`.","`X >= 60` becomes `Y > 59.5`.","`z = (59.5 - 50) ÷ 5 = 1.90`: `1 - 0.9713 = 0.0287`."]},{"id":"n2","goal":3,"prompt":"`n = 100`, `p = 0.5`. Approximate `P(X \u003c 45)`.","_a":"BRdXAlcG","tol":0.0002,"display":"0.1357","why":"`X \u003c 45` stops at 44: `Y \u003c 44.5`, `z = -1.10`, area 0.1357.","wrong":[{"match":0.1841,"fb":"`X \u003c 45` stops at 44: use 44.5."}],"hints":["Which whole numbers are included?","44 and below: the boundary is 44.5.","`z = (44.5 - 50) ÷ 5 = -1.10`: 0.1357."]},{"id":"n3","goal":2,"star":true,"prompt":"`n = 625`, `p = 0.2`. Approximate `P(X \u003c= 110)`.","_a":"BRdWBlEE","tol":0.0002,"display":"0.0735","why":"`μ = 125`, `σ = √100 = 1
