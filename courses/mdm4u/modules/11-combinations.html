.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 11: hero, Order eraser (D4 arrangement tiles + erase into stacks, Formula mode with factor tiles, Compare mode with
   D3 slate slots), At least and at most stations, The fair committee task */
/* radioGroup (from MDM4U 09 / 07) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* notation: nCr with subscripts, and the stacked binomial coefficient */
.cb-ncr sub{font-size:.68em}
.cb-bn{display:inline-flex;align-items:center;vertical-align:middle;line-height:1}
.cb-bnp{font-size:1.9em;font-weight:300;line-height:1;transform:scaleX(.8)}
.cb-bns{display:inline-flex;flex-direction:column;align-items:center;font-size:.86em;line-height:1.08;padding:0 .05em}

/* hero */
.cb-heq{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.25em .35em;justify-content:flex-start}
.cb-hdiv{display:inline-flex;align-items:center;gap:.35em;white-space:nowrap}
.cb-hbox{display:inline-flex;flex-direction:column;align-items:center;padding:.06em .4em .14em;border:2px solid var(--ink);border-radius:10px;background:var(--hi-soft)}
.cb-hbm{line-height:1.1}
.cb-hbl{max-width:7.2em;font:700 .68rem/1.15 var(--font-ui);letter-spacing:.01em;text-align:center;white-space:normal;color:var(--ink)}
.cb-halso{display:block;margin-top:.3em;font:400 .95rem var(--font-ui);color:var(--ink-2)}
.cb-halso .m{font-size:1.15em;color:var(--ink)}
.cb-h{display:grid;justify-items:center;width:100%}
.cb-hsvg{display:block;width:100%;max-width:440px;height:auto}
.cb-hav circle{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.cb-hav text{font:700 12px var(--font-ui);fill:var(--ink);text-anchor:middle}
.cb-htile rect{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.cb-htile text{font:700 13px var(--font-ui);letter-spacing:.06em;fill:var(--ink);text-anchor:middle}
.cb-hbdg rect{fill:var(--hi);stroke:var(--ink);stroke-width:1.2}
.cb-hbdg text{font:700 10.5px var(--font-ui);fill:var(--hi-ink);text-anchor:middle}
.cb-hcnt{font:400 17px var(--font-math);fill:var(--ink);text-anchor:middle}

/* Explore layout */
.cb-cap.long{font-size:clamp(1.05rem,3vw,1.45rem)}
.cb-sl .slider output{color:var(--ink)!important}
.cb-sl input[type=range]{accent-color:var(--ink)!important}
.cb-nrow{margin:2px 0 10px}
.cb-roles{margin:4px 0 6px}
.cb-btns{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.cb-btns .btn[hidden]{display:none}
.cb-msg{min-height:1.2em;margin:4px 0;font-weight:700}
.cb-aha{margin:8px 0 0;padding:6px 10px;border-left:4px solid var(--pen);background:var(--info-bg);font-size:.95rem}
.cb-aha[hidden]{display:none}
.cb-also{display:block;font-size:.85rem;color:var(--ink-2);margin-top:2px}
.cb-also .m{color:var(--ink)}
.cb-hl{background:var(--hi-soft);box-shadow:0 0 0 2px var(--sel-bd);border-radius:4px;padding:0 3px}
.pg-read .m,.cb-fv .m,.cb-cv .m{white-space:normal}

/* avatars: people A–H (chosen ones ringed in --pen) */
.cb-av{margin:2px 0 8px}
.cb-ps{display:flex;flex-wrap:wrap;gap:6px}
.cb-p{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;background:var(--sheet);color:var(--ink);font:700 .85rem var(--font-ui)}
.cb-p.sm{width:28px;height:28px;font-size:.75rem}
.cb-p.on{border:3px solid var(--pen);box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--pen)}
.cb-split{display:flex;flex-wrap:wrap;gap:8px 12px}
.cb-grp{flex:1 1 150px;padding:6px 8px;border:1.5px solid var(--rule);border-radius:10px}
.cb-grp.in{border:2px solid var(--pen)}
.cb-grp.out{border-style:dashed}
.cb-grp.out .cb-p{border-style:dashed;color:var(--ink-2)}
.cb-gl{margin:0 0 4px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.cb-split.fresh .cb-grp{animation:cbPop .5s ease}
@keyframes cbPop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* @component D4 arrangementTiles (order-eraser version): ordered tiles that slide into stacks */
.cb-lnote{margin:0 0 6px;font-size:.92rem}
.cb-tofm{margin-left:6px;vertical-align:middle}
.cb-scroll{max-height:360px;overflow:auto;padding:4px 7px 8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.cb-tiles{position:relative;min-height:6px;transition:height .45s ease}
.cb-t{position:absolute;left:0;top:0;height:28px;display:grid;place-items:center;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink);font:700 .9rem var(--font-ui);letter-spacing:.06em;opacity:0;transition:transform .7s ease,opacity .25s ease;will-change:transform}
.cb-t.in{opacity:1}
.cb-t.glow{background:var(--hi-soft);border:2px solid var(--sel-bd)}
.cb-bdg{position:absolute;left:0;top:0;z-index:300;padding:0 .45em;border:1.5px solid var(--ink);border-radius:999px;background:var(--hi);color:var(--hi-ink);font:700 .72rem/1.45 var(--font-ui);opacity:0;transition:opacity .3s ease;pointer-events:none}
.cb-bdg.in{opacity:1}
.cb-tiles.still,.cb-tiles.still .cb-t,.cb-tiles.still .cb-bdg{transition:none!important}

/* Formula mode: factor tiles (from MDM4U 06, read-only) and the step-through */
.cb-fhead{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 0 4px;font:400 1.2rem var(--font-math)}
.cb-fcap{margin:0 0 4px;font-size:.88rem;color:var(--ink-2)}
.cb-fwrap{overflow-x:auto;padding:4px 2px 6px}
.cb-frac{display:inline-flex;flex-direction:column;align-items:flex-end;min-width:max-content}
.cb-frow{display:flex;justify-content:flex-end;gap:3px;align-items:center}
.cb-fbar{align-self:stretch;border-top:2.5px solid var(--ink);margin:5px 0}
.cb-ft{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:30px;padding:0 4px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem var(--font-math);white-space:nowrap}
.cb-ft.x{color:var(--ink-2);border-color:var(--rule)}
.cb-ft.x::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:8px;margin-top:-4px;background:var(--hi-soft);border-top:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);opacity:.85;pointer-events:none}
.cb-fsep{font:400 1.1rem var(--font-math);padding:0 2px}
.cb-steps{margin:8px 0 6px;padding-left:1.6em}
.cb-steps li{margin:0 0 6px;color:var(--ink-2)}
.cb-steps li.on{color:var(--ink)}
.cb-sl1{display:block;font-size:1.12rem;overflow-x:auto}
.cb-snote{display:block;font-size:.85rem}
.cb-stepper{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* Compare mode: slates (D3 slots) | bracket | committees */
.cb-cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.cb-pan{min-width:0;padding:8px 10px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.cb-pan.act{border:2.5px solid var(--ink);box-shadow:0 0 0 3px var(--hi-soft)}
.cb-pan h4{margin:0 0 2px;font-size:1rem}
.cb-tagp{font-size:.75rem;font-weight:700;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:0 .5em;vertical-align:middle}
.cb-pv{margin:0 0 4px;font-size:1.02rem}
.cb-sfor{margin:6px 0 2px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.cb-stbl .tbl-wrap{max-height:200px;overflow:auto}
.cb-stbl table{font-size:.85rem}
.cb-brk{display:flex;align-items:center;justify-content:center;width:34px;border-left:2.5px solid var(--ink);border-right:2.5px solid var(--ink);border-radius:14px}
.cb-brk span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.82rem;font-weight:700;white-space:nowrap}
.cb-cl{display:flex;flex-wrap:wrap;gap:4px;max-height:220px;overflow:auto;padding:2px}
.cb-cb{min-height:32px;padding:0 .55em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:700 .82rem var(--font-ui);letter-spacing:.02em}
.cb-cb.on{background:var(--hi-soft);border:2px solid var(--sel-bd)}

/* @component D3 countingSlots (case-row version, from MDM4U 09) */
.cb-srow{margin:4px 0 2px}
.cb-slab{margin:0 0 3px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.cb-slots{display:flex;flex-wrap:wrap;gap:5px}
.cb-slot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;max-width:120px;padding:4px 5px 5px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);text-align:center}
.cb-slot.lk{border:2px solid var(--ink)}
.cb-slot.hi{background:var(--hi-soft);border-color:var(--sel-bd)}
.cb-badge{max-width:100%;padding:0 .45em;border:1.5px solid var(--ink);border-radius:999px;font-size:.68rem;font-weight:700;line-height:1.45;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-n{font:700 1.35rem/1.05 var(--font-math);color:var(--ink)}
.cb-cw{font-size:.68rem;color:var(--ink-2);line-height:1.2}
.cb-sprod{margin:3px 0 0;min-height:1em;font:400 .98rem var(--font-math);color:var(--ink-2)}

/* Your 28 list */
.cb-found{margin:12px 0 0;padding:8px 10px;border:1.5px dashed var(--rule);border-radius:10px}
.cb-flab{margin:0 0 6px;font-size:.9rem;font-weight:700}
.cb-fchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.cb-fc{min-height:34px}

/* Part 3: At least and at most */
.al-tabs{margin-bottom:10px}
.al-tick{color:var(--green);font-weight:700}
.al-card{margin:0 0 10px;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--sheet)}
.al-lab{display:block;font-size:.8rem;font-weight:700;letter-spacing:.02em;color:var(--ink-2)}
.al-prob{margin:4px 0 0;font-size:1.05rem}
.al-club{display:flex;flex-wrap:wrap;gap:8px 14px;margin:0 0 10px}
.al-side{flex:1 1 200px}
.al-sl{margin:0 0 4px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.al-toks{display:flex;flex-wrap:wrap;gap:4px}
.al-tok{display:inline-flex;align-items:baseline;gap:3px;min-height:30px;padding:3px 8px;border:2px solid var(--ev-a);border-radius:999px;background:var(--ev-a-soft);color:var(--ink);font:700 .82rem var(--font-ui)}
.al-tok small{font-size:.66rem;font-weight:700;color:var(--ink-2)}
.al-tok.b{border-color:var(--ev-b);background:var(--ev-b-soft)}
.al-tok.sm{min-height:24px;padding:1px 6px;font-size:.72rem}
button.al-tok{cursor:pointer;min-height:36px;background:var(--sheet);border-style:dashed}
button.al-tok.on{border-style:solid;background:var(--ev-a-soft);box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ev-a)}
button.al-tok.b.on{background:var(--ev-b-soft);box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ev-b)}
.al-routes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.al-route{padding:8px 10px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.al-route h4{margin:0 0 2px}
.al-cchips,.al-cbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.al-cchips .chip,.al-cbtns .chip{min-height:36px}
.al-rows{margin:6px 0;padding-left:1.4em}
.al-rows li{margin:0 0 3px}
.al-cl{font-weight:700}
.al-tot{margin:4px 0 0;font-size:.98rem}
.al-nudge{margin:6px 0 0;padding:6px 10px;border-left:4px solid var(--hi);background:var(--hi-soft)}
.al-bars{margin:10px 0}
.al-bl{margin:6px 0 2px;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.al-bar{display:flex;height:24px;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;background:var(--paper)}
.al-seg{display:flex;align-items:center;justify-content:center;min-width:0;height:100%;overflow:hidden;font:700 .74rem var(--font-ui);transition:width .4s ease}
.al-seg span{white-space:nowrap;padding:0 2px}
.al-seg + .al-seg{border-left:1.5px solid var(--ink)}
.al-seg.a1{background:var(--ev-a);color:var(--sheet)}
.al-seg.a2{background:var(--ev-a-soft);color:var(--ink)}
.al-seg.a3{background:var(--ev-a);color:var(--sheet);opacity:.75}
.al-seg.a4{background:var(--ev-a-soft);color:var(--ink)}
.al-seg.all{background:var(--ev-a);color:var(--sheet)}
.al-seg.none{background:repeating-linear-gradient(135deg,var(--ev-b) 0 3px,var(--ev-b-soft) 3px 7px);color:var(--ink)}
.al-seg.none span{background:var(--sheet);border-radius:3px}
.al-seg.rest{background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 7px);color:var(--ink-2)}
.al-seg.over{background:var(--hi);color:var(--hi-ink)}
.al-done{margin:8px 0;padding:6px 10px;border-left:4px solid var(--green);background:var(--good-bg)}
.al-claim{margin:0 0 10px;padding:8px 12px;border-left:4px solid var(--ink-2);background:var(--paper)}
.al-claim p{margin:0}
.al-step{margin:6px 0}
.al-msg{color:var(--red);font-weight:700}
.al-trace{margin:6px 0 10px;padding:8px 10px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.al-trace h4{margin:0 0 4px;font-size:.98rem}
.al-lines{margin:4px 0;padding-left:1.4em}
.al-lines li{margin:0 0 4px;padding:2px 6px;border-radius:5px}
.al-lines li.dbl{background:var(--hi-soft);border:1.5px solid var(--sel-bd)}
.al-gtag{font-size:.75rem;font-weight:700;border:1px solid var(--ink-2);border-radius:999px;padding:0 .45em;color:var(--ink-2)}
.al-verdict{margin:4px 0 0}
.al-verdict.bad strong{color:var(--red)}
.al-imp{margin:6px 0 8px}

/* Performance task */
.cb-conds{margin:6px 0 10px;padding-left:1.4em}
.fc-sl .slider output{font-weight:700}
.fc-toks{margin:0 0 8px}
.fc-read{margin:0}

/* phone */
@media (max-width:640px){
  .cb-cmp{grid-template-columns:minmax(0,1fr)}
  .cb-brk{width:auto;padding:5px 0;border:0;border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);border-radius:14px}
  .cb-brk span{writing-mode:horizontal-tb;transform:none;white-space:normal;text-align:center}
  .cb-scroll{max-height:320px}
  .cb-ft{min-width:24px;height:28px;padding:0 3px;font-size:.92rem}
  .cb-p{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){
  .cb-t,.cb-bdg,.cb-tiles,.al-seg{transition:none!important}
  .cb-split.fresh .cb-grp{animation:none}
}

cy Distributions & Histograms","kind":"topic","group":"5"},{"nn":"34","slug":"scatter-plots","title":"Scatter Plots & Correlation","kind":"topic","group":"6"},{"nn":"35","slug":"pearson-r","title":"The Pearson Correlation Coefficient r","kind":"topic","group":"6"},{"nn":"36","slug":"linear-regression","title":"Linear Regression & Line of Best Fit","kind":"topic","group":"6"},{"nn":"37","slug":"residuals","title":"Residuals & Goodness of Fit","kind":"topic","group":"6"},{"nn":"38","slug":"causation","title":"Two-Variable Analysis & Causation","kind":"topic","group":"6"},{"nn":"39","slug":"culminating-investigation","title":"Culminating Data-Management Investigation","kind":"topic","group":"7"}]},"salt":"da623a0c","content":{"id":"11-combinations","kind":"topic","title":"Combinations: counting without order","topic":"Combinations: Counting Without Order","readyTopic":"combinations","hero":{"eq":"\u003cspan class=\"cb-heq\">`C(n, r) = P(n, r)` \u003cspan class=\"cb-hdiv\">÷ \u003cspan class=\"cb-hbox\">\u003cspan class=\"cb-hbm\">`r!`\u003c/span>\u003cspan class=\"cb-hbl\">orderings of each group\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"cb-halso\">also written \u003cspan class=\"m cb-ncr\">\u003csub>\u003ci>n\u003c/i>\u003c/sub>C\u003csub>\u003ci>r\u003c/i>\u003c/sub>\u003c/span> or \u003cspan class=\"m cb-bn\" aria-hidden=\"true\">\u003cspan class=\"cb-bnp\">(\u003c/span>\u003cspan class=\"cb-bns\">\u003cspan>\u003ci>n\u003c/i>\u003c/span>\u003cspan>\u003ci>r\u003c/i>\u003c/span>\u003c/span>\u003cspan class=\"cb-bnp\">)\u003c/span>\u003c/span>\u003c/span>","eqLabel":"C of n, r equals P of n, r divided by r factorial, the orderings of each group. Also written n C r, or n over r in brackets.","eqSize":"sm","headline":"Same people, same committee","text":"A \u003cstrong>combination\u003c/strong> counts selections where \u003cstrong>order doesn’t matter\u003c/strong>. List the ordered selections, notice that each group shows up `r!` times, and divide: that’s \u003cstrong>`C(n, r)`\u003c/strong>, read ‘`n` choose `r`’.","fig":{"html":"\u003cdiv class=\"cb-h\" role=\"img\" aria-label=\"Five people, A, B, C, D and E, sit in a row. Twenty tiles appear, one for each ordered pair: AB, BA, AC, CA and so on. Tiles with the same two letters slide together into stacks of 2, and each stack gets a badge ×2!. Ten stacks remain: 20 ordered pairs ÷ 2! = 10 committees.\">\u003csvg class=\"cb-hsvg\" id=\"cb-hsvg\" viewBox=\"0 0 360 230\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003c/div>"}},"goals":["I can decide whether order matters and choose between a permutation and a combination.","I can explain and use `C(n, r) = P(n, r) ÷ r! = n! ÷ [r!(n - r)!]`.","I can evaluate combinations by hand by cancelling factorials.","I can solve “at least” and “at most” problems by cases or by the complement.","I can solve for `n` when a combination’s value is given.","I can count selections from two groups with conditions, such as “exactly 2 from each group”."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Factorials","goal":3,"prompt":"Evaluate `6! ÷ (4! × 2!)`.","options":[{"t":"3","why":"That divides 6 by 2. Factorials aren’t the numbers themselves.","_n":"0787","_k":"efb7a2b5"},{"t":"15","why":"720 ÷ (24 × 2) = 15.","_n":"1777","_k":"8cdb1c44"},{"t":"30","why":"That ignores the `2!`. `6! ÷ 4!` = 30; you still divide by `2! = 2`.","_n":"2767","_k":"fa13d10d"},{"t":"360","why":"That ignores the `4!`. `6! ÷ 2!` = 360.","_n":"3757","_k":"9a68d82b"}],"hints":["Cancel `4!` from `6!`.","`6! ÷ 4!` = 6 × 5 = 30.","30 ÷ `2!` = 15."]},{"id":"w2","skill":"Factorials","goal":3,"prompt":"Simplify `10! ÷ 8!`.","options":[{"t":"`5/4`","why":"That divides 10 by 8. Cancel the common `8!`.","_n":"4747","_k":"e785e23d"},{"t":"2","why":"That subtracts. `10! ÷ 8!` isn’t `(10 - 8)!`.","_n":"5737","_k":"ca7659e7"},{"t":"80","why":"That multiplies 10 × 8. `10! = 10 × 9 × 8!`.","_n":"6727","_k":"c88283c5"},{"t":"90","why":"10 × 9 × `8! ÷ 8!` = 90.","_n":"7817","_k":"b277f4e5"}],"hints":["Write `10!` as `10 × 9 × 8!`.","The `8!` cancels.","90."]},{"id":"w3","skill":"Permutations","goal":1,"prompt":"In how many ways can gold, silver and bronze be awarded among 7 runners?","options":[{"t":"21","why":"That multiplies 7 × 3, which isn’t a counting rule: 7 choices for gold, then 6 for silver, then 5 for bronze.","_n":"8807","_k":"3897ec98"},{"t":"35","why":"That ignores order. Gold-silver-bronze are different prizes, so order matters.","_n":"9fce","_k":"129ee996"},{"t":"210","why":"`P(7, 3)` = 7 × 6 × 5.","_n":"afde","_k":"fc73cffe"},{"t":"343","why":"That allows repeats. One runner can’t win two medals.","_n":"bfae","_k":"a271ea37"}],"hints":["How many choices for gold?","7, then 6 for silver, then 5.","210."]},{"id":"w4","skill":"Permutations","goal":2,"prompt":"Evaluate `P(8, 2)`.","options":[{"t":"16","why":"That’s 8 × 2. `P(8, 2)` = 8 × 7.","_n":"cfbe","_k":"8fe3edbd"},{"t":"28","why":"That divides by 2: 28 is `C(8, 2)`, not `P(8, 2)`.","_n":"d00e","_k":"6152fc0a"},{"t":"56","why":"8 × 7.","_n":"e01e","_k":"fe33d025"},{"t":"64","why":"`8^2` allows repeats.","_n":"ffee","_k":"8c510d47"}],"hints":["`P(n, r) = n! ÷ (n - r)!`.","`8! ÷ 6!`.","56."]},{"id":"w5","skill":"And vs or","goal":6,"prompt":"A café offers 4 soups and 3 salads. In how many ways can you choose a soup \u003cstrong>and\u003c/strong> a salad?","options":[{"t":"7","why":"That adds for “and”. A soup \u003cstrong>and\u003c/strong> a salad is two stages: multiply.","_n":"gffe","_k":"c46c5245"},{"t":"12","why":"4 × 3: two stages.","_n":"h04e","_k":"8e066b95"},{"t":"24","why":"That doubles for order. Soup and salad isn’t an ordered pair of the same kind.","_n":"i05e","_k":"7515ae4a"},{"t":"81","why":"That’s `3^4`. Each stage happens once.","_n":"j16e","_k":"ed39edf1"}],"hints":["Two stages: multiply.","4 soups × 3 salads.","12."]},{"id":"w6","skill":"And vs or","goal":4,"prompt":"Same café. In how many ways can you choose \u003cstrong>either\u003c/strong> one soup \u003cstrong>or\u003c/strong> one salad (just one item)?","options":[{"t":"1","why":"You choose one item, but there are 7 items to choose from.","_n":"k15e","_k":"797e2783"},{"t":"7","why":"4 + 3: the choices don’t overlap.","_n":"l14e","_k":"3c8091ce"},{"t":"12","why":"That multiplies for “or”. One item from separate menus: add.","_n":"m13e","_k":"73170287"},{"t":"14","why":"That doubles. One item from 4 soups or 3 salads: 4 + 3.","_n":"n12e","_k":"1affa491"}],"hints":["Is it one stage or two?","One item from two separate menus.","4 + 3 = 7."]}],"refreshers":{"Factorials":"`n! = n × (n - 1) × … × 1`. To simplify a ratio, write the larger one down to the smaller and cancel: `10!/8!` = 10 × 9.","Permutations":"`P(n, r) = n!/(n - r)!` counts \u003cstrong>ordered\u003c/strong> selections of `r` from `n`: `P(8, 3)` = 8 × 7 × 6.","And vs or":"‘And’ (stages one after another): multiply. ‘Or’ (one choice from separate options): add."}}},"explore":{"heading":"Order eraser","intro":"List every ordered selection, then erase the order. Watch how many ordered lists collapse into each committee.","predIntro":"Make a prediction first. Then the order eraser will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"list","n":5,"r":2},"prompt":"How many 2-person committees can be made from 5 people?","options":[{"t":"5","_n":"o11e","_k":"07aca55b"},{"t":"10","_n":"p10e","_k":"a6220c0e"},{"t":"20","_n":"q0fe","_k":"a1fa6081"},{"t":"25","_n":"r0ee","_k":"e8cd1ee9"}],"explain":"AB and BA are the same committee. 20 ordered ÷ `2!` = 10."},{"id":"p2","start":{"mode":"list","n":4,"r":3},"prompt":"In the ordered list, how many times does the committee {A, B, C} appear?","options":[{"t":"3","_n":"s0de","_k":"ff4d2591"},{"t":"4","_n":"t90e","_k":"b580138d"},{"t":"6","_n":"u91e","_k":"df786cc6"},{"t":"24","_n":"v92e","_k":"d4339a31"}],"explain":"3 people can be ordered in `3! = 6` ways."},{"id":"p3","start":{"mode":"formula","n":6,"r":2},"prompt":"Which is larger: `C(6, 2)` or `C(6, 4)`?","options":[{"t":"It depends on the people","_n":"w93e","_k":"a397470d"},{"t":"`C(6, 4)`","_n":"x8ce","_k":"611a85a5"},{"t":"They’re equal","_n":"y8de","_k":"a90a68bc"},{"t":"`C(6, 2)`","_n":"z8ee","_k":"383daa89"}],"explain":"Choosing 2 to serve is the same as choosing 4 to stay home."},{"id":"p4","start":{"mode":"list","n":5,"r":5},"prompt":"How many committees use all 5 people?","options":[{"t":"0","_n":"108fe","_k":"fa3a0279"},{"t":"1","_n":"1188e","_k":"820d25a9"},{"t":"5","_n":"1289e","_k":"d94b0bb8"},{"t":"120","_n":"138ad","_k":"f84880ca"}],"explain":"`C(5, 5) = {5!}/{5! 0!} = 1`: there’s only one way to choose everyone."}],"chalIntro":"Set up the order eraser, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,5],"prompt":"Set `n` and `r` so there are exactly \u003cstrong>35\u003c/strong> committees.","why":"`C(7, 3) = {7 × 6 × 5}/{6}` = 35, and `C(7, 4)` = 35 too: choosing 3 to serve = choosing 4 to leave out.","hints":["Try `n = 7` and change `r`.","`C(7, 3) = {7 × 6 × 5}/{6}`.","35: (7, 3), and also (7, 4)."]},{"id":"tc2","goal":[2,5],"prompt":"Find `n` and `r` where each committee matches exactly \u003cstrong>6\u003c/strong> slates and there are \u003cstrong>20\u003c/strong> committees.","why":"`r! = 6` means `r = 3`, and `C(6, 3) = 120/6 = 20`.","hints":["`r! = 6` tells you `r`.","`r = 3`; now find `n` with `C(n, 3) = 20`.","`C(6, 3) = 120/6 = 20`."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"With `2 \u003c= n \u003c= 8` and `1 \u003c= r \u003c= n - 1`, find \u003cstrong>every\u003c/strong> setting that gives exactly \u003cstrong>28\u003c/strong> committees. Put each one on \u003cstrong>Your 28 list\u003c/strong> with \u003cstrong>Add this setting\u003c/strong>.","why":"`C(8, 2) = 28` and its partner `C(8, 6) = 28`: choosing 2 of 8 to serve = choosing 6 of 8 to leave out.","hints":["`C(n, 2) = n(n - 1)/2`. Which `n` gives 28?","`n = 8`: 8 × 7/2 = 28.","Choosing 2 to serve = choosing 6 to leave out, so (8, 6) works too."]}]},"part3":{"slug":"at-least","name":"At least","heading":"At least and at most","intro":"“At least” and “at most” questions are where combinations meet the additive principle. At each station, build the count by cases or by the complement, then watch what goes wrong with the “guarantee one first” shortcut.","stations":[{"id":"s1","title":"Two routes to “at least one”","problem":"A committee of 4 is chosen from 5 grade 11s and 6 grade 12s. How many include at least one grade 11?","zero":"A committee with 0 grade 11s has no grade 11, so it isn’t part of “at least one”. It’s the case the complement route subtracts.","done":"Both routes give 315."},{"id":"s2","title":"“At most”","problem":"A committee of 3 is chosen from 4 teachers and 6 students. How many have at most one teacher?","tooMany":"“At most one” stops at 1 teacher: this case has too many teachers.","missing":"Have you included every case that “at most one” allows? It includes 0 teachers too.","done":"0 teachers + 1 teacher: 20 + 60 = 80 (out of `C(10, 3)` = 120)."},{"id":"s3","title":"The double-count trap","problem":"Same club as Station 1: a committee of 4 is chosen from 5 grade 11s and 6 grade 12s. How many include at least one grade 11?","claim":"Pick 1 grade 11 to guarantee one (5 ways), then any 3 of the other 10 (`C(10, 3) = 120`): 600.","impossible":"600 is bigger than the total 330, which is impossible.","m3":"Picking ‘the’ grade 11 first counts a committee with two grade 11s twice. Use cases or the complement.","done":"Every committee with two or more grade 11s is counted more than once."}],"quickCheck":{"title":"Quick check","summary":"At least and at most quick check","items":[{"id":"q1","goal":1,"prompt":"How many 3-person committees from 7 people?","choices":[{"t":"21","fb":"7 × 3 isn’t a counting rule. 210 is `P(7, 3)`; divide by `3! = 6`.","_n":"1489d","_k":"cab4d175"},{"t":"35","fb":"Right. `C(7, 3)` = 210 ÷ 6 = 35.","_n":"158cd","_k":"23fe7731"},{"t":"210","fb":"210 is `P(7, 3)`; divide by `3! = 6`.","_n":"168bd","_k":"a9099cfc"},{"t":"343","fb":"`7^3` lets one person be chosen twice. 210 is `P(7, 3)`; divide by `3! = 6`.","_n":"178ed","_k":"d73a05fa"}]},{"id":"q2","goal":4,"prompt":"Groups of 3 from 4 girls and 5 boys with at least one girl?","choices":[{"t":"10","fb":"10 is the all-boy groups, the ones to remove. `C(9, 3) - C(5, 3)` = 84 − 10.","_n":"188dd","_k":"010bff14"},{"t":"74","fb":"Right. `C(9, 3) - C(5, 3)` = 84 − 10 = 74.","_n":"1990d","_k":"f7f1fd11"},{"t":"84","fb":"84 is every group, including the all-boy ones. `C(9, 3) - C(5, 3)` = 84 − 10.","_n":"1a8fd","_k":"a350aaf7"},{"t":"94","fb":"That adds the all-boy groups. `C(9, 3) - C(5, 3)` = 84 − 10.","_n":"1b82d","_k":"bcc543e8"}]},{"id":"q3","goal":1,"prompt":"Which is a combination question?","choices":[{"t":"A 3-digit PIN","fb":"123 and 321 are different PINs, so order matters. Toppings have no order.","_n":"1c81d","_k":"b5e2ac4a"},{"t":"Ranking 3 songs","fb":"First place and second place are different, so order matters. Toppings have no order.","_n":"1d84d","_k":"43b16e48"},{"t":"Gold, silver, bronze","fb":"Different medals make order matter. Toppings have no order.","_n":"1e85d","_k":"87fd7f00"},{"t":"Choosing 3 toppings","fb":"Right. Toppings have no order.","_n":"1f82d","_k":"67a3ca0f"}]},{"id":"q4","goal":4,"prompt":"Teams of 3 from 4 boys and 4 girls with at most one boy?","choices":[{"t":"4","fb":"That’s only the 0-boy teams. 0 boys: `C(4, 3) = 4`; 1 boy: 4 × `C(4, 2)` = 24; total 28.","_n":"1g83d","_k":"caf00b94"},{"t":"24","fb":"That’s only the 1-boy teams. 0 boys: `C(4, 3) = 4`; 1 boy: 4 × `C(4, 2)` = 24; total 28.","_n":"1h80d","_k":"9bc03140"},{"t":"28","fb":"Right. 0 boys: `C(4, 3) = 4`; 1 boy: 4 × `C(4, 2)` = 24; total 28.","_n":"1i81d","_k":"529c7d0b"},{"t":"56","fb":"56 is `C(8, 3)`, every team. 0 boys: `C(4, 3) = 4`; 1 boy: 4 × `C(4, 2)` = 24; total 28.","_n":"1j7ed","_k":"c6a40f26"}]}]}},"practice":{"activities":[{"id":"order","type":"sorter","title":"Does order matter?","summary":"Does order matter?","goal":1,"noun":"situation","txt":true,"instruction":"Sort each situation. If you swap two of the chosen items, do you get a different outcome?","boxes":[{"id":"perm","label":"Permutation","sub":"order matters"},{"id":"comb","label":"Combination","sub":"order doesn’t matter"}],"wrongDefault":"Ask: if I swap two chosen items, is it a different outcome? Try another box.","items":[{"id":"i1","t":"Choosing 3 toppings for a pizza","_a":"RgJZX1FD","why":"The same toppings in any order make the same pizza.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Combination (order doesn’t matter).\u003c/strong> The same toppings in any order make the same pizza."]},{"id":"i2","t":"Electing a president, a vice-president and a secretary","_a":"RhFTQF5D","why":"The roles are different: swapping two people changes the slate.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Permutation (order matters).\u003c/strong> The roles are different: swapping two people changes the slate."]},{"id":"i3","t":"Dealing a 5-card hand","_a":"RgJZX1FD","why":"A hand is the same whatever order the cards were dealt in.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Combination (order doesn’t matter).\u003c/strong> A hand is the same whatever order the cards were dealt in."]},{"id":"i4","t":"Setting a 4-digit PIN with no repeated digits","_a":"RhFTQF5D","why":"1234 and 4321 are different PINs.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Permutation (order matters).\u003c/strong> 1234 and 4321 are different PINs."]},{"id":"i5","t":"Picking 2 of 9 friends to invite to a movie","_a":"RgJZX1FD","why":"Inviting Sam and Lee is the same as inviting Lee and Sam.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Combination (order doesn’t matter).\u003c/strong> Inviting Sam and Lee is the same as inviting Lee and Sam."]},{"id":"i6","t":"Arranging 4 of 10 books on a shelf","_a":"RhFTQF5D","why":"A shelf has a left end and a right end: swapping two books changes the arrangement.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Permutation (order matters).\u003c/strong> A shelf has a left end and a right end: swapping two books changes the arrangement."]},{"id":"i7","t":"Choosing 5 starters from 12 players (positions not assigned)","_a":"RgJZX1FD","why":"No positions are assigned, so it’s just a group.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Combination (order doesn’t matter).\u003c/strong> No positions are assigned, so it’s just a group."],"wrong":{"perm":"No positions are assigned, so it’s just a group."}},{"id":"i8","t":"Giving 3 different prizes to 3 of 20 entrants","_a":"RhFTQF5D","why":"First prize and third prize aren’t the same; swapping winners changes the outcome.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Permutation (order matters).\u003c/strong> First prize and third prize aren’t the same; swapping winners changes the outcome."],"wrong":{"comb":"First prize and third prize aren’t the same; swapping winners changes the outcome."}},{"id":"i9","t":"Choosing 6 numbers for a lottery ticket","_a":"RgJZX1FD","why":"A ticket with 3-12-27-30-41-45 wins however the numbers are drawn: order doesn’t matter. (A lottery is a probability model here, not advice: on average, players lose money.)","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Combination (order doesn’t matter).\u003c/strong> A ticket with 3-12-27-30-41-45 wins however the numbers are drawn: order doesn’t matter. (A lottery is a probability model here, not advice: on average, players lose money.)"],"wrong":{"perm":"A ticket with 3-12-27-30-41-45 wins however the numbers are drawn: order doesn’t matter."}},{"id":"i10","t":"Ranking your top 3 songs from 15","_a":"RhFTQF5D","why":"First place and second place are different ranks.","hints":["Swap two of the chosen items. Is it a new outcome?","Roles, ranks or positions mean order matters.","\u003cstrong>Permutation (order matters).\u003c/strong> First place and second place are different ranks."]}]},{"id":"count","type":"numeric","title":"Count it","summary":"Count it","goal":[2,3,4,5,6],"star":true,"instruction":"Count the selections. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a whole number, then press Check.","items":[{"id":"c1","goal":3,"prompt":"Evaluate `C(9, 4)`.","_a":"VVMA","display":"126","label":"Your answer:","why":"`C(9, 4) = {9 × 8 × 7 × 6}/{4 × 3 × 2 × 1}` = 3024 ÷ 24 = 126.","wrong":[{"match":3024,"fb":"That’s `P(9, 4)`; divide by `4! = 24`."},{"match":36,"fb":"`C(9, 4)` isn’t 9 × 4: it counts groups. Use `n! ÷ [r!(n - r)!]`."}]},{"id":"c2","goal":2,"prompt":"A pizza place has 10 toppings. How many 3-topping pizzas?","_a":"VVMG","display":"120","label":"Your answer:","why":"`C(10, 3) = {10 × 9 × 8}/{3 × 2 × 1}` = 720 ÷ 6 = 120.","wrong":[{"match":720,"fb":"720 counts ordered picks. {mushroom, olive, pepper} and {pepper, mushroom, olive} are the same pizza. Count it once: divide by `3!`."},{"match":30,"fb":"`C(10, 3)` isn’t 10 × 3: it counts groups. Use `n! ÷ [r!(n - r)!]`."}]},{"id":"c3","goal":6,"star":true,"prompt":"A committee of 5 is chosen from 6 women and 4 men. How many have exactly 2 men?","_a":"VVMG","display":"120","label":"Your answer:","why":"Choose the 2 men and the 3 women: `C(4, 2) × C(6, 3)` = 6 × 20 = 120.","wrong":[{"match":21,"fb":"6 + 15? Choosing 2 men \u003cstrong>and\u003c/strong> 3 women: multiply `C(4, 2) × C(6, 3)`."},{"match":26,"fb":"6 + 20 adds the stages. Choosing 2 men \u003cstrong>and\u003c/strong> 3 women: multiply `C(4, 2) × C(6, 3)`."}]},{"id":"c4","goal":4,"star":true,"prompt":"Same group. How many committees of 5 include at least one man?","_a":"VlUA","display":"246","label":"Your answer:","why":"Total `C(10, 5)` = 252; no men `C(6, 5)` = 6; 252 − 6 = 246.","wrong":[{"match":258,"fb":"Subtract the all-women committees: 252 − 6."},{"match":252,"fb":"252 is every committee, including the 6 with no men. Subtract them: 252 − 6."}],"hints":["‘At least one man’ is easier as total − none.","Total `C(10, 5)` = 252; no men `C(6, 5)` = 6.","246."]},{"id":"c5","goal":5,"star":true,"prompt":"At a party everyone shakes hands once with everyone else: 15 handshakes. How many people?","_a":"Ug==","display":"6 people","label":"Number of people:","why":"`C(n, 2) = {n(n - 1)}/{2}` = 15, so `n(n - 1) = 30` = 6 × 5: 6 people.","wrong":[{"match":15,"fb":"15 is the number of handshakes: solve `C(n, 2) = 15`."},{"match":30,"fb":"`n(n - 1)/2 = 15`, so `n(n - 1) = 30`."}]},{"id":"c6","goal":6,"star":true,"prompt":"How many diagonals does a 10-sided polygon have?","_a":"V1Q=","display":"35","label":"Your answer:","why":"`C(10, 2)` = 45 segments join two corners; 10 of them are sides, so 45 − 10 = 35 diagonals.","wrong":[{"match":45,"fb":"`C(10, 2) = 45` counts every segment joining two corners, including the 10 sides."}],"hints":["Any two corners make a segment.","`C(10, 2)` = 45 segments.","45 − 10 sides = 35."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Kalinda","how":"","goal":[1,3,4],"instruction":"Kalinda made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"In how many ways can 3 class reps be chosen from 8 students? (All reps have the same role.)","steps":["The reps are picked one at a time, so order matters.","`P(8, 3)` = 8 × 7 × 6 = 336."],"_a":"VA==","stepFb":["","Step 2 calculates `P(8, 3)` correctly. The mistake is earlier."],"fixes":[{"t":"`8^3` = 512.","why":"A student can’t be chosen twice.","_n":"1k7fd","_k":"215619f4"},{"t":"The reps share one role, so order doesn’t matter: `C(8, 3)` = 336 ÷ `3!` = 56.","why":"One role means a group is a group: each group of 3 appears `3! = 6` times among the 336 ordered picks.","_n":"1l8cd","_k":"95ed1a04"},{"t":"Step 1 is correct.","why":"Choosing Ana, then Ben, then Cy gives the same reps as Cy, Ben, Ana.","_n":"1m8dd","_k":"cd7691f9"},{"t":"8 × 3 = 24.","why":"That isn’t a counting formula.","_n":"1n7ed","_k":"9a3b03ea"}],"hints":["Do the reps have different jobs?","No, so a group is a group.","56."]},{"id":"e2","goal":4,"task":"How many 3-person committees from 4 grade 11s and 5 grade 12s include at least one grade 12?","steps":["All committees: `C(9, 3)` = 84.","Committees with no grade 12s: `C(4, 3)` = 4.","At least one grade 12: 84 + 4 = 88."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.",""],"fixes":[{"t":"84 − 4 = 80.","why":"‘At least one’ = total − ‘none’, not total + ‘none’. Remove the 4 committees with no grade 12s.","_n":"1o7dd","_k":"3f61dda5"},{"t":"Step 3 is correct.","why":"88 is more than the 84 committees that exist.","_n":"1p7cd","_k":"ea80d74e"},{"t":"4 × 5 = 20.","why":"That’s not a committee count.","_n":"1q7bd","_k":"91221876"},{"t":"`C(5, 1) × C(8, 2)` = 140.","why":"That guarantees one, then double-counts.","_n":"1r82d","_k":"444126d8"}],"hints":["Can ‘at least one’ be more than the total?","Remove the committees you don’t want.","84 − 4 = 80."]},{"id":"e3","goal":3,"task":"Evaluate `C(10, 4)`.","steps":["`C(10, 4) = 10! ÷ (4! × 6!)`.","= (10 × 9 × 8 × 7) ÷ 4 = 1260.","So `C(10, 4)` = 1260."],"_a":"VQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"Each group of 4 appears `4! = 24` times in the ordered list, not 4 times.","_n":"1s81d","_k":"aed16ffa"},{"t":"10 × 4 = 40.","why":"`C(10, 4)` isn’t 10 × 4: it counts groups. Use `n! ÷ [r!(n - r)!]`.","_n":"1t80d","_k":"450078cc"},{"t":"`10! ÷ 6!` = 5040.","why":"That’s `P(10, 4)`, the ordered count.","_n":"1u7fd","_k":"d96a7ac6"},{"t":"(10 × 9 × 8 × 7) ÷ (4 × 3 × 2 × 1) = 5040 ÷ 24 = 210.","why":"The `6!` cancels, and what’s left is divided by all of `4! = 24`.","_n":"1v86d","_k":"aee2a2ab"}],"hints":["What does `4!` equal?","24, not 4.","5040 ÷ 24 = 210."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the order eraser: how many ordered lists collapse into one committee, or that `C(6, 2) = C(6, 4)`?"},{"id":"j2","q":"In your own words, why do we divide by `r!` to get from permutations to combinations?"},{"id":"j3","q":"Explain to a friend how to count ‘at least one’ without double-counting."},{"id":"j4","q":"Which kind of question still trips you up (order or no order, ‘at least’, two groups)? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"In how many ways can 3 people be chosen from 8 to form a committee?","options":[{"t":"24","why":"8 × 3 isn’t a combination.","_n":"1w85d","_k":"61cc9bca"},{"t":"56","why":"`C(8, 3)` = 336 ÷ 6.","_n":"1xf8d","_k":"41c787cd"},{"t":"336","why":"That counts ordered slates. In a committee, {Ana, Ben, Cy} and {Cy, Ana, Ben} are the same group. Count it once: divide by `3!`.","_n":"1yf9d","_k":"30331bb6"},{"t":"512","why":"`8^3` lets the same person be chosen more than once.","_n":"1zfad","_k":"568923b9"}]},"b":{"prompt":"In how many ways can 2 people be chosen from 9 to form a committee?","options":[{"t":"18","why":"`C(9, 2)` isn’t 9 × 2: it counts groups. Use `n! ÷ [r!(n - r)!]`.","_n":"20fbd","_k":"4e0f58f5"},{"t":"36","why":"`C(9, 2)` = 72 ÷ 2.","_n":"21fcd","_k":"18a6ad86"},{"t":"72","why":"That counts ordered pairs. In a committee, {Ana, Ben, Cy} and {Cy, Ana, Ben} are the same group. Count it once: divide by `2!`.","_n":"22fdd","_k":"e36008c1"},{"t":"81","why":"`9^2` repeats people.","_n":"23fed","_k":"165964fd"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"Which expression equals `C(n, r)`?","options":[{"t":"`P(n, r) × r!`","why":"Multiplying makes the count bigger, not smaller.","_n":"24ffd","_k":"fd03ab45"},{"t":"`P(n, r) ÷ r`","why":"Each group of `r` appears `r!` times in the ordered list, not `r` times.","_n":"2500d","_k":"1d0340bc"},{"t":"`n! ÷ r!`","why":"The `(n - r)!` is missing.","_n":"2601d","_k":"4f8e774e"},{"t":"`P(n, r) ÷ r!`","why":"Each group appears `r!` times among the ordered selections.","_n":"2792f","_k":"3d91822e"}]},"b":{"prompt":"Which expression equals `C(7, 3)`?","options":[{"t":"`7! ÷ (3! × 4!)`","why":"Divide `7!` by `4!` for the 4 people left out and by `3!` for the orders of each group.","_n":"2891f","_k":"f24796f2"},{"t":"`7! ÷ 3!`","why":"Divide by both `3!` and `4!`.","_n":"2994f","_k":"5a72a1a5"},{"t":"`(7 × 6 × 5) ÷ 3`","why":"Each group of 3 appears `3! = 6` times in the ordered list, not 3 times.","_n":"2a93f","_k":"226ee78e"},{"t":"`7! ÷ 4!`","why":"That’s `P(7, 3)`. In a committee, {Ana, Ben, Cy} and {Cy, Ana, Ben} are the same group. Count it once: divide by `3!`.","_n":"2b8ef","_k":"39604a48"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"Which situation is counted by `C(10, 3)`?","options":[{"t":"Making a 3-digit code from the digits 0–9","why":"Digits can repeat and order matters: `10^3`.","_n":"2c8df","_k":"34177400"},{"t":"Choosing 3 toppings from 10","why":"No order: a set of toppings.","_n":"2d90f","_k":"fd5dfb67"},{"t":"Awarding gold, silver and bronze among 10 runners","why":"Different medals: `P(10, 3)`.","_n":"2e8ff","_k":"4f7ce61c"},{"t":"Arranging 3 of 10 books on a shelf","why":"A shelf has an order: swapping two books changes it, so that’s `P(10, 3)`.","_n":"2f8af","_k":"69b4c0f8"}]},"b":{"prompt":"Which situation is counted by `C(12, 4)`?","options":[{"t":"Choosing 4 volunteers from 12","why":"The volunteers have no roles: a group of 4.","_n":"2g89f","_k":"322602c2"},{"t":"Making a 4-letter code from 12 letters, repeats allowed","why":"That’s `12^4`.","_n":"2h0cf","_k":"d249fcd4"},{"t":"Choosing the running order of a 4-person relay from 12","why":"A running order is ordered: `P(12, 4)`.","_n":"2i0df","_k":"c55c6512"},{"t":"Seating 4 of 12 guests in a row","why":"A row has an order: `P(12, 4)`.","_n":"2j0af","_k":"cefbff64"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A committee of 4 is chosen from 6 women and 5 men. How many committees include at least one man?","options":[{"t":"100","why":"`C(5, 1) × C(6, 3)` counts exactly one man only.","_n":"2k0bf","_k":"03b8eb8e"},{"t":"315","why":"`C(11, 4) - C(6, 4)` = 330 − 15.","_n":"2l10f","_k":"be8339c7"},{"t":"345","why":"Subtract the all-women committees; don’t add them.","_n":"2m11f","_k":"6b224820"},{"t":"600","why":"5 × `C(10, 3)` counts some committees more than once.","_n":"2n0ef","_k":"06b6d324"}]},"b":{"prompt":"A committee of 4 is chosen from 5 women and 7 men. How many include at least one woman?","options":[{"t":"175","why":"That’s exactly one woman.","_n":"2o0ff","_k":"54c0744e"},{"t":"460","why":"`C(12, 4) - C(7, 4)` = 495 − 35.","_n":"2p04f","_k":"7bfc5abc"},{"t":"530","why":"‘At least one’ = total − ‘none’, not total + ‘none’. 495 − 35.","_n":"2q05f","_k":"64798f57"},{"t":"825","why":"5 × `C(11, 3)` double-counts.","_n":"2r463","_k":"d0f18714"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"Every pair in a group of `n` players plays exactly one game: 28 games in all. Find `n`.","options":[{"t":"7","why":"`C(7, 2) = 21`.","_n":"2s473","_k":"9a9cb554"},{"t":"8","why":"`C(n, 2) = 28` means `n(n - 1) = 56`, so `n = 8`.","_n":"2t443","_k":"c89c3f43"},{"t":"14","why":"28 ÷ 2 = 14 treats `C(n, 2)` as `n × 2`.","_n":"2u453","_k":"23323d18"},{"t":"56","why":"56 = `n(n - 1)`, not `n`.","_n":"2v423","_k":"7e6bffa4"}]},"b":{"prompt":"Every pair in a group of `n` players plays exactly one game: 66 games in all. Find `n`.","options":[{"t":"11","why":"`C(11, 2) = 55`.","_n":"2w433","_k":"99b87bb4"},{"t":"12","why":"`n(n - 1) = 132`, so `n = 12`.","_n":"2x403","_k":"7254d49b"},{"t":"33","why":"66 ÷ 2 = 33 treats `C(n, 2)` as `n × 2`.","_n":"2y413","_k":"60732d90"},{"t":"132","why":"132 = `n(n - 1)`, not `n`.","_n":"2z4e3","_k":"fe59c41b"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"A pizza shop has 8 toppings. How many different pizzas have at most 2 toppings (a plain pizza counts)?","options":[{"t":"28","why":"‘At most 2’ includes 0 and 1 topping too.","_n":"304f3","_k":"ed77acb9"},{"t":"36","why":"The plain pizza is one more choice.","_n":"314c3","_k":"4957a34d"},{"t":"37","why":"`C(8, 0) + C(8, 1) + C(8, 2)` = 1 + 8 + 28.","_n":"324b3","_k":"49de4d20"},{"t":"65","why":"1 + 8 + 56 uses `P(8, 2)` for 2 toppings, but toppings have no order.","_n":"334e3","_k":"9e88e979"}]},"b":{"prompt":"A pizza shop has 7 toppings. How many different pizzas have at most 2 toppings (a plain pizza counts)?","options":[{"t":"21","why":"‘At most 2’ includes 0 and 1 topping too.","_n":"344d3","_k":"f2ddab8b"},{"t":"28","why":"‘At most 2 toppings’ includes 0, 1 and 2 toppings. The plain pizza is one choice. 1 + 7 + 21.","_n":"35503","_k":"092a2bb9"},{"t":"29","why":"1 + 7 + 21.","_n":"364f3","_k":"0f906470"},{"t":"50","why":"1 + 7 + 42 uses `P(7, 2)`, but toppings have no order.","_n":"37523","_k":"cadde2ad"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why `C(n, r) = P(n, r) ÷ r!`?","options":[{"t":"Dividing by `r!` removes repeated people.","why":"No one is repeated in `P(n, r)`; it’s repeated \u003cstrong>orders\u003c/strong>.","_n":"38513","_k":"35016971"},{"t":"Combinations are always smaller, so you divide by something.","why":"True but it doesn’t say why `r!`.","_n":"39443","_k":"f2afc226"},{"t":"Because `r!` is the number of people left out.","why":"`(n - r)!` relates to the people left out, not `r!`.","_n":"3a433","_k":"a72e0a2d"},{"t":"`P(n, r)` lists every ordered selection. Each unordered group of `r` appears in `r!` different orders, so dividing by `r!` counts each group once.","why":"It says what `r!` counts: the orders of one group.","_n":"3bba3","_k":"e99433dd"}]},"b":{"prompt":"Which is the best explanation of why there are fewer committees of 3 than slates of president, VP and treasurer from the same club?","options":[{"t":"Each committee of 3 can be turned into `3! = 6` different slates by assigning the roles, so slates are 6 times as many.","why":"Assigning the 3 roles to one committee gives `3!` slates.","_n":"3cbb3","_k":"061fe8eb"},{"t":"Slates allow the same person twice.","why":"No one holds two offices.","_n":"3dbc3","_k":"55a70466"},{"t":"Committees have fewer people.","why":"Both use 3 people.","_n":"3ebd3","_k":"c9493e98"},{"t":"Committees divide by 3 because there are 3 people.","why":"Each committee matches `3! = 6` slates, not 3.","_n":"3fbe3","_k":"4ebd79b2"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which statement is written correctly?","options":[{"t":"The number of 3-person committees from 9 people is `C(9, 3)` = 84.","why":"`C(9, 3) = {9 × 8 × 7}/{3 × 2 × 1}` = 84, and a committee is a combination.","_n":"3gbf3","_k":"2e787ccb"},{"t":"`C(9, 3)` = 504.","why":"That’s the permutation value.","_n":"3hc03","_k":"a814907a"},{"t":"₉C₃ = 9 × 3 = 27.","why":"`C(9, 3)` isn’t 9 × 3: it counts groups. Use `n! ÷ [r!(n - r)!]`.","_n":"3ic13","_k":"3144384a"},{"t":"`P(9, 3)` = 84.","why":"`P(9, 3)` = 504.","_n":"3jc23","_k":"011a38be"}]},"b":{"prompt":"Which statement is written correctly?","options":[{"t":"₁₀C₄ = 10 × 4 = 40.","why":"`C(10, 4)` isn’t 10 × 4: it counts groups. Use `n! ÷ [r!(n - r)!]`.","_n":"3kc33","_k":"e0efbee6"},{"t":"`C(10, 4)` = 5040.","why":"That’s `P(10, 4)`.","_n":"3l403","_k":"23a3f7df"},{"t":"The number of 4-person teams from 10 people is `C(10, 4)` = 210.","why":"`C(10, 4) = {10 × 9 × 8 × 7}/{4 × 3 × 2 × 1}` = 210, and a team without roles is a combination.","_n":"3m3f3","_k":"b7bc2f6a"},{"t":"`P(10, 4)` = 210.","why":"`P(10, 4)` = 5040; 210 is the combination.","_n":"3n3e3","_k":"6818c409"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A student council has 7 grade 11s and 5 grade 12s. A committee of 4 must have exactly 2 from each grade. How many committees are possible?","options":[{"t":"31","why":"21 + 10 adds the stages; multiply instead.","_n":"3o3d3","_k":"9b175ef1"},{"t":"210","why":"`C(7, 2) × C(5, 2)` = 21 × 10.","_n":"3p443","_k":"291b1ee4"},{"t":"495","why":"`C(12, 4)` ignores the 2-and-2 rule.","_n":"3q433","_k":"9ddba8bd"},{"t":"840","why":"`P(7, 2) × P(5, 2)` orders each pair.","_n":"3r423","_k":"2b55eb23"}]},"b":{"prompt":"A council has 6 grade 11s and 4 grade 12s. A committee of 4 must have exactly 2 from each grade. How many committees are possible?","options":[{"t":"21","why":"15 + 6 adds the stages. Choosing 2 girls \u003cstrong>and\u003c/strong> 2 boys is two stages: multiply the counts.","_n":"3s413","_k":"22884d8d"},{"t":"90","why":"`C(6, 2) × C(4, 2)` = 15 × 6.","_n":"3t483","_k":"bfe1aefc"},{"t":"210","why":"`C(10, 4)` ignores the rule.","_n":"3u473","_k":"d43b308d"},{"t":"360","why":"`P(6, 2) × P(4, 2)` orders each pair.","_n":"3vbe4","_k":"c9057d53"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"How many diagonals does an octagon (8 sides) have?","options":[{"t":"20","why":"`C(8, 2)` = 28 segments, minus the 8 sides.","_n":"3wbf4","_k":"e7cb6a72"},{"t":"28","why":"Those are all segments, including the sides.","_n":"3xbc4","_k":"16188f1b"},{"t":"40","why":"8 × 5 counts each diagonal from both ends.","_n":"3ybd4","_k":"da247129"},{"t":"56","why":"`P(8, 2)` counts each segment twice.","_n":"3zc24","_k":"0e57c117"}]},"b":{"prompt":"How many diagonals does a hexagon (6 sides) have?","options":[{"t":"9","why":"`C(6, 2)` − 6 = 15 − 6.","_n":"40c34","_k":"bd7e07c6"},{"t":"15","why":"Subtract the 6 sides.","_n":"41c04","_k":"5409984b"},{"t":"18","why":"6 × 3 counts each diagonal twice.","_n":"42c14","_k":"8fc9c1cd"},{"t":"30","why":"`P(6, 2)` counts each segment twice.","_n":"43c64","_k":"580b1a13"}]}}]},"task":{"title":"The fair committee","summary":"The fair committee","statement":"\u003cp>A club has some grade 11s and some grade 12s. A committee of 3 will be chosen. Design the club so every condition holds. Can you find all the answers?\u003c/p>\u003col class=\"cb-conds\">\u003cli>Fewer than 10 possible committees are all grade 11s.\u003c/li>\u003cli>At least 100 possible committees include at least one grade 11.\u003c/li>\u003cli>There are at most 200 possible committees in total.\u003c/li>\u003c/ol>","checks":["Fewer than 10 all-grade-11 committees","At least 100 with a grade 11","At most 200 committees"],"tips":["`C(5, 3) = 10` already, so keep `g` at 4 or fewer.","Use the complement: total minus the all-grade-12 committees.","`C(12, 3) = 220` is too many; keep the club at 11 or fewer."],"explainPrompt":"Explain how you counted the committees with at least one grade 11, and why the club size had to be 10 or 11.","vocab":"Use the words combination, complement, at least and total.","more":"There’s more than one answer. Can you find them all?","after3":"(4, 6) sits exactly on 100. Every answer has 10 or 11 members: smaller clubs fail line 2, larger ones fail line 3."},"cards":[["Combination","A selection where order doesn’t matter: committees, hands, toppings."],["Permutation vs combination","Swap two chosen items: a new outcome means permutation; the same outcome means combination."],["`C(n, r)`","`n! ÷ [r!(n - r)!]`, read “`n` choose `r`”."],["From P to C","`C(n, r) = P(n, r) ÷ r!`: each group appears `r!` times in order."],["`C(8, 3)` by hand","(8 × 7 × 6) ÷ (3 × 2 × 1) = 56."],["`C(n, 0)` and `C(n, n)`","Both equal 1: one way to choose nobody, one way to choose everyone."],["Symmetry","`C(n, r) = C(n, n - r)`: choosing who serves = choosing who stays out."],["“At least one”","Total − “none”."],["“At most 2”","Add the cases 0, 1 and 2."],["Two groups","“2 girls and 2 boys”: `C(g, 2) × C(b, 2)`."],["The double-count trap","“Guarantee one, then choose the rest” counts some groups twice."],["Handshakes","`n` people, everyone shakes once: `C(n, 2)` handshakes."]]}};</script>
