.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 37: Residual inspector (D11 scatter + linked residual panel), Is linear right? stations, N4 numEntry, Hidden curve.
   Points --pen; line --ink; residual segments and dots --ev-c (orange, its own dark value); zero line --ink-2 dashed; added point --hi ring. */
/* radioGroup (from MDM4U 19) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 19) */
.rs-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.rs-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.rs-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.rs-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.rs-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}
@media (prefers-reduced-motion:reduce){.rs-sw .cc-track,.rs-sw .cc-knob{transition:none}}

/* Residual inspector */
.rs-top{display:flex;flex-wrap:wrap;gap:0 18px;align-items:center}
.rs-ctx{margin:0 0 10px}
canvas.plot.rs-sc{aspect-ratio:16/11}
canvas.plot.rs-rplot{aspect-ratio:16/6;min-height:120px}
.rs-plab{margin:8px 0 4px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.rs-msg{min-height:1.2em;margin:6px 0 0}
.rs-sws{margin:4px 0 6px}
#rs-cmp{margin-top:10px}

/* small SVG plots (practice tiles and Part 3) */
.rs-mini{display:block;width:100%;max-width:220px;height:auto}
.rs-scat{display:block;width:100%;max-width:340px;height:auto}
.rs-zero{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 4}
.rs-seg{stroke:var(--ev-c);stroke-width:2}
.rs-dot{fill:var(--ev-c)}
.rs-ax{stroke:var(--plot-axis);stroke-width:1.3}
.rs-tk{fill:var(--ink-2);font:11px var(--font-ui)}
.rs-ln{stroke:var(--ink);stroke-width:2.4}
.rs-ln2{stroke:var(--ink-2);stroke-width:2;stroke-dasharray:6 5}
.rs-cv{fill:none;stroke:var(--ink);stroke-width:2.4}
.rs-pt{fill:var(--pen)}
.rs-pthi{stroke:var(--hi);stroke-width:3}
.tile .rs-mini{width:180px}
.chip-in .rs-mini,.sel-bar .rs-mini,.fb .rs-mini{display:inline-block;width:96px;vertical-align:middle}

/* Part 3: Is linear right? */
.rs-tabs{margin-bottom:6px}
.rs-tick{color:var(--green);font-weight:700}
.rs-card0{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.rs-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.rs-text{margin:0 0 10px}
.rs-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 10px}
.rs-fig{margin:0}
.rs-fig figcaption{font-size:.9rem;margin-bottom:4px}
.rs-one{margin:0 0 10px}
.rs-item{margin:12px 0 0}
.rs-ilab{margin:0 0 6px;font-weight:700}
.rs-bins{display:flex;flex-wrap:wrap;gap:6px}
.rs-bins button[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.rs-after{margin:10px 0 0}
.rs-key{display:inline-block;width:22px;height:0;border-top:2.4px solid var(--ink);vertical-align:middle}
.rs-key2{border-top:2px dashed var(--ink-2)}

/* N4 numEntry choice row */
.rs-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:8px 0 0}
.rs-pk{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rs-pk[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rs-pk:disabled{opacity:.55}

/* Hidden curve */
.rs-conds{margin:.4em 0 0 1.2em;padding:0}
.rs-hc-in{display:grid;gap:6px}
.rs-hc-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rs-hc-row label{min-width:7.5em}
.rs-hc-row .numin{width:4.5em}
.rs-hc-row .btn{min-width:40px;min-height:40px}
.rs-hc-pv .read{margin-top:10px}

le.","shape":"wide"}},"goals":["I can calculate a residual and say what its sign means in context.","I can read a residual plot and decide whether a linear model is appropriate.","I can calculate and interpret \u003ci>r\u003c/i>² as the proportion of variation explained.","I can explain why a high \u003ci>r\u003c/i>² alone doesn’t prove a linear model is right.","I can tell an outlier from an influential point by how it changes the line.","I can choose the better of two models using residuals, SSR and \u003ci>r\u003c/i>²."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Predictions from a line","goal":1,"prompt":"Using \u003ci>ŷ\u003c/i> = 4\u003ci>x\u003c/i> + 6, what is the predicted \u003ci>y\u003c/i> at \u003ci>x\u003c/i> = 5?","options":[{"t":"20","why":"Add the 6.","_n":"05d2","_k":"1c4abd46"},{"t":"26","why":"4(5) + 6.","_n":"1602","_k":"d8cf78f1"},{"t":"30","why":"4 × 5 first.","_n":"25f2","_k":"5630dc82"},{"t":"54","why":"Slope × \u003ci>x\u003c/i>, then add \u003ci>b\u003c/i>.","_n":"3622","_k":"4f44f1de"}],"hints":["Substitute \u003ci>x\u003c/i> = 5.","4 × 5 = 20.","20 + 6 = 26."]},{"id":"w2","skill":"Predictions from a line","goal":1,"prompt":"A point (5, 25) sits near the line \u003ci>ŷ\u003c/i> = 4\u003ci>x\u003c/i> + 6. How far above or below the line is it?","options":[{"t":"1 below","why":"Predicted 26; observed 25.","_n":"4612","_k":"eb90a601"},{"t":"On the line","why":"26 ≠ 25.","_n":"5642","_k":"9b1e7216"},{"t":"25 above","why":"Compare with the prediction, 26.","_n":"6632","_k":"9de1e28e"},{"t":"1 above","why":"Observed 25 is less than 26: below.","_n":"7662","_k":"37d85266"}],"hints":["Find the predicted \u003ci>y\u003c/i>.","26.","25 − 26 = −1: below."]},{"id":"w3","skill":"Correlation","goal":3,"prompt":"Which \u003ci>r\u003c/i> shows the strongest linear relationship?","options":[{"t":"−0.92","why":"Largest size, |−0.92|.","_n":"8652","_k":"0bd5e3a9"},{"t":"0","why":"No linear relationship.","_n":"9fcd","_k":"f0bae527"},{"t":"0.50","why":"Moderate.","_n":"afdd","_k":"be874068"},{"t":"0.85","why":"Strength is |\u003ci>r\u003c/i>|.","_n":"bfed","_k":"47d928c6"}],"hints":["Compare sizes, ignoring the sign.","0.92 > 0.85.","−0.92."]},{"id":"w4","skill":"Correlation","goal":4,"prompt":"Points lie exactly on the curve \u003ci>y\u003c/i> = \u003ci>x\u003c/i>² for \u003ci>x\u003c/i> = 1, 2, 3, 4, 5. Which is true?","options":[{"t":"\u003ci>r\u003c/i> = 1 exactly","why":"Only points exactly on a straight line give \u003ci>r\u003c/i> = 1.","_n":"cffd","_k":"7141ff08"},{"t":"\u003ci>r\u003c/i> = 0, because it’s a curve","why":"A rising curve still has strong positive correlation.","_n":"d00d","_k":"1513d34b"},{"t":"\u003ci>r\u003c/i> is close to 1, even though the pattern is curved","why":"Over this range the curve rises steadily, so \u003ci>r\u003c/i> ≈ 0.98.","_n":"e01d","_k":"16a725c0"},{"t":"\u003ci>r\u003c/i> is negative","why":"\u003ci>y\u003c/i> increases as \u003ci>x\u003c/i> increases.","_n":"f02d","_k":"671d439b"}],"hints":["As \u003ci>x\u003c/i> rises, does \u003ci>y\u003c/i> rise?","Yes, steadily.","\u003ci>r\u003c/i> is high but not 1."]},{"id":"w5","skill":"Squaring and proportions","goal":3,"prompt":"What is 0.9²?","options":[{"t":"0.09","why":"0.9 × 0.9 = 0.81.","_n":"g03d","_k":"e9b16123"},{"t":"0.18","why":"0.9 × 0.9, not 0.9 × 0.2.","_n":"h04d","_k":"3a7fc5e3"},{"t":"0.81","why":"0.9 × 0.9 = 0.81.","_n":"i05d","_k":"a0fc2dd8"},{"t":"1.8","why":"Squaring multiplies by itself.","_n":"j8ed","_k":"c175c648"}],"hints":["0.9 × 0.9.","9 × 9 = 81.","Two decimal places: 0.81."]},{"id":"w6","skill":"Squaring and proportions","goal":3,"prompt":"A line explains 640 of 800 units of variation. What proportion is that?","options":[{"t":"0.20","why":"That’s the unexplained part.","_n":"k8dd","_k":"4409e3d0"},{"t":"0.64","why":"Divide by the total, 800.","_n":"l90d","_k":"55e6c3d8"},{"t":"0.80","why":"640 ÷ 800.","_n":"m8fd","_k":"60d5d537"},{"t":"1.25","why":"That’s 800 ÷ 640: part over whole.","_n":"n92d","_k":"391b94f4"}],"hints":["Part ÷ whole.","640 ÷ 800.","0.8 = 80%."]}],"refreshers":{"Predictions from a line":"Substitute \u003ci>x\u003c/i>, multiply by the slope, then add the intercept. Compare the prediction with the observed value.","Correlation":"Strength is |\u003ci>r\u003c/i>|. A rising curve can still have a large \u003ci>r\u003c/i>.","Squaring and proportions":"\u003ci>r\u003c/i>² = \u003ci>r\u003c/i> × \u003ci>r\u003c/i>. A proportion is part ÷ whole, often written as a percentage."}}},"explore":{"heading":"Residual inspector","intro":"Every point leaves a residual. Drop them onto a residual plot and look for a pattern. Then add or drag points and watch what happens to the line, \u003ci>r\u003c/i>² and the residuals.","predIntro":"Make a prediction first. Then the inspector shows you what really happens.","predictions":[{"id":"p1","start":{"ds":"A7","mode":"ins"},"prompt":"Data A7. What will the residual plot look like?","options":[{"t":"All residuals 0","_n":"o91d","_k":"1659ccda"},{"t":"A fan","_n":"p94d","_k":"1359cd30"},{"t":"A U-shape","_n":"q93d","_k":"54026e4a"},{"t":"Random scatter around 0","_n":"r86d","_k":"d5a73d90"}],"explain":"The residual dots fall at −2, 2, −1, 2, −1, 2, −2. No curve or growing spread: a line is a good model here."},{"id":"p2","start":{"ds":"B","mode":"ins"},"prompt":"Data B. \u003ci>r\u003c/i>² = 0.963. What will the residual plot show?","options":[{"t":"A fan","_n":"s85d","_k":"4bfe9dc9"},{"t":"A U-shape","_n":"t08d","_k":"dafe0210"},{"t":"All residuals 0","_n":"u09d","_k":"5a08749b"},{"t":"Random scatter","_n":"v06d","_k":"2258d3ff"}],"explain":"The residual dots land at +2, −1, −2, −1, +2. The braking distance curves upward. The line is too high in the middle and too low at both ends, even though \u003ci>r\u003c/i>² is high."},{"id":"p3","start":{"ds":"A7","mode":"add","x":4,"y":5},"prompt":"Data A7, Add a point. A new point at (4, 5) is far below the line. What happens to the slope?","options":[{"t":"It stays 4","_n":"w07d","_k":"43ec58d4"},{"t":"It increases","_n":"x04d","_k":"6d5a45f3"},{"t":"It becomes negative","_n":"y05d","_k":"290e353b"},{"t":"It decreases","_n":"z02d","_k":"7d50dd37"}],"explain":"The line drops slightly but stays parallel; \u003ci>r\u003c/i>² falls from 0.953 to 0.620. \u003ci>x\u003c/i> = 4 is \u003ci>x̄\u003c/i>. A point at the mean \u003ci>x\u003c/i> has no leverage: it lowers the intercept and \u003ci>r\u003c/i>², not the slope."},{"id":"p4","start":{"ds":"A7","mode":"add","x":20,"y":50},"prompt":"Data A7; add (20, 50). The original line predicts 86 at \u003ci>x\u003c/i> = 20. The new point is at 50. What happens?","options":[{"t":"The slope stays 4","_n":"1003d","_k":"65acffa1"},{"t":"\u003ci>r\u003c/i>² rises","_n":"1110d","_k":"e3734808"},{"t":"The line swings toward the new point, and the slope drops to about 2","_n":"1211d","_k":"ad482acd"},{"t":"The new point gets a residual of −36","_n":"139ae","_k":"b07c0d24"}],"explain":"The line pivots; the new slope is 2.0; the new point’s residual is only −3.5. A point far from \u003ci>x̄\u003c/i> has huge leverage. It drags the line toward itself, so its own residual looks small. That’s an influential point."}],"chalIntro":"Use the inspector to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":2,"prompt":"Data B, Compare models: choose the model that removes the pattern from the residuals.","why":"The curve \u003ci>y\u003c/i> = 0.01\u003ci>x\u003c/i>² + 1 fits every point, so all its residuals are 0: the pattern is gone.","hints":["Which way do the residuals bend?","Up at both ends: the data curve upward.","Choose ‘curve opening up’."]},{"id":"tc2","goal":5,"prompt":"Data A7: add \u003cstrong>one point\u003c/strong> that drops \u003ci>r\u003c/i>² \u003cstrong>below 0.8\u003c/strong> but changes the slope by \u003cstrong>no more than 0.1\u003c/strong>.","why":"A point at \u003ci>x\u003c/i> = 4 = \u003ci>x̄\u003c/i> can’t tilt the line. Far enough from 22 (the line’s prediction there), it drops \u003ci>r\u003c/i>² below 0.8 and only shifts the intercept.","hints":["Where can a point sit without tilting the line?","At \u003ci>x̄\u003c/i> = 4.","Put it at (4, 5) or (4, 40)."]},{"id":"tc3","goal":5,"stretch":true,"prompt":"Data A7: add a point at \u003ci>x\u003c/i> = 20 that changes the slope by \u003cstrong>more than 1\u003c/strong>, but whose \u003cstrong>own residual\u003c/strong> (from the new line) is \u003cstrong>smaller than 5\u003c/strong> in size.","why":"An influential point can hide in plain sight: its residual looks ordinary because it moved the line.","hints":["Points far from \u003ci>x̄\u003c/i> drag the line toward themselves.","You need to be far enough from 86 to tilt the line by more than 1, but not so far that the line can’t follow.","Try \u003ci>y\u003c/i> = 50: slope 2.0, residual −3.5."]}]},"part3":{"slug":"is-linear-right","name":"Is linear right?","heading":"Is linear right?","intro":"Three data sets, side by side. Compare a line with a curve using residual plots and SSR, then decide what to do about an outlier. Each station’s \u003cstrong>Check it with data\u003c/strong> panel reveals where its model data come from.","stations":[{"id":"s1","title":"Braking (curved)","text":"Car speed (km/h) vs braking distance (m). The line has \u003ci>r\u003c/i>² = 0.963 and SSR = 14, and its residuals are U-shaped. The curve \u003ci>y\u003c/i> = 0.01\u003ci>x\u003c/i>² + 1 has SSR = 0.","items":[{"id":"s1a","goal":6,"label":"Which model is better?","choices":[{"id":"line","t":"The line"},{"id":"curve","t":"The curve"}],"_a":"EQBFFhddFg==","why":"The curve leaves no residuals at all, and the line’s residuals smile.","wrong":"The line’s residuals smile: +2, −1, −2, −1, +2. \u003ci>r\u003c/i>² measures how much variation the line explains, not whether a line is the right shape. Check the residual plot."},{"id":"s1b","goal":[2,6],"label":"Why?","choices":[{"id":"pat","t":"The residual pattern disappears"},{"id":"r2","t":"The line’s \u003ci>r\u003c/i>² is too low"},{"id":"cx","t":"A curve is always better than a line"},{"id":"or","t":"It passes through (0, 0)"}],"_a":"ERNREEM=","why":"The residual pattern disappears: the curve has captured the shape the line missed.","wrongs":{"r2":"\u003ci>r\u003c/i>² = 0.963 is high. \u003ci>r\u003c/i>² measures how much variation the line explains, not whether a line is the right shape. Check the residual plot.","cx":"Not always: for data A7, the residuals were random and a line was the right model.","or":"At \u003ci>x\u003c/i> = 0 the curve gives 1, not 0. Look at the residuals instead."}}],"data":"Braking distance grows with the \u003cstrong>square\u003c/strong> of speed: double the speed and the distance roughly quadruples. That’s why a curve opening up fits and a line can’t, however high \u003ci>r\u003c/i>² is."},{"id":"s2","title":"Savings growing (curved, slowly)","text":"Model data: an account balance over 10 years, starting at $1000 and growing by 13% each year.","items":[{"id":"s2a","goal":[1,4],"label":"Use the line to predict the balance in year 15: $","_a":"B1ADUg==","tol":30,"why":"Line: 235.3(15) + 806.5 ≈ $4336.","wrong":[{"match":6254,"fb":"That’s the growth model’s value. Use the line."},{"match":3395,"fb":"That’s the balance in year 10. Substitute 15 into the line."}]}],"data":"A fixed percentage each year multiplies the balance by 1.13 every year, so it curves upward. The line has \u003ci>r\u003c/i>² = 0.97, but the U in its residuals warned that it under-predicts late years."},{"id":"s3","title":"An unusual point","text":"The kiosk data (daily high °C vs iced drinks sold) plus a 45 °C day with only 60 drinks sold.","items":[{"id":"s3a","goal":5,"label":"What should you do about the 45 °C day?","choices":[{"id":"rm","t":"Remove it"},{"id":"both","t":"Keep it and report both"},{"id":"inv","t":"Investigate why"}],"_a":"EQpeEkM=","why":"Investigate first: the kiosk ran out of cups that day (model note). Report the fit with and without it.","wrongs":{"rm":"Investigate an outlier before removing it: it may be an error, or the most important data point.","both":"Reporting both fits is part of it, but investigate first: the point may be an error, or the most important data point."}}],"data":"The kiosk’s log (model note) shows it ran out of cups at noon on the 45 °C day, so sales stopped. That explains the point; it doesn’t make it vanish. Report the fit with it (slope 0.86) and without it (slope 2.0), and say why."}],"quickCheck":{"title":"Is linear right? quick check","summary":"Is linear right? quick check","items":[{"id":"q1","goal":2,"prompt":"Residuals: +3, −1, −3, −1, +2 against increasing \u003ci>x\u003c/i>. Pattern?","choices":[{"t":"Random","fb":"Positive at the ends, negative in the middle.","_n":"1499e","_k":"2acaead3"},{"t":"Fan","fb":"Positive at the ends, negative in the middle.","_n":"1598e","_k":"7fa643e7"},{"t":"U-shape","fb":"Right. Positive at the ends, negative in the middle.","_n":"1697e","_k":"f6c409b0"},{"t":"Outlier","fb":"Positive at the ends, negative in the middle.","_n":"1796e","_k":"3b0cad0f"}]},{"id":"q2","goal":3,"prompt":"\u003ci>r\u003c/i> = −0.8. What is \u003ci>r\u003c/i>²?","choices":[{"t":"−0.64","fb":"(−0.8)² = 0.64; \u003ci>r\u003c/i>² is never negative.","_n":"1895e","_k":"1b4f274b"},{"t":"0.64","fb":"Right. (−0.8)² = 0.64; \u003ci>r\u003c/i>² is never negative.","_n":"1994e","_k":"e5cd5394"},{"t":"0.8","fb":"(−0.8)² = 0.64; \u003ci>r\u003c/i>² is never negative.","_n":"1a93e","_k":"6c2ab7e8"},{"t":"1.6","fb":"(−0.8)² = 0.64; \u003ci>r\u003c/i>² is never negative.","_n":"1b92e","_k":"584624d6"}]},{"id":"q3","goal":2,"prompt":"Residuals spread wider as \u003ci>x\u003c/i> increases. Meaning?","choices":[{"t":"\u003ci>r\u003c/i>² must be 1","fb":"A fan means the scatter grows; the trend may still be linear.","_n":"1c91e","_k":"33fd66a4"},{"t":"Predictions are less precise for large \u003ci>x\u003c/i>","fb":"Righ esidual. Observed − predicted = 1900 − 1870."}],"hints":["Find the predicted rent first.","20(80) + 270 = 1870.","1900 − 1870 = 30."]},{"id":"r2","goal":3,"prompt":"\u003ci>r\u003c/i> = 0.6. What percentage of the variation in \u003ci>y\u003c/i> does the line explain?","_a":"AFU=","display":"36%","label":"Percentage:","unit":"%","why":"\u003ci>r\u003c/i>² = 0.6 × 0.6 = 0.36, so the line explains 36% of the variation.","wrong":[{"match":60,"fb":"\u003ci>r\u003c/i>² is \u003ci>r\u003c/i> × \u003ci>r\u003c/i>. \u003ci>r\u003c/i> = 0.9 gives 0.81: 81% of the variation in \u003ci>y\u003c/i> is explained. Square it: 0.36."},{"match":0.36,"fb":"0.36 is right as a proportion. Write it as a percentage."},{"match":1.2,"fb":"\u003ci>r\u003c/i>² is \u003ci>r\u003c/i> × \u003ci>r\u003c/i>. \u003ci>r\u003c/i> = 0.9 gives 0.81: 81% of the variation in \u003ci>y\u003c/i> is explained."}],"hints":["\u003ci>r\u003c/i>² = \u003ci>r\u003c/i> × \u003ci>r\u003c/i>.","0.6 × 0.6 = 0.36.","36%."]},{"id":"r3","goal":3,"prompt":"Residuals 2, −1, −2, −1, 2. SSR?","_a":"Alc=","display":"SSR = 14","label":"SSR =","why":"4 + 1 + 4 + 1 + 4 = 14.","wrong":[{"match":0,"fb":"Square before adding."}],"hints":["SSR is the sum of the squared residuals.","2² = 4 and (−1)² = 1.","4 + 1 + 4 + 1 + 4 = 14."]},{"id":"r4","goal":3,"star":true,"prompt":"SSR = 36 and Σ(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>)² = 400. \u003ci>r\u003c/i>²?","_a":"A00JVQ==","display":"\u003ci>r\u003c/i>² = 0.91","label":"\u003ci>r\u003c/i>² =","why":"\u003ci>r\u003c/i>² = 1 − 36 ÷ 400 = 1 − 0.09 = 0.91.","wrong":[{"match":0.09,"fb":"\u003ci>r\u003c/i>² = 1 − 36 ÷ 400."}],"hints":["SSR is the unexplained variation; Σ(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>)² is the total.","36 ÷ 400 = 0.09 is the unexplained share.","\u003ci>r\u003c/i>² = 1 − 0.09 = 0.91. \u003cstrong>Investigate:\u003c/strong> A lab measured SSR on new data with a different \u003ci>ȳ\u003c/i>. Why must you recompute Σ(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>)² before comparing \u003ci>r\u003c/i>²?"]},{"id":"r5","goal":1,"star":true,"prompt":"Four of five least-squares residuals are −2, 3, 1, −4. What is the fifth?","_a":"AQ==","display":"2","label":"Fifth residual:","why":"Least-squares residuals add to 0: −2 + 3 + 1 − 4 = −2, so the fifth is +2.","wrong":[{"match":-2,"fb":"Least-squares residuals add to 0. The four add to −2, so the fifth must cancel that."}],"general":"Least-squares residuals add to 0.","hints":["What do least-squares residuals add to?","−2 + 3 + 1 − 4 = −2.","The fifth is +2."]},{"id":"r6","goal":5,"star":true,"prompt":"For \u003ci>x\u003c/i> = 2, 3, 4, 5, 6, 7, 8 (\u003ci>x̄\u003c/i> = 5), a line leaves residuals +6 at \u003ci>x\u003c/i> = 2, −6 at \u003ci>x\u003c/i> = 8 and 0 elsewhere. Enter Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>) × residual. Is it the least-squares line?","_a":"HlAG","display":"−36; no","label":"Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>) × residual =","pickLabel":"Least-squares line?","pick":[{"t":"No","_n":"1k93e","_k":"dd631245"},{"t":"Yes","why":"Least squares needs Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>) × residual = 0, and −36 ≠ 0.","_n":"1l8ce","_k":"1bb60362"}],"why":"Least squares needs Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>) × residual = 0: (−3)(6) + (3)(−6) = −36. So it isn’t the least-squares line.","general":"Least squares needs Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>) × residual = 0: (−3)(6) + (3)(−6) = −36.","hints":["Least squares needs two balances: residuals sum to 0, and Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>) × residual = 0.","(2 − 5)(6) = −18 and (8 − 5)(−6) = −18.","−36 ≠ 0, so the line could be tilted to fit better."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Moses","goal":[1,4],"instruction":"Moses made one mistake in each analysis. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Is a line a good model for the braking data?","steps":["The least-squares line is \u003ci>ŷ\u003c/i> = 0.6\u003ci>x\u003c/i> − 6.","\u003ci>r\u003c/i> = 0.981, so \u003ci>r\u003c/i>² = 0.963.","Since \u003ci>r\u003c/i>² is above 0.9, the linear model is the right model.","So predict 54 m at 100 km/h."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"\u003ci>r\u003c/i>² must be above 0.99.","why":"No \u003ci>r\u003c/i>² cutoff proves the shape.","_n":"1m8de","_k":"a984c560"},{"t":"Step 3 is correct.","why":"High \u003ci>r\u003c/i>² ≠ right model. \u003ci>r\u003c/i>² measures how much variation the line explains, not whether a line is the right shape. Check the residual plot.","_n":"1n06e","_k":"40fda235"},{"t":"Check the residual plot first: +2, −1, −2, −1, +2 is a U, so the data curve and a line is the wrong shape.","why":"A U in the residuals means the data curve, whatever the size of \u003ci>r\u003c/i>².","_n":"1o05e","_k":"e0878228"},{"t":"Use \u003ci>r\u003c/i> instead of \u003ci>r\u003c/i>².","why":"That doesn’t check the shape.","_n":"1p08e","_k":"3d3d0d15"}],"hints":["What does \u003ci>r\u003c/i>² measure?","Variation explained, not shape.","Look at the residual plot."]},{"id":"e2","goal":1,"task":"\u003ci>ŷ\u003c/i> = 20\u003ci>x\u003c/i> + 270 for rent. A 60 m² apartment rents for $1350. Is it a bargain?","steps":["Predicted rent = 20(60) + 270 = $1470.","Residual = 1470 − 1350 = +120.","A positive residual means it costs more than predicted, so it’s not a bargain."],"_a":"Ag==","stepFb":["Correct.","","Step 3 reads step 2’s sign. The mistake is earlier."],"fixes":[{"t":"Residual = 1350 ÷ 1470.","why":"Residuals are differences.","_n":"1q07e","_k":"f4abdf77"},{"t":"Residual = observed − predicted = 1350 − 1470 = −120: it rents for $120 less than predicted, a relative bargain.","why":"Observed comes first, so the residual is negative: below the line.","_n":"1r02e","_k":"b80c95fa"},{"t":"Step 2 is correct.","why":"The order is observed − predicted. Residual = \u003cstrong>observed\u003c/strong> − predicted. A point above the line has a positive residual.","_n":"1s01e","_k":"36eec813"},{"t":"Residual = 60 − 1350.","why":"Use \u003ci>y\u003c/i>-values only.","_n":"1t04e","_k":"b80aaffd"}],"hints":["Which comes first?","Observed.","−120."]}]}]},"reflect":{"journal":[{"id":"j1","q":"In the inspector, which surprised you more: the high \u003ci>r\u003c/i>² on curved data, or the influential point that hid its residual?"},{"id":"j2","q":"In your own words, why is the residual plot a better test of ‘is a line right?’ than \u003ci>r\u003c/i>²?"},{"id":"j3","q":"Explain to a friend the difference between an outlier and an influential point, with a sketch in words."},{"id":"j4","q":"Which pattern (U, fan, unusual point) do you still find hardest to recognize? How will you practise it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A point has observed \u003ci>y\u003c/i> = 52 and predicted \u003ci>y\u003c/i> = 50. Its residual is…","options":[{"t":"+2","why":"52 − 50.","_n":"1u03e","_k":"41863a24"},{"t":"102","why":"Subtract; don’t add.","_n":"1v0ee","_k":"9744ba7e"},{"t":"1.04","why":"Residuals are differences, not ratios.","_n":"1w0de","_k":"5b647f16"},{"t":"−2","why":"Residual = \u003cstrong>observed\u003c/strong> − predicted. A point above the line has a positive residual.","_n":"1x00e","_k":"22a089f5"}]},"b":{"prompt":"A point has observed \u003ci>y\u003c/i> = 66 and predicted \u003ci>y\u003c/i> = 70. Its residual is…","options":[{"t":"136","why":"Subtract.","_n":"1y01e","_k":"dc1545ad"},{"t":"−4","why":"66 − 70.","_n":"1zfee","_k":"bc75c9d7"},{"t":"+4","why":"Residual = \u003cstrong>observed\u003c/strong> − predicted. A point above the line has a positive residual.","_n":"20ffe","_k":"67557dbc"},{"t":"0.94","why":"Residuals are differences.","_n":"2104e","_k":"ad6655d5"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"\u003ci>r\u003c/i> = 0.9. Which statement about \u003ci>r\u003c/i>² is correct?","options":[{"t":"\u003ci>r\u003c/i>² = 1.8","why":"\u003ci>r\u003c/i>² is \u003ci>r\u003c/i> × \u003ci>r\u003c/i>. \u003ci>r\u003c/i> = 0.9 gives 0.81: 81% of the variation in \u003ci>y\u003c/i> is explained.","_n":"2205e","_k":"b5858beb"},{"t":"\u003ci>r\u003c/i>² = 0.9: 90% of points lie on the line","why":"\u003ci>r\u003c/i>² is \u003ci>r\u003c/i> × \u003ci>r\u003c/i>. \u003ci>r\u003c/i> = 0.9 gives 0.81: 81% of the variation in \u003ci>y\u003c/i> is explained.","_n":"2302e","_k":"6ada3a69"},{"t":"\u003ci>r\u003c/i>² = 0.81: 81% of the variation in \u003ci>y\u003c/i> is explained by the line","why":"0.9 × 0.9 = 0.81, a proportion of variation.","_n":"2403e","_k":"f2cd9728"},{"t":"\u003ci>r\u003c/i>² = 0.81: 81% of the points are within 1 unit of the line","why":"\u003ci>r\u003c/i>² is about variation, not counts of points.","_n":"2508e","_k":"014d22bd"}]},"b":{"prompt":"\u003ci>r\u003c/i> = −0.7. Which statement about \u003ci>r\u003c/i>² is correct?","options":[{"t":"\u003ci>r\u003c/i>² = 0.49: 49% of the variation in \u003ci>y\u003c/i> is explained by the line","why":"(−0.7)² = 0.49.","_n":"2609e","_k":"8d5bc8f0"},{"t":"\u003ci>r\u003c/i>² = 0.7: 70% explained","why":"\u003ci>r\u003c/i>² is \u003ci>r\u003c/i> × \u003ci>r\u003c/i>. \u003ci>r\u003c/i> = 0.9 gives 0.81: 81% of the variation in \u003ci>y\u003c/i> is explained.","_n":"2712e","_k":"b47a3336"},{"t":"\u003ci>r\u003c/i>² = −0.49","why":"Squares aren’t negative.","_n":"2811e","_k":"9fc231da"},{"t":"\u003ci>r\u003c/i>² = 1.4","why":"\u003ci>r\u003c/i>² is \u003ci>r\u003c/i> × \u003ci>r\u003c/i>. \u003ci>r\u003c/i> = 0.9 gives 0.81: 81% of the variation in \u003ci>y\u003c/i> is explained.","_n":"2910e","_k":"1f1d9506"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which residual plot shows that a linear model is appropriate?","options":[{"t":"Random scatter around 0 with no pattern","why":"No pattern means the line has captured the trend.","_n":"2a0fe","_k":"f9325f50"},{"t":"Residuals growing steadily from negative to positive","why":"That’s a missed trend: the line has the wrong slope.","_n":"2b16e","_k":"aa1a0c7f"},{"t":"All residuals positive","why":"Least-squares residuals add to 0, so that can’t happen.","_n":"2c15e","_k":"40b354c5"},{"t":"A U-shape","why":"That’s a curve. Size isn’t the test; pattern is. A U-shape means the relationship curves.","_n":"2d14e","_k":"65e6e6cf"}]},"b":{"prompt":"A residual plot is ∩-shaped (negative, positive, positive, negative). What does it mean?","options":[{"t":"There’s one outlier","why":"The whole set bends.","_n":"2e13e","_k":"0a6f7bb9"},{"t":"The relationship curves; a line over-predicts at the ends and under-predicts in the middle","why":"Negative residuals at the ends mean the line is too high there.","_n":"2f0ae","_k":"bc307438"},{"t":"The spread grows","why":"That’s a fan.","_n":"2g09e","_k":"b4e70fde"},{"t":"The line fits well","why":"Size isn’t the test; pattern is. A U-shape means the relationship curves.","_n":"2h0ce","_k":"927a80f7"}]}},{"id":"t1","cat":"T","goal":[1,5],"a":{"prompt":"Model line \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10. Points: (15, 38), (20, 52), (25, 62), (30, 75), (35, 80). Which point fits worst?","options":[{"t":"(15, 38), residual +2","why":"38 − 40 = −2, and 5 is larger in size.","_n":"2i0de","_k":"9893f5bd"},{"t":"(35, 80), residual 0","why":"It’s on the line.","_n":"2j0ee","_k":"2ed4e253"},{"t":"(25, 62), residual +2","why":"+5 is larger.","_n":"2k0fe","_k":"b0f2b1cd"},{"t":"(30, 75), residual +5","why":"Residuals −2, 2, 2, 5, 0.","_n":"2l10e","_k":"4573d450"}]},"b":{"prompt":"Model line \u003ci>ŷ\u003c/i> = −13\u003ci>x\u003c/i> + 378. Points: (4, 330), (5, 312), (6, 300), (7, 276), (8, 282). Which point fits worst?","options":[{"t":"(6, 300), residual 0","why":"It’s on the line.","_n":"2m11e","_k":"441b2f7f"},{"t":"(7, 276), residual −11","why":"Residuals 4, −1, 0, −11, 8.","_n":"2n12e","_k":"2ddd511c"},{"t":"(8, 282), residual +8","why":"−11 is larger in size.","_n":"2o13e","_k":"fa022bfb"},{"t":"(4, 330), residual −4","why":"330 − 326 = +4.","_n":"2p04e","_k":"59eb5308"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A linear model has \u003ci>r\u003c/i>² = 0.96, and its residual plot is U-shaped. What is the best conclusion?","options":[{"t":"Remove the end points to fix it","why":"Investigate an outlier before removing it: it may be an error, or the most important data point.","_n":"2q05e","_k":"89613cf0"},{"t":"The line is excellent, because \u003ci>r\u003c/i>² > 0.9","why":"\u003ci>r\u003c/i>² measures how much variation the line explains, not whether a line is the right shape. Check the residual plot.","_n":"2r164","_k":"3b0bca94"},{"t":"The data have no relationship","why":"\u003ci>r\u003c/i>² = 0.96 shows a strong relationship.","_n":"2s174","_k":"6b1cce48"},{"t":"The relationship is curved; a curve would model it better, even though \u003ci>r\u003c/i>² is high","why":"The U shows the line is the wrong shape.","_n":"2t184","_k":"7bfae33b"}]},"b":{"prompt":"A linear model has \u003ci>r\u003c/i>² = 0.45, and its residual plot shows random scatter. What is the best conclusion?","options":[{"t":"\u003ci>r\u003c/i>² must be wrong","why":"Random residuals and a moderate \u003ci>r\u003c/i>² go together.","_n":"2u194","_k":"e6cd5274"},{"t":"The line is useless","why":"It explains 45% of the variation.","_n":"2v1a4","_k":"a8831c4f"},{"t":"A line is the right shape, but the relationship is moderate, so predictions will be imprecise","why":"Random residuals: right shape. Moderate \u003ci>r\u003c/i>²: lots of scatter.","_n":"2w1b4","_k":"56672646"},{"t":"A curve would fit better","why":"No pattern means no curve. Size isn’t the test; pattern is. A U-shape means the relationship curves.","_n":"2x1c4","_k":"e937d0df"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Kiosk data: without a 45 °C day, slope 2.0 and \u003ci>r\u003c/i> = 0.99. With it: slope 0.86 and \u003ci>r\u003c/i> = 0.65. What best describes the 45 °C point?","options":[{"t":"It has no effect on \u003ci>r\u003c/i>","why":"\u003ci>r\u003c/i> dropped from 0.99 to 0.65.","_n":"2y1d4","_k":"13e6f33d"},{"t":"Influential: being far from \u003ci>x̄\u003c/i>, it pulls the line and changes the slope a lot","why":"The slope fell from 2.0 to 0.86: that’s influence.","_n":"2z1e4","_k":"e321ec7c"},{"t":"An error that must be deleted","why":"Investigate an outlier before removing it: it may be an error, or the most important data point.","_n":"301f4","_k":"abd1aae9"},{"t":"Not influential, because its own residual is small","why":"A point at \u003ci>x̄\u003c/i> can’t tilt the line. A point far from \u003ci>x̄\u003c/i> can drag the line so hard that its own residual looks small.","_n":"311c4","_k":"02540e41"}]},"b":{"prompt":"Kiosk data: a point at (25, 75) is added. Before: slope 2, intercept 10, \u003ci>r\u003c/i> = 0.99. After: slope 2, intercept 12.5, \u003ci>r\u003c/i> = 0.91. What best describes the point?","options":[{"t":"Not an outlier, since the slope didn’t change","why":"A point at \u003ci>x̄\u003c/i> can’t tilt the line. A point far from \u003ci>x̄\u003c/i> can drag the line so hard that its own residual looks small.","_n":"321b4","_k":"fb28b453"},{"t":"An outlier in \u003ci>y\u003c/i> at \u003ci>x̄\u003c/i>: it raises the line and lowers \u003ci>r\u003c/i>, but can’t tilt it","why":"\u003ci>x\u003c/i> = 25 is \u003ci>x̄\u003c/i>, so the slope stays 2.","_n":"331a4","_k":"d9ee0132"},{"t":"Influential, because it changed the slope","why":"The slope stayed 2.","_n":"34194","_k":"ded6b45a"},{"t":"It doubled the intercept","why":"10 → 12.5.","_n":"35204","_k":"4954bd6b"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"A rent model gives a 60 m² apartment a residual of −$120. Which statement is correct?","options":[{"t":"“The model is wrong by 120 m².”","why":"The units are dollars.","_n":"361f4","_k":"6f58b45b"},{"t":"“It rents for $120 more than predicted.”","why":"Residual = \u003cstrong>observed\u003c/strong> − predicted. A point above the line has a positive residual.","_n":"371e4","_k":"3c490fa5"},{"t":"“It rents for $120 less than the model predicts for its size.”","why":"A negative residual means observed \u003c predicted.","_n":"381d4","_k":"210bff20"},{"t":"“It should be removed from the data.”","why":"Investigate an outlier before removing it: it may be an error, or the most important data point.","_n":"39244","_k":"7dcefc33"}]},"b":{"prompt":"A rent model gives a 70 m² apartment a residual of +$30. Which statement is correct?","options":[{"t":"“It’s 30 m² larger than predicted.”","why":"The units are dollars.","_n":"3a234","_k":"98e6d4ec"},{"t":"“The model fits this apartment perfectly.”","why":"Off by $30.","_n":"3ba24","_k":"427bafa3"},{"t":"“It rents for $30 less than predicted.”","why":"Residual = \u003cstrong>observed\u003c/strong> − predicted. A point above the line has a positive residual.","_n":"3ca34","_k":"15712077"},{"t":"“It rents for $30 more than the model predicts for its size.”","why":"A positive residual means observed > predicted.","_n":"3da04","_k":"280f6b48"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which is the strongest evidence that a linear model fits a data set well?","options":[{"t":"“\u003ci>r\u003c/i>² = 0.97.”","why":"\u003ci>r\u003c/i>² measures how much variation the line explains, not whether a line is the right shape. Check the residual plot.","_n":"3ea14","_k":"9f95306f"},{"t":"“The residuals add to 0.”","why":"Every least-squares line does that too.","_n":"3f9e4","_k":"c67dd2c0"},{"t":"“The line passes through (\u003ci>x̄\u003c/i>, \u003ci>ȳ\u003c/i>).”","why":"Every least-squares line does.","_n":"3g9f4","_k":"111c21a6"},{"t":"“\u003ci>r\u003c/i>² is high and the residual plot shows random scatter.”","why":"Strength and shape, both checked.","_n":"3h9c4","_k":"75a2d5bf"}]},"b":{"prompt":"Which display best shows whether a straight line is the right model?","options":[{"t":"A table of \u003ci>r\u003c/i> and \u003ci>r\u003c/i>²","why":"\u003ci>r\u003c/i>² measures how much variation the line explains, not whether a line is the right shape. Check the residual plot.","_n":"3i9d4","_k":"de6ddf0e"},{"t":"A box plot of \u003ci>x\u003c/i>","why":"It shows one variable only.","_n":"3jaa4","_k":"ce0f2c18"},{"t":"A residual plot","why":"It shows any pattern the line missed.","_n":"3kab4","_k":"512e5729"},{"t":"A histogram of \u003ci>y\u003c/i>","why":"That ignores \u003ci>x\u003c/i>.","_n":"3la84","_k":"7193965b"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"Rent ($) vs size (m²): \u003ci>ŷ\u003c/i> = 20\u003ci>x\u003c/i> + 270. A 60 m² unit rents for $1350. How does it compare with the model?","options":[{"t":"Exactly as predicted","why":"1470 ≠ 1350.","_n":"3ma74","_k":"850132a1"},{"t":"$120 more expensive than predicted","why":"Residual = \u003cstrong>observed\u003c/strong> − predicted. A point above the line has a positive residual.","_n":"3naa4","_k":"4278be14"},{"t":"$120 cheaper than predicted","why":"Predicted $1470; residual −$120.","_n":"3oa94","_k":"6fd4e71e"},{"t":"$1080 cheaper","why":"Compare with the predicted $1470, not with 270.","_n":"3pac4","_k":"9f2c9aec"}]},"b":{"prompt":"Same model. A 70 m² unit rents for $1700. How does it compare?","options":[{"t":"$330 more","why":"20(70) + 270 = 1670.","_n":"3qab4","_k":"52076e90"},{"t":"$30 cheaper","why":"Residual = \u003cstrong>observed\u003c/strong> − predicted. A point above the line has a positive residual.","_n":"3rae4","_k":"c3898ef4"},{"t":"$30 more expensive than predicted","why":"Predicted $1670.","_n":"3sad4","_k":"3eae1093"},{"t":"Exactly as predicted","why":"1700 ≠ 1670.","_n":"3ta04","_k":"5f60314b"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Two models for the same data. Model P: SSR = 40, \u003ci>r\u003c/i>² = 0.82, residuals U-shaped. Model Q: SSR = 16, \u003ci>r\u003c/i>² = 0.93, residuals random. Which should be used?","options":[{"t":"Q: smaller SSR and no residual pattern","why":"Q  \u003ci>r\u003c/i>² trap","Curved data can have \u003ci>r\u003c/i>² > 0.95; check the residuals."],["Outlier","A point with an unusually large residual."],["Influential point","A point far from \u003ci>x̄\u003c/i> that changes the line a lot when included; its own residual may look small."],["Outlier at \u003ci>x̄\u003c/i>","Changes the intercept and \u003ci>r\u003c/i>, not the slope."]]}};</script>
