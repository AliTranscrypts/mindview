.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 09: hero, Rule-bound line-up (D3 counting slots, D4 arrangement tiles, Gap builder, List mode), Strategy chooser, Seating planner */
/* radioGroup (from MDM4U 07 / 02) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* @component D4 arrangementTiles (restriction version): seats, sliding tiles, block outline, list */
.pr-roww{margin:2px 0 6px}
.pr-row{position:relative;height:78px;--n:6;border-bottom:2px solid var(--ink-2)}
.pr-seat{position:absolute;top:0;bottom:0;left:calc(var(--x) * 100% / var(--n));width:calc(100% / var(--n));border-left:1px dashed var(--rule)}
.pr-seat:first-child{border-left:0}
.pr-seat i{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-style:normal;font-size:.7rem;color:var(--ink-2)}
.pr-blk{position:absolute;top:2px;height:62px;left:calc(var(--x) * 100% / var(--n) + 2px);width:calc(200% / var(--n) - 4px);border:2px solid var(--ink);border-radius:18px;background:var(--hi-soft);opacity:0;transition:left .55s ease,opacity .35s}
.pr-blk.on{opacity:1}
.pr-tok{position:absolute;top:8px;left:calc((var(--x) + .5) * 100% / var(--n));transform:translateX(-50%);width:min(52px,calc(100% / var(--n) - 8px));aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--ink-2);border-radius:50%;background:var(--sheet);color:var(--ink);font:700 .8rem var(--font-ui);transition:left .55s ease}
.pr-tok.mk{border:2.5px solid var(--pen)}
.pr-row.dg .pr-tok{border-radius:8px;border-color:var(--ink);font:700 1.35rem var(--font-math)}
.pr-row.none .pr-tok{opacity:.4}
.pr-none{margin:6px 0;font-size:1.4rem}
.pr-roww.sm .pr-row{height:72px}
.pr-list{max-height:280px;overflow:auto;margin:0 0 10px;padding:6px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.pr-lgrid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4em,1fr));gap:4px}
.pr-li{display:flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid var(--rule);border-radius:5px;font:700 .9rem/1.65 var(--font-ui);letter-spacing:.05em;color:var(--ink-2)}
.pr-li.on{background:var(--hi-soft);border:1.5px solid var(--sel-bd);color:var(--ink)}
.pr-lt{display:inline-block;width:1em;color:var(--green)}
.pr-lhead{margin:0 0 2px}
.pr-leg{margin:0 0 4px}

/* @component D3 countingSlots (restriction version) */
.pr-srow{margin:6px 0 2px}
.pr-slab{margin:0 0 3px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.pr-slots{display:flex;flex-wrap:wrap;gap:6px}
.pr-slot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;max-width:132px;padding:5px 6px 6px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);text-align:center;transition:background .25s,border-color .25s}
.pr-slot.lk{border:2px solid var(--ink)}
.pr-slot.hi{background:var(--hi-soft);border-color:var(--sel-bd)}
.pr-badge{max-width:100%;padding:0 .5em;border:1.5px solid var(--ink);border-radius:999px;font-size:.72rem;font-weight:700;line-height:1.45;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-n{font:700 1.5rem/1.05 var(--font-math);color:var(--ink)}
.pr-cw{font-size:.7rem;color:var(--ink-2);line-height:1.2}
.pr-sprod{margin:3px 0 0;min-height:1em;font:400 1rem var(--font-math);color:var(--ink-2)}

/* Explore */
.pr-cap.long{font-size:clamp(1.05rem,3vw,1.45rem)}
.pr-stage{margin:0 0 6px}
.pr-rowlab{margin:0 0 2px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.pr-acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.pr-share{margin:0 0 8px}
.pr-bar{display:flex;height:18px;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden;background:var(--sheet)}
.pr-b{display:block;height:100%;transition:width .5s}
.pr-b.fit{background:var(--pen)}
.pr-b.rest{background:repeating-linear-gradient(135deg,var(--rule) 0 3px,transparent 3px 7px)}
.pr-b.bad{background:var(--hi)}
.pr-b.all{background:var(--ink-2)}
.pr-b + .pr-b{border-left:1.5px solid var(--ink)}
.pr-blab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin:3px 0 0;font-size:.85rem;color:var(--ink-2)}
.pr-blab .fit{color:var(--pen);font-weight:700}
.pr-blab .bad{color:var(--ink);font-weight:700}
.pr-strat{margin:0 0 12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;background:var(--sheet)}
.pr-shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 4px}
.pr-meth{display:inline-block;padding:.08em .7em;border:1.5px solid var(--ink);border-radius:999px;font-size:.82rem;font-weight:700;color:var(--ink)}
.pr-sf{font:400 1.15rem var(--font-math);overflow-wrap:anywhere;min-width:0}
.pr-sf .m,.pr-strat .m,.pg-read .m,.pr-gb .m{white-space:normal}
.pr-snote{margin:0 0 4px;font-size:.92rem}
.pr-sl .slider output{color:var(--ink)!important}
.pr-sl input[type=range]{accent-color:var(--ink)!important}
.pr-clab{margin:6px 0 4px;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.pr-chips{display:flex;flex-wrap:wrap;gap:6px}
.pr-rc{min-height:36px;text-align:left}
.pr-rc:disabled{opacity:.5}
.pr-when{font-weight:400;font-size:.82em}
.pr-msg{min-height:1.2em;margin:4px 0;color:var(--red);font-weight:700}
.pr-digits{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.pr-dg{width:38px;height:38px;border:1.5px dashed var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink-2);font:700 1.05rem var(--font-math)}
.pr-dg.on{border:2px solid var(--ink);background:var(--hi-soft);color:var(--ink)}
.pr-tools{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.pr-tools .btn.on{background:var(--ink);border-color:var(--ink);color:var(--sheet)}

/* Gap builder */
.pr-gb{margin:0 0 12px;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--paper)}
.pr-gbh{margin:0 0 4px}
.pr-predrow{margin:0 0 8px}
.pr-step{margin:8px 0 4px}
.pr-gnote{font-size:.9rem;color:var(--ink-2)}
.pr-gres{display:flex;flex-wrap:wrap;gap:8px 14px;margin:4px 0 8px}
.pr-gwho{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.pr-tokb{min-width:48px;min-height:40px;padding:0 8px;border:2px solid var(--pen);border-radius:999px;background:var(--sheet);color:var(--ink);font:700 .88rem var(--font-ui)}
.pr-tokb.placed{border-style:dashed;color:var(--ink-2)}
.pr-tokb.sel{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);border-style:solid}
.pr-gsel{min-height:36px;padding:0 4px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 .85rem var(--font-ui)}
.pr-gaps{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 8px}
.pr-gap{min-width:46px;min-height:42px;padding:0 6px;border:1.5px dashed var(--ink-2);border-radius:8px;background:transparent;color:var(--ink);font:700 .85rem var(--font-ui)}
.pr-gap.full{border:2px solid var(--ink);background:var(--hi-soft)}
.pr-gap:hover{border-color:var(--pen)}
.pr-gn{font-weight:400;font-size:.74rem;color:var(--ink-2)}
.pr-tok.st{position:static;transform:none;width:42px;transition:none;font-size:.78rem}
.pr-gbuild{margin:4px 0;font-size:.92rem}
.pr-gdone{margin:4px 0;padding:6px 10px;border-left:4px solid var(--green);background:var(--good-bg)}
.pr-gmsg{color:var(--red);font-weight:700}

/* hero */
.pr-h{display:grid;justify-items:center;width:100%}
.pr-hsvg{display:block;width:100%;max-width:440px;height:auto}
.pr-hcnt{font:400 24px var(--font-math);fill:var(--ink);text-anchor:middle}
.pr-hblk{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2}
.pr-ht circle{fill:var(--sheet);stroke:var(--ink-2);stroke-width:2}
.pr-ht.ab circle{stroke:var(--pen);stroke-width:2.8}
.pr-ht text{font:700 12px var(--font-ui);fill:var(--ink);text-anchor:middle}
.pr-hbar.t{fill:var(--hi);stroke:var(--ink);stroke-width:1.5}
.pr-hbar.a{fill:var(--pen);stroke:var(--ink);stroke-width:1.5}
.pr-hbl{font:700 12px var(--font-ui);fill:var(--ink);text-anchor:middle}

/* Part 3: Strategy chooser */
.ps-tabs{margin-bottom:10px}
.ps-tick{color:var(--green);font-weight:700}
.ps-card{margin:0 0 12px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--sheet)}
.ps-lab{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.ps-prob{margin:2px 0 0;font-size:1.12rem;font-weight:700}
.ps-h{margin:14px 0 6px}
.ps-cards{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.ps-sc{min-height:46px;padding:.4em 1em;border:2px solid var(--ink);border-radius:10px;background:var(--sheet);color:var(--ink);font:700 .95rem var(--font-ui)}
.ps-sc:hover:not(:disabled){background:var(--hi-soft)}
.ps-sc.right{border-color:var(--green);background:var(--good-bg)}
.ps-sc.wrong{border-color:var(--red);background:var(--bad-bg)}
.ps-sc:disabled{opacity:.55;cursor:default}
.ps-sc.right:disabled{opacity:1}
.ps-rows{margin:0 0 8px;padding-left:1.4em}
.ps-row{margin:0 0 10px;line-height:2.1}
.ps-in{width:6.5rem;margin:0 .35em;padding:.2em .5em;font-size:1.05rem}
.ps-in.ok{border-color:var(--green);background:var(--good-bg)}
.ps-mk{color:var(--green);font-weight:700}
.ps-rfb{display:block;margin:2px 0 0;padding:3px 8px;border-left:3px solid var(--red);background:var(--bad-bg);line-height:1.45;font-size:.92rem}
.ps-done{margin:8px 0 4px;padding:6px 10px;border-left:4px solid var(--green);background:var(--good-bg)}
.ps-list p{margin:6px 0}
.ps-lsw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ps-lf{font-size:.95rem}
.ps-match{color:var(--green);font-weight:700}

part.\">\u003csvg class=\"pr-hsvg\" id=\"pr-hsvg\" viewBox=\"0 0 360 206\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003c/div>"}},"goals":["I can count arrangements when a position must hold a particular object or type of object.","I can count arrangements where certain objects must be together, using a block.","I can count arrangements where objects must be apart, by subtracting or by using gaps.","I can choose a strategy (restriction first, block, subtract, gaps or cases) and explain why it fits.","I can count numbers with digit conditions (no leading zero, even or odd, greater than a value).","I can solve multi-condition arrangement problems in context."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Permutations","goal":1,"prompt":"In how many ways can 5 people stand in a line?","options":[{"t":"5","why":"That counts the people, not the line-ups.","_n":"0448","_k":"41688f80"},{"t":"15","why":"That’s 5 + 4 + 3 + 2 + 1. Multiply the choices instead.","_n":"1458","_k":"627105a8"},{"t":"25","why":"That’s 5 × 5.","_n":"2468","_k":"5cea13c8"},{"t":"120","why":"`5! = 120`.","_n":"3478","_k":"c29e62cb"}],"hints":["5 choices for the first spot, then 4…","5 × 4 × 3 × 2 × 1.","120."]},{"id":"w2","skill":"Permutations","goal":5,"prompt":"Evaluate `P(7, 3)`.","options":[{"t":"35","why":"That ignores order.","_n":"4488","_k":"40775c78"},{"t":"210","why":"7 × 6 × 5 = 210.","_n":"5498","_k":"2ef1e663"},{"t":"343","why":"That’s `7^3`, which allows repeats.","_n":"64a8","_k":"10ff29cb"},{"t":"840","why":"That’s `7!/3!`. Divide by `4!`, the objects left out.","_n":"73b8","_k":"8c62c700"}],"hints":["3 places.","7, then 6, then 5 choices.","210."]},{"id":"w3","skill":"Identical objects","goal":2,"prompt":"How many distinct arrangements of the letters A, A, B, C?","options":[{"t":"6","why":"That divides by `2!` twice.","_n":"83c8","_k":"b56dbaba"},{"t":"12","why":"`4!/2! = 12`.","_n":"9c68","_k":"0a9fae29"},{"t":"22","why":"That’s `4! - 2!`. Divide by `2!` instead.","_n":"ac58","_k":"8c056fcd"},{"t":"24","why":"That ignores the repeat.","_n":"bc48","_k":"e6d3705b"}],"hints":["Which letter repeats?","A twice.","24 ÷ 2 = 12."]},{"id":"w4","skill":"Complements and overlap","goal":3,"prompt":"Of 30 students, 12 play hockey. How many don’t play hockey?","options":[{"t":"12","why":"That’s the number who do play hockey.","_n":"cc38","_k":"8f3d0b2d"},{"t":"18","why":"30 − 12 = 18.","_n":"dca8","_k":"9f1eea97"},{"t":"30","why":"That ignores the condition.","_n":"ec98","_k":"b35f0905"},{"t":"42","why":"That adds. ‘Not hockey’ is all students minus the hockey players.","_n":"fc88","_k":"44671afb"}],"hints":["All students minus the hockey players.","30 − 12.","18."]},{"id":"w5","skill":"Complements and overlap","goal":6,"prompt":"Set `A` has 10 outcomes and set `B` has 8; 3 outcomes are in both. How many outcomes are in `A` or `B`?","options":[{"t":"5","why":"That subtracts wrongly: 10 + 8 − 3, not 8 − 3.","_n":"gc78","_k":"cf3095e5"},{"t":"15","why":"10 + 8 − 3 = 15.","_n":"hbe8","_k":"c9460938"},{"t":"18","why":"That counts the overlap twice. Cases must not overlap. Subtract the arrangements counted twice.","_n":"ibd8","_k":"1f9bfcf7"},{"t":"21","why":"That adds the overlap instead of subtracting it.","_n":"jcc9","_k":"60e5596f"}],"hints":["Adding 10 + 8 counts the overlap twice.","Subtract it once.","15."]},{"id":"w6","skill":"Factorial arithmetic","goal":3,"prompt":"Evaluate `5! - 4!`.","options":[{"t":"1","why":"That’s `(5 - 4)!`. Factorials don’t subtract like that.","_n":"kcd9","_k":"447410d5"},{"t":"24","why":"That’s `4!` alone.","_n":"lca9","_k":"bb4e2987"},{"t":"96","why":"120 − 24 = 96.","_n":"mcb9","_k":"9f09cc06"},{"t":"116","why":"That’s 120 − 4. Evaluate `4!` too.","_n":"nc89","_k":"b803d938"}],"hints":["Work out each factorial.","120 and 24.","96."]}],"refreshers":{"Permutations":"`n` objects in a line: `n!`. `r` of them in order: `P(n, r) = n!/(n - r)!`.","Identical objects":"Divide by the factorial of each repeat count.","Complements and overlap":"‘Not `A`’ = total − `A`. ‘`A` or `B`’ = `A` + `B` − both.","Factorial arithmetic":"Evaluate each factorial before you add or subtract."}}},"explore":{"heading":"Rule-bound line-up","intro":"Add rules to a line-up and watch the count change. The strategy panel shows how to count it; List mode checks small cases.","predIntro":"Make a prediction first. Then the line-up will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"people","n":5,"rules":["first"]},"prompt":"`n = 5`, rule “Ana is first”. How many line-ups?","options":[{"t":"20","_n":"oc99","_k":"e5465d48"},{"t":"24","_n":"pc69","_k":"0402b65f"},{"t":"96","_n":"qc79","_k":"4d81ed24"},{"t":"120","_n":"rc49","_k":"67265c80"}],"explain":"Ana’s spot is decided; the other 4 fill `4! = 24` ways."},{"id":"p2","start":{"mode":"people","n":5,"rules":["tog"]},"prompt":"`n = 5`, “Ana and Bo together”. How many line-ups?","options":[{"t":"24","_n":"sc59","_k":"6bd4edd0"},{"t":"48","_n":"t329","_k":"ad3137af"},{"t":"72","_n":"u319","_k":"c68895ca"},{"t":"120","_n":"v349","_k":"5445b1dc"}],"explain":"4 items (the block + 3 people): `4! = 24`, times `2!` inside the block = 48."},{"id":"p3","start":{"mode":"people","n":5,"rules":["apart"]},"prompt":"`n = 5`, “Ana and Bo apart”. How many line-ups?","options":[{"t":"24","_n":"w339","_k":"06b618ce"},{"t":"48","_n":"x369","_k":"70856af4"},{"t":"72","_n":"y359","_k":"822937f5"},{"t":"96","_n":"z389","_k":"87e4ac64"}],"explain":"120 − 48 = 72."},{"id":"p4","start":{"mode":"people","n":6,"rules":["before"]},"prompt":"`n = 6`, “Ana before Bo”. How many line-ups have Ana somewhere before Bo?","options":[{"t":"120","_n":"10379","_k":"1795f84e"},{"t":"240","_n":"113a9","_k":"c88ee2e9"},{"t":"360","_n":"12399","_k":"dae9eaa9"},{"t":"720","_n":"13389","_k":"2d372e2e"}],"explain":"Swap Ana and Bo in any line-up and you get one where Bo is first. So exactly half: 720 ÷ 2."}],"chalIntro":"Set up the line-up, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":5,"prompt":"Digit mode: digits {0, 1, 2, 3, 4}, 3-digit numbers, no repeated digit. Choose rules so the count is 48.","why":"No leading zero: the first digit has 4 choices (1–4), then 4, then 3: 4 × 4 × 3 = 48.","hints":["What makes 012 not a 3-digit number?","The first digit has 4 choices (1–4), then 4, then 3.","Turn on ‘No leading zero’: 4 × 4 × 3 = 48."]},{"id":"tc2","goal":[1,2,4],"prompt":"`n = 6`. Choose \u003cstrong>one\u003c/strong> rule so that exactly 240 line-ups satisfy it.","why":"Two rules give 240: “Ana and Bo together” (`5! × 2! = 240`) and “Ana is at an end” (`2 × 5! = 240`).","hints":["240 = 720 ÷ 3, or 2 × 120.","Which rule doubles `5!`?","Together (block × `2!`) or ‘at an end’ (2 ends × `5!`)."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"`n = 6`: Ana, Bo and Cy must \u003cstrong>all\u003c/strong> be apart (no two of them side by side). Enter your prediction, then build it in the Gap builder.","why":"`3! × P(4, 3) = 6 × 24 = 144`: seat Di, Ed and Fay (`3!` ways), then give Ana, Bo and Cy their own gaps among the 4.","hints":["Place Di, Ed and Fay first: `3!` ways.","That makes 4 gaps: _ Di _ Ed _ Fay _. Ana, Bo and Cy each need their own gap.","Choose and order 3 of the 4 gaps: `P(4, 3) = 24`. 6 × 24 = 144."]}]},"part3":{"slug":"strategies","name":"Strategies","heading":"Strategy chooser","intro":"The hard part of restrictions is choosing the method. At each station, pick a strategy card, fill in its template, then check it by listing a smaller version of the problem.","stations":[{"id":"s1","title":"Restriction first","problem":"Arrange the letters of MAPLE so that a vowel comes first.","fixedOrder":true,"options":[{"id":"first","t":"Restriction first","why":"A vowel must come first: fill that spot first (2 choices), then arrange the rest.","_n":"14399","_k":"5a23691b"},{"id":"block","t":"Block","why":"Block is for items that must stand together. Here one position has a rule.","_n":"153a9","_k":"b7daef1d"},{"id":"sub","t":"Subtract (total − bad)","why":"Subtracting the consonant-first arrangements works too, but filling the restricted spot first is quicker.","_n":"163b9","_k":"516b30d9"},{"id":"cases","t":"Cases","why":"There’s only one kind of first letter to count (a vowel), so no cases are needed.","_n":"17349","_k":"d6f64856"}],"rows":[{"t":"Choices for the first letter (a vowel): [[]]","_a":"AA==","wrong":[{"match":5,"fb":"Only A and E are vowels."},{"match":3,"fb":"That counts the consonants M, P and L."}]},{"t":"Ways to arrange the other 4 letters, `4!`: [[]]","_a":"AFU=","wrong":[{"match":120,"fb":"Only 4 letters are left once the first is placed: `4! = 24`."}]},{"t":"Total: [[]]","_a":"Blk=","wrong":[{"match":26,"fb":"Stages multiply: 2 × 24."},{"match":120,"fb":"That ignores the rule."},{"match":72,"fb":"That’s ‘starts with a consonant’."}]}],"done":"2 × `4!` = 48.","list":{"small":{"letters":"MAPE","rule":"vowelFirst","task":"MAPE so that a vowel comes first","f":"2 × `3!` = 12"},"full":{"letters":"MAPLE","rule":"vowelFirst","task":"MAPLE so that a vowel comes first","f":"2 × `4!` = 48"}}},{"id":"s2","title":"Block","problem":"Arrange MAPLE with M and P together.","fixedOrder":true,"options":[{"id":"first","t":"Restriction first","why":"No position is fixed. M and P can be anywhere, as long as they’re side by side.","_n":"18359","_k":"44658880"},{"id":"block","t":"Block","why":"M and P must be together: glue them into one block, arrange the items, then multiply by the order inside the block.","_n":"19369","_k":"ac620759"},{"id":"sub","t":"Subtract (total − bad)","why":"Subtract is for ‘not together’. Here they must be together.","_n":"1a379","_k":"0d4cf65b"},{"id":"cases","t":"Cases","why":"Counting every position of the pair works, but gluing them into a block is quicker.","_n":"1b409","_k":"67de0062"}],"rows":[{"t":"Items to arrange (the MP block + A, L, E): [[]]","_a":"Bg==","wrong":[{"match":5,"fb":"Glue M and P into one block: 5 letters become 4 items."},{"match":3,"fb":"Count the block as one item: the block + A, L, E."}]},{"t":"Ways to arrange the items, `4!`: [[]]","_a":"AFU=","wrong":[{"match":120,"fb":"There are 4 items, not 5: `4! = 24`."}]},{"t":"Orders inside the block (MP or PM): [[]]","_a":"AA==","wrong":[{"match":1,"fb":"Inside the block, the items can swap: multiply by `2!` (or `3!`, …)."}]},{"t":"Total: [[]]","_a":"Blk=","wrong":[{"match":24,"fb":"Inside the block, the items can swap: multiply by `2!` (or `3!`, …)."},{"match":26,"fb":"Orders multiply: 24 × 2."}]}],"done":"`4! × 2!` = 48.","list":{"small":{"letters":"MAPE","rule":"mpTogether","task":"MAPE with M and P together","f":"`3! × 2!` = 12"},"full":{"letters":"MAPLE","rule":"mpTogether","task":"MAPLE with M and P together","f":"`4! × 2!` = 48"}}},{"id":"s3","title":"Subtract","problem":"Arrange MAPLE with the vowels \u003cstrong>not\u003c/strong> together.","fixedOrder":true,"options":[{"id":"first","t":"Restriction first","why":"No position is fixed. The rule is about the vowels being side by side.","_n":"1c419","_k":"c6f3ac7a"},{"id":"block","t":"Block","why":"Block counts ‘together’. For ‘not together’, subtract the block count from the total.","_n":"1d3e9","_k":"04328204"},{"id":"sub","t":"Subtract (total − bad)","why":"Count all arrangements, then subtract the ones with the vowels together.","_n":"1e3d9","_k":"9c415187"},{"id":"cases","t":"Cases","why":"Counting ‘apart’ directly is messy; subtract the together cases.","_n":"1f3c9","_k":"dff5b52c"}],"rows":[{"t":"All arrangements, `5!`: [[]]","_a":"A1NR","wrong":[{"match":24,"fb":"Arrange all 5 letters: `5! = 120`."}]},{"t":"Vowels together, `4! × 2!`: [[]]","_a":"Blk=","wrong":[{"match":24,"fb":"Apart = total − together, and ‘together’ includes the order inside the block."}]},{"t":"Vowels not together: [[]]","_a":"BVM=","wrong":[{"match":96,"fb":"Apart = total − together, and ‘together’ includes the order inside the block."},{"match":168,"fb":"Subtract the together arrangements; don’t add them."},{"match":48,"fb":"That’s the number with the vowels together."}]}],"done":"`5! - 4! × 2!` = 120 − 48 = 72.","list":{"small":{"letters":"MAPE","rule":"vowelsApart","task":"MAPE with the vowels not together","f":"`4! - 3! × 2!` = 24 − 12 = 12"},"full":{"letters":"MAPLE","rule":"vowelsApart","task":"MAPLE with the vowels not together","f":"`5! - 4! × 2!` = 120 − 48 = 72"}}},{"id":"s4","title":"Cases","problem":"4-digit even numbers with distinct digits from {0, 1, 2, 3, 4, 5}.","fixedOrder":true,"options":[{"id":"first","t":"Restriction first","why":"The last digit and the first digit both have rules that interact when 0 is involved, so split into cases.","_n":"1g3b9","_k":"094c5cb4"},{"id":"block","t":"Block","why":"No items have to stand together here.","_n":"1h3a9","_k":"9d10f054"},{"id":"sub","t":"Subtract (total − bad)","why":"Total − bad can work, but it needs cases of its own. Ending in 0 frees up the first digit; ending in 2 or 4 doesn’t. Count each case separately.","_n":"1i399","_k":"32d4a4c9"},{"id":"cases","t":"Cases","why":"Ending in 0 frees up the first digit; ending in 2 or 4 doesn’t. Count each case, then add.","_n":"1j389","_k":"e1e0e678"}],"rows":[{"t":"Ends in 0. Choices for the first digit (1 to 5): [[]]","_a":"Bw==","wrong":[{"match":6,"fb":"0 is used as the last digit and can’t lead anyway: 1 to 5."}]},{"t":"Ends in 0. Count, 5 × 4 × 3: [[]]","_a":"BFE="},{"t":"Ends in 2 or 4. Choices for the first digit (not 0, not the last digit): [[]]","_a":"Bg==","wrong":[{"match":5,"fb":"0 can’t lead either: Ending in 0 frees up the first digit; ending in 2 or 4 doesn’t. Count each case separately."}]},{"t":"Ends in 2 or 4. Count, 2 × 4 × 4 × 3: [[]]","_a":"C1c=","wrong":[{"match":120,"fb":"The first digit has 4 choices, not 5: 2 × 4 × 4 × 3."}]},{"t":"Total (add the cases): [[]]","_a":"A1RX","wrong":[{"match":180,"fb":"That lets 0 lead. Ending in 0 frees up the first digit; ending in 2 or 4 doesn’t. Count each case separately."},{"match":5760,"fb":"The cases don’t overlap, so add them: 60 + 96."}]}],"done":"60 + 96 = 156.","list":{"small":{"digits":[0,1,2,3],"r":3,"rule":"evenNumber","task":"3-digit even numbers with distinct digits from {0, 1, 2, 3}","f":"ends in 0: 3 × 2 = 6; ends in 2: 2 × 2 = 4; total 10"}}}],"quickCheck":{"title":"Quick check","summary":"Strategy chooser quick check","items":[{"id":"q1","goal":4,"prompt":"Best strategy for ‘Bo and Cy not next to each other’?","choices":[{"t":"Cases by height","fb":"Counting ‘apart’ directly is messy; subtract the together cases.","_n":"1k379","_k":"de640a89"},{"t":"Fill Bo first","fb":"Counting ‘apart’ directly is messy; subtract the together cases.","_n":"1l469","_k":"8d14db0a"},{"t":"Total − together","fb":"Right. Counting ‘apart’ directly is messy; subtract the together cases.","_n":"1m459","_k":"c08b7ae7"},{"t":"Ignore the rule","fb":"Counting ‘apart’ directly is messy; subtract the together cases.","_n":"1nc49","_k":"4d74b1a3"}]},{"id":"q2","goal":1,"prompt":"Arrangements of MAPLE that start with a consonant?","choices":[{"t":"24","fb":"3 consonants (M, P, L) × `4!` = 72.","_n":"1oc59","_k":"29f3a72b"},{"t":"48","fb":"3 consonants (M, P, L) × `4!` = 72.","_n":"1pc29","_k":"71b48a3f"},{"t":"72","fb":"Right. 3 consonants (M, P, L) × `4!` = 72.","_n":"1qc39","_k":"4372049c"},{"t":"120","fb":"3 consonants (M, P, L) × `4!` = 72.","_n":"1rc89","_k":"a8a1b153"}]},{"id":"q3","goal":2,"prompt":"4 people in a line with 2 particular people together?","choices":[{"t":"6","fb":"`3! × 2! = 12`.","_n":"1sc99","_k":"e2d9df4b"},{"t":"12","fb":"Right. `3! × 2! = 12`.","_n":"1tc69","_k":"9d3fd624"},{"t":"18","fb":"`3! × 2! = 12`.","_n":"1uc79","_k":"322c0167"},{"t":"24","fb":"`3! × 2! = 12`.","_n":"1vbc9","_k":"ad26327f"}]},{"id":"q4","goal":5,"prompt":"Even 3-digit numbers with distinct digits from {1, 2, 3, 4, 5}?","choices":[{"t":"12","fb":"Last digit 2 or 4, then 4 × 3: 2 × 12 = 24.","_n":"1wbd9","_k":"a9018c59"},{"t":"24","fb":"Right. Last digit 2 or 4, then 4 × 3: 2 × 12 = 24.","_n":"1xca9","_k":"77b6de67"},{"t":"30","fb":"Last digit 2 or 4, then 4 × 3: 2 × 12 = 24.","_n":"1yc99","_k":"5d452829"},{"t":"60","fb":"Last digit 2 or 4, then 4 × 3: 2 × 12 = 24.","_n":"1zcc9","_k":"5d66c3c0"}]}]}},"practice":{"activities":[{"id":"which","type":"sorter","title":"Which strategy?","summary":"Which strategy?","goal":4,"noun":"problem","txt":true,"instruction":"Sort each problem by the strategy that fits it best.","boxes":[{"id":"first","label":"Restriction first"},{"id":"block","label":"Block (together)"},{"id":"sub","label":"Subtract (apart / not)"},{"id":"cases","label":"Cases"}],"wrongDefault":"Does the rule fix a position, glue items, forbid something, or split into types?","items":[{"id":"i1","t":"Arrange 6 books with the dictionary at the left end","_a":"EAcIFEZCRw==","why":"The dictionary’s spot is fixed: fill it first, then arrange the other 5 books.","hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Restriction first\u003c/strong> card.","\u003cstrong>Restriction first.\u003c/strong> The dictionary’s spot is fixed: fill it first, then arrange the other 5 books: 1 × `5!`."]},{"id":"i2","t":"Seat 7 friends in a row with the twins side by side","_a":"EAMNCVZdRw==","why":"The twins must be side by side: glue them into a block, then multiply by `2!` for the order inside it.","hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Block (together)\u003c/strong> card.","\u003cstrong>Block (together).\u003c/strong> Glue the twins into a block: `6! × 2!`."]},{"id":"i3","t":"Seat 7 friends in a row with the twins \u003cstrong>not\u003c/strong> side by side","_a":"EBIUBBc=","why":"‘Not side by side’: all seatings minus the ones with the twins together.","wrong":{"block":"Block counts ‘together’. For ‘not together’, subtract the block count from the total."},"hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Subtract (apart / not)\u003c/strong> card.","\u003cstrong>Subtract (apart / not).\u003c/strong> All seatings minus the ones with the twins together: `7! - 6! × 2!`."]},{"id":"i4","t":"4-digit even numbers from digits 0–6, no repeats","_a":"EAIAFVBFRw==","why":"Ending in 0 frees up the first digit; ending in 2, 4 or 6 doesn’t. Count each case, then add.","wrong":{"first":"The last digit and the first digit both have rules that interact when 0 is involved, so split into cases."},"hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Cases\u003c/strong> card.","\u003cstrong>Cases.\u003c/strong> Ending in 0 frees up the first digit; ending in 2, 4 or 6 doesn’t. Count each case, then add."]},{"id":"i5","t":"Line up 5 children with the shortest at the front","_a":"EAcIFEZCRw==","why":"The front spot is fixed: fill it with the shortest child, then arrange the other 4.","hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Restriction first\u003c/strong> card.","\u003cstrong>Restriction first.\u003c/strong> The front spot is fixed: 1 × `4!`."]},{"id":"i6","t":"Shelve 3 math and 4 science books with all math books together","_a":"EAMNCVZdRw==","why":"The math books must stay together: glue them into a block, arrange the 5 items, then multiply by `3!` inside the block.","hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Block (together)\u003c/strong> card.","\u003cstrong>Block (together).\u003c/strong> Block the 3 math books: `5! × 3!`."]},{"id":"i7","t":"Arrange the letters of PRAIRIE so that the two R’s are not together","_a":"EBIUBBc=","why":"‘Not together’: all arrangements minus the ones with the R’s together.","hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Subtract (apart / not)\u003c/strong> card.","\u003cstrong>Subtract (apart / not).\u003c/strong> All arrangements minus the ones with the R’s together."]},{"id":"i8","t":"3-digit numbers from 1–9, no repeats, either less than 300 or ending in 5","_a":"EAIAFVBFRw==","why":"Two conditions joined by ‘or’: count each case, then subtract the overlap (numbers under 300 ending in 5).","wrong":{"first":"Two separate conditions joined by ‘or’ need cases, and the overlap (numbers under 300 ending in 5) must be subtracted once."},"hints":["Does the rule fix a position, glue items, forbid something, or split into types?","Look at the \u003cstrong>Cases\u003c/strong> card.","\u003cstrong>Cases.\u003c/strong> Count ‘less than 300’ and ‘ends in 5’, then subtract the numbers that are both."]}]},{"id":"multi","type":"numeric","title":"Multi-condition counts","summary":"Multi-condition counts","goal":[2,3,5,6],"star":true,"instruction":"Count the arrangements. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a whole number (1440 and 1 440 are both fine), then press Check.","items":[{"id":"r1","goal":2,"prompt":"Arrange the letters of CALGARY with the two A’s together.","_a":"BVNR","display":"720","label":"Number of ways:","why":"Glue the A’s into one block: 6 different items, `6! = 720`. The A’s are identical, so there’s no × `2!`.","wrong":[{"match":1440,"fb":"The A’s are identical, so swapping them inside the block changes nothing: no × `2!`."}],"hints":["Glue the two A’s into one block.","That makes 6 items: the AA block and C, L, G, R, Y.","The A’s are identical, so the block has only one order: `6! = 720`."]},{"id":"r2","goal":3,"star":true,"prompt":"Arrange the letters of CALGARY with the two A’s \u003cstrong>not\u003c/strong> together.","_a":"A1lRVg==","display":"1800","label":"Number of ways:","why":"All arrangements: `7!/2! = 2520`. Together: 720. 2520 − 720 = 1800.","wrong":[{"match":4320,"fb":"Total is `7!/2! = 2520` (the A’s repeat), not `7!`."}],"hints":["All arrangements: `7!/2! = 2520`.","Together (from R1): 720.","2520 − 720 = 1800."]},{"id":"r3","goal":5,"star":true,"prompt":"4-digit numbers greater than 5000 from {1, 2, 3, 5, 7, 9}, no repeats.","_a":"A1lR","display":"180","label":"Number of ways:","why":"The first digit must be 5, 7 or 9: 3 choices. Then `P(5, 3) = 60`. 3 × 60 = 180.","wrong":[{"match":360,"fb":"The first digit must be 5, 7 or 9: 3 × `P(5, 3)`."}],"hints":["Which digits can go first?","5, 7 or 9: 3 choices. Then fill 3 places from the 5 digits left.","3 × `P(5, 3)` = 3 × 60 = 180."]},{"id":"r4","goal":6,"star":true,"prompt":"4 boys and 3 girls line up, alternating boy–girl.","_a":"A1VV","display":"144","label":"Number of ways:","why":"The pattern must be B G B G B G B: the boys fill their 4 places in `4!` ways and the girls fill theirs in `3!` ways. 24 × 6 = 144.","wrong":[{"match":5040,"fb":"The pattern must be B G B G B G B: `4! × 3!`."}],"hints":["With 4 boys and 3 girls, where must the boys stand?","The pattern must be B G B G B G B.","`4! × 3!` = 24 × 6 = 144."]},{"id":"r5","goal":[2,6],"star":true,"prompt":"4 Grade 12s and 4 Grade 11s sit in a row: all Grade 12s together and all Grade 11s together.","_a":"A1BUVA==","display":"1152","label":"Number of ways:","why":"Two blocks in either order: `2!`. Inside each block: `4!`. 2 × 24 × 24 = 1152.","wrong":[{"match":576,"fb":"The two groups can go in either order: × 2."}],"hints":["Glue each grade into its own block.","2 blocks: `2!` orders. Inside each block: `4!` orders.","`2! × 4! × 4!` = 2 × 24 × 24 = 1152."]},{"id":"r6","goal":[3,6],"star":true,"prompt":"3 adults and 4 children sit in a row with no two adults side by side.","_a":"A1VVVg==","display":"1440","label":"Number of ways:","why":"Seat the 4 children: `4! = 24`. That makes 5 gaps; the adults take 3 different gaps: `P(5, 3) = 60`. 24 × 60 = 1440.","wrong":[{"match":3600,"fb":"‘Not all together’ isn’t the same as ‘no two together’. Use gaps: `4! × P(5, 3)`."},{"match":4320,"fb":"‘Not all together’ isn’t the same as ‘no two together’. Use gaps: `4! × P(5, 3)`."}],"hints":["Seat the 4 children first: `4!` ways.","That makes 5 gaps; each adult needs a different gap.","`P(5, 3) = 60`, and 24 × 60 = 1440."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Iker","how":"","goal":[2,3,5],"instruction":"Iker made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"6 friends line up; Mia and Noor must stand together.","steps":["Treat Mia and Noor as one block.","That gives 5 items to arrange: `5! = 120`.","So there are 120 line-ups."],"_a":"AA==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.",""],"fixes":[{"t":"Step 3 is correct.","why":"Swap Mia and Noor: is it a new line-up?","_n":"20cb9","_k":"72b4008e"},{"t":"Multiply by `2!` for the order inside the block: 120 × 2 = 240.","why":"Inside the block, Mia and Noor can swap: multiply by `2!`.","_n":"21c69","_k":"2b4a433c"},{"t":"Divide by `2!`: 60.","why":"Mia–Noor and Noor–Mia are different line-ups.","_n":"22c59","_k":"0e46b0eb"},{"t":"Add 2: 122.","why":"Orders multiply.","_n":"23c89","_k":"9079816f"}],"hints":["Can Mia and Noor swap inside the block?","Yes: 2 orders.","240."]},{"id":"e2","goal":3,"task":"6 friends line up; Mia and Noor must \u003cstrong>not\u003c/strong> stand together.","steps":["All line-ups: `6! = 720`.","Together: `5! = 120`.","Apart: 720 − 120 = 600."],"_a":"Aw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"The pair has 2 orders inside the block.","_n":"24c79","_k":"017694d3"},{"t":"Apart: `4! × 2 = 48`.","why":"That’s not how ‘apart’ is counted.","_n":"25c29","_k":"9618e617"},{"t":"Together: `5! × 2! = 240`, so apart = 720 − 240 = 480.","why":"Apart = total − together, and ‘together’ includes the order inside the block.","_n":"26c19","_k":"63a1ebb8"},{"t":"Together: `4! = 24`.","why":"There are 5 items (the block + 4 people).","_n":"27b07","_k":"624caf32"}],"hints":["Check the ‘together’ count.","Block × `2!`.","720 − 240 = 480."]},{"id":"e3","goal":5,"task":"4-digit even numbers with distinct digits from {0, 1, 2, 3, 4, 5}.","steps":["The last digit must be 0, 2 or 4: 3 choices.","First digit: 5 choices (anything but the last digit).","Then 4 and 3 choices: 3 × 5 × 4 × 3 = 180."],"_a":"Aw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Use 3 × `P(5, 3)` = 180.","why":"That still lets 0 lead.","_n":"28b17","_k":"412989fc"},{"t":"Step 2 is correct.","why":"When the last digit is 2, the first digit could still be 0: 0 is not allowed there.","_n":"29b27","_k":"1af16ea6"},{"t":"Split into cases. Ends in 0: 5 × 4 × 3 = 60. Ends in 2 or 4: the first digit can’t be 0 either, so 4 × 4 × 3 = 48 each, 96 in all. Total 156.","why":"Ending in 0 frees up the first digit; ending in 2 or 4 doesn’t. Count each case separately.","_n":"2ab37","_k":"1b727f0c"},{"t":"First digit: 6 choices.","why":"Even more over-counting. A 4-digit number can’t start with 0: the first digit has 9 choices, not 10.","_n":"2bb47","_k":"e8fa0a5f"}],"hints":["If the last digit is 2, which digits can lead?","1, 3, 4, 5: only 4, because 0 can’t lead.","Cases: 60 + 96 = 156."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which rule surprised you: ‘Ana before Bo’ being exactly half, or ‘all apart’ needing gaps?"},{"id":"j2","q":"In your own words, explain why ‘apart’ is easier to count as total − together."},{"id":"j3","q":"Explain to a friend how to decide between ‘restriction first’, ‘block’, ‘subtract’ and ‘cases’."},{"id":"j4","q":"Which kind of restriction still trips you up? Write one problem of your own that uses it."}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"7 people line up; two of them must stand together. How many line-ups?","options":[{"t":"720","why":"Multiply by `2!` for the pair’s order.","_n":"2cb57","_k":"6b18cf23"},{"t":"1440","why":"`6! × 2! = 1440`.","_n":"2db67","_k":"30acbce0"},{"t":"3600","why":"That’s the number with the two \u003cstrong>apart\u003c/strong>.","_n":"2eb77","_k":"a4dba73f"},{"t":"5040","why":"That ignores the rule.","_n":"2fb87","_k":"0cabfd0f"}]},"b":{"prompt":"6 people line up; two of them must stand together. How many line-ups?","options":[{"t":"120","why":"Multiply by `2!` for the pair’s order.","_n":"2gb97","_k":"9c70f18b"},{"t":"240","why":"`5! × 2! = 240`.","_n":"2hb67","_k":"84eecc8c"},{"t":"480","why":"That’s ‘apart’.","_n":"2ib57","_k":"963311f5"},{"t":"720","why":"That ignores the rule.","_n":"2jb47","_k":"8ef64c67"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"How many arrangements of the letters of PRINCE begin with a vowel?","options":[{"t":"120","why":"There are 2 vowels to choose from.","_n":"2kb37","_k":"a3e7e4c1"},{"t":"240","why":"2 vowels (I, E) × `5!` = 240.","_n":"2lba7","_k":"22351193"},{"t":"480","why":"That’s ‘begin with a consonant’.","_n":"2mb97","_k":"4629530d"},{"t":"720","why":"That ignores the rule.","_n":"2nb87","_k":"7017b007"}]},"b":{"prompt":"How many arrangements of PRINCE end with a consonant?","options":[{"t":"120","why":"There are 4 consonants to choose from.","_n":"2ob77","_k":"6ee9bfe1"},{"t":"240","why":"That’s ‘end with a vowel’.","_n":"2pbe7","_k":"c9a25cf0"},{"t":"480","why":"4 consonants × `5!` = 480.","_n":"2qbd7","_k":"0d0830df"},{"t":"720","why":"That ignores the rule.","_n":"2r835","_k":"cc167178"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which expression counts the line-ups of 8 people where Kai and Lee are \u003cstrong>not\u003c/strong> side by side?","options":[{"t":"`8! - 7! × 2!`","why":"Apart = total − together, and ‘together’ includes the order inside the block.","_n":"2s825","_k":"fe26ce23"},{"t":"`7! × 2!`","why":"That’s ‘together’.","_n":"2t855","_k":"e88928c8"},{"t":"`8!/2!`","why":"Kai and Lee aren’t identical.","_n":"2u845","_k":"c5f5a260"},{"t":"`8! - 7!`","why":"The pair has 2 orders in the ‘together’ count.","_n":"2v875","_k":"9f215768"}]},"b":{"prompt":"Which expression counts the line-ups of 10 people where two particular people are \u003cstrong>not\u003c/strong> side by side?","options":[{"t":"`10! - 9!`","why":"The pair has 2 orders in the ‘together’ count.","_n":"2w865","_k":"6fe6ad00"},{"t":"`9! × 2!`","why":"That’s ‘together’.","_n":"2x895","_k":"e816f9c8"},{"t":"`10! - 9! × 2!`","why":"Apart = total − together, and ‘together’ includes the order inside the block.","_n":"2y885","_k":"4e0e2dd3"},{"t":"`10! - 2!`","why":"Subtract every line-up with the pair together: `9! × 2!`, not `2!`.","_n":"2z8b5","_k":"7ab88bc5"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"How many 3-digit even numbers with distinct digits can be made from {0, 1, 2, 3, 4, 5, 6}?","options":[{"t":"75","why":"Add the numbers ending in 0.","_n":"308a5","_k":"23075c87"},{"t":"100","why":"4 even digits × 5 × 5 doesn’t treat the 0 case separately.","_n":"311d4","_k":"e229309b"},{"t":"105","why":"Ends in 0: 6 × 5 = 30. Ends in 2, 4 or 6: 5 × 5 each, so 75. Total 105.","_n":"321e4","_k":"ce69174e"},{"t":"120","why":"That lets 0 lead.","_n":"331b4","_k":"153f6c43"}]},"b":{"prompt":"How many 3-digit odd numbers with distinct digits can be made from {0, 1, 2, 3, 4, 5, 6}?","options":[{"t":"60","why":"The middle digit can be 0.","_n":"341c4","_k":"2c46cacd"},{"t":"75","why":"Last digit 1, 3 or 5; first digit 5 choices (not 0, not the last digit); middle 5. 3 × 5 × 5 = 75.","_n":"35194","_k":"cdbd9b7d"},{"t":"90","why":"That lets 0 lead.","_n":"361a4","_k":"b0c35c41"},{"t":"105","why":"That’s the even count.","_n":"37174","_k":"e70cce72"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"5 friends sit in a row of 5 seats. Ana must sit in an end seat, and Bo must not sit next to Ana. How many seatings?","options":[{"t":"12","why":"Bo has 3 allowed seats, not 1.","_n":"38184","_k":"9eb6f98a"},{"t":"36","why":"Ana: 2 ends. Bo: 3 seats not beside her. Others: `3! = 6`. 2 × 3 × 6 = 36.","_n":"39154","_k":"9f99033d"},{"t":"48","why":"That ignores Bo’s rule.","_n":"3a164","_k":"b4b99479"},{"t":"72","why":"Ana has only the 2 end seats.","_n":"3b174","_k":"5a6ab743"}]},"b":{"prompt":"5 friends sit in a row. Ana must sit in the middle seat, and Bo must not sit next to Ana. How many seatings?","options":[{"t":"12","why":"Ana: 1 seat. Bo: the 2 end seats. Others: `3! = 6`. 1 × 2 × 6 = 12.","_n":"3c164","_k":"a64083a4"},{"t":"18","why":"Bo has 2 choices, not 3.","_n":"3d154","_k":"0f4f6bdb"},{"t":"24","why":"That ignores Bo’s rule.","_n":"3e144","_k":"efb9f84f"},{"t":"36","why":"Ana’s seat is fixed.","_n":"3f1b4","_k":"05a21baa"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"Arrange the letters of LAKES so that L is first \u003cstrong>and\u003c/strong> the vowels A and E are together.","options":[{"t":"6","why":"The vowels can be AE or EA.","_n":"3g1a4","_k":"dae01bcc"},{"t":"12","why":"L fixed; then the block AE plus K and S: `3! × 2! = 12`.","_n":"3h194","_k":"966d8a90"},{"t":"24","why":"That ignores the vowel rule.","_n":"3i184","_k":"1539418f"},{"t":"48","why":"That ignores ‘L first’.","_n":"3j0f4","_k":"ce78d4e9"}]},"b":{"prompt":"Arrange the letters of LAKES so that S is last \u003cstrong>and\u003c/strong> the vowels are \u003cstrong>not\u003c/strong> together.","options":[{"t":"12","why":"S fixed; arrange L, A, K, E: `4! - 3! × 2!` = 24 − 12 = 12.","_n":"3k0e4","_k":"a55037a0"},{"t":"18","why":"Together = `3! × 2!` = 12, not 6.","_n":"3l114","_k":"67ec8bd7"},{"t":"24","why":"That ignores the vowel rule.","_n":"3m124","_k":"16d09761"},{"t":"72","why":"That ignores ‘S last’.","_n":"3n134","_k":"7f830f0b"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"Which is the best strategy explanation for counting line-ups of 9 people where 3 particular people must all
