.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 31: Balance and middle (D9 dot seesaw, middle view, weighted beam, D10 grouped histogram), Which centre? stations,
   Find it (N4 numEntry), Five quiz scores. Dots --pen; beam and fulcrum --ink; median bracket --hi (course plan §3). */
/* radioGroup (from MDM4U 19) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* Balance and middle */
.ct-top{margin-bottom:4px}
canvas.plot.ct-plot{aspect-ratio:16/10}
.ct-cap{font-size:clamp(1.05rem,2.4vw,1.4rem)}
.ct-terms{margin:10px 0 0;font:600 1rem var(--font-math);overflow-wrap:anywhere}
.ct-aha{margin:10px 0 0;font-size:.95rem}
.ct-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.ct-sh{margin:0 0 8px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.ct-how{margin:6px 0}
.ct-msg{min-height:1.2em;margin:6px 0 0}
.ct-chips{display:flex;flex-wrap:wrap;gap:6px}
.ct-chip{min-width:40px;min-height:38px;border:1.5px solid var(--pen);border-radius:999px;background:var(--sheet);color:var(--ink);font:700 1rem var(--font-math);padding:0 .6em}
.ct-chip[aria-pressed="true"]{background:var(--pen);color:var(--sheet);box-shadow:0 0 0 2px var(--sheet),0 0 0 4.5px var(--ink)}
.ct-add{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0}
.ct-al{font-weight:700;font-size:.9rem}
.ct-stb{min-width:38px;min-height:36px;padding:0 .5em}
.ct-ov{min-width:2.2em;text-align:center;font:700 1.08rem var(--font-math)}
.ct-wrows{display:grid;gap:8px}
.ct-wrow{border-bottom:1px solid var(--rule);padding:0 0 6px}
.ct-wl{margin:0 0 2px;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.ct-sl{margin:0 0 4px}
.ct-warn{min-height:1.2em;margin:6px 0 0;font-weight:700;color:var(--red)}
.ct-grows{display:grid;gap:4px}
.ct-grow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:3px 0;border-bottom:1px solid var(--rule)}
.ct-gl{font:700 1rem var(--font-math);min-width:5.2em}
.ct-gm{min-width:6.5em}
.ct-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}

/* Which centre? */
.wc-tabs{margin-bottom:6px}
.wc-card0{border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--sheet)}
.wc-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.wc-text{margin:0 0 8px}
.wc-ch{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.wc-c{min-height:38px}
.wc-c[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink)}
.wc-c:disabled[aria-pressed="true"]{opacity:1}
.wc-plotbox{border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.wc-pl{margin:0 0 4px;font-weight:700}
canvas.plot.wc-plot{aspect-ratio:16/8}
.wc-after{margin:12px 0 0}
.ct-tick{font-weight:700}

/* Find it (N4 numEntry, from MDM4U 20) */
.ne-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0}
.ne-lab{display:flex;align-items:center;gap:6px}
.ne-lab span{font-weight:700}
.ne-in{width:6.5rem}

/* Five quiz scores */
.ct-conds{margin:6px 0 10px 1.2em;padding:0}
.qs-in{display:grid;gap:4px}
canvas.plot.qs-plot{aspect-ratio:16/9}
@media (max-width:520px){canvas.plot.ct-plot{aspect-ratio:4/3}canvas.plot.wc-plot{aspect-ratio:16/10}}

of grouped data using class midpoints.","I can choose and justify the most appropriate measure of centre for a data set and its context.","I can work backwards from a mean to find a missing value or a needed score."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Ordering data","goal":1,"prompt":"What is the median of 7, 3, 9, 3, 5?","options":[{"t":"3","why":"3 is the most frequent value, not the middle.","_n":"0c60","_k":"d04887cf"},{"t":"5","why":"Sorted: 3, 3, 5, 7, 9. The third value is 5.","_n":"1c70","_k":"dcb7fba4"},{"t":"5.4","why":"27 ÷ 5 = 5.4 is the mean.","_n":"2c80","_k":"24b9220f"},{"t":"9","why":"9 is the middle of the unsorted list. Sort first.","_n":"3c90","_k":"3bdc1d9f"}],"hints":["Put the values in order.","3, 3, 5, 7, 9.","The middle one is 5."]},{"id":"w2","skill":"Ordering data","goal":1,"prompt":"What is the median of 12, 2, 10, 6?","options":[{"t":"6","why":"That averages the middle of the unsorted list (2 and 10). Sort first.","_n":"4ca0","_k":"796cce7c"},{"t":"7.5","why":"30 ÷ 4 = 7.5 is the mean.","_n":"5cb0","_k":"309a0a26"},{"t":"8","why":"Sorted: 2, 6, 10, 12. The middle two are 6 and 10, and their average is 8.","_n":"6cc0","_k":"d004012b"},{"t":"10","why":"That picks one middle value. Average the two middle values.","_n":"7bd0","_k":"153c3f91"}],"hints":["Sort, then count: there are 4 values.","The middle two are 6 and 10.","(6 + 10) ÷ 2 = 8."]},{"id":"w3","skill":"Computing a mean","goal":1,"prompt":"What is the mean of 4, 8, 9, 11?","options":[{"t":"8","why":"32 ÷ 4 = 8.","_n":"8be0","_k":"72116e60"},{"t":"8.5","why":"(8 + 9) ÷ 2 is the median.","_n":"94a7","_k":"0339a471"},{"t":"10.67","why":"That divides by 3. There are 4 values.","_n":"a497","_k":"cbf387f1"},{"t":"32","why":"32 is the total. Divide by the count.","_n":"b487","_k":"ebe89397"}],"hints":["Add, then divide by the count.","The total is 32.","32 ÷ 4 = 8."]},{"id":"w4","skill":"Computing a mean","goal":6,"prompt":"Four test marks have a mean of 70. What is their total?","options":[{"t":"17.5","why":"70 ÷ 4 undoes nothing; total = 70 × 4.","_n":"c477","_k":"4e68b3cd"},{"t":"70","why":"70 is the mean.","_n":"d4e7","_k":"e62e6410"},{"t":"74","why":"That adds the count. Multiply, don’t add.","_n":"e4d7","_k":"010faee8"},{"t":"280","why":"Total = mean × count = 70 × 4.","_n":"f4c7","_k":"0c331e7f"}],"hints":["Mean = total ÷ count.","So total = mean × count.","70 × 4 = 280."]},{"id":"w5","skill":"Reading frequency tables","goal":4,"prompt":"A table lists scores 1, 2 and 3 with frequencies 4, 1 and 5. How many data values are there?","options":[{"t":"3","why":"That counts the rows. Each row stands for several values.","_n":"g4b7","_k":"57a7772c"},{"t":"6","why":"1 + 2 + 3 adds the scores, not how many there are.","_n":"h427","_k":"5cc274df"},{"t":"10","why":"4 + 1 + 5 = 10.","_n":"i417","_k":"bfd3ce5e"},{"t":"21","why":"That adds score × frequency: that’s the total of all the values.","_n":"jd07","_k":"0cadee47"}],"hints":["Frequency means ‘how many’.","Add the frequency column.","10."]},{"id":"w6","skill":"Reading frequency tables","goal":5,"prompt":"Same table (scores 1, 2, 3 with frequencies 4, 1, 5). What is the mode?","options":[{"t":"1","why":"Score 1 appears only 4 times.","_n":"kd17","_k":"c22cd297"},{"t":"2","why":"Middle isn’t the same as most frequent.","_n":"lce7","_k":"a18a514d"},{"t":"3","why":"Score 3 appears 5 times, more than any other.","_n":"mcf7","_k":"df8964d8"},{"t":"5","why":"5 is how often; the mode is the score. The mode is the \u003cstrong>value\u003c/strong> that appears most often, not how many times it appears.","_n":"ncc7","_k":"09a00b0d"}],"hints":["Which score appears most often?","Compare the frequencies 4, 1, 5.","Score 3."]}],"refreshers":{"Ordering data":"Sort the data before finding a median. With \u003ci>n\u003c/i> values, the median is in position (\u003ci>n\u003c/i> + 1) ÷ 2. If that’s a half, average the two neighbours.","Computing a mean":"Mean = total ÷ count, so total = mean × count. Working with totals makes ‘missing value’ problems easy.","Reading frequency tables":"The frequency says how many times a value appears. \u003ci>n\u003c/i> = Σ\u003ci>f\u003c/i>, and the total of all values = Σ(value × \u003ci>f\u003c/i>)."}}},"explore":{"heading":"Balance and middle","intro":"Drag the dots, add new ones, and watch the three centres. The beam tips until the fulcrum reaches the mean; the bracket always marks the middle of the sorted dots.","predIntro":"Make a prediction first. Then the dot plot will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"bal"},"prompt":"Drag the 11 to 20. What happens?","options":[{"t":"Neither changes","_n":"ocd7","_k":"2de64d6f"},{"t":"The mean rises and the median stays at 5","_n":"pca7","_k":"ab80f122"},{"t":"Both rise","_n":"qcb7","_k":"8cbc9d53"},{"t":"The median rises and the mean stays","_n":"rc87","_k":"27bdb5a6"}],"explain":"The total grew by 9, so the mean grew. The middle value is still the 4th of 7. The mean uses the size of every value, so one extreme value drags it. The median only cares about position."},{"id":"p2","start":{"mode":"mid"},"prompt":"Add an eighth value, 6. What is the new median?","options":[{"t":"5","_n":"sc97","_k":"bee17ab6"},{"t":"5.5","_n":"tb67","_k":"d7814f76"},{"t":"6","_n":"ub57","_k":"d50b5b13"},{"t":"6.5","_n":"vb87","_k":"e8d3282d"}],"explain":"Eight values give two middle values: (5 + 6) ÷ 2 = 5.5."},{"id":"p3","start":{"mode":"wt"},"prompt":"Weighted mode: a test mark of 70 weighted 25% and an exam mark of 90 weighted 75%. What is the final mark?","options":[{"t":"75","_n":"wb77","_k":"dabd5f73"},{"t":"80","_n":"xba7","_k":"94ef9f0e"},{"t":"85","_n":"yb97","_k":"7437b8a0"},{"t":"90","_n":"zbc7","_k":"906a00c6"}],"explain":"The exam counts three times as much, so the final mark sits closer to 90. A simple average, 80, ignores the weights."},{"id":"p4","start":{"mode":"grp"},"prompt":"Grouped mode: classes [0, 10) with frequency 2, [10, 20) with 5, [20, 30) with 3. What is the estimated mean?","options":[{"t":"11","_n":"10bb7","_k":"3ce3e62a"},{"t":"15","_n":"11be7","_k":"54e829c4"},{"t":"16","_n":"12bd7","_k":"ca5ae9c9"},{"t":"53.3","_n":"13bc7","_k":"4e81edb8"}],"explain":"Use the midpoints and divide by the 10 values. Lower ends give 11, an underestimate; dividing by the 3 classes gives 53.3."}],"chalIntro":"Use the dot plot or the weighted panel to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[1,6],"prompt":"Make a set of 5 whole numbers (0–20) with mean 8 and median 6.","why":"Five values with mean 8 total 40, and the 3rd sorted value is 6. For example, 2, 4, 6, 12, 16 or 6, 6, 6, 10, 12.","hints":["Mean 8 with five values means a total of 40.","Put 6 in the middle, two values ≤ 6 below it and two values ≥ 6 above it.","For example, 2, 4, 6, 12, 16: the total is 40 and the middle is 6."]},{"id":"tc2","goal":[3,6],"prompt":"Weighted mode: your term mark is 72 and counts 70%. Set the exam mark (counts 30%) so your final mark is exactly 75.","why":"0.7 × 72 + 0.3 × 82 = 50.4 + 24.6 = 75.","hints":["Final = 0.7 × term + 0.3 × exam.","0.7 × 72 = 50.4, so 0.3 × exam must be 24.6.","Exam = 24.6 ÷ 0.3 = 82."]},{"id":"tc3","goal":[1,6],"stretch":true,"prompt":"Build a set of 6 whole numbers (0–20) whose mean, median and mode are all 10, with a range of exactly 12.","why":"The total is 60, the 3rd and 4th sorted values average 10, 10 appears more often than any other value, and the ends are 12 apart (e.g. 4, 8, 10, 10, 12, 16 or 4, 10, 10, 10, 10, 16).","hints":["The total must be 60, and the ends must be 12 apart.","Put 10 in both middle positions, then balance the ends around 10 (one 6 below, one 6 above).","4, 8, 10, 10, 12, 16 works: the 8 and 12 also balance."]}]},"part3":{"slug":"which-centre","name":"Which centre?","heading":"Which centre?","intro":"Each station is a real decision. Choose the centre that best describes the data in its context, then open \u003cstrong>Check it with data\u003c/strong> to see the numbers behind the choice.","stations":[{"id":"s1","title":"The paycheque","text":"Weekly pay at a small shop (in $100s) for 9 people: 3.8, 4.0, 4.2, 4.5, 4.5, 4.8, 5.2, 5.5, 25.0 (the owner). Which centre should you report as ‘typical pay’?","data":[3.8,4,4.2,4.5,4.5,4.8,5.2,5.5,25],"x0":0,"x1":26,"unit":"pay ($100s)","choices":[{"id":"mean","t":"Mean ($683)","fb":"Eight of nine people earn less than the mean. The owner’s $2500 drags it up. The mean uses the size of every value, so one extreme value drags it. The median only cares about position.","_n":"14bd7","_k":"878c3074"},{"id":"median","t":"Median ($450)","fb":"Eight of nine people earn less than the mean. The median describes a typical worker.","_n":"15be7","_k":"c056bceb"},{"id":"mode","t":"Mode ($450)","fb":"The mode matches the median here, but only two people earn exactly $450, so it says little. The median describes the middle worker.","_n":"16bf7","_k":"24a00f14"}],"check":"Total 61.5, so the mean is 61.5 ÷ 9 ≈ 6.83 ($683). Sorted, the median is the 5th value, 4.5 ($450)."},{"id":"s2","title":"The shoe order","text":"A store sold sizes 6, 7, 7, 8, 8, 8, 8, 9, 9, 10 last week. Which centre tells the store what to reorder most?","data":[6,7,7,8,8,8,8,9,9,10],"x0":5,"x1":11,"unit":"shoe size","choices":[{"id":"mean","t":"Mean","fb":"The store needs the size sold most often. The mean 8.0 happens to be a size here, but means are often impossible sizes such as 8.4.","_n":"17b87","_k":"564ab9f3"},{"id":"median","t":"Median","fb":"Half above isn’t ‘most popular’. The store needs the size sold most often.","_n":"18b97","_k":"845c1545"},{"id":"mode","t":"Mode","fb":"The mode (size 8) is the size sold most often, exactly what the store reorders most.","_n":"19ba7","_k":"36ac65fb"}],"check":"Size 8 sold 4 times, more than any other: the mode is 8. The mean 80 ÷ 10 = 8.0 happens to be a size here, but means are often impossible sizes such as 8.4."},{"id":"s3","title":"The test","text":"Marks 58, 64, 70, 72, 74, 76, 82, 90, with no extreme values. Which centre should you report to compare with last year’s class mean?","data":[58,64,70,72,74,76,82,90],"x0":50,"x1":100,"unit":"mark","choices":[{"id":"mean","t":"Mean","fb":"Report the mean (73.25): with no extreme marks it uses every mark, and it compares directly with last year’s class mean.","_n":"1abb7","_k":"dc498b54"},{"id":"median","t":"Median","fb":"The median (73) is close, but last year reported a mean, and with no extreme marks the mean uses every mark.","_n":"1bc47","_k":"7829f151"},{"id":"mode","t":"Mode","fb":"No mark repeats, so there is no mode.","_n":"1cc57","_k":"9322ec09"}],"check":"The mean is 586 ÷ 8 = 73.25 and the median is (72 + 74) ÷ 2 = 73: close, and the mean uses every mark."},{"id":"s4","title":"Which way is it skewed?","text":"Each dot plot shows its mean (the fulcrum) and its median (the bracket). Tap the shape of each data set.","plots":[{"id":"pa","label":"Plot A","data":[1,4,7,8,8,9,9,9,10,10],"_a":"QQ8EV0EV"},{"id":"pb","label":"Plot B","data":[1,1,2,2,2,3,3,4,6,9],"_a":"QREIVl1DEw=="},{"id":"pc","label":"Plot C","data":[2,3,4,4,5,5,5,6,6,7,8],"_a":"QRAYXBc="}],"shapes":[{"id":"right","t":"skewed right"},{"id":"sym","t":"symmetric"},{"id":"left","t":"skewed left"}],"rule":"The rule: the mean is pulled toward the tail. Mean above median: skewed right. Mean below median: skewed left. Mean ≈ median: roughly symmetric."}],"quickCheck":{"title":"Which centre? quick check","summary":"Which centre? quick check","items":[{"id":"q1","goal":5,"prompt":"Best centre for the typical price of homes on a street with two mansions?","choices":[{"t":"Mode","fb":"The two mansions pull the mean up; prices rarely repeat, so the mode says little. Use the median.","_n":"1d427","_k":"53b6c484"},{"t":"Range","fb":"Range measures spread, not centre. The two mansions pull the mean up.","_n":"1e417","_k":"38573d3a"},{"t":"Median","fb":"Right. The median stays with the typical home.","_n":"1f407","_k":"ff1fa607"},{"t":"Mean","fb":"The two mansions pull the mean up.","_n":"1g3f7","_k":"18f7fc52"}]},{"id":"q2","goal":5,"prompt":"Best centre for the most popular pizza topping?","choices":[{"t":"Midpoint","fb":"Toppings are categories. Only the mode works.","_n":"1h3e7","_k":"1d9bcc72"},{"t":"Median","fb":"Toppings are categories. Only the mode works.","_n":"1i3d7","_k":"6d9005e2"},{"t":"Mean","fb":"Toppings are categories. Only the mode works.","_n":"1j3c7","_k":"0e716392"},{"t":"Mode","fb":"Right. Toppings are categories, so only the mode works.","_n":"1k3b7","_k":"0dd41bbd"}]},{"id":"q3","goal":2,"prompt":"The mean is 52 and the median is 45. The data are probably…","choices":[{"t":"bimodal","fb":"High values pull the mean above the median.","_n":"1l4a7","_k":"136589a3"},{"t":"skewed right","fb":"Right. High values pull the mean above the median.","_n":"1m497","_k":"9ebb852d"},{"t":"symmetric","fb":"High values pull the mean above the median.","_n":"1n488","_k":"ae01d511"},{"t":"skewed left","fb":"High values pull the mean above the median.","_n":"1o498","_k":"2087e3d9"}]},{"id":"q4","goal":2,"prompt":"Which centre changes most if the largest value doubles?","choices":[{"t":"Mean","fb":"Right. Only the mean uses the size of the largest value.","_n":"1p468","_k":"7092f6ee"},{"t":"Mode","fb":"Only the mean uses the size of the largest value.","_n":"1q478","_k":"0f591411"},{"t":"None","fb":"Only the mean uses the size of the largest value.","_n":"1r4c8","_k":"a9aa9476"},{"t":"Median","fb":"Only the mean uses the size of the largest value.","_n":"1s4d8","_k":"d86b47b8"}]}]}},"practice":{"activities":[{"id":"fits","type":"sorter","title":"Which centre fits?","summary":"Which centre fits?","goal":[5,2],"noun":"situation","txt":true,"instruction":"Sort each situation by the centre that describes it best.","how":"Tap a situation, then tap the box it belongs in.","boxes":[{"id":"mean","label":"Mean","sub":"symmetric, no extremes"},{"id":"median","label":"Median","sub":"skewed or with outliers"},{"id":"mode","label":"Mode","sub":"categories or most popular"}],"wrongDefault":"Ask: is the data categorical, skewed or symmetric?","items":[{"id":"i1","goal":5,"t":"The T-shirt size a club should order most of","_a":"QQ4OVVAV","why":"The club needs the size wanted most often: the mode."},{"id":"i2","goal":[5,2],"t":"A typical house price in a city with some very expensive homes","_a":"QQ4EVVxWXxY=","why":"A few very expensive homes pull the mean up; the median stays with the typical home.","wrong":{"mean":"A few very large values pull the mean up. The median resists them."}},{"id":"i3","goal":5,"t":"A class’s test performance with no extreme marks, to compare with last year","_a":"QQ4EUFsV","why":"No extreme marks, so the mean uses every mark and compares fairly."},{"id":"i4","goal":5,"t":"The favourite type of music in a school survey","_a":"QQ4OVVAV","why":"Music types are categories: only the mode works.","wrong":{"median":"Music types can’t be put in numerical order; only the mode works."}},{"id":"i5","goal":[5,2],"t":"A typical commute when a few people travel over two hours","_a":"QQ4EVVxWXxY=","why":"The two-hour commutes pull the mean up but not the middle.","hints":["What do the two-hour commutes do to each centre?","They pull the mean up but not the middle.","Median."]},{"id":"i6","goal":5,"t":"The average daily high temperature in July (no extremes)","_a":"QQ4EUFsV","why":"With no extremes, the mean uses every day’s high."},{"id":"i7","goal":[5,2],"t":"A typical family income in a town","_a":"QQ4EVVxWXxY=","why":"A few high incomes pull the mean up; the median describes a typical family.","wrong":{"mean":"A few very large values pull the mean up. The median resists them."}},{"id":"i8","goal":5,"t":"The bus route used most often","_a":"QQ4OVVAV","why":"Routes are categories: the mode is the route used most often."},{"id":"i9","goal":5,"t":"A hockey player’s goals per game over a full season, used to compute season totals","_a":"QQ4EUFsV","why":"Season totals come from mean × games, so the mean is the useful centre here.","wrong":{"median":"Season totals come from mean × games, so the mean is the useful centre here."}}]},{"id":"find","type":"custom","title":"Find it","summary":"Find it","goal":[1,3,4,6],"star":true,"instruction":"Find each centre. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a number such as 7.5, then press Check.","items":[{"id":"f1","goal":1,"prompt":"Median of 3, 7, 7, 2, 9, 12, 5, 10","_a":"VA==","display":"median 7","why":"Sorted: 2, 3, 5, 7, 7, 9, 10, 12. The middle two are 7 and 7, so the median is 7.","wrong":[{"match":9,"fb":"Sort: 2, 3, 5, 7, 7, 9, 10, 12. The middle two are 7 and 7."},{"match":7.5,"fb":"Sort: 2, 3, 5, 7, 7, 9, 10, 12. The middle two are 7 and 7."}],"fb":"The median is the middle of the \u003cstrong>sorted\u003c/strong> data. Put the values in order first."},{"id":"f2","goal":3,"prompt":"Tests count 40%, assignments 20% and the exam 40%. The marks are 75, 90 and 60. Final mark?","_a":"VFE=","display":"72","why":"0.4 × 75 + 0.2 × 90 + 0.4 × 60 = 30 + 18 + 24 = 72.","wrong":[{"match":75,"fb":"That’s the simple average. A weighted mean multiplies each value by its weight. A simple average treats every part as equally important."}],"fb":"A weighted mean multiplies each value by its weight. A simple average treats every part as equally important."},{"id":"f3","goal":4,"star":true,"prompt":"Ages: [10, 20) has frequency 6, [20, 30) has 10 and [30, 40) has 4. Estimate the mean age.","_a":"UVc=","display":"about 24","why":"Midpoints 15, 25 and 35: (90 + 250 + 140) ÷ 20 = 480 ÷ 20 = 24.","wrong":[{"match":19,"fb":"Use midpoints, not lower ends."},{"match":160,"fb":"Divide by 20 values, not 3 classes."}],"fb":"Use each class’s midpoint, and divide by the total frequency, not the number of classes."},{"id":"f4","goal":6,"star":true,"prompt":"Six numbers have a mean of 15. One is removed and the other five have a mean of 14. What was removed?","_a":"UVM=","display":"20","why":"Totals: 6 × 15 = 90 and 5 × 14 = 70, so the removed number is 90 − 70 = 20.","wrong":[{"match":1,"fb":"Use totals: 90 − 70 = 20."},{"match":14.5,"fb":"Use totals: 90 − 70 = 20."}],"fb":"Means don’t average like that. Work with totals: total = mean × number of values."},{"id":"f5","goal":6,"star":true,"prompt":"Class A has 20 students with mean 70; class B has 30 students with mean 80. What is the combined mean?","_a":"VFU=","display":"76","why":"(1400 + 2400) ÷ 50 = 3800 ÷ 50 = 76.","wrong":[{"match":75,"fb":"The classes are different sizes: (1400 + 2400) ÷ 50."}],"fb":"Means don’t average like that. Work with totals: total = mean × number of values.","hints":["Find each class’s total.","20 × 70 = 1400 and 30 × 80 = 2400.","3800 ÷ 50 = 76."]},{"id":"f6","goal":[1,6],"star":true,"prompt":"Seven numbers have median 10 and mean 12. Every value is doubled, then 3 is added. Enter the new median, then the new mean.","parts":["New median =","New mean ="],"_a":"OFFSHQcAbA==","display":"median 23, mean 27","why":"Doubling then adding 3 does the same thing to every value, in order: median 2 × 10 + 3 = 23 and mean 2 × 12 + 3 = 27.","wrong":[{"part":0,"match":20,"fb":"You doubled but forgot to add 3."},{"part":1,"match":24,"fb":"You doubled but forgot to add 3."},{"part":0,"match":13,"fb":"You added 3 but forgot to double."},{"part":1,"match":15,"fb":"You added 3 but forgot to double."}],"hints":["Doubling then adding 3 does the same thing to every value, in order.","The middle value is still the middle: 2 × 10 + 3.","Median 23; mean 2 × 12 + 3 = 27."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Gemma","goal":[1,3,4],"instruction":"Gemma made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Find the ,"task":"Estimate the mean: class [0, 10) has frequency 4 and [10, 20) has 6.","steps":["The midpoints are 5 and 15.","Multiply: 5 × 4 = 20 and 15 × 6 = 90.","Add: 20 + 90 = 110.","Divide by the number of classes: 110 ÷ 2 = 55."],"_a":"UA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"Divide by the total frequency: 110 ÷ 10 = 11.","why":"There are 4 + 6 = 10 values, so the estimate is 110 ÷ 10 = 11.","_n":"214a8","_k":"b36d6f1d"},{"t":"Divide by 20, the top of the last class.","why":"The divisor is the number of values.","_n":"22498","_k":"4aee67b9"},{"t":"Use lower ends instead: (0 + 60) ÷ 10.","why":"Midpoints give the better estimate. Use each class’s midpoint, and divide by the total frequency, not the number of classes.","_n":"234c8","_k":"ba1af2ba"},{"t":"Step 4 is correct.","why":"55 is bigger than every value in the data.","_n":"244b8","_k":"a7f6e78c"}],"hints":["How many values are in the table?","4 + 6 = 10.","110 ÷ 10 = 11."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: how far the mean moved, or how still the median stayed?"},{"id":"j2","q":"In your own words, explain why the mean is called a balance point."},{"id":"j3","q":"Explain to a friend how to estimate the mean from a grouped frequency table."},{"id":"j4","q":"When choosing between mean and median, what do you still find tricky? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is the median of 15, 9, 22, 9, 18, 12?","options":[{"t":"12","why":"Average the two middle values: 12 and 15.","_n":"25468","_k":"c99b0379"},{"t":"13.5","why":"Sorted: 9, 9, 12, 15, 18, 22. (12 + 15) ÷ 2 = 13.5.","_n":"26458","_k":"5e3a3a8e"},{"t":"14.17","why":"85 ÷ 6 is the mean.","_n":"27345","_k":"e9db4f93"},{"t":"15.5","why":"Sort first. The median is the middle of the \u003cstrong>sorted\u003c/strong> data. Put the values in order first.","_n":"28355","_k":"e366bba5"}]},"b":{"prompt":"What  × 70 = 432 − 350.","_n":"301c1","_k":"22dde39d"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Classes: [0, 4) frequency 3, [4, 8) frequency 5, [8, 12) frequency 2. Estimate the mean.","options":[{"t":"3.6","why":"That uses the lower ends. Use each class’s midpoint, and divide by the total frequency, not the number of classes.","_n":"31af1","_k":"80c447a2"},{"t":"5.6","why":"(2 × 3 + 6 × 5 + 10 × 2) ÷ 10 = 56 ÷ 10.","_n":"32b01","_k":"efe79d91"},{"t":"6","why":"That’s just the modal class’s midpoint.","_n":"33ad1","_k":"4d7ed546"},{"t":"18.7","why":"Divide by 10 values, not 3 classes.","_n":"34ae1","_k":"77a29c9c"}]},"b":{"prompt":"Classes: [10, 20) frequency 4, [20, 30) frequency 4, [30, 40) frequency 2. Estimate the mean.","options":[{"t":"18","why":"That uses the lower ends. Use each class’s midpoint, and divide by the total frequency, not the number of classes.","_n":"35ab1","_k":"96c4b542"},{"t":"23","why":"(60 + 100 + 70) ÷ 10.","_n":"36ac1","_k":"c4468bb7"},{"t":"25","why":"Middle class midpoint only.","_n":"37a91","_k":"33e42d93"},{"t":"76.7","why":"Divide by 10 values, not 3 classes.","_n":"38aa1","_k":"3f15f53c"}]}},{"id":"t3","cat":"T","goal":[1,6],"a":{"prompt":"Five whole numbers have mean 8, median 9 and only one mode, 10. The smallest is 3. What is the second smallest?","options":[{"t":"8","why":"Sorted: 3, ?, 9, 10, 10 (the mode needs two 10s). Total 40, so ? = 40 − 32 = 8.","_n":"39a71","_k":"15f0e854"},{"t":"9","why":"That copies the median; then 9 would tie 10 as a mode.","_n":"3aa81","_k":"87b1bde0"},{"t":"13","why":"That uses 5 × 9 = 45 as the total; the total comes from the mean.","_n":"3ba91","_k":"207fdf1e"},{"t":"18","why":"Only one 10 is used; the mode needs at least two, and 18 can’t sit below the median.","_n":"3ca81","_k":"837158a2"}]},"b":{"prompt":"Five whole numbers have mean 12, median 13 and only one mode, 15. The smallest is 5. What is the second smallest?","options":[{"t":"12","why":"5, ?, 13, 15, 15 with total 60: ? = 12.","_n":"3da71","_k":"4d63ce35"},{"t":"13","why":"That would tie 13 with 15 as a mode.","_n":"3ea61","_k":"977c21de"},{"t":"17","why":"5 × 13 = 65 uses the median.","_n":"3fad1","_k":"1e2149c3"},{"t":"27","why":"One 15 isn’t enough for a mode.","_n":"3gac1","_k":"bd4131c5"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation for reporting the median house price in a town where a few mansions sold?","options":[{"t":"“The median uses every price, so it’s more accurate.”","why":"That describes the mean, not the median.","_n":"3hab1","_k":"64ecc0bf"},{"t":"“The mode is best, because prices repeat.”","why":"House prices rarely repeat exactly.","_n":"3iaa1","_k":"4f3e3f7d"},{"t":"“The mean is always wrong for money.”","why":"Means of money are fine when the data aren’t skewed.","_n":"3ja11","_k":"9f74b48e"},{"t":"“The few very high prices pull the mean up, but the median stays with the typical home.”","why":"The median resists the few extreme prices.","_n":"3ka01","_k":"ce2b18e5"}]},"b":{"prompt":"Which is the best explanation for using the mode to decide which shoe size to stock most?","options":[{"t":"“The median is best, because half the sales are above it.”","why":"Half above isn’t ‘most popular’.","_n":"3la31","_k":"974f1366"},{"t":"“Use the range, because it shows all sizes.”","why":"Range measures spread, not popularity.","_n":"3ma41","_k":"d145eec0"},{"t":"“The store needs the size sold most often, and the mode is exactly that.”","why":"The mode is the most frequent value.","_n":"3na51","_k":"a184bd81"},{"t":"“The mean is best, because it uses every sale.”","why":"A mean such as 8.4 isn’t a size you can stock.","_n":"3oa61","_k":"08167a34"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which statement correctly describes the mean?","options":[{"t":"“It’s the most frequent value.”","why":"That’s the mode.","_n":"3pa71","_k":"ad4f8106"},{"t":"“It’s the balance point: the total distance of values above it equals the total distance below it.”","why":"The mean is where the data balance.","_n":"3qa81","_k":"874d0423"},{"t":"“It’s halfway between the largest and smallest values.”","why":"That’s the midrange.","_n":"3ra91","_k":"e7f8de0e"},{"t":"“It’s the middle value when the data are sorted.”","why":"That’s the median.","_n":"3saa1","_k":"ed569577"}]},"b":{"prompt":"A data set’s mean is greater than its median. Which is the best description?","options":[{"t":"“A few large values (a right tail) pull the mean up; the data are skewed right.”","why":"The mean is pulled toward the tail.","_n":"3t9b1","_k":"976d0dc0"},{"t":"“The data are skewed left.”","why":"The mean is pulled toward the tail, which here is on the right.","_n":"3u9c1","_k":"19799c77"},{"t":"“The data must be symmetric.”","why":"In symmetric data the mean and median are close.","_n":"3vad2","_k":"c04e54d6"},{"t":"“The median was calculated wrongly.”","why":"Both can be correct; the gap tells you about the shape.","_n":"3wac2","_k":"d2c1b604"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A café sold 40 small coffees at $2, 50 medium at $3 and 10 large at $4. What was the mean price per coffee sold?","options":[{"t":"$2.30","why":"The large sizes are missing.","_n":"3xaf2","_k":"5c1df24e"},{"t":"$2.70","why":"(80 + 150 + 40) ÷ 100 = 270 ÷ 100.","_n":"3yae2","_k":"3bd8b773"},{"t":"$3.00","why":"Average of the three prices. A weighted mean multiplies each value by its weight. A simple average treats every part as equally important.","_n":"3za92","_k":"2f461303"},{"t":"$90.00","why":"Divide by 100 coffees, not 3 sizes.","_n":"40a82","_k":"99452ca5"}]},"b":{"prompt":"A theatre sold 60 student tickets at $10, 30 adult tickets at $15 and 10 senior tickets at $12. What was the mean price per ticket?","options":[{"t":"$10.50","why":"Seniors missing.","_n":"41ab2","_k":"e841a8ee"},{"t":"$11.70","why":"(600 + 450 + 120) ÷ 100.","_n":"42aa2","_k":"73eb6131"},{"t":"$12.33","why":"Average of the three prices. A weighted mean multiplies each value by its weight. A simple average treats every part as equally important.","_n":"43a52","_k":"c6db5873"},{"t":"$390.00","why":"Divide by 100 tickets, not 3 ticket types.","_n":"44a42","_k":"a0a6b17d"}]}},{"id":"a2","cat":"A","goal":5,"a":{"prompt":"Model data: weekly earnings of 10 store workers: $120, $150, $150, $160, $180, $190, $200, $210, $240, $1200 (the manager). The store advertises ‘average weekly pay: $280’. Which statement is best?","options":[{"t":"“The mode, $150, is the fairest figure.”","why":"Only two workers earn $150; the mode says little here.","_n":"45a71","_k":"948c7946"},{"t":"“$280 is the mean, pulled up by the manager’s $1200; the median of $185 better describes a typical worker.”","why":"Nine of ten workers earn less than $280.","_n":"46a81","_k":"56a477a5"},{"t":"“The ad is false: the mean is really $185.”","why":"Total 2800 ÷ 10 = 280; $185 is the median.","_n":"47a51","_k":"3062055a"},{"t":"“The ad is fair, because a mean uses everyone’s pay.”","why":"Nine of ten workers earn less than $280.","_n":"48a61","_k":"94d17656"}]},"b":{"prompt":"Model data: ages at a family reunion: 2, 4, 5, 6, 7, 8, 9, 10, 40, 70. An organizer says the ‘average age’ is about 16. Which statement is best?","options":[{"t":"“The average is wrong: it’s 7.5.”","why":"161 ÷ 10 = 16.1 is the mean.","_n":"49ab1","_k":"24e0e433"},{"t":"“There’s no typical age, because there is no mode.”","why":"Median still works without a mode.","_n":"4aac1","_k":"ca5d7bee"},{"t":"“16.1 is the mean, pulled up by two adults; the median of 7.5 better describes the typical person there.”","why":"Eight of the ten people are 10 or younger.","_n":"4ba91","_k":"20ae2d50"},{"t":"“16 is typical, because the mean uses everyone.”","why":"The mean uses the size of every value, so one extreme value drags it. The median only cares about position.","_n":"4caa1","_k":"911439da"}]}}]},"task":{"title":"Five quiz scores","summary":"Five quiz scores","statement":"\u003cp>Design five quiz scores (whole numbers out of 10) that meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"ct-conds\">\u003cli>The mean is 6.\u003c/li>\u003cli>The median is 7.\u003c/li>\u003cli>The only mode is 8.\u003c/li>\u003cli>The range is at most 7.\u003c/li>\u003c/ol>","checks":["Mean 6","Median 7","Only mode 8","Range at most 7"],"tips":["Mean 6 with five scores means a total of 30.","The middle score must be 7.","For 8 to be the only mode, it must appear at least twice, and no other score may appear as often.","The highest score is 8 or more, so the lowest must be at least 1."],"explainPrompt":"Explain how you used totals, the middle position and the mode to build your scores.","vocab":"Use the words mean, total, median, mode and range.","more":"There’s more than one answer. Can you find them all?","after3":"The two 8s and the 7 take 23 of the 30 points, so the two lowest scores add to 7. They must differ (or they’d tie the 8s as a mode) and be at least 1: 1 + 6, 2 + 5 or 3 + 4."},"cards":[["Mean","Total ÷ count. The balance point of the data."],["Median","The middle of the \u003cstrong>sorted\u003c/strong> data; with an even count, the average of the two middle values."],["Mode","The most frequent \u003cstrong>value\u003c/strong>. The only centre for categorical data."],["Median position","(\u003ci>n\u003c/i> + 1) ÷ 2 in the sorted list."],["Outlier effect","It drags the mean; the median barely moves."],["Skewed right","A long tail of high values: mean > median."],["Weighted mean","Σ\u003ci>wx\u003c/i> ÷ Σ\u003ci>w\u003c/i>. Example: 0.25 × 70 + 0.75 × 90 = 85."],["Grouped mean (estimate)","Σ(\u003ci>f\u003c/i> × midpoint) ÷ Σ\u003ci>f\u003c/i>."],["Working backwards","Total = mean × \u003ci>n\u003c/i>. Compare totals, not means."],["Combining groups","Combined mean = (total₁ + total₂) ÷ (\u003ci>n\u003c/i>₁ + \u003ci>n\u003c/i>₂)."],["Best centre: skewed data","Median (incomes, house prices, commute times)."],["Best centre: symmetric data","Mean (it uses every value)."]]}};</sc
