.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 14: hero, Expansion builder (choice words, term breakdown, term finder, D5 mini triangle), Working backwards
   (balance stations, coin station + D6 simulator), Expand it (N4 coefficient lists), Design a binomial task.
   First part (a) is --pen blue, second part (b) is teal --f3, throughout (plan §5). */

/* radioGroup (from MDM4U 01) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button .m{white-space:nowrap}

/* hero equation: C(n, k) linked down to row n of a small triangle */
.bt-heq{display:inline-grid;grid-template-columns:auto auto auto auto;align-items:center;column-gap:.18em;row-gap:0;line-height:1.1}
.bt-hl{grid-column:1;grid-row:1}
.bt-sig{grid-column:2;grid-row:1;display:inline-flex;flex-direction:column;align-items:center;line-height:.9;font-style:normal}
.bt-sigs{font-size:1.25em}
.bt-sigt,.bt-sigb{font-size:.3em;line-height:1.2}
.bt-hc{grid-column:3;grid-row:1;justify-self:center;padding:0 .05em;border-bottom:3px solid var(--ink)}
.bt-hr{grid-column:4;grid-row:1}
.bt-hline{grid-column:3;grid-row:2;justify-self:center;width:0;height:.55em;border-left:2px solid var(--ink)}
.bt-htri{grid-column:3;grid-row:3;justify-self:center;width:0;display:flex;justify-content:center}
.bt-hmini{display:inline-flex;flex-direction:column;align-items:center;gap:2px;font:600 .82rem/1 var(--font-ui);font-style:normal;white-space:nowrap}
.bt-hmr{display:flex;gap:3px;align-items:center;position:relative}
.bt-hmc{display:inline-flex;align-items:center;justify-content:center;min-width:1.55em;height:1.3em;border-radius:4px;color:var(--ink-2)}
.bt-hmr.on .bt-hmc{background:var(--hi-soft);color:var(--ink);font-weight:700}
.bt-hmr.on .bt-hmc.k{outline:2px solid var(--ink)}
.bt-hmlab{position:absolute;left:100%;margin-left:6px;font-size:.78rem;color:var(--ink);font-weight:700}
.bt-hmlab .m{font-size:1.1em}

/* hero animation */
.bt-h{max-width:440px;margin:0 auto}
.bt-h svg{display:block;width:100%;height:auto}
.bt-hp{fill:var(--ink);font:400 26px var(--font-math);text-anchor:middle}
.bt-hp.sm{font-size:20px}
.bt-hla,.bt-hlb{font:italic 400 26px var(--font-math);text-anchor:middle}
.bt-hla{fill:var(--pen)}.bt-hlb{fill:var(--f3)}
.bt-hring{fill:var(--hi-soft);stroke:var(--hi);stroke-width:3;transition:cx .12s}
.bt-hw{font:italic 600 21px var(--font-math)}
.bt-hw .bt-hla,.bt-hw .bt-hlb,.bt-hterm .bt-hla,.bt-hterm .bt-hlb{font-size:inherit}
.bt-hcnt{fill:var(--ink-2);font:700 14px var(--font-ui);text-anchor:middle}
.bt-hterm{fill:var(--ink);font:400 22px var(--font-math)}
.bt-hsup{font-size:inherit}
.bt-htri{fill:var(--ink-2);font:600 14px var(--font-ui)}
.bt-htri.on{fill:var(--ink);font-weight:700}
.bt-hrow{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.2}
.bt-hrowl{fill:var(--ink);font:700 13px var(--font-ui)}

/* explore */
.bt-top{margin:0 0 12px}
.bt-pctx{display:block;font-size:.85rem;font-weight:700;color:var(--ink-2);margin-bottom:2px}
.bt-cap .m{font-size:1em}
.bt-panel{margin-top:8px}
.bt-parts{margin:0 0 8px;font-size:.95rem}
.bt-brk{margin:0 0 8px;font-size:1.35rem;overflow-wrap:anywhere}
.bt-brk .m{white-space:normal}
.bt-wact{margin:0 0 8px}
.bt-wlist{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.bt-w{display:inline-flex;align-items:center;justify-content:center;min-width:2.6em;padding:3px 7px;border:1.3px solid var(--ink-2);border-radius:999px;background:var(--sheet);font:italic 600 1.05rem/1.1 var(--font-math);letter-spacing:.03em;will-change:transform}
.bt-la{color:var(--pen);font-style:italic}.bt-lb{color:var(--f3);font-style:italic;font-family:var(--font-math)}
.bt-w.bt-glow,.bt-g.bt-glow .bt-w{background:var(--hi);border-color:var(--ink);box-shadow:0 0 0 2px var(--hi)}
.bt-w.bt-glow .bt-la,.bt-w.bt-glow .bt-lb,.bt-g.bt-glow .bt-w i{color:var(--hi-ink)}
.bt-groups{display:grid;gap:6px}
.bt-g{display:grid;grid-template-columns:6.2em minmax(0,1fr);gap:4px 10px;align-items:center;padding:6px 8px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.bt-g.bt-glow{border-color:var(--ink);background:var(--hi-soft)}
.bt-gh{margin:0;font-size:.9rem;font-weight:700}
.bt-gc{display:inline-block;min-width:1.6em;padding:0 .3em;border-radius:6px;background:var(--sheet);text-align:center}
.bt-gw{display:flex;flex-wrap:wrap;gap:5px}
.bt-gt{grid-column:2;margin:0;font-size:.95rem;overflow-wrap:anywhere}
.bt-gsum .bt-gt{grid-column:2}
.bt-gt .m,.bt-ph .m,.bt-sum .m{white-space:normal}
.bt-wcount,.bt-wnote{margin:8px 0 0;font-size:.95rem}
.bt-ph{margin:0 0 8px;font-size:.95rem}
.bt-rows{display:grid;gap:4px;max-height:420px;overflow:auto;border:1.5px solid var(--rule);border-radius:8px;padding:6px;background:var(--paper)}
.bt-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:5px 8px;border-radius:6px;background:var(--sheet);font-size:1.08rem;transition:opacity .3s,transform .3s}
.bt-row.bt-hid{opacity:0;transform:translateY(-6px)}
.bt-row.bt-hit,.bt-t.bt-hit,.bt-sum.bt-hit{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 2px var(--ink)}
.bt-row.bt-hit .m,.bt-row.bt-hit .p-n,.bt-row.bt-hit .p-d,.bt-t.bt-hit .m{color:var(--hi-ink)}
.bt-rk{font-size:.85rem;color:var(--ink-2);min-width:3.4em}
.bt-rp{white-space:nowrap}
.bt-rr{font-weight:700}
.bt-sum{margin:8px 0 0;padding:4px 6px;border-radius:6px;font-size:.98rem;overflow-wrap:anywhere}
.bt-rule{font-size:.85rem}
.bt-exp{display:inline}
.bt-t{display:inline-block;white-space:nowrap;border-radius:4px;padding:0 2px}
.bt-gen{margin:0 0 10px;font-size:1.08rem;overflow-wrap:anywhere}
.bt-gen .m{white-space:normal}
.bt-tfin [hidden]{display:none}
.bt-tfin .numrow{margin-top:4px}
.bt-tfout{margin-top:10px}
.bt-tfout p{margin:6px 0 0}
.bt-tfs .m{white-space:nowrap}
.bt-tfterm{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:1.1rem;padding:6px 8px;border:1.5px solid var(--ink);border-radius:8px;background:var(--hi-soft)}
.bt-tfc{font-size:1.05rem}
.bt-tfmsg{color:var(--ink-2)}
.bt-chal{margin-top:12px;padding-top:8px;border-top:1px solid var(--rule)}
.bt-chalh{margin:0;font-size:.88rem;font-weight:700;color:var(--ink-2)}
.bt-chal .numrow{margin-top:6px}
.bt-tribox{margin-bottom:12px}
.bt-trih{margin:0 0 6px;font-weight:700}
.bt-legend{margin:6px 0 0;font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.bt-lg{display:inline-flex;align-items:center;gap:5px}
.bt-lg[hidden]{display:none}
.bt-lg .d5-c{display:inline-block;width:18px;height:14px;border-radius:4px}
.bt-tap{margin:4px 0 0}
.bt-tap:empty{display:none}

/* @component D5 pascalExplorer (from MDM4U 12) */
.d5-wrap{overflow-x:auto;padding:4px 2px}
.d5-tri{--d5w:30px;--d5h:24px;display:grid;gap:3px;min-width:max-content;margin:0 auto}
.d5-row{display:grid;grid-template-columns:minmax(max-content,1fr) 0;align-items:center}
.d5-cells{display:flex;justify-content:center;gap:2px}
.d5-c{width:var(--d5w,30px);height:var(--d5h,24px);padding:0;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:600 .74rem/1 var(--font-ui);font-variant-numeric:tabular-nums}
.d5-c:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.d5-c.row{background:var(--hi-soft);border-color:var(--ink-2)}
.d5-c.sel{background:var(--hi);border:2px solid var(--ink);color:var(--hi-ink);font-weight:700}
.d5-sum{display:none}

/* Part 3: Working backwards */
.bt3-st h3{margin:0 0 4px}
.bt-bal{display:block;width:100%;max-width:360px;height:auto;margin:0 auto}
.bt-bstand{fill:var(--rule);stroke:var(--ink-2);stroke-width:1.5}
.bt-bbase{fill:var(--ink-2)}
.bt-bbeam rect{fill:var(--ink)}
.bt-bpiv{fill:var(--hi);stroke:var(--ink);stroke-width:2}
.bt-bpan line{stroke:var(--ink-2);stroke-width:1.5}
.bt-bpan path{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.bt-bpan[data-p="L"] .bt-bw{fill:var(--ev-a-soft);stroke:var(--pen);stroke-width:2}
.bt-bpan[data-p="R"] .bt-bw{fill:var(--hi-soft);stroke:var(--ink);stroke-width:2}
.bt-bwt{fill:var(--ink);font:700 15px var(--font-ui)}
.bt3-msg{margin:8px 0 0;font-size:.95rem}
.bt3-exp{font-size:1.1rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.bt3-exp .rg-wrap{margin:0}
.bt3-seqh{margin:6px 0}
.bt3-seqs{display:flex;flex-wrap:wrap;gap:6px 10px;margin:0 0 10px}
.bt-cseq{display:inline-flex;gap:2px;padding:3px 5px;border:1.3px solid var(--rule);border-radius:999px;background:var(--paper)}
.bt-coin{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font:700 .78rem/1 var(--font-ui);border:2px solid var(--pen);color:var(--pen);background:var(--sheet)}
.bt-coinT{border-color:var(--f3);color:var(--f3);border-style:dashed}
.bt3-simh{margin:0 0 4px;font-weight:700}
.bt3-check{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;min-height:32px}
.bt3-check input{width:20px;height:20px}
.legend i.sw.dash{height:3px;border-radius:0;background:repeating-linear-gradient(90deg,var(--pen) 0 6px,transparent 6px 10px)}

/* Practice: Expand it */
.bt-clin{width:min(100%,16rem)}
.bt-pvbox{min-height:0}
.bt-pv{margin:6px 0 0;font-size:1.05rem}

/* task */
.bt-conds{margin:8px 0 4px;padding-left:1.4em}
.bt-tk-in{margin:8px 0}
.bt-tk-eq{margin:0;font-size:1.3rem}
.bt-tk-exp{margin:4px 0 10px;font-size:1.1rem}
.bt-tk-read{margin-top:10px}
.bt-tk-all{margin-top:8px}

  .bt-gt{grid-column:1}
  .bt-row{font-size:1rem}
  .bt-brk{font-size:1.15rem}
  .bt-hmlab{font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){
  .bt-row,.bt-hring{transition:none}
}

lass=\"bt-hmr on\">\u003cspan class=\"bt-hmc\">1\u003c/span>\u003cspan class=\"bt-hmc\">4\u003c/span>\u003cspan class=\"bt-hmc k\">6\u003c/span>\u003cspan class=\"bt-hmc\">4\u003c/span>\u003cspan class=\"bt-hmc\">1\u003c/span>\u003cspan class=\"bt-hmlab\">row `n`\u003c/span>\u003c/span>\u003c/span>\u003c/span>\u003c/span>","eqLabel":"a plus b, to the power n, equals the sum from k equals 0 to n of C of n, k times a to the power n minus k times b to the power k. A line links C of n, k to row n of a small Pascal’s triangle.","eqSize":"sm","headline":"Choose `a` or `b` from every bracket","text":"To expand `(a + b)^n`, pick `a` or `b` from each of the `n` brackets. Every way to pick `k` `b`’s gives `a^{n - k}b^k`, and there are \u003cstrong>`C(n, k)`\u003c/strong> such ways. That’s the \u003cstrong>binomial theorem\u003c/strong>, and the coefficients are row `n` of \u003cstrong>Pascal’s triangle\u003c/strong>.","fig":{"html":"\u003cdiv class=\"bt-h\" role=\"img\" aria-label=\"Three brackets, a plus b, appear. A pointer picks a or b from each bracket and writes the 8 words aaa, aab, aba, baa, abb, bab, bba, bbb. Words with the same letters slide into groups of 1, 3, 3 and 1, which become 1 a cubed, plus 3 a squared b, plus 3 a b squared, plus 1 b cubed, and row 3 of Pascal’s triangle lights up.\">\u003csvg id=\"bt-h-svg\" viewBox=\"0 0 400 340\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003c/div>"}},"goals":["I can state how many terms `(a + b)^n` has and which row of Pascal’s triangle gives its coefficients.","I can expand `(a + b)^n` for `n \u003c= 6`, including when `a` or `b` has a coefficient or a negative sign.","I can write the general term `t_{k + 1} = C(n, k) a^{n - k} b^k` and say which `k` gives a particular term.","I can find the coefficient of a particular power of `x`, including a constant term.","I can work backwards from a coefficient to find `n` or a missing constant.","I can use the theorem in context: coin-toss probabilities and quick approximations."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Exponent laws","goal":2,"prompt":"Simplify `(3x)^2`.","options":[{"t":"`9x^2`","why":"`3^2 × x^2`.","_n":"069f","_k":"ab2777a9"},{"t":"`9x`","why":"The `x` is squared too: `x × x = x^2`.","_n":"16cf","_k":"470e65dd"},{"t":"`3x^2`","why":"The 3 is squared too.","_n":"26bf","_k":"08e02d7b"},{"t":"`6x^2`","why":"Squaring isn’t doubling.","_n":"36ef","_k":"ca6d8b09"}],"hints":["`(3x)^2 = (3x)(3x)`.","3 × 3 and `x × x`.","`9x^2`."]},{"id":"w2","skill":"Exponent laws","goal":4,"prompt":"Simplify `x^4 × (1/x)^2`.","options":[{"t":"`x^6`","why":"`1/x` is `x^{-1}`; the powers subtract.","_n":"46df","_k":"745339cb"},{"t":"1","why":"`x^4 ÷ x^2` is `x^2`.","_n":"570f","_k":"55c20cc1"},{"t":"`x^2`","why":"`x^4 × x^{-2} = x^2`.","_n":"66ff","_k":"eac8b2b8"},{"t":"`x^8`","why":"Powers multiply only when one power is raised to another.","_n":"762f","_k":"1fab9f26"}],"hints":["`1/x = x^{-1}`.","`(x^{-1})^2 = x^{-2}`.","`x^{4 - 2} = x^2`."]},{"id":"w3","skill":"Expanding products","goal":2,"prompt":"Expand `(x + 2)^2`.","options":[{"t":"`x^2 + 4`","why":"`(x + 2)^2 = x^2 + 4x + 4`, not `x^2 + 4`. The middle terms come from mixed choices.","_n":"861f","_k":"2ec8cc86"},{"t":"`2x + 4`","why":"`(x + 2)^2` isn’t `2(x + 2)`.","_n":"9307","_k":"16bb19c6"},{"t":"`x^2 + 4x + 4`","why":"`x^2 + 2x + 2x + 4`.","_n":"a317","_k":"5c02ab0c"},{"t":"`x^2 + 2x + 4`","why":"There are two middle terms: `2x + 2x`.","_n":"b327","_k":"f5c7f893"}],"hints":["`(x + 2)(x + 2)`.","Four products: `x^2`, `2x`, `2x`, 4.","`x^2 + 4x + 4`."]},{"id":"w4","skill":"Expanding products","goal":2,"prompt":"Expand `(x - 3)^2`.","options":[{"t":"`x^2 - 6x + 9`","why":"`x^2 - 3x - 3x + 9`.","_n":"c337","_k":"3aaeabf8"},{"t":"`x^2 + 6x + 9`","why":"The middle term is `2(x)(-3)`.","_n":"d347","_k":"5fb30437"},{"t":"`x^2 + 9`","why":"`(x - 3)^2` isn’t `x^2 + 9`. The middle terms come from mixed choices.","_n":"e357","_k":"89dbc3e7"},{"t":"`x^2 - 6x - 9`","why":"`(-3)^2 = +9`.","_n":"f367","_k":"1b4741d3"}],"hints":["`(x - 3)(x - 3)`.","`-3x - 3x = -6x`; `(-3)(-3) = 9`.","`x^2 - 6x + 9`."]},{"id":"w5","skill":"Pascal’s triangle","goal":1,"prompt":"What is row 5 of Pascal’s triangle?","options":[{"t":"1 4 6 4 1","why":"That’s row 4.","_n":"g377","_k":"612df6cb"},{"t":"1 5 10 5 1","why":"Row 5 has 6 entries.","_n":"h287","_k":"03442f6c"},{"t":"1 5 25 125","why":"These are powers of 5.","_n":"i297","_k":"f0bf7728"},{"t":"1 5 10 10 5 1","why":"Add neighbours in row 4 (1 4 6 4 1), with a 1 at each end.","_n":"ja28","_k":"486f011f"}],"hints":["Row 4 is 1 4 6 4 1.","Add neighbours.","1 5 10 10 5 1."]},{"id":"w6","skill":"Pascal’s triangle","goal":3,"prompt":"Evaluate `C(6, 4)`.","options":[{"t":"6","why":"That’s `C(6, 1)`.","_n":"ka18","_k":"e15ee242"},{"t":"15","why":"`C(6, 4) = C(6, 2) = (6 × 5)/2 = 15`.","_n":"la48","_k":"7f1cf13b"},{"t":"24","why":"That’s `4!`.","_n":"ma38","_k":"758a62b2"},{"t":"360","why":"That’s `P(6, 4)`.","_n":"na68","_k":"022270a4"}],"hints":["`C(6, 4) = C(6, 2)`.","6 × 5 ÷ 2.","15."]}],"refreshers":{"Exponent laws":"`(ax)^n = a^n x^n`; `x^m × x^n = x^{m + n}`; `1/x = x^{-1}`.","Expanding products":"Multiply every term by every term. `(x + 2)^2` has the middle terms `2x + 2x`.","Pascal’s triangle":"Row `n` holds `C(n, 0) … C(n, n)`; each entry adds the two above."}}},"explore":{"heading":"Expansion builder","intro":"Pick a binomial and a power. Build the expansion bracket by bracket, then find any term in one step.","predIntro":"Make a prediction first. Then the expansion builder will show you what really happens.","predictions":[{"id":"p1","start":{"bin":"ab","n":6,"mode":"coef"},"prompt":"\u003cspan class=\"bt-pctx\">`(a + b)`, `n = 6`.\u003c/span> How many terms will the expansion have?","options":[{"t":"6","_n":"oa58","_k":"fdc315a2"},{"t":"7","_n":"pa88","_k":"ae25e77b"},{"t":"12","_n":"qa78","_k":"4fa27e32"},{"t":"64","_n":"raa8","_k":"896f79a7"}],"explain":"`k = 0, 1, …, 6`: seven terms."},{"id":"p2","start":{"bin":"ab","n":4,"mode":"words"},"prompt":"\u003cspan class=\"bt-pctx\">`(a + b)`, `n = 4`, Choice words mode.\u003c/span> How many words have exactly two `b`’s?","options":[{"t":"2","_n":"sa98","_k":"97c50b12"},{"t":"4","_n":"tbc8","_k":"dd28929e"},{"t":"6","_n":"ubd8","_k":"fcb46ef7"},{"t":"16","_n":"vba8","_k":"67e44afe"}],"explain":"Choose which 2 of the 4 brackets give `b`: `C(4, 2) = 6`."},{"id":"p3","start":{"bin":"x-1","n":5,"mode":"coef"},"prompt":"\u003cspan class=\"bt-pctx\">`(x - 1)`, `n = 5`.\u003c/span> What is the sign of the `x^2` term?","options":[{"t":"There is no `x^2` term","_n":"wbb8","_k":"815351e8"},{"t":"Positive","_n":"xb88","_k":"390a8bb9"},{"t":"Negative","_n":"yb98","_k":"81a88d2a"},{"t":"It depends on `x`","_n":"zb68","_k":"48739d65"}],"explain":"`x^2` needs `k = 3`, and `(-1)^3 = -1`."},{"id":"p4","start":{"bin":"x+2","n":3,"mode":"coef"},"prompt":"\u003cspan class=\"bt-pctx\">`(x + 2)`, `n = 3`.\u003c/span> What is the sum of the coefficients?","options":[{"t":"6","_n":"10b78","_k":"05c5d0d7"},{"t":"8","_n":"11b48","_k":"cd26afc9"},{"t":"9","_n":"12b58","_k":"48c3e14f"},{"t":"27","_n":"132e8","_k":"9e153f6d"}],"explain":"Set `x = 1`: `(1 + 2)^3 = 27`. Only `(x + 1)^n` gives `2^n`."}],"chalIntro":"Set up the expansion builder, then press \u003cstrong>Check challenge\u003c/strong>. For challenges 2 and 3, type your answer in the boxes under the controls. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[4,5],"prompt":"With `n = 4`, choose a binomial `(x + b)` from the chips so that the `x^2` coefficient is \u003cstrong>24\u003c/strong>.","why":"`C(4, 2) × b^2 = 6b^2 = 24`, so `b^2 = 4`: both `(x + 2)^4` and `(x - 2)^4` work.","hints":["The `x^2` term needs `k = 2`.","`C(4, 2) × b^2 = 6b^2 = 24`.","`b^2 = 4`: `b = 2` or `-2`."]},{"id":"tc2","goal":4,"prompt":"In Term finder mode, find the coefficient of `x^3` in `(2x + 1)^5`. Type it.","why":"`k = 2`: `C(5, 2)(2x)^3(1)^2 = 10 × 8x^3 = 80x^3`.","hints":["`x^3` comes from `(2x)^3`, so `5 - k = 3`.","`k = 2`: `C(5, 2)(2x)^3(1)^2`.","10 × 8 = 80."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Find the constant term of `(x^2 + 2/x)^6`. Type it.","why":"`k = 4`: `C(6, 4)(x^2)^2(2/x)^4 = 15 × 16 = 240`.","hints":["General term: `C(6, k)(x^2)^{6 - k}(2/x)^k = C(6, k) 2^k x^{12 - 3k}`.","Constant means `12 - 3k = 0`, so `k = 4`.","`C(6, 4) × 2^4 = 15 × 16 = 240`."]}]},"part3":{"slug":"backwards","name":"Backwards","heading":"Working backwards","intro":"Run the theorem in reverse: find `n`, or a missing constant, from one coefficient. Then use the coefficients of `(H + T)^n` to count coin tosses.","stations":[{"id":"s1","title":"Station 1: find `n`","ask":"In `(1 + x)^n`, the coefficient of `x^2` is 28. Find `n`.","how":"Move the `n` slider until the balance levels.","alg":["`C(n, 2) = {n(n - 1)}/{2} = 28`","`n(n - 1) = 56`","`n = 8` \u003csmall>(8 × 7 = 56)\u003c/small>"]},{"id":"s2","title":"Station 2: find the missing constant","ask":"In `(1 + kx)^5`, the coefficient of `x^2` is 90. Find `k`.","how":"Move the `k` slider until the balance levels. Find every value that works.","alg":["`C(5, 2)k^2 = 10k^2 = 90`","`k^2 = 9`","`k = 3` or `k = -3`"]},{"id":"s3","title":"Station 3: coins and the theorem","ask":"Write H for heads and T for tails. Tap a term of `(H + T)^4` to see the matching coin sequences.","alg":["Each of the `2^4 = 16` toss sequences is equally likely.","`6H^2T^2`: 6 sequences have exactly 2 heads.","`P`(exactly 2 heads in 4 fair tosses) `= 6/16 = 3/8 = 0.375`"]}],"quickCheck":{"title":"Quick check","summary":"Backwards quick check","items":[{"id":"q1","goal":5,"prompt":"In `(1 + x)^n`, the coefficient of `x` is 9. Find `n`.","right":"Right. The `x` coefficient is `C(n, 1) = n`, so `n = 9`.","wrong":"The `x` coefficient is `C(n, 1) = n`.","choices":[{"t":"3","_n":"142d8","_k":"54d6dfd8"},{"t":"8","_n":"152c8","_k":"50eb10fa"},{"t":"9","_n":"162b8","_k":"cc55e037"},{"t":"10","_n":"172a8","_k":"63f0d51a"}]} "Row 3: 1 3 3 1.","Multiply by `2^0`, `2^1`, `2^2`, `2^3`.","1, 6, 12, 8."]},{"id":"x3","goal":2,"bin":"`(x - 1)^5`","first":{"c":1,"p":1},"second":{"c":-1,"p":0},"n":5,"_a":"b1VKSQYYAlIYSVdUHwEfTwU5","wrong":[{"match":[1,5,10,10,5,1],"fb":"`(x - 1)^5` is `(x + (-1))^5`: odd powers of −1 are negative."}],"why":"Row 5 with alternating signs from `(-1)^k`.","hints":["Row 5: 1 5 10 10 5 1.","Multiply by `(-1)^0`, `(-1)^1`, …, `(-1)^5`: the signs alternate.","1, −5, 10, −10, 5, −1."]},{"id":"x4","goal":2,"bin":"`(2x + 1)^3`","first":{"c":2,"p":1},"second":{"c":1,"p":0},"n":3,"_a":"b1xKVQEYBU4FOQ==","wrong":[{"match":[2,3,3,1],"fb":"`(2x)^3 = 8x^3`. Everything inside the bracket gets the power."}],"why":"`(2x)^3 = 8x^3`, `3(2x)^2 = 12x^2`, `3(2x) = 6x`, then 1.","hints":["Row 3: 1 3 3 1.","Multiply by `2^3`, `2^2`, `2^1`, `2^0` (from `(2x)^{3 - k}`).","8, 12, 6, 1."]},{"id":"x5","goal":2,"bin":"`(x - 3)^4`","first":{"c":1,"p":1},"second":{"c":-3,"p":0},"n":4,"_a":"b1VKSQIGH1cASEtVAwwfWgU5","wrong":[{"match":[1,-12,18,-12,81],"fb":"6 × (−3)² = 54 and 4 × (−3)³ = −108."}],"why":"Row 4 times powers of −3: 1, −12, 54, −108, 81.","hints":["Row 4: 1 4 6 4 1.","Multiply by `(-3)^0`, `(-3)^1`, …, `(-3)^4`.","1, −12, 54, −108, 81."]},{"id":"x6","goal":2,"bin":"`(a + 2b)^4`","sym":true,"first":{"c":1},"second":{"c":2},"n":4,"_a":"b1VKXB8GB04HVkpVBWk=","note":"for `a^4`, `a^3b`, `a^2b^2`, `ab^3`, `b^4`","wrong":[{"match":[1,4,6,4,1],"fb":"`(2b)^k` brings `2^k`. Everything inside the bracket gets the power."}],"why":"Row 4 times powers of 2, because `(2b)^k` brings `2^k`.","hints":["Row 4: 1 4 6 4 1.","Multiply by `2^0`, `2^1`, …, `2^4` (from `(2b)^k`).","1, 8, 24, 32, 16."]}]},{"id":"term","type":"numeric","title":"Find the term","summary":"Find the term","star":true,"goal":[3,4,5,6],"instruction":"Find each coefficient or value. The ★ problems go beyond the usual questions; the last two are harder than the Final Check.","how":"Type a number, then press Check. If there’s more than
