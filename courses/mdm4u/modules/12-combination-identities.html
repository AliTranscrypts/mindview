.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 12: hero, Identity prover (D5 Pascal's triangle explorer + people panel), Counting proofs (N29 sentence builder), Sam's fair split */

/* hero equation: the two right-hand terms carry their story labels */
.ci-heq{display:inline-flex;flex-wrap:wrap;align-items:flex-start;gap:.35em .22em;line-height:1.1}
.ci-ht{display:inline-flex;flex-direction:column;align-items:center;border-bottom:3px solid transparent;padding:0 .06em}
.ci-ht small{font:700 .82rem/1.3 var(--font-ui);font-style:normal;margin-top:.2em;letter-spacing:.01em}
.ci-hw{border-bottom-color:var(--pen)}.ci-hw small{color:var(--pen)}
.ci-hwo{border-bottom-color:var(--f3)}.ci-hwo small{color:var(--f3)}
.ci-h{max-width:440px;margin:0 auto}
.ci-h svg{display:block;width:100%;height:auto}
.ci-hav{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.ci-hring{fill:none;stroke:var(--hi);stroke-width:4}
.ci-hring.sm{stroke-width:3}
.ci-hin{fill:var(--ink);font:700 13px var(--font-ui);text-anchor:middle;dominant-baseline:central}
.ci-hin.sm{font-size:10px}
.ci-hnm{fill:var(--ink-2);font:600 11px var(--font-ui);text-anchor:middle}
.ci-hp rect{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.2}
.ci-hbw{fill:var(--ev-a-soft);stroke:var(--pen);stroke-width:2}
.ci-hbwo{fill:var(--ev-b-soft);stroke:var(--f3);stroke-width:2}
.ci-hbt{font:700 13px var(--font-ui);text-anchor:middle}
.ci-hbtw{fill:var(--pen)}.ci-hbtwo{fill:var(--f3)}

/* explore */
.ci-top{margin:0 0 12px}
.ci-cap .ci-capn,.ci-capq{font:400 .55em var(--font-ui);color:var(--ink-2)}
.ci-pctx{display:block;font-size:.85rem;font-weight:700;color:var(--ink-2);margin-bottom:2px}
.ci-av{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.3px solid var(--ink);background:var(--sheet);color:var(--ink);font:700 .62rem/1 var(--font-ui);font-style:normal;flex:none}
.ci-av.ci-sam{box-shadow:0 0 0 2.5px var(--hi)}
.ci-plab{margin:0 0 4px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.ci-prow{display:flex;flex-wrap:wrap;gap:6px 8px}
.ci-p{display:inline-flex;flex-direction:column;align-items:center;gap:3px;min-width:34px}
.ci-p .ci-av,.ci-sw .ci-av{width:30px;height:30px;font-size:.9rem}
.ci-p .ci-av.ci-sam,.ci-sw .ci-av.ci-sam{box-shadow:0 0 0 3.5px var(--hi)}
.ci-pn{font-size:.72rem;color:var(--ink-2)}
.ci-sw{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:42px;padding:5px 4px 3px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink)}
.ci-sw.on{border-color:var(--ink);background:var(--hi-soft)}
.ci-sw:not(.on) .ci-av{opacity:.55;border-style:dashed}
.ci-swt{font:700 .7rem var(--font-ui);text-transform:uppercase;letter-spacing:.04em}
.ci-swl{margin:6px 0 0;font-size:.92rem;min-height:0}
.ci-swl:empty{display:none}
.ci-panel{margin-top:12px}
.ci-phead{margin:0 0 8px;font-size:.95rem}
.ci-box{max-height:360px;overflow:auto;border:1.5px solid var(--rule);border-radius:8px;padding:8px;background:var(--paper)}
.ci-cm{display:inline-flex;align-items:center;gap:1px;padding:2px 4px;border:1.3px solid var(--ink-2);border-radius:999px;background:var(--sheet);min-height:24px;transition:opacity .3s,transform .3s}
.ci-cm.ci-empty{font:600 .72rem var(--font-ui);color:var(--ink-2);border-style:dashed;padding:2px 8px}
.ci-cm.ci-out{border-style:dashed;background:transparent}
.ci-cm.ci-out .ci-av{border-color:var(--ink-2);color:var(--ink-2)}
.ci-hid{opacity:0;transform:translateY(-6px)}
.ci-symh{display:flex;gap:14px;font-size:.78rem;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.ci-symh span + span::before{content:"↔ ";font-weight:400}
.ci-pairs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 12px}
.ci-pair{display:inline-flex;align-items:center;transition:opacity .3s,transform .3s}
.ci-ln{display:inline-block;width:16px;border-top:2px solid var(--ink-2);margin:0 2px}
.ci-bins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.ci-bin{border:2px solid var(--pen);border-radius:10px;padding:8px 10px;background:var(--ev-a-soft);min-width:0}
.ci-bin.ci-bwo{border-color:var(--f3);background:var(--ev-b-soft)}
.ci-binh{margin:0 0 6px;font-size:.98rem;color:var(--pen)}
.ci-bwo .ci-binh{color:var(--f3)}
.ci-bc{display:inline-block;min-width:1.6em;padding:0 .35em;border-radius:6px;background:var(--sheet);color:var(--ink);text-align:center}
.ci-binl{display:flex;flex-wrap:wrap;gap:5px;max-height:250px;overflow:auto}
.ci-kw{color:var(--pen)}.ci-kwo{color:var(--f3)}
.ci-colbox{padding:8px 6px}
.ci-cols{display:flex;align-items:flex-end;gap:8px;min-width:max-content}
.ci-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.ci-colb{display:flex;flex-direction:column-reverse;align-items:center;gap:3px}
.ci-colc{font:700 .85rem var(--font-ui)}
.ci-colk{font-size:.72rem;color:var(--ink-2);white-space:nowrap;border-top:1.5px solid var(--ink-2);padding-top:2px}
.ci-cols.ci-dots .ci-colb{flex-direction:row;flex-wrap:wrap-reverse;justify-content:center;width:calc(var(--dpr,4) * 8px);gap:2px}
.ci-dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--pen);transition:opacity .25s}
.ci-me{box-shadow:0 0 0 2.5px var(--hi),0 0 0 4px var(--ink)}
.ci-dot.ci-me{position:relative;z-index:1}
.ci-total{margin:8px 0 0;font-size:.95rem;overflow-wrap:anywhere}
.ci-guess{margin-top:12px;padding-top:8px;border-top:1px solid var(--rule)}
.ci-guess .numrow{margin-top:0}
.ci-gnote{margin:4px 0 0}
.ci-tribox{margin-bottom:12px}
.ci-trih{margin:0 0 6px;font-weight:700}
.ci-trihid{padding:24px 12px;border:1.5px dashed var(--rule);border-radius:8px;text-align:center;color:var(--ink-2);font-size:.92rem}
.ci-legend{margin:6px 0 0;font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.ci-legend:empty{display:none}
.ci-lg{display:inline-flex;align-items:center;gap:5px}
.ci-lg .d5-c{display:inline-block;width:18px;height:14px;border-radius:4px}
.ci-tap{margin:4px 0 0;min-height:0}
.ci-tap:empty{display:none}

/* @component D5 pascalExplorer */
.d5-wrap{overflow-x:auto;padding:4px 2px}
.d5-tri{--d5w:30px;--d5h:26px;display:grid;gap:3px;min-width:max-content;margin:0 auto}
.d5-row{display:grid;grid-template-columns:minmax(max-content,1fr) 0;align-items:center}
.d5-tri.sums .d5-row{grid-template-columns:minmax(max-content,1fr) 3.3em}
.d5-cells{display:flex;justify-content:center;gap:2px}
.d5-c{width:var(--d5w,30px);height:var(--d5h,26px);padding:0;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:600 .78rem/1 var(--font-ui);font-variant-numeric:tabular-nums}
.d5-c:focus-visible{outline:3px solid var(--pen);outline-offset:1px}
.d5-c.row{background:var(--hi-soft);border-color:var(--ink-2)}
.d5-c.up1{background:var(--ev-a-soft);border:2.5px solid var(--pen)}
.d5-c.up2{background:var(--ev-b-soft);border:2.5px solid var(--f3)}
.d5-c.mir{background:var(--hi-soft);border:2px dashed var(--ink)}
.d5-c.sel{background:var(--hi);border:2px solid var(--ink);color:var(--hi-ink);font-weight:700}
.d5-c.nz{background:var(--ink-2);color:var(--sheet)}
.d5-sum{font:600 .74rem var(--font-ui);color:var(--ink-2);padding-left:6px;white-space:nowrap}
.d5-sum.on{color:var(--ink);font-weight:700}

/* Part 3: counting proofs */
.ci3-h{margin:0 0 2px}
.ci3-id{margin:0 0 10px;font-size:1.1rem}
.ci3-grid{align-items:start}
.ci3-alg{margin-top:0}
.ci3-ask{margin:0 0 8px}
.ci3-stories{display:grid;gap:8px}
.ci3-story{text-align:left;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);line-height:1.45}
.ci3-story.on{border-color:var(--ink);background:var(--hi-soft)}
.ci3-story.good{border-color:var(--green);background:var(--good-bg)}
.ci3-story.bad{border-color:var(--red);background:var(--bad-bg)}
.ci3-story:disabled{opacity:1}
.ci3-fb .fb ul{margin:6px 0 0;padding-left:1.2em}
/* @component N29 sentenceBuilder (from MHF4U 08) */
.sb-line{font-size:1.06rem;line-height:2.5;max-width:none;margin:0}
.sb-slot{display:inline-block;min-width:4.4em;min-height:34px;margin:0 .12em;padding:.05em .55em;border:0;border-bottom:2.5px solid var(--ink);background:var(--paper);border-radius:5px 5px 0 0;font:700 1rem/1.6 var(--font-ui);color:var(--ink);vertical-align:baseline}
.sb-slot.on{background:var(--hi);color:var(--hi-ink)}
.sb-slot.good{border-bottom-color:var(--green);background:var(--good-bg)}
.sb-slot.bad{border-bottom-color:var(--red);background:var(--bad-bg)}
.sb-slot:disabled{opacity:1}
.sb-bank{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1.5px dashed var(--ink-2);border-radius:8px;margin-top:8px}
.sb-bank-lab{font-weight:700;font-size:.9rem}
.sb-tip{margin:6px 0 0}

/* task */
.ci-conds{margin:8px 0 4px;padding-left:1.4em}
.ci-tk-in{margin:8px 0}
.ci-tk-rh{margin:12px 0 6px;font-size:.9rem}
.ci-tk-row{display:flex;flex-wrap:wrap;gap:3px}
.ci-tk-row .d5-c{display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:32px;padding:0 4px}

@media (max-width:640px){
  .ci-bins{grid-template-columns:minmax(0,1fr)}
  .d5-tri{--d5w:26px;--d5h:24px}
  .d5-c{font-size:.7rem}
  .d5-tri.sums .d5-row{grid-template-columns:minmax(max-content,1fr) 2.9em}
  .sb-line{font-size:1rem}
}
@media (prefers-reduced-motion:reduce){
  .ci-cm,.ci-pair,.ci-dot{transition:none}
}

ox=\"0 0 400 330\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003c/div>"}},"goals":["I can use `C(n, r) = C(n, n - r)` to simplify and to solve for `r` or `n`.","I can use Pascal’s identity `C(n, r) = C(n - 1, r - 1) + C(n - 1, r)` to combine or split combinations.","I can explain why `C(n, 0) + C(n, 1) + … + C(n, n) = 2^n`.","I can solve equations such as `C(18, r) = C(18, r + 2)`.","I can explain an identity with a committee story (a counting proof).","I can use the identities in context: subsets, and teams with or without a particular person."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Evaluating combinations","goal":1,"prompt":"Evaluate `C(7, 2)`.","options":[{"t":"14","why":"`C(7, 2)` counts pairs.","_n":"0d1d","_k":"c90acd78"},{"t":"21","why":"(7 × 6) ÷ 2.","_n":"1d0d","_k":"6e731333"},{"t":"42","why":"That’s `P(7, 2)`.","_n":"2cfd","_k":"e2be3acc"},{"t":"49","why":"A person can’t be paired with themselves.","_n":"3d6d","_k":"de984f0c"}],"hints":["`C(n, 2) = n(n - 1)/2`.","7 × 6 = 42.","42 ÷ 2 = 21."]},{"id":"w2","skill":"Evaluating combinations","goal":1,"prompt":"Evaluate `C(7, 5)`.","options":[{"t":"0","why":"5 is less than 7, so it’s allowed.","_n":"4d5d","_k":"48dfd5c8"},{"t":"21","why":"`7!/(5! 2!) = 21`, the same as `C(7, 2)`.","_n":"5d4d","_k":"884eef03"},{"t":"35","why":"That’s `C(7, 3)`. Check the bottom number.","_n":"6d3d","_k":"028b1c8c"},{"t":"2520","why":"That’s `P(7, 5)`. Divide by `5!`.","_n":"7dad","_k":"bb8f56bf"}],"hints":["`7!/(5! × 2!)`.","Cancel `5!`: `(7 × 6)/2!`.","21."]},{"id":"w3","skill":"Factorial algebra","goal":2,"prompt":"Simplify `{8!}/{3! 5!} + {8!}/{4! 4!}`.","options":[{"t":"140","why":"`8!/(3! 5!) = 56`.","_n":"8d9d","_k":"118ef6f8"},{"t":"56","why":"That’s only the first term, `C(8, 3) = 56`. Add the second term, `C(8, 4) = 70`.","_n":"91e2","_k":"7763a940"},{"t":"126","why":"56 + 70 = 126, which is `C(9, 4)`.","_n":"a1f2","_k":"e45cb5dc"},{"t":"`16!`","why":"You add the values, not the `8!`s.","_n":"b1c2","_k":"26c5dd41"}],"hints":["Each term is a combination.","`C(8, 3) = 56`, `C(8, 4) = 70`.","126."]},{"id":"w4","skill":"Factorial algebra","goal":1,"prompt":"Which equals `{n!}/{r!(n - r)!}` with `r` replaced by `n - r`?","options":[{"t":"`{n!}/{r!}`","why":"Both factorials remain below.","_n":"c1d2","_k":"1260b793"},{"t":"`{n!}/{(n - r)! (n - r)!}`","why":"Replace `r` everywhere: `n - (n - r) = r`.","_n":"d1a2","_k":"591fc7d9"},{"t":"`{(n - r)!}/{r! n!}`","why":"The `n!` stays on top.","_n":"e1b2","_k":"f4bc782f"},{"t":"`{n!}/{(n - r)! r!}`","why":"The two factorials just swap places.","_n":"f182","_k":"2d254f85"}],"hints":["Replace `r` with `n - r`.","`n - (n - r) = r`.","`n!/[(n - r)! r!]`: the same value."]},{"id":"w5","skill":"Subsets","goal":3,"prompt":"How many different selections (including choosing nothing) can be made from 3 toppings?","options":[{"t":"6","why":"That’s 2 × 3. Each of the 3 toppings is in or out: `2 × 2 × … × 2 = 2^3`.","_n":"g192","_k":"fb5cbfe6"},{"t":"7","why":"Choosing nothing is one of the selections. With it: 2 × 2 × 2 = 8.","_n":"h262","_k":"dda1fd77"},{"t":"8","why":"Each topping in or out: 2 × 2 × 2.","_n":"i272","_k":"48f5dd18"},{"t":"9","why":"That’s `3^2`. Each of the 3 toppings is in or out: `2 × 2 × … × 2 = 2^3`.","_n":"j182","_k":"4930a526"}],"hints":["List them: none, A, B, C, AB, AC, BC, ABC.","Each topping has 2 states.","`2^3 = 8`."]},{"id":"w6","skill":"Subsets","goal":3,"prompt":"How many ways are there to choose nobody from a group of 5?","options":[{"t":"0","why":"Choosing nobody is one choice.","_n":"k172","_k":"e0ff15e4"},{"t":"1","why":"`C(5, 0) = 5!/(0! 5!) = 1`.","_n":"l162","_k":"ddbfc56d"},{"t":"5","why":"There’s only one empty group.","_n":"m152","_k":"dfd417bc"},{"t":"120","why":"That’s `5!`.","_n":"n1c2","_k":"6308a2ed"}],"hints":["What’s `0!`?","`0! = 1`.","`C(5, 0) = 1`."]}],"refreshers":{"Evaluating combinations":"`C(n, r) = n!/[r!(n - r)!]`. Cancel the larger factorial below: `C(9, 3) = (9 × 8 × 7)/3! = 84`.","Factorial algebra":"Swapping `r` and `n - r` swaps the two factorials below the line, so the value doesn’t change.","Subsets":"With `n` items, each is in or out: `2^n` selections, including “nothing”."}}},"explore":{"heading":"Identity prover","intro":"Pick an identity. Watch the committees get counted two ways, then check the algebra.","predIntro":"Make a prediction first. Then the identity prover will count the committees for you.","predictions":[{"id":"p1","start":{"mode":"sym","n":6,"r":2},"prompt":"\u003cspan class=\"ci-pctx\">Symmetry, `n = 6`, `r = 2`.\u003c/span> How many ways are there to choose the 4 people who \u003cstrong>aren’t\u003c/strong> on the committee?","options":[{"t":"4","_n":"o1b2","_k":"e1899c91"},{"t":"15","_n":"p1a2","_k":"4ea7aa12"},{"t":"30","_n":"q192","_k":"220be7cc"},{"t":"360","_n":"r202","_k":"b64fb03b"}],"explain":"Every committee of 2 leaves out exactly one group of 4: `C(6, 4) = C(6, 2) = 15`."},{"id":"p2","start":{"mode":"pas","n":5,"r":2},"prompt":"\u003cspan class=\"ci-pctx\">With or without Sam, `n = 5`, `r = 2`.\u003c/span> How many committees of 2 include Sam?","options":[{"t":"4","_n":"s1f2","_k":"7ff6a81e"},{"t":"5","_n":"t122","_k":"ace2279e"},{"t":"6","_n":"u132","_k":"ab63eac2"},{"t":"10","_n":"v142","_k":"c0bdc4e6"}],"explain":"Sam is in; choose 1 more from the other 4: `C(4, 1) = 4`."},{"id":"p3","start":{"mode":"row","n":4,"r":2},"prompt":"\u003cspan class=\"ci-pctx\">Row sum, `n = 4`.\u003c/span> How many committees of \u003cstrong>any\u003c/strong> size (0 to 4) can be made from 4 people?","options":[{"t":"8","_n":"w152","_k":"ad572952"},{"t":"15","_n":"x162","_k":"d26170de"},{"t":"16","_n":"y172","_k":"56c1d11d"},{"t":"24","_n":"z182","_k":"52830696"}],"explain":"Each person is in or out: `2^4 = 16`."},{"id":"p4","start":{"mode":"sym","n":7,"r":0},"prompt":"\u003cspan class=\"ci-pctx\">`n = 7`, `r = 0`.\u003c/span> How many ways can you choose nobody from 7?","options":[{"t":"0","_n":"10192","_k":"59fde3d4"},{"t":"1","_n":"111a2","_k":"bf2da02a"},{"t":"7","_n":"121b2","_k":"ec13eded"},{"t":"5040","_n":"131c3","_k":"fc839b86"}],"explain":"`C(7, 0) = 7!/(0! 7!) = 1`."}],"chalIntro":"Set up the identity prover, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Find a value of `r` other than 3 with `C(9, r) = C(9, 3)`.","why":"`C(9, 6) = C(9, 3) = 84`: choosing 3 to serve is the same as choosing 6 to stay out.","hints":["Choosing 3 to serve = choosing ___ to stay out.","9 − 3.","`r = 6`."]},{"id":"tc2","goal":2,"prompt":"In Pascal mode (\u003cstrong>With or without Sam\u003c/strong>), set `n` and `r` so that “with Sam” and “without Sam” are both exactly 10.","why":"`C(5, 2) = C(5, 3) = 10`: the two neighbouring 10s in row 5 sit above `C(6, 3) = 20`.","hints":["You need `C(n - 1, r - 1) = C(n - 1, r) = 10`.","Which row has two neighbouring 10s?","Row 5: 1 5 10 10 5 1. So `n - 1 = 5` and `r = 3`."]},{"id":"tc3","goal":[1,2],"stretch":true,"prompt":"`C(n, r) = 15` and `C(n, r + 1) = 20`. Set `n` and `r`, then type the value of `C(n + 1, r + 1)` \u003cstrong>without\u003c/strong> using the triangle panel (it’s hidden for this challenge). \u003cspan class=\"tiny muted\">(Type your value in the \u003cstrong>Challenge 3\u003c/strong> box above; the triangle hides while the box has a value.)\u003c/span>","why":"`C(7, 3) = C(6, 2) + C(6, 3) = 15 + 20 = 35`.","hints":["Which row has 15 next to 20?","Row 6: 1 6 15 20 15 6 1, so `n = 6`, `r = 2`.","`C(7, 3) = C(6, 2) + C(6, 3) = 15 + 20 = 35`."]}]},"part3":{"slug":"stories","name":"Stories","heading":"Counting proofs","intro":"A \u003cstrong>counting proof\u003c/strong> tells one story that counts the same set of committees in two ways, so the two counts must be equal. Build each story from the chips: tap a blank, then choose its words. Beside each story, \u003cstrong>Check it with algebra\u003c/strong> proves the same identity with factorials.","stations":[{"id":"s1","title":"Station 1: symmetry story","identity":"`C(n, r) = C(n, n - r)`","tpl":"Choosing {a} people {b} is the same as choosing {c} people {d}, so `C(n, r) = C(n, n - r)`.","slots":{"a":{"label":"how many go","chips":[{"t":"`r`","_n":"141b3","_k":"6d03735f"},{"t":"`n - r`","fb":"Start with the committee: `r` people go on the trip.","_n":"151e3","_k":"df37f462"},{"t":"`n`","fb":"Not everyone goes: `r` of the `n` people go.","_n":"161d3","_k":"28d4543c"}]},"b":{"label":"what they do","chips":[{"t":"\u003cstrong>to go\u003c/strong> on the trip","_n":"17183","_k":"7d76c8ba"},{"t":"to sit in order","fb":"A committee has no order. Sitting in order would count permutations, not combinations.","_n":"18173","_k":"f4f13775"},{"t":"with Sam","fb":"Sam belongs to Pascal’s story. This story is about who goes and who stays.","_n":"191a3","_k":"75258a72"}]},"c":{"label":"how many stay","chips":[{"t":"`n - r`","_n":"1a193","_k":"48f122f5"},{"t":"`r`","fb":"Everyone who doesn’t go stays: `n - r` people.","_n":"1b243","_k":"bff9f3a9"},{"t":"`n`","fb":"Everyone who doesn’t go stays: `n - r` people.","_n":"1c233","_k":"9f5aeb27"}]},"d":{"label":"what they do","chips":[{"t":"\u003cstrong>to stay\u003c/strong>","_n":"1d163","_k":"ee309e1b"},{"t":"to sit in order","fb":"A committee has no order. Sitting in order would count permutations, not combinations.","_n":"1e173","_k":"b652b10c"},{"t":"with Sam","fb":"Sam belongs to Pascal’s story. This story is about who goes and who stays.","_n":"1f143","_k":"7cab15bc"}]}},"done":"Each group that goes leaves exactly one group behind, and each group that stays fixes who goes. The two choices pair up one to one, so the counts are equal.","alg":["`C(n, n - r) = {n!}/{(n - r)! (n - (n - r))!}`","`= {n!}/{(n - r)! r!} = C(n, r)`","\u003csmall>The two factorials below the line just swap places.\u003c/small>","\u003csmall>Example:\u003c/small> `C(6, 4) = {6!}/{4! 2!} = 15 = C(6, 2)`"]},{"id":"s2","title":"Station 2: Pascal’s story","identity":"`C(n, r) = C(n - 1, r - 1) + C(n - 1, r)`","tpl":"Count the committees of {r} from {n} people. Those \u003cstrong>with Sam\u003c/strong> choose the other {a} from {b}; those \u003cstrong>without Sam\u003c/strong> choose all {c} from {d}. Every committee is in {e} group.","slots":{"r":{"label":"committee size","chips":[{"t":"`r`","_n":"1g153","_k":"e1b0c723"},{"t":"`r - 1`","fb":"The committees being counted have `r` members.","_n":"1h1a3","_k":"975f44ff"},{"t":"`n`","fb":"The committees being counted have `r` members, chosen from `n` people.","_n":"1i1b3","_k":"f31b536d"}]},"n":{"label":"group size","chips":[{"t":"`n`","_n":"1j183","_k":"af039dd7"},{"t":"`n - 1`","fb":"Start with the whole group: `n` people, Sam included.","_n":"1k193","_k":"8f81a6c0"},{"t":"`r`","fb":"Start with the whole group: `n` people, Sam included.","_n":"1l1e3","_k":"d083adbf"}]},"a":{"label":"how many more with Sam","chips":[{"t":"`r - 1`","_n":"1m1f3","_k":"101bdce2"},{"t":"`r`","fb":"Sam already fills one seat, so only `r - 1` are left to choose.","_n":"1nb03","_k":"716ee259"},{"t":"`n - 1`","fb":"Sam already fills one seat, so only `r - 1` are left to choose.","_n":"1oaf3","_k":"7270a317"}]},"b":{"label":"chosen from (with Sam)","chips":[{"t":"`n - 1`","_n":"1pae3","_k":"b0f27b18"},{"t":"`n`","fb":"Sam is already chosen, so choose from the other `n - 1` people.","_n":"1qad3","_k":"3f5df2df"},{"t":"`r - 1`","fb":"Sam is already chosen, so choose from the other `n - 1` people.","_n":"1rac3","_k":"8c507b53"}]},"c":{"label":"how many without Sam","chips":[{"t":"`r`","_n":"1sab3","_k":"b28af1bc"},{"t":"`r - 1`","fb":"Without Sam, all `r` seats still need people.","_n":"1taa3","_k":"66f16b0b"},{"t":"`n - 1`","fb":"Without Sam, all `r` seats still need people.","_n":"1ua93","_k":"8e2fd6b6"}]},"d":{"label":"chosen from (without Sam)","chips":[{"t":"`n - 1`","_n":"1va83","_k":"8ac563e3"},{"t":"`n`","fb":"Sam is out, so choose from the other `n - 1` people.","_n":"1wa73","_k":"ed5d3246"},{"t":"`r`","fb":"Sam is out, so choose from the other `n - 1` people.","_n":"1xaa3","_k":"0abc8d1f"}]},"e":{"label":"how many groups","chips":[{"t":"exactly one","_n":"1yab3","_k":"6c1946da"},{"t":"at least one","fb":"If a committee could sit in both groups, adding would count it twice. Each committee is in \u003cstrong>exactly one\u003c/strong> group: that is why adding is allowed.","_n":"1zac3","_k":"eb5a35cb"},{"t":"both","fb":"A committee can’t both include Sam and leave Sam out. Each committee is in \u003cstrong>exactly one\u003c/strong> group: that is why adding is allowed.","_n":"20ad3","_k":"4bf3ed87"}]}},"done":"Every committee is in \u003cstrong>exactly one\u003c/strong> group, so adding the two counts counts each committee once: `C(n, r) = C(n - 1, r - 1) + C(n - 1, r)`.","alg":["`C(n - 1, r - 1) + C(n - 1, r) = {(n - 1)!}/{(r - 1)! (n - r)!} + {(n - 1)!}/{r! (n - r - 1)!}`","\u003csmall>Common denominator `r!(n - r)!`:\u003c/small>","`= {r(n - 1)!}/{r!(n - r)!} + {(n - r)(n - 1)!}/{r!(n - r)!}`","`= {(r + (n - r))(n - 1)!}/{r!(n - r)!} = {n!}/{r!(n - r)!} = C(n, r)`","\u003csmall>Example:\u003c/small> `C(5, 1) + C(5, 2) = 5 + 10 = 15 = C(6, 2)`"]},{"id":"s3","title":"Station 3: row-sum story","identity":"`C(n, 0) + C(n, 1) + … + C(n, n) = 2^n`","tpl":"Each of the {a} people is either {b}, so there are {c} possible committees of all sizes. Grouping them by size gives `C(n, 0) + … + C(n, n)`.","slots":{"a":{"label":"how many people","chips":[{"t":"`n`","_n":"21a63","_k":"7e7120a7"},{"t":"`r`","fb":"Every one of the `n` people makes the in-or-out choice, not just `r` of them.","_n":"22a73","_k":"1f5c5592"},{"t":"2","fb":"Every one of the `n` people makes the in-or-out choice.","_n":"23a83","_k":"9cb56a34"}]},"b":{"label":"the choice","chips":[{"t":"in or out","_n":"24a93","_k":"69a23721"},{"t":"first or last","fb":"A committee has no order: each person is only in or out.","_n":"25a23","_k":"e8626774"},{"t":"with Sam or without Sam","fb":"That splits by Sam only. Here every person makes the same in-or-out choice.","_n":"26a33","_k":"c7b41ff2"}]},"c":{"label":"how many committees","chips":[{"t":"`2^n`","_n":"27944","_k":"dc81dcbe"},{"t":"`2n`","fb":"The choices multiply, they don’t add. Each of the `n` items is in or out: `2 × 2 × … × 2 = 2^n`.","_n":"28934","_k":"d9e4e761"},{"t":"`n^2`","fb":"Each of the `n` items is in or out: `2 × 2 × … × 2 = 2^n`.","_n":"29964","_k":"0fdbc8e9"},{"t":"`n!`","fb":"`n!` counts line-ups, not committees.","_n":"2a954","_k":"c34c6d7a"}]}},"done":"Every committee of every size, including the empty one, is exactly one in-or-out pattern, so `C(n, 0) + … + C(n, n) = 2^n`.","alg":["\u003csmall>Each of the `n` people has 2 choices, in or out:\u003c/small>","`2 × 2 × … × 2 = 2^n` \u003csmall>(`n` factors)\u003c/small>","\u003csmall>Group the patterns by how many people are in: size 0, 1, …, `n`.\u003c/small>","\u003csmall>Example:\u003c/small> `1 + 4 + 6 + 4 + 1 = 16 = 2^4`"]},{"id":"s4","title":"Station 4: a new identity","identity":"`C(n + 1, 2) = C(n, 2) + n`","ask":"Show `C(n + 1, 2) = C(n, 2) + n`. Pick the story that proves it.","stories":[{"t":"`n + 1` people shake hands. The newcomer shakes `n` hands; the original `n` people shake `C(n, 2)` among themselves.","fb":"Every handshake either includes the newcomer (`n` of them) or doesn’t (`C(n, 2)`), never both. Both sides count the same set of handshakes.","_n":"2b984","_k":"5cd2f087"},{"t":"`n + 1` people each shake hands with the `n` others, so there are `(n + 1) × n` handshakes: `n` for the newcomer and the rest for everyone else.","fb":"That story counts ordered handshakes: Ana with Ben and Ben with Ana are counted as two. Both sides of the story must count the \u003cstrong>same\u003c/strong> set of handshakes.","_n":"2c974","_k":"475a9d76"}],"done":"A newcomer shakes `n` new hands.","alg":["`C(n + 1, 2) = {(n + 1)n}/{2} = {n(n - 1) + 2n}/{2}`","`= {n(n - 1)}/{2} + n = C(n, 2) + n`","\u003csmall>Example:\u003c/small> `C(5, 2) = 10 = 6 + 4 = C(4, 2) + 4`"]}],"quickCheck":{"title":"Quick check","summary":"Stories quick check","items":[{"id":"q1","goal":1,"prompt":"`C(20, 17)` equals…","choices":[{"t":"`C(20, 37)`","fb":"Symmetry: 20 − 17 = 3.","_n":"2d9a4","_k":"852ff137"},{"t":"`C(17, 3)`","fb":"Symmetry: 20 − 17 = 3.","_n":"2e994","_k":"ff251902"},{"t":"`C(20, 3)`","fb":"Right. Symmetry: 20 − 17 = 3.","_n":"2f9c4","_k":"795b57a8"},{"t":"`C(3, 20)`","fb":"Symmetry: 20 − 17 = 3.","_n":"2g9b4","_k":"ab69f187"}]},{"id":"q2","goal":2,"prompt":"`C(8, 3) + C(8, 4)` equals…","choices":[{"t":"`C(9, 3)`","fb":"Down one row; take the larger `r`.","_n":"2hae4","_k":"9eecd96f"},{"t":"`C(9, 4)`","fb":"Right. Down one row; take the larger `r`.","_n":"2iaf4","_k":"7c437e8e"},{"t":"`C(16, 7)`","fb":"Down one row; take the larger `r`.","_n":"2jac4","_k":"7877a7df"},{"t":"`C(8, 7)`","fb":"Down one row; take the larger `r`.","_n":"2kad4","_k":"7d6a8f1d"}]},{"id":"q3","goal":3,"prompt":"Sum of row 6 of the triangle?","choices":[{"t":"12","fb":"`2^6`.","_n":"2laa4","_k":"87a0ead7"},{"t":"36","fb":"`2^6`.","_n":"2mab4","_k":"087f7901"},{"t":"63","fb":"`2^6`.","_n":"2na84","_k":"9e70d020"},{"t":"64","fb":"Right. `2^6 = 64`.","_n":"2oa94","_k":"b3d7febf"}]},{"id":"q4","goal":5,"prompt":"“Choose 4 of 10 to go = choose 6 to stay” proves…","choices":[{"t":"Nothing","fb":"It pairs each group with its left-out group.","_n":"2pa64","_k":"7ae5c604"},{"t":"Pascal’s identity","fb":"It pairs each group with its left-out group.","_n":"2qa74","_k":"6a992618"},{"t":"Symmetry","fb":"Right. It pairs each group with its left-out group.","_n":"2r047","_k":"a0a63ef9"},{"t":"Row sum","fb":"It pairs each group with its left-out group.","_n":"2s057","_k":"b13f334e"}]}]}},"practice":{"activities":[{"id":"partners","type":"match","title":"Equal partners","summary":"Equal partners","goal":[1,2,3],"instruction":"Match each expression with its equal partner.","leftTitle":"Expression","rightTitle":"Equal partner","left":[{"id":"l1","t"  = C(25, 2) = (25 × 24)/2 = 300`.","wrong":[{"match":600,"fb":"`C(25, 2) = 25 × 24 ÷ 2`."}],"hints":["Use symmetry first: `C(25, 23) = C(25, 2)`.","`C(25, 2) = (25 × 24)/2`.","600 ÷ 2 = 300."]},{"id":"i2","goal":2,"prompt":"Evaluate `C(10, 4) + C(10, 5)` as a single number.","_a":"Aw5W","display":"462","why":"Pascal’s identity: `C(10, 4) + C(10, 5) = C(11, 5) = 462`. Adding 210 + 252 separately is fine too.","wrong":[{"match":252,"fb":"That’s only `C(10, 5)`."}],"hints":["Pascal’s identity: down one row, larger `r`.","`C(10, 4) + C(10, 5) = C(11, 5)`.","`C(11, 5) = 462` (or 210 + 252 = 462)."]},{"id":"i3","goal":4,"star":true,"label":"`r =`","prompt":"Solve `C(14, r) = C(14, r + 4)`.","_a":"Ag==","display":"`r = 5`","why":"`r` and `r + 4` can’t be equal, so they add to 14: `2r + 4 = 14`, `r = 5`. Check: `C(14, 5) = C(14, 9)`.","words":[{"re":"no\\s*sol|none|impossible|no\\s*answer|^no$","fb":"Symmetry gives a second solution: `r + (r + 4) = 14`."}],"hints":["When are two entries in one row equal?","Same `r`, or `r`’s that add to `n`.","`2r + 4 = 14`, so `r = 5`."]},{"id":"i4","goal":6,"star":true,"prompt":"How many non-empty selections can be made from 5 toppings?","_a":"BAk=","display":"31","why":"`2^5 = 32` selections in all, minus the plain pizza: 31.","wrong":[{"match":32,"fb":"Non-empty excludes the plain pizza."}],"hints":["Each topping is in or out.","`2^5 = 32` selections, including the plain pizza.","32 − 1 = 31."]},{"id":"i5","goal":4,"star":true,"label":"`n =`","prompt":"Find `n` if `C(n, 3) = C(n, 7)`.","_a":"Bgg=","display":"`n = 10`","why":"3 ≠ 7, so symmetry: 3 + 7 = `n`, so `n = 10`.","wrong":[{"match":4,"fb":"Symmetry: 3 + 7 = `n`."}],"hints":["When are two entries in one row equal?","`a = b` or `a + b = n`.","3 + 7 = 10."]},{"id":"i6","goal":2,"star":true,"prompt":"Evaluate `C(8, 3) + 2C(8, 2) + C(8, 1)` using Pascal’s identity twice.","_a":"BgpU","display":"120","why":"`[C(8, 3) + C(8, 2)] + [C(8, 2) + C(8, 1)] = C(9, 3) + C(9, 2) = C(10, 3) = 120`.","wrong":[{"match":84,"fb":"Two applications: `[C(8, 3) + C(8, 2)] + [C(8, 2) + C(8, 1)] = C(9, 3) + C(9, 2) = C(10, 3)`."}],"hints":["Split `2C(8, 2)` into `C(8, 2) + C(8, 2)`.","Pair them: `C(9, 3) + C(9, 2)`.","That’s `C(10, 3) = 120`."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Lorenzo","how":"","goal":[1,2,3],"instruction":"Lorenzo made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Write `C(9, 4) + C(9, 5)` as a single combination.","steps":["Pascal’s identity: `C(n - 1, r - 1) + C(n - 1, r) = C(n, r)`.","Here the parts add: `C(9 + 9, 4 + 5) = C(18, 9)`.","So the sum is `C(18, 9)`."],"_a":"Bg==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"`C(10, 4)`.","why":"Take the larger `r`.","_n":"2t027","_k":"85adef16"},{"t":"Step 2 is correct.","why":"Check: `C(9, 4) + C(9, 5) = 126 + 126 = 252`, but `C(18, 9) = 48 620`.","_n":"2u037","_k":"17461b7e"},{"t":"`n - 1 = 9` and `r = 5`, so the sum is `C(10, 5) = 252`.","why":"Pascal’s identity moves \u003cstrong>down one row\u003c/strong>: `C(9, 4) + C(9, 5) = C(10, 5)`.","_n":"2v087","_k":"9ce80bd1"},{"t":"`C(9, 9) = 1`.","why":"That adds the bottom numbers.","_n":"2w097","_k":"2f309896"}],"hints":["Where do the two entries sit in the triangle?","Side by side in row 9.","The entry below them: `C(10, 5)`."]},{"id":"e2","goal":1,"task":"Prove `C(8, 3) = C(8, 5)` with algebra.","steps":["`C(8, 5) = 8!/(5! × 3!)`.","`C(8, 3) = 8!/(3! × 8!)`.","These are different, so the identity fails."],"_a":"Bg==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"`C(8, 3) = 8!/(3! × 5!)`: the same as `C(8, 5)`.","why":"The second factorial is `(n - r)! = (8 - 3)! = 5!`, so both are `8!/(3! 5!) = 56`.","_n":"2x067","_k":"9129c551"},{"t":"`C(8, 3) = 8!/3!`.","why":"Divide by `(8 - 3)!` too.","_n":"2 ntries above `C(10, 6)` are `C(9, 5)` and `C(9, 6)`.","_n":"46916","_k":"4e04c361"},{"t":"`C(1, 0)`","why":"Combinations don’t subtract part by part.","_n":"47946","_k":"0da1e889"},{"t":"`C(9, 5)`","why":"`C(10, 6) = C(9, 5) + C(9, 6)`.","_n":"48936","_k":"0f44b796"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A club of 9 includes Ana. How many 4-person committees include Ana?","options":[{"t":"56","why":"Ana is in; choose 3 of the other 8: `C(8, 3)`.","_n":"49966","_k":"e705e4ce"},{"t":"70","why":"That’s the committees \u003cstrong>without\u003c/strong> Ana, `C(8, 4)`.","_n":"4a956","_k":"7c7a20fe"},{"t":"84","why":"`C(9, 3)` chooses 3 from all 9, including Ana again.","_n":"4b986","_k":"d7105ae8"},{"t":"126","why":"That’s all committees, `C(9, 4)`.","_n":"4c976","_k":"3642d642"}]},"b":{"prompt":"A club of 10 includes Ben. How many 3-person committees do \u003cstrong>not\u003c/strong> include Ben?","options":[{"t":"36","why":"That’s the committees with Ben, `C(9, 2)`.","_n":"4d8a6","_k":"5cd41e98"},{"t":"45","why":"`C(10, 2)`.","_n":"4e896","_k":"a39eacd5"},{"t":"84","why":"Choose all 3 from the other 9: `C(9, 3)`.","_n":"4f806","_k":"cc2fc594"},{"t":"120","why":"That’s all committees, `C(10, 3)`.","_n":"4g816","_k":"fc20032f"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best story proof that `C(n, r) = C(n, n - r)`?","options":[{"t":"Choosing the `r` people who go on a trip is the same as choosing the `n - r` people who stay home; each choice fixes the other.","why":"It counts the same set of trips two ways: by who goes and by who stays.","_n":"4h826","_k":"860f7488"},{"t":"Every committee either includes Sam or doesn’t.","why":"That’s Pascal’s identity. Both sides of the story must count the \u003cstrong>same\u003c/strong> set of committees.","_n":"4i836","_k":"fb046433"},{"t":"Both sides have the same factorials.","why":"That’s the algebra proof, not a story.","_n":"4j846","_k":"7bdd380f"},{"t":"Choosing `r` people in order and then forgetting the order.","why":"That proves `C = P ÷ r!`. Both sides of the story must count the \u003cstrong>same\u003c/strong> set of committees.","_n":"4k856","_k":"f755dbf7"}]},"b":{"prompt":"Which is the best story proof of Pascal’s identity?","options":[{"t":"Each person is in or out, so there are `2^n` committees.","why":"That’s the row sum. Both sides of the story must count the \u003cstrong>same\u003c/strong> set of committees.","_n":"4l866","_k":"1c96030b"},{"t":"Pick one person, Sam. Every committee of `r` either includes Sam (choose `r - 1` more from `n - 1`) or doesn’t (choose `r` from `n - 1`), never both.","why":"It splits the same committees into two groups that don’t overlap, and counts each group.","_n":"4m876","_k":"2aa363e0"},{"t":"Add the two numbers above in the triangle.","why":"That restates the identity; it doesn’t explain it.","_n":"4n886","_k":"962afc77"},{"t":"Choosing `r` to go = choosing `n - r` to stay.","why":"That’s symmetry. Both sides of the story must count the \u003cstrong>same\u003c/strong> set of committees.","_n":"4o896","_k":"d62e8aef"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why row `n` of Pascal’s triangle sums to `2^n`?","options":[{"t":"Each of the `n` items is either chosen or not, so there are `2^n` selections; the row lists how many have size 0, 1, …, `n`.","why":"It counts every selection once, then groups them by size.","_n":"4p866","_k":"2fc1eb14"},{"t":"`2^n` is the largest entry.","why":"The middle entry is much smaller than `2^n`.","_n":"4q856","_k":"c4aaf9ad"},{"t":"Each row doubles because it has one more entry.","why":"Entries add, not count.","_n":"4r846","_k":"70d34947"},{"t":"There are `n + 1` entries, each about 2.","why":"Each of the `n` items is in or out: `2 × 2 × … × 2 = 2^n`.","_n":"4s836","_k":"09684b49"}]},"b":{"prompt":"Which is the best explanation of why `C(n, 0) = 1`?","options":[{"t":"Because `0! = 0`.","why":"`0! = 1`.","_n":"4t8a6","_k":"7fb18f88"},{"t":"Because you can’t choose zero things.","why":"There is exactly one way to choose nobody.","_n":"4u896","_k":"46a869e5"},{"t":"There’s exactly one way to choose nobody: the empty group.","why":"`C(n, 0)` counts the ways to choose nobody, and the empty group is the only one.","_n":"4v886","_k":"47ac682c"},{"t":"Because `n ÷ n = 1`.","why":"Not a reason.","_n":"4w876","_k":"5c7267b9"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A pizza shop has 8 toppings. How many different pizzas are possible if any number of toppings can be chosen (a plain pizza counts)?","options":[{"t":"16","why":"Each of the 8 toppings is in or out: `2 × 2 × … × 2 = 2^8`.","_n":"4x8e6","_k":"35d4c910"},{"t":"255","why":"The plain pizza counts here.","_n":"4y8d6","_k":"29609888"},{"t":"256","why":"`2^8`.","_n":"4z948","_k":"ced97c21"},{"t":"40 320","why":"`8!` counts orders of toppings.","_n":"50958","_k":"231048f2"}]},"b":{"prompt":"A pizza shop has 6 toppings. How many different pizzas are possible (a plain pizza counts)?","options":[{"t":"12","why":"Each of the 6 toppings is in or out: `2 × 2 × … × 2 = 2^6`.","_n":"51928","_k":"dc53ad60"},{"t":"63","why":"The plain pizza counts here.","_n":"52938","_k":"e288aa02"},{"t":"64","why":"`2^6`.","_n":"53988","_k":"f7deb787"},{"t":"720","why":"`6!` counts orders.","_n":"54998","_k":"0adb8d0a"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A coach must leave 3 of 12 players out of a game. How many different line-ups of 9 (no positions) are possible?","options":[{"t":"36","why":"12 × 3.","_n":"55968","_k":"a13c00f8"},{"t":"220","why":"`C(12, 9) = C(12, 3)`.","_n":"56978","_k":"b58e657d"},{"t":"1320","why":"`P(12, 3)` orders the players left out.","_n":"578c8","_k":"345cf1b8"},{"t":"79 833 600","why":"`P(12, 9)` orders the 9 players.","_n":"588d8","_k":"2b0da808"}]},"b":{"prompt":"4 of 11 students must sit out. How many different teams of 7 are possible?","options":[{"t":"44","why":"11 × 4.","_n":"599a8","_k":"6a90792b"},{"t":"330","why":"`C(11, 7) = C(11, 4)`.","_n":"5a998","_k":"258ba5d8"},{"t":"7920","why":"`P(11, 4)` orders those sitting out.","_n":"5b9c8","_k":"a51acaa2"},{"t":"1 663 200","why":"`P(11, 7)`.","_n":"5c9b8","_k":"e09f19de"}]}}]},"task":{"title":"Sam’s fair split","summary":"Sam’s fair split","statement":"\u003cp>Choose a club size `n` and a committee size `r` so that every condition holds. Can you find all the answers?\u003c/p>\u003col class=\"ci-conds\">\u003cli>Exactly as many committees include Sam as leave Sam out.\u003c/li>\u003cli>There are between 10 and 1000 committees in total.\u003c/li>\u003cli>At least 6 committees include \u003cstrong>both\u003c/strong> Sam and Tia.\u003c/li>\u003c/ol>","checks":["Sam’s split is fair","Between 10 and 1000 committees","At least 6 with Sam and Tia"],"tips":["Two neighbours in row `n - 1` are equal only in the middle: `r - 1 + r = n - 1`, so `n = 2r`.","`C(4, 2) = 6` is too small; `C(14, 7)` is out of range.","With Sam and Tia both in, choose `r - 2` of the other `n - 2`."],"explainPrompt":"Explain why line 1 forces `n = 2r`, using Pascal’s identity or symmetry.","vocab":"Use the words symmetry, Pascal’s identity, with Sam and without Sam.","more":"There’s more than one answer. Can you find them all?","after3":"Line 1 forces `n = 2r`. Then (6, 3) fails line 3 (only `C(4, 1) = 4` with both)."},"cards":[["Symmetry","`C(n, r) = C(n, n - r)`."],["Symmetry story","Choosing who goes = choosing who stays."],["Pascal’s identity","`C(n, r) = C(n - 1, r - 1) + C(n - 1, r)`."],["Pascal story","Split committees into “with Sam” and “without Sam”."],["Row sum","`C(n, 0) + … + C(n, n) = 2^n`."],["Row-sum story","Each of the `n` items is in or out."],["`C(n, 0)` and `C(n, n)`","Both 1."],["`C(n, a) = C(n, b)`","`a = b` or `a + b = n`."],["Non-empty selections","`2^n - 1`."],["Counting proof","Count one set two ways; the counts must be equal."],["Committees with Sam","`C(n - 1, r - 1)`."],["`C(n + 1, 2) = C(n, 2) + n`","A newcomer shakes `n` new hands."]]}};</script>
