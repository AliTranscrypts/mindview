.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}

.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 22: hero equation (F F F … F S over q^x · p), Waiting room (D6 one run / many runs / memory test, D7 geometric chart),
   Waiting-time problems stations, Prize within k tries. Bars --pen, selected range --hi-soft, E(X) line --ink (course plan §3). */
/* radioGroup (from MDM4U 21 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* hero equation: the F … F S row, its labels, then q^x · p under them */
.hero .hero-eq.sm .gm-heq{font-size:.8em}
.gm-heq{display:inline-grid;grid-template-columns:auto auto auto auto;grid-template-areas:". tf . ts" ". uf . us" "ml mf md ms";align-items:center;justify-items:center;gap:6px 10px;font-style:normal}
.gm-ht{display:inline-flex;gap:5px;align-items:center}
.gm-htf{grid-area:tf}.gm-hts{grid-area:ts}.gm-huf{grid-area:uf}.gm-hus{grid-area:us}
.gm-hml{grid-area:ml;justify-self:end}.gm-hmf{grid-area:mf}.gm-hmd{grid-area:md}.gm-hms{grid-area:ms}
.gm-tile{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border:2px solid var(--ink-2);border-radius:6px;font:700 max(.62em,15px) var(--font-ui);color:var(--ink-2);background:var(--sheet)}
.gm-tile-s{border-color:var(--ink);color:var(--hi-ink);background:var(--hi)}
.gm-tdots{font:700 .6em var(--font-ui);color:var(--ink-2)}
.gm-hu{font:600 max(.42em,12px) var(--font-ui);color:var(--ink-2);white-space:nowrap}
.gm-hm{font-size:1em}

/* hero figure */
.gm-hfig{display:grid;gap:8px}
.gm-hrow{display:flex;align-items:center;gap:14px;min-height:76px}
.gm-hdie{flex:none;width:68px;height:68px}
.gm-hside{min-width:0;display:grid;gap:4px}
.gm-hcnt{margin:0;font-size:1rem;font-weight:600}
canvas.plot.gm-hplot{aspect-ratio:16/9}

/* devices (die, coin, spinner) */
.gm-die,.gm-coin,.gm-spin{display:block;width:100%;height:100%;overflow:visible}
.gm-dface{fill:var(--sheet);stroke:var(--ink);stroke-width:4}
.gm-dsucc{fill:var(--hi)}
.gm-pip{fill:var(--ink)}
.gm-dsucc ~ .gm-pip,.gm-dsucc ~ .gm-ctxt{fill:var(--hi-ink)}
.gm-cface{fill:var(--paper);stroke:var(--ink);stroke-width:4}
.gm-crim{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-dasharray:4 4}
.gm-ctxt{fill:var(--ink);font:700 34px var(--font-ui);text-anchor:middle;dominant-baseline:central}
.gm-sbg{fill:var(--sheet)}
.gm-ssec{fill:var(--hi-soft);stroke:var(--ink-2);stroke-width:1.5}
.gm-spin-s .gm-ssec{fill:var(--hi)}
.gm-slab{fill:var(--ink);font:700 13px var(--font-ui);text-anchor:middle;dominant-baseline:central}
.gm-srim{fill:none;stroke:var(--ink);stroke-width:3}
.gm-needle{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.gm-ntip,.gm-hub{fill:var(--ink)}

/* trial chips (one run, hero, prediction path) */
.gm-trials{display:flex;flex-wrap:wrap;gap:5px;list-style:none;margin:0;padding:0}
.gm-tr{display:inline-grid;justify-items:center;min-width:30px;padding:2px 4px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);line-height:1.1}
.gm-tr.s{border-color:var(--ink);background:var(--hi);color:var(--hi-ink)}
.gm-trf{font:700 .98rem var(--font-ui)}
.gm-trs{font:600 .7rem var(--font-ui);color:inherit;opacity:.8}

/* Waiting room */
.gm-top{margin-bottom:4px}
.gm-pbox{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px 4px;margin:0 0 10px;background:var(--sheet)}
.gm-pbox .rg-wrap{margin-bottom:6px}
.gm-sl{max-width:460px}
.gm-cap{font-size:clamp(1.15rem,2.6vw,1.5rem)}
canvas.plot.gm-plot{aspect-ratio:16/10}
.gm-pw{position:relative}
.gm-bars{position:absolute;inset:0;pointer-events:none}
.gm-bar{position:absolute;pointer-events:auto;border:0;padding:0;margin:0;background:transparent;border-radius:3px;cursor:pointer}
.gm-bar:focus-visible{outline:3px solid var(--ink);outline-offset:-2px}
.gm-key{margin:6px 0 0}
.gm-aha{margin:10px 0 0;font-size:.95rem}
.gm-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.gm-panel .rg-wrap{margin-bottom:6px}
.gm-sh{margin:0 0 8px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.gm-stp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gm-stb{min-width:40px;min-height:38px;padding:0 .5em}
.gm-sto{min-width:2.2em;text-align:center;font:700 1.15rem var(--font-math)}
.gm-how{margin:8px 0 0}
.gm-msg{min-height:1em;margin:4px 0 0}
.gm-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}
.gm-one{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.gm-dev{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.gm-devbox{flex:none;width:84px;height:84px}
.gm-devtxt{flex:1 1 220px;min-width:0}
.gm-devname{margin:0 0 2px;font-size:.9rem;color:var(--ink-2)}
.gm-cnt{margin:0 0 6px;font-weight:700;font-size:1.05rem}
.gm-one .gm-trials{margin-top:10px}
.gm-runs{margin:8px 0 0}
.gm-path{margin:0 0 8px}
.gm-pf{margin:8px 0 0;font-size:1.1rem}
.gm-many,.gm-mem{margin-top:10px}

/* Waiting-time problems */
.gw-tabs{margin-bottom:6px}
.gw-card0{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.gw-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.gw-text{margin:0 0 10px}
.gw-row{margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid var(--rule)}
.gw-row:last-of-type{border-bottom:0}
.gw-rl{margin:0 0 6px;font-weight:700}
.gw-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 0}
.gw-chip{min-height:38px;color:var(--ink)}
.gw-chip.ok{background:var(--good-bg);border-color:var(--green);font-weight:700;opacity:1}
.gw-chip.no{background:var(--bad-bg);border-color:var(--red)}
.gw-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gw-card{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px}
.gw-ct{margin:0 0 4px;font-weight:700}
.gw-done{margin:12px 0 0}
.gm-tick{font-weight:700}
.gw-h{margin:12px 0 6px}
.gw-unit{position:relative;height:46px;border:2px solid var(--ink);border-radius:4px;background:var(--paper);overflow:hidden;margin:8px 0 2px}
.gw-seg{position:absolute;top:0;bottom:0;display:grid;place-items:center;background:var(--pen);color:var(--sheet);border-right:1.5px solid var(--sheet);font-size:.95rem;overflow:hidden;white-space:nowrap}
.gw-seg .m{color:var(--sheet)}
.gw-seg1{opacity:.78}
.gw-new{animation:gwGrow .45s ease-out}
@keyframes gwGrow{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.gw-new{animation:none}}
.gw-gap{position:absolute;top:0;bottom:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--hi-soft) 0 6px,transparent 6px 12px);font:600 .85rem var(--font-ui);color:var(--ink-2)}
.gw-scale{display:flex;justify-content:space-between;font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
.gw-read{margin-top:4px}

/* Prize within k tries */
.gm-conds{margin:6px 0 0;padding-left:1.3em}
.gm-conds li{margin:2px 0}
.pk-in{margin:10px 0}
.pk-in .rg-lab{min-width:8.2em}
canvas.plot.pk-plot{aspect-ratio:16/10}
.pk-read{margin-top:8px}

@media (max-width:560px){
  .hero .hero-eq.sm .gm-heq{font-size:1em;gap:6px 8px}
  .gm-top .rg.seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
  .gm-top .rg.seg button{border-left:0}
  .gm-top .rg.seg button:nth-child(odd){border-right:1.5px solid var(--ink)}
  .gm-top .rg.seg button:nth-child(-n+2){border-bottom:1.5px solid var(--ink)}
  canvas.plot.gm-plot,canvas.plot.pk-plot{aspect-ratio:4/3}
  .gw-cards{grid-template-columns:minmax(0,1fr)}
  .gm-devbox{width:70px;height:70px}
  .gm-hdie{width:56px;height:56px}
}

s repeat \u003cstrong>until the first success\u003c/strong>. `X` counts the \u003cstrong>failures\u003c/strong> before it, and its distribution is called \u003cstrong>geometric\u003c/strong>.","fig":{"html":"\u003cdiv class=\"gm-hfig\" id=\"gm-hfig\">\u003c/div>"}},"goals":["I can recognize a waiting-time situation and define success and `p` correctly.","I can calculate `P(X = x) = q^x p`, where `X` is the number of failures before the first success.","I can calculate tail probabilities: `P(X ≥ k) = q^k` and `P(X ≤ k) = 1 - q^{k + 1}`.","I can find and interpret `E(X) = q ÷ p`, and connect it to the average trial number `1 ÷ p`.","I can solve waiting-time problems and tell them apart from binomial ones."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Independent events","goal":2,"prompt":"A die is rolled 3 times. What is \u003ci>P\u003c/i>(no 6s)?","options":[{"t":"`1/216`","why":"That’s three 6s in a row.","_n":"0447","_k":"8a685c45"},{"t":"`91/216`","why":"That’s \u003ci>P\u003c/i>(at least one 6).","_n":"1457","_k":"db78e9bd"},{"t":"`1/2`","why":"Multiply probabilities of independent events.","_n":"2467","_k":"d86c60dd"},{"t":"`125/216`","why":"`(5/6)^3`.","_n":"3477","_k":"3c20acba"}],"hints":["\u003ci>P\u003c/i>(not 6) on one roll?","`5/6` each time, multiplied.","`125/216`."]},{"id":"w2","skill":"Independent events","goal":2,"prompt":"A coin is tossed 3 times. What is \u003ci>P\u003c/i>(tail, tail, head), in that order?","options":[{"t":"`1/8`","why":"`(1/2)^3`.","_n":"4487","_k":"baf9a7fa"},{"t":"`1/4`","why":"That’s two tosses.","_n":"5497","_k":"76f1b195"},{"t":"`3/8`","why":"The order is fixed here.","_n":"64a7","_k":"6a696222"},{"t":"`1/2`","why":"Only the last toss is a head, but all three must happen.","_n":"73b7","_k":"d56293c5"}],"hints":["One specific path.","`1/2 × 1/2 × 1/2`.","`1/8`."]},{"id":"w3","skill":"Powers of fractions","goal":3,"prompt":"Evaluate `(3/4)^2 × 1/4`.","options":[{"t":"`1/64`","why":"Only one factor is `1/4`.","_n":"83c7","_k":"888fd8b3"},{"t":"`9/64`","why":"`9/16 × 1/4`.","_n":"9988","_k":"797e5c51"},{"t":"`3/16`","why":"Square it first.","_n":"a978","_k":"2d9f5d69"},{"t":"`6/16`","why":"`(3/4)^2 = 9/16`.","_n":"b968","_k":"b44b65db"}],"hints":["Square `3/4`.","`9/16`.","`9/16 × 1/4 = 9/64`."]},{"id":"w4","skill":"Powers of fractions","goal":3,"prompt":"Evaluate `(2/3)^3`.","options":[{"t":"`2/9`","why":"Cube the numerator too.","_n":"c958","_k":"812cdefd"},{"t":"`8/27`","why":"`2^3 ÷ 3^3`.","_n":"d9c8","_k":"e228f847"},{"t":"`6/9`","why":"Cube both parts.","_n":"e9b8","_k":"72e925e0"},{"t":"`8/9`","why":"`3^3 = 27`.","_n":"f9a8","_k":"19225cb0"}],"hints":["Cube top and bottom.","`2^3 = 8`, `3^3 = 27`.","`8/27`."]},{"id":"w5","skill":"Expected value","goal":4,"prompt":"`X` takes the values 0, 1, 2, 3 with probabilities 0.4, 0.3, 0.2, 0.1. Find `E(X)`.","options":[{"t":"0.25","why":"`E` uses the values.","_n":"g998","_k":"83421265"},{"t":"1.0","why":"0 + 0.3 + 0.4 + 0.3.","_n":"h908","_k":"08e82aa8"},{"t":"1.5","why":"Weight by probability.","_n":"i8f8","_k":"5ec50297"},{"t":"6","why":"Multiply each value by its probability.","_n":"j9e8","_k":"1cbc38a0"}],"hints":["`Σ xP(x)`.","0(0.4) + 1(0.3) + 2(0.2) + 3(0.1).","1.0."]},{"id":"w6","skill":"Complements","goal":3,"prompt":"A coin is tossed 3 times. What is \u003ci>P\u003c/i>(at least one head)?","options":[{"t":"`1/8`","why":"That’s no heads.","_n":"k9f8","_k":"6f8c6bf6"},{"t":"`3/8`","why":"That’s exactly one head.","_n":"l9c8","_k":"a8dbd7bc"},{"t":"`1/2`","why":"One toss only.","_n":"m9d8","_k":"71edd6be"},{"t":"`7/8`","why":"`1 - (1/2)^3`.","_n":"n9a8","_k":"01d571ab"}],"hints":["Opposite of ‘at least one head’?","All tails: `1/8`.","`7/8`."]}],"refreshers":{"Independent events":"Multiply along a path: \u003ci>P\u003c/i>(F, F, S) = `q · q · p`.","Powers of fractions":"`(a/b)^n = a^n ÷ b^n`.","Expected value":"`E(X) = Σ xP(X = x)`, a long-run average.","Complements":"\u003ci>P\u003c/i>(at least one) = 1 − \u003ci>P\u003c/i>(none)."}}},"explore":{"heading":"Waiting room","intro":"Choose the chance of success. Run the trials until the first success, or let the simulator run thousands of times. Then compare with the theory.","predIntro":"Make a prediction first. Then the waiting room will show you what really happens.","predictions":[{"id":"p1","start":{"view":"theory","p":"1/6"},"prompt":"Rolling a die until the first 6 (`p = 1/6`). Which number of failures before the first 6 is most likely?","options":[{"t":"6","_n":"o9b8","_k":"5a322b26"},{"t":"0","_n":"p988","_k":"f3352ad8"},{"t":"All equally likely","_n":"q998","_k":"096e3a57"},{"t":"5","_n":"r968","_k":"9de8034b"}],"explain":"`E(X) = 5`, but each extra failure multiplies the probability by `5/6`, so 0 wins."},{"id":"p2","start":{"view":"theory","p":"1/2","sel":"X = 3"},"prompt":"`p = 1/2`. What is `P(X = 3)`?","options":[{"t":"`1/16`","_n":"s978","_k":"933c1bec"},{"t":"`1/8`","_n":"t048","_k":"dfc42168"},{"t":"`3/8`","_n":"u038","_k":"17e30546"},{"t":"`1/2`","_n":"v068","_k":"92955e78"}],"explain":"3 failures, then a success: four factors. `1/8` uses one factor too few. `3/8` adds `C(3, 1)`, but there’s only one order."},{"id":"p3","start":{"view":"memory","p":"1/6","k":10},"prompt":"A die has shown no 6 in its last 10 rolls. What is \u003ci>P\u003c/i>(the next roll is a 6)?","options":[{"t":"`1/6`","_n":"w058","_k":"dc936485"},{"t":"`1/2`","_n":"x088","_k":"05436aa8"},{"t":"More than `1/6`, because a 6 is due","_n":"y078","_k":"f256c29e"},{"t":"Less than `1/6`, because this die avoids 6s","_n":"z0a8","_k":"be8f28f3"}],"explain":"The die doesn’t remember. Independent trials mean the wait starts fresh."},{"id":"p4","start":{"view":"theory","p":"1/4","to":"1/2"},"prompt":"`p` goes from `1/4` to `1/2`. What happens to `E(X) = q ÷ p`?","options":[{"t":"It drops from 4 to 2","_n":"10098","_k":"d7ce7062"},{"t":"It doubles","_n":"110c8","_k":"f2564321"},{"t":"It drops from 3 to 1.5","_n":"120b8","_k":"3117c6cb"},{"t":"It drops from 3 to 1","_n":"130a8","_k":"98f5157e"}],"explain":"`(3/4) ÷ (1/4) = 3`; `(1/2) ÷ (1/2) = 1`. The values 4 and 2 count trials, not failures."}],"chalIntro":"Use the waiting room to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"Set `p` so that the expected number of failures before the first success is 4.","why":"`(1 - p) ÷ p = 4` gives `1 - p = 4p`, so `p = 1/5`: 4 failures on average, and the success comes on trial 5 on average.","hints":["`E(X) = q ÷ p = (1 - p) ÷ p`.","Solve `(1 - p) ÷ p = 4`: `1 - p = 4p`.","`p = 1/5`."]},{"id":"tc2","goal":3,"prompt":"With `p = 1/3`, select the event ‘at least 3 failures before the first success’ so the readout shows `8/27`.","why":"At least 3 failures means the first 3 trials all fail: `P(X ≥ 3) = (2/3)^3 = 8/27`.","hints":["At least 3 failures means the first 3 trials all fail.","`(2/3)^3`.","Select `X ≥ 3`: `8/27`."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Find the \u003cstrong>smallest\u003c/strong> `p` among the chips `1/6`, `1/5`, `1/4`, `1/3`, `2/5`, `1/2` for which \u003ci>P\u003c/i>(the first success comes within the first 3 trials) is at least `1/2`.","why":"Within 3 trials means at most 2 failures: `P(X ≤ 2) = 1 - (3/4)^3 = 37/64 ≈ 0.578`. With `p = 1/5` it’s `61/125 = 0.488`, just under `1/2`.","hints":["Within 3 trials = at most 2 failures = 1 − \u003ci>P\u003c/i>(first 3 all fail).","You need `q^3 ≤ 1/2`.","`(4/5)^3 = 0.512` is too big; `(3/4)^3 = 27/64 ≈ 0.42` works, so `p = 1/4`."]}]},"part3":{"slug":"waiting","name":"Waiting","heading":"Waiting-time problems","intro":"Now the trials come from real situations. In each station, decide what counts as a success, find `p` and `E(X)`, and tell waiting-time problems apart from binomial ones. Station 4 checks the formulas with algebra.","stations":[{"id":"s1","title":"Quality checks","text":"A factory’s phones are faulty with probability `1/20`, independently. An inspector tests phones until she finds a faulty one. `X` = the number of good phones she tests before the first faulty one.","rows":[{"id":"s1a","goal":1,"label":"What counts as a success?","chips":[{"t":"Finding a faulty phone","fb":"Right. The inspector is waiting for a faulty phone, so that’s the success.","_n":"140b8","_k":"555ccf4a"},{"t":"Finding a good phone","fb":"The event you’re waiting for is the success: here, a faulty phone.","_n":"150c8","_k":"b5552435"}]},{"id":"s1b","goal":1,"label":"`p` =","chips":[{"t":"`1/20`","fb":"Right. `p` = \u003ci>P\u003c/i>(faulty) = `1/20`, so `q = 19/20`.","_n":"160d8","_k":"9892f7a6"},{"t":"`19/20`","fb":"That’s the chance of a good phone, a failure here. `p` is the chance of the success: a faulty phone.","_n":"17068","_k":"657cf112"}]},{"id":"s1c","goal":4,"label":"`E(X)` =","chips":[{"t":"19","fb":"Right. `q ÷ p = (19/20) ÷ (1/20) = 19` good phones first, so the faulty phone is the 20th test on average.","_n":"18078","_k":"3bead2a7"},{"t":"20","fb":"`1 ÷ p` counts trials, including the success. Failures before it average `q ÷ p`. Here `1 ÷ p = 20` counts the faulty phone too.","_n":"19088","_k":"93b00d42"},{"t":"`1/19`","fb":"That’s `p ÷ q`, upside down. Use `q ÷ p`.","_n":"1a098","_k":"226b5c7b"}]},{"id":"s1d","goal":3,"label":"\u003ci>P\u003c/i>(at least 10 good phones first) ≈","use":"`(0.95)^10 ≈ 0.599`","chips":[{"t":"0.599","fb":"Right. At least 10 good phones first means the first 10 phones are all good: `q^10 = (0.95)^10 ≈ 0.599`.","_n":"1b128","_k":"d53fda0f"},{"t":"0.401","fb":"That’s `1 - q^10`, the chance that a faulty phone turns up within the first 10. At least 10 good phones means the first 10 trials fail: `q^10`.","_n":"1c138","_k":"d2c19ba0"}]}]},{"id":"s2","title":"Who’s the success?","text":"A shooter makes 4 of every 5 free throws. `X` = makes before her first miss.","rows":[{"id":"s2a","goal":1,"label":"What counts as a success?","chips":[{"t":"A make","fb":"The event you’re waiting for is the success.","_n":"1d108","_k":"d24c99ec"},{"t":"A miss","fb":"Right. She’s waiting for her first miss, so a miss is the success.","_n":"1e0f8","_k":"9e61dd63"}]},{"id":"s2b","goal":1,"label":"`p` =","chips":[{"t":"`4/5`","fb":"The event you’re waiting for is the success. `4/5` is the chance of a make; here success is a miss.","_n":"1f0e8","_k":"7c677fc8"},{"t":"`1/5`","fb":"Right. Success is a miss, so `p = 1/5` and `q = 4/5`.","_n":"1g0d8","_k":"bf2479b3"}]},{"id":"s2c","goal":4,"label":"`E(X)` =","chips":[{"t":"4","fb":"Right. `E(X) = q ÷ p = (4/5) ÷ (1/5) = 4` makes before her first miss, on average.","_n":"1h0c8","_k":"96f1a373"},{"t":"5","fb":"`1 ÷ p` counts trials, including the success. Failures before it average `q ÷ p`. Here `1 ÷ p = 5` counts the miss too.","_n":"1i0b8","_k":"eb07a898"},{"t":"`1/4`","fb":"That’s `p ÷ q`, upside down. Use `q ÷ p`.","_n":"1j0a8","_k":"9da3dd70"}]}]},{"id":"s3","title":"Geometric or binomial?","text":"Two cards, both about rolling a die. Match each card with its formula.","cards":[{"id":"s3a","goal":5,"t":"Number of 6s in 6 rolls","chips":[{"t":"`C(6, x)(1/6)^x(5/6)^{6 - x}`","fb":"Right. Binomial: a fixed `n = 6` rolls, and the 6s can come in any order. `E(X) = np = 1`.","_n":"1k098","_k":"fc9a2a7e"},{"t":"`(5/6)^x(1/6)`","fb":"Here the number of rolls is fixed at 6, and the 6s can be anywhere among them: count the orders with `C(6, x)`.","_n":"1l188","_k":"dffe1efc"}]},{"id":"s3b","goal":5,"t":"Non-6 rolls before the first 6","chips":[{"t":"`C(6, x)(1/6)^x(5/6)^{6 - x}`","fb":"There’s only one order: all the failures come first, then the success. No `C(n, x)`.","_n":"1m178","_k":"fb74468e"},{"t":"`(5/6)^x(1/6)`","fb":"Right. Geometric: you roll until the first 6, so there’s no fixed `n` and only one order. `E(X) = q ÷ p = 5`.","_n":"1n969","_k":"83a7381c"}]}]},{"id":"s4","title":"Check it with algebra","text":"Two quick checks on the formulas: the probabilities add to 1, and counting trials instead of failures just shifts everything by 1."}],"quickCheck":{"title":"Waiting-time quick check","summary":"Waiting-time quick check","items":[{"id":"q1","goal":2,"prompt":"`p = 1/2`. `P(X = 0)`?","right":"Right. `X = 0` means success on the first trial: `P(X = 0) = p = 1/2`.","wrong":"`X = 0` means success on the first trial.","choices":[{"t":"0","_n":"1o979","_k":"3aaf3dfb"},{"t":"`1/4`","_n":"1p949","_k":"dab088bf"},{"t":"`1/2`","_n":"1q959","_k":"cd3ce478"},{"t":"1","_n":"1r9a9","_k":"161fee4c"}]},{"id":"q2","goal":4,"prompt":"`p = 1/5`. Expected failures?","right":"Right. `q ÷ p = (4/5) ÷ (1/5) = 4`.","wrong":"`q ÷ p = (4/5) ÷ (1/5)`.","choices":[{"t":"`1/5`","_n":"1s9b9","_k":"b5a8d126"},{"t":"`1/4`","_n":"1t989","_k":"c9555977"},{"t":"4","_n":"1u999","_k":"5f022628"},{"t":"5","_n":"1v8e9","_k":"c09755fb"}]},{"id":"q3","goal":5,"prompt":"No 6 in 10 rolls. \u003ci>P\u003c/i>(6 on the next roll)?","right":"Right. Independent rolls: the die doesn’t remember.","wrong":"Independent rolls.","choices":[{"t":"more than `1/6`","_n":"1w8f9","_k":"5c0c4b7d"},{"t":"less than `1/6`","_n":"1x9c9","_k":"f7ccc3b0"},{"t":"`1/6`","_n":"1y9b9","_k":"7395e317"},{"t":"`10/6`","_n":"1z9e9","_k":"daa40350"}]},{"id":"q4","goal":1,"prompt":"Which is geometric?","right":"Right. Waiting for the first success.","wrong":"Waiting for the first success.","choices":[{"t":"Rolls before the first 6","_n":"209d9","_k":"6caab415"},{"t":"Number of aces in 5 cards","_n":"21989","_k":"e8ea24cf"},{"t":"Number of 6s in 10 rolls","_n":"22979","_k":"cb5e663b"},{"t":"Sum of 2 dice","_n":"239a9","_k":"17d85ce8"}]}]}},"practice":{"activities":[{"id":"match","type":"match","title":"Situation ↔ probability","summary":"Situation ↔ probability","goal":[2,3,4],"instruction":"Match each situation with its value. Two values have no partner.","leftTitle":"Situation","rightTitle":"Value","left":[{"id":"l1","goal":2,"t":"`p = 1/2`, `P(X = 3)`","why":"Three failures, then a success: `(1/2)^3(1/2) = 1/16`."},{"id":"l2","goal":2,"t":"`p = 1/6`, `P(X = 0)`","why":"Success on the first trial: `p = 1/6`."},{"id":"l3","goal":2,"t":"`p = 1/6`, `P(X = 2)`","why":"`(5/6)^2(1/6) = 25/216`."},{"id":"l4","goal":3,"t":"`p = 1/4`, `P(X ≥ 2)`","why":"The first 2 trials fail: `(3/4)^2 = 9/16`."},{"id":"l5","goal":3,"t":"`p = 1/4`, `P(X ≤ 1)`","why":"`1/4 + (3/4)(1/4) = 7/16`, or `1 - (3/4)^2`.","hints":["At most 1 failure: `X = 0` or 1.","`1/4 + (3/4)(1/4)`.","`7/16`."]},{"id":"l6","goal":4,"t":"`p = 1/3`, `E(X)`","why":"`(2/3) ÷ (1/3) = 2`."},{"id":"l7","goal":4,"t":"`p = 1/10`, `E(X)`","why":"`(9/10) ÷ (1/10) = 9`."}],"right":[{"id":"r1","t":"`1/16`"},{"id":"r2","t":"`1/6`"},{"id":"r3","t":"`25/216`"},{"id":"r4","t":"`9/16`"},{"id":"r5","t":"`7/16`"},{"id":"r6","t":"2"},{"id":"r7","t":"9"},{"id":"r8","t":"`9/64`"},{"id":"r9","t":"10"}],"_a":"TUFbBhECFUoHQRsVXwoVAhQRBRUfGlsLFFkVRQAaGxpaVxUNEUoDGhpBWwIRAhVKA0EbFV8OFQIUEQEVHxpbDxRZFUUEGko=","wrong":{"l4|r8":"That’s exactly 2. ‘At least 2’ is `q^2`.","l7|r9":"That’s the average trial number `1 ÷ p`.","l5|r4":"That’s the complement."},"wrongDefault":"Write the failures first, then the success."},{"id":"calc","type":"numeric","title":"Waiting calculations","summary":"Waiting calculations","goal":[2,3,4,5],"instruction":"Find each probability or value. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a fraction such as 3/8 or a decimal (4 places if it doesn’t end), then press Check.","items":[{"id":"c1","goal":2,"prompt":"`p = 1/3`: find `P(X = 2)`.","_a":"Bk0GAwsJAwAHVw8GBwAGDA5SAw==","tol":0.00005,"display":"`4/27`","why":"Two failures, then a success: `(2/3)^2(1/3) = 4/27`.","wrong":[{"match":0.2222222222222222,"fb":"`X = 2` means F, F, then S: two factors of `q`, then `p`."}]},{"id":"c2","goal":4,"prompt":"`p = 1/4`: find `E(X)`.","_a":"BQ==","tol":0.00005,"display":"`E(X) = 3`","why":"`q ÷ p = (3/4) ÷ (1/4) = 3`.","wrong":[{"match":4,"fb":"`1 ÷ p` counts trials, including the success. Failures before it average `q ÷ p`."}]},{"id":"c3","goal":3,"prompt":"`p = 1/2`: find `P(X ≥ 4)`.","_a":"Bk0HAQEN","tol":0.00005,"display":"`1/16`","why":"The first 4 trials all fail: `(1/2)^4 = 1/16`.","wrong":[{"match":0.03125,"fb":"That’s exactly 4."}]},{"id":"c4","goal":3,"star":true,"prompt":"`p = 1/2`: find `P(X ≤ 2)`.","_a":"Bk0PAAY=","tol":0.00005,"display":"`7/8`","why":"`1 - (1/2)^3 = 7/8`.","wrong":[{"match":0.75,"fb":"Include `X = 2`: `1 - (1/2)^3`."}]},{"id":"c5","goal":4,"star":true,"prompt":"`E(X) = 9`. Find `p`.","_a":"Bk0G","tol":0.00005,"display":"`p = 1/10`","why":"`(1 - p) ÷ p = 9` gives `1 - p = 9p`, so `p = 1/10`.","wrong":[{"match":0.1111111111111111,"fb":"That makes `1 ÷ p = 9`; you need `q ÷ p = 9`."}]},{"id":"c6","goal":2,"star":true,"prompt":"`P(X = 1) = 6/25` and `p \u003c 1/2`. Find `p`.","_a":"Bk0D","tol":0.00005,"display":"`p = 2/5`","why":"`(1 - p)p = 6/25` gives `(5p - 2)(5p - 3) = 0`, and `p \u003c 1/2`, so `p = 2/5`.","wrong":[{"match":0.6,"fb":"That also gives `qp = 6/25`, but `p` must be under `1/2`."}],"hints":["`P(X = 1) = qp = (1 - p)p`.","`p - p^2 = 6/25`, so `25p^2 - 25p + 6 = 0`.","`(5p - 2)(5p - 3) = 0`: `p = 2/5`."]},{"id":"c7","goal":5,"star":true,"prompt":"Ana and Ben take turns rolling a die, Ana first. The first to roll a 6 wins. What is \u003ci>P\u003c/i>(Ana wins)?","_a":"Bk0CAwYMAgwDVwIDBgwCDANX","tol":0.00005,"display":"`6/11`","why":"Ana wins on roll 1, 3, 5, … of the game: `1/6 + (5/6)^2(1/6) + … = (1/6) ÷ (1 - 25/36) = 6/11`.","wrong":[{"match":0.5,"fb":"Going first is an advantage."},{"match":0.16666666666666666,"fb":"That’s only her first roll."}],"hints":["Ana wins on roll 1, 3, 5, … of the game.","`P = 1/6 + (5/6)^2(1/6) + (5/6)^4(1/6) + …`.","This sums to `(1/6) ÷ (1 - 25/36) = 6/11`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Wyatt","how":"","goal":[2,4,5],"instruction":"Wyatt made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"`p = 1/4`. Find `P(X = 3)`, where `X` = failures before the first success.","steps":["`X = 3` means F, F, F, then S.","`P = (3/4)^2(1/4)`.","`= 9/64`."],"_a":"Bw==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 computes step 2 correctly. The mistake is earlier."],"fixes":[{"t":"`C(4, 3)(3/4)^3(1/4)`.","why":"There’s only one order: all the failures come first, then the success. No `C(n, x)`.","_n":"24999","_k":"c2d50e5f"},{"t":"Step 2 is correct.","why":"Step 1 lists three F’s, so three factors of `3/4`.","_n":"25949","_k":"e94f5a67"},{"t":"`(1/4)^3(3/4)`.","why":"The failures have probability `3/4`.","_n":"26939","_k":"a56747ab"},{"t":"Three failures: `(3/4)^3(1/4) = 27/256`.","why":"`X = 3` means F, F, F, then S: three factors of `q`, then `p`.","_n":"27826","_k":"d02f8d32"}],"hints":["Count the F’s in step 1.","Three.","`(3/4)^3(1/4)`."]},{"id":"e2","goal":4,"task":"`p = 1/5`. Find the expected number of failures before the first success.","steps":["`q = 4/5`.","`E(X) = 1 ÷ p = 5`.","So on average 5 failures come first."],"_a":"Bw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"`E(X) = p ÷ q = 1/4`.","why":"That’s upside down.","_n":"28836","_k":"f23d6383"},{"t":"`E(X) = 1 ÷ q = 5/4`.","why":"That’s not a geometric formula.","_n":"29846","_k":"0954bd8d"},{"t":"Step 2 is correct.","why":"`1 ÷ p` counts the success too.","_n":"2a856","_k":"7e0755d8"},{"t":"`E(X) = q ÷ p = 4`; the success comes on trial 5 on average.","why":"`1 ÷ p` counts trials, including the success. Failures before it average `q ÷ p`.","_n":"2b866","_k":"c994c2b3"}],"hints":["Does `1 ÷ p` count the success trial?","Yes, so subtract 1.","`q ÷ p = 4`."]},{"id":"e3","goal":5,"task":"A die has shown no 6 in 12 rolls. Is a 6 more likely on the next roll?","steps":["The rolls are independent.","\u003ci>P\u003c/i>(no 6 in 12 rolls) = `(5/6)^{12}` is small, about 0.11.","So a 6 is overdue, and the next roll is more likely to be a 6."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"Independence means \u003ci>P\u003c/i>(6 on the next roll) is still `1/6`, whatever happened before.","why":"The trials are independent. After 12 misses, the next roll still has probability `1/6`.","_n":"2c876","_k":"55554a0b"},{"t":"`P = 13/6`.","why":"Probabilities can’t exceed 1.","_n":"2d886","_k":"3108c048"},{"t":"The next roll is less likely to be a 6.","why":"The past doesn’t change it in either direction.","_n":"2e896","_k":"c1e50570"},{"t":"Step 3 is correct.","why":"That’s the gambler’s fallacy.","_n":"2f8a6","_k":"bef9aa7f"}],"hints":["Does the die remember?","Step 1 says the rolls are independent.","`1/6`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the waiting room: the falling staircase, or the memory test?"},{"id":"j2","q":"In your own words, explain why `P(X = x) = q^x p` has no `C(n, x)` in it."},{"id":"j3","q":"Explain to a friend the difference between ‘failures before the first success’ and ‘the trial of the first success’."},{"id":"j4","q":"Which part still feels slippery: defining success, tails, or expected value? What will you do about it?"}]},"final":{"intro":"This shows what you’ve learned, so there are no hints here. Answer all 10 questions and say how sure you are. Then submit to see your results. Each question is labelled with its achievement chart category. In every question, `X` is the number of \u003cstrong>failures\u003c/strong> before the first success.","questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which variable has a geometric distribution, as defined in this course?","options":[{"t":"`X` = sum of two dice","why":"That’s not a count of trials.","_n":"2g8b6","_k":"63cdbdc5"},{"t":"`X` = number of tails before the first head","why":"Independent tosses, waiting for the first head.","_n":"2h887","_k":"f8e587e4"},{"t":"`X` = number of heads in 10 tosses","why":"That’s binomial.","_n":"2i877","_k":"0b5e5f25"},{"t":"`X` = number of aces in 5 cards dealt","why":"That’s hypergeometric.","_n":"2j867","_k":"3996a503"}]},"b":{"prompt":"Which variable has a geometric distribution?","options":[{"t":"`X` = the prize value of a winning ticket","why":"That’s not a waiting time.","_n":"2k857","_k":"77cb10c5"},{"t":"`X` = number of winners among 20 tickets","why":"Fixed `n`: binomial.","_n":"2l8c7","_k":"48eada6c"},{"t":"`X` = number of losing tickets checked before the first winner, where each ticket wins independently with probability `1/10`","why":"Independent tickets, waiting for the first winner.","_n":"2m8b7","_k":"64cc26d7"},{"t":"`X` = number of winners among 5 tickets drawn from a box of 50","why":"Without replacement: hypergeometric.","_n":"2n8a7","_k":"2bde5e0c"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`p = 1/3`. Find `P(X = 2)`.","options":[{"t":"`4/27`","why":"`(2/3)^2(1/3)`.","_n":"2o897","_k":"11199d1a"},{"t":"`2/9`","why":"That’s one failure, then a success.","_n":"2p907","_k":"0a8e67a4"},{"t":"`8/27`","why":"That’s \u003ci>P\u003c/i>(the first 3 trials all fail).","_n":"2q8f7","_k":"75042dcc"},{"t":"`4/9`","why":"Multiply by `p` for the success.","_n":"2r094","_k":"fa4bc011"}]},"b":{"prompt":"`p = 1/2`. Find `P(X = 4)`.","options":[{"t":"`1/32`","why":"`(1/2)^4(1/2)`.","_n":"2s084","_k":"78c6e486"},{"t":"`1/16`","why":"`X = 4` means F, F, F, F, then S: four factors of `q`, then `p`.","_n":"2t0b4","_k":"41a0a1fc"},{"t":"`5/32`","why":"There’s only one order.","_n":"2u0a4","_k":"4f81613e"},{"t":"`1/2`","why":"That’s one trial.","_n":"2v0d4","_k":"8400e358"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"`p = 1/8`. Find `E(X)`.","options":[{"t":"`1/7`","why":"That’s `p ÷ q`.","_n":"2w0c4","_k":"63dac0ce"},{"t":"`7/8`","why":"That’s `q`.","_n":"2x0f4","_k":"63f226c4"},{"t":"7","why":"`(7/8) ÷ (1/8)`.","_n":"2y0e4","_k":"52d2b539"},{"t":"8","why":"That’s the average trial number.","_n":"2z114","_k":"c1e99aba"}]},"b":{"prompt":"`p = 2/5`. Find `E(X)`.","options":[{"t":"`3/5`","why":"That’s `q`.","_n":"30104","_k":"8e73639a"},{"t":"`2/3`","why":"That’s `p ÷ q`.","_n":"31a34","_k":"53e7c86c"},{"t":"`3/2`","why":"`(3/5) ÷ (2/5)`.","_n":"32a44","_k":"f21c44d3"},{"t":"`5/2`","why":"That’s the average trial number. `1 ÷ p` counts trials, including the success. Failures before it average `q ÷ p`.","_n":"33a14","_k":"7523c5c0"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"`p = 1/4`. Find \u003ci>P\u003c/i>(at least 2 failures before the first success).","options":[{"t":"`9/64`","why":"That’s exactly 2.","_n":"34a24","_k":"062b640c"},{"t":"`27/64`","why":"That’s at least 3.","_n":"359f4","_k":"da757405"},{"t":"`9/16`","why":"The first 2 trials fail: `(3/4)^2`.","_n":"36a04","_k":"e9b3e7b3"},{"t":"`3/4`","why":"That’s at least 1.","_n":"379d4","_k":"ccdd5aa1"}]},"b":{"prompt":"`p = 1/3`. Find \u003ci>P\u003c/i>(the first success comes within the first 2 trials).","options":[{"t":"`2/9`","why":"That’s only `X = 1`.","_n":"389e4","_k":"c1b1a5e7"},{"t":"`4/9`","why":"That’s the complement: the first 2 both fail.","_n":"399b4","_k":"fb01928d"},{"t":"`5/9`","why":"`X ≤ 1`: `1 - (2/3)^2`.","_n":"3a9c4","_k":"47567ab7"},{"t":"`19/27`","why":"That’s within 3 trials.","_n":"3b9d4","_k":"cac09c88"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"For a geometric variable, `P(X = 0) = 1/5`. Find `P(X = 2)`.","options":[{"t":"`1/125`","why":"The failures have probability `4/5`, not `1/5`.","_n":"3c9c4","_k":"dec37a42"},{"t":"`16/125`","why":"`p = 1/5`, so `(4/5)^2(1/5)`.","_n":"3d9b4","_k":"79e59f87"},{"t":"`4/25`","why":"`X = 2` means F, F, then S: two factors of `q`, then `p`.","_n":"3e9a4","_k":"93a82eda"},{"t":"`16/25`","why":"Multiply by `p`.","_n":"3fa14","_k":"827496d1"}]},"b":{"prompt":"`P(X = 0) = 1/4`. Find `P(X ≥ 2)`.","options":[{"t":"`9/64`","why":"That’s exactly 2.","_n":"3ga04","_k":"01d4c30d"},{"t":"`27/64`","why":"At least 2 failures means the first 2 trials fail: `q^2`.","_n":"3h9f4","_k":"b20a06b4"},{"t":"`9/16`","why":"`p = 1/4`; `q^2 = 9/16`.","_n":"3i9e4","_k":"b2e50fb5"},{"t":"`3/4`","why":"At least 2 failures means the first 2 trials fail: `q^2`.","_n":"3j954","_k":"09287331"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A die is rolled. Compare \u003ci>P\u003c/i>(the first 6 comes after exactly 2 non-6s) with \u003ci>P\u003c/i>(exactly one 6 in 3 rolls).","options":[{"t":"They can’t be compared.","why":"Both are probabilities of events from 3 rolls.","_n":"3k944","_k":"95ef1e25"},{"t":"They’re equal.","why":"The geometric case allows only one order.","_n":"3l974","_k":"51a1e649"},{"t":"The geometric probability is larger.","why":"It’s one of the binomial’s three orders.","_n":"3m984","_k":"a406ab33"},{"t":"The binomial probability is 3 times as large: `75/216` vs `25/216`, because the 6 can be in any of 3 positions","why":"The geometric event is one order (non-6, non-6, 6); the binomial event allows all 3 orders.","_n":"3n994","_k":"66c636a6"}]},"b":{"prompt":"A coin is tossed. Compare \u003ci>P\u003c/i>(the first head comes after exactly 1 tail) with \u003ci>P\u003c/i>(exactly one head in 2 tosses).","options":[{"t":"They can’t be compared.","why":"Both are probabilities of events from 2 tosses.","_n":"3o9a4","_k":"96da969c"},{"t":"The binomial probability is twice as large: `1/2` vs `1/4`","why":"The geometric event is one order (tail, head); the binomial event allows both orders.","_n":"3p9b4","_k":"8903af8b"},{"t":"The geometric probability is larger.","why":"It’s one of the binomial’s two orders.","_n":"3q9c4","_k":"afc6ca74"},{"t":"They’re equal.","why":"The geometric case allows only one order: the tail first, then the head.","_n":"3r9d4","_k":"b1b5bb58"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Each item from a machine is defective with probability `1/50`, independently. The last 100 items were fine. Which statement is correct?","options":[{"t":"“The next item is still defective with probability `1/50`; the machine doesn’t ‘owe’ a defect.”","why":"Independent trials: past results don’t change `p`.","_n":"3s9e4","_k":"81bc4eff"},{"t":"“A defect is overdue, so the next item is more likely to be defective.”","why":"The trials are independent. After 100 fine items, the next item is still defective with probability `1/50`.","_n":"3t8f4","_k":"3dc1edcf"},{"t":"“The probability is now `100/50`.”","why":"Probabilities can’t exceed 1.","_n":"3u904","_k":"26ee6663"},{"t":"“A defect is now less likely, because the machine is on a good streak.”","why":"Independent trials have no streaks.","_n":"3va15","_k":"5da0d69e"}]},"b":{"prompt":"A student has rolled no 6 in 8 rolls. Which statement is correct?","options":[{"t":"“The die must be unfair.”","why":"8 rolls without a 6 happens about 23% of the time.","_n":"3wa05","_k":"c25f9a5a"},{"t":"“\u003ci>P\u003c/i>(6) is now `9/6`.”","why":"Impossible.","_n":"3xa35","_k":"f6e4e096"},{"t":"“A 6 is due, so the probability is higher now.”","why":"The rolls are independent. After 8 misses, the next roll still has probability `1/6`.","_n":"3ya25","_k":"4f2995f2"},{"t":"“\u003ci>P\u003c/i>(6 on the next roll) is still `1/6`; past rolls don’t affect it.”","why":"Independent rolls: the die has no memory.","_n":"3z9d5","_k":"90ad0508"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"For a waiting-time situation, `E(X) = 5`, where `X` = failed attempts before the first success. Which interpretation is correct?","options":[{"t":"“5 failures is the most likely outcome.”","why":"0 failures is the most likely.","_n":"409c5","_k":"2bf7425b"},{"t":"“The success comes on the 5th try on average.”","why":"That mixes failures and trials.","_n":"419f5","_k":"e792e5bb"},{"t":"“Over many repetitions, there are 5 failures on average before the first success, so the success comes on about the 6th try on average.”","why":"5 failures on average, then the success: about the 6th try.","_n":"429e5","_k":"23450538"},{"t":"“The success always comes on the 5th try.”","why":"`E` is an average, not a guarantee.","_n":"43995","_k":"682f275e"}]},"b":{"prompt":"`E(X) = 2` for missed calls before a call is answered. Which interpretation is correct?","options":[{"t":"“The answer comes on the 2nd call on average.”","why":"That mixes failures and trials.","_n":"44985","_k":"059d1994"},{"t":"“Exactly 2 calls are always missed.”","why":"`E` is an average, not a guarantee.","_n":"451b5","_k":"508e5a1b"},{"t":"“2 missed calls is the most likely outcome.”","why":"0 missed calls is the most likely.","_n":"461c5","_k":"1909d53d"},{"t":"“On average, 2 calls go unanswered before one is answered, so the answer comes on about the 3rd call.”","why":"2 missed calls on average, then the answered call: about the 3rd call.","_n":"47195","_k":"c41d634d"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"Phones are faulty with probability `1/20`, independently. An inspector tests phones until she finds a faulty one, and each test takes 2 minutes. What is the expected testing time, including the faulty phone?","options":[{"t":"40 minutes","why":"20 phones tested on average (19 good + 1 faulty), × 2 min.","_n":"481a5","_k":"961b71ea"},{"t":"20 minutes","why":"That’s the number of tests; multiply by 2 min.","_n":"491f5","_k":"46d0af4b"},{"t":"10 minutes","why":"Multiply by 2, don’t divide.","_n":"4a205","_k":"7ef128a0"},{"t":"38 minutes","why":"That leaves out the faulty phone’s test.","_n":"4b1d5","_k":"964d89b6"}]},"b":{"prompt":"Each call is answered with probability `1/4`, independently. Each unanswered call wastes 30 s. What is the expected time wasted on unanswered calls before one is answered?","options":[{"t":"90 s","why":"`E(X) = 3` unanswered calls × 30 s.","_n":"4c1e5","_k":"49f6a455"},{"t":"120 s","why":"That counts the answered call too.","_n":"4d135","_k":"736fa0f7"},{"t":"7.5 s","why":"That’s `p × 30`.","_n":"4e145","_k":"b46003d1"},{"t":"30 s","why":"That’s one call.","_n":"4f155","_k":"cb70441f"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A shooter makes 4 of every 5 free throws, independently. What is the p
