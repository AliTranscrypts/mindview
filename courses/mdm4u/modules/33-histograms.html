*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}

body{

.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 33: Histogram studio (D10 histogram builder, shape gallery), The right graph stations, Left-leaning histogram task.
   Bars --pen; polygon --ink; tail arrow --hi over --ink; selected bar --sel-bd border on --hi-soft (course plan §3). */
/* radioGroup (from MDM4U 19 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 19) */
.hg-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.hg-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.hg-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.hg-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.hg-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}
.hg-sw:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.hg-sw .cc-track,.hg-sw .cc-knob{transition:none}}

/* histogram SVG */
.hg-svg{display:block;width:100%;height:auto;max-width:100%}
.hg-svg text{font-family:var(--font-ui);fill:var(--ink)}
.hg-bar{fill:var(--pen);stroke:var(--sheet);stroke-width:1.5}
.hg-bar.hg-on{fill:var(--hi-soft);stroke:none}
.hg-selbd{fill:none;stroke:var(--sel-bd);stroke-width:3}
.hg-hit{fill:transparent}
.hg-b{cursor:pointer;outline:none}
.hg-b:focus-visible .hg-hit{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4}
.hg-grid{stroke:var(--plot-grid);stroke-width:1}
.hg-ax{stroke:var(--plot-axis);stroke-width:1.6}
.hg-yt{font-size:13px;text-anchor:end;fill:var(--ink-2)}
.hg-xt{font-size:13px;text-anchor:middle;fill:var(--ink-2)}
.hg-sm{font-size:11px}
.hg-axl{font-size:13px;font-style:italic;fill:var(--ink-2)}
.hg-bl{font-size:13px;font-weight:700;text-anchor:middle}
.hg-poly{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.hg-pt{fill:var(--sheet);stroke:var(--ink);stroke-width:2.2}
.hg-axhi{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2}
.hg-hiax{font-weight:700;fill:var(--ink)}
.hg-arrow-u line{stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.hg-arrow-u path{fill:var(--ink);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.hg-arrow line{stroke:var(--hi);stroke-width:3.6;stroke-linecap:round}
.hg-arrow path{fill:var(--hi)}
.hg-tail{font-size:13px;font-weight:700;text-anchor:middle}
.hg-chip rect{fill:var(--sheet);stroke:var(--ink);stroke-width:2}
.hg-chip text{font-size:14px;font-weight:700;text-anchor:middle}
.hg-note{font-size:12px;font-weight:700}
.hg-hchip rect{fill:var(--sheet);stroke:var(--pen);stroke-width:1.4}
.hg-hchip text{font-size:10px;font-weight:700;text-anchor:middle}
.hg-bd{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3}
.hg-tb{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.hg-th{font-size:13px;font-weight:700;text-anchor:middle}
.hg-td{font-size:13px;text-anchor:middle}
.hg-tot{font-weight:700}
.hg-hero{width:100%}

/* studio layout */
.hg-top{margin-bottom:4px}
.hg-cap{font-size:clamp(1.05rem,2.4vw,1.35rem)}
.hg-plot{margin:4px 0 0}
.hg-data{margin:8px 0 0;line-height:1.5}
.hg-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.hg-sh{margin:0 0 8px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.hg-sh2{margin-top:12px}
.hg-add{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hg-al{font-weight:700;font-size:.9rem}
.hg-in{width:5.4rem}
.hg-how{margin:8px 0 0}
.hg-msg{min-height:1.2em;margin:6px 0 0}
.hg-tbl{margin-top:8px}
.hg-guess{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.hg-gb[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd)}

/* shape sort tiles */
.hg-tile{display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:110px}
.hg-mini{width:110px;height:auto;display:block}
.hg-mini rect{fill:var(--pen);stroke:var(--sheet);stroke-width:1}
.hg-mini line{stroke:var(--plot-axis);stroke-width:1.5}
.hg-tl{font-size:.85rem;font-weight:700;text-align:center;line-height:1.25}
.hg-ctx{display:block;font-weight:400;font-size:.78rem;color:var(--ink-2)}

/* Part 3 */
.hg-p3{margin-top:6px}
.hg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:0 0 12px}
.hg-dc{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;font:600 .95rem var(--font-ui);min-height:48px;cursor:pointer}
.hg-dc[aria-pressed="true"]{border-color:var(--sel-bd);background:var(--hi-soft)}
.hg-dc.hg-placed{background:var(--good-bg);cursor:default;opacity:1}
.hg-on-g{display:block;font-size:.85rem;font-weight:700;margin-top:4px}
.hg-gts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.hg-gts .btn[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd)}
.hg-prev{border:1.5px dashed var(--rule);border-radius:10px;padding:8px 12px;margin:0 0 10px;max-width:420px}
.hg-sk,.hg-bk{max-width:400px}
.hg-pie{max-width:380px;margin:10px 0}
.hg-slice{stroke:var(--sheet);stroke-width:1.5}
.hg-s0{fill:var(--ev-a)}.hg-s1{fill:var(--ev-b)}.hg-s2{fill:var(--ev-c)}.hg-s3{fill:var(--ink-2)}
.hg-gap{fill:var(--paper);stroke:var(--red);stroke-width:2;stroke-dasharray:5 4}
.hg-pl{font-size:13px;font-weight:700;text-anchor:middle;fill:var(--sheet) !important}
.hg-lg{font-size:13px}
.hg-box{fill:var(--ev-a-soft);stroke:var(--pen);stroke-width:2}
.hg-med{stroke:var(--ink);stroke-width:2.6}
.hg-stem{font-family:var(--font-math) !important;font-size:13px}
.hg-bkc{border-top:1px solid var(--rule);padding:10px 0 4px}
.hg-angs{display:grid;gap:6px;margin:0 0 8px}
.hg-ain{width:5.4rem}
.hg-after{margin:12px 0 0}

/* task */
.ll-in{display:grid;gap:4px}
.ll-pv .hg-svg{margin-bottom:8px}

lings","why":"That’s quantitative and discrete.","_n":"0bd7","_k":"9a46cf09"},{"t":"Time to run 100 m","why":"That’s quantitative and continuous.","_n":"1ba7","_k":"8ab41791"},{"t":"Favourite season","why":"Its values are names, not numbers.","_n":"2bb7","_k":"be53b212"},{"t":"Height in cm","why":"That’s quantitative and continuous.","_n":"3c07","_k":"142f0ff1"}],"hints":["Can you do arithmetic with the values?","Seasons are labels.","Favourite season."]},{"id":"w2","skill":"Types of data","goal":5,"prompt":"Which variable is continuous?","options":[{"t":"Shoe brand","why":"That’s categorical.","_n":"4c17","_k":"9a822167"},{"t":"Mass of an apple","why":"It can take any value in a range.","_n":"5be7","_k":"80f5021e"},{"t":"Jersey number","why":"A label, even though it uses digits.","_n":"6bf7","_k":"592a6c3d"},{"t":"Number of goals","why":"Counts are discrete.","_n":"7b47","_k":"88d76af6"}],"hints":["Is it measured or counted?","Measured quantities are continuous.","Mass."]},{"id":"w3","skill":"Fractions and percents","goal":1,"prompt":"What is 9 out of 30 as a decimal?","options":[{"t":"0.09","why":"Divide by the total, 30.","_n":"8b57","_k":"f017c610"},{"t":"0.3","why":"9 ÷ 30 = 3 ÷ 10.","_n":"91b9","_k":"8b0aba86"},{"t":"0.9","why":"9 ÷ 10, not 9 ÷ 30.","_n":"a1a9","_k":"91f7d45a"},{"t":"3.33","why":"30 ÷ 9 is upside down.","_n":"b1d9","_k":"5991a918"}],"hints":["Part ÷ whole.","9 ÷ 30.","0.3."]},{"id":"w4","skill":"Fractions and percents","goal":4,"prompt":"In a class of 25, 8 walk to school. What percent is that?","options":[{"t":"8%","why":"8 is the count, not the percent.","_n":"c1c9","_k":"8022cb6e"},{"t":"17%","why":"Divide, don’t subtract.","_n":"d1f9","_k":"32495410"},{"t":"32%","why":"8 ÷ 25 = 0.32.","_n":"e1e9","_k":"86127e2d"},{"t":"3.125%","why":"25 ÷ 8 is upside down.","_n":"f219","_k":"144d2cf4"}],"hints":["Part ÷ whole × 100.","8 ÷ 25 = 32 ÷ 100.","32%."]},{"id":"w5","skill":"Reading intervals","goal":1,"prompt":"Which numbers belong to the interval [10, 20)?","options":[{"t":"11 to 19 only","why":"10 is included, and so are decimals such as 19.9.","_n":"g209","_k":"bddad8b8"},{"t":"10 and 19.9, but not 20","why":"The square bracket includes 10; the round one excludes 20.","_n":"h239","_k":"9b8e521b"},{"t":"20 but not 10","why":"That’s backwards.","_n":"i229","_k":"75ea3b74"},{"t":"10 and 20","why":"The round bracket excludes 20.","_n":"ja99","_k":"7daebb09"}],"hints":["[ means included; ) means excluded.","10 is in; 20 is out.","10 up to, but not including, 20."]},{"id":"w6","skill":"Reading intervals","goal":2,"prompt":"What is the midpoint of the class [40, 50)?","options":[{"t":"10","why":"That’s the class width.","_n":"kaa9","_k":"1d65de10"},{"t":"40","why":"That’s the left endpoint.","_n":"lab9","_k":"b59f991c"},{"t":"45","why":"(40 + 50) ÷ 2.","_n":"mac9","_k":"eeffdf9b"},{"t":"50","why":"That’s the right endpoint.","_n":"nad9","_k":"febf8da4"}],"hints":["Halfway between the endpoints.","(40 + 50) ÷ 2.","45."]}],"refreshers":{"Types of data":"Categorical data are labels; quantitative data are numbers. Counted numbers are discrete, and measured numbers are continuous.","Fractions and percents":"Part ÷ whole gives a decimal; × 100 gives a percent.","Reading intervals":"[\u003ci>a\u003c/i>, \u003ci>b\u003c/i>) includes \u003ci>a\u003c/i> and excludes \u003ci>b\u003c/i>. The class width is \u003ci>b\u003c/i> − \u003ci>a\u003c/i> and the midpoint is (\u003ci>a\u003c/i> + \u003ci>b\u003c/i>) ÷ 2."}}},"explore":{"heading":"Histogram studio","intro":"Choose a class width and a starting value; watch the table and the histogram rebuild. Then switch the vertical scale and test some famous shapes.","predictions":[{"id":"p1","start":{"mode":"studio","st":20,"w":10,"sc":"freq"},"prompt":"Switch the width to 20. What happens?","options":[{"t":"Only 3 bars; the shape becomes cruder and the details disappear","_n":"oae9","_k":"835875ab"},{"t":"The same 5 bars, but taller","_n":"paf9","_k":"348ec83c"},{"t":"More bars and more detail","_n":"qb09","_k":"7340c042"},{"t":"The data change","_n":"ra19","_k":"1c887a99"}],"explain":"The bars merge into 10, 16, 4. Wider classes mean fewer, taller bars. Too few classes hide the shape."},{"id":"p2","start":{"mode":"studio","st":20,"w":10,"sc":"freq"},"prompt":"Add a new value of exactly 50. Which bar grows?","options":[{"t":"[50, 60)","_n":"sa29","_k":"69184478"},{"t":"Neither","_n":"taf9","_k":"0bef4090"},{"t":"Both","_n":"uae9","_k":"c3281f7a"},{"t":"[40, 50)","_n":"vad9","_k":"c2a2b36c"}],"explain":"The 50 chip drops into [50, 60), which goes from 6 to 7. [50, 60) includes its left endpoint, 50."},{"id":"p3","start":{"mode":"studio","st":20,"w":10,"sc":"freq"},"prompt":"Switch the vertical scale from Frequency to Relative frequency. What changes?","options":[{"t":"The shape flattens","_n":"wac9","_k":"2392980a"},{"t":"Only the numbers on the vertical axis","_n":"xb39","_k":"21905d1b"},{"t":"The tallest bar moves","_n":"yb29","_k":"fbec4674"},{"t":"The bars get wider","_n":"zb19","_k":"4af47a80"}],"explain":"The axis relabels from 0–10 to 0–0.33; the bars don’t move. Dividing every frequency by 30 rescales the axis but keeps the shape."},{"id":"p4","start":{"mode":"gallery","card":"inc"},"prompt":"Shape gallery, card “household incomes” (9, 7, 4, 2, 1). Which shape is this?","options":[{"t":"Symmetric","_n":"10b09","_k":"4e448bd4"},{"t":"Skewed right","_n":"11a79","_k":"b716a0c0"},{"t":"Uniform","_n":"12a69","_k":"d3710635"},{"t":"Skewed left","_n":"13ada","_k":"86e583f2"}],"explain":"A tail arrow points right along the short bars. Most incomes are low, with a long tail of high ones. Skew is named for the tail."}],"chalIntro":"Use the studio to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[1,5],"prompt":"Choose a width and a start so there are exactly 5 classes and every value is counted.","why":"Width 10 from 20 gives [20, 30) … [60, 70): 5 classes holding all 30 values. It is the only combination that works.","hints":["The data run from 22 to 68, a span of about 50.","Five classes of width 10 cover 50.","Start at 20 so the first class is [20, 30)."]},{"id":"tc2","goal":4,"prompt":"Cumulative view (start 20, width 10). Tap the bar that holds the median.","why":"The cumulative totals are 3, 10, 20, …: the 15th and 16th values arrive in [40, 50), so it is the median class.","hints":["With 30 values, the median sits between the 15th and 16th.","Cumulative: 3, 10, 20, …","The 15th and 16th fall in [40, 50)."]},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"Add exactly 4 new values (from 20 to 69) so the width-10 histogram becomes \u003cstrong>symmetric\u003c/strong>: the first and last bars equal, and the second and fourth bars equal.","why":"Symmetric! There are exactly three ways: 4, 7, 12, 7, 4; 5, 7, 10, 7, 5; or 4, 8, 10, 8, 4.","hints":["\u003ci>f\u003c/i>₁ is 1 behind \u003ci>f\u003c/i>₅, and \u003ci>f\u003c/i>₄ is 1 behind \u003ci>f\u003c/i>₂.","Fixing both uses 2 of your 4 values: one in [20, 30) and one in [50, 60).","Spend the last 2 symmetrically: both in [40, 50), one at each end, or one in each of the 2nd and 4th classes."]}]},"part3":{"slug":"right-graph","name":"Right graph","heading":"The right graph","intro":"Different data need different graphs. Match each data set to its graph, diagnose some broken graphs, and check a circle graph’s angles.","graphs":[{"id":"bar","t":"Bar graph"},{"id":"circle","t":"Circle graph"},{"id":"hist","t":"Histogram"},{"id":"stem","t":"Stem-and-leaf plot"},{"id":"box","t":"Side-by-side box plots"}],"cards":[{"id":"c1","goal":5,"t":"Favourite streaming service of 40 students","kind":"cat","_a":"aEdUWEsQThdQDERaVVdAaA==","why":"Services are categories: a bar graph or a circle graph shows them.","wrong":{"hist":"Services are categories with no number line. Histograms are for numerical data on a number line, so the bars touch. Categories get a bar graph.","stem":"Stem-and-leaf plots need numbers; services are names.","box":"Categories have no quartiles."}},{"id":"c2","goal":5,"t":"Heights of 100 students (cm)","kind":"cont","_a":"EQ1fSk0Q","why":"Height is continuous: group it into classes and draw a histogram.","wrong":{"bar":"Nearly every height differs: about a hundred one-value bars. Group heights into classes.","circle":"Too many slices; height is numerical.","stem":"With 100 values the leaves pile up into long rows; grouping into classes shows the shape better.","box":"One box plot hides the shape of a single group; a histogram shows it."}},{"id":"c3","goal":5,"t":"Number of pets per household (0 to 4)","kind":"disc","_a":"EQdXSxs=","why":"Discrete data with only a few values: one bar per value.","wrong":{"hist":"With only the values 0 to 4, each value gets its own bar: there are no classes to group.","circle":"A circle graph shows parts of a whole, but it hides the order 0, 1, 2, 3, 4. Bars keep it.","stem":"With values 0 to 4, every stem would be 0.","box":"Five possible values: a box plot hides how many households have each."}},{"id":"c4","goal":5,"t":"20 test marks","kind":"small","_a":"ERZCXFQQ","why":"A small numerical set: a stem-and-leaf plot shows the shape and keeps every mark.","wrong":{"hist":"A histogram works, but with only 20 marks a stem-and-leaf plot shows the shape \u003cem>and\u003c/em> keeps every mark.","bar":"Marks are numerical; one bar per mark is noisy.","circle":"Marks aren’t parts of a whole.","box":"One set of 20 marks: a stem-and-leaf plot keeps every value."}},{"id":"c5","goal":5,"t":"Comparing two classes’ marks","kind":"two","_a":"EQdZQRs=","why":"Side-by-side box plots line up the two medians and spreads on one scale.","wrong":{"hist":"Two histograms could work, but side-by-side box plots compare medians and spreads on one scale.","bar":"This compares two groups of numbers: side-by-side box plots line up their medians and quartiles.","circle":"Circle graphs show parts of a whole, not two sets of marks.","stem":"One stem-and-leaf plot shows one set; this compares two."}}],"problems":[{"id":"cat","t":"Categories drawn as a histogram"},{"id":"uneq","t":"Unequal class widths drawn as if equal"},{"id":"many","t":"Too many one-value bars: group into classes"},{"id":"order","t":"The bars should be sorted tallest to shortest"}],"broken":[{"id":"g1","goal":[2,5],"title":"Histogram of favourite colours","_a":"EQZXTRs=","why":"Colours are categories, so this is a bar graph: the gaps are right, the label “histogram” is wrong. Histograms are for numerical data on a number line, so the bars touch. Categories get a bar graph.","wrong":{"uneq":"The bars are all the same width, and colours have no class widths.","many":"There are only 5 bars.","order":"Order is a choice for categories; the real problem is the graph type."}},{"id":"g2","goal":[1,2],"title":"Histogram of commute times (min)","_a":"ERBYXEgQ","why":"The classes [0, 10), [10, 20), [20, 40) and [40, 80) have widths 10, 10, 20 and 40, but the bars are drawn the same width, which distorts the shape.","wrong":{"cat":"Commute times are numerical, so a histogram is the right graph type.","many":"There are only 4 bars.","order":"Histogram bars follow the number line; never sort them."}},{"id":"g3","goal":[2,5],"title":"Bar graph of 70 heights (cm)","_a":"EQhXV0AQ","why":"Seventy one-value bars hide the shape. Aim for about 5–12 classes: enough to show the shape without noise.","wrong":{"cat":"Heights are numbers, not categories.","uneq":"Every bar is one value wide: the problem is how many there are.","order":"Sorting won’t help: the values need grouping."}}],"circle":{"title":"Ways students get to school","unit":"model data","rows":[{"id":"a1","t":"Walk","rf":0.35,"_a":"AlcA"},{"id":"a2","t":"Bus","rf":0.25,"_a":"ClU="},{"id":"a3","t":"Car","rf":0.2,"_a":"BFc="},{"id":"a4","t":"Bike","rf":0.2,"_a":"BFc="}],"goal":[1,5]},"quickCheck":{"title":"Right graph quick check","summary":"Right graph quick check","items":[{"id":"q1","goal":5,"prompt":"Best graph for the mass of 200 apples?","choices":[{"t":"Circle graph","fb":"Mass is continuous: group it into classes.","_n":"14aea","_k":"94ab2770"},{"t":"Scatter plot","fb":"Mass is continuous: group it into classes.","_n":"15aba","_k":"dadcd21e"},{"t":"Histogram","fb":"Right. Mass is continuous: group it into classes.","_n":"16aca","_k":"5a0a9ad3"},{"t":"Bar graph","fb":"Mass is continuous: group it into classes.","_n":"17b1a","_k":"0b3338b2"}]},{"id":"q2","goal":5,"prompt":"Best graph for students’ favourite subject?","choices":[{"t":"Box plot","fb":"Subjects are categories.","_n":"18b2a","_k":"cc32c0aa"},{"t":"Frequency polygon","fb":"Subjects are categories.","_n":"19afa","_k":"91394f86"},{"t":"Bar graph","fb":"Right. Subjects are categories.","_n":"1ab0a","_k":"440c4582"},{"t":"Histogram","fb":"Subjects are categories. Histograms are for numerical data on a number line, so the bars touch. Categories get a bar graph.","_n":"1ba5a","_k":"2715a486"}]},{"id":"q3","goal":2,"prompt":"Why do histogram bars touch?","choices":[{"t":"To save space","fb":"Each class starts where the last one ends.","_n":"1ca6a","_k":"4964546c"},{"t":"The classes cover the number line without gaps","fb":"Right. Each class starts where the last one ends.","_n":"1db3a","_k":"3a79c048"},{"t":"The frequencies are equal","fb":"Each class starts where the last one ends.","_n":"1eb2a","_k":"b2f92677"},{"t":"Habit","fb":"Each class starts where the last one ends.","_n":"1fb5a","_k":"64d1bfdf"}]},{"id":"q4","goal":1,"prompt":"A circle graph shows 25% for one category. What angle?","choices":[{"t":"90°","fb":"Right. 0.25 × 360° = 90°.","_n":"1gb4a","_k":"e22eaf18"},{"t":"100°","fb":"0.25 × 360°.","_n":"1hafa","_k":"84008c87"},{"t":"25°","fb":"0.25 × 360°.","_n":"1iaea","_k":"42ab539d"},{"t":"45°","fb":"0.25 × 360°.","_n":"1jb1a","_k":"aa063527"}]}]}},"practice":{"activities":[{"id":"shapes","type":"sorter","title":"Shape sort","summary":"Shape sort","goal":3,"noun":
