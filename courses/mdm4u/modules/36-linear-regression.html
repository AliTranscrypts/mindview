.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 36: Fit duel (D11 scatter plot and regression), Predictions with care (trust gauge), lineEntry, Hit the target line.
   Points --pen; least-squares line --ink; the student's line --ink-2 dashed; residuals and squares orange (--ev-c) for the
   student's line, --ink for the least-squares line; data range --hi-soft, extrapolation hatched --ink-2 (course plan D11). */
.hero-eq .lr-heq2{display:block;font-size:.42em;margin-top:.35em;color:var(--ink-2)}
/* radioGroup (from MDM4U 19 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 19) */
.lr-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.lr-sw:disabled{opacity:.55;cursor:not-allowed}
.lr-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.lr-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.lr-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.lr-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}

/* Fit duel */
.lr-top{display:flex;flex-wrap:wrap;gap:0 22px;margin-bottom:4px}
canvas.plot.lr-plot{aspect-ratio:16/11}
.lr-cap{font-size:clamp(1.05rem,2.4vw,1.35rem)}
.lr-ctx{margin:6px 0 0}
.lr-aha{margin:10px 0 0;font-size:.95rem}
.lr-sws{display:flex;flex-wrap:wrap;gap:2px 18px;margin:0 0 8px}
.lr-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.lr-sh{margin:0 0 6px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.lr-msg{min-height:1.2em;margin:6px 0 0}
.lr-add{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:8px 0 4px}
.lr-add label{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.lr-in{width:4.4rem}
.lr-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}
.lr-ok{font-weight:700}

/* Predictions with care */
.pc-body{margin-top:6px}
.pc-card0{border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--sheet)}
.pc-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.pc-text{margin:0 0 8px}
.pc-sl{margin-top:10px}
.pc-quick{margin:6px 0 8px}
.pc-note{margin:6px 0 0;font-weight:700}
.pc-card{border-top:1px solid var(--rule);padding:10px 0}
.pc-card .btn[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--ink)}
.pc-after{margin:10px 0 0}
.lr-gauge{margin:10px 0 0}
.lr-mtrack{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink-2);border-radius:8px;overflow:hidden;padding-bottom:10px}
.lr-mz{padding:6px 4px 4px;text-align:center;font:600 .85rem var(--font-ui);color:var(--ink-2);background:var(--paper)}
.lr-mz + .lr-mz{border-left:1px solid var(--rule)}
.lr-mz.on{color:var(--ink);font-weight:800}
.lr-mz0.on{background:var(--good-bg)}
.lr-mz1.on{background:var(--hi-soft)}
.lr-mz2.on{background:var(--info-bg)}
.lr-needle{position:absolute;bottom:0;width:0;height:0;margin-left:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:10px solid var(--ink);transition:left .45s ease}
.lr-mtext{margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.lr-needle,.lr-sw .cc-track,.lr-sw .cc-knob{transition:none}}

/* Compute and predict */
.le-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.le-eq{font-family:var(--font-math);font-size:1.05rem}
.le-in{width:5.6rem}

/* Hit the target line */
.lr-conds{margin:6px 0 8px;padding-left:1.4em}
.ht-in{display:grid;gap:6px}
.ht-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ht-row label{min-width:6.4em;font-weight:700}
.ht-st{min-width:38px;min-height:36px;padding:0 .5em}
.ht-num{width:3.6rem;text-align:center}
canvas.plot.ht-plot{aspect-ratio:4/3}
.ht-key{margin:6px 0}
@media (max-width:360px){.lr-mz{font-size:.74rem}}

l residual segments run from each point to the line, each with a small square on it, and a Sum of squares counter changes as the line tilts. The line settles where the counter is smallest, 16, and a ring marks the point of means (25, 60) on the line.","shape":"wide"}},"goals":["I can explain what “least squares” means and why the least-squares line is the line of best fit.","I can find the least-squares line for a small data set, or from summary values (\u003ci>x̄\u003c/i>, \u003ci>ȳ\u003c/i>, \u003ci>s\u003c/i>\u003csub>\u003ci>x\u003c/i>\u003c/sub>, \u003ci>s\u003c/i>\u003csub>\u003ci>y\u003c/i>\u003c/sub>, \u003ci>r\u003c/i>).","I can interpret the slope and \u003ci>y\u003c/i>-intercept of a regression line in context, with units.","I can use a regression line to make predictions and tell interpolation from extrapolation.","I can predict how changing or adding data points changes the line.","I can judge when a regression prediction should not be trusted."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Slope and equations","goal":2,"prompt":"Find the slope of the line through (2, 9) and (6, 21).","options":[{"t":"`1/3`","why":"Slope is rise ÷ run: Δ\u003ci>y\u003c/i> ÷ Δ\u003ci>x\u003c/i>.","_n":"07e3","_k":"d22f95d8"},{"t":"3","why":"(21 − 9) ÷ (6 − 2) = 12 ÷ 4.","_n":"17d3","_k":"3b6574e3"},{"t":"7.5","why":"Use the changes between the points.","_n":"27c3","_k":"28fe9fe0"},{"t":"12","why":"12 is the rise; divide by the run, 4.","_n":"3833","_k":"e0fcbd18"}],"hints":["Rise over run.","Rise 21 − 9 = 12; run 6 − 2 = 4.","12 ÷ 4 = 3."]},{"id":"w2","skill":"Slope and equations","goal":2,"prompt":"A line has slope 2 and passes through (25, 60). What is its \u003ci>y\u003c/i>-intercept?","options":[{"t":"10","why":"60 = 2(25) + \u003ci>b\u003c/i>, so \u003ci>b\u003c/i> = 10.","_n":"4823","_k":"232b27ad"},{"t":"35","why":"Multiply by the slope first: 2 × 25 = 50.","_n":"5813","_k":"3e6c20ec"},{"t":"60","why":"60 is \u003ci>y\u003c/i> when \u003ci>x\u003c/i> = 25, not when \u003ci>x\u003c/i> = 0.","_n":"6803","_k":"4962ca7a"},{"t":"110","why":"\u003ci>b\u003c/i> = 60 − 50.","_n":"7873","_k":"04019d58"}],"hints":["Substitute the point into \u003ci>y\u003c/i> = 2\u003ci>x\u003c/i> + \u003ci>b\u003c/i>.","60 = 50 + \u003ci>b\u003c/i>.","\u003ci>b\u003c/i> = 10."]},{"id":"w3","skill":"Means","goal":2,"prompt":"Find the mean of 38, 52, 62, 68, 80.","options":[{"t":"59","why":"The total is 300.","_n":"8863","_k":"2a487ce2"},{"t":"60","why":"300 ÷ 5.","_n":"952b","_k":"0fcde3fc"},{"t":"62","why":"62 is the middle value; the mean is the total ÷ 5.","_n":"a53b","_k":"6965156a"},{"t":"75","why":"There are 5 values.","_n":"b50b","_k":"9c8a0a52"}],"hints":["Add, then divide by how many.","The sum is 300.","300 ÷ 5 = 60."]},{"id":"w4","skill":"Correlation","goal":1,"prompt":"A scatter plot has \u003ci>r\u003c/i> = −0.95. Which describes it?","options":[{"t":"A strong positive pattern","why":"Negative \u003ci>r\u003c/i>: \u003ci>y\u003c/i> falls as \u003ci>x\u003c/i> rises.","_n":"c51b","_k":"c9e2eafe"},{"t":"A strong negative linear pattern","why":"|\u003ci>r\u003c/i>| close to 1, negative sign.","_n":"d4eb","_k":"a5bd8f05"},{"t":"A weak negative pattern","why":"Strength is the size of |\u003ci>r\u003c/i>|: 0.95 is strong.","_n":"e4fb","_k":"a4ea2e60"},{"t":"No pattern","why":"A negative \u003ci>r\u003c/i> still shows a relationship.","_n":"f4cb","_k":"0b248f7e"}],"hints":["The sign gives direction; the size gives strength.","|−0.95| = 0.95 ≥ 0.67.","Strong and negative."]},{"id":"w5","skill":"Reading a scatter plot","goal":4,"prompt":"A scatter plot shows temperatures from 15 °C to 35 °C. Which \u003ci>x\u003c/i>-value is inside the data’s range?","options":[{"t":"0 °C","why":"That’s below the smallest \u003ci>x\u003c/i>.","_n":"g4db","_k":"eb503808"},{"t":"28 °C","why":"Between 15 and 35.","_n":"h5ab","_k":"0c7c0ec6"},{"t":"40 °C","why":"That’s beyond the largest \u003ci>x\u003c/i>.","_n":"i5bb","_k":"5333ba0f"},{"t":"−5 °C","why":"That’s far below the range.","_n":"j4cb","_k":"31a3c27a"}],"hints":["Find the smallest and largest \u003ci>x\u003c/i>.","15 and 35.","28 is between them."]},{"id":"w6","skill":"Reading a scatter plot","goal":3,"prompt":"On the line \u003ci>y\u003c/i> = 2\u003ci>x\u003c/i> + 10, what happens to \u003ci>y\u003c/i> when \u003ci>x\u003c/i> increases by 1?","options":[{"t":"\u003ci>y\u003c/i> doubles","why":"Slope 2 adds 2; it doesn’t double \u003ci>y\u003c/i>.","_n":"k4bb","_k":"f6de224a"},{"t":"\u003ci>y\u003c/i> increases by 2","why":"That’s what the slope means.","_n":"l4ab","_k":"c3b55b49"},{"t":"\u003ci>y\u003c/i> becomes 12","why":"That’s \u003ci>y\u003c/i> when \u003ci>x\u003c/i> = 1, not the change.","_n":"m49b","_k":"f383f1c3"},{"t":"\u003ci>y\u003c/i> increases by 10","why":"10 is the starting value.","_n":"n50b","_k":"55e93a46"}],"hints":["What does slope measure?","Change in \u003ci>y\u003c/i> per 1 unit of \u003ci>x\u003c/i>.","+2."]}],"refreshers":{"Slope and equations":"Slope = rise ÷ run. To find \u003ci>b\u003c/i>, substitute a point into \u003ci>y\u003c/i> = \u003ci>m\u003c/i>\u003ci>x\u003c/i> + \u003ci>b\u003c/i>.","Means":"Mean = sum ÷ count. The mean is the balance point; the median is the middle.","Correlation":"\u003ci>r\u003c/i> runs from −1 to 1. The sign is the direction. Strength guide: |\u003ci>r\u003c/i>| ≥ 0.67 strong, 0.33–0.67 moderate, below 0.33 weak.","Reading a scatter plot":"Note the \u003ci>x\u003c/i>-range of the data. The slope is the change in \u003ci>y\u003c/i> per unit of \u003ci>x\u003c/i>."}}},"explore":{"heading":"Fit duel","intro":"Draw your own line, then let least squares draw its line. The squares show every miss. Whose total is smaller?","predIntro":"Make a prediction first. Then the fit duel will show you what really happens.","predictions":[{"id":"p1","prompt":"Which line has the smaller sum of squared residuals?","options":[{"t":"They tie","_n":"o4fb","_k":"5f2933ea"},{"t":"The least-squares line","_n":"p4eb","_k":"8d7943c1"},{"t":"It depends on the units","_n":"q4db","_k":"bb697e36"},{"t":"The line through the end points","_n":"r54b","_k":"cc09413e"}],"explain":"The end-point line ignores the three middle points, which all sit above it. Least squares balances every residual. The best line is judged by all the residuals together. The least-squares line has the smallest sum of squared residuals."},{"id":"p2","prompt":"The least-squares line always passes through which point?","options":[{"t":"(25, 60)","_n":"s53b","_k":"f14ab0c7"},{"t":"(0, 10)","_n":"tc6b","_k":"acf452a4"},{"t":"(15, 38)","_n":"uc7b","_k":"113101dc"},{"t":"(35, 80)","_n":"vc8b","_k":"0a119ac4"}],"explain":"\u003ci>x̄\u003c/i> = 25 and \u003ci>ȳ\u003c/i> = 60. The least-squares line always passes through (\u003ci>x̄\u003c/i>, \u003ci>ȳ\u003c/i>)."},{"id":"p3","prompt":"The 35 °C point moves up from 80 to 90. What happens to the least-squares slope?","options":[{"t":"It decreases","_n":"wc9b","_k":"fe0df314"},{"t":"It becomes 0","_n":"xcab","_k":"1cce0b43"},{"t":"It stays 2","_n":"ycbb","_k":"33566b49"},{"t":"It increases","_n":"zccb","_k":"0c6dfd14"}],"explain":"A point far to the right of \u003ci>x̄\u003c/i> has a lot of leverage. Raising it tilts the line up: the slope becomes 2.4."},{"id":"p4","prompt":"This new point lies exactly on \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10. What happens to the least-squares line?","options":[{"t":"The intercept decreases","_n":"10cdb","_k":"6cf9c9af"},{"t":"The slope increases","_n":"11ceb","_k":"507a91d7"},{"t":"It doesn’t change","_n":"12cfb","_k":"3522a590"},{"t":"It no longer passes through the point of means","_n":"13d0c","_k":"f6a5a052"}],"explain":"A point with residual 0 adds nothing to the sum of squares, and the old line still balances every residual. The point of means moves to (27.5, 65), which is still on the line."}],"chalIntro":"Use the fit duel to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Data A: drag your own line so that its sum of squared residuals is \u003cstrong>below 20\u003c/strong>.","why":"Any line with a sum of squared residuals below 20 works. The least-squares line’s 16 is the smallest possible.","hints":["Look at the squares: which ones are biggest?","Try passing through (25, 60), the point of means.","\u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10 gives 16."]},{"id":"tc2","goal":5,"prompt":"Edit points mode, data A: drag \u003cstrong>only the 35 °C point\u003c/strong> so that the least-squares slope is \u003cstrong>exactly 2.4\u003c/strong>.","why":"Raising the 35 °C point by 10 adds (35 − 25) × 10 = 100 to Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>): 600 ÷ 250 = 2.4.","hints":["Slope = Σ(\u003ci>x\u003c/i> − 25)·\u003ci>y\u003c/i> ÷ 250 here, because Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)² = 250.","Raising the 35 °C point by \u003ci>k\u003c/i> adds (35 − 25)\u003ci>k\u003c/i> = 10\u003ci>k\u003c/i> to the top. You need the top to go from 500 to 600.","\u003ci>k\u003c/i> = 10: move it to 90."]},{"id":"tc3","goal":[1,5],"stretch":true,"prompt":"Data A, original points: \u003cstrong>add one point\u003c/strong> so that the least-squares line \u003cstrong>does not change at all\u003c/strong>.","why":"A point on \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10 has residual 0, so the old line still balances every residual and keeps the same sum of squares. Any point on the line works, such as (25, 60), (40, 90) or (5, 20).","hints":["Which point would have a residual of 0?","If the new residual is 0, the old line still balances the residuals and keeps the same SSR.","Put it on \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10, e.g. (40, 90)."]}]},"part3":{"slug":"extrapolation","name":"Predictions","heading":"Predictions with care","intro":"A regression line will give you a number for any \u003ci>x\u003c/i>. Your job now is to judge whether that number deserves trust. Visit each station, move the probe and watch the trust m&#101;ter.","stations":[{"id":"s1","title":"Inside or outside?","text":"Data A (kiosk): \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10, from days between 15 °C and 35 °C. Move the probe, or tap a temperature."},{"id":"s2","title":"Growing up","text":"Children’s heights at ages 2, 4, 6, 8 and 10 lie close to \u003ci>ŷ\u003c/i> = 6\u003ci>x\u003c/i> + 80 (cm). Predict age 7, then age 30."},{"id":"s3","title":"Does the intercept mean anything?","text":"The intercept is the prediction at \u003ci>x\u003c/i> = 0. For each model, tap \u003cstrong>Meaningful\u003c/strong> or \u003cstrong>Just positions the line\u003c/strong>.","cards":[{"id":"c1","t":"Data C (taxi): \u003ci>ŷ\u003c/i> = 1.85\u003ci>x\u003c/i> + 4.9, trips of 2–10 km. \u003ci>b\u003c/i> = 4.9 is the fare for a 0 km trip.","_a":"FVRWBFxD","why":"A $4.90 base fare before any distance is driven makes sense, and 0 km is close to the data.","wrong":"Here a 0 km trip makes sense and is near the 2–10 km data: $4.90 is a sensible base fare."},{"id":"c2","t":"Data B (sleep): \u003ci>ŷ\u003c/i> = −13\u003ci>x\u003c/i> + 378, nights of 4–8 h. \u003ci>b\u003c/i> = 378 ms is the reaction time after 0 hours of sleep.","_a":"FUlcFhA=","why":"0 h of sleep is far outside the 4–8 h data, so 378 ms isn’t meaningful. \u003ci>x\u003c/i> = 0 may be far outside the data or impossible; then the intercept just positions the line.","wrong":"0 h is far outside the 4–8 h data. \u003ci>x\u003c/i> = 0 may be far outside the data or impossible; then the intercept just positions the line."}]}],"quickCheck":{"title":"Quick check","summary":"Predictions with care quick check","items":[{"id":"q1","goal":4,"prompt":"Data B: predict reaction time at 6.5 h of sleep.","choices":[{"t":"284.5 ms","fb":"−13(6.5) + 378 = 293.5.","_n":"14cfc","_k":"b221a5b6"},{"t":"291 ms","fb":"−13(6.5) + 378 = 293.5.","_n":"15d2c","_k":"dd30b00e"},{"t":"300 ms","fb":"−13(6.5) + 378 = 293.5.","_n":"16d1c","_k ary":"Spot the error","student":"Sunita","how":"","goal":[2,6],"instruction":"Sunita made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find the least-squares line for (1, 4), (2, 5), (3, 8), (4, 9), (5, 9).","steps":["\u003ci>x̄\u003c/i> = 3, \u003ci>ȳ\u003c/i> = 35 ÷ 5 = 7.","Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>) = (−2)(−3) + (−1)(−2) + 0 + (1)(2) + (2)(2) = 14.","Σ(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>)² = 9 + 4 + 1 + 4 + 4 = 22, so \u003ci>m\u003c/i> = 14 ÷ 22 ≈ 0.64.","\u003ci>b\u003c/i> = 7 − 0.64(3) ≈ 5.09."],"_a":"BQ==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","","Step 4 uses step 3’s slope. The mistake is earlier."],"fixes":[{"t":"Step 3 is correct.","why":"The bottom of the slope formula uses only \u003ci>x\u003c/i>. Slope = Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>) ÷ Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)². The bottom only uses \u003ci>x\u003c/i>.","_n":"1kcdc","_k":"dd342a7f"},{"t":"Divide by Σ\u003ci>x\u003c/i> = 15.","why":"Use squared deviations of \u003ci>x\u003c/i>.","_n":"1ld2c","_k":"bfcf1197"},{"t":"Divide by 5, the number of points: \u003ci>m\u003c/i> = 2.8.","why":"That’s not the formula.","_n":"1md3c","_k":"331c1acf"},{"t":"Divide by Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)² = 4 + 1 + 0 + 1 + 4 = 10: \u003ci>m\u003c/i> = 1.4, \u003ci>b\u003c/i> = 7 − 4.2 = 2.8.","why":"The bottom of the slope formula is Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)²: \u003ci>ŷ\u003c/i> = 1.4\u003ci>x\u003c/i> + 2.8.","_n":"1ne4c","_k":"93b9ac6b"}],"hints":["What is in the denominator of the slope formula?","Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)² = 10.","\u003ci>ŷ\u003c/i> = 1.4\u003ci>x\u003c/i> + 2.8."]},{"id":"e2","goal":6,"task":"Use \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10 (data A, 15–35 °C) to plan for a 50 °C heat warning.","steps":["The model fits well: \u003ci>r\u003c/i> = 0.992.","\u003ci>ŷ\u003c/i> = 2(50) + 10 = 110 drinks.","Because the fit is so strong, 110 is a reliable prediction.","So order exactly 110 cups."],"_a":"BQ==","stepFb":["Step 1 is correct: it fits well inside 15–35 °C.","The arithmetic is correct.","","Step 4 follows step 3. The mistake is earlier."],"fixes":[{"t":"Round up to 120 to be safe.","why":"The issue is extrapolation, not rounding.","_n":"1oe3c","_k":"a9004bd6"},{"t":"Use \u003ci>r\u003c/i>² instead: 0.984 × 110 ≈ 108.","why":"\u003ci>r\u003c/i>² doesn’t adjust predictions.","_n":"1pe2c","_k":"0e88ed04"},{"t":"Step 3 is correct.","why":"A strong fit inside the data says nothing about outside it.","_n":"1qe1c","_k":"fd09b7b6"},{"t":"50 °C is far outside 15–35 °C. This is extrapolation; the pattern may not hold, so treat 110 with caution.","why":"The data only tell us about \u003ci>x\u003c/i> between the smallest and largest values. Beyond that, the pattern may change.","_n":"1re0c","_k":"40c79c4b"}],"hints":["What \u003ci>x\u003c/i>-values were in the data?","15 to 35 °C.","50 is extrapolation."]}]}]},"reflect":{"journal":[{"id":"j1","q":"In the fit duel, how close did your own line get to 16? What did the squares teach you that the points alone didn’t?"},{"id":"j2","q":"In your own words, what does ‘least squares’ mean, and why must the line pass through (\u003ci>x̄\u003c/i>, \u003ci>ȳ\u003c/i>)?"},{"id":"j3","q":"Explain to a friend how to find a regression line from \u003ci>x̄\u003c/i>, \u003ci>ȳ\u003c/i>, \u003ci>s\u003c/i>\u003csub>\u003ci>x\u003c/i>\u003c/sub>, \u003ci>s\u003c/i>\u003csub>\u003ci>y\u003c/i>\u003c/sub> and \u003ci>r\u003c/i>."},{"id":"j4","q":"Describe a real situation where an extrapolated prediction could cause harm. What would you do instead?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"The least-squares line is the line that…","options":[{"t":"makes the sum of the squared residuals as ore drinks per °C.","why":"10 is the intercept. Slope is the predicted \u003cstrong>change\u003c/strong> in \u003ci>y\u003c/i> for each increase of 1 in \u003ci>x\u003c/i>, with both units.","_n":"235cc","_k":"00d90eef"}]},"b":{"prompt":"For \u003ci>ŷ\u003c/i> = 1.85\u003ci>x\u003c/i> + 4.9 (taxi fare in $ vs km), the intercept means…","options":[{"t":"the fare rises $4.90 per km.","why":"The rate per km is the slope, 1.85. Slope is the predicted \u003cstrong>change\u003c/strong> in \u003ci>y\u003c/i> for each increase of 1 in \u003ci>x\u003c/i>, with both units.","_n":"245dc","_k":"3611463f"},{"t":"nothing, because intercepts are never meaningful.","why":"Here \u003ci>x\u003c/i> = 0 makes sense.","_n":"2556c","_k":"7bc8e18c"},{"t":"about $4.90 is charged before any distance is driven","why":"At \u003ci>x\u003c/i> = 0 km the model gives $4.90, a sensible base fare.","_n":"2657c","_k":"bc46dabd"},{"t":"a 1 km trip costs $4.90.","why":"A 1 km trip costs about $6.75.","_n":"27c8d","_k":"ed999bef"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Use \u003ci>ŷ\u003c/i> = −13\u003ci>x\u003c/i> + 378 (reaction time in ms vs hours of sleep, data 4–8 h) to predict for 6.5 h.","options":[{"t":"284.5 ms","why":"−13 × 6.5 = −84.5, not −93.5.","_n":"28c7d","_k":"50f957d3"},{"t":"462.5 ms","why":"The slope is negative: subtract 84.5.","_n":"29cad","_k":"673c22ec"},{"t":"300 ms","why":"That’s the mean, not the prediction at 6.5 h.","_n":"2ac9d","_k":"872ab0fc"},{"t":"293.5 ms","why":"−84.5 + 378.","_n":"2bccd","_k":"775fd996"}]},"b":{"prompt":"Use \u003ci>ŷ\u003c/i> = 1.85\u003ci>x\u003c/i> + 4.9 to predict the fare for 6 km.","options":[{"t":"$11.10","why":"Add the 4.90.","_n":"2ccbd","_k":"374e3259"},{"t":"$15.85","why":"1.85 × 6 = 11.10.","_n":"2dced","_k":"bbf4cd9d"},{"t":"$16.00","why":"11.10 + 4.90.","_n":"2ecdd","_k":"8c55b8e2"},{"t":"$40.50","why":"That multiplies 6 by the 1 km fare, $6.75; the base fare is only paid once.","_n":"2fd0d","_k":"6b982abf"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"\u003ci>x̄\u003c/i> = 20, \u003ci>ȳ\u003c/i> = 50, \u003ci>s\u003c/i>\u003csub>\u003ci>x\u003c/i>\u003c/sub> = 5, \u003ci>s\u003c/i>\u003csub>\u003ci>y\u003c/i>\u003c/sub> = 10, \u003ci>r\u003c/i> = 0.8. Find the least-squares line.","options":[{"t":"\u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10","why":"Multiply by \u003ci>r\u003c/i>. Slope = \u003ci>r\u003c/i> × (spread of \u003ci>y\u003c/i>) ÷ (spread of \u003ci>x\u003c/i>): rise over run.","_n":"2gcfd","_k":"4fecdfe1"},{"t":"\u003ci>ŷ\u003c/i> = 1.6\u003ci>x\u003c/i> + 50","why":"\u003ci>b\u003c/i> = \u003ci>ȳ\u003c/i> − \u003ci>m\u003c/i>\u003ci>x̄\u003c/i>, not \u003ci>ȳ\u003c/i>.","_n":"2h62d","_k":"e33b6469"},{"t":"\u003ci>ŷ\u003c/i> = 1.6\u003ci>x\u003c/i> + 18","why":"\u003ci>m\u003c/i> = 0.8 × 10 ÷ 5 = 1.6; \u003ci>b\u003c/i> = 50 − 1.6(20) = 18.","_n":"2i63d","_k":"ab2cf30a"},{"t":"\u003ci>ŷ\u003c/i> = 0.4\u003ci>x\u003c/i> + 42","why":"\u003ci>s\u003c/i>\u003csub>\u003ci>y\u003c/i>\u003c/sub> goes on top. Slope = \u003ci>r\u003c/i> × (spread of \u003ci>y\u003c/i>) ÷ (spread of \u003ci>x\u003c/i>): rise over run.","_n":"2j60d","_k":"6bc5e9e9"}]},"b":{"prompt":"\u003ci>x̄\u003c/i> = 10, \u003ci>ȳ\u003c/i> = 70, \u003ci>s\u003c/i>\u003csub>\u003ci>x\u003c/i>\u003c/sub> = 4, \u003ci>s\u003c/i>\u003csub>\u003ci>y\u003c/i>\u003c/sub> = 12, \u003ci>r\u003c/i> = −0.6. Find the least-squares line.","options":[{"t":"\u003ci>ŷ\u003c/i> = −0.2\u003ci>x\u003c/i> + 72","why":"Slope = \u003ci>r\u003c/i> × (spread of \u003ci>y\u003c/i>) ÷ (spread of \u003ci>x\u003c/i>): rise over run.","_n":"2k61d","_k":"e113989d"},{"t":"\u003ci>ŷ\u003c/i> = −1.8\u003ci>x\u003c/i> + 88","why":"\u003ci>m\u003c/i> = −0.6 × 12 ÷ 4 = −1.8; \u003ci>b\u003c/i> = 70 + 18 = 88.","_n":"2l5ed","_k":"15952f34"},{"t":"\u003ci>ŷ\u003c/i> = −3\u003ci>x\u003c/i> + 100","why":"Multiply by \u003ci>r\u003c/i>. Slope = \u003ci>r\u003c/i> × (spread of \u003ci>y\u003c/i>) ÷ (spread of \u003ci>x\u003c/i>): rise over run.","_n":"2m5fd","_k":"0d1c4a79"},{"t":"\u003ci>ŷ\u003c/i> = −1.8\u003ci>x\u003c/i> + 52","why":"\u003ci>b\u003c/i> = 70 − (−1.8)(10) = 88.","_n":"2n5cd","_k":"daf4a297"}]}},{"id":"t2","cat":"T","goal":2,"a":{"prompt":"Find the least-squares line for (1, 3), (2, 7), (3, 5), (4, 11), (5, 9).","options":[{"t":"\u003ci>ŷ\u003c/i> = 1.6\u003ci>x\u003c/i> + 7","why":"\u003ci>b\u003c/i> = \u003ci>ȳ\u003c/i> − \u003ci>m\u003c/i>\u003ci>x̄\u003c/i> = 7 − 4.8.","_n":"2o5dd","_k":"adac5fad"},{"t":"\u003ci>ŷ\u003c/i> = 0.4\u003ci>x\u003c/i> + 5.8","why":"Divide by Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)² = 10, not Σ(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>)² = 40.","_n":"2p5ad","_k":"65281d47"},{"t":"\u003ci>ŷ\u003c/i> = 1.6\u003ci>x\u003c/i> + 2.2","why":"Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>) = 16, Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)² = 10, \u003ci>b\u003c/i> = 7 − 4.8.","_n":"2q5bd","_k":"023d195e"},{"t":"\u003ci>ŷ\u003c/i> = 1.5\u003ci>x\u003c/i> + 2.5","why":"That line passes through (3, 7), but its slope isn’t the least-squares slope.","_n":"2ra0d","_k":"0b7be8a4"}]},"b":{"prompt":"Find the least-squares line for (2, 5), (4, 9), (6, 8), (8, 14), (10, 14).","options":[{"t":"\u003ci>ŷ\u003c/i> = 0.74\u003ci>x\u003c/i> + 5.5","why":"The bottom is Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)² = 40, not Σ(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>)² = 62.","_n":"2sa1d","_k":"2a31d2f0"},{"t":"\u003ci>ŷ\u003c/i> = 1.125\u003ci>x\u003c/i> + 2.75","why":"That line joins the first and last points. The best line is judged by all the residuals together. The least-squares line has the smallest sum of squared residuals.","_n":"2t9ed","_k":"f52b1703"},{"t":"\u003ci>ŷ\u003c/i> = 1.15\u003ci>x\u003c/i> + 10","why":"\u003ci>b\u003c/i> = \u003ci>ȳ\u003c/i> − \u003ci>m\u003c/i>\u003ci>x̄\u003c/i>.","_n":"2u9fd","_k":"25c01735"},{"t":"\u003ci>ŷ\u003c/i> = 1.15\u003ci>x\u003c/i> + 3.1","why":"Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)(\u003ci>y\u003c/i> − \u003ci>ȳ\u003c/i>) = 46, Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)² = 40, \u003ci>b\u003c/i> = 10 − 6.9.","_n":"2va4d","_k":"3801aa97"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Every \u003ci>y\u003c/i>-value in a data set increases by 5. How does the least-squares line change?","options":[{"t":"The slope increases by 5.","why":"Shifting up doesn’t tilt the line.","_n":"2wa5d","_k":"26b50918"},{"t":"Same slope; the intercept increases by 5","why":"Every point and prediction moves up 5.","_n":"2xa2d","_k":"2dea6e5b"},{"t":"Both slope and intercept increase by 5.","why":"The slope is unchanged.","_n":"2ya3d","_k":"af4ae504"},{"t":"It doesn’t change.","why":"The points moved, so the line moves too.","_n":"2za8d","_k":"6cfc1f34"}]},"b":{"prompt":"A new point is added exactly on the current least-squares line. What happens to the line?","options":[{"t":"The intercept becomes 0.","why":"No reason for that.","_n":"30a9d","_k":"c300b384"},{"t":"It must now pass through the new point and the old means.","why":"It already does; nothing changes.","_n":"31a6d","_k":"cd41717e"},{"t":"It stays the same","why":"Its residual is 0, so the old line still balances every residual.","_n":"32a5d","_k":"55348e09"},{"t":"The slope increases.","why":"Only points off the line can tilt it.","_n":"33a8d","_k":"a157955e"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why the least-squares line is called the line of best fit?","options":[{"t":"“It always has \u003ci>r\u003c/i> = 1.”","why":"\u003ci>r\u003c/i> describes the data, not the line.","_n":"34a7d","_k":"d865215e"},{"t":"“It goes through as many points as possible.”","why":"The best line is judged by all the residuals together. The least-squares line has the smallest sum of squared residuals.","_n":"35a2d","_k":"c9043d9e"},{"t":"“Of all possible lines, it has the smallest total of squared vertical distances from the points to the line.”","why":"Least squares judges a line by all the squared vertical misses together.","_n":"36a1d","_k":"9c6e3d69"},{"t":"“It has the smallest total of perpendicular distances to the points.”","why":"Residuals are vertical. Residuals are \u003cstrong>vertical\u003c/strong>: observed \u003ci>y\u003c/i> − predicted \u003ci>y\u003c/i>. We’re predicting \u003ci>y\u003c/i>.","_n":"37a4d","_k":"cc6179ae"}]},"b":{"prompt":"Which is the best description of a residual?","options":[{"t":"“The difference between \u003ci>x\u003c/i> and \u003ci>x̄\u003c/i>.”","why":"That’s a deviation, not a residual.","_n":"38a3d","_k":"387af64e"},{"t":"“The predicted \u003ci>y\u003c/i> minus the observed \u003ci>x\u003c/i>.”","why":"Residuals are \u003cstrong>vertical\u003c/strong>: observed \u003ci>y\u003c/i> − predicted \u003ci>y\u003c/i>. We’re predicting \u003ci>y\u003c/i>.","_n":"39aed","_k":"ce08146d"},{"t":"“The shortest distance from the point to the line.”","why":"Residuals are \u003cstrong>vertical\u003c/strong>: observed \u003ci>y\u003c/i> − predicted \u003ci>y\u003c/i>. We’re predicting \u003ci>y\u003c/i>.","_n":"3aadd","_k":"7ea02cd4"},{"t":"“The observed \u003ci>y\u003c/i> minus the predicted \u003ci>y\u003c/i> for that point’s \u003ci>x\u003c/i>.”","why":"A residual is a vertical miss: observed − predicted.","_n":"3b34d","_k":"2e20a092"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"The model \u003ci>ŷ\u003c/i> = 5.6\u003ci>x\u003c/i> + 47.2 links hours studied (1–5 h) to test score (%). Which statement is correct?","options":[{"t":"“47.2% is guaranteed for anyone who doesn’t study.”","why":"A prediction is never a guarantee, and 0 h is outside the data. \u003ci>x\u003c/i> = 0 may be far outside the data or impossible; then the intercept just positions the line.","_n":"3c35d","_k":"f31a970d"},{"t":"“Each hour adds 47.2 points.”","why":"Slope is the predicted \u003cstrong>change\u003c/strong> in \u003ci>y\u003c/i> for each increase of 1 in \u003ci>x\u003c/i>, with both units.","_n":"3d36d","_k":"bff63a1d"},{"t":"“Each extra hour of study predicts about 5.6 more percentage points; 47.2 is the predicted score for 0 hours, just outside the data, so use it with care.”","why":"The slope is a rate with both units, and the intercept is a prediction at 0 h, just outside 1–5 h.","_n":"3e37d","_k":"25f1321a"},{"t":"“Studying 1 hour gives a score of 5.6%.”","why":"Slope is the predicted \u003cstrong>change\u003c/strong> in \u003ci>y\u003c/i> for each increase of 1 in \u003ci>x\u003c/i>, with both units.","_n":"3f30d","_k":"7f756765"}]},"b":{"prompt":"The model \u003ci>ŷ\u003c/i> = −13\u003ci>x\u003c/i> + 378 links hours of sleep (4–8 h) to reaction time (ms). Which statement is correct?","options":[{"t":"“Each hour of sleep slows reactions by 13 ms.”","why":"Negative slope: faster.","_n":"3g31d","_k":"97133dcd"},{"t":"“Each extra hour of sleep predicts a reaction about 13 ms faster; 378 ms at 0 hours is far outside the data and not meaningful.”","why":"Negative slope: faster reactions with more sleep; 0 h is far outside 4–8 h.","_n":"3h32d","_k":"dc707dba"},{"t":"“Reaction time is 13 ms after 1 hour of sleep.”","why":"Slope is the predicted \u003cstrong>change\u003c/strong> in \u003ci>y\u003c/i> for each increase of 1 in \u003ci>x\u003c/i>, with both units.","_n":"3i33d","_k":"59f75d1d"},{"t":"“With no sleep, reaction time will be 378 ms.”","why":"\u003ci>x\u003c/i> = 0 may be far outside the data or impossible; then the intercept just positions the line.","_n":"3j2cd","_k":"33added5"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"For used cars of one model, value (thousands of $) vs age (years, 1–8) fits \u003ci>ŷ\u003c/i> = −2.5\u003ci>x\u003c/i> + 30. Predict the value of a 4-year-old car.","options":[{"t":"$10 000","why":"That’s the drop, not the value.","_n":"3k2dd","_k":"9aeb8df7"},{"t":"$20 000","why":"−10 + 30 = 20 (thousand).","_n":"3l3ad","_k":"23e23acd"},{"t":"$27 500","why":"−2.5 × 4 = −10.","_n":"3m39d","_k":"4e4140bb"},{"t":"$40 000","why":"The slope is negative: subtract.","_n":"3n38d","_k":"196472b5"}]},"b":{"prompt":"Phone battery (%) vs minutes of video (0–200) fits \u003ci>ŷ\u003c/i> = −0.4\u003ci>x\u003c/i> + 100. After how many minutes does the model predict 20%?","options":[{"t":"200 minutes","why":"20 = −0.4\u003ci>x\u003c/i> + 100, so \u003ci>x\u003c/i> = 200.","_n":"3o37d","_k":"1d28d5b0"},{"t":"300 minutes","why":"−0.4 × 300 = −120: that gives −20%.","_n":"3p36d","_k":"8f533301"},{"t":"92 minutes","why":"That’s the battery after 20 minutes: −0.4(20) + 100 = 92.","_n":"3q35d","_k":"06c931b3"},{"t":"50 minutes","why":"Solve −0.4\u003ci>x\u003c/i> = −80.","_n":"3r34d","_k":"e2f96d15"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"Children’s heights (ages 2–10) fit \u003ci>ŷ\u003c/i> = 6\u003ci>x\u003c/i> + 80 cm with \u003ci>r\u003c/i> = 0.99. Someone predicts an adult height at age 30 of 260 cm. What is the best judgement?","options":[{"t":"Use the intercept instead: 80 cm.","why":"\u003ci>x\u003c/i> = 0 may be far outside the data or impossible; then the intercept just positions the line.","_n":"3s33d","_k":"e022f32b"},{"t":"Don’t trust it: age 30 is far outside the data, and growth stops","why":"The data only tell us about \u003ci>x\u003c/i> between the smallest and largest values. Beyond that, the pattern may change.","_n":"3t32d","_k":"6635a846"},{"t":"Trust it, because \u003ci>r\u003c/i> = 0.99.","why":"A strong fit inside the data says nothing about outside it.","_n":"3u31d","_k":"d8ef9fcb"},{"t":"Trust it, but round to 250 cm.","why":"Rounding doesn’t fix extrapolation.","_n":"3v28c","_k":"79d83653"}]},"b":{"prompt":"Kiosk sales fit \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 10 for 15–35 °C. The manager uses it to predict sales on a 0 °C day: 10 drinks. What is the best judgement?","options":[{"t":"Double it to be safe.","why":"The issue is extrapolation.","_n":"3w29c","_k":"79d6c067"},{"t":"Don’t trust it: 0 °C is outside 15–35 °C, and the pattern may not hold","why":"The data only tell us about \u003ci>x\u003c/i> between the smallest and largest values. Beyond that, the pattern may change.","_n":"3x26c","_k":"c892e730"},{"t":"Trust it: the line passes through (\u003ci>x̄\u003c/i>, \u003ci>ȳ\u003c/i>).","why":"That’s true for any least-squares line and says nothing about 0 °C.","_n":"3y27c","_k":"a6ecc8a7"},{"t":"Trust it: the intercept gives sales at 0 °C.","why":"\u003ci>x\u003c/i> = 0 may be far outside the data or impossible; then the intercept just positions the line.","_n":"3z24c","_k":"526059ab"}]}}]},"task":{"title":"Hit the target line","summary":"Hit the target line","statement":"\u003cp>Choose \u003ci>y\u003c/i>-values for \u003ci>x\u003c/i> = 1, 2, 3, 4, 5 so that the least-squares line is exactly \u003ci>ŷ\u003c/i> = 2\u003ci>x\u003c/i> + 1, but the points are not all on it. Can you find all the answers?\u003c/p>\u003col class=\"lr-conds\">\u003cli>Least-squares slope is exactly 2.\u003c/li>\u003cli>Least-squares intercept is exactly 1.\u003c/li>\u003cli>No residual is bigger than 1 in size.\u003c/li>\u003cli>At least one point is off the line.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Each \u003ci>y\u003c/i> is a whole number from 0 to 12.\u003c/p>","checks":["Slope 2","Intercept 1","No residual bigger than 1","Not all on the line"],"tips":["The slope depends on Σ(\u003ci>x\u003c/i> − 3)·\u003ci>y\u003c/i>. Points left of 3 count negatively and points right of 3 count positively.","The line passes through (\u003ci>x̄\u003c/i>, \u003ci>ȳ\u003c/i>) = (3, \u003ci>ȳ\u003c/i>). For intercept 1 you need \u003ci>ȳ\u003c/i> = 7, so the \u003ci>y\u003c/i>’s add to 35.","Start from the line’s own values 3, 5, 7, 9, 11, then move points up or down by 1.","The residuals must add to 0 \u003cstrong>and\u003c/strong> balance left vs right."],"explainPrompt":"Explain how you made the slope exactly 2 and the intercept exactly 1 while moving points off the line.","vocab":"Use the words residual, least squares, point of means and slope.","more":"There’s more than one answer. Can you find t
