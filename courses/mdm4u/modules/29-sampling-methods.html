.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 29: Sampling lab (D12 400-dot school, histogram of sample proportions), Margins of error stations and polls panel,
   Plan it (numEntry), Town survey map. Chosen dots --pen, others --ink-2; parameter line teal --f3 (plan §5). */
/* radioGroup (from MDM4U 19 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* Sampling lab: the school grid */
.sm-cap{font-size:clamp(1.1rem,2.4vw,1.4rem)}
.sm-gridwrap{max-width:520px;margin:0 auto}
.sm-svg{display:block;width:100%;height:auto}
.sm-band{stroke:none}
.sm-b0{fill:var(--ev-a-soft)}.sm-b1{fill:var(--ev-b-soft)}.sm-b2{fill:var(--ev-c-soft)}.sm-b3{fill:var(--hi-soft)}
.sm-gl{font:700 9px var(--font-ui);fill:var(--ink);text-anchor:end;dominant-baseline:middle}
.sm-rn{font:7px var(--font-ui);fill:var(--ink-2);dominant-baseline:middle}
.sm-d{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.3}
.sm-d.sp{fill:var(--ink-2)}
.sm-d.on{stroke:var(--pen);stroke-width:2.2}
.sm-d.sp.on{fill:var(--pen)}
.sm-legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:6px 0 10px}
.sm-key{display:inline-flex;align-items:center;gap:5px}
.sm-key svg{width:13px;height:13px}
.sm-kf{fill:var(--ink-2)}.sm-kr{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.4}.sm-kon{fill:var(--pen)}
/* statistic bar */
.sm-bar{margin:4px 0 12px}
.sm-brow{display:flex;align-items:center;gap:10px}
.sm-blab{font-weight:700;font-size:.9rem;flex:none}
.sm-track{position:relative;flex:1;height:22px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--paper)}
.sm-fill{position:absolute;left:0;top:0;bottom:0;background:var(--pen);transition:width .45s}
.sm-par{position:absolute;top:-6px;bottom:-6px;border-left:3px dashed var(--f3);margin-left:-1.5px}
.sm-bval{font:700 1.1rem var(--font-math);min-width:4.2em;text-align:right}
.sm-scale{position:relative;display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-2);margin:4px 4.9em 0 6.6em}
.sm-pl{position:absolute;top:0;transform:translateX(-50%);color:var(--f3);font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.sm-fill{transition:none}}
.sm-histbox{margin:6px 0 0}
canvas.plot.sm-hist{aspect-ratio:16/9}
.sm-aha{margin:10px 0 0;font-size:.95rem}
.sm-about{margin-top:12px}
.sm-q{font-weight:700}
/* controls */
.sm-slider{margin:6px 0 10px}
.sm-note{margin:6px 0 10px}
.sm-set{border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;margin:0 0 10px;background:var(--sheet)}
.sm-set > summary{font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);cursor:pointer;min-height:32px;display:list-item}
.sm-step{display:flex;align-items:center;gap:6px;margin:6px 0}
.sm-sl{min-width:4.8em;font-weight:700;font-size:.9rem}
.sm-stb{min-width:38px;min-height:36px;padding:0 .5em}
.sm-spin{display:inline-block;min-width:3em;text-align:center;font:600 1.1rem var(--font-math);border:1.5px solid var(--rule);border-radius:6px;padding:.2em .4em}
.sm-spin:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.sm-rooms{display:grid;gap:6px;margin:4px 0}
.sm-rrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.sm-rl{min-width:3.2em;font-weight:700;font-size:.85rem;color:var(--ink-2)}
.sm-room{min-width:38px;min-height:36px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font-weight:600}
.sm-room[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.sm-room:disabled{opacity:.45;cursor:not-allowed}
.sm-btns{flex-wrap:wrap}

/* Margins of error */
.mo-body{margin-top:8px}
.mo-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.mo-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.mo-text{margin:0 0 10px}
.mo-sent{font-size:1.05rem;line-height:2.4}
.mo-blank{min-width:4.5em;min-height:36px;border:0;border-bottom:2.5px solid var(--ink-2);background:var(--paper);color:var(--ink);font-weight:700;padding:0 .5em;border-radius:4px 4px 0 0}
.mo-blank.sel{border-bottom-color:var(--pen);background:var(--hi-soft);outline:2px solid var(--pen)}
.mo-bank{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.mo-q{font-weight:700;margin:12px 0 6px}
.mo-opts{display:flex;flex-wrap:wrap;gap:8px}
.mo-opt{text-align:left;white-space:normal;min-height:40px}
.mo-opt.right{border-color:var(--green);background:var(--good-bg)}
.mo-sl{margin:6px 0 10px}
.mo-tick{color:var(--green)}
.mo-iv{display:block;width:100%;max-width:440px;height:auto}
.mo-ov{fill:var(--hi-soft)}
.mo-ivl{stroke:var(--pen);stroke-width:3}
.mo-ivd{fill:var(--pen)}
.mo-ivt{font:700 12px var(--font-ui);fill:var(--ink)}
.mo-ivs{font:600 10px var(--font-ui);fill:var(--ink)}
.mo-ax{stroke:var(--ink-2);stroke-width:1.3}
.mo-axt{font:10px var(--font-ui);fill:var(--ink-2)}
.mo-data{margin-top:14px}
.mo-pv{display:block;width:100%;max-width:520px;height:auto}
.mo-pl{stroke-width:2.6}
.mo-pl.in{stroke:var(--pen)}.mo-pl.out{stroke:var(--red)}
.mo-pd.in{fill:var(--pen)}.mo-pd.out{fill:var(--red)}
.mo-px{font:700 9px var(--font-ui);fill:var(--red)}
.mo-pt{stroke:var(--f3);stroke-width:2.4}
.mo-card tbody tr.hi td{background:var(--hi-soft)}

/* Plan it (numEntry, from MDM4U 20) */
.ne-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin:8px 0}
.ne-lab{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
.ne-in{width:8rem}
.ne-ch{display:flex;flex-direction:column;gap:6px;width:100%}
.ne-l{font-weight:700;font-size:.9rem}
.ne-chips{display:flex;flex-wrap:wrap;gap:6px}
.ne-c{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.3em .85em;font-size:.9rem;min-height:36px;text-align:left;white-space:normal}
.ne-c[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ne-c:disabled{cursor:default}

/* Town survey */
.ts-conds{margin:6px 0 10px}
.ts-in{display:grid;gap:8px;margin:0 0 12px}
.ts-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ts-l{min-width:9.5em;font-weight:700}
.ts-ctl{display:inline-flex;align-items:center;gap:6px}
.ts-num{width:6rem}
.ts-stb{min-width:38px;min-height:36px;padding:0 .5em}
.ts-how{margin-top:6px}
canvas.plot.ts-map{aspect-ratio:5/3}

 Very different answer.","shape":"wide"}},"goals":["I can distinguish a population, a sample, a census, a parameter and a statistic.","I can identify and describe sampling methods: simple random, systematic, stratified, cluster, multi-stage, convenience and voluntary response.","I can set up a stratified or systematic sample (stratum sizes, interval and start).","I can classify data: quantitative or qualitative, discrete or continuous, nominal or ordinal, primary or secondary.","I can explain what makes a good sample, and the roles of randomization, replication and control.","I can interpret a margin of error and a confidence level, and explain how sample size affects them."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Percents and proportions","goal":1,"prompt":"186 of a school’s 400 students play a school sport. What percent is that?","options":[{"t":"18.6%","why":"Divide by 400.","_n":"0395","_k":"e2940bc3"},{"t":"53.5%","why":"That’s the percent who don’t play.","_n":"13a5","_k":"67e1ef96"},{"t":"2.15%","why":"Part ÷ whole.","_n":"23b5","_k":"1b3e8e42"},{"t":"46.5%","why":"186 ÷ 400 = 0.465.","_n":"3345","_k":"b04454da"}],"hints":["Part ÷ whole.","186 ÷ 400.","0.465 = 46.5%."]},{"id":"w2","skill":"Percents and proportions","goal":3,"prompt":"Grade 9 students make up 30% of a school. In a sample of 40 that matches the school’s proportions, how many should be in Grade 9?","options":[{"t":"4","why":"0.30 × 40 = 12.","_n":"4355","_k":"a4b8cc8b"},{"t":"9","why":"Grade 9 is a label, not a count.","_n":"5365","_k":"a83cd825"},{"t":"12","why":"30% of 40.","_n":"6375","_k":"8c507204"},{"t":"30","why":"30% of 40, not 30.","_n":"7405","_k":"46f5ca00"}],"hints":["Find 30% of the sample size.","0.30 × 40.","12."]},{"id":"w3","skill":"Random selection","goal":5,"prompt":"Which method gives every one of 400 students the same chance of being chosen for a sample of 40?","options":[{"t":"Draw 40 names from a hat holding all 400 names","why":"Every name has the same chance.","_n":"8415","_k":"1ce5db5d"},{"t":"Ask 40 of your friends","why":"Friends are likely to be similar to you. Random means every member has a known chance, decided by a random process, not by convenience.","_n":"927a","_k":"1bee85e3"},{"t":"Ask the first 40 students into the cafeteria","why":"Early arrivals aren’t a random group. Random means every member has a known chance, decided by a random process, not by convenience.","_n":"a26a","_k":"0e51109e"},{"t":"Ask for 40 volunteers","why":"Volunteers choose themselves. Random means every member has a known chance, decided by a random process, not by convenience.","_n":"b25a","_k":"8f4551da"}],"hints":["Who decides who is chosen?","It should be a random process.","Names from a hat."]},{"id":"w4","skill":"Random selection","goal":3,"prompt":"Students are numbered 1 to 400, and a random number generator outputs 37. What does that mean for the sample?","options":[{"t":"Student number 37 on the list is chosen","why":"Each output picks one student.","_n":"c24a","_k":"97db97b1"},{"t":"Every 37th student is chosen","why":"That would be a systematic sample.","_n":"d23a","_k":"17cfd75a"},{"t":"37 students are chosen","why":"The number is an ID, not a count.","_n":"e22a","_k":"77f28ade"},{"t":"37% of students are chosen","why":"It’s an ID number.","_n":"f21a","_k":"0c8733f2"}],"hints":["What does each number stand for?","A position on the list.","Student 37 is in the sample."]},{"id":"w5","skill":"Types of data","goal":4,"prompt":"“Number of siblings” is which type of data?","options":[{"t":"Qualitative, ordinal","why":"It’s a count, not a ranked category.","_n":"g20a","_k":"c226e3be"},{"t":"Qualitative, nominal","why":"It’s a meaningful number you can average.","_n":"h1fa","_k":"8f601e46"},{"t":"Quantitative, discrete","why":"Counts: 0, 1, 2, …","_n":"i1ea","_k":"3244f5f7"},{"t":"Quantitative, continuous","why":"You can’t have 1.7 siblings.","_n":"j8da","_k":"ffa0dad5"}],"hints":["Is it a number you can do arithmetic with?","Yes: it’s a count.","Counts are discrete."]},{"id":"w6","skill":"Types of data","goal":4,"prompt":"A basketball player’s jersey number is which type of data?","options":[{"t":"Qualitative (a label)","why":"Jersey numbers name players; arithmetic on them means nothing.","_n":"k8ea","_k":"afb229ca"},{"t":"Quantitative, continuous","why":"Jersey numbers are labels: averaging them means nothing. They’re qualitative.","_n":"l8ba","_k":"9a3224b5"},{"t":"Quantitative, discrete","why":"Averaging jersey numbers tells you nothing. Jersey numbers are labels: averaging them means nothing. They’re qualitative.","_n":"m8ca","_k":"0125e66d"},{"t":"Ordinal","why":"Number 30 isn’t “more” than number 7.","_n":"n91a","_k":"aec5f977"}],"hints":["Would the average jersey number mean anything?","No.","So it’s a label: qualitative."]}],"refreshers":{"Percents and proportions":"Percent = part ÷ whole × 100. A proportional sample gives each group the same share of the sample as it has of the population: 30% of 40 is 12.","Random selection":"Random means the choice is made by a chance process (numbered lists, random number generators), so every member has a known chance. “Whoever is handy” isn’t random.","Types of data":"Quantitative data are numbers you can calculate with: discrete (counts) or continuous (measurements). Qualitative data are categories: nominal (no order) or ordinal (ordered)."}}},"explore":{"heading":"Sampling lab","intro":"Choose a sampling method, draw a sample from the school, and compare its statistic with the true parameter. Then draw many samples to see how much the statistic wobbles.","predIntro":"Make a prediction first. Then the sampling lab will show you what really happens.","predictions":[{"id":"p1","start":{"m":"conv","n":40},"prompt":"Method Convenience, `n = 40`. Compared with the true 46.5%, the gym sample’s percent of sport players will be…","options":[{"t":"much higher","_n":"o92a","_k":"33e08b5a"},{"t":"much lower","_n":"p8fa","_k":"2efc119d"},{"t":"exactly 46.5%","_n":"q90a","_k":"ca6f935d"},{"t":"about the same","_n":"r95a","_k":"fc027d57"}],"explain":"Sport players hang out in the gym. Then try `n = 100`: still about 72%. 500 gym-goers still aren’t typical adults. Size reduces random error, not bias."},{"id":"p2","start":{"m":"srs","n":100},"prompt":"Simple random, repeated mode. Sample size goes from 25 to 100. What happens to the spread of the 100 sample proportions?","options":[{"t":"It stays the same","_n":"s96a","_k":"1159d715"},{"t":"It shrinks to about half","_n":"t93a","_k":"f4b37ca0"},{"t":"It doubles","_n":"u92a","_k":"f1e1406f"},{"t":"It shrinks to about a quarter","_n":"v95a","_k":"d089ab0b"}],"explain":"Spread shrinks like `1/√n`: four times the sample, half the spread."},{"id":"p3","start":{"m":"sys","k":10,"s":3},"prompt":"Systematic, `n = 40`, start 3. Which students are chosen?","options":[{"t":"3, 13, 23, 33, …","_n":"w94a","_k":"a739a6bc"},{"t":"1, 2, 3, …, 40","_n":"x8fa","_k":"9aa453b5"},{"t":"40, 80, 120, …","_n":"y8ea","_k":"fef2d4d3"},{"t":"3, 6, 9, …","_n":"z91a","_k":"d0177c0b"}],"explain":"Interval = 400 ÷ 40 = 10; start at 3, then add 10 each time. Interval = population ÷ sample size; start at a random spot within the first interval."},{"id":"p4","start":{"m":"clus","rooms":2},"prompt":"Repeated mode: Cluster (2 homerooms) vs Simple random (`n = 40`). Which method’s results spread out more?","options":[{"t":"Neither varies","_n":"1090a","_k":"7ad5cd4f"},{"t":"Simple random","_n":"119ba","_k":"76fe7f00"},{"t":"Cluster","_n":"129aa","_k":"fbe10ca3"},{"t":"The same","_n":"13899","_k":"ff1fedfa"}],"explain":"Each homeroom is a single grade, so a cluster sample might be all Grade 9s (60%) or all Grade 12s (30%). Stratified: \u003cstrong>some\u003c/strong> from \u003cstrong>every\u003c/strong> group. Cluster: \u003cstrong>all\u003c/strong> from \u003cstrong>some\u003c/strong> groups."}],"chalIntro":"Use the sampling lab to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Set up a stratified sample of 40 that matches the school’s grade proportions.","why":"12, 10, 10 and 8 are 30%, 25%, 25% and 20% of 40: the same shares as Grades 9 to 12 have of the school.","hints":["What fraction of the school is in Grade 9?","120 ÷ 400 = 30%, so 30% of 40.","12, 10, 10, 8."]},{"id":"tc2","goal":3,"prompt":"Set up a systematic sample of 50.","why":"Interval = 400 ÷ 50 = 8, and a start from 1 to 8 gives exactly 50 students, with every student able to be chosen.","hints":["How many students per pick?","400 ÷ 50 = 8.","Interval 8, random start from 1 to 8."]},{"id":"tc3","goal":6,"stretch":true,"prompt":"Using simple random samples, find the \u003cstrong>smallest\u003c/strong> sample size on the slider for which the margin of error is at most 10 percentage points.","why":"At `n = 100` the margin is `2√{0.465 × 0.535/100}` ≈ 9.98%; at `n = 90` it is about 10.5%.","hints":["The margin is about `2√{p(1 - p)/n}`; with `p` near 0.5, that’s about `1/√n`.","`1/√n ≤ 0.10` needs `√n ≥ 10`.","`n ≥ 100`; check the readout."]}]},"part3":{"slug":"margin","name":"Margins of error","heading":"Margins of error","intro":"Polls report a statistic with a margin of error and a confidence level. Read and judge each poll statement, then open \u003cstrong>Check it with data\u003c/strong> to see what “19 times out of 20” looks like.","stations":[{"id":"s1","title":"Reading the sentence","goal":6,"text":"“A poll of 1000 Canadians finds 52% support, accurate to within ±3 percentage points, 19 times out of 20.” Build the interpretation: tap a blank, then tap a chip.","parts":["The true support is probably between","and","; the method captures the true value in about","of polls."],"bank":["49%","55%","95%","52%","3%","52% of people are 95% sure","3% of answers were wrong"],"_a":"bBcDXR0UFEYCABJGFBQBURIXag==","fb":{"52%":"52% is the poll’s statistic, the middle of the interval. The interval runs 3 points either side of it.","3%":"3 is the margin, not an end of the interval: 52 − 3 and 52 + 3.","52% of people are 95% sure":"The 95% describes the method, not how sure people are. The margin covers random sampling variation only, at 95% confidence. It says nothing about bias.","3% of answers were wrong":"±3 isn’t a count of wrong answers: it’s how far the true value may be from 52%. The margin covers random sampling variation only, at 95% confidence. It says nothing about bias.","49%":"49% is the bottom of the interval.","55%":"55% is the top of the interval.","95%":"95% is the confidence level: 19 ÷ 20."},"why":"52 ± 3 gives 49% to 55%, and “19 times out of 20” is 19 ÷ 20 = 95% confidence."},{"id":"s2","title":"The size rule","goal":6,"text":"For `p` near 0.5 at 95% confidence, the margin is about `1/√n`. Move the slider and watch the margin.","prompt":"To halve the margin, multiply the sample size by…","options":[{"t":"½","why":"A smaller sample makes the margin bigger.","_n":"148a9","_k":"73c0931d"},{"t":"2","why":"Doubling the sample only shrinks the margin by a factor of √2: 400 → 800 takes 5% to about 3.5%.","_n":"158b9","_k":"4cb21b6b"},{"t":"4","why":"`1/√{4n} = 1/(2√n)`: four times the sample halves the margin.","_n":"168c9","_k":"2958c02a"},{"t":"8","why":"Eight times the sample shrinks the margin by a factor of √8 ≈ 2.8, more than half.","_n":"178d9","_k":"e0c8a3df"}]},{"id":"s3","title":"Too close to call","goal":6,"text":"A poll finds Party A at 41% and Party B at 38%, each with a margin of ±4 percentage points.","prompt":"What can the poll say?","choices":[{"t":"It can’t tell who leads","why":"The intervals 37–45 and 34–42 overlap a lot, and the 3-point gap is smaller than the 4-point margin.","_n":"188e9","_k":"fb561cc2"},{"t":"A leads by 3","why":"The margin (4) is larger than the gap (3): B could really be ahead.","_n":"198f9","_k":"a14b1db3"}]},{"id":"s4","title":"The big-but-biased poll","goal":[5,6],"text":"“A news site’s online poll of 10 000 readers claims ±1%.”","prompt":"Choose the best response.","options":[{"t":"10 000 readers is a huge sample, so ±1% makes it trustworthy.","why":"Size reduces random error, not bias. Readers chose themselves.","_n":"1a909","_k":"70ba5dce"},{"t":"The ±1% already includes any bias from who answered.","why":"The margin covers random sampling variation only, at 95% confidence. It says nothing about bias.","_n":"1b919","_k":"32e32d28"},{"t":"The margin assumes a random sample; this is voluntary response, so the margin is meaningless.","why":"Readers chose to answer, so the result can be biased however many reply. The margin covers random sampling variation only, at 95% confidence. It says nothing about bias.","_n":"1c929","_k":"0fc121a5"},{"t":"The margin should be ±3%, not ±1%.","why":"`1/√{10 000}` = 1%, so the arithmetic is fine. The problem is who answered.","_n":"1d8f9","_k":"8c45b5ca"}]}],"quickCheck":{"title":"Margins of error quick check","summary":"Margins of error quick check","items":[{"id":"q1","goal":6,"prompt":"“19 times out of 20” means a confidence level of…","choices":[{"t":"95%","fb":"Right. 19 ÷ 20 = 0.95.","_n":"1e8e9","_k":"a8ad5c3f"},{"t":"90%","fb":"19 ÷ 20 = 0.95.","_n":"1f8d9","_k":"42dde46a"},{"t":"19%","fb":"19 ÷ 20 = 0.95.","_n":"1g8c9","_k":"207c29f8"},{"t":"5%","fb":"19 ÷ 20 = 0.95.","_n":"1h939","_k":"4792b12c"}]},{"id":"q2","goal":6,"prompt":"A poll of 400 has margin ±5%. About what margin for 1600?","choices":[{"t":"±1.25%","fb":"Four times the sample halves the margin.","_n":"1i929","_k":"aaceea60"},{"t":"±2.5%","fb":"Right. Four times the sample halves the margin.","_n":"1j919","_k":"58d02cc3"},{"t":"±5%","fb":"Four times the sample halves the margin.","_n":"1k909","_k":"bc79c084"},{"t":"±10%","fb":"Four times the sample halves the margin.","_n":"1l979","_k":"5072e39c"}]},{"id":"q3","goal":[5,6],"prompt":"Which error does the margin of error \u003cstrong>not\u003c/strong> include?","choices":[{"t":"Both","fb":"It covers random variation only.","_n":"1m969","_k":"43ff40e8"},{"t":"Random sampling variation","fb":"It covers random variation only.","_n":"1n959","_k":"55e80d68"},{"t":"Neither","fb":"It covers random variation only.","_n":"1o969","_k":"d31554ea"},{"t":"Bias from a voluntary sample","fb":"Right. It covers random variation only.","_n":"1p939","_k":"c6825c27"}]},{"id":"q4","goal":6,"prompt":"A poll of 2500 has margin ±2%. What margin would a poll of 100 on the same question have?","choices":[{"t":"±4%","fb":"`1/√100` = 10%: a sample 25 times smaller has a margin 5 times larger.","_n":"1q949","_k":"67168332"},{"t":"±10%","fb":"Right. `1/√100` = 10%: a sample 25 times smaller has a margin 5 times larger.","_n":"1r919","_k":"9dea72cb"},{"t":"±2%","fb":"`1/√100` = 10%: a sample 25 times smaller has a margin 5 times larger.","_n":"1s929","_k":"b1cadd22"},{"t":"±50%","fb":"`1/√100` = 10%: a sample 25 times smaller has a margin 5 times larger.","_n":"1t8f9","_k":"3bc9813a"}]}]}},"practice":{"activities":[{"id":"name","type":"match","title":"Name the method","summary":"Name the method","goal":[1,2],"instruction":"Tap a scenario, then tap the method it uses.","leftTitle":"Scenario","rightTitle":"Method","left":[{"id":"l1","t":"“Number all 1200 students and choose 60 with a random number generator.”","why":"Every group of 60 has the same chance: simple random."},{"id":"l2","t":"“Pick a random student among the first 20 on the list, then every 20th after that.”","why":"A random start, then a fixed interval: systematic."},{"id":"l3","t":"“Randomly choose students from every grade, in proportion to each grade’s size.”","why":"Some from every group: stratified."},{"id":"l4","t":"“Randomly choose 3 homerooms and survey everyone in them.”","why":"All from some groups: cluster."},{"id":"l5","t":"“Randomly choose 4 schools, then 2 classes in each, then 5 students per class.”","why":"Three rounds of random choice: multi-stage.","hints":["How many rounds of random choice?","Three: schools, classes, students.","Multi-stage."]},{"id":"l6","t":"“Post a link on the school’s social media page and count the replies.”","why":"People chose to reply: voluntary response."},{"id":"l7","t":"“Ask the people at your lunch table.”","why":"Whoever is handy: convenience."},{"id":"l8","t":"“Survey every student in the school.”","why":"Everyone is measured: a census."}],"right":[{"id":"srs","t":"Simple random"},{"id":"sys","t":"Systematic"},{"id":"strat","t":"Stratified"},{"id":"clus","t":"Cluster"},{"id":"multi","t":"Multi-stage"},{"id":"vol","t":"Voluntary response"},{"id":"conv","t":"Convenience"},{"id":"census","t":"Census"}],"_a":"TBdbVRoMGhdFRhVIGloKRg0XRB1LFBRGWwYVXhpFTBZWQRVIGloMRg0XVAhNRRpIFVkCRgIUVRFbQV5GFBRUUhUPFRJXWhpIFVkARgIUWwtZQxVIGloARg0XVAFWRU0XFUg=","wrong":{"l3|clus":"Cluster takes \u003cstrong>everyone\u003c/strong> in a few groups; this takes \u003cstrong>some\u003c/strong> from \u003cstrong>every\u003c/strong> group.","l4|strat":"Stratified: \u003cstrong>some\u003c/strong> from \u003cstrong>every\u003c/strong> group. Cluster: \u003cstrong>all\u003c/strong> from \u003cstrong>some\u003c/strong> groups.","l6|srs":"People chose to reply; that’s not random.","l8|srs":"Everyone is measured: that’s a census, not a sample.","l8|sys":"Everyone is measured: that’s a census, not a sample.","l8|strat":"Everyone is measured: that’s a census, not a sample.","l8|clus":"Everyone is measured: that’s a census, not a sample.","l8|multi":"Everyone is measured: that’s a census, not a sample.","l8|vol":"Everyone is measured: that’s a census, not a sample.","l8|conv":"Everyone is measured: that’s a census, not a sample."},"wrongDefault":"Look at who chooses, and whether groups are sampled in part or in full."},{"id":"plan","type":"custom","title":"Plan it","summary":"Plan it","goal":[3,4,5,6],"instruction":"Plan each sample and classify each variable. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a whole number or tap a choice, then press Check.","items":[{"id":"s1","goal":3,"prompt":"A town has 2400 adults: 1200 in North, 800 in Centre and 400 in South. For a proportional stratified sample of 150, how many from each?","parts":["North:","Centre:","South:"],"_a":"bAICSA0GFFYCaA==","tol":0,"display":"75, 50 and 25","why":"North is 1200/2400 = 50% of the town, Centre `1/3` and South `1/6`: 50% of 150 = 75, then 50 and 25.","wrong":[{"part":0,"match":50,"fb":"Equal isn’t proportional."},{"part":2,"match":50,"fb":"Equal isn’t proportional."}],"fb":"Each neighbourhood’s share of the sample should match its share of the town: 1200/2400 × 150 for North."},{"id":"s2","goal":3,"prompt":"A systematic sample of 60 from a list of 1500 names uses what interval?","label":"Interval:","_a":"BQA=","tol":0,"display":"25","why":"1500 ÷ 60 = 25: start at a random name from 1 to 25, then take every 25th.","wrong":[{"match":0.04,"fb":"Population ÷ sample, not sample ÷ population. Interval = population ÷ sample size; start at a random spot within the first interval."}],"fb":"Interval = population ÷ sample size; start at a random spot within the first interval."},{"id":"s3","goal":2,"star":true,"prompt":"Multi-stage: 5 of 40 schools, then 3 of each school’s 12 classes, then 6 students from each class. How many students are sampled?","label":"Students:","_a":"DgU=","tol":0,"display":"90","why":"5 schools × 3 classes = 15 classes; 15 × 6 = 90 students.","wrong":[{"match":240,"fb":"Only the chosen schools and classes count: 5 × 3 × 6."},{"match":2880,"fb":"Only the chosen schools and classes count: 5 × 3 × 6."}],"fb":"Multiply the numbers chosen at each stage.","hints":["Multiply the numbers chosen at each stage.","5 schools × 3 classes.","15 classes × 6 students = 90."]},{"id":"s4","goal":4,"star":true,"prompt":"Classify each variable.","parts":[{"t":"(a) postal code","choices":["Qualitative nominal","Qualitative ordinal","Quantitative discrete","Quantitative continuous"]},{"t":"(b) time to run 100 m","choices":["Qualitative nominal","Qualitative ordinal","Quantitative discrete","Quantitative continuous"]},{"t":"(c) shirt size S/M/L","choices":["Qualitative nominal","Qualitative ordinal","Quantitative discrete","Quantitative continuous"]},{"t":"(d) goals scored in a season","choices":["Qualitative nominal","Qualitative ordinal","Quantitative discrete","Quantitative continuous"]}],"_a":"bBdmEVlaURBWQV4SXRZWC1pcWQVUFBRGZkBWCkxfTAVDXEEBGFVXCkNcWRFXQ0tGGxdmEVlaURBWQV4SXRZXFlNcWQVUFBRGZkBWCkxfTAVDXEEBGFJRF1RHUhBdFGU=","display":"(a) qualitative nominal; (b) quantitative continuous; (c) qualitative ordinal; (d) quantitative discrete","why":"A postal code is an unordered label; a time is a measurement; shirt sizes are ordered categories; goals are counts.","wrong":[{"part":0,"match":"Quantitative discrete","fb":"Postal codes are labels, like jersey numbers: arithmetic on them means nothing. They’re qualitative."},{"part":0,"match":"Quantitative continuous","fb":"Postal codes are labels, like jersey numbers: arithmetic on them means nothing. They’re qualitative."}]},{"id":"s5","goal":6,"star":true,"prompt":"A poll of 400 has margin ±5%. About how many people are needed for ±2.5%?","label":"People:","_a":"BgMHVA==","tol":0,"display":"1600","why":"The margin is about `1/√n`: `1/√1600` = 2.5%. Halving the margin takes four times the people.","wrong":[{"match":800,"fb":"Halving the margin needs \u003cstrong>four\u003c/strong> times the people."},{"match":200,"fb":"A smaller sample makes the margin bigger."}],"fb":"The margin is about `1/√n`. What `n` gives 2.5%?"},{"id":"s6","goal":5,"star":true,"prompt":"Which design best tests whether a new study app improves marks?","parts":[{"t":"Design:","choices":["Let students choose whether to use it, then compare","Randomly assign 100 of 200 volunteers to use it for a month and 100 not to, then compare","Survey students who already use it","Use it in one class and compare with last year’s class"]}],"_a":"bBdlBVZSVwlbTBcFS0VRA1kVBlQIFlcCFwcHVBhAVwhCW0MBXURLRENaFxFLUxgNQxVRC0oWWURaWlkQUBZZClMVBlQIFlYLQxVDCxQWTAxSWxcHV1tIBUVQFTk=","display":"random assignment of 100 of 200 volunteers","why":"Randomization, a control group, and many students (replication).","wrong":[{"part":0,"match":"Let students choose whether to use it, then compare","fb":"Students who choose it may already be keener: no randomization."},{"part":0,"match":"Use it in one class and compare with last year’s class","fb":"Different years differ in many ways: no control."},{"part":0,"match":"Survey students who already use it","fb":"Students who already use it chose it themselves, and there’s no comparison group."}],"hints":["Which design uses chance to decide who gets the app?","Random assignment balances other differences between the groups.","Random assignment of 100 of the 200 volunteers: randomization, a control group, and many students (replication)."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Elsa","goal":[1,3,5],"instruction":"Elsa made one mistake in each piece of work. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"A school has 300 Grade 9, 250 Grade 10, 250 Grade 11 and 200 Grade 12 students. Plan a proportional stratified sample of 80.","steps":["The school has 1000 students.","There are 4 grades, so take 80 ÷ 4 = 20 from each grade.","Choose 20 at random from each grade’s list."],"_a":"Bg==","stepFb":["Step 1 is correct.","","Random choice within each grade is right; the numbers are the problem."],"fixes":[{"t":"Use each grade’s share: 300/1000 × 80 = 24, then 20, 20 and 16.","why":"Each grade gets its share of the 80: 24, 20, 20 and 16.","_n":"1u909","_k":"ba1d082d"},{"t":"Choose 2 grades and survey everyone in them.","why":"That’s cluster sampling. Stratified: \u003cstrong>some\u003c/strong> from \u003cstrong>every\u003c/strong> group. Cluster: \u003cstrong>all\u003c/strong> from \u003cstrong>some\u003c/strong> groups.","_n":"1v9d9","_k":"8b059e0d"},{"t":"Take 80 from each grade.","why":"That makes 320.","_n":"1w9e9","_k":"be416f09"},{"t":"Step 2 is correct.","why":"Equal numbers aren’t proportional when the grades differ in size.","_n":"1x1ba","_k":"e89dcd79"}],"hints":["What fraction of the school is Grade 9?","300 ÷ 1000 = 30%.","24, 20, 20, 16."]},{"id":"e2","goal":5,"task":"A sports drink company surveys 2000 people at marathon finish lines and reports that “78% of Canadians exercise daily”.","steps":["The population is Canadian adults.","The sample is 2000 marathon finishers.","2000 is a very large sample, so the 78% is reliable for all Canadians."],"_a":"BQ==","stepFb":["Step 1 names the population correctly.","Step 2 is accurate.",""],"fixes":[{"t":"Marathon finishers exercise far more than typical Canadians. It’s a convenience sample, so it’s biased whatever its size.","why":"Size can’t fix how the sample was chosen.","_n":"1y1aa","_k":"d9f26230"},{"t":"Step 3 is correct.","why":"500 gym-goers still aren’t typical adults. Size reduces random error, not bias.","_n":"1z1da","_k":"1370f511"},{"t":"The sample should be 20 000.","why":"500 gym-goers still aren’t typical adults. Size reduces random error, not bias.","_n":"201ca","_k":"e72fc701"},{"t":"The margin of error fixes this.","why":"The margin covers random sampling variation only, at 95% confidence. It says nothing about bias.","_n":"211fa","_k":"69c8f161"}],"hints":["Are marathoners typical?","No: they exercise much more.","Size can’t fix how they were chosen."]},{"id":"e3","goal":1,"task":"A poll of 500 of a city’s 80 000 voters finds 61% support a new library. Label the numbers.","steps":["The population is the city’s 80 000 voters.","61% is the parameter, because it describes support for the library.","The true percent of all 80 000 voters is the statistic."],"_a":"Bg==","stepFb":["Step 1 is correct.","","Step 3 repeats the same swap."],"fixes":[{"t":"Step 2 is correct.","why":"\u003cstrong>P\u003c/strong>arameter goes with \u003cstrong>p\u003c/strong>opulation; \u003cstrong>s\u003c/strong>tatistic goes with \u003cstrong>s\u003c/strong>ample.","_n":"221ea","_k":"c2d2d2f9"},{"t":"Both numbers are parameters.","why":"The 61% comes from the 500 people asked, so it’s a statistic.","_n":"2321a","_k":"04954ef5"},{"t":"Both numbers are statistics.","why":"The true percent of all 80 000 voters describes the population, so it’s a parameter.","_n":"2420a","_k":"5b912933"},{"t":"61% comes from the sample, so it’s a statistic. The true percent of all voters is the parameter, which the 61% estimates.","why":"\u003cstrong>P\u003c/strong>arameter goes with \u003cstrong>p\u003c/strong>opulation; \u003cstrong>s\u003c/strong>tatistic goes with \u003cstrong>s\u003c/strong>ample.","_n":"2513a","_k":"39593f37"}],"hints":["Where does the 61% come from?","The 500 people asked.","Sample → statistic."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the Sampling lab: the gym sample staying wrong at every size, or the cluster samples swinging so widely?"},{"id":"j2","q":"In your own words, why does \u003cstrong>how\u003c/strong> you sample matter more than \u003cstrong>how many\u003c/strong> you sample?"},{"id":"j3","q":"Explain to a friend the difference between stratified and cluster sampling, using your own school as the example."},{"id":"j4","q":"Think of a poll or survey you’ve seen. What would you want to know about how it was sampled before trusting it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A survey of 250 voters finds that 58% support a plan. The 58% is…","options":[{"t":"a statistic","why":"It comes from the sample.","_n":"2612a","_k":"398cb575"},{"t":"a population","why":"The population is all voters.","_n":"2711b","_k":"3f3b4c29"},{"t":"a parameter","why":"Parameters describe the whole population. \u003cstrong>P\u003c/strong>arameter goes with \u003cstrong>p\u003c/strong>opulation; \u003cstrong>s\u003c/strong>tatistic goes with \u003cstrong>s\u003c/strong>ample.","_n":"2812b","_k":"e35ad95d"},{"t":"a census","why":"A census measures everyone.","_n":"2913b","_k":"eef4a6b9"}]},"b":{"prompt":"The true percent of all 30 000 voters who support the plan is…","options":[{"t":"a parameter","why":"It describes the whole population.","_n":"2a14b","_k":"a6b16e1d"},{"t":"a statistic","why":"\u003cstrong>P\u003c/strong>arameter goes with \u003cstrong>p\u003c/strong>opulation; \u003cstrong>s\u003c/strong>tatistic goes with \u003cstrong>s\u003c/strong>ample.","_n":"2b0db","_k":"17e57442"},{"t":"a margin of error","why":"That’s how far a statistic may be from the parameter.","_n":"2c0eb","_k":"289d147a"},{"t":"a sample","why":"A sample is a group of people, not a number.","_n":"2d0fb","_k":"8567ab2e"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A researcher randomly selects 4 of a city’s 60 neighbourhoods and surveys every household in them. Which method is this?","options":[{"t":"Systematic","why":"There’s no fixed interval.","_n":"2e10b","_k":"7d934b6a"},{"t":"Stratified","why":"Stratified: \u003cstrong>some\u003c/strong> from \u003cstrong>every\u003c/strong> group. Cluster: \u003cstrong>all\u003c/strong> from \u003cstrong>some\u003c/strong> groups.","_n":"2f19b","_k":"9300a410"},{"t":"Simple random","why":"Households weren’t chosen individually from the whole city.","_n":"2g1ab","_k":"c2e9bb49"},{"t":"Cluster","why":"Everyone in a few randomly chosen groups.","_n":"2h97b","_k":"c181202f"}]},"b":{"prompt":"A researcher randomly selects 20 households from each of a city’s 60 neighbourhoods. Which method is this?","options":[{"t":"Systematic","why":"No interval.","_n":"2i96b","_k":"c9a1f520"},{"t":"Stratified","why":"Some from every group.","_n":"2j95b","_k":"0d0685bb"},{"t":"Convenience","why":"The households were chosen at random.","_n":"2k94b","_k":"260dcc9c"},{"t":"Cluster","why":"Stratified: \u003cstrong>some\u003c/strong> from \u003cstrong>every\u003c/strong> group. Cluster: \u003cstrong>all\u003c/strong> from \u003cstrong>some\u003c/strong> groups.","_n":"2l93b","_k":"e8719224"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Which variable is quantitative and continuous?","options":[{"t":"Jersey number","why":"A label. Jersey numbers are labels: averaging them means nothing. They’re qualitative.","_n":"2m92b","_k":"aadec390"},{"t":"Favourite colour","why":"A category.","_n":"2n91b","_k":"ad414b18"},{"t":"The time to finish a puzzle","why":"A measurement on a continuous scale.","_n":"2o90b","_k":"05a49027"},{"t":"The number of pets","why":"Counts are discrete.","_n":"2p9fb","_k":"92536a99"}]},"b":{"prompt":"Which variable is qualitative and ordinal?","options":[{"t":"A satisfaction rating: poor, fair, good, excellent","why":"Ordered categories.","_n":"2q9eb","_k":"0898bc7c"},{"t":"Postal code","why":"Categories with no order: nominal.","_n":"2ra9a","_k":"cd4fb9fd"},{"t":"Height","why":"Quantitative, continuous.","_n":"2sa8a","_k":"cf8a2ce9"},{"t":"Number of texts sent today","why":"Quantitative.","_n":"2taba","_k":"f3881128"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"A school has 300 Grade 9, 250 Grade 10, 250 Grade 11 and 200 Grade 12 students. In a proportional stratified sample of 80, how many are in Grade 12?","options":[{"t":"8","why":"That uses a sample of 40.","_n":"2uaaa","_k":"f5a13f8a"},{"t":"16","why":"200/1000 × 80.","_n":"2va5a","_k":"b4a4d2a2"},{"t":"20","why":"That’s an equal split, not proportional.","_n":"2wa4a","_k":"c2ebee99"},{"t":"200","why":"That’s the whole grade.","_n":"2xa7a","_k":"e24e0fc5"}]},"b":{"prompt":"Same school. In a proportional stratified sample of 80, how many are in Grade 9?","options":[{"t":"12","why":"That uses a sample of 40.","_n":"2ya6a","_k":"c3cbe669"},{"t":"20","why":"That’s an equal split.","_n":"2za1a","_k":"15d3e37d"},{"t":"24","why":"300/1000 × 80.","_n":"30a0a","_k":"05db2daa"},{"t":"300","why":"That’s the whole grade.","_n":"3123a","_k":"65aeac36"}]}},{"id":"t2","cat":"T","goal":[2,5],"a":{"prompt":"A gym surveys the first 500 members who arrive one Monday morning about how often they exercise, and concludes that the average adult exercises 5 times a week. What is the main flaw?","options":[{"t":"It should have been a census of the gym.","why":"That still wouldn’t represent all adults.","_n":"3224a","_k":"3b1b31d6"},{"t":"It’s a convenience sample of gym-goers, who exercise more than most adults; a large sample doesn’t fix that","why":"Size can’t fix how the sample was chosen.","_n":"3321a","_k":"56060801"},{"t":"The sample is too small.","why":"500 gym-goers still aren’t typical adults. Size reduces random error, not bias.","_n":"3422a","_k":"02e57196"},{"t":"The question was leading.","why":"Nothing suggests leading wording; the sample is the problem.","_n":"3527a","_k":"3887ddce"}]},"b":{"prompt":"A radio station invites listeners to call in about a new law; 2000 call and 80% oppose it. What is the main flaw?","options":[{"t":"It’s a voluntary response sample: people with strong feelings are the most likely to call","why":"Callers chose themselves, so strong opinions are over-represented.","_n":"3628a","_k":"33fddca1"},{"t":"Nothing: 2000 is large enough.","why":"Size reduces random error, not bias. Callers chose themselves.","_n":"3725a","_k":"d274fe26"},{"t":"2000 callers is too few.","why":"Size reduces random error, not bias. Callers chose themselves.","_n":"3826a","_k":"119a66ce"},{"t":"It’s a cluster sample.","why":"Callers chose themselves.","_n":"391ba","_k":"a0e17a92"}]}},{"id":"t3","cat":"T","goal":6,"a":{"prompt":"A poll of 1000 people has a margin of error of ±3.2%. About how many people are needed for ±1.6%?","options":[{"t":"500","why":"Fewer people make the margin bigger.","_n":"3a1ca","_k":"94d96c37"},{"t":"1600","why":"The margin and `n` aren’t added like that.","_n":"3b1da","_k":"6bdb9c5b"},{"t":"2000","why":"Doubling the sample only shrinks the margin by a factor of √2.","_n":"3c1ca","_k":"5f71045d"},{"t":"4000","why":"Halving the margin needs four times the sample.","_n":"3d1ba","_k":"3091b9fc"}]},"b":{"prompt":"A poll of 400 people has margin ±5%. What margin would a poll of 100 have?","options":[{"t":"±20%","why":"The margin scales with `1/√n`, not `1/n`.","_n":"3e1aa","_k":"5c40dded"},{"t":"±2.5%","why":"Smaller samples have bigger margins.","_n":"3f19a","_k":"3debe806"},{"t":"±5%","why":"Sample size matters.","_n":"3g18a","_k":"4871a32a"},{"t":"±10%","why":"A quarter of the sample doubles the margin.","_n":"3h17a","_k":"e70cc725"}]}},{"id":"c1","cat":"C","goal":6,"a":{"prompt":"A report says: “Support is 52%, accurate to within ±3 percentage points, 19 times out of 20.” Which is the best interpretation?","options":[{"t":"“The true support is probably between 49% and 55%: the method used produces intervals that contain the true value about 95% of the time.”","why":"52 ± 3, and “19 times out of 20” is the method’s 95% confidence level.","_n":"3i16a","_k":"0f5cc9e1"},{"t":"“19 out of 20 people support the policy.”","why":"The margin covers random sampling variation only, at 95% confidence. It says nothing about bias.","_n":"3j25a","_k":"e2daa98b"},{"t":"“Exactly 52% support it, and 3% are undecided.”","why":"±3 isn’t a group of undecided people.","_n":"3k24a","_k":"fff1d687"},{"t":"“52% of people are 95% sure of their answer.”","why":"The margin covers random sampling variation only, at 95% confidence. It says nothing about bias.","_n":"3l17a","_k":"21738a66"}]},"b":{"prompt":"Party A has 41% and Party B 38%, each with a margin of ±4 percentage points. Which is the best statement?","options":[{"t":"“Party B is ahead once the margin is applied.”","why":"The margin applies to both equally.","_n":"3m18a","_k":"41107ad0"},{"t":"“Party A is 4% ahead.”","why":"The 4 is the margin, not the lead.","_n":"3n19a","_k":"0d34940e"},{"t":"“Party A leads by 3 points.”","why":"The margin is larger than the gap.","_n":"3o1aa","_k":"79a98077"},{"t":"“The intervals 37–45 and 34–42 overlap a lot, so the poll can’t tell which party is really ahead.”","why":"The 3-point gap is smaller than the 4-point margin.","_n":"3p13a","_k":"8c150639"}]}},{"id":"c2","cat":"C","goal":5,"a":{"prompt":"Which is the best explanation of why random selection matters in a survey?","options":[{"t":"“It means you don’t need many people.”","why":"Randomness removes bias, but a small random sample still has a large margin of error: you need enough people too.","_n":"3q14a","_k":"c0ac5840"},{"t":"“It makes the sample larger.”","why":"Size and randomness are separate.","_n":"3r15a","_k":"c7ff86ce"},{"t":"“It gives every member of the population a known chance of being chosen, so no group is systematically over- or under-represented.”","why":"Random means every member has a known chance, decided by a random process, not by convenience.","_n":"3s16a","_k":"0e9c6dc7"},{"t":"“It guarantees the sample matches the population exactly.”","why":"Random samples vary; they’re right on average.","_n":"3t1fa","_k":"b4a5955b"}]},"b":{"prompt":"Which is the best explanation of why an experiment includes a control group?","options":[{"t":"“It makes the experiment bigger.”","why":"That’s replication.","_n":"3u20a","_k":"41f246b9"},{"t":"“It lets people choose their group.”","why":"Choosing undoes randomization.","_n":"3v11a","_k":"18544c0e"},{"t":"“It removes the need for random assignment.”","why":"Both are needed.","_n":"3w10a","_k":"d4962812"},{"t":"“It shows what happens without the treatment, so a difference between the groups can be attributed to the treatment.”","why":"The control group is the comparison.","_n":"3x13a","_k":"af42fd11"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"A province’s three regions have 600 000, 300 000 and 100 000 adults. A pollster plans 2000 interviews, stratified proportionally. How many are in the smallest region?","options":[{"t":"20","why":"10% of 2000 is 200.","_n":"3y12a","_k":"18c94dc2"},{"t":"200","why":"100 000 is 10% of 1 000 000; 10% of 2000.","_n":"3z15a","_k":"29d2aed9"},{"t":"667","why":"That’s an equal split.","_n":"4014a","_k":"f4268e94"},{"t":"1200","why":"That’s the largest region.","_n":"4117a","_k":"7105502e"}]},"b":{"prompt":"Same province. How many interviews are in the largest region?","options":[{"t":"200","why":"That’s the smallest region.","_n":"4216a","_k":"86f4ff98"},{"t":"600","why":"60% of 2000, not 600.","_n":"4319a","_k":"3f7a4cc6"},{"t":"667","why":"That’s an equal split.","_n":"4418a","_k":"d068290c"},{"t":"1200","why":"60% of 2000.","_n":"45aba","_k":"8bc4f970"}]}},{"id":"a2","cat":"A","goal":[2,5],"a":{"prompt":"A city wants residents’ views on bus service. Which plan gives the most trustworthy results?","options":[{"t":"Survey people waiting at bus stops","why":"Convenience: it misses residents who don’t ride.","_n":"46aca","_k":"9e34812d"},{"t":"Survey every resident of one randomly chosen neighbourhood","why":"One cluster can’t represent the city. Stratified: \u003cstrong>some\u003c/strong> from \u003cstrong>every\u003c/strong> group. Cluster: \u003cstrong>all\u003c/strong> from \u003cstrong>some\u003c/strong> groups.","_n":"47a9a","_k":"877cb49a"},{"t":"An online poll on the transit website","why":"Voluntary response.","_n":"48aaa","_k":"80fb7a95"},{"t":"A stratified random sample of residents from the city’s address list, by neighbourhood","why":"Random selection from a full list, with every neighbourhood represented.","_n":"49a7a","_k":"6ca24d49"}]},"b":{"prompt":"A school board wants students’ views on school start times. Which plan gives the most trustworthy results?","options":[{"t":"Ask students who arrive late","why":"Convenience, and a biased group.","_n":"4aa8a","_k":"f66a7301"},{"t":"A simple random sample of 300 students from the board’s full enrolment list","why":"Every student on the full list has the same chance.","_n":"4ba5a","_k":"22689898"},{"t":"Survey every student at one school","why":"One cluster.","_n":"4ca6a","_k":"21e2ab89"},{"t":"Post a poll on social media","why":"Voluntary response.","_n":"4da3a","_k":"16f68927"}]}}]},"task":{"title":"Town survey","summary":"Town survey","statement":"\u003cp>A town of 6000 adults has three neighbourhoods: North (3000), Centre (2000) and South (1000). Plan a survey about a new community centre that meets every condition. Can you find all the answers? \u003cspan class=\"mdm-model\">model town\u003c/span>\u003c/p>\u003col class=\"ts-conds\">\u003cli>The margin of error is about ±5% or better (at least 400 people in total).\u003c/li>\u003cli>The budget allows at most 600 interviews.\u003c/li>\u003cli>Each neighbourhood is represented in proportion to its size.\u003c/li>\u003cli>People are chosen at random within each neighbourhood.\u003c/li>\u003c/ol>","checks":["Margin ±5% or better","Within budget","Proportional","Random within each neighbourhood"],"tips":["`1/√400` = 5%: you need at least 400 interviews.","Stay at or under 600.","The neighbourhoods are in the ratio 3 : 2 : 1.","The mall and the flyer let people choose themselves or depend on who’s around."],"explainPrompt":"Explain how your plan balances the margin of error, the budget and fairness to each neighbourhood.","vocab":"Use the words stratified, proportional, random and margin of error.","more":"There’s more than one answer. Can you find them all?","after3":"A total of 6 × South between 400 and 600, in steps of 10 for South, gives exactly these four. A bigger survey in the same ratio costs more but narrows the margin: 600 gives about ±4.1%.","afterAt":4},"cards":[["Population vs sample","Everyone the question is about vs the part actually measured."],["Parameter vs statistic","Describes the population vs describes the sample (and estimates the parameter)."],["Census","Measuring every member of the population."],["Simple random sample","Every group of `n` has the same chance; use a random number generator on a numbered list."],["Systematic sample","Interval `k = N ÷ n`; random start from 1 to `k`; then every `k`th."],["Stratified sample","Some from \u003cstr
