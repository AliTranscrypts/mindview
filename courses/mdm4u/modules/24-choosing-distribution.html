.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 24: hero (four mini-histograms + decision tree), Distribution detective (route tree, deck, parameter boxes,
   D7 histograms: series 1 solid --pen, series 2 teal --ev-b outlined), Mixed problems stations, probEntry, task.
   Route edges --ink (hero route 2 teal); reached leaves highlighter yellow; neutral checks use --info-bg. */
/* radioGroup (from MDM4U 21 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}
.rg.chips button .m{font-size:1.05em}

/* hero */
.cd-heq{display:inline-flex;flex-direction:column;align-items:center;gap:.3em}
.cd-hrow{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:8px 12px}
.cd-hh{display:inline-flex;flex-direction:column;align-items:center;padding:4px 6px;border:1.5px solid transparent;border-radius:8px;transition:background .3s,border-color .3s}
.cd-hh svg{display:block;width:64px;height:46px}
.cd-hh rect{fill:var(--pen)}
.cd-hh line{stroke:var(--ink-2);stroke-width:1.5}
.cd-hl{font:700 .72rem/1.2 var(--font-ui);color:var(--ink-2);margin-top:3px}
.cd-hh.on{background:var(--hi-soft);border-color:var(--sel-bd)}
.cd-hh.on .cd-hl{color:var(--ink)}
.cd-hq{font:700 .95rem var(--font-ui);color:var(--ink)}
.cd-hfig{display:grid;justify-items:center}
.cd-hsvg{display:block;width:100%;max-width:440px;height:auto}
.cd-hc{fill:var(--sheet);stroke:var(--pen);stroke-width:2}
.cd-hc.two{stroke:var(--ev-b)}
.cd-hct{font:700 12px var(--font-ui);fill:var(--ink)}

/* decisionTree (SVG) */
.cd-te{stroke:var(--rule);stroke-width:2}
.cd-te.on{stroke:var(--ink);stroke-width:3.5}
.cd-te.on2{stroke:var(--ev-b);stroke-width:3.5}
.cd-tyn{font:600 11px var(--font-ui);fill:var(--ink-2)}
.cd-tyn.on,.cd-tyn.on2{font-weight:800;fill:var(--ink)}
.cd-tn rect{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.cd-tn text{font:700 11px var(--font-ui);fill:var(--ink)}
.cd-tn.leaf rect{fill:var(--paper)}
.cd-tn.lit rect,.cd-tn.lit2 rect{fill:var(--hi);stroke:var(--sel-bd);stroke-width:2}
.cd-tn.lit text,.cd-tn.lit2 text{fill:var(--hi-ink)}
.cd-tok rect{fill:var(--pen);stroke:var(--sheet);stroke-width:1.5}
.cd-tok.two rect{fill:var(--ev-b)}

/* Explore: distribution detective */
.cd-pg{display:block}
.cd-deck{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:4px 0 8px}
.cd-cn{font:700 .9rem var(--font-ui);color:var(--ink-2)}
.cd-card{margin:0 0 10px;padding:10px 12px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);font-size:1.02rem}
.cd-ctag{display:inline-block;font:700 .75rem var(--font-ui);letter-spacing:.03em;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .4em;margin-right:.35em;vertical-align:.1em}
.cd-rt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px 20px;align-items:start}
.cd-qh{margin:0 0 6px;font-weight:700;font-size:.92rem;color:var(--ink-2)}
.cd-q{margin:0 0 4px}
.cd-qt{margin:0 0 4px}
.cd-qn{font-weight:700;color:var(--ink-2)}
.cd-qr .rg-wrap{margin:0 0 6px}
.cd-leaf{margin:6px 0 0;font-size:1rem}
.cd-tsvg{display:block;width:100%;height:auto}
.cd-pars{margin:8px 0 0}
.cd-ph{margin:0 0 6px}
.cd-pf{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.cd-pl{display:inline-flex;align-items:center;gap:8px}
.cd-pl input.cd-in{width:5.2em}
.cd-pchip .rg-wrap{margin:0}
.cd-cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 20px;margin:0 0 6px}
.cd-pick{border:1.5px solid var(--pen);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.cd-pick.two{border-color:var(--ev-b);border-style:dashed}
.cd-pk{margin:0 0 8px;font-weight:700}
.cd-sw{display:inline-block;width:.95em;height:.95em;border-radius:2px;margin-right:.4em;vertical-align:-.12em;background:var(--pen)}
.cd-sw.two{background:transparent;border:2.5px solid var(--ev-b)}
.cd-chart{margin:10px 0 0}
.cd-pw2{margin-top:8px}
canvas.plot.cd-plot{aspect-ratio:16/8}
.cd-empty{margin:8px 0}
.cd-empty:empty{display:none}
.cd-read{margin-top:8px}
.cd-chk{display:block;margin-top:4px;padding:4px 8px;border-left:3px solid var(--ink-2);background:var(--info-bg);border-radius:4px;font-size:.92rem}
.cd-bld{margin:14px 0 0;border:1.5px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--sheet)}
.cd-bld summary{font-weight:700;cursor:pointer;min-height:32px;display:list-item}
.cd-bldb{margin-top:8px}
.cd-br .rg-wrap{margin:0 0 8px}
.cd-bout{border-top:1px solid var(--rule);padding-top:6px}
.cd-bout p{margin:4px 0}

/* Part 3: Mixed problems */
.mx-tabs{margin-bottom:6px}
.mx-wrap{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.mx-task{margin:0 0 8px}
.mx-card{border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;margin:10px 0 0}
.mx-card.ok{border-color:var(--green)}
.mx-ct{margin:0 0 8px}
.mx-cn{font-weight:700;color:var(--ink-2);margin-right:.3em}
.mx-opts{margin:4px 0 0}
.mx-wrap details.alg{margin-top:12px}
.mx-bsvg{display:block;width:100%;max-width:340px;height:auto;margin:6px 0}
.mx-ax{stroke:var(--plot-axis);stroke-width:1.5}
.mx-bar.b0{fill:var(--pen)}
.mx-bar.b1{fill:var(--ev-b)}
.mx-bar.b2{fill:var(--ev-c)}
.mx-bv{font:700 12px var(--font-ui);fill:var(--ink);text-anchor:middle}
.mx-bl{font:600 11px var(--font-ui);fill:var(--ink-2);text-anchor:middle}
.mx-bq{font:700 20px var(--font-ui);fill:var(--ink-2);text-anchor:middle}
.mx-tab{border-collapse:collapse;margin:4px 0;font-size:.92rem}
.mx-tab th,.mx-tab td{border:1px solid var(--rule);padding:4px 8px;text-align:left}
.mx-tab td:last-child{font-variant-numeric:tabular-nums}
.mx-grid{display:grid;grid-template-columns:repeat(5,minmax(0,48px));gap:4px;margin:6px 0}
.mx-gh{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink-2)}
.mx-cell{min-height:44px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:700 1rem var(--font-ui)}
.mx-cell.on{background:var(--hi-soft);border-color:var(--sel-bd)}
.mx-cnt p{margin:8px 0 6px}
.mx-cnt .numrow{display:flex;flex-wrap:wrap;gap:8px 16px}
.mx-in{width:4em}
.mx-done{margin:12px 0 0}
.mx-tick{font-weight:700}

/* probEntry */
.pe-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pe-lab{display:inline-flex;align-items:center;gap:8px}

/* task */
.cd-conds{margin:6px 0 0;padding-left:1.3em}
.cd-conds li{margin:2px 0}
.cd-tk{margin:8px 0 6px}
canvas.plot.cd-tplot{aspect-ratio:4/3}

@media (max-width:760px){
  .cd-rt{grid-template-columns:minmax(0,1fr)}
  .cd-cmp{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .cd-tree{display:none}
  canvas.plot.cd-plot{aspect-ratio:4/3}
  .cd-pw2 canvas.plot.cd-plot,.cd-cmp ~ .cd-chart canvas.plot.cd-plot{aspect-ratio:16/10}
}

=\"10.0\" height=\"6.0\"/>\u003cline x1=\"0\" y1=\"42.5\" x2=\"60\" y2=\"42.5\"/>\u003c/svg>\u003cspan class=\"cd-hl\">Binomial\u003c/span>\u003c/span>\u003cspan class=\"cd-hh\" data-m=\"geo\">\u003csvg viewBox=\"0 0 60 44\" aria-hidden=\"true\" focusable=\"false\">\u003crect x=\"1.0\" y=\"6.0\" width=\"8.0\" height=\"36.0\"/>\u003crect x=\"11.0\" y=\"18.0\" width=\"8.0\" height=\"24.0\"/>\u003crect x=\"21.0\" y=\"26.0\" width=\"8.0\" height=\"16.0\"/>\u003crect x=\"31.0\" y=\"31.0\" width=\"8.0\" height=\"11.0\"/>\u003crect x=\"41.0\" y=\"35.0\" width=\"8.0\" height=\"7.0\"/>\u003crect x=\"51.0\" y=\"37.0\" width=\"8.0\" height=\"5.0\"/>\u003cline x1=\"0\" y1=\"42.5\" x2=\"60\" y2=\"42.5\"/>\u003c/svg>\u003cspan class=\"cd-hl\">Geometric\u003c/span>\u003c/span>\u003cspan class=\"cd-hh\" data-m=\"hyp\">\u003csvg viewBox=\"0 0 60 44\" aria-hidden=\"true\" focusable=\"false\">\u003crect x=\"1.0\" y=\"40.0\" width=\"10.0\" height=\"2.0\"/>\u003crect x=\"13.0\" y=\"28.0\" width=\"10.0\" height=\"14.0\"/>\u003crect x=\"25.0\" y=\"4.0\" width=\"10.0\" height=\"38.0\"/>\u003crect x=\"37.0\" y=\"28.0\" width=\"10.0\" height=\"14.0\"/>\u003crect x=\"49.0\" y=\"40.0\" width=\"10.0\" height=\"2.0\"/>\u003cline x1=\"0\" y1=\"42.5\" x2=\"60\" y2=\"42.5\"/>\u003c/svg>\u003cspan class=\"cd-hl\">Hypergeometric\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"cd-hq\">Which one fits?\u003c/span>\u003c/span>","eqLabel":"Four small histograms side by side: Uniform (flat), Binomial (a hump), Geometric (a staircase) and Hypergeometric (a narrow hump). Which one fits?","eqSize":"sm","headline":"Four models, one decision","text":"Before you calculate, decide \u003cstrong>which model\u003c/strong> fits. Ask: are all values equally likely? Is the number of trials \u003cstrong>fixed\u003c/strong>? Are we \u003cstrong>waiting\u003c/strong> for a first success? Are items drawn \u003cstrong>without replacement\u003c/strong> from a small group? The answers point to the \u003cstrong>uniform\u003c/strong>, \u003cstrong>binomial\u003c/strong>, \u003cstrong>geometric\u003c/strong> or \u003cstrong>hypergeometric\u003c/strong> distribution.","fig":{"html":"\u003cdiv class=\"cd-hfig\" id=\"cd-hfig\">\u003c/div>"}},"goals":["I can recognize a uniform distribution and find its expected value.","I can choose between the binomial, geometric and hypergeometric models using key questions about the situation.","I can identify the parameters and write the correct probability expression once the model is chosen.","I can compare the means, spreads and shapes of different discrete distributions.","I can solve mixed problems and justify my choice of model."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Binomial","goal":3,"prompt":"`n = 3`, `p = 1/2`. Find `P(X = 1)`.","options":[{"t":"`1/8`","why":"That’s one order only. There are 3 orders.","_n":"0193","_k":"75f0f986"},{"t":"`1/3`","why":"That’s 1 ÷ `n`.","_n":"1183","_k":"0d1d0f2a"},{"t":"`3/8`","why":"`C(3, 1)(1/2)^3`.","_n":"2173","_k":"b66892a9"},{"t":"`1/2`","why":"That’s one trial.","_n":"3163","_k":"25078c42"}],"hints":["`C(n, x) p^x q^{n - x}`.","3 × `1/8`.","`3/8`."]},{"id":"w2","skill":"Binomial","goal":2,"prompt":"Which is a condition of the binomial model?","options":[{"t":"Drawing without replacement","why":"That breaks independence.","_n":"4153","_k":"b75bcfa6"},{"t":"The same `p` on every trial","why":"Constant `p` is required.","_n":"5143","_k":"11db43e5"},{"t":"Waiting for the first success","why":"That’s geometric.","_n":"6133","_k":"8fe947d6"},{"t":"All values equally likely","why":"That’s uniform.","_n":"7223","_k":"48ffea2b"}],"hints":["Remember BINS.","S stands for ‘same `p`’.","The same `p` on every trial."]},{"id":"w3","skill":"Geometric","goal":3,"prompt":"`p = 1/4`. Find `E(X)`, where `X` = failures before the first success.","options":[{"t":"`1/4`","why":"That’s `p`.","_n":"8213","_k":"035963b3"},{"t":"`1/3`","why":"That’s `p ÷ q`.","_n":"9716","_k":"2813254a"},{"t":"3","why":"`q ÷ p`.","_n":"a726","_k":"2d7902ea"},{"t":"4","why":"That’s the average trial of the success, 1 ÷ `p`.","_n":"b6f6","_k":"195fccf1"}],"hints":["`E = q ÷ p`.","`(3/4) ÷ (1/4)`.","3."]},{"id":"w4","skill":"Hypergeometric","goal":3,"prompt":"From 5 red and 3 blue marbles, 2 are drawn without replacement. Find \u003ci>P\u003c/i>(both blue).","options":[{"t":"`1/28`","why":"`C(3, 2) = 3`, not 1.","_n":"c706","_k":"1379a459"},{"t":"`3/28`","why":"`C(3, 2) ÷ C(8, 2)`.","_n":"d756","_k":"3eced7b4"},{"t":"`9/64`","why":"That’s with replacement: `(3/8)^2`. These draws aren’t replaced.","_n":"e766","_k":"dbf37d0d"},{"t":"`3/8`","why":"That’s one draw.","_n":"f736","_k":"ad71d54f"}],"hints":["Choose 2 of the 3 blues.","Out of `C(8, 2) = 28`.","`3/28`."]},{"id":"w5","skill":"Hypergeometric","goal":4,"prompt":"`n = 12`, `a = 3`, `r = 4`. Find `E(X)`.","options":[{"t":"`1/4`","why":"That’s `a ÷ n`.","_n":"g746","_k":"502aa9a1"},{"t":"1","why":"4 × 3 ÷ 12.","_n":"h796","_k":"4d0a9814"},{"t":"3","why":"That’s `a`.","_n":"i7a6","_k":"e5ad50ca"},{"t":"12","why":"Divide `ra` by `n`.","_n":"j8b6","_k":"5ee57a33"}],"hints":["`ra ÷ n`.","12 ÷ 12.","1."]},{"id":"w6","skill":"Uniform","goal":1,"prompt":"A fair spinner has 4 equal sectors labelled 1, 2, 3, 4. Find `E(X)`.","options":[{"t":"`1/4`","why":"That’s each probability.","_n":"k8a6","_k":"feee6a59"},{"t":"2","why":"The middle of 1 to 4 is 2.5.","_n":"l896","_k":"586c20e2"},{"t":"2.5","why":"Equally likely values: the average is (1 + 4) ÷ 2.","_n":"m886","_k":"cad1026d"},{"t":"10","why":"That adds the values. Divide the total by 4.","_n":"n876","_k":"cb1c5666"}],"hints":["Each value has probability `1/4`.","(1 + 2 + 3 + 4) ÷ 4.","2.5."]}],"refreshers":{"Binomial":"Fixed `n`, independent trials, constant `p`: `C(n, x) p^x q^{n - x}`; `E = np`.","Geometric":"Waiting for the first success: `q^x p`; `E = q ÷ p`.","Hypergeometric":"Without replacement from a small group: `C(a, x) C(n - a, r - x) ÷ C(n, r)`; `E = ra ÷ n`.","Uniform":"`k` equally likely values, each with probability `1/k`; `E` is their average."}}},"explore":{"heading":"Distribution detective","intro":"Route each scenario through the questions, enter its parameters and see its distribution. Then compare two models side by side.","cards":[{"id":"s1","t":"A fair 10-sided die (1–10) is rolled once; `X` = the number","fit":"uni","par":{"k":10},"say":{"k":"the die has 10 faces"}},{"id":"s2","t":"8 coin tosses; `X` = heads","fit":"bin","par":{"n":8,"p":"1/2"},"say":{"n":"8 tosses","p":"a fair coin: heads has probability `1/2`"}},{"id":"s3","t":"Roll a die until a 6; `X` = non-6 rolls first","fit":"geo","par":{"p":"1/6"},"say":{"p":"success is rolling a 6"}},{"id":"s4","t":"Deal 4 cards; `X` = aces","fit":"hyp","par":{"n":52,"a":4,"r":4},"say":{"n":"a deck has 52 cards","a":"a deck has 4 aces","r":"4 cards are dealt"}},{"id":"s5","t":"Guess 10 multiple-choice questions with 5 options each; `X` = number correct","fit":"bin","par":{"n":10,"p":"1/5"},"say":{"n":"10 questions","p":"1 of 5 options is right"}},{"id":"s6","t":"A 3-person committee from 5 girls and 4 boys; `X` = girls","fit":"hyp","par":{"n":9,"a":5,"r":3},"say":{"n":"5 + 4 = 9 people","a":"5 girls","r":"a 3-person committee"}},{"id":"s7","t":"Spin (red `1/4`) until red; `X` = non-red spins first","fit":"geo","par":{"p":"1/4"},"say":{"p":"red has probability `1/4`"}},{"id":"s8","t":"A random student number from 1 to 30 wins a prize; `X` = the number","fit":"uni","par":{"k":30},"say":{"k":"the numbers run from 1 to 30"}},{"id":"s9","t":"Test 3 bulbs from a box of 12 with 2 defective; `X` = defective found","fit":"hyp","par":{"n":12,"a":2,"r":3},"say":{"n":"a box of 12","a":"2 are defective","r":"3 bulbs are tested"}},{"id":"s10","t":"Rain on each of 7 days, 30% each day independently; `X` = rainy days","fit":"bin","par":{"n":7,"p":"0.3"},"say":{"n":"7 days","p":"30% each day"}},{"id":"s11","t":"Roll two dice; `X` = the sum","fit":"none","par":{},"say":{},"note":"Values 2–12, not equally likely."},{"id":"s12","t":"Phone calls, each answered with probability `1/3`, until one is answered; `X` = unanswered calls","fit":"geo","par":{"p":"1/3"},"say":{"p":"each call is answered with probability `1/3`"}}],"predIntro":"Make a prediction first. Then the detective will show you what really happens.","predictions":[{"id":"p1","start":{"view":"route","card":1},"prompt":"Which model fits a single roll of a fair 10-sided die?","options":[{"t":"Uniform","_n":"o866","_k":"d3b5a881"},{"t":"Hypergeometric","_n":"p856","_k":"c50ad852"},{"t":"Geometric","_n":"q846","_k":"56a304ba"},{"t":"Binomial","_n":"r836","_k":"d2b77f5e"}],"explain":"Each value 1–10 is equally likely; `E = 5.5`."},{"id":"p2","start":{"view":"compare","a":"binomial (4, 1/2)","b":"hypergeometric (8, 4, 4)"},"prompt":"Both have mean 2. Which has the larger spread?","options":[{"t":"Neither has any spread","_n":"s826","_k":"9a504ef6"},{"t":"They’re equal","_n":"t856","_k":"d4aabdee"},{"t":"The binomial","_n":"u866","_k":"8185f5e7"},{"t":"The hypergeometric","_n":"v876","_k":"65c3a34e"}],"explain":"Without replacement, extreme results are less likely: drawing 4 of the 4 successes from 8 is rare."},{"id":"p3","start":{"view":"compare","a":"geometric (1/3)","b":"binomial (6, 1/3)"},"prompt":"How do their means compare?","options":[{"t":"They’re equal (2), but the geometric spreads much further","_n":"w886","_k":"82d78a13"},{"t":"The binomial’s mean is larger","_n":"x816","_k":"a7d1a6a6"},{"t":"They’re identical distributions","_n":"y826","_k":"eeb43fcc"},{"t":"The geometric’s mean is 3","_n":"z836","_k":"5b1ab906"}],"explain":"`(2/3) ÷ (1/3) = 2 = 6 × 1/3`. Same centre, very different shapes."},{"id":"p4","start":{"view":"route","card":11},"prompt":"Is the sum of two dice uniform?","options":[{"t":"It’s binomial","_n":"10846","_k":"5b859e4a"},{"t":"Yes, between 2 and 12","_n":"117d6","_k":"6bcab1a6"},{"t":"No: 7 is the most likely sum","_n":"127e6","_k":"4586bba3"},{"t":"Yes: 11 equally likely sums","_n":"13ff5","_k":"6ed7b450"}],"explain":"Count the ways: 1 way for 2, 6 ways for 7."}],"chalIntro":"Use the detective to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":4,"prompt":"In Compare view, set a binomial and a hypergeometric distribution so that \u003cstrong>both\u003c/strong> have mean 2.","why":"`np = 2` and `ra ÷ n = 2`: for example, binomial (4, `1/2`) with hypergeometric (10, 5, 4).","hints":["Binomial: `np`. Hypergeometric: `ra ÷ n`.","Pick `n = 4`, `p = 1/2` for the binomial.","Then try `r = 4` with `a ÷ n = 1/2`."]},{"id":"tc2","goal":4,"prompt":"Choose `p` for a geometric distribution with the same mean as the binomial (6, `1/3`).","why":"Geometric `p = 1/3`: `(2/3) ÷ (1/3) = 2 = 6 × 1/3`. Both means are 2.","hints":["The binomial mean is `6 × 1/3 = 2`.","You need `q ÷ p = 2`.","`p = 1/3`."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Build a scenario that the detective routes to \u003cstrong>geometric\u003c/strong> with `E(X) = 3`. Use the scenario builder in Route it view.","why":"A spinner with `p = 1/4` (or the bag \u003cstrong>with\u003c/strong> replacement, `3/12 = 1/4`), until the first red, counting non-reds: `(3/4) ÷ (1/4) = 3`.","hints":["Geometric needs ‘until the first success’, a constant `p`, and counting failures.","You need `q ÷ p = 3`, so `p = 1/4`.","A spinner with `p = 1/4`, or the bag with replacement (3 of 12 is `1/4`)."]}]},"part3":{"slug":"mixed","name":"Mixed problems","heading":"Mixed problems","intro":"Real problems don’t announce their model. At each station, name the model before you calculate. The “Check it with algebra” panel shows why another model would give a different answer.","stations":{"s1":{"t":"A bag holds 6 red and 4 blue marbles.","parts":[{"id":"a","q":"Draw 3 \u003cstrong>with\u003c/strong> replacement; `X` = reds. Find `P(X = 2)`.","fit":"bin","calc":"Binomial (3, 0.6): `P(X = 2) = 3(0.36)(0.4) = 0.432`.","v":0.432,"wrong":{"hyp":"With replacement, every draw has the same `p`: binomial.","geo":"There’s a fixed number of draws: 3.","uni":"The values 0–3 aren’t equally likely."}},{"id":"b","q":"Draw 3 \u003cstrong>without\u003c/strong> replacement; `X` = reds. Find `P(X = 2)`.","fit":"hyp","calc":"Hypergeometric: `C(6, 2) C(4, 1) ÷ C(10, 3) = 60/120 = 0.5`.","v":0.5,"wrong":{"bin":"Without replacement from a small group, use the hypergeometric.","geo":"There’s a fixed number of draws: 3.","uni":"The values 0–3 aren’t equally likely."}},{"id":"c","q":"Draw \u003cstrong>with\u003c/strong> replacement until the first blue; `X` = reds first. Find `P(X = 2)`.","fit":"geo","calc":"Geometric (0.4): `P(X = 2) = (0.6)^2(0.4) = 0.144`.","v":0.144,"wrong":{"bin":"‘Until the first …’ means there’s no fixed number of trials: geometric.","hyp":"The marbles go back, and you’re waiting for the first blue.","uni":"The values aren’t equally likely."}}]},"s2":{"t":"A goalie stops `3/4` of penalty shots. `X` = saves before the first goal.","right":"Success = a goal, the event you’re waiting for. So `p = 1/4` and `E(X) = (3/4) ÷ (1/4) = 3`.","wrong":"Success is the event you’re counting or waiting for. Here the wait ends at the first goal, so success = a goal.","alt":"With `p = 3/4` you’d get `E = (1/4) ÷ (3/4) = 1/3`: that counts goals before the first save, not saves before the first goal."},"s3":{"t":"10 people are polled from a city of 2 000 000, where 40% bike to work. `X` = people who bike.","right":"Strictly, the people are chosen without replacement from a fixed population: hypergeometric.","wrong":"No one is polled twice: the people are chosen without replacement. Strictly, that’s hypergeometric.","after":"Sampling 10 people from millions is so close to independent that the binomial is the sensible model."},"s4":{"t":"A spinner with 4 equal sectors (1, 2, 3, 4) is spun twice, and `X` = the larger number.","lesson":"Not every variable has a named model. You can always build the table from the sample space."}},"quickCheck":{"title":"Quick check","summary":"Mixed problems quick check","items":[{"id":"q1","goal":2,"prompt":"Deal 5 cards; `X` = hearts.","choices":[{"t":"Geometric","fb":"Dealing cards changes the deck. Without replacement from a small group, use the hypergeometric.","_n":"14fe5","_k":"2dfc12c0"},{"t":"Hypergeometric","fb":"Right. A fixed number of cards, dealt without replacement from a 52-card deck.","_n":"15015","_k":"4fa61d84"},{"t":"Binomial","fb":"Dealing cards changes the deck. Without replacement from a small group, use the hypergeometric.","_n":"16005","_k":"804f5bb1"},{"t":"Uniform","fb":"Dealing cards changes the deck. Without replacement from a small group, use the hypergeometric.","_n":"17035","_k":"ebaf3e47"}]},{"id":"q2","goal":2,"prompt":"Roll until a 1; `X` = rolls before it.","choices":[{"t":"Binomial","fb":"‘Until the first …’ means there’s no fixed number of trials: geometric.","_n":"18025","_k":"b9074015"},{"t":"Uniform","fb":"‘Until the first …’ means there’s no fixed number of trials: geometric.","_n":"19055","_k":"43afe16f"},{"t":"Hypergeometric","fb":"‘Until the first …’ means there’s no fixed number of trials: geometric.","_n":"1a045","_k":"f7bc91da"},{"t":"Geometric","fb":"Right. You wait for the first 1, with `p = 1/6` each roll.","_n":"1bf75","_k":"3e5a337f"}]},{"id":"q3","goal":1,"prompt":"A fair 12-sided die; `X` = the number shown.","choices":[{"t":"None","fb":"Each of 1–12 is equally likely, with probability `1/12`: uniform.","_n":"1cf65","_k":"a1cdebd0"},{"t":"Binomial","fb":"Each of 1–12 is equally likely, with probability `1/12`: uniform.","_n":"1df95","_k":"807addbc"},{"t":"Uniform","fb":"Right. Each of 1–12 has probability `1/12`.","_n":"1efa5","_k":"44fa07c2"},{"t":"Geometric","fb":"Each of 1–12 is equally likely, with probability `1/12`: uniform.","_n":"1ff75","_k":"a5488b40"}]},{"id":"q4","goal":2,"prompt":"Flip a coin 9 times; `X` = heads.","choices":[{"t":"Geometric","fb":"9 fixed, independent flips with the same `p = 1/2`: binomial.","_n":"1gf85","_k":"d353fdce"},{"t":"Uniform","fb":"9 fixed, independent flips with the same `p = 1/2`: binomial.","_n":"1hf55","_k":"01a190d4"},{"t":"Binomial","fb":"Right. 9 independent flips, each a head with `p = 1/2`.","_n":"1if65","_k":"cd5edfc1"},{"t":"Hypergeometric","fb":"9 fixed, independent flips with the same `p = 1/2`: binomial.","_n":"1jf35","_k":"c92d91d0"}]}]}},"practice":{"activities":[{"id":"route","type":"sorter","title":"Route the scenario","summary":"Route the scenario","goal":[1,2],"noun":"scenario","txt":true,"instruction":"Sort each scenario into the model that fits it.","boxes":[{"id":"uni","label":"Uniform"},{"id":"bin","label":"Binomial"},{"id":"geo","label":"Geometric"},{"id":"hyp","label":"Hypergeometric"},{"id":"none","label":"None of these"}],"items":[{"id":"r1","t":"Pick a random day of the week; `X` = its number (1–7)","_a":"Fk1XW0Y=","goal":1,"why":"7 values, each with probability `1/7`.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Uniform."]},{"id":"r2","t":"12 penalty shots, each saved with probability 0.7; `X` = saves","_a":"FlpQXEY=","goal":2,"why":"A fixed 12 shots, each saved with the same `p = 0.7`.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Binomial."]},{"id":"r3","t":"Shoot until the first goal; `X` = misses first","_a":"Fl9cXUY=","goal":2,"why":"Waiting for the first goal: geometric.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Geometric."],"wrong":{"bin":"There’s no fixed number of shots."}},{"id":"r4","t":"Choose 5 of 20 songs for a playlist (8 are Canadian); `X` = Canadian songs","_a":"FlBAQkY=","goal":2,"why":"5 songs chosen without replacement from a small group of 20.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Hypergeometric."]},{"id":"r5","t":"Roll two dice; `X` = the product","_a":"FlZWXAFD","goal":1,"why":"Products aren’t equally likely, and they aren’t a count of successes: no named model fits.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","None of these."],"wrong":{"uni":"Products aren’t equally likely: 6 comes up 4 ways, 1 only once."}},{"id":"r6","t":"Draw 4 marbles with replacement from 3 red and 7 blue; `X` = reds","_a":"FlpQXEY=","goal":2,"why":"With replacement, all 4 draws have `p = 0.3`.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Binomial."],"wrong":{"hyp":"With replacement, every draw has `p = 0.3`."}},{"id":"r7","t":"Open boxes until finding a prize (1 in 10 has one); `X` = empty boxes first","_a":"Fl9cXUY=","goal":2,"why":"Waiting for the first prize, `p = 1/10` each box.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Geometric."]},{"id":"r8","t":"Draw 3 tiles from 10 (4 vowels) without replacement; `X` = vowels","_a":"FlBAQkY=","goal":2,"why":"3 tiles drawn without replacement from a small group of 10.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Hypergeometric."]},{"id":"r9","t":"A random integer from 1 to 100; `X` = the integer","_a":"Fk1XW0Y=","goal":1,"why":"100 values, each with probability `1/100`.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","Uniform."]},{"id":"r10","t":"Toss a coin 6 times; `X` = the length of the longest run of heads","_a":"FlZWXAFD","goal":2,"why":"`X` is a run length, not a count of successes, and its values aren’t equally likely: no named model fits.","hints":["Equally likely values?","Fixed trials? Replacement? Waiting?","None of these."]}],"wrongDefault":"Ask the four questions in order."},{"id":"calc","type":"custom","title":"Mixed calculations","summary":"Mixed calculations","goal":[1,3,4,5],"instruction":"Choose the model, then find each value. Items marked ★ are non-routine; M5 and M7 go beyond the Final Check.","how":"Type a whole number, a fraction such as 9/64 or a decimal, then press Check.","items":[{"id":"m1","goal":1,"prompt":"A spinner has 4 equal sectors labelled 2, 4, 6, 8. `E(X)`?","_a":"AQ==","display":"5","why":"Uniform: `(2 + 4 + 6 + 8) ÷ 4 = 20 ÷ 4 = 5`.","wrong":[{"match":20,"fb":"Divide the total by 4."}]},{"id":"m2","goal":3,"prompt":"`n = 3`, `p = 1/4`: binomial `P(X = 2)`.","_a":"BBYIBlRXClc=","display":"`9/64`","why":"`C(3, 2)(1/4)^2(3/4) = 3 × 3/64 = 9/64`.","wrong":[{"match":0.046875,"fb":"Multiply by `C(3, 2) = 3`."}]},{"id":"m3","goal":3,"prompt":"Geometric, `p = 1/5`: `P(X = 2)`.","_a":"BBYIAFw=","display":"`16/125`","why":"`(4/5)^2(1/5) = 16/125`.","wrong":[{"match":0.16,"fb":"Two failures: `(4/5)^2`, then the success, `1/5`."}]},{"id":"m4","goal":3,"prompt":"Hypergeometric, `n = 7`, `a = 3`, `r = 2`: `P(X = 1)`.","_a":"BBYMBVVVCloBDwgGVlkNVQUM","display":"`4/7`","why":"`C(3, 1) C(4, 1) ÷ C(7, 2) = 12/21 = 4/7`.","wrong":[{"match":0.4897959183673469,"fb":"That’s with replacement. Dealing cards changes the deck. Without replacement from a small group, use the hypergeometric."}]},{"id":"m5","goal":5,"star":true,"prompt":"A bag has 6 items, 2 of them prizes. Draw \u003cstrong>without replacement\u003c/strong> until the first prize. \u003ci>P\u003c/i>(the first prize is on the 3rd draw)?","_a":"BBYL","display":"`1/5`","why":"Not geometric: the bag changes. `(4/6)(3/5)(2/4) = 24/120 = 1/5`.","wrong":[{"match":0.14814814814814814,"fb":"That’s geometric, but the bag changes after each draw: `(4/6)(3/5)(2/4)`."}],"hints":["Is the probability constant from draw to draw?","No. Multiply: non-prize, non-prize, prize.","`(4/6)(3/5)(2/4) = 1/5`."]},{"id":"m6","goal":4,"star":true,"prompt":"Hypergeometric with `r = 3` and `a = 4` has `E(X) = 2`. Find the group size `n`.","_a":"Ag==","display":"6","why":"`ra ÷ n = 12 ÷ n = 2`, so `n = 6`.","wrong":[{"match":24,"fb":"`ra ÷ n = 2`, so `n = 12 ÷ 2`."}]},{"id":"m7","goal":4,"star":true,"prompt":"A binomial (`n`, `1/4`) and a geometric (`1/4`) have equal means. Find `n`.","_a":"BQo=","display":"12","why":"Geometric `E = q ÷ p = (3/4) ÷ (1/4) = 3`, so `n × 1/4 = 3` and `n = 12`.","wrong":[{"match":16,"fb":"Geometric `E = q ÷ p = 3`, not 4."}]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Zuri","how":"","goal":[1,2,3],"instruction":"Zuri made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"4 cards are dealt from a deck. Find \u003ci>P\u003c/i>(exactly 1 heart).","steps":["Each card is either a heart or not.","So it’s binomial with `n = 4`, `p = 1/4`.","`P = C(4, 1)(1/4)(3/4)^3 = 27/64`."],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Dealing is without replacement: hypergeometric, `P = C(13, 1) C(39, 3) ÷ C(52, 4)`.","why":"Dealing cards changes the deck. Without replacement from a small group, use the hypergeometric.","_n":"1kf45","_k":"e9306ca1"},{"t":"Step 2 is correct.","why":"Each card dealt changes the deck.","_n":"1l015","_k":"84a4edfa"},{"t":"Uniform: `P = 1/5`.","why":"The 5 values aren’t equally likely.","_n":"1m025","_k":"17d3dfec"},{"t":"Geometric with `p = 1/4`.","why":"We’re not waiting for a first heart.","_n":"1nf35","_k":"ae7fcfac"}],"hints":["Is each card put back?","No: dependent draws.","Hypergeometric."]},{"id":"e2","goal":3,"task":"A shooter makes `4/5` of her free throws. `X` = makes before her first miss. Find `E(X)`.","steps":["This is a waiting time: geometric.","`p = 4/5`, her success rate.","`E = q ÷ p = (1/5) ÷ (4/5) = 1/4`."],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Use `E = 1 ÷ p = 5/4`.","why":"That’s not the fix.","_n":"1of25","_k":"9f96eb58"},{"t":"She’s waiting for a miss, so success = miss and `p = 1/5`: `E = (4/5) ÷ (1/5) = 4`.","why":"Success is the event you’re counting or waiting for. A shooter waiting for her first miss has `p = P(miss)`.","_n":"1pf15","_k":"d96627ab"},{"t":"Step 2 is correct.","why":"Success is the event you’re waiting for.","_n":"1qf05","_k":"4e4ab134"},{"t":"It’s binomial with `n = 5`.","why":"There’s no fixed `n`.","_n":"1rf75","_k":"94fcc13c"}],"hints":["Which event ends the wait?","A miss.","`p = 1/5`, `E = 4`."]},{"id":"e3","goal":1,"task":"Two dice are rolled. Find \u003ci>P\u003c/i>(sum = 7).","steps":["The sums run from 2 to 12: 11 values.","Each sum is equally likely, so the sum is uniform.","`P(7) = 1/11`."],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Count the outcomes: 6 of 36 give 7, so `P = 1/6`. The sums aren’t uniform.","why":"Sums of dice aren’t equally likely: 7 has 6 ways, 2 has 1.","_n":"1sf65","_k":"51dbc073"},{"t":"`P(7) = 2/36`.","why":"Six pairs give 7.","_n":"1tf55","_k":"79b448b0"},{"t":"Step 2 is correct.","why":"1 + 1 is the only way to get 2; there are six ways to get 7.","_n":"1uf45","_k":"f4a95744"},{"t":"`P(7) = 7/12`.","why":"That’s not a probability model.","_n":"1vfb5","_k":"080cb869"}],"hints":["How many ways give 2? Give 7?","1 and 6.","`6/36 = 1/6`."]}]}]},"reflect":{"journal":[{"id":"j1","q":"Which comparison surprised you more: binomial vs hypergeometric spread, or geometric vs binomial with the same mean?"},{"id":"j2","q":"In your own words, list the questions you ask to choose a model, and say why their order matters."},{"id":"j3","q":"Explain to a friend how one bag of marbles can lead to three different models."},{"id":"j4","q":"Which model do you most often mix up? What clue will you look for next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"A bag has 6 red and 4 blue marbles. 3 are drawn \u003cstrong>without\u003c/strong> replacement; `X` = reds. Which model fits?","options":[{"t":"Geometric","why":"There’s no waiting for a first success.","_n":"1wfa5","_k":"4c1cd4d3"},{"t":"Hypergeometric","why":"Fixed draws, no replacement, a small group.","_n":"1xed5","_k":"b10a1fcb"},{"t":"Binomial","why":"Without replacement, the probability changes. Dealing cards changes the deck. Without replacement from a small group, use the hypergeometric.","_n":"1yee5","_k":"66b6edc4"},{"t":"Uniform","why":"The values aren’t equally likely.","_n":"1zef5","_k":"067e3e2c"}]},"b":{"prompt":"The same bag, but 3 are drawn \u003cstrong>with\u003c/strong> replacement; `X` = reds. Which model fits?","options":[{"t":"Binomial","why":"Each draw has `p = 0.6`.","_n":"20f05","_k":"32364d4f"},{"t":"Hypergeometric","why":"With replacement, the draws are independent. With replacement, every draw has the same `p`: binomial.","_n":"21f15","_k":"7b43c000"},{"t":"Uniform","why":"The values 0–3 aren’t equally likely.","_n":"22f25","_k":"aa41f59c"},{"t":"Geometric","why":"There’s a fixed number of draws.","_n":"23f35","_k":"85d1a2b0"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which variable has a uniform distribution?","options":[{"t":"The number on a fair 8-sided die","why":"Each of 1–8 has probability `1/8`.","_n":"24f45","_k":"1b2da7df"},{"t":"Tails before the first head","why":"That’s geometric.","_n":"25f55","_k":"6f0658b8"},{"t":"The sum of two dice","why":"Sums of dice aren’t equally likely: 7 has 6 ways, 2 has 1.","_n":"26f65","_k":"a6de6fac"},{"t":"The number of heads in 2 tosses","why":"0, 1 and 2 have probabilities `1/4`, `1/2` and `1/4`.","_n":"27077","_k":"7a56f708"}]},"b":{"prompt":"A spinner has 5 equal sectors numbered 1 to 5. Find `E(X)`.","options":[{"t":"`1/5`","why":"That’s each probability.","_n":"28067","_k":"6420aa02"},{"t":"2.5","why":"The middle of 1 to 5 is 3.","_n":"29097","_k":"4c23dad8"},{"t":"3","why":"(1 + 5) ÷ 2.","_n":"2a087","_k":"9c4841de"},{"t":"15","why":"That’s the sum.","_n":"2b037","_k":"24649b31"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"A die is rolled until a 6 appears; `X` = non-6 rolls before it. Which model and parameter?","options":[{"t":"Uniform on 1 to 6","why":"That describes the face on one roll, not the wait for a 6.","_n":"2c027","_k":"81c22b79"},{"t":"Binomial with `n = 6`, `p = 1/6`","why":"‘Until the first …’ means there’s no fixed number of trials: geometric.","_n":"2d057","_k":"63dc32c1"},{"t":"Geometric with `p = 5/6`","why":"Success is the event you’re waiting for: the 6, with `p = 1/6`.","_n":"2e047","_k":"1f45b3a9"},{"t":"Geometric with `p = 1/6`","why":"Waiting for the first 6, which has probability `1/6` on each roll.","_n":"2fff7","_k":"647dce2d"}]},"b":{"prompt":"A shooter makes 80% of her free throws. She shoots until her first miss; `X` = makes before it. Which model and parameter?","options":[{"t":"Geometric with `p = 0.2`","why":"Success = the miss she’s waiting for.","_n":"2gfe7","_k":"c7f2c843"},{"t":"Binomial with `p = 0.8`","why":"‘Until her first miss’ means there’s no fixed number of trials: geometric.","_n":"2h017","_k":"79c36609"},{"t":"Hypergeometric","why":"Nothing is drawn from a small group; she shoots until a miss.","_n":"2i027","_k":"245d8197"},{"t":"Geometric with `p = 0.8`","why":"Success is the event you’re counting or waiting for. A shooter waiting for her first miss has `p = P(miss)`.","_n":"2jff7","_k":"2eb6791e"}]}},{"id":"t1","cat":"T","goal":5,"a":{"prompt":"A 5-question true/false quiz is answered by guessing. Find \u003ci>P\u003c/i>(exactly 4 correct).","options":[{"t":"`1/32`","why":"That’s one order.","_n":"2k007","_k":"103137a7"},{"t":"`5/32`","why":"Binomial: `C(5, 4)(1/2)^5`.","_n":"2l057","_k":"bca8a396"},{"t":"`10/32`","why":"That’s `P(exactly 2)` or `P(exactly 3)`.","_n":"2m067","_k":"65c857b7"},{"t":"`1/2`","why":"The scores aren’t equally likely.","_n":"2n037","_k":"1201342d"}]},"b":{"prompt":"A class of 6 has 2 left-handed students. 3 are chosen at random. Find \u003ci>P\u003c/i>(exactly 1 left-handed).","options":[{"t":"`1/10`","why":"Also choose the 2 right-handed students.","_n":"2o047","_k":"40d038e7"},{"t":"`1/3`","why":"That’s 2 ÷ 6.","_n":"2pf97","_k":"ecf4cf63"},{"t":"`4/9`","why":"That’s the binomial with `p = 1/3`. Dealing cards changes the deck. Without replacement from a small group, use the hypergeometric.","_n":"2qfa7","_k":"88d549de"},{"t":"`3/5`","why":"Hypergeometric: `C(2, 1) C(4, 2) ÷ C(6, 3) = 12/20`.","_n":"2rdbb","_k":"aea7bf48"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"Binomial (`n = 4`, `p = 1/2`) and hypergeometric (`n = 8`, `a = 4`, `r = 4`). Which statement is true?","options":[{"t":"They’re identical","why":"Their probabilities differ: `P(X = 4)` is `1/16` vs `1/70`.","_n":"2sdcb","_k":"ed5f581b"},{"t":"Both have mean 2; the hypergeometric has the smaller spread","why":"`σ = 1` for the binomial and `σ ≈ 0.76` for the hypergeometric: without replacement narrows it.","_n":"2td9b","_k":"b243799d"},{"t":"Their means differ","why":"`4 × 1/2 = 4 × 4/8 = 2`.","_n":"2udab","_k":"b6907f07"},{"t":"Both have mean 2; the binomial has the smaller spread","why":"Without replacement narrows the distribution.","_n":"2vd7b","_k":"79a9062e"}]},"b":{"prompt":"Geometric (`p = 1/3`) and binomial (`n = 4`, `p = 1/2`). Which statement is true?","options":[{"t":"The binomial has the larger mean","why":"Both are 2.","_n":"2wd8b","_k":"6065a790"},{"t":"Both have mean 2, but the geometric can take any whole-number value and is skewed right, so it’s more spread out","why":"`(2/3) ÷ (1/3) = 2 = 4 × 1/2`, but the geometric’s tail runs on past 4.","_n":"2xd5b","_k":"c88f8aad"},{"t":"Both have mean 2 and the same spread","why":"The geometric runs far past 4.","_n":"2yd6b","_k":"8f7d8e48"},{"t":"The geometric’s mean is 3","why":"That’s 1 ÷ `p`, the trial number.","_n":"2ze3b","_k":"af4837f1"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"A carton of 12 eggs has 2 cracked. Eggs are taken one at a time without replacement until a cracked one appears. Find \u003ci>P\u003c/i>(the first cracked egg is the 3rd one taken).","options":[{"t":"`25/216`","why":"That’s the geometric, but the carton changes after each egg.","_n":"30e4b","_k":"03a5fe57"},{"t":"`3/22`","why":"`(10/12)(9/11)(2/10)`.","_n":"31e1b","_k":"aeb000d4"},{"t":"`1/6`","why":"That’s the first egg only.","_n":"32e0b","_k":"79a5e48d"},{"t":"`9/22`","why":"That’s \u003ci>P\u003c/i>(exactly one cracked egg among 3).","_n":"33e3b","_k":"4a91433b"}]},"b":{"prompt":"A box of 10 pens has 3 dry. Pens are tested one at a time without replacement until a dry one is found. Find \u003ci>P\u003c/i>(the first dry pen is the 2nd tested).","options":[{"t":"`21/100`","why":"Geometric, but the box changes.","_n":"34e2b","_k":"63b66b9d"},{"t":"`7/30`","why":"`(7/10)(3/9)`.","_n":"35e5b","_k":"101c3e64"},{"t":"`3/10`","why":"That’s the first pen.","_n":"36e4b","_k":"690d301d"},{"t":"`7/15`","why":"That’s \u003ci>P\u003c/i>(exactly one dry pen among 2).","_n":"37e7b","_k":"fc9c93c3"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"10 people are surveyed from a city of 2 000 000, where 40% bike. Which is the best justification for using the binomial?","options":[{"t":"“Surveys are always binomial.”","why":"Small groups need the hypergeometric.","_n":"38e6b","_k":"63fcccdd"},{"t":"“People are surveyed with replacement.”","why":"They aren’t, and it doesn’t matter here.","_n":"39d9b","_k":"7114cc30"},{"t":"“The population is so large that removing 10 people barely changes the 40%, so the responses are nearly independent with constant `p`.”","why":"Sampling 10 people from millions is so close to independent that the binomial is the sensible model.","_n":"3ad8b","_k":"b317a71a"},{"t":"“40% is less than 50%.”","why":"`p`’s size doesn’t decide the model.","_n":"3bcfa","_k":"7d89498c"}]},"b":{"prompt":"Why is ‘rolls until a 6’ geometric rather than binomial?","options":[{"t":"“Because a 6 is rare.”","why":"Rarity doesn’t decide the model.","_n":"3cd0a","_k":"92a6bafa"},{"t":"“There’s no fixed number of trials: we keep rolling until the first success.”","why":"‘Until the first …’ means there’s no fixed number of trials: geometric.","_n":"3dd1a","_k":"b3b4b243"},{"t":"“Because the rolls are dependent.”","why":"They’re independent.","_n":"3ed2a","_k":"f71d3676"},{"t":"“Because each v
