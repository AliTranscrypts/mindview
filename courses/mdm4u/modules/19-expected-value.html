.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 19: Balance point (D7 seesaw, game designer, long run), Is it worth it? stations, moneyEntry, Design a fair game.
   Histogram bars --pen; beam and fulcrum --ink; markers --ink-2; running average --pen (course plan §3). */
/* radioGroup (from MDM4U 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 18) */
.xv-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.xv-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.xv-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.xv-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.xv-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}
@media (prefers-reduced-motion:reduce){.xv-sw .cc-track,.xv-sw .cc-knob{transition:none}}

/* Balance point */
.xv-top{margin-bottom:4px}
canvas.plot.xv-plot{aspect-ratio:16/10}
canvas.plot.xv-lrplot{aspect-ratio:16/9}
.xv-cap{font-size:clamp(1.15rem,2.6vw,1.5rem)}
.xv-show{display:flex;flex-wrap:wrap;gap:2px 18px;margin:6px 0 0}
.xv-lrbox{margin-top:10px}
.xv-aha{margin:12px 0 0;font-size:.95rem}
.xv-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.xv-sh{margin:0 0 8px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.xv-sh2{margin-top:12px}
.xv-how{margin:8px 0 0}
.xv-msg{min-height:1.2em;margin:6px 0 0}
.xv-brows{display:grid;gap:6px}
.xv-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:4px 0;border-bottom:1px solid var(--rule)}
.xv-rl{font-weight:700;font-size:.88rem;color:var(--ink-2);margin-left:4px}
.xv-stb{min-width:38px;min-height:36px;padding:0 .5em}
.xv-ov{min-width:2.4em;text-align:center;font:700 1.08rem var(--font-math)}
.xv-op{min-width:3.6em}
.xv-lock{min-height:36px;margin-left:auto}
.xv-lock[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.xv-cost{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 0}
.xv-cl{font-weight:700;min-width:6.6em}
.xv-dol{font-weight:700}
.xv-in{width:5.6rem}
.xv-prizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 14px}
.xv-prize{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.xv-prize label{display:flex;flex-direction:column;gap:2px}
.xv-pl{font-size:.88rem;font-weight:700}
.xv-pin{display:inline-flex;align-items:center;gap:4px}
.xv-pbtn{display:inline-flex;gap:4px;align-self:flex-end}
.xv-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}
.xv-ex{margin-left:6px;min-height:30px;padding:0 .6em;font-size:.8rem}
.xv-ex[aria-pressed="true"]{background:var(--hi-soft)}
.xv-verdict{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:.05em .7em;font-weight:700;font-size:.92rem}
.xv-v0{background:var(--good-bg)}
.xv-vh,.xv-vp{background:var(--info-bg)}
.xv-tbl{margin-top:12px}
.xv-nw{white-space:nowrap}
.xv-tbl-m{display:none}
.xv-conds{margin:6px 0 0;padding-left:1.3em}
.xv-conds li{margin:2px 0}

/* Is it worth it? */
.wi-tabs{margin-bottom:6px}
.wi-card0{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.wi-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.wi-text{margin:0 0 10px}
.wi-item{margin:0 0 10px}
.wi-item .numrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.wi-after{margin:10px 0;font-weight:600}
.wi-sl{display:block;max-width:420px;margin:6px 0 10px}
canvas.plot.wi-plot{aspect-ratio:16/9;max-width:560px}
.wi-card{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.wi-quote{margin:0 0 8px;font-weight:600}
.wi-bins{display:flex;flex-wrap:wrap;gap:8px}
.wi-bin{min-height:38px}
.wi-bin[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.xv-tick{font-weight:700}

/* moneyEntry */
.xv-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:4px 0 8px}
.xv-pk{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.92rem;min-height:36px}
.xv-pk[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.xv-pk:disabled{opacity:.6}

/* Design a fair game */
.fg-in{margin:10px 0}
.fg-in .rg-lab{min-width:7.4em}
.fg-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.fg-spin{flex:0 0 150px}
.fg-tbl{flex:1 1 240px;min-width:0}
.xv-spin{display:block;width:150px;height:150px}
.xv-sec{stroke:var(--sheet);stroke-width:2}
.xv-sec0,.xv-sec2{fill:var(--ev-a-soft)}
.xv-sec1,.xv-sec3{fill:var(--ev-b-soft)}
.xv-st{fill:var(--ink);font:700 19px var(--font-ui);text-anchor:middle;dominant-baseline:central}
.xv-rim{fill:none;stroke:var(--ink);stroke-width:2}
.xv-hub{fill:var(--ink)}

@media (max-width:560px){
  .xv-tbl-m{display:block}
  .xv-tbl-d{display:none}
  canvas.plot.xv-plot,canvas.plot.xv-lrplot,canvas.plot.wi-plot{aspect-ratio:4/3}
  .xv-cl{flex-basis:100%}
  .xv-prizes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .xv-in{width:4.6rem}
  .xv-lock{margin-left:0}
}

,"title":"Frequency Distributions & Histograms","kind":"topic","group":"5"},{"nn":"34","slug":"scatter-plots","title":"Scatter Plots & Correlation","kind":"topic","group":"6"},{"nn":"35","slug":"pearson-r","title":"The Pearson Correlation Coefficient r","kind":"topic","group":"6"},{"nn":"36","slug":"linear-regression","title":"Linear Regression & Line of Best Fit","kind":"topic","group":"6"},{"nn":"37","slug":"residuals","title":"Residuals & Goodness of Fit","kind":"topic","group":"6"},{"nn":"38","slug":"causation","title":"Two-Variable Analysis & Causation","kind":"topic","group":"6"},{"nn":"39","slug":"culminating-investigation","title":"Culminating Data-Management Investigation","kind":"topic","group":"7"}]},"salt":"a7f992fc","content":{"id":"19-expected-value","kind":"topic","title":"Expected value","topic":"Expected Value","readyTopic":"expected value","hero":{"eq":"`E(X) = Σ xP(X = x)` = the balance point","eqLabel":"E of X equals the sum of x times P of X equals x, which is the balance point.","eqSize":"sm","headline":"The average you’d get in the long run","text":"Weight each value by its probability and add: that’s the \u003cstrong>expected value\u003c/strong> `E(X)`. It’s where the probability histogram would balance, and it’s the average you’d see over many trials. For games, compute the expected \u003cstrong>net gain\u003c/strong>: if it’s 0, the game is \u003cstrong>fair\u003c/strong>.","fig":{"aria":"A probability histogram for a fair die, six equal bars, sits on a seesaw. A fulcrum slides to 3.5 and the seesaw levels. Then the bar for 6 grows, the seesaw tips to the right, and the fulcrum slides right to 4 to restore balance. Caption: balance point = expected value.","shape":"wide"}},"goals":["I can calculate `E(X) = Σ xP(X = x)` from a distribution.","I can interpret `E(X)` as a long-run average, which need not be a possible or most likely value.","I can find the expected net gain of a game, decide whether it is fair, and find a fair price or prize.","I can use expected value to compare choices like insurance and warranties, and say what it leaves out.","I can work backwards from a given expected value to a missing value or probability.","I can connect `E(X)` to the running average of a simulation."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Weighted averages","goal":1,"prompt":"A course mark is 40% tests and 60% assignments. A student has 70 on tests and 80 on assignments. Final mark?","options":[{"t":"74","why":"That swaps the weights: 0.6 × 70 + 0.4 × 80. Tests count 40%.","_n":"03d8","_k":"36e8bf75"},{"t":"75","why":"That’s the plain average of 70 and 80. The weights aren’t equal.","_n":"13e8","_k":"59d15b4d"},{"t":"76","why":"0.4 × 70 + 0.6 × 80 = 28 + 48.","_n":"23f8","_k":"eba8d016"},{"t":"150","why":"Adding the marks gives a total, not a mark. Multiply each mark by its weight, then add.","_n":"3408","_k":"124ff30f"}],"hints":["Multiply each mark by its weight.","28 + 48.","76."]},{"id":"w2","skill":"Weighted averages","goal":1,"prompt":"In a class, 10 students have 1 sibling, 6 have 2 and 4 have 0. What is the mean number of siblings?","options":[{"t":"1","why":"That’s the average of the values 0, 1 and 2. Unlikely values should count less. Multiply each value by its probability, then add.","_n":"4418","_k":"7266acc1"},{"t":"1.1","why":"(10 × 1 + 6 × 2 + 4 × 0) ÷ 20 = 22 ÷ 20.","_n":"5428","_k":"08895ae8"},{"t":"2","why":"2 is the largest value, not the mean. Total siblings ÷ total students.","_n":"6438","_k":"ebe4a179"},{"t":"7.3","why":"That’s 22 ÷ 3. Divide by the number of students.","_n":"7348","_k":"63c791b6"}],"hints":["Total siblings ÷ total students.","22 ÷ 20.","1.1."]},{"id":"w3","skill":"Distributions","goal":1,"prompt":"`X` = 0, 1, 2 with `P` = 0.5, 0.3, `k`. Find `k`.","options":[{"t":"0.2","why":"Probabilities add to 1.","_n":"8358","_k":"ce96e56f"},{"t":"0.3","why":"That copies a value from the table. `k` is what’s left to reach 1: 1 − 0.8.","_n":"9caf","_k":"68e9c9bf"},{"t":"0.8","why":"0.5 + 0.3 = 0.8 is what’s used; `k` is what’s left to reach 1.","_n":"ac9f","_k":"99dac5df"},{"t":"1","why":"That would make the total 1.8.","_n":"bc8f","_k":"3818b949"}],"hints":["Add to 1.","0.5 + 0.3 = 0.8.","0.2."]},{"id":"w4","skill":"Distributions","goal":2,"prompt":"For the sum of two dice, which value is most likely?","options":[{"t":"All equally likely","why":"The values aren’t equally likely: a sum of 7 has 6 ways, a sum of 12 has 1.","_n":"cc7f","_k":"e1bb4d37"},{"t":"7","why":"6 of 36 outcomes.","_n":"dcef","_k":"f39326a5"},{"t":"6.5","why":"6.5 isn’t a possible sum.","_n":"ecdf","_k":"d88e563a"},{"t":"12","why":"12 is the largest value, but only (6, 6) gives it: 1 of 36.","_n":"fccf","_k":"d07ced52"}],"hints":["Count the ways.","7 has 6 ways.","7."]},{"id":"w5","skill":"Net gain","goal":3,"prompt":"You pay $3 for a ticket and win a $10 prize. What is your net gain?","options":[{"t":"−$3","why":"That’s the net gain when you lose.","_n":"gcbf","_k":"b7e26262"},{"t":"$7","why":"10 − 3.","_n":"hc2f","_k":"e4422e52"},{"t":"$10","why":"You paid to play. Net gain = prize − cost.","_n":"ic1f","_k":"e25eef5f"},{"t":"$13","why":"Don’t add the cost. Net gain = prize − cost.","_n":"jd0f","_k":"315bd74c"}],"hints":["What did you pay?","Prize − cost.","$7."]},{"id":"w6","skill":"Long-run frequency","goal":6,"prompt":"A spinner lands on red with probability 0.2. In 500 spins, about how many reds?","options":[{"t":"2","why":"500 ÷ 0.2 = 2500; 0.2 × 500 = 100.","_n":"kd1f","_k":"97f5437c"},{"t":"20","why":"That’s 0.2 × 100. Use all 500 spins.","_n":"lcef","_k":"53d23bba"},{"t":"100","why":"0.2 × 500.","_n":"mcff","_k":"3bd48263"},{"t":"250","why":"That’s half of the spins, but red has probability 0.2, not 0.5.","_n":"nccf","_k":"d6895dfa"}],"hints":["Expected count = \u003ci>P\u003c/i> × trials.","0.2 × 500.","100."]}],"refreshers":{"Weighted averages":"Multiply each value by its weight (or frequency share) and add.","Distributions":"Probabilities add to 1; values are rarely equally likely.","Net gain":"Net gain = what you receive − what you paid.","Long-run frequency":"Expected count = probability × number of trials."}}},"explore":{"heading":"Balance point","intro":"Shape a distribution and watch where it balances. Then design a game and test it over many plays.","predIntro":"Make a prediction first. Then the balance board will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"bal","preset":"die"},"prompt":"Balance, a fair die. Where does the histogram balance?","options":[{"t":"3.5","_n":"ocdf","_k":"73946a67"},{"t":"3","_n":"pcaf","_k":"d22282a2"},{"t":"Nowhere: 3.5 can’t be rolled","_n":"qcbf","_k":"6c65b818"},{"t":"6","_n":"rc8f","_k":"40865899"}],"explain":"`E(X) = (1 + 2 + … + 6)/6 = 3.5`. It’s an average, not a roll."},{"id":"p2","start":{"mode":"bal","preset":"zeroTen"},"prompt":"Balance, values 0 and 10 with `P` = 0.9 and 0.1. `E(X)` = ?","options":[{"t":"0","_n":"sc9f","_k":"68786209"},{"t":"1","_n":"t370","_k":"4d0538cd"},{"t":"5","_n":"u360","_k":"861f4bc2"},{"t":"10","_n":"v390","_k":"b6575e72"}],"explain":"0 × 0.9 + 10 × 0.1 = 1. The plain average 5 ignores the probabilities; 0 is only the most likely value."},{"id":"p3","start":{"mode":"game"},"prompt":"Game designer: $2 to play, roll a die, a 6 pays $10. Who does the game favour?","options":[{"t":"It’s fair","_n":"w380","_k":"0ea9d142"},{"t":"You can’t tell without playing","_n":"x3b0","_k":"a6e13553"},{"t":"The host","_n":"y3a0","_k":"b0520826"},{"t":"The player","_n":"z3d0","_k":"cf99ea2b"}],"explain":"Expected prize $10/6 ≈ $1.67 is less than the $2 cost, so `E`(net) ≈ −$0.33."},{"id":"p4","start":{"mode":"long"},"prompt":"Long run on the same game. After 10 000 simulated plays, the average net gain per play will be close to…","options":[{"t":"−$2","_n":"103c0","_k":"87a9573d"},{"t":"−$0.33","_n":"113f0","_k":"529e75d6"},{"t":"$0","_n":"123e0","_k":"ff1ed1bd"},{"t":"$8","_n":"133d0","_k":"d86d2f95"}],"explain":"The long-run average is the expected value. The running average wobbled early, then flattened near −$0.33."}],"chalIntro":"Use the balance board to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"Game designer: $2 to play, roll a die. Set the prize for a 6 (other faces pay $0) so the game is fair.","why":"A $12 prize gives an expected prize of $12 × `1/6` = $2, the cost to play, so `E`(net) = 0.","hints":["Fair: expected prize = cost.","Prize × `1/6` = $2.","Prize = $12."]},{"id":"tc2","goal":[1,5],"prompt":"Balance mode: values 1, 2, 3, 4. Set the probabilities (steps of 0.1, none zero) so that `P(X = 4) = 0.4` and `E(X) = 3`.","why":"(0.1, 0.2, 0.3, 0.4) gives `E(X)` = 0.1 + 0.4 + 0.9 + 1.6 = 3, and it is the only distribution that works.","hints":["`p_1 + p_2 + p_3 = 0.6` and `p_1 + 2p_2 + 3p_3 = 3 - 1.6 = 1.4`.","Subtract: `p_2 + 2p_3 = 0.8`.","`p_3 = 0.3` gives `p_2 = 0.2` and `p_1 = 0.1`."]},{"id":"tc3","goal":[3,5],"stretch":true,"prompt":"A charity raffle sells 500 tickets. Prizes: one $500, two $100 and five $20. Set the ticket price (steps of $0.10) so the raffle is fair, then read the expected net gain at the actual price of $5.","why":"Expected prize per ticket = (500 + 200 + 100) ÷ 500 = $1.60, so $1.60 is fair. At the actual $5 price, each ticket expects −$3.40: that’s the charity’s share.","hints":["Expected prize per ticket = total prizes ÷ tickets.","(500 + 200 + 100) ÷ 500.","$1.60 is fair; at $5, each ticket expects −$3.40, which is the charity’s share."]}]},"part3":{"slug":"worth-it","name":"Worth it?","heading":"Is it worth it?","intro":"Warranties and insurance are bets on bad luck. Use expected value to decide whether each one pays on average, then name what expected value leaves out: risk.","stations":[{"id":"s1","title":"The extended warranty","text":"A $60 two-year warranty on a laptop. Without it, there’s a 10% chance of a $300 repair and a 5% chance of a $500 replacement.","items":[{"id":"s1a","goal":4,"label":"Expected cost without the warranty: $","_a":"VAI=","why":"0.10 × 300 + 0.05 × 500 = 30 + 25 = $55.","wrong":[{"match":800,"fb":"That adds the costs. Weight each cost by its chance: 0.10 × 300 + 0.05 × 500."},{"match":400,"fb":"Unlikely values should count less. Multiply each value by its probability, then add."},{"match":30,"fb":"Include the $500 replacement too: + 0.05 × 500."},{"match":5,"fb":"That’s the gap to the $60 warranty. First find the expected cost without it."}]}],"after":"On average, the warranty costs $5 more: 60 − 55. Now change the repair chance and watch the verdict."},{"id":"s2","title":"The insurer’s view","text":"Phone insurance for one year costs $90. The insurer’s model gives an 8% chance of an $800 loss.","items":[{"id":"s2a","goal":[4,6],"label":"Expected payout per policy: $","_a":"VwM=","why":"0.08 × 800 = $64.","wrong":[{"match":800,"fb":"Weight the $800 loss by its 8% chance."},{"match":6.4,"fb":"8% is 0.08: 0.08 × 800."}]},{"id":"s2b","goal":[4,6],"label":"Insurer’s expected profit per policy: $","_a":"UwE=","why":"90 − 64 = $26 per policy.","wrong":[{"match":64,"fb":"That’s the expected payout. Profit = premium − expected payout."},{"match":-26,"fb":"The insurer collects $90 and expects to pay $64."},{"match":90,"fb":"Subtract the expected payout."}]}],"after":"Over 1000 policies, $26 each adds up to about $26 000. Open \u003cstrong>Check it with data\u003c/strong> to test it."},{"id":"s3","title":"Why buy it anyway?","text":"For the buyer, insurance has a negative expected value: on average it costs more than it pays out. Yet many people buy it. Sort each situation: is \u003cstrong>expected value\u003c/strong> or \u003cstrong>risk\u003c/strong> making the call?","bins":[{"id":"ev","t":"Expected value says"},{"id":"risk","t":"Risk says"}],"cards":[{"id":"c1","goal":4,"t":"“Losing $800 at once would mean missing rent.”","_a":"Q0UPSlIQ","why":"Risk says buy: one big loss would be unaffordable, so insurance is sensible here despite `E \u003c 0`.","wrong":"Expected value says skip the insurance, but this person can’t absorb one big loss. That’s risk talking: insurance is sensible despite `E \u003c 0`."},{"id":"c2","goal":4,"t":"“A $60 loss wouldn’t matter.”","_a":"Q1IQGw==","why":"Expected value says self-insure: skipping costs less on average, and a loss this size is affordable.","wrong":"A small, affordable loss carries little risk, so go with the expected value: self-insure."}],"after":"Expected value ignores risk: how far results can spread from the average. Module 20 measures that spread with σ."}],"quickCheck":{"title":"Is it worth it? quick check","summary":"Is it worth it? quick check","items":[{"id":"q1","goal":4,"prompt":"Warranty $60; expected repair cost $55. On average, buying the warranty…","choices":[{"t":"saves $5","fb":"60 − 55.","_n":"143e0","_k":"4465e287"},{"t":"breaks even","fb":"60 − 55.","_n":"153f0","_k":"68f7c135"},{"t":"costs $5 more","fb":"Right. 60 − 55 = 5.","_n":"16400","_k":"369eb1b6"},{"t":"costs $55","fb":"60 − 55.","_n":"17390","_k":"9533a22c"}]},{"id":"q2","goal":4,"prompt":"Why might someone buy insurance with a negative expected value?","choices":[{"t":"It always pays off","fb":"Expected value ignores risk.","_n":"183a0","_k":"5aacda57"},{"t":"It protects against a large loss they can’t afford","fb":"Right. Expected value ignores risk.","_n":"193b0","_k":"5e4c9f32"},{"t":"`E` doesn’t apply to insurance","fb":"Expected value ignores risk.","_n":"1a3c0","_k":"80b9bfbc"},{"t":"The premium is refunded","fb":"Expected value ignores risk.","_n":"1b450","_k":"3172c1e8"}]},{"id":"q3","goal":4,"prompt":"Premium $90, expected payout $64. Insurer’s expected profit per policy?","choices":[{"t":"−$26","fb":"90 − 64.","_n":"1c460","_k":"091d1092"},{"t":"$26","fb":"Right. 90 − 64 = 26.","_n":"1d430","_k":"e425a67b"},{"t":"$64","fb":"90 − 64.","_n":"1e420","_k":"dc0572c8"},{"t":"$90","fb":"90 − 64.","_n":"1f410","_k":"77512558"}]},{"id":"q4","goal":2,"prompt":"A raffle ticket has `E`(net) = −$3. This means…","choices":[{"t":"The raffle is fair","fb":"It’s a long-run average; individual results vary.","_n":"1g400","_k":"15460760"},{"t":"Every buyer loses $3","fb":"It’s a long-run average; individual results vary.","_n":"1h3f0","_k":"1cd69e20"},{"t":"You’ll win after enough tickets","fb":"It’s a long-run average; individual results vary.","_n":"1i3e0","_k":"c6360832"},{"t":"On average, buyers lose $3 per ticket","fb":"Right. It’s a long-run average; individual results vary.","_n":"1j3d0","_k":"795d3d37"}]}]}},"practice":{"activities":[{"id":"find","type":"custom","title":"Find the expected value","summary":"Find the expected value","goal":[1,3],"instruction":"Find each expected value.","how":"Type a number such as 1.5, a fraction such as 7/2, or an amount such as −$0.33, then press Check.","items":[{"id":"e1","goal":1,"prompt":"A fair die: `E(X)`?","_a":"UhlT","display":"`E(X) = 3.5`","why":"`(1 + 2 + 3 + 4 + 5 + 6)/6 = 21/6 = 3.5`.","wrong":[{"match":3,"fb":"Add 1 to 6 and divide by 6: `21/6`."}]},{"id":"e2","goal":1,"prompt":"`X` = 0, 1, 2 with `P` = 0.2, 0.5, 0.3: `E(X)`?","_a":"UBlX","display":"`E(X) = 1.1`","why":"0(0.2) + 1(0.5) + 2(0.3) = 0 + 0.5 + 0.6 = 1.1.","wrong":[{"match":1,"fb":"Unlikely values should count less. Multiply each value by its probability, then add."}]},{"id":"e3","goal":1,"prompt":"Number of heads in 3 coin tosses: `E(X)`?","_a":"UBlT","display":"`E(X) = 1.5`","why":"`0(1/8) + 1(3/8) + 2(3/8) + 3(1/8) = 12/8 = 1.5`.","wrong":[{"match":2,"fb":"Use `0(1/8) + 1(3/8) + 2(3/8) + 3(1/8)`."}]},{"id":"e4","goal":3,"prompt":"Pay $1, roll a die; a 6 pays a $4 prize. `E`(net gain)? (2 decimals)","_a":"TAdICgoBVVBSBFUKCgFVUFIEVQ==","tol":0.005,"money":true,"display":"−$0.33","why":"Expected prize = $4 × `1/6` ≈ $0.67; 0.67 − 1 ≈ −0.33.","wrong":[{"match":0.6666666666666666,"fb":"You paid to play. Net gain = prize − cost."}]},{"id":"e5","goal":1,"prompt":"Spinner: `1/2` → $0, `1/3` → $3, `1/6` → $12. `E`(prize)?","_a":"Ug==","money":true,"display":"$3","why":"`0 + 3 × 1/3 + 12 × 1/6 = 0 + 1 + 2 = 3`.","wrong":[{"match":5,"fb":"Average of 0, 3 and 12 ignores the probabilities. Unlikely values should count less. Multiply each value by its probability, then add."}],"hints":["Multiply each prize by its probability.","`0 + 3 × 1/3 + 12 × 1/6`.","0 + 1 + 2 = 3."]},{"id":"e6","goal":1,"prompt":"Sum of two dice: `E(X)`?","_a":"Vg==","display":"`E(X) = 7`","why":"The distribution is symmetric about 7, so it balances at 7.","wrong":[{"match":6.5,"fb":"Use symmetry: the distribution balances at 7."}]}]},{"id":"decide","type":"custom","title":"Decide and work backwards","summary":"Decide and work backwards","goal":[3,4,5],"star":true,"instruction":"Find each fair price, prize or missing value, and make each decision. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a number or an amount such as $2.50, choose where asked, then press Check.","items":[{"id":"d1","goal":3,"prompt":"A game pays a $30 prize with probability `1/12` (nothing otherwise). Fair price to play?","_a":"UxlT","tol":0.005,"money":true,"display":"$2.50","label":"Fair price: $","why":"Fair price = expected prize = $30 × `1/12` = $2.50.","wrong":[{"match":30,"fb":"Fair price = expected prize."}]},{"id":"d2","goal":3,"prompt":"A game costs $2 and you win with probability `1/5`. What prize makes it fair?","_a":"UAc=","tol":0.005,"money":true,"display":"$10","label":"Prize: $","why":"Fair means expected prize = cost: prize ÷ 5 = 2, so the prize is $10.","wrong":[{"match":8,"fb":"Fair means expected prize = cost: prize/5 = 2."}]},{"id":"d3","goal":5,"star":true,"prompt":"`X` = 2 or `x`, with `P(2) = 0.75` and `E(X) = 4`. Find `x`.","_a":"UAc=","display":"`x = 10`","label":"`x` =","why":"2(0.75) + `x`(0.25) = 4, so 1.5 + 0.25`x` = 4 and `x` = 10.","wrong":[{"match":6,"fb":"Weighted: 2(0.75) + `x`(0.25) = 4. Unlikely values should count less. Multiply each value by its probability, then add."}],"hints":["Write `E(X)` with `x`.","1.5 + 0.25`x` = 4.","`x = 10`."]},{"id":"d4","goal":4,"star":true,"prompt":"Warranty $45. Without it: 12% chance of a $250 repair, 3% chance of a $600 replacement. On expected cost alone: buy or skip, and by how much?","_a":"Ug==","tol":0.005,"money":true,"display":"Buy, by $3","pickLabel":"On expected cost alone:","label":"By how much? $","pick":[{"t":"Buy the warranty","_n":"1k3c0","_k":"4449f10d"},{"t":"Skip the warranty","why":"`E` = 30 + 18 = $48 > $45.","_n":"1l4b0","_k":"d29de251"}],"why":"Expected cost without it = 0.12 × 250 + 0.03 × 600 = 30 + 18 = $48, which is $3 more than the $45 warranty.","general":"`E` = 0.12 × 250 + 0.03 × 600; compare it with $45."},{"id":"d5","goal":3,"star":true,"prompt":"Flip a coin. Heads: roll a die and win $(the number). Tails: win $2. `E`(winnings)?","_a":"UxlRDA==","tol":0.005,"money":true,"display":"$2.75","why":"0.5(3.5) + 0.5(2) = 1.75 + 1 = $2.75.","wrong":[{"match":3.5,"fb":"Only half the time do you roll: 0.5(3.5) + 0.5(2)."}]},{"id":"d6","goal":3,"star":true,"prompt":"A fundraiser game costs $5. Draw 2 of 4 cards without replacement: two say $10 and two say $0. You win the total. `E`(net gain)? Who does it favour?","_a":"VA==","tol":0.005,"money":true,"display":"+$5; the player","label":"`E`(net gain) = $","pickLabel":"It favours:","pick":[{"t":"The player","_n":"1m4a0","_k":"f77ab9c0"},{"t":"The host","why":"A positive expected net gain favours the player.","_n":"1n490","_k":"72f201b8"},{"t":"Neither: it’s fair","why":"Fair means `E`(net) = 0.","_n":"1o4a0","_k":"f9fdd289"}],"why":"`E` = `20/6 + 40/6` = 10; net = 10 − 5 = +5. This fundraiser would lose money!","general":"\u003ci>P\u003c/i>($20) = `1/6`, \u003ci>P\u003c/i>($10) = `4/6`, \u003ci>P\u003c/i>($0) = `1/6`: `E`(total) = $10.","hints":["List the totals: 20, 10, 0.","\u003ci>P\u003c/i>(both $10) = `2/4 × 1/3 = 1/6`; \u003ci>P\u003c/i>(one of each) = `4/6`.","`E` = `20/6 + 40/6` = 10; net = 10 − 5 = +5. This fundraiser would lose money!"]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Tallulah","how":"","goal":[1,2,3],"instruction":"Tallulah made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"`X` = 0, 5, 10 with `P` = 0.5, 0.3, 0.2. Find `E(X)`.","steps":["The values are 0, 5 and 10.","`E(X)` = (0 + 5 + 10) ÷ 3 = 5.","So the long-run average is 5."],"_a":"UA==","stepFb":["Step 1 is correct.","","Step 3 uses step 2’s value."],"fixes":[{"t":"`E(X)` = 0.5 + 0.3 + 0.2 = 1.","why":"`E(X)` is a sum of products `x × P(x)`.","_n":"1p470","_k":"c5a3e8a8"},{"t":"`E(X)` = 10, the largest value.","why":"The largest value isn’t the average. Unlikely values should count less. Multiply each value by its probability, then add.","_n":"1q480","_k":"fc05e3f6"},{"t":"`E(X)` = 0(0.5) + 5(0.3) + 10(0.2) = 3.5.","why":"Weight each value by its probability: 0 + 1.5 + 2 = 3.5.","_n":"1r4d0","_k":"101b9c36"},{"t":"Step 2 is correct.","why":"The values aren’t equally likely.","_n":"1s4e0","_k":"22e01651"}],"hints":["Weight by probability.","1.5 + 2.","3.5."]},{"id":"e2","goal":3,"task":"Pay $3, roll a die; a 6 pays a $12 prize. Is the game fair?","steps":["`P(6) = 1/6`.","Expected prize = $12 × `1/6` = $2.","So the expected gain is $2, and the game favours the player."],"_a":"Uw==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"Expected gain = $12 − $3 = $9.","why":"$12 is paid only on a 6. Use the expected prize, $2, then subtract the cost.","_n":"1t4b0","_k":"c2ce80c9"},{"t":"Expected net gain = $2 − $3 = −$1, so the game favours the host.","why":"Subtract the $3 cost from the $2 expected prize.","_n":"1u4c0","_k":"4754a796"},{"t":"Expected gain = $2 + $3 = $5.","why":"Don’t add the cost. You paid to play. Net gain = prize − cost.","_n":"1v410","_k":"9a5babe8"},{"t":"Step 3 is correct.","why":"The $3 cost must be subtracted.","_n":"1w420","_k":"c5a9dc12"}],"hints":["What did the player pay?","$3.","2 − 3 = −1."]},{"id":"e3","goal":2,"task":"Interpret `E(X) = 3.5` for a die.","steps":["`E(X) = 21/6 = 3.5`.","So on the next roll I expect a 3 or a 4.","Rolling a 6 next would be unexpected."],"_a":"UA==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"I expect a 3.","why":"Every face is equally likely on one roll. `E(X) = 3.5` for a die: you’ll never roll it, but it’s the long-run average.","_n":"1xcf0","_k":"96d49320"},{"t":"I expect exactly 3.5 next.","why":"You can’t roll 3.5. `E(X) = 3.5` for a die: you’ll never roll it, but it’s the long-run average.","_n":"1yce0","_k":"b99419d2"},{"t":"3.5 is the average over many rolls; any face is equally likely on the next roll.","why":"`E` is a long-run average, not a prediction for one roll.","_n":"1zd10","_k":"58a5aff7"},{"t":"Step 2 is correct.","why":"`E` is a long-run average, not a prediction for one roll.","_n":"20d00","_k":"ad7807d2"}],"hints":["Can you roll 3.5?","No.","It’s a long-run average."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you more: that 3.5 is the ‘expected’ die roll, or that a 1-in-10 game can be fair?"},{"id":"j2","q":"In your own words, why is expected value a balance point?"},{"id":"j3","q":"Explain to a friend how to tell whether a game is fair."},{"id":"j4","q":"Describe a decision where you’d choose the option with the worse expected value. Why?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"`X` = 0, 1, 2, 3 with `P` = 0.1, 0.3, 0.4, 0.2. Find `E(X)`.","options":[{"t":"1","why":"That’s the sum of the probabilities.","_n":"21cb0","_k":"1bf3e078"},{"t":"1.5","why":"That’s the plain average of 0–3.","_n":"22ca0","_k":"77ea586c"},{"t":"1.7","why":"0 + 0.3 + 0.8 + 0.6.","_n":"23cd0","_k":"49deb483"},{"t":"2","why":"That’s the most likely value.","_n":"24cc0","_k":"6b0c58a4"}]},"b":{"prompt":"`X` = 1, 2, 5 with `P` = 0.5, 0.3, 0.2. Find `E(X)`.","options":[{"t":"1","why":"That’s the most likely value.","_n":"25c70","_k":"952f9ae1"},{"t":"2.1","why":"0.5 + 0.6 + 1.0.","_n":"26c60","_k":"51b9be8c"},{"t":"2.67","why":"8 ÷ 3 ignores the probabilities.","_n":"2734e","_k":"41646b23"},{"t":"8","why":"That’s the sum of the values.","_n":"2835e","_k":"674b2c35"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"A team’s goals per game, `X`, has `E(X) = 2.4`. What does this mean?","options":[{"t":"2.4 is the most the team can score.","why":"`E` isn’t a maximum.","_n":"2936e","_k":"06c2f373"},{"t":"The team will score 2 or 3 goals next game.","why":"`E` describes many games. One game can be far from 2.4.","_n":"2a37e","_k":"cc846aee"},{"t":"Most games end with 2.4 goals.","why":"No game ends with 2.4 goals: `E(X)` is a long-run average, not a possible or most likely value.","_n":"2b38e","_k":"e78a5ad6"},{"t":"Over many games, the team averages about 2.4 goals per game","why":"`E(X)` is the long-run average.","_n":"2c39e","_k":"989dc881"}]},"b":{"prompt":"A game has `E`(net gain) = +$0.50 for players. What does this mean?","options":[{"t":"Over many plays, players gain about $0.50 per play on average","why":"`E` is the long-run average per play.","_n":"2d3ae","_k":"b8ad1f72"},{"t":"Every player gains $0.50.","why":"`E` describes many plays. One play can still lose.","_n":"2e3be","_k":"d43d4323"},{"t":"A player can’t lose.","why":"`E` describes many plays. One play can still lose.","_n":"2f3ce","_k":"021c8bf1"},{"t":"The game is fair.","why":"Fair means `E = 0`.","_n":"2g3de","_k":"478c79c3"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"A game is fair when…","options":[{"t":"The player wins at least half the time.","why":"Fair means expected net gain 0. A 1-in-10 game can be fair if the prize is big enough.","_n":"2hbae","_k":"ac5c97aa"},{"t":"The expected net gain for a player is 0","why":"Fair means `E`(net) = 0.","_n":"2ib9e","_k":"89bcc340"},{"t":"The prize equals the cost to play.","why":"The prize also depends on how likely it is.","_n":"2jb8e","_k":"e19d38e9"},{"t":"Winning and losing are equally likely.","why":"Fair means expected net gain 0. A 1-in-10 game can be fair if the prize is big enough.","_n":"2kb7e","_k":"900ada2f"}]},"b":{"prompt":"A game costs $3 and its expected prize is $3. What is the expected net gain?","options":[{"t":"−$3","why":"That’s the net gain when you lose.","_n":"2lbee","_k":"b2d97862"},{"t":"$0","why":"3 − 3; the game is fair.","_n":"2mbde","_k":"772c9791"},{"t":"$3","why":"You paid to play. Net gain = prize − cost.","_n":"2nbce","_k":"ac733c56"},{"t":"$6","why":"Don’t add the cost.","_n":"2obbe","_k":"e0dbe632"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"You pay $3 to roll a die. A 6 pays a $10 prize, a 5 pays a $5 prize, and anything else pays nothing. Expected net gain?","options":[{"t":"−$3.00","why":"That’s the net gain on a losing roll.","_n":"2pc2e","_k":"daf75e52"},{"t":"+$2.00","why":"The average of 10, 5 and 0 ignores the probabilities.","_n":"2qc1e","_k":"e25924fc"},{"t":"+$2.50","why":"That’s the expected prize before the cost.","_n":"2r4dc","_k":"f350c6cd"},{"t":"−$0.50","why":"Expected prize = `10/6 + 5/6` = $2.50; 2.50 − 3.","_n":"2s4cc","_k":"acd57bdc"}]},"b":{"prompt":"You pay $2 to spin a spinner with 4 equal sectors: $5, $2, $0, $0. Expected net gain?","options":[{"t":"+$0.33","why":"The average of 5, 2 and 0 is `7/3`. Unlikely values should count less. Multiply each value by its probability, then add.","_n":"2t4fc","_k":"f3806751"},{"t":"−$2.00","why":"That’s a losing spin.","_n":"2u4ec","_k":"7be39d2f"},{"t":"−$0.25","why":"Expected prize = `7/4` = $1.75; 1.75 − 2.","_n":"2v51c","_k":"8b235818"},{"t":"+$1.75","why":"That’s the expected prize before the cost. You paid to play. Net gain = prize − cost.","_n":"2w50c","_k":"f7bc1b67"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"`X` = 0, 2, 5 with `P(X = 0) = 0.5`, `P(X = 2) = p` and `P(X = 5) = q`. If `E(X) = 1.6`, find `p` and `q`.","options":[{"t":"`p = 0.3`, `q = 0.2`","why":"`p + q = 0.5` and `2p + 5q = 1.6` give `1 + 3q = 1.6`.","_n":"2x53c","_k":"99bea950"},{"t":"`p = 0.8`, `q = 0`","why":"The probabilities would add to 1.3.","_n":"2y52c","_k":"f1f327e7"},{"t":"`p = 0.25`, `q = 0.25`","why":"Equal split: `E` = 1.75.","_n":"2z55c","_k":"a0156f63"},{"t":"`p = 0.2`, `q = 0.3`","why":"That gives `E` = 0.4 + 1.5 = 1.9.","_n":"3054c","_k":"ce3b8a3b"}]},"b":{"prompt":"`X` = 1, 3, 6 with `P(X = 1) = 0.4`, `P(X = 3) = p` and `P(X = 6) = q`. If `E(X) = 2.8`, find `p` and `q`.","options":[{"t":"`p = 0.3`, `q = 0.3`","why":"`E` = 3.1.","_n":"3167c","_k":"25cc155c"},{"t":"`p = 0.6`, `q = 0`","why":"Then `E` = 2.2.","_n":"3268c","_k":"4bf570f4"},{"t":"`p = 0.2`, `q = 0.4`","why":"That gives `E` = 0.4 + 0.6 + 2.4 = 3.4.","_n":"3365c","_k":"327c153c"},{"t":"`p = 0.4`, `q = 0.2`","why":"`p + q = 0.6` and `3p + 6q = 2.4` give `1.8 + 3q = 2.4`.","_n":"3466c","_k":"2591099f"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"An extended warranty on a laptop costs $120. Without it, there’s a 15% chance of a $400 repair and a 5% chance of a $900 replacement. On expected cost alone, which costs less, and by how much?","options":[{"t":"The warranty, by $15","why":"The sign is reversed.","_n":"3563c","_k":"c1799a04"},{"t":"The warranty, by $10","why":"Averaging $400 and $900 first, then × 0.20, isn’t weighting each cost by its own probability.","_n":"3664c","_k":"5977ac0c"},{"t":"They’re equal","why":"105 ≠ 120.","_n":"3761c","_k":"c4ceaa54"},{"t":"No warranty, by $15","why":"`E`(cost) = 60 + 45 = $105 \u003c $120.","_n":"3862c","_k":"1caf5b77"}]},"b":{"prompt":"A phone protection plan costs $80. Without it, there’s a 10% chance of a $300 screen repair and a 4% chance of a $1000 replacement. Which costs less on average, and by how much?","options":[{"t":"No plan, by $10","why":"`E` = 30 + 40 = $70.","_n":"395fc","_k":"492ddc13"},{"t":"The plan, by $10","why":"Reversed.","_n":"3a60c","_k":"ee903537"},{"t":"They’re equal","why":"`E` = 30 + 40 = $70, not $80.","_n":"3b61c","_k":"35746e0d"},{"t":"The plan, by $11","why":"(300 + 1000)/2 × 0.14 = $91 isn’t the expected cost.","_n":"3c60c","_k":"095bf849"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which best explains why `E(X) = 3.5` for a fair die even though 3.5 can’t be rolled?","options":[{"t":"“It’s the middle of 1 and 6, which is always the expected value.”","why":"That works only for symmetric distributions.","_n":"3d5fc","_k":"89f27ff1"},{"t":"“It’s a mistake: `E` must be a whole number.”","why":"`E(X) = 3.5` for a die: you’ll never roll it, but it’s the long-run average.","_n":"3e5ec","_k":"d30572cb"},{"t":"“It’s the most likely roll, rounded.”","why":"Every face is equally likely. `E(X) = 3.5` for a die: you’ll never roll it, but it’s the long-run average.","_n":"3f65c","_k":"bb184f9d"},{"t":"“It’s the average of the results over many rolls: the balance point of the distribution, not a single outcome.”","why":"`E(X)` is a long-run average and a balance point; it need not be a possible roll.","_n":"3g64c","_k":"7ee76dce"}]},"b":{"prompt":"A lottery ticket has an expected value of $0.40. Which best explains what this means?","options":[{"t":"“You’ll win $0.40 if you buy enough tickets.”","why":"`E` describes the average per ticket; buying more tickets guarantees nothing.","_n":"3h63c","_k":"f3701d15"},{"t":"“Every ticket wins $0.40.”","why":"`E` describes many tickets. Most tickets win nothing.","_n":"3i62c","_k":"ac6d08f1"},{"t":"“Most tickets win about $0.40.”","why":"No ticket wins $0.40: it’s the long-run average, not a possible or most likely prize.","_n":"3j59c","_k":"5198b5e4"},{"t":"“Averaged over many tickets, each returns about $0.40 in prizes; most tickets return $0 and a few return a lot.”","why":"A few big prizes pull the average up to $0.40. Lotteries charge more than that per ticket, so the expected net gain for players is negative.","_n":"3k58c","_k":"c6a57a43"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"A game: win $9 with probability `1/10`, otherwise lose $1. Which statement is correct?","options":[{"t":"“It favours the player because $9 > $1.”","why":"Weight each amount by its probability: 0.9 − 0.9 = 0.","_n":"3ldbc","_k":"918d750e"},{"t":"“The game is fair: expected net gain = 9(0.1) − 1(0.9) = 0, even though you lose 90% of the time.”","why":"Fair means expected net gain 0, not equal chances.","_n":"3mdcc","_k":"599f3249"},{"t":"“It’s unfair because you usually lose.”","why":"Fair means expected net gain 0. A 1-in-10 game can be fair if the prize is big enough.","_n":"3nddc","_k":"4f787b82"},{"t":"“It’s fair because there are only two outcomes.”","why":"Fair depends on the expected net gain, not on the number of outcomes.","_n":"3odec","_k":"e862b8c2"}]},"b":{"prompt":"A game: win $4 with probability `1/5`, otherwise lose $1. Which statement is correct?","options":[{"t":"“It’s unfair because you lose 80% of the time.”","why":"Fair means expected net gain 0. A 1-in-10 game can be fair if the prize is big enough.","_n":"3pdfc","_k":"e7bcb366"},{"t":"“It’s fair because `1/5 + 4/5 = 1`.”","why":"Every distribution adds to 1.","_n":"3qe0c","_k":"099a2252"},{"t":"“The game is fair: expected net gain = 4(0.2) − 1(0.8) = 0.”","why":"Fair means expected net gain 0, not equal chances.","_n":"3re1c","_k":"de571157"},{"t":"“It favours the player because 4 > 1.”","why":"Weight each amount by its probability: 0.8 − 0.8 = 0.","_n":"3se2c","_k":"679d8ee6"}]}},{"id":"a1","cat":"A","goal":4,"a":{"prompt":"An insurer sells one-year bicycle theft coverage for $60. In its model, 4% of insured bikes are stolen and each claim pays $1000. Expected profit per policy?","options":[{"t":"−$940","why":"That’s the loss on one stolen bike, not an average.","_n":"3td3c","_k":"78ebc27f"},{"t":"$20","why":"Expected payout 0.04 × 1000 = $40; 60 − 40.","_n":"3ud4c","_k":"12b6c6aa"},{"t":"$40","why":"That’s the expected payout.","_n":"3ve5d","_k":"90dea639"},{"t":"$60","why":"The payouts must be subtracted.","_n":"3we4d","_k":"9f40a405"}]},"b":{"prompt":"A premium is $150; the model gives a 2% chance of a $5000 claim. Expected profit per policy?","options":[{"t":"−$4850","why":"That’s one claim.","_n":"3xe7d","_k":"a24a8a09"},{"t":"$50","why":"150 − 0.02 × 5000.","_n":"3ye6d","_k":"025ac02a"},{"t":"$100","why":"That’s the expected payout.","_n":"3ze1d","_k":"2fb00011"},{"t":"$150","why":"The expected payout must be subtracted: 0.02 × 5000 = $100.","_n":"40e0d","_k":"75c14067"}]}},{"id":"a2","cat":"A","goal":3,"a":{"prompt":"A charity raffle sells 1000 tickets at $10 each. Prizes: one $2000 and five $200. Expected net gain per ticket?","options":[{"t":"+$2990","why":"That’s the net gain of the top ticket only.","_n":"41e3d","_k":"fec15449"},{"t":"−$10","why":"Prizes are paid to some tickets.","_n":"42e2d","_k":"089e7ab3"},{"t":"+$3","why":"That’s the expected prize.","_n":"43ddd","_k":"da08257b"},{"t":"−$7","why":"Expected prize = 3000 ÷ 1000 = $3; 3 − 10. On average, each ticket gives $7 to the charity.","_n":"44dcd","_k":"fc00ee90"}]},"b":{"prompt":"A raffle sells 2000 tickets at $5. Prizes: one $1000 and ten $100. Expected net gain per ticket?","options":[{"t":"+$1","why":"That’s the expected prize. You paid to play. Net gain = prize − cost.","_n":"45dfd","_k":"da973ecf"},{"t":"−$4","why":"Expected prize = 2000 ÷ 2000 = $1; 1 − 5. On average, each ticket gives $4 to the raffle.","_n":"46e0d","_k":"493b42fa"},{"t":"−$5","why":"Prizes are paid to some tickets: the expected prize is $1.","_n":"47ddd","_k":"1c22e5df"},{"t":"+$995","why":"That’s the net gain of the top ticket only.","_n":"48ded","_k":"58dac8d9"}]}}]},"task":{"title":"Design a fair game","summary":"Design a fair game","statement":"\u003cp>Design a spinner game with 4 equal sectors. Choose the cost to play and a prize for each sector so that the game meets every condition. Can you find all the answers? \u003cspan class=\"mdm-model\">model game\u003c/span>\u003c/p>\u003col class=\"xv-conds\">\u003cli>The game is fair (expected net gain = 0).\u003c/li>\u003cli>At least two sectors pay nothing.\u003c/li>\u003cli>No prize is more than $12.\u003c/li>\u003cli>Exactly one sector pays more than the cost to play.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Designs that differ only in the order of the sectors count as the same.\u003c/p>","checks":["Fair","At least two $0 sectors","No prize over $12","Exactly one winning sector"],"tips":["Fair means the prizes add to 4 × cost.","Use $0 for at least two sectors.","Big prizes are capped at $12.","Only one sector may pay more than the cost; any other paying sector must pay at most the cost."],"explainPrompt":"Explain how you made the game fair and why your game still loses money for most players on most spins.","vocab":"Use the words expected value, net gain, fair and long run.","more":"There’s more than one answer. Can you find them all?","after3":"At $5 the prizes would need to add to $20 with only one above $5 and that one at most $12, which is impossible. That’s why there are exactly six.","afterAt":6},"cards":[["Expected value","`E(X) = Σ xP(X = x)`."],["Balance point","`E(X)` is where the probability histogram balances."],["Long-run average","Over many trials, the average of `X` approaches `E(X)`."],["Die","`E(X) = 3.5`: not a possible roll, still the expected value."],["Not the most likely value","`X` = 0 or 10 with `P` = 0.9, 0.1: most likely 0, `E = 1`."],["Net gain","Prize received − cost paid."],["Fair game","Expected net gain = 0."],["Fair price","The expected prize."],["Raffles and lotteries","Designed so players’ expected net gain is negative."],["Insurance","The insurer’s expected profit = premium − expected payout."],["Working backwards","Write `E(X)` with the unknown, set it equal to the given value, solve."],["What `E` ignores","Risk: how far results spread (see σ in module 20)."]]}};</script>
