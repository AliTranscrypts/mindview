}
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--mv-top) + 130px)}

body{

.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}

.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}

}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}

.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* switch */
.zc-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.zc-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.zc-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}

button.pp-mk[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}

.pp-item{border-top:1px solid var(--rule);padding-top:10px;margin-top:10px}
.pp-ip{margin:0 0 6px}
.pp-data{margin:10px 0}
.pp-ch{display:grid;gap:8px;margin:6px 0 10px}
.pp-c{text-align:left;min-height:40px;white-space:normal}
.pp-c[aria-pressed="true"]{background:var(--good-bg);border-color:var(--green)}

/* Grade boundaries */
.gb-in{display:grid;gap:4px}
canvas.plot.gb-plot{aspect-ratio:16/10}

","I can compare values from different normal distributions using `z`-scores.","I can connect `z`-scores with percentiles and quartiles.","I can solve real-world problems with normal distributions, including expected counts."],"start":{"warmup":{"questions":[{"id":"w1","skill":"The 68–95–99.7 rule","goal":2,"prompt":"For `N(50, 5^2)`, what percent of values lie below 55?","options":[{"t":"68%","why":"68% is between 45 and 55.","_n":"0baf","_k":"340a83f3"},{"t":"84%","why":"50% below the mean + 34% between 50 and 55.","_n":"1b7f","_k":"142eeef7"},{"t":"16%","why":"16% lies \u003cstrong>above\u003c/strong> 55.","_n":"2b8f","_k":"5d8aa454"},{"t":"34%","why":"Below 55 includes everything below 50 too.","_n":"3b5f","_k":"04048484"}],"hints":["Where is 55 compared with the mean?","One σ above.","50% + 34% = 84%."]},{"id":"w2","skill":"The 68–95–99.7 rule","goal":1,"prompt":"For `N(μ, σ^2)`, which value is 2 standard deviations below the mean?","options":[{"t":"`μ ÷ 2σ`","why":"Distances add and subtract.","_n":"4b6f","_k":"bcf1dffc"},{"t":"`μ - σ^2`","why":"σ² is the variance; move 2σ.","_n":"5b3f","_k":"7e2035c4"},{"t":"`μ - 2σ`","why":"Start at the mean and move down 2 standard deviations.","_n":"6b4f","_k":"d84e1b97"},{"t":"`2μ - σ`","why":"μ isn’t doubled.","_n":"7c1f","_k":"4dd93823"}],"hints":["Start at μ.","Each standard deviation is σ.","`μ - 2σ`."]},{"id":"w3","skill":"Solving for a variable","goal":3,"prompt":"Solve `1.5 = (x - 60) ÷ 4`.","options":[{"t":"`x = 61.5`","why":"Multiply both sides by 4 first.","_n":"8c2f","_k":"a99d68db"},{"t":"`x = 54`","why":"`x - 60 = +6`.","_n":"9fa1","_k":"37c3e51f"},{"t":"`x = 66`","why":"Multiply: `x - 60 = 6`.","_n":"af91","_k":"f5fc3f7c"},{"t":"`x = 64`","why":"1.5 × 4 = 6.","_n":"bfc1","_k":"c2427df6"}],"hints":["Undo the division first.","`x - 60 = 1.5 × 4 = 6`.","`x = 66`."]},{"id":"w4","skill":"Solving for a variable","goal":3,"prompt":"Solve `-2 = (x - 100) ÷ 15`.","options":[{"t":"`x = 70`","why":"`x - 100 = -30`.","_n":"cfb1","_k":"337ffb2d"},{"t":"`x = 85`","why":"−2 × 15 = −30.","_n":"df61","_k":"8bb79125"},{"t":"`x = 98`","why":"Multiply by 15 first.","_n":"ef51","_k":"ae15b387"},{"t":"`x = 130`","why":"A negative `z` is below the mean.","_n":"ff81","_k":"30e56381"}],"hints":["Multiply both sides by 15.","`x - 100 = -30`.","`x = 70`."]},{"id":"w5","skill":"Complements and differences of areas","goal":2,"prompt":"If 0.9332 of the area lies to the left of a point, what area lies to the right?","options":[{"t":"0.0668","why":"1 − 0.9332.","_n":"gf71","_k":"340a0814"},{"t":"0.4332","why":"The total is 1, not 0.5.","_n":"h021","_k":"562c6f53"},{"t":"0.9332","why":"That’s the left side.","_n":"i011","_k":"7d3ae705"},{"t":"1.9332","why":"Areas can’t exceed 1.","_n":"j881","_k":"1da4dc83"}],"hints":["What is the total area?","1.","1 − 0.9332 = 0.0668."]},{"id":"w6","skill":"Complements and differences of areas","goal":2,"prompt":"The area left of `b` is 0.8413 and the area left of `a` is 0.1587. What is the area between `a` and `b`?","options":[{"t":"0.1587","why":"You need the region between.","_n":"k891","_k":"7147370b"},{"t":"0.4207","why":"Subtract, don’t average.","_n":"l8a1","_k":"c53d34bc"},{"t":"0.6826","why":"0.8413 − 0.1587.","_n":"m8b1","_k":"0896c25d"},{"t":"1.0000","why":"Adding double-counts everything left of `a`.","_n":"n841","_k":"d272168b"}],"hints":["Sketch both left areas.","The bigger one contains the smaller one.","0.8413 − 0.1587 = 0.6826."]}],"refreshers":{"The 68–95–99.7 rule":"68% within 1σ, 95% within 2σ, 99.7% within 3σ; above `μ + σ` is 16%, above `μ + 2σ` is 2.5%.","Solving for a variable":"From `z = (x - μ) ÷ σ`: multiply by σ, then add μ, so `x = μ + zσ`.","Complements and differences of areas":"Right area = 1 − left area. Between = bigger left area − smaller left area."}}},"explore":{"heading":"z-converter","intro":"Drag a value along the raw scale and watch its `z`-score and areas update. Then work backwards from a percentile.","predIntro":"Make a prediction first. Then the converter will show you what really happens.","predictions":[{"id":"p1","start":{"mu":60,"sg":5,"x":70,"mode":"left"},"prompt":"`N(60, 5^2)`, `x = 70`. What is the `z`-score of 70?","options":[{"t":"−2","_n":"o851","_k":"40d9ea23"},{"t":"0.2","_n":"p861","_k":"77c61217"},{"t":"2","_n":"q871","_k":"71a728fc"},{"t":"10","_n":"r801","_k":"2ab88933"}],"explain":"70 is 10 above the mean, which is 2 standard deviations; `z` counts standard deviations, not marks."},{"id":"p2","start":{"mu":60,"sg":5,"x":50,"mode":"left"},"prompt":"Same distribution, `x` moved to 50, Left mode. What area lies to the left of 50?","options":[{"t":"0.0228","_n":"s811","_k":"6e21f118"},{"t":"0.0456","_n":"t8e1","_k":"096d6790"},{"t":"0.5000","_n":"u8d1","_k":"e21d0198"},{"t":"0.9772","_n":"v8c1","_k":"f7a678c4"}],"explain":"The table gives the left area directly: 0.0228. 0.9772 is the area to the right."},{"id":"p3","start":{"mu":0,"sg":1,"x":-1,"x2":1,"mode":"between"},"prompt":"Standard normal, Between mode from `z = -1` to `z = 1`. What does the table give for the area between?","options":[{"t":"0.3413","_n":"w8b1","_k":"486c97dc"},{"t":"0.6826","_n":"x8a1","_k":"8679937b"},{"t":"0.8413","_n":"y891","_k":"8b729415"},{"t":"1.6826","_n":"z881","_k":"074179f3"}],"explain":"0.8413 − 0.1587 = 0.6826. The rule’s ‘68%’ is this table value, rounded."},{"id":"p4","start":{"mu":60,"sg":5,"x":70,"mode":"left","sgTo":10},"prompt":"μ = 60, `x = 70`; σ changes from 5 to 10. What happens to the `z`-score?","options":[{"t":"It stays at 2","_n":"10871","_k":"6406cbc9"},{"t":"It halves, to 1","_n":"11861","_k":"74cb42be"},{"t":"It becomes 0.5","_n":"12851","_k":"779950a9"},{"t":"It doubles, to 4","_n":"13fc0","_k":"8ef74deb"}],"explain":"The curve widens and the marker’s `z` slides from 2 to 1. The same 10 marks is now only one (larger) standard deviation."}],"chalIntro":"Use the converter to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"With μ = 60 and σ = 5, place `x` so that exactly 84.13% of values lie below it.","why":"`x = 65` gives `z = 1.00`, and the table gives 0.8413 to its left.","hints":["Find 0.8413 in the body of the table.","It sits at `z = 1.00`.","`x = 60 + 1.00 × 5 = 65`."]},{"id":"tc2","goal":[2,3],"prompt":"For `N(100, 15^2)`, shade the middle 50% of values.","why":"Bounds at `z = -0.67` and `z = 0.67` (89.95 and 110.05) hold 0.7486 − 0.2514 = 0.4972, the table’s closest value to the middle 50%.","hints":["The middle 50% leaves 25% in each tail.","Find 0.25 and 0.75 in the table: `z ≈ -0.67` and 0.67.","100 ± 0.67 × 15 = 89.95 and 110.05."]},{"id":"tc3","goal":[3,6],"stretch":true,"prompt":"A machine fills bags with masses `N(μ, 4^2)` g. Set μ so that only 2.28% of bags weigh less than 500 g.","why":"With μ = 508, 500 g is 2 standard deviations below the mean: `z = -2.00`, and the table gives 0.0228.","hints":["Which `z` has 0.0228 to its left?","`z = -2.00`, so 500 must be 2σ below the mean.","500 = μ − 2 × 4, so μ = 508."]}]},"part3":{"slug":"percentiles","name":"Percentiles","heading":"Percentiles and positions","intro":"Three ways to say where a value sits: its `z`-score, its percentile and its quartile. Then test the normal model against real-looking data. \u003cbutton type=\"button\" class=\"btn ghost sm zt-open\" aria-expanded=\"false\" data-k=\"zt-open-p3\">Open the \u003ci>z\u003c/i>-table\u003c/button>","stations":[{"id":"s1","title":"Three ways to say where a value is","text":"Slide the `z`-score. Its percentile comes from the table, its quartile region from the key positions, and the sentence puts it in words."},{"id":"s2","title":"Data vs model","text":"\u003cstrong>Model data:\u003c/strong> 20 test marks. The percentile of a mark here is the \u003cstrong>percent of marks below it\u003c/strong> (the course method).","marks":[54,59,61,63,64,66,67,68,69,70,70,71,72,73,74,76,77,79,81,86],"items":[{"id":"s2a","goal":5,"label":"Percentile of a mark of 79:","unit":"th percentile","_a":"CVM=","prompt":"Find the percentile of a mark of 79: (number of marks below 79 ÷ 20) × 100.","why":"17 marks are below 79: 17 ÷ 20 × 100 = the 85th percentile.","wrong":[{"match":90,"fb":"Count only the marks \u003cstrong>below\u003c/strong> 79, not 79 itself."},{"match":17,"fb":"17 is the number of marks below 79. Divide by 20, then multiply by 100."},{"match":87,"fb":"That’s the normal model’s estimate. The data percentile counts the marks below 79."}]},{"id":"s2b","goal":5,"label":["Model `Q_1` ≈","Model `Q_3` ≈"],"_a":"alBSFgBIU1cfVDs=","tol":0.1,"prompt":"Compare the data quartiles (65, 75) with the model’s: 70 ± 0.67 × 7.8.","why":"70 − 0.67 × 7.8 ≈ 64.8 and 70 + 0.67 × 7.8 ≈ 75.2, close to the data’s 65 and 75.","wrong":[{"match":[65,75],"fb":"Those are the data quartiles. Use the model: 70 ± 0.67 × 7.8."},{"match":[62.2,77.8],"fb":"That uses ±1σ. Quartiles sit at `z ≈ ±0.67`."}]}],"model":"The normal model gives `z = (79 - 70) ÷ 7.8 ≈ 1.15`, and the table gives 0.8749, about the 87th percentile. Close: these marks are roughly normal."},{"id":"s3","title":"The same z, different worlds","text":"A height of 182 cm, from `N(170, 8^2)`, and a mark of 83, from `N(65, 12^2)`, both have `z = 1.5`. Tap the statement that holds.","choices":[{"t":"Both are at the 93rd percentile of their own group.","why":"`z = 1.5` in both: (182 − 170) ÷ 8 = 1.5 and (83 − 65) ÷ 12 = 1.5, and the table gives 0.9332 for each.","_n":"14fd0","_k":"8b263dac"},{"t":"The height is better because 182 is the bigger number.","why":"Raw values in different units can’t be compared. Both are 1.5 standard deviations above their own mean.","_n":"15fa0","_k":"3a924897"},{"t":"A height and a mark can’t be compared at all.","why":"`z`-scores make the comparison possible: both are 1.5 standard deviations above their means.","_n":"16fb0","_k":"d66de3db"},{"t":"The mark is better because it is 18 above its mean, not 12.","why":"18 marks is 1.5 of that class’s larger standard deviation (12): the same position as 12 cm when σ = 8.","_n":"17f80","_k":"7d4e7a3c"}]}],"quickCheck":{"title":"Percentiles quick check","summary":"Percentiles quick check","items":[{"id":"q1","goal":5,"prompt":"A value has `z = 0`. Which percentile?","choices":[{"t":"100th","fb":"`z = 0` is the mean, which is the median of a normal curve.","_n":"18f90","_k":"a6d9478e"},{"t":"68th","fb":"`z = 0` is the mean, which is the median of a normal curve.","_n":"19f60","_k":"43c9e0e4"},{"t":"0th","fb":"`z = 0` is the mean, which is the median of a normal curve.","_n":"1af70","_k":"b9c9d80d"},{"t":"50th","fb":"Right. `z = 0` is the mean, which is the median of a normal curve.","_n":"1b040","_k":"6ac0f06c"}]},{"id":"q2","goal":5,"prompt":"About which `z` is the third quartile?","choices":[{"t":"0.25","fb":"0.7486 ≈ 0.75 lies to its left. 0.75 is the area, not `z`.","_n":"1c050","_k":"fd591e67"},{"t":"0.67","fb":"Right. 0.7486 ≈ 0.75 lies to its left.","_n":"1d820","_k":"2e7b2a74"},{"t":"0.75","fb":"0.7486 ≈ 0.75 lies to its left. 0.75 is the area, not `z`.","_n":"1e810","_k":"98587c4d"},{"t":"1.00","fb":"0.7486 ≈ 0.75 lies to its left. 0.75 is the area, not `z`.","_n":"1f840","_k":"292c2ce3"}]},{"id":"q3","goal":5,"prompt":"A mark is at the 16th percentile of a normal class. Its `z`-score is about…","choices":[{"t":"−1","fb":"Right. 0.1587 lies left of `z = -1`.","_n":"1g830","_k":"832c30ca"},{"t":"−0.16","fb":"0.1587 lies left of `z = -1`.","_n":"1h860","_k":"379882cf"},{"t":"0.16","fb":"0.1587 lies left of `z = -1`.","_n":"1i850","_k":"204986f5"},{"t":"1","fb":"0.1587 lies left of `z = -1`.","_n":"1j880","_k":"4c310d23"}]},{"id":"q4","goal":5,"prompt":"In Station 2, a mark of 64 has how many marks below it?","choices":[{"t":"3","fb":"54, 59, 61, 63: four marks; that’s the 20th percentile.","_n":"1k870","_k":"6038f3d5"},{"t":"4","fb":"Right. 54, 59, 61, 63: four marks; that’s the 20th percentile.","_n":"1l7a0","_k":"975fb3be"},{"t":"5","fb":"54, 59, 61, 63: four marks; that’s the 20th percentile.","_n":"1m790","_k":"a34ff0f0"},{"t":"6","fb":"54, 59, 61, 63: four marks; that’s the 20th percentile.","_n":"1nf00","_k":"080c6761"}]}]}},"practice":{"activities":[{"id":"areas","type":"numeric","title":"Area finder","summary":"Area finder","goal":[2,6],"instruction":"Heights of Grade 12 students are `N(170, 8^2)` cm (model data). Give areas to 4 decimals. \u003cbutton type=\"button\" class=\"btn ghost sm zt-open\" aria-expanded=\"false\" data-k=\"zt-open-a1\">Open the \u003ci>z\u003c/i>-table\u003c/button>","items":[{"id":"a1","goal":2,"prompt":"`P(X \u003c 182)`","_a":"AUhfCwtW","tol":0.0002,"display":"0.9332","keypad":"decimal","why":"`z = (182 - 170) ÷ 8 = 1.50`; the table’s left area is 0.9332.","wrong":[{"match":0.0668,"fb":"Less than: the table’s left area."}]},{"id":"a2","goal":2,"prompt":"`P(X > 158)`","_a":"AUhfCwtW","tol":0.0002,"display":"0.9332","keypad":"decimal","why":"`z = -1.50`, left area 0.0668, so the right area is 1 − 0.0668 = 0.9332.","wrong":[{"match":0.0668,"fb":"More than: 1 − 0.0668."}]},{"id":"a3","goal":2,"prompt":"`P(162 \u003c X \u003c 178)`","_a":"AUhQAApS","tol":0.0002,"display":"0.6826","keypad":"decimal","why":"`z = -1` and 1: 0.8413 − 0.1587 = 0.6826.","wrong":[{"match":1,"fb":"Subtract the left areas."}]},{"id":"a4","goal":2,"prompt":"`P(X > 186)`","_a":"AUhWCgpc","tol":0.0002,"display":"0.0228","keypad":"decimal","why":"`z = 2.00`: 1 − 0.9772 = 0.0228.","wrong":[{"match":0.9772,"fb":"The table gives the area to the \u003cstrong>left\u003c/strong>. For ‘more than’, subtract from 1."}]},{"id":"a5","goal":2,"prompt":"`P(174 \u003c X \u003c 186)`","_a":"AUhUAA1T","tol":0.0002,"display":"0.2857","keypad":"decimal","why":"`z = 0.50` and 2.00: 0.9772 − 0.6915 = 0.2857.","wrong":[{"match":1.6687,"fb":"0.9772 − 0.6915."}],"hints":["Find both `z`-scores.","`z = 0.50` and 2.00: left areas 0.6915 and 0.9772.","0.9772 − 0.6915 = 0.2857."]},{"id":"a6","goal":2,"prompt":"`P(X \u003c 166)`","_a":"AUhVCABR","tol":0.0002,"display":"0.3085","keypad":"decimal","why":"`z = -0.50`: the table’s left area is 0.3085.","wrong":[{"match":0.6915,"fb":"166 is below the mean, so `z = -0.50`."}]},{"id":"a7","goal":2,"prompt":"`P(X > 176)`","_a":"AUhUCg5S","tol":0.0002,"display":"0.2266","keypad":"decimal","why":"`z = 0.75`: 1 − 0.7734 = 0.2266.","wrong":[{"match":0.7734,"fb":"The table gives the area to the \u003cstrong>left\u003c/strong>. For ‘more than’, subtract from 1."}]},{"id":"a8","goal":6,"prompt":"In a group of 500 students, about how many are taller than 186 cm?","_a":"AFc=","tol":0,"display":"about 11 students","keypad":"decimal","why":"`P(X > 186) = 0.0228`, and 0.0228 × 500 = 11.4 ≈ 11 students.","wrong":[{"match":0.0228,"fb":"Multiply by 500: 11.4 ≈ 11 students."},{"match":11.4,"fb":"Round to a whole number of students."}],"hints":["Find `P(X > 186)`.","`z = 2.00`, so 0.0228.","0.0228 × 500 = 11.4, about 11."]}]},{"id":"backwards","type":"custom","title":"Backwards and across","summary":"Backwards and across","goal":[3,4,6],"star":true,"instruction":"Work backwards from areas and compare across distributions. Items marked ★ are non-routine; the last two go beyond the Final Check. \u003cbutton type=\"button\" class=\"btn ghost sm zt-open\" aria-expanded=\"false\" data-k=\"zt-open-a2\">Open the \u003ci>z\u003c/i>-table\u003c/button>","how":"Type a number (such as 180.2 or 9.18) or choose where asked, then press Check.","items":[{"id":"i1","goal":3,"prompt":"Heights `N(170, 8^2)`: the tallest 10% start at what height?","_a":"AF5WFgo=","tol":0.1,"display":"180.2 cm (`z ≈ 1.28`)","label":"Height:","unit":"cm","why":"The tallest 10% leaves 0.90 to the left: `z ≈ 1.28`, so `x = 170 + 1.28 × 8 ≈ 180.2` cm.","wrong":[{"match":159.8,"fb":"The top 10% has positive `z`."}]},{"id":"i2","goal":3,"prompt":"`N(100, 15^2)`: find `Q_1` and `Q_3`.","_a":"al5fFgFRSFMAVkgIDTk=","tol":0.1,"display":"89.95 and 110.05","label":["`Q_1` =","`Q_3` ="],"why":"Quartiles leave 0.25 and 0.75 to the left: `z ≈ ±0.67`, so 100 ± 0.67 × 15 = 89.95 and 110.05.","wrong":[{"match":[75,125],"fb":"Those are ±1.67σ; quartiles use `z ≈ ±0.67`."},{"match":[85,115],"fb":"That’s ±1σ, which holds about 68%. Quartiles use `z ≈ ±0.67`."}]},{"id":"i3","goal":4,"star":true,"prompt":"Ava scored 78 in math (class `N(70, 5^2)`) and 85 in English (class `N(75, 8^2)`). In which subject did she do relatively better?","pickLabel":"Relatively better in:","pick":[{"t":"Math","_n":"1of10","_k":"60fb5c9a"},{"t":"English","why":"Compare `z`-scores, not raw marks.","_n":"1pf20","_k":"4bd9fd3d"}],"display":"Math (`z = 1.6` vs 1.25)","why":"Math: (78 − 70) ÷ 5 = 1.6. English: (85 − 75) ÷ 8 = 1.25. The math mark is further above its class mean."},{"id":"i4","goal":3,"star":true,"prompt":"A cereal machine fills `N(μ, 6^2)` g boxes. Only 0.62% may weigh under 485 g. What must μ be?","_a":"BFZW","tol":0.1,"display":"μ = 500 g","label":"μ =","unit":"g","why":"0.0062 lies left of `z = -2.50`, so 485 = μ − 2.5 × 6 and μ = 500 g.","wrong":[{"match":470,"fb":"485 must sit 2.5σ \u003cstrong>below\u003c/strong> the mean."}],"hints":["Which `z` has 0.0062 to its left?","`z = -2.50`.","485 = μ − 2.5 × 6, so μ = 500."]},{"id":"i5","goal":6,"star":true,"prompt":"The middle 68.26% of resting heart rates lie between 61 and 79 beats per minute (normal model). What percent are above 82?","_a":"CEhXAA==","tol":0.01,"display":"9.18% (σ = 9, `z ≈ 1.33`)","label":"Percent above 82:","unit":"%","why":"68.26% is the ±1σ band, so μ = 70 and σ = 9. For 82, `z = 12 ÷ 9 ≈ 1.33`: 1 − 0.9082 = 0.0918 = 9.18%.","wrong":[{"match":16,"fb":"82 isn’t μ + σ; σ = 9, so `z = 12 ÷ 9 ≈ 1.33`."},{"match":90.82,"fb":"The table gives the area to the \u003cstrong>left\u003c/strong>. For ‘more than’, subtract from 1."}],"hints":["68.26% is the ±1σ band: find μ and σ.","μ = 70, σ = 9; `z` for 82 is 12 ÷ 9 ≈ 1.33.","1 − 0.9082 = 0.0918 = 9.18%."]},{"id":"i6","goal":3,"star":true,"prompt":"Bulb lifetimes are `N(1200, σ^2)` hours, and 15.87% last over 1350 h. What fraction last under 1050 h?","_a":"AUhXDQBT","tol":0.0002,"display":"0.1587","label":"Fraction:","why":"15.87% above means 1350 = μ + σ, so σ = 150. Then 1050 = μ − σ: `z = -1`, left area 0.1587.","wrong":[{"match":0.8413,"fb":"15.87% above means 1350 = μ + σ, so σ = 150; 1050 = μ − σ."}]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Clementine","how":"","goal":[1,2,3],"instruction":"Clementine made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Test marks are `N(72, 6^2)`. What is `P(X \u003c 81)`?","steps":["`z = (72 - 81) ÷ 6 = -1.50`.","The table gives 0.0668.","So 6.68% of marks are below 81."],"_a":"AQ==","stepFb":["","Step 2 reads the table correctly for `z = -1.50`; the mistake is earlier.","This follows the earlier slip."],"fixes":[{"t":"`z = (81 - 72) ÷ 36 = 0.25`.","why":"Subtract the mean \u003cstrong>from\u003c/strong> the value, then divide by σ, not σ². Values above the mean get positive `z`.","_n":"1qf30","_k":"e3e5c3d9"},{"t":"`z = (81 - 72) ÷ 6 = 1.50`, so `P = 0.9332`.","why":"81 is above the mean, so `z` is positive, and the table’s left area is 0.9332.","_n":"1rf40","_k":"bb2b9286"},{"t":"Step 1 is correct.","why":"81 is above the mean, so `z` must be positive.","_n":"1sf50","_k":"2d3df43d"},{"t":"Use the rule: 84%.","why":"The rule only covers 1, 2 and 3σ. For `z = 1.5`, use the table: 0.9332.","_n":"1tf60","_k":"106c30ed"}],"hints":["Is 81 above or below the mean?","Above, so `z > 0`.","`z = 1.50`: 0.9332."]},{"id":"e2","goal":2,"task":"Reaction times are `N(250, 20^2)` ms. What fraction are slower than 290 ms?","steps":["`z = (290 - 250) ÷ 20 = 2.00`.","The table gives 0.9772.","So 0.9772 of reaction times are slower than 290 ms."],"_a":"Aw==","stepFb":["Step 1 is correct.","Step 2 is a correct table reading.",""],"fixes":[{"t":"Use 95%.","why":"95% is the share within 2σ of the mean, not the share above 290. The table answers it: 1 − 0.9772.","_n":"1uf70","_k":"24f5ecc1"},{"t":"Step 3 is correct.","why":"The table gives the area to the \u003cstrong>left\u003c/strong>. For ‘more than’, subtract from 1.","_n":"1vf80","_k":"55f3fa01"},{"t":"‘Slower than 290’ means more than 290: 1 − 0.9772 = 0.0228.","why":"The table gives the times below 290; slower times are the right tail.","_n":"1wf90","_k":"19dbee6a"},{"t":"0.9772 ÷ 2 = 0.4886.","why":"Halving isn’t a rule. The table gives the left area; ‘slower’ means the right tail: 1 − 0.9772.","_n":"1xf60","_k":"c1a81d21"}],"hints":["Which side does the table give?","The left: times below 290.","1 − 0.9772 = 0.0228."]},{"id":"e3","goal":3,"task":"`N(60, 10^2)`: what cutoff marks the bottom 20%?","steps":["The bottom 20% has 0.20 to its left.","So `z = 0.20`.","`x = 60 + 0.20 × 10 = 62`."],"_a":"AA==","stepFb":["Step 1 is correct.","","Step 3 follows the earlier slip."],"fixes":[{"t":"Find 0.20 inside the table: `z ≈ -0.84`, so `x = 60 - 8.4 = 51.6`.","why":"0.20 is an area. The table body has 0.2005 at `z = -0.84`.","_n":"1yf50","_k":"5c98b9f4"},{"t":"`z = 0.84`, so `x = 68.4`.","why":"The bottom 20% is below the mean.","_n":"1zf40","_k":"44deef01"},{"t":"`z = -0.20`, so `x = 58`.","why":"Look up the area \u003cstrong>inside\u003c/strong> the table to find `z`. The bottom 20% has a negative `z` (−0.84).","_n":"20f30","_k":"20ec0c71"},{"t":"Step 2 is correct.","why":"Look up the area \u003cstrong>inside\u003c/strong> the table to find `z`. The bottom 20% has a negative `z` (−0.84).","_n":"21fa0","_k":"e20f5f66"}],"hints":["Is 0.20 a `z`-score or an area?","An area: look for 0.2005 in the table.","`z ≈ -0.84`: 51.6."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the z-converter: that very different curves become one curve, or that changing σ changes a `z`-score?"},{"id":"j2","q":"In your own words, what does a `z`-score tell you t
