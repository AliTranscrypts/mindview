.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 32: Spread builder (D10 dot plot + box plot rows, D9 readout, SD steps table), Compare stations, Steady practice task. Tokens only. */
/* radioGroup (from MDM4U 20) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

.sp-nw{white-space:nowrap}
.sp-q{display:inline-block;min-width:1.6em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}

/* Spread builder */
.sp-cap{font-size:clamp(1.05rem,2.4vw,1.35rem)}
.sp-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.sp-wrap{min-width:540px}
canvas.plot.sp-plot{aspect-ratio:auto;height:250px}
canvas.plot.sp-plot.sp-two{height:400px}
.sp-keys{margin:6px 0 0}
.sp-aha{margin:10px 0 0;font-size:.95rem}
.sp-msg{min-height:1.2em;margin:6px 0 0}
.sp-data{display:grid;gap:6px;margin:0 0 12px}
.sp-dl{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.sp-dr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.numin.sp-in{flex:1 1 14rem;min-width:0;width:auto;font-size:1rem}
.sp-sl{margin:4px 0 6px}
.sp-steps{margin-top:8px}
.sp-lines{margin:8px 0 0;display:grid;gap:4px}
.sp-lines p{margin:0}
.sp-note{margin:8px 0 0}
.sp-conds{margin:6px 0 0;padding-left:1.3em}
.sp-conds li{margin:2px 0}
.sp-tick{font-weight:700}

/* Compare stations */
.cp-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--sheet)}
.cp-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.cp-text{margin:0 0 10px}
.cp-q{margin:12px 0 6px;font-weight:700}
.cp-ask{margin-top:6px}
.cp-set{margin-top:8px}
.cp-done{margin:12px 0 0}
.cp-read{margin:10px 0}
canvas.plot.cp-plot1{aspect-ratio:auto;height:170px;max-width:620px}
canvas.plot.cp-plot2{aspect-ratio:auto;height:290px;max-width:620px}
canvas.plot.cp-plot3{aspect-ratio:auto;height:170px;max-width:620px}
canvas.plot.cp-plot3.cp-r2{height:300px}
canvas.plot.cp-plot3.cp-r3{height:430px}

/* Steady practice */
canvas.plot.sp-tplot{aspect-ratio:auto;height:190px}

</style>

 is widely spread from 31 to 69. Each row has its box plot underneath. Captions: s ≈ 3 for the top row and s = 14 for the bottom row.","shape":"wide"}},"goals":["I can find the quartiles, IQR and range of a data set using the course’s quartile method.","I can draw and read a box plot and identify outliers with the 1.5 × IQR rule.","I can calculate a standard deviation step by step, choosing between sample (`n - 1`) and population (`N`).","I can interpret standard deviation as the typical distance from the mean.","I can compare two data sets using a matching pair of centre and spread.","I can predict how adding a constant or multiplying by a factor changes the centre and spread."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Medians","goal":1,"prompt":"What is the median of 3, 8, 10, 14, 21?","options":[{"t":"9","why":"With 5 values there is one middle value.","_n":"0a7d","_k":"04be9b31"},{"t":"10","why":"The 3rd of 5 sorted values.","_n":"1a6d","_k":"34f3bcf2"},{"t":"11.2","why":"56 ÷ 5 = 11.2 is the mean.","_n":"2a5d","_k":"aed520ed"},{"t":"18","why":"21 − 3 = 18 is the range.","_n":"3a4d","_k":"45fd59a1"}],"hints":["The list is sorted. How many values?","5 values: the middle is the 3rd.","10."]},{"id":"w2","skill":"Medians","goal":1,"prompt":"What is the median of 4, 6, 9, 15?","options":[{"t":"6","why":"Average both middle values.","_n":"4a3d","_k":"34fd48a9"},{"t":"7.5","why":"(6 + 9) ÷ 2.","_n":"5a2d","_k":"a2bb7b12"},{"t":"8.5","why":"34 ÷ 4 = 8.5 is the mean.","_n":"6a1d","_k":"43e3d88d"},{"t":"9.5","why":"(4 + 15) ÷ 2 is the midrange.","_n":"7b0d","_k":"2c50c350"}],"hints":["Even count: two middle values.","6 and 9.","7.5."]},{"id":"w3","skill":"Squares and square roots","goal":3,"prompt":"What is `(-3)^2 + 2^2 + (-1)^2`?","options":[{"t":"−2","why":"Squaring makes every term positive.","_n":"8afd","_k":"6aa7c7f8"},{"t":"0","why":"Squares are never negative.","_n":"9868","_k":"81a86422"},{"t":"2","why":"`(-3)^2 = 9`, not −9.","_n":"a878","_k":"29a9057b"},{"t":"14","why":"9 + 4 + 1.","_n":"b848","_k":"507f8230"}],"hints":["Square each number first.","9, 4, 1.","14."]},{"id":"w4","skill":"Squares and square roots","goal":3,"prompt":"Use `√10 ≈ 3.16`. What is `√40`?","options":[{"t":"`6.32^2`","why":"That’s 40 itself, not its root.","_n":"c858","_k":"69209d0b"},{"t":"≈ 6.32","why":"`√40 = √4 × √10 = 2√10`.","_n":"d8a8","_k":"08d5d523"},{"t":"≈ 12.64","why":"`√4 = 2`, not 4.","_n":"e8b8","_k":"df9d7afa"},{"t":"20","why":"`√40` ≠ 40 ÷ 2.","_n":"f888","_k":"4f6a505b"}],"hints":["40 = 4 × 10.","`√4 = 2`.","2 × 3.16 = 6.32."]},{"id":"w5","skill":"Mean and deviations","goal":4,"prompt":"The mean of 5, 8, 11 is 8. What are the deviations from the mean?","options":[{"t":"3, 0, 3","why":"Values below the mean have negative deviations.","_n":"g898","_k":"4e96b9a3"},{"t":"5, 8, 11","why":"Subtract the mean.","_n":"h8e8","_k":"b6f89cf8"},{"t":"3, 0, −3","why":"Deviation = value − mean.","_n":"i8f8","_k":"914a6a42"},{"t":"−3, 0, 3","why":"Each value minus 8.","_n":"ja08","_k":"292f39f7"}],"hints":["Deviation = value − mean.","5 − 8 = −3.","−3, 0, 3."]},{"id":"w6","skill":"Mean and deviations","goal":4,"prompt":"What do the deviations from the mean always add up to?","options":[{"t":"`n`","why":"The sum doesn’t depend on the count.","_n":"k9f8","_k":"74e37cb7"},{"t":"0","why":"The mean is the balance point.","_n":"l9e8","_k":"0b3173d8"},{"t":"The range","why":"Deviations cancel exactly.","_n":"m9d8","_k":"91eff917"},{"t":"The standard deviation","why":"That’s why we square them first.","_n":"n9c8","_k":"62406acb"}],"hints":["Think of the balance beam from module 31.","Distances above and below match.","0."]}],"refreshers":{"Medians":"Sort; with `n` values the median is at position `(n + 1)` ÷ 2. If that’s a half, average the two neighbours.","Squares and square roots":"Square deviations so negatives don’t cancel. Use `√{ab} = √a × √b`: `√40 = 2√10`.","Mean and deviations":"Deviation = value − mean. The deviations always total 0, which is why spread uses their squares."}}},"explore":{"heading":"Spread builder","intro":"Drag the data, and watch the box plot, the fences and the standard deviation respond. Step through the standard deviation one column at a time.","predIntro":"Make a prediction first. Then the spread builder will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"box","data":"home","pop":false},"prompt":"Drag the 70 down to 40. Which measures change?","options":[{"t":"Range, mean and standard deviation drop; median and IQR stay the same","_n":"o9b8","_k":"0323e92c"},{"t":"Only the median and IQR change","_n":"p9a8","_k":"fcd1b4ab"},{"t":"Only the range changes","_n":"q998","_k":"497d72b6"},{"t":"Everything drops","_n":"r988","_k":"7ac9700c"}],"explain":"Range 58 → 28, mean 28.64 → 25.91, `s` 15.84 → 9.19; `Q_1` 18, median 26 and `Q_3` 34 don’t move. Quartiles depend on positions; the 70 was already in the top spot."},{"id":"p2","start":{"mode":"trans","data":"home","pop":false,"c":0,"k":1,"to":5},"prompt":"Transform mode. Add 5 to every value. What happens to the standard deviation?","options":[{"t":"It increases by 5","_n":"s978","_k":"a02fd16e"},{"t":"It increases by 25","_n":"t1a7","_k":"d8a6a09e"},{"t":"It stays the same","_n":"u1b7","_k":"388c0457"},{"t":"It decreases","_n":"v1c7","_k":"2d1b1ac2"}],"explain":"Every dot slides right together, the box keeps its width, and `s` stays 15.84. Every distance from the mean is unchanged."},{"id":"p3","start":{"mode":"box","data":"home","pop":true},"prompt":"Switch from Population to Sample. The standard deviation will…","options":[{"t":"increase slightly","_n":"w1d7","_k":"b86c30bf"},{"t":"double","_n":"x167","_k":"8716e9d9"},{"t":"decrease slightly","_n":"y177","_k":"5fe04ecd"},{"t":"stay the same","_n":"z187","_k":"b5da1099"}],"explain":"σ = 15.10 becomes `s` = 15.84. Dividing by 10 instead of 11 gives a slightly bigger result. A sample usually underestimates the spread, and `n - 1` corrects for that."},{"id":"p4","start":{"mode":"compare","a":[6,6,12,12],"b":[4,9,9,14],"pop":false},"prompt":"Compare mode: set A = 6, 6, 12, 12 and set B = 4, 9, 9, 14 (both have mean 9). Which has the larger standard deviation?","options":[{"t":"A","_n":"10197","_k":"9c70e1ef"},{"t":"Can’t tell without a calculator","_n":"11127","_k":"7fcef5a5"},{"t":"They’re equal","_n":"12137","_k":"e2a82cab"},{"t":"B","_n":"13147","_k":"d92e151a"}],"explain":"A totals 9 + 9 + 9 + 9 = 36, B totals 25 + 0 + 0 + 25 = 50. B’s two values that are 5 away count more than A’s four values that are 3 away, because the distances are squared."}],"chalIntro":"Use the spread builder to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Make a set of 7 whole numbers (0–30) with median 15 and IQR 10. \u003cspan class=\"tiny muted\">(Type them in the data box, or drag the dots.)\u003c/span>","why":"For `n` = 7 the median is the 4th value, `Q_1` is the 2nd and `Q_3` is the 6th: for example 5, 10, 12, 15, 17, 20, 25.","hints":["Put 15 in the middle (4th) position.","`Q_1` is the 2nd value and `Q_3` is the 6th. Make them 10 apart.","For example, 2nd = 10 and 6th = 20."]},{"id":"tc2","goal":2,"prompt":"Start: the homework data with the 70 changed to 40 (no outliers; choose \u003cstrong>Homework (70 → 40)\u003c/strong>). Drag \u003cstrong>one\u003c/strong> value so the box plot shows exactly one outlier, while the median stays 26.","why":"The upper fence is `Q_3` + 1.5 × IQR = 34 + 24 = 58 (or 68 if your move raises `Q_3` to 38), and your value is beyond it.","hints":["Where is the upper fence? `Q_3` + 1.5 × IQR.","34 + 24 = 58.","Move the largest value above 58."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"SD steps mode: make a \u003cstrong>sample\u003c/strong> of 4 whole numbers (0–20) with mean 10 and `s` exactly 2.","why":"The values total 40 and \u003cspan class=\"m\">Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)\u003csup>2\u003c/sup>\u003c/span> = 12, so `s^2` = 12 ÷ 3 = 4 and `s` = 2: 7, 11, 11, 11 or 9, 9, 9, 13.","hints":["`s` = 2 means `s^2` = 4, and for a sample `s^2` = \u003cspan class=\"m\">Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)\u003csup>2\u003c/sup>\u003c/span> ÷ 3.","So the squared deviations must total 12, and the deviations must total 0.","Deviations −3, 1, 1, 1: squares 9 + 1 + 1 + 1 = 12, giving 7, 11, 11, 11."]}]},"part3":{"slug":"compare","name":"Compare","heading":"Compare two data sets","intro":"Each station puts two data sets side by side. Make a choice and back it with a matching pair of centre and spread; the “Check it with data” panels show the calculations.","stations":[{"id":"s1","title":"Two goalies","text":"\u003cspan class=\"mdm-model\">model data\u003c/span> Saves per game over 5 games. Which goalie is more consistent?","a":[26,27,28,29,30],"b":[20,24,28,32,36],"choices":[{"id":"A","t":"Goalie A","fb":"Right. Both average 28, but A’s games stay within 2 saves of it (`s` ≈ 1.58), while B’s swing from 20 to 36 (`s` ≈ 6.32).","_n":"14137","_k":"87195952"},{"id":"B","t":"Goalie B","fb":"B’s saves swing from 20 to 36. A larger spread means less consistent.","_n":"15167","_k":"dc21553d"},{"id":"E","t":"Equally consistent","fb":"The means are equal (28), but the spreads aren’t. Look at the distances from 28.","_n":"16157","_k":"11ad1b8d"}],"data":"The squared deviations total 10 for A and 160 for B, so `s_A = √{10 ÷ 4} = √2.5` ≈ 1.58 and `s_B = √{160 ÷ 4} = √40` ≈ 6.32."},{"id":"s2","title":"Two classes","text":"\u003cspan class=\"mdm-model\">model data\u003c/span> Final marks in two classes, shown as box plots (five-number summaries).","p":[52,62,70,78,94],"q":[58,66,70,74,82],"asks":[{"id":"x1","t":"Whose middle half of marks is more spread out?","choices":["Class P","Class Q","Neither"],"_a":"EnEJBxURRWIS","fb":{"Class P":"Right. P’s box runs from 62 to 78 (IQR 16); Q’s from 66 to 74 (IQR 8).","Class Q":"Q’s box is narrower: IQR 74 − 66 = 8, against P’s 78 − 62 = 16.","Neither":"Compare the box widths: 16 for P and 8 for Q."}},{"id":"x2","t":"Which class has the higher typical mark?","choices":["Class P","Class Q","Neither: the medians are equal"],"_a":"EnwADxIKAEAKEhEOA0IIV1RbBAgVQgRAVRIAFxMDCRA=","fb":{"Class P":"P’s top mark is higher, but its median is 70, the same as Q’s.","Class Q":"Q’s median is 70, the same as P’s.","Neither: the medians are equal":"Right. Both medians are 70: the same centre, different spreads."}}],"done":"Same median, but P’s IQR is 16 and Q’s is 8."},{"id":"s3","title":"The right pair","text":"For each data set, pick the summary pair that suits it.","sets":[{"id":"inc","name":"Household incomes","unit":"thousand dollars","x0":0,"x1":120,"step":20,"vals":[24,28,30,31,33,35,36,38,41,45,52,68,110],"_a":"El8AAkQ=","fb":{"med":"Right. The incomes are skewed right with an outlier (110), and the median and IQR resist it.","mean":"The 110 pulls the mean and the standard deviation up. With skew or outliers, use the median and IQR."}},{"id":"ht","name":"Student heights","unit":"cm","x0":150,"x1":180,"step":5,"vals":[152,156,158,160,161,162,163,164,165,166,168,170,174],"_a":"El8ABwhA","fb":{"mean":"Right. The heights are roughly symmetric with no outliers, so the mean and standard deviation describe them well.","med":"That works, but for symmetric data without outliers the mean and standard deviation use every value."}}],"pairs":[{"id":"med","t":"Median and IQR"},{"id":"mean","t":"Mean and standard deviation"}],"done":"Use resistant measures together when outliers or skew are present."},{"id":"s4","title":"How much did the spread change?","text":"\u003cspan class=\"mdm-model\">model data\u003c/span> Test marks out of 50. A teacher adds 4 bonus marks to every test, then converts the marks to percentages by multiplying by 2. Predict each change before you tap Apply.","marks":[28,32,35,36,38,41,42],"steps":[{"id":"add","t":"Add 4 to every mark. The standard deviation will…","btn":"Apply +4","choices":["stay the same","increase by 4","double"],"_a":"EkERBx9CEVpVEhYHCwdH","fb":{"stay the same":"Right. Every mark moves up 4, so every distance from the mean is unchanged.","increase by 4":"Every mark moves up 4, so the distances between marks don’t change.","double":"Adding doesn’t stretch anything; it slides every mark along."}},{"id":"mul","t":"Now multiply every mark by 2. The standard deviation will…","btn":"Apply ×2","choices":["stay the same","increase by 2","double"],"_a":"ElYKEwQOABA=","fb":{"double":"Right. Every distance from the mean doubles, so `s` doubles.","stay the same":"Multiplying stretches the data: every distance from the mean doubles.","increase by 2":"Multiplying by 2 doubles every distance; it doesn’t add 2."}}],"done":"Adding a constant shifts the mean and leaves `s` alone; multiplying by 2 doubles both."}],"quickCheck":{"title":"Quick check","summary":"Compare quick check","items":[{"id":"q1","goal":5,"prompt":"Which summary pair suits skewed data?","choices":[{"t":"Mean & IQR","fb":"Both resist extreme values: use the median and IQR.","_n":"17187","_k":"0f9b5275"},{"t":"Median & IQR","fb":"Right. Both resist extreme values.","_n":"18177","_k":"fc80d00a"},{"t":"Mode & range","fb":"Both resist extreme values: use the median and IQR.","_n":"191a7","_k":"2052bda2"},{"t":"Mean & SD","fb":"Both resist extreme values: use the median and IQR.","_n":"1a197","_k":"f85c56a2"}]},{"id":"q2","goal":4,"prompt":"Same mean; `s` = 2 vs `s` = 9. Which is more consistent?","choices":[{"t":"`s` = 2","fb":"Right. A smaller SD means values sit closer to the mean.","_n":"1b0c7","_k":"5b36bd83"},{"t":"`s` = 9","fb":"A smaller SD means values sit closer to the mean.","_n":"1c0b7","_k":"c8bbe848"},{"t":"Can’t tell","fb":"A smaller SD means values sit closer to the mean.","_n":"1d0e7","_k":"9c55d220"},{"t":"Same","fb":"A smaller SD means values sit closer to the mean.","_n":"1e0f7","_k":"7d9a6e4e"}]},{"id":"q3","goal":6,"prompt":"Every value × 3. The IQR…","choices":[{"t":"stays the same","fb":"Every gap triples.","_n":"1f0c7","_k":"0df5ea64"},{"t":"becomes 9 times","fb":"Every gap triples.","_n":"1g0d7","_k":"587539de"},{"t":"increases by 3","fb":"Every gap triples.","_n":"1h0a7","_k":"c55239b8"},{"t":"triples","fb":"Right. Every gap triples.","_n":"1i0b7","_k":"8a110e19"}]},{"id":"q4","goal":2,"prompt":"Box A spans 40–60, box B spans 45–55. Which has the larger IQR?","choices":[{"t":"Need the medians","fb":"IQR is the box width: 20 vs 10.","_n":"1j087","_k":"1f694c87"},{"t":"A","fb":"Right. IQR is the box width: 20 vs 10.","_n":"1k097","_k":"0895f29c"},{"t":"B","fb":"IQR is the box width: 20 vs 10.","_n":"1l167","_k":"e95efa38"},{"t":"Same","fb":"IQR is the box width: 20 vs 10.","_n":"1m177","_k":"0cf1d804"}]}]}},"practice":{"activities":[{"id":"five","type":"match","title":"Data ↔ five-number summary","summary":"Data ↔ five-number summary","goal":[1,2],"instruction":"Match each data set with its five-number summary (min, `Q_1`, median, `Q_3`, max). Some summaries are decoys.","how":"Tap a data set on the left, then tap its summary on the right.","leftTitle":"Data","rightTitle":"Five-number summary","left":[{"id":"l1","t":"1, 3, 5, 7, 9","goal":1,"why":"Median 5; lower half 1, 3 and upper half 7, 9 give `Q_1` = 2 and `Q_3` = 8."},{"id":"l2","t":"2, 4, 6, 8, 10, 12","goal":1,"why":"Median (6 + 8) ÷ 2 = 7; halves 2, 4, 6 and 8, 10, 12 give 4 and 10."},{"id":"l3","t":"1, 2, 5, 7, 9","goal":1,"why":"Median 5; `Q_1` = (1 + 2) ÷ 2 = 1.5 and `Q_3` = (7 + 9) ÷ 2 = 8."},{"id":"l4","t":"3, 3, 4, 8, 9, 10, 15","goal":1,"why":"Median 8, left out: halves 3, 3, 4 and 9, 10, 15 give 3 and 10."},{"id":"l5","t":"5, 6, 6, 7, 20","goal":2,"why":"Median 6; halves 5, 6 and 7, 20 give 5.5 and 13.5.","hints":["The median is the 3rd value: 6.","Lower half 5, 6; upper half 7, 20.","`Q_1` = 5.5, `Q_3` = 13.5."]},{"id":"l6","t":"10, 12, 14, 16, 18, 20, 22, 24","goal":1,"why":"Median (16 + 18) ÷ 2 = 17; halves 10, 12, 14, 16 and 18, 20, 22, 24 give 13 and 21."}],"right":[{"id":"r1","t":"1, 2, 5, 8, 9"},{"id":"r2","t":"2, 4, 7, 10, 12"},{"id":"r3","t":"1, 1.5, 5, 8, 9"},{"id":"r4","t":"3, 3, 8, 10, 15"},{"id":"r5","t":"5, 5.5, 6, 13.5, 20"},{"id":"r6","t":"10, 13, 17, 21, 24"},{"id":"r7","t":"1, 3, 5, 7, 9"},{"id":"r8","t":"3, 3.5, 8, 9.5, 15"}],"_a":"SxAJV0RYR0ABEElEClBHCBJAV0RKQAkBEghHFFVASRBcBkdcRBBREBwQCVNEWEdABRBJRApURwgSQFNEGw==","wrong":{"l1|r7":"That’s the data itself. With 5 values, `Q_1` is the median of 1 and 3, which is 2.","l4|r8":"Leave the median (8) out: the lower half is 3, 3, 4, so `Q_1` = 3.","l3|r1":"Look at the second value: 2, not 3. `Q_1` = (1 + 2) ÷ 2 = 1.5."},"wrongDefault":"Find the median first, then split the halves."},{"id":"spread","type":"numeric","title":"Spread it out","summary":"Spread it out","goal":[1,2,3,4,5,6],"star":true,"instruction":"Find each measure. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a number (2 decimals where an answer doesn’t end), then press Check.","items":[{"id":"s1","goal":1,"prompt":"IQR of 4, 9, 10, 12, 15, 18, 21, 30","_a":"AQI=","tol":0.001,"display":"IQR = 10","keypad":"decimal","why":"`Q_1` = (9 + 10) ÷ 2 = 9.5 and `Q_3` = (18 + 21) ÷ 2 = 19.5, so IQR = 19.5 − 9.5 = 10.","wrong":[{"match":26,"fb":"That’s the range."},{"match":9.5,"fb":"Those are `Q_1` and `Q_3`. Subtract them."},{"match":19.5,"fb":"Those are `Q_1` and `Q_3`. Subtract them."}]},{"id":"s2","goal":3,"prompt":"Sample standard deviation of 3, 7, 7, 7","_a":"Ag==","tol":0.005,"display":"`s` = 2","keypad":"decimal","why":"Mean 6; squares 9, 1, 1, 1 total 12; 12 ÷ 3 = 4; `s = √4 = 2`.","wrong":[{"match":4,"fb":"That’s `s^2`. Variance is in squared units. The standard deviation is its square root."},{"match":1.73,"fb":"That divides by 4. This is a sample. A sample divides by `n - 1`; a whole population divides by `N`."}]},{"id":"s3","goal":3,"star":true,"prompt":"Population standard deviation of 2, 4, 4, 4, 5, 5, 7, 9","_a":"Ag==","tol":0.005,"display":"σ = 2","keypad":"decimal","why":"Mean 5; squares 9, 1, 1, 1, 0, 0, 4, 16 total 32; 32 ÷ 8 = 4; σ = 2.","wrong":[{"match":2.14,"fb":"That divides by 7. This is the whole population. A sample divides by `n - 1`; a whole population divides by `N`."}],"hints":["The mean is 40 ÷ 8 = 5.","The squares are 9, 1, 1, 1, 0, 0, 4, 16, totalling 32.","32 ÷ 8 = 4, so σ = 2."]},{"id":"s4","goal":2,"star":true,"prompt":"`Q_1` = 18 and `Q_3` = 30. Enter the upper fence.","_a":"BAo=","tol":0.001,"display":"upper fence = 48","keypad":"decimal","why":"IQR = 12 and 1.5 × 12 = 18, so the upper fence is 30 + 18 = 48.","wrong":[{"match":42,"fb":"You added the IQR (12). Add 1.5 × IQR = 18."},{"match":0,"fb":"That’s the lower fence, 18 − 18. Fences are `Q_1` − 1.5 × IQR and `Q_3` + 1.5 × IQR. Start from the quartiles."}]},{"id":"s5","goal":6,"star":true,"prompt":"A sample 7, 7, 10, 13, 13 has `s` = 3. Every value is multiplied by 3 and then 5 is added. New `s`?","_a":"CQ==","tol":0.005,"display":"new `s` = 9","keypad":"decimal","why":"Multiplying by 3 triples every distance from the mean (`s` = 9); adding 5 moves every value but leaves the distances alone.","wrong":[{"match":14,"fb":"Adding 5 doesn’t change the spread. Shifting every value moves the centre, not the distances between values."},{"match":3,"fb":"Multiplying by 3 triples every distance."}]},{"id":"s6","goal":[3,4],"star":true,"prompt":"Five values are all 20 (σ = 0). A sixth value, 26, is added. New population σ?","_a":"AhxXVVBSUwUJBVJT","tol":0.005,"display":"σ = √5 ≈ 2.24","keypad":"decimal","use":"Use these values: `√5 ≈ 2.24`.","why":"The new mean is 126 ÷ 6 = 21. Deviations: five of −1 and one of +5, so the squares total 30; σ² = 30 ÷ 6 = 5 and σ = √5 ≈ 2.24.","wrong":[{"match":2.45,"fb":"That divides by 5. All 6 values are the population: 30 ÷ 6 = 5, and `√5` ≈ 2.24."},{"match":6,"fb":"The new mean is 21, not 20."}],"hints":["The new mean is (100 + 26) ÷ 6 = 21.","Deviations: five of −1 and one of +5. The squares total 5 + 25 = 30.","σ² = 30 ÷ 6 = 5, so σ = `√5` ≈ 2.24."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Augustin","goal":[1,2,3],"instruction":"Augustin made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Find the IQR of 2, 5, 6, 8, 11, 13, 20.","steps":["There are 7 values; the median is the 4th, 8.","Lower half: 2, 5, 6, 8. Upper half: 8, 11, 13, 20.","`Q_1` = 5.5 and `Q_3` = 12, so IQR = 6.5."],"_a":"AQ==","stepFb":["Step 1 is correct.","","Step 3 follows from step 2. The mistake is earlier."],"fixes":[{"t":"IQR = 20 − 2 = 18.","why":"That’s the range. IQR = `Q_3 - Q_1`, the width of the box: the middle 50%.","_n":"1n087","_k":"a5ac06eb"},{"t":"Leave the median out: the lower half is 2, 5, 6 (`Q_1` = 5) and the upper half is 11, 13, 20 (`Q_3` = 13), so IQR = 8.","why":"With an odd count, the median sits between the halves. Leave it out, then take the median of each half.","_n":"1o077","_k":"f883b5be"},{"t":"Step 2 is correct.","why":"The course method leaves the median out when `n` is odd.","_n":"1p067","_k":"9cfdda4b"},{"t":"`Q_1` = 2 and `Q_3` = 20.","why":"Those are the extremes.","_n":"1q057","_k":"44e6716d"}],"hints":["Does the median belong to either half?","No: the halves are 2, 5, 6 and 11, 13, 20.","13 − 5 = 8."]},{"id":"e2","goal":3,"task":"Find the sample standard deviation of 4, 6, 8, 10, 12.","steps":["The mean is 40 ÷ 5 = 8.","The deviations are −4, −2, 0, 2, 4.","The squares are 16, 4, 0, 4, 16, totalling 40.","Divide by `n - 1`: 40 ÷ 4 = 10.","So `s` = 10."],"_a":"BA==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","Step 4 is correct for a sample.",""],"fixes":[{"t":"`s = √10` ≈ 3.16.","why":"Variance is in squared units. The standard deviation is its square root.","_n":"1r0c7","_k":"548bdab3"},{"t":"Step 5 is correct.","why":"10 is the variance, in squared units.","_n":"1s0b7","_k":"df4c6078"},{"t":"`s` = 10 ÷ 2 = 5.","why":"Halving isn’t a square root.","_n":"1t0a7","_k":"5872f8c4"},{"t":"`s` = 40 ÷ 5 = 8.","why":"That’s a different (and wrong) division. A sample divides by `n - 1`; a whole population divides by `N`.","_n":"1u097","_k":"5ec42d15"}],"hints":["What does step 4 give: `s` or `s^2`?","`s^2`.","Take the square root: ≈ 3.16."]},{"id":"e3","goal":2,"task":"`Q_1` = 20, median = 24, `Q_3` = 28, maximum 38. Is 38 an outlier?","steps":["IQR = 28 − 20 = 8.","1.5 × IQR = 12.","Upper fence = median + 12 = 36.","38 > 36, so 38 is an outlier."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 uses step 3’s fence. The mistake is earlier."],"fixes":[{"t":"Upper fence = max + 12 = 50.","why":"Fences come from the quartiles.","_n":"1v107","_k":"c399e178"},{"t":"Upper fence = 1.5 × range.","why":"The rule uses the IQR.","_n":"1w0f7","_k":"d26708b8"},{"t":"Upper fence = `Q_3` + 12 = 40. 38 \u003c 40, so it isn’t an outlier.","why":"Fences are `Q_1` − 1.5 × IQR and `Q_3` + 1.5 × IQR. Start from the quartiles.","_n":"1x827","_k":"9d7686e4"},{"t":"Step 3 is correct.","why":"Fences start from `Q_1` and `Q_3`, not the median.","_n":"1y837","_k":"dddb886f"}],"hints":["Which number does the upper fence start from?","`Q_3` = 28.","28 + 12 = 40, and 38 is inside."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: which measures ignored the 70, and which didn’t?"},{"id":"j2","q":"In your own words, what does a standard deviation of 3 mean for a set of test marks?"},{"id":"j3","q":"Explain to a friend the steps for a sample standard deviation, and why it divides by `n - 1`."},{"id":"j4","q":"Which part of finding quartiles or fences still trips you up? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"What is the IQR of 3, 5, 7, 8, 9, 11, 14, 15, 20?","options":[{"t":"7","why":"Leave out the median, 9. With an odd count, the median sits between the halves. Leave it out, then take the median of each half.","_n":"1z847","_k":"7a9029ab"},{"t":"8.5","why":"`Q_1` = (5 + 7) ÷ 2 = 6; `Q_3` = (14 + 15) ÷ 2 = 14.5.","_n":"20857","_k":"235a1d1a"},{"t":"17","why":"That’s the range. IQR = `Q_3 - Q_1`, the width of the box: the middle 50%.","_n":"21867","_k":"7c71878b"},{"t":"20.5","why":"Subtract, don’t add. IQR = `Q_3 - Q_1`, the width of the box: the middle 50%.","_n":"22877","_k":"c165d18d"}]},"b":{"prompt":"What is the IQR of 2, 4, 6, 9, 10, 12, 13, 17, 21?","options":[{"t":"7","why":"Leave out the median, 10. With an odd count, the median sits between the halves. Leave it out, then take the median of each half.","_n":"23887","_k":"3ea299ef"},{"t":"10","why":"`Q_1` = 5, `Q_3` = 15.","_n":"24897","_k":"64f6a792"},{"t":"19","why":"That’s the range. IQR = `Q_3 - Q_1`, the width of the box: the middle 50%.","_n":"258a7","_k":"7f884e74"},{"t":"20","why":"Subtract, don’t add. IQR = `Q_3 - Q_1`, the width of the box: the middle 50%.","_n":"268b7","_k":"fa007aec"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"What is the sample standard deviation of 4, 6, 8, 10, 12?","use":"Use these values: `√8 ≈ 2.83`, `√10 ≈ 3.16`.","options":[{"t":"2.40","why":"That’s the mean distance, not the standard deviation.","_n":"271c9","_k":"d1ca67d9"},{"t":"2.83","why":"That divides by 5. A sample divides by `n - 1`; a whole population divides by `N`.","_n":"281b9","_k":"a1743e6b"},{"t":"3.16","why":"40 ÷ 4 = 10; `√10`.","_n":"291e9","_k":"cda4d302"},{"t":"10","why":"That’s the variance. Variance is in squared units. The standard deviation is its square root.","_n":"2a1d9","_k":"67b233c0"}]},"b":{"prompt":"What is the sample standard deviation of 7, 7, 10, 13, 13?","use":"Use these values: `√7.2 ≈ 2.68`.","options":[{"t":"2.40","why":"That’s the mean distance, not the standard deviation.","_n":"2b189","_k":"f98e1127"},{"t":"2.68","why":"That divides by 5. A sample divides by `n - 1`; a whole population divides by `N`.","_n":"2c ":[{"t":"The mean doubles; the standard deviation is multiplied by 4","why":"The variance ×4; the SD ×2.","_n":"2re6e","_k":"980de8c5"},{"t":"Neither changes","why":"Scaling changes both.","_n":"2se7e","_k":"7994fbc1"},{"t":"Both double","why":"Every distance from the mean doubles.","_n":"2te4e","_k":"4abeb29a"},{"t":"The mean doubles; the standard deviation is unchanged","why":"Doubling stretches every distance from the mean. Shifting every value moves the centre, not the distances between values.","_n":"2ue5e","_k":"d16d40f1"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"\u003cspan class=\"mdm-model\">model data\u003c/span> class P has `Q_1` 62, median 70, `Q_3` 78; class Q has `Q_1` 66, median 70, `Q_3` 74. Which statement is true?","options":[{"t":"P’s middle half of marks is twice as spread out as Q’s","why":"IQRs of 16 and 8.","_n":"2ve2e","_k":"4eee5ea2"},{"t":"They can’t be compared without means","why":"Medians and IQRs compare them.","_n":"2we3e","_k":"982aed69"},{"t":"Q is more spread out","why":"Q’s box is narrower.","_n":"2xe0e","_k":"c642ddbd"},{"t":"P did better, because its `Q_3` is higher","why":"The medians are equal; a higher `Q_3` comes with a lower `Q_1`.","_n":"2ye1e","_k":"9fb5b9a9"}]},"b":{"prompt":"\u003cspan class=\"mdm-model\">model data\u003c/span> team R has `Q_1` 50, median 60, `Q_3` 64; team S has `Q_1` 56, median 60, `Q_3` 62. Which statement is true?","options":[{"t":"S is more spread out","why":"S’s box is narrower: IQR 6.","_n":"2zeee","_k":"0f1e627e"},{"t":"R’s middle half is more spread out (IQR 14 vs 6)","why":"64 − 50 = 14 and 62 − 56 = 6.","_n":"30efe","_k":"1d0ce33b"},{"t":"They can’t be compared without means","why":"Medians and IQRs compare them.","_n":"31ecf","_k":"0cc0e869"},{"t":"R scored higher overall","why":"The medians are equal (60).","_n":"32ebf","_k":"09866413"}]}},{"id":"t3","cat":"T","goal":[4,6],"a":{"prompt":"Each set has mean 10. Which has the largest standard deviation?","options":[{"t":"{10, 10, 10, 10}","why":"No spread.","_n":"33eef","_k":"66eb3d01"},{"t":"{5, 10, 10, 15}","why":"The squares total 25 + 0 + 0 + 25 = 50.","_n":"34edf","_k":"6c119ca4"},{"t":"{8, 9, 11, 12}","why":"More different values isn’t more spread: the squares total only 10.","_n":"35f0f","_k":"37c76b17"},{"t":"{7, 7, 13, 13}","why":"Four values 3 away give 36, less than two values 5 away.","_n":"36eff","_k":"20b90ec3"}]},"b":{"prompt":"Each set has mean 20. Which has the largest standard deviation?","options":[{"t":"{17, 17, 23, 23}","why":"The squares total 36. Spread is about distance from the centre. Squared distances make far values count a lot.","_n":"37f2f","_k":"a89c38b7"},{"t":"{14, 20, 20, 26}","why":"36 + 0 + 0 + 36 = 72.","_n":"38f1f","_k":"e0faeb8c"},{"t":"{20, 20, 20, 20}","why":"No spread.","_n":"39e4f","_k":"fa3f0dca"},{"t":"{16, 18, 22, 24}","why":"The squares total 40. Spread is about distance from the centre. Squared distances make far values count a lot.","_n":"3ae3f","_k":"50ebb8a9"}]}},{"id":"c1","cat":"C","goal":[3,4],"a":{"prompt":"Which is the best description of standard deviation?","options":[{"t":"“The average of the values.”","why":"That’s the mean.","_n":"3b5ae","_k":"1c7e7955"},{"t":"“The difference between the largest and smallest values.”","why":"That’s the range.","_n":"3c5be","_k":"913cae97"},{"t":"“Roughly the typical distance of the values from the mean.”","why":"Square the distances, average them, then take the root.","_n":"3d5ce","_k":"02e78032"},{"t":"“The spread of the middle 50% of the data.”","why":"That’s the IQR.","_n":"3e5de","_k":"1652ef1b"}]},"b":{"prompt":"Why does a \u003cstrong>sample\u003c/strong> standard deviation divide by `n - 1`?","options":[{"t":"“Because it makes the arithmetic easier.”","why":"It’s about accuracy, not ease.","_n":"3f5ee","_k":"b59a64c5"},{"t":"“It doesn’t matter: `n` and `n - 1` give the same result.”","why":"They differ, especially for small `n`. A sample divides by `n - 1`; a whole population divides by `N`.","_n":"3g5fe","_k":"08f0d29f"},{"t":"“Because one value is always an outlier and is left out.”","why":"No value is removed.","_n":"3h60e","_k":"3f4a6ecf"},{"t":"“A sample’s values sit closer to their own mean than to the population mean, so dividing by `n - 1` corrects the underestimate.”","why":"Dividing by a smaller number makes the result slightly bigger.","_n":"3i61e","_k":"17409da8"}]}},{"id":"c2","cat":"C","goal":[2,5],"a":{"prompt":"A box plot has minimum 30, `Q_1` 40, median 50, `Q_3` 70, maximum 90. Which statement is correct?","options":[{"t":"“25% of the data lie between 40 and 70.”","why":"Between `Q_1` and `Q_3` is 50%.","_n":"3j62e","_k":"2cf2d96f"},{"t":"“Half of the data lie above 70.”","why":"Only 25% lie above `Q_3`.","_n":"3k63e","_k":"32445edb"},{"t":"“The mean is 50.”","why":"50 is the median; a box plot doesn’t show the mean.","_n":"3le0e","_k":"00fa067e"},{"t":"“The upper part of the box is longer, so the third quarter of the data is more spread out than the second.”","why":"50 to 70 is twice as wide as 40 to 50, and each holds 25% of the data.","_n":"3mdfe","_k":"30bccb59"}]},"b":{"prompt":"A box plot has minimum 5, `Q_1` 20, median 35, `Q_3` 40, maximum 45. Which statement is correct?","options":[{"t":"“The long lower whisker and lower box show the data are skewed left.”","why":"The lower quarters stretch out much further than the upper ones.","_n":"3ndee","_k":"311e6851"},{"t":"“The data are skewed right.”","why":"The long tail is on the left.","_n":"3odde","_k":"3b905db6"},{"t":"“75% of the data are below 35.”","why":"50% are below the median.","_n":"3pe4e","_k":"ae07f65e"},{"t":"“The IQR is 40.”","why":"40 is the range; the IQR is 20. IQR = `Q_3 - Q_1`, the width of the box: the middle 50%.","_n":"3qe3e","_k":"9dbb6328"}]}},{"id":"a1","cat":"A","goal":[4,5],"a":{"prompt":"\u003cspan class=\"mdm-model\">model data\u003c/span> two goalies both average 28 saves per game. Goalie A has `s` = 2 and goalie B has `s` = 6. A coach wants a dependable starter. Which statement is best?","options":[{"t":"“Either: the means are equal, so they’re the same.”","why":"Equal means can hide different consistency.","_n":"3re2e","_k":"40211826"},{"t":"“Goalie A: the same average with less variation, so the game-to-game performance is more predictable.”","why":"A’s games typically land within about 2 saves of 28.","_n":"3se1e","_k":"bc32e2a7"},{"t":"“Goalie B: a larger SD means more saves.”","why":"SD measures spread, not level.","_n":"3te8e","_k":"653d6b9e"},{"t":"“Goalie B: big spread means great games are more likely, so B is more dependable.”","why":"B also has more poor games.","_n":"3ue7e","_k":"d60009b8"}]},"b":{"prompt":"\u003cspan class=\"mdm-model\">model data\u003c/span> bakery P’s loaves have mean mass 500 g with `s` = 4 g; bakery Q’s have mean 505 g with `s` = 15 g. Which is more consistent?","options":[{"t":"“They’re equally consistent.”","why":"`s` = 4 vs `s` = 15.","_n":"3v5ef","_k":"9af21d84"},{"t":"“Can’t tell without the medians.”","why":"SD alone answers “consistent”.","_n":"3w5ff","_k":"2b204d32"},{"t":"“Q: its mean is higher.”","why":"A higher mean isn’t more consistency.","_n":"3x5cf","_k":"681c8708"},{"t":"“P: its loaves vary much less around the mean.”","why":"`s` = 4 g against 15 g.","_n":"3y5df","_k":"04c273dd"}]}},{"id":"a2","cat":"A","goal":2,"a":{"prompt":"\u003cspan class=\"mdm-model\">model data\u003c/span> daily snowfall (cm) over 11 days: 0, 1, 1, 2, 2, 3, 4, 4, 5, 6, 25. Is 25 an outlier?","options":[{"t":"“Yes: `Q_1` = 1, `Q_3` = 5, IQR = 4, so the upper fence is 11 and 25 > 11.”","why":"Leave out the median (3): the halves are 0, 1, 1, 2, 2 and 4, 4, 5, 6, 25.","_n":"3z62f","_k":"312bb875"},{"t":"“No: 25 is less than `Q_3` + 1.5 × range = 42.5.”","why":"Fences are `Q_1` − 1.5 × IQR and `Q_3` + 1.5 × IQR. Start from the quartiles.","_n":"4063f","_k":"6e40ba1c"},{"t":"“Yes, because it’s the largest value.”","why":"Being the largest isn’t enough; it must pass the fence.","_n":"4160f","_k":"1baa1492"},{"t":"“No: outliers must be more than 10 times the median.”","why":"That isn’t the course rule.","_n":"4261f","_k":"a1912ebc"}]},"b":{"prompt":"\u003cspan class=\"mdm-model\">model data\u003c/span> ages of 9 club members: 15, 16, 16, 17, 17, 18, 19, 20, 29. Is 29 an outlier?","options":[{"t":"“Yes: `Q_1` = 16, `Q_3` = 19.5, IQR = 3.5, so the fence is 24.75 and 29 > 24.75.”","why":"Leave out the median (17): the halves are 15, 16, 16, 17 and 18, 19, 20, 29.","_n":"4366f","_k":"a032f771"},{"t":"“Yes, because it’s the largest value.”","why":"Largest isn’t enough.","_n":"4467f","_k":"2350d92c"},{"t":"“No: it’s within 12 years of the median.”","why":"That isn’t the rule.","_n":"4564f","_k":"aacf7d2a"},{"t":"“No: 29 is less than `Q_3` + 1.5 × range = 40.5.”","why":"Fences are `Q_1` − 1.5 × IQR and `Q_3` + 1.5 × IQR. Start from the quartiles.","_n":"4663f","_k":"0dbf0762"}]}}]},"task":{"title":"Steady practice","summary":"Steady practice","statement":"\u003cp>An athlete records five practice times (whole minutes, 0–20) as a \u003cstrong>sample\u003c/strong>. Design five times that meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"sp-conds\">\u003cli>The mean is 10.\u003c/li>\u003cli>The sample standard deviation is exactly 3.\u003c/li>\u003cli>The range is at most 7.\u003c/li>\u003c/ol>","checks":["Mean 10","Sample SD exactly 3","Range at most 7"],"tips":["Mean 10 means the times total 50.","`s` = 3 means `s^2` = 9, and for 5 values \u003cspan class=\"m\">Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)\u003csup>2\u003c/sup>\u003c/span> = 4 × 9 = 36.","Look for deviations that total 0 and whose squares total 36, such as −3, −3, 0, 3, 3.","The largest and smallest times can be at most 7 apart."],"explainPrompt":"Explain how you turned “`s` = 3” into a target for the squared deviations, and how you kept the range small.","vocab":"Use the words deviation, squared, sample, `n - 1` and range.","more":"There’s more than one answer. Can you find them all?","after3":"Two more sets have mean 10 and `s` = 3 (5, 10, 11, 11, 13 and 7, 9, 9, 10, 15), but both have a range of 8."},"cards":[["Range","max − min. Quick, but ruled by the extremes."],["Quartiles (course method)","The median of each half, leaving the median out when `n` is odd."],["IQR","`Q_3 - Q_1`: the spread of the middle 50%."],["Five-number summary","min, `Q_1`, median, `Q_3`, max: the box plot."],["Outlier fences","`Q_1` − 1.5 × IQR and `Q_3` + 1.5 × IQR."],["Deviation","\u003cspan class=\"m\">\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>\u003c/span>. Deviations always total 0."],["Sample SD","\u003cspan class=\"m\">\u003ci>s\u003c/i> = √[Σ(\u003ci>x\u003c/i> − \u003ci>x̄\u003c/i>)\u003csup>2\u003c/sup> ÷ (\u003ci>n\u003c/i> − 1)]\u003c/span>."],["Population SD","`σ = √[Σ(x - μ)^2 ÷ N]`."],["Variance","The square of the SD, in squared units."],["Add a constant","Mean shifts; SD and IQR stay the same."],["Multiply by `k`","Mean, SD and IQR all multiply by `k` (for `k` > 0)."],["Matching pairs","Skewed: median + IQR. Symmetric: mean + SD."]]}};</script>
