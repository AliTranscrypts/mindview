.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 07: hero, Podium and seats (D3 counting slots, D4 arrangement tiles, list view), Part 3 ladder, Code designer */
/* radioGroup (from MDM4U 02 / 01) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button .m{font-size:1.02em}

/* @component D3 countingSlots (permutation version) */
.pm-slots{display:grid;grid-template-columns:repeat(var(--pm-c,3),minmax(0,150px));gap:8px;margin:4px 0 12px}
.pm-slot{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;padding:6px 5px 7px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);text-align:center;transition:background .25s,border-color .25s}
.pm-slot.hi{background:var(--hi-soft);border-color:var(--sel-bd)}
.pm-slot.lk{border:2px solid var(--ink)}
.pm-badge{align-self:center;max-width:100%;padding:0 .5em;border:1.5px solid var(--ink);border-radius:999px;font-size:.76rem;font-weight:700;line-height:1.45;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-n{font:700 1.75rem/1.05 var(--font-math);color:var(--ink)}
.pm-cw{font-size:.72rem;color:var(--ink-2);margin-top:-3px}
.pm-put{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;min-height:36px;padding:2px;border:1.5px dashed var(--rule);border-radius:6px;background:transparent;color:var(--ink)}
button.pm-put{cursor:pointer}
button.pm-put:hover{border-color:var(--pen)}
.pm-empty{font-size:.72rem;color:var(--ink-2)}
.pm-as{font-size:.7rem;color:var(--ink-2);width:100%}
.pm-lsel{width:100%;min-height:30px;padding:0 2px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 .76rem var(--font-ui)}
.pm-lsel:focus{border-color:var(--ink)}
@media (max-width:560px){ .pm-slots{grid-template-columns:repeat(var(--pm-c,3),minmax(0,1fr));gap:5px} .pm-slot{padding:5px 2px 6px} .pm-n{font-size:1.45rem} .pm-badge{font-size:.68rem;padding:0 .35em} .pm-lsel{font-size:.68rem} }

/* @component D4 arrangementTiles */
.pm-plab{margin:0 0 4px;font-size:.82rem;font-weight:700;color:var(--ink-2)}
.pm-pool{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pm-tile{display:inline-grid;place-items:center;min-width:36px;min-height:36px;padding:0 .45em;border:2px solid var(--ink);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 1rem var(--font-ui);transition:opacity .25s}
.pm-tile.sm{min-width:30px;min-height:28px;font-size:.86rem;border-width:1.5px;border-radius:6px;padding:0 .3em;animation:pmPop .3s both}
button.pm-tile{cursor:pointer}
button.pm-tile[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);box-shadow:0 0 0 3px var(--hi-soft)}
.pm-tile.used{background:repeating-linear-gradient(135deg,var(--rule) 0 2px,transparent 2px 6px);color:var(--ink-2);border-color:var(--ink-2);border-style:dashed}
.pm-tile.lkd{border-style:solid;border-color:var(--sel-bd);box-shadow:inset 0 0 0 2px var(--hi-soft)}
@keyframes pmPop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.pm-lockbar{margin:0 0 10px;padding:8px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.pm-lockbar p{margin:0 0 4px}
.pm-lockbar .q-actions{margin:4px 0 0}
.pm-lmsg{color:var(--red);font-weight:700}
.pm-lwrap{max-height:340px;overflow:auto;margin:0 0 10px;padding:6px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.pm-lgrid{display:grid;grid-template-columns:repeat(var(--pm-lc,4),minmax(0,1fr));gap:6px}
.pm-lcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.pm-row{display:block;min-height:30px;padding:2px 4px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:700 1rem/1.5 var(--font-ui);letter-spacing:.08em;text-align:center}
button.pm-row:hover{border-color:var(--pen)}
.pm-row.on{background:var(--hi-soft);border:2px solid var(--sel-bd)}
.pm-row.pend{color:var(--ink-2);border-style:dashed;opacity:.5}

/* Explore */
.pm-top{margin-bottom:4px}
.pm-mnote{margin:-4px 0 10px}
.pm-cap.long{font-size:clamp(1.05rem,3vw,1.45rem)}
.pm-sl .slider output{color:var(--ink)!important}
.pm-sl input[type=range]{accent-color:var(--ink)!important}
.pm-vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.pm-vsc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border:1.5px solid var(--ink-2);border-radius:8px;background:var(--sheet);text-align:center}
.pm-vsc + .pm-vsc{border-style:dashed}
.pm-vsl{font-size:.82rem;font-weight:700;color:var(--ink-2)}
.pm-vsf{font:400 1rem var(--font-math)}
.pm-vsn{font:700 1.9rem/1.1 var(--font-math)}
.pm-fact{margin:4px 0 0;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.pm-fl{margin:0 0 6px}
.pm-fl .m{white-space:normal}
.pm-fg{display:grid;grid-template-columns:repeat(var(--pm-fn,8),minmax(0,32px));gap:3px;margin:2px 0 6px}
.pm-ft{display:grid;place-items:center;min-height:28px;border:1.5px solid var(--ink-2);border-radius:5px;background:var(--sheet);font:400 1rem var(--font-math);color:var(--ink)}
.pm-ft.x{opacity:.32;text-decoration:line-through}
.pm-ft.one{border-style:dashed}
.pm-fbar{grid-column:1 / -1;height:2px;background:var(--ink);margin:1px 0}
.pm-fact.fresh .pm-ft.x{animation:pmFade 1.1s .15s both}
@keyframes pmFade{from{opacity:1;text-decoration-color:transparent}to{opacity:.32}}
.pm-fres{margin:0}
@media (max-width:560px){ .pm-fg{gap:2px} .pm-ft{min-height:26px;font-size:.92rem} }

/* hero */
.pm-h{display:grid;gap:4px;justify-items:center;width:100%}
.pm-hsvg{display:block;width:100%;max-width:420px;height:auto}
.pm-hg{stroke:var(--ink);stroke-width:2}
.pm-hstep{fill:var(--sheet);stroke:var(--ink);stroke-width:2;transition:fill .4s}
.pm-hstep.on{fill:var(--hi)}
.pm-hstep.was{fill:var(--hi-soft)}
.pm-hlab{font:700 13px var(--font-ui);fill:var(--ink);text-anchor:middle}
.pm-hstep.on + .pm-hlab{fill:var(--hi-ink)}
.pm-hch{font:700 12px var(--font-ui);fill:var(--ink-2);text-anchor:middle}
.pm-hr circle{fill:var(--sheet);stroke:var(--pen);stroke-width:2}
.pm-hr.up circle{fill:var(--pen)}
.pm-hr text{font:700 13px var(--font-ui);fill:var(--ink);text-anchor:middle}
.pm-hr.up text{fill:var(--sheet)}
.pm-hgap{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:3 3}
.pm-hprod{min-height:1.4em;font:700 1.45rem var(--font-math);color:var(--ink)}
.pm-hfact{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .6s}
.pm-hfact.on{opacity:1}
.pm-hfl,.pm-hfr{font:400 1.1rem var(--font-math)}
.pm-hfr{opacity:0;transition:opacity .6s .3s}
.pm-hfact.gone .pm-hfr{opacity:1}
.pm-hfg{display:grid;grid-template-columns:repeat(8,24px);gap:2px}
.pm-hft{display:grid;place-items:center;height:24px;border:1.5px solid var(--ink-2);border-radius:4px;font:400 .9rem var(--font-math);background:var(--sheet);transition:opacity .9s}
.pm-hbar{grid-column:1 / -1;height:2px;background:var(--ink)}
.pm-hfact.gone .pm-hft.t{opacity:.22;text-decoration:line-through}

/* Part 3 */
.pq-tabs{margin-bottom:10px}
.pq-tick{color:var(--green);font-weight:700}
.pq-card{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 12px;padding:10px 14px;border:2px solid var(--ink);border-radius:10px;background:var(--sheet)}
.pq-lab{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.pq-eq{font:400 clamp(1.4rem,4vw,1.9rem) var(--font-math)}
.pq-eq .m{white-space:normal}
.pq-h{margin:12px 0 4px}
.pq-sym > div > .pq-h:first-child{margin-top:0}
.pq-ask{margin:0 0 6px}
.pq-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.pq-chip{min-height:36px;font-size:1rem}
.pq-chip.right{border-color:var(--green);background:var(--good-bg);color:var(--ink)}
.pq-chip:disabled{opacity:1}
.pq-hdr,.pq-ladder.pair .pq-rung,.pq-ladder.seven .pq-rung{display:grid;grid-template-columns:4.4em minmax(0,1fr) minmax(0,1.3fr);gap:6px;align-items:center}
.pq-ladder.seven .pq-rung{grid-template-columns:4.4em minmax(0,1fr)}
.pq-hdr{padding:0 21.5px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.pq-ladder{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow:auto;padding:6px;border-left:4px solid var(--ink-2);border-right:4px solid var(--ink-2);border-radius:4px;background:var(--paper)}
.pq-rung{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:36px;padding:3px 10px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem var(--font-math);text-align:left}
.pq-rung:hover:not(:disabled){border-color:var(--pen)}
.pq-rung b{font-size:1.12rem}
.pq-rung small{font-size:.82rem;color:var(--ink-2)}
.pq-c{display:flex;flex-direction:column;min-width:0}
.pq-rung.right{border:2px solid var(--green);background:var(--good-bg)}
.pq-rung.wrong{border:2px solid var(--red);background:var(--bad-bg)}
.pq-rung:disabled{opacity:.75;cursor:default}
.pq-rung.right:disabled{opacity:1}
.pq-done{margin:10px 0 0}

/* task */
.pm-conds{margin:.4em 0 .8em;padding-left:1.4em}
.cd-in{margin:4px 0 12px}
.cd-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.cd-lab{min-width:10em;font-weight:700}
.cd-b{min-width:42px}

et\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003cdiv class=\"pm-hprod\" id=\"pm-hprod\" aria-hidden=\"true\">\u003c/div>\u003cdiv class=\"pm-hfact\" id=\"pm-hfact\" aria-hidden=\"true\">\u003c/div>\u003c/div>"}},"goals":["I can tell whether order matters in a selection.","I can count ordered selections of `r` objects from `n` using the fundamental counting principle.","I can evaluate `P(n, r)` using `n!/(n - r)!`.","I can solve equations involving `P(n, r)`, such as `P(n, 2) = 56`.","I can explain why `P(n, r)` is faster than listing, and when repeats make it `n^r` instead.","I can solve problems with permutations in real contexts."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Fundamental counting principle","goal":2,"prompt":"A 3-digit code uses the digits 1 to 9 with no digit repeated. How many codes are possible?","options":[{"t":"27","why":"Multiply the choices for each position.","_n":"0e8a","_k":"ce57c317"},{"t":"504","why":"9 × 8 × 7 = 504.","_n":"1eba","_k":"2249b32b"},{"t":"729","why":"`9^3` reuses digits.","_n":"2eaa","_k":"b6845040"},{"t":"362 880","why":"Only 3 positions.","_n":"3eda","_k":"e1d395c0"}],"hints":["How many choices for the first digit?","Then 8, then 7.","504."]},{"id":"w2","skill":"Fundamental counting principle","goal":1,"prompt":"In which situation does order matter?","options":[{"t":"Picking 3 pizza toppings","why":"Pepperoni–olive is the same pizza as olive–pepperoni.","_n":"4eca","_k":"1bd896f8"},{"t":"Choosing a president and a vice-president from a club","why":"Swapping the two people changes who holds which role.","_n":"5efa","_k":"1e742583"},{"t":"Dealing a 5-card hand","why":"A hand is the same in any order.","_n":"6eea","_k":"a752c928"},{"t":"Choosing 2 people for a committee","why":"Both seats are the same.","_n":"7e1a","_k":"32fb7b0d"}],"hints":["Does swapping two choices give a different result?","Roles make positions different.","President and VP."]},{"id":"w3","skill":"Factorials","goal":3,"prompt":"Simplify `{7!}/{4!}`.","options":[{"t":"6","why":"Factorials don’t subtract like that.","_n":"8e0a","_k":"6f942997"},{"t":"35","why":"Only `4!` is in the denominator.","_n":"90ff","_k":"28b8c6de"},{"t":"210","why":"7 × 6 × 5 = 210.","_n":"a10f","_k":"530a0098"},{"t":"840","why":"4 is part of `4!`, which cancels.","_n":"b11f","_k":"3a683729"}],"hints":["Write `7! = 7 × 6 × 5 × 4!`.","`4!` cancels.","210."]},{"id":"w4","skill":"Factorials","goal":3,"prompt":"Evaluate `{5!}/{0!}`.","options":[{"t":"Undefined","why":"`0! = 1`.","_n":"c12f","_k":"81f00657"},{"t":"0","why":"Dividing by 1 doesn’t give 0.","_n":"d13f","_k":"3dc57339"},{"t":"5","why":"`5! = 120`.","_n":"e14f","_k":"8ad19453"},{"t":"120","why":"`0! = 1`, so `5!/0! = 120`.","_n":"f15f","_k":"266f6b5e"}],"hints":["What is `0!`?","1.","120."]},{"id":"w5","skill":"Quadratics","goal":4,"prompt":"Solve `n^2 - n = 56` for `n > 0`.","options":[{"t":"7","why":"49 − 7 = 42.","_n":"g16f","_k":"1ac8f517"},{"t":"8","why":"64 − 8 = 56.","_n":"h07f","_k":"040e8f29"},{"t":"28","why":"Halves 56.","_n":"i08f","_k":"e2570718"},{"t":"56","why":"Reads the constant.","_n":"j820","_k":"a59f088b"}],"hints":["`n(n - 1) = 56`.","Consecutive numbers multiplying to 56.","8 × 7, so `n = 8`."]},{"id":"w6","skill":"Quadratics","goal":4,"prompt":"Solve `(n - 1)(n - 2) = 30` for `n > 2`.","options":[{"t":"6","why":"5 × 4 = 20.","_n":"k810","_k":"8e500cb1"},{"t":"7","why":"6 × 5 = 30.","_n":"l840","_k":"65276f68"},{"t":"8","why":"7 × 6 = 42.","_n":"m830","_k":"9eba9c55"},{"t":"30","why":"Reads the constant.","_n":"n860","_k":"10187b9b"}],"hints":["Consecutive numbers multiplying to 30.","6 × 5.","`n - 1 = 6`, so `n = 7`."]}],"refreshers":{"Fundamental counting principle":"Multiply the choices at each stage. If an item can’t be reused, each stage has one fewer choice.","Factorials":"`n!/m!` for `m \u003c n` is the product from `n` down to `m + 1`. `0! = 1`.","Quadratics":"For `n(n - 1) = k`, look for consecutive whole numbers with product `k`, or factor `n^2 - n - k = 0` and keep the positive root."}}},"explore":{"heading":"Podium and seats","intro":"Fill ranked places from a group. Watch the choices shrink and the count build, then test it against a full list.","predIntro":"Make a prediction first. Then the podium and seats will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"podium","n":8,"r":3},"prompt":"Podium, 8 runners, 3 medals. How many ways can gold, silver and bronze be awarded?","options":[{"t":"24","_n":"o850","_k":"856fda41"},{"t":"56","_n":"p880","_k":"f988b98b"},{"t":"336","_n":"q870","_k":"d61ff2ba"},{"t":"512","_n":"r8a0","_k":"67b15bb0"}],"explain":"8 × 7 × 6 = 336. 512 = `8^3` lets one runner win twice; 56 ignores the order of medals; 24 is 8 × 3."},{"id":"p2","start":{"mode":"rep","n":5,"r":3},"prompt":"Codes of length 3 from 5 digits. Which is larger: codes with repeated digits allowed, or without?","options":[{"t":"With repeats: 125 vs 60","_n":"s890","_k":"0dbd5d4e"},{"t":"It depends on the digits","_n":"t9c0","_k":"6f7a4957"},{"t":"They’re equal","_n":"u9d0","_k":"43b0de4d"},{"t":"Without repeats","_n":"v9a0","_k":"7fe4d8fb"}],"explain":"With repeats every slot has 5 choices: `5^3 = 125`. Without, 5 × 4 × 3 = 60."},{"id":"p3","start":{"mode":"podium","n":5,"r":5},"prompt":"Podium with 5 runners and 5 places. `P(5, 5)` equals…","options":[{"t":"25","_n":"w9b0","_k":"d809745d"},{"t":"undefined","_n":"x980","_k":"780c5700"},{"t":"120","_n":"y990","_k":"adadd697"},{"t":"1","_n":"z960","_k":"bfb0c588"}],"explain":"`5!/0! = 5!/1 = 120`: arranging all 5 is a full line-up."},{"id":"p4","start":{"mode":"list","n":4,"r":2},"prompt":"List mode, 4 people (A, B, C, D), 2 places. Among the 12 permutations, how many times does the pair {A, B} appear?","options":[{"t":"1","_n":"10970","_k":"fd70628e"},{"t":"2","_n":"11940","_k":"edba07a3"},{"t":"4","_n":"12950","_k":"ce0617fa"},{"t":"12","_n":"130e0","_k":"652cb798"}],"explain":"Each pair appears in `2! = 2` orders. If order didn’t matter, you’d divide by 2: that’s a combination (module 11)."}],"chalIntro":"Set up the podium and seats, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Set `n` and `r` so the count is exactly 60.","why":"60 = 5 × 4 × 3 = `P(5, 3)`: the only pair with `n ≤ 10`.","hints":["60 = 5 × 4 × 3.","Three consecutive factors starting at 5.","`n = 5`, `r = 3`."]},{"id":"tc2","goal":2,"prompt":"Seats mode: 7 club members, 3 roles (President, VP, Treasurer). Lock Ana as President. How many slates?","why":"President is decided, so VP has 6 choices and Treasurer 5: 1 × 6 × 5 = 30.","hints":["President is decided.","VP: 6 choices; Treasurer: 5.","6 × 5 = 30."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Find \u003cstrong>every\u003c/strong> pair (`n`, `r`) with `n ≤ 10` and `r ≥ 2` for which `P(n, r) = 720`. The tool records each pair you find.","why":"`P(6, 5) = 6!/1! = 720`, `P(6, 6) = 6!/0! = 720` and `P(10, 3) = 10 × 9 × 8 = 720`.","hints":["720 = `6!`.","`P(6, 5) = 6!/1!` and `P(6, 6) = 6!/0!`: both are 720, because `1! = 0! = 1`.","720 = 10 × 9 × 8 too: `P(10, 3)`."]}]},"part3":{"slug":"equations","name":"Equations","heading":"Permutations as equations","intro":"Work backwards from a count to `n` or `r`. At each station, choose the expanded form, find the answer on the consecutive-products ladder, then check it with algebra.","stations":[{"id":"s1","eq":"`P(n, 2) = 56`","ask":"Which expression equals `P(n, 2)`?","ladder":"two","target":56,"_a":"Xg==","unknown":"n","options":[{"t":"`{n!}/{2!}`","why":"Divide by the factorial of the objects \u003cstrong>left out\u003c/strong>: `(n - 2)!`, not `2!`.","_n":"140d0","_k":"ee09ca96"},{"t":"`n^2`","why":"That lets the same object fill both places. Once someone is chosen, they can’t be chosen again: the choices shrink, `n`, `n - 1`, …","_n":"150c0","_k":"15184248"},{"t":"`n(n - 1)`","why":"Two places: `n` choices, then `n - "Type a whole number (15 120 and 15120 are both fine), then press Check.","items":[{"id":"n1","goal":3,"prompt":"Evaluate `P(9, 4)`.","_a":"VVULBQ==","display":"3024","label":"Number of ways:","why":"`P(9, 4) = {9!}/{5!}` = 9 × 8 × 7 × 6 = 3024.","wrong":[{"match":15120,"fb":"That’s `9!/4!`. Divide by `(9 - 4)! = 5!`."}],"hints":["How many factors does `P(9, 4)` have?","Four factors, starting at 9.","9 × 8 × 7 × 6 = 3024."]},{"id":"n2","goal":2,"prompt":"12 runners: how many ways to fill 1st, 2nd and 3rd?","_a":"V1YLAQ==","display":"1320","label":"Number of ways:","why":"12 × 11 × 10 = 1320.","wrong":[{"match":1728,"fb":"`12^3` lets one runner place twice."}],"hints":["How many runners can finish 1st? How many are left for 2nd?","12, then 11, then 10.","12 × 11 × 10 = 1320."]},{"id":"n3","goal":6,"star":true,"prompt":"How many even 3-digit numbers with all different digits can be made from 1, 2, 3, 4, 5, 6?","_a":"UFU=","display":"60","label":"Number of ways:","why":"Last digit: 3 even choices (2, 4 or 6). Then 5 × 4 for the other two: 3 × 5 × 4 = 60.","wrong":[{"match":120,"fb":"The last digit must be even: 3 choices. Then 5 × 4."}],"hints":["Which position has a condition? Fill it first.","The last digit: 3 even choices. Then 5, then 4.","3 × 5 × 4 = 60."]},{"id":"n4","goal":6,"star":true,"prompt":"How many 4-digit numbers have all different digits (digits 0–9)?","_a":"UlAKBw==","display":"4536","label":"Number of ways:","why":"9 × 9 × 8 × 7 = 4536.","wrong":[{"match":5040,"fb":"A number can’t start with 0: 9 × 9 × 8 × 7."}],"hints":["Which digit can’t go first?","First digit: 9 choices (1–9). Second digit: 9 (0 is now allowed).","9 × 9 × 8 × 7 = 4536."]},{"id":"n5","goal":6,"star":true,"prompt":"In how many ways can 5 people sit in a row of 8 chairs (3 chairs stay empty)?","_a":"UFILAQ==","display":"6720","label":"Number of ways:","why":"Seat the people one at a time: 8 × 7 × 6 × 5 × 4 = 6720 = `P(8, 5)`.","wrong":[{"match":56,"fb":"People are different and seats ill feels shaky? What will you practise?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":3,"a":{"prompt":"Evaluate `P(7, 3)`.","options":[{"t":"35","why":"That ignores order: 210 ÷ `3!`.","_n":"2i00e","_k":"162973c9"},{"t":"210","why":"7 × 6 × 5 = 210.","_n":"2j01e","_k":"3497aedc"},{"t":"343","why":"`7^3` allows repeats.","_n":"2k02e","_k":"967690d9"},{"t":"840","why":"`7!/3! = 840`: divide by `4!`, not `3!`.","_n":"2l03e","_k":"9ceebcab"}]},"b":{"prompt":"Evaluate `P(6, 2)`.","options":[{"t":"15","why":"That ignores order: 30 ÷ `2!`.","_n":"2m04e","_k":"58e41809"},{"t":"30","why":"6 × 5 = 30.","_n":"2n05e","_k":"e6bd529c"},{"t":"36","why":"`6^2` allows repeats.","_n":"2o06e","_k":"4621cb99"},{"t":"360","why":"`6!/2! = 360`: divide by `4!`, not `2!`.","_n":"2p07e","_k":"584deba3"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"In which situation does order matter?","options":[{"t":"Awarding 1st, 2nd and 3rd prizes at a science fair","why":"Different prizes make different outcomes.","_n":"2q08e","_k":"e29fabe6"},{"t":"Choosing 3 paint colours for a mural","why":"A set of colours, not a sequence.","_n":"2r632","_k":"2257fac2"},{"t":"Choosing 3 students to stay after the event","why":"All three do the same job.","_n":"2s642","_k":"5c48b328"},{"t":"Choosing 3 apps to delete from a phone","why":"The same apps in any order give the same result.","_n":"2t652","_k":"818d8212"}]},"b":{"prompt":"In which situation does order matter?","options":[{"t":"Packing 4 sweaters for a trip","why":"A set of sweaters, not a sequence.","_n":"2u662","_k":"26ae787c"},{"t":"Selecting 4 songs for a download bundle","why":"The same songs in any order give the same bundle.","_n":"2v672","_k":"68365e32"},{"t":"Picking 4 people for a team","why":"Every spot on the team is the same, so swapping two people gives the same team.","_n":"2w682","_k":"623e0628"},{"t":"Assigning 4 swimmers to 4 different lanes","why":"Different lanes make different outcomes: swapping two swimmers changes the result.","_n":"2x692","_k":"7db84345"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Which expression equals `P(n, r)`?","options":[{"t":"`{n!}/{r!}`","why":"Divide by the factorial of the objects \u003cstrong>left out\u003c/strong>: `(n - r)!`.","_n":"2y6a2","_k":"f4ce72d3"},{"t":"`n^r`","why":"That allows repeats. Once someone is chosen, they can’t be chosen again: the choices shrink, `n`, `n - 1`, …","_n":"2z5b2","_k":"24916316"},{"t":"`{n!}/{r!(n - r)!}`","why":"That’s a combination.","_n":"305c2","_k":"0ccd0252"},{"t":"`{n!}/{(n - r)!}`","why":"Divide `n!` by the factorial of the `n - r` objects left out.","_n":"31692","_k":"0e1a51d3"}]},"b":{"prompt":"Which expression equals `P(10, 4)`?","options":[{"t":"`{10!}/{4! × 6!}`","why":"That’s a combination: it ignores order.","_n":"32682","_k":"8a0c80b6"},{"t":"`{10!}/{6!}`","why":"10 − 4 = 6 objects are left out: `10!/6!` = 10 × 9 × 8 × 7.","_n":"33672","_k":"ae3117a7"},{"t":"`{10!}/{4!}`","why":"Divide by the factorial of the objects \u003cstrong>left out\u003c/strong>: `(10 - 4)! = 6!`.","_n":"34662","_k":"07774e36"},{"t":"`10^4`","why":"That allows repeats. Once someone is chosen, they can’t be chosen again: the choices shrink, `n`, `n - 1`, …","_n":"356d2","_k":"8deec6ed"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Solve `P(n, 2) = 110`.","options":[{"t":"`n = 11`","why":"`n(n - 1) = 110 = 11 × 10`.","_n":"366c2","_k":"ddcf3662"},{"t":"`n = 55`","why":"Halving doesn’t solve it.","_n":"376b2","_k":"c0bc04c9"},{"t":"`n = 11` or `n = -10`","why":"`n` counts objects: reject negative or impossible values.","_n":"386a2","_k":"d84970d1"},{"t":"`n = 10`","why":"10 × 9 = 90.","_n":"39612","_k":"d850f7d0"}]},"b":{"prompt":"Solve `P(n, 2) = 132`.","options":[{"t":"`n = 12`","why":"12 × 11 = 132.","_n":"3a602","_k":"59adc76a"},{"t":"`n = 66`","why":"Halving doesn’t solve it.","_n":"3b6f2","_k":"5867e0b8"},{"t":"`n = 11`","why":"11 × 10 = 110.","_n":"3c702","_k":"9d6f4cdc"},{"t":"`n = 12` or `n = -11`","why":"`n` counts e 3 from `P(n, 3)`.","_n":"3tdd2","_k":"bb94c8a2"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why choosing a president, VP and treasurer from 10 people is a permutation?","options":[{"t":"The three roles are different, so the same three people in different roles give a different slate. Order matters.","why":"Different roles make the order matter.","_n":"3udc2","_k":"c64ed7cf"},{"t":"Because nobody can be chosen twice.","why":"That rules out repeats, but committees also have no repeats; what matters is the roles.","_n":"3vdb2","_k":"0afc09a6"},{"t":"Because 10 is greater than 3.","why":"Irrelevant.","_n":"3wdc2","_k":"ec6000a6"},{"t":"Because exactly three people are chosen.","why":"The number chosen doesn’t decide it.","_n":"3xdd2","_k":"e1bc2b46"}]},"b":{"prompt":"Which is the best explanation of why choosing 3 people for a committee is \u003cstrong>not\u003c/strong> a permutation?","options":[{"t":"Because committees are smaller than clubs.","why":"Irrelevant.","_n":"3yde2","_k":"b96c9c1e"},{"t":"Because people can’t repeat.","why":"Permutations don’t allow repeats either.","_n":"3zd72","_k":"2289831b"},{"t":"Because `P(n, 3)` is too big to compute.","why":"Size isn’t the reason.","_n":"40d82","_k":"43f2af1b"},{"t":"All three seats are the same, so rearranging the same people gives the same committee.","why":"Identical seats mean order doesn’t matter.","_n":"41d92","_k":"62e19660"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which work for `P(8, 3)` is correct?","options":[{"t":"`8^3` = 512","why":"That allows repeats. Once someone is chosen, they can’t be chosen again: the choices shrink, `n`, `n - 1`, …","_n":"42da2","_k":"015d389c"},{"t":"`{8!}/{3!}` = 6720","why":"Divide by the factorial of the objects \u003cstrong>left out\u003c/strong>: `(8 - 3)! = 5!`.","_n":"43e32","_k":"5d775618"},{"t":"`{8!}/{(8 - 3)!} = {8!}/{5!}` = 8 × 7 × 6 = 336","why":"The 5 objects left out cancel, leaving 3 factors.","_n":"44e42","_k":"464454bb"},{"t":"8 × 3 = 24","why":"8 × 3 isn’t a counting rule. Use 8, 7, 6 for 3 places.","_n":"45e12","_k":"709398a8"}]},"b":{"prompt":"Which work for `P(9, 2)` is correct?","options":[{"t":"`{9!}/{7!}` = 9 × 8 = 72","why":"The 7 objects left out cancel, leaving 2 factors.","_n":"46e02","_k":"599f65bd"},{"t":"`9^2` = 81","why":"That allows repeats. Once someone is chosen, they can’t be chosen again: the choices shrink, `n`, `n - 1`, …","_n":"47df2","_k":"3caab396"},{"t":"9 × 2 = 18","why":"9 × 2 isn’t a counting rule. Use 9, 8 for 2 places.","_n":"48de2","_k":"ab57c9a2"},{"t":"`{9!}/{2!}` = 181 440","why":"Divide by the factorial of the objects \u003cstrong>left out\u003c/strong>: `(9 - 2)! = 7!`.","_n":"49dd2","_k":"cc06314a"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A Grade 12 class of 25 elects a president, VP and treasurer. How many slates are possible?","options":[{"t":"75","why":"25 × 3 isn’t a counting rule. Use 25, 24, 23 for 3 places.","_n":"4adc2","_k":"d374f479"},{"t":"2300","why":"That ignores the roles.","_n":"4bdb2","_k":"58fe1733"},{"t":"13 800","why":"25 × 24 × 23 = 13 800.","_n":"4cda2","_k":"cf63a0ee"},{"t":"15 625","why":"`25^3` lets one student hold two roles.","_n":"4de92","_k":"9ba2ca91"}]},"b":{"prompt":"A film festival awards 1st, 2nd and 3rd place to 3 of 15 films. How many outcomes?","options":[{"t":"45","why":"15 × 3 isn’t a counting rule. Use 15, 14, 13 for 3 places.","_n":"4ee82","_k":"4959f6d5"},{"t":"455","why":"That ignores the order of the places: 2730 ÷ `3!`.","_n":"4fe72","_k":"25f778f1"},{"t":"2730","why":"15 × 14 × 13 = 2730.","_n":"4ge82","_k":"838e7518"},{"t":"3375","why":"`15^3` lets one film win twice.","_n":"4he52","_k":"429a2c09"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A locker code is 2 different letters (A–Z) followed by 3 different digits (0–9). How many codes?","options":[{"t":"1370","why":"650 + 720: the stages happen together, so multiply.","_n":"4ie62","_k":"f8d6e847"},{"t":"468 000","why":"26 × 25 = 650 and 10 × 9 × 8 = 720; 650 × 720 = 468 000.","_n":"4jeb2","_k":"c87ff527"},{"t":"676 000","why":"`26^2 × 10^3` allows repeats.","_n":"4kec2","_k":"ea4593d0"},{"t":"45 239 040","why":"`P(36, 5)` lets letters and digits go anywhere.","_n":"4le92","_k":"29171d99"}]},"b":{"prompt":"A code is 3 different letters followed by 2 different digits. How many codes?","options":[{"t":"15 690","why":"Multiply the stages.","_n":"4mea2","_k":"14bd8680"},{"t":"1 404 000","why":"26 × 25 × 24 = 15 600 and 10 × 9 = 90; 15 600 × 90 = 1 404 000.","_n":"4ndf2","_k":"10b15188"},{"t":"1 757 600","why":"`26^3 × 10^2` allows repeats.","_n":"4oe02","_k":"3c0a4d2b"},{"t":"45 239 040","why":"`P(36, 5)` ignores the letter-then-digit pattern.","_n":"4p6d3","_k":"81fdf0fa"}]}}]},"task":{"title":"Code designer","summary":"Code designer","statement":"\u003cp>Design a code system with no repeated symbols. Choose how many symbols are available (`n`) and how long each code is (`r`). Meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"pm-conds\">\u003cli>There are at least 1000 possible codes.\u003c/li>\u003cli>There are at most 3000 possible codes (so the codes stay easy to manage).\u003c/li>\u003cli>Each code is at least 3 symbols long.\u003c/li>\u003c/ol>","checks":["At least 1000 codes","At most 3000 codes","Codes of length 3 or more"],"tips":["Start with `r = 3`: which `n` puts `n(n - 1)(n - 2)` between 1000 and 3000?","`P(9, 4) = 3024` is just over the limit. Try fewer symbols.","Longer codes need fewer symbols: try `r = 5`."],"explainPrompt":"Explain how you searched for the answers and why longer codes need fewer symbols.","vocab":"Use the words permutation, P(n, r) and no repeats.","more":"There’s more than one answer. Can you find them all?","after3":"Each extra symbol in the code multiplies by a smaller number, so you need fewer symbols for longer codes."},"cards":[["Permutation","An arrangement where order matters."],["`P(n, r)`","`n!/(n - r)! = n(n - 1)⋯(n - r + 1
