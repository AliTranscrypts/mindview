.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 35 Pearson r: module styles (prefix pr- / ml- / rk-). Colours from tokens only. */
.pr-bar{text-decoration:overline;text-decoration-thickness:.07em;font-style:italic}
.pr-svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.pr-svg text{font-family:inherit}
.pr-grid{stroke:var(--plot-grid);stroke-width:1}
.pr-axis{stroke:var(--plot-axis);stroke-width:1.5}
.pr-tl{fill:var(--ink-2);font-size:12px}
.pr-al{fill:var(--ink-2);font-size:13px;font-style:italic}
.pr-pt{fill:var(--pen);stroke:var(--sheet);stroke-width:1.5}
.pr-pt.pr-far{fill:var(--ev-c)}
.pr-ring{fill:none;stroke:var(--ink);stroke-width:2}
.pr-plab{fill:var(--ink);font-size:12px;font-weight:700}
.pr-qp{fill:var(--hi-soft)}
.pr-qm{fill:var(--ink-2);fill-opacity:.15}
.pr-ql{fill:var(--ink-2);font-size:22px;font-weight:700}
.pr-mean{stroke:var(--ink-2);stroke-width:1.6;stroke-dasharray:6 5}
.pr-band{fill:var(--hi-soft)}
.pr-bp{fill:var(--pen)}
.pr-bm{fill:var(--ev-c)}
.pr-btl{fill:var(--ink);font-size:11px;font-weight:700}
.pr-ttrack{fill:none;stroke:var(--rule);stroke-width:1.5}
.pr-flash .pr-tl{fill:var(--ink);font-weight:700}
.pr-box{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:4px;margin:0 0 8px}
.pr-box:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.pr-top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin:0 0 12px}
.pr-modeltag{margin:2px 0 8px}
/* dial */
.pr-dial{max-width:300px;margin:0 auto 8px}
.pr-dsvg{display:block;width:100%;height:auto}
.pr-dz{fill:none;stroke-width:12}
.pr-dzs{stroke:var(--pen);stroke-opacity:.55}
.pr-dzm{stroke:var(--pen);stroke-opacity:.3}
.pr-dzw{stroke:var(--ink-2);stroke-opacity:.18}
.pr-dt{stroke:var(--ink-2);stroke-width:1.5}
.pr-dtl{fill:var(--ink-2);font-size:13px}
.pr-dtl.sm{font-size:10px}
.pr-needle{stroke:var(--ink);stroke-width:3.5;stroke-linecap:round}
.pr-hub{fill:var(--ink)}
.pr-dval{fill:var(--ink);font-size:20px;font-weight:700;font-style:normal}
/* product bars */
.pr-bars{margin:8px 0}
.pr-bh{font-size:.9rem;font-weight:700;margin:0 0 6px}
.pr-brow{display:grid;grid-template-columns:5.6em 1fr 3.6em;gap:8px;align-items:center;font-size:.9rem;margin:2px 0}
.pr-btrack{position:relative;height:12px;border-left:0;background:linear-gradient(var(--rule),var(--rule)) 50% 0/1px 100% no-repeat}
.pr-btrack i{position:absolute;top:1px;height:10px;border-radius:2px}
.pr-bpos{background:var(--pen)}
.pr-bneg{background:var(--ev-c)}
.pr-bval{text-align:right;font-variant-numeric:tabular-nums}
.pr-btot{border-top:1px solid var(--rule);padding-top:3px;font-weight:700}
/* steps */
.pr-steps .tbl-wrap{max-width:100%;overflow-x:auto}
.pr-swrow{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0}
.pr-means{margin:4px 0}
.pr-form{margin:8px 0;line-height:1.6}
.pr-fin{width:4.6em}
.pr-frow{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;align-items:center}
.pr-frow label{display:flex;gap:6px;align-items:center}
/* controls */
.pr-pick{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.pr-pickt{font-variant-numeric:tabular-nums}
.pr-move{display:flex;gap:6px;margin:0 0 8px}
.pr-move .btn{min-width:2.6em}
.pr-tools{margin-top:10px}
.pr-gsl{display:block;margin:0 0 10px}
.pr-gsl input{width:100%}
/* card slots */
.pr-cards{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px;min-height:2.6em}
.pr-card{min-width:2.6em;min-height:2.6em;border:2px solid var(--pen);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.pr-card[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd)}
.pr-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 6px}
.pr-slot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:2px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;cursor:pointer}
.pr-slot.empty{border-style:dashed}
.pr-slot[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd)}
.pr-slab{font-size:.8rem;color:var(--ink-2)}
.pr-sval{font-size:1.2rem;font-weight:700}
.pr-card:focus-visible,.pr-slot:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
/* hero */
.pr-hero{width:100%}
.pr-hrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.pr-hrow>.pr-svg:first-child{flex:1 1 260px;max-width:360px}
.pr-hrow>.pr-tot{flex:0 0 90px;width:90px}
.pr-hdial{flex:1 1 170px;max-width:230px;text-align:center}
.pr-hform{margin:0}
/* Part 3 */
.ml-tabs{margin:0 0 10px}
.ml-card{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.ml-lab{margin:0 0 6px;font-size:1.05rem}
.ml-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.ml-plot{display:block;width:100%;padding:6px;border:2px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ml-plot[aria-pressed="true"]{border-color:var(--sel-bd);background:var(--hi-soft)}
.ml-plot:disabled{cursor:default}
.ml-pt{display:block;font-weight:700;font-size:.9rem;margin:0 0 4px}
.ml-s2box{max-width:460px}
.ml-choices{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.ml-choices .btn{text-align:left;white-space:normal;height:auto}
.ml-ch[aria-pressed="true"]{border-color:var(--sel-bd)}
.ml-after{margin:8px 0}
.pr-tick{font-weight:700}
.pr-conds{margin:6px 0 0 1.2em}
@media (max-width:560px){
  .ml-grid{grid-template-columns:minmax(0,1fr)}
  .pr-brow{grid-template-columns:4.8em 1fr 3.2em}
}

l data set using a deviation table.","I can explain how `r` is built from paired deviations (the quadrant picture).","I can predict how unit changes, swapping variables, outliers and a restricted range affect `r`.","I can recognize when `r` is misleading and describe the relationship more accurately."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Means and deviations","goal":2,"prompt":"`y` = 6, 8, 10, 12, 14. What are the deviations from the mean?","options":[{"t":"−2, −1, 0, 1, 2","why":"Those are deviations from 10 divided by 2.","_n":"0957","_k":"fb29c136"},{"t":"−4, −2, 0, 2, 4","why":"The mean is 10.","_n":"1947","_k":"814f463d"},{"t":"6, 8, 10, 12, 14","why":"Subtract the mean.","_n":"2937","_k":"ec1f768e"},{"t":"4, 2, 0, 2, 4","why":"Below the mean is negative.","_n":"3927","_k":"bfc6dc3a"}],"hints":["Find the mean first.","50 ÷ 5 = 10.","Subtract 10 from each value."]},{"id":"w2","skill":"Means and deviations","goal":2,"prompt":"What is the sum of the squared deviations of 6, 8, 10, 12, 14?","options":[{"t":"0","why":"The deviations sum to 0; the squares don’t.","_n":"4917","_k":"9ef0b39e"},{"t":"10","why":"That’s the sum of squares for 1–5.","_n":"5907","_k":"dcd3589a"},{"t":"20","why":"Adds the absolute values, 4 + 2 + 0 + 2 + 4 = 12, then guesses.","_n":"68f7","_k":"73338f68"},{"t":"40","why":"16 + 4 + 0 + 4 + 16.","_n":"78e7","_k":"3fa49f59"}],"hints":["Square each deviation.","16, 4, 0, 4, 16.","40."]},{"id":"w3","skill":"Signed products","goal":3,"prompt":"What is (−2)(−3) + (1)(−4)?","options":[{"t":"−10","why":"(−2)(−3) is +6.","_n":"88d7","_k":"4a178ac4"},{"t":"−2","why":"6 + (−4) = 2.","_n":"927d","_k":"fe904f81"},{"t":"2","why":"6 − 4.","_n":"a28d","_k":"98cf8561"},{"t":"10","why":"(1)(−4) is −4, not +4.","_n":"b25d","_k":"b527999c"}],"hints":["Negative × negative = positive.","6 and −4.","2."]},{"id":"w4","skill":"Signed products","goal":3,"prompt":"A point is above the mean of `y` but left of the mean of `x`. Its deviation product (`x` − \u003ci class=\"pr-bar\">x\u003c/i>)(`y` − \u003ci class=\"pr-bar\">y\u003c/i>) is…","options":[{"t":"undefined","why":"It’s just a product.","_n":"c26d","_k":"c790fdfa"},{"t":"negative","why":"(−)(+) = −.","_n":"d2bd","_k":"4fd9fd1a"},{"t":"zero","why":"Only when the point is on a mean line.","_n":"e2cd","_k":"8c3eec31"},{"t":"positive","why":"Only (+)(+) or (−)(−) give a positive.","_n":"f29d","_k":"6f04be24"}],"hints":["Left of \u003ci class=\"pr-bar\">x\u003c/i> means `x` − \u003ci class=\"pr-bar\">x\u003c/i> &lt; 0.","Above \u003ci class=\"pr-bar\">y\u003c/i> means `y` − \u003ci class=\"pr-bar\">y\u003c/i> &gt; 0.","(−)(+) = −."]},{"id":"w5","skill":"Describing scatter plots","goal":1,"prompt":"Points cluster tightly along a falling line. Which description fits?","options":[{"t":"Strong negative linear","why":"Falling means negative; tight means strong.","_n":"g2ad","_k":"e9d78836"},{"t":"Weak negative linear","why":"Tight means strong.","_n":"h1fd","_k":"59bada30"},{"t":"Strong positive linear","why":"Falling means negative.","_n":"i20d","_k":"855c5b6e"},{"t":"No correlation","why":"There’s a clear pattern.","_n":"j21d","_k":"6984b650"}],"hints":["Direction first.","Falling means negative.","Tight means strong."]},{"id":"w6","skill":"Describing scatter plots","goal":5,"prompt":"Points form a clear upside-down U. Which statement is best?","options":[{"t":"A weak negative linear one","why":"Not linear at all.","_n":"k20d","_k":"86daffbc"},{"t":"No relationship","why":"A clear curve is a relationship.","_n":"l1fd","_k":"992dfe1c"},{"t":"A strong positive linear one","why":"Half rises, half falls.","_n":"m1ed","_k":"71eea36a"},{"t":"A strong curved relationship","why":"The points follow a clear curve: a strong pattern, but not a line.","_n":"n1dd","_k":"50024b0b"}],"hints":["Is there a pattern?","Yes: a curve.","A strong curved relationship."]}],"refreshers":{"Means and deviations":"Deviation = value − mean. Square them before adding, or they cancel to 0.","Signed products":"Same signs give a positive; different signs give a negative.","Describing scatter plots":"Direction, form, strength, outliers (module 34)."}}},"explore":{"heading":"`r`-m&#101;ter","intro":"Drag points and watch `r`. Turn on the quadrants to see which points push `r` up or down, then step through the calculation.","predIntro":"Make a prediction first. Then the `r`-m&#101;ter will show you what really happens.","predictions":[{"id":"p1","start":{"preset":"start","mode":"drag"},"prompt":"Start state. Swap the axes. What happens to `r`?","options":[{"t":"It becomes 0","_n":"o1cd","_k":"58d86c32"},{"t":"It becomes 1 ÷ 0.80","_n":"p1bd","_k":"e5adf22c"},{"t":"It becomes −0.80","_n":"q1ad","_k":"67b6a8d2"},{"t":"It stays 0.80","_n":"r29d","_k":"9aee8893"}],"explain":"The formula treats `x` and `y` the same way. The points reflected across the diagonal, and the dial didn’t move."},{"id":"p2","start":{"preset":"start","mode":"drag"},"prompt":"Start state. Change `x` from hours to minutes (× 60). What happens to `r`?","options":[{"t":"It stays 0.80","_n":"s28d","_k":"d05f2acf"},{"t":"It becomes 48","_n":"t1bd","_k":"1f859d70"},{"t":"It becomes 1","_n":"u1cd","_k":"1d2cf70c"},{"t":"It becomes 0.013","_n":"v1dd","_k":"e3e50f40"}],"explain":"Rescaling multiplies the top and the bottom of the formula by the same amount. The `x`-axis relabelled from 60 to 300, the points kept their places, and `r` stayed 0.80."},{"id":"p3","start":{"preset":"moderate","mode":"quad"},"prompt":"‘Moderate set’ (`r` = 0.50). Add the point (10, 10). `r` becomes about…","options":[{"t":"−0.50","_n":"w1ed","_k":"4189eb14"},{"t":"0.20","_n":"x17d","_k":"d23b1e31"},{"t":"0.50","_n":"y18d","_k":"874fa00b"},{"t":"0.90","_n":"z19d","_k":"3ace770e"}],"explain":"One far point in a ‘+’ quadrant can dominate the total. The new point landed far up the trend with a large ‘+’ bar, and the dial jumped to 0.90."},{"id":"p4","start":{"preset":"u","mode":"drag"},"prompt":"‘U-shape’. What is `r`?","options":[{"t":"It can’t be computed","_n":"101ad","_k":"384fbcf2"},{"t":"About 0.9","_n":"1123d","_k":"2e557858"},{"t":"0","_n":"1224d","_k":"0cef0923"},{"t":"About −0.9","_n":"1395d","_k":"f32c51ad"}],"explain":"`r` = 0, yet the points follow a perfect curve. `r` only sees straight-line patterns: the left points sit in ‘−’ quadrants, the right points in ‘+’ quadrants, and their bars cancel exactly."}],"chalIntro":"Use the `r`-m&#101;ter to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[1,3],"prompt":"Cards mode: place the `y`-cards 8, 9, 10, 11, 12 (each once) at `x` = 1–5 so that `r` = 0.90 exactly.","why":"Your order gives a product sum of 9, so `r` = 9 ÷ √(10 × 10) = 0.90. The four answers are 8, 9, 10, 12, 11 · 8, 9, 11, 10, 12 · 8, 10, 9, 11, 12 · 9, 8, 10, 11, 12: one neighbouring swap of the perfect order.","hints":["With these cards, both sums of squares are 10, so `r` = (sum of products) ÷ 10.","You need a product sum of 9. The perfect order gives 10.","Swap one neighbouring pair: each neighbour swap costs exactly 1."]},{"id":"tc2","goal":2,"prompt":"Steps mode, start state: complete the table and enter `r`.","why":"Products 4, 0, 0, 2, 2 sum to 8; both sums of squares are 10; `r` = 8 ÷ √(10 × 10) = 8 ÷ 10 = 0.8.","hints":["\u003ci class=\"pr-bar\">x\u003c/i> = 3 and \u003ci class=\"pr-bar\">y\u003c/i> = 10.","Products: (−2)(−2) = 4, (−1)(0) = 0, (0)(−1) = 0, (1)(2) = 2, (2)(1) = 2.","8 ÷ √100 = 0.8."]},{"id":"tc3","goal":[1,3],"stretch":true,"prompt":"‘Moderate set’ (`r` = 0.50): add \u003cstrong>one\u003c/strong> point (whole numbers, 0–10) so that `r` becomes strong (≥ 0.67).","why":"Your point sits far out in a ‘+’ quadrant, so its large positive product lifts `r` to at least 0.67. Exactly 26 points work: (0, 0), or any point with `x` ≥ 6 and `y` ≥ 6; (10, 10) gives `r` = 0.90.","hints":["Which quadrants add to `r`?","Upper-right or lower-left, far from the mean point (3, 3).","Try (10, 10), or (0, 0) in the far lower-left."]}]},"part3":{"slug":"mislead","name":"Mislead","heading":"`r` can mislead","intro":"`r` measures only how well a \u003cem>straight line\u003c/em> fits. Work through the four stations to see what `r` hides when the pattern is curved, when one point is in charge, when the range is cut off, and when a third variable is at work. Each station shows its `r` beside the plot.","stations":[{"id":"s1","title":"Four plots, one `r`","text":"Anscombe’s quartet (1973): four published data sets that each have `r` ≈ 0.82. Tap every plot where “`r` = 0.82, strong linear” is a fair description, then press Check.","plots":[{"t":"Data set I","fb":"A linear cloud: “strong linear” is fair here."},{"t":"Data set II","fb":"A smooth curve. The pattern is strong, but it isn’t linear."},{"t":"Data set III","fb":"A perfect line with one outlier. Without the outlier `r` would be almost 1."},{"t":"Data set IV","fb":"A vertical cluster with one far point. That single point creates the whole correlation."}],"after":"Same `r`, four different stories. Always plot the data before you trust `r`."},{"id":"s2","title":"One point in charge","text":"A tight cluster with no pattern (`r` ≈ 0) plus one far point gives `r` ≈ 0.9. Drag the far point (orange) back into the cluster and watch `r`. Keyboard: focus the plot and use the arrow keys.","after":"One point carried the correlation. Report an influential point, and show `r` with and without it."},{"id":"s3","title":"A restricted range","text":"Height vs arm span for all Grade 9–12 students in a school gives `r` = 0.90. Now keep only the students 170–172 cm tall.","filters":[{"id":"all","t":"All students"},{"id":"cut","t":"Only students 170–172 cm tall"}],"after":"Cutting the range hides the trend."},{"id":"s4","title":"Chance and common causes","text":"Over 10 years, a town’s streaming subscriptions and its number of bike lanes give `r` = 0.94. What does the correlation show?","choices":[{"t":"`r` = 0.94 is too weak to show anything.","why":"0.94 is strong. The question is what causes it: `r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"1494d","_k":"97725373"},{"t":"More streaming subscriptions lead the town to build bike lanes.","why":"`r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"1597d","_k":"cd7e365d"},{"t":"Both grew over time; the correlation doesn’t show that one affects the other.","why":"Right. Time (and the town’s growth) is a common cause. `r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"1696d","_k":"e0f1c68c"},{"t":"New bike lanes make people subscribe to streaming.","why":"`r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"1799d","_k":"2a62dd45"}],"after":"A high `r` never proves cause. Look for a common cause, such as time, or for chance."}],"quickCheck":{"title":"Mislead quick check","summary":"Mislead quick check","items":[{"id":"q1","goal":5,"prompt":"`r` = 0 for a perfect U. The relationship is…","choices":[{"t":"nonexistent","fb":"`r` misses curves.","_n":"1898d","_k":"06161123"},{"t":"negative","fb":"`r` misses curves.","_n":"199bd","_k":"d2affc3c"},{"t":"weak linear","fb":"`r` misses curves.","_n":"1a9ad","_k":"76ebe2b7"},{"t":"strong but not linear","fb":"Right. `r` misses curves.","_n":"1b9dd","_k":"9077569e"}]},{"id":"q2","goal":4,"prompt":"Removing one far point makes `r` drop from 0.9 to 0.1. That point was…","choices":[{"t":"an error by definition","fb":"One point carried the correlation.","_n":"1c9cd","_k":"3b1cab9b"},{"t":"irrelevant","fb":"One point carried the correlation.","_n":"1dafd","_k":"03ae3df9"},{"t":"typical","fb":"One point carried the correlation.","_n":"1eb0d","_k":"d0bd1f8f"},{"t":"influential","fb":"Right. One point carried the correlation.","_n":"1fadd","_k":"dbab51c2"}]},{"id":"q3","goal":4,"prompt":"Restricting the range of `x` usually makes `|r|`…","choices":[{"t":"unchanged","fb":"Less spread in `x` hides the trend.","_n":"1gaed","_k":"d042c081"},{"t":"negative","fb":"Less spread in `x` hides the trend.","_n":"1habd","_k":"5f023bc1"},{"t":"smaller","fb":"Right. Less spread in `x` hides the trend.","_n":"1iacd","_k":"4694aa02"},{"t":"larger","fb":"Less spread in `x` hides the trend.","_n":"1ja9d","_k":"7532396c"}]},{"id":"q4","goal":5,"prompt":"`r` = 0.94 between two things that both grew over time shows…","choices":[{"t":"causation","fb":"Time is a common cause.","_n":"1kaad","_k":"5efe1929"},{"t":"an association","fb":"Right. Time is a common cause.","_n":"1la7d","_k":"f5803e23"},{"t":"a mistake","fb":"Time is a common cause.","_n":"1ma8d","_k":"9f81628a"},{"t":"nothing at all","fb":"Time is a common cause.","_n":"1na9c","_k":"3279861d"}]}]}},"practice":{"activities":[{"id":"describe","type":"match","title":"`r` ↔ description","summary":"r ↔ description","goal":1,"instruction":"Tap a value of `r`, then tap the description that fits it.","leftTitle":"`r`","rightTitle":"Description","left":[{"id":"l1","t":"1","why":"`r` = 1 only when every point lies exactly on a rising line."},{"id":"l2","t":"0.92","why":"0.92 ≥ 0.67, and positive: strong positive linear."},{"id":"l3","t":"0.50","why":"0.50 is between 0.33 and 0.67: moderate positive linear."},{"id":"l4","t":"0.05","why":"0.05 is below 0.33: no meaningful linear correlation."},{"id":"l5","t":"−0.45","why":"`|r|` = 0.45 is between 0.33 and 0.67, and the sign says falling: moderate negative linear.","hints":["Ignore the sign: 0.45.","Between 0.33 and 0.67.","Moderate negative."]},{"id":"l6","t":"−0.95","why":"`|r|` = 0.95 is strong; the sign says falling."}],"right":[{"id":"r1","t":"Every point exactly on a rising line"},{"id":"r2","t":"Strong positive linear"},{"id":"r3","t":"Moderate positive linear"},{"id":"r4","t":"No linear correlation"},{"id":"r5","t":"Moderate negative linear"},{"id":"r6","t":"Strong negative linear"}],"_a":"SRVZARYDGksDFRkSWAsaAxBFBxIYG1QKEA0XQgcbFBteAxcKFksMGx4VWQUWAxpLBxUZElgPGgMQRQMSSQ==","wrong":{"l6|r5":"`|−0.95|` = 0.95 is strong. The sign is only the direction.","l4|r3":"0.05 is below 0.33: no meaningful linear correlation."},"wrongDefault":"Use `|r|` for strength and the sign for direction."},{"id":"compute","type":"numeric","title":"Compute `r`","summary":"Compute r","goal":[2,3,4],"star":true,"instruction":"Every data set uses `x` = 1, 2, 3, 4, 5, so Σ(`x` − \u003ci class=\"pr-bar\">x\u003c/i>)² = 10. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type `r` as a decimal (to 2 places is fine), such as 0.75 or −0.4, then press Check.","items":[{"id":"c1","goal":2,"prompt":"`y` = 8, 9, 10, 12, 11","_a":"AhkM","tol":0.01,"display":"`r` = 0.9","label":"`r` =","keypad":"decimal","why":"\u003ci class=\"pr-bar\">y\u003c/i> = 10; the products are 4, 1, 0, 2, 2, which sum to 9; Σ(`y` − \u003ci class=\"pr-bar\">y\u003c/i>)² = 10, so `r` = 9 ÷ √(10 × 10) = 0.9.","wrong":[{"match":0.09,"fb":"√(10 × 10) = 10, not 100."},{"match":9,"fb":"Use deviations from the means, and divide by √(Σ`x`-squares × Σ`y`-squares)."}],"hints":["Find \u003ci class=\"pr-bar\">y\u003c/i> and the deviations.","The products are 4, 1, 0, 2, 2: sum 9.","9 ÷ √(10 × 10) = 0.9."]},{"id":"c2","goal":2,"prompt":"`y` = 12, 10, 11, 9, 8","_a":"HwcbCQ==","tol":0.01,"display":"`r` = −0.9","label":"`r` =","keypad":"decimal","why":"\u003ci class=\"pr-bar\">y\u003c/i> = 10; the products are −4, 0, 0, −1, −4, which sum to −9; `r` = −9 ÷ 10 = −0.9.","wrong":[{"match":0.9,"fb":"The deviation products are mostly negative."},{"match":-0.09,"fb":"√(10 × 10) = 10, not 100."}],"hints":["Find \u003ci class=\"pr-bar\">y\u003c/i> and the deviations.","The products are −4, 0, 0, −1, −4: sum −9.","−9 ÷ √(10 × 10) = −0.9."]},{"id":"c3","goal":2,"star":true,"prompt":"`y` = 6, 8, 12, 10, 14 (Σ(`y` − \u003ci class=\"pr-bar\">y\u003c/i>)² = 40)","_a":"AhkM","tol":0.01,"display":"`r` = 0.9","label":"`r` =","keypad":"decimal","why":"18 ÷ √(10 × 40) = 18 ÷ 20 = 0.9.","wrong":[{"match":0.45,"fb":"Divide by √(10 × 40) = 20, not 40."},{"match":0.045,"fb":"Divide by √(10 × 40) = 20, not 400."}],"hints":["\u003ci class=\"pr-bar\">y\u003c/i> = 10; the deviations are −4, −2, 2, 0, 4.","The products total 8 + 2 + 0 + 0 + 8 = 18.","18 ÷ √(10 × 40) = 18 ÷ 20 = 0.9."]},{"id":"c4","goal":4,"star":true,"prompt":"Data have `r` = 0.62. Every `x` is converted from km to m, and 5 is subtracted from every `y`. New `r`?","_a":"AhkDAg==","tol":0.001,"display":"`r` = 0.62","label":"`r` =","keypad":"decimal","why":"Rescaling and shifting don’t change `r`: it stays 0.62.","wrong":[{"match":620,"fb":"Rescaling and shifting don’t change `r`."},{"match":0.57,"fb":"Rescaling and shifting don’t change `r`."},{"match":-0.62,"fb":"Subtracting 5 shifts the points; it doesn’t flip the direction. Rescaling and shifting don’t change `r`."}],"hints":["What does × 1000 do to the top and the bottom of the formula?","Subtracting 5 doesn’t change any deviation from the mean.","`r` stays 0.62."]},{"id":"c5","goal":3,"star":true,"prompt":"`n` = 5 and Σ`z_x z_y` = 3.2. What is `r`?","_a":"AhkN","tol":0.01,"display":"`r` = 0.8","label":"`r` =","keypad":"decimal","why":"`r` = Σ`z_x z_y` ÷ (`n` − 1) = 3.2 ÷ 4 = 0.8.","wrong":[{"match":0.64,"fb":"Divide by `n` − 1 = 4, not 5."},{"match":3.2,"fb":"Divide the sum by `n` − 1."}],"hints":["Use the `z`-score form.","`r` = Σ`z_x z_y` ÷ (`n` − 1).","3.2 ÷ 4 = 0.8."]},{"id":"c6","goal":[2,3],"star":true,"prompt":"`x` = 1–5 and the `y`-values are a rearrangement of 6, 7, 8, 9, 10. What is the largest possible `r` that is less than 1?","_a":"AhkM","tol":0.01,"display":"`r` = 0.9","label":"`r` =","keypad":"decimal","why":"The perfect order gives `r` = 1; swapping one neighbouring pair lowers the product sum by 1, so `r` = 9 ÷ 10 = 0.9.","wrong":[{"match":0.8,"fb":"One neighbouring swap costs only 0.1."},{"match":0.99,"fb":"The product sum changes in whole steps, so `r` moves in steps of 0.1."}],"hints":["With these values, `r` = (sum of deviation products) ÷ 10.","The perfect order gives 10 ÷ 10 = 1.","The smallest change (swapping one neighbouring pair) lowers the sum by 1: `r` = 0.9."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Ramona","goal":[1,2,5],"instruction":"Ramona made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"Find `r` for (1, 8), (2, 10), (3, 9), (4, 12), (5, 11).","steps":["\u003ci class=\"pr-bar\">x\u003c/i> = 3 and \u003ci class=\"pr-bar\">y\u003c/i> = 10.","The deviation products are 4, 0, 0, 2, 2; their sum is 8.","Σ(`x` − \u003ci class=\"pr-bar\">x\u003c/i>)² = 10 and Σ(`y` − \u003ci class=\"pr-bar\">y\u003c/i>)² = 10.","`r` = 8 ÷ (10 × 10) = 0.08.","So the correlation is weak."],"_a":"AQ==","stepFb":["Step 1 is correct.","Step 2 is correct.","Step 3 is correct.","","Step 5 follows from the wrong value."],"fixes":[{"t":"Step 4 is correct.","why":"0.08 forgets the square root.","_n":"1oa8c","_k":"82385959"},{"t":"`r` = 8 ÷ (10 + 10) = 0.4.","why":"The denominator is a square root of a product.","_n":"1pa7c","_k":"f5ec3a91"},{"t":"`r` = 8.","why":"`r` must be between −1 and 1.","_n":"1qa6c","_k":"8667dc75"},{"t":"`r` = 8 ÷ √(10 × 10) = 8 ÷ 10 = 0.8: strong positive.","why":"The denominator is the square root of the product of the sums.","_n":"1radc","_k":"5a4a1207"}],"hints":["What does the denominator need?","√(10 × 10).","0.8."]},{"id":"e2","goal":1,"task":"Interpret `r` = −0.92 for screen time vs hours of sleep.","steps":["`r` is negative: more screen time tends to go with less sleep.","`|r|` = 0.92, which is at least 0.67.","But negative correlations are weak, so this relationship is weak."],"_a":"AA==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"No relationship, because `r` &lt; 0.","why":"The sign is the direction. Compare strength with `|r|`.","_n":"1sacc","_k":"cfc8f342"},{"t":"A strong negative linear relationship.","why":"The sign gives the direction; `|r|` = 0.92 gives the strength.","_n":"1tabc","_k":"19f32753"},{"t":"Step 3 is correct.","why":"The sign is direction; `|r|` is strength.","_n":"1uaac","_k":"4c980352"},{"t":"A moderate relationship, because it’s negative.","why":"The sign is the direction. Compare strength with `|r|`.","_n":"1va1c","_k":"7afdaf9d"}],"hints":["What does the sign tell you?","Direction only.","`|r|` = 0.92 is strong."]},{"id":"e3","goal":5,"task":"The points (1, 10), (2, 5), (3, 2), (4, 1), (5, 2), (6, 5), (7, 10) give `r` = 0. Describe the relationship.","steps":["`r` = 0 for these points.","So there’s no relationship between `x` and `y`.","Knowing `x` doesn’t help predict `y`."],"_a":"Aw==","stepFb":["Step 1 is correct.","","Step 3 follows from step 2."],"fixes":[{"t":"`r` must have been calculated wrongly.","why":"`r` = 0 is right for a symmetric U.","_n":"1wa0c","_k":"cabc82d9"},{"t":"A weak positive relationship.","why":"There is a strong pattern.","_n":"1x23c","_k":"80827338"},{"t":"Step 2 is correct.","why":"`r` only detects straight lines.","_n":"1y24c","_k":"aa7c976e"},{"t":"There’s no \u003cstrong>linear\u003c/strong> relationship, but the points follow a clear U: a strong curved relationship, so `x` predicts `y` well.","why":"`r` only detects straight lines; the U is a strong curved pattern.","_n":"1z25c","_k":"8b076427"}],"hints":["Plot the points. Is there a pattern?","A U.","Strong, but curved."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: the swap, the unit change, the one far point or the U?"},{"id":"j2","q":"In your own words, explain why points in the upper-right and lower-left quadrants make `r` larger."},{"id":"j3","q":"Explain to a friend the steps for computing `r` from a deviation table."},{"id":"j4","q":"When could you be fooled by `r`? What will you check before trusting it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which value of `r` shows the strongest linear relationship?","options":[{"t":"−0.91","why":"The largest `|r|`.","_n":"2026c","_k":"781c190b"},{"t":"−0.40","why":"`|−0.40|` = 0.40 is only moderate.","_n":"2127c","_k":"0b0651dc"},{"t":"0.10","why":"0.10 is weak.","_n":"2228c","_k":"312fad74"},{"t":"0.85","why":"`|−0.91|` is larger. The sign is the direction. Compare strength with `|r|`.","_n":"2329c","_k":"ccfadf78"}]},"b":{"prompt":"Which value of `r` shows the strongest linear relationship?","options":[{"t":"−0.88","why":"The largest `|r|`.","_n":"242ac","_k":"9c2b3d84"},{"t":"−0.05","why":"`|−0.05|` = 0.05 is close to no linear correlation.","_n":"251bc","_k":"755de398"},{"t":"0.30","why":"0.30 is weak.","_n":"261cc","_k":"59c55576"},{"t":"0.78","why":"`|−0.88|` is larger. The sign is the direction. Compare strength with `|r|`.","_n":"271dc","_k":"64337760"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"How is `r` = −0.45 described?","options":[{"t":"Weak negative","why":"Weak is below 0.33.","_n":"281cc","_k":"639bb1d0"},{"t":"No correlation, because it’s negative","why":"The sign is the direction. Compare strength with `|r|`.","_n":"291fc","_k":"34a668f0"},{"t":"Strong negative","why":"Strong is 0.67 or more.","_n":"2a1ec","_k":"6bbc79d7"},{"t":"Moderate negative","why":"0.45 is between 0.33 and 0.67.","_n":"2b19c","_k":"bc1f711f"}]},"b":{"prompt":"How is `r` = 0.25 described?","options":[{"t":"Strong positive","why":"Strong is 0.67 or more.","_n":"2c18c","_k":"798b0ca0"},{"t":"Weak positive","why":"0.25 is below 0.33, and positive.","_n":"2d1bc","_k":"7b860312"},{"t":"No correlation at all","why":"0.25 is weak, but not zero.","_n":"2e1ac","_k":"99823077"},{"t":"Moderate positive","why":"Moderate is 0.33 to 0.67; 0.25 is below that.","_n":"2f25c","_k":"4007734d"}]}},{"id":"k3","cat":"K","goal":4,"a":{"prompt":"Every `x`-value is converted from centimetres to metres. What happens to `r`?","options":[{"t":"It doesn’t change","why":"`r` has no units.","_n":"2g24c","_k":"f85b8206"},{"t":"It becomes 0","why":"The pattern is unchanged.","_n":"2h17c","_k":"1a1b0a34"},{"t":"It’s multiplied by 100","why":"`r` is unitless and symmetric: rescale or swap, and `r` stays the same.","_n":"2i18c","_k":"36915a92"},{"t":"It’s divided by 100","why":"`r` is unitless and symmetric: rescale or swap, and `r` stays the same.","_n":"2j15c","_k":"13c91258"}]},"b":{"prompt":"The `x` and `y` variables are swapped. What happens to `r`?","options":[{"t":"It changes sign","why":"`r` is unitless and symmetric: rescale or swap, and `r` stays the same.","_n":"2k16c","_k":"b871233a"},{"t":"It doesn’t change","why":"The formula is symmetric.","_n":"2l1bc","_k":"c41609ca"},{"t":"It becomes 1 ÷ `r`","why":"`r` is unitless and symmetric: rescale or swap, and `r` stays the same.","_n":"2m1cc","_k":"6adfc6a1"},{"t":"It can’t be computed","why":"It can.","_n":"2n19c","_k":"46a2db10"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"Find `r` for (1, 7), (2, 9), (3, 8), (4, 10), (5, 11).","options":[{"t":"0.09","why":"√(10 × 10) = 10. Use deviations from the means, and divide by √(Σ`x`-squares × Σ`y`-squares).","_n":"2o1ac","_k":"12973a4d"},{"t":"0.45","why":"Divide by √100, not 20.","_n":"2p1fc","_k":"42c8153d"},{"t":"0.9","why":"\u003ci class=\"pr-bar\">y\u003c/i> = 9; products 4, 0, 0, 1, 4 sum to 9; 9 ÷ √(10 × 10).","_n":"2q20c","_k":"c897d514"},{"t":"9","why":"Divide by √(10 × 10). Use deviations from the means, and divide by √(Σ`x`-squares × Σ`y`-squares).","_n":"2rdb6","_k":"4314fcbf"}]},"b":{"prompt":"Find `r` for (1, 13), (2, 11), (3, 12), (4, 9), (5, 10).","options":[{"t":"−8","why":"Divide by √(10 × 10). Use deviations from the means, and divide by √(Σ`x`-squares × Σ`y`-squares).","_n":"2sdc6","_k":"61b105bf"},{"t":"−0.8","why":"\u003ci class=\"pr-bar\">y\u003c/i> = 11; products −4, 0, 0, −2, −2 sum to −8; −8 ÷ 10.","_n":"2td96","_k":"4dab6499"},{"t":"−0.08","why":"√(10 × 10) = 10, not 100. Use deviations from the means, and divide by √(Σ`x`-squares × Σ`y`-squares).","_n":"2uda6","_k":"791a7353"},{"t":"0.8","why":"The products are negative.","_n":"2vd76","_k":"0b6f52b2"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"The points (1, 3), (2, 1), (3, 4), (4, 2), (5, 5) have `r` = 0.50. The point (10, 10) is added. `r` becomes about…","options":[{"t":"−0.50","why":"It’s in a ‘+’ quadrant.","_n":"2wd86","_k":"3867fa44"},{"t":"0.20","why":"(10, 10) is far up and to the right of the mean point: a large positive product raises `r`.","_n":"2xd56","_k":"aa50a276"},{"t":"0.50","why":"One far point changes `r` a lot. A single point far from the others can raise or lower `r` dramatically.","_n":"2yd66","_k":"0680f07c"},{"t":"0.90","why":"A large positive product dominates.","_n":"2zd36","_k":"8649166d"}]},"b":{"prompt":"Same five points (`r` = 0.50). The point (10, 0) is added instead. `r` becomes about…","options":[{"t":"−0.42","why":"It sits far right and far below the mean: a large negative product.","_n":"30d46","_k":"4483119b"},{"t":"0.42","why":"Check the sign: right of \u003ci class=\"pr-bar\">x\u003c/i>, below \u003ci class=\"pr-bar\">y\u003c/i>.","_n":"31417","_k":"d4e2ec8f"},{"t":"0.50","why":"A single point far from the others can raise or lower `r` dramatically.","_n":"32407","_k":"55587b01"},{"t":"0.90","why":"That would be (10, 10).","_n":"33437","_k":"e90f367f"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"Most points lie in the upper-left and lower-right quadrants formed by the lines `x` = \u003ci class=\"pr-bar\">x\u003c/i> and `y` = \u003ci class=\"pr-bar\">y\u003c/i>. What is the sign of `r`?","options":[{"t":"Negative","why":"Those quadrants have products of opposite signs.","_n":"34427","_k":"b9bc5f7a"},{"t":"Can’t tell without the values","why":"The quadrants decide the sign.","_n":"35457","_k":"9ac2197f"},{"t":"Zero","why":"The products don’t cancel when most points are in two opposite quadrants.","_n":"36447","_k":"185e5d51"},{"t":"Positive","why":"Upper-right and lower-left give positive.","_n":"37477","_k":"fd3e914f"}]},"b":{"prompt":"Most points lie in the upper-right and lower-left quadrants. What is the sign of `r`?","options":[{"t":"Can’t tell","why":"The quadrants decide the sign.","_n":"38467","_k":"25caf415"},{"t":"Positive","why":"In those quadrants both deviations have the same sign, so the products are positive.","_n":"39497","_k":"cb9c7d9c"},{"t":"Zero","why":"The products don’t cancel when most points are in two opposite quadrants.","_n":"3a487","_k":"bf89ac16"},{"t":"Negative","why":"Upper-left and lower-right give negative; upper-right and lower-left give positive.","_n":"3bcf6","_k":"39ff9569"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"A data set has `r` = 0.02, but its scatter plot shows a clear U shape. Which statement is best?","options":[{"t":"“The relationship is weak and positive.”","why":"The pattern is strong, but curved.","_n":"3cd06","_k":"0106a283"},{"t":"“`r` must be miscalculated.”","why":"`r` ≈ 0 is correct for a U.","_n":"3dd16","_k":"0770fbe5"},{"t":"“There’s no relationship, because `r` ≈ 0.”","why":"`r = 0` means no \u003cstrong>linear\u003c/strong> relationship. Curves can still be strong.","_n":"3ed26","_k":"dae0bad7"},{"t":"“`r` measures only linear association; the U shows a strong nonlinear relationship.”","why":"`r` ≈ 0 rules out only a linear pattern.","_n":"3fd36","_k":"a6db946a"}]},"b":{"prompt":"A tight cluster of points plus one far point gives `r` = 0.95. Which statement is best?","options":[{"t":"“`r` = 0.95 proves a strong linear relationship.”","why":"A single point far from the others can raise or lower `r` dramatically.","_n":"3gd46","_k":"a87d04b3"},{"t":"“The far point should be deleted and never mentioned.”","why":"Report it, and show `r` both ways.","_n":"3hd56","_k":"bc07dfed"},{"t":"“`r` is wrong, because outliers can’t affect it.”","why":"A single point far from the others can raise or lower `r` dramatically.","_n":"3id66","_k":"899c7e6f"},{"t":"“`r` is inflated by one influential point; without it there’s little linear pattern.”","why":"One far point can create a high `r`.","_n":"3jc76","_k":"082a8857"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Which statement about `r` is correct?","options":[{"t":"“`r` = −0.9 shows a weaker relationship than `r` = 0.5.”","why":"The sign is the direction. Compare strength with `|r|`.","_n":"3kc86","_k":"4af19cda"},{"t":"“`r` has the units of `y` divided by `x`.”","why":"`r` is unitless.","_n":"3ld56","_k":"2cad5519"},{"t":"“`r` = 0.9 means the line of best fit has slope 0.9.”","why":"`r` measures how closely the points fit a line, not how steep the line is.","_n":"3md46","_k":"657c8fd9"},{"t":"“`r` measures how closely the points fit a straight line, not how steep the line is.”","why":"`r` is about fit, not slope.","_n":"3nd36","_k":"544be852"}]},"b":{"prompt":"What does `r` = 1 tell you?","options":[{"t":"“Every point lies exactly on a straight line that rises.”","why":"`r` = 1 is a perfect positive linear fit.","_n":"3od26","_k":"7473258a"},{"t":"“`x` causes `y`.”","why":"`r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"3pd96","_k":"9ee8a089"},{"t":"“The slope of the line is 1.”","why":"`r` measures how closely the points fit a line, not how steep the line is.","_n":"3qd86","_k":"546784d9"},{"t":"“Every `y`-value equals its `x`-value.”","why":"Any rising line works, not only `y` = `x`.","_n":"3rd76","_k":"343b8f3d"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Model data: across 10 Ontario towns, `r` = 0.88 between the number of public libraries and the number of car accidents. Which conclusion is best?","options":[{"t":"“Both probably grow with population; the strong `r` doesn’t mean libraries cause accidents.”","why":"Population is a common cause.","_n":"3sd66","_k":"88613482"},{"t":"“Libraries cause accidents.”","why":"`r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"3tcd6","_k":"6f4d4b19"},{"t":"“`r` = 0.88 is too weak to mean anything.”","why":"0.88 is strong.","_n":"3ucc6","_k":"16cf91cf"},{"t":"“Accidents lead towns to build libraries.”","why":"`r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"3v537","_k":"042c4575"}]},"b":{"prompt":"Model data: among children aged 5 to 12, `r` = 0.91 between shoe size and reading level. Which conclusion is best?","options":[{"t":"“Reading makes feet grow.”","why":"`r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"3w547","_k":"7ed16c23"},{"t":"“The data must be wrong.”","why":"The association is real; the cause is age.","_n":"3x517","_k":"a4fee9e5"},{"t":"“Bigger feet improve reading.”","why":"`r` shows that the variables move together. A third variable, or chance, can explain it.","_n":"3y527","_k":"766aade7"},{"t":"“Both increase with age; age is a common cause.”","why":"Older children have bigger feet and read better.","_n":"3z577","_k":"1c7d9dfa"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"For all Grade 9–12 students, height and arm span have `r` = 0.90. If only students between 170 cm and 172 cm tall are included, `r` will most likely…","options":[{"t":"increase","why":"Less spread in `x` weakens the visible pattern.","_n":"40587","_k":"0ec9a759"},{"t":"become −0.90","why":"The direction won’t reverse.","_n":"41557","_k":"44967a11"},{"t":"decrease","why":"A restricted range hides the trend.","_n":"42567","_k":"dc8c1606"},{"t":"stay at 0.90","why":"`r` depends on the range included.","_n":"434b7","_k":"005ad0ff"}]},"b":{"prompt":"For students aged 5 to 18, age and reading score have `r` = 0.85. If only 16-year-olds are included, `r` will most likely…","options":[{"t":"increase","why":"Less spread in `x` weakens the visible pattern.","_n":"444c7","_k":"56e1c745"},{"t":"decrease","why":"A restricted range hides the trend: with one age, there’s no spread in `x` left.","_n":"45d97","_k":"21
