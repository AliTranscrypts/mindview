.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 15: hero (deck fan), Hand dealer (Group / Deck source, Count / Simulate / Order check), Lotteries stations, marble-bag task.
   Type A (girls, red, defective) is --ev-a blue, type B teal --ev-b (course plan §3); suits use symbols and names, never red/black. */
/* radioGroup (from MDM4U 11) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* D1 tree (from MDM4U 05) */
.d1-scroll{overflow:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.d1-box{position:relative}
.d1-svg{position:absolute;left:0;top:0}
.d1-e{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.d1-hi{fill:none;stroke:var(--hi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.d1-in{position:absolute;left:0;top:0;right:0;bottom:0}
.d1-root{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
.d1-lab{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 6px;border:1.5px solid var(--ink-2);border-radius:13px;background:var(--sheet);color:var(--ink);font:400 .95rem/23px var(--font-ui);text-align:center;white-space:nowrap}
.d1-lab.on{border:2px solid var(--sel-bd);background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);font-weight:700}
.d1-p{position:absolute;transform:translate(-50%,-50%);font:400 .85rem var(--font-math);color:var(--ink-2);background:var(--sheet);padding:0 2px;white-space:nowrap}
.d1-leaf{position:absolute;transform:translate(-50%,-50%);min-height:30px;min-width:32px;padding:0 .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 .95rem/27px var(--font-ui);white-space:nowrap}
.d1.right .d1-leaf{transform:translate(0,-50%)}
.d1-leaf.on{background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);border:2px solid var(--sel-bd);font-weight:700}
.d1-leaf small{font:400 .82em var(--font-math);color:var(--ink-2)}
.d1-stage{position:absolute;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* hero */
.cp-heq{display:flex;flex-direction:column;align-items:flex-start;gap:.3em}
.cp-hhand{display:inline-flex;align-items:center;gap:6px}
.cp-hcard{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1.9em;height:2.6em;border:2px solid var(--ink);border-radius:6px;background:var(--sheet);font:700 .62em/1.05 var(--font-ui);color:var(--ink)}
.cp-hcard b{font-size:1.15em}
.cp-hhl{font:400 .55em var(--font-ui);color:var(--ink-2);margin-left:4px}
.cp-hmain{white-space:normal}
.cp-hex{font-size:.72em;color:var(--ink-2)}
.cp-hex .m{color:var(--ink)}
.cp-h{display:grid;justify-items:center;width:100%}
.cp-hsvg{display:block;width:100%;max-width:460px;height:auto}
.cp-hc{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1}
.cp-hc.on{fill:var(--hi-soft);stroke:var(--ink);stroke-width:1.5}
.cp-hs{font:700 9px var(--font-ui);fill:var(--ink);text-anchor:middle}
.cp-hd{fill:var(--ev-a-soft);stroke:var(--ink);stroke-width:1.6}
.cp-ht{font:400 12px var(--font-ui);fill:var(--ink-2)}
.cp-hm{font:400 16px var(--font-math);fill:var(--ink)}
.cp-hm.big{font-size:19px;font-weight:700}
.cp-hg{font:400 15px var(--font-math);fill:var(--ink-2)}
.cp-hx{stroke:var(--ink);stroke-width:2.2}
.cp-hn{font:italic 400 12px var(--font-ui);fill:var(--ink)}

/* Explore layout */
.cp-top{display:flex;flex-wrap:wrap;gap:4px 22px;margin:0 0 6px}
.cp-cap.long{font-size:clamp(1.05rem,3vw,1.4rem)}
.cp-pool{margin:6px 0 10px}
.cp-plab{margin:4px 0 0}
.cp-toks{display:flex;flex-wrap:wrap;gap:5px}
.cp-tok{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font:700 .85rem var(--font-ui);color:var(--sheet);border:2px solid transparent}
.cp-tok.a{background:var(--ev-a)}
.cp-tok.b{background:var(--ev-b)}
.cp-tok.s{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--sel-bd)}
.cp-tok.big{width:40px;height:40px;font-size:1.05rem}
.cp-deckwrap{overflow-x:auto;max-width:100%}
.cp-deck{display:grid;grid-template-columns:5.2em repeat(13,minmax(16px,1fr));gap:2px;font:400 .76rem var(--font-ui);min-width:296px}
.cp-ds{display:flex;align-items:center;gap:3px;white-space:nowrap;color:var(--ink-2);font-size:.72rem}
.cp-ds b{font-size:1rem;color:var(--ink)}
.cp-dc{display:flex;align-items:center;justify-content:center;height:22px;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);color:var(--ink-2)}
.cp-dc.on{background:var(--hi-soft);border:1.5px solid var(--sel-bd);color:var(--ink);font-weight:700}
.cp-lines{list-style:none;margin:6px 0 8px;padding:0;display:grid;gap:6px}
.cp-lines li{padding:6px 10px;border-left:4px solid var(--rule);background:var(--sheet);font-size:1.02rem;line-height:1.5;overflow-wrap:anywhere}
.cp-lines li.fresh{border-left-color:var(--hi);background:linear-gradient(90deg,var(--hi-soft),transparent 75%)}
.cp-lines .m{white-space:normal}
.cp-ll{display:block;font:700 .78rem var(--font-ui);color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.cp-q{display:inline-block;min-width:1.4em;padding:0 .3em;border:1.5px dashed var(--ink-2);border-radius:4px;text-align:center;font-weight:700}
.cp-hand{min-height:96px}
.cp-hl{margin:0 0 4px;font-size:.85rem;font-weight:700;color:var(--ink-2)}
.cp-hrow{display:flex;flex-wrap:wrap;gap:8px}
.cp-card{display:inline-flex;flex-direction:column;align-items:center;justify-content:space-between;width:56px;height:76px;padding:4px 2px;border:2px solid var(--ink);border-radius:7px;background:var(--sheet);color:var(--ink);font-family:var(--font-ui)}
.cp-card b{font-size:1.05rem;line-height:1}
.cp-card i{font-style:normal;font-size:1.35rem;line-height:1}
.cp-card small{font-size:.58rem;color:var(--ink-2)}
.cp-card.on{background:var(--hi-soft);border-color:var(--sel-bd)}
.cp-in{animation:cpFlip .5s ease both}
@keyframes cpFlip{from{transform:perspective(300px) rotateY(90deg) translateY(-10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cp-in{animation:none}}
.cp-hv{margin:6px 0 4px;font-weight:700}
.cp-hv.yes{color:var(--green)}
.cp-hv.no{color:var(--ink-2)}
.cp-hnone{margin:6px 0}
.cp-sv canvas{margin-top:4px}
.cp-onote{margin:2px 0 10px;font-size:.92rem}
.cp-tree{margin:4px 0}
.cp-aha{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--info-bg);font-size:.95rem}
.cp-ctrl .slider{margin-bottom:8px}
.cp-panel{margin:0 0 10px;padding:0 0 6px;border-bottom:1px solid var(--rule)}
.cp-sh{margin:0 0 6px;font:700 .8rem var(--font-ui);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.cp-evtxt{margin:4px 0 0;font-size:.95rem}
.cp-btns{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.cp-msg{min-height:1.2em;margin:4px 0 0}
.cp-grey{color:var(--ink-2)}
.cp-grey .m{color:var(--ink-2)}
.cp-not{display:inline-block;margin-left:4px;padding:0 .45em;border:1px solid var(--rule);border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.cp-bar{display:flex;height:30px;margin:4px 0 8px;border:1.5px solid var(--ink-2);border-radius:6px;overflow:hidden;background:var(--paper)}
.cp-seg{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;color:var(--sheet);font:700 .78rem var(--font-ui);white-space:nowrap;transition:width .35s ease}
.cp-seg span{overflow:hidden;text-overflow:clip;padding:0 3px}
.cp-seg.c0{background:var(--ink)}
.cp-seg.c1{background:var(--ev-a)}
.cp-seg.c2{background:var(--ev-b)}
.cp-seg.c3{background:var(--ev-c)}
.cp-seg.cost{background:var(--ev-c)}
.cp-seg.pay{background:var(--ev-b)}
.cp-seg.rr{background:var(--ev-a)}
.cp-seg.mix{background:var(--hi);color:var(--hi-ink)}
.cp-seg.bb{background:var(--ev-b)}
@media (prefers-reduced-motion:reduce){.cp-seg{transition:none}}
@media (max-width:560px){
  .cp-deck{grid-template-columns:4.7em repeat(13,minmax(15px,1fr));gap:1px}
  .cp-ds{font-size:.62rem;gap:2px}
  .cp-card{width:48px;height:66px}
  .cp-card i{font-size:1.15rem}
  .cp-tok.big{width:34px;height:34px}
}

/* Part 3: Lotteries */
.lo-tabs{margin:0 0 8px}
.lo-tick{color:var(--green);font-weight:700}
.lo-card{padding:10px 14px;margin:0 0 12px;border:1.5px solid var(--rule);border-left:5px solid var(--ink);border-radius:8px;background:var(--sheet)}
.lo-lab{display:block;font:700 .78rem var(--font-ui);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.lo-prob{margin:4px 0 0;font-size:1.05rem}
.lo-grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px 26px;align-items:start}
.lo-grid2 h4{margin:0 0 6px}
.lo-nums{display:grid;grid-template-columns:repeat(5,minmax(40px,52px));gap:6px}
.lo-num{min-height:40px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);font:700 1rem var(--font-ui)}
.lo-num.on{background:var(--hi);border-color:var(--sel-bd);color:var(--hi-ink)}
.lo-msg{margin:6px 0 0}
.lo-drawrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.lo-balls{display:flex;gap:8px;margin:2px 0}
.lo-ball{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;background:var(--sheet);font:700 1.05rem var(--font-ui);color:var(--ink)}
.lo-ball.hit{background:var(--hi-soft);border-color:var(--sel-bd)}
.lo-ball i{position:absolute;right:-6px;top:-6px;font-style:normal;font-size:.75rem;color:var(--green);background:var(--sheet);border-radius:50%;padding:0 2px}
.lo-mt{margin:6px 0 2px}
.lo-cases{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.lo-cases li{padding:6px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.lo-cases li.ok{border-color:var(--green)}
.lo-cl{margin:0 0 4px;font-weight:700}
.lo-crow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 10px}
.lo-part{display:inline-flex;flex-direction:column;align-items:center}
.lo-pl{font-size:.75rem;color:var(--ink-2)}
.lo-stp{display:inline-flex;align-items:center;gap:4px}
.lo-x,.lo-eq{padding-bottom:6px}
.lo-stp .btn{min-width:30px;padding:.15em .4em}
.lo-sv{min-width:3.9em;text-align:center}
.lo-cp,.lo-cn{margin:4px 0 0}
.lo-bl{margin:8px 0 2px;font-size:.9rem;font-weight:700;color:var(--ink-2)}
.lo-key{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0}
.lo-key span{display:inline-flex;align-items:center;gap:4px}
.lo-sw{display:inline-block;width:.9em;height:.9em;border-radius:2px}
.lo-sw.c0{background:var(--ink)}.lo-sw.c1{background:var(--ev-a)}.lo-sw.c2{background:var(--ev-b)}.lo-sw.c3{background:var(--ev-c)}
.lo-done{margin:10px 0;padding:8px 12px;border-radius:8px;background:var(--good-bg)}
.lo-pic{margin:0 0 8px}
.lo-row{margin:8px 0;overflow:hidden}
.lo-rsvg{display:block;width:100%;height:auto}
.lo-grain{fill:var(--ink-2)}
.lo-strip{fill:var(--ink-2);opacity:.55}
.lo-tk{stroke:var(--ink);stroke-width:1.2}
.lo-tt{font:400 12px var(--font-ui);fill:var(--ink);text-anchor:middle}
.lo-win{stroke:var(--ink);stroke-width:1.5}
.lo-wd{fill:var(--hi);stroke:var(--ink);stroke-width:1.5}
.lo-wt{font:700 12px var(--font-ui);fill:var(--ink);text-anchor:middle}
.lo-read{margin:8px 0}
.lo-tix{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.lo-tl{font-weight:700}
.lo-tv{min-width:2em;text-align:center;font:700 1.2rem var(--font-math)}
.lo-m6{margin:8px 0;padding:8px 12px;border-left:4px solid var(--ev-c);background:var(--sheet)}
@media (max-width:700px){ .lo-grid2{grid-template-columns:minmax(0,1fr)} }

/* task */
.cp-conds{margin:6px 0 10px;padding-left:1.4em}
.mb-toks{margin:0 0 8px}
.mb-read{margin:6px 0}
.mb-all{font-weight:700}

</style>
</head>

heorem","kind":"topic","group":"2"},{"nn":"15","slug":"combinations-probability","title":"Combinations & Probability","kind":"topic","group":"2"},{"nn":"16","slug":"theoretical-empirical","title":"Theoretical & Empirical Probability","kind":"topic","group":"3"},{"nn":"17","slug":"conditional-probability","title":"Conditional Probability","kind":"topic","group":"3"},{"nn":"18","slug":"discrete-random-variables","title":"Discrete Random Variables & Probability Distributions","kind":"topic","group":"3"},{"nn":"19","slug":"expected-value","title":"Expected Value","kind":"topic","group":"3"},{"nn":"20","slug":"variance-discrete","title":"Variance & Standard Deviation of Discrete Random Variables","kind":"topic","group":"3"},{"nn":"21","slug":"binomial-distribution","title":"The Binomial Distribution","kind":"topic","group":"3"},{"nn":"22","slug":"geometric-distribution","title":"The Geometric Distribution","kind":"topic","group":"3"},{"nn":"23","slug":"hypergeometric-distribution","title":"The Hypergeometric Distribution","kind":"topic","group":"3"},{"nn":"24","slug":"choosing-distribution","title":"Choosing the Right Distribution","kind":"topic","group":"3"},{"nn":"25","slug":"continuous-density","title":"Continuous Random Variables & Density","kind":"topic","group":"4"},{"nn":"26","slug":"normal-properties","title":"Properties of the Normal Distribution","kind":"topic","group":"4"},{"nn":"27","slug":"z-scores","title":"Standardizing & z-Scores","kind":"topic","group":"4"},{"nn":"28","slug":"normal-approximation","title":"Normal Approximation to the Binomial","kind":"topic","group":"4"},{"nn":"29","slug":"sampling-methods","title":"Population, Sample & Sampling Methods","kind":"topic","group":"5"},{"nn":"30","slug":"bias","title":"Sources of Bias in Surveys","kind":"topic","group":"5"},{"nn":"31","slug":"central-tendency","title":"Measures of Central Tendency","kind":"topic","group":"5"},{"nn":"32","slug":"spread","title":"Measures of Spread","kind":"topic","group":"5"},{"nn":"33","slug":"histograms","title":"Frequency Distributions & Histograms","kind":"topic","group":"5"},{"nn":"34","slug":"scatter-plots","title":"Scatter Plots & Correlation","kind":"topic","group":"6"},{"nn":"35","slug":"pearson-r","title":"The Pearson Correlation Coefficient r","kind":"topic","group":"6"},{"nn":"36","slug":"linear-regression","title":"Linear Regression & Line of Best Fit","kind":"topic","group":"6"},{"nn":"37","slug":"residuals","title":"Residuals & Goodness of Fit","kind":"topic","group":"6"},{"nn":"38","slug":"causation","title":"Two-Variable Analysis & Causation","kind":"topic","group":"6"},{"nn":"39","slug":"culminating-investigation","title":"Culminating Data-Management Investigation","kind":"topic","group":"7"}]},"salt":"444b7976","content":{"id":"15-combinations-probability","kind":"topic","title":"Combinations and probability","topic":"Combinations & Probability","readyTopic":"combinations and probability","hero":{"eq":"\u003cspan class=\"cp-heq\">\u003cspan class=\"cp-hhand\" aria-hidden=\"true\">\u003cspan class=\"cp-hcard\">7\u003cb>♥\u003c/b>\u003c/span>\u003cspan class=\"cp-hcard\">Q\u003cb>♥\u003c/b>\u003c/span>\u003cspan class=\"cp-hhl\">a hand of 2 hearts\u003c/span>\u003c/span>\u003cspan class=\"cp-hmain\">\u003ci>P\u003c/i>(event) = \u003ci>C\u003c/i>(favourable) ÷ \u003ci>C\u003c/i>(total)\u003c/span>\u003cspan class=\"cp-hex\">`C(13, 2) ÷ C(52, 2) = 78/1326 = 1/17`\u003c/span>\u003c/span>","eqLabel":"P of an event equals C of the favourable selections divided by C of all selections. For a dealt hand of 2 hearts: C of 13, 2 divided by C of 52, 2 equals 78 over 1326, which is 1 over 17.","eqSize":"sm","headline":"Count the good hands, count all the hands, divide","text":"When every hand, committee or draw is \u003cstrong>equally likely\u003c/strong>, probability is a counting problem. Count the \u003cstrong>favourable\u003c/strong> selections and \u003cstrong>all\u003c/strong> selections with \u003cstrong>combinations\u003c/strong>, then divide. For ‘at least one’, the \u003cstrong>complement\u003c/strong> is often faster.","fig":{"html":"\u003cdiv class=\"cp-h\" role=\"img\" aria-label=\"A deck of 52 cards fans out and two cards are dealt face down. A counter shows possible hands: C(52, 2) = 1326. The 13 hearts lift out of the fan: hands with 2 hearts: C(13, 2) = 78. The fraction 78 over 1326 reduces to 1 over 17. Then a ghost fraction, one quarter squared = 1 over 16, appears and is crossed out with the note: the second card comes from 51.\">\u003csvg class=\"cp-hsvg\" id=\"cp-hsvg\" viewBox=\"0 0 400 236\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003c/div>"}},"goals":["I can count the total number of equally likely selections with a combination.","I can find the probability of an “exactly” event by multiplying combinations from each group.","I can find “at least” and “at most” probabilities by cases or by the complement.","I can explain why drawing without replacement differs from multiplying single-draw probabilities.","I can find the probability that particular people or items are included in a random selection.","I can apply these methods to quality control, lotteries and fair games, and explain why lotteries lose on average."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Basic probability","goal":1,"prompt":"A bag has 3 red and 5 blue marbles. One marble is drawn. What is \u003ci>P\u003c/i>(red)?","options":[{"t":"`3/8`","why":"3 favourable out of 8 equally likely.","_n":"0c97","_k":"97e46ac8"},{"t":"`1/2`","why":"There are two colours, but the colours aren’t equally likely.","_n":"1c67","_k":"67dd5579"},{"t":"`3/5`","why":"That’s red ÷ blue. Divide by the total, 8.","_n":"2c77","_k":"e9762293"},{"t":"`5/8`","why":"That’s \u003ci>P\u003c/i>(blue).","_n":"3cc7","_k":"934cc056"}],"hints":["Favourable ÷ total.","3 red, 8 marbles.","`3/8`."]},{"id":"w2","skill":"Basic probability","goal":4,"prompt":"A fair die is rolled twice. What is \u003ci>P\u003c/i>(two sixes)?","options":[{"t":"`1/36`","why":"`1/6 × 1/6`: independent rolls.","_n":"4cd7","_k":"9388838d"},{"t":"`1/12`","why":"That’s `1/6 + 1/6`, halved. Both must happen: multiply.","_n":"5ca7","_k":"a16721d6"},{"t":"`1/6`","why":"That’s one roll only. Both rolls must be sixes: multiply.","_n":"6cb7","_k":"1a522f82"},{"t":"`2/6`","why":"That adds. Both must happen: multiply.","_n":"7c07","_k":"50a21225"}],"hints":["Are the rolls independent?","Yes: multiply.","`1/36`."]},{"id":"w3","skill":"Combinations","goal":1,"prompt":"How many 3-person committees can be chosen from 9 people?","options":[{"t":"27","why":"That’s 9 × 3, which isn’t a counting rule.","_n":"8c17","_k":"907668eb"},{"t":"84","why":"`C(9, 3)` = 504 ÷ 6.","_n":"9bc4","_k":"c4f9e525"},{"t":"504","why":"That’s `P(9, 3)`, which orders the committee. Divide by `3! = 6`.","_n":"abb4","_k":"cf7ed433"},{"t":"729","why":"That’s `9^3`, which lets one person be chosen more than once.","_n":"bbe4","_k":"f371a1b3"}],"hints":["Order doesn’t matter.","`C(9, 3) = (9 × 8 × 7)/3!`.","84."]},{"id":"w4","skill":"Combinations","goal":2,"prompt":"In how many ways can 2 girls be chosen from 4 \u003cstrong>and\u003c/strong> 1 boy from 5?","options":[{"t":"11","why":"That adds (6 + 5). Two stages: multiply.","_n":"cbd4","_k":"5e31d827"},{"t":"30","why":"`C(4, 2) × C(5, 1)` = 6 × 5.","_n":"dc04","_k":"6f0d1950"},{"t":"60","why":"`P(4, 2) × 5` orders the girls.","_n":"ebf4","_k":"2f527513"},{"t":"84","why":"`C(9, 3)` ignores the condition: 2 girls \u003cstrong>and\u003c/strong> 1 boy.","_n":"fc24","_k":"d50b355f"}],"hints":["Two stages: multiply.","`C(4, 2) = 6` and `C(5, 1) = 5`.","30."]},{"id":"w5","skill":"Complements","goal":3,"prompt":"If \u003ci>P\u003c/i>(no defective items) = 0.35, what is \u003ci>P\u003c/i>(at least one defective item)?","options":[{"t":"0.35","why":"That’s \u003ci>P\u003c/i>(none). ‘At least one’ = 1 − \u003ci>P\u003c/i>(none).","_n":"gc14","_k":"39c09825"},{"t":"0.5","why":"‘Either it happens or it doesn’t’ doesn’t make it 50–50. Use 1 − 0.35.","_n":"hc44","_k":"d12db503"},{"t":"0.65","why":"1 − 0.35.","_n":"ic34","_k":"9e463bd2"},{"t":"1.35","why":"That adds 1. Probabilities can’t exceed 1: subtract from 1.","_n":"j4a4","_k":"42652745"}],"hints":["‘At least one’ and ‘none’ cover everything.","They add to 1.","0.65."]},{"id":"w6","skill":"Complements","goal":3,"prompt":"Which event is the complement of ‘at least one head in 3 tosses’?","options":[{"t":"No heads (all tails)","why":"Everything that isn’t ‘at least one head’ has zero heads.","_n":"k4b4","_k":"2ea61fec"},{"t":"Three heads","why":"Three heads is part of ‘at least one head’, not its complement.","_n":"l4c4","_k":"1e137f19"},{"t":"Exactly one head","why":"At least one includes 2, 3, … as well. Exactly one head is part of the event, not its complement.","_n":"m4d4","_k":"1aef9c3f"},{"t":"At least one tail","why":"HHT has at least one head \u003cstrong>and\u003c/strong> at least one tail.","_n":"n4e4","_k":"a47344d5"}],"hints":["The complement is everything else.","What’s left if there isn’t at least one head?","Zero heads."]}],"refreshers":{"Basic probability":"With equally likely outcomes, \u003ci>P\u003c/i> = favourable ÷ total. Independent events multiply.","Combinations":"`C(n, r)` counts selections without order; from two groups, multiply the choices.","Complements":"`P(A′) = 1 - P(A)`. ‘None’ is the complement of ‘at least one’."}}},"explore":{"heading":"Hand dealer","intro":"Choose what to draw from, describe the event, and compare the exact count with thousands of simulated deals.","predIntro":"Make a prediction first. Then the hand dealer will show you what really happens.","predictions":[{"id":"p1","start":{"src":"group","a":4,"b":5,"names":"gb","r":3,"who":"A","kind":"ex","k":3,"mode":"count"},"prompt":"Group: 4 girls and 5 boys; a committee of 3. What is \u003ci>P\u003c/i>(all three are girls)?","options":[{"t":"`1/84`","_n":"o4f4","_k":"bb952b0f"},{"t":"`1/21`","_n":"p504","_k":"d29c7896"},{"t":"`64/729`","_n":"q514","_k":"5bb37805"},{"t":"`4/9`","_n":"r424","_k":"ab366bb6"}],"explain":"4 all-girl committees out of 84: `C(4, 3) ÷ C(9, 3) = 4/84 = 1/21`. (`(4/9)^3 = 64/729` would put each girl back before the next pick.)"},{"id":"p2","start":{"src":"group","a":4,"b":5,"names":"gb","r":3,"who":"A","kind":"al","k":1,"mode":"count"},"prompt":"Same group; the event is “at least 1 girl”. Which is the fastest correct route?","options":[{"t":"Add \u003ci>P\u003c/i>(1 girl) and \u003ci>P\u003c/i>(2 girls)","_n":"s434","_k":"9c29094e"},{"t":"\u003ci>P\u003c/i>(1 girl) × 3","_n":"t504","_k":"9fd9a0e5"},{"t":"`4/9 × 3`","_n":"u4f4","_k":"a4b54675"},{"t":"1 − \u003ci>P\u003c/i>(no girls)","_n":"v4e4","_k":"ae07489a"}],"explain":"The complement needs one count; the cases need three. `1 - 10/84 = 74/84 = 37/42`, and the cases route `(40 + 30 + 4)/84` agrees."},{"id":"p3","start":{"src":"deck","cat":"h","r":2,"kind":"ex","k":2,"mode":"sim"},"prompt":"Deck; 2 cards; the event is “both hearts”. How does \u003ci>P\u003c/i>(both hearts) compare with `1/4 × 1/4 = 1/16`?","options":[{"t":"It’s a little smaller: `1/17`","_n":"w4d4","_k":"cb54e252"},{"t":"It’s `1/8`","_n":"x544","_k":"4d541975"},{"t":"It’s exactly `1/16`","_n":"y534","_k":"5473363f"},{"t":"It’s larger","_n":"z524","_k":"ff06fc75"}],"explain":"After a heart is dealt, only 12 of the 51 cards left are hearts. `78/1326 = 1/17` ≈ 0.0588, and the simulated deals settle near 0.059, a little below `1/16 = 0.0625`."},{"id":"p4","start":{"src":"deck","cat":"h","r":2,"kind":"ex","k":2,"mode":"order"},"prompt":"Order check mode, same event. If you count ordered pairs of cards instead, will the probability change?","options":[{"t":"It halves","_n":"10514","_k":"cf4382bb"},{"t":"It depends on which card comes first","_n":"11484","_k":"ac8f075c"},{"t":"It doubles","_n":"12474","_k":"a1f57c98"},{"t":"No, it’s the same","_n":"134e5","_k":"d14239f3"}],"explain":"Both counts doubled, so the fraction didn’t change: `P(13, 2) ÷ P(52, 2) = 156/2652 = 1/17`."}],"chalIntro":"Set up the hand dealer, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Set up a bag of 10 marbles (red and blue) so that drawing 2 gives \u003ci>P\u003c/i>(both red) = `1/3`.","why":"`C(6, 2) ÷ C(10, 2) = 15/45 = 1/3`: 6 red and 4 blue.","hints":["\u003ci>P\u003c/i> = `C(red, 2) ÷ C(10, 2) = C(red, 2) ÷ 45`.","You need `C(red, 2) = 15`.","`C(6, 2) = 15`: 6 red, 4 blue."]},{"id":"tc2","goal":[2,3],"prompt":"Group: 4 girls, 5 boys, committee of 3. Build an event whose probability is `5/14`.","why":"`C(4, 2) × C(5, 1) = 30` committees, and `30/84 = 5/14`. Exactly 2 girls is the same event as exactly 1 boy.","hints":["`5/14 = 30/84`.","Which event has 30 committees?","`C(4, 2) × C(5, 1) = 30`: exactly 2 girls."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Choose a group of 10 people (`g` girls and `b` boys) and a committee size of 3 so that \u003ci>P\u003c/i>(at least one girl) = `5/6`.","why":"`1 - C(6, 3)/C(10, 3) = 1 - 20/120 = 5/6`: 4 girls and 6 boys.","hints":["\u003ci>P\u003c/i>(at least one girl) = `1 - C(b, 3)/C(10, 3)`.","You need `C(b, 3)/120 = 1/6`, so `C(b, 3) = 20`.","`C(6, 3) = 20`: 6 boys, 4 girls."]}]},"part3":{"slug":"lotteries","name":"Lotteries","heading":"Lotteries and fair games","intro":"Lotteries are the best-known use of combinations in probability. At each station, check a ticket and count the match cases, see how big a real lottery is, then compare what a ticket costs with what it pays back on average. A lottery here is a probability model, not advice: on average, players lose money.","stations":[{"id":"s1","title":"A mini-lottery","problem":"A school fundraiser draws 3 numbers from 1 to 10. A ticket has 3 numbers.","task":"Build each match case with combinations: choose from your 3 numbers, then from the other 7.","sumNote":"The four cases total 120/120: every draw has 0, 1, 2 or 3 matches.","cases":[{"m":3,"lab":"All 3 match","v":1,"p":"`1/120`"},{"m":2,"lab":"Exactly 2 match","v":21,"p":"`C(3, 2) × C(7, 1)/120 = 21/120 = 7/40`"},{"m":1,"lab":"Exactly 1 matches","v":63,"p":"`C(3, 1) × C(7, 2)/120 = 63/120 = 21/40`"},{"m":0,"lab":"None match","v":35,"p":"`C(7, 3)/120 = 35/120 = 7/24`"}]},{"id":"s2","title":"Scale","problem":"A 6-of-49 lottery: `C(49, 6)` = 13 983 816 possible tickets.","picture":"If every ticket were a 1 mm grain of rice in a row, the row would be about 14 km long, with one winning grain."},{"id":"s3","title":"Is it fair?","problem":"A ticket costs $2. A prize of $100 is paid if all 3 numbers match (`1/120`).","payout":"The average payout per ticket is 100 × `1/120` ≈ $0.83, so on average a player loses about $1.17 per ticket.","more":"Buying 10 tickets for one draw raises the chance of winning to `10/120`, but the average loss is 10 times as large.","m6":"Each ticket loses money on average; more tickets just lose more.","why":"This is why lotteries raise money: the prizes are always set below the ticket price on average. Module 19 names this the \u003cstrong>expected value\u003c/strong>."}],"quickCheck":{"title":"Quick check","summary":"Lotteries quick check","items":[{"id":"q1","goal":[1,6],"prompt":"Pick 3 numbers from 1–8; 3 are drawn. \u003ci>P\u003c/i>(all match)?","choices":[{"t":"`1/336`","fb":"336 is `P(8, 3)`, which counts orders. `C(8, 3) = 56` equally likely draws.","_n":"144f5","_k":"06bdce54"},{"t":"`1/56`","fb":"Right. `C(8, 3) = 56` equally likely draws, and one of them matches your ticket.","_n":"154c5","_k":"3d6dbf1b"},{"t":"`1/8`","fb":"That’s one number’s chance. `C(8, 3) = 56` equally likely draws.","_n":"164d5","_k":"72653844"},{"t":"`3/8`","fb":"That’s 3 numbers out of 8. `C(8, 3) = 56` equally likely draws.","_n":"17525","_k":"c84946b4"}]},{"id":"q2","goal":[2,6],"prompt":"Pick 2 from 1–6; 2 are drawn. \u003ci>P\u003c/i>(exactly one match)?","choices":[{"t":"`1/15`","fb":"That’s both matching. `C(2, 1) × C(4, 1)/C(6, 2) = 8/15`.","_n":"18535","_k":"0115dfde"},{"t":"`1/3`","fb":"`C(2, 1) × C(4, 1)/C(6, 2) = 8/15`.","_n":"19505","_k":"5c7a6d74"},{"t":"`2/6`","fb":"That’s one number’s chance. `C(2, 1) × C(4, 1)/C(6, 2) = 8/15`.","_n":"1a515","_k":"35689cd1"},{"t":"`8/15`","fb":"Right. `C(2, 1) × C(4, 1)/C(6, 2) = 8/15`.","_n":"1b465","_k":"c748e159"}]},{"id":"q3","goal":6,"prompt":"A game costs $1 and pays $10 with probability `1/20`. Is it fair?","choices":[{"t":"Can’t tell","fb":"Compare the average payout with the cost: 10 × `1/20` = $0.50 back per $1.","_n":"1c475","_k":"8ff40e06"},{"t":"Yes: you can win $10","fb":"Winning is possible but rare. 10 × `1/20` = $0.50 back per $1.","_n":"1d545","_k":"023b90bd"},{"t":"No: average payout $0.50","fb":"Right. 10 × `1/20` = $0.50 back per $1: an average loss of $0.50 a play.","_n":"1e535","_k":"f5372fb8"},{"t":"Yes: it costs only $1","fb":"A cheap game can still lose on average. 10 × `1/20` = $0.50 back per $1.","_n":"1f565","_k":"322e09e9"}]},{"id":"q4","goal":6,"prompt":"Why doesn’t buying more tickets in one draw make a lottery worth it?","choices":[{"t":"Each ticket loses money on average","fb":"Right. More tickets: more chance, but a bigger average loss.","_n":"1g555","_k":"80b1a850"},{"t":"Tickets cancel each other","fb":"Different tickets don’t cancel. More tickets: more chance, but a bigger average loss.","_n":"1h505","_k":"a6db7d2d"},{"t":"It does make it worth it","fb":"More tickets: more chance, but a bigger average loss.","_n":"1i4f5","_k":"159471d5"},{"t":"The odds get worse","fb":"Each ticket’s chance stays the same. More tickets: more chance, but a bigger average loss.","_n":"1j525","_k":"9b8f0fe1"}]}]}},"practice":{"activities":[{"id":"setup","type":"match","title":"Set it up","summary":"Set it up","goal":[1,2,3,5],"shuffle":false,"instruction":"Match each situation with the probability expression that answers it. Three expressions are left over.","leftTitle":"Situation","rightTitle":"Probability expression","left":[{"id":"l1","goal":2,"t":"3 chosen from 4 girls and 5 boys: all girls","why":"All 3 from the 4 girls: `C(4, 3)` of the `C(9, 3)` committees."},{"id":"l2","goal":2,"t":"3 chosen from 4 girls and 5 boys: exactly 2 girls","why":"2 of the 4 girls \u003cstrong>and\u003c/strong> 1 of the 5 boys: multiply."},{"id":"l3","goal":3,"t":"3 chosen from 4 girls and 5 boys: at least 1 girl","why":"Subtract the all-boy committees from 1: ‘At least one’ = 1 − \u003ci>P\u003c/i>(none)."},{"id":"l4","goal":1,"t":"2 cards: both hearts","why":"2 of the 13 hearts, out of all `C(52, 2)` hands."},{"id":"l5","goal":2,"t":"2 cards: one heart and one spade","why":"1 of the 13 hearts \u003cstrong>and\u003c/strong> 1 of the 13 spades."},{"id":"l6","goal":3,"t":"4 of 10 phones tested, 3 defective: none defective","why":"All 4 tested phones come from the 7 working ones."},{"id":"l7","goal":5,"t":"Team of 3 from 10 including both Ana and Ben","why":"Put Ana and Ben on the team, then choose 1 more from the other 8.","hints":["If Ana and Ben are both on it, how many spots are left?","1 spot, from the other 8.","`C(8, 1)/C(10, 3)`."]},{"id":"l8","goal":1,"t":"2 cards: no aces","why":"Both cards come from the 48 non-aces."}],"right":[{"id":"r7","t":"`{C(8, 1)}/{C(10, 3)}`"},{"id":"r3","t":"`1 - {C(5, 3)}/{C(9, 3)}`"},{"id":"r11","t":"`{C(26, 2)}/{C(52, 2)}`"},{"id":"r8","t":"`{C(48, 2)}/{C(52, 2)}`"},{"id":"r1","t":"`{C(4, 3)}/{C(9, 3)}`"},{"id":"r10","t":"`{C(5, 3)}/{C(9, 3)}`"},{"id":"r5","t":"`{C(13, 1) × C(13, 1)}/{C(52, 2)}`"},{"id":"r6","t":"`{C(7, 4)}/{C(10, 4)}`"},{"id":"r9","t":"`{C(4, 2)}/{C(9, 3)}`"},{"id":"r4","t":"`{C(13, 2)}/{C(52, 2)}`"},{"id":"r2","t":"`{C(4, 2) × C(5, 1)}/{C(9, 3)}`"}],"_a":"TxZYUxUDFUQFFhhAWwsVDBZGBkAbG1sFFg4WEAQbGxRYABZYFUsDFBgWWFcVAxVEARYYQFsPFQwWRgJAGxtbARYOFhAAGxsUWAwWWBVLDxRJ","wrong":{"l2|r9":"The third member must be a boy: multiply by `C(5, 1)`.","l3|r10":"That’s \u003ci>P\u003c/i>(no girls); subtract it from 1.","l5|r11":"That allows two hearts or two spades."},"wrongDefault":"Count the favourable selections group by group, then divide by all selections."},{"id":"compute","type":"numeric","title":"Compute it","summary":"Compute it","goal":[2,3,4,5,6],"star":true,"instruction":"Find each probability. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type a fraction in lowest terms such as 5/12 (an equivalent fraction is fine) or a decimal to 4 places, then press Check.","items":[{"id":"r1","goal":2,"prompt":"6 red and 4 blue; draw 3. \u003ci>P\u003c/i>(exactly 2 red)?","_a":"BBoB","tol":0.00005,"display":"`1/2`","why":"`C(6, 2) × C(4, 1) ÷ C(10, 3)` = 15 × 4 ÷ 120 = `60/120 = 1/2`.","wrong":[{"match":0.125,"fb":"Choose the blue one too: × `C(4, 1)`."}]},{"id":"r2","goal":3,"prompt":"Same bag. \u003ci>P\u003c/i>(no red)?","_a":"BBoEUQQKBAUHBwdRBAoEBQcHBw==","tol":0.00005,"display":"`1/30`","why":"All 3 from the 4 blue: `C(4, 3) ÷ C(10, 3) = 4/120 = 1/30`.","wrong":[{"match":0.4,"fb":"`C(4, 3)/C(10, 3) = 4/120`."}]},{"id":"r3","goal":3,"star":true,"prompt":"10 phones, 3 defective; 4 are tested. \u003ci>P\u003c/i>(at least one defective)?","_a":"BBoMUQQKBAUHBwdRBAoEBQcA","tol":0.00005,"display":"`5/6`","why":"`1 - C(7, 4)/C(10, 4) = 1 - 35/210 = 1 - 1/6 = 5/6`.","wrong":[{"match":0.16666666666666666,"fb":"That’s \u003ci>P\u003c/i>(none)."}]},{"id":"r4","goal":4,"star":true,"prompt":"2 cards are dealt. \u003ci>P\u003c/i>(both face cards)?","_a":"BBoEVg4OAAUDAQFUAg8GBgwBDVY=","tol":0.00005,"display":"`11/221`","why":"`C(12, 2) ÷ C(52, 2) = 66/1326 = 11/221` ≈ 0.0498.","wrong":[{"match":0.05325443786982249,"fb":"`(12/52)^2` treats the draws as independent."}]},{"id":"r5","goal":3,"star":true,"prompt":"A committee of 4 is chosen from 5 women and 4 men. \u003ci>P\u003c/i>(at least 2 women)?","_a":"BBoMUQQKBAUHBwdRBAoEBQcA","tol":0.00005,"display":"`5/6`","why":"2, 3 or 4 women: 60 + 40 + 5 = 105 of the `C(9, 4)` = 126 committees, and `105/126 = 5/6`.","wrong":[{"match":0.47619047619047616,"fb":"That’s exactly 2 women: add exactly 3 and exactly 4."}],"hints":["At least 2 women: 2, 3 or 4 women.","60 + 40 + 5 = 105 committees.","`105/126 = 5/6`."]},{"id":"r6","goal":5,"star":true,"prompt":"A class of 12 includes twins. A committee of 4 is chosen at random. \u003ci>P\u003c/i>(both twins are on it)?","_a":"BBoEWwcABw8EDQRbBwAHDwQNBQ==","tol":0.00005,"display":"`1/11`","why":"Put both twins on, then choose the other 2 from 10: `C(10, 2) ÷ C(12, 4) = 45/495 = 1/11`.","wrong":[{"match":0.1111111111111111,"fb":"`(4/12)^2` treats the twins as independent; count instead: `C(10, 2)/C(12, 4) = 45/495`."}],"hints":["Put both twins on the committee.","Choose the other 2 from 10: `C(10, 2) = 45`.","`45/C(12, 4) = 45/495 = 1/11`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Odette","how":"","goal":[1,2,3],"instruction":"Odette made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"2 cards are dealt from a standard deck. Find \u003ci>P\u003c/i>(both hearts).","steps":["Possible hands of 2: `C(52, 2)` = 1326.","Hands with 2 hearts: 13 × 13 = 169.","\u003ci>P\u003c/i> = `169/1326`."],"_a":"BQ==","stepFb":["Step 1 is correct.","","Step 3 follows step 2. The mistake is earlier."],"fixes":[{"t":"Step 2 is correct.","why":"13 × 13 isn’t a count of 2-heart hands: choose 2 of the 13 hearts.","_n":"1k515","_k":"61b584a3"},{"t":"13 × 12 = 156, so \u003ci>P\u003c/i> = `156/1326`.","why":"That counts ordered pairs on top but unordered hands below. Count the top and bottom the same way: both ordered or both unordered.","_n":"1l4c5","_k":"40a7e27d"},{"t":"Hands with 2 hearts: `C(13, 2)` = 78, so \u003ci>P\u003c/i> = `78/1326 = 1/17`.","why":"Choose 2 of the 13 hearts: `C(13, 2)` = 78 hands, counted the same way as the 1326 below.","_n":"1m4b5","_k":"423b34f2"},{"t":"\u003ci>P\u003c/i> = `1/4 × 1/4`.","w
