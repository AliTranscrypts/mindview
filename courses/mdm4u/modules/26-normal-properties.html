.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 26: Bell shaper (D8 normal curve, Rule pieces and edges), Is it normal? stations (D10 histograms + data panel),
   percent entry, A fair test. Tokens only. */
/* radioGroup (from MDM4U 20) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.6;cursor:not-allowed}

/* Bell shaper */
.np-mode{margin-bottom:4px}
.np-cap{font-size:clamp(1.15rem,2.6vw,1.5rem)}
.np-aha{margin:10px 0 0;font-size:.95rem}
.np-msg{min-height:1.2em;margin:6px 0 0}
.np-teal{color:var(--p-d);font-weight:700}
.np-orange{color:var(--p-k);font-weight:700}
.np-edges{display:grid;gap:4px;margin:6px 0}
.np-edges input[type=range]{width:100%;accent-color:var(--ink)}
.np-pl{margin:8px 0 4px}
.np-pcs{display:flex;flex-wrap:wrap;gap:6px}
.np-pc{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:8px;padding:.3em .6em;font:inherit;font-size:.86rem;min-height:36px;text-align:left}
.np-pc[aria-pressed="true"]{background:var(--hi);border-color:var(--ink);color:var(--hi-ink);font-weight:700}
.np-pp{font-weight:700}
.np-conds{margin:6px 0 0;padding-left:1.3em}
.np-conds li{margin:2px 0}
.np-ok{font-weight:700;color:var(--green)}
.np-no{font-weight:700;color:var(--red)}

/* Is it normal? */
.np-tick{font-weight:700}
.np3-card{border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--sheet)}
.np3-lab{display:block;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.np3-text{margin:0 0 8px}
.np3-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px 16px;align-items:start}
canvas.plot.np3-plot{aspect-ratio:4/3}
.np3-h{margin:0 0 6px;font:700 .85rem var(--font-ui);letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2)}
.np3-ch{margin-top:10px}

/* percent entry */
.np-ctx{margin:0 0 8px;font-weight:600}
.ne-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:8px}
.ne-lab{display:inline-flex;align-items:center;gap:8px}
.ne-lab .numin{width:7rem}
.ne-u{font-weight:700}

/* A fair test */
.ft-in{margin:10px 0}
.ft-read{margin-top:8px}

@media (max-width:560px){
  .np3-grid{grid-template-columns:minmax(0,1fr)}
  .np3-read{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
  canvas.plot.np-plot{aspect-ratio:4/3}
}

operties of a normal distribution: symmetry, a central peak, mean = median = mode, total area 1, tails that never touch the axis.","I can explain how changing `μ` and `σ` changes the normal curve.","I can use the 68–95–99.7 rule to find the percent of values in an interval that starts and ends at whole numbers of standard deviations.","I can work backwards from percentages to find `μ` and `σ`.","I can judge whether a data set is approximately normal, using its shape, mean vs median and the rule’s percentages."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Area as probability","goal":1,"prompt":"For a continuous random variable with a density curve, `P(10 \u003c X \u003c 20)` is…","options":[{"t":"10 ÷ 20","why":"The curve’s shape matters, not just the endpoints.","_n":"096e","_k":"c20d1961"},{"t":"the height at 20 minus the height at 10","why":"Differences of heights aren’t areas.","_n":"199e","_k":"8ae16d5f"},{"t":"the area under the curve between 10 and 20","why":"Probability for a continuous variable is area over an interval (module 25).","_n":"298e","_k":"5595d07e"},{"t":"the height of the curve at 15","why":"Height isn’t probability; area is.","_n":"393e","_k":"cad08473"}],"hints":["What represents probability for a density curve?","Shade the region between 10 and 20.","The shaded area is the probability."]},{"id":"w2","skill":"Area as probability","goal":1,"prompt":"Why is `P(X = 15) = 0` for a continuous random variable?","options":[{"t":"A single value has no width, so the area above it is 0","why":"Area needs an interval.","_n":"492e","_k":"b91e3c5e"},{"t":"The curve is 0 at 15","why":"The curve can be high at 15; the area above one point is still 0.","_n":"595e","_k":"990bfd0f"},{"t":"Probabilities only exist for whole numbers","why":"That’s backwards: continuous variables use intervals.","_n":"694e","_k":"9f8c2a91"},{"t":"15 can’t happen","why":"Values near 15 happen all the time.","_n":"78fe","_k":"dae48415"}],"hints":["What is the area of a line segment?","A rectangle of width 0 has area 0.","So `P(X = 15) = 0`."]},{"id":"w3","skill":"Standard deviation","goal":2,"prompt":"Data set P: 48, 50, 52. Data set Q: 30, 50, 70. Which has the larger standard deviation?","options":[{"t":"Q","why":"Q’s values sit much farther from the mean of 50.","_n":"88ee","_k":"35c23e36"},{"t":"You can’t tell without more values","why":"Three values are enough to compare spread.","_n":"9bbd","_k":"591664de"},{"t":"P","why":"P’s values are only 2 from the mean.","_n":"abcd","_k":"a976312f"},{"t":"They’re equal, because both have mean 50","why":"Same centre, different spread.","_n":"bbdd","_k":"eb637537"}],"hints":["Standard deviation measures distance from the mean.","Both means are 50.","Q’s values are 20 away; P’s are 2 away."]},{"id":"w4","skill":"Standard deviation","goal":3,"prompt":"Marks have mean 72 and standard deviation 8. A mark of 88 is how many standard deviations above the mean?","options":[{"t":"1.22","why":"Subtract, then divide by `σ`.","_n":"cbed","_k":"1e18a723"},{"t":"2","why":"88 − 72 = 16, and 16 ÷ 8 = 2.","_n":"db7d","_k":"5415c4fd"},{"t":"11","why":"Measure from the mean first.","_n":"eb8d","_k":"7ce24bd8"},{"t":"16","why":"16 is marks, not standard deviations.","_n":"fb9d","_k":"7caff2e6"}],"hints":["How far is 88 from 72?","16 marks.","16 ÷ 8 = 2."]},{"id":"w5","skill":"Symmetry arithmetic","goal":3,"prompt":"A distribution is symmetric about 50, and 30% of values lie between 50 and 60. What percent lie between 40 and 60?","options":[{"t":"15%","why":"The interval doubles, so the percent doubles.","_n":"gbad","_k":"cc07713b"},{"t":"60%","why":"By symmetry, 30% also lies between 40 and 50.","_n":"hc3d","_k":"55939bc2"},{"t":"80%","why":"Only the two 30% pieces.","_n":"ic4d","_k":"eb05ac93"},{"t":"30%","why":"40 to 50 mirrors 50 to 60.","_n":"j4de","_k":"b6593f36"}],"hints":["What is the mirror image of 60 across 50?","40.","30% + 30% = 60%."]},{"id":"w6","skill":"Symmetry arithmetic","goal":3,"prompt":"In a symmetric distribution, 95% of values lie between 40 and 60. What percent lie above 60?","options":[{"t":"47.5%","why":"That’s between the centre and 60.","_n":"k4ce","_k":"efbb5e6c"},{"t":"5%","why":"5% is both tails together.","_n":"l4fe","_k":"3d5cd8aa"},{"t":"2.5%","why":"5% is outside; half of it is above 60.","_n":"m4ee","_k":"65a96d87"},{"t":"95%","why":"95% is inside the interval.","_n":"n49e","_k":"1a1cb30b"}],"hints":["What percent is outside 40 to 60?","100 − 95 = 5%.","Split it evenly: 2.5% above 60."]}],"refreshers":{"Area as probability":"For a continuous variable, `P(a \u003c X \u003c b)` is the area under the density curve from `a` to `b`. The total area is 1, and a single value has probability 0.","Standard deviation":"`σ` measures the typical distance of values from the mean. To count standard deviations, subtract the mean, then divide by `σ`: (88 − 72) ÷ 8 = 2.","Symmetry arithmetic":"In a symmetric distribution, the area on one side of the centre mirrors the other. Split any ‘outside’ percent equally between the two tails."}}},"explore":{"heading":"Bell shaper","intro":"Change `μ` and `σ` and watch the curve respond. Then shade bands to see the 68–95–99.7 rule.","predIntro":"Make a prediction first. Then the bell shaper will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"compare","mu":100,"sd":10},"to":{"sd":20},"prompt":"Start `N(100, 10^2)`. `σ` changes from 10 to 20. What happens to the curve?","options":[{"t":"The peak doubles in height","_n":"o48e","_k":"06b5a3e3"},{"t":"The curve moves 10 to the right","_n":"p4be","_k":"17fada12"},{"t":"The peak drops to half its height and the curve gets twice as wide","_n":"q4ae","_k":"f684537f"},{"t":"Nothing changes but the labels","_n":"r45e","_k":"9bb218eb"}],"explain":"The curve flattens and widens; the dashed ghost shows the old curve. The area must stay 1, so a curve twice as wide is half as tall."},{"id":"p2","start":{"mode":"compare","mu":100,"sd":15},"to":{"mu":120},"prompt":"Start `N(100, 15^2)`. `μ` changes from 100 to 120. What happens to the shape?","options":[{"t":"Same shape, moved 20 to the right","_n":"s44e","_k":"1d191f40"},{"t":"It gets taller","_n":"tc7d","_k":"39195825"},{"t":"It gets wider","_n":"uc8d","_k":"e4a8b35b"},{"t":"It becomes skewed right","_n":"vc5d","_k":"a40847f1"}],"explain":"The curve slides; the ghost is identical apart from position. `μ` is a horizontal shift; only `σ` changes the shape."},{"id":"p3","start":{"mode":"rule","mu":100,"sd":15},"shade":[-1,0,1],"prompt":"Rule mode, `N(100, 15^2)`. What percent of values lie between 85 and 130?","options":[{"t":"81.5%","_n":"wc6d","_k":"e96208d8"},{"t":"95%","_n":"xcbd","_k":"23693834"},{"t":"47.5%","_n":"yccd","_k":"e8420aa4"},{"t":"68%","_n":"zc9d","_k":"9449a591"}],"explain":"The pieces 34%, 34% and 13.5% shade one by one. 85 is `μ - σ` and 130 is `μ + 2σ`: 34 + 34 + 13.5 = 81.5%."},{"id":"p4","start":{"mode":"rule","mu":100,"sd":15},"shade":[2,3],"prompt":"Rule mode, `N(100, 15^2)`. What percent of values lie above 130?","options":[{"t":"5%","_n":"10cad","_k":"c921cd5a"},{"t":"13.5%","_n":"11bfd","_k":"9c94b063"},{"t":"0.15%","_n":"12c0d","_k":"792b2f6d"},{"t":"2.5%","_n":"1349d","_k":"8491478b"}],"explain":"The right tail beyond `μ + 2σ` shades (2.35% + 0.15%). 5% lies beyond `2σ` in both tails together, so 2.5% is on the right."}],"chalIntro":"Use the bell shaper to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":[2,4],"prompt":"Set the curve so that 95% of values lie between 60 and 100.","why":"60 and 100 are `μ ± 2σ`: the mean is the middle, 80, and `2σ = 20`, so `σ = 10`.","hints":["Which band holds 95%?","`μ ± 2σ`; the mean is the middle of 60 and 100.","`μ = 80` and `2σ = 20`, so `σ = 10`."]},{"id":"tc2","goal":[2,4],"prompt":"Set the mean to 115 so that 16% of values lie above 130.","why":"16% lies above `μ + σ`, so 130 = 115 + `σ` and `σ = 15`.","hints":["What percent lies above `μ + σ`?","50% − 34% = 16%.","So 130 = 115 + `σ`: `σ = 15`."]},{"id":"tc3","goal":[2,4],"stretch":true,"prompt":"Find `μ` and `σ` so that 2.5% of values lie \u003cstrong>below 52\u003c/strong> and 16% lie \u003cstrong>above 82\u003c/strong>.","why":"52 = `μ - 2σ` and 82 = `μ + σ`. Subtract: `3σ = 30`, so `σ = 10` and `μ = 72`.","hints":["2.5% below means 52 = `μ - 2σ`.","16% above means 82 = `μ + σ`.","Subtract: `3σ = 30`, so `σ = 10` and `μ = 72`."]}]},"part3":{"slug":"is-it-normal","name":"Is it normal?","heading":"Is it normal?","intro":"Real-looking data sets don’t come labelled. At each station, read the histogram and the \u003cstrong>Check it with data\u003c/strong> panel, which compares the set’s percentages with the 68–95–99.7 rule. Then choose a verdict and one reason.","verdicts":[{"id":"normal","t":"Approximately normal"},{"id":"right","t":"Skewed right"},{"id":"left","t":"Skewed left"},{"id":"uniform","t":"Uniform"}],"reasons":[{"id":"bell","t":"mean ≈ median and bell-shaped"},{"id":"above","t":"mean well above median"},{"id":"flat","t":"flat histogram"},{"id":"rule","t":"rule percentages match"}],"stations":[{"id":"A","title":"Adult heights","data":"Heights of 200 adults (cm)","unit":"cm","n":200,"x0":140,"w":5,"bins":[1,3,10,22,36,44,39,26,13,5,1,0],"mean":168.2,"median":168,"sd":9,"w1":69,"w2":96,"dp":1,"_a":"HkcSFl8SCloXCAVYRxxGR0dfPxYHVQhZR0lGRhBcARc4GA==","right":"Bell-shaped, mean 168.2 ≈ median 168.0, and 69% and 96% are close to the rule’s 68% and 95%.","vfb":{"right":"Mean 168.2 and median 168.0 are almost equal, so there’s no long tail.","left":"Mean 168.2 and median 168.0 are almost equal, so there’s no long tail.","uniform":"The bars rise to a central peak; a uniform set would be flat."},"rfb":{"above":"Here the mean (168.2) and median (168.0) are almost equal.","flat":"This histogram has a clear central peak."}},{"id":"B","title":"Clinic wait times","data":"Clinic wait times (min)","unit":"min","n":200,"x0":0,"w":5,"bins":[14,30,38,30,22,16,12,9,7,6,5,4,3,2,1,1],"mean":24,"median":18,"sd":15,"w1":80,"w2":94,"dp":0,"_a":"HkcSFl8SFlwCDRAWSRIWF18+RlUHXxJQRzgZ","right":"A long right tail: a few very long waits pull the mean (24) well above the median (18).","vfb":{"normal":"Mean well above median: a long right tail. Check shape, mean vs median, \u003cstrong>and\u003c/strong> the 1 SD and 2 SD percentages. A flat set or a skewed set isn’t normal.","left":"The long tail is on the right (the mean is above the median), so it’s skewed right.","uniform":"The bars aren’t level: they peak early and trail off to the right."},"rfb":{"bell":"Here the mean (24) is well above the median (18), and the bars aren’t bell-shaped.","flat":"The bars aren’t level.","rule":"80% within 1 SD is far above the rule’s 68%."}},{"id":"C","title":"Rolling one die","data":"600 rolls of one die","unit":"","n":600,"x0":0.5,"w":1,"bins":[98,103,101,97,104,97],"mean":3.5,"median":3.5,"sd":1.7,"w1":67,"w2":100,"dp":1,"_a":"HkcSFl8SEVsMAwtGCBJIFxdHXm9HVghUEUc5SQ==","right":"Symmetric, but flat: six equal bars, no central peak, and 100% within 2 SD instead of about 95%.","vfb":{"normal":"Symmetric, and 67% is close to 68%, but the histogram is flat and \u003cstrong>100%\u003c/strong> lies within 2 SD. A normal set has about 95%.","right":"Mean = median = 3.5; there’s no skew.","left":"Mean = median = 3.5; there’s no skew."},"rfb":{"bell":"Mean = median, but the histogram is flat, not bell-shaped.","above":"Mean = median = 3.5.","rule":"67% is close to 68%, but 100% within 2 SD isn’t 95%: the percentages don’t match."}},{"id":"D","title":"Final marks","data":"Final marks in a large course","unit":"","n":400,"x0":40,"w":5,"bins":[2,5,15,32,55,74,80,64,41,21,8,3],"mean":71,"median":72,"sd":10,"w1":67,"w2":95,"dp":0,"_a":"HkcSFl8SCloXCAVYRxxGR0dfPxYHVQhZR0lGRhBcARc4GA==","right":"Bell-shaped, mean 71 ≈ median 72, and 67% and 95% match the rule’s 68% and 95%.","vfb":{"right":"Mean 71 and median 72 are almost equal, so there’s no long tail.","left":"Mean 71 and median 72 are only 1 apart, and the bars fall off evenly on both sides.","uniform":"The bars rise to a central peak; a uniform set would be flat."},"rfb":{"above":"Here the mean (71) and median (72) are almost equal.","flat":"This histogram has a clear central peak."}},{"id":"E","title":"Household incomes","data":"Household incomes ($)","unit":"$","n":200,"x0":0,"w":20000,"bins":[6,30,48,38,26,18,12,8,6,4,2,1,1],"mean":82000,"median":68000,"sd":41000,"w1":78,"w2":95,"dp":0,"money":true,"_a":"HkcSFl8SFlwCDRAWSRIWF18+RlUHXxJQRzgZ","right":"A long right tail: a few very high incomes pull the mean ($82 000) well above the median ($68 000).","vfb":{"normal":"95% within 2 SD looks normal, but the mean is well above the median and the right tail is long. Check shape, mean vs median, \u003cstrong>and\u003c/strong> the 1 SD and 2 SD percentages. A flat set or a skewed set isn’t normal.","left":"The long tail is on the right (the mean is above the median), so it’s skewed right.","uniform":"The bars aren’t level: they peak early and trail off to the right."},"rfb":{"bell":"Here the mean ($82 000) is well above the median ($68 000).","flat":"The bars aren’t level.","rule":"95% within 2 SD matches, but 78% within 1 SD is far above 68%, and one percentage can’t outweigh the shape."}}],"quickCheck":{"title":"Quick check","summary":"Is it normal? quick check","items":[{"id":"q1","goal":5,"prompt":"A data set has mean 40 and median 31. Is a normal model likely to fit?","choices":[{"t":"Yes, if the SD is small","fb":"Mean well above median: a long right tail.","_n":"1448d","_k":"ff698236"},{"t":"Yes, the mean is reasonable","fb":"Mean well above median: a long right tail.","_n":"1547d","_k":"d546a6c0"},{"t":"No, it’s skewed left","fb":"Mean well above median: a long right tail.","_n":"1646d","_k":"831872f2"},{"t":"No, it’s skewed right","fb":"Right. Mean well above median: a long right tail.","_n":"174dd","_k":"60398bce"}]},{"id":"q2","goal":5,"prompt":"A symmetric data set has 99% of values within 2 SD. Normal?","choices":[{"t":"Can’t tell","fb":"Too much in the middle for a normal shape. Check shape, mean vs median, \u003cstrong>and\u003c/strong> the 1 SD and 2 SD percentages. A flat set or a skewed set isn’t normal.","_n":"184cd","_k":"0b54f0e9"},{"t":"Yes: it’s symmetric","fb":"Too much in the middle for a normal shape. Check shape, mean vs median, \u003cstrong>and\u003c/strong> the 1 SD and 2 SD percentages. A flat set or a skewed set isn’t normal.","_n":"194bd","_k":"461a9119"},{"t":"Probably not: normal has about 95%","fb":"Right. Too much in the middle for a normal shape.","_n":"1a4ad","_k":"73fdc43d"},{"t":"Yes: 99% is high","fb":"Too much in the middle for a normal shape. Check shape, mean vs median, \u003cstrong>and\u003c/strong> the 1 SD and 2 SD percentages. A flat set or a skewed set isn’t normal.","_n":"1b41d","_k":"f6bc5859"}]},{"id":"q3","goal":5,"prompt":"Which variable is most likely to be approximately normal?","choices":[{"t":"Results of rolling one die","fb":"Heights cluster symmetrically around an average; one die is flat (uniform).","_n":"1c40d","_k":"c7f931f1"},{"t":"Salaries at a company","fb":"Heights cluster symmetrically around an average; salaries have a long right tail.","_n":"1d43c","_k":"66f64f68"},{"t":"Heights of adult women in a city","fb":"Right. Heights cluster symmetrically around an average.","_n":"1e44c","_k":"6569b675"},{"t":"Time until a bus arrives","fb":"Heights cluster symmetrically around an average; waiting times aren’t bell-shaped.","_n":"1f45c","_k":"fe7b9d44"}]},{"id":"q4","goal":1,"prompt":"In a normal data set of 1000 values, about how many lie more than 3 SD from the mean?","choices":[{"t":"0","fb":"0.3% of 1000 = 3. The tails never quite end.","_n":"1g46c","_k":"09644332"},{"t":"3","fb":"Right. 0.3% of 1000 = 3. The tails never quite end.","_n":"1h47c","_k":"02d903d3"},{"t":"30","fb":"0.3% of 1000 = 3. The tails never quite end.","_n":"1i48c","_k":"ba794dd2"},{"t":"50","fb":"0.3% of 1000 = 3. The tails never quite end.","_n":"1j49c","_k":"83d24e64"}]}]}},"practice":{"activities":[{"id":"rule","type":"custom","title":"Rule calculator","summary":"Rule calculator","goal":3,"instruction":"Use the 68–95–99.7 rule to answer each question.","context":"Lengths of a fish species are normal with `μ` = 40 cm and `σ` = 4 cm (model data).","how":"Type a percent such as 16 or 16%, then press Check.","items":[{"id":"r1","goal":3,"prompt":"% between 36 and 44 cm","unit":"%","_a":"U10=","display":"68%","why":"36 and 44 are `μ ± σ`.","wrong":[{"match":34,"fb":"That’s one side only."}]},{"id":"r2","goal":3,"prompt":"% between 32 and 48 cm","unit":"%","_a":"XFA=","display":"95%","why":"32 and 48 are `μ ± 2σ`.","wrong":[{"match":47.5,"fb":"That’s from the mean to one end."}]},{"id":"r3","goal":3,"prompt":"% longer than 44 cm","unit":"%","_a":"VFM=","display":"16%","why":"44 is `μ + σ`: 50 − 34 = 16.","wrong":[{"match":34,"fb":"34% lies between 40 and 44; above 44 is 50 − 34 = 16."}]},{"id":"r4","goal":3,"prompt":"% shorter than 32 cm","unit":"%","_a":"V0tR","display":"2.5%","why":"32 is `μ - 2σ`: half of the 5% outside.","wrong":[{"match":5,"fb":"5% is both tails together."}]},{"id":"r5","goal":3,"prompt":"% between 40 and 52 cm","unit":"%","_a":"UVxKDFA=","display":"49.85%","why":"52 is `3σ` above: 34 + 13.5 + 2.35 = 49.85.","wrong":[{"match":47.5,"fb":"52 is `3σ` above: 34 + 13.5 + 2.35 = 49.85."}],"hints":["How many `σ` above the mean is 52?","`3σ`: from 40 to 52 is half of 99.7%.","34 + 13.5 + 2.35 = 49.85."]},{"id":"r6","goal":3,"prompt":"% between 36 and 48 cm","unit":"%","_a":"XVRKAQ==","display":"81.5%","why":"34 + 34 + 13.5 = 81.5.","wrong":[{"match":68,"fb":"36 is `1σ` below but 48 is `2σ` above."}]},{"id":"r7","goal":3,"prompt":"% shorter than 28 cm or longer than 52 cm","unit":"%","_a":"VUtX","display":"0.3%","why":"Outside `μ ± 3σ`: 100 − 99.7 = 0.3.","wrong":[{"match":0.15,"fb":"That’s one tail; there are two."}]},{"id":"r8","goal":3,"prompt":"In a catch of 1000 fish, how many are longer than 48 cm?","unit":"fish","_a":"V1A=","display":"25 fish","why":"48 is `μ + 2σ`: 2.5% of 1000 = 25.","wrong":[{"match":50,"fb":"Only the upper tail: 2.5% of 1000."}],"hints":["Which band ends at 48?","`μ + 2σ`: 2.5% lies above it.","0.025 × 1000 = 25."]}]},{"id":"back","type":"custom","title":"Work backwards","summary":"Work backwards","goal":[3,4],"star":true,"instruction":"Match each percent to a band edge, then solve for `μ` and `σ`. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Type each number, then press Check.","items":[{"id":"b1","goal":4,"prompt":"95% of a normal variable lies between 120 and 180. Find `μ` and `σ`.","parts":["`μ` =","`σ` ="],"_a":"PlRRBEkBUWg=","display":"`μ = 150`, `σ = 15`","why":"120 and 180 are `μ ± 2σ`: `μ` is the midpoint, 150, and `4σ = 60`.","wrong":[{"part":1,"match":30,"fb":"120 to 180 is `±2σ`, not `±1σ`."}]},{"id":"b2","goal":4,"prompt":"16% of values lie above 66 and 16% lie below 54. Find `μ` and `σ`.","parts":["`μ` =","`σ` ="],"_a":"PlNUGFNt","display":"`μ = 60`, `σ = 6`","why":"16% beyond each end means 54 and 66 are `μ ± σ`.","wrong":[{"part":1,"match":3,"fb":"16% beyond each end means `±1σ`."}]},{"id":"b3","goal":4,"star":true,"prompt":"2.5% of values lie above 230 and 50% lie above 200. Find `σ`.","label":"`σ` =","_a":"VFA=","display":"`σ = 15`","why":"50% above 200 means `μ = 200`; 2.5% above 230 means 230 = `μ + 2σ`, so `σ = 15`.","wrong":[{"match":30,"fb":"50% above 200 means `μ = 200`; 230 is `μ + 2σ`."}]},{"id":"b4","goal":3,"star":true,"prompt":"Bolts have diameters `N(10.0, 0.2^2)` mm. Bolts outside 9.6 to 10.4 mm are rejected. In a batch of 2000, about how many are rejected?","label":"Rejected bolts:","_a":"VFVU","display":"100 bolts","why":"9.6 and 10.4 are `μ ± 2σ`, so 5% lies outside: 0.05 × 2000 = 100.","wrong":[{"match":50,"fb":"Both ends are rejected: 5% of 2000."}],"hints":["How far from the mean are 9.6 and 10.4?","Each is `2σ` away: 5% lies outside.","0.05 × 2000 = 100."]},{"id":"b5","goal":3,"star":true,"prompt":"Class A’s marks are `N(70, 5^2)`; class B’s are `N(70, 10^2)`. What percent of each class scores above 80?","parts":["Class A (%):","Class B (%):"],"_a":"PldKAUkBUmg=","display":"A: 2.5%; B: 16%","why":"For A, 80 is `μ + 2σ` (2.5% above); for B, 80 is `μ + σ` (16% above).","wrong":[{"part":0,"match":16,"fb":"For A, 80 is `2σ` above, not `1σ`."}]},{"id":"b6","goal":4,"star":true,"prompt":"84% of values lie below 75 and 97.5% lie below 85. Find `μ` and `σ`.","parts":["`μ` =","`σ` ="],"_a":"PlNRGFQAOQ==","display":"`μ = 65`, `σ = 10`","why":"`μ + σ = 75` and `μ + 2σ = 85`. Subtract: `σ = 10`, so `μ = 65`.","wrong":[{"part":0,"match":75,"fb":"84% below means 75 = `μ + σ`."}],"hints":["84% below a value: which band edge?","`μ + σ = 75` and `μ + 2σ = 85`.","Subtract: `σ = 10`, so `μ = 65`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Bruno","how":"","goal":[3,5],"instruction":"Bruno made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Apple masses are `N(150, 10^2)` g. What percent weigh between 130 and 160 g?","steps":["130 is `2σ` below the mean; 160 is `1σ` above.","Between 130 and 150 there is 95%.","Between 150 and 160 there is 34%.","95 + 34 = 129%, so all apples, 100%."],"_a":"VA==","stepFb":["Step 1 is correct. Keep checking.","","Step 3 is correct on its own; the mistake is earlier.","This follows the earlier slip."],"fixes":[{"t":"Use 68% for the whole interval.","why":"130 is `2σ` below, not `1σ`.","_n":"1k4ac","_k":"8a2382b5"},{"t":"Step 2 is correct.","why":"95% is the whole band from 130 to 170.","_n":"1l3bc","_k":"43b6eb38"},{"t":"From `μ - 2σ` to `μ` is half of 95%: 47.5%. The total is 47.5 + 34 = 81.5%.","why":"95% is the whole band from 130 to 170, so 130 to 150 holds half of it.","_n":"1m3cc","_k":"d327d09b"},{"t":"130 is `3σ` below.","why":"150 − 130 = 20 = `2σ`.","_n":"1nb5d","_k":"414ee9bb"}],"hints":["What percent lies between `μ - 2σ` and `μ + 2σ`?","95%; how much is on one side?","47.5% + 34% = 81.5%."]},{"id":"e2","goal":3,"task":"Phone battery life is `N(20, 2^2)` hours. What percent of phones last more than 22 hours?","steps":["22 = `μ + σ`.","68% of values lie within one SD of the mean.","So 68% of phones last more than 22 hours."],"_a":"Vw==","stepFb":["Step 1 is correct.","Step 2 is correct.",""],"fixes":[{"t":"Step 3 is correct.","why":"68% is the middle band, not the upper tail.","_n":"1ob4d","_k":"facadc2f"},{"t":"84% last more than 22 hours.","why":"84% last \u003cstrong>less\u003c/strong> than 22 hours.","_n":"1pb7d","_k":"c60680d7"},{"t":"68% is inside 18 to 22, so 32% is outside, half of it above 22: 16%.","why":"68% is the whole band from `μ - σ` to `μ + σ`: 34% on each side. Above `μ + σ` is only 16%.","_n":"1qb6d","_k":"e82d1e60"},{"t":"34% last more than 22 hours.","why":"34% is between 20 and 22.","_n":"1rb9d","_k":"425b0433"}],"hints":["Where is the 68% band?","From 18 to 22.","Above 22: (100 − 68) ÷ 2 = 16%."]},{"id":"e3","goal":5,"task":"Is the distribution of 600 rolls of a fair die approximately normal?","steps":["Mean = median = 3.5, so the data are symmetric.","67% of rolls are within 1 SD, close to the rule’s 68%.","So the distribution is approximately normal."],"_a":"Vw==","stepFb":["Step 1 is fine.","Step 2 is accurate.",""],"fixes":[{"t":"It’s normal because 600 rolls is a lot.","why":"More rolls make the histogram flatter, not bell-shaped.","_n":"1sb8d","_k":"3bfe029f"},{"t":"Also check the shape and the 2 SD percent: the histogram is flat and 100% lies within 2 SD, not 95%. It’s uniform, not normal.","why":"Check shape, mean vs median, \u003cstrong>and\u003c/strong> the 1 SD and 2 SD percentages. A flat set or a skewed set isn’t normal.","_n":"1tbbd","_k":"337de609"},{"t":"Step 3 is correct.","why":"Check shape, mean vs median, \u003cstrong>and\u003c/strong> the 1 SD and 2 SD percentages. A flat set or a skewed set isn’t normal.","_n":"1ubad","_k":"925166a0"},{"t":"It’s skewed right.","why":"Mean = median; it’s not skewed.","_n":"1vbdd","_k":"25e21e1a"}],"hints":["What does the histogram look like?","Six equal bars.","Flat, with 100% within 2 SD: uniform."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the Bell shaper: that a wider curve gets lower, or that the rule’s percentages never change?"},{"id":"j2","q":"In your own words, why can’t `σ` change without the height changing too?"},{"id":"j3","q":"Explain to a friend how to find the percent of values between `μ - σ` and `μ + 2σ`."},{"id":"j4","q":"Which data set in ‘Is it normal?’ fooled you, or nearly did? What will you check first next time?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which statement is true of every normal distribution?","options":[{"t":"Its mean is larger than its median","why":"That describes right skew.","_n":"1wbcd","_k":"03263440"},{"t":"Its total area depends on `σ`","why":"The total area is always 1.","_n":"1x4fd","_k":"548d507c"},{"t":"Its mean, median and mode are equal, and it is symmetric about the mean","why":"Every normal curve is symmetric with its peak at the mean.","_n":"1y50d","_k":"7224ce4b"},{"t":"Its curve touches the `x`-axis at `μ ± 3σ`","why":"The tails never touch the axis. The tails never reach the axis. Beyond `3σ` there is still 0.3% of the area.","_n":"1z4dd","_k":"9c5d8cc4"}]},"b":{"prompt":"Where are the inflection points of `N(60, 5^2)`?","options":[{"t":"45 and 75","why":"That’s `μ ± 3σ`.","_n":"204ed","_k":"cf09b0fa"},{"t":"50 and 70","why":"That’s `μ ± 2σ`.","_n":"214bd","_k":"fe326e94"},{"t":"Only at 60","why":"The peak is at 60; the curve changes how it bends at `μ ± σ`.","_n":"224cd","_k":"0ecbb26e"},{"t":"55 and 65","why":"At `μ ± σ`.","_n":"2349d","_k":"8e4a51d2"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"For `N(500, 100^2)`, what percent of values lie between 400 and 600?","options":[{"t":"68%","why":"`μ ± σ`.","_n":"244ad","_k":"86147efd"},{"t":"95%","why":"That’s `μ ± 2σ`: 300 to 700.","_n":"2547d","_k":"5cb26d45"},{"t":"50%","why":"Half lies above 500, but 400 to 600 is the middle band.","_n":"2648d","_k":"ed1b6809"},{"t":"34%","why":"That’s one side only.","_n":"27d1c","_k":"b7e3f904"}]},"b":{"prompt":"For `N(50, 4^2)`, what percent of values lie between 42 and 58?","options":[{"t":"99.7%","why":"That’s 38 to 62.","_n":"28d0c","_k":"665f7306"},{"t":"68%","why":"That’s 46 to 54.","_n":"29cfc","_k":"c4fa4c2c"},{"t":"95%","why":"`μ ± 2σ`.","_n":"2acec","_k":"5aad8880"},{"t":"47.5%","why":"That’s one side only.","_n":"2bcdc","_k":"1206c989"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"A normal curve changes from `N(80, 6^2)` to `N(80, 12^2)`. Which describes the change?","options":[{"t":"It becomes flatter and wider, with half the peak height; the centre stays at 80","why":"`σ` doubled, so the curve is twice as wide and half as tall; `μ` didn’t change.","_n":"2cccc","_k":"92308540"},{"t":"Its peak doubles in height","why":"The total area must stay 1. A wider curve has to be lower: doubling `σ` halves the peak.","_n":"2dcbc","_k":"916df2cd"},{"t":"It becomes taller and narrower","why":"The total area must stay 1. A wider curve has to be lower: doubling `σ` halves the peak.","_n":"2ecac","_k":"17f0c3eb"},{"t":"It shifts 6 to the right","why":"`μ` didn’t change.","_n":"2fc9c","_k":"683e5390"}]},"b":{"prompt":"A normal curve changes from `N(80, 6^2)` to `N(92, 6^2)`. Which describes the change?","options":[{"t":"It becomes wider","why":"`σ` didn’t change.","_n":"2gc8c","_k":"bab820f8"},{"t":"It becomes taller","why":"`σ` didn’t change. `μ` only slides the curve. The shape depends on `σ` alone.","_n":"2h4bc","_k":"e9696160"},{"t":"It shifts 12 to the right with the same shape","why":"`μ` rose by 12 and `σ` didn’t change.","_n":"2i4cc","_k":"bdaaccb3"},{"t":"It shifts 12 to the left","why":"A larger mean moves the curve right.","_n":"2j4dc","_k":"4f5eb034"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Commute times are `N(30, 5^2)` minutes. What percent of commutes take between 25 and 40 minutes?","options":[{"t":"81.5%","why":"25 is `μ - σ` and 40 is `μ + 2σ`: 34 + 34 + 13.5.","_n":"2k4ec","_k":"52f205cf"},{"t":"95%","why":"25 is only `1σ` below.","_n":"2l47c","_k":"84cb1781"},{"t":"47.5%","why":"That’s only 30 to 40.","_n":"2m48c","_k":"874ff7eb"},{"t":"68%","why":"40 is `2σ` above, not `1σ`.","_n":"2n49c","_k":"9a32811d"}]},"b":{"prompt":"Commute times are `N(30, 5^2)` minutes. What percent take between 20 and 35 minutes?","options":[{"t":"81.5%","why":"13.5 + 34 + 34.","_n":"2o4ac","_k":"0b016dff"},{"t":"95%","why":"35 is only `1σ` above.","_n":"2p43c","_k":"f82017e9"},{"t":"47.5%","why":"That’s only 20 to 30.","_n":"2q44c","_k":"0e1b9c7b"},{"t":"68%","why":"20 is `2σ` below, not `1σ`.","_n":"2r525","_k":"60e5c66b"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A normal variable has 2.5% of values below 40 and 2.5% above 100. Find `μ` and `σ`.","options":[{"t":"`μ = 70`, `σ = 30`","why":"That treats 40 and 100 as `μ ± σ`.","_n":"2s535","_k":"b25e4c47"},{"t":"`μ = 70`, `σ = 15`","why":"40 and 100 are `μ ± 2σ`: `4σ = 60`.","_n":"2t545","_k":"30ca6cec"},{"t":"`μ = 60`, `σ = 20`","why":"The mean is the midpoint of 40 and 100.","_n":"2u555","_k":"ee19c25b"},{"t":"`μ = 70`, `σ = 10`","why":"That treats them as `μ ± 3σ`.","_n":"2v4e5","_k":"677933af"}]},"b":{"prompt":"A normal variable has 16% of values below 45 and 16% above 75. Find `μ` and `σ`.","options":[{"t":"`μ = 60`, `σ = 15`","why":"45 and 75 are `μ ± σ`.","_n":"2w4f5","_k":"b147fdc6"},{"t":"`μ = 60`, `σ = 7.5`","why":"That treats them as `μ ± 2σ`.","_n":"2x505","_k":"6c010ac7"},{"t":"`μ = 55`, `σ = 10`","why":"The mean is the midpoint, 60.","_n":"2y515","_k":"3e5a1deb"},{"t":"`μ = 60`, `σ = 30`","why":"`μ ± σ` covers 45 to 75: `2σ = 30`.","_n":"2z4a5","_k":"c465aad7"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"In a large school, sleep times are normal. 84% of students sleep less than 9 h and 2.5% sleep less than 6 h. What is the mean?","options":[{"t":"7 h","why":"Check: 7 + 1 = 8, not 9.","_n":"304b5","_k":"3af44f79"},{"t":"9 h","why":"84% below 9 puts 9 above the mean.","_n":"31586","_k":"8c575254"},{"t":"8 h","why":"`μ + σ = 9` and `μ - 2σ = 6`, so `3σ = 3`: `σ = 1`, `μ = 8`.","_n":"32576","_k":"21d4fd1b"},{"t":"7.5 h","why":"That’s the midpoint of 6 and 9, but they aren’t equally far from the mean.","_n":"33566","_k":"1cebef8c"}]},"b":{"prompt":"84% of values lie below 31 and 2.5% lie below 22. What is the mean?","options":[{"t":"25","why":"Check: 25 + 3 = 28, not 31.","_n":"34556","_k":"0ca8b198"},{"t":"26.5","why":"The midpoint assumes both are the same distance from the mean.","_n":"35546","_k":"8661ff54"},{"t":"28","why":"`μ + σ = 31` and `μ - 2σ = 22`: `σ = 3`.","_n":"36536","_k":"e8949b23"},{"t":"31","why":"31 is above the mean.","_n":"37526","_k":"f022a33c"}]}},{"id":"c1","cat":"C","goal":[1,5],"a":{"prompt":"Which is the best explanation of why household incomes are not well modelled by a normal curve?","options":[{"t":"“There are too many incomes to graph.”","why":"Large data sets can still be normal.","_n":"38516","_k":"d5e2b8a0"},{"t":"“Incomes are counted in whole dollars.”","why":"Many normal models use rounded data.","_n":"39506","_k":"ef412fb4"},{"t":"“The data are skewed right: a few very high incomes stretch the right tail and pull the mean well above the median, so the shape isn’t symmetric.”","why":"Shape is the test, and incomes have a long right tail.","_n":"3a4f6","_k":"b7a10f96"},{"t":"“Incomes can’t be measured accurately.”","why":"Measurement isn’t the issue; shape is.","_n":"3bbe6","_k":"09ac71d3"}]},"b":{"prompt":"Which is the best explanation of why the results of rolling one fair die are not normal, even though they’re symmetric?","options":[{"t":"“Six values is too few.”","why":"The count of values isn’t the test; the shape is.","_n":"3cbf6","_k":"c9a9e9fd"},{"t":"“The distribution is flat: every value is equally likely, there’s no central peak, and 100% of rolls lie within 2 SD instead of about 95%.”","why":"Symmetry alone isn’t enough; the shape must be a bell.","_n":"3dbc6","_k":"c94b5720"},{"t":"“It’s skewed right.”","why":"Mean = median = 3.5.","_n":"3ebd6","_k":"b5f48ce9"},{"t":"“The mean and median differ.”","why":"Both are 3.5.","_n":"3fc26","_k":"61f2272b"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Two normal curves have the same mean, and curve P is taller than curve Q. Which statement is correct?","options":[{"t":"“P has the smaller standard deviation; each curve has a total area of 1.”","why":"A taller curve must be narrower to keep its area at 1.","_n":"3gc36","_k":"10afdc28"},{"t":"“P has the larger mean.”","why":"The means are equal.","_n":"3hc06","_k":"7dc3b40b"},{"t":"“P contains more data values than Q.”","why":"Height isn’t amount; both have area 1.","_n":"3ic16","_k":"08a85f73"},{"t":"“P has the larger standard deviation.”","why":"The total area must stay 1. A wider curve has to be lower: doubling `σ` halves the peak.","_n":"3jc66","_k":"797c114b"}]},"b":{"prompt":"Curve R is twice as wide as curve S, and both have the same mean. Which statement is correct?","options":[{"t":"“R’s standard deviation is twice S’s, and R’s peak is half as high; each has area 1.”","why":"Twice as wide means twice the `σ`, so half the height.","_n":"3kc76","_k":"57e98b88"},{"t":"“R contains twice as many values.”","why":"Probability is \u003cstrong>area\u003c/strong> under the curve. A taller curve doesn’t hold more values.","_n":"3lc46","_k":"700c88ab"},{"t":"“R’s mean is twice S’s.”","why":"Both have the same mean. `μ` only slides the curve. The shape depends on `σ` alone.","_n":"3mc36","_k":"a46646f5"},{"t":"“R’s peak is twice as high.”","why":"The total area must stay 1. A wider curve has to be lower: doubling `σ` halves the peak.",
