.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}

.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 34: Pattern spotter (D11 scatter tool + strength meter), Match the story stations, Read the plot (N8), task.
   Dots --pen; meter needle --ink; outlier ring --hi (plan §5). */
/* radioGroup (from MDM4U 19 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled,.rg.seg button:disabled{opacity:.45;cursor:not-allowed}

/* Pattern spotter */
.sp-panel{border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 10px;background:var(--sheet)}
.sp-sh{margin:0 0 8px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.sp-acts{margin:0 0 8px}
.sp-acts .btn[hidden]{display:none}
.sp-zoom{margin:6px 0 0}
.sp-how{margin:8px 0 0}
.sp-msg{min-height:1.2em;margin:6px 0 0}
.sp-q{font-weight:700;color:var(--ink-2)}
.sp-note{margin:6px 0 0}
.sp-setup{margin-left:6px;vertical-align:baseline}

/* strength meter */
.sp-mbox{margin:10px 0 0}
.sp-meter{max-width:520px}
.sp-mbar{position:relative;display:flex;height:30px;border:1.5px solid var(--ink-2);border-radius:6px;overflow:visible;background:var(--sheet)}
.sp-ms{display:flex;align-items:center;justify-content:center;font:600 .8rem var(--font-ui);color:var(--ink-2)}
.sp-ms1{width:33%}
.sp-ms2{width:34%;border-left:1.5px solid var(--rule);border-right:1.5px solid var(--rule)}
.sp-ms3{width:33%;background:var(--hi-soft)}
.sp-needle{position:absolute;top:-7px;bottom:-7px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .55s ease}
.sp-needle[hidden]{display:none}
.sp-rm .sp-needle{transition:none}
@media (prefers-reduced-motion:reduce){.sp-needle{transition:none}}
.sp-mread{margin:6px 0 0;font-size:.95rem}

/* Match the story */
.st-body{margin-top:6px}
.st-card0{border:1.5px solid var(--rule);border-radius:10px;padding:12px;background:var(--sheet)}
.st-lab{margin:0 0 8px;font:700 .8rem var(--font-ui);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.st-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 12px}
@media (max-width:720px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st-fig{margin:0}
.st-fig figcaption{text-align:center;font-weight:700;font-size:.9rem;margin-top:2px}
.st-cards{display:grid;gap:8px}
.st-card{border-top:1px solid var(--rule);padding:8px 0 2px}
.st-story{margin:0 0 6px;font-weight:700}
.st-picks{display:flex;flex-wrap:wrap;gap:6px}
.st-pk{min-width:40px;min-height:36px}
.st-pk[aria-pressed="true"],.st-lqb[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);opacity:1}
.st-dt{margin:10px 0 4px}
.st-sb{border-top:1px solid var(--rule);padding:10px 0}
.st-sbrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:start}
@media (max-width:720px){.st-sbrow{grid-template-columns:1fr}}
.sp-sent{line-height:2.4;margin:0 0 6px}
.sp-blank .rg-wrap{display:inline-flex;margin:0 2px;vertical-align:middle}
.sp-blank .rg.chips{gap:4px}
.sp-blank .rg.chips button{min-height:30px;padding:.15em .65em;font-size:.88rem}
.st-lq{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.st-lqb{white-space:normal;text-align:left;min-height:40px}
.sp-tick{color:var(--green);font-weight:700}

/* Read the plot: tappable points (N8) */
.sp-rp{margin:4px 0 12px;max-width:560px}
.sp-rpw{position:relative}
.sp-pt{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid transparent;background:transparent;padding:0;cursor:pointer}
.sp-pt:hover:not(:disabled),.sp-pt:focus-visible{border-color:var(--ink)}
.sp-pt:disabled{cursor:default}
.sp-chips{display:flex;flex-wrap:wrap;gap:8px}
.sp-chips .chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);opacity:1}

/* task */
.sp-conds{margin:6px 0 8px 1.2em;padding:0}
.sp-tin .rg-wrap{margin-bottom:8px}
.sp-tin .rg-lab{min-width:4.6em}

</style>

ots to real contexts and describe the relationship in words without claiming cause."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Plotting points","goal":1,"prompt":"Which point is 3 units right of the origin and 5 units up?","options":[{"t":"(3, 5)","why":"\u003ci>x\u003c/i> first, then \u003ci>y\u003c/i>.","_n":"0fe7","_k":"37d5bf66"},{"t":"(5, 3)","why":"That swaps the order. The first coordinate is horizontal.","_n":"1017","_k":"9c636326"},{"t":"(3, −5)","why":"Check the sign: up is positive.","_n":"2007","_k":"58784438"},{"t":"(−3, 5)","why":"Check the sign: right is positive.","_n":"3fb7","_k":"77b017f1"}],"hints":["Ordered pairs are (\u003ci>x\u003c/i>, \u003ci>y\u003c/i>).","Right 3 is \u003ci>x\u003c/i> = 3.","(3, 5)."]},{"id":"w2","skill":"Plotting points","goal":1,"prompt":"A student studied 2 h and scored 64%. As a point (hours, mark), it is…","options":[{"t":"(2, 0.64)","why":"Use the units given: percent.","_n":"4fa7","_k":"b3f8f5a9"},{"t":"(2, 64)","why":"Hours on \u003ci>x\u003c/i>, mark on \u003ci>y\u003c/i>.","_n":"5fd7","_k":"f88c27b6"},{"t":"(64, 64)","why":"Each coordinate is a different variable.","_n":"6fc7","_k":"aa9d6609"},{"t":"(64, 2)","why":"That reverses the pair. The order matches (hours, mark).","_n":"7f77","_k":"4394ce38"}],"hints":["The order matches (hours, mark).","\u003ci>x\u003c/i> = 2.","(2, 64)."]},{"id":"w3","skill":"Sign of a slope","goal":2,"prompt":"A line falls from left to right. Its slope is…","options":[{"t":"positive","why":"That’s a line that rises.","_n":"8f67","_k":"dead3c96"},{"t":"zero","why":"That’s a horizontal line.","_n":"9496","_k":"6aef364d"},{"t":"negative","why":"\u003ci>y\u003c/i> decreases as \u003ci>x\u003c/i> increases.","_n":"a4a6","_k":"6acdc85a"},{"t":"undefined","why":"That’s a vertical line.","_n":"b4b6","_k":"06ec66dd"}],"hints":["Read left to right.","Going down means \u003ci>y\u003c/i> decreases.","Negative."]},{"id":"w4","skill":"Sign of a slope","goal":2,"prompt":"Which pair of points gives a positive slope?","options":[{"t":"(1, 8) and (4, 2)","why":"\u003ci>y\u003c/i> decreases.","_n":"c4c6","_k":"c282fd65"},{"t":"(2, 1) and (2, 6)","why":"That’s a vertical line.","_n":"d456","_k":"9f6d9a00"},{"t":"(1, 2) and (4, 8)","why":"Both coordinates increase.","_n":"e466","_k":"02effe35"},{"t":"(1, 5) and (4, 5)","why":"That’s a horizontal line.","_n":"f476","_k":"84654450"}],"hints":["Slope = rise ÷ run.","Look for \u003ci>y\u003c/i> increasing as \u003ci>x\u003c/i> increases.","(1, 2) and (4, 8)."]},{"id":"w5","skill":"Variables in context","goal":1,"prompt":"In “the amount of fertilizer and the height of tomato plants”, which variable responds to the other?","options":[{"t":"Fertilizer amount","why":"The amount is chosen; it doesn’t respond.","_n":"g486","_k":"e8c20e7e"},{"t":"Plant height","why":"Height may depend on fertilizer.","_n":"h516","_k":"7571d0c4"},{"t":"Neither","why":"Height plausibly responds.","_n":"i526","_k":"9f0a6749"},{"t":"Both equally","why":"One is chosen, the other measured.","_n":"j5b6","_k":"ef512e16"}],"hints":["Which is chosen and which is measured?","Fertilizer is chosen.","Height responds."]},{"id":"w6","skill":"Variables in context","goal":5,"prompt":"Which pair of variables could be shown on a scatter plot?","options":[{"t":"Favourite colour and eye colour","why":"Both are categorical.","_n":"k5a6","_k":"4d633180"},{"t":"Arm span (cm) and height (cm) of 20 students","why":"Two numerical measurements on each student.","_n":"l5d6","_k":"8144fabd"},{"t":"Number of students in each grade","why":"That’s one variable.","_n":"m5c6","_k":"7127c688"},{"t":"Monthly rainfall for one city","why":"One variable over time: a line graph.","_n":"n576","_k":"dcf4010b"}],"hints":["A scatter plot needs two numerical variables measured on the same individuals.","Look for “and” with two measurements.","Arm span and height."]}],"refreshers":{"Plotting points":"(\u003ci>x\u003c/i>, \u003ci>y\u003c/i>): horizontal first, vertical second. In context, (independent, dependent).","Sign of a slope":"Rising left to right means positive; falling means negative; level means zero.","Variables in context":"The independent variable is chosen or comes first; the dependent variable responds. Both must be numerical for a scatter plot."}}},"explore":{"heading":"Pattern spotter","intro":"Pick a data set, check the axes, then describe the pattern. Drag points to see what changes the strength, and what doesn’t.","predIntro":"Make a prediction first. Then the scatter tool will show you what really happens.","predictions":[{"id":"p1","start":{"ds":"d1","hide":["dir","r","form"]},"prompt":"D1. What is the direction?","options":[{"t":"Can’t tell without a line","_n":"o566","_k":"1d13137f"},{"t":"Positive","_n":"p596","_k":"0fd63ed4"},{"t":"None","_n":"q586","_k":"8d58869b"},{"t":"Negative","_n":"r536","_k":"8e61148b"}],"explain":"More hours go with higher marks."},{"id":"p2","start":{"ds":"d1","hide":[]},"prompt":"D1. Drag the point (4, 80) down to (4, 50). What happens to the strength m&#101;ter?","options":[{"t":"It becomes negative","_n":"s526","_k":"b5f71b67"},{"t":"It rises","_n":"t556","_k":"32e8d49f"},{"t":"It drops from strong to moderate","_n":"u566","_k":"06f34fb6"},{"t":"It stays strong","_n":"v536","_k":"1c92ce57"}],"explain":"One point far from the pattern weakens the correlation."},{"id":"p3","start":{"ds":"d2","hide":[]},"prompt":"D2. Stretch the \u003ci>y\u003c/i>-axis ×3 so the pattern looks much steeper. Does the strength change?","options":[{"t":"It flips direction","_n":"w546","_k":"c3dc3dc5"},{"t":"Yes, it gets weaker","_n":"x596","_k":"f1ee74ef"},{"t":"No","_n":"y5a6","_k":"39e042c1"},{"t":"Yes, it gets stronger","_n":"z576","_k":"2ace8eb7"}],"explain":"Stretching the axis changes the picture, not the data."},{"id":"p4","start":{"ds":"d4","hide":["form"]},"prompt":"D4. The m&#101;ter reads weak (\u003ci>r\u003c/i> = 0.00). Is there a relationship between speed and fuel use?","options":[{"t":"A strong negative one","_n":"10586","_k":"bdef7b77"},{"t":"No relationship","_n":"114d6","_k":"80ade35d"},{"t":"A weak linear one","_n":"124e6","_k":"d1cf1b47"},{"t":"Yes: a strong curved one","_n":"13d76","_k":"53089833"}],"explain":"The m&#101;ter only measures straight-line patterns. Fuel use is lowest around 70 km/h and rises on both sides."}],"chalIntro":"Use the scatter tool to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"D2: put the variables on the correct axes. \u003cbutton type=\"button\" class=\"btn ghost sm sp-setup\" data-sp-setup=\"tc1\">Start with the axes swapped\u003c/button>","why":"Temperature is on \u003ci>x\u003c/i> and cups sold on \u003ci>y\u003c/i>: sales respond to the temperature.","hints":["Which one could affect the other?","The weather comes first.","Temperature on \u003ci>x\u003c/i>."]},{"id":"tc2","goal":3,"prompt":"D3 (no pattern): drag the points to make a \u003cstrong>strong negative\u003c/strong> pattern. \u003cbutton type=\"button\" class=\"btn ghost sm sp-setup\" data-sp-setup=\"tc2\">Load D3\u003c/button>","why":"All 8 points now hug a falling line, so \u003ci>r\u003c/i> ≤ −0.67: strong and negative.","hints":["Higher shoe sizes need lower marks.","Line the points up roughly along a falling line.","Keep every point close to that line."]},{"id":"tc3","goal":3,"stretch":true,"prompt":"Custom grid: place 6 points so the m&#101;ter reads \u003cstrong>weak\u003c/strong> (|\u003ci>r\u003c/i>| \u003c 0.33) but the points follow a clear curved pattern. \u003cbutton type=\"button\" class=\"btn ghost sm sp-setup\" data-sp-setup=\"tc3\">Open an empty Custom grid\u003c/button>","why":"A U (or an upside-down U) rises as much as it falls, so the straight-line measure cancels out, yet the points hug a curve: a strong relationship that isn’t linear.","hints":["\u003ci>r\u003c/i> cancels out when the pattern rises as much as it falls.","Make a U or an upside-down U.","Mirror the points around the middle of the grid."]}]},"part3":{"slug":"stories","name":"Stories","heading":"Match the story","intro":"Six stories, six scatter plots. Match each story to its plot, write two of the relationships in words, then decide what a pattern can and can’t tell you. Every plot shows model data.","quickCheck":{"title":"Stories quick check","summary":"Stories quick check","items":[{"id":"q1","goal":2,"prompt":"Car age vs price: direction?","choices":[{"t":"Curved","fb":"Older cars sell for less. (Curved is a form, not a direction.)","_n":"14d66","_k":"5fe0291e"},{"t":"None","fb":"Older cars sell for less.","_n":"15d56","_k":"2b9c8dfc"},{"t":"Negative","fb":"Right. Older cars sell for less.","_n":"16d46","_k":"63f17ca9"},{"t":"Positive","fb":"Older cars sell for less.","_n":"17db6","_k":"b1d9de4d"}]},{"id":"q2","goal":3,"prompt":"Birth month vs height: strength?","choices":[{"t":"Perfect","fb":"There’s no reason height follows birth month.","_n":"18da6","_k":"da52b561"},{"t":"Moderate","fb":"There’s no reason height follows birth month.","_n":"19d96","_k":"86fca18c"},{"t":"Strong","fb":"There’s no reason height follows birth month.","_n":"1ad86","_k":"48d053b1"},{"t":"No correlation","fb":"Right. There’s no reason height follows birth month.","_n":"1bcf6","_k":"80dd1e0e"}]},{"id":"q3","goal":3,"prompt":"Daylight hours across the year: form?","choices":[{"t":"Random","fb":"Daylight rises then falls.","_n":"1cce6","_k":"2a09045b"},{"t":"Linear","fb":"Daylight rises then falls.","_n":"1d515","_k":"eb2226c3"},{"t":"Curved","fb":"Right. Daylight rises then falls.","_n":"1e525","_k":"ae27a1ee"},{"t":"None","fb":"Daylight rises then falls.","_n":"1f535","_k":"6c440217"}]},{"id":"q4","goal":5,"prompt":"Ice cream and sunburn rise together. This shows…","choices":[{"t":"an association","fb":"Right. Both rise in hot, sunny weather.","_n":"1g545","_k":"c253ebde"},{"t":"that sunburn causes ice cream sales","fb":"Both rise in hot, sunny weather. A scatter plot shows that two variables move together, not why.","_n":"1h555","_k":"5c47c483"},{"t":"nothing","fb":"Both rise in hot, sunny weather: they move together.","_n":"1i565","_k":"8cc4ee09"},{"t":"that ice cream causes sunburn","fb":"Both rise in hot, sunny weather. A scatter plot shows that two variables move together, not why.","_n":"1j575","_k":"8c893fbf"}]}]}},"practice":{"activities":[{"id":"ctx","type":"match","title":"Context ↔ description","summary":"Context ↔ description","goal":[2,3,5],"instruction":"Match each context (model data) with the description of its scatter plot.","leftTitle":"Context (model data)","rightTitle":"Description","left":[{"id":"l1","t":"Outdoor temperature vs heating bill","goal":[2,3],"why":"Colder days mean bigger bills, and the bill follows the temperature closely."},{"id":"l2","t":"Hours of sleep vs number of daydreams in class","goal":[2,3],"why":"More sleep tends to go with fewer daydreams, but loosely."},{"id":"l3","t":"Distance driven vs fuel used","goal":[2,3],"why":"Fuel used rises steadily with distance: tight and straight."},{"id":"l4","t":"Phone number’s last digit vs height","goal":5,"why":"There’s no reason height follows a phone digit."},{"id":"l5","t":"Age vs reaction time across ages 10–80","goal":3,"why":"Reaction time is slower for children and seniors and fastest in between: a tight curve.","hints":["How do children, adults and seniors compare?","Slower, faster, then slower again.","A strong curved pattern."]},{"id":"l6","t":"Years of experience vs salary at one company","goal":[2,3],"why":"More experience tends to mean a higher salary, with a fair amount of spread."}],"right":[{"id":"r1","t":"Strong negative linear"},{"id":"r2","t":"Weak negative"},{"id":"r3","t":"Strong positive linear"},{"id":"r4","t":"No correlation"},{"id":"r5","t":"Strong curved (fast in the middle, slower at both ends)"},{"id":"r6","t":"Moderate positive"}],"_a":"S0AJVRsOEEYBQElGVQYQDhIQV0YVFl4HElhHFgoWHhZcVkdeG0YGFhxACVEbDhBGBUBJ removed, the strength…","choices":[{"t":"increases","_n":"1qc46","_k":"b29138e3"},{"t":"decreases","why":"Removing a point far from the pattern makes the rest look tighter.","_n":"1rc76","_k":"22edc9e4"},{"t":"stays the same","why":"Removing a point far from the pattern makes the rest look tighter.","_n":"1sc66","_k":"0f3d294c"}],"why":"Removing a point far from the pattern makes the rest look tighter."},{"id":"r5","goal":[3,4],"star":true,"prompt":"A ninth student has arm span 165 cm. Using the pattern (excluding the outlier), the best estimate of their height is about…","choices":[{"t":"140","_n":"1tc96","_k":"7a83ab50"},{"t":"150","_n":"1uc86","_k":"e911eaa0"},{"t":"166","_n":"1vcb6","_k":"972415de"},{"t":"180","_n":"1wca6","_k":"819bb76b"}],"wrongBy":{"140":"Too low: students near 165 cm are 160–170 cm tall.","150":"Too low: students near 165 cm are 160–170 cm tall.","180":"That’s far above the pattern near 165."},"why":"Students near 165 cm have heights of 160–170 cm, and the pattern passes about 166 cm at 165 cm."}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Jasper","goal":[1,3],"instruction":"Jasper made one mistake in each description. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"Describe plot X (points tightly along a gently rising line) and plot Y (points loosely scattered around a steeply rising line).","steps":["Both plots show a positive direction.","Both look linear.","Y is stronger because its pattern is steeper.","So Y’s variables are more closely related."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 rests on step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Stretch the axis and steepness changes; strength doesn’t.","_n":"1xdd6","_k":"a07076e8"},{"t":"They’re equally strong, because both are positive.","why":"Direction and strength are different things.","_n":"1yde6","_k":"cd1fa198"},{"t":"X is stronger, because its points hug the line more tightly; steepness doesn’t measure strength.","why":"Strength is how closely the points hug the pattern, not how steep it is.","_n":"1zdb6","_k":"e2ccf1df"},{"t":"Y is stronger, because it has more points.","why":"Count isn’t strength.","_n":"20dc6","_k":"d220f1d2"}],"hints":["What does strength measure?","How tightly the points follow the pattern.","X is tighter."]},{"id":"e2","goal":1,"task":"Make a scatter plot of 10 students’ hours of exercise and resting heart rate.","steps":["Hours of exercise goes on the \u003ci>x\u003c/i>-axis; heart rate on the \u003ci>y\u003c/i>-axis.","Plot each student as one point.","Join the points from left to right with line segments to show the trend.","Describe the shape of the joined line."],"_a":"Ag==","stepFb":["Step 1 is correct.","Step 2 is correct.","","Step 4 uses the joined line from step 3."],"fixes":[{"t":"Step 3 is correct.","why":"Each point is a separate student, so joining them invents a sequence.","_n":"21d96","_k":"8b3223d5"},{"t":"Join them in the order the data were collected.","why":"The order still means nothing.","_n":"22da6","_k":"440d06a2"},{"t":"Leave the points unjoined and describe the cloud: direction, form, strength and outliers.","why":"Each point stands alone, so describe the cloud, not a joined line.","_n":"23d76","_k":"93ce30ee"},{"t":"Swap the axes before joining.","why":"The problem is the joining.","_n":"24d86","_k":"560b5d51"}],"hints":["Is there an order to the students?","No: each point stands alone.","Don’t join; describe the cloud."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in Explore: the stray point, the stretched axis or the U-shaped data?"},{"id":"j2","q":"In your own words, what makes a correlation “strong”?"},{"id":"j3","q":"Explain to a friend how to describe a scatter plot in four parts."},{"id":"j4","q":"Which of the four parts is hardest for you to judge? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"A study looks at how study time affects test marks. Which variable goes on the \u003ci>x\u003c/i>-axis?","options":[{"t":"Test mark","why":"The mark responds to the study time.","_n":"25d56","_k":"1fd8d11d"},{"t":"Neither; use a line graph.","why":"A scatter plot fits two numerical variables.","_n":"26d66","_k":"423c3c5d"},{"t":"Either; it doesn’t matter.","why":"Convention puts the explanatory variable on \u003ci>x\u003c/i>.","_n":"27df5","_k":"95cef5d9"},{"t":"Study time","why":"It’s the explanatory variable.","_n":"28de5","_k":"96448ab2"}]},"b":{"prompt":"A study looks at how daily temperature affects ice cream sales. Which variable goes on the \u003ci>x\u003c/i>-axis?","options":[{"t":"Either; it doesn’t matter.","why":"Convention puts the explanatory variable on \u003ci>x\u003c/i>.","_n":"29dd5","_k":"4ad03205"},{"t":"Temperature","why":"Sales respond to the temperature, so temperature is the explanatory variable.","_n":"2adc5","_k":"ddab5f25"},{"t":"Neither; use a bar graph.","why":"A scatter plot fits two numerical variables.","_n":"2bdb5","_k":"9fe0d2bc"},{"t":"Ice cream sales","why":"Ask which variable responds to the other. The response goes on the \u003ci>y\u003c/i>-axis.","_n":"2cda5","_k":"7ce8e20a"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"As a car gets older, its resale value tends to drop. The direction of the relationship is…","options":[{"t":"positive","why":"Both would have to rise together.","_n":"2dd95","_k":"921668d5"},{"t":"weak.","why":"Weak is a strength, not a direction.","_n":"2ed85","_k":"5c96bb05"},{"t":"negative","why":"One rises as the other falls.","_n":"2fd75","_k":"0240385e"},{"t":"none, because value drops.","why":"Falling together with age is a negative relationship, not no relationship.","_n":"2gd65","_k":"63183339"}]},"b":{"prompt":"Taller students tend to have longer arm spans. The direction is…","options":[{"t":"positive","why":"Both rise together.","_n":"2hd95","_k":"bf12d35e"},{"t":"negative","why":"Both rise together, so the direction is positive.","_n":"2ida5","_k":"67d14cc4"},{"t":"none.","why":"Arm span tends to rise with height: that’s a relationship.","_n":"2jdb5","_k":"dd8dd9d4"},{"t":"strong.","why":"Strong is a strength, not a direction.","_n":"2kdc5","_k":"5bc26f9c"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"Points lie very close to a straight line that rises from left to right. Which description fits?","options":[{"t":"Weak positive linear","why":"Very close to a line means strong.","_n":"2ld55","_k":"f2d9d9f9"},{"t":"Strong negative linear","why":"It rises, so it’s positive.","_n":"2md65","_k":"5b634e07"},{"t":"Strong positive linear","why":"Very close to a rising straight line: strong, positive and linear.","_n":"2nd75","_k":"06062256"},{"t":"Strong nonlinear","why":"It’s a straight line.","_n":"2od85","_k":"4f5de313"}]},"b":{"prompt":"Points are scattered across the grid with no visible trend. Which description fits?","options":[{"t":"Weak negative linear","why":"There’s no downward trend.","_n":"2pd15","_k":"59892b61"},{"t":"Strong curved","why":"There’s no curve either.","_n":"2qd25","_k":"75392e7f"},{"t":"Strong positive linear","why":"There’s no upward trend.","_n":"2rfc4","_k":"3940e8dc"},{"t":"No correlation","why":"No visible trend means no correlation.","_n":"2sfd4","_k":"85c76191"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"A strong positive pattern has one point far below it. If that point is removed, the correlation becomes…","options":[{"t":"stronger","why":"The remaining points hug the line more tightly.","_n":"2tfe4","_k":"227b687f"},{"t":"unchanged","why":"One far point does affect the strength.","_n":"2uff4","_k":"dae0a432"},{"t":"weaker","why":"The far point was loosening the pattern, so removing it makes the rest tighter. One point far from the pattern can weaken (or fake) a correlation. Name it.","_n":"2vf84","_k":"335f0d93"},{"t":"negative","why":"Removing one low point doesn’t flip the direction.","_n":"2wf94","_k":"4c289bc7"}]},"b":{"prompt":"A new point is added far from an otherwise strong negative pattern. The correlation becomes…","options":[{"t":"positive","why":"One point doesn’t flip the direction of a strong pattern.","_n":"2xfa4","_k":"ca1e4e94"},{"t":"unchanged","why":"One far point does affect the strength.","_n":"2yfb4","_k":"68d26e62"},{"t":"weaker","why":"One point far from the pattern loosens it.","_n":"2zf44","_k":"43741700"},{"t":"stronger","why":"A point far from the pattern loosens it. One point far from the pattern can weaken (or fake) a correlation. Name it.","_n":"30f54","_k":"5ca743d7"}]}},{"id":"t2","cat":"T","goal":3,"a":{"prompt":"Plot X: points tightly along a gently rising line. Plot Y: points loosely scattered around a steeply rising line. Which shows the stronger correlation?","options":[{"t":"They’re equal.","why":"The tightness differs.","_n":"31024","_k":"04112c9b"},{"t":"X","why":"The points cluster more tightly around the line.","_n":"32014","_k":"fe1f5920"},{"t":"Y","why":"Steepness isn’t strength.","_n":"33004","_k":"4388c42b"},{"t":"We can’t compare positive plots.","why":"Strength compares across any plots.","_n":"34ff4","_k":"f0925868"}]},"b":{"prompt":"Plot P: points loosely scattered around a steeply falling line. Plot Q: points tightly along a gently falling line. Which shows the stronger correlation?","options":[{"t":"P","why":"Steepness isn’t strength.","_n":"35fe4","_k":"e0d3e386"},{"t":"Neither, because both are negative.","why":"Negative describes direction. It can be just as strong as positive.","_n":"36fd4","_k":"41087c88"},{"t":"Equal","why":"The tightness differs.","_n":"37fc4","_k":"d0e2a342"},{"t":"Q","why":"Q’s points cluster more tightly around the line.","_n":"38fb4","_k":"5b5fa1fb"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"The data (1, 10), (2, 5), (3, 2), (4, 1), (5, 2), (6, 5), (7, 10) are plotted. Which description is best?","options":[{"t":"A strong curved (U-shaped) relationship; a straight-line measure would be near 0","why":"The points hug a U exactly, so the relationship is strong, but the rise cancels the fall in a straight-line measure.","_n":"39fa4","_k":"f1f97be1"},{"t":"Strong negative linear.","why":"Only the first half falls.","_n":"3af94","_k":"6d7c5ade"},{"t":"Weak positive linear.","why":"There’s a clear pattern, but it’s not a line.","_n":"3b684","_k":"18e34928"},{"t":"No relationship, because the trend goes both ways.","why":"A tight curve is a strong relationship; it just isn’t linear.","_n":"3c694","_k":"4160e8e4"}]},"b":{"prompt":"The data (0, 64), (1, 32), (2, 16), (3, 8), (4, 4), (5, 2) are plotted. Which description is best?","options":[{"t":"Strong negative linear.","why":"The drops shrink, so it curves.","_n":"3d664","_k":"cf5d9a78"},{"t":"A strong negative curved pattern that levels off","why":"Each value halves.","_n":"3e674","_k":"2aba52bf"},{"t":"No relationship.","why":"A tight curve is a strong relationship; it just isn’t linear.","_n":"3f6c4","_k":"b95568ff"},{"t":"Strong positive curved.","why":"It falls.","_n":"3g6d4","_k":"31d656fd"}]}},{"id":"c1","cat":"C","goal":5,"a":{"prompt":"Which is the best description of a scatter plot of temperature (\u003ci>x\u003c/i>) vs hot chocolate sales (\u003ci>y\u003c/i>) whose points fall close to a straight line?","options":[{"t":"“Negative, so there’s no relationship.”","why":"Negative describes direction. It can be just as strong as positive.","_n":"3h6a4","_k":"d96c400b"},{"t":"“Strong negative linear: as the temperature rises, sales tend to fall steadily, with the points close to a line.”","why":"It names the direction, form and strength, and describes the pattern without claiming a cause.","_n":"3i6b4","_k":"f8bddfd2"},{"t":"“Warm weather causes people to stop drinking hot chocolate.”","why":"A plot shows association; the cause is a separate claim.","_n":"3j704","_k":"ed876a7b"},{"t":"“Steep, so it’s strong.”","why":"Strength is how closely the points hug the pattern, not how steep it is.","_n":"3k714","_k":"65c92ff3"}]},"b":{"prompt":"Which is the best description of a scatter plot of hours of practice (\u003ci>x\u003c/i>) vs free-throw percentage (\u003ci>y\u003c/i>) whose points rise loosely?","options":[{"t":"“Strong, because it rises.”","why":"Rising is the direction. Strength is how closely the points hug the pattern, not how steep it is.","_n":"3l6e5","_k":"869b0258"},{"t":"“Practice guarantees a higher percentage.”","why":"A scatter plot shows that two variables move together, not why.","_n":"3m6d5","_k":"f717418c"},{"t":"“No relationship, because the points are spread out.”","why":"Loose isn’t the same as none.","_n":"3n705","_k":"5168f78c"},{"t":"“Moderate positive linear: more practice tends to go with a higher percentage, but the points are fairly spread.”","why":"Loose but rising: moderate and positive, described without claiming a cause.","_n":"3o6f5","_k":"8742757f"}]}},{"id":"c2","cat":"C","goal":1,"a":{"prompt":"Why shouldn’t you join the points of a scatter plot with line segments?","options":[{"t":"“Each point is a separate individual; joining them suggests an order or sequence that doesn’t exist.”","why":"The points are individuals, not a sequence.","_n":"3p6a5","_k":"9f50bbcb"},{"t":"“You should join them, to show the trend.”","why":"Each point is a separate individual. The order of the points means nothing.","_n":"3q695","_k":"b5a60ca1"},{"t":"“Because only time-series data can have points.”","why":"Scatter plots also use points.","_n":"3r6c5","_k":"97e2ae88"},{"t":"“Because the line would be curved.”","why":"Shape isn’t the issue.","_n":"3s6b5","_k":"c7fb3c34"}]},"b":{"prompt":"Which graph best shows the relationship between two numerical variables measured on the same individuals?","options":[{"t":"A histogram","why":"Histograms show one variable.","_n":"3t765","_k":"076ebf1c"},{"t":"A circle graph","why":"That shows parts of a whole.","_n":"3u755","_k":"37e5a74a"},{"t":"A line graph joining the points","why":"Each point is a separate individual. The order of the points means nothing.","_n":"3v644","_k":"4184bd68"},{"t":"A scatter plot","why":"Each point is one individual’s pair of measurements.","_n":"3w654","_k":"103b1b2f"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Model data from a beach town show a strong positive association between the daily high temperature and the number of beachgoers. Which conclusion is best supported by the scatter plot alone?","options":[{"t":"“There’s no relationship, because some warm days were quiet.”","why":"A strong pattern can have exceptions.","_n":"3x664","_k":"965a823c"},{"t":"“Warmer days tend to have more beachgoers.”","why":"That states the association and nothing more.","_n":"3y674","_k":"751eeec3"},{"t":"“Heat causes beach crowds.”","why":"Likely, but a scatter plot alone doesn’t establish cause.","_n":"3z684","_k":"b91d76a0"},{"t":"“Beach crowds raise the temperature.”","why":"A scatter plot shows that two variables move together, not why.","_n":"40694","_k":"ea68ca0a"}]},"b":{"prompt":"Model data show ice cream sales and sunburn cases rising together over a summer. Which conclusion is best supported?","options":[{"t":"“They’re positively associated; hot, sunny weather may drive both.”","why":"They move together, and a third variable can explain both.","_n":"416a4","_k":"c4426efc"},{"t":"“Eating ice cream causes sunburn.”","why":"A scatter plot shows that two variables move together, not why.","_n":"426b4","_k":"ba85537b"},{"t":"“They’re unrelated.”","why":"They clearly move together.","_n":"436c4","_k":"4dccf60f"},{"t":"“Sunburn makes people buy ice cream.”","why":"A scatter plot shows that two variables move together, not why.","_n":"446d4","_k":"7806470b"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Model data: 10 students’ hours of practice vs free-throw percentage show a strong positive pattern, except for one student with 1 hour and 90%. Which description is best?","options":[{"t":"“No relationship, because of that student.”","why":"One student doesn’t erase a strong pattern. One point far from the pattern can weaken (or fake) a correlation. Name it.","_n":"456a4","_k":"aa6a5c43"},{"t":"“A strong positive association with one outlier: a student who shoots well despite little practice.”","why":"Describe the pattern and name the outlier.","_n":"46694","_k":"c0e604a7"},{"t":"“A strong negative relationship.”","why":"The rest rise.","_n":"47684","_k":"371d5dd8"},{"t":"“Remove the student and don’t mention them.”","why":"Report an outlier; don’t hide it.","_n":"48674","_k":"6e6200d4"}]},"b":{"prompt":"Model data: 12 households’ size vs weekly grocery bill show a strong positive pattern, except one 2-person household spending $600. Which description is best?","options":[{"t":"“Delete the household so the pattern looks cleaner.”","why":"Report outliers.","_n":"496e4","_k":"9c341b73"},{"t":"“A strong negative relationship.”","why":"The rest rise.","_n":"4a6d4","_k":"d5e69b62"},{"t":"“A strong positive association with one outlier: a small household with a very high bill.”","why":"Describe the pattern and name the outlier.","_n":"4b6c4","_k":"71a81435"},{"t":"“No relationship, because of that household.”","why":"One household doesn’t erase a strong pattern. One point far from the pattern can weaken (or fake) a correlation. Name it.","_n":"4c6b4","_k":"fd8d9386"}]}}]},"task":{"title":"Practice makes fewer mistakes","summary":"Practice makes fewer mistakes","statement":"\u003cp>Five students practised a piano piece for 1, 2, 3, 4 and 5 hours. Give each student one of the mistake counts 2, 4, 6, 8, 10 (each used once) so the scatter plot meets every condition. Can you find all the answers? \u003cspan class=\"mdm-model\">model data\u003c/span>\u003c/p>\u003col class=\"sp-conds\">\u003cli>The direction is negative.\u003c/li>\u003cli>The strength m&#101;ter reads strong.\u003c/li>\u003cli>The pattern isn’t a perfect straight line.\u003c/li>\u003cli>The student who practised 5 hours made the fewest mistakes.\u003c/li>\u003c/ol>\u003cp class=\"tiny muted\">Choosing a count that another student already has swaps the two cards.\u003c/p>","checks":["Negative direction","Strong","Not a perfect line","5 hours, fewest mistakes"],"tips":["More practice should generally mean fewer mistakes.","To be strong, the cards should mostly decrease from left to right.","If every card decreases (10, 8, 6, 4, 2), the line is perfect. Swap a neighbouring pair.","Put the 2 at 5 hours."],"explainPrompt":"Explain how you kept the pattern strong and negative without making it perfect.","vocab":"Use the words direction, strength, linear and outlier.","more":"There’s more than one answer. Can you find them all?","after3":"Every answer is “mostly decreasing” with the 2 at the end. One swap keeps the pattern strong; too many swaps drop it to moderate.","afterAt":8},"cards":[["Independent variable","The explanatory variable: on the \u003ci>x\u003c/i>-axis."],["Dependent variable","The response variable: on the \u003ci>y\u003c/i>-axis."],["Describing a scatter plot","Direction, form, strength, outliers."],["Positive direction","\u003ci>y\u003c/i> tends to rise as \u003ci>x\u003c/i> rises."],["Negative direction","\u003ci>y\u003c/i> tends to fall as \u003ci>x\u003c/i> rises. It can still be strong."],["Strength","How tightly the points follow the pattern, not the steepness."],["Nonlinear form","A curve. It can be a strong relationship even when the linear m&#101;ter reads weak."],["Outlier","A point far from the pattern; it can weaken or fake a correlation."],["Don’t join the dots","Each point is an individual; there is no order."],["Association ≠ cause","Variables moving together doesn’t show that one causes the other."]]}};</script>
