.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 17: hero, Given-that filter (table, D2 Venn, dice grid, D1 flip tree), Medical test puzzle, probability entry, task */
/* fade tokens: everything outside the condition fades to 20% (30% in dark mode so it stays visible) */
:root{--cp-fade:.2;--cp-veil:.8}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--cp-fade:.3;--cp-veil:.7} }
:root[data-theme="dark"]{--cp-fade:.3;--cp-veil:.7}

/* radioGroup (from MDM4U 05) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"],.rg.chips button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* @component D1 treeDiagram styles (from MDM4U 05) + dimmed branches outside a condition */
.d1-scroll{overflow:auto;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.d1.bare .d1-scroll{border:0;background:transparent;overflow:visible}
.d1-box{position:relative}
.d1-svg{position:absolute;left:0;top:0}
.d1-e{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.d1-dm{opacity:var(--cp-fade)}
.d1-hi{fill:none;stroke:var(--hi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.d1-in{position:absolute;left:0;top:0;right:0;bottom:0}
.d1-root{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
.d1-lab{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;padding:0 6px;border:1.5px solid var(--ink-2);border-radius:13px;background:var(--sheet);color:var(--ink);font:400 1rem/23px var(--font-math);text-align:center;white-space:nowrap}
.d1-lab.on{border:2px solid var(--sel-bd);background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);color:var(--ink);font-weight:600}
.d1-p{position:absolute;transform:translate(-50%,-50%);font:400 .85rem var(--font-math);color:var(--ink-2);background:var(--sheet);padding:0 2px;white-space:nowrap}
.d1-leaf{position:absolute;transform:translate(-50%,-50%);min-height:30px;min-width:32px;padding:0 .5em;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font:400 1rem/27px var(--font-math);white-space:nowrap}
.d1.right .d1-leaf{transform:translate(0,-50%)}
.d1-leaf.on{background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);border:2px solid var(--sel-bd);color:var(--ink);font-weight:700}
.d1-leaf small{font-size:.8em;color:var(--ink-2);font-family:var(--font-math)}
.d1-stage{position:absolute;transform:translateX(-50%);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.d1 .dim{opacity:var(--cp-fade)}
.d1-lab sub{font-size:.7em}

/* letters and marbles: red R (--red), blue B (--pen), always with the letter */
.cp-l{font:700 1em var(--font-ui)}.cp-l-r{color:var(--red)}.cp-l-b{color:var(--pen)}
.cp-mbs{display:inline-flex;flex-wrap:wrap;gap:3px;vertical-align:middle;margin-right:4px}
.cp-mb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;color:var(--sheet);font:700 .7rem var(--font-ui)}
.cp-mb-r{background:var(--red)}.cp-mb-b{background:var(--pen)}
.cp-bag{margin:0 0 8px}

/* Explore layout */
#cp-modes{margin-bottom:12px}
.cp-formula{margin:0 0 8px;min-height:3.2em}
.cp-formula p{margin:0;max-width:none;overflow-wrap:anywhere}
.cp-f1{font:400 1rem var(--font-math);color:var(--ink-2)}
.cp-f2{font:400 1.22rem/1.4 var(--font-math)}
.cp-formula .m,.cp-fbar .m{white-space:normal}
.cp-capw{font:400 .92rem var(--font-ui);color:var(--ink-2)}
.cp-q{font:700 1.05rem var(--font-math);color:var(--ink-2)}
.cp-cue{font-size:.92rem;margin:-2px 0 10px;padding:6px 10px;border-left:4px solid var(--hi);background:var(--paper);border-radius:4px}
.cp-acts{margin:10px 0 6px}
.cp-sub{font-size:.85rem;font-weight:700;color:var(--ink-2);margin:12px 0 6px}
.cp-rk{display:inline-grid;place-items:center;min-width:1.35em;height:1.35em;margin-left:.35em;border-radius:4px;color:var(--sheet);font:italic 700 .78rem var(--font-math);vertical-align:.05em}
.cp-rk-g{background:var(--ev-a)}.cp-rk-f{background:var(--ev-b)}
.rg.seg button[aria-checked="true"] .cp-rk{outline:1.5px solid var(--sheet)}
.cp-evs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 6px}
.cp-chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.cp-ev{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .8em;font-size:.92rem;min-height:36px}
.cp-ev:hover{border-color:var(--ink-2)}
.cp-ev.cp-isg{border:2px solid var(--ev-a);background:var(--ev-a-soft);font-weight:700}
.cp-ev.cp-isf{border:2px solid var(--ev-b);background:var(--ev-b-soft);font-weight:700}
.cp-ev sub{font-size:.7em}

/* fades (the condition keeps full colour) */
.cp-out{opacity:var(--cp-fade);transition:opacity .45s}
.cp-tw td,.cp-tw th,.cp-dice td{transition:opacity .45s,background-color .3s}

/* two-way table (Explore and task) */
table.cp-tw{border-collapse:collapse;margin:0 0 8px;font-size:.95rem}
table.cp-tw th,table.cp-tw td{border:1px solid var(--rule);padding:4px;text-align:center}
table.cp-tw td.cp-corner{border:0}
table.cp-tw thead th{font-size:.85rem;color:var(--ink-2)}
table.cp-tw tbody th{text-align:left}
.cp-tw .cp-tot,.cp-tw .cp-totr td{font:400 1.05rem var(--font-math);color:var(--ink-2);padding:6px 12px}
.cp-tw .cp-totr td,.cp-tw .cp-totr th{border-top:2px solid var(--ink)}
.cp-tw td.cp-den{outline:2.5px solid var(--ev-a);outline-offset:-3px;color:var(--ink);font-weight:700}
.cp-hb,.cp-cb{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-height:40px;min-width:44px;width:100%;padding:2px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);font-weight:700;font-size:.92rem;white-space:nowrap}
.cp-cb{font:400 1.12rem var(--font-math);min-width:64px}
.cp-hb:hover,.cp-cb:hover{border-color:var(--ink-2)}
.cp-hb.cp-isg,.cp-cb.cp-isg{border:2px solid var(--ev-a);background:var(--ev-a-soft)}
.cp-hb.cp-isf,.cp-cb.cp-isf{border:2px solid var(--ev-b);background:var(--ev-b-soft)}
.cp-tw td.cp-g .cp-cb{background:var(--ev-a-soft)}
.cp-tw td.cp-f .cp-cb{background:var(--ev-b-soft)}
.cp-tw td.cp-on .cp-cb{background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);border:2px solid var(--sel-bd);font-weight:700}

/* dice grid */
.cp-dwrap{max-width:100%}
table.cp-dice{border-collapse:separate;border-spacing:3px;margin:0 auto 6px}
table.cp-dice th{font:400 1rem var(--font-math);color:var(--ink);padding:2px 4px;min-width:26px}
td.cp-dcorner{font:700 .68rem/1.2 var(--font-ui);color:var(--ink-2);text-align:left}
td.cp-dcorner span{display:block;white-space:nowrap}
table.cp-dice td[data-at]{min-width:38px;height:34px;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);text-align:center;font:400 1rem var(--font-math);color:var(--ink)}
table.cp-dice td.cp-g{background:var(--ev-a-soft)}
table.cp-dice td.cp-f{background:var(--ev-b-soft);border-color:var(--ev-b)}
table.cp-dice td.cp-on{background:linear-gradient(var(--hi-soft),var(--hi-soft)),var(--sheet);border:2px solid var(--sel-bd);font-weight:700}

/* @component D2 vennDiagram, conditional version */
.cp-venn{max-width:460px;margin:0 auto 4px}
.cp-vsvg{display:block;width:100%;height:auto}
.cp-vu{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.cp-vfa{fill:var(--ev-a-soft)}.cp-vfb{fill:var(--ev-b-soft)}
.cp-voa{fill:none;stroke:var(--ev-a);stroke-width:2.5}.cp-vob{fill:none;stroke:var(--ev-b);stroke-width:2.5}
.cp-vhs{fill:var(--hi-soft)}
.cp-vhi{opacity:0;transition:opacity .35s}.cp-vhi.on{opacity:1}
.cp-vvs{fill:var(--sheet)}
.cp-vveil{opacity:0;transition:opacity .45s;pointer-events:none}.cp-vveil.on{opacity:var(--cp-veil)}
.cp-vl{font:italic 700 20px var(--font-math)}.cp-vla{fill:var(--ev-a)}.cp-vlb{fill:var(--ev-b)}
.cp-vs{font:italic 400 18px var(--font-math);fill:var(--ink-2)}
.cp-vn{font:400 22px var(--font-math);fill:var(--ink)}
.cp-vin{display:grid;gap:6px}
.cp-vrow{display:flex;align-items:center;gap:6px}
.cp-vlab{flex:0 0 5.6em;font-size:.9rem;font-weight:700}
.cp-vnum{width:4.2em;text-align:center;padding:.3em .4em}
.cp-step{min-width:40px;min-height:40px;font-size:1.1rem}
.numin.cp-bad,.cp-bad{border-color:var(--red)}

/* fraction bars */
.cp-fbar{margin-top:10px}
.cp-bl{margin:8px 0 3px;font-size:.98rem;max-width:none}
.cp-bar{position:relative;height:20px;border:2px solid var(--ev-a);border-radius:5px;background:var(--ev-a-soft);overflow:hidden}
.cp-bar i{display:block;height:100%;background:var(--hi);transition:width .5s}
.cp-bar.cp-bar2{height:12px;border:1.5px solid var(--ink-2);background:var(--sheet)}
.cp-bar.cp-bar2 i{background:var(--ev-b)}

/* switch (from MDM4U 05) and sliders */
.cp-switch{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:40px;cursor:pointer;font-size:.95rem}
.cp-switch input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.cp-track{position:relative;display:inline-block;width:44px;height:26px;border-radius:13px;background:var(--rule);border:1.5px solid var(--ink-2);flex:0 0 auto;transition:background .2s}
.cp-track::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.cp-switch input:checked + .cp-track{background:var(--pen);border-color:var(--pen)}
.cp-switch input:checked + .cp-track::after{left:20px}
.cp-switch input:focus-visible + .cp-track{outline:3px solid var(--hi);outline-offset:2px}
.cp-sl{margin:8px 0}

/* small tables inside questions */
table.vt.cp-qt{min-width:0;width:auto;margin:8px 0 2px}
.cp-data{margin:0 0 12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper)}
.cp-data .tbl-wrap{margin-bottom:6px}
.cp-dlab{margin:4px 0 6px}

/* probability entry */
.cp-qn{width:auto;min-width:28px;padding:0 7px;border-radius:14px}
.cp-prow{margin-top:8px}
.cp-prow label,.cp-plab{font-weight:700;min-width:0}
.cp-prow.cp-okp .numin{border-color:var(--green)}
.cp-prow.cp-badp .numin,.cp-prow.cp-badp .rg{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}

/* Part 3 */
.cp-model{padding:10px 14px;border:1.5px solid var(--rule);border-left:5px solid var(--p-c);border-radius:8px;background:var(--paper);max-width:none}
.cp3-st{margin:12px 0}
.cp3-s h3{margin-top:4px}
canvas.plot.cp3-dots{aspect-ratio:1/1;max-width:520px}
@media (max-width:560px){ canvas.plot.cp3-dots{aspect-ratio:8/5} }
.cp3-leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.cp3-k{display:inline-grid;place-items:center;width:14px;height:14px;margin-right:4px;vertical-align:-2px;font:700 14px/1 var(--font-ui);font-style:normal}
.cp3-kc{color:var(--p-c);border:1.5px solid var(--p-c)}
.cp3-kp{background:var(--hi)}
.cp3-kn{width:6px;height:6px;background:var(--ink-2);margin:0 8px 0 4px;vertical-align:1px}
.cp3-steps{margin:10px 0 8px;padding-left:1.4em;display:grid;gap:4px}
.cp3-steps .cp3-intro{list-style:none;margin-left:-1.4em;color:var(--ink-2)}
.cp3-ask{margin-top:10px;padding-top:8px;border-top:1px solid var(--rule)}
.cp3-ask .numrow{margin-top:4px}
.cp3-tl{font-family:var(--font-math)}
.cp3-tlab{margin:6px 0 0}
.cp3-qa{margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
#cp3-ans p{margin:8px 0 0}
.cp3-sl{margin:2px 0 10px}

/* task */
.cp-conds{margin:.4em 0 .8em;padding-left:1.4em}
.cp-tk td{padding:4px}
.numin.cp-tkin{width:4.2em;text-align:center;padding:.3em .4em}
.cp-tkh{margin:4px 0 6px}
.cp-tkkey{margin:2px 0 10px}

/* hero */
.cph{max-width:440px;margin:0 auto}
.cph-given{margin:0 0 6px;min-height:1.4em;font-weight:700;text-align:center}
.cph-svg{display:block;width:100%;height:auto}
.cph-lab{font:700 12px var(--font-ui);fill:var(--ink-2)}
.cph-p circle,.cph-p path{fill:none;stroke:var(--ink-2);stroke-width:1.3}
.cph-p.j circle,.cph-p.j path{fill:var(--ev-b);stroke:var(--ev-b)}
.cph-p{transition:opacity .6s}
.cph-hl{fill:var(--hi-soft);stroke:none;opacity:0;transition:opacity .6s}
.cph.s1 .cph-hl,.cph.s2 .cph-hl{opacity:1}
.cph.s1 .g11,.cph.s2 .nj{opacity:var(--cp-fade)}
.cph-key{display:flex;gap:14px;justify-content:center;margin:6px 0 0}
.cph-k{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink-2);margin-right:4px;vertical-align:-1px}
.cph-k.on{background:var(--ev-b);border-color:var(--ev-b)}

</style>

:"5"},{"nn":"33","slug":"histograms","title":"Frequency Distributions & Histograms","kind":"topic","group":"5"},{"nn":"34","slug":"scatter-plots","title":"Scatter Plots & Correlation","kind":"topic","group":"6"},{"nn":"35","slug":"pearson-r","title":"The Pearson Correlation Coefficient r","kind":"topic","group":"6"},{"nn":"36","slug":"linear-regression","title":"Linear Regression & Line of Best Fit","kind":"topic","group":"6"},{"nn":"37","slug":"residuals","title":"Residuals & Goodness of Fit","kind":"topic","group":"6"},{"nn":"38","slug":"causation","title":"Two-Variable Analysis & Causation","kind":"topic","group":"6"},{"nn":"39","slug":"culminating-investigation","title":"Culminating Data-Management Investigation","kind":"topic","group":"7"}]},"salt":"81eb8bbe","content":{"id":"17-conditional-probability","kind":"topic","title":"Conditional probability","topic":"Conditional Probability","readyTopic":"conditional probability","hero":{"eq":"`P(B | A)` `= P(A ∩ B) ÷ P(A)`","eqLabel":"P of B given A equals P of A and B, divided by P of A","eqSize":"sm","headline":"Knowing something changes the odds","text":"A \u003cstrong>conditional probability\u003c/strong> `P(B | A)` answers: \u003cem>if we know \u003ci>A\u003c/i> happened, how likely is \u003ci>B\u003c/i>?\u003c/em> Knowing \u003ci>A\u003c/i> throws away every outcome outside \u003ci>A\u003c/i>, so the \u003cstrong>condition\u003c/strong> becomes the new whole. Flip the question to `P(A | B)` and the answer can change completely.","fig":{"html":"\u003cdiv class=\"cph\" id=\"cph\" role=\"img\" aria-label=\"120 students in a grid: 60 in Grade 11 on top (18 with jobs) and 60 in Grade 12 below (30 with jobs). Given Grade 12, the top half fades: 30 of 60 have jobs, 1/2. Given has a job, the students without jobs fade instead: 30 of 48 are in Grade 12, 5/8.\">\u003cp class=\"cph-given\" id=\"cph-given\" aria-hidden=\"true\">\u003c/p>\u003cdiv class=\"cph-grid\" id=\"cph-grid\" aria-hidden=\"true\">\u003c/div>\u003cp class=\"cph-key tiny muted\" aria-hidden=\"true\">\u003cspan>\u003ci class=\"cph-k on\">\u003c/i>has a job\u003c/span>\u003cspan>\u003ci class=\"cph-k\">\u003c/i>no job\u003c/span>\u003c/p>\u003c/div>"}},"goals":["I can explain `P(B | A)` as a probability within the restricted sample space \u003ci>A\u003c/i>.","I can find conditional probabilities from two-way tables and Venn diagrams.","I can use `P(B | A) = P(A ∩ B) ÷ P(A)` and the multiplication rule `P(A ∩ B) = P(A) × P(B | A)`.","I can use tree diagrams for dependent events, including “reversing” a tree to find \u003ci>P\u003c/i>(first | second).","I can tell `P(B | A)` from `P(A | B)` and use conditional probability to test independence.","I can solve and explain problems in context (screening tests, quality control) and account for base rates."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Two-way tables","goal":2,"prompt":"From the table, what is \u003ci>P\u003c/i>(a randomly chosen student is in Grade 12 \u003cstrong>and\u003c/strong> has a job)?\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"vt cp-qt\">\u003ccaption class=\"vh\">Students by grade and part-time job\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003c/th>\u003cth scope=\"col\">Job\u003c/th>\u003cth scope=\"col\">No job\u003c/th>\u003cth scope=\"col\">Total\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Grade 11\u003c/th>\u003ctd>18\u003c/td>\u003ctd>42\u003c/td>\u003ctd>60\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Grade 12\u003c/th>\u003ctd>30\u003c/td>\u003ctd>30\u003c/td>\u003ctd>60\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Total\u003c/th>\u003ctd>48\u003c/td>\u003ctd>72\u003c/td>\u003ctd>120\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","options":[{"t":"`1/4`","why":"30 of all 120 students.","_n":"0cce","_k":"607eee60"},{"t":"`2/5`","why":"48/120 counts job-holders only. That ignores the grade.","_n":"1c9e","_k":"98977d68"},{"t":"`1/2`","why":"30/60 divides by Grade 12. That’s “given Grade 12”.","_n":"2cae","_k":"94e0796f"},{"t":"`5/8`","why":"30/48 divides by job-holders. “And” is a share of everyone.","_n":"3c7e","_k":"e8ff7620"}],"hints":["Which cell is “Grade 12 and job”?","30.","`30/120 = 1/4`."]},{"id":"w2","skill":"Two-way tables","goal":2,"prompt":"How many students have no job?\u003cdiv class=\"tbl-wrap\">\u003ctable class=\"vt cp-qt\">\u003ccaption class=\"vh\">Students by grade and part-time job\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">\u003c/th>\u003cth scope=\"col\">Job\u003c/th>\u003cth scope=\"col\">No job\u003c/th>\u003cth scope=\"col\">Total\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Grade 11\u003c/th>\u003ctd>18\u003c/td>\u003ctd>42\u003c/td>\u003ctd>60\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Grade 12\u003c/th>\u003ctd>30\u003c/td>\u003ctd>30\u003c/td>\u003ctd>60\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Total\u003c/th>\u003ctd>48\u003c/td>\u003ctd>72\u003c/td>\u003ctd>120\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","options":[{"t":"30","why":"That’s Grade 12 only. Add both grades.","_n":"4c8e","_k":"c69568a4"},{"t":"42","why":"That’s Grade 11 only. Add both grades.","_n":"5c5e","_k":"99a784c8"},{"t":"48","why":"That’s the “Job” total.","_n":"6c6e","_k":"1ece702c"},{"t":"72","why":"The “No job” column total.","_n":"7d3e","_k":"612f7156"}],"hints":["Find the column.","42 + 30.","72."]},{"id":"w3","skill":"Tree diagrams","goal":4,"prompt":"A bag holds 3 red and 2 blue marbles. Two are drawn \u003cstrong>with\u003c/strong> replacement. What is \u003ci>P\u003c/i>(red, then red)?","options":[{"t":"`3/10`","why":"`3/5 × 2/4` uses without-replacement values. The first marble goes back.","_n":"8d4e","_k":"ed47f881"},{"t":"`9/25`","why":"`3/5 × 3/5`.","_n":"9553","_k":"ae422a2b"},{"t":"`3/5`","why":"That’s one draw. Two draws are needed.","_n":"a543","_k":"16ec41c1"},{"t":"`6/5`","why":"That adds. Multiply along a branch.","_n":"b573","_k":"9711cf59"}],"hints":["Multiply along the path.","`3/5` each time.","`9/25`."]},{"id":"w4","skill":"Tree diagrams","goal":3,"prompt":"On a tree, `P(A) = 0.4`, and the branch from \u003ci>A\u003c/i> to \u003ci>B\u003c/i> is 0.5. What is \u003ci>P\u003c/i>(\u003ci>A\u003c/i> and \u003ci>B\u003c/i>)?","options":[{"t":"0.2","why":"0.4 × 0.5.","_n":"c563","_k":"69148c2a"},{"t":"0.4","why":"That’s the first branch only.","_n":"d513","_k":"55ec3bad"},{"t":"0.5","why":"That’s the second branch only, `P(B | A)`. “And” is a share of everyone; “given” is a share of the condition.","_n":"e503","_k":"dccb6eb1"},{"t":"0.9","why":"That adds. Multiply along the path.","_n":"f533","_k":"adbb9329"}],"hints":["Multiply along the path.","0.4 × 0.5.","0.2."]},{"id":"w5","skill":"Independence","goal":5,"prompt":"\u003ci>A\u003c/i> and \u003ci>B\u003c/i> are independent, with `P(A) = 0.3` and `P(B) = 0.5`. What is `P(A ∩ B)`?","options":[{"t":"0","why":"Independent doesn’t mean no overlap. Mutually exclusive events can’t both happen; independent events don’t affect each other’s probability.","_n":"g523","_k":"991a4785"},{"t":"0.15","why":"Independent: multiply.","_n":"h5d3","_k":"cc85179f"},{"t":"0.65","why":"That’s `P(A ∪ B)`: “or”.","_n":"i5c3","_k":"cd44faf2"},{"t":"0.8","why":"That adds. Independent events multiply.","_n":"je32","_k":"ac919312"}],"hints":["Independent events: `P(A ∩ B)` = ?","`P(A) × P(B)`.","0.15."]},{"id":"w6","skill":"Venn regions","goal":2,"prompt":"In a class of 50: `n(A) = 20`, `n(B) = 15` and `n(A ∩ B) = 6`. How many are in \u003ci>A\u003c/i> only?","options":[{"t":"6","why":"That’s the overlap itself.","_n":"ke42","_k":"29571b78"},{"t":"14","why":"20 − 6.","_n":"le52","_k":"80a1b311"},{"t":"20","why":"That’s all of \u003ci>A\u003c/i>. That includes the overlap.","_n":"me62","_k":"ac3bec30"},{"t":"26","why":"That adds the overlap instead of taking it away.","_n":"ndf2","_k":"dc6ff2e8"}],"hints":["\u003ci>A\u003c/i> only excludes the overlap.","20 − 6.","14."]}],"refreshers":{"Two-way tables":"Each cell is an “and”. Row and column totals are the single events.","Tree diagrams":"Multiply along a path; add the paths that make the event.","Independence":"Independent means `P(A ∩ B) = P(A)P(B)`. It is not the same as “no overlap”.","Venn regions":"“\u003ci>A\u003c/i> only” = `n(A) - n(A ∩ B)`."}}},"explore":{"heading":"Given-that filter","intro":"Choose a condition and watch the sample space shrink. Then choose what you’re looking for.","predIntro":"Make a prediction first. Then the filter will show you what really happens.","predictions":[{"id":"p1","prompt":"Table: which is larger, \u003ci>P\u003c/i>(job | Grade 12) or \u003ci>P\u003c/i>(Grade 12 | job)?","options":[{"t":"\u003ci>P\u003c/i>(Grade 12 | job)","_n":"oe02","_k":"4e0e9233"},{"t":"They’re equal","_n":"pe12","_k":"e104998e"},{"t":"You can’t compare them","_n":"qe22","_k":"e58d96a8"},{"t":"\u003ci>P\u003c/i>(job | Grade 12)","_n":"rdb2","_k":"8cd455e0"}],"explain":"Different conditions mean different denominators: 60 Grade 12 students vs 48 job-holders. \u003ci>P\u003c/i>(job | Grade 12) = `30/60 = 1/2`, but \u003ci>P\u003c/i>(Grade 12 | job) = `30/48 = 5/8`."},{"id":"p2","prompt":"Tree (4 red and 2 blue, two draws without replacement): the first marble is not shown. Is \u003ci>P\u003c/i>(second marble red) smaller than, equal to, or larger than \u003ci>P\u003c/i>(first red) = `2/3`?","options":[{"t":"Equal: `2/3`","_n":"sdc2","_k":"c1cab96b"},{"t":"Larger","_n":"t693","_k":"286a397c"},{"t":"It depends on the first draw, so it can’t be found","_n":"u683","_k":"b7262500"},{"t":"Smaller, because one red is probably gone","_n":"v673","_k":"32843640"}],"explain":"Both second-draw paths are added: `2/5 + 4/15 = 2/3`. Averaged over both possible first draws, the second draw is just as likely to be red."},{"id":"p3","prompt":"Dice: given the first die is even, is \u003ci>P\u003c/i>(sum = 8) larger than, smaller than, or the same as without the condition?","options":[{"t":"It becomes 0","_n":"w663","_k":"c3b5ec0c"},{"t":"Smaller","_n":"x653","_k":"9d2c60c4"},{"t":"Larger","_n":"y643","_k":"cf47bfb3"},{"t":"The same","_n":"z633","_k":"472b6660"}],"explain":"3 of the remaining 18 cells sum to 8: `3/18 = 1/6`, up from `5/36`. The condition removed 2 of the 5 sum-8 cells but half of all cells."},{"id":"p4","prompt":"Dice: given the sum is 7, what is \u003ci>P\u003c/i>(first die is 6)?","options":[{"t":"`1/36`","_n":"10623","_k":"31b0861c"},{"t":"`1/11`","_n":"11613","_k":"a777ac8e"},{"t":"`1/7`","_n":"12603","_k":"cd81497c"},{"t":"`1/6`","_n":"13d72","_k":"b7c4af58"}],"explain":"6 cells sum to 7, and 1 of them has first die 6. `1/6` equals \u003ci>P\u003c/i>(first die is 6), so for a sum of 7 these events are independent."}],"chalIntro":"Set up the filter, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[1,2],"prompt":"Table: set the filter to show \u003ci>P\u003c/i>(no job | Grade 11).","why":"Given Grade 11, only those 60 students count, and 42 of them have no job: `42/60 = 7/10`.","hints":["The condition goes after the bar.","Tap the Grade 11 row as “Given”.","`42/60 = 0.7`."]},{"id":"tc2","goal":2,"prompt":"Venn: set the region counts so that `n(A ∩ B) = 4`, `P(A | B) = 1/3` and `P(B | A) = 1/2`.","why":"`n(B) = 4 + 8 = 12`, so `P(A | B) = 4/12 = 1/3`; `n(A) = 4 + 4 = 8`, so `P(B | A) = 4/8 = 1/2`. The “neither” count doesn’t matter.","hints":["`P(A | B) = 4 ÷ n(B) = 1/3`. What is `n(B)`?","`n(B) = 12` and `n(A) = 8`.","\u003ci>B\u003c/i> only = 12 − 4 = 8; \u003ci>A\u003c/i> only = 8 − 4 = 4."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Tree: unlock the bag. Set `r` red and `b` blue marbles (`r` from 1 to 20, `b` from 1 to 10) so that drawing two \u003cstrong>without\u003c/strong> replacement gives \u003ci>P\u003c/i>(both red) = `1/2` exactly.","why":"Two bags work: 3 red and 1 blue (`3/4 × 2/3 = 1/2`), and 15 red and 6 blue (`15/21 × 14/20 = 1/2`). They’re the only two in range.","hints":["\u003ci>P\u003c/i>(both red) = `r/(r + b) × (r - 1)/(r + b - 1)`.","Try `b = 1`: you need `(r - 1)/(r + 1) = 1/2`.","`r = 3`, `b = 1`: `3/4 × 2/3 = 1/2`. (A second answer exists: 15 red and 6 blue.)"]}]},"part3":{"slug":"tests","name":"Tests","heading":"Medical test puzzle","intro":"A screening test can be very good at finding a condition and still give mostly false alarms. Work through the three stations, then answer the quick check.","model":"\u003cstrong>The model\u003c/strong> (a model, not medical data): a condition affects \u003cstrong>2%\u003c/strong> of a population. A screening test detects \u003cstrong>90%\u003c/strong> of people who have it. It gives a false positive for \u003cstrong>5%\u003c/strong> of people who don’t.","stations":[{"id":"s1","chip":"1. 10 000 people","title":"Station 1: 10 000 people","text":"Step through how the test sorts 10 000 people. Then find out who tested positive.","steps":["200 have the condition.","180 of them test positive.","9800 don’t have it.","490 of them test positive anyway."],"ask":"\u003ci>P\u003c/i>(condition | positive) =","answerNote":"`180/670 ≈ 0.27`. Only 180 of the 670 positives have the condition."},{"id":"s2","chip":"2. The tree, and its flip","title":"Station 2: the tree, and its flip","text":"The same model as a tree: condition first, then the test result. Flip the tree to put the test result first."},{"id":"s3","chip":"3. Change the base rate","title":"Station 3: change the base rate","text":"The \u003cstrong>base rate\u003c/strong> is how common the condition is before testing. Slide it and watch \u003ci>P\u003c/i>(condition | positive).","question":"When does a positive result become convincing?","reply":"When true positives outnumber false positives. With this test that needs a base rate of about 6% or more: at 5%, \u003ci>P\u003c/i>(condition | positive) ≈ 0.49; at 6%, it’s about 0.53. For a rare condition, the 5% false positives from the huge group
