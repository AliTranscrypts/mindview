.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 13: hero, Triangle explorer (D5 Pascal's triangle explorer), Paths and Pascal (D5 grid labels, Galton board), Hockey stick hunt */
/* radioGroup (from MDM4U 08) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}

/* @component D5 pascalExplorer */
.pt-box{overflow-x:auto;overflow-y:hidden;padding:4px 2px 8px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper)}
.pt-in{position:relative;margin:0 auto}
.pt-hd{display:flex;justify-content:space-between;padding:0 4px 2px;font:700 .68rem var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.pt-row{position:relative;display:flex;justify-content:center;align-items:center;height:var(--rh);padding:0 var(--gr) 0 var(--gl)}
.pt-rl{position:absolute;left:1px;width:calc(var(--gl) - 5px);text-align:right;font:700 .74rem/1.5 var(--font-ui);color:var(--ink-2);border-radius:4px}
.pt-row.on .pt-rl{background:var(--hi);color:var(--hi-ink)}
.pt-rs{position:absolute;right:2px;width:calc(var(--gr) - 8px);text-align:right;font:700 .88rem var(--font-ui);color:var(--ink)}
.pt-row.on .pt-rs{background:var(--hi-soft);border-radius:4px}
.pt-c{position:relative;z-index:1;flex:0 0 auto;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:calc(var(--cw) - 2 * var(--cm,2px));height:calc(var(--rh) - 4px);margin:0 var(--cm,2px);padding:0;
  border:1.5px solid var(--ink-2);border-radius:7px;background:var(--sheet);color:var(--ink);font:700 var(--fs)/1 var(--font-ui);font-variant-numeric:tabular-nums;white-space:nowrap}
button.pt-c{cursor:pointer}
button.pt-c:hover{border-color:var(--pen)}
.pt-c.pt-sel{border-color:var(--pen);box-shadow:0 0 0 3px var(--pen)}
.pt-c.pt-mir{border:2px dashed var(--pen);box-shadow:0 0 0 2px var(--pen)}
.pt-c.pt-ab{background:color-mix(in srgb,var(--f3) 24%,var(--sheet));border:2.5px solid var(--f3)}
.pt-c.pt-rw,.pt-c.pt-dg,.pt-c.pt-fi,.pt-c.pt-hs{background:var(--hi-soft);border:2px solid var(--sel-bd)}
.pt-c.pt-bl{background:var(--sheet);border:2px solid var(--ink);outline:3px solid var(--ink);outline-offset:1px;font-weight:800;z-index:2}
.pt-c.pt-cur{box-shadow:0 0 0 3px var(--ink)}
.pt-c.pt-glow{background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink);animation:ptGlow .9s ease-in-out 2}
.pt-c.pt-od{background:var(--pen);border-color:var(--pen);color:var(--sheet)}
.pt-c.pt-ev{background:color-mix(in srgb,var(--ink-2) 20%,var(--sheet));border-color:color-mix(in srgb,var(--ink-2) 50%,var(--sheet))}
.pt-c.pt-od.pt-sel,.pt-c.pt-ev.pt-sel{box-shadow:0 0 0 3px var(--sheet),0 0 0 5.5px var(--ink)}
.pt-c.pt-dim{opacity:.4}
.pt-c.pt-q{border:2px dashed var(--sel-bd);color:var(--ink-2)}
.pt-c.pt-auto{border-style:dashed;color:var(--ink-2)}
.pt-c.pt-iw{border:2px dashed var(--pen);background:var(--sheet)}
.pt-c.pt-iw.pt-ok{border-style:solid;border-color:var(--green);background:var(--good-bg)}
.pt-c.pt-iw.pt-bad{border-style:solid;border-color:var(--red);background:var(--bad-bg)}
.pt-c.pt-iw.pt-ok::after,.pt-c.pt-iw.pt-bad::after{position:absolute;top:-9px;right:-6px;width:15px;height:15px;border-radius:50%;background:var(--sheet);font:700 .7rem/15px var(--font-ui);text-align:center}
.pt-c.pt-iw.pt-ok::after{content:"✓";color:var(--green)}
.pt-c.pt-iw.pt-bad::after{content:"✗";color:var(--red)}
.pt-inp{width:100%;height:100%;margin:0;padding:0;border:0;border-radius:5px;background:transparent;color:var(--ink);text-align:center;font:700 var(--fs)/1 var(--font-ui)}
.pt-symon .pt-row::after{content:"";position:absolute;top:-1px;bottom:-1px;left:calc(var(--gl) + (100% - var(--gl) - var(--gr)) / 2);border-left:2px dashed var(--ink-2);z-index:0;pointer-events:none}
.pt-new{animation:ptIn .6s both}
@keyframes ptIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes ptGlow{50%{box-shadow:0 0 0 7px var(--hi)}}

/* Explore layout */
.pt-top{margin-bottom:4px}
.pt-top .rg-wrap{margin-bottom:8px}
.pt-hsc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;margin-bottom:6px}
.pt-hsc .rg-wrap{margin:0}
.pt-pg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"graph graph" "ctrl read";gap:12px 28px;align-items:start}
.pt-gr{grid-area:graph;min-width:0}
.pt-ctl{grid-area:ctrl;min-width:0}
.pt-rd{grid-area:read;min-width:0}
@media (max-width:760px){ .pt-pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"} }
.pt-cap{font-size:clamp(1.2rem,3.4vw,1.75rem)}
.pt-cap strong{font-weight:700}
.pt-leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:8px 0 0;font-size:.88rem;color:var(--ink)}
.pt-leg .pt-lc{--cw:36px;--rh:28px;--fs:13px;margin:0 2px 0 6px}
.pt-leg .pt-lc:first-child{margin-left:0}
.pt-lline{display:inline-block;width:0;height:1.3em;border-left:2px dashed var(--ink-2);vertical-align:middle;margin:0 2px}
.pt-msg{margin:6px 0 0;min-height:1.3em}
.pt-how{margin:6px 0 0}
.pt-ctl .q-actions{margin:4px 0 0}
.pt-stp{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.pt-stl{min-width:6.6em;font-weight:700}
.pt-stb{min-width:42px;min-height:38px}
.pt-sto{min-width:1.6em;text-align:center;font:700 1.3rem var(--font-math)}

/* hero */
.pt-heq{display:inline-flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.pt-hmini{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font:700 .46em/1 var(--font-ui);font-style:normal}
.pt-hmr{display:flex;gap:3px}
.pt-hmc{min-width:1.9em;padding:.22em .12em;text-align:center;border:1.5px solid var(--ink-2);border-radius:5px;background:var(--sheet);color:var(--ink)}
.pt-hmc.ab{background:color-mix(in srgb,var(--f3) 24%,var(--sheet));border:2px solid var(--f3)}
.pt-hmc.hit{background:var(--hi);color:var(--hi-ink);border:2px solid var(--ink)}
.pt-hrule{display:inline-flex;flex-direction:column;align-items:flex-start;gap:.3em;font-size:.62em}
.pt-hex{display:inline-block;padding:.05em .35em;border-radius:6px;background:var(--hi-soft);border:1.5px solid var(--sel-bd)}
.pt-h{width:100%}
.pt-hsvg{display:block;width:100%;max-width:440px;height:auto;margin:0 auto}
.pt-hbx{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5;opacity:0;transition:opacity .35s}
.pt-hbx.hit{fill:var(--hi);stroke:var(--pen);stroke-width:3}
.pt-hn{font:700 16px var(--font-ui);fill:var(--ink);text-anchor:middle;dominant-baseline:central;opacity:0;transition:opacity .35s}
.pt-hn.hit{fill:var(--hi-ink)}
.pt-hbx.on,.pt-hn.on{opacity:1}
.pt-har{opacity:0;transition:opacity .25s}
.pt-har.on{opacity:1}
.pt-har line{stroke:var(--f3);stroke-width:2.5;stroke-linecap:round}
.pt-har path{fill:var(--f3)}
.pt-hlab{font:700 12px var(--font-ui);fill:var(--ink-2);opacity:0;transition:opacity .4s}
.pt-hlab.on{opacity:1}
.pt-hcl{font:700 15px var(--font-math);fill:var(--ink);text-anchor:middle;opacity:0;transition:opacity .5s}
.pt-hcl.on{opacity:1}

/* Part 3 */
.pq-tabs{margin-bottom:10px}
.pq-tick{color:var(--green);font-weight:700}
.pq-card{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 6px}
.pq-lab{font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.pq-name{font-size:1.15rem;font-weight:700}
.pq-task{margin:0 0 10px}
.pq-two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px 24px;align-items:start}
@media (max-width:760px){ .pq-two{grid-template-columns:minmax(0,1fr)} }
.pq-gcol .q-actions{margin:6px 0 4px}
.pq-h{margin:0 0 4px}
.pq-icol .q-actions{margin:4px 0 8px}
.pq-read{margin:4px 0 8px}
.pq-rw{font-weight:700;letter-spacing:.06em}
.pq-done{margin:10px 0 0}
.pq-chip{min-height:38px;font-weight:700}
.pq-chip[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.pq-chip[aria-pressed="true"]::before{content:"✓ "}
.pt-tilt{margin:12px 0 0}
.pt-tbox{padding-top:6px}

/* @component D5 gridPaths (label-the-grid version) */
.gl{position:relative;width:100%;margin:4px auto}
.gl-svg{display:block;width:100%;height:auto;overflow:visible}
.gl-lay{position:absolute;inset:0}
.gl-st{stroke:var(--rule);stroke-width:4;stroke-linecap:round}
.gl-bk{fill:none;stroke:var(--ink-2);stroke-width:4;stroke-linecap:round}
.gl-lab{font:700 18px var(--font-ui);fill:var(--ink)}
.gl-tag{font:700 12px var(--font-ui);fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.gl-v,.gl-in{position:absolute;box-sizing:border-box;width:44px;height:32px;margin:0;transform:translate(-50%,-50%);border-radius:8px;text-align:center;font:700 1rem var(--font-ui)}
.gl-v{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink-2);background:var(--sheet);color:var(--ink)}
.gl-v.given{border-style:dotted;color:var(--ink-2)}
.gl-v.ok{border:2px solid var(--green);background:var(--good-bg)}
.gl-v.blk{border:2px dashed var(--ink-2)}
.gl-v.fresh{animation:ptIn .45s both}
.gl-in{padding:0;border:2px dashed var(--pen);background:var(--sheet);color:var(--ink)}
.gl-in.blk{border-color:var(--ink-2)}
.gl-in.bad{border:2px solid var(--red);background:var(--bad-bg)}

/* @component galtonBoard */
.gb{width:100%;max-width:440px;margin:0 auto}
.gb-svg{display:block;width:100%;height:auto}
.gb-peg{fill:var(--ink-2)}
.gb-pc{font:700 10px var(--font-ui);fill:var(--ink);text-anchor:middle}
.gb-bc{font:700 11px var(--font-ui);fill:var(--ink-2);text-anchor:middle}
.gb-div{stroke:var(--ink-2);stroke-width:1.5}
.gb-bar{fill:var(--ev-a-soft);stroke:var(--pen);stroke-width:2}
.gb-th{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.gb-cnt{font:700 13px var(--font-ui);fill:var(--ink);text-anchor:middle}
.gb-lab{font:400 11px var(--font-ui);fill:var(--ink-2)}
.gb-ball{fill:var(--pen);stroke:var(--sheet);stroke-width:1.5}

/* task */
.pt-conds{margin:.4em 0 .8em;padding-left:1.4em}
.hh-in{margin:4px 0 12px}
.hh-pv .read{margin-top:8px}
@media (max-width:560px){ .pt-leg{font-size:.82rem} }
@media (max-width:560px){ .pt-rs{font-size:.8rem} .pt-hd{font-size:.6rem} }
.pt-rowtxt{word-spacing:.4em;white-space:nowrap}

n class=\"pt-hmc\">10\u003c/span>\u003cspan class=\"pt-hmc\">5\u003c/span>\u003cspan class=\"pt-hmc\">1\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"pt-hrule\">`C(n, r) = C(n - 1, r - 1) + C(n - 1, r)`\u003cspan class=\"pt-hex\">`10 = 4 + 6`\u003c/span>\u003c/span>\u003c/span>","eqLabel":"A small Pascal’s triangle, rows 0 to 5, beside the rule C of n, r equals C of n minus 1, r minus 1, plus C of n minus 1, r. In row 5, 10 equals 4 plus 6.","eqSize":"sm","headline":"Add the two above","text":"Start with 1. Each new entry is the \u003cstrong>sum of the two entries above it\u003c/strong>. The result is \u003cstrong>Pascal’s triangle\u003c/strong>, where row `n`, position `r` (both counted from \u003cstrong>0\u003c/strong>) is exactly \u003cstrong>`C(n, r)`\u003c/strong>. It hides patterns, and it counts routes on a grid.","fig":{"html":"\u003cdiv class=\"pt-h\" role=\"img\" aria-label=\"A single 1 appears, labelled row 0. Rows 1 to 6 grow downward. Each new entry is drawn by two short arrows from the entries above it, and their sum appears. Then the entry 15 in row 6 lights up with the label C of 6, 2.\">\u003csvg class=\"pt-hsvg\" id=\"pt-hsvg\" viewBox=\"0 0 360 262\" preserveAspectRatio=\"xMidYMid meet\" aria-hidden=\"true\" focusable=\"false\">\u003c/svg>\u003c/div>"}},"goals":["I can build rows of Pascal’s triangle by adding, and number rows and positions from 0.","I can read any entry as `C(n, r)` and find `C(n, r)` in the triangle.","I can describe patterns (symmetry, row sums, diagonals, odd and even) and explain them.","I can use the hockey-stick pattern to add a run of diagonal entries quickly.","I can count shortest routes on a grid, including grids with a blocked point.","I can use the triangle to solve problems in context (routes, selections of any size)."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Combinations","goal":2,"prompt":"Evaluate `C(6, 2)`.","options":[{"t":"12","why":"That’s 6 × 2. `C(6, 2) = (6 × 5)/2`.","_n":"0bf2","_k":"320a66e2"},{"t":"15","why":"`(6 × 5)/2`.","_n":"1c02","_k":"f77fcdf5"},{"t":"30","why":"That’s `P(6, 2)`. Divide by `2!` as well.","_n":"2c12","_k":"9aaa143c"},{"t":"36","why":"That’s `6^2`. `C(6, 2) = (6 × 5)/2`.","_n":"3ba2","_k":"4ce8eba2"}],"hints":["`C(n, 2) = n(n - 1)/2`.","6 × 5 = 30.","15."]},{"id":"w2","skill":"Combinations","goal":2,"prompt":"Evaluate `C(5, 0)`.","options":[{"t":"0","why":"Choosing nothing is one choice.","_n":"4bb2","_k":"65e517ba"},{"t":"1","why":"One way to choose nothing.","_n":"5bc2","_k":"80d6dbf1"},{"t":"5","why":"That’s `C(5, 1)`.","_n":"6bd2","_k":"e2a2b0ee"},{"t":"120","why":"That’s `5!`.","_n":"7c62","_k":"ccf7f9de"}],"hints":["`0! = 1`.","`5!/(0! 5!)`.","1."]},{"id":"w3","skill":"Arrangements with repeats","goal":5,"prompt":"How many different arrangements of the letters R R R U U are there?","options":[{"t":"6","why":"That’s 3 × 2. Arrangements of 3 R’s and 2 U’s: `5!/(3! 2!)`.","_n":"8c72","_k":"6b154404"},{"t":"10","why":"`5!/(3! 2!) = 10`.","_n":"9fd9","_k":"44feb147"},{"t":"32","why":"That’s `2^5`, which lets each letter be R or U freely. You have exactly 3 R’s and 2 U’s.","_n":"afc9","_k":"0b4b793b"},{"t":"120","why":"Swapping two R’s doesn’t make a new arrangement.","_n":"bfb9","_k":"11ba7561"}],"hints":["5 letters, 3 alike and 2 alike.","`5!/(3! × 2!)`.","120/12 = 10."]},{"id":"w4","skill":"Arrangements with repeats","goal":5,"prompt":"Which equals the number of arrangements of 4 R’s and 2 U’s?","options":[{"t":"4 × 2","why":"4 × 2 isn’t an arrangement count. A route is an arrangement of `a` R’s and `b` U’s: `C(a + b, b)`.","_n":"cfa9","_k":"5947345b"},{"t":"`P(6, 2)`","why":"Swapping the two U’s changes nothing.","_n":"df99","_k":"cfc535c0"},{"t":"`C(6, 2)`","why":"Choose the 2 places for the U’s.","_n":"ef89","_k":"08b15967"},{"t":"`6!`","why":"That treats all letters as different.","_n":"ff79","_k":"f1904bac"}],"hints":["Six slots; where do the U’s go?","Choose 2 of 6 slots.","`C(6, 2) = 15`."]},{"id":"w5","skill":"Powers of 2","goal":3,"prompt":"Evaluate `2^7`.","options":[{"t":"14","why":"That’s 2 × 7. `2^7` means 7 factors of 2.","_n":"gf69","_k":"d3009e38"},{"t":"49","why":"That’s `7^2`. `2^7` means 7 factors of 2.","_n":"hf59","_k":"3fa63468"},{"t":"128","why":"Double 7 times: 2, 4, 8, 16, 32, 64, 128.","_n":"if49","_k":"120879c7"},{"t":"256","why":"That’s `2^8`.","_n":"j639","_k":"50be38fc"}],"hints":["Double 7 times.","2, 4, 8, 16, 32, 64, …","128."]},{"id":"w6","skill":"Powers of 2","goal":3,"prompt":"A set has 5 items. How many selections (including none) are there?","options":[{"t":"10","why":"That’s 2 × 5. Each item is in or out: 2 × 2 × 2 × 2 × 2.","_n":"k649","_k":"54047c7a"},{"t":"25","why":"That’s `5^2`. Each item has 2 states: `2^5`.","_n":"l619","_k":"013f0140"},{"t":"31","why":"That forgets the empty selection.","_n":"m629","_k":"f4cef52a"},{"t":"32","why":"Each item is in or out: `2^5`.","_n":"n679","_k":"0848de07"}],"hints":["Each item has 2 states.","2 × 2 × 2 × 2 × 2.","32."]}],"refreshers":{"Combinations":"`C(n, r) = n!/[r!(n - r)!]`; `C(n, 0) = C(n, n) = 1`.","Arrangements with repeats":"Arrangements of `a` R’s and `b` U’s = `(a + b)!/(a! b!) = C(a + b, b)`.","Powers of 2":"`2^n` means `n` factors of 2: `2^5 = 32`, `2^10 = 1024`."}}},"explore":{"heading":"Triangle explorer","intro":"Build the triangle, tap any entry to see which combination it is, then switch on a pattern.","predIntro":"Make a prediction first. Then the triangle explorer will show you what really happens.","predictions":[{"id":"p1","start":{"mode":"pattern","pat":"sums","rows":4},"prompt":"What is the sum of row 5?","options":[{"t":"10","_n":"o689","_k":"32309602"},{"t":"25","_n":"p659","_k":"0fa257b0"},{"t":"31","_n":"q669","_k":"38089d72"},{"t":"32","_n":"r6b9","_k":"3714874e"}],"explain":"Each row sum doubles: 1, 2, 4, 8, 16, 32 = `2^5`. Row `n` sums to `2^n`."},{"id":"p2","start":{"mode":"pattern","pat":"hockey","rows":6,"hs":{"n":2,"r":2,"dir":"L","len":4}},"prompt":"The cells `C(2, 2)`, `C(3, 2)`, `C(4, 2)` and `C(5, 2)` are shaded (1, 3, 6, 10). Which entry equals their sum?","options":[{"t":"35","_n":"s6c9","_k":"3c109965"},{"t":"20, the entry `C(6, 3)`","_n":"t699","_k":"869eeff3"},{"t":"10","_n":"u689","_k":"81af4cd4"},{"t":"15, the next entry on the same diagonal","_n":"v6b9","_k":"0d92d695"}],"explain":"The sum sits below the last entry and one step over."},{"id":"p3","start":{"mode":"pattern","pat":"mod","mod":2,"rows":8},"prompt":"Colour by remainder ÷ 2, rows 0–8. How many odd entries does row 8 have?","options":[{"t":"0","_n":"w6a9","_k":"f75e649f"},{"t":"2","_n":"x659","_k":"3ff7151b"},{"t":"4","_n":"y649","_k":"37628bb4"},{"t":"9","_n":"z679","_k":"89a341b8"}],"explain":"Row 8 is 1 8 28 56 70 56 28 8 1: only the end 1s are odd. Rows 2, 4 and 8 (powers of 2) have odd entries only at the ends."},{"id":"p4","start":{"mode":"pattern","pat":"diag","diag":2,"rows":5},"prompt":"The third diagonal (position 2) reads 1, 3, 6, 10, … What comes next?","options":[{"t":"13","_n":"10669","_k":"6d78ec2c"},{"t":"14","_n":"11719","_k":"5c06c071"},{"t":"15","_n":"12709","_k":"d0c23698"},{"t":"21","_n":"135f8","_k":"1e0483e5"}],"explain":"`C(6, 2) = 15`. These are the triangular numbers: each adds one more than the last."}],"chalIntro":"Set up the triangle explorer, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"Build row 7 in Build mode with no errors.","why":"Row 7 is 1 7 21 35 35 21 7 1: 8 entries, each the sum of the two entries above it.","hints":["Copy row 6: 1 6 15 20 15 6 1.","Add neighbours: 1 + 6, 6 + 15, 15 + 20, …","1 7 21 35 35 21 7 1."]},{"id":"tc2","goal":4,"prompt":"Shade a hockey stick whose sum is \u003cstrong>56\u003c/strong>.","why":"1 + 3 + 6 + 10 + 15 + 21 = 56 = `C(8, 3)`, and 1 + 5 + 15 + 35 = 56 = `C(8, 5)`. Their mirror images work too.","hints":["56 appears in row 8 as `C(8, 3)` and `C(8, 5)`.","The stick ends just above and beside :"8","why":"20 − (2 × 6) = 8.","_n":"30dd3","_k":"ecf9a22f"},{"t":"12","why":"That’s the number of routes \u003cstrong>through\u003c/strong> the corner (or 20 − (2 + 6), which adds instead of multiplying). Routes through a point: (routes to it) × (routes from it).","_n":"31e03","_k":"4f96bbb6"},{"t":"18","why":"20 − 2 subtracts only the routes into the corner.","_n":"32e13","_k":"00ba1248"},{"t":"20","why":"That’s every route; remove the ones through the blocked corner.","_n":"33de3","_k":"0927df82"}]},"b":{"prompt":"A grid is 4 right and 2 up. The corner 2 right and 1 up is blocked. How many routes avoid it?","options":[{"t":"6","why":"15 − (3 × 3) = 6.","_n":"34df3","_k":"bb387091"},{"t":"9","why":"That’s the routes through the corner (or 15 − (3 + 3), which adds instead of multiplying). Routes through a point: (routes to it) × (routes from it).","_n":"35e43","_k":"a96d52c6"},{"t":"12","why":"15 − 3 subtracts only the routes into the corner.","_n":"36e53","_k":"fc099318"},{"t":"15","why":"That’s every route; remove the ones through the blocked corner.","_n":"37e23","_k":"e1610d7e"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why each entry is the sum of the two entries above it?","options":[{"t":"On a grid, every route to a corner arrives either from the left or from below, never both, so the route counts add.","why":"Two cases that can’t overlap, so their counts add.","_n":"38e33","_k":"1febf1c7"},{"t":"Because the triangle is symmetric.","why":"Symmetry doesn’t explain addition.","_n":"39d83","_k":"f25389a1"},{"t":"Because each row doubles.","why":"That’s the row sum, a different pattern.","_n":"3ad93","_k":"e5479868"},{"t":"Because it works for the first five rows.","why":"Patterns here have counting reasons. A pattern without a reason is a guess.","_n":"3b5a2","_k":"ee72d283"}]},"b":{"prompt":"Which is the best explanation of why the triangle is symmetric?","options":[{"t":"Because it looks the same in every row I checked.","why":"Patterns here have counting reasons. A pattern without a reason is a guess.","_n":"3c592","_k":"37d1feca"},{"t":"`C(n, r) = C(n, n - r)`: choosing `r` items is the same as choosing the `n - r` to leave out.","why":"Each choice of the items you take matches exactly one choice of the items you leave out.","_n":"3d582","_k":"65eed80f"},{"t":"Because each row starts and ends with 1.","why":"Only the ends.","_n":"3e572","_k":"04f5f64e"},{"t":"Because each entry is the sum of the two above.","why":"That’s the building rule.","_n":"3f562","_k":"93b1fd3c"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"Which correctly names the entry 10 in row 5?","options":[{"t":"`C(5, 10)`","why":"The bottom number (the second one in `C(n, r)`) is the position.","_n":"3g552","_k":"2fd1f2aa"},{"t":"`C(10, 5)`","why":"The row comes first.","_n":"3h542","_k":"3f2ca834"},{"t":"`C(4, 2)`","why":"The top 1 is row 0. Row `n` starts with position 0, so `C(n, r)` is the `(r + 1)`th number in it.","_n":"3i532","_k":"eba49c36"},{"t":"`C(5, 2)`, and also `C(5, 3)`","why":"10 sits at positions 2 and 3 of row 5, counting from 0.","_n":"3j622","_k":"b7eae5ce"}]},"b":{"prompt":"Which correctly names the entry 15 in row 6?","options":[{"t":"`C(6, 2)`, and also `C(6, 4)`","why":"15 sits at positions 2 and 4 of row 6, counting from 0.","_n":"3k612","_k":"63f269ec"},{"t":"`C(6, 15)`","why":"The bottom number (the second one in `C(n, r)`) is the position.","_n":"3l542","_k":"db215790"},{"t":"`C(15, 6)`","why":"The row comes first.","_n":"3m552","_k":"370581ac"},{"t":"`C(5, 2)`","why":"The top 1 is row 0. Row `n` starts with position 0, so `C(n, r)` is the `(r + 1)`th number in it.","_n":"3n562","_k":"6a74e4f4"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"A taxi drives from home to school on a street grid: 4 blocks east and 3 blocks north, only east or north. How many routes are there?","options":[{"t":"7","why":"That’s the number of blocks.","_n":"3o572","_k":"5a2122a8"},{"t":"12","why":"4 × 3. A route is an arrangement of `a` R’s and `b` U’s: `C(a + b, b)`.","_n":"3p502","_k":"38ea8990"},{"t":"35","why":"`C(7, 3)`.","_n":"3q512","_k":"6e5ef387"},{"t":"840","why":"`P(7, 4)` treats the east moves as different.","_n":"3r522","_k":"56df759c"}]},"b":{"prompt":"A courier rides 5 blocks east and 3 blocks north, only east or north. How many routes are there?","options":[{"t":"8","why":"That’s the number of blocks.","_n":"3s532","_k":"66a7e878"},{"t":"15","why":"5 × 3. A route is an arrangement of `a` R’s and `b` U’s: `C(a + b, b)`.","_n":"3t5c2","_k":"f39d88fb"},{"t":"56","why":"`C(8, 3)`.","_n":"3u5d2","_k":"99e6f6d6"},{"t":"6720","why":"That’s `P(8, 5)`, which treats the east moves as different.","_n":"3v4e2","_k":"200d902c"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A pizza shop has 9 toppings. How many different pizzas have an \u003cstrong>odd\u003c/strong> number of toppings?","options":[{"t":"128","why":"That’s half of row 8.","_n":"3w4d2","_k":"3b2cf69c"},{"t":"255","why":"Exactly half of 512 is 256.","_n":"3x502","_k":"e3508948"},{"t":"256","why":"Row 9’s odd-position entries make up half of `2^9 = 512`.","_n":"3y4f2","_k":"d5a40663"},{"t":"512","why":"That’s all pizzas.","_n":"3z522","_k":"d35dcef4"}]},"b":{"prompt":"A shop has 7 toppings. How many different pizzas have an \u003cstrong>even\u003c/strong> number of toppings (a plain pizza counts as 0)?","options":[{"t":"32","why":"That’s half of row 6.","_n":"40512","_k":"863483d8"},{"t":"63","why":"The plain pizza is included.","_n":"41542","_k":"08cdae38"},{"t":"64","why":"Half of `2^7 = 128`.","_n":"42532","_k":"399e335f"},{"t":"128","why":"That’s all pizzas.","_n":"43562","_k":"73ee971c"}]}}]},"task":{"title":"Hockey stick hunt","summary":"Hockey stick hunt","statement":"\u003cp>Choose a diagonal and a length. Your hockey stick starts at the 1 that begins that diagonal (the entry `C(k, k)`) and runs down it. Meet every condition. Can you find all the answers?\u003c/p>\u003col class=\"pt-conds\">\
