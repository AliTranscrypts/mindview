}

*{transition:none!important;animation:none!important}
}

.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}

@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}

.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 04: hero, Venn workbench (D2 Venn, extended), Part 3 stations, "Name the region" pictures, task */
/* radioGroup (from MDM4U 02 / 03) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}

.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}

.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}

.rg.chips button .m{font-size:1.05em}

/* @component D2 vennDiagram styles (copy with the component) */
.vd{margin:4px 0 0}
.vd-names{display:flex;flex-wrap:wrap;gap:2px 18px;margin:0 0 6px;font-size:.95rem}
.vd-names:empty{display:none}
.vd-box{position:relative;width:100%;touch-action:manipulation;cursor:pointer}
.vd-box.vd-ro{cursor:default}
.vd-svg{position:absolute;left:0;top:0;display:block}
.vd-u{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.5}
.vd-f.vd-a{fill:var(--ev-a-soft)}.vd-f.vd-b{fill:var(--ev-b-soft)}.vd-f.vd-c{fill:var(--ev-c-soft)}
.vd-o{fill:none;stroke-width:2.5}.vd-o.vd-a{stroke:var(--ev-a)}.vd-o.vd-b{stroke:var(--ev-b)}.vd-o.vd-c{stroke:var(--ev-c)}
.vd-fl.c1{fill:var(--good-bg)}.vd-fl.c2{fill:var(--hi);fill-opacity:.45}.vd-fl.c3{fill:var(--bad-bg)}
.vd-reg{opacity:0;transition:opacity .4s}.vd-reg.on{opacity:1}

.vd-pr{fill:var(--hi);opacity:.5;animation:vdPul 1.1s ease-in-out 3}

.vd-l{font:italic 700 20px var(--font-math)}.vd-l.vd-a{fill:var(--ev-a)}.vd-l.vd-b{fill:var(--ev-b)}.vd-l.vd-c{fill:var(--ev-c)}
.vd-s{font:italic 400 18px var(--font-math);fill:var(--ink-2)}
.vd-vals,.vd-ins{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}

.vd-v{position:absolute;transform:translate(-50%,-50%);font:400 1.45rem var(--font-math);line-height:1;color:var(--ink);white-space:nowrap}

.vw-kx{background:repeating-linear-gradient(0deg,var(--ink-2) 0 1.4px,transparent 1.4px 6px),repeating-linear-gradient(90deg,var(--ink-2) 0 1.4px,transparent 1.4px 6px)}
#vw-hatch[aria-pressed="true"]{background:var(--hi-soft);border-color:var(--sel-bd)}
.vw-tc3{margin:10px 0 0}

\"vh-fin\" x=\"200\" y=\"234\" text-anchor=\"middle\">(\u003ctspan class=\"vh-i\">A\u003c/tspan> ∪ \u003ctspan class=\"vh-i\">B\u003c/tspan>)′ = \u003ctspan class=\"vh-i\">A\u003c/tspan>′ ∩ \u003ctspan class=\"vh-i\">B\u003c/tspan>′\u003c/text>\u003c/svg>\u003c/div>"}},"goals":["I can shade and name the regions of a two-set Venn diagram using ∪, ∩ and ′.","I can translate between words (“`A` but not `B`”, “neither”) and set notation.","I can complete a Venn diagram from survey totals, working from the inside out.","I can use a three-set Venn diagram and the three-set counting formula.","I can find probabilities from a completed Venn diagram.","I can use De Morgan’s laws to rewrite the complement of a union or an intersection."],"start":{"warmup":{"questions":[{"id":"w1","skill":"“And” vs “or”","goal":2,"prompt":"`A = {1, 2, 3, 4}` and `B = {3, 4, 5}`. Which numbers are in `A` \u003cstrong>or\u003c/strong> `B`?","options":[{"t":"1, 2, 5","why":"That leaves out the overlap.","_n":"0ef5","_k":"2e542015"},{"t":"1, 2, 3, 4, 5","why":"Everything in at least one set.","_n":"1f25","_k":"ad734302"},{"t":"1, 2, 3, 3, 4, 4, 5","why":"Each number is listed once.","_n":"2f15","_k":"ffb41371"},{"t":"3, 4","why":"That’s “and”.","_n":"3ec5","_k":"e2afaeef"}],"hints":["“Or” means at least one.","Combine the lists.","`{1, 2, 3, 4, 5}`."]},{"id":"w2","skill":"“And” vs “or”","goal":2,"prompt":"Same sets. Which numbers are in `A` but \u003cstrong>not\u003c/strong> in `B`?","options":[{"t":"3, 4","why":"Those are in both.","_n":"4eb5","_k":"dbddd745"},{"t":"5","why":"That’s `B` but not `A`.","_n":"5ee5","_k":"6693e163"},{"t":"1, 2","why":"In `A`, and not in `B`.","_n":"6ed5","_k":"aa42030a"},{"t":"1, 2, 5","why":"That’s “exactly one of them”.","_n":"7f85","_k":"e5991859"}],"hints":["Start with `A`.","Remove anything also in `B`.","`{1, 2}`."]},{"id":"w3","skill":"Additive principle","goal":3,"prompt":"30 students play soccer, 20 play basketball and 8 play both. How many play at least one?","options":[{"t":"34","why":"That subtracts the overlap twice. Once is enough.","_n":"8f75","_k":"87139e95"},{"t":"42","why":"30 + 20 − 8.","_n":"9cde","_k":"70a9ce53"},{"t":"50","why":"The 8 are counted twice.","_n":"acee","_k":"775813ed"},{"t":"58","why":"That adds the overlap. Subtract it.","_n":"bcfe","_k":"45bf03f9"}],"hints":["Who’s counted twice in 30 + 20?","The 8.","42."]},{"id":"w4","skill":"Additive principle","goal":3,"prompt":"Same group. How many play soccer only?","options":[{"t":"8","why":"That’s both.","_n":"cd0e","_k":"291bb64f"},{"t":"12","why":"That’s basketball only.","_n":"dc9e","_k":"ad68b288"},{"t":"22","why":"30 − 8.","_n":"ecae","_k":"7cd4f312"},{"t":"30","why":"30 includes the 8 who also play basketball.","_n":"fcbe","_k":"f9545d59"}],"hints":["Who is inside the soccer circle?","Soccer only, plus both.","30 − 8 = 22."]},{"id":"w5","skill":"Complements","goal":5,"prompt":"A survey of 50 people finds 42 in at least one club. What is `P`(a random person is in no club)?","options":[{"t":"0","why":"8 people are in no club.","_n":"gcce","_k":"a1763c11"},{"t":"4/25","why":"8 of 50.","_n":"hc5e","_k":"50f641e3"},{"t":"8/42","why":"Divide by all 50 people.","_n":"ic6e","_k":"e1e06526"},{"t":"21/25","why":"That’s at least one club.","_n":"j3fe","_k":"c6fc8e11"}],"hints":["How many are in no club?","50 − 42 = 8.","8/50 = 4/25."]},{"id":"w6","skill":"Complements","goal":6,"prompt":"Which phrase means the same as “not both `A` and `B`”?","options":[{"t":"Exactly one of `A` and `B`","why":"Neither is also allowed.","_n":"k3ee","_k":"2e3e54e7"},{"t":"At most one of `A` and `B`","why":"Neither, or exactly one.","_n":"l41e","_k":"d701adea"},{"t":"Neither `A` nor `B`","why":"Neither is stricter: it excludes “exactly one”.","_n":"m40e","_k":"9a3bf86d"},{"t":"Both `A` and `B`","why":"That’s the opposite.","_n":"n3be","_k":"58fbf031"}],"hints":["What does “not both” rule out?","Only the overlap.","Everything else: at most one."]}],"refreshers":{"“And” vs “or”":"“And” = in both (∩). “Or” = in at least one (∪). “But not” removes the other set.","Additive principle":"`n(A ∪ B) = n(A) + n(B) - n(A ∩ B)`; “only” regions are totals minus the overlap.","Complements":"`A′` is everything outside `A`. “Neither” is outside both circles."}}},"explore":{"heading":"Venn workbench","intro":"Shade regions and see their names, or start from a name and shade it. Then fill diagrams from survey totals.","predIntro":"Make a prediction first. Then the workbench will show you what really happens.","chalIntro":"Use the workbench to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","predictions":[{"id":"p1","start":{"sets":2,"mode":"shade"},"prompt":"Which region or regions make up `(A ∪ B)′`?","options":[{"t":"Outside both circles","_n":"o3ae","_k":"d88a6a74"},{"t":"Everything except the overlap","_n":"p3de","_k":"d8bb7dfd"},{"t":"The overlap","_n":"q3ce","_k":"17b2672f"},{"t":"`A` only and `B` only","_n":"r47e","_k":"5a29c6a5"}],"explain":"Not in `A` or `B` = in neither."},{"id":"p2","start":{"sets":2,"mode":"shade"},"prompt":"Which region is `A′ ∩ B`?","options":[{"t":"Outside both","_n":"s46e","_k":"29196b8d"},{"t":"The overlap","_n":"t39e","_k":"d3c2c608"},{"t":"`B` only","_n":"u3ae","_k":"5bdcd432"},{"t":"`A` only","_n":"v37e","_k":"cc254540"}],"explain":"Not in `A`, but in `B`."},{"id":"p3","start":{"mode":"demorgan","law":"int"},"prompt":"De Morgan mode. `(A ∩ B)′` is the same as …","options":[{"t":"`A ∪ B`","_n":"w38e","_k":"3e793e0a"},{"t":"`A′ ∪ B′`","_n":"x3de","_k":"f5ddf732"},{"t":"`A′ ∩ B′`","_n":"y3ee","_k":"b8088995"},{"t":"`(A ∪ B)′`","_n":"z3be","_k":"2523de9d"}],"explain":"Not both = outside the overlap = not `A`, or not `B`."},{"id":"p4","start":{"sets":3,"mode":"shade"},"prompt":"How many regions does a three-set Venn diagram have, counting the outside?","options":[{"t":"6","_n":"103ce","_k":"928ae973"},{"t":"7","_n":"1141e","_k":"ce047a25"},{"t":"8","_n":"1242e","_k":"d9a8860a"},{"t":"9","_n":"13bbd","_k":"0e1870ed"}],"explain":"Each person is in or out of each of 3 sets: 2 × 2 × 2 = 8 (the counting principle from module 02)."}],"challenges":[{"id":"tc1","goal":1,"prompt":"Three sets, Name → shade: shade exactly `A ∩ B′ ∩ C`.","why":"`A ∩ B′ ∩ C` is inside `A` and `C` but outside `B`: the lens where `A` and `C` overlap, without the centre.","hints":["Which circles must you be in?","`A` and `C`, but not `B`.","The lens where `A` and `C` overlap, minus the centre."]},{"id":"tc2","goal":3,"prompt":"Survey fill, 2 sets: 60 people; 34 have a cat, 25 have a dog, 8 have both. Fill all four regions.","why":"Inside out: both 8, cat only 34 − 8 = 26, dog only 25 − 8 = 17, and neither 60 − 51 = 9.","hints":["Start in the middle.","Cat only = 34 − 8; dog only = 25 − 8.","26 + 8 + 17 = 51, so neither = 9."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"Survey fill, 3 sets: 50 students; Robotics 20, Drama 18, Music 22; Robotics and Drama 7, Robotics and Music 8, Drama and Music 6; all three 3. Fill all 8 regions, then answer: how many are in \u003cstrong>exactly one\u003c/strong> club?","why":"Centre 3; exactly two 7 − 3 = 4, 8 − 3 = 5, 6 − 3 = 3; only regions 8, 8 and 11; none 8. Exactly one club: 8 + 8 + 11 = 27.","hints":["Centre first: 3.","Exactly two: 7 − 3, 8 − 3, 6 − 3.","R only = 20 − 4 − 5 − 3 = 8; D only 8; M only 11: 27."]}],"msg":{"tc1Centre":"That’s `A ∩ C`; the centre is in `B`.","tc1Aonly":"You also need to be inside `C`.","tc2Cat":"34 includes the 8 who also have a dog.","tc2Dog":"25 includes the 8 who also have a cat.","tc2One":"60 − 59 used the totals instead of the regions.","tc2None":"Count the people in no circle.","tc3Pairs":"The 7 in Robotics and Drama includes the 3 in all three. Fill “exactly two” as 7 − 3 = 4 first.","tc3At":"That’s at least one club.","tc3Add":"That adds the club totals."},"surveys":{"2":{"total":60,"letters":["A","B"],"names":["has a cat","has a dog"],"intro":"60 people: 34 have a cat, 25 have a dog, 8 have both.","given":[{"lab":"`n(A)`","codes":["a","ab"],"v":34},{"lab":"`n(B)`","codes":["b","ab"],"v":25},{"lab":"`n(A ∩ B)`","codes":["ab"],"v":8}]},"3":{"total":50,"letters":["R","D","M"],"names":["Robotics","Drama","Music"],"intro":"50 students: Robotics 20, Drama 18, Music 22; Robotics and Drama 7, Robotics and Music 8, Drama and Music 6; all three 3.","given":[{"lab":"`n(R)`","codes":["a","ab","ac","abc"],"v":20},{"lab":"`n(D)`","codes":["b","ab","bc","abc"],"v":18},{"lab":"`n(M)`","codes":["c","ac","bc","abc"],"v":22},{"lab":"`n(R ∩ D)`","codes":["ab","abc"],"v":7},{"lab":"`n(R ∩ M)`","codes":["ac","abc"],"v":8},{"lab":"`n(D ∩ M)`","codes":["bc","abc"],"v":6},{"lab":"`n(R ∩ D ∩ M)`","codes":["abc"],"v":3}]}},"targets":{"2":["A ∩ B′","(A ∪ B)′","A′ ∪ B","(A ∩ B)′","A ∪ B′","(A ∩ B′) ∪ (A′ ∩ B)"],"3":["A ∩ B′ ∩ C","(A ∪ B) ∩ C′","A ∩ (B ∪ C)","(A ∪ B ∪ C)′","A′ ∩ B′ ∩ C","(A ∩ B) ∪ (A ∩ C) ∪ (B ∩ C)"]},"laws":{"uni":{"left":"(A ∪ B)′","right":"A′ ∩ B′","inner":"A ∪ B","first":["a","b","ab"],"res":["o"],"rule":"where both hatchings cross","same":"outside both circles"},"int":{"left":"(A ∩ B)′","right":"A′ ∪ B′","inner":"A ∩ B","first":["ab"],"res":["a","b","o"],"rule":"anywhere with at least one hatching","same":"everything except the overlap"}}},"part3":{"slug":"three-sets","name":"Three sets","heading":"Three-set puzzles","intro":"Three sets are where working from the inside out really pays off. Fill a three-set diagram in order, watch the formula count each region, then read probabilities from the finished diagram.","letters":["X","Y","Z"],"total":80,"st1":{"title":"Station 1: inside out","text":"\u003cspan class=\"mdm-model\">Model data\u003c/span> A survey of 80 people and three streaming services: X 40, Y 35, Z 30; X and Y 15, X and Z 12, Y and Z 10; all three 5. Fill the regions in order: the centre, then “exactly two”, then “only”, then none.","steps":[{"id":"f1","code":"abc","prompt":"The centre: how many use all three services?","_a":"AQ==","why":"The survey gives it: 5 use all three."},{"id":"f2","code":"ab","prompt":"X and Y only (not Z)","_a":"BQE=","why":"15 − 5 = 10: the 15 who use X and Y include the 5 in the centre.","wrong":[{"match":15,"fb":"The 15 who use X and Y include the 5 in the centre. Take the centre out first."}]},{"id":"f3","code":"ac","prompt":"X and Z only (not Y)","_a":"Aw==","why":"12 − 5 = 7.","wrong":[{"match":12,"fb":"The 12 who use X and Z include the 5 in the centre. Take the centre out first."}]},{"id":"f4","code":"bc","prompt":"Y and Z only (not X)","_a":"AQ==","why":"10 − 5 = 5.","wrong":[{"match":10,"fb":"The 10 who use Y and Z include the 5 in the centre. Take the centre out first."}]},{"id":"f5","code":"a","prompt":"X only","_a":"BQk=","why":"40 − 10 − 7 − 5 = 18: take away every region inside X that’s already filled.","wrong":[{"match":40,"fb":"40 is everyone inside X, including its overlaps."},{"match":13,"fb":"40 − 15 − 12 takes the centre away twice. Use the regions you’ve filled: 10, 7 and 5."}]},{"id":"f6","code":"b","prompt":"Y only","_a":"BQQ=","why":"35 − 10 − 5 − 5 = 15.","wrong":[{"match":35,"fb":"35 is everyone inside Y, including its overlaps."},{"match":10,"fb":"35 − 15 − 10 takes the centre away twice. Use the regions you’ve filled: 10, 5 and 5."}]},{"id":"f7","code":"c","prompt":"Z only","_a":"BQI=","why":"30 − 7 − 5 − 5 = 13.","wrong":[{"match":30,"fb":"30 is everyone inside Z, including its overlaps."},{"match":8,"fb":"30 − 12 − 10 takes the centre away twice. Use the regions you’ve filled: 7, 5 and 5."}]},{"id":"f8","code":"o","prompt":"None of the three","_a":"Aw==","why":"The seven regions inside the circles hold 73 people, so 80 − 73 = 7 use none.","wrong":[{"match":0,"fb":"Some people are in no circle. That region belongs in the rectangle too."},{"match":-25,"fb":"80 − 40 − 35 − 30 uses the totals instead of the regions. Add the seven regions you’ve filled."}]}]},"st2":{"title":"Station 2: why the formula adds the centre back","text":"Step through
