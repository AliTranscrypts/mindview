.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 39: Investigation planner (D13), Critique rubric and comment builder, Stage 2 analysis, report builder.
   Scatter points --pen, regression line --ink, residuals --ev-c; box plots and histogram use --ev-a / --ev-b with their soft fills. */
/* radioGroup (from MDM4U 19 / 18) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;text-align:left}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* planner */
.ci-top{margin:0 0 14px}
.ci-dsnote{margin:0 0 8px}
.ci-data{margin:6px 0 0}
.ci-tabs{margin:0 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.ci-tabs .rg-wrap{flex-wrap:nowrap}
.ci-tabs .rg.seg{flex-wrap:nowrap}
.ci-tabs .rg.seg button{white-space:nowrap}
.ci-stage{border-top:1px solid var(--rule);padding-top:10px}
.ci-sec{margin:0 0 4px}
.ci-tplq{margin:-4px 0 10px}
.ci-dim{opacity:.55;text-decoration:line-through}
.ci-p4{margin:-4px 0 8px}
.ci-h{margin:14px 0 6px;font-size:.95rem}
.ci-an{border:1px solid var(--rule);border-radius:8px;padding:6px 10px 8px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:2px 14px}
.ci-an legend{font-size:.88rem;font-weight:700;color:var(--ink-2);padding:0 4px}
.ci-cb{display:inline-flex;align-items:center;gap:6px;min-height:34px;font-size:.93rem;cursor:pointer}
.ci-cb input{width:18px;height:18px;accent-color:var(--pen)}
.ci-colour{margin:0 0 8px}
.ci-txt{width:min(100%,16em)}
.ci-skip{margin-top:6px}
.ci-graphs .plot-wrap{margin:0 0 10px}
.ci-empty{border:1.5px dashed var(--rule);border-radius:10px;padding:22px 14px;text-align:center;margin:0}
.ci-read dd{overflow-wrap:anywhere}
.ci-all{display:none}
@media (max-width:820px){
  .ci-read:not(.all) > .ci-opt{display:none}
  .ci-all{display:inline-flex;margin-top:6px}
}
/* own data (M3) */
.ci-priv{background:var(--info-bg);border-radius:8px;padding:8px 10px;font-size:.9rem;margin:6px 0 8px}
.ci-ownwrap{max-height:420px;overflow:auto}
.ci-own{border-collapse:collapse;font-size:.9rem;min-width:560px}
.ci-own th,.ci-own td{border:1px solid var(--rule);padding:3px;vertical-align:top}
.ci-own thead th{background:var(--paper);text-align:left}
.ci-own input,.ci-own select{width:100%;min-width:7em;min-height:30px;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:2px 5px}
.ci-own select{margin-top:3px}
.ci-own tbody th{font-weight:600;color:var(--ink-2);white-space:nowrap;width:3.2em}
.ci-own tr.ci-bad td{background:var(--bad-bg)}
.ci-own tr.ci-bad th{color:var(--red)}

/* Part 3: critique */
.cr-card{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin:6px 0 10px;background:var(--paper)}
.cr-title{margin:2px 0 8px;font-size:1.02rem}
.cr-parts{margin:0}
.cr-parts > div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;padding:5px 0;border-top:1px solid var(--rule)}
.cr-parts dt{font-weight:700;color:var(--ink-2)}
.cr-parts dd{margin:0}
.cr-bar{max-width:420px;margin:8px 0 2px}
.cr-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;border-bottom:1px solid var(--rule);padding:6px 0}
.cr-crit{margin:0;flex:1 1 16em}
.cr-row .rg-wrap{margin:0}
.cr-list{margin:4px 0 4px 1.1em;padding:0}
.cr-list li{margin:3px 0}
.cr-imp,.ci-pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;align-items:center}
.ci-pk{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:12px;padding:.35em .85em;font-size:.92rem;min-height:36px;text-align:left;cursor:pointer}
.ci-pk[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ci-pk:disabled{cursor:default;opacity:.8}
.cr-data{margin-top:8px}
.cr-built{background:var(--paper);border-left:4px solid var(--pen);padding:8px 12px;border-radius:4px;margin:8px 0}
.ci-chips .rg-wrap{align-items:flex-start}

/* practice */
.ci-ms{border:0;margin:4px 0 6px;padding:0;display:flex;flex-wrap:wrap;gap:2px 16px}
.ci-fu{border-top:1px solid var(--rule);margin-top:14px;padding-top:6px}
.ci-fu h4{margin:10px 0 6px;font-size:.95rem}

/* report builder */
.ci-from{background:var(--info-bg);border-radius:8px;padding:6px 10px;margin:8px 0}
.ci-from p{margin:0}
textarea.ci-short{min-height:3.6em}
.ci-rep h4{margin:6px 0}
.ci-reptext dd{white-space:pre-wrap;overflow-wrap:anywhere}
.ci-outline{margin:4px 0 8px 1.2em;padding:0}

Data a small table fills; at Analysis a scatter plot appears; at Conclusion the sentence strong negative association (r = −0.99) types out; at Report it folds into a page icon.","shape":"wide"}},"goals":["I can pose an investigable question with clear variables and a population that matches my data.","I can plan an investigation: data source (primary or secondary), sample, and variables.","I can choose and produce the numerical and graphical summaries that fit my question.","I can draw a conclusion that matches the evidence, using correct strength words and no unsupported causal claims.","I can identify limitations, including bias and hidden variables, and suggest further investigation.","I can critique another investigation constructively, using clear criteria."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Types of data","goal":2,"prompt":"You download last year’s attendance figures from a school board’s website. What kind of data is that?","options":[{"t":"Categorical data only","why":"Attendance counts are numerical.","_n":"0855","_k":"c9b27860"},{"t":"Primary data","why":"Primary data is collected by you, for your question.","_n":"1825","_k":"9b1111f2"},{"t":"Experimental data","why":"Nothing was assigned or controlled.","_n":"2835","_k":"394020b4"},{"t":"Secondary data","why":"Someone else collected it.","_n":"3805","_k":"1524e925"}],"hints":["Who collected it?","The school board, not you.","Secondary."]},{"id":"w2","skill":"Types of data","goal":1,"prompt":"Which variable is categorical?","options":[{"t":"Hours of sleep","why":"Numerical (continuous).","_n":"4815","_k":"ef31c1a0"},{"t":"Mark (%)","why":"Numerical.","_n":"57e5","_k":"57bb2df4"},{"t":"Number of siblings","why":"Numerical (discrete).","_n":"67f5","_k":"54fa2b18"},{"t":"Plays a school sport (yes or no)","why":"Yes or no is a label (a group), not a number.","_n":"77c5","_k":"75ec1ba7"}],"hints":["Categorical = groups or labels.","Which values are words, not numbers?","Yes or no."]},{"id":"w3","skill":"Choosing graphs","goal":3,"prompt":"Best graph to show the relationship between screen time and sleep (both numerical)?","options":[{"t":"Scatter plot","why":"Two numerical variables, paired: each student is one (`x`, `y`) point.","_n":"87d5","_k":"2a92ffbb"},{"t":"Histogram of sleep","why":"That ignores screen time.","_n":"9288","_k":"33981791"},{"t":"Bar graph of averages","why":"That hides the individual pairs.","_n":"a278","_k":"4c19bad6"},{"t":"Circle graph","why":"Circle graphs show parts of a whole. Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"b2a8","_k":"41f0a37f"}],"hints":["Two numerical variables, paired.","Each student is one (`x`, `y`) point.","Scatter plot."]},{"id":"w4","skill":"Choosing graphs","goal":3,"prompt":"Best graph to compare marks of students who play a sport and those who don’t?","options":[{"t":"Line graph","why":"There’s no time sequence.","_n":"c298","_k":"0d9df5fa"},{"t":"Side-by-side box plots","why":"One numerical variable, two groups: show each group’s distribution.","_n":"d248","_k":"2a77154f"},{"t":"Scatter plot","why":"One variable is categorical. Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"e238","_k":"71990416"},{"t":"A single histogram of all marks","why":"That mixes the groups.","_n":"f268","_k":"fffc11b4"}],"hints":["One numerical variable, two groups.","Show each group’s distribution.","Side-by-side box plots."]},{"id":"w5","skill":"Summaries and strength words","goal":4,"prompt":"`r = -0.52`. Which description fits?","options":[{"t":"Moderate negative linear relationship","why":"0.52 is between 0.33 and 0.67.","_n":"g258","_k":"6e474645"},{"t":"Weak positive","why":"The sign is negative.","_n":"h208","_k":"95cd176c"},{"t":"Strong negative","why":"Strong needs |`r`| ≥ 0.67.","_n":"i1f8","_k":"f064adb6"},{"t":"No relationship","why":"0.52 is moderate.","_n":"j967","_k":"815640c0"}],"hints":["Use the strength guide.","|−0.52| = 0.52.","Moderate, negative."]},{"id":"w6","skill":"Summaries and strength words","goal":3,"prompt":"Which pair summarizes a skewed set of marks best?","options":[{"t":"Mean only","why":"Always add a spread.","_n":"k977","_k":"24bcd26c"},{"t":"Median and IQR","why":"Both resist the pull of a long tail.","_n":"l987","_k":"e335063f"},{"t":"Mean and range","why":"Both are pulled by extremes.","_n":"m997","_k":"4ea3c510"},{"t":"Mode and maximum","why":"Neither describes centre and spread well.","_n":"n927","_k":"0e966050"}],"hints":["Which measures resist outliers?","The median, and quartiles.","Median and IQR."]}],"refreshers":{"Types of data":"Primary: you collect it. Secondary: someone else did. Categorical: groups. Numerical: counts or measurements.","Choosing graphs":"Relationship: scatter plot. Compare groups: side-by-side box plots. One variable: histogram (numerical) or bar or circle graph (categorical).","Summaries and strength words":"Centre plus spread. Strength: |`r`| ≥ 0.67 strong, 0.33–0.67 moderate, &lt; 0.33 weak."}}},"explore":{"heading":"Investigation planner","intro":"Choose a data set, pose a question, plan your analysis, and let the tools build the summaries. Each milestone has a check. Everything you build here flows into your report.","predIntro":"Make a prediction first. Then the planner will show you what really happens.","predictions":[{"id":"p1","start":{"ds":"m1","tpl":"rel","v1":"sleep","v2":"mark","pop":"s20","an":["scatter","r"],"stage":2},"prompt":"M1: which question needs a scatter plot?","options":[{"t":"Do sport and non-sport students differ in mark?","_n":"o937","_k":"40ab0ce4"},{"t":"What percentage play a sport?","_n":"p947","_k":"74d1a734"},{"t":"Is there a relationship between sleep and mark?","_n":"q957","_k":"182cccf3"},{"t":"What is the most common mark?","_n":"r9e7","_k":"22d8a03f"}],"explain":"Two numerical variables, paired by student. The scatter plot shows `r = 0.92`."},{"id":"p2","start":{"ds":"m1","tpl":"diff","v1":"sport","v2":"mark","pop":"s20","an":["box","medians","iqr"],"stage":2},"prompt":"M1: sport players’ median mark is 77 and non-players’ is 70.5; both IQRs are 8. How do the box plots compare?","options":[{"t":"They overlap a lot, with the sport box shifted higher","_n":"s9f7","_k":"af0103d2"},{"t":"Identical","_n":"t9c7","_k":"f88c7803"},{"t":"The non-sport box is higher","_n":"u9b7","_k":"e17488a7"},{"t":"No overlap","_n":"v9a7","_k":"99cc21af"}],"explain":"The sport box runs 73–81, the non-sport box 69–77. A 6.5-point difference in medians, but the middle halves overlap from 73 to 77."},{"id":"p3","start":{"ds":"m2","tpl":"rel","v1":"soup","v2":"drinks","pop":"d20","an":["scatter","r"],"stage":2},"prompt":"M2: soup vs cold drinks has `r = -0.979`. Do cold drinks reduce soup sales?","options":[{"t":"Yes, but only on hot days","_n":"w997","_k":"86a10c0a"},{"t":"No: temperature drives both (common cause)","_n":"x987","_k":"426c7bc3"},{"t":"Yes: strong `r` proves it","_n":"y977","_k":"086d283e"},{"t":"No: `r` is negative, so they’re unrelated","_n":"z967","_k":"0e243150"}],"explain":"Colour by temperature shows the gradient. Hot days: more drinks, less soup. Neither causes the other."},{"id":"p4","start":{"ds":"m1","stage":0},"prompt":"M1 is 20 model students from one school. How far can a conclusion reach?","options":[{"t":"Everyone, if `r` is strong","_n":"10957","_k":"a4b25f1a"},{"t":"All Ontario teens","_n":"11a47","_k":"184e85e6"},{"t":"All Canadians","_n":"12a37","_k":"96bcf8c2"},{"t":"Only to these 20 students (or, cautiously, similar students)","_n":"132a7","_k":"1a111a83"}],"explain":"Conclusions extend only to the population the sample represents. The population chip “all Ontario teens” is now greyed out for the built-in data."}],"chalIntro":"These are your planning milestones. Use the planner to meet each one, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":1,"prompt":"\u003cstrong>An investigable question.\u003c/strong> Build a question for M1 or M2 that passes all three checks: the variables exist in the data set, the template matches the variable types, and the population matches the data.","why":"Your variables exist, the template matches their types, and the population is the one your data represent.","hints":["Check each variable’s type in the Plan tab.","Numerical + numerical → relationship; group + numerical → differ.","e.g. “Is there a relationship between screen time and mark for these 20 model students?”"]},{"id":"tc2","goal":3,"prompt":"\u003cstrong>The right analysis.\u003c/strong> Choose the analysis items your question needs.","why":"Your analysis matches your question: a relationship needs a scatter plot, `r` and a line; groups need side-by-side box plots with a centre and a spread for each.","hints":["What does your question compare?","Relationship: pattern, strength, line. Groups: distribution, centre, spread.","Relationship: scatter plot, `r` and line of best fit. Groups: side-by-side box plots, group means or medians, and IQRs or standard deviations."]},{"id":"tc3","goal":4,"stretch":true,"prompt":"\u003cstrong>A conclusion that matches the evidence.\u003c/strong> For “Is there a relationship between screen time and mark for these 20 model students?”, build a conclusion that passes every check.","why":"Strong (|`r`| = 0.86 ≥ 0.67), negative, association language, a specific limitation and a plausible hidden variable.","hints":["Read `r`: sign, then size.","Use association language.","Strong negative association; limitation: `n = 20` model students; possible hidden variable: sleep."]}]},"part3":{"slug":"critique","name":"Critique","heading":"Critique an investigation","intro":"Here are two complete sample investigations (both model). Rate each one against the rubric, choose its most important improvement, then write a constructive comment. The same five criteria will check your own report.","rubric":["Question: investigable, with clear variables and population.","Data and sample: source, size, how representative.","Analysis: the right summaries and graphs.","Conclusion: matches the evidence; no unsupported cause.","Limitations and next steps."],"rubricShort":["Question","Data and sample","Analysis","Conclusion","Limitations"],"levels":["Level 1 (limited)","Level 2","Level 3","Level 4 (thorough)"],"investigations":[{"id":"A","title":"Investigation A: “Breakfast and marks”","parts":[["Question","“Does eating breakfast cause higher marks?”"],["Data","An online poll of 14 of the author’s friends (primary, voluntary)."],["Analysis","Two means (breakfast 81%, none 74%) shown in a bar graph whose `y`-axis starts at 70."],["Conclusion","“Breakfast causes 7% higher marks for all students.”"],["Limitations","“None.”"]],"_a":"aldKUx4GGwEdVDs=","reasons":["It names variables, but it asks about cause, which a poll can’t show.","14 friends who chose to answer: small, voluntary and not representative.","Two means fit the question, but no spread is shown and the axis starting at 70 exaggerates the gap.","It claims cause from observational data and stretches to all students.","No limitations are listed."],"improve":[{"t":"Use a random sample and don’t claim cause; name hidden variables such as sleep or family routines.","why":"That fixes the two biggest problems: who was asked, and the causal claim. These data are observational: say ‘is associated with’ and name a possible hidden variable.","_n":"142b7","_k":"13a83953"},{"t":"Use more colours in the bar graph.","why":"Colours don’t change what the evidence can support.","_n":"15287","_k":"847ebf33"},{"t":"Report the means to two decimal places.","why":"Precision isn’t the problem: the sample and the causal claim are.","_n":"16297","_k":"a3c19e29"},{"t":"Ask the same 14 friends again next month.","why":"That’s still a small voluntary sample of friends. Conclusions apply to the population your sample represents. A convenience sample represents only itself.","_n":"17267","_k":"00d06dcf"}]},{"id":"B","title":"Investigation B: “Temperature and soup”","parts":[["Question","“Is there a relationship between daily high temperature and soup sold at the model cafeteria?”"],["Data","M2 (20 days, secondary)."],["Analysis","Scatter plot, `r = -0.991`, `ŷ = -1.34x + 52.41`, residual plot with no pattern."],["Conclusion","“There is a strong negative association. Colder days are associated with more soup sold.”"],["Limitations","“20 days at one cafeteria; menu changes and holidays weren’t recorded; model data.”"]],"_a":"alFKUR4AGwQdUTs=","reasons":["Investigable: two measurable variables and a clear population.","Secondary model data, but only 20 days at one cafeteria.","Scatter plot, `r`, line and a residual check match a relationship question.","It matches the evidence and uses association language.","Specific: scope, possible hidden variables and model data."],"improve":[{"t":"Collect a full year at several schools.","why":"More days and more cafeterias would show whether the pattern holds beyond these 20 model days.","_n":"18277","_k":"ffd785d6"},{"t":"Remove the coldest days.","why":"Don’t remove data to tidy a result.","_n":"19247","_k":"e1f1316b"},{"t":"Say that cold weather causes soup sales.","why":"These data are observational: say ‘is associated with’ and name a possible hidden variable.","_n":"1a257","_k":"60231f22"},{"t":"Switch to a bar graph of the averages.","why":"That hides the individual days.","_n":"1b227","_k":"423d266a"}]}],"comment":{"criteria":["Question","Data and sample","Analysis","Conclusion","Limitations"],"evidence":[{"id":"e1","t":"the poll was voluntary and reached only 14 friends, so the result may not represent all students"},{"id":"e2","t":"the `y`-axis starts at 70, so the 7-point gap looks huge"},{"id":"e3","t":"the conclusion says “causes”, but the data are observational"},{"id":"e4","t":"the limitations section says “None”"},{"id":"e5","t":"the data cover only 20 days at one cafeteria"}],"suggestions":[{"id":"e1","t":"use a random sample"},{"id":"e2","t":"start the axis at 0"},{"id":"e3","t":"say “is associated with” and name a hidden variable such as sleep"},{"id":"e4","t":"list the sample size, how the sample was chosen and possible hidden variables"},{"id":"e5","t":"collect a full year at several schools"}]},"quickCheck":{"title":"Critique quick check","summary":"Critique quick check","items":[{"id":"q1","goal":6,"prompt":"Investigation A’s biggest data problem?","choices":[{"t":"It used means","fb":"Small and self-selected: it represents only those friends. Conclusions apply to the population your sample represents. A convenience sample represents only itself.","_n":"1c237","_k":"8311e146"},{"t":"The marks were percentages","fb":"Small and self-selected: it represents only those friends. Conclusions apply to the population your sample represents. A convenience sample represents only itself.","_n":"1d907","_k":"1e929463"},{"t":"Voluntary sample of 14 friends","fb":"Right. Small and self-selected: it represents only those friends.","_n":"1e8f7","_k":"04c5c630"},{"t":"The poll was online in the evening","fb":"Small and self-selected: it represents only those friends. Conclusions apply to the population your sample represents. A convenience sample represents only itself.","_n":"1f927","_k":"63f1c8b7"}]},{"id":"q2","goal":6,"prompt":"What’s wrong with A’s graph?","choices":[{"t":"It has a title","fb":"Truncated axes make small differences look large.","_n":"1g917","_k":"9e9808bd"},{"t":"It has two bars","fb":"Truncated axes make small differences look large.","_n":"1h947","_k":"cae90c93"},{"t":"It’s a bar graph","fb":"Truncated axes make small differences look large.","_n":"1i937","_k":"b08eeb65"},{"t":"The `y`-axis starts at 70, exaggerating the gap","fb":"Right. Truncated axes make small differences look large.","_n":"1j967","_k":"31b98c3c"}]},{"id":"q3","goal":6,"prompt":"Which comment is constructive?","choices":[{"t":"“Use more colours.”","fb":"Criterion, evidence, suggestion. Constructive critique names a criterion, the evidence, and a specific improvement.","_n":"1k957","_k":"f2ae193d"},{"t":"“I disagree.”","fb":"Criterion, evidence, suggestion. Constructive critique names a criterion, the evidence, and a specific improvement.","_n":"1l987","_k":"4209a3a3"},{"t":"“This is bad.”","fb":"Criterion, evidence, suggestion. Constructive critique names a criterion, the evidence, and a specific improvement.","_n":"1m977","_k":"1b085e75"},{"t":"“Your sample was voluntary; a random sample would make the conclusion more trustworthy.”","fb":"Right. Criterion, evidence, suggestion.","_n":"1n1e7","_k":"baa5f387"}]},{"id":"q4","goal":[3,6],"prompt":"B’s strongest point?","choices":[{"t":"It found cause","fb":"Scatter plot, `r`, line and residual plot fit a relationship question.","_n":"1o1f7","_k":"4fd9c9be"},{"t":"Analysis matches the question, with a residual check","fb":"Right. Scatter plot, `r`, line and residual plot fit a relationship question.","_n":"1p207","_k":"17a8e56d"},{"t":"It has a positive `r`","fb":"Scatter plot, `r`, line and residual plot fit a relationship question.","_n":"1q217","_k":"703533be"},{"t":"It has the most data","fb":"Scatter plot, `r`, line and residual plot fit a relationship question.","_n":"1r227","_k":"4b8f87da"}]}]}},"practice":{"intro":"Three stages of an investigation. If you get stuck, each item has three levels of help: a small hint, a bigger hint, then the worked solution. Use only as much as you need.","activities":[{"id":"sort","type":"sorter","title":"Stage 1: question and plan","summary":"Stage 1: question and plan","goal":[1,2],"noun":"question","txt":true,"instruction":"Tap a question, then tap the box it belongs in.","boxes":[{"id":"inv","label":"Investigable as written"},{"id":"fix","label":"Needs a fix"}],"items":[{"id":"i1","t":"“Is there a relationship between hours of part-time work and mark for Grade 12 students at our school?”","_a":"EwwIFBA=","why":"Two measurable variables, clear population.","wrong":{"fix":"Two measurable variables, clear population: it’s investigable as written."},"hints":["Are the variables measurable?","Does the population match the data?","Investigable as written: two measurable variables, clear population."]},{"id":"i2","t":"“Is pizza the best food?”","_a":"EwMPGhA=","why":"Opinion: no measurable variable.","wrong":{"inv":"Opinion: no measurable variable. An investigable question names measurable variables and a population your data actually represent."},"hints":["Are the variables measurable?","Does the population match the data?","Needs a fix: it’s an opinion with no measurable variable."]},{"id":"i3","t":"“Do students who bike to school and students who take the bus differ in commute time?”","_a":"EwwIFBA=","why":"Group and numerical variable.","wrong":{"fix":"Group (bike or bus) and a numerical variable (commute time): it’s investigable."},"hints":["Are the variables measurable?","Does the population match the data?","Investigable as written: a group and a numerical variable."]},{"id":"i4","t":"“Why do teens like music?”","_a":"EwMPGhA=","why":"‘Why’ needs a measurable variable: try ‘hours of music per day vs …’.","wrong":{"inv":"‘Why’ needs a measurable variable: try ‘hours of music per day vs …’."},"hints":["Are the variables measurable?","Does the population match the data?","Needs a fix: ‘why’ needs a measurable variable, such as hours of music per day."]},{"id":"i5","t":"“Is there a relationship between temperature and soup sales for all Canadians?” (M2 data)","_a":"EwMPGhA=","why":"The data are 20 days at one model cafeteria.","wrong":{"inv":"The data are 20 days at one model cafeteria. Conclusions apply to the population your sample represents. A convenience sample represents only itself."},"hints":["Are the variables measurable?","Does the population match the data?","Needs a fix: the data are 20 days at one model cafeteria, not all Canadians."]},{"id":"i6","t":"“Do players and non-players of school sports differ in weekly screen time, for the 20 model students?”","_a":"EwwIFBA=","why":"It matches M1.","wrong":{"fix":"It matches M1: a group, a numerical variable and the right population."},"hints":["Are the variables measurable?","Does the population match the data?","Investigable as written: it matches M1."]},{"id":"i7","t":"“Does social media cause anxiety?” (using a survey)","_a":"EwMPGhA=","why":"A survey can’t show cause. Rephrase as ‘Is there a relationship between …?’","wrong":{"inv":"A survey can’t show cause. Rephrase as ‘Is there a relationship between …?’"},"hints":["Are the variables measurable?","Does the population match the data?","Needs a fix: a survey can’t show cause, so ask about a relationship."]},{"id":"i8","t":"“What is the distribution of sleep hours for the 20 model students?”","_a":"EwwIFBA=","why":"A one-variable question: histogram and summaries.","wrong":{"fix":"A one-variable question is investigable too: histogram and summaries."},"hints":["Are the variables measurable?","Does the population match the data?","Investigable as written: a one-variable question (histogram and summaries)."]}],"followUp":{"prompt":"Plan follow-up for question 1 (not scored): which sampling method would represent the whole grade?","options":[{"t":"Survey one Grade 12 class","why":"One class may differ from the rest of the grade.","_n":"1s237","_k":"568ef636"},{"t":"Post a voluntary online poll","why":"Volunteers choose themselves, so the sample may not represent the grade.","_n":"1t247","_k":"e1e39eba"},{"t":"Ask my friends at lunch","why":"A convenience sample represents only itself.","_n":"1u257","_k":"13e2d426"},{"t":"Stratified random sample by homeroom","why":"Every homeroom is represented, and chance picks the students.","_n":"1v167","_k":"f53147c0"}],"prompt2":"Would the data be primary?","options2":[{"t":"Yes: I’d collect it myself","why":"You collect it, for your question: primary data.","_n":"1w177","_k":"7577aac4"},{"t":"No: it would be secondary","why":"You’d collect it yourself, so it’s primary.","_n":"1x247","_k":"79e6bdfe"}]}},{"id":"analysis","type":"custom","title":"Stage 2: analysis","summary":"Stage 2: analysis","goal":[3,4],"star":true,"instruction":"Choose, calculate and interpret. Items marked ★ are non-routine; the last two go beyond the Final Check.","how":"Choose or type your answer, then press Check.","items":[{"id":"a1","kind":"multi","goal":3,"prompt":"Question: relationship between sleep and mark (M1). Which three items are required?","options":[{"t":"Scatter plot","_n":"1y237","_k":"b10608b3"},{"t":"`r`","_n":"1z227","_k":"c0d5ce45"},{"t":"Line of best fit","_n":"20217","_k":"fc061be9"},{"t":"Side-by-side box plots","why":"Box plots compare groups. Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"21287","_k":"354cdd5a"},{"t":"Histogram of marks","why":"A histogram shows one variable; your question links two.","_n":"22277","_k":"70441be2"},{"t":"Circle graph","why":"Circle graphs show parts of a whole.","_n":"23267","_k":"adbe6c5e"}],"general":"A relationship needs its pattern (scatter plot), its strength (`r`) and a line of best fit.","why":"Scatter plot, `r` and line of best fit: pattern, strength and line.","hints":["Two numerical variables: what shows a relationship?","Pattern, strength, line.","Scatter plot, `r`, line of best fit."]},{"id":"a2","kind":"chips","goal":4,"prompt":"M1 sleep vs mark: `r = 0.920`. Strength and direction?","options":[{"t":"Moderate positive","why":"0.92 ≥ 0.67, so it’s strong.","_n":"24257","_k":"07fc57fe"},{"t":"Strong positive","_n":"251c7","_k":"eb06ee2f"},{"t":"Strong negative","why":"`r` is positive, so the direction is positive.","_n":"261b7","_k":"8d64c8a2"},{"t":"Weak positive","why":"0.92 ≥ 0.67 and positive.","_n":"27926","_k":"8f608d84"}],"why":"0.92 ≥ 0.67 and positive.","hints":["Read the sign, then the size.","|0.920| ≥ 0.67.","Strong positive."]},{"id":"a3","kind":"num","goal":3,"prompt":"M2: use `ŷ = 1.15x + 15.68` to predict cold drinks at 20 °C, to the nearest whole drink.","_a":"Alw=","label":"Cold drinks:","wrong":[{"match":38.68,"fb":"Round to the nearest whole drink."},{"match":23,"fb":"Add the intercept, 15.68."},{"match":16,"fb":"That’s the intercept, the prediction at 0 °C."},{"match":337,"fb":"Multiply the slope by 20 first, then add 15.68."}],"general":"Substitute `x = 20`: multiply the slope by 20, then add 15.68.","why":"1.15 × 20 = 23; 23 + 15.68 = 38.68.","hints":["Substitute `x = 20`.","1.15 × 20 = 23.","23 + 15.68 = 38.68, so about 39 drinks."]},{"id":"a4","kind":"chips","goal":4,"star":true,"prompt":"Sport vs mark (M1): medians 77 and 70.5, IQRs 8 and 8. Which conclusion is best?","options":[{"t":"Players tended to score higher (median about 6.5 points higher), but the middle halves overlap from 73 to 77","_n":"28936","_k":"287af3dd"},{"t":"Players had a higher median mark","why":"Mention the overlap and spread. A difference in centres matters more when the spreads are small and the boxes don’t overlap much.","_n":"29906","_k":"e8f0600c"},{"t":"Playing a sport raises marks by 6.5 points","why":"These data are observational: say ‘is associated with’ and name a possible hidden variable.","_n":"2a916","_k":"ac8af141"},{"t":"There is no difference, because the boxes overlap","why":"The centres differ; overlap means the difference isn’t clear-cut.","_n":"2b966","_k":"93e27195"}],"why":"Higher centre, big overlap: a tendency, not a clear separation.","hints":["Compare centres, then spreads.","IQRs: 73–81 vs 69–77.","Higher centre, big overlap: a tendency, not a clear separation."]},{"id":"a5","kind":"chips","goal":4,"star":true,"prompt":"M1: sport players averaged 4.0 h of screen time; non-players 5.1 h. Why does this matter for the sport vs mark comparison?","options":[{"t":"It means the mark comparison is wrong","why":"The comparison still stands; screen time is a possible common cause to name as a limitation.","_n":"2c976","_k":"b377e521"},{"t":"It proves that sport lowers screen time","why":"Observational data can’t prove cause. These data are observational: say ‘is associated with’ and name a possible hidden variable.","_n":"2d946","_k":"3ec780cd"},{"t":"Screen time could be a hidden variable linked to both sport and marks","_n":"2e956","_k":"7b1da2c6"},{"t":"It’s just an interesting extra fact","why":"Not just trivia: it’s a possible common cause.","_n":"2f9a6","_k":"cb48b052"}],"why":"Screen time differs between the groups and is linked to marks, so it could explain part of the gap.","hints":["Is screen time linked to marks in M1?","Yes: `r = -0.86` for screen time vs mark.","Screen time could be a hidden variable linked to both sport and marks."]},{"id":"a6","kind":"textchips","goal":4,"star":true,"prompt":"M2: soup vs drinks `r = -0.979`. Enter the variable you’d colour by to test a common cause, then choose the expected within-group pattern.","_a":"ExEDD0JRRVFFEBQHEA==","label":"Colour by:","pickLabel":"Within narrow temperature bands:","textWrong":"Which variable could drive both soup sales and cold-drink sales?","options":[{"t":"The soup–drinks link weakens","_n":"2g9b6","_k":"e8e5ec17"},{"t":"The soup–drinks link gets even stronger","why":"If temperature drives both, holding it nearly fixed removes most of the link.","_n":"2h986","_k":"ae5c957d"},{"t":"Soup and drinks rise together","why":"With temperature held nearly fixed, there’s little left to link them.","_n":"2i976","_k":"449db89f"},{"t":"Nothing changes: `r` stays −0.979","why":"Temperature drives both (module 38); fixing it changes the picture.","_n":"2j9a6","_k":"48fbe4ee"}],"why":"Temperature drives both (module 38). Within narrow temperature bands, the soup–drinks link weakens.","hints":["What changes from day to day that affects both?","Hot days: more drinks, less soup.","Temperature; within narrow temperature bands, the soup–drinks link weakens."]}]},{"id":"spot","type":"spot","title":"Stage 3: conclusion and limitations","summary":"Spot the error","student":"Orla","how":"","goal":[4,5],"instruction":"Orla made one mistake in each report section. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":4,"task":"Conclusion for “Is there a relationship between screen time and mark for these 20 model students?”","steps":["`r = -0.86`, so the linear relationship is strong and negative.","The line `ŷ = -2.81x + 87.20` predicts about 2.8 fewer points per extra hour.","Therefore cutting screen time by 1 hour will raise a student’s mark by 2.8 points.","Schools should limit screen time."],"_a":"Aw==","stepFb":["Correct.","Correct interpretation of the slope.","","Step 4 depends on step 3. The mistake is earlier."],"fixes":[{"t":"The relationship is moderate, not strong.","why":"0.86 is strong.","_n":"2k996","_k":"7317c6f7"},{"t":"Step 3 is correct.","why":"These data are observational: say ‘is associated with’ and name a possible hidden variable.","_n":"2l946","_k":"bdd85905"},{"t":"These are observational model data: screen time is \u003cem>associated\u003c/em> with lower marks, but a hidden variable such as sleep or homework load could explain both. An experiment would be needed to test cause.","why":"Association, not cause.","_n":"2m936","_k":"158ee804"},{"t":"Use `r^2` instead: 74% of marks are caused by screen time.","why":"`r^2` is variation explained, not causation.","_n":"2n966","_k":"468c1441"}],"hints":["What type of study produced these data?","Observational: no one was assigned screen time.","Association, not cause."]},{"id":"e2","goal":5,"task":"Limitations section for the soup investigation (M2).","steps":["The data cover only 20 days at one cafeteria.","Menu changes and holidays weren’t recorded.","Because `r = -0.991` is so strong, the results apply to every school cafeteria in Canada.","Further study: a full year at several schools."],"_a":"Aw==","stepFb":["Good: sample size and scope.","Good: possible hidden variables.","","Step 4 is a good idea but contradicts step 3. The mistake is earlier."],"fixes":[{"t":"Remove the coldest days.","why":"Don’t remove data to tidy a result.","_n":"2o956","_k":"0526210f"},{"t":"`r = -0.991` means 99.1% of soup sales are explained.","why":"`r^2 = 0.98`, and it’s still only this cafeteria.","_n":"2pa06","_k":"e35f7d75"},{"t":"Step 3 is correct.","why":"Conclusions apply to the population your sample represents. A convenience sample represents only itself.","_n":"2q9f6","_k":"f98d9dda"},{"t":"A strong `r` in one cafeteria doesn’t make the sample representative. The results describe these 20 model days; other schools may differ.","why":"Don’t generalize beyond the sample.","_n":"2rfb2","_k":"17c504ef"}],"hints":["Who or what do the data represent?","20 days, one cafeteria.","Don’t generalize beyond the sample."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What question did you investigate, and why did it interest you? Did the data surprise you?"},{"id":"j2","q":"In your own words, explain how your question decided your graphs and summaries."},{"id":"j3","q":"Explain to a classmate the most important limitation of your investigation and how you’d fix it with more time."},{"id":"j4","q":"Rate your report against the five criteria from Part 3. Which criterion is weakest, and what will you change before you present?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"You survey 50 students yourself for your investigation. That’s…","options":[{"t":"census data","why":"A census includes everyone in the population.","_n":"2sfa2","_k":"9cadc9fa"},{"t":"experimental data","why":"Nothing was assigned.","_n":"2tf92","_k":"d0ff62d5"},{"t":"primary data","why":"You collected it yourself, for your question.","_n":"2uf82","_k":"9de69d56"},{"t":"secondary data","why":"You collected it yourself.","_n":"2vf72","_k":"a9565df9"}]},"b":{"prompt":"In “a survey of 50 students from a school of 900”, the 900 students are the…","options":[{"t":"variable","why":"A variable is what’s measured.","_n":"2wf62","_k":"a9453315"},{"t":"population","why":"The whole group you want to describe.","_n":"2xf52","_k":"59d1163a"},{"t":"parameter","why":"A parameter is a number describing the population.","_n":"2yf42","_k":"8c849aa9"},{"t":"sample","why":"The 50 are the sample.","_n":"2z032","_k":"17fa7973"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Which question is investigable with data?","options":[{"t":"“Should school start later?”","why":"A value judgement. An investigable question names measurable variables and a population your data actually represent.","_n":"30022","_k":"44922a33"},{"t":"“Is there a relationship between hours of sleep and reaction time for Grade 12 students at our school?”","why":"Two measurable variables and a clear population.","_n":"31752","_k":"e9219db3"},{"t":"“Why do people dream?”","why":"Not answerable with your data. An investigable question names measurable variables and a population your data actually represent.","_n":"32762","_k":"a2de3e5c"},{"t":"“Is sleep important?”","why":"Too vague to measure. An investigable question names measurable variables and a population your data actually represent.","_n":"33772","_k":"90386e14"}]},"b":{"prompt":"Which variable is categorical?","options":[{"t":"Number of stops","why":"Numerical (discrete).","_n":"34782","_k":"b210e408"},{"t":"Type of transportation to school","why":"Its values are groups (bus, bike, car, walk).","_n":"35712","_k":"b6242cab"},{"t":"Distance (km)","why":"Numerical.","_n":"36722","_k":"b70d992c"},{"t":"Commute time (min)","why":"Numerical.","_n":"37732","_k":"1a3bd764"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Which belongs in a report’s limitations section?","options":[{"t":"“`r = -0.86`.”","why":"That’s a result.","_n":"38742","_k":"555972d0"},{"t":"“The sample was 20 students from one school, so results may not represent other schools.”","why":"A specific limitation: sample size and representativeness.","_n":"397d2","_k":"6ff61d5a"},{"t":"“The scatter plot of screen time vs mark.”","why":"That’s analysis.","_n":"3a7e2","_k":"f8355a00"},{"t":"“I enjoyed this project.”","why":"That’s reflection.","_n":"3b073","_k":"e963843b"}]},"b":{"prompt":"An actuary is a professional who…","options":[{"t":"uses probability and statistics to estimate risk, e.g. for insurance and pensions","why":"Actuaries price risk with data.","_n":"3c063","_k":"f4f67c10"},{"t":"grades students’ investigations","why":"That’s a teacher.","_n":"3d093","_k":"a017b5a3"},{"t":"writes computer games","why":"Not a data-management role.","_n":"3e083","_k":"62472c7b"},{"t":"designs survey questions only","why":"That’s part of survey research.","_n":"3f033","_k":"0c68647b"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Question: “Is there a relationship between daily high temperature and cold drinks sold?” Which analysis fits?","options":[{"t":"A histogram of temperature only","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"3g023","_k":"1b75c6e3"},{"t":"Side-by-side box plots","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"3h053","_k":"b1dc2dd3"},{"t":"Scatter plot, `r` and a line of best fit (with a residual plot)","why":"Two numerical variables: pattern, strength and line.","_n":"3i043","_k":"b5fb13c8"},{"t":"A circle graph of drinks","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"3jff3","_k":"58c54480"}]},"b":{"prompt":"Question: “Do students who bike and students who bus differ in commute time?” Which analysis fits?","options":[{"t":"A line of best fit","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"3kfe3","_k":"1a0b3eda"},{"t":"Scatter plot and `r`","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"3l012","_k":"7649da48"},{"t":"Side-by-side box plots, with a centre and a spread for each group","why":"A numerical variable across two groups.","_n":"3m022","_k":"7f631abd"},{"t":"A circle graph of transportation type","why":"That shows group sizes, not commute times. Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"3nff2","_k":"038846ff"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"M1: screen time vs mark, `r = -0.86`, `n = 20` model students. Which conclusion is best?","options":[{"t":"“No relationship, because `r` is negative.”","why":"Strong is |`r`| ≥ 0.67, moderate 0.33–0.67, weak &lt; 0.33. The sign is only the direction.","_n":"3o002","_k":"3eeb819a"},{"t":"“A moderate negative association.”","why":"Strong is |`r`| ≥ 0.67, moderate 0.33–0.67, weak &lt; 0.33. The sign is only the direction.","_n":"3p052","_k":"d6c6a0b0"},{"t":"“More screen time causes lower marks.”","why":"These data are observational: say ‘is associated with’ and name a possible hidden variable.","_n":"3q062","_k":"065423d2"},{"t":"“A strong negative association: students with more screen time tended to have lower marks.”","why":"|−0.86| ≥ 0.67, negative, and association language.","_n":"3r032","_k":"ead8c82f"}]},"b":{"prompt":"M1: sport players’ median mark 77, non-players’ 70.5; both IQRs 8; boxes overlap from 73 to 77. Which conclusion is best?","options":[{"t":"“There’s no difference, because the boxes overlap.”","why":"The centres differ; overlap means the difference isn’t clear-cut.","_n":"3s042","_k":"b0bd03c2"},{"t":"“Every sport player scored higher than every non-player.”","why":"A difference in centres matters more when the spreads are small and the boxes don’t overlap much.","_n":"3tf92","_k":"7af8819e"},{"t":"“Sport players tended to have higher marks, but the distributions overlap a lot, and the data are observational.”","why":"Higher centre, big overlap, and no causal claim.","_n":"3ufa2","_k":"87b72ddc"},{"t":"“Playing sports raises marks by 6.5 points.”","why":"These data are observational: say ‘is associated with’ and name a possible hidden variable.","_n":"3v032","_k":"46fa43e0"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"To study screen time of all Ontario teens, a student posts a survey on a gaming forum. The main problem?","options":[{"t":"The sample is too random.","why":"It isn’t random at all.","_n":"3w022","_k":"5fe85028"},{"t":"Screen time can’t be measured.","why":"It can be self-reported or tracked.","_n":"3x012","_k":"9c7c5614"},{"t":"A voluntary-response sample from gamers over-represents heavy screen users","why":"Who answers decides the result: this sample leans toward heavy screen users.","_n":"3y002","_k":"2ef72b4f"},{"t":"Nothing, if 500 people respond.","why":"Size doesn’t fix bias. Conclusions apply to the population your sample represents. A convenience sample represents only itself.","_n":"3z072","_k":"d8cbf868"}]},"b":{"prompt":"A survey asks, “You get enough sleep, don’t you?” What kind of bias does this cause?","options":[{"t":"Sampling bias","why":"That’s about who is chosen.","_n":"40062","_k":"2314ed0a"},{"t":"Response bias from a leading question","why":"The wording pushes people toward “yes”.","_n":"41052","_k":"2b1d3cbb"},{"t":"No bias","why":"The wording pushes a yes.","_n":"42042","_k":"ca883e5a"},{"t":"Non-response bias","why":"That’s when many people don’t respond.","_n":"43fb2","_k":"08074ccf"}]}},{"id":"c1","cat":"C","goal":4,"a":{"prompt":"M2: temperature vs soup, `r = -0.991`. Which conclusion is clearest and most accurate?","options":[{"t":"“There is a weak relationship.”","why":"Strong is |`r`| ≥ 0.67, moderate 0.33–0.67, weak &lt; 0.33. The sign is only the direction.","_n":"44fa2","_k":"60c88e87"},{"t":"“Soup and temperature are 99% the same.”","why":"`r` isn’t a percentage of sameness.","_n":"45fd2","_k":"3d2ed27f"},{"t":"“At this cafeteria, colder days were strongly associated with more soup sold (`r = -0.99`).”","why":"Strength, direction, association language and the right scope.","_n":"46fe2","_k":"be1120ae"},{"t":"“Cold weather causes soup sales everywhere.”","why":"These data are observational: say ‘is associated with’ and name a possible hidden variable. Conclusions apply to the population your sample represents. A convenience sample represents only itself.","_n":"47ff2","_k":"06bbdd1f"}]},"b":{"prompt":"Which limitation statement is most useful?","options":[{"t":"“Data come from 20 days at one cafeteria, and menu changes weren’t recorded, so other factors may have affected sales.”","why":"Specific: scope, and a possible hidden variable.","_n":"48002","_k":"b987cd97"},{"t":"“None: `r` is very strong.”","why":"Name specific limitations: sample size, representativeness, hidden variables, measurement, model data.","_n":"49012","_k":"897a373c"},{"t":"“There might have been human error.”","why":"Name the specific risk. Name specific limitations: sample size, representativeness, hidden variables, measurement, model data.","_n":"4a022","_k":"71ce595b"},{"t":"“The data could be wrong.”","why":"Name specific limitations: sample size, representativeness, hidden variables, measurement, model data.","_n":"4b032","_k":"e8aaea01"}]}},{"id":"c2","cat":"C","goal":3,"a":{"prompt":"Which graph best shows a relationship between two numerical variables?","options":[{"t":"Pictograph","why":"It shows counts of categories.","_n":"4c042","_k":"ae1dfbaf"},{"t":"Circle graph","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"4df52","_k":"cc506e43"},{"t":"Scatter plot","why":"Each individual is one (`x`, `y`) point.","_n":"4ef62","_k":"b1cf023a"},{"t":"Side-by-side box plots","why":"Those compare groups. Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"4f6f2","_k":"65eeae46"}]},"b":{"prompt":"Which graph best compares one numerical variable across two groups?","options":[{"t":"Scatter plot","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"4g6e2","_k":"16928df8"},{"t":"Side-by-side box plots","why":"They show each group’s centre, spread and overlap.","_n":"4h712","_k":"873c9a4f"},{"t":"Line graph","why":"There’s no time order.","_n":"4i702","_k":"4a368da4"},{"t":"Circle graph","why":"Two numerical variables: scatter plot and `r`. A numerical variable across groups: side-by-side box plots with a centre and spread for each.","_n":"4j732","_k":"73042338"}]}},{"id":"a1","cat":"A","goal":3,"a":{"prompt":"M2: `ŷ = -1.34x + 52.41` models soup vs temperature (−8 °C to 27 °C). Predict soup sold at 16 °C, to the nearest bowl.","options":[{"t":"21","why":"That’s only the −1.34 × 16 part.","_n":"4k722","_k":"79b59300"},{"t":"31","why":"−21.44 + 52.41 = 30.97.","_n":"4l752","_k":"3e035cc7"},{"t":"52","why":"That’s the intercept, the prediction at 0 °C.","_n":"4m742","_k":"1a4a214c"},{"t":"74","why":"The slope is negative: subtract.","_n":"4n772","_k":"360a0588"}]},"b":{"prompt":"M2: `ŷ = 1.15x + 15.68` models cold drinks vs temperature. Predict at 20 °C, to the nearest drink.","options":[{"t":"16","why":"That’s the intercept.","_n":"4o762","_k":"10602050"},{"t":"23","why":"Add 15.68.","_n":"4p892","_k":"27f31131"},{"t":"39","why":"23 + 15.68 = 38.68.","_n":"4q8a2","_k":"1534c66f"},{"t":"337","why":"That adds the slope and intercept first (16.83), the
