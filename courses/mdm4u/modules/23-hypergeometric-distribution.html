.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
:root{--ev-a:#2343C4;--ev-b:#0E7C7B;--ev-c:#A84C05;--ev-a-soft:rgba(35,67,196,.13);--ev-b-soft:rgba(14,124,123,.14);--ev-c-soft:rgba(168,76,5,.13);--sel-bd:#1E2A57}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
}
:root[data-theme="dark"]{--ev-a:#93AEFF;--ev-b:#5FD0CD;--ev-c:#FF9F5A;--ev-a-soft:rgba(147,174,255,.18);--ev-b-soft:rgba(95,208,205,.18);--ev-c-soft:rgba(255,159,90,.18);--sel-bd:#E6CF48}
.ev-a{color:var(--ev-a);font-weight:700}.ev-b{color:var(--ev-b);font-weight:700}.ev-c{color:var(--ev-c);font-weight:700}
.mdm-sw{display:inline-block;width:.85em;height:.85em;border-radius:2px;vertical-align:-.08em;border:1px solid var(--ink-2)}
.mdm-model{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:.05em .45em}
/* MDM4U 23: hero (urn + card + histogram), Draw without replacement (urn SVG + D7 histogram), Quality control stations,
   Count it entry, Inspection plan task. Successes --pen, failures --ink-2 (course plan §3 / build notes); binomial overlay
   outlined in --ink; simulated marks --ev-c; selections --hi-soft. */
/* radioGroup (from MDM4U 21) */
.rg-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px}
.rg-lab{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.rg.seg button + button{border-left:1.5px solid var(--ink)}
.rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.rg.seg button:disabled{opacity:.42;cursor:not-allowed}
.rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.9rem;min-height:34px;min-width:36px;text-align:center}
.rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.rg.chips button:disabled{opacity:.45;cursor:not-allowed}

/* switch (from MDM4U 21) */
.hg-sw.cc-switch{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:700 .92rem var(--font-ui);padding:4px 0;min-height:36px;text-align:left}
.hg-sw .cc-track{position:relative;flex:none;width:40px;height:22px;border-radius:11px;background:var(--paper);border:1.5px solid var(--ink-2);transition:background .2s,border-color .2s}
.hg-sw .cc-knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink-2);transition:left .2s}
.hg-sw[aria-checked="true"] .cc-track{background:var(--pen);border-color:var(--pen)}
.hg-sw[aria-checked="true"] .cc-knob{left:19px;border-color:var(--pen)}

/* hero */
.hg-heq{font-size:.78em;display:inline-flex;flex-wrap:wrap;align-items:flex-start;gap:.15em .3em;line-height:1.15}
.hg-hp{display:inline-flex;flex-direction:column;align-items:center}
.hg-hb .hg-hm{padding:0 .12em .08em;border-bottom:2px solid var(--ink-2)}
.hg-hu{font:700 .72rem/1.2 var(--font-ui);color:var(--ink-2);margin-top:.25em;white-space:nowrap}
.hg-hfig{display:grid;justify-items:center}
.hg-hsvg{display:block;width:100%;max-width:440px;height:auto}
.hg-jar{fill:var(--paper);stroke:var(--ink-2);stroke-width:2.5;stroke-linejoin:round}
.hg-s{fill:var(--pen)}
.hg-f{fill:var(--ink-2)}
.hg-lt{fill:var(--sheet);font:700 11px var(--font-ui);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hg-gone{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-dasharray:3 3}
.hg-hcnt,.hg-umult{font:700 13px var(--font-ui);fill:var(--ink);text-anchor:middle}
.hg-htray{font:700 12px var(--font-ui);fill:var(--ink-2);text-anchor:middle}
.hg-hcard{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.hg-hct{font:700 13px var(--font-math);fill:var(--ink);text-anchor:middle}
.hg-hax{stroke:var(--ink-2);stroke-width:1.5}
.hg-hbar{fill:var(--pen)}
.hg-hxl{font:13px var(--font-math);fill:var(--ink);text-anchor:middle}
.hg-hbl{font:700 12px var(--font-ui);fill:var(--ink);text-anchor:middle}

/* Explore */
.hg-pg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px 28px;align-items:start}
.hg-main,.hg-read{min-width:0}
.hg-cap{font-size:clamp(1.1rem,2.4vw,1.45rem)}
.hg-sls{display:grid;gap:2px;margin:0 0 8px}
.hg-sls .slider{margin:0 0 4px}
.hg-opts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px}
.hg-opts .rg-wrap{margin:2px 0}
.hg-urnbox{margin:6px 0 10px}
.hg-urn{max-width:420px}
.hg-usvg{display:block;width:100%;height:auto}
.hg-tray{fill:none;stroke:var(--rule);stroke-width:1.5}
.hg-ucount{margin:2px 0 6px}
.hg-btns{display:flex;flex-wrap:wrap;gap:8px}
canvas.plot.hg-plot{aspect-ratio:16/10}
.hg-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:4px 0 8px}
.hg-key{display:inline-flex;align-items:center;gap:6px}
.hg-swo{display:inline-block;width:.9em;height:.9em;border:2px dashed var(--ink);border-radius:2px}
.hg-swm{display:inline-block;width:1.1em;height:4px;background:var(--ev-c);border-radius:2px}
.hg-tbl{margin-top:10px}
@media (max-width:760px){ .hg-pg{grid-template-columns:minmax(0,1fr)} }

/* Part 3: Quality control */
.qc-tabs .rg-wrap{margin-bottom:12px}
.qc-tick{color:var(--green);font-weight:700}
.qc-task{margin:.4em 0}
.qc-build{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:10px 0;font-size:1.05rem}
.qc-c{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.qc-op{font-size:1.2rem;font-weight:700}
input.numin.qc-in,input.numin.pe-sm{width:3.6em;min-width:0;text-align:center;padding:.3em .25em}
.qc-res{font-size:1.05rem;margin:.6em 0}
.qc-fair{margin-top:10px}
.qc-fair .chips{display:flex;flex-wrap:wrap;gap:8px}
.qc-note{margin:.5em 0}
.qc-done{margin:12px 0 0}

/* Count it */
.pe-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 0}
.pe-lab{display:inline-flex;align-items:center;gap:8px}
.pe-chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}

/* Inspection plan */
.hg-conds{margin:.4em 0 0 1.2em}
.ip-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ip-fig{margin:0;min-width:0}
.ip-cap{font:700 .88rem var(--font-ui);color:var(--ink-2);margin:0 0 4px}
canvas.plot.ip-plot{aspect-ratio:4/3}
.ip-read{margin-top:10px}
@media (max-width:560px){ .ip-two{grid-template-columns:minmax(0,1fr)} }

03c/strong>. Counting with \u003cstrong>combinations\u003c/strong> gives the \u003cstrong>hypergeometric distribution\u003c/strong>.","fig":{"html":"\u003cdiv class=\"hg-hfig\" id=\"hg-hfig\">\u003c/div>"}},"goals":["I can recognize a hypergeometric situation: a fixed number of draws without replacement from a finite group with two types.","I can calculate `P(X = x)` with combinations: successes chosen × failures chosen ÷ all selections.","I can find and interpret `E(X) = ra ÷ n`.","I can build the distribution table and probability histogram, including the smallest and largest possible values of `X`.","I can compare the hypergeometric and binomial models and explain when the binomial is a good approximation.","I can solve quality-control and committee problems."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Combinations","goal":2,"prompt":"Evaluate `C(6, 2)`.","options":[{"t":"12","why":"That’s 6 × 2.","_n":"02a3","_k":"ad5fdfde"},{"t":"15","why":"6 × 5 ÷ 2.","_n":"12b3","_k":"db5e9dff"},{"t":"30","why":"That counts order. Divide by 2!.","_n":"22c3","_k":"0e1bcb96"},{"t":"36","why":"That’s 6².","_n":"3253","_k":"005453d9"}],"hints":["`n! ÷ (r!(n - r)!)`.","720 ÷ (2 × 24).","15."]},{"id":"w2","skill":"Combinations","goal":4,"prompt":"Evaluate `C(5, 0)`.","options":[{"t":"5","why":"That’s `C(5, 1)`.","_n":"4263","_k":"7dc03651"},{"t":"1","why":"There’s exactly one way to choose nothing.","_n":"5273","_k":"d4ef718a"},{"t":"0","why":"Choosing nothing is one way, not zero ways.","_n":"6283","_k":"a9fc9245"},{"t":"Undefined","why":"0! = 1, so it’s defined.","_n":"7213","_k":"dad50a99"}],"hints":["How many ways can you choose no items?","One: take none.","1."]},{"id":"w3","skill":"Probability with combinations","goal":2,"prompt":"Two people are chosen at random from 4 girls and 3 boys. What is \u003ci>P\u003c/i>(both girls)?","options":[{"t":"`2/7`","why":"`C(4, 2) ÷ C(7, 2) = 6/21`.","_n":"8223","_k":"ad5f35fe"},{"t":"`16/49`","why":"That draws with replacement. The same girl can’t be chosen twice.","_n":"912e","_k":"9f3a9ad7"},{"t":"`1/2`","why":"Girls aren’t half of the group.","_n":"a11e","_k":"6de5081c"},{"t":"`4/7`","why":"That’s one girl.","_n":"b10e","_k":"1e964872"}],"hints":["Ways to choose 2 girls?","`C(4, 2) = 6`, out of `C(7, 2) = 21`.","`2/7`."]},{"id":"w4","skill":"Dependent events","goal":1,"prompt":"Two cards are drawn without replacement. What is \u003ci>P\u003c/i>(both are hearts)?","options":[{"t":"`1/17`","why":"`13/52 × 12/51`.","_n":"c0fe","_k":"494afabd"},{"t":"`1/16`","why":"That’s with replacement.","_n":"d0ee","_k":"f374acee"},{"t":"`25/102`","why":"That adds. ‘And’ multiplies along the path.","_n":"e0de","_k":"8950c4c6"},{"t":"`1/2`","why":"Hearts are a quarter of the deck.","_n":"f0ce","_k":"9be5d5f2"}],"hints":["After a heart is drawn, how many are left?","12 of 51.","`(13/52)(12/51) = 1/17`."]},{"id":"w5","skill":"Expected value","goal":3,"prompt":"`X` takes the values 0, 1, 2 with probabilities `1/6`, `2/3`, `1/6`. Find `E(X)`.","options":[{"t":"`1/3`","why":"That averages the probabilities. Weight each value by its probability.","_n":"g0be","_k":"ecf6636a"},{"t":"`2/3`","why":"That’s a probability.","_n":"h1ae","_k":"53a4c3b5"},{"t":"1","why":"`0 + 2/3 + 2/6`.","_n":"i19e","_k":"03d1d18f"},{"t":"3","why":"That adds the values. Weight each value by its probability.","_n":"j18e","_k":"3056ad52"}],"hints":["`Σ x P(x)`.","`1(2/3) + 2(1/6)`.","1."]},{"id":"w6","skill":"Probability with combinations","goal":6,"prompt":"How many committees of 3 can be formed from 5 teachers and 4 students with exactly 1 student?","options":[{"t":"4","why":"That forgets the teachers: choose 2 of the 5 teachers too.","_n":"k19e","_k":"c4843c86"},{"t":"10","why":"That forgets the student.","_n":"l16e","_k":"576c0c26"},{"t":"40","why":"`C(4, 1) × C(5, 2) = 4 × 10`.","_n":"m17e","_k":"85952705"},{"t":"84","why":"That’s every committee of 3.","_n":"n1ce","_k":"4af0cebd"}],"hints":["Choose the student, then the teachers.","`4 × C(5, 2)`.","40."]}],"refreshers":{"Combinations":"`C(n, r)` counts unordered selections; `C(n, 0) = C(n, n) = 1`.","Probability with combinations":"\u003ci>P\u003c/i> = (ways to choose a favourable group) ÷ (ways to choose any group).","Dependent events":"Without replacement, each draw’s probability depends on what was drawn before.","Expected value":"`E(X) = Σ x P(X = x)`."}}},"explore":{"heading":"Draw without replacement","intro":"Fill the urn, choose how many to draw, and watch the distribution. Then switch on the binomial overlay to see when replacement matters.","predIntro":"Make a prediction first. Then the urn and its histogram will show you what really happens.","predictions":[{"id":"p1","start":{"n":10,"a":4,"r":3,"overlay":true,"k":2},"prompt":"With replacement (binomial), `P(X = 2) = 0.288`. Without replacement it will be…","options":[{"t":"slightly larger (0.300)","_n":"o1de","_k":"32a881f8"},{"t":"exactly the same","_n":"p1ae","_k":"b2ae7e2d"},{"t":"much smaller","_n":"q1be","_k":"af642c4f"},{"t":"0","_n":"r10e","_k":"d1719202"}],"explain":"`36/120 = 0.3`. Without replacement, the outcomes cluster more tightly around the mean of 1.2. After a success is removed, fewer successes remain, so `p` changes on every draw. Use combinations."},{"id":"p2","start":{"n":8,"a":3,"r":5},"prompt":"What is the largest possible value of `X`?","options":[{"t":"2","_n":"s11e","_k":"53c96ee6"},{"t":"3","_n":"t1ee","_k":"c6277e3a"},{"t":"5","_n":"u1de","_k":"a4b1b949"},{"t":"8","_n":"v20e","_k":"a8c68fab"}],"explain":"There are only 3 successes to draw."},{"id":"p3","start":{"n":8,"a":3,"r":6},"prompt":"What is the smallest possible value of `X`?","options":[{"t":"0","_n":"w1fe","_k":"f3d8dd75"},{"t":"1","_n":"x1ae","_k":"f2609a12"},{"t":"3","_n":"y19e","_k":"35ac500c"},{"t":"6","_n":"z1ce","_k":"9e15c6f9"}],"explain":"There are only 5 failures, so 6 draws must include at least 1 success."},{"id":"p4","start":{"n":10,"a":4,"r":3,"overlay":true,"k":2,"to":100},"prompt":"With 1000 items (400 successes), how do the hypergeometric and binomial compare?","options":[{"t":"The mean changes","_n":"101be","_k":"f0189b15"},{"t":"They’re almost identical","_n":"1116e","_k":"2b2ff15b"},{"t":"The gap gets bigger","_n":"1215e","_k":"fed28a78"},{"t":"The hypergeometric becomes uniform","_n":"1314d","_k":"029efbd7"}],"explain":"Taking 3 items from 1000 barely changes the proportion 0.4. From 10 items it matters a lot; from 10 000 it barely matters."}],"chalIntro":"Use the urn and its histogram to meet each goal, then press \u003cstrong>Check challenge\u003c/strong>. Each one has three levels of help.","challenges":[{"id":"tc1","goal":3,"prompt":"With `r = 4` draws, set `n` and `a` so that `E(X) = 2`.","why":"`E(X) = ra ÷ n = 4a ÷ n = 2` whenever `a ÷ n = 1/2`: any even `n` with `a = n ÷ 2`.","hints":["`E(X) = ra ÷ n`.","`4a ÷ n = 2`, so `a ÷ n = 1/2`.","For example, `n = 10` and `a = 5`."]},{"id":"tc2","goal":2,"prompt":"With `n = 10` and `r = 3`, choose `a` so that `P(X = 0) = 1/6`.","why":"`C(6, 3) ÷ C(10, 3) = 20/120 = 1/6`, so `a = 4`.","hints":["`X = 0` means all 3 drawn are failures: `C(10 - a, 3) ÷ 120`.","You need `C(10 - a, 3) = 20`.","`C(6, 3) = 20`, so `10 - a = 6` and `a = 4`."]},{"id":"tc3","goal":[2,6],"stretch":true,"prompt":"A box of 12 bulbs contains some defective ones. You test 3 at random. Find the \u003cstrong>smallest\u003c/strong> number of defective bulbs `a` for which \u003ci>P\u003c/i>(at least one defective found) is at least `3/4`.","why":"With `a = 5`: `1 - C(7, 3) ÷ C(12, 3) = 1 - 35/220 = 185/220 ≈ 0.841`. With `a = 4` it’s only about 0.745.","hints":["At least one = 1 − \u003ci>P\u003c/i>(none) = `1 - C(12 - a, 3) ÷ 220`.","You need `C(12 - a, 3) \u003c= 55`.","`C(8, 3) = 56` is just too big; `C(7, 3) = 35` works, so `a = 5`."]}]},"part3":{"slug":"quality","name":"Quality control","heading":"Quality control","intro":"A buyer can’t test every item in a shipment, so they test a random sample and decide. Work through three stations: build the probability, loosen the rule, then check the model against the binomial.","s1":{"scenario":"A shipment of 20 tablets has 3 defective ones. The buyer tests 4 at random and accepts the shipment if none is defective.","use":"`C(17, 4) = 2380` and `C(20, 4) = 4845`","fair":{"prompt":"Is this plan fair to the seller?","choices":[{"t":"No","fb":"Right. A shipment with only 3 bad tablets is rejected about half the time.","_n":"1415d","_k":"77832fb6"},{"t":"Yes","fb":"\u003ci>P\u003c/i>(accept) ≈ 0.491: a shipment with only 3 bad tablets is rejected about half the time.","_n":"1516d","_k":"da338c1f"}]}},"s2":{"scenario":"Same shipment, but the buyer now accepts if \u003cstrong>at most 1\u003c/strong> tablet is defective.","use":"`C(17, 4) = 2380`, `C(17, 3) = 680` and `C(20, 4) = 4845`"},"s3":{"scenario":"For a big shipment (2000 items, 300 defective, test 4), compare the exact hypergeometric chance of finding no defective items with the binomial shortcut.","takeaway":"When `r` is tiny compared with `n`, the binomial with `p = a ÷ n` is a good shortcut. From 10 items it matters a lot; from 10 000 it barely matters."},"quickCheck":{"title":"Quick check","summary":"Quality control quick check","items":[{"id":"q1","goal":2,"prompt":"`n = 6`, `a = 2`, `r = 2`. `P(X = 2)`?","choices":[{"t":"`1/15`","fb":"Right. `C(2, 2) ÷ C(6, 2) = 1/15`.","_n":"1617d","_k":"77faeb5a"},{"t":"`1/9`","fb":"`C(2, 2) ÷ C(6, 2)`. `1/9` is with replacement.","_n":"1718d","_k":"86818acf"},{"t":"`2/6`","fb":"`C(2, 2) ÷ C(6, 2)`.","_n":"1819d","_k":"f81f0eb9"},{"t":"`1/3`","fb":"`C(2, 2) ÷ C(6, 2)`.","_n":"191ad","_k":"623879cc"}]},{"id":"q2","goal":3,"prompt":"`n = 20`, `a = 5`, `r = 4`. `E(X)`?","choices":[{"t":"`4/5`","fb":"4 × 5 ÷ 20. Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"1a1bd","_k":"d666fac7"},{"t":"1","fb":"Right. 4 × 5 ÷ 20 = 1.","_n":"1b0cd","_k":"865a5a35"},{"t":"`5/4`","fb":"4 × 5 ÷ 20. Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"1c0dd","_k":"e0b137c4"},{"t":"20","fb":"4 × 5 ÷ 20. Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"1d9ad","_k":"70015665"}]},{"id":"q3","goal":5,"prompt":"When is the binomial a good approximation?","choices":[{"t":"Never","fb":"From 10 items it matters a lot; from 10 000 it barely matters.","_n":"1e99d","_k":"9e38e6b8"},{"t":"Always","fb":"From 10 items it matters a lot; from 10 000 it barely matters.","_n":"1f98d","_k":"ffbf6ad2"},{"t":"Sample tiny compared with the group","fb":"Right. From 10 items it matters a lot; from 10 000 it barely matters.","_n":"1g97d","_k":"c76789fb"},{"t":"Group tiny","fb":"From 10 items it matters a lot; from 10 000 it barely matters.","_n":"1h9ed","_k":"cf49449d"}]},{"id":"q4","goal":4,"prompt":"`n = 7`, `a = 2`, `r = 4`. Largest possible `X`?","choices":[{"t":"2","fb":"Right. Only 2 successes exist.","_n":"1i9dd","_k":"ed4e6f8e"},{"t":"3","fb":"Only 2 successes exist.","_n":"1j9cd","_k":"de538f45"},{"t":"4","fb":"Only 2 successes exist.","_n":"1k9bd","_k":"9ddab611"},{"t":"7","fb":"Only 2 successes exist.","_n":"1l92d","_k":"38952e86"}]}]}},"practice":{"activities":[{"id":"hgorbin","type":"sorter","title":"Hypergeometric or binomial?","summary":"Hypergeometric or binomial?","goal":[1,5],"noun":"scenario","txt":true,"instruction":"Sort each scenario: which model fits `X`?","boxes":[{"id":"h1","label":"Hypergeometric"},{"id":"h2","label":"Binomial"},{"id":"h3","label":"Binomial is a fine approximation","sub":"without replacement, but from a huge group"}],"items":[{"id":"i1","t":"Deal 5 cards; `X` = number of kings","_a":"RF8IRw==","why":"Dealing doesn’t put cards back, and 52 cards is a small group: each card changes the next.","hints":["Is there replacement?","If not, is the group huge?","No replacement, and only 52 cards: hypergeometric."]},{"id":"i2","t":"Roll a die 5 times; `X` = number of 6s","_a":"RF8LRw==","why":"Rolls are independent with `p = 1/6` every time.","hints":["Is there replacement?","If not, is the group huge?","Each roll starts fresh: binomial."]},{"id":"i3","t":"Choose 3 of 12 club members (5 in Grade 12) for a trip; `X` = Grade 12s","_a":"RF8IRw==","why":"Only 12 people, chosen without replacement.","hints":["Is there replacement?","If not, is the group huge?","Only 12 people, no replacement: hypergeometric."],"wrong":{"h2":"Only 12 people: each choice changes the next."}},{"id":"i4","t":"Poll 10 people from all of Ontario; `X` = people who own a canoe","_a":"RF8KRw==","why":"No one is polled twice, but 10 from millions barely changes the proportion.","hints":["Is there replacement?","If not, is the group huge?","No replacement, but millions of people: the binomial is a fine approximation."],"wrong":{"h1":"Technically yes, but 10 from millions makes replacement irrelevant."}},{"id":"i5","t":"Draw 2 marbles from a bag of 6, replacing each; `X` = red","_a":"RF8LRw==","why":"Each marble goes back, so every draw has the same chance.","hints":["Is there replacement?","If not, is the group huge?","Replaced each time: binomial."]},{"id":"i6","t":"Pick 4 lottery balls from 49 without replacement; `X` = balls matching your ticket","_a":"RF8IRw==","why":"49 balls is a small group and none goes back.","hints":["Is there replacement?","If not, is the group huge?","No replacement from 49: hypergeometric."]},{"id":"i7","t":"Test 5 bulbs from a production run of 1 000 000; `X` = defective","_a":"RF8KRw==","why":"5 from a million barely changes the defect rate.","hints":["Is there replacement?","If not, is the group huge?","No replacement, but a million bulbs: the binomial is a fine approximation."]},{"id":"i8","t":"Draw 3 tiles from a bag of 9 letter tiles (3 vowels); `X` = vowels","_a":"RF8IRw==","why":"Only 9 tiles, none put back.","hints":["Is there replacement?","If not, is the group huge?","Only 9 tiles, no replacement: hypergeometric."]}],"wrongDefault":"Is anything put back? How big is the group compared with the sample?"},{"id":"count","type":"custom","title":"Count it","summary":"Count it","goal":[2,3,6],"star":true,"instruction":"Find each probability or value. Items marked ★ are non-routine; H6 and H7 go beyond the Final Check.","how":"Type a fraction such as 7/15, a decimal (4 places if it doesn’t end) or a whole number, then press Check.","items":[{"id":"h1","goal":2,"prompt":"`n = 10`, `a = 3`, `r = 2`: find `P(X = 1)`.","_a":"VhkNU1RSUwdQAQ9TVFJTB1AA","display":"`7/15`","why":"`C(3, 1) C(7, 1) ÷ C(10, 2) = 21/45 = 7/15`.","wrong":[{"match":0.06666666666666667,"fb":"Also choose the failure: `C(7, 1)`."},{"match":0.9333333333333333,"fb":"Use combinations top and bottom, so order is ignored everywhere."}],"hints":["Choose the success, choose the failure, divide by all pairs.","`C(3, 1) × C(7, 1) = 21`; `C(10, 2) = 45`.","`21/45 = 7/15`."]},{"id":"h2","goal":2,"prompt":"Same: find `P(X = 2)`.","_a":"VhkJU1RSUwdQAQ9TVFJTB1ABDg==","display":"`1/15`","why":"`C(3, 2) ÷ C(10, 2) = 3/45 = 1/15`.","wrong":[{"match":0.09,"fb":"That’s with replacement. After a success is removed, fewer successes remain, so `p` changes on every draw. Use combinations."}],"hints":["Both drawn must be successes.","`C(3, 2) = 3`, out of `C(10, 2) = 45`.","`3/45 = 1/15`."]},{"id":"h3","goal":3,"prompt":"`n = 20`, `a = 5`, `r = 8`: find `E(X)`.","_a":"VA==","display":"2","why":"`ra ÷ n = 8 × 5 ÷ 20 = 2`.","wrong":[{"match":40,"fb":"Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`."},{"match":0.25,"fb":"Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`."}],"hints":["`E(X) = ra ÷ n`.","`8 × 5 ÷ 20`.","2."]},{"id":"h4","goal":6,"star":true,"prompt":"A committee of 4 is chosen from 6 women and 4 men. Find \u003ci>P\u003c/i>(exactly 2 women).","_a":"VhkNV1pRUgBSBQFQVVVRA14CDA==","display":"`3/7`","why":"`C(6, 2) C(4, 2) ÷ C(10, 4) = 15 × 6 ÷ 210 = 90/210 = 3/7`.","wrong":[{"match":0.07142857142857142,"fb":"Also choose the 2 men."},{"match":0.017857142857142856,"fb":"Use combinations top and bottom, so order is ignored everywhere."}],"hints":["Choose 2 women and 2 men.","`C(6, 2) = 15`, `C(4, 2) = 6`, `C(10, 4) = 210`.","`90/210 = 3/7`."]},{"id":"h5","goal":6,"star":true,"prompt":"Same committee: find \u003ci>P\u003c/i>(at least one man).","_a":"VhkAV1pRUgBSBQFQVVVRA14B","display":"`13/14`","why":"`1 - C(6, 4) ÷ C(10, 4) = 1 - 15/210 = 13/14`.","wrong":[{"match":0.07142857142857142,"fb":"That’s \u003ci>P\u003c/i>(no men)."}],"hints":["Use the complement: no men at all.","No men: `C(6, 4) ÷ C(10, 4) = 15/210`.","`1 - 1/14 = 13/14`."]},{"id":"h6","goal":2,"star":true,"kind":"fill","prompt":"5 cards dealt from a deck: find \u003ci>P\u003c/i>(exactly 2 aces). Fill in the combinations, then choose the value.","use":"`C(48, 3) = 17 296`; `C(52, 5) = 2 598 960`","_a":"PQMVV05QXR1VGwxXTlE4","display":"`C(4, 2) C(48, 3) ÷ C(52, 5) ≈ 0.040`","why":"Choose 2 of the 4 aces and 3 of the 48 non-aces, out of every 5-card hand: `6 × 17 296 ÷ 2 598 960 ≈ 0.040`.","options":[{"t":"≈ 0.40","why":"Check the decimal: 103 776 ÷ 2 598 960 is about 0.04.","_n":"1m91d","_k":"e69ed088"},{"t":"≈ 0.0067","why":"That leaves out the `C(4, 2) = 6` ways to choose the aces.","_n":"1na0d","_k":"10d78dea"},{"t":"≈ 0.0000023","why":"That’s `C(4, 2) ÷ C(52, 5)`. The other `r - x` items must be failures. Count those choices too.","_n":"1oa1d","_k":"e18b5a56"},{"t":"≈ 0.040","why":"`6 × 17 296 ÷ 2 598 960 ≈ 0.040`.","_n":"1p9ed","_k":"c3176552"}],"hints":["Choose 2 of the 4 aces.","The other 3 cards come from the 48 non-aces.","6 × 17 296 ÷ 2 598 960 ≈ 0.040."]},{"id":"h7","goal":2,"star":true,"prompt":"A bag of 8 marbles has some red ones. Two are drawn; \u003ci>P\u003c/i>(both red) = `3/28`. How many are red?","_a":"VQ==","display":"3","why":"`C(3, 2) ÷ C(8, 2) = 3/28`.","wrong":[{"match":4,"fb":"`C(4, 2) ÷ 28 = 6/28`."}],"hints":["`P = C(a, 2) ÷ C(8, 2) = C(a, 2) ÷ 28`.","You need `C(a, 2) = 3`.","`C(3, 2) = 3`, so `a = 3`."]}]},{"id":"spot","type":"spot","title":"Spot the error","summary":"Spot the error","student":"Yael","how":"","goal":[2,3,5],"instruction":"Yael made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":2,"task":"A bag has 5 red and 5 blue marbles. Draw 3 without replacement. Find \u003ci>P\u003c/i>(exactly 2 red).","steps":["`n = 10`, `a = 5`, `r = 3`, `x = 2`.","`P = C(5, 2) ÷ C(10, 3)`.","`= 10/120 = 1/12`."],"_a":"Vw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"`C(10, 2) ÷ C(10, 3)`.","why":"Choose reds from the 5 reds.","_n":"1q9fd","_k":"ebd7960b"},{"t":"`C(5, 2) × C(5, 1) ÷ C(10, 3) = 50/120 = 5/12`.","why":"The third marble must be blue: `C(5, 1)` ways. The other `r - x` items must be failures. Count those choices too.","_n":"1r9cd","_k":"9e7e00da"},{"t":"Step 2 is correct.","why":"The third marble must be blue: `C(5, 1)` ways.","_n":"1s9dd","_k":"96e517cf"},{"t":"`C(5, 2) × (1/2)^3`.","why":"Don’t mix counting with a binomial probability.","_n":"1t9ad","_k":"773fa855"}],"hints":["What colour is the third marble?","Blue: choose 1 of 5.","`50/120 = 5/12`."]},{"id":"e2","goal":5,"task":"Two cards are drawn without replacement. Find \u003ci>P\u003c/i>(both aces).","steps":["The first card is an ace with probability `4/52`.","The draws are independent, so `P = (4/52)^2`.","`= 1/169`."],"_a":"Vw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2."],"fixes":[{"t":"Step 2 is correct.","why":"Without replacement, the draws are dependent. After a success is removed, fewer successes remain, so `p` changes on every draw. Use combinations.","_n":"1u9bd","_k":"68c0dfe3"},{"t":"`C(4, 2) ÷ C(52, 2) = 6/1326 = 1/221` (or `4/52 × 3/51`).","why":"Without replacement, the draws are dependent: only 3 aces remain for the second card.","_n":"1v98d","_k":"4ce6a175"},{"t":"`(4/52) + (4/52)`.","why":"‘And’ multiplies.","_n":"1w99d","_k":"81104c7e"},{"t":"`(4/52)(4/51)`.","why":"Only 3 aces remain.","_n":"1x86d","_k":"a98cce4d"}],"hints":["After an ace is drawn, how many aces are left?","3 of 51.","`4/52 × 3/51 = 1/221`."]},{"id":"e3","goal":3,"task":"A jar has 12 marbles, 4 red. Draw 3. Find the expected number of red marbles.","steps":["`r = 3`, `a = 4`, `n = 12`.","`E(X) = ra = 12`.","So about 12 red marbles are expected."],"_a":"Vw==","stepFb":["Step 1 is correct.","","Step 3 follows step 2, but it’s impossible: only 3 are drawn."],"fixes":[{"t":"`E(X) = r ÷ a = 3/4`.","why":"That’s not a formula for `E`.","_n":"1y85d","_k":"00ed26c7"},{"t":"Step 2 is correct.","why":"`E` can’t exceed the 3 marbles drawn. Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"1z88d","_k":"785a0ea1"},{"t":"`E(X) = a ÷ n = 1/3`.","why":"That’s for one draw.","_n":"2087d","_k":"3045e519"},{"t":"`E(X) = ra ÷ n = 12 ÷ 12 = 1`.","why":"Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"218ad","_k":"de230f11"}],"hints":["Each draw is red with probability `4/12`.","Three draws: `3 × 4/12`.","1."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you on the urn: the limits on `X`, or how close the binomial got for big groups?"},{"id":"j2","q":"In your own words, explain the three combinations in the hypergeometric formula."},{"id":"j3","q":"Explain to a friend how to decide between the binomial and hypergeometric models."},{"id":"j4","q":"Which step still slows you down: counting the failures, finding the possible values, or interpreting `E`? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":1,"a":{"prompt":"Which variable is hypergeometric?","options":[{"t":"5 people are chosen with replacement from the club; `X` = seniors","why":"With replacement, it’s binomial.","_n":"2289d","_k":"fac01275"},{"t":"A die is rolled until a 6; `X` = rolls before it","why":"That’s geometric.","_n":"238cd","_k":"5309b69e"},{"t":"A coin is tossed 5 times; `X` = heads","why":"That’s binomial.","_n":"248bd","_k":"98f9c368"},{"t":"5 people are chosen from a club of 12 (7 seniors); `X` = seniors chosen","why":"Fixed number of draws, no replacement, small group.","_n":"258ed","_k":"aafb9721"}]},"b":{"prompt":"What makes a situation hypergeometric rather than binomial?","options":[{"t":"Counting successes","why":"Both do.","_n":"268dd","_k":"1ea7106c"},{"t":"Two outcomes per trial","why":"Both have this.","_n":"279cc","_k":"c2fd4120"},{"t":"Drawing without replacement from a small, finite group","why":"Each draw changes what’s left, so the trials are dependent.","_n":"289dc","_k":"122cf4e3"},{"t":"A fixed number of trials","why":"Both models have this.","_n":"299ec","_k":"fa4f3a34"}]}},{"id":"k2","cat":"K","goal":2,"a":{"prompt":"`n = 8`, `a = 3`, `r = 2`. Find `P(X = 1)`.","options":[{"t":"`3/28`","why":"Also choose the failure.","_n":"2a9fc","_k":"45e5d4eb"},{"t":"`3/8`","why":"That’s one draw.","_n":"2b98c","_k":"9bd25eee"},{"t":"`15/32`","why":"That’s `2(3/8)(5/8)`, with replacement.","_n":"2c99c","_k":"5d678b5a"},{"t":"`15/28`","why":"`C(3, 1) C(5, 1) ÷ C(8, 2) = 15/28`.","_n":"2d9ac","_k":"36d7242e"}]},"b":{"prompt":"`n = 9`, `a = 4`, `r = 2`. Find `P(X = 2)`.","options":[{"t":"`2/27`","why":"That divides `C(4, 2)` by 81, mixing two methods. Use combinations top and bottom, so order is ignored everywhere.","_n":"2e9bc","_k":"e6f5193b"},{"t":"`1/6`","why":"`C(4, 2) ÷ C(9, 2) = 6/36`.","_n":"2f94c","_k":"5bbb2b09"},{"t":"`16/81`","why":"With replacement.","_n":"2g95c","_k":"147132da"},{"t":"`4/9`","why":"That’s one draw.","_n":"2ha2c","_k":"c88915a2"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"`n = 15`, `a = 6`, `r = 5`. Find `E(X)`.","options":[{"t":"0.4","why":"That’s `a ÷ n`, for one draw.","_n":"2ia1c","_k":"29603c48"},{"t":"2","why":"5 × 6 ÷ 15.","_n":"2ja0c","_k":"244c0c89"},{"t":"2.5","why":"That’s `r ÷ 2`.","_n":"2k9fc","_k":"f179e441"},{"t":"30","why":"Divide by `n`.","_n":"2l9ec","_k":"cd85910d"}]},"b":{"prompt":"`n = 24`, `a = 8`, `r = 6`. Find `E(X)`.","options":[{"t":"`1/3`","why":"Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"2m9dc","_k":"88139f71"},{"t":"2","why":"6 × 8 ÷ 24.","_n":"2n9cc","_k":"631f4aaa"},{"t":"3","why":"That’s `r ÷ 2`.","_n":"2o9bc","_k":"437a0899"},{"t":"48","why":"Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"2p9ac","_k":"e7afe52d"}]}},{"id":"t1","cat":"T","goal":2,"a":{"prompt":"A class of 10 has 4 left-handed students. 3 are chosen at random. Find \u003ci>P\u003c/i>(at least one left-handed student).","options":[{"t":"`1/6`","why":"That’s \u003ci>P\u003c/i>(none).","_n":"2q99c","_k":"31448ef0"},{"t":"`1/2`","why":"That’s \u003ci>P\u003c/i>(exactly one) = `60/120`.","_n":"2r920","_k":"f7b21361"},{"t":"`98/125`","why":"That’s `1 - 0.6^3`, with replacement.","_n":"2s910","_k":"8c13db1f"},{"t":"`5/6`","why":"`1 - C(6, 3) ÷ C(10, 3) = 1 - 20/120`.","_n":"2t940","_k":"dabfb972"}]},"b":{"prompt":"A box of 12 bulbs has 3 defective. Two are tested. Find \u003ci>P\u003c/i>(at least one defective).","options":[{"t":"`9/22`","why":"That’s \u003ci>P\u003c/i>(exactly one) = `27/66`.","_n":"2u930","_k":"a040250f"},{"t":"`7/16`","why":"That’s `1 - (3/4)^2`, with replacement.","_n":"2v8e0","_k":"91a0b7b1"},{"t":"`5/11`","why":"`1 - C(9, 2) ÷ C(12, 2) = 1 - 36/66`.","_n":"2w8d0","_k":"8b81ce96"},{"t":"`6/11`","why":"That’s \u003ci>P\u003c/i>(none).","_n":"2x900","_k":"dc31ea05"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A lake holds 1000 fish, 200 of them tagged. You catch 5. Why is the binomial with `p = 0.2` a good approximation?","options":[{"t":"Fish are thrown back between catches","why":"The question says nothing about that, and it isn’t needed.","_n":"2y8f0","_k":"dedf2e25"},{"t":"Removing 5 fish barely changes the proportion tagged, so the catches are nearly independent","why":"5 is tiny compared with 1000.","_n":"2z9a0","_k":"2cd66c2d"},{"t":"Because 0.2 is small","why":"Group size, not `p`, decides this.","_n":"30990","_k":"c3fb61a3"},{"t":"The binomial is always exact","why":"From 10 items it matters a lot; from 10 000 it barely matters.","_n":"318c0","_k":"bda22c6f"}]},"b":{"prompt":"In which case is the binomial a \u003cstrong>poor\u003c/strong> approximation to the hypergeometric?","options":[{"t":"Drawing 3 people from all of Canada","why":"Huge group.","_n":"328d0","_k":"aa931e43"},{"t":"Drawing 6 people from 10 000","why":"Barely changes the proportion.","_n":"338a0","_k":"2c1c979f"},{"t":"Drawing 2 items from 5000","why":"Tiny sample.","_n":"348b0","_k":"9693e9f3"},{"t":"Drawing 6 cards from a set of 10","why":"Each draw changes a small group a lot.","_n":"35900","_k":"fa5e6228"}]}},{"id":"t3","cat":"T","goal":4,"a":{"prompt":"A jar has 10 candies, `a` of them red. Two are drawn without replacement, and \u003ci>P\u003c/i>(both red) = `1/15`. Find `a`.","options":[{"t":"2","why":"`C(2, 2) ÷ 45 = 1/45`.","_n":"36910","_k":"ba11bab1"},{"t":"3","why":"`C(a, 2) ÷ 45 = 1/15`, so `C(a, 2) = 3`.","_n":"378e0","_k":"1bbcd54c"},{"t":"4","why":"`C(4, 2) ÷ 45 = 2/15`.","_n":"388f0","_k":"8ec9abdb"},{"t":"5","why":"`C(5, 2) ÷ 45 = 2/9`.","_n":"39940","_k":"9144cd83"}]},"b":{"prompt":"A box has 12 items, `a` of them defective. Two are tested, and \u003ci>P\u003c/i>(both defective) = `1/11`. Find `a`.","options":[{"t":"3","why":"`C(3, 2) ÷ 66 = 1/22`.","_n":"3a950","_k":"969a88fa"},{"t":"4","why":"`C(a, 2) ÷ 66 = 1/11`, so `C(a, 2) = 6`.","_n":"3b260","_k":"63009060"},{"t":"5","why":"`C(5, 2) ÷ 66 = 5/33`.","_n":"3c250","_k":"53828e4d"},{"t":"6","why":"`C(6, 2) ÷ 66 = 5/22`.","_n":"3d240","_k":"e5f7cfb7"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is the best explanation of why drawing without replacement changes the probabilities?","options":[{"t":"“It only changes things if the first draw is a failure.”","why":"Both successes and failures change the next draw.","_n":"3e230","_k":"dc0d13cd"},{"t":"“Once a success is removed, fewer successes remain, so the chance of a success on the next draw goes down. The draws are dependent.”","why":"Each draw changes what’s left.","_n":"3f220","_k":"01a58380"},{"t":"“Without replacement, every draw has the same probability.”","why":"That’s only true with replacement.","_n":"3g210","_k":"26a97705"},{"t":"“Without replacement, the probabilities no longer add to 1.”","why":"They still do.","_n":"3h200","_k":"d229999f"}]},"b":{"prompt":"Which is the best explanation of why `E(X) = ra ÷ n` for the hypergeometric?","options":[{"t":"“Because the most likely value is `ra ÷ n`.”","why":"`E` is an average, not a mode.","_n":"3i1f0","_k":"20093359"},{"t":"“Considered on its own, each of the `r` draws is a success with probability `a ÷ n`. Expected values add, so `E = r × a ÷ n`.”","why":"Expected values add even when the draws are dependent.","_n":"3j1e0","_k":"e132ff0e"},{"t":"“Because the draws are independent.”","why":"They aren’t; expected values add anyway.","_n":"3k1d0","_k":"bbb1a9cd"},{"t":"“Because `E` is always `ra`.”","why":"Each draw is a success with probability `a ÷ n`, and there are `r` draws: `ra ÷ n`.","_n":"3l200","_k":"5bf3053b"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which table shows the hypergeometric distribution for `n = 6`, `a = 2`, `r = 2`?","options":[{"t":"0: `6/15` · 1: `8/15` · 2: `4/15`","why":"These add to `18/15`, more than 1.","_n":"3m210","_k":"32648ff7"},{"t":"0: `4/9` · 1: `4/9` · 2: `1/9`","why":"That’s the binomial with `p = 1/3`.","_n":"3n220","_k":"e47d8abb"},{"t":"0: `1/3` · 1: `1/3` · 2: `1/3`","why":"The values aren’t equally likely.","_n":"3o230","_k":"4c1935ef"},{"t":"0: `6/15` · 1: `8/15` · 2: `1/15`","why":"`C(4, 2)`, `C(2, 1) C(4, 1)`, `C(2, 2)`, each out of 15.","_n":"3p1c0","_k":"6e4118ce"}]},"b":{"prompt":"Which table shows the hypergeometric distribution for `n = 5`, `a = 3`, `r = 2`?","options":[{"t":"0: `1/10` · 1: `6/10` · 2: `3/10
