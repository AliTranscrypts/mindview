.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 21: hero sign, lab layout, factor tiles (N26), division board (N22), microscope, matching, missing numbers. Tokens only. */
.h21-sign{background:var(--hi-soft);border-radius:4px;padding:0 .1em}
.h21-sign.pulse{animation:h21-pulse .6s ease-in-out 2}
@keyframes h21-pulse{50%{background:var(--hi);color:var(--hi-ink)}}
.h21-end{display:block;margin-top:4px}

/* lab layout: graph left; controls and readout right */
.pg.h21{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-areas:"graph ctrl" "graph read"}
.h21 [hidden]{display:none!important}
.h21-sub{font:400 1.35rem/1.3 var(--font-math);min-height:1.3em;margin:-2px 0 6px;overflow-wrap:anywhere}
.h21-sub .m{white-space:normal}
.h21-sub.fade{animation:h21-fade .5s ease-out}
@keyframes h21-fade{from{opacity:0;transform:translateY(-4px)}}
.h21-zoom{margin-top:8px;align-items:center}
.h21-gt{margin-top:8px}
.h21-gt .tbl-wrap{margin-top:8px}
.h21-read dd{line-height:1.45}
.h21-read [data-r].flash{animation:h21-flash 1s ease-out}
@keyframes h21-flash{0%,60%{background:var(--hi-soft)}100%{background:transparent}}
.h21-st{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.h21-stl{font-weight:700;font-size:.92rem}
.h21-p2v{display:inline-block;min-width:2em;text-align:center;font:600 1.15rem var(--font-math)}
.h21-bh{margin:12px 0 4px;font-size:1rem}
.h21-say{min-height:1.5em;margin:6px 0 0}
#h21-mode{margin-bottom:8px}

/* N26 factor tiles */
.ft{position:relative;display:grid;gap:6px;padding:4px 0;animation:h21-fade .4s ease-out}
.ft.hid{display:none}
.ft-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:48px;position:relative;z-index:1}
.ft-lab{font:700 .8rem var(--font-ui);color:var(--ink-2);min-width:3.3em}
.ft-bar{border-top:2.5px solid var(--ink);margin:2px 0}
.ft-const{display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.ft-cl{font:700 .66rem var(--font-ui);color:var(--ink-2);white-space:nowrap}
.ft-cb{display:inline-flex;align-items:center;gap:3px}
.ft-cv{display:inline-block;min-width:1.4em;text-align:center;font:600 1.2rem var(--font-math)}
.ft-cv.one{color:var(--ink-2);font-weight:400}
.ft-tile{display:inline-flex;align-items:center;gap:2px;border:2px solid var(--rule);border-radius:10px;background:var(--sheet);padding:3px;min-height:44px;position:relative;transition:transform .4s ease,opacity .2s ease,box-shadow .2s ease}
.ft-tile.match{background:var(--hi-soft);border-color:var(--hi)}
.ft-tile.glow{box-shadow:0 0 0 4px var(--hi)}
.ft-tile.slide[data-row="top"],.ft-tile.struck[data-row="top"]{transform:translateY(5px)}
.ft-tile.slide[data-row="bot"],.ft-tile.struck[data-row="bot"]{transform:translateY(-5px)}
.ft-tile.striking,.ft-tile.struck{opacity:.3}
.ft-tile.striking::after,.ft-tile.struck::after{content:"";position:absolute;left:6px;right:6px;top:50%;border-top:2.5px solid var(--ink);transform:rotate(-16deg);pointer-events:none}
.ft-tile.striking::after{animation:h21-strike .2s ease-out}
@keyframes h21-strike{from{right:100%}}
.ft-tile.pulse{animation:h21-pulse2 .6s ease-in-out 3}
@keyframes h21-pulse2{50%{background:var(--hi);box-shadow:0 0 0 4px var(--hi)}}
.ft-tile.drop{animation:h21-drop .5s ease-out}
@keyframes h21-drop{from{opacity:0;transform:translateY(-28px)}}
.ft-f{font:400 1.18rem var(--font-math);padding:0 4px;white-space:nowrap}
.ft-b{min-width:32px;min-height:32px;border:1.5px solid var(--rule);border-radius:7px;background:var(--sheet);color:var(--ink);font-weight:700;font-size:1rem;padding:0}
.ft-b:disabled{opacity:.4}
.ft-x{min-width:26px;min-height:26px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);font-size:1rem;padding:0}
.ft-x:hover{color:var(--red)}
.ft-add{padding:.35em .7em}
.ft-links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.ft-links line{stroke:var(--ink-2);stroke-width:1.5}

/* N22 division board (from MHF4U 11) */
.sg-wrap{position:relative;overflow-x:auto;padding:2px 2px 4px;border-radius:6px}
.sg-wrap:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
table.sg{border-collapse:collapse;font-family:var(--font-math);font-size:1.18rem}
table.sg th,table.sg td{min-width:46px;height:2.2em;padding:2px 6px;text-align:center;vertical-align:middle}
table.sg thead th,table.sg thead td{font:700 .72rem var(--font-ui);color:var(--ink-2);height:auto;padding-bottom:4px}
table.sg thead th .m{font-size:1.05rem;font-weight:400;color:var(--ink-2)}
.sg-c{font-size:.66rem}
table.sg tbody th{min-width:54px;font-weight:400}
.sg-top th,.sg-mid th{border-right:2px solid var(--ink)}
.sg-mid td{border-bottom:2px solid var(--ink);color:var(--ink-2)}
.sg-box{display:inline-block;min-width:1.9em;padding:.05em .3em;border:2px solid var(--ink);border-radius:3px;background:var(--sheet)}
table.sg td.hl{background:var(--hi-soft)}
table.sg td.q.fin{font-weight:700}
table.sg td.sg-rem.fin{background:var(--hi);color:var(--hi-ink);outline:2px solid var(--ink);outline-offset:-3px;border-radius:4px;font-weight:700}
.sg-svg{position:absolute;left:0;top:0;pointer-events:none;color:var(--ink-2);overflow:visible}
.sg-arrow{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:300;stroke-dashoffset:300;animation:h21-draw .45s ease-out forwards}
@keyframes h21-draw{to{stroke-dashoffset:0}}

/* Part 3 microscope */
.mc-fn{font-size:clamp(1.3rem,3.4vw,1.8rem)}
.mc-main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px 26px;align-items:start;margin-top:10px}
.mc-ask{font-weight:700;margin:12px 0 6px}
.mc-side h3{margin:0 0 8px;font-size:1.05rem}
.mc-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mc-cols h4{margin:0 0 6px;font-size:.85rem;color:var(--ink-2)}
.mc-chips{display:grid;gap:6px;min-height:40px;border:1.5px dashed var(--rule);border-radius:8px;padding:6px}
.mc-chip{display:block;border:1.5px solid var(--green);background:var(--good-bg);border-radius:8px;padding:4px 8px;font-size:.9rem;overflow-wrap:anywhere}
.mc-chip.chg{border-color:var(--rule);background:var(--sheet)}
.mc-chip .tag{font-size:.7rem}
.mc-score{font-weight:700;margin-top:10px}
#mc-tbl{margin-top:8px}

/* Practice 1: graph matching (from MHF4U 20) */
.mg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,2fr);gap:14px 18px;margin-top:12px}
.mg h4{margin:0 0 6px;color:var(--ink-2);font-size:.85rem}
.mg-eqrow{display:grid;gap:8px}
.mg-eq .m{font-size:1.1em}
.mg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mg-th{display:grid;gap:4px;text-align:left;width:100%;border:2px solid var(--rule);background:var(--sheet);border-radius:8px;padding:6px;min-width:0;color:var(--ink)}
.mg-th:not(:disabled):hover{border-color:var(--pen)}
.mg-th.done{border-color:var(--green);background:var(--good-bg)}
.mg-tag{font-weight:700;font-size:.85rem}
.mg-c{border:0!important;border-radius:4px}
.mg-eqd{font-size:.9rem;overflow-wrap:anywhere}
.mg-eqd:empty{display:none}
.mg-eqd .pair-n,.mg-eq .pair-n{font-weight:700;color:var(--green)}
.mg-eq .pair-n:empty{display:none}

/* Practice 2: missing numbers; task */
.mn-frame{font:400 1.25rem/2.4 var(--font-math);display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:6px 0}
.mn-in{width:4.6em;font:400 1.05rem var(--font-math);text-align:center}
.tk-h{margin:0 0 6px}
#tk-read{margin-top:8px}

@media (max-width:820px){
  .pg.h21{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
  .mc-main{grid-template-columns:minmax(0,1fr)}
  .mg{grid-template-columns:minmax(0,1fr)}
  .mg-eqrow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .mg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mg-eqrow{grid-template-columns:minmax(0,1fr)}
  .ft-f{font-size:1.08rem;padding:0 2px}
  table.sg{font-size:1.05rem}
  table.sg th,table.sg td{min-width:40px;padding:2px 4px}
  .mn-frame{font-size:1.12rem}
}
@media (prefers-reduced-motion:reduce){
  .ft,.ft-tile,.h21-sub.fade,.h21-read [data-r].flash,.sg-arrow,.ft-tile.pulse,.ft-tile.drop,.ft-tile.striking::after,.h21-sign.pulse{animation:none!important;transition:none!important}
  .sg-arrow{stroke-dashoffset:0}
}
