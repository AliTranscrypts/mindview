.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 09: hero secant table, Explore secant table, linked panels (slope tracker), sign strip, ramp sliders */
.hero-sec{display:grid;gap:10px}
.hero-tbl table.vt{font-size:.98rem}
.hero-tbl table.vt th,.hero-tbl table.vt td{padding:4px 10px}
.sx-tbl{margin:0 0 14px}
.sx-tcap{margin:0 0 4px}
.sx-tbl .tbl-wrap{max-height:15rem;overflow-y:auto}
.sx-tbl table.vt td{font-size:.98rem}
.pg-ctrl .seg-wrap{margin-top:8px}
.sx-pl{margin-top:10px}
.sx-pl output{color:var(--ink)}
canvas.plot.half{aspect-ratio:8/3}
.lp-panel + .lp-panel{margin-top:6px}
.sg-strip{display:flex;gap:4px;overflow-x:auto;align-items:stretch;padding:2px 2px 6px}
.sg-st{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--rule);background:var(--sheet);color:var(--ink-2);border-radius:6px;padding:.35em .5em;font-size:.8rem;font-weight:700;white-space:nowrap}
.sg-st b{font:700 1.25rem/1 var(--font-math);color:var(--ink);min-height:1.1em}
.sg-st.on{border-color:var(--ink);background:var(--hi-soft);color:var(--ink)}
.sg-st:not(:disabled):hover,.sg-pt:not(:disabled):hover{border-color:var(--pen)}
.sg-pt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:38px;border:1.5px dashed var(--ink-2);background:var(--paper);color:var(--ink);border-radius:6px;padding:.2em .3em;font-size:.78rem;line-height:1.15}
.sg-pt b{font:700 1.1rem/1.1 var(--font-math);color:var(--ink-2)}
.sg-pt.on{border-style:solid;border-color:var(--ink);background:var(--hi-soft)}
.sg-pt.on b{color:var(--ink)}
.sg-lines{margin:8px 0 0}
.sg-lines p{margin:2px 0}
.rp-sl .slider output{color:var(--ink)!important}
.rp-sl input[type=range]{accent-color:var(--ink)!important}
@media (max-width:820px){
  .pg.sx{grid-template-areas:"graph" "tbl" "ctrl" "read"}
  .pg.sx .pg-read{display:contents}
  .pg.sx .sx-tbl{grid-area:tbl;margin:0}
  .pg.sx .pg-read > dl.read{grid-area:read}
  .sx-tbl .tbl-wrap{max-height:12.5rem}
}

the 6 Trig Functions","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"95d5f840","content":{"id":"09-instantaneous-rate-of-change","kind":"topic","title":"Instantaneous rate of change","topic":"Instantaneous Rate of Change","readyTopic":"instantaneous rates of change","hero":{"eq":"\u003cspan style=\"font-style:normal\">slope = ?\u003c/span>","eqLabel":"slope equals what?","eqSize":"md","headline":"How fast, right now?","text":"A speedometer shows your speed at this instant, not your average for the trip. On a graph, the \u003cstrong>instantaneous rate of change\u003c/strong> at a point is the slope of the \u003cstrong>tangent\u003c/strong> there. You can’t compute a slope from one point, so you \u003cstrong>estimate\u003c/strong> it: take secants from `P` to closer and closer points `Q`, and watch their slopes settle.","fig":{"html":"\u003cdiv class=\"hero-sec\">\u003ccanvas class=\"plot square\" id=\"hero-plot\" role=\"img\" aria-label=\"The parabola y = x squared with a fixed point P at (3, 9). A point Q slides toward P along the curve and the secant through P and Q is redrawn at each stop.\">\u003c/canvas>\u003cdiv id=\"hero-tbl\" class=\"hero-tbl\" aria-live=\"polite\">\u003c/div>\u003c/div>"}},"goals":["I can estimate an instantaneous rate of change using secants over shrinking intervals.","I can explain the instantaneous rate as the slope of the tangent, and the average rate as the slope of a secant.","I can tell from a graph where the instantaneous rate is positive, negative or zero.","I can interpret an instantaneous rate with units in a real situation.","I can compare instantaneous and average rates, and use centred intervals for better estimates.","I can sketch or choose a graph from a description of how its rate changes."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Average rate","goal":2,"prompt":"Average rate of change of `f(x) = x^2` from `x = 3` to `x = 5`?","options":[{"t":"1/8","why":"`Δy` on top.","_n":"0ddc","_k":"eb709bfb"},{"t":"8","why":"(25 − 9)/(5 − 3) = 16/2.","_n":"1dac","_k":"95bb75c4"},{"t":"16","why":"16 is `Δy`.","_n":"2dbc","_k":"5bad13ef"},{"t":"17","why":"(9 + 25)/2 is an average of heights.","_n":"3e0c","_k":"c7f1808b"}],"hints":["Find `f(3)` and `f(5)`.","9 and 25; `Δx` = 2.","16 ÷ 2 = 8."]},{"id":"w2","skill":"Average rate","goal":2,"prompt":"A secant through (1, 4) and (1.5, 5) has what slope?","options":[{"t":"0.5","why":"Rise ÷ run: 1 ÷ 0.5.","_n":"4e1c","_k":"b29c3da9"},{"t":"1","why":"Divide by the run, 0.5.","_n":"5dec","_k":"10ae2be7"},{"t":"2","why":"1 ÷ 0.5 = 2.","_n":"6dfc","_k":"c0fd82ac"},{"t":"5","why":"5 is a `y`-value.","_n":"7d4c","_k":"7fce8cd8"}],"hints":["Rise and run?","Rise 1, run 0.5.","1 ÷ 0.5 = 2."]},{"id":"w3","skill":"Decimals","goal":1,"prompt":"What is 3.1²?","options":[{"t":"6.2","why":"Squaring means 3.1 × 3.1.","_n":"8d5c","_k":"ae5a286a"},{"t":"9.01","why":"(3 + 0.1)² = 9 + 2(3)(0.1) + 0.01.","_n":"9ea8","_k":"9a6cee99"},{"t":"9.1","why":"0.1 also matters: 3.1² = 9 + 0.6 + 0.01.","_n":"ae98","_k":"76218379"},{"t":"9.61","why":"3.1 × 3.1 = 9.61.","_n":"bec8","_k":"53bf7bbb"}],"hints":["Write 3.1 as 3 + 0.1.","(3 + 0.1)² = 9 + 0.6 + 0.01.","9.61."]},{"id":"w4","skill":"Decimals","goal":1,"prompt":"What is 0.61 ÷ 0.1?","options":[{"t":"0.061","why":"÷ 0.1 makes it bigger.","_n":"ceb8","_k":"22348324"},{"t":"0.51","why":"Divide, don’t subtract.","_n":"dee8","_k":"25a5f774"},{"t":"6.1","why":"Dividing by 0.1 multiplies by 10.","_n":"eed8","_k":"8cd9f8e3"},{"t":"61","why":"That’s ÷ 0.01.","_n":"ff08","_k":"1d74000a"}],"hints":["How many 0.1s are in 0.61?","÷ 0.1 is × 10.","6.1."]},{"id":"w5","skill":"Reading graphs","goal":3,"prompt":"On a distance–time graph, the curve gets steeper as time goes on. What is happening?","options":[{"t":"It is moving at a steady speed.","why":"Steady speed would be a straight line.","_n":"gef8","_k":"c768abec"},{"t":"It is going back toward the start.","why":"Going back would make the distance fall.","_n":"hf28","_k":"748083fe"},{"t":"The object is speeding up.","why":"Steeper means more distance per unit of time.","_n":"if18","_k":"2a52ee83"},{"t":"It is slowing down.","why":"A steeper graph covers more distance each second.","_n":"j787","_k":"19033514"}],"hints":["Steepness = speed.","Is the steepness growing?","Yes: speeding up."]},{"id":"w6","skill":"Reading graphs","goal":3,"prompt":"At the top of a hill-shaped graph, which way does the graph go just before and just after?","options":[{"t":"Down before, up after","why":"That’s a low point.","_n":"k797","_k":"35bcc94c"},{"t":"Up on both sides","why":"After the top it must fall.","_n":"l7a7","_k":"415994cb"},{"t":"Up just before, down just after","why":"The peak is where rising turns into falling.","_n":"m7b7","_k":"1dd4194a"},{"t":"Level on both sides","why":"Only at the very top is it level.","_n":"n7c7","_k":"4b0765bf"}],"hints":["Trace the hill with your finger.","Climb, top, descend.","Up, then down."]}],"refreshers":{"Average rate":"`{f(b) - f(a)}/{b - a}`: the slope of the secant through the two points.","Decimals":"Squaring 3 + 0.1 gives 9 + 0.6 + 0.01 = 9.61. Dividing by 0.1 multiplies by 10; by 0.01, by 100.","Reading graphs":"Steeper means changing faster. At a peak or valley the graph is momentarily level."}}},"explore":{"heading":"Secant-to-tangent zoom","intro":"`P` stays put. Slide `Q` toward it and watch the secant slopes settle in the table. Then zoom in on `P` until the curve looks straight.","predictions":[{"id":"p1","start":{"fn":"sq","P":3,"mag":"1","side":1,"cen":false,"mode":"sec","rows":["1"]},"prompt":"`y = x^2`, `P` = (3, 9), `h` = 1. `Q` will move to 3.1, then 3.01. What will the secant slopes do?","options":[{"t":"Grow without limit","_n":"o7d7","_k":"47f7c035"},{"t":"Shrink toward 0","_n":"p7e7","_k":"40a243db"},{"t":"Settle toward 6","_n":"q7f7","_k":"1359a42a"},{"t":"Settle toward 9","_n":"r707","_k":"d792b8a4"}],"explain":"The slope from 3 to 3 + `h` works out to 6 + `h`. As `h` shrinks, 6 + `h` → 6. 9 is the height, not the slope."},{"id":"p2","start":{"fn":"sq","P":3,"mag":"0.01","side":1,"cen":false,"mode":"sec","rows":["1","0.1","0.01"]},"prompt":"Same graph, `h` = 0.01. What happens if `Q` lands exactly on `P` (`h` = 0)?","options":[{"t":"The slope is exactly 6","_n":"s717","_k":"ed389fcc"},{"t":"No slope can be found: 0 ÷ 0","_n":"t7e8","_k":"08a073e1"},{"t":"The slope is infinite","_n":"u7d8","_k":"7de28146"},{"t":"The slope is 0","_n":"v7c8","_k":"c9f46316"}],"explain":"A secant needs two different points. That’s why the instantaneous rate is estimated with tiny gaps, never `h` = 0."},{"id":"p3","start":{"fn":"cube","P":2,"mag":"1","side":1,"cen":false,"mode":"zoom","zoom":1},"prompt":"`y = x^3`, `P` = (2, 8), Zoom mode. Zoom ×1000 on `P`. What will you see?","options":[{"t":"A flat line","_n":"w7b8","_k":"ecdcfeee"},{"t":"A vertical line","_n":"x828","_k":"425e08f4"},{"t":"An almost straight line, slope about 12","_n":"y818","_k":"fc185dc1"},{"t":"A small cubic shape","_n":"z808","_k":"6cc61f64"}],"explain":"Close enough, a smooth curve is indistinguishable from its tangent. Its slope there is the instantaneous rate: 12."},{"id":"p4","start":{"fn":"sq","P":3,"mag":"0.5","side":1,"cen":true,"mode":"sec","rows":[]},"prompt":"`y = x^2`, `P` = (3, 9), Centred on. What is the slope of the secant from 2.9 to 3.1?","options":[{"t":"5.9","_n":"107f8","_k":"a57ee7a6"},{"t":"6","_n":"11768","_k":"dd42a6bc"},{"t":"6.1","_n":"12758","_k":"5ff82c73"},{"t":"9","_n":"137c8","_k":"33431c9c"}],"explain":"For a parabola, a secant centred on `P` has exactly the tangent’s slope. For other curves it’s usually much closer than a one-sided secant."}],"challenges":[{"id":"tc1","goal":[1,5],"prompt":"Ball: choose `h` so the secant slope from `t = 1` is within 0.1 m/s of the instantaneous rate.","why":"The slope from 1 to 1 + `h` is 10 − 5`h`, so it’s within 0.1 of 10 m/s when |5`h`| ≤ 0.1: `h` = ±0.01 or ±0.001.","general":"Check the secant slope against the value the table settles on.","hints":["Watch how far the slope is from the value it’s settling on.","It settles on 10 m/s.","`h` = 0.01 gives 9.95: within 0.1."]},{"id":"tc2","goal":1,"prompt":"`y = x^3`: find \u003cstrong>every\u003c/strong> whole-number `x` from −2 to 2 where the instantaneous rate is 12. Pin each one.","why":"At `x = 2` the slopes settle on 12, and the half-turn symmetry gives the same slope at `x = -2`. At −1 and 1 they settle on 3, and at 0 the curve is level.","hints":["Use the secant table at each whole number.","At `x = 2` the slopes settle on 12.","The half-turn symmetry gives the same slope at `x = -2`."]},{"id":"tc3","goal":[5,2],"stretch":true,"prompt":"On `y = x^2 - 4x`, put `P` where the instantaneous rate is 0. Then place two points `A` and `B` (on the 0.5 grid, neither at `P`) so the \u003cstrong>secant\u003c/strong> `AB` also has slope 0.","why":"Points at equal distances from the vertex are at equal heights, so the secant `AB` is level: an average rate of 0, like the instantaneous rate at 2. But it’s a different line from the tangent `y = -4`.","hints":["Rate 0 at a vertex. Where’s the vertex?","`x = 2`. A secant has slope 0 when its ends are at equal heights.","`A` = 1, `B` = 3: both at −3. The average rate on [1, 3] is 0, like the instantaneous rate at 2, but the secant is the line `y = -3`, not the tangent `y = -4`."]}]},"part3":{"slug":"sign","name":"Sign","heading":"Sign of the rate","intro":"Drag the tangent along the curve. Watch the slope tracker below. Then mark where the rate is positive, negative and zero.","rounds":[{"id":"r1","name":"Round 1","eq":"`f(x) = x^3 - 3x`","note":"Local maximum (−1, 2), local minimum (1, −2).","value":"That’s where the \u003cstrong>value\u003c/strong> is {sign}. The rate is about rising or falling.","why":"The graph rises on `(-∞, -1) ∪ (1, ∞)`, falls on `(-1, 1)` and is level at the turning points `x = -1` and 1. The value is negative on `(-∞, -√3) ∪ (0, √3)`: a different set."},{"id":"r2","name":"Round 2","eq":"`g(x) = x^4 - 4x^3`","note":"Level at (0, 0), local minimum (3, −27).","value":"That’s where the \u003cstrong>value\u003c/strong> is {sign}. The rate is about rising or falling.","special":"The rate is 0 at `x = 0`, but the graph keeps falling on both sides. Zero rate doesn’t always mean a turn.","why":"The rate is 0 at `x = 0` and `x = 3`. At 3 the graph turns; at 0 it only levels off, falling on both sides."},{"id":"r3","name":"Round 3","eq":"A walker’s distance–time graph","note":"The walker speeds up from rest, then slows to a stop at `t` = 10 min.","value":"That’s where the \u003cstrong>value\u003c/strong> is {sign}. The rate is about rising or falling.","special":"Distance never falls, so the rate is never negative here.","why":"The walker moves forward the whole time (rate positive on `(0, 10)`), fastest at `t` = 5 min, and is at rest at `t = 0` and `t = 10`."}],"blocks":[{"title":"What the tracker shows","html":"\u003cp>Where the tracker is above its 0 line, the graph is rising; below, falling; on it, level. The tracker crosses 0 at turning points, and touches 0 without crossing where the graph levels off without turning.\u003c/p>"}],"quickCheck":{"title":"Quick check","summary":"Sign of the rate quick check","items":[{"id":"q1","goal":3,"prompt":"At a local maximum, the instantaneous rate is…","choices":[{"t":"positive","fb":"The tangent at a peak is horizontal.","_n":"147d8","_k":"6136e840"},{"t":"negative","fb":"The tangent at a peak is horizontal.","_n":"157a8","_k":"6829c09c"},{"t":"0","fb":"Right. The tangent at a peak is horizontal: slope 0.","_n":"167b8","_k":"fa43cb6b"},{"t":"undefined","fb":"The tangent at a peak is horizontal.","_n":"17808","_k":"43a2d472"}]},{"id":"q2","goal":3,"prompt":"A graph is below the `x`-axis and rising. Its rate is…","choices":[{"t":"positive","fb":"Right. Rising means positive rate, whatever the height.","_n":"18818","_k":"2bf49cc7"},{"t":"negative","fb":"Rising means positive rate, whatever the height.","_n":"197e8","_k":"a1ae31e4"},{"t":"0","fb":"Rising means positive rate, whatever the height.","_n":"1a7f8","_k":"61c401cf"},{"t":"undefined","fb":"Rising means positive rate, whatever the height.","_n":"1b748","_k":"04148422"}]},{"id":"q3","goal":1,"prompt":"Secant slopes 3.9, 3.99, 3.999 estimate a rate of about…","choices":[{"t":"0","fb":"They settle on 4.","_n":"1c758","_k":"5bcaa75a"},{"t":"3.9","fb":"They settle on 4.","_n":"1d828","_k":"857129ab"},{"t":"3.999","fb":"They settle on 4.","_n":"1e818","_k":"6e4f4371"},{"t":"4","fb":"Right. They settle on 4.","_n":"1f848","_k":"b7fe774c"}]},{"id":"q4","goal":3,"prompt":"Instantaneous rate 0 at `x = 2` means…","choices":[{"t":"the graph crosses the axis at 2","fb":"Rate 0 is about the slope, not the value.","_n":"1g838","_k":"445d6f51"},{"t":"`f` is constant","fb":"Rate 0 is about the slope, not the value.","_n":"1h7e8","_k":"f8c3af0d"},{"t":"`f(2) = 0`","fb":"Rate 0 is about the slope, not the value.","_n":"1i7d8","_k":"021a2435"},{"t":"the tangent at `x = 2` is horizontal","fb":"Right. Rate 0 is about the slope, not the value.","_n":"1j808","_k":"f6b2f3e4"}]}]}},"practice":{"activities":[{"id":"tap","type":"custom","title":"Tap the point","summary":"Tap the point","goal":[3,5],"instruction":"Tap the point the question asks for. The tangent tool appears where you tap, so you can check.","how":"Tap the graph or move the point with the arrow keys, then press Check. Answers within 0.15 of the right value count.","wrongTap":"At {v} = {x} the tangent’s slope is about {m}.","missing":"Those are right, but there’s another point. Tap every point the question asks for.","items":[{"id":"t1","goal":3,"g":"cubic","multi":true,"prompt":"`y = x^3 - 3x`. Tap every point where the rate is 0.","_a":"YhhVGVdl","why":"The tangent is horizontal at the turning points (−1, 2) and (1, −2).","hints":["Rate 0 means the tangent is horizontal.","Look for the peak and the valley.","The turning points are at `x = -1` and `x = 1`: tap both."]},{"id":"t2","goal":3,"g":"ball","prompt":"Ball `h(t) = -5t^2 + 20t + 1`. Tap where the ball’s speed is 0.","_a":"Ygc5","why":"At the peak (2, 21) the tangent is flat: the ball stops rising and starts to fall.","hints":["Speed 0 means the height isn’t changing at that instant.","That happens at the top of the flight, where the tangent is flat.","The peak is at `t` = 2 s."]},{"id":"t3","goal":5,"g":"square","prompt":"`y = x^2` on [0, 4]. Tap where the instantaneous rate equals the average rate over [0, 4].","_a":"Ygc5","why":"Both are 4: the average rate is (16 − 0)/4 = 4, and the tangent at `x = 2` has slope 4.","hints":["Find the average rate over [0, 4] first.","(16 − 0)/4 = 4.","Find where the tangent slope is 4: at `x = 2`."]},{"id":"t4","goal":3,"g":"walker","prompt":"Walker graph (Part 3, round 3). Tap where the walker is moving fastest.","_a":"YgA5","high":"Highest distance isn’t fastest; the steepest point is.","why":"The steepest point is at `t` = 5 min, where the walker covers about 150 m per minute.","hints":["Speed is the slope of the distance–time graph.","Find where the graph is steepest, not where it’s highest.","The graph is steepest halfway, at `t` = 5 min."]},{"id":"t5","goal":3,"g":"hill","prompt":"`y = -x^2 + 6x`. Tap where the rate is −2.","_a":"YgE5","why":"Right of the vertex the graph falls, and at `x = 4` the slopes settle on −2.","hints":["Use the tangent tool and read the slope.","Left of the vertex (3, 9) the rate is positive; right, negative.","At `x = 4` the slope settles on −2."]},{"id":"t6","goal":3,"g":"cube","multi":true,"prompt":"`y = x^3`. Tap every point where the rate is 3.","_a":"YhhVGVdl","why":"At `x = -1` and `x = 1` the tangent’s slope is 3: the half-turn symmetry makes the slopes match.","hints":["Use the tangent tool and read the slope.","`y = x^3` has half-turn symmetry, so a point on one side has a partner on the other with the same slope.","At `x = 1` the slopes settle on 3, and so do they at `x = -1`."]}]},{"id":"secant","type":"numeric","title":"Secant tables","summary":"Secant tables","star":true,"goal":[1,4,5],"instruction":"Work out each secant slope or estimate by hand. A “Use these values” box gives any power you need.","how":"Type your answer, then press Check. Decimals and fractions are fine.","items":[{"id":"s1","goal":1,"prompt":"`f(x) = x^2`. Slope of the secant from 5 to 5.1?","use":"5.1² = 26.01","_a":"CAVKBA==","display":"10.1","why":"(26.01 − 25) ÷ 0.1 = 1.01 ÷ 0.1 = 10.1.","wrong":[{"match":1.01,"fb":"Divide by 0.1."},{"match":26.01,"fb":"That’s a value."}],"hints":["Find `f(5)` and `f(5.1)`.","25 and 26.01: a rise of 1.01 over a run of 0.1.","1.01 ÷ 0.1 = 10.1."]},{"id":"s2","goal":1,"prompt":"Secant slopes at `x = 5` for `h` = 1, 0.1, 0.01 are 11, 10.1, 10.01. Estimate the instantaneous rate.","_a":"CAU=","display":"10","why":"The slopes are settling on 10.","wrong":[{"match":10.01,"fb":"That’s the last secant. They’re settling on 10."},{"match":11,"fb":"That’s the biggest interval’s slope, an average. They’re settling on 10."}],"hints":["Are the slopes still changing?","11, 10.1, 10.01: each one is closer to the same number.","They settle on 10."]},{"id":"s3","goal":1,"star":true,"prompt":"`g(x) = x^3`. Slope of the secant from 1 to 1.1, and the rate it suggests at `x = 1`?","use":"1.1³ = 1.331","label":"Secant slope, then the rate it suggests (separate them with a comma):","_a":"YgZIBkgLBW0=","display":"3.31; about 3","why":"(1.331 − 1) ÷ 0.1 = 3.31, which suggests a rate of about 3 at `x = 1`.","wrong":[{"match":0.331,"fb":"Divide by 0.1."},{"match":[0.3,0.331],"fb":"Divide by 0.1."},{"match":[0.331,3],"fb":"Divide by 0.1."},{"missing":3,"fb":"3.31 is the secant slope. Now give the rate it suggests at `x = 1`."},{"missing":3.31,"fb":"Give the secant slope too, then the rate."}],"hints":["Find `g(1)` and `g(1.1)`.","1 and 1.331: a rise of 0.331 over a run of 0.1.","0.331 ÷ 0.1 = 3.31, so the rate at `x = 1` is about 3. Enter 3.31, 3."]},{"id":"s4","goal":4,"star":true,"prompt":"A tank holds `V(t) = 100 - t^2` litres after `t` minutes. Using `t = 4` and `t = 4.01`, estimate the rate at `t = 4`, with units.","use":"4.01² = 16.0801","unit":"L/min","_a":"FA0=","tol":0.0015,"display":"−8.01, so about −8 L/min","why":"`V(4)` = 84 and `V(4.01)` = 83.9199, so the slope is −0.0801 ÷ 0.01 = −8.01: the volume is falling at about 8 L/min.","wrong":[{"match":8,"fb":"The volume is falling: negative."},{"match":84,"fb":"That’s `V(4)`, a volume."}],"hints":["Find `V(4)` and `V(4.01)`.","`V(4)` = 84; `V(4.01)` = 83.9199.","−0.0801 ÷ 0.01 = −8.01: about −8 L/min."]},{"id":"s5","goal":5,"star":true,"prompt":"`h(t) = -5t^2 + 20t + 1`. Average rate over the centred interval [1.9, 2.1]?","use":"`h(1.9) = h(2.1)` = 20.95","_a":"CQ==","display":"0","why":"Equal heights at both ends: 0. The ball is at its peak at `t = 2`.","wrong":[{"match":20.95,"fb":"That’s a height. Equal heights at both ends: what’s the rise?"}],"hints":["The average rate is (`h(2.1) - h(1.9)`) ÷ 0.2.","The two heights are equal, so the rise is 0.","0 ÷ 0.2 = 0."]},{"id":"s6","goal":5,"star":true,"prompt":"For `f(x) = x^2`, what is the slope of the secant from 3 − `k` to 3 + `k`, for any `k` ≠ 0?","_a":"Dw==","display":"6","why":"(3 + `k`)² − (3 − `k`)² = 12`k`, divided by 2`k`: always 6.","wrong":[{"match":9,"fb":"9 is `f(3)`, a value. Expand both squares and subtract."},{"match":12,"fb":"12`k` is the rise. Divide by the run, 2`k`."}],"hints":["Expand both squares.","9 + 6`k` + `k`² minus 9 − 6`k` + `k`² is 12`k`.","12`k` ÷ 2`k` = 6."]}]},{"id":"spot","type":"spot","title":"Spot the error","student":"Zara","how":"","instruction":"Zara made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":1,"task":"Estimate the instantaneous rate of `f(x) = x^2` at `x = 4`.","steps":["Secant from 4 to 5: (25 − 16)/1 = 9.","From 4 to 4.1: (16.81 − 16)/0.1 = 8.1.","From 4 to 4.01: (16.0801 − 16)/0.01 = 8.01.","So the instantaneous rate is exactly 8.01."],"_a":"Cg==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"It’s 16, `f(4)`.","why":"16 is a value. The rate is a slope: how fast `f` is changing.","_n":"1k7f8","_k":"45928f31"},{"t":"It’s 9, the first slope.","why":"9 is the slope over [4, 5], an average. Shrink the interval until the slopes settle.","_n":"1l7a8","_k":"3f5e907d"},{"t":"The slopes 9, 8.1, 8.01 are settling toward 8: the rate is 8.","why":"The instantaneous rate is the value the slopes settle on.","_n":"1m798","_k":"cb7b19cf"},{"t":"Step 4 is correct.","why":"8.01 is still a secant; the trend is the answer.","_n":"1nf08","_k":"17cb0ced"}],"hints":["Are the slopes still changing?","What value are they approaching?","8."]},{"id":"e2","goal":4,"task":"A ball’s height is `h(t) = -5t^2 + 20t + 1` m. How fast is it moving at `t` = 3 s?","steps":["`h(3)` = −45 + 60 + 1 = 16 m.","So at `t = 3` the ball is rising at 16 m/s."],"_a":"CA==","stepFb":["Step 1 is correct. Keep checking.",""],"fixes":[{"t":"The average from 0 to 3 is 5 m/s.","why":"An average over [0, 3] describes the whole interval; at `t` = 3 the rate can be very different.","_n":"1of18","_k":"f5fe7359"},{"t":"16 ÷ 3 ≈ 5.3 m/s.","why":"That’s height ÷ time, not a slope.","_n":"1pf28","_k":"ac0f1121"},{"t":"Use secants: from 3 to 3.01 the slope is about −10.05, settling toward −10. It’s falling at about 10 m/s.","why":"The rate is a slope, and the slopes settle on −10 m/s.","_n":"1qf38","_k":"bd5c5dea"},{"t":"Step 2 is correct.","why":"16 m is a height.","_n":"1rec8","_k":"cb56b38b"}],"hints":["Is 16 a height or a speed?","Build a secant table at `t = 3`.","Slopes settle toward −10: falling at about 10 m/s."]},{"id":"e3","goal":3,"task":"`f(x) = x^2 - 6x`. Where is the rate 0, and what is `f` there?","steps":["The vertex is at `x = 3`.","The tangent there is horizontal, so the rate is 0.","So `f(3) = 0`."],"_a":"Cw==","stepFb":["Step 1 is correct. Keep checking.","Step 2 is correct.",""],"fixes":[{"t":"`f(3)` = 9 − 18 = −9: the graph is level at height −9.","why":"Rate 0 means level, not zero height.","_n":"1sed8","_k":"16cc380e"},{"t":"`f(3) = 6`.","why":"Substitute `x = 3`: 9 − 18 = −9.","_n":"1tee8","_k":"ce73e117"},{"t":"`f(3) = 3`.","why":"3 is the `x`-value of the vertex. Substitute it: 3² − 6(3).","_n":"1uef8","_k":"b00b4cd1"},{"t":"Step 3 is correct.","why":"Rate 0 means level, not zero height.","_n":"1vf88","_k":"f2f32fcd"}],"hints":["Is a zero rate the same as a zero value?","Substitute `x = 3`.","`f(3)` = −9."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you: the slopes settling, the curve looking straight up close, or the centred secant?"},{"id":"j2","q":"In your own words, why can’t you just put `h` = 0 into the secant slope?"},{"id":"j3","q":"Explain to a friend how to estimate how fast something is changing at one instant."},{"id":"j4","q":"What’s still unclear about the difference between average and instantaneous rates? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"The instantaneous rate of change of `f` at `x = 2` is…","options":[{"t":"`f(2)` ÷ 2.","why":"A value divided by an input isn’t a slope.","_n":"1wf98","_k":"47ad6839"},{"t":"`f(2)`.","why":"That’s a value.","_n":"1x768","_k":"a92b5cce"},{"t":"the slope of the tangent to the graph at (2, `f(2)`)","why":"The instantaneous rate is the tangent’s slope.","_n":"1y758","_k":"0fcc2a67"},{"t":"the slope of the secant from `x = 0` to `x = 2`.","why":"That’s an average rate.","_n":"1z748","_k":"60fdcdaa"}]},"b":{"prompt":"The slope of the tangent to `y = f(x)` at `x = -1` is…","options":[{"t":"the average rate of change from `x = -1` to `x = 1`.","why":"That’s a secant’s slope: an average over an interval.","_n":"20738","_k":"053dca22"},{"t":"`f(-1)`.","why":"That’s a value.","_n":"21728","_k":"91da915a"},{"t":"the instantaneous rate of change of `f` at `x = -1`","why":"The tangent’s slope is the instantaneous rate.","_n":"22718","_k":"6823a669"},{"t":"`f(-1)` ÷ (−1).","why":"Not a slope.","_n":"23708","_k":"162b873e"}]}},{"id":"k2","cat":"K","goal":1,"a":{"prompt":"Secant slopes of `f` at `x = 3`, for `h` = 0.1, 0.01 and 0.001, are 6.1, 6.01 and 6.001. Best estimate of the instantaneous rate at `x = 3`?","options":[{"t":"6","why":"The slopes settle on 6.","_n":"246f8","_k":"955bed7f"},{"t":"6.001","why":"Still a secant slope.","_n":"257e8","_k":"1c61ccc9"},{"t":"6.1","why":"The biggest interval’s slope.","_n":"267d8","_k":"2d1b616f"},{"t":"9","why":"That would be `f(3)` for `x^2`: a value.","_n":"27746","_k":"1a01341c"}]},"b":{"prompt":"Secant slopes of `g` at `x = -2` are −3.9, −3.99 and −3.999. Best estimate of the instantaneous rate at `x = -2`?","options":[{"t":"−4","why":"They settle on −4.","_n":"28756","_k":"713f95c9"},{"t":"−3.999","why":"Still a secant slope.","_n":"29726","_k":"1f191da0"},{"t":"−3.9","why":"The biggest interval’s slope.","_n":"2a736","_k":"5ec72c45"},{"t":"4","why":"The slopes are negative.","_n":"2b706","_k":"9fce0999"}]}},{"id":"k3","cat":"K","goal":3,"a":{"prompt":"The tangent to a graph at `P` is horizontal. What is the instantaneous rate at `P`?","options":[{"t":"It’s undefined.","why":"Vertical lines have undefined slope.","_n":"2c716","_k":"d4fc4dd1"},{"t":"0","why":"Horizontal line: slope 0.","_n":"2d6e6","_k":"7fc23a6e"},{"t":"1","why":"Slope 1 rises at 45°.","_n":"2e6f6","_k":"2bced0c7"},{"t":"The `y`-value of `P` is 0.","why":"Level at any height.","_n":"2f7c6","_k":"4f322daa"}]},"b":{"prompt":"The tangent to a graph at `Q` falls from left to right. What does that tell you?","options":[{"t":"The `y`-value at `Q` is negative.","why":"Falling isn’t the same as below the axis.","_n":"2g7d6","_k":"ac9f631c"},{"t":"The instantaneous rate at `Q` is negative","why":"A tangent that falls from left to right has a negative slope.","_n":"2hfa7","_k":"a7d0ef61"},{"t":"The rate at `Q` is 0.","why":"Falling means a negative slope.","_n":"2if97","_k":"9fb2fa73"},{"t":"The rate at `Q` is undefined.","why":"A falling tangent has a definite slope.","_n":"2jfc7","_k":"f3ca6f5e"}]}},{"id":"t1","cat":"T","goal":1,"a":{"prompt":"Use 1.01³ = 1.030301. What is the slope of the secant on `y = x^3` from `x = 1` to `x = 1.01`?","options":[{"t":"0.030301","why":"That’s `Δy`; divide by 0.01.","_n":"2kfb7","_k":"c4a61f6a"},{"t":"1.030301","why":"That’s `f(1.01)`.","_n":"2lfe7","_k":"6593af46"},{"t":"3.0301","why":"(1.030301 − 1) ÷ 0.01.","_n":"2mfd7","_k":"4413570d"},{"t":"103.0301","why":"That divides `f(1.01)` by 0.01, skipping the subtraction.","_n":"2n007","_k":"25d8a3a3"}]},"b":{"prompt":"Use 2.01² = 4.0401. What is the slope of the secant on `y = x^2` from `x = 2` to `x = 2.01`?","options":[{"t":"0.0401","why":"That’s `Δy`.","_n":"2off7","_k":"d23e87da"},{"t":"4.01","why":"(4.0401 − 4) ÷ 0.01.","_n":"2pf27","_k":"1bb086ce"},{"t":"4.0401","why":"That’s `f(2.01)`.","_n":"2qf17","_k":"26bb7913"},{"t":"404.01","why":"That divides `f(2.01)` by 0.01.","_n":"2r639","_k":"a40d2e2c"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"For `h(t) = -5t^2 + 20t + 1`, whose instantaneous rate at `t = 2` is 0, which interval has an average rate equal to that?","options":[{"t":"[0, 2]","why":"(21 − 1)/2 = 10.","_n":"2s629","_k":"efd9a900"},{"t":"[2, 4]","why":"(1 − 21)/2 = −10.","_n":"2t619","_k":"548df670"},{"t":"[1.5, 2]","why":"(21 − 19.75)/0.5 = 2.5.","_n":"2u609","_k":"509e54e4"},{"t":"[1, 3]","why":"`h(1) = h(3)` = 16: average 0.","_n":"2v679","_k":"db9709b7"}]},"b":{"prompt":"For `y = x^2`, whose instantaneous rate at `x = 3` is 6, which interval has an average rate equal to that?","options":[{"t":"[2, 3]","why":"(9 − 4)/1 = 5.","_n":"2w669","_k":"dbaa4e30"},{"t":"[3, 4]","why":"(16 − 9)/1 = 7.","_n":"2x659","_k":"f8ea08d0"},{"t":"[2, 4]","why":"(16 − 4)/2 = 6: centred on 3.","_n":"2y649","_k":"5219472f"},{"t":"[0, 3]","why":"(9 − 0)/3 = 3.","_n":"2z6b9","_k":"dedfc981"}]}},{"id":"t3","cat":"T","goal":3,"a":{"prompt":"The graph of `f(x) = x^3 - 3x` is shown, with local maximum (−1, 2) and local minimum (1, −2). Where is the instantaneous rate negative?\u003ccanvas class=\"plot\" data-fig=\"t3a\" role=\"img\" aria-label=\"Cubic f of x equals x cubed minus 3x, with local maximum (negative 1, 2) and local minimum (1, negative 2)\">\u003c/canvas>","options":[{"t":"`(-1, 1)`","why":"The graph falls between its turning points.","_n":"306a9","_k":"4017cef0"},{"t":"`(-∞, -1) ∪ (1, ∞)`","why":"That’s where it rises.","_n":"31dd9","_k":"13255e59"},{"t":"`[-1, 1]`","why":"At the turning points the rate is 0, not negative.","_n":"32de9","_k":"3daa286f"},{"t":"`(-∞, -√3) ∪ (0, √3)`","why":"That’s where the \u003cstrong>value\u003c/strong> is negative.","_n":"33df9","_k":"663efa01"}]},"b":{"prompt":"The graph of `g(x) = -x^3 + 12x` is shown, with local minimum (−2, −16) and local maximum (2, 16). Where is the instantaneous rate positive?\u003ccanvas class=\"plot\" data-fig=\"t3b\" role=\"img\" aria-label=\"Cubic g of x equals negative x cubed plus 12x, with local minimum (negative 2, negative 16) and local maximum (2, 16)\">\u003c/canvas>","options":[{"t":"`(-2, 2)`","why":"The graph rises between its turning points.","_n":"34e09","_k":"319d591c"},{"t":"`[-2, 2]`","why":"At the turning points the rate is 0.","_n":"35e19","_k":"5ca85aab"},{"t":"`(-∞, -2) ∪ (2, ∞)`","why":"That’s where it falls.","_n":"36e29","_k":"7e3ec303"},{"t":"`(-∞, -2√3) ∪ (0, 2√3)`","why":"That’s where the \u003cstrong>value\u003c/strong> is positive.","_n":"37e39","_k":"33b2ef37"}]}},{"id":"c1","cat":"C","goal":2,"a":{"prompt":"Which is the best explanation of why secant slopes approach the tangent slope as `h` shrinks?","options":[{"t":"“Because the whole curve becomes a straight line when `h` is small.”","why":"Only the part near `P` looks straight.","_n":"38e49","_k":"f8a6d9c7"},{"t":"“As `Q` moves toward `P`, the secant through `P` and `Q` swings toward the tangent at `P`, so its slope approaches the tangent’s slope.”","why":"The secants swing toward the tangent, so their slopes settle on its slope.","_n":"39e59","_k":"6be84028"},{"t":"“Because at `h` = 0 the secant becomes the tangent, so you can substitute `h` = 0.”","why":"At `h` = 0 there’s only one point: 0 ÷ 0.","_n":"3ae69","_k":"11fc9a00"},{"t":"“Because the secant slopes get closer to `f(P)`.”","why":"`f(P)` is a value, not a slope.","_n":"3b6fa","_k":"7960bdb2"}]},"b":{"prompt":"Which is the best explanation of why you can’t find the instantaneous rate by putting `h` = 0 in `{f(a + h) - f(a)}/{h}`?","options":[{"t":"“Because `h` must be positive.”","why":"Negative `h` works too: secants to the left.","_n":"3c6ea","_k":"6fdae920"},{"t":"“With `h` = 0 there’s only one point, and the expression becomes 0 ÷ 0, which has no value. So you estimate with smaller and smaller `h`.”","why":"A secant needs two different points.","_n":"3d71a","_k":"798f5613"},{"t":"“Because the answer would always be 0.”","why":"0 ÷ 0 isn’t 0; it has no value.","_n":"3e70a","_k":"54fb5718"},{"t":"“Because `f(a)` might be 0.”","why":"`f(a)` being 0 is no problem.","_n":"3f73a","_k":"6f24b85c"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"`s(t)` is a cyclist’s distance in km after `t` hours. “The instantaneous rate of change of `s` at `t = 2` is 18” means…","options":[{"t":"the cyclist rides 18 km every 2 hours.","why":"That’s an average of 9 km/h.","_n":"3g72a","_k":"4b2a2c54"},{"t":"the cyclist has ridden 18 km after 2 hours.","why":"That would be `s(2)` = 18, a distance, not a rate.","_n":"3h75a","_k":"a991c160"},{"t":"at exactly 2 hours, the cyclist is riding at 18 km/h","why":"An instantaneous rate is the speed at that moment, in km per hour.","_n":"3i74a","_k":"e601325b"},{"t":"the cyclist averaged 18 km/h for the first 2 hours.","why":"That’s an average rate over [0, 2], not the rate at one instant.","_n":"3j67a","_k":"a30bb2e7"}]},"b":{"prompt":"`V(t)` is the volume of water in a tank, in litres, after `t` minutes. “The instantaneous rate of change of `V` at `t = 5` is −3” means…","options":[{"t":"the tank holds 3 L at 5 minutes and is emptying.","why":"The rate tells you how fast the volume changes, not how much is in the tank.","_n":"3k66a","_k":"9c05ee9b"},{"t":"the tank holds −3 L at 5 minutes.","why":"That would be `V(5)`, a volume. The rate is how fast the volume changes.","_n":"3l69a","_k":"fb9961ef"},{"t":"at exactly 5 minutes, the volume is decreasing at 3 L/min","why":"A negative rate means falling, here by 3 litres per minute at that moment.","_n":"3m6aa","_k":"0a32eba9"},{"t":"the volume fell by 3 L over the first 5 minutes.","why":"That describes an average over [0, 5], not the rate at one instant.","_n":"3n67a","_k":"4b91d4b3"}]}},{"id":"a1","cat":"A","goal":1,"a":{"prompt":"A stone’s height is `h(t) = 45 - 5t^2` m. Using `t = 2` and `t = 2.01` (2.01² = 4.0401), estimate how fast it is falling at `t` = 2 s.","options":[{"t":"About 10 m/s","why":"That’s the average over [0, 2]: (25 − 45)/2.","_n":"3o68a","_k":"20aa1b25"},{"t":"About 25 m/s","why":"25 m is its height.","_n":"3p65a","_k":"42691c5f"},{"t":"About 20 m/s","why":"`h(2)` = 25, `h(2.01)` = 24.7995; slope −0.2005 ÷ 0.01 = −20.05: falling at about 20 m/s.","_n":"3q66a","_k":"b0acc72a"},{"t":"About 0.2 m/s","why":"Divide by 0.01.","_n":"3r63a","_k":"19111e5b"}]},"b":{"prompt":"A square tile’s area is `A(s) = s^2` cm². Using `s = 5` and `s = 5.01` (5.01² = 25.1001), estimate how fast the area grows per centimetre of side at `s = 5`.","options":[{"t":"About 25 cm² per cm","why":"25 cm² is the area.","_n":"3s64a","_k":"9ab298ed"},{"t":"About 5 cm² per cm","why":"That’s the average over [0, 5].","_n":"3t71a","_k":"abfd78d0"},{"t":"About 0.1 cm² per cm","why":"Divide by 0.01.","_n":"3u72a","_k":"d18db0ee"},{"t":"About 10 cm² per cm","why":"(25.1001 − 25) ÷ 0.01 = 10.01.","_n":"3vfba","_k":"e4399b15"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A tank’s water level rises from 2 m at `t = 0` to a peak of 5 m at `t` = 6 h, then falls. A technician says: “The level was rising fastest at `t` = 6 h, because that’s when it was highest.” What is correct?","options":[{"t":"At `t` = 6 h the rate is 0 (the tangent is flat). The fastest rise was earlier, where the graph was steepest.","why":"At a peak the tangent is flat; speed shows up as steepness.","_n":"3wfaa","_k":"ab45f74b"},{"t":"“At `t` = 6 h the rate is 0.5 m/h, the average (5 − 2)/6.”","why":"That’s an average over [0, 6]. At the peak itself the rate is 0.","_n":"3xf9a","_k":"7021d85b"},{"t":"“The technician is right: highest means fastest.”","why":"At a peak the tangent is flat: the rate there is 0.","_n":"3yf8a","_k":"7cf2fd77"},{"t":"“At `t` = 6 h the rate is 5 m/h.”","why":"5 m is the level, a value, not a rate.","_n":"3zf7a","_k":"80d7e347"}]},"b":{"prompt":"A runner’s distance–time graph is steep at first and gets flatter. A coach says: “She was running fastest at the end, because she’d covered the most distance.” What is correct?","options":[{"t":"“Her speed at the end equals her average speed.”","why":"The average describes the whole run; at the end the rate can be very different.","_n":"40f6a","_k":"5ce820ad"},{"t":"Her speed is the steepness of the tangent, which is smallest at the end. She ran fastest at the start.","why":"The graph is steepest at the start, so her speed was greatest then.","_n":"41f5a","_k":"a05bbbdc"},{"t":"“Her speed at the end is 0, because the graph ends there.”","why":"The graph ending doesn’t make the slope 0.","_n":"42f4a","_k":"5b79d51d"},{"t":"“The coach is right: most distance means fastest.”","why":"Distance covered is a value. Speed is the steepness of the graph.","_n":"43f3a","_k":"abf0b42b"}]}}]},"task":{"title":"Design the ramp","summary":"Design the ramp","statement":"\u003cp>A skate-ramp profile is a parabola `y = ax^2 + bx + c` for `0 ≤ x ≤ 4`. Use the sliders and the tangent tool to meet the whole spec. There’s more than one answer.\u003c/p>\u003cdiv class=\"refresh\" style=\"margin:0 0 12px\">\u003ch4>The spec\u003c/h4>\u003col style=\"margin:4px 0 0;padding-left:1.3em\">\u003cli>Average rate of change over [0, 4] is 2.\u003c/li>\u003cli>At `x = 0` the ramp starts by going down (instantaneous rate negative).\u003c/li>\u003cli>At `x = 3` the ramp climbs at a rate of at least 4.\u003c/li>\u003cli>It starts at height 1 (`y`-intercept 1).\u003c/li>\u003c/ol>\u003c/div>","checks":["Average rate on [0, 4] is 2","Starts going down","Climbs at least 4 at `x = 3`","Starts at height 1"],"tips":["(`f(4) - f(0)`) ÷ 4 is {v}; it must be 2.","Use the tangent tool at `x = 0`: the slope must be negative.","At `x = 3` the slope is {v}.","`c` is the height at `x = 0`."],"explainPrompt":"Explain how you used the tangent tool and what you noticed at `x = 2`.","vocab":"Use the words average rate, instantaneous rate, secant and tangent.","after3":"Use the tangent tool at `x = 2` on each answer. What do you notice?"},"cards":[["Instantaneous rate of change","How fast `f` is changing at one input: the slope of the tangent there."],["Average vs instantaneous","Average: secant slope over an interval. Instantaneous: tangent slope at a point."],["Estimating with secants","Slopes from `P` to `Q` for `h` = 1, 0.1, 0.01, …; the value they settle on."],["Why not `h` = 0?","One point only: 0 ÷ 0 has no value."],["Centred secant","From `a - h` to `a + h`: usually a better estimate. For a parabola it’s exact."],["Local straightness","Zoomed in, a smooth curve looks like its tangent line."],["Rate 0","The tangent is horizontal: a peak, a valley, or a level point. Not the same as `f` = 0."],["Sign of the rate","Positive: rising. Negative: falling. Unrelated to whether the value is positive."],["Units","The same as the average rate: units of `y` per unit of `x` (m/s, L/min)."],["Highest point","The rate there is 0, not the largest."],["Slopes 6.1, 6.01, 6.001","Estimate 6, the value they approach."],["Parabola fact","The average rate over [`a`, `b`] equals the instantaneous rate at the midpoint `{a + b}/{2}`."]]}};</script>
