.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 04: difference tables (N14 with staggered difference columns), machine controls, Part 3 rounds, hero captions */
.dt-scroll{display:inline-block;vertical-align:top;overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet)}
.dt-scroll:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.dt-inner{position:relative;display:inline-block;vertical-align:top}
.dt-arrows{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.dt-arrows .ln{fill:none;stroke:var(--ink-2);stroke-width:1.6}
.dt-arrows .hd{fill:var(--ink-2);stroke:none}
table.dtab{border-collapse:separate;border-spacing:0;font-family:var(--font-math);font-size:1.05rem;color:var(--ink)}
table.dtab caption{caption-side:top}
table.dtab th{font:700 .78rem/1.2 var(--font-ui);color:var(--ink-2);background:var(--paper);padding:6px 10px;border-bottom:1.5px solid var(--rule);vertical-align:bottom;text-align:center;white-space:nowrap}
table.dtab th .m{font-size:1.25rem;color:var(--ink)}
table.dtab tbody tr{height:19px}
table.dtab td{padding:0 14px;min-width:3.2em;text-align:center;white-space:nowrap;line-height:1.2;vertical-align:middle}
table.dtab .dt-x,table.dtab .dt-y{position:sticky;z-index:1;background:var(--sheet)}
table.dtab th.dt-x,table.dtab th.dt-y{background:var(--paper);z-index:2}
table.dtab .dt-x{left:0;width:54px;min-width:54px;max-width:54px;box-sizing:border-box;color:var(--ink-2)}
table.dtab .dt-y{left:54px;box-shadow:inset -1.5px 0 0 var(--rule)}
table.dtab td.dt-y{font-weight:600}
table.dtab tbody tr:nth-child(4n+1) td.dt-x,table.dtab tbody tr:nth-child(4n+1) td.dt-y{background:var(--paper)}
.dt-dl{display:block;font:400 1.15rem var(--font-math);color:var(--ink)}
.dt-dw{display:block}
.dt-tag{display:inline-block;margin-top:4px;padding:1px 6px;border-radius:4px;font:700 .7rem var(--font-ui)}
.dt-tag.yes{background:var(--hi);color:var(--hi-ink)}
.dt-tag.no{font-weight:400;color:var(--ink-2);border:1px dashed var(--rule)}
table.dtab .on{background:var(--hi-soft)}
table.dtab th.on{color:var(--ink)}
table.dtab td.new .v{outline:2px solid var(--ink-2);outline-offset:3px;border-radius:3px}
table.dtab td.src .v{text-decoration:underline;text-decoration-color:var(--ink-2);text-decoration-thickness:2px;text-underline-offset:4px}
table.dtab td.new{animation:dtin .3s ease-out}
@keyframes dtin{from{opacity:0}to{opacity:1}}
table.dtab .dt-e,table.dtab .dt-eh{border-left:1.5px dashed var(--ink-2)}
table.dtab .dt-eh{color:var(--ink)}
table.dtab .dt-eh .m{font-size:1.05rem}
table.dtab .dt-e small{display:block;font:400 .72rem var(--font-ui);color:var(--ink-2);margin-top:1px}
.dt-hb{border:1.5px solid var(--rule);background:var(--sheet);color:inherit;border-radius:6px;padding:.25em .55em;font:inherit;min-height:32px;cursor:pointer}
.dt-hb:not(:disabled):hover{border-color:var(--pen)}
.dt-hb:disabled{cursor:default;opacity:1}
.dt-hb.good{border-color:var(--green);background:var(--good-bg)}
.dt-hb.bad{border-color:var(--red);background:var(--bad-bg)}
.dt-step{min-height:1.5em;margin:6px 2px 0;font-size:.92rem;color:var(--ink-2)}
.dt-mach{margin-top:8px}
.dg-lab{margin:12px 0 6px}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 0}
.ctl-row .chips{margin:0}
.ctl-lab{font-size:.92rem;font-weight:700}
.ex-form{margin:8px 0 10px;font-size:.95rem;color:var(--ink-2)}
.ex-form .m{color:var(--ink)}
.ex-atype{display:flex;align-items:center;gap:10px;margin:-2px 0 10px;font-size:.9rem;color:var(--ink-2)}
.ex-atype input{width:6.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);padding:.3em .6em;font:400 1.1rem var(--font-math)}
.ex-atype input:focus{border-color:var(--ink)}
.rv-sub{margin:4px 0 10px;color:var(--ink-2)}
.rv-steps{margin:14px 0 0;padding-left:1.4em}
.rv-steps > li{margin:0 0 12px;padding-left:4px}
.rv-steps > li p{margin:0 0 4px}
.rv-steps > li.ok > p:first-child{color:var(--ink-2)}
.rv-done{color:var(--green);font-weight:700}
.rv-in{margin:6px 0 8px}
.rv-in input{width:7rem}
.scr select{font:400 1.05rem var(--font-math);padding:.35em .6em;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);min-height:36px;max-width:100%}
.hero-dt{max-width:100%}
.hero-fig figcaption:empty{display:none}
.hero-cap{font:400 1.3rem var(--font-math);text-align:center;margin:8px 0 0;max-width:none;opacity:0;transition:opacity .6s}
.hero-cap.on{opacity:1}
.hero-cap .m{white-space:normal}
.spec{margin:6px 0 0;padding-left:1.3em}
@media (max-width:560px){
  table.dtab{font-size:15px}
  table.dtab th{padding:5px 7px}
  table.dtab td{padding:0 9px}
  table.dtab .dt-x{width:44px;min-width:44px;max-width:44px}
  table.dtab .dt-y{left:44px}
  .hero-cap{font-size:1.1rem}
  .hero-dt .dt-dw{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .hero-dt th{white-space:normal}
  .hero-dt .dt-tag{max-width:5.5em;white-space:normal}
  .hero-dt td{padding:0 8px;min-width:2.4em}
}

oup":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"d6447ea7","content":{"id":"04-finite-differences","kind":"topic","title":"Finite differences","topic":"Finite Differences","readyTopic":"finite differences","hero":{"eq":"`a = Δ^n ÷ n!`","eqLabel":"a equals the constant nth difference divided by n factorial","headline":"Subtract until it stops changing","text":"Take a table of values with `x`-values 1 apart. Subtract each `y`-value from the next to get the \u003cstrong>first differences\u003c/strong>. Do it again to get the \u003cstrong>second differences\u003c/strong>, and again. For a polynomial of degree `n`, the `n`th differences come out \u003cstrong>constant\u003c/strong>. That number tells you the degree and, divided by `n!`, the \u003cstrong>leading coefficient\u003c/strong>.","fig":{"html":"\u003cdiv class=\"hero-dt\" id=\"hero-dt\">\u003c/div>\u003cp class=\"hero-cap\" id=\"hero-cap1\" aria-live=\"polite\">\u003c/p>\u003cp class=\"hero-cap\" id=\"hero-cap2\">\u003c/p>"}},"goals":["I can build first, second and third differences from a table whose `x`-values are 1 apart.","I can find the degree of a polynomial from the first column of constant differences.","I can find the leading coefficient using `a` = (constant `n`th difference) ÷ `n!`.","I can tell when a table isn’t from a low-degree polynomial, or when the `n!` rule can’t be used.","I can find a missing value or the whole equation of a polynomial from its table.","I can use finite differences to model and predict from real data."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Differences","goal":1,"prompt":"A table has `x = 0, 1, 2, 3` and `y = 7, 4, -1, -8`. What are the first differences?","options":[{"t":"−3, −5, −9","why":"−8 − (−1) = −8 + 1 = −7, not −9.","_n":"005d","_k":"6b571c84"},{"t":"3, 5, 7","why":"The values are falling, so the differences must be negative. Always do later minus earlier.","_n":"104d","_k":"df303bac"},{"t":"4, −1, −8","why":"Those are the `y`-values from `x = 1` on. A difference is one value minus the one before it.","_n":"203d","_k":"457f2c20"},{"t":"−3, −5, −7","why":"Later minus earlier: 4 − 7 = −3, −1 − 4 = −5, −8 − (−1) = −7.","_n":"302d","_k":"c3dcf05b"}],"hints":["A first difference is the next `y`-value minus the current one.","Start with 4 − 7. Watch the signs when you subtract a negative.","4 − 7 = −3, −1 − 4 = −5, −8 − (−1) = −7."]},{"id":"w2","skill":"Differences","goal":1,"prompt":"For `y = x^2`, the table for `x = 0` to 4 is 0, 1, 4, 9, 16. What are the second differences?","options":[{"t":"2, 2, 2","why":"First differences 1, 3, 5, 7; their differences are all 2.","_n":"401d","_k":"bcabe357"},{"t":"1, 3, 5, 7","why":"Those are the first differences. Subtract once more.","_n":"500d","_k":"8328e26c"},{"t":"0, 0","why":"0, 0 are the third differences.","_n":"6ffd","_k":"ac6dd5f7"},{"t":"1, 1, 1","why":"The coefficient of `x^2` is 1, but the second differences are 2 × 1 = 2. You’ll see why in this module.","_n":"7fed","_k":"e505baa1"}],"hints":["Find the first differences, then their differences.","First differences: 1 − 0, 4 − 1, 9 − 4, 16 − 9.","1, 3, 5, 7 → 2, 2, 2."]},{"id":"w3","skill":"Evaluating polynomials","goal":5,"prompt":"`f(x) = 2x^3 - x + 4`. What is `f(-2)`?","options":[{"t":"−14","why":"`-x` at `x = -2` is `-(-2) = +2`, not −2.","_n":"8fdd","_k":"d203647b"},{"t":"−10","why":"`2(-8) - (-2) + 4 = -16 + 2 + 4 = -10`.","_n":"9040","_k":"7be69a4b"},{"t":"−6","why":"`(-2)^3 = (-2)(-2)(-2) = -8`, not −6.","_n":"a050","_k":"0d9d5761"},{"t":"22","why":"An odd power of a negative number is negative: `(-2)^3 = -8`.","_n":"b020","_k":"275992ad"}],"hints":["Substitute −2 for every `x`, with brackets.","`2(-2)^3 - (-2) + 4`. `(-2)^3 = -8`.","−16 + 2 + 4 = −10."]},{"id":"w4","skill":"Evaluating polynomials","goal":5,"prompt":"What is the value of `y = 3x^2 - 2` at `x = 4`?","options":[{"t":"22","why":"`x^2` at 4 is 16, not 8.","_n":"c030","_k":"fa8b3175"},{"t":"46","why":"3 × 16 − 2 = 48 − 2 = 46.","_n":"d080","_k":"d331451e"},{"t":"50","why":"The constant is −2: 48 − 2 = 46.","_n":"e090","_k":"cfb0eda9"},{"t":"142","why":"`3x^2` means 3 × `x^2`, so 3 × 16, not (3 × 4)².","_n":"f060","_k":"c878eecd"}],"hints":["Square first, then multiply by 3.","4² = 16, and 3 × 16 = 48.","48 − 2 = 46."]},{"id":"w5","skill":"Degree","goal":2,"prompt":"What is the degree of `y = 5 - x + 2x^3 - x^2`?","options":[{"t":"0","why":"5 is the first term written, but the degree is the highest power anywhere in the expression.","_n":"g070","_k":"d50be835"},{"t":"1","why":"`-x` is the first `x`-term, but `2x^3` has a higher power.","_n":"hfc0","_k":"247da660"},{"t":"2","why":"`-x^2` is last, but the highest power is 3.","_n":"ifd0","_k":"41819ada"},{"t":"3","why":"The highest power of `x` is 3, in `2x^3`.","_n":"jfe0","_k":"d3650bb7"}],"hints":["Look at every power of `x`.","The powers are 0, 1, 3 and 2.","The highest is 3."]},{"id":"w6","skill":"Solving for a coefficient","goal":5,"prompt":"`y = 3x^2 + bx + 1` passes through (1, 2). What is `b`?","options":[{"t":"−2","why":"`3(1)^2 + b(1) + 1 = 2`, so `4 + b = 2` and `b = -2`.","_n":"kfd0","_k":"fd6641bb"},{"t":"−1","why":"Don’t drop the +1: `3 + b + 1 = 2`.","_n":"lfc0","_k":"4bf7c7f4"},{"t":"2","why":"`4 + b = 2` means `b = 2 - 4 = -2`.","_n":"mfb0","_k":"468e2630"},{"t":"6","why":"`b = 2 - 3 - 1 = -2`, not 2 + 3 + 1.","_n":"nfa0","_k":"8f104e54"}],"hints":["Substitute `x = 1` and `y = 2`.","`3 + b + 1 = 2`, so `4 + b = 2`.","`b = -2`."]}],"refreshers":{"Differences":"A first difference is later minus earlier: `y(x + 1) - y(x)`. Second differences are the differences of the first differences. Example: 0, 1, 4, 9, 16 → 1, 3, 5, 7 → 2, 2, 2. Falling values give negative differences.","Evaluating polynomials":"Put the number in brackets for every `x`, then work powers first: `2(-2)^3 = 2(-8) = -16`. An odd power of a negative number is negative.","Degree":"The degree is the highest power of `x` anywhere in the expression, not the first or last term written.","Solving for a coefficient":"If a point (`x`, `y`) is on the graph, substitute both numbers and solve for the unknown. (1, 2) on `y = 3x^2 + bx + 1` gives `3 + b + 1 = 2`, so `b = -2`."}}},"explore":{"heading":"Difference table machine","intro":"Choose a function, then run the machine one column at a time. When a column comes out constant, the machine tells you the degree and the leading coefficient. Try the mystery tables too: not every table settles down.","mystery":[{"id":"garden","name":"Garden path","ys":[3,7,11,15,19,23,27,31]},{"id":"arch","name":"Arch","ys":[10,7,2,-5,-14,-25,-38,-53]},{"id":"stack","name":"Stack","ys":[1,4,10,20,35,56,84,120]},{"id":"doubling","name":"Doubling","ys":[1,2,4,8,16,32,64,128],"note":"Each first difference equals the `y`-value above it: `2^x` copies itself."},{"id":"tripling","name":"Tripling","ys":[2,6,18,54,162,486,1458,4374],"note":"Each first difference is 2 times the `y`-value above it: every column grows ×3."},{"id":"factorial","name":"Factorial","ys":[1,1,2,6,24,120,720,5040]}],"predIntro":"Make a prediction first. Then the machine will fill the columns so you can see what really happens.","predictions":[{"id":"p1","start":{"mode":"build","deg":2,"a":1,"co":[0,0,0,0],"start":0,"step":1,"rows":7,"shown":1},"prompt":"What will the second differences be?","options":[{"t":"All 1","_n":"of90","_k":"9dd5af89"},{"t":"1, 3, 5, 7, 9, 11","_n":"pf80","_k":"7029cb73"},{"t":"All 2","_n":"qf70","_k":"f3be6d3e"},{"t":"2, 4, 6, 8, 10","_n":"r060","_k":"1cdbe2b9"}],"explain":"The first differences of `x^2` are the odd numbers 1, 3, 5, …, which go up by 2 each time. So the second differences are all 2: that’s `a × 2! = 1 × 2`."},{"id":"p2","start":{"mode":"build","deg":3,"a":2,"co":[0,0,0,0],"start":0,"step":1,"rows":6,"shown":0},"prompt":"The third differences will be constant. What number will they be?","options":[{"t":"2","_n":"s050","_k":"8c4f18c3"},{"t":"6","_n":"tf80","_k":"7a023887"},{"t":"8","_n":"uf90","_k":"09c4bce3"},{"t":"12","_n":"vfa0","_k":"6c4a338f"}],"explain":"For degree 3, the constant difference is `a × 3! = 2 × 6 = 12`. It’s not `a` itself (2), not 3! alone (6), and not 2³ (8)."},{"id":"p3","start":{"mode":"mystery","mys":"doubling","rows":8,"shown":0},"prompt":"Which column will become constant?","options":[{"t":"The third","_n":"wfb0","_k":"0b0ea57a"},{"t":"The second","_n":"xf40","_k":"01511867"},{"t":"The fourth","_n":"yf50","_k":"89618f5b"},{"t":"None of them","_n":"zf60","_k":"1e2a1ab4"}],"explain":"Each difference is `2^{x+1} - 2^x = 2^x`: the same values again. Every column copies the one before, so none is ever constant. Constant differences are a polynomial’s fingerprint; exponentials don’t have one."},{"id":"p4","start":{"mode":"build","deg":2,"a":1,"co":[0,0,0,0],"start":0,"step":2,"rows":5,"shown":0},"prompt":"The second differences will be constant. What number will they be?","options":[{"t":"2","_n":"10f70","_k":"ead368f1"},{"t":"4","_n":"11000","_k":"7e2767ad"},{"t":"8","_n":"12010","_k":"96c3b554"},{"t":"16","_n":"13720","_k":"66f84b3c"}],"explain":"With `x`-values 1 apart, `x^2` gives 2. Doubling the gap makes each second difference 2² = 4 times bigger: 8. So `a = 8 ÷ 2! = 4` would be wrong. That’s why the rule needs `x`-values 1 apart."}],"chalIntro":"Use \u003cstrong>Build a polynomial\u003c/strong> with `x`-values 1 apart unless the challenge says otherwise. Set the sliders, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[2,3],"prompt":"Build a polynomial whose table has constant third differences of −18.","why":"The constant third difference is `a × 3! = 6a`, and `6a = -18`, so `a = -3`.","hints":["Constant third differences mean degree 3. What’s the link between `a` and the difference?","The constant third difference is `a × 3! = 6a`.","`6a = -18`, so `a = -3`."]},{"id":"tc2","goal":[2,3],"prompt":"Build a polynomial whose table has constant \u003cstrong>fourth\u003c/strong> differences of 12.","why":"4! = 24, so `24a = 12` and `a = 12 ÷ 24 = 0.5`.","hints":["Which factorial goes with fourth differences?","4! = 24, so `24a = 12`.","`a = 12 ÷ 24 = 0.5`."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Switch the `x`-values to \u003cstrong>2 apart\u003c/strong>. Build `y = ax^2` (no other terms) so that the second differences are constant at 12.","why":"With `x`-values 2 apart, `x^2` gives second differences of 8, so `ax^2` gives `8a`. `8a = 12`, so `a = 1.5`.","hints":["Try `a = 1` first. What are the second differences of `x^2` with `x`-values 2 apart? (P4 showed 8.)","`x^2` gives 8, so `ax^2` gives `8a`.","`8a = 12`, so `a = 1.5`."]}]},"part3":{"slug":"reverse","name":"Reverse","heading":"Reverse engineering: from a table to its equation","intro":"Each round gives you a table. Find the degree, then `a`, then peel off the leading term and finish the equation.","rounds":[{"id":"r1","name":"Round 1","xs":[0,1,2,3,4],"ys":[5,8,15,26,41],"_a":"HxRQUVBHWwVIFFUWDVdNFQkUDgUbRwoVXgMYFl8AAFNGDBZUTkVMF1ZOagZXR00VAUcWDhUFGBdZFgZMaVdBHEROFB8XUAEVSBRVWFBHWxUEThQJF1EBDUQEHAUBTEEcRAIUHxdQQQpEAgUU1fnyFRk="},{"id":"r2","name":"Round 2","xs":[0,1,2,3,4,5],"ys":[1,-2,7,40,109,226],"_a":"HxRQUVBHWwRIFFUWDVdNFQkUDhkCSUNcRgwFGBUNBFYAFA4WVxxBGkQETGoEBUMbRlNFFg1HAU5ECxQGTztSF0kWAUwXTkEGBBQYFlYJBhVeFFRMF1hBAgQMFAYfVFMCTRbWvKVFVB9RHxQfF1RBCkQEAQQXh+mlRAQBFBxFUBdZFgYGAUWDq/cUSQ=="},{"id":"r3","name":"Round 3","xs":[-2,-1,0,1,2,3],"ys":[6,3,3,3,0,-9],"trap":true,"trapFb":"Three equal values in a row aren’t enough. A constant column keeps its value all the way down.","_a":"HxRQUVBHWwRIFFUWDUhRGVEaFlkVX1EZURoWXxVfUhtGXlFVU0dbFQRPFBkXTUz12U5qBx5FXBcdFh8U9dgZaVdWFhgVABAVXhRUTRdYQRqmi0xqBEVKF6aLTBQcRVJXRhoWVVsCQw1GVkwUCkVSV14W1rylp9wfVgEdFBxFo4pMBR0UHEVSF1kW1rylVFIZURYfFAZLVBdPFgcUCkWDv/YPFNar9kNK"}],"quickCheck":{"title":"Peel it","summary":"Peel it","items":[{"id":"q1","goal":3,"prompt":"Constant third differences of 30 (`x`-values 1 apart). What is `a`?","choices":[{"t":"5","fb":"Right. Divide by 3! = 6: 30 ÷ 6 = 5.","_n":"14710","_k":"2bf241b7"},{"t":"10","fb":"Divide by 3! = 6: 30 ÷ 6 = 5.","_n":"15740","_k":"3a3cc748"},{"t":"15","fb":"Divide by 3! = 6: 30 ÷ 6 = 5.","_n":"16730","_k":"47ddf108"},{"t":"30","fb":"Divide by 3! = 6: 30 ÷ 6 = 5.","_n":"17760","_k":"26057b14"}]},{"id":"q2","goal":2,"prompt":"The second differences are 4, 4, 4, 4. What is the degree?","choices":[{"t":"1","fb":"The first constant column is the second differences: degree 2.","_n":"18750","_k":"00f96e3c"},{"t":"2","fb":"Right. The first constant column is the second differences: degree 2.","_n":"19780","_k":"8010cb3b"},{"t":"3","fb":"The first constant column is the second differences: degree 2.","_n":"1a770","_k":"1f03a0af"},{"t":"4","fb":"The first constant column is the second differences: degree 2.","_n":"1b7a0","_k":"f0126fc6"}]},{"id":"q3","goal":2,"prompt":"For the table of `y = 3^x`, which column becomes constant?","choices":[{"t":"First","fb":"Each difference column of `3^x` is the same pattern times 2, 4, 8, …: it never settles.","_n":"1c790","_k":"cf1b40a7"},{"t":"Second","fb":"Each difference column of `3^x` is the same pattern times 2, 4, 8, …: it never settles.","_n":"1d8c0","_k":"a2c28fbb"},{"t":"None","fb":"Right. Each difference column of `3^x` is the same pattern times 2, 4, 8, …: it never settles.","_n":"1e8d0","_k":"214321e2"},{"t":"Third","fb":"Each difference column of `3^x` is the same pattern times 2, 4, 8, …: it never settles.","_n":"1f8a0","_k":"bd70e71b"}]},{"id":"q4","goal":5,"prompt":"After peeling `2x^2` off a quadratic table (`x = 0, 1, 2, 3`), the leftover column reads 7, 4, 1, −2. What is the rest of the equation?","choices":[{"t":"`-3x + 7`","fb":"Right. The leftover column falls by 3 each step (slope −3) and is 7 at `x = 0` (intercept 7).","_n":"1g8b0","_k":"713fdbbe"},{"t":"`3x + 7`","fb":"The leftover column falls by 3 each step (slope −3) and is 7 at `x = 0` (intercept 7).","_n":"1h880","_k":"b47bc1fc"},{"t":"`-3x - 2`","fb":"The leftover column falls by 3 each step (slope −3) and is 7 at `x = 0` (intercept 7).","_n":"1i890","_k":"d670b9e4"},{"t":"`7x - 3`","fb":"The leftover column falls by 3 each step (slope −3) and is 7 at `x = 0` (intercept 7).","_n":"1j860","_k":"5ed90d00"}]}]}},"practice":{"activities":[{"id":"sort","type":"sorter","title":"Sort the tables","summary":"Sort the tables","goal":[2,4],"noun":"table","instruction":"Sort each table by the degree its differences show. (`x = 0, 1, 2, 3, 4, 5` in every table.)","how":"Tap a table, then tap the box it belongs in. You can open a scratch difference machine for any table.","boxes":[{"id":"d1","label":"Degree 1"},{"id":"d2","label":"Degree 2"},{"id":"d3","label":"Degree 3"},{"id":"none","label":"No column becomes constant","sub":"(in these rows)"}],"items":[{"id":"i7","ys":[0,1,8,27,64,125],"t":"0, 1, 8,\u003cbr>27, 64, 125","_a":"RlIHFg==","why":"Third differences are all 6.","goal":[2,4],"wrong":{"d1":"That column isn’t constant all the way down. Check the next column.","d2":"That column isn’t constant all the way down. Check the next column.","none":"Keep subtracting: column 3 is constant."},"hints":["Find the first differences.","1, 7, 19, 37, 61. Constant? If not, find their differences.","The third differences are 6, 6, 6: constant, so degree 3."]},{"id":"i1","ys":[3,7,11,15,19,23],"t":"3, 7, 11,\u003cbr>15, 19, 23","_a":"RlIFFg==","why":"First differences are all 4.","goal":[2,4],"wrong":{"d2":"An earlier column is already constant. The degree is the \u003cstrong>first\u003c/strong> constant column.","d3":"An earlier column is already constant. The degree is the \u003cstrong>first\u003c/strong> constant column.","none":"Keep subtracting: column 1 is constant."},"hints":["Find the first differences.","4, 4, 4, 4, 4. Constant? If not, find their differences.","The first differences are 4, 4, 4, 4, 4: constant, so degree 1."]},{"id":"i10","ys":[1,3,9,27,81,243],"t":"1, 3, 9,\u003cbr>27, 81, 243","_a":"RlhbWlJH","why":"Each column is the last one times 2, 4, 8, …: exponential.","goal":[2,4],"wrong":{"d1":"Look at the column you think is constant: it’s still growing. Exponential tables never settle.","d2":"Look at the column you think is constant: it’s still growing. Exponential tables never settle.","d3":"Look at the column you think is constant: it’s still growing. Exponential tables never settle."},"hints":["Find the first differences.","2, 6, 18, 54, 162. Constant? If not, find their differences.","Every column keeps growing, so no column becomes constant."]},{"id":"i4","ys":[1,2,5,10,17,26],"t":"1, 2, 5,\u003cbr>10, 17, 26","_a":"RlIGFg==","why":"First differences 1, 3, 5, 7, 9; second differences all 2.","goal":[2,4],"wrong":{"d1":"That column isn’t constant all the way down. Check the next column.","d3":"An earlier column is already constant. The degree is the \u003cstrong>first\u003c/strong> constant column.","none":"Keep subtracting: column 2 is constant."},"hints":["Find the first differences.","1, 3, 5, 7, 9. Constant? If not, find their differences.","The second differences are 2, 2, 2, 2: constant, so degree 2."]},{"id":"i8","ys":[2,2,4,14,38,82],"t":"2, 2, 4,\u003cbr>14, 38, 82","_a":"RlIHFg==","why":"Third differences are all 6.","goal":[2,4],"wrong":{"d1":"That column isn’t constant all the way down. Check the next column.","d2":"That column isn’t constant all the way down. Check the next column.","none":"Keep subtracting: column 3 is constant."},"hints":["Find the first differences.","0, 2, 10, 24, 44: not constant. Their differences are 2, 8, 14, 20: still not constant.","The third differences are 6, 6, 6: degree 3."]},{"id":"i11","ys":[2,3,5,9,17,33],"t":"2, 3, 5,\u003cbr>9, 17, 33","_a":"RlhbWlJH","why":"The differences are 1, 2, 4, 8, 16: doubling, so they never settle al tables never settle.","d3":"Look at the column you think is constant: it’s still growing. Exponential tables never settle."},"hints":["Find the first differences.","0, 1, 4, 18, 96. Constant? If not, find their differences.","Every column keeps growing, so no column becomes constant."]},{"id":"i9","ys":[0,1,14,51,124,245],"t":"0, 1, 14,\u003cbr>51, 124, 245","_a":"RlIHFg==","why":"Third differences are all 12.","goal":[2,4],"wrong":{"d1":"That column isn’t constant all the way down. Check the next column.","d2":"That column isn’t constant all the way down. Check the next column.","none":"Keep subtracting: column 3 is constant."},"hints":["Find the first differences.","1, 13, 37, 73, 121. Constant? If not, find their differences.","The third differences are 12, 12, 12: constant, so degree 3."]},{"id":"i6","ys":[1,2,4,7,11,16],"t":"1, 2, 4,\u003cbr>7, 11, 16","_a":"RlIGFg==","why":"First differences 1, 2, 3, 4, 5; second differences all 1.","goal":[2,4],"wrong":{"d1":"That column isn’t constant all the way down. Check the next column.","d3":"An earlier column is already constant. The degree is the \u003cstrong>first\u003c/strong> constant column.","none":"Keep subtracting: column 2 is constant."},"hints":["Find the first differences.","1, 2, 3, 4, 5. Constant? If not, find their differences.","The second differences are 1, 1, 1, 1: constant, so degree 2."]},{"id":"i3","ys":[20,14,8,2,-4,-10],"t":"20, 14, 8,\u003cbr>2, −4, −10","_a":"RlIFFg==","why":"First differences are all −6.","goal":[2,4],"wrong":{"d2":"An earlier column is already constant. The degree is the \u003cstrong>first\u003c/strong> constant column.","d3":"An earlier column is already constant. The degree is the \u003cstrong>first\u003c/strong> constant column.","none":"Keep subtracting: column 1 is constant."},"hints":["Find the first differences.","−6, −6, −6, −6, −6. Constant? If not, find their differences.","The first differences are −6, −6, −6, −6, −6: constant, so degree 1."]}]},{"id":"missing","type":"numeric","title":"Missing pieces","summary":"Missing pieces","star":true,"goal":[3,5,6],"instruction":"Use differences to find each missing number. All tables have `x`-values 1 apart.","items":[{"id":"n1","goal":3,"prompt":"A quadratic table has constant second differences of −6. What is `a`?","_a":"SQU=","display":"`a = -3`","keypad":"text","why":"−6 ÷ 2! = −6 ÷ 2 = −3.","wrong":[{"match":-6,"fb":"Divide by 2! = 2."},{"match":3,"fb":"Watch the sign."}],"hints":["Which factorial goes with second differences?","The constant second difference is `a × 2! = 2a`.","`2a = -6`, so `a = -3`."]},{"id":"n2","goal":3,"prompt":"A cubic has leading coefficient 4. What are its constant third differences?","_a":"VgI=","display":"24","why":"`a × 3! = 4 × 6 = 24`.","wrong":[{"match":12,"fb":"Multiply by 3! = 6, not 3."},{"match":4,"fb":"The difference is `a × 3!`, not `a`."}],"hints":["The constant third difference is `a × 3!`.","3! = 3 × 2 × 1 = 6.","4 × 6 = 24."]},{"id":"n3","goal":5,"star":true,"prompt":"A quadratic’s table (`x = 0` to 4) reads 3, 6, ?, 18, 27. Find the missing value.","_a":"VQc=","display":"11","why":"With 11 in the gap, the second differences are 2, 2, 2.","wrong":[{"match":9,"fb":"Call it `m` and write the second differences in terms of `m`: `m - 9`, `24 - 2m`, `m - 9`. They must be equal."},{"match":12,"fb":"Call it `m` and write the second differences in terms of `m`: `m - 9`, `24 - 2m`, `m - 9`. They must be equal."}],"hints":["Call the missing value `m`. Write the first differences in terms of `m`.","First differences: 3, `m - 6`, `18 - m`, 9. Second differences: `m - 9`, `24 - 2m`, `m - 9`.","A quadratic has constant second differences: `m - 9 = 24 - 2m`, so `3m = 33` and `m = 11`. (Check: second differences 2, 2, 2.)"]},{"id":"n4","goal":5,"star":true,"prompt":"A table (`x = 0, 1, 2, …`) has first differences 5, 9, 13, 17, … and `y(0) = -2`. Find `y(6)`.","_a":"XA4=","display":"`y(6) = 88`","why":"Adding the first differences 5, 9, 13, 17, 21, 25 to −2 gives 3, 12, 25, 42, 63, 88.","wrong":[{"match":25,"fb":"That’s the 6th first difference. Add the differences to −2 one at a time."},{"match":63,"fb":"That’s `y(5)`."}],"hints":["Each `y`-value is the one before plus the next first difference.","The first differences go up by 4: 5, 9, 13, 17, 21, 25. Start at `y(0) = -2` and add them on.","−2 + 5 = 3, 3 + 9 = 12, 12 + 13 = 25, 25 + 17 = 42, 42 + 21 = 63, 63 + 25 = 88. So `y(6) = 88`."]},{"id":"n5","goal":6,"star":true,"prompt":"A triangular pyramid of cans has 1, 4, 10, 20, 35 cans for 1 to 5 layers. How many cans for 8 layers?","_a":"VQQE","display":"120 cans","why":"The third differences stay at 1, so the table continues 56, 84, 120.","wrong":[{"match":84,"fb":"That’s 7 layers. Extend the table one more row."},{"match":56,"fb":"That’s 6 layers."}],"hints":["Find the differences until a column is constant.","First differences 3, 6, 10, 15; second differences 3, 4, 5; third differences 1, 1. Keep the third differences at 1 and extend the table.","Second differences 6, 7, 8; first differences 21, 28, 36; cans 56, 84, 120. So 8 layers hold 120 cans."]},{"id":"n6","goal":5,"star":true,"prompt":"A cubic with leading coefficient 1 has the table `x = 0, 1, 2, 3` → `y = 2, 1, 6, 23`. Find `y(5)`.","_a":"VQcD","display":"`y(5) = 117`","why":"Keeping the third differences at 6 extends the table to 58 and then 117.","wrong":[{"match":58,"fb":"That’s `y(4)`."},{"match":93,"fb":"That keeps the second differences at 12. A cubic’s \u003cstrong>third\u003c/strong> differences are constant (1 × 3! = 6), so the second differences keep growing: 6, 12, 18, 24."}],"hints":["With only 4 rows you get one third difference. What must it be for `a = 1`?","First differences −1, 5, 17; second 6, 12; third 6, which matches 1 × 3! = 6. Keep the third differences at 6 and build the table outward.","Second differences 6, 12, 18, 24; first differences −1, 5, 17, 35, 59; `y` = 2, 1, 6, 23, 58, 117. So `y(5) = 117`. (It’s `y = x^3 - 2x + 2`.)"]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the error","student":"Liam","how":"","instruction":"Liam made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"`x = 0` to 4, `y = 1, 4, 19, 64, 157`. Find the degree and the leading coefficient.","steps":["First differences: 3, 15, 45, 93.","Second differences: 12, 30, 48.","Third differences: 18, 18. Constant, so degree 3.","`a = 18 ÷ 3 = 6`."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"`a = 18 ÷ 3! = 18 ÷ 6 = 3`.","why":"The third difference is `a × 3!`.","_n":"1k870","_k":"d87b8a5b"},{"t":"`a = 18`.","why":"That forgets to divide at all.","_n":"1l840","_k":"825e7744"},{"t":"Step 4 is correct as written.","why":"3! = 3 × 2 × 1 = 6, not 3.","_n":"1m850","_k":"a6f4c3fc"},{"t":"`a = 18 ÷ 2 = 9`.","why":"2 is 2!, the factorial for degree 2. Degree 3 needs 3! = 6.","_n":"1n860","_k":"06d038a4"}],"hints":["Which factorial goes with third differences?","3! = 3 × 2 × 1.","Step 4 is wrong: `a = 18 ÷ 6 = 3`."]},{"id":"e2","goal":1,"task":"`x = 0` to 4, `y = 20, 17, 8, -7, -28`. Find `a` and say which way the parabola opens.","steps":["First differences (earlier minus later): 3, 9, 15, 21.","Second differences: 6, 6, 6.","Degree 2, so `a = 6 ÷ 2! = 3`.","`a > 0`, so the parabola opens up."],"_a":"VA==","stepFb":["","Step 2 follows from step 1. The mistake is earlier.","The ÷ 2! is right. The sign comes from step 1.","Step 4 follows from step 3. The mistake is earlier."],"fixes":[{"t":"Use the sizes only: `a = 3`, and decide the direction from the first `y`-value.","why":"The sign of the differences is the information you need. Don’t drop it.","_n":"1o850","_k":"20999d7e"},{"t":"Keep 3, 9, 15, 21, but take `a = 6`.","why":"That keeps the sign error and forgets ÷ 2!.","_n":"1p840","_k":"c119fea8"},{"t":"Later minus earlier: −3, −9, −15, −21. Then the second differences are −6, so `a = -3` and it opens down.","why":"The `y`-values fall faster and faster: a downward parabola.","_n":"1q830","_k":"8437bff9"},{"t":"Step 1 is correct as written.","why":"Differences are later minus earlier. Falling values give negative differences.","_n":"1r8a0","_k":"538f5dcf"}],"hints":["Check the direction of the subtraction in step 1.","The `y`-values go down: 20, 17, 8, …. Should the differences be positive?","Step 1 is wrong: the first differences are −3, −9, −15, −21, so `a = -6 ÷ 2 = -3` and the parabola opens down."]},{"id":"e3","goal":4,"task":"Is this table from a polynomial? `x = 0` to 5, `y = 2, 6, 18, 54, 162, 486`.","steps":["First differences: 4, 12, 36, 108, 324.","Second differences: 8, 24, 72, 216.","Third differences: 16, 48, 144.","The next column must be constant, so it’s degree 4."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct.","Step 3 is correct.",""],"fixes":[{"t":"It’s degree 3, because there are three difference columns.","why":"The number of columns computed isn’t the degree.","_n":"1s890","_k":"87e844ce"},{"t":"Step 4 is correct as written.","why":"The fourth differences are 32, 96: still growing ×3. Nothing forces a column to become constant.","_n":"1t880","_k":"44e0beb0"},{"t":"Each column is the one above it times 2, and every column still grows ×3. No column will settle: it’s exponential, `y = 2 × 3^x`.","why":"The pattern copies itself.","_n":"1u870","_k":"8d17f269"},{"t":"It’s degree 5, because there are 6 rows.","why":"The number of rows isn’t the degree either.","_n":"1v7e0","_k":"dc1a2ade"}],"hints":["Compare each column with the one above it.","4, 12, 36, … is 2, 6, 18, … times 2. What does that say about the next column?","Step 4 is wrong: every column grows ×3, so none is constant. It’s exponential, not a polynomial."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you in the difference machine: the doubling table, the `n!` rule, or the 2-apart spacing?"},{"id":"j2","q":"In your own words, why do the `n`th differences of a degree `n` polynomial come out constant?"},{"id":"j3","q":"Explain to a friend how to get from a table to an equation by peeling off the leading term."},{"id":"j4","q":"Which step still trips you up: subtracting in the right order, choosing the factorial, or spotting when a table won’t settle? What will you do about it?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"A table with `x`-values 1 apart has constant third differences, and its second differences are not constant. What is the degree of the polynomial?","options":[{"t":"2","why":"Constant third differences come one column later than degree 2.","_n":"1w7d0","_k":"8a1392c6"},{"t":"3","why":"The first constant column is the third differences: degree 3.","_n":"1xfff","_k":"09ed3f85"},{"t":"4","why":"Degree 4 would need constant fourth differences, not third.","_n":"1y00f","_k":"a01b7793"},{"t":"6","why":"6 is 3!, which you use for the leading coefficient, not the degree.","_n":"1z01f","_k":"674ccd79"}]},"b":{"prompt":"A table with `x`-values 1 apart has constant fourth differences, and its third differences are not constant. What is the degree of the polynomial?","options":[{"t":"3","why":"Degree 3 would already be constant at the third differences.","_n":"2002f","_k":"90dc9d41"},{"t":"4","why":"The first constant column is the fourth differences: degree 4.","_n":"2103f","_k":"1270b936"},{"t":"5","why":"Degree 5 would need constant fifth differences.","_n":"2204f","_k":"bf2e82c5"},{"t":"24","why":"24 is 4!, which you use for the leading coefficient, not the degree.","_n":"2305f","_k":"7b0f87ad"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"A polynomial table (`x`-values 1 apart) has constant third differences of −24. What is the leading coefficient?","options":[{"t":"−24","why":"That’s the difference itself. Divide by 3! = 6.","_n":"2406f","_k":"22dbff61"},{"t":"−8","why":"That divides by 3. Divide by 3! = 6.","_n":"25f7f","_k":"f913e213"},{"t":"−4","why":"−24 ÷ 3! = −24 ÷ 6 = −4.","_n":"26f8f","_k":"b0a5c928"},{"t":"4","why":"The sign of the difference is the sign of `a`.","_n":"27f9f","_k":"707881af"}]},"b":{"prompt":"A polynomial table (`x`-values 1 apart) has constant fourth differences of 48. What is the leading coefficient?","options":[{"t":"2","why":"48 ÷ 4! = 48 ÷ 24 = 2.","_n":"28f8f","_k":"9e426022"},{"t":"8","why":"That divides by 3! = 6. Fourth differences need 4!.","_n":"29fbf","_k":"fdc1d0f6"},{"t":"12","why":"That divides by 4. Divide by 4! = 24.","_n":"2afaf","_k":"47606129"},{"t":"48","why":"That’s the difference itself. Divide by 4! = 24.","_n":"2bf5f","_k":"76dc98a6"}]}},{"id":"k3","cat":"K","goal":1,"a":{"prompt":"`x = 0` to 4, `y = 4, 7, 14, 25, 40`. What are the second differences?","options":[{"t":"4, 4, 4","why":"First differences 3, 7, 11, 15; their differences are 4, 4, 4.","_n":"2cf4f","_k":"11e2a335"},{"t":"−4, −4, −4","why":"The values rise faster and faster, so the differences are positive.","_n":"2df7f","_k":"708f37aa"},{"t":"3, 7, 11, 15","why":"Those are the first differences.","_n":"2ef6f","_k":"f59a2916"},{"t":"2, 2, 2","why":"That’s 4 ÷ 2!, the leading coefficient, not the differences.","_n":"2f01f","_k":"0879caa8"}]},"b":{"prompt":"`x = 0` to 4, `y = 9, 6, -1, -12, -27`. What are the second differences?","options":[{"t":"−2, −2, −2","why":"That’s −4 ÷ 2!, the leading coefficient, not the differences.","_n":"2g00f","_k":"0b0d1eb0"},{"t":"−4, −4, −4","why":"First differences −3, −7, −11, −15; their differences are −4, −4, −4.","_n":"2hf3f","_k":"6909b405"},{"t":"−3, −7, −11, −15","why":"Those are the first differences.","_n":"2if4f","_k":"8f7a5718"},{"t":"4, 4, 4","why":"The values fall faster and faster, so the differences are negative.","_n":"2jf1f","_k":"69f45492"}]}},{"id":"t1","cat":"T","goal":4,"a":{"prompt":"Each table has `x = 0` to 5. Which one could \u003cstrong>not\u003c/strong> come from a polynomial of degree 3 or less?","options":[{"t":"−2, 1, 4, 7, 10, 13","why":"First differences are all 3: linear.","_n":"2kf2f","_k":"37dce624"},{"t":"5, 5, 7, 11, 17, 25","why":"Second differences are all 2: a quadratic, even though it starts with a repeated value.","_n":"2lf7f","_k":"2fc50be2"},{"t":"1, 2, 4, 8, 16, 32","why":"Its differences repeat 1, 2, 4, 8, …, so no column becomes constant: it’s `2^x`.","_n":"2mf8f","_k":"742413db"},{"t":"0, 1, 8, 27, 64, 125","why":"Third differences are all 6: it’s `x^3`. Fast growth isn’t the test; constant differences are.","_n":"2nf5f","_k":"a8d0b5c2"}]},"b":{"prompt":"Each table has `x = 0` to 5. Which one could \u003cstrong>not\u003c/strong> come from a polynomial of degree 3 or less?","options":[{"t":"1, −1, 3, 19, 53, 111","why":"Third differences are all 6: a cubic (`x^3 - 3x + 1`).","_n":"2of6f","_k":"9e304f2c"},{"t":"10, 8, 6, 4, 2, 0","why":"First differences are all −2: linear.","_n":"2pfbf","_k":"d09188e7"},{"t":"2, 3, 6, 11, 18, 27","why":"Second differences are all 2: a quadratic.","_n":"2qfcf","_k":"9c28df0b"},{"t":"0, 1, 1, 2, 3, 5","why":"Differences 1, 0, 1, 1, 2 → −1, 1, 0, 1 → 2, −1, 1: no column up to the third is constant.","_n":"2r7f1","_k":"be7e8488"}]}},{"id":"t2","cat":"T","goal":5,"a":{"prompt":"A quadratic’s table has `x = 1` to 5 and `y = 2, 5, ?, 17, 26`. What is the missing value?","options":[{"t":"8","why":"That assumes the first differences are constant (5 + 3). A quadratic has constant \u003cstrong>second\u003c/strong> differences.","_n":"2s801","_k":"bdd47939"},{"t":"9","why":"That guesses first differences 3, 4, …. Then 17 − 9 = 8 and 26 − 17 = 9 don’t continue the pattern.","_n":"2t7d1","_k":"ea47daab"},{"t":"10","why":"With `m` missing, the second differences are `m - 8`, `22 - 2m`, `m - 8`. Setting `m - 8 = 22 - 2m` gives `m = 10` (second differences 2, 2, 2).","_n":"2u7e1","_k":"b8c3a730"},{"t":"11","why":"That averages 5 and 17. A quadratic isn’t a straight line, so the middle value isn’t the average.","_n":"2v7b1","_k":"d7eba033"}]},"b":{"prompt":"A quadratic’s table has `x = 1` to 5 and `y = 1, 6, ?, 28, 45`. What is the missing value?","options":[{"t":"11","why":"That assumes the first differences are constant (6 + 5).","_n":"2w7c1","_k":"e020e68b"},{"t":"12","why":"That guesses first differences 5, 6, …. Then 28 − 12 = 16 and 45 − 28 = 17 don’t continue the pattern.","_n":"2x791","_k":"7e545eee"},{"t":"15","why":"With `m` missing, the second differences are `m - 11`, `34 - 2m`, `m - 11`. Setting them equal gives `m = 15` (second differences 4, 4, 4).","_n":"2y7a1","_k":"15b01e58"},{"t":"17","why":"That averages 6 and 28. A quadratic isn’t a straight line.","_n":"2z771","_k":"6bf82476"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"`x = 0` to 4, `y = 3, 0, 1, 6, 15`. Which equation fits the table?","options":[{"t":"`y = 2x^2 - 3x + 3`","why":"That uses the first difference −3 as `b`. At `x = 1` it gives 2, not 0.","_n":"30781","_k":"1609db38"},{"t":"`y = 2x^2 - 5x + 3`","why":"Second differences 4, so `a = 4 ÷ 2 = 2`. `y(0) = 3` gives the constant 3. `y(1) = 0` gives `2 + b + 3 = 0`, so `b = -5`.","_n":"31e51","_k":"a90fccf1"},{"t":"`y = x^2 - 4x + 3`","why":"That divides by 2 twice (`a = 1`). It fits the first two points but gives −1 at `x = 2`, not 1.","_n":"32e41","_k":"17a25070"},{"t":"`y = 4x^2 - 7x + 3`","why":"That uses `a = 4`, the second difference itself. It fits (0, 3) and (1, 0) but gives 5 at `x = 2`, not 1.","_n":"33e71","_k":"38bc705a"}]},"b":{"prompt":"`x = 0` to 4, `y = -2, 1, 10, 25, 46`. Which equation fits the table?","options":[{"t":"`y = 1.5x^2 + 1.5x - 2`","why":"That divides by 2 twice (`a = 1.5`). It fits the first two points but gives 7 at `x = 2`, not 10.","_n":"34e61","_k":"bc3c5720"},{"t":"`y = 3x^2 + 3x - 2`","why":"That uses the first difference 3 as `b`. At `x = 1` it gives 4, not 1.","_n":"35e91","_k":"e6c99bd6"},{"t":"`y = 6x^2 - 3x - 2`","why":"That uses `a = 6`, the second difference itself. At `x = 2` it gives 16, not 10.","_n":"36e81","_k":"f774daf8"},{"t":"`y = 3x^2 - 2`","why":"Second differences 6, so `a = 3`. `y(0) = -2`. `y(1) = 1` gives `3 + b - 2 = 1`, so `b = 0`.","_n":"37eb1","_k":"3f2a6aec"}]}},{"id":"c1","cat":"C","goal":3,"a":{"prompt":"Which is a correct statement of the leading-coefficient rule?","options":[{"t":"If the `x`-values are 1 apart and the `n`th differences are constant at `D`, then `a = D × n!`.","why":"That multiplies. `D = a × n!`, so `a = D ÷ n!`.","_n":"38ea1","_k":"b71b1a53"},{"t":"If the `n`th differences are constant at `D`, then `a = D ÷ n`.","why":"The divisor is `n!`, and the `x`-values must be 1 apart.","_n":"39ed1","_k":"9ace6fe3"},{"t":"If the `x`-values are 1 apart and the `n`th differences are constant at `D`, then `a = D ÷ n!`.","why":"Both conditions and the factorial.","_n":"3aec1","_k":"8eecf9cf"},{"t":"The constant difference is always equal to `a`.","why":"Only for degree 1, where 1! = 1.","_n":"3b731","_k":"6d7f3e79"}]},"b":{"prompt":"Which is a correct statement about the differences of a polynomial?","options":[{"t":"If the `x`-values are 1 apart, a polynomial of degree `n` has constant differences in column `n - 1`.","why":"The constant column is column `n`: a line (degree 1) has constant \u003cstrong>first\u003c/strong> differences.","_n":"3c741","_k":"1a2580e3"},{"t":"If the `x`-values are 1 apart, a polynomial of degree `n` has constant `n`th differences equal to `a`.","why":"Only for degree 1.","_n":"3d751","_k":"00f66675"},{"t":"A polynomial of degree `n` has constant `n`th differences equal to `a × n`, for any spacing.","why":"The factor is `n!`, and the spacing matters.","_n":"3e761","_k":"633b7fb3"},{"t":"If the `x`-values are 1 apart, a polynomial of degree `n` with leading coefficient `a` has constant `n`th differences equal to `a × n!`.","why":"Both conditions and the factorial.","_n":"3f771","_k":"8ca2f836"}]}},{"id":"c2","cat":"C","goal":4,"a":{"prompt":"Which is the best explanation of why the table of `y = 3^x` (`x = 0, 1, 2, …`) never gives a constant difference column?","options":[{"t":"Because 6 rows aren’t enough to see it.","why":"More rows don’t help: every column is `3^x` times a number.","_n":"3g781","_k":"7597ba2b"},{"t":"Each first difference is `3^{x+1} - 3^x = 2 × 3^x`, so the first differences are the same growing pattern times 2. The same happens in every column, so none ever settles.","why":"The pattern copies itself.","_n":"3h791","_k":"ad799bda"},{"t":"Because the `y`-values are all odd.","why":"Odd values have nothing to do with it: 1, 3, 5, 7 has constant differences.","_n":"3i7a1","_k":"f3a34110"},{"t":"Because the `x`-values aren’t 1 apart.","why":"They are 1 apart. The problem is the function, not the spacing.","_n":"3j6b1","_k":"4176f4cb"}]},"b":{"prompt":"A table has `x = 0, 1, 3, 6, 10` and its second differences are constant. Which is the best explanation of why you can’t conclude `a` = (second difference) ÷ 2! here?","options":[{"t":"The `x`-values aren’t equally spaced 1 apart, so each difference measures change over a different width. The `n!` rule only works with `x`-values 1 apart.","why":"The rule needs `x`-values 1 apart, and these gaps are 1, 2, 3 and 4.","_n":"3k6c1","_k":"0024277c"},{"t":"Because finite differences only work for `x ≥ 1`.","why":"Tables can start anywhere, even at negative `x`.","_n":"3l791","_k":"dcae4b99"},{"t":"Because 10 is too big for the rule.","why":"The size of the numbers doesn’t matter.","_n":"3m781","_k":"454d24e1"},{"t":"Because the `y`-values aren’t equally spaced.","why":"The `y`-values never need to be equally spaced; the `x`-values do.","_n":"3n771","_k":"d6e04471"}]}},{"id":"a1","cat":"A","goal":6,"a":{"prompt":"Oranges are stacked in square pyramids. Stacks with 1, 2, 3, 4, 5 layers hold 1, 5, 14, 30, 55 oranges. If a polynomial models the number of oranges, what are its degree and leading coefficient?","options":[{"t":"Degree 2, `a = 5/2`","why":"That stops at the second differences 5, 7, 9, which aren’t constant.","_n":"3o761","_k":"07806179"},{"t":"Degree 3, `a = 2/3`","why":"That divides by 3. Divide by 3! = 6.","_n":"3p7d1","_k":"caac8b54"},{"t":"Degree 3, `a = 2`","why":"That’s the difference itself.","_n":"3q7c1","_k":"976129fe"},{"t":"Degree 3, `a = 1/3`","why":"Differences 4, 9, 16, 25 → 5, 7, 9 → 2, 2. `a = 2 ÷ 3! = 1/3`.","_n":"3r7b1","_k":"63a7c29f"}]},"b":{"prompt":"A sculptor builds `n × n × n` cubes from small blocks, plus `n` display blocks. For `n = 1` to 5 the totals are 2, 10, 30, 68, 130 blocks. If a polynomial models the total, what are its degree and leading coefficient?","options":[{"t":"Degree 3, `a = 1`","why":"Differences 8, 20, 38, 62 → 12, 18, 24 → 6, 6. `a = 6 ÷ 3! = 1`.","_n":"3s7a1","_k":"7186a6ed"},{"t":"Degree 2, `a = 6`","why":"That stops at the second differences 12, 18, 24, which aren’t constant.","_n":"3t711","_k":"e51c4f09"},{"t":"Degree 3, `a = 2`","why":"That divides by 3. Divide by 3! = 6.","_n":"3u701","_k":"dfe8de81"},{"t":"Degree 3, `a = 6`","why":"That’s the difference itself.","_n":"3vf72","_k":"8adf5e4b"}]}},{"id":"a2","cat":"A","goal":6,"a":{"prompt":"A model rocket’s height, in metres, at `t = 0, 1, 2, 3, 4` s is 0, 35, 60, 75, 80. Assuming a quadratic model, when does it land?","options":[{"t":"9 s","why":"That counts the rows of the extended table (`t = 0` to 8 is 9 rows) instead of reading the `t`-value.","_n":"3wf82","_k":"c0583cf9"},{"t":"4.5 s","why":"That uses `a = -10`. The second differences are −10, so `a = -10 ÷ 2 = -5`.","_n":"3xf52","_k":"b029fcef"},{"t":"8 s","why":"Second differences −10, so `a = -5`; `h = -5t^2 + 40t = -5t(t - 8)`. It lands at `t = 8`.","_n":"3yf62","_k":"7c3fb506"},{"t":"4 s","why":"That’s when it’s highest (the first differences shrink to 5, then turn negative). It lands later.","_n":"3zfb2","_k":"430dc62e"}]},"b":{"prompt":"A ball rolls up a ramp and back. Its distance up the ramp, in centimetres, at `t = 0, 1, 2, 3, 4` s is 0, 18,  …, 27 + `b` explain why it must be between −26 and −4, with line 4 narrowing it to −16 … −8."},"cards":[["First difference","Later minus earlier: `y(x + 1) - y(x)`. Falling values give negative differences."],["Constant `n`th differences","With `x`-values 1 apart, the polynomial has degree `n` (the \u003cstrong>first\u003c/strong> constant column)."],["The leading-coefficient rule","`a` = (constant `n`th difference) ÷ `n!`. Example: third differences 12 → `a = 12 ÷ 6 = 2`."],["2!, 3!, 4!","2, 6, 24. `n! = n × (n - 1) × … × 1`."],["Linear table","First differences constant, equal to the slope."],["Quadratic table","Second differences constant, equal to `2a`."],["Cubic table","Third differences constant, equal to `6a`."],["Exponential table","Differences never settle: for `2^x`, every column is 1, 2, 4, 8, … again."],["Negative constant difference","Negative leading coefficient: −6 as second difference means `a = -3`, opening down."],["Peeling","Once you know `a`, subtract `ax^n` from each `y`-value. The new column has a lower degree; repeat to find the rest of the equation."],["`x`-values 2 apart","The `n!` rule fails: each `n`th difference is `2^n` times bigger. `x^2` with `x = 0, 2, 4, …` has second differences 8, not 2."],["How many rows do you need?","To see constant `n`th differences you need at least `n + 2` rows, so the `n`th column has two entries to compare. Equal entries in a short column can be a coincidence."]]}};</script>
