.olist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.olist li{display:flex;gap:8px;align-items:stretch}
.ostep{flex:1;display:flex;gap:10px;align-items:baseline;text-align:left;border:2px solid var(--rule);background:var(--sheet);border-radius:6px;padding:.5em .75em;min-width:0}
.ostep > span:last-child{min-width:0;overflow-wrap:anywhere}
.ostep[aria-pressed="true"]{border-color:var(--ink);background:var(--hi-soft)}
.ostep.bad{border-color:var(--red);background:var(--bad-bg)}
.ostep.good{border-color:var(--green);background:var(--good-bg)}
.ostep .sn{flex:0 0 auto;font-weight:700;color:var(--ink-2)}
.omoves{display:flex;flex-direction:column;gap:4px}
.omoves .btn{padding:.2em .55em;font-size:.85rem}
.numrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.numrow label{font-weight:700}
.numin{width:12rem;max-width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.15rem var(--font-math)}
.numin.short{width:6.5rem}
.numin:focus{border-color:var(--ink)}
.numin:disabled{opacity:.8}
.sa-opt[aria-checked="true"]{border-color:var(--ink);background:var(--hi-soft)}
.tbl-wrap{overflow-x:auto;max-width:100%;border:1.5px solid var(--rule);border-radius:8px}
table.vt{border-collapse:collapse;min-width:100%;font-family:var(--font-math);font-size:1.05rem}
table.vt th,table.vt td{padding:6px 12px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
table.vt th{font-family:var(--font-ui);font-size:.85rem;color:var(--ink-2);background:var(--paper)}
table.vt tr:last-child td{border-bottom:0}
table.vt .hl{background:var(--hi-soft)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.player .ctr{font-size:.9rem;color:var(--ink-2)}
.jq{margin:0 0 18px}
.jq label{display:block;font-weight:700;margin-bottom:6px}
textarea{width:100%;min-height:96px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--ink)}
.saved{font-size:.82rem;color:var(--ink-2);min-height:1.2em;margin-top:4px}
.cw{padding:12px 0;border-bottom:1px solid var(--rule)}
.cw:last-child{border-bottom:0}
.txtin{width:100%;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em}
.txtin:focus{border-color:var(--ink)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem;gap:12px;align-items:center}
.bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen)}
.bar-row b{text-align:right;font-family:var(--font-math);font-size:1.1rem}
.design{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px 30px;align-items:start}
.design > *{min-width:0}
.inrow{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.inrow label{display:grid;gap:4px;font-weight:700}
.inrow input{width:7.5rem;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.45em .7em;font:400 1.25rem var(--font-math)}
.inrow input:focus{border-color:var(--ink)}
ul.checks{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
ul.checks li{display:flex;gap:10px;align-items:baseline}
ul.checks .mk{flex:0 0 1.3em;font-weight:700;text-align:center}
ul.checks li.yes .mk{color:var(--green)}
ul.checks li.no .mk{color:var(--ink-2)}
.namefield{display:grid;gap:4px;font-weight:700;margin:0 0 14px;max-width:340px}
.namefield input{border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);padding:.5em .7em;font-weight:400}
pre.summary{white-space:pre-wrap;word-break:break-word;background:var(--paper);border:1.5px solid var(--rule);border-radius:8px;padding:14px;font:400 .92rem/1.5 var(--font-ui);max-height:420px;overflow:auto;margin:0 0 12px}
.topic-tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.topic-tbl th,.topic-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.topic-tbl th{font-size:.82rem;color:var(--ink-2)}
.ars{border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
dialog.fc{border:1.5px solid var(--rule);border-radius:12px;background:var(--sheet);color:var(--ink);padding:20px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
dialog.fc::backdrop{background:rgba(20,28,40,.55)}
.fc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.fc-top h2{margin:0;font-size:1.5rem}
.fc-stage{perspective:1200px}
.card{position:relative;display:block;width:100%;height:clamp(220px,46vh,300px);border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .5s ease}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:10px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;background:var(--sheet);overflow:auto}
.face.front{font:600 clamp(1.45rem,4.5vw,1.9rem)/1.25 var(--font-math)}
.face.back{transform:rotateY(180deg);background:var(--hi-soft);font-size:1.05rem}
.face.back > span{background:var(--sheet);background:transparent}
.face small{font:400 .82rem var(--font-ui);color:var(--ink-2)}
.face .m{white-space:normal}
.fc-nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
footer.foot{max-width:1060px;margin:0 auto;padding:10px 18px 40px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:.9rem}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-2);text-decoration:underline;font-size:.9rem}
@media (max-width:820px){
.hero{grid-template-columns:minmax(0,1fr)}
.pg{grid-template-columns:minmax(0,1fr);grid-template-areas:"graph" "ctrl" "read"}
.sym,.design{grid-template-columns:minmax(0,1fr)}
.bins.three{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
.top-row{gap:8px}
.brand b{font-size:1.12rem}
.brand span{display:none}
.prog-bar{width:48px}
.prog-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.home-t,.fc-long{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd-btns{gap:6px}
.hd-btns .btn,.home-link{padding:.4em .6em}
.step{font-size:.9rem;padding:6px 6px 9px}
.bins{grid-template-columns:minmax(0,1fr)}
.bin{min-height:86px}
.bar-row{grid-template-columns:7rem minmax(0,1fr) 2.8rem}
.match{grid-template-columns:minmax(0,1fr)}
}
@media (min-width:561px){ .fc-short{display:none} }
@media (prefers-reduced-motion:reduce){
*{transition:none!important;animation:none!important}
}
.page-nav{position:fixed!important;top:0!important;left:0;right:0;z-index:95!important;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:7px 12px!important;background:var(--sheet)!important;border-bottom:1.5px solid var(--rule)!important;box-shadow:none!important;font-family:var(--font-ui)}
.page-nav-btn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 12px;font:700 .85rem var(--font-ui);text-decoration:none;cursor:pointer;white-space:nowrap}
.page-nav-btn:hover{border-color:var(--pen)}
@media (max-width:560px){ .page-nav{gap:4px;padding:6px 6px!important;flex-wrap:nowrap} .page-nav-btn{padding:4px 7px;font-size:.74rem} }
/* MHF4U 42: scale switcher (ls-), Part 3 graphs (ls-p3), practice mini rulers (ls-mini), task (lb-). Colour tokens only. */
.ls-hcap{min-height:1.4em}
.hero .hero-eq.md{font-size:clamp(1.9rem,5vw,3.4rem)}   /* a long equation: a little smaller than the toolkit md size (as MHF4U 37) */
.ls-uses{display:block;margin:8px 0 0}
.ls-alg .m{white-space:normal}

/* radio groups (from MHF4U 37) */
.ls-rgw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ls-rgl{font-size:.88rem;font-weight:700;color:var(--ink-2)}
.ls-rg.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.ls-rg.seg button{border:0;background:var(--sheet);color:var(--ink);padding:.4em .9em;font-size:.92rem;font-weight:700;min-height:40px}
.ls-rg.seg button + button{border-left:1.5px solid var(--ink)}
.ls-rg.seg button[aria-checked="true"]{background:var(--ink);color:var(--sheet)}
.ls-rg.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin:0}
.ls-rg.chips button{border:1.5px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:999px;padding:.28em .85em;font-size:.95rem;min-height:40px}
.ls-rg.chips button[aria-checked="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ls-rg.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--ink)}
.ls-rg.tabs button{border:1.5px solid var(--rule);border-bottom:0;background:var(--paper);color:var(--ink);padding:.45em 1.1em;font-size:1rem;font-weight:700;min-height:42px;border-radius:8px 8px 0 0;margin-right:4px}
.ls-rg.tabs button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.ls-rg button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}

/* N9 step sliders (from MHF4U 37) */
.ls-sl{margin:0 0 8px}
.ls-sl-top{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ls-sl-top label{font-weight:700;font-size:.92rem}
.ls-sl-top output{font:600 1.1rem var(--font-math);color:var(--ink)}
.ls-sl-row{display:flex;align-items:center;gap:8px}
.ls-pm{min-width:40px;min-height:40px;padding:0;font-size:1.25rem;line-height:1}
.ls-sl input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0;cursor:pointer}
.ls-sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.ls-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--ink);margin-top:-8px}
.ls-sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.ls-sl input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--ink);border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--ink)}
.ls-sl input[type=range]:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:6px}
.ls-sl input[type=range]:disabled{opacity:.45;cursor:default}

/* Explore: the scale switcher */
.ls-tabs{margin:0 0 12px}
.ls-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px 26px;align-items:start}
.ls-graph,.ls-ctrl{min-width:0}
.eq-cap.ls-cap{font-size:clamp(1.15rem,2.6vw,1.6rem)}
.ls-ruler .drag-h{width:44px;height:44px;margin:-22px 0 0 -22px}
.ls-dotb{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:0;background:transparent;padding:0;z-index:1}
.ls-dotb:focus-visible{outline:3px solid var(--pen);outline-offset:0}
.ls-axes{margin:6px 0 0}
.ls-phnote{margin:4px 0 0;color:var(--ink-2);font-style:italic;min-height:1.2em}
.ls-exchips{display:none;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.ls-exchips .chip{font-size:.85rem}
.ls-ctrl > div{margin:0 0 12px}
.ls-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ls-big{min-height:40px}
.ls-tg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ls-tog[aria-pressed="true"]{background:var(--hi);border-color:var(--hi);color:var(--hi-ink);font-weight:700}
.ls-tog:disabled,.ls-pose-b:disabled{opacity:.5}
.ls-ex[data-mode="switch"] .ls-cmp{display:none}
.ls-ex[data-mode="compare"] .ls-sw{display:none}
.ls-busy .ls-ctrl,.ls-busy .ls-tabs,.ls-busy .ls-exchips{pointer-events:none;opacity:.6}
.ls-read{margin-top:16px;border-top:1.5px solid var(--rule);padding-top:12px}
.ls-read .read{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.ls-read .read > div{padding:8px 0;border-bottom:1px solid var(--rule)}
.ls-read .read > div:first-child{padding-top:8px}
.ls-posebox{margin-top:12px;border:1.5px solid var(--hi);background:var(--hi-soft);border-radius:8px;padding:10px 14px}
.ls-poseq{margin:0 0 6px}
.ls-posebox .chips{margin:8px 0 0}
.ls-posebox .chip{min-height:40px;font:400 1.05rem var(--font-math)}

/* Part 3 */
.ls-st{margin:0 0 10px}
.ls-p3g{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px 26px;align-items:start}
.ls-p3gr,.ls-p3c{min-width:0}
.ls-p3gr > div + div,.ls-p3gr > div:first-child:not(.plot-wrap){margin-bottom:8px}
#ls-ax{margin-top:10px}
.ls-p3c > div{margin:0 0 10px}
.ls-p3c .read{margin-top:6px}
.ls-trailnote{margin:8px 0 0;font-weight:700}
#ls-ch .ls-rg.chips button{font-size:.9rem}

/* Practice 2 mini rulers */
.ls-mini{margin:12px 0 0;max-width:560px}
canvas.plot.ls-minic{aspect-ratio:auto;height:112px}
.ls-minicap{margin:6px 0 0;color:var(--ink-2)}

/* Task: Loud but safe */
.lb-in{margin:0 0 12px}
.lb-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 12px}
.lb-lab{font-weight:700;font-size:.92rem;flex:1 0 100%}
.lb-step{display:inline-flex;align-items:center;gap:10px}
.lb-step output{font:600 1.35rem var(--font-math);min-width:2ch;text-align:center}
.lb-cap{font-weight:700;border-left:4px solid var(--hi);background:var(--hi-soft);padding:8px 12px;border-radius:4px;margin:4px 0 0}
.lb-pv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lb-pv canvas.plot.lb-c{aspect-ratio:3/5}
.lb-meter{order:2}.lb-blocks{order:1}
ul.checks li.lb-bonus .mk{color:var(--ink)}
.lb-leanall{margin-top:8px}

@media (max-width:820px){
  .ls-main,.ls-p3g{grid-template-columns:minmax(0,1fr)}
  .ls-read .read{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .ls-exchips{display:flex}
  .ls-rg.tabs button{padding:.45em .8em;font-size:.95rem}
  .lb-pv{grid-template-columns:minmax(0,1fr)}
  .lb-meter{order:1}.lb-blocks{order:2}
  .lb-pv canvas.plot.lb-c{aspect-ratio:4/3}
}

</style>

","kind":"topic","group":"5"},{"nn":"32","slug":"transformations-of-sinusoidal-functions","title":"Transformations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"33","slug":"equations-of-sinusoidal-functions","title":"Equations of Sinusoidal Functions","kind":"topic","group":"5"},{"nn":"34","slug":"solving-trig-equations","title":"Solving Trig Equations","kind":"topic","group":"5"},{"nn":"35","slug":"applications-of-trig-functions","title":"Applications of Trig Functions","kind":"topic","group":"5"},{"nn":"36","slug":"chapter-5-review","title":"Chapter 5 Summary & Review","kind":"review","group":"5"},{"nn":"37","slug":"inverse-of-exponential-functions","title":"Inverse of Exponential Functions","kind":"topic","group":"6-7"},{"nn":"38","slug":"introduction-to-logarithms","title":"Introduction to Logarithms","kind":"topic","group":"6-7"},{"nn":"39","slug":"transformations-of-log-functions","title":"Transformations of Log Functions","kind":"topic","group":"6-7"},{"nn":"40","slug":"power-law-of-logarithms","title":"Power Law of Logarithms","kind":"topic","group":"6-7"},{"nn":"41","slug":"product-and-quotient-laws","title":"Product and Quotient Laws","kind":"topic","group":"6-7"},{"nn":"42","slug":"logarithmic-scales","title":"Logarithmic Scales","kind":"topic","group":"6-7"},{"nn":"43","slug":"solving-exponential-equations","title":"Solving Exponential Equations","kind":"topic","group":"6-7"},{"nn":"44","slug":"solving-logarithmic-equations","title":"Solving Logarithmic Equations","kind":"topic","group":"6-7"},{"nn":"45","slug":"chapters-6-7-review","title":"Chapters 6–7 Summary & Review","kind":"review","group":"6-7"},{"nn":"46","slug":"sums-and-differences-of-functions","title":"Sums and Differences of Functions","kind":"topic","group":"8"},{"nn":"47","slug":"products-and-quotients-of-functions","title":"Products and Quotients of Functions","kind":"topic","group":"8"},{"nn":"48","slug":"composite-functions","title":"Composite Functions","kind":"topic","group":"8"},{"nn":"49","slug":"modelling-with-combined-functions","title":"Modelling with Combined Functions","kind":"topic","group":"8"},{"nn":"50","slug":"chapter-8-review","title":"Chapter 8 Summary & Review","kind":"review","group":"8"}]},"salt":"e5261b54","content":{"id":"42-logarithmic-scales","kind":"topic","title":"Logarithmic scales","topic":"Logarithmic Scales","readyTopic":"logarithmic scales","hero":{"eq":"`log(10x) = log x + 1`","eqLabel":"log of 10 x equals log x plus 1","eqSize":"md","headline":"Multiply in the world, add on the scale","text":"Some things in nature come in sizes that differ by billions: the shaking of an earthquake, the intensity of a sound, the acidity of a liquid. A \u003cstrong>logarithmic scale\u003c/strong> records the exponent instead of the size, so each equal step on the scale means \u003cstrong>10 times\u003c/strong> as much. On the \u003cstrong>Richter scale\u003c/strong> and the \u003cstrong>pH scale\u003c/strong> that step is 1 unit (pH runs backwards: a lower pH means more); on the \u003cstrong>decibel scale\u003c/strong> it’s 10 dB. To compare two values, you don’t divide the scale numbers: you take their \u003cstrong>difference on the scale\u003c/strong> and turn it into a \u003cstrong>ratio\u003c/strong>.","fig":{"aria":"A ruler of amplitude from 0 to 10 to the 9. Ten dots for 1, 10, 100 and so on up to 10 to the 9 pile up near 0 on the linear ruler, then spread out evenly when it becomes a log ruler labelled with magnitudes 0 to 9. A marker hops from magnitude 2 to magnitude 5, times 10 each hop.","caption":"3 steps up the scale: 10 × 10 × 10 = 1000 times the amplitude."}},"goals":["I can explain why pH, decibels and the Richter scale are logarithmic: each step (1 pH unit, 1 magnitude, or 10 dB) is a factor of 10 in the quantity, so a huge range fits on a short scale.","I can use \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>, `L = 10 log(I/I_0)` and `M = log(A/A_0)` to go from a quantity to its scale value and back, such as [H⁺] = \u003cspan class=\"m\">10\u003csup>−pH\u003c/sup>\u003c/span>.","I can compare two values on a logarithmic scale by finding how many times as large one quantity is as the other, including the direction for pH and differences that aren’t whole numbers.","I can work backwards from a ratio to a change on the scale, such as doubling an intensity (+3 dB) or combining identical sources, using the laws of logarithms.","I can solve multi-step problems with logarithmic scales, including scales I haven’t seen before, and pose my own comparison questions."],"start":{"warmup":{"questions":[{"id":"w1","skill":"Powers of ten","goal":2,"prompt":"Write `10^{-4}` as a decimal.","options":[{"t":"−10 000","why":"A negative exponent means “one over”, not “negative”: `10^{-4}` = 1/10 000, a small positive number.","_n":"05bf","_k":"5b506860"},{"t":"−40","why":"That’s 10 × (−4). An exponent counts repeated multiplication: `10^{-4}` = 1/(10 × 10 × 10 × 10).","_n":"15ef","_k":"2708ac4a"},{"t":"0.000 01","why":"In 0.000 01 the 1 is in the fifth place: that’s `10^{-5}`. For `10^{-4}` the 1 sits in the fourth place, so only three zeros come before it.","_n":"25df","_k":"acd42ad0"},{"t":"0.0001","why":"`10^{-4} = 1/10^4` = 1/10 000 = 0.0001. The 1 lands in the fourth decimal place.","_n":"358f","_k":"4f55b68a"}],"hints":["A negative exponent means “one over the positive power”.","`10^{-4} = 1/10^4` = 1/10 000.","1/10 000 = 0.0001: the 1 is in the fourth decimal place."]},{"id":"w2","skill":"Powers of ten","goal":3,"prompt":"How many times as large as `10^{-5}` is `10^{-2}`?","options":[{"t":"1000","why":"Divide: `10^{-2} ÷ 10^{-5} = 10^{-2 - (-5)} = 10^3` = 1000. Check: 0.01 ÷ 0.000 01 = 1000.","_n":"457f","_k":"9df1169a"},{"t":"3","why":"3 is the difference of the exponents. The numbers themselves differ by a factor of `10^3` = 1000.","_n":"55af","_k":"ead461b2"},{"t":"`10^7`","why":"That uses 2 + 5 = 7. Dividing powers subtracts exponents: −2 − (−5) = 3, so the factor is `10^3`.","_n":"659f","_k":"e38796ed"},{"t":"1/1000","why":"That’s `10^{-5} ÷ 10^{-2}`. But `10^{-2}` = 0.01 is the bigger number, so the answer is more than 1.","_n":"754f","_k":"523f8825"}],"hints":["To compare, divide the bigger number by the smaller one.","`10^{-2} ÷ 10^{-5}`: subtract the exponents, −2 − (−5).","−2 − (−5) = 3, so `10^{-2}` is `10^3` = 1000 times as large as `10^{-5}`."]},{"id":"w3","skill":"Common logarithms","goal":2,"prompt":"Evaluate `log 0.001`.","options":[{"t":"−2","why":"0.001 has two zeros after the point, but its 1 is in the third place: 0.001 = `10^{-3}`.","_n":"853f","_k":"f8cc4df5"},{"t":"3","why":"`log 1000 = 3`. 0.001 is one over 1000, so its log is −3.","_n":"9f6b","_k":"b197a834"},{"t":"−3","why":"0.001 = `10^{-3}`, and log asks “what power of 10?”, so `log 0.001 = -3`.","_n":"af7b","_k":"a6f9242e"},{"t":"It isn’t defined, because 0.001 is less than 1.","why":"Logs are undefined only for 0 and negative numbers. Every number between 0 and 1 has a negative log: `log 0.001 = -3`.","_n":"bf8b","_k":"5d7340a1"}],"hints":["Write 0.001 as a power of 10.","0.001 = 1/1000 = `10^{-3}`.","`log(10^{-3}) = -3`."]},{"id":"w4","skill":"Common logarithms","goal":3,"prompt":"Which is closest to `10^{2.5}`?","use":"`√10 ≈ 3.16`","options":[{"t":"25","why":"That’s 10 × 2.5. `10^{2.5}` is a power: `10^2 × 10^{0.5}`.","_n":"cf9b","_k":"0d10d20d"},{"t":"316","why":"`10^{2.5} = 10^2 × 10^{0.5} = 100 × √10 ≈ 100 × 3.16` = 316.","_n":"df2b","_k":"00917aba"},{"t":"500","why":"`10^{0.5}` is the square root of 10, about 3.16, not 5. Check: 5 × 5 = 25, not 10.","_n":"ef3b","_k":"c68f1769"},{"t":"550","why":"550 is halfway between 100 and 1000. But `10^{2.5}` is halfway in the \u003cstrong>exponent\u003c/strong>, and that’s much closer to 100: 100 × 3.16 ≈ 316.","_n":"ff4b","_k":"5c4c2829"}],"hints":["Split the exponent: `10^{2.5} = 10^2 × 10^{0.5}`.","`10^{0.5}` means `√10 ≈ 3.16`.","100 × 3.16 = 316."]},{"id":"w5","skill":"Laws of logarithms","goal":4,"prompt":"Simplify `log 5000 - log 5`.","options":[{"t":"1000","why":"5000 ÷ 5 = 1000 is right so far, but the answer is `log 1000 = 3`.","_n":"gf5b","_k":"b3779d8d"},{"t":"3","why":"Quotient law: `log 5000 - log 5 = log(5000/5) = log 1000 = 3`.","_n":"hfeb","_k":"139ec1fd"},{"t":"`(log 5000)/(log 5)`","why":"`(log 5000)/(log 5)` is `log_5 5000` by change of base, about 5.29. Subtracting logs divides the numbers \u003cstrong>inside\u003c/strong>: `log(5000/5)`.","_n":"iffb","_k":"0f89dc34"},{"t":"`log 4995`","why":"`log x - log y` is `log(x/y)`, not `log(x - y)`. Subtracting logs divides the numbers.","_n":"j88b","_k":"74f6bc37"}],"hints":["Which law turns a difference of logs into one log?","`log x - log y = log(x/y)`.","`log(5000/5) = log 1000 = 3`."]},{"id":"w6","skill":"Laws of logarithms","goal":4,"prompt":"Which is closest to `log 200`?","use":"`log 2 ≈ 0.301`","options":[{"t":"0.602","why":"The log of a product is the \u003cstrong>sum\u003c/strong> of the logs: `log 2 + log 100`, not `log 2 × log 100`.","_n":"k87b","_k":"91b1f0e1"},{"t":"2.301","why":"`log 200 = log(2 × 100) = log 2 + log 100 ≈ 0.301 + 2` = 2.301.","_n":"l8ab","_k":"9dd787b7"},{"t":"3.301","why":"100 = `10^2`, so `log 100 = 2`, not 3. Check: `log 200` must be between `log 100 = 2` and `log 1000 = 3`.","_n":"m89b","_k":"5326f8a9"},{"t":"30.1","why":"`100 log 2` would be `log(2^{100})`. 200 is 2 × 100, a product, so its log is a sum.","_n":"n84b","_k":"9960111f"}],"hints":["Write 200 as 2 × 100.","Product law: `log(2 × 100) = log 2 + log 100`.","0.301 + 2 = 2.301."]}],"refreshers":{"Powers of ten":"`10^n` with a positive `n` is 1 followed by `n` zeros: `10^3` = 1000. A negative exponent means “one over”: `10^{-4}` = 1/10 000 = 0.0001 (the 1 is in the fourth decimal place). To compare two powers of 10, divide them by subtracting the exponents: `10^{-2} ÷ 10^{-5} = 10^3`, so `10^{-2}` is 1000 times as large as `10^{-5}`.","Common logarithms":"`log x` (base 10) is the power of 10 that gives `x`: `log 1000 = 3`, `log 1 = 0`, `log 0.001 = -3`. Logs of numbers between 0 and 1 are negative; logs of 0 and of negative numbers don’t exist. A decimal exponent is still a power: `10^{2.5} = 10^2 × 10^{0.5} = 100√10 ≈ 316`.","Laws of logarithms":"Product law: `log(xy) = log x + log y`, so `log 200 = log 2 + log 100 ≈ 2.301`. Quotient law: `log(x/y) = log x - log y`, so `log 5000 - log 5 = log 1000 = 3`. Power law: `log(x^n) = n log x`, so `log(10^k) = k`."}}},"explore":{"heading":"The scale switcher","intro":"Pick a scale. Switch the ruler between linear and logarithmic and watch the everyday examples move. Then compare any two values: the switcher turns the difference on the scale into how many times as much.","predictions":[{"id":"p1","prompt":"The ruler is about to switch to a \u003cstrong>linear\u003c/strong> ruler of amplitude, from 0 to `10^9 A_0` (the amplitude of a magnitude 9 quake). Where will the magnitude 6 dot end up?","options":[{"t":"About two-thirds of the way along","_n":"o83b","_k":"c7476e71"},{"t":"Within the first 1% of the ruler, almost on top of 0","_n":"p86b","_k":"f0d350c0"},{"t":"About 10% of the way along","_n":"q85b","_k":"4b381d39"},{"t":"About 1/30 of the way along","_n":"r80b","_k":"278e8ef7"}],"explain":"`10^6 ÷ 10^9` = 1/1000, so the magnitude 6 quake sits 0.1% of the way along. Two-thirds (6 out of 9) would be right only if the scale were linear. 10% is where magnitude \u003cstrong>8\u003c/strong> lands (`10^8 ÷ 10^9`); magnitude 6 is two more steps down. And 1/30 would mean three steps are “divide by 30”, but three steps down are 10 × 10 × 10 = 1000 times smaller."},{"id":"p2","prompt":"Lemon juice is about pH 2 and black coffee about pH 5. How do their hydrogen ion concentrations compare?","options":[{"t":"Lemon juice has 1000 times the [H⁺] of coffee","_n":"s7fb","_k":"31488842"},{"t":"Lemon juice has 30 times the [H⁺] of coffee","_n":"t02b","_k":"0281cffb"},{"t":"Coffee has 1000 times the [H⁺] of lemon juice","_n":"u03b","_k":"05152403"},{"t":"Coffee has 2.5 times the [H⁺] of lemon juice","_n":"v00b","_k":"8c7eef6b"}],"explain":"The pH values differ by 3, so the concentrations differ by `10^3` = 1000. Because \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>, the \u003cstrong>lower\u003c/strong> pH has more hydrogen ions: lemon juice, the more acidic liquid. 30 would be 10 × 3, and 2.5 is 5 ÷ 2, which treats the pH numbers as if they were the concentrations."},{"id":"p3","prompt":"One machine makes 80 dB at your ear. An identical second machine is switched on beside it, so the sound intensity doubles. What will the sound level be?","options":[{"t":"160 dB","_n":"w01b","_k":"0f130cf3"},{"t":"About 80.3 dB","_n":"x06b","_k":"70b01b73"},{"t":"About 83 dB","_n":"y07b","_k":"ed0ddc88"},{"t":"90 dB","_n":"z04b","_k":"1cfe1a23"}],"explain":"Intensities add, so two machines make twice the intensity. The level goes up by `10 log 2 ≈ 10 × 0.301 ≈ 3` dB, to about 83 dB. Adding the levels (160 dB) treats decibels like intensities. 90 dB would need 10 machines. 80.3 dB forgets the 10 in `L = 10 log(I/I_0)`."},{"id":"p4","prompt":"`Q` is about to slide below 0 dB, to −10 dB. What does a level of −10 dB mean?","options":[{"t":"No sound at all: an intensity of 0","_n":"1005b","_k":"c5fd66e5"},{"t":"An intensity of `10^{-11}` W/m², ten times `I_0`","_n":"11fab","_k":"5e9a3f22"},{"t":"An intensity of `10^{-13}` W/m², one-tenth of `I_0`","_n":"12fbb","_k":"0d725551"},{"t":"A negative intensity, less than no sound at all","_n":"1384a","_k":"27eda21a"}],"explain":"0 dB is the reference intensity `I_0 = 10^{-12}` W/m², a very faint sound, not silence. −10 dB is one step of ×10 \u003cstrong>below\u003c/strong> it: `10 log(I/I_0) = -10` gives `I/I_0 = 10^{-1}`, so `I = 10^{-13}` W/m². Intensity is never negative, and silence (`I = 0`) has no decibel level at all, because `log 0` doesn’t exist. Earthquakes work the same way: the Earthquakes ruler goes down to magnitude −1.0, an amplitude of `0.1A_0`."}],"chalIntro":"Set the switcher, then press \u003cstrong>Check challenge\u003c/strong>. Each challenge has three levels of help.","challenges":[{"id":"tc1","goal":[3,4],"prompt":"Compare mode, Earthquakes. Set `P` to magnitude 4.0. Then set `Q` so that `Q`’s amplitude is 1000 times `P`’s.","why":"1000 = `10^3`, so `Q` is 3 steps above `P`: 4.0 + 3 = 7.0.","hints":["Each step of 1 in magnitude multiplies the amplitude by 10. How many tens make 1000?","1000 = `10^3`, so `Q` must be 3 steps above `P`.","4.0 + 3 = 7.0."]},{"id":"tc2","goal":[3,4],"prompt":"Compare mode, Sound. Set `P` to 40 dB. Then set `Q` so that `Q`’s intensity is about \u003cstrong>twice\u003c/strong> `P`’s (the Ratio row should read about 2). Work out the level first, then set it.\u003cp class=\"uses\">\u003cstrong>Use these values\u003c/strong>`log 2 ≈ 0.301`\u003c/p>","why":"Doubling adds `10 log 2 ≈ 3` dB: 43 dB is `10^{0.3} ≈ 2.00` times as intense as 40 dB.","hints":["On the decibel scale, a ratio `r` changes the level by `10 log r`.","`log 2 ≈ 0.301`, so ×2 adds 10 × 0.301 ≈ 3 dB.","40 + 3 = 43 dB."]},{"id":"tc3","goal":[3,4],"stretch":true,"prompt":"Commit first. Compare mode, pH. A solution has 500 times the [H⁺] of pure water. Set `P` to pure water (pH 7.0) and `Q` to the solution. While this challenge is open, the `Q` row, the Ratio rows, the hops and the bars are hidden; they appear when you check.\u003cp class=\"uses\">\u003cstrong>Use these values\u003c/strong>`log 5 ≈ 0.699`\u003c/p>","why":"7 − log 500 = 7 − 2.699 = 4.301. At pH 4.3 the ratio is `10^{2.7} ≈ 501`, the closest position to 500.","hints":["500 = 5 × 100. What is `log 500`?","`log 500 = log 5 + log 100 ≈ 0.699 + 2` = 2.699. More hydrogen ions means a lower pH.","7 − 2.699 = 4.301, so set `Q` to 4.3."]}],"blocks":[{"title":"What the switcher shows","html":"\u003cp>\u003cstrong>Comparing on a logarithmic scale\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>pH and the Richter scale:\u003c/strong> each step of 1 is ×10, so ratio = \u003cspan class=\"m\">10\u003csup>difference\u003c/sup>\u003c/span>.\u003c/li>\u003cli>\u003cstrong>Decibels:\u003c/strong> each step of 10 dB is ×10, so ratio = \u003cspan class=\"m\">10\u003csup>difference ÷ 10\u003c/sup>\u003c/span>.\u003c/li>\u003cli>\u003cstrong>Steps multiply:\u003c/strong> 3 steps is 10 × 10 × 10 = 1000, not 30. Half a step is ×`√10 ≈ 3.16`, not ×5.\u003c/li>\u003cli>\u003cstrong>pH runs backwards:\u003c/strong> the lower pH has the bigger [H⁺].\u003c/li>\u003cli>\u003cstrong>0 is the reference,\u003c/strong> not “nothing”: 0 dB means `I = I_0`.\u003c/li>\u003c/ul>"}]},"part3":{"slug":"ratios","name":"Ratios","heading":"Same ratio, same rise","intro":"Put two points on the graph of `y = log x`, one `r` times as far along as the other. Slide the pair and watch the rise. Then see why every log scale compares by ratios.","trailNote":"The run grew 100 times. The rise didn’t change: it depends only on the ratio.","puzzles":[{"id":"r1","goal":[3,4],"prompt":"Make a pair whose rise is exactly 1.","hints":["The rise is `log r`. Which ratio has a log of exactly 1?","`log 10 = 1`.","Choose ×10. Any position of `U` works."]},{"id":"r2","goal":[3,4],"prompt":"Make a pair whose rise is about 0.477 and whose run is exactly 60.","hints":["Which ratio gives a rise of `log 3 ≈ 0.477`?","×3. Then the run is `3u - u = 2u`.","`2u = 60`, so `u = 30`."]},{"id":"r3","goal":[3,4],"prompt":"The pair from `x = 50` to `x = 250` has a certain rise. Make a pair that starts at `U = (4, log 4)` with the same rise.","hints":["The rise depends only on the ratio.","250 ÷ 50 = 5.","Choose ×5 with `U` at 4: `V = (20, log 20)`. Both pairs rise by `log 5 ≈ 0.699`."]}],"blocks":[{"title":"","html":"\u003cdetails class=\"alg ls-alg\">\u003csummary>Check it with algebra\u003c/summary>\u003cp style=\"margin:10px 0 6px\">\u003cstrong>Why a difference on the scale is a ratio in the world\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Earthquakes:\u003c/strong> `M_2 - M_1 = log(A_2/A_0) - log(A_1/A_0)` `= (log A_2 - log A_0) - (log A_1 - log A_0)` `= log A_2 - log A_1 = log(A_2/A_1)`. So `A_2/A_1 = 10^{M_2 - M_1}`.\u003c/li>\u003cli>\u003cstrong>Sound:\u003c/strong> `L_2 - L_1 = 10 log(I_2/I_0) - 10 log(I_1/I_0)` `= 10 log(I_2/I_1)`. So `I_2/I_1 = 10^{(L_2 - L_1) ÷ 10}`.\u003c/li>\u003cli>\u003cstrong>Acidity:\u003c/strong> \u003cspan class=\"m\">pH\u003csub>2\u003c/sub> − pH\u003csub>1\u003c/sub> = −log[H⁺]\u003csub>2\u003c/sub> + log[H⁺]\u003csub>1\u003c/sub>\u003c/span> \u003cspan class=\"m\">= log([H⁺]\u003csub>1\u003c/sub>/[H⁺]\u003csub>2\u003c/sub>)\u003c/span>. So \u003cspan class=\"m\">[H⁺]\u003csub>1\u003c/sub>/[H⁺]\u003csub>2\u003c/sub> = 10\u003csup>pH\u003csub>2\u003c/sub> − pH\u003csub>1\u003c/sub>\u003c/sup>\u003c/span>: the solution with the lower pH has the larger concentration.\u003c/li>\u003cli>\u003cstrong>The reference cancels.\u003c/strong> `A_0` and `I_0` disappear, which is why you can compare two earthquakes without knowing `A_0`.\u003c/li>\u003cli>\u003cstrong>Working backwards:\u003c/strong> a ratio `r` changes the scale by `log r` (magnitude, pH) or `10 log r` (decibels). Doubling: `log 2 ≈ 0.301`, or `10 log 2 ≈ 3.01` dB.\u003c/li>\u003c/ul>\u003c/details>"}],"quickCheck":{"title":"Quick check: “Same ratio, same rise”","summary":"Same ratio, same rise quick check","items":[{"id":"q1","goal":3,"prompt":"On the graph of `y = log x`, `U` is at `x = 20` and `V` is at `x = 60`. What is the rise from `U` to `V`?\u003cp class=\"uses\">\u003cstrong>Use these values\u003c/strong>`log 3 ≈ 0.477`\u003c/p>","choices":[{"t":"40","fb":"40 is the run, across. The rise is up: `log 3`.","_n":"1483a","_k":"8acdc4a2"},{"t":"About 1.602","fb":"That’s `log 40`, the log of the run. The rise is the log of the \u003cstrong>ratio\u003c/strong>: `log 3`.","_n":"1582a","_k":"90169aea"},{"t":"3","fb":"3 is the ratio. The rise is its log.","_n":"1681a","_k":"491507f2"},{"t":"About 0.477","fb":"Right. 60 ÷ 20 = 3, so the rise is `log 60 - log 20 = log 3 ≈ 0.477`.","_n":"1788a","_k":"35eefe35"}]},{"id":"q2","goal":4,"prompt":"Two sounds’ intensities differ by a factor of 100. How far apart are their levels?","choices":[{"t":"10 dB","fb":"10 dB is a factor of 10. A factor of 100 is two steps.","_n":"1887a","_k":"5756238a"},{"t":"2 dB","fb":"`log 100 = 2`, but decibels multiply the log by 10.","_n":"1986a","_k":"34c29d22"},{"t":"100 dB","fb":"The level difference is 10 log(ratio), not the ratio itself.","_n":"1a85a","_k":"3ca1e7d1"},{"t":"20 dB","fb":"Right. `10 log 100` = 10 × 2 = 20 dB.","_n":"1b7ca","_k":"8d9e2eee"}]},{"id":"q3","goal":3,"prompt":"Solution X has 10 times the [H⁺] of solution Y. Compared with Y’s pH, X’s pH is …","choices":[{"t":"1 lower","fb":"Right. \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>, so 10 times the [H⁺] lowers the pH by 1.","_n":"1c7ba","_k":"87e35196"},{"t":"10 lower","fb":"A factor of 10 is one step on the pH scale, not 10 steps.","_n":"1d7ea","_k":"aa5c2b3d"},{"t":"10 times as large","fb":"pH values differ by the log of the ratio; they aren’t multiplied by it.","_n":"1e7fa","_k":"10d3b69b"},{"t":"1 higher","fb":"More hydrogen ions means more acidic, and that’s a \u003cstrong>lower\u003c/strong> pH.","_n":"1f80a","_k":"230f660f"}]},{"id":"q4","goal":4,"prompt":"A pair on `y = log x` has a rise of about 0.699. `U` is at `x = 40`. Where is `V`?\u003cp class=\"uses\">\u003cstrong>Use these values\u003c/strong>`log 5 ≈ 0.699`\u003c/p>","choices":[{"t":"`x = 200`","fb":"Right. A rise of `log 5` means a ratio of 5: 40 × 5 = 200.","_n":"1g81a","_k":"f34c3e14"},{"t":"`x = 8`","fb":"That divides by 5. The rise is positive, so `V` is to the right: 40 × 5.","_n":"1h82a","_k":"8df5cfa3"},{"t":"`x ≈ 40.7`","fb":"That adds the rise to `x`. A rise of `log 5` means `V` is 5 times as far along.","_n":"1i83a","_k":"5f05939b"},{"t":"`x = 45`","fb":"That adds 5. A rise of `log 5` means multiplying by 5.","_n":"1j84a","_k":"fe0838c7"}]}]}},"practice":{"activities":[{"id":"times","type":"sorter","title":"How many times?","summary":"How many times?","noun":"card","goal":[3,1],"txt":true,"instruction":"Each card names two values on the same scale. Sort it by how many times as large the bigger quantity is.","how":"Tap a card, then tap the box it belongs in.\u003cspan class=\"uses ls-uses\">\u003cstrong>Use these values\u003c/strong>`log 2 ≈ 0.301`\u003c/span>","boxes":[{"id":"b10","label":"×10"},{"id":"b100","label":"×100"},{"id":"b1000","label":"×1000"},{"id":"b2","label":"about ×2"}],"items":[{"id":"i1","t":"Magnitude 8.0 vs magnitude 7.0 (amplitude)","_a":"R1cDBhM=","why":"A difference of 1 is one step: ×10.","wrong":{"b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference in magnitude.","8.0 − 7.0 = 1, which is 1 step of ×10.","`10^1 = 10`, so it goes in ×10."]},{"id":"i2","t":"75 dB vs 65 dB (intensity)","_a":"R1cDBhM=","why":"10 dB is one step on the decibel scale: ×10.","wrong":{"b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again. Then divide by 10, because it’s decibels.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again. Then divide by 10, because it’s decibels.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference on the scale, then divide by 10, because it’s decibels.","75 − 65 = 10 dB, which is 1 step of ×10.","`10^1 = 10`, so it goes in ×10."]},{"id":"i3","t":"pH 9.0 vs pH 10.0 ([H⁺])","_a":"R1cDBhM=","why":"1 pH unit is one step. pH 9.0 has 10 times the [H⁺] of pH 10.0.","wrong":{"b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference in pH.","10.0 − 9.0 = 1, which is 1 step of ×10.","`10^1 = 10`, so it goes in ×10."]},{"id":"i4","t":"Magnitude 6.5 vs magnitude 4.5","_a":"R1cDBgFA","why":"A difference of 2: `10^2` = 100.","wrong":{"b10":"That box needs a difference of 1 (or 10 dB on the decibel scale). Find this pair’s difference again.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference in magnitude.","6.5 − 4.5 = 2, which is 2 steps of ×10.","`10^2 = 100`, so it goes in ×100."]},{"id":"i5","t":"90 dB vs 70 dB","_a":"R1cDBgFA","why":"20 dB is two steps of 10 dB: `10^2` = 100.","wrong":{"b10":"That box needs a difference of 1 (or 10 dB on the decibel scale). Find this pair’s difference again. Then divide by 10, because it’s decibels.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again. Then divide by 10, because it’s decibels.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference on the scale, then divide by 10, because it’s decibels.","90 − 70 = 20 dB, which is 2 steps of ×10.","`10^2 = 100`, so it goes in ×100."]},{"id":"i6","t":"pH 2.0 vs pH 4.0","_a":"R1cDBgFA","why":"A difference of 2 pH units: `10^2` = 100. pH 2.0 has the larger [H⁺].","wrong":{"b10":"That box needs a difference of 1 (or 10 dB on the decibel scale). Find this pair’s difference again.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference in pH.","4.0 − 2.0 = 2, which is 2 steps of ×10.","`10^2 = 100`, so it goes in ×100."]},{"id":"i7","t":"Magnitude 7.2 vs magnitude 4.2","_a":"R1cDBgFSFw==","why":"A difference of 3: `10^3` = 1000. The decimals don’t matter; only the difference does.","wrong":{"b10":"That box needs a difference of 1 (or 10 dB on the decibel scale). Find this pair’s difference again.","b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference in magnitude.","7.2 − 4.2 = 3, which is 3 steps of ×10.","`10^3 = 1000`, so it goes in ×1000."]},{"id":"i8","t":"100 dB vs 70 dB","_a":"R1cDBgFSFw==","why":"30 dB is three steps: `10^3` = 1000.","wrong":{"b10":"That box needs a difference of 1 (or 10 dB on the decibel scale). Find this pair’s difference again. Then divide by 10, because it’s decibels.","b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again. Then divide by 10, because it’s decibels.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference on the scale, then divide by 10, because it’s decibels.","100 − 70 = 30 dB, which is 3 steps of ×10.","`10^3 = 1000`, so it goes in ×1000."]},{"id":"i9","t":"pH 3.5 vs pH 6.5","_a":"R1cDBgFSFw==","why":"A difference of 3: `10^3` = 1000.","wrong":{"b10":"That box needs a difference of 1 (or 10 dB on the decibel scale). Find this pair’s difference again.","b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again.","b2":"This pair is a whole number of steps apart, so the factor is a whole power of 10, not about 2."},"hints":["Find the difference in pH.","6.5 − 3.5 = 3, which is 3 steps of ×10.","`10^3 = 1000`, so it goes in ×1000."]},{"id":"i10","t":"63 dB vs 60 dB","_a":"R1cAFA==","why":"3 dB is 0.3 of a step: `10^{0.3} ≈ 2`, because `log 2 ≈ 0.301`.","wrong":{"b10":"0.3 is less than one whole step, so the factor is less than 10. Use `log 2 ≈ 0.301`.","b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again. Then divide by 10, because it’s decibels.","b1000":"3 dB isn’t 3 steps. On the decibel scale one step of ×10 is 10 dB. What fraction of a step is 3 dB?"},"hints":["Find the difference on the scale, then divide by 10, because it’s decibels.","63 − 60 = 3 dB, which is 0.3 of a step of ×10.","`10^{0.3} ≈ 2` (because `log 2 ≈ 0.301`), so it goes in “about ×2”."]},{"id":"i11","t":"Magnitude 5.3 vs magnitude 5.0","_a":"R1cAFA==","why":"A difference of 0.3: `10^{0.3} ≈ 2`.","wrong":{"b10":"0.3 is less than one whole step, so the factor is less than 10. Use `log 2 ≈ 0.301`.","b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again."},"hints":["Find the difference in magnitude.","5.3 − 5.0 = 0.3, which is less than one step.","`10^{0.3} ≈ 2` (because `log 2 ≈ 0.301`), so it goes in “about ×2”."]},{"id":"i12","t":"pH 4.7 vs pH 5.0","_a":"R1cAFA==","why":"A difference of 0.3: pH 4.7 has about twice the [H⁺] of pH 5.0.","wrong":{"b10":"0.3 is less than one whole step, so the factor is less than 10. Use `log 2 ≈ 0.301`.","b100":"That box needs a difference of 2 (or 20 dB on the decibel scale). Find this pair’s difference again.","b1000":"That box needs a difference of 3 (or 30 dB on the decibel scale). Find this pair’s difference again."},"hints":["Find the difference in pH.","5.0 − 4.7 = 0.3, which is less than one step.","`10^{0.3} ≈ 2` (because `log 2 ≈ 0.301`), so it goes in “about ×2”. pH 4.7 has about twice the [H⁺]."]}]},{"id":"fbc","type":"custom","title":"Forwards, backwards, combined","summary":"Forwards, backwards, combined","star":true,"goal":[2,3,4,5],"instruction":"Find each value. Type a number, then press Check. Each question gives any values you need.","how":"Round as the question asks. After each check, the mini ruler shows your two values and the hops between them.","fallback":"Not this one. Find the difference on the scale or the ratio first, then convert, and check your answer by working it the other way.","items":[{"id":"n1","goal":2,"prompt":"Find the pH of a solution with [H⁺] = 0.000 01 mol/L.","_a":"HhdEFAtXGRYJWhAMBE4XXAwXCANM","display":"pH 5","label":"pH =","ruler":{"sc":"ph","a":0,"b":"ans","aLab":"1 mol/L"},"wrong":[{"match":-5,"fb":"That’s log[H⁺], not the pH. Look at the sign in \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>."},{"match":4,"fb":"Count decimal places, not zeros: which decimal place is the 1 in?"},{"match":100000,"fb":"100 000 is 1/[H⁺]. The pH is a logarithm: take the log of that."}],"why":"0.000 01 = `10^{-5}`, so pH = −(−5) = 5.","hints":["Write 0.000 01 as a power of 10.","0.000 01 = `10^{-5}`, so log[H⁺] = −5.","pH = −log[H⁺] = −(−5) = 5."]},{"id":"n2","goal":4,"prompt":"A sound is 1000 times as intense as a 45 dB sound. Find its level, in decibels.","_a":"HhdEFAtVABhHWV0UC1UAGEddWxQLVQBJ","display":"75 dB","unit":"dB","ruler":{"sc":"snd","a":45,"b":"ans"},"wrong":[{"match":48,"fb":"×1000 is 3 steps of ×10, and each step is 10 dB, not 1 dB."},{"match":135,"fb":"That triples the level. The intensity is multiplied, but the level goes up by a fixed number of decibels: how many for ×1000?"},{"match":45000,"fb":"That multiplies the level by 1000. The intensity is multiplied; the level goes up by `10 log 1000`."}],"why":"×1000 is 3 steps of ×10, and each step is 10 dB: 45 + 30 = 75 dB.","hints":["How many steps of ×10 make ×1000?","×1000 = `10^3`: 3 steps, and each step is 10 dB, so the level rises by `10 log 1000` = 30 dB.","45 + 30 = 75 dB."]},{"id":"n3","goal":3,"prompt":"Two earthquakes have magnitudes 6.2 and 4.7. How many times the amplitude of the smaller one is the amplitude of the larger one? Give 3 significant figures.","use":"`√10 ≈ 3.16`","_a":"HhdEFAtRBBpTGRBaXkAPB1QbBwMdQF1dRw8BBx9UAEk=","display":"about 31.6 times","label":"Times as large:","ruler":{"sc":"eq","a":4.7,"b":"logans","target":6.2},"wrong":[{"match":15,"fb":"That’s 10 × 1.5. A difference of 1.5 means `10^{1.5}`: one whole step and a half step."},{"match":50,"fb":"That uses `10^{0.5}` = 5. Half a step is `√10 ≈ 3.16`."},{"match":1.32,"fb":"That divides the magnitudes. Magnitudes are exponents: subtract them."},{"match":3.16,"fb":"That’s only the half step. A difference of 1.5 also includes one whole step of ×10."}],"why":"6.2 − 4.7 = 1.5, and `10^{1.5} = 10 × 10^{0.5} ≈ 10 × 3.16` = 31.6.","hints":["Subtract the magnitudes.","6.2 − 4.7 = 1.5 steps, so the ratio is `10^{1.5} = 10^1 × 10^{0.5}`.","`10 × √10 ≈ 10 × 3.16` = 31.6."]},{"id":"n4","goal":4,"prompt":"Three identical machines each make 70 dB at your ear. Find the level when all three run together, to 1 decimal place.","use":"`log 3 ≈ 0.477`","_a":"HhdEFAtVARpdGRBaXkAPA1EbBQMdQF1dRw8FAh9aAEk=","display":"about 74.8 dB","unit":"dB","ruler":{"sc":"snd","a":70,"b":"ans"},"wrong":[{"match":210,"fb":"Levels don’t add; intensities do. Three machines make 3 times the intensity."},{"match":70.5,"fb":"70 + `log 3` forgets the 10 in `L = 10 log(I/I_0)`: tripling the intensity raises the level by `10 log 3`, not `log 3`."},{"match":100,"fb":"Three machines make 3 times the intensity, not 1000 times."},{"match":74.7,"fb":"Close. Check your rounding to 1 decimal place."}],"why":"Tripling the intensity adds `10 log 3 ≈ 4.77` dB: 70 + 4.77 ≈ 74.8 dB.","hints":["Intensities add. Three machines make 3 times the intensity of one.","Tripling the intensity adds `10 log 3` decibels.","`10 log 3 ≈ 10 × 0.477` = 4.77, so 70 + 4.77 ≈ 74.8 dB."]},{"id":"n5","goal":4,"prompt":"An earthquake’s amplitude is 20 times that of a magnitude 4.6 quake. Find its magnitude, to 1 decimal place.","use":"`log 2 ≈ 0.301`","_a":"HhdEFAtXGw1JF15ZE1gAGlwZEF5YQA8BSwxP","display":"magnitude 5.9","label":"Magnitude:","ruler":{"sc":"eq","a":4.6,"b":"ans"},"wrong":[{"match":24.6,"fb":"That adds the ratio. The magnitude changes by the \u003cstrong>log\u003c/strong> of the ratio."},{"match":4.9,"fb":"`log 2 ≈ 0.301` is the change for ×2. ×20 is ×2 and ×10."},{"match":6.6,"fb":"×20 isn’t two steps: two steps would be ×100. ×20 is between ×10 and ×100, so the change is between 1 and 2."},{"match":3.3,"fb":"A bigger amplitude means a bigger magnitude: add, don’t subtract."}],"why":"×20 changes the magnitude by `log 20 = log 2 + 1 ≈ 1.301`: 4.6 + 1.301 ≈ 5.9.","hints":["The magnitude changes by the log of the ratio.","`log 20 = log 2 + log 10 ≈ 0.301 + 1` = 1.301.","4.6 + 1.301 = 5.901 ≈ 5.9."]},{"id":"n6","goal":4,"prompt":"A swimming pool should be at pH 7.5. A test shows that its [H⁺] is twice the target value. Find the pool’s pH, to 1 decimal place.","use":"`log 2 ≈ 0.301`","_a":"HhdEFAtVGwZJF15ZE1gCGlcZEF5YQA8DSwdP","display":"pH 7.2","label":"pH =","ruler":{"sc":"ph","a":7.5,"b":"ans"},"wrong":[{"match":7.8,"fb":"More hydrogen ions means a \u003cstrong>lower\u003c/strong> pH. Check the direction."},{"match":5.5,"fb":"That subtracts the ratio 2 itself. The pH changes by the \u003cstrong>log\u003c/strong> of the ratio."},{"match":3.75,"fb":"That halves the pH. Doubling [H⁺] changes the pH by `log 2`; it doesn’t divide it."}],"why":"Twice the [H⁺] lowers the pH by `log 2 ≈ 0.301`: 7.5 − 0.301 = 7.199 ≈ 7.2.","hints":["Twice the [H⁺] means the pool is more acidic, so its pH is lower than 7.5.","×2 changes the pH by `log 2 ≈ 0.301`.","7.5 − 0.301 = 7.199 ≈ 7.2."]},{"id":"n7","goal":5,"prompt":"A chainsaw makes 115 dB at the operator’s ear. Earmuffs cut the intensity to 1/200 of what it would be without them. What level reaches the ear, to the nearest decibel?","use":"`log 2 ≈ 0.301`","_a":"HhdEFAtbBxhHWV0UC1sHGEddWxQLWwdJ","display":"about 92 dB","unit":"dB","ruler":{"sc":"snd","a":115,"b":"ans"},"wrong":[{"match":112,"fb":"That’s 115 − `10 log 2`: ÷2. The muffs divide by 200 = 2 × 100."},{"match":95,"fb":"That’s ÷100 only. 200 = 2 × 100, so the ÷2 is still missing."},{"match":113,"fb":"115 − `log 200` ≈ 112.7 forgets the 10 in the decibel formula."},{"match":1,"fb":"That divides the level by 200. The muffs divide the \u003cstrong>intensity\u003c/strong>; the level drops by `10 log 200`."}],"why":"÷200 lowers the level by `10 log 200 = 10(log 2 + 2) ≈ 23.01` dB: 115 − 23.01 ≈ 92 dB.","hints":["Dividing the intensity by 200 lowers the level by `10 log 200`.","`log 200 = log 2 + log 100 ≈ 2.301`, so the level drops by about 23.01 dB.","115 − 23.01 = 91.99 ≈ 92 dB."]},{"id":"n8","goal":5,"prompt":"A 70 dB sound and a 60 dB sound play at the same time. Find the combined level, to 1 decimal place.","use":"`log 11 ≈ 1.041`","_a":"HhdEFAtVBRpRGRBaXkAPA1UbBhoTClwWXwICGAUf","display":"about 70.4 dB","unit":"dB","ruler":{"sc":"snd","a":70,"b":"ans"},"wrong":[{"match":130,"fb":"Levels don’t add; intensities do: `10^{-5} + 10^{-6}` W/m²."},{"match":65,"fb":"Averaging the levels doesn’t work. Add the intensities, then take 10 log."},{"match":73,"fb":"That treats the sounds as equal: two 70 dB sounds would make about 73 dB. The 60 dB sound is only 1/10 as intense."},{"match":80,"fb":"To rise a full 10 dB, the second sound would need 9 times the first one’s intensity."}],"why":"The intensities are `10^{-5}` and `10^{-6}` W/m², so the total is `1.1 × 10^{-5} = 11 × 10^{-6}` W/m². `L = 10 log(11 × 10^6) = 10(1.041 + 6) ≈ 70.4` dB. Adding a sound one-tenth as intense barely moves the level.","hints":["Levels don’t add. Find each sound’s intensity first.","70 dB is `10^{-5}` W/m² and 60 dB is `10^{-6}` W/m², so the total is `11 × 10^{-6}` W/m², which is `11 × 10^6` times `I_0`.","`L = 10 log(11 × 10^6) = 10(1.041 + 6)` = 70.41 ≈ 70.4 dB."]},{"id":"n9","goal":5,"prompt":"One machine makes 80 dB. What is the smallest number of these machines that, running together, make at least 95 dB?","use":"`√10 ≈ 3.16`","_a":"HhdEFAtRBxhHWV0UC1EHGEddWxQLUQdJ","display":"32 machines","label":"Machines:","ruler":{"sc":"snd","a":80,"b":"tenlogans","target":95},"wrong":[{"match":31,"fb":"31 machines give about 94.9 dB, just short of 95. Check which way you rounded."},{"match":15,"fb":"That’s 10 × 1.5. 1.5 steps multiply the intensity by `10^{1.5}`, not by 15."},{"match":3,"fb":"If each doubling added 10 dB, 15 dB would take about 2.8 machines. A doubling adds only about 3 dB."},{"match":16,"fb":"16 machines give `80 + 10 log 16 ≈ 92` dB."}],"why":"95 − 80 = 15 dB is 1.5 steps, so you need `N` × (one machine’s intensity) with `N ≥ 10^{1.5} = 10√10 ≈ 31.6`. The smallest whole number is 32 (`80 + 10 log 32 ≈ 95.05` dB).","hints":["From 80 dB to 95 dB is 15 dB. How many steps of ×10 is that?","1.5 steps, so you need `N ≥ 10^{1.5} = 10 × √10 ≈ 31.6` machines.","`N` must be a whole number at least 31.6, so `N` = 32. (31 machines give about 94.9 dB, just short.)"]}]},{"id":"spot","type":"spot","title":"Spot the Error","summary":"Spot the Error","student":"Gabriel","how":"","goal":[3,4],"instruction":"Gabriel made one mistake in each solution. Tap the step where the \u003cstrong>first\u003c/strong> mistake happens, then choose the fix.","problems":[{"id":"e1","goal":3,"task":"How many times the amplitude of a magnitude 5.4 earthquake is the amplitude of a magnitude 7.4 earthquake?","steps":["The difference in magnitude is 7.4 − 5.4 = 2.","On the Richter scale, each step of 1 multiplies the amplitude by 10.","So the amplitude is 10 × 2 = 20 times as large.","The magnitude 7.4 quake has 20 times the amplitude of the magnitude 5.4 quake."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: `M = log(A/A_0)`, so +1 in `M` is ×10 in `A`.","","Step 4 repeats step 3’s number. The mistake is earlier."],"fixes":[{"t":"Two steps multiply by 10 twice: 10 × 10 = `10^2` = 100 times as large.","why":"Each step multiplies again, so the ratio is 10 to the power of the difference.","_n":"1k85a","_k":"5a73e74c"},{"t":"Divide the magnitudes: 7.4 ÷ 5.4 ≈ 1.4 times as large.","why":"Magnitudes are exponents. Subtract them; don’t divide them.","_n":"1l76a","_k":"5847451e"},{"t":"The difference is 2, so the amplitude is 2 times as large.","why":"That treats the magnitudes as if they were the amplitudes. A difference of 1 is already ×10.","_n":"1m77a","_k":"1cd7d5b6"},{"t":"Step 3 is correct as written.","why":"10 × 2 adds two tens. Two steps of ×10 multiply: 10 × 10 = 100.","_n":"1nf0b","_k":"af7b08e8"}],"hints":["What does a second step of ×10 do to the first ×10?","Steps multiply: 2 steps is 10 × 10.","Step 3 is wrong: `10^2` = 100, so the amplitude is 100 times as large."]},{"id":"e2","goal":4,"task":"Solution X has 50 times the [H⁺] of a solution with pH 6.0. Find the pH of solution X.","fig":"\u003cp class=\"uses\">\u003cstrong>Use these values\u003c/strong>`log 5 ≈ 0.699`\u003c/p>","steps":["The pH 6.0 solution has [H⁺] = `10^{-6}` mol/L.","Multiplying [H⁺] by 10 changes the pH by 1.","50 = 5 × 10, so ×50 changes the pH by `log 50 = log 5 + 1 ≈ 1.699`.","More hydrogen ions means a higher pH, so pH ≈ 6.0 + 1.699 ≈ 7.7.","Solution X has a pH of about 7.7, so it’s slightly basic."],"_a":"Vg==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: one step of ×10 is 1 pH unit.","Step 3 is correct: product law.","","Step 5 follows from step 4. The mistake is earlier."],"fixes":[{"t":"Step 4 is correct as written.","why":"Because of the minus sign in \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>, more hydrogen ions make a lower pH.","_n":"1oefb","_k":"425af47e"},{"t":"pH = 6.0 − 50 = −44.","why":"The pH changes by the log of the ratio, not by the ratio.","_n":"1pf2b","_k":"05b1b1f4"},{"t":"pH ≈ 6.0 + 0.699 ≈ 6.7.","why":"That uses `log 5` for ×50, and it still goes the wrong way.","_n":"1qf1b","_k":"95b60912"},{"t":"More hydrogen ions means a lower pH: pH ≈ 6.0 − 1.699 ≈ 4.3.","why":"\u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>, so when [H⁺] goes up, the pH goes down. X is more acidic than the pH 6.0 solution.","_n":"1rf4b","_k":"62bda60b"}],"hints":["Does adding hydrogen ions make a solution more acidic or less acidic?","More acidic means a lower pH.","Step 4 is wrong: pH ≈ 6.0 − 1.699 ≈ 4.3."]},{"id":"e3","goal":4,"task":"Two speakers each produce 95 dB at a seat. Find the level at the seat when both play.","fig":"\u003cp class=\"uses\">\u003cstrong>Use these values\u003c/strong>`log 2 ≈ 0.301`\u003c/p>","steps":["For one speaker, `95 = 10 log(I/I_0)`, so `I = 10^{9.5} I_0`.","With both speakers, the intensities add: the total is `2 × 10^{9.5} I_0`.","`L = 10 log(2 × 10^{9.5})` `= 10 × log 2 × log 10^{9.5}`.","`L ≈ 10 × 0.301 × 9.5` `≈ 28.6` dB."],"_a":"Vw==","stepFb":["Step 1 is correct. Keep checking the steps after it.","Step 2 is correct: intensities add.","","Step 4 does step 3’s arithmetic correctly. The mistake is earlier."],"fixes":[{"t":"`L = 10(log 2 + log 10^{9.5})` `≈ 10(0.301 + 9.5) ≈ 98` dB.","why":"Product law: the log of a product is the \u003cstrong>sum\u003c/strong> of the logs. Two speakers add about 3 dB.","_n":"1sf3b","_k":"25f3a305"},{"t":"`L = 95 + log 2 ≈ 95.3` dB.","why":"That forgets the 10: doubling adds `10 log 2 ≈ 3` dB.","_n":"1tf6b","_k":"dd3b166c"},{"t":"`L` = 95 + 95 = 190 dB.","why":"Levels don’t add; intensities do.","_n":"1uf5b","_k":"158b1162"},{"t":"Step 3 is correct as written.","why":"`log(xy) = log x + log y`, not `log x × log y`. Two speakers can’t be quieter than one.","_n":"1vf8b","_k":"140f15f8"}],"hints":["Check step 3 against the product law.","`log(2 × 10^{9.5}) = log 2 + log 10^{9.5}`.","Step 3 is wrong: `L = 10(0.301 + 9.5)` `≈ 98` dB."]}]}]},"reflect":{"journal":[{"id":"j1","q":"What surprised you when the ruler switched from linear to logarithmic in Explore?"},{"id":"j2","q":"In your own words, why does a difference on a log scale tell you a ratio of the real quantities? Use the words exponent and ratio."},{"id":"j3","q":"Explain to a friend how to work out, without a calculator, how many times as intense an 85 dB sound is as a 60 dB sound. (\u003cem>Use this value:\u003c/em> `√10 ≈ 3.16`.)"},{"id":"j4","q":"Which still trips you up: the direction of pH, the factor of 10 in decibels, or working backwards from a ratio? What will you do about it before module 43?"}]},"final":{"questions":[{"id":"k1","cat":"K","goal":2,"a":{"prompt":"A solution has [H⁺] = 0.0001 mol/L. What is its pH?","options":[{"t":"−4","why":"`log 0.0001 = -4`, but \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>. The minus sign makes it 4.","_n":"1wf7b","_k":"ed13f382"},{"t":"3","why":"0.0001 has three zeros after the point, but its 1 is in the fourth place: `10^{-4}`.","_n":"1x8ab","_k":"68994281"},{"t":"4","why":"0.0001 = `10^{-4}`, so pH = −log `10^{-4}` = −(−4) = 4.","_n":"1y8bb","_k":"e49b10b8"},{"t":"10 000","why":"10 000 is 1/[H⁺]. The pH is its log: `log 10 000 = 4`.","_n":"1z88b","_k":"6c26c9ae"}]},"b":{"prompt":"A solution has [H⁺] = 0.000 001 mol/L. What is its pH?","options":[{"t":"−6","why":"`log 0.000 001 = -6`, but \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>.","_n":"2089b","_k":"a2967148"},{"t":"5","why":"Its 1 is in the sixth decimal place: `10^{-6}`.","_n":"2186b","_k":"08b9669e"},{"t":"6","why":"0.000 001 = `10^{-6}`, so pH = −log `10^{-6}` = 6.","_n":"2287b","_k":"dd89211f"},{"t":"1 000 000","why":"That’s 1/[H⁺]. The pH is its log: 6.","_n":"2384b","_k":"b872c12e"}]}},{"id":"k2","cat":"K","goal":3,"a":{"prompt":"How many times the amplitude of a magnitude 5 earthquake is the amplitude of a magnitude 7 earthquake?","options":[{"t":"1.4","why":"That’s 7 ÷ 5. Magnitudes are exponents: subtract them, then raise 10 to the difference.","_n":"2485b","_k":"5cfaf2e0"},{"t":"2","why":"2 is the difference in magnitude. Each unit of difference is a factor of 10.","_n":"2582b","_k":"725ae0de"},{"t":"20","why":"That’s 10 × 2. Steps multiply: 10 × 10 = 100.","_n":"2683b","_k":"0f8514dc"},{"t":"100","why":"The difference is 2 steps, and each step is ×10: `10^2` = 100.","_n":"270ca","_k":"fc2637d3"}]},"b":{"prompt":"How many times the amplitude of a magnitude 5 earthquake is the amplitude of a magnitude 8 earthquake?","options":[{"t":"1.6","why":"That’s 8 ÷ 5. Subtract the magnitudes instead.","_n":"280ba","_k":"6f36054a"},{"t":"3","why":"3 is the difference. Each unit is a factor of 10.","_n":"290aa","_k":"47307bec"},{"t":"30","why":"That’s 10 × 3. Steps multiply: 10 × 10 × 10.","_n":"2a09a","_k":"cf3e0eac"},{"t":"1000","why":"3 steps of ×10: `10^3` = 1000.","_n":"2b08a","_k":"a68e43bd"}]}},{"id":"k3","cat":"K","goal":2,"a":{"prompt":"Sound level is `L = 10 log(I/I_0)`, with `I_0 = 10^{-12}` W/m². A sound has intensity `10^{-4}` W/m². What is its level?","options":[{"t":"80 dB","why":"`I/I_0 = 10^{-4} ÷ 10^{-12} = 10^8`, and `10 log 10^8` = 10 × 8 = 80 dB.","_n":"2c07a","_k":"91e09cb3"},{"t":"−40 dB","why":"That’s `10 log 10^{-4}`, without dividing by `I_0` first.","_n":"2d06a","_k":"6488e0f2"},{"t":"8 dB","why":"`log 10^8 = 8` is right so far, but the decibel formula multiplies by 10.","_n":"2e05a","_k":"b151d754"},{"t":"−160 dB","why":"That uses −4 − 12 = −16 as the exponent. Dividing by `10^{-12}` subtracts a negative exponent, which adds: −4 − (−12) = 8.","_n":"2f04a","_k":"58674162"}]},"b":{"prompt":"Sound level is `L = 10 log(I/I_0)`, with `I_0 = 10^{-12}` W/m². A sound has intensity `10^{-5}` W/m². What is its level?","options":[{"t":"7 dB","why":"`log 10^7 = 7`, but the formula multiplies by 10.","_n":"2g03a","_k":"bc2be8c0"},{"t":"−50 dB","why":"That’s `10 log 10^{-5}`, without dividing by `I_0`.","_n":"2h86a","_k":"a726fc6e"},{"t":"−170 dB","why":"That uses −5 − 12 = −17 as the exponent. Dividing by `10^{-12}` subtracts a negative exponent, which adds: −5 − (−12) = 7.","_n":"2i87a","_k":"229e1686"},{"t":"70 dB","why":"`I/I_0 = 10^7`, and `10 log 10^7` = 70 dB.","_n":"2j88a","_k":"a03597ad"}]}},{"id":"t1","cat":"T","goal":3,"a":{"prompt":"Solution P has pH 3.0 and solution Q has pH 5.5. Which statement is true?","use":"`√10 ≈ 3.16`","options":[{"t":"Q’s [H⁺] is about 316 times P’s.","why":"The size is right, but the direction isn’t. A lower pH means more hydrogen ions, so P has more.","_n":"2k89a","_k":"09535472"},{"t":"P’s [H⁺] is about 316 times Q’s.","why":"The pH values differ by 2.5. The lower pH has more hydrogen ions, and `10^{2.5} = 100 × √10 ≈ 316`.","_n":"2l82a","_k":"42883851"},{"t":"P’s [H⁺] is about 25 times Q’s.","why":"That’s 10 × 2.5. A difference of 2.5 means `10^{2.5} ≈ 316`.","_n":"2m83a","_k":"c41c5446"},{"t":"P’s [H⁺] is about 500 times Q’s.","why":"That uses `10^{0.5}` = 5. Half a step is `√10 ≈ 3.16`, so `10^{2.5} ≈ 316`.","_n":"2n84a","_k":"bdf75582"}]},"b":{"prompt":"Solution P has pH 4.0 and solution Q has pH 7.5. Which statement is true?","use":"`√10 ≈ 3.16`","options":[{"t":"P’s [H⁺] is about 5000 times Q’s.","why":"That uses `10^{0.5}` = 5. Half a step is about 3.16.","_n":"2o85a","_k":"f9d790ea"},{"t":"P’s [H⁺] is about 35 times Q’s.","why":"That’s 10 × 3.5. The ratio is `10^{3.5}`.","_n":"2p7ea","_k":"5ef43288"},{"t":"P’s [H⁺] is about 3160 times Q’s.","why":"A difference of 3.5: `10^{3.5} = 1000 × √10 ≈ 3160`, and the lower pH has more hydrogen ions.","_n":"2q7fa","_k":"bea7b3a9"},{"t":"Q’s [H⁺] is about 3160 times P’s.","why":"Right size, wrong direction: P, with the lower pH, has more hydrogen ions.","_n":"2rfbe","_k":"fd091ffa"}]}},{"id":"t2","cat":"T","goal":4,"a":{"prompt":"A lawn mower makes 90 dB. How many identical mowers, running together, would make 100 dB?","options":[{"t":"8","why":"Three doublings add about 3 × 3 = 9 dB, so 8 mowers make about 99 dB: just short. 10 dB needs ×10.","_n":"2sfce","_k":"939ed85e"},{"t":"`10^{10}`","why":"That uses the whole 10 dB as the exponent. On the decibel scale ×10 is 10 dB: the ratio is `10^{10 ÷ 10}` = 10.","_n":"2tfde","_k":"1cf952ea"},{"t":"2","why":"Doubling the intensity adds only `10 log 2 ≈ 3` dB, not 10 dB. Two mowers make about 93 dB.","_n":"2ufee","_k":"2a307916"},{"t":"10","why":"100 − 90 = 10 dB is one step of ×10 in intensity. Intensities add, so you need 10 mowers.","_n":"2vf7e","_k":"29114414"}]},"b":{"prompt":"A fan makes 50 dB. How many identical fans, running together, would make 70 dB?","options":[{"t":"64","why":"Six doublings add about 6 × 3 = 18 dB, so 64 fans make about 68 dB: short. 20 dB needs ×100.","_n":"2wf8e","_k":"30079bd1"},{"t":"4","why":"If each doubling added 10 dB, 4 fans would be enough. A doubling adds only about 3 dB: 4 fans make about 56 dB.","_n":"2xf9e","_k":"b431fa87"},{"t":"100","why":"70 − 50 = 20 dB is two steps of ×10: `10^2` = 100 fans.","_n":"2yfae","_k":"e0697379"},{"t":"`10^{20}`","why":"That uses 20 dB as the exponent. The ratio is `10^{20 ÷ 10}` = 100.","_n":"2zf3e","_k":"2f8797ef"}]}},{"id":"t3","cat":"T","goal":5,"a":{"prompt":"Astronomers measure star brightness with \u003cstrong>apparent magnitude\u003c/strong>. A difference of 5 magnitudes means exactly 100 times the brightness, and a \u003cstrong>smaller\u003c/strong> magnitude means a \u003cstrong>brighter\u003c/strong> star. Star P has magnitude 1 and star Q has magnitude 11. Which statement is true?","options":[{"t":"P is `10^{10}` times as bright as Q.","why":"That treats each magnitude as ×10, like the Richter scale. On this scale 5 magnitudes make ×100.","_n":"30f4e","_k":"f1d10201"},{"t":"Q is 10 000 times as bright as P.","why":"Right size, wrong direction: on this scale a smaller magnitude is brighter. Like pH, it runs backwards.","_n":"3101f","_k":"ebbd9306"},{"t":"P is 10 000 times as bright as Q.","why":"11 − 1 = 10 magnitudes, which is two groups of 5. Each group is ×100, so 100 × 100 = 10 000. The smaller magnitude, P, is the brighter star.","_n":"3200f","_k":"4dba6bcf"},{"t":"P is 200 times as bright as Q.","why":"Two groups of 5 multiply: 100 × 100, not 100 × 2.","_n":"33fff","_k":"420982a1"}]},"b":{"prompt":"Astronomers measure star brightness with \u003cstrong>apparent magnitude\u003c/strong>. A difference of 5 magnitudes means exactly 100 times the brightness, and a \u003cstrong>smaller\u003c/strong> magnitude means a \u003cstrong>brighter\u003c/strong> star. Star P has magnitude 2 and star Q has magnitude 17. Which statement is true?","options":[{"t":"P is 1 000 000 times as bright as Q.","why":"17 − 2 = 15 magnitudes, three groups of 5: `100^3` = 1 000 000. P has the smaller magnitude, so it’s brighter.","_n":"34fef","_k":"a131311e"},{"t":"P is 300 times as bright as Q.","why":"Three groups of 5 multiply: 100 × 100 × 100.","_n":"35fdf","_k":"a138eb25"},{"t":"P is `10^{15}` times as bright as Q.","why":"That treats each magnitude as ×10. Here 5 magnitudes make ×100.","_n":"36fcf","_k":"374242e5"},{"t":"Q is 1 000 000 times as bright as P.","why":"Right size, wrong direction: a smaller magnitude is brighter.","_n":"37fbf","_k":"75f522f1"}]}},{"id":"c1","cat":"C","goal":1,"a":{"prompt":"Which is the best explanation of why earthquakes are measured on a logarithmic scale?","options":[{"t":"Earthquake amplitudes range from tiny to billions of times larger. Each step of 1 in magnitude multiplies the amplitude by 10, so that whole range fits on a scale of about 0 to 9.","why":"This names the huge range, what one step means, and why it helps.","_n":"38faf","_k":"5659185e"},{"t":"The magnitude counts how many times the amplitude has been multiplied by 10. So it must be a whole number, and no earthquake can have a magnitude between 6 and 7, such as 6.4.","why":"Magnitudes like 6.4 are common: `M = log(A/A_0)` can be any real number. A magnitude 6.4 quake has an amplitude between `10^6 A_0` and `10^7 A_0`.","_n":"39f9f","_k":"7f85e0e8"},{"t":"Earthquake amplitudes grow steadily from small quakes to large ones. Each step of 1 in magnitude adds the same amount of amplitude, so equal steps mean equal increases in shaking.","why":"That describes a linear scale. On the Richter scale each step multiplies the amplitude by 10.","_n":"3af8f","_k":"2f01a03d"},{"t":"Large earthquakes are alarming to report. Taking the logarithm makes their amplitudes smaller, so the scale turns a dangerous quake into a less powerful one with a small number.","why":"A logarithm changes the numbers we write down, not the earthquake. A magnitude 8 quake still has 1000 times the amplitude of a magnitude 5.","_n":"3b67f","_k":"54db450d"}]},"b":{"prompt":"Which is the best explanation of why sound levels are measured in decibels, a logarithmic scale?","options":[{"t":"Sound intensities people hear range from `10^{-12}` W/m² to about 1 W/m², a factor of `10^{12}`. Each 10 dB multiplies the intensity by 10, so that range fits on a scale of 0 to about 120 dB.","why":"This names the huge range, what each 10 dB means, and why it helps.","_n":"3c68f","_k":"f8db162c"},{"t":"Loud sounds are alarming to report. Taking the logarithm makes their intensities smaller, so the scale turns a dangerous sound into a less intense one with a small number.","why":"The scale changes the numbers we write down, not the sound. A 100 dB sound is just as intense whatever scale you use.","_n":"3d65f","_k":"8abc4501"},{"t":"Sound intensities grow steadily from quiet sounds to loud ones. Each decibel adds the same amount of intensity, so a sound with twice the decibels has twice the intensity.","why":"That describes a linear scale. 20 dB more is 100 times the intensity, not twice.","_n":"3e66f","_k":"1fa95147"},{"t":"The level counts how many times the intensity has been multiplied by 10, in steps of 10 dB. So it must be a multiple of 10, and no sound can have a level between 60 and 70 dB, such as 63 dB.","why":"Levels like 63 dB are common: `L = 10 log(I/I_0)` can be any real number. A 63 dB sound has about twice the intensity of a 60 dB sound.","_n":"3f6bf","_k":"7c57cf78"}]}},{"id":"c2","cat":"C","goal":2,"a":{"prompt":"A solution has pH 3.2. Which statement about its hydrogen ion concentration is written correctly?","options":[{"t":"[H⁺] = `10^{-3.2}` mol/L","why":"From \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>: log[H⁺] = −3.2, so [H⁺] = `10^{-3.2}` mol/L, about `6.3 × 10^{-4}` mol/L.","_n":"3g6cf","_k":"1c92aec7"},{"t":"[H⁺] = `-10^{3.2}` mol/L","why":"A concentration can’t be negative. The minus belongs in the exponent.","_n":"3h69f","_k":"fe114569"},{"t":"[H⁺] = `10^{3.2}` mol/L","why":"That drops the minus sign. `10^{3.2} ≈ 1585` mol/L would be impossibly concentrated.","_n":"3i6af","_k":"1e23bae0"},{"t":"[H⁺] = `log(-3.2)` mol/L","why":"To undo a log, raise 10 to the power; don’t take another log. And `log(-3.2)` doesn’t exist.","_n":"3j6ff","_k":"8f045e48"}]},"b":{"prompt":"A solution has pH 8.4. Which statement about its hydrogen ion concentration is written correctly?","options":[{"t":"[H⁺] = `log(-8.4)` mol/L","why":"To undo a log, raise 10 to the power; don’t take another log. And `log(-8.4)` doesn’t exist.","_n":"3k70f","_k":"bb2fb25c"},{"t":"[H⁺] = `10^{8.4}` mol/L","why":"That drops the minus sign. `10^{8.4} ≈ 2.5 × 10^8` mol/L would be impossibly concentrated.","_n":"3l6df","_k":"624675cc"},{"t":"[H⁺] = `-10^{8.4}` mol/L","why":"A concentration can’t be negative. The minus belongs in the exponent.","_n":"3m6cf","_k":"7c4eb36e"},{"t":"[H⁺] = `10^{-8.4}` mol/L","why":"From \u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>: log[H⁺] = −8.4, so [H⁺] = `10^{-8.4}` mol/L, about `4.0 × 10^{-9}` mol/L.","_n":"3n6ff","_k":"439b223f"}]}},{"id":"a1","cat":"A","goal":5,"a":{"prompt":"Seismologists estimate that each step of 1 in magnitude multiplies the \u003cstrong>energy\u003c/strong> an earthquake releases by `10^{1.5}` (about 32). About how many times as much energy does a magnitude 7.0 quake release as a magnitude 5.0 quake?","options":[{"t":"3","why":"That’s 1.5 × 2, the exponent. The ratio is `10^3` = 1000.","_n":"3o6ef","_k":"0ee55aa2"},{"t":"64","why":"That’s 32 × 2. Two steps multiply by 32 twice: 32 × 32 ≈ 1000.","_n":"3p69f","_k":"8c1ac4b1"},{"t":"100","why":"100 is the ratio of the \u003cstrong>amplitudes\u003c/strong>. Energy grows faster: `10^{1.5}` per step.","_n":"3q68f","_k":"a8ff953d"},{"t":"1000","why":"Two steps multiply by `10^{1.5}` twice: `(10^{1.5})^2 = 10^3` = 1000. Check: 32 × 32 = 1024, about 1000.","_n":"3r6bf","_k":"4dd1844f"}]},"b":{"prompt":"Seismologists estimate that each step of 1 in magnitude multiplies the \u003cstrong>energy\u003c/strong> an earthquake releases by `10^{1.5}` (about 32). About how many times as much energy does a magnitude 8.0 quake release as a magnitude 4.0 quake?","options":[{"t":"6","why":"That’s 1.5 × 4, the exponent. The ratio is `10^6`.","_n":"3s6af","_k":"d1b80fca"},{"t":"128","why":"That’s 32 × 4. Four steps multiply by 32 four times.","_n":"3t75f","_k":"a226ecb2"},{"t":"10 000","why":"10 000 is the ratio of the amplitudes. Energy grows by `10^{1.5}` per step.","_n":"3u74f","_k":"2b37a3da"},{"t":"1 000 000","why":"Four steps: `(10^{1.5})^4 = 10^6`. Check: `32^4` = 1 048 576, about a million.","_n":"3v63e","_k":"577d78c7"}]}},{"id":"a2","cat":"A","goal":4,"a":{"prompt":"Normal rain has a pH of about 5.6. A sample of acid rain has 50 times the [H⁺] of normal rain. What is its pH, to 1 decimal place?","use":"`log 5 ≈ 0.699`","options":[{"t":"−44.4","why":"That subtracts the ratio itself. The pH changes by the log of the ratio.","_n":"3w64e","_k":"ab6cb43a"},{"t":"3.9","why":"×50 changes the pH by `log 50 = log 5 + log 10 ≈ 1.699`. More hydrogen ions means a lower pH: 5.6 − 1.699 ≈ 3.9.","_n":"3x65e","_k":"66a7e1a7"},{"t":"4.9","why":"That subtracts `log 5 ≈ 0.699`, the change for ×5. ×50 is ×5 and ×10: 1.699.","_n":"3y66e","_k":"f79a524e"},{"t":"7.3","why":"That adds. More hydrogen ions means a lower pH.","_n":"3z67e","_k":"216c8ea4"}]},"b":{"prompt":"A stream had a pH of 6.5. After a spill, its [H⁺] is 20 times as large. What is its new pH, to 1 decimal place?","use":"`log 2 ≈ 0.301`","options":[{"t":"−13.5","why":"That subtracts the ratio itself.","_n":"4068e","_k":"a24a3768"},{"t":"5.2","why":"×20 changes the pH by `log 20 = log 2 + 1 ≈ 1.301`, and more hydrogen ions means a lower pH: 6.5 − 1.301 ≈ 5.2.","_n":"4169e","_k":"2072530f"},{"t":"6.2","why":"That subtracts `log 2`, the change for ×2. ×20 is ×2 and ×10: 1.301.","_n":"426ae","_k":"3d536ec3"},{"t":"7.8","why":"That adds. More hydrogen ions means a lower pH.","_n":"436be","_k":"fd2d0cd9"}]}}]},"task":{"title":"Loud but safe","summary":"Loud but safe","statement":"\u003cp>You’re setting up the sound for a concert. The room must be loud, at least 100 dB, but the crew wears earplugs, and the level at their ears must be safe (at most 85 dB) and still clear (at least 75 dB). Choose the number of speaker stacks, the level of one stack, and the earplugs. There are many designs. Can you find a \u003cstrong>lean\u003c/strong> one, with no stack you could remove, for every stack level that works?\u003c/p>","checks":["More than one stack","The room is loud: at least 100 dB","Safe at the ear: at most 85 dB with earplugs in","Clear at the ear: at least 75 dB"],"bonus":"Lean (bonus): removing a stack would break line 1 or line 2","tips":["One stack isn’t a concert rig. Use at least 2.","The room is about {T} dB. Doubling the stacks adds only about 3 dB; ten times the stacks adds 10 dB. With {S} dB stacks you need at least {need} of them.","The crew hears about {E} dB, more than 85. Each earplug class cuts 10 dB (one step of ÷10 in intensity). Try stronger earplugs.","The crew hears only about {E} dB, under 75. Your earplugs are stronger than they need to be: try the next lighter class."],"tipLow":"With {S} dB stacks, even 16 of them give only about {T16} dB. Choose louder stacks.","tipHeavy":"Even Heavy earplugs leave {E} dB. Use fewer or quieter stacks.","explainPrompt":"Explain why adding one more stack raised the room level by only a few decibels, and how you chose the earplugs.","vocab":"Use the words intensity, ratio, decibel and logarithm.","success":"Your design works.","more":"There’s more than one answer. Can you find another?","leanAll":"To reach 100 dB you need \u003cspan class=\"m\">10\u003csup>(100 − \u003ci>S\u003c/i>)/10\u003c/sup>\u003c/span> times one stack’s intensity: exactly 10 stacks at 90 dB, about 3.16 (so 4) at 95 dB, and 1 or fewer at 100 and 105 dB, where the two-stack minimum decides. Each earplug class always removes exactly 10 dB, because ÷10 in intensity is one step on the scale."},"cards":[["Logarithmic scale","A scale that records the exponent instead of the size. Equal gaps mean equal ratios: 1 magnitude, 1 pH unit or 10 dB is a factor of 10 in the quantity."],["pH","\u003cspan class=\"m\">pH = −log[H⁺]\u003c/span>, with [H⁺] in mol/L. Pure water has [H⁺] = `10^{-7}` mol/L, so pH 7. A lower pH is more acidic."],["From pH back to [H⁺]","[H⁺] = \u003cspan class=\"m\">10\u003csup>−pH\u003c/sup>\u003c/span>. For pH 3.5: [H⁺] = `10^{-3.5} ≈ 3.16 × 10^{-4}` mol/L."],["Decibels","`L = 10 log(I/I_0)`, with `I_0 = 10^{-12}` W/m². Every 10 dB is ×10 intensity. 60 dB means `I = 10^{-6}` W/m²."],["Richter magnitude","`M = log(A/A_0)`, where `A` is the amplitude of the seismograph trace. Each step of 1 is ×10 amplitude."],["Comparing two values","Ratio = \u003cspan class=\"m\">10\u003csup>difference\u003c/sup>\u003c/span> for pH and magnitude; \u003cspan class=\"m\">10\u003csup>difference ÷ 10\u003c/sup>\u003c/span> for decibels. Magnitude 7 vs 4: `10^3` = 1000 times the amplitude."],["pH runs backwards","10 times the [H⁺] is 1 pH unit \u003cstrong>lower\u003c/strong>. pH 3 has 100 times the [H⁺] of pH 5."],["Half a step","`10^{0.5} = √10 ≈ 3.16`, not 5. pH 4.5 has about 3.16 times the [H⁺] of pH 5."],["Working backwards","Change on the scale = log(ratio), or 10 log(ratio) in decibels. ×2: +0.301 in magnitude, or about +3 dB. ×1000: +3, or +30 dB."],["Combining identical sounds","Intensities add, so `N` equal sounds are `10 log N` dB louder than one. Two 60 dB sounds make about 63 dB, not 120 dB."],["Why the reference cancels","`L_2 - L_1 = 10 log(I_2/I_0) - 10 log(I_1/I_0) = 10 log(I_2/I_1)`. You can compare without knowing `I_0` (or `A_0`)."],["Zero and negative values","0 is the reference: 0 dB means `I = I_0`, not silence. −10 dB means `I_0`/10. Magnitudes can be negative too."]]}};</script>
